  - 그것은 …가 될 것이다
  lexicon: HALOT
  rationale: 여성 단수 암시 대상인 예루살렘을 2인칭으로 자연스럽게 살리되, 예언적 선언의 미래성을 유지했습니다.
- source_word: חֶרְפָּה וּגְדוּפָה
  english_pob_choice: a reproach and a taunt
  chosen_korean: 수치와 조롱거리가
  alternatives_korean:
  - 수치와 조롱
  - 치욕과 비웃음거리
  lexicon: HALOT
  rationale: חֶרְפָּה와 גְדוּפָה의 공개적 모욕과 조롱의 중첩을 살리기 위해 한국어에서는 명사구로 압축해 표현했습니다.
- source_word: מוּסָר
  english_pob_choice: a warning
  chosen_korean: 경고
  alternatives_korean:
  - 훈계
  - 교훈
  - 징계
  lexicon: HALOT
  rationale: 이 문맥에서는 교육적 ‘가르침’보다 열방이 보고 경계하게 되는 ‘경고’의 기능이 더 직접적입니다.
- source_word: מְשַׁמָּה
  english_pob_choice: a horror
  chosen_korean: 공포
  alternatives_korean:
  - 경악
  - 황폐
  - 놀람
  lexicon: HALOT
  rationale: 열방이 예루살렘을 보고 느끼는 충격과 두려움의 반응을 함께 살리기 위해 ‘공포’로 옮겼습니다.
- source_word: בְּאַף וּבְחֵמָה וּבְתוֹכְחוֹת חֵמָה
  english_pob_choice: in anger and in wrath and with wrathful rebukes
  chosen_korean: 진노와 분노와 분노의 책망으로
  alternatives_korean:
  - 노와 격분과 격한 책망으로
  - 진노와 분노와 책망으로
  lexicon: HALOT
  rationale: אַף와 חֵמָה의 강도를 각각 살리고, תוֹכְחוֹת חֵמָה의 ‘책망’ 의미를 유지하되 한국어에서 자연스럽게 반복 강세를 주었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project glossary
  rationale: 프로젝트 기본어인 신명사 표기를 따라 יְהוָה를 ‘야훼’로 일관되게 옮겼습니다.
theological_decisions:
- issue: 예루살렘을 향한 심판의 결과를 어떻게 드러낼지
  chosen_reading: 예루살렘이 열방 앞에서 ‘수치·조롱·경고·공포’가 되도록 옮겼습니다.
  alternative_readings:
  - 예루살렘이 단순히 ‘황폐함’이 되도록 옮김
  - ‘교훈’으로 완화하여 옮김
  rationale: 본문은 단순한 도시 파괴보다 열방이 그것을 보고 이해하게 될 징계의 공적 의미를 강조하므로, 그 효과를 함께 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
- issue: 야훼의 선언 종결 방식
  chosen_reading: ‘나 야훼가 말하였습니다’로 종결했습니다.
  alternative_readings:
  - ‘나는 야훼입니다. 내가 말하였습니다’
  - ‘야훼가 말하였습니다’
  rationale: 히브리어의 ‘I am YHWH; I have spoken’ 구조를 유지하면서도 한국어에서 자연스럽고 엄숙한 예언 종결로 들리게 했습니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה YHWH → 야훼
