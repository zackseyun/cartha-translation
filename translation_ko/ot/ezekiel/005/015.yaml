theological_decisions:
- issue: 예루살렘을 향한 심판의 결과를 어떻게 드러낼지
  chosen_reading: 예루살렘이 열방 앞에서 ‘수치·조롱·경고·공포’가 되도록 옮겼습니다.
  alternative_readings:
  - 예루살렘이 단순히 ‘황폐함’이 되도록 옮김
  - ‘교훈’으로 완화하여 옮김
  rationale: 본문은 단순한 도시 파괴보다 열방이 그것을 보고 이해하게 될 징계의 공적 의미를 강조하므로, 그 효과를 함께 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
- issue: 야훼의 선언 종결 방식
  chosen_reading: ‘나 야훼가 말하였습니다’로 종결했습니다.
  alternative_readings:
  - ‘나는 야훼입니다. 내가 말하였습니다’
  - ‘야훼가 말하였습니다’
  rationale: 히브리어의 ‘I am YHWH; I have spoken’ 구조를 유지하면서도 한국어에서 자연스럽고 엄숙한 예언 종결로 들리게 했습니다.
