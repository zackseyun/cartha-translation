  text: שְׁלִשִׁתֵ֞/יךְ בַּ/דֶּ֣בֶר יָמ֗וּתוּ וּ/בָֽ/רָעָב֙ יִכְל֣וּ בְ/תוֹכֵ֔/ךְ וְ/הַ֨/שְּׁלִשִׁ֔ית בַּ/חֶ֖רֶב יִפְּל֣וּ סְבִיבוֹתָ֑יִ/ךְ וְ/הַ/שְּׁלִישִׁית֙ לְ/כָל ר֣וּחַ אֱזָרֶ֔ה וְ/חֶ֖רֶב אָרִ֥יק אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/012.yaml
  text: A third of you will die by pestilence and be consumed by famine in your midst[a], and a third will fall by the sword all around you, and a third I will scatter to every wind[b], and I will draw out a sword after them.
  footnotes:
  - marker: a
    text: Hebrew 'to every wind,' an idiom meaning in every direction.
    reason: cultural_note
  - marker: b
    text: Or 'I will unsheathe a sword after them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너의 삼분의 일은 네 한가운데에서 역병으로 죽고 기근으로 소멸될 것이며, 또 삼분의 일은 네 사방에서 칼에 쓰러질 것이고, 또 삼분의 일은 내가 모든 바람을 향해 흩겠다[a]. 내가 그들 뒤를 따라 칼을 빼어 들겠다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘모든 바람을 향해’는 사방으로 흩어진다는 관용적 표현입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그들 뒤에 칼을 뽑아 들겠다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלִשִׁתֵיךְ / הַשְּׁלִשִׁית / הַשְּׁלִישִׁית
  english_pob_choice: a third
  chosen_korean: 한 셋째
  alternatives_korean:
  - 한 삼분의 일
  - 삼분의 일
  lexicon: HALOT
  rationale: 반복되는 분수 표현을 한국어에서도 동일하게 살리되, 예언적 문맥의 분배 감각을 유지하기 위해 간결한 ‘한 셋째’를 택했습니다.
- source_word: דֶּבֶר
  english_pob_choice: pestilence
  chosen_korean: 역병
  alternatives_korean:
  - 전염병
  - 재앙
  lexicon: HALOT
  rationale: 심판 문맥의 דֶּבֶר는 단순한 질병보다 재앙적 감염병의 뉘앙스가 강하므로, 예언서에서 자연스러운 ‘역병’이 더 가깝습니다.
- source_word: יִכְלוּ
  english_pob_choice: be consumed
  chosen_korean: 소멸되며
  alternatives_korean:
  - 다 소진되며
  - 멸망하며
  lexicon: HALOT
  rationale: 기근과 결합된 ‘소멸’은 단순한 종료가 아니라 먹을 것이 없어 완전히 사라지는 심판의 강도를 비교적 정확히 전합니다.
- source_word: בְּתוֹכֵךְ
  english_pob_choice: in your midst
  chosen_korean: 너희 가운데에서
  alternatives_korean:
  - 너희 안에서
  - 너희 한복판에서
  lexicon: HALOT
  rationale: 도시를 의인화한 2인칭 여성 단수의 직접성을 한국어에서는 복수 호칭과 함께 자연스럽게 풀어 ‘너희 가운데에서’로 옮겼습니다.
- source_word: לְכָל רוּחַ
  english_pob_choice: to every wind
  chosen_korean: 모든 바람으로
  alternatives_korean:
  - 사방으로
  - 모든 방향으로
  lexicon: HALOT
  rationale: 문자적 이미지를 유지해야 하는 관용구이므로, 영어 POB의 직역을 따라 ‘모든 바람으로’로 옮기고 흩어짐의 방향성을 살렸습니다.
- source_word: אָרִיק אַחֲרֵיהֶם
  english_pob_choice: I will draw out a sword after them
  chosen_korean: 그들 뒤를 따라 칼을 빼내겠습니다
  alternatives_korean:
  - 그들을 뒤쫓아 칼을 뽑겠습니다
  - 그들 뒤에 칼을 빼겠습니다
  lexicon: HALOT
  rationale: אָרִיק은 ‘빼내다/뽑다’의 동사이므로, 칼과 함께 쓰일 때 관용적으로 ‘칼을 빼내다’로 옮겨 추격의 이미지를 살렸습니다.
theological_decisions:
- issue: 예언적 심판의 구체적 이미지 유지
  chosen_reading: ‘역병’, ‘칼’, ‘모든 바람’ 같은 구체적 이미지를 유지하고 추상화하지 않았습니다.
  alternative_readings:
  - ‘질병’, ‘전쟁’, ‘사방으로’처럼 의미만 풀어 쓰기
  rationale: 본문의 예언적 수사와 심판의 가시성을 보존하는 것이 원문의 의도를 더 잘 드러내므로, 이미지의 날카로움을 약화시키지 않았습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
- issue: 직접 수신자와 인칭 처리
  chosen_reading: 히브리어의 여성 단수 2인칭을 한국어에서는 도시를 향한 집합적 직접 خطاب으로 처리해 ‘너희’로 옮겼습니다.
  alternative_readings:
  - ‘너’로 일관해 도성을 단수로 처리하기
  - ‘예루살렘’이라고 명시하기
  rationale: 문맥상 예루살렘을 가리키지만, 본절 자체에 도시 이름이 없으므로 서술의 직접성을 유지하면서도 한국어 독자에게 자연스러운 집합 호칭을 선택했습니다.
  doctrine_reference: Prophetic personification and discourse clarity
