  text: וּ/מֵ/הֶם֙ ע֣וֹד תִּקָּ֔ח וְ/הִשְׁלַכְתָּ֤ אוֹתָ/ם֙ אֶל תּ֣וֹךְ הָ/אֵ֔שׁ וְ/שָׂרַפְתָּ֥ אֹתָ֖/ם בָּ/אֵ֑שׁ מִמֶּ֥/נּוּ תֵצֵא אֵ֖שׁ אֶל כָּל בֵּ֥ית יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/004.yaml
  text: And from them you shall take some more[a], and throw them into the midst of the fire and burn them in the fire. From it a fire will go out to all the house of Israel.
  footnotes:
  - marker: a
    text: Or, 'From there fire will go out,' with the singular suffix likely referring to the fire just mentioned; some understand, less likely, 'From them fire will go out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 가운데서도 다시 조금을 더 취하여 불 가운데 던지고 불 속에서 사르십시오. 거기서 불이 나와 이스라엘 온 집에 이를 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִמֶּנּוּ는 단수형으로, 바로 앞의 ‘불’을 가리키는 것으로 보는 것이 가장 자연스럽습니다. 다만 문맥상 불이 그 행위로부터, 혹은 그 남은 것들로부터 나온다고 이해하는 해석도 가능합니다.
    reason: source_note
lexical_decisions:
- source_word: וּמֵהֶם עוֹד תִּקָּח
  english_pob_choice: And from them you shall take some more
  chosen_korean: 그들 가운데서도 다시 조금을 더 취하십시오
  alternatives_korean:
  - 그들 가운데서 다시 더 취하십시오
  - 그들 중에서 또 조금을 취하십시오
  lexicon: HALOT
  rationale: מִן+대명사는 ‘~중에서/~가운데서’의 부분적 의미를 가지며, עוֹד는 추가분을 나타내므로 자연스럽게 ‘다시 조금을 더’로 옮겼습니다.
- source_word: וְהִשְׁלַכְתָּ אוֹתָם אֶל תּוֹךְ הָאֵשׁ
  english_pob_choice: and throw them into the midst of the fire
  chosen_korean: 불 가운데 던지고
  alternatives_korean:
  - 불 속으로 던지고
  - 불의 한가운데로 던지고
  lexicon: HALOT
  rationale: תּוֹךְ은 ‘가운데/한복판’의 뜻이므로 ‘불 가운데’로 살렸고, 히브리어의 연속 동작을 한국어에서는 간결하게 연결했습니다.
- source_word: וְשָׂרַפְתָּ אֹתָם בָּאֵשׁ
  english_pob_choice: and burn them in the fire
  chosen_korean: 불 속에서 사르십시오
  alternatives_korean:
  - 불로 사르십시오
  - 불 가운데서 태우십시오
  lexicon: HALOT
  rationale: שָׂרַף는 단순히 ‘태우다’보다 강한 ‘사르다’가 더 직접적이며, בָּאֵשׁ는 수단보다 장면을 강조하므로 ‘불 속에서’로 옮겼습니다.
- source_word: מִמֶּנּוּ תֵצֵא אֵשׁ
  english_pob_choice: From it a fire will go out
  chosen_korean: 거기서 불이 나와
  alternatives_korean:
  - 그로부터 불이 나와
  - 그 불에서 불이 나와
  lexicon: HALOT
  rationale: מִמֶּנּוּ의 남성 단수 지시를 한국어에서는 앞선 ‘불’에 자연스럽게 연결되는 ‘거기서’로 처리해, 원문의 지시 대상을 과잉 특정하지 않았습니다.
- source_word: אֶל כָּל בֵּית יִשְׂרָאֵל
  english_pob_choice: to all the house of Israel
  chosen_korean: 이스라엘 온 집에
  alternatives_korean:
  - 이스라엘 온 집을 향해
  - 이스라엘의 온 집에
  lexicon: HALOT
  rationale: בֵּית יִשְׂרָאֵל은 관용적으로 ‘이스라엘 온 집’이 가장 직접적이며, אֶל은 여기서 도달 방향을 나타내므로 ‘~에 이를 것입니다’와 함께 살렸습니다.
theological_decisions:
- issue: 불이 어디에서 나오는가에 대한 지시 대상
  chosen_reading: 본문의 이미지는 앞선 심판 행위에서 불이 다시 나와 이스라엘 온 집으로 번지는 장면을 그대로 유지합니다.
  alternative_readings:
  - 불은 남은 머리카락 자체에서 나온다
  - 불은 단지 상징적 심판을 뜻할 뿐 실제 발화 지점을 말하지 않는다
  rationale: 히브리어의 מִמֶּנּוּ는 가장 가까운 선행 지시를 따라 불에 연결될 수 있지만, 본문은 그 기계적 설명보다 심판의 확산 이미지를 강조하므로 그 긴장을 보존했습니다.
  doctrine_reference: 의미의 긴장을 해소하지 않고 유지함
- issue: 명령형의 한국어 높임
  chosen_reading: 선지자에게 주어지는 신탁-행동 지시로서 합쇼체 명령을 사용했습니다.
  alternative_readings:
  - 직설법 미래
  - 명령형 반말
  rationale: 히브리어 미완료형 연속은 예언적 지시의 성격이 강하므로 한국어에서는 공손한 명령형으로 옮겨 행위 명령의 힘을 살렸습니다.
  doctrine_reference: 예언 본문의 명령-신탁 register 유지
