  to: 내가 그들을 향해 기근의 해로운[a] 화살들, 곧 멸망을 일으키는 화살들을 보내어 너희를 멸망시키려 할 때, 나는 너희에게 기근을 더하고 너희의 빵의 지팡이[b]를 꺾을 것입니다.
  rationale: 원문의 심판 비유와 하나님의 직접적 1인칭 행위를 유지하면서, ‘그들을 향해’로 화살의 적대적 방향을 드러냈습니다. 관계절의 반복은 ‘곧 멸망을 일으키는 화살들’이라는 동격으로 옮겨 자연스러운 한국어 문장으로 다듬었습니다. 원문에 있는 ‘그들’과 ‘너희’의 인칭 전환은 해소하거나 동일시하지 않고 그대로 보존했습니다.
