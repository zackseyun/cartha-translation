  text: בְּֽ/שַׁלְּחִ֡/י אֶת חִצֵּי֩ הָ/רָעָ֨ב הָ/רָעִ֤ים בָּ/הֶם֙ אֲשֶׁ֣ר הָי֣וּ לְ/מַשְׁחִ֔ית אֲשֶׁר אֲשַׁלַּ֥ח אוֹתָ֖/ם לְ/שַֽׁחֶתְ/כֶ֑ם וְ/רָעָב֙ אֹסֵ֣ף עֲלֵי/כֶ֔ם וְ/שָׁבַרְתִּ֥י לָ/כֶ֖ם מַטֵּה לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/016.yaml
  text: When I send against them the deadly arrows of famine[a], which are for destruction, which I will send to destroy you[b], then I will add famine upon you and break for you the staff of bread.
  footnotes:
  - marker: a
    text: Or 'the harmful/disastrous arrows of famine.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the staff of bread,' an idiom for the supply or support of bread.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들에게 기근의 해로운 화살들을 보내면, 그것들은 멸망을 위한 것들이며, 내가 그것들을 너희를 멸망시키려고 보낼 때에, 나는 너희에게 기근을 더하고 너희의 빵의 지팡이를 꺾을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘기근의 화살들’은 재앙을 비유적으로 말한 표현이며, ‘해로운/재앙적인’의 뜻을 띱니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘빵의 지팡이’는 빵의 공급이나 생존을 지탱하는 수단을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִצֵּי הָרָעָב
  english_pob_choice: the arrows of famine
  chosen_korean: 기근의 해로운 화살들
  alternatives_korean:
  - 기근의 화살들
  - 기근의 죽음의 화살들
  lexicon: WLC / HALOT
  rationale: 히브리어의 비유를 살리되, הָרָעִים의 평가적 뉘앙스를 ‘해로운’으로 옮겨 재앙적 성격을 드러냈습니다.
- source_word: לְמַשְׁחִית
  english_pob_choice: for destruction
  chosen_korean: 멸망을 위한 것들
  alternatives_korean:
  - 파괴를 위한 것들
  - 멸망하도록
  lexicon: WLC / HALOT
  rationale: 목적·결과를 나타내는 표현으로 읽어, 앞의 화살들을 단순한 현상이 아니라 심판의 수단으로 유지했습니다.
- source_word: לְשַׁחֶתְכֶם
  english_pob_choice: to destroy you
  chosen_korean: 너희를 멸망시키려고
  alternatives_korean:
  - 너희를 파멸시키려고
  - 너희를 무너뜨리려고
  lexicon: WLC / HALOT
  rationale: 동사 שׁחת의 심판 맥락을 따라 직접적이고 문맥에 맞는 ‘멸망시키다’로 옮겼습니다.
- source_word: מַטֵּה לָחֶם
  english_pob_choice: the staff of bread
  chosen_korean: 빵의 지팡이
  alternatives_korean:
  - 빵의 막대기
  - 빵의 버팀목
  lexicon: WLC / HALOT
  rationale: 히브리어 관용구를 본문에서 그대로 살려 투명성을 유지했습니다. 한국어에서도 비유가 유지되도록 직역형 표현을 택했습니다.
theological_decisions:
- issue: 하나님의 직접적 심판 행위
  chosen_reading: ‘내가 … 보내면 / 내가 … 보내려고 / 나는 … 더하고 … 꺾을 것입니다’로 직접적인 1인칭 신적 행위를 유지했습니다.
  alternative_readings:
  - 비인칭적으로 ‘기근이 닥치면’으로 완화
  - ‘기근이 생기면’으로 우회
  rationale: 본문은 재난을 하나님의 주권적 행위로 귀속시키므로, 그 신학적 긴장을 약화시키지 않도록 직접 서술을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘빵의 지팡이’ 관용구의 처리
  chosen_reading: 본문에는 비유를 유지하고, 의미는 독자가 관찰할 수 있도록 남겼습니다.
  alternative_readings:
  - ‘빵의 공급’으로 해석
  - ‘양식의 버팀목’으로 의역
  rationale: 원문의 이미지를 지우지 않으면서도, 이후 주석에서 관용적 의미를 확인할 수 있게 하는 것이 투명성에 더 부합합니다.
  doctrine_reference: Translation philosophy §5, §6
