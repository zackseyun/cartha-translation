  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה יַ֤עַן הֲמָנְ/כֶם֙ מִן הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִיבֽוֹתֵי/כֶ֔ם בְּ/חֻקּוֹתַ/י֙ לֹ֣א הֲלַכְתֶּ֔ם וְ/אֶת מִשְׁפָּטַ֖/י לֹ֣א עֲשִׂיתֶ֑ם וּֽ/כְ/מִשְׁפְּטֵ֧י הַ/גּוֹיִ֛ם אֲשֶׁ֥ר סְבִיבוֹתֵי/כֶ֖ם לֹ֥א עֲשִׂיתֶֽם־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/007.yaml
  text: 'Therefore thus says the Lord GOD: Because you have been more turbulent than the nations that are around you[a], you have not walked in my statutes, and you have not carried out my judgments; and you have not even acted according to the judgments of the nations that are around you.'
  footnotes:
  - marker: a
    text: Or 'you have raged more,' 'you have been more rebellious,' or possibly 'you have been more numerous' than the nations around you. The Hebrew term is difficult, and the main text chooses a sense of excessive disorder that best fits the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. “너희가 너희 둘레의 민족들보다 더욱 소란스러웠기 때문입니다[a]. 너희는 내 규례들을 따라 살지 않았고, 내 법규들을 행하지 않았으며, 너희 둘레의 민족들의 법규대로도 행하지 않았습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희가 더 소란을 피웠다’, ‘너희가 더 반역적이었다’, 혹은 ‘너희가 더 많았다’로도 옮길 수 있습니다. 히브리어 표현이 어려워, 본문은 문맥에 가장 잘 맞는 과도한 무질서의 의미를 택합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  lexicon: 표준 성경 번역 관행
  rationale: 예언문에서 결합 호칭의 장엄함을 살리면서도 한국어에서는 ‘주 하나님’이 자연스럽고, ‘주 여호와’처럼 중복 호칭을 피할 수 있습니다.
- source_word: יַעַן הֲמָנְכֶם
  english_pob_choice: you have been more turbulent
  chosen_korean: 너희가 … 더욱 소란스러웠기 때문입니다
  alternatives_korean:
  - 너희가 … 더욱 난폭했기 때문입니다
  - 너희가 … 더욱 반역적이었기 때문입니다
  - 너희가 … 더욱 많았기 때문입니다
  lexicon: HALOT
  rationale: 본문의 קשה한 표현을 단순 인원수로 풀지 않고, 문맥에 맞는 과도한 동요·소란의 의미를 살려 ‘소란스럽다’로 옮겼습니다.
- source_word: בְּחֻקּוֹתַי
  english_pob_choice: my statutes
  chosen_korean: 내 규례들
  alternatives_korean:
  - 내 율례들
  - 내 법도들
  lexicon: HALOT
  rationale: חֻקּוֹת는 하나님의 정해 두신 규범을 가리키므로, 너무 교회식으로 굳어진 표현을 피하면서도 의미가 분명한 ‘규례들’로 옮겼습니다.
- source_word: מִשְׁפָּטַי
  english_pob_choice: my judgments
  chosen_korean: 내 법규들
  alternatives_korean:
  - 내 판단들
  - 내 규례들
  - 내 공의
  lexicon: HALOT
  rationale: 뒤의 ‘민족들의 법규’와의 대조를 살리기 위해, מִשְׁפָּט을 여기서는 판결행위보다 규범적 요구라는 뜻의 ‘법규들’로 번역했습니다.
- source_word: וּכְמִשְׁפְּטֵי הַגּוֹיִם
  english_pob_choice: according to the judgments of the nations
  chosen_korean: 너희 둘레의 민족들의 법규대로
  alternatives_korean:
  - 너희 둘레의 민족들의 규례대로
  - 너희 둘레의 민족들의 법도대로
  lexicon: HALOT
  rationale: 같은 어근의 반복을 한국어에서도 대조적으로 드러내기 위해, 앞의 מִשְׁפָּט과 통일된 ‘법규’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 문맥상 고유명 야훼 대신 결합 호칭 전체를 ‘주 하나님’으로 옮겼습니다.
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 이 절은 אֲדֹנָי + יְהוִה의 고정 결합을 사용하므로, 한국어에서는 예언서의 호칭으로 자연스러운 ‘주 하나님’이 본문의 장엄함과 가독성을 함께 지킵니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH'
- issue: ‘더욱 소란스러웠다’의 의미 범위
  chosen_reading: 윤리적 ‘반역’으로 한정하지 않고, 과도한 혼란·동요의 의미를 살렸습니다.
  alternative_readings:
  - 더욱 반역적이었다
  - 더욱 난폭했다
  - 더욱 많았다
  rationale: 본문의 히브리어는 난해하며, POB도 과도한 무질서의 의미를 택합니다. 따라서 판단을 좁히기보다 문맥상 감당 가능한 넓은 의미를 유지했습니다.
  doctrine_reference: 해석상 난구절 처리
