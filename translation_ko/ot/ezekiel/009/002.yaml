- from: 그리고 보십시오, 여섯 사람이 위쪽 문에서 오고 있었는데, 그 문은 북쪽을 향하고 있었으며, 각 사람은 손에 부수는 무기를 들고 있었고, 그들 가운데 한 사람은 아마포 옷을 입고 있었으며 서기관의 필통이 그의 허리에 있었습니다. 그들이 와서 놋제단 곁에 섰습니다.[a][b]
