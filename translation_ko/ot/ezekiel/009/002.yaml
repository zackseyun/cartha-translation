base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/002.yaml
  text: And behold[a], six men were coming from the direction of the upper gate, which faces north, each with his weapon for smashing in his hand; and one man among them was clothed in linen, with a scribe’s writing case at his waist[b]. And they came and stood beside the bronze altar.
  footnotes:
  - marker: a
    text: Or 'each with his destroying weapon in his hand.' The Hebrew term refers to an implement for breaking or smashing, but the exact kind of weapon is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'with a scribe’s inkhorn at his waist.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 보십시오, 여섯 사람이 북쪽을 향한 위쪽 문이 있는 쪽에서 오고 있었습니다. 각 사람은 손에 쳐부수는 무기[a]를 들고 있었고, 그들 가운데 한 사람은 아마포 옷을 입고 허리에 서기관의 필기 도구함[b]을 차고 있었습니다. 그들이 와서 청동 제단 곁에 섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘손에 파괴하는 무기를 들고 있었다.’ 히브리어는 부수거나 깨뜨리는 도구를 가리키지만, 정확한 무기의 종류는 분명하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로는 ‘서기관의 먹통을 허리에 찼다’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 그리고 보라
  - 그리고 보게
  lexicon: HALOT
  rationale: 비전 서술의 갑작스러운 시각적 전환을 살리되, 현대 한국어에서 자연스럽고 격식 있는 감탄/지시 표현으로 옮겼습니다.
- source_word: שִׁשָּׁה אֲנָשִׁים
  english_pob_choice: six men
  chosen_korean: 여섯 사람
  alternatives_korean:
  - 여섯 남자
  - 여섯 인간
  lexicon: HALOT
  rationale: 히브리어의 남성 복수는 유지하되, 환상 속 존재를 한국어에서 너무 육체적·일상적으로 좁히지 않기 위해 “사람”을 택했습니다.
- source_word: כְּלִי מַפָּצוֹ
  english_pob_choice: weapon for smashing
  chosen_korean: 부수는 무기
  alternatives_korean:
  - 깨뜨리는 무기
  - 파괴하는 무기
  - 타격 무기
  lexicon: HALOT
  rationale: מַפָּץ의 핵심은 ‘부수다/깨뜨리다’에 있으므로, 정확한 기구의 종류를 단정하지 않고 기능을 드러냈습니다.
- source_word: קֶסֶת הַסֹּפֵר
  english_pob_choice: a scribe’s writing case
  chosen_korean: 서기관의 필통
  alternatives_korean:
  - 서기관의 먹통
  - 서기관의 필갑
  - 서기관의 잉크통
  lexicon: HALOT
  rationale: 전통적 ‘먹통/잉크통’은 뜻은 통하지만 한국어로는 현대 독자에게 다소 낯설어, 기능상 가장 가까운 ‘필통’을 사용했습니다.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  english_pob_choice: the bronze altar
  chosen_korean: 놋제단
  alternatives_korean:
  - 구리 제단
  - 청동 제단
  - 놋으로 된 제단
  lexicon: HALOT
  rationale: 성서 한국어에서 널리 알려진 제단 명칭을 살리되, 소스의 금속 재질을 반영해 ‘놋제단’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: 여섯 사람과 아마포 옷 입은 한 사람의 정체
  chosen_reading: 환상에 나타난 모습 그대로 ‘여섯 사람’과 ‘한 사람’으로 번역하고, 천사로 해석하는 요소는 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 여섯 천사와 한 천사
  - 여섯 명의 하늘 존재와 한 서기관
  rationale: 히브리어 본문은 관찰된 형상을 서술할 뿐이므로, 번역은 그 묘사를 보존하고 해석은 독자에게 남겨 두는 편이 본문의 긴장을 잘 유지합니다.
  doctrine_reference: 본문의 현상학적 서술 보존
- issue: “서기관의 필통”의 현대화
  chosen_reading: ‘inkhorn’의 전통 교회어 대신 기능 중심의 현대어를 사용했습니다.
  alternative_readings:
  - 서기관의 먹통
  - 서기관의 잉크통
  rationale: 원문의 기능은 기록 도구의 휴대 상태를 보여 주는 것이므로, 한국어에서 이해가 쉬운 표현으로 옮겨도 신학적 내용은 훼손되지 않습니다.
  doctrine_reference: 현대어 가독성 우선
