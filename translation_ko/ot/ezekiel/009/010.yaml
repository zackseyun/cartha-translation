id: EZK.9.10
reference: Ezekiel 9:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַ֨ם אֲנִ֔י לֹא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמֹ֑ל דַּרְכָּ֖/ם בְּ/רֹאשָׁ֥/ם נָתָֽתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/010.yaml
  text: And as for me[a], my eye will not spare, nor will I show pity[b]; I have brought their way upon their heads.
  footnotes:
  - marker: a
    text: Or 'their conduct.' Hebrew 'their way' is an idiom for one's manner of life or behavior.
    reason: lexical_alternative
  - marker: b
    text: '''Upon their heads'' is a Hebrew expression for recompense returning on the guilty.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 나로 말하자면, 내 눈이 아끼지 않을 것이며, 내가 긍휼을 베풀지 않겠습니다. 내가 그들의 행위를 그들의 머리 위에 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘길/way’는 여기서 삶의 방식이나 행실을 가리키는 관용구일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 머리 위에’는 죄인에게 보응이 되돌아온다는 히브리식 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  english_pob_choice: And as for me
  chosen_korean: 그러나 나로 말하자면
  alternatives_korean:
  - 그리고 나도
  - 나 역시
  - 또한 나는
  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조와 앞선 심판 선언과의 대비를 한국어에서 자연스럽게 살리기 위해 ‘나로 말하자면’으로 옮겼습니다.
- source_word: לֹא תָחוֹס עֵינִי
  english_pob_choice: my eye will not spare
  chosen_korean: 내 눈이 아끼지 않을 것이며
  alternatives_korean:
  - 내 눈이 불쌍히 여기지 않을 것이며
  - 내 눈이 용서하지 않을 것이며
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 유지하되, ‘아끼다’가 ‘사면/유보하다’의 의미를 살려 심판 문맥의 무자비함을 전달합니다.
- source_word: וְלֹא אֶחְמֹל
  english_pob_choice: nor will I show pity
  chosen_korean: 긍휼을 베풀지 않겠습니다
  alternatives_korean:
  - 불쌍히 여기지 않겠습니다
  - 자비를 보이지 않겠습니다
  lexicon: HALOT
  rationale: חמל의 핵심은 ‘긍휼/불쌍히 여김’의 거절이므로, 반복을 피하면서도 문맥상 심판의 냉혹함을 분명히 드러내는 표현을 택했습니다.
- source_word: דַּרְכָּם
  english_pob_choice: their way
  chosen_korean: 그들의 행위
  alternatives_korean:
  - 그들의 길
  - 그들의 행실
  - 그들의 방식
  lexicon: HALOT
  rationale: 히브리어 ‘길/way’의 관용적 의미가 여기서는 삶의 방식과 행실을 가리키므로, 오해를 줄이면서도 의미를 드러내는 ‘행위’를 택했습니다.
- source_word: בְּרֹאשָׁם
  english_pob_choice: upon their heads
  chosen_korean: 그들의 머리 위에
  alternatives_korean:
  - 그들 머리 위에
  - 그들 자신의 머리 위에
  - 그들 위에
  lexicon: HALOT
  rationale: 보응이 죄인에게 되돌아간다는 히브리 관용을 유지하기 위해 직역형 표현을 사용했습니다.
- source_word: נָתַתִּי
  english_pob_choice: I have brought
  chosen_korean: 두었습니다
  alternatives_korean:
  - 가져왔습니다
  - 내려놓았습니다
  - 주었습니다
  lexicon: HALOT
  rationale: 문장의 핵심은 여호와께서 보응을 그들에게 ‘부여/가함’으로써 심판을 집행하신다는 점이므로, 현대 한국어에서 자연스러운 심판 결과 배치 표현을 택했습니다.
theological_decisions:
- issue: 신적 심판과 긍휼 거절의 강도
  chosen_reading: 하나님께서 죄의 행위를 돌려주시며 긍휼을 거두시는 선언으로, 심판의 엄중함을 완화하지 않고 그대로 드러냈습니다.
  alternative_readings:
  - 더 완곡하게 ‘그 결과를 그들에게 돌리겠습니다’로 옮길 수 있습니다.
  - ‘내 눈이 그들을 불쌍히 여기지 않겠다’로 보다 직접화할 수 있습니다.
  rationale: 본문은 예언적 심판 선언의 엄격한 병렬을 갖고 있으므로, 도덕적/신학적 긴장을 약화시키지 않도록 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
