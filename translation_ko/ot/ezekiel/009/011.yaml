  rationale: ‘linen’의 성경적·의례적 뉘앙스를 살리면서도 현대 독자에게 자연스러운 표현으로 옮겼습니다.
- source_word: הַקֶּסֶת
  english_pob_choice: the writing case
  chosen_korean: 글쓰기 상자
