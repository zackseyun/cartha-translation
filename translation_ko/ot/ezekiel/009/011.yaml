base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/011.yaml
  text: And behold[a], the man clothed in linen, who had the writing case at his waist, brought back word, saying, “I have done as you commanded me.”
  footnotes:
  - marker: a
    text: Or 'inkhorn' for 'writing case,' a traditional rendering of the container carried at his waist.
    reason: lexical_alternative
translation:
  language: ko
  text: 보라[a], 베옷을 입고 허리에 글쓰기 상자를 찬 그 사람이 돌아와 말했습니다. “명령하신 대로 제가 했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘글쓰기 상자’는 전통적인 ‘먹그릇’에 해당하는 용기를 현대적으로 풀어 쓴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 이제 보십시오
  lexicon: HALOT
  rationale: 예언 서술에서 주의를 급히 돌리는 표지이므로, 현대 한국어에서는 간결한 명령형 감탄사 ‘보라’로 그 시각적·수사적 기능을 살렸습니다.
- source_word: לְבֻשׁ הַבַּדִּים
  english_pob_choice: clothed in linen
  chosen_korean: 베옷을 입고
  alternatives_korean:
  - 세마포를 입고
  - 린넨을 두르고
  lexicon: HALOT
  rationale: ‘linen’의 성경적·의례적 뉘앙스를 살리면서도 현대 독자에게 자연스러운 표현으로 옮겼습니다.
- source_word: הַקֶּסֶת
  english_pob_choice: the writing case
  chosen_korean: 글쓰기 상자
  alternatives_korean:
  - 필기함
  - 먹그릇
  lexicon: HALOT
  rationale: 문맥상 허리에 찬 기록 도구의 용기를 가리키므로, 전통적 ‘먹그릇’보다 기능과 형태를 더 중립적으로 드러내는 표현을 택했습니다.
- source_word: מֵשִׁיב דָּבָר
  english_pob_choice: brought back word
  chosen_korean: 돌아와 말했습니다
  alternatives_korean:
  - 보고했습니다
  - 답을 전했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 응답·보고 기능을 살리되, 한국어에서는 직접적인 대화 전환으로 자연스럽게 전달했습니다.
theological_decisions:
- issue: 베옷을 입은 사람의 정체
  chosen_reading: 외형과 역할만 제시하고, 천상 존재 여부는 단정하지 않았습니다.
  alternative_readings:
  - 천사로 특정하기
  - 제사장적 인물로 특정하기
  rationale: 본문은 그를 ‘베옷을 입은 그 사람’으로만 묘사하므로, 존재론적 규정은 본문이 말하는 범위를 넘습니다.
  doctrine_reference: '번역 원칙: 본문이 명시하지 않은 신학적 결론을 덧붙이지 않음'
