translation:
  language: ko
  text: 보십시오[a], 베옷을 입고 허리에 필기 도구함을 찬 그 사람이 돌아와 이렇게 보고했습니다. “명령하신 대로 제가 했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘필기 도구함’은 전통적으로 ‘먹그릇’으로도 옮기는, 허리에 차는 기록 도구 용기를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
