theological_decisions:
- issue: תָּו의 구체성을 본문에 얼마나 드러낼지
  chosen_reading: 본문에서는 기능적 의미인 ‘표’로 번역하고, 문자형 상징성은 본문 밖으로 미루었습니다.
  alternative_readings:
  - ‘다우’ 혹은 ‘타우’로 표기하여 문자 ת를 직접 드러내기
  - ‘표지’로 일반화하기
  rationale: 문맥상 즉각적 의미는 심판 속 구별을 위한 보호 표식이며, 문자 ת의 상징 가능성은 확실하지 않으므로 본문에서 과도하게 구체화하지 않았습니다.
  doctrine_reference: 원문 우선과 해석적 절제
