  text: זָקֵ֡ן בָּח֣וּר וּ/בְתוּלָה֩ וְ/טַ֨ף וְ/נָשִׁ֜ים תַּהַרְג֣וּ לְ/מַשְׁחִ֗ית וְ/עַל כָּל אִ֨ישׁ אֲשֶׁר עָלָ֤י/ו הַ/תָּו֙ אַל תִּגַּ֔שׁוּ וּ/מִ/מִּקְדָּשִׁ֖/י תָּחֵ֑לּוּ וַ/יָּחֵ֨לּוּ֙ בָּ/אֲנָשִׁ֣ים הַ/זְּקֵנִ֔ים אֲשֶׁ֖ר לִ/פְנֵ֥י הַ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/006.yaml
  text: Old man[a], young man, and virgin, and little children, and women—you shall kill them utterly. But do not come near anyone on whom is the mark, and begin at my sanctuary[b]. So they began with the old men who were before the house.
  footnotes:
  - marker: a
    text: Hebrew 'the taw'; that is, the protective mark placed on the faithful (see v. 4).
    reason: lexical_alternative
  - marker: b
    text: Or 'the elders' who were before the house (that is, the temple).
    reason: alternative_reading
translation:
  language: ko
  text: 늙은 사람, 젊은 사람, 처녀, 어린아이, 여자까지—너희는 그들을 완전히 죽여야 합니다. 그러나 그 표가 있는 사람에게는 가까이 가지 마십시오. 내 성소에서부터 시작하십시오. 그러자 그들이 집 앞에 있는 장로들부터 시작하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘타우’; 곧 앞 절에서 의인들에게 찍힌 보호 표입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘집 앞에 있는 늙은 사람들’로 볼 수 있습니다. 여기서 ‘집’은 성전을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זָקֵן
  english_pob_choice: old man
  chosen_korean: 늙은 사람
  alternatives_korean:
  - 노인
  - 늙은이
  - 장로
  lexicon: HALOT
  rationale: 이 절은 연령 범주의 나열이므로 직분어인 ‘장로’보다 나이 범주를 드러내는 표현이 필요합니다. ‘늙은 사람’은 원문의 분배적 단수 감각을 한국어로 자연스럽게 살립니다.
- source_word: בָּחוּר
  english_pob_choice: young man
  chosen_korean: 젊은 사람
  alternatives_korean:
  - 젊은 남자
  - 청년
  - 용사
  lexicon: HALOT
  rationale: 문맥상 전투원보다 연령대 구분이 중심이므로, ‘젊은 사람’이 성별·연령 범주의 병렬을 가장 무리 없이 전달합니다.
- source_word: בְתוּלָה
  english_pob_choice: virgin
  chosen_korean: 처녀
  alternatives_korean:
  - 젊은 여자
  - 미혼 여자
  lexicon: HALOT
  rationale: 원문은 ‘처녀’의 직접적 의미를 사용하므로, 이를 약화시키지 않고 그대로 옮겼습니다.
- source_word: הַתָּו
  english_pob_choice: the mark
  chosen_korean: 그 표
  alternatives_korean:
  - 그 표시
  - 그 타브 표
  lexicon: HALOT
  rationale: 보호를 위한 식별 표라는 기능이 중심이므로 ‘표’가 가장 간결합니다. 문자 이름과의 연결은 본문이 아니라 주석에서 다루는 편이 적절합니다.
theological_decisions:
- issue: מרקה(표)의 의미를 문자명보다 기능으로 옮길지 여부
  chosen_reading: 그 표
  alternative_readings:
  - 그 표시
  - 그 타브 표
  rationale: 이 본문은 표의 문자학적 설명보다, 표가 있는 자를 심판에서 보호하는 기능을 강조합니다. 따라서 본문은 기능적 번역을 택하고, 문자 연결 가능성은 주석적 층위로 남깁니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: הַזְּקֵנִים의 의미를 나이(늙은 사람)로 볼지 직분(장로)로 볼지
  chosen_reading: 집 앞에 있는 장로들
  alternative_readings:
  - 집 앞에 있는 늙은 사람들
  rationale: 첫머리는 나이·성별의 분류이지만, 마지막의 ‘집 앞’은 성전 맥락을 강하게 띠므로 여기서는 직분적 의미도 가능한 중의성을 살려 번역했습니다. 본문은 일차적으로 ‘장로들’을 택하되, 같은 어형의 반복을 통해 가능한 나이 의미도 완전히 지우지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3, §4
