  to: 그들에게 말씀하셨습니다. “그 집[a]을 더럽히고, 뜰들을 죽임당한 사람들[b]로 채우십시오. 나가십시오.” 그러자 그들은 나가서 성읍에서 사람들을 쳐 죽였습니다.
