id: EZK.9.7
reference: Ezekiel 9:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם טַמְּא֣וּ אֶת הַ/בַּ֗יִת וּ/מַלְא֧וּ אֶת הַ/חֲצֵר֛וֹת חֲלָלִ֖ים צֵ֑אוּ וְ/יָצְא֖וּ וְ/הִכּ֥וּ בָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/007.yaml
  text: And he said to them[a], “Defile the house, and fill the courts with the slain[b]. Go out.” So they went out and struck down people in the city.
  footnotes:
  - marker: a
    text: Or 'the temple.' Hebrew literally 'the house.'
    reason: lexical_alternative
  - marker: b
    text: Or 'fill the courtyards with corpses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 말씀하셨습니다. “집을 더럽히고, 뜰들을 살해된 자들로 채우십시오. 나가십시오.” 그러자 그들이 나가서 성읍 안에서 사람들을 쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 문자적으로는 히브리어 ‘집’이며, 문맥상 성전을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘살해된 자들’은 ‘시체들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַמְּאוּ
  english_pob_choice: Defile
  chosen_korean: 더럽히고
  alternatives_korean:
  - 부정하게 하고
  - 더럽게 하고
  lexicon: HALOT
  rationale: 예언적 심판 문맥에서 제의적 오염을 지시하는 명령이므로, 한국어에서는 ‘더럽히다’가 가장 직접적으로 그 충격과 의미를 살립니다.
- source_word: הַבַּיִת
  english_pob_choice: the house
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 집안
  lexicon: HALOT
  rationale: 히브리어의 문자 그대로인 ‘집’을 본문에 유지해 원문 이미지를 살리되, 문맥상 성전임은 독자가 알아차릴 수 있도록 했습니다.
- source_word: חֲצֵרוֹת
  english_pob_choice: the courts
  chosen_korean: 뜰들
  alternatives_korean:
  - 마당들
  - 뜰
  lexicon: HALOT
  rationale: 성전 구역을 가리키는 복수형이므로 ‘뜰들’이 자연스럽고, 성전 건축 맥락도 보존합니다.
- source_word: חֲלָלִים
  english_pob_choice: the slain
  chosen_korean: 살해된 자들
  alternatives_korean:
  - 죽임당한 자들
  - 죽은 몸들
  - 시체들
  lexicon: HALOT
  rationale: 단순한 ‘시체’보다 사람을 죽임당한 상태로 보여 주는 말이 더 원문의 심판적 긴장을 잘 전달합니다.
- source_word: וְהִכּוּ
  english_pob_choice: struck down people
  chosen_korean: 사람들을 쳤습니다
  alternatives_korean:
  - 사람들을 쳐 죽였습니다
  - 사람들을 공격했습니다
  lexicon: HALOT
  rationale: נכה의 기본 동작을 살리면서도 결과적으로 치명적 타격임을 앞뒤 문맥이 드러내게 하여, 과도한 해설을 피했습니다.
theological_decisions:
- issue: ‘집’의 처리
  chosen_reading: 본문에서는 ‘성전’으로 바꾸지 않고 ‘집’을 유지했습니다.
  alternative_readings:
  - 성전으로 명시하기
  rationale: 영어 POB의 주석대로 히브리어는 문자적으로 ‘집’이므로, 본문은 원문 이미지를 유지하고 의미는 문맥이 담당하게 하는 편이 더 소스-직결적입니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 제의적 오염 명령의 강도
  chosen_reading: ‘더럽히고’로 직역해 심판 장면의 충격을 유지했습니다.
  alternative_readings:
  - ‘부정하게 하고’로 완화하기
  rationale: 이 구절은 야훼의 심판으로 성전 공간이 오염되는 장면이므로, 완화된 표현보다 직접적인 표현이 원문의 신학적 긴장을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
