reference: Ezekiel 9:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י עֲוֺ֨ן בֵּֽית יִשְׂרָאֵ֤ל וִֽ/יהוּדָה֙ גָּדוֹל֙ בִּ/מְאֹ֣ד מְאֹ֔ד וַ/תִּמָּלֵ֤א הָ/אָ֨רֶץ֙ דָּמִ֔ים וְ/הָ/עִ֖יר מָלְאָ֣ה מֻטֶּ֑ה כִּ֣י אָמְר֗וּ עָזַ֤ב יְהוָה֙ אֶת הָ/אָ֔רֶץ וְ/אֵ֥ין יְהוָ֖ה רֹאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/009.yaml
  text: Then he said to me[a], “The iniquity of the house of Israel and Judah is exceedingly great, and the land is filled with bloodshed, and the city is full of perversion. For they say, ‘Yahweh has forsaken the land, and Yahweh does not see.’”
  footnotes:
  - marker: a
    text: Or 'full of perversion' or 'full of distorted justice.' The Hebrew term points to crookedness or the perversion of what is right, likely including judicial injustice.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그가 제게 말씀하셨습니다[a]. “이스라엘 집과 유다의 죄악이 매우, 매우 크며, 그 땅은 피 흘림으로 가득하고, 그 도성은 비뚤어짐으로 가득합니다. 그들이 말하기를 ‘야훼께서 이 땅을 버리셨고, 야훼께서는 보지 않으신다’고 하기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비뚤어짐으로 가득하다’, ‘왜곡된 정의로 가득하다’로 옮길 수 있습니다. 히브리어는 곧은 것을 비틀어 놓은 상태를 가리키며, 아마도 사법적 불의까지 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲוֺן
  english_pob_choice: iniquity
  chosen_korean: 죄악
  alternatives_korean:
  - 불의
  - 악
  - 죄책
  lexicon: HALOT
  rationale: 문맥상 이스라엘과 유다의 총체적 도덕적 타락을 가리키므로, 단순한 '죄책'보다 책임성과 악함을 함께 드러내는 '죄악'이 자연스럽습니다.
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  english_pob_choice: the house of Israel and Judah
  chosen_korean: 이스라엘 집과 유다
  alternatives_korean:
  - 이스라엘 집과 유다 집
  - 이스라엘과 유다
  lexicon: HALOT
  rationale: '''집''의 언약적·공동체적 표현을 살리되, 한국어에서 반복을 줄여 읽기 쉽게 옮겼습니다.'
- source_word: דָּמִים
  english_pob_choice: bloodshed
  chosen_korean: 피 흘림
  alternatives_korean:
  - 유혈
  - 피
  - 살육
  lexicon: HALOT
  rationale: 히브리어 복수형이 폭력 행위와 유혈 책임을 가리키므로, 물질적 '피'보다 행위성을 드러내는 '피 흘림'이 더 적절합니다.
- source_word: מֻטֶּה
  english_pob_choice: perversion
  chosen_korean: 비뚤어짐
  alternatives_korean:
  - 왜곡
  - 굴절됨
  - 불의
  lexicon: HALOT
  rationale: 이 단어는 곧은 것에서 비켜난 상태, 즉 왜곡된 질서를 가리키므로, 법정적 뉘앙스를 유지하면서도 문맥에 맞게 '비뚤어짐'으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신적 이름을 호칭으로 대체하지 않고, 프로젝트 기본값에 따라 고유명으로 직접 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 신명 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 히브리어 본문은 여호와 대신이 아닌 여호와의 고유 이름을 사용하므로, 언약적·본문적 정보를 보존하기 위해 '야훼'를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
