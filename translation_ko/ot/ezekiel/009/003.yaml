- from: 이스라엘의 하나님의 영광이 그것 위에 있던 그룹 위에서 떠올라 집의 문지방으로 갔습니다. 그리고 그는 허리에 서기관의 필기함을 찬, 세마포 옷을 입은 그 사람을 불렀습니다.[a]
