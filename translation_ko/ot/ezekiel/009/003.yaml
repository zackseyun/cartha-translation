  rationale: 본문은 כָּבוֹד을 ‘영광’으로, 단수 הַכְּרוּב을 ‘그룹’으로, מִפְתַּן הַבַּיִת를 ‘집의 문지방’으로 유지했습니다. 주어가 논의되는 וַיִּקְרָא는 원문의 표면적 선행사인 ‘영광’을 본문에 유지하되, 하나님 자신의 현현으로 이해하는 문맥적 독법은 각주에 보존했습니다. 또한 모든 각주 표지를 해당 어휘 또는 절에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
