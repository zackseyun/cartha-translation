  text: וּ/כְב֣וֹד אֱלֹהֵ֣י יִשְׂרָאֵ֗ל נַעֲלָה֙ מֵ/עַ֤ל הַ/כְּרוּב֙ אֲשֶׁ֣ר הָיָ֣ה עָלָ֔י/ו אֶ֖ל מִפְתַּ֣ן הַ/בָּ֑יִת וַ/יִּקְרָ֗א אֶל הָ/אִישׁ֙ הַ/לָּבֻ֣שׁ הַ/בַּדִּ֔ים אֲשֶׁ֛ר קֶ֥סֶת הַ/סֹּפֵ֖ר בְּ/מָתְנָֽי/ו׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/003.yaml
  text: And the glory of the God of Israel went up from above the cherub on which it had been[a], to the threshold of the house. And he called to the man clothed in linen[c][b], who had the scribe’s writing case at his waist.
  footnotes:
  - marker: a
    text: Or 'the threshold of the temple.' Hebrew 'house' here refers to the temple building in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the scribe’s ink case'; traditional English has 'inkhorn.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew could also be rendered 'it called,' referring back to 'the glory,' but the context suggests personal divine agency.
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘의 하나님의 영광이 그것 위에 있던 그룹 위에서 떠올라 집의 문지방으로 갔습니다. 그리고 그는 허리에 서기관의 필기함을 찬, 세마포 옷을 입은 그 사람을 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 여기서 문맥상 성전 건물을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: כְבוֹד אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the glory of the God of Israel
  chosen_korean: 이스라엘의 하나님의 영광
  alternatives_korean:
  - 이스라엘의 하나님께 속한 영광
  - 이스라엘의 하나님 임재의 영광
  lexicon: HALOT
  rationale: כָּבוֹד를 ‘영광’으로 옮겨 에스겔의 환상적-현현 문맥을 살리고, construct chain도 자연스러운 소유/귀속 구조로 반영했습니다.
- source_word: נַעֲלָה מֵעַל
  english_pob_choice: went up from above
  chosen_korean: …에서 떠올라
  alternatives_korean:
  - …에서 올라
  - …위에서 올라
  lexicon: HALOT
  rationale: עלה의 상승 방향을 살리되, ‘떠올라’가 환상 장면에서 더 자연스럽고 상향 이동의 이미지를 분명히 드러냅니다.
- source_word: מִפְתַּן הַבָּיִת
  english_pob_choice: the threshold of the house
  chosen_korean: 집의 문지방
  alternatives_korean:
  - 성전의 문지방
  - 집의 현관문턱
  lexicon: HALOT
  rationale: בַּיִת를 직역해 ‘집’으로 두되, 본문 맥락상 성전 건물을 가리키는 점은 본문 자체의 문맥에 맡기고 한국어는 간명하게 유지했습니다.
- source_word: הָאִישׁ הַלָּבֻשׁ הַבַּדִּים
  english_pob_choice: the man clothed in linen
  chosen_korean: 세마포 옷을 입은 그 사람
  alternatives_korean:
  - 세마포를 입은 사람
  - 세마포 옷을 입은 남자
  lexicon: HALOT
  rationale: לָבֻשׁ을 서술적으로 풀어 ‘옷을 입은’으로 옮겨 자연스러운 현대 한국어를 만들고, ‘그 사람’으로 특정 인물을 유지했습니다.
- source_word: קֶסֶת הַסֹּפֵר
  english_pob_choice: the scribe’s writing case
  chosen_korean: 서기관의 필기함
  alternatives_korean:
  - 서기관의 잉크통
  - 서기관의 먹통
  lexicon: HALOT
  rationale: 전통적 ‘잉크뿔’은 피하고, 필기구를 담는 용기라는 기능을 살려 ‘필기함’으로 옮겼습니다.
theological_decisions:
- issue: וַיִּקְרָא의 주어를 한국어에서 어떻게 처리할지
  chosen_reading: ‘그는 불렀습니다’로 옮겨, 바로 앞의 ‘이스라엘의 하나님의 영광’을 인격적 행위자로 읽었습니다.
  alternative_readings:
  - ‘그것이 불렀습니다’로 옮겨 문법적 선행사에 맞추기
  - ‘영광이 불렀습니다’로 비인칭화하기
  rationale: 히브리어 동사는 남성 단수이며, 문맥상 영광은 하나님 자신의 현현으로 기능하므로 인격적 행위를 살리는 번역이 원문과 POB 주해 모두에 가장 잘 맞습니다.
  doctrine_reference: 환상 본문에서 하나님의 임재 현현을 인격적 행위로 유지하되, 문법적 긴장을 과도하게 해소하지 않습니다.
