    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  english_pob_choice: And to the others
  chosen_korean: 그 나머지들에게는
  alternatives_korean:
  - 그 다른 이들에게는
  - 그리고 그 다른 사람들에게는
  lexicon: HALOT
  rationale: 이 표현은 직전 절의 표지 입은 사람과 대조되는 남은 실행자들을 가리키므로, 한국어에서는 관계를 드러내는 ‘그 나머지들에게는’이 자연스럽습니다.
- source_word: בְּאָזְנַי
  english_pob_choice: in my hearing
  chosen_korean: 내 귀에 대고
  alternatives_korean:
  - 내가 들을 수 있게
  - 내 귀에
  lexicon: HALOT
  rationale: 히브리어 관용구는 예언자에게 말이 실제로 들렸다는 뜻이므로, 직접성은 살리되 한국어 자연성을 위해 ‘내 귀에 대고’로 옮겼습니다.
- source_word: עִבְרוּ בָעִיר אַחֲרָיו
  english_pob_choice: Pass through the city after him
  chosen_korean: 그를 뒤따라 성읍을 지나가며
  alternatives_korean:
  - 성읍을 그 뒤로 지나가며
  - 그 뒤를 따라 도시를 통과하며
  lexicon: HALOT
  rationale: עבר의 명령형은 ‘지나가다/통과하다’의 동작을 요구하므로, ‘그를 뒤따라 성읍을 지나가며’로 순서와 이동을 함께 드러냈습니다.
- source_word: עַל תָּחֹס עֵינֵיכֶם וְאַל תַּחְמֹלוּ
  english_pob_choice: do not let your eye spare, and do not show pity
  chosen_korean: 너희 눈이 아끼지 말고, 불쌍히 여기지도 마십시오
  alternatives_korean:
  - 너희 눈이 아끼지 말고, 가엾게 여기지도 마십시오
  - 너희 눈이 불쌍히 여기지 말고, 긍휼을 베풀지도 마십시오
  lexicon: HALOT
  rationale: 첫 절은 히브리어의 생생한 관용구를 살려 문자적으로, 둘째 절은 חמל의 의미를 중복 없이 ‘불쌍히 여기다’로 옮겨 두 금지 명령의 평행을 구분했습니다.
