  source_fidelity: ‘각 사람은 … 들고 있으라’는 히브리어의 명령을 한 번 더 반복한 것처럼 보이게 합니다. 원문은 ‘가까이 오라’라는 복수 명령 뒤에, 각 사람이 파괴의 무기를 손에 든 상태임을 덧붙입니다. 또한 פְּקֻדּוֹת는 어휘적으로 불확실하므로 ‘감시자들’처럼 감시 기능으로 좁히기보다 ‘성읍을 맡은 이들’로 옮기고 주석에서 범위를 밝혀 두는 편이 안전합니다.
  naturalness: ‘가까이 오십시오, 성읍을 맡은 이들이여. 각 사람은 파괴의 무기를 손에 든 채 오십시오’는 현대 표준어 합쇼체로 자연스럽고, 원문의 명령과 수반 상태를 명료하게 전달합니다.
  terminology: ‘성읍’은 예언서의 문체에 적합합니다. ‘성읍을 맡은 이들’은 임명·감독·방문/심판이라는 פְּקֻדּוֹת의 논쟁적 의미 범위를 본문에서 과도하게 확정하지 않습니다. ‘파괴의 무기’는 כְּלִי מַשְׁחֵתוֹ를 충실히 반영합니다.
