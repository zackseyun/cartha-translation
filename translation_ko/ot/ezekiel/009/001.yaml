id: EZK.9.1
reference: Ezekiel 9:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א בְ/אָזְנַ֗/י ק֤וֹל גָּדוֹל֙ לֵ/אמֹ֔ר קָרְב֖וּ פְּקֻדּ֣וֹת הָ/עִ֑יר וְ/אִ֛ישׁ כְּלִ֥י מַשְׁחֵת֖/וֹ בְּ/יָדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/001.yaml
  text: Then he cried out in my ears with a loud voice[a], saying, “Draw near, you executioners of the city[b], each with his weapon of destruction in his hand.”
  footnotes:
  - marker: a
    text: Or “Come near, you appointed ones of the city”; the Hebrew term may denote those appointed for oversight or visitation/judgment.
    reason: alternative_reading
  - marker: b
    text: Hebrew literally “and each man [with] his weapon of destruction in his hand.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 내 귀에 큰 소리로 외치며 말했습니다. “가까이 오십시오, 성읍을 맡은 이들이여[a]. 각 사람은 파괴의 무기를 손에 든 채 오십시오[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “성읍에 임명된 이들이여.” 히브리어는 성읍을 맡아 감독하는 이들, 또는 방문하여 심판하는 이들을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 “그리고 각 사람, 그의 파괴의 무기가 그의 손에 있는”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: he cried out
  chosen_korean: 외치며
  alternatives_korean:
  - 불러 말하며
  - 소리쳐 말하며
  lexicon: HALOT
  rationale: 문맥상 ‘내 귀에’와 ‘큰 소리로’가 결합되어 있어 단순한 호출보다 강한 외침의 뉘앙스를 살리는 것이 적절합니다.
- source_word: פְּקֻדּוֹת הָעִיר
  english_pob_choice: you overseers of the city
  chosen_korean: 성읍의 감시자들
  alternatives_korean:
  - 성읍의 감독자들
  - 성읍에 임명된 자들
  - 성읍의 처벌자들
  lexicon: HALOT
  rationale: 히브리어 표현은 ‘임명된/감독하는/방문하는’ 뜻의 범위를 가지며, POB의 결정을 따라 여기서는 심판 집행자라는 단정 대신 도시 위에 세워진 감시·감독의 뉘앙스를 살렸습니다.
- source_word: כְּלִי מַשְׁחֵתוֹ
  english_pob_choice: his weapon of destruction
  chosen_korean: 파괴의 무기
  alternatives_korean:
  - 멸망의 무기
  - 파괴하는 도구
  - 멸망의 도구
  lexicon: HALOT
  rationale: כְּלִי는 넓게 ‘도구/기구/무기’를 가리키므로 문맥상 ‘무기’가 자연스럽고, מַשְׁחֵת의 파괴성을 직설적으로 드러내기 위해 ‘파괴의’로 옮겼습니다.
- source_word: בְּיָדוֹ
  english_pob_choice: in his hand
  chosen_korean: 손에 들고 있으라
  alternatives_korean:
  - 손에 가지고 있으라
  - 그의 손에
  lexicon: HALOT
  rationale: 히브리어의 구체적 신체 이미지를 한국어에서도 자연스럽게 유지하기 위해 ‘손에’와 동작을 함께 살렸습니다.
theological_decisions:
- issue: פְּקֻדּוֹת הָעִיר의 신학적/기능적 범주
  chosen_reading: 도시의 감시자들로 옮겨, 심판 집행의 역할을 암시하되 본문이 말하는 범위를 넘어서 천사적 정체성을 단정하지 않았습니다.
  alternative_readings:
  - 도시의 집행자들
  - 도시의 감독자들
  - 도시의 방문자들
  rationale: 이 용어는 문맥상 심판과 관련되지만 어휘 자체는 ‘임명, 감독, 방문’의 범위를 지니므로, 의미를 좁혀 버리기보다 문맥적 긴장을 보존하는 번역이 더 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
