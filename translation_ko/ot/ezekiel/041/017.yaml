base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/017.yaml
  text: Above the doorway[a], and as far as the inner house, and outside, and on all the wall all around, in the inner part and in the outer part[b], were measurements.
  footnotes:
  - marker: a
    text: Or 'dimensions.' The Hebrew noun can denote measurements or dimensional specifications in an architectural context.
    reason: lexical_alternative
  - marker: b
    text: '''Inner house'' may also be rendered ''inner temple,'' since ''house'' in Ezekiel''s temple vision often refers to the temple structure.'
    reason: lexical_alternative
translation:
  language: ko
  text: 입구 위에서 안쪽 집[b]에 이르기까지, 또 바깥쪽과 안쪽과 바깥쪽의 사방을 두른 모든 벽에는 치수[a]가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 ‘측량’ 또는 건축상의 ‘치수’라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘안쪽 집’은 문맥상 ‘안쪽 성전’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַל הַפֶּתַח
  english_pob_choice: above the doorway
  chosen_korean: 문지방 위
  alternatives_korean:
  - 출입문 위
  - 문 위
  lexicon: HALOT
  rationale: פתח는 이 문맥에서 건축적 ‘입구/문간’을 가리키므로, 한국어로는 자연스럽게 ‘문지방 위’로 옮겨 출입구 상단의 위치를 살렸습니다.
- source_word: וְעַד הַבַּיִת הַפְּנִימִי
  english_pob_choice: and as far as the inner house
  chosen_korean: 안쪽 집까지
  alternatives_korean:
  - 안쪽 성전까지
  - 내부 집까지
  lexicon: HALOT
  rationale: בַּיִת은 성전 환상에서 건물 전체를 가리킬 수 있어, 원문의 이미지를 유지하는 ‘안쪽 집’으로 옮겼습니다.
- source_word: וְלַחוּץ
  english_pob_choice: and outside
  chosen_korean: 그리고 바깥
  alternatives_korean:
  - 그리고 밖쪽
  - 그리고 외부
  lexicon: HALOT
  rationale: 대조되는 공간 표지를 간결하게 살려, 내부에 대응하는 ‘바깥’으로 옮겼습니다.
- source_word: מִדּוֹת
  english_pob_choice: were measurements
  chosen_korean: 측량한 것
  alternatives_korean:
  - 치수였습니다
  - 크기였습니다
  - 측정값이었습니다
  lexicon: HALOT
  rationale: 명사 ‘측량/치수’의 의미를 살리되, 히브리어의 생략된 서술을 한국어 문장으로 자연스럽게 풀어 주기 위해 ‘측량한 것’으로 옮겼습니다.
