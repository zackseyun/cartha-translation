    text: Hebrew repeats 'around' three times in this verse for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 방들 사이에는 성전 주위로 사방에 스무 규빗의 너비가 있었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이 절에서 ‘사방에/주위로’에 해당하는 표현을 세 번 반복하여 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵין
  english_pob_choice: And between
  chosen_korean: 그리고 … 사이에는
  alternatives_korean:
  - 그리고 사이에는
  - … 사이에는
  lexicon: HALOT
  rationale: 연결사 וּ와 전치사 בֵין의 흐름을 살려 다음 건축 묘사를 자연스럽게 이어 줍니다.
- source_word: הַלְּשָׁכוֹת
  english_pob_choice: the side chambers
  chosen_korean: 방들
  alternatives_korean:
  - 옆방들
  - 곁방들
  - 측실들
  lexicon: HALOT
  rationale: 문맥상 성전 구조의 부속실들을 가리키므로 지나치게 기술적인 용어보다 간결한 ‘방들’이 원문의 지시를 유지합니다.
- source_word: רֹחַב
  english_pob_choice: a width
  chosen_korean: 너비
  alternatives_korean:
  - 폭
  - 가로 너비
  - 넓이
  lexicon: HALOT
  rationale: 측정 문맥에서 רֹחַב의 물리적 치수를 자연스럽게 드러내는 한국어는 ‘너비’입니다.
- source_word: סָבִיב ... סָבִיב סָבִיב
  english_pob_choice: all around ... all around
  chosen_korean: 사방에 … 주위로 사방에
  alternatives_korean:
  - 둘레로 … 둘레로
  - 주위로 … 둘레로
  - 온통 … 사방에
  lexicon: HALOT
  rationale: 히브리어의 반복을 한국어로 완전히 기계적으로 옮기기보다, ‘사방에’와 ‘주위로’의 중첩으로 둘러싼 범위를 살려 반복 효과를 보존합니다.
- source_word: לַבַּיִת
  english_pob_choice: the temple
  chosen_korean: 성전
  alternatives_korean:
  - 집
  - 건물
  - 전각
  lexicon: HALOT
  rationale: 에스겔 40–48장의 בַּיִת는 성전 단지를 가리키므로 현대 한국어 독자에게는 ‘성전’이 가장 명확합니다.
theological_decisions:
- issue: 구조 설명에서 반복어를 어떻게 처리할지
  chosen_reading: ‘사방에 … 주위로 사방에’로 반복의 강조를 살리되 한국어 어법을 해치지 않게 조정했습니다.
  alternative_readings:
  - ‘온 사방에 … 사방에’
  - ‘둘레로 … 둘레로’
  rationale: 히브리어는 סָבִיב를 세 번 반복하여 둘러싸임을 강조합니다. 한국어는 같은 표현의 과잉 반복이 부자연스러우므로, 강조는 유지하되 읽기 흐름을 확보했습니다.
  doctrine_reference: 본문의 건축 묘사 자체에 대한 번역 원칙
