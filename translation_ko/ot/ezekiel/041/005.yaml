  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֥מָד קִֽיר הַ/בַּ֖יִת שֵׁ֣שׁ אַמּ֑וֹת וְ/רֹ֣חַב הַ/צֵּלָע֩ אַרְבַּ֨ע אַמּ֜וֹת סָבִ֧יב סָבִ֛יב לַ/בַּ֖יִת סָבִֽיב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/005.yaml
  text: 'Then he measured the wall of the house: six cubits[a]; and the width of the side chambers was four cubits all around the house on every side.'
  footnotes:
  - marker: a
    text: Or, 'the side room' or 'the side structure.' The Hebrew term refers to the chambers built along the sides of the temple building.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그 집의 벽을 재니, 여섯 규빗이었고, 옆방들의 너비는 사방으로 그 집을 둘러싸며 네 규빗이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옆방’ 혹은 ‘옆 구조물’로 옮길 수 있습니다. 히브리어 용어는 성전 건물의 옆면을 따라 지어진 방들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  english_pob_choice: Then he measured
  chosen_korean: 그가 ... 재니
  alternatives_korean:
  - 그가 ... 측정하니
  - 그가 ... 헤아리니
  lexicon: HALOT
  rationale: 서술의 다음 동작을 자연스럽게 잇는 합쇼체 서술로 ‘재다’를 택해, 측량 행위의 직접성과 문맥의 연속성을 살렸습니다.
- source_word: קִיר הַבַּיִת
  english_pob_choice: the wall of the house
  chosen_korean: 그 집의 벽
  alternatives_korean:
  - 성전의 벽
  - 그 집의 담
  lexicon: HALOT
  rationale: בַּיִת를 본문 그대로 ‘집’으로 살리되, 성전 환상 문맥이 분명하므로 구조물의 벽이라는 뜻을 자연스럽게 드러냈습니다.
- source_word: הַצֵּלָע
  english_pob_choice: the side chambers
  chosen_korean: 옆방들
  alternatives_korean:
  - 측면 방들
  - 곁방들
  - 옆 구조물
  lexicon: HALOT
  rationale: 성전 건축 용어로서의 צֵלָע를 단수 개념에 갇히지 않도록 복수형 ‘옆방들’로 옮겨, 둘러싼 부속 공간들의 집합적 의미를 반영했습니다.
- source_word: סָבִיב סָבִיב
  english_pob_choice: all around ... on every side
  chosen_korean: 사방으로 ... 둘러싸며
  alternatives_korean:
  - 주위로 ... 둘러
  - 온 사방에
  lexicon: HALOT
  rationale: 반복된 סָבִיב의 둘러싸는 힘을 한국어의 ‘사방으로’와 ‘둘러싸며’로 살려, 단순 위치 설명이 아니라 포위적 배치를 보여 주었습니다.
- source_word: שֵׁשׁ אַמּוֹת / אַרְבַּע אַמּוֹת
  english_pob_choice: six cubits / four cubits
  chosen_korean: 여섯 규빗 / 네 규빗
  alternatives_korean:
  - 여섯 자 / 네 자
  - 6 규빗 / 4 규빗
  lexicon: HALOT
  rationale: 고대 측량 단위를 그대로 보존하여 본문의 건축 치수를 직역했고, 숫자는 한글 수사로 읽기 쉽게 처리했습니다.
theological_decisions:
- issue: 성전 환상에서의 בַּיִת와 צֵלָע의 처리
  chosen_reading: ‘집’과 ‘옆방들’을 유지하여, 성전 건축의 구체적 구조를 독자가 바로 그리도록 했습니다.
  alternative_readings:
  - ‘성전’과 ‘측면 방들’
  - ‘전각’과 ‘곁방들’
  rationale: 본문은 추상적 교리 진술이 아니라 측량 보고이므로, 전통적 교회 용어로 완화하기보다 건축적 실재를 드러내는 표현을 택했습니다.
  doctrine_reference: 성전 환상 본문의 문자적·상징적 긴장
