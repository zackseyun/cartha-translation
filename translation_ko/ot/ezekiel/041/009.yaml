  rationale: mֻנָּח는 문자적으로 ‘놓여 있는/남겨진’ 뜻이지만, 본문이 요구하는 건축적 의미를 살려 ‘남겨진 빈 공간’으로 옮겼습니다. 또한 בֵּית צְלָעוֹת를 곁방들의 배치 사이의 공간으로 이해하는 POB의 수정 취지를 반영했습니다.
theological_decisions:
- issue: 성전 건축 환시의 모호한 마감 구문 처리
  chosen_reading: 마지막 절을 ‘집의 곁방들 사이에 남겨진 빈 공간’으로 옮겨, 본문의 애매함을 과도하게 해소하지 않고 공간 배치를 드러냈습니다.
  alternative_readings:
  - ‘집에 속한 곁방 구조물’
  - ‘곁방들 사이의 열린 공간’
  rationale: 이 절은 문법적으로 난해하므로, POB의 최종 수정처럼 건축적 맥락을 살리되 원문의 불확실성을 유지하는 것이 적절합니다.
  doctrine_reference: 해석학적 주의—난해한 성전 측량 본문
