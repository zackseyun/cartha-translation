translation:
  language: ko
  text: 밖의 곁방에 속한 벽의 너비는 다섯 규빗[a]이었고, 집의 곁방들 사이에 남겨진 빈 공간이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 어렵습니다. 마지막 절은 ‘집에 속한 곁방 구조물’ 또는 이와 비슷하게도 이해할 수 있습니다. 이 절은 성전 건물 주변의 배치를 묘사합니다.
    reason: alternative_reading
