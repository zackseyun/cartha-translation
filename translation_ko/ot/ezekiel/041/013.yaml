base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/013.yaml
  text: 'Then he measured the temple: its length was a hundred cubits; and the separate area[a], the building, and its walls had a length of a hundred cubits.'
  footnotes:
  - marker: a
    text: Or 'the separate place.' The Hebrew term refers to a distinct area set apart in the temple complex.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 성전을 측량하니, 그 길이는 백 규빗이었습니다. 분리된 구역[a]과 건물과 그 벽들의 길이도 백 규빗이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분리된 장소’. 이 히브리어 용어는 성전 구역 안에서 따로 구분된 공간을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָדַד
  english_pob_choice: Then he measured
  chosen_korean: 그가 ... 재어 보니
  alternatives_korean:
  - 그가 측정했습니다
  - 그가 재었습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서 측량 행위를 분명히 드러내기 위해 ‘재어 보니’로 옮겼습니다.
- source_word: הַבַּיִת
  english_pob_choice: the temple
  chosen_korean: 성전
  alternatives_korean:
  - 집
  - 건물
  lexicon: HALOT
  rationale: 에스겔의 성전 환상 문맥에서 בַּיִת는 일반적 ‘집’보다 ‘성전’이 referent를 더 분명하게 전달합니다.
- source_word: הַגִּזְרָה
  english_pob_choice: the separate area
  chosen_korean: 분리된 구역
  alternatives_korean:
  - 분리된 장소
  - 구별된 구역
  lexicon: HALOT
  rationale: 이 용어의 핵심은 성전 परिसर 안에서 따로 떼어 놓은 공간이라는 점이므로, 과도하게 해석하지 않으면서도 구분성을 드러내는 표현을 택했습니다.
- source_word: קִירוֹתֶיהָ
  english_pob_choice: its walls
  chosen_korean: 그 벽들
  alternatives_korean:
  - 그 벽
  - 둘레벽
  lexicon: HALOT
  rationale: 복수형을 살리기 위해 ‘벽들’로 옮겼고, 앞선 복합 명사구를 받아 자연스럽게 지시하도록 ‘그’만 붙였습니다.
theological_decisions:
- issue: 건축 측량 문장의 반복 구조
  chosen_reading: 두 번째 절의 길이도 첫 번째와 마찬가지로 백 규빗이라는 반복을 그대로 유지했습니다.
  alternative_readings:
  - ‘또한’이나 ‘마찬가지로’를 넣어 중복을 완화하는 번역
  - 길이 정보를 한 번만 요약하는 번역
  rationale: 히브리어는 반복을 통해 성전 설계의 정밀성과 대칭성을 강조하므로, 반복을 줄이지 않고 보존하는 것이 본문 효과에 더 충실합니다.
  doctrine_reference: 본문 문맥상 교리 쟁점은 없으며, 서술 강조의 보존에 관한 번역 원칙입니다.
