theological_decisions:
- issue: 희귀 건축 용어 הָעֻבִּים의 처리
  chosen_reading: 형상을 단정하지 않고 ‘덮개들’로 번역해 불확실성을 유지했습니다.
  alternative_readings:
  - 차양들로 특정하기
  - 돌출된 처마들로 구체화하기
  - thresholds처럼 문턱으로 바꾸기
  rationale: 원문과 POB 모두 이 용어의 정확한 뜻을 확정하지 않으므로, 한국어도 해석을 과잉 고정하지 않고 의미 범위를 남겨 두는 것이 원문 충실성에 더 부합합니다.
  doctrine_reference: 성전 환상 본문의 기술적·묘사적 불확실성 보존
- issue: 종려나무의 장식적 함의
  chosen_reading: 본문에는 ‘종려나무들’로 두고, 장식 모티프라는 해석은 본문 밖으로 넘기지 않았습니다.
  alternative_readings:
  - 종려나무 장식들
  - 종려 무늬들
  rationale: POB 주석처럼 장식 모티프일 가능성은 인정되지만, 원문 자체는 구체적 장식어를 쓰지 않으므로 본문 번역은 과도한 설명을 피해야 합니다.
  doctrine_reference: 본문-주석 구분 원칙
