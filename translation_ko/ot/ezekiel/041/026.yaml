source:
  edition: WLC
  text: וְ/חַלּוֹנִ֨ים אֲטֻמ֤וֹת וְ/תִֽמֹרִים֙ מִ/פּ֣וֹ וּ/מִ/פּ֔וֹ אֶל כִּתְפ֖וֹת הָֽ/אוּלָ֑ם וְ/צַלְע֥וֹת הַ/בַּ֖יִת וְ/הָ/עֻבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/026.yaml
  text: And there were shuttered windows and palm trees on this side and on that[a], along the sidewalls of the vestibule, and on the side chambers of the temple[c][b], and the canopies.
  footnotes:
  - marker: a
    text: Or 'closed windows'; the Hebrew describes windows that were shut or screened in some way.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'palm trees,' likely meaning palm-tree decorative motifs in the temple architecture.
    reason: cultural_note
  - marker: c
    text: The meaning of the final term is uncertain; it may refer to projecting roofs, eaves, or other overhanging architectural features.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 한쪽과 다른 쪽에 막힌 창문들과 종려나무들이 있었는데, 현관의 옆벽들과 성전의 곁방들과 덮개들에 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘닫힌 창문들’. 히브리어는 닫혀 있거나 어떤 방식으로 가려진 창문을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘종려나무들’은 아마도 성전 건축의 종려나무 장식 모티프를 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 마지막 용어의 뜻은 분명하지 않으며, 돌출된 지붕, 처마, 또는 다른 돌출 건축 요소를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלּוֹנִים אֲטֻמוֹת
  english_pob_choice: shuttered windows
  chosen_korean: 막힌 창문들
  alternatives_korean:
  - 닫힌 창문들
  - 차단된 창문들
  - 셔터가 내려진 창문들
  lexicon: HALOT
  rationale: 창문의 건축적 의미를 살리면서도 אֲטֻמוֹת의 ‘닫혀 있거나 가려진’ 상태를 무리 없이 반영하는 자연스러운 표현입니다.
- source_word: תִמֹרִים
  english_pob_choice: palm trees
  chosen_korean: 종려나무들
  alternatives_korean:
  - 야자수들
  - 종려나무 장식들
  - 종려 무늬들
  lexicon: HALOT
  rationale: 성전 환상 맥락에서 장식 모티프일 가능성이 크지만, 원문이 직접 말하는 형상은 ‘종려나무’이므로 지나친 해석어보다 표면 의미를 우선했습니다.
- source_word: מִפּוֹ וּמִפּוֹ
  english_pob_choice: on this side and on that
  chosen_korean: 한쪽과 다른 쪽에
  alternatives_korean:
  - 이쪽과 저쪽에
  - 양쪽에
  - 이편과 저편에
  lexicon: HALOT
  rationale: 반복 구조의 분산 배치를 한국어로 간결하게 옮겨, 양측에 대칭적으로 놓였다는 뜻을 드러냈습니다.
- source_word: צַלְעוֹת הַבַּיִת
  english_pob_choice: the side chambers of the temple
  chosen_korean: 성전의 곁방들
  alternatives_korean:
  - 성전의 옆방들
  - 성전의 측실들
  - 성전의 측면 방들
  lexicon: HALOT
  rationale: 건축 문맥에서 צֵלָע를 ‘곁방’으로 옮기면 기능적 구조를 자연스럽게 드러낼 수 있어, ‘temple’의 문맥도 함께 살립니다.
- source_word: הָעֻבִּים
  english_pob_choice: the canopies
  chosen_korean: 덮개들
  alternatives_korean:
  - 차양들
  - 돌출된 처마들
  - 덮개 구조물들
  lexicon: HALOT
  rationale: 이 희귀 건축 용어는 정확한 세부 형상이 불확실하므로, POB의 조심스러운 ‘canopies’에 맞춰 과도한 특정화를 피하는 포괄적 건축어를 택했습니다.
theological_decisions:
- issue: 희귀 건축 용어 הָעֻבִּים의 처리
  chosen_reading: 형상을 단정하지 않고 ‘덮개들’로 번역해 불확실성을 유지했습니다.
  alternative_readings:
  - 차양들로 특정하기
  - 돌출된 처마들로 구체화하기
  - thresholds처럼 문턱으로 바꾸기
  rationale: 원문과 POB 모두 이 용어의 정확한 뜻을 확정하지 않으므로, 한국어도 해석을 과잉 고정하지 않고 의미 범위를 남겨 두는 것이 원문 충실성에 더 부합합니다.
  doctrine_reference: 성전 환상 본문의 기술적·묘사적 불확실성 보존
- issue: 종려나무의 장식적 함의
  chosen_reading: 본문에는 ‘종려나무들’로 두고, 장식 모티프라는 해석은 본문 밖으로 넘기지 않았습니다.
  alternative_readings:
  - 종려나무 장식들
  - 종려 무늬들
  rationale: POB 주석처럼 장식 모티프일 가능성은 인정되지만, 원문 자체는 구체적 장식어를 쓰지 않으므로 본문 번역은 과도한 설명을 피해야 합니다.
  doctrine_reference: 본문-주석 구분 원칙
