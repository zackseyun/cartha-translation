  naturalness: ‘별도의 구역을 마주 보고 서쪽에 있는 건물’은 건축 묘사의 공간 관계를 현대 표준 한국어로 명료하게 표현합니다. 벽에 대해서는 한국어 건축 용례에 맞게 ‘벽 두께’로 표현했습니다.
  terminology: בִּנְיָן은 ‘건물’, גִּזְרָה는 문맥상 ‘별도의 구역’, אַמָּה는 ‘큐빗’으로 옮겼습니다. ‘바다 쪽 길’이라는 히브리어 관용구가 가리키는 서쪽 방향은 본문에 제시하고, 직역은 각주에 보존했습니다.
