base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/007.yaml
  text: And the side chambers became wider as they went around upward and upward[a], because the structure of the temple went around upward and upward all around the temple. Therefore the width of the temple increased upward[c][b], and so one went up from the lowest story to the highest by way of the middle story.
  footnotes:
  - marker: a
    text: Or 'the side rooms.' The Hebrew term can denote side structures or chambers attached to the main building.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase rendered 'the structure of the temple went around' is architecturally difficult; some understand it as an encircling ledge, gallery, or offset in the wall.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''from the lowest to the highest, to the middle.'' The clause is compressed; the sense is ascent from the lower level to the upper by passing through the middle level.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 옆 방들은 위로 올라갈수록 점점 더 넓어졌습니다[a]. 이는 성전 주위의 구조가 성전 둘레를 따라 위로 위로 둘러져 있었기 때문입니다[b]. 그러므로 성전은 위로 갈수록 더 넓어졌고[c], 그래서 사람들은 가장 낮은 층에서 중간 층을 거쳐 가장 높은 층으로 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옆 방들’입니다. 히브리어는 본문 문맥에 따라 성전 옆의 부속 구조나 방들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 이 건축 표현은 난해하여, 둘러싸는 돌출부·갤러리·벽의 오프셋으로 이해하기도 합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘가장 낮은 데서 가장 높은 데로, 중간으로’라는 압축된 표현입니다. 뜻은 낮은 층에서 중간 층을 거쳐 높은 층으로 올라간다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲבָה
  english_pob_choice: became wider
  chosen_korean: 점점 더 넓어졌습니다
  alternatives_korean:
  - 더 넓어졌습니다
  - 넓어졌습니다
  lexicon: HALOT
  rationale: 상태의 변화와 점진성을 함께 살리기 위해 ‘점점 더 넓어졌습니다’로 옮겼습니다.
- source_word: וְנָסְבָה
  english_pob_choice: as they went around upward
  chosen_korean: 위로 올라갈수록
  alternatives_korean:
  - 위로 둘러가면서
  - 위로 올라가며
  lexicon: HALOT
  rationale: 문맥상 옆 방들의 배치가 위쪽으로 진행되는 모습을 자연스럽게 풀어 주되, 둘러 감싸는 구조는 뒤 절에서 보완했습니다.
- source_word: לַצְּלָעוֹת
  english_pob_choice: the side chambers
  chosen_korean: 옆 방들
  alternatives_korean:
  - 측면 방들
  - 곁방들
  lexicon: HALOT
  rationale: 성전 건축 문맥의 צד/צלע 계열 용어를 현대 한국어에서 가장 읽기 쉬운 건축 용어인 ‘옆 방들’로 옮겼습니다.
- source_word: מוּסַב הַבַּיִת
  english_pob_choice: the structure of the temple went around
  chosen_korean: 성전 주위의 구조가 성전 둘레를 따라 위로 위로 둘러져 있었기 때문입니다
  alternatives_korean:
  - 성전을 둘러싼 구조가 위로 위로 둘러져 있었기 때문입니다
  - 성전 주위를 도는 구조가 있었기 때문입니다
  lexicon: HALOT
  rationale: 모호한 건축 용어의 뜻을 단정하지 않고, POB의 ‘went around’ 감각을 살려 둘러 감싸는 구조로 표현했습니다.
- source_word: עַל כֵּן רֹחַב לַבַּיִת לְמָעְלָה
  english_pob_choice: Therefore the width of the temple increased upward
  chosen_korean: 그러므로 성전은 위로 갈수록 더 넓어졌고
  alternatives_korean:
  - 그러므로 성전의 폭은 위로 더 넓어졌고
  - 그러므로 성전은 위쪽으로 폭이 더해졌고
  lexicon: HALOT
  rationale: ‘폭’의 증가를 분명히 하되, 한국어에서는 ‘성전은 위로 갈수록 더 넓어졌고’가 가장 자연스럽고 직역적입니다.
- source_word: וְכֵן הַתַּחְתּוֹנָה יַעֲלֶה עַל הָעֶלְיוֹנָה לַתִּיכוֹנָה
  english_pob_choice: one went up from the lowest story to the highest by way of the middle story
  chosen_korean: 그래서 사람들은 가장 낮은 층에서 중간 층을 거쳐 가장 높은 층으로 올라갔습니다
  alternatives_korean:
  - 그래서 가장 낮은 층에서 중간 층을 지나 가장 높은 층으로 올라갔습니다
  - 그래서 아래층에서 위층으로, 중간 층을 통해 올라갔습니다
  lexicon: HALOT
  rationale: 주어가 압축된 히브리어 구문을 풀어, 층 사이의 상승 동선을 분명하게 드러냈습니다.
theological_decisions:
- issue: 성전 건축의 난해한 구조 표현을 얼마나 구체화할지
  chosen_reading: ‘성전 주위의 구조가 … 둘러져 있었습니다’처럼 구조의 둘러 감싸는 성격만 드러내고, 정확한 형상은 단정하지 않았습니다.
  alternative_readings:
  - ‘성전 둘레의 처마/턱이 있었다’고 더 구체화하는 해석
  - ‘성전이 둘러싸여 있었다’로 더 단순화하는 해석
  rationale: 본문 자체가 건축학적으로 난해하므로, 해석을 과도하게 특정하지 않으면서도 위로 갈수록 넓어지는 이유를 보존하는 것이 적절합니다.
  doctrine_reference: 성전 환상 본문의 문학적-묘사적 성격
