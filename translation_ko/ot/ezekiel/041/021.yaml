  rationale: 이 절은 건물 전체보다 특정 방의 구조를 묘사하므로, 독자가 공간 관계를 즉시 이해하도록 ‘성소’를 택했습니다.
  doctrine_reference: 성전 환상 문맥의 서술 정확성
