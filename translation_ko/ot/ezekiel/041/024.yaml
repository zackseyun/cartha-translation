  source_fidelity: 히브리어는 문들에 각각 두 개의 가동 부분이 있으며, 그것들이 ‘돌아가는/회전하는’ 것이라고 반복적으로 수량을 제시합니다. 초안도 기본 구조와 수량을 따르지만, ‘문짝은 각각 두 짝의 날개’는 전체 문과 구성 문짝의 지시 대상이 혼재되어 원문의 구조를 충분히 명료하게 드러내지 못합니다.
  naturalness: ‘두 짝의 날개’는 현대 한국어 건축·문맥에서 어색하며, ‘문짝’과 ‘날개’를 한 문장 안에서 중첩해 지칭하여 읽기 어렵습니다. ‘문들’과 각 문의 ‘문짝’을 구분하면 자연스럽고 명확합니다.
