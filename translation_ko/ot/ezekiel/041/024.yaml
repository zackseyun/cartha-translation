source:
  edition: WLC
  text: וּ/שְׁתַּ֥יִם דְּלָת֖וֹת לַ/דְּלָת֑וֹת שְׁ֚תַּיִם מוּסַבּ֣וֹת דְּלָת֔וֹת שְׁ֚תַּיִם לְ/דֶ֣לֶת אֶחָ֔ת וּ/שְׁתֵּ֥י דְלָת֖וֹת לָ/אַחֶֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/024.yaml
  text: 'And the doors had two leaves each[a], two turning leaves: two leaves for the one door and two leaves for the other.'
  footnotes:
  - marker: a
    text: Or 'two pivoting leaves' or 'two folding leaves.' The Hebrew term describes leaves that turn, without specifying the exact mechanism.
    reason: lexical_alternative
translation:
  language: ko
  text: 문짝은 각각 두 짝의 날개가 있었고[a], 두 개의 돌아가는 날개가 있었습니다. 한 문에는 두 날개가, 다른 문에도 두 날개가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회전하는 날개’나 ‘접히는 날개’로 옮길 수 있습니다. 히브리어 표현은 날개가 돈다는 뜻을 담지만, 정확한 구조는 특정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּלָתוֹת / דֶּלֶת
  english_pob_choice: doors / door / leaves
  chosen_korean: 문짝 / 날개
  alternatives_korean:
  - 문
  - 문판
  - 문짝들
  lexicon: HALOT
  rationale: 히브리어 דלת는 문 전체와 문짝/문판을 모두 가리킬 수 있으므로, 전체 구조는 ‘문짝’으로, 개별 가동 부분은 ‘날개’로 구분해 POB의 doors/leaves 구별을 살렸습니다.
- source_word: מוּסַבּוֹת
  english_pob_choice: turning
  chosen_korean: 돌아가는
  alternatives_korean:
  - 회전하는
  - 돌축에 맞물린
  - 접히는
  lexicon: HALOT
  rationale: 이 형용사는 날개가 ‘돌 수 있음’을 나타내므로, 정확한 기계 장치를 단정하지 않고 넓게 ‘돌아가는’으로 옮겼습니다.
- source_word: שְׁתַּיִם ... שְׁתַּיִם ... שְׁתַּיִם ... וּשְׁתֵּי
  english_pob_choice: two ... two ... two ... two
  chosen_korean: 두 짝 ... 두 개 ... 두 날개 ... 두 날개
  alternatives_korean:
  - 둘 ... 둘 ... 둘 ... 둘
  - 두 장 ... 두 장 ... 두 장 ... 두 장
  lexicon: HALOT
  rationale: 반복되는 수사를 그대로 살려 구조를 세밀하게 제시하는 본문의 도면식 어조를 보존했습니다.
- source_word: לַ/דְּלָתוֹת
  english_pob_choice: the doors had
  chosen_korean: 문짝은 ... 있었습니다
  alternatives_korean:
  - 문짝을 위해
  - 문짝에
  - 문짝에는
  lexicon: HALOT
  rationale: 전치사 ל의 소유·명세 기능을 한국어에서는 자연스럽게 ‘—은/는 ... 있었습니다’로 풀어, 구조 설명의 문맥을 살렸습니다.
theological_decisions:
- issue: 건축 묘사의 번역에서 과도한 해석을 피할지 여부
  chosen_reading: 기계적 장치의 종류를 특정하지 않고 ‘돌아가는 날개’로 유지했습니다.
  alternative_readings:
  - 접히는 날개
  - 경첩 달린 문짝
  rationale: 본문은 문이 어떻게 움직이는지의 개략만 말하며, 장치의 정확한 형태는 확정하지 않으므로 해석을 넓게 열어 두는 것이 원문에 더 충실합니다.
  doctrine_reference: 본문의 문자적-서술적 성격에 대한 번역 원칙
