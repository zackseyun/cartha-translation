base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/002.yaml
  text: 'And the width of the entrance was ten cubits[a], and the sidewalls of the entrance were five cubits on this side and five cubits on that side. Then he measured its length: forty cubits, and the width: twenty cubits.'
  footnotes:
  - marker: a
    text: Hebrew 'shoulders of the entrance'; that is, the side sections flanking the entrance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 문입구의 너비는 열 규빗[a]이고, 문의 양쪽 곁벽은 이쪽에 다섯 규빗, 저쪽에 다섯 규빗이었습니다. 그가 그 길이를 재니 사십 규빗이었고, 너비는 이십 규빗이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘문입구의 어깨들’이지만, 여기서는 문을 양쪽에서 받치는 측면 구조를 뜻합니다.
    reason: lexical_alternative
