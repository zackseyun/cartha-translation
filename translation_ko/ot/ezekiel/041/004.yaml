  source_fidelity: 측정된 길이와 너비가 각각 이십 규빗이라는 내용과 지성소라는 식별은 충실합니다. 다만 אֶל־פְּנֵי הַהֵיכָל의 공간 관계를 독립된 문장으로 처리하면서 지시 대상이 불명확해졌고, ‘성전’은 הֵיכָל이 가리키는 성전의 본당과 구별하는 편이 더 정확합니다.
  naturalness: ‘그것은 성전의 앞쪽에 있었고, 그가 제게 말했습니다’는 연결이 다소 부자연스럽고, 원문의 공간 관계와 발화 전환을 매끄럽게 드러내지 못합니다. ‘성전 본당 앞쪽에 있는 그 방’으로 문맥상 지시 대상을 밝혀 자연스러운 현대 한국어 문장으로 다듬었습니다.
