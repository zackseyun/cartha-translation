translation:
  language: ko
  text: 그가 그 길이를 측정하니 이십 규빗[a], 너비도 이십 규빗이었습니다. 그것은 성전의 앞쪽에 있었고, 그가 제게 말했습니다. “이것은 지성소입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적으로 ‘지성소’라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  english_pob_choice: Then he measured
  chosen_korean: 그가 측정하니
  alternatives_korean:
  - 그가 재니
  - 그가 측정했습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서 מדד의 기본 의미인 ‘측정하다’를 직접 드러냈습니다.
- source_word: אָרְכּוֹ / וְרֹחַב
  english_pob_choice: its length / and the width
  chosen_korean: 그 길이 / 너비도
  alternatives_korean:
  - 그의 길이 / 그리고 너비
  - 길이 / 폭
  lexicon: HALOT
  rationale: 둘 다 성소의 치수를 말하므로 한국어에서는 소유를 반복하지 않고도 자연스럽게 ‘그 길이, 너비’로 옮겼습니다.
- source_word: אֶל פְּנֵי הַהֵיכָל
  english_pob_choice: before the nave
  chosen_korean: 성전의 앞쪽에
  alternatives_korean:
  - 나베 앞에
  - 성전 현관 앞에
  - 성전 앞에
  lexicon: HALOT
  rationale: הֵיכָל은 이 문맥에서 성전 건물의 주실을 가리키므로, ‘성전의 앞쪽에’로 옮겨 위치 관계를 분명히 했습니다.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  english_pob_choice: the Most Holy Place
  chosen_korean: 지성소
  alternatives_korean:
  - 가장 거룩한 곳
  - 지극히 거룩한 곳
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현이 가리키는 성소 명칭을 한국어 교회·성경 전통에서 널리 알아볼 수 있는 ‘지성소’로 옮겼습니다.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים의 성소 명칭 번역
  chosen_reading: 지성소
  alternative_readings:
  - 가장 거룩한 곳
  - 지극히 거룩한 곳
  - 지성소(‘가장 거룩한 곳’)
  rationale: 이 표현은 지리적 묘사이면서도 성막/성전의 가장 내밀한 거처를 지칭하는 전문 용어이므로, 한국어 성경 독자에게 즉시 인식되는 전통 용어를 채택했습니다.
  doctrine_reference: Translation philosophy §5
