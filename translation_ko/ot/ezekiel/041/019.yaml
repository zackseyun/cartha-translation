translation:
  language: ko
  text: 한쪽에서는 종려나무를 향한 사람의 얼굴이[a], 다른 쪽에서는 종려나무를 향한 어린 사자의 얼굴이 있었으며, 이러한 장식이 성전 전체에 사방으로 만들어져 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “남자의 얼굴 … 어린 사자의 얼굴”로도 옮길 수 있습니다.
