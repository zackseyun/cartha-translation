lexical_decisions:
- source_word: פְנֵי אָדָם
  english_pob_choice: a human face
  chosen_korean: 사람의 얼굴
  alternatives_korean:
  - 인간의 얼굴
  - 남자의 얼굴
  lexicon: HALOT
  rationale: 조각 장식의 대조를 살리면서 אָדָם의 남성 한정 느낌은 피하기 위해 ‘사람의 얼굴’로 옮겼습니다.
- source_word: פְנֵי כְפִיר
  english_pob_choice: a young lion’s face
  chosen_korean: 어린 사자의 얼굴
  alternatives_korean:
  - 젊은 사자의 얼굴
  - 사자 새끼의 얼굴
  lexicon: HALOT
  rationale: כְפִיר의 핵심 뉘앙스는 ‘어린 사자’이므로, 단순히 ‘사자’로 약화하지 않고 연령 감각을 살렸습니다.
- source_word: הַתִּמֹרָה
  english_pob_choice: the palm tree
  chosen_korean: 종려나무
  alternatives_korean:
  - 야자나무
  - 종려무늬
  lexicon: HALOT
  rationale: 성전 장식 문맥의 מוטיב을 자연스럽게 드러내기 위해 ‘종려나무’로 옮겼습니다.
- source_word: סָבִיב סָבִיב
  english_pob_choice: all around
  chosen_korean: 둘레에 둘러져 있습니다
  alternatives_korean:
  - 사방에 둘러져 있습니다
  - 온통 둘러져 있습니다
  lexicon: HALOT
  rationale: 중첩 표현의 둘러싸는 범위를 한국어 자연문으로 압축해, 반복의 강조를 ‘둘러져 있습니다’에 반영했습니다.
theological_decisions:
- issue: 성전 환상 묘사의 수량과 주어 처리
  chosen_reading: 조각 장식들이 성전 전체에 둘러져 있는 상태를 한국어에서 집합적으로 표현했습니다.
  alternative_readings:
  - 그것이 성전 전체에 둘러져 있습니다
  - 그것들은 성전 전체에 둘러져 있습니다
  rationale: 히브리어는 장식 패턴 전체를 요약하는 서술로 읽히므로, 한국어에서는 ‘둘러져 있습니다’로 집합성을 살리되 불필요한 주어 중복을 피했습니다.
  doctrine_reference: 문맥상 묘사문 처리
