  terminology: ‘그룹’은 한국어 성경 전통에서 통용되는 용어이며, 장식 모티프인 ‘종려나무’도 문맥에 적합합니다. ‘두 얼굴’은 본문의 묘사를 불필요하게 해석하지 않고 보존합니다.
