  source_fidelity: 히브리어의 수동 분사 עָשׂוּי를 ‘만들어져 있었고’로 옮겨 제작된 장식의 상태를 적절히 나타냈습니다. 복수의 그룹들과 종려나무들, 그룹과 그룹 사이의 단수·분배적 종려나무, 그리고 각 그룹의 두 얼굴을 모두 충실히 반영합니다. ‘그 위에는’은 앞 문맥의 장식 표면을 가리키는 무리 없는 보충입니다.
