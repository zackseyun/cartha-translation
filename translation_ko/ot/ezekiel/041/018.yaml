id: EZK.41.18
reference: Ezekiel 41:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשׂ֥וּי כְּרוּבִ֖ים וְ/תִֽמֹרִ֑ים וְ/תִֽמֹרָה֙ בֵּין כְּר֣וּב לִ/כְר֔וּב וּ/שְׁנַ֥יִם פָּנִ֖ים לַ/כְּרֽוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/018.yaml
  text: Cherubim and palm trees were made on it[a], with a palm tree between cherub and cherub; and each cherub had two faces.
  footnotes:
  - marker: a
    text: Or 'were carved'; the Hebrew says literally 'made,' and in this architectural context it likely refers to worked or carved decoration.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 위에는 그룹들과 종려나무들이 만들어져 있었고, 그룹과 그룹 사이에는 종려나무가 하나씩 있었으며, 각 그룹에는 두 얼굴이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘새겨져 있었고’. 히브리어는 문자적으로 ‘만들어졌다’라고 하며, 이 건축 문맥에서는 작업되어 새겨진 장식을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּי
  english_pob_choice: were made on it
  chosen_korean: 만들어져 있었고
  alternatives_korean:
  - 새겨져 있었고
  - 조각되어 있었고
  - 지어져 있었고
  lexicon: HALOT
  rationale: 문맥이 성전 장식의 제작 상태를 묘사하므로 ‘만들다’의 수동적 결과를 살리되, 한국어에서는 현재 상태를 나타내는 ‘-어져 있었고’로 자연스럽게 옮겼습니다.
- source_word: כְּרוּבִים
  english_pob_choice: cherubim
  chosen_korean: 그룹들
  alternatives_korean:
  - 케루빔
  - 천사들
  - 그룹
  lexicon: HALOT
  rationale: 에스겔의 성전 장식 맥락에서는 전통적 음역보다 현대 한국어 성경에서 통용되는 ‘그룹’이 더 직접적이며, 복수형은 ‘그룹들’로 표시했습니다.
- source_word: וְתִמֹרִים / וְתִמֹרָה
  english_pob_choice: and palm trees / a palm tree
  chosen_korean: 종려나무들 / 종려나무가 하나씩
  alternatives_korean:
  - 야자나무들 / 야자나무가 하나씩
  - 종려 장식들 / 종려 장식이 하나씩
  lexicon: HALOT
  rationale: 성전 장식의 식물 모티프이므로 문자적으로 ‘종려나무’를 택했고, 반복되는 단수형은 분배적으로 ‘하나씩’으로 풀어 한국어의 어색함을 줄였습니다.
- source_word: בֵּין כְּרוּב לִכְרוּב
  english_pob_choice: between cherub and cherub
  chosen_korean: 그룹과 그룹 사이에는
  alternatives_korean:
  - 그룹 하나와 또 다른 그룹 사이에는
  - 각 그룹 사이에는
  lexicon: HALOT
  rationale: 히브리어의 단수 분배 구조를 한국어에서는 자연스럽게 ‘A와 B 사이’로 옮기되, 반복성을 유지하기 위해 ‘그룹과 그룹 사이’로 표현했습니다.
- source_word: וּשְׁנַיִם פָּנִים לַכְּרוּב
  english_pob_choice: each cherub had two faces
  chosen_korean: 각 그룹에는 두 얼굴이 있었습니다
  alternatives_korean:
  - 각 그룹은 두 얼굴을 가졌습니다
  - 그룹마다 두 얼굴이 있었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘두 얼굴이 그룹에게 있었다’이므로, 한국어에서는 소유 표현으로 정리해 의미를 분명하게 했습니다.
theological_decisions:
- issue: 그룹 형상의 이해
  chosen_reading: 장식적 형상으로만 번역하고, 상징적·천사론적 의미를 덧붙이지 않았습니다.
  alternative_readings:
  - 그룹을 영적 존재로 해석해 확대 번역하는 방식
  - 상징적 의미를 주석처럼 본문에 반영하는 방식
  rationale: 본문은 성전 장식의 외형을 묘사하므로, 본문이 말하지 않는 신학적 해석을 본문 안에 삽입하지 않는 것이 원문 충실성에 더 맞습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension; do not import doctrinal claims not stated by the text.'
