lexical_decisions:
- source_word: וּ/שְׁתַּיִם
  english_pob_choice: two
  chosen_korean: 두
  alternatives_korean:
  - 둘의
  - 한 쌍의
  lexicon: HALOT
  rationale: 문(doors)을 수식하는 수사이므로 한국어에서는 자연스럽게 ‘두’로 옮겼습니다.
- source_word: דְּלָת֛וֹת
  english_pob_choice: doors
  chosen_korean: 문
  alternatives_korean:
  - 문짝
  - 양문
  lexicon: HALOT
  rationale: 히브리어 복수형은 ‘문들’이지만, 한국어 성경 문맥에서는 건축 요소로서 자연스럽고 간결한 ‘문’이 적절합니다.
- source_word: הֵיכָל
  english_pob_choice: nave
  chosen_korean: 주실
  alternatives_korean:
  - 성전 본당
  - 큰 방
  lexicon: HALOT
  rationale: 에스겔 성전 환상 문맥에서 הֵיכָל은 성소와 구별되는 성전의 앞부분 공간을 가리키므로, 기존 한국어 성경어법을 살린 ‘주실’로 옮겼습니다.
- source_word: קֹּדֶשׁ
  english_pob_choice: sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 거룩한 곳
  - 성역
  lexicon: HALOT
  rationale: 여기서는 הֵיכָל과 대구를 이루는 성전 내부의 구획을 가리키므로, 기술적 용어로 널리 쓰이는 ‘성소’가 가장 분명합니다.
theological_decisions:
- issue: 성전 공간 명칭의 번역 수준
  chosen_reading: ‘주실’과 ‘성소’를 병기해, 두 공간이 서로 구별되는 구조적 의미를 드러냈습니다.
  alternative_readings:
  - ‘주실’ 대신 ‘본당’
  - 둘 다 ‘성전’으로 포괄
  rationale: 본문은 두 구역이 각각 별도의 문을 가진다고 말하므로, 구분을 흐리지 않는 번역이 필요합니다.
  doctrine_reference: 성전 환상 본문의 공간 구별
