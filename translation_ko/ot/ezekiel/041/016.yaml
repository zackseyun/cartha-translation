  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/סִּפִּ֡ים וְ/הַ/חַלּוֹנִ֣ים הָ֠/אֲטֻמוֹת וְ/הָ/אַתִּיקִ֤ים סָבִיב֙ לִ/שְׁלָשְׁתָּ֔/ם נֶ֧גֶד הַ/סַּ֛ף שְׂחִ֥יף עֵ֖ץ סָבִ֣יב סָבִ֑יב וְ/הָ/אָ֨רֶץ֙ עַד הַֽ/חַלֹּנ֔וֹת וְ/הַֽ/חַלֹּנ֖וֹת מְכֻסּֽוֹת׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/016.yaml
  text: the thresholds[a], the recessed windows, and the galleries all around on their three sides, opposite the threshold, were paneled with wood all around, from the floor up to the windows[c][b]; and the windows were covered.
  footnotes:
  - marker: a
    text: Or 'closed windows,' 'shuttered windows,' or 'latticed windows'; the Hebrew likely describes a fixed architectural type rather than merely windows that were shut at the moment.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'galleries' is rare and may refer to ledges, colonnades, or upper walkways.
    reason: lexical_alternative
  - marker: c
    text: Or 'a wood facing' / 'wooden sheathing'; the Hebrew expression is rare and refers to wooden covering or paneling.
    reason: lexical_alternative
translation:
  language: ko
  text: 문지방들과 오목하게 들어간 창들과 그 세 면을 둘러싼 갤러리들은 — 맞은편 문지방에 붙어 — 모두 나무로 판벽을 둘렀고, 바닥에서 창들까지였으며, 창들은 가려져 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단순히 ‘닫힌 창’이라기보다 고정된 건축형 창을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀한 건축 용어로, 선반·주랑·상부 통로 등으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘나무로 된 마감’ 또는 ‘나무 판넬’의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפִּים / הַסַּף
  english_pob_choice: the thresholds / the threshold
  chosen_korean: 문지방들 / 문지방
  alternatives_korean:
  - 임계들 / 임계
  - 문설주들 / 문설주
  - 문턱들 / 문턱
  lexicon: HALOT
  rationale: 문지방은 문 아래의 구조물이라는 건축적 의미를 자연스럽게 살리면서, 반복되는 단수/복수 대비도 무리 없이 반영합니다.
- source_word: הַחַלּוֹנִים הָאֲטֻמוֹת
  english_pob_choice: the recessed windows
  chosen_korean: 오목하게 들어간 창들
  alternatives_korean:
  - 닫힌 창들
  - 차폐된 창들
  - 격자창들
  lexicon: HALOT
  rationale: 문맥상 단순히 ‘닫힌’ 상태가 아니라 건축적으로 안쪽으로 들어간 고정형 창을 가리킬 가능성이 있어, 그 공간적 느낌을 살렸습니다.
- source_word: הָאַתִּיקִים
  english_pob_choice: the galleries
  chosen_korean: 갤러리들
  alternatives_korean:
  - 난간통로들
  - 상부 보행로들
  - 발코니들
  lexicon: HALOT
  rationale: 희귀한 건축 용어이므로 확정적 설명을 덧붙이기보다, POB의 ‘galleries’를 따라 구조적 이름으로 옮기고 각주에서 불확실성을 남겼습니다.
- source_word: שְׂחִיף עֵץ
  english_pob_choice: were paneled with wood
  chosen_korean: 나무로 판벽을 둘렀고
  alternatives_korean:
  - 나무로 덮였고
  - 나무 치장을 했고
  - 나무 판으로 입혔고
  lexicon: HALOT
  rationale: 단순 목재 사용이 아니라 내부를 나무로 입힌 마감 상태를 가리키므로, 건축 마감어인 ‘판벽’이 가장 가깝습니다.
- source_word: וְהָאָרֶץ
  english_pob_choice: from the floor
  chosen_korean: 바닥에서
  alternatives_korean:
  - 땅에서
  - 지면에서
  - 아래쪽에서
  lexicon: HALOT
  rationale: 실내 건축 맥락에서는 ‘땅’보다 ‘바닥’이 자연스럽고, 창까지 올라가는 범위를 분명히 해 줍니다.
- source_word: וְהַחַלּוֹנוֹת מְכֻסּוֹת
  english_pob_choice: and the windows were covered
  chosen_korean: 창들은 가려져 있었습니다
  alternatives_korean:
  - 창들은 덮여 있었습니다
  - 창들은 차폐되어 있었습니다
  - 창들은 덮개로 가려져 있었습니다
  lexicon: HALOT
  rationale: מְכֻסּוֹת의 기본 의미인 ‘가리다/덮다’를 살리되, 어떤 덮개인지 특정하지 않도록 중립적으로 옮겼습니다.
