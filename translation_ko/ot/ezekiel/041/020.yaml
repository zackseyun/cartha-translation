id: EZK.41.20
reference: Ezekiel 41:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵ/הָ/אָ֨רֶץ֙ עַד מֵ/עַ֣ל הַ/פֶּ֔תַח הַ/כְּרוּבִ֥ים וְ/הַ/תִּֽמֹרִ֖ים עֲשׂוּיִ֑ם וְ/קִ֖יר הַׄ/הֵׄיׄכָֽׄלׄ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/020.yaml
  text: From the floor to above the entrance[a], cherubim and palm trees were made[b], and on the wall of the nave.
  footnotes:
  - marker: a
    text: Or 'from the ground' or 'from the earth,' if taken more literally; in this architectural setting the sense is the floor level.
    reason: lexical_alternative
  - marker: b
    text: Hebrew heikhal here likely refers specifically to the main hall or nave, not the whole temple complex.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅에서부터 문 어귀 위까지에는 그룹들과 종려나무들이 만들어졌고[b], 또 회랑의 벽에도 그랬습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 히브리어 הֵיכָל는 여기서 성전 전체가 아니라 मुख्य 주실/회랑을 가리키는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהָאָרֶץ
  english_pob_choice: From the floor
  chosen_korean: 땅에서부터
  alternatives_korean:
  - 바닥에서부터
  - 땅바닥에서부터
  lexicon: HALOT
  rationale: 문맥상 건축 내부의 아래쪽 시작점을 가리키므로 ‘floor’의 의미를 살려도 되지만, 한국어에서는 ‘땅’이 더 자연스럽게 아래 기준면을 나타내어 본문 흐름을 해치지 않습니다.
- source_word: עַד מֵעַל הַפֶּתַח
  english_pob_choice: to above the entrance
  chosen_korean: 문 어귀 위까지
  alternatives_korean:
  - 입구 위까지
  - 출입구 위까지
  lexicon: HALOT
  rationale: 수직 범위를 표시하는 구문이므로 ‘~까지’로 살렸고, הַפֶּתַח는 성전 문맥에서 ‘문 어귀’가 가장 무난한 대응입니다.
- source_word: הַכְּרוּבִים
  english_pob_choice: cherubim
  chosen_korean: 그룹들
  alternatives_korean:
  - 그룹 천사들
  - 케루빔
  lexicon: HALOT
  rationale: 성전 시각 장식의 전통적 성서 용어를 유지하되, 한국어 성경에서 통용되는 ‘그룹’을 사용해 낯설지 않으면서도 천사 일반과 구별되게 했습니다.
- source_word: וְהַתִּמֹרִים
  english_pob_choice: and palm trees
  chosen_korean: 종려나무들
  alternatives_korean:
  - 야자나무들
  - 종려 장식들
  lexicon: HALOT
  rationale: עשויים와 함께 장식 조각을 가리키는 문맥이지만, מקור의 명사는 ‘종려나무들’이 가장 직접적이어서 그 형태를 유지했습니다.
- source_word: עֲשׂוּיִם
  english_pob_choice: were made
  chosen_korean: 만들어졌고
  alternatives_korean:
  - 새겨졌고
  - 제작되었고
  lexicon: HALOT
  rationale: 히브리어는 행위의 결과 상태를 말하므로 ‘만들어졌고’가 가장 넓고 충실합니다. 조각·부조의 구체성은 문맥이 보완합니다.
- source_word: וְקִיר הַהֵיכָל
  english_pob_choice: and on the wall of the nave
  chosen_korean: 또 회랑의 벽에도 그랬습니다
  alternatives_korean:
  - 또 성전의 벽에도 그랬습니다
  - 또 본당의 벽에도 그랬습니다
  lexicon: HALOT
  rationale: הֵיכָל는 여기서 성전 전체가 아니라 मुख्य 회랑/내실을 가리키므로, POB의 ‘nave’ 취지를 따라 ‘회랑’으로 옮기고 생략된 관계를 ‘그랬습니다’로 자연스럽게 보완했습니다.
theological_decisions:
- issue: הֵיכָל의 범위
  chosen_reading: ‘회랑’은 성전 전체가 아니라 본문의 장식이 붙은 내부 주실을 가리키는 공간명으로 이해했습니다.
  alternative_readings:
  - ‘성전’으로 넓게 읽는 해석
  - ‘본당’으로 교회식 용어를 쓰는 해석
  rationale: 영어 POB가 ‘nave’로 제한한 것처럼, 문맥상 전체 성전이 아니라 특정 내부 공간을 뜻하므로 범위를 넓히지 않았습니다.
  doctrine_reference: 성전 환상 본문의 문맥적 의미 보존
- issue: 장식의 성격
  chosen_reading: 본문은 벽면 장식의 배치를 말하며, 예배 대상이나 상징 자체를 신학적으로 해설하지 않고 기술적 묘사로 유지했습니다.
  alternative_readings:
  - 상징성을 강조하는 확대 해석
  - 예전적 의미를 덧붙이는 해석
  rationale: 히브리어 동사와 명사는 묘사적이고, 본문 자체가 상징 해석을 요구하지 않으므로 과잉 신학화를 피했습니다.
  doctrine_reference: 본문 기술과 해석의 구분
