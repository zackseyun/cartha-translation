    rationale: ‘재었습니다’ 뒤에 ‘문은 여섯 규빗입니다’와 ‘너비는 일곱 규빗입니다’가 이어집니다. 과거의 환상 서술이므로 과거형으로 통일하는 편이 자연스럽습니다.
