base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/003.yaml
  text: 'Then he went inside and measured the jambs of the entrance: two cubits[a]; the entrance: six cubits[b]; and the width of the entrance: seven cubits.'
  footnotes:
  - marker: a
    text: Or 'the pilasters of the doorway' for 'the jambs of the entrance.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the width of the entrance, seven cubits.' The architectural reference may be difficult; some understand a related structural width rather than the clear opening alone.
    reason: cultural_note
translation:
  language: ko
  text: 그는 안쪽으로 들어가서 문의 문설주들을 재었습니다. 두 규빗[a], 문은 여섯 규빗[b], 그리고 문의 너비는 일곱 규빗입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘문입구의 기둥들’로 볼 수 있습니다. 여기서는 건축적 지지부를 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘문의 너비, 곧 여섯 규빗’으로도 읽을 수 있습니다. 건축적 지시가 다소 어려울 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָא לִפְנִימָה
  english_pob_choice: Then he went inside
  chosen_korean: 그는 안쪽으로 들어가서
  alternatives_korean:
  - 그는 안으로 들어가서
  - 그는 내부로 들어가서
  lexicon: HALOT
  rationale: בוא의 진행 동작을 자연스러운 서술로 살리면서, לִפְנִימָה의 방향성을 ‘안쪽으로’로 간결하게 반영했습니다.
- source_word: אֵיל הַפֶּתַח
  english_pob_choice: the jambs of the entrance
  chosen_korean: 문의 문설주들
  alternatives_korean:
  - 출입문의 기둥들
  - 문 입구의 옆기둥들
  lexicon: HALOT
  rationale: 건축 용어인 אֵיל을 ‘문설주’로 옮겨 측정 대상이 좌우의 세로 구조물임을 분명히 했습니다.
- source_word: שְׁתַּיִם אַמּוֹת / שֵׁשׁ אַמּוֹת / שֶׁבַע אַמּוֹת
  english_pob_choice: two cubits / six cubits / seven cubits
  chosen_korean: 두 규빗 / 여섯 규빗 / 일곱 규빗
  alternatives_korean:
  - 두 자 / 여섯 자 / 일곱 자
  - 두 규 / 여섯 규 / 일곱 규
  lexicon: HALOT
  rationale: 히브리어 길이 단위를 직접 옮겨 본문의 측정 표현을 보존했습니다.
- source_word: וְהַפֶּתַח
  english_pob_choice: the entrance
  chosen_korean: 문은
  alternatives_korean:
  - 입구는
  - 그 문은
  lexicon: HALOT
  rationale: 앞선 ‘문설주들’과 구별되도록 두 번째 측정 대상은 기능적으로 ‘문’으로 옮겨, 개구부 자체의 수치를 자연스럽게 드러냈습니다.
- source_word: וְרֹחַב הַפֶּתַח
  english_pob_choice: and the width of the entrance
  chosen_korean: 문의 너비는
  alternatives_korean:
  - 입구의 너비는
  - 문의 폭은
  lexicon: HALOT
  rationale: רֹחַב을 ‘너비’로 옮겨 평행 구조를 유지하면서, 문 구조의 가로 치수를 직접적으로 표현했습니다.
theological_decisions:
- issue: 성전 환상 속 건축 측정의 직역 정도
  chosen_reading: 본문의 건축 치수는 해석을 덧붙이지 않고 그대로 제시했습니다.
  alternative_readings:
  - 구조적 의미를 풀어써서 ‘문틀의 옆기둥’ 등으로 설명하는 방식
  - 치수의 난점을 해결하려는 의역
  rationale: 문맥상 측정 장면이 핵심이므로, 독자가 수치를 있는 그대로 따라가도록 소박하게 옮기는 것이 원문에 가장 충실합니다.
  doctrine_reference: '본문 해석 원리: 문자적-서술적 본문은 불필요한 조정 없이 전달'
