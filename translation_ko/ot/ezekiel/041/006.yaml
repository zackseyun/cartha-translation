source:
  edition: WLC
  text: וְ/הַ/צְּלָעוֹת֩ צֵלָ֨ע אֶל צֵלָ֜ע שָׁל֧וֹשׁ וּ/שְׁלֹשִׁ֣ים פְּעָמִ֗ים וּ֠/בָאוֹת בַּ/קִּ֨יר אֲשֶׁר לַ/בַּ֧יִת לַ/צְּלָע֛וֹת סָבִ֥יב סָבִ֖יב לִ/הְי֣וֹת אֲחוּזִ֑ים וְ/לֹֽא יִהְי֥וּ אֲחוּזִ֖ים בְּ/קִ֥יר הַ/בָּֽיִת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/006.yaml
  text: And the side chambers were side chamber upon side chamber[a], three and thirty times; and they entered into the wall that belonged to the house for the side chambers all around, so that they might be supported[b], but they were not supported by the wall of the house.
  footnotes:
  - marker: a
    text: Hebrew 'three and thirty times'; this likely refers to thirty-three side chambers or placements rather than repeated actions over time.
    reason: lexical_alternative
  - marker: b
    text: Or 'fastened' / 'held' instead of 'supported' in both occurrences; the Hebrew emphasizes being secured in place.
    reason: lexical_alternative
translation:
  language: ko
  text: 옆방들은 옆방 위에 옆방이 서른세 개씩 있었고[a], 집에 속한 벽에, 집 둘레의 옆방들이 고정되도록 들어가 있었습니다. 그러나 그것들은 집의 벽 자체에는 고정되지 않았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘세와 삼십 번’이라고 합니다. 문맥상 시간의 반복이라기보다 옆방의 수나 배치를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘붙들리도록’ / ‘붙들리지’. 히브리어는 구조적으로 제자리에 단단히 결속되는 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּלָעוֹת / צֵלָע
  english_pob_choice: side chambers / side chamber
  chosen_korean: 옆방들 / 옆방
  alternatives_korean:
  - 측실들 / 측실
  - 곁방들 / 곁방
  lexicon: HALOT
  rationale: 성전 건축 문맥에서 צלע는 문자적 ‘갈비뼈’가 아니라 본체에 붙는 측면 공간을 가리키므로, 의미를 분명히 드러내는 ‘옆방’으로 옮겼습니다.
- source_word: שָׁלוֹשׁ וּשְׁלֹשִׁים פְּעָמִים
  english_pob_choice: three and thirty times
  chosen_korean: 서른셋 번
  alternatives_korean:
  - 세고 삼십 번
  - 서른세 번
  lexicon: HALOT
  rationale: 히브리어의 직역형 수사 표현을 살리면서도 한국어에서는 자연스럽게 읽히도록 ‘서른셋 번’으로 옮겼습니다. 문자형의 거칠음을 완전히 평준화하지 않으려는 취지도 반영했습니다.
- source_word: וּבָאוֹת / לִהְיוֹת אֲחוּזִים / וְלֹא יִהְיוּ אֲחוּזִים
  english_pob_choice: they entered into ... so that they might be supported ... but they were not supported
  chosen_korean: 들어가서 붙들리게 되었지만 / 붙들리지는 않았습니다
  alternatives_korean:
  - 들어가서 고정되게 되었지만 / 고정되지는 않았습니다
  - 들어가서 지탱되게 되었지만 / 지탱되지는 않았습니다
  lexicon: HALOT
  rationale: אחז의 핵심은 ‘붙들다/붙들리다, 고정하다’에 있으므로 건축적 관계를 살려 ‘붙들리다’로 옮겼습니다. 영어 POB의 ‘supported’는 이 구조적 고정성을 풀어 쓴 것이므로, 한국어에서는 더 직접적인 동사를 택했습니다.
- source_word: בַּקִּיר אֲשֶׁר לַבַּיִת / בְּקִיר הַבָּיִת
  english_pob_choice: the wall that belonged to the house / the wall of the house
  chosen_korean: 집에 속한 벽 / 집의 벽
  alternatives_korean:
  - 집에 딸린 벽 / 집의 벽면
  - 집의 벽체 / 집의 벽
  lexicon: HALOT
  rationale: 두 절의 대비를 살리기 위해 첫째는 ‘속한’, 마지막은 ‘집의’로 구분했습니다. 이렇게 해야 옆방들이 본체 벽과는 구별되는 구조에 있음을 드러낼 수 있습니다.
theological_decisions:
- issue: 건축적 אֲחוּזִים의 의미를 ‘supported’로 풀어쓴 POB의 처리
  chosen_reading: ‘붙들리다’로 번역해 구조적 고정성을 드러냈습니다.
  alternative_readings:
  - ‘지탱되다’
  - ‘고정되다’
  - ‘붙어 있다’
  rationale: 이 구절은 성전 구조의 결합 방식 설명이므로, 신학적 완곡화보다 물리적 결속을 직접 드러내는 번역이 원문의 의도에 더 가깝습니다. 영어 POB가 already flagged the architectural securing sense를 한국어에서 더 선명하게 살렸습니다.
  doctrine_reference: 성전 건축 묘사, 본문 서술
- issue: ‘서른셋 번’이라는 수사 표현
  chosen_reading: 히브리어의 수사적 형태를 유지해 반복 배치를 강조했습니다.
  alternative_readings:
  - ‘서른세 번’
  - ‘삼십삼 번’
  rationale: 원문은 ‘세와 삼십’의 형태를 갖고 있어, 자연스러움만을 좇아 완전히 평준화하기보다 원문의 문체를 일정 부분 보존하는 것이 좋습니다.
  doctrine_reference: 본문 수사 보존
