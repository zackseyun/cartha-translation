base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/022.yaml
  text: The altar was of wood[a], three cubits high and two cubits long; its corners, its length, and its sides were of wood. And he said to me, “This is the table that is before Yahweh.”
  footnotes:
  - marker: a
    text: Hebrew begins with “the altar” but then identifies it as “the table,” likely reflecting the furnishing’s altar-like and table-like function.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 제단[a]은 나무로 되어 있었으며, 높이는 세 규빗이고 길이는 두 규빗이었습니다. 그 모퉁이와 길이와 벽면은 나무로 되어 있었습니다. 그가 내게 말했습니다. “이것은 야훼 앞에 있는 상입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 처음에 이를 ‘제단’이라 부르고, 마지막에는 ‘상’이라고 부릅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  english_pob_choice: the altar
  chosen_korean: 그 제단
  alternatives_korean:
  - 그 상
  - 제단-상
  lexicon: HALOT
  rationale: 본문이 먼저 מִזְבֵּחַ를 제시하므로 기본 명칭인 ‘제단’을 살리고, 뒤의 ‘상’과의 긴장을 별도 주석 없이 본문에서 유지했습니다.
- source_word: עֵץ
  english_pob_choice: of wood
  chosen_korean: 나무로 되었고
  alternatives_korean:
  - 나무로
  - 목재로
  lexicon: HALOT
  rationale: 재질을 직접 밝히는 서술이므로 ‘나무로 되었습니다’로 자연스럽게 옮겨, 형용사적 ‘나무의’보다 구조를 분명히 했습니다.
- source_word: וְקִירֹתָיו
  english_pob_choice: its sides
  chosen_korean: 벽들
  alternatives_korean:
  - 옆면들
  - 측벽들
  lexicon: HALOT
  rationale: קִירֹתָיו는 문자적으로 ‘벽들’이지만, 작은 목재 구조물의 구조면이라는 점을 살려 ‘벽들’로 옮겼습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에 있는
  alternatives_korean:
  - 여호와 앞에 있는
  - 주 앞에 있는
  lexicon: project glossary
  rationale: YHWH는 본 프로젝트 기본값에 따라 ‘야훼’로 옮기며, 문맥상 공간적·언약적 위치를 나타내는 ‘앞에 있는’을 유지했습니다.
theological_decisions:
- issue: ‘제단’과 ‘상’의 병행 유지
  chosen_reading: 본문은 앞부분의 ‘제단’과 마지막의 ‘상’을 모두 살려, 이 기구가 제단적 기능과 상의 기능을 함께 지닌다는 긴장을 유지했습니다.
  alternative_readings:
  - 둘 다 ‘제단’으로 통일
  - 둘 다 ‘상’으로 통일
  - ‘제단-상’으로 합성
  rationale: 히브리어가 מִזְבֵּחַ와 שֻׁלְחָן을 함께 쓰므로, 의미를 하나로 평탄화하지 않고 본문의 의도된 중첩을 드러냈습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
