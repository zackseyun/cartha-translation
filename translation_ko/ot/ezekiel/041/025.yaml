source:
  edition: WLC
  text: וַ/עֲשׂוּיָ֨ה אֲלֵי/הֶ֜ן אֶל דַּלְת֤וֹת הַֽ/הֵיכָל֙ כְּרוּבִ֣ים וְ/תִֽמֹרִ֔ים כַּ/אֲשֶׁ֥ר עֲשׂוּיִ֖ם לַ/קִּיר֑וֹת וְ/עָ֥ב עֵ֛ץ אֶל פְּנֵ֥י הָ/אוּלָ֖ם מֵ/הַ/חֽוּץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/025.yaml
  text: And cherubim and palm trees were made on them[a], on the doors of the nave, just as they were made on the walls[c][b]; and there was a wooden canopy before the front of the vestibule outside.
  footnotes:
  - marker: a
    text: Or 'were carved on them' for the passive verb 'were made,' since the context is decorative temple work.
    reason: lexical_alternative
  - marker: b
    text: Or 'the doors of the temple hall' or 'the sanctuary.' The Hebrew הֵיכָל here refers to the main hall of the temple building.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term rendered 'wooden canopy' is uncertain; it may refer to a wooden projection, overhang, or similar architectural feature at the front of the vestibule.
    reason: lexical_alternative
translation:
  language: ko
  text: 그룹들과 종려나무들이 그 문들에, 곧 성소의 문들에 만들어져 있었는데, 벽에 만들어진 것과 꼭 같았습니다[b]; 그리고 현관의 앞바깥쪽에 나무로 된 돌출 구조가 있었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘성전 건물의 문들’ 혹은 ‘성소’. 여기서 히브리어 הֵיכָל은 성전 전체가 아니라 मुख्य 건물의 주요 실내 공간을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 עָב עֵץ는 뜻이 분명하지 않은 건축 용어로, 현관 앞의 나무로 된 돌출부·덮개·차양 같은 구조를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשׂוּיָה אֲלֵיהֶן
  english_pob_choice: were made on them
  chosen_korean: 그 문들에 … 만들어져 있었는데
  alternatives_korean:
  - 그 문들에 … 새겨져 있었는데
  - 그 문들에 … 조각되어 있었는데
  lexicon: HALOT
  rationale: 문맥이 장식 공예이지만, 히브리어 עשה의 넓은 의미를 살려 ‘만들어져 있었다’로 옮겼습니다. 수동적 상태를 유지하되, 장식이 새겨진 맥락은 본문 전체로 드러납니다.
- source_word: דַּלְתוֹת הַהֵיכָל
  english_pob_choice: the doors of the nave
  chosen_korean: 성소의 문들
  alternatives_korean:
  - 성전 건물의 문들
  - 내전의 문들
  lexicon: HALOT
  rationale: הֵיכָל은 여기서 성전 전체가 아니라 내부의 주요 공간을 가리키므로, ‘성소’로 옮겨 공간 관계를 자연스럽게 드러냈습니다. POB의 각주처럼 건축적 맥락의 ‘nave’에 해당하는 핵심 방을 가리킵니다.
- source_word: כְּרוּבִים וְתִמֹרִים
  english_pob_choice: cherubim and palm trees
  chosen_korean: 그룹들과 종려나무들
  alternatives_korean:
  - 그룹들과 종려무늬들
  - 그룹들과 종려 장식들
  lexicon: HALOT
  rationale: 장식 문맥이지만, המקור의 명사를 그대로 살려 천상 존재와 식물 형상을 함께 유지했습니다. ‘종려나무들’은 도상적 형태를 직설적으로 전달합니다.
- source_word: וְעָב עֵץ
  english_pob_choice: a wooden canopy
  chosen_korean: 나무로 된 돌출 구조
  alternatives_korean:
  - 나무로 된 차양
  - 나무로 된 덧지붕
  - 나무로 된 캐노피
  lexicon: HALOT
  rationale: עָב은 의미가 불확실한 건축 용어이므로, 특정 기능을 과도하게 단정하지 않는 중립적 표현을 택했습니다. ‘돌출 구조’는 POB의 ‘canopy’가 가진 돌출/덮개 가능성을 반영하면서도 과잉 해석을 피합니다.
- source_word: אֶל פְּנֵי הָאוּלָם מֵהַחוּץ
  english_pob_choice: before the front of the vestibule outside
  chosen_korean: 현관의 앞바깥쪽에
  alternatives_korean:
  - 바깥의 현관 앞에
  - 현관 앞면 바깥에
  lexicon: HALOT
  rationale: פְּנֵי와 מֵהַחוּץ의 공간 관계를 압축해, 현관의 바깥쪽 전면이라는 뜻이 드러나도록 했습니다. 건축 묘사에서 자연스러운 한국어 어순을 우선했습니다.
theological_decisions:
- issue: 성전 장식의 묘사에서 수동형과 도상적 구체성을 어떻게 반영할지
  chosen_reading: ‘만들어져 있었습니다’로 번역해 본문이 말하는 장식의 사실성을 유지하되, 장식적 조각임을 단정하는 표현은 본문 밖으로 확장하지 않았습니다.
  alternative_readings:
  - ‘새겨져 있었습니다’
  - ‘조각되어 있었습니다’
  rationale: 히브리어는 수동 완료/분사 구조로 장식 작업의 결과를 말하지만, 용례상 ‘만들다’의 범위가 더 넓습니다. 따라서 해석을 과도하게 좁히지 않는 선택이 본문에 더 충실합니다.
  doctrine_reference: 성전 묘사 본문의 문학적·역사적 정확성
