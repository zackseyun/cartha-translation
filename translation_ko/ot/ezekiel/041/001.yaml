source:
  edition: WLC
  text: וַ/יְבִיאֵ֖/נִי אֶל הַ/הֵיכָ֑ל וַ/יָּ֣מָד אֶת הָ/אֵילִ֗ים שֵׁשׁ אַמּ֨וֹת רֹ֧חַב מִ/פּ֛וֹ וְ/שֵׁשׁ אַמּֽוֹת רֹ֥חַב מִ/פּ֖וֹ רֹ֥חַב הָ/אֹֽהֶל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/001.yaml
  text: 'Then he brought me into the nave and measured the jambs: six cubits wide on one side and six cubits wide on the other side—the width of the tent[a][b].'
  footnotes:
  - marker: a
    text: Or 'main hall' or 'sanctuary'; the Hebrew refers to the principal room of the temple building, not the whole temple complex.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'tent.' In this temple-vision context, some understand it as a technical architectural designation and render it 'tabernacle.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 성전으로 데려갔습니다. 그리고 문설주들을 재었는데, 한쪽은 여섯 규빗, 다른 쪽도 여섯 규빗이어서—그 장막의 너비였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주된 방’, ‘성소’. 히브리어는 성전 건물 전체가 아니라 그 주된 방을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘장막’입니다. 이 성전 환상 문맥에서는 어떤 이들은 이를 기술적인 건축 명칭으로 이해하여 ‘성막’으로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיכָל
  english_pob_choice: nave
  chosen_korean: 성전
  alternatives_korean:
  - 내실
  - 본당
  - 성전 본당
  lexicon: HALOT
  rationale: 이 절의 הֵיכָל은 성전 건물의 중심 공간을 가리키므로, 한국어에서는 ‘성전’으로 옮기되, 문설주와 장막의 너비라는 문맥이 이 공간의 측정임을 살렸습니다.
- source_word: אֵילִים
  english_pob_choice: jambs
  chosen_korean: 문설주들
  alternatives_korean:
  - 기둥들
  - 문기둥들
  - 문 양쪽 기둥들
  lexicon: HALOT
  rationale: 입구의 구조물 측정이라는 점에서 freestanding 기둥보다 문설주가 더 정확하며, 복수형을 살려 ‘문설주들’로 옮겼습니다.
- source_word: מִפּוֹ ... מִפּוֹ
  english_pob_choice: on one side ... on the other side
  chosen_korean: 한쪽은 ... 다른 쪽도
  alternatives_korean:
  - 이쪽은 ... 저쪽은
  - 한편은 ... 다른편은
  lexicon: HALOT
  rationale: 두 대응되는 측면을 가리키는 대구 표현이므로, 한국어에서는 자연스럽게 ‘한쪽은 … 다른 쪽도’로 풀어 전달했습니다.
- source_word: אֹהֶל
  english_pob_choice: tent
  chosen_korean: 장막
  alternatives_korean:
  - 텐트
  - 성막
  lexicon: HALOT
  rationale: 직역하면 ‘tent’이지만, 성전 환상 문맥에서 한국어 성서어휘로는 ‘장막’이 가장 자연스럽고, ‘성막’은 문맥상 특정 성막 제도를 과도하게 떠올리게 할 수 있어 피했습니다.
