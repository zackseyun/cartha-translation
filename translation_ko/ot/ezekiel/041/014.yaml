  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רֹחַב֩ פְּנֵ֨י הַ/בַּ֧יִת וְ/הַ/גִּזְרָ֛ה לַ/קָּדִ֖ים מֵאָ֥ה אַמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/014.yaml
  text: And the width of the front of the temple and of the separate area toward the east was a hundred cubits[a][b][c].
  footnotes:
  - marker: a
    text: Or "breadth" instead of "width."
    reason: lexical_alternative
  - marker: b
    text: Hebrew "the house"; in this temple-vision context, this refers to the temple building.
    reason: lexical_alternative
  - marker: c
    text: Or "to the east" or "eastward."
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 성전 앞면과 동쪽의 분리된 구역의 너비는 백 규빗이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “폭”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “집”입니다. 이 성전 환상 문맥에서는 성전 건물을 가리킵니다.
    reason: source_note
  - marker: c
    text: 또는 “동쪽으로” 혹은 “동쪽을 향하여”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹחַב
  english_pob_choice: width
  chosen_korean: 너비
  alternatives_korean:
  - 폭
  - 가로
  lexicon: HALOT
  rationale: 건축적 치수 표현으로서는 현대 한국어의 '너비'가 가장 자연스럽고, 원문의 수평 측정 의미를 직접 살립니다.
- source_word: פְּנֵי הַבַּיִת
  english_pob_choice: the front of the temple
  chosen_korean: 성전 앞면
  alternatives_korean:
  - 성전의 얼굴
  - 성전의 전면
  lexicon: HALOT
  rationale: פְּנֵי는 문자적으로 '얼굴/앞'이지만 여기서는 건축물의 방향·면을 가리키므로 '앞면'이 가장 직접적입니다.
- source_word: הַגִּזְרָה
  english_pob_choice: the separate area
  chosen_korean: 분리된 구역
  alternatives_korean:
  - 별도 구역
  - 구별된 지역
  lexicon: HALOT
  rationale: 에스겔 성전 환상에서 이 용어는 성전 단지 옆에 따로 구획된 공간을 가리키므로, '분리된 구역'이 기능을 분명히 드러냅니다.
- source_word: לַקָּדִים
  english_pob_choice: toward the east
  chosen_korean: 동쪽
  alternatives_korean:
  - 동쪽을 향한
  - 동쪽을 향하여
  lexicon: HALOT
  rationale: 방향 표시는 한국어 공간 표현으로는 '동쪽'이 가장 간결하며, 문맥상 앞에 놓인 명사구의 위치를 설명합니다.
- source_word: מֵאָה אַמָּה
  english_pob_choice: a hundred cubits
  chosen_korean: 백 규빗
  alternatives_korean:
  - 한 백 규빗
  - 백 큐빗
  lexicon: HALOT
  rationale: 고대 치수 단위를 그대로 보존해 원문의 측정값을 유지했습니다.
