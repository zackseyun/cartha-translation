id: EZK.1.19
reference: Ezekiel 1:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/לֶ֨כֶת֙ הַֽ/חַיּ֔וֹת יֵלְכ֥וּ הָ/אוֹפַנִּ֖ים אֶצְלָ֑/ם וּ/בְ/הִנָּשֵׂ֤א הַֽ/חַיּוֹת֙ מֵ/עַ֣ל הָ/אָ֔רֶץ יִנָּשְׂא֖וּ הָ/אוֹפַנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/019.yaml
  text: When the living creatures moved[a], the wheels moved beside them; and when the living creatures were lifted up from the earth[b], the wheels were lifted up.
  footnotes:
  - marker: a
    text: Or 'went' instead of 'moved' for both the creatures and the wheels; the Hebrew uses the same verb for their coordinated motion.
    reason: lexical_alternative
  - marker: b
    text: Ezekiel later identifies these 'living creatures' as cherubim (see Ezekiel 10:20).
    reason: cross_reference
translation:
  language: ko
  text: 그 생물들[a]이 움직일 때에는 바퀴들도 그 곁에서 움직였고, 그 생물들이 땅에서 들려 올라갈 때에는 바퀴들도 들려 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에스겔 10장에서 이 ‘생물들’은 그룹들로 식별됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְלֶכֶת / יֵלְכוּ
  english_pob_choice: When ... moved / moved
  chosen_korean: 움직일 때에는 / 움직였고
  alternatives_korean:
  - 갈 때에는 / 갔고
  - 옮겨질 때에는 / 옮겨졌고
  lexicon: HALOT
  rationale: הלך의 반복을 한국어에서 자연스럽게 살리되, 환상적 공동 운동의 맥락에 맞는 ‘움직이다’를 택해 바퀴와 생물의 연동을 드러냈습니다.
- source_word: הַחַיּוֹת
  english_pob_choice: the living creatures
  chosen_korean: 그 생물들
  alternatives_korean:
  - 그 살아 있는 것들
  - 그 생물체들
  lexicon: HALOT
  rationale: 이 절 자체는 후대 식별을 넣지 않고 חַיּוֹת의 일반적 의미를 유지해야 하므로, ‘생물들’로 옮겨 환상 속 존재를 포괄적으로 남겼습니다.
- source_word: הָאוֹפַנִּים
  english_pob_choice: the wheels
  chosen_korean: 바퀴들
  alternatives_korean:
  - 수레바퀴들
  - 회전하는 것들
  lexicon: HALOT
  rationale: אופן의 기본 의미를 따라 ‘바퀴들’로 옮겼고, 환상 장면의 직관성을 위해 꾸밈을 덧붙이지 않았습니다.
- source_word: אֶצְלָם
  english_pob_choice: beside them
  chosen_korean: 그 곁에서
  alternatives_korean:
  - 그들 곁에서
  - 그 옆에서
  lexicon: HALOT
  rationale: אצל의 근접성을 한국어 관용에 맞게 ‘그 곁에서’로 표현해, 바퀴가 생물과 떨어져 있지 않다는 점을 자연스럽게 살렸습니다.
- source_word: וּבְהִנָּשֵׂא / יִנָּשְׂאוּ
  english_pob_choice: when ... were lifted up / were lifted up
  chosen_korean: 들려 올라갈 때에는 / 들려 올라갔습니다
  alternatives_korean:
  - 들려 올려질 때에는 / 들려 올려졌습니다
  - 올라갈 때에는 / 올라갔습니다
  lexicon: HALOT
  rationale: נשא의 수동적 상승을 살리기 위해 ‘들려 올라가다’를 택해, 생물과 바퀴의 동일한 상승을 반복 구조로 보존했습니다.
theological_decisions:
- issue: 여기서 הַחַיּוֹת를 후대 식별인 ‘그룹들’로 좁힐지 여부
  chosen_reading: 본문의 현재 용어를 따라 ‘그 생물들’로 유지했습니다.
  alternative_readings:
  - 그룹들
  - 천사들
  rationale: 이 절 자체는 일반 명칭을 사용하므로, 에스겔 10장의 후대 식별을 본문에 미리 넣지 않고 긴장을 남겨 두는 것이 원문 우선 원칙에 맞습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; preserve textual tension.'
