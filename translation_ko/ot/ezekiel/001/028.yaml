- source_word: מַרְאֵה הַנֹּגַהּ סָבִיב
  english_pob_choice: the appearance of the brightness all around
  chosen_korean: 그 둘레의 밝은 빛의 모습
  alternatives_korean:
  - 그 둘레의 광휘의 모습
  - 주위의 밝음의 모습
  lexicon: HALOT
  rationale: נֹגַהּ의 빛남/밝음을 ‘밝은 빛’으로 풀어 시각성을 유지했고, סָבִיב은 ‘둘레’로 옮겨 주변을 에워싼 광휘를 살렸습니다.
- source_word: מַרְאֵה דְּמוּת כְּבוֹד יְהוָה
  english_pob_choice: the appearance of the likeness of the glory of Yahweh
  chosen_korean: 야훼의 영광의 형상의 모습
  alternatives_korean:
  - 야훼의 영광의 닮은 모습
  - 야훼의 영광의 모양의 모습
  lexicon: HALOT
  rationale: ‘appearance/likeness/glory’의 겹겹의 수식을 평평하게 만들지 않기 위해 ‘형상’과 ‘모습’을 모두 살려, 직접적 신현이 아니라 ‘영광의 형상처럼 보이는 것’이라는 절제를 유지했습니다.
- source_word: וָאֶשְׁמַע קוֹל מְדַבֵּר
  english_pob_choice: I heard the voice of one speaking
  chosen_korean: 말하는 이의 음성
  alternatives_korean:
  - 말하는 음성
  - 말하는 자의 소리
  lexicon: HALOT
  rationale: 히브리어가 화자를 명시하지 않으므로, 특정 인물을 덧붙이지 않고 ‘말하는 이’로 처리해 불특정성을 보존했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 본문은 하나님의 고유명을 사용하는 비전 보고이므로, 프로젝트 기본값에 따라 칭호인 ‘주’가 아니라 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: Contested terms table for יְהוָה
- issue: ‘영광의 형상의 모습’이라는 중층 표현 보존
  chosen_reading: 영광의 형상의 모습
  alternative_readings:
  - 영광의 모습
  - 형상의 영광
  rationale: 에스겔의 문장은 하나님 본질을 직접 본다고 말하지 않고, 시각적 인식의 층위를 여러 겹으로 제한합니다. 이를 완화하지 않고 유지해 환상 서술의 신학적 절제를 보존했습니다.
  doctrine_reference: Translation philosophy §3
