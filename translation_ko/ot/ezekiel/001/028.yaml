base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/028.yaml
  text: Like the appearance of the rainbow that is in the cloud on a day of rain[a], so was the appearance of the brightness all around. This was the appearance of the likeness of the glory of Yahweh. When I saw it, I fell on my face[d][c][b], and I heard the voice of one speaking.
  footnotes:
  - marker: a
    text: Hebrew 'the bow'; in this context, with cloud and rain, it refers to a rainbow.
    reason: lexical_alternative
  - marker: b
    text: Or 'radiance' for 'brightness.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew expression is literally 'the appearance of the likeness of the glory of the LORD,' preserving multiple layers of qualification in Ezekiel's vision report.
    reason: cultural_note
  - marker: d
    text: Or 'I heard a voice speaking.' The Hebrew does not explicitly identify the speaker in this clause.
    reason: alternative_reading
translation:
  language: ko
  text: 비 오는 날 구름 속에 있는 무지개의 모습과 같이, 사방을 둘러싼 광채의 모습도 그러했습니다[a][b]. 그것은 야훼의 영광의 형상의 모습이었습니다[c]. 내가 그것을 보고 얼굴을 땅에 대고 엎드렸으며, 말하는 이의 음성을 들었습니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘활’이지만, 구름과 비가 함께 나와 여기서는 무지개를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘밝은 빛’ 또는 ‘광휘’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘야훼의 영광의 형상의 모습’이라는 겹친 표현으로, 환상에 대한 여러 겹의 한정을 보존합니다.
    reason: source_note
  - marker: d
    text: 또는 ‘말하는 음성’으로 옮길 수 있습니다. 히브리어는 이 절에서 화자를 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמַרְאֵה / מַרְאֵה
  english_pob_choice: Like the appearance of / the appearance of
  chosen_korean: 모습
