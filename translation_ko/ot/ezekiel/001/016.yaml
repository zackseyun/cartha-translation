  yaml_path: translation/ot/ezekiel/001/016.yaml
  text: The appearance of the wheels and their workmanship was like the gleam of beryl[a], and the four of them had the same likeness; and their appearance and their workmanship were as if a wheel were within a wheel.
  footnotes:
  - marker: a
    text: Hebrew tarshish, a precious stone of uncertain identification; traditionally rendered 'beryl' or 'chrysolite.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바퀴들의 모습과 그들의 솜씨는 황옥[a]의 빛과 같았고, 그 네 바퀴는 같은 모양이었습니다. 또한 그들의 모습과 그들의 솜씨는 마치 바퀴 안에 바퀴가 있는 것 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘타르시스’는 정확한 보석 식별이 확정되지 않았습니다. 전통적으로 ‘황옥’ 또는 ‘녹주석’ 등으로 번역됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה / וּמַרְאֵיהֶם
  english_pob_choice: appearance / their appearance
  chosen_korean: 모습
  alternatives_korean:
  - 겉모양
  - 보이는 형상
  lexicon: HALOT
  rationale: 환상에서 보이는 외형을 가리키므로, 자연스러운 현대어인 ‘모습’으로 옮겨 시각적 인상을 살렸습니다.
- source_word: וּמַעֲשֵׂי/הֶם
  english_pob_choice: their workmanship
  chosen_korean: 그들의 솜씨
  alternatives_korean:
  - 그들의 제작
  - 그들의 구조
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 단순한 ‘일’보다 만들어진 질감과 정교함을 포함하므로, 기계적이기보다 공예적 뉘앙스를 살리는 ‘솜씨’가 적절합니다.
- source_word: כְּעֵין תַּרְשִׁישׁ
  english_pob_choice: like the gleam of beryl
  chosen_korean: 황옥의 빛
  alternatives_korean:
  - 베릴의 빛
  - 벽옥 같은 빛
  lexicon: HALOT
  rationale: תַּרְשִׁישׁ은 정확한 보석 식별이 불확실하므로, 영어 POB의 ‘beryl’에 대응하되 한국어에서는 보석명 자체의 난점을 과도하게 드러내지 않는 ‘황옥의 빛’으로 옮겼습니다.
- source_word: וּדְמוּת אֶחָד לְאַרְבַּעְתָּן
  english_pob_choice: the four of them had the same likeness
  chosen_korean: 그 네 바퀴는 같은 모양이었습니다
  alternatives_korean:
  - 네 바퀴가 하나의 형상이었습니다
  - 그 네 바퀴는 동일한 모습이었습니다
  lexicon: HALOT
  rationale: 압축된 히브리어의 ‘하나의 같음’을 한국어에서는 의미가 분명하도록 풀어, 네 바퀴의 동일성을 직접적으로 드러냈습니다.
- source_word: כַּאֲשֶׁר יִהְיֶה הָאוֹפַן בְּתוֹךְ הָאוֹפָן
  english_pob_choice: as if a wheel were within a wheel
  chosen_korean: 마치 바퀴 안에 바퀴가 있는 것 같았습니다
  alternatives_korean:
  - 바퀴 속에 바퀴가 있는 것 같았습니다
  - 마치 하나의 바퀴 안에 다른 바퀴가 있는 것 같았습니다
  lexicon: HALOT
  rationale: 시각적 비유를 그대로 살리기 위해 직역에 가까운 표현을 택하되, 한국어 문장 흐름에 맞게 자연스럽게 정리했습니다.
