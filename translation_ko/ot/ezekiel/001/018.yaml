source:
  edition: WLC
  text: וְ/גַ֨בֵּי/הֶ֔ן וְ/גֹ֥בַהּ לָ/הֶ֖ם וְ/יִרְאָ֣ה לָ/הֶ֑ם וְ/גַבֹּתָ֗/ם מְלֵאֹ֥ת עֵינַ֛יִם סָבִ֖יב לְ/אַרְבַּעְתָּֽ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/018.yaml
  text: As for their rims[a], they were high and fearsome, and the rims of all four were full of eyes all around.
  footnotes:
  - marker: a
    text: Or 'awesome'; the Hebrew term denotes something that inspires fear or dread.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 가장자리는 높고 두려움을 자아냈으며, 네 바퀴의 가장자리에는 사방으로 눈이 가득했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '경외로운'; 히브리어는 두려움이나 경외를 불러일으키는 대상을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּבֵּיהֶן / גַּבֹּתָם
  english_pob_choice: their rims / the rims
  chosen_korean: 가장자리
  alternatives_korean:
  - 테두리
  - 림
  - 바퀴테
  lexicon: HALOT
  rationale: 환시 문맥의 바퀴 구조를 가리키는 גב는 현대 한국어에서 자연스러운 '가장자리'로 옮기되, 전문 용어를 과도하게 살리지 않아도 이미지를 분명하게 전달할 수 있습니다.
- source_word: גֹבַהּ
  english_pob_choice: high
  chosen_korean: 높고
  alternatives_korean:
  - 높으며
  - 높아
  lexicon: HALOT
  rationale: 명사적 '높이'보다 서술형 '높고'가 문장 흐름에 자연스럽고, 앞뒤 병렬 구조도 잘 살립니다.
- source_word: יִרְאָה
  english_pob_choice: fearsome
  chosen_korean: 두려움을 자아냈으며
  alternatives_korean:
  - 두려웠으며
  - 무섭고
  - 경외로웠으며
  lexicon: HALOT
  rationale: 이 단어는 단순한 '멋짐'이 아니라 두려움과 경외를 불러일으키는 성격을 가리키므로, 전통적 신앙어를 덧씌우지 않고 감정 효과를 드러내는 표현을 택했습니다.
- source_word: מְלֵאֹת עֵינַיִם סָבִיב
  english_pob_choice: full of eyes all around
  chosen_korean: 사방으로 눈이 가득했습니다
  alternatives_korean:
  - 눈으로 가득했습니다
  - 사방에 눈이 가득했습니다
  - 둘레에 눈이 가득했습니다
  lexicon: HALOT
  rationale: '''눈이 가득하다''는 직역을 유지하되, ''사방으로''를 앞에 두어 눈이 둘러싼 상태를 한국어 어순에 맞게 선명하게 나타냈습니다.'
theological_decisions:
- issue: יִרְאָה의 정서적 강도
  chosen_reading: 대상을 경외의 아름다움으로 미화하지 않고, 본문이 의도하는 두려움의 감각을 그대로 드러냈습니다.
  alternative_readings:
  - 경외로웠습니다
  - 놀라웠습니다
  rationale: 환시의 압도성과 기괴함을 약화시키지 않기 위해, 'fearsome'에 대응하는 두려움 중심 표현을 유지했습니다.
  doctrine_reference: 성경 환시의 서술적 강도 보존
