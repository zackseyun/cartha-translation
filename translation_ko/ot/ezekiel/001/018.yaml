  source_fidelity: 히브리어는 바퀴들의 가장자리가 ‘높고’ 두려움을 불러일으키며, 네 바퀴의 가장자리가 모두 사방으로 눈으로 가득하다고 묘사합니다. 초안은 이 의미와 기괴하고 압도적인 환시의 이미지를 대체로 충실히 보존합니다. 다만 ‘네 바퀴의 가장자리’는 네 바퀴 각각의 모든 가장자리라는 분배적 범위를 조금 덜 분명하게 나타낼 수 있습니다.
  naturalness: ‘가장자리는 높고 두려움을 자아냈으며’와 ‘사방으로 눈이 가득했습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘그 바퀴들’로 선행 대상을 밝혀 주고 ‘네 바퀴 모두의’로 범위를 명시하면 독립적으로 읽을 때도 더 명료합니다.
  terminology: ‘가장자리’는 바퀴 문맥에서 가능한 자연스러운 번역이며, 불필요하게 기술적인 ‘림’이나 고어적 표현을 피합니다. יִרְאָה는 하나님께 대한 예배적 ‘경외’로 한정되지 않으므로, 본문의 두려움 유발 의미를 유지한 본문 표현이 적절합니다. 각주 대안은 ‘경외로운’보다 ‘경외심을 불러일으키는’이 현대 한국어에서 자연스럽습니다.
