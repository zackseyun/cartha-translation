  rationale: 히브리어 서술의 연속 동작을 한국어에서도 자연스러운 과거 서술로 재현하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 본문 해석상 장면 묘사이며 교리 쟁점은 없습니다.
