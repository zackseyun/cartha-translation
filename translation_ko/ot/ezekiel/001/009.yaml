  text: חֹֽבְרֹ֛ת אִשָּׁ֥ה אֶל אֲחוֹתָ֖/הּ כַּנְפֵי/הֶ֑ם לֹא יִסַּ֣בּוּ בְ/לֶכְתָּ֔/ן אִ֛ישׁ אֶל עֵ֥בֶר פָּנָ֖י/ו יֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/009.yaml
  text: Their wings were joined[a], each to her sister. As they moved, they did not turn[b]; each one went straight ahead.
  footnotes:
  - marker: a
    text: Hebrew literally, 'a woman to her sister,' an idiom meaning corresponding parts joined to one another.
    reason: lexical_alternative
  - marker: b
    text: Or 'each one went in the direction of its face.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 날개는 서로 맞붙어 있었습니다. 움직일 때에는 돌아서지 않았고, 각각 자기 얼굴이 향한 쪽으로 곧장 갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘한 여자가 그의 자매에게’라는 관용구로, 서로 대응하는 부분이 맞붙어 있음을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘각각 자기 얼굴의 방향으로 갔다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֹבְרֹת
  english_pob_choice: were joined
  chosen_korean: 맞붙어 있었습니다
  alternatives_korean:
  - 연결되어 있었습니다
  - 서로 이어져 있었습니다
  lexicon: HALOT
  rationale: חבר의 결합·접합 의미를 살리되, 날개가 서로 짝지어 붙어 있는 장면을 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: אִשָּׁה אֶל אֲחוֹתָהּ
  english_pob_choice: each to her sister
  chosen_korean: 서로
  alternatives_korean:
  - 각각 자기 짝에게
  - 한쪽이 다른 쪽에게
  lexicon: HALOT
  rationale: 직역하면 ‘여자에게 그 여자의 자매에게’라는 히브리어 관용구이므로, 대응하는 두 부분이 서로 맞물린다는 뜻을 간명하게 반영했습니다.
- source_word: לֹא יִסַּבּוּ
  english_pob_choice: they did not turn
  chosen_korean: 돌아서지 않았고
  alternatives_korean:
  - 돌지 않았고
  - 방향을 바꾸지 않았고
  lexicon: HALOT
  rationale: 이동 중 방향을 틀지 않는다는 뜻을 한국어 동작 서술로 자연스럽게 옮겼습니다.
- source_word: אֶל עֵבֶר פָּנָיו
  english_pob_choice: straight ahead
  chosen_korean: 자기 얼굴이 향한 쪽으로 곧장
  alternatives_korean:
  - 얼굴이 향한 방향으로
  - 앞쪽으로
  lexicon: HALOT
  rationale: 직역상 ‘그의 얼굴의 쪽/방향’이지만, 관용적 의미는 바라보는 방향이므로 ‘자기 얼굴이 향한 쪽’으로 풀어 뜻을 보존했습니다.
theological_decisions:
- issue: 환상 묘사의 시점과 문체
  chosen_reading: 서술문 전체를 과거형의 평서로 유지해 환상 장면의 연속성과 관찰성을 살렸습니다.
  alternative_readings:
