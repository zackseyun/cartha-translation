  text: Their wings were joined[a], each to her sister. As they moved, they did not turn[b]; each one went straight ahead.
  footnotes:
  - marker: a
    text: Hebrew literally, 'a woman to her sister,' an idiom meaning corresponding parts joined to one another.
    reason: lexical_alternative
  - marker: b
    text: Or 'each one went in the direction of its face.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 날개는 서로 이어져 있었습니다.[a] 그들이 움직일 때에는 돌아서지 않았고, 각각 자기 얼굴이 향하고 있는 쪽으로 곧장 나아갔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘한 여자가 자기 자매에게’라는 관용구로, 서로 대응하는 부분이 서로 연결되어 있음을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘각각 자기 얼굴의 방향으로 나아갔다’로도 옮길 수 있습니다.
    reason: alternative_reading
