  text: On the fifth day of the month—it was the fifth year of the exile of King Jehoiachin—[a]
  footnotes:
  - marker: a
    text: Or 'deportation of King Jehoiachin.' The Hebrew גָּלוּת can denote exile or deportation; 'exile' was chosen as the broader and more idiomatic chronological reference.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 달의 다섯째 날이었습니다. 곧 왕 여호야긴의 포로 생활 다섯째 해였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여호야긴 왕의 유배’. 히브리어 גָּלוּת는 유배와 포로 상태를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּ/חֲמִשָּׁה לַ/חֹדֶשׁ
  english_pob_choice: On the fifth day of the month
  chosen_korean: 그 달의 다섯째 날
  alternatives_korean:
  - 그 달의 다섯째 날에
  - 한 달의 다섯째 날
  lexicon: HALOT
  rationale: 히브리어 날짜 표현은 한국어에서도 자연스럽게 ‘그 달의 다섯째 날’로 옮기는 것이 달력 표현의 관용을 가장 잘 살립니다.
- source_word: הִיא
  english_pob_choice: it was
  chosen_korean: 이었습니다
  alternatives_korean:
  - 그때였습니다
  - 곧이었습니다
  lexicon: HALOT
  rationale: 독립 인칭대명사의 회상적·강조적 기능을 한국어의 단정문으로 자연스럽게 반영했습니다.
- source_word: לְ/גָל֖וּת
  english_pob_choice: of the exile
  chosen_korean: 포로 생활
  alternatives_korean:
  - 포로가 된 상태
  - 유배
  lexicon: HALOT
  rationale: גָּלוּת는 단순한 추방 사건보다 ‘포로로 있는 상태’까지 포괄하므로, 연대 표지로는 ‘포로 생활’이 한국어에서 가장 분명하고 자연스럽습니다.
- source_word: הַ/מֶּלֶךְ יוֹיָכִין
  english_pob_choice: King Jehoiachin
  chosen_korean: 왕 여호야긴
  alternatives_korean:
  - 여호야긴 왕
  - 유다 왕 여호야긴
  lexicon: 표준 외래어 표기법, 기존 성경 인명 관용
  rationale: 고유명사는 통용되는 한국어 성경 인명인 ‘여호야긴’을 따르되, 히브리어의 호칭 구조를 유지하기 위해 ‘왕’을 앞에 두었습니다.
theological_decisions:
- issue: גָּלוּת의 시간 기준 표현
  chosen_reading: ‘포로 생활’이라는 상태 중심 표현으로 연대 표지를 옮겼습니다.
  alternative_readings:
  - ‘유배’
  - ‘포로로 끌려감’
  rationale: 이 문맥은 사건 자체보다 바벨론 포로 상태를 기준으로 연대를 계산하는 서술이므로, 상태와 기간을 함께 드러내는 번역이 본문의 기능을 더 잘 살립니다.
  doctrine_reference: 역사서/예언서의 연대 표지 해석
