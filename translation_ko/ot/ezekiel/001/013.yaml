  text: וּ/דְמ֨וּת הַ/חַיּ֜וֹת מַרְאֵי/הֶ֣ם כְּ/גַחֲלֵי אֵ֗שׁ בֹּֽעֲרוֹת֙ כְּ/מַרְאֵ֣ה הַ/לַּפִּדִ֔ים הִ֕יא מִתְהַלֶּ֖כֶת בֵּ֣ין הַ/חַיּ֑וֹת וְ/נֹ֣גַהּ לָ/אֵ֔שׁ וּ/מִן הָ/אֵ֖שׁ יוֹצֵ֥א בָרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/013.yaml
  text: And as for the likeness of the living creatures[a], their appearance was like burning coals of fire, like the appearance of torches; it was moving about among the living creatures, and the fire had brightness[c][b], and from the fire lightning was coming forth.
  footnotes:
  - marker: a
    text: Or, 'like glowing coals of fire' or 'like fiery coals burning.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'it was going back and forth among the living creatures.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''and brightness to the fire''; the sense is that the fire was radiant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 살아 있는 생물들의 모습은 불타는 숯불 같고, 횃불의 모습과 같았습니다. 그것은 살아 있는 생물들 사이를 오가고 있었고, 불에는 빛남이 있었으며, 불 가운데서 번개가 나왔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘타오르는 숯불’ 또는 ‘불타는 숯불’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘살아 있는 생물들 사이를 왔다 갔다 하고 있었다’.
    reason: lexical_alternative
  - marker: c
    text: '히브리어: ‘불에 광채가 있었다’; 뜻은 불이 환하게 빛났다는 것입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת
  english_pob_choice: the likeness of
  chosen_korean: 모습은
  alternatives_korean:
  - 형상은
  - 닮은 모습은
  lexicon: HALOT
  rationale: 문맥상 환상 속에서 보이는 외형을 묘사하므로 ‘모습’이 가장 자연스럽고, ‘likeness’의 관찰적 기능을 살립니다.
- source_word: הַחַיּוֹת
  english_pob_choice: the living creatures
  chosen_korean: 살아 있는 생물들
  alternatives_korean:
  - 살아 있는 피조물들
  - 생물들
  lexicon: HALOT
  rationale: 에스겔 1장의 환상적 존재를 직역에 가깝게 옮기되, 한국어에서 지나치게 기술적인 표현을 피하기 위해 ‘살아 있는 생물들’로 렌더링했습니다.
- source_word: כְ/גַחֲלֵי אֵשׁ בֹּעֲרוֹת
  english_pob_choice: like burning coals of fire
  chosen_korean: 불타는 숯불 같고
  alternatives_korean:
  - 타오르는 숯불 같고
  - 불붙어 있는 숯불 같고
  lexicon: HALOT
  rationale: ‘숯불’이 גַּחֲלִים의 핵심 이미지를 살리고, ‘불타는’으로 계속 타오르는 상태를 반영했습니다.
- source_word: כְ/מַרְאֵה הַ/לַּפִּדִים
  english_pob_choice: like the appearance of torches
  chosen_korean: 횃불의 모습과 같았습니다
  alternatives_korean:
  - 횃불처럼 보였습니다
  - 횃불의 ظاهر과 같았습니다
  lexicon: HALOT
  rationale: לַפִּידִים는 ‘횃불’이 가장 직접적이며, 앞의 비교 구조를 살리기 위해 ‘모습과 같았습니다’로 옮겼습니다.
- source_word: מִתְהַלֶּכֶת בֵּין הַ/חַיּוֹת
  english_pob_choice: it was moving about among the living creatures
  chosen_korean: 그것은 살아 있는 생물들 사이를 오가고 있었고
  alternatives_korean:
  - 그것은 살아 있는 생물들 가운데를 움직이고 있었고
  - 그것은 살아 있는 생물들 사이를 거닐고 있었고
  lexicon: HALOT
  rationale: 히트파엘의 반복적·왕복적 움직임을 ‘오가고 있었다’로 자연스럽게 살렸습니다.
- source_word: נֹגַהּ
  english_pob_choice: brightness
  chosen_korean: 빛남이
  alternatives_korean:
  - 광채가
  - 밝음이
  lexicon: HALOT
  rationale: 명사 נֹגַהּ의 시각적 광휘를 살리기 위해 ‘빛남’으로 옮겼습니다.
- source_word: בָרָק
  english_pob_choice: lightning
  chosen_korean: 번개
  alternatives_korean:
  - 섬광
  - 번갯불
  lexicon: HALOT
  rationale: בָּרָק의 통상적 의미를 따라 ‘번개’로 번역했습니다.
theological_decisions:
- issue: 히브리어 הִיא의 지시 대상
  chosen_reading: 그것은 불과 그 밝음으로 이어지는 환상적 광휘를 가리키는 중성적 지시로 유지했습니다.
  alternative_readings:
  - 한 생물의 개별적 모습을 가리킨다고 볼 수 있습니다.
  - 전체적 ‘모습’ 자체를 인격화한 표현으로 볼 수 있습니다.
  rationale: 문맥상 가장 가까운 선행어는 불빛 이미지이며, 뒤따르는 문장도 불의 밝음과 번개를 계속 묘사하므로, 지시를 불필요하게 특정하지 않고 ‘그것’으로 남겼습니다.
  doctrine_reference: 환상의 모호성을 해소하지 않고 본문이 가진 긴장과 시각적 충격을 보존합니다.
