id: EZK.1.20
reference: Ezekiel 1:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַ֣ל אֲשֶׁר֩ יִֽהְיֶה שָּׁ֨ם הָ/ר֤וּחַ לָ/לֶ֨כֶת֙ יֵלֵ֔כוּ שָׁ֥מָּ/ה הָ/ר֖וּחַ לָ/לֶ֑כֶת וְ/הָ/אוֹפַנִּ֗ים יִנָּשְׂאוּ֙ לְ/עֻמָּתָ֔/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/אוֹפַנִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/020.yaml
  text: Wherever the spirit wanted to go[a], they went there; and the wheels were lifted up alongside them[c][b], because the spirit of the living creature was in the wheels.
  footnotes:
  - marker: a
    text: Or 'wind' or 'breath'; Hebrew רוּחַ can carry any of these senses. Here it refers to the animating or directing spirit in the vision.
    reason: lexical_alternative
  - marker: b
    text: Or 'opposite them' or 'corresponding to them' for 'alongside them.'
    reason: lexical_alternative
  - marker: c
    text: Some readers understand 'spirit' here as a reference to the Spirit of God; the Hebrew does not make that identification explicit.
    reason: alternative_reading
translation:
  language: ko
  text: 영이 가고자 하는 곳마다 그들은 그곳으로 갔으며, 바퀴들도 그들 곁에서 들어 올려졌습니다. 이는 살아 있는 생물의 영이 바퀴들 안에 있었기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바람’, ‘호흡’으로도 옮길 수 있습니다. 히브리어 רוּחַ는 이들 의미를 모두 가질 수 있습니다. 여기서는 환상 속 움직임을 이끄는 영을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들 맞은편에서’, ‘그들에 대응하여’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 일부 독자는 여기의 ‘영’을 하나님의 영에 대한 언급으로 이해하지만, 히브리어 본문은 그것을 분명히 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָרוּחַ / רוּחַ
  english_pob_choice: the spirit / the spirit
  chosen_korean: 영
  alternatives_korean:
  - 바람
  - 호흡
  - 성령
  lexicon: HALOT
  rationale: 이 환상 문맥에서는 շարժ임을 이끄는 내적 원리를 가리키므로, ‘영’이 가장 자연스럽고 원문의 다의성을 보존합니다. ‘성령’으로 단정하지 않아 신학적 긴장을 유지합니다.
- source_word: עַל אֲשֶׁר יִהְיֶה שָּׁם
  english_pob_choice: Wherever
  chosen_korean: 가고자 하는 곳마다
  alternatives_korean:
  - 어디든지
  - 가는 곳마다
  - 그곳 어디에든
  lexicon: HALOT
  rationale: 반복적·분배적 장소 의미를 한국어에서 가장 자연스럽게 드러내기 위해 ‘가고자 하는 곳마다’로 옮겼습니다.
- source_word: לְעֻמָּתָם
  english_pob_choice: alongside them
  chosen_korean: 그들 곁에서
  alternatives_korean:
  - 그들 옆에서
  - 그들 맞은편에서
  - 그들과 나란히
  lexicon: HALOT
  rationale: 환상 속 이동의 동반성을 살리면서, ‘곁에서’가 문맥상 가장 유려하고 과도한 해석을 덜합니다.
- source_word: הַחַיָּה
  english_pob_choice: the living creature
  chosen_korean: 살아 있는 생물
  alternatives_korean:
  - 살아 있는 존재
  - 살아 있는 것
  - 생물
  lexicon: HALOT
  rationale: 에스겔 1장의 용례를 따르되, 단수 집합적 표현을 한국어에서 자연스럽게 살리기 위해 ‘살아 있는 생물’로 번역했습니다.
theological_decisions:
- issue: רוּחַ를 성령으로 특정할지 여부
  chosen_reading: 본문의 식별을 따라 ‘영’으로 유지합니다.
  alternative_readings:
  - 성령
  - 하나님의 영
  rationale: 본문은 이 움직임의 원리를 설명하지만, 그것이 곧 성령이라고 명시하지는 않습니다. 따라서 원문이 허용하는 범위 안에서만 번역해 해석적 확대를 피했습니다.
  doctrine_reference: 환상 본문에서의 신학적 긴장 보존
