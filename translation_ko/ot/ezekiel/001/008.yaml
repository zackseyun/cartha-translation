source:
  edition: WLC
  text: ו/יד/ו אָדָ֗ם מִ/תַּ֨חַת֙ כַּנְפֵי/הֶ֔ם עַ֖ל אַרְבַּ֣עַת רִבְעֵי/הֶ֑ם וּ/פְנֵי/הֶ֥ם וְ/כַנְפֵי/הֶ֖ם לְ/אַרְבַּעְתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/008.yaml
  text: And they had human hands under their wings on their four sides[b][a]; and the four of them had their faces and their wings.
  footnotes:
  - marker: a
    text: 'Hebrew is syntactically compressed: literally, ''and human hands from under their wings on their four sides, and their faces and their wings, to the four of them.'' The translation makes the implied relationships explicit in English.'
    reason: lexical_alternative
  - marker: b
    text: Or 'man’s hands' instead of 'human hands.'
    reason: alternative_reading
translation:
  language: ko
  text: 그 날개 아래, 그들의 사방에는 사람의 손이 있었습니다.[a][b] 그 네 생물은 저마다 얼굴과 날개를 지니고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문장은 매우 압축되어 있습니다. 직역하면 “그들의 날개 아래, 그들의 네 면에 사람의 손들이 있었고, 그 넷에게는 그들의 얼굴과 날개가 있었다”입니다. 번역은 한국어 문법에 맞게 관계를 풀어 나타냈습니다.
    reason: source_note
  - marker: b
    text: ‘사람의’(히브리어 אָדָם)는 ‘인간의’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדוֹת אָדָם
  english_pob_choice: human hands
  chosen_korean: 사람의 손
  alternatives_korean:
  - 인간의 손
  - 사람 손
  lexicon: HALOT
  rationale: אָדָם이 손의 종류를 규정하므로 ‘사람의 손’이 원문의 속성 표현을 자연스럽게 살립니다. ‘인간의 손’도 가능하지만, 본문 묘사에는 ‘사람의 손’이 더 간결합니다.
- source_word: מִתַּחַת כַּנְפֵיהֶם
  english_pob_choice: under their wings
  chosen_korean: 그 날개들 아래에
  alternatives_korean:
  - 그 날개 아래
  - 그들의 날개 밑에
  lexicon: HALOT
  rationale: מִתַּחַת은 위치를 나타내는 ‘아래에/밑에’가 적절하며, 반복되는 시각적 묘사를 살려 ‘날개들 아래에’로 옮겼습니다.
- source_word: עַל אַרְבַּעַת רִבְעֵיהֶם
  english_pob_choice: on their four sides
  chosen_korean: 그 네 면에
  alternatives_korean:
  - 그들의 사방에
  - 네 쪽에
  lexicon: HALOT
  rationale: רִבְעִים 계열은 이 문맥에서 사방/면을 가리키므로, 더 직관적인 ‘네 면’이 공간 배치를 잘 드러냅니다.
- source_word: וּפְנֵיהֶם וְכַנְפֵיהֶם לְאַרְבַּעְתָּם
  english_pob_choice: and the four of them had their faces and their wings
  chosen_korean: 그 네 생물은 얼굴들과 날개들을 가지고 있었습니다
  alternatives_korean:
  - 그 네 생물의 얼굴들과 날개들이 있었습니다
  - 그들의 얼굴과 날개가 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 병렬구조를 한국어에서는 주어-서술 관계로 풀어야 하므로, POB의 해석을 따라 ‘그 네 생물’에 공통으로 귀속되는 특징임을 분명히 했습니다.
theological_decisions:
- issue: 예언 환시의 압축된 문장 구조를 한국어에서 어떻게 풀어쓸지
  chosen_reading: 원문의 병렬성과 시각적 묘사를 살리되, 한국어 문법상 필요한 연결어와 서술어를 보충했습니다.
  alternative_readings:
  - 직역에 가깝게 ‘그리고 손들과 얼굴들과 날개들…’로 옮김
  - 문장 요소를 더 적극적으로 재배열해 의미를 현대적으로 매끈하게 함
  rationale: 이 절은 정보량보다 장면 제시가 중요하므로, 의미를 덜지 않으면서도 한국어로 읽히는 문장으로 정리하는 것이 적절합니다.
  doctrine_reference: '번역 원칙: 원문 압축성 보존과 한국어 가독성의 균형'
- issue: ‘אָדָם’을 일반적 ‘사람’으로 옮길지 ‘인간’으로 옮길지
  chosen_reading: 문맥상 형상 규정이므로 ‘사람의 손’으로 옮겼습니다.
  alternative_readings:
  - 인간의 손
  - 남자의 손
  rationale: 이 표현은 성별을 강조하기보다 생물의 형상을 설명하므로, 불필요한 성별 특정 없이 일반적 인간성을 드러내는 표현이 적합합니다.
  doctrine_reference: 창조/환시 묘사에서의 중립적 인체 표현
