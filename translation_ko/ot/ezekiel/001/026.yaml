  source_fidelity: 수정이 필요합니다. 초안의 ‘그 위에 있는 사람의 모습과 같은 형상’은 히브리어의 공간 표현 עָלָיו מִלְמָעְלָה(그것 위에, 위쪽에)를 인물 묘사 안으로 잘못 결속시킬 여지가 있습니다. 또한 כְּמַרְאֵה와 דְּמוּת의 겹친 유보는 ‘사람의 모습처럼 보이는 형상’으로 더 자연스럽고 충실하게 보존할 수 있습니다.
  naturalness: ‘보석 사파이어’와 ‘그 위에 있는 사람의 모습과 같은 형상’은 현대 표준어에서 다소 부자연스럽고 지시 대상이 불명확합니다. ‘사파이어 보석처럼 보이는’ 및 ‘그 위쪽에는’으로 고치면 문장 구조와 공간 관계가 명료해집니다.
  terminology: ‘궁창’, ‘보좌’, ‘형상’은 환상 문맥과 한국어 성경 전통에서 사용 가능한 용어입니다. 사파이어의 고대 보석 동정 불확실성은 각주로 유지합니다. אָדָם은 단수 인간 같은 모습을 가리키므로, 한국어에서 성별을 불필요하게 특정하지 않는 ‘사람의 모습’은 문맥상 적절합니다.
