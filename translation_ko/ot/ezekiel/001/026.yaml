  text: וּ/מִ/מַּ֗עַל לָ/רָקִ֨יעַ֙ אֲשֶׁ֣ר עַל רֹאשָׁ֔/ם כְּ/מַרְאֵ֥ה אֶֽבֶן סַפִּ֖יר דְּמ֣וּת כִּסֵּ֑א וְ/עַל֙ דְּמ֣וּת הַ/כִּסֵּ֔א דְּמ֞וּת כְּ/מַרְאֵ֥ה אָדָ֛ם עָלָ֖י/ו מִ/לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/026.yaml
  text: And above the expanse that was over their heads was the likeness of a throne[a], in appearance like sapphire stone; and above the likeness of the throne was a likeness with the appearance of a man above it.
  footnotes:
  - marker: a
    text: Or possibly "lapis lazuli stone"; the precise ancient gemstone denoted by Hebrew sappir is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 머리 위에 있는 궁창 위에는 사파이어 보석처럼 보이는 보좌의 형상이 있었고, 그 보좌의 형상 위, 곧 그 위쪽에는 사람의 모습처럼 보이는 형상이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 사피르(sappir)가 가리키는 정확한 고대 보석은 확정되지 않았습니다. 전통적으로 ‘사파이어’로 옮기지만, ‘청금석’일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָקִיעַ
  english_pob_choice: expanse
  chosen_korean: 궁창
  alternatives_korean:
  - 창공
  - 확장된 면
  lexicon: HALOT
  rationale: 에스겔의 환상 맥락에서 하늘의 펼쳐진 면을 가리키는 전통적 용어이므로, 본문의 시각적 공간감을 살리면서도 한국어 성경에서 널리 통용되는 '궁창'을 채택했습니다.
- source_word: דְּמוּת
  english_pob_choice: likeness
  chosen_korean: 형상
  alternatives_korean:
  - 모양
  - 유사
  lexicon: HALOT
  rationale: 히브리어의 반복은 직접 동일시보다 유사성과 간접성을 강조하므로, '형상'으로 옮겨 환상의 층위를 유지했습니다.
- source_word: אֶבֶן סַפִּיר
  english_pob_choice: sapphire stone
  chosen_korean: 보석 사파이어
  alternatives_korean:
  - 사파이어 돌
  - 청금석
  lexicon: HALOT
  rationale: POB의 'sapphire stone'을 따라 보석임을 드러내면서도, 주석 없이도 자연스럽게 읽히도록 '보석 사파이어'로 옮겼습니다.
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 남자
  lexicon: HALOT
  rationale: 여기서는 보좌 위의 인간형 존재를 가리키므로 성별을 고정하는 '남자'보다 중립적인 '사람'이 한국어에서 자연스럽고, 본문의 형상 묘사를 살립니다.
theological_decisions:
- issue: 보좌 위 인물의 묘사에서 직접 동일시를 피하는 층위 유지
  chosen_reading: '''그 위에 있는 사람의 모습과 같은 형상''으로 번역해 דְּמוּת와 כְּמַרְאֵה의 중첩된 유보를 유지했습니다.'
  alternative_readings:
  - '''사람 같은 모습'''
  - '''인간의 형상'''
  rationale: 본문은 하나님의 본질을 곧바로 단정하지 않고 유사성의 언어를 겹쳐 사용하므로, 번역도 그 긴장을 해소하지 않고 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 (신학적 긴장 보존); 에스겔 1장의 환상 언어
