  to: 그들의 머리 위에 있는 궁창 위에는 사파이어 보석처럼 보이는 보좌의 형상이 있었고, 그 보좌의 형상 위, 곧 그 위쪽에는 사람의 모습처럼 보이는 형상이 있었습니다.[a]
  rationale: 보좌와 그 위의 형상이라는 공간 관계를 명료하게 하고, ‘형상’과 ‘~처럼 보이는’이라는 표현으로 히브리어의 의도적인 유사성 언어를 보존했습니다. 사파이어 보석의 동정 불확실성을 알리는 각주도 유지하되 현대 한국어로 다듬었습니다.
