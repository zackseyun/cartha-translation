source:
  edition: WLC
  text: הָיֹ֣ה הָיָ֣ה דְבַר יְ֠הוָה אֶל יְחֶזְקֵ֨אל בֶּן בּוּזִ֧י הַ/כֹּהֵ֛ן בְּ/אֶ֥רֶץ כַּשְׂדִּ֖ים עַל נְהַר כְּבָ֑ר וַ/תְּהִ֥י עָלָ֛י/ו שָׁ֖ם יַד יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/003.yaml
  text: the word of Yahweh came indeed to Ezekiel son of Buzi[a], the priest, in the land of the Chaldeans by the Kebar River[c][b], and there the hand of Yahweh came upon him.
  footnotes:
  - marker: a
    text: Or, 'the word of the LORD certainly came to Ezekiel'—the Hebrew repeats the verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or, 'in the land of the Babylonians'; 'Chaldeans' is the more literal rendering of the Hebrew term.
    reason: lexical_alternative
  - marker: c
    text: Or, 'the hand of the LORD was upon him.'
    reason: alternative_reading
translation:
  language: ko
  text: 여호와의 말씀이 정말로 부시의 아들 에스겔 곧 제사장에게, 갈대아 사람들의 땅, 그발 강가에 임하였고, 거기서 여호와의 손이 그에게 임하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정말로’는 히브리어의 반복형(‘되었다, 되었다’)이 만드는 강조를 반영한 것입니다.
    reason: source_note
  - marker: b
    text: ‘그발 강’은 문맥상 강이나 운하로 이해되며, 한국어에서는 자연스러운 지명 표기를 위해 ‘강가’로 옮겼습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הָיֹה הָיָה
  english_pob_choice: came indeed
  chosen_korean: 정말로 … 임하였고
  alternatives_korean:
  - 분명히 … 임하였고
  - 참으로 … 임하였고
  - 정녕 … 임하였고
  lexicon: WLC; HALOT
  rationale: 히브리어의 반복형은 강한 강조를 나타내므로, 한국어에서는 문장 안에 ‘정말로’로 그 강조를 살리고 서술형 흐름을 자연스럽게 유지했습니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 여호와의 말씀
  alternatives_korean:
  - 여호와의 말
  - 여호와의 메시지
  lexicon: WLC; HALOT
  rationale: 예언 공식에서 דָּבָר는 단순한 ‘말’보다 계시로서의 ‘말씀’이 문맥과 신학적 중량을 더 정확히 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: project glossary / POB audit trail
  rationale: 이 문맥은 기존 POB의 신명 표기를 따르는 서술형 본문으로 처리하는 편이 한국어 성경 독자에게 가장 직접적이며, 문장 전체의 가독성을 해치지 않습니다.
- source_word: עַל נְהַר כְּבָר
  english_pob_choice: by the Kebar River
  chosen_korean: 그발 강가에
  alternatives_korean:
  - 그발 강에서
  - 그발 강 곁에
  - 그발 강변에
  lexicon: WLC; HALOT
  rationale: עַל은 이처럼 수로를 따른 위치를 나타낼 수 있으므로, 한국어에서는 자연스러운 위치 표현인 ‘강가에’로 옮겼습니다.
- source_word: וַתְּהִי עָלָיו שָׁם יַד יְהוָה
  english_pob_choice: and there the hand of Yahweh came upon him
  chosen_korean: 거기서 여호와의 손이 그에게 임하였습니다
  alternatives_korean:
  - 거기서 여호와의 손이 그 위에 있었습니다
  - 거기서 여호와의 손이 그에게 미쳤습니다
  lexicon: WLC; HALOT
  rationale: ‘여호와의 손’은 예언자에게 임하는 강력한 신적 գործող/권능의 관용구이므로, ‘임하다’로 옮겨 원문의 표현과 신학적 긴장을 보존했습니다.
theological_decisions:
- issue: יִהְיָה / wayyiqtol의 종결부 의미와 ‘여호와의 손’ 관용구
  chosen_reading: ‘여호와의 손이 그에게 임하였습니다’로 관용구를 유지해 신적 주도성과 예언자적 소명을 드러냄
  alternative_readings:
  - ‘여호와의 능력이 그에게 임하였습니다’
  - ‘여호와께서 그를 붙드셨습니다’
  rationale: 이 구절은 예언적 체험을 설명하는 관용구이므로, 이를 설명적으로 풀지 않고 유지해야 본문의 힘과 모호성을 함께 살릴 수 있습니다.
  doctrine_reference: 'POB translation philosophy: preserve theological tension and idiom where the source does not specify more narrowly'
