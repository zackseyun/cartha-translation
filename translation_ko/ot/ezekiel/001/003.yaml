  source_fidelity: 히브리어의 강조형 הָיֹה הָיָה는 ‘참으로’로 반영할 수 있으며, 예언 공식 ‘야훼의 말씀’과 ‘야훼의 손’ 관용구도 유지해야 합니다. 마지막 절의 וַתְּהִי는 단순 정태라기보다 발생하는 사건을 나타내므로 ‘그에게 임하였습니다’가 안전합니다. 다만 본문의 יְהוָה는 프로젝트의 확정 표기 및 영어 POB 감사 기록에 맞추어 ‘야훼’로 옮겨야 합니다.
  naturalness: ‘부시의 아들 에스겔 곧 제사장에게, 갈대아 사람들의 땅, 그발 강가에’는 수식 관계와 장소 표현이 쉼표로 분절되어 현대 한국어 문장으로 부자연스럽습니다. ‘제사장인 부시의 아들 에스겔에게, 갈대아 사람들의 땅에서 그발 강가에’로 정리하면 원문의 동격과 두 장소 한정을 명료하게 살릴 수 있습니다.
  terminology: ‘여호와’는 제공된 영어 POB의 ‘Yahweh’ 결정 및 명시된 프로젝트 용어 결정과 불일치합니다. 한국어에서는 ‘야훼’를 사용해야 합니다. ‘말씀’, ‘제사장’, ‘갈대아 사람들’, ‘그발’은 적절합니다.
