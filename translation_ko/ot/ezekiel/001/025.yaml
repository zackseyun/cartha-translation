  rationale: 본문은 아직 말의 내용이나 화자를 밝히지 않으므로, 발화로 확정되는 신학적 해석을 피하고 열린 의미를 유지했습니다.
  doctrine_reference: 성경 본문의 점진적 계시와 문맥 우선 원리
