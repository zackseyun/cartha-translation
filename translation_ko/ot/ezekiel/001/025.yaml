id: EZK.1.25
reference: Ezekiel 1:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִי ק֕וֹל מֵ/עַ֕ל לָ/רָקִ֖יעַ אֲשֶׁ֣ר עַל רֹאשָׁ֑/ם בְּ/עָמְדָ֖/ם תְּרַפֶּ֥ינָה כַנְפֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/025.yaml
  text: And there was a sound from above the expanse that was over their heads[a]; when they stood still[b], they let down their wings.
  footnotes:
  - marker: a
    text: Or 'a voice from above the expanse.' The Hebrew word qol can mean either 'sound' or 'voice'; 'sound' is retained in the main text because the clause does not yet specify articulated speech.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional English: ''firmament'' for ''expanse.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그 expanse 위에 있는 그들의 머리 위에서 소리가 있었습니다[a]. 그들이 서 있을 때, 그들은 날개를 내렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘expanse 위에서 나는 목소리.’ 히브리어 qol은 ‘소리’와 ‘목소리’를 모두 뜻할 수 있지만, 여기서는 아직 분명한 말소리로 특정되지 않으므로 본문에는 ‘소리’를 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  english_pob_choice: a sound
  chosen_korean: 소리
  alternatives_korean:
  - 목소리
  - 음성
  lexicon: HALOT
  rationale: קוֹל은 문맥상 ‘소리’와 ‘음성’이 가능하지만, 아직 발화가 명시되지 않으므로 한국어도 의미를 좁히지 않고 ‘소리’로 두는 것이 가장 자연스럽습니다.
- source_word: לָרָקִיעַ
  english_pob_choice: the expanse
  chosen_korean: 그 expanse
  alternatives_korean:
  - 그 궁창
  - 그 창공
  lexicon: HALOT
  rationale: רָקִיעַ는 전통적 교회어인 ‘궁창’보다 현대 독자가 바로 이해할 수 있는 ‘expanse’를 반영하는 것이 source-direct하며, 본문 맥락의 공간 이미지를 살릴 수 있습니다.
- source_word: בְּעָמְדָם
  english_pob_choice: when they stood still
  chosen_korean: 그들이 서 있을 때
  alternatives_korean:
  - 그들이 멈춰 섰을 때
  - 그들이 서 있을 때
  lexicon: HALOT
  rationale: בְּ + 부정사구는 시간적 상황을 나타내며, 여기서는 생물들의 움직임이 멈춘 순간을 가리키므로 ‘서 있을 때’로 옮기되 ‘still’을 과도하게 해석하지는 않았습니다.
- source_word: תְּרַפֶּינָה כַנְפֵיהֶן
  english_pob_choice: they let down their wings
  chosen_korean: 그들은 날개를 내렸습니다
  alternatives_korean:
  - 그들은 날개를 늘어뜨렸습니다
  - 그들은 날개를 풀었습니다
  lexicon: HALOT
  rationale: רפה의 사역/완화 뉘앙스는 ‘내리다, 늘어뜨리다’가 가장 잘 드러냅니다. 날개의 긴장을 풀어 내려놓는 동작을 한국어로 간결하게 표현했습니다.
theological_decisions:
- issue: קֹול의 의미 범위와 미해결 발화성
  chosen_reading: 소리
  alternative_readings:
  - 목소리
  - 음성
  rationale: 본문은 아직 말의 내용이나 화자를 밝히지 않으므로, 발화로 확정되는 신학적 해석을 피하고 열린 의미를 유지했습니다.
  doctrine_reference: 성경 본문의 점진적 계시와 문맥 우선 원리
