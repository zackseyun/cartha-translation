  text: וּ/דְמ֞וּת עַל רָאשֵׁ֤י הַ/חַיָּה֙ רָקִ֔יעַ כְּ/עֵ֖ין הַ/קֶּ֣רַח הַ/נּוֹרָ֑א נָט֥וּי עַל רָאשֵׁי/הֶ֖ם מִ/לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/022.yaml
  text: And above the heads of the living creatures there was the likeness of an expanse[a], like the appearance of awe-inspiring ice[b], stretched out above their heads from above.
  footnotes:
  - marker: a
    text: Or 'the living beings' / 'the living creatures'; the Hebrew uses a singular collective expression here, though the verse later refers to 'their heads.'
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'crystal.' The Hebrew word more commonly means 'ice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 살아 있는 존재들의 머리 위에는, 위엄 있는 얼음의 모습과 같은 공백의 모양이 있었고, 그것이 그들의 머리 위로 위쪽에서 펼쳐져 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수 집합 표현을 쓰지만, 뒤에서는 ‘그들의 머리’라고 하므로 복수적 집합으로 이해하는 것이 자연스럽습니다.
    reason: source_note
  - marker: b
    text: 전통적으로는 ‘수정’으로 옮기기도 하지만, 히브리어 קֶרַח는 더 흔히 ‘얼음’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת
  english_pob_choice: the likeness of
  chosen_korean: 모양이 있었습니다
  alternatives_korean:
  - 그 모습이 있었습니다
  - 그와 같은 형상이 있었습니다
  lexicon: HALOT
  rationale: דְּמוּת는 단순한 실체 진술보다 비유적 유사성을 드러내므로, 한국어도 직접 동일시하지 않고 ‘모양’으로 옮겨 시각적 유사성을 살렸습니다.
- source_word: הַחַיָּה
  english_pob_choice: the living creatures
  chosen_korean: 살아 있는 존재들
  alternatives_korean:
  - 살아 있는 생물들
  - 살아 있는 피조물들
  lexicon: HALOT
  rationale: 문맥상 뒤의 복수 대명사와 맞물리는 집합적 표현이므로, 영어 POB의 수정 취지를 반영해 복수적 집합성을 드러내는 ‘살아 있는 존재들’로 옮겼습니다.
- source_word: רָקִיעַ
  english_pob_choice: an expanse
  chosen_korean: 공백
  alternatives_korean:
  - 궁창
  - 넓은 펼침
  lexicon: HALOT
  rationale: רָקִיעַ의 핵심은 위로 펼쳐진 넓은 공간/덮임이므로, 전통적 교회어인 ‘궁창’보다 시각적 개방감을 주는 ‘공백’으로 옮겼습니다.
- source_word: הַקֶּרַח הַנּוֹרָא
  english_pob_choice: awe-inspiring ice
  chosen_korean: 위엄 있는 얼음
  alternatives_korean:
  - 경외로운 얼음
  - 두려운 얼음
  lexicon: HALOT
  rationale: קֶרַח는 기본적으로 ‘얼음’이며, נוֹרָא는 단순히 무섭다기보다 경외를 불러일으키는 성격이므로 ‘위엄 있는’으로 다듬어 시각성과 경외감을 함께 살렸습니다.
- source_word: נָטוּי
  english_pob_choice: stretched out
  chosen_korean: 펼쳐져 있었습니다
  alternatives_korean:
  - 펴져 있었습니다
  - 늘어져 있었습니다
  lexicon: HALOT
  rationale: נטה의 수동분사는 위에 넓게 펼쳐진 상태를 가리키므로, 자연스러운 현대 한국어로 ‘펼쳐져 있었습니다’라고 번역했습니다.
theological_decisions:
- issue: 비유적 환상 언어의 보존
  chosen_reading: ‘모양’, ‘같은’, ‘펼쳐져 있었습니다’와 같은 표현을 유지해 에스겔의 환상적 비교를 직접 묘사로 풀어버리지 않았습니다.
  alternative_readings:
  - ‘환한 궁창이 있었습니다’처럼 매끄러운 직접 진술로 단순화
  - ‘얼음 같은 수정’처럼 전통적 독법으로 의미를 재해석
  rationale: 본문은 반복적인 유사 표지를 사용해 환상을 조심스럽게 기술하므로, 그 긴장을 한국어에서도 보존하는 것이 원문 의미를 더 정확히 드러냅니다.
  doctrine_reference: Translation philosophy §3
