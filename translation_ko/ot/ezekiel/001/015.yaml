  text: As I looked at the living creatures[a], behold, one wheel was on the earth beside the living creatures, for each of their four faces.
  footnotes:
  - marker: a
    text: Or 'corresponding to its four faces.' The Hebrew phrase is compact and may describe the wheel as positioned in relation to each creature's four-faced form.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그 생물들을 보니, 보라, 땅 위에 생물들 곁에 바퀴 하나가 있었는데, 각 생물의 네 얼굴에 맞추어 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 네 얼굴에 해당하여’. 히브리어 표현은 매우 압축적이며, 바퀴의 위치가 각 생물의 네 얼굴과 관련됨을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  english_pob_choice: As I looked
  chosen_korean: 내가 … 보니
  alternatives_korean:
  - 내가 보았더니
  - 내가 보니
  - 내가 바라보니
  lexicon: WLC; HALOT
  rationale: 예언 환시의 시각적 진행을 자연스럽게 살리면서, 단순 과거 서술보다 장면 전환의 느낌을 주기 위해 ‘보니’를 택했습니다.
- source_word: הַחַיּוֹת
