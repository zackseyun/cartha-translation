  yaml_path: translation/ot/ezekiel/001/015.yaml
  text: As I looked at the living creatures[a], behold, one wheel was on the earth beside the living creatures, for each of their four faces.
  footnotes:
  - marker: a
    text: Or 'corresponding to its four faces.' The Hebrew phrase is compact and may describe the wheel as positioned in relation to each creature's four-faced form.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 생물들을 보니, 보라, 생물들 곁의 땅 위에 바퀴 하나가 있었는데, 그들의 네 얼굴에 맞닿아 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 네 얼굴에 해당하여’. 히브리어 표현은 매우 압축적이어서, 바퀴가 각 생물의 네 얼굴 형상에 대응해 놓였음을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  english_pob_choice: As I looked
  chosen_korean: 내가 … 보니
  alternatives_korean:
  - 내가 보았더니
  - 내가 보니
  - 내가 바라보니
  lexicon: WLC; HALOT
  rationale: 예언 환시의 시각적 진행을 자연스럽게 살리면서, 단순 과거 서술보다 장면 전환의 느낌을 주기 위해 ‘보니’를 택했습니다.
- source_word: הַחַיּוֹת
  english_pob_choice: the living creatures
  chosen_korean: 생물들
  alternatives_korean:
  - 살아 있는 존재들
  - 살아 있는 생물들
  lexicon: WLC; HALOT
  rationale: 에스겔 1장의 환상 맥락에서 천상적 존재를 가리키므로, 직역적이되 한국어에서 통용되는 ‘생물들’로 옮겼습니다.
- source_word: אוֹפַן אֶחָד
  english_pob_choice: one wheel
  chosen_korean: 바퀴 하나
  alternatives_korean:
  - 한 바퀴
  - 바퀴 한 개
  lexicon: WLC; HALOT
  rationale: 단수 명사와 אחד의 결합을 자연스럽게 드러내기 위해 ‘바퀴 하나’로 옮겼습니다.
- source_word: לְאַרְבַּעַת פָּנָיו
  english_pob_choice: for each of their four faces
  chosen_korean: 그들의 네 얼굴에 맞닿아
  alternatives_korean:
  - 그들의 네 얼굴에 맞추어
  - 그들의 네 얼굴에 해당하여
  - 그들의 네 얼굴에 따라
  lexicon: WLC; HALOT
  rationale: 히브리어의 압축된 관계를 한국어로 풀어, 바퀴가 각 생물의 네 얼굴과 대응하는 위치 관계를 드러냈습니다. 영어 POB가 지적한 분배적 의미를 자연스럽게 반영했습니다.
theological_decisions:
- issue: לְאַרְבַּעַת פָּנָיו의 분배적 관계
  chosen_reading: 각 생물의 네 얼굴과 대응하는 위치 관계로 옮기되, 문장을 지나치게 해석하지는 않았습니다.
  alternative_readings:
  - ‘네 얼굴을 따라’
  - ‘네 얼굴에 맞게’
  rationale: 본문은 바퀴와 네 얼굴의 관계를 압축적으로 말하므로, 분배적 의미는 살리되 환상의 구조를 단정적으로 풀어 쓰지 않는 것이 본문에 충실합니다.
  doctrine_reference: 본문의 긴장을 보존하고, 모호한 환상 묘사를 과도하게 해석하지 않음
