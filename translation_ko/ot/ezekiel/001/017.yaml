  source_fidelity: 원문의 반복된 시간 표현(‘갈 때’)과 네 방향으로의 이동, 그리고 이동 중 방향을 바꾸지 않았다는 뜻은 대체로 반영되어 있습니다. 다만 ‘돌아가지 아니하였습니다’는 되돌아가지 않았다는 의미로도 읽혀, 여기서의 סבב(진행 중 방향을 돌리다)의 뜻을 충분히 드러내지 못합니다.
