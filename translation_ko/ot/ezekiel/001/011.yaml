base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/011.yaml
  text: And their faces and their wings were separated above[a]; each had two joined to one another[b], and two covering their bodies.
  footnotes:
  - marker: a
    text: Or 'were spread out above.' The Hebrew verb primarily means 'were separated/divided,' but in context it may imply that the wings were extended upward.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'for each one, two were joined, each, and two were covering their bodies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 얼굴과 날개는 위쪽으로 갈라져 있었고[a], 각자의 두 날개는 서로 맞닿아 있었으며[b], 두 날개는 그들의 몸을 덮고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '위쪽으로 펼쳐져 있었습니다.' 히브리어 동사는 기본적으로 '분리되다/갈라지다'를 뜻하지만, 문맥상 날개가 위로 뻗은 상태를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면, '각자에게 두 날개가 서로 연결되어 있었고, 두 날개가 그들의 몸을 덮고 있었습니다.'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְנֵיהֶם
  english_pob_choice: their faces
  chosen_korean: 그들의 얼굴
  alternatives_korean:
  - 그들의 얼굴들
  - 그 얼굴
  lexicon: HALOT
  rationale: פָּנִים의 복수형을 살리면서도 한국어에서는 자연스럽게 단수 명사로 옮기는 것이 가장 읽기 좋고, 문맥상 네 생물의 반복 묘사도 유지합니다.
- source_word: פְּרֻדוֹת מִלְמָעְלָה
  english_pob_choice: were separated above
  chosen_korean: 위쪽에서 갈라져 있었고
  alternatives_korean:
  - 위에서 분리되어 있었고
  - 위로 벌어져 있었고
  lexicon: HALOT
  rationale: פרד의 핵심 의미인 분리됨을 살리되, 이 환상적 묘사에서는 '갈라져 있었다'가 한국어로 가장 자연스럽고 시각적입니다.
- source_word: שְׁתַּיִם חֹבְרוֹת אִישׁ
  english_pob_choice: two joined to one another
  chosen_korean: 각자 두 날개는 서로 맞붙어 있었으며
  alternatives_korean:
  - 각자 두 날개는 서로 연결되어 있었으며
  - 각자 두 날개는 서로 붙어 있었으며
  lexicon: HALOT
  rationale: חבר의 '결합/연결'을 반영하면서, 분배적 표현 לְאִישׁ를 '각자'로 살렸습니다. '맞붙다'는 단순 접촉보다 더 긴밀한 결합을 드러냅니다.
- source_word: וּשְׁתַּיִם מְכַסּוֹת אֵת גְּוִיֹתֵיהֶנָה
  english_pob_choice: and two covering their bodies
  chosen_korean: 두 날개는 그들의 몸을 가리고 있었습니다
  alternatives_korean:
  - 두 날개는 그들의 몸을 덮고 있었습니다
  - 두 날개는 그들의 몸을 가리고 있었습니다
  lexicon: HALOT
  rationale: מכסה는 '덮다'가 기본이지만, 몸의 노출을 가린다는 뜻까지 자연스럽게 포함하므로 '가리다'를 선택했습니다.
theological_decisions:
- issue: 환상 묘사의 시각적 성격과 직역성
  chosen_reading: 본문의 도상적 디테일을 최대한 보존하되, 한국어에서는 문장 흐름을 위해 약간의 어순 조정을 허용했습니다.
  alternative_readings:
  - 더 직역적으로 '그들의 얼굴과 그들의 날개는 위쪽에서 분리되어 있었습니다'
  - 더 해설적으로 '위쪽으로 펼쳐져 있었습니다'
  rationale: 히브리어 פְּרֻדוֹת는 기본적으로 '분리됨'이지만, 문맥상 날개의 자세를 시각적으로 떠올리게 합니다. 다만 '펼쳐져 있었다'는 해석적 뉘앙스가 강하므로 본문에는 덜 단정적인 표현을 택했습니다.
  doctrine_reference: 예언서의 환상 묘사는 상징성을 유지하면서도 원문의 감각적 세부를 훼손하지 않는 것이 우선입니다.
