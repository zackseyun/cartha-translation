  to: 서른째 해 넷째 달, 그 달 다섯째 날에, 내가 포로로 끌려간 사람들 가운데 그발 강[a]가에 있을 때 이런 일이 있었습니다. 하늘이 열리고, 나는 하나님의 환상[b]을 보았습니다.
