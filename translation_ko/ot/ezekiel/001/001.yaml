id: EZK.1.1
reference: Ezekiel 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י בִּ/שְׁלֹשִׁ֣ים שָׁנָ֗ה בָּֽ/רְבִיעִי֙ בַּ/חֲמִשָּׁ֣ה לַ/חֹ֔דֶשׁ וַ/אֲנִ֥י בְ/תֽוֹךְ הַ/גּוֹלָ֖ה עַל נְהַר כְּבָ֑ר נִפְתְּחוּ֙ הַ/שָּׁמַ֔יִם וָ/אֶרְאֶ֖ה מַרְא֥וֹת אֱלֹהִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/001.yaml
  text: Now it happened in the thirtieth year[a], in the fourth month, on the fifth day of the month, while I was among the exiles by the Kebar River, the heavens were opened[b], and I saw visions of God.
  footnotes:
  - marker: a
    text: Or possibly 'by the Kebar Canal'; the Hebrew says 'Kebar River,' but the location may have been a major canal in Babylonia.
    reason: cultural_note
  - marker: b
    text: Or 'divine visions' or 'visions from God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 서른째 해[a], 넷째 달, 그 달 다섯째 날, 내가 포로들 가운데서 그발 강 옆에 있었을 때 하늘들이 열렸고, 나는 하나님의 환상들을 보았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 혹은 ‘그발 운하’일 수 있습니다. 히브리어는 ‘그발 강’이라고 말하지만, 그 지명이 바빌로니아의 큰 운하를 가리키는 것일 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘신적 환상들’ 또는 ‘하나님으로부터 온 환상들’일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Now it happened
  chosen_korean: 서른째 해
  alternatives_korean:
  - 그리고 이 일이 있었습니다
  - 그때 일어난 일은
  lexicon: HALOT
  rationale: 히브리어 서술 도입어를 한국어에서는 자연스러운 연대 표지로 풀어, 문맥의 시작을 매끄럽게 열었습니다.
- source_word: בִּשְׁלֹשִׁים שָׁנָה
  english_pob_choice: in the thirtieth year
  chosen_korean: 서른째 해
  alternatives_korean:
  - 삼십 년에
  - 삼십 번째 해에
  lexicon: HALOT
  rationale: 연대 표지의 관용적 표현을 살리되, 현대 한국어에서 읽히는 자연스러운 순서 표현으로 옮겼습니다.
- source_word: עַל נְהַר כְּבָר
  english_pob_choice: by the Kebar River
  chosen_korean: 그발 강 옆에
  alternatives_korean:
  - 그발 강가에
  - 그발 운하 옆에
  lexicon: HALOT
  rationale: נהר를 따라 ‘강’으로 옮기되, 위치 전치사 עַל의 감각을 살려 ‘옆에’로 처리했습니다. 영어 주해가 제시한 ‘운하’ 가능성은 본문 주석으로 남기지 않고 본문에서는 히브리어 표면형을 따랐습니다.
- source_word: נִפְתְּחוּ הַשָּׁמַיִם
  english_pob_choice: the heavens were opened
  chosen_korean: 하늘들이 열렸고
  alternatives_korean:
  - 하늘이 열렸고
  - 하늘이 열려
  lexicon: HALOT
  rationale: 복수형 ‘하늘들’을 유지해 히브리어의 복수 명사를 반영했습니다. 다만 한국어에서는 어색할 수 있으므로 문어체 흐름 속에서 그대로 살렸습니다.
- source_word: מַרְאוֹת אֱלֹהִים
  english_pob_choice: visions of God
  chosen_korean: 하나님의 환상들을
  alternatives_korean:
  - 하나님의 환상을
  - 하나님께서 주신 환상들을
  - 신적 환상들을
  lexicon: HALOT
  rationale: 구문상 ‘하나님’과의 속격 관계를 가장 직접적으로 반영했습니다. ‘환상들’의 복수도 유지하여 히브리어 복수를 놓치지 않았습니다.
theological_decisions:
- issue: מַרְאוֹת אֱלֹהִים의 관계 의미
  chosen_reading: 하나님의 환상들
  alternative_readings:
  - 신적 환상들
  - 하나님으로부터 온 환상들
  rationale: 원문은 환상의 출처와 성격을 모두 열어 둡니다. 본문에서는 ‘하나님의’로 직역해 그 열린 의미를 보존하고, 출처를 단정해 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
