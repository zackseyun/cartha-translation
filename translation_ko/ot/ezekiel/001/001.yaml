  source_fidelity: 히브리어의 날짜 표지, 포로 공동체 안에 있는 화자, 그발 수로 곁이라는 위치, 열린 하늘, 그리고 מַרְאוֹת אֱלֹהִים의 열린 속격 의미는 대체로 반영되었습니다. 그러나 וַיְהִי의 사건 도입 기능이 본문에서 완전히 탈락했고, 원문의 복수형을 한국어에서 기계적으로 재현한 ‘하늘들이’와 ‘환상들을’은 자연스럽지 않습니다. 또한 각주 표지가 해당 어구가 아닌 날짜와 ‘하늘이 열렸다’에 붙어 있어 각주 내용과 맞지 않습니다.
  naturalness: ‘하늘들이’는 현대 표준 한국어 성경 문체에서 부자연스럽습니다. 히브리어의 복수형은 한국어 관용상 ‘하늘’로 옮기는 것이 자연스럽습니다. ‘하나님의 환상들’도 한국어에서는 부자연스러운 복수 명사구이므로, 의미 관계를 좁히지 않는 ‘하나님의 환상’이 적절합니다. ‘그발 강 옆에’보다 ‘그발 강가에’가 자연스럽고, הַגּוֹלָה는 ‘포로로 끌려간 사람들’로 명확히 옮길 수 있습니다.
  terminology: ‘하나님의 환상’은 מַרְאוֹת אֱלֹהִים의 속격을 보존하며, ‘하나님에게서 온’ 또는 ‘신적’으로 한정하지 않습니다. 고유명은 ‘그발’로 유지합니다. 문화적 각주는 ‘그발 강’에, 어휘 대안 각주는 ‘하나님의 환상’에 연결해야 합니다.
