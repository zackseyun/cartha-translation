  text: When they went[a], these went; and when they stood, these stood; and when they were lifted up from above the earth, the wheels were lifted up alongside them[c][b], for the spirit of the living creatures was in the wheels.
  footnotes:
  - marker: a
    text: Or 'the wind' or 'the breath' was in the wheels.
    reason: lexical_alternative
  - marker: b
    text: Or 'corresponding to them' or 'opposite them' for 'alongside them.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the living creature' is singular, possibly referring collectively to the living beings as a unified reality.
    reason: lexical_alternative
