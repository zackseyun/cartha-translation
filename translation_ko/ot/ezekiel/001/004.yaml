id: EZK.1.4
reference: Ezekiel 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֵ֡רֶא וְ/הִנֵּה֩ ר֨וּחַ סְעָרָ֜ה בָּאָ֣ה מִן הַ/צָּפ֗וֹן עָנָ֤ן גָּדוֹל֙ וְ/אֵ֣שׁ מִתְלַקַּ֔חַת וְ/נֹ֥גַֽהּ ל֖/וֹ סָבִ֑יב וּ/מִ֨/תּוֹכָ֔/הּ כְּ/עֵ֥ין הַ/חַשְׁמַ֖ל מִ/תּ֥וֹךְ הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/004.yaml
  text: And I looked[a], and behold, a storm wind was coming from the north, a great cloud with fire flashing continually, and brightness all around it; and from its midst was something like the appearance of glowing metal[c][b], from the midst of the fire.
  footnotes:
  - marker: a
    text: Or 'a whirlwind.' The Hebrew phrase can denote a violent windstorm; traditional English often has 'whirlwind.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew hashmal, a rare term of uncertain meaning; possibly 'electrum' or 'amber-like glow.'
    reason: lexical_alternative
  - marker: c
    text: Or 'fire infolding itself' (traditional rendering). The Hebrew expression is difficult and may describe fire in continual, self-intensifying motion.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 보니[a], 북쪽에서 폭풍 같은 바람이 불어오고 있었고, 큰 구름과 계속 번쩍이는 불[c]이 있었으며, 그 둘레에는 광채가 있었습니다. 그 가운데에서 불 한가운데로부터 빛나는 금속 같은 것이 보였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 보았다’. 예언자의 환시 서술에서 이 표현은 장면에 주의를 환기하는 기능을 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘하슈말’(hashmal)은 뜻이 불확실한 희귀어입니다. ‘호박’ 또는 ‘일렉트럼’(금과 은의 합금)으로 이해하기도 합니다.
    reason: lexical_alternative
  - marker: c
    text: 전통적으로는 ‘불이 자기 안으로 휘감긴 것’으로도 옮깁니다. 히브리어 표현은 어렵고, 계속해서 스스로 번져 가거나 강해지는 불의 움직임을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא / וְהִנֵּה
  english_pob_choice: And I looked[a], and behold
  chosen_korean: 내가 보니[a]
  alternatives_korean:
  - 내가 보았는데
  - 내가 보니, 보라
  lexicon: HALOT
  rationale: 예언 환시의 즉시성과 주목 환기 기능을 살리기 위해 단순 과거보다 ‘내가 보니’를 택했습니다. ‘보라’는 ‘보라’류 감탄을 더할 수 있지만 한국어에서는 중복감이 있어 줄였습니다.
- source_word: רוּחַ סְעָרָה
  english_pob_choice: a storm wind
  chosen_korean: 폭풍바람
  alternatives_korean:
  - 폭풍의 바람
  - 회오리바람
  - 폭풍우 같은 바람
  lexicon: HALOT
  rationale: 히브리어는 반드시 특정한 소용돌이 형태를 뜻하지 않으므로, 전통적 ‘회오리바람’보다 일반적이고 직역에 가까운 ‘폭풍바람’으로 옮겼습니다.
- source_word: נֹגַהּ לוֹ סָבִיב
  english_pob_choice: brightness all around it
  chosen_korean: 그 둘레에는 빛이 둘러싸고 있었습니다
  alternatives_korean:
  - 그 주위에 밝음이 있었습니다
  - 그 둘레에 광채가 있었습니다
  lexicon: HALOT
  rationale: סָבִיב의 포위적 의미를 살려 ‘둘레에는…둘러싸고’로 표현했습니다. ‘brightness’를 단순히 ‘광채’로만 처리하기보다, 시각적 둘러쌈을 드러내는 쪽을 택했습니다.
- source_word: הַחַשְׁמַל
  english_pob_choice: glowing metal[b]
  chosen_korean: 마치 빛나는 금속 같은 모습
  alternatives_korean:
  - 마치 반짝이는 금속 같은 모습
  - 마치 호박빛 같은 모습
  - 마치 전기금속 같은 모습
  lexicon: HALOT
  rationale: חַשְׁמַל은 의미가 불확실한 희귀어이므로, 특정 물질로 단정하지 않고 POB의 신중한 해석을 따라 ‘마치 … 같은 모습’으로 처리했습니다. ‘빛나는 금속’은 시각적 인상은 살리되 과도한 특정화를 피합니다.
- source_word: מִתּוֹךְ הָאֵשׁ
  english_pob_choice: from the midst of the fire
  chosen_korean: 불 한가운데에서
  alternatives_korean:
  - 불의 한가운데에서
  - 불 속 한가운데에서
  - 불 가운데서
  lexicon: HALOT
  rationale: 반복되는 ‘가운데/한가운데’ 구조를 살려 장면의 층위를 드러냈습니다. 한국어로는 자연스럽게 ‘불 한가운데에서’라고 옮길 수 있습니다.
theological_decisions:
- issue: 환시 이미지의 해석 절제
  chosen_reading: ‘마치 빛나는 금속 같은 모습’처럼 비교어를 유지해, 본문이 의도한 모호성과 경외감을 보존했습니다.
  alternative_readings:
  - ‘호박’이나 ‘전기금속’처럼 더 구체적으로 특정하는 해석
  - ‘불이 자기 안으로 휘감긴 모습’처럼 전통역을 채택하는 해석
  rationale: 본문은 이 물체의 정체를 확정하지 않고 비유적으로 묘사합니다. 번역도 그 긴장을 유지해야 하므로, 판정을 내리지 않는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
