  to: 내가 보니[a], 북쪽에서 폭풍 같은 바람이 불어오고 있었고, 큰 구름과 계속 번쩍이는 불[c]이 있었으며, 그 둘레에는 광채가 있었습니다. 그 가운데에서 불 한가운데로부터 빛나는 금속 같은 것이 보였습니다[b].
  rationale: 구름·불·광채의 병렬적 영상 구성을 더 정확히 드러내고, 한국어 어색함을 해소했습니다. חַשְׁמַל에 대한 비유와 불확정성을 보존했으며, ‘가운데’의 반복과 불 속에서 나오는 듯한 묘사도 유지했습니다. 각주 표지는 각각 관련 어구 바로 뒤에 배치했습니다.
