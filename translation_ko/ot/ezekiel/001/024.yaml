source:
  edition: WLC
  text: וָ/אֶשְׁמַ֣ע אֶת ק֣וֹל כַּנְפֵי/הֶ֡ם כְּ/קוֹל֩ מַ֨יִם רַבִּ֤ים כְּ/קוֹל שַׁדַּי֙ בְּ/לֶכְתָּ֔/ם ק֥וֹל הֲמֻלָּ֖ה כְּ/ק֣וֹל מַחֲנֶ֑ה בְּ/עָמְדָ֖/ם תְּרַפֶּ֥ינָה כַנְפֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/024.yaml
  text: And I heard the sound of their wings[a], like the sound of many waters, like the sound of the Almighty when they went, a sound of tumult like the sound of an army camp. When they stood still[b], they lowered their wings.
  footnotes:
  - marker: a
    text: Or 'like the sound of Shaddai.' The Hebrew uses the divine title שַׁדַּי, traditionally rendered 'the Almighty.'
    reason: lexical_alternative
  - marker: b
    text: Or 'like the sound of a camp'; the Hebrew מַחֲנֶה often refers to a military camp, hence 'army camp.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들의 날개가 내는 소리를 들었습니다. 그것은 많은 물소리 같고, 그들이 갈 때에는 전능하신 분[a]의 소리 같았으며, 큰 소란의 소리, 곧 군영[b]의 소리 같았습니다. 그들이 서 있을 때에는 그들의 날개를 내렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘샤다이의 소리’. 히브리어는 신적 칭호 שַׁדַּי를 사용하며, 전통적으로 ‘전능하신 이’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘진영의 소리’. 히브리어 מַחֲנֶה는 흔히 군사 진영을 가리키므로 ‘군영’으로 옮길 수 있습니다.
    reason: lexical_alternative
