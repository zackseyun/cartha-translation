id: EZK.1.24
reference: Ezekiel 1:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶשְׁמַ֣ע אֶת ק֣וֹל כַּנְפֵי/הֶ֡ם כְּ/קוֹל֩ מַ֨יִם רַבִּ֤ים כְּ/קוֹל שַׁדַּי֙ בְּ/לֶכְתָּ֔/ם ק֥וֹל הֲמֻלָּ֖ה כְּ/ק֣וֹל מַחֲנֶ֑ה בְּ/עָמְדָ֖/ם תְּרַפֶּ֥ינָה כַנְפֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/024.yaml
  text: And I heard the sound of their wings[a], like the sound of many waters, like the sound of the Almighty when they went, a sound of tumult like the sound of an army camp. When they stood still[b], they lowered their wings.
  footnotes:
  - marker: a
    text: Or 'like the sound of Shaddai.' The Hebrew uses the divine title שַׁדַּי, traditionally rendered 'the Almighty.'
    reason: lexical_alternative
  - marker: b
    text: Or 'like the sound of a camp'; the Hebrew מַחֲנֶה often refers to a military camp, hence 'army camp.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들의 날개[a] 소리를 들었는데, 많은 물소리 같고, 그들이 갈 때에는 전능하신 분의 소리 같았으며, 소동의 소리, 곧 군영의 소리 같았습니다. 그들이 서 있을 때에는 날개를 내렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '샤다이의 소리'. 히브리어는 신적 칭호 שַׁדַּי를 사용하며, 전통적으로 '전능하신 이'로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  english_pob_choice: And I heard
  chosen_korean: 나는 ... 들었는데
  alternatives_korean:
  - 그리고 나는 ... 들었습니다
  - 나는 ... 들었습니다
  lexicon: HALOT
  rationale: 비전 보고의 서술 순서를 살리면서 한국어에서는 자연스러운 과거 회상형으로 옮겼습니다.
- source_word: קוֹל
  english_pob_choice: sound
  chosen_korean: 소리
  alternatives_korean:
  - 음성
  - 음향
  lexicon: HALOT
  rationale: 여기서는 날개와 소동, 군영의 비교에 반복되는 청각적 현상을 가리키므로 '소리'가 가장 자연스럽고 일관됩니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 전능자
  - 샤다이
  lexicon: HALOT
  rationale: 신적 칭호를 직역하는 방향을 따르되, 한국어에서는 인격적 지시를 드러내는 '분'을 붙여 '전능하신 분'으로 옮겼습니다.
- source_word: מַחֲנֶה
  english_pob_choice: army camp
  chosen_korean: 군영
  alternatives_korean:
  - 진영
  - 군대의 진영
  - 진지
  lexicon: HALOT
  rationale: 전투적 집단의 소란스러운 분위기를 드러내는 데 '군영'이 간결하고 적절합니다.
- source_word: בְּעָמְדָם תְּרַפֶּינָה כַנְפֵיהֶן
  english_pob_choice: When they stood still, they lowered their wings
  chosen_korean: 그들이 서 있을 때에는 날개를 내렸습니다
  alternatives_korean:
  - 그들이 멈추었을 때에는 날개를 내렸습니다
  - 그들이 서 있을 때에는 날개를 늘어뜨렸습니다
  lexicon: HALOT
  rationale: 동작의 대비를 살리면서 רפה의 뜻을 한국어에서 자연스럽게 나타내기 위해 '내렸습니다'를 택했습니다.
theological_decisions:
- issue: שַׁדַּי의 번역 방식
  chosen_reading: 직역적 칭호인 '전능하신 분'으로 옮겼습니다.
  alternative_readings:
  - 샤다이로 음역함
  - 전능자로 옮김
  rationale: 본문의 비교 표현이 신적 칭호를 언어적으로 드러내므로, 음역보다 의미 번역이 독자 이해에 더 직접적입니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §2'
