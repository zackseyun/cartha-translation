base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/027.yaml
  text: And I saw something like the appearance of glowing metal[a], like the appearance of fire all around within it, from the appearance of his waist and upward; and from the appearance of his waist and downward I saw something like the appearance of fire[b], and brightness all around him.
  footnotes:
  - marker: a
    text: Hebrew חַשְׁמַל (hashmal) is uncertain; possible renderings include 'amber' or 'electrum' (a bright metal alloy).
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase rendered 'enclosed all around' is difficult; it may describe the fire as appearing within an enclosing brightness or casing.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 보니, 그의 허리의 모습에서 위쪽으로는 사방으로 그 안에 불이 있는 듯한 빛나는 금속[a]의 모습 같은 것이 있었습니다[b]. 그의 허리의 모습에서 아래쪽으로는 불의 모습 같은 것을 보았으며, 그 주위에는 광채가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חַשְׁמַל(hashmal)은 뜻이 확실하지 않습니다. ‘호박’ 또는 ‘일렉트럼(금·은의 천연 합금)’으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 이 구절은 난해합니다. 직역하면 ‘사방으로 그 안에 집/내부가 있는 듯한’이라는 표현이며, 불이 어떤 빛이나 외피 안에 있는 모습으로 이해할 수 있습니다.
    reason: lexical_alternative
