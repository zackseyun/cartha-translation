theological_decisions:
- issue: 환상의 대상 표기에서 인칭을 유지할지 여부
  chosen_reading: ‘그의 허리’와 ‘그 주위’로 옮겨 히브리어 남성 단수 접미사의 인칭성을 살렸습니다.
  alternative_readings:
  - ‘그것의 허리’와 ‘그 주위’로 비인칭화하기
  - 중성적으로 ‘허리 위쪽/아래쪽’만 표기하기
  rationale: 본문은 인간 형상의 환시를 묘사하므로, 문법적 인칭을 지우면 원문이 주는 형상성과 긴장이 약화됩니다.
