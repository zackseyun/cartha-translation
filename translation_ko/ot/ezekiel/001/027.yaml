reference: Ezekiel 1:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֵ֣רֶא כְּ/עֵ֣ין חַשְׁמַ֗ל כְּ/מַרְאֵה אֵ֤שׁ בֵּֽית לָ/הּ֙ סָבִ֔יב מִ/מַּרְאֵ֥ה מָתְנָ֖י/ו וּ/לְ/מָ֑עְלָ/ה וּ/מִ/מַּרְאֵ֤ה מָתְנָי/ו֙ וּ/לְ/מַ֔טָּה רָאִ֨יתִי֙ כְּ/מַרְאֵה אֵ֔שׁ וְ/נֹ֥גַֽהּ ל֖/וֹ סָבִֽיב׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/027.yaml
  text: And I saw something like the appearance of glowing metal[a], like the appearance of fire all around within it, from the appearance of his waist and upward; and from the appearance of his waist and downward I saw something like the appearance of fire[b], and brightness all around him.
  footnotes:
  - marker: a
    text: Hebrew חַשְׁמַל (hashmal) is uncertain; possible renderings include 'amber' or 'electrum' (a bright metal alloy).
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase rendered 'enclosed all around' is difficult; it may describe the fire as appearing within an enclosing brightness or casing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 보니, 불꽃처럼 번쩍이는 금속의 모습 같은 것이 있었습니다[a]. 그 안에는 불의 모습 같은 것이 사방으로 둘러져 있었고, 그의 허리의 모습에서 위쪽으로는; 또한 그의 허리의 모습에서 아래쪽으로는 불의 모습 같은 것을 보았으며[b], 그 주위에는 밝은 광채가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חַשְׁמַל(hashmal)은 뜻이 확실하지 않습니다. ‘호박’이나 ‘전자금속(electrum)’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 이 구절은 난해하여, 불이 둘러싸인 듯 보였다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/עֵין חַשְׁמַל
  english_pob_choice: something like the appearance of glowing metal
  chosen_korean: 불꽃처럼 번쩍이는 금속의 모습 같은 것
  alternatives_korean:
  - 호박 같은 것
  - 전기금속 같은 것
  - 빛나는 금속의 모습 같은 것
  lexicon: HALOT
  rationale: חַשְׁמַל은 희귀하고 의미가 불확실하므로, 너무 특정한 물질명보다 빛나는 금속성 인상을 살린 표현이 본문에 더 가깝습니다.
- source_word: כְּ/מַרְאֵה אֵשׁ
  english_pob_choice: like the appearance of fire
  chosen_korean: 불의 모습 같은 것
  alternatives_korean:
  - 불처럼
  - 불의 ظاهر 같은 것
  - 불의 광경 같은 것
  lexicon: HALOT
  rationale: 반복되는 ‘~의 모습’ 구조를 유지해 예언적 환상 묘사의 비교성을 살렸습니다.
- source_word: בֵּית לָהּ סָבִיב
  english_pob_choice: all around within it
  chosen_korean: 그 안에는 … 사방으로 둘러져 있었고
  alternatives_korean:
  - 그 안에 사방으로 둘러싸여 있었고
  - 그 주위에 둘러싸여 있었고
  - 그 속에 둘러진 채로
  lexicon: HALOT
  rationale: 직역하면 난해하므로, 불이 어떤 둘러싸인/둘러진 상태로 보였다는 의미를 자연스러운 한국어로 옮겼습니다.
- source_word: מָתְנָיו / וּלְמָעְלָה / וּלְמַטָּה
  english_pob_choice: his waist ... and upward ... and downward
  chosen_korean: 그의 허리의 모습에서 위쪽으로는 … 또한 그의 허리의 모습에서 아래쪽으로는
  alternatives_korean:
  - 그의 허리에서 위로는 … 아래로는
  - 그의 허리 위쪽과 아래쪽으로는
  - 그의 허리에서 위와 아래로는
  lexicon: HALOT
  rationale: מָתְנַיִם은 신체 기준점으로 기능하므로 ‘허리’로 옮기고, 위·아래 대구를 보존했습니다.
- source_word: וְנֹגַהּ לוֹ סָבִיב
  english_pob_choice: and brightness all around him
  chosen_korean: 그 주위에는 밝은 광채가 있었습니다
  alternatives_korean:
  - 그 주위로 밝음이 있었습니다
  - 그를 둘러싼 광채가 있었습니다
  - 그 주위에는 빛남이 있었습니다
  lexicon: HALOT
  rationale: נֹגַהּ는 단순한 빛보다 ‘광채/밝음’의 의미가 강해, 주변을 둘러싼 광휘를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 환상의 대상 표기에서 인칭을 유지할지 여부
  chosen_reading: ‘그의 허리’와 ‘그 주위’로 옮겨 히브리어 남성 단수 접미사의 인칭성을 살렸습니다.
  alternative_readings:
  - ‘그것의 허리’와 ‘그 주위’로 비인칭화하기
  - 중성적으로 ‘허리 위쪽/아래쪽’만 표기하기
  rationale: 본문은 인간 형상의 환시를 묘사하므로, 문법적 인칭을 지우면 원문이 주는 형상성과 긴장이 약화됩니다.
  doctrine_reference: 번역 원칙 §4 (문법적 성·수 일치 우선); §3 (본문의 긴장 보존)
