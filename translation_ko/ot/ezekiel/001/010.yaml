translation:
  language: ko
  text: 그들의 얼굴 모양은 이러했습니다. 각 생물에게는 사람의 얼굴이 있었고, 네 생물 모두의 오른쪽에는 사자 얼굴이, 왼쪽에는 소 얼굴이 있었으며, 네 생물 모두에게는 독수리 얼굴이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘대머리독수리’. 히브리어 네셰르(nesher)는 더 넓게 큰 맹금류를 가리킬 수 있습니다.
    reason: lexical_alternative
