id: EZK.1.10
reference: Ezekiel 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/דְמ֣וּת פְּנֵי/הֶם֮ פְּנֵ֣י אָדָם֒ וּ/פְנֵ֨י אַרְיֵ֤ה אֶל הַ/יָּמִין֙ לְ/אַרְבַּעְתָּ֔/ם וּ/פְנֵי שׁ֥וֹר מֵֽ/הַ/שְּׂמֹ֖אול לְ/אַרְבַּעְתָּ֑/ן וּ/פְנֵי נֶ֖שֶׁר לְ/אַרְבַּעְתָּֽ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/010.yaml
  text: 'As for the likeness of their faces: each had a human face; the four had a lion’s face on the right side[a], the four had an ox’s face on the left side, and the four had an eagle’s face.'
  footnotes:
  - marker: a
    text: Or 'vulture' for 'eagle'; Hebrew nesher can refer more broadly to a large bird of prey.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 얼굴들의 모양은 이러했습니다. 각각 사람의 얼굴이 있었고, 네 생물은 오른쪽에 사자의 얼굴이 있었으며, 왼쪽에는 소의 얼굴이 있었고, 네 생물은 독수리의 얼굴이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘독수리’ 대신 ‘독수리류의 큰 새’로 볼 수 있습니다. 히브리어 nesher는 더 넓게 큰 맹금류를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת פְּנֵיהֶם
  english_pob_choice: As for the likeness of their faces
  chosen_korean: 그 얼굴들의 모양은 이러했습니다
  alternatives_korean:
  - 그 얼굴들의 모습은 이러했습니다
  - 그 얼굴들의 형상은 이러했습니다
  lexicon: HALOT
  rationale: דְּמוּת은 단순한 '외모'보다 '모양/형상/유사한 모습'의 뜻이 있어, 여기서는 서술을 여는 표현으로 자연스럽게 '모양은 이러했습니다'로 옮겼습니다.
- source_word: פְּנֵי אָדָם
  english_pob_choice: a human face
  chosen_korean: 사람의 얼굴
  alternatives_korean:
  - 인간의 얼굴
  - 사내의 얼굴
  lexicon: HALOT
  rationale: אָדָם은 여기서 남성 특정이 아니라 인간 종 전체를 가리키므로, 성별을 좁히지 않는 '사람의 얼굴'이 원문의 대비를 가장 잘 살립니다.
- source_word: אֶל הַיָּמִין / מֵהַשְּׂמֹאול
  english_pob_choice: on the right side / on the left side
  chosen_korean: 오른쪽에 / 왼쪽에는
  alternatives_korean:
  - 오른편에 / 왼편에는
  - 오른쪽 편에 / 왼쪽 편에는
  lexicon: HALOT
  rationale: 방향과 위치를 나타내는 표현이므로, 비전 묘사에 자연스러운 현대 한국어 공간 표현인 '오른쪽/왼쪽'을 사용했습니다.
- source_word: שׁוֹר
  english_pob_choice: ox
  chosen_korean: 소
  alternatives_korean:
  - 황소
  - 외양간소
  lexicon: HALOT
  rationale: שׁוֹר는 일반적으로 소과 동물을 가리키며, 한국어 성경 문맥에서는 '소'가 가장 자연스럽고 넓은 대응어입니다.
- source_word: נֶשֶׁר
  english_pob_choice: eagle
  chosen_korean: 독수리
  alternatives_korean:
  - 매
  - 솔개
  lexicon: HALOT
  rationale: נֶשֶׁר은 큰 맹금류를 가리키며, 본문 맥락에서 표준적 대응은 '독수리'입니다. 대안 가능성은 본문 주석으로 남기는 것이 적절합니다.
theological_decisions:
- issue: 인간 얼굴을 남성형으로 제한하지 않음
  chosen_reading: 사람의 얼굴
  alternative_readings:
  - 사내의 얼굴
  - 사람의 얼굴
  rationale: 본문의 대조점은 인간 대 짐승의 구분이지 성별이 아니므로, אָדָם을 성중립적으로 처리해 원문의 의미 범위를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: אָדָם은 문맥에 따라 ''사람/인간''으로 옮길 수 있음.'
