id: EZK.1.12
reference: Ezekiel 1:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֛ישׁ אֶל עֵ֥בֶר פָּנָ֖י/ו יֵלֵ֑כוּ אֶ֣ל אֲשֶׁר֩ יִֽהְיֶה שָׁ֨מָּ/ה הָ/ר֤וּחַ לָ/לֶ֨כֶת֙ יֵלֵ֔כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/012.yaml
  text: And each one went straight ahead[a]. Wherever the spirit was to go, they went[b]; they did not turn as they went.
  footnotes:
  - marker: a
    text: Or 'the wind'; possibly 'the Spirit.' The Hebrew word רוּחַ can mean 'spirit,' 'wind,' or 'breath,' and the verse does not explicitly identify the referent.
    reason: alternative_reading
  - marker: b
    text: Literally, 'toward the direction of its face.'
    reason: lexical_alternative
translation:
  language: ko
  text: 각 생물은 자기 얼굴이 향한 쪽으로 나아갔습니다[b]. 영[a]이 가려는 곳이면 어디든지 그들이 갔습니다. 그들은 갈 때에 방향을 바꾸지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바람’; ‘성령’으로 이해할 수도 있습니다. 히브리어 רוּחַ는 ‘영’, ‘바람’, ‘숨’을 뜻할 수 있으며, 이 절은 그 지시 대상을 분명히 밝히지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그 얼굴의 방향을 향하여’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  english_pob_choice: And each one
  chosen_korean: 각기
  alternatives_korean:
  - 각 사람
  - 각기 한 사람씩
  - 각자
  lexicon: HALOT
  rationale: אִישׁ은 문자적으로 ‘사람/남자’이지만, 이 문맥에서는 네 생물에게 분배적으로 적용되므로 ‘각기’가 개별성과 분배적 뉘앙스를 자연스럽게 살립니다.
- source_word: אֶל עֵבֶר פָּנָיו
  english_pob_choice: straight ahead
  chosen_korean: 곧장 앞으로
  alternatives_korean:
  - 얼굴이 향한 방향으로
  - 그 얼굴의 방향으로
  - 정면으로
  lexicon: HALOT
  rationale: 직역하면 ‘그 얼굴의 방향 쪽으로’이지만, 관용적으로는 곧바로 앞으로 가는 동작을 뜻하므로 현대 한국어의 ‘곧장 앞으로’가 원문의 의미를 정확히 전달합니다.
- source_word: הָרוּחַ
  english_pob_choice: the spirit
  chosen_korean: 영
  alternatives_korean:
  - 바람
  - 성령
  lexicon: HALOT
  rationale: רוּחַ는 ‘영/바람/숨’ 모두 가능하나, 본문이 명시적으로 성령을 확정하지 않으므로 소문자 개념인 ‘영’으로 두어 의미의 개방성을 보존합니다.
- source_word: לֹא יִסַּבּוּ
  english_pob_choice: they did not turn
  chosen_korean: 돌이키지 않았습니다
  alternatives_korean:
  - 방향을 바꾸지 않았습니다
  - 옆으로 돌지 않았습니다
  lexicon: HALOT
  rationale: סבב의 핵심은 방향을 꺾거나 되돌아보지 않는 것입니다. ‘돌이키지 않았다’는 동작의 요지를 간결하게 살리면서 반복 강조를 유지합니다.
theological_decisions:
- issue: רוּחַ를 ‘성령’으로 특정할지 여부
  chosen_reading: 본문의 직접 진술을 따라 ‘영’으로 번역합니다.
  alternative_readings:
  - 성령
  - 바람
  rationale: 문맥상 생물들의 움직임을 이끄는 존재가 암시되지만, 히브리어 본문은 그것을 명시적으로 성령으로 규정하지 않습니다. 따라서 신학적 긴장을 유지하기 위해 중립적인 ‘영’을 택합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
