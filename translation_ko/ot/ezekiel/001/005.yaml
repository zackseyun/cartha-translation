  naturalness: ‘그 가운데서 네 생물 같은 형상이 나타났습니다’와 ‘그들이 보인 모습은 이러했습니다’가 현대 표준 한국어의 격식 있는 성경 문체로 더 자연스럽습니다. ‘사람과 같은 형상’은 반복되는 דְּמוּת의 유사성 표현을 명료하게 보존합니다.
