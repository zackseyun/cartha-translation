translation:
  language: ko
  text: 그리고 그 가운데서 네 생물 같은 형상이 나타났습니다[a]. 그들이 보인 모습은 이러했습니다. 그들은 사람과 같은 형상을 하고 있었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 살아 있는 존재’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘사람의 닮은 모습’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתּוֹכָהּ
  english_pob_choice: And from within it
  chosen_korean: 그리고 그 안에서
  alternatives_korean:
  - 그리고 그 가운데서
  - 그리고 그 속에서
  lexicon: HALOT
  rationale: 문맥상 앞선 환상적 대상의 내부를 가리키는 말이므로, 자연스러운 현대 한국어로 ‘그 안에서’라고 옮기되 안쪽 출처의 공간감을 유지했습니다.
- source_word: דְּמוּת אַרְבַּע חַיּוֹת
  english_pob_choice: the likeness of four living creatures
  chosen_korean: 네 생물의 모습과 같은 것
  alternatives_korean:
  - 네 살아 있는 존재의 모습
  - 네 կենդ물의 형상
  lexicon: HALOT
  rationale: דְּמוּת는 단정적 동일시가 아니라 ‘~와 같은 모습’이라는 유사성을 뜻하므로, ‘모습과 같은 것’으로 번역해 환상적 거리감을 살렸습니다. חַיּוֹת는 ‘생물’이 가장 간결하게 살아 있는 존재성을 드러냅니다.
- source_word: וְזֶה מַרְאֵיהֶן
  english_pob_choice: And this was their appearance
  chosen_korean: 이것이 그들의 모습입니다
  alternatives_korean:
  - 이것이 그들의 외형입니다
  - 이것이 그들이 보인 모습입니다
  lexicon: HALOT
  rationale: מַרְאֶה는 눈에 보이는 외관·모습을 가리키므로, 현대 한국어에서 가장 자연스러운 ‘모습’으로 옮겼습니다.
- source_word: דְּמוּת אָדָם
  english_pob_choice: the likeness of a man
  chosen_korean: 사람의 형상
  alternatives_korean:
  - 사람과 같은 형상
  - 인간의 형상
  lexicon: HALOT
  rationale: אָדָם은 여기서 인류 일반보다 인간형을 가리키므로 ‘사람’이 직역성이 높고, ‘형상’이 דְּמוּת의 유사성을 잘 살립니다. 영어 본문처럼 성별을 과도하게 특정하지 않되 원문의 단수성을 유지했습니다.
theological_decisions:
- issue: 환상 묘사의 유보성과 동일시 자제
  chosen_reading: ‘모습과 같은 것’, ‘형상’ 같은 유사성 표현을 유지해 정체를 과도하게 규정하지 않았습니다.
  alternative_readings:
  - ‘네 생물’로 단정적으로 번역하기
  - 천사 존재로 본문에서 해석해 넣기
  rationale: 에스겔은 본문에서 반복적으로 ‘like/likeness’ 계열 표현을 사용해 보는 것을 있는 그대로 전하므로, 번역도 그 신학적 절제를 보존해야 합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
