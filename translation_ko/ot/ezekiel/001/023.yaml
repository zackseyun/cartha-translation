id: EZK.1.23
reference: Ezekiel 1:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/תַ֨חַת֙ הָ/רָקִ֔יעַ כַּנְפֵי/הֶ֣ם יְשָׁר֔וֹת אִשָּׁ֖ה אֶל אֲחוֹתָ֑/הּ לְ/אִ֗ישׁ שְׁתַּ֤יִם מְכַסּוֹת֙ לָ/הֵ֔נָּה וּ/לְ/אִ֗ישׁ שְׁתַּ֤יִם מְכַסּוֹת֙ לָ/הֵ֔נָּה אֵ֖ת גְּוִיֹּתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/023.yaml
  text: And under the expanse their wings were straight[a], each one toward her sister. Each had two covering them[b], and each had two covering their bodies.
  footnotes:
  - marker: a
    text: Hebrew literally, 'a woman toward her sister,' using feminine singular forms because 'wings' is grammatically feminine; the sense is that the wings corresponded to one another.
    reason: lexical_alternative
  - marker: b
    text: Or 'firmament' for 'expanse.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 궁창 아래에서 그들의 날개는 곧았습니다[a]. 하나는 다른 하나를 향했고, 각 생물에게는 그것들을 덮는 날개가 둘이 있었으며, 또 각 생물에게는 그들의 몸을 덮는 날개가 둘이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘한 여자가 그 자매를 향하여’이지만, 날개가 여성형이기 때문에 서로 대응하는 모습을 그렇게 표현한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָקִיעַ
  english_pob_choice: the expanse
  chosen_korean: 궁창
  alternatives_korean:
  - 하늘 펼침
  - 창공
  lexicon: HALOT
  rationale: 이 절의 רָקִיעַ는 에스겔의 환상 문맥에서 전통적 한국어 성경 용례가 굳어 있는 '궁창'이 원문의 견고한 하늘 구조 이미지를 가장 간명하게 살립니다.
- source_word: כַּנְפֵיהֶם יְשָׁרוֹת
  english_pob_choice: their wings were straight
  chosen_korean: 그들의 날개는 곧았습니다
  alternatives_korean:
  - 그들의 날개는 곧게 펴져 있었습니다
  - 그들의 날개는 바르게 뻗어 있었습니다
  lexicon: HALOT
  rationale: יְשָׁרוֹת의 핵심은 '직선적임/곧음'이므로, 동작을 덧붙이기보다 상태를 직설적으로 살려 '곧았습니다'로 옮겼습니다.
- source_word: אִשָּׁה אֶל אֲחוֹתָהּ
  english_pob_choice: each one toward her sister
  chosen_korean: 하나는 다른 하나를 향했고
  alternatives_korean:
  - 여기서도 자매처럼 서로를 향했고
  - 각각 그 짝을 향했고
  lexicon: HALOT
  rationale: 히브리어는 날개를 여성형 단수로 의인화해 '한 여자가 그 자매를 향한다'는 식으로 말하지만, 한국어에서는 같은 대응 관계를 자연스럽게 살리되 과도한 의인화를 피해 '하나는 다른 하나를 향했고'로 풀었습니다.
- source_word: מְכַסּוֹת לָהֵנָּה ... גְּוִיֹּתֵיהֶם
  english_pob_choice: covering them ... covering their bodies
  chosen_korean: 그것들을 덮는 날개가 둘이 있었으며 ... 그들의 몸을 덮는 날개가 둘이 있었습니다
  alternatives_korean:
  - 덮는 날개가 둘 있었습니다
  - 몸을 가리는 날개가 둘 있었습니다
  lexicon: HALOT
  rationale: מְכַסּוֹת는 '덮는'이 가장 직접적이며, גְּוִיּוֹתֵיהֶם은 여기서 '시체'가 아니라 살아 있는 존재의 '몸'을 뜻하므로 문맥에 따라 '몸'으로 옮겼습니다.
theological_decisions:
- issue: '''궁창''과 환상적 공간 질서의 표현'
  chosen_reading: רָקִיעַ를 '궁창'으로 옮겨 에스겔 환상에서 하늘의 구조적 경계를 드러냈습니다.
  alternative_readings:
  - '''하늘 펼침''으로 보다 설명적으로 옮김'
  - '''창공''으로 현대화함'
  rationale: 이 구절은 우주론적 묘사보다 환상 속 위치 관계를 보여 주므로, 전통적이지만 원문 질서를 보존하는 표현이 적절합니다.
  doctrine_reference: 창 1장 우주론적 어휘와 에스겔 환상 묘사의 연속성
- issue: 날개를 가리키는 여성형 대응의 처리
  chosen_reading: 히브리어의 여성형 대응 구조를 한국어에서는 직접 번역보다 의미 대응으로 옮겼습니다.
  alternative_readings:
  - '''한 여자가 그 자매를 향해''처럼 직역'
  - '''서로 마주했다''로 의미만 축약'
  rationale: 원문은 문법적 성별을 활용한 생생한 대응을 보여 주지만, 한국어에서는 이를 그대로 재현하면 오해가 생길 수 있어 관계의 대칭성을 유지하는 선에서 자연화했습니다.
  doctrine_reference: 문법적 형상보다 의미 대응을 우선하는 번역 원칙
