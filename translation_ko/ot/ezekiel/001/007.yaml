id: EZK.1.7
reference: Ezekiel 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רַגְלֵי/הֶ֖ם רֶ֣גֶל יְשָׁרָ֑ה וְ/כַ֣ף רַגְלֵי/הֶ֗ם כְּ/כַף֙ רֶ֣גֶל עֵ֔גֶל וְ/נֹ֣צְצִ֔ים כְּ/עֵ֖ין נְחֹ֥שֶׁת קָלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/007.yaml
  text: Their legs were straight[a], and the soles of their feet were like the sole of a calf’s foot[b], and they gleamed like the appearance of polished bronze.
  footnotes:
  - marker: a
    text: Or, more idiomatically, “like a calf’s hoof.” The Hebrew more literally says “like the sole of a calf’s foot.”
    reason: lexical_alternative
  - marker: b
    text: Or “burnished bronze.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 다리는 곧았고, 발바닥은 송아지의 발바닥 같았으며, 그들은 닦은 놋의 빛깔처럼 번쩍였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 “송아지의 발의 발바닥”입니다. 더 관용적으로는 “송아지의 발굽처럼”으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘놋’은 전통적 성경 한국어 어휘이며, כאן의 금속성 광택은 ‘닦은/번뜩이는 놋’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵיהֶם / רֶגֶל יְשָׁרָה
  english_pob_choice: their legs were straight
  chosen_korean: 그들의 다리는 곧았고
  alternatives_korean:
  - 그들의 발은 곧았고
  - 그들의 다리가 곧게 뻗어 있었고
  lexicon: HALOT
  rationale: רֶגֶל은 문맥에 따라 ‘발’ 또는 ‘다리’를 뜻할 수 있는데, 뒤에서 이미 발바닥을 따로 말하므로 첫 번째는 ‘다리’로 구분해 옮기는 것이 원문의 대비를 살립니다.
- source_word: כַּף רַגְלֵיהֶם / כְּכַף רֶגֶל עֵגֶל
  english_pob_choice: the soles of their feet / like the sole of a calf’s foot
  chosen_korean: 발바닥은 송아지의 발바닥 같았으며
  alternatives_korean:
  - 발바닥은 송아지의 발굽 같았으며
  - 발바닥은 어린 소의 발바닥 같았으며
  lexicon: HALOT
  rationale: כַּף는 신체 부위로서는 ‘손바닥/발바닥’을 뜻하므로 ‘발바닥’이 자연스럽습니다. 또한 히브리어는 ‘송아지의 발의 발바닥’이라고 더 직역되므로, 본문은 그 구조를 살려 두고 ‘발굽’은 주석적 대안으로만 남깁니다.
- source_word: וְנֹצְצִים
  english_pob_choice: they gleamed
  chosen_korean: 번쩍였습니다
  alternatives_korean:
  - 빛났습니다
  - 반짝였습니다
  lexicon: HALOT
  rationale: 이 분사는 강한 광택이나 번뜩임을 나타내므로, 환상적 시각성을 살리는 ‘번쩍였습니다’가 적절합니다.
- source_word: נְחֹשֶׁת קָלָל
  english_pob_choice: polished bronze
  chosen_korean: 닦은 놋
  alternatives_korean:
  - 번쩍이는 놋
  - 윤이 난 놋
  - 광이 난 청동
  lexicon: HALOT
  rationale: נְחֹשֶׁת은 한국어 성경 전통에서 ‘놋’이 널리 쓰이며, קָלָל은 닦아 광택이 난 상태를 가리키므로 ‘닦은 놋’이 간결하면서도 원뜻을 잘 드러냅니다.
theological_decisions:
- issue: 시각적 묘사의 강도 보존
  chosen_reading: 환상 속 존재의 다리와 발, 금속성 광택을 있는 그대로 강하게 묘사했습니다.
  alternative_readings:
  - 상징성을 완화해 더 부드럽게 옮기는 방식
  - 전통적 어휘로만 평이하게 옮기는 방식
  rationale: 이 절은 예언 환상의 생생한 외형 묘사이므로, 상징성을 미리 해석해 누그러뜨리기보다 원문의 감각적 충격을 보존하는 것이 적절합니다.
  doctrine_reference: 예언서의 환상 묘사와 문자적 시각 이미지 보존
