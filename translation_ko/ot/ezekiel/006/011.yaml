base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/011.yaml
  text: 'Thus says the Lord GOD: Strike your hand and stamp your foot[a], and say, “Alas!” because of all the evil abominations of the house of Israel, who will fall by the sword, by famine[c][b], and by pestilence.'
  footnotes:
  - marker: a
    text: Or “Clap your hands.” The Hebrew may refer to striking the palm as an emphatic gesture.
    reason: lexical_alternative
  - marker: b
    text: Hebrew אָח can be rendered “Alas!” or “Ah!”; here it expresses lament over coming judgment.
    reason: lexical_alternative
  - marker: c
    text: Or “over all the evil abominations of the house of Israel.”
    reason: alternative_reading
translation:
  language: ko
  text: 주 하나님께서 이같이 말씀하시되, 손바닥을 치고 발을 구르며, 이스라엘 집안의 모든 가증한 악을 인하여 슬프다, 슬프다 하라. 그 악은 칼과 기근과 전염병으로 말미암아 그들에게 임할 것임이니라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '손을 치라.' 히브리어는 손바닥을 치는 것을 강조하는 제스처를 가리킬 수 있다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 '아하'는 '슬프다!' 또는 '아!'로 번역될 수 있으며, 여기서는 임박한 심판에 대한 탄식을 표현한다.
    reason: alternative_reading
  - marker: c
    text: 또는 '이스라엘 집안의 모든 가증한 악을 인하여.'
    reason: alternative_reading
