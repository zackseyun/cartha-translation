    text: 'Hebrew: ''YHWH''; alternatively rendered ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 너희 가운데에서 죽임을 당한 자가 넘어질 것이며, 너희는 내가 야훼인 줄 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה(YHWH)는 ‘야훼’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: וְנָפַל חָלָל
  english_pob_choice: the slain will fall
  chosen_korean: 죽임을 당한 자가 넘어질 것이며
  alternatives_korean:
  - 죽은 자가 넘어질 것이며
  - 살육된 자가 쓰러질 것이며
  - 죽임을 당한 자가 쓰러질 것이며
  lexicon: HALOT
  rationale: חָלָל은 이 심판 문맥에서 단순한 ‘부상자’보다 ‘죽임을 당한 자’의 뜻이 강하므로, 사건성을 살려 ‘죽임을 당한 자’로 옮겼고, וְנָפַל은 예언적 미래로 ‘넘어질 것입니다’의 자연스러운 표현을 택했습니다.
- source_word: בְּתוֹכְכֶם
  english_pob_choice: in your midst
  chosen_korean: 너희 가운데에서
  alternatives_korean:
  - 너희 한가운데에서
  - 너희 중에
  - 너희 가운데
  lexicon: HALOT
  rationale: 장소적 범위를 나타내는 표현이므로 ‘너희 가운데에서’로 옮겨, 심판이 공동체 내부 한복판에서 일어난다는 뜻을 분명히 했습니다.
- source_word: וִידַעְתֶּם
  english_pob_choice: you will know
  chosen_korean: 너희는 ... 알게 될 것입니다
  alternatives_korean:
  - 너희는 ... 알 것입니다
  - 그때 너희는 ... 알게 될 것입니다
  lexicon: HALOT
  rationale: 에스겔의 인식 공식인 ‘you will know’를 현대 한국어의 예언적 미래로 자연스럽게 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명은 주석적 전통어인 ‘여호와’ 대신 소스 직결 표기인 ‘야훼’를 사용해, 본문이 지시하는 언약적 자기계시를 직접 드러냈습니다.
theological_decisions:
- issue: 에스겔의 인식 공식에서 하나님의 이름을 어떻게 드러낼지
  chosen_reading: ‘내가 야훼인 줄’로 옮겨, 심판 사건이 야훼 인식으로 이어지는 목적을 그대로 유지했습니다.
  alternative_readings:
  - ‘내가 주인 줄’
  - ‘내가 여호와인 줄’
  rationale: 히브리어 본문이 יְהוָה를 직접 사용하므로, 독자가 심판의 결과를 언약의 이름 인식과 연결하도록 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
