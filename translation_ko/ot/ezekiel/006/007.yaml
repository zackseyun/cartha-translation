translation:
  language: ko
  text: 너희 가운데에서 사람들이 죽임을 당해 쓰러질 것이며, 너희는 내가 야훼[a]임을 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה(YHWH)는 ‘야훼’로 옮겼습니다.
