  text: וְ/נָשַׁ֨מּוּ֙ מִזְבְּח֣וֹתֵי/כֶ֔ם וְ/נִשְׁבְּר֖וּ חַמָּֽנֵי/כֶ֑ם וְ/הִפַּלְתִּי֙ חַלְלֵי/כֶ֔ם לִ/פְנֵ֖י גִּלּוּלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/004.yaml
  text: Your altars will be desolated[a], and your incense altars will be broken[b]; and I will cast down your slain before your idols.
  footnotes:
  - marker: a
    text: Hebrew גִּלּוּלִים is a strongly contemptuous term for idols; alternatively, 'your filthy idols' or even 'your dung-idols.'
    reason: lexical_alternative
  - marker: b
    text: Or 'your sun-pillars'; the Hebrew term חַמָּנִים refers to cultic objects associated with illicit worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분의 제단은 황폐해지고, 여러분의 분향단은 부서질 것이며, 나는 여러분의 죽임당한 자들을 여러분의 우상들 앞에 내던질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִּלּוּלִים는 우상을 가리키는 매우 경멸적인 말입니다. 또는 ‘더러운 우상들’이나 심지어 ‘똥우상들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘태양기둥들’로도 옮길 수 있습니다. 히브리어 חַמָּנִים는 불법적 예배와 관련된 제의물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁמּוּ / מִזְבְּחוֹתֵיכֶם
  english_pob_choice: Your altars will be desolated
  chosen_korean: 여러분의 제단은 황폐해지고
  alternatives_korean:
  - 여러분의 제단은 황폐하게 될 것입니다
  - 여러분의 제단은 폐허가 될 것입니다
  lexicon: HALOT
  rationale: נָשַׁמּוּ의 결과 상태를 한국어 동사구 ‘황폐해지다’로 옮겨 심판의 폐허 상태를 자연스럽게 살렸습니다.
- source_word: חַמָּנֵיכֶם
  english_pob_choice: your incense altars
  chosen_korean: 여러분의 분향단은
  alternatives_korean:
  - 여러분의 향단은
  - 여러분의 태양기둥은
  lexicon: HALOT
  rationale: 문맥상 우상 숭배에 쓰이던 제의용 설치물을 가리키므로, 기존 교회 용어에 맞는 ‘분향단’으로 옮겨 제의적 기능을 드러냈습니다.
- source_word: נִשְׁבְּר֖וּ
  english_pob_choice: will be broken
  chosen_korean: 부서질 것이며
  alternatives_korean:
  - 깨질 것이며
  - 산산이 부서질 것이며
  lexicon: HALOT
  rationale: 수동형의 ‘깨지다/부서지다’ 가운데, 제의 기구의 파괴를 가장 자연스럽게 드러내는 ‘부서지다’를 선택했습니다.
- source_word: חַלְלֵיכֶם
  english_pob_choice: your slain
  chosen_korean: 여러분의 죽임당한 자들을
  alternatives_korean:
  - 여러분의 죽임당한 자들을
  - 여러분의 살육당한 자들을
  - 여러분의 죽은 자들을
  lexicon: HALOT
  rationale: חָלָל은 ‘죽임을 당한 자’의 뜻이 분명하므로, 단순한 사망보다 폭력적 결과를 분명히 하는 표현을 택했습니다.
- source_word: גִּלּוּלֵיכֶם
  english_pob_choice: your idols
  chosen_korean: 여러분의 우상들 앞에
  alternatives_korean:
  - 여러분의 우상들 앞에
  - 여러분의 더러운 우상들 앞에
  lexicon: HALOT
  rationale: 기본 의미는 ‘우상’이지만, 히브리어의 경멸적 뉘앙스는 본문보다 각주로 보존하는 편이 적절하여 본문은 간결하게 유지했습니다.
theological_decisions:
- issue: 경멸적 표현 גִּלּוּלִים의 처리
  chosen_reading: 본문에는 ‘우상들’로 두고, 경멸적 어조는 각주로 보완합니다.
  alternative_readings:
  - 더러운 우상들
  - 똥우상들
  rationale: 예언자의 조롱 섞인 심판 어조는 중요하지만, 본문에 과도하게 저속한 표현을 직접 넣기보다 각주로 전달하는 편이 합쇼체 번역의 공적 가독성과 주해 가능성을 함께 살립니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
