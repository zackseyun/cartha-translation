base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/004.yaml
  text: Your altars will be desolated[a], and your incense altars will be broken[b]; and I will cast down your slain before your idols.
  footnotes:
  - marker: a
    text: Hebrew גִּלּוּלִים is a strongly contemptuous term for idols; alternatively, 'your filthy idols' or even 'your dung-idols.'
    reason: lexical_alternative
  - marker: b
    text: Or 'your sun-pillars'; the Hebrew term חַמָּנִים refers to cultic objects associated with illicit worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분의 제단들은 황폐해지고, 여러분의 분향 제단들은 부서질 것이며[b], 나는 여러분의 죽임당한 자들을 여러분의 우상들[a] 앞에 쓰러지게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִּלּוּלִים는 우상을 가리키는 매우 경멸적인 말입니다. 또는 ‘더러운 우상들’, 심지어 ‘똥우상들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘태양 기둥들’로 옮길 수 있습니다. 히브리어 חַמָּנִים는 우상 숭배와 관련된 제의물을 가리킵니다.
    reason: lexical_alternative
