  verdict: revise
  source_fidelity: 제단의 황폐와 חַמָּנִים의 파괴는 대체로 충실합니다. 그러나 הִפַּלְתִּי는 문자적으로 ‘쓰러지게 하다/넘어지게 하다’라는 사역 표현이며, ‘내던지다’는 원문에 없는 투척의 뉘앙스를 더합니다. 또한 각주 표지는 해당 낱말 바로 뒤에 놓여야 합니다.
  naturalness: 합쇼체의 미래 진술은 자연스럽습니다. 다만 ‘불법적 예배’는 현대 한국어에서 다소 법률적인 표현이므로 ‘부정한 예배’ 또는 ‘정당하지 않은 예배’보다, 여기서는 ‘우상 숭배’ 관련 제의물이라고 하는 편이 더 자연스럽고 문맥에 맞습니다.
  terminology: ‘분향 제단’은 영어 POB의 ‘incense altars’를 따르는 번역으로 가능하지만 חַמָּנִים의 정확한 지시 대상에는 불확실성이 있으므로 ‘태양 기둥들’이라는 대안을 각주에 보존하는 것이 적절합니다. גִּלּוּלִים의 경멸적 어감도 각주로 적절히 보완할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘내던질 것입니다’가 הִפַּלְתִּי의 의미를 과도하게 구체화합니다.
