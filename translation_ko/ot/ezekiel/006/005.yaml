  text: וְ/נָתַתִּ֗י אֶת פִּגְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לִ/פְנֵ֖י גִּלּֽוּלֵי/הֶ֑ם וְ/זֵרִיתִי֙ אֶת עַצְמ֣וֹתֵי/כֶ֔ם סְבִיב֖וֹת מִזְבְּחוֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/005.yaml
  text: And I will place the corpses of the sons of Israel before their idols[a], and I will scatter your bones around your altars.
  footnotes:
  - marker: a
    text: Hebrew גִּלּוּלִים is Ezekiel’s scornful term for idols; it may carry a contemptuous nuance such as 'filthy idols' or even 'dung-idols.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이스라엘 자손들의 시체들을 그들의 우상들 앞에 두고, 너희 뼈들을 너희 제단 사방에 흩겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִּלּוּלִים은 에스겔이 우상을 조롱하며 쓰는 경멸적 표현으로, ‘더러운 우상들’ 또는 ‘똥우상들’ 같은 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: And I will place
  chosen_korean: 두겠습니다
  alternatives_korean:
  - 놓겠습니다
  - 두어 놓겠습니다
  lexicon: HALOT
  rationale: נתן은 여기서 ‘두다/놓다’의 구체적 동작이 자연스럽고, 시체를 우상들 앞에 ‘두다’는 장면성을 잘 살립니다.
- source_word: פִּגְרֵי
  english_pob_choice: the corpses
  chosen_korean: 시체들을
  alternatives_korean:
  - 송장들을
  - 죽은 몸들을
  lexicon: HALOT
  rationale: פגר는 사람의 죽은 몸을 가리키므로 ‘시체들’이 가장 직관적이며, 심판의 잔혹함도 충분히 드러납니다.
- source_word: גִּלּוּלֵיהֶם
  english_pob_choice: their idols
  chosen_korean: 그들의 우상들
  alternatives_korean:
  - 그들의 더러운 우상들
  - 그들의 똥우상들
  lexicon: HALOT
  rationale: 본문의 조롱 섞인 뉘앙스는 유지하되, 본문은 표준적인 ‘우상들’로 옮기고 그 경멸적 뉘앙스는 주석에서 드러내는 편이 한국어 본문 가독성에 적합합니다.
- source_word: עַצְמוֹתֵיכֶם
  english_pob_choice: your bones
  chosen_korean: 너희 뼈들
  alternatives_korean:
  - 너희 유해들
  - 너희 해골들
  lexicon: HALOT
  rationale: 직역에 가까운 ‘뼈들’이 히브리어의 냉혹한 이미지를 보존하며, 2인칭 복수도 분명하게 살립니다.
theological_decisions:
- issue: 가해 주체와 청중의 직접 대립
  chosen_reading: 하나님이 직접 화자로서 심판을 선언하는 형태를 유지했습니다.
  alternative_readings:
  - 서술형으로 완화해 옮기는 방식
  - 주어를 흐리게 하는 방식
  rationale: 히브리어의 1인칭 미래형 연속은 선언적 심판의 직설성을 핵심으로 하므로, 한국어에서도 ‘내가 … 하겠습니다’로 유지해야 경고의 힘이 보존됩니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
- issue: ‘이스라엘 자손들’의 집합명 유지
  chosen_reading: ‘이스라엘 자손들’을 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: בְּנֵי יִשְׂרָאֵל의 언약적 표현을 살리면서도, 본문이 특정 남성만을 뜻하는 것으로 오해되지 않도록 한국어에서는 관용적인 복수 집합명으로 처리했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
