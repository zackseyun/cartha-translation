id: EZK.6.12
reference: Ezekiel 6:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָ/רָח֞וֹק בַּ/דֶּ֣בֶר יָמ֗וּת וְ/הַ/קָּרוֹב֙ בַּ/חֶ֣רֶב יִפּ֔וֹל וְ/הַ/נִּשְׁאָר֙ וְ/הַ/נָּצ֔וּר בָּ/רָעָ֖ב יָמ֑וּת וְ/כִלֵּיתִ֥י חֲמָתִ֖/י בָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/012.yaml
  text: The one far away will die by pestilence[a], and the one nearby will fall by the sword, and the one left and besieged will die by famine[b]; and I will spend my wrath on them.
  footnotes:
  - marker: a
    text: Or 'the one left and shut up'; the Hebrew term may denote one hemmed in under siege, which fits the following 'by famine.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I will exhaust my wrath on them.' The Hebrew verb conveys bringing wrath to its full end in judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 멀리 있는 자는 전염병으로 죽고, 가까이 있는 자는 칼에 쓰러지며, 남아 포위된 자[a]는 기근으로 죽을 것입니다. 나는 그들에게 내 진노를 끝까지 쏟아붓겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남아 갇힌 자’. 히브리어는 포위 아래 갇히거나 봉쇄된 상태를 가리킬 수 있으며, 뒤의 ‘기근으로’와 잘 어울립니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들에게 내 진노를 다 소진하겠습니다’. 히브리어 동사는 심판을 통해 진노를 끝까지 집행하여 완결한다는 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָחוֹק
  english_pob_choice: the one far away
  chosen_korean: 먼 곳에 있는 자
  alternatives_korean:
  - 멀리 있는 자
  - 먼 데 있는 자
  lexicon: HALOT
  rationale: 관사+형용사 구조를 자연스러운 한국어 주어로 옮기되, 개별성을 유지하기 위해 ‘자’를 붙였습니다.
- source_word: בַּדֶּבֶר
  english_pob_choice: by pestilence
  chosen_korean: 전염병으로
  alternatives_korean:
  - 역병으로
  - 재앙으로
  lexicon: HALOT
  rationale: דֶּבֶר의 재앙성 감염병 의미를 살리면서도 현대 한국어에서 이해하기 쉬운 표현을 택했습니다.
- source_word: הַנִּשְׁאָר וְהַנָּצוּר
  english_pob_choice: the one left and besieged
  chosen_korean: 남아 있고 포위된 자
  alternatives_korean:
  - 남아 갇힌 자
  - 남아 고립된 자
  lexicon: HALOT
  rationale: 두 분사구를 함께 받아, 남겨진 상태와 포위된 상태를 모두 드러내면서 뒤의 기근과 연결되게 했습니다.
- source_word: בָּרָעָב
  english_pob_choice: by famine
  chosen_korean: 기근으로
  alternatives_korean:
  - 굶주림으로
  - 흉년으로
  lexicon: HALOT
  rationale: 문맥상 심각한 식량 결핍의 심판을 뜻하므로 ‘기근’이 가장 직접적입니다.
- source_word: וְכִלֵּיתִי חֲמָתִי בָּם
  english_pob_choice: I will spend my wrath on them
  chosen_korean: 내 분노를 그들 위에 다 쏟아붓겠습니다
  alternatives_korean:
  - 내 진노를 그들 위에 끝까지 퍼부으겠습니다
  - 내 분노를 그들 위에 다 쏟겠습니다
  lexicon: HALOT
  rationale: כלה의 ‘끝내다/소진하다’와 ‘wrath’의 강도를 살리기 위해, 단순한 감정보다 심판의 완결성을 드러내는 동작 표현으로 옮겼습니다.
theological_decisions:
- issue: והַנָּצוּר의 의미를 ‘보존된 자’가 아니라 포위된 자로 읽을지 여부
  chosen_reading: ‘포위된 자’로 읽어 기근과 연결했습니다.
  alternative_readings:
  - ‘보존된 자’
  - ‘갇힌 자’
  rationale: 영문 POB의 주석처럼 이 형태는 포위 아래 갇혀 있는 상태를 가리킬 수 있으며, 바로 뒤의 ‘기근으로’와 가장 자연스럽게 맞물립니다.
  doctrine_reference: 문맥 우선의 번역 원칙
