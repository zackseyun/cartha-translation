review_pass:
  verdict: revise
  source_fidelity: 핵심 세 심판(전염병, 칼, 기근)과 마지막의 진노 집행은 대체로 충실합니다. 다만 וְכִלֵּיתִי חֲמָתִי בָּם은 단순히 ‘쏟아붓다’라는 동작보다 진노를 끝까지 집행하여 소진·완결한다는 뜻을 포함하므로, 이를 본문과 주석에서 더 분명히 할 필요가 있습니다.
  naturalness: 합쇼체 문장은 전반적으로 자연스럽습니다. 그러나 ‘남아 있고 포위된 자’는 두 분사 상태를 병렬로 풀어 다소 늘어집니다. ‘남아 포위된 자’가 간결하고 자연스럽습니다.
  terminology: ‘전염병’, ‘기근’, ‘칼’은 적절합니다. חֵמָה에는 예언서의 심판 문맥에서 관례적인 ‘진노’가 잘 맞습니다. ‘포위된’은 문맥상 타당하되, 다른 어휘적 가능성은 각주로 보존해야 합니다.
  issues:
  - severity: medium
    issue: 각주 a가 본문 선택을 대안으로 제시하지 못하며, 문장 끝에 놓여 참조 대상도 불분명합니다.
    rationale: 본문도 ‘남아 있고 포위된 자’라고 번역했는데 각주도 동일한 표현을 ‘로도 옮길 수 있다’고 합니다. הַנָּצוּר의 대안인 ‘갇힌/봉쇄된’ 의미를 제시하고 해당 어구 바로 뒤에 표지해야 합니다.
  - severity: low
    issue: 각주 b의 ‘직역하면’은 정확하지 않습니다.
    rationale: כלה의 피엘형은 여기서 ‘끝내다, 소진하다, 완결하다’의 의미를 지니며, ‘분노를 다 소진하다’는 가능한 의미 번역이지 형식적 직역은 아닙니다.
  - severity: low
    issue: ‘내 분노를 그들 위에 다 쏟아붓겠습니다’는 심판의 완결성을 충분히 명시하지 않습니다.
