  to: 그때 너희는 내가 야훼임을 알게 될 것입니다. 그들의 죽임당한 자들이 그들의 우상들 가운데와 그들의 제단 사방에, 모든 높은 언덕 위와 모든 산봉우리 위에, 모든 푸른 나무 아래와 모든 무성한 테레빈스나무 아래에 널려 있을 때에, 곧 그들이 այնտեղ 그들의 모든 우상에게 기분 좋은 향기를 바치던 곳마다 그러할 것입니다.[a]
  rationale: 장소 열거와 마지막 ‘그들이 այնտեղ … 바치던 곳’ 관계절을 하나의 문장 안에서 연결했습니다. 원문에 없는 ‘제물’을 제거하고 רֵיחַ נִיחֹחַ의 향기 표현을 보존했으며, 테레빈스나무 명칭을 바로잡았습니다. ‘그러할 것입니다’는 히브리어의 ‘너희가 알게 될 것’이라는 결과 진술과 ‘죽임당한 자들이 … 있을 때’라는 상황절을 한국어에서 매끄럽게 이어 주는 보완입니다.
