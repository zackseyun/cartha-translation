  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּֽ/הְי֣וֹת חַלְלֵי/הֶ֗ם בְּ/תוֹךְ֙ גִּלּ֣וּלֵי/הֶ֔ם סְבִיב֖וֹת מִזְבְּחֽוֹתֵי/הֶ֑ם אֶל֩ כָּל גִּבְעָ֨ה רָמָ֜ה בְּ/כֹ֣ל רָאשֵׁ֣י הֶ/הָרִ֗ים וְ/תַ֨חַת כָּל עֵ֤ץ רַֽעֲנָן֙ וְ/תַ֨חַת֙ כָּל אֵלָ֣ה עֲבֻתָּ֔ה מְק֗וֹם אֲשֶׁ֤ר נָֽתְנוּ שָׁם֙ רֵ֣יחַ נִיחֹ֔חַ לְ/כֹ֖ל גִּלּוּלֵי/הֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/013.yaml
  text: Then you will know that I am Yahweh[a], when their slain lie among their idols, all around their altars, on every high hill, on all the mountaintops, and under every green tree and under every leafy terebinth—the places where they offered a pleasing aroma to all their idols.
  footnotes:
  - marker: a
    text: Hebrew גִּלּוּלִים is a strongly contemptuous term for idols, sometimes rendered more literally as 'dung-idols' or 'filthy idols.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 너희는 내가 야훼임을 알게 될 것입니다. 그들의 살해된 자들이 그들의 우상들 한가운데, 그들의 제단 사방에, 모든 높은 언덕 위와 모든 산꼭대기 위에, 또 모든 푸른 나무 아래와 모든 잎이 무성한 상수리나무 아래에 누워 있게 될 때입니다. 그곳은 그들이 모든 우상에게 향기로운 제물을 드렸던 곳입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִּלּוּלִים은 우상을 낮춰 부르는 강한 경멸어로, 때로는 ‘똥우상’ 또는 ‘더러운 우상’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  english_pob_choice: Then you will know that I am Yahweh
  chosen_korean: 그때 너희는 내가 야훼임을 알게 될 것입니다
  alternatives_korean:
  - 그러면 너희는 내가 야훼임을 알게 될 것입니다
  - 그리하여 너희는 내가 야훼인 줄 알게 될 것입니다
  lexicon: HALOT
  rationale: 예언적 심판 선언의 결과를 나타내는 העתיד적 의미를 살려 '그때'로 옮겼고, 하나님의 이름 יְהוָה는 본 항목의 기본어인 '야훼'로 일관되게 옮겼습니다.
- source_word: חַלְלֵיהֶם
  english_pob_choice: their slain
  chosen_korean: 그들의 살해된 자들
  alternatives_korean:
  - 그들의 죽임당한 자들
  - 그들의 죽은 자들
  lexicon: HALOT
  rationale: 단순한 '죽은 자들'보다 전쟁·심판 맥락의 폭력성을 드러내기 위해 '살해된 자들'로 옮겼습니다.
- source_word: בְּתוֹךְ גִּלּוּלֵיהֶם
  english_pob_choice: among their idols
  chosen_korean: 그들의 우상들 한가운데
  alternatives_korean:
  - 그들의 우상들 가운데
  - 그들의 우상들 속에
  lexicon: HALOT
  rationale: 공간적 배치를 분명히 드러내기 위해 '한가운데'를 사용했으며, גִּלּוּלִים의 경멸적 뉘앙스는 본문에서는 표준어 '우상'으로 두고 유지했습니다.
- source_word: רֵיחַ נִיחֹחַ
  english_pob_choice: a pleasing aroma
  chosen_korean: 향기로운 제물
  alternatives_korean:
  - 기분 좋은 향기
  - 향기로운 향
  lexicon: HALOT
  rationale: 직역된 '향기로운 냄새'보다 제의 문맥을 살리는 한국어 관용으로 '향기로운 제물'을 택했으며, 이는 제사를 '드리다'와 함께 제의 행위를 자연스럽게 드러냅니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기적 심판 맥락에서 언약명 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 '야훼'를 유지해 명칭의 역사적·계시적 특성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: גִּלּוּלִים의 경멸적 뉘앙스
  chosen_reading: 본문에는 '우상'을 두고, 제의·경멸 뉘앙스는 문맥으로 유지
  alternative_readings:
  - 똥우상
  - 더러운 우상
  rationale: 히브리어의 조롱 섞인 어감은 중요하지만, 본문에 노골적 조어를 넣으면 한국어 가독성이 크게 떨어지므로 기본어 '우상'을 택하고 원문의 의도는 문맥상 유지했습니다.
  doctrine_reference: Translation philosophy — source-direct with auditable tension
