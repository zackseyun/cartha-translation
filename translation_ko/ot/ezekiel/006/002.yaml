base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/002.yaml
  text: Son of man[a], set your face toward the mountains of Israel, and prophesy to them.
  footnotes:
  - marker: a
    text: 'Or ''prophesy to them.'' The Hebrew preposition can be read more neutrally, but in this judgment context the sense is effectively adversative: ''against them.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야[a], 이스라엘의 산들을 향하여 네 얼굴을 돌리고, 그들에게 예언하라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사람의 아들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인간아
  lexicon: HALOT
  rationale: 에스겔에게 반복되는 직접 호칭은 한국어에서 관용적으로도 의미를 살릴 수 있는 ‘인자’가 가장 응축적이며, 원문의 호칭성과 예언자적 거리감을 유지합니다.
- source_word: שִׂים פָּנֶיךָ
  english_pob_choice: set your face
  chosen_korean: 네 얼굴을 돌리고
  alternatives_korean:
  - 네 얼굴을 향하게 하고
  - 네 얼굴을 두고
  lexicon: HALOT
  rationale: ‘얼굴’ 이미지를 유지하면서도 한국어에서 자연스러운 방향 전환의 명령으로 옮겼습니다. ‘돌리다’는 예언적 대면의 동작을 비교적 직접적으로 드러냅니다.
- source_word: הָרֵי יִשְׂרָאֵל
  english_pob_choice: the mountains of Israel
  chosen_korean: 이스라엘의 산들
  alternatives_korean:
  - 이스라엘의 산지
  - 이스라엘의 산지들
  lexicon: HALOT
  rationale: 히브리어의 구체적 지형 표현을 보존하되, 한국어에서는 자연스러운 소유격 구문으로 옮겼습니다.
- source_word: אֲלֵיהֶם
  english_pob_choice: against them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그들을 향하여
  - 그들에 대하여
  lexicon: HALOT
  rationale: 전치사 자체는 중립적인 ‘~에게/~를 향하여’의 범위를 가지므로, 본문에서 드러나지 않은 대립 의미를 본문 속에 직접 넣지 않고 한국어로는 중립적으로 옮겼습니다.
theological_decisions:
- issue: 예언 명령의 대상 방향성
  chosen_reading: 본문은 산들을 향한 예언 명령을 말하며, 한국어 본문은 ‘그들에게’로 중립적으로 유지했습니다.
  alternative_readings:
  - 그들에게 대하여
  - 그들을 향하여
  - 그들에게 맞서
  rationale: 히브리어 전치사 אֲלֵיהֶם은 문맥에 따라 방향적일 수 있지만, 여기서는 원문에 없는 적대성을 본문에 확정하지 않고, 독자가 문맥상 심판 경고를 읽어내도록 두는 편이 소스에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: source-first 원칙 및 lexical tension 보존'
