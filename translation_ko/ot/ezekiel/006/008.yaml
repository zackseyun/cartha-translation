  text: Yet I will leave a remnant[a], when some of you become escapees from the sword among the nations, when you are scattered through the lands.
  footnotes:
  - marker: a
    text: Or 'survivors of the sword' or 'those who escape the sword.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 너희 가운데서 칼을 피한 자들을 남겨 두겠습니다. 곧 너희가 민족들 가운데로 흩어질 때, 너희 가운데 칼의 살아남은 자들이 있을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘칼의 살아남은 자들’ 또는 ‘칼에서 빠져나온 자들’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתַרְתִּי
  english_pob_choice: Yet I will leave a remnant
  chosen_korean: 내가 ... 남겨 두겠습니다
  alternatives_korean:
  - 내가 ... 남겨 두겠습니다
  - 내가 ... 남겨 놓겠습니다
  - 내가 ... 살려 두겠습니다
  lexicon: HALOT
  rationale: 히필 יתר의 ‘남겨 두다/남기다’ 의미를 살려, 심판 중에도 일부를 보존하시는 하나님의 행위를 자연스러운 합쇼체로 옮겼습니다.
- source_word: פְּלִיטֵי חֶרֶב
  english_pob_choice: escapees from the sword
  chosen_korean: 칼을 피한 자들
  alternatives_korean:
  - 칼에서 도망친 자들
  - 칼의 생존자들
  - 칼의 살아남은 자들
  lexicon: HALOT
  rationale: פְּלִיטִים은 ‘도망하여 빠져나온 사람들’이라는 뜻이므로, 전쟁 도구인 ‘칼’을 목적어로 두어 직접적으로 ‘칼을 피한 자들’로 옮겼습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 민족들 가운데
  alternatives_korean:
  - 열국 가운데
  - 나라들 가운데
  - 이방 민족들 가운데
  lexicon: HALOT
  rationale: 여기서 גּוֹיִם은 이스라엘 바깥의 여러 민족들을 가리키므로, 문맥을 살리되 한국어에서 과도하게 신학화하지 않는 ‘민족들 가운데’로 옮겼습니다.
- source_word: בְּהִזָּרוֹתֵיכֶם
  english_pob_choice: when you are scattered
  chosen_korean: 너희가 ... 흩어질 때
  alternatives_korean:
  - 너희가 ... 흩어질 때
  - 너희가 ... 흩어지는 때
  - 너희가 ... 흩어짐을 당할 때
  lexicon: HALOT
  rationale: זרה의 분산/산개 의미를 반영해, 수동적으로 ‘흩어질 때’라고 자연스럽게 옮겨 흩어짐의 사건 자체를 드러냈습니다.
- source_word: בָּאֲרָצוֹת
  english_pob_choice: through the lands
  chosen_korean: 여러 땅으로
  alternatives_korean:
  - 땅들로
  - 나라들로
  - 여러 나라로
  lexicon: HALOT
  rationale: 복수형 אֲרָצוֹת는 여러 지역/땅을 가리키므로, 유배의 분산 범위를 보여 주는 ‘여러 땅으로’로 옮겼습니다.
theological_decisions:
- issue: 심판 속 남은 자의 보존
  chosen_reading: 칼을 피한 자들을 남겨 두겠습니다
  alternative_readings:
  - 칼을 피한 자들을 남겨 두겠습니다
  - 칼의 살아남은 자들을 남겨 두겠습니다
  - 일부를 살려 두겠습니다
  rationale: 이 절은 완전한 멸망이 아니라 남은 자의 보존을 말하므로, ‘남겨 두겠습니다’로 심판과 긍휼의 긴장을 함께 드러냈습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
