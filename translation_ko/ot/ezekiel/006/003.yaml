id: EZK.6.3
reference: Ezekiel 6:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָ֣מַרְתָּ֔ הָרֵי֙ יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּה אָמַ֣ר אֲדֹנָ֣/י יְ֠הוִה לֶ/הָרִ֨ים וְ/לַ/גְּבָע֜וֹת לָ/אֲפִיקִ֣ים ו/ל/גאית הִנְ/נִ֨י אֲנִ֜י מֵבִ֤יא עֲלֵי/כֶם֙ חֶ֔רֶב וְ/אִבַּדְתִּ֖י בָּמֽוֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/003.yaml
  text: 'and say[a], ‘Mountains of Israel, hear the word of the Lord GOD. Thus says the Lord GOD to the mountains and to the hills, to the ravines and to the valleys: Behold, I myself am bringing a sword upon you[b], and I will destroy your high places.’'
  footnotes:
  - marker: a
    text: Or “to the channels” or “to the wadis” for “to the ravines.”
    reason: lexical_alternative
  - marker: b
    text: “High places” refers to elevated worship sites, often associated with illicit or idolatrous worship.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 말하십시오. 「이스라엘의 산들아, 주 야훼의 말씀을 들으십시오. 주 야훼께서 산들과 언덕들과 골짜기들[a]과 계곡들에게 이렇게 말씀하십니다. 보십시오, 내가 친히 너희에게 칼을 가져올 것이며, 너희의 산당들[b]을 멸하겠습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘골짜기들’에 해당하는 אַפִיקִים는 물길, 개울자리, 와디 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘산당들’은 대개 언덕이나 높은 곳에 세운 제의 장소로, 종종 불법적이거나 우상숭배와 연결됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי יִשְׂרָאֵל
  english_pob_choice: Mountains of Israel
  chosen_korean: 이스라엘의 산들
  alternatives_korean:
  - 이스라엘 산들
  - 이스라엘의 산지
  lexicon: HALOT
  rationale: 직접 부름의 대상인 지리적 고지를 자연스럽게 살리면서, 영어 POB의 문맥상 의인화된 호칭을 한국어로 전달했습니다.
- source_word: שִׁמְעוּ דְּבַר
  english_pob_choice: hear the word
  chosen_korean: 말씀을 들으십시오
  alternatives_korean:
  - 말을 들으십시오
  - 말씀에 귀를 기울이십시오
  lexicon: HALOT
  rationale: 예언자적 권고문의 정형을 살려 ‘들으십시오’로 옮겼고, דְּבַר는 하나님의 권위 있는 말씀이라는 점을 드러내기 위해 ‘말씀’으로 번역했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: הַאדֹנָי + YHWH의 결합을 중복 없이 살리기 위해 ‘주’와 고유명 ‘야훼’를 병기했습니다. 프로젝트 기본어휘에 따라 יְהוָה는 ‘야훼’로 옮겼습니다.
- source_word: הִנְנִי אֲנִי מֵבִיא
  english_pob_choice: Behold, I myself am bringing
  chosen_korean: 보십시오, 내가 … 가져오며
  alternatives_korean:
  - 보십시오, 내가 스스로 가져오며
  - 보십시오, 내가 친히 가져오며
  lexicon: HALOT
  rationale: הִנְנִי אֲנִי의 강조를 ‘보십시오, 내가’로 살렸고, 진행·임박의 뉘앙스는 ‘가져오며’로 자연스럽게 반영했습니다.
- source_word: חֶרֶב
  english_pob_choice: a sword
  chosen_korean: 칼
  alternatives_korean:
  - 한 칼
  - 전쟁의 칼
  lexicon: HALOT
  rationale: 예언 문맥의 심판 도구를 한국어에서 더 직접적이고 구어적인 이미지인 ‘칼’로 옮겼습니다.
- source_word: בָּמוֹתֵיכֶם
  english_pob_choice: your high places
  chosen_korean: 산당들
  alternatives_korean:
  - 높은 곳들
  - 높은 제의 장소들
  lexicon: HALOT
  rationale: ‘high places’는 우상숭배와 관련된 제의 장소를 가리키므로, 한국어 성경 전통과 본문의 종교적 함의를 함께 살릴 수 있는 ‘산당들’로 번역했습니다.
theological_decisions:
- issue: YHWH의 표기와 직함 결합(אֲדֹנָי יְהוִה)
  chosen_reading: ‘주 야훼’로 옮겨 직함과 고유명을 함께 드러냈습니다.
  alternative_readings:
  - ‘주 하나님’
  - ‘주 여호와’
  rationale: 본문은 예언자적 신탁의 권위를 강조하므로, 단순한 일반 명칭보다 고유명 YHWH를 드러내는 번역이 source-direct합니다. 또한 주(אֲדֹנָי)와 이름(YHWH)의 중복을 한국어에서 자연스럽게 처리해야 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘산당들’의 종교적 함의
  chosen_reading: 단순 지형이 아니라 우상숭배와 연결된 제의 장소로 이해하여 ‘산당들’로 번역했습니다.
  alternative_readings:
  - ‘높은 곳들’
  - ‘높은 제의 장소들’
  rationale: 히브리어 בָּמוֹת는 예언서에서 종종 불법적·우상적 예배 장소를 뜻하므로, 문맥의 신학적 경고를 약화시키지 않도록 전통적이면서도 의미가 분명한 표현을 택했습니다.
  doctrine_reference: Ezekiel prophetic judgment against illicit worship
