translation:
  language: ko
  text: 내가 그들을 향해 내 손을 뻗어, 그 땅을 광야에서 디블라트 쪽에 이르기까지[a] 그들의 모든 거처에 걸쳐[b] 황무지와 폐허가 되게 하겠습니다. 그러면 그들은 내가 야훼인 줄 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘광야에서 디블라트 쪽으로’라고 합니다. 이 지명의 위치는 확실하지 않습니다. 이를 ‘광야에서 디블라트까지’로 이해하기도 하며, 일부 본문 수정안은 리블라와 관련짓습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘그들의 모든 거처에.’
    reason: lexical_alternative
