language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/כֹל֙ מוֹשְׁב֣וֹתֵי/כֶ֔ם הֶ/עָרִ֣ים תֶּחֱרַ֔בְנָה וְ/הַ/בָּמ֖וֹת תִּישָׁ֑מְנָה לְמַעַן֩ יֶחֶרְב֨וּ וְ/יֶאְשְׁמ֜וּ מִזְבְּחֽוֹתֵי/כֶ֗ם וְ/נִשְׁבְּר֤וּ וְ/נִשְׁבְּתוּ֙ גִּלּ֣וּלֵי/כֶ֔ם וְ/נִגְדְּעוּ֙ חַמָּ֣נֵי/כֶ֔ם וְ/נִמְח֖וּ מַעֲשֵׂי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/006.yaml
  text: In all your dwelling places[a], the cities will be laid waste and the high places will be desolated, so that your altars may be laid waste and desolated, and your idols broken and brought to an end, and your incense altars cut down[b], and your works wiped out.
  footnotes:
  - marker: a
    text: Hebrew גִּלּוּלִים is a contemptuous term for idols, possibly carrying the sense of 'filthy' or 'dungy' idols.
    reason: lexical_alternative
  - marker: b
    text: Or 'your sun pillars' / 'your sun-images' for 'your incense altars'; the Hebrew term refers to a debated type of cultic object, possibly associated with solar worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 모든 거처에서 도시들은 황폐하게 되고, 산당들은 황폐해질 것입니다. 그리하여 너희 제단들은 황폐하게 되고 황폐해지며, 너희 우상들은 부서지고 끝나며, 너희 분향대들은 무너지고, 너희의 행위들은 지워질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִּלּוּלִים는 우상을 낮잡아 부르는 말로, ‘더러운 우상들’ 또는 ‘오물 같은 우상들’의 뉘앙스를 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희 태양기둥들’ / ‘너희 태양상들’. 히브리어는 논쟁적인 예배용 물건을 가리키며, 태양 숭배와 관련된 것으로 보일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשְׁבֹתֵיכֶם
  english_pob_choice: your dwelling places
  chosen_korean: 너희 모든 거처
  alternatives_korean:
  - 너희 거주지들
  - 너희 살던 곳들
  lexicon: HALOT
  rationale: 거주의 장소라는 넓은 의미를 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: הֶעָרִים תֶּחֱרַבְנָה
  english_pob_choice: the cities will be laid waste
  chosen_korean: 도시들은 황폐하게 되고
  alternatives_korean:
  - 도시들은 폐허가 되고
  - 도시들은 파괴될 것입니다
  lexicon: HALOT
  rationale: חרב의 심판적 파괴감을 살리기 위해 ‘황폐하게 되다’를 택했습니다.
- source_word: גִּלּוּלֵיכֶם
  english_pob_choice: your idols
  chosen_korean: 너희 우상들
  alternatives_korean:
  - 너희 더러운 우상들
  - 너희 오물 같은 우상들
  lexicon: HALOT
  rationale: 주본문에서는 의미를 분명히 하는 기본어로 두고, 경멸적 뉘앙스는 필요에 따라 주석에서 보충할 수 있습니다.
- source_word: חַמָּנֵיכֶם
  english_pob_choice: your incense altars
  chosen_korean: 너희 분향대들
  alternatives_korean:
  - 너희 햇볕기둥들
  - 너희 해상들
  lexicon: HALOT
  rationale: 문맥상 예배용 기구를 가리키는 표현으로 이해해 ‘분향대들’을 택했고, 학술적으로 논쟁적인 대상을 무리하게 특정하지 않았습니다.
- source_word: מַעֲשֵׂיכֶם
  english_pob_choice: your works
  chosen_korean: 너희의 행위들
  alternatives_korean:
  - 너희가 만든 것들
  - 너희 작품들
  lexicon: HALOT
  rationale: 예언서 문맥에서 인간의 손으로 이루어진 결과와 행위를 모두 포괄할 수 있도록 다소 열린 표현을 사용했습니다.
theological_decisions:
- issue: 반복되는 멸망 표현의 강도 유지
  chosen_reading: ‘황폐하게 되고… 황폐해지며’처럼 동일 어근의 반복을 살려 심판의 중첩성과 절박함을 드러냈습니다.
  alternative_readings:
  - 한 번만 ‘황폐하다’로 압축하기
  - ‘파괴되고 파괴되며’로 일반화하기
  rationale: 히브리어는 제단과 산당에 대한 파괴를 반복적으로 강조하므로, 한국어도 반복을 통해 심판의 강도를 유지하는 것이 좋습니다.
  doctrine_reference: 번역 원칙 1, 3, 5
- issue: גִּלּוּלִים의 경멸적 색채 처리
  chosen_reading: 본문에는 ‘우상들’로 두고, 경멸적 뉘앙스는 주석으로 처리합니다.
  alternative_readings:
  - ‘더러운 우상들’로 본문에 반영하기
  - ‘오물 같은 우상들’로 강하게 옮기기
  rationale: 주본문의 가독성을 유지하면서도, 원어의 멸시적 어감을 노트에서 추적 가능하게 남기는 편이 audit trail에 더 적합합니다.
  doctrine_reference: 번역 원칙 1, 3, 6
