  source_fidelity: 원문은 예언 공식 ‘יַהוֶה의 말씀’이 에스겔에게 임하고 이어지는 발화를 도입하는 구문입니다. 초안은 ‘말씀’과 ‘임하여’를 잘 반영하지만, יְהוָה의 표기를 ‘여호와’로 바꾸어 원문 및 POB의 신명어 방침과 일치하지 않습니다.
  naturalness: ‘…임하여 말씀하셨습니다’는 문법적으로 가능하나 ‘말씀’과 ‘말씀하셨습니다’의 중복이 다소 부자연스럽고, 뒤 절의 직접 발화를 도입하는 לֵאמֹר의 기능도 흐려집니다. ‘말씀하시기를,’은 다음 절과 연결되는 고전적 예언 공식이면서도 현대 독자가 이해할 수 있습니다.
  terminology: יְהוָה는 프로젝트 방침과 원문 표기에 따라 ‘야훼’로 옮깁니다. דְבַר־יְהוָה는 ‘야훼의 말씀’으로 유지합니다.
