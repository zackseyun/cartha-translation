  rationale: 예언 공식에서 ‘말씀이 … 오다’의 자연스러운 한국어를 살리되, 단순한 사건 발생보다 말씀의 도래를 드러내기 위해 ‘임하여’를 택했습니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
