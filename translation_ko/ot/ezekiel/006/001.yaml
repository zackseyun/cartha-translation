  - 메시지
  lexicon: HALOT
  rationale: 예언 문맥의 정형구 ‘여호와의 말씀’에 맞추어, ‘message’보다 원문의 형식과 신학적 무게를 보존하는 ‘말씀’을 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 이 절의 기존 English POB가 주석으로 신명어를 표기하고 있으나, 한국어 본문은 교역어 관행과 가독성을 고려해 ‘여호와’를 사용했습니다.
theological_decisions:
- issue: 신명어 יְהוָה의 한국어 표기
  chosen_reading: 본문에는 ‘여호와’로 두어 한국어 독자가 예언서의 정형구를 즉시 알아보게 했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 원문은 야훼의 직접 계시를 나타내는 신명어이지만, 한국어에서는 예언 공식 ‘여호와의 말씀’이 의미 전달과 문체 면에서 가장 안정적입니다.
