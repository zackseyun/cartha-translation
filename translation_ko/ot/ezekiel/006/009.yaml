revisions:
- from: 그때 너희의 살아남은 자들이, 포로로 끌려간 그 민족들 가운데서 나를 기억할 것입니다[a]. 내가 그들의 음행하는 마음—나에게서 돌아선 그 마음—을 꺾고, 그들의 우상들을 따라 음행하던 눈을 꺾을 때[b][c], 그들은 자신들이 행한 모든 악과 모든 가증한 일들로 인해 스스로를 역겨워할 것입니다.
  to: 그때 너희의 살아남은 자들이 포로로 끌려간 그 민족들 가운데서 나를 기억할 것입니다[a]. 내가 나에게서 돌아선 그들의 음행하는 마음과 그들의 우상들을 따라 음행하던 눈을 꺾었을 때[b][c], 그들은 자신들이 저지른 온갖 가증한 악행 때문에 스스로를 역겨워할 것입니다.
  rationale: 원문의 병렬 목적어 구조를 한국어에서 한 번의 ‘꺾었을 때’ 아래에 결속하여, 동사의 적용 범위와 예언적 완료 표현을 보존했습니다. 마지막 구절은 악행과 가증함의 관계를 ‘온갖 가증한 악행’으로 정리했습니다. 논쟁적인 נשברתי의 수동적 대안은 본문에 강제하지 않고 각주에 명료하게 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:37:42Z'
review_pass:
  verdict: revise
  source_fidelity: 본문은 전반적으로 포로 된 생존자들의 기억과 회개라는 흐름을 잘 옮겼습니다. 그러나 히브리어의 목적어 구조상 ‘꺾고’는 ‘마음’뿐 아니라 이어지는 ‘눈’에도 걸리는데, 초안은 이를 두 번 반복하여 한국어상 어색하게 만들었습니다. 또한 마지막 절의 ‘그들의 모든 가증한 일들로 인해’는 악행과 가증한 일을 병렬 항목처럼 보이게 하므로, ‘온갖 가증한 악행’으로 관계를 더 정확히 드러내는 편이 안전합니다.
  naturalness: ‘마음과 눈을 꺾었을 때’는 원문의 의도적으로 거친 비유를 보존하면서도, ‘눈을 꺾을 때’보다 한국어 문장 흐름이 낫습니다. ‘스스로를 역겨워할 것입니다’는 현대 표준어 합쇼체에 맞고 자기 혐오의 반성적 의미를 잘 전달합니다.
  terminology: ‘살아남은 자들’, ‘포로로 끌려간’, ‘음행하는 마음’, ‘우상들’, ‘가증한 악행’은 심판·우상숭배 문맥과 에스겔의 강한 비유를 적절히 보존합니다. גלולים의 경멸적 뉘앙스와 נשברתי의 대안 해석은 각주에서 유지합니다.
  issues:
