    rationale: לכל תועבותיהם는 그들이 행한 악행의 범위·성격을 규정합니다. 두 개의 독립된 목록처럼 옮기기보다 ‘온갖 가증한 악행’으로 표현하는 것이 원문의 관계를 더 잘 보존합니다.
