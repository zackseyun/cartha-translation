  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זָכְר֨וּ פְלִֽיטֵי/כֶ֜ם אוֹתִ֗/י בַּ/גּוֹיִם֮ אֲשֶׁ֣ר נִשְׁבּוּ שָׁם֒ אֲשֶׁ֨ר נִשְׁבַּ֜רְתִּי אֶת לִבָּ֣/ם הַ/זּוֹנֶ֗ה אֲשֶׁר סָר֙ מֵֽ/עָלַ֔/י וְ/אֵת֙ עֵֽינֵי/הֶ֔ם הַ/זֹּנ֕וֹת אַחֲרֵ֖י גִּלּֽוּלֵי/הֶ֑ם וְ/נָקֹ֨טּוּ֙ בִּ/פְנֵי/הֶ֔ם אֶל הָֽ/רָעוֹת֙ אֲשֶׁ֣ר עָשׂ֔וּ לְ/כֹ֖ל תּוֹעֲבֹתֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/009.yaml
  text: Then your survivors will remember me among the nations where they were taken captive[a], when I have broken their whoring heart that turned away from me, and their eyes that whored after their idols[c][b]; and they will loathe themselves for the evils they committed in all their abominations.
  footnotes:
  - marker: a
    text: Or, 'when I was broken by their whoring heart that turned away from me.' The Hebrew verb can be understood this way by some interpreters, emphasizing the LORD's grief over their unfaithfulness.
    reason: alternative_reading
  - marker: b
    text: The Hebrew uses prostitution imagery ('whoring heart,' 'eyes that whored') as a metaphor for covenant unfaithfulness and idolatry.
    reason: cultural_note
  - marker: c
    text: '''Idols'' translates a contemptuous Hebrew term often used by Ezekiel for false gods; it may carry a pejorative nuance such as ''filthy idols.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 너희의 살아남은 자들이, 포로로 끌려간 그 민족들 가운데서 나를 기억할 것입니다[a]. 내가 그들의 음행하는 마음—나에게서 돌아선 그 마음—을 꺾고, 그들의 우상들을 따라 음행하던 눈을 꺾을 때[b][c], 그들은 자신들이 행한 모든 악과 모든 가증한 일들로 인해 스스로를 역겨워할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그들의 음행하는 마음이 나에게서 돌아선 것 때문에 상처 입었다’로도 이해할 수 있습니다. 히브리어 동사는 일부 해석자들에 의해 이렇게 읽히며, 그들의 불성실로 인해 상한 야훼의 슬픔을 강조합니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 히브리어는 언약적 불성실과 우상숭배를 가리키는 비유로서 ‘음행하는 마음’, ‘음행하던 눈’이라는 성적 이미지를 사용합니다.
    reason: cultural_note
  - marker: c
    text: ‘우상들’로 옮긴 히브리어는 에스겔이 자주 쓰는 경멸적 표현으로, ‘더러운 우상들’ 같은 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכְרוּ
  english_pob_choice: Then ... will remember
  chosen_korean: 그때 ... 기억할 것입니다
  alternatives_korean:
  - 그리고 ... 기억할 것입니다
  - 그리하여 ... 기억할 것입니다
  lexicon: HALOT
  rationale: 예언 문맥의 결과·전개를 살려, 단순한 접속보다 ‘그때’로 자연스럽게 이어 주었습니다.
- source_word: פְלִיטֵיכֶם
  english_pob_choice: your survivors
  chosen_korean: 너희의 살아남은 자들
  alternatives_korean:
  - 너희의 도망친 자들
  - 너희의 피한 자들
  lexicon: HALOT
  rationale: 도피자보다 ‘살아남은 자들’이 심판 맥락에서 남은 자의 의미를 더 분명하게 전달합니다.
- source_word: לבם הזונה / עיניהם הזנות
  english_pob_choice: their whoring heart / their eyes that whored
  chosen_korean: 그들의 음행하는 마음 / 그들의 우상들을 따라 음행하던 눈
  alternatives_korean:
  - 그들의 음란한 마음 / 그들의 음란한 눈
  - 그들의 간음하는 마음 / 그들의 간음하는 눈
  lexicon: HALOT
  rationale: 에스겔의 반복되는 성적 비유를 완화하지 않고, 언약 불성실과 우상숭배의 충격을 드러내는 표현을 택했습니다.
- source_word: גלוליהם
  english_pob_choice: their idols
  chosen_korean: 그들의 우상들
  alternatives_korean:
  - 그들의 더러운 우상들
  - 그들의 똥우상들
  lexicon: HALOT
  rationale: גלולים의 경멸적 뉘앙스는 주석으로 남기고, 본문은 통용되는 핵심 의미인 ‘우상들’로 옮겼습니다.
- source_word: ונקטו בפניהם
  english_pob_choice: they will loathe themselves
  chosen_korean: 스스로를 역겨워할 것입니다
  alternatives_korean:
  - 자기 자신에게서 혐오를 느낄 것입니다
  - 자기 앞에서 자기 자신을 혐오할 것입니다
  lexicon: HALOT
  rationale: 관용구의 반성적·자기혐오적 의미를 현대 한국어로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 'The verb נשברתי: active divine breaking versus passive divine grief'
  chosen_reading: 하나님이 그들의 음행하는 마음을 꺾으시는 주어로 읽었습니다.
  alternative_readings:
  - ‘내가 그들의 음행하는 마음 때문에 상처 입었다/깨어졌다’로 읽는 견해
  - 수동·반사적으로 읽어 하나님의 슬픔을 강조하는 견해
  rationale: 마소라 모음과 목적어 표지가 능동 해석을 지지하므로 본문 흐름에 맞춰 심판 속의 회복을 이끄는 적극적 행위로 옮겼습니다. 다만 다른 해석의 신학적 의미는 각주로 보존했습니다.
  doctrine_reference: 본문의 문법적 우선순위를 따르되, 하나님-백성 관계의 정서적 긴장은 삭제하지 않습니다.
