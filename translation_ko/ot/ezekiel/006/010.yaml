id: EZK.6.10
reference: Ezekiel 6:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה לֹ֤א אֶל חִנָּם֙ דִּבַּ֔רְתִּי לַ/עֲשׂ֥וֹת לָ/הֶ֖ם הָ/רָעָ֥ה הַ/זֹּֽאת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/010.yaml
  text: Then they will know that I am Yahweh[b][a]; I did not speak in vain when I said I would bring this disaster upon them.
  footnotes:
  - marker: a
    text: Or 'I did not speak for nothing' or 'I did not speak without cause.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'this evil'; here the word refers to calamity or disaster brought as judgment, not moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그들은 내가 야훼임을 알게 될 것입니다. 내가 그들에게 이 재앙을 내리겠다고 말한 것은 헛된 말이 아니었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדְעוּ
  english_pob_choice: Then they will know
  chosen_korean: 그러면 그들은 알게 될 것입니다
  alternatives_korean:
  - 그리고 그들은 알게 될 것입니다
  lexicon: HALOT
  rationale: 예언적 심판의 결과를 나타내는 연결어이므로 ‘그러면’으로 결과성을 살렸고, עתיד적 의미를 한국어 미래로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md Contested terms
  rationale: 프로젝트 기본값에 따라 여호와가 아니라 음역형 ‘야훼’를 사용해 원문 고유명을 드러냈습니다.
- source_word: לֹא אֶל חִנָּם דִּבַּרְתִּי
  english_pob_choice: I did not speak in vain
  chosen_korean: 헛되이 말한 것이 아니었습니다
  alternatives_korean:
  - 쓸데없이 말한 것이 아니었습니다
  - 이유 없이 말한 것이 아니었습니다
  lexicon: HALOT
  rationale: ‘חִנָּם’의 무효성·무의미함을 한국어 관용 표현 ‘헛되이’로 옮겨, 하나님의 말씀이 공허하지 않았다는 뜻을 살렸습니다.
- source_word: לַעֲשׂוֹת לָהֶם הָרָעָה הַזֹּאת
  english_pob_choice: when I said I would bring this disaster upon them
  chosen_korean: 내가 그들에게 이 재앙을 내리겠다고 말할 때
  alternatives_korean:
  - 내가 그들에게 이 재난을 행하겠다고 말할 때
  - 내가 그들에게 이 재앙을 주겠다고 말할 때
  lexicon: HALOT
  rationale: 직역의 ‘그들에게 행하다’보다 한국어에서는 심판의 주체성을 살리는 ‘내리다’가 자연스럽고, כאן의 רָעָה는 도덕적 악이 아니라 징벌적 재앙이므로 ‘재앙’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 인지 공식 ‘내가 야훼임을 알게 될 것입니다’는 언약적 자기계시를 강조하므로, 번역 전통적 완곡어법보다 원문 고유명 표기를 우선했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: הָרָעָה의 의미
  chosen_reading: 재앙
  alternative_readings:
  - 악
  - 재난
  rationale: 문맥상 이것은 하나님께서 가져오시는 심판적 재앙이지 도덕적 악이 아니므로, 오해를 피하면서도 դատ판의 무게를 드러내는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
