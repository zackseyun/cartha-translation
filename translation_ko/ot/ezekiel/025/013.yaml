reference: Ezekiel 25:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/נָטִ֤תִי יָדִ/י֙ עַל אֱד֔וֹם וְ/הִכְרַתִּ֥י מִמֶּ֖/נָּה אָדָ֣ם וּ/בְהֵמָ֑ה וּ/נְתַתִּ֤י/הָ חָרְבָּה֙ מִ/תֵּימָ֔ן וּ/דְדָ֖נֶ/ה בַּ/חֶ֥רֶב יִפֹּֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/013.yaml
  text: 'Therefore thus says the Lord GOD: I will stretch out my hand against Edom[a], and I will cut off from it man and beast, and I will make it a desolation; from Teman even to Dedan they will fall by the sword.'
  footnotes:
  - marker: a
    text: Or 'as far as Dedan.' The Hebrew phrase indicates the extent of Edom's devastation from Teman to Dedan.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. “내가 내 손을 에돔 위에 뻗어, 그 가운데서 사람과 짐승을 끊어 버리고, 그것을 황무지로 만들겠습니다. 데만에서부터 드단까지 그들이 칼에 쓰러질 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘드단까지’. 히브리어 구문은 데만에서 드단에 이르기까지 에돔의 황폐가 미치는 범위를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
  rationale: 아도나이와 야훼의 결합을 한국어에서 중복 없이 드러내기 위해 ‘주 야훼’로 옮겼습니다. 전통적 ‘주 하나님’은 יְהוִה의 고유성을 흐릴 수 있어 피했습니다.
- source_word: וְנָטִתִי יָדִי
  english_pob_choice: I will stretch out my hand
  chosen_korean: 내 손을 ... 뻗어
  alternatives_korean:
  - 내 손을 펼쳐
  - 내 손을 내밀어
  lexicon: HALOT
  rationale: 심판 개입을 뜻하는 관용구를 살리기 위해 손을 ‘뻗다’로 옮겼습니다. 영어 POB의 이미지와 히브리어 동작성을 함께 반영합니다.
- source_word: וְהִכְרַתִּי מִמֶּנָּה אָדָם וּבְהֵמָה
  english_pob_choice: I will cut off from it man and beast
  chosen_korean: 그 가운데서 사람과 짐승을 끊어 버리고
  alternatives_korean:
  - 그 안에서 사람과 짐승을 멸하고
  - 그곳에서 사람과 짐승을 끊어 내고
  lexicon: HALOT
  rationale: ‘끊다’가 כרת의 언약적 심판 뉘앙스를 가장 직접적으로 살립니다. ‘사람과 짐승’은 관용적 짝을 유지하면서 대상의 전면적 제거를 드러냅니다.
- source_word: וּנְתַתִּיהָ חָרְבָּה
  english_pob_choice: I will make it a desolation
  chosen_korean: 그것을 황무지로 만들겠습니다
  alternatives_korean:
  - 그것을 황폐하게 만들겠습니다
  - 그것을 황무함으로 삼겠습니다
  lexicon: HALOT
  rationale: 명사적 כוח/상태를 한국어에서 자연스럽게 전달하기 위해 ‘황무지’로 옮겼습니다. 심판의 결과 상태를 분명히 드러냅니다.
- source_word: מִתֵּימָן ... וּדְדָנֶה
  english_pob_choice: from Teman even to Dedan
  chosen_korean: 데만에서부터 드단까지
  alternatives_korean:
  - 데만으로부터 드단까지
  - 데만에서 드단에 이르기까지
  lexicon: HALOT
  rationale: 두 지명 사이의 범위를 나타내는 표현으로 한국어 자연성을 살려 ‘에서부터 ... 까지’를 사용했습니다. 지명은 음역해 유지했습니다.
- source_word: בַּחֶרֶב יִפֹּלוּ
  english_pob_choice: they will fall by the sword
  chosen_korean: 칼에 쓰러질 것입니다
  alternatives_korean:
  - 칼에 엎드러질 것입니다
  - 칼로 말미암아 죽을 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서 지나치게 직역하지 않으면서도 심판적 죽음을 자연스럽게 표현했습니다. ‘쓰러지다’는 문학적이면서도 현대 한국어에서 명확합니다.
theological_decisions:
- issue: YHWH의 한국어 표기와 아도나이-야훼 결합 처리
  chosen_reading: 본문에서는 ‘주 야훼’로 표기했습니다.
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 원문은 אֲדֹנָי יְהוִה의 결합형이므로, 아도나이의 호칭성과 YHWH의 고유명을 둘 다 보존하는 방식이 필요합니다. ‘주 야훼’가 중복 없이 가장 직접적으로 이를 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
