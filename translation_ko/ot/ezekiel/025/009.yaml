theological_decisions:
- issue: 예언적 화행의 시제/어조
  chosen_reading: ‘내가 … 열겠습니다’로 옮겨, 선언적 미래와 현재적 임박성을 함께 살렸습니다.
  alternative_readings:
  - ‘내가 … 엽니다’
  - ‘내가 … 열어 놓습니다’
  rationale: 예언 화법에서는 단순한 사실 진술보다 하나님의 확정적 선언이 중요하므로, 한국어에서도 단정적 미래로 표현하는 편이 본문의 힘을 보존합니다.
  doctrine_reference: 예언 장르와 신적 선언의 확실성
- issue: 지명 열거 앞의 ‘이 땅의 영광’ 처리
  chosen_reading: 지명들을 그 나라의 ‘영광’으로 제시해, 도시 목록이 단순 정보가 아니라 모압의 핵심과 자랑이 무너지는 선언임을 드러냈습니다.
  alternative_readings:
  - ‘이 땅의 아름다움’
  - ‘이 땅의 빼어난 곳’
  rationale: 본문의 수사는 단순한 지리 열거가 아니라 심판 대상의 상징적 중심을 짚는 방식이므로, 도덕적 완곡화 없이 원문의 강조를 유지했습니다.
  doctrine_reference: 예언 심판의 수사적 과장
