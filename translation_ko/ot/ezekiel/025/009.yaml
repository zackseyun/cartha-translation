source:
  edition: WLC
  text: לָ/כֵן֩ הִנְ/נִ֨י פֹתֵ֜חַ אֶת כֶּ֤תֶף מוֹאָב֙ מֵ/הֶ֣/עָרִ֔ים מֵֽ/עָרָ֖י/ו מִ/קָּצֵ֑/הוּ צְבִ֗י אֶ֚רֶץ בֵּ֣ית הַיְשִׁימֹ֔ת בַּ֥עַל מְע֖וֹן ו/קריתמ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/009.yaml
  text: 'Therefore behold[a], I am opening the flank of Moab from its cities, from its frontier cities, the glory of the land: Beth-jeshimoth, Baal-meon[c][b], and Kiriathaim.'
  footnotes:
  - marker: a
    text: Or 'the side of Moab' or more literally 'the shoulder of Moab.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the beauty of the land.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew text has a spelling form for the final place name corresponding to Kiriathaim, a known Moabite city.
    reason: textual_variant
translation:
  language: ko
  text: 그러므로 보십시오, 내가 모압의 측면을, 곧 그 도시들에서, 그 경계의 도시들에서, 이 땅의 영광인 벳여시못과 바알므온과 기랴다임을 열겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כֶּתֶף는 문자적으로는 ‘어깨’이지만, 여기서는 지형적으로 노출된 ‘측면/옆면’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: צְבִי는 ‘아름다움’이나 ‘장관’을 뜻할 수도 있으나, 여기서는 땅의 ‘영광’이라는 높임 표현이 문맥에 더 잘 맞습니다.
    reason: lexical_alternative
  - marker: c
    text: 마소라 본문에는 마지막 지명이 기랴다임에 해당하는 철자 변이가 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: הִנְנִי פֹתֵחַ
  english_pob_choice: I am opening
  chosen_korean: 내가 … 열겠습니다
  alternatives_korean:
  - 내가 … 엽니다
  - 내가 … 열어 두겠습니다
  lexicon: HALOT
  rationale: 히브리어 분사와 הִנְנִי는 예언적 임박성을 띠므로, 미래형으로 자연스럽게 살리되 현재적 긴박감도 유지했습니다.
- source_word: כֶּתֶף מוֹאָב
  english_pob_choice: the flank of Moab
  chosen_korean: 모압의 측면
  alternatives_korean:
  - 모압의 옆구리
  - 모압의 어깨
  lexicon: HALOT
  rationale: 지리·군사적 문맥에서 כֶּתֶף는 문자적 ‘어깨’보다 노출된 ‘측면/옆면’을 뜻하므로, 직역보다 의미를 살린 ‘측면’을 택했습니다.
- source_word: צְבִי אֶרֶץ
  english_pob_choice: the glory of the land
  chosen_korean: 이 땅의 영광
  alternatives_korean:
  - 이 땅의 아름다움
  - 이 땅의 자랑
  lexicon: HALOT
  rationale: צְבִי는 ‘아름다움/장관/영광’의 범위를 가지며, 여기서는 땅의 빼어난 핵심 도시들을 가리키는 높임말로 쓰였으므로 ‘영광’이 예언적 어조를 가장 잘 보존합니다.
- source_word: בֵּית הַיְשִׁימֹת / בַּעַל מְעוֹן / וקריתמה
  english_pob_choice: Beth-jeshimoth, Baal-meon, and Kiriathaim
  chosen_korean: 벳여시못과 바알므온과 기랴다임
  alternatives_korean:
  - 벳 예시못과 바알 메온과 기랴다임
  - 벳여시못, 바알므온, 그리고 기랴다임
  lexicon: HALOT
  rationale: 지명은 관례에 따라 음역했고, 한국어 가독성을 위해 하이픈보다 붙여 쓰는 형태를 택했습니다. 마지막 지명은 마소라 본문의 철자 변이를 반영해 기랴다임으로 옮겼습니다.
theological_decisions:
- issue: 예언적 화행의 시제/어조
  chosen_reading: ‘내가 … 열겠습니다’로 옮겨, 선언적 미래와 현재적 임박성을 함께 살렸습니다.
  alternative_readings:
  - ‘내가 … 엽니다’
  - ‘내가 … 열어 놓습니다’
  rationale: 예언 화법에서는 단순한 사실 진술보다 하나님의 확정적 선언이 중요하므로, 한국어에서도 단정적 미래로 표현하는 편이 본문의 힘을 보존합니다.
  doctrine_reference: 예언 장르와 신적 선언의 확실성
- issue: 지명 열거 앞의 ‘이 땅의 영광’ 처리
  chosen_reading: 지명들을 그 나라의 ‘영광’으로 제시해, 도시 목록이 단순 정보가 아니라 모압의 핵심과 자랑이 무너지는 선언임을 드러냈습니다.
  alternative_readings:
  - ‘이 땅의 아름다움’
  - ‘이 땅의 빼어난 곳’
  rationale: 본문의 수사는 단순한 지리 열거가 아니라 심판 대상의 상징적 중심을 짚는 방식이므로, 도덕적 완곡화 없이 원문의 강조를 유지했습니다.
  doctrine_reference: 예언 심판의 수사적 과장
