base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/009.yaml
  text: 'Therefore behold[a], I am opening the flank of Moab from its cities, from its frontier cities, the glory of the land: Beth-jeshimoth, Baal-meon[c][b], and Kiriathaim.'
  footnotes:
  - marker: a
    text: Or 'the side of Moab' or more literally 'the shoulder of Moab.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the beauty of the land.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew text has a spelling form for the final place name corresponding to Kiriathaim, a known Moabite city.
    reason: textual_variant
translation:
  language: ko
  text: 그러므로 보십시오. 내가 모압의 측면을 그 성읍들부터, 곧 그 끝에 있는 성읍들부터 열어 젖히겠습니다. 그 땅의 영광인 벳여시못, 바알므온, 기랴다임까지입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כֶּתֶף는 문자적으로 ‘어깨’이지만, 여기서는 지리적·군사적 비유로 ‘측면’ 또는 ‘옆면’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 צְבִי는 ‘아름다움’, ‘빼어남’, 또는 ‘영광’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 자음 본문은 마지막 지명을 통상 기랴다임으로 읽히는 철자 형태로 적고 있습니다. 기랴다임은 알려진 모압의 성읍입니다.
    reason: textual_variant
