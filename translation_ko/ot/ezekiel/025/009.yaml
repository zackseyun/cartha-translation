  terminology: ‘측면’은 כֶּתֶף의 지리·군사적 비유를 적절히 보존합니다. 지명 음역인 ‘벳여시못, 바알므온, 기랴다임’도 무난합니다. 다만 צְבִי אֶרֶץ는 모압을 가리키므로 ‘이 땅’보다 ‘그 땅’이 문맥상 더 정확합니다. 마지막 지명에 관한 각주는 단순 ‘철자 변이’라고 하기보다 본문 철자와 통상적 지명 독법의 관계를 정확히 밝혀야 합니다.
