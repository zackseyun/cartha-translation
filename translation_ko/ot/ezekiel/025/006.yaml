translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. 네가 손뼉을 치고 발을 구르며, 이스라엘 땅을 향하여 네 마음에 온갖 멸시를[a] 품고 기뻐하였기 때문이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온갖 악의’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 하나님
  lexicon: WLC
  rationale: 아도나이+YHWH의 결합된 호칭은 한국어에서 '주 하나님'이 가장 자연스럽고, '주 주님' 같은 중복을 피하면서도 신적 칭호를 유지합니다.
- source_word: מַחְאֲךָ יָד
  english_pob_choice: you clapped your hands
  chosen_korean: 네가 손뼉을 치고
  alternatives_korean:
  - 네가 손을 쳤고
  - 네가 손뼉을 쳤고
  lexicon: HALOT
  rationale: 손뼉을 치는 몸짓을 자연스럽게 옮겨, 단순한 동작이 아니라 조롱 섞인 환호라는 문맥상의 힘을 살렸습니다.
- source_word: וְרַקְעֲךָ בְּרָגֶל
  english_pob_choice: and stamped your feet
  chosen_korean: 발을 구르며
  alternatives_korean:
  - 발로 구르며
  - 발을 굴러
  lexicon: HALOT
  rationale: 발로 땅을 치는 분노·조롱의 동작을 한국어 관용에 맞게 압축해 표현했습니다.
- source_word: בְּכָל שָׁאטְךָ בְּנֶפֶשׁ
  english_pob_choice: with all the contempt in your soul
  chosen_korean: 네 마음속의 모든 경멸로
  alternatives_korean:
  - 네 영혼의 모든 경멸로
  - 네 속의 모든 멸시로
  lexicon: HALOT
  rationale: שָׁאט의 핵심 의미인 '경멸/멸시'를 살리고, בְּנֶפֶשׁ는 인격의 깊이를 가리키는 표현으로서 '마음속'으로 옮겼습니다.
- source_word: אֶל אַדְמַת יִשְׂרָאֵל
  english_pob_choice: against the land of Israel
  chosen_korean: 이스라엘 땅을 향해
  alternatives_korean:
  - 이스라엘 땅을 대하여
  - 이스라엘 땅에 맞서
  lexicon: HALOT
  rationale: אֶל의 기본 방향성을 살리되, 문맥상 적대의 뉘앙스는 바로 앞뒤의 조롱·경멸 표현이 드러내므로 한국어에서는 지나친 해석을 피했습니다.
theological_decisions:
- issue: אֲדֹנָי יְהוִה의 한국어 신적 호칭 처리
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 본문의 결합 호칭을 한국어에서 자연스럽고 예배적 문맥에 맞게 재현하되, 전통적 '여호와'나 학술적 '야훼'로 인한 어색함을 피했습니다.
  doctrine_reference: POB naming policy for divine titles in Korean
- issue: אֶל אַדְמַת יִשְׂרָאֵל의 방향/대적성
  chosen_reading: 이스라엘 땅을 향해
  alternative_readings:
  - 이스라엘 땅을 대하여
  - 이스라엘 땅에 맞서
  rationale: 히브리어 전치사 אֶל은 기본적으로 'toward/to'이므로, 적대성은 문맥에서 충분히 드러나는 것으로 두고 한국어는 과도한 해석을 절제했습니다.
  doctrine_reference: Source-text primacy and minimal-expansion principle
