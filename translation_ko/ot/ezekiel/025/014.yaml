source:
  edition: WLC
  text: וְ/נָתַתִּ֨י אֶת נִקְמָתִ֜/י בֶּ/אֱד֗וֹם בְּ/יַד֙ עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/עָשׂ֣וּ בֶ/אֱד֔וֹם כְּ/אַפִּ֖/י וְ/כַ/חֲמָתִ֑/י וְ/יָֽדְעוּ֙ אֶת נִקְמָתִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/014.yaml
  text: And I will set my vengeance on Edom by the hand of my people Israel[a], and they will deal with Edom according to my anger and according to my wrath; and they will know my vengeance[c][b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'against Edom' for 'on Edom.' The Hebrew preposition can be rendered either way in a hostile context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'by the hand of my people Israel,' an idiom meaning 'through my people Israel.'
    reason: lexical_alternative
  - marker: c
    text: 'Or ''they will act against Edom.'' The Hebrew verb is broad: ''do, make, act.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 백성 이스라엘을 통하여 에돔에 내 보복을 내리겠습니다.[a][b] 그들이 내 분노와 내 진노대로 에돔을 상대로 행할 것이며,[c] 그들은 내 보복을 알게 될 것입니다. 주 야훼께서 선언하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사는 적대적 문맥에서 ‘에돔에’ 또는 ‘에돔을 향해/에돔에 대하여’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘내 백성 이스라엘의 손으로’로, 관용적으로는 ‘내 백성 이스라엘을 통하여’라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사는 ‘하다, 행하다, 조처하다’처럼 넓은 의미를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת נִקְמָתִי
  english_pob_choice: I will set my vengeance
  chosen_korean: 내가 내 보복을 두고
  alternatives_korean:
  - 내가 내 복수심을 두고
  - 내가 내 원수를 갚음을 두고
  lexicon: HALOT
  rationale: נָתַן은 여기서 ‘두다/정하다’의 의미로 쓰였고, נִקְמָה는 징벌적 ‘보복’이 가장 직접적입니다. ‘두다’는 POB의 ‘set’처럼 심판을 지정해 놓는 뉘앙스를 살립니다.
- source_word: בְּיַד עַמִּי יִשְׂרָאֵל
  english_pob_choice: by the hand of my people Israel
  chosen_korean: 내 백성 이스라엘의 손으로
  alternatives_korean:
  - 내 백성 이스라엘을 통해
  - 내 백성 이스라엘을 매개로
  lexicon: HALOT
  rationale: יד의 도구적 관용구를 살려 ‘손으로’라고 옮겨, 하나님이 이스라엘을 심판의 도구로 삼으신다는 이미지를 보존했습니다.
- source_word: וְעָשׂוּ בֶאֱדוֹם
  english_pob_choice: they will deal with Edom
  chosen_korean: 에돔에 행할 것이며
  alternatives_korean:
  - 에돔을 상대할 것이며
  - 에돔에 대해 행할 것이며
  lexicon: HALOT
  rationale: עשה는 넓은 ‘하다/행하다’의 의미라서, POB가 과도하게 구체화하지 않은 점을 따라 ‘행하다’로 두어 심판 행위를 열어 두었습니다.
- source_word: כְּאַפִּי וְכַחֲמָתִי
  english_pob_choice: according to my anger and according to my wrath
  chosen_korean: 내 분노와 내 진노대로
  alternatives_korean:
  - 내 노와 내 격노대로
  - 내 분노와 내 격노에 따라
  lexicon: HALOT
  rationale: אַף와 חֵמָה의 병렬은 단순 중복이 아니라 강도의 상승이므로, ‘분노/진노’로 구분해 한국어에서도 긴장을 유지했습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님이 선언하십니다
  alternatives_korean:
  - 주 하나님께서 말씀하십니다
  - 주 하나님이 이르십니다
  lexicon: HALOT
  rationale: נְאֻם은 예언자적 공시 공식이므로 ‘선언하십니다’가 가장 직접적입니다. אֲדֹנָי יְהוִה는 합쇼체에서 ‘주 하나님’으로 옮겨 위엄을 유지했습니다.
theological_decisions:
- issue: 하나님의 보복과 인간 도구성의 동시 표현
  chosen_reading: 하나님이 자신의 보복을 두시고 이스라엘의 손으로 에돔에 행하게 하십니다.
  alternative_readings:
  - 이스라엘이 독자적으로 에돔을 치는 것으로 읽을 수 있습니다.
  - 하나님이 직접만 행하시고 이스라엘은 배경에 불과합니다.
  rationale: 본문은 ‘내가 내 보복을…’과 ‘내 백성 이스라엘의 손으로’가 함께 있어, 신적 주도권과 인간 도구성을 모두 유지해야 합니다.
  doctrine_reference: 하나님의 섭리와 대리 행위에 대한 본문 수준의 표현
