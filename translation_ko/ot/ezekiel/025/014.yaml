revisions:
- from: 내가 내 보복을 에돔에 두고, 내 백성 이스라엘의 손으로 에돔에 행하게 할 것이며, 그들이 내 분노와 내 진노대로 에돔에 행할 것입니다. 그때 그들은 내 보복을 알게 될 것이라고 주 하나님이 선언하십니다.[a][b][c]
  to: 내가 내 백성 이스라엘을 통하여 에돔에 내 보복을 내리겠습니다.[a][b] 그들이 내 분노와 내 진노대로 에돔을 상대로 행할 것이며,[c] 그들은 내 보복을 알게 될 것입니다. 주 야훼께서 선언하십니다.
  rationale: 히브리어의 두 연속 절을 분리하여 하나님이 이스라엘을 수단으로 보복을 내리신다는 진술과, 이스라엘이 하나님의 분노와 진노에 따라 에돔을 상대로 행한다는 진술을 모두 보존했습니다. ‘내리겠습니다’는 ‘보복을 에돔에 두다’라는 히브리어 표현을 자연스러운 한국어 심판 표현으로 옮긴 것입니다. 원문의 עשה가 구체적 행위를 명시하지 않으므로 ‘심판을 집행할’ 등으로 한정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
