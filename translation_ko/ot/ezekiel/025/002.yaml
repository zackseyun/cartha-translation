  yaml_path: translation/ot/ezekiel/025/002.yaml
  text: Son of man[a], set your face toward the sons of Ammon, and prophesy against them.
  footnotes:
  - marker: a
    text: 'Or ''the Ammonites.'' Hebrew: ''the sons of Ammon.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 네 얼굴을 암몬 자손을 향하여 두고 그들에게 예언하라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘암몬의 자손들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서에서 반복되는 신적 호칭을 한국어 성경 관용과 본문의 호소력을 살려 ‘인자야’로 옮겼습니다. ‘사람의 아들’은 직역성이 높지만 한국어에서는 어색하고, ‘인간’은 호칭감이 약합니다.
- source_word: שִׂים פָּנֶי/ךָ אֶל
  english_pob_choice: set your face toward
  chosen_korean: 네 얼굴을 … 향하여 두고
  alternatives_korean:
  - 네 얼굴을 … 향하게 하고
  - 네 얼굴을 … 쪽으로 돌리고
  lexicon: HALOT
  rationale: ‘얼굴을 두다’는 히브리어 관용구의 방향성·결단성을 비교적 자연스럽게 살리면서도, 원문의 ‘set your face’ 이미지를 유지합니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the sons of Ammon
  chosen_korean: 암몬 자손을
  alternatives_korean:
  - 암몬 사람들을
  - 암몬 족속을
  lexicon: HALOT
  rationale: 영어 POB의 ‘sons of Ammon’에 맞춰 혈연적 표현을 유지하되, 한국어에서는 자연스러운 성경 표현인 ‘자손’을 사용해 원문의 어법을 드러냈습니다.
- source_word: וְהִנָּבֵא עֲלֵיהֶם
  english_pob_choice: and prophesy against them
  chosen_korean: 그들에게 예언하라
  alternatives_korean:
  - 그들에 대하여 예언하라
  - 그들을 향해 예언하라
  lexicon: HALOT
  rationale: ‘예언하다’는 נבא의 표준 대응이며, 문맥상 적대적 선언이지만 한국어에서는 본문 흐름상 부사의 도움 없이도 대상이 자연히 드러납니다. ‘against’를 과도하게 노출하면 반복감이 커져 간결하게 처리했습니다.
theological_decisions:
- issue: 예언 명령의 대상 표지에 대한 처리
  chosen_reading: ‘그들에게 예언하라’로 옮겨, 문맥상 심판 선언임을 유지하되 불필요하게 공격적 어조를 덧씌우지 않았습니다.
  alternative_readings:
  - 그들에 대하여 예언하라
  - 그들을 향하여 예언하라
  rationale: 히브리어 עֲלֵיהֶם은 문맥상 대적/불리함을 포함할 수 있으나, 한국어 본문에서는 뒤의 선포 내용이 그 성격을 충분히 드러냅니다. 따라서 문맥의 긴장은 유지하면서도 읽기 흐름을 해치지 않는 쪽을 택했습니다.
  doctrine_reference: 'POB translation principle: source-close rendering with context-sensitive clarity.'
