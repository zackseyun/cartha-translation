  text: Therefore, look, I am giving you to the sons of the east as a possession, and they will set their encampments in you and place their dwellings in you. They will eat your fruit, and they will drink your milk.
translation:
  language: ko
  text: 그러므로 보십시오, 내가 너를 동방의 아들들에게 유산으로 넘겨주겠습니다. 그들이 너 한가운데에 자기 진영을 치고 너 한가운데에 자기 거처를 둘 것입니다. 그들은 네 열매를 먹고 네 젖을 마실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보십시오’는 예언적 화법의 히브리어 הִנְנִי를 현대 한국어 합쇼체로 옮긴 것입니다.
    reason: korean_style_note
