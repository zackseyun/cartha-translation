- from: 그러므로 보십시오, 내가 너를 동방의 아들들에게 유산으로 넘겨주겠습니다. 그들이 너 한가운데에 자기 진영을 치고 너 한가운데에 자기 거처를 둘 것입니다. 그들은 네 열매를 먹고 네 젖을 마실 것입니다.[a]
  to: 그러므로 보십시오, 내가 너를 동방 사람들에게 소유로 넘겨주겠습니다. 그들이 네 안에 자기들의 진을 치고 자기들의 거처를 마련할 것입니다. 그들은 네 열매를 먹고 네 젖을 마실 것입니다.
