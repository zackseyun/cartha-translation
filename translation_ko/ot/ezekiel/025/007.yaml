theological_decisions:
- issue: 심판 선언의 종결 공식 'you will know that I am Yahweh'
  chosen_reading: '''그러면 네가 내가 야훼인 줄 알게 될 것입니다''로, 심판을 통해 여호와의 주권과 정체가 드러난다는 에스겔의 인지 공식을 유지했습니다.'
  alternative_readings:
  - '''그리고 네가 내가 주인 줄 알게 될 것입니다'''
  - '''그때 네가 내가 야훼임을 알게 될 것입니다'''
  rationale: 에스겔의 반복되는 인지 공식은 단순 정보 전달이 아니라 심판을 통한 야훼의 자기계시를 뜻하므로, 종결 효과를 살려 번역했습니다.
  doctrine_reference: Ezekiel recognition formula; divine-name policy
- issue: '''땅들'' 복수형의 처리'
  chosen_reading: 문자적으로 '땅들'을 유지해 여러 지역/영토에 걸친 추방·소멸의 범위를 드러냈습니다.
  alternative_readings:
  - '''나라들'''
  - '''영토들'''
  rationale: 히브리어 복수형 אֲרָצוֹת의 공간적 분산감을 보존하는 편이 본문의 심판 범위를 더 정확히 드러냅니다.
  doctrine_reference: Lexical plurality in prophetic judgment
