base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/007.yaml
  text: Therefore[a], behold, I have stretched out my hand against you, and I will give you as plunder to the nations. I will cut you off from the peoples and destroy you from the lands; I will annihilate you, and you will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'for spoil' or 'as booty to the nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 보십시오, 내가 너를 치려고 내 손을 펴서 너를 이방 민족들에게 노략물로 넘겨주겠습니다. 내가 너를 백성들 가운데에서 끊어 버리고, 땅들에서 멸망시키며, 너를 전멸시키겠습니다. 그러면 네가 내가 야훼인 줄 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 노략물로 넘겨주겠습니다는 본문의 '전리품/약탈물' 의미를 살린 번역입니다.
    reason: lexical_alternative
