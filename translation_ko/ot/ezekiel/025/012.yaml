  text: 'Thus says the Lord GOD: Because Edom acted in vengeance against the house of Judah[a], and became very guilty, and took vengeance on them[b],'
  footnotes:
  - marker: a
    text: Hebrew literally, 'in avenging vengeance,' an emphatic expression for acting vengefully or taking full vengeance.
    reason: lexical_alternative
  - marker: b
    text: Or 'incurred guilt greatly' / 'were found very guilty.' The Hebrew uses an emphatic guilt expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. 에돔이 유다 집에 보복을 하고[a], 큰 죄를 범하며[b], 그들에게 보복하였으므로,
  philosophy: optimal-equivalence
  footnotes:
