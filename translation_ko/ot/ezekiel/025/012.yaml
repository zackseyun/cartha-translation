    text: 히브리어는 문자적으로 ‘보복으로 보복함’이며, 보복 행위의 강도를 강조하는 표현입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘크게 죄책을 짊어지고’ 또는 ‘큰 죄를 범하여’. 히브리어는 죄책을 나타내는 동사와 동족어를 함께 써서 강조합니다.
    reason: alternative_reading
