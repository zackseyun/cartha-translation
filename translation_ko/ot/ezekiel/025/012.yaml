    text: 히브리어는 문자적으로 '보복을 행하며 보복을 행함'으로, 보복을 행하거나 완전한 보복을 취하는 것을 강조하는 표현입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '심히 죄를 지었음' / '매우 죄인이 되었음'. 히브리어는 죄를 강조하는 표현을 사용합니다.
