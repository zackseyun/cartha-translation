  text: 주 하나님께서 이같이 말씀하시되, 에돔이 유다 족속을 대적하여 보복을 행하고, 심히 죄를 짓고 그들을 보복하였음이라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
