  - severity: medium
    issue: ‘영혼 안에서 멸하려고 영원한 원한으로’의 수식 관계가 불명확합니다.
    rationale: 히브리어의 연속된 전치사구와 목적 표현을 한국어에서 명료하게 재구성할 필요가 있습니다.
  - severity: low
