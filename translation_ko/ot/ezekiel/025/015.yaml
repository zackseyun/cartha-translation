id: EZK.25.15
reference: Ezekiel 25:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֛עַן עֲשׂ֥וֹת פְּלִשְׁתִּ֖ים בִּ/נְקָמָ֑ה וַ/יִּנָּקְמ֤וּ נָקָם֙ בִּ/שְׁאָ֣ט בְּ/נֶ֔פֶשׁ לְ/מַשְׁחִ֖ית אֵיבַ֥ת עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/015.yaml
  text: 'Thus says the Lord GOD: Because the Philistines acted in vengeance and took revenge with contempt in the soul[a], to destroy with everlasting enmity[b],'
  footnotes:
  - marker: a
    text: Or 'with scorn in the soul,' 'with contempt from the heart.' The Hebrew expression combines contempt with an inner, whole-person disposition.
    reason: lexical_alternative
  - marker: b
    text: Or 'with ancient enmity' or 'with perpetual hostility.' The Hebrew עוֹלָם can denote long-standing antiquity or enduring perpetuity depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 하나님이 이렇게 말씀하십니다. “블레셋 사람들이 복수로 행하고, 영혼 안에서[a] 멸하려고 영원한 원한[b]으로 보복하였기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멸시와 함께’, ‘마음속의 경멸로’로도 옮길 수 있습니다. 히브리어 표현은 내면의 전인적 태도와 결부된 경멸을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘오래된 원한’, ‘영구한 적대감’으로도 옮길 수 있습니다. 히브리어 עוֹלָם은 문맥에 따라 오래 지속된 상태나 영속성을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  lexicon: WLC/HALOT
  rationale: 아도나이와 YHWH가 결합된 고유한 신적 호칭이므로, 한국어에서는 관용적으로도 자연스럽고 합쇼체 서술에 맞는 ‘주 하나님’으로 옮겨 중복감을 피했습니다.
- source_word: בִּ/נְקָמָה / וַ/יִּנָּקְמוּ נָקָם
  english_pob_choice: acted in vengeance / took revenge
  chosen_korean: 복수로 행하고, ... 보복하였기
  alternatives_korean:
  - 원한으로 행하고, ... 갚았기
  - 원수를 갚고
  lexicon: HALOT
  rationale: 동사-명사 결합이 보복 행위의 강도를 높이므로, ‘복수’와 ‘보복하다’를 함께 써서 반복된 보복성을 드러냈습니다.
- source_word: בִּ/שְׁאָ֣ט בְּ/נֶ֔פֶשׁ
  english_pob_choice: with contempt in the soul
  chosen_korean: 영혼 안에서[a]
  alternatives_korean:
  - 마음속의 멸시로
  - 속으로의 경멸로
  lexicon: HALOT
  rationale: 문자적으로는 ‘영혼/생명 안에서’의 내면적 태도를 가리키므로, 내부 성향을 짧게 살리기 위해 본문에는 ‘영혼 안에서’로 두고 각주로 경멸·멸시의 뉘앙스를 보완했습니다.
- source_word: לְ/מַשְׁחִ֖ית
  english_pob_choice: to destroy
  chosen_korean: 멸하려고
  alternatives_korean:
  - 파멸시키려고
  - 무너뜨리려고
  lexicon: HALOT
  rationale: 목적 용법을 자연스럽게 살려 ‘멸하려고’로 옮겼습니다.
- source_word: אֵיבַ֥ת עוֹלָֽם
  english_pob_choice: with everlasting enmity
  chosen_korean: 영원한 원한[b]
  alternatives_korean:
  - 영구한 적대감
  - 오래된 적의
  lexicon: HALOT
  rationale: אֵיבָה는 적대/원한의 뜻이고 עוֹלָם은 지속성 또는 오래됨을 뜻할 수 있어, 본문에서는 강한 지속성을 살린 ‘영원한 원한’으로 옮기고 각주로 ‘오래된’ 가능성도 열어 두었습니다.
theological_decisions:
- issue: 하나님 호칭인 אֲדֹנָי יְהוִה의 한국어 처리
  chosen_reading: ‘주 하나님’으로 번역해 신적 위엄을 유지하되, 현대 한국어에서 어색한 ‘주 LORD’식 중복을 피했습니다.
  alternative_readings:
  - 주 여호와
  - 주 야훼
  rationale: 본문은 심판 선언 서두의 공식적 신탁 문구이므로, 예언서의 엄중한 어조를 유지하는 것이 중요합니다. ‘주 하나님’이 가장 간결하게 그 위엄을 전달합니다.
  doctrine_reference: POB Korean divine-name convention
