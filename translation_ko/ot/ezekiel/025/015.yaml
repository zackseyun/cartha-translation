  source_fidelity: 현 본문은 בִּשְׁאָט(멸시/경멸)를 누락하고 בְּנֶפֶשׁ만 ‘영혼 안에서’로 옮겨, 핵심적인 내면의 경멸이라는 뜻을 전달하지 못합니다. 또한 אֵיבַת עוֹלָם은 문맥상 오래 지속된/영속적인 적의를 가리키며, 목적어가 히브리어에서 명시되지 않은 채 לְמַשְׁחִית와 연결된 점을 한국어에서도 과도하게 보충하지 않는 것이 좋습니다.
  naturalness: ‘영혼 안에서 멸하려고 영원한 원한으로’는 수식 관계가 불분명하고 현대 표준 한국어로 부자연스럽습니다. ‘마음 깊은 곳의 멸시로 … 적의를 품고 멸하려고’는 원문의 반복적 보복 표현과 엄중한 신탁 문체를 자연스럽게 드러냅니다.
  terminology: אֲדֹנָי יְהוָה의 두 요소를 반영하여 ‘주 야훼’로 옮겼습니다. נֶפֶשׁ은 여기서 비물질적 ‘영혼’이라기보다 전인적 내면의 태도를 나타내므로 ‘마음 깊은 곳’으로 처리했습니다. עוֹלָם의 ‘오랜’과 ‘영속적’ 양 가능성은 각주에 보존했습니다.
  issues:
