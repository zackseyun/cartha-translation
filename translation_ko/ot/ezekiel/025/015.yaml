    rationale: 아도나이와 YHWH의 결합을 ‘주 야훼’로 나타내면 두 구성 요소를 보존하면서 중복도 피할 수 있습니다.
  revised_text: 주 야훼께서 이렇게 말씀하십니다. “블레셋 사람들이 복수심을 품고 행동하며, 마음 깊은 곳의 멸시로 보복하고, 오래 지속된 적의를 품고 멸하려 하였기 때문입니다.”
