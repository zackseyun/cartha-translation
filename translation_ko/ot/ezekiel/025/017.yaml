theological_decisions:
- issue: 야훼 인식 공식의 보존
  chosen_reading: '"그들은 내가 야훼임을 알게 될 것입니다"라는 에스겔의 전형적 인식 공식으로 유지했습니다.'
  alternative_readings:
  - '"그들은 내가 주임을 알게 될 것입니다"'
  - '"그들은 내가 여호와임을 알게 될 것입니다"'
  rationale: 본문의 반복되는 인식 공식은 심판 행위를 통해 하나님의 이름이 드러난다는 점을 강조하므로, 고유명사 '야훼'를 유지해 그 신학적 초점을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
