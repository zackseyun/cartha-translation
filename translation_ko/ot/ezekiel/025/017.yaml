translation:
  language: ko
  text: 내가 그들에게 진노의 책망으로 큰 보복을 행할 것이며, 내가 그들에게 내 보복을 내릴 때에 그들은 내가 야훼임을 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “분노의 책망으로” 또는 “진노의 징계로”. 히브리어 표현은 ‘책망/교훈’과 ‘분노/진노’를 함께 담고 있어, 말로 꾸짖는 의미와 징벌적 교정의 의미를 모두 포함할 수 있습니다.
    reason: lexical_alternative
