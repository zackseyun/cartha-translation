translation:
  language: ko
  text: 내가 그들에게 큰 보복을 행하고, 분노의 책망으로 그들을 벌할 것이며, 그들은 내가 야훼임을 알게 될 것입니다. 내가 그들 가운데 내 보복을 행할 때에 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "진노의 책망으로"; 히브리어 표현은 '책망/교훈'과 '분노/진노'를 함께 담아, 말로 꾸짖는 의미와 징벌적 교정의 의미를 모두 포함할 수 있습니다.
    reason: lexical_alternative
