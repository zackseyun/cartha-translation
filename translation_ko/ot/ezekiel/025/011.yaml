  text: וּ/בְ/מוֹאָ֖ב אֶעֱשֶׂ֣ה שְׁפָטִ֑ים וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/011.yaml
  text: And in Moab I will execute judgments[a], and they will know that I am Yahweh.
  footnotes:
  - marker: a
    text: 'Or "Yahweh" for "the LORD" (Hebrew: YHWH).'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 모압에 내가 심판을 집행하겠습니다[a]. 그러면 그들이 내가 야훼임을 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 “야훼”; 히브리어: YHWH.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְ/מוֹאָב
  english_pob_choice: And in Moab
  chosen_korean: 그리고 모압에
  alternatives_korean:
  - 그리고 모압 안에서
  - 그리고 모압을 향하여
  lexicon: HALOT
  rationale: 전치사 ב의 기본 의미를 살려 ‘모압에’로 옮기면, 심판 행위가 모압을 범위로 삼아 일어남을 자연스럽게 드러냅니다.
- source_word: אֶעֱשֶׂה שְׁפָטִים
  english_pob_choice: I will execute judgments
  chosen_korean: 내가 심판을 집행하겠습니다
  alternatives_korean:
  - 내가 심판들을 행하겠습니다
  - 내가 재판들을 집행하겠습니다
  lexicon: HALOT
  rationale: עשה with שפטים의 관용적 법정 의미를 따라 ‘집행하다’로 옮겨, 단순한 ‘하다’보다 사법적 실행의 힘을 살렸습니다.
- source_word: וְ/יָדְעוּ כִּי
  english_pob_choice: and they will know that
  chosen_korean: 그러면 그들이 … 알게 될 것입니다
  alternatives_korean:
  - 그리고 그들이 … 알게 될 것입니다
  - 그리하여 그들이 … 알게 될 것입니다
  lexicon: HALOT
  rationale: 결과적 뉘앙스를 한국어에서 자연스럽게 드러내기 위해 ‘그러면’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 여호와 대신 학술적 음역 ‘야훼’를 유지해 문헌적 투명성을 살렸습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: ‘야훼’로 음역하여 신명 자체를 드러냅니다.
  alternative_readings:
  - ‘주님’으로 번역
  - ‘여호와’로 번역
  rationale: 본문이 언약적 신명 YHWH를 직접 사용하므로, 전통적 우회어보다 원문 식별성을 우선했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
