base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/016.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am stretching out my hand against the Philistines, and I will cut off the Cherethites, and I will destroy the remnant of the seacoast.'
  footnotes:
  - marker: a
    text: Or possibly 'the Cretans' for 'the Cherethites'; the Hebrew term may refer to a people associated with Crete, but the main text preserves the ethnonym by transliteration.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. 보십시오, 내가 블레셋 사람들을 향해 내 손을 뻗겠습니다. 또 그렛 사람들[a]을 끊어 버리고 해안 지방의 남은 자들을 멸망시키겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그렛 사람들’은 히브리어 민족명입니다. 이 말은 크레타와 관련된 집단을 가리켜 ‘크레타 사람들’로 이해될 수도 있으나, 본문에서는 민족명을 음역으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: אֲדֹנָי와 יהוה의 결합을 한국어에서 중복 없이 살리기 위해 ‘주’와 고유신명 ‘야훼’를 함께 두었습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보시오
  lexicon: HALOT
  rationale: 예언문에서 주의를 환기하는 감탄형으로, 현대 합쇼체의 엄숙함을 유지하면서도 자연스럽게 들리도록 했습니다.
- source_word: כְּרֵתִים
  english_pob_choice: the Cherethites
  chosen_korean: 그렛 사람들
  alternatives_korean:
  - 그렛인들
  - 크레타 사람들
  lexicon: HALOT
  rationale: 영문 본문이 음역을 유지한 것을 따라 고유 집단명으로 처리하되, 한국어에서는 통용되는 음역형 ‘그렛’을 사용했습니다.
- source_word: שְׁאֵרִית חוֹף הַיָּם
  english_pob_choice: the remnant of the seacoast
  chosen_korean: 바닷가에 남아 있는 자들
  alternatives_korean:
  - 바닷가의 남은 자들
  - 바다의 해안에 남아 있는 남은 자들
  lexicon: HALOT
  rationale: ‘남은 자/남아 있는 자들’로 שְׁאֵרִית의 잔존 의미를 살리되, 문맥상 사람을 가리키는 것으로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 여호와
  - 주 하나님
  rationale: 이 번역은 본문의 신명 יהוה를 ‘야훼’로 옮기는 프로젝트 기본 원칙을 따르며, אֲדֹנָי와의 결합은 ‘주’로 보완했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
