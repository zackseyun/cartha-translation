lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 임하여
  alternatives_korean:
  - 와서
  - 이르러
  lexicon: HALOT
  rationale: 예언 서두의 진행 표지를 자연스러운 한국어로 살리되, ‘말씀이 ... 오다’는 관용을 통해 사건의 도래성을 보존했습니다.
- source_word: דְבַר
  english_pob_choice: the word of
  chosen_korean: 말씀
  alternatives_korean:
  - 메시지
  - 언질
  lexicon: HALOT
  rationale: 예언 공식에서 하나님의 דָּבָר는 단순한 정보가 아니라 선포된 권위 있는 말씀을 가리키므로 ‘말씀’이 가장 सीधे입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
