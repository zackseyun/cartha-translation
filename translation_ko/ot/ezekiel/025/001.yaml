lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 임하여
  alternatives_korean:
  - 와서
  - 이르러
  lexicon: HALOT
  rationale: 예언 서두의 진행 표지를 자연스러운 한국어로 살리되, ‘말씀이 ... 오다’는 관용을 통해 사건의 도래성을 보존했습니다.
- source_word: דְבַר
  english_pob_choice: the word of
  chosen_korean: 말씀
  alternatives_korean:
  - 메시지
  - 언질
  lexicon: HALOT
  rationale: 예언 공식에서 하나님의 דָּבָר는 단순한 정보가 아니라 선포된 권위 있는 말씀을 가리키므로 ‘말씀’이 가장 सीधे입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 영어 POB의 도식과 동일하게 여호와 대체어가 아니라 고유명사로서 하나님의 이름을 옮겼습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 저에게
  lexicon: HALOT
  rationale: 1인칭 단수 수신자를 자연스럽게 나타내는 현대 표준어로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르셨습니다
  - 말하여
  lexicon: HALOT
  rationale: 히브리어 직설 인용 도입어는 한국어에서 종종 생략 가능하지만, 여기서는 바로 뒤의 직접 인용을 예고하는 예언 공식의 리듬을 살려 완결된 문장으로 처리했습니다.
theological_decisions:
- issue: 예언 공식에서 주어와 발화 동사의 중복 처리
  chosen_reading: ‘야훼의 말씀이 내게 임하여 말씀하셨습니다’로 옮겨, ‘말씀’이 도달하고 동시에 발화하는 예언적 공식성을 보존했습니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 임했습니다’
  - ‘야훼의 말씀이 내게 이르셨습니다’
  rationale: 원문은 ‘말씀’의 도래와 이어지는 발화를 함께 묶는 전형적 예언 서두이므로, 한국어에서도 그 구조를 드러내는 편이 문학적·신학적으로 더 정확합니다.
  doctrine_reference: Ezekiel prophetic formula; source-level discourse structure
