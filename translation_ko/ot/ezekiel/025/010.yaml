source:
  edition: WLC
  text: לִ/בְנֵי קֶ֨דֶם֙ עַל בְּנֵ֣י עַמּ֔וֹן וּ/נְתַתִּ֖י/הָ לְ/מֽוֹרָשָׁ֑ה לְמַ֛עַן לֹֽא תִזָּכֵ֥ר בְּנֵֽי עַמּ֖וֹן בַּ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/010.yaml
  text: to the people of the east[a], against the Ammonites; and I will give it as a possession[b], so that the Ammonites may no longer be remembered among the nations.
  footnotes:
  - marker: a
    text: Or 'to the sons of the east.' The Hebrew expression refers to eastern peoples or tribes.
    reason: lexical_alternative
  - marker: b
    text: Or 'as an inheritance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 동쪽 백성들에게, 곧 암몬 자손에게 넘겨 주겠습니다[a]. 그리고 그것을 그들의 소유로 주어[b] 암몬 자손이 다시는 민족들 가운데서 기억되지 않게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동방의 아들들에게’. 이 히브리어 표현은 동쪽의 민족들 또는 부족들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기업으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי קֶדֶם
  english_pob_choice: to the people of the east
  chosen_korean: 동쪽 백성들
  alternatives_korean:
  - 동쪽의 아들들
  - 동방의 사람들
  lexicon: HALOT
  rationale: בני קדם은 문자적 ‘동방의 아들들’보다 동쪽의 민족/집단을 가리키는 관용적 표현이므로, 자연스러운 한국어로 옮기되 지리적 집단성을 살렸습니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the Ammonites
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬 족속
  lexicon: HALOT
  rationale: 히브리어의 민족명 표현을 한국어 성경 관용에 맞게 ‘암몬 자손’으로 옮겨 집단 정체성을 유지했습니다.
- source_word: וּנְתַתִּיהָ לְמוֹרָשָׁה
  english_pob_choice: and I will give it as a possession
  chosen_korean: 그것을 그들의 소유로 주어
  alternatives_korean:
  - 그것을 그들의 기업으로 주어
  - 그것을 그들의 상속으로 주어
  lexicon: HALOT
  rationale: מורשה는 여기서 상속 개념보다 점유/소유의 결과를 강조하므로, 예언적 심판 맥락에 맞게 ‘소유’로 옮겼습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 민족들 가운데서
  alternatives_korean:
  - 열국 가운데서
  - 나라들 가운데서
  lexicon: HALOT
  rationale: גוֹיִם은 여기서 이방 민족들을 가리키므로, 신학적 특수 용법을 덧씌우지 않고 ‘민족들’로 옮겼습니다.
theological_decisions:
- issue: ‘기억되지 않게 하다’의 심판적 효과
  chosen_reading: 암몬 자손이 국제적 기억과 지위에서 사라지는 심판의 결과로 읽었습니다.
  alternative_readings:
  - 단순히 명성의 하락으로 읽기
  - 완전한 존재 소멸로 읽기
  rationale: 본문은 ‘민족들 가운데서 기억되지 않게’라고 말하므로, 과장도 축소도 하지 않고 심판의 사회-역사적 결과를 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
