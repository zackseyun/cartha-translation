review_pass:
  verdict: revise
  source_fidelity: ‘동쪽 백성들’과 ‘암몬 자손’은 서로 다른 집단인데, 초안의 ‘곧’은 이를 동격으로 처리하여 히브리어의 대적 관계(לִבְנֵי־קֶדֶם עַל־בְּנֵי עַמּוֹן)를 훼손합니다. 또한 첫 ‘그것’의 지시 대상도 불명확합니다. 동쪽 백성들에게 암몬을 넘겨주고 그 땅을 소유로 준다는 문맥상의 의미를 드러내야 합니다.
  naturalness: ‘넘겨 주고 … 소유로 주어’는 현대 한국어 합쇼체에서 자연스럽고, 반복되는 ‘그것’을 ‘그 땅’으로 풀어 문장이 명료해집니다.
  terminology: ‘암몬 자손’, ‘동쪽 백성들’, ‘민족들 가운데서’, ‘기억되지 않게 하겠습니다’는 민족명과 심판 표현을 적절히 보존합니다. ‘기업’은 מורשה의 가능한 대안으로 각주에 유지할 수 있습니다.
  issues:
  - severity: high
    issue: ‘곧 암몬 자손에게’가 동쪽 백성들과 암몬 자손을 동격으로 만듭니다.
    rationale: 원문은 동쪽 백성들이 암몬 자손을 대적하거나 그들에게서 영토를 넘겨받는 관계를 말합니다. 두 집단을 동일시하면 핵심 의미가 반전됩니다.
  - severity: medium
    issue: 첫 문장의 ‘그것’이 무엇을 가리키는지 불분명합니다.
    rationale: 직전 문맥의 암몬 땅을 가리키는 여성 단수 목적어이므로, 한국어에서는 ‘그 땅’으로 밝혀 주는 것이 안전하고 자연스럽습니다.
  revised_text: 동쪽 백성들에게 암몬 자손을 넘겨 주고, 그 땅을 그들의 소유로 주어[a] 암몬 자손이 다시는 민족들 가운데서 기억되지 않게 하겠습니다.
