revisions:
- from: 그것을 동쪽 백성들에게, 곧 암몬 자손에게 넘겨 주겠습니다[a]. 그리고 그것을 그들의 소유로 주어[b] 암몬 자손이 다시는 민족들 가운데서 기억되지 않게 하겠습니다.
  to: 동쪽 백성들에게 암몬 자손을 넘겨 주고, 그 땅을 그들의 소유로 주어[a] 암몬 자손이 다시는 민족들 가운데서 기억되지 않게 하겠습니다.
  rationale: 동쪽 백성들과 암몬 자손의 대적·양도 관계를 회복하기 위해 잘못된 동격 표현 ‘곧’을 삭제하고, 문맥상 여성 단수 목적어가 가리키는 암몬의 영토를 ‘그 땅’으로 명시했습니다. ‘소유’와 ‘기업’의 어휘적 선택지는 본문과 각주로 보존했습니다.
