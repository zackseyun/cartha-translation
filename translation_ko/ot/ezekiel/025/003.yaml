id: EZK.25.3
reference: Ezekiel 25:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ לִ/בְנֵ֣י עַמּ֔וֹן שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֡ה יַעַן֩ אָמְרֵ֨/ךְ הֶאָ֜ח אֶל מִקְדָּשִׁ֣/י כִֽי נִחָ֗ל וְ/אֶל אַדְמַ֤ת יִשְׂרָאֵל֙ כִּ֣י נָשַׁ֔מָּה וְ/אֶל בֵּ֣ית יְהוּדָ֔ה כִּ֥י הָלְכ֖וּ בַּ/גּוֹלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/003.yaml
  text: 'And say to the sons of Ammon[a], ‘Hear the word of the Lord GOD. Thus says the Lord GOD: Because you said, “Aha!” against my sanctuary when it was profaned, and against the land of Israel when it was made desolate[c][b], and against the house of Judah when they went into exile,’'
  footnotes:
  - marker: a
    text: 'Hebrew interjection of gloating or malicious triumph: ''Aha!''; alternatively, ''Ha!'' or ''Ah!'''
    reason: lexical_alternative
  - marker: b
    text: Or 'when it was defiled' / 'when it was desecrated.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they went into captivity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 암몬 족속에게 말하여라. “주 하나님의 말씀을 들으십시오. 주 하나님이 이렇게 말씀하십니다. 너희가 내 성소가 더럽혀졌을 때 ‘아하!’ 하고 말했고, 이스라엘의 땅이 황폐하게 되었을 때와 유다의 집이 포로로 끌려갔을 때에도 그렇게 말했기 때문입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 감탄사로, 조롱하거나 승리를 희롱하듯 기뻐하는 소리입니다. ‘아하!’, ‘하!’, ‘아!’ 정도로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘더럽혀졌을 때’, ‘모독되었을 때’, ‘성별이 훼손되었을 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘포로 상태로 들어갔을 때’, ‘사로잡혀 갔을 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי עַמּוֹן
  english_pob_choice: the sons of Ammon
  chosen_korean: 암몬 족속
  alternatives_korean:
  - 암몬의 아들들
  - 암몬 자손
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘암몬의 아들들’이지만, 한국어에서는 집단명으로서 ‘족속’이 가장 자연스럽고 본문의 민족 지칭을 분명히 드러냅니다.
- source_word: דְּבַר אֲדֹנָי יְהוִה
  english_pob_choice: the word of the Lord GOD
  chosen_korean: 주 하나님의 말씀
  alternatives_korean:
  - 주 여호와의 말씀
  - 주 야훼 하나님의 말씀
  lexicon: HALOT
  rationale: 합쇼체 예언문에서 ‘주 하나님’은 אֲדֹנָי יְהוִה의 이중 칭호를 자연스럽게 살리면서도, 영어 POB의 ‘Lord GOD’가 의도한 격식을 유지합니다.
- source_word: הֶאָח
  english_pob_choice: Aha!
  chosen_korean: ‘아하!’
  alternatives_korean:
  - ‘하!’
  - ‘아!’
  lexicon: HALOT
  rationale: 이 감탄사는 멸시와 조롱이 섞인 환호이므로, 한국어에서도 의미를 직접 드러내는 ‘아하!’가 가장 적절합니다.
- source_word: נִחָל / נָשַׁמָּה / הָלְכוּ בַּגּוֹלָה
  english_pob_choice: it was profaned / it was made desolate / they went into exile
  chosen_korean: 더럽혀졌을 때 / 황폐하게 되었을 때 / 포로로 끌려갔을 때
  alternatives_korean:
  - 모독되었을 때 / 황폐해졌을 때 / 포로 생활로 들어갔을 때
  - 더럽혀졌을 때 / 황무지가 되었을 때 / 유배로 갔을 때
  lexicon: HALOT
  rationale: 성소는 ‘더럽혀지다’, 땅은 ‘황폐하게 되다’, 유다는 ‘포로로 끌려가다’로 옮겨 원문의 심판·수치·강제이동의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 예언자적 선포문에서 하나님의 직설적 화법과 청자 호칭의 처리
  chosen_reading: ‘너희가 … 말했기 때문입니다’로 책임 귀속을 분명히 하고, ‘주 하나님이 이렇게 말씀하십니다’의 예언 공식은 그대로 살렸습니다.
  alternative_readings:
  - 보다 완곡하게 풀어 쓰는 방식
  - ‘야훼’로 직접 음역해 강하게 드러내는 방식
  rationale: 본문은 암몬의 조롱을 심판 이유로 제시하는 예언 선포이므로, 청자 책임과 신적 선포의 공적 성격을 약화시키지 않는 문체가 필요합니다.
  doctrine_reference: 예언서의 심판 선포와 언약 위반에 대한 책임 귀속
