revisions:
- from: 너는 암몬 족속에게 말하여라. “주 하나님의 말씀을 들으십시오. 주 하나님이 이렇게 말씀하십니다. 너희가 내 성소가 더럽혀졌을 때 ‘아하!’ 하고 말했고, 이스라엘의 땅이 황폐하게 되었을 때와 유다의 집이 포로로 끌려갔을 때에도 그렇게 말했기 때문입니다.”[a][b][c]
  to: 너는 암몬 자손에게 말하십시오. “주 야훼의 말씀을 들으십시오. 주 야훼께서 이렇게 말씀하십니다. 내 성소가 더럽혀졌을 때[b], 이스라엘 땅이 황폐해졌을 때, 유다 집이 포로로 끌려갔을 때[c], 너희가 그것들을 향하여 ‘아하!’[a]라고 말했기 때문에,”
  rationale: 신명 표기를 ‘주 야훼’로 바로잡고, 원문이 다음 절까지 이어지는 이유절임을 쉼표와 미종결 인용으로 보존했습니다. 청자 지시의 문체를 합쇼체로 통일했으며, ‘아하!’의 대상이 성소·이스라엘 땅·유다 집임을 한국어에서 자연스럽게 밝혔습니다. 각주는 해당 낱말 또는 구절에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:41:59Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 아도나이 야훼(אֲדֹנָי יְהוִה)는 ‘주 야훼’로 옮기는 것이 제시된 신명 방침에 부합합니다. 또한 이 절은 다음 절에 이어지는 심판 선포의 이유절이므로, 한국어 번역도 종결된 완전문으로 만들지 않고 이어짐을 보존해야 합니다. ‘아하!’는 세 대상 각각을 향한 암몬의 조롱을 가리키므로 ‘그것들을 향하여’로 명시했습니다.
  naturalness: 합쇼체를 일관되게 적용하여 하나님께서 에스겔에게 하시는 명령은 ‘말하십시오’, 암몬 사람들을 향한 명령은 ‘들으십시오’로 처리했습니다. ‘암몬 자손’은 집단 지칭으로 자연스럽고 원문의 구성 표현도 보존합니다.
  terminology: מִקְדָּשִׁי는 ‘내 성소’, נִחָל은 ‘더럽혀졌을 때’, נָשַׁמָּה는 ‘황폐해졌을 때’, בֵּית יְהוּדָה는 ‘유다 집’, הָלְכוּ בַּגּוֹלָה는 ‘포로로 끌려갔을 때’로 옮겼습니다. 각주 표지는 해당 어구 바로 뒤에 배치했습니다.
