  rationale: 히브리어 직역인 ‘sons of Ammon’을 살려 문맥의 민족적 표지를 유지했습니다.
- source_word: לְמִרְבַּץ צֹאן
  english_pob_choice: a resting place for flocks
  chosen_korean: 양 떼의 쉬는 곳
  alternatives_korean:
  - 양 떼의 눕는 곳
  - 양 떼의 휴식처
  - 가축이 누울 곳
  lexicon: HALOT
  rationale: ‘눕는 곳/쉬는 곳’ 중 한국어 가독성과 목축 이미지의 자연스러움을 고려해 ‘쉬는 곳’으로 옮겼습니다.
- source_word: יְהוָה
