  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본 용례에 따라 신적 고유명사 יְהוָה는 ‘야훼’로 옮겨 본문의 언약적 이름을 보존했습니다.
theological_decisions:
- issue: 예언 선언의 결과절 표현
  chosen_reading: ‘그러면 너희는 내가 야훼인 것을 알게 될 것입니다’로 결과를 명시했습니다.
  alternative_readings:
  - ‘그리고 너희는 내가 야훼인 줄 알게 될 것입니다’
  - ‘그리하여 너희는 내가 야훼인 것을 알게 될 것입니다’
  rationale: 히브리어 וִידַעְתֶּם의 예언적 결과 용법을 한국어에서 분명하게 드러내기 위해 ‘그러면’으로 옮겼습니다.
  doctrine_reference: 예언서의 인식 공식(‘너희는 알게 될 것이다’)
