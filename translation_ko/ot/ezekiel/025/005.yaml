translation:
  language: ko
  text: 내가 랍바를 낙타들의 목초지[a]로, 암몬 자손[b]을 양 떼의 쉬는 곳[c]으로 만들겠습니다. 그러면 너희는 내가 야훼임을 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘목초지’는 히브리어 נווה의 문맥상 의미를 살린 번역입니다. 대안으로 ‘거처’ 또는 ‘거주지’가 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘암몬의 아들들’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘쉬는 곳’은 ‘눕는 곳’ 또는 ‘휴식처’로도 옮길 수 있습니다.
    reason: lexical_alternative
