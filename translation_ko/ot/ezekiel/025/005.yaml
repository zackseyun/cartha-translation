  text: וְ/נָתַתִּ֤י אֶת רַבָּה֙ לִ/נְוֵ֣ה גְמַלִּ֔ים וְ/אֶת בְּנֵ֥י עַמּ֖וֹן לְ/מִרְבַּץ צֹ֑אן וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/005.yaml
  text: And I will make Rabbah a pasture for camels[a], and the Ammonites a resting place for flocks[c][b]; then you will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'a habitation of camels' or 'a dwelling place for camels.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Ammon.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a lying-down place for flocks.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 랍바를 낙타들의 목초지로, 암몬 자손을 양 떼의 쉬는 곳으로 만들겠습니다. 그러면 너희는 내가 야훼인 것을 알게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘목초지’는 히브리어 נווה의 문맥상 의미를 살린 번역입니다. 대안으로 ‘거처’ 또는 ‘거주지’가 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘암몬의 아들들’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘쉬는 곳’은 ‘눕는 곳’ 또는 ‘휴식처’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
