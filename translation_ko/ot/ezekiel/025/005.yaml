  lexicon: HALOT
  rationale: 문맥이 가축·유목 이미지이므로 ‘목초지’가 본문의 장소성 및 비유적 황폐화를 가장 직접적으로 드러냅니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the Ammonites
  chosen_korean: 암몬 자손
  alternatives_korean:
