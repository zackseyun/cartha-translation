  naturalness: ‘애가를 지어 말할 것입니다’는 중복적이고, ‘그들의 두려움을 주었구나’는 현대 한국어에서 부자연스럽습니다. ‘애가를 부르며 말할 것입니다’, ‘공포를 안겨 주었구나’로 다듬는 것이 현대의 격식 있는 문체에 맞습니다. 도시의 여성 인격화는 한국어에서 여성 대명사로 직역하면 부자연스러우므로 ‘그 도시와 그 주민들’로 나타내되, 본문의 호명과 도시 지시를 유지했습니다.
  terminology: ‘애가’, ‘멸망’, ‘칭송받던 도시’, ‘공포’는 예언서의 애가 문맥에 맞고 현대 한국어에서도 이해 가능합니다. 난해한 מִיַּמִּים은 해석을 확정하지 않고 ‘바다들에서 사람들이 거주하던’으로 보존하며 각주에서 가능한 이해를 밝혔습니다.
  issues:
  - severity: medium
    issue: ‘바다들에서 살던 자여’가 수동 분사의 의미를 능동적 ‘살다’로 변경합니다.
    rationale: נוֹשֶׁבֶת는 ‘거주하게 된/사람이 거주하는’이라는 수동적 또는 상태적 표현입니다. 해당 구절 자체가 난해하므로, 도시가 ‘살던 자’라는 뜻으로 평탄화하지 않아야 합니다.
  - severity: medium
    issue: ‘애가를 지어 말할 것입니다’는 히브리어 관용구의 번역으로 부정확하고 한국어도 중복적입니다.
    rationale: נָשָׂא קִינָה는 애가를 ‘부르다/읊다/제기하다’라는 뜻입니다. ‘지어 말하다’는 작시 행위를 덧붙입니다.
  - severity: medium
    issue: 마지막 절이 도시를 가리키는 접미사와 원문의 어색한 지시 관계를 흐립니다.
    rationale: לְכָל יוֹשְׁבֶיהָ는 문자상 ‘그 도시의 모든 주민에게’입니다. 의미가 난해하고 긴장되지만, ‘모든 주민’으로만 옮기면 접미사의 지시를 잃습니다.
