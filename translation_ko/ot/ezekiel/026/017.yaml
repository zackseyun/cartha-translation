  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָשְׂא֨וּ עָלַ֤יִ/ךְ קִינָה֙ וְ/אָ֣מְרוּ לָ֔/ךְ אֵ֣יךְ אָבַ֔דְתְּ נוֹשֶׁ֖בֶת מִ/יַּמִּ֑ים הָ/עִ֣יר הַ/הֻלָּ֗לָה אֲשֶׁר֩ הָיְתָ֨ה חֲזָקָ֤ה בַ/יָּם֙ הִ֣יא וְ/יֹשְׁבֶ֔י/הָ אֲשֶׁר נָתְנ֥וּ חִתִּיתָ֖/ם לְ/כָל יוֹשְׁבֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/017.yaml
  text: They will raise a lament over you and say to you[a], ‘How you have perished, you who were inhabited from the seas, the praised city, which was strong in the sea, she and her inhabitants[c][b], who imposed their terror on all her inhabitants.’
  footnotes:
  - marker: a
    text: Hebrew 'inhabited from the seas,' a difficult phrase that may mean populated or supplied from maritime regions; some translations render more interpretively, such as 'situated at the entrance of the sea.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the renowned city' / 'the celebrated city.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'gave their terror'—that is, caused dread among others.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 당신에 대해 애가를 지어 말할 것입니다. ‘어찌 당신은 멸망하였습니까? 바다들에서 살던 자여, 바다 가운데서 강했던 칭송받던 도시여, 너와 네 주민들이여, 그들이 모든 주민에게 그들의 두려움을 주었구나.’[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘바다들에서 살던’은 난해한 표현으로, 해석에 따라 ‘바닷가에 자리한’ 혹은 ‘해상 지역에서 공급받던’ 뜻으로 이해될 수 있습니다.
    reason: source_note
  - marker: b
    text: ‘칭송받던’은 직역에 가깝고, 일부 번역은 ‘유명한’ 또는 ‘명성 높은’으로 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그들의 두려움/공포를 주었다’는 뜻으로, 다른 이들에게 공포를 불러일으켰다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ ... קִינָה
  english_pob_choice: they will raise a lament
  chosen_korean: 애가를 지어 말할 것입니다
  alternatives_korean:
  - 애가를 उठ을 것입니다
  - 애가를 드높일 것입니다
  - 탄식을 올릴 것입니다
  lexicon: HALOT
  rationale: נָשָׂא + קִינָה의 관용구를 한국어 자연문으로 옮기되, 예언적 조문체의 문체를 살려 ‘애가를 지어 말하다’로 처리했습니다.
- source_word: נוֹשֶׁבֶת מִיַּמִּים
  english_pob_choice: you who were inhabited from the seas
  chosen_korean: 바다들에서 살던 자여
  alternatives_korean:
  - 바다들로부터 거주하던 자여
  - 바다에서 거주하던 자여
  - 바다 무리로부터 거주하던 자여
  lexicon: HALOT
  rationale: 문법적으로 난해한 구를 직역 쪽으로 유지해, 해석을 과도하게 풀지 않고 ‘바다들에서’라는 복수형 흔적을 살렸습니다.
- source_word: הָעִיר הַהֻלָּלָה
  english_pob_choice: the praised city
  chosen_korean: 칭송받던 도시
  alternatives_korean:
  - 명성이 자자한 도시
  - 찬양받던 도시
  - 유명한 도시
  lexicon: HALOT
  rationale: הֻלָּלָה의 수동 분사 의미를 반영해 ‘칭송받던’으로 옮기고, 예언적 탄식의 수사에 맞게 도시를 인격화된 대상으로 유지했습니다.
- source_word: נָתְנוּ חִתִּיתָם
  english_pob_choice: they imposed their terror
  chosen_korean: 그들이 모든 주민에게 그들의 두려움을 주었구나
  alternatives_korean:
  - 그들이 모든 주민에게 공포를 주었구나
  - 그들이 모든 주민에게 두려움을 끼쳤구나
  - 그들이 모든 주민을 두렵게 했구나
  lexicon: HALOT
  rationale: נתן + חִתִּית의 ‘두려움을 주다/끼치다’ 뜻을 한국어로 직접 살려, 폭력적 위압의 강도를 유지했습니다.
theological_decisions:
- issue: 도시의 여성 인격화
  chosen_reading: 도시를 여성 호칭과 대명사 흐름으로 살려 ‘너와 네 주민들’처럼 탄식의 호명 구조를 유지했습니다.
  alternative_readings:
  - 도시를 무생물로 처리해 ‘그것과 그 주민들’로 옮길 수 있음
  rationale: 히브리어가 העיר를 여성형으로 다루는 시적 인격화를 보존하는 것이 애가의 수사와 맞습니다.
  doctrine_reference: Translation philosophy §6 (가독성) 및 §5 (일관성/문서화된 예외)
