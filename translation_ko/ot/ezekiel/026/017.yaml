revisions:
- from: 그들은 당신에 대해 애가를 지어 말할 것입니다. ‘어찌 당신은 멸망하였습니까? 바다들에서 살던 자여, 바다 가운데서 강했던 칭송받던 도시여, 너와 네 주민들이여, 그들이 모든 주민에게 그들의 두려움을 주었구나.’[a][b][c]
  to: 그들은 당신을 두고 애가를 부르며 당신에게 말할 것입니다. ‘어찌하여 멸망하였습니까? 바다들에서 사람들이 거주하던 곳이여[a], 바다 가운데서 강했던 칭송받던 도시여[b], 그 도시와 그 주민들이 그 도시의 모든 주민에게 자신들의 공포를 안겨 주었구나.’[c]
  rationale: 원문의 애가 관용구, 난해한 수동 분사구, 도시의 시적 인격화, 그리고 마지막 절의 어색한 접미사 지시를 보존하면서 한국어 문장을 자연스럽게 정리했습니다. ‘당신’이라는 호명은 초안의 현대 격식체를 유지했고, 인용문 안의 ‘-습니까’와 ‘-구나’는 애가의 직접 호명 및 탄식 어조를 나타냅니다.
  reviewer_model: gpt-5.6-terra
