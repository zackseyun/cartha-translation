base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/017.yaml
  text: They will raise a lament over you and say to you[a], ‘How you have perished, you who were inhabited from the seas, the praised city, which was strong in the sea, she and her inhabitants[c][b], who imposed their terror on all her inhabitants.’
  footnotes:
  - marker: a
    text: Hebrew 'inhabited from the seas,' a difficult phrase that may mean populated or supplied from maritime regions; some translations render more interpretively, such as 'situated at the entrance of the sea.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the renowned city' / 'the celebrated city.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'gave their terror'—that is, caused dread among others.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 당신을 두고 애가를 부르며 당신에게 말할 것입니다. ‘어찌하여 멸망하였습니까? 바다들에서 사람들이 거주하던 곳이여[a], 바다 가운데서 강했던 칭송받던 도시여[b], 그 도시와 그 주민들이 그 도시의 모든 주민에게 자신들의 공포를 안겨 주었구나.’[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로 ‘바다들에서 사람이 거주하던’이라는 난해한 표현입니다. 해상 지역에서 사람이 모여들어 살던 곳 또는 해상 지역에서 공급받던 곳을 뜻할 수 있으며, 일부 번역은 더 해석적으로 ‘바닷가에 자리한’으로 옮깁니다.
    reason: source_note
  - marker: b
    text: 또는 ‘유명한 도시’, ‘명성 높은 도시’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그들의 공포를 주었다’입니다. 마지막 ‘그 도시의 모든 주민’이라는 표현은 문맥상 난해하지만, 본문은 그대로 보존합니다. 곧 그 도시와 주민들이 다른 이들에게 공포를 일으켰다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
