  text: בֶּן אָדָ֗ם יַ֠עַן אֲשֶׁר אָ֨מְרָה צֹּ֤ר עַל יְרוּשָׁלִַ֨ם֙ הֶאָ֔ח נִשְׁבְּרָ֛ה דַּלְת֥וֹת הָ/עַמִּ֖ים נָסֵ֣בָּה אֵלָ֑/י אִמָּלְאָ֖ה הָחֳרָֽבָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/002.yaml
  text: Son of man[a], because Tyre said concerning Jerusalem, ‘Aha! The gateway of the peoples is broken; it has turned to me. I will be filled[b], now that she is laid waste,’
  footnotes:
  - marker: a
    text: Or 'the gates of the peoples' or 'the doors of the peoples.' The Hebrew phrase is compressed and may portray Jerusalem as an entry point for many nations.
    reason: lexical_alternative
  - marker: b
    text: That is, Tyre expects to profit from Jerusalem's fall, as trade or access is redirected to her.
    reason: cultural_note
translation:
  language: ko
  text: 사람의 아들아, 두로가 예루살렘에 대하여 말하기를 ‘아하! 여러 민족의 관문[a]이 무너졌구나. 그것이 내게로 돌아왔으니, 이제 나는 가득하게 되리라[b]. 예루살렘이 황폐해졌으므로.’ 하였기 때문에
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여러 민족의 관문’은 직역하면 ‘민족들의 문들’ 또는 ‘민족들의 문짝들’로도 옮길 수 있습니다. 히브리어의 압축된 표현은 예루살렘을 여러 민족이 드나드는 관문으로 묘사할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 두로는 예루살렘의 몰락으로 무역이나 접근의 흐름이 자기에게로 돌아와 이익을 얻을 것으로 기대합니다.
    reason: cultural_note
