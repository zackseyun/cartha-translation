  source_fidelity: 원문의 인과절(יַעַן אֲשֶׁר)과 두로의 조롱 섞인 직접 발화는 대체로 보존되었습니다. 그러나 ‘그가 황폐하게 되었으니’의 ‘그’는 여성형으로 예루살렘을 받는 원문을 한국어에서 부정확하고 모호하게 만들며, ‘내가 가득 차리라’는 1인칭 도시 화자의 비유로는 한국어에서 부자연스럽습니다.
  naturalness: ‘사람의 아들아’와 ‘아하!’는 현대적이면서도 본문의 호격과 조롱의 어조를 잘 살립니다. 다만 ‘만민의 성문’은 원문의 압축성과 복수형을 단수의 도시 성문으로 다소 좁히고, 인용문 끝의 대명사는 지시 대상이 불분명합니다. ‘여러 민족의 관문’ 및 ‘예루살렘이 황폐해졌으므로’가 더 자연스럽고 명료합니다.
  terminology: 두로와 예루살렘의 명칭은 적절합니다. דַּלְתוֹת הָעַמִּים의 불확정적인 비유는 본문에서 ‘여러 민족의 관문’으로 옮기고 각주에서 ‘문들/문짝들’이라는 직역 가능성을 밝혀 두는 것이 안전합니다. אִמָּלְאָה는 상업적 이익을 본문에 과도하게 명시하지 않고 ‘가득하게 되리라’로 유지합니다.
