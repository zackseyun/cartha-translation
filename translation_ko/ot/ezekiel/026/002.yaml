id: EZK.26.2
reference: Ezekiel 26:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֶּן אָדָ֗ם יַ֠עַן אֲשֶׁר אָ֨מְרָה צֹּ֤ר עַל יְרוּשָׁלִַ֨ם֙ הֶאָ֔ח נִשְׁבְּרָ֛ה דַּלְת֥וֹת הָ/עַמִּ֖ים נָסֵ֣בָּה אֵלָ֑/י אִמָּלְאָ֖ה הָחֳרָֽבָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/002.yaml
  text: Son of man[a], because Tyre said concerning Jerusalem, ‘Aha! The gateway of the peoples is broken; it has turned to me. I will be filled[b], now that she is laid waste,’
  footnotes:
  - marker: a
    text: Or 'the gates of the peoples' or 'the doors of the peoples.' The Hebrew phrase is compressed and may portray Jerusalem as an entry point for many nations.
    reason: lexical_alternative
  - marker: b
    text: That is, Tyre expects to profit from Jerusalem's fall, as trade or access is redirected to her.
    reason: cultural_note
translation:
  language: ko
  text: 사람의 아들아, 두로가 예루살렘에 대하여 말하기를 ‘아하! 만민의 성문이 무너졌구나. 그것이 내게로 돌아왔으니, 이제 내가 가득 차리라. 그가 황폐하게 되었으니,’ 하였기 때문에[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만민의 성문’은 직역상 ‘만민의 문들/문짝들’에 해당할 수 있는 압축 표현입니다. 예루살렘을 여러 민족이 드나드는 관문으로 본 이미지가 핵심입니다.
    reason: lexical_alternative
  - marker: b
    text: 즉 두로는 예루살렘의 몰락으로 무역이나 유입 경로가 자기에게로 돌아와 이익을 얻게 될 것으로 기대합니다.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 사람의 아들아
  alternatives_korean:
  - 인자여
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서의 반복되는 호칭을 살리면서, 직역적이되 현대 한국어 문장 안에서 자연스러운 호격으로 옮겼습니다.
- source_word: דַּלְת֥וֹת הָעַמִּים
  english_pob_choice: the gateway of the peoples
  chosen_korean: 만민의 성문
  alternatives_korean:
  - 만민의 문들
  - 민족들의 문
  lexicon: HALOT
  rationale: 히브리어 복수형은 도시의 관문 전체를 가리키는 압축된 표현이므로, 한국어에서는 관용적으로 이해되는 ‘성문’이 본문의 기능적 의미를 가장 잘 드러냅니다.
- source_word: נָסֵבָּה אֵלַי
  english_pob_choice: it has turned to me
  chosen_korean: 그것이 내게로 돌아왔으니
  alternatives_korean:
  - 그것이 내게로 향했으니
  - 그것이 내 쪽으로 돌아섰으니
  lexicon: HALOT
  rationale: 단순한 물리적 방향 전환보다, 예루살렘의 몰락으로 인한 유리한 흐름이 두로에게 ‘돌아오는’ 의미를 살려 번역했습니다.
- source_word: אִמָּלְאָה
  english_pob_choice: I will be filled
  chosen_korean: 내가 가득 차리라
  alternatives_korean:
  - 내가 채워지리라
  - 내가 충만해지리라
  lexicon: HALOT
  rationale: 상업적 이익을 명시적으로 풀지 않고, 원문의 비유적 ‘가득 참’을 유지하되 한국어에서 자연스러운 미래형으로 옮겼습니다.
theological_decisions:
- issue: 타이르의 조롱 섞인 발화의 어조
  chosen_reading: 직접 인용 안에서 감탄사 ‘아하!’와 승리감 있는 미래형 ‘가득 차리라’를 살려, 예루살렘의 몰락을 반기는 조롱의 톤을 드러냈습니다.
  alternative_readings:
  - 중립적으로 ‘오!’로 완화하기
  - 단순 진술문으로 바꾸기
  rationale: 본문은 단순 정보 전달이 아니라 타이르의 악의적 환호를 드러내는 예언적 비난이므로, 감정의 강도를 약화시키지 않는 것이 중요합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
