translation:
  language: ko
  text: 내가 네 요란한 노랫소리를 그치게 하겠습니다. 네 수금[a] 소리도 다시는 들리지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘리라’. 히브리어 킨노르는 흔히 리라로 식별되는 현악기를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  english_pob_choice: And I will put an end to
  chosen_korean: 내가 … 그치게 하겠습니다
  alternatives_korean:
  - 내가 … 끝내겠습니다
  - 내가 … 멈추게 하겠습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미인 ‘그치게 하다/끝나게 하다’를 살리되, 현대 한국어에서 자연스럽고 단호한 심판 선언으로 들리도록 옮겼습니다.
- source_word: הֲמוֹן שִׁירַיִךְ
  english_pob_choice: the noise of your songs
  chosen_korean: 네 노래들의 소리
  alternatives_korean:
  - 네 노래들의 소음
  - 네 노래들의 떠들썩한 소리
  lexicon: HALOT
  rationale: הֲמוֹן은 여기서 단순한 ‘노래’가 아니라 그 울림/소란의 의미가 있어 ‘소리’로 옮겼고, 직역의 어색함을 피하면서 원문의 병행을 유지했습니다.
- source_word: כִּנּוֹרַיִךְ
  english_pob_choice: your lyres
  chosen_korean: 네 수금
  alternatives_korean:
  - 네 리라
  - 네 하프
  lexicon: HALOT
  rationale: כִּנּוֹר은 전통적 ‘수금’이 한국어 성경에서 널리 인식되는 반면, 학술적으로는 류르(lyre) 계열 악기이므로 POB의 영어 선택을 참고하되 한국어 관용을 살렸습니다.
- source_word: לֹא יִשָּׁמַע עוֹד
  english_pob_choice: will be heard no more
  chosen_korean: 다시는 들리지 않을 것입니다
  alternatives_korean:
  - 더는 들리지 않을 것입니다
  - 다시 들리지 않게 될 것입니다
  lexicon: HALOT
  rationale: 수동 의미의 ‘들리다’와 지속 종료를 나타내는 עוֹד를 자연스럽게 결합해, 장래의 완전한 중단을 분명히 했습니다.
theological_decisions:
- issue: 예언적 심판 선언의 화자 표현
  chosen_reading: 하나님의 직접 선언으로 한국어를 현재시제적 미래 선언형으로 옮겨, 심판의 확정성과 권위를 드러냈습니다.
  alternative_readings:
  - 단순한 서술형 미래
  - 완곡한 예언적 표현
  rationale: 본문은 단순 예고가 아니라 야훼의 주권적 중단 선언이므로, 합쇼체의 단호한 미래형이 문맥상 가장 적합합니다.
  doctrine_reference: 예언서 심판 선언의 신적 주권
- issue: 악기 명칭의 한국어 관용
  chosen_reading: כִּנּוֹר를 ‘수금’으로 옮겨 한국어 성경 독자가 즉시 악기 이미지를 파악하도록 했습니다.
  alternative_readings:
  - ‘리라’로 음역/설명
  - ‘하프’로 대체
  rationale: 본문의 핵심은 악기의 정확한 음향 이미지와 도시의 음악 중단이므로, 한국어 성경에서 익숙한 ‘수금’이 의미 전달에 유리합니다.
  doctrine_reference: 번역 관용과 의미 전달의 균형
