  terminology: יהוה는 ‘야훼’로, אֲדֹנָי יְהוִה는 칭호와 신명을 모두 반영하여 ‘주 야훼’로 옮겼습니다. נְאֻם의 예언 선언 공식은 ‘…의 말씀입니다’로 자연스럽게 보존했습니다.
