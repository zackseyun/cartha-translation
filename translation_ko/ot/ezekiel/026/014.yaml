  - 고기잡이 그물을 널는 곳
  - 그물을 펴는 장소
  lexicon: HALOT
  rationale: מִשְׁטַח의 '펴 놓는 자리/면'과 חֲרָמִים의 '그물' 이미지를 간결하게 살려, 항구 폐허가 조업 장소가 된다는 뜻을 유지했습니다.
- source_word: לֹא תִבָּנֶה עוֹד
  english_pob_choice: You will not be rebuilt again
  chosen_korean: 다시는 세워지지 않을 것입니다
  alternatives_korean:
  - 다시는 재건되지 않을 것입니다
  - 더는 다시 지어지지 않을 것입니다
  lexicon: HALOT
  rationale: 히필/니팔 계열의 '건축되다'를 한국어에서 자연스럽게 '세워지다'로 옮기되, עוֹד의 반복 금지를 '다시는'으로 분명히 드러냈습니다.
- source_word: יְהוָה / אֲדֹנָי יְהוִה
  english_pob_choice: Yahweh / Lord GOD
  chosen_korean: 야훼 / 주 여호와
  alternatives_korean:
  - 야훼 / 주 하나님
  - 여호와 / 주 여호와
  lexicon: HALOT
  rationale: 본문의 יְהוָה는 POB 기준에 따라 '야훼'로 옮기고, 결미의 אֲדֹנָי יְהוִה는 두 칭호를 살려 전통적 병행형인 '주 여호와'로 옮겼습니다.
theological_decisions:
