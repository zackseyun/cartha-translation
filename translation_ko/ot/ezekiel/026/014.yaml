translation:
  language: ko
  text: 내가 너를 벌거벗은 바위[a], 곧 그물 널 자리가 되게 하겠습니다. 너는 다시는 세워지지 않을 것입니다. 이는 나, 야훼가 말했기 때문입니다[b]. 주 여호와의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '고기잡이 그물을 널 자리'입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 여기서 하나님의 이름 יְהוָה를 직접 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: וּנְתַתִּיךְ
  english_pob_choice: I will make you
  chosen_korean: 내가 너를 … 되게 하겠습니다
  alternatives_korean:
  - 내가 너를 …로 만들겠습니다
  - 내가 너를 …로 삼겠습니다
  lexicon: HALOT
  rationale: נתן이 여기서는 티레를 어떤 상태로 '두다/만들다'는 뜻으로 쓰였으므로, 한국어에서는 결과 상태를 드러내는 '되게 하겠습니다'가 가장 자연스럽습니다.
- source_word: לִצְחִיחַ סֶלַע
  english_pob_choice: a bare rock
  chosen_korean: 벌거벗은 바위
  alternatives_korean:
  - 맨바위
  - 드러난 바위
  - 황량한 바위
  lexicon: HALOT
  rationale: 직역 가능한 이미지이면서도 완전한 황폐를 살리는 표현으로, 문맥상의 폐허 상태를 분명하게 전달합니다.
- source_word: מִשְׁטַח חֲרָמִים
  english_pob_choice: a place for spreading nets
  chosen_korean: 그물 널 자리
  alternatives_korean:
  - 그물을 펼 자리
  - 고기잡이 그물을 널는 곳
  - 그물을 펴는 장소
  lexicon: HALOT
  rationale: מִשְׁטַח의 '펴 놓는 자리/면'과 חֲרָמִים의 '그물' 이미지를 간결하게 살려, 항구 폐허가 조업 장소가 된다는 뜻을 유지했습니다.
- source_word: לֹא תִבָּנֶה עוֹד
  english_pob_choice: You will not be rebuilt again
  chosen_korean: 다시는 세워지지 않을 것입니다
  alternatives_korean:
  - 다시는 재건되지 않을 것입니다
  - 더는 다시 지어지지 않을 것입니다
  lexicon: HALOT
  rationale: 히필/니팔 계열의 '건축되다'를 한국어에서 자연스럽게 '세워지다'로 옮기되, עוֹד의 반복 금지를 '다시는'으로 분명히 드러냈습니다.
- source_word: יְהוָה / אֲדֹנָי יְהוִה
  english_pob_choice: Yahweh / Lord GOD
  chosen_korean: 야훼 / 주 여호와
  alternatives_korean:
  - 야훼 / 주 하나님
  - 여호와 / 주 여호와
  lexicon: HALOT
  rationale: 본문의 יְהוָה는 POB 기준에 따라 '야훼'로 옮기고, 결미의 אֲדֹנָי יְהוִה는 두 칭호를 살려 전통적 병행형인 '주 여호와'로 옮겼습니다.
theological_decisions:
- issue: 본문의 신명(יהוה)과 종결 공식(אֲדֹנָי יְהוִה) 처리
  chosen_reading: 본문에서는 '야훼', 결미 공식에서는 '주 여호와'를 사용했습니다.
  alternative_readings:
  - 본문과 결미 모두 '주님'으로 통일
  - 본문과 결미 모두 '여호와'로 통일
  rationale: 이 절은 예언적 선언의 확정성을 강조하므로, 신명과 주권 칭호의 중복을 흐리지 않으면서도 한국어에서 낭독 가능한 형식으로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH → 야훼'
