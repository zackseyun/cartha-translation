base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/014.yaml
  text: I will make you a bare rock[a], a place for spreading nets. You will not be rebuilt again, for I, Yahweh, have spoken[b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'a place to spread fishing nets.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD' represents the divine name YHWH; the closing title is literally 'Lord YHWH.'
