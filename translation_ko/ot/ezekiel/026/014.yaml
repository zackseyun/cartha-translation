base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/014.yaml
  text: I will make you a bare rock[a], a place for spreading nets. You will not be rebuilt again, for I, Yahweh, have spoken[b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'a place to spread fishing nets.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD' represents the divine name YHWH; the closing title is literally 'Lord YHWH.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 너를 맨바위[a], 곧 그물을 널 곳이 되게 하겠습니다. 너는 다시는 재건되지 않을 것입니다. 이는 나 야훼가 말했기 때문입니다[b]. 주 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고기잡이 그물을 널 곳’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 하나님의 이름 יְהוָה를 직접 사용합니다. 마지막 칭호는 문자적으로 ‘주 יְהוָה’입니다.
    reason: source_note
lexical_decisions:
- source_word: וּנְתַתִּיךְ
  english_pob_choice: I will make you
  chosen_korean: 내가 너를 … 되게 하겠습니다
  alternatives_korean:
