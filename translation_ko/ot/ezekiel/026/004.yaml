id: EZK.26.4
reference: Ezekiel 26:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שִׁחֲת֞וּ חֹמ֣וֹת צֹ֗ר וְ/הָֽרְסוּ֙ מִגְדָּלֶ֔י/הָ וְ/סִֽחֵיתִ֥י עֲפָרָ֖/הּ מִמֶּ֑/נָּה וְ/נָתַתִּ֥י אוֹתָ֖/הּ לִ/צְחִ֥יחַ סָֽלַע׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/004.yaml
  text: They will destroy the walls of Tyre and tear down her towers[a], and I will scrape her dust away from her and make her a bare rock.
  footnotes:
  - marker: a
    text: Or 'her dust' instead of 'her soil'; the Hebrew עָפָר can denote dust, loose earth, or soil. The sense here is that the city will be stripped down to the rock.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 두로의 성벽을 무너뜨리고 그 망대들을 헐어 버릴 것이며[a], 나는 그곳의 흙을 그 위에서 긁어내어 그것을 민 바위로 만들겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그 흙' 대신 '그 땅'; 히브리어 עָפָר는 먼지, 느슨한 흙, 땅을 가리킬 수 있습니다. 여기서는 성읍이 바위만 남도록 벗겨지는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁחֲתוּ
  english_pob_choice: they will destroy
  chosen_korean: 무너뜨리고
  alternatives_korean:
  - 파괴하고
  - 헐어 버리고
  - 무너뜨리며
  lexicon: HALOT
  rationale: 성벽을 대상으로 한 파괴 행위로서 자연스럽고, 뒤의 '헐어 버리다'와 동사 결을 달리해 히브리어의 연속 동작을 살렸습니다.
- source_word: מִגְדָּלֶיהָ
  english_pob_choice: her towers
  chosen_korean: 그 망대들
  alternatives_korean:
  - 그 탑들
  - 그 성루들
  lexicon: HALOT
  rationale: מגדל은 기본적으로 '망대/탑'이지만, 성읍 방어 구조물이라는 문맥을 살려 '망대들'로 옮겼습니다.
- source_word: עֲפָרָהּ
  english_pob_choice: her soil / her dust
  chosen_korean: 그곳의 흙
  alternatives_korean:
  - 그곳의 먼지
  - 그곳의 흙먼지
  - 그 땅
  lexicon: HALOT
  rationale: עפר는 '먼지, 흙, 흙먼지'를 모두 가질 수 있으나, 성읍이 바위만 남도록 깎여 나가는 장면에는 '흙'이 가장 직접적이고 한국어로도 자연스럽습니다.
- source_word: לִצְחִיחַ סָלַע
  english_pob_choice: a bare rock
  chosen_korean: 민 바위
  alternatives_korean:
  - 드러난 바위
  - 맨 바위
  - 벌거벗은 바위
  lexicon: HALOT
  rationale: צחיח은 '민, 벌거숭이, 아무것도 없는'의 뜻이어서 '민 바위'가 노출된 암반의 상태를 간결하게 드러냅니다.
theological_decisions:
- issue: 두로에 대한 심판 선언의 미래형 표현
  chosen_reading: “그들은 … 할 것이며, 나는 … 만들겠습니다”로 미래적 심판 선언을 분명히 했습니다.
  alternative_readings:
  - 직설적 현재형으로 옮기기
  - 예언적 현재로 평탄화하기
  rationale: 히브리어의 예언적 미래를 현대 한국어에서 자연스러운 미래 시제로 옮기되, 선언의 확정성을 유지했습니다.
  doctrine_reference: 예언문체의 확정적 미래
- issue: 성읍을 인격화한 여성 대명사 처리
  chosen_reading: '''그곳의 흙''과 ''그 위에서''로 옮겨 여성 인칭성을 과도하게 재현하지 않았습니다.'
  alternative_readings:
  - '''그녀의 흙''처럼 직역하기'
  - 두로를 인격화해 일관되게 '그녀'로 옮기기
  rationale: 한국어에서 도시를 여성 인칭으로 반복하면 부자연스러워질 수 있어, 원문의 인격화는 유지하되 문장을 매끄럽게 했습니다.
  doctrine_reference: 시적/예언적 인격화 표현
