source:
  edition: WLC
  text: עַתָּה֙ יֶחְרְד֣וּ הָֽ/אִיִּ֔ן י֖וֹם מַפַּלְתֵּ֑/ךְ וְ/נִבְהֲל֛וּ הָ/אִיִּ֥ים אֲשֶׁר בַּ/יָּ֖ם מִ/צֵּאתֵֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/018.yaml
  text: Now the coastlands will tremble on the day of your downfall[b][a], and the islands that are in the sea will be terrified at your departure.
  footnotes:
  - marker: a
    text: Or 'the islands' in the first clause; Hebrew אִיִּים can refer either to islands or to coastlands/maritime lands. Here 'coastlands' is used for the broader sense.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from your going out' or 'because of your going out.' The phrase likely refers to Tyre's disappearance in judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 해안 지역들이 너의 몰락의 날에 떨 것이며, 바다 가운데 있는 섬들도 너의 떠남 때문에 크게 두려워할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִיִּים은 ‘섬들’ 또는 더 넓게는 ‘해안 지역들’을 뜻할 수 있습니다. 여기서는 첫 절의 뜻을 넓게 잡아 ‘해안 지역들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘네가 나갈 때’ 또는 ‘네 떠남으로 인해’입니다. 문맥상 두로가 심판으로 사라지는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִיִּן
  english_pob_choice: the coastlands
  chosen_korean: 해안 지역들
  alternatives_korean:
  - 섬들
  - 해변 지역들
  lexicon: HALOT
  rationale: איים는 ‘섬들’ 또는 더 넓게는 해양 변두리 지역을 가리킬 수 있으므로, POB의 ‘coastlands’ 취지를 살려 한국어로는 지리적 범위를 넓게 드러내는 ‘해안 지역들’로 옮겼습니다.
- source_word: יֶחְרְדוּ
  english_pob_choice: will tremble
  chosen_korean: 떨 것이며
  alternatives_korean:
  - 두려워할 것이며
  - 전율할 것이며
  lexicon: HALOT
  rationale: חרד의 물리적 떨림과 두려움의 뉘앙스를 함께 살리되, 예언문맥에서 자연스러운 ‘떨다’ 표현으로 압축했습니다.
- source_word: יוֹם מַפַּלְתֵּךְ
  english_pob_choice: on the day of your downfall
  chosen_korean: 너의 몰락의 날
  alternatives_korean:
  - 너의 سقوط의 날
  - 너의 쓰러짐의 날
  - 너의 패망의 날
  lexicon: HALOT
  rationale: ‘downfall’에 해당하는 מַפָּלָה의 중량감을 살리면서도 현대 한국어 예언체로 자연스러운 ‘몰락’을 택했습니다.
- source_word: מִצֵּאתֵךְ
  english_pob_choice: at your departure
  chosen_korean: 너의 떠남 때문에
  alternatives_korean:
  - 너의 나감으로 인해
  - 너의 떠남으로 말미암아
  - 너의 출현의 반대로
  lexicon: HALOT
  rationale: 직역하면 ‘너의 나감’이지만, 문맥상 두로가 심판으로 사라지는 소멸을 가리키므로 POB의 해석을 따라 원인 관계가 드러나는 ‘떠남 때문에’로 옮겼습니다.
theological_decisions:
- issue: 두 번 나오는 איים의 범위 차이
  chosen_reading: 첫 절의 אִיִּן은 넓은 ‘해안 지역들’로, 뒤의 אִיִּים은 ‘바다 가운데 있는 섬들’로 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘섬들’로 통일
  - 둘 다 ‘해안 지역들’로 통일
  rationale: 영문 POB가 지적하듯 첫 번째는 광범위한 해양 변두리 지역을, 두 번째는 바다 안의 섬이라는 더 문자적인 대상을 가리킬 수 있어, 의미 차이를 보존하는 것이 본문 이해에 유익합니다.
  doctrine_reference: 문학적-지리적 표현의 보존
