source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י עָלַ֖יִ/ךְ צֹ֑ר וְ/הַעֲלֵיתִ֤י עָלַ֨יִ/ךְ֙ גּוֹיִ֣ם רַבִּ֔ים כְּ/הַעֲל֥וֹת הַ/יָּ֖ם לְ/גַלָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/003.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against you, Tyre, and I will bring up many nations against you, as the sea brings up its waves.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Lord YHWH'' (אֲדֹנָי יְהוִה); English ''the Lord GOD'' reflects the traditional way of rendering both divine titles together without saying ''Lord LORD.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. “보십시오, 내가 너를 대적한다, 두로야. 내가 많은 나라가 너를 치러 올라오게 하겠다. 바다가 파도를 일으키듯이 하겠다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 אֲדֹנָי יְהוִה(‘주 야훼’)라고 합니다. 이 결합된 신칭은 ‘주’와 하나님의 고유한 이름 야훼를 함께 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 이러므로
  lexicon: HALOT
  rationale: 앞선 심판 맥락과 이어지는 추론 접속사로, 현대 한국어에서 가장 자연스럽고 격식을 갖춘 연결어입니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와
  lexicon: HALOT
  rationale: 합쇼체 본문에서 두 신칭이 결합된 형식을 자연스럽게 살리되, 한국어에서는 중복된 “주 주님”을 피하기 위해 “주 하나님”으로 옮겼습니다. 본문 각주로 히브리어의 결합형을 밝혔습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 내가 있다
  lexicon: HALOT
  rationale: 선포의 긴박성과 주의 환기를 살리면서도 현대 한국어에서 너무 고어적으로 들리지 않는 명령형 감탄으로 옮겼습니다.
- source_word: עָלַיִךְ
  english_pob_choice: against you
  chosen_korean: 너를 대적하나니
  alternatives_korean:
  - 너에게
  - 너 위에
  lexicon: HALOT
  rationale: 문맥상 단순한 위치가 아니라 적대적 심판의 방향을 나타내므로, 한국어에서도 대적의 뜻을 분명히 했습니다.
- source_word: כְּהַעֲלוֹת הַיָּם לְגַלָּיו
  english_pob_choice: as the sea brings up its waves
  chosen_korean: 바다가 그 물결들을 끌어올리듯
  alternatives_korean:
  - 바다가 자기 파도들을 일으키듯
  - 바다가 그 파도들을 끌어올리듯
  lexicon: HALOT
  rationale: 동사 반복의 이미지를 살려 ‘끌어올리다’로 맞추고, 파도보다 문맥상 더 중립적인 ‘물결들’을 사용해 비유의 누적성을 살렸습니다.
theological_decisions:
- issue: יהוה를 포함한 결합 호칭 אֲדֹנָי יְהוִה의 한국어 처리
  chosen_reading: 본문에는 ‘주 하나님’으로 자연스럽게 옮기고, 각주에서 히브리어의 결합된 신칭을 밝힙니다.
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 이 절은 선지자적 선포문으로서 호칭의 엄숙함이 중요하지만, 한국어 본문에서는 반복과 어색함을 피하는 것이 가독성에 유리합니다. 대신 주석으로 원문 형태를 투명하게 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
