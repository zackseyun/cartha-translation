id: EZK.26.9
reference: Ezekiel 26:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מְחִ֣י קָֽבָלּ֔/וֹ יִתֵּ֖ן בְּ/חֹֽמוֹתָ֑יִ/ךְ וּ/מִ֨גְדְּלֹתַ֔יִ/ךְ יִתֹּ֖ץ בְּ/חַרְבוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/009.yaml
  text: He will direct the blow of his battering ram against your walls[a], and with his axes he will tear down your towers.
  footnotes:
  - marker: a
    text: Or possibly 'with his axes' or 'with his iron tools,' if the final phrase is understood as referring more generally to siege weapons rather than literally to swords.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 공성망치의 타격을 네 성벽에 가하고, 자기 칼들[a]로 네 망대들을 무너뜨릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 칼들’이라고 합니다. 그러나 일부는 망대를 무너뜨리는 공성 문맥에 비추어 이를 도끼나 다른 공성 도구를 가리키는 말로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְחִי
  english_pob_choice: the blow
  chosen_korean: 타격
  alternatives_korean:
  - 충격
  - 한 번의 치는 것
  lexicon: HALOT
  rationale: 성벽을 향한 공격 행위를 한국어로 자연스럽게 살리면서도, 단순한 추상어가 아니라 실제 타격의 이미지를 유지합니다.
- source_word: קָבַלּוֹ
  english_pob_choice: his battering ram
  chosen_korean: 공성망치
  alternatives_korean:
  - 공성추
  - 성벽을 부수는 기구
  lexicon: HALOT
  rationale: 본문의 전쟁·공성 문맥에서 성벽을 부수는 무기를 가리키므로, 기능이 드러나는 현대적 용어로 옮겼습니다.
- source_word: יִתֵּן בְּחֹמוֹתַיִךְ
  english_pob_choice: will direct ... against your walls
  chosen_korean: 너의 성벽에 ... 가하고
  alternatives_korean:
  - 너의 성벽을 향해 ... 두고
  - 너의 성벽에 ... 대고
  lexicon: HALOT
  rationale: 히브리어의 ‘주다/두다’는 공성 장비를 벽에 대어 공격하는 관용적 동작으로 보이므로, 한국어에서는 ‘타격을 가하다’로 의미를 압축해 자연스럽게 표현했습니다.
- source_word: חַרְבוֹתָיו
  english_pob_choice: his swords
  chosen_korean: 망대들을 무너뜨릴 것입니다
  alternatives_korean:
  - 칼들로
  - 도끼들로
  lexicon: HALOT
  rationale: 영어 POB의 주석처럼 이 어휘는 문맥상 실제로는 공성 도구 일반을 가리킬 수 있지만, 본문 자체의 핵심 초점은 ‘무너뜨림’에 있으므로 동작 결과를 살려 번역하고 해설은 각주로 남겼습니다.
theological_decisions:
- issue: חַרְבוֹתָיו의 직역 여부와 공성 문맥의 긴장
  chosen_reading: 본문의 문자형식은 유지하되, 한국어 본문에서는 ‘망대들을 무너뜨릴 것입니다’로 옮기고 칼/도끼 여부의 긴장은 각주로 처리합니다.
  alternative_readings:
  - 그의 칼들로 너의 망대들을 무너뜨릴 것입니다
  - 그의 도끼들로 너의 망대들을 허물 것입니다
  rationale: 문맥상 공성 장비 일반을 뜻할 가능성이 있지만, 마소라 본문의 표면형을 임의로 바꾸지 않으면서 독자가 전투 장면을 정확히 이해하도록 결과 동사를 전면에 두었습니다.
  doctrine_reference: 문맥 우선의 어휘 해석
- issue: 군사적 이미지의 현대어화
  chosen_reading: ‘공성망치’와 ‘타격을 가하다’를 사용해 고대 공성전을 현대 독자가 즉시 이해하도록 했습니다.
  alternative_readings:
  - 성벽에 그의 망치의 타격을 보낼 것입니다
  - 성벽을 공격할 것입니다
  rationale: 의미를 약화시키지 않으면서도 한국어에서 군사 공성 이미지를 선명하게 전달하는 쪽을 택했습니다.
  doctrine_reference: 명시성 우선 번역 원칙
