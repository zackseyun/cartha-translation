id: EZK.26.8
reference: Ezekiel 26:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנוֹתַ֥יִ/ךְ בַּ/שָּׂדֶ֖ה בַּ/חֶ֣רֶב יַהֲרֹ֑ג וְ/נָתַ֨ן עָלַ֜יִ/ךְ דָּיֵ֗ק וְ/שָׁפַ֤ךְ עָלַ֨יִ/ךְ֙ סֹֽלְלָ֔ה וְ/הֵקִ֥ים עָלַ֖יִ/ךְ צִנָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/008.yaml
  text: He will kill your daughters in the field with the sword[a], set up a siege wall against you, throw up a siege ramp against you[b], and raise a large shield against you.
  footnotes:
  - marker: a
    text: Or 'your daughter towns' or 'your villages in the countryside'; the Hebrew literally says 'your daughters in the field,' referring to dependent settlements.
    reason: lexical_alternative
  - marker: b
    text: '''Large shield'' may refer more specifically to siege protection such as a mantlet or shielded covering used in assault operations.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 들판에서 네 딸들을 칼로 죽이고, 네게 맞서 공성벽을 세우며, 네게 맞서 공성 토성을 쌓고, 네게 큰 방패를 세울 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘네 딸들’을 뜻하지만, 문맥상 도시의 종속 정착지들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘공성 토성’은 포위 공격을 위해 쌓는 흙둔덕이나 경사로를 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנוֹתַיִךְ
  english_pob_choice: your daughters
  chosen_korean: 네 딸들
  alternatives_korean:
  - 네 딸 도시들
  - 네 부속 마을들
  - 네 딸들[각주로 부속 정착지 의미]
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘딸들’이지만, 본문은 도시의 종속 정착지를 가리킬 수 있으므로 본문에는 직역 이미지를 살리고, 문맥상 독자가 오해하지 않도록 각주 없이도 자연스러운 표현으로 옮겼습니다.
- source_word: בַּשָּׂדֶה
  english_pob_choice: in the field
  chosen_korean: 들판에서
  alternatives_korean:
  - 들에서
  - 시골에서
  - 야지에서
  lexicon: HALOT
  rationale: 기본 의미인 ‘열린 들/들판’을 살린 표현으로, 본문의 전쟁적 장면을 해치지 않으면서도 원문의 이미지를 유지합니다.
- source_word: דָּיֵק
  english_pob_choice: a siege wall
  chosen_korean: 공성벽
  alternatives_korean:
  - 포위벽
  - 공성 진지
  - 공성 설비
  lexicon: HALOT
  rationale: 영어 POB의 ‘siege wall’에 맞추되, 단순한 일반 ‘벽’이 아니라 포위 공격용 구조물임을 드러내기 위해 합성어 ‘공성벽’을 사용했습니다.
- source_word: סֹלְלָה
  english_pob_choice: a siege ramp
  chosen_korean: 공성 토성
  alternatives_korean:
  - 공성 경사로
  - 공성 둔덕
  - 공성 제방
  lexicon: HALOT
  rationale: 히브리어의 포위전용 흙둔덕/경사로를 가리키므로, 한국어 군사 용어로 널리 이해되는 ‘토성’을 붙여 공성용 축조물임을 분명히 했습니다.
- source_word: צִנָּה
  english_pob_choice: a large shield
  chosen_korean: 큰 방패
  alternatives_korean:
  - 대형 방패
  - 방패
  - 방패 가림막
  lexicon: HALOT
  rationale: POB의 ‘large shield’를 직접 반영해, 방어 장비를 뜻하는 기본어 ‘방패’에 크기 정보를 더한 ‘큰 방패’로 옮겼습니다.
theological_decisions:
- issue: 전쟁 예언의 미래 시제와 연속 동작
  chosen_reading: 예언적 미래로 읽어 ‘-할 것입니다’와 연속 동사형으로 자연스럽게 옮겼습니다.
  alternative_readings:
  - 직설적 과거형처럼 옮김
  - 명령형 또는 현재형으로 완화
  rationale: 히브리어 연속 동작은 예언적 선언으로서 미래성을 띠므로, 한국어에서도 예언의 확정성을 살리는 미래 표현이 가장 적절합니다.
  doctrine_reference: 예언서의 예언적 미래 용법
- issue: ‘네 딸들’의 대상 이해
  chosen_reading: 도시의 종속 정착지를 가리킬 가능성을 본문에는 과도하게 풀지 않고, 직역 이미지를 유지했습니다.
  alternative_readings:
  - ‘네 부속 마을들’로 본문 풀어쓰기
  - 각주로만 의미 제시
  rationale: 원문이 의도적으로 강한 전쟁 이미지를 사용하므로, 본문에서는 문자적 표현을 유지하고 문맥적 함의는 번역본 전체 스타일에 맞는 간결한 방식으로 처리했습니다.
  doctrine_reference: 예언적 비유와 도시-딸 표현의 관용법
