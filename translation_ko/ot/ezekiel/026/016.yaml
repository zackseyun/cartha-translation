source:
  edition: WLC
  text: וְֽ/יָרְד֞וּ מֵ/עַ֣ל כִּסְאוֹתָ֗/ם כֹּ֚ל נְשִׂיאֵ֣י הַ/יָּ֔ם וְ/הֵסִ֨ירוּ֙ אֶת מְעִ֣ילֵי/הֶ֔ם וְ/אֶת בִּגְדֵ֥י רִקְמָתָ֖/ם יִפְשֹׁ֑טוּ חֲרָד֤וֹת יִלְבָּ֨שׁוּ֙ עַל הָ/אָ֣רֶץ יֵשֵׁ֔בוּ וְ/חָֽרְדוּ֙ לִ/רְגָעִ֔ים וְ/שָׁמְמ֖וּ עָלָֽיִ/ךְ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/016.yaml
  text: Then all the princes of the sea will come down from their thrones[a], remove their robes, and strip off their embroidered garments. They will clothe themselves with trembling, sit on the ground, tremble moment by moment[b], and be appalled at you.
  footnotes:
  - marker: a
    text: Or 'all the leaders of the sea.' The Hebrew phrase is literally 'all the princes of the sea,' referring to maritime rulers.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'They will wear tremblings,' a vivid image of terror as clothing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 바다의 모든 왕자들이 자기 보좌에서 내려와서 자기들의 겉옷을 벗고 수놓은 옷을 벗어 던질 것입니다. 그들은 떨림을 입고 땅에 앉아 순간마다 떨며, 당신 때문에 경악할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘바다의 모든 왕자들’입니다. 여기서 ‘바다’는 해상 권세자들을 가리키는 표현으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘떨림들을 입다’입니다. 두려움이 옷처럼 둘러지는 생생한 이미지를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ מֵעַל כִּסְאוֹתָם
  english_pob_choice: will come down from their thrones
  chosen_korean: 자기 보좌에서 내려와서
  alternatives_korean:
  - 자기들의 왕좌에서 내려와서
  - 자기 의자에서 내려와서
  lexicon: HALOT
  rationale: כִּסֵּא는 왕권을 지닌 자리이므로 ‘보좌’가 가장 자연스럽고, ‘내려와서’가 심판 장면의 굴욕적 하강을 잘 드러냅니다.
- source_word: כֹּל נְשִׂיאֵי הַיָּם
  english_pob_choice: all the princes of the sea
  chosen_korean: 바다의 모든 왕자들
  alternatives_korean:
  - 바다의 모든 통치자들
  - 바닷가의 모든 지도자들
  lexicon: HALOT
  rationale: ‘princes’의 직역성을 살리되 현대 한국어에서 위계적·정치적 뉘앙스를 유지하려고 ‘왕자들’로 옮겼습니다. כאן의 ‘바다’는 문자형을 보존하는 것이 본문의 상징성을 해치지 않습니다.
- source_word: מְעִילֵיהֶם / בִּגְדֵי רִקְמָתָם
  english_pob_choice: their robes / their embroidered garments
  chosen_korean: 자기들의 겉옷을 벗고 수놓은 옷을 벗어 던질 것입니다
  alternatives_korean:
  - 자기들의 겉옷을 벗고 수놓은 옷을 벗을 것입니다
  - 자기들의 망토를 벗고 수놓은 의복을 벗을 것입니다
  lexicon: HALOT
  rationale: מְעִיל은 겉에 걸치는 옷이므로 ‘겉옷’이 적절하고, רִקְמָה는 자수·수놓음을 가리켜 ‘수놓은 옷’이 의미를 분명히 합니다. ‘벗어 던질 것입니다’는 문맥상의 급작스러운 수치를 살립니다.
- source_word: חֲרָדוֹת יִלְבָּשׁוּ / וְחָרְדוּ לִרְגָעִים
  english_pob_choice: They will clothe themselves with trembling ... tremble moment by moment
  chosen_korean: 그들은 떨림을 입고 ... 순간마다 떨며
  alternatives_korean:
  - 그들은 떨림으로 옷 입고 ... 매 순간 떨며
  - 그들은 두려움을 입고 ... 때때로 떨며
  lexicon: HALOT
  rationale: 히브리어의 ‘떨림을 입다’라는 강한 비유를 유지하기 위해 직역에 가깝게 처리했습니다. לִרְגָעִים은 반복적·간헐적 떨림이므로 ‘순간마다’가 적합합니다.
theological_decisions:
- issue: שָׁמְמוּ עָלָיִךְ의 정서 강도
  chosen_reading: ‘당신 때문에 경악할 것입니다’로 옮겨, 단순한 놀람이 아니라 충격과 황폐 앞의 경악을 드러냈습니다.
  alternative_readings:
  - 당신 때문에 놀랄 것입니다
  - 당신을 보고 황폐해질 것입니다
  rationale: 심판 맥락에서 שׁמם는 단순한 감탄보다 파괴를 목격한 충격과 경악을 포함하므로, 문맥에 맞는 강한 정서로 표현했습니다.
  doctrine_reference: 예언서의 심판-수치 모티프
