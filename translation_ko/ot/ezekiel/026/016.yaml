  source_fidelity: 수정이 필요합니다. נְשִׂיאֵי(지도자·통치자·고관)를 ‘왕자들’로 옮기면 왕의 아들이라는 현대 한국어의 통상적 의미가 강하게 발생합니다. 또한 פשטוּ는 의복을 ‘벗다/벗어 내다’이지, 본문에 없는 ‘던지다’를 반드시 뜻하지는 않습니다. שָׁמְמוּ עָלָיִךְ는 두로를 향한 충격과 경악을 나타내므로 ‘너를 보고 경악할’로 자연스럽게 보존할 수 있습니다.
  naturalness: ‘자기 보좌/자기들의 겉옷’의 반복은 한국어에서 다소 부자연스럽고, 예언 خطاب에서 ‘당신’은 존칭으로도 읽힐 수 있습니다. ‘그들의’, ‘너’를 사용하고 각주 표지를 해당 표현 바로 뒤에 배치하면 현대 표준어 성서 문체로 더 자연스럽습니다.
  terminology: ‘보좌’, ‘겉옷’, ‘수놓은 옷’, ‘떨림을 입다’는 적절합니다. 다만 ‘바다의 모든 왕자들’은 נְשִׂיאֵי에 부정확하므로 ‘바다의 모든 지도자들’로 고치고, 문자적 대안 ‘고관들/통치자들’을 각주에서 밝혀야 합니다.
