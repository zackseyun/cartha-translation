revisions:
- from: 그러면 바다의 모든 왕자들이 자기 보좌에서 내려와서 자기들의 겉옷을 벗고 수놓은 옷을 벗어 던질 것입니다. 그들은 떨림을 입고 땅에 앉아 순간마다 떨며, 당신 때문에 경악할 것입니다.[a][b]
  to: 그때 바다의 모든 지도자들[a]이 그들의 보좌에서 내려와, 그들의 겉옷을 벗고 수놓은 옷을 벗을 것입니다. 그들은 떨림을 입고[b] 땅에 앉아 순간마다 떨며, 너를 보고 경악할 것입니다.
  rationale: נְשִׂיא를 현대 한국어에서 오해하기 쉬운 ‘왕자’ 대신 ‘지도자’로 옮겨 원문의 정치적 의미를 보존했습니다. 의복을 ‘벗어 던지다’로 과장하지 않고 ‘벗다’로 번역했으며, ‘너’를 써서 두로를 향한 예언적 직접 خطاب을 유지했습니다. 각주는 각각의 관련 표현에 바로 붙이고, 원문의 문자적 표현과 비유를 설명하도록 정리했습니다.
