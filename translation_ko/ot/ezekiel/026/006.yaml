  - severity: low
    issue: ‘칼에 맞아 죽을 것입니다’는 원문의 수단 표현을 구체적인 피격 방식으로 좁힐 수 있습니다.
    rationale: בַּחֶרֶב는 ‘칼로/칼에 의해’라는 일반적 수단 표현이며, ‘칼에 죽임을 당할 것입니다’가 니팔 수동형을 더 직접적으로 반영합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 함께 배치되어 각각의 적용 어구가 불분명합니다.
