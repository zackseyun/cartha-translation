  verdict: revise
  source_fidelity: 히브리어는 ‘그녀의 딸들’(וּבְנוֹתֶיהָ), ‘들에 있는’(אֲשֶׁר בַּשָּׂדֶה), ‘칼로 죽임을 당할 것이다’(בַּחֶרֶב תֵּהָרַגְנָה), 그리고 에스겔의 인식 공식 ‘그들이 내가 야훼인 줄 알게 될 것이다’를 말합니다. 개정문은 이 순서와 복수 주어, 수동 의미를 보존합니다.
  naturalness: ‘칼에 맞아 죽다’도 이해되지만, 원문의 일반적인 전쟁·심판 수단을 ‘맞다’라는 타격 방식으로 다소 좁힐 수 있습니다. ‘칼에 죽임을 당할 것입니다’가 수동 의미를 더 정확하고 자연스럽게 나타냅니다. 각주 표지는 해당 어구 바로 뒤에 두는 편이 독자에게 명확합니다.
  terminology: ‘야훼’는 제시된 프로젝트 방침과 일치합니다. 기존 a 각주의 ‘그의 딸들’은 여성 단수 소유접미사와 맞지 않으므로 ‘그녀의 딸들’로 바로잡아야 합니다. Tyre는 한국어 표기 ‘티레’로 통일하는 것이 적절합니다.
  issues:
