  yaml_path: translation/ot/ezekiel/026/006.yaml
  text: And her daughters who are in the field will be killed by the sword[b][a], and they will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'her daughter towns' or 'her villages'; that is, Tyre's dependent settlements.
    reason: lexical_alternative
  - marker: b
    text: Lit. 'in the field'; likely referring to settlements on the mainland or in the countryside.
    reason: cultural_note
translation:
  language: ko
  text: 들에 있는 그 딸들[a][b]은 칼에 죽임을 당할 것이며, 그들은 내가 야훼인 줄 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 딸들’은 문자적으로는 ‘그녀의 딸들’이지만, 문맥상 티레에 속한 딸 성읍들 또는 종속 정착지를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘들에 있는’입니다. 문맥상 본토나 시골의 정착지를 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנוֹתֶיהָ
  english_pob_choice: her daughters
  chosen_korean: 그 딸들은
  alternatives_korean:
  - 그의 딸들
  - 그 딸 성읍들
  - 그의 마을들
  lexicon: HALOT
  rationale: 직역의 투명성을 살리되, 예언서에서 도시와 그 종속 정착지를 가리킬 수 있는 ‘딸들’의 용법을 본문에 유지했습니다.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  english_pob_choice: who are in the field
  chosen_korean: 들에 있는
  alternatives_korean:
