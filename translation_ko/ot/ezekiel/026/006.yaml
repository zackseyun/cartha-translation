  - 칼에 의해 죽임을 당할 것입니다
  lexicon: HALOT
  rationale: 수동적 의미를 분명히 하면서 현대 한국어에서 자연스러운 전쟁·심판 표현으로 옮겼습니다.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  english_pob_choice: and they will know that I am Yahweh
  chosen_korean: 그들은 내가 야훼인 줄 알게 될 것입니다
  alternatives_korean:
  - 그들은 내가 야훼임을 알게 될 것입니다
  - 그들은 내가 여호와인 줄 알게 될 것입니다
  lexicon: HALOT
  rationale: מית의식 공식의 결과를 자연스럽게 살리면서, 하나님의 이름은 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘그 딸들’의 지시 대상
  chosen_reading: 본문은 ‘딸들’이라는 문자적 표현을 유지하되, Tyre에 속한 종속 정착지를 가리키는 뜻을 배경에 둡니다.
  alternative_readings:
  - 생물학적 딸들
  - 그 성읍들의 주민들
  rationale: 예언 문맥에서 도시-딸 비유는 흔하므로, 본문에는 원문 이미지를 보존하고 해석적 확장은 본문 밖에 두는 것이 더 투명합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 여호와/야훼의 표기
  chosen_reading: יהוה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 단락의 인식 공식은 야훼의 자기계시를 가리키며, 프로젝트의 고정된 용례에 따라 고유명을 유지했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
