  text: וּ/בְנוֹתֶ֨י/הָ֙ אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה בַּ/חֶ֖רֶב תֵּהָרַ֑גְנָה וְ/יָדְע֖וּ כִּי אֲנִ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/006.yaml
  text: And her daughters who are in the field will be killed by the sword[b][a], and they will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'her daughter towns' or 'her villages'; that is, Tyre's dependent settlements.
    reason: lexical_alternative
  - marker: b
    text: Lit. 'in the field'; likely referring to settlements on the mainland or in the countryside.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 들에 있는 그 딸들은 칼에 맞아 죽을 것이며, 그들은 내가 야훼인 줄 알게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 딸들’은 문자적으로는 ‘그의 딸들’이지만, 문맥상 Tyre에 속한 딸 성읍들/종속 정착지를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘들에 있는’입니다. 문맥상 본토나 시골의 정착지를 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנוֹתֶיהָ
  english_pob_choice: her daughters
  chosen_korean: 그 딸들은
  alternatives_korean:
  - 그의 딸들
  - 그 딸 성읍들
  - 그의 마을들
  lexicon: HALOT
  rationale: 직역의 투명성을 살리되, 예언서에서 도시와 그 종속 정착지를 가리킬 수 있는 ‘딸들’의 용법을 본문에 유지했습니다.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  english_pob_choice: who are in the field
  chosen_korean: 들에 있는
  alternatives_korean:
  - 들판에 있는
  - 시골에 있는
  - 본토에 있는
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지를 살려 ‘들/들에’로 옮기고, 본문은 간결하게 유지했습니다.
- source_word: בַּחֶרֶב תֵּהָרַגְנָה
  english_pob_choice: will be killed by the sword
  chosen_korean: 칼에 맞아 죽을 것입니다
  alternatives_korean:
  - 칼로 죽임을 당할 것입니다
  - 칼로 죽을 것입니다
  - 칼에 의해 죽임을 당할 것입니다
  lexicon: HALOT
  rationale: 수동적 의미를 분명히 하면서 현대 한국어에서 자연스러운 전쟁·심판 표현으로 옮겼습니다.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  english_pob_choice: and they will know that I am Yahweh
  chosen_korean: 그들은 내가 야훼인 줄 알게 될 것입니다
  alternatives_korean:
  - 그들은 내가 야훼임을 알게 될 것입니다
  - 그들은 내가 여호와인 줄 알게 될 것입니다
  lexicon: HALOT
  rationale: מית의식 공식의 결과를 자연스럽게 살리면서, 하나님의 이름은 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘그 딸들’의 지시 대상
  chosen_reading: 본문은 ‘딸들’이라는 문자적 표현을 유지하되, Tyre에 속한 종속 정착지를 가리키는 뜻을 배경에 둡니다.
  alternative_readings:
  - 생물학적 딸들
  - 그 성읍들의 주민들
  rationale: 예언 문맥에서 도시-딸 비유는 흔하므로, 본문에는 원문 이미지를 보존하고 해석적 확장은 본문 밖에 두는 것이 더 투명합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 여호와/야훼의 표기
  chosen_reading: יהוה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 단락의 인식 공식은 야훼의 자기계시를 가리키며, 프로젝트의 고정된 용례에 따라 고유명을 유지했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
