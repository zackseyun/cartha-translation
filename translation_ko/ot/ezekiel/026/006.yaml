  - 본토에 있는
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지를 살려 ‘들/들에’로 옮기고, 본문은 간결하게 유지했습니다.
- source_word: בַּחֶרֶב תֵּהָרַגְנָה
  english_pob_choice: will be killed by the sword
  chosen_korean: 칼에 맞아 죽을 것입니다
