translation:
  language: ko
  text: 그는 바다 한가운데서 그물 펼 자리가 될 것입니다[a]. 이는 내가 말했기 때문입니다 — 주 하나님께서 선언하십니다 — 그리고 그는 민족들에게 노략물이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그물을 널어 말리는 자리’로 번역할 수 있습니다.
