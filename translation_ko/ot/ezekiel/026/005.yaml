  - 그물 펼치는 장소
  lexicon: HALOT
  rationale: מִשְׁטַח은 ‘펴 놓는 자리/면’의 뜻이고, חֲרָמִים은 여기서 어업용 그물을 가리키므로, 이미지가 살아 있는 간결한 한국어로 옮겼습니다.
- source_word: בְּתוֹךְ הַיָּם
  english_pob_choice: in the midst of the sea
  chosen_korean: 바다 한가운데서
  alternatives_korean:
  - 바다 한복판에서
  - 바다 가운데서
  - 바다 속에
  lexicon: HALOT
  rationale: 전치사구의 공간적 중심성을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: תִּהְיֶה / וְהָיְתָה
  english_pob_choice: She will become ... and she will become
  chosen_korean: 그는 ... 될 것입니다 / 그는 ... 될 것입니다
  alternatives_korean:
  - 그것은 ... 될 것입니다
  - 그 도시는 ... 될 것입니다
  lexicon: HALOT
  rationale: 두 동사가 모두 두로를 여성 단수로 의인화한 표현이므로, 목적어 대신 인칭대명사로 반복해 예언문체의 인격화와 심판 선언의 무게를 보존했습니다.
- source_word: לְבַז לַגּוֹיִם
  english_pob_choice: plunder for the nations
  chosen_korean: 민족들에게 노략물
  alternatives_korean:
  - 나라들의 노략물
  - 열국의 노략물
  - 민족들의 먹잇감
  lexicon: HALOT
  rationale: לְבַז는 단순한 ‘재산’이 아니라 약탈 전리품이라는 뜻이므로, 한국어 성경에서 익숙하면서도 강도를 유지하는 ‘노략물’을 택했습니다.
