  - 그 도시는 ... 될 것입니다
  lexicon: HALOT
  rationale: 두 동사가 모두 두로를 여성 단수로 의인화한 표현이므로, 목적어 대신 인칭대명사로 반복해 예언문체의 인격화와 심판 선언의 무게를 보존했습니다.
- source_word: לְבַז לַגּוֹיִם
