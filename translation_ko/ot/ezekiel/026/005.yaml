  lexicon: HALOT
  rationale: לְבַז는 단순한 ‘재산’이 아니라 약탈 전리품이라는 뜻이므로, 한국어 성경에서 익숙하면서도 강도를 유지하는 ‘노략물’을 택했습니다.
