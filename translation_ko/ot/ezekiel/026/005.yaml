  - 바다 가운데서
  - 바다 속에
  lexicon: HALOT
  rationale: 전치사구의 공간적 중심성을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: תִּהְיֶה / וְהָיְתָה
  english_pob_choice: She will become ... and she will become
  chosen_korean: 그는 ... 될 것입니다 / 그는 ... 될 것입니다
  alternatives_korean:
