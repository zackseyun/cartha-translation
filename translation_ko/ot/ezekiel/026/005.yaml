  text: She will become a place for spreading nets in the midst of the sea[a], for I have spoken, declares the Lord GOD, and she will become plunder for the nations.
  footnotes:
  - marker: a
    text: Or 'a spreading place for fishing nets.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳은 바다 한가운데에서 그물을 펼쳐 놓는 곳이 될 것입니다[a]. 이는 내가 말하였기 때문입니다. 주 야훼께서 말씀하십니다. 그곳은 민족들의 노략물이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그물을 널어 말리는 곳’으로 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁטַח חֲרָמִים
  english_pob_choice: a place for spreading nets
  chosen_korean: 그물 펼 자리
  alternatives_korean:
  - 그물을 펼치는 곳
