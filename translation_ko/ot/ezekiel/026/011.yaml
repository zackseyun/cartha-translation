id: EZK.26.11
reference: Ezekiel 26:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/פַרְס֣וֹת סוּסָ֔י/ו יִרְמֹ֖ס אֶת כָּל חֽוּצוֹתָ֑יִ/ךְ עַמֵּ/ךְ֙ בַּ/חֶ֣רֶב יַהֲרֹ֔ג וּ/מַצְּב֥וֹת עֻזֵּ֖/ךְ לָ/אָ֥רֶץ תֵּרֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/011.yaml
  text: With the hoofs of his horses he will trample all your streets[a]; he will kill your people with the sword[b], and the pillars of your strength will come down to the ground.
  footnotes:
  - marker: a
    text: Or 'all your open places' or 'all your squares' for 'all your streets.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the monuments of your strength.' The Hebrew may refer to prominent pillars or standing monuments associated with Tyre's power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 말발굽으로 네 모든 거리[a]를 짓밟을 것이며, 네 백성을 칼로 죽일 것이고, 네 힘의 기둥[b]들은 땅으로 내려갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 모든 열린 곳’ 또는 ‘네 모든 광장’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 힘을 상징하는 기념물들’. 히브리어는 두로의 힘과 관련된 두드러진 기둥이나 세워진 기념물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפַרְסוֹת סוּסָיו
  english_pob_choice: With the hoofs of his horses
  chosen_korean: 그의 말발굽으로
  alternatives_korean:
  - 그의 말들의 발굽으로
  - 그의 말발굽을 가지고
  - 말발굽으로
  lexicon: HALOT
  rationale: ב plus ‘말발굽’은 도구·수단을 나타내므로 ‘으로’를 사용해 ‘짓밟다’의 수단을 자연스럽게 살렸습니다.
- source_word: כָּל חוּצוֹתָיִךְ
  english_pob_choice: all your streets
  chosen_korean: 네 모든 거리들
  alternatives_korean:
  - 네 모든 열린 곳들
  - 네 모든 광장들
  - 네 모든 거리
  lexicon: HALOT
  rationale: חוּצוֹת는 거리 또는 열린 광장을 뜻할 수 있으나, 포위·파괴 문맥에서 도시 전역이 유린되는 이미지를 살리는 기본어로 ‘거리들’을 택했습니다.
- source_word: יַהֲרֹג
  english_pob_choice: he will kill
  chosen_korean: 죽일 것이고
  alternatives_korean:
  - 죽이실 것이고
  - 살해할 것이고
  - 죽이게 할 것이고
  lexicon: HALOT
  rationale: הרג의 직접적 의미는 ‘죽이다’이므로, 과장된 문어체 ‘살해하다’보다 평이하고 직설적인 ‘죽이다’를 택했습니다.
- source_word: וּמַצְּבֹת עֻזֵּךְ
  english_pob_choice: the pillars of your strength
  chosen_korean: 네 힘의 기둥들은
  alternatives_korean:
  - 네 힘의 기둥들
  - 네 강함의 기둥들은
  - 네 힘의 돌기둥들은
  lexicon: HALOT
  rationale: מַצֵּבוֹת는 서 있는 기둥/기념물까지 포함할 수 있지만, 영어 POB의 ‘pillars’에 맞춰 과도한 해석을 피하고 ‘힘의 기둥들’로 보존했습니다.
- source_word: לָאָרֶץ תֵּרֵד
  english_pob_choice: will come down to the ground
  chosen_korean: 땅으로 내려갈 것입니다
  alternatives_korean:
  - 땅으로 내려앉을 것입니다
  - 땅에 떨어질 것입니다
  - 땅으로 쓰러질 것입니다
  lexicon: HALOT
  rationale: ירד는 문자적으로 ‘내려가다/내려오다’이므로, 붕괴 이미지를 유지하면서도 수동적 보강 없이 ‘내려가다’ 계열로 옮겼습니다.
theological_decisions:
- issue: 도시 파괴 예언의 직설성
  chosen_reading: 원문의 군사적 파괴 이미지를 완화하지 않고, ‘짓밟다/죽이다/내려가다’의 직설적 표현을 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘훼손하다’나 ‘무너뜨리다’로 바꾸는 읽기
  - 상징화하여 비유적 붕괴로만 처리하는 읽기
  rationale: 이 절은 두로에 대한 심판 선언으로서 실제적이고 가시적인 파괴를 묘사하므로, 수사적 강도를 보존하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 예언문학의 심판 선언
- issue: ‘기둥들’의 의미 범위
  chosen_reading: ‘기둥’은 문자적 건축물일 수도, 도시 권세를 상징하는 기념물일 수도 있도록 열어 두었습니다.
  alternative_readings:
  - 군사 주둔지나 요새로 특정하는 읽기
  - 우상 기둥으로 단정하는 읽기
  rationale: 히브리어 מַצְּבוֹת는 문맥상 상징적·물리적 의미가 모두 가능하므로, 본문이 허용하는 긴장을 유지하는 번역이 적절합니다.
  doctrine_reference: 본문 의미의 다의성 보존
