base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/021.yaml
  text: I will make you a terror[a], and you will be no more. Though you are sought, you will never again be found[b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'you will be sought, but you will not be found again forever.' The Hebrew sequence may be read more simply as coordinate future clauses rather than concessive.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'declares the Lord GOD' represents אֲדֹנָי יְהוִה, literally 'Lord YHWH'; English convention avoids 'Lord LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 너를 공포의 대상으로 삼으리니, 네가 더 이상 존재하지 않게 될 것입니다. 너를 찾겠지만, 너는 다시는 발견되지 않을 것입니다. 주 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘너를 찾겠지만, 너는 발견되지 않을 것이다’라는 평행 구조로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּלָּהוֹת
  english_pob_choice: a terror
  chosen_korean: 공포의 대상
  alternatives_korean:
  - 두려움
  - 전율
  - 재앙의 대상
  lexicon: HALOT
  rationale: 복수형 명사가 이 문맥에서는 추상적·집합적으로 쓰여, 두로가 사람들이 두려워하는 존재가 된다는 뜻을 자연스럽게 살리기 위해 ‘공포의 대상’으로 옮겼습니다.
- source_word: אֶתְּנֵךְ
  english_pob_choice: I will make you
  chosen_korean: 내가 너를 … 삼으리니
  alternatives_korean:
  - 내가 너를 만들 것이니
  - 내가 너를 … 되게 하리니
  lexicon: HALOT
  rationale: 동사 נתן은 כאן에서 단순히 ‘주다’가 아니라 술어명사를 취해 ‘~로 만들다/삼다’의 관용법이므로, 의미를 분명히 하는 ‘삼다’를 택했습니다.
- source_word: וְאֵינֵךְ
  english_pob_choice: and you will be no more
  chosen_korean: 네가 더 이상 존재하지 않게 될 것입니다
  alternatives_korean:
  - 네가 더 이상 없게 될 것입니다
  - 네가 존재하지 않게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 부정 서술절이 단순한 ‘없음’보다 존재 소멸을 강하게 말하므로, 한국어에서도 존재의 종결을 분명히 드러냈습니다.
- source_word: וּתְבֻקְשִׁי וְלֹא תִמָּצְאִי
  english_pob_choice: Though you are sought, you will never again be found
  chosen_korean: 너를 찾겠지만, 너는 다시는 발견되지 않을 것입니다
  alternatives_korean:
  - 찾아도 너는 다시 발견되지 않을 것입니다
  - 사람들이 너를 찾아도 너는 발견되지 않을 것입니다
  lexicon: HALOT
  rationale: 수동형의 ‘찾다/발견되다’ 관계를 보존하되, 한국어에서는 양보절보다 병렬된 미래 진술이 더 자연스러워 POB의 최종 개정에 맞추어 옮겼습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 야훼의 말씀입니다
  alternatives_korean:
  - 주 하나님 야훼의 말씀입니다
  - 주 여호와의 말씀입니다
  lexicon: HALOT
  rationale: נאם의 예언적 공식을 ‘말씀입니다’로 처리하고, יְהוִה는 본 프로젝트 기본어인 ‘야훼’로 옮겨 언약 სახელ을 드러냈습니다.
theological_decisions:
- issue: 아ֲדֹנָי יְהוִה의 이중 칭호 처리
  chosen_reading: ‘주 야훼’로 옮겨 두 칭호를 함께 보존했습니다.
  alternative_readings:
  - ‘주 하나님’으로 완화
  - ‘주 여호와’로 전통화
  rationale: 아도나이와 테트라그람마톤이 함께 있는 구조를 지우지 않기 위해, 예언 공식 안에서 두 칭호의 긴장을 그대로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
