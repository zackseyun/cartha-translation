  text: מִ/שִּׁפְעַ֥ת סוּסָ֖י/ו יְכַסֵּ֣/ךְ אֲבָקָ֑/ם מִ/קּוֹל֩ פָּרַ֨שׁ וְ/גַלְגַּ֜ל וָ/רֶ֗כֶב תִּרְעַ֨שְׁנָה֙ חֽוֹמוֹתַ֔יִ/ךְ בְּ/בֹא/וֹ֙ בִּ/שְׁעָרַ֔יִ/ךְ כִּ/מְבוֹאֵ֖י עִ֥יר מְבֻקָּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/010.yaml
  text: From the abundance of his horses their dust will cover you[a]; at the sound of horsemen and wheel and chariot your walls will quake when he enters your gates[b], as one enters a city that has been breached.
  footnotes:
  - marker: a
    text: Or, 'at the noise of cavalry, wheels, and chariots.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'as the entrances of a city breached'; the sense is entry like that into a city whose defenses have been broken open.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 말들의 많음으로 그들의 먼지가 너를 덮을 것이며[a], 기병과 수레와 전차의 소리에 네 성벽이 흔들릴 것이니, 그가 네 성문으로 들어올 때[b], 마치 무너진 성읍의 들어감같이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기병대와 수레와 전차의 소리에’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘무너진 성읍의 들어감들’에 가깝습니다. 뜻은 방어가 무너진 성읍으로 들어가는 것과 같습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשִּׁפְעַת סוּסָיו
  english_pob_choice: From the abundance of his horses
  chosen_korean: 그의 말들의 많음으로
  alternatives_korean:
  - 그의 말들의 풍성함으로
  - 그의 말이 매우 많으므로
  lexicon: HALOT
  rationale: שִׁפְעָה는 ‘많음/풍성함’의 뉘앙스를 가지므로, 먼지를 일으키는 원인을 자연스럽게 드러내는 ‘많음으로’를 택했습니다.
- source_word: יְכַסֵּךְ אֲבָקָם
  english_pob_choice: their dust will cover you
  chosen_korean: 그들의 먼지가 너를 덮을 것이며
  alternatives_korean:
  - 그들의 먼지가 너를 뒤덮을 것이며
  - 그들의 티끌이 너를 덮을 것이며
  lexicon: HALOT
  rationale: אֲבָקָם은 말들이 일으키는 먼지이므로 ‘먼지’로 옮겨 생생한 전투 장면을 유지했습니다.
- source_word: פָּרַשׁ וְגַלְגַּל וָרֶכֶב
  english_pob_choice: horsemen and wheel and chariot
  chosen_korean: 기병과 수레와 전차
  alternatives_korean:
  - 말탄 자와 바퀴와 전차
  - 기병과 바퀴와 병거
  lexicon: HALOT
  rationale: 소리의 목록으로서 פָּרַשׁ, גַּלְגַּל, רֶכֶב을 한국어에서 군사적 이동수단의 연속으로 자연스럽게 재현했습니다.
- source_word: תִּרְעַשְׁנָה חוֹמוֹתַיִךְ
  english_pob_choice: your walls will quake
  chosen_korean: 네 성벽이 흔들릴 것이니
  alternatives_korean:
  - 네 성벽이 떨릴 것이니
  - 네 성벽이 진동할 것이니
  lexicon: HALOT
  rationale: רעשׁ은 강한 흔들림을 뜻하므로 ‘흔들리다’로 옮겨 성벽이 전투 충격에 반응하는 모습을 살렸습니다.
- source_word: כִּמְבוֹאֵי עִיר מְבֻקָּעָה
  english_pob_choice: as one enters a city that has been breached
  chosen_korean: 마치 무너진 성읍의 들어감같이
  alternatives_korean:
  - 마치 함락된 성읍에 들어가는 것같이
  - 마치 갈라진 성읍의 प्रवेश같이
  lexicon: HALOT
  rationale: מְבוֹאֵי는 ‘들어감/들어가는 곳들’의 문법적 긴장이 있어, POB의 의미를 따라 ‘무너진 성읍의 들어감’으로 압축해 시적 비교를 살렸습니다.
theological_decisions:
- issue: 무너진 성읍에 들어가는 비유의 처리
  chosen_reading: 직역적 어감을 유지하되 한국어에서는 ‘마치 무너진 성읍의 들어감같이’로 비교구문을 살렸습니다.
  alternative_readings:
  - 마치 함락된 성읍으로 들어가듯이
  - 마치 무너진 성읍으로 들어가는 것처럼
  rationale: 히브리어의 압축된 비교 표현을 너무 풀어 쓰지 않으면서도 현대 한국어에서 이해 가능하도록 균형을 잡았습니다.
  doctrine_reference: 시적/예언적 수사 보존
