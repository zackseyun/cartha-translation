  text: From the abundance of his horses their dust will cover you[a]; at the sound of horsemen and wheel and chariot your walls will quake when he enters your gates[b], as one enters a city that has been breached.
  footnotes:
  - marker: a
    text: Or, 'at the noise of cavalry, wheels, and chariots.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'as the entrances of a city breached'; the sense is entry like that into a city whose defenses have been broken open.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 수많은 말들이 일으킨 먼지가 너를 덮을 것이며, 기병들과 바퀴와 전차의 소리에[a] 네 성벽이 흔들릴 것입니다. 그가 네 성문으로 들어올 때, 마치 성벽이 뚫린 성읍에 들어가듯이 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기병과 바퀴와 전차의 소리에’라고 할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘성벽이 뚫린 성읍의 들어감들’에 가깝습니다. 방어가 뚫린 성읍에 들어가는 방식이라는 뜻입니다.
    reason: lexical_alternative
