  text: וְ/שָׁלְל֣וּ חֵילֵ֗/ךְ וּ/בָֽזְזוּ֙ רְכֻלָּתֵ֔/ךְ וְ/הָֽרְסוּ֙ חוֹמוֹתַ֔יִ/ךְ וּ/בָתֵּ֥י חֶמְדָּתֵ֖/ךְ יִתֹּ֑צוּ וַ/אֲבָנַ֤יִ/ךְ וְ/עֵצַ֨יִ/ךְ֙ וַֽ/עֲפָרֵ֔/ךְ בְּ/ת֥וֹךְ מַ֖יִם יָשִֽׂימוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/012.yaml
  text: They will plunder your wealth and loot your merchandise. They will tear down your walls and demolish your splendid houses. They will throw your stones[a], your timbers, and your dust into the midst of the waters.
  footnotes:
  - marker: a
    text: Or 'your dust.' The Hebrew word can mean 'dust,' 'earth,' or, in this context, the debris of a demolished city.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 당신의 재물을 약탈하고 당신의 상품을 빼앗을 것입니다. 그들은 당신의 성벽을 헐고 당신의 화려한 집들을 무너뜨릴 것입니다. 그들은 당신의 돌과 당신의 목재와 당신의 흙[a]을 물 가운데에 던질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먼지’. 히브리어는 ‘흙’을 뜻하며, 이 문맥에서는 무너진 도시의 잔해를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלְלוּ
  english_pob_choice: will plunder
  chosen_korean: 약탈하고
  alternatives_korean:
  - 노략하고
  - 탈취하고
  lexicon: HALOT
  rationale: 전쟁 맥락의 שׁלל은 전리품을 빼앗는 의미이므로, 현대 한국어에서 군사적·경제적 강도를 함께 살리는 ‘약탈하다’가 가장 자연스럽습니다.
- source_word: חֵילֵךְ / רְכֻלָּתֵךְ
  english_pob_choice: your wealth / your merchandise
  chosen_korean: 당신의 재물 / 당신의 상업품
  alternatives_korean:
  - 당신의 부 / 당신의 상품
  - 당신의 자산 / 당신의 물품
  lexicon: HALOT
  rationale: חיל은 문맥상 ‘군대/힘’보다 경제적 자산을 가리키므로 ‘재물’로 옮기고, רכולה는 상업용 상품을 뜻하므로 ‘상업품’으로 구체화했습니다.
- source_word: בָתֵּי חֶמְדָּתֵךְ
  english_pob_choice: your splendid houses
  chosen_korean: 당신의 화려한 집들
  alternatives_korean:
  - 당신의 아름다운 집들
  - 당신의 귀한 집들
  - 당신의 호화로운 집들
  lexicon: HALOT
  rationale: 직역하면 ‘사랑스러운/기쁜 집들’이지만, 무너뜨려질 고급 주거를 가리키는 문맥이므로 현대적이고 과장되지 않은 ‘화려한 집들’이 적절합니다.
- source_word: עֲפָרֵךְ
  english_pob_choice: your dust
  chosen_korean: 당신의 먼지
  alternatives_korean:
  - 당신의 흙
  - 당신의 잔해
  - 당신의 파편
  lexicon: HALOT
  rationale: עפר는 ‘먼지/흙/토’가 가능하지만, 돌·목재와 함께 물속으로 던져지는 파괴 잔재를 가리키는 문맥을 살려 ‘먼지’로 두었습니다.
- source_word: וַאֲבָנַיִךְ וְעֵצַיִךְ
  english_pob_choice: your stones, your timbers
  chosen_korean: 당신의 돌, 당신의 목재
  alternatives_korean:
  - 당신의 돌들, 당신의 들보
  - 당신의 석재, 당신의 목재
  lexicon: HALOT
  rationale: 문맥상 건축 자재가 무너진 뒤의 잔해이므로, האבן과 עץ를 그대로 살리되 현대 독자가 이해하기 쉬운 기본어인 ‘돌’과 ‘목재’로 옮겼습니다.
theological_decisions:
- issue: 파괴 예언의 동사 강도
  chosen_reading: ‘헐고… 무너뜨릴 것입니다… 던질 것입니다’처럼 연속된 강한 동작으로 재현했습니다.
  alternative_readings:
  - ‘부수고… 없앨 것입니다’
  - ‘무너뜨리고… 던져버릴 것입니다’
  rationale: 히브리어는 도시의 완전한 파괴와 모욕적 처분을 연속 동사로 누적하므로, 이를 약화시키지 않고 한국어에서도 파괴의 단계성을 유지했습니다.
  doctrine_reference: 예언서의 심판 선언 표현 보존
