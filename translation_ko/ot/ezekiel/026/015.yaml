source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר אֲדֹנָ֥/י יְהוִ֖ה לְ/צ֑וֹר הֲ/לֹ֣א מִ/קּ֣וֹל מַפַּלְתֵּ֗/ךְ בֶּ/אֱנֹ֨ק חָלָ֜ל בֵּ/הָ֤רֵֽג הֶ֨רֶג֙ בְּ/תוֹכֵ֔/ךְ יִרְעֲשׁ֖וּ הָ/אִיִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/015.yaml
  text: 'Thus says the Lord GOD to Tyre: Will not the coastlands quake at the sound of your fall[a], when the wounded groan[b], when the slaughter is carried out in your midst?'
  footnotes:
  - marker: a
    text: Or 'the islands.' The Hebrew term can denote islands or, more broadly, coastlands/maritime regions.
    reason: lexical_alternative
  - marker: b
    text: '''The wounded'' could also be rendered ''the slain''; the Hebrew word can refer to one pierced or fatally wounded. Here ''the wounded'' fits the accompanying groaning.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주 하나님께서 두로에 이렇게 말씀하십니다. “네가 무너지는 소리로 인해 해안 지역들이 떨지 않겠느냐? 부상자들이 신음할 때, 너의 한가운데서 살육이 행해질 때 말이다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘섬들’. 히브리어는 섬들뿐 아니라 더 넓게 해안 지역이나 해상권을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부상자들’은 ‘죽임을 당한 자들’로도 옮길 수 있습니다. 여기서는 신음과의 결합을 고려해 ‘부상자들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  lexicon: HALOT
  rationale: 아도나이와 여호와가 결합한 직함은 한국어에서 ‘주 하나님’이 자연스럽고, ‘주 여호와’는 중복감이 크며 ‘주 야훼’는 본 구의 관용적 호칭 기능을 덜 살립니다.
- source_word: לְצוֹר
  english_pob_choice: to Tyre
  chosen_korean: 두로에
  alternatives_korean:
  - 티레에
  lexicon: HALOT
  rationale: 성서 지명으로 널리 정착된 ‘두로’를 사용해 독자 인지성을 유지했습니다.
- source_word: מַפַּלְתֵּךְ
  english_pob_choice: your fall
  chosen_korean: 네가 무너지는 소리
  alternatives_korean:
  - 네 몰락
  - 네 سقوط
  lexicon: HALOT
  rationale: 직역의 ‘너의 سقوط/떨어짐’보다, 앞의 ‘소리’와 결합된 충격음을 드러내는 표현이 문맥상 더 자연스럽습니다.
- source_word: הָאִיִּים
  english_pob_choice: the coastlands
  chosen_korean: 해안 지역들
  alternatives_korean:
  - 섬들
  - 해안 지방들
  lexicon: HALOT
  rationale: 예언서에서 אִיִּים은 단순한 섬보다 해상권 전반을 가리킬 수 있어, POB의 ‘coastlands’를 살린 ‘해안 지역들’이 가장 근접합니다.
theological_decisions:
- issue: 두로에 대한 심판 선포의 수사 구조
  chosen_reading: 반문형으로 두로의 멸망이 해상 세계에 미칠 충격을 강조했습니다.
  alternative_readings:
  - 단정문으로 바꿔 ‘해안 지역들이 떨 것입니다’라고 할 수 있음
  rationale: 히브리어 הֲלֹא는 기대형 반문이므로, 반문을 유지해야 예언적 경고의 압박과 확실성이 살아납니다.
  doctrine_reference: Ezekiel prophetic judgment rhetoric
