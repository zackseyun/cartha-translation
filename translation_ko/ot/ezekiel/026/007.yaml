revisions:
- from: 이는 주 하나님께서 말씀하십니다. 보십시오, 내가 바벨론 왕 느부갓네살을 북쪽에서 두로에게로 데려오겠습니다. 그는 왕들 중의 왕이며, 말과 전차와 기병과 함께, 큰 회중과 많은 백성을 거느리고 올 것입니다.[a]
  to: 이는 주 야훼께서 이렇게 말씀하십니다. 보십시오, 내가 북쪽에서 바벨론 왕 느부갓네살[a], 곧 왕들의 왕을 말과 전차와 기병과 큰 무리와 많은 백성과 함께 두로를 치러 데려오겠습니다.
  rationale: 예언자적 선언 형식과 הִנְנִי+분사의 임박하고 확정적인 미래 선언을 보존했습니다. 느부갓네살, ‘왕들의 왕’, 그리고 군사력 열거를 모두 ‘데려오겠습니다’에 연결하여 원문의 통사 구조를 더 가깝게 반영했으며, ‘두로를 치러’로 심판 군사의 적대적 목적을 명시했습니다. 신명은 제공된 감사 자료의 현행 결정을 따라 ‘주 야훼’로 통일했습니다.
  reviewer_model: gpt-5.6-terra
