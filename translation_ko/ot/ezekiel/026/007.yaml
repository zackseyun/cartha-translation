source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֧י מֵבִ֣יא אֶל צֹ֗ר נְבוּכַדְרֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל מִ/צָּפ֖וֹן מֶ֣לֶךְ מְלָכִ֑ים בְּ/ס֛וּס וּ/בְ/רֶ֥כֶב וּ/בְ/פָרָשִׁ֖ים וְ/קָהָ֥ל וְ/עַם רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/007.yaml
  text: 'For thus says the Lord GOD: Behold[a], I am bringing against Tyre Nebuchadnezzar king of Babylon from the north, king of kings, with horses and chariots and horsemen, and an assembly and a numerous people.'
  footnotes:
  - marker: a
    text: Hebrew spelling here corresponds more closely to 'Nebuchadrezzar'; English tradition commonly uses 'Nebuchadnezzar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 주 하나님께서 말씀하십니다. 보십시오, 내가 바벨론 왕 느부갓네살을 북쪽에서 두로에게로 데려오겠습니다. 그는 왕들 중의 왕이며, 말과 전차와 기병과 함께, 큰 회중과 많은 백성을 거느리고 올 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 철자는 ‘느부갓레살’에 더 가깝지만, 한국어 전통 표기는 ‘느부갓네살’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  english_pob_choice: For thus says
  chosen_korean: 이는 …께서 말씀하십니다
  alternatives_korean:
  - 이는 …께서 이렇게 말씀하십니다
  - 주 하나님께서 이와 같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전령 공식의 연결을 살리되, 한국어에서는 서두의 ‘이는’과 본동사 ‘말씀하십니다’가 가장 자연스럽습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 하나님 야훼
  lexicon: HALOT
  rationale: 합쇼체 본문에서는 ‘주 하나님’이 אֲדֹנָי와 יְהוִה의 결합을 자연스럽게 드러내며, 구별을 흐리지 않습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  lexicon: HALOT
  rationale: 하나님의 엄숙한 자기 선언을 현대 한국어의 직접 명령형으로 살리되, 문어체 격식을 유지했습니다.
- source_word: מֵבִיא אֶל
  english_pob_choice: I am bringing against
  chosen_korean: 데려오겠습니다 …에게로
  alternatives_korean:
  - 대적하게 하겠습니다 …에게
  - 가져오겠습니다 …에게로
  lexicon: HALOT
  rationale: 전쟁 심판 문맥의 ‘에ֶל’을 단순한 이동이 아니라 목표 지향적 도착으로 받아들여, 한국어에서는 ‘에게로’로 방향성을 살렸습니다.
- source_word: מֶלֶךְ מְלָכִים
  english_pob_choice: a king of kings
  chosen_korean: 왕들 중의 왕
  alternatives_korean:
  - 왕 중의 왕
  - 왕들 위의 왕
  lexicon: HALOT
  rationale: 관사 없는 히브리어의 병렬적 칭호를 그대로 살리면서, 과도한 절대적 칭호로 굳어지지 않도록 ‘중의’로 옮겼습니다.
- source_word: בְּסוּס וּבְרֶכֶב וּבְפָרָשִׁים
  english_pob_choice: with horses and chariots and horsemen
  chosen_korean: 말과 전차와 기병과 함께
  alternatives_korean:
  - 말과 병거와 기병과 함께
  - 기마와 전차와 기병과 함께
  lexicon: HALOT
  rationale: 군사 장비와 병력을 한국어의 표준적 전쟁 어휘로 옮겼고, 세 항목의 병렬을 유지했습니다.
- source_word: וְקָהָל וְעַם רָב
  english_pob_choice: and an assembly and a numerous people
  chosen_korean: 큰 회중과 많은 백성
  alternatives_korean:
  - 큰 모임과 많은 백성
  - 큰 집회와 많은 사람들
  lexicon: HALOT
  rationale: קָהָל은 단순한 ‘군대’보다 넓은 ‘회중/모임’의 뜻이 있어, 여기서는 군사 동원된 집합체의 뉘앙스를 살린 ‘회중’을 택했습니다.
theological_decisions:
- issue: יְהוִה의 한국어 표기
  chosen_reading: 주 하나님
  alternative_readings:
  - 야훼 하나님
  - 주 야훼
  rationale: 본절은 אֲדֹנָי와 결합된 주권 호칭이므로, 본문 가독성과 예언자적 구어성을 고려해 합쇼체에서는 ‘주 하나님’으로 처리했습니다.
  doctrine_reference: 'POB Korean glossary: יְהוָה / YHWH default and compound-title usage'
- issue: 군사 심판 예언의 동사 시제
  chosen_reading: 데려오겠습니다
  alternative_readings:
  - 데려옵니다
  - 데려올 것입니다
  rationale: 히브리어 분사 הִנְנִי + מֵבִיא는 임박한 선언적 행위를 나타내므로, 한국어에서는 미래형 선언으로 옮겨 심판의 확정성을 드러냈습니다.
  doctrine_reference: Hebrew participial prophetic announcement
