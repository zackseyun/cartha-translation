translation:
  language: ko
  text: 이는 주 야훼께서 이렇게 말씀하십니다. 보십시오, 내가 북쪽에서 바벨론 왕 느부갓네살[a], 곧 왕들의 왕을 말과 전차와 기병과 큰 무리와 많은 백성과 함께 두로를 치러 데려오겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 철자는 ‘느부갓레살’에 더 가깝지만, 한국어 전통 표기는 ‘느부갓네살’입니다.
    reason: lexical_alternative
