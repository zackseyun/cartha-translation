    rationale: ‘사람이 거주하지 못하게’는 가능의 부정으로 읽힐 수 있습니다. 도시를 향한 문맥에서는 ‘다시는 사람이 살지 않게’가 자연스럽고 의미상 적절합니다.
  - severity: low
