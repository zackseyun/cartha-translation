theological_decisions:
- issue: 마지막 절의 대조 구조(심판의 깊이 vs 생명의 땅)
  chosen_reading: 심판받는 도성은 아래로 내려가지만, 하나님은 생명의 땅에 ‘아름다움’을 두십니다.
