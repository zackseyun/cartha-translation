id: EZK.26.20
reference: Ezekiel 26:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הוֹרַדְתִּי/ךְ֩ אֶת י֨וֹרְדֵי ב֜וֹר אֶל עַ֣ם עוֹלָ֗ם וְ֠/הוֹשַׁבְתִּי/ךְ בְּ/אֶ֨רֶץ תַּחְתִּיּ֜וֹת כָּ/חֳרָב֤וֹת מֵֽ/עוֹלָם֙ אֶת י֣וֹרְדֵי ב֔וֹר לְמַ֖עַן לֹ֣א תֵשֵׁ֑בִי וְ/נָתַתִּ֥י צְבִ֖י בְּ/אֶ֥רֶץ חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/020.yaml
  text: Then I will bring you down with those who go down to the pit[a], to the people of long ago; and I will make you dwell in the land below, like ruins from ancient times, with those who go down to the pit, so that you will not be inhabited[c][b]. But I will set beauty in the land of the living.
  footnotes:
  - marker: a
    text: Or 'the people of old' or 'the ancient people.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the lower earth' or 'in the lowest regions.'
    reason: lexical_alternative
  - marker: c
    text: Or 'glory' or 'splendor' in the land of the living.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 너를 구덩이로 내려가는 자들과, 옛 사람들과 함께 내려가게 하겠습니다. 또 내가 너를 낮은 땅, 곧 옛날의 황폐한 곳들 가운데 거하게 하여, 너가 더 이상 사람이 거주하지 못하게 하겠습니다. 나는 생명의 땅에 아름다움을 두겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옛 사람들’이나 ‘태고의 사람들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘낮은 땅’이나 ‘가장 낮은 지역들’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘영광’이나 ‘찬란함’ — ‘생명의 땅’에 두시는 것.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַדְתִּיךְ
  english_pob_choice: Then I will bring you down
  chosen_korean: 내가 너를 내려가게 하겠습니다
  alternatives_korean:
  - 내가 너를 끌어내리겠습니다
  - 내가 너를 떨어뜨리겠습니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살리되, 심판 맥락에서 과도하게 물리적 폭력을 덧씌우지 않도록 자연스러운 사역 표현을 택했습니다.
- source_word: יֹרְדֵי בוֹר
  english_pob_choice: those who go down to the pit
  chosen_korean: 구덩이로 내려가는 자들
  alternatives_korean:
  - 무덤으로 내려가는 자들
  - 구덩이로 내려가는 사람들
  lexicon: HALOT
  rationale: ‘בוֹר’의 구체적 이미지와 음부/무덤의 이중적 여운을 살리기 위해 ‘구덩이’를 유지했습니다.
- source_word: עַם עוֹלָם
  english_pob_choice: the people of long ago
  chosen_korean: 옛 사람들
  alternatives_korean:
  - 오래전의 백성들
  - 옛날 사람들
  - 태고의 사람들
  lexicon: HALOT
  rationale: 여기서 עוֹלָם은 영원성이 아니라 먼 과거를 가리키므로, 장례적·고풍스러운 뉘앙스를 살리는 ‘옛 사람들’로 옮겼습니다.
- source_word: בְּאֶרֶץ תַּחְתִּיּוֹת כָּחֳרָבוֹת מֵעוֹלָם
  english_pob_choice: in the land below, like ruins from ancient times
  chosen_korean: 낮은 땅, 곧 옛날의 황폐한 곳들
  alternatives_korean:
  - 지하 땅, 곧 옛 폐허들
  - 아래 땅, 곧 옛적의 황폐
  lexicon: HALOT
  rationale: 직역하면 ‘낮은 지역들의 땅’에 가깝기 때문에 ‘낮은 땅’으로 살리고, 이어지는 비교구는 ‘황폐한 곳들’로 옮겨 반복되는 폐허 이미지를 유지했습니다.
- source_word: תֵשֵׁבִי
  english_pob_choice: you will not be inhabited
  chosen_korean: 사람이 거주하지 못하게
  alternatives_korean:
  - 네가 거주하지 못하게
  - 네가 사람이 살지 못하게
  lexicon: HALOT
  rationale: 도시를 향한 표현이므로 한국어에서는 수동적 결과를 분명히 하는 ‘사람이 거주하지 못하게’가 가장 자연스럽습니다.
- source_word: צְבִי
  english_pob_choice: beauty
  chosen_korean: 아름다움
  alternatives_korean:
  - 영광
  - 아름다운 것
  - 찬란함
  lexicon: HALOT
  rationale: 영어 POB의 결정처럼 의미를 과도하게 특정하지 않고, ‘아름다움’으로 넓은 의미 범위를 보존했습니다.
theological_decisions:
- issue: 마지막 절의 대조 구조(심판의 깊이 vs 생명의 땅)
  chosen_reading: 심판받는 도성은 아래로 내려가지만, 하나님은 생명의 땅에 ‘아름다움’을 두십니다.
  alternative_readings:
  - 영광을 두십니다
  - 회복의 아름다움을 두십니다
  rationale: 히브리어 צְבִי의 의미 폭을 확정하지 않고, 본문의 날카로운 대조를 그대로 드러내는 쪽을 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
