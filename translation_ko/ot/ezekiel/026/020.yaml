    text: Or 'the people of old' or 'the ancient people.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the lower earth' or 'in the lowest regions.'
    reason: lexical_alternative
  - marker: c
    text: Or 'glory' or 'splendor' in the land of the living.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 너를 구덩이로 내려가는 자들과 함께 오래전의 사람들에게로[a] 내려가게 하겠습니다. 내가 너를 낮은 땅에[b], 옛적부터 황폐한 곳들처럼, 구덩이로 내려가는 자들과 함께 머물게 하여, 네가 다시는 사람이 살지 않게 하겠습니다. 그러나 내가 생명의 땅에 아름다움을[c] 두겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옛 사람들에게로’ 또는 ‘태고의 사람들에게로’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아래 땅에’ 또는 ‘가장 낮은 지역들의 땅에’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘영광’ 또는 ‘찬란함’.
    reason: lexical_alternative
