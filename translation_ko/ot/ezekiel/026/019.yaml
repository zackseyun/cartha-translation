    text: 또는 ‘내가 깊은 물을 너 위로 솟아오르게 할 때에’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 물들’은 ‘많은 물들’로도 옮길 수 있습니다.
    reason: lexical_alternative
