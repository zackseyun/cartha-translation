source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה בְּ/תִתִּ֤/י אֹתָ/ךְ֙ עִ֣יר נֶחֱרֶ֔בֶת כֶּ/עָרִ֖ים אֲשֶׁ֣ר לֹֽא נוֹשָׁ֑בוּ בְּ/הַעֲל֤וֹת עָלַ֨יִ/ךְ֙ אֶת תְּה֔וֹם וְ/כִסּ֖וּ/ךְ הַ/מַּ֥יִם הָ/רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/019.yaml
  text: 'For thus says the Lord GOD: When I make you a ruined city[a], like the cities that are not inhabited, when I bring up the deep over you and the great waters cover you[b],'
  footnotes:
  - marker: a
    text: Or 'when I cause the deep to rise over you.'
    reason: lexical_alternative
  - marker: b
    text: '''The many waters'' may also be rendered ''great waters.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 주 하나님께서 말씀하십니다. 내가 너를 무너진 성읍으로, 사람이 살지 않는 성읍들과 같이 만들 때에, 내가 깊음을 너 위로 끌어올리고 큰 물들이 너를 덮을 때에,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 깊음을 너 위로 솟아오르게 할 때에’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 물들’은 ‘많은 물들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 하나님
  lexicon: HALOT
  rationale: 합쇼체 예언문 맥락에서 אֲדֹנָי יְהוִה의 이중 호칭을 자연스럽게 살리되, 본문에 ‘주 하나님’으로 두어 대조적 호칭 구조와 위엄을 유지했습니다.
- source_word: בְּתִתִּי
  english_pob_choice: When I make
  chosen_korean: 내가 … 만들 때에
  alternatives_korean:
  - 내가 … 되게 할 때에
  - 내가 … 만들 때에
  lexicon: HALOT
  rationale: נתן의 관용적 용법이 결과 상태를 ‘만들다’로 나타내므로, ‘무너진 성읍으로 만들 때에’로 옮겨 원문의 인과적 뉘앙스를 살렸습니다.
- source_word: עִיר נֶחֱרֶבֶת
  english_pob_choice: a ruined city
  chosen_korean: 무너진 성읍
  alternatives_korean:
  - 폐허가 된 성읍
  - 황폐한 성읍
  lexicon: HALOT
  rationale: נחרב의 파괴·폐허 상태를 현대 한국어에서 가장 직접적으로 드러내는 표현으로 ‘무너진 성읍’을 선택했습니다.
- source_word: תְּהוֹם
  english_pob_choice: the deep
  chosen_korean: 깊음
  alternatives_korean:
  - 깊은 곳
  - 심연
  lexicon: HALOT
  rationale: תְּהוֹם의 원초적 물의 깊이를 과도하게 신학화하지 않고, 한국어 성경문체에서 가능한 ‘깊음’으로 간결하게 옮겼습니다.
- source_word: הַמַּיִם הָרַבִּים
  english_pob_choice: the great waters
  chosen_korean: 큰 물들
  alternatives_korean:
  - 많은 물들
  - 큰 물들
  lexicon: HALOT
  rationale: רַבִּים은 물과 결합할 때 ‘많은’보다 ‘큰/거센’의 의미도 포함할 수 있어, POB의 의도를 따라 ‘큰 물들’로 옮겨 재앙적 규모를 드러냈습니다.
theological_decisions:
- issue: 예언적 인용의 문체와 화자 표지
  chosen_reading: 이는 주 하나님께서 말씀하십니다.
  alternative_readings:
  - 주 하나님이 이렇게 말씀하십니다.
  - 이는 주 하나님께서 말씀하십니다.
  rationale: 예언 서문의 공식성을 살리면서도 현대 합쇼체로 자연스럽게 읽히도록 ‘이는 … 말씀하십니다’ 구성을 택했습니다.
  doctrine_reference: Ezekiel prophetic oracle register
- issue: ‘깊음’과 ‘큰 물들’의 재난 이미지
  chosen_reading: 물 심판의 이미지로 직역에 가깝게 유지
  alternative_readings:
  - 비유적으로 완화하여 번역
  - 설명적으로 풀어쓰기
  rationale: 원문은 바다/혼돈의 심연과 범람의 이미지를 결합하므로, 해석을 덧붙여 약화시키지 않고 심판의 위력을 그대로 전달했습니다.
  doctrine_reference: Ezekiel 26 judgment imagery
