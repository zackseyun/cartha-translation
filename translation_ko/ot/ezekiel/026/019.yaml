  text: 주 야훼께서 이렇게 말씀하십니다. 내가 너를 무너진 성읍으로, 사람이 살지 않는 성읍들과 같이 만들 때에, 내가 깊은 물을 너 위로 끌어올리고[a] 큰 물들이 너를 덮을 때에,[b]
