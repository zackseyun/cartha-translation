  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּ֛ה נָתַ֥תִּי עָלֶ֖י/ךָ עֲבוֹתִ֑ים וְ/לֹֽא תֵהָפֵ֤ךְ מִֽ/צִּדְּ/ךָ֙ אֶל צִדֶּ֔/ךָ עַד כַּלּוֹתְ/ךָ֖ יְמֵ֥י מְצוּרֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/008.yaml
  text: And behold[a], I have put ropes on you[b], and you will not turn yourself from your side to your other side until you have completed the days of your siege.
  footnotes:
  - marker: a
    text: Or 'cords' or 'bands.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'from your side to your side.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 당신 위에 줄을 두었습니다[b]. 그래서 당신은 당신의 옆구리에서 다른 옆구리로 돌아눕지 못한 채, 당신의 포위 기간의 날들을 마칠 때까지 있게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보라’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 옆구리에서 당신의 옆구리로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보십시오
  - 보라
  lexicon: HALOT
  rationale: 주의를 환기하는 감탄사로서 예언적 장면 전환의 힘을 살리되, 현대 한국어에서는 ‘보십시오’가 가장 자연스럽고 공손한 직설형입니다.
- source_word: עֲבוֹתִים
  english_pob_choice: ropes
  chosen_korean: 줄
  alternatives_korean:
  - 밧줄
  - 끈
  - 줄
  lexicon: HALOT
  rationale: 묶는 도구라는 기능을 드러내면서도 지나치게 구체화하지 않기 위해 ‘줄’로 옮겼습니다. POB의 ‘ropes’가 지닌 직접성을 유지합니다.
- source_word: וְלֹא תֵהָפֵךְ
  english_pob_choice: and you will not turn yourself
  chosen_korean: 돌아눕지 못한 채
  alternatives_korean:
  - 뒤집히지 못한 채
  - 몸을 돌리지 못한 채
  - 돌아눕지 못한 채
  lexicon: HALOT
  rationale: 문맥상 실제 몸의 방향 전환을 가리키므로, 한국어에서는 ‘돌아눕다’가 가장 자연스럽게 제한된 움직임을 전달합니다. ‘못한 채’는 밧줄에 의해 불가능해진 상태를 살립니다.
- source_word: מִצִּדְּךָ אֶל צִדֶּךָ
  english_pob_choice: from your side to your other side
  chosen_korean: 당신의 옆구리에서 다른 옆구리로
  alternatives_korean:
  - 당신의 옆에서 다른 옆으로
  - 당신의 한쪽에서 다른 쪽으로
  - 당신의 옆구리에서 다른 옆구리로
  lexicon: HALOT
  rationale: 히브리어의 ‘옆/측면’ 반복을 너무 일반화하지 않고, 몸의 자세 전환을 구체적으로 드러내기 위해 ‘옆구리’를 택했습니다. 반복 구조도 가능한 한 반영했습니다.
- source_word: יְמֵי מְצוּרֶךָ
  english_pob_choice: the days of your siege
  chosen_korean: 당신의 포위 기간의 날들
  alternatives_korean:
  - 당신의 포위의 날들
  - 당신의 포위 기간
  - 당신의 포위 기간의 날들
  lexicon: HALOT
  rationale: 원문의 ‘날들’과 ‘포위’를 함께 보존하되, 한국어에서 어색한 소유격 중첩을 완화하기 위해 ‘포위 기간의 날들’로 옮겼습니다. 이는 상징적 포위를 가리키는 문맥을 유지합니다.
theological_decisions:
- issue: ‘당신의 포위’의 지시 대상
  chosen_reading: 표면 형식은 유지하되, 문맥상 에스겔이 수행하는 상징적 포위를 가리키는 것으로 읽습니다.
  alternative_readings:
  - 문자적으로 에스겔 자신에게 가해진 포위로 읽을 수 있음
  rationale: 본문은 예언적 행위 표지(sign-act) 안에 있으므로, 표현을 너무 풀어 설명하지 않으면서도 상징적 의미가 드러나도록 했습니다.
  doctrine_reference: Ezekiel 4장의 표징 행위 해석
- issue: 직접화법의 어조
  chosen_reading: 하나님의 경고 장면을 따라 명령형보다 시각적 환기어 ‘보십시오’를 사용했습니다.
  alternative_readings:
  - ‘보라’로 더 고전적으로 처리
  rationale: 합쇼체의 현대적 문체를 유지하면서도 예언문 특유의 긴박함을 보존하기 위한 선택입니다.
  doctrine_reference: 예언서 문체
