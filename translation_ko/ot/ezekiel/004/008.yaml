- from: 보십시오[a], 내가 당신 위에 줄을 두었습니다[b]. 그래서 당신은 당신의 옆구리에서 다른 옆구리로 돌아눕지 못한 채, 당신의 포위 기간의 날들을 마칠 때까지 있게 될 것입니다.
  to: 보십시오[a], 내가 네 위에 밧줄들을 놓았습니다. 너는 네 한쪽에서 다른 쪽으로 몸을 돌리지 못할 것입니다[b]. 네가 네 포위의 날들을 마칠 때까지 그럴 것입니다.
  rationale: 원문의 완료형(‘놓았습니다’), 결박 도구의 복수(‘밧줄들’), 몸을 한쪽에서 다른 쪽으로 돌리는 행위, 그리고 ‘네 포위의 날들’이라는 압축된 표현을 보존했습니다. ‘네 포위’가 가리키는 바를 본문에서 해설하지 않아 원문의 문맥적 모호성도 유지했습니다.
