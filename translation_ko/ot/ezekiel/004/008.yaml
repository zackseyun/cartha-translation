  source_fidelity: 원문의 עָלֶיךָ(‘네 위에’)와 עֲבוֹתִים(복수 ‘밧줄들’) 및 신체 자세의 전환을 더 직접적으로 반영해야 합니다. ‘포위 기간’은 원문에 없는 ‘기간’을 덧붙이며, ‘포위의 날들’로 충분합니다.
  naturalness: 초안의 ‘당신 위에 줄을 두었습니다’, ‘당신의 옆구리에서 다른 옆구리로’, ‘포위 기간의 날들’은 현대 한국어로 부자연스럽습니다. 하나님이 에스겔에게 직접 말하는 문맥에서는 ‘당신’보다 ‘네’가 자연스럽고, 합쇼체 종결과도 공존할 수 있습니다.
  terminology: עֲבוֹתִים은 단순한 ‘줄’보다 결박 기능이 분명한 ‘밧줄들’이 적절합니다. צַד는 여기서 ‘옆구리’보다 누운 몸의 ‘한쪽/다른 쪽’으로 옮기는 것이 자연스럽습니다. מְצוּרֶךָ는 해석을 덧붙이지 않고 ‘네 포위’로 유지합니다.
