id: EZK.4.13
reference: Ezekiel 4:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה כָּ֣כָה יֹאכְל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת לַחְמָ֖/ם טָמֵ֑א בַּ/גּוֹיִ֕ם אֲשֶׁ֥ר אַדִּיחֵ֖/ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/013.yaml
  text: And Yahweh said[c][b][a], “Thus the sons of Israel will eat their bread unclean among the nations where I will drive them.”
  footnotes:
  - marker: a
    text: Or 'the Israelites' / 'the people of Israel.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'defiled.' The term carries ritual impurity overtones, especially in the context of exile among foreign nations.
    reason: lexical_alternative
  - marker: c
    text: Or 'where I will banish them' or 'where I will scatter them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 말씀하셨습니다. “이와 같이 이스라엘 자손은 내가 그들을 그곳으로 쫓아 보낼 그 민족들 가운데에서 그들의 빵을 부정하게 먹을 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 문자적으로는 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부정하게’는 의식적 불결함을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘쫓아 보낼’은 ‘추방하다’, ‘흩어버리다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוָה
  english_pob_choice: And Yahweh said
  chosen_korean: 야훼께서 말씀하셨습니다
  alternatives_korean:
  - 주님께서 말씀하셨습니다
  - 여호와께서 말씀하셨습니다
  lexicon: YHWH
  rationale: 원문의 신명사와 POB의 ‘Yahweh’ 선택을 그대로 반영하고, 합쇼체 서술로 자연스럽게 옮겼습니다.
- source_word: כָּכָה
  english_pob_choice: Thus
  chosen_korean: 이와 같이
  alternatives_korean:
  - 그와 같이
  - 그리하여
  lexicon: HALOT
  rationale: 상황 전개를 예고하는 지시어로서 ‘이와 같이’가 형식적이면서도 원문의 부사적 힘을 잘 살립니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘자손’을 유지해 POB의 성구적 표현과 원문의 혈연·언약적 뉘앙스를 보존했습니다.
- source_word: טָמֵא
  english_pob_choice: unclean
  chosen_korean: 부정하게
  alternatives_korean:
  - 더럽게
  - 오염되게
  - 부정한 상태로
  lexicon: HALOT
  rationale: 의식적·정결법적 불결함을 가리키는 용례이므로 ‘부정하게’가 ‘unclean’의 제의적 의미를 가장 잘 반영합니다.
- source_word: אַדִּיחֵם
  english_pob_choice: I will drive them
  chosen_korean: 그들을 그곳으로 쫓아 보낼
  alternatives_korean:
  - 그들을 몰아낼
  - 그들을 내쫓을
  - 그들을 흩어 보낼
  lexicon: HALOT
  rationale: 강제적 추방의 동작을 살리되, 문맥상 목적지인 ‘그곳으로’를 자연스럽게 붙여 한국어 어순에 맞췄습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 판은 신명사를 ‘야훼’로 일관하므로, 본문도 그 원칙에 따라 번역했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: ‘부정하게’의 정결 언어
  chosen_reading: 의식적 부정함을 뜻하는 표현으로 유지
  alternative_readings:
  - 도덕적으로 더럽게
  - 단순히 더럽게
  rationale: 문맥은 열방 가운데의 정결/부정 개념이므로, 도덕적 비난으로 약화하지 않고 의례적 긴장을 유지했습니다.
  doctrine_reference: Ezekiel purity/exile imagery
