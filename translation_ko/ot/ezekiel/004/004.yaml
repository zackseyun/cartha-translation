id: EZK.4.4
reference: Ezekiel 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֤ה שְׁכַב֙ עַל צִדְּ/ךָ֣ הַ/שְּׂמָאלִ֔י וְ/שַׂמְתָּ֛ אֶת עֲוֺ֥ן בֵּֽית יִשְׂרָאֵ֖ל עָלָ֑י/ו מִסְפַּ֤ר הַ/יָּמִים֙ אֲשֶׁ֣ר תִּשְׁכַּ֣ב עָלָ֔י/ו תִּשָּׂ֖א אֶת עֲוֺנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/004.yaml
  text: And you[a], lie on your left side, and place the iniquity of the house of Israel upon it; for the number of the days that you lie on it, you shall bear their iniquity.
  footnotes:
  - marker: a
    text: Or 'guilt' or 'punishment for iniquity' for 'iniquity' (Hebrew עָוֹן) in both occurrences; the term can include the sin itself, its guilt, or its consequence.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 왼쪽으로 누워야 합니다. 그 위에 이스라엘 집의 죄악을 두십시오[a]. 네가 그 위에 누워 있는 날 수만큼 그들의 죄악을 져야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '죄책'이나 '죄악에 대한 벌'로도 옮길 수 있습니다. 히브리어 עָוֹן은 죄 자체, 그 죄책, 또는 그 결과를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה שְׁכַב
  english_pob_choice: And you… lie
  chosen_korean: 당신은 … 누워야 합니다
  alternatives_korean:
  - 당신은 … 엎드려야 합니다
  - 당신은 … 눕습니다
  lexicon: WLC/HALOT
  rationale: אַתָּה의 직접 명령을 살리면서 שׁכב를 자연스러운 한국어 명령형으로 옮겼습니다. '누워야 합니다'는 동작 지시를 분명히 하되 지나치게 구어적이지 않습니다.
- source_word: צִדְּךָ הַשְּׂמָאלִי
  english_pob_choice: your left side
  chosen_korean: 왼쪽
  alternatives_korean:
  - 왼쪽 옆구리
  - 왼편
  lexicon: HALOT
  rationale: 몸의 자세를 가리키는 표현이므로 '왼쪽으로 누워야 합니다'로 풀어, מקור의 신체적 자세 명령을 자연스럽게 전달했습니다.
- source_word: עֲוֺן
  english_pob_choice: iniquity
  chosen_korean: 죄악
  alternatives_korean:
  - 불의
  - 죄책
  - 죄악의 책임
  lexicon: HALOT
  rationale: עָוֹן은 '죄악, 죄책, 죄의 결과'를 모두 포함할 수 있어 한국어에서 단일어로 고정하기 어렵습니다. 본문 앞뒤의 상징적 부담을 살리기 위해 '죄악'을 택했습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘 족속
  - 이스라엘의 집
  lexicon: HALOT
  rationale: 히브리어의 관용적 공동체 표지를 한국어에서도 직역에 가깝게 유지했습니다. '집'은 혈연·언약 공동체를 함께 드러냅니다.
- source_word: תִּשָּׂא אֶת עֲוֺנָם
  english_pob_choice: you shall bear their iniquity
  chosen_korean: 그들의 죄악을 져야 합니다
  alternatives_korean:
  - 그들의 죄악을 짊어져야 합니다
  - 그들의 죄악을 감당해야 합니다
  lexicon: HALOT
  rationale: נשא의 관용적 의미를 한국어 '지다/짊어지다'로 옮겼습니다. '지다'는 부담을 맡는 상징행동을 간결하게 살리며, 절의 예언적 표지성에 잘 맞습니다.
theological_decisions:
- issue: עָוֹן의 범위와 상징행위의 의미
  chosen_reading: '''죄악''으로 옮기되, 그것을 곧바로 속죄론적 언어로 단정하지 않고 상징적 짐을 진 행위로 유지했습니다.'
  alternative_readings:
  - 죄책
  - 죄의 벌
  rationale: 원문은 죄 그 자체, 죄책, 또는 그 결과까지 아우를 수 있지만, 문맥상 에스겔의 표징 행위가 핵심입니다. 따라서 신학적 해석을 과도하게 고정하지 않고 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
