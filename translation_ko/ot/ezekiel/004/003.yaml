source:
  edition: WLC
  text: וְ/אַתָּ֤ה קַח לְ/ךָ֙ מַחֲבַ֣ת בַּרְזֶ֔ל וְ/נָתַתָּ֤ה אוֹתָ/הּ֙ קִ֣יר בַּרְזֶ֔ל בֵּינְ/ךָ֖ וּ/בֵ֣ין הָ/עִ֑יר וַ/הֲכִינֹתָה֩ אֶת פָּנֶ֨י/ךָ אֵלֶ֜י/הָ וְ/הָיְתָ֤ה בַ/מָּצוֹר֙ וְ/צַרְתָּ֣ עָלֶ֔י/הָ א֥וֹת הִ֖יא לְ/בֵ֥ית יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/003.yaml
  text: And you[a], take for yourself an iron griddle and set it as an iron wall between yourself and the city, and set your face toward it; and it will be under siege, and you shall besiege it. It is a sign for the house of Israel.
  footnotes:
  - marker: a
    text: Or 'an iron plate' or 'an iron pan.' The Hebrew term refers to a metal cooking implement, here used symbolically as a barrier.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 철로 된 부침판 하나를 가져다가 그것을 너와 그 성읍 사이에 철벽으로 세우십시오. 그리고 그것을 향해 얼굴을 돌리십시오. 그러면 그것은 포위 상태에 놓일 것이며, 당신은 그것을 포위하십시오. 이것이 이스라엘 집을 위한 표징입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַחֲבַת은 평평한 조리도구로서 ‘부침판’, ‘판’, ‘팬’ 등으로 옮길 수 있습니다. 여기서는 상징적 용도로 쓰인 조리도구라는 점을 살려 ‘부침판’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲבַת בַּרְזֶל
  english_pob_choice: an iron griddle
  chosen_korean: 철로 된 부침판
  alternatives_korean:
  - 철판
  - 철로 된 팬
  lexicon: HALOT
  rationale: מַחֲבַת은 평평한 조리도구를 가리키므로, 예배 용어로 굳어진 ‘판’보다 기능을 드러내는 ‘부침판’이 원뜻을 더 잘 살립니다.
- source_word: קִיר בַּרְזֶל
  english_pob_choice: an iron wall
  chosen_korean: 철벽
  alternatives_korean:
  - 철로 된 벽
  - 철제 장벽
  lexicon: HALOT
  rationale: 히브리어는 추상적 ‘장벽’이 아니라 구체적 ‘벽’을 쓰므로, 상징적 기능을 해치지 않으면서도 이미지의 강도를 살리는 ‘철벽’을 택했습니다.
- source_word: וַהֲכִינֹתָה אֶת פָּנֶי/ךָ אֵלֶי/הָ
  english_pob_choice: set your face toward it
  chosen_korean: 네 얼굴을 그것을 향하게 하라
  alternatives_korean:
  - 그것을 향해 얼굴을 돌리라
  - 그것을 향하도록 얼굴을 정하라
  lexicon: HALOT
  rationale: ‘얼굴을 향하다’는 히브리 관용구를 한국어에서도 직역에 가깝게 유지해, 결의와 방향성을 함께 드러냈습니다.
- source_word: אוֹת הִיא לְבֵית יִשְׂרָאֵל
  english_pob_choice: It is a sign for the house of Israel.
  chosen_korean: 그것은 이스라엘 집을 위한 표징입니다.
  alternatives_korean:
  - 그것은 이스라엘 집에 대한 표징입니다
  - 그것은 이스라엘 집의 표징입니다
  lexicon: HALOT
  rationale: אוֹת은 예언적 상징을 뜻하므로 ‘표징’이 가장 적합하며, לְבֵית יִשְׂרָאֵל은 수신 대상을 분명히 하도록 ‘위한’으로 옮겼습니다.
theological_decisions:
- issue: 예언적 행위표징의 구체성 유지
  chosen_reading: ‘철벽’과 ‘표징’을 그대로 살려, 상징을 설명해 버리기보다 행위 자체가 가지는 예언적 의미를 독자가 보게 했습니다.
  alternative_readings:
  - 철제 장벽으로 풀어 쓰기
  - 이스라엘을 위한 상징으로 의역하기
  rationale: 이 절은 해석보다 수행되는 행위의 이미지가 핵심이므로, 구체적 사물과 표징 언어를 유지하는 것이 본문의 신학적 긴장을 보존합니다.
  doctrine_reference: 예언서 해석 원리, 성경 번역의 가시적 상징 보존
- issue: 성읍 포위의 진행형 표현
  chosen_reading: ‘포위 상태가 되고’와 ‘포위하라’로 두 동작을 나누어, 성읍이 당하는 상태와 선지자가 행하는 행위를 구별했습니다.
  alternative_readings:
  - 그것은 포위될 것이며 너는 포위할 것이다
  - 그것은 포위 가운데 있게 될 것이다
  rationale: 히브리어는 상태와 행위를 병치하므로, 한국어에서도 동일한 대조를 드러내는 편이 문맥의 극적 효과를 보존합니다.
  doctrine_reference: 서사적-예언적 병치
