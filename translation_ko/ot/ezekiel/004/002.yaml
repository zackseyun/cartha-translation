id: EZK.4.2
reference: Ezekiel 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתָּ֨ה עָלֶ֜י/הָ מָצ֗וֹר וּ/בָנִ֤יתָ עָלֶ֨י/הָ֙ דָּיֵ֔ק וְ/שָׁפַכְתָּ֥ עָלֶ֖י/הָ סֹֽלְלָ֑ה וְ/נָתַתָּ֨ה עָלֶ֧י/הָ מַחֲנ֛וֹת וְ/שִׂים עָלֶ֥י/הָ כָּרִ֖ים סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/002.yaml
  text: And set a siege against it[a], and build a siege wall against it, and heap up a ramp against it, and set camps against it[b], and place battering rams against it all around.
  footnotes:
  - marker: a
    text: Or 'siege tower' for 'siege wall' (דָּיֵק); the Hebrew term denotes a siege structure and may refer to a raised fortification used in assault.
    reason: lexical_alternative
  - marker: b
    text: Or 'siege ramp' for 'ramp' (סֹלְלָה), referring to an embankment heaped up against a city wall.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍에 포위 공격을 가하고, 그 성읍을 향하여 공성 구조물을 세우고, 그 성읍을 향하여 공성용 흙둔덕을 쌓고, 그 성읍을 향하여 진영들을 배치하고, 그 둘레에 충차들을 배치하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘공성 구조물’(히브리어 דָּיֵק)은 공성벽 또는 공성탑을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘공성용 흙둔덕’(히브리어 סֹלְלָה)은 성벽을 공격하려고 쌓아 올린 흙 제방이나 경사로를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצוֹר
  english_pob_choice: a siege
  chosen_korean: 포위
  alternatives_korean:
  - 공성
  - 포위망
  lexicon: HALOT
  rationale: 군사적 포위 상태를 가리키므로 ‘포위’가 자연스럽고, 동사의 목적어처럼 이어져 명령문의 연속성을 잘 살립니다.
- source_word: דָּיֵק
  english_pob_choice: a siege wall
  chosen_korean: 포위벽
  alternatives_korean:
  - 공성벽
  - 포위탑
  - 공성탑
  lexicon: HALOT
  rationale: 사전을 따르면 성읍을 공격하기 위해 세우는 공성 구조물입니다. 전통적 교회 용어보다 구조물의 기능을 드러내는 ‘포위벽’이 본문 맥락에 맞습니다.
- source_word: סֹלְלָה
  english_pob_choice: a ramp
  chosen_korean: 흙둔덕
  alternatives_korean:
  - 공성 둔덕
  - 성토
  - 포위 둔덕
  lexicon: HALOT
  rationale: 적성에 바짝 쌓아 올리는 토성/성토를 가리키므로, ‘흙둔덕’이 이미지와 재료를 함께 전달합니다.
- source_word: מַחֲנוֹת
  english_pob_choice: camps
  chosen_korean: 진영들
  alternatives_korean:
  - 부대들
  - 야영지들
  - 진치기
  lexicon: HALOT
  rationale: 군사 배치를 뜻하는 복수형이므로 ‘진영들’이 포위 전개를 드러내며, 단순한 숙영보다 전투 배치를 잘 반영합니다.
- source_word: כָּרִים
  english_pob_choice: battering rams
  chosen_korean: 공성망치들
  alternatives_korean:
  - 충차들
  - 부수는 도구들
  - 공성추들
  lexicon: HALOT
  rationale: 문맥상 동물의 ‘양’이 아니라 성벽을 부수는 공성무기를 뜻하므로, 기능이 분명한 ‘공성망치들’로 옮겼습니다.
theological_decisions:
- issue: 명령형 연쇄의 전달 방식
  chosen_reading: 히브리어의 연속 명령형을 한국어에서도 나열형 명령으로 유지해, 예언 행위의 긴박하고 상징적인 지시를 보존했습니다.
  alternative_readings:
  - 서술형으로 완화하여 옮김
  - 한 문장으로 묶어 설명적으로 재구성
  rationale: 이 구절은 에스겔에게 성읍 모형을 둘러싼 공성 행위를 직접 수행하라는 상징행동 지시이므로, 명령의 리듬을 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 예언 상징행동의 문맥 보존
- issue: 지시 대상 대명사 처리
  chosen_reading: 대상은 성읍으로 이해하여 ‘그 성읍’을 반복했습니다.
  alternative_readings:
  - 그것
  - 그 도시
  rationale: 히브리어의 반복되는 대명사는 군사적 공격 대상인 예루살렘 성읍을 가리키므로, 한국어에서도 대상이 분명하게 드러나도록 했습니다.
  doctrine_reference: 본문 맥락 우선
