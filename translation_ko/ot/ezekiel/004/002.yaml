  source_fidelity: 히브리어의 공성 행위 목록과 반복되는 ‘그 성읍을 향하여/대하여’라는 방향성은 대체로 반영되어 있습니다. 그러나 ‘포위를 설치하고’는 מָצוֹר에 대한 자연스러운 한국어 표현이 아니며, כָּרִים의 통상적인 공성 무기 명칭도 ‘공성망치’보다 ‘충차’가 정확합니다. דָּיֵק은 정확한 구조물의 종류가 불확실하므로 본문에서 특정 ‘포위벽’으로 단정하기보다 포괄적으로 옮기고 각주에서 대안을 밝혀야 합니다.
  naturalness: ‘포위를 설치하다’와 ‘진영들을 두다’는 현대 표준어 군사 문맥에서 다소 부자연스럽습니다. ‘포위 공격을 가하다’, ‘진영들을 배치하다’가 자연스럽고 명령의 연쇄도 유지합니다.
  terminology: ‘공성 구조물’은 דָּיֵק의 불확실성을 보존하는 안전한 본문 표현이며, ‘충차’는 성벽을 들이받는 공성 무기의 확립된 한국어 명칭입니다. סֹלְלָה는 ‘흙둔덕’으로 옮길 수 있으나 공성 목적을 드러내어 ‘공성용 흙둔덕’으로 하는 편이 분명합니다.
