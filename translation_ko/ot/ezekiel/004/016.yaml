source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ הִנְ/נִ֨י שֹׁבֵ֤ר מַטֵּה לֶ֨חֶם֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/אָכְלוּ לֶ֥חֶם בְּ/מִשְׁקָ֖ל וּ/בִ/דְאָגָ֑ה וּ/מַ֕יִם בִּ/מְשׂוּרָ֥ה וּ/בְ/שִׁמָּמ֖וֹן יִשְׁתּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/016.yaml
  text: Then he said to me[a], “Son of man, behold, I am breaking the staff of bread in Jerusalem, and they will eat bread by weight and with anxiety, and they will drink water by measure and with horror.”
  footnotes:
  - marker: a
    text: Hebrew 'the staff of bread,' an idiom for the supply of bread or food support.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분이 내게 말씀하셨습니다. “인자야, 보아라, 내가 예루살렘에서 빵의 지팡이를 부러뜨리고 있다. 그러면 그들은 빵을 무게로 먹고 불안 가운데 먹을 것이며, 물을 계량하여 마시고 공포 가운데 마실 것이다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘빵의 지팡이’는 빵이나 식량 공급을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔의 대표적 호칭인 בן־אדם을 관용적으로 옮기되, 본문 호칭의 장중함과 반복성을 살리기 위해 직역식인 인자야를 유지했습니다.
- source_word: הִנְנִי
  english_pob_choice: behold, I am
  chosen_korean: 보아라
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 히브리어의 지시성과 강조를 한국어 명령형 느낌으로 살리되, 예언 화법에 맞게 지나치게 설명적으로 풀지 않았습니다.
- source_word: מַטֵּה לֶחֶם
  english_pob_choice: the staff of bread
  chosen_korean: 빵의 지팡이
  alternatives_korean:
  - 빵의 버팀대
  - 빵의 공급
  lexicon: HALOT
  rationale: 문자적 이미지인 ‘지팡이’를 본문에 유지해 원문의 은유를 드러냈고, ‘빵의’로 연결해 생존을 떠받치는 공급이 끊기는 뜻을 보존했습니다.
- source_word: בְּמִשְׁקָל / בִּמְשׂוּרָה
  english_pob_choice: by weight / by measure
  chosen_korean: 무게로 / 계량하여
  alternatives_korean:
  - 달아
  - 정량으로
  lexicon: HALOT
  rationale: 빵과 물의 대조적 배급 방식을 구체적으로 살리기 위해 각각 ‘무게로’, ‘계량하여’로 옮겼습니다.
theological_decisions:
- issue: 심판 상황의 감정 묘사(דְאָגָה, שִׁמָּמֹון)
  chosen_reading: ‘불안 가운데’, ‘공포 가운데’로 서로 대응시키는 표현을 유지했습니다.
  alternative_readings:
  - 걱정 가운데 / 황망 가운데
  - 염려하며 / 황폐함 속에서
  rationale: 두 명사의 정서적 긴장을 완화하지 않고, 식량과 물의 부족이 단순 결핍이 아니라 심판의 공포를 동반한다는 점을 드러내기 위해 대응 구조를 살렸습니다.
  doctrine_reference: 예언 문학의 심판 신탁은 정서적·상징적 강도를 보존해야 한다는 번역 원칙
