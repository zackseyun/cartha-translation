base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/016.yaml
  text: Then he said to me[a], “Son of man, behold, I am breaking the staff of bread in Jerusalem, and they will eat bread by weight and with anxiety, and they will drink water by measure and with horror.”
  footnotes:
  - marker: a
    text: Hebrew 'the staff of bread,' an idiom for the supply of bread or food support.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 내게 말씀하셨습니다. “인자야, 보라, 내가 예루살렘에서 양식의 버팀목[a]을 꺾고 있다. 그들은 빵을 달아서 불안해하며 먹고, 물을 정량으로 경악하며 마실 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘빵의 지팡이’이며, 양식 또는 식량 공급을 떠받치는 버팀목을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
