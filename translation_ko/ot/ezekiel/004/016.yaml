  source_fidelity: 개정이 필요합니다. 원문의 מַטֵּה לֶחֶם은 양식을 지탱하는 공급을 ‘지팡이’라는 은유로 나타냅니다. 초안의 ‘빵의 지팡이’는 형태상 직역이나 한국어에서 의미 관계가 불투명합니다. 또한 ‘먹고 … 먹을 것이며’, ‘마시고 … 마실 것이다’는 원문의 한 동작을 불필요하게 중복합니다. שִׁמָּמוֹן은 단순한 공포보다 경악·참담한 놀람의 뉘앙스가 있어 이를 보존하는 편이 적절합니다.
  naturalness: ‘양식의 버팀목’을 사용하고 각 절의 동사를 한 번씩만 두어 현대 표준 한국어의 자연스러움과 원문의 병행 구조를 함께 살렸습니다. 예언 발화에는 ‘보라’와 ‘마실 것이다’를 사용하여 장중하되 합쇼체 서술문과 조화되게 했습니다.
  terminology: 에스겔서의 관례적 호칭 ‘인자야’를 유지했습니다. מַטֵּה לֶחֶם의 은유는 ‘양식의 버팀목’으로 보존하고, 각주에서 히브리어의 문자적 표현과 관용적 뜻을 밝혔습니다.
