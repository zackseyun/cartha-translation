  text: וּ/מַ֛יִם בִּ/מְשׂוּרָ֥ה תִשְׁתֶּ֖ה שִׁשִּׁ֣ית הַ/הִ֑ין מֵ/עֵ֥ת עַד עֵ֖ת תִּשְׁתֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/011.yaml
  text: And you shall drink water by measure[a], a sixth of a hin; from time to time you shall drink.
  footnotes:
  - marker: a
    text: Or, 'at set times you shall drink.'
    reason: lexical_alternative
translation:
  language: ko
  text: 물도 분량대로 마셔야 합니다 — 한 힌의 여섯째입니다 — 때때로 마셔야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘정해진 때마다 마셔야 합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַיִם
  english_pob_choice: And ... water
  chosen_korean: 물도
  alternatives_korean:
  - 그리고 물을
  - 물
  lexicon: HALOT
  rationale: 앞절의 명령을 이어 주는 접속의 흐름은 살리되, 한국어에서는 자연스럽게 대상어를 앞세워 ‘물도’로 간결하게 옮겼습니다.
- source_word: בִּמְשׂוּרָה
  english_pob_choice: by measure
  chosen_korean: 분량대로
  alternatives_korean:
  - 측량한 만큼
  - 헤아린 양으로
  lexicon: HALOT
  rationale: מְשׂוּרָה는 정해진 계량분을 뜻하므로, 규정된 배급이라는 뉘앙스를 살려 ‘분량대로’로 옮겼습니다.
- source_word: שִׁשִּׁית הַהִין
  english_pob_choice: a sixth of a hin
  chosen_korean: 한 힌의 여섯째입니다
  alternatives_korean:
  - 힌의 여섯째 분량입니다
  - 한 힌의 6분의 1입니다
  lexicon: HALOT
  rationale: 고대 계량 단위를 그대로 보존하되, 한국어에서 자연스러운 분수 표현으로 풀어 ‘한 힌의 여섯째’로 옮겼습니다.
- source_word: מֵעֵת עַד עֵת
  english_pob_choice: from time to time
  chosen_korean: 때때로
  alternatives_korean:
  - 정해진 때마다
  - 간헐적으로
  lexicon: HALOT
  rationale: 이 관용구는 연속적 음용이 아니라 간헐적·주기적 음용을 뜻하므로, 자연스러운 현대 한국어인 ‘때때로’로 옮겼습니다.
theological_decisions:
- issue: 계량과 제한의 강조를 어떻게 살릴지
  chosen_reading: 이 구절은 단순한 음용 명령이 아니라, 포위 상황 속 배급을 상징하는 제한된 섭취를 강조하는 것으로 읽어 ‘분량대로’와 ‘때때로’를 유지했습니다.
  alternative_readings:
  - 자연스러운 생활 지시로 완화하여 읽는 것
  - ‘정해진 때마다’로만 시간 규정을 강조하는 것
  rationale: 히브리어 원문과 POB의 ‘by measure / from time to time’ 대비는 양과 빈도를 함께 제한합니다. 둘 중 하나만 살리면 명령의 긴박함이 약해집니다.
  doctrine_reference: Ezekiel 4:9-17의 상징행위 해석
