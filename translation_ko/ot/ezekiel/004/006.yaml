translation:
  language: ko
  text: 네가 이 일들을 마치면, 오른쪽으로 두 번째 누워 있어야 합니다. 그리고 유다 집의 죄악을 사십 일 동안 짊어져야 합니다. 내가 너에게 해마다 하루씩을 정해 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘하루를 한 해로, 하루를 한 해로’입니다. 반복은 에스겔이 누워 있는 날수와 그에 대응하는 햇수를 상징적으로 강조합니다.
    reason: lexical_alternative
