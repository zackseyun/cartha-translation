  to: 네가 이 일들을 마친 뒤에는, 다시 오른쪽 옆으로 누우십시오. 그리고 사십 일 동안 유다 집의 죄악을 짊어지십시오. 내가 너에게 하루를 한 해로, 하루를 한 해로 정해 주었습니다.[a]
