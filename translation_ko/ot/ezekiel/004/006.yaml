  - 하루를 한 해로
  lexicon: HALOT
  rationale: 반복된 대응 공식을 한국어에서 자연스럽게 압축해, 표징의 비례 관계를 분명히 드러냈습니다.
theological_decisions:
- issue: עָוֺן을 한국어에서 어떻게 보존할 것인가
  chosen_reading: ‘죄악을 짊어지다’로 번역해 본문의 표징적 부담을 살리고, guilt/punishment 중 하나로만 고정하지 않았습니다.
  alternative_readings:
  - 죄책을 지다
  - 죄에 대한 형벌을 짊어지다
  rationale: 예언서의 상징행위에서는 עָוֺן이 죄 자체와 그에 따른 무게·결과를 함께 가리킬 수 있으므로, 의미의 긴장을 보존하는 쪽이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: ‘해마다 하루씩’의 반복 공식 처리
  chosen_reading: 반복 구조를 매끈하게 풀어 쓰되, 표징적 대응 관계는 유지했습니다.
  alternative_readings:
  - 하루를 한 해로, 하루를 한 해로
  - 한 날을 한 해로
  rationale: 히브리어의 반복은 상징적 비례를 강조하므로, 한국어도 단순 설명으로 바꾸지 않고 그 상응 관계를 보존했습니다.
  doctrine_reference: Source-first formal correspondence
