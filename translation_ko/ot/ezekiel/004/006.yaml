  text: When you have finished these[a], you shall lie down a second time on your right side, and you shall bear the iniquity of the house of Judah for forty days. I have assigned you a day for each year.
  footnotes:
  - marker: a
    text: 'Hebrew: ''a day for a year, a day for a year.'' The repeated wording emphasizes the symbolic correspondence between the days Ezekiel lies down and the years represented.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 이 일들을 마친 뒤에는, 다시 오른쪽 옆으로 누우십시오. 그리고 사십 일 동안 유다 집의 죄악을 짊어지십시오. 내가 너에게 하루를 한 해로, 하루를 한 해로 정해 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘하루를 한 해로, 하루를 한 해로’라고 반복합니다. 이 반복은 에스겔이 누워 있는 날수와 그에 상응하는 햇수의 상징적 관계를 강조합니다.
    reason: lexical_alternative
