  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י רְאֵ֗ה נָתַ֤תִּֽי לְ/ךָ֙ אֶת צפועי הַ/בָּקָ֔ר תַּ֖חַת גֶּלְלֵ֣י הָֽ/אָדָ֑ם וְ/עָשִׂ֥יתָ אֶֽת לַחְמְ/ךָ֖ עֲלֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/015.yaml
  text: Then he said to me[a], “See, I have given you cow dung instead of human dung, and you shall prepare your bread over it.”
  footnotes:
  - marker: a
    text: Or “human dung” / “man's dung.” The Hebrew literally uses a term for dung/excrement and says “the האדם,” here meaning humans in general, contrasted with cattle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 내게 말씀하셨습니다[a]. "보십시오, 내가 너에게 소의 똥을 사람의 똥 대신 주었으니, 너는 그것 위에 네 떡을 구워야 합니다."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사람의 똥”, “인간의 똥”. 히브리어는 문자적으로 똥/배설물을 가리키는 말을 쓰며, 여기의 האדם은 사람 일반을 뜻합니다. 가축과의 대조입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  english_pob_choice: Then he said to me
  chosen_korean: 그가 내게 말씀하셨습니다
  alternatives_korean:
  - 그가 내게 말하셨습니다
  - 그리고 그가 내게 말씀하셨습니다
  lexicon: HALOT
  rationale: 앞선 문맥의 화자이신 하나님을 가리키므로 ‘말씀하셨습니다’가 자연스럽고, 이 문맥의 경외감을 살리면서도 현대 한국어에 맞습니다.
- source_word: רְאֵה
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 주의를 끄는 명령형을 공손한 합쇼체로 옮겨 장면의 직접성을 살렸습니다.
- source_word: צפועי הַבָּקָר
  english_pob_choice: cow dung
  chosen_korean: 소의 똥
  alternatives_korean:
  - 소똥
  - 가축의 똥
  - 소의 거름
  lexicon: HALOT
  rationale: 실물의 거친 표현을 살리기 위해 완곡한 ‘거름’보다 직설적인 ‘똥’을 택했고, cattle의 구체성은 ‘소’로 옮겼습니다.
- source_word: גֶּלְלֵי הָאָדָם
  english_pob_choice: human dung
  chosen_korean: 사람의 똥
  alternatives_korean:
  - 인간의 똥
  - 사람의 분변
  - 인간의 분뇨
  lexicon: HALOT
  rationale: 히브리어의 대비를 분명히 드러내기 위해 ‘소의 똥’과 병렬되는 직설적 표현을 사용했습니다. הָאָדָם은 여기서 특정 남성보다 인간 일반을 가리키므로 ‘사람’이 적절합니다.
- source_word: וְעָשִׂיתָ אֶת לַחְמְךָ
  english_pob_choice: and you shall prepare your bread
  chosen_korean: 너는 그것 위에 네 떡을 구워야 합니다
  alternatives_korean:
  - 너는 그것 위에 네 빵을 만들어야 합니다
  - 너는 그것 위에 네 떡을 준비해야 합니다
  lexicon: HALOT
  rationale: 문맥상 빵을 만드는 일반행위가 아니라 그 똥을 연료처럼 써서 굽는 뜻이므로, ‘prepare’보다 구체적인 ‘구워야 합니다’가 מקור의 의도를 더 직접적으로 전달합니다.
theological_decisions:
- issue: הָאָדָם의 번역 범위
  chosen_reading: 사람의 똥
  alternative_readings:
  - 인간의 똥
  - 남자의 똥
  rationale: 본문의 대조는 가축과 인간 일반 사이의 대비입니다. 특정 성별을 뜻하는 것으로 좁히지 않고, 현대 한국어에서 자연스러운 ‘사람’으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: אָדָם ‘man / humankind (context)’'
