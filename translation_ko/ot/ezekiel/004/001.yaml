  text: And you[a], son of man, take for yourself a brick, set it before you, and engrave on it a city, Jerusalem.
  footnotes:
  - marker: a
    text: Or 'inscribe on it' or 'draw on it.' The Hebrew verb can refer to engraving or inscribing; here it describes making a representation of Jerusalem on the brick.
    reason: lexical_alternative
translation:
  language: ko
  text: 너, 인자야, 너를 위하여 벽돌 한 장을 가져다가 네 앞에 놓고, 그 위에 한 성읍, 곧 예루살렘을 새기십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 위에 새기다’ 혹은 ‘그 위에 그리다’로도 옮길 수 있습니다. 히브리어 동사는 새기거나 새겨 넣는 행위를 가리킬 수 있으며, 여기서는 벽돌 위에 예루살렘의 표상을 만드는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
