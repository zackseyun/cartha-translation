  rationale: 단순한 재료명으로서 ‘벽돌’이 적절하며, 수량을 분명히 하려고 ‘한 장’을 보탰습니다.
- source_word: וְנָתַתָּה אוֹתָהּ לְפָנֶיךָ
  english_pob_choice: set it before you
  chosen_korean: 네 앞에 놓고
  alternatives_korean:
  - 네 앞에 두고
  - 네 앞에 세워 두고
  lexicon: HALOT
  rationale: נתן + לפני의 자연스러운 행동을 한국어로 간결하게 풀어, 물건을 앞에 두라는 명령을 직접적으로 전달했습니다.
- source_word: וְחַקּוֹתָ עָלֶיהָ
  english_pob_choice: engrave on it
  chosen_korean: 그 위에 … 새기십시오
  alternatives_korean:
  - 그 위에 … 새기십시오
  - 그 위에 … 새겨 넣으십시오
  - 그 위에 … 새기고
  lexicon: HALOT
  rationale: חקק의 기본 의미인 ‘새기다/조각하다’를 살려, 벽돌 위에 예루살렘의 형상을 만드는 구체성을 유지했습니다.
- source_word: עִיר אֶת יְרוּשָׁלִָם
  english_pob_choice: a city, Jerusalem
  chosen_korean: 한 성읍—예루살렘
  alternatives_korean:
  - 한 성읍, 예루살렘
  - 성읍 곧 예루살렘
  - 예루살렘이라는 성읍
  lexicon: HALOT
  rationale: 히브리어의 부가 설명적 병치를 반영해 ‘한 성읍’과 고유명사를 분리하되, 직접적 대응을 위해 대시로 이어 주었습니다. ‘성읍’은 예루살렘의 도시성을 강조합니다.
theological_decisions:
