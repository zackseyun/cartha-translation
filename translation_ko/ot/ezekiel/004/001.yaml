  text: וְ/אַתָּ֤ה בֶן אָדָם֙ קַח לְ/ךָ֣ לְבֵנָ֔ה וְ/נָתַתָּ֥ה אוֹתָ֖/הּ לְ/פָנֶ֑י/ךָ וְ/חַקּוֹתָ֥ עָלֶ֛י/הָ עִ֖יר אֶת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/001.yaml
  text: And you[a], son of man, take for yourself a brick, set it before you, and engrave on it a city, Jerusalem.
  footnotes:
  - marker: a
    text: Or 'inscribe on it' or 'draw on it.' The Hebrew verb can refer to engraving or inscribing; here it describes making a representation of Jerusalem on the brick.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너, 인자야, 너를 위해 벽돌 한 장을 가져다가 네 앞에 놓고, 그 위에 한 성읍—예루살렘을 새기십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 위에 새기다’ 혹은 ‘그 위에 그리다’로도 옮길 수 있습니다. 히브리어 동사는 새기거나 새겨 넣는 행위를 가리킬 수 있으며, 여기서는 벽돌 위에 예루살렘의 표상을 만드는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 인자여
  - 인간아
  lexicon: HALOT
  rationale: 에스겔에서 반복되는 신적 호칭으로서, 한국어 성경에서 널리 알려진 ‘인자’를 유지해 원문의 직접 호칭성과 문학적 기능을 살렸습니다.
- source_word: לְבֵנָה
  english_pob_choice: a brick
  chosen_korean: 벽돌 한 장
  alternatives_korean:
  - 벽돌
  - 진흙벽돌
  - 벽돌 타일
  lexicon: HALOT
  rationale: 단순한 재료명으로서 ‘벽돌’이 적절하며, 수량을 분명히 하려고 ‘한 장’을 보탰습니다.
- source_word: וְנָתַתָּה אוֹתָהּ לְפָנֶיךָ
  english_pob_choice: set it before you
  chosen_korean: 네 앞에 놓고
  alternatives_korean:
  - 네 앞에 두고
  - 네 앞에 세워 두고
  lexicon: HALOT
  rationale: נתן + לפני의 자연스러운 행동을 한국어로 간결하게 풀어, 물건을 앞에 두라는 명령을 직접적으로 전달했습니다.
- source_word: וְחַקּוֹתָ עָלֶיהָ
  english_pob_choice: engrave on it
  chosen_korean: 그 위에 … 새기십시오
  alternatives_korean:
  - 그 위에 … 새기십시오
  - 그 위에 … 새겨 넣으십시오
  - 그 위에 … 새기고
  lexicon: HALOT
  rationale: חקק의 기본 의미인 ‘새기다/조각하다’를 살려, 벽돌 위에 예루살렘의 형상을 만드는 구체성을 유지했습니다.
- source_word: עִיר אֶת יְרוּשָׁלִָם
  english_pob_choice: a city, Jerusalem
  chosen_korean: 한 성읍—예루살렘
  alternatives_korean:
  - 한 성읍, 예루살렘
  - 성읍 곧 예루살렘
  - 예루살렘이라는 성읍
  lexicon: HALOT
  rationale: 히브리어의 부가 설명적 병치를 반영해 ‘한 성읍’과 고유명사를 분리하되, 직접적 대응을 위해 대시로 이어 주었습니다. ‘성읍’은 예루살렘의 도시성을 강조합니다.
theological_decisions:
- issue: ‘인자’ 호칭의 번역 유지
  chosen_reading: 문학적·예언자적 호칭으로서 ‘인자’를 그대로 유지합니다.
  alternative_readings:
  - 사람아
  - 인간아
  rationale: 에스겔서에서 반복되는 하나님의 호칭은 내용적 의미뿐 아니라 상호작용의 형식을 구성하므로, 해석어로 바꾸기보다 전통적이면서도 원문에 가까운 호칭을 유지하는 편이 본문 기능을 잘 드러냅니다.
  doctrine_reference: Ezekiel prophetic address / source-form preservation
