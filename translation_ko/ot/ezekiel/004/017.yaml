  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְמַ֥עַן יַחְסְר֖וּ לֶ֣חֶם וָ/מָ֑יִם וְ/נָשַׁ֨מּוּ֙ אִ֣ישׁ וְ/אָחִ֔י/ו וְ/נָמַ֖קּוּ בַּ/עֲוֺנָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/017.yaml
  text: so that they may lack bread and water[a], and each man and his brother may be appalled[b], and waste away in their iniquity.
  footnotes:
  - marker: a
    text: Or 'be desolated,' 'be horrified,' or 'be stunned' for 'may be appalled.' The Hebrew verb can express either desolation or the shocked state produced by it.
    reason: lexical_alternative
  - marker: b
    text: Or 'in their guilt' or 'for the punishment of their iniquity.' The Hebrew word can denote iniquity, guilt, or the punishment resulting from iniquity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 빵과 물이 모자라게 되며, 각 사람과 그의 형제는 놀라게 되고, 자기 죄악 가운데서 쇠약해질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘놀라게 되고’로 옮긴 히브리어 동사는 ‘황폐해지다’, ‘경악하다’, ‘멍해지다’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 죄악 가운데서’의 히브리어는 죄악, 죄책, 또는 죄악에 대한 벌을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: so that
  chosen_korean: ~하게 되며
  alternatives_korean:
  - ~하도록
  - ~하기 위해서
  lexicon: HALOT
  rationale: 앞절의 결과를 나타내는 목적/결과 연결이므로, 한국어에서는 자연스러운 결과 연결어미로 옮겼습니다.
- source_word: יַחְסְר֖וּ לֶחֶם וָמָיִם
  english_pob_choice: they may lack bread and water
  chosen_korean: 빵과 물이 모자라게 되며
  alternatives_korean:
  - 빵과 물이 부족하게 되며
  - 먹을 것과 물이 모자라게 되며
  lexicon: HALOT
  rationale: חסר의 기본 뜻인 ‘모자라다, 부족하다’를 살리되, ‘빵과 물’이라는 구체적 기본 양식을 그대로 유지했습니다.
- source_word: וְנָשַׁמּוּ
  english_pob_choice: may be appalled
  chosen_korean: 놀라게 되고
  alternatives_korean:
  - 황폐하게 되고
  - 황망해지고
  - 경악하게 되고
  lexicon: HALOT
  rationale: 이 동사는 ‘황폐해지다’와 ‘그로 인해 놀라/경악하다’의 뜻을 함께 가질 수 있어, 여기서는 사람의 반응을 살린 ‘놀라게 되다’로 옮겼습니다.
- source_word: אִישׁ וְאָחִיו
  english_pob_choice: each man and his brother
  chosen_korean: 각 사람과 그의 형제
  alternatives_korean:
  - 각자와 그의 형제
  - 한 사람과 그의 형제
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 분배적 표현을 한국어에서 자연스럽게 살리면서도, 대표적 의미를 분명히 하기 위해 ‘각 사람’으로 옮겼습니다.
- source_word: וְנָמַקּוּ
  english_pob_choice: and waste away
  chosen_korean: 쇠약해질 것입니다
  alternatives_korean:
  - 스러질 것입니다
  - 썩어 없어질 것입니다
  - 쇠잔해질 것입니다
  lexicon: HALOT
  rationale: מקק의 ‘썩어/무너져 소멸해 가다’는 뜻을 사람에게 자연스러운 표현인 ‘쇠약해지다’로 풀어, 심판 아래 소진되는 상태를 전달했습니다.
- source_word: בַּעֲוֺנָם
  english_pob_choice: in their iniquity
  chosen_korean: 자기 죄악 가운데서
  alternatives_korean:
  - 그들의 죄악 가운데서
  - 그들의 죄책 가운데서
  - 죄악으로 인해
  lexicon: HALOT
  rationale: עָוֹן의 의미 범위(죄악, 죄책, 죄의 형벌)를 한쪽으로 좁히지 않고, 본문의 도덕적·실존적 상태를 드러내는 ‘죄악 가운데서’로 옮겼습니다.
theological_decisions:
- issue: עָוֹן의 의미 범위를 어떻게 처리할지
  chosen_reading: 자기 죄악 가운데서
  alternative_readings:
  - 자기 죄책 가운데서
  - 자기 죄악의 벌로
  rationale: 히브리어는 죄 자체, 죄책, 그에 따른 형벌을 모두 함축할 수 있으므로, 본문이 지닌 긴장을 유지하기 위해 한 의미로 결정적으로 좁히지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: אִישׁ וְאָחִיו의 남성 대표 표현을 어떻게 옮길지
  chosen_reading: 각 사람과 그의 형제
  alternative_readings:
  - 각 사람과 그의 이웃
  - 각자와 그의 형제
  rationale: 원문은 남성 단수의 분배적 표현을 쓰므로, 성별을 지우는 중립화보다 원문의 형식을 살리는 번역을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
