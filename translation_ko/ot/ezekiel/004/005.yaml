source:
  edition: WLC
  text: וַ/אֲנִ֗י נָתַ֤תִּֽי לְ/ךָ֙ אֶת שְׁנֵ֣י עֲוֺנָ֔/ם לְ/מִסְפַּ֣ר יָמִ֔ים שְׁלֹשׁ מֵא֥וֹת וְ/תִשְׁעִ֖ים י֑וֹם וְ/נָשָׂ֖אתָ עֲוֺ֥ן בֵּֽית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/005.yaml
  text: And I have assigned to you the years of their iniquity according to the number of days[a], three hundred and ninety days, and you shall bear the iniquity of the house of Israel.
  footnotes:
  - marker: a
    text: Or 'the punishment of their iniquity' or 'their guilt'; the Hebrew word can refer to iniquity, guilt, or the punishment resulting from guilt.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너에게 그들의 죄악의 해를 날 수대로 정해 주었으니, 곧 삼백구십 일이다. 너는 이스라엘 집의 죄악을 져야 한다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 죄악의 형벌’, ‘그들의 죄책’; 히브리어는 죄악, 죄책, 그로 인한 벌을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַתִּי
  english_pob_choice: have assigned
  chosen_korean: 정해 주었으니
  alternatives_korean:
  - 주었으니
  - 배정하였으니
  - 할당하였으니
  lexicon: HALOT
  rationale: 직역의 ‘주었다’보다, 이 문맥에서 에스겔에게 상징적 기간을 부과하는 뜻을 살려 ‘정해 주었다’로 옮겼습니다.
- source_word: שְׁנֵי עֲוֺנָם
  english_pob_choice: the years of their iniquity
  chosen_korean: 그들의 죄악의 해
  alternatives_korean:
  - 그들의 불의의 해
  - 그들의 죄의 해
  - 그들의 죄책의 해
  lexicon: HALOT
  rationale: עָוֹן의 핵심 의미를 ‘죄악’으로 보존하여 도덕적·신학적 무게를 살렸고, 이어지는 ‘날 수대로’와 함께 상징적 대응을 드러내도록 했습니다.
- source_word: לְמִסְפַּר יָמִים
  english_pob_choice: according to the number of days
  chosen_korean: 날 수대로
  alternatives_korean:
  - 날의 수에 따라
  - 날의 숫자대로
  - 날수에 따라
  lexicon: HALOT
  rationale: 히브리어의 대응 관계를 자연스럽게 드러내면서도, ‘해’와 ‘날’의 상징적 비례를 간결하게 전달하는 표현으로 옮겼습니다.
- source_word: וְנָשָׂאתָ עֲוֺן
  english_pob_choice: you shall bear the iniquity
  chosen_korean: 죄악을 져야 한다
  alternatives_korean:
  - 죄악을 짊어져야 한다
  - 죄책을 져야 한다
  - 죄악을 감당해야 한다
  lexicon: HALOT
  rationale: נשא의 관용적 결합을 따라 ‘지다/짊어지다’ 계열로 옮겨, 죄와 그 책임을 떠맡는 행위적 부담을 살렸습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘의 집
  - 이스라엘 공동체
  - 이스라엘
  lexicon: HALOT
  rationale: 히브리어의 관용적 표지를 유지하되 한국어 어순에 맞게 다듬어, 언약적·공동체적 의미를 살렸습니다.
theological_decisions:
- issue: עָוֹן을 ‘죄악’으로 유지할지, ‘죄책/형벌’로 풀어 쓸지
  chosen_reading: 본문의 두 번의 עָוֹן을 모두 ‘죄악’으로 유지하고, ‘져야 한다’로 부담과 결과를 암시했습니다.
  alternative_readings:
  - 죄책
  - 형벌
  - 죄의 벌
  rationale: 히브리어가 죄 자체, 죄책, 그 결과로서의 벌을 모두 포괄할 수 있으므로, 하나로 과도하게 확정하지 않고 상징행위의 중압을 드러냈습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
