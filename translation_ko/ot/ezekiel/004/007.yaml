  lexicon: HALOT
  rationale: עַל의 문맥상 적대·심판 뉘앙스는 살리되, 한국어에서는 ‘예언하다’와 직접 결합이 자연스러운 ‘향해’를 택해 강한 심판 맥락을 무리 없이 전달했습니다.
theological_decisions:
- issue: עַל의 방향성/대상성
  chosen_reading: ‘예언해야 합니다’ 앞에서 ‘향해’를 써서, 예루살렘을 향한 심판 선언이라는 문맥적 긴장을 살렸습니다.
  alternative_readings:
  - 중립적으로 ‘그것에 관해 예언해야 합니다’로 옮길 수 있습니다.
  rationale: 히브리어 전치사 עַל은 넓게는 ‘관하여’일 수 있지만, 이 절은 포위와 심판의 표징 행위이므로 적대적·재판적 방향성이 우세합니다.
  doctrine_reference: 번역 원칙 §1, §3
