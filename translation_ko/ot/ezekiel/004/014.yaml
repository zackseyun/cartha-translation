base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/014.yaml
  text: Then I said[a], “Ah, Lord Yahweh! Look, I have never defiled myself. From my youth until now I have not eaten what dies of itself or what is torn by beasts[c][b], and no defiled meat has entered my mouth.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''my soul/life is not defiled''—an idiom meaning ''I have not made myself unclean.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'carcass and torn flesh'; that is, animals that died naturally or were killed by predators, both forbidden as food under Israel's purity laws.
    reason: cultural_note
  - marker: c
    text: Or 'abominable flesh.' The Hebrew term refers to meat rendered ritually unacceptable or defiled.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 말하였습니다. “아, 주 야훼여! 보십시오, 저는 몸을 더럽힌 적이 없습니다.[a] 젊은 때부터 지금까지 저절로 죽은 짐승이나 짐승에게 찢긴 것을 먹지 않았으며,[b] 부정한 고기가 제 입에 들어간 적도 없습니다.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, '내 영혼이 더럽혀지지 않았다.' 여기서 '영혼'은 그 사람 자신을 가리키므로, 자신이 의식적으로 부정해지지 않았다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '사체나 찢긴 것.' 저절로 죽었거나 포식자에게 찢겨 죽은 동물을 가리키며, 이스라엘의 정결 규정에서는 먹는 것이 금지되었습니다.
    reason: cultural_note
  - marker: c
    text: 또는 '가증한 고기.' 히브리어 פִּגּוּל은 의식적으로 받아들일 수 없게 된 고기를 가리킵니다.
    reason: lexical_alternative
