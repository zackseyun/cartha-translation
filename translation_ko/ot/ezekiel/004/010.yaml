id: EZK.4.10
reference: Ezekiel 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַאֲכָֽלְ/ךָ֙ אֲשֶׁ֣ר תֹּאכֲלֶ֔/נּוּ בְּ/מִשְׁק֕וֹל עֶשְׂרִ֥ים שֶׁ֖קֶל לַ/יּ֑וֹם מֵ/עֵ֥ת עַד עֵ֖ת תֹּאכֲלֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/010.yaml
  text: And your food that you shall eat shall be by weight[a], twenty shekels a day[b]; from time to time you shall eat it.
  footnotes:
  - marker: a
    text: Or 'at set times'; the Hebrew idiom literally reads 'from time to time.'
    reason: lexical_alternative
  - marker: b
    text: A shekel was a unit of weight, not necessarily a coin here.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 너의 먹을 것은 저울로 달아 하루에 스무 세겔씩이니, 때때로 그것을 먹어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘때때로’는 히브리어 관용구 מֵעֵת עַד עֵת를 풀어 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: 세겔은 여기서 화폐가 아니라 무게 단위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: מַאֲכָלְךָ
  english_pob_choice: your food
  chosen_korean: 너의 먹을 것
  alternatives_korean:
  - 너의 음식
  - 네 식량
  lexicon: HALOT
  rationale: מַאֲכָל은 ‘먹을 것/음식’의 뜻이므로, 문맥의 배급 규정을 살려 ‘너의 먹을 것’으로 옮겼습니다.
- source_word: בְּמִשְׁקוֹל
  english_pob_choice: by weight
  chosen_korean: 저울로 달아
  alternatives_korean:
  - 무게로
  - 달아서
  lexicon: HALOT
  rationale: בְּמִשְׁקוֹל은 단순한 분량이 아니라 실제로 무게를 재는 방식을 가리키므로, 한국어에서도 절차가 드러나도록 ‘저울로 달아’로 옮겼습니다.
- source_word: עֶשְׂרִים שֶׁקֶל
  english_pob_choice: twenty shekels
  chosen_korean: 스무 세겔
  alternatives_korean:
  - 20 세겔
  - 스무 세겔의 무게
  lexicon: HALOT
  rationale: 세겔은 고대의 무게 단위를 보존하는 것이 중요하므로 음역을 유지했고, 일상적인 수량 표현에 맞게 ‘스무 세겔’로 자연스럽게 처리했습니다.
- source_word: מֵעֵת עַד עֵת
  english_pob_choice: from time to time
  chosen_korean: 때때로
  alternatives_korean:
  - 정해진 때마다
  - 때와 때 사이에
  lexicon: HALOT
  rationale: 이 관용구는 연속적으로가 아니라 간격을 두고 먹는다는 뜻이므로, 직역보다 의미를 살린 ‘때때로’가 가장 간결하고 자연스럽습니다.
