  text: You shall eat it as a barley cake, and you shall bake it over human dung in their sight.
translation:
  language: ko
  text: 너는 그것을 보리 떡처럼 먹어야 하고, 사람의 배설물 위에서 그것을 구워야 합니다. 그들은 보는 앞에서 그렇게 해야 합니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘보리 떡으로’.
    reason: alternative_reading
lexical_decisions:
- source_word: תֹּאכֲלֶנָּה
  english_pob_choice: You shall eat it
  chosen_korean: 너는 그것을 먹어야 하고
  alternatives_korean:
  - 그것을 먹을 것이다
  - 너는 그것을 먹으라
  lexicon: אכל
  rationale: 명령/예고의 뉘앙스를 살리되, 문맥상 예언적 지시이므로 자연스러운 의무형으로 옮겼습니다.
- source_word: עֻגַת שְׂעֹרִים
  english_pob_choice: a barley cake
  chosen_korean: 보리 떡처럼
  alternatives_korean:
  - 보리 떡으로
  - 보리 케이크처럼
  lexicon: עֻגָה + שְׂעֹרִים
  rationale: ‘떡’이 한국어 성경 문맥에서 가장 자연스럽고, 비교구문을 살려 ‘처럼’으로 처리했습니다.
- source_word: בְּגֶלְלֵי צֵאַת הָאָדָם
  english_pob_choice: human dung
  chosen_korean: 사람의 배설물
  alternatives_korean:
  - 사람의 똥
  - 인간의 배설물
  lexicon: גֶּלֶל / צֵאָה
  rationale: 의도된 충격성을 유지하면서도 현대 한국어 공적 문체에 맞게 ‘배설물’로 옮겼습니다.
- source_word: לְעֵינֵיהֶם
  english_pob_choice: in their sight
  chosen_korean: 그들은 보는 앞에서
  alternatives_korean:
  - 그들의 눈앞에서
  - 그들이 보는 가운데
  lexicon: עין
  rationale: ‘보는 앞에서’는 관찰 가능성과 공개성을 직접 드러내며, 예언 행위의 공개성을 잘 전달합니다.
theological_decisions:
- issue: 예언적 상징행위의 공개성과 수치성
  chosen_reading: 이 구절은 단순한 조리법이 아니라, 선지자에게 주어진 공개적 상징행위를 그대로 드러내는 문장으로 옮겼습니다.
  alternative_readings:
  - 상징을 약화시켜 단순한 서술로 처리
  - 완곡하게 만들어 충격성을 낮춤
  rationale: 문맥상 핵심은 음식 준비 방식의 기괴함을 통한 심판 상징이므로, 원문의 불편함을 희석하지 않는 것이 해석에 충실합니다.
  doctrine_reference: 에스겔 4장의 상징행위와 심판 예고
- issue: ‘over’의 방향성
  chosen_reading: ‘위에서’보다 ‘위에서 구워야 합니다’보다 더 직접적으로 ‘배설물 위에서’로 옮기되, 행위의 물리적 접촉을 분명히 했습니다.
  alternative_readings:
  - 배설물 위에
  - 배설물로
  rationale: 영어 POB의 ‘over’를 그대로 살리면서도, 구워지는 매체가 배설물임을 분명하게 해야 본문 의도가 전달됩니다.
  doctrine_reference: 본문의 상징적 불결성과 포로기의 부정성
- issue: 그들의 시야에서의 수행
  chosen_reading: ‘그들은 보는 앞에서’로 옮겨 공개적 수치를 강조했습니다.
  alternative_readings:
  - 그들의 눈앞에서
  - 그들이 보는 가운데
  rationale: 공동체 앞에서 행해지는 공개적 경고라는 기능을 분명히 하기 위한 선택입니다.
  doctrine_reference: 예언자의 표적 행위
