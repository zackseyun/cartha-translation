base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/009.yaml
  text: And you[a], take for yourself wheat and barley, beans and lentils, millet and spelt, and put them into one vessel, and make them into bread for yourself. For the number of the days that you lie on your side—three hundred and ninety days—you shall eat it.
  footnotes:
  - marker: a
    text: Or 'emmer' or 'a kind of wheat' for 'spelt'; the exact identification of the ancient grain כֻסְּמִים is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 밀과 보리와 콩과 렌틸콩과 조와 스펠트[a]를 가져다가 한 용기에 넣고, 그것들로 너를 위해 빵을 만들어야 합니다. 네가 옆으로 누워 있는 날 수, 곧 삼백구십 일 동안 그 빵을 먹어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כֻסְּמִים의 정확한 고대 곡물 식별은 확실하지 않습니다. 전통적으로 ‘스펠트’로 옮기지만, ‘엠머’ 또는 ‘일종의 밀’로 이해되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  english_pob_choice: take for yourself
  chosen_korean: 가져다가
  alternatives_korean:
