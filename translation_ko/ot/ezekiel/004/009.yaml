  text: וְ/אַתָּ֣ה קַח לְ/ךָ֡ חִטִּ֡ין וּ֠/שְׂעֹרִים וּ/פ֨וֹל וַ/עֲדָשִׁ֜ים וְ/דֹ֣חַן וְ/כֻסְּמִ֗ים וְ/נָתַתָּ֤ה אוֹתָ/ם֙ בִּ/כְלִ֣י אֶחָ֔ד וְ/עָשִׂ֧יתָ אוֹתָ֛/ם לְ/ךָ֖ לְ/לָ֑חֶם מִסְפַּ֨ר הַ/יָּמִ֜ים אֲשֶׁר אַתָּ֣ה שׁוֹכֵ֣ב עַֽל צִדְּ/ךָ֗ שְׁלֹשׁ מֵא֧וֹת וְ/תִשְׁעִ֛ים י֖וֹם תֹּאכֲלֶֽ/נּוּ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/009.yaml
  text: And you[a], take for yourself wheat and barley, beans and lentils, millet and spelt, and put them into one vessel, and make them into bread for yourself. For the number of the days that you lie on your side—three hundred and ninety days—you shall eat it.
  footnotes:
  - marker: a
    text: Or 'emmer' or 'a kind of wheat' for 'spelt'; the exact identification of the ancient grain כֻסְּמִים is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 밀과 보리와 콩과 팥과 조와 스펠트를 가져다가 그것들을 한 그릇에 넣고 그것들로 네게 빵을 만들어라. 네가 네 옆구리로 누워 있는 날 수, 곧 삼백아흔 날의 수를 따라 그것을 먹어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: כֻסְּמִים은 정확한 고대 곡물 식별이 확정되지 않아, 전통적으로는 ‘스펠트’로 옮기지만 ‘엠머’ 또는 ‘일종의 밀’로 이해되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  english_pob_choice: take for yourself
  chosen_korean: 가져다가
  alternatives_korean:
  - 너를 위해 취하여
  - 너 자신을 위해 가져
  lexicon: HALOT
  rationale: 명령형과 여격적 뉘앙스를 살리면서도 한국어에서 자연스럽게 들리는 수단 표현으로 옮겼습니다.
- source_word: בִּכְלִי אֶחָד
  english_pob_choice: into one vessel
  chosen_korean: 한 그릇에
  alternatives_korean:
  - 한 용기에
  - 하나의 그릇에
  lexicon: HALOT
  rationale: כְּלִי의 구체성을 살리되, 현대 한국어에서 가장 읽기 자연스러운 용기 표현을 택했습니다.
- source_word: כֻסְּמִים
  english_pob_choice: spelt
  chosen_korean: 스펠트
  alternatives_korean:
  - 스펠트밀
  - 외대밀
  lexicon: HALOT
  rationale: 현대 독자가 식별 가능한 음역을 사용하되, 정확한 곡물 분류가 불확실하다는 본문의 긴장을 해치지 않기 위해 음역으로 처리했습니다.
- source_word: מִסְפַּר הַיָּמִים ... שְׁלֹשׁ מֵאוֹת וְתִשְׁעִים יוֹם
  english_pob_choice: for the number of the days ... three hundred and ninety days
  chosen_korean: 네가 네 옆구리로 누워 있는 날 수, 곧 삼백아흔 날의 수를 따라
  alternatives_korean:
  - 네가 네 옆구리로 누워 있는 날의 수대로
  - 삼백아흔 날 동안
  lexicon: HALOT
  rationale: 히브리어의 ‘날 수/수’를 반복하는 구조를 반영해 기간의 산정 근거를 드러냈습니다.
- source_word: תֹּאכֲלֶנּוּ
  english_pob_choice: you shall eat it
  chosen_korean: 먹어야 합니다
  alternatives_korean:
  - 그것을 먹어야 합니다
  - 먹을 것입니다
  lexicon: HALOT
  rationale: 명령적 의무를 살리되 한국어 문맥상 자연스럽게 다듬었습니다. 앞 절의 빵을 가리키는 대명사는 문맥상 명확하여 반복을 줄였습니다.
theological_decisions:
- issue: 에스겔의 상징행위에서 먹는 대상의 표현
  chosen_reading: ‘그것’이 앞서 만든 빵을 가리키도록 문맥 결속을 유지했습니다.
  alternative_readings:
  - ‘그 빵’을 명시적으로 반복함
  - 대상을 일반화해 ‘음식’을 사용함
  rationale: 히브리어는 단수 대명사로 앞의 ‘빵’에 연결되므로, 한국어도 동일한 연결을 유지하는 것이 상징행위의 정확성을 보존합니다.
  doctrine_reference: 서술 본문 해석의 문맥 일치 원칙
- issue: 조·스펠트 등 고대 곡물 명칭의 현대화
  chosen_reading: 일반적 현대어 명칭을 쓰되, 본문이 요구하는 불확실성은 음역 ‘스펠트’로 남겼습니다.
  alternative_readings:
  - 전통 교회식 곡물명으로 순화
  - 모든 곡물을 설명적으로 풀어씀
  rationale: 본문의 의도는 고대의 여러 곡물을 한데 섞는 상징에 있으므로, 지나친 설명이나 전통 용어로의 대체보다 원문 정보의 투명성이 우선입니다.
  doctrine_reference: 원문 직역과 투명성의 원칙
