  - 너 자신을 위해 가져
  lexicon: HALOT
  rationale: 명령형과 여격적 뉘앙스를 살리면서도 한국어에서 자연스럽게 들리는 수단 표현으로 옮겼습니다.
- source_word: בִּכְלִי אֶחָד
  english_pob_choice: into one vessel
  chosen_korean: 한 그릇에
  alternatives_korean:
