  source_fidelity: 본문의 마지막 목적어는 단수 ‘그를’이 아니라, 왕과 고관들을 가리키는 복수 ‘그들을’이어야 합니다. 또한 אֵלָיו는 바벨론 왕에게로 향함을 나타내므로 이를 한국어에서 명시하는 편이 정확합니다. בָּבֶלָה의 방향성도 ‘바벨론에 있는 ...에게’라는 표현으로 문맥에 맞게 반영했습니다.
  naturalness: ‘반역하는 집안’은 원문의 ‘집’ 은유를 유지하면서 ‘반역하는 집’보다 현대 한국어에서 더 자연스럽습니다. ‘사로잡아’와 ‘데려갔습니다’는 역사적 강제 이송 문맥을 과장 없이 자연스럽게 전달합니다.
  terminology: ‘고관들’은 שָׂרֶיהָ의 통치·행정 지도층 의미를 적절히 살립니다. 각주 b의 대안은 본문 표현과 중복되지 않도록 ‘방백들’로 바로잡았습니다. 각주 표지는 해당 어구 뒤로 옮겼습니다.
