id: EZK.17.12
reference: Ezekiel 17:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱמָר נָא֙ לְ/בֵ֣ית הַ/מֶּ֔רִי הֲ/לֹ֥א יְדַעְתֶּ֖ם מָה אֵ֑לֶּה אֱמֹ֗ר הִנֵּה בָ֨א מֶֽלֶךְ בָּבֶ֤ל יְרוּשָׁלִַ֨ם֙ וַ/יִּקַּ֤ח אֶת מַלְכָּ/הּ֙ וְ/אֶת שָׂרֶ֔י/הָ וַ/יָּבֵ֥א אוֹתָ֛/ם אֵלָ֖י/ו בָּבֶֽלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/012.yaml
  text: Say now to the rebellious house[a], ‘Do you not know what these things mean?’ Say, ‘Behold[c][b], the king of Babylon came to Jerusalem and took its king and its officials and brought them to him in Babylon.’
  footnotes:
  - marker: a
    text: Or 'what these things are.' The Hebrew likely asks whether the rebellious house understands the meaning of the allegory.
    reason: lexical_alternative
  - marker: b
    text: Or 'its princes.' The Hebrew term can refer to royal or governing leaders.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'to Babylon' with a directional ending; English may also be rendered 'in Babylon' after 'brought them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 반역하는 집에게 말하십시오[a]. ‘이것들이 무엇을 뜻하는지 너희가 알지 못하느냐?’ 또 말하십시오. ‘보십시오[c][b], 바벨론 왕이 예루살렘에 와서 그 왕과 그 고관들을 붙잡아 그를 바벨론으로 데려갔습니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘반역의 집’, 곧 불순종으로 특징지어진 공동체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 고관들’. 히브리어는 왕족뿐 아니라 통치자들을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 방향을 나타내는 어미가 붙어 ‘바벨론으로’라는 뉘앙스를 띱니다. 문맥에서는 목적지 진술로도 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית הַמֶּרִי
  english_pob_choice: the rebellious house
  chosen_korean: 반역하는 집
  alternatives_korean:
  - 반역의 집
  - 반역한 백성
  lexicon: HALOT
  rationale: 히브리어 관용구의 반복되는 예언자적 표현을 살리면서, ‘집’을 유지해 공동체 은유를 보존하고 ‘반역하는’으로 성격을 분명히 드러냈습니다.
- source_word: מָה אֵלֶּה
  english_pob_choice: what these things mean
  chosen_korean: 이것들이 무엇을 뜻하는지
  alternatives_korean:
  - 이것들이 무엇인지
  - 이것들이 무슨 뜻인지
  lexicon: HALOT
  rationale: 단순한 사물 식별이 아니라 앞선 상징 행위의 의미를 묻는 표현이므로, ‘뜻하다’를 써서 의미 차원을 분명히 했습니다.
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게
  lexicon: HALOT
  rationale: 주의 환기 기능을 현대 한국어의 정중한 명령형으로 옮겨, 예언적 발표의 힘을 유지했습니다.
- source_word: שָׂרֶיהָ
  english_pob_choice: its officials
  chosen_korean: 고관들
  alternatives_korean:
  - 관원들
  - 지도자들
  - 방백들
  lexicon: HALOT
  rationale: 문맥상 예루살렘의 통치 엘리트를 가리키므로, 왕족 여부를 단정하지 않는 ‘고관들’이 가장 무난합니다.
theological_decisions:
- issue: ‘바벨론으로’의 방향성과 도착 상태
  chosen_reading: ‘그를 바벨론으로 데려갔습니다’로 단순한 이동 종결을 살렸습니다.
  alternative_readings:
  - ‘바벨론에 데려갔습니다’
  - ‘바벨론으로 가서 그곳에 두었습니다’
  rationale: 히브리어의 도착 방향성은 동사와 결합해 자연스럽게 성취된 이동을 나타내므로, 한국어에서는 과도한 해설 없이 목적지 이동으로 처리했습니다.
  doctrine_reference: 본문-역사 서술의 자연스러운 등가 번역
- issue: 대상 지시의 자연스러운 전환
  chosen_reading: ‘그 왕과 그 고관들’로 옮기고 마지막 대명사 ‘그를’은 바벨론 왕을 가리키는 문맥대로 두었습니다.
  alternative_readings:
  - ‘그의 왕과 그의 고관들’
  - ‘그들을 바벨론 왕에게’
  rationale: 예루살렘이 여성형으로 지시되는 히브리어 소유격을 한국어에서 무리 없이 풀어, 문맥의 인물 관계를 명료하게 했습니다.
  doctrine_reference: 문법적 성과 한국어 자연성
