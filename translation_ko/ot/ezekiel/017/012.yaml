  rationale: 복수 목적어 ‘그들을’로 바로잡고, 바벨론 왕에게 데려갔다는 אֵלָיו의 지시 관계를 보존했습니다. 또한 각주 표지를 해당 어구에 배치하고 중복된 각주 대안을 수정했습니다. ‘반역하는 집안’은 원문의 공동체 은유와 현대 한국어의 자연성을 함께 고려한 표현입니다.
