  source_fidelity: 히브리어의 동작 순서와 비유적 나무 이미지는 대체로 보존되었습니다. 그러나 שָׂמוֹ는 기본적으로 ‘두다/놓다/세우다’이며, 이 절에서 ‘심었습니다’로 특정할 근거는 충분하지 않습니다. 또한 어휘 대안은 אֶרֶץ כְּנַעַן에 걸리므로 해당 표현에 각주 표지를 붙여야 합니다.
  naturalness: ‘가장 꼭대기 어린 가지’는 수식 관계가 다소 어색합니다. ‘어린 순들 가운데 맨 꼭대기’가 원문의 ‘그 어린 순들의 꼭대기’를 자연스럽게 반영합니다. ‘도시에 두었습니다’도 문맥상 자연스럽고 합쇼체에 맞습니다.
  terminology: ‘가나안’, ‘상인들’, ‘도시’는 적절합니다. ‘상인들의 땅’이라는 각주 대안은 ‘가나안’의 상업적 용법 가능성을 보존하며, 본문 지명과 뒤의 병행구 사이의 말놀이를 강요하지 않습니다.
  issues:
