id: EZK.17.4
reference: Ezekiel 17:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֛ת רֹ֥אשׁ יְנִֽיקוֹתָ֖י/ו קָטָ֑ף וַ/יְבִיאֵ֨/הוּ֙ אֶל אֶ֣רֶץ כְּנַ֔עַן בְּ/עִ֥יר רֹכְלִ֖ים שָׂמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/004.yaml
  text: He plucked off the topmost of its young shoots and brought it to the land of Canaan[a]; he set it in a city of merchants.
  footnotes:
  - marker: a
    text: Or 'to a merchant land'; 'Canaan' can carry a commercial sense here, especially in light of the parallel phrase 'city of merchants.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 나무의 어린 순들 가운데 맨 꼭대기를 꺾어, 그것을 가나안[a] 땅으로 가져가 상인들의 도시에 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘상인들의 땅’. ‘가나안’은 여기서, 특히 뒤의 ‘상인들의 도시’와 함께, 상업적 의미를 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ / יְנִיקוֹתָיו
  english_pob_choice: topmost of its young shoots
  chosen_korean: 가장 꼭대기 어린 가지
  alternatives_korean:
  - 꼭대기 가지
  - 맨 위의 새순
  - 어린 순의 꼭대기
  lexicon: HALOT
  rationale: נִיקוֹת의 식물 비유를 살리되 한국어에서 자연스럽고 시각적인 표현으로 옮겼습니다. '가장 꼭대기'는 영어 POB의 topmost를 반영하고, '어린 가지'는 생장 초기의 연약한 새 가지라는 이미지를 전달합니다.
- source_word: קָטָף
  english_pob_choice: plucked off
  chosen_korean: 꺾어 내어
  alternatives_korean:
  - 꺾어
  - 잘라 내어
  - 따서
  lexicon: HALOT
  rationale: 손으로 떼어 내는 동작의 생생함을 유지하면서도, 나무 비유에 맞는 자연스러운 한국어로 표현했습니다.
- source_word: אֶרֶץ כְּנַעַן
  english_pob_choice: the land of Canaan
  chosen_korean: 가나안 땅
  alternatives_korean:
  - 가나안의 땅
  - 가나안으로
  - 가나안 땅에
  lexicon: HALOT
  rationale: 히브리어의 지명 표현을 직접 살려 '가나안 땅'으로 옮겼습니다. 영어 POB 주석이 허용하는 상업적 뉘앙스는 뒤의 '상인들의 도시'가 풀어 주므로 본문에서는 지명 형태를 유지했습니다.
- source_word: בְּעִיר רֹכְלִים
  english_pob_choice: in a city of merchants
  chosen_korean: 상인들의 도시에
  alternatives_korean:
  - 상인들의 성읍에
  - 무역 도시 한가운데에
  - 상업 도시에
  lexicon: HALOT
  rationale: רֹכְלִים의 기본 의미인 '상인들'을 그대로 살려 소유격 구조로 옮겼습니다. '도시'는 현대 한국어 독자에게 가장 직접적이며, 상업적 성격도 함께 드러냅니다.
- source_word: שָׂמוֹ
  english_pob_choice: he set it
  chosen_korean: 심었습니다
  alternatives_korean:
  - 두었습니다
  - 놓았습니다
  - 세웠습니다
  lexicon: HALOT
  rationale: 이 동사는 단순히 '놓다'보다 식물 비유 속에서의 '심다/두다'의 결을 함께 가질 수 있으므로, 앞선 나무 이미지와 자연스럽게 이어지는 '심었습니다'를 택했습니다.
theological_decisions:
- issue: 예언적 비유에서 대상 지시를 어떻게 유지할지
  chosen_reading: 주어와 목적어의 지시를 분명히 하되, 비유적 나무-가지 이미지가 사라지지 않도록 직설적으로 번역했습니다.
  alternative_readings:
  - 그것을 땅에 두었습니다
  - 그것을 도시 한가운데에 놓았습니다
  rationale: 본문은 상징적 식물 비유를 통해 포로 이동과 이식의 이미지를 전달하므로, 한국어에서도 설명적으로 풀기보다 원문의 동작성과 이미지성을 유지하는 것이 적절합니다.
  doctrine_reference: '본문 주해 원칙: 상징/비유의 이미지 보존'
