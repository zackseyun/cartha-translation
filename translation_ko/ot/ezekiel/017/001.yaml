lexical_decisions:
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언 공식에서 דְבַר יְהוָה는 하나님의 계시를 가리키므로, 한국어에서는 관용적이면서도 직접적인 ‘말씀’이 가장 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 여호와 이름(יהוה)을 титул이 아니라 고유명으로 드러내기 위해, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내 앞에
  lexicon: HALOT
  rationale: 전치사+1인칭 단수 접미사는 여기서 단순히 수신자를 표시하므로, 현대 한국어의 자연스러운 방향 표현인 ‘내게’를 사용했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시되
  - 말하여
  lexicon: HALOT
  rationale: לֵאמֹר는 뒤따르는 직접 화행을 도입하는 상투구이므로, 한국어에서는 반복을 줄이면서도 말씀 전달을 분명히 하는 ‘말씀하셨습니다’로 옮겼습니다.
theological_decisions:
- issue: 예언적 서두에서 야훼의 말씀을 고유명으로 표기할지 여부
  chosen_reading: ‘야훼의 말씀’으로 옮겨, 본문의 계시 주체가 단순한 ‘주’ 칭호가 아니라 언약의 이름을 지닌 하나님임을 드러냈습니다.
  alternative_readings:
  - 주님의 말씀
  - 여호와의 말씀
  rationale: 원문은 יְהוָה를 직접 사용하므로, POB 원칙에 따라 고유명성을 보존하는 번역이 본문 의도에 가장 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
