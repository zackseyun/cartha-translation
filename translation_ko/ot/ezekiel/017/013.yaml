id: EZK.17.13
reference: Ezekiel 17:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּח֙ מִ/זֶּ֣רַע הַ/מְּלוּכָ֔ה וַ/יִּכְרֹ֥ת אִתּ֖/וֹ בְּרִ֑ית וַ/יָּבֵ֤א אֹת/וֹ֙ בְּ/אָלָ֔ה וְ/אֶת אֵילֵ֥י הָ/אָ֖רֶץ לָקָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/013.yaml
  text: And he took one of the royal offspring and made a covenant with him[a], bringing him under an oath, and he took the mighty men of the land.
  footnotes:
  - marker: a
    text: Or 'under a curse-oath'; the Hebrew term can denote an oath accompanied by a curse for breaking it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 왕실의 후손 중 한 사람을 데려다가 그와 언약을 맺고, 그에게 맹세를 하게 했으며[a], 그 땅의 유력자들을 데려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저주가 수반되는 맹세를 하게 했으며’; 히브리어는 맹세를 어길 경우 저주를 받는다는 제재를 포함하는 맹세를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרַע הַמְּלוּכָה
  english_pob_choice: one of the royal offspring
  chosen_korean: 왕족의 씨앗 가운데서 한 사람
  alternatives_korean:
  - 왕실의 자손 가운데서 한 사람
  - 왕의 씨 가운데서 한 사람
  - 왕족의 후손 가운데서 한 사람
  lexicon: WLC/HALOT
  rationale: מִן의 부분적 의미를 살려 ‘~가운데서 한 사람’으로 옮기고, זֶרַע의 혈통적 의미는 ‘씨앗’으로, הַמְּלוּכָה의 왕권/왕실 의미는 ‘왕족’으로 반영했습니다.
- source_word: וַיִּכְרֹת אִתּוֹ בְּרִית
  english_pob_choice: made a covenant with him
  chosen_korean: 그와 언약을 맺고
  alternatives_korean:
  - 그와 계약을 맺고
  - 그와 조약을 맺고
  - 그와 언약을 세우고
  lexicon: HALOT
  rationale: כרת ברית의 관용적 의미를 따라 ‘언약을 맺다’로 옮겨, 단순한 정치적 조약으로만 축소하지 않도록 했습니다.
- source_word: וַיָּבֵא אֹתוֹ בְּאָלָה
  english_pob_choice: bringing him under an oath
  chosen_korean: 그를 맹세 아래 두었으며
  alternatives_korean:
  - 그를 맹세 아래 들였으며
  - 그를 저주 서약 아래 두었으며
  - 그를 맹세와 저주 아래 두었으며
  lexicon: HALOT
  rationale: אָלָה의 핵심을 ‘맹세’로 살리되, 강제적 구속의 뉘앙스를 한국어 자연문으로 표현했습니다. 영어 주석이 말하는 ‘curse-oath’의 가능성은 본문에 과도하게 풀지 않았습니다.
- source_word: אֵילֵי הָאָרֶץ
  english_pob_choice: the mighty men of the land
  chosen_korean: 그 땅의 강한 자들
  alternatives_korean:
  - 그 땅의 용사들
  - 그 땅의 귀족들
  - 그 땅의 지도자들
  lexicon: HALOT
  rationale: אֵילִים의 비유적 강함을 직접 살려 ‘강한 자들’로 옮겼습니다. 직분이나 신분을 특정하는 표현보다 원문의 힘의 이미지를 보존합니다.
theological_decisions:
- issue: אָלָה의 의미 범위
  chosen_reading: 본문에는 ‘맹세 아래 두었다’로 두고, curse-oath의 저주성은 본문 밖에서 과도하게 단정하지 않았습니다.
  alternative_readings:
  - 그를 저주 아래 두었다
  - 그를 저주-맹세 아래 두었다
  rationale: 소스어 אָלָה는 맹세와 저주 가능성을 함께 가지지만, 여기서는 맹세의 구속력을 전면에 두는 것이 본문 흐름에 더 자연스럽습니다.
  doctrine_reference: Translation philosophy §3
- issue: 언약 용어 유지
  chosen_reading: ‘언약’으로 유지했습니다.
  alternative_readings:
  - 조약
  - 계약
  rationale: 히브리어 בְּרִית의 신학적·관계적 무게를 보존하기 위해, 세속적 행정 용어로 환원하지 않았습니다.
  doctrine_reference: Translation philosophy §1
