- from: 그는 왕족의 씨앗 가운데서 한 사람을 데려다가 그와 언약을 맺고 그를 맹세 아래 두었으며, 그 땅의 강한 자들도 데려갔습니다.[a]
  to: 그는 왕실의 후손 중 한 사람을 데려다가 그와 언약을 맺고, 그에게 맹세를 하게 했으며[a], 그 땅의 유력자들을 데려갔습니다.
