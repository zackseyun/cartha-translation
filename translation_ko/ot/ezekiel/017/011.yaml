lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: came
  chosen_korean: 임하여
  alternatives_korean:
  - 오시어
  - 이르러
  - 도착하여
  lexicon: HALOT
  rationale: 예언문 공식인 “말씀이 … came”의 도래·임함을 자연스러운 현대 한국어로 옮겨, 단순한 존재 서술보다 계시의 도착성을 살렸습니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 메시지
  - 말
  - 사건
  lexicon: HALOT
  rationale: ‘야훼의 말씀’은 예언서의 고정된 공식을 이루므로, POB의 ‘the word’를 한국어 성경 용례에 맞게 ‘말씀’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 테트라그람마톤을 관례적 대체어가 아니라 신명 표기인 ‘야훼’로 옮겨, POB의 소스 직접성을 유지했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하여 이르시기를
  - 말씀하여
  lexicon: HALOT
  rationale: 직접 인용 도입어로서의 לֵאמֹר은 한국어에서 반복 동사의 종결형으로 자연스럽게 이어지므로, 뒤의 발화 시작을 분명히 하는 ‘말씀하셨습니다’로 처리했습니다.
theological_decisions:
- issue: 예언 공식의 문체 유지
  chosen_reading: ‘야훼의 말씀이 내게 임하여 말씀하셨습니다’로 예언적 계시 수식을 보존했습니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 와서 말하였다’
  - ‘야훼의 말씀이 내게 임하였습니다’
  rationale: 이 절은 내용 진술보다 계시 도입 공식이 핵심이므로, 도래(임함)와 발화(말씀하셨습니다)를 함께 드러내는 형태가 원문의 기능을 가장 잘 반영합니다.
  doctrine_reference: 예언서 서두 공식과 신적 계시의 직접성
