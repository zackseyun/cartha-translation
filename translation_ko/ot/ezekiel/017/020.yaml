  to: 내가 그 위에 내 그물을 펼치고, 그는 내 올무에 걸릴 것입니다. 내가 그를 바벨론으로 데려가서, 거기에서 그가 나를 배신한 그의 배신 때문에 그와 더불어 심판하겠습니다.[a][b]
