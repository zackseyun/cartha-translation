    rationale: אִתּוֹ는 그를 상대로/그와 더불어 이루어지는 사법적 대면을 나타냅니다. ‘함께 심판하다’는 한국어에서 함께 재판하는 뜻으로 오해될 수 있습니다.
  - severity: medium
    issue: מַעַל을 ‘반역’으로 한정함
    rationale: 문맥에는 왕의 반역이 포함되지만, 원어는 하나님을 향한 배신·신의 위반을 강조합니다. ‘배신’이 정치적 반란으로만 좁히지 않고 반복 어근도 살립니다.
  - severity: low
