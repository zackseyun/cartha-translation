id: EZK.17.20
reference: Ezekiel 17:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פָרַשְׂתִּ֤י עָלָי/ו֙ רִשְׁתִּ֔/י וְ/נִתְפַּ֖שׂ בִּ/מְצֽוּדָתִ֑/י וַ/הֲבִיאוֹתִ֣י/הוּ בָבֶ֗לָ/ה וְ/נִשְׁפַּטְתִּ֤י אִתּ/וֹ֙ שָׁ֔ם מַעֲל֖/וֹ אֲשֶׁ֥ר מָֽעַל בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/020.yaml
  text: I will spread my net over him[a], and he will be caught in my snare; then I will bring him to Babylon[b], and there I will enter into judgment with him for his treachery by which he acted treacherously against me.
  footnotes:
  - marker: a
    text: Or 'there I will judge him.' The Hebrew expression can be rendered more simply, but the wording used in the main text preserves the legal nuance of entering into judgment with him.
    reason: lexical_alternative
  - marker: b
    text: '''Treachery'' may also be rendered ''unfaithfulness'' or ''breach of faith.'' The Hebrew emphasizes covenant violation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그 위에 내 그물을 펼치고, 그는 내 올무에 걸릴 것입니다. 내가 그를 바벨론으로 데려가서, 거기에서 그가 나를 배신한 그의 배신 때문에 그와 더불어 심판하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그와 더불어 심판하겠습니다’는 더 단순하게 ‘그를 심판하겠습니다’로도 옮길 수 있습니다. 그러나 히브리어 표현은 그와 법정적으로 대면하여 심판한다는 뉘앙스를 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘배신’은 ‘불성실’ 또는 ‘신의 위반’으로도 옮길 수 있습니다. 히브리어는 맹세와 언약을 깨뜨린 배신을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרַשְׂתִּי / רִשְׁתִּי
  english_pob_choice: I will spread my net
  chosen_korean: 내 그물을 펼치면
  alternatives_korean:
  - 내 그물을 펼치겠습니다
  - 내 그물을 드리우면
  - 내 그물을 던지면
  lexicon: WLC; HALOT
  rationale: פָרַשׂ의 기본 뜻인 ‘펴다/펼치다’를 살리고, רֶשֶׁת을 자연스러운 ‘그물’로 옮겼습니다.
- source_word: וְנִתְפַּשׂ בִּמְצוּדָתִי
  english_pob_choice: he will be caught in my snare
  chosen_korean: 그는 내 덫에 걸릴 것이며
  alternatives_korean:
  - 그는 내 올무에 걸릴 것이며
  - 그는 내 함정에 빠질 것이며
  - 그는 내 덫에 잡힐 것이며
  lexicon: WLC; HALOT
  rationale: 그물과 평행을 이루는 포획 이미지를 살리기 위해 ‘덫에 걸리다’를 택했습니다. מְצוּדָה의 사냥/포획 의미를 반영합니다.
- source_word: וְנִשְׁפַּטְתִּי אִתּוֹ שָׁם
  english_pob_choice: there I will enter into judgment with him
  chosen_korean: 거기서 그와 함께 심판하겠습니다
  alternatives_korean:
  - 거기서 그를 심판하겠습니다
  - 거기서 그와 법정에서 다투겠습니다
  - 거기서 그와 함께 판결하겠습니다
  lexicon: WLC; HALOT
  rationale: 히브리어의 משפט 계열 법정적 뉘앙스를 살리되, 한국어에서는 ‘심판하다’가 문맥상 자연스럽고 무게감 있게 전달됩니다.
- source_word: מַעֲלוֹ / מָעַל בִּי
  english_pob_choice: his treachery ... he acted treacherously against me
  chosen_korean: 그의 반역에 대하여, 곧 그가 나를 배반하여 저지른 반역에 대하여
  alternatives_korean:
  - 그의 배신에 대하여, 곧 그가 나에게 불성실하게 군 배신에 대하여
  - 그의 불충에 대하여, 곧 그가 나를 저버리고 저지른 불충에 대하여
  - 그의 간사함에 대하여, 곧 그가 나를 거슬러 저지른 간사함에 대하여
  lexicon: WLC; HALOT
  rationale: מַעַל의 핵심은 언약/맹세를 깨는 배반이므로, 한국어에서는 중량감 있는 ‘반역/배반’으로 옮겨 그 정치적·언약적 위반을 함께 드러냈습니다.
theological_decisions:
- issue: וְנִשְׁפַּטְתִּי אִתּוֹ의 법정적 뉘앙스
  chosen_reading: ‘거기서 그와 함께 심판하겠습니다’로 옮겨, 단순한 처벌 선언이 아니라 법정적 대면의 의미를 남겼습니다.
  alternative_readings:
  - 거기서 그를 심판하겠습니다
  - 거기서 그와 다투겠습니다
  rationale: 히브리어는 단순 판결보다 ‘심판에 들어가다/심판하다’의 관계적·법적 긴장을 담고 있어, 그 뉘앙스를 평이하게 축소하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
