review_pass:
  verdict: revise
  source_fidelity: 본문의 ‘그 위에’와 ‘바벨론으로’는 대체로 원문에 맞습니다. 그러나 ‘펼치면’은 원문의 연속된 미래 행위를 조건문처럼 만들며, ‘반역’은 מַעַל의 핵심인 신의·언약 위반보다 정치적 반란으로 의미를 좁힐 수 있습니다. 또한 ‘그와 함께 심판하겠습니다’는 한국어에서 그와 공동으로 심판한다는 뜻으로도 읽힐 수 있습니다.
  naturalness: 현대 표준어 합쇼체로 문장을 미래 서술형으로 정리하고, משפט의 대면적·법정적 뜻은 ‘그와 더불어 심판하겠습니다’로 보존하는 것이 더 적절합니다. 각 주석 표지는 해당 어구 바로 뒤에 두어야 합니다.
  terminology: מַעַל / מָעַל בִּי는 ‘배신’과 그 반복으로 옮겨, 맹세·언약을 저버린 행위라는 뜻을 유지합니다. ‘올무’는 그물과 병행되는 포획 비유에 자연스럽고, מְצוּדָה의 문맥상 의미에도 맞습니다.
  issues:
  - severity: medium
    issue: ‘내 그물을 그 위에 펼치면’이 조건절로 번역됨
    rationale: וּפָרַשְׂתִּי는 뒤따르는 동사들과 연속되는 하나님의 미래 행위입니다. 조건 관계를 나타내는 ‘-면’보다 ‘펼치고’가 적절합니다.
  - severity: medium
