  text: לָ/כֵ֞ן כֹּה אָמַ֨ר אֲדֹנָ֣/י יְהוִה֮ חַי אָנִי֒ אִם לֹ֗א אָֽלָתִ/י֙ אֲשֶׁ֣ר בָּזָ֔ה וּ/בְרִיתִ֖/י אֲשֶׁ֣ר הֵפִ֑יר וּ/נְתַתִּ֖י/ו בְּ/רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/019.yaml
  text: 'Therefore thus says the Lord GOD: As I live[a], surely my oath that he despised and my covenant that he broke—I will place them on his own head.'
  footnotes:
  - marker: a
    text: Or 'my curse'; the Hebrew term can denote an oath that carries a curse for violation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. 「내가 살아 있는 한, 그가 멸시한 나의 맹세와 그가 깨뜨린 나의 언약을—내가 그의 머리 위에 돌려놓겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나의 저주’. 히브리어 אָלָה는 위반 시 저주가 따르는 맹세를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 말씀하십니다
  - 이같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 선포 공식의 격식을 살리면서도 현대 한국어에서 자연스럽게 들리도록 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: יהוה를 프로젝트 기본값에 따라 야훼로 살리고, אֲדֹנָי와 결합된 호칭 구조를 한국어에서 간결하게 반영했습니다.
- source_word: אָלָתִי
  english_pob_choice: my oath
  chosen_korean: 나의 맹세
  alternatives_korean:
  - 나의 저주
  - 나의 맹세-저주
  lexicon: HALOT
  rationale: 문맥상 위반된 맹세가 핵심이므로 ‘맹세’로 옮기되, אָלָה에 내포될 수 있는 저주 성격은 본문 주석으로 남길 수 있습니다.
- source_word: וּנְתַתִּיו בְּרֹאשׁוֹ
  english_pob_choice: I will place them on his own head
  chosen_korean: 그의 머리 위에 돌려놓겠습니다
  alternatives_korean:
  - 그의 머리 위에 두겠습니다
  - 그의 머리로 되돌리겠습니다
  lexicon: HALOT
  rationale: 책임과 심판을 가해자에게 되돌리는 관용적 표현을 한국어로 자연스럽게 살리기 위해 ‘돌려놓겠습니다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 음역을 한국어 본문에서 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본값에 따라 언약 이름을 야훼로 보존하여, 호칭 일반어인 ‘주’와 구별했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: ‘맹세’와 ‘저주’의 긴장 처리
  chosen_reading: 나의 맹세
  alternative_readings:
  - 나의 저주
  - 나의 저주를 동반한 맹세
  rationale: 본절의 초점은 파기된 서약 자체이므로 본문에는 ‘맹세’를 두고, אָלָה가 가질 수 있는 저주-제재 뉘앙스는 주석으로 보존하는 것이 가장 충실합니다.
  doctrine_reference: English POB lexical note on אָלָה
