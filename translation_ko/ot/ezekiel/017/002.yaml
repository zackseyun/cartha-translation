translation:
  language: ko
  text: 인자야, 수수께끼를 내고 이스라엘 집에게 비유를 말하여라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람아’, ‘인간아’, ‘필멸자야’. 히브리어 관용구 ‘인자’를 여기서도 유지해 에스겔서의 반복적 호칭을 보존했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘잠언’. 히브리어 מָשָׁל은 잠언, 비유, 상징적 말을 모두 가리킬 수 있으며, 여기서는 확장된 비유적 담화가 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 인간아
  - 필멸자야
  lexicon: WLC/HALOT
  rationale: 에스겔에서 반복되는 직접 호칭을 살리면서도, 한국어에서는 자연스럽고 간결한 호격으로 옮기기 위해 ‘인자’로 처리했습니다. 여기서는 그리스도론적 칭호가 아니라 예언자에 대한 호칭입니다.
- source_word: חוּד חִידָה
  english_pob_choice: pose a riddle
  chosen_korean: 수수께끼를 내고
  alternatives_korean:
  - 수수께끼를 제시하고
  - 수수께끼를 말하고
  - 수수께끼를 풀게 하고
  lexicon: HALOT
  rationale: 동사의 명령형은 ‘내다’가 한국어에서 가장 자연스럽게 수수께끼를 제시하는 행위를 나타냅니다. ‘풀다’는 방향이 반대이므로 배제했습니다.
- source_word: וּמְשֹׁל מָשָׁל
  english_pob_choice: speak a parable
  chosen_korean: 비유를 말하여라
  alternatives_korean:
  - 비유를 하여라
  - 잠언을 말하여라
  - 비유적인 말을 하여라
  lexicon: HALOT
  rationale: מָשָׁל은 문맥상 단순한 속담보다 확장된 비유적 말하기에 가깝기 때문에 ‘비유’로 옮겼습니다. ‘말하여라’는 명령의 힘을 살리면서도 현대 한국어로 자연스럽습니다.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  english_pob_choice: to the house of Israel
  chosen_korean: 이스라엘 집에게
  alternatives_korean:
  - 이스라엘 집에
  - 이스라엘에게
  - 이스라엘 가문에게
  lexicon: HALOT
  rationale: ‘집’은 공동체적·언약적 표현을 유지하기 위해 살렸고, ‘에게’는 목적어 표지를 자연스럽게 드러냅니다. ‘이스라엘’로만 줄이면 원문의 집합적 표현이 약해집니다.
theological_decisions:
- issue: 에스겔 17:2의 בֶּן אָדָם 호칭 처리
  chosen_reading: ‘인자’로 옮겨 예언자에게 직접 말하는 호칭을 유지했습니다.
  alternative_readings:
  - 사람아
  - 인간아
  - 필멸자야
  rationale: 이 구절의 ‘인자’는 신학적 직함이 아니라 에스겔서의 반복적 호칭입니다. 따라서 의미를 풀어쓰기보다 반복되는 문학적 장치를 보존하는 편이 본문 의도에 더 충실합니다.
  doctrine_reference: 번역 원칙 §§1, 4
