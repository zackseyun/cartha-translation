    text: 또는 ‘사람아’, ‘인간아’, ‘필멸자야’. 히브리어 관용구 ‘인자’를 여기서도 유지하여 에스겔서에서 반복되는 호칭을 보존했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘잠언’. 히브리어 מָשָׁל은 잠언, 비유, 상징적 표현을 모두 가리킬 수 있으며, 여기서는 확장된 비유적 담화에 ‘비유’가 더 잘 맞습니다.
    reason: lexical_alternative
