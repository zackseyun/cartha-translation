  lexicon: HALOT
  rationale: מָשָׁל은 문맥상 단순한 속담보다 확장된 비유적 말하기에 가깝기 때문에 ‘비유’로 옮겼습니다. ‘말하여라’는 명령의 힘을 살리면서도 현대 한국어로 자연스럽습니다.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  english_pob_choice: to the house of Israel
  chosen_korean: 이스라엘 집에게
  alternatives_korean:
