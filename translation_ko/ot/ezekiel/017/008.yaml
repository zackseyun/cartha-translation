translation:
  language: ko
  text: 그것은 좋은 밭, 물이 풍부한 곳에 심겨 있었습니다. 가지를 내고 열매를 맺어 장엄한 포도나무가 되도록 하려는 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 물 곁에’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘찬란한 포도나무’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל שָׂדֶה טּוֹב
  english_pob_choice: a good field
  chosen_korean: 좋은 밭
  alternatives_korean:
  - 좋은 들판
  - 비옥한 밭
  lexicon: HALOT
  rationale: שָׂדֶה는 ‘땅’보다 구체적인 ‘밭’이 자연스럽고, טּוֹב의 기본 의미를 살려 ‘좋은’으로 직역에 가깝게 유지했습니다.
- source_word: אֶל מַיִם רַבִּים
  english_pob_choice: by abundant waters
  chosen_korean: 많은 물가에
  alternatives_korean:
  - 풍부한 물 곁에
  - 많은 물들 옆에
  lexicon: HALOT
  rationale: 식재 위치를 나타내는 전치사 값을 살리되, 한국어에서는 ‘물가에’가 자연스럽고, רַבִּים의 풍성함을 ‘많은’으로 담았습니다.
- source_word: לַעֲשׂוֹת עָנָף וְלָשֵׂאת פֶּרִי
  english_pob_choice: to produce branches and bear fruit
  chosen_korean: 가지를 내고 열매를 맺어
  alternatives_korean:
  - 가지를 만들고 열매를 맺어
  - 가지를 뻗고 열매를 맺어
  lexicon: HALOT
  rationale: עָנָף와 פֶּרִי의 식물 비유를 자연스러운 한국어 동사구로 옮겼고, ‘열매를 맺다’는 נשא פְּרִי의 관용적 의미를 잘 반영합니다.
- source_word: לִהְיוֹת לְגֶפֶן אַדָּרֶת
  english_pob_choice: to become a majestic vine
  chosen_korean: 위엄 있는 포도나무가 되었습니다
  alternatives_korean:
  - 장엄한 포도나무가 되었습니다
  - 찬란한 포도나무가 되었습니다
  lexicon: HALOT
  rationale: אַדָּרֶת의 ‘위엄/장엄/화려함’ 가운데, 문맥상 외형적·상징적 고양을 함께 담는 ‘위엄 있는’이 가장 균형적입니다.
theological_decisions:
- issue: 예언적 비유의 서술 시제와 어조
  chosen_reading: 과거 완료적 상황을 살려 ‘되었습니다’로 옮겼습니다.
  alternative_readings:
  - ‘되었습니다’ 대신 ‘있습니다’로 현재적 묘사를 택하는 방식
  rationale: 히브리어 분사 שְׁתוּלָה와 전체 비유는 이미 심겨 성장한 상태를 묘사하므로, 한국어도 사건의 완료된 상태를 분명히 드러내는 것이 적절합니다.
  doctrine_reference: 문맥적 서술 정확성
- issue: ‘위엄 있는’의 표현 강도
  chosen_reading: ‘위엄 있는 포도나무’로 번역해 높임과 장엄함을 모두 유지했습니다.
  alternative_readings:
  - ‘아름다운’ 포도나무
  - ‘뛰어난’ 포도나무
  rationale: 본문의 אַדָּרֶת은 단순한 미적 칭찬보다 더 높은 품위와 장중함을 가리키므로, 이를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 예언서의 상징적 언어 보존
