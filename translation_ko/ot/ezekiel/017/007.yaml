  lexicon: HALOT
  rationale: 겹친 גדול의 강조를 살려 '큰'을 반복해 규모와 날개의 장대함을 함께 드러냈습니다.
- source_word: רַב נוֹצָה
  english_pob_choice: much plumage
  chosen_korean: 깃털이 많았습니다
  alternatives_korean:
  - 풍성한 깃털을 지녔습니다
  - 깃이 무성했습니다
  lexicon: HALOT
  rationale: 직역적이되 한국어로 자연스러운 표현을 택해 조류의 깃이 많은 모습을 전달했습니다.
- source_word: כָּפְנָה שָׁרֳשֶׁיהָ עָלָיו ... דָלִיּוֹתָיו שִׁלְחָה לּוֹ
  english_pob_choice: bent its roots toward him and sent out its branches to him
  chosen_korean: 뿌리를 굽히고 가지들을 그에게 뻗었습니다
  alternatives_korean:
  - 뿌리를 그에게로 돌리고 가지를 내밀었습니다
  - 뿌리를 그쪽으로 향하게 하고 가지를 뻗었습니다
  lexicon: HALOT
  rationale: 뿌리와 가지의 방향 전환이라는 시각적 이미지를 살리기 위해 '굽히고/뻗었습니다'로 옮겼습니다. POB의 어순처럼 뿌리와 가지가 둘 다 그를 향함을 드러냅니다.
theological_decisions:
- issue: 마지막 목적절의 관계
  chosen_reading: 포도나무의 움직임은 '그것을 심은 밭의 고랑들에서' 물을 얻으려는 방향 전환을 보여 줍니다.
  alternative_readings:
  - 그가 그것에 물을 주려는 것이다
  - 물 주는 행위의 출처를 나타내는 말
  rationale: 히브리어 문맥과 POB 수정 이력은 '밭의 고랑들'을 물 주는 도구가 아니라 포도나무가 물을 구하려는 자리로 읽어야 함을 보여 줍니다. 따라서 목적절을 독수리의 행위에 연결해 문맥을 보존했습니다.
  doctrine_reference: 문맥-문법 일치 원칙
- issue: 직유적 알레고리의 유지
  chosen_reading: 포도나무와 독수리를 문자적 서술로 평탄화하지 않고 상징적 장면으로 유지했습니다.
  alternative_readings:
  - 상징을 풀어 설명하는 번역
  - 의역하여 의미만 제시
  rationale: 에스겔 17장의 비유 구조를 훼손하지 않도록 이미지 자체를 보존했습니다.
  doctrine_reference: 성경 본문 서사의 알레고리 보존
