base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/005.yaml
  text: Then he took some of the seed of the land and planted it in fertile soil[a]; he placed it beside abundant waters, like a willow.
  footnotes:
  - marker: a
    text: Or "poplar" for the final plant term; the Hebrew צַפְצָפָה is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 땅의 씨앗 일부를 가져다가 파종하기 좋은 밭에 심고, 많은 물 곁에 두어 버드나무처럼 심었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “포플러”로도 옮길 수 있습니다. 히브리어 צַפְצָפָה의 뜻은 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרַע הָאָרֶץ
  english_pob_choice: some of the seed of the land
  chosen_korean: 그 땅의 씨앗 중에서 얼마를
  alternatives_korean:
  - 그 땅의 씨앗 일부를
  - 그 땅에서 난 씨앗 중 일부를
  - 그 땅의 종자 중 일부를
  lexicon: HALOT
  rationale: מִן의 부분적 의미를 살려 ‘중에서 얼마를’로 옮기고, זֶרַע는 혈통적 ‘후손’이 아니라 농업적 ‘씨앗’으로 유지했습니다.
- source_word: וַיִּתְּנֵהוּ
  english_pob_choice: planted it
  chosen_korean: 심고
  alternatives_korean:
  - 두고
  - 놓고
  - 심어
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘주다/두다’보다 심기 동작을 드러내는 것이 씨앗-농사 이미지에 맞으므로 ‘심다’로 풀었습니다.
- source_word: בִּשְׂדֵה זָרַע + קָח
  english_pob_choice: in fertile soil
  chosen_korean: 기름진 땅에
  alternatives_korean:
  - 파종하기 좋은 밭에
  - 씨 뿌리기에 좋은 밭에
  - 비옥한 땅에
  lexicon: HALOT
  rationale: 직역하면 ‘씨의 밭’이지만, 여기서는 파종에 알맞은 장소를 뜻하므로 자연스러운 한국어로 ‘기름진 땅’이라 옮겼습니다.
- source_word: עַל מַיִם רַבִּים
  english_pob_choice: beside abundant waters
  chosen_korean: 많은 물가 곁에
  alternatives_korean:
  - 많은 물들 곁에
  - 풍부한 물가에
  - 흐르는 많은 물가에
  lexicon: HALOT
  rationale: עַל의 위치 용법을 살려 ‘곁에’로 옮기고, ‘많은 물’은 물이 풍부한 자리라는 이미지를 유지하면서 한국어로 자연화했습니다.
- source_word: צַפְצָפָה שָׂמוֹ
  english_pob_choice: like a willow
  chosen_korean: 버드나무처럼 만들었습니다
  alternatives_korean:
  - 버드나무처럼 두었습니다
  - 버드나무로 만들었습니다
  - 버드나무처럼 세웠습니다
  lexicon: HALOT
  rationale: צַפְצָפָה의 수종이 불확실하므로 본문에는 ‘버드나무처럼’으로 두고, 비교/지정의 동작을 한국어로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 식물 명칭 צַפְצָפָה의 불확실성 처리
  chosen_reading: 본문은 ‘버드나무처럼’으로 두고, 특정 수종 단정은 피했습니다.
  alternative_readings:
  - 포플러처럼
  - 버드나무 또는 포플러처럼
  rationale: 히브리어 식물명이 불확실하므로 본문은 유동적인 비교 표현을 유지하고, 특정화는 각주에서만 열어 두는 것이 원문과 기존 POB 주석 모두에 충실합니다.
  doctrine_reference: 본문 의미 보존과 주석적 보류 원칙
- issue: 농경 비유의 보존
  chosen_reading: ‘심고 / 많은 물가 곁에’로 농업·재배 이미지가 살아 있도록 옮겼습니다.
  alternative_readings:
  - 두고 / 물가에
  - 옮겨 심고 / 물가에
  rationale: 에스겔 17장의 비유는 행위의 연쇄가 핵심이므로, 원문의 심기·배치·물가 이미지를 약화시키지 않도록 직관적이면서도 구체적으로 유지했습니다.
  doctrine_reference: 예언 비유 해석의 문맥 우선 원칙
