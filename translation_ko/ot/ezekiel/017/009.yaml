  source_fidelity: 마지막 절의 ‘큰 팔/많은 사람’ 구문은 단순히 그들이 그것을 들어 올릴 수 없다는 뜻이라기보다, 그것을 뿌리째 들어 올리는 데 큰 힘과 많은 사람이 필요하지 않다는 뜻입니다. 또한 신명은 제공된 POB 용어 원칙에 따라 ‘야훼’로 옮기는 것이 일관됩니다.
  naturalness: ‘뿌리째 들어 올리는 데에는 큰 팔과 많은 사람이 필요하지 않을 것입니다’는 히브리어의 수단·필요성의 뉘앙스를 자연스러운 현대 공적 한국어로 드러냅니다. ‘큰 팔’은 직역적 비유로 유지하되 주석으로 의미를 보완했습니다.
  terminology: אֲדֹנָי יְהוִה는 ‘주 야훼’로, 식물 은유인 뿌리·열매·푸른 잎은 유지했습니다. ‘큰 팔’은 זְרוֹעַ의 문자적 표현을 보존합니다.
  issues:
  - severity: high
    issue: 마지막 문장의 의미가 ‘들어 올릴 수 없음’으로 바뀌었습니다.
