  revised_text: 말하십시오. 「주 야훼께서 이렇게 말씀하십니다. 그것이 번성하겠습니까? 그 뿌리를 뽑고 그 열매를 잘라 내어 그것을 마르게 하지 않겠습니까? 그 자라난 모든 푸른 잎은 시들 것입니다. 그것을 뿌리째 들어 올리는 데에는 큰 팔[a]과 많은 사람이 필요하지 않을 것입니다.」
