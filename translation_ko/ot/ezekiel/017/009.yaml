base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/009.yaml
  text: 'Say[a], ‘Thus says the Lord GOD: Will it prosper? Will he not pull up its roots and cut off its fruit, so that it dries up? All the fresh leaves of its growth will wither[b]. And not by a great arm or by many people will it be lifted from its roots.’'
  footnotes:
  - marker: a
    text: Hebrew 'arm'; a figurative expression for strength or power.
    reason: lexical_alternative
  - marker: b
    text: Or 'uproot its roots' for the first clause; the Hebrew verb can emphasize tearing loose or pulling away.
    reason: lexical_alternative
translation:
  language: ko
  text: 말하십시오. 「주 여호와께서 이렇게 말씀하십니다. 그것이 번성하겠습니까? 그 뿌리를 뽑아 버리고 그 열매를 잘라 내어 마르게 하지 않겠습니까? 그 자라난 모든 푸른 잎도 시들 것입니다. 큰 팔이나 많은 사람으로도 그것을 뿌리에서 들어 올리지 못할 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘큰 팔’은 히브리어 ‘팔’의 비유적 표현으로, 힘이나 권능을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뽑아 버리고’는 뿌리를 “뽑다/잡아당겨 떼다”의 의미를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  english_pob_choice: Say
  chosen_korean: 말하십시오
  alternatives_korean:
  - 말하시오
  - 이르십시오
  lexicon: HALOT
  rationale: 예언자에게 주어지는 명령형 도입구로서, 한국어에서는 짧고 직접적인 ‘말하십시오’가 가장 자연스럽고 공적인 느낌을 살립니다.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  english_pob_choice: Thus says the Lord GOD
  chosen_korean: 주 여호와께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주 야훼께서 이렇게 말씀하십니다
  - 주 하나님께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 아도나이+יהוה의 결합은 한국어 관용에 따라 ‘주 여호와’로 옮기되, 예언 선포 공식의 장중함은 ‘이렇게 말씀하십니다’로 유지했습니다.
- source_word: תִּצְלָח
  english_pob_choice: Will it prosper?
  chosen_korean: 그것이 번성하겠습니까?
  alternatives_korean:
  - 그것이 잘되겠습니까?
  - 그것이 성공하겠습니까?
  lexicon: HALOT
  rationale: 포도나무 이미지의 문맥상 단순 성공보다 생장·번성의 뉘앙스가 더 직접적이어서 ‘번성하다’로 옮겼습니다.
- source_word: וְלֹא בִזְרֹעַ גְּדוֹלָה וּבְעַם רָב
  english_pob_choice: And not by a great arm or by many people
  chosen_korean: 큰 팔이나 많은 사람으로도
  alternatives_korean:
  - 큰 힘이나 많은 사람으로도
  - 강한 팔이나 많은 무리로도
  lexicon: HALOT
  rationale: זְרוֹעַ의 비유적 의미를 살려 문자적으로 ‘팔’을 유지했고, 한국어에서는 도구·수단을 나타내는 ‘-으로도’가 본문의 부정적 수단 표현을 자연스럽게 살립니다.
theological_decisions:
- issue: יהוה의 한국어 표기와 예언 선포 공식
  chosen_reading: ‘주 여호와’와 ‘이렇게 말씀하십니다’를 함께 써서, 신명과 예언자 공식의 구분을 유지했습니다.
  alternative_readings:
  - 주 야훼
  - 여호와 하나님
  rationale: 이 절은 אֲדֹנָי와 יְהוָה가 결합된 전형적 예언 공식이므로, 한국 교회 독자에게 익숙하면서도 두 요소의 중복을 지우지 않는 표기가 가장 투명합니다.
  doctrine_reference: 'POB terminology: divine-name rendering in prophetic formulas'
