id: EZK.17.15
reference: Ezekiel 17:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּמְרָד בּ֗/וֹ לִ/שְׁלֹ֤חַ מַלְאָכָי/ו֙ מִצְרַ֔יִם לָֽ/תֶת ל֥/וֹ סוּסִ֖ים וְ/עַם רָ֑ב הֲ/יִצְלָ֤ח הֲ/יִמָּלֵט֙ הָ/עֹשֵׂ֣ה אֵ֔לֶּה וְ/הֵפֵ֥ר בְּרִ֖ית וְ/נִמְלָֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/015.yaml
  text: But he rebelled against him by sending his messengers to Egypt[a], that they might give him horses and many people. Will he prosper? Will he escape[b], who does these things? Can he break a covenant and yet escape?
  footnotes:
  - marker: a
    text: Or 'horses and a large army' / 'horses and many troops'; the Hebrew reads literally 'horses and many people,' referring in context to military support from Egypt.
    reason: lexical_alternative
  - marker: b
    text: Or 'violate a covenant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 자기의 사자들을 보내어 그들이 그에게 말과 많은 백성을 주게 하려고 이집트에 반역하였습니다. 그가 형통하겠습니까? 이런 일들을 하는 그가 도망하겠습니까? 그가 언약을 깨뜨리고도 도망하겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘말과 많은 사람’입니다. 문맥상 군사 지원을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘언약을 어기다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְרָד בּוֹ
  english_pob_choice: rebelled against him
  chosen_korean: 자기의 사자들을 보내어
  alternatives_korean:
  - 그에게 반역하였는데
  - 그를 거슬러 반란하였는데
  lexicon: HALOT
  rationale: מרד는 정치적 종속 관계에서의 반역을 뜻하므로 ‘반역하다’를 썼고, 문맥상 그 반역의 방식인 외교 사절 파견을 뒤에 자연스럽게 붙였습니다.
- source_word: מַלְאָכָיו
  english_pob_choice: his messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 사신들
  - 전령들
  lexicon: HALOT
  rationale: מלאך는 문맥상 외교 사절을 가리키므로 일반적인 ‘사자들’이 가장 무난하며, ‘사신들’도 가능하지만 본문은 신적 사자보다 인간 사절입니다.
- source_word: מִצְרַיִם
  english_pob_choice: to Egypt
  chosen_korean: 이집트에
  alternatives_korean:
  - 애굽에
  lexicon: HALOT
  rationale: 지명은 현대 표준 표기인 ‘이집트’를 사용했습니다.
- source_word: סוּסִים וְעַם רָב
  english_pob_choice: horses and many people
  chosen_korean: 말과 많은 백성
  alternatives_korean:
  - 말과 많은 사람
  - 말과 많은 군대
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘말과 많은 사람’이지만, 문맥상 군사 원조를 뜻하므로 ‘백성’으로 살리되 과도한 구체화는 피했습니다.
- source_word: הֲיִצְלָח
  english_pob_choice: Will he prosper?
  chosen_korean: 그가 형통하겠습니까?
  alternatives_korean:
  - 그가 성공하겠습니까?
  - 그가 잘되겠습니까?
  lexicon: HALOT
  rationale: צָלַח은 단순 성공보다 결과적 번영·성취를 포함하므로 ‘형통하다’가 예언적 수사에 더 가깝습니다.
- source_word: הֲיִמָּלֵט ... וְנִמְלָט
  english_pob_choice: Will he escape? ... and yet escape
  chosen_korean: 도망하겠습니까? ... 도망하겠습니까?
  alternatives_korean:
  - 벗어나겠습니까? ... 벗어나겠습니까?
  - 피하겠습니까? ... 피하겠습니까?
  lexicon: HALOT
  rationale: נמלט의 반복은 수사적 반문을 강조하므로 두 번 모두 ‘도망하다’로 옮겨 압박감을 유지했습니다.
- source_word: וְהֵפֵר בְּרִית
  english_pob_choice: Can he break a covenant
  chosen_korean: 언약을 깨뜨리고도
  alternatives_korean:
  - 언약을 어기고도
  - 계약을 깨뜨리고도
  lexicon: HALOT
  rationale: בְּרִית는 단순 계약보다 언약의 무게를 가지므로 ‘언약’을 유지했고, הפר는 ‘깨뜨리다’가 가장 직접적입니다.
theological_decisions:
- issue: ברית의 번역 범위
  chosen_reading: 언약
  alternative_readings:
  - 조약
  - 협정
  rationale: 본문은 국제정치 상황이지만, 예언서에서 ברית는 도덕적·신학적 책임을 동반하는 언약의 의미를 지니므로 약화시키지 않았습니다.
  doctrine_reference: Translation philosophy §1, §5
