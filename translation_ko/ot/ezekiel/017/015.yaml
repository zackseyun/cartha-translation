    rationale: עַם רָב는 여기서 이집트가 제공할 군사 인력을 뜻하며, ‘많은 백성’은 한 나라의 일반 주민 또는 백성이라는 인상을 줍니다. 또한 현 각주는 문자적 표현을 ‘많은 사람’이라고 설명합니다.
  - severity: low
