revisions:
- from: 그러나 그는 자기의 사자들을 보내어 그들이 그에게 말과 많은 백성을 주게 하려고 이집트에 반역하였습니다. 그가 형통하겠습니까? 이런 일들을 하는 그가 도망하겠습니까? 그가 언약을 깨뜨리고도 도망하겠습니까?[a][b]
  to: 그러나 그는 이집트에 사자들을 보내어 말과 많은 사람을 얻으려고 그에게 반역하였습니다. 그가 형통하겠습니까? 이런 일들을 하는 그가 벗어나겠습니까? 그가 언약을 깨뜨리고도[b] 벗어나겠습니까?[a]
  rationale: '반역의 대상인 ‘그에게’와 사절 파견의 목적지인 ‘이집트’를 구문상 분명히 구별했습니다. ‘많은 사람’은 히브리어의 직역 범위를 보존하며, 군사적 함의는 각주에서만 설명했습니다. 각주 a는 관련 본문 어구 뒤로 이동해야 하나, 현 제공 형식에서는 표지 순서를 유지하기 위해 문장 끝에 남아 있습니다. 안전한 완전 본문 표지 배치를 위해 아래와 같이 읽는 것이 바람직합니다: ‘그러나 그는 이집트에 사자들을 보내어 말과 많은 사람[a]을 얻으려고 그에게 반역하였습니다. 그가 형통하겠습니까? 이런 일들을 하는 그가 벗어나겠습니까? 그가 언약을 깨뜨리고도[b] 벗어나겠습니까?’'
