id: EZK.17.10
reference: Ezekiel 17:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּ֥ה שְׁתוּלָ֖ה הֲ/תִצְלָ֑ח הֲ/לוֹא֩ כְ/גַ֨עַת בָּ֜/הּ ר֤וּחַ הַ/קָּדִים֙ תִּיבַ֣שׁ יָבֹ֔שׁ עַל עֲרֻגֹ֥ת צִמְחָ֖/הּ תִּיבָֽשׁ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/010.yaml
  text: And look[a], though it is planted[c][b], will it prosper? Will it not completely wither when the east wind touches it? It will wither on the beds where it sprouted.
  footnotes:
  - marker: a
    text: Or 'will surely dry up' / 'will utterly dry up'; the Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''East wind'' refers to the hot, destructive wind from the eastern desert, a common image of withering judgment.'
    reason: cultural_note
  - marker: c
    text: Or 'on the garden beds of its growth'; the Hebrew phrase refers to the cultivated plots where the plant had grown.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그것이 심겨졌는데도 번성하겠습니까? 동풍이 그것을 스치기만 해도 완전히 시들지 않겠습니까? 그것은 자라난 밭에서 시들 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘완전히 마르지 않겠습니까’. 히브리어는 강조를 위해 동사와 부정적 반복을 함께 씁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘동풍’은 동쪽 사막에서 불어오는 뜨겁고 파괴적인 바람을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘자란 밭에서’. 히브리어는 그 식물이 자라난 경작된 밭을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And look,
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사로서 문맥의 경고성을 살리기 위해 현대 한국어에서 자연스러운 ‘보십시오’를 선택했습니다.
- source_word: שְׁתוּלָה
  english_pob_choice: planted
  chosen_korean: 심겨졌는데도
  alternatives_korean:
  - 심어졌는데도
  - 옮겨심어졌는데도
  lexicon: HALOT
  rationale: 수동 분사로 된 ‘planted’의 상태를 살리면서, 이어지는 ‘번성하겠습니까?’와의 대조를 위해 자연스러운 수동형으로 옮겼습니다.
- source_word: תִּיבַשׁ יָבֹשׁ
  english_pob_choice: will completely wither
  chosen_korean: 완전히 시들지 않겠습니까
  alternatives_korean:
  - 반드시 시들지 않겠습니까
  - 완전히 마르지 않겠습니까
  lexicon: HALOT
  rationale: 동사+부정적 강조 구조의 반복을 한국어의 강조 표현으로 옮겨, 단순한 건조보다 식물 이미지에 맞는 ‘시들다’를 택했습니다.
- source_word: עַל עֲרֻגֹת צִמְחָהּ
  english_pob_choice: on the beds where it sprouted
  chosen_korean: 자라난 밭에서
  alternatives_korean:
  - 자라난 두둑에서
  - 자란 밭에서
  lexicon: HALOT
  rationale: ‘cultivated beds/plots’의 의미를 한국어 농경 이미지로 살리되, 문맥상 장소 표지를 간결하게 유지했습니다.
theological_decisions:
- issue: 동풍(רוח הקדים)의 이미지
  chosen_reading: ‘동풍’은 단순한 기상 현상이 아니라 심판을 가져오는 파괴적인 동풍으로 읽었습니다.
  alternative_readings:
  - 그냥 동쪽 바람으로 중립적으로 읽기
  - 자연 풍상으로만 읽기
  rationale: 본문의 비유는 식물이 말라 죽는 재난적 결과를 강조하므로, ‘동풍’이 가진 파괴성과 심판의 함의를 약화하지 않는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 예레미야 4:11-12, 호세아 13:15의 동풍 이미지와 연관되는 심판 비유
