  text: חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֗א בִּ/מְקוֹם֙ הַ/מֶּ֨לֶךְ֙ הַ/מַּמְלִ֣יךְ אֹת֔/וֹ אֲשֶׁ֤ר בָּזָה֙ אֶת אָ֣לָת֔/וֹ וַ/אֲשֶׁ֥ר הֵפֵ֖ר אֶת בְּרִית֑/וֹ אִתּ֥/וֹ בְ/תוֹךְ בָּבֶ֖ל יָמֽוּת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/016.yaml
  text: As I live[a], declares the Lord GOD, surely in the place of the king who made him king[b], whose oath he despised and whose covenant he broke—with him in the midst of Babylon he will die.
  footnotes:
  - marker: a
    text: Or 'whose curse-oath he despised'; the Hebrew word for 'oath' can carry the sense of an oath accompanied by a self-imprecation.
    reason: lexical_alternative
  - marker: b
    text: Or 'whose treaty he broke.' The Hebrew word commonly rendered 'covenant' can also refer to a political pact between kings.
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 살아 있음을 두고 맹세합니다—주 야훼의 말씀입니다—반드시 그를 왕으로 세운 왕이 있는 곳에서, 그 왕의 맹세[a]를 업신여기고 그 왕의 언약[b]을 깨뜨린 그가 그 왕과 함께 바벨론 한가운데서 죽을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저주가 따르는 맹세’로도 옮길 수 있습니다. 히브리어 ‘맹세’는 자기를 저주하는 서약의 뜻을 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 왕의 조약을 깨뜨린’으로도 옮길 수 있습니다. 이 단어는 왕들 사이의 정치적 조약을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָ֗נִי
