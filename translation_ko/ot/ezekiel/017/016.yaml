    issue: ‘왕의 자리에서’
    rationale: בִּמְקוֹם은 여기서 왕위나 좌석을 뜻하는 ‘자리’로 옮기기보다, 그를 즉위시킨 왕이 있는 ‘곳’으로 옮겨야 합니다. 뒤의 ‘그 왕과 함께 바벨론 한가운데서’와도 연결됩니다.
