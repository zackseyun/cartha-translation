source:
  edition: WLC
  text: חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֗א בִּ/מְקוֹם֙ הַ/מֶּ֨לֶךְ֙ הַ/מַּמְלִ֣יךְ אֹת֔/וֹ אֲשֶׁ֤ר בָּזָה֙ אֶת אָ֣לָת֔/וֹ וַ/אֲשֶׁ֥ר הֵפֵ֖ר אֶת בְּרִית֑/וֹ אִתּ֥/וֹ בְ/תוֹךְ בָּבֶ֖ל יָמֽוּת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/016.yaml
  text: As I live[a], declares the Lord GOD, surely in the place of the king who made him king[b], whose oath he despised and whose covenant he broke—with him in the midst of Babylon he will die.
  footnotes:
  - marker: a
    text: Or 'whose curse-oath he despised'; the Hebrew word for 'oath' can carry the sense of an oath accompanied by a self-imprecation.
    reason: lexical_alternative
  - marker: b
    text: Or 'whose treaty he broke.' The Hebrew word commonly rendered 'covenant' can also refer to a political pact between kings.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 살아 있노라 — 주 야훼의 말씀이니라 — 반드시 자기를 왕으로 세워 준 왕의 자리에서, 곧 그의 맹세를 업신여기고 그의 언약을 깨뜨린 그 왕과 함께 바벨론 한가운데서 그가 죽을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '저주가 따르는 맹세'로도 옮길 수 있습니다. 히브리어 '맹세'는 자기를 저주하는 서약의 뜻을 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그의 조약을 깨뜨린'으로도 옮길 수 있습니다. 이 단어는 왕들 사이의 정치적 조약을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָ֗נִי
  english_pob_choice: As I live
  chosen_korean: 내가 살아 있노라
  alternatives_korean:
  - 내가 살아 있습니다
  - 내 생명을 두고 말하노라
  lexicon: HALOT
  rationale: 히브리어 맹세 공식의 직접성을 살리면서, 하나님이 직접 말하는 선언으로 자연스럽고 엄중하게 옮겼습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 야훼의 말씀이니라
  alternatives_korean:
  - 주 하나님이 말씀하십니다
  - 주 야훼께서 선언하십니다
  lexicon: HALOT
  rationale: 예언적 공식을 살리되, 본문에 있는 아도나이+יהוה의 결합을 한국어로 그대로 반영했습니다.
- source_word: הַמַּמְלִיךְ אֹת֔/וֹ
  english_pob_choice: who made him king
  chosen_korean: 자기를 왕으로 세워 준
  alternatives_korean:
  - 왕으로 세운
  - 즉위시킨
  lexicon: HALOT
  rationale: מלך의 사역형 의미를 살려 단순히 '왕이 된'이 아니라 타자가 왕으로 세운 의존 관계를 드러냈습니다.
- source_word: אָלָה / בְּרִית
  english_pob_choice: whose oath he despised / whose covenant he broke
  chosen_korean: 그의 맹세를 업신여기고 그의 언약을 깨뜨린
  alternatives_korean:
  - 그의 맹세를 멸시하고 그의 계약을 어긴
  - 그의 저주 맹세를 업신여기고 그의 언약을 파기한
  lexicon: HALOT
  rationale: אָלָה의 맹세-저주 뉘앙스는 본문에서 '맹세'로 두고, בְּרִית는 정치적 조약 맥락을 유지하면서도 '언약'으로 옮겼습니다.
- source_word: בְּתוֹךְ בָּבֶל
  english_pob_choice: in the midst of Babylon
  chosen_korean: 바벨론 한가운데서
  alternatives_korean:
  - 바벨론 가운데서
  - 바벨론 안에서
  lexicon: HALOT
  rationale: 히브리어의 공간적 강조를 보존해, 그가 바벨론 내부에서 실제로 죽는다는 점을 분명히 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 직접적인 신명 표기를 유지하여 본문의 언약적 고유명을 드러냈습니다. 다만 문맥상 '주'와 결합한 예언 공식은 한국어에서 자연스럽게 읽히도록 '주 야훼'로 처리했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
