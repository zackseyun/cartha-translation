  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 בִּמְקוֹם הַמֶּלֶךְ는 왕의 ‘자리’(왕위·좌석)가 아니라 그를 왕으로 세운 왕이 있는 장소를 가리키므로 ‘왕의 자리에서’는 부정확하게 들립니다. 또한 ‘자기를 왕으로’의 재귀 지시는 한국어에서 왕 자신을 왕으로 세웠다는 뜻으로 오해될 수 있어 ‘그를 왕으로’로 고쳐야 합니다.
  naturalness: 초안의 ‘살아 있노라’, ‘말씀이니라’는 문어·고어체이며, 요청된 현대 표준어 합쇼체와 맞지 않습니다. 현대적인 예언 선언문으로 ‘내가 살아 있음을 두고 맹세합니다—주 야훼의 말씀입니다—’라고 하는 것이 자연스럽습니다. 각주 표지도 해당 어휘 바로 뒤에 두는 편이 독자에게 명확합니다.
  terminology: ‘야훼’, ‘맹세’, ‘언약’, ‘바벨론 한가운데’는 원문의 신명, אָלָה, בְּרִית, בְּתוֹךְ의 의미를 적절히 반영합니다. אָלָה의 저주 수반 가능성과 בְּרִית의 정치 조약 가능성을 다루는 각주도 유지할 수 있습니다.
  issues:
