revisions:
- from: 주 하나님께서 이렇게 말씀하십니다. 「내가 스스로 높은 백향목의 꼭대기에서 하나를 가져다가 두겠습니다[a]. 또 그 어린 가지들의 끝에서 연한 것을 내가 스스로 꺾어[b], 높고 솟은 산 위에 심겠습니다.」
  to: 주 야훼께서 이렇게 말씀하십니다. “내가 친히 높은 백향목의 꼭대기[a]에서 한 가지를 가져다가 놓겠습니다. 그 어린 싹들의 끝에서 여린 것[b]을 꺾어, 높고 우뚝 솟은 산 위에 내가 친히 심겠습니다.”
  rationale: 원문의 신명과 강조 대명사의 위치를 반영하고, 한국어 문장의 목적어 생략으로 인한 어색함을 최소한으로 보완했습니다. ‘한 가지’는 뒤의 ‘여린 것’, 곧 싹이나 가지의 형상을 한국어에서 자연스럽게 나타내는 문맥상 보완이며, 각주 b가 그 표현의 구체적 의미를 밝혀 줍니다.
