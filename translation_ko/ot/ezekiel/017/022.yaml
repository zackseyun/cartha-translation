    rationale: אָ֗נִי는 וְלָקַחְתִּי에, אָ֔נִי는 וְשָׁתַלְתִּי에 연결됩니다. אֶקְטֹף에는 명시적 대명사가 없으므로 그곳의 강조는 제거해야 합니다.
