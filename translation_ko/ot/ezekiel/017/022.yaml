reference: Ezekiel 17:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/לָקַ֣חְתִּי אָ֗נִי מִ/צַּמֶּ֧רֶת הָ/אֶ֛רֶז הָ/רָמָ֖ה וְ/נָתָ֑תִּי מֵ/רֹ֤אשׁ יֹֽנְקוֹתָי/ו֙ רַ֣ךְ אֶקְטֹ֔ף וְ/שָׁתַ֣לְתִּי אָ֔נִי עַ֥ל הַר גָּבֹ֖הַ וְ/תָלֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/022.yaml
  text: 'Thus says the Lord GOD: I myself will take from the top of the lofty cedar and set it out[a]. From the tip of its young shoots I myself will pluck a tender one[b], and I myself will plant it on a high and lofty mountain.'
  footnotes:
  - marker: a
    text: Or 'from the crown of the cedar.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a tender one'; that is, a tender shoot or sprig.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. “내가 친히 높은 백향목의 꼭대기[a]에서 한 가지를 가져다가 놓겠습니다. 그 어린 싹들의 끝에서 여린 것[b]을 꺾어, 높고 우뚝 솟은 산 위에 내가 친히 심겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백향목의 수관에서.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘여린 것’; 곧 여린 가지 또는 새순을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  lexicon: HALOT
  rationale: 합쇼체 본문에서는 אדני와 YHWH의 결합을 자연스럽게 살리기 위해 ‘주 하나님’을 택했습니다. POB의 영어처럼 ‘Lord GOD’의 이중 신격 호칭을 보존하되, 한국어에서는 직역형 ‘주 주님’보다 더 자연스럽고 경건한 형태로 옮겼습니다.
- source_word: מִצַּמֶּרֶת הָאֶרֶז הָרָמָה
  english_pob_choice: from the top of the lofty cedar
  chosen_korean: 높은 백향목의 꼭대기에서
  alternatives_korean:
  - 높은 백향목의 꼭대기에서
  - 높은 백향목의 정수리에서
  - 높은 백향목의 꼭대기에서
  lexicon: HALOT
  rationale: צמרת는 나무의 가장 위, 곧 꼭대기/수관을 가리키므로 ‘꼭대기’로 옮겼습니다. הָאֶרֶז는 백향목으로, הָרָמָה의 ‘높은/우뚝한’ 이미지는 앞의 ‘높은’에 반영했습니다.
- source_word: וְשָׁתַלְתִּי
  english_pob_choice: and I myself will plant it
  chosen_korean: 심겠습니다
  alternatives_korean:
  - 심겠습니다
  - 옮겨 심겠습니다
  - 식재하겠습니다
  lexicon: HALOT
  rationale: 동사의 기본 의미는 ‘심다’이며, 여기서는 이어지는 문맥상 심는 행위를 간결하게 표현하는 것이 적절합니다. POB의 ‘I myself’는 앞뒤 문장에 이미 있는 ‘내가 스스로’로 강조를 살렸습니다.
- source_word: עַל הַר גָּבֹהַ וְתָלוּל
  english_pob_choice: on a high and lofty mountain
  chosen_korean: 높고 솟은 산 위에
  alternatives_korean:
  - 높고 높은 산 위에
  - 높고 우뚝한 산 위에
  - 높고 솟아오른 산 위에
  lexicon: HALOT
  rationale: גָּבֹהַ와 תָלוּל의 중첩된 높이 이미지를 한국어로 자연스럽게 살리기 위해 ‘높고 솟은’으로 옮겼습니다. ‘산 위에’는 המקום의 전치사 עַל의 공간적 감각을 유지합니다.
theological_decisions:
- issue: 여호와 이름의 표기와 번역
  chosen_reading: 본문에서는 ‘주 하나님’으로 옮기고, Tetragrammaton을 노출형 표기로 따로 드러내지 않았습니다.
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 이 절의 핵심은 신적 발화의 위엄과 반복되는 자기 주도성입니다. 한국어 합쇼체 본문에서는 ‘주 하나님’이 가장 자연스럽고 독자가 즉시 이해할 수 있으며, 영어 POB의 ‘the Lord GOD’ 대응도 유지합니다.
  doctrine_reference: 'POB Korean naming policy: direct source rendering with readable ecclesial Korean; divine-name exposure may be adjusted by context.'
