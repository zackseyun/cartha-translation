  source_fidelity: 수정이 필요합니다. 히브리어의 강조된 1인칭 대명사 אָנִי는 ‘취하여 놓는’ 행위와 ‘심는’ 행위에만 각각 붙어 있는데, 초안은 꺾는 행위에도 ‘내가 스스로’를 넣었습니다. 또한 אֲדֹנָי יְהוִה는 원어의 신명 요소와 영어 POB의 최신 신학적 결정을 따라 ‘주 야훼’로 구별해 옮기는 것이 적절합니다.
  naturalness: ‘두겠습니다’는 이 문맥에서 목적어 없이 다소 어색하므로 ‘한 가지를 가져다가 놓겠습니다’로 자연스럽게 보완했습니다. ‘높고 우뚝 솟은 산’은 두 형용사의 고양된 병렬을 자연스럽게 살립니다.
  terminology: אֶרֶז는 ‘백향목’, יֹנְקוֹת는 ‘어린 싹들’, רַךְ의 실체화된 용법은 ‘여린 것’으로 옮겼습니다. ‘주 야훼’는 아도나이와 YHWH의 결합을 드러내며, 특정 교파의 해석을 추가하지 않습니다.
