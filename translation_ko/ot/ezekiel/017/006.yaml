  rationale: 초기 발생과 성장을 자연스럽게 살리되, 한국어에서는 문맥상 '자라서'가 가장 매끄럽습니다.
- source_word: סֹרַחַת
  english_pob_choice: spreading
  chosen_korean: 퍼지는
  alternatives_korean:
  - 번지는
  - 넓게 뻗는
  lexicon: HALOT
  rationale: 포도나무가 옆으로 뻗는 이미지를 살리는 형용사로 '퍼지는'이 가장 직접적입니다.
- source_word: שִׁפְלַת קוֹמָה
  english_pob_choice: low in stature
  chosen_korean: 낮은 키의
  alternatives_korean:
  - 키가 낮은
  - 작은
  lexicon: HALOT
  rationale: 직역에 가깝게 'low of height/stature'를 반영하면서 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: וַתְּשַׁלַּח פֹּארוֹת
  english_pob_choice: sent out boughs
  chosen_korean: 넓은 가지들을 뻗었습니다
  alternatives_korean:
  - 큰 가지들을 내보냈습니다
  - 큰 줄기들을 뻗었습니다
  lexicon: HALOT
  rationale: פֹּארוֹת는 단순한 새순보다 더 큰 가지/퍼진 가지의 이미지를 띠므로, '넓은 가지들'로 옮겨 그 확장성을 살렸습니다.
theological_decisions:
- issue: 남성 단수 접미사의 지시 대상
  chosen_reading: 대상을 인격적으로 보존하여 '그를'로 옮겼습니다.
  alternative_readings:
