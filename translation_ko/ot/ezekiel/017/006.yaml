id: EZK.17.6
reference: Ezekiel 17:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּצְמַ֡ח וַ/יְהִי֩ לְ/גֶ֨פֶן סֹרַ֜חַת שִׁפְלַ֣ת קוֹמָ֗ה לִ/פְנ֤וֹת דָּלִיּוֹתָי/ו֙ אֵלָ֔י/ו וְ/שָׁרָשָׁ֖י/ו תַּחְתָּ֣י/ו יִֽהְי֑וּ וַ/תְּהִ֣י לְ/גֶ֔פֶן וַ/תַּ֣עַשׂ בַּדִּ֔ים וַ/תְּשַׁלַּ֖ח פֹּארֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/006.yaml
  text: And it sprouted and became a spreading vine[a], low in stature, with its branches turned toward him and its roots beneath him[c][b]. So it became a vine and produced branches and sent out boughs.
  footnotes:
  - marker: a
    text: Or 'luxuriant' or 'branching' vine' for 'spreading vine.'
    reason: lexical_alternative
  - marker: b
    text: The repeated 'became a vine' is retained from the Hebrew for emphasis.
    reason: lexical_alternative
  - marker: c
    text: The pronouns 'him' likely refer to the great eagle in the allegory (cf. Ezek 17:3–4), though some render them more impersonally as 'it.'
    reason: cross_reference
translation:
  language: ko
  text: 그리고 그것은 자라서 낮은 키의 퍼지는 포도나무가 되었으며[a], 가지들이 그를 향했고 뿌리들은 그 아래에 있었습니다[b][c]. 그래서 그것은 포도나무가 되어 가지를 내고 넓은 가지들을 뻗었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '무성한' 혹은 '가지가 무성한' 포도나무로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 반복된 '포도나무가 되었다'를 강조를 위해 그대로 살렸습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 '그를'은 비유의 큰 독수리를 가리키는 것으로 보이며, 일부 번역은 더 비인칭적으로 '그것'으로 옮깁니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּצְמַח
  english_pob_choice: it sprouted
  chosen_korean: 자라서
  alternatives_korean:
  - 싹이 텄고
  - 돋아나서
  lexicon: HALOT
  rationale: 초기 발생과 성장을 자연스럽게 살리되, 한국어에서는 문맥상 '자라서'가 가장 매끄럽습니다.
- source_word: סֹרַחַת
  english_pob_choice: spreading
  chosen_korean: 퍼지는
  alternatives_korean:
  - 번지는
  - 넓게 뻗는
  lexicon: HALOT
  rationale: 포도나무가 옆으로 뻗는 이미지를 살리는 형용사로 '퍼지는'이 가장 직접적입니다.
- source_word: שִׁפְלַת קוֹמָה
  english_pob_choice: low in stature
  chosen_korean: 낮은 키의
  alternatives_korean:
  - 키가 낮은
  - 작은
  lexicon: HALOT
  rationale: 직역에 가깝게 'low of height/stature'를 반영하면서 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: וַתְּשַׁלַּח פֹּארוֹת
  english_pob_choice: sent out boughs
  chosen_korean: 넓은 가지들을 뻗었습니다
  alternatives_korean:
  - 큰 가지들을 내보냈습니다
  - 큰 줄기들을 뻗었습니다
  lexicon: HALOT
  rationale: פֹּארוֹת는 단순한 새순보다 더 큰 가지/퍼진 가지의 이미지를 띠므로, '넓은 가지들'로 옮겨 그 확장성을 살렸습니다.
theological_decisions:
- issue: 남성 단수 접미사의 지시 대상
  chosen_reading: 대상을 인격적으로 보존하여 '그를'로 옮겼습니다.
  alternative_readings:
  - '''그것을''로 중립화하여 옮김'
  rationale: 비유 안에서 가장 두드러진 선행사는 이전 절의 독수리이므로, 인칭성을 유지하는 번역이 비유의 정치적 종속성을 더 잘 드러냅니다.
  doctrine_reference: 문맥적 지시어 처리
