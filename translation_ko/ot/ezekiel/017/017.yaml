  source_fidelity: 현 번역의 큰 뜻은 맞지만, '돕지는 못할 것이며'는 히브리어의 단순 부정(파라오가 돕지 않을 것)을 능력·불가능의 뜻으로 바꾸며 문장도 부자연스럽습니다. 또한 סֹלְלָה와 דָּיֵק을 각각 '공성로'와 일반적인 '성벽'으로 옮긴 것은 포위전 시설이라는 원문의 구별을 충분히 드러내지 못합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. '큰 군대와 큰 무리를 거느린 파라오도'는 두 전치사구의 수단·동반 의미를 무리 없이 표현하며, 주절의 부정과 포위전 상황의 시간 관계를 명료하게 합니다.
  terminology: '''파라오''는 적절합니다. חַיִל과 קָהָל은 각각 ''큰 군대''와 ''큰 무리''로 유지했습니다. סֹלְלָה는 ''공성 둑'', דָּיֵק은 특정 구조가 논쟁적인 점을 과도하게 단정하지 않는 ''포위벽''으로 옮기고 각주에서 대안을 제시했습니다.'
