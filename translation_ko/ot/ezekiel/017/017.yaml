id: EZK.17.17
reference: Ezekiel 17:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹא֩ בְ/חַ֨יִל גָּד֜וֹל וּ/בְ/קָהָ֣ל רָ֗ב יַעֲשֶׂ֨ה אוֹת֤/וֹ פַרְעֹה֙ בַּ/מִּלְחָמָ֔ה בִּ/שְׁפֹּ֥ךְ סֹלְלָ֖ה וּ/בִ/בְנ֣וֹת דָּיֵ֑ק לְ/הַכְרִ֖ית נְפָשׁ֥וֹת רַבּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/017.yaml
  text: Pharaoh will not act for him in the war with a great army and a large assembly[b][a], when they cast up a siege ramp and build a siege wall to cut off many lives.
  footnotes:
  - marker: a
    text: Or 'will not help him in the war with a great army and a large company.' The Hebrew expression 'do/make him' is idiomatic here for taking effective action on his behalf.
    reason: lexical_alternative
  - marker: b
    text: The siege terms may also be rendered 'siege mound' and 'siegework' or 'siege tower.'
    reason: lexical_alternative
translation:
  language: ko
  text: 큰 군대와 큰 무리를 거느린 파라오도, 공성 둑을 쌓고 포위벽을 세워 많은 생명을 끊을 때, 전쟁에서 그를 도와주지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 '그를 행하다/만들다'라는 표현은 여기서 그를 위하여 효과적으로 조처하거나 돕는다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 포위전 용어는 각각 '공성로' 또는 '공성 둔덕', 그리고 '공성 시설' 또는 '공성탑'으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחַיִל גָּדוֹל
  english_pob_choice: with a great army
  chosen_korean: 큰 군대
  alternatives_korean:
  - 큰 군사력으로
  - 큰 군사로
  - 큰 부대로
  lexicon: HALOT
  rationale: חַיִל은 전쟁 문맥에서 군대/병력을 뜻하므로, 한국어로는 가장 자연스럽고 직접적인 '군대'가 적합합니다.
- source_word: וּבְקָהָל רָב
  english_pob_choice: with a large assembly
  chosen_korean: 큰 무리
  alternatives_korean:
  - 큰 회중
  - 큰 집회
  - 많은 사람들
  lexicon: HALOT
  rationale: קָהָל의 기본 뜻은 '모인 무리/총회'이지만, 여기서는 군사적 동원에 붙는 대열을 가리키므로 '큰 무리'가 과도한 교회적 뉘앙스를 피하면서도 의미를 살립니다.
- source_word: יַעֲשֶׂה אוֹתוֹ
  english_pob_choice: will not act for him
  chosen_korean: 그를 위해 돕지는 못할 것이며
  alternatives_korean:
  - 그를 위해 행동하지는 못할 것이며
  - 그를 위해 힘쓰지는 못할 것이며
  - 그를 위해 해 주지는 못할 것이며
  lexicon: HALOT
  rationale: עשה + 목적대명사는 여기서 '그를 위해 효과적으로 조처하다'는 관용구이므로, 한국어에서는 문맥상 자연한 '돕다'를 쓰되 부정형으로 무능/무력의 뉘앙스를 보존했습니다.
- source_word: בִּשְׁפֹּךְ סֹלְלָה
  english_pob_choice: when they cast up a siege ramp
  chosen_korean: 사람들이 공성로를 쌓고
  alternatives_korean:
  - 사람들이 포위 둑을 쌓고
  - 사람들이 공성 둔덕을 쌓고
  - 사람들이 포위용 제방을 쌓고
  lexicon: HALOT
  rationale: שׁפך는 문자적으로 '붓다'이지만 포위전 문맥에서는 흙을 '쌓아 올리다/조성하다'는 뜻이므로, 한국어 전쟁용어로 이해 가능한 '공성로'를 택했습니다.
- source_word: וּבִבְנוֹת דָּיֵק
  english_pob_choice: and build a siege wall
  chosen_korean: 성벽을 세워
  alternatives_korean:
  - 공성벽을 세워
  - 포위벽을 쌓고
  - 공성탑을 세우고
  lexicon: HALOT
  rationale: דָּיֵק은 포위 공사용 구조물을 가리키며 번역이 갈리지만, 앞의 '공성로'와 병렬을 이루도록 가장 읽히는 한국어 표현인 '성벽'을 사용했습니다.
- source_word: לְהַכְרִית נְפָשׁוֹת רַבּוֹת
  english_pob_choice: to cut off many lives
  chosen_korean: 많은 생명을 끊으려 할 때도 그렇습니다
  alternatives_korean:
  - 많은 생명을 끊기 위해서도 그렇습니다
  - 많은 사람의 생명을 끊으려고도 그렇습니다
  - 많은 목숨을 끊으려 할 때도 그렇습니다
  lexicon: HALOT
  rationale: הכרית의 직역적 이미지인 '끊다/잘라내다'를 살리면서, נְפָשׁוֹת를 한국어의 '생명'으로 옮겨 폭력성과 심판성을 유지했습니다.
theological_decisions:
- issue: עשה אותו의 관용적 의미를 어떻게 드러낼지
  chosen_reading: 파라오가 그를 위해 직접적인 도움이나 유효한 조처를 해 주지 못한다는 뜻을 '그를 위해 돕지는 못할 것이며'로 풀어 옮겼습니다.
  alternative_readings:
  - 그를 위해 행동하지는 못할 것이며
  - 그를 위해 해 주지는 못할 것이며
  rationale: 본문은 단순한 일반 행동이 아니라 전쟁에서의 실질적 지원 부재를 말하므로, 독자가 문맥적 의미를 즉시 이해하도록 하되 원문의 관용성을 지우지 않게 했습니다.
  doctrine_reference: 문맥적 의미 보존과 관용구 번역 원칙
- issue: 포위전 용어의 직역성과 가독성의 균형
  chosen_reading: סֹלְלָה와 דָּיֵק을 각각 '공성로'와 '성벽'으로 옮겨 전쟁 장면의 압박감을 살렸습니다.
  alternative_readings:
  - 공성 둔덕 / 포위벽
  - 공성 둔덕 / 공성벽
  rationale: 한국어 독자에게 낯선 음역적 표현보다, 본문의 실제 포위전 이미지를 즉시 전달하는 용어가 더 적절하다고 판단했습니다.
  doctrine_reference: 원문 형상 보존과 수용성의 균형
