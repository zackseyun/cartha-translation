  - 백향목의 꼭대기 부분
  lexicon: HALOT
  rationale: צַמֶּרֶת는 꼭대기/수관의 가장 높은 부분을 가리키며, 한국어에서는 ‘백향목 꼭대기’가 간결하고 알legorical 이미지도 잘 드러냅니다.
theological_decisions:
- issue: YHWH를 한국어 본문에 어떻게 처리할지
  chosen_reading: 본문에는 ‘주 하나님’을 두고, 별도 각주 없이 진행했습니다.
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 이 절의 핵심은 비유의 전개이며, 아도나이-יהוה의 결합은 한국어에서 ‘주 하나님’으로 가장 안정적으로 재현됩니다. 야훼 음역은 프로젝트 기본값이지만, 이 절의 POB 영어 관례와 가독성을 고려하면 본문 노출 없이도 충분합니다.
  doctrine_reference: 'DOCTRINE.md: YHWH 표기 원칙; Ezekiel 비유 본문 가독성 우선 원칙'
