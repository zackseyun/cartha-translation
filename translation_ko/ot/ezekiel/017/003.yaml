  text: וְ/אָמַרְתָּ֞ כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הַ/נֶּ֤שֶׁר הַ/גָּדוֹל֙ גְּד֤וֹל הַ/כְּנָפַ֨יִם֙ אֶ֣רֶךְ הָ/אֵ֔בֶר מָלֵא֙ הַ/נּוֹצָ֔ה אֲשֶׁר ל֖/וֹ הָֽ/רִקְמָ֑ה בָּ֚א אֶל הַ/לְּבָנ֔וֹן וַ/יִּקַּ֖ח אֶת צַמֶּ֥רֶת הָ/אָֽרֶז־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/003.yaml
  text: 'and say[a], ‘Thus says the Lord GOD: The great eagle, great in wings, long in pinions, full of plumage, which had variegated feathers, came to Lebanon and took the top of the cedar.’'
  footnotes:
  - marker: a
    text: 'Hebrew: ''which had embroidery/variegation''; the phrase likely refers metaphorically to richly patterned or multicolored plumage.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 말하십시오. ‘주 하나님께서 이렇게 말씀하십니다. 큰 독수리, 날개가 크고 깃이 길며 깃털이 가득하고, 무늬 있는 깃털을 가진 그 독수리가 레바논으로 와서 백향목 꼭대기를 꺾어 갔습니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘무늬가 있는/장식된’의 뜻을 지니며, 여기서는 색이 섞인 깃털을 가리키는 비유적 표현일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  - 주 하나님이
  lexicon: HALOT
  rationale: 합쇼체 본문에서 אֲדֹנָי יְהוִה의 중첩을 자연스럽게 살리면서도, 한국어 관용상 ‘주 하나님’이 가장 직접적이고 읽기 쉽습니다. ‘야훼’를 본문에 넣는 방식은 이 구절의 영어 POB 관례와 충돌하므로 본문은 보수적으로 처리했습니다.
- source_word: הַנֶּשֶׁר הַגָּדוֹל
  english_pob_choice: The great eagle
  chosen_korean: 큰 독수리
  alternatives_korean:
  - 위대한 독수리
  - 거대한 독수리
  lexicon: HALOT
  rationale: נֶשֶׁר는 독수리로 옮기는 것이 자연스럽고, הַגָּדוֹל은 크기와 위상을 함께 드러내지만 한국어에서는 ‘큰’이 가장 직접적입니다.
- source_word: גְּדוֹל הַכְּנָפַיִם / אֶרֶךְ הָאֵבֶר
  english_pob_choice: great in wings, long in pinions
  chosen_korean: 날개가 크고 깃이 길며
  alternatives_korean:
  - 날개가 크고 날개깃이 길며
  - 큰 날개를 가졌고 깃이 길며
  lexicon: HALOT
  rationale: ‘날개가 크고’는 גְּדוֹל הַכְּנָפַיִם을, ‘깃이 길며’는 אֶרֶךְ הָאֵבֶר을 압축해서 살린 표현입니다. ‘깃’은 새의 날개깃/깃털을 자연스럽게 포괄합니다.
- source_word: מָלֵא הַנּוֹצָה אֲשֶׁר לוֹ הָרִקְמָה
  english_pob_choice: full of plumage, which had variegated feathers
  chosen_korean: 깃털이 가득하고, 무늬 있는 깃털을 가진
  alternatives_korean:
  - 깃털이 가득하고, 알록달록한 깃털을 가진
  - 깃이 가득하고, 무늬진 깃털을 가진
  lexicon: HALOT
  rationale: 이 연속 표현은 새의 풍성한 깃과 ‘무늬/색채가 섞인’ 장식을 강조하므로, 본문에서는 ‘무늬 있는 깃털’로 옮겨 원문의 시각적 긴장을 유지했습니다.
- source_word: צַמֶּרֶת הָאָרֶז
  english_pob_choice: the top of the cedar
  chosen_korean: 백향목 꼭대기
  alternatives_korean:
  - 백향목의 꼭대기
  - 백향목의 꼭대기 부분
  lexicon: HALOT
  rationale: צַמֶּרֶת는 꼭대기/수관의 가장 높은 부분을 가리키며, 한국어에서는 ‘백향목 꼭대기’가 간결하고 알legorical 이미지도 잘 드러냅니다.
theological_decisions:
- issue: YHWH를 한국어 본문에 어떻게 처리할지
  chosen_reading: 본문에는 ‘주 하나님’을 두고, 별도 각주 없이 진행했습니다.
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 이 절의 핵심은 비유의 전개이며, 아도나이-יהוה의 결합은 한국어에서 ‘주 하나님’으로 가장 안정적으로 재현됩니다. 야훼 음역은 프로젝트 기본값이지만, 이 절의 POB 영어 관례와 가독성을 고려하면 본문 노출 없이도 충분합니다.
  doctrine_reference: 'DOCTRINE.md: YHWH 표기 원칙; Ezekiel 비유 본문 가독성 우선 원칙'
