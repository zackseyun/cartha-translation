  text: so that it might become a lowly kingdom[a], not lifting itself up, but keeping his covenant so as to stand.
  footnotes:
  - marker: a
    text: Or "treaty" for "covenant"; the Hebrew term can denote a binding political agreement in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것이 낮은 왕국이 되게 하여, 스스로 높이지 않고 그의 언약을 지켜 서 있게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘언약’은 정치적 맥락에서는 ‘조약’ 또는 ‘계약’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  english_pob_choice: so that it might become
  chosen_korean: 되게 하여
  alternatives_korean:
  - 되도록
  - 되게 하므로
  - 되게 되어
  lexicon: HALOT
  rationale: 문맥상 목적을 나타내는 부정사 구문이므로 결과를 드러내는 ‘되게 하여’로 옮겨 자연스러운 합쇼체 목적 표현을 살렸습니다.
- source_word: מַמְלָכָה
  english_pob_choice: kingdom
  chosen_korean: 왕국
  alternatives_korean:
  - 나라
  - 국가
  - 왕권
  lexicon: HALOT
  rationale: 정치적 실체를 가리키는 말이므로 ‘왕국’이 가장 직접적이며, 본문의 권세·지위 저하도 잘 드러냅니다.
- source_word: שְׁפָלָה
  english_pob_choice: lowly
  chosen_korean: 낮은
  alternatives_korean:
  - 천한
  - 비천한
  - 겸손한
  lexicon: HALOT
  rationale: 도덕적 겸손보다 지위의 낮아짐을 말하므로, ‘낮은’이 상태의 저하를 과장 없이 전달합니다.
- source_word: בְּרִיתוֹ
  english_pob_choice: his covenant
  chosen_korean: 그의 언약
  alternatives_korean:
  - 그의 계약
  - 그의 조약
  - 그의 언약/조약
  lexicon: HALOT
  rationale: 히브리어 ברית는 이 문맥에서 정치적 조약 성격도 띠지만, POB의 핵심 용어 일관성을 따라 본문에는 ‘언약’을 두고, 정치적 뉘앙스는 해석 여지로 남겼습니다.
theological_decisions:
- issue: ברית의 번역을 ‘언약’으로 유지할지 ‘조약’으로 좁힐지
  chosen_reading: 본문은 ‘언약’으로 유지했습니다.
  alternative_readings:
  - 조약
  - 계약
  rationale: 즉각 문맥은 바벨론 왕과의 봉신 관계를 가리키지만, מקור어 ברית의 중량감과 POB의 용어 일관성을 살리기 위해 본문은 ‘언약’으로 두었습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
