lexical_decisions:
- source_word: לִהְיוֹת
  english_pob_choice: so that it might become
  chosen_korean: 되게 하여
  alternatives_korean:
  - 되도록
  - 되게 하므로
  - 되게 되어
  lexicon: HALOT
  rationale: 문맥상 목적을 나타내는 부정사 구문이므로 결과를 드러내는 ‘되게 하여’로 옮겨 자연스러운 합쇼체 목적 표현을 살렸습니다.
