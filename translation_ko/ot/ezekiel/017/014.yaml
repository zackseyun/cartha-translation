- from: 그것이 낮은 왕국이 되게 하여, 스스로 높이지 않고 그의 언약을 지켜 서 있게 하려는 것입니다.[a]
  to: 그 왕국이 낮은 지위의 왕국이 되어 스스로를 높이지 않고, 그의 언약을 지켜 굳게 서도록 하려는 것입니다.[a]
  rationale: 수정문은 לִהְיוֹת의 목적적 ‘되다’, לְבִלְתִּי הִתְנַשֵּׂא의 자기 높임 금지, לִשְׁמֹר의 언약 준수, לְעָמְדָהּ의 왕국이 굳게 서고 존속하는 목적을 순서대로 보존합니다. ‘언약’은 본문에서 유지하되, 정치적 용례인 ‘조약’을 각주로 제시했습니다.
