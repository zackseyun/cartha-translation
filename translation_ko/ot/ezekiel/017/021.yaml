revisions:
- from: 그의 도망자들과 그의 모든 부대는 칼에 쓰러질 것이며, 남은 자들은 모든 바람으로 흩어질 것입니다. 그러면 너희는 내가, 야훼가 말하였음을 알게 될 것입니다.[a][b]
  to: 그의 모든 부대[b] 가운데 있는 도망자들[a]은 모두 칼에 쓰러질 것이며, 남은 자들은 사방으로 흩어질 것입니다. 그러면 너희는 나 야훼가 말하였음을 알게 될 것입니다.
  rationale: 원문의 전치사구 ‘그의 모든 부대 가운데’가 ‘도망자들’을 수식하도록 문장 구조를 바로잡았습니다. 각주 표지를 해당 번역어에 배치하고, 히브리어의 ‘모든 바람’을 뜻으로 자연스럽게 전달하는 ‘사방으로’ 및 자연스러운 신명 선언 표현 ‘나 야훼가’를 사용했습니다.
