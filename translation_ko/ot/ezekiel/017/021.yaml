  source_fidelity: 수정이 필요합니다. 히브리어는 ‘그의 모든 부대 가운데 있는 그의 모든 도망자’라는 결속을 이루는데, 초안은 ‘그의 도망자들과 그의 모든 부대’로 병렬 처리하여 부대 자체도 칼에 쓰러진다는 뜻으로 바꾸었습니다. 또한 두주가 해당 어구에 직접 연결되어 있지 않습니다.
  naturalness: ‘모든 바람으로 흩어질 것입니다’도 이해되나, 현대 표준 한국어에서는 히브리 관용구의 뜻을 자연스럽게 드러내는 ‘사방으로 흩어질 것입니다’가 더 좋습니다. ‘내가, 야훼가’는 한국어 문장 구조상 부자연스러우므로 ‘나 야훼가’로 고칩니다.
  terminology: ‘도망자들’, ‘부대’, ‘야훼’는 각각 מברחו, אֲגַפָּיו, יהוה의 문맥상 의미와 POB 방침에 부합합니다. ‘남은 자들’도 여기서는 심판 뒤 남은 이들을 가리키며 허용됩니다.
