source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל מברח/ו בְּ/כָל אֲגַפָּי/ו֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וְ/הַ/נִּשְׁאָרִ֖ים לְ/כָל ר֣וּחַ יִפָּרֵ֑שׂוּ וִ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/021.yaml
  text: And all his fugitives among all his troops will fall by the sword[a], and those who remain will be scattered to every wind. Then you will know that I, Yahweh[b], have spoken.
  footnotes:
  - marker: a
    text: Hebrew 'his fugitives'; some ancient versions and translations understand the term as 'his chosen men' or similar.
    reason: alternative_reading
  - marker: b
    text: Literally 'his wings,' a Hebrew military image for divisions or troops.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 모든 부대[b] 가운데 있는 도망자들[a]은 모두 칼에 쓰러질 것이며, 남은 자들은 사방으로 흩어질 것입니다. 그러면 너희는 나 야훼가 말하였음을 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그의 도망자들’입니다. 일부 고대 역본과 번역은 이를 ‘그의 선택된 사람들’ 또는 이와 비슷한 뜻으로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그의 날개들’입니다. 군사 문맥에서는 부대나 분견대를 가리키는 비유적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מברחו
  english_pob_choice: his fugitives
  chosen_korean: 그의 도망자들
  alternatives_korean:
  - 그의 피난자들
  - 그의 도망친 자들
  - 그의 선택된 용사들
  lexicon: HALOT
  rationale: 어근 ברח의 기본 의미를 따라, 전투에서 달아나거나 도망하려는 자들을 가리키는 뜻을 한국어로 직접 드러냈습니다.
- source_word: אֲגַפָּיו
  english_pob_choice: his troops
  chosen_korean: 그의 모든 부대
  alternatives_korean:
  - 그의 모든 날개
  - 그의 모든 진영
  - 그의 모든 군대
  lexicon: HALOT
  rationale: 직역하면 ‘그의 날개들’이지만 군사적 문맥에서 분견대·부대를 뜻하므로, 현대 한국어에서 뜻이 분명한 ‘부대’로 옮겼습니다.
- source_word: הַנִּשְׁאָרִים
  english_pob_choice: those who remain
  chosen_korean: 남은 자들
  alternatives_korean:
  - 남아 있는 자들
  - 생존자들
  - 남은 무리
  lexicon: HALOT
  rationale: 이 문맥은 신학적으로 정련된 ‘남은 자’ 개념보다 단순히 살아남아 남은 사람들을 뜻하므로, 과도한 신학적 뉘앙스를 덜면서도 자연스럽게 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 여호와 대신 신명기적 고유명사인 ‘야훼’를 사용해 하나님의 이름을 보존했습니다.
theological_decisions:
- issue: ‘남은 자들’의 신학적 해석 여부
  chosen_reading: 심판 후 남아 있게 되는 사람들을 가리키는 중립적 표현으로 처리했습니다.
  alternative_readings:
  - 언약적 ‘남은 자’
  - 생존자들
  rationale: 본문은 보존된 신실한 공동체를 말하는 것이 아니라 패망 뒤 흩어질 잔여 인원을 말하므로, ‘남은 자’의 구원사적 함의를 의도적으로 얹지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
