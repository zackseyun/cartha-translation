id: EZK.17.18
reference: Ezekiel 17:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָזָ֥ה אָלָ֖ה לְ/הָפֵ֣ר בְּרִ֑ית וְ/הִנֵּ֨ה נָתַ֥ן יָד֛/וֹ וְ/כָל אֵ֥לֶּה עָשָׂ֖ה לֹ֥א יִמָּלֵֽט־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/018.yaml
  text: He despised the oath by breaking the covenant[a]; behold, he had given his hand, yet did all these things[b]. He will not escape.
  footnotes:
  - marker: a
    text: Or 'the curse'; the Hebrew term can denote an oath that carries a curse sanction.
    reason: lexical_alternative
  - marker: b
    text: Literally 'he had given his hand,' an idiom for making a pledge or agreement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 언약을 깨뜨리며 맹세를 멸시하였습니다[a]. 보십시오, 그는 자기 손을 내밀었으면서도 이 모든 일을 행하였으니[b], 그는 결코 피하지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저주’. 이 히브리어는 저주 санкtion을 지닌 맹세를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘자기 손을 주었다’라는 관용구로, 서약이나 합의를 맺는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָזָה
  english_pob_choice: He despised
  chosen_korean: 멸시하였습니다
  alternatives_korean:
  - 업신여겼습니다
  - 경멸하였습니다
  lexicon: HALOT
  rationale: בזה는 단순한 무시보다 강한 경멸의 태도를 나타내므로, 문맥의 도덕적 비난을 살려 ‘멸시하였습니다’로 옮겼습니다.
- source_word: בְּרִית
  english_pob_choice: the covenant
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 조약
  lexicon: HALOT
  rationale: 여기서는 국제 정치 맥락이지만 성경적 용례와 책임의 무게를 살려 ‘언약’으로 옮기는 것이 적절합니다.
- source_word: נָתַן יָדוֹ
  english_pob_choice: he had given his hand
  chosen_korean: 자기 손을 내밀었으면서도
  alternatives_korean:
  - 자기 손을 내주었으면서도
  - 자기 손을 주었으면서도
  lexicon: HALOT
  rationale: 직역상 ‘손을 주다/내밀다’는 서약·합의의 관용구이므로, 본문에는 투명성을 위해 손 이미지를 살리되 한국어에서 자연스럽게 읽히도록 옮겼습니다.
- source_word: לֹא יִמָּלֵט
  english_pob_choice: He will not escape
  chosen_korean: 결코 피하지 못할 것입니다
  alternatives_korean:
  - 도망하지 못할 것입니다
  - 벗어나지 못할 것입니다
  lexicon: HALOT
  rationale: נמלט의 수동형은 심판에서 ‘벗어나지 못함’을 뜻하므로, 판결적 뉘앙스를 살려 ‘피하지 못할 것입니다’로 옮겼습니다.
theological_decisions:
- issue: אָלָה를 ‘맹세’로만 처리할지, 서약이 지닌 저주/책임의 무게를 드러낼지
  chosen_reading: 본문은 ‘맹세’로 옮기되, 문맥상 언약 파기의 도덕적·언약적 책임을 함께 드러냈습니다.
  alternative_readings:
  - 저주
  - 저주를 동반한 맹세
  rationale: 영어 POB도 ‘oath’와 ‘curse’ 가능성을 주석으로 남기며, 본문은 맹세와 언약의 관계를 유지합니다. 한국어 본문에서는 ‘맹세’를 쓰고, 주석에서 대안 의미를 보존하는 편이 가장 투명합니다.
  doctrine_reference: Translation philosophy §§1, 5
