source:
  edition: WLC
  text: בְּ/הַ֨ר מְר֤וֹם יִשְׂרָאֵל֙ אֶשְׁתֳּלֶ֔/נּוּ וְ/נָשָׂ֤א עָנָף֙ וְ/עָ֣שָׂה פֶ֔רִי וְ/הָיָ֖ה לְ/אֶ֣רֶז אַדִּ֑יר וְ/שָׁכְנ֣וּ תַחְתָּ֗י/ו כֹּ֚ל צִפּ֣וֹר כָּל כָּנָ֔ף בְּ/צֵ֥ל דָּלִיּוֹתָ֖י/ו תִּשְׁכֹּֽנָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/023.yaml
  text: On the high mountain of Israel I will plant it[a], and it will put forth branches and bear fruit and become a majestic cedar. Under it every bird of every wing will dwell[b]; in the shade of its boughs they will dwell.
  footnotes:
  - marker: a
    text: Or 'I will transplant it.' The Hebrew verb can emphasize setting out a shoot in a new place.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'every bird, every wing'—a poetic way of saying birds of every kind.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 높은 산 위에 내가 그것을 심겠습니다[a]. 그것은 가지를 뻗고 열매를 맺으며 장대한 백향목이 될 것입니다. 그 아래에는 모든 날개를 가진 모든 새가 깃들 것이며[b], 그 가지들 그늘 아래에 깃들 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것을 옮겨 심겠습니다’. 히브리어 동사는 새싹을 새 자리로 옮겨 심는 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘모든 새, 모든 날개’입니다. 새의 종류를 아우르는 시적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהַר מְרוֹם יִשְׂרָאֵל
  english_pob_choice: On the high mountain of Israel
  chosen_korean: 이스라엘의 높은 산 위에
  alternatives_korean:
  - 이스라엘의 산꼭대기에
  - 이스라엘의 높은 산에
  lexicon: HALOT
  rationale: מְרוֹם은 ‘높은 곳/고지’의 뜻이므로, 지리성과 고양된 이미지를 함께 살려 ‘높은 산 위에’로 옮겼습니다.
- source_word: אֶשְׁתֳּלֶנּוּ
  english_pob_choice: I will plant it
  chosen_korean: 내가 그것을 심겠습니다
  alternatives_korean:
  - 내가 그것을 옮겨 심겠습니다
  - 내가 그것을 심어 두겠습니다
  lexicon: HALOT
  rationale: 동사는 기본적으로 ‘심다’의 뜻이므로 본문 흐름에서 가장 직접적인 표현을 선택했습니다. ‘옮겨 심다’는 가능하지만, 여기서는 정착시키는 결과가 더 두드러집니다.
- source_word: וְנָשָׂא עָנָף
  english_pob_choice: and it will put forth branches
  chosen_korean: 그것은 가지를 뻗고
  alternatives_korean:
  - 그것은 가지를 내고
  - 그것은 가지를 펼치고
  lexicon: HALOT
  rationale: עָנָף는 나무의 성장 이미지에서 ‘가지’를 뜻하므로, 현대 한국어에서 자연스럽고 식물 생장 묘사에 맞는 ‘가지를 뻗고’로 처리했습니다.
- source_word: וְשָׁכְנוּ תַחְתָּיו ... בְּצֵל דָּלִיּוֹתָיו
  english_pob_choice: Under it every bird of every wing will dwell; in the shade of its boughs they will dwell.
  chosen_korean: 그 아래에는 모든 날개를 가진 모든 새가 깃들 것이며, 그 가지들 그늘 아래에 깃들 것입니다.
  alternatives_korean:
  - 그 아래에는 모든 새가 깃들 것이며, 그 넓은 그늘 아래에 깃들 것입니다.
  - 그 아래에는 모든 종류의 새가 깃들 것이며, 그 가지 그늘 아래에 깃들 것입니다.
  lexicon: HALOT
  rationale: 히브리어의 시적 반복인 ‘모든 새, 모든 날개’를 ‘모든 날개를 가진 모든 새’로 최대한 살렸고, דָּלִיּוֹת는 큰 나무의 ‘가지들/큰 가지’에 해당하므로 ‘가지들 그늘’로 옮겼습니다.
theological_decisions:
- issue: ‘모든 새가 깃든다’는 상징의 범위
  chosen_reading: 본문의 비유 이미지를 그대로 두고, 상징의 해석은 본문 밖에서 단정하지 않았습니다.
  alternative_readings:
  - 열방이 그 아래 모인다는 뜻으로 명시적으로 해석할 수 있습니다.
  rationale: 이 구절 자체는 나무와 새의 시적 이미지를 진술할 뿐이므로, 해석적 확장을 본문 안으로 미리 넣지 않는 것이 원문 충실성에 맞습니다.
  doctrine_reference: '번역 원칙: 본문 우선, 과잉 해석 자제'
