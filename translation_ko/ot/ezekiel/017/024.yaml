  rationale: 히브리어 본문은 여기서 해석을 풀어 주지 않고 이미지 자체를 말합니다. 번역문에서 이를 과도하게 해설하면 원문의 예언적 긴장과 상징성을 약화시킬 수 있습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve metaphor unless the source itself explicates it'
