  text: וְֽ/יָדְע֞וּ כָּל עֲצֵ֣י הַ/שָּׂדֶ֗ה כִּ֣י אֲנִ֤י יְהוָה֙ הִשְׁפַּ֣לְתִּי עֵ֣ץ גָּבֹ֗הַ הִגְבַּ֨הְתִּי֙ עֵ֣ץ שָׁפָ֔ל הוֹבַ֨שְׁתִּי֙ עֵ֣ץ לָ֔ח וְ/הִפְרַ֖חְתִּי עֵ֣ץ יָבֵ֑שׁ אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/024.yaml
  text: 'And all the trees of the field shall know that I am Yahweh: I have brought low the high tree[a], I have raised up the low tree, I have dried up the green tree, and I have made the dry tree flourish. I am Yahweh; I have spoken[b], and I have done it.'
  footnotes:
  - marker: a
    text: Or 'the fresh tree' / 'the moist tree' for 'the green tree.' The Hebrew adjective literally denotes freshness or moisture.
    reason: lexical_alternative
  - marker: b
    text: Or 'I have caused the dry tree to bud/blossom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 들의 모든 나무는 내가 야훼임을 알게 될 것입니다. 내가 높은 나무를 낮추었고, 낮은 나무를 높였으며, 푸른 나무를 말리고[a] 마른 나무를 무성하게 하였습니다. 나는 야훼입니다. 내가 말하였고, 그대로 행하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘푸른’으로 옮긴 לָח는 문자적으로 ‘신선한’ 또는 ‘축축한’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내가 말하였고, 내가 행하였다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ כָּל עֲצֵי הַשָּׂדֶה
  english_pob_choice: And all the trees of the field shall know
  chosen_korean: 들의 모든 나무가 … 알 것입니다
  alternatives_korean:
  - 밭의 모든 나무가 … 알 것입니다
  - 들의 모든 나무는 … 알게 될 것입니다
  lexicon: HALOT
  rationale: ‘הַשָּׂדֶה’는 문자 그대로 ‘들/밭’의 넓은 야외를 가리키므로 ‘들의’로 옮겨 이미지와 병렬성을 살렸습니다. 예언적 미래 인식은 ‘알 것입니다’로 자연스럽게 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 서술어가 아닌 고유명사로 기능하므로 전통적 대체어 ‘주님’ 대신 학술적 전사인 ‘야훼’를 유지했습니다.
- source_word: עֵץ לָח
  english_pob_choice: the green tree
  chosen_korean: 푸른 나무
  alternatives_korean:
  - 젖은 나무
  - 신선한 나무
  - 초록 나무
  lexicon: HALOT
  rationale: לָח는 문자적으로는 ‘축축한/신선한’의 뜻이지만, 나무의 생기와 대조를 드러내는 한국어 관용으로는 ‘푸른 나무’가 가장 자연스럽고, 뒤의 ‘마른 나무’와도 대구를 이룹니다.
- source_word: וְהִפְרַחְתִּי עֵץ יָבֵשׁ
  english_pob_choice: and I have made the dry tree flourish
  chosen_korean: 마른 나무를 무성하게 하였습니다
  alternatives_korean:
  - 마른 나무를 꽃피우게 하였습니다
  - 마른 나무를 싹트게 하였습니다
  lexicon: HALOT
  rationale: הִפְרַחְתִּי의 핵심은 ‘피어나게 하다/번성하게 하다’이므로, 생명 회복의 결과를 드러내는 ‘무성하게 하였습니다’로 옮겼습니다.
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  english_pob_choice: I have spoken, and I have done it
  chosen_korean: 내가 말하였고, 내가 이루었습니다
  alternatives_korean:
  - 내가 말하였고, 내가 행하였습니다
  - 내가 말하였고, 내가 해냈습니다
  lexicon: HALOT
  rationale: 하나님의 말씀과 성취의 불가분성을 살리기 위해 ‘이루었습니다’를 택했습니다. 이는 단순한 발화가 아니라 말씀의 실현을 가리킵니다.
theological_decisions:
- issue: עֵץ גָּבֹהַ / עֵץ שָׁפָל / עֵץ יָבֵשׁ / עֵץ לָח의 비유적 범위
  chosen_reading: 주된 은유인 나무 이미지를 본문 그대로 유지하고, 정치적·역사적 대응물은 본문 밖의 맥락에 맡겼습니다.
  alternative_readings:
