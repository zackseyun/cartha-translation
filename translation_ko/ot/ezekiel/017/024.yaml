  to: 들의 모든 나무는 내가 야훼임을 알게 될 것입니다. 내가 높은 나무를 낮추었고, 낮은 나무를 높였으며, 푸른 나무를 말리고[a] 마른 나무를 무성하게 하였습니다. 나는 야훼입니다. 내가 말하였고, 그대로 행하였습니다.[b]
