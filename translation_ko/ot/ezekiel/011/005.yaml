base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/005.yaml
  text: 'And the Spirit of Yahweh fell upon me[a], and he said to me, “Say, ‘Thus says Yahweh: So you have said, O house of Israel, and I know the things that come up in your spirit.’”'
  footnotes:
  - marker: a
    text: Or “what comes into your mind”; Hebrew “the things that come up in your spirit.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 영이 내게 임하셨고, 그분이 내게 말씀하셨습니다. “말하여라. ‘야훼께서 이렇게 말씀하신다. 이스라엘의 집아, 너희는 그렇게 말했지만, 나는 너희 마음속에 떠오르는 것들을 알고 있다.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희 마음에 떠오르는 것들”; 히브리어는 “너희 영에 올라오는 것들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל עָלַי / רוּחַ יְהוָה
  english_pob_choice: the Spirit of Yahweh fell upon me
  chosen_korean: 야훼의 영이 내게 임하셨고
  alternatives_korean:
  - 야훼의 영이 내게 떨어졌고
  - 야훼의 영이 내게 덮치셨고
  - 야훼의 성령이 내게 임하셨고
  lexicon: HALOT
  rationale: נפל עַל의 강한 도래 이미지를 살리되, 한국어에서는 ‘임하다’가 예언적 체험의 도착·사로잡힘을 자연스럽게 드러냅니다. רוּחַ는 여기서 하나님의 영으로 이해되어 ‘영’으로 옮겼습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하신다
  alternatives_korean:
  - 주께서 이렇게 말씀하신다
  - 야훼께서 이같이 말씀하신다
  lexicon: HALOT
  rationale: 예언자적 사자 공식의 표준적 의미를 살리되, 현대 한국어에서 더 자연스러운 직설형으로 옮겼습니다. ‘이렇게’는 כֹּה의 구어적·전언적 힘을 무리 없이 반영합니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: house of Israel
  chosen_korean: 이스라엘의 집아
  alternatives_korean:
  - 이스라엘 집안아
  - 이스라엘의 집이여
  - 이스라엘 백성아
  lexicon: HALOT
  rationale: 직역적 호칭 구조를 유지하여 언약적·수사적 호소를 보존했습니다. ‘아’ 호격을 써서 직접대면의 압박감을 살렸습니다.
- source_word: וּמַעֲלֹות רוּחֲכֶם
  english_pob_choice: the things that come up in your spirit
  chosen_korean: 너희 마음속에 떠오르는 것들을
  alternatives_korean:
  - 너희 영 안에 올라오는 것들을
  - 너희 영에 올라오는 것들을
  - 너희 마음에 드는 것들을
  lexicon: HALOT
  rationale: 히브리어의 ‘올라오다/상승’ 비유는 보존하되, 한국어 독자가 의미를 즉시 이해하도록 ‘떠오르다’로 자연화했습니다. POB 각주와 같이 내적 사고를 가리키는 점을 반영해 ‘마음속’으로 풀었습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명(神名)을 보존하기 위해 프로젝트 기본값인 ‘야훼’를 사용했습니다. 이는 예언자 발화의 언약명 사용을 드러내며, 통상 번역의 대체어인 ‘주’로 희석하지 않습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘영’과 ‘마음’의 대응 관계
  chosen_reading: 첫 절은 ‘영’, 끝 절은 ‘마음속’
  alternative_readings:
  - 일관되게 ‘영’
  - 일관되게 ‘마음’
  rationale: 히브리어는 처음에 רוּחַ יְהוָה를 사용해 하나님의 영을 말하고, 끝에서는 ‘너희의 영’이라고 하여 내적 사고를 지칭합니다. 한국어에서는 이 긴장을 보존하되 마지막 구는 POB 각주 취지에 맞춰 이해 가능하게 ‘마음속’으로 옮겼습니다.
  doctrine_reference: Ezekiel prophetic anthropology; source-level lexical tension between רוח and inner thought
