  text: לָ/כֵ֣ן אֱמֹ֗ר כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ וְ/קִבַּצְתִּ֤י אֶתְ/כֶם֙ מִן הָ֣/עַמִּ֔ים וְ/אָסַפְתִּ֣י אֶתְ/כֶ֔ם מִן הָ֣/אֲרָצ֔וֹת אֲשֶׁ֥ר נְפֹצוֹתֶ֖ם בָּ/הֶ֑ם וְ/נָתַתִּ֥י לָ/כֶ֖ם אֶת אַדְמַ֥ת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/017.yaml
  text: 'Therefore say[a], ‘Thus says the Lord GOD: I will gather you from the peoples and assemble you from the lands where you have been scattered[b], and I will give you the land of Israel.’'
  footnotes:
  - marker: a
    text: 'Hebrew: ''the peoples''; alternatively, ''the nations.'''
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''the Lord GOD'' represents אֲדֹנָי יְהוִה; alternatively, ''the Lord Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 말하십시오. 「주 야훼께서 이렇게 말씀하십니다. 내가 너희를 여러 백성들 가운데에서 모으고, 너희가 그들 가운데 흩어졌던 여러 땅들에서 너희를 모아, 너희에게 이스라엘의 땅을 주겠습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 「백성들」이며, 대안으로 「민족들」도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 「주 야훼」에 해당하는 합성 호칭입니다. 전통적 번역의 관용을 따르지 않고 고유명 「야훼」를 살렸습니다.
    reason: theological_note
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 그런즉
  lexicon: HALOT
  rationale: 앞선 심판/회복 선언에 이어지는 결론을 나타내는 접속부사로서, 현대 합쇼체에서는 「그러므로」가 가장 자연스럽고 논리 관계를 분명히 드러냅니다.
- source_word: אֱמֹר
  english_pob_choice: say
  chosen_korean: 말하십시오
  alternatives_korean:
  - 말하시오
  - 말하세요
  lexicon: HALOT
  rationale: 선지자에게 주어진 직접 명령이므로, 예언적 전달 상황을 살리면서도 현대 한국어의 공손한 명령형으로 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님 야훼
  - 주 여호와
  lexicon: HALOT
  rationale: 합성 호칭의 두 요소를 모두 살리기 위해 「주」와 고유명 「야훼」를 함께 두었습니다. 영어의 관용적 「Lord GOD」보다 원문 고유명 보존을 우선했습니다.
- source_word: הָעַמִּים
  english_pob_choice: the peoples
  chosen_korean: 여러 백성들
  alternatives_korean:
  - 여러 민족들
  - 백성들
  lexicon: HALOT
  rationale: עַמִּים의 복수성과 분산된 집단을 드러내기 위해 「여러 백성들」로 옮겼습니다. 「민족들」도 가능하지만, 문맥상 사람 집단의 다수를 더 직접적으로 보여 줍니다.
- source_word: וְאָסַפְתִּי
  english_pob_choice: assemble
  chosen_korean: 모아
  alternatives_korean:
  - 집결시켜
  - 한데 모아
  lexicon: HALOT
  rationale: 앞의 「모으고」와 의미가 겹치지만, 두 동사의 중복적 누적 효과를 살리기 위해 자연스럽게 「모아」로 처리했습니다.
- source_word: הָאֲרָצוֹת
  english_pob_choice: the lands
  chosen_korean: 여러 땅들
  alternatives_korean:
  - 땅들
  - 나라들
  lexicon: HALOT
  rationale: 포로로 흩어진 지역들을 가리키므로 「땅들」이 지리적 의미를 가장 직접적으로 드러냅니다. 복수성을 살리기 위해 「여러」를 덧붙였습니다.
- source_word: אֲדְמַת יִשְׂרָאֵל
  english_pob_choice: the land of Israel
  chosen_korean: 이스라엘의 땅
  alternatives_korean:
  - 이스라엘 땅
  - 이스라엘의 토지
  lexicon: HALOT
  rationale: אַדְמָה의 땅/토지 의미를 반영하되, 회복 약속의 상속적·지리적 의미를 살려 「이스라엘의 땅」으로 옮겼습니다.
theological_decisions:
- issue: 예언적 사자전달 공식과 하나님의 직접 화법의 구분
  chosen_reading: 「그러므로 말하십시오. … 주 야훼께서 이렇게 말씀하십니다.」
  alternative_readings:
  - 「그러므로 선포하십시오. …」
  - 직접 화법 없이 연결
  rationale: 히브리어는 선지자에게 말하라고 지시한 뒤 곧바로 하나님의 말씀을 인용합니다. 한국어에서도 전달 명령과 신적 인용을 분리해 예언 텍스트의 구조를 보존했습니다.
  doctrine_reference: 예언서 화법과 본문 구조 보존
