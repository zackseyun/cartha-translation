  text: 야훼의 말씀이 제게 임하여 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה는 전통적으로 ‘주님’으로 번역되기도 합니다.
