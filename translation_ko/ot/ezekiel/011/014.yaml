lexical_decisions:
- source_word: וַיְהִי דְבַר
  english_pob_choice: And the word ... came
  chosen_korean: 말씀이 ... 임하여
  alternatives_korean:
  - 말씀이 ... 오셔서
  - 말씀이 ... 이르러
  lexicon: HALOT
  rationale: 히브리어 예언 공식의 동사 היה를 한국어로 기계적으로 옮기기보다, POB의 영어처럼 ‘말씀이 임하다’로 자연스럽게 처리해 예언적 도입구의 의미와 어조를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 문맥의 히브리어 고유명사 יְהוָה를 전통적 대체어인 ‘주님’이 아니라 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 하나님의 고유한 이름을 유지했습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 제게
  alternatives_korean:
  - 내게
  - 나에게
  lexicon: HALOT
  rationale: 예언자에게 향하는 방향을 현대 한국어로 자연스럽게 나타내기 위해 ‘제게’를 선택했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시기를
  - 말하여
  lexicon: HALOT
  rationale: 히브리어의 직접화법 도입 표현을 한국어에서는 종결 동사로 풀어내는 것이 자연스러워, 뒤따르는 직접 발화를 암시하는 문장 구조로 옮겼습니다.
theological_decisions:
- issue: 예언 공식에서 ‘the word of Yahweh’의 한국어 처리
  chosen_reading: ‘야훼의 말씀’으로 직역해 예언 계시의 주체를 분명히 했습니다.
  alternative_readings:
  - ‘주님의 말씀’
  - ‘하나님의 말씀’
  rationale: 히브리어 원문은 די브ר יְהוָה라는 고유한 예언 공식이므로, 일반화된 호칭보다 고유명사와 ‘말씀’을 결합한 형태가 본문 구조를 더 정확히 반영합니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → 야훼
