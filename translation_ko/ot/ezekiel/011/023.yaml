    rationale: ‘성읍 한가운데에서’는 תּוֹךְ הָעִיר만 반영하며, 하나님의 영광이 성읍의 한가운데 ‘위’에 있던 위치에서 올라가는 장면을 충분히 전달하지 못합니다.
