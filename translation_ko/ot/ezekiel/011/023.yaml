  text: וַ/יַּ֨עַל֙ כְּב֣וֹד יְהוָ֔ה מֵ/עַ֖ל תּ֣וֹךְ הָ/עִ֑יר וַֽ/יַּעֲמֹד֙ עַל הָ/הָ֔ר אֲשֶׁ֖ר מִ/קֶּ֥דֶם לָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/023.yaml
  text: And the glory of Yahweh went up from the midst of the city and stood on the mountain that is east of the city[a][b].
  footnotes:
  - marker: a
    text: Or "ascended" for "went up."
    reason: lexical_alternative
  - marker: b
    text: Hebrew "which is east of the city"; possibly "which is in front of the city," depending on spatial orientation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 야훼의 영광이 성읍 한가운데 위에서 올라가서 성읍 동쪽에 있는 산 위에 섰습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “솟아올랐습니다”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “성읍 앞에 있는”으로도 이해할 수 있습니다. 이는 공간의 방향을 어떻게 잡는가에 따라 달라집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 영광스러운 임재
  - 주님의 영광
  lexicon: HALOT
  rationale: כָּבוֹד는 하나님의 드러난 영광을 가리키므로, ‘영광’으로 직역하고 소유격으로 קשר를 살려 ‘야훼의 영광’으로 옮겼습니다.
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라가서
  alternatives_korean:
  - 올라갔습니다
  - 승천하여
  lexicon: HALOT
  rationale: עלה의 기본 의미인 ‘올라가다’를 자연스러운 서술체로 살려, 시각적 이동을 드러내는 ‘올라가서’로 옮겼습니다.
- source_word: מֵעַל תּוֹךְ הָעִיר
  english_pob_choice: from the midst of the city
  chosen_korean: 성읍 한가운데에서
  alternatives_korean:
  - 성읍의 가운데에서
  - 성읍 안에서
  lexicon: HALOT
  rationale: ‘from upon/within the midst’의 공간감을 한국어에서 가장 자연스럽게 전달하기 위해 ‘한가운데에서’를 택했습니다.
- source_word: אֲשֶׁר מִקֶּדֶם לָעִיר
  english_pob_choice: that is east of the city
  chosen_korean: 성읍의 동쪽에 있는
  alternatives_korean:
  - 성읍 앞쪽에 있는
  - 성읍 동편에 있는
  lexicon: HALOT
  rationale: מִקֶּדֶם은 문맥상 방향 표지로서 ‘동쪽에’가 가장 분명하므로, 지리적 의미를 살려 옮겼습니다.
theological_decisions:
- issue: 신적 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신적 이름을 직접 사용하므로, POB 지침에 따라 칭호인 ‘주’ 대신 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
