id: EZK.11.4
reference: Ezekiel 11:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֖ן הִנָּבֵ֣א עֲלֵי/הֶ֑ם הִנָּבֵ֖א בֶּן אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/004.yaml
  text: Therefore prophesy against them[a]; prophesy[b], son of man.
  footnotes:
  - marker: a
    text: Or 'prophesy concerning them'; the Hebrew preposition can be broader, but in this context of rebuke and judgment, 'against them' best fits.
    reason: lexical_alternative
  - marker: b
    text: '''Son of man'' is Ezekiel''s recurring form of address; alternatively, ''human one'' or ''mortal.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들에게 예언하십시오[a]. 예언하십시오, 인자여[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에 대하여 예언하십시오’; 히브리어 전치사는 더 넓게 될 수 있지만, 이 문맥의 책망과 심판에서는 ‘그들에게’가 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘인자’는 에스겔에서 반복되는 호칭입니다. 다른 말로는 ‘사람의 아들’ 또는 ‘인간’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 따라서
  lexicon: HALOT
  rationale: 앞 문맥의 심판 선언으로부터 이어지는 논리적 귀결을 한국어 연결어로 자연스럽게 살렸습니다.
- source_word: הִנָּבֵא
  english_pob_choice: prophesy
  chosen_korean: 예언하십시오
  alternatives_korean:
  - 예언하소서
  - 예언하세요
  lexicon: HALOT
  rationale: 에스겔의 선지자적 명령형을 현대 합쇼체로 옮기되, 명령의 직접성을 유지했습니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: against them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그들에 대하여
  - 그들을 향하여
  lexicon: HALOT
  rationale: 히브리어 עַל은 여기서 반대·심판의 뉘앙스를 가지지만, 한국어에서는 앞뒤 문맥이 이미 심판 선언이므로 본문은 간결하게 두고[a]에서 대안 의미를 밝혔습니다.
- source_word: בֶּן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자여
  alternatives_korean:
  - 사람의 아들아
  - 인간이여
  lexicon: HALOT
  rationale: 에스겔의 반복적 호칭을 살리면서도 한국어 성경에서 익숙한 호격 형태를 반영했습니다. 본문의 어조를 자연스럽게 하되 원문의 대면성을 유지합니다.
theological_decisions:
- issue: 에스겔의 호칭 בֶּן אָדָם 처리
  chosen_reading: 인자여
  alternative_readings:
  - 사람의 아들아
  - 인간이여
  rationale: 이 표현은 에스겔에서 예언자와 하나님의 거리감, 그리고 인간성을 강조하는 고정 호칭입니다. 본문에서는 직역적 뉘앙스를 유지하면서도 한국어 호격으로 자연화했습니다.
  doctrine_reference: 'DOCTRINE.md: 핵심 용어의 일관성 유지, 소스 직접성 우선'
- issue: עֲלֵיהֶם의 방향성
  chosen_reading: 그들에게
  alternative_readings:
  - 그들을 향하여
  - 그들에 대하여
  rationale: 히브리어 전치사는 문맥에 따라 '대하여/against'까지 폭이 있으나, 이 절은 곧바로 책망과 심판 예언이 이어지므로 한국어 본문은 과도한 해석 없이 본문을 간결하게 두고, 각주에서 대안 의미를 보완했습니다.
  doctrine_reference: 'DOCTRINE.md: 문맥에 따른 의미 범위 보존'
