  rationale: 히브리어 עַל은 여기서 반대·심판의 뉘앙스를 가지지만, 한국어에서는 앞뒤 문맥이 이미 심판 선언이므로 본문은 간결하게 두고[a]에서 대안 의미를 밝혔습니다.
- source_word: בֶּן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자여
  alternatives_korean:
  - 사람의 아들아
  - 인간이여
