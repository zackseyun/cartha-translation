  rationale: 에스겔의 반복적 호칭을 살리면서도 한국어 성경에서 익숙한 호격 형태를 반영했습니다. 본문의 어조를 자연스럽게 하되 원문의 대면성을 유지합니다.
theological_decisions:
- issue: 에스겔의 호칭 בֶּן אָדָם 처리
  chosen_reading: 인자여
  alternative_readings:
  - 사람의 아들아
  - 인간이여
  rationale: 이 표현은 에스겔에서 예언자와 하나님의 거리감, 그리고 인간성을 강조하는 고정 호칭입니다. 본문에서는 직역적 뉘앙스를 유지하면서도 한국어 호격으로 자연화했습니다.
  doctrine_reference: 'DOCTRINE.md: 핵심 용어의 일관성 유지, 소스 직접성 우선'
- issue: עֲלֵיהֶם의 방향성
  chosen_reading: 그들에게
  alternative_readings:
  - 그들을 향하여
  - 그들에 대하여
  rationale: 히브리어 전치사는 문맥에 따라 '대하여/against'까지 폭이 있으나, 이 절은 곧바로 책망과 심판 예언이 이어지므로 한국어 본문은 과도한 해석 없이 본문을 간결하게 두고, 각주에서 대안 의미를 보완했습니다.
  doctrine_reference: 'DOCTRINE.md: 문맥에 따른 의미 범위 보존'
