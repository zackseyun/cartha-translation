base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/004.yaml
  text: Therefore prophesy against them[a]; prophesy[b], son of man.
  footnotes:
  - marker: a
    text: Or 'prophesy concerning them'; the Hebrew preposition can be broader, but in this context of rebuke and judgment, 'against them' best fits.
    reason: lexical_alternative
  - marker: b
    text: '''Son of man'' is Ezekiel''s recurring form of address; alternatively, ''human one'' or ''mortal.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들을 거슬러 예언하십시오[a]. 예언하십시오, 인자여[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에 대하여 예언하십시오’. 히브리어 전치사는 더 넓은 의미로 쓰일 수 있으나, 책망과 심판의 문맥에서는 ‘그들을 거슬러’가 가장 알맞습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘인자’는 에스겔에게 반복해서 사용되는 호칭입니다. 직역하면 ‘사람의 아들’이며, ‘인간이여’로도 옮길 수 있습니다.
    reason: lexical_alternative
