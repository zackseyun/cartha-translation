  lexicon: HALOT
  rationale: הַגּוֹלָה는 집합적 표현이지만, 한국어에서는 수신 대상을 분명히 드러내는 복수형 ‘포로들’이 가장 자연스럽고 문맥에도 맞습니다.
- source_word: כָּל דִּבְרֵי יְהוָה
  english_pob_choice: all the words of Yahweh
  chosen_korean: 야훼의 모든 말씀
  alternatives_korean:
  - 야훼의 모든 말들
  - 야훼께서 하신 모든 말씀
  lexicon: HALOT
  rationale: דִּבְרֵי는 단순한 정보가 아니라 선포된 계시의 내용을 가리키므로 ‘말씀’으로 옮겼고, ‘모든’은 누락 없이 전달했다는 점을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה를 전통적 대체어가 아닌 고유명사 ‘야훼’로 직역해, 문맥의 인격적·언약적 이름을 보존했습니다.
- source_word: הֶרְאָנִי
  english_pob_choice: that he had shown me
  chosen_korean: 그분이 내게 보여 주신 것
  alternatives_korean:
  - 그분이 내게 보여 주신 것들
  - 그분이 내게 보여 주신 바
  lexicon: HALOT
  rationale: 히필형 ראה는 ‘보여 주다/계시하다’의 뜻이므로, 예언자가 받은 계시의 내용을 가리키는 자연스러운 한국어로 처리했습니다.
theological_decisions:
- issue: 계시의 내용과 전달의 관계
  chosen_reading: ‘그분이 내게 보여 주신 것’을 ‘야훼의 모든 말씀’과 병렬로 두어, 예언자가 본 환상/계시와 들은 말씀을 함께 포괄했습니다.
  alternative_readings:
  - ‘그분이 내게 보여 주신 모든 말씀’
  - ‘그분이 내게 보이신 모든 것’
  rationale: 히브리어는 ‘말씀들’과 ‘보여 주신 것’이 구분되므로, 둘을 하나로 합쳐 버리면 계시의 매개 방식이 흐려집니다. 한국어에서도 둘의 관계를 유지하는 편이 본문에 더 충실합니다.
  doctrine_reference: Ezekiel prophetic revelation; source-text distinction between דִּבְרֵי and הֶרְאָנִי
