  lexicon: HALOT
  rationale: wayyiqtol의 순차 진행을 한국어에서 자연스러운 서술 연결로 살려, 단순한 병렬 접속보다 사건의 다음 단계임을 분명히 했습니다.
- source_word: אֶל הַגּוֹלָה
  english_pob_choice: to the exiles
