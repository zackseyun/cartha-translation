id: EZK.11.9
reference: Ezekiel 11:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הוֹצֵאתִ֤י אֶתְ/כֶם֙ מִ/תּוֹכָ֔/הּ וְ/נָתַתִּ֥י אֶתְ/כֶ֖ם בְּ/יַד זָרִ֑ים וְ/עָשִׂ֛יתִי בָ/כֶ֖ם שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/009.yaml
  text: And I will bring you out from its midst[a], and I will give you into the hand of foreigners[b], and I will execute judgments on you.
  footnotes:
  - marker: a
    text: Or 'deliver you into the hand of foreigners.' The Hebrew idiom 'give into the hand of' means to hand someone over to another's power.
    reason: lexical_alternative
  - marker: b
    text: Or 'execute judgments on you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 가운데서 너희를 끌어내어, 너희를 외국인들의 손에 넘겨주고[a], 너희에게 심판을 집행하겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외국인들의 손에 넘겨주겠다.’ 히브리어 ‘~의 손에 주다’는 누군가를 다른 이의 권세 아래로 넘긴다는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희에게 심판을 내리겠습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  english_pob_choice: And I will bring you out
  chosen_korean: 너희를 끌어내고
  alternatives_korean:
  - 너희를 데리고 나오고
  - 너희를 이끌어 내고
  lexicon: WLC/HALOT
  rationale: 히필형 동사 יצא의 사역적 의미를 살리면서, 심판 문맥에서 자연스럽게 읽히는 ‘끌어내다’를 선택했습니다.
- source_word: מִתּוֹכָהּ
  english_pob_choice: from its midst
  chosen_korean: 그 가운데서
  alternatives_korean:
  - 그 한가운데서
  - 그 안에서
  lexicon: WLC/HALOT
  rationale: ‘가운데’는 תּוֹךְ의 내부/중앙이라는 이미지를 살리며, 여성형 대명사 어미는 문맥상 예루살렘을 가리키는 것으로 한국어에서는 자연스럽게 처리했습니다.
- source_word: בְּיַד זָרִים
  english_pob_choice: into the hand of foreigners
  chosen_korean: 외국인들의 손에 넘기며
  alternatives_korean:
  - 낯선 이들의 손에 넘기며
  - 외인들의 손에 맡기며
  lexicon: WLC/HALOT
  rationale: ‘손에’는 히브리어 관용구의 권력/지배 하에 둠을 나타내므로 직역보다 한국어 관용에 맞게 ‘넘기다’로 풀어, 피지배 상태를 드러냈습니다.
- source_word: שְׁפָטִים
  english_pob_choice: execute judgments
  chosen_korean: 심판을 내리겠습니다
  alternatives_korean:
  - 판결을 집행하겠습니다
  - 심판 행위를 하겠습니다
  lexicon: WLC/HALOT
  rationale: שְׁפָטִים는 단순 판단이 아니라 징벌적 사법 행위를 뜻하므로, 자연스러운 현대어로 ‘심판을 내리다’가 문맥을 가장 잘 전달합니다.
theological_decisions:
- issue: 지시대상인 ‘그 가운데서’의 보충 여부
  chosen_reading: 예루살렘/도시를 명시하지 않고 ‘그 가운데서’로 유지했습니다.
  alternative_readings:
  - 그 도시의 가운데서
  - 예루살렘의 가운데서
  rationale: 원문은 3인칭 여성 단수 접미사로 도시를 가리키지만, 한국어 본문에서는 문맥이 이미 충분하므로 대상을 덧붙이지 않아 원문의 압축성을 보존했습니다.
  doctrine_reference: 문맥적 지시대상 유지와 원문 압축성 보존
- issue: בְּיַד זָרִים의 폭력적 함의
  chosen_reading: ‘외국인들의 손에 넘기며’로 번역해 타자의 지배 아래 두는 의미를 드러냈습니다.
  alternative_readings:
  - 외국인들의 손에 주며
  - 외국인들에게 넘겨주며
  rationale: 히브리어 관용구는 단순한 이동이 아니라 권세 아래로의 인도를 뜻하므로, ‘넘기다’로 심판과 포로화를 함께 보이게 했습니다.
  doctrine_reference: 심판과 포로화의 예언적 표현
