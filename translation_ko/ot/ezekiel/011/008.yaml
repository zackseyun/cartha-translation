translation:
  language: ko
  text: 너희는 칼을 두려워하였고, 내가 칼을 너희에게 가져오겠습니다[b]. 주 야훼의 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘칼’입니다. 이 표현은 여기서 전쟁이나 폭력적 심판 전체를 가리키는 넓은 뜻으로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희는 칼을 두려워하였고, 내가 칼을 너희 위에 가져오겠습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב / חֶרֶב
  english_pob_choice: the sword / the sword
  chosen_korean: 칼 / 칼
  alternatives_korean:
  - 검 / 검
  - 전쟁 / 전쟁
  lexicon: HALOT
  rationale: 예언적 심판 문맥에서 히브리어 חֶרֶב은 문자적으로는 ‘칼’이지만 폭력적 심판 전체를 가리키는 메타로니미이기도 합니다. 여기서는 반복된 이미지를 살리기 위해 기본 의미를 따라 ‘칼’로 옮겼습니다.
- source_word: יְרֵאתֶם
  english_pob_choice: you have feared
  chosen_korean: 두려워하였고
  alternatives_korean:
  - 두려워했습니다
  - 무서워하였고
  lexicon: HALOT
  rationale: 2인칭 복수 완료형의 비난 어조를 한국어에서 자연스럽게 살리기 위해 ‘두려워하였고’로 옮겼습니다. 현재완료 뉘앙스를 지나치게 강조하기보다 선지자적 책망의 결과성을 드러냅니다.
- source_word: עֲלֵיכֶם
  english_pob_choice: upon you
  chosen_korean: 너희에게
  alternatives_korean:
  - 너희 위에
  - 너희 위로
  lexicon: HALOT
  rationale: עמל/재앙을 ‘너희에게 가져오다’는 한국어에서 가장 자연스럽고 직관적인 심판 표현이므로 ‘너희에게’로 처리했습니다. ‘위에’는 원문 구조를 더 가깝게 드러내지만 한국어에서는 다소 부자연스럽습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: DOCTRINE.md contested terms; HALOT
  rationale: 고유한 언약명 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, אֲדֹנָי와의 결합은 ‘주 야훼’로 간결하게 유지했습니다. 영어 관용인 ‘Lord GOD’의 이중 표기를 그대로 따르기보다, 원문의 이름-호칭 결합을 한국어에서 더 직접적으로 드러냅니다.
theological_decisions:
- issue: יהוה의 번역과 אֲדֹנָי יְהוִה 결합 처리
  chosen_reading: ‘야훼’와 호칭 ‘주’를 함께 살려 ‘주 야훼’로 옮김
  alternative_readings:
  - ‘주 하나님’
  - ‘주 여호와’
  rationale: 본문은 예언적 선포의 종결 공식으로 신적 권위를 강조합니다. 프로젝트 기본값에 따라 언약명은 ‘야훼’로 보존하고, 아도나이와의 결합은 한국어에서 어색한 중복 없이 압축해 전달했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
