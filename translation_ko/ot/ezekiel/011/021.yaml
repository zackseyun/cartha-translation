  text: וְ/אֶל לֵ֧ב שִׁקּוּצֵי/הֶ֛ם וְ/תוֹעֲבוֹתֵי/הֶ֖ם לִבָּ֣/ם הֹלֵ֑ךְ דַּרְכָּ/ם֙ בְּ/רֹאשָׁ֣/ם נָתַ֔תִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/021.yaml
  text: But as for those whose heart goes after their detestable things and their abominations[a], I have brought their way upon their own heads[b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Hebrew literally, 'their heart goes to the heart of their detestable things and their abominations,' an idiom meaning they are inwardly devoted to them.
    reason: lexical_alternative
  - marker: b
    text: Or 'their idols' for 'their detestable things'; the Hebrew term often refers to abhorrent cult objects.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 자기들의 혐오스러운 것들과 그들의 가증한 것들을 마음에 좇는 자들에 대해서는 내가 그들의 행위를 그들 머리 위에 두었습니다. 주 하나님께서 말씀하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그들의 혐오스러운 것들과 그들의 가증한 것들의 마음을 향해 그의 마음이 간다’는 식으로, 그것들에 내적으로 매여 있다는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 우상들’로 옮길 수 있습니다. 히브리어 שִׁקּוּץ는 흔히 혐오스러운 우상이나 숭배 대상을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֶל
  english_pob_choice: But as for
  chosen_korean: 그러나 …에 대해서는
  alternatives_korean:
  - 그리고 …에게
  - 하지만 …을 향해
  - 그리고 …에 관하여
  lexicon: HALOT
  rationale: 앞선 약속과 대비되는 대상 전환을 한국어에서는 ‘그러나 …에 대해서는’으로 자연스럽게 살렸습니다.
- source_word: לֵב ... לִבָּם הֹלֵךְ
  english_pob_choice: whose heart goes after
  chosen_korean: 마음에 좇는 자들
  alternatives_korean:
  - 마음이 따라가는 자들
  - 마음이 향하는 자들
  - 마음이 좇는 자들
  lexicon: HALOT
  rationale: 히브리어의 ‘마음이 …를 따라간다’는 내적 집착과 추종의 관용구를, ‘마음에 좇다’로 비교적 직역에 가깝게 옮겼습니다.
- source_word: שִׁקּוּצֵיהֶם וְתוֹעֲבוֹתֵיהֶם
  english_pob_choice: their detestable things and their abominations
  chosen_korean: 자기들의 혐오스러운 것들과 그들의 가증한 것들
  alternatives_korean:
  - 그들의 가증한 것들과 그들의 혐오스러운 것들
  - 그들의 우상들과 그들의 가증한 것들
  - 그들의 역겨운 것들과 그들의 가증한 것들
  lexicon: HALOT
  rationale: שִׁקּוּץ는 주로 혐오 대상, ხშირად 우상까지 포함할 수 있지만 ‘우상’으로 좁히지 않고 ‘혐오스러운 것들’로 유지해 뒤의 תּוֹעֵבָה와 구분했습니다.
- source_word: דַּרְכָּם בְּרֹאשָׁם נָתַתִּי
  english_pob_choice: I have brought their way upon their own heads
  chosen_korean: 그들의 행위를 그들 머리 위에 두었습니다
  alternatives_korean:
  - 그들의 길을 그들 머리 위에 두었습니다
  - 그들의 행위를 그들 머리 위에 가져왔습니다
  - 그들의 길을 그들 머리 위에 돌려주었습니다
  lexicon: HALOT
  rationale: ‘길/행위’를 머리 위에 놓는 보응의 관용구를 한국어에서 가장 자연스럽게 전달하기 위해 ‘두었습니다’를 택했습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님께서 말씀하십니다
  alternatives_korean:
  - 주 하나님께서 선언하십니다
  - 주 야훼께서 말씀하십니다
  - 주 하나님의 선언입니다
  lexicon: HALOT
  rationale: 예언적 선포 공식은 한국어 성경 문체에서 ‘말씀하십니다’가 가장 자연스럽고, 아도나이+야훼의 결합은 ‘주 하나님’으로 간결하게 살렸습니다.
theological_decisions:
- issue: 아도나이+야훼 결합의 한국어 처리
  chosen_reading: 주 하나님
  alternative_readings:
