  - 주 하나님께서
  - 주 여호와
  rationale: 본 절의 어휘적 핵심은 심판 선언의 화자 표지이며, 합쇼체 본문에서는 예언 공식의 자연스러움을 우선해 ‘주 하나님’을 사용했습니다.
  doctrine_reference: POB name-rendering policy for אֲדֹנָי יְהוִה
