  text: 인자야, 네 형제들, 네 형제들, 곧 네 구속의 사람들[a]과 이스라엘 온 족속 전체, 바로 그들에게 예루살렘 주민들이 이렇게 말하였다. ‘야훼에게서 멀리 떠나가라. 이 땅은 우리에게 소유로 주어졌다.’[b]
