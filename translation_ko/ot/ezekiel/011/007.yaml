id: EZK.11.7
reference: Ezekiel 11:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ חַלְלֵי/כֶם֙ אֲשֶׁ֣ר שַׂמְתֶּ֣ם בְּ/תוֹכָ֔/הּ הֵ֥מָּה הַ/בָּשָׂ֖ר וְ/הִ֣יא הַ/סִּ֑יר וְ/אֶתְ/כֶ֖ם הוֹצִ֥יא מִ/תּוֹכָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/007.yaml
  text: 'Therefore thus says Lord Yahweh: Your slain whom you have placed in its midst—they are the meat[a], and it is the pot; but you I will bring out from its midst.'
  footnotes:
  - marker: a
    text: Or 'they are the flesh.' Hebrew בָּשָׂר can mean 'flesh' or 'meat'; here 'meat' fits the cooking-pot metaphor more naturally in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. 너희가 그 가운데에 둔 너희의 죽임당한 자들이 곧 고기이고, 그것은 솥입니다. 그러나 너희는 내가 그 가운데에서 끌어내겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '고기'가 아니라 '살'로도 옮길 수 있습니다. 히브리어 בָּשָׂר는 '살'과 '고기'를 모두 뜻할 수 있으나, 여기서는 솥 비유에 '고기'가 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: Lord Yahweh
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: POB의 'Lord Yahweh'를 따라 두 호칭을 함께 살리되, יְהוִה는 프로젝트 기본값에 맞춰 '야훼'로 옮겼습니다.
- source_word: חַלְלֵיכֶם
  english_pob_choice: your slain
  chosen_korean: 너희의 죽임당한 자들
  alternatives_korean:
  - 너희의 죽은 자들
  - 너희의 시체들
  lexicon: HALOT
  rationale: 단순한 죽음이 아니라 전쟁/폭력으로 죽임을 당한 대상을 가리키므로, 그 폭력성을 드러내는 표현을 택했습니다.
- source_word: הֵמָּה הַבָּשָׂר
  english_pob_choice: they are the meat
  chosen_korean: 곧 고기
  alternatives_korean:
  - 곧 살
  - 곧 육체
  lexicon: HALOT
  rationale: 솥 비유의 맥락에서 בָּשָׂר는 조리된 '고기'의 이미지를 자연스럽게 전달하므로, 본문의 비유를 살리는 쪽을 택했습니다.
- source_word: הוֹצִיא
  english_pob_choice: I will bring out
  chosen_korean: 내가 ... 끌어내겠습니다
  alternatives_korean:
  - 내가 ... 꺼내겠습니다
  - 내가 ... 데리고 나가겠습니다
  lexicon: HALOT
  rationale: 예언적 직접화법에서 1인칭으로 자연스럽게 옮기고, הסיר/출개의 이미지를 한국어에서 가장 직관적으로 드러내는 동사를 사용했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: '''야훼''를 본문에 두어 언약 이름의 직접성을 유지했습니다.'
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB 지침에 따라 טetragrammaton을 전통 교회어로 완화하지 않고, 본문이 가진 고유한 하나님의 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 솥 비유의 보존
  chosen_reading: '''그것은 솥입니다''로 비유를 그대로 유지했습니다.'
  alternative_readings:
  - 그것은 비유적으로 솥과 같습니다
  - 그것은 그릇입니다
  rationale: 선지자의 역전 선언이 주는 긴장과 심판의 이미지를 해석해 풀지 않고, 원문의 은유를 그대로 보존했습니다.
  doctrine_reference: POB translation philosophy §3 — preserve metaphor and theological tension
