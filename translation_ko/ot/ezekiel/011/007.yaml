revisions:
- from: 그러므로 주 야훼께서 이렇게 말씀하십니다. 너희가 그 가운데에 둔 너희의 죽임당한 자들이 곧 고기이고, 그것은 솥입니다. 그러나 너희는 내가 그 가운데에서 끌어내겠습니다.[a]
  to: 그러므로 주 야훼께서 이렇게 말씀하십니다. 너희가 그 가운데에 둔 너희의 죽임당한 자들이 곧 고기이고, 그것은 솥입니다. 그러나 내가 너희를 그 가운데에서 끌어내겠습니다.[a]
