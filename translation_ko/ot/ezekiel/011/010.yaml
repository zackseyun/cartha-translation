translation:
  language: ko
  text: 너희는 칼에 쓰러질 것이며, 내가 이스라엘의 경계에서 너희를 심판할 것입니다. 너희는 내가 야훼인 줄 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 경계 위에서’. 히브리어 구문은 이스라엘의 경계에서 또는 그 위에서의 위치를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֶרֶב
  english_pob_choice: by the sword
  chosen_korean: 칼에
  alternatives_korean:
  - 칼로
  - 칼로써
  lexicon: HALOT
  rationale: ב + חֶרֶב은 수단을 나타내므로 한국어에서는 자연스럽게 ‘칼에’로 옮겨, 죽음의 수단이라는 이미지를 간결하게 살렸습니다.
- source_word: תִּפֹּלוּ
  english_pob_choice: you will fall
  chosen_korean: 쓰러질 것이며
  alternatives_korean:
  - 떨어질 것이며
  - 죽을 것이며
  lexicon: HALOT
  rationale: נפל의 기본 이미지는 ‘넘어지다/쓰러지다’이므로, 심판 문맥의 죽음 의미를 유지하면서도 원문의 동작 이미지를 살렸습니다.
- source_word: עַל גְּבוּל יִשְׂרָאֵל
  english_pob_choice: at the border of Israel
  chosen_korean: 이스라엘의 경계에서
  alternatives_korean:
  - 이스라엘의 변두리에서
  - 이스라엘 국경에서
  lexicon: HALOT
  rationale: גְּבוּל은 경계/변경/영역을 뜻하며, עַל과 함께 장소 표시로 읽혀 ‘~의 경계에서’가 가장 자연스럽고 본문 취지에 맞습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 프로젝트 기본 용례
  rationale: 본문의 신명 표기는 인명칭 대신 학술적 음역인 ‘야훼’를 사용하여 원문 고유명을 보존했습니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 처리
  chosen_reading: ‘야훼’로 직역성 있게 유지했습니다.
  alternative_readings:
  - ‘주님’ 또는 ‘여호와’
  rationale: 원문이 하나님의 고유명 יְהוָה를 직접 사용하므로, 제목어로 대체하지 않고 이름 자체를 드러내는 것이 본문의 언약적 선언을 더 분명히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
