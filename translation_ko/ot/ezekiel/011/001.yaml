  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּשָּׂ֨א אֹתִ֜/י ר֗וּחַ וַ/תָּבֵ֣א אֹ֠תִ/י אֶל שַׁ֨עַר בֵּית יְהוָ֤ה הַ/קַּדְמוֹנִי֙ הַ/פּוֹנֶ֣ה קָדִ֔ימָ/ה וְ/הִנֵּה֙ בְּ/פֶ֣תַח הַ/שַּׁ֔עַר עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה אִ֑ישׁ וָ/אֶרְאֶ֨ה בְ/תוֹכָ֜/ם אֶת יַאֲזַנְיָ֧ה בֶן עַזֻּ֛ר וְ/אֶת פְּלַטְיָ֥הוּ בֶן בְּנָיָ֖הוּ שָׂרֵ֖י הָ/עָֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/001.yaml
  text: Then the Spirit lifted me up and brought me to the east gate of the house of Yahweh[a], which faces eastward. And behold, at the entrance of the gate were twenty-five men, and I saw among them Jaazaniah son of Azzur and Pelatiah son of Benaiah[c][b], leaders of the people.
  footnotes:
  - marker: a
    text: Or 'a spirit lifted me up'; Hebrew רוּחַ can also mean 'wind' or 'spirit,' but in Ezekiel's vision context it most likely refers to the divine Spirit.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the gate of the house of the LORD'; that is, the temple gate.
    reason: cultural_note
  - marker: c
    text: Or 'princes of the people' or 'officials of the people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 영께서[a] 나를 들어 올리시어 야훼의 집 동쪽 문[b]으로 데려가셨습니다. 그 문은 동쪽을 향하고 있었습니다. 보십시오, 그 문 입구에 스물다섯 명의 남자가 있었고, 나는 그들 가운데 아술의 아들 야아사냐와 브나야의 아들 블라댜를 보았습니다. 그들은 백성의 지도자들이었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떤 영이 나를 들어 올렸다’로도 옮길 수 있습니다. 히브리어 רוּחַ는 ‘바람’이나 ‘영’도 뜻하지만, 에스겔의 환상 문맥에서는 하나님의 영을 가리킬 가능성이 가장 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘야훼의 집 문’이며, 곧 성전 문을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘백성의 방백들’ 또는 ‘백성의 관리들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא אֹתִי רוּחַ
  english_pob_choice: the Spirit lifted me up
  chosen_korean: 그 영께서 나를 들어 올려
  alternatives_korean:
  - 성령께서 나를 들어 올려
  - 어떤 영이 나를 들어 올려
  - 바람이 나를 들어 올려
  lexicon: HALOT
  rationale: 비전 문맥에서 רוּחַ는 단순한 바람이나 불특정 영보다 하나님께서 보내시는 영으로 읽는 것이 자연스러워, ‘그 영’으로 옮겨 원문과 POB의 긴장을 함께 살렸습니다.
- source_word: וַתָּבֵא אֹתִי
  english_pob_choice: brought me
  chosen_korean: 데려오셨습니다
  alternatives_korean:
  - 데려왔습니다
  - 이끌어 오셨습니다
  - 가져오셨습니다
  lexicon: HALOT
  rationale: 힙힐 형태의 이동 동사를 한국어에서 가장 자연스럽게 드러내면서도, 비전 속 운반의 뉘앙스를 유지하기 위해 ‘데려오셨습니다’로 번역했습니다.
- source_word: שַׁעַר בֵּית יְהוָה
  english_pob_choice: the gate of the house of Yahweh
  chosen_korean: 야훼의 집 동쪽 문
  alternatives_korean:
  - 야훼의 집 문
  - 야훼의 성전 문
  - 주님의 집 동쪽 문
  lexicon: HALOT
  rationale: ‘house of Yahweh’를 직역해 ‘집’으로 유지하고, 지정된 위치인 동쪽 문을 앞세워 원문의 공간 정보를 보존했습니다.
- source_word: הַפּוֹנֶה קָדִימָה
  english_pob_choice: which faces eastward
  chosen_korean: 그 문은 동쪽을 향하고 있었습니다
  alternatives_korean:
  - 동쪽을 향한 문이었습니다
  - 동쪽으로 마주하고 있었습니다
  lexicon: HALOT
  rationale: 분사구의 방향 설명을 한국어 관형·서술 구조로 자연화하면서도, 문이 실제로 동쪽을 향한다는 반복적 강조를 살렸습니다.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אִישׁ
  english_pob_choice: twenty-five men
  chosen_korean: 스물다섯 명의 남자
  alternatives_korean:
  - 스물다섯 사람
  - 스물다섯 남자들
  lexicon: HALOT
  rationale: 남성 복수 집합을 한국어에서 성별이 드러나는 ‘남자’로 옮겨 원문의 지시 대상을 분명히 했습니다.
- source_word: שָׂרֵי הָעָם
  english_pob_choice: leaders of the people
  chosen_korean: 백성의 지도자들
  alternatives_korean:
  - 백성의 통치자들
  - 백성의 관리들
  - 백성의 귀족들
  lexicon: HALOT
  rationale: שׂרים을 ‘방백’이나 ‘왕자’로 좁히지 않고, 문맥상 권위자들을 포괄하는 ‘지도자들’로 옮겨 현대 독자에게도 명료하게 했습니다.
theological_decisions:
- issue: רוּחַ의 정체
  chosen_reading: 예언자에게 이동을 일으키는 분은 하나님의 영으로 이해했습니다.
  alternative_readings:
  - 바람
  - 어떤 영
  rationale: 에스겔의 환상 장면에서 동일 어근이 반복적으로 신적 매개를 나타내므로, 한국어 본문은 ‘그 영’으로 두고 주석적 확정을 과도하게 피했습니다.
  doctrine_reference: 비전 서술의 문맥적 식별을 존중하되, 원문의 다의성을 완전히 지우지 않는 번역 원칙
- issue: 야훼의 집의 표현
  chosen_reading: ‘집’을 유지해 성전 의미를 직접 해설하지 않았습니다.
  alternative_readings:
  - 성전
  - 주의 전
  rationale: POB가 채택한 ‘house of Yahweh’의 투명성을 살려, 전통적 교회어인 ‘성전’으로 먼저 풀어버리지 않았습니다.
  doctrine_reference: 원문 표면형을 보존하는 출처중심 번역 원칙
