source:
  edition: WLC
  text: וְ/נָתַתִּ֤י לָ/הֶם֙ לֵ֣ב אֶחָ֔ד וְ/ר֥וּחַ חֲדָשָׁ֖ה אֶתֵּ֣ן בְּ/קִרְבְּ/כֶ֑ם וַ/הֲסִ֨רֹתִ֜י לֵ֤ב הָ/אֶ֨בֶן֙ מִ/בְּשָׂרָ֔/ם וְ/נָתַתִּ֥י לָ/הֶ֖ם לֵ֥ב בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/019.yaml
  text: And I will give them one heart[a], and I will put a new spirit within them[b]. I will remove the heart of stone from their flesh and give them a heart of flesh.
  footnotes:
  - marker: a
    text: Hebrew textual form here can be read 'within you'; the sense in context is commonly taken as 'within them,' matching the surrounding pronouns and the close parallel in Ezekiel 36:26.
    reason: textual_variant
  - marker: b
    text: '''One heart'' may also be understood as ''an undivided heart,'' emphasizing unified loyalty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들에게 한 마음을 주고, 너희 가운데 새 영을 넣어 주며, 그들의 살에서 돌 같은 마음을 제거하고 살의 마음을 주겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 자음형은 ‘너희 안에’처럼 읽을 가능성이 있지만, 문맥과 평행본문을 따라 ‘너희 가운데’로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: ‘한 마음’은 ‘분열되지 않은 마음’, 곧 하나로 모아진 충성을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב אֶחָד
  english_pob_choice: one heart
  chosen_korean: 한 마음
  alternatives_korean:
  - 하나의 마음
  - 일심
  lexicon: HALOT
  rationale: 히브리어 לֵב는 단지 감정이 아니라 내면의 의지와 생각을 가리킬 수 있으므로, 직역에 가까운 '한 마음'으로 살려 본문이 말하는 단일하고 통합된 내적 방향을 보존했습니다.
- source_word: רוּחַ חֲדָשָׁה
  english_pob_choice: a new spirit
  chosen_korean: 새 영
  alternatives_korean:
  - 새로운 영
  - 새로운 태도
  lexicon: HALOT
  rationale: רוּחַ는 여기서 인간 내면의 갱신을 가리키는 말이므로 '영'을 유지했습니다. '태도'는 해석을 덧붙이는 표현이라 본문 이미지보다 약합니다.
- source_word: בְּקִרְבְּכֶם
  english_pob_choice: within them
  chosen_korean: 너희 가운데
  alternatives_korean:
  - 그들 안에
  - 너희 안에
  lexicon: HALOT
  rationale: 제시된 자음형은 2인칭 복수로 읽을 여지가 있지만, 앞뒤의 복수 지시와 평행본문을 고려해 공동체적 내주를 나타내는 '너희 가운데'로 옮겼습니다. 이는 본문 전달을 위해 한국어에서 자연스럽게 공동체 내부를 가리키는 표현입니다.
- source_word: לֵב הָאֶבֶן / לֵב בָּשָׂר
  english_pob_choice: the heart of stone / a heart of flesh
  chosen_korean: 돌 같은 마음 / 살의 마음
  alternatives_korean:
  - 돌의 마음 / 육의 마음
  - 돌 같은 심장 / 부드러운 마음
  lexicon: HALOT
  rationale: 히브리어의 대조적 은유를 살리되 한국어에서 이해 가능하도록 '돌 같은 마음'으로 자연화했습니다. 마지막 구절도 문자적 대조를 유지하려 했으나, '살의 마음'은 본문의 물질적 대비를 그대로 드러내는 표현입니다.
theological_decisions:
- issue: ‘heart’와 ‘spirit’의 관계를 심리학적 용어로 평준화할지 여부
  chosen_reading: ‘한 마음’과 ‘새 영’을 분리하여 유지했습니다.
  alternative_readings:
  - ‘새로운 태도’로 통합
  - ‘한 뜻’과 ‘새로운 마음가짐’으로 의역
  rationale: 본문은 이스라엘의 인간론적 범주를 사용해 하나님의 내적 변화를 말하므로, 두 표현을 구분해 유지하는 편이 신학적 결을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: ‘heart of flesh’의 해석 여부
  chosen_reading: ‘살의 마음’처럼 은유를 유지했습니다.
  alternative_readings:
  - ‘부드러운 마음’
  - ‘민감한 마음’
  rationale: 본문은 돌과 살의 대조를 통해 이미지 자체가 신학적 의미를 전달하므로, 설명적 형용사로 풀기보다 은유를 보존하는 편이 더 적합합니다.
  doctrine_reference: Translation philosophy §3, §5
