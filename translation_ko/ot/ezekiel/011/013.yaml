  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כְּ/הִנָּ֣בְאִ֔/י וּ/פְלַטְיָ֥הוּ בֶן בְּנָיָ֖ה מֵ֑ת וָ/אֶפֹּ֨ל עַל פָּנַ֜/י וָ/אֶזְעַ֣ק קוֹל גָּד֗וֹל וָ/אֹמַר֙ אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה כָּלָה֙ אַתָּ֣ה עֹשֶׂ֔ה אֵ֖ת שְׁאֵרִ֥ית יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/013.yaml
  text: And it happened[a], as I was prophesying, that Pelatiah son of Benaiah died. Then I fell on my face and cried out with a loud voice and said, “Ah, Lord GOD[b], will you make a complete end of the remnant of Israel?”
  footnotes:
  - marker: a
    text: Or, 'are you making a complete end of the remnant of Israel?' The Hebrew can be read with present or imminent force.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'Lord GOD' represents אֲדֹנָי יְהוִה, literally 'Lord YHWH.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예언하고 있을 때에, 브나야의 아들 펠라티야가 죽었습니다. 그러자 나는 얼굴을 땅에 대고 엎드려 큰 소리로 외치며 말했습니다. 「아, 주 야훼님, 이스라엘의 남은 자를 완전히 끝내시려는 것입니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 현재적 또는 임박한 의미로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 '주 야훼'는 אֲדֹנָי יְהוִה, 곧 직역하면 '주 야훼'를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהִנָּבְאִי
  english_pob_choice: And it happened, as I was prophesying
  chosen_korean: 예언하고 있을 때에
  alternatives_korean:
  - 예언하는 중에
  - 내가 예언하고 있을 때에
  lexicon: HALOT
  rationale: wayyiqtol과 כ-부정사구가 만드는 시간적 배경을 자연스러운 한국어로 옮기되, 사건의 진행 중 발생한 일을 분명히 보이게 했습니다.
- source_word: וּפְלַטְיָהוּ בֶן בְּנָיָה
  english_pob_choice: Pelatiah son of Benaiah
  chosen_korean: 브나야의 아들 펠라티야
  alternatives_korean:
  - 펠라티야, 브나야의 아들
  - 펠라티야, 브나야의 아들로
  lexicon: HALOT
  rationale: 히브리어의 족보식 표기를 한국어 자연어 순서로 옮기되, 고유명사는 현대 음역을 따랐습니다.
- source_word: אֲהָהּ אֲדֹנָי יְהוִה
  english_pob_choice: Ah, Lord GOD
  chosen_korean: 아, 주 야훼님
  alternatives_korean:
  - 아, 주 하나님
  - 아, 주 야훼
  lexicon: HALOT
  rationale: 아ֲדֹנָי יְהוִה는 직역하면 '주 야훼'이므로, 본문 안에서는 호격에 맞게 '님'을 붙여 기도체의 직접 호소를 살렸습니다. 전통적 '주 여호와'는 쓰지 않았습니다.
- source_word: כָּלָה ... עֹשֶׂה
  english_pob_choice: will you make a complete end
  chosen_korean: 완전히 끝내시려는 것입니까
  alternatives_korean:
  - 완전한 끝을 내시려는 것입니까
  - 완전히 멸하시려는 것입니까
  lexicon: HALOT
  rationale: כָּלָה+עשה의 관용구를 직설적으로 살리면서도, 문맥상 '남은 자'에 대한 전면적 종결을 한국어로 분명히 드러냈습니다.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  english_pob_choice: the remnant of Israel
  chosen_korean: 이스라엘의 남은 자
  alternatives_korean:
  - 이스라엘의 남은 무리
  - 이스라엘의 남은 사람들
  lexicon: HALOT
  rationale: 예언서의 핵심 신학 용어인 שְׁאֵרִית를 '남은 자'로 옮겨, 단순 생존자 이상을 뜻하는 언약적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 예언자 에스겔의 마지막 문장에 담긴 화행
  chosen_reading: 문맥상 탄식이 섞인 질문으로 이해하여, 한국어에서도 물음표를 유지했습니다.
  alternative_readings:
  - 서술형으로 '완전히 끝내고 계십니다'로 옮김
  - 감탄형으로 '완전히 끝내시는군요!'로 옮김
  rationale: 히브리어에 명시적 의문사가 없더라도, 문맥상 에스겔의 중보적 탄식이 드러나므로 질문 형식이 가장 충실합니다.
  doctrine_reference: Ezekiel 11:13 discourse context
- issue: יהוה의 음역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본어휘에 따라 יְהוָה는 야훼로 옮겨, 본문에 있는 신명 자체를 가리지 않도록 했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
