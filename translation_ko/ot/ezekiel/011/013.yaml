base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/013.yaml
  text: And it happened[a], as I was prophesying, that Pelatiah son of Benaiah died. Then I fell on my face and cried out with a loud voice and said, “Ah, Lord GOD[b], will you make a complete end of the remnant of Israel?”
  footnotes:
  - marker: a
    text: Or, 'are you making a complete end of the remnant of Israel?' The Hebrew can be read with present or imminent force.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'Lord GOD' represents אֲדֹנָי יְהוִה, literally 'Lord YHWH.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 예언하고 있을 때에 브나야의 아들 펠라티야가 죽었습니다. 그러자 나는 얼굴을 땅에 대고 엎드려 큰 소리로 부르짖으며 말했습니다. 「아, 주 야훼여[b], 이스라엘의 남은 자를 완전히 끝내시려는 것입니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 마지막 동사구는 ‘이스라엘의 남은 자를 완전히 끝내고 계신 것입니까?’처럼 현재적 또는 임박한 의미로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 אֲדֹנָי יְהוִה는 직역하면 ‘주 야훼’입니다.
    reason: lexical_alternative
