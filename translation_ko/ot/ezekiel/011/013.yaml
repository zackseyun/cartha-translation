  lexicon: HALOT
  rationale: כָּלָה+עשה의 관용구를 직설적으로 살리면서도, 문맥상 '남은 자'에 대한 전면적 종결을 한국어로 분명히 드러냈습니다.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  english_pob_choice: the remnant of Israel
  chosen_korean: 이스라엘의 남은 자
  alternatives_korean:
  - 이스라엘의 남은 무리
  - 이스라엘의 남은 사람들
  lexicon: HALOT
  rationale: 예언서의 핵심 신학 용어인 שְׁאֵרִית를 '남은 자'로 옮겨, 단순 생존자 이상을 뜻하는 언약적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 예언자 에스겔의 마지막 문장에 담긴 화행
  chosen_reading: 문맥상 탄식이 섞인 질문으로 이해하여, 한국어에서도 물음표를 유지했습니다.
  alternative_readings:
  - 서술형으로 '완전히 끝내고 계십니다'로 옮김
  - 감탄형으로 '완전히 끝내시는군요!'로 옮김
  rationale: 히브리어에 명시적 의문사가 없더라도, 문맥상 에스겔의 중보적 탄식이 드러나므로 질문 형식이 가장 충실합니다.
  doctrine_reference: Ezekiel 11:13 discourse context
- issue: יהוה의 음역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본어휘에 따라 יְהוָה는 야훼로 옮겨, 본문에 있는 신명 자체를 가리지 않도록 했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
