  text: לְמַ֨עַן֙ בְּ/חֻקֹּתַ֣/י יֵלֵ֔כוּ וְ/אֶת מִשְׁפָּטַ֥/י יִשְׁמְר֖וּ וְ/עָשׂ֣וּ אֹתָ֑/ם וְ/הָיוּ לִ֣/י לְ/עָ֔ם וַ/אֲנִ֕י אֶהְיֶ֥ה לָ/הֶ֖ם לֵ/אלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/020.yaml
  text: so that they may walk in my statutes and keep my judgments and do them[a], and they will be my people, and I will be their God.
  footnotes:
  - marker: a
    text: Or 'my ordinances' for 'my judgments.' The Hebrew מִשְׁפָּטִים can denote legal rulings or prescribed ordinances in covenant context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 내 규례 안에서 걸으며 내 규례들을 지키고 그것들을 행하게 하려는 것입니다. 그러면 그들은 내 백성이 되고, 나는 그들의 하나님이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁפָּטִים은 문맥에 따라 법적 판결, 또는 언약 안에서 정해진 규례를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֻקֹּתַי
  english_pob_choice: in my statutes
  chosen_korean: 내 규례 안에서
  alternatives_korean:
  - 내 규례들 안에서
  - 내 법도 안에서
  - 내 율례 안에서
  lexicon: HALOT
  rationale: חֻקִּים은 언약적 규범·규례를 가리키므로 ‘규례’가 가장 직접적입니다. ‘안에서’는 영어 POB의 ‘in my statutes’처럼 행동의 영역/기준을 살립니다.
- source_word: יֵלֵכוּ
  english_pob_choice: may walk
  chosen_korean: 걸으며
  alternatives_korean:
  - 살아가며
  - 행하며
  - 걸어가며
  lexicon: HALOT
  rationale: הלך의 관용적 비유를 한국어에서도 ‘걷다’로 살리되, 목적절 안의 자연스러운 연결을 위해 연결형 ‘걸으며’를 택했습니다.
- source_word: מִשְׁפָּטַי
  english_pob_choice: my judgments
  chosen_korean: 내 규례들
  alternatives_korean:
  - 내 판단들
  - 내 판결들
  - 내 율례들
  lexicon: HALOT
  rationale: 문맥상 משפטים는 법적 판결이라기보다 언약 안의 명령·규범을 가리키므로, 영어의 ‘judgments’가 지닌 문맥적 의미를 반영해 ‘규례들’로 옮겼습니다. 본문에 동일 표지를 반복해 평행을 살렸습니다.
- source_word: וְעָשׂוּ אֹתָם
  english_pob_choice: and do them
  chosen_korean: 그것들을 행하게 하려는 것입니다
  alternatives_korean:
  - 그것들을 하려는 것입니다
  - 그것들을 실천하게 하려는 것입니다
  - 그것들을 행하도록 하려는 것입니다
  lexicon: HALOT
  rationale: ‘keep’ 뒤에 실제 실행을 한 번 더 덧붙인 히브리어의 중첩 강조를 살리기 위해 ‘행하다’를 유지했습니다. 목적 구문 전체가 자연스럽게 읽히도록 정리했습니다.
theological_decisions:
- issue: 언약 공식의 재현
  chosen_reading: ‘그들은 내 백성이 되고, 나는 그들의 하나님이 될 것입니다’로 표준적인 언약 공식을 그대로 살렸습니다.
  alternative_readings:
  - 그들은 내 백성일 것이고, 나는 그들의 하나님일 것입니다
  - 그들이 내 백성이 되며, 내가 그들의 하나님이 될 것입니다
  rationale: 본문의 핵심은 하나님과 백성 사이의 상호 언약 관계이므로, 해석을 덧붙이지 않고 전통적 공식을 현대 한국어로 분명하게 재현했습니다.
  doctrine_reference: Translation philosophy §§5–6
