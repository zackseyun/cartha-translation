id: EZK.11.11
reference: Ezekiel 11:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִ֗יא לֹֽא תִהְיֶ֤ה לָ/כֶם֙ לְ/סִ֔יר וְ/אַתֶּ֛ם תִּהְי֥וּ בְ/תוֹכָ֖/הּ לְ/בָשָׂ֑ר אֶל גְּב֥וּל יִשְׂרָאֵ֖ל אֶשְׁפֹּ֥ט אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/011.yaml
  text: It will not be for you as a pot[a], and you will not be within it as meat; at the border of Israel I will judge you.
  footnotes:
  - marker: a
    text: Or 'as flesh.' The Hebrew word is literally 'flesh,' but in this cooking-pot metaphor it refers to meat in the pot.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 너희에게 한 솥이 되지 않을 것이며, 너희는 그 안에서 고기가 되지 않을 것입니다. 내가 이스라엘의 경계에서 너희를 심판하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살’입니다. 히브리어는 문자적으로 ‘살’이지만, 이 솥 비유에서는 솥 안의 고기를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְסִיר
  english_pob_choice: as a pot
  chosen_korean: 한 솥이
  alternatives_korean:
  - 솥처럼
  - 냄비처럼
  - 가마처럼
  lexicon: HALOT
  rationale: סִיר는 조리용 솥/그릇을 가리키므로, 비유를 살리면서도 한국어에서 자연스러운 ‘솥’으로 옮겼습니다.
- source_word: לְבָשָׂר
  english_pob_choice: as meat
  chosen_korean: 고기가
  alternatives_korean:
  - 살이
  - 육체가
  - 고깃덩이가
  lexicon: HALOT
  rationale: 문맥상 בָּשָׂר는 ‘솥 안에 들어가는 고기’의 이미지이므로, 직역적인 ‘살’보다 의미가 분명한 ‘고기’가 적절합니다.
- source_word: אֶל גְּבוּל יִשְׂרָאֵל
  english_pob_choice: at the border of Israel
  chosen_korean: 이스라엘의 경계에서
  alternatives_korean:
  - 이스라엘의 국경에서
  - 이스라엘 땅의 경계에서
  - 이스라엘 변두리에서
  lexicon: HALOT
  rationale: אֶל + גְּבוּל은 이곳에서 장소를 가리키는 방향/도착의 뉘앙스를 가지므로, 사건이 벌어지는 지점으로서 ‘경계에서’가 자연합니다.
- source_word: אֶשְׁפֹּט אֶתְכֶם
  english_pob_choice: I will judge you
  chosen_korean: 너희를 심판하겠습니다
  alternatives_korean:
  - 너희를 판단하겠습니다
  - 너희를 재판하겠습니다
  - 너희에게 판결하겠습니다
  lexicon: HALOT
  rationale: שׁפט의 예언적 문맥상 법정적 판단을 뜻하므로, 한국어 성경에서 널리 쓰이면서도 무게가 살아 있는 ‘심판하다’를 택했습니다.
theological_decisions:
- issue: 예루살렘을 ‘솥’으로 비유하는 역전된 속담 표현
  chosen_reading: 메타포를 풀어 설명하지 않고 ‘솥/고기’ 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘너희를 보호하지 않을 것이다’처럼 의미를 풀어 번역함
  rationale: 이 구절은 앞선 속담을 뒤집는 예언적 수사이므로, 이미지를 보존해야 독자가 본문의 반전과 심판의 강도를 직접 느낄 수 있습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
