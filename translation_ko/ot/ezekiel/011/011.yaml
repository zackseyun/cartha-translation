    issue: 지시 대상이 불명확한 ‘그것’
    rationale: הִיא는 직전 문맥의 성(예루살렘)을 가리키는 여성 단수 대명사입니다. 한국어에서 ‘그것’은 성을 가리킨다는 연결이 약하고 사물화된 인상을 줄 수 있으므로 ‘이 성’으로 명시하는 것이 안전합니다.
  - severity: low
    issue: ‘한 솥이 되지’의 부자연스러운 표현
    rationale: לָכֶם לְסִיר의 비유적 술어는 한국어로 ‘너희에게 솥이 되지’라고 해야 자연스럽습니다. ‘한’은 원문에 없고 이 문맥에서 부자연스럽습니다.
  - severity: low
