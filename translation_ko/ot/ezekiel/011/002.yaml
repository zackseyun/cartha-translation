translation:
  language: ko
  text: 그리고 그가 제게 말씀하셨습니다[a], 「인자야[b], 이들은 이 성읍에서 불의를 꾀하고 악한 조언을 내놓는 사람들입니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 제게 말씀하셨다”.
    reason: alternative_reading
  - marker: b
    text: 직역하면 “사람의 아들”.
    reason: source_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  english_pob_choice: And he said to me
  chosen_korean: 그리고 그가 제게 말씀하셨습니다
  alternatives_korean:
  - 그리고 그가 제게 말하셨습니다
  - 그가 제게 이르셨습니다
  lexicon: BDB/ HALOT
  rationale: 서술적 wayyiqtol의 순서를 살리면서도, 신적 발화이므로 평서적 '말하다'보다 존대가 드러나는 '말씀하셨습니다'를 택했습니다.
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서의 반복적 호칭으로서 관용 표현을 유지해야 하므로, 직역적이면서도 한국어 성경에서 인지 가능한 '인자'를 호격으로 옮겼습니다.
- source_word: הַחֹשְׁבִים אָוֶן
  english_pob_choice: who devise iniquity
  chosen_korean: 불의를 꾀하고
  alternatives_korean:
  - 죄악을 꾸미고
  - 악을 도모하고
  - 불의를 도모하고
  lexicon: HALOT
  rationale: חשׁב은 단순한 '생각하다'가 아니라 의도적으로 꾸미는 의미이므로 '꾀하다'를 택했고, אָוֶן은 문맥상 도덕적 불의를 가리키므로 '불의'로 옮겼습니다.
- source_word: וְהַיֹּעֲצִים עֲצַת רָע
  english_pob_choice: and give evil counsel
  chosen_korean: 악한 조언을 내놓는 사람들
  alternatives_korean:
  - 악한 계책을 베푸는 사람들
  - 악한 계략을 조언하는 사람들
  - 악한 판단을 내리는 사람들
  lexicon: HALOT
  rationale: עצה의 '조언/계책' 의미를 살리되 한국어에서 중복 표현을 피하기 위해 '조언을 내놓다'로 자연스럽게 처리했습니다. רע는 문맥상 도덕적 악으로서 '악한'이 적절합니다.
theological_decisions:
- issue: 에스겔의 반복 호칭 בֶּן אָדָם의 한국어 고정 처리
  chosen_reading: 호칭으로서 '인자야'를 유지했습니다.
  alternative_readings:
  - 사람의 아들아
  - 인간아
  rationale: 이 표현은 예언자 에스겔에게 반복적으로 주어지는 소명적 호칭이므로, 의미를 평평하게 풀기보다 관용적 호칭성을 보존하는 쪽이 본문의 문학적·신학적 효과를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: prophetic vocative preservation'
