  source_fidelity: 핵심 어휘와 비유는 대체로 충실합니다. 다만 הָאֹמְרִים는 앞 문맥의 사람들을 받는 분사이므로, 독립된 한국어 문장에서는 ‘그들이 말하기를’보다 유한동사로 자연스럽게 연결하는 편이 안전합니다. ‘집을 지을 때’의 보충은 히브리어의 타원성을 한국어로 이해 가능하게 옮긴 것으로 허용됩니다.
  naturalness: 초안의 ‘그들이 말하기를’은 현대 표준 한국어, 특히 합쇼체 본문에서는 문장 연결이 어색하고 문체가 고풍스럽습니다. ‘그들은 이렇게 말합니다’와 인용문 종결의 ‘-습니다’로 고치면 자연스럽고 지정된 격식체와 일치합니다.
  terminology: ‘가마솥’과 ‘고기’는 요리 비유를 분명히 전달하며 적절합니다. 각주 b에서 히브리어 בָשָׂר를 ‘살’이라고만 단정하기보다 기본 뜻인 ‘살/고기’를 함께 제시하는 것이 정확합니다.
