source:
  edition: WLC
  text: הָ/אֹ֣מְרִ֔ים לֹ֥א בְ/קָר֖וֹב בְּנ֣וֹת בָּתִּ֑ים הִ֣יא הַ/סִּ֔יר וַ/אֲנַ֖חְנוּ הַ/בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/003.yaml
  text: who say[a], ‘It is not near to build houses. This city is the pot[b], and we are the meat.’
  footnotes:
  - marker: a
    text: Or, “It is not soon to build houses,” or “Not soon is the building of houses.” The Hebrew is elliptical.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the flesh.” In this cooking metaphor, “meat” conveys the image more naturally in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말하기를[a], 「집을 지을 때가 아직 멀었다. 이 도시는 가마솥이고, 우리는 고기다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “집을 짓는 것은 아직 멀었다” 또는 “집을 짓는 일이 아직 가까이 있지 않다.” 히브리어는 생략된 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “살”입니다. 그러나 요리 비유에서는 한국어로 “고기”가 더 자연스럽게 이미지를 전달합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמְרִים
  english_pob_choice: who say
  chosen_korean: 그들이 말하기를
  alternatives_korean:
  - 말하는 사람들이
  - 말하는 자들이
  lexicon: HALOT
  rationale: 분사구문이 앞선 사람들을 수식하는 말이므로, 자연스러운 관계절로 옮겨 지속적인 발화 상태를 살렸습니다.
- source_word: לֹא בְקָרוֹב
  english_pob_choice: It is not near to build houses
  chosen_korean: 집을 지을 때가 아직 멀었다
  alternatives_korean:
  - 집을 짓기에는 아직 이르지 않다
  - 집을 지을 날이 아직 가깝지 않다
  lexicon: HALOT
  rationale: 히브리어가 생략된 표현이어서 한국어에서는 의미를 드러내기 위해 ‘때’ 보충을 허용하되, POB의 엘립시스를 반영해 과도한 해석은 피했습니다.
- source_word: הִיא הַסִּיר
  english_pob_choice: This city is the pot
  chosen_korean: 이 도시는 가마솥이고
  alternatives_korean:
  - 이 도시는 솥이고
  - 그 도시는 가마솥이고
  lexicon: HALOT
  rationale: 문맥상 예루살렘을 가리키는 비유이므로 ‘이 도시’로 풀었고, הַסִּיר는 요리 비유를 살려 ‘가마솥’으로 옮겼습니다.
- source_word: וַאֲנַחְנוּ הַבָּשָׂר
  english_pob_choice: and we are the meat
  chosen_korean: 우리는 고기다
  alternatives_korean:
  - 우리는 살이다
  - 우리는 고깃덩어리다
  lexicon: HALOT
  rationale: 문자적 의미인 ‘고기’를 택해 비유의 이미지를 유지했고, ‘살’은 한국어에서 비유적 전달이 덜 자연스러워 제외했습니다.
theological_decisions:
- issue: 가마솥과 고기 비유의 기능
  chosen_reading: 비유 자체를 본문에서 해석하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 예루살렘의 보호를 자랑하는 말
  - 심판 경고를 깎아내리는 냉소적 구호
  rationale: 이 절은 후문맥에서 의미가 규명되는 속담이므로, 본문 번역에서는 긴장을 풀지 않고 이미지 자체를 보존하는 것이 원문 의도를 더 잘 살립니다.
  doctrine_reference: 본문의 비유적 긴장 보존
