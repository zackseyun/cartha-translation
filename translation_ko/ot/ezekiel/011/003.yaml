    rationale: 원문은 앞 문맥의 인물을 수식하는 관사 붙은 분사입니다. 한국어에서 이를 독립적으로 제시할 때에는 ‘그들은 이렇게 말합니다’가 자연스럽게 그 기능을 전달합니다.
