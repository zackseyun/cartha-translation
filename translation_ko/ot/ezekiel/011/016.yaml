  naturalness: ‘그들이 가는 땅들에서’는 현재 진행 중인 이동으로 읽혀 자연스럽지 않습니다. ‘그들이 가 있는 여러 땅에서’는 포로로 가서 체류하는 문맥을 자연스럽게 드러내며, 한국어에서도 복수형의 뜻을 충분히 보존합니다. 명령 뒤에 각주를 붙여 대안 독법의 적용 위치도 분명히 했습니다.
