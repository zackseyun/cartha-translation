id: EZK.11.16
reference: Ezekiel 11:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֣ן אֱמֹ֗ר כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ כִּ֤י הִרְחַקְתִּי/ם֙ בַּ/גּוֹיִ֔ם וְ/כִ֥י הֲפִֽיצוֹתִ֖י/ם בָּ/אֲרָצ֑וֹת וָ/אֱהִ֤י לָ/הֶם֙ לְ/מִקְדָּ֣שׁ מְעַ֔ט בָּ/אֲרָצ֖וֹת אֲשֶׁר בָּ֥אוּ שָֽׁם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/016.yaml
  text: 'Therefore say[a], ‘Thus says the Lord GOD: Though I removed them far off among the nations, and though I scattered them among the lands, yet I became for them a little sanctuary in the lands where they had gone.’'
  footnotes:
  - marker: a
    text: Or, “a sanctuary for a little while.” The Hebrew phrase may describe either a small/limited sanctuary or a temporary sanctuary-presence.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 이렇게 말하십시오[a]. 「주 야훼께서 이렇게 말씀하십니다. 내가 그들을 민족들 가운데 멀리 보내었고, 또 여러 땅에 흩어 놓았지만, 그들이 가 있는 여러 땅에서 내가 그들에게 작은 성소가 되어 주었습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “잠시 동안의 성소.” 히브리어 구문은 작거나 제한된 성소를 뜻할 수도 있고, 잠시 동안 성소가 되어 주심을 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그리하여
  lexicon: HALOT
  rationale: 앞 문맥의 결과를 여는 추론 접속사로 자연스러운 표준어 연결어인 ‘그러므로’가 적절합니다.
- source_word: אֱמֹר / כֹּה אָמַר
  english_pob_choice: say / Thus says
  chosen_korean: 말하십시오. 「…이라고 말씀하십니다」
  alternatives_korean:
  - 말하시오. 「…라고 하십니다」
  - 전하라. 「…라고 말씀하신다」
  lexicon: HALOT
  rationale: 예언자에게 주어진 명령은 현대 합쇼체로 ‘말하십시오’가 자연스럽고, 선포 공식은 ‘이렇게 말씀하십니다’로 옮겨 하나님의 직접 발화를 살렸습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님 야훼
  - 주 하나님
  lexicon: HALOT
  rationale: 아도나이+여호와 결합형은 한국어에서 중복을 피하면서도 두 요소를 살리기 위해 ‘주 야훼’로 옮겼습니다.
- source_word: הִרְחַקְתִּים
  english_pob_choice: I removed them far off
  chosen_korean: 내가 그들을 멀리 흩어 놓았고
  alternatives_korean:
  - 내가 그들을 멀리 옮겨 놓았고
  - 내가 그들을 멀리 보내 버렸고
  lexicon: HALOT
  rationale: 히필의 ‘멀어지게 하다/멀리하다’ 의미를 한국어에서 포로·추방 맥락에 맞게 ‘멀리 흩어 놓다’로 풀어 역동성과 공간성을 함께 살렸습니다.
- source_word: הֲפִיצוֹתִים
  english_pob_choice: I scattered them
  chosen_korean: 흩어 놓았지만
  alternatives_korean:
  - 분산시켰지만
  - 흩어 버렸지만
  lexicon: HALOT
  rationale: 앞절과 평행을 이루는 흩음의 이미지를 반복해, 출애굽 이후의 추방·분산 상태를 분명히 드러냅니다.
- source_word: לְמִקְדָּשׁ מְעַט
  english_pob_choice: a little sanctuary
  chosen_korean: 작은 성소
  alternatives_korean:
  - 잠시의 성소
  - 조그마한 성소
  lexicon: HALOT
  rationale: ‘מְעַט’의 핵심은 규모를 가리키는 ‘작은’으로 우선 반영하되, 시간적 뉘앙스는 본문 주석 없이도 과도하게 해석하지 않도록 보수적으로 처리했습니다.
- source_word: בָּאֲרָצוֹת אֲשֶׁר בָּאוּ שָׁם
  english_pob_choice: in the lands where they had gone
  chosen_korean: 그들이 가는 땅들에서
  alternatives_korean:
  - 그들이 갔던 땅들에서
  - 그들이 가게 된 땅들에서
  lexicon: HALOT
  rationale: 히브리어 절의 도착·체류 상황을 한국어 현재형 관용보다 결과 상태로 표현해 ‘갔던’보다 문맥상 더 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 언약 이름 יהוה를 ‘야훼’로 직역해, 본문의 고유한 신명 사용을 흐리지 않도록 했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: ‘작은 성소’의 의미 범위
  chosen_reading: 규모 중심의 ‘작은 성소’
  alternative_readings:
  - ‘잠시의 성소’로 시간 중심 해석
  - ‘제한된 성소’로 기능 중심 해석
  rationale: 본문은 포로지에서 하나님 자신이 성소가 되어 주신다는 강한 위로를 담고 있으므로, 시간적 가능성은 열어 두되 주해를 고정하지 않는 방식으로 번역했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
