  yaml_path: translation/ot/ezekiel/011/012.yaml
  text: Then you will know that I am Yahweh[a], in whose statutes you have not walked, and whose judgments you have not carried out, but you have acted according to the judgments of the nations that are around you.
  footnotes:
  - marker: a
    text: Or 'but you have acted according to the customs of the nations that are around you.' The Hebrew word rendered 'judgments' can, in this context, also refer to the practices or customs followed by those nations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 너희는 내가 야훼임을 알게 될 것입니다. 너희는 내 규례 가운데에서 걷지 않았고, 내 법도를 행하지 않았으며, 너희 주변에 있는 나라들의 법도대로 행했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘법도’는 여기서 하나님의 규례뿐 아니라, 마지막 절의 주변 민족에게서 보이는 관례·관습까지 포함할 수 있습니다.
    reason: lexical_alternative
