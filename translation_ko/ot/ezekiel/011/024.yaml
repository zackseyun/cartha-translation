  source_fidelity: 현 초안은 영에 의한 이동, 갈대아의 유배 공동체, 하나님의 영과 관련된 환상, 환상의 상향·종결이라는 주요 의미를 대체로 보존합니다. 그러나 ‘갈대아의 포로들’은 지리적 방향과 집합적 공동체라는 표현을 충분히 드러내지 못하며, ‘내게서 떠올라 올라갔습니다’는 중복되고 히브리어의 ‘내 위에서/내게서’라는 철수 이미지를 부자연스럽게 처리합니다.
  naturalness: ‘하나님의 영 안에서 본 그 환상 안에서였습니다’는 ‘환상’과 ‘안에서’가 중복되어 문장 성분이 어색합니다. 또한 ‘떠올라 올라갔습니다’는 현대 표준어에서 불필요한 의미 중복입니다. 수정문은 합쇼체를 유지하면서 문장의 연결과 표현을 자연스럽게 다듬었습니다.
