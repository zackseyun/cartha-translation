  rationale: 지리적 방향 및 הַגּוֹלָה의 집합적 의미를 살려 ‘갈대아에 있는 유배 공동체에게로’로 고쳤습니다. 환상과 하나님의 영의 관계는 본문의 전치사에 남아 있는 수단/영역의 여지를 보존하도록 본문과 각주를 정리했습니다. 마지막 절은 상향 이동과 환상의 철수를 자연스러운 한국어로 표현하되, 문자적 ‘내 위에서’는 각주에 보존했습니다.
