id: EZK.11.24
reference: Ezekiel 11:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ר֣וּחַ נְשָׂאַ֗תְ/נִי וַ/תְּבִיאֵ֤/נִי כַשְׂדִּ֨ימָ/ה֙ אֶל הַ/גּוֹלָ֔ה בַּ/מַּרְאֶ֖ה בְּ/ר֣וּחַ אֱלֹהִ֑ים וַ/יַּ֨עַל֙ מֵֽ/עָלַ֔/י הַ/מַּרְאֶ֖ה אֲשֶׁ֥ר רָאִֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/024.yaml
  text: Then the Spirit lifted me up and brought me to the exiles in Chaldea[a], in the vision by the Spirit of God[d][c][b]; and the vision that I had seen went up from me.
  footnotes:
  - marker: a
    text: Or 'carried me' for 'lifted me up.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to the exiled community'; Hebrew 'to the exile' can refer collectively to the deported people.
    reason: lexical_alternative
  - marker: c
    text: Or 'in the Spirit of God.' The Hebrew preposition can express either agency ('by') or sphere ('in').
    reason: alternative_reading
  - marker: d
    text: Or 'departed from me.' The Hebrew literally says 'went up from upon me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 영이 나를 들어 올려 갈대아[a]의 포로들[b]에게 데려갔습니다. 하나님의 영[c] 안에서 본 그 환상 안에서였습니다. 내가 본 그 환상은 내게서 떠올라[d] 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 갈대아는 바벨론 지역을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘유배 공동체’로 옮길 수 있으며, 히브리어는 집합적으로 끌려간 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘하나님의 영 안에서’로도 옮길 수 있습니다. 히브리어 전치사는 수단뿐 아니라 영역도 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 히브리어는 문자적으로 ‘내 위에서 올라갔다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְר֣וּחַ
  english_pob_choice: Then the Spirit
  chosen_korean: 그러자 영이
  alternatives_korean:
  - 그러자 바람이
  - 그러자 숨결이
  - 그러자 성령이
  lexicon: HALOT
  rationale: 이 문맥은 환상 속 이동과 계시를 말하므로 רוּחַ를 ‘영’으로 옮기고, 문맥상 주어 전환을 자연스럽게 ‘그러자’로 풀었습니다. ‘성령’은 이 절의 일반 표지로는 다소 확정적이어서, 본문 자체의 표현을 먼저 살렸습니다.
- source_word: נְשָׂאַתְנִי וַתְּבִיאֵנִי
  english_pob_choice: lifted me up and brought me
  chosen_korean: 나를 들어 올려 … 데려갔습니다
  alternatives_korean:
  - 나를 들어서 데리고 갔습니다
  - 나를 들고 데려갔습니다
  - 나를 실어 갔습니다
  lexicon: HALOT
  rationale: נשא의 ‘들어 올리다’와 בוא(히필)의 ‘데려가다/가게 하다’를 함께 살리되, 한국어에서는 동작의 연쇄가 자연스럽도록 정리했습니다. ‘실어 갔다’는 다소 해석적이어서 피했습니다.
- source_word: כַשְׂדִּימָה אֶל הַגּוֹלָה
  english_pob_choice: to the exiles in Chaldea
  chosen_korean: 갈대아[a]의 포로들[b]에게
  alternatives_korean:
  - 갈대아로 끌려간 사람들[b]에게
  - 갈대아의 유배 공동체[b]에게
  - 갈대아의 유배자들[b]에게
  lexicon: HALOT
  rationale: כַשְׂדִּימָה는 방향을 나타내므로 ‘갈대아의’로 두고, הַגּוֹלָה는 집합체로서의 ‘포로들’이 가장 직역적이면서도 문맥에 맞습니다. English POB의 각주 취지를 따라 ‘유배 공동체’ 가능성도 열어 두되, 본문은 더 직설적인 ‘포로들’을 택했습니다.
- source_word: בַּמַּרְאֶה בְּרוּחַ אֱלֹהִים
  english_pob_choice: in the vision by the Spirit of God
  chosen_korean: 하나님의 영[c] 안에서 본 그 환상 안에서였습니다
  alternatives_korean:
  - 하나님의 영[c]에 의한 환상 가운데였습니다
  - 하나님의 영[c]으로 말미암은 환상 안에서였습니다
  - 하나님의 영[c]으로 본 환상 안에서였습니다
  lexicon: HALOT
  rationale: בְּ는 여기서 수단/영역을 모두 가질 수 있으므로 ‘안에서’로 번역해 해석 여지를 보존했습니다. מַרְאֶה는 예언적 ‘환상’으로 옮겼고, בְּרוּחַ אֱלֹהִים은 ‘하나님의 영’으로 직접 대응시켰습니다.
- source_word: וַיַּעַל מֵעָלַי
  english_pob_choice: went up from me
  chosen_korean: 내게서 떠올라[d] 올라갔습니다
  alternatives_korean:
  - 내게서 떠나갔습니다
  - 내게서 위로 올라갔습니다
  - 내게서 떠올랐습니다
  lexicon: HALOT
  rationale: עלה와 מעלי의 수직 이미지를 살려 ‘떠올라 올라갔습니다’로 옮겼습니다. English POB의 ‘went up from me’와 같은 상향 동작을 보존하면서도 한국어에서 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: רוּחַ와 בְּרוּחַ אֱלֹהִים을 인격적/신학적으로 어떻게 처리할지
  chosen_reading: 두 표현 모두 영으로 옮기되, 뒤의 표현은 ‘하나님의 영’으로 분명히 하여 계시와 이동의 주체가 단순한 바람이 아님을 드러냈습니다.
  alternative_readings:
  - 바람
  - 숨결
  - 하나님의 바람
  rationale: 이 절은 예언자의 환상적 이동과 계시를 묘사하므로, 자연현상인 ‘바람’보다 영적 주체를 드러내는 번역이 문맥에 더 부합합니다. 다만 본문이 요구하는 범위를 넘어 과도하게 신학화하지 않도록, 두 번째 표현만 명시적으로 구분했습니다.
  doctrine_reference: Translation philosophy §3, §6
