  text: Then the cherubim lifted up their wings[a], with the wheels beside them[b], and the glory of the God of Israel was above them.
  footnotes:
  - marker: a
    text: Or 'and the wheels were beside them.' The Hebrew conjunction can be represented more literally with 'and,' but the sense is that the wheels accompanied the cherubim.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'above them from above,' an emphatic spatial expression indicating that the glory was overhead.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 그룹들이 자기들의 날개를 들어 올렸습니다.[a] 바퀴들은 그들 곁에 있었고, 이스라엘 하나님의 영광은 그들 위 높은 곳에 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 바퀴들은 그들 곁에 있었습니다.” 히브리어 접속사는 문자적으로 “그리고”로 옮길 수 있으며, 바퀴들이 그룹들 곁에 있었음을 나타냅니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 “그들 위에, 위쪽에서”입니다. 이는 영광이 그들 위에 있음을 강조하는 공간적 표현입니다.
    reason: alternative_reading
