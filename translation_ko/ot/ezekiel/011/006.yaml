  source_fidelity: 히브리어는 너희가 이 성읍 안에서 폭력적으로 죽은 사람들을 많게 하였고 그 공공 통로들을 그러한 죽임당한 자들로 채웠다고 고발합니다. 초안의 ‘살해된 자를 많이 늘렸고’는 원문의 원인·결과 관계는 반영하지만 한국어 관용상 부자연스럽습니다.
