base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/006.yaml
  text: You have multiplied your slain in this city and filled its streets with the slain[a][b].
  footnotes:
  - marker: a
    text: Or 'your dead' / 'corpses'; the Hebrew term specifically suggests those killed violently, so 'slain' is preferred.
    reason: lexical_alternative
  - marker: b
    text: Or 'its squares' or 'its open places' for 'its streets.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 이 성읍에서 많은 사람을 죽였고, 그 거리를 죽임당한 자들로 가득 채웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죽임당한 자들’은 ‘죽은 자들’ 또는 ‘시체들’로도 옮길 수 있습니다. 히브리어는 일반적인 죽음보다 폭력적인 죽임을 당한 사람들을 가리키는 뉘앙스가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거리’는 ‘광장’ 또는 ‘열린 공간’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבֵּיתֶם
  english_pob_choice: have multiplied
  chosen_korean: 많이 늘렸고
  alternatives_korean:
  - 증가시켰고
  - 많게 했고
  lexicon: HALOT
  rationale: 히필 완료형의 원인적 뉘앙스를 살리면서, 한국어에서는 '많이 늘렸다'가 자연스럽고 결과를 분명히 드러냅니다.
- source_word: חַלְלֵיכֶם
  english_pob_choice: your slain
  chosen_korean: 너희의 살해된 자
  alternatives_korean:
  - 너희의 죽은 자
  - 너희의 시체들
  lexicon: HALOT
  rationale: 단순한 '죽은 자'보다 폭력적으로 죽임을 당한 자라는 뜻을 살리기 위해 '살해된 자'를 택했습니다.
- source_word: חוּצֹתֶיהָ
  english_pob_choice: its streets
  chosen_korean: 그 거리들
  alternatives_korean:
  - 그 광장들
  - 그 빈터들
  lexicon: HALOT
  rationale: 도시의 공공 통로를 가리키는 말로, 현대 한국어에서는 '거리들'이 가장 직접적이고 자연스럽습니다.
theological_decisions:
- issue: 예언적 고발문의 직접성 유지
  chosen_reading: 원문의 누적 책임 고발을 약화하지 않도록, 수동적으로 돌리지 않고 행위 주어를 그대로 드러냈습니다.
  alternative_readings:
  - 너희에게는 살해된 자가 많습니다
  - 너희의 살해된 자들이 이 성읍에 있습니다
  rationale: 본문은 예루살렘의 폭력과 유혈에 대한 직접적 책임을 추궁하므로, 행위의 결과를 분명히 드러내는 번역이 문맥상 적절합니다.
  doctrine_reference: 예언서의 심판 고발 문맥
