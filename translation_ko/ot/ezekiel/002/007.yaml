  text: וְ/דִבַּרְתָּ֤ אֶת דְּבָרַ/י֙ אֲלֵי/הֶ֔ם אִֽם יִשְׁמְע֖וּ וְ/אִם יֶחְדָּ֑לוּ כִּ֥י מְרִ֖י הֵֽמָּה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/007.yaml
  text: You shall speak my words to them[a], whether they listen or whether they refuse, for they are rebellious.
  footnotes:
  - marker: a
    text: Or 'whether they hear or whether they refrain.' The Hebrew idiom contrasts response with refusal to heed.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 그들이 듣든지 듣기를 거부하든지, 그들에게 내 말을 전해야 합니다. 그들은 반역적이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 듣든지 그치든지’. 히브리어 관용구는 듣고 응답하는 것과 듣기를 거부하는 것을 대조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ
  english_pob_choice: You shall speak
  chosen_korean: 전해야 합니다
  alternatives_korean:
  - 말해야 합니다
  - 전하십시오
  lexicon: HALOT
  rationale: 예언자에게 주어진 명령의 성격을 살리면서, 현대 한국어에서 자연스럽고 공적 문체에 맞게 옮겼습니다. 단순한 발화보다 ‘전하다’가 하나님의 말씀을 전달하는 의미를 더 분명히 드러냅니다.
- source_word: אֶת דְּבָרַי
  english_pob_choice: my words
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말씀
  - 내 말들
  lexicon: HALOT
  rationale: דָּבָר의 구체적 의미를 살리되, 하나님의 발화체를 한국어에서 자연스럽게 표현하기 위해 ‘말’로 옮겼습니다. ‘말씀’은 가능하지만 한국 교회어의 관습적 어감을 강하게 불러올 수 있어 여기서는 더 직접적인 표현을 택했습니다.
- source_word: אִם יִשְׁמְעוּ וְאִם יֶחְדָּלוּ
  english_pob_choice: whether they listen or whether they refuse
  chosen_korean: 그들이 듣든지 듣기를 거부하든지
  alternatives_korean:
  - 그들이 듣든지 아니 듣든지
  - 그들이 듣든지 멈추든지
  lexicon: HALOT
  rationale: 히브리어 관용구의 대조를 살리되, יִשְׁמְעוּ를 단순한 청각보다 응답 가능성을 포함한 ‘듣다’로, יֶחְדָּלוּ를 맥락상 ‘듣기를 거부하다’로 옮겨 거절의 의미를 분명히 했습니다.
- source_word: מְרִי הֵמָּה
  english_pob_choice: for they are rebellious
  chosen_korean: 그들은 반역적이기 때문입니다
  alternatives_korean:
  - 그들이 반역자들이기 때문입니다
  - 그들은 반항적이기 때문입니다
  lexicon: HALOT
  rationale: מְרִי의 핵심을 ‘반역’으로 옮겨, 단순한 성격 묘사보다 언약적 불순종과 대적의 뉘앙스를 살렸습니다. 문맥상 집(house)을 덧붙이지 않고 주어 대명사 ‘그들’을 유지했습니다.
theological_decisions:
- issue: שׁמע의 번역에서 ‘듣다’와 ‘순종하다’ 사이의 긴장
  chosen_reading: ‘듣다’와 ‘듣기를 거부하다’의 대조를 유지했습니다.
  alternative_readings:
  - ‘순종하다’로 옮김
  - ‘들으나 마나’식으로 의역
  rationale: 본문은 예언자의 책임이 청중의 반응에 좌우되지 않음을 강조하므로, 청각적 의미와 불응의 대조를 보존하는 것이 소스의 긴장을 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
