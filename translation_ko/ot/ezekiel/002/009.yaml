base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/009.yaml
  text: Then I looked[a], and behold, a hand was stretched out toward me, and behold, in it was a scroll.
  footnotes:
  - marker: a
    text: Or simply, 'a scroll.' The Hebrew phrase is literally 'a scroll of a book.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 보니, 보라, 한 손이 내게로 뻗어 있었고, 보라, 그 안에 두루마리 한 권이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 단순히 ‘두루마리’. 히브리어 표현은 문자적으로는 ‘책의 두루마리’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  english_pob_choice: Then I looked
  chosen_korean: 내가 보니
  alternatives_korean:
  - 그리고 내가 보니
  - 그때 내가 보았습니다
  lexicon: HALOT
  rationale: 와연속의 진행을 살리면서 환시 서술의 즉각성을 유지하기에 ‘내가 보니’가 가장 자연스럽습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 그런데
  lexicon: HALOT
  rationale: 히브리어 הִנֵּה의 주의를 끄는 환시적 표지를 한국어에서는 ‘보라’로 옮겨 장면의 돌연성과 강조를 살렸습니다.
- source_word: יָד שְׁלוּחָה
  english_pob_choice: a hand was stretched out
  chosen_korean: 한 손이 ... 뻗어 있었습니다
  alternatives_korean:
  - 한 손이 ... 펼쳐져 있었습니다
  - 손 하나가 ... 내밀려 있었습니다
  lexicon: HALOT
  rationale: שְׁלוּחָה의 수동적·형용사적 뉘앙스를 한국어 관용에 맞게 ‘뻗어 있었습니다’로 옮겼고, 손의 주체는 본문대로 밝히지 않았습니다.
- source_word: מְגִלַּת סֵפֶר
  english_pob_choice: a scroll of a book
  chosen_korean: 두루마리 한 권
  alternatives_korean:
  - 책 두루마리 하나
  - 글 두루마리 하나
  lexicon: HALOT
  rationale: 문자적으로는 ‘두루마리-책’이지만 한국어에서는 ספר의 물질적 이미지를 과도하게 살리기보다 문서 형태를 드러내는 ‘두루마리 한 권’이 자연스럽습니다.
theological_decisions:
- issue: 손의 주체를 밝히는가
  chosen_reading: 본문처럼 손의 주체를 특정하지 않고 유지했습니다.
  alternative_readings:
  - 하나님의 손
  - 천사의 손
  rationale: 히브리어는 단지 ‘한 손’만 제시하므로, 해석을 덧붙여 주체를 특정하지 않고 본문의 절제를 보존했습니다.
  doctrine_reference: 원어 우선 원칙; 해석적 명시를 피하여 본문 긴장 보존
