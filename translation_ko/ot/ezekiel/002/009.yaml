  lexicon: HALOT
  rationale: 문자적으로는 ‘두루마리-책’이지만 한국어에서는 ספר의 물질적 이미지를 과도하게 살리기보다 문서 형태를 드러내는 ‘두루마리 한 권’이 자연스럽습니다.
