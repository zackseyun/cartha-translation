translation:
  language: ko
  text: 그 자손들은 낯이 두껍고 마음이 완고합니다.[a] 내가 너를 그들에게 보냅니다. 너는 그들에게 이렇게 말해야 합니다. ‘주 여호와께서[b] 이렇게 말씀하십니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘얼굴이 굳고 마음이 강한’입니다. 수치심이 없고 완고하다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주 야훼께서’. 히브리어 칭호는 אֲדֹנָי יְהוִה입니다.
    reason: alternative_reading
