source:
  edition: WLC
  text: וְ/הַ/בָּנִ֗ים קְשֵׁ֤י פָנִים֙ וְ/חִזְקֵי לֵ֔ב אֲנִ֛י שׁוֹלֵ֥חַ אוֹתְ/ךָ֖ אֲלֵי/הֶ֑ם וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֥/י יְהֹוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/004.yaml
  text: And the children are hard-faced and hard-hearted[a]; I am sending you to them, and you shall say to them[b], ‘Thus says the Lord GOD.’
  footnotes:
  - marker: a
    text: 'Hebrew: ''hard of face and strong of heart,'' an idiom for shameless and stubborn people.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Thus says the Lord Yahweh.' The Hebrew title is אֲדֹנָי יְהוִה.
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 이 자손들은 얼굴이 강퍅하고 마음이 굳은 자들입니다. 내가 너를 그들에게 보내며, 너는 그들에게 이렇게 말해야 합니다. ‘주 여호와께서 이렇게 말씀하십니다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘얼굴이 굳고 마음이 강한’이라는 뜻으로, 뻔뻔함과 완고함을 나타내는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주 야훼께서 이렇게 말씀하십니다.’ 히브리어 칭호는 אֲדֹנָי יְהוִה입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַבָּנִים
  english_pob_choice: The children
  chosen_korean: 이 자손들
  alternatives_korean:
  - 그 아들들
  - 그 아이들
  - 이 사람들
  lexicon: HALOT
  rationale: בָּנִים은 문자적으로 ‘아들들’이지만, 여기서는 이미 언급된 이스라엘 공동체 전체를 가리키므로 한국어에서는 집합적 의미를 살려 ‘자손들’로 옮겼습니다.
- source_word: קְשֵׁי פָנִים
  english_pob_choice: hard-faced
  chosen_korean: 얼굴이 강퍅하고
  alternatives_korean:
  - 뻔뻔하고
  - 완고한 얼굴의
  - 무례한
  lexicon: HALOT
  rationale: 직역하면 ‘얼굴이 굳다’에 가깝고, 수치심 없이 맞서는 태도를 가리키므로 한국어 성경어법에 너무 기대지 않으면서도 의미를 드러내는 ‘얼굴이 강퍅하고’로 옮겼습니다.
- source_word: וְחִזְקֵי לֵב
  english_pob_choice: hard-hearted
  chosen_korean: 마음이 굳은 자들입니다
  alternatives_korean:
  - 마음이 강한 자들입니다
  - 완고한 자들입니다
  - 마음이 굳은 사람들입니다
  lexicon: HALOT
  rationale: לֵב의 ‘마음’과 ‘strong of heart’의 관용적 의미를 함께 살려, 여기서는 용기가 아니라 완고함을 뜻하므로 ‘마음이 굳은’으로 처리했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 여호와
  alternatives_korean:
  - 주 하나님
  - 주 야훼
  - 주권자 여호와
  lexicon: HALOT
  rationale: 아ֲדֹנָי와 יְהוִה의 결합은 한국어에서 보통 ‘주 여호와’로 구분해 옮기며, 두 칭호의 중첩을 보존하면서도 예언 공식의 엄숙한 어감을 살렸습니다.
theological_decisions:
- issue: 예언자 파견 공식과 신적 직설 화법의 재현
  chosen_reading: ‘주 여호와께서 이렇게 말씀하십니다.’
  alternative_readings:
  - ‘주 여호와께서 말씀하셨습니다.’
  - ‘주 여호와의 말씀이십니다.’
  rationale: כֹּה אָמַר은 예언자적 전령 공식으로, 현재형 선언의 권위를 살리기 위해 현대 한국어에서는 ‘말씀하십니다’로 옮겼습니다. 인용문 안에서 하나님께 직접 드리는 호칭이 아니라 신탁 서술이므로 합쇼체를 유지했습니다.
  doctrine_reference: Prophetic messenger formula in Ezekiel; divine speech register
