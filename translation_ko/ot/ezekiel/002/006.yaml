source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָ֠דָם אַל תִּירָ֨א מֵ/הֶ֜ם וּ/מִ/דִּבְרֵי/הֶ֣ם אַל תִּירָ֗א כִּ֣י סָרָבִ֤ים וְ/סַלּוֹנִים֙ אוֹתָ֔/ךְ וְ/אֶל עַקְרַבִּ֖ים אַתָּ֣ה יוֹשֵׁ֑ב מִ/דִּבְרֵי/הֶ֤ם אַל תִּירָא֙ וּ/מִ/פְּנֵי/הֶ֣ם אַל תֵּחָ֔ת כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/006.yaml
  text: But you[a], son of man, do not fear them, and do not fear their words, though briers and thorns are with you and you sit among scorpions. Do not fear their words, and do not be dismayed by their faces[b], for they are a rebellious house.
  footnotes:
  - marker: a
    text: Or possibly, 'though rebels and thorns are with you.' The Hebrew word rendered 'briers' is difficult and has been understood in more than one way, but the surrounding imagery favors a thorny-hazard metaphor.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'by their faces'; that is, by their intimidating appearance or presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너, 인자야, 그들을 두려워하지 말고 그들의 말도 두려워하지 마십시오. 비록 가시덤불과 찔레가 너와 함께 있고 네가 전갈들 가운데에 앉아 있을지라도 말입니다. 그들의 말도 두려워하지 말고, 그들의 얼굴 앞에서 놀라지 마십시오. 그들은 반역하는 집이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가시덤불’은 난해한 히브리어 단어 סָרָבִים의 대응으로, 일부는 ‘반역자들’로 이해하기도 하지만 문맥상 가시성 식물 이미지가 더 강합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 얼굴로 인해’에 가깝습니다. 여기서는 그들의 위압적인 외양이나 존재를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인간
  lexicon: HALOT
  rationale: 에스겔의 반복되는 호칭으로서 관용적 표현을 살리기 위해 직역적 의미보다 한국어 성서 관용어인 ‘인자’를 택했습니다.
- source_word: תִּירָא
  english_pob_choice: do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 겁내지 마십시오
  lexicon: HALOT
  rationale: 반복되는 금지 명령의 형식을 살려 ‘두려워하다’를 기본 동사로 옮겼습니다.
- source_word: סָרָבִים / סַלּוֹנִים
  english_pob_choice: briers / thorns
  chosen_korean: 가시덤불과 찔레
  alternatives_korean:
  - 가시나무와 가시
  - 덩굴가시와 찔레
  lexicon: HALOT
  rationale: 서로 짝을 이루는 위험한 식물 이미지로 보존하되, 한국어에서 자연스럽고 고통스러운 감각이 살아나도록 옮겼습니다.
- source_word: מִפְּנֵיהֶם
  english_pob_choice: by their faces
  chosen_korean: 그들의 얼굴 앞에서
  alternatives_korean:
  - 그들의 얼굴 때문에
  - 그들의 모습 앞에서
  lexicon: HALOT
  rationale: 히브리어의 문자적 ‘얼굴’ 이미지를 살리면서도 위협적인 외양/존재 앞에서라는 뜻이 드러나도록 했습니다.
- source_word: בֵּית מְרִי
  english_pob_choice: a rebellious house
  chosen_korean: 반역하는 집
  alternatives_korean:
  - 반역의 집
  - 반역하는 백성
  lexicon: HALOT
  rationale: 에스겔서의 고정 표현인 ‘집’을 유지해 공동체를 가리키는 은유를 보존했습니다.
theological_decisions:
- issue: ‘son of man’ 호칭의 한국어 처리
  chosen_reading: 전통적 성서어휘인 ‘인자’로 유지했습니다.
  alternative_readings:
  - 사람의 아들
  - 인간
  rationale: 에스겔서에서 반복되는 신적 호칭의 문체적 힘과 상징성을 유지하는 것이 중요하므로, 현대적 의역보다 관용적 성서 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 4
- issue: 호전적 이미지의 보존
  chosen_reading: 가시덤불, 찔레, 전갈 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 그들이 너를 괴롭혀도
  - 그들이 적대적이어도
  rationale: 본문의 경고는 추상적 적대감보다 생생한 위험 이미지에 있으므로, 수사적 긴장을 약화시키지 않도록 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
