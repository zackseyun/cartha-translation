  terminology: ‘인자’는 에스겔에서 반복되는 호칭을 보존하는 적절한 성서 어휘입니다. ‘가시덤불과 찔레’ 및 ‘전갈’도 원문의 비유를 잘 보존합니다. ‘반역하는 집’은 한국어에서 다소 어색하므로, 공동체를 가리키는 은유를 유지하는 ‘반역하는 집안’으로 조정했습니다.
