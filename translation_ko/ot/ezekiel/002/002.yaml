id: EZK.2.2
reference: Ezekiel 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּ֧בֹא בִ֣/י ר֗וּחַ כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר אֵלַ֔/י וַ/תַּעֲמִדֵ֖/נִי עַל רַגְלָ֑/י וָ/אֶשְׁמַ֕ע אֵ֖ת מִדַּבֵּ֥ר אֵלָֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/002.yaml
  text: And the Spirit entered into me when he spoke to me[a], and set me on my feet[b]; and I heard the one speaking to me.
  footnotes:
  - marker: a
    text: Or, 'a spirit entered into me.' The Hebrew רוּחַ can mean 'spirit,' 'wind,' or 'breath'; here the context favors God's Spirit empowering Ezekiel.
    reason: alternative_reading
  - marker: b
    text: Literally, 'I heard the one speaking to me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분이 말씀하실 때에 영이 내 안으로 들어와 나를 내 발로 세우셨습니다. 그리고 나는 내게 말씀하시는 분의 말씀을 들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영이 내 안으로 들어왔다’로도 옮길 수 있습니다. 히브리어 רוּחַ는 ‘영’, ‘바람’, ‘숨’을 뜻할 수 있으나, 여기서는 하나님의 영을 가리키는 문맥이 우세합니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘내 발로 나를 세우셨다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֗וּחַ
  english_pob_choice: the Spirit
  chosen_korean: 영
  alternatives_korean:
  - 성령
  - 바람
  - 숨
  lexicon: HALOT
  rationale: 이 환상과 소명 장면에서는 특정한 하나님의 영을 가리키는 것으로 보는 것이 가장 자연스럽지만, 히브리어 רוּחַ의 기본 의미 폭을 살려 ‘영’으로 옮기고 문맥으로 그 지시 대상을 분명히 했습니다.
- source_word: וַתָּבֹא בִי
  english_pob_choice: entered into me
  chosen_korean: 내 안으로 들어와
  alternatives_korean:
  - 내게 들어와
  - 내 안에 임하여
  - 내게로 들어와
  lexicon: HALOT
  rationale: בוא + ב 구조의 내적 진입 감각을 살려 ‘내 안으로 들어와’로 옮겼습니다. 이는 단순한 접촉이 아니라 예언자 내부를 채우는 작용을 드러냅니다.
- source_word: וַתַּעֲמִדֵנִי עַל רַגְלָי
  english_pob_choice: set me on my feet
  chosen_korean: 나를 내 발로 세우셨습니다
  alternatives_korean:
  - 나를 일으켜 세우셨습니다
  - 서서히 일으키셨습니다
  - 내 발로 서게 하셨습니다
  lexicon: HALOT
  rationale: עמד의 사역형을 자연스럽게 살리면서, ‘내 발로’로 원문의 직설적 표현을 유지했습니다. 한국어에서는 ‘세우셨습니다’가 가장 간결하게 힘을 줍니다.
- source_word: מִדַּבֵּר אֵלָי
  english_pob_choice: the one speaking to me
  chosen_korean: 내게 말씀하시는 분
  alternatives_korean:
  - 나에게 말하는 이
  - 말씀하시는 분
  - 내게 말하시는 분
  lexicon: HALOT
  rationale: 분사구를 명사화하여 인격적 화자를 드러내는 원문 효과를 살렸습니다. 본문이 단순한 ‘음성’이 아니라 대화하는 주체를 가리키므로 ‘분’으로 옮겼습니다.
theological_decisions:
- issue: רוּחַ의 지시 대상
  chosen_reading: 예언자에게 능력을 주어 일어서게 하는 하나님의 영으로 이해했습니다.
  alternative_readings:
  - 불특정한 영
  - 단순한 바람/숨
  rationale: 문맥상 영의 입장과 즉각적인 소명 수행(일어섬, 듣기)을 연결하므로, 하나님의 영으로 읽는 것이 가장 일관됩니다. 다만 히브리어 어휘의 폭은 유지해 한국어 본문은 ‘영’으로 남겼습니다.
  doctrine_reference: Ezekiel 2:1-2 소명 환상 문맥
