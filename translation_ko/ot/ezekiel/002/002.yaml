revisions:
- from: 그분이 말씀하실 때에 영이 내 안으로 들어와 나를 내 발로 세우셨습니다. 그리고 나는 내게 말씀하시는 분의 말씀을 들었습니다.[a][b]
  to: 그분이 내게 말씀하실 때, 영[a]이 내 안으로 들어와 나를 내 발로 일어서게 하셨습니다. 그러자 나는 내게 말씀하시는 분의 말씀을 들었습니다.[b]
  rationale: ‘영’의 본문상 모호성은 보존하고, 각주 a에서 불특정 읽기의 가능성과 문맥적 판단을 제시했습니다. 사역형 표현은 자연스러운 한국어로 다듬었습니다. 마지막 문장은 한국어의 자연스러움을 위해 ‘분의 말씀’을 사용하되, 각주 b에서 히브리어가 실제로는 ‘내게 말씀하시는 분’을 목적어로 삼는다는 점을 명시하여 원문 구조를 보존했습니다. 각주 표지도 각각 해당 어휘·표현 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:38:07Z'
