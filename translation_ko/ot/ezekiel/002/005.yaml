source:
  edition: WLC
  text: וְ/הֵ֨מָּה֙ אִם יִשְׁמְע֣וּ וְ/אִם יֶחְדָּ֔לוּ כִּ֛י בֵּ֥ית מְרִ֖י הֵ֑מָּה וְ/יָ֣דְע֔וּ כִּ֥י נָבִ֖יא הָיָ֥ה בְ/תוֹכָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/005.yaml
  text: And whether they listen or refuse—for they are a rebellious house—they will know that a prophet has been among them[a][b].
  footnotes:
  - marker: a
    text: Or 'whether they hear or refrain'; the Hebrew literally contrasts 'hear' with 'cease/refrain,' here meaning refusal to heed the message.
    reason: lexical_alternative
  - marker: b
    text: Or 'has been in their midst.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 듣든지 듣기를 거부하든지—그들은 반역하는 집이기 때문입니다—그들 가운데에 한 예언자가 있었음을 알게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘듣든지 그치든지’. 히브리어는 문자적으로 ‘듣다’와 ‘그치다/중단하다’를 대조하며, 여기서는 메시지에 귀 기울이기를 거부하는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들 한가운데에 있었다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִשְׁמְעוּ ... וְאִם יֶחְדָּלוּ
  english_pob_choice: whether they listen or refuse to listen
  chosen_korean: 듣든지 듣지 않든지
  alternatives_korean:
  - 듣든지 거부하든지
  - 듣든지 그치든지
  lexicon: HALOT
  rationale: 대조적 조건문을 한국어의 자연스러운 병렬 구조로 살렸습니다. יֶחְדָּלוּ의 문자적 ‘그치다/중단하다’보다, 문맥상 말씀을 받아들이지 않는 거절을 담아 ‘듣지 않든지’로 옮겼습니다.
- source_word: בֵּית מְרִי
  english_pob_choice: a rebellious house
  chosen_korean: 반역한 집
  alternatives_korean:
  - 반역의 집
  - 반역하는 집
  lexicon: HALOT
  rationale: 에스겔서의 관용구인 ‘집’을 유지하되, מְרִי의 강한 반항·반역성을 살리기 위해 ‘반역한’으로 옮겼습니다. ‘백성’으로 풀어버리면 히브리어의 공동체적 비유가 약해집니다.
- source_word: וְיָדְעוּ
  english_pob_choice: they will know
  chosen_korean: 알게 될 것입니다
  alternatives_korean:
  - 알 것입니다
  - 알게 됩니다
  lexicon: HALOT
  rationale: 조건절 뒤의 결과를 한국어 미래형으로 자연스럽게 나타냈습니다. 단순한 인지보다 ‘결국 알게 됨’의 결과성을 드러냅니다.
- source_word: הָיָה בְתוֹכָם
  english_pob_choice: has been among them
  chosen_korean: 자기들 가운데에 ... 있었음을
  alternatives_korean:
  - 그들 가운데에 있었음을
  - 그들 한가운데 있었음을
  lexicon: HALOT
  rationale: בְתוֹךְ의 ‘가운데/한복판’ 의미를 살리면서, 한국어에서는 ‘자기들 가운데에’가 가장 자연스럽고 문맥에 맞습니다. 완료된 존재를 회상하는 뉘앙스를 ‘있었음’으로 반영했습니다.
- source_word: נָבִיא
  english_pob_choice: a prophet
  chosen_korean: 한 예언자
  alternatives_korean:
  - 한 선지자
  - 예언자 한 사람
  lexicon: HALOT
  rationale: 표준어 합쇼체에서 현대 독자에게 명확한 ‘예언자’를 채택했습니다. 전통 교회어 ‘선지자’보다 직접적이며, 여기서는 직책의 존재를 말하는 불특정 단수에 맞습니다.
theological_decisions:
- issue: ‘듣다/듣지 않다’의 의미 범위
  chosen_reading: 단순 청각이 아니라 말씀에 대한 수용과 거절의 대조로 이해해 번역했습니다.
  alternative_readings:
  - 소리만 듣는 물리적 청취의 대조로 좁게 읽을 수 있습니다.
  rationale: 히브리어 대구는 실제로 ‘듣기’와 ‘그침/중단함’의 대비이지만, 예언적 문맥에서는 말씀을 받아들이는가 거부하는가가 핵심입니다. 이를 한국어에서 분명히 드러내되, 과도한 해석은 피했습니다.
  doctrine_reference: Translation philosophy §3, §6
