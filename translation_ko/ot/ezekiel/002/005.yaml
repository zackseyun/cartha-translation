revisions:
- from: 그들이 듣든지 듣지 않든지 — 그들은 반역한 집이기 때문입니다 — 그들은 자기들 가운데에 한 예언자가 있었음을 알게 될 것입니다.[a][b]
  to: 그들이 듣든지 듣기를 거부하든지—그들은 반역하는 집이기 때문입니다—그들 가운데에 한 예언자가 있었음을 알게 될 것입니다.[a][b]
  rationale: 주절의 둘째 조건을 ‘듣기를 거부하든지’로 고쳐 יֶחְדָּלוּ의 문맥상 능동적 의미를 드러냈습니다. 공동체의 지속적 성격을 나타내는 ‘반역하는 집’을 채택하고, 불필요한 대명사 반복과 ‘자기들’을 정리했습니다. 각주 b는 문장으로 완결되도록 보완했습니다.
