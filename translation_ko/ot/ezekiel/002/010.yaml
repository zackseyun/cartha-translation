  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּפְרֹ֤שׂ אוֹתָ/הּ֙ לְ/פָנַ֔/י וְ/הִ֥יא כְתוּבָ֖ה פָּנִ֣ים וְ/אָח֑וֹר וְ/כָת֣וּב אֵלֶ֔י/הָ קִנִ֥ים וָ/הֶ֖גֶה וָ/הִֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/010.yaml
  text: And he spread it out before me[a], and it was written on the front and on the back[b]; and written on it were lamentations and mourning and woe.
  footnotes:
  - marker: a
    text: Or 'on both sides'; traditionally, 'inside and outside.'
    reason: lexical_alternative
  - marker: b
    text: Or 'lamentations and groaning and woe.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그것을 제 앞에 펴 보였는데, 그것은 앞면과 뒷면에 글이 쓰여 있었고[a], 그 위에는 애가와 곡과 화가 적혀 있었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘양쪽에’; 전통적으로는 ‘안팎에’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘애가와 신음과 화’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרֹשׂ / אוֹתָהּ
  english_pob_choice: he spread it out / it
  chosen_korean: 그가 그것을 펴 보였는데
  alternatives_korean:
  - 그가 그것을 펼쳤는데
  - 그가 그것을 펴서 보여 주었는데
  lexicon: HALOT
  rationale: פרשׂ는 두루 펼치다/펴다의 뜻이므로, 두루마리를 눈앞에 펼쳐 보이는 장면을 자연스럽게 살려 ‘펴 보였는데’로 옮겼습니다.
- source_word: לְפָנַי
  english_pob_choice: before me
  chosen_korean: 제 앞에
  alternatives_korean:
  - 내 앞에
  - 저 앞에
  lexicon: HALOT
  rationale: 환상 서술에서 위치 관계를 분명히 하는 직역에 가까운 표현으로 ‘제 앞에’를 택했습니다.
- source_word: פָּנִים וְאָחוֹר
  english_pob_choice: on the front and on the back
  chosen_korean: 앞면과 뒷면에
  alternatives_korean:
  - 앞과 뒤에
  - 겉과 속에
  lexicon: HALOT
  rationale: 히브리어의 문자적 대응을 살리면서도 두루마리의 양면을 자연스럽게 드러내는 표현입니다.
- source_word: קִנִים וָהֶגֶה וָהִי
  english_pob_choice: lamentations and mourning and woe
  chosen_korean: 애가와 곡과 화
  alternatives_korean:
  - 애가와 신음과 화
  - 애가와 탄식과 재앙
  lexicon: HALOT
  rationale: 세 항목의 병렬을 유지하되, קינים은 ‘애가’, הֶגֶה는 장례·비탄의 맥락을 살린 ‘곡’, הִי는 예언적 탄식어 ‘화’로 옮겼습니다.
theological_decisions:
- issue: 두루마리의 내용이 애가·비탄·재앙의 삼중 표현으로 제시됨
  chosen_reading: ‘애가와 곡과 화’로, 슬픔과 심판의 중압감을 그대로 보존했습니다.
  alternative_readings:
  - ‘애가와 신음과 화’
  - ‘애가와 탄식과 재앙’
  rationale: 본문은 내용을 해석하기보다 반복적·누적적 어조로 제시하므로, 한국어에서도 정서를 완화하지 않고 예언적 경고의 밀도를 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; optimal equivalence.
