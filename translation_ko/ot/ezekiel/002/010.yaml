translation:
  language: ko
  text: 그가 그것을 제 앞에 펼쳤는데, 그것은 앞면과 뒷면에 글이 쓰여 있었고[a], 그 위에는 애가와 애곡과 화가 적혀 있었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
