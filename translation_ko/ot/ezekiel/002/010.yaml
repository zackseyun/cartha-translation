  verdict: revise
  source_fidelity: 히브리어는 그가 두루마리를 에스겔 앞에 펼치고, 그 앞면과 뒷면에 글이 쓰여 있으며 그 안에 세 가지 비탄의 내용이 기록되어 있음을 말합니다. 초안의 전체 의미는 대체로 충실하나, ‘펴 보였는데’는 단순히 ‘펼쳤다’에 ‘보여 주었다’라는 행위를 덧붙일 수 있습니다. 또한 הֶגֶה의 비탄·신음 의미에는 ‘곡’보다 ‘애곡’이 더 분명합니다.
  naturalness: ‘앞면과 뒷면에 글이 쓰여 있었고’는 자연스럽습니다. 다만 현대 표준어에서 ‘애가와 곡’은 의미가 다소 겹치면서 ‘곡’의 뜻이 즉시 분명하지 않을 수 있으므로, ‘애가와 애곡’이 병렬 항목으로 더 명료하고 자연스럽습니다.
