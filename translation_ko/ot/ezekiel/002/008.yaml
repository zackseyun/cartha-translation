source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם שְׁמַע֙ אֵ֤ת אֲשֶׁר אֲנִי֙ מְדַבֵּ֣ר אֵלֶ֔י/ךָ אַל תְּהִי מֶ֖רִי כְּ/בֵ֣ית הַ/מֶּ֑רִי פְּצֵ֣ה פִ֔י/ךָ וֶ/אֱכֹ֕ל אֵ֥ת אֲשֶׁר אֲנִ֖י נֹתֵ֥ן אֵלֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/008.yaml
  text: But you[a], son of man, hear what I am speaking to you. Do not be rebellious like the rebellious house. Open your mouth and eat what I am giving you.
  footnotes:
  - marker: a
    text: Or 'mortal' or 'human one' for 'son of man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너[아] 사람아, 내가 너에게 말하는 것을 들으십시오. 반역하는 집처럼 반역하지 마십시오. 입을 벌리고 내가 너에게 주는 것을 먹으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간’이나 ‘필멸의 존재’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 사람아
  alternatives_korean:
  - 인자여
  - 인간아
  - 죽을 자여
  lexicon: HALOT
  rationale: 히브리어 원문은 에스겔에서 반복되는 호칭이지만, 한국어에서는 ‘사람아’가 원문의 직접 호명성과 ‘인간/필멸의 존재’의 뉘앙스를 비교적 자연스럽게 살립니다. 문체상 ‘인자’는 신약적 용례가 강해 여기서는 피했습니다.
- source_word: שְׁמַע
  english_pob_choice: hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 들어라
  - 들으세요
  lexicon: HALOT
  rationale: 단순 청취보다 주의를 기울여 받아들이라는 명령이므로, 합쇼체 명령으로 ‘들으십시오’를 택해 원문의 명령성을 살렸습니다.
- source_word: אַל תְּהִי מֶרִי כְּבֵית הַמֶּרִי
  english_pob_choice: Do not be rebellious like the rebellious house
  chosen_korean: 반역하는 집처럼 반역하지 마십시오
  alternatives_korean:
  - 반역하는 집처럼 패역하지 마십시오
  - 반역의 집처럼 반역하지 마십시오
  - 반역하는 집처럼 거역하지 마십시오
  lexicon: HALOT
  rationale: מֶרִי는 단순 기분이 아니라 반역/패역의 성격을 가리키므로 ‘반역하다’로 옮겼습니다. 같은 어근의 반복을 한국어에서도 일부 보존해 경고의 강조를 드러냈습니다.
- source_word: פְּצֵה פִיךָ וֶאֱכֹל
  english_pob_choice: Open your mouth and eat
  chosen_korean: 입을 벌리고 … 먹으십시오
  alternatives_korean:
  - 입을 여시고 … 먹으십시오
  - 입을 벌려 … 드십시오
  - 입을 열어 … 먹으십시오
  lexicon: HALOT
  rationale: פָּצָה는 ‘크게 벌리다’의 뜻이어서 ‘입을 벌리고’로 구체화했습니다. 이어지는 ‘먹다’는 환상을 매개로 한 실제적 행위를 유지하기 위해 직역적으로 남겼습니다.
- source_word: אֲשֶׁר אֲנִי נֹתֵן אֵלֶיךָ
  english_pob_choice: what I am giving you
  chosen_korean: 내가 너에게 주는 것
  alternatives_korean:
  - 내가 너에게 주고 있는 것
  - 내가 너에게 주는 바
  - 내가 너에게 주시는 것
  lexicon: HALOT
  rationale: 현재분사적 뉘앙스를 한국어의 현재형 ‘주는 것’으로 자연스럽게 옮겼습니다. 하나님께 직접 경어를 쓰기보다 예언자에게 내리는 명령문 안의 인용으로 보아 일반 서술형을 유지했습니다.
theological_decisions:
- issue: אָדָם 호칭의 한국어 처리
  chosen_reading: ‘사람아’로 옮겨 에스겔의 고유한 예언자 호칭을 유지했습니다.
  alternative_readings:
  - 인자여
  - 인간아
  - 죽을 자여
  rationale: 이 구절의 אָדָם은 일반적 인간 진술이 아니라 반복되는 소명형 호칭이므로, 문학적 기능을 보존하는 번역이 필요합니다. ‘사람아’는 성별 중립성과 호칭성을 함께 지키면서도 지나친 신학적 해석을 덧붙이지 않습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy, point 4; Contested terms: אָדָם'
