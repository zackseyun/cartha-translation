  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ שׁוֹלֵ֨חַ אֲנִ֤י אֽוֹתְ/ךָ֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל גּוֹיִ֥ם הַ/מּוֹרְדִ֖ים אֲשֶׁ֣ר מָרְדוּ בִ֑/י הֵ֤מָּה וַ/אֲבוֹתָ/ם֙ פָּ֣שְׁעוּ בִ֔/י עַד עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/003.yaml
  text: And he said to me[a], “Son of man, I am sending you to the sons of Israel, to the rebellious nations that have rebelled against me; they and their fathers have transgressed against me to this very day.”
  footnotes:
  - marker: a
    text: Or 'human one' or 'mortal' for 'Son of man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. “인자야, 나는 너를 이스라엘의 자손들 곧 나에게 반역한 그 반역하는 민족들에게 보낸다. 그들과 그들의 조상들이 오늘에 이르기까지 내게 범죄하였습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인자’는 여기서 기독론적 칭호가 아니라 에스겔에게 반복적으로 주어지는 예언자 호칭입니다.
    reason: theological_note
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인자여
  - 죽을 인간아
  lexicon: HALOT
  rationale: 에스겔의 반복적 예언자 호칭을 살리기 위해 전통적 대응어인 ‘인자’를 유지하되, 한국어 호격은 현대 합쇼체에 맞게 ‘-야’로 처리했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 자손들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 직역 투명성을 살려 ‘자손들’을 유지했고, 영어 POB의 성별-정확성 방향도 반영했습니다.
- source_word: גּוֹיִם הַמּוֹרְדִים
  english_pob_choice: the rebellious nations
  chosen_korean: 반역하는 민족들
  alternatives_korean:
  - 반역한 나라들
  - 반역하는 나라들
  - 반역한 민족들
  lexicon: HALOT
  rationale: גּוֹיִם의 기본 의미를 ‘민족들’로 옮기면서, 형용사적 분사 הַמּוֹרְדִים는 지속적 성격을 드러내는 ‘반역하는’으로 옮겼습니다.
- source_word: מָרְדוּ בִי / פָּשְׁעוּ בִי
  english_pob_choice: have rebelled against me / have transgressed against me
  chosen_korean: 나에게 반역한 / 내게 범죄하였습니다
  alternatives_korean:
  - 나를 거역한 / 내게 죄를 지었습니다
  - 내게 반역한 / 내게 패역하였습니다
  lexicon: HALOT
  rationale: 두 히브리어 동사를 구별해, 첫째는 ‘반역하다’로, 둘째는 언약 위반의 뉘앙스를 살리는 ‘범죄하다’로 번역했습니다. 동사의 중복을 무작정 평준화하지 않았습니다.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  english_pob_choice: to this very day
  chosen_korean: 오늘에 이르기까지
  alternatives_korean:
  - 이날까지
  - 바로 오늘까지
  - 이 매우 날까지
  lexicon: HALOT
  rationale: 히브리어 관용구의 강조를 한국어 자연문으로 옮겼습니다. ‘오늘에 이르기까지’가 시간적 지속과 종결의 강조를 모두 무리 없이 드러냅니다.
theological_decisions:
- issue: גּוֹיִם을 이스라엘에게 적용한 수사적 충격을 어떻게 보존할 것인가
  chosen_reading: ‘민족들’로 유지하여, 본래 이스라엘을 가리키면서도 민족/열국의 표현을 그대로 살렸습니다.
  alternative_readings:
  - 백성들
  - 이스라엘 사람들
  - 나라들
  rationale: 본문은 이스라엘을 열국에 대한 통상적 표현으로 불러 그 반역성을 극대화합니다. 이를 완화하면 예언적 책망의 충격이 약해집니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: בֶּן אָדָם의 호칭을 어떻게 한국어에서 살릴 것인가
  chosen_reading: 본문에는 ‘인자야’를 두고, 주석 없이 예언자 호칭의 반복성을 유지했습니다.
  alternative_readings:
  - 사람아
  - 죽을 인간아
  - 인간아
  rationale: 여기서 christological 용법이 아니라 에스겔 고유의 예언자 호칭이므로, 표제성·상호텍스트성을 살리는 ‘인자’를 유지하는 것이 가장 본문충실적입니다.
  doctrine_reference: 'Contested terms: אָדָם; Translation philosophy §4'
