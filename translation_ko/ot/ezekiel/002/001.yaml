  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֶּן אָדָם֙ עֲמֹ֣ד עַל רַגְלֶ֔י/ךָ וַ/אֲדַבֵּ֖ר אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/001.yaml
  text: And he said to me[a], “Son of man, stand on your feet, and I will speak to you.”
  footnotes:
  - marker: a
    text: Or 'speak to you.' The Hebrew construction can be rendered either 'with you' or 'to you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분이 제게 말씀하셨습니다. “인자야, 네 발로 일어서십시오. 내가 네게 말하겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 이 표현은 ‘네게 말하다’ 또는 ‘너와 말하다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  english_pob_choice: And he said to me
  chosen_korean: 그분이 제게 말씀하셨습니다
  alternatives_korean:
  - 그리고 그가 제게 말하셨습니다
  - 그가 제게 말씀하셨습니다
  lexicon: HALOT
  rationale: 서술형 wayyiqtol은 한국어에서 자연스러운 과거로 옮기되, 하나님의 직접 발화 맥락이므로 ‘말씀하셨습니다’가 가장 적절합니다.
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔에서 반복되는 호칭을 직역적으로 보존하되, 한국어에서는 호격 ‘-야’를 붙여 선지자에게 주어지는 직접 호칭임을 드러냅니다.
- source_word: עֲמֹד עַל רַגְלֶיךָ
  english_pob_choice: stand on your feet
  chosen_korean: 네 발로 일어서라
  alternatives_korean:
  - 네 발 위에 서라
  - 네 발로 서라
  lexicon: HALOT
  rationale: 히브리어의 구체적 신체 이미지를 유지하면서도 한국어에서 자연스러운 명령문으로 옮겼습니다.
- source_word: וַאֲדַבֵּר אֹתָךְ
  english_pob_choice: and I will speak to you
  chosen_korean: 내가 네게 말하겠다
  alternatives_korean:
  - 내가 너와 말하겠다
  - 내가 너에게 말하겠다
  lexicon: HALOT
  rationale: דבר + 목적격 표지는 ‘말하다/이야기하다’보다 직접적인 발화 행위를 가리키므로, 예언적 선언에 맞게 ‘말하겠다’로 옮겼습니다. 영어 POB의 ‘to you’와 달리 Hebrew 허용 범위의 ‘with/to’ 뉘앙스는 한국어에서 ‘네게’로 중립적으로 담았습니다.
theological_decisions:
- issue: ‘인자’ 호칭의 보존
  chosen_reading: 에스겔의 예언자 호칭을 그대로 살린 ‘인자야’를 채택했습니다.
  alternative_readings:
  - 사람의 아들아
  - 인간아
  rationale: 이 표현은 후대 그리스도론을 이 구절에 덧씌우지 않으면서도, 본문의 문학적·신학적 리듬을 유지합니다.
  doctrine_reference: 'Translation philosophy §4; Contested terms: בֶּן אָדָם'
