id: EZK.13.21
reference: Ezekiel 13:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/קָרַעְתִּ֞י אֶת מִסְפְּחֹֽתֵי/כֶ֗ם וְ/הִצַּלְתִּ֤י אֶת עַמִּ/י֙ מִ/יֶּדְ/כֶ֔ן וְ/לֹֽא יִהְי֥וּ ע֛וֹד בְּ/יֶדְ/כֶ֖ן לִ/מְצוּדָ֑ה וִֽ/ידַעְתֶּ֖ן כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/021.yaml
  text: I will tear off your magic bands[a], and I will deliver my people from your hand, and they will no longer be in your hand as prey[b]; then you will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'bands,' 'amulets,' or possibly 'veils'; the Hebrew term is rare, and its exact referent is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'for hunting' or 'for capture'; the Hebrew expression likely conveys being subject to predatory seizure.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희의 마술 띠를[a] 찢어 버리고, 내 백성을 너희 손에서 건져 내며, 그들이 다시는 너희 손에 사냥감[b]이 되지 않게 하겠습니다. 그러면 너희는 내가 야훼인 줄 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '띠', '부적', 혹은 '베일'로도 옮길 수 있습니다. 히브리어는 희귀어이며 정확한 대상은 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '사냥을 위한 것' 또는 '포획용'으로도 옮길 수 있습니다. 이 표현은 약탈적 포획에 놓인 상태를 가리키는 뜻으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַעְתִּי
  english_pob_choice: I will tear off
  chosen_korean: 찢어 버리고
  alternatives_korean:
  - 뜯어 버리고
  - 찢어 내고
  - 벗겨 버리고
  lexicon: HALOT
  rationale: 위에 두르거나 지닌 물건을 강하게 떼어 내는 이미지를 한국어로 가장 자연스럽게 살리되, 단순한 파손보다 제거의 동작을 분명히 하기 위해 '찢어 버리고'로 옮겼습니다.
- source_word: מִסְפְּחֹתֵיכֶם
  english_pob_choice: your magic bands
  chosen_korean: 너희의 마술 띠
  alternatives_korean:
  - 너희의 띠
  - 너희의 부적
  - 너희의 베일
  lexicon: HALOT
  rationale: 희귀어라 정확한 물체 형태는 불확실하지만, 문맥상 점술적·주술적 기능을 띤 물건이므로 POB의 'magic bands'를 따라 '마술 띠'로 옮겨 기능을 드러냈습니다.
- source_word: מִיֶּדְכֶן / בְּיֶדְכֶן
  english_pob_choice: from your hand / in your hand
  chosen_korean: 너희 손에서 / 너희 손에
  alternatives_korean:
  - 너희 권세에서 / 너희 권세에
  - 너희 힘에서 / 너희 힘에
  lexicon: HALOT
  rationale: '''손''의 통치·지배 비유를 한국어에서도 그대로 유지해 반복 구조를 살렸고, 본문이 말하는 포획과 지배의 이미지를 흐리지 않게 했습니다.'
- source_word: לִמְצוּדָה
  english_pob_choice: as prey
  chosen_korean: 사냥감
  alternatives_korean:
  - 포획물
  - 덫에 걸린 것
  - 먹잇감
  lexicon: HALOT
  rationale: 문맥상 단순한 '그물'보다 타자의 손에 붙잡혀 있는 피지배적 상태를 가리키므로, 포식적 포획의 뉘앙스를 살린 '사냥감'이 가장 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명(神名)을 관례적 칭호로 바꾸지 않고, 프로젝트 기준에 따라 '야훼'로 옮겨 언약적 고유명을 드러냈습니다.
theological_decisions:
- issue: 포획·지배 비유의 유지
  chosen_reading: ‘너희 손’과 ‘사냥감’의 이미지를 그대로 살려, 여인들의 속박과 착취를 하나님의 해방 행위와 대조했습니다.
  alternative_readings:
  - '''권세''와 ''희생양''으로 완화해 옮김'
  - 의미를 풀어 '너희 영향력 아래'로 번역
  rationale: 히브리어 반복은 단순한 권력 관계가 아니라 사냥꾼-피사체의 긴장감을 강조하므로, 이를 완화하지 않고 그대로 보여 주는 것이 본문의 경고와 해방 선언을 더 정확히 전달합니다.
  doctrine_reference: Ezekiel 13의 거짓 예언과 억압적 조작에 대한 심판
