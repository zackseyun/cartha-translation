id: EZK.13.14
reference: Ezekiel 13:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ֨רַסְתִּ֜י אֶת הַ/קִּ֨יר אֲשֶׁר טַחְתֶּ֥ם תָּפֵ֛ל וְ/הִגַּעְתִּ֥י/הוּ אֶל הָ/אָ֖רֶץ וְ/נִגְלָ֣ה יְסֹד֑/וֹ וְ/נָֽפְלָה֙ וּ/כְלִיתֶ֣ם בְּ/תוֹכָ֔/הּ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/014.yaml
  text: I will tear down the wall that you plastered with whitewash[a], and bring it down to the ground, so that its foundation is laid bare. It will fall, and you will perish within it. Then you will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'you plastered with flimsy mortar.' The Hebrew term can emphasize either whitewashing or an inferior coating; in this context it conveys a deceptive, superficial covering.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희가 회칠한[a] 담을 허물고 그것을 땅까지 무너뜨려, 그 기초가 드러나게 하겠습니다. 그 담은 무너질 것이며, 너희는 그 안에서 멸망할 것입니다. 그러면 너희는 내가 야훼인 줄 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회칠한’에 해당하는 히브리어는 흰 회칠을 가리킬 수도 있고, 질이 낮거나 허술한 바름을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרַסְתִּי
  english_pob_choice: I will tear down
  chosen_korean: 내가 … 허물고
  alternatives_korean:
  - 무너뜨리고
  - 헐다
  lexicon: HALOT
  rationale: הרס는 구조물을 무너뜨리거나 헐어 내리는 뜻이므로, 담의 파괴 이미지를 자연스럽게 살리는 ‘허물다’를 택했습니다.
- source_word: הַקִּיר
  english_pob_choice: the wall
  chosen_korean: 담
  alternatives_korean:
  - 벽
  - 담장
  lexicon: HALOT
  rationale: 문맥상 단순한 건축물보다 예언자적 비유가 살아 있는 외벽/담의 이미지가 더 자연스러워 ‘담’으로 옮겼습니다.
- source_word: טַחְתֶּם תָּפֵל
  english_pob_choice: you plastered with whitewash
  chosen_korean: 회칠한
  alternatives_korean:
  - 엉성한 모르타르로 바른
  - 허술한 회반죽을 바른
  lexicon: HALOT
  rationale: 문맥의 핵심은 외형만 가린 속임수이므로, 영어 POB의 ‘whitewash’에 맞추어 ‘회칠하다’로 압축해 표현했습니다.
- source_word: וְנִגְלָה יְסֹדוֹ
  english_pob_choice: so that its foundation is laid bare
  chosen_korean: 그 기초가 드러나게
  alternatives_korean:
  - 그 기초가 벗겨지게
  - 그 기초가 노출되게
  lexicon: HALOT
  rationale: נגל의 수동적 ‘드러나다’ 의미를 살려, 감춰진 약점이 폭로되는 결과를 자연스러운 한국어로 옮겼습니다.
- source_word: וּכְלִיתֶם בְּתוֹכָהּ
  english_pob_choice: and you will perish within it
  chosen_korean: 너희는 그 안에서 멸망할 것이다
  alternatives_korean:
  - 너희는 그 가운데서 사라질 것이다
  - 너희는 그 속에서 끝장날 것이다
  lexicon: HALOT
  rationale: כלה는 단순 종결보다 심판으로 인한 소멸을 뜻하므로 ‘멸망하다’를 사용했고, בְּתוֹכָהּ은 공간 관계를 살려 ‘그 안에서’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 이 본문은 여호와신학의 인식 공식으로 끝나며, 프로젝트 기본값에 따라 신적 이름을 ‘야훼’로 일관되게 반영했습니다.
theological_decisions:
- issue: 심판 진술의 직접성 유지
  chosen_reading: ‘허물고 … 넘어뜨려 … 드러나게 하리라’와 ‘멸망할 것이다’의 연쇄를 그대로 살려, 단순한 경고가 아니라 실행되는 심판 선언으로 읽히게 했습니다.
  alternative_readings:
  - 완곡하게 ‘무너지게 하겠다’로 낮추는 읽기
  - 결과를 추상화해 ‘파멸하게 하겠다’로 바꾸는 읽기
  rationale: 에스겔 13장은 거짓 예언에 대한 하나님의 적극적 심판을 드러내므로, 동작의 연쇄와 결과를 약화시키지 않았습니다.
  doctrine_reference: Ezekiel 13:14; divine judgment against false prophecy
