    rationale: 히브리어는 ‘네 백성의 딸들’ 자체를 목적어로 삼으며 ‘가운데서’에 해당하는 전치사나 구문이 없습니다.
  - severity: high
    issue: ‘네 얼굴을 세우고 … 향하여’ 및 반복된 ‘향하여’
    rationale: ‘얼굴을 세우다’는 자연스러운 한국어 관용 표현이 아니며, ‘향하여’만으로는 심판 예언 문맥에서 אֶל/עַל이 나타내는 대적의 방향성이 약화됩니다.
