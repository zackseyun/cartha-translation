  source_fidelity: 수정이 필요합니다. 초안의 ‘네 백성의 딸들 가운데서’는 히브리어에 없는 ‘가운데서’를 삽입하며, ‘그들을 향하여’는 שִׂים פָּנֶיךָ אֶל 및 עֲלֵיהֶן의 대적·심판적 방향성을 충분히 나타내지 못합니다. וְאַתָּה의 대조도 ‘그러나’로 반영하는 것이 적절합니다.
  naturalness: ‘네 얼굴을 세우고 … 향하여’는 현대 한국어에서 부자연스럽고 문장 구조도 무겁습니다. ‘그들에게 맞서 얼굴을 돌리고’와 ‘그들에게 맞서 예언하십시오’는 자연스러우면서도 원문의 반복되는 적대 방향을 보존합니다. 합쇼체 명령형으로 통일했습니다.
  terminology: ‘사람의 아들아’는 에스겔에서 반복되는 בֶן־אָדָם을 문자적으로 보존합니다. ‘딸들’과 ‘자기 마음에서 예언하는’도 각각 בְּנוֹת 및 מִלִּבְּהֶן의 표현을 유지하며, 본문에 ‘거짓’을 보태지 않습니다.
  issues:
