id: EZK.13.17
reference: Ezekiel 13:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל בְּנ֣וֹת עַמְּ/ךָ֔ הַ/מִּֽתְנַבְּא֖וֹת מִֽ/לִּבְּ/הֶ֑ן וְ/הִנָּבֵ֖א עֲלֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/017.yaml
  text: And you[a], son of man, set your face against the daughters of your people who prophesy out of their own hearts[b], and prophesy against them.
  footnotes:
  - marker: a
    text: Or 'the women of your people.' The Hebrew reads 'the daughters of your people,' which is retained to reflect the specific wording.
    reason: lexical_alternative
  - marker: b
    text: '''Out of their own hearts'' indicates that their prophetic message arises from themselves rather than from the LORD.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 너, 사람의 아들아, 네 백성의 딸들[a], 곧 자기 마음에서 예언하는 자들에게 맞서 얼굴을 돌리고, 그들에게 맞서 예언하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘네 백성의 딸들’입니다. 여기서 ‘딸들’은 여성들을 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 마음에서’는 그들의 예언이 주님에게서 받은 것이 아니라 자기들 내면에서 비롯됨을 나타냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 사람의 아들
  alternatives_korean:
  - 인자
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서의 반복적 호칭을 살리기 위해 관용구를 직역에 가깝게 유지했습니다. '인자'는 다른 본문에서 익숙하지만, 여기서는 의미보다 호칭의 반복성과 문자성을 우선했습니다.
- source_word: שִׂים פָּנֶיךָ אֶל
  english_pob_choice: set your face against
  chosen_korean: 네 얼굴을 세우고 … 향하여
  alternatives_korean:
  - 네 얼굴을 돌리고 … 향하여
  - 네 얼굴을 대하고
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘얼굴을 향하게 하다’라는 동작을 유지하면서, 앞뒤 문맥의 대적 뉘앙스는 후반의 '향하여'와 '예언하라'로 드러나게 했습니다.
- source_word: בְּנוֹת עַמְּךָ
  english_pob_choice: the daughters of your people
  chosen_korean: 네 백성의 딸들
  alternatives_korean:
  - 네 백성의 여자들
  - 네 민족의 딸들
  lexicon: HALOT
  rationale: 히브리어의 구체적 표현인 '딸들'을 보존해 성별을 일반화하지 않았습니다. POB의 주석 취지를 따라 필요하면 '여자들'로 넓힐 수 있으나 본문은 원어의 어휘를 유지했습니다.
- source_word: מִלִּבְּהֶן
  english_pob_choice: out of their own hearts
  chosen_korean: 자기들의 마음에서
  alternatives_korean:
  - 자기들의 심장에서
  - 자기들 마음속에서
  lexicon: HALOT
  rationale: לֵב/לֵבָב의 핵심 의미인 내면, 생각, 의도를 한국어 '마음'으로 자연스럽게 옮겼습니다. '자기들의'를 더해 하나님에게서 난 것이 아니라 자기 기원임을 드러냈습니다.
theological_decisions:
- issue: 이들의 예언을 본문 안에서 '거짓'으로 명시할지 여부
  chosen_reading: 본문에는 '자기들의 마음에서 예언하는 자들'로 두고, '거짓으로'는 덧붙이지 않았습니다.
  alternative_readings:
  - 거짓 예언하는 자들
  - 거짓말하는 예언자들
  rationale: 히브리어 본문 자체는 이들의 발화 근원을 비판할 뿐, 여기서 직접 '거짓'이라는 형용사를 붙이지 않습니다. 문맥상의 책망은 이미 '그들을 향하여 예언하라'와 '자기들의 마음에서'로 충분히 전달됩니다.
  doctrine_reference: 원어 우선 번역 원칙; 문맥적 판단을 본문 어휘에 과잉 주입하지 않음
