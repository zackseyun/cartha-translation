  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֞ כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הוֹי֩ לִֽ/מְתַפְּר֨וֹת כְּסָת֜וֹת עַ֣ל כָּל אַצִּילֵ֣י יָדַ֗/י וְ/עֹשׂ֧וֹת הַ/מִּסְפָּח֛וֹת עַל רֹ֥אשׁ כָּל קוֹמָ֖ה לְ/צוֹדֵ֣ד נְפָשׁ֑וֹת הַ/נְּפָשׁוֹת֙ תְּצוֹדֵ֣דְנָה לְ/עַמִּ֔/י וּ/נְפָשׁ֖וֹת לָ/כֶ֥נָה תְחַיֶּֽינָה־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/018.yaml
  text: 'And say, ‘Thus says the Lord GOD: Woe to the women who sew magic bands on every wrist and make veils for the head of persons of every height, to hunt souls! Will you hunt the souls of my people and keep your own souls alive?'
translation:
  language: ko
  text: “말하여라. 주 야훼께서 이렇게 말씀하십니다. ‘사람들의 팔목마다 마술 띠를 꿰매고, 키가 각기 다른 사람들의 머리를 위한 너울을 만들어 영혼을 사냥하는 여자들에게 화가 있다! 너희가 내 백성의 영혼들을 사냥하고, 너희 자신의 영혼은 살려 두겠느냐?’”[a][b][c]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘야훼’는 히브리어 신명 יהוה의 음역입니다.
    reason: source_note
  - marker: b
    text: ‘마술 띠’는 본문의 주술적 ‘띠’(bands)를 드러내기 위한 번역입니다.
    reason: korean_style_note
  - marker: c
    text: ‘영혼’은 כאן의 נפש가 가리키는 생명/인격을 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: YHWH
  rationale: POB의 기본 원칙에 따라 신명은 학술적 음역인 ‘야훼’로 옮기고, אַדֹנָי와의 결합은 ‘주’로 처리해 경칭과 고유명을 함께 드러냈습니다.
- source_word: מְתַפְּרוֹת כְּסָתוֹת
  english_pob_choice: women who sew magic bands
  chosen_korean: 마술 띠를 꿰매고
  alternatives_korean:
  - 주술 띠를 꿰매고
  - 부적 띠를 꿰매고
  lexicon: source context
  rationale: 문맥상 단순한 장식이 아니라 사람을 조종하거나 해를 끼치는 주술적 띠이므로, ‘마술 띠’로 직역해 POB의 의미를 보존했습니다.
- source_word: מִסְפָּחוֹת ... לְצוֹדֵד נְפָשׁוֹת
  english_pob_choice: veils ... to hunt souls
  chosen_korean: 너울을 만들어 영혼을 사냥하는
  alternatives_korean:
  - 수건을 만들어 생명을 잡는
  - 베일을 만들어 혼을 사냥하는
  lexicon: נפש
  rationale: נפש는 여기서 생명/영혼의 전체 인격을 가리키므로, POB의 ‘souls’에 맞춰 ‘영혼’으로 옮기되 동사의 폭력성을 살려 ‘사냥하는’으로 표현했습니다.
- source_word: נְפָשׁוֹת ... תְחַיֶּינָה
  english_pob_choice: keep your own souls alive
  chosen_korean: 너희 자신의 영혼은 살려 두겠느냐
  alternatives_korean:
  - 너희 영혼은 살리겠느냐
  - 너희 목숨은 살려 두겠느냐
  lexicon: נפש
  rationale: 마지막 대조는 다른 이들의 영혼을 ‘사냥’하면서 자기 영혼만 보존하려는 위선을 비꼬므로, 수동적 보전 의미를 살려 ‘살려 두겠느냐’로 옮겼습니다.
theological_decisions:
- issue: ‘영혼’(נפש)의 의미 범위
  chosen_reading: 이 절에서는 נפש를 일관되게 ‘영혼’으로 옮겨, 단순한 심리 상태가 아니라 생명 자체를 노리는 폭력성과 자기보존의 대조를 드러냈습니다.
  alternative_readings:
  - 목숨
  - 생명
  rationale: 예언 문맥에서 נפש가 생명/인격을 포괄하더라도, POB의 audit trail이 ‘souls’를 선택했으므로 한국어도 그 긴장감을 유지하는 편이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 인간 생명과 인격의 통합성
- issue: ‘마술 띠’의 주술적 성격
  chosen_reading: ‘띠’를 단순 장식물이 아니라 사람을 얽어매는 주술 도구로 읽어 ‘마술 띠’로 옮겼습니다.
  alternative_readings:
  - 부적 띠
  - 주술 띠
  rationale: 본문의 고발 초점이 미신적 행위 자체에 있으므로, 완곡한 장식어보다 주술성을 직접 드러내는 번역이 원문과 POB의 의도를 더 잘 반영합니다.
  doctrine_reference: 우상숭배와 주술에 대한 예언자적 비판
