id: EZK.13.7
reference: Ezekiel 13:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/ל֤וֹא מַֽחֲזֵה שָׁוְא֙ חֲזִיתֶ֔ם וּ/מִקְסַ֥ם כָּזָ֖ב אֲמַרְתֶּ֑ם וְ/אֹֽמְרִים֙ נְאֻם יְהוָ֔ה וַ/אֲנִ֖י לֹ֥א דִבַּֽרְתִּי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/007.yaml
  text: Have you not seen a false vision and spoken a lying divination[a], when you say, ‘Declares Yahweh,’ though I have not spoken?
  footnotes:
  - marker: a
    text: Or 'a vain vision' and 'a false divination.' The Hebrew terms emphasize emptiness and falsehood in the prophets' claimed revelations.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 헛된 환상을 보고 거짓 점술을 선포하며, ‘야훼의 말씀이다’라고 말하지 않았습니까? 그러나 내가 말한 것은 아니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헛된 환상’은 ‘거짓된 환상’ 또는 ‘공허한 환상’으로도 옮길 수 있습니다. 히브리어는 그들이 주장한 계시의 공허함과 거짓됨을 함께 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲזֵה שָׁוְא
  english_pob_choice: a false vision
  chosen_korean: 헛된 환상
  alternatives_korean:
  - 거짓 환상
  - 허망한 환상
  - 가짜 환상
  lexicon: HALOT
  rationale: מַחֲזֵה는 ‘환상/보기’이고 שָׁוְא는 공허함과 거짓을 함께 담으므로, 예언적 문맥에서 ‘헛된 환상’이 의미를 가장 자연스럽게 드러냅니다.
- source_word: וּמִקְסַם כָּזָב
  english_pob_choice: a lying divination
  chosen_korean: 거짓 점술
  alternatives_korean:
  - 거짓 예언
  - 속이는 점술
  - 거짓 점괘
  lexicon: HALOT
  rationale: מִקְסָם은 점술적/오라클적 발화를 가리키고 כָּזָב는 거짓을 뜻하므로, ‘점술’로 어휘의 성격을 살리되 ‘거짓’으로 그 허위를 분명히 했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: Declares Yahweh
  chosen_korean: ‘야훼의 말씀이니라’
  alternatives_korean:
  - ‘야훼께서 말씀하신다’
  - ‘야훼의 선언이다’
  - ‘주님의 말씀이다’
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם은 단순한 ‘말하다’보다 선언/신탁의 어감을 가지므로, 한국어 관용과 직결되면서도 원문의 공적 선포성을 살려 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 신명기는 ‘야훼’로 옮기고, 예언 공식 안에서도 같은 형태를 유지해 원문 고유명을 드러냈습니다.
theological_decisions:
- issue: 거짓 예언의 고발을 직접적 대조 구조로 유지할지 여부
  chosen_reading: ‘너희가 … 말하지 않았습니까? … 나는 말하지 않았습니다’로 대조를 분명히 했습니다.
  alternative_readings:
  - 완곡하게 풀어 ‘그런 말은 하지 않았지요’처럼 약화
  - 서술형으로 바꿔 ‘너희는 거짓 환상을 보았다’
  rationale: 히브리어는 수사적 질문과 강한 대조를 통해 예언자들의 자기 주장과 야훼의 부인을 맞세우므로, 그 긴장을 한국어에서도 그대로 유지했습니다.
  doctrine_reference: 예언의 진위와 하나님의 직접 발화 여부에 관한 본문 문맥
