  source_fidelity: 히브리어의 수사적 의문, ‘헛된 환상’과 ‘거짓 점술’의 병렬, 그리고 야훼의 말씀이라고 주장하는 것과 야훼께서 실제로 말씀하지 않으셨다는 대조를 대체로 잘 반영했습니다. 다만 ‘나는 말하지 않았습니다’는 문법상 가능하나, 앞의 인용 공식과 연결될 때 야훼의 부인이 다소 갑작스럽고 한국어로는 ‘내가 말한 것은 아니다’가 원문의 대조를 더 자연스럽고 분명하게 드러냅니다.
  naturalness: 초안의 ‘거짓 점술을 말하지 않았습니까?’는 한국어 결합이 다소 어색하며, ‘야훼의 말씀이니라’는 현대 표준어 합쇼체보다 고전적 성경체에 가깝습니다. ‘거짓 점술을 선포하며’와 ‘야훼의 말씀이다’는 현대적이면서도 예언 선포의 문체를 유지합니다.
