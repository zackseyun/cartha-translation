source:
  edition: WLC
  text: לָ/כֵ֗ן שָׁ֚וְא לֹ֣א תֶחֱזֶ֔ינָה וְ/קֶ֖סֶם לֹא תִקְסַ֣מְנָה ע֑וֹד וְ/הִצַּלְתִּ֤י אֶת עַמִּ/י֙ מִ/יֶּדְ/כֶ֔ן וִֽ/ידַעְתֶּ֖ן כִּֽי אֲנִ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/023.yaml
  text: Therefore you will no longer see false visions or practice divination anymore, and I will deliver my people from your hand. Then you will know that I am the LORD.
translation:
  language: ko
  text: 그러므로 너희는 더 이상 거짓 환상을 보지 못하고, 다시는 점치지도 못할 것입니다. 내가 내 백성을 너희 손에서 건져 내리니, 그때 너희는 내가 야훼임을 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거짓 환상’은 예언자적 환시의 내용이 거짓이라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: שָׁוְא ... תֶחֱזֶינָה
  english_pob_choice: see false visions
  chosen_korean: 거짓 환상을 보지 못하고
  alternatives_korean:
  - 거짓 환상을 보지 않고
  - 허망한 환상을 보지 못하고
  lexicon: חזה
  rationale: 예언자들이 ‘보는’ 행위를 단순한 시각이 아니라 예언적 환상 수신으로 말하므로 ‘거짓 환상’으로 옮기고, 부정문 흐름을 자연스럽게 살리기 위해 ‘보지 못하고’로 표현했습니다.
- source_word: וְקֶסֶם לֹא תִקְסַמְנָה
  english_pob_choice: practice divination
  chosen_korean: 다시는 점치지도 못할 것입니다
  alternatives_korean:
  - 더 이상 점치지 못할 것입니다
  - 다시는 점을 치지도 못할 것입니다
  lexicon: קסם
  rationale: קסם은 주술적 점복을 가리키므로 일반적인 ‘점’보다 행위성을 드러내는 ‘점치다’를 택했고, 영어 POB의 ‘anymore’/‘no longer’ 흐름을 반영해 ‘다시는’으로 강화했습니다.
- source_word: וְהִצַּלְתִּי אֶת עַמִּי ... מִיֶּדְכֶן
  english_pob_choice: I will deliver my people from your hand
  chosen_korean: 내가 내 백성을 너희 손에서 건져 내리니
  alternatives_korean:
  - 내가 내 백성을 너희 손에서 구해 내리니
  - 내가 내 백성을 너희 손에서 빼내리니
  lexicon: נצל + יד
  rationale: ‘손에서 구하다’는 통제권에서 벗겨 내는 구출의 비유를 살리기 위해 ‘건져 내다’를 사용했고, ‘너희 손’은 권세와 억압의 이미지를 그대로 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: 공유된 프로젝트 기본값에 따라 יהוה는 ‘야훼’로 옮기며, 본문 끝의 자기계시 공식을 한국어에서도 직접적으로 드러냈습니다.
theological_decisions:
- issue: 예언자 심판의 종결과 야훼 인식 공식
  chosen_reading: 거짓 환상과 점술이 중단되고, 야훼가 내 백성을 해방하시는 행위로 참 선지자와 거짓 선지자의 구분이 드러납니다.
  alternative_readings:
  - 단순한 예언 무능력 선언
  - 윤리적 경고로만 축소하는 해석
  rationale: 본문은 능력 상실의 예고를 넘어, 야훼가 주권적으로 거짓 예언을 끊고 백성을 건져 내심으로 자신의 정체를 알게 하시는 심판-구원 구조를 갖습니다.
  doctrine_reference: 예언의 참됨과 하나님의 주권적 자기계시
- issue: 지칭의 번역
  chosen_reading: 본문의 LORD는 문맥상 야훼를 가리키므로 본문에서는 ‘야훼’로 직접 옮겼습니다.
  alternative_readings:
  - ‘주님’으로 완화
  - ‘여호와’로 전통화
  rationale: POB의 오픈바이블 원칙상 히브리어 신명은 원문 식별성을 살리는 방향이 우선이며, 본 절의 결론부 계시 공식을 명시적으로 전달하기 위해 직역적 표기를 유지했습니다.
  doctrine_reference: 신명 표기와 본문 식별성
