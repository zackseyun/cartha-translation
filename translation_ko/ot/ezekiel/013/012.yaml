  yaml_path: translation/ot/ezekiel/013/012.yaml
  text: And look[a], when the wall falls, will it not be said to you, ‘Where is the plaster with which you plastered it?’
  footnotes:
  - marker: a
    text: Or 'whitewash' for 'plaster'; the term can refer to a coating spread over a wall, and in this chapter the image carries the sense of a deceptive surface treatment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 보십시오[a], 벽이 무너지면, 너희에게 이렇게 말하지 않겠습니까? “너희가 그것에 발라 놓은 회반죽은 어디 있느냐?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백회칠’로도 옮길 수 있습니다. 여기서는 벽의 겉면을 덮는 재료라는 기본 뜻을 살렸으며, 이 장 전체의 문맥에서는 속임수의 표면 처리라는 뉘앙스가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And look
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 보십시오
  - 그리고 보라
  lexicon: HALOT
  rationale: 청중의 주의를 끄는 감탄적 도입어로서, 현대 한국어에서는 ‘보십시오’가 문어적이면서도 자연스럽게 시선을 돌리게 합니다.
- source_word: הַטִּיחַ
  english_pob_choice: the plaster
  chosen_korean: 회반죽
  alternatives_korean:
  - 석회칠
  - 플라스터
  - 미장재
  lexicon: HALOT
  rationale: 이 단락의 문맥은 벽에 바르는 표면 처리 재료를 가리키므로, 의미를 분명히 드러내는 ‘회반죽’이 적절합니다. ‘백칠/백회칠’보다 본문의 물질성을 더 직접적으로 반영합니다.
- source_word: אֲשֶׁר טַחְתֶּם
  english_pob_choice: with which you plastered it
  chosen_korean: 너희가 그것에 발라 놓은
  alternatives_korean:
  - 너희가 그것을 바른
  - 너희가 그것에 칠한
  lexicon: HALOT
  rationale: 히브리어의 도포 행위를 자연스러운 한국어로 옮기기 위해 ‘발라 놓은’으로 처리했고, 대명사 ‘그것’은 벽을 가리키는 문맥상 생략하지 않았습니다.
- source_word: יֵאָמֵר אֲלֵיכֶם
  english_pob_choice: will it not be said to you
  chosen_korean: 너희에게 이렇게 말하지 않겠습니까
  alternatives_korean:
  - 너희에게 말하지 않겠습니까
  - 사람들이 너희에게 말하지 않겠습니까
  lexicon: HALOT
  rationale: 수동형의 일반적/불특정 발화를 한국어 반문으로 자연스럽게 살려, 누가 말하는지 특정하지 않았습니다.
theological_decisions:
- issue: 예언적 반문에서의 수사적 긴장 유지
  chosen_reading: 문장 전체를 실제로 대답을 요구하는 반문으로 옮겨, 벽이 무너진 뒤의 조롱 섞인 폭로를 보존했습니다.
  alternative_readings:
  - 직설문으로 완화하는 번역
  - 더 설명적인 의역
  rationale: 본문은 거짓 보수의 허구가 붕괴된 뒤 드러나는 수치와 폭로를 강조하므로, 완곡하게 만들지 않고 수사적 질문을 유지하는 것이 본문의 힘을 더 잘 드러냅니다.
  doctrine_reference: 문맥상 예언적 책망의 수사법
