id: EZK.13.9
reference: Ezekiel 13:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיְתָ֣ה יָדִ֗/י אֶֽל הַ/נְּבִיאִ֞ים הַ/חֹזִ֣ים שָׁוְא֮ וְ/הַ/קֹּסְמִ֣ים כָּזָב֒ בְּ/ס֧וֹד עַמִּ֣/י לֹֽא יִהְי֗וּ וּ/בִ/כְתָ֤ב בֵּֽית יִשְׂרָאֵל֙ לֹ֣א יִכָּתֵ֔בוּ וְ/אֶל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֹ֣א יָבֹ֑אוּ וִ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/009.yaml
  text: And my hand will be against the prophets who see falsehood and who practice lying divination[a]. They will not be in the council of my people, nor will they be written in the register of the house of Israel, nor will they enter the land of Israel[c][b]. Then you will know that I am the Lord Yahweh.
  footnotes:
  - marker: a
    text: Or 'assembly of my people' or 'secret council of my people' for 'council of my people.'
    reason: lexical_alternative
  - marker: b
    text: Or 'record' or 'written roll' for 'register.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the Lord GOD' represents אֲדֹנָי יְהוִה; alternatively, 'the Lord Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 내 손이 거짓을 보는 예언자들과 거짓 점술을 행하는 자들을 대적할 것입니다. 그들은 내 백성의 모임에[a] 들지 못하고, 이스라엘 집의 명부에[b] 기록되지 못하며, 이스라엘 땅에 들어가지 못할 것입니다. 그러면 너희는 내가 주 야훼[c]임을 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모임’은 ‘회의’ 또는 ‘비밀 회의’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘명부’는 ‘기록’ 또는 ‘등록부’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 אֲדֹנָי יְהוִה는 ‘주 야훼’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיְתָה יָדִי אֶל
  english_pob_choice: And my hand will be against
  chosen_korean: 내 손이 ... 위에 있을 것입니다
  alternatives_korean:
  - 내 손이 ...를 향할 것입니다
  - 내 손이 ...에 대적할 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 징계적·적대적 개입을 뜻하므로, ‘위에 있다’로 하나님의 심판적 손길을 자연스럽게 살리되 공격성을 약화하지 않도록 했습니다.
- source_word: הַחֹזִים שָׁוְא
  english_pob_choice: who see falsehood
  chosen_korean: 거짓을 보는 예언자들
  alternatives_korean:
  - 허무를 보는 예언자들
  - 거짓 환상을 보는 예언자들
  lexicon: HALOT
  rationale: חזים은 ‘보는 자들’이라는 예언적 시각 언어를 유지하고, שָׁוְא를 ‘거짓’으로 옮겨 그들의 환시가 허망한 것이 아니라 허위임을 분명히 했습니다.
- source_word: וְהַקֹּסְמִים כָּזָב
  english_pob_choice: who practice lying divination
  chosen_korean: 거짓 점술을 행하는 자들
  alternatives_korean:
  - 거짓을 점치는 자들
  - 거짓으로 점을 치는 자들
  lexicon: HALOT
  rationale: קסם은 점술 행위를 가리키므로 ‘행하다’를 붙여 지속적 실천을 드러냈고, כָּזָב은 결과의 내용이 거짓임을 보여 ‘거짓 점술’로 압축했습니다.
- source_word: בְּסוֹד עַמִּי
  english_pob_choice: in the council of my people
  chosen_korean: 내 백성의 회의에
  alternatives_korean:
  - 내 백성의 모임에
  - 내 백성의 비밀 회의에
  lexicon: HALOT
  rationale: סוֹד는 친밀한 협의체/회의의 뜻이 있어, ‘회의’로 옮겨 공동체의 공적·내적 소속을 함께 살렸습니다.
- source_word: וּבִכְתָב בֵּית יִשְׂרָאֵל
  english_pob_choice: in the register of the house of Israel
  chosen_korean: 이스라엘 집의 기록에도
  alternatives_korean:
  - 이스라엘 집의 명부에도
  - 이스라엘 집의 등록부에도
  lexicon: HALOT
  rationale: כתב은 공식 문서나 명부의 의미가 강하므로, 현대 한국어에서 자연스러운 행정 문서 표현인 ‘기록’으로 처리했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 여호와
  - 주 하나님
  rationale: 본문의 אֲדֹנָי יְהוִה를 두 겹의 주권 호칭으로 살리면서, 사문서적 대체어보다 본문 명칭을 직접 반영해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 심판 선언의 화행
  chosen_reading: 내 손이 ... 있을 것입니다
  alternative_readings:
  - 내 손이 ...에 임할 것입니다
  - 내 손이 ...를 치실 것입니다
  rationale: ‘내 손’은 단순 신체가 아니라 심판의 능동적 개입을 뜻하므로, 선언문 전체를 미래형으로 유지하면서도 징계적 긴장을 보존했습니다.
  doctrine_reference: 에스겔 13:9 문맥의 예언적 심판 선언
