  source_fidelity: 현 본문의 ‘평강이 없는데도 그렇게 합니다’는 히브리어에 없는 ‘그렇게 합니다’를 보태며, ‘평강이 없음’이 예언자들의 행위가 아니라 그들이 본다고 주장하는 환상과 실제 현실 사이의 대조임을 흐립니다. לָהּ는 예루살렘을 가리키므로 한국어에서는 대명사 ‘그녀’보다 지명을 반복하는 편이 자연스럽고 분명합니다. 아도나이 יְהוִה는 고유한 신명 요소를 보존하여 ‘주 야훼’로 옮기는 것이 적절합니다.
  naturalness: ‘그녀를 위해’와 ‘평강이 없는데도 그렇게 합니다’는 현대 표준 한국어 본문으로 어색합니다. ‘예루살렘을 위하여’ 및 ‘평화가 없는데도 … 보는’으로 고치면 문장의 관계가 명료해집니다. ‘평화’는 ‘평강’보다 현대 공적 문체에서 자연스럽습니다.
  terminology: נביאים은 ‘예언자들’, חזון은 ‘환상’으로 적절합니다. שָׁלוֹם은 문맥상 반복되는 ‘평화’로 통일하되, 주석에서 안녕·온전함·복리의 의미 범위를 밝혀야 합니다. יְהוִה가 포함된 호칭은 ‘주 야훼’로 번역합니다.
  issues:
  - severity: high
    issue: ‘평강이 없는데도 그렇게 합니다’가 원문에 없는 서술을 추가합니다.
