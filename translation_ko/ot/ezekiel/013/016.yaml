id: EZK.13.16
reference: Ezekiel 13:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נְבִיאֵ֣י יִשְׂרָאֵ֗ל הַֽ/נִבְּאִים֙ אֶל יְר֣וּשָׁלִַ֔ם וְ/הַ/חֹזִ֥ים לָ֖/הּ חֲז֣וֹן שָׁלֹ֑ם וְ/אֵ֣ין שָׁלֹ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/016.yaml
  text: the prophets of Israel who prophesy concerning Jerusalem and who see for her a vision of peace[a], when there is no peace, declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'a vision of well-being'; Hebrew shalom can include peace, wholeness, and welfare.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 예언자들, 곧 예루살렘에 대하여 예언하며 그녀를 위해 평강의 환상을 보는 자들은, 평강이 없는데도 그렇게 합니다. 주 하나님께서 선언하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘평강’은 히브리어 shalom의 기본값이지만, ‘잘됨’, ‘온전함’, ‘번영’의 뉘앙스도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאֵי יִשְׂרָאֵל
  english_pob_choice: the prophets of Israel
  chosen_korean: 이스라엘의 예언자들
  alternatives_korean:
  - 이스라엘의 선지자들
  - 이스라엘 예언자들
  lexicon: HALOT
  rationale: 예언자라는 일반 표준어를 쓰되, 소유격 구조를 살려 이들이 이스라엘에 속한 예언자들이라는 관계를 분명히 했습니다.
- source_word: הַנִּבְּאִים
  english_pob_choice: who prophesy
  chosen_korean: 예언하며
  alternatives_korean:
  - 예언하는
  - 예언하고 있는
  lexicon: HALOT
  rationale: 현재 분사적 수식으로서 이들의 반복적/지속적 행위를 나타내므로, 한국어에서는 관형절보다 동작상에 맞는 연결형을 택했습니다.
- source_word: אֶל יְרוּשָׁלַםִ
  english_pob_choice: to Jerusalem
  chosen_korean: 예루살렘에 대하여
  alternatives_korean:
  - 예루살렘에게
  - 예루살렘을 향하여
  lexicon: HALOT
  rationale: 예언의 대상/방향을 나타내는 אֶל을 한국어에서는 ‘~에 대하여’로 옮겨, 이 맥락의 예언 대상성을 드러냈습니다.
- source_word: חֲזוֹן שָׁלוֹם
  english_pob_choice: a vision of peace
  chosen_korean: 평강의 환상
  alternatives_korean:
  - 평화의 환상
  - 평안의 환상
  - 잘됨의 환상
  lexicon: HALOT
  rationale: שָׁלוֹם은 단순한 평화보다 평강의 의미범위를 넓게 담을 수 있어 기본 용례인 ‘평강’을 택했고, חָזוֹן은 ‘환상’으로 옮겼습니다.
theological_decisions:
- issue: 여호와의 이름과 호칭 합성구 אֲדֹנָי יְהוִה
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 야훼
  - 주 여호와
  - 주 LORD
  rationale: 한국어에서는 두 호칭이 겹치는 어색함을 피하면서도, 최종 발화 주체가 주권자 하나님임을 분명히 하는 ‘주 하나님’이 합쇼체 본문에 가장 자연스럽습니다.
  doctrine_reference: POB terminology for יְהוָה / divine title rendering
- issue: 마지막 진술의 문법적 관계
  chosen_reading: 평강이 없는데도 그렇게 합니다
  alternative_readings:
  - 평강이 없을 때입니다
  - 평강이 없으면서도
  rationale: 히브리어의 대조 구조(평강의 환상 vs. 평강이 없음)를 한국어에서 자연스럽게 살리기 위해, 예언자들의 거짓된 메시지와 현실의 부정을 직접 대비시켰습니다.
  doctrine_reference: Source-syntax contrast and prophetic rhetoric
