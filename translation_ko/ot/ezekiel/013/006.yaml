source:
  edition: WLC
  text: חָ֤זוּ שָׁוְא֙ וְ/קֶ֣סֶם כָּזָ֔ב הָ/אֹֽמְרִים֙ נְאֻם יְהוָ֔ה וַֽ/יהוָ֖ה לֹ֣א שְׁלָחָ֑/ם וְ/יִֽחֲל֖וּ לְ/קַיֵּ֥ם דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/006.yaml
  text: They have seen falsehood and lying divination[a], those who say, ‘Declaration of Yahweh,’ though Yahweh has not sent them[b]; yet they hope for the fulfillment of the word.
  footnotes:
  - marker: a
    text: Or “Oracle of the LORD” or “Utterance of the LORD.”
    reason: lexical_alternative
  - marker: b
    text: Or “yet they expect the word to be confirmed” or “they wait for the word to be fulfilled.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 거짓 환상을 보고 거짓 점을 칩니다. 그들은 「야훼의 선언입니다」라고 말하지만, 야훼께서는 그들을 보내지 않으셨습니다[a]. 그러나 그들은 그 말이 이루어지기를 바랍니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼의 신탁입니다” 혹은 “야훼의 말씀입니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “그러나 그들은 그 말이 확증되기를 기대합니다” 또는 “그들은 그 말이 이루어질 것을 기다립니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזוּ שָׁוְא
  english_pob_choice: have seen falsehood
  chosen_korean: 거짓 환상을 보고
  alternatives_korean:
  - 거짓을 보고
  - 헛된 환상을 보고
  - 허무를 보고
  lexicon: HALOT
  rationale: חזה의 예언적 ‘봄’은 단순 관찰보다 환상/계시를 가리키므로 ‘환상’을 살리고, שָׁוְא의 허위성을 ‘거짓’으로 옮겼습니다.
- source_word: קֶסֶם כָּזָב
  english_pob_choice: lying divination
  chosen_korean: 거짓 점괘를 말합니다
  alternatives_korean:
  - 거짓 점술을 합니다
  - 속이는 점괘를 말합니다
  - 허위한 점술을 합니다
  lexicon: HALOT
  rationale: קֶסֶם은 점/점괘의 영역을 가리키므로 한국어에서 자연스러운 ‘점괘’로 옮기고, כָּזָב의 ‘거짓됨’을 분명히 했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: Declaration of Yahweh
  chosen_korean: 「야훼의 선언입니다」
  alternatives_korean:
  - 「야훼의 말씀입니다」
  - 「야훼의 신탁입니다」
  - 「야훼께서 말씀하십니다」
  lexicon: HALOT
  rationale: 예언 공식의 엄숙함과 아이러니를 보존하기 위해 직역에 가까운 ‘선언’으로 옮겼고, 신성한 이름은 본문 기본값인 ‘야훼’를 따랐습니다.
- source_word: לֹא שְׁלָחָם
  english_pob_choice: has not sent them
  chosen_korean: 보내신 적이 없습니다
  alternatives_korean:
  - 보내지 않으셨습니다
  - 그들을 보내지 않으셨습니다
  - 파송하지 않으셨습니다
  lexicon: HALOT
  rationale: 예언자 파송의 부재를 분명히 하면서도 현대 한국어 문맥에서 자연스러운 부정 완료 표현으로 옮겼습니다.
- source_word: וְיִחֲלוּ לְקַיֵּם דָּבָר
  english_pob_choice: yet they hope for the fulfillment of the word
  chosen_korean: 그러나 그들은 그 말씀이 이루어지기를 기다립니다
  alternatives_korean:
  - 그러나 그들은 그 말씀이 성취되기를 기대합니다
  - 그럼에도 그들은 그 말씀이 확인되기를 기다립니다
  - 그러나 그들은 그 말씀이 성립되기를 바랍니다
  lexicon: HALOT
  rationale: יִחל의 ‘기다리다/희망하다’와 קיים דָּבָר의 ‘말씀이 이루어지다’ 의미를 함께 살려, 자기 예언의 성취를 기대하는 뉘앙스를 반영했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 본문은 신명기적 예언 공식에서 하나님의 고유 이름을 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 유지해 이름-호칭의 구별을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 거짓 예언자들이 실제 예언 공식을 도용하는 아이러니
  chosen_reading: 예언 공식은 그대로 두고, 주체가 야훼께서 보내신 자들이 아님을 분명히 함
  alternative_readings:
  - 공식을 풀어서 ‘하나님이 말씀하십니다’로 완화
  - 아이러니를 줄여 자연스러운 서술로 변환
  rationale: ‘야훼의 선언입니다’라는 공식을 유지해야, 권위 있는 예언 언어를 빌려 쓰는 거짓 예언의 죄성이 본문에서 드러납니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
