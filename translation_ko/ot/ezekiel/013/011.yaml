source:
  edition: WLC
  text: אֱמֹ֛ר אֶל טָחֵ֥י תָפֵ֖ל וְ/יִפֹּ֑ל הָיָ֣ה גֶּ֣שֶׁם שׁוֹטֵ֗ף וְ/אַתֵּ֜נָה אַבְנֵ֤י אֶלְגָּבִישׁ֙ תִּפֹּ֔לְנָה וְ/ר֥וּחַ סְעָר֖וֹת תְּבַקֵּֽעַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/011.yaml
  text: Tell those who plaster it with whitewash that it will fall[a]. There will be a flooding rain, and you, O hailstones, will fall[b], and a windstorm will break it open.
  footnotes:
  - marker: a
    text: Hebrew literally, 'you, hailstones, will fall,' directly addressing the hailstones for vivid effect.
    reason: lexical_alternative
  - marker: b
    text: Or 'a torrential rain' for 'a flooding rain.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 회칠한 자들에게 말하여, 그것이 무너질 것이라고 하십시오. 폭우가 쏟아질 것이며, 너희, 우박은 떨어질 것이고, 폭풍이 그것을 갈라 놓을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘너희, 우박은 떨어질 것이다’처럼 우박에 직접 말을 거는 표현입니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘폭우’보다 더 넓게 ‘넘쳐 흐르는 비’ 또는 ‘쏟아붓는 비’의 느낌이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָחֵי תָפֵל
  english_pob_choice: those who plaster it with whitewash
  chosen_korean: 회칠한 자들
  alternatives_korean:
  - 흰 회를 바른 자들
  - 백칠을 한 자들
  - 백회로 바른 자들
  lexicon: HALOT
  rationale: טָחֵי는 ‘바르다/칠하다’의 분사이고 תָפֵל은 여기서 겉치레의 얇은 덧칠을 가리키므로, 한국어에서는 관용적이면서도 속임수의 뉘앙스를 살리는 ‘회칠한 자들’이 가장 자연스럽습니다.
- source_word: וְיִפֹּל
  english_pob_choice: that it will fall
  chosen_korean: 그것이 무너질 것이라고
  alternatives_korean:
  - 그것이 떨어질 것이라고
  - 그것이 넘어질 것이라고
  lexicon: HALOT
  rationale: 문맥상 대상은 앞선 벽이므로, 단순한 ‘떨어지다’보다 구조물의 붕괴를 드러내는 ‘무너지다’가 원문의 힘을 더 잘 살립니다.
- source_word: גֶּשֶׁם שׁוֹטֵף
  english_pob_choice: a flooding rain
  chosen_korean: 폭우
  alternatives_korean:
  - 범람하는 비
  - 쏟아지는 비
  - 거센 폭우
  lexicon: HALOT
  rationale: שׁוֹטֵף는 넘쳐흐르며 휩쓸어 가는 성격을 띠므로, 현대 한국어에서 자연스럽고 파괴력을 잘 드러내는 ‘폭우’로 옮겼습니다.
- source_word: וְאַתֵּנָה אַבְנֵי אֶלְגָּבִישׁ תִּפֹּלְנָה
  english_pob_choice: and you, O hailstones, will fall
  chosen_korean: 너희, 우박은 떨어질 것이고
  alternatives_korean:
  - 너희 우박아, 떨어질 것이고
  - 우박은 떨어질 것이고
  lexicon: HALOT
  rationale: 히브리어는 우박에 직접 호칭을 던지는 수사적 인격화를 쓰지만, 한국어에서는 ‘너희, 우박’으로 옮겨 그 긴장을 살리되 과도하게 어색하지 않게 했습니다.
- source_word: וְרוּחַ סְעָרֹות
  english_pob_choice: a windstorm
  chosen_korean: 폭풍
  alternatives_korean:
  - 폭풍우
  - 광풍
  - 폭풍 바람
  lexicon: HALOT
  rationale: סְעָרֹות는 격렬한 폭풍성 바람을 가리키므로, 한국어에서는 시각적·청각적 파괴력을 포괄하는 ‘폭풍’이 가장 간결합니다.
theological_decisions:
- issue: 우박에 대한 직접 호칭의 인격화
  chosen_reading: 우박을 실제 인격 대상으로 부르는 수사적 직접화로 살렸습니다.
  alternative_readings:
  - 단순히 ‘우박이 떨어질 것이고’라고 평서화함
  - ‘우박아’로 강하게 의인화함
  rationale: 원문은 אַתֵּנָה를 사용해 우박에 직접 말을 거는 충격 효과를 줍니다. 한국어는 그 효과를 보존하되, 예언적 어조에 어울리도록 지나치게 구어적인 형태는 피했습니다.
  doctrine_reference: 예언서의 심판 수사와 문학적 의인화
