theological_decisions:
- issue: 예언자적 책망의 군사-성벽 은유 유지
  chosen_reading: ‘무너진 곳’, ‘담을 쌓다’, ‘전투’의 구체적 이미지를 그대로 보존했습니다.
  alternative_readings:
  - 이스라엘을 보호하지 못했습니다
  - 심판에 대비하지 못했습니다
  rationale: 본문은 거짓 예언자들을 성벽 수리와 방어 실패의 이미지로 책망하므로, 그 은유를 풀어쓰지 않고 유지해야 본문의 힘이 살아납니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ‘야훼의 날’의 종말론적 표현
  chosen_reading: ‘야훼의 날’로 직역하여 예언서의 고유한 심판 표현을 살렸습니다.
  alternative_readings:
  - 주님의 날
  - 여호와의 날
  rationale: 이 표현은 단순한 시간표현이 아니라 야훼의 심판 행위를 가리키는 예언적 관용구이므로, 고유명사와 결합된 형태를 유지하는 편이 문맥상 더 정확합니다.
  doctrine_reference: 'Contested terms table: יְהוָה YHWH'
