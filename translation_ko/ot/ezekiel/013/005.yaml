base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/005.yaml
  text: You have not gone up into the breaches or built up a wall for the house of Israel[a], so that it might stand in the battle on the day of Yahweh.
  footnotes:
  - marker: a
    text: Or 'into the gaps.' The Hebrew refers to breaches in a wall, continuing the defensive imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 무너진 곳으로 올라가지도 않았고, 이스라엘 집을 위해 담을 쌓지도 않아서, 그것이 전투의 날, 야훼의 날에 서 있을 수 없게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘틈으로’. 히브리어는 성벽의 무너진 틈을 가리키며, 계속되는 방어 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלִיתֶם
  english_pob_choice: gone up
  chosen_korean: 올라가지도 않았고
  alternatives_korean:
  - 무너진 곳으로 올라가지도 않았고
  - 들어가지도 않았고
  lexicon: HALOT
  rationale: עלה의 기본 뜻인 ‘올라가다’를 살리되, 문맥상 성벽의 무너진 곳으로 올라가 방어에 나서는 행동을 한국어로 자연스럽게 옮겼습니다.
- source_word: בַּפְּרָצוֹת
  english_pob_choice: into the breaches
  chosen_korean: 무너진 곳
  alternatives_korean:
  - 틈으로
  - 허물어진 곳으로
  - 무너진 틈으로
  lexicon: HALOT
  rationale: בַּפְּרָצוֹת는 성벽의 ‘틈/허물어진 곳’을 가리키므로, 방어 이미지가 드러나도록 ‘무너진 곳’으로 옮겼습니다.
- source_word: וַתִּגְדְּרוּ גָדֵר
  english_pob_choice: built up a wall
  chosen_korean: 담을 쌓지도 않았고
  alternatives_korean:
  - 성벽을 보수하지도 않았고
  - 담을 고치지도 않았고
  - 울타리를 만들지도 않았고
  lexicon: HALOT
  rationale: 동사-명사 결합이 강조하는 ‘가로막는 방어 구조를 세우는 것’을 한국어의 ‘담을 쌓다’로 옮겨 방어적 은유를 유지했습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘의 집
  - 이스라엘 백성
  lexicon: HALOT
  rationale: בית ישראל의 직역성을 살리면서도 한국어 문장 안에서 자연스러운 표현인 ‘이스라엘 집’을 택했습니다.
- source_word: בַּמִּלְחָמָה
  english_pob_choice: in the battle
  chosen_korean: 전투의 날
  alternatives_korean:
  - 전투에서
  - 전쟁에서
  - 전쟁의 날
  lexicon: HALOT
  rationale: 문맥상 단순한 상태가 아니라 맞닥뜨리는 결전의 상황을 가리키므로 ‘전투’로 옮기되, 뒤의 ‘야훼의 날’과 평행을 이루게 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 공유된 용어 기준에 따라 하나님의 고유명사 יְהוָה는 칭호인 ‘주’가 아니라 음역형 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 예언자적 책망의 군사-성벽 은유 유지
  chosen_reading: ‘무너진 곳’, ‘담을 쌓다’, ‘전투’의 구체적 이미지를 그대로 보존했습니다.
  alternative_readings:
  - 이스라엘을 보호하지 못했습니다
  - 심판에 대비하지 못했습니다
  rationale: 본문은 거짓 예언자들을 성벽 수리와 방어 실패의 이미지로 책망하므로, 그 은유를 풀어쓰지 않고 유지해야 본문의 힘이 살아납니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ‘야훼의 날’의 종말론적 표현
  chosen_reading: ‘야훼의 날’로 직역하여 예언서의 고유한 심판 표현을 살렸습니다.
  alternative_readings:
  - 주님의 날
  - 여호와의 날
  rationale: 이 표현은 단순한 시간표현이 아니라 야훼의 심판 행위를 가리키는 예언적 관용구이므로, 고유명사와 결합된 형태를 유지하는 편이 문맥상 더 정확합니다.
  doctrine_reference: 'Contested terms table: יְהוָה YHWH'
