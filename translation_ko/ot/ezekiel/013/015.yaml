  to: 그러므로 내가 그 벽과 그것에 흰 칠을 한 자들에게 내 분노를 다 쏟겠습니다. 그리고 내가 여러분에게 말하겠습니다. “그 벽은 더 이상 없고, 그것에 흰 칠을 한 자들도 더 이상 없습니다.”[a]
