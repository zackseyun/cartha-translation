id: EZK.13.15
reference: Ezekiel 13:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִלֵּיתִ֤י אֶת חֲמָתִ/י֙ בַּ/קִּ֔יר וּ/בַ/טָּחִ֥ים אֹת֖/וֹ תָּפֵ֑ל וְ/אֹמַ֤ר לָ/כֶם֙ אֵ֣ין הַ/קִּ֔יר וְ/אֵ֖ין הַ/טָּחִ֥ים אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/015.yaml
  text: So I will spend my wrath against the wall and against those who plastered it with whitewash[a], and I will say to you, ‘The wall is no more, and those who plastered it are no more,’
  footnotes:
  - marker: a
    text: Or 'with untempered mortar.' The Hebrew term can refer to a superficial or inferior coating; 'whitewash' best fits the imagery in context, while the traditional rendering is preserved here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 그 벽과 그것에 흰 칠을 한 자들에게 내 분노를 다 쏟겠습니다. 그리고 내가 여러분에게 말하겠습니다. “그 벽은 더 이상 없고, 그것에 흰 칠을 한 자들도 더 이상 없습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘흰 칠’로 옮긴 히브리어는 여기서 표면에 바르는 피상적이거나 질 낮은 덧칠을 가리킬 수 있습니다. ‘회칠’ 또는 전통적으로 ‘혼합하지 않은 회반죽’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלֵּיתִ֤י אֶת חֲמָתִ/י֙
  english_pob_choice: So I will spend my wrath
  chosen_korean: 그러므로 내가 내 분노를 쏟아붓겠습니다
  alternatives_korean:
  - 내 진노를 다하겠습니다
  - 내 분노를 소비하겠습니다
  - 내 분노를 끝내겠습니다
  lexicon: HALOT
  rationale: כלה의 ‘완전히 다하다/끝내다’와 חמה의 심판적 분노를 자연스러운 현대 한국어로 옮기기 위해 ‘쏟아붓다’를 택했습니다. 이는 분노를 표출한다는 예언적 이미지를 살리면서도 과도한 해석은 피합니다.
- source_word: בַּקִּיר
  english_pob_choice: against the wall
  chosen_korean: 그 벽과
  alternatives_korean:
  - 그 벽에
  - 그 벽을 향해
  lexicon: HALOT
  rationale: 히브리어 ב는 여기서 심판의 대상임을 드러내므로, 한국어에서는 동반되는 대상 표지 ‘-과’로 옮겨 심판의 방향성을 살렸습니다.
- source_word: וּבַטָּחִים אֹת֖וֹ תָּפֵ֑ל
  english_pob_choice: and against those who plastered it with whitewash
  chosen_korean: 그 벽에 흰 칠을 한 자들에게
  alternatives_korean:
  - 그 벽을 흰 칠로 바른 자들에게
  - 그 벽을 백회로 바른 자들에게
  - 그 벽을 회칠한 자들에게
  lexicon: HALOT
  rationale: טוח의 ‘바르다/칠하다’를 현대 문맥에 맞게 ‘흰 칠을 하다’로 옮겼습니다. POB의 ‘whitewash’처럼, 허술한 표면 덧칠의 이미지를 유지합니다.
- source_word: וְאֹמַר לָכֶם
  english_pob_choice: and I will say to you
  chosen_korean: 그리고 내가 여러분에게 말하겠습니다
  alternatives_korean:
  - 그리고 내가 너희에게 말하겠습니다
  - 그때 내가 여러분에게 말하겠습니다
  lexicon: HALOT
  rationale: 예언 خطاب의 직접성을 살리되, 현대 한국어 청중에게는 정중한 복수 대명사 ‘여러분’을 사용했습니다. 합쇼체 서술과도 어울리도록 조정했습니다.
theological_decisions:
- issue: 벽과 흰 칠의 비유를 본문에서 풀어쓸지 여부
  chosen_reading: 비유를 본문 안에서 설명하지 않고, 심판의 선언 자체를 이미지로 유지했습니다.
  alternative_readings:
  - 거짓 예언자와 속임수를 본문에 직접 드러내어 풀어쓰기
  - 의미를 해설적으로 확장해 ‘거짓 평강’까지 명시하기
  rationale: 문맥이 비유의 의미를 밝혀 주지만, 이 절 자체는 이미지로 된 심판 선언입니다. 본문 수준의 표현을 유지하는 편이 예언 문체와 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
