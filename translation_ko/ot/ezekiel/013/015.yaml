    rationale: ‘없어졌고’도 문맥상 가능하지만, 반복되는 אֵין의 현존 부정과 결과 선언을 ‘더 이상 없고’로 옮기면 원문의 평행법을 더 잘 보존합니다.
  - severity: medium
    issue: 각주가 논쟁적 어휘의 의미를 지나치게 단정하고 해설을 덧붙임
