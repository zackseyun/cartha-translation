    text: 직역하면 ‘그들의 마음의 예언자들’ 또는 ‘그들의 마음에서 나온 예언자들’입니다. 이 관용구는 그들의 예언이 야훼에게서가 아니라 그들 자신의 내면에서 비롯됨을 뜻합니다.
    reason: lexical_alternative
