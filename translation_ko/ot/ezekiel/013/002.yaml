id: EZK.13.2
reference: Ezekiel 13:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֶּן אָדָ֕ם הִנָּבֵ֛א אֶל נְבִיאֵ֥י יִשְׂרָאֵ֖ל הַ/נִּבָּאִ֑ים וְ/אָֽמַרְתָּ֙ לִ/נְבִיאֵ֣י מִ/לִּבָּ֔/ם שִׁמְע֖וּ דְּבַר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/002.yaml
  text: Son of man[a], prophesy against the prophets of Israel who are prophesying, and say to those who prophesy from their own hearts, ‘Hear the word of Yahweh.’
  footnotes:
  - marker: a
    text: Or more literally, 'to the prophets of their own heart.' The Hebrew idiom means they speak from themselves rather than from the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 예언하고 있는 이스라엘의 예언자들을 거슬러 예언하여라. 또 자기 마음에서 예언하는 예언자들[a]에게 말하여라. ‘야훼의 말씀을 들으십시오.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 마음의 예언자들’ 또는 ‘그들의 마음에서 나온 예언자들’입니다. 이 관용구는 그들의 예언이 야훼에게서가 아니라 그들 자신의 내면에서 비롯됨을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서에서 반복되는 신적 호칭을 살리기 위해 직역적이고 문학적인 ‘인자야’를 사용했습니다.
- source_word: הִנָּבֵא אֶל
  english_pob_choice: prophesy against
  chosen_korean: …을 향하여 예언하고
  alternatives_korean:
  - …에 대하여 예언하고
  - …을 거슬러 예언하고
  lexicon: HALOT
  rationale: 문맥상 심판의 예언이므로 한국어에서는 ‘향하여 예언하다’로 맞추어 대립적 방향성을 드러냈습니다.
- source_word: לִנְבִיאֵי מִלִּבָּם
  english_pob_choice: those who prophesy from their own hearts
  chosen_korean: 자기 마음에서 예언하는 자들
  alternatives_korean:
  - 자기 마음의 예언자들
  - 자기 마음에서 나오는 예언을 하는 자들
  lexicon: HALOT
  rationale: 히브리어 관용구가 ‘마음에서 나온다’는 자기 기원성을 뜻하므로, ‘자기 마음에서 예언하는 자들’로 옮겨 내적 근원을 분명히 했습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 야훼의 말씀을
  lexicon: HALOT
  rationale: 예언 문맥의 고정 표현인 ‘말씀’을 유지하고, יהוה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 예언 대상의 적대적 방향성
  chosen_reading: ‘향하여 예언하고’로 처리해 심판 선포의 대립성을 드러냈습니다.
  alternative_readings:
  - ‘에게 예언하고’
  - ‘대하여 예언하고’
  rationale: 히브리어 אֶל은 이 문맥에서 단순한 ‘~에게’보다 대항적 뉘앙스를 띠므로, 한국어에서도 그 긴장을 보존하는 번역이 적절합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy and context-sensitive equivalence'
- issue: ‘마음’의 영적/인지적 중심 의미
  chosen_reading: ‘자기 마음에서 예언하는 자들’로 번역해, 자기 내부에서 나온 메시지라는 대조를 살렸습니다.
  alternative_readings:
  - ‘자기 생각에서 예언하는 자들’
  - ‘자기 뜻대로 예언하는 자들’
  rationale: 히브리어 ‘마음’은 사고와 의지를 포괄하지만, 여기서는 야훼에게서 받지 않은 자기 기원을 강조하므로 ‘마음’을 유지하는 것이 본문 대비를 가장 잘 보존합니다.
  doctrine_reference: Preserve Hebrew idiom while keeping the prophetic contrast clear
