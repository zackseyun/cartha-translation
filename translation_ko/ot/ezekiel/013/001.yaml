  - 주님
  rationale: 본문이 예언자적 계시의 주체를 단순한 칭호가 아니라 언약적 고유명으로 드러내므로, POB의 원칙에 따라 대체 호칭을 쓰지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
