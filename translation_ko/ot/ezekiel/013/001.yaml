lexical_decisions:
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언자적 관용구인 “야훼의 말씀”을 살리기 위해, 영어의 “the word”에 해당하는 개념을 한국어 성경 문체에 자연스러운 “말씀”으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 히브리어 고유명사 יְהוָה를 전통적 대치어가 아니라 음역인 “야훼”로 옮겨, 본문이 지닌 하나님의 이름을 보존했습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 내게로
  - 나에게
  lexicon: HALOT
  rationale: 예언자에게 향하는 방향을 평이하고 현대적인 종결형 문맥에 맞게 “내게”로 표현했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시며
  - 말하여
  lexicon: HALOT
  rationale: 히브리어의 인용 도입 관용구를 한국어에서 가장 자연스럽게 받기 위해, 앞의 “임하여”와 함께 “말씀하셨습니다”로 마무리했습니다.
theological_decisions:
- issue: YHWH의 한국어 처리
  chosen_reading: 본문에서 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
