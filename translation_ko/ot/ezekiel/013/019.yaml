  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, 대가를 받고 행한 일, 생사 판정의 전도, 거짓을 듣는 백성이라는 문장 관계를 분명히 합니다.
  terminology: חלל은 ‘욕되게 하였습니다’로, נְפָשׁוֹת는 문맥상 인간을 뜻하는 ‘사람들’로 옮기는 것이 적절합니다. ‘빵’은 לֶחֶם의 일반적 의미를 보존합니다.
