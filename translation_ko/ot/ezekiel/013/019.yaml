  to: 너희가 보리 한 줌과 빵 몇 조각을 받고[a] 내 백성 가운데서 나를 욕되게 하였으며, 죽지 않아야 할 사람들을[b] 죽이고 살지 않아야 할 사람들을 살리며, 거짓을 듣는 내 백성에게 너희의 거짓말로 그렇게 하였습니다.
  rationale: ‘속량’이라는 중대한 의미 오역을 원문의 ‘욕되게 하다’로 바로잡고, 거짓을 듣는 주체가 ‘내 백성’임을 회복했습니다. 대가의 표현은 ‘받고’로 자연스럽게 드러내되 원문의 거래적 뉘앙스를 유지했습니다. 마지막의 ‘그렇게 하였습니다’는 앞의 죽이고 살리는 행위가 거짓말을 수단으로 이루어진다는 원문의 관계를 한국어에서 자연스럽게 연결합니다.
