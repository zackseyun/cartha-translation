  edition: WLC
  text: וַ/תְּחַלֶּלְ֨נָה אֹתִ֜/י אֶל עַמִּ֗/י בְּ/שַׁעֲלֵ֣י שְׂעֹרִים֮ וּ/בִ/פְת֣וֹתֵי לֶחֶם֒ לְ/הָמִ֤ית נְפָשׁוֹת֙ אֲשֶׁ֣ר לֹֽא תְמוּתֶ֔נָה וּ/לְ/חַיּ֥וֹת נְפָשׁ֖וֹת אֲשֶׁ֣ר לֹא תִֽחְיֶ֑ינָה בְּ/כַ֨זֶּבְ/כֶ֔ם לְ/עַמִּ֖/י שֹׁמְעֵ֥י כָזָֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/019.yaml
  text: And you have profaned me among my people for handfuls of barley and for pieces of bread[a], putting to death persons who should not die and keeping alive persons who should not live, by your lying to my people[b], who listen to lies.
  footnotes:
  - marker: a
    text: Or 'for morsels of bread.' The Hebrew refers to broken pieces or small portions, emphasizing the trivial payment for which they acted.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'souls' or 'lives' in both clauses; here rendered 'persons' to reflect the Hebrew idiom for human beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 보리 한 줌과 빵 몇 조각을 받고[a] 내 백성 가운데서 나를 욕되게 하였으며, 죽지 않아야 할 사람들을[b] 죽이고 살지 않아야 할 사람들을 살리며, 거짓을 듣는 내 백성에게 너희의 거짓말로 그렇게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 보리의 ‘한 줌’과 빵의 ‘조각들’ 또는 ‘작은 몫들’을 말하며, 그들이 받은 보상이 매우 하찮았음을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 두 절 모두 ‘생명들’ 또는 ‘영혼들’에 해당하는 표현을 사용합니다. 여기서는 인간 개인들을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחַלֶּלְנָה
  english_pob_choice: you have profaned
  chosen_korean: 나를 욕되게 하였습니다
  alternatives_korean:
  - 나를 더럽혔습니다
  - 나를 속되게 하였습니다
  lexicon: HALOT
  rationale: חלל의 핵심은 거룩함을 공적으로 훼손하여 ‘속되게/욕되게’ 만드는 것이므로, 한국어에서는 종교적-언약적 무게를 살리면서도 자연한 ‘욕되게 하였습니다’로 옮겼습니다.
- source_word: בְּשַׁעֲלֵי שְׂעֹרִים / וּבִפְתוֹתֵי לֶחֶם
  english_pob_choice: for handfuls of barley and for pieces of bread
  chosen_korean: 보리 한 줌과 떡 조각 몇 개 때문에
  alternatives_korean:
  - 보리 한 줌과 떡 몇 조각 때문에
  - 보리의 한 줌과 빵 조각 때문에
  lexicon: HALOT
  rationale: 두 표현은 값비싼 대가가 아니라 매우 하찮은 보상임을 드러내므로, ‘때문에’로 거래 관계를 살리고 ‘한 줌/조각 몇 개’로 경멸적 소량성을 드러냈습니다.
- source_word: לְהָמִית נְפָשׁוֹת … וּלְחַיּוֹת נְפָשׁוֹת
  english_pob_choice: putting to death persons ... keeping alive persons
  chosen_korean: 죽지 않아야 할 사람들을 죽이고, 살지 않아야 할 사람들을 살리며
  alternatives_korean:
  - 사람들을 죽이고, 사람들을 살리며
  - 죽어서는 안 될 사람들을 죽이고, 살아서는 안 될 사람들을 살리며
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 ‘영혼’이 아니라 인간 개인을 가리키므로 ‘사람들’로 옮겼고, POB의 판단적 대비를 따라 ‘죽지 않아야 할 / 살지 않아야 할’로 심판적 역전을 살렸습니다.
- source_word: בְּכַזֶּבְכֶם / שֹׁמְעֵי כָזָב
  english_pob_choice: by your lying ... who listen to lies
  chosen_korean: 너희가 내 백성에게 거짓말을 하여 거짓을 듣게 하는 자들에게
  alternatives_korean:
  - 너희 거짓으로 내 백성에게 거짓을 듣게 하는 자들에게
  - 너희의 거짓으로 내 백성이 거짓을 듣게 되게 하여
  lexicon: HALOT
  rationale: בְּכַזֶּבְכֶם은 수단을 나타내므로 ‘거짓말을 하여’로 처리했고, שֹׁמְעֵי כָזָב는 단순 청취가 아니라 거짓을 받아들이는 상태이므로 ‘거짓을 듣게 하는 자들’로 역동적으로 살렸습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역과 인간-생명 의미
  chosen_reading: ‘사람들’로 번역하여 구체적 인간 생명에 초점을 둠
  alternative_readings:
  - 영혼
  - 생명
  rationale: 본문의 נְפָשׁוֹת는 형이상학적 ‘영혼’보다 판단 아래 있는 인간 개인들을 가리키므로, 한국어에서는 오해를 줄이면서도 원문의 구체성을 살리는 ‘사람들’이 가장 적절합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 죽음/생명 절의 판단적 역전
  chosen_reading: ‘죽지 않아야 할 / 살지 않아야 할’로 심판의 역전을 표현
  alternative_readings:
  - 그들이 죽지 않을 / 살지 않을
  - 그들이 죽어서는 안 될 / 살아서는 안 될
  rationale: 문맥은 예언적 정죄로서 하나님이 정하신 마땅한 판결을 거꾸로 뒤집는 행위를 말하므로, 단순 미래 서술보다 판정적 의미가 드러나는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3
