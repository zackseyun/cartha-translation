translation:
  language: ko
  text: “이스라엘아, 너의 예언자들은 폐허 가운데의 여우들[a][b] 같았습니다.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자칼들’. 히브리어 단어는 보통 ‘여우들’로 옮기지만, 더 넓게 사막의 청소동물을 가리키는 말로 이해되기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘폐허들 가운데의’ 또는 ‘황폐한 곳의’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘있었습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשֻׁעָלִים
  english_pob_choice: Like foxes
  chosen_korean: “폐허 가운데 있는 여우들처럼”
  alternatives_korean:
  - “폐허들 가운데 있는 여우들처럼”
  - “황폐한 곳의 여우들처럼”
  - “자칼들처럼”
  lexicon: HALOT
  rationale: כְּ의 비교를 ‘처럼’으로 옮기고, שׁוּעָל은 기본 의미인 ‘여우’로 번역했습니다. POB의 ‘foxes among ruins’ 이미지를 살리되, 한국어에서는 뒤의 장소구를 자연스럽게 앞세워 표현했습니다.
- source_word: בָּחֳרָבוֹת
  english_pob_choice: among ruins
  chosen_korean: “폐허 가운데”
  alternatives_korean:
  - “폐허 안에”
  - “폐허들 가운데”
  - “황무지에”
  lexicon: HALOT
  rationale: ב의 위치 관계를 한국어에서는 ‘가운데’로 자연스럽게 풀어, 단순한 ‘안에’보다 황폐함 속을 배회하는 이미지를 더 분명히 했습니다.
- source_word: נְבִיאֶיךָ
  english_pob_choice: your prophets
  chosen_korean: “너의 예언자들도”
  alternatives_korean:
  - “너의 예언자들”
  - “네 예언자들도”
  - “너의 선지자들도”
  lexicon: HALOT
  rationale: 2인칭 소유를 분명히 살리면서, 전통적 교회어인 ‘선지자’보다 본문 직역성이 높은 ‘예언자’를 택했습니다. ‘도’는 비유 비교의 결론을 받는 문맥을 반영합니다.
- source_word: הָיוּ
  english_pob_choice: have been
  chosen_korean: “그러하였습니다”
  alternatives_korean:
  - “그렇습니다”
  - “있었습니다”
  - “되어 있었습니다”
  lexicon: HALOT
  rationale: 완료형의 상태적·결과적 뉘앙스를 한국어의 과거 서술로 옮기되, 단순 과거 사실보다 비유적 판정을 담는 문맥을 고려해 ‘그러하였습니다’로 처리했습니다.
theological_decisions:
- issue: 여우 비유의 평가를 본문 밖에서 ‘거짓’으로 명시할지 여부
  chosen_reading: 본문의 직접 표현을 따라 ‘예언자들’만 두고 ‘거짓’은 덧붙이지 않았습니다.
  alternative_readings:
  - “거짓 예언자들”
  rationale: 본문은 직접적으로 소유격 ‘너의 예언자들’이라 말할 뿐이므로, 이미 문맥상 비난이 분명하더라도 평가어를 추가하지 않고 source-direct하게 유지했습니다.
  doctrine_reference: '번역 원칙: 본문이 허용하는 것 이상으로 해석을 덧붙이지 않는다.'
