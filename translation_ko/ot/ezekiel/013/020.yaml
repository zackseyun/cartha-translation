  rationale: 원문의 난해한 구문을 특정 해석으로 과도하게 확정하지 않으면서, 여성 복수 행위자가 주술 물건을 사용해 사람들을 사냥한다는 기본 관계를 자연스러운 한국어로 드러냈습니다. ‘새처럼’은 영어 POB의 비유적 해석을 따르되 주석에서 히브리어의 정확한 구문이 난해함을 밝혔습니다. 표지는 각 관련 어휘에 직접 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:40:37Z'
