id: EZK.13.20
reference: Ezekiel 13:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֤י אֶל כִּסְּתוֹתֵי/כֶ֨נָה֙ אֲשֶׁ֣ר אַ֠תֵּנָה מְצֹדְד֨וֹת שָׁ֤ם אֶת הַ/נְּפָשׁוֹת֙ לְ/פֹ֣רְח֔וֹת וְ/קָרַעְתִּ֣י אֹתָ֔/ם מֵ/עַ֖ל זְרוֹעֹֽתֵי/כֶ֑ם וְ/שִׁלַּחְתִּי֙ אֶת הַ/נְּפָשׁ֔וֹת אֲשֶׁ֥ר אַתֶּ֛ם מְצֹדְד֥וֹת אֶת נְפָשִׁ֖ים לְ/פֹרְחֹֽת־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/020.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against your magic bands with which you hunt the lives there like birds, and I will tear them from your arms[c][b], and I will let the lives go free—the ones you hunt like birds.'
  footnotes:
  - marker: a
    text: Or 'your cushions' or 'your amulets'; the Hebrew term is rare and its exact referent is uncertain, likely some ritual object used by the prophetesses.
    reason: lexical_alternative
  - marker: b
    text: Literally 'to fly' or 'flying ones'; the Hebrew likely uses bird-hunting imagery for the people being ensnared.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'souls' or 'lives'; here the sense is people as living beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 하나님께서 이렇게 말씀하십니다. 보라, 내가 너희가 사람들의 생명을 그곳에서 새처럼 사냥하는 너희의 마술 띠들에 맞서고, 그것들을 너희 팔에서 찢어 내겠으며, 너희가 새처럼 사냥하는 생명들을 놓아주어 자유롭게 하겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 희귀어라 정확한 지시물이 확실하지 않으며, 문맥상 주술적 장신구나 도구를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘날게 하다’ 또는 ‘날아가는 것들’에 가깝지만, 문맥은 새 사냥 비유입니다.
    reason: lexical_alternative
  - marker: c
    text: 여기서 ‘영혼’보다 ‘생명’ 또는 ‘목숨’의 뜻으로 이해하는 것이 문맥에 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 하나님
  lexicon: HALOT
  rationale: 합성 호칭에서 אֲדֹנָי는 ‘주’, יְהוִה는 고유명 야훼의 공적 표기로 이해되어, 한국어에서는 자연스럽게 ‘주 하나님’으로 옮겨 두 요소를 함께 보존했습니다.
- source_word: כִּסְּתוֹתֵיכֶנָה
  english_pob_choice: your magic bands
  chosen_korean: 너희의 마술 띠들
  alternatives_korean:
  - 너희의 쿠션들
  - 너희의 부적들
  - 너희의 띠들
  lexicon: HALOT
  rationale: 희귀어라 정확한 물체 형상이 불확실하지만, 문맥상 사람을 포획하는 주술적 도구이므로 ‘마술 띠들’로 옮겨 기능을 드러냈습니다.
- source_word: מְצֹדְדוֹת
  english_pob_choice: you hunt
  chosen_korean: 사냥하는
  alternatives_korean:
  - 덫을 놓는
  - 포획하는
  lexicon: HALOT
  rationale: 동사 어근의 사냥/포획 이미지를 살려, 반복되는 새 사냥 비유가 한국어에서도 선명하게 드러나도록 했습니다.
- source_word: הַנְּפָשׁוֹת / נְפָשִׁים
  english_pob_choice: the lives ... the ones
  chosen_korean: 생명들
  alternatives_korean:
  - 영혼들
  - 사람들
  - 목숨들
  lexicon: HALOT
  rationale: 여기서 נֶפֶשׁ는 영혼 개념보다 살아 있는 사람 자체를 가리키므로, POB의 ‘lives’를 따라 ‘생명들’로 옮겼습니다.
- source_word: וְקָרַעְתִּי אֹתָם מֵעַל זְרוֹעֹתֵיכֶם
  english_pob_choice: and I will tear them from your arms
  chosen_korean: 그것들을 너희 팔에서 찢어 내겠으며
  alternatives_korean:
  - 그것들을 너희 팔에서 뜯어 내겠으며
  - 그것들을 너희 팔에서 빼앗아 내겠으며
  lexicon: HALOT
  rationale: 심판의 물리적 박탈 이미지를 살려, ‘찢어 내다’로 강한 어조를 유지했습니다.
theological_decisions:
- issue: נֶפֶשׁ을 한국어로 어떻게 드러낼지
  chosen_reading: ‘생명’으로 옮겨, 본문이 사람들을 사냥과 해방의 대상으로 말한다는 점을 살렸습니다.
  alternative_readings:
  - 영혼
  - 사람들
  rationale: 본문은 형이상학적 영혼론을 가르치기보다 실제 사람들의 생존을 말하므로, 생명이라는 표현이 원문과 POB의 해석을 가장 잘 반영합니다.
  doctrine_reference: 원문 우선 번역; 본문이 말하지 않는 인간론을 번역으로 덧씌우지 않음
- issue: 주 하나님 호칭의 처리
  chosen_reading: ‘주 하나님’으로 옮기되, 합성 호칭의 긴장감을 유지했습니다.
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 한국어 합쇼체 문맥에서 ‘주 하나님’이 אֲדֹנָי יְהוִה의 두 요소를 가장 자연스럽게 함께 드러내며, 전통적 표현을 무비판적으로 따르지 않으면서도 구분을 보존합니다.
  doctrine_reference: YHWH는 원칙적으로 야훼이나, 본문 내 아도나이와의 합성 호칭은 한국어 수용성을 고려한 예외 처리
