  chosen_korean: 속여
  alternatives_korean:
  - 길을 잘못 들게 하여
  - 미혹하여
  - 잘못 인도하여
  lexicon: WLC; HALOT
  rationale: 예언자적 맥락에서 단순한 정보 오류보다 언약 백성을 속여 그릇된 안전감으로 이끈 행위를 직접적으로 드러내는 말이 적절합니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 안녕
  - 화평
  lexicon: WLC; HALOT
  rationale: 예언서의 관용적 표현으로서 외적 평온과 온전함을 함께 담는 한국어 성경 용례를 따랐습니다.
- source_word: חַיִץ
  english_pob_choice: a wall
  chosen_korean: 담
  alternatives_korean:
