id: EZK.13.10
reference: Ezekiel 13:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַ֣עַן וּ/בְ/יַ֜עַן הִטְע֧וּ אֶת עַמִּ֛/י לֵ/אמֹ֥ר שָׁל֖וֹם וְ/אֵ֣ין שָׁל֑וֹם וְ/הוּא֙ בֹּ֣נֶה חַ֔יִץ וְ/הִנָּ֛/ם טָחִ֥ים אֹת֖/וֹ תָּפֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/010.yaml
  text: Because[a], yes, because they have led my people astray, saying, ‘Peace,’ when there is no peace, and when someone builds a wall, behold, they plaster it with whitewash.
  footnotes:
  - marker: a
    text: Or 'with untempered mortar.' The Hebrew term refers to a superficial plastering/coating; 'whitewash' conveys the image clearly in modern English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로, 참으로 그러므로 그들이 내 백성을 속여 ‘평강이 있다’고 말하면서도 평강이 없고, 어떤 사람이 담을 쌓으면 보십시오, 그들이 그것을 백칠로 바릅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘백칠’은 표면을 덮는 석회성 칠을 가리키며, 본문은 허술한 것을 겉으로 가리는 이미지를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן וּבְיַעַן
  english_pob_choice: Because, yes, because
  chosen_korean: 그러므로, 참으로 그러므로
  alternatives_korean:
  - 이는, 참으로 이는
  - 왜냐하면, 참으로 왜냐하면
  - 그러니, 참으로 그러니
  lexicon: WLC; HALOT
  rationale: 중첩된 인과 표현의 강조를 살리기 위해 단순한 단일 원인 접속보다 반복과 강조가 드러나도록 옮겼습니다.
- source_word: הִטְעוּ
  english_pob_choice: have led ... astray
  chosen_korean: 속여
  alternatives_korean:
  - 길을 잘못 들게 하여
  - 미혹하여
  - 잘못 인도하여
  lexicon: WLC; HALOT
  rationale: 예언자적 맥락에서 단순한 정보 오류보다 언약 백성을 속여 그릇된 안전감으로 이끈 행위를 직접적으로 드러내는 말이 적절합니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 안녕
  - 화평
  lexicon: WLC; HALOT
  rationale: 예언서의 관용적 표현으로서 외적 평온과 온전함을 함께 담는 한국어 성경 용례를 따랐습니다.
- source_word: חַיִץ
  english_pob_choice: a wall
  chosen_korean: 담
  alternatives_korean:
  - 벽
  - 가벽
  - 분벽
  lexicon: WLC; HALOT
  rationale: 문맥의 건축 이미지를 자연스럽게 살리면서도, 뒤의 백칠과 함께 허술한 구조라는 뉘앙스를 무리 없이 담을 수 있는 표현입니다.
- source_word: תָּפֵל
  english_pob_choice: with whitewash
  chosen_korean: 백칠로
  alternatives_korean:
  - 회칠로
  - 흰 석회로
  - 무른 회반죽으로
  lexicon: WLC; HALOT
  rationale: 직역하면 ‘백칠’이 문자적 이미지와 의도적 가림의 뉘앙스를 모두 살릴 수 있으며, 현대 독자에게도 이해 가능한 성경적 표현입니다.
theological_decisions:
- issue: ‘평강이 없다’는 예언적 반어의 유지
  chosen_reading: ‘평강이 있다’고 말하면서도 평강이 없고로 직역하여, 거짓 평강 선포의 반어를 그대로 드러냈습니다.
  alternative_readings:
  - ‘괜찮다’고 말하지만 사실 아무 문제가 없지 않다
  - ‘안전하다’고 말하지만 안전하지 않다
  rationale: 이 구절의 핵심은 백성에게 거짓 안심을 주는 예언적 허위 선언이므로, 의미를 완화하지 않고 대조 구조를 유지해야 합니다.
  doctrine_reference: 예언자적 심판과 거짓 평안에 대한 경고(겔 13장 문맥)
- issue: ‘whitewash’의 형상 유지
  chosen_reading: 비유를 해설하지 않고 백칠이라는 표면적 덮개 이미지를 유지했습니다.
  alternative_readings:
  - ‘겉만 번지르르하게 바른다’로 의역
  - ‘거짓으로 덮는다’로 해석적 번역
  rationale: 원문은 이 지점에서 해석보다 이미지를 제시하므로, 건축 비유의 날카로움을 보존하는 것이 우선입니다.
  doctrine_reference: '번역 원리: 본문 이미지 보존'
