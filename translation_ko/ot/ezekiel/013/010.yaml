  - 흰 석회로
  - 무른 회반죽으로
  lexicon: WLC; HALOT
  rationale: 직역하면 ‘백칠’이 문자적 이미지와 의도적 가림의 뉘앙스를 모두 살릴 수 있으며, 현대 독자에게도 이해 가능한 성경적 표현입니다.
theological_decisions:
- issue: ‘평강이 없다’는 예언적 반어의 유지
  chosen_reading: ‘평강이 있다’고 말하면서도 평강이 없고로 직역하여, 거짓 평강 선포의 반어를 그대로 드러냈습니다.
  alternative_readings:
  - ‘괜찮다’고 말하지만 사실 아무 문제가 없지 않다
  - ‘안전하다’고 말하지만 안전하지 않다
  rationale: 이 구절의 핵심은 백성에게 거짓 안심을 주는 예언적 허위 선언이므로, 의미를 완화하지 않고 대조 구조를 유지해야 합니다.
  doctrine_reference: 예언자적 심판과 거짓 평안에 대한 경고(겔 13장 문맥)
- issue: ‘whitewash’의 형상 유지
  chosen_reading: 비유를 해설하지 않고 백칠이라는 표면적 덮개 이미지를 유지했습니다.
  alternative_readings:
  - ‘겉만 번지르르하게 바른다’로 의역
  - ‘거짓으로 덮는다’로 해석적 번역
  rationale: 원문은 이 지점에서 해석보다 이미지를 제시하므로, 건축 비유의 날카로움을 보존하는 것이 우선입니다.
  doctrine_reference: '번역 원리: 본문 이미지 보존'
