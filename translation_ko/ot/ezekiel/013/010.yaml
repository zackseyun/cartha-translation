id: EZK.13.10
reference: Ezekiel 13:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַ֣עַן וּ/בְ/יַ֜עַן הִטְע֧וּ אֶת עַמִּ֛/י לֵ/אמֹ֥ר שָׁל֖וֹם וְ/אֵ֣ין שָׁל֑וֹם וְ/הוּא֙ בֹּ֣נֶה חַ֔יִץ וְ/הִנָּ֛/ם טָחִ֥ים אֹת֖/וֹ תָּפֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/010.yaml
  text: Because[a], yes, because they have led my people astray, saying, ‘Peace,’ when there is no peace, and when someone builds a wall, behold, they plaster it with whitewash.
  footnotes:
  - marker: a
    text: Or 'with untempered mortar.' The Hebrew term refers to a superficial plastering/coating; 'whitewash' conveys the image clearly in modern English.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 참으로 그들이 내 백성을 그릇된 길로 인도하여 ‘평강이 있다’고 말하지만 평강이 없기 때문입니다. 어떤 사람이 담을 쌓으면, 보십시오, 그들이 그것에 회칠을 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘섞지 않은 회반죽으로.’ 히브리어 낱말은 벽을 덮는 표면의 칠이나 바름을 가리키며, 정확한 재료에 대해서는 견해가 갈립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן וּבְיַעַן
  english_pob_choice: Because, yes, because
  chosen_korean: 그러므로, 참으로 그러므로
  alternatives_korean:
