  - 왜냐하면, 참으로 왜냐하면
  - 그러니, 참으로 그러니
  lexicon: WLC; HALOT
  rationale: 중첩된 인과 표현의 강조를 살리기 위해 단순한 단일 원인 접속보다 반복과 강조가 드러나도록 옮겼습니다.
- source_word: הִטְעוּ
