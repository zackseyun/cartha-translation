  - 분벽
  lexicon: WLC; HALOT
  rationale: 문맥의 건축 이미지를 자연스럽게 살리면서도, 뒤의 백칠과 함께 허술한 구조라는 뉘앙스를 무리 없이 담을 수 있는 표현입니다.
- source_word: תָּפֵל
  english_pob_choice: with whitewash
  chosen_korean: 백칠로
  alternatives_korean:
