source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וּ/בִקַּעְתִּ֥י רֽוּחַ סְעָר֖וֹת בַּֽ/חֲמָתִ֑/י וְ/גֶ֤שֶׁם שֹׁטֵף֙ בְּ/אַפִּ֣/י יִֽהְיֶ֔ה וְ/אַבְנֵ֥י אֶלְגָּבִ֖ישׁ בְּ/חֵמָ֥ה לְ/כָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/013.yaml
  text: 'Therefore thus says the Lord GOD: I will unleash a storm wind in my wrath[a], and there will be a flooding rain in my anger, and hailstones in fury to bring complete destruction.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'I will split open a wind of storms'; the sense is that God causes a violent storm wind to break forth.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. 내가 내 분노로 폭풍 바람을 터뜨리겠다. 내 진노로 폭우가 쏟아지고, 내 격분으로 우박이 내려 완전한 파멸을 일으킬 것이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내가 폭풍들의 바람을 갈라 터뜨리겠다’라고 합니다. 이는 하나님께서 거센 폭풍 바람이 터져 나오게 하신다는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 히브리어의 결합 호칭을 그대로 살리되, 본문에 직접 나온 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겨 중복 호칭의 긴장감을 보존했습니다.
- source_word: וּבִקַּעְתִּי רוּחַ סְעָרוֹת
  english_pob_choice: I will unleash a storm wind
  chosen_korean: 폭풍의 바람을 일으키고
  alternatives_korean:
  - 폭풍의 바람을 터뜨리고
  - 폭풍의 바람을 풀어놓고
  - 폭풍우의 바람을 일으키고
  lexicon: HALOT
  rationale: ‘벗겨 열다/갈라 열다’의 직역보다, 바람이 밖으로 터져 나오게 하시는 하나님의 능동적 행위를 한국어에서 자연스럽게 드러내기 위해 ‘일으키다’를 택했습니다.
- source_word: גֶּשֶׁם שֹׁטֵף
  english_pob_choice: a flooding rain
  chosen_korean: 쏟아지는 비
  alternatives_korean:
  - 범람하는 비
  - 홍수 같은 비
  - 쏟아붓는 비
  lexicon: HALOT
  rationale: ‘흐르듯 넘쳐흐르는’ 강한 물살의 이미지를 한국어에서 간결하게 살리기 위해 ‘쏟아지는 비’로 옮겼습니다.
- source_word: וְאַבְנֵי אֶלְגָּבִישׁ
  english_pob_choice: and hailstones
  chosen_korean: 우박
  alternatives_korean:
  - 우박덩이
  - 큰 우박
  lexicon: HALOT
  rationale: 히브리어 표현은 본질적으로 우박을 가리키므로, 한국어에서는 일반적 어휘 ‘우박’으로 옮기되 문맥상 심판의 파괴성을 뒤의 수식으로 보강했습니다.
- source_word: לְכָלָה
  english_pob_choice: to bring complete destruction
  chosen_korean: 멸망을 이루는
  alternatives_korean:
  - 완전한 멸망을 가져오는
  - 철저한 파괴를 이루는
  - 완전한 파멸을 이루는
  lexicon: HALOT
  rationale: ‘끝장냄/소멸’의 총체성을 살리되, 한국어 문장 안에서 목적 성격을 자연스럽게 드러내기 위해 ‘멸망을 이루는’으로 다듬었습니다.
theological_decisions:
- issue: 하나님의 진노와 폭풍 심판의 반복 표현
  chosen_reading: ‘분노/진노/격분’의 삼중 반복을 유지해 심판의 점증을 살렸습니다.
  alternative_readings:
  - 세 표현을 하나의 ‘진노’로 평준화함
  - 감정 어휘를 줄여 문장을 매끈하게 함
  rationale: 본문은 서로 다른 어휘로 하나님의 파괴적 심판을 누적적으로 묘사하므로, 한국어도 의미 겹침을 지우지 않고 단계적 강도를 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 심판 신탁의 수사적 점증 보존
