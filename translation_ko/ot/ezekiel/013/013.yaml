  - 큰 우박
  lexicon: HALOT
  rationale: 히브리어 표현은 본질적으로 우박을 가리키므로, 한국어에서는 일반적 어휘 ‘우박’으로 옮기되 문맥상 심판의 파괴성을 뒤의 수식으로 보강했습니다.
- source_word: לְכָלָה
  english_pob_choice: to bring complete destruction
  chosen_korean: 멸망을 이루는
  alternatives_korean:
  - 완전한 멸망을 가져오는
  - 철저한 파괴를 이루는
  - 완전한 파멸을 이루는
  lexicon: HALOT
  rationale: ‘끝장냄/소멸’의 총체성을 살리되, 한국어 문장 안에서 목적 성격을 자연스럽게 드러내기 위해 ‘멸망을 이루는’으로 다듬었습니다.
theological_decisions:
- issue: 하나님의 진노와 폭풍 심판의 반복 표현
  chosen_reading: ‘분노/진노/격분’의 삼중 반복을 유지해 심판의 점증을 살렸습니다.
  alternative_readings:
  - 세 표현을 하나의 ‘진노’로 평준화함
  - 감정 어휘를 줄여 문장을 매끈하게 함
  rationale: 본문은 서로 다른 어휘로 하나님의 파괴적 심판을 누적적으로 묘사하므로, 한국어도 의미 겹침을 지우지 않고 단계적 강도를 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 심판 신탁의 수사적 점증 보존
