  source_fidelity: 주요 심판 이미지와 세 차례의 진노 표현은 잘 보존했습니다. 그러나 첫 동사 וּבִקַּעְתִּי는 하나님이 폭풍 바람을 터뜨리거나 몰아내시는 능동 행위이므로, 뒤의 ‘비가 있으며/우박이 있을 것입니다’와 한 문장으로 잇기보다 미래 동작으로 분명히 옮기는 편이 원문에 더 충실합니다. 또한 לְכָלָה의 완결적 파괴 의미는 ‘멸망을 이루는’보다 ‘완전한 파멸을 일으킬’로 더 명확히 드러납니다.
