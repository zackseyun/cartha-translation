    rationale: 히브리어 위협 공식은 미래 시제 약속이라기보다 ‘보라, 내가 너희를 대적한다’라는 현재적이고 선언적인 적대 표명입니다. ‘대적한다’가 이를 더 직접적으로 보존합니다.
  - severity: low
