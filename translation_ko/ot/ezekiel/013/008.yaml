source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֚עַן דַּבֶּרְ/כֶ֣ם שָׁ֔וְא וַ/חֲזִיתֶ֖ם כָּזָ֑ב לָ/כֵן֙ הִנְ/נִ֣י אֲלֵי/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/008.yaml
  text: 'Therefore thus says the Lord GOD: Because you have spoken falsehood and seen a lie[a], therefore behold, I am against you, declares the Lord GOD.'
  footnotes:
  - marker: a
    text: Hebrew 'Lord YHWH'; traditionally rendered 'the Lord GOD' to avoid the awkward English repetition 'Lord LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 하나님께서 이렇게 말씀하십니다. 너희가 거짓을 말하고 거짓된 환상을 보았으므로, 보라, 내가 너희를 대적하겠습니다—주 하나님께서 말씀하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이에
  - 그런 까닭에
  lexicon: HALOT
  rationale: 예언 심판 선언을 여는 인과 접속사로서, 앞뒤의 이유-결과 관계를 단정적으로 잇는 ‘그러므로’가 가장 자연스럽고 형식적입니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  lexicon: HALOT
  rationale: 히브리어의 주 칭호와 신명 결합을 한국어에서 중복 없이 전달하기 위해 ‘주 하나님’으로 옮겼습니다. POB의 영문처럼 관용적이면서도 신명칭을 지우지 않는 선택입니다.
- source_word: שָׁוְא / כָּזָב
  english_pob_choice: falsehood / a lie
  chosen_korean: 거짓을 말하고 거짓된 환상을 보았으므로
  alternatives_korean:
  - 허탄함을 말하고 거짓을 보았으므로
  - 헛된 것을 말하고 속임수를 보았으므로
  lexicon: HALOT
  rationale: 두 어휘가 예언자적 거짓을 병렬로 비난하므로, 하나는 발화의 허위성으로, 다른 하나는 환상의 내용이 거짓임을 드러내는 방식으로 구분해 살렸습니다.
- source_word: הִנְנִי אֲלֵיכֶם
  english_pob_choice: behold, I am against you
  chosen_korean: 보라, 내가 너희를 대적하겠습니다
  alternatives_korean:
  - 보라, 내가 너희를 향하겠습니다
  - 보라, 내가 너희 편에 서지 않겠습니다
  lexicon: HALOT
  rationale: 하나님의 적대적 임재 선포를 한국어로 직접적으로 드러내는 ‘대적하다’가 가장 정확하며, 예언체의 엄숙함을 유지합니다.
theological_decisions:
- issue: 아ֲדֹנָי יְהוִה의 한국어 처리
  chosen_reading: ‘주 하나님’으로 옮기고, 본문 안에서는 신명 자체를 따로 드러내지 않았습니다.
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 이 절의 표현은 존칭 칭호와 신명 결합식이라 한국어에서는 ‘주 하나님’이 가장 자연스럽고, 예언적 경고의 강도를 약화하지 않으면서도 중복을 피합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
