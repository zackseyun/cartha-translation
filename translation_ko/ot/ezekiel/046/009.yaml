  source_fidelity: 마지막 절의 כִּי נִכְחוֹ יֵצֵאוּ는 단지 ‘곧바로 나가다’라기보다 들어온 문과 맞은편에 있는 출구로 나아간다는 방향을 포함합니다. 초안의 각주 c가 이를 설명하지만, 본문에도 ‘맞은편’의 핵심 의미를 반영하는 편이 더 충실합니다. 또한 עַם הָאָרֶץ는 문맥상 특정한 ‘그 땅의 백성’으로 옮기는 것이 ‘이 땅’보다 지시 관계를 불필요하게 현대 독자 쪽으로 옮기지 않습니다.
  naturalness: 합쇼체 문체는 대체로 자연스럽습니다. 다만 절두의 ‘그리고’는 원문의 접속을 기계적으로 재현하여 한국어 성경 문장에서는 다소 불필요하며, 마지막 문장은 ‘그 문 맞은편으로 나가야 합니다’라고 하면 규례의 동선이 더 분명하고 자연스럽습니다.
  terminology: ‘야훼’, ‘정해진 때’, ‘예배하다’는 원문 및 제시된 번역 방침에 부합합니다. הִשְׁתַּחֲוֹת의 문자적 몸짓은 각주로 보완하되, 그 각주 표지는 ‘예배하는’에 붙여야 합니다.
