revisions:
- from: 그리고 이 땅의 백성이 정해진 때에 야훼 앞에 나아올 때에는, 북문으로 들어와 예배하는 이는 남문으로 나가야 하고, 남문으로 들어오는 이는 북문으로 나가야 합니다. 그는 들어온 문으로는 돌아가지 말고, 곧바로 나가야 합니다.[a][b][c]
  to: 그 땅의 백성이 정해진 때에 야훼 앞에 나아올 때, 북문으로 들어와 예배하는 이[a]는 남문으로 나가야 하고, 남문으로 들어오는 이는 북문으로 나가야 합니다. 그는 들어온 문으로 되돌아가지 말고, 그 문 맞은편으로 나가야 합니다.[b][c]
  rationale: 원문의 일반적 규례 형식과 야훼라는 신명 표기를 유지했습니다. ‘정해진 때’의 대안 각주는 해당 표현에 붙이고, 예배 행위의 문자적 대안은 ‘예배하는 이’에 붙였습니다. 마지막 규정은 ‘맞은편’이라는 원문의 공간적 의미를 본문에 반영하면서도, 단수 ‘그는’과 복수 동사의 일반적·포괄적 용법을 자연스러운 한국어 규례 문장으로 보존했습니다.
