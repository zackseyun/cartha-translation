  text: וּ/בְ/ב֨וֹא עַם הָ/אָ֜רֶץ לִ/פְנֵ֣י יְהוָה֮ בַּ/מּֽוֹעֲדִים֒ הַ/בָּ֡א דֶּרֶךְ שַׁ֨עַר צָפ֜וֹן לְ/הִֽשְׁתַּחֲוֺ֗ת יֵצֵא֙ דֶּרֶךְ שַׁ֣עַר נֶ֔גֶב וְ/הַ/בָּא֙ דֶּרֶךְ שַׁ֣עַר נֶ֔גֶב יֵצֵ֖א דֶּרֶךְ שַׁ֣עַר צָפ֑וֹנָ/ה לֹ֣א יָשׁ֗וּב דֶּ֤רֶךְ הַ/שַּׁ֨עַר֙ אֲשֶׁר בָּ֣א ב֔/וֹ כִּ֥י נִכְח֖/וֹ יצאו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/009.yaml
  text: And when the people of the land come before Yahweh at the appointed times[a], whoever enters by way of the north gate to worship shall go out by way of the south gate, and whoever enters by way of the south gate shall go out by way of the north gate. He shall not return by way of the gate through which he entered[c][b], but shall go out straight ahead.
  footnotes:
  - marker: a
    text: Or, 'at the appointed feasts' or 'at the festivals.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'to bow down' or 'to prostrate oneself.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'for opposite him/it they shall go out,' that is, they are to continue straight through and exit on the opposite side rather than leave by the gate through which they entered.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 땅의 백성이 정해진 때에 야훼 앞에 나아올 때, 북문으로 들어와 예배하는 이[a]는 남문으로 나가야 하고, 남문으로 들어오는 이는 북문으로 나가야 합니다. 그는 들어온 문으로 되돌아가지 말고, 그 문 맞은편으로 나가야 합니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘엎드려 경배하다’ 또는 ‘엎드려 절하다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정해진 절기에’ 또는 ‘절기 때에’입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그 맞은편으로 나가게 된다’입니다. 들어온 문으로 되돌아가지 않고 맞은편 출구로 나아가야 함을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם הָאָרֶץ
  english_pob_choice: the people of the land
  chosen_korean: 이 땅의 백성
  alternatives_korean:
  - 그 땅의 사람들
  - 땅의 백성
  lexicon: HALOT
  rationale: 성전 규례 문맥에서 일반 백성을 가리키는 관용적 표현으로, ‘이 땅의 백성’이 직역성과 자연스러움을 함께 살립니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 주 앞에
  - 여호와 앞에
  lexicon: HALOT
  rationale: 원문에 있는 신적 이름을 반영해 ‘야훼’를 유지하고, ‘앞에’로 하나님 임재 앞에 나아오는 예배적 의미를 살렸습니다.
- source_word: בַּמּוֹעֲדִים
  english_pob_choice: at the appointed times
  chosen_korean: 정해진 때에
  alternatives_korean:
  - 정한 절기에
  - 절기 때에
  lexicon: HALOT
  rationale: מוֹעֵד의 범위가 절기만이 아니라 정해진 시기 전체를 포함하므로, 문맥을 좁히지 않는 표현을 택했습니다.
- source_word: לְהִשְׁתַּחֲוֹת
  english_pob_choice: to worship
  chosen_korean: 예배하는
  alternatives_korean:
  - 엎드려 경배하는
  - 절하는
  lexicon: HALOT
  rationale: 어근은 문자적으로 엎드려 절하는 동작이지만, 성전 예배 규정에서는 예배 행위를 가리키므로 한국어에서는 ‘예배하다’가 가장 적절합니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 표기할지
  chosen_reading: 원문의 여호와/주가 아니라 ‘야훼’를 본문에 직접 표기했습니다.
  alternative_readings:
