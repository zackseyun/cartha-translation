  rationale: 이 구절은 יְהוָה를 직접 사용하므로, 프로젝트 기준에 따라 언약적 신적 이름을 가리는 전통적 치환보다 स्रोत 직역성을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
