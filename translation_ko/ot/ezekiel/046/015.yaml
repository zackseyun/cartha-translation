lexical_decisions:
- source_word: וְעשו / They shall provide
  english_pob_choice: They shall provide
  chosen_korean: 드려야 합니다
  alternatives_korean:
  - 바쳐야 합니다
  - 공급해야 합니다
  lexicon: עשה
  rationale: 제사 문맥에서 단순한 ‘제공’보다 제의적 봉헌의 행위를 드러내기 위해 ‘드리다’를 택했습니다. 영어 POB의 의무형 미래를 따라 ‘-해야 합니다’로 옮겼습니다.
- source_word: הַכֶּבֶשׂ
  english_pob_choice: the lamb
  chosen_korean: 어린양
  alternatives_korean:
  - 양새끼
  - 어린 양
  lexicon: כֶּבֶשׂ
  rationale: 제물로 드려지는 어린 양을 자연스럽고 성경적으로 분명하게 드러내는 표준 표현입니다.
- source_word: הַמִּנְחָה
  english_pob_choice: the grain offering
  chosen_korean: 곡식 제물
  alternatives_korean:
  - 소제
  - 곡식 예물
  lexicon: מִנְחָה
  rationale: 전통적 제사 용어 ‘소제’는 이해 장벽이 있어, 본문의 곡물성 제물 의미를 직접 드러내는 ‘곡식 제물’을 택했습니다.
- source_word: עוֹלַת תָּמִיד
  english_pob_choice: a regular burnt offering
  chosen_korean: 상번제
  alternatives_korean:
  - 늘 드리는 번제
  - 정규 번제
  lexicon: עֹלָה + תָּמִיד
  rationale: ‘번제’와 ‘항상/정기적’의 결합된 제의 용어가 본문 핵심이므로, 제사 체계에서 통용되는 ‘상번제’를 사용해 간결하게 옮겼습니다.
theological_decisions:
- issue: 제사 규정의 반복성과 규범성
  chosen_reading: ‘아침마다’와 ‘상번제’로 반복적이고 규범적인 제사 요구를 함께 드러냈습니다.
  alternative_readings:
  - ‘매일 아침’
  - ‘항상 드리는 번제’
  rationale: 히브리어의 בַּבֹּקֶר בַּבֹּקֶר는 반복성을 강조하므로, 시간 부사와 제의 용어를 함께 살려 규정의 지속성을 분명히 했습니다.
  doctrine_reference: 제사 규례/성전 예전 문맥
