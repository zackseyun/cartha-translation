id: EZK.46.2
reference: Ezekiel 46:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָ֣א הַ/נָּשִׂ֡יא דֶּרֶךְ֩ אוּלָ֨ם הַ/שַּׁ֜עַר מִ/ח֗וּץ וְ/עָמַד֙ עַל מְזוּזַ֣ת הַ/שַּׁ֔עַר וְ/עָשׂ֣וּ הַ/כֹּהֲנִ֗ים אֶת עֽוֹלָת/וֹ֙ וְ/אֶת שְׁלָמָ֔י/ו וְ/הִֽשְׁתַּחֲוָ֛ה עַל מִפְתַּ֥ן הַ/שַּׁ֖עַר וְ/יָצָ֑א וְ/הַ/שַּׁ֥עַר לֹֽא יִסָּגֵ֖ר עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/002.yaml
  text: And the prince shall enter by way of the porch of the gate from outside[a], and shall stand by the doorpost of the gate. Then the priests shall offer his burnt offering and his peace offerings, and he shall bow down in worship at the threshold of the gate. Then he shall go out, but the gate shall not be shut until evening.
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' for 'peace offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 통치자는 문 밖에서 그 문 현관을 통하여 들어와 그 문의 문기둥 곁에 설 것입니다. 제사장들은 그의 번제와 화목제를 드릴 것입니다. 그는 그 문의 문지방에서 엎드려 경배하고 나갈 것입니다. 그러나 그 문은 저녁까지 닫지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנָּשִׂיא
  english_pob_choice: the prince
  chosen_korean: 왕
  alternatives_korean:
  - 지도자
  - 통치자
  - 군주
  lexicon: HALOT
  rationale: 본문의 נָשִׂיא는 왕권을 단정하지 않지만, 문맥상 공적 권위자이므로 기본적으로 ‘왕’으로 옮길 수 있으나, 해석을 좁히지 않기 위해 본문에서는 ‘왕’ 대신 그냥 주어를 앞세운 서술로 처리했습니다.
- source_word: אוּלָם הַשַּׁעַר מִחוּץ
  english_pob_choice: the porch of the gate from outside
  chosen_korean: 문 밖에서 문 현관
  alternatives_korean:
  - 문 바깥의 현관
  - 문 외부의 현관
  - 문 바깥쪽 현관
  lexicon: HALOT
  rationale: אוּלָם은 건축적으로 ‘현관/주랑’의 뜻이므로, 한국어 성경체에서 자연스러운 ‘문 현관’으로 옮기고 מִחוּץ는 ‘문 밖에서’로 풀어 이동 경로를 살렸습니다.
- source_word: מְזוּזַת הַשַּׁעַר / מִפְתַּן הַשַּׁעַר
  english_pob_choice: the doorpost of the gate / the threshold of the gate
  chosen_korean: 문기둥 / 문 문설주
  alternatives_korean:
  - 문설주 / 문지방
  - 문기둥 / 문지방
  - 문둥지 / 문턱
  lexicon: HALOT
  rationale: מְזוּזָה와 מִפְתָּן은 각각 문기둥과 문설주/문지방 계열의 건축어이므로, 중복을 피하면서도 실제 구조를 드러내는 한국어로 구분해 옮겼습니다.
- source_word: עֹלָתוֹ / שְׁלָמָיו
  english_pob_choice: his burnt offering / his peace offerings
  chosen_korean: 그의 번제 / 그의 화목제
  alternatives_korean:
  - 그의 번제물 / 그의 화평제물
  - 그의 번제와 그의 화목제물
  - 그의 번제와 그의 화목제사
  lexicon: HALOT
  rationale: עֹלָה는 제물 명칭으로서 ‘번제’, שְׁלָמִים은 POB의 peace offerings에 맞춰 전통적으로 통용되는 ‘화목제’로 옮겨 제의적 범주를 분명히 했습니다.
- source_word: וְהִשְׁתַּחֲוָה
  english_pob_choice: he shall bow down in worship
  chosen_korean: 엎드려 경배한 뒤
  alternatives_korean:
  - 엎드려 예배한 뒤
  - 절하며 경배한 뒤
  - 몸을 굽혀 경배한 뒤
  lexicon: HALOT
  rationale: 동사는 단순한 내적 숭배보다 몸을 낮추는 행위를 포함하므로, ‘엎드려’와 ‘경배’의 결합으로 물리적·종교적 의미를 함께 살렸습니다.
theological_decisions:
- issue: 문이 저녁까지 닫히지 않는다는 규정의 기능
  chosen_reading: 본문의 절차적 규정을 그대로 살려, 특정 인물의 출입 후에도 성전문이 저녁까지 열려 있음을 말하는 것으로 옮겼습니다.
  alternative_readings:
  - 상징적으로 해석함
  - 문이 열려 있다는 의미를 완화함
  rationale: 이 절은 예언적 환상 속 성전 규례를 서술하므로, 상징적 의미를 미리 확정하지 않고 절차적 진술을 보존하는 것이 본문의 긴장을 가장 잘 유지합니다.
  doctrine_reference: 예언 환상 본문의 서술을 해석으로 과도하게 확정하지 않음
