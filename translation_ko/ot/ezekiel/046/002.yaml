revisions:
- from: 그리고 왕은 문 밖에서 문 현관의 길로 들어와 문기둥 곁에 서고, 제사장들은 그의 번제와 그의 화목제를 드릴 것입니다. 그가 문 문설주에서 엎드려 경배한 뒤 나가면, 문은 저녁까지 닫지 않을 것입니다.[a]
  to: 통치자는 문 밖에서 그 문 현관을 통하여 들어와 그 문의 문기둥 곁에 설 것입니다. 제사장들은 그의 번제와 화목제를 드릴 것입니다. 그는 그 문의 문지방에서 엎드려 경배하고 나갈 것입니다. 그러나 그 문은 저녁까지 닫지 않을 것입니다.
  rationale: 직함을 ‘통치자’로 고쳐 נָשִׂיא의 공적 권위는 전달하되 왕권을 단정하지 않았습니다. 이동 경로, 문기둥, 문지방을 각각 원문의 공간·건축 용어에 맞게 옮겼고, 제의 행위와 경배 및 퇴장의 순차성을 보존했습니다. 기존 각주는 수정된 본문의 의미를 위해 필요하지 않아 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:45:07Z'
review_pass:
  verdict: revise
  source_fidelity: ‘왕’은 히브리어 הַנָּשִׂיא 및 영어 POB의 ‘prince’가 의도적으로 남겨 둔 비(非)왕권적 모호성을 지나치게 좁힙니다. 또한 מִפְתַּן은 ‘문설주’가 아니라 문지방/문턱이며, 초안의 조건절 ‘나가면’은 연속되는 절차 서술을 조건으로 바꿉니다.
  naturalness: ‘문 현관의 길로’와 ‘문 문설주’는 현대 표준어에서 부자연스럽거나 건축 부위의 지시가 불명확합니다. ‘문 밖에서 그 문 현관을 통하여’ 및 ‘그 문의 문지방에서’가 자연스럽고 공간 관계를 보존합니다.
  terminology: נָשִׂיא는 ‘통치자’로 옮겨 왕이나 메시아로 단정하지 않았습니다. עֹלָה와 שְׁלָמִים은 각각 ‘번제’와 통용 제의어 ‘화목제’로 유지했습니다. מְזוּזָה는 ‘문기둥’, מִפְתָּן은 ‘문지방’으로 구별했습니다.
  issues:
  - severity: high
    issue: הַנָּשִׂיא를 ‘왕’으로 번역함
    rationale: 원문과 영어 POB는 이 직함을 왕으로 확정하지 않습니다. ‘왕’은 본문이 유보하는 신분 및 통치 형태를 해석적으로 좁힙니다.
  - severity: high
    issue: מִפְתַּן הַשַּׁעַר를 ‘문 문설주’로 번역함
    rationale: מִפְתָּן은 문설주(수직 기둥)가 아니라 문지방/문턱(입구의 아래 가로 부위)입니다. 원문의 건축 용어 구별이 바뀌었습니다.
  - severity: medium
    issue: ‘그가 … 나가면’이라는 조건절 처리
    rationale: וְהִשְׁתַּחֲוָה … וְיָצָא는 경배하고 나가는 순차적 절차를 말합니다. 조건절은 원문에 없는 조건 관계를 암시합니다.
  - severity: low
    issue: 기존 각주가 불필요하고 ‘문 현관’ 표현을 전제함
    rationale: 이 절의 번역상 핵심 대안은 ‘화목제’의 어휘 대안이며, 기존 각주는 원문의 의미상 쟁점을 설명하지 않습니다. 본문을 자연스럽게 고친 뒤에는 별도 각주가 필요하지 않습니다.
  revised_text: 통치자는 문 밖에서 그 문 현관을 통하여 들어와 그 문의 문기둥 곁에 설 것입니다. 제사장들은 그의 번제와 화목제를 드릴 것입니다. 그는 그 문의 문지방에서 엎드려 경배하고 나갈 것입니다. 그러나 그 문은 저녁까지 닫지 않을 것입니다.
