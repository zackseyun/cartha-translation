id: EZK.46.17
reference: Ezekiel 46:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי יִתֵּ֨ן מַתָּנָ֜ה מִ/נַּחֲלָת֗/וֹ לְ/אַחַד֙ מֵֽ/עֲבָדָ֔י/ו וְ/הָ֤יְתָה לּ/וֹ֙ עַד שְׁנַ֣ת הַ/דְּר֔וֹר וְ/שָׁבַ֖ת לַ/נָּשִׂ֑יא אַ֚ךְ נַחֲלָת֔/וֹ בָּנָ֖י/ו לָ/הֶ֥ם תִּהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/017.yaml
  text: But if he gives a gift from his inheritance to one of his servants[a], it shall belong to him until the year of liberty; then it shall return to the prince. Only his inheritance belongs to his sons; it shall be theirs.
  footnotes:
  - marker: a
    text: Or 'the year of release'; this likely refers to the Jubilee-type restoration year, though the Hebrew here says 'liberty' rather than using the usual term 'Jubilee.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그가 자신의 상속 재산 가운데서 자기 종들[a] 중 한 사람에게 선물을 주면, 그 선물은 해방의 해까지 그 사람에게 속하게 되며, 그 뒤에는 군주에게 돌아갑니다. 다만 그의 상속 재산은 그의 아들들에게만 속하여 그들의 것이 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노예’; 히브리어 עבד는 문맥에 따라 ‘종’ 또는 ‘노예’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 또 만일
  lexicon: HALOT
  rationale: 앞 절과의 대비를 살리면서 조건문을 자연스럽게 열기 위해 ‘그러나 만일’로 옮겼습니다.
- source_word: מִנַּחֲלָתוֹ
  english_pob_choice: from his inheritance
  chosen_korean: 자기 유산에서
  alternatives_korean:
  - 그의 상속 재산에서
  - 그의 소유에서
  lexicon: HALOT
  rationale: נחלה는 단순 소유보다 세습적 분배지를 가리키므로 ‘유산’이 법적·상속적 뉘앙스를 잘 보존합니다.
- source_word: לְאַחַד מֵעֲבָדָיו
  english_pob_choice: to one of his servants
  chosen_korean: 자기 종들 중 하나에게
  alternatives_korean:
  - 자기 노예들 중 하나에게
  - 자기 종 하나에게
  lexicon: HALOT
  rationale: 여기서는 bonded status 자체보다 가정 내 신하/종속 인물로서의 대비가 중심이므로, 본문 의미를 유지하면서도 문맥상 자연스러운 ‘종’으로 옮겼습니다.
- source_word: עַד שְׁנַת הַדְּרוֹר
  english_pob_choice: until the year of liberty
  chosen_korean: 자유의 해까지
  alternatives_korean:
  - 해방의 해까지
  - 희년까지
  lexicon: HALOT
  rationale: דְּרוֹר의 핵심 의미인 ‘해방/자유’를 살리기 위해 본문은 ‘자유의 해’로 직역에 가깝게 두고, 희년 해석은 본문 밖의 대안으로 남깁니다.
- source_word: וְשָׁבַת לַנָּשִׂיא
  english_pob_choice: then it shall return to the prince
  chosen_korean: 그 뒤에는 그것이 군주에게 돌아갈 것입니다
  alternatives_korean:
  - 그 뒤에는 그것이 지도자에게 돌아갈 것입니다
  - 그 뒤에는 그것이 왕에게 돌아갈 것입니다
  lexicon: HALOT
  rationale: נָשִׂיא는 에스겔의 성전 환상 문맥에서 통상 ‘군주/통치자’로 이해되므로, 왕보다 중립적인 ‘군주’를 택했습니다.
- source_word: נַחֲלָתוֹ
  english_pob_choice: his inheritance
  chosen_korean: 그의 유산
  alternatives_korean:
  - 그의 상속 재산
  - 그의 몫
  lexicon: HALOT
  rationale: 뒤 절에서 아들들에게 영속적으로 귀속되는 몫을 가리키므로 ‘유산’으로 한 번 더 일관되게 옮겨 상속성과 지속성을 드러냈습니다.
theological_decisions:
- issue: עֲבָדִים의 한국어 처리
  chosen_reading: 종
  alternative_readings:
  - 노예
  - 하인
  rationale: 본절은 토지 귀속 규정이 중심이지만, עבד의 종속적 신분은 약화할 수 없어서 ‘종’으로 번역했습니다. 이는 사회적 위계를 드러내면서도 본문의 법적 초점을 흐리지 않습니다.
  doctrine_reference: Translation philosophy §1; contested bonded-language guidance
- issue: דְּרוֹר의 처리
  chosen_reading: 자유의 해
  alternative_readings:
  - 해방의 해
  - 희년
  rationale: 본문이 일반적인 יוֹבֵל 대신 דְּרוֹר를 사용하므로, 본문에는 어휘 자체의 의미인 ‘자유’를 살렸습니다. ‘희년’은 해석상 가능하지만 원어의 직접 대응은 아닙니다.
  doctrine_reference: Translation philosophy §1 and source-primacy principle
