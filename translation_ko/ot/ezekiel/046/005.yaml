  text: 또 소제물은 숫양을 위하여 한 에바이며, 어린양들을 위하여[a]는 그가 드릴 수 있는 만큼의 소제물입니다.[b] 기름은 에바마다 한 힌입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사는 여기서 숫양과 어린양들에 배정되는 제물을 가리키며, ‘숫양과 함께’ 또는 ‘어린양들과 함께’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 손의 선물’이며, 곧 그가 드릴 수 있는 정도를 뜻하는 관용구입니다.
    reason: lexical_alternative
