theological_decisions:
- issue: לְ/לָ 표지가 제물의 배분 관계를 나타내는 방식
  chosen_reading: ‘숫양에게는’, ‘어린양들에게는’으로 자연스럽게 풀되, 제의 규정상 해당 동물에 배정되는 소제물의 분량이라는 점을 유지했습니다.
  alternative_readings:
  - ‘숫양을 위하여’
  - ‘숫양과 함께’
  - ‘숫양에 대하여’
  rationale: 본문의 ל 표지는 여기서 단순 목적뿐 아니라 배당/부속 관계를 나타낼 수 있으므로, 한국어에서는 의미를 지나치게 경직시키지 않는 방향이 적절합니다.
  doctrine_reference: 제의법 문맥의 전치사 용법
