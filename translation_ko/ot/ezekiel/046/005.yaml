  rationale: 에바는 고유한 건량 단위이므로 음역을 유지해 제의적 정확성을 보존합니다.
- source_word: מַתַּת יָד֑וֹ
  english_pob_choice: as much as his hand can give
  chosen_korean: 그가 손으로 드릴 수 있는 만큼
