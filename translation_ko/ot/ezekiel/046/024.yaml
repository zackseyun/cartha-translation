translation:
  language: ko
  text: 그가 제게 말했습니다. “이것들은[a] 성전의 봉사자들[b]이 그곳에서 백성의 희생제물을 삶는 부엌들입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “조리실들” 혹은 더 문자적으로 “삶는 자들의 집”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “성전의 종들” 또는 “성전의 시중드는 자들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית הַמְבַשְּׁלִים
  english_pob_choice: the kitchens
  chosen_korean: 부엌
  alternatives_korean:
  - 주방
  - 조리실
  - 삶는 방
  lexicon: HALOT
  rationale: 문맥상 성전 구역 안에 따로 마련된 조리 공간을 가리키므로, 현대 한국어에서 기능을 가장 자연스럽게 드러내는 ‘부엌’으로 옮겼습니다.
- source_word: מְבַשְּׁלִים / יְבַשְּׁלוּ
  english_pob_choice: shall boil
  chosen_korean: 삶는
  alternatives_korean:
  - 끓이는
  - 조리하는
  - 삶을
  lexicon: HALOT
  rationale: 같은 어근의 반복을 살려 제의적 준비 행위를 구체적으로 보이게 하려면 ‘삶다’가 가장 직접적입니다.
- source_word: מְשָׁרְתֵי הַבַּיִת
  english_pob_choice: the ministers of the temple
  chosen_korean: 성전의 일꾼들
  alternatives_korean:
  - 성전의 종들
  - 성전의 시중드는 자들
  - 성전의 봉사자들
  lexicon: HALOT
  rationale: 공적이고 제의적인 봉사자를 뜻하지만 한국어 ‘minister’는 오해를 부를 수 있어, 본문 기능을 살리면서도 위계적 뉘앙스를 과장하지 않는 ‘일꾼들’을 택했습니다.
- source_word: זֶבַח הָעָם
  english_pob_choice: the people's sacrifice
  chosen_korean: 백성의 제물
  alternatives_korean:
  - 백성의 희생제물
  - 백성의 제사
  - 백성이 드린 제물
  lexicon: HALOT
  rationale: זֶבַח은 단순한 ‘선물’이 아니라 도살을 동반한 제의적 제물을 가리키므로 ‘제물’이 적합하며, 속격 관계도 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 직접 인용문의 화자와 예언서의 서술 거리
  chosen_reading: 예언자에게 말을 건네는 장면을 살려, 인용부호 안의 지시문은 명령형이 아니라 설명문으로 유지했습니다.
  alternative_readings:
  - 직설적으로 ‘이것들은 부엌들입니다’로 처리
  - ‘이것들이 곧 부엌들입니다’로 처리
  rationale: 히브리어는 장소 식별을 하는 진술이므로, 한국어에서도 과도한 해석을 덧붙이지 않고 현장 설명의 성격을 보존하는 것이 적절합니다.
  doctrine_reference: 예언서 문맥의 서술 충실성
