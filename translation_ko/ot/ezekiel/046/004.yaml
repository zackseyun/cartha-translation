translation:
  language: ko
  text: 안식일에 통치자가 야훼께 드리는 번제물은 흠 없는 어린 숫양 여섯 마리와 흠 없는 숫양 한 마리입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
