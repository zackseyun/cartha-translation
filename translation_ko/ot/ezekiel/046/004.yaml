  text: וְ/הָ֣/עֹלָ֔ה אֲשֶׁר יַקְרִ֥ב הַ/נָּשִׂ֖יא לַֽ/יהוָ֑ה בְּ/י֣וֹם הַ/שַּׁבָּ֗ת שִׁשָּׁ֧ה כְבָשִׂ֛ים תְּמִימִ֖ם וְ/אַ֥יִל תָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/004.yaml
  text: And the burnt offering that the prince presents to Yahweh on the Sabbath day shall be six unblemished lambs and one unblemished ram[a].
  footnotes:
  - marker: a
    text: Or 'offers'; the Hebrew verb literally means 'brings near' in sacrificial usage.
    reason: lexical_alternative
translation:
  language: ko
  text: 안식일에 지도자가 야훼께 드리는 번제물은 흠 없는 어린 숫양 여섯 마리와 흠 없는 숫양 한 마리입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘드립니다’. 히브리어 동사는 제의 문맥에서 문자적으로는 ‘가까이 가져오다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹלָה
  english_pob_choice: And the burnt offering
  chosen_korean: 번제물
  alternatives_korean:
  - 번제
  - 불태움 제물
  lexicon: HALOT
  rationale: עֹלָה는 제의 문맥에서 표준적으로 ‘번제’를 뜻하므로, 한국어에서는 명사구로 자연스럽게 ‘번제물’이라 옮겨 제의적 의미를 분명히 했습니다.
- source_word: הַנָּשִׂיא
  english_pob_choice: the prince
  chosen_korean: 지도자
  alternatives_korean:
  - 왕자
  - 통치자
  - 군주
  lexicon: HALOT
  rationale: 에스겔의 성전 환상에서 נָשִׂיא는 왕이라기보다 공동체를 대표하는 통치적 인물을 가리키므로, 직역어 ‘왕자’보다 기능을 드러내는 ‘지도자’를 택했습니다.
- source_word: תְּמִימִם / תָּמִים
  english_pob_choice: unblemished
  chosen_korean: 흠 없는
  alternatives_korean:
  - 결점 없는
  - 완전한
  - 흠집 없는
  lexicon: HALOT
  rationale: 제사 규정의 תמים은 신체적 결함이 없는 상태를 뜻하므로, 제의적 용례에 맞는 관용적 표현인 ‘흠 없는’으로 일관되게 옮겼습니다.
- source_word: כְבָשִׂים / אַיִל
  english_pob_choice: lambs / ram
  chosen_korean: 어린 숫양 여섯 마리 / 숫양 한 마리
  alternatives_korean:
  - 어린 양 여섯 마리 / 숫양 한 마리
  - 양 여섯 마리 / 숫양 한 마리
  lexicon: HALOT
  rationale: כְבָשִׂים은 제의 목록에서 보통 ‘어린 양’ 계열을 가리키지만, 문맥상 숫양과 대비되는 제물의 종류를 분명히 하도록 ‘어린 숫양’으로 풀어 썼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 과업의 번역 규범에 따라 본문 원문의 언약명 יהוה를 일반 명칭 ‘주님’이 아니라 고유명 ‘야훼’로 유지해, 제의 규정 안에서 대상의 특수성을 드러냈습니다.
  doctrine_reference: 'Project glossary: YHWH → 야훼'
