  text: And the burnt offering that the prince presents to Yahweh on the Sabbath day shall be six unblemished lambs and one unblemished ram[a].
  footnotes:
  - marker: a
    text: Or 'offers'; the Hebrew verb literally means 'brings near' in sacrificial usage.
