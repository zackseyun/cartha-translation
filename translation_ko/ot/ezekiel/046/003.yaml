  source_fidelity: ‘עַם הָאָרֶץ’(그 땅의 백성)가 본문에서 단순히 ‘백성’으로 축약되어, 원문의 표현과 주변의 왕자·제사장과의 구별이 본문상 약화되었습니다. 이를 본문에 반영해야 합니다. 그 밖에는 ‘그 문’, 안식일·초하루, 야훼 앞이라는 핵심 요소가 충실히 반영되어 있습니다.
  naturalness: ‘안식일들에’, ‘초하루들에’처럼 복수 접미사를 그대로 옮긴 표현은 현대 한국어에서 다소 부자연스럽습니다. 반복되는 절기라는 뜻은 ‘안식일과 초하루에’로 자연스럽게 나타낼 수 있습니다. ‘문 어귀’도 가능하지만 ‘문 입구’가 현대 산문에서 더 평이합니다.
