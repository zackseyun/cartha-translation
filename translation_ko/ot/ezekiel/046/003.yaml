reference: Ezekiel 46:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִשְׁתַּחֲו֣וּ עַם הָ/אָ֗רֶץ פֶּ֚תַח הַ/שַּׁ֣עַר הַ/ה֔וּא בַּ/שַּׁבָּת֖וֹת וּ/בֶ/חֳדָשִׁ֑ים לִ/פְנֵ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/003.yaml
  text: And the people of the land shall bow down at the entrance of that gate[a], before Yahweh[b], on the Sabbaths and on the new moons.
  footnotes:
  - marker: a
    text: Or 'before Yahweh.' The Hebrew has the divine name יְהוָה.
    reason: alternative_reading
  - marker: b
    text: '''The people of the land'' likely refers to the lay population, in contrast to the prince and priests in the surrounding context.'
    reason: cultural_note
translation:
  language: ko
  text: 그 땅의 백성은 그 문 입구에서 안식일과 초하루에 야훼 앞에 엎드려 경배해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 땅의 백성’은 문맥상 왕자와 제사장에 대비되는 평민층을 가리킬 가능성이 큽니다.
    reason: cultural_note
  - marker: b
    text: 이 구절의 히브리어는 하나님의 이름 יְהוָה를 직접 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: וְהִשְׁתַּחֲו֣וּ
  english_pob_choice: shall bow down
  chosen_korean: 엎드려 경배해야 합니다
  alternatives_korean:
  - 절해야 합니다
  - 경배해야 합니다
  - 엎드려야 합니다
  lexicon: HALOT
  rationale: 히트파엘형은 몸을 낮추는 경배 행위를 가리키므로, 한국어에서는 동작성을 살린 ‘엎드려’와 예배성을 드러내는 ‘경배’의 결합이 가장 자연스럽습니다.
- source_word: עַם הָ/אָ֗רֶץ
  english_pob_choice: the people of the land
  chosen_korean: 백성
  alternatives_korean:
  - 그 땅의 백성
  - 그 땅의 사람들
  - 평민들
  lexicon: HALOT
  rationale: 문맥상 왕자와 제사장에 대비되는 일반 백성을 가리키므로, 너무 길지 않게 ‘백성’으로 옮기되 주석 없이도 대비가 드러나도록 했습니다.
- source_word: פֶּ֚תַח הַ/שַּׁ֣עַר הַ/ה֔וּא
  english_pob_choice: at the entrance of that gate
  chosen_korean: 그 문 어귀에서
  alternatives_korean:
  - 그 문 입구에서
  - 그 성문 어귀에서
  - 그 문 앞에서
  lexicon: HALOT
  rationale: פֶּתַח은 ‘어귀/입구’를 뜻하므로 공간적 위치를 살려 ‘문 어귀에서’로 옮겼습니다. ‘그’는 지시대명사의 특정성을 보존합니다.
- source_word: בַּ/שַּׁבָּת֖וֹת
  english_pob_choice: on the Sabbaths
  chosen_korean: 안식일들에
  alternatives_korean:
  - 안식일마다
  - 안식일에
  - 안식일들에
  lexicon: HALOT
  rationale: 복수형을 그대로 살려 반복되는 절기를 드러내되, 한국어에서는 자연스럽게 ‘안식일들에’로 옮겼습니다.
- source_word: וּ/בֶ/חֳדָשִׁ֑ים
  english_pob_choice: and on the new moons
  chosen_korean: 초하루들에
  alternatives_korean:
  - 초하루에
  - 새달들에
  - 월삭에
  lexicon: HALOT
  rationale: חדש은 달의 시작, 곧 새달 제의를 가리키므로 한국어 전통 용례와 성경적 관용을 함께 살려 ‘초하루들에’로 번역했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명 표기를 한국어 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 호칭이 아닌 고유한 언약 이름임을 드러냈습니다.
theological_decisions:
- issue: 예배 행위의 표현 방식
  chosen_reading: ‘엎드려 경배해야 합니다’로 옮겨, 단순한 예의가 아니라 공적 예배 행위를 분명히 드러냈습니다.
  alternative_readings:
  - ‘절해야 합니다’
  - ‘경배해야 합니다’
  rationale: 문맥은 성전 규례 안에서의 예배 동작을 말하므로, 신체적 자세와 경배의 의미를 함께 보존하는 번역이 가장 충실합니다.
  doctrine_reference: Ezekiel temple vision; cultic worship language
- issue: 여호와/야훼 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주’
  - ‘여호와’
  rationale: 히브리어 고유 신명 자체를 드러내는 것이 본문 관찰에 더 직접적이며, 기존 교회식 대체어보다 원문 가시성을 높입니다.
  doctrine_reference: POB naming convention for YHWH
