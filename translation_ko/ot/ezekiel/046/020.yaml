reference: Ezekiel 46:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י זֶ֣ה הַ/מָּק֗וֹם אֲשֶׁ֤ר יְבַשְּׁלוּ שָׁם֙ הַ/כֹּ֣הֲנִ֔ים אֶת הָ/אָשָׁ֖ם וְ/אֶת הַ/חַטָּ֑את אֲשֶׁ֤ר יֹאפוּ֙ אֶת הַ/מִּנְחָ֔ה לְ/בִלְתִּ֥י הוֹצִ֛יא אֶל הֶ/חָצֵ֥ר הַ/חִֽיצוֹנָ֖ה לְ/קַדֵּ֥שׁ אֶת הָ/עָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/020.yaml
  text: Then he said to me[a], “This is the place where the priests shall boil the guilt offering and the sin offering, and where they shall bake the grain offering, so as not to bring them out into the outer court to make the people holy.”
  footnotes:
  - marker: a
    text: Or “consecrate the people” or “sanctify the people.” The Hebrew verb means to make holy; in this temple context it likely refers to holiness being transmitted by contact with sacred offerings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. “이곳은 제사장들이 속건제와 속죄제를 삶고, 소제물을 굽는 곳입니다. 그렇게 해서 그것들을 바깥뜰로 내가지 않게 하여 백성을 거룩하게 하지 않도록 하려는 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “백성을 성별하다”, “백성을 성스럽게 하다.” 히브리어 동사는 본래 ‘거룩하게 하다’를 뜻하며, 이 성전 문맥에서는 성물과의 접촉을 통해 거룩함이 전달되는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  english_pob_choice: Then he said to me
  chosen_korean: 그가 제게 말씀하셨습니다
  alternatives_korean:
  - 그가 내게 이르셨습니다
  - 그가 제게 말하셨습니다
  lexicon: HALOT
  rationale: 예언적/환시 서술의 단순한 진행을 자연스럽게 살리면서, 화자를 존중하는 공손한 서술로 옮겼습니다.
- source_word: הָאָשָׁם
  english_pob_choice: the guilt offering
  chosen_korean: 속건제
  alternatives_korean:
  - 속죄제의 일종
  - 속건제물
  lexicon: HALOT
  rationale: 성경 제의 용어로는 한국어에서 이미 정착된 ‘속건제’가 가장 직접적이며, 여기서는 제사 종류를 가리키므로 ‘제물’보다 제의명으로 옮겼습니다.
- source_word: הַחַטָּאת
  english_pob_choice: the sin offering
  chosen_korean: 속죄제
  alternatives_korean:
  - 죄제
  - 정결제
  lexicon: HALOT
  rationale: 본 문맥은 희생 제사의 명칭을 병렬로 나열하므로, 표준적인 제의 용어인 ‘속죄제’를 사용했습니다.
- source_word: הַמִּנְחָה
  english_pob_choice: the grain offering
  chosen_korean: 소제물
  alternatives_korean:
  - 곡식제물
  - 소제
  lexicon: HALOT
  rationale: 제사장들이 ‘굽는’ 대상이라는 점을 드러내기 위해 제의명보다 사물성을 살린 ‘소제물’을 택했습니다. 다만 한국 교회 용례의 ‘소제’도 가능한 대안입니다.
- source_word: לְבִלְתִּי הוֹצִיא אֶל הֶחָצֵר הַחִיצוֹנָה
  english_pob_choice: so as not to bring them out into the outer court
  chosen_korean: 그렇게 해서 그것들을 바깥뜰로 내가지 않게 하여
  alternatives_korean:
  - 바깥뜰로 가져가지 않게 하여
  - 외뜰로 내놓지 않게 하여
  lexicon: HALOT
  rationale: ‘밖으로 내다’의 동작을 살리되, 한국어 자연성에 맞게 목적절로 정리했습니다. ‘바깥뜰’은 Ezekiel의 성전 구조를 반영합니다.
- source_word: לְקַדֵּשׁ אֶת הָעָם
  english_pob_choice: to make the people holy
  chosen_korean: 백성을 거룩하게 하지 않도록
  alternatives_korean:
  - 백성을 거룩하게 하도록
  - 백성을 성별하지 않도록
  lexicon: HALOT
  rationale: קדש의 기본 의미를 직접 살려 ‘거룩하게 하다’로 옮겼습니다. 제의적 접촉을 통해 거룩함이 미치지 않게 하려는 목적을 표현했습니다.
theological_decisions:
- issue: 'קדש의 제의적 효과: ‘거룩하게 함’의 방향'
  chosen_reading: 이 절은 제물을 바깥뜰로 내가지 않음으로써, 성물의 접촉을 통해 백성이 거룩하게 되는 일을 막는다는 제의적 논리를 말합니다.
  alternative_readings:
  - 백성이 부정해지는 것을 막는다는 뜻
  - 단순히 성물의 훼손이나 부적절한 취급을 막는다는 뜻
  rationale: 본문은 거룩함이 접촉을 통해 전달될 수 있다는 성전-제의 맥락을 전제합니다. 따라서 이 긴장을 약화시키지 않고 그대로 드러냈습니다.
  doctrine_reference: '번역 원칙 §3: 제의적/신학적 긴장을 평탄화하지 않고 보존'
