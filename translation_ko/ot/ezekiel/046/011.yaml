id: EZK.46.11
reference: Ezekiel 46:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בַ/חַגִּ֣ים וּ/בַ/מּוֹעֲדִ֗ים תִּהְיֶ֤ה הַ/מִּנְחָה֙ אֵיפָ֤ה לַ/פָּר֙ וְ/אֵיפָ֣ה לָ/אַ֔יִל וְ/לַ/כְּבָשִׂ֖ים מַתַּ֣ת יָד֑/וֹ וְ/שֶׁ֖מֶן הִ֥ין לָ/אֵיפָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/011.yaml
  text: At the festivals and the appointed times[a], the grain offering shall be one ephah for the bull and one ephah for the ram, and for the lambs as much as he is able to give, with a hin of oil to each ephah.
  footnotes:
  - marker: a
    text: Literally, 'for the lambs, the gift of his hand,' an idiom meaning according to what he can afford or is able to give.
    reason: lexical_alternative
translation:
  language: ko
  text: 절기들과 정해진 때에 드리는 곡식 제물은 수소 한 마리에는 한 에바, 숫양 한 마리에는 한 에바, 어린양들에게는 그가 드릴 수 있는 만큼으로 하고, 기름은 에바마다 한 힌으로 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘어린양들에게, 그의 손의 예물’이라고 되어 있으며, 이는 그가 드릴 수 있는 형편에 따라 드린다는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחַגִּים
  english_pob_choice: At the festivals
  chosen_korean: 축제들과
  alternatives_korean:
  - 절기들에
  - 명절들에
  lexicon: HALOT
  rationale: חַגִּים은 단순한 달력 날짜보다 예배적·절기적 행사이므로, 현대 한국어에서는 ‘축제들’이 자연스럽고 cultic calendar sense를 살립니다.
- source_word: וּבַמּוֹעֲדִים
  english_pob_choice: and the appointed times
  chosen_korean: 정해진 때에
  alternatives_korean:
  - 지정된 때에
  - 정한 절기에
  lexicon: HALOT
  rationale: מוֹעֲדִים은 단순히 반복되는 절기라기보다 지정된 시기들을 가리키므로, 앞의 חַגִּים와 겹치지 않게 ‘정해진 때에’로 구분했습니다.
- source_word: הַמִּנְחָה
  english_pob_choice: the grain offering
  chosen_korean: 곡식 제물
  alternatives_korean:
  - 소제
  - 곡식 헌물
  lexicon: HALOT
  rationale: 제사 문맥에서 מִנְחָה는 곡식 제물을 뜻하지만, 한국어 교회어인 ‘소제’는 독자에게 덜 투명하므로 의미를 직접 드러내는 ‘곡식 제물’을 택했습니다.
- source_word: מַתַּת יָדוֹ
  english_pob_choice: as much as he is able to give
  chosen_korean: 그가 드릴 수 있는 만큼
  alternatives_korean:
  - 그의 손이 주는 만큼
  - 그의 손의 예물만큼
  lexicon: HALOT
  rationale: 직역하면 ‘그의 손의 예물’이지만, 관용구가 말하는 능력·형편에 따른 분량을 한국어로 자연스럽게 풀어 옮겼습니다.
- source_word: וְשֶׁמֶן הִין לָאֵיפָה
  english_pob_choice: with a hin of oil to each ephah
  chosen_korean: 기름은 각 에바마다 힌 한 되입니다
  alternatives_korean:
  - 에바마다 기름 한 힌입니다
  - 각 에바에 힌 한 되의 기름이 따릅니다
  lexicon: HALOT
  rationale: 히브리어의 분배 구조를 살려 각 에바마다 기름의 비율이 붙는다는 점을 분명히 했습니다. ‘에바’와 ‘힌’은 제사 측량 단위로 음역을 유지했습니다.
theological_decisions:
- issue: 절기와 정해진 때를 구분하는 반복 구조
  chosen_reading: ‘축제들’과 ‘정해진 때’를 나란히 두어, 연중 예배 절기와 지정된 시기라는 두 범주를 구분해 읽었습니다.
  alternative_readings:
  - 둘을 모두 ‘절기’로 통일
  - 둘을 모두 ‘명절’로 통일
  rationale: 히브리어는 두 용어를 나란히 두어 범위를 넓히므로, 한국어도 동일어 반복으로 평준화하지 않고 차이를 보존하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 제사·절기 규례의 구분 보존
