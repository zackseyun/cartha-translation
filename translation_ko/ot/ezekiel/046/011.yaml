- from: 축제들과 정해진 때에, 곡식 제물은 수송아지에게는 에바 한 되, 숫양에게는 에바 한 되, 그리고 어린양들에게는 그가 드릴 수 있는 만큼이며, 기름은 각 에바마다 힌 한 되입니다.[a]
  to: 절기들과 정해진 때에 드리는 곡식 제물은 수소 한 마리에는 한 에바, 숫양 한 마리에는 한 에바, 어린양들에게는 그가 드릴 수 있는 만큼으로 하고, 기름은 에바마다 한 힌으로 하십시오.[a]
  rationale: 측량 단위인 에바와 힌을 원문대로 각각 보존하고, 절기 제의 규례에 맞는 자연스러운 현대 한국어 합쇼체 문장으로 다듬었습니다. 어린양의 경우에 정량이 제시되지 않고 드릴 수 있는 만큼으로 정해진다는 원문의 의미와 각 에바에 대한 기름 한 힌의 비율을 유지했습니다.
