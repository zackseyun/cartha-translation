theological_decisions:
- issue: 마지막 난구절성 표현 מְהֻקְצָעוֹת의 처리
  chosen_reading: ‘그 네 곳은 같은 측량이었습니다’로 옮겨, 네 개의 코너 뜰이 동일한 크기라는 점을 강조했습니다.
  alternative_readings:
  - ‘그 네 곳은 모퉁이들에 놓여 있었습니다’
  - ‘그 네 곳은 모퉁이로 된 것이었습니다’
  rationale: 어휘가 희귀하고 문맥상 난해하므로, English POB가 취한 해석처럼 기능적으로 ‘네 곳의 동일한 측량’이라는 결론을 본문에 반영하는 편이 가장 투명합니다. 이 절의 초점은 구조의 정확한 동형성에 있습니다.
  doctrine_reference: 본문 해석의 문법적·문맥적 우선성
- issue: 단위 ‘규빗’ 생략
  chosen_reading: 본문에는 ‘규빗’을 넣지 않았습니다.
  alternative_readings:
  - ‘사십 규빗, 삼십 규빗’
  - ‘사십 규빗 길이와 삼십 규빗 너비’
  rationale: 원문은 이 절에서 단위를 명시하지 않으며, 인접한 성전 측량 문맥에서 암시될 뿐입니다. 따라서 본문은 원문의 생략을 보존하고, 필요한 경우 주해에서 보완하는 것이 적절합니다.
  doctrine_reference: 원문 형식 존중
