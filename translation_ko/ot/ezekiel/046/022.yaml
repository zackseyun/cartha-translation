  text: בְּ/אַרְבַּ֜עַת מִקְצֹע֤וֹת הֶֽ/חָצֵר֙ חֲצֵר֣וֹת קְטֻר֔וֹת אַרְבָּעִ֣ים אֹ֔רֶךְ וּ/שְׁלֹשִׁ֖ים רֹ֑חַב מִדָּ֣ה אַחַ֔ת לְ/אַרְבַּעְתָּ֖/ם מְׄהֻׄקְׄצָׄעֽׄוֹׄתׄ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/022.yaml
  text: In the four corners of the court there were enclosed courts[a], forty long and thirty wide[c][b]; the four of them had the same measurement.
  footnotes:
  - marker: a
    text: Or, 'walled courts' or 'closed-off courts.' The Hebrew adjective likely describes the courts as enclosed spaces.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not explicitly repeat the unit 'cubits' here, though it is implied by the surrounding temple measurements.
    reason: cultural_note
  - marker: c
    text: The final Hebrew term is rare and difficult. It may also be understood to emphasize that these were the four corner courts.
    reason: lexical_alternative
translation:
  language: ko
  text: 뜰의 네 모퉁이에는 둘러싸인 뜰들이 있었는데, 길이는 사십, 너비는 삼십이었습니다. 그 네 곳은 같은 측량이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벽으로 둘러싼 뜰들’, ‘닫힌 뜰들’로도 옮길 수 있습니다. 히브리어 형용사는 이 뜰들이 둘러싸인 공간임을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여기에서 ‘규빗’을 직접 반복하지 않지만, 성전의 다른 측량 표현들과 함께 보면 그 단위가 암시됩니다.
    reason: cultural_note
  - marker: c
    text: 마지막 히브리어 어형은 드물고 해석이 어렵습니다. 또한 이 구절은 네 모퉁이 뜰이었음을 강조하는 뜻으로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֹעוֹת
  english_pob_choice: corners
  chosen_korean: 모퉁이
  alternatives_korean:
  - 구석
  - 모서리
  - 코너
  lexicon: HALOT
  rationale: 성전 건축 맥락에서 ‘모퉁이’가 가장 자연스럽게 네 귀퉁이를 가리키며, 현대 문장에서도 무리 없이 읽힙니다.
- source_word: חֲצֵרוֹת
  english_pob_choice: courts
  chosen_korean: 뜰들
  alternatives_korean:
  - 마당들
  - 뜰 공간들
  - 안마당들
  lexicon: HALOT
  rationale: 성전 맥락의 חָצֵר 계열은 기본적으로 ‘뜰’로 옮기는 것이 한국어 성경 독법과도 잘 맞고, 복수형도 살릴 수 있습니다.
- source_word: קְטֻרוֹת
  english_pob_choice: enclosed
  chosen_korean: 둘러싸인
  alternatives_korean:
  - 둘러막힌
  - 폐쇄된
  - 벽으로 둘러싸인
  lexicon: HALOT
  rationale: 이 형용사는 닫혀 있거나 안쪽으로 둘러싸인 상태를 가리키므로, 건축적 뉘앙스를 살리되 지나치게 재료를 단정하지 않는 ‘둘러싸인’이 적절합니다.
- source_word: אַרְבָּעִים אֹרֶךְ וּשְׁלֹשִׁים רֹחַב
  english_pob_choice: forty long and thirty wide
  chosen_korean: 길이는 사십, 너비는 삼십
  alternatives_korean:
  - 사십 길이와 삼십 너비
  - 사십 규빗 길이와 삼십 규빗 너비
  - 길이 사십과 너비 삼십
  lexicon: HALOT
  rationale: 히브리어는 ‘사십 길이, 삼십 너비’처럼 생략적으로 말하므로, 한국어에서는 측정 항목을 드러내는 방식이 가장 자연스럽습니다. 이 절에는 ‘규빗’이 명시되지 않으므로 본문에는 넣지 않았습니다.
theological_decisions:
- issue: 마지막 난구절성 표현 מְהֻקְצָעוֹת의 처리
  chosen_reading: ‘그 네 곳은 같은 측량이었습니다’로 옮겨, 네 개의 코너 뜰이 동일한 크기라는 점을 강조했습니다.
  alternative_readings:
  - ‘그 네 곳은 모퉁이들에 놓여 있었습니다’
  - ‘그 네 곳은 모퉁이로 된 것이었습니다’
  rationale: 어휘가 희귀하고 문맥상 난해하므로, English POB가 취한 해석처럼 기능적으로 ‘네 곳의 동일한 측량’이라는 결론을 본문에 반영하는 편이 가장 투명합니다. 이 절의 초점은 구조의 정확한 동형성에 있습니다.
  doctrine_reference: 본문 해석의 문법적·문맥적 우선성
- issue: 단위 ‘규빗’ 생략
  chosen_reading: 본문에는 ‘규빗’을 넣지 않았습니다.
  alternative_readings:
  - ‘사십 규빗, 삼십 규빗’
  - ‘사십 규빗 길이와 삼십 규빗 너비’
  rationale: 원문은 이 절에서 단위를 명시하지 않으며, 인접한 성전 측량 문맥에서 암시될 뿐입니다. 따라서 본문은 원문의 생략을 보존하고, 필요한 경우 주해에서 보완하는 것이 적절합니다.
  doctrine_reference: 원문 형식 존중
