  text: וּ/בְ/ב֖וֹא הַ/נָּשִׂ֑יא דֶּ֣רֶךְ אוּלָ֤ם הַ/שַּׁ֨עַר֙ יָב֔וֹא וּ/בְ/דַרְכּ֖/וֹ יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/008.yaml
  text: When the prince enters[a], he shall enter by way of the porch of the gate, and he shall go out by the same way.
  footnotes:
  - marker: a
    text: Literally, 'by his way he shall go out,' meaning he exits by the same route he entered.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 통치자가 들어올 때에는 문 문의 현관 길로 들어와야 하며, 나갈 때에도 같은 길로 나가야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘그의 길로 그가 나갈 것이다’로, 곧 들어간 바로 그 경로로 나간다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּשִׂיא
  english_pob_choice: the prince
  chosen_korean: 그 통치자
  alternatives_korean:
  - 그 왕자
  - 그 지도자
  - 그 군주
  lexicon: HALOT
  rationale: 에스겔의 성전 환상에서의 נָשִׂיא는 일반적으로 시민적 통치자를 가리키므로, 한국어에서는 왕자보다 역할을 드러내는 ‘통치자’가 더 자연스럽고 오해를 줄입니다.
- source_word: אולם
  english_pob_choice: the porch
  chosen_korean: 현관
  alternatives_korean:
  - 포치
  - 전실
  - 주랑
  lexicon: HALOT
  rationale: אוּלָם은 문 구조의 앞쪽 공간을 가리키므로, 현대 한국어의 건축 용어인 ‘현관’이 가장 직관적으로 기능을 전달합니다.
- source_word: דֶּרֶךְ
  english_pob_choice: by way of
  chosen_korean: 길로
  alternatives_korean:
  - 경로로
  - 방향으로
  - 도로로
  lexicon: HALOT
  rationale: דֶּרֶךְ는 여기서 이동 경로를 뜻하므로, 반복되는 출입 규정의 문맥에 맞게 ‘길로’라고 옮겨 출입의 경로를 분명히 했습니다.
- source_word: וּבְדַרְכּוֹ
  english_pob_choice: by the same way
  chosen_korean: 같은 길로
  alternatives_korean:
  - 그의 길로
  - 그와 같은 경로로
  - 그 길대로
  lexicon: HALOT
  rationale: 직역하면 ‘그의 길로’이지만 문맥상 앞서 언급한 동일한 경로를 가리키므로, 한국어에서는 의미를 드러내는 ‘같은 길로’가 더 정확합니다.
theological_decisions:
- issue: הַנָּשִׂיא의 신분을 어떻게 제시할지
  chosen_reading: 예언적·제의적 문맥을 유지하며 ‘그 통치자’로 중립적으로 옮겼습니다.
  alternative_readings:
  - 그 왕자
  - 메시아적 통치자
  rationale: 이 절은 성전 출입 절차를 지시할 뿐, 통치자의 최종 신분을 해석적으로 규정하지 않습니다. 따라서 본문이 말하는 기능을 유지하고, 메시아적 해석은 본문 밖에서 열어 두었습니다.
  doctrine_reference: 본문의 긴장을 보존하고 해석을 앞서 단정하지 않음
