- from: 주 여호와께서 이렇게 말씀하십니다. 동쪽을 향한 안쪽 뜰의 문은 엿새 동안 닫혀 있어야 하지만, 안식일에는 열려야 하고, 초하루에도 열려야 합니다.[a]
  to: 주 여호와께서 이렇게 말씀하십니다. 동쪽을 향한 안쪽 뜰의 문은 일하는 엿새 동안 닫혀 있어야 합니다. 그러나 안식일에는 열려야 하고, 초하루에도 열려야 합니다.[a]
