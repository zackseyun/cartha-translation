reference: Ezekiel 46:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ שַׁ֜עַר הֶ/חָצֵ֤ר הַ/פְּנִימִית֙ הַ/פֹּנֶ֣ה קָדִ֔ים יִהְיֶ֣ה סָג֔וּר שֵׁ֖שֶׁת יְמֵ֣י הַֽ/מַּעֲשֶׂ֑ה וּ/בְ/י֤וֹם הַ/שַּׁבָּת֙ יִפָּתֵ֔חַ וּ/בְ/י֥וֹם הַ/חֹ֖דֶשׁ יִפָּתֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/001.yaml
  text: 'Thus says the Lord GOD: The gate of the inner court that faces east shall be shut during the six working days[a], but on the Sabbath day it shall be opened, and on the day of the new moon it shall be opened.'
  footnotes:
  - marker: a
    text: Hebrew 'the day of the new moon'; that is, the monthly new-moon observance.
    reason: cultural_note
translation:
  language: ko
  text: 주 여호와께서 이렇게 말씀하십니다. 동쪽을 향한 안쪽 뜰의 문은 일하는 엿새 동안 닫혀 있어야 합니다. 그러나 안식일에는 열려야 하고, 초하루에도 열려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘초하루’는 달의 첫날, 곧 월삭 관습을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이같이 말씀하십니다
  - 주께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전달 공식의 공식성과 현재형 선포감을 살리면서, 현대 한국어 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 여호와
  alternatives_korean:
  - 주 하나님
  - 주 야훼
  lexicon: HALOT
  rationale: אֲדֹנָי와 YHWH의 결합을 한국어 예배 언어에서 구별 가능하게 나타내되, 본문 직접성 때문에 전통적 대체어보다 고유명에 가까운 형태를 택했습니다.
- source_word: שַׁעַר הֶחָצֵר הַפְּנִימִית
  english_pob_choice: The gate of the inner court
  chosen_korean: 안쪽 뜰의 문
  alternatives_korean:
  - 내뜰의 문
  - 안뜰의 문
  lexicon: HALOT
  rationale: 관계 구조를 자연스럽게 풀어 ‘문’이 속한 공간을 분명히 했으며, 성전 문맥에서 ‘뜰’은 본문의 건축적 의미를 충분히 전달합니다.
- source_word: יְמֵי הַמַּעֲשֶׂה
  english_pob_choice: working days
  chosen_korean: 엿새 동안
  alternatives_korean:
  - 여섯 일 동안
  - 일하는 여섯 날 동안
  lexicon: HALOT
  rationale: 영어 POB의 관용적 의미는 일반적인 노동일 대비를 드러내는 것이어서, 한국어에서는 간결한 기간 표현으로 재현하되 안식일과의 대조를 유지했습니다.
- source_word: הַחֹדֶשׁ
  english_pob_choice: the new moon
  chosen_korean: 초하루
  alternatives_korean:
  - 새달
  - 신월
  lexicon: HALOT
  rationale: 달의 첫날을 가리키는 절기적 용례이므로, 한국어 성경에서 널리 이해되는 ‘초하루’를 사용해 관찰일의 의미를 분명히 했습니다.
theological_decisions:
- issue: 아ֲדֹנָי יְהוִה의 한국어 처리
  chosen_reading: ‘주 여호와’로 옮겨, 화자 표지와 언약 이름의 결합을 함께 드러냈습니다.
  alternative_readings:
  - ‘주 하나님’
  - ‘주 야훼’
  rationale: 본문은 예언 선포의 권위를 나타내는 합성 호칭을 사용하므로, 둘을 하나로 평탄화하지 않고 병치된 신적 호칭의 긴장을 유지하는 것이 더 충실합니다.
  doctrine_reference: Divine name rendering; prophetic formula register
