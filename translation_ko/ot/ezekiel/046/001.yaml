  source_fidelity: ‘엿새 동안’은 안식일과 대조되는 기간을 어느 정도 전달하지만, 히브리어 שֵׁשֶׁת יְמֵי הַמַּעֲשֶׂה가 명시하는 ‘일하는 날들’의 뜻이 빠져 있습니다. 이를 보완하면 원문의 대조와 규정의 범위가 더 분명해집니다. 나머지 표현은 원문의 구문과 반복된 수동 명령적 서술을 충실히 반영합니다.
  naturalness: ‘일하는 엿새 동안’은 현대 표준 한국어에서 자연스럽고, ‘여섯 평일’처럼 현대 주간 제도와 혼동될 수 있는 표현을 피합니다. 전체 문장은 합쇼체의 공식적 예언 선포 문체에 적절합니다.
  terminology: ‘주 여호와’, ‘안쪽 뜰’, ‘안식일’, ‘초하루’는 성전·예배 문맥에서 자연스럽고 일관됩니다. ‘초하루’는 여기서 월삭 관례를 가리키므로 각주가 유익합니다.
