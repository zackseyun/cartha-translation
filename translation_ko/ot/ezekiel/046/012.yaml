  text: וְ/כִֽי יַעֲשֶׂה֩ הַ/נָּשִׂ֨יא נְדָבָ֜ה עוֹלָ֣ה אֽוֹ שְׁלָמִים֮ נְדָבָ֣ה לַֽ/יהוָה֒ וּ/פָ֣תַֽח ל֗/וֹ אֶת הַ/שַּׁ֨עַר֙ הַ/פֹּנֶ֣ה קָדִ֔ים וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת שְׁלָמָ֔י/ו כַּ/אֲשֶׁ֥ר יַעֲשֶׂ֖ה בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וְ/יָצָ֛א וְ/סָגַ֥ר אֶת הַ/שַּׁ֖עַר אַחֲרֵ֥י צֵאתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/012.yaml
  text: But when the prince makes a freewill offering to Yahweh[a], either a burnt offering or peace offerings, the gate that faces east shall be opened for him, and he shall offer his burnt offering and his peace offerings as he does on the Sabbath day. Then he shall go out[b], and after he goes out the gate shall be shut.
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' for 'peace offerings.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew has an unspecified third-person verb (''and he opened'' / ''and he shut''); the English passive preserves the unnamed agent: ''shall be opened'' ... ''shall be shut.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 통치자가 자원하여 야훼께 번제나 화목제를[a] 드릴 때에는, 그를 위하여 동쪽을 향한 문을 열어야 합니다.[b] 그는 안식일에 드리는 것처럼 자기 번제와 화목제를 드려야 합니다. 그런 다음 그는 나가고, 그가 나간 뒤에는 그 문을 닫아야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화목제물’로 옮길 수도 있습니다. 여기서는 제의 용어의 전통적 대응인 ‘화목제’를 따랐습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문을 ‘열다’와 ‘닫다’라는 동작의 행위 주체를 명시하지 않습니다. 번역도 그 행위자를 특정하지 않는 규정 표현으로 옮겼습니다.
    reason: source_note
