source:
  edition: WLC
  text: וְ/כִֽי יַעֲשֶׂה֩ הַ/נָּשִׂ֨יא נְדָבָ֜ה עוֹלָ֣ה אֽוֹ שְׁלָמִים֮ נְדָבָ֣ה לַֽ/יהוָה֒ וּ/פָ֣תַֽח ל֗/וֹ אֶת הַ/שַּׁ֨עַר֙ הַ/פֹּנֶ֣ה קָדִ֔ים וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת שְׁלָמָ֔י/ו כַּ/אֲשֶׁ֥ר יַעֲשֶׂ֖ה בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וְ/יָצָ֛א וְ/סָגַ֥ר אֶת הַ/שַּׁ֖עַר אַחֲרֵ֥י צֵאתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/012.yaml
  text: But when the prince makes a freewill offering to Yahweh[a], either a burnt offering or peace offerings, the gate that faces east shall be opened for him, and he shall offer his burnt offering and his peace offerings as he does on the Sabbath day. Then he shall go out[b], and after he goes out the gate shall be shut.
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' for 'peace offerings.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew has an unspecified third-person verb (''and he opened'' / ''and he shut''); the English passive preserves the unnamed agent: ''shall be opened'' ... ''shall be shut.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나그나이 자기 뜻으로 번제나 화목제를 야훼께 드리려 할 때에는, 동쪽을 향한 문을 그를 위해 열어 주어야 합니다. 그는 자기 번제와 자기 화목제를 안식일에 하는 것과 같이 드려야 합니다. 그런 다음 그는 나가고, 그가 나간 뒤에는 문을 닫아야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화목제물’로 옮겨도 됩니다. 여기서는 제의 용어의 전통적 대응인 ‘화목제’를 따랐습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 행위 주체를 밝히지 않은 채 ‘열다/닫다’를 표현합니다. 여기서는 수동적 한국어 대신 절차 문체를 유지해 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: הַנָּשִׂיא
  english_pob_choice: the prince
  chosen_korean: 나그나이
  alternatives_korean:
  - 왕자
  - 통치자
  - 지도자
  lexicon: HALOT
  rationale: 에스겔의 성전 규례에서 הַנָּשִׂיא는 고유한 직분/인물을 가리키므로, 단순한 ‘지도자’보다 문맥상 지정성이 있는 호칭으로 옮겼습니다.
- source_word: נְדָבָה
  english_pob_choice: a freewill offering
  chosen_korean: 자기 뜻으로
  alternatives_korean:
  - 자원하여
  - 자원제물로
  - 자유로운 예물로
  lexicon: HALOT
  rationale: 명사 자체보다 ‘자원성’이 핵심이므로, 희생제 종류 앞에 붙는 동기 표현으로 자연스럽게 반영했습니다.
- source_word: שְׁלָמִים
  english_pob_choice: peace offerings
  chosen_korean: 화목제
  alternatives_korean:
  - 평화제
  - 교제제물
  lexicon: HALOT
  rationale: 제사 용어로는 한국어 교회어휘에서 널리 통용되는 ‘화목제’가 מקור의 제의적 범주를 가장 분명하게 드러냅니다.
- source_word: וּפָתַח לוֹ אֶת הַשַּׁעַר הַפֹּנֶה קָדִים
  english_pob_choice: the gate that faces east shall be opened for him
  chosen_korean: 동쪽을 향한 문을 그를 위해 열어 주어야 합니다
  alternatives_korean:
  - 그를 위해 동쪽 문을 열어야 합니다
  - 동쪽을 향한 문이 그를 위해 열려야 합니다
  lexicon: HALOT
  rationale: 히브리어의 주어 생략과 수혜자 표지를 살려, 누가 여는지는 드러내지 않고 ‘그를 위해’라는 수혜 의미를 유지했습니다.
- source_word: וְעָשָׂה אֶת עֹלָתוֹ וְאֶת שְׁלָמָיו
  english_pob_choice: he shall offer his burnt offering and his peace offerings
  chosen_korean: 자기 번제와 자기 화목제를 드려야 합니다
  alternatives_korean:
  - 자기 번제와 화목제를 행해야 합니다
  - 자기 번제와 화목제를 바쳐야 합니다
  lexicon: HALOT
  rationale: 제의 문맥에서 עשה는 단순한 ‘하다’보다 제사를 ‘드리다/바치다’로 옮기는 것이 한국어 의미를 정확히 전달합니다.
- source_word: וְיָצָא ... וְסָגַר אֶת הַשַּׁעַר אַחֲרֵי צֵאתוֹ
  english_pob_choice: Then he shall go out... and after he goes out the gate shall be shut
  chosen_korean: 그런 다음 그는 나가고, 그가 나간 뒤에는 문을 닫아야 합니다
  alternatives_korean:
  - 그리고 그는 나가야 하며, 나간 뒤 문을 닫아야 합니다
  - 그가 나간 후 문은 닫혀야 합니다
  lexicon: HALOT
  rationale: 행정적 절차의 순서를 분명히 하면서, 히브리어의 행위 연쇄를 한국어로 자연스럽게 재현했습니다.
