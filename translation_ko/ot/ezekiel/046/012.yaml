  rationale: 제사 용어로는 한국어 교회어휘에서 널리 통용되는 ‘화목제’가 מקור의 제의적 범주를 가장 분명하게 드러냅니다.
- source_word: וּפָתַח לוֹ אֶת הַשַּׁעַר הַפֹּנֶה קָדִים
  english_pob_choice: the gate that faces east shall be opened for him
  chosen_korean: 동쪽을 향한 문을 그를 위해 열어 주어야 합니다
  alternatives_korean:
  - 그를 위해 동쪽 문을 열어야 합니다
  - 동쪽을 향한 문이 그를 위해 열려야 합니다
