- source_word: וְעָשָׂה אֶת עֹלָתוֹ וְאֶת שְׁלָמָיו
  english_pob_choice: he shall offer his burnt offering and his peace offerings
  chosen_korean: 자기 번제와 자기 화목제를 드려야 합니다
  alternatives_korean:
  - 자기 번제와 화목제를 행해야 합니다
  - 자기 번제와 화목제를 바쳐야 합니다
  lexicon: HALOT
  rationale: 제의 문맥에서 עשה는 단순한 ‘하다’보다 제사를 ‘드리다/바치다’로 옮기는 것이 한국어 의미를 정확히 전달합니다.
- source_word: וְיָצָא ... וְסָגַר אֶת הַשַּׁעַר אַחֲרֵי צֵאתוֹ
  english_pob_choice: Then he shall go out... and after he goes out the gate shall be shut
  chosen_korean: 그런 다음 그는 나가고, 그가 나간 뒤에는 문을 닫아야 합니다
  alternatives_korean:
  - 그리고 그는 나가야 하며, 나간 뒤 문을 닫아야 합니다
  - 그가 나간 후 문은 닫혀야 합니다
  lexicon: HALOT
  rationale: 행정적 절차의 순서를 분명히 하면서, 히브리어의 행위 연쇄를 한국어로 자연스럽게 재현했습니다.
