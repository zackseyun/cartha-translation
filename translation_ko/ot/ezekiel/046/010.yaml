  source_fidelity: 마지막 동사 יֵצֵאוּ는 형태상 남성 복수, 곧 ‘그들이 나간다/나가야 한다’입니다. 초안의 ‘그도 나가야 합니다’는 단수로 바꾸어 원문의 수를 변경합니다. 앞의 ‘그들 가운데’라는 표현상 지도자가 그들과 함께 포함된다는 함의는 있으나, 본문 자체는 마지막 절에서 단수 대명사를 쓰지 않습니다.
  naturalness: 초안은 현대 표준어 합쇼체로 대체로 자연스럽습니다. 다만 원문의 복수 동사를 살리려면 마지막 절을 ‘그들도 나가야 합니다’로 고쳐야 합니다. 반복이 다소 보이지만, 규정문 문맥에서는 명료하고 자연스럽습니다.
  terminology: ‘그 지도자’는 נָשִׂיא의 문맥상 직함을 다소 넓게 옮긴 표현이지만, 왕권 또는 메시아적 정체를 단정하지 않으며 일관되게 사용할 수 있습니다. ‘그들 가운데’도 בְּתוֹכָם을 충실히 옮깁니다.
