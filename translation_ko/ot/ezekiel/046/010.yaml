translation:
  language: ko
  text: 그 지도자는 그들 가운데 있어야 합니다. 그들이 들어올 때 그도 들어오고, 그들이 나갈 때 그들도 나가야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 한가운데’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들이 나가야 한다’라고 되어 있습니다. 문맥상 지도자가 그들과 함께 나가는 것을 뜻하는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּשִׂיא
  english_pob_choice: the prince
  chosen_korean: 그 지도자
  alternatives_korean:
  - 그 군주
  - 그 통치자
  lexicon: HALOT
  rationale: 에스겔 40–48장의 տեխնիկական 직함을 한국어로 자연스럽게 옮기되, 현대 독자에게는 왕권보다 기능적 지위를 드러내는 ‘지도자’가 가장 무난합니다.
- source_word: בְּתוֹכָם
  english_pob_choice: among them
  chosen_korean: 그들 가운데
  alternatives_korean:
  - 그들 وسط에
  - 그들 한가운데
  lexicon: HALOT
  rationale: ‘among them’의 핵심은 지도자가 백성에서 분리되지 않고 함께 있다는 점이므로, 자연스러운 표준어인 ‘그들 가운데’로 옮겼습니다.
- source_word: בְּבוֹאָם / יָבֹוא / וּבְצֵאתָם
  english_pob_choice: when they enter ... he shall enter ... when they go out ... he shall go out
  chosen_korean: 그들이 들어갈 때 그도 들어가고, 그들이 나갈 때 그도 나가야 합니다
  alternatives_korean:
  - 그들이 들어가면 그도 들어가고, 그들이 나가면 그도 나갑니다
  - 그들이 들어갈 때 그도 들어가며, 그들이 나갈 때 그도 나갑니다
  lexicon: HALOT
  rationale: 히브리어의 시간적 절과 연속된 미완료 동사를 규정 문맥에 맞게 의무/규범의 뉘앙스를 살려 ‘-아/어야 합니다’로 옮겼습니다.
theological_decisions:
- issue: 에스겔의 '지도자' 정체를 과도하게 신학화하지 않음
  chosen_reading: 본문의 절차적 지시를 살려, 메시아적 해석이나 왕정적 확대를 덧씌우지 않았습니다.
  alternative_readings:
  - 메시아
  - 왕
  rationale: 이 절은 성전 예전 규정 속에서 지도자의 출입 동선을 말할 뿐이므로, 번역이 본문을 넘어 인물의 정체를 결론짓지 않도록 했습니다.
  doctrine_reference: 원문 우선, 해석은 주석으로 남김
