base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/021.yaml
  text: Then he brought me out to the outer court and led me past the four corners of the court[a], and behold, in each corner of the court there was a court.
  footnotes:
  - marker: a
    text: 'Hebrew repeats, literally, ''a court in the corner of the court, a court in the corner of the court,'' after mentioning the four corners; the sense is distributive: a court in each of the four corners.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 바깥뜰로 데리고 나가서 뜰의 네 모퉁이로 데리고 갔습니다[a]. 보십시오, 뜰의 각 모퉁이마다 뜰이 하나씩 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘뜰의 모퉁이마다 뜰, 뜰의 모퉁이마다 뜰’처럼 반복되며, 앞의 ‘네 모퉁이’에 비추어 각 모퉁이에 하나씩 있는 분배적 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  english_pob_choice: Then he brought me out
  chosen_korean: 그가 나를 바깥뜰로 데리고 나가서
  alternatives_korean:
  - 그가 나를 데리고 나갔습니다
  - 그가 나를 밖으로 이끌어 내셨습니다
  lexicon: HALOT
  rationale: הוֹצִיא는 ‘데리고 나가다/이끌어 내다’의 뜻이므로, 바깥뜰이라는 공간 이동을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: הֶחָצֵר הַחִיצֹנָה
  english_pob_choice: the outer court
  chosen_korean: 바깥뜰
  alternatives_korean:
  - 외뜰
  - 바깥 마당
  lexicon: HALOT
  rationale: 성전 환상 문맥의 건축 용어로 ‘outer court’에 가장 직접적인 대응은 ‘바깥뜰’입니다.
- source_word: וַיַּעֲבִירֵנִי
  english_pob_choice: led me past
  chosen_korean: 뜰의 네 모퉁이로 데리고 갔습니다
  alternatives_korean:
  - 뜰의 네 모퉁이를 지나가게 했습니다
  - 뜰의 네 모퉁이 쪽으로 이끌었습니다
  lexicon: HALOT
  rationale: עבר의 히필은 ‘지나가게 하다/통과시키다’의 뜻이어서, 단순히 ‘to’로 향하게 하기보다 이동 경로를 반영해 번역했습니다.
- source_word: אַרְבַּעַת מִקְצוֹעֵי הֶחָצֵר
  english_pob_choice: the four corners of the court
  chosen_korean: 뜰의 네 모퉁이
  alternatives_korean:
  - 뜰의 네 귀퉁이
  - 뜰의 네 각
  lexicon: HALOT
  rationale: מִקְצוֹעַ는 건축적 맥락에서 ‘모퉁이, 귀퉁이’로 옮기는 것이 자연스럽고 정확합니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보니
  lexicon: HALOT
  rationale: 환상 장면의 돌연한 시선 전환을 한국어에서 자연스럽게 살리기 위해 ‘보십시오’를 택했습니다.
- source_word: חָצֵר בְּמִקְצֹעַ הֶחָצֵר חָצֵר בְּמִקְצֹעַ הֶחָצֵר
  english_pob_choice: there was a court in each corner of the court
  chosen_korean: 뜰의 각 모퉁이마다 뜰이 하나씩 있었습니다
  alternatives_korean:
  - 뜰의 모퉁이마다 뜰이 있었습니다
  - 뜰의 각 모퉁이마다 뜰이 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 반복은 분배적 의미를 나타내므로, 반복을 기계적으로 되풀이하기보다 ‘각 모퉁이마다’로 분배성을 분명히 했습니다.
theological_decisions:
- issue: 환상 서술의 시점과 공손한 명령형
  chosen_reading: 환상 서술은 평서문으로, ‘보십시오’만 시각 전환의 호격처럼 처리했습니다.
  alternative_readings:
