  yaml_path: translation/ot/ezekiel/046/021.yaml
  text: Then he brought me out to the outer court and led me past the four corners of the court[a], and behold, in each corner of the court there was a court.
  footnotes:
  - marker: a
    text: 'Hebrew repeats, literally, ''a court in the corner of the court, a court in the corner of the court,'' after mentioning the four corners; the sense is distributive: a court in each of the four corners.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 바깥뜰로 데리고 나가, 뜰의 네 모퉁이 곁을 지나가게 하셨습니다[a]. 보십시오, 뜰의 각 모퉁이마다 뜰이 하나씩 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘뜰의 모퉁이에 뜰, 뜰의 모퉁이에 뜰’이라고 반복합니다. 앞서 언급된 ‘네 모퉁이’에 비추어, 이는 각 모퉁이에 뜰이 하나씩 있다는 분배적 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  english_pob_choice: Then he brought me out
  chosen_korean: 그가 나를 바깥뜰로 데리고 나가서
