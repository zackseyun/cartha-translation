  text: וַ/יְבִיאֵ֣/נִי בַ/מָּבוֹא֮ אֲשֶׁ֣ר עַל כֶּ֣תֶף הַ/שַּׁעַר֒ אֶל הַ/לִּשְׁכ֤וֹת הַ/קֹּ֨דֶשׁ֙ אֶל הַ/כֹּ֣הֲנִ֔ים הַ/פֹּנ֖וֹת צָפ֑וֹנָ/ה וְ/הִנֵּה שָׁ֣ם מָק֔וֹם ב/ירכת/ם יָֽמָּ/ה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/019.yaml
  text: Then he brought me through the entrance that was beside the gate to the holy chambers for the priests[a], which faced north; and behold, there was a place there at their far western end.
  footnotes:
  - marker: a
    text: Hebrew literally, 'at their far end, westward.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 문 곁에 있는 출입구를 통해 제사장들을 위한 거룩한 방들로 데려가셨습니다. 그 방들은 북쪽을 향하고 있었습니다. 보십시오, 거기 그 방들의 먼 서쪽 끝에 한 장소가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면, ‘그들의 먼 끝에, 서쪽으로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  english_pob_choice: Then he brought me
  chosen_korean: 그가 나를 데려가니
  alternatives_korean:
  - 그가 나를 이끌어 가니
  - 그가 나를 데리고 가니
  lexicon: HALOT
  rationale: בוא의 사역형을 자연스러운 서술체로 살려 ‘데려가다’로 옮겼습니다. 문맥상 연속 동작이므로 종결을 현재형 서술로 처리했습니다.
- source_word: בַּמָּבוֹא אֲשֶׁר עַל כֶּתֶף הַשַּׁעַר
  english_pob_choice: through the entrance that was beside the gate
  chosen_korean: 문 옆에 있는 प्रवेश구를 통해
  alternatives_korean:
  - 문 곁에 있는 प्रवेश구를 통해
  - 문 옆에 있는 진입로를 따라
  lexicon: HALOT
  rationale: מָבוֹא는 건축 맥락에서 ‘입구/출입구’이므로 ‘들어가는 통로’보다 구체적인 ‘출입구’ 계열로 옮겼습니다. כֶּתֶף는 문자적으로 ‘어깨/옆’이지만 여기서는 게이트의 옆면을 가리켜 ‘문 옆에 있는’으로 자연화했습니다.
- source_word: אֶל הַלִּשְׁכוֹת הַקֹּדֶשׁ אֶל הַכֹּהֲנִים
  english_pob_choice: to the holy chambers for the priests
  chosen_korean: 제사장들을 위한 거룩한 방들로
  alternatives_korean:
  - 제사장들의 거룩한 방들로
  - 제사장들을 위한 성스러운 방들로
  lexicon: HALOT
  rationale: לִשְׁכָּה는 성전 건축 용어로 ‘방/실’이 자연스러워 ‘방들’로 옮겼습니다. שני אֶל의 관계를 기능적으로 받아 ‘제사장들을 위한’으로 풀어, 방들의 용도를 분명히 했습니다.
- source_word: הַפֹּנוֹת צָפוֹנָה
  english_pob_choice: which faced north
  chosen_korean: 그것들은 북쪽을 향하고 있었습니다
  alternatives_korean:
  - 북쪽을 향해 있었습니다
  - 북쪽을 마주하고 있었습니다
  lexicon: HALOT
  rationale: פנה의 분사형을 방들의 방향 묘사로 이해해 ‘북쪽을 향하다’로 옮겼습니다. 복수 주어를 분명히 하기 위해 ‘그것들은’으로 맞췄습니다.
- source_word: וְהִנֵּה שָׁם מָקוֹם בְּיַרְכְתָם יָמָּה
  english_pob_choice: and behold, there was a place there at their far western end
  chosen_korean: 보십시오, 거기에는 서쪽 끝에 한 곳이 있었습니다
  alternatives_korean:
  - 보십시오, 거기에는 그들의 서쪽 끝에 한 곳이 있었습니다
  - 보십시오, 거기에는 맨 서쪽 끝에 한 곳이 있었습니다
  lexicon: HALOT
  rationale: הִנֵּה의 주목 표지를 ‘보십시오’로 살렸고, מָקוֹם은 장소감이 분명한 ‘한 곳’으로 옮겼습니다. יַרְכְתָם의 소유 접미사는 영어 POB의 ‘their’를 반영할 수 있으나, 한국어에서는 문맥상 방들의 ‘끝’이라는 의미가 자연해 생략했습니다.
theological_decisions:
- issue: 성전 환시의 공간 묘사에서 직역성과 가독성의 균형
  chosen_reading: 건축적 어휘는 가능한 한 유지하되, 현대 한국어에서 난해한 해부학적 비유(‘어깨’)는 ‘옆’으로 풀어 읽게 했습니다.
  alternative_readings:
  - ‘문의 어깨’
  - ‘문 측면’
  rationale: 본문은 예언적 환시 속 성전 배치를 전달하므로, 독자가 공간 구조를 바로 파악하도록 하면서도 원문의 위치 관계를 보존하는 방향이 적절합니다.
  doctrine_reference: 성전 환시의 문맥 이해와 본문 충실성
