  text: וְ/אֵיפָ֨ה לַ/פָּ֜ר וְ/אֵיפָ֤ה לָ/אַ֨יִל֙ יַעֲשֶׂ֣ה מִנְחָ֔ה וְ/לַ֨/כְּבָשִׂ֔ים כַּ/אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/שֶׁ֖מֶן הִ֥ין לָ/אֵיפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/007.yaml
  text: And he shall provide as a grain offering an ephah for the bull and an ephah for the ram[a], and for the lambs whatever his hand can afford, and a hin of oil with each ephah.
  footnotes:
  - marker: a
    text: Or 'as much as his means permit.' The Hebrew idiom literally refers to what his hand reaches or is able to provide.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 수송아지에는 에바 한 되, 숫양에는 에바 한 되로 소제물을 바치고, 어린양들에게는 그의 손이 미치는 대로 바치며, 각 에바에는 기름 한 힌을 곁들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 손이 미치는 대로’는 문자적으로는 ‘그의 손이 닿는/미치는 만큼’이라는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵיפָה לַפָּר וְאֵיפָה לָאַיִל
  english_pob_choice: an ephah for the bull and an ephah for the ram
  chosen_korean: 수송아지에는 에바 한 되, 숫양에는 에바 한 되
  alternatives_korean:
  - 소에게 에바 한 되, 숫양에게 에바 한 되
  - 수소에는 에바 한 되, 숫양에는 에바 한 되
  lexicon: HALOT
  rationale: 제의 규정의 구체성을 살리기 위해 측정단위인 에바를 음역하고, 제사 동물은 문맥에 맞게 ‘수송아지’와 ‘숫양’으로 옮겼습니다.
- source_word: יַעֲשֶׂה מִנְחָה
  english_pob_choice: he shall provide as a grain offering
  chosen_korean: 소제물을 바치고
  alternatives_korean:
  - 곡식제물로 마련하고
  - 소제로 드리고
  lexicon: HALOT
  rationale: מִנְחָה는 제의 문맥에서 ‘소제물’이 자연스럽고, יַעֲשֶׂה는 제물의 양을 갖추어 드린다는 뜻으로 ‘바치다’가 적절합니다.
- source_word: כַּאֲשֶׁר תַּשִּׂיג יָדוֹ
  english_pob_choice: whatever his hand can afford
  chosen_korean: 그의 손이 미치는 대로
  alternatives_korean:
  - 그의 형편이 허락하는 만큼
  - 그의 재력이 닿는 만큼
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘손’ 이미지를 살리면서, 능력과 형편에 따라 드린다는 뜻을 자연스럽게 전달했습니다.
- source_word: וְשֶׁמֶן הִין לָאֵיפָה
  english_pob_choice: and a hin of oil with each ephah
  chosen_korean: 각 에바에는 기름 한 힌을 곁들입니다
  alternatives_korean:
  - 에바마다 기름 한 힌을 곁들입니다
  - 에바 한 되마다 기름 한 힌을 곁들입니다
  lexicon: HALOT
  rationale: 히브리어의 분배 관계를 한국어로 자연스럽게 풀어 ‘각 에바’로 옮기고, 기름의 첨가를 ‘곁들입니다’로 표현했습니다.
