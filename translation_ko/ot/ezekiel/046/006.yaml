  yaml_path: translation/ot/ezekiel/046/006.yaml
  text: And on the day of the new moon[a], there shall be an unblemished young bull from the herd, and six lambs and a ram; they shall be unblemished.
  footnotes:
  - marker: a
    text: Literally, 'on the day of the month'; in this cultic context the phrase refers to the new moon observance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 초하루에는 소떼에서 난 흠 없는 어린 수송아지 하나와 어린 양 여섯 마리와 숫양 하나를 바쳐야 하며, 그것들은 흠 없어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘초하루’는 문자적으로는 ‘달의 날’이지만, 제의적 문맥에서는 신월(새 달) 준수를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/י֣וֹם הַ/חֹ֔דֶשׁ
  english_pob_choice: And on the day of the new moon
  chosen_korean: 초하루에는
  alternatives_korean:
  - 달의 날에는
  - 초하루 날에는
  - 새 달의 날에는
  lexicon: HALOT
  rationale: 제의적 문맥에서 הַחֹדֶשׁ는 단순한 ‘달력상의 어느 날’이 아니라 초하루/신월 관습을 가리키므로, 한국어로는 자연스럽고 관용적인 ‘초하루’가 가장 적절합니다.
- source_word: פַּר בֶּן בָּקָר
  english_pob_choice: an unblemished young bull from the herd
  chosen_korean: 소떼에서 난 흠 없는 어린 수송아지 하나
  alternatives_korean:
  - 어린 황소 하나
  - 소떼에서 난 수송아지 하나
  - 어린 소 한 마리
  lexicon: HALOT
  rationale: 제의용 পশ류 표현을 살리기 위해 ‘소떼에서 난’으로 מקור성을 반영하고, sacrificial sense를 분명히 하도록 ‘어린 수송아지’로 옮겼습니다. ‘흠 없는’은 뒤의 תְּמִימִם과도 맞물립니다.
- source_word: תְּמִימִם
  english_pob_choice: unblemished
  chosen_korean: 흠 없는
  alternatives_korean:
  - 온전한
  - 완전한
  - 결점 없는
  lexicon: HALOT
  rationale: 제사 규정에서 תמים은 결함이 없는 제물을 뜻하므로, 현대 한국어에서 직관적인 ‘흠 없는’이 가장 직접적입니다.
- source_word: וְ/שֵׁשֶׁת כְּבָשִׂם ... וָ/אַיִל
  english_pob_choice: and six lambs and a ram
  chosen_korean: 어린 양 여섯 마리와 숫양 하나
  alternatives_korean:
  - 새끼 양 여섯 마리와 숫양 하나
  - 양 여섯 마리와 숫양 하나
  - 어린 양 여섯 마리와 한 숫양
  lexicon: HALOT
  rationale: כְבָשִׂים은 제의 문맥에서 ‘어린 양들’이 자연스럽고, אַיִל은 ‘숫양’으로 옮겨 제물의 종류를 분명히 했습니다. 수량은 한국어 관용에 맞게 분리해 제시했습니다.
theological_decisions:
- issue: 제의 규정의 반복적 무흠 조건
  chosen_reading: ‘흠 없는’으로 두 번 드러내어, 첫 제물 설명과 끝의 전체 제물 상태를 모두 반영했습니다.
  alternative_readings:
  - 한 번만 ‘흠 없는’으로 옮김
  - 마지막 절을 ‘그것들은 온전해야 합니다’로 완화
  rationale: 히브리어는 첫 제물과 마지막 술어에서 모두 무흠을 강조하므로, 한국어에서도 반복을 유지해 제의적 엄격성을 약화하지 않았습니다.
  doctrine_reference: 레 22:20-21; 민 28:11-15
