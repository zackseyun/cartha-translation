base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/013.yaml
  text: And you shall offer a year-old male lamb without blemish as a burnt offering to Yahweh daily[a]; morning by morning you shall offer it.
  footnotes:
  - marker: a
    text: 'Hebrew: ''morning by morning,'' expressing a regular daily repetition; alternatively, ''every morning.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 일 년 된 흠 없는 숫양을 야훼께 번제물로 매일 드려야 합니다[a]. 아침마다 그것을 드려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘아침마다’로, 규칙적인 매일의 반복을 나타냅니다. 따라서 ‘매일’ 또는 ‘매일 아침’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶבֶשׂ
  english_pob_choice: male lamb
  chosen_korean: 숫양
  alternatives_korean:
  - 어린 숫양
  - 숫새끼양
  lexicon: HALOT
  rationale: 제의 문맥에서 כֶבֶשׂ는 양의 어린 개체를 가리키며, POB가 'male lamb'로 성별을 분명히 한 점을 반영해 한국어에서는 제사 동물로 자연스러운 '숫양'을 택했습니다.
- source_word: בֶּן שְׁנָתוֹ
  english_pob_choice: a year-old
  chosen_korean: 일 년 된
  alternatives_korean:
  - 한 살 된
  - 첫해의
  lexicon: HALOT
  rationale: 직역적 표현인 '그의 해의 아들'의 관용적 의미는 나이 제한이므로, 현대 한국어에서 가장 자연스러운 '일 년 된'으로 옮겼습니다.
- source_word: תָּמִים
  english_pob_choice: without blemish
  chosen_korean: 흠 없는
  alternatives_korean:
  - 흠 없는 상태의
  - 완전한
  lexicon: HALOT
  rationale: 제물의 결함 없음이라는 제의적 뜻을 살려, 한국어 성경에서 널리 쓰이면서도 너무 전통어에 치우치지 않는 '흠 없는'을 선택했습니다.
- source_word: לַיּוֹם / בַּבֹּקֶר בַּבֹּקֶר
  english_pob_choice: daily; morning by morning
  chosen_korean: 매일 … 아침마다
  alternatives_korean:
  - 날마다 … 아침마다
  - 매일 … 매일 아침
  lexicon: HALOT
  rationale: לַיּוֹם의 반복성은 '매일'로, בַּבֹּקֶר בַּבֹּקֶר의 분배적 반복은 '아침마다'로 옮겨 원문의 규칙적 반복을 드러냈습니다.
- source_word: לַיהֹוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: POB의 본문 원칙에 따라 신명사 יהוה를 음역해 '야훼'로 유지했으며, 제물의 향방을 나타내는 여격 조사 '께'를 붙였습니다.
- source_word: תַּעֲשֶׂה אֹתוֹ
  english_pob_choice: you shall offer it
  chosen_korean: 드려야 합니다 … 그것을 드려야 합니다
  alternatives_korean:
  - 바쳐야 합니다
  - 제사드려야 합니다
  lexicon: HALOT
  rationale: עשה는 제의 문맥에서 단순한 '하다'가 아니라 제물을 '드리다/바치다'의 뜻이므로, 자연스럽고 공손한 합쇼체로 처리했습니다.
theological_decisions:
- issue: 하루 번제의 규칙성과 반복성
  chosen_reading: 매일 드리되, '아침마다'의 반복 강조를 살려 정기적 ყოველდღ성을 표현했습니다.
  alternative_readings:
  - 날마다 드려야 합니다
  - 매일 아침 드려야 합니다
  rationale: 히브리어의 לַיּוֹם과 בַּבֹּקֶר בַּבֹּקֶר은 단순한 한 번이 아니라 규칙적 반복을 강조하므로, 두 표현을 모두 살려 제의의 지속성을 드러냈습니다.
  doctrine_reference: 제의 규례의 반복 명령
- issue: 여호와 이름의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문에 직접 나타난 יהוה를 고유명으로 보존하여, 제물의 대상이 되는 언약의 이름을 흐리지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
