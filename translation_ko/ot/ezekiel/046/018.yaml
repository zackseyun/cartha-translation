  source_fidelity: 본문의 ‘지도자’, 백성의 상속 재산, 지도자 자신의 재산에서 아들들에게 상속을 주는 대조, 그리고 백성이 각자의 소유지에서 흩어지지 않게 한다는 뜻은 충실히 반영되었습니다. ‘몰아내다’는 לְהוֹנֹתָם מֵאֲחֻזָּתָם의 토지 박탈 문맥을 자연스럽게 드러내지만, 원어의 ‘억압하다/착취하다’라는 어휘적 함의보다 결과를 다소 구체화합니다. 영어 POB의 현행 ‘thrusting them out’과는 일치하므로 본문 수정은 요구하지 않습니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽습니다. 다만 각주 a의 ‘כאן’은 한국어 문장에 부적절하게 남아 있는 외국어 요소이므로 ‘히브리어’로 바로잡아야 합니다. 또한 각주는 해당 어구 바로 뒤에 붙이는 편이 독자에게 명확합니다.
  terminology: ‘지도자’는 에스겔에서 נָשִׂיא가 왕과 구별되는 공적 지도자라는 점을 무리 없이 전달합니다. ‘유산’과 ‘소유’는 본문의 상속·토지 보유 대조를 전달하며, 각주에서 토지 상속 재산의 의미를 보완합니다. ‘각기’는 אִישׁ의 분배적 용법을 자연스럽게 보존합니다.
