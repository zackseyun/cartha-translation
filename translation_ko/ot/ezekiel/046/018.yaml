  rationale: 에스겔에서 נָשִׂיא는 왕이 아니라 공동체의 공식적 수장을 가리키므로, 위계는 살리되 군주제 뉘앙스는 피하는 ‘지도자’가 적절합니다.
- source_word: יִקַּח מִנַּחֲלַת הָעָם
  english_pob_choice: take any of the people's inheritance
  chosen_korean: 백성의 유산 중 아무것도 빼앗아
  alternatives_korean:
