base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/018.yaml
  text: The prince shall not take any of the people's inheritance[a], thrusting them out of their property. He shall give his sons an inheritance out of his own property, so that my people may not be scattered[b], each man from his property.
  footnotes:
  - marker: a
    text: Or 'wronging them' or 'defrauding them' for 'oppressing them.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each man'; the expression is distributive, meaning each individual among the people.
    reason: lexical_alternative
translation:
  language: ko
  text: 지도자는 백성의 유산[a] 중 아무것도 빼앗아 그들을 그들의 소유에서 몰아내서는 안 됩니다. 그는 자기 소유에서 자기 아들들에게 유산을 주어야 하니, 이는 내 백성이 각기[b] 자기 소유에서 흩어지지 않게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유산’은 히브리어 נַחֲלָה가 지닌 토지 상속·세습 재산의 뜻을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘각기’는 히브리어 אִישׁ의 분배적 의미(각 사람, 각자)를 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּשִׂיא
  english_pob_choice: the prince
  chosen_korean: 지도자
  alternatives_korean:
