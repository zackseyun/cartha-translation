  - 백성의 유산을 탈취하여
  lexicon: HALOT
  rationale: לָקַח + מִן은 소유에서 취하는 행위를 뜻하므로, 상속·토지 맥락을 살려 ‘유산’을 쓰고, 분배성을 반영해 ‘아무것도’로 자연스럽게 옮겼습니다.
- source_word: לְהוֹנֹתָם
  english_pob_choice: thrusting them out of their property / oppressing them
  chosen_korean: 그들을 그들의 소유에서 몰아내
  alternatives_korean:
  - 그들을 압제하여
  - 그들을 속여 빼앗아
  lexicon: HALOT
  rationale: 이 동사는 단순한 속임수보다 강제적 착취·박탈의 뜻을 띠므로, 토지 상실의 결과를 직접 드러내는 ‘몰아내다’가 본문 문맥에 가장 가깝습니다.
- source_word: מֵאֲחֻזָּתָם / מֵאֲחֻזָּתוֹ
  english_pob_choice: out of their property / out of his own property
  chosen_korean: 그들의 소유 / 자기 소유
  alternatives_korean:
  - 그들의 소유지 / 자기 소유지
  - 그들의 보유분 / 자기 보유분
  lexicon: HALOT
  rationale: אֲחֻזָּה는 토지·세습 재산을 가리키므로, 현대 한국어에서 직관적인 ‘소유’로 일관되게 옮겨 소유권 대조를 살렸습니다.
- source_word: לְמַעַן אֲשֶׁר לֹא יָפֻצוּ עַמִּי אִישׁ מֵאֲחֻזָּתוֹ
  english_pob_choice: so that my people may not be scattered, each man from his property
  chosen_korean: 내 백성이 각기 자기 소유에서 흩어지지 않게 하려는 것입니다
  alternatives_korean:
  - 내 백성이 각 사람 자기 소유에서 흩어지지 않게 하려는 것입니다
  - 내 백성이 자기 소유에서 제각기 흩어지지 않게 하려는 것입니다
  lexicon: HALOT
  rationale: פּוּץ는 ‘흩다/흩어지다’의 이미지를 유지하는 것이 좋고, אִישׁ의 분배적 용법은 ‘각기’로 자연스럽게 전달할 수 있어 본문 흐름을 매끄럽게 했습니다.
theological_decisions:
- issue: 지배자의 재산 침탈 금지와 상속 질서
  chosen_reading: 지도자는 백성의 유산을 빼앗아 그들을 몰아내서는 안 되며, 자기 아들들의 유산은 자기 소유에서 주어야 한다는 사회·토지 윤리를 분명히 드러냈습니다.
  alternative_readings:
  - 지도자는 백성의 기업을 취해서는 안 된다
  - 지도자는 백성의 상속 재산을 침탈해서는 안 된다
  rationale: 본문은 단순한 사유재산 보호를 넘어, 지도자의 권력이 백성의 토지 상속을 침해하지 못하도록 제한하는 언약적 정의를 강조합니다.
  doctrine_reference: 에스겔 46장의 성전-토지 질서, 언약 공동체의 공의
