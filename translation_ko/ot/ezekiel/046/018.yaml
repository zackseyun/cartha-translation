  text: וְ/לֹא יִקַּ֨ח הַ/נָּשִׂ֜יא מִ/נַּחֲלַ֣ת הָ/עָ֗ם לְ/הֽוֹנֹתָ/ם֙ מֵ/אֲחֻזָּתָ֔/ם מֵ/אֲחֻזָּת֖/וֹ יַנְחִ֣ל אֶת בָּנָ֑י/ו לְמַ֨עַן֙ אֲשֶׁ֣ר לֹֽא יָפֻ֣צוּ עַמִּ֔/י אִ֖ישׁ מֵ/אֲחֻזָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/018.yaml
  text: The prince shall not take any of the people's inheritance[a], thrusting them out of their property. He shall give his sons an inheritance out of his own property, so that my people may not be scattered[b], each man from his property.
  footnotes:
  - marker: a
    text: Or 'wronging them' or 'defrauding them' for 'oppressing them.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each man'; the expression is distributive, meaning each individual among the people.
    reason: lexical_alternative
translation:
  language: ko
  text: 지도자는 백성의 유산 중 아무것도 빼앗아 그들을 그들의 소유에서 몰아내서는 안 됩니다. 그는 자기 소유에서 자기 아들들에게 유산을 주어야 하니, 이는 내 백성이 각기 자기 소유에서 흩어지지 않게 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유산’은 כאן의 נַחֲלָה가 지닌 토지 상속·세습 재산의 뜻을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘각기’는 히브리어 אִישׁ의 분배적 의미(각 사람, 각자)를 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּשִׂיא
  english_pob_choice: the prince
  chosen_korean: 지도자
  alternatives_korean:
  - 왕자
  - 통치자
  lexicon: HALOT
  rationale: 에스겔에서 נָשִׂיא는 왕이 아니라 공동체의 공식적 수장을 가리키므로, 위계는 살리되 군주제 뉘앙스는 피하는 ‘지도자’가 적절합니다.
- source_word: יִקַּח מִנַּחֲלַת הָעָם
  english_pob_choice: take any of the people's inheritance
  chosen_korean: 백성의 유산 중 아무것도 빼앗아
  alternatives_korean:
  - 백성의 유산에서 취하여
  - 백성의 유산을 탈취하여
  lexicon: HALOT
  rationale: לָקַח + מִן은 소유에서 취하는 행위를 뜻하므로, 상속·토지 맥락을 살려 ‘유산’을 쓰고, 분배성을 반영해 ‘아무것도’로 자연스럽게 옮겼습니다.
- source_word: לְהוֹנֹתָם
  english_pob_choice: thrusting them out of their property / oppressing them
  chosen_korean: 그들을 그들의 소유에서 몰아내
  alternatives_korean:
  - 그들을 압제하여
  - 그들을 속여 빼앗아
  lexicon: HALOT
  rationale: 이 동사는 단순한 속임수보다 강제적 착취·박탈의 뜻을 띠므로, 토지 상실의 결과를 직접 드러내는 ‘몰아내다’가 본문 문맥에 가장 가깝습니다.
- source_word: מֵאֲחֻזָּתָם / מֵאֲחֻזָּתוֹ
  english_pob_choice: out of their property / out of his own property
  chosen_korean: 그들의 소유 / 자기 소유
  alternatives_korean:
  - 그들의 소유지 / 자기 소유지
  - 그들의 보유분 / 자기 보유분
  lexicon: HALOT
  rationale: אֲחֻזָּה는 토지·세습 재산을 가리키므로, 현대 한국어에서 직관적인 ‘소유’로 일관되게 옮겨 소유권 대조를 살렸습니다.
- source_word: לְמַעַן אֲשֶׁר לֹא יָפֻצוּ עַמִּי אִישׁ מֵאֲחֻזָּתוֹ
  english_pob_choice: so that my people may not be scattered, each man from his property
  chosen_korean: 내 백성이 각기 자기 소유에서 흩어지지 않게 하려는 것입니다
  alternatives_korean:
  - 내 백성이 각 사람 자기 소유에서 흩어지지 않게 하려는 것입니다
  - 내 백성이 자기 소유에서 제각기 흩어지지 않게 하려는 것입니다
  lexicon: HALOT
  rationale: פּוּץ는 ‘흩다/흩어지다’의 이미지를 유지하는 것이 좋고, אִישׁ의 분배적 용법은 ‘각기’로 자연스럽게 전달할 수 있어 본문 흐름을 매끄럽게 했습니다.
theological_decisions:
- issue: 지배자의 재산 침탈 금지와 상속 질서
  chosen_reading: 지도자는 백성의 유산을 빼앗아 그들을 몰아내서는 안 되며, 자기 아들들의 유산은 자기 소유에서 주어야 한다는 사회·토지 윤리를 분명히 드러냈습니다.
  alternative_readings:
  - 지도자는 백성의 기업을 취해서는 안 된다
  - 지도자는 백성의 상속 재산을 침탈해서는 안 된다
  rationale: 본문은 단순한 사유재산 보호를 넘어, 지도자의 권력이 백성의 토지 상속을 침해하지 못하도록 제한하는 언약적 정의를 강조합니다.
  doctrine_reference: 에스겔 46장의 성전-토지 질서, 언약 공동체의 공의
