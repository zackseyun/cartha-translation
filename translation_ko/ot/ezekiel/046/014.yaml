  rationale: 희귀 동사 רוּס의 뜻을 따라 단순한 ‘섞다’보다 ‘적시다’를 택했고, 기름의 용도를 문맥상 자연스럽게 연결했습니다.
- source_word: חֻקּוֹת עוֹלָם תָּמִיד
