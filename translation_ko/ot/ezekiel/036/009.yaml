base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/009.yaml
  text: For behold[a], I am for you, and I will turn to you, and you will be cultivated and sown.
  footnotes:
  - marker: a
    text: Or 'I am toward you.' The Hebrew expression conveys the LORD's favorable orientation toward the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 보십시오, 내가 너희를 위한다[a]. 내가 너희에게로 돌이키겠다. 너희는 경작되고 씨가 뿌려질 것이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 너희에게로 향해 있다.’ 이 히브리어 표현은 땅을 향한 야훼의 호의적인 방향성을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי / הִנְנִי
  english_pob_choice: For behold
  chosen_korean: 그러므로 보십시오, 내가
  alternatives_korean:
  - 보십시오, 내가
  - 이는 내가
  lexicon: HALOT
  rationale: כִּי의 연결성과 הִנְנִי의 주의를 끄는 선지자적 도입을 함께 살리기 위해 원인·전환의 연결어와 감탄형 호명으로 옮겼습니다.
- source_word: אֲלֵיכֶם
  english_pob_choice: I am for you
  chosen_korean: 너희를 위하며
  alternatives_korean:
  - 너희에게로
  - 너희를 향하여
  lexicon: HALOT
  rationale: 여기서는 단순한 방향보다 야훼의 호의적 태도와 유익한 편향이 핵심이므로, ‘위하다’로 관계적 유익을 드러냈습니다.
- source_word: וּפָנִיתִי אֲלֵיכֶם
  english_pob_choice: I will turn to you
  chosen_korean: 너희에게로 돌이키겠습니다
  alternatives_korean:
  - 너희를 돌아보겠습니다
  - 너희에게로 향하겠습니다
  lexicon: HALOT
  rationale: ‘돌다/향하다’의 관용구를 자연스러운 현대 한국어로 살리되, 하나님의 호의적 개입을 나타내는 동작성을 유지했습니다.
- source_word: וְנֶעֱבַדְתֶּם
  english_pob_choice: you will be cultivated
  chosen_korean: 너희는 경작되고
  alternatives_korean:
  - 너희는 일구어지고
  - 너희는 갈아엎어지고
  lexicon: HALOT
  rationale: נפעל형의 수동적 농경 의미를 반영해 인간의 ‘섬김’이 아니라 땅의 ‘경작’으로 옮겼습니다.
- source_word: וְנִזְרַעְתֶּם
  english_pob_choice: and sown
  chosen_korean: 심어질 것입니다
  alternatives_korean:
  - 뿌려질 것입니다
  - 파종될 것입니다
  lexicon: HALOT
  rationale: 씨를 뿌려 심는 농업 이미지가 분명하므로 현대 한국어에서 이해가 쉬운 ‘심어질’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 ‘너희를 위함’이라는 관계적 표현
  chosen_reading: 언약적 호의와 회복의 방향성을 직접적으로 드러내는 표현으로 이해했습니다.
  alternative_readings:
  - 중립적 방향 표시로만 이해
  - 문자적으로 ‘너희에게로’로만 번역
  rationale: 문맥상 산들과 땅의 회복을 향한 야훼의 선의가 강조되므로, 단순한 위치 이동보다 긍정적 관계 전환을 드러내는 번역이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; preserve the source''s plain sense.'
