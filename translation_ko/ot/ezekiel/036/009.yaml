- from: 그러므로 보십시오, 내가 너희를 위하며 너희에게로 돌이키겠습니다. 너희는 경작되고 심어질 것입니다.[a]
  to: 이는 보십시오, 내가 너희를 위한다[a]. 내가 너희에게로 돌이키겠다. 너희는 경작되고 씨가 뿌려질 것이다.
  rationale: 접속사 כִּי의 근거 제시 기능을 ‘이는’으로, הִנְנִי의 주의 환기 기능을 ‘보십시오’로 유지했습니다. 첫 אֲלֵיכֶם은 문맥상의 호의적 지향을 반영하여 ‘너희를 위한다’로 옮기되, 방향적 대안을 각주에 보존했습니다. 두 번째 אֲלֵיכֶם은 פנה의 방향 표현을 따라 ‘너희에게로 돌이키겠다’로 번역했습니다. 마지막 두 니팔 동사는 토지의 수동 농경 행위를 드러내도록 ‘경작되고 씨가 뿌려질 것이다’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
