id: EZK.36.38
reference: Ezekiel 36:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/צֹ֣אן קָֽדָשִׁ֗ים כְּ/צֹ֤אן יְרוּשָׁלִַ֨ם֙ בְּ/מ֣וֹעֲדֶ֔י/הָ כֵּ֤ן תִּהְיֶ֨ינָה֙ הֶ/עָרִ֣ים הֶ/חֳרֵב֔וֹת מְלֵא֖וֹת צֹ֣אן אָדָ֑ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/038.yaml
  text: Like the holy flock[a], like the flock of Jerusalem at her appointed feasts, so the ruined cities will be filled with flocks of people. Then they will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or “filled with human flocks” or “filled with people like a flock.” The Hebrew literally reads “filled with flocks of men,” preserving the image of people multiplied like sacrificial sheep in Jerusalem at festival times.
    reason: lexical_alternative
translation:
  language: ko
  text: 거룩한 양떼처럼, 예루살렘의 절기 때의 양떼처럼, 폐허가 된 성읍들은 사람의 양떼[a]로 가득 차게 될 것입니다. 그러면 그들은 내가 야훼임을 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “사람의 양 떼로 가득 찬”이라고 합니다. 또는 “사람들로 가득 찬” 또는 “양떼처럼 많은 사람들로 가득 찬”으로 옮길 수 있습니다. 이는 절기 때 예루살렘에 있던 양 떼에 빗대어 사람들이 크게 불어나는 모습을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצֹאן קָדָשִׁים
  english_pob_choice: Like the holy flock
  chosen_korean: 거룩한 양떼처럼
  alternatives_korean:
  - 성스러운 양떼처럼
  - 거룩한 떼처럼
  lexicon: HALOT
  rationale: צֹאן은 집합적으로 ‘양떼/양무리’가 자연스럽고, קָדָשִׁים은 제의적·구별된 성격의 ‘거룩한’으로 옮기는 것이 문맥에 맞습니다.
- source_word: כְּצֹאן יְרוּשָׁלִַם בְּמוֹעֲדֶי/הָ
  english_pob_choice: like the flock of Jerusalem at her appointed feasts
  chosen_korean: 예루살렘이 자기 절기들에 모였던 양떼처럼
  alternatives_korean:
  - 예루살렘의 절기 때의 양떼처럼
  - 예루살렘의 정해진 절기마다의 양떼처럼
  lexicon: HALOT
  rationale: מוֹעֵד는 여기서 ‘정한 때’보다 제의적 ‘절기’가 더 직접적이며, ‘모였던’은 절기 때 예루살렘에 모여든 제의적 장면을 살립니다.
- source_word: מְלֵאוֹת צֹאן אָדָם
  english_pob_choice: will be filled with flocks of people
  chosen_korean: 사람의 양떼로 가득 차게 될 것입니다
  alternatives_korean:
  - 사람들로 가득 차게 될 것입니다
  - 인간 양떼로 가득 차게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 직유적 이미지인 ‘양떼/사람’의 결합을 살리되, 한국어에서는 ‘사람의 양떼’가 가장 자연스럽고 원문 대비 이미지를 덜 약화합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 언약명 יהוה는 본 프로젝트 기본값대로 ‘야훼’로 옮겨, 호칭 대체 없이 고유한 신명 자체를 드러냅니다.
theological_decisions:
- issue: 절기와 제의적 양떼 이미지의 보존
  chosen_reading: ‘모였던 양떼’와 ‘사람의 양떼’로 옮겨, 폐허가 된 성읍이 제의적 풍요와 인구 충만의 이미지로 채워지는 대비를 유지했습니다.
  alternative_readings:
  - 단순히 ‘절기들에’만 옮겨 더 평이하게 처리
  - 이미지를 평탄화하여 ‘사람들로 가득 차게 될 것입니다’로만 번역
  rationale: 이 절은 ירושלים/מוֹעֵד/צֹאן의 결합으로 제의적 회복을 그리므로, 너무 평탄한 표현은 원문의 상징력을 약화시킵니다.
  doctrine_reference: 'POB 번역 원칙: source-direct imagery preservation'
- issue: יְהוָה의 신명 처리
  chosen_reading: ‘야훼’
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본문은 단순한 칭호가 아니라 신명 עצמו를 사용하므로, 독자가 그 언약적 이름을 직접 보게 하는 것이 본문 의미를 더 정확히 드러냅니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה → Yahweh
