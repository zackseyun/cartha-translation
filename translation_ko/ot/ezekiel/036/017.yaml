id: EZK.36.17
reference: Ezekiel 36:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֶּן אָדָ֗ם בֵּ֤ית יִשְׂרָאֵל֙ יֹשְׁבִ֣ים עַל אַדְמָתָ֔/ם וַ/יְטַמְּא֣וּ אוֹתָ֔/הּ בְּ/דַרְכָּ֖/ם וּ/בַ/עֲלִֽילוֹתָ֑/ם כְּ/טֻמְאַת֙ הַ/נִּדָּ֔ה הָיְתָ֥ה דַרְכָּ֖/ם לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/017.yaml
  text: Son of man[a], when the house of Israel was dwelling on their own land, they defiled it by their way and by their deeds; their way before me was like the uncleanness of a menstruating woman.
  footnotes:
  - marker: a
    text: Or 'like menstrual uncleanness' or 'like the impurity of menstruation.' The Hebrew compares Israel's conduct to the ritual impurity associated with menstruation.
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 이스라엘 집이 자기 땅에 거주하던 때에 그들이 자기들의 길과 자기들의 행위로 그 땅을 더럽혔습니다. 그들의 길은 내 앞에서 월경하는 여자의 부정과 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘월경 부정’이나 ‘월경의 부정함’으로 옮길 수 있습니다. 히브리어는 이스라엘의 행위를 월경과 관련된 의례적 부정에 견줍니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔에서 반복되는 예언자 호칭이므로, 직역 의미를 살리면서도 한국어 성경에서 통용되는 형식을 유지하기 위해 ‘인자’로 옮겼습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘의 집
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 공동체 전체를 가리키는 언약적 표현이므로, ‘집’의 집합적 의미를 보존하는 쪽을 택했습니다.
- source_word: וַיְטַמְּאוּ אוֹתָהּ / כְּטֻמְאַת הַנִּדָּה
  english_pob_choice: they defiled it / like the uncleanness of a menstruating woman
  chosen_korean: 더럽혔습니다 / 월경하는 여자의 부정
  alternatives_korean:
  - 부정하게 했습니다 / 월경의 부정
  - 더럽혔습니다 / 생리 부정
  lexicon: HALOT
  rationale: 본문의 정결-부정 어휘와 직접 연결되는 표현을 살리기 위해 ‘더럽혔습니다’, ‘부정’으로 옮겼습니다. 또한 심상을 완화하지 않고 원문의 비교를 드러내기 위해 월경 관련 이미지를 유지했습니다.
- source_word: לְפָנַי
  english_pob_choice: before me
  chosen_korean: 내 앞에서
  alternatives_korean:
  - 내 앞에
  - 내 면전에
  lexicon: HALOT
  rationale: 하나님 앞에서의 평가와 판정의 뉘앙스를 자연스럽게 드러내면서도, 원문의 관계적·법정적 의미를 유지하기 위해 ‘내 앞에서’로 번역했습니다.
theological_decisions:
- issue: 월경 부정 비유의 보존
  chosen_reading: 정결법의 이미지를 약화하지 않고, 이스라엘의 행위를 의례적·도덕적 부정으로 그대로 드러내는 번역을 택했습니다.
  alternative_readings:
  - ‘더럽힘’만 남기고 월경 관련 비교를 완화하는 번역
  - ‘오염’처럼 일반화한 번역
  rationale: 본문은 단순한 사회적 혐오가 아니라, 언약 공동체와 땅의 관계를 정결 규정의 언어로 평가합니다. 따라서 비유를 완화하지 않는 것이 본문의 신학을 더 정확히 보존합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: ‘인자야’의 호칭 유지
  chosen_reading: 에스겔의 반복되는 예언자 호칭을 ‘인자야’로 유지했습니다.
  alternative_readings:
  - ‘사람아’로 일반화
  - ‘인간아’로 현대화
  rationale: 호칭의 문학적 기능과 책 전체의 반복성을 살리기 위해, 익숙한 성경적 표현을 유지하는 것이 본문 이해에 유리합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
