    text: 또는, ‘황폐했던 땅은 경작될 것이며, 전에는 지나가는 모든 사람이 보는 앞에서 황무지였습니다.’
    reason: 원문의 대조 구문(‘…였던 것 대신에/그와 달리’)을 두 절로 풀어 옮긴 대안입니다.
