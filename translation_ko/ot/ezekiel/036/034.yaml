  rationale: 관용구의 공개적·가시적 성격을 살리되 한국어로 자연스럽게 옮기기 위해 ‘눈앞에서’를 사용했습니다.
theological_decisions:
- issue: ‘instead of being a desolation’의 대비 구조
  chosen_reading: ‘황폐한 것이었던 대신에’로 과거의 황폐함과 앞으로의 경작됨을 분명히 대비했습니다.
  alternative_readings:
  - ‘황폐함 대신에’
  - ‘황폐했던 상태에서’
  rationale: תַּחַת אֲשֶׁר는 단순 시간 설명이 아니라 상태의 대조/대체를 나타내므로, 회복의 반전을 분명히 드러내는 표현이 필요합니다.
  doctrine_reference: 회복 예언의 대조적 수사
- issue: ‘l eynay’의 공개적 목격성
  chosen_reading: ‘눈앞에서’로 번역하여 회복이 사적 사건이 아니라 모두가 보게 되는 공개적 표지임을 살렸습니다.
  alternative_readings:
  - ‘보는 앞에서’
  - ‘목격하는 가운데’
  rationale: 본문의 초점은 토지 회복의 가시성과 공적 증언성에 있으므로, 관찰 가능성을 분명히 하는 표현이 문맥에 맞습니다.
  doctrine_reference: 예언 성취의 공개성
