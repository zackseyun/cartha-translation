  to: 내가 다시는 네게 민족들의 수치를 듣게 하지 않겠고, 네가 다시는 백성들의 모욕을 감당하지 않을 것이며, 네 민족을 다시는 넘어지게 하지 않을 것이다.[a] 주 야훼께서 선언하십니다.
  rationale: 하나님이 하시는 일(‘듣게 하지 않겠다’)과 피호칭자가 더 이상 하지 않을 일(‘감당하지 않을 것이다’, ‘넘어지게 하지 않을 것이다’)을 히브리어의 문법에 따라 구분했습니다. 마지막 난구는 마소라 본문의 모음화에 따른 번역을 본문에 두고, 대안적 해석은 정확한 위치에 각주로 제시했습니다. ‘민족들/백성들’의 구별은 본문에서 보존하되, 단순한 어휘 구별 자체를 설명하던 기존 각주는 의미 있는 난구 각주로 교체했습니다.
