  source_fidelity: 수치와 모욕을 더 이상 듣거나 감당하지 않게 된다는 앞의 두 절은 대체로 충실합니다. 그러나 마지막 절의 תַכְשִׁלִי는 2인칭 여성 단수 미완료로, 피호칭자가 ‘네 민족을 더 이상 넘어지게 하지 않을 것’이라는 내용입니다. 초안의 ‘넘어뜨리지 않게 하겠고’는 하나님이 피호칭자가 그렇게 하지 못하게 만드신다는 사역 구문으로 바꾸어 주어와 의미 관계를 변경합니다. 또한 난해한 וְגוֹיִךְ ... תַכְשִׁלִי 구절의 대안 독법을 반영한 각주가 필요합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체에서 예언적 선언으로 자연스럽습니다. ‘민족들’과 ‘백성들’을 구별해 히브리어의 병행 표현을 과도하게 평준화하지 않았으며, ‘모욕을 감당하다’는 חֶרְפָּה를 문맥에 맞게 표현합니다.
