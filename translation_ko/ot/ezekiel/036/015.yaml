  text: וְ/לֹא אַשְׁמִ֨יעַ אֵלַ֤יִ/ךְ עוֹד֙ כְּלִמַּ֣ת הַ/גּוֹיִ֔ם וְ/חֶרְפַּ֥ת עַמִּ֖ים לֹ֣א תִשְׂאִי ע֑וֹד ו/גוי/ך לֹא תַכְשִׁ֣לִי ע֔וֹד נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/015.yaml
  text: And I will no longer let you hear the disgrace of the nations[a], and you will no longer bear the reproach of the peoples, and you will no longer cause your nation to stumble, declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'make your nation fall' or, following another interpretive tradition, 'bereave your nation.' The Hebrew consonantal text here is difficult; the Masoretic vocalization supports 'cause your nation to stumble.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 다시는 너에게 민족들의 수치와, 민족들의 비난을 듣게 하지 않겠고, 네가 다시는 네 민족을 넘어뜨리지 않게 하겠다고 — 주 하나님이 선언하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘민족들’은 הַגּוֹיִם과 עַמִּים의 구분을 살리기 위한 번역입니다. 두 표현은 의미가 겹치지만, 앞은 주변 이방 민족들, 뒤는 더 넓은 민족 집단을 가리키는 수사적 평행으로 읽을 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וְ/לֹא אַשְׁמִ֨יעַ אֵלַ֤יִ/ךְ עוֹד֙
  english_pob_choice: I will no longer let you hear
  chosen_korean: 내가 다시는 너에게 … 듣게 하지 않겠고
  alternatives_korean:
  - 내가 다시는 너에게 … 들리게 하지 않겠고
  - 내가 다시는 너로 하여금 … 듣게 하지 않겠고
  lexicon: HALOT
  rationale: 히필 אַשְׁמִיעַ의 사역적 의미를 살리되, 한국어에서는 ‘듣게 하지 않겠다’가 가장 자연스럽게 원인의 제거를 드러냅니다.
- source_word: כְּלִמַּת הַגּוֹיִם
  english_pob_choice: the disgrace of the nations
  chosen_korean: 민족들의 수치
  alternatives_korean:
  - 민족들의 치욕
  - 열방의 수치
  lexicon: HALOT
  rationale: כְּלִמָּה/כְּלִמַּת은 공적 수치의 뜻이 강하므로 ‘수치’로 옮겼고, הַגּוֹיִם은 이 문맥의 이방 민족들을 가리켜 ‘민족들’로 옮겼습니다.
- source_word: וְ/חֶרְפַּ֥ת עַמִּ֖ים
  english_pob_choice: the reproach of the peoples
  chosen_korean: 민족들의 비난
  alternatives_korean:
  - 백성들의 수욕
  - 민족들의 조롱
  lexicon: HALOT
  rationale: חֶרְפָּה는 수치보다 한층 더 노골적인 모욕·비난의 뉘앙스가 있어, 앞의 ‘수치’와 구별되도록 ‘비난’으로 옮겼습니다.
- source_word: ו/גוי/ך
  english_pob_choice: your nation
  chosen_korean: 네 민족
  alternatives_korean:
  - 너의 나라
  - 네 백성
  lexicon: HALOT
  rationale: 2인칭 여성 단수 접미사가 붙은 גוי는 여기서 공격의 대상이 되는 그들의 집단을 가리키므로, 한국어에서는 ‘네 민족’이 가장 직접적입니다.
- source_word: תַכְשִׁ֣לִי
  english_pob_choice: cause your nation to stumble
  chosen_korean: 네 민족을 넘어뜨리지 않게 하겠고
  alternatives_korean:
  - 네 민족이 넘어지게 하지 않겠고
  - 네 민족을 실족하게 하지 않겠고
  lexicon: HALOT
  rationale: MT의 모음화는 כשל의 ‘넘어지다/실족하다’ 의미를 지지하므로, POB의 해석에 따라 ‘넘어뜨리다’로 옮겨 원인-결과 관계를 살렸습니다.
- source_word: נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님이 선언하십니다
  alternatives_korean:
  - 주 하나님이 말씀하십니다
  - 주 야훼께서 선언하십니다
  lexicon: HALOT
  rationale: נְאֻם은 예언적 선포 공식이므로 ‘선언하십니다’로 옮겼고, אֲדֹנָי יְהוִה는 한국어 관용에 맞게 ‘주 하나님’으로 처리했습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 예언적 선언 공식의 한국어 처리
  chosen_reading: 본문은 ‘주 하나님’으로 번역하고, 예언자의 확언 종결을 ‘선언하십니다’로 옮겼습니다.
  alternative_readings:
  - 주 야훼께서 선언하십니다
  - 주 여호와께서 말씀하십니다
  rationale: 이 절의 초점은 신명 자체보다 심판 철회의 확언이므로, 본문 가독성을 위해 한국어 합쇼체 관용을 우선하되 하나님의 발화권위를 분명히 드러냈습니다.
