source:
  edition: WLC
  text: וְ/זָרַקְתִּ֧י עֲלֵי/כֶ֛ם מַ֥יִם טְהוֹרִ֖ים וּ/טְהַרְתֶּ֑ם מִ/כֹּ֧ל טֻמְאוֹתֵי/כֶ֛ם וּ/מִ/כָּל גִּלּ֥וּלֵי/כֶ֖ם אֲטַהֵ֥ר אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/025.yaml
  text: And I will sprinkle clean water on you[a], and you will be clean; from all your uncleannesses and from all your idols I will cleanse you.
  footnotes:
  - marker: a
    text: Or, more literally, 'from all your dung-idols'; Ezekiel often uses a deliberately contemptuous term for idols.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희 위에 정결한 물을 뿌리겠습니다. 그러면 너희가 정결해질 것이며, 내가 너희의 모든 더러움과 모든 우상[a]에게서 너희를 정결하게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘너희의 모든 똥 우상’; 에스겔은 우상을 가리킬 때 의도적으로 경멸적인 표현을 자주 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַקְתִּי
  english_pob_choice: And I will sprinkle
  chosen_korean: 내가 … 뿌리면
  alternatives_korean:
  - 내가 … 뿌리겠습니다
  - 내가 … 흩뿌리겠습니다
  lexicon: HALOT
  rationale: זרק은 제의적 정결 문맥에서 '뿌리다'가 가장 자연스럽고, 물과 정결 이미지를 함께 살립니다.
- source_word: מַיִם טְהוֹרִים
  english_pob_choice: clean water
  chosen_korean: 깨끗한 물
  alternatives_korean:
  - 정결한 물
  - 맑은 물
  lexicon: HALOT
  rationale: טָהוֹר의 정결 의미를 살리되, 현대 한국어에서 자연스럽고 반복되는 '깨끗해지다/깨끗하게 하다'와 연결됩니다.
- source_word: וּטְהַרְתֶּם / אֲטַהֵר אֶתְכֶם
  english_pob_choice: and you will be clean / I will cleanse you
  chosen_korean: 너희가 깨끗해질 것이며 … 너희를 깨끗하게 하겠습니다
  alternatives_korean:
  - 너희가 정결해질 것이며 … 너희를 정결하게 하겠습니다
  - 너희가 깨끗할 것이며 … 너희를 깨끗하게 하겠습니다
  lexicon: HALOT
  rationale: 같은 어근 טהר의 반복을 한국어에서도 '깨끗하다/깨끗하게 하다'로 대응해, 결과 상태와 행위의 구분을 유지했습니다.
- source_word: גִּלּוּלֵיכֶם
  english_pob_choice: all your idols
  chosen_korean: 너희의 모든 우상
  alternatives_korean:
  - 너희의 모든 우상들
  - 너희의 모든 똥 우상
  lexicon: HALOT
  rationale: 주본문은 가장 분명한 의미의 '우상'으로 옮기되, 히브리어의 경멸적 뉘앙스는 본문이 아니라 각주로 처리하는 편이 적절합니다.
theological_decisions:
- issue: 정결 이미지의 범위
  chosen_reading: 정결 예식의 이미지를 살리되, 본문에 세례나 특정 교리적 메커니즘을 직접 넣지 않았습니다.
  alternative_readings:
  - 세례적 예표로 본문에 반영
  - 주로 도덕적 갱신으로 축소
  rationale: 히브리어 본문은 하나님이 더러움과 우상으로부터 백성을 깨끗하게 하시는 회복 선언을 말하므로, 후대 신학적 연관성은 열어 두되 본문 자체의 의미를 좁히지 않아야 합니다.
  doctrine_reference: '번역 철학 §3: 신학적 긴장을 보존한다.'
