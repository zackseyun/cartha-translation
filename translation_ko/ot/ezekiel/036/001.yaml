  lexicon: HALOT
  rationale: 원문의 지리적 의인화와 반복되는 호칭을 살리기 위해 ‘산들’을 유지했습니다. ‘산지’는 의미는 가능하지만 호칭의 생생함이 약해집니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 여호와의 말씀
  - 주의 말씀
  - 하나님의 말씀
  lexicon: HALOT
  rationale: 본문의 신명(יהוה)을 POB 기준에 따라 ‘야훼’로 옮기고, 예언 공식인 ‘말씀’을 그대로 보존했습니다.
theological_decisions:
- issue: 예언 대상인 산들을 직접 청자처럼 부르는 의인화
  chosen_reading: 산들을 향한 직접 호칭을 그대로 유지했습니다.
  alternative_readings:
