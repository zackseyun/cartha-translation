base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/001.yaml
  text: And you[a], son of man, prophesy to the mountains of Israel, and say, ‘Mountains of Israel[c][b], hear the word of Yahweh.’
  footnotes:
  - marker: a
    text: Or 'hill country of Israel.' The Hebrew literally says 'mountains of Israel,' and the main text keeps the personified geographical imagery.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD' represents the divine name YHWH; alternatively, 'Yahweh.'
    reason: alternative_reading
  - marker: c
    text: Or 'mortal' for 'son of man'; the main text preserves Ezekiel’s recurring form of address.
    reason: lexical_alternative
translation:
  language: ko
  text: 인자여[c], 이스라엘의 산들[a]을 향하여 예언하고 이렇게 말하십시오. “이스라엘의 산들아, 야훼[b]의 말씀을 들으십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 산지’. 히브리어는 문자적으로 ‘이스라엘의 산들’이며, 본문은 산들을 직접 부르는 의인화된 표현을 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 신명 יְהוָה를 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘사람의 아들’. 에스겔서에서 에스겔을 부르는 반복적인 호칭입니다.
    reason: lexical_alternative
