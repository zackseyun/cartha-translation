  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הִנָּבֵ֖א אֶל הָרֵ֣י יִשְׂרָאֵ֑ל וְ/אָ֣מַרְתָּ֔ הָרֵי֙ יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/001.yaml
  text: And you[a], son of man, prophesy to the mountains of Israel, and say, ‘Mountains of Israel[c][b], hear the word of Yahweh.’
  footnotes:
  - marker: a
    text: Or 'hill country of Israel.' The Hebrew literally says 'mountains of Israel,' and the main text keeps the personified geographical imagery.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD' represents the divine name YHWH; alternatively, 'Yahweh.'
    reason: alternative_reading
  - marker: c
    text: Or 'mortal' for 'son of man'; the main text preserves Ezekiel’s recurring form of address.
    reason: lexical_alternative
translation:
  language: ko
  text: 너, 인자야, 이스라엘의 산들을 향해 예언하여 말하라. 「이스라엘의 산들아, 야훼의 말씀을 들으라」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘의 산들’은 문자적으로 ‘이스라엘의 산들’이며, 본문은 이 지리적 표현을 의인화된 호칭으로 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 신명 יְהוָה는 본문에서 ‘야훼’로 옮겼습니다.
    reason: ot_citation
  - marker: c
    text: ‘인자’는 여기서 메시아 칭호가 아니라 에스겔에게 반복되는 선지자적 호칭입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인간아
  - 죽을 자야
  lexicon: HALOT
  rationale: 에스겔에서 반복되는 신적 호칭을 문학적으로 유지하기 위해 직역적 어감의 ‘인자’를 택했습니다. 이는 여기서 기독론적 칭호가 아니라 선지자에게 주어지는 호칭입니다.
- source_word: הִנָּבֵא
  english_pob_choice: prophesy
  chosen_korean: 예언하여
  alternatives_korean:
  - 예언하라
  - 선포하여
  - 예언해
  lexicon: HALOT
  rationale: 예언자적 사명을 나타내는 명령형으로, 현대 한국어에서 자연스러운 합쇼체 명령을 살려 ‘예언하여’로 옮겼습니다.
- source_word: הָרֵי יִשְׂרָאֵל
  english_pob_choice: the mountains of Israel
  chosen_korean: 이스라엘의 산들
  alternatives_korean:
  - 이스라엘의 산악 지대
  - 이스라엘의 언덕들
  - 이스라엘의 산지
  lexicon: HALOT
  rationale: 원문의 지리적 의인화와 반복되는 호칭을 살리기 위해 ‘산들’을 유지했습니다. ‘산지’는 의미는 가능하지만 호칭의 생생함이 약해집니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 여호와의 말씀
  - 주의 말씀
  - 하나님의 말씀
  lexicon: HALOT
  rationale: 본문의 신명(יהוה)을 POB 기준에 따라 ‘야훼’로 옮기고, 예언 공식인 ‘말씀’을 그대로 보존했습니다.
theological_decisions:
- issue: 예언 대상인 산들을 직접 청자처럼 부르는 의인화
  chosen_reading: 산들을 향한 직접 호칭을 그대로 유지했습니다.
  alternative_readings:
  - 이스라엘 땅에 대해 말하라
  - 이스라엘 산지에 선포하라
  rationale: 본문은 단순한 지리 언급이 아니라 산들을 청자로 세우는 수사이므로, 그 의인화를 약화하지 않도록 직접 화법을 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5; source-grounded literary imagery
