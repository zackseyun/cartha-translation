  text: וָ/אָפִ֤יץ אֹתָ/ם֙ בַּ/גּוֹיִ֔ם וַ/יִּזָּר֖וּ בָּ/אֲרָצ֑וֹת כְּ/דַרְכָּ֥/ם וְ/כַ/עֲלִילוֹתָ֖/ם שְׁפַטְתִּֽי/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/019.yaml
  text: So I scattered them among the nations[a], and they were dispersed through the lands; I judged them according to their ways and according to their deeds.
  footnotes:
  - marker: a
    text: Or 'they were scattered through the countries.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 민족들 가운데에 흩었더니, 그들은 여러 땅에 퍼졌습니다. 내가 그들의 길과 그들의 행위대로 그들을 심판했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 여러 나라에 흩어졌다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָפִיץ
  english_pob_choice: I scattered
  chosen_korean: 내가 그들을 흩었더니
  alternatives_korean:
  - 내가 그들을 흩어버렸더니
  - 내가 그들을 흩었습니다
  lexicon: HALOT
  rationale: 히필형의 원인적 의미를 살려 하나님이 직접 흩으신 행위를 분명히 하되, 한국어에서는 자연스러운 서술형 ‘흩었더니’로 옮겼습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 민족들 가운데에
  alternatives_korean:
  - 나라들 가운데에
  - 이방 민족들 가운데에
  lexicon: HALOT
  rationale: 여기서는 포로로 흩어진 대상의 외국 집단을 가리키므로 ‘민족들’이 무난하며, ‘이방’은 후대 종교적 뉘앙스를 덧입힐 수 있어 피했습니다.
- source_word: וַיִּזָּרוּ
  english_pob_choice: they were dispersed
  chosen_korean: 그들은 여러 땅에 퍼졌습니다
  alternatives_korean:
  - 그들은 흩어졌습니다
  - 그들은 각 땅으로 흩어졌습니다
  lexicon: HALOT
  rationale: 앞의 능동적 ‘흩음’과 대응되는 결과 상태를 나타내므로, 반복을 피하면서 분산의 결과를 드러내는 ‘퍼졌습니다’를 택했습니다.
- source_word: כְּדַרְכָּם וְכַעֲלִילוֹתָם
  english_pob_choice: according to their ways and according to their deeds
  chosen_korean: 그들의 길과 그들의 행위대로
  alternatives_korean:
  - 그들의 행실과 그들의 행위대로
  - 그들의 삶의 방식과 그들의 행위대로
  lexicon: HALOT
  rationale: ‘길’은 예언서의 도덕적 생활방식을 보존하고, ‘행위’는 심판의 근거가 되는 실제 행동을 간결하게 드러냅니다.
- source_word: שְׁפַטְתִּים
  english_pob_choice: I judged them
  chosen_korean: 그들을 심판했습니다
  alternatives_korean:
  - 그들을 판단했습니다
  - 그들에게 판결을 내렸습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 판단이 아니라 죄에 대한 하나님의 공적 판결을 말하므로, 한국어에서는 ‘심판하다’가 가장 적절합니다.
theological_decisions:
- issue: 하나님이 포로 상태의 주체로 직접 제시되는가
  chosen_reading: 본문의 첫인칭 동사들을 따라, 흩으심과 심판을 모두 하나님의 직접 행위로 옮겼습니다.
  alternative_readings:
  - 수동적으로 옮겨 흩어진 상태만 강조할 수 있습니다.
  - 심판을 약화해 결과만 서술할 수 있습니다.
  rationale: 히브리어는 하나님이 직접 행하신 흩으심과 심판을 분명히 말하므로, 원문의 책임 귀속을 보존하는 번역이 필요합니다.
  doctrine_reference: 원문의 신적 주권과 বিচার적 인과를 흐리지 않고 유지합니다.
