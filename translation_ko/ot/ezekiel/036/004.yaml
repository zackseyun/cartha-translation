source:
  edition: WLC
  text: לָ/כֵן֙ הָרֵ֣י יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְ֠הוִה לֶ/הָרִ֨ים וְ/לַ/גְּבָע֜וֹת לָ/אֲפִיקִ֣ים וְ/לַ/גֵּאָי֗וֹת וְ/לֶ/חֳרָב֤וֹת הַ/שֹּֽׁמְמוֹת֙ וְ/לֶ/עָרִ֣ים הַ/נֶּעֱזָב֔וֹת אֲשֶׁ֨ר הָי֤וּ לְ/בַז֙ וּ/לְ/לַ֔עַג לִ/שְׁאֵרִ֥ית הַ/גּוֹיִ֖ם אֲשֶׁ֥ר מִ/סָּבִֽיב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/004.yaml
  text: 'Therefore[a], mountains of Israel, hear the word of the Lord GOD. Thus says the Lord GOD to the mountains and to the hills, to the ravines and to the valleys[b], to the desolate ruins and to the abandoned cities that have become plunder and mockery to the remnant of the nations that are all around:'
  footnotes:
  - marker: a
    text: Or 'watercourses' or 'channels' for 'ravines' (אֲפִיקִים).
    reason: lexical_alternative
  - marker: b
    text: Or 'the rest of the nations' for 'the remnant of the nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: '그러므로 이스라엘의 산들아, 주 하나님[a]의 말씀을 들으십시오. 주 하나님께서 산들과 언덕들, 골짜기들과 계곡들[b], 황폐한 폐허들과 버려진 도시들에게 이렇게 말씀하십니다. 그 도시들은 사방의 민족의 남은 자에게 약탈과 조롱거리가 되었습니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 אֲדֹנָי יְהוִה의 복합 신칭을 사용합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘물길들’, ‘수로들’로도 옮길 수 있습니다(אֲפִיקִים).
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֵי יִשְׂרָאֵל
  english_pob_choice: mountains of Israel
  chosen_korean: 이스라엘의 산들
  alternatives_korean:
  - 이스라엘 산들
  - 이스라엘의 산악 지대
  lexicon: HALOT
  rationale: 산들을 직접 호명하는 의인화된 예언 خطاب을 살리기 위해 소유격 구조로 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  lexicon: HALOT
  rationale: 히브리어의 복합 신칭을 한국어에서 가장 자연스럽게 나타내면서도, ‘여호와’식 교회 용어로 굳히지 않기 위해 ‘주 하나님’으로 옮겼습니다.
- source_word: אֲפִיקִים
  english_pob_choice: ravines
  chosen_korean: 계곡들
  alternatives_korean:
  - 골짜기들
  - 개울길들
  - 물길들
  lexicon: HALOT
  rationale: 문맥상 지형 목록에서 물길보다 지형성인 ‘계곡’이 한국어 독자에게 더 분명하므로, POB의 ‘ravines’에 대응하는 자연스러운 표현으로 선택했습니다.
- source_word: חֳרָבוֹת הַשֹּׁמְמוֹת
  english_pob_choice: the desolate ruins
  chosen_korean: 황폐한 폐허들
  alternatives_korean:
  - 황량한 폐허들
  - 버려져 황폐한 폐허들
  lexicon: HALOT
  rationale: ‘폐허’가 이미 파괴된 상태를 내포하므로, 형용사로 ‘황폐한’을 붙여 두 요소를 압축해 살렸습니다.
- source_word: שְׁאֵרִית הַגּוֹיִם
  english_pob_choice: the remnant of the nations
  chosen_korean: 사방의 민족의 남은 자
  alternatives_korean:
  - 남은 민족들
  - 주변 민족의 남은 자
  lexicon: HALOT
  rationale: 남아 있는 주변 민족들을 가리키는 표현을 살리되, ‘remnant’의 형태를 반영해 ‘남은 자’로 옮겼습니다.
theological_decisions:
- issue: YHWH를 한국어에서 어떻게 표기할지
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 이 절의 초점은 지명의 총체적 심판 선언이므로, 고유명 표기보다 한국어 예언문에서 즉시 이해되는 호칭을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: שְׁאֵרִית הַגּוֹיִם의 신학적 ‘남은 자’ 용례 여부
  chosen_reading: 사방의 민족의 남은 자
  alternative_readings:
  - 사방의 민족들
  - 사방의 민족 가운데 살아남은 자
  rationale: 여기서는 구속사적 ‘남은 자’ 교리보다, 주변 민족 가운데 남아 있는 집단을 가리키는 평이한 뜻을 우선해 번역했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 5
