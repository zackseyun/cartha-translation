revisions:
- from: '그러므로 이스라엘의 산들아, 주 하나님[a]의 말씀을 들으십시오. 주 하나님께서 산들과 언덕들, 골짜기들과 계곡들[b], 황폐한 폐허들과 버려진 도시들에게 이렇게 말씀하십니다. 그 도시들은 사방의 민족의 남은 자에게 약탈과 조롱거리가 되었습니다:'
  to: '그러므로 이스라엘의 산들아, 주 야훼의 말씀을 들으십시오. 주 야훼께서 산들과 언덕들, 골짜기들[b]과 계곡들, 황폐한 폐허들과 버려진 성읍들, 곧 사방에 있는 민족들 가운데 남은 자들에게 약탈거리와 조롱거리가 된 곳들에게 이렇게 말씀하십니다:'
