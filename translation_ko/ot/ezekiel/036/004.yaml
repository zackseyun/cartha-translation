review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 히브리어에서 '약탈과 조롱거리가 된' 관계절은 황폐한 폐허들과 버려진 성읍들을 함께 수식하는데, 초안은 이를 '그 도시들은'이라는 독립문으로 바꾸어 수식 범위를 성읍들로만 제한했습니다. 또한 אֲפִיקִים과 גֵּאָיוֹת의 지형 목록 순서가 한국어에서 뒤바뀌어 있습니다. יְהוָה는 제공된 POB 신명 방침에 따라 '야훼'로 밝혀 옮기는 것이 일관됩니다.
  naturalness: 수정문은 예언적 직접 호명과 합쇼체를 유지하면서, 긴 수식어를 '곧'으로 연결하여 한국어 문장 구조를 자연스럽게 정리했습니다. '약탈거리와 조롱거리'는 לְבַז וּלְלַעַג의 결과 상태를 자연스럽게 나타냅니다.
  terminology: אֲדֹנָי יְהוִה는 '주 야훼'로, חֳרָבוֹת הַשֹּׁמְמוֹת는 '황폐한 폐허들'로, עָרִים הַנֶּעֱזָבוֹת는 '버려진 성읍들'로 옮겼습니다. שְׁאֵרִית הַגּוֹיִם은 구속론적 의미를 덧붙이지 않고 '민족들 가운데 남은 자들'로 옮겼습니다.
  issues:
  - severity: high
    issue: 관계절의 수식 범위가 성읍들로 제한되었습니다.
    rationale: אֲשֶׁר הָיוּ는 '황폐한 폐허들 및 버려진 성읍들'을 받습니다. '그 도시들은'은 폐허들을 수식 대상에서 제외하고 원문의 종속 구조도 독립문으로 변경합니다.
  - severity: medium
    issue: 아피킴과 게아욧의 번역 순서가 바뀌었습니다.
    rationale: אֲפִיקִים은 골짜기/물길 계열이며, 이어지는 גֵּאָיוֹת는 계곡들입니다. 초안의 '골짜기들과 계곡들'은 자체 주석이 가리키는 어휘와도 순서가 맞지 않습니다.
  - severity: medium
    issue: 신명 표기가 제공된 POB 방침과 일치하지 않습니다.
    rationale: 감사 기록의 현행 신명 방침은 יְהוָה를 'Yahweh'로 옮기는 것입니다. 한국어에서는 복합 칭호를 '주 야훼'로 옮겨 아도나이와 야훼를 모두 반영할 수 있습니다.
