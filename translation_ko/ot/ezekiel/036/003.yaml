id: EZK.36.3
reference: Ezekiel 36:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵן֙ הִנָּבֵ֣א וְ/אָמַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה יַ֣עַן בְּ/יַ֡עַן שַׁמּוֹת֩ וְ/שָׁאֹ֨ף אֶתְ/כֶ֜ם מִ/סָּבִ֗יב לִֽ/הְיוֹתְ/כֶ֤ם מֽוֹרָשָׁה֙ לִ/שְׁאֵרִ֣ית הַ/גּוֹיִ֔ם וַ/תֵּֽעֲל֛וּ עַל שְׂפַ֥ת לָשׁ֖וֹן וְ/דִבַּת עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/003.yaml
  text: 'Therefore prophesy and say[a], Thus says the Lord GOD: Because, indeed because they have made you desolate and have snapped at you from every side, so that you became a possession for the remnant of the nations, and you have come up on the lips of the tongue and in the slander of the people[b],'
  footnotes:
  - marker: a
    text: Or 'have pantingly pursued you,' 'have swallowed you up,' or 'have gasped after you'; the Hebrew verb is difficult and conveys hostile, predatory pressure from the surrounding nations.
    reason: lexical_alternative
  - marker: b
    text: Literally 'you came up on the lip of the tongue,' an idiom meaning that you became the subject of people's speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 예언하고 말하십시오. 주 야훼께서 이렇게 말씀하십니다. “이는 곧, 그들이 너희를 황폐하게 하고 사방에서 너희를 덮쳐 너희가 남은 민족들의 소유가 되게 하였으며, 너희가 사람들의 입에 오르고 백성의 비방거리가 되었기 때문입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 שָׁאֹף은 뜻이 어려워, ‘덮쳐’ 외에도 ‘헐떡이며 추격하다’, ‘삼키다’, ‘욕심내어 달려들다’ 등으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘혀의 입술 위에 올라오다’로, 사람들의 말거리 또는 회자되는 대상이 되었다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 그래서
  lexicon: HALOT
  rationale: 앞 절의 상황을 받는 추론 표지이므로, 한국어에서도 원인-결과의 연결을 분명히 하는 ‘그러므로’가 가장 자연스럽습니다.
- source_word: הִנָּבֵא וְאָמַרְתָּ
  english_pob_choice: prophesy and say
  chosen_korean: 예언하고 말하십시오
  alternatives_korean:
  - 예언하여 말하시오
  - 예언하여 말씀하십시오
  lexicon: HALOT
  rationale: 에스겔에게 주어진 명령을 현대 한국어 합쇼체로 옮기되, 예언 행위와 발화 행위를 둘 다 살렸습니다.
- source_word: יַעַן בְּיַעַן
  english_pob_choice: Because, indeed because
  chosen_korean: 이는 곧 … 때문입니다
  alternatives_korean:
  - 왜냐하면 … 때문입니다
  - 참으로 … 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 중첩된 인과 강조를 한국어에서 직접 반복하면 다소 부자연스러워서, ‘이는 곧’으로 강조를 살리고 종결에서 이유를 분명히 했습니다.
- source_word: שַׁמּוֹת
  english_pob_choice: they have made you desolate
  chosen_korean: 너희를 황폐하게 하고
  alternatives_korean:
  - 너희를 폐허로 만들고
  - 너희를 황폐화하고
  lexicon: HALOT
  rationale: 도시/땅이 파괴되어 사람이 살 수 없는 상태를 나타내므로, ‘황폐하게 하다’가 문맥에 가장 잘 맞습니다.
- source_word: שָׁאֹף
  english_pob_choice: have snapped at you
  chosen_korean: 사방에서 너희를 덮쳐
  alternatives_korean:
  - 사방에서 너희를 탐욕스럽게 몰아붙여
  - 사방에서 너희를 삼키려 하여
  lexicon: HALOT
  rationale: 어려운 동사이지만 주변 민족들의 적대적 압박을 나타내므로, 포식적·공세적 뉘앙스를 살린 ‘덮쳐’로 옮겼습니다.
- source_word: וַתֵּעֲלוּ עַל שְׂפַת לָשׁוֹן וְדִבַּת עָם
  english_pob_choice: you have come up on the lips of the tongue and in the slander of the people
  chosen_korean: 사람들의 입에 오르고 백성의 비방거리가 되었기 때문입니다
  alternatives_korean:
  - 사람들의 입에 오르고 백성의 악한 말거리가 되었기 때문입니다
  - 사람들의 입에 오르고 백성의 험담거리가 되었기 때문입니다
  lexicon: HALOT
  rationale: ‘입에 오르다’는 원문의 관용구를 자연스럽게 살리고, דִבָּה는 문맥상 단순한 수군거림보다 ‘비방’이 더 강합니다.
theological_decisions:
- issue: 예언자에게 주어진 발화 형식의 존대
  chosen_reading: ‘예언하고 말하십시오’와 주 야훼의 직접 인용을 현대 합쇼체로 유지했습니다.
  alternative_readings:
  - 명령형 비격식 번역
  - 구약 예언문 특유의 고어체
  rationale: 본문은 예언자에게 주어진 명령이므로 독자 대상 서술은 합쇼체를 유지하고, 하나님의 직접 발화는 격식을 살려 공적 선언으로 들리게 했습니다.
  doctrine_reference: Korean style and discourse register policy
- issue: 히브리어 신명 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본어에 따라 יְהוָה는 ‘야훼’로 옮겨, 이름-호칭의 구분을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
