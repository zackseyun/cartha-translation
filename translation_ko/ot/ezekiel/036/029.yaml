source:
  edition: WLC
  text: וְ/הוֹשַׁעְתִּ֣י אֶתְ/כֶ֔ם מִ/כֹּ֖ל טֻמְאֽוֹתֵי/כֶ֑ם וְ/קָרָ֤אתִי אֶל הַ/דָּגָן֙ וְ/הִרְבֵּיתִ֣י אֹת֔/וֹ וְ/לֹא אֶתֵּ֥ן עֲלֵי/כֶ֖ם רָעָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/029.yaml
  text: I will save you from all your uncleannesses[a], and I will call for the grain and multiply it[b], and I will not bring famine upon you.
  footnotes:
  - marker: a
    text: Or 'from all your impurities' or 'from all your defilements.' The Hebrew uses impurity language that can include both ritual and moral uncleanness.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will summon the grain.' The Hebrew pictures God as calling for the grain, emphasizing his sovereign command over agricultural abundance.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희를 너희의 모든 더러움에서 구하겠고, 곡식을 불러 그것을 많게 하겠으며, 너희에게 기근을 내리지 않겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘더러움’은 כאן의 טֻמְאֹתֵיכֶם을 해석적으로 좁히지 않기 위한 번역입니다. 이 표현은 의례적 부정함과 도덕적 오염을 함께 가리킬 수 있습니다.
    reason: korean_style_note
  - marker: b
    text: ‘곡식을 불러’는 히브리어의 ‘부르다/호출하다’(קרא אל)를 살린 표현입니다. 하나님이 곡식의 풍성함을 주권적으로 명령하신다는 이미지를 담습니다.
    reason: source_note
lexical_decisions:
- source_word: וְהוֹשַׁעְתִּי
  english_pob_choice: I will save
  chosen_korean: 구하겠고
  alternatives_korean:
  - 살려내겠고
  - 구원하겠고
  - 건지겠고
  lexicon: HALOT
  rationale: 히필 동사 ישׁע의 구제 행위를 한국어로 가장 자연스럽게 옮기되, 단순한 ‘도움’보다 하나님의 적극적 해방을 드러내기 위해 ‘구하다’를 택했습니다.
- source_word: מִכֹּל טֻמְאֹתֵיכֶם
  english_pob_choice: from all your uncleannesses
  chosen_korean: 너희의 모든 더러움
  alternatives_korean:
  - 너희의 모든 부정함
  - 너희의 모든 불결함
  - 너희의 모든 부정과 더러움
  lexicon: HALOT
  rationale: 에스겔의 טֻמְאָה는 의례적·도덕적 오염을 함께 포괄하므로, 의미를 한쪽으로 좁히지 않는 ‘더러움’으로 비교적 직설적으로 살렸습니다.
- source_word: וְקָרָאתִי אֶל הַדָּגָן
  english_pob_choice: I will call for the grain
  chosen_korean: 곡식을 불러
  alternatives_korean:
  - 곡식을 불러내고
  - 곡식을 소집하고
  - 곡식을 불러오고
  lexicon: HALOT
  rationale: קרא אל의 ‘부르다/호출하다’라는 동사상을 살려, 하나님이 곡식의 풍성함을 주권적으로 명령하시는 이미지를 유지했습니다.
- source_word: וְהִרְבֵּיתִי אֹתוֹ
  english_pob_choice: and multiply it
  chosen_korean: 그것을 많게 하겠으며
  alternatives_korean:
  - 그것을 번성하게 하겠으며
  - 그것을 늘리겠으며
  - 그것을 증대하겠으며
  lexicon: HALOT
  rationale: רבה의 증가·증식 의미를 한국어에서 가장 직접적으로 드러내기 위해 ‘많게 하다’를 사용했습니다.
- source_word: וְלֹא אֶתֵּן עֲלֵיכֶם רָעָב
  english_pob_choice: and I will not bring famine upon you
  chosen_korean: 너희에게 기근을 내리지 않겠습니다
  alternatives_korean:
  - 너희 위에 기근을 두지 않겠습니다
  - 너희에게 기근을 보내지 않겠습니다
  - 너희 위에 기근을 가져오지 않겠습니다
  lexicon: HALOT
  rationale: נתן על + רָעָב의 부과·임재 관용구를 현대 한국어의 자연스러운 표현인 ‘기근을 내리다’로 옮겨 하나님의 주권적 재앙 방지를 드러냈습니다.
theological_decisions:
- issue: ‘save’의 범위
  chosen_reading: 이 절의 구원은 부정함에서의 정결케 함과 그 결과로서의 삶의 회복을 포함하는 언약적 구제로 읽습니다.
  alternative_readings:
  - 오직 영적 구원으로만 제한함
  - 의례적 정결로만 제한함
  rationale: 에스겔 36장의 문맥은 정결, 새 마음, 땅의 회복, 풍요가 함께 가므로, ‘구하다’는 표현을 유지해 지나친 축소를 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: 부정함 용어의 보존
  chosen_reading: טֻמְאֹתֵיכֶם을 ‘더러움’으로 옮겨 의례적/도덕적 긴장을 한쪽으로 해소하지 않았습니다.
  alternative_readings:
  - 죄
  - 부정함
  - 불결함
  rationale: 에스겔의 정결 언어는 성전·언약·삶의 오염을 함께 겨냥하므로, 해석을 앞서지 않는 중립적이고 직설적인 한국어를 택했습니다.
  doctrine_reference: Translation philosophy §3
