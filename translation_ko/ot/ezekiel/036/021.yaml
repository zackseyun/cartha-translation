revisions:
- from: 그러나 내가 내 거룩한 이름을 위하여 아꼈습니다. 그 이름은 이스라엘 집이 그들이 간 여러 나라 가운데서 더럽혔습니다.[a]
  to: 그러나 나는 이스라엘 집이 그들이 간 나라들 가운데에서 더럽힌 내 거룩한 이름[a]을 아꼈습니다.
  rationale: 관계절을 선행사 ‘내 거룩한 이름’에 결속하여 원문의 통사 관계와 한국어 문법을 바로잡았습니다. ‘아꼈습니다’는 이름을 대상으로 하는 חמל의 문맥적 의미를 보존하므로 유지했으며, 불필요한 ‘위하여’를 제거했습니다. 각주 표지는 해당 어휘에 직접 붙이고, 어휘 대안 설명을 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:44:33Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘의 선택인 ‘아꼈습니다’는 חמל의 문맥상 의미(자신의 거룩한 이름의 명예를 위한 관심/보호)를 적절히 반영합니다. 다만 초안의 두 번째 문장은 관계절을 독립문으로 처리하여, ‘그 이름은 ... 더럽혔습니다’라는 문법적·의미적 불일치를 만듭니다. 히브리어의 관계절은 ‘내 거룩한 이름’을 수식해야 합니다.
  naturalness: ‘내 거룩한 이름을 위하여 아꼈습니다’는 ‘위하여’가 불필요하게 덧붙어 다소 어색합니다. 관계절을 선행사에 직접 연결하면 현대 표준 한국어의 합쇼체로 자연스럽고 분명해집니다.
  terminology: ‘내 거룩한 이름’, ‘이스라엘 집’, ‘더럽힌’은 예언서의 용례와 거룩함/속되게 함의 대조를 잘 살립니다. 각주에서는 ‘사면하다’보다 이 문맥의 직접적 어휘 범위를 반영하는 ‘살려 두다’가 더 적절합니다.
  issues:
  - severity: high
    issue: 관계절이 독립문으로 잘못 분리되었습니다.
    rationale: ‘그 이름은 이스라엘 집이 ... 더럽혔습니다’에서는 ‘그 이름은’이 주제화되었지만 뒤 절의 목적어 자리가 문법적으로 비어 있어 한국어 문장이 성립하지 않습니다. ‘이스라엘 집이 ... 더럽힌 내 거룩한 이름’으로 연결해야 원문의 אֲשֶׁר חִלְּלוּהוּ를 충실히 반영합니다.
  - severity: low
    issue: ‘위하여’가 원문에 없는 목적·이유의 뉘앙스를 더합니다.
    rationale: חמל의 직접 목적어는 ‘내 거룩한 이름’입니다. ‘내 거룩한 이름을 아꼈습니다’가 더 직접적이며 자연스럽습니다.
  - severity: low
    issue: 각주 대안과 설명을 정비할 필요가 있습니다.
    rationale: 주문과 동일한 ‘아꼈습니다’를 대안으로 반복할 필요가 없고, 이 문맥에서 ‘사면하다’는 부정확하거나 지나치게 협소합니다. 어휘적 가능성은 ‘아끼다/살려 두다’ 및 ‘불쌍히 여기다’로 제시할 수 있습니다.
  revised_text: 그러나 나는 이스라엘 집이 그들이 간 나라들 가운데에서 더럽힌 내 거룩한 이름[a]을 아꼈습니다.
