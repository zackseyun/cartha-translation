  edition: WLC
  text: וָ/אֶחְמֹ֖ל עַל שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֤ר חִלְּל֨וּ/הוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל בַּ/גּוֹיִ֖ם אֲשֶׁר בָּ֥אוּ שָֽׁמָּ/ה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/021.yaml
  text: But I had pity for my holy name[a], which the house of Israel had profaned among the nations where they had gone.
  footnotes:
  - marker: a
    text: Or 'I spared my holy name' or 'I had pity for my holy name.' The Hebrew verb can denote sparing or pity, but here it refers to the Lord's concern for the honor of his holy name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 내 거룩한 이름을 위하여 아꼈습니다. 그 이름은 이스라엘 집이 그들이 간 여러 나라 가운데서 더럽혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 거룩한 이름을 아꼈습니다’, ‘내 거룩한 이름을 불쌍히 여겼습니다’. 히브리어 동사는 아끼다, 사면하다, 불쌍히 여기다의 뜻을 가질 수 있으나, 여기서는 주님의 거룩한 이름의 명예를 염두에 둔 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶחְמֹל
  english_pob_choice: I had pity for
  chosen_korean: 아꼈습니다
  alternatives_korean:
  - 불쌍히 여겼습니다
  - 가엾게 여겼습니다
  - 유예했습니다
  - 불쌍히 여기셨습니다
  lexicon: HALOT
  rationale: חמל은 문맥에 따라 '아끼다/사면하다/불쌍히 여기다'의 뜻을 가질 수 있는데, 여기서는 대상이 사람이나 사물이 아니라 ‘내 거룩한 이름’이므로 이름의 명예를 지키기 위해 그것을 아꼈다는 의미가 가장 자연스럽습니다.
- source_word: שֵׁם קָדְשִׁי
  english_pob_choice: my holy name
  chosen_korean: 내 거룩한 이름
  alternatives_korean:
  - 내 성스러운 이름
  - 나의 거룩한 이름
  lexicon: HALOT
  rationale: 예언서에서 하나님의 이름은 하나님의 명예와 드러난 정체성을 가리키는 관용 표현이므로, 직역에 가깝게 ‘내 거룩한 이름’으로 옮겼습니다.
- source_word: חִלְּלוּהוּ
  english_pob_choice: had profaned
  chosen_korean: 더럽혔습니다
  alternatives_korean:
  - 모독했습니다
  - 속되게 했습니다
  - 훼손했습니다
  lexicon: HALOT
  rationale: חלל의 핵심은 거룩한 것을 속되게 다루는 것이므로, 한국어에서 예언서 문맥에 자연스럽고 강한 대응어인 ‘더럽히다’를 택했습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집이
  alternatives_korean:
  - 이스라엘 백성이
  - 이스라엘 집안이
  lexicon: HALOT
  rationale: 예언서의 고정된 표현인 ‘이스라엘 집’을 보존하되, 문장 흐름상 주어 표지는 ‘이스라엘 집이’로 자연화했습니다.
- source_word: בַּגּוֹיִם ... אֲשֶׁר בָּאוּ שָׁמָּה
  english_pob_choice: among the nations where they had gone
  chosen_korean: 그들이 간 여러 나라 가운데서
  alternatives_korean:
  - 그들이 가 있던 나라들 가운데서
  - 그들이 그곳에 간 여러 민족 가운데서
  - 그들이 들어간 나라들 가운데서
  lexicon: HALOT
  rationale: גוים은 이곳에서 이방 민족/국가들을 가리키므로 ‘나라’로 자연스럽게 옮겼고, בוא + שמה는 포로로 이동한 목적지를 나타내므로 ‘간’으로 간명하게 표현했습니다.
theological_decisions:
- issue: וָאֶחְמֹל의 정서적 대상이 ‘이름’인 점을 어떻게 살릴지
  chosen_reading: 하나님이 자신의 거룩한 이름의 명예와 거룩함을 지키기 위해 그것을 ‘아끼셨다’고 표현했습니다.
  alternative_readings:
  - ‘내 거룩한 이름을 불쌍히 여겼습니다’
  - ‘내 거룩한 이름을 사면했습니다’
  rationale: 문맥(36:20-23)은 이스라엘의 포로 생활보다 하나님의 이름의 공적 거룩함과 열방 앞의 변호에 초점을 두므로, 사람에게 쓰는 연민 표현보다 이름을 ‘아꼈다’는 표현이 신학적 긴장을 덜 훼손합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
