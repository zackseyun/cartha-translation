  text: לָ/כֵ֞ן אֱמֹ֣ר לְ/בֵֽית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה לֹ֧א לְמַעַנְ/כֶ֛ם אֲנִ֥י עֹשֶׂ֖ה בֵּ֣ית יִשְׂרָאֵ֑ל כִּ֤י אִם לְ/שֵׁם קָדְשִׁ/י֙ אֲשֶׁ֣ר חִלַּלְתֶּ֔ם בַּ/גּוֹיִ֖ם אֲשֶׁר בָּ֥אתֶם שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/022.yaml
  text: 'Therefore say to the house of Israel[a], ‘Thus says the Lord GOD: It is not for your sake that I am acting, O house of Israel, but for my holy name[b], which you have profaned among the nations where you went.’'
  footnotes:
  - marker: a
    text: 'Hebrew: ''for the sake of my holy name.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'which you have desecrated among the nations where you came.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이스라엘 집에게 말하십시오. 주 하나님께서 이렇게 말씀하십니다. “이스라엘 집아, 내가 너희를 위해서 하는 것이 아닙니다. 오직 너희가 가서 이른 민족들 가운데서 더럽힌 나의 거룩한 이름을 위해서입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이러므로
  lexicon: HALOT
  rationale: 앞 문맥에서 이어지는 추론 관계를 한국어에서도 분명하게 드러내는 가장 자연스러운 연결어입니다.
- source_word: אֱמֹר לְבֵית יִשְׂרָאֵל
  english_pob_choice: say to the house of Israel
  chosen_korean: 이스라엘 집에게 말하십시오
  alternatives_korean:
  - 이스라엘 가문에게 말하십시오
  - 이스라엘에게 말하십시오
  lexicon: HALOT
  rationale: ‘집/가문’이라는 언약적 공동체 표현을 살리되, 예언자에게 주어진 명령형을 공손한 지시문으로 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  lexicon: HALOT
  rationale: 아도나이와 여호와가 결합된 경칭을 한국어에서 자연스럽고 경건하게 살리기 위해 ‘주 하나님’으로 옮겼습니다.
- source_word: לְמַעַנְכֶם
  english_pob_choice: for your sake
  chosen_korean: 너희를 위해서
  alternatives_korean:
  - 너희의 유익을 위해서
  - 너희 때문이 아니라
  lexicon: HALOT
  rationale: 부정된 동기의 핵심을 간명하게 살리면서, 목적/이유의 의미를 한국어 자연문으로 표현했습니다.
- source_word: לְשֵׁם קָדְשִׁי
  english_pob_choice: for my holy name
  chosen_korean: 나의 거룩한 이름을 위해서
  alternatives_korean:
  - 내 거룩한 이름 때문에
  - 내 거룩한 이름을 위하여
  lexicon: HALOT
  rationale: ‘이름’의 언약적·명예적 의미를 유지하기 위해 단순히 ‘거룩함’만이 아니라 ‘거룩한 이름’으로 옮겼습니다.
- source_word: חִלַּלְתֶּם
  english_pob_choice: profaned
  chosen_korean: 더럽힌
  alternatives_korean:
  - 모독한
  - 속되게 만든
  - 더럽혀진
  lexicon: HALOT
  rationale: 여기서는 하나님의 이름을 공적 경외의 차원에서 훼손했다는 뜻이므로, 한국어에서 의미가 강한 ‘더럽히다’로 옮겼습니다.
theological_decisions:
- issue: 여호와 이름의 처리
  chosen_reading: 본문의 יְהוִה를 한국어 본문에서는 ‘주 하나님’으로 두어, 신명 자체를 직역하기보다 한국어 경칭 구조로 보존했습니다.
  alternative_readings:
  - 주 여호와
  - 주 야훼
  rationale: 이 절의 히브리어 결합형은 한국어에서 ‘주 하나님’이 가장 안정적으로 경건성과 가독성을 함께 살립니다. 별도 주석 없이 본문에서 하나님의 주권과 인격성을 분명히 드러낼 수 있습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — divine name rendering'
- issue: 하나님의 행동 동기
  chosen_reading: 하나님이 이스라엘을 위해서가 아니라 자신의 거룩한 이름을 위해 행동하신다고 분명히 옮겼습니다.
  alternative_readings:
  - 이스라엘의 회복을 위해
  - 그들의 유익을 위해
  rationale: 본문의 신학적 긴장은 공로가 아니라 하나님의 이름의 거룩함에 근거한 회복입니다. 이를 완화하지 않고 그대로 드러내는 것이 원문의 요지에 충실합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
