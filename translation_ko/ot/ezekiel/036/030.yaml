translation:
  language: ko
  text: 내가 나무의 열매와 밭의 소출을 크게 늘리겠습니다. 그리하여 너희는 다시는 민족들 가운데서 기근 때문에 받는 수치를 겪지 않게 될 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희는 다시는 민족들 가운데서 기근으로 인한 치욕을 겪지 않게 될 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  english_pob_choice: And I will multiply
  chosen_korean: 내가 … 크게 늘리겠습니다
  alternatives_korean:
  - 내가 … 증가시키겠습니다
  - 내가 … 풍성하게 하겠습니다
  lexicon: HALOT
  rationale: 하피엘 1인칭 단수의 약속형을 미래 공약으로 살리면서, 농경 문맥에서 자연스러운 ‘크게 늘리다’로 원인적 증대의 뜻을 전달했습니다.
- source_word: פְּרִי הָעֵץ
  english_pob_choice: the fruit of the tree
  chosen_korean: 나무 열매
  alternatives_korean:
  - 나무의 열매
  - 열매
  lexicon: HALOT
  rationale: 히브리어의 단수 집합적 표현을 한국어에서도 자연스럽게 옮기되, ‘나무’와 ‘열매’의 결합으로 원문의 농업적 이미지를 유지했습니다.
- source_word: וּתְנוּבַת הַשָּׂדֶה
  english_pob_choice: and the produce of the field
  chosen_korean: 밭의 소출
  alternatives_korean:
  - 밭의 산출
  - 밭의 수확
  lexicon: HALOT
  rationale: תְּנוּבָה의 ‘산출/소출’ 의미를 살리면서, 현대 한국어에서 문어적으로도 자연스러운 ‘소출’을 택해 ‘열매’와 짝을 이루게 했습니다.
- source_word: חֶרְפַּת רָעָב
  english_pob_choice: the reproach of famine
  chosen_korean: 기근의 수치
  alternatives_korean:
  - 기근의 치욕
  - 기근의 모욕
  lexicon: HALOT
  rationale: חֶרְפָּה의 공적 수치·치욕의 뉘앙스를 ‘수치’로 옮겨, 단순한 결핍이 아니라 공동체적 부끄러움의 의미를 드러냈습니다.
theological_decisions:
- issue: 농업 번성과 열방 앞의 수치 제거를 어떻게 함께 살릴 것인가
  chosen_reading: 풍성한 수확의 약속과 더불어, 그 결과로 민족들 가운데서 받던 기근의 수치가 제거된다는 점을 함께 드러냈습니다.
  alternative_readings:
  - 단순한 경제 회복의 약속으로만 읽는 방식
  - 명예 회복만 강조하고 농업 번성은 약화시키는 방식
  rationale: 원문은 산물의 증대와 수치의 종결을 목적절로 연결하므로, 둘 중 하나로 환원하지 않고 둘 다 보존해야 합니다.
  doctrine_reference: Translation philosophy §3 (의미 긴장 보존)
