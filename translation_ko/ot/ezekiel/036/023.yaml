revisions:
- from: 내가 내 큰 이름을 거룩하게 하겠습니다[a]. 그 이름은 너희가 그들 가운데에서 더럽힌 것이며, 이방 민족들 가운데서 더럽혀진 것입니다. 그러면 이방 민족들은 내가 야훼인 줄 알게 될 것입니다. 주 야훼의 말씀이니라[b]. 내가 너희 가운데서 그들 눈앞에 나 자신을 거룩하게 드러낼 때입니다.
  to: 내 큰 이름, 곧 이방 민족들 가운데서 더럽혀진, 너희가 그들 가운데서 더럽힌 그 이름을 내가 거룩하게 하겠습니다[a]. 내가 너희를 통하여 그들의 눈앞에서 나 자신을 거룩하게 드러낼 때에, 이방 민족들은 내가 야훼인 줄 알게 될 것입니다. 주 야훼의 말씀입니다[b].
  rationale: 두 관계절이 모두 ‘내 큰 이름’을 수식하도록 재결속하고, 원문의 시간절을 ‘이방 민족들은 … 알게 될 것입니다’에 자연스럽게 연결했습니다. 마지막 절은 해석을 과도하게 확정하지 않으면서도 영어 POB의 수단적 번역과 문맥을 반영해 ‘너희를 통하여’로 옮겼으며, 더 형식적인 ‘너희 안에서’는 각주에 보존했습니다.
