id: EZK.36.23
reference: Ezekiel 36:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/קִדַּשְׁתִּ֞י אֶת שְׁמִ֣/י הַ/גָּד֗וֹל הַֽ/מְחֻלָּל֙ בַּ/גּוֹיִ֔ם אֲשֶׁ֥ר חִלַּלְתֶּ֖ם בְּ/תוֹכָ֑/ם וְ/יָדְע֨וּ הַ/גּוֹיִ֜ם כִּי אֲנִ֣י יְהוָ֗ה נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה בְּ/הִקָּדְשִׁ֥/י בָ/כֶ֖ם לְ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/023.yaml
  text: I will sanctify my great name[a], which has been profaned among the nations, which you have profaned among them. Then the nations will know that I am Yahweh, declares the Lord GOD[b], when I show myself holy through you before their eyes.
  footnotes:
  - marker: a
    text: Or, more formally, 'I will sanctify my great name.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'when I am sanctified in you before their eyes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 큰 이름을 거룩하게 하겠습니다[a]. 그 이름은 너희가 그들 가운데에서 더럽힌 것이며, 이방 민족들 가운데서 더럽혀진 것입니다. 그러면 이방 민족들은 내가 야훼인 줄 알게 될 것입니다. 주 야훼의 말씀이니라[b]. 내가 너희 가운데서 그들 눈앞에 나 자신을 거룩하게 드러낼 때입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘내 큰 이름을 거룩하게 하겠습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘내가 그들 눈앞에서 너희 안에서 거룩하게 될 때입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי
  english_pob_choice: I will sanctify / vindicate the holiness of
  chosen_korean: 거룩하게 하겠습니다
  alternatives_korean:
  - 거룩하게 만들겠습니다
  - 거룩함을 드러내겠습니다
  lexicon: HALOT
  rationale: קדשׁ의 사역적·선언적 의미를 살리되, 하나님의 이름이 본래 거룩하지 않다는 뜻으로 오해되지 않도록 한국어에서는 간결하게 ‘거룩하게 하다’로 옮겼습니다.
- source_word: שְׁמִי הַגָּדוֹל
  english_pob_choice: my great name
  chosen_korean: 내 큰 이름
  alternatives_korean:
  - 내 위대한 이름
  - 내 큰 이름
  lexicon: HALOT
  rationale: 히브리어의 소유격+형용사 구성을 자연스러운 현대 한국어로 반영했습니다. ‘이름’은 단순 호칭이 아니라 하나님의 명성·현시를 포함합니다.
- source_word: הַמְחֻלָּל
  english_pob_choice: which has been profaned
  chosen_korean: 더럽힌
  alternatives_korean:
  - 속된 것으로 만든
  - 모독한
  - 더럽혀진
  lexicon: HALOT
  rationale: 성소/이름에 대한 훼손의 의미를 살리면서, ‘더럽히다’가 한국어 성경 문맥에서 갖는 종교적·윤리적 무게를 유지했습니다.
- source_word: בַּגּוֹיִם / בְּתוֹכָם
  english_pob_choice: among the nations / among them
  chosen_korean: 이방 민족들 가운데서 / 그들 가운데에서
  alternatives_korean:
  - 민족들 가운데서 / 그들 안에서
  - 나라들 가운데에서 / 그들 가운데
  lexicon: HALOT
  rationale: עַמִּים/גּוֹיִם의 공적·국제적 범위를 살려 ‘이방 민족들’로 옮겼고, בְּתוֹכָם은 같은 대상군 안에서의 profanation을 드러내도록 ‘그들 가운데에서’로 반영했습니다.
- source_word: יְהוָה / אֲדֹנָי יְהוִה
  english_pob_choice: Yahweh / the Lord GOD
  chosen_korean: 야훼 / 주 야훼
  alternatives_korean:
  - 여호와 / 주 여호와
  - 주님 하나님
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겼고, אֲדֹנָי יְהוִה는 두 호칭을 함께 살리기 위해 ‘주 야훼’로 번역했습니다.
- source_word: בְּהִקָּדְשִׁי בָכֶם
  english_pob_choice: when I show myself holy through you
  chosen_korean: 내가 너희 가운데서 … 나 자신을 거룩하게 드러낼 때
  alternatives_korean:
  - 너희 안에서 거룩하게 될 때
  - 너희 가운데서 나를 거룩하게 할 때
  lexicon: HALOT
  rationale: 문맥상 하나님이 이스라엘을 통해 자신의 거룩함을 공적으로 드러내시는 뜻이므로, ‘거룩하게 드러내다’로 옮겨 의미를 분명히 했습니다. ‘너희 가운데서’는 בָכֶם의 공간적·관계적 뉘앙스를 보존합니다.
theological_decisions:
- issue: 하나님의 이름을 ‘거룩하게 하다’라는 표현의 신학적 함의
  chosen_reading: 하나님이 본래 거룩함을 새로 얻는다는 뜻이 아니라, 더럽혀진 이름의 거룩함을 공적으로 회복·입증하신다는 뜻으로 이해하고 번역했습니다.
  alternative_readings:
  - 내 큰 이름의 거룩함을 입증하겠습니다
  - 내 큰 이름의 거룩함을 변호하겠습니다
  rationale: קדשׁ는 여기서 존재론적 변화가 아니라 공개적 인정과 회복의 차원을 가리키므로, 한국어도 그 긴장을 유지하도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: בְּהִקָּדְשִׁי בָכֶם의 번역 방향
  chosen_reading: ‘내가 너희 가운데서 … 나 자신을 거룩하게 드러낼 때’로 옮겨, 행위의 주도권이 하나님께 있고 열방 앞에서의 공적 현시라는 점을 살렸습니다.
  alternative_readings:
  - 너희 안에서 내가 거룩하게 될 때
  - 너희를 통해 내가 거룩하게 될 때
  rationale: 히브리어의 더 직역적인 ‘너희 안에서’ 가능성을 남기되, 본문 문맥의 초점인 열방 앞 공개적 현시를 한국어에서 분명히 하려는 선택입니다.
  doctrine_reference: Translation philosophy §5
