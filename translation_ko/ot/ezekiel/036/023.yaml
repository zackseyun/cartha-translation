    rationale: ‘그 이름은 너희가 … 더럽힌 것이며, 이방 민족들 가운데서 더럽혀진 것입니다’는 원문의 ‘이방 민족들 가운데서 더럽혀진, 너희가 그들 가운데서 더럽힌 내 큰 이름’이라는 병렬 수식을 분산시켜 읽기 흐름과 선행사를 약화합니다.
