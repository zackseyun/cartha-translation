  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת רוּחִ֖/י אֶתֵּ֣ן בְּ/קִרְבְּ/כֶ֑ם וְ/עָשִׂ֗יתִי אֵ֤ת אֲשֶׁר בְּ/חֻקַּ/י֙ תֵּלֵ֔כוּ וּ/מִשְׁפָּטַ֥/י תִּשְׁמְר֖וּ וַ/עֲשִׂיתֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/027.yaml
  text: And I will put my Spirit within you[a], and I will cause you to walk in my statutes[b], and you will keep my judgments and do them.
  footnotes:
  - marker: a
    text: Or 'my decrees' for 'my statutes.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my ordinances' or 'my rules' for 'my judgments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 영을 너희 가운데 두고, 내가 너희로 하여금 내 규례들을 따라 걷게 하며, 너희가 내 법도를 지키고 그것들을 행하게 하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘규례들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘법령들’ 또는 ‘규정들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  english_pob_choice: my Spirit
  chosen_korean: 내 영
  alternatives_korean:
  - 내 숨
  - 내 바람
  lexicon: HALOT
  rationale: 이 문맥에서는 여호와께서 주시는 내적이고 인격적인 신적 영을 가리키므로, ‘영’으로 옮겨 영어 POB의 의미를 그대로 반영했습니다.
- source_word: בְּקִרְבְּכֶם
  english_pob_choice: within you
  chosen_korean: 너희 가운데
  alternatives_korean:
  - 너희 안에
  - 너희 속에
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 ‘너희 가운데/한가운데’의 뜻이 가능하며, 이 약속이 공동체 전체의 갱신을 말한다는 점을 살려 ‘너희 가운데’로 옮겼습니다.
- source_word: וְעָשִׂיתִי אֵת אֲשֶׁר
  english_pob_choice: I will cause you to walk
  chosen_korean: 내가 너희로 하여금 … 걷게 하며
  alternatives_korean:
  - 내가 … 하게 하며
  - 내가 … 하도록 만들며
  lexicon: HALOT
  rationale: עשה가 כאן에서 단순 ‘하다’가 아니라 결과를 일으키는 사역적 용법이므로, 하나님의 유효한 행위를 드러내는 ‘너희로 하여금 … 걷게 하다’로 번역했습니다.
- source_word: בְּחֻקַּי תֵּלֵכוּ / מִשְׁפָּטַי
  english_pob_choice: my statutes / my judgments
  chosen_korean: 내 규례들 / 내 법도
  alternatives_korean:
  - 내 율례들 / 내 판단들
  - 내 법령들 / 내 규정들
  lexicon: HALOT
  rationale: חֻקִּים과 מִשְׁפָּטִים의 병행을 살리되, 전통적 교회어보다 현대 한국어에서 자연스러운 ‘규례들’과 ‘법도’를 사용해 두 법률어의 구분을 유지했습니다.
theological_decisions:
- issue: 하나님의 주권적 역사와 인간의 순종의 관계
  chosen_reading: 내가 너희로 하여금 내 규례들을 따라 걷게 하며, 너희가 내 법도를 지키고 그것들을 행하게 하겠습니다
  alternative_readings:
  - 내가 너희가 내 규례들을 따라 걷도록 하겠습니다
  - 너희가 내 법도를 지키고 행하도록 내가 하겠습니다
  rationale: 히브리어는 하나님이 순종을 실제로 이루게 하신다는 강한 주권을 말하면서도, 동시에 그 결과로서의 인간 순종을 함께 제시합니다. 이 긴장을 완화하지 않고 사역적 표현으로 보존했습니다.
  doctrine_reference: 하나님의 유효한 은혜와 인간의 실제 순종을 함께 보존
