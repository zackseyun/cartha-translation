id: EZK.36.10
reference: Ezekiel 36:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִרְבֵּיתִ֤י עֲלֵי/כֶם֙ אָדָ֔ם כָּל בֵּ֥ית יִשְׂרָאֵ֖ל כֻּלֹּ֑/ה וְ/נֹֽשְׁבוּ֙ הֶֽ/עָרִ֔ים וְ/הֶ/חֳרָב֖וֹת תִּבָּנֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/010.yaml
  text: And I will multiply people upon you—all the house of Israel[a], all of it. The cities will be inhabited[b], and the ruins will be rebuilt.
  footnotes:
  - marker: a
    text: Hebrew 'adam' here is a collective term for human population; alternatively, 'humankind' or more literally 'man.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the waste places' / 'the desolate places' for 'the ruins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희 위에 사람을 많게 하리니 — 곧 이스라엘 온 집, 그 전체입니다. 성읍들은 사람이 살게 되고[a], 폐허들은 다시 세워질 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘אָדָם’은 여기서 집단명사로 쓰여 인구를 가리킵니다. 문맥에 따라 ‘인류’ 또는 더 문자적으로 ‘사람/인간’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘폐허들’은 ‘황무지들’ 또는 ‘황폐한 곳들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  english_pob_choice: And I will multiply
  chosen_korean: 사람을 많게 하리니
  alternatives_korean:
  - 늘리리니
  - 증가시키리니
  - 번성하게 하리니
  lexicon: HALOT
  rationale: 히필형 רבה의 사역적 의미를 살리면서, 인구 증가라는 문맥에 맞게 한국어로는 ‘사람을 많게 하다’가 가장 자연스럽고 직접적입니다.
- source_word: עֲלֵיכֶם
  english_pob_choice: upon you
  chosen_korean: 너희 위에
  alternatives_korean:
  - 너희에게
  - 너희 위로
  lexicon: HALOT
  rationale: 대상인 땅/산지 위에 인구가 퍼져 늘어나는 이미지를 살리기 위해, 단순한 여격보다 ‘위에’를 유지했습니다.
- source_word: וְנֹשְׁבוּ הֶעָרִים
  english_pob_choice: The cities will be inhabited
  chosen_korean: 성읍들은 사람이 살게 되고
  alternatives_korean:
  - 성읍들은 거주하게 되고
  - 성읍들은 다시 사람이 살고
  lexicon: HALOT
  rationale: נשׁב의 수동적 결과를 한국어로 자연스럽게 옮기되, ‘inhabited’의 핵심인 거주 회복을 분명히 하기 위해 ‘사람이 살게 되다’로 풀었습니다.
- source_word: וְהֶחֳרָבוֹת תִּבָּנֶינָה
  english_pob_choice: and the ruins will be rebuilt
  chosen_korean: 폐허들은 다시 세워질 것입니다
  alternatives_korean:
  - 무너진 곳들은 다시 지어질 것입니다
  - 황폐한 곳들은 다시 세워질 것입니다
  lexicon: HALOT
  rationale: חֳרָבוֹת의 ‘파괴된 곳’이라는 뜻을 현대 한국어에서 가장 또렷하게 드러내는 말로 ‘폐허들’을 택했고, תִּבָּנֶינָה의 재건 의미를 ‘다시 세워지다’로 살렸습니다.
theological_decisions:
- issue: ‘אָדָם’의 집단적 의미와 번역 톤
  chosen_reading: 개별 인간을 가리키기보다 인구 전체의 증가를 뜻하므로, ‘사람을 많게 하리니’로 옮겼습니다.
  alternative_readings:
  - ‘인류를’
  - ‘사람들을’
  - ‘인간을’
  rationale: 본문은 땅 위에 거주민이 늘어나는 회복 선언이므로, ‘아담’의 집단적 용례를 반영해 자연스럽되 과도하게 추상화하지 않았습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; preserve concrete restoration imagery'
