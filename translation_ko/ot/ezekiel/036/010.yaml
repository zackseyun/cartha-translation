  source_fidelity: 히브리어의 사역 의미(‘많게 하다’), 땅/산지에 사람을 늘린다는 공간적 이미지, 이스라엘 온 집의 강조, 성읍의 재거주와 황폐한 곳의 재건을 대체로 충실히 반영합니다. 다만 ‘곧 이스라엘 온 집, 그 전체입니다’는 하나님의 미래 선언 안에서 현재형 종결을 사용하여 문장 결속이 어색하며, 강조구의 목적격 관계를 더 분명히 할 필요가 있습니다.
  naturalness: ‘내가 … 하리니’ 뒤에 ‘그 전체입니다’가 이어지는 방식은 현대 표준 한국어 합쇼체에서 부자연스럽습니다. ‘이스라엘 온 집 전체를’로 묶고 서술어를 ‘하겠습니다’로 통일하면 자연스럽고, 원문의 강조도 보존됩니다.
  terminology: ‘성읍’, ‘폐허’, ‘다시 세워질 것입니다’는 문맥과 현대적 격식체에 적절합니다. 다만 각주 a는 אָדָם에 관한 것인데 본문에서는 ‘사람이 살게 되고’에 붙어 있고, 각주 b는 ‘폐허들’에 관한 것인데 ‘세워질 것입니다’에 붙어 있어, 각주 표지를 해당 어휘로 옮겨야 합니다.
