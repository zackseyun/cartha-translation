  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתֶּ֞ם הָרֵ֤י יִשְׂרָאֵל֙ עַנְפְּ/כֶ֣ם תִּתֵּ֔נוּ וּ/פֶרְיְ/כֶ֥ם תִּשְׂא֖וּ לְ/עַמִּ֣/י יִשְׂרָאֵ֑ל כִּ֥י קֵרְב֖וּ לָ/בֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/008.yaml
  text: But you[a], mountains of Israel, shall put forth your branches and bear your fruit for my people Israel, for they are about to come.
  footnotes:
  - marker: a
    text: Or, 'for their coming is near.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희, 이스라엘의 산들아, 너희 가지를 내고 너희 열매를 내어 내 백성 이스라엘을 위하여 열매 맺으십시오. 그들이 곧 올 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들의 오심이 가까웠기 때문입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֵי יִשְׂרָאֵל
  english_pob_choice: mountains of Israel
  chosen_korean: 이스라엘의 산들
  alternatives_korean:
  - 이스라엘의 산지
  - 이스라엘의 산악 지역
  lexicon: HALOT
  rationale: 히브리어 표현은 지리적 대상인 ‘이스라엘의 산들’을 직접 가리키므로, 현대 한국어에서도 그대로 살려 예언적 호명과 의인화 효과를 유지했습니다.
- source_word: עַנְפְּכֶם
  english_pob_choice: your branches
  chosen_korean: 너희 가지
  alternatives_korean:
  - 너희 새가지
  - 너희 나뭇가지
  lexicon: HALOT
  rationale: עָנָף는 나뭇가지/가지의 뜻이므로, 농경 이미지에 맞게 가장 자연스러운 ‘가지’로 옮겼습니다.
- source_word: תִּתֵּנוּ
  english_pob_choice: shall put forth
  chosen_korean: 내다
  alternatives_korean:
  - 내어 놓다
  - 돋아나다
  lexicon: HALOT
  rationale: ‘주다’의 문자적 의미보다 가지를 ‘내다/돋아나다’는 동사적 함의가 문맥에 더 맞아, 산들이 생명을 내어놓는 이미지를 살렸습니다.
- source_word: וּפֶרְיְכֶם תִּשְׂאוּ
  english_pob_choice: and bear your fruit
  chosen_korean: 너희 열매를 내어 ... 열매 맺으십시오
  alternatives_korean:
  - 너희 열매를 맺으십시오
  - 너희 열매를 거두십시오
  lexicon: HALOT
  rationale: ‘열매를 내다/맺다’는 히브리어 병행법을 자연스럽게 살리며, ‘bear fruit’의 생산적 뉘앙스를 현대 한국어로 전달합니다.
- source_word: לְעַמִּי יִשְׂרָאֵל
  english_pob_choice: for my people Israel
  chosen_korean: 내 백성 이스라엘을 위하여
  alternatives_korean:
  - 내 백성 이스라엘에게
  - 내 백성 이스라엘을 위해
  lexicon: HALOT
  rationale: לְ는 이익/목적의 방향을 나타내므로 ‘-을 위하여’로 옮겨, 땅의 결실이 이스라엘 백성을 위한 것임을 분명히 했습니다.
- source_word: קֵרְבוּ לָבוֹא
  english_pob_choice: they are about to come
  chosen_korean: 그들이 곧 올 것이기 때문입니다
  alternatives_korean:
  - 그들이 가까이 와 있기 때문입니다
  - 그들의 오심이 가까웠기 때문입니다
  lexicon: HALOT
  rationale: ‘가까워지다 + 오다’의 관용을 한국어로는 ‘곧 오다’가 가장 자연스럽게 드러내며, POB의 임박성 해석을 반영합니다.
theological_decisions:
- issue: ‘그들’의 지시 대상
  chosen_reading: ‘그들’은 포로 상태의 이스라엘 백성, 곧 곧 돌아올 하나님의 백성을 가리킵니다.
  alternative_readings:
  - 비인칭적으로 ‘그들이 올 때가 가까웠기 때문입니다’로 볼 수 있음
  rationale: 가장 가까운 선행사는 ‘내 백성 이스라엘’이므로, 땅의 열매 맺음이 포로 귀환을 전제한다는 약속 구조를 분명히 했습니다.
  doctrine_reference: 귀환/회복 약속의 문맥(에스겔 36장)
