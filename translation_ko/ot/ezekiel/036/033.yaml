  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה בְּ/יוֹם֙ טַהֲרִ֣/י אֶתְ/כֶ֔ם מִ/כֹּ֖ל עֲוֺנֽוֹתֵי/כֶ֑ם וְ/הֽוֹשַׁבְתִּי֙ אֶת הֶ֣/עָרִ֔ים וְ/נִבְנ֖וּ הֶ/חֳרָבֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/033.yaml
  text: 'Thus says the Lord GOD: On the day I cleanse you from all your iniquities[a], I will cause the cities to be inhabited[c][b], and the ruins will be rebuilt.'
  footnotes:
  - marker: a
    text: Hebrew 'the Lord GOD' represents the title אֲדֹנָי יְהוִה; alternatively, 'the Lord Yahweh.'
    reason: alternative_reading
  - marker: b
    text: Or 'I will settle the cities' / 'I will cause people to dwell in the cities.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the waste places' or 'the desolate places.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다.[a] 내가 너희를 너희의 모든 죄악에서 정결하게 하는 날에, 내가 도시들에 사람이 살게 하고[b] 폐허들은 다시 세워질 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주 하나님께서’ 또는 ‘주 여호와께서’. 히브리어는 아도나이 야훼라는 복합 호칭입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내가 도시들을 정착하게 하겠다’ 또는 ‘내가 도시들에 사람들이 거주하게 하겠다’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘황폐한 곳들’ 또는 ‘버려진 곳들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 야훼 하나님
  lexicon: HALOT
  rationale: 합성 호칭의 reverential substitution을 그대로 살리면서, 본문에 있는 신명은 프로젝트 기본값에 따라 야훼로 옮겼습니다. '주 하나님'은 전통적이지만 יְהוִה의 고유성을 약화시킬 수 있습니다.
- source_word: טַהֲרִי
  english_pob_choice: I cleanse
  chosen_korean: 깨끗하게 하는
  alternatives_korean:
  - 정결하게 하는
  - 정화하는
  lexicon: HALOT
  rationale: 죄와 불결의 제거를 말하는 문맥이므로 '깨끗하게 하다'를 택해 직접성을 살렸습니다. '정결하게 하다'는 종교적 어감이 강하고, '정화하다'는 현대어에서 다소 추상적입니다.
- source_word: עֲוֺנֹתֵיכֶם
  english_pob_choice: from all your iniquities
  chosen_korean: 너희의 모든 죄악
  alternatives_korean:
  - 너희의 모든 죄
  - 너희의 모든 불의
  lexicon: HALOT
  rationale: עָוֹן의 도덕적 무게를 살리기 위해 '죄악'을 택했습니다. '죄'보다 더 강한 책임성과 왜곡을 드러내며, POB의 'iniquities'와도 대응합니다.
- source_word: וְהוֹשַׁבְתִּי אֶת הֶעָרִים
  english_pob_choice: I will cause the cities to be inhabited
  chosen_korean: 그 도시들에 사람이 살게 하고
  alternatives_korean:
  - 그 도시들을 사람이 살도록 하고
  - 그 도시들을 다시 살게 하고
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리면서 한국어에서 자연스럽게 읽히도록 '사람이 살게 하다'로 옮겼습니다. 목적어가 '도시들'이므로 단순히 '정착시키다'보다 거주 행위를 드러내는 표현이 더 분명합니다.
- source_word: וְנִבְנוּ הֶחֳרָבוֹת
  english_pob_choice: the ruins will be rebuilt
  chosen_korean: 무너진 곳들은 다시 세워질 것입니다
  alternatives_korean:
  - 폐허들은 다시 지어질 것입니다
  - 황폐한 곳들은 다시 세워질 것입니다
  lexicon: HALOT
  rationale: חֳרָבוֹת의 폐허·황폐지를 한국어에서 직관적으로 드러내기 위해 '무너진 곳들'을 택했습니다. '다시 세워지다'는 בנה의 수동적 의미를 자연스럽게 반영합니다.
theological_decisions:
- issue: יהוה의 번역과 compound divine title 처리
  chosen_reading: 본문의 신명은 '야훼'로, 합성 호칭은 '주 야훼'로 옮겼습니다.
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 본문에는 אֲדֹנָי יְהוִה가 함께 나오므로 단순히 '주 하나님'으로 풀면 고유 신명 표지가 약해집니다. 프로젝트 원칙에 따라 YHWH는 야훼로 드러내되, 합성 호칭의 경건한 형태도 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘도시들이 inhabited 된다’는 사역적 표현의 재구성
  chosen_reading: 직역적 어순보다 결과 상태를 자연스럽게 드러내는 '사람이 살게 하다'를 택했습니다.
  alternative_readings:
  - 도시들이 거주되게 하다
  - 도시들을 거주하게 하다
  rationale: 히브리어는 도시를 목적어로 두고 거주 상태를 야기하는 사역형이므로, 한국어에서는 사람이 거주하는 결과를 분명히 해야 의미가 살아납니다. 이는 도시가 '복구'되는 회복 약속의 핵심을 훼손하지 않습니다.
  doctrine_reference: HALOT on הוֹשַׁבְתִּי (causative of ישׁב)
