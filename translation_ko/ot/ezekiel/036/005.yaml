id: EZK.36.5
reference: Ezekiel 36:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֠א בְּ/אֵ֨שׁ קִנְאָתִ֥/י דִבַּ֛רְתִּי עַל שְׁאֵרִ֥ית הַ/גּוֹיִ֖ם וְ/עַל אֱד֣וֹם כֻּלָּ֑/א אֲשֶׁ֣ר נָתְנֽוּ אֶת אַרְצִ֣/י לָ֠/הֶם לְ/מ֨וֹרָשָׁ֜ה בְּ/שִׂמְחַ֤ת כָּל לֵבָב֙ בִּ/שְׁאָ֣ט נֶ֔פֶשׁ לְמַ֥עַן מִגְרָשָׁ֖/הּ לָ/בַֽז־־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/005.yaml
  text: 'Therefore thus says the Lord GOD: Surely in the fire of my jealousy I have spoken against the remnant of the nations and against all Edom[a], who gave my land to themselves as a possession with wholehearted joy and with contempt of soul[c][b], in order to make its pastureland plunder.'
  footnotes:
  - marker: a
    text: Or 'the rest of the nations.'
    reason: lexical_alternative
  - marker: b
    text: Or 'gave my land to themselves for an inheritance.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew of the final clause is difficult; it may also be understood along the lines of 'to make its pastureland/open land plunder.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. “내 질투의 불 가운데서 내가 남아 있는 민족들[a]과 에돔 전체에 대하여 말하였다. 그들은 온 마음으로 기뻐하며 멸시하는 마음으로 내 땅을 자기들의 소유[b]로 삼아, 그 땅의 목초지를 노략물로 삼으려고 하였다.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족들의 나머지’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 땅을 자기들의 기업으로 삼아’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 마지막 구절은 해석하기 어렵습니다. ‘그 땅의 목초지/개활지를 약탈물로 삼으려고’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  lexicon: HALOT
  rationale: 아도나이+야훼의 복합 호칭을 한국어에서 자연스럽게 두 요소를 살려 옮기되, 개신교 관행의 ‘주 하나님’을 사용했습니다. 여기서 ‘여호와’는 전통형이지만, 본문은 직접 화자 표지이므로 지나치게 경직된 음역보다 호칭 기능이 먼저입니다.
- source_word: בְּאֵשׁ קִנְאָתִי
  english_pob_choice: in the fire of my jealousy
  chosen_korean: 내 질투의 불 속에서
  alternatives_korean:
  - 내 열심의 불 속에서
  - 내 질투의 불 가운데서
  lexicon: HALOT
  rationale: ‘불’의 이미지를 보존하고, קִנְאָה를 관계적·언약적 긴장을 담는 ‘질투’로 옮겼습니다. ‘열심’은 완화될 수 있어 덜 직접적입니다.
- source_word: שְׁאֵרִית הַגּוֹיִם
  english_pob_choice: the remnant of the nations
  chosen_korean: 이방 민족들의 남은 자들
  alternatives_korean:
  - 민족들의 남은 자
  - 이방들의 남은 자
  lexicon: HALOT
  rationale: שְׁאֵרִית의 기본값은 ‘남은 자/남은 것’이지만, 여기서는 구원론적 용어를 불필요하게 부각하지 않고 문맥상 ‘이방 민족들’의 잔존 집단을 뜻하게 하여 자연스럽게 풀었습니다.
- source_word: נָתְנוּ אֶת אַרְצִי לָהֶם לְמוֹרָשָׁה
  english_pob_choice: gave my land to themselves as a possession
  chosen_korean: 내 땅을 자기들의 소유로 삼았고
  alternatives_korean:
  - 내 땅을 자기들의 기업으로 삼았고
  - 내 땅을 자기들에게 유산으로 주었고
  lexicon: HALOT
  rationale: לְמוֹרָשָׁה는 ‘소유/기업/유산’의 폭이 있으나, 여기서는 불법 점유의 뉘앙스가 강하므로 ‘소유로 삼다’로 옮겼습니다. 영어 POB의 반사적 소유 감각도 반영합니다.
- source_word: בְּשִׂמְחַת כָּל לֵבָב בִּשְׁאָט נֶפֶשׁ
  english_pob_choice: with wholehearted joy and with contempt of soul
  chosen_korean: 기쁨으로 온 마음을 다해, 또 영혼의 멸시로
  alternatives_korean:
  - 온 마음의 기쁨과 영혼의 멸시로
  - 전심의 기쁨과 심령의 멸시로
  lexicon: HALOT
  rationale: 두 개의 명사구를 병렬로 살리면서, ‘온 마음을 다해’는 בְּשִׂמְחַת כָּל לֵבָב의 강세를, ‘영혼의 멸시’는 בִּשְׁאָט נֶפֶשׁ의 내부적 경멸을 반영합니다. ‘멸시’는 ‘경멸’보다 본문 폭력성과 직접성이 있습니다.
- source_word: מִגְרָשָׁהּ לָבַז
  english_pob_choice: in order to make its pastureland plunder
  chosen_korean: 그 땅의 목초지를 노략물이 되게 하려고 하였습니다
  alternatives_korean:
  - 그 땅의 목초지를 약탈물로 만들려고 하였습니다
  - 그 땅의 뜰과 들판을 노략물로 만들려고 하였습니다
  lexicon: HALOT
  rationale: מִגְרָשׁ은 문맥상 ‘목초지/빈 들’의 이미지가 있어 이를 살렸고, לָבַז는 ‘노략물’로 직역해 결과 상태를 표현했습니다. 영어 POB가 주석으로 밝힌 난해함도 너무 평탄화하지 않도록 했습니다.
theological_decisions:
- issue: 여호와/야훼의 번역과 호칭 처리
  chosen_reading: 본문의 하나님의 이름은 한국어 독자에게 자연스러운 ‘주 하나님’으로 옮기되, 호칭 결합의 긴장을 유지했습니다.
  alternative_readings:
  - 주 여호와
  - 주 야훼
  rationale: 이 절은 예언 서문의 직접 인용이라 구약 성호를 반복 노출하기보다, 화자 표지의 기능을 살리는 것이 가독성과 문맥 모두에 유리합니다. 다만 본문 내부에서 주권성과 거룩함의 무게는 ‘주 하나님’으로 충분히 보존됩니다.
  doctrine_reference: POB 구약 인명·호칭 처리 원칙
