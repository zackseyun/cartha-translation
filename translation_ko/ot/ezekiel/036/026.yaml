id: EZK.36.26
reference: Ezekiel 36:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י לָ/כֶם֙ לֵ֣ב חָדָ֔שׁ וְ/ר֥וּחַ חֲדָשָׁ֖ה אֶתֵּ֣ן בְּ/קִרְבְּ/כֶ֑ם וַ/הֲסִ֨רֹתִ֜י אֶת לֵ֤ב הָ/אֶ֨בֶן֙ מִ/בְּשַׂרְ/כֶ֔ם וְ/נָתַתִּ֥י לָ/כֶ֖ם לֵ֥ב בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/026.yaml
  text: And I will give you a new heart[a], and I will put a new spirit within you; and I will remove the heart of stone from your flesh and give you a heart of flesh.
  footnotes:
  - marker: a
    text: Or "a renewed spirit"; some understand "spirit" here as anticipating the gift of God's Spirit in the following verse.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 너희에게 새 마음을 주고, 너희 안에 새 영을[a] 넣어 주며, 너희 몸에서 돌로 된 마음을 제거하고, 너희에게 살로 된 마음을 주겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “새롭게 된 영”. 일부는 여기의 “영”을 다음 절에 나오는 하나님의 영을 예고하는 것으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב חָדָשׁ
  english_pob_choice: a new heart
  chosen_korean: 새 마음
  alternatives_korean:
  - 새로운 마음
  - 새 심장
  lexicon: HALOT
  rationale: 히브리어 לֵב는 인간의 사고·의지·감정의 중심을 가리키므로, 한국어에서도 익숙하고 직접적인 ‘마음’이 가장 투명합니다. ‘새로운 마음’도 가능하지만, ‘새 마음’이 더 간결하게 형용의 핵심을 살립니다.
- source_word: וְר֥וּחַ חֲדָשָׁה
  english_pob_choice: a new spirit
  chosen_korean: 새 영
  alternatives_korean:
  - 새로운 영
  - 새로운 마음가짐
  lexicon: HALOT
  rationale: רוּחַ는 여기서 내적 생명 원리로 쓰이므로 ‘영’이 원문과 가장 가깝습니다. ‘마음가짐’은 의미를 풀어써서 본문의 어휘적 긴장을 약화시킵니다.
- source_word: בְּקִרְבְּכֶם
  english_pob_choice: within you
  chosen_korean: 너희 안에
  alternatives_korean:
  - 너희 가운데
  - 너희 속에
  lexicon: HALOT
  rationale: 문맥상 마음과 영의 내적 변화가 강조되므로, 공간적·공동체적 뉘앙스가 강한 ‘너희 가운데’보다 ‘너희 안에’가 더 자연스럽습니다.
- source_word: לֵב הָאֶבֶן / לֵב בָּשָׂר
  english_pob_choice: the heart of stone / a heart of flesh
  chosen_korean: 돌 같은 마음 / 살 같은 마음
  alternatives_korean:
  - 돌의 마음 / 부드러운 마음
  - 돌 같은 심장 / 연한 마음
  lexicon: HALOT
  rationale: 히브리어의 대비를 한국어에서도 그대로 살리기 위해 ‘돌 같은 마음’과 ‘살 같은 마음’을 유지했습니다. ‘부드러운 마음’은 의미를 설명해 주지만, 원문의 물질 대비를 희석합니다.
- source_word: וַהֲסִרֹתִי
  english_pob_choice: I will remove
  chosen_korean: 제거하고
  alternatives_korean:
  - 없애고
  - 치워 버리고
  lexicon: HALOT
  rationale: 연속 동사 구조에서 ‘제거하다’가 가장 문어적이고, 원문의 ‘옮겨 버리다/치워 버리다’보다 덜 구어적이면서도 분명합니다.
theological_decisions:
- issue: ‘새 영’의 정체를 어떻게 드러낼 것인가
  chosen_reading: 인간 내면의 새로워진 영/성향을 가리키되, 다음 절의 하나님의 영과의 구별을 유지합니다.
  alternative_readings:
  - 성령으로 직접 이해함
  - 단순한 심리적 의지 변화로 축소함
  rationale: 문맥상 26절은 ‘새 마음’과 평행을 이루는 내적 변화를 말하고, 27절에서야 하나님의 영이 명시됩니다. 따라서 본문은 소문자적 ‘새 영’으로 두어 신학적 연결은 열어 두되, 26절 자체를 곧바로 성령으로 동일시하지는 않습니다.
  doctrine_reference: 문맥적 평행과 27절과의 구별을 보존합니다.
