  - 말
  - 메시지
  lexicon: HALOT
  rationale: 여기서의 דבר은 단순한 말이 아니라 하나님의 계시적 발화를 가리키므로, 표준적인 성경 용례인 ‘말씀’이 가장 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본에 따라 여호와 대신 고유명사 음역인 ‘야훼’를 본문에 반영하여, 신적 이름을 제목어로 바꾸지 않았습니다.
- source_word: אֵלַי לֵאמֹר
  english_pob_choice: to me, saying
  chosen_korean: 내게 임하여 말씀하셨습니다
  alternatives_korean:
  - 내게 와서 이르시기를
  - 내게 말씀하여 이르셨습니다
  lexicon: WLC; prophetic speech formula
  rationale: ‘to me, saying’는 예언적 전달 공식을 이루므로, 한국어에서는 반복을 줄이되 발화 주체가 하나님이심과 계시 전달의 흐름이 분명하도록 처리했습니다.
theological_decisions:
- issue: 신적 이름 יְהוָה의 한국어 처리
  chosen_reading: 본문에 ‘야훼’를 사용했습니다.
  alternative_readings:
