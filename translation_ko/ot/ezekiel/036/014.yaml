  source_fidelity: 상반절의 땅 의인화와 אָדָם의 집합적 의미는 대체로 충실합니다. 그러나 תַכְשִׁלִי는 ‘네 민족이 걸려 넘어지게’가 아니라 땅이 ‘네 민족을 넘어지게 하다’라는 사역 구문이므로 목적격을 명시해야 합니다. 또한 제공된 신명 표기 원칙에 따라 אֲדֹנָי יְהוִה는 ‘주 야훼’로 옮기는 것이 적절합니다.
  naturalness: ‘당신’은 의인화된 땅에 대한 호칭으로 다소 부자연스럽고, ‘당신의 민족이 걸려 넘어지게 하지’는 문법상 민족이 주어가 되어 의미가 흐려집니다. ‘너는/네 민족을’ 및 ‘넘어지게 하지’가 현대 표준어에서 더 자연스럽고 뜻도 분명합니다.
  terminology: ‘사람들을 삼키다’는 אָדָם의 집합적 의미와 먹어 없애는 은유를 자연스럽게 전달합니다. ‘주 야훼께서 말씀하십니다’는 אֲדֹנָי יְהוִה와 제시된 야훼 표기 원칙을 반영합니다. 대안 독법은 본문과 구별하여 각주에 보존합니다.
