  text: 그러므로 너는 다시는 사람들을 삼키지 않을 것이며, 다시는 네 민족을 넘어지게 하지 않을 것입니다. 주 야훼께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
