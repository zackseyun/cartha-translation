translation:
  language: ko
  text: 그러므로 당신은 더 이상 사람을 삼키지 않으며, 더 이상 당신의 민족이 걸려 넘어지게 하지 않을 것입니다. 주 하나님이 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 다른 모음화/전승을 따르면: ‘더 이상 당신의 민족을 앗아가지 않을 것입니다.’'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그래서
  lexicon: HALOT
  rationale: 앞선 문맥에 대한 추론·결과 연결을 자연스럽고 격식 있게 살리기 위해 ‘그러므로’를 택했습니다.
- source_word: אָדָם
  english_pob_choice: people
  chosen_korean: 사람을
  alternatives_korean:
  - 인간을
  - 백성을
  lexicon: HALOT
  rationale: 히브리어 אָדָם의 집합적 대상을 한국어에서는 단수 목적어 ‘사람을’로 옮겨, 땅이 사람들을 삼키는 비유적 의미를 그대로 드러냈습니다.
- source_word: תֹאכְלִי
  english_pob_choice: devour
  chosen_korean: 삼키지
  alternatives_korean:
  - 먹지
  - 집어삼키지
  lexicon: HALOT
  rationale: 단순한 ‘먹다’보다 문맥상의 파괴적 은유를 살리기 위해 ‘삼키다’를 사용했습니다.
- source_word: תכשלי
  english_pob_choice: cause your nation to stumble
  chosen_korean: 걸려 넘어지게 하지
  alternatives_korean:
  - 넘어지게 하지
  - 실족하게 하지
  lexicon: HALOT
  rationale: 어근 כשל의 핵심 의미인 ‘비틀거리다/넘어지다’를 살려, 땅이 자기 민족의 몰락 원인이 되지 않는다는 뜻을 직설적으로 표현했습니다.
theological_decisions:
- issue: נְאֻם אֲדֹנָי יְהוִה의 신명 표기
  chosen_reading: 주 하나님이 말씀하십니다.
  alternative_readings:
  - 주 야훼께서 말씀하십니다.
  - 주 여호와 하나님이 말씀하십니다.
  rationale: 본문의 אֲדֹנָי יְהוִה는 한국어에서 관용적으로 ‘주 하나님’으로 옮겨 두 호칭을 함께 보존하면서도 중복을 피하는 것이 자연스럽습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 하반절의 대안 전승
  chosen_reading: ‘걸려 넘어지게 하지’로 본문을 옮기고, 대안 독법은 주석으로 보존합니다.
  alternative_readings:
  - ‘네 민족을 앗아가지 않으며’
  - ‘네 민족을 슬퍼하게 하지 않으며’
  rationale: 마소라 본문의 כשל(‘걸려 넘어지다’)을 본문에 반영하되, 전승상 다른 모음화에서 나오는 의미 차이를 지우지 않기 위해 주석으로 남깁니다.
  doctrine_reference: WLC consonantal text with alternative vocalization/tradition
