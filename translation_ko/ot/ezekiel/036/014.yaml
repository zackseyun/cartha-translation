revisions:
- from: 그러므로 당신은 더 이상 사람을 삼키지 않으며, 더 이상 당신의 민족이 걸려 넘어지게 하지 않을 것입니다. 주 하나님이 말씀하십니다.[a]
  to: 그러므로 너는 다시는 사람들을 삼키지 않을 것이며, 다시는 네 민족을 넘어지게 하지 않을 것입니다. 주 야훼께서 말씀하십니다.[a]
  rationale: 사역 동사의 목적어를 ‘네 민족을’으로 바로잡아 마소라 본문의 כשל 독법을 충실히 반영했습니다. 땅을 향한 호칭을 자연스러운 ‘너/네’로 고치고, 제공된 용어 원칙에 따라 신명을 ‘주 야훼’로 통일했습니다. 대안 모음화/전승의 ‘bereave’ 계열 의미는 본문에 합류시키지 않고 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:45:36Z'
