id: EZK.36.28
reference: Ezekiel 36:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וִ/ישַׁבְתֶּ֣ם בָּ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לַ/אֲבֹֽתֵי/כֶ֑ם וִ/הְיִ֤יתֶם לִ/י֙ לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/כֶ֖ם לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/028.yaml
  text: You will dwell in the land that I gave to your fathers[a], and you will be my people, and I will be your God.
  footnotes:
  - marker: a
    text: Or 'ancestors' for 'fathers.' The Hebrew is literally 'fathers,' echoing the ancestral covenant promises.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희 조상들에게 준 그 땅에 너희가 거주하게 될 것이며, 너희는 내 백성이 되고 나는 너희의 하나님이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 문자적으로 ‘아버지들’입니다. 여기서는 언약의 조상들을 가리키는 관용으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִישַׁבְתֶּם
  english_pob_choice: you will dwell
  chosen_korean: 거주하게 될 것이며
  alternatives_korean:
  - 살게 될 것이며
  - 머물게 될 것이며
  - 정착하게 될 것이며
  lexicon: HALOT
  rationale: 예언적 미래로서 ‘거주하다’는 정착한 삶의 상태를 비교적 직접적으로 살리면서도, ‘정착하다’보다 지나치게 과정을 강조하지 않습니다.
- source_word: בָּאָרֶץ
  english_pob_choice: in the land
  chosen_korean: 그 땅에
  alternatives_korean:
  - 그 나라에
  - 그 지역에
  - 그 나라 땅에
  lexicon: HALOT
  rationale: 언약 문맥의 אֶרֶץ는 지리적 ‘땅’이 가장 자연스럽고, 앞절의 조상들에게 준 약속 땅이라는 연결을 유지합니다.
- source_word: לַאֲבֹתֵיכֶם
  english_pob_choice: to your fathers
  chosen_korean: 너희 조상들에게
  alternatives_korean:
  - 너희 아버지들에게
  - 너희 선조들에게
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘아버지들’이지만, 한국어에서는 언약 조상들을 가리키는 관용을 살리기 위해 ‘조상들’이 가장 자연스럽습니다. 다만 이 표현은 아브라함-이삭-야곱 계열의 약속 배경을 그대로 반영합니다.
- source_word: וִהְיִיתֶם לִי לְעָם
  english_pob_choice: you will be my people
  chosen_korean: 너희는 내 백성이 되고
  alternatives_korean:
  - 너희는 나의 백성이 될 것이고
  - 너희는 나를 위한 백성이 되고
  lexicon: HALOT
  rationale: 전형적인 언약 공식이므로 ‘내 백성’으로 옮겨 관계적 소속과 언약적 정체성을 간결하게 살렸습니다.
- source_word: וְאָנֹכִי אֶהְיֶה לָכֶם לֵאלֹהִים
  english_pob_choice: and I will be your God
  chosen_korean: 나는 너희의 하나님이 되겠습니다
  alternatives_korean:
  - 나는 너희에게 하나님이 되겠습니다
  - 나는 너희의 하나님이 될 것입니다
  lexicon: HALOT
  rationale: 역시 언약 공식이므로 ‘너희의 하나님’으로 직역적 관계를 유지했습니다. 한국어 미래 시제의 공손한 선언형으로 예언의 확정성을 드러냅니다.
theological_decisions:
- issue: 언약 공식의 유지
  chosen_reading: ‘너희는 내 백성이 되고 나는 너희의 하나님이 되겠습니다’로 두 절을 관용적이되 대칭적으로 유지했습니다.
  alternative_readings:
  - 너희는 나의 백성이 될 것이고 나는 너희에게 하나님이 되겠습니다
  - 너희는 내 백성이 되고 나는 너희에게 하나님이 되겠습니다
  rationale: 히브리어의 대표적인 언약 공식이므로, 의미를 풀어쓰지 않고 상호 소속 관계를 그대로 드러내는 것이 본문과 정경적 울림을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘fathers’의 번역
  chosen_reading: 본문에는 ‘조상들’로 옮기고, 주석 없이 본문 안에서 자연스럽게 처리했습니다.
  alternative_readings:
  - 아버지들
  - 선조들
  rationale: 히브리어의 남성형 표지를 한국어에서 그대로 드러내기보다, 언약 약속의 수혜 대상을 명확히 하는 ‘조상들’이 현대 한국어 독자에게 더 직접적으로 이해됩니다.
  doctrine_reference: Translation philosophy §4
