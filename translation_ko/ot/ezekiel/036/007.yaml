  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אֲנִ֖י נָשָׂ֣אתִי אֶת יָדִ֑/י אִם לֹ֤א הַ/גּוֹיִם֙ אֲשֶׁ֣ר לָ/כֶ֣ם מִ/סָּבִ֔יב הֵ֖מָּה כְּלִמָּתָ֥/ם יִשָּֽׂאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/007.yaml
  text: 'Therefore thus says the Lord GOD: I have lifted up my hand in oath that surely the nations that are around you will bear their disgrace[a].'
  footnotes:
  - marker: a
    text: Hebrew literally, 'I have lifted up my hand,' an idiom for swearing an oath.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. 내가 손을 들어 맹세하였으니, 너희 주변의 민족들이 반드시 자기들의 수치를 짊어질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '내 손을 들어 올렸다'라고 되어 있으며, 이는 맹세를 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 아도나이와 야훼가 결합된 호칭이므로, 존칭은 '주'로 살리고 신명은 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
- source_word: נָשָׂאתִי אֶת יָדִי
  english_pob_choice: I have lifted up my hand in oath
  chosen_korean: 내가 손을 들어 맹세하였으니
  alternatives_korean:
  - 내가 손을 들어 올렸으니
  - 내가 맹세하였으니
  lexicon: HALOT
  rationale: 직역하면 '손을 들어 올리다'이지만, 문맥상 서약 관용구이므로 맹세의 뜻을 드러내되 원래의 손 동작 이미지를 완전히 지우지 않았습니다.
- source_word: הַגּוֹיִם ... מִסָּבִיב
  english_pob_choice: the nations that are around you
  chosen_korean: 너희 주변의 민족들
  alternatives_korean:
  - 너희를 둘러싼 민족들
  - 주변에 있는 민족들
  lexicon: HALOT
  rationale: גּוֹיִם은 여기서 주변의 외국 민족들을 가리키므로 '민족들'이 가장 자연스럽고, '주변의'로 공간적 관계를 유지했습니다.
- source_word: כְּלִמָּתָם
  english_pob_choice: their disgrace
  chosen_korean: 자기들의 수치
  alternatives_korean:
  - 그들의 수치
  - 그들의 치욕
  - 그들의 수모
  lexicon: HALOT
  rationale: כְּלִמָּה는 수치/치욕/모욕의 뜻이 있으나, 예언적 심판 맥락에서 한국어로는 '수치'가 가장 간결하고 문맥에 맞습니다.
theological_decisions:
- issue: 여호와/야훼의 표기와 아도나이-야훼 결합 호칭
  chosen_reading: '''주 야훼''로 옮겨, 서열 호칭 ''주''와 언약 이름 ''야훼''를 함께 드러냈습니다.'
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 본문은 אֲדֹנָי יְהוִה의 결합 호칭을 사용하므로, 둘 중 하나를 지우지 않고 두 요소를 모두 보존하는 것이 소스 충실도에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for יְהוָה YHWH'
