revisions:
- from: 내가 너희 위에 사람 곧 내 백성 이스라엘을 오게 할 것이며, 그들이 너를 차지할 것이고, 너는 그들의 기업이 될 것이며, 다시는 그들을 자식 잃게 하지 않을 것입니다.[a]
  to: 내가 내 백성 이스라엘 사람들을 너희 위에 다니게 하겠습니다.[a] 그들이 너희를 차지할 것이며, 너희는 그들의 기업이 될 것이고, 다시는 그들이 자녀를 잃게 하지 않을 것입니다.
  rationale: Revised the movement verb to retain the Hebrew causative walking imagery, clarified that the collective ‘man’ refers to Israel, made the land address consistent in Korean, and retained the established covenant-land terms ‘차지하다’ and ‘기업.’ The footnote continues to preserve the Hebrew’s literal collective-singular expression and notes the smoother alternative.
