id: EZK.36.12
reference: Ezekiel 36:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הוֹלַכְתִּי֩ עֲלֵי/כֶ֨ם אָדָ֜ם אֶת עַמִּ֤/י יִשְׂרָאֵל֙ וִֽ/ירֵשׁ֔וּ/ךָ וְ/הָיִ֥יתָ לָ/הֶ֖ם לְ/נַחֲלָ֑ה וְ/לֹא תוֹסִ֥ף ע֖וֹד לְ/שַׁכְּלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/012.yaml
  text: And I will cause people—my people Israel—to walk upon you[a], and they will possess you, and you will be their inheritance[c][b], and you will no longer bereave them.
  footnotes:
  - marker: a
    text: Or 'I will bring people upon you, my people Israel.' The Hebrew literally says 'I will cause man to walk upon you,' with 'my people Israel' explaining who is meant.
    reason: lexical_alternative
  - marker: b
    text: Or 'they will inherit you.' The verb can mean either 'possess' or 'inherit' in land contexts.
    reason: lexical_alternative
  - marker: c
    text: Or 'make them childless' / 'deprive them of children.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 백성 이스라엘 사람들을 너희 위에 다니게 하겠습니다.[a] 그들이 너희를 차지할 것이며, 너희는 그들의 기업이 될 것이고, 다시는 그들이 자녀를 잃게 하지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘사람’을 말하며, 이어지는 ‘내 백성 이스라엘’이 그 사람들이 누구인지를 설명합니다. 또는 ‘내 백성 이스라엘을 너희 위에 오게 하겠다’로 옮길 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וְהוֹלַכְתִּי עֲלֵיכֶם אָדָם
  english_pob_choice: I will cause people—my people Israel—to walk upon you
  chosen_korean: 내가 너희 위에 사람 곧 내 백성 이스라엘을 오게 할 것이며
  alternatives_korean:
  - 내가 너희 위로 사람을 걷게 할 것이며
  - 내가 사람들을 너희 위에 데려갈 것이며
  lexicon: HALOT
  rationale: 히필 הוֹלִיךְ의 사역적 의미를 살리면서, 이어지는 ‘내 백성 이스라엘’의 설명을 반영해 ‘사람 곧…’으로 옮겼습니다. 한국어에서는 ‘걷게 하다’보다 ‘오게 하다’가 더 자연스럽지만, 사역의 주도권은 유지했습니다.
- source_word: וִירֵשׁוּךָ
  english_pob_choice: they will possess you
  chosen_korean: 그들이 너를 차지할 것이고
  alternatives_korean:
  - 그들이 너를 소유할 것이고
  - 그들이 너를 상속받을 것이고
  lexicon: HALOT
  rationale: 땅을 대상으로 한 יָרַשׁ의 의미를 한국어에서 가장 직접적으로 드러내는 말로 ‘차지하다’를 택했습니다. 단순 소유보다 점유·획득의 뉘앙스를 더 잘 살립니다.
- source_word: וְהָיִיתָ לָהֶם לְנַחֲלָה
  english_pob_choice: you will be their inheritance
  chosen_korean: 너는 그들의 기업이 될 것이며
  alternatives_korean:
  - 너는 그들의 상속이 될 것이며
  - 너는 그들의 소유가 될 것이며
  lexicon: HALOT
  rationale: נַחֲלָה는 언약적 토지 어휘이므로 전통적 성경 어휘인 ‘기업’을 사용해 소유 이상의 상속·유업 의미를 보존했습니다.
- source_word: וְלֹא תוֹסִף עוֹד לְשַׁכְּלָם
  english_pob_choice: and you will no longer bereave them
  chosen_korean: 다시는 그들을 자식 잃게 하지 않을 것입니다.
  alternatives_korean:
  - 다시는 그들을 슬피하게 하지 않을 것입니다.
  - 다시는 그들을 불모가 되게 하지 않을 것입니다.
  lexicon: HALOT
  rationale: שׁכל의 핵심 의미인 ‘자식을 잃게 하다/자식 잃은 자로 만들다’를 한국어에서 분명히 드러내기 위해 ‘자식 잃게 하다’로 옮겼습니다. 예언 맥락상 단순한 슬픔보다 자손 상실의 강한 뜻을 살렸습니다.
theological_decisions:
- issue: ‘기업’으로 번역되는 나חל 언어의 언약적 함의
  chosen_reading: 너는 그들의 기업이 될 것이며
  alternative_readings:
  - 너는 그들의 소유가 될 것이며
  - 너는 그들이 상속받을 것이며
  rationale: 이 절은 이스라엘의 땅 회복을 말하는 언약적 문맥이므로, 단순 소유가 아니라 하나님이 주시는 유업의 의미를 담는 ‘기업’이 가장 적절합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms)
- issue: שׁכל의 번역에서 ‘bereave’의 강한 가족 상실 의미를 보존할지 여부
  chosen_reading: 다시는 그들을 자식 잃게 하지 않을 것입니다.
  alternative_readings:
  - 다시는 그들을 슬프게 하지 않을 것입니다.
  - 다시는 그들을 불임이 되게 하지 않을 것입니다.
  rationale: 문맥상 땅이 이스라엘을 더 이상 잃게 하지 않는다는 약속이므로, 단순 감정의 슬픔보다 자식 상실의 구체적이고 충격적인 의미를 살리는 편이 본문에 더 충실합니다.
  doctrine_reference: Ezekiel 36 land-restoration oracle
