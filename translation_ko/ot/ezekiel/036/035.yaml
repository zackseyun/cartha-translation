  text: And they will say, ‘This land that was desolate has become like the garden of Eden, and the cities that were ruined, desolate, and torn down are fortified and inhabited.’
translation:
  language: ko
  text: 그리고 그들은 말할 것입니다. ‘이 황폐하던 땅이 에덴동산처럼 되었고, 무너지고 황폐하며 허물어진 도시들은 요새처럼 견고해져 사람이 살게 되었습니다.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ / And they will say
  english_pob_choice: And they will say
  chosen_korean: 그리고 그들은 말할 것입니다
  alternatives_korean:
  - 그들은 말할 것입니다
  - 그들이 말할 것입니다
  lexicon: אמר
  rationale: 미래 서술을 살리면서도 예언적 진술의 자연스러운 한국어 흐름을 위해 ‘그리고’를 붙였습니다.
- source_word: הָאָרֶץ הַלֵּזוּ הַנְּשַׁמָּה
  english_pob_choice: This land that was desolate
  chosen_korean: 이 황폐하던 땅
  alternatives_korean:
  - 이 황폐한 땅
  - 이 버려졌던 땅
  lexicon: ארץ, נשם
  rationale: 땅의 상태를 단순 형용사보다 과정성을 가진 ‘황폐하던’으로 옮겨, 히브리어의 황폐 상태를 살렸습니다.
- source_word: כְגַן עֵדֶן
  english_pob_choice: like the garden of Eden
  chosen_korean: 에덴동산처럼
  alternatives_korean:
  - 에덴의 동산처럼
  - 낙원처럼
  lexicon: גן, עדן
  rationale: 고유한 성경 지명을 살리되 한국어에서 가장 자연스러운 관용 표현으로 정리했습니다.
- source_word: הֶחֳרֵבוֹת ... הַנֶּהֱרָסוֹת ... בְּצוּרוֹת
  english_pob_choice: ruined, desolate, and torn down ... fortified
  chosen_korean: 무너지고 황폐하며 허물어진 ... 요새처럼 견고해져
  alternatives_korean:
  - 무너지고 황폐하고 허물어진 ... 요새로
  - 폐허가 된 ... 성채처럼
  lexicon: חרב, נשם, הרס, בצורה
  rationale: 세 개의 파괴 상태를 모두 유지하고, 마지막의 ‘fortified’는 단순 ‘성벽이 있다’보다 ‘요새처럼 견고해져’로 옮겨 방어적 재건 이미지를 살렸습니다.
theological_decisions:
- issue: 도시의 회복을 나타내는 अंतिम 표현의 해석
  chosen_reading: ‘요새처럼 견고해져 사람이 살게 되었습니다’로 옮겨, 단순 복구가 아니라 안전한 거주 가능 상태를 드러냈습니다.
  alternative_readings:
  - ‘요새화되어 살게 되었습니다’
  - ‘성채가 되어 사람이 살게 되었습니다’
  rationale: בְּצוּרוֹת יָשָׁבוּ는 거주와 방어의 결합을 암시하므로, 두 요소를 모두 드러내는 표현이 원문의 힘을 더 잘 보존합니다.
  doctrine_reference: Ezekiel 36:35의 회복 예언
- issue: 예언적 미래 시제
  chosen_reading: 미래형 ‘말할 것입니다’를 사용했습니다.
  alternative_readings:
  - ‘말합니다’
  - ‘말하리라’
  rationale: 히브리어 와우접속 미래의 예언적 성격을 현대 한국어에서 자연스러운 미래 서술로 반영했습니다.
  doctrine_reference: 예언문체
