  - 민족들의 수치를 당했기 때문입니다
  rationale: 히브리어 נָשָׂא + כְּלִמָּה의 부담/수치의 ‘짐짐’ 이미지를 살려, 단순한 감정 상태보다 역사적 불명예의 수용을 드러냈습니다.
  doctrine_reference: Ezekiel 36:6; shame/bearing motif
