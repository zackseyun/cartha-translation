  edition: WLC
  text: וְ/יָדְע֣וּ הַ/גּוֹיִ֗ם אֲשֶׁ֣ר יִֽשָּׁאֲרוּ֮ סְבִיבוֹתֵי/כֶם֒ כִּ֣י אֲנִ֣י יְהוָ֗ה בָּנִ֨יתִי֙ הַ/נֶּ֣הֱרָס֔וֹת נָטַ֖עְתִּי הַ/נְּשַׁמָּ֑ה אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/036.yaml
  text: Then the nations that remain around you will know that I[a], Yahweh, have rebuilt the ruined places and planted what was desolate. I, Yahweh, have spoken, and I will do it.
  footnotes:
  - marker: a
    text: Or, 'have spoken and done it.' The Hebrew final verb is formally perfect, but here it likely expresses the certainty of what the LORD will accomplish.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 여러분 주위에 남아 있는 민족들이 내가, 야훼, 무너진 곳들을 다시 세우고 황폐한 곳에 심었다는 것을 알게 될 것입니다. 나, 야훼가 말하였고, 내가 그것을 행할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말하였고, 내가 그것을 행할 것입니다’는 예언적 관용법을 반영한 번역입니다. 히브리어 마지막 동사는 형태상 완료형이지만, 여기서는 야훼의 확실한 성취를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ הַגּוֹיִם
  english_pob_choice: Then the nations ... will know
  chosen_korean: 그러면 ... 민족들이 ... 알게 될 것입니다
  alternatives_korean:
  - 그리고 ... 민족들이 ... 알게 될 것입니다
  - 그 민족들이 ... 알게 될 것입니다
  lexicon: HALOT
  rationale: 문맥상 심판 뒤 회복의 결과를 나타내는 진행을 살려 ‘그러면’으로 옮겼고, הַגּוֹיִם은 에스겔의 일반 용례에 따라 ‘민족들’로 옮겼습니다.
- source_word: בָּנִיתִי הַנֶּהֱרָסוֹת
  english_pob_choice: have rebuilt the ruined places
  chosen_korean: 무너진 곳들을 다시 세우고
  alternatives_korean:
  - 폐허를 다시 세우고
  - 파괴된 곳들을 다시 세우고
  lexicon: HALOT
  rationale: בנה는 단순한 ‘건축’보다 회복적 ‘다시 세우다’가 문맥에 맞고, הַנֶּהֱרָסוֹת는 장소를 가리키므로 ‘곳들’로 자연스럽게 풀었습니다.
- source_word: נָטַעְתִּי הַנְּשַׁמָּה
  english_pob_choice: planted what was desolate
  chosen_korean: 황폐한 곳에 심었다
  alternatives_korean:
  - 황폐한 것을 심었다
  - 황무지에 심었다
  lexicon: HALOT
  rationale: נָטַע는 문자적으로 ‘심다’이며, הַנְּשַׁמָּה는 황폐함이 남은 상태를 가리켜 ‘황폐한 곳’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본 기록의 기본 원칙에 따라 יְהוָה는 고유명사 ‘야훼’로 옮겨, 단순 호칭 ‘주’와 구별했습니다.
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  english_pob_choice: I have spoken, and I will do it
  chosen_korean: 말하였고, 내가 그것을 행할 것입니다
  alternatives_korean:
  - 말하였고, 행하였습니다
  - 말하였고, 행하리라
  lexicon: HALOT
  rationale: 첫 동사는 완료형의 진술을 살리고, 마지막 동사는 예언적 확실성을 한국어의 미래형으로 옮겨 선언의 확정성을 드러냈습니다.
theological_decisions:
- issue: 예언적 완료형과 확실한 미래의 관계(דִּבַּרְתִּי וְעָשִׂיתִי)
  chosen_reading: ‘말하였고, 내가 그것을 행할 것입니다’로 번역해, 이미 선포된 말씀이 반드시 성취될 미래를 드러냈습니다.
  alternative_readings:
  - ‘말하였고, 행하였습니다’
  - ‘말하였고, 행하리라’
  rationale: 히브리어 종결부는 형태상 완료형이지만, 예언 문맥에서는 하나님의 확정된 실행을 가리키므로 한국어에서는 미래형이 더 분명하게 약속의 힘을 전달합니다.
  doctrine_reference: 예언적 확실성의 완료형 사용
- issue: יְהוָה의 표기
  chosen_reading: ‘야훼’
  alternative_readings:
  - ‘여호와’
  - ‘주’
  rationale: 문서의 표준 용례를 따라 신적 고유명을 보존해, 제목어로 완화하지 않고 언약적 이름을 직접 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
