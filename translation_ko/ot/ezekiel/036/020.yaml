  - severity: low
    issue: ‘곧 사람들이 … 하였기 때문입니다’ 연결이 부자연스러움
    rationale: 원문의 בְּאֱמֹר는 말해진 상황/수단을 나타냅니다. 한국어에서는 ‘…라고 말했기 때문입니다’가 이 문맥의 인과적 설명을 자연스럽게 전달합니다.
