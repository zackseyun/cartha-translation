reference: Ezekiel 36:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּב֗וֹא אֶל הַ/גּוֹיִם֙ אֲשֶׁר בָּ֣אוּ שָׁ֔ם וַֽ/יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י בֶּ/אֱמֹ֤ר לָ/הֶם֙ עַם יְהוָ֣ה אֵ֔לֶּה וּ/מֵ/אַרְצ֖/וֹ יָצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/020.yaml
  text: And when they came to the nations where they went[a], they profaned my holy name, in that people said of them, ‘These are the people of Yahweh[b], and yet they had to go out of his land.’
  footnotes:
  - marker: a
    text: Or, more literally, 'when it was said to them'; the sense in context is that this was said about them among the nations.
    reason: lexical_alternative
  - marker: b
    text: Or 'but they went out from his land.' The Hebrew implies the disgrace of exile without explicitly stating who drove them out.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 갔던 그 민족들 가운데에 이르렀을 때, 그들이 내 거룩한 이름을 더럽혔습니다. 곧 사람들이 그들에 대해 말하기를, “이들은 야훼의 백성인데도 그의 땅에서 나왔습니다.”라고 하였기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들에게 말하기를’이지만, 문맥상 민족들 가운데에서 그들에 대해 그렇게 말한 뜻입니다.
    reason: alternative_reading
  - marker: b
    text: 직역은 ‘그의 땅에서 나갔다’이지만, 문맥상 수치와 추방의 뉘앙스를 담고 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא אֶל הַגּוֹיִם
  english_pob_choice: when they came to the nations
  chosen_korean: 그들이 갔던 그 민족들 가운데에 이르렀을 때
  alternatives_korean:
  - 그들이 그 민족들에게 이르렀을 때
  - 그들이 그 민족들 가운데로 갔을 때
  lexicon: HALOT
  rationale: 동사는 단수형이지만 문맥상 집합적 주어를 가리키므로 한국어에서는 복수로 자연스럽게 풀었습니다. ‘민족들’은 이 문맥의 უცხ국 집단을 가장 직접적으로 드러냅니다.
- source_word: וַיְחַלְּלוּ
  english_pob_choice: they profaned
  chosen_korean: 그들이 내 거룩한 이름을 더럽혔습니다
  alternatives_korean:
  - 그들이 내 거룩한 이름을 욕되게 했습니다
  - 그들이 내 거룩한 이름을 속되게 했습니다
  lexicon: HALOT
  rationale: חלל의 핵심은 거룩한 것을 속되게 만드는 것이므로, 언약적·신학적 무게를 살려 ‘더럽혔습니다’로 옮겼습니다.
- source_word: שֵׁם קָדְשִׁי
  english_pob_choice: my holy name
  chosen_korean: 내 거룩한 이름
  alternatives_korean:
  - 내 성스러운 이름
  - 나의 거룩한 이름
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 유지하면서도 한국어로 자연스럽게 들리도록 ‘내 거룩한 이름’으로 옮겼습니다.
- source_word: בֶּאֱמֹר לָהֶם
  english_pob_choice: in that people said of them
  chosen_korean: 곧 사람들이 그들에 대해 말하기를
  alternatives_korean:
  - 사람들이 그들에 대해 말하여
  - 그들에 대해 사람들이 말하기를
  lexicon: HALOT
  rationale: 히브리어 부정사구는 직접 인용의 배경 상황을 나타내므로, 원인 설명을 지나치게 해석하지 않고 ‘말하기를’로 처리했습니다. 영어 POB의 인칭·논리 긴장을 그대로 살리기 위해 행위 주체를 일반화했습니다.
- source_word: עַם יְהוָה
  english_pob_choice: the people of Yahweh
  chosen_korean: 야훼의 백성
  alternatives_korean:
  - 야훼의 사람들
  - 야훼께 속한 백성
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 יהוה를 ‘야훼’로 옮기고, עַם은 이 문맥에서 언약 공동체를 가리키므로 ‘백성’이 가장 적절합니다.
- source_word: וּמֵאַרְצוֹ יָצָאוּ
  english_pob_choice: and yet they had to go out of his land
  chosen_korean: 그의 땅에서 나왔습니다
  alternatives_korean:
  - 그의 땅에서 나가야 했습니다
  - 그의 땅에서 쫓겨났습니다
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘나갔다’고 말하지만, 문맥상 수치스러운 추방의 뉘앙스가 있습니다. 이를 과도하게 해석하지 않고 본문 의미를 유지하기 위해 직설적으로 번역했습니다.
theological_decisions:
- issue: 야훼의 이름이 어떻게 더럽혀지는가
  chosen_reading: 이스라엘이 열방 가운데서 겪는 수치가, 그들에 대한 말로 인해 야훼의 이름을 더럽히는 결과를 낳는다고 이해했습니다.
  alternative_readings:
  - 열방이 직접 야훼의 이름을 더럽혔다고 볼 수 있습니다
  - 주어와 원인이 압축되어 있어 해석을 더 단정할 수 없습니다
  rationale: 히브리어는 주어와 매개 상황을 압축하고 있어, 본문의 긴장을 풀지 않고 ‘그들이 더럽혔습니다’와 ‘사람들이 그들에 대해 말하기를’의 관계를 함께 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트의 공용 기준에 따라 신명은 ‘야훼’로 옮겨 언약명 자체를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
