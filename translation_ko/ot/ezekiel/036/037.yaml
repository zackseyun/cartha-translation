  lexicon: HALOT
  rationale: 니팔 דרש의 ‘찾다/구하다’와 ‘찾임을 받다’의 수동·허용 뉘앙스를 살려, 하나님이 자기 백성의 구함을 통해 일하시는 긴장을 유지했습니다.
- source_word: לַעֲשׂוֹת לָהֶם
  english_pob_choice: to act for them
  chosen_korean: 그들을 위하여 행하게 하리라
  alternatives_korean:
