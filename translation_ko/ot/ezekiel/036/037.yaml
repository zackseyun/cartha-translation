  source_fidelity: 아드ोनָי יְהוִה는 ‘주 야훼’로 적절히 옮겼습니다. 그러나 אִדָּרֵשׁ(니팔)는 이스라엘이 하나님께 ‘구함을 받다/찾음을 받다’라는 뜻인데, 초안의 ‘이스라엘 집이 나에게 구하도록 하여’는 하나님이 그들이 구하도록 직접 시키신다는 사역 의미로 기울어집니다. 또한 כַּצֹּאן אָדָם의 어순과 비유의 낯섦을 ‘사람 떼의 양 떼’가 충분히 반영하지 못합니다.
  naturalness: ‘이스라엘 집의 간구를 받아’는 니팔의 수동적·응답적 의미를 자연스러운 현대 한국어로 표현합니다. ‘사람의 양 떼처럼’은 다소 낯선 원문의 표현을 보존하되, 각주로 의미를 보충하는 방식이 적절합니다.
  terminology: ‘주 야훼’, ‘이스라엘 집’, ‘많게 하겠다’는 적절합니다. ‘행하게 하리라’는 문법상 하나님이 누군가에게 행위를 시키는 뜻으로도 읽힐 수 있으므로, עשה의 주체가 하나님임을 드러내는 ‘행하겠다’가 더 정확합니다.
