  lexicon: HALOT
  rationale: 직역의 낯설음을 완전히 평탄화하지 않으면서도, 한국어에서 의미가 전달되도록 ‘사람 떼’와 ‘양 떼’를 함께 살렸습니다.
theological_decisions:
- issue: 예언자적 하나님의 직접 화법에서의 호칭과 존대
  chosen_reading: “주 야훼께서 이렇게 말씀하십니다”로 서술하고, 인용문 안에서는 1인칭 하나님의 발화를 그대로 유지했습니다.
  alternative_readings:
  - “주 하나님께서 말씀하십니다”
  - 인용문 안에서도 간접화하여 서술
  rationale: 본문의 예언자적 선언 형식을 살리기 위해 서술부와 직접 화법을 구분했고, 하나님을 직접 가리키는 서술은 존대 형식을 유지했습니다.
  doctrine_reference: 'POB Korean style guideline: direct divine address and prophetic quotation register'
- issue: אִדָּרֵשׁ의 주권성과 기도의 긴장
  chosen_reading: ‘나에게 구하도록 하여… 행하게 하리라’로 옮겨, 하나님의 하시는 일과 이스라엘의 구함을 함께 유지했습니다.
  alternative_readings:
  - 완전히 능동적으로만 번역
  - 완전히 수동적으로만 번역
  rationale: 본문은 회복의 약속과 백성의 구함을 분리하지 않고 함께 제시하므로, 둘 사이의 신학적 긴장을 보존하는 번역이 필요합니다.
  doctrine_reference: Preserve theological tension rather than resolve it
