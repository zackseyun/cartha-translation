base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/037.yaml
  text: 'Thus says the Lord GOD: Yet in this also I will let the house of Israel ask me to act for them: I will multiply them like a flock of men[a][b].'
  footnotes:
  - marker: a
    text: Or, 'I will be inquired of by the house of Israel to do this for them.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'like a flock of men'; that is, a great human multitude like a flock.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. “내가 이 일에서도 이스라엘 집이 나에게 구하도록 하여 그들을 위하여 행하게 하리라. 내가 그들을 사람 떼의 양 떼 같이 많게 하리라.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나에게 구하도록 하여’는 ‘나에게 찾음/문의함을 받게 하여’의 의미도 가능합니다.
    reason: alternative_reading
  - marker: b
    text: ‘사람 떼의 양 떼 같이’는 히브리어의 직설적 표현으로, 곧 큰 인간 무리를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: אֲדֹנָי와 יהוה가 결합된 호칭을 한국어에서는 두 요소를 모두 살리면서도, 본문이 직접 쓰는 신명은 야훼로 옮기는 것이 source-direct입니다.
- source_word: אִדָּרֵשׁ
  english_pob_choice: I will let the house of Israel ask me
  chosen_korean: 이스라엘 집이 나에게 구하도록 하여
  alternatives_korean:
  - 이스라엘 집이 나를 찾도록 하여
  - 이스라엘 집이 나에게 물어보도록 하여
  - 이스라엘 집에게 구함을 받게 하여
  lexicon: HALOT
  rationale: 니팔 דרש의 ‘찾다/구하다’와 ‘찾임을 받다’의 수동·허용 뉘앙스를 살려, 하나님이 자기 백성의 구함을 통해 일하시는 긴장을 유지했습니다.
- source_word: לַעֲשׂוֹת לָהֶם
  english_pob_choice: to act for them
  chosen_korean: 그들을 위하여 행하게 하리라
  alternatives_korean:
  - 그들을 위하여 일하게 하리라
  - 그들을 위하여 하게 하리라
  lexicon: HALOT
  rationale: עָשָׂה의 넓은 뜻을 지나치게 좁히지 않으면서, 한국어에서 자연스럽게 하나님의 행동을 나타내는 표현으로 옮겼습니다.
- source_word: כַּצֹּאן אָדָם
  english_pob_choice: like a flock of men
  chosen_korean: 사람 떼의 양 떼 같이
  alternatives_korean:
  - 사람의 양 떼 같이
  - 인간의 양 떼 같이
  - 사람의 무리처럼
  lexicon: HALOT
  rationale: 직역의 낯설음을 완전히 평탄화하지 않으면서도, 한국어에서 의미가 전달되도록 ‘사람 떼’와 ‘양 떼’를 함께 살렸습니다.
theological_decisions:
- issue: 예언자적 하나님의 직접 화법에서의 호칭과 존대
  chosen_reading: “주 야훼께서 이렇게 말씀하십니다”로 서술하고, 인용문 안에서는 1인칭 하나님의 발화를 그대로 유지했습니다.
  alternative_readings:
  - “주 하나님께서 말씀하십니다”
  - 인용문 안에서도 간접화하여 서술
  rationale: 본문의 예언자적 선언 형식을 살리기 위해 서술부와 직접 화법을 구분했고, 하나님을 직접 가리키는 서술은 존대 형식을 유지했습니다.
  doctrine_reference: 'POB Korean style guideline: direct divine address and prophetic quotation register'
- issue: אִדָּרֵשׁ의 주권성과 기도의 긴장
  chosen_reading: ‘나에게 구하도록 하여… 행하게 하리라’로 옮겨, 하나님의 하시는 일과 이스라엘의 구함을 함께 유지했습니다.
  alternative_readings:
  - 완전히 능동적으로만 번역
  - 완전히 수동적으로만 번역
  rationale: 본문은 회복의 약속과 백성의 구함을 분리하지 않고 함께 제시하므로, 둘 사이의 신학적 긴장을 보존하는 번역이 필요합니다.
  doctrine_reference: Preserve theological tension rather than resolve it
