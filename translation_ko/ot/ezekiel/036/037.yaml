base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/037.yaml
  text: 'Thus says the Lord GOD: Yet in this also I will let the house of Israel ask me to act for them: I will multiply them like a flock of men[a][b].'
  footnotes:
  - marker: a
    text: Or, 'I will be inquired of by the house of Israel to do this for them.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'like a flock of men'; that is, a great human multitude like a flock.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. “내가 이 일에서도 이스라엘 집의 간구를 받아 그들을 위하여 행하겠다.[a] 내가 그들을 사람의 양 떼처럼 많게 하겠다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘내가 이스라엘 집에게 구함을 받아 그들을 위하여 행하겠다.’
    reason: alternative_reading
  - marker: b
    text: 히브리어로는 ‘사람의 양 떼처럼’입니다. 양 떼처럼 매우 많은 사람의 무리를 뜻하는 이례적인 표현입니다.
    reason: lexical_alternative
lexical_decisions:
