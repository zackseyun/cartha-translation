  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִרְבֵּיתִ֧י עֲלֵי/כֶ֛ם אָדָ֥ם וּ/בְהֵמָ֖ה וְ/רָב֣וּ וּ/פָר֑וּ וְ/הוֹשַׁבְתִּ֨י אֶתְ/כֶ֜ם כְּ/קַדְמֽוֹתֵי/כֶ֗ם וְ/הֵטִֽבֹתִי֙ מֵ/רִאשֹׁ֣תֵי/כֶ֔ם וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/011.yaml
  text: And I will multiply upon you man and beast[a], and they will multiply and be fruitful; and I will settle you as in your former times, and I will do better for you than at your beginnings[c][b]. Then you will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'humankind and animals.' The Hebrew reads literally 'man and beast,' a common prophetic pairing for human and animal population together.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will cause you to dwell' / 'I will resettle you.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I will do good to you more than at first.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희 위에 사람과 짐승을 많이 번성하게 하겠습니다. 그들이 번성하고 열매를 맺을 것입니다. 내가 너희를 너희 옛적 때와 같이 거기에 살게 하고, 너희의 처음보다 너희에게 더 좋게 하겠습니다. 그러면 너희는 내가 야훼임을 알게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘사람과 짐승’입니다. 예언서에서 인간과 동물의 증가를 함께 가리키는 흔한 병렬 표현입니다.
    reason: source_note
  - marker: b
    text: ‘살게 하고’는 문자적으로는 ‘거하게 하고/거주하게 하다’에 해당합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘더 좋게 하겠습니다’는 ‘처음보다 더 선하게 행하겠다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִרְבֵּיתִי עֲלֵיכֶם
  english_pob_choice: I will multiply upon you
  chosen_korean: 너희 위에 … 많이 번성하게 하겠습니다
  alternatives_korean:
  - 너희 위에 … 많게 하겠습니다
  - 너희에게 … 번식하게 하겠습니다
  lexicon: HALOT
  rationale: הִרְבֵּיתִי의 사역형 의미와 עֲלֵיכֶם의 ‘위에/upon’ 이미지를 살리되, 한국어에서는 ‘많이 번성하게 하겠습니다’로 자연스럽게 옮겼습니다.
- source_word: אָדָם וּבְהֵמָה
  english_pob_choice: man and beast
  chosen_korean: 사람과 짐승
  alternatives_korean:
  - 인간과 가축
  - 사람과 동물
  lexicon: HALOT
  rationale: 예언문맥의 인간-동물 병치를 유지하면서도 현대 한국어에서 가장 읽기 쉬운 대응으로 ‘사람과 짐승’을 택했습니다.
- source_word: וְרָבוּ וּפָרוּ
  english_pob_choice: they will multiply and be fruitful
  chosen_korean: 그들이 번성하고 열매를 맺을 것입니다
  alternatives_korean:
  - 그들이 많아지고 번성할 것입니다
  - 그들이 번성하고 생육할 것입니다
  lexicon: HALOT
  rationale: 두 동사의 중첩된 증식 의미를 자연스럽게 살리기 위해 ‘번성하다’와 ‘열매를 맺다’를 사용했습니다. ‘열매를 맺다’는 פָּרָה의 비유적 생육 의미를 전합니다.
- source_word: וְהוֹשַׁבְתִּי אֶתְכֶם
  english_pob_choice: I will settle you
  chosen_korean: 내가 너희를 … 살게 하고
  alternatives_korean:
  - 내가 너희를 정착시키고
  - 내가 너희를 거주하게 하고
  lexicon: HALOT
  rationale: ישב의 사역형을 직역하기보다, 회복된 땅에 다시 거주하게 하는 의미를 한국어로 자연스럽게 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 이 절은 신명(וה) 직접 표기이므로 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다. 문맥상 여호와나 주님으로 완화하지 않았습니다.
theological_decisions:
- issue: וְהוֹשַׁבְתִּי אֶתְכֶם의 번역에서 ‘거주하게 하다’와 ‘정착시키다’의 선택
  chosen_reading: ‘살게 하고’로 풀어, 회복된 삶의 상태를 강조했습니다.
  alternative_readings:
  - ‘정착시키고’
  - ‘거주하게 하고’
  rationale: 문맥은 단순한 이주가 아니라 포로/황폐 상태에서의 회복과 재거주를 말합니다. 한국어에서는 ‘살게 하고’가 가장 직접적이면서도 자연스럽습니다.
  doctrine_reference: Ezekiel restoration context
- issue: וִֽידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה의 종결 공식
  chosen_reading: ‘그러면 너희는 내가 야훼임을 알게 될 것입니다’로 결과 절을 분명히 했습니다.
  alternative_readings:
  - ‘그리고 너희는 내가 야훼임을 알 것입니다’
  - ‘너희는 내가 야훼인 줄 알게 될 것입니다’
  rationale: 에스겔의 인식 공식은 회복 행위의 결과로서 신인식을 강조합니다. ‘그러면’이 그 결과성을 가장 분명하게 드러냅니다.
  doctrine_reference: Ezekiel knowledge formula
