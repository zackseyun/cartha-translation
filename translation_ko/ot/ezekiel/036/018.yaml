review_pass:
  verdict: revise
  source_fidelity: 히브리어는 하나님의 חֵמָה를 그들에게 ‘쏟는’ 행위와, 그들이 땅에 피를 ‘쏟은’ 행위를 같은 동사 שׁפךְ로 연결합니다. 초안은 두 행위와 두 가지 심판 근거(유혈과 우상으로 인한 땅의 더러움)를 정확히 반영합니다. 다만 ‘쏟아부었습니다’는 원문의 단순 동사보다 다소 강화되어 있어 ‘쏟았습니다’로 통일하면 반복과 강도가 더 정확하게 보존됩니다.
  naturalness: ‘그러므로’와 ‘그들에게 쏟았습니다’는 현대 표준어 합쇼체의 엄숙한 성경 문체에 자연스럽습니다. ‘그 땅에 쏟은 피’는 한국어에서 다소 강한 표현이지만, 원문의 의도적인 동사 반복을 보존하며 문맥상 이해 가능합니다.
  terminology: ‘진노’는 חֵמָה의 심판적·엄숙한 성격을 잘 나타내는 표준 성경 용어입니다. ‘우상’은 본문에 적절하나, גִּלּוּלִים의 경멸적 어감은 영어 POB 감사 기록과 일치하게 각주로 밝혀야 합니다.
