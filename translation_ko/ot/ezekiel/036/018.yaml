source:
  edition: WLC
  text: וָ/אֶשְׁפֹּ֤ךְ חֲמָתִ/י֙ עֲלֵי/הֶ֔ם עַל הַ/דָּ֖ם אֲשֶׁר שָׁפְכ֣וּ עַל הָ/אָ֑רֶץ וּ/בְ/גִלּוּלֵי/הֶ֖ם טִמְּאֽוּ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/018.yaml
  text: So I poured out my wrath upon them for the blood that they had poured out on the land[a], and because they had defiled it with their idols.
  footnotes:
  - marker: a
    text: Hebrew גִּלּוּלִים is a strongly contemptuous term for idols; some renderings try to reflect this pejorative force more explicitly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 내가 그들이 그 땅에 쏟은 피 때문에, 그리고 자기들의 우상으로 그 땅을 더럽혔기 때문에 내 분노를 그들 위에 쏟아부었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶשְׁפֹּךְ
  english_pob_choice: I poured out
  chosen_korean: 쏟아부었습니다
  alternatives_korean:
  - 쏟았습니다
  - 부었습니다
  lexicon: HALOT
  rationale: 심판의 맥락에서 하나님의 غض / 분노가 대상 위에 ‘쏟아지는’ 이미지를 살리면서, 뒤의 ‘그 땅에 쏟은’과 동사 반복의 연결도 유지합니다.
- source_word: חֲמָתִי
  english_pob_choice: my wrath
  chosen_korean: 내 분노
  alternatives_korean:
  - 내 진노
  - 내 노여움
  lexicon: HALOT
  rationale: 하나님의 বিচার적 분노를 한국어에서 자연스럽고 엄숙하게 드러내는 표준 표현입니다. ‘진노’도 가능하지만, 본문 문맥에서는 보다 सीधे한 ‘분노’가 잘 맞습니다.
- source_word: עַל הַדָּם אֲשֶׁר שָׁפְכוּ
  english_pob_choice: for the blood that they had poured out
  chosen_korean: 그들이 그 땅에 쏟은 피 때문에
  alternatives_korean:
  - 그들이 흘린 피 때문에
  - 그들이 쏟아 놓은 피 때문에
  lexicon: HALOT
  rationale: 히브리어의 שׁפךְ 반복을 살려 ‘피를 쏟다’로 옮겼고, 원인 관계는 ‘때문에’로 간명하게 표현했습니다.
- source_word: וּבְגִלּוּלֵיהֶם
  english_pob_choice: with their idols
  chosen_korean: 자기들의 우상으로
  alternatives_korean:
  - 자기들의 우상들과 함께
  - 자기들의 우상 때문에
  lexicon: HALOT
  rationale: בְ의 수단/매개 뉘앙스를 살려 ‘으로’로 옮겼습니다. 문맥상 우상이 더럽힘의 수단이자 매개라는 점을 드러냅니다.
- source_word: טִמְּאֽוּ/הָ
  english_pob_choice: they had defiled it
  chosen_korean: 그 땅을 더럽혔기 때문에
  alternatives_korean:
  - 그 땅을 부정하게 했기 때문에
  - 그 땅을 더럽혔습니다
  lexicon: HALOT
  rationale: טמא의 정결/부정 맥락을 ‘더럽히다’로 자연스럽게 살렸습니다. 목적어 ‘그 땅’을 분명히 해 문장 흐름을 매끄럽게 했습니다.
theological_decisions:
- issue: ‘גִּלּוּלִים’의 경멸적 어감
  chosen_reading: 본문에는 기본적으로 ‘우상’으로 두되, 별도의 각주는 두지 않았습니다.
  alternative_readings:
  - 더러운 우상
  - 똥 우상
  rationale: 한국어에서 경멸적 뉘앙스를 과도하게 직역하면 문체가 붕괴될 수 있어, 본문은 명료성을 우선했습니다. 그러나 원어의 멸시적 성격은 사전적으로 유지됩니다.
  doctrine_reference: Translation philosophy §1, §6
