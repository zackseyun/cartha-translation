source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֚עַן אֹמְרִ֣ים לָ/כֶ֔ם אֹכֶ֥לֶת אָדָ֖ם אתי וּ/מְשַׁכֶּ֥לֶת גוי/ך הָיִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/013.yaml
  text: 'Thus says the Lord GOD: Because they say of you[b][a], ‘You devour people and have bereaved your nation,’'
  footnotes:
  - marker: a
    text: Hebrew literally, 'a devourer of man'; 'man' here carries a collective sense, i.e., people/humankind.
    reason: lexical_alternative
  - marker: b
    text: Or 'has made your nation childless' / 'has bereaved your people.'
    reason: alternative_reading
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. “너에 대하여 그들이 말하기를, ‘너는 사람을 삼키고 자기 백성을 잃게 한 땅이다’ 하였기 때문입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘사람을 삼키는 자’이며, ‘사람’은 집합적으로 사람들/인류를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 백성을 자식 잃게 한’ / ‘자기 백성을 고아로 만든’.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  english_pob_choice: Thus says the Lord GOD
  chosen_korean: 주 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주 하나님 야훼께서 이렇게 말씀하십니다
  - 주 하나님께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 예언서의 공적 선언 공식을 한국어로 자연스럽게 살리되, יְהוִה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: יַעַן אֹמְרִים לָכֶם
  english_pob_choice: Because they say of you
  chosen_korean: 너에 대하여 그들이 말하기를
  alternatives_korean:
  - 너에게 말하기를
  - 너를 두고 말하기를
  lexicon: HALOT
  rationale: לָכֶם의 문맥상 대상화된 비난을 반영해 ‘너에 대하여’로 옮겼고, 한국어 어순에 맞게 이유절을 자연스럽게 만들었습니다.
- source_word: אֹכֶלֶת אָדָם
  english_pob_choice: You devour people
  chosen_korean: 사람을 삼키고
  alternatives_korean:
  - 사람을 먹어 치우고
  - 사람을 잡아먹고
  lexicon: HALOT
  rationale: אָכַל의 비유적 폭력을 살리기 위해 ‘삼키다’를 택했고, אָדָם의 집합적 의미는 한국어에서 자연스러운 복수 표현으로 처리했습니다.
- source_word: וּמְשַׁכֶּלֶת גוי/ך
  english_pob_choice: and have bereaved your nation
  chosen_korean: 자기 백성을 잃게 한 땅이다
  alternatives_korean:
  - 자기 나라를 고아 되게 한 땅이다
  - 자기 백성을 자식 잃은 땅으로 만든 땅이다
  lexicon: HALOT
  rationale: שׁכל의 핵심 뜻인 ‘빼앗아 상실하게 함/자식 잃게 함’을 살리되, 땅을 향한 인격화된 고발이므로 직설적으로 ‘잃게 한 땅’으로 옮겼습니다.
theological_decisions:
- issue: 예언적 고발문에서 땅을 인격적으로 지칭하는 방식
  chosen_reading: “너는 사람을 삼키고 자기 백성을 잃게 한 땅이다”로, 원문의 땅에 대한 의인화된 비난을 그대로 드러냈습니다.
  alternative_readings:
  - ‘너는 사람을 먹어 치우고 자기 민족을 자식 잃게 했다’
  - ‘너는 사람을 삼키며 자기 백성을 고아 되게 했다’
  rationale: 문맥상 땅은 실제 행위 주체가 아니라 그 땅에 대한 비난의 은유이므로, 의인화를 완화하지 않고 유지하는 것이 원문의 수사와 신학적 긴장을 보존합니다.
  doctrine_reference: Ezekiel 36의 땅-백성 관계 및 심판/회복의 예언 수사
