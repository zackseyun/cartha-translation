- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  english_pob_choice: Thus says the Lord GOD
  chosen_korean: 주 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주 하나님 야훼께서 이렇게 말씀하십니다
  - 주 하나님께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 예언서의 공적 선언 공식을 한국어로 자연스럽게 살리되, יְהוִה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: יַעַן אֹמְרִים לָכֶם
  english_pob_choice: Because they say of you
  chosen_korean: 너에 대하여 그들이 말하기를
  alternatives_korean:
