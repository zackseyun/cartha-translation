    reason: alternative_reading
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. “사람들이 너를 두고 말하기를, ‘너는 사람[a]을 삼키고 네 민족을 자식 잃게 해 온 땅이다[b]’ 한다고 하기 때문이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘사람을 삼키는 자’이며, ‘사람’은 집합적으로 사람들 또는 인류를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 민족을 자식 없이 되게 해 온 땅’ 또는 ‘네 백성을 자식 잃게 해 온 땅’.
    reason: alternative_reading
