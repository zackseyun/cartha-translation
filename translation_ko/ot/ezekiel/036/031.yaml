language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/זְכַרְתֶּם֙ אֶת דַּרְכֵי/כֶ֣ם הָ/רָעִ֔ים וּ/מַעַלְלֵי/כֶ֖ם אֲשֶׁ֣ר לֹֽא טוֹבִ֑ים וּ/נְקֹֽטֹתֶם֙ בִּ/פְנֵי/כֶ֔ם עַ֚ל עֲוֺנֹ֣תֵי/כֶ֔ם וְ/עַ֖ל תּוֹעֲבֽוֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/031.yaml
  text: Then you will remember your evil ways and your deeds that were not good[a], and you will loathe yourselves for your iniquities and your abominations.
  footnotes:
  - marker: a
    text: Or 'and you will loathe yourselves in your own sight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 너희는 너희의 악한 길들과 좋지 않았던 너희의 행위들을 기억하고, 너희의 죄악들과 너희의 가증한 것들 때문에 너희 자신을 혐오하게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 자신의 눈앞에서 너희 자신을 혐오하게 될 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְכַרְתֶּם
  english_pob_choice: Then you will remember
  chosen_korean: 그때 너희는 … 기억하고
  alternatives_korean:
  - 그리고 너희는 … 기억하고
  - 그러면 너희는 … 기억하고
  lexicon: HALOT
  rationale: 예언적 연속에서 미래적 결과를 드러내는 뜻을 살리되, 한국어에서는 ‘그때’로 자연스럽게 연결했습니다.
- source_word: דַּרְכֵיכֶם הָרָעִים
  english_pob_choice: your evil ways
  chosen_korean: 너희의 악한 길들
  alternatives_korean:
  - 너희의 악한 행실들
  - 너희의 악한 행로들
  lexicon: HALOT
  rationale: דֶּרֶךְ의 비유적 의미를 살려 ‘길들’로 옮기고, moral force는 ‘악한’으로 전달했습니다.
- source_word: וּמַעַלְלֵיכֶם אֲשֶׁר לֹא טוֹבִים
  english_pob_choice: your deeds that were not good
  chosen_korean: 좋지 않았던 너희의 행위들
  alternatives_korean:
  - 선하지 않았던 너희의 행위들
  - 좋지 않았던 너희의 행동들
  lexicon: HALOT
  rationale: 히브리어가 직역하면 ‘좋지 않은’이므로, 앞의 ‘악한 길들’과 구분되도록 강도를 과도하게 높이지 않고 옮겼습니다.
- source_word: וּנְקֹטֹתֶם בִּפְנֵיכֶם
  english_pob_choice: you will loathe yourselves
  chosen_korean: 너희 자신을 혐오하게 될 것입니다
  alternatives_korean:
  - 너희 자신을 역겨워하게 될 것입니다
  - 너희 자신에게 혐오감을 느끼게 될 것입니다
  lexicon: HALOT
  rationale: 이 동사는 여기서 자기혐오/혐오의 뜻을 가지므로, 문어적으로도 자연한 ‘혐오하다’로 옮겼습니다. POB의 대안인 ‘in your own sight’의 뉘앙스는 본문에 직접 넣지 않고 의미만 반영했습니다.
- source_word: עַל עֲוֺנֹתֵיכֶם וְעַל תּוֹעֲבֹתֵיכֶם
  english_pob_choice: for your iniquities and your abominations
  chosen_korean: 너희의 죄악들과 너희의 가증한 것들 때문에
  alternatives_korean:
  - 너희의 죄과들과 너희의 가증한 것들로 인해
  - 너희의 죄악들과 너희의 가증한 행위들 때문에
  lexicon: HALOT
  rationale: עָוֹן과 תּוֹעֵבָה의 무게를 각각 ‘죄악’, ‘가증한 것들’로 살렸고, עַל의 원인 관계는 ‘때문에’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 회복 뒤의 기억과 자기혐오의 성격
  chosen_reading: 회복으로 인해 죄를 기억하고 자신을 혐오하게 되는 과정을, 단순한 심리적 후회로 축소하지도 않고, 본문에 없는 완성된 회개 교리로 확장하지도 않았습니다.
  alternative_readings:
  - 단순한 감정적 후회
  - 체계화된 회개의 교리
  rationale: 히브리어는 하나님의 회복 사역의 결과로 죄에 대한 도덕적 기억과 자기 혐오를 묘사하므로, 그 긴장을 그대로 보존하는 번역이 필요합니다.
  doctrine_reference: 본문의 긴장 보존
