id: EZK.36.32
reference: Ezekiel 36:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֧א לְמַעַנְ/כֶ֣ם אֲנִֽי עֹשֶׂ֗ה נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה יִוָּדַ֖ע לָ/כֶ֑ם בּ֧וֹשׁוּ וְ/הִכָּלְמ֛וּ מִ/דַּרְכֵי/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/032.yaml
  text: It is not for your sake that I am acting[a], declares the Lord GOD; let it be known to you. Be ashamed and humiliated because of your ways, O house of Israel.
  footnotes:
  - marker: a
    text: 'Or: ''Be ashamed and disgraced because of your ways.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 너희를 위하여 내가 이렇게 하는 것이 아닙니다—주 하나님의 말씀입니다—너희에게 이것이 알려지게 하십시오. 이스라엘 집이여, 너희는 너희의 길들 때문에 부끄러워하고 수치를 당하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “너희를 위하여 내가 행하는 것이 아니다”입니다.
    reason: source_note
lexical_decisions:
- source_word: לְמַעַנְכֶם
  english_pob_choice: for your sake
  chosen_korean: 너희를 위하여
  alternatives_korean:
  - 너희를 위해
  - 너희의 이익을 위해
  lexicon: HALOT
  rationale: לְמַעַן은 목적·이익·이유를 나타내므로, 한국어에서는 원인/동기를 드러내는 ‘너희를 위하여’가 문맥상 자연스럽고 하나님의 행위가 이스라엘의 공로를 위한 것이 아님을 분명히 합니다.
- source_word: עֹשֶׂה
  english_pob_choice: am acting
  chosen_korean: 내가 이렇게 하는
  alternatives_korean:
  - 내가 행하는
  - 내가 하고 있는
  lexicon: HALOT
  rationale: עשה는 ‘하다/행하다/행동하다’의 폭이 넓지만, 여기서는 이미 진행 중인 하나님의 개입을 가리키므로 ‘내가 이렇게 하는’이 의미를 과장하지 않으면서도 행동성을 살립니다.
- source_word: יִוָּדַע לָכֶם
  english_pob_choice: let it be known to you
  chosen_korean: 너희에게 이것이 알려지게 하십시오
  alternatives_korean:
  - 너희가 알게 하십시오
  - 너희에게 알려지게 하십시오
  lexicon: HALOT
  rationale: 니팔 ידע의 수동적·명령적 뉘앙스를 살려, 단순한 인지보다 ‘알려짐’의 형식을 유지했습니다.
- source_word: בּוֹשׁוּ וְהִכָּלְמוּ
  english_pob_choice: Be ashamed and humiliated
  chosen_korean: 부끄러워하고 수치를 당하십시오
  alternatives_korean:
  - 부끄러워하고 창피를 당하십시오
  - 수치를 당하고 부끄러워하십시오
  lexicon: HALOT
  rationale: בוש와 כלם은 서로 겹치지만 구별되는 수치·굴욕의 짝이므로, 한국어에서도 ‘부끄러워하다’와 ‘수치를 당하다’로 두 요소를 분리해 중복과 강화를 함께 살렸습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: O house of Israel
  chosen_korean: 이스라엘 집이여
  alternatives_korean:
  - 이스라엘 집아
  - 이스라엘의 집이여
  lexicon: HALOT
  rationale: 예언자적 호칭의 직접성을 살리기 위해 ‘-이여’ 종결을 사용했고, 합쇼체 본문과 충돌하지 않도록 인용 خطاب으로 처리했습니다.
theological_decisions:
- issue: יהוה / YHWH의 한국어 표기
  chosen_reading: 주 하나님
  alternative_readings:
  - 야훼 하나님
  - 주 여호와
  rationale: 이 절의 מקור 텍스트는 אֲדֹנָי יְהוִה의 결합형이므로, 한국어 본문에서는 ‘주 하나님’으로 옮겨 두 칭호의 결합을 자연스럽게 살렸습니다. 본 프로젝트 기본어인 ‘야훼’는 별도 문맥에서 적용 가능하지만, 이 결합형에서는 합쇼체 문장 흐름과 예언자적 수식을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה / YHWH'
- issue: 명령형 어조의 보존
  chosen_reading: ‘알려지게 하십시오’와 ‘부끄러워하고 수치를 당하십시오’로 예언적 책망의 직접 명령을 유지했습니다.
  alternative_readings:
  - 완곡한 서술형으로 바꾸기
  - ‘알아야 합니다’처럼 약화하기
  rationale: 히브리어의 명령형은 단순 진술이 아니라 회개와 수치 인식을 요구하는 예언적 선포이므로, 한국어에서도 명령성을 약화하지 않았습니다.
  doctrine_reference: 예언서의 심판/책망 수사 유지
