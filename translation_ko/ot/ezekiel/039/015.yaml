  text: וְ/עָבְר֤וּ הָ/עֹֽבְרִים֙ בָּ/אָ֔רֶץ וְ/רָאָה֙ עֶ֣צֶם אָדָ֔ם וּ/בָנָ֥ה אֶצְל֖/וֹ צִיּ֑וּן עַ֣ד קָבְר֤וּ אֹת/וֹ֙ הַֽ/מְקַבְּרִ֔ים אֶל גֵּ֖יא הֲמ֥וֹן גּֽוֹג־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/015.yaml
  text: And those who pass through the land will pass through[a], and when one sees a human bone[b], he will set up a marker beside it until the buriers have buried it in the Valley of Hamon-gog.
  footnotes:
  - marker: a
    text: Or 'a man's bone.' The Hebrew uses adam, which can mean 'man' or refer generically to a human being; here the generic sense best fits the burial procedure.
    reason: lexical_alternative
  - marker: b
    text: Hamon-gog likely means 'the multitude of Gog' or 'Gog's multitude,' but it is retained here as a place name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 땅을 지나가는 이들이 그 땅을 지나갈 것입니다. 그들 가운데 누군가가 사람의 뼈[a]를 보면, 그 곁에 표지를 세워 둘 것입니다. 매장하는 이들이 그것을 하몬-곡 골짜기[b]에 묻을 때까지 그렇게 할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 사람의 뼈’. 히브리어 אָדָם은 ‘사람’을 뜻하거나 일반적으로 인간을 가리킬 수 있습니다. 여기서는 일반적 의미가 매장 절차의 문맥에 가장 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 하몬-곡은 ‘고그의 무리’ 또는 ‘고그의 큰 무리’라는 뜻일 가능성이 있지만, 여기서는 지명으로 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבְרוּ הָעֹבְרִים
  english_pob_choice: And those who pass through the land will pass through
