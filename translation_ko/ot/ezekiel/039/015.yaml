revisions:
- from: 그리고 그 땅을 지나가는 이들은 지나가게 될 것입니다[a]. 어떤 이가 사람의 뼈를 보면, 그 곁에 표지를 세워 둘 것이며, 그것이 하모낙 고그의 골짜기에서 묻힐 때까지 매장하는 이들이 그것을 묻게 할 것입니다[b].
  to: 그 땅을 지나가는 이들이 그 땅을 지나갈 것입니다. 그들 가운데 누군가가 사람의 뼈[a]를 보면, 그 곁에 표지를 세워 둘 것입니다. 매장하는 이들이 그것을 하몬-곡 골짜기[b]에 묻을 때까지 그렇게 할 것입니다.
  rationale: 원문의 반복된 עבר를 ‘지나가는 이들이 그 땅을 지나갈 것입니다’로 보존하되, 이후 절차를 한국어로 명료하게 했습니다. 매장자들이 직접 뼈를 묻는다는 원문 의미를 회복했고, 표지가 그때까지 놓여 있음을 ‘그렇게 할 것입니다’로 연결했습니다. 또한 지명 음역과 두 각주의 앵커를 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:47:08Z'
