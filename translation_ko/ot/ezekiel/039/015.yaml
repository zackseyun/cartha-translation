  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 사람의 뼈를 발견한 사람이 그 곁에 표지를 세우고, 지정된 매장자들이 그것을 하몬-곡 골짜기에 묻을 때까지 표지가 남아 있는 절차를 대체로 반영합니다. 그러나 ‘매장하는 이들이 그것을 묻게 할 것입니다’는 히브리어의 직접 행위(‘매장자들이 그것을 묻다’)를 사역으로 바꾸며, 문장 구조도 불명확합니다. 지명도 하몬-곡으로 바로잡는 것이 적절합니다.
  naturalness: ‘그 땅을 지나가는 이들은 지나가게 될 것입니다’는 반복을 살리려는 의도는 이해되나 한국어로 다소 부자연스럽습니다. 또한 ‘그것이 … 묻힐 때까지 매장하는 이들이 그것을 묻게 할 것입니다’는 주어와 행위 관계가 혼란스럽습니다. 절차의 시간 관계를 자연스럽고 명료하게 재구성했습니다.
  terminology: אָדָם은 성별을 특정하지 않는 ‘사람’으로 옮기는 것이 적절합니다. צִיּוּן은 ‘표지’, הַמְקַבְּרִים은 ‘매장하는 이들’로 번역할 수 있습니다. גֵּיא הֲמוֹן גּוֹג는 앞 절의 지명에 맞추어 ‘하몬-곡 골짜기’로 음역합니다.
