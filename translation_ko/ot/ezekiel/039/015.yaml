id: EZK.39.15
reference: Ezekiel 39:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָבְר֤וּ הָ/עֹֽבְרִים֙ בָּ/אָ֔רֶץ וְ/רָאָה֙ עֶ֣צֶם אָדָ֔ם וּ/בָנָ֥ה אֶצְל֖/וֹ צִיּ֑וּן עַ֣ד קָבְר֤וּ אֹת/וֹ֙ הַֽ/מְקַבְּרִ֔ים אֶל גֵּ֖יא הֲמ֥וֹן גּֽוֹג־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/015.yaml
  text: And those who pass through the land will pass through[a], and when one sees a human bone[b], he will set up a marker beside it until the buriers have buried it in the Valley of Hamon-gog.
  footnotes:
  - marker: a
    text: Or 'a man's bone.' The Hebrew uses adam, which can mean 'man' or refer generically to a human being; here the generic sense best fits the burial procedure.
    reason: lexical_alternative
  - marker: b
    text: Hamon-gog likely means 'the multitude of Gog' or 'Gog's multitude,' but it is retained here as a place name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 땅을 지나가는 이들은 지나가게 될 것입니다[a]. 어떤 이가 사람의 뼈를 보면, 그 곁에 표지를 세워 둘 것이며, 그것이 하모낙 고그의 골짜기에서 묻힐 때까지 매장하는 이들이 그것을 묻게 할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람의 뼈’. 히브리어 אָדָם은 ‘사람’ 또는 일반적인 ‘인간’을 뜻할 수 있는데, 여기서는 일반적 의미가 매장 절차에 가장 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 하모낙 고그는 ‘고그의 무리’ 또는 ‘고그의 큰 무리’라는 뜻일 가능성이 있지만, 여기서는 지명으로 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבְרוּ הָעֹבְרִים
  english_pob_choice: And those who pass through the land will pass through
  chosen_korean: 그 땅을 지나가는 이들은 지나가게 될 것입니다
  alternatives_korean:
  - 지나가는 이들은 지나갈 것입니다
  - 그 땅을 통과하는 이들은 통과할 것입니다
  lexicon: HALOT
  rationale: עבר의 반복 구조를 한국어에서도 살려, 단순한 이동이 아니라 ‘지나가는 이들’의 반복적·절차적 행동을 드러냈습니다.
- source_word: עֶצֶם אָדָם
  english_pob_choice: a human bone
  chosen_korean: 사람의 뼈
  alternatives_korean:
  - 인간의 뼈
  - 한 사람의 뼈
  lexicon: HALOT
  rationale: אָדָם을 특정 남성으로 좁히지 않고 일반적인 인간으로 이해한 POB의 판단을 따라, 자연스러운 한국어로 ‘사람의 뼈’라고 옮겼습니다.
- source_word: וּבָנָה אֶצְלוֹ צִיּוּן
  english_pob_choice: he will set up a marker beside it
  chosen_korean: 그 곁에 표지를 세워 둘 것이며
  alternatives_korean:
  - 그 옆에 표식을 세울 것이며
  - 그 곁에 기념비를 세울 것이며
  lexicon: HALOT
  rationale: צִיּוּן은 여기서 시온이 아니라 매장 절차를 위한 ‘표지’이므로, ‘세우다’의 동작성과 함께 ‘표지’를 택해 문맥을 반영했습니다.
- source_word: עַד קָבְרוּ אֹתוֹ הַמְקַבְּרִים
  english_pob_choice: until the buriers have buried it
  chosen_korean: 그것이 하모낙 고그의 골짜기에서 묻힐 때까지 매장하는 이들이 그것을 묻게 할 것입니다
  alternatives_korean:
  - 묻는 이들이 그것을 묻을 때까지
  - 장사하는 이들이 그것을 장사할 때까지
  lexicon: HALOT
  rationale: קבר의 어근 반복과 ‘매장하는 이들’의 절차적 뉘앙스를 살려, 단순히 ‘묻다’만 반복하기보다 행위 주체를 분명히 했습니다.
theological_decisions:
- issue: אָדָם의 성별 비특정적 의미
  chosen_reading: 사람
  alternative_readings:
  - 남자
  - 인간
  rationale: 이 구절은 특정 남성이 아니라 발견된 유해 일반을 가리키므로, 성별을 제한하지 않는 ‘사람’이 source-direct합니다.
  doctrine_reference: 'Contested terms: אָדָם adam → man / humankind (context)'
