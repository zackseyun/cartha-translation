  lexicon: HALOT
  rationale: אָדָם을 특정 남성으로 좁히지 않고 일반적인 인간으로 이해한 POB의 판단을 따라, 자연스러운 한국어로 ‘사람의 뼈’라고 옮겼습니다.
- source_word: וּבָנָה אֶצְלוֹ צִיּוּן
