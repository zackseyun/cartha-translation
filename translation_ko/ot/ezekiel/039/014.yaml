id: EZK.39.14
reference: Ezekiel 39:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַנְשֵׁ֨י תָמִ֤יד יַבְדִּ֨ילוּ֙ עֹבְרִ֣ים בָּ/אָ֔רֶץ מְקַבְּרִ֣ים אֶת הָ/עֹבְרִ֗ים אֶת הַ/נּוֹתָרִ֛ים עַל פְּנֵ֥י הָ/אָ֖רֶץ לְ/טַֽהֲרָ֑/הּ מִ/קְצֵ֥ה שִׁבְעָֽה חֳדָשִׁ֖ים יַחְקֹֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/014.yaml
  text: And they will set apart men continually[a], who will pass through the land burying those who pass through, those left on the surface of the land, to cleanse it[c][b]. At the end of seven months they will make a search.
  footnotes:
  - marker: a
    text: Or 'men regularly appointed'; the Hebrew literally has 'men of continuality,' indicating an ongoing assignment.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew repeats the verb 'pass through' ('burying those who passed through'). In context this likely refers to the dead left lying in the land, but the wording is difficult and may intentionally echo the searchers' passing through the land.
    reason: lexical_alternative
  - marker: c
    text: Or 'they will search thoroughly' or 'they will investigate.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 그들은 상시 임무를 맡은 사람들을 따로 세울 것이며,[a] 그들은 땅을 두루 다니면서 지나간 자들,[b] 곧 땅 위에 남아 있는 자들을 묻어 그 땅을 깨끗하게 할 것입니다. 일곱 달이 끝나면 그들은 수색할 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정기적으로 임명된 사람들’입니다. 히브리어는 문자적으로 ‘지속성의 사람들’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘지나가다’라는 동사를 반복합니다. 문맥상 죽은 시신을 가리키는 것으로 보이지만, 수색자들이 땅을 지나 다니는 동작을 의도적으로 메아리치게 하는 표현일 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘철저히 수색할 것입니다’ 혹은 ‘조사할 것입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי תָמִיד
  english_pob_choice: men continually
  chosen_korean: 계속 맡은 사람들
  alternatives_korean:
  - 항상 세워진 사람들
  - 지속적으로 임명된 사람들
  - 끊임없는 사람들
  lexicon: HALOT
  rationale: תָמִיד의 ‘지속적·계속적’ 뉘앙스를 살리되, 한국어에서는 ‘사람들’보다 ‘맡은 사람들’이 행정적 지정의 뜻을 더 자연스럽게 드러냅니다.
- source_word: יַבְדִּילוּ
  english_pob_choice: they will set apart
  chosen_korean: 따로 세워
  alternatives_korean:
  - 구별할
  - 분리할
  - 임명할
  lexicon: HALOT
  rationale: 히필형 בדל은 ‘구별하다/따로 떼어 놓다’의 뜻이 강하고, 이 문맥에서는 특정 임무를 위한 지정을 포함하므로 ‘따로 세워’가 가장 간결하게 반영합니다.
- source_word: עֹבְרִים בָּאָרֶץ / הָעֹבְרִים
  english_pob_choice: who will pass through the land / those who passed through
  chosen_korean: 땅을 지나 다니며 지나간 자들
  alternatives_korean:
  - 땅을 다니며 다니는 자들
  - 땅을 통과하는 자들
  - 지나가는 자들
  lexicon: HALOT
  rationale: 반복되는 עבר를 그대로 살려 ‘지나 다니며 / 지나간 자들’로 대응해, 검색자와 시신을 가리키는 표현 사이의 어색하지만 의도된 반복을 보존했습니다.
- source_word: לְטַהֲרָהּ
  english_pob_choice: to cleanse it
  chosen_korean: 그 땅을 깨끗하게 할 것입니다
  alternatives_korean:
  - 그 땅을 정결하게 할 것입니다
  - 그 땅을 깨끗이 할 것입니다
  - 그 땅을 정화할 것입니다
  lexicon: HALOT
  rationale: 이 동사는 시신으로 인한 부정에서의 정결과 실제 정리의 의미를 함께 지니므로, 지나치게 의례적이거나 위생적인 쪽으로만 좁히지 않는 ‘깨끗하게 하다’를 택했습니다.
- source_word: מִקְצֵה שִׁבְעָה חֳדָשִׁים
  english_pob_choice: At the end of seven months
  chosen_korean: 칠 달이 끝나면
  alternatives_korean:
  - 일곱 달이 끝나면
  - 칠 개월이 지나면
  - 일곱 달 끝에
  lexicon: HALOT
  rationale: מן־קצה는 다음 행동이 시작되는 시점을 가리키므로, 앞뒤 문맥에 맞게 ‘끝나면’으로 옮겼습니다.
- source_word: יַחְקֹרוּ
  english_pob_choice: they will make a search
  chosen_korean: 수색할 것입니다
  alternatives_korean:
  - 살필 것입니다
  - 조사할 것입니다
  - 찾아볼 것입니다
  lexicon: HALOT
  rationale: חקר는 단순히 찾는 것이 아니라 조직적으로 탐색·조사하는 뜻이 있어, 문맥상 군사적·행정적 탐색을 드러내는 ‘수색하다’가 적절합니다.
theological_decisions:
- issue: 땅을 깨끗하게 하는 행위의 성격
  chosen_reading: 정결 예식과 실제 시신 처리의 의미를 함께 남기기 위해 ‘깨끗하게 하다’로 넓게 옮겼습니다.
  alternative_readings:
  - 정결하게 하다만 강조
  - 현장 정리만 강조
  rationale: 에스겔의 문맥에서는 부정 의식과 현실적 시신 수습이 함께 작동하므로, 어느 한쪽으로만 좁히면 본문의 긴장이 사라집니다.
  doctrine_reference: 의례적 정결과 실제적 정리를 함께 보존
