source:
  edition: WLC
  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אֱמֹר֩ לְ/צִפּ֨וֹר כָּל כָּנָ֜ף וּ/לְ/כֹ֣ל חַיַּ֣ת הַ/שָּׂדֶ֗ה הִקָּבְצ֤וּ וָ/בֹ֨אוּ֙ הֵאָסְפ֣וּ מִ/סָּבִ֔יב עַל זִבְחִ֗/י אֲשֶׁ֨ר אֲנִ֜י זֹבֵ֤חַ לָ/כֶם֙ זֶ֣בַח גָּד֔וֹל עַ֖ל הָרֵ֣י יִשְׂרָאֵ֑ל וַ/אֲכַלְתֶּ֥ם בָּשָׂ֖ר וּ/שְׁתִ֥יתֶם דָּֽם־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/017.yaml
  text: 'And you[a], son of man, thus says the Lord GOD: Say to every bird of every wing and to every beast of the field, ‘Gather yourselves and come; assemble from all around to my sacrifice that I am sacrificing for you, a great sacrifice on the mountains of Israel[b], and you shall eat flesh and drink blood.’'
  footnotes:
  - marker: a
    text: Hebrew literally, 'to every bird of every wing,' an idiom meaning all birds.
    reason: lexical_alternative
  - marker: b
    text: Or 'to my sacrificial feast that I am preparing for you'; the Hebrew uses the noun 'sacrifice' with a cognate verb, emphasizing the sacrificial scene.
    reason: lexical_alternative
translation:
  language: ko
  text: 「인자야, 주 야훼께서 이렇게 말씀하십니다. 모든 날개 달린 새와 모든 들짐승에게 말하십시오. ‘모이십시오, 오십시오. 사방에서 내가 너희를 위하여 드리는 내 제사[a], 곧 이스라엘 산들 위의 큰 제사로 모이십시오. 너희는 살을 먹고 피를 마실 것입니다.’」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내 제사’와 ‘내가 드리는’을 같은 어근으로 반복합니다. ‘제사’는 문맥에 따라 제사와 그에 따르는 제사 잔치를 함께 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서에서 반복되는 호칭을 본문 흐름과 종말론적 호응을 살려 표준적인 ‘인자’로 옮겼습니다.
- source_word: אֲדֹנָי יְהֹוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 합성 신칭에서 אדני와 YHWH를 함께 드러내기 위해 ‘주 야훼’로 옮겼습니다. 이는 POB의 야훼 용례를 반영하면서도 구별성을 유지합니다.
- source_word: צִפּוֹר כָּל כָּנָף
  english_pob_choice: every bird of every wing
  chosen_korean: 모든 날개 가진 새
  alternatives_korean:
  - 모든 새
  - 날개 달린 모든 새
  lexicon: HALOT
  rationale: 직역의 구조를 유지하되 한국어에서 자연스럽게 읽히도록 ‘날개 가진 새’로 옮겨 관용적 총칭을 살렸습니다.
- source_word: עַל זִבְחִי אֲשֶׁר אֲנִי זֹבֵחַ לָכֶם / זֶבַח גָּדוֹל
  english_pob_choice: my sacrifice ... a great sacrifice
  chosen_korean: 내 제사 ... 큰 제사
  alternatives_korean:
  - 내 희생제물 ... 큰 희생제사
  - 내 희생 제사 ... 큰 제사
  lexicon: HALOT
  rationale: 제의적 장면을 살리기 위해 ‘제사’를 택했고, 반복되는 제사-제사 어구를 한국어에서도 드러냈습니다. ‘희생제물’보다 동작성과 장면성이 더 분명합니다.
- source_word: וַאֲכַלְתֶּם בָּשָׂר וּשְׁתִיתֶם דָּם
  english_pob_choice: you shall eat flesh and drink blood
  chosen_korean: 고기를 먹고 피를 마실 것이다
  alternatives_korean:
  - 살을 먹고 피를 마실 것이다
  - 육체를 먹고 피를 마실 것이다
  lexicon: HALOT
  rationale: 여기서는 짐승들에게 주어지는 현실적 식사 표현이므로 ‘고기’가 한국어 독자에게 가장 직접적이고 자연스럽습니다. 다만 제의적·폭력적 충격은 그대로 유지했습니다.
theological_decisions:
