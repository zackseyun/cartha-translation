id: EZK.39.26
reference: Ezekiel 39:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָשׂוּ֙ אֶת כְּלִמָּתָ֔/ם וְ/אֶת כָּל מַעֲלָ֖/ם אֲשֶׁ֣ר מָעֲלוּ בִ֑/י בְּ/שִׁבְתָּ֧/ם עַל אַדְמָתָ֛/ם לָ/בֶ֖טַח וְ/אֵ֥ין מַחֲרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/026.yaml
  text: They will bear their shame and all their unfaithfulness by which they were unfaithful to me[a], when they dwell securely on their land with no one to make them afraid.
  footnotes:
  - marker: a
    text: Or, 'They will forget their shame and all their unfaithfulness.' Some ancient-version-informed translations take the verb here in that contextual sense, but the Hebrew most directly reads 'bear.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 자기들의 수치와 나에게 불신실하게 행한 모든 일을 짊어질 것입니다.[a] 그들이 자기들의 땅에서 안전히 살 때에, 그들을 두렵게 할 자가 아무도 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들이 자기들의 수치와 모든 불신실함을 잊어버릴 것입니다.’ 일부 고대 역본을 반영한 번역은 이 동사를 문맥상 그러한 의미로 이해하지만, 히브리어는 가장 직접적으로 ‘지다/짊어지다’를 뜻합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָשׂוּ
  english_pob_choice: they will bear
  chosen_korean: 지고
  alternatives_korean:
  - 짊어지고
  - 감당하고
  - 잊어버리고
  lexicon: HALOT
  rationale: נשׂא의 기본 뜻인 ‘지다/짊어지다’를 따라, 수치와 불신실함을 ‘지운다’는 이미지로 옮겼습니다. POB의 ‘forget’ 해석 가능성은 유지하되 본문 형태는 ‘bear’가 더 직접적이므로 본문에는 반영하지 않았습니다.
- source_word: כְּלִמָּתָם
  english_pob_choice: their shame
  chosen_korean: 자기들의 수치를
  alternatives_korean:
  - 자기들의 치욕을
  - 자기들의 욕됨을
  lexicon: HALOT
  rationale: כְּלִמָּה는 ‘수치/치욕’의 뜻이므로, 현대 한국어에서 자연스럽고 직접적인 ‘수치’를 선택했습니다.
- source_word: מַעֲלָם / מָעֲלוּ
  english_pob_choice: their unfaithfulness ... they were unfaithful
  chosen_korean: 나에게 범한 모든 불신실함
  alternatives_korean:
  - 나에게 저지른 모든 불충실함
  - 나에게 행한 모든 배신
  lexicon: HALOT
  rationale: מעל의 언약적 배신, 곧 ‘불성실하게 행함’의 뉘앙스를 살리기 위해 ‘불신실함’으로 옮겼습니다. ‘범하다’는 בִּי가 가리키는 상대를 한국어에서 자연스럽게 드러냅니다.
- source_word: וְאֵין מַחֲרִיד
  english_pob_choice: with no one to make them afraid
  chosen_korean: 아무도 그들을 두렵게 하지 못할 것입니다
  alternatives_korean:
  - 그들을 두렵게 하는 자가 없을 것입니다
  - 그들을 떨게 할 사람이 없을 것입니다
  lexicon: HALOT
  rationale: מחריד의 ‘두렵게 하다/떨게 하다’라는 행위자적 뉘앙스를 보존하면서, 한국어로는 부정문 ‘하지 못할 것입니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: v.26의 ‘bear their shame’와 회복의 긴장
  chosen_reading: ‘지고’로 옮겨, 회복된 백성이 과거의 수치와 불신실함을 의식적으로 ‘지니는’ 본문 긴장을 보존했습니다.
  alternative_readings:
  - ‘잊어버리고’
  - ‘수치를 면하고’
  rationale: 문맥상 회복의 약속이지만 히브리어는 ‘잊다’보다 ‘지다/짊어지다’에 가깝습니다. 이를 살려 번역하면, 회복이 과거 죄책의 역사성을 지우지 않는다는 긴장을 그대로 드러낼 수 있습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
