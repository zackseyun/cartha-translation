    rationale: וְנָשׂוּ는 본절의 미래 동사입니다. ‘짊어질 것입니다’로 명시하면 ‘안전하게 살 때’라는 시간 상황과 더 분명히 구별됩니다.
  - severity: low
    issue: 대안 독법 각주 표지의 위치
    rationale: 대안은 וְנָשׂוּ의 해석에 관한 것이므로 절 끝이 아니라 ‘짊어질 것입니다’ 바로 뒤에 두는 편이 각주의 적용 범위를 명확히 합니다.
