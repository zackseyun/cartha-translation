revisions:
- from: 그들이 자기들의 수치를와 나에게 범한 모든 불신실함을 지고, 자기들의 땅에 안전하게 거주할 때에 아무도 그들을 두렵게 하지 못할 것입니다.[a]
  to: 그들이 자기들의 수치와 나에게 불신실하게 행한 모든 일을 짊어질 것입니다.[a] 그들이 자기들의 땅에서 안전히 살 때에, 그들을 두렵게 할 자가 아무도 없을 것입니다.
  rationale: 문법 오류를 바로잡고, ‘짊어질 것입니다’로 히브리어의 직접적인 미래 진술을 보존했습니다. 관계절은 ‘나에게 불신실하게 행한 모든 일’로 옮겨 원문의 명사와 동족 동사의 반복 및 하나님을 향한 불신실함을 자연스럽게 전달했습니다. 대안 독법은 본문에 채택하지 않고, 해당 동사에 직접 연결된 각주로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:47:07Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 וְנָשׂוּ는 ‘잊다’가 아니라 가장 직접적으로 ‘지다/짊어지다’이므로 본문에서 그 뜻을 유지했습니다. מַעֲלָם אֲשֶׁר מָעֲלוּ בִי는 하나님께 불신실하게 행한 행위를 가리키며, ‘나에게 불신실하게 행한 모든 일’로 자연스럽게 반영했습니다. 안전한 거주와 위협하는 자의 부재도 보존했습니다.
  naturalness: 초안에는 목적격 조사 결합 오류(‘수치를와’)가 있습니다. 또한 ‘지고’는 뒤의 ‘거주할 때’에 종속되어, 히브리어의 독립된 미래 진술 ‘그들이 ... 짊어질 것이다’를 다소 흐릴 수 있습니다. 주절을 미래 종결형으로 고치고 각주 표지를 해당 동사 바로 뒤에 두면 더 자연스럽고 명료합니다.
  terminology: ‘수치’, ‘불신실하게 행하다’, ‘짊어지다’, ‘안전히 살다’는 현대 표준어 합쇼체에서 자연스럽고, 언약적 불신실함과 본문의 표현을 과도하게 신학적으로 해석하지 않고 전달합니다.
  issues:
