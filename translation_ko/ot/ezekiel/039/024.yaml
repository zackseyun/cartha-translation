translation:
  language: ko
  text: 그들의 부정함과 그들의 죄과에 따라[a] 내가 그들을 대하였고, 내 얼굴을 그들에게서 가렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부정함’은 ‘불결함’ 또는 ‘더러움’으로, ‘죄과’는 ‘반역’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּטֻמְאָתָם
  english_pob_choice: According to their uncleanness
  chosen_korean: 그들의 부정함에 따라
  alternatives_korean:
  - 그들의 불결함에 따라
  - 그들의 더러움에 따라
  lexicon: HALOT
  rationale: כְ는 ‘~에 따라/그에 맞게’의 뜻을 나타내며, טֻמְאָה는 예언서 문맥에서 의례적·도덕적 더러움을 함께 포괄하므로 ‘부정함’이 가장 자연스럽고 넓은 범위를 살립니다.
- source_word: וּכְפִשְׁעֵיהֶם
  english_pob_choice: and according to their transgressions
  chosen_korean: 그리고 그들의 죄과에 따라
  alternatives_korean:
  - 그리고 그들의 반역에 따라
  - 그리고 그들의 범죄에 따라
  lexicon: HALOT
  rationale: פֶּשַׁע는 단순한 실수보다 하나님께 대한 위반과 파기를 담는 경우가 많아, ‘죄과’가 문맥의 법정적·언약적 뉘앙스를 유지하면서도 과도하게 확대 해석하지 않습니다.
- source_word: עָשִׂיתִי אֹתָם
  english_pob_choice: I dealt with them
  chosen_korean: 내가 그들에게 행하였고
  alternatives_korean:
  - 내가 그들을 다루었고
  - 내가 그들을 처우하였고
  lexicon: HALOT
  rationale: 히브리어 עשה + 목적어는 여기서 ‘만들다’가 아니라 ‘어떻게 대하다/행하다’의 관용구이므로, 한국어에서는 ‘행하다’로 옮겨 신적 심판 행위를 간결하게 드러냅니다.
- source_word: וָאַסְתִּר פָּנַי מֵהֶם
  english_pob_choice: and I hid my face from them
  chosen_korean: 내 얼굴을 그들로부터 가렸습니다
  alternatives_korean:
  - 내 얼굴을 그들에게서 숨겼습니다
  - 내 얼굴을 그들에게서 돌렸습니다
  lexicon: HALOT
  rationale: ‘얼굴을 가리다/숨기다’는 히브리어 관용구를 그대로 살려, 하나님의 임재와 호의를 거두는 심판의 상징을 주석 없이도 보이게 합니다.
theological_decisions:
- issue: ‘hide my face’ 관용구를 해석으로 풀지 여부
  chosen_reading: 본문에서는 ‘내 얼굴을 그들로부터 가렸습니다’로 관용구를 유지합니다.
  alternative_readings:
  - 그들에게서 내 호의를 거두었습니다
  - 그들로부터 돌아섰습니다
  rationale: 예언서의 심판 언어는 상징적 표현 자체가 신학적 의미를 지니므로, 이를 즉시 설명문으로 바꾸기보다 원문 이미지를 보존하는 편이 문맥의 긴장을 유지합니다.
  doctrine_reference: 'translation philosophy: preserve theological tension rather than resolving it'
