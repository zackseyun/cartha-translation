  text: וְ/גַ֥ם שֶׁם עִ֛יר הֲמוֹנָ֖ה וְ/טִהֲר֥וּ הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/016.yaml
  text: And the name of the city will also be Hamonah[a]. Thus they will cleanse the land.
  footnotes:
  - marker: a
    text: Hamonah is a place name likely related to the Hebrew word for a multitude or horde.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 도시의 이름도 하모나가 될 것입니다. 그러면 그들이 그 땅을 깨끗하게 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 하모나는 ‘무리/군중’과 관련될 가능성이 있는 지명입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: And ... also
  chosen_korean: 그리고 ...도
  alternatives_korean:
  - 또
  - 더구나
  lexicon: HALOT
  rationale: 앞뒤 문맥에 새 항목을 덧붙이는 연결어이므로, 단순한 접속과 부가를 함께 드러내는 ‘그리고 ...도’로 옮겼습니다.
- source_word: עִיר הֲמוֹנָה
  english_pob_choice: the city will also be Hamonah
  chosen_korean: 그 도시의 이름도 하모나가 될 것입니다
  alternatives_korean:
  - 그 도시의 이름도 하모나입니다
  - 그 도시도 하모나라고 불릴 것입니다
  lexicon: HALOT
  rationale: 히브리어는 ‘도시의 이름’을 말하므로, 한국어에서도 이름 지정 구조를 살려 ‘이름도 하모나가 될 것입니다’로 자연스럽게 옮겼습니다. 고유명사는 음역을 따랐습니다.
- source_word: וְטִהֲרוּ
  english_pob_choice: Thus they will cleanse
  chosen_korean: 그러면 그들이 ... 깨끗하게 할 것입니다
  alternatives_korean:
  - 그리고 그들이 정결하게 할 것입니다
  - 그래서 그들이 깨끗하게 할 것입니다
  lexicon: HALOT
  rationale: 문맥상 매장 작업의 결과로 땅이 정화되는 귀결을 나타내므로 ‘그러면’으로 결과성을 살렸고, 구체적 토지 정화 맥락에 맞게 ‘깨끗하게 하다’를 택했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 땅
  - 그 나라
  lexicon: HALOT
  rationale: 에스겔에서 이 표현은 대체로 이스라엘의 영토/땅을 가리키므로, 우주적 ‘세상’이 아니라 ‘그 땅’으로 옮겼습니다.
theological_decisions:
- issue: land-cleansing imagery
  chosen_reading: 시체로 더럽혀진 땅을 매장과 정결 행위로 실제로 ‘깨끗하게 하는’ 이미지로 직역합니다.
  alternative_readings:
  - 상징적으로만 정화한다는 완곡한 번역
  - 정결례 용어를 전면에 세운 번역
  rationale: 본문은 문자적 토지 정화를 말하며, 예언적-제의적 긴장을 흐리지 않기 위해 구체적 동사를 유지했습니다.
  doctrine_reference: 레위기 18:25; 민수기 35:33-34; 에스겔 39:12-16
