id: EZK.39.7
reference: Ezekiel 39:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת שֵׁ֨ם קָדְשִׁ֜/י אוֹדִ֗יעַ בְּ/תוֹךְ֙ עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/לֹֽא אַחֵ֥ל אֶת שֵׁם קָדְשִׁ֖/י ע֑וֹד וְ/יָדְע֤וּ הַ/גּוֹיִם֙ כִּי אֲנִ֣י יְהוָ֔ה קָד֖וֹשׁ בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/007.yaml
  text: And I will make my holy name known in the midst of my people Israel[a], and I will no longer let my holy name be profaned; and the nations will know that I am Yahweh[b], the Holy One in Israel.
  footnotes:
  - marker: a
    text: Or, more literally, 'I will no longer profane my holy name.' The Hebrew verb can be rendered this way, though in context it likely means that the LORD will no longer allow his name to be profaned.
    reason: alternative_reading
  - marker: b
    text: Or, 'that I am the LORD, holy in Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 백성 이스라엘 가운데 내 거룩한 이름을 알리겠습니다. 다시는 내 거룩한 이름이 더럽혀지도록 내버려 두지 않겠습니다.[a] 그러면 민족들은 내가 야훼이며 이스라엘 가운데 거룩하신 분인 줄 알게 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘다시는 내 거룩한 이름을 더럽히지 않겠다’입니다. 히브리어 동사는 이렇게 옮길 수 있지만, 문맥상으로는 야훼께서 자신의 이름이 더럽혀지는 것을 더 이상 허용하지 않으신다는 뜻일 가능성이 큽니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내가 야훼, 이스라엘 가운데 거룩한 이인 줄’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם קָדְשִׁי
  english_pob_choice: my holy name
  chosen_korean: 내 거룩한 이름
  alternatives_korean:
  - 내 거룩하신 이름
  - 내 성스러운 이름
  lexicon: HALOT
  rationale: 히브리어 관용구로서 하나님의 드러난 명예와 거룩함을 가리키므로, 직역보다 자연스러운 ‘내 거룩한 이름’이 원문 의미를 잘 드러냅니다.
- source_word: אוֹדִיעַ
  english_pob_choice: I will make known
  chosen_korean: 알게 하며
  alternatives_korean:
  - 알리며
  - 알게 하겠습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 한국어에서는 ‘알게 하다’로 옮기는 것이 가장 자연스럽고, 동작의 방향도 분명합니다.
- source_word: בְּתוֹךְ עַמִּי יִשְׂרָאֵל
  english_pob_choice: in the midst of my people Israel
  chosen_korean: 내 백성 이스라엘 가운데에서
  alternatives_korean:
  - 내 백성 이스라엘 한가운데서
  - 내 백성 이스라엘 속에서
  lexicon: HALOT
  rationale: ‘가운데에서’가 공동체 한복판에 임재한다는 구체적 이미지를 살리면서도 한국어로 자연스럽습니다.
- source_word: אַחֵל אֶת שֵׁם קָדְשִׁי עוֹד
  english_pob_choice: I will no longer let my holy name be profaned
  chosen_korean: 다시는 내 거룩한 이름을 더럽히지 않게 하겠습니다
  alternatives_korean:
  - 다시는 내 거룩한 이름을 더럽히지 않겠습니다
  - 다시는 내 거룩한 이름이 더럽혀지게 하지 않겠습니다
  lexicon: HALOT
  rationale: 원문은 하나님의 이름이 더럽혀지는 것을 더 이상 허용하지 않는다는 뉘앙스를 담으므로, ‘더럽히지 않게 하겠습니다’가 문맥과 신학적 긴장을 함께 반영합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명은 대체 호칭이 아니라 고유한 언약 이름으로 드러나므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘더럽히지 않게 하겠습니다’의 주체성
  chosen_reading: 하나님이 직접 자신의 이름을 더럽히는 행위를 중단시키는 뜻으로 표현
  alternative_readings:
  - 내 거룩한 이름을 더럽히지 않겠습니다
  - 내 거룩한 이름을 더럽히지 않게 하겠습니다
  rationale: 문맥상 하나님이 스스로 악을 행한다는 뜻이 아니라, 자기 이름이 열방 가운데서 모독당하는 것을 더 이상 허용하지 않겠다는 뜻이므로, 허용/방지의 의미를 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Divine vindication of the name'
