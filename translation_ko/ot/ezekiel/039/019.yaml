id: EZK.39.19
reference: Ezekiel 39:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּם חֵ֣לֶב לְ/שָׂבְעָ֔ה וּ/שְׁתִ֥יתֶם דָּ֖ם לְ/שִׁכָּר֑וֹן מִ/זִּבְחִ֖/י אֲשֶׁר זָבַ֥חְתִּי לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/019.yaml
  text: You will eat fat until you are full[a], and you will drink blood to drunkenness, from my sacrifice that I have sacrificed for you.
  footnotes:
  - marker: a
    text: Or 'from my sacrificial feast that I have prepared for you.' The Hebrew uses sacrificial language literally ('my sacrifice ... I sacrificed'), while the broader context makes clear it is a feast on the slain.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 내가 너희를 위하여 바친 내 제물에서 배불리 지방을 먹고 취하도록 피를 마실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 너희를 위하여 준비한 내 희생 잔치에서’. 히브리어는 ‘내 제물 … 내가 바쳤다’라는 제의 언어를 문자적으로 사용하지만, 더 넓은 문맥은 이것이 죽임당한 자들을 두고 벌어지는 잔치임을 분명히 보여 줍니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  english_pob_choice: fat
  chosen_korean: 지방
  alternatives_korean:
  - 기름
  - 살진 기름
  lexicon: HALOT
  rationale: 제물의 ‘fat’을 한국어에서 가장 직접적으로 가리키는 말로 옮겼습니다. ‘지방’은 제의적 이미지와 함께 자연스럽게 읽히며, 필요 이상으로 풀어쓰지 않습니다.
- source_word: לְשָׂבְעָה
  english_pob_choice: until you are full
  chosen_korean: 배불리
  alternatives_korean:
  - 배부를 때까지
  - 만족할 때까지
  lexicon: HALOT
  rationale: 충족·포만의 결과를 짧고 자연스럽게 드러내는 표현으로, 뒤의 ‘피를 마셔 취하게’와 평행을 이루게 했습니다.
- source_word: דָּם
  english_pob_choice: blood
  chosen_korean: 피
  alternatives_korean:
  - 혈액
  - 피비린내 나는 피
  lexicon: HALOT
  rationale: 직역적 대응을 유지했습니다. 심판과 제의가 겹치는 충격적 이미지를 흐리지 않기 위해 완화하지 않았습니다.
- source_word: לְשִׁכָּרוֹן
  english_pob_choice: to drunkenness
  chosen_korean: 취하게
  alternatives_korean:
  - 취하도록
  - 술에 취할 정도로
  lexicon: HALOT
  rationale: 명사형 의미를 한국어 동사구로 자연화하되, 과도한 의역은 피했습니다. ‘배불리’와 짝을 이루는 강한 결과 표현으로 읽힙니다.
- source_word: מִזִּבְחִי ... זָבַחְתִּי
  english_pob_choice: from my sacrifice that I have sacrificed for you
  chosen_korean: 내가 너희를 위해 바친 내 제물에서
  alternatives_korean:
  - 내가 너희를 위해 바친 내 희생제물에서
  - 너희를 위해 내가 제사한 내 제물에서
  lexicon: HALOT
  rationale: ‘제물’과 ‘바치다’로 זבח의 반복을 살렸습니다. POB가 유지한 제의적 반복과 역설을 한국어에서도 분명히 드러내기 위해 ‘제물에서’로 직결했습니다.
theological_decisions:
- issue: 심판의 제의적 은유 보존
  chosen_reading: ‘제물’과 ‘바쳤다’의 반복을 그대로 살려, 본문이 말하는 심판을 희생제의 언어로 표현했습니다.
  alternative_readings:
  - ‘잔치’로 완화하여 번역
  - ‘사냥감/살육’으로만 옮김
  rationale: 문맥상 짐승과 새가 죽은 자들을 먹는 심판 장면이지만, 본문은 의도적으로 제의 언어를 반복합니다. 이를 완화하면 원문의 신학적 긴장과 아이러니가 약해집니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
