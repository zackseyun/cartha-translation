  text: The house of Israel will bury them for seven months[a], in order to cleanse the land.
  footnotes:
  - marker: a
    text: Or 'purify the land.' The Hebrew verb can denote making something clean in a ritual sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 족속이 그 땅을 정결하게 하려고 일곱 달 동안 그들을 묻을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅을 깨끗하게 하다.’ 히브리어 동사는 의례적으로 정결하게 하는 것을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְבָרוּם
  english_pob_choice: will bury them
  chosen_korean: 그들을 … 묻어
  alternatives_korean:
  - 그들을 장사하여
  - 그들을 매장하여
  lexicon: HALOT
  rationale: קבר의 기본 의미를 살려 시신을 땅에 묻는 행위를 직접적으로 표현했습니다. ‘장사하다’보다 현대어에서 덜 자연스럽고, 본문이 강조하는 corpse burial의 물리성을 ‘묻다’가 더 분명히 드러냅니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: The house of Israel
  chosen_korean: 이스라엘의 집
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 예언서의 관용적 집합 명칭을 살려 ‘집’을 유지했습니다. 이는 단순한 민족 집단보다 언약적·공동체적 성격을 더 잘 보존합니다.
- source_word: טַהֵר
  english_pob_choice: cleanse
  chosen_korean: 깨끗하게 하다
  alternatives_korean:
  - 정결하게 하다
  - 정화하다
  lexicon: HALOT
  rationale: 문맥이 시체로 인한 땅의 부정을 다루므로, ‘깨끗하게 하다’가 의례적·물리적 정결의 이중 의미를 무리 없이 담습니다. ‘정결하게 하다’도 가능하지만 한국어에서 다소 종교어화될 수 있어 본문 의미를 직접적으로 살렸습니다.
- source_word: שִׁבְעָה חֳדָשִׁים
  english_pob_choice: for seven months
  chosen_korean: 일곱 달 동안
  alternatives_korean:
  - 일곱 달 동안에
  - 일곱 달
  lexicon: HALOT
  rationale: 지속 기간을 나타내는 표현이므로 한국어에서는 ‘동안’을 넣어 행위의 기간성을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 땅의 ‘정결’ 표현
  chosen_reading: 의례적 정결과 실제 오염 제거를 함께 떠올리게 하는 ‘땅을 깨끗하게 하다’로 옮겼습니다.
  alternative_readings:
  - 땅을 정결하게 하다
  - 땅을 정화하다
  rationale: 본문은 시체에 의한 부정과 그 제거를 말하므로, 후대 교리 용어를 덧씌우지 않으면서도 의례적 의미를 보존해야 합니다. ‘깨끗하게 하다’는 ritual cleanliness의 핵심을 유지합니다.
  doctrine_reference: Translation philosophy §3, §6
