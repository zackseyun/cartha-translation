id: EZK.39.11
reference: Ezekiel 39:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַ/יּ֣וֹם הַ/ה֡וּא אֶתֵּ֣ן לְ/גוֹג֩ מְקֽוֹם שָׁ֨ם קֶ֜בֶר בְּ/יִשְׂרָאֵ֗ל גֵּ֤י הָ/עֹֽבְרִים֙ קִדְמַ֣ת הַ/יָּ֔ם וְ/חֹסֶ֥מֶת הִ֖יא אֶת הָ/עֹֽבְרִ֑ים וְ/קָ֣בְרוּ שָׁ֗ם אֶת גּוֹג֙ וְ/אֶת כָּל הֲמוֹנֹ֔/ה וְ/קָ֣רְא֔וּ גֵּ֖יא הֲמ֥וֹן גּֽוֹג׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/011.yaml
  text: And it will be in that day that I will give Gog a burial place there in Israel[a], the Valley of the Travelers, east of the sea; and it will block the travelers. There they will bury Gog and all his multitude[c][b], and they will call it the Valley of Hamon-gog.
  footnotes:
  - marker: a
    text: Or 'the valley of those who pass by' / 'the valley of the passersby.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in front of the sea'; the Hebrew expression may denote orientation rather than strict eastward direction.
    reason: lexical_alternative
  - marker: c
    text: Hamon-gog likely means 'multitude of Gog.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그날에 내가 이스라엘[a]에, 바다의 동쪽[b], 곧 여행자들의 골짜기[역주]에 곡에게 무덤 자리를 주겠습니다. 그것은 여행자들을 막을 것입니다. 그들은 거기에서 곡과 그의 모든 무리[c]를 묻고, 그곳을 ‘하몬-곡의 골짜기’라고 부를 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘’ 뒤의 위치 표지는 이곳이 이스라엘 땅 안에 있는 매장지임을 나타냅니다.
    reason: source_note
  - marker: b
    text: 또는 ‘바다 앞’; 히브리어 표현은 엄밀한 동쪽 방향보다 ‘바다를 마주한 곳’이라는 위치 관계를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘하몬-곡’은 ‘곡의 무리’라는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  english_pob_choice: And it will be in that day
  chosen_korean: 그리고 그날에
  alternatives_korean:
  - 그날에 일어날 것입니다
  - 그날이 되면
  lexicon: HALOT
  rationale: 예언문 공식 표현을 한국어 합쇼체로 자연스럽게 옮기되, עת래적 종말/심판 문맥의 장중함을 유지했습니다.
- source_word: מְקוֹם שָׁם קֶבֶר
  english_pob_choice: a burial place there
  chosen_korean: 무덤 자리를
  alternatives_korean:
  - 거기에 묻을 자리
  - 장지
  lexicon: HALOT
  rationale: מקום+שם+קבר의 결합은 ‘장소’와 ‘무덤/매장’의 감각을 함께 가지므로, ‘무덤 자리’가 간결하면서도 장소성과 장례 의미를 살립니다.
- source_word: גֵּי הָעֹבְרִים
  english_pob_choice: the Valley of the Travelers
  chosen_korean: 여행자들의 골짜기
  alternatives_korean:
  - 지나가는 사람들의 골짜기
  - 지나는 자들의 골짜기
  lexicon: HALOT
  rationale: עֹבְרִים는 ‘지나가는 자들/통행자들’의 뜻이므로, POB의 더 자연스러운 ‘Travelers’ 선택을 따라 ‘여행자들’로 옮기되, 지명 성격을 살리기 위해 ‘골짜기’를 유지했습니다.
- source_word: קִדְמַת הַיָּם
  english_pob_choice: east of the sea
  chosen_korean: 바다의 동쪽
  alternatives_korean:
  - 바다 앞
  - 바다 앞쪽
  lexicon: HALOT
  rationale: 이 구는 지리적 방향 표지로 읽는 것이 가장 자연스러워 ‘동쪽’으로 옮겼습니다. 직역적 공간 표현은 주석으로 남길 수 있지만 본문에는 한국어 독자가 즉시 이해할 수 있는 방향어를 택했습니다.
- source_word: וְחֹסֶמֶת הִיא אֶת הָעֹבְרִים
  english_pob_choice: and it will block the travelers
  chosen_korean: 그것은 여행자들을 막을 것입니다
  alternatives_korean:
  - 그것은 지나가는 자들을 가로막을 것입니다
  - 그것은 통행자들을 차단할 것입니다
  lexicon: HALOT
  rationale: חסם의 핵심 의미는 ‘막다/가로막다’이므로, 골짜기의 매장지 기능이 길을 방해한다는 점을 분명히 드러내도록 옮겼습니다.
- source_word: הֲמוֹנֹו
  english_pob_choice: his multitude
  chosen_korean: 그의 모든 무리
  alternatives_korean:
  - 그의 무리
  - 그의 떼
  lexicon: HALOT
  rationale: הָמוֹן은 ‘무리/대중/군중’의 폭넓은 뜻이 있어, 전투적 뉘앙스를 과도하게 덧붙이지 않으면서도 규모를 살리는 ‘모든 무리’를 택했습니다.
- source_word: גֵּיא הֲמוֹן גּוֹג
  english_pob_choice: the Valley of Hamon-gog
  chosen_korean: 하몬-곡의 골짜기
  alternatives_korean:
  - 곡의 무리의 골짜기
  - 하몬곡 골짜기
  lexicon: HALOT
  rationale: 이 표현은 새로 붙은 지명으로 기능하므로 음역을 유지해 고유명사성을 보존했습니다. 의미는 ‘곡의 무리’로 읽힌다는 점을 역주로 처리하는 편이 원문 구조에 충실합니다.
theological_decisions:
- issue: 지명화된 표현을 본문에서 의미 번역할지 음역할지
  chosen_reading: 본문에서는 ‘하몬-곡의 골짜기’로 음역하고, 의미는 주석에서 드러냅니다.
  alternative_readings:
  - ‘곡의 무리의 골짜기’로 의미 번역
  - ‘곡의 큰 무리 골짜기’로 해설적 번역
  rationale: 이 구는 명명 행위가 포함된 지명이므로, 본문에서는 이름으로서의 기능을 보존하는 것이 더 적절합니다. 동시에 원뜻은 주석으로 투명하게 밝혀야 합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
