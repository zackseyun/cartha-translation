translation:
  language: ko
  text: 내가 너를 돌이키고, 너를 이끌고[a], 너를 북쪽의 가장 먼 곳에서 올라오게 하여[b], 너를 이스라엘의 산들에 맞서 오게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 번역하기 어려운 이 동사는 일부 번역본에서 ‘너의 육분의 일만 남기다’로도 이해되어 왔습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 더 문자적으로, ‘북쪽의 가장 먼 곳에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֹׁבַבְתִּיךָ
  english_pob_choice: I will turn you around
  chosen_korean: 내가 너를 돌이키고
  alternatives_korean:
  - 내가 너를 되돌리고
  - 내가 너를 돌려보내고
  lexicon: HALOT
  rationale: פועל שוב의 사역적 용법으로, 하나님이 고그의 진행 방향을 주권적으로 바꾸신다는 뜻을 한국어 동사 ‘돌이키다’로 자연스럽게 살렸습니다.
- source_word: וְשִׁשֵּׁאתִיךָ
  english_pob_choice: drive you on
  chosen_korean: 너를 이끌며
  alternatives_korean:
  - 너를 몰아가며
  - 너를 인도하며
  lexicon: HALOT
  rationale: 난해한 동사로서 ‘이끌다’는 강제된 진행성과 앞뒤 동작의 연속을 함께 담아, POB가 채택한 이동 동사의 흐름을 한국어로 무리 없이 반영합니다.
- source_word: מִיַּרְכְּתֵי צָפוֹן
  english_pob_choice: from the far north
  chosen_korean: 북쪽 먼 곳에서
  alternatives_korean:
  - 북쪽의 가장 먼 곳에서
  - 북쪽 끝자락에서
  lexicon: HALOT
  rationale: 직역 성분인 ‘북쪽의 끝/깊은 곳’의 공간적 극단성을 현대 한국어로 간결하게 옮겼습니다.
- source_word: וַהֲבִאוֹתִיךָ עַל
  english_pob_choice: and bring you against
  chosen_korean: 너를 이스라엘의 산들에 맞서 오게 하겠습니다
  alternatives_korean:
  - 너를 이스라엘의 산들로 오게 하겠습니다
  - 너를 이스라엘의 산들 위로 이끌겠습니다
  lexicon: HALOT
  rationale: עַל의 적대적/군사적 방향성을 살리기 위해 중립적인 ‘~로’보다 ‘맞서 오게 하다’를 택해, 공격적 접근의 뉘앙스를 드러냈습니다.
theological_decisions:
- issue: וְשִׁשֵּׁאתִיךָ의 난해한 의미 처리
  chosen_reading: 이 구절은 연속된 신적 행위의 동사열로 읽어 ‘이끌며’로 번역했습니다.
  alternative_readings:
  - ‘여섯째만 남기다’
  - ‘몰아가다’
  rationale: 문맥상 ‘돌이키고… 올라오게 하고… 오게 하다’의 이동 연쇄가 이어지므로, 수량적 심판으로 전환하기보다 진행 동사로 읽는 것이 본문의 흐름을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
