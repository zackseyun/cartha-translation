source:
  edition: WLC
  text: וְ/שִׁלַּחְתִּי אֵ֣שׁ בְּ/מָג֔וֹג וּ/בְ/יֹשְׁבֵ֥י הָ/אִיִּ֖ים לָ/בֶ֑טַח וְ/יָדְע֖וּ כִּי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/006.yaml
  text: And I will send fire on Magog and on those who live securely in the coastlands[a], and they will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'the islands.' The Hebrew term can refer to islands or, more broadly in prophetic usage, to distant coastlands.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 마곡과 안전하게 거주하는 해안 지역의 주민들에게 불을 보내리니[a], 그들은 내가 야훼인 줄 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘섬들’입니다. 히브리어는 문자적으로 섬을 뜻할 수 있지만, 예언 문맥에서는 더 넓게 먼 해안 지역을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  english_pob_choice: And I will send
  chosen_korean: 내가 … 불을 보내리니
  alternatives_korean:
  - 내가 … 불을 보내겠습니다
  - 내가 … 불을 보내리니
  lexicon: HALOT
  rationale: שלח의 기본 뜻을 살려 ‘보내다’로 옮기되, 심판 맥락에서 대상 위로 향하는 동작이 자연스럽도록 구성했습니다.
- source_word: אֵשׁ
  english_pob_choice: fire
  chosen_korean: 불
  alternatives_korean:
  - 불
  - 화염
  lexicon: HALOT
  rationale: 예언적 심판 이미지로서의 literal ‘fire’를 간결하게 살리기 위해 ‘불’을 택했습니다.
- source_word: וּבְיֹשְׁבֵי הָאִיִּים לָבֶטַח
  english_pob_choice: and on those who live securely in the coastlands
  chosen_korean: 안전하게 거주하는 해안 지역의 주민들
  alternatives_korean:
  - 안전하게 사는 해안 지역의 주민들
  - 안전하게 거주하는 섬들의 주민들
  lexicon: HALOT
  rationale: יֹשְׁבֵי는 ‘거주하는 주민들’로 풀고, הָאִיִּים은 예언 문맥의 넓은 지리 범위를 반영해 ‘해안 지역’으로 옮겼습니다. לָבֶטַח은 주민들의 상태를 수식하는 ‘안전하게’로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여기서는 표제어 יְהוָה를 직접 드러내기 위해 전통적 대체어보다 학술적 음역인 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: 도성명 יְהוָה의 번역
  chosen_reading: ‘야훼’로 음역하여 고유한 언약 անուն을 보존했습니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 표기
  rationale: 본문이 하나님의 이름을 직접 사용하므로, 호칭으로 완화하지 않고 고유명으로 드러내는 것이 원문 의미와 POB 원칙에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
