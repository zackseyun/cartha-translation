lexical_decisions:
- source_word: וְיָדְעוּ
  english_pob_choice: will know
  chosen_korean: 알게 될 것입니다
  alternatives_korean:
  - 알 것입니다
  - 인정하게 될 것입니다
  lexicon: HALOT
  rationale: 예언적 결과를 미래로 옮기되, 단순한 지식이 아니라 인식·체험을 포함하는 ‘알다’의 의미를 자연스럽게 살렸습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘
  - 이스라엘의 집
  lexicon: HALOT
  rationale: 히브리어 관용구의 집단적·공동체적 뉘앙스를 보존하기 위해 직역에 가깝게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 하나님의 고유명사를 제목으로 대체하지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: מִן הַיּוֹם הַהוּא וָהָלְאָה
  english_pob_choice: from that day onward
  chosen_korean: 그날부터 이후로
  alternatives_korean:
  - 그날부터 앞으로
  - 그날 이후로
  lexicon: HALOT
  rationale: 시작점과 지속성을 함께 드러내는 표현으로, 영어 본문의 ‘from that day onward’에 해당하는 의미를 간결하게 담았습니다.
theological_decisions:
- issue: יהוה(야훼)의 번역
  chosen_reading: 본문에서 하나님의 언약적 고유명사를 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 이스라엘이 하나님을 ‘야훼’로 알게 되는 인식의 전환을 말하므로, 호칭으로 희석하지 않고 고유명사를 보존하는 편이 본문의 의도를 더 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
