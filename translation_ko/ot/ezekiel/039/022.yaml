  - 그날 이후로
  lexicon: HALOT
  rationale: 시작점과 지속성을 함께 드러내는 표현으로, 영어 본문의 ‘from that day onward’에 해당하는 의미를 간결하게 담았습니다.
theological_decisions:
- issue: יהוה(야훼)의 번역
  chosen_reading: 본문에서 하나님의 언약적 고유명사를 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 이스라엘이 하나님을 ‘야훼’로 알게 되는 인식의 전환을 말하므로, 호칭으로 희석하지 않고 고유명사를 보존하는 편이 본문의 의도를 더 분명히 드러냅니다.
