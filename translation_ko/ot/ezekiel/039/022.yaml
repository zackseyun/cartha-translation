  to: 이스라엘 집은 그날부터 계속해서 내가 야훼, 그들의 하나님임을 알게 될 것입니다.[a]
  rationale: 시간 부사구를 ‘그날부터 계속해서’로 고쳐 히브리어의 시작점과 계속되는 범위를 중복 없이 반영했습니다. ‘그들의 하나님’으로 조정하여 현대 표준어 합쇼체 문맥에서 더 자연스러운 지시를 만들었으며, 신명과 본문의 의미는 그대로 보존했습니다.
