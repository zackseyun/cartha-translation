  lexicon: HALOT
  rationale: 히브리어 관용구의 집단적·공동체적 뉘앙스를 보존하기 위해 직역에 가깝게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 하나님의 고유명사를 제목으로 대체하지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: מִן הַיּוֹם הַהוּא וָהָלְאָה
  english_pob_choice: from that day onward
  chosen_korean: 그날부터 이후로
  alternatives_korean:
