  text: וּ/שְׂבַעְתֶּ֤ם עַל שֻׁלְחָנִ/י֙ ס֣וּס וָ/רֶ֔כֶב גִּבּ֖וֹר וְ/כָל אִ֣ישׁ מִלְחָמָ֑ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/020.yaml
  text: And you will be filled at my table with horse and chariot[a], mighty man and every man of war[b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Hebrew 'horse and chariot'; the singular forms likely function collectively for military forces and equipment.
    reason: lexical_alternative
  - marker: b
    text: Or 'mighty one' or 'warrior' for 'mighty man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 내 식탁에서 말과 병거, 용사와 모든 전사로 배부르게 될 것입니다. 주 야훼의 말씀이니라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘말과 병거’는 단수형이지만, 여기서는 군사 세력을 집합적으로 가리키는 표현으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘용사’는 ‘mighty man’의 옮김이며, 문맥상 ‘전사’나 ‘전투원’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂבַעְתֶּם
  english_pob_choice: you will be filled
  chosen_korean: 배부르게 될 것입니다
  alternatives_korean:
  - 만족하게 될 것입니다
  - 먹고 배가 부르게 될 것입니다
  lexicon: HALOT
  rationale: שׂבע는 여기서 식사로 인해 배부른 상태가 되는 뜻이므로, 이미지와 결과 상태를 살리는 ‘배부르게 될 것입니다’가 자연스럽습니다.
- source_word: עַל שֻׁלְחָנִי
  english_pob_choice: at my table
  chosen_korean: 내 식탁에서
  alternatives_korean:
  - 내 식탁 위에서
  - 내 상에서
  lexicon: HALOT
  rationale: ‘upon my table’의 직역보다, 잔치/공동 식사의 관용적 의미를 살린 ‘내 식탁에서’가 한국어로 더 분명합니다.
- source_word: סוּס וָרֶכֶב
  english_pob_choice: horse and chariot
  chosen_korean: 말과 병거
  alternatives_korean:
  - 말과 전차
  - 말들로 된 병거들
  lexicon: HALOT
  rationale: 히브리어 단수형은 집합적으로 군사력을 가리키므로, 복수화하지 않고 한국어의 통용 표현인 ‘말과 병거’로 옮겼습니다.
- source_word: גִּבּוֹר וְכָל אִישׁ מִלְחָמָה
  english_pob_choice: mighty man and every man of war
  chosen_korean: 용사와 모든 전사
  alternatives_korean:
  - 용사와 모든 전투원
  - 강한 사람과 모든 전사
  lexicon: HALOT
  rationale: גִּבּוֹר는 ‘용사/용맹한 자’의 뜻을 가지며, 뒤의 ‘모든 전사’와 구별되도록 ‘용사’를 택했습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 주 אֲדֹנָי의 처리
  chosen_reading: ‘주 야훼’로 옮겨 두 신적 칭호를 함께 드러냈습니다.
  alternative_readings:
  - ‘주 여호와’
  - ‘주 하나님’
  rationale: 본문은 אֲדֹנָי יְהוִה의 결합형으로, 한국어 본문에서는 존칭 칭호 ‘주’와 언약 이름 ‘야훼’를 함께 보존하는 것이 가장 직접적입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה/YHWH → 야훼'
