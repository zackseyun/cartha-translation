    text: 히브리어의 ‘말과 병거’는 단수형이지만, 여기서는 군사 세력과 장비를 집합적으로 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘용사’는 히브리어 גִּבּוֹר의 옮김입니다. ‘용맹한 자’ 또는 ‘전사’로도 옮길 수 있습니다.
    reason: lexical_alternative
