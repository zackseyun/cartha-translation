  source_fidelity: 수정이 필요합니다. מִן의 출발점 의미는 ‘민족들 가운데에서/민족들에게서’로, ארצות의 복수 지리성은 한국어에서 자연스럽게 ‘여러 땅’으로 옮기는 것이 적절합니다. וְנִקְדַּשְׁתִּי בָם은 하나님이 그들을 통하여 자신의 거룩함을 공적으로 나타내심을 뜻하므로, ‘내 거룩함을 드러낼 것입니다’가 자연스럽고 의미를 보존합니다.
  naturalness: 초안의 ‘여러 민족들’, ‘원수들의 땅들’, ‘많은 나라들의 눈앞’은 한국어에서 중복되거나 다소 직역투입니다. ‘민족들 가운데에서’, ‘원수들의 여러 땅에서’, ‘많은 나라들이 보는 앞에서’가 현대 표준어 합쇼체에서 더 자연스럽습니다.
  terminology: עמים와 גוים의 구별은 각각 ‘민족들’과 ‘나라들’로 유지했습니다. ‘거룩함’은 하나님의 본질적 변화가 아니라 공적 현시를 가리키므로 ‘내 거룩함을 드러내다’로 번역하고, 직역 가능성은 각주에 보존했습니다.
