  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/שׁוֹבְבִ֤/י אוֹתָ/ם֙ מִן הָ֣/עַמִּ֔ים וְ/קִבַּצְתִּ֣י אֹתָ֔/ם מֵֽ/אַרְצ֖וֹת אֹֽיְבֵי/הֶ֑ם וְ/נִקְדַּ֣שְׁתִּי בָ֔/ם לְ/עֵינֵ֖י הַ/גּוֹיִ֥ם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/027.yaml
  text: when I bring them back from the peoples and gather them from the lands of their enemies[a], and I am shown holy through them before the eyes of many nations.
  footnotes:
  - marker: a
    text: Or, more formally, 'and I am sanctified in them' or 'and I will be hallowed in them.' The sense is that the Lord's holiness is publicly displayed through what he does with them.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 여러 민족들 가운데서 돌아오게 하고, 그들을 그들의 원수들의 땅들에서 모을 때, 나는 많은 나라들의 눈앞에서 그들로 말미암아 거룩함을 드러냅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 '거룩함을 드러냅니다'에 해당하는 נקדשׁתי의 수동/재귀적 의미를 담고 있으며, 직역하면 '나는 그들 안에서 거룩하게 됩니다/거룩하게 여김을 받습니다'가 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוֹבְבִי
  english_pob_choice: when I bring them back
  chosen_korean: 내가 그들을 … 돌아오게 하고
  alternatives_korean:
  - 내가 그들을 회복시키고
  - 내가 그들을 다시 데려오고
  lexicon: HALOT
  rationale: שׁוּב의 사역적 의미를 살려 포로 귀환의 동작을 자연스러운 합쇼체로 옮겼습니다. '회복시키다'는 뜻은 가능하지만, 여기서는 뒤따르는 장소 표현들이 물리적 귀환을 분명히 하므로 '돌아오게 하다'가 더 직접적입니다.
- source_word: הָעַמִּים
  english_pob_choice: the peoples
  chosen_korean: 여러 민족들 가운데서
  alternatives_korean:
  - 민족들 가운데서
  - 백성들 가운데서
  lexicon: HALOT
  rationale: 뒤의 גוים와 어휘 구별을 살려 '민족들'로 옮기되, 앞뒤 문맥에 맞게 위치를 나타내는 표현을 붙여 자연스럽게 다듬었습니다.
- source_word: וְקִבַּצְתִּי
  english_pob_choice: and gather
  chosen_korean: 모을 때
  alternatives_korean:
  - 그리고 모을 때
  - 또 모을 때
  lexicon: HALOT
  rationale: 시간 부사적 구조 안에서 연속 동작을 한국어로 매끄럽게 연결했습니다. '모으다'보다 문어체에서 다소 자연스러운 '모다'의 현대어형인 '모으다'를 사용했습니다.
- source_word: מֵאַרְצוֹת אֹיְבֵיהֶם
  english_pob_choice: from the lands of their enemies
  chosen_korean: 그들의 원수들의 땅들에서
  alternatives_korean:
  - 그들의 원수들의 나라들에서
  - 원수들의 땅에서
  lexicon: HALOT
  rationale: 아르ְצוֹת의 복수성을 살리기 위해 '땅들'로 옮겼습니다. 한국어에서는 다소 거칠 수 있으나, 포로 분산의 지리적 복수성을 보존하는 데 유익합니다.
- source_word: וְנִקְדַּשְׁתִּי בָם
  english_pob_choice: and I am shown holy through them
  chosen_korean: 나는 많은 나라들의 눈앞에서 그들로 말미암아 거룩함을 드러냅니다
  alternatives_korean:
  - 나는 그들 안에서 거룩하게 여김을 받습니다
  - 나는 그들 안에서 거룩하게 됩니다
  lexicon: HALOT
  rationale: נקדש의 수동/재귀적 뉘앙스를 그대로 '거룩함을 드러내다'로 풀어, 하나님이 본질적으로 새로 거룩해진다는 오해를 피하면서도 공적 현시라는 의미를 보존했습니다. בָם은 '그들로 말미암아'가 가장 자연스럽고 원문의 매개성을 드러냅니다.
- source_word: לְעֵינֵי הַגּוֹיִם רַבִּים
  english_pob_choice: before the eyes of many nations
  chosen_korean: 많은 나라들의 눈앞에서
  alternatives_korean:
  - 많은 나라들의 눈에
  - 많은 나라들 앞에서
  lexicon: HALOT
  rationale: 직역적인 관용구를 유지하면서도 한국어에서 굳은 표현인 '눈앞에서'로 공적 가시성을 살렸습니다. גוים는 여기서 신학적 '이방인'보다 국제적 '나라들'이 더 적절합니다.
theological_decisions:
- issue: 하나님의 '거룩하게 됨' 언어
  chosen_reading: 하나님이 본질적으로 변하신다는 뜻이 아니라, 포로 귀환을 통해 그의 거룩함이 열방 앞에 드러난다는 뜻으로 번역했습니다.
  alternative_readings:
  - 나는 그들 안에서 거룩하게 됩니다
  - 나는 그들 안에서 거룩하게 여김을 받습니다
  rationale: 히브리어 נקדש는 하나님이 자신을 공적으로 거룩하게 드러내시는 의미를 가집니다. 한국어에서 이를 설명적으로 옮겨 신학적 오해를 피하면서도 본문의 강조점을 보존했습니다.
  doctrine_reference: 하나님의 불변성, 공적 계시의 언어
