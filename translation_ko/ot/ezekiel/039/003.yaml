translation:
  language: ko
  text: 내가 네 왼손에서 네 활을 쳐 떨어뜨리고, 네 오른손에서 네 화살을 떨어뜨리겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכֵּיתִי
  english_pob_choice: And I will strike
  chosen_korean: 내가 … 치고
  alternatives_korean:
  - 내가 … 치겠습니다
  - 내가 … 내려치겠습니다
  - 내가 … 치겠습니다
  lexicon: HALOT
  rationale: 무기를 무력화하는 동작이므로, ‘치다’는 직역의 생동감을 살리면서도 현대 한국어에서 자연스럽고 과도하게 고어적이지 않습니다.
- source_word: מִיַּד שְׂמֹאולֶךָ
  english_pob_choice: from your left hand
  chosen_korean: 네 왼손에서
  alternatives_korean:
  - 네 왼손으로부터
  - 네 왼손에서부터
  lexicon: HALOT
  rationale: 히브리어의 ‘손에서’를 한국어에서는 보통 ‘~손에서’로 옮겨 구체적 신체 이미지를 유지합니다.
- source_word: וְחִצֶּיךָ / מִיַּד יְמִינְךָ
  english_pob_choice: and your arrows / from your right hand
  chosen_korean: 네 오른손에서 네 화살을
  alternatives_korean:
  - 네 오른손으로부터 네 화살을
  - 네 오른손에서 네 화살들을
  lexicon: HALOT
  rationale: 병렬 구조를 살려 화살이 오른손에서 떨어져 나가는 장면을 그대로 보이게 했습니다.
- source_word: אַפִּיל
  english_pob_choice: I will make ... fall
  chosen_korean: 떨어뜨리겠습니다
  alternatives_korean:
  - 떨어지게 하겠습니다
  - 떨구겠습니다
  - 떨어지게 만들겠습니다
  lexicon: HALOT
  rationale: 히필형의 사역 의미를 반영해, 단순한 ‘떨어지다’가 아니라 ‘떨어뜨리다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 직접 개입을 나타내는 예언적 사역 동사
  chosen_reading: 하나님이 고그의 무기를 직접 무력화하신다는 점을 드러내기 위해 사역형을 분명하게 살렸습니다.
  alternative_readings:
  - ‘네 활이 떨어집니다’처럼 더 수동적으로 옮기는 방식
  - ‘네 활을 꺾겠습니다’처럼 의미를 요약하는 방식
  rationale: 문맥상 전투 행위를 중단시키는 신적 주도권이 핵심이므로, 사역형 동사를 유지하는 것이 예언의 힘을 보존합니다.
  doctrine_reference: 예언서의 신적 주권과 심판 행위
- issue: 대상자에게 직접 말하는 2인칭 단수 표현
  chosen_reading: ‘네’로 일관하여, 적대자에게 선포하는 직설적 예언 어조를 유지했습니다.
  alternative_readings:
  - ‘당신의’로 완화하는 방식
  - 호칭을 덧붙여 완곡하게 만드는 방식
  rationale: 원문의 2인칭 단수 어조는 심판 선언의 직접성을 가지므로, 한국어에서도 그 긴장을 약화시키지 않는 것이 적절합니다.
  doctrine_reference: 예언적 선언문의 수사
