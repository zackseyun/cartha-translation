id: EZK.39.10
reference: Ezekiel 39:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא יִשְׂא֨וּ עֵצִ֜ים מִן הַ/שָּׂדֶ֗ה וְ/לֹ֤א יַחְטְבוּ֙ מִן הַ/יְּעָרִ֔ים כִּ֥י בַ/נֶּ֖שֶׁק יְבַֽעֲרוּ אֵ֑שׁ וְ/שָׁלְל֣וּ אֶת שֹׁלְלֵי/הֶ֗ם וּ/בָֽזְזוּ֙ אֶת בֹּ֣זְזֵי/הֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/010.yaml
  text: They will not carry wood from the field[a], nor cut it from the forests, because they will make fires with the weapons. They will plunder those who plundered them and loot those who looted them[b], declares the Lord Yahweh.
  footnotes:
  - marker: a
    text: Or, more literally, 'for with the weapons they will burn fire,' that is, they will use the invaders' weapons as fuel.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew repeats cognate terms: ''they will plunder their plunderers and loot their looters,'' emphasizing reversal and recompense.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 들에서 나무를 나르지 않고 숲에서 나무를 베지도 않을 것입니다. 그들이 무기를 태워 불을 피울 것이기 때문입니다.[a] 그들은 자신들을 약탈한 자들을 약탈하고, 자신들을 노략한 자들을 노략할 것입니다.[b] 주 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘무기로 불을 태운다’입니다. 곧 무기를 땔감으로 사용한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 동사와 그 행위자를 가리키는 말을 같은 어근으로 반복하여, ‘그들의 약탈자들을 약탈하고 그들의 노략자들을 노략한다’는 역전을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹֽא יִשְׂא֨וּ עֵצִ֜ים מִן הַ/שָּׂדֶ֗ה
  english_pob_choice: They will not carry wood from the field
  chosen_korean: 그들은 들에서 나무를 가져오지 않고
  alternatives_korean:
  - 그들은 밭에서 나무를 나르지 않고
  - 그들은 들판에서 나무를 취하지 않고
  lexicon: HALOT
  rationale: נשא עֵצים는 목재를 '지다/나르다'의 구체적 행위이므로, 자연스러운 현대 한국어로 '가져오다'를 택해 동작을 살렸습니다. שדה는 여기서 집합적으로 '들'로 옮겨 원문의 평범한 장소성을 유지했습니다.
- source_word: וְ/לֹ֤א יַחְטְבוּ֙ מִן הַ/יְּעָרִ֔ים
  english_pob_choice: nor cut it from the forests
  chosen_korean: 숲에서 베어 오지도 않습니다
  alternatives_korean:
  - 숲에서 자르지도 않습니다
  - 숲에서 찍어 오지도 않습니다
  lexicon: HALOT
  rationale: יַחְטְבוּ는 특히 나무를 '베다/자르다'는 뜻이므로, 현대적이고 직접적인 '베어 오다'로 옮겼습니다. יערים의 복수성은 '숲'으로 자연스럽게 담았습니다.
- source_word: כִּ֥י בַ/נֶּ֖שֶׁק יְבַֽעֲרוּ אֵ֑שׁ
  english_pob_choice: because they will make fires with the weapons
  chosen_korean: 오히려 무기로 불을 피울 것이기 때문입니다
  alternatives_korean:
  - 무기를 연료로 삼아 불을 지필 것이기 때문입니다
  - 무기로 불을 피우기 때문입니다
  lexicon: HALOT
  rationale: נשק이 전쟁의 무기들이 연료 역할을 한다는 의미를 살리되, 한국어로는 '무기로 불을 피우다'가 가장 간결하고 직관적입니다. קשר어 כִּי는 인과를 분명히 드러내는 '…이기 때문입니다'로 처리했습니다.
- source_word: וְ/שָׁלְל֣וּ אֶת שֹׁלְלֵי/הֶ֗ם וּ/בָֽזְזוּ֙ אֶת בֹּ֣זְזֵי/הֶ֔ם
  english_pob_choice: They will plunder those who plundered them and loot those who looted them
  chosen_korean: 그들은 자신들을 약탈한 자들을 약탈하고, 자신들을 노략한 자들을 노략할 것입니다
  alternatives_korean:
  - 그들은 자신을 노략한 자들을 노략하고, 자신을 약탈한 자들을 약탈할 것입니다
  - 그들은 자신들을 빼앗은 자들을 빼앗고, 자신들을 약탈한 자들을 약탈할 것입니다
  lexicon: HALOT
  rationale: 히브리어의 어근 반복과 보복적 반전을 그대로 살리기 위해 '약탈/노략'의 대응을 유지했습니다. 두 절의 평행성과 말놀이를 드러내는 것이 핵심이므로, 두 동사를 구별해 반복했습니다.
- source_word: נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה
  english_pob_choice: declares the Lord Yahweh
  chosen_korean: 주 야훼의 말씀이니라
  alternatives_korean:
  - 주 야훼께서 말씀하십니다
  - 주 하나님 야훼의 말씀입니다
  lexicon: HALOT
  rationale: נְאֻם은 예언적 선언 공식이므로 '말씀이니라'로 공식성을 살렸습니다. יְהוִה는 POB 기준에 따라 '야훼'로 옮기고, אֲדֹנָי와 결합된 호칭은 '주 야훼'로 처리했습니다.
theological_decisions:
- issue: 예언적 역전 구문에서 '자신들을 약탈한 자들을 약탈하고… 노략한 자들을 노략할 것'의 반복 보존
  chosen_reading: 히브리어의 어근 반복을 그대로 살려 보복의 역전과 보상의 대칭을 드러냈습니다.
  alternative_readings:
  - 의미만 풀어 '원수에게 되갚을 것입니다'처럼 완화할 수 있습니다.
  - 두 동사를 하나로 묶어 매끈하게 만들 수 있습니다.
  rationale: 이 절의 신학적 힘은 단순한 보복이 아니라, 동일한 행위의 역전으로 정의와 회복을 보여주는 데 있습니다. 반복을 보존해야 문학적·신학적 강조가 유지됩니다.
  doctrine_reference: 'POB 번역 원칙: source-direct, rhetorical repetition preservation'
- issue: יַחְטְבוּ/יְבַעֲרוּ의 실질 의미를 '베다'와 '불을 피우다'로 직역할지 여부
  chosen_reading: 목재를 더 모으지 않는 이유가 전리품인 무기를 연료처럼 사용하기 때문이라는 뜻을 드러내도록 번역했습니다.
  alternative_readings:
  - '''무기로 불을 지필 것이다''만 두고 배경 설명은 생략할 수 있습니다.'
  - '''무기를 연료로 삼아 불을 지필 것이다''로 더 설명적으로 옮길 수 있습니다.'
  rationale: 원문의 핵심은 전쟁의 도구가 생활 연료가 되는 전환입니다. 본문이 말하는 대비를 분명히 하되, 과도한 주석적 확장은 피했습니다.
  doctrine_reference: 'POB 번역 원칙: maintain what the author meant for the audience to understand'
