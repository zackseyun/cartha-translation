  source_fidelity: 히브리어의 미래적 선포, ‘용사들의 살’과 ‘땅의 지도자들의 피,’ 그리고 그들을 희생 제물의 동물들로 묘사하는 열거를 충실히 보존합니다. 다만 각주 a는 동물 열거 자체를 설명하므로 ‘용사들’ 뒤에 앵커를 두는 편이 해당 은유의 지시 대상을 더 정확히 드러냅니다.
  naturalness: 본문의 합쇼체와 어휘는 자연스럽습니다. ‘숫양들’ 등의 불필요한 복수 접미사는 한국어 열거에서 생략해도 의미가 보존되며 문장이 더 매끄럽습니다. 대시 뒤의 열거는 원문의 의도적인 희생제의 비유를 유지합니다.
