source:
  edition: WLC
  text: בְּשַׂ֤ר גִּבּוֹרִים֙ תֹּאכֵ֔לוּ וְ/דַם נְשִׂיאֵ֥י הָ/אָ֖רֶץ תִּשְׁתּ֑וּ אֵילִ֨ים כָּרִ֤ים וְ/עַתּוּדִים֙ פָּרִ֔ים מְרִיאֵ֥י בָשָׁ֖ן כֻּלָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/018.yaml
  text: You will eat the flesh of mighty men[a], and you will drink the blood of the princes of the earth—rams, lambs, male goats, and bulls[b], all of them fattened ones of Bashan.
  footnotes:
  - marker: a
    text: The animal terms ('rams, lambs, male goats, and bulls') are metaphorical sacrificial imagery for the slain rulers and warriors.
    reason: cultural_note
  - marker: b
    text: Or 'fatlings of Bashan.' Bashan was known for rich pasture and well-fed livestock.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 용사들의 살을 먹고, 땅의 지도자들의 피를 마시게 될 것입니다—숫양들, 어린양들, 숫염소들, 수소들, 바산의 살진 것들 모두를.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기의 동물 명칭들은 죽임을 당한 지도자들과 전사들을 가리키는 은유적 희생 제의 이미지입니다.
    reason: theological_note
  - marker: b
    text: 또는 ‘바산의 살찐 가축들’로 옮길 수 있습니다. 바산은 비옥한 목초지와 잘 먹은 가축으로 알려져 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר גִּבּוֹרִים
  english_pob_choice: the flesh of mighty men
  chosen_korean: 용사들의 살
  alternatives_korean:
  - 강한 자들의 살
  - 용맹한 자들의 살
  lexicon: HALOT
  rationale: גִּבּוֹרִים은 전투 맥락에서 힘센 전사들을 가리키므로, 한국어로는 자연스럽고 무게감 있는 ‘용사들’이 적절합니다. ‘살’은 희석하지 않고 직설적으로 살의 이미지를 살립니다.
- source_word: נְשִׂיאֵי הָאָרֶץ
  english_pob_choice: the princes of the earth
  chosen_korean: 땅의 지도자들
  alternatives_korean:
  - 땅의 왕자들
  - 땅의 방백들
  lexicon: HALOT
  rationale: נְשִׂיאִים은 문맥상 왕족 칭호보다 ‘지도자/우두머리’의 뜻이 자연스러우며, here the phrase is broad and not restricted to Israel. ‘땅의’는 지리적 ‘그 땅’보다 범세계적 의미를 유지합니다.
- source_word: אֵילִים כָּרִים וְעַתּוּדִים פָּרִים
  english_pob_choice: rams, lambs, male goats, and bulls
  chosen_korean: 숫양들, 어린양들, 숫염소들, 수소들
  alternatives_korean:
  - 숫양들, 새끼양들, 숫염소들, 황소들
  - 숫양들, 양새끼들, 염소 수컷들, 황소들
  lexicon: HALOT
  rationale: 열거된 동물 목록은 희생 제의적 이미지로서 문자 그대로 유지하는 것이 본문 효과를 보존합니다. 현대 한국어에서 짝을 맞춘 복수형 표현으로 리듬을 살렸습니다.
- source_word: מְרִיאֵי בָשָׁן
  english_pob_choice: fattened ones of Bashan
  chosen_korean: 바산의 살진 것들
  alternatives_korean:
  - 바산의 살찐 것들
  - 바산의 비옥한 목초지의 살진 가축들
  lexicon: HALOT
  rationale: מְרִיאֵי는 살이 오른, 살진 상태를 가리키며, 바산은 비옥한 목초지로 유명합니다. ‘살진 것들’은 동물군 전체에 걸친 비유를 한국어로 간결하게 보존합니다.
theological_decisions:
- issue: 동물 명칭을 인간 지도자에 대한 비유로 풀어 설명할지 여부
  chosen_reading: 본문의 동물 이름은 본문 안에서는 그대로 두고, 인간 희생자에 대한 은유적 제의 이미지로 읽히게 했습니다.
  alternative_readings:
  - 동물을 인간 칭호로 바꾸어 의역하기
  - 괄호로 풀어 설명을 본문에 삽입하기
  rationale: 히브리어는 인간 ‘용사들/지도자들’을 곧바로 설명하지 않고 동물 목록을 유지하여 전투-희생제의의 충격을 강화합니다. 본문에서 이를 풀어버리면 에스겔의 상징적 표현이 약화됩니다.
  doctrine_reference: 번역 원칙 §1, §3, §6
