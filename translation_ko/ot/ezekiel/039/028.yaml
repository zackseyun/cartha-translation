source:
  edition: WLC
  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/הֶ֔ם בְּ/הַגְלוֹתִ֤/י אֹתָ/ם֙ אֶל הַ/גּוֹיִ֔ם וְ/כִנַּסְתִּ֖י/ם עַל אַדְמָתָ֑/ם וְ/לֹֽא אוֹתִ֥יר ע֛וֹד מֵ/הֶ֖ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/028.yaml
  text: Then they will know that I am Yahweh their God[a], when I exiled them among the nations and then gathered them onto their own land, and I will leave none of them there any longer.
  footnotes:
  - marker: a
    text: Or, 'And they will know that I am the LORD their God, by exiling them among the nations and gathering them onto their own land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그들은 내가 야훼 그들의 하나님인 줄 알게 될 것입니다. 내가 그들을 민족들 가운데로 포로로 끌고 갔을 때, 또 그들을 그들의 땅으로 모아 들였을 때, 나는 거기서 그들 가운데 아무도 더 이상 남겨 두지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그리고 그들은 내가 야훼 그들의 하나님인 줄, 내가 그들을 민족들 가운데로 내쫓고 그들을 그들의 땅으로 모을 때 알게 될 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  english_pob_choice: Then they will know
  chosen_korean: 그러면 그들은 …인 줄 알게 될 것입니다
  alternatives_korean:
  - 그리고 그들은 …인 줄 알게 될 것입니다
  - 그때 그들은 …인 줄 알게 될 것입니다
  lexicon: HALOT
  rationale: 결과·귀결을 나타내는 문맥이므로 ‘그러면’으로 자연스럽게 살렸습니다. ‘알게 될 것입니다’는 히브리어 ‘알다’의 결과적 인지를 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 신명는 고유명사로 음역한 ‘야훼’를 사용했습니다. 이는 칭호로 바꾸지 않고 신적 이름 자체를 보존합니다.
- source_word: בְּהַגְלוֹתִי אֹתָם אֶל הַגּוֹיִם
  english_pob_choice: when I exiled them among the nations
  chosen_korean: 내가 그들을 민족들 가운데로 포로로 끌고 갔을 때
  alternatives_korean:
  - 내가 그들을 민족들 가운데로 유배시켰을 때
  - 내가 그들을 민족들 가운데로 내쫓았을 때
  lexicon: HALOT
  rationale: גלה의 강제 이주 뉘앙스를 살리기 위해 단순한 ‘보내다’보다 ‘포로로 끌고 가다’로 옮겼습니다. הַגּוֹיִם은 이 문맥에서 특별한 종교용어가 아니라 주변 민족들을 가리키므로 ‘민족들’이 적절합니다.
- source_word: וְכִנַּסְתִּים
  english_pob_choice: and then gathered them
  chosen_korean: 또 그들을 … 모아 들였을 때
  alternatives_korean:
  - 그리고 그들을 모았을 때
  - 또 그들을 모으셨을 때
  lexicon: HALOT
  rationale: כנס의 ‘모으다/집합시키다’를 한국어 관용에 맞게 ‘모아 들이다’로 옮겼습니다. 앞의 포로로 끌고 감과 대조되는 회복 동작을 드러냅니다.
- source_word: עַל אַדְמָתָם
  english_pob_choice: onto their own land
  chosen_korean: 그들의 땅으로
  alternatives_korean:
  - 그들 자신의 땅으로
  - 그들의 땅 위로
  lexicon: HALOT
  rationale: אַדְמָה는 여기서 정착지로서의 땅을 가리키므로 자연스러운 ‘그들의 땅으로’로 옮겼습니다. ‘자신의’는 가능하지만 한국어에서는 중복감이 있어 덜 직역적인 표현을 택했습니다.
theological_decisions:
- issue: '동사 시제: ‘I will leave’ vs. ‘I left’'
  chosen_reading: 한국어 본문은 현재 번역 관행에 맞춰 미래형 ‘남겨 두지 않을 것입니다’로 처리했습니다.
  alternative_readings:
  - ‘남겨 두지 않았습니다’처럼 완료형으로 옮김
  - ‘남겨 두지 않겠다’의 직설 미래
  rationale: 히브리어 서술 흐름과 영어 POB의 최종 채택이 미래적 약속의 어조를 유지하고 있으므로, 예언문맥의 확실한 선언으로서 한국어도 미래형이 가장 자연스럽습니다. 동시에 부정 결과를 강하게 드러내기 위해 ‘아무도 더 이상’으로 보강했습니다.
  doctrine_reference: 예언 성취의 확정성
