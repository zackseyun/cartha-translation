source:
  edition: WLC
  text: וְֽ/יָצְא֞וּ יֹשְׁבֵ֣י עָרֵ֣י יִשְׂרָאֵ֗ל וּ/בִעֲר֡וּ וְ֠/הִשִּׂיקוּ בְּ/נֶ֨שֶׁק וּ/מָגֵ֤ן וְ/צִנָּה֙ בְּ/קֶ֣שֶׁת וּ/בְ/חִצִּ֔ים וּ/בְ/מַקֵּ֥ל יָ֖ד וּ/בְ/רֹ֑מַח וּ/בִעֲר֥וּ בָ/הֶ֛ם אֵ֖שׁ שֶׁ֥בַע שָׁנִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/009.yaml
  text: Then the inhabitants of the cities of Israel will go out and make fires with the weapons and burn them—the small shield and the large shield[a], the bow and the arrows[c][b], the hand-club and the spear—and they will make fires with them for seven years.
  footnotes:
  - marker: a
    text: Or, more literally, 'and kindle with the weapons'; the Hebrew verb in this clause is difficult, but the context indicates that the weapons are used as fuel for fire.
    reason: lexical_alternative
  - marker: b
    text: Hebrew distinguishes two kinds of shields here, likely a smaller shield (magen) and a larger body shield (tsinnah).
    reason: cultural_note
  - marker: c
    text: Or 'hand-staff.' The Hebrew expression is literally 'staff of hand' and likely refers to a handheld weapon in this military list.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘 성읍들의 주민들이 나가서 무기에 불을 붙여 그것들을 태울 것입니다. 곧 작은 방패와 큰 방패[a], 활과 화살, 손에 든 몽둥이[b]와 창을 태우며, 그것들로 칠 년 동안 불을 지필 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 두 종류의 방패를 구분합니다. 일반적으로 마겐은 작은 방패, 친나는 더 큰 몸방패로 이해합니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘손의 막대’입니다. 무기 목록의 문맥에서는 손에 들고 사용하는 막대기나 몽둥이를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי עָרֵי יִשְׂרָאֵל
  english_pob_choice: the inhabitants of the cities of Israel
  chosen_korean: 이스라엘 성읍들의 주민들
  alternatives_korean:
  - 이스라엘의 도시들에 사는 사람들
  - 이스라엘 성읍 거주자들
  lexicon: HALOT
  rationale: ‘거주자들’보다 ‘주민들’이 자연스럽고, 속격 구조로 ‘성읍들’과 ‘이스라엘’을 모두 살려 도시 주민이라는 구체성을 유지합니다.
- source_word: וּבִעֲרוּ
  english_pob_choice: make fires
  chosen_korean: 불을 지피고
  alternatives_korean:
  - 불을 만들고
  - 불을 내고
  - 태우고
  lexicon: HALOT
  rationale: 동사 בער의 핵심은 불을 일으키거나 지피는 뜻이므로, 한국어에서는 ‘불을 지피다’가 문맥상 가장 자연스럽고 원문의 발화 행위를 잘 드러냅니다.
- source_word: וְהִשִּׂיקוּ
  english_pob_choice: with the weapons
  chosen_korean: 무기로
  alternatives_korean:
  - 무기들로
  - 그 무기들을 연료로
  - 무기에서
  lexicon: HALOT
  rationale: 영어 POB의 오디트가 무기들을 불쏘시개처럼 사용하는 뜻을 반영하므로, 한국어에서는 도구격 ‘무기로’가 가장 간결하게 원문 관계를 살립니다.
- source_word: מָגֵן / צִנָּה
  english_pob_choice: the small shield / the large shield
  chosen_korean: 작은 방패와 큰 방패
  alternatives_korean:
  - 방패와 큰 방패
  - 작은 방패와 방패
  lexicon: HALOT
  rationale: 히브리어가 두 종류의 방패를 구별하므로, 의미 차이를 드러내기 위해 둘 다 크기 차이로 구분해 옮깁니다.
- source_word: מַקֵּל יָד
  english_pob_choice: the hand-club
  chosen_korean: 손막대
  alternatives_korean:
  - 손지팡이
  - 손몽둥이
  - 손막대기
  lexicon: HALOT
  rationale: 직역하면 ‘손의 막대’이지만 무기 목록의 맥락을 유지하면서도 지나치게 구어적이지 않게 ‘손막대’로 옮겼습니다.
- source_word: בְּ/רֹמַח
  english_pob_choice: the spear
  chosen_korean: 창
  alternatives_korean:
  - 장창
  - 스피어
  lexicon: HALOT
  rationale: 군사 목록에서 가장 자연스러운 한국어 대응은 ‘창’이며, 원문의 표준 군사 용어를 무리 없이 전달합니다.
theological_decisions:
- issue: 전리품 무기를 연료로 삼아 장기간 불을 지핀다는 이미지
  chosen_reading: 문자적 전투 무기 목록을 유지하되, 그것들이 실제로 불의 연료로 사용된다는 점을 분명히 살렸습니다.
  alternative_readings:
  - 비유적으로 순전히 파괴의 상징으로 약화시키는 번역
  - 무기 목록을 압축해 일반적 ‘무기들’로만 처리하는 번역
  rationale: 이 구절의 힘은 전리품이 소각 연료가 된다는 역설에 있으므로, 구체적 무기 목록과 ‘불을 지피다’의 이미지를 보존해야 합니다.
  doctrine_reference: Ezekiel 39:9의 심판 후 정결·소각 이미지
