reference: Ezekiel 39:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָדְע֣וּ הַ֠/גּוֹיִם כִּ֣י בַ/עֲוֺנָ֞/ם גָּל֣וּ בֵֽית יִשְׂרָאֵ֗ל עַ֚ל אֲשֶׁ֣ר מָֽעֲלוּ בִ֔/י וָ/אַסְתִּ֥ר פָּנַ֖/י מֵ/הֶ֑ם וָֽ/אֶתְּנֵ/ם֙ בְּ/יַ֣ד צָרֵי/הֶ֔ם וַ/יִּפְּל֥וּ בַ/חֶ֖רֶב כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/023.yaml
  text: And the nations will know that the house of Israel went into exile for their iniquity[a], because they acted unfaithfully against me; so I hid my face from them and gave them into the hand of their adversaries[b], and they all fell by the sword.
  footnotes:
  - marker: a
    text: Or, 'they trespassed against me' / 'they dealt treacherously with me.' The Hebrew verb carries the sense of covenant unfaithfulness or breach of faith.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'into the hand of their adversaries,' a Hebrew idiom for being delivered into another's power.
    reason: lexical_alternative
translation:
  language: ko
  text: 이방 나라들은 이스라엘 집이 자기들의 죄악 때문에 포로로 끌려갔으며, 그들이 나를 거슬러 신의를 저버렸기 때문에[a] 내가 내 얼굴을 그들에게서 숨기고 그들을 대적들의 손에[b] 넘겨주어, 그들 모두가 칼에 쓰러졌음을 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나에게 불충실했기 때문에’, ‘나를 배반했기 때문에’. 히브리어 동사는 언약적 불충실과 배반의 뜻을 함께 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 대적들의 손에’이며, 다른 이의 지배력 아래 넘겨졌다는 뜻의 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ הַגּוֹיִם
  english_pob_choice: And the nations will know
  chosen_korean: 이방 나라들은 … 알게 될 것입니다
  alternatives_korean:
  - 열방은 … 알게 될 것입니다
  - 나라들은 … 알게 될 것입니다
  lexicon: HALOT
  rationale: הַגּוֹיִם은 에스겔에서 대개 이스라엘 밖의 이방 민족들을 가리키므로, ‘이방 나라들’이 문맥과 신학적 대비를 가장 분명하게 드러냅니다.
- source_word: בַעֲוֺנָם גָּלוּ
  english_pob_choice: went into exile for their iniquity
  chosen_korean: 자기들의 죄악 때문에 포로로 끌려갔고
  alternatives_korean:
  - 자기들의 죄악 때문에 유배되었고
  - 자기들의 죄악으로 포로가 되었고
  lexicon: HALOT
  rationale: עָוֹן의 도덕적·법정적 무게를 ‘죄악’으로 살리되, גָּלוּ의 결과를 한국어에서 자연스러운 수동 표현인 ‘포로로 끌려갔고’로 옮겼습니다.
- source_word: מָעֲלוּ בִי
  english_pob_choice: they acted unfaithfully against me
  chosen_korean: 나를 거슬러 신의를 저버렸기 때문에
  alternatives_korean:
  - 나를 거슬러 언약을 어겼기 때문에
  - 나에게 불충실했기 때문에
  - 나를 배반했기 때문에
  lexicon: HALOT
  rationale: מעל은 단순 불순종보다 ‘신의를 저버리는’ 언약적 불충실을 뜻하므로, 전통적 교회용어보다 그 배반성과 관계 파괴를 직접 드러내는 표현을 택했습니다.
- source_word: בְּיַד צָרֵיהֶם
  english_pob_choice: into the hand of their adversaries
  chosen_korean: 그들의 대적들의 손에 넘겨 주어
  alternatives_korean:
  - 그들의 적들의 손에 넘겨 주어
  - 그들의 원수들의 손에 넘겨 주어
  - 그들을 대적들의 권세 아래 두어
  lexicon: HALOT
  rationale: ‘손에’는 권세·통제 아래 두는 히브리어 관용구이므로 보존했고, צָרִים은 단순 적보다 공격적 대립을 포함하는 ‘대적들’이 더 가깝습니다.
- source_word: וַיִּפְּלוּ בַחֶרֶב כֻּלָּם
  english_pob_choice: and they all fell by the sword
  chosen_korean: 그들 모두가 칼에 쓰러졌음을
  alternatives_korean:
  - 그들 모두가 칼에 죽었음을
  - 그들 모두가 칼에 쓰러졌음을
  - 그들 모두가 칼에 엎드러졌음을
  lexicon: HALOT
  rationale: ‘칼에 쓰러지다’는 전투·심판에서 죽음을 나타내는 성경적 관용을 자연스럽게 살리며, כֻּלָּם의 총체성을 ‘모두’로 유지했습니다.
theological_decisions:
- issue: 포로, 얼굴을 가리심, 대적의 손에 넘기심의 인과관계
  chosen_reading: 포로됨과 패배를 이스라엘의 죄악과 언약적 불충실에 대한 하나님의 심판으로 직설적으로 연결했습니다.
  alternative_readings:
  - 역사적 결과만 말하고 신적 심판성은 약화하는 번역
  - 사람의 책임만 강조하고 하나님의 숨으심과 넘기심을 완화하는 번역
  rationale: 히브리어 본문은 죄악—불충실—얼굴을 숨기심—대적의 손에 넘기심—칼에 쓰러짐의 순서를 분명히 제시하므로, 그 긴장을 풀지 않고 그대로 드러내는 것이 본문 충실성에 부합합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
