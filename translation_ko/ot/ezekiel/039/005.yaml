  lexicon: HALOT
  rationale: 2인칭 단수 미래형 נפל은 고그에게 직접 선포되는 표현이므로, 물리적 추락보다 전투적·죽음의 결과를 함께 드러내는 ‘쓰러질 것입니다’가 적절합니다.
- source_word: דִבַּרְתִּי
  english_pob_choice: I have spoken
  chosen_korean: 내가 말했기 때문입니다
  alternatives_korean:
