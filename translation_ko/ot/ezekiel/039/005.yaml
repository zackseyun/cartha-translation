theological_decisions:
- issue: 여호와 이름의 표기와 합성 칭호 처리
  chosen_reading: 본문은 ‘주 하나님께서 선언하십니다’로 옮기고, יְהוִה의 발음형을 본문에 직접 드러내지 않았습니다.
  alternative_readings:
  - 주 야훼께서 선언하십니다
  - 주 여호와께서 선언하십니다
  rationale: 이 절의 핵심은 심판 선포의 권위이며, 합성 칭호 אֲדֹנָי יְהוִה를 한국어 예배 언어로 자연스럽게 전달하는 것이 우선입니다. 다만 장차의 편집 기준에 따라 야훼 표기를 쓰는 경우도 가능하므로, 본 문안은 과도한 표기 실험보다 읽기 흐름을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
