translation:
  language: ko
  text: 당신은 열린 들판에 쓰러질 것입니다[a][b]. 내가 말했기 때문입니다[c] — 주 하나님께서 선언하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘들판의 얼굴/표면 위에’이지만, 관용적으로는 ‘열린 들판에서’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신은 들판에서 쓰러질 것입니다.’
    reason: alternative_reading
  - marker: c
    text: 히브리어 ‘내가 말했다’는 예언적 확정성을 강조하는 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: עַל פְּנֵי הַשָּׂדֶה
  english_pob_choice: on the open field
  chosen_korean: 열린 들판에
  alternatives_korean:
