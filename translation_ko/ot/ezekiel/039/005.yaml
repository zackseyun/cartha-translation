translation:
  language: ko
  text: 당신은 들판에 쓰러질 것입니다[a]. 내가 말했기 때문입니다. 주 야훼께서 선언하십니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘들판의 얼굴/표면 위에’이며, 관용적으로는 ‘들판에, 탁 트인 곳에’라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘주 야훼’는 אֲדֹנָי יְהוִה입니다. 둘째 낱말은 하나님의 고유 이름 YHWH(야훼)입니다.
    reason: lexical_alternative
