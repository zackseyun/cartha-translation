base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/021.yaml
  text: And I will set my glory among the nations[a], and all the nations will see my judgment that I have executed[b], and my hand that I have laid on them.
  footnotes:
  - marker: a
    text: Or 'my justice that I have done/carried out.'
    reason: lexical_alternative
  - marker: b
    text: '''My hand'' is a Hebrew idiom for God''s active power or action, especially in judgment.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 내 영광을 여러 민족 가운데 두겠습니다. 모든 민족이 내가 집행한 나의 심판과 그들 위에 놓은 나의 손을 볼 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나의 손’은 특히 심판 가운데 나타나는 하나님의 적극적인 행동과 권능을 가리키는 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: I will set
  chosen_korean: 두겠습니다
  alternatives_korean:
  - 주겠습니다
  - 놓겠습니다
  lexicon: BDB/HALOT
  rationale: ‘주다’보다 ‘두다’가 ‘my glory among the nations’의 배치·설정 이미지를 더 직접적으로 살립니다.
- source_word: כְּבוֹדִי
  english_pob_choice: my glory
  chosen_korean: 내 영광
  alternatives_korean:
  - 내 존귀
  - 내 영예
  lexicon: BDB/HALOT
  rationale: כבוד의 대표적 의미를 따라 하나님의 드러난 영광을 자연스럽게 전달합니다.
- source_word: מִשְׁפָּטִי
  english_pob_choice: my judgment
  chosen_korean: 내 심판
  alternatives_korean:
  - 내 판단
  - 내 정의
  lexicon: BDB/HALOT
  rationale: 문맥상 열방에 대한 하나님의 사법적 행위를 가리키므로 ‘심판’이 가장 분명합니다.
- source_word: יָדִי
  english_pob_choice: my hand
  chosen_korean: 내 손
  alternatives_korean:
  - 내 능력
  - 내 권능
  lexicon: BDB/HALOT
  rationale: 손의 직유를 그대로 살려 하나님의 सक्रिय한 գործող/행동 이미지를 보존합니다.
theological_decisions:
- issue: ‘영광’이 단순한 명예인지, 열방 앞에 드러나는 하나님의 현현인지
  chosen_reading: 열방 가운데 드러나는 하나님의 공적 영광으로 이해하고 본문에 반영했습니다.
  alternative_readings:
  - 추상적인 ‘명예’로만 이해할 수 있습니다.
  rationale: 뒤이어 열방이 하나님의 심판과 손을 ‘본다’는 병렬 구조가 있어, 영광은 역사 속 행위로 드러나는 가시적 영광으로 읽는 것이 자연스럽습니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: ‘내 손’의 비유를 풀어 쓸지 여부
  chosen_reading: 직역 이미지를 유지했습니다.
  alternative_readings:
  - ‘내 권능’으로 풀어 쓸 수 있습니다.
  rationale: 히브리어 관용구를 본문에서 보존해, 심판을 행하시는 하나님의 সক্রিয়성을 독자가 본문 자체에서 느끼게 합니다.
  doctrine_reference: Translation philosophy §3, §5
