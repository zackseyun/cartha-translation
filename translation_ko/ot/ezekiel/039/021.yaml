revisions:
- from: 내가 내 영광을 여러 민족 가운데 두겠습니다. 모든 민족이 내가 행한 내 심판과 그들 위에 내가 얹은 내 손을 볼 것입니다.[a]
  to: 내가 내 영광을 여러 민족 가운데 두겠습니다. 모든 민족이 내가 집행한 나의 심판과 그들 위에 놓은 나의 손을 볼 것입니다.[a]
  rationale: 수정은 히브리어의 어휘적 이미지와 소유 관계를 유지하면서 한국어의 자연스러운 사법 표현 및 손의 심판적 작용을 더 분명히 한 것입니다. ‘손’은 본문에서 그대로 보존하여 은유를 해설로 대체하지 않았습니다.
  reviewer_model: gpt-5.6-terra
