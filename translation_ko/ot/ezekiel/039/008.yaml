  text: הִנֵּ֤ה בָאָה֙ וְ/נִֽהְיָ֔תָה נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה ה֥וּא הַ/יּ֖וֹם אֲשֶׁ֥ר דִּבַּֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/008.yaml
  text: Behold[a], it is coming, and it will happen, declares the Lord GOD. This is the day of which I have spoken.
  footnotes:
  - marker: a
    text: Or, more formally, 'Behold, it has come and it has happened'; the Hebrew uses forms that can present the future as so certain that it is spoken of as already accomplished.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 그것이 오고 있으며, 이루어질 것입니다. 주 야훼께서 말씀하십니다. 이것이 내가 말한 그 날입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 “보십시오, 그것이 왔고 그것이 이루어졌습니다”로 옮길 수 있습니다. 히브리어는 미래 사건을 너무도 확실한 것으로 말해 이미 성취된 일처럼 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 예언문에서 청자를 주의를 끌어 사건의 확실성과 임박성을 강조하는 감탄사로, 현대 합쇼체에서는 ‘보십시오’가 가장 자연스럽고 격식 있는 대응입니다.
- source_word: בָאָה / וְנִהְיָתָה
  english_pob_choice: it is coming, and it will happen
  chosen_korean: 그것이 오고 있으며, 이루어질 것입니다
  alternatives_korean:
  - 그것이 오고 있습니다, 그리고 일어날 것입니다
  - 그것이 왔고, 이루어졌습니다
  lexicon: HALOT
  rationale: 히브리어 완료형이 예언적 확실성을 나타내는 점을 살리되, 한국어에서는 미래의 확실한 진행/발생으로 자연스럽게 풀어 ‘오고 있으며, 이루어질 것입니다’로 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼께서
  alternatives_korean:
  - 주 하나님께서
  - 주 여호와께서
  lexicon: HALOT
  rationale: 합성 칭호의 경어성과 신명(יהוה)을 함께 살리기 위해 ‘주 야훼께서’로 옮겼습니다. 전통적 ‘주 하나님’은 신명 표지가 희미해질 수 있어 피했습니다.
theological_decisions:
- issue: 신명 יהוה의 표기와 주칭 결합
  chosen_reading: 주 야훼께서 말씀하십니다
  alternative_readings:
  - 주 하나님께서 말씀하십니다
  - 주 여호와께서 말씀하십니다
  rationale: 본문의 아도나이-야훼 결합을 한국어에서 가장 직접적으로 드러내면서도, 예언자적 선포 공식의 장중함을 보존하기 위한 선택입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 예언적 완료의 시간감
  chosen_reading: 그것이 오고 있으며, 이루어질 것입니다
  alternative_readings:
  - 그것이 왔고, 이루어졌습니다
  - 그것이 오고 있습니다
  rationale: 히브리어 완료형을 단순 과거로 오해하지 않도록 하면서, 선포된 사건의 확실성을 현재-미래 감각으로 전달합니다.
  doctrine_reference: 예언적 완료(prohetic perfect) 사용
