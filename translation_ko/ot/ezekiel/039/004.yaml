  text: עַל הָרֵ֨י יִשְׂרָאֵ֜ל תִּפּ֗וֹל אַתָּה֙ וְ/כָל אֲגַפֶּ֔י/ךָ וְ/עַמִּ֖ים אֲשֶׁ֣ר אִתָּ֑/ךְ לְ/עֵ֨יט צִפּ֧וֹר כָּל כָּנָ֛ף וְ/חַיַּ֥ת הַ/שָּׂדֶ֖ה נְתַתִּ֥י/ךָ לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/004.yaml
  text: On the mountains of Israel you will fall—you and all your troops and the peoples who are with you[b][a]. I have given you as food to every kind of bird of prey and to the wild animals of the field.
  footnotes:
  - marker: a
    text: Hebrew literally, 'all your wings,' likely a metaphor for Gog's military divisions or attached forces.
    reason: lexical_alternative
  - marker: b
    text: Or 'to birds of prey of every wing'; the Hebrew expression emphasizes all kinds of scavenging birds.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 산들 위에서 너는 쓰러질 것입니다—너와 네 모든 부대와 네 곁에 있는 여러 민족도 함께입니다[a]. 나는 너를 모든 날짐승과 들의 모든 짐승의 먹이로 주었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘네 모든 날개’입니다. 여기서는 고그의 군사 부대나 동원된 분견대를 가리키는 비유로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘모든 날개를 가진 새들’에 가깝습니다. 모든 종류의 사체를 먹는 새들을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפּוֹל
  english_pob_choice: you will fall
  chosen_korean: 쓰러질 것입니다
  alternatives_korean:
  - 넘어질 것입니다
  - 떨어질 것입니다
  - 망할 것입니다
  lexicon: HALOT
  rationale: נפל의 기본 이미지를 살리면서, 심판 문맥에서의 패배와 죽음을 자연스럽게 드러내는 동사로 옮겼습니다.
- source_word: אֲגַפֶּיךָ
  english_pob_choice: your troops
  chosen_korean: 네 모든 부대
  alternatives_korean:
  - 네 모든 날개
  - 네 모든 진영
  - 네 모든 분견대
  lexicon: HALOT
  rationale: 직역하면 ‘날개’이지만 군사적 비유이므로 현대 한국어에서는 부대가 의미를 가장 분명하게 전달합니다.
- source_word: עַמִּים אֲשֶׁר אִתָּךְ
  english_pob_choice: the peoples who are with you
  chosen_korean: 네 곁에 있는 여러 민족
  alternatives_korean:
  - 너와 함께 있는 민족들
  - 너와 함께한 여러 백성
  - 너와 함께 있는 나라들
  lexicon: HALOT
  rationale: עַמִּים의 복수적 민족/백성 의미를 살리되, Gog과 동행하는 여러 집단이라는 점을 한국어로 자연스럽게 표현했습니다.
- source_word: לְעֵיט צִפּוֹר כָּל כָּנָף
  english_pob_choice: to every kind of bird of prey
  chosen_korean: 모든 날짐승
  alternatives_korean:
  - 모든 종류의 맹금
  - 날개 가진 모든 맹금
  - 온갖 썩은 고기를 먹는 새
  lexicon: HALOT
  rationale: 히브리어의 관용적이고 확장적인 표현을 지나치게 세분하지 않고, 사냥·사체를 먹는 새 전체를 포괄하는 말로 옮겼습니다.
- source_word: חַיַּת הַשָּׂדֶה
  english_pob_choice: the wild animals of the field
  chosen_korean: 들의 모든 짐승
  alternatives_korean:
  - 들짐승
  - 광야의 짐승
  - 들의 짐승
  lexicon: HALOT
  rationale: 정형화된 히브리어 표현을 유지하면서도, 문맥상 자연스러운 현대 한국어로 정리했습니다.
- source_word: נְתַתִּיךָ לְאָכְלָה
  english_pob_choice: I have given you as food
  chosen_korean: 먹이로 주었습니다
  alternatives_korean:
  - 먹을 것으로 주었습니다
  - 밥으로 주었습니다
  - 먹히도록 내주었습니다
  lexicon: HALOT
  rationale: ‘먹을 것’으로 넘겨준다는 심판 이미지를 살리되, 한국어에서 가장 직접적이고 품위 있는 표현으로 옮겼습니다.
theological_decisions:
- issue: 예언적 완료형의 처리
  chosen_reading: ‘주었습니다’로 옮겨 이미 결정된 심판을 드러냈습니다.
  alternative_readings:
  - ‘줄 것입니다’로 미래형화
  - ‘내주었습니다’로 더 강하게 재현
  rationale: 히브리어 완료형 נְתַתִּיךָ는 예언에서 확정된 판결을 나타낼 수 있으므로, 단순 미래보다 이미 선포된 결정의 무게를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 군사적 비유 ‘wings’의 해석
  chosen_reading: ‘부대’로 옮겨 군사 집단의 의미를 드러냈습니다.
  alternative_readings:
  - ‘날개’로 직역
  - ‘분견대’로 세분화
  rationale: 문맥상 문자적 날개가 아니라 군사적 편제나 측면 부대를 가리키므로, 오해를 줄이는 번역이 필요합니다.
  doctrine_reference: POB lexical policy on metaphor and context
