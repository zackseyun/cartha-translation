  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 히브리어의 병렬 주어(‘너와 네 모든 부대와 너와 함께 있는 여러 민족’)를 ‘너는 …—너와 …도 함께입니다’로 처리한 부분은 문법적으로 부자연스럽고, 함께 쓰러지는 대상이라는 관계가 흐려집니다. ‘모든 날짐승’은 עֵיט의 맹금/사체를 먹는 새라는 의미를 충분히 드러내지 못합니다.
