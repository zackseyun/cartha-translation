id: EZK.39.25
reference: Ezekiel 39:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה עַתָּ֗ה אָשִׁיב֙ אֶת שבית יַֽעֲקֹ֔ב וְ/רִֽחַמְתִּ֖י כָּל בֵּ֣ית יִשְׂרָאֵ֑ל וְ/קִנֵּאתִ֖י לְ/שֵׁ֥ם קָדְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/025.yaml
  text: 'Therefore thus says the Lord GOD: Now I will restore the fortunes of Jacob[a], and I will have compassion on the whole house of Israel[b], and I will be jealous for my holy name.'
  footnotes:
  - marker: a
    text: Or, 'I will bring back the captives of Jacob.' The Hebrew idiom can refer specifically to return from captivity or more broadly to restoring a people's fortunes.
    reason: alternative_reading
  - marker: b
    text: Or, 'I will be zealous for my holy name.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. “이제 내가 야곱의 형편을 회복시키고[a], 이스라엘 온 집에 긍휼을 베풀며[b], 내 거룩한 이름을 위하여 질투하겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 야곱의 포로들을 돌아오게 하겠습니다.’ 히브리어 관용구는 포로 귀환을 가리킬 수도 있고, 더 넓게는 ժողովրդի 형편의 회복을 뜻할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내가 내 거룩한 이름을 위하여 열심을 내겠습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이에
  - 그런즉
  lexicon: HALOT
  rationale: 앞선 문맥에서 이어지는 결론 표지이므로, 원문의 인과·결론 관계를 자연스럽게 드러내는 ‘그러므로’가 적절합니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: אֲדֹנָי와 יְהוָה의 결합을 한국어에서 구분해 살리기 위해 ‘주’와 ‘야훼’를 함께 두었습니다.
- source_word: אָשִׁיב אֶת שבית יַעֲקֹב
  english_pob_choice: I will restore the fortunes of Jacob
  chosen_korean: 야곱의 형편을 회복시키고
  alternatives_korean:
  - 야곱의 포로들을 돌아오게 하고
  - 야곱의 번영을 회복시키고
  lexicon: HALOT
  rationale: שבות/שבית 관용구는 포로 귀환보다 넓은 ‘형편/운세의 회복’을 뜻할 수 있으므로, 문맥에 맞는 복원 의미를 살리되 포로 귀환으로 한정하지 않았습니다.
- source_word: וְרִחַמְתִּי
  english_pob_choice: and I will have compassion
  chosen_korean: 긍휼을 베풀며
  alternatives_korean:
  - 자비를 보이며
  - 불쌍히 여기며
  lexicon: HALOT
  rationale: רחם의 깊은 연민과 언약적 긍휼을 자연스러운 한국어로 옮기기 위해 ‘긍휼을 베풀다’를 택했습니다.
- source_word: וְקִנֵּאתִי
  english_pob_choice: and I will be jealous
  chosen_korean: 질투하겠습니다
  alternatives_korean:
  - 열심을 내겠습니다
  - 열정적으로 지키겠습니다
  lexicon: HALOT
  rationale: 하나님의 이름을 향한 קנא의 언약적 질투/열심을, 의미를 완화하지 않고 직접적으로 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문 고유명칭을 보존하기 위해 전통적 대체어보다 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: קנא의 신학적 뉘앙스
  chosen_reading: 질투하겠습니다
  alternative_readings:
  - 열심을 내겠습니다
  - 열성으로 임하겠습니다
  rationale: 하나님의 거룩한 이름을 위한 언약적 질투라는 긴장을 약화시키지 않기 위해, 도덕적으로 중화된 표현보다 직접적인 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it'
