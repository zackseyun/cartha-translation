- from: 사람아, 너는 곡을 향하여 예언하고 말하여라. 주 야훼께서 이렇게 말씀하십니다. "보아라, 내가 네게로 간다, 곡아. 메섹과 두발의 지도자인 왕이다."[a]
  to: 사람아, 너는 곡을 거슬러 예언하고 이렇게 말하십시오. “주 야훼께서 이렇게 말씀하십니다. ‘보아라, 메섹과 두발의 으뜸 통치자 곡아, 내가 너를 대적한다.[a]’”
  rationale: 원문 어순과 호격을 살리면서, 심판 선언 ‘보아라, 내가 너를 대적한다’를 정확히 복원했습니다. רֹאשׁ의 논쟁적 읽기는 본문에서 ‘으뜸’으로 번역하고 지명 ‘로스’ 가능성을 각주에 남겨 모호성을 보존했습니다. 불필요하게 첨가된 ‘왕’을 제거하고, 전체 문체를 현대 합쇼체로 통일했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:47:09Z'
review_pass:
  verdict: revise
  source_fidelity: 현 본문의 “내가 네게로 간다”는 הִנְנִי אֵלֶיךָ라는 심판 공식의 ‘내가 너를 대적한다’는 뜻을 옮기지 못합니다. 또한 רֹאשׁ을 ‘왕’으로 처리한 것은 원문에 없는 의미를 더하고, ‘지도자인 왕’은 נְשִׂיא רֹאשׁ의 구문을 부정확하게 재구성합니다.
  naturalness: ‘곡을 향하여 예언하고’도 가능하지만, 심판 예언의 대적 의미를 살린 ‘곡을 거슬러 예언하고’가 더 분명합니다. 요청된 현대 합쇼체에 맞추어 명령과 인용문을 ‘말하십시오/말씀하십니다’로 정리하고, 인용문의 화자·대상 관계가 자연스럽도록 고쳤습니다.
  terminology: בֶן־אָדָם은 에스겔서의 반복 호칭을 따라 ‘사람아’로 유지했습니다. אֲדֹנָי יְהוִה는 주어진 명칭 방침에 따라 ‘주 야훼’로, נְשִׂיא רֹאשׁ은 본문의 일반명사 읽기에 따라 ‘으뜸 통치자’로 옮겼습니다. רֹאשׁ을 지명 ‘로스’로 읽는 가능성은 각주로 보존했습니다.
  issues:
  - severity: high
    issue: “내가 네게로 간다”
    rationale: אֵלֶיךָ는 이 문맥의 확립된 적대·심판 표현에서 ‘너를 대적하여’라는 뜻이며, 단순한 이동을 뜻하지 않습니다.
  - severity: high
    issue: “메섹과 두발의 지도자인 왕”
    rationale: נְשִׂיא는 ‘통치자/군주’이지 ‘왕’으로 단정할 수 없고, רֹאשׁ은 여기서 ‘으뜸’ 또는 지명 ‘로스’의 쟁점입니다. ‘왕’을 첨가하면 원문 의미가 변합니다.
  - severity: medium
    issue: 각주의 대안 읽기와 본문 선택의 불일치
    rationale: 현 본문은 ‘왕’이라는 제3의 해석을 제시하면서 각주는 ‘로스’를 대안으로 듭니다. 본문에는 일반명사 읽기를 명시하고, 지명 읽기를 각주에 제시해야 합니다.
  - severity: low
    issue: 문체가 지정된 합쇼체와 일관되지 않음
    rationale: ‘말하여라’는 해라체입니다. 현대 formal-polite 요청에 맞게 ‘말하십시오’로 조정했습니다.
  revised_text: 사람아, 너는 곡을 거슬러 예언하고 이렇게 말하십시오. “주 야훼께서 이렇게 말씀하십니다. ‘보아라, 메섹과 두발의 으뜸 통치자 곡아, 내가 너를 대적한다.[a]’”
