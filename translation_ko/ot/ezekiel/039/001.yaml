id: EZK.39.1
reference: Ezekiel 39:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֤ה בֶן אָדָם֙ הִנָּבֵ֣א עַל גּ֔וֹג וְ/אָ֣מַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִ֤י אֵלֶ֨י/ךָ֙ גּ֔וֹג נְשִׂ֕יא רֹ֖אשׁ מֶ֥שֶׁךְ וְ/תֻבָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/001.yaml
  text: 'And you[a], son of man, prophesy against Gog, and say: Thus says the Lord GOD: Behold, I am against you, Gog, prince of Rosh, Meshech, and Tubal.'
  footnotes:
  - marker: a
    text: Or, 'prince of Rosh, Meshech, and Tubal.' The Hebrew word rosh can be read as 'chief' or taken as a proper name.
    reason: alternative_reading
translation:
  language: ko
  text: 사람아, 너는 곡을 향하여 예언하고 말하여라. 주 야훼께서 이렇게 말씀하십니다. "보아라, 내가 네게로 간다, 곡아. 메섹과 두발의 지도자인 왕이다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘로스, 메섹과 두발의 지도자’로도 읽을 수 있습니다. 히브리어 rosh는 ‘머리/우두머리’로도, 고유명사로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 사람아
  alternatives_korean:
  - 인자여
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서의 반복적 호칭을 자연스러운 현대 한국어 명령형 호칭으로 살리되, 예언자에게 직접 부르는 문체를 유지했습니다.
- source_word: הִנָּבֵא עַל
  english_pob_choice: prophesy against
  chosen_korean: 향하여 예언하고
  alternatives_korean:
  - 대하여 예언하고
  - 맞서 예언하고
  lexicon: HALOT
  rationale: 원문의 대적·심판 맥락을 반영하되, 한국어에서 과도하게 군사적이거나 해설적인 표현을 피했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: POB 기본 원칙에 따라 YHWH는 야훼로 옮기고, אֲדֹנָי와의 결합을 한국어에서 간결하게 살렸습니다.
- source_word: נְשִׂיא
  english_pob_choice: prince
  chosen_korean: 지도자
  alternatives_korean:
  - 왕
  - 통치자
  - 군주
  lexicon: HALOT
  rationale: 문맥상 정치적 통치자를 가리키지만, 현대 독자가 과도한 왕정 이미지를 떠올리지 않도록 기능적으로 옮겼습니다.
- source_word: רֹאשׁ
  english_pob_choice: Rosh / chief
  chosen_korean: 왕
  alternatives_korean:
  - 머리
  - 수장
  - 로스
  lexicon: HALOT
  rationale: 본문 전통과 본문비평의 긴장을 한국어 본문 자체에서는 해소하지 않고, 이어지는 동격 구문을 자연스럽게 읽히도록 처리했습니다.
- source_word: מֶשֶׁךְ וְתֻבָל
  english_pob_choice: Meshech and Tubal
  chosen_korean: 메섹과 두발
  alternatives_korean:
  - 메셰크와 두발
  - 메섹과 다발
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 관행에 맞춰 음역했습니다.
theological_decisions:
- issue: יהוה의 번역과 신명칭 보존
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 본문의 언약적 신명은 지워지지 않도록 야훼를 사용했고, 아도나이와 결합된 경어는 한국어에서 자연스럽게 묶었습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
- issue: רֹאשׁ의 읽기와 본문 긴장 유지
  chosen_reading: 지도자(본문상 해석을 본문에 과잉 투입하지 않음)
  alternative_readings:
  - Rosh를 고유명사로 읽기
  - chief로 읽기
  rationale: 히브리어는 고유명사와 일반명사 해석이 모두 가능하므로, 본문에서는 단정적 해설을 피하고, 독자가 문맥상 통치자 칭호를 이해하도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; document alternatives in footnotes where ambiguity is genuine'
