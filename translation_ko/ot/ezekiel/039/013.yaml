id: EZK.39.13
reference: Ezekiel 39:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/קָֽבְרוּ֙ כָּל עַ֣ם הָ/אָ֔רֶץ וְ/הָיָ֥ה לָ/הֶ֖ם לְ/שֵׁ֑ם י֚וֹם הִכָּ֣בְדִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/013.yaml
  text: All the people of the land will bury them[a], and it will be to their renown on the day I glorify myself[b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'it will be a name for them'; the Hebrew idiom means that this will bring them honor or renown.
    reason: lexical_alternative
  - marker: b
    text: Or 'on the day I am glorified' or 'on the day I show my glory.'
    reason: alternative_reading
translation:
  language: ko
  text: 그 땅의 모든 백성이 그들을 장사할 것이며, 그것은 그들에게 명성이 될 것이니, 내가 내 영광을 나타내는 날에 — 주 야훼의 말씀입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 명성이 될 것이니’는 히브리어 관용구 ‘그들에게 이름이 될 것’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내가 내 영광을 나타내는’은 ‘내가 영광을 받는’ 또는 ‘내가 나의 영광을 보이는’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְקָבְרוּ
  english_pob_choice: will bury
  chosen_korean: 장사할 것이며
  alternatives_korean:
  - 묻을 것이며
  - 매장할 것이며
  lexicon: HALOT
  rationale: 장사는 시신을 실제로 매장하는 구체적 행위를 자연스럽게 드러내며, 예언적 미래 용법도 잘 살립니다.
- source_word: כָּל עַם הָאָרֶץ
  english_pob_choice: all the people of the land
  chosen_korean: 그 땅의 모든 백성
  alternatives_korean:
  - 그 땅의 모든 사람들
  - 온 땅의 백성
  lexicon: HALOT
  rationale: עַם은 집단 전체를 가리키므로 ‘백성’이 적절하고, הָאָרֶץ는 이 문맥에서 세계가 아니라 해당 지역의 ‘땅’으로 이해하는 것이 자연스럽습니다.
- source_word: וְהָיָה לָהֶם לְשֵׁם
  english_pob_choice: it will be to their renown
  chosen_korean: 그것은 그들에게 명성이 될 것이니
  alternatives_korean:
  - 그것은 그들에게 이름이 될 것이니
  - 그것은 그들의 기념이 될 것이니
  lexicon: HALOT
  rationale: ‘for a name’라는 관용구를 한국어로 풀어, 단순한 이름이 아니라 명예·명성을 뜻하는 효과를 드러냈습니다.
- source_word: יוֹם הִכָּבְדִי
  english_pob_choice: on the day I glorify myself
  chosen_korean: 내가 내 영광을 나타내는 날에
  alternatives_korean:
  - 내가 나 자신을 영화롭게 하는 날에
  - 내가 영광을 받는 날에
  lexicon: HALOT
  rationale: 히필이 아니라 니팔 계열의 자기영화/자기현시 뉘앙스를 살리되, ‘영광을 나타내다’로 한국어에서 자연스럽고 신학적으로도 무리 없이 옮겼습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 야훼의 말씀입니다
  alternatives_korean:
  - 주 하나님 야훼의 말씀입니다
  - 주 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: נְאֻם은 예언적 선언 공식이므로 ‘말씀입니다’로 옮겼고, יְהוָה는 프로젝트 기본어인 ‘야훼’로, אֲדֹנָי와 결합한 고유한 호칭 질서를 반영했습니다.
theological_decisions:
- issue: יְהוָה의 번역과 אֲדֹנָי יְהוִה 결합 공식
  chosen_reading: ‘야훼’로 직접 음역하되, ‘주’와 함께 ‘주 야훼’로 표기했습니다.
  alternative_readings:
  - ‘주 하나님’
  - ‘주 여호와’
  rationale: 원문은 언약 이름을 직접 사용하므로, 전통적 완화어보다 स्रोत 직접성을 우선했습니다. 아도나이+야훼의 결합은 한국어에서 어색하지 않게 ‘주 야훼’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: יוֹם הִכָּבְדִי의 해석
  chosen_reading: 하나님이 자기 영광을 드러내시는 날로 이해했습니다.
  alternative_readings:
  - 하나님이 영광을 받으시는 날
  - 하나님이 영화롭게 되시는 날
  rationale: 문맥상 민족들 가운데 하나님의 주권과 거룩이 드러나는 날을 가리키므로, 수동형보다 자기현시·자기영화의 능동적 의미를 살렸습니다.
  doctrine_reference: Ezekiel 39의 심판-회복 문맥과 신적 자기현시
