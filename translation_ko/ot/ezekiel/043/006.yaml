  footnotes:
  - marker: a
    text: 히브리어는 여기서 ‘목소리’라는 명사를 명시하지 않으며, 말하는 이도 특정하지 않습니다. 그래서 ‘누군가’로 불특정하게 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘집’은 에스겔의 환상 속 성전 건물을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶשְׁמַע
  english_pob_choice: Then I heard
  chosen_korean: 그때 나는 ... 들었습니다
  alternatives_korean:
  - 그리고 나는 ... 들었습니다
  - 그래서 나는 ... 들었습니다
  lexicon: WLC/HALOT
  rationale: wayyiqtol의 서술 진행을 한국어의 시간 연결로 자연스럽게 살리되, 합쇼체 서술에 맞게 ‘그때’로 옮겼습니다.
- source_word: מִדַּבֵּר
  english_pob_choice: one speaking / someone speaking
  chosen_korean: 말하는 이의 소리
  alternatives_korean:
  - 말하는 사람
  - 말하는 이
  - 말하는 목소리
  lexicon: WLC/HALOT
  rationale: 히브리어는 ‘목소리’라는 명사를 명시하지 않지만, 한국어에서는 ‘말하는 이의 소리’가 발화가 진행 중임을 가장 자연스럽게 드러냅니다. 발화 주체를 특정하지 않기 위해 ‘이’를 유지했습니다.
- source_word: מֵהַבָּיִת
  english_pob_choice: from the house
  chosen_korean: 집에서
  alternatives_korean:
  - 집으로부터
  - 성전에서
  - 그 집에서
  lexicon: WLC/HALOT
  rationale: 직역상 ‘집’이지만, 본문 맥락상 성전 환시의 건물을 가리킵니다. 본문에는 그 명칭을 미리 해석해 넣지 않고 기본 의미를 살렸습니다.
- source_word: וְאִישׁ הָיָה עֹמֵד אֶצְלִי
  english_pob_choice: while a man was standing beside me
  chosen_korean: 그와 함께 한 사람이 내 곁에 서 있었습니다
  alternatives_korean:
  - 한 사람이 내 곁에 서 있었습니다
  - 그리고 한 사람이 내 곁에 서 있었습니다
  - 내 곁에는 한 사람이 서 있었습니다
  lexicon: WLC/HALOT
  rationale: ‘אִישׁ’는 부정관사적 표현이므로 ‘한 사람’의 뜻으로 옮겼고, ‘הָיָה עֹמֵד’는 지속적 과거를 반영해 ‘서 있었습니다’로 풀었습니다. 동시 상황은 한국어에서 ‘그와 함께’로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 집 안에서 말하는 이의 신원 미표시
  chosen_reading: 화자는 신원을 밝히지 않고, 단지 집에서 들려오는 말소리만 묘사했습니다.
  alternative_readings:
  - 하나님이 말씀하시는 것으로 명시적으로 옮김
  - ‘목소리’로 구체화하여 번역함
  rationale: 히브리어는 이 절에서 말하는 이를 명시하지 않으므로, 문맥이 암시하는 신적 발화 가능성을 본문 밖에서 확정하지 않고 남겨 두었습니다.
  doctrine_reference: 'Translation philosophy: theological tension should be preserved rather than resolved by translation.'
