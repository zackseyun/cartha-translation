theological_decisions:
- issue: 제단 구조 묘사의 용어를 현대 독자에게 어떻게 전달할지
  chosen_reading: 전문적이되 읽기 쉬운 구조어를 사용해, 측량 정보 자체를 흐리지 않도록 했습니다.
  alternative_readings:
