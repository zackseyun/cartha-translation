  rationale: 이 절은 상징적 해석보다 제단의 층진 구조를 정확히 전달하는 것이 핵심이므로, 교회 전통어보다 구조가 보이는 현대어를 택했습니다.
  doctrine_reference: Ezekiel 43:13–17의 성전 제단 규격
