  rationale: חֵיק은 문자적으로 ‘품/가슴’이지만, 이 문맥에서는 제단의 하단 구조를 가리키므로 직역된 신체 은유보다 구조적 ‘오목한 가장자리’가 원문의 구체성을 더 잘 살립니다.
