base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/003.yaml
  text: And the appearance of what I saw was like the appearance that I had seen when I came to destroy the city[a], and the visions were like the appearance that I had seen by the Kebar Canal[b]; and I fell on my face.
  footnotes:
  - marker: a
    text: Or, 'when he came to destroy the city'; the Hebrew text reads 'when I came,' which may reflect Ezekiel's participation in the vision of Jerusalem's destruction rather than literal personal agency.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the river Kebar'; likely a major canal in Babylonia rather than a natural river.
    reason: cultural_note
translation:
  language: ko
  text: 내가 보았던 광경은 그 도시를 멸망시키러 왔을 때 내가 보았던 광경과 같았으며, 그 환상들은 케바르 강[a] 곁에서 내가 보았던 광경과 같았습니다. 이에 내가 엎드렸습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 '내가 왔을 때'라고 읽으나, 이는 예언자가 예루살렘 멸망의 환상에 참여했음을 반영할 수 있으며, 실제 개인적 행위를 의미하지는 않을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 '케바르 강'은 자연 강이 아니라 바벨론의 주요 운하일 가능성이 높습니다.
    reason: alternative_reading
