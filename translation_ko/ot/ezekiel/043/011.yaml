id: EZK.43.11
reference: Ezekiel 43:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִֽם נִכְלְמ֞וּ מִ/כֹּ֣ל אֲשֶׁר עָשׂ֗וּ צוּרַ֣ת הַ/בַּ֡יִת וּ/תְכוּנָת֡/וֹ וּ/מוֹצָאָ֡י/ו וּ/מוֹבָאָ֣י/ו וְֽ/כָל צֽוּרֹתָ֡/ו וְ/אֵ֣ת כָּל חֻקֹּתָי/ו֩ וְ/כָל צורת/י וְ/כָל תורת/ו הוֹדַ֣ע אוֹתָ֔/ם וּ/כְתֹ֖ב לְ/עֵֽינֵי/הֶ֑ם וְ/יִשְׁמְר֞וּ אֶת כָּל צוּרָת֛/וֹ וְ/אֶת כָּל חֻקֹּתָ֖י/ו וְ/עָשׂ֥וּ אוֹתָֽ/ם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/011.yaml
  text: And if they are ashamed of all that they have done[a], make known to them the design of the house, its arrangement, its exits, its entrances, all its forms, all its statutes, and all its laws; and write it before their eyes[b], so that they may keep its whole design and all its statutes and do them.
  footnotes:
  - marker: a
    text: Or 'the form/pattern of the house ... all its forms ... all its pattern.' The Hebrew repeatedly uses צורָה language, emphasizing the temple's structural pattern.
    reason: lexical_alternative
  - marker: b
    text: '''Its laws'' may also be rendered ''its instructions.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 자기들이 한 모든 일로 부끄러워한다면, 성전의 설계와 그 구조, 그 출구들과 그 입구들, 그 모든 형상[a], 그 모든 규례, 그 모든 형상과 그 모든 율법[b]을 그들에게 알리십시오. 또 그들 눈앞에 이것을 기록하여, 그들이 성전의 모든 형상과 그 모든 규례를 지키고 그것들을 행하게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형상’은 여기서 단순한 외형만이 아니라 성전의 구조적 형태 또는 패턴을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘율법’은 여기서 ‘지시’ 또는 ‘교훈’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְלְמוּ
  english_pob_choice: are ashamed
  chosen_korean: 부끄러워하게 되거든
  alternatives_korean:
  - 부끄러워하거든
  - 수치를 느끼거든
  - 창피해하거든
  lexicon: HALOT
  rationale: 조건문의 맥락에서 כָּלַם의 피동형은 죄를 직면한 부끄러움/수치의 반응을 가리키므로, 자연스러운 현대 한국어로 ‘부끄러워하게 되거든’이 적절합니다.
- source_word: צוּרַת הַבַּיִת / כָּל צֻרוֹתָיו
  english_pob_choice: the design of the house / all its forms
  chosen_korean: 집의 설계 / 그 모든 형상 / 그 전체 설계
  alternatives_korean:
  - 집의 형상
  - 집의 모양
  - 집의 구조
  lexicon: HALOT
  rationale: 이 절에서는 צורָה가 성전의 건축적 형태와 패턴을 강조하므로, 첫 항목은 ‘설계’로, 반복되는 표현은 ‘형상’과 ‘전체 설계’로 옮겨 구조적 의미와 반복을 함께 살렸습니다.
- source_word: מוֹצָאָיו / מוֹבָאָיו
  english_pob_choice: its exits / its entrances
  chosen_korean: 그 출입구들 / 그 문들
  alternatives_korean:
  - 그 나가는 곳들 / 그 들어가는 곳들
  - 그 출구들 / 그 입구들
  lexicon: HALOT
  rationale: 건축 맥락에서 출입 지점들을 가리키므로, 한국어에서도 자연스럽고 시각적인 ‘출입구들’과 ‘문들’로 옮겼습니다.
- source_word: חֻקֹּתָיו / תורתיו
  english_pob_choice: its statutes / its laws
  chosen_korean: 그 모든 규례와 그 모든 법
  alternatives_korean:
  - 그 모든 규정과 그 모든 율법
  - 그 모든 조례와 그 모든 교훈
  lexicon: HALOT
  rationale: חֻקּוֹת은 정해진 규례, תּוֹרָה는 여기서 가르침보다 규범적 지시를 뜻하므로, 둘의 구분을 살리기 위해 ‘규례’와 ‘법’으로 구별했습니다.
- source_word: וּכְתֹב לְעֵינֵיהֶם
  english_pob_choice: write it before their eyes
  chosen_korean: 그들 눈앞에 그것을 기록하십시오
  alternatives_korean:
  - 그들 보는 앞에 그것을 쓰십시오
  - 그들 앞에 그것을 기록하십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 공개성과 시각성을 살리기 위해 ‘눈앞에’로 옮겼고, 명령형은 예언적 지시로서 공손한 합쇼체를 유지했습니다.
theological_decisions:
- issue: 성전 묘사를 문자적 설계도처럼 한정할지, 환상적 패턴과 규범적 질서를 함께 살릴지
  chosen_reading: 건축적 요소(설계, 배치, 출입구, 문)와 규범적 요소(규례, 법)를 함께 유지해, 본문이 가진 구조적·법적 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - 모든 항목을 ‘모양/형태’로만 통일하기
  - 모든 항목을 ‘계획/규정’으로만 풀어쓰기
  rationale: 본문은 성전의 외형만이 아니라 준수해야 할 질서와 규범까지 함께 제시하므로, 어느 한쪽으로 환원하지 않는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §3
- issue: 예언적 지시문에서의 높임말 사용
  chosen_reading: 에스겔의 하느님께 받은 지시를 공손한 명령형(하십시오)으로 옮겼습니다.
  alternative_readings:
  - 평서형으로 완화하기
  - 더 전통적인 하옵소서체로 옮기기
  rationale: 현대 표준어 합쇼체를 유지하면서도, 직접적인 신적 지시의 권위를 약화시키지 않도록 공손한 명령형을 사용했습니다.
  doctrine_reference: Korean style policy
