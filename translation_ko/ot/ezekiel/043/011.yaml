review_pass:
  verdict: revise
  source_fidelity: 원문은 건축 관련 항목에서 ‘나가는 곳들’(מוֹצָאָיו)과 ‘들어가는 곳들’(מוֹבָאָיו)을 구별하며, צורָה 계열을 목록 안에서 다시 한 번 반복합니다. 초안의 ‘출입구들, 문들’은 이 대조를 흐리고, 두 번째 ‘모든 형상’을 생략하여 원문의 반복을 충분히 반영하지 못합니다. 또한 마지막 절은 그들이 지키고 행하도록 하는 목적을 나타내므로 이를 더 직접적으로 드러내는 편이 좋습니다.
  naturalness: ‘부끄러워하게 되거든’보다 ‘부끄러워한다면’이 현대 표준어 문맥에서 자연스럽습니다. ‘출구들과 입구들’은 짝을 이루는 건축 용어로 분명하며, 반복되는 ‘모든 형상’은 한국어에서는 다소 무겁지만 원문의 의도적인 반복이므로 유지할 수 있습니다. 합쇼체 명령형도 적절합니다.
  terminology: 문맥상 הַבַּיִת는 환상 속 성전을 가리키므로 ‘성전’으로 명시할 수 있습니다. תְּכוּנָתוֹ는 ‘구조’, חֻקֹּתָיו는 ‘규례’, תּוֹרֹתָיו는 ‘율법’으로 옮겨 각각의 건축적·규범적 의미를 구별했습니다. צורָה는 ‘형상’으로 반복하여 동일 어근의 반복을 보존했습니다.
  issues:
  - severity: medium
    issue: ‘그 출입구들, 그 문들’이 מוֹצָאָיו / מוֹבָאָיו의 대조를 정확히 반영하지 못함
    rationale: 첫 단어는 나가는 곳들/출구들, 둘째는 들어가는 곳들/입구들입니다. ‘출입구’는 양쪽 의미를 합쳐 버리고 ‘문’은 반드시 입구를 뜻하지 않습니다.
  - severity: medium
    issue: 목록 중 두 번째 ‘그 모든 형상’이 누락됨
    rationale: 히브리어 본문은 ‘모든 형상’을 규례들 뒤에 다시 언급합니다. 영어 감사 기록의 생략과 무관하게 원문 우선 원칙상 한국어에도 보존해야 합니다.
  - severity: low
    issue: 마지막 결과절이 단순 미래 진술로 옮겨짐
    rationale: וְיִשְׁמְרוּ는 앞선 ‘알리고 기록하라’의 목적/의도를 나타냅니다. ‘지키고 행하게 하십시오’가 연결을 더 자연스럽고 정확하게 드러냅니다.
