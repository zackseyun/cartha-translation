  to: 그들이 자기들이 한 모든 일로 부끄러워한다면, 성전의 설계와 그 구조, 그 출구들과 그 입구들, 그 모든 형상[a], 그 모든 규례, 그 모든 형상과 그 모든 율법[b]을 그들에게 알리십시오. 또 그들 눈앞에 이것을 기록하여, 그들이 성전의 모든 형상과 그 모든 규례를 지키고 그것들을 행하게 하십시오.
