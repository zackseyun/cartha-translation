  - 너희는 ... 드리고
  lexicon: HALOT
  rationale: 제의 문맥에서 עשה는 단순히 ‘하다’보다 제물을 ‘바치다’가 자연스럽고 정확합니다.
- source_word: וּפַר בֶּן בָּקָר
  english_pob_choice: a bull, a son of the herd
  chosen_korean: 송아지 한 마리
  alternatives_korean:
  - 한 마리의 황소
  - 소 떼의 새끼 한 마리
  lexicon: HALOT
  rationale: 영어 POB가 보존한 히브리어 직역의 긴장(‘a bull, a son of the herd’)은 한국어에서 ‘송아지’가 가장 압축적으로 전달합니다.
- source_word: תְּמִימִים
  english_pob_choice: without blemish
  chosen_korean: 흠 없는
  alternatives_korean:
  - 흠 없는
  - 온전한
  lexicon: HALOT
  rationale: 제사 동물의 결격 없는 상태를 나타내는 표준적이고 분명한 표현입니다.
- source_word: יַעֲשׂוּ
  english_pob_choice: they shall offer
  chosen_korean: 바칠지니
  alternatives_korean:
  - 바칠 것입니다
  - 바치고
  lexicon: HALOT
  rationale: 히브리어의 복수형을 본문에서 살리되, 한국어에서는 연결형으로 자연스럽게 마무리했습니다.
theological_decisions:
- issue: 동사 주어의 전환(단수→복수) 보존
  chosen_reading: 첫 절은 ‘너희는’으로, 뒤 절은 반복 제사 주체를 암시하는 ‘바칠지니’로 처리하여 히브리어의 주어 전환을 평준화하지 않았습니다.
  alternative_readings:
  - 두 절 모두 ‘너는 ... 바치고 ... 바칠지니’로 단수화
  - 두 절 모두 ‘그들은 ... 바칠지니’로 복수화
  rationale: 본문의 תַּעֲשֶׂה와 יַעֲשׂוּ의 변화는 의미 있는 문법적 긴장이므로, 매끈하게 통일하지 않고 원문 흐름을 드러내는 편이 출처 충실성에 부합합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy'
- issue: ‘בֶּן בָּקָר’의 제의적 관용 표현 처리
  chosen_reading: 직역 어감을 살리기보다 제의 맥락에서 통용되는 한국어 ‘송아지’로 옮겨 의미를 명료하게 했습니다.
  alternative_readings:
  - ‘소 떼의 아들’의 직역 유지
  - ‘젊은 수송아지’로 풀어쓰기
  rationale: 영어 POB가 지적한 대로 이 표현은 표준 제사 관용구이므로, 한국어 독자가 제물의 종류를 즉시 이해하도록 하는 것이 더 적절합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
