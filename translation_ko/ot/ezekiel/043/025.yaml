  source_fidelity: 수정이 필요합니다. 히브리어 첫 동사 תַּעֲשֶׂה는 2인칭 남성 단수인데 초안은 ‘너희는’으로 복수화했습니다. 또한 마지막 יַעֲשׂוּ는 3인칭 남성 복수이므로, 주어를 드러내지 않은 ‘바칠지니’만으로는 원문의 문법적 전환이 본문에서 보존되지 않습니다. פַר בֶּן־בָּקָר는 제의 문맥에서 ‘수송아지’로 자연스럽게 옮길 수 있으며, תְּמִימִים는 수송아지와 숫양 모두를 수식합니다.
  naturalness: ‘칠 일 동안’, ‘날마다’, ‘속죄제물로’, ‘흠 없는 수송아지’, ‘양 떼에서 나온 숫양’은 현대 표준 한국어의 정중한 문체에서 자연스럽습니다. 두 절을 문장으로 나누고 ‘또 그들은’을 명시하면 문법 전환도 분명해집니다.
  terminology: ‘속죄제물’은 חַטָּאת의 제의적 용법을 적절히 나타내며, ‘숫염소’, ‘수송아지’, ‘숫양’, ‘흠 없는’도 제사 문맥에 맞는 일관된 용어입니다. ‘송아지’보다 ‘수송아지’가 פַר의 성별을 더 정확히 반영합니다.
