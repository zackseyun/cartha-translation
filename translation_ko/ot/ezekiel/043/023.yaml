id: EZK.43.23
reference: Ezekiel 43:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/כַלּוֹתְ/ךָ֖ מֵֽ/חַטֵּ֑א תַּקְרִיב֙ פַּ֣ר בֶּן בָּקָ֣ר תָּמִ֔ים וְ/אַ֥יִל מִן הַ/צֹּ֖אן תָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/023.yaml
  text: When you have finished making purification[c][b][a], you shall present a flawless young bull and a flawless ram from the flock.
  footnotes:
  - marker: a
    text: Or 'when you have finished making atonement' or 'when you have finished cleansing from sin.' The Hebrew verb can carry the sense of purifying or de-sinning in sacrificial contexts.
    reason: lexical_alternative
  - marker: b
    text: Literally 'a bull, a son of the herd.'
    reason: lexical_alternative
  - marker: c
    text: Or 'without blemish.'
    reason: lexical_alternative
translation:
  language: ko
  text: 정결하게 하는 일을 마치면, 흠 없는 수송아지 한 마리와 양 떼 가운데서 흠 없는 숫양 한 마리를 드려야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속죄를 마치면’, 혹은 ‘죄에서 정결하게 하기를 마치면’. 히브리어 동사는 제의적 맥락에서 정결하게 하다, 속죄하다, 죄를 씻다의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘가축의 아들인 수소’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘흠 없는’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכַלּוֹתְךָ מֵחַטֵּא
  english_pob_choice: When you have finished making purification
  chosen_korean: 정결하게 하는 일을 마치면
  alternatives_korean:
  - 속죄를 마치면
  - 죄를 깨끗하게 하는 일을 마치면
  - 정결하게 하기를 마치면
  lexicon: HALOT
  rationale: 히브리어 הב/כלה + מֵחַטֵּא는 제의적 정결 행위가 완료되는 시점을 나타내므로, 자연스러운 합쇼체로 ‘정결하게 하는 일을 마치면’이라고 옮겼습니다. POB의 ‘purification’은 너무 좁게 속죄만으로 고정하지 않도록 살렸습니다.
- source_word: תַּקְרִיב
  english_pob_choice: you shall present
  chosen_korean: 드려야 합니다
  alternatives_korean:
  - 바쳐야 합니다
  - 제시해야 합니다
  - 가져다 드려야 합니다
  lexicon: HALOT
  rationale: 제의 문맥의 הִקְרִיב는 단순히 ‘가져오다’보다 제단 앞에 예물로 드리는 행위를 뜻하므로, 현대 한국어 성경체로 자연스러운 ‘드리다’를 택했습니다.
- source_word: פַּר בֶּן בָּקָר
  english_pob_choice: a flawless young bull
  chosen_korean: 흠 없는 수송아지 한 마리
  alternatives_korean:
  - 흠 없는 어린 수소 한 마리
  - 흠 없는 소 수송아지 한 마리
  - 결점 없는 어린 황소 한 마리
  lexicon: HALOT
  rationale: בן בקר은 문자적으로 ‘가축 떼의 아들’이지만 제의 용례에서는 어린 수소를 가리키므로, 너무 직역하지 않고 ‘수송아지’로 옮겼습니다. POB의 ‘young bull’도 같은 방향입니다.
- source_word: תָּמִים
  english_pob_choice: flawless
  chosen_korean: 흠 없는
  alternatives_korean:
  - 결점 없는
  - 온전한
  - 완전한
  lexicon: HALOT
  rationale: 제의 규정에서 תמים는 제물의 결함 없음, 즉 의례적 무결성을 뜻하므로 ‘흠 없는’이 가장 자연스럽고 전통적이면서도 직역성을 유지합니다. 두 번 반복된 형용사도 일관되게 처리했습니다.
- source_word: מִן הַצֹּאן
  english_pob_choice: from the flock
  chosen_korean: 양 떼 가운데서
  alternatives_korean:
  - 양 떼에서
  - 가축 떼에서
  - 떼 가운데서
  lexicon: HALOT
  rationale: צאן은 작은 가축의 집합명사이므로, 제물의 출처를 나타내는 말로 ‘양 떼 가운데서’가 문맥상 가장 자연스럽습니다. ‘from the flock’의 집합적 의미를 살렸습니다.
theological_decisions:
- issue: מֵחַטֵּא의 제의적 의미
  chosen_reading: ‘정결하게 하는 일’로 옮겨 속죄만으로 한정하지 않았습니다.
  alternative_readings:
  - 속죄
  - 죄를 씻음
  - 정결례
  rationale: 이 구절은 성전 봉헌/정결 절차의 맥락에서 제의적 오염 제거를 말하므로, 신학적 개념을 과도하게 좁히지 않고 본문이 말하는 행위를 그대로 드러내는 쪽을 택했습니다.
  doctrine_reference: '번역 원칙: 본문이 직접 말하는 제의적 의미를 보존하고, 문맥이 허용하는 범위를 넘어 교리 용어로 축소하지 않습니다.'
