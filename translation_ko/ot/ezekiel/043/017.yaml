  text: וְ/הָ/עֲזָרָ֞ה אַרְבַּ֧ע עֶשְׂרֵ֣ה אֹ֗רֶךְ בְּ/אַרְבַּ֤ע עֶשְׂרֵה֙ רֹ֔חַב אֶ֖ל אַרְבַּ֣עַת רְבָעֶ֑י/הָ וְ/הַ/גְּבוּל סָבִ֨יב אוֹתָ֜/הּ חֲצִ֣י הָ/אַמָּ֗ה וְ/הַֽ/חֵיק לָ֤/הּ אַמָּה֙ סָבִ֔יב וּ/מַעֲלֹתֵ֖/הוּ פְּנ֥וֹת קָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/017.yaml
  text: And the ledge was fourteen cubits long by fourteen cubits wide at its four sides, and the rim around it was half a cubit, and its base was a cubit all around; and its steps faced east.
translation:
  language: ko
  text: 그리고 그 돌출부는 길이가 열네 규빗이요, 너비도 사방이 열네 규빗이며, 그 둘레의 가장자리는 반 규빗이고, 그 받침은 사방으로 한 규빗이며, 그 계단은 동쪽을 향해 있었습니다.
  philosophy: formal
lexical_decisions:
- source_word: הָעֲזָרָה
  english_pob_choice: the ledge
  chosen_korean: 돌출부
  alternatives_korean:
  - 단
  - 턱
  - 받침대
  lexicon: עֲזָרָה
  rationale: 성전 구조물의 돌출된 면을 가리키므로, 문맥상 기능을 살리면서도 본문이 말하는 형상을 직접적으로 드러내는 '돌출부'를 택했습니다.
- source_word: אֹרֶךְ ... רֹחַב
  english_pob_choice: long ... wide
  chosen_korean: 길이 ... 너비
  alternatives_korean:
  - 세로 ... 가로
  - 장 ... 폭
  lexicon: אֹרֶךְ / רֹחַב
  rationale: 치수 표기에서 자연스러운 표준어를 사용해 본문의 측량 표현을 정확히 옮겼습니다.
- source_word: הַגְּבוּל סָבִיב
  english_pob_choice: the rim around it
  chosen_korean: 그 둘레의 가장자리
  alternatives_korean:
  - 그 테두리
  - 둘레의 띠
  - 주변 가장자리
  lexicon: גְּבוּל
  rationale: POB의 'rim'을 따라가되, 성전 도면의 경계선·둘레선이라는 의미가 보이도록 '가장자리'로 풀었습니다.
- source_word: הַחֵיק
  english_pob_choice: its base
  chosen_korean: 그 받침
  alternatives_korean:
  - 기단
  - 바닥
  - 아랫부분
  lexicon: חֵיק
  rationale: 구조물의 아래쪽 받침 부분을 가리키므로, 기술적이면서도 읽기 자연스러운 '받침'을 선택했습니다.
