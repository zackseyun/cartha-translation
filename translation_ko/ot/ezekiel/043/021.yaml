id: EZK.43.21
reference: Ezekiel 43:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָ֣קַחְתָּ֔ אֵ֖ת הַ/פָּ֣ר הַֽ/חַטָּ֑את וּ/שְׂרָפ/וֹ֙ בְּ/מִפְקַ֣ד הַ/בַּ֔יִת מִ/ח֖וּץ לַ/מִּקְדָּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/021.yaml
  text: Then you shall take the bull of the sin offering and burn it in the appointed place of the house[b][a], outside the sanctuary.
  footnotes:
  - marker: a
    text: Or, 'the bull for the sin offering'; alternatively, 'the bull of the purification offering.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the appointed place of the house'; 'house' here refers to the temple complex.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 다음 너는 속죄제의 수소를 가져다가, 성전의 정해진 곳에서, 곧 성소 밖에서 불태워야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘정해진 곳’은 성전 단지 안의 지정된 장소를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  english_pob_choice: Then you shall take
  chosen_korean: 그런 다음 너는 … 가져다가
  alternatives_korean:
  - 그리고 너는 … 가져다가
  - 그러면 너는 … 가져다가
  lexicon: HALOT
  rationale: 절차적 지시의 순서를 살려 ‘그런 다음’으로 옮기고, 명령형 흐름을 자연스럽게 유지하기 위해 ‘가져다가’를 사용했습니다.
- source_word: הַפָּר
  english_pob_choice: the bull
  chosen_korean: 수소
  alternatives_korean:
  - 황소
  - 소
  lexicon: HALOT
  rationale: 제의 문맥의 פָּר는 일반적인 ‘소’보다 제물로 바쳐지는 수소를 가리키는 것이 분명하므로 ‘수소’가 가장 정확합니다.
- source_word: הַחַטָּאת
  english_pob_choice: of the sin offering
  chosen_korean: 속죄제의
  alternatives_korean:
  - 죄제의
  - 죄를 위한
  lexicon: HALOT
  rationale: 제사 용어로는 한국어 성경 전통과 의미를 함께 반영하는 ‘속죄제’가 가장 안정적이며, 문법적으로는 수소를 수식하는 관형어로 처리했습니다.
- source_word: בְּמִפְקַד הַבַּיִת
  english_pob_choice: in the appointed place of the house
  chosen_korean: 성전의 정해진 곳에서
  alternatives_korean:
  - 성전의 지정된 곳에서
  - 집의 정해진 곳에서
  lexicon: HALOT
  rationale: מִפְקָד는 지정·배정된 장소를 뜻하므로 ‘정해진 곳’으로 옮겼고, הַבַּיִת는 에스겔의 성전 환상 문맥에서 ‘성전’이 더 분명하므로 그렇게 풀어 썼습니다.
- source_word: מִחוּץ לַמִּקְדָּשׁ
  english_pob_choice: outside the sanctuary
  chosen_korean: 성소 밖에서
  alternatives_korean:
  - 성전 밖에서
  - 거룩한 곳 밖에서
  lexicon: HALOT
  rationale: מִקְדָּשׁ는 성소를 가리키므로, 제의적 경계를 분명히 드러내는 ‘성소 밖에서’가 직접적입니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미
  chosen_reading: ‘속죄제’로 번역해 제물 자체를 가리키는 제의 용어를 유지했습니다.
  alternative_readings:
  - ‘죄의 제물’
  - ‘정결 제물’
  rationale: 이 문맥은 죄 자체가 아니라 제물의 종류를 말하므로, 독자가 즉시 알아볼 수 있는 제사 용어 ‘속죄제’를 유지하는 것이 의미와 가독성을 함께 살립니다.
  doctrine_reference: 제의 용어 일관성 및 원문 근접 번역 원칙
- issue: 히브리어의 지시적 문장 흐름
  chosen_reading: 한국어에서는 2인칭 명령 흐름을 자연스럽게 이어 ‘가져다가 … 불태워야 합니다’로 다듬었습니다.
  alternative_readings:
  - ‘그리고 너는 가져야 하고 … 태워야 합니다’
  - ‘너는 가져서 … 태우십시오’
  rationale: 히브리어의 절차적 지시를 한국어로 옮길 때는 어색한 시제 전환보다, 명령의 연속성을 살리는 것이 원문의 기능을 더 잘 전달합니다.
  doctrine_reference: optimal-equivalence
