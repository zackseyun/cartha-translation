revisions:
- from: 그러자 영이 나를 들어 올려 내 안뜰로 데려가셨는데, 보십시오, 야훼의 영광이 그 집을 가득 채웠습니다.[a][b]
  to: 그러자 영[a]이 나를 들어 올려 안쪽 뜰로 데려갔습니다. 보십시오, 야훼의 영광이 그 집[b]에 가득 차 있었습니다.
  rationale: ‘안쪽 뜰’로 공간적 대조를 바로잡고, 영광이 집에 충만한 상태라는 히브리어 서술을 반영했습니다. ‘영’의 각주를 그 단어에, ‘집’의 각주를 그 단어에 배치했으며, 본문의 해석상 여지는 각주에서 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:45:50Z'
review_pass:
  verdict: revise
  source_fidelity: ‘내 안뜰’은 화자의 소유를 뜻할 수 있어 הַפְּנִימִי(‘안쪽의/내부의’)를 정확히 반영하지 못합니다. 또한 מָלֵא는 ‘가득 차 있었다’라는 상태 서술이므로 이를 직접 살리는 것이 좋습니다.
  naturalness: ‘안쪽 뜰’은 성전 건축 문맥에서 자연스럽고, ‘보십시오’는 현대적이면서도 예언서의 주목 환기 기능을 유지합니다. ‘영’에 존대 주어를 사용하지 않으면 원문의 무관사 רוּחַ가 지닌 해석 여지를 더 잘 보존합니다.
  terminology: יהוה는 프로젝트 방침에 따라 ‘야훼’로 유지합니다. ‘영광’과 ‘집’도 각각 כְבוֹד 및 הַבָּיִת의 표현을 충실히 반영합니다. 각주 표지는 해당 단어에 직접 붙였습니다.
