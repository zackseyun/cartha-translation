id: EZK.43.5
reference: Ezekiel 43:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּשָּׂאֵ֣/נִי ר֔וּחַ וַ/תְּבִיאֵ֕/נִי אֶל הֶֽ/חָצֵ֖ר הַ/פְּנִימִ֑י וְ/הִנֵּ֛ה מָלֵ֥א כְבוֹד יְהוָ֖ה הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/005.yaml
  text: Then the Spirit lifted me up and brought me into the inner court[a], and behold[b], the glory of Yahweh filled the house.
  footnotes:
  - marker: a
    text: Or 'wind' or 'a spirit'; Hebrew רוּחַ can bear these senses, though in Ezekiel's vision context it likely refers to the divine Spirit.
    reason: alternative_reading
  - marker: b
    text: Or 'the temple'; Hebrew 'the house' is the more literal expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 영이 나를 들어 올려 내 안뜰로 데려가셨는데, 보십시오, 야훼의 영광이 그 집을 가득 채웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '바람', '한 영'으로도 옮길 수 있습니다. 히브리어 רוּחַ는 이런 뜻들을 가질 수 있지만, 에스겔의 환상 문맥에서는 하나님의 영을 가리키는 것으로 보는 것이 가장 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '성전'입니다. 히브리어는 문자적으로 '그 집'이라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂאֵנִי רוּחַ
  english_pob_choice: Then the Spirit lifted me up
  chosen_korean: 영이 나를 들어 올려
  alternatives_korean:
  - 영이 나를 데리고 올라가
  - 바람이 나를 들어 올려
  - 한 영이 나를 들어 올려
  lexicon: HALOT
  rationale: רוּחַ는 환상적 이동 문맥에서 하나님의 영을 가리키는 것이 가장 자연스럽지만, 히브리어의 넓은 의미를 보존해 '영'으로 옮기고, נשׂא의 상승·이동감을 '들어 올려'로 살렸습니다.
- source_word: אֶל הֶחָצֵר הַפְּנִימִי
  english_pob_choice: into the inner court
  chosen_korean: 내 안뜰로
  alternatives_korean:
  - 내부 뜰로
  - 안쪽 뜰로
  lexicon: HALOT
  rationale: חָצֵר는 성전 문맥에서 '뜰'이 적절하며, הַפְּנִימִי의 대비를 한국어 성전 용어에 맞게 간결한 '안뜰'로 표현했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 예언서의 주목 환기 표지로서 '보십시오'가 현대 한국어에서 자연스럽고도 돌연한 시각적 강조를 유지합니다.
- source_word: כְבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 영광스러운 임재
  - 여호와의 영광
  lexicon: HALOT
  rationale: כְבוֹד는 단순한 명예보다 현현된 신적 영광/임재를 가리키므로 '영광'을 유지했고, יְהוָה는 본 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
- source_word: הַבָּיִת
  english_pob_choice: the house
  chosen_korean: 그 집
  alternatives_korean:
  - 성전
  - 그 성전
  lexicon: HALOT
  rationale: 히브리어의 직역성을 살려 '집'을 유지했습니다. 문맥상 성전임은 분명하지만, 본문이 선택한 표현의 소박함을 보존하기 위해 '그 집'으로 옮겼습니다.
theological_decisions:
- issue: רוּחַ의 의미와 환상적 이동의 주체
  chosen_reading: 하나님의 영이 예언자를 들어 옮기는 환상적 이동으로 이해합니다.
  alternative_readings:
  - 바람이 실제로 옮겼다는 읽기
  - 막연한 한 영이 옮겼다는 읽기
  rationale: 에스겔의 반복되는 환상 이동 문맥에서 행위 주체를 단순한 바람으로 낮추지 않고, 하나님의 영의 인도와 능동적 이동으로 읽는 것이 서사와 신학적 긴장을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §3 (preserve tension where genuine ambiguity exists)
- issue: 야훼의 이름 표기
  chosen_reading: YHWH를 야훼로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신적 이름을 직접 사용하므로, 대체 호칭보다 고유명사를 드러내는 번역이 source-direct 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
