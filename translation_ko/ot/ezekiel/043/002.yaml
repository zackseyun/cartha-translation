id: EZK.43.2
reference: Ezekiel 43:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כְּבוֹד֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בָּ֖א מִ/דֶּ֣רֶךְ הַ/קָּדִ֑ים וְ/קוֹל֗/וֹ כְּ/קוֹל֙ מַ֣יִם רַבִּ֔ים וְ/הָ/אָ֖רֶץ הֵאִ֥ירָה מִ/כְּבֹדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/002.yaml
  text: And behold[a], the glory of the God of Israel was coming from the way of the east, and his voice was like the sound of many waters[b], and the earth shone from his glory.
  footnotes:
  - marker: a
    text: Or 'from the east' or 'from the direction of the east.' The Hebrew is literally 'from the way of the east.'
    reason: lexical_alternative
  - marker: b
    text: Or 'like the roar of many waters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 이스라엘의 하나님의 영광이 동쪽 길로부터 오고 있었습니다. 그의 소리는 많은 물의 소리 같았고, 땅은 그의 영광으로 빛났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어는 문자적으로 ''동쪽의 길로부터''입니다. '
    reason: source_note
  - marker: b
    text: 또는 '많은 물의 굉음 같았고'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보십시오
  lexicon: HALOT
  rationale: 환시 서술의 갑작스러운 전환과 주의를 끄는 감탄을 살리되, 한국어에서는 자연스럽고 현대적인 호격성 표현으로 옮겼습니다.
- source_word: מִדֶּרֶךְ הַקָּדִים
  english_pob_choice: from the way of the east
  chosen_korean: 동쪽 길로부터
  alternatives_korean:
  - 동쪽에서
  - 동쪽의 방향에서
  lexicon: HALOT
  rationale: 직역에 가까운 '길'의 이미지를 살리면서도 한국어에서 이해 가능한 표현으로 유지했습니다. POB의 각주가 지적하는 문자적 표현을 본문에 반영했습니다.
- source_word: וְקוֹלוֹ
  english_pob_choice: and his voice
  chosen_korean: 그의 소리는
  alternatives_korean:
  - 그의 음성은
  - 그 소리는
  lexicon: HALOT
  rationale: 히브리어의 인칭 접미사를 자연스럽게 반영해 소유격을 살렸고, 이어지는 물소리와의 비교를 위해 '소리'를 택했습니다.
- source_word: כְּקוֹל מַיִם רַבִּים
  english_pob_choice: like the sound of many waters
  chosen_korean: 많은 물의 소리 같았고
  alternatives_korean:
  - 많은 물의 굉음 같았고
  - 큰 물들의 소리 같았고
  lexicon: HALOT
  rationale: קול의 기본 의미를 따라 '소리'로 옮기고, POB의 'many waters' 이미지를 그대로 보존했습니다. '굉음'은 의미를 과하게 강화할 수 있어 피했습니다.
- source_word: מִכְּבֹדוֹ
  english_pob_choice: from his glory
  chosen_korean: 그의 영광으로
  alternatives_korean:
  - 그의 영광에서
  - 그의 영광 때문에
  lexicon: HALOT
  rationale: 여기서 מן은 근원/출처를 나타내므로, 땅의 빛남이 그의 영광에서 비롯됨을 한국어 조사 '-으로'로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 신적 현현에서의 인칭 지시
  chosen_reading: '''그의 소리''와 ''그의 영광''을 그대로 사용해, 영광이면서도 인격적으로 드러나는 하나님의 현현을 보존했습니다.'
  alternative_readings:
  - '''그것의 소리''와 ''그것의 영광''으로 비인격화'
  - '''그 소리''로만 축약'
  rationale: 문법적으로는 '영광'이 선행사이지만, 본문 전체는 이스라엘의 하나님이 나타나시는 환시이므로 인칭 지시를 유지하는 편이 원문과 POB의 해석을 더 잘 반영합니다.
  doctrine_reference: 원문 우선 원칙과 신현(神顯) 묘사의 인격적 성격 유지
