  naturalness: 합쇼체와 문장 흐름은 대체로 자연스럽습니다. 다만 '많은 물의 소리'보다 '많은 물이 내는 소리'가 현대 한국어에서 더 자연스럽고, 비교 대상도 분명합니다. 각주 표지는 해당 어구 바로 뒤에 두는 편이 독자에게 명확합니다.
