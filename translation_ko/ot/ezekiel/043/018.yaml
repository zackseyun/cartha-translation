source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אֵ֚לֶּה חֻקּ֣וֹת הַ/מִּזְבֵּ֔חַ בְּ/י֖וֹם הֵעָֽשׂוֹת֑/וֹ לְ/הַעֲל֤וֹת עָלָי/ו֙ עוֹלָ֔ה וְ/לִ/זְרֹ֥ק עָלָ֖י/ו דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/018.yaml
  text: 'And he said to me[a], “Son of man, thus says the Lord GOD: These are the statutes of the altar on the day it is made[c][b], for offering burnt offerings on it and for sprinkling blood on it.”'
  footnotes:
  - marker: a
    text: 'Hebrew: ''on the day of its being made''; the phrase may also be understood more generally as ''when it is made.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'a burnt offering'; the Hebrew singular may function collectively here.
    reason: lexical_alternative
  - marker: c
    text: Or 'for dashing blood on it'; the Hebrew verb can denote a more forceful ritual application of blood than English 'sprinkling' sometimes suggests.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. “인자야, 주 야훼께서 이렇게 말씀하십니다. 이것들은 제단을 만드는 날, 그 위에 번제를 드리고 그 위에 피를 뿌리기 위한 제단의 규례입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그것이 만들어지는 날에’입니다. 여기서 ‘그것’은 제단을 가리킵니다. 더 일반적으로는 ‘만들어질 때’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘번제 하나’. 히브리어 단수형은 여기서 집합적으로 쓰였을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 위에 피를 힘 있게 뿌리기’. 히브리어 동사는 단순히 흩뿌리는 것보다 더 힘 있는 제의적 피의 적용을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔의 반복적 호칭을 살리기 위해 직역적 호칭을 유지하되, 한국어에서는 자연스러운 호격인 ‘인자야’를 택했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: POB의 예배적·학술적 기준에 맞춰 Tetragrammaton을 ‘야훼’로 옮기고, אֲדֹנָי와의 중복을 피하면서도 두 칭호를 함께 드러냈습니다.
- source_word: חֻקּוֹת
  english_pob_choice: statutes
  chosen_korean: 규례
  alternatives_korean:
  - 법규
  - 명령
  - 조례
  lexicon: HALOT
  rationale: 제의적·법적 문맥에서 정해진 규정을 뜻하므로, 한국어 성서어휘에서 널리 통용되면서도 의미를 과도하게 약화하지 않는 ‘규례’가 적절합니다.
- source_word: וְלִזְרֹק ... דָּם
  english_pob_choice: and for sprinkling blood
  chosen_korean: 그 위에 피를 뿌리기 위한 것입니다
  alternatives_korean:
  - 그 위에 피를 뿌리기 위한 것입니다
  - 그 위에 피를 뿌리는 것입니다
  - 그 위에 피를 던지기 위한 것입니다
  lexicon: HALOT
  rationale: זרק은 제의적 혈액 적용을 가리키므로 ‘뿌리다’로 옮기되, POB의 해설상 더 강한 ‘dashing’ 가능성은 주석 없이 본문 의미를 유지하는 선에서 살렸습니다.
theological_decisions:
- issue: 여호와 전통 대신 YHWH의 음역을 어떻게 처리할 것인가
  chosen_reading: ‘주 야훼’로 옮겨, 주권 칭호와 언약 이름을 함께 드러냈습니다.
  alternative_readings:
  - ‘주 하나님’
  - ‘주 여호와’
  rationale: POB의 원문 비평·신학적 지침에 따라 יְהוָה는 ‘야훼’로 보존하는 것이 원어의 고유성을 더 직접적으로 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
