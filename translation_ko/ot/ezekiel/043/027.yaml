  rationale: 신명 יהוה를 보존하도록 예언자적 선언 공식을 ‘주 야훼께서 말씀하십니다’로 고쳤습니다. 또한 제단과 제물의 관계를 더 직접적으로 나타내기 위해 ‘제단 위에서’를 ‘제단 위에’로 다듬었습니다. 나머지 표현은 원문의 시간적 진행, 제의 용어, 그리고 하나님께서 백성을 받아들이신다는 관계적 의미를 유지합니다.
