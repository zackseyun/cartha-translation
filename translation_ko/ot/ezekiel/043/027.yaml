  text: וִֽ/יכַלּ֖וּ אֶת הַ/יָּמִ֑ים וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁמִינִ֜י וָ/הָ֗לְאָה יַעֲשׂ֨וּ הַ/כֹּהֲנִ֤ים עַל הַ/מִּזְבֵּ֨חַ֙ אֶת עוֹלֽוֹתֵי/כֶם֙ וְ/אֶת שַׁלְמֵי/כֶ֔ם וְ/רָצִ֣אתִי אֶתְ/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־ס־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/027.yaml
  text: When the days are completed[a], then from the eighth day onward the priests shall offer on the altar your burnt offerings and your peace offerings, and I will accept you, declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'your fellowship offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「그 날들이 끝나면, 여덟째 날부터는 제사장들이 제단 위에 여러분의 번제와 화목제를 드릴 것이며, 내가 여러분을 받아들이겠습니다.」 주 야훼께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교제제’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיכַלּוּ אֶת הַיָּמִים
  english_pob_choice: When the days are completed
  chosen_korean: 그 날들이 끝나면
  alternatives_korean:
  - 그 날들이 완성되면
  - 그 날들이 끝나면
  lexicon: HALOT
  rationale: 완결된 정결·봉헌 기간이 끝난 뒤를 가리키므로, ‘끝나면’이 자연스럽고 절차의 완료를 잘 드러냅니다.
- source_word: בַיּוֹם הַשְּׁמִינִי וָהָלְאָה
  english_pob_choice: from the eighth day onward
  chosen_korean: 여덟째 날부터는
  alternatives_korean:
  - 여덟째 날부터 계속
  - 여덟째 날 이후로
  lexicon: HALOT
  rationale: 시작점과 그 이후의 지속을 함께 담기 위해 ‘부터는’을 사용했습니다.
- source_word: יַעֲשׂוּ הַכֹּהֲנִים עַל הַמִּזְבֵּחַ
  english_pob_choice: the priests shall offer on the altar
  chosen_korean: 제사장들이 제단 위에서 … 드릴 것이며
  alternatives_korean:
  - 제사장들이 제단 위에서 … 바칠 것이며
  - 제사장들이 제단에서 … 드릴 것이며
  lexicon: HALOT
  rationale: 제의적 맥락에서 יַעֲשׂוּ는 단순한 ‘하다’보다 제물을 ‘드리다/바치다’가 더 직접적입니다. ‘제단 위에서’는 עַל הַמִּזְבֵּחַ의 자연스러운 한국어 표현입니다.
- source_word: עוֹלֹתֵיכֶם וְאֶת שַׁלְמֵיכֶם
  english_pob_choice: your burnt offerings and your peace offerings
  chosen_korean: 여러분의 번제와 화목제
  alternatives_korean:
  - 여러분의 번제와 평화제
  - 여러분의 번제와 교제제
  lexicon: HALOT
  rationale: עוֹלָה는 통상 ‘번제’이고, שְׁלָמִים은 POB의 본문 선택을 따라 ‘화목제’로 옮겼습니다. 각주 대안으로 ‘평화제/교제제’ 가능성을 남길 수 있습니다.
- source_word: וְרָצִאתִי אֶתְכֶם
  english_pob_choice: and I will accept you
  chosen_korean: 내가 여러분을 받아들이겠습니다
  alternatives_korean:
  - 내가 여러분을 기쁘게 여기겠습니다
  - 내가 여러분을 용납하겠습니다
  lexicon: HALOT
  rationale: 제물만이 아니라 백성 자체를 하나님이 수납하신다는 관계적 의미를 살리기 위해 ‘받아들이겠습니다’를 택했습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님께서 말씀하십니다
  alternatives_korean:
  - 주 하나님께서 선언하십니다
  - 주 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 한국어에서는 예언자적 선포 종결 공식으로 ‘말씀하십니다’가 자연스럽습니다. אֲדֹנָי יְהוִה는 합칭을 살려 ‘주 하나님’으로 옮겼습니다.
theological_decisions:
- issue: 화목제(שְׁלָמִים)의 한국어 표준명칭 선택
  chosen_reading: 화목제
  alternative_readings:
  - 평화제
  - 교제제
  rationale: 본절은 제의 용어의 정규 번역이 필요한 문맥이므로, 전통적으로 널리 쓰이고 제의적 기능을 가장 직접적으로 드러내는 ‘화목제’를 본문에 두었습니다. 영어 POB의 각주 취지에 맞춰 다른 가능성은 대안으로만 남깁니다.
  doctrine_reference: 제의 용어 일관성 및 문맥 우선 원칙
