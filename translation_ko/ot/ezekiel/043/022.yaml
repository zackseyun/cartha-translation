  source_fidelity: 수송아지로 옮긴 פָּר는 원문의 제의 동물인 성숙한 수소(bull)보다 어린 송아지를 가리키므로 정확하지 않습니다. 그 밖에 숫염소, 흠 없는, 속죄제, 제단을 정결하게 하다는 히브리어 제의 문맥을 충실히 반영합니다.
  naturalness: 문장은 현대 표준 한국어 합쇼체로 대체로 자연스럽습니다. 다만 비교절에서 ‘했던 것’이라고만 하면 정결 행위가 불필요하게 생략되어 다소 모호하므로, ‘제단을 정결하게 했던 것처럼’으로 밝혀 주는 편이 명료합니다.
  terminology: ‘숫염소’, ‘흠 없는’, ‘속죄제’, ‘정결하게 하다’는 적절한 제의 용어입니다. 각주에서 ‘정결제’를 대안으로 제시하여 חַטָּאת의 정결 기능을 보존한 것도 적절합니다.
  issues:
