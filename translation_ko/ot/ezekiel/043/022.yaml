    rationale: פָּר는 일반적으로 성숙한 수소, 곧 제의용 ‘수소’를 뜻합니다. ‘수송아지’는 어린 동물을 가리켜 원문의 동물 지정과 달라집니다.
  - severity: low
    issue: 비교절의 정결 행위가 ‘했던 것처럼’으로만 표현됨
    rationale: 문맥으로 추론할 수 있으나, 원문은 앞선 수소 제물로 제단을 정결하게 한 행위를 명시합니다. 동사를 반복하면 비교 대상이 분명해집니다.
  revised_text: 둘째 날에는 흠 없는 숫염소 한 마리를 속죄제로 바치고, 그들은 수소로 제단을 정결하게 했던 것처럼 제단을 정결하게 해야 합니다.
