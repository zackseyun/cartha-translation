  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בַ/יּוֹם֙ הַ/שֵּׁנִ֔י תַּקְרִ֛יב שְׂעִיר עִזִּ֥ים תָּמִ֖ים לְ/חַטָּ֑את וְ/חִטְּאוּ֙ אֶת הַ/מִּזְבֵּ֔חַ כַּ/אֲשֶׁ֥ר חִטְּא֖וּ בַּ/פָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/022.yaml
  text: And on the second day you shall present a male goat without blemish for a sin offering[a], and they shall purify the altar just as they purified it with the bull.
  footnotes:
  - marker: a
    text: Or 'for a purification offering.' The Hebrew חַטָּאת can denote the offering used to remove impurity as well as 'sin offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 둘째 날에는 흠 없는 숫염소 한 마리를 속죄제[a]로 바치고, 그들이 이전에 수송아지로 했던 것처럼 제단을 정결하게 해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제’로도 옮길 수 있습니다. 히브리어 חַטָּאת은 죄를 위한 제물뿐 아니라 부정을 제거하는 제물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  english_pob_choice: And on the second day
  chosen_korean: 둘째 날에는
  alternatives_korean:
  - 그리고 둘째 날에는
  - 둘째 날에
  lexicon: HALOT
  rationale: 히브리어의 순차적 시간 표현을 한국어에서 자연스럽게 옮기되, 앞 절과의 연속성은 문맥이 충분히 드러내므로 ‘그리고’를 생략했습니다.
- source_word: תַּקְרִיב שְׂעִיר עִזִּים תָּמִים
  english_pob_choice: you shall present a male goat without blemish
  chosen_korean: 흠 없는 숫염소 한 마리를 바치고
  alternatives_korean:
  - 흠 없는 수염소 한 마리를 바치고
  - 흠 없는 숫염소를 드리고
  lexicon: HALOT
  rationale: 제사 문맥의 תַּקְרִיב은 ‘바치다’가 합쇼체에서 가장 자연스럽고 공손한 제의적 표현입니다. שְׂעִיר עִזִּים은 ‘숫염소’로 간결하게 살렸고, תָּמִים은 제의 용례에 맞게 ‘흠 없는’으로 옮겼습니다.
- source_word: לְחַטָּאת
  english_pob_choice: for a sin offering
  chosen_korean: 속죄제
  alternatives_korean:
  - 죄제
  - 속죄제물
  lexicon: HALOT
  rationale: 히브리어 חַטָּאת은 제물의 기능을 가리키는 제의 용어이므로, 한국어 성경에서 널리 통용되는 ‘속죄제’를 택해 문맥의 제의성을 유지했습니다. 문맥상 ‘정결하게 하다’와 연결되지만, 명칭 자체는 제사 항목으로 남겨 두는 것이 적절합니다.
- source_word: וְחִטְּאוּ אֶת הַמִּזְבֵּחַ
  english_pob_choice: and they shall purify the altar
  chosen_korean: 그들이 … 제단을 정결하게 해야 합니다
  alternatives_korean:
  - 그들이 제단을 깨끗하게 해야 합니다
  - 그들이 제단을 정결케 해야 합니다
  lexicon: HALOT
  rationale: חִטְּאוּ는 제의적 ‘정결하게 하다/정화하다’의 뜻이므로 도덕적 ‘씻다’보다 ‘정결하게 하다’가 원문 기능을 더 정확히 드러냅니다. 제단을 대상으로 한 의례적 정결의 의미를 살리기 위해 ‘정결하게 해야 합니다’로 옮겼습니다.
- source_word: כַּאֲשֶׁר חִטְּאוּ בַּפָּר
  english_pob_choice: just as they purified it with the bull
  chosen_korean: 이전에 수송아지로 했던 것처럼
  alternatives_korean:
  - 수송아지로 정결하게 했던 것처럼
  - 수송아지를 가지고 정결하게 했던 것처럼
  lexicon: HALOT
  rationale: 비교절은 앞선 날의 동일한 제의 행위를 되풀이한다는 뜻이므로, 중복을 줄이면서도 ‘수송아지로’라는 도구적 의미를 살렸습니다. 문맥상 대상을 다시 지시하는 ‘그것’을 앞 절의 제단으로 자연스럽게 받습니다.
theological_decisions:
- issue: חַטָּאת과 חִטְּאוּ의 관계를 한국어에서 어떻게 살릴지
  chosen_reading: 제물 명칭은 ‘속죄제’로, 제단에 대한 동사는 ‘정결하게 하다’로 구분했습니다.
  alternative_readings:
  - 둘 다 ‘정결제’ 계열로 통일하기
  - 둘 다 ‘죄’ 계열로 통일하기
  rationale: 히브리어는 같은 어근을 공유하지만, 한국어에서는 제물 이름과 의례 행위를 동일 어휘로 처리하면 오히려 의미가 흐려집니다. 따라서 제의적 기능은 ‘속죄제’로, 행위는 ‘정결하게 하다’로 나누어 원문의 제의 신학을 보존했습니다.
  doctrine_reference: 레위기 제의어법 및 정결 규례 일반
