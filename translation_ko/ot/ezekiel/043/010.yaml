  text: אַתָּ֣ה בֶן אָדָ֗ם הַגֵּ֤ד אֶת בֵּֽית יִשְׂרָאֵל֙ אֶת הַ/בַּ֔יִת וְ/יִכָּלְמ֖וּ מֵ/עֲוֺנֽוֹתֵי/הֶ֑ם וּ/מָדְד֖וּ אֶת תָּכְנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/010.yaml
  text: As for you[a], son of man, declare the temple to the house of Israel, so that they may be ashamed of their iniquities[b]; and let them measure the plan.
  footnotes:
  - marker: a
    text: Or 'the house.' Here the Hebrew term refers to the sanctuary/temple in Ezekiel's vision.
    reason: lexical_alternative
  - marker: b
    text: Or 'the pattern' or 'the design.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너 사람아, 이 성전을 이스라엘 집에 알려라. 그들이 자기들의 죄악을 부끄러워하도록 하고, 그 설계를 살펴보게 하여라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘그 집’입니다. 이 환상 문맥에서는 성전 또는 성소를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘설계’는 ‘계획’, ‘형태’, 또는 ‘배치’로도 옮길 수 있습니다. ‘살펴보다’로 옮긴 동사는 직역하면 ‘측량하다’입니다.
    reason: lexical_alternative
