- from: 그대는, 인자야, 이스라엘 집에 성전을 알리라. 그러면 그들이 자기들의 죄악으로 인해 부끄러워할 것이며, 그 도면을 측량하게 하라.[a][b]
  to: 너 사람아, 이 성전을 이스라엘 집에 알려라. 그들이 자기들의 죄악을 부끄러워하도록 하고, 그 설계를 살펴보게 하여라.[a][b]
  rationale: 원문의 명령형과 목적절을 현대 한국어 합쇼체에 맞게 분명히 했습니다. 성전 환상의 건축적 맥락을 보존하면서, 한국어에서 어색한 ‘도면을 측량하다’를 피하여 설계를 면밀히 파악하게 한다는 뜻을 전달했습니다. 각주 표지도 본문에서 실제로 참조되는 어휘에 맞게 정리했습니다.
