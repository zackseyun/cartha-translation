id: EZK.43.10
reference: Ezekiel 43:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַתָּ֣ה בֶן אָדָ֗ם הַגֵּ֤ד אֶת בֵּֽית יִשְׂרָאֵל֙ אֶת הַ/בַּ֔יִת וְ/יִכָּלְמ֖וּ מֵ/עֲוֺנֽוֹתֵי/הֶ֑ם וּ/מָדְד֖וּ אֶת תָּכְנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/010.yaml
  text: As for you[a], son of man, declare the temple to the house of Israel, so that they may be ashamed of their iniquities[b]; and let them measure the plan.
  footnotes:
  - marker: a
    text: Or 'the house.' Here the Hebrew term refers to the sanctuary/temple in Ezekiel's vision.
    reason: lexical_alternative
  - marker: b
    text: Or 'the pattern' or 'the design.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그대는, 인자야, 이스라엘 집에 성전을 알리라. 그러면 그들이 자기들의 죄악으로 인해 부끄러워할 것이며, 그 도면을 측량하게 하라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘집’은 이 환상 문맥에서 성전/성소를 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘도면’은 본문의 건축적 배치, 형태, 설계를 포괄하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 인간이여
  lexicon: HALOT
  rationale: 에스겔서에서 반복되는 신적 호칭이므로, 관용적이면서도 본문의 문학적 연속성을 살리는 ‘인자’로 옮겼습니다.
- source_word: הַגֵּד
  english_pob_choice: declare
  chosen_korean: 알리라
  alternatives_korean:
  - 선포하라
  - 선언하라
  - 말하라
  lexicon: HALOT
  rationale: 예언적 명령의 성격을 살리되 한국어에서 지나치게 경직되지 않도록 ‘알리다’를 사용했습니다.
- source_word: הַבַּיִת
  english_pob_choice: the temple
  chosen_korean: 성전
  alternatives_korean:
  - 집
  - 그 집
  lexicon: HALOT
  rationale: 문자적으로는 ‘집’이지만 환상 문맥상 성소/성전 구조를 가리키므로, 현대 한국어에서 의미를 분명히 하는 ‘성전’이 적절합니다.
- source_word: תָּכְנִית
  english_pob_choice: the plan
  chosen_korean: 도면
  alternatives_korean:
  - 계획
  - 형태
  - 설계
  lexicon: HALOT
  rationale: 건축적 배치와 치수를 염두에 둔 용어이므로, 추상적 ‘계획’보다 측량과 잘 맞는 ‘도면’이 원문 의도를 더 직접적으로 드러냅니다.
theological_decisions:
- issue: ‘the house’의 한국어 대응
  chosen_reading: ‘성전’으로 번역했습니다.
  alternative_readings:
  - 집
  - 성막
  rationale: 에스겔 40–43장의 환상에서는 단순한 건물이 아니라 예루살렘 성전의 질서와 거룩함이 강조되므로, 독자가 즉시 참조 대상을 파악하도록 ‘성전’을 택했습니다.
  doctrine_reference: 번역 원칙 §1, §6
- issue: ‘부끄러워하다’와 ‘죄악’의 관계
  chosen_reading: ‘그들이 자기들의 죄악으로 인해 부끄러워할 것이며’로 옮겼습니다.
  alternative_readings:
  - 죄 때문에 부끄러워할 것이며
  - 죄악들을 부끄러워할 것이며
  rationale: 히브리어의 목적/결과 뉘앙스를 살리면서, 단순한 감정이 아니라 죄악 앞에서의 수치심이라는 예언적 반응을 드러내기 위해 이 표현을 유지했습니다.
  doctrine_reference: 번역 원칙 §1, §3
