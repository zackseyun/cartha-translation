review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘인 ‘인자’, ‘이스라엘 집’, ‘성전’, ‘죄악’, ‘도면’은 대체로 원문과 환상 문맥에 충실합니다. 그러나 명령형 הַגֵּד는 ‘알리라’보다 직접 명령인 ‘알려라’가 적절합니다. 또한 וְיִכָּלְמוּ는 앞선 명령의 목적을 나타내므로 ‘그러면 … 부끄러워할 것이며’보다 ‘그들이 … 부끄러워하도록’이 더 정확합니다. מֵעֲוֺנֹתֵיהֶם는 ‘죄악으로 인해’보다 자신의 죄악을 두고 수치를 느끼는 뜻을 자연스럽게 드러내는 ‘자기들의 죄악을 부끄러워하도록’이 적합합니다.
  naturalness: 현 초안의 ‘그대는, 인자야’는 현대 표준어 합쇼체 성경 문장으로 다소 부자연스럽고, 쉼표도 불필요합니다. ‘너 사람아’는 에스겔서의 반복 호칭을 현대적으로 자연스럽게 살립니다. ‘도면을 측량하게 하라’는 한국어에서 도면 자체를 재는 뜻으로 읽히기 쉬우므로, תָּכְנִית의 건축적 설계·배치라는 의미에는 ‘설계를 살펴보게 하여라’가 더 자연스럽습니다.
  terminology: ‘인자’는 전통적 표현이지만 현대 한국어에서 일반 명사 ‘인자’(어진 사람)와 혼동될 수 있고 호칭으로도 낯섭니다. 원문의 에스겔 특유 호칭을 의미상 명료하게 보존하는 ‘너 사람아’를 권합니다. ‘성전’과 ‘이스라엘 집’은 유지할 수 있습니다. ‘설계’는 תָּכְנִית의 계획·형태·배치 의미를 포괄하며, 필요한 대안은 각주로 제시합니다.
  issues:
  - severity: medium
    issue: 명령형을 평서형 어미로 번역함
    rationale: הַגֵּד는 에스겔에게 주어진 직접 명령입니다. ‘알리라’는 문맥상 명령으로 이해될 여지는 있으나 현대 합쇼체에서는 ‘알려라’가 더 분명하고 자연스럽습니다.
  - severity: medium
    issue: 목적절과 수치의 대상을 부정확하게 처리함
    rationale: וְיִכָּלְמוּ מֵעֲוֺנֹתֵיהֶם는 성전을 알리는 목적 또는 의도된 결과로서, 그들이 자기들의 죄악을 두고 부끄러워하게 되는 뜻입니다. ‘그러면 … 죄악으로 인해 부끄러워할 것이며’는 미래 서술과 인과관계를 앞세워 원문의 구문적 힘을 약화합니다.
  - severity: medium
    issue: ‘도면을 측량하다’가 한국어에서 부자연스럽고 의미를 좁힘
    rationale: וּמָדְדוּ אֶת־תָּכְנִית은 제시된 성전의 설계·형태를 자세히 재어 파악하라는 뜻으로 이해할 수 있습니다. ‘도면을 측량하다’는 종이 도면의 길이를 재는 듯한 어색한 표현입니다.
  - severity: low
    issue: ‘그대는, 인자야’의 호칭이 현대 표준어에서 어색함
    rationale: 합쇼체의 현대적 문장에서는 ‘너 사람아’가 자연스럽고, 에스겔에게 반복되는 호칭의 직접성도 보존합니다.
