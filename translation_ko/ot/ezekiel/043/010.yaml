  rationale: 문자적으로는 ‘집’이지만 환상 문맥상 성소/성전 구조를 가리키므로, 현대 한국어에서 의미를 분명히 하는 ‘성전’이 적절합니다.
- source_word: תָּכְנִית
  english_pob_choice: the plan
  chosen_korean: 도면
  alternatives_korean:
