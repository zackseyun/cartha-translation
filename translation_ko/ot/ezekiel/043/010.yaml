  - 성막
  rationale: 에스겔 40–43장의 환상에서는 단순한 건물이 아니라 예루살렘 성전의 질서와 거룩함이 강조되므로, 독자가 즉시 참조 대상을 파악하도록 ‘성전’을 택했습니다.
  doctrine_reference: 번역 원칙 §1, §6
- issue: ‘부끄러워하다’와 ‘죄악’의 관계
  chosen_reading: ‘그들이 자기들의 죄악으로 인해 부끄러워할 것이며’로 옮겼습니다.
  alternative_readings:
  - 죄 때문에 부끄러워할 것이며
  - 죄악들을 부끄러워할 것이며
  rationale: 히브리어의 목적/결과 뉘앙스를 살리면서, 단순한 감정이 아니라 죄악 앞에서의 수치심이라는 예언적 반응을 드러내기 위해 이 표현을 유지했습니다.
  doctrine_reference: 번역 원칙 §1, §3
