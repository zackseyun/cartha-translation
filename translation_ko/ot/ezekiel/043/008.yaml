  text: בְּ/תִתָּ֨/ם סִפָּ֜/ם אֶת סִפִּ֗/י וּ/מְזֽוּזָתָ/ם֙ אֵ֣צֶל מְזוּזָתִ֔/י וְ/הַ/קִּ֖יר בֵּינִ֣/י וּ/בֵֽינֵי/הֶ֑ם וְ/טִמְּא֣וּ אֶת שֵׁ֣ם קָדְשִׁ֗/י בְּ/תֽוֹעֲבוֹתָ/ם֙ אֲשֶׁ֣ר עָשׂ֔וּ וָ/אֲכַ֥ל אֹתָ֖/ם בְּ/אַפִּֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/008.yaml
  text: When they set their threshold beside my threshold and their doorposts beside my doorposts[a], with only the wall between me and them, they defiled my holy name by the abominations that they committed[c][b]; so I consumed them in my anger.
  footnotes:
  - marker: a
    text: Or 'their sill beside my sill.' The Hebrew term can denote a threshold or sill.
    reason: lexical_alternative
  - marker: b
    text: Or 'their doorframes beside my doorframes.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'I ate them'; here the Hebrew idiom means 'I consumed/devoured them' in judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 자기 문지방을 내 문지방 곁에, 자기 문설주를 내 문설주 곁에 두어[a] — 나와 그들 사이에는 벽만 있었는데도 — 자기들이 행한 가증한 일로 내 거룩한 이름을 더럽혔습니다[c][b]. 그래서 내가 내 분노로 그들을 삼켜 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 문지방을 내 문지방 곁에’, 곧 히브리어는 문지방이나 섬돌을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 문설주를 내 문설주 곁에’.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로는 ‘내가 그들을 먹었다’입니다. 여기서는 심판으로 ‘삼키다/소멸하다’는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִתָּם
  english_pob_choice: When they set
  chosen_korean: 그들이 ... 두어
  alternatives_korean:
  - 그들이 ... 놓아
  - 그들이 ... 세워
  lexicon: WLC/HALOT
  rationale: ב + 부정사구가 시간·상황절을 이루므로, 한국어에서는 자연스러운 동사 연결로 처리해 ‘... 두어’로 그 상황을 표현했습니다.
- source_word: סִפָּם / סִפִּי
  english_pob_choice: their threshold / my threshold
  chosen_korean: 자기 문지방 / 내 문지방
  alternatives_korean:
  - 자기 섬돌 / 내 섬돌
  - 자기 턱 / 내 턱
  lexicon: WLC/HALOT
  rationale: 문맥상 문이나 성소의 경계를 가리키는 वास्तу적 표현이므로, 한국어의 ‘문지방’이 가장 직접적이고 이해하기 쉽습니다.
- source_word: מְזוּזָתָם / מְזוּזָתִי
  english_pob_choice: their doorposts / my doorposts
  chosen_korean: 자기 문설주 / 내 문설주
  alternatives_korean:
  - 자기 문기둥 / 내 문기둥
  - 자기 문틀 / 내 문틀
  lexicon: WLC/HALOT
  rationale: מְזוּזָה는 문설주, 곧 문 옆기둥을 뜻하므로 전통 교회어보다 직역성이 높은 ‘문설주’를 택했습니다.
- source_word: וְהַקִּיר בֵּינִי וּבֵינֵיהֶם
  english_pob_choice: with the wall between me and them
  chosen_korean: 나와 그들 사이에는 벽만 있었는데도
  alternatives_korean:
  - 나와 그들 사이에 벽이 있었는데도
  - 나와 그들 사이에는 벽이 있었을 뿐인데도
  lexicon: WLC/HALOT
  rationale: 벽이 유일한 분리였다는 뉘앙스를 살리기 위해 ‘벽만’과 ‘-는데도’를 사용해 상황의 역설과 긴박함을 드러냈습니다.
- source_word: וְטִמְּאוּ אֶת שֵׁם קָדְשִׁי
  english_pob_choice: they defiled my holy name
  chosen_korean: 내 거룩한 이름을 더럽혔습니다
  alternatives_korean:
  - 내 거룩한 이름을 속되게 했습니다
  - 내 거룩한 이름을 부정하게 했습니다
  lexicon: WLC/HALOT
  rationale: טמא의 성결 문맥상 ‘더럽히다’가 가장 직접적이며, שֵׁם קָדְשִׁי는 ‘거룩한 이름’으로 옮겨 하나님의 명예와 임재의 신성함을 함께 보존했습니다.
- source_word: וָאֲכַל אֹתָם
  english_pob_choice: so I consumed them
  chosen_korean: 그래서 내가 내 분노로 그들을 삼켜 버렸습니다
  alternatives_korean:
  - 그래서 내가 그들을 소비했습니다
  - 그래서 내가 그들을 멸했습니다
  lexicon: WLC/HALOT
  rationale: אכל은 문자적으로 ‘먹다’이지만 심판 문맥에서는 ‘삼키다/삼켜 버리다’라는 형상적 의미가 자연스럽고, 한국어에서도 그 격렬한 심판 이미지를 살릴 수 있습니다.
theological_decisions:
- issue: 하나님의 심판을 나타내는 먹다/삼키다 은유
  chosen_reading: ‘그들을 삼켜 버렸습니다’로 번역해 심판의 상징적 폭력성과 결말성을 유지했습니다.
  alternative_readings:
  - 그들을 멸했습니다
  - 그들을 없애 버렸습니다
  rationale: 히브리어 동사는 문자적 식사를 뜻하지만, 문맥에서는 심판의 은유이므로 너무 평이한 파괴 동사로 낮추지 않고 원문의 강한 이미지를 살렸습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; source metaphor preserved without crude literalism.'
