translation:
  language: ko
  text: 그 피의 일부를 가져다가 제단의 네 뿔과 그 층대[a]의 네 모퉁이와 둘레의 경계에 바르십시오. 그렇게 하여 제단을 정결하게 하고 제단을 위하여 속죄를 행하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘둘레 단.’ 히브리어 용어는 에스겔의 환상에서 제단 둘레의 구조물 또는 단을 가리킵니다.
    reason: lexical_alternative
