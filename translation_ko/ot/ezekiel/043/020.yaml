  yaml_path: translation/ot/ezekiel/043/020.yaml
  text: And you shall take some of its blood and put it on its four horns[a], on the four corners of the ledge, and on the border all around; so you shall purify it and make atonement for it.
  footnotes:
  - marker: a
    text: Or 'the settle.' The Hebrew term refers to the altar's surrounding structural ledge/platform in Ezekiel's vision.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 피의 일부를 가져다가 그 네 뿔[a]과 그 층대의 네 모퉁이와 사방의 경계에 바르고, 그것을 정결하게 하며 그것을 위하여 속죄하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘층대.’ 히브리어 용어는 에스겔의 환상에서 제단 둘레의 구조물/단을 가리킵니다.
    reason: lexical_alternative
