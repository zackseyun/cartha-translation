  text: You shall present them before Yahweh[a], and the priests shall throw salt on them and offer them up as a burnt offering to Yahweh.
  footnotes:
  - marker: a
    text: Or 'cast salt on them.' The Hebrew verb is literally 'throw/cast,' not the more specific 'sprinkle.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 그것들을 야훼 앞에 가져오십시오. 그러면 제사장들이 그것들 위에 소금을 뿌리고, 그것들을 야훼께 번제물로 드릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들 위에 소금을 던지다’입니다. 여기서는 제의 관용에 맞는 자연스러운 한국어로 ‘뿌리다’라고 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּם
  english_pob_choice: You shall present them
  chosen_korean: 그것들을 ... 가져오십시오
  alternatives_korean:
  - 그것들을 ... 바치십시오
  - 그것들을 ... 제시하십시오
  lexicon: HALOT
  rationale: 히필 קרב의 핵심 의미는 ‘가까이 가져오다/앞에 내놓다’이므로, 제의 맥락에서 자연스러운 ‘가져오십시오’로 옮겨 동작을 분명하게 살렸습니다.
- source_word: וְהִשְׁלִיכוּ ... מֶלַח
  english_pob_choice: shall throw salt on them
  chosen_korean: 소금을 뿌리고
  alternatives_korean:
  - 소금을 던지고
  - 소금을 끼얹고
  lexicon: HALOT
  rationale: 히브리어 동사는 문자적으로 ‘던지다/던져 넣다’이지만, 제의 절차에서 한국어로는 ‘뿌리다’가 가장 자연스럽고, 지나치게 기술적이지 않으면서도 행위의 방향성을 유지합니다.
- source_word: עֹלָה
  english_pob_choice: a burnt offering
  chosen_korean: 번제물
  alternatives_korean:
  - 번제
  - 완전번제물
  lexicon: HALOT
  rationale: עֹלָה는 제의 용어로 전부 태워 드리는 제사를 가리키므로, 현대 한국어 성경에서 익숙하면서도 명사로 자연스러운 ‘번제물’을 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본 프로젝트의 원칙에 따라 하나님의 고유명사는 호칭인 ‘주님’으로 대체하지 않고, 음역형 ‘야훼’로 일관되게 옮겼습니다.
theological_decisions:
- issue: 제의 행위의 순서와 동사 구분
  chosen_reading: ‘가져오십시오’(제단/성소 앞에 제시)와 ‘번제물로 드리다’(상향 제의)를 분리해, 본문의 두 단계 행위를 구분했습니다.
  alternative_readings:
  - 모두 ‘바치십시오’로 통합
  - ‘제사드리다’로 일반화
  rationale: 히브리어는 먼저 제물들을 야훼 앞에 두게 한 뒤, 제사장들이 소금을 뿌리고 그것들을 번제로 올리는 두 동작을 구분합니다. 한국어에서도 그 차이를 유지하는 것이 본문의 절차성을 더 정확히 드러냅니다.
  doctrine_reference: 제의 본문 해석 원칙
