id: EZK.43.26
reference: Ezekiel 43:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֗ים יְכַפְּרוּ֙ אֶת הַ/מִּזְבֵּ֔חַ וְ/טִֽהֲר֖וּ אֹת֑/וֹ וּ/מִלְא֖וּ יד/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/026.yaml
  text: For seven days they shall make atonement for the altar and cleanse it[a], and they shall consecrate it.
  footnotes:
  - marker: a
    text: Hebrew literally, 'fill its hand,' a cultic idiom meaning to install, consecrate, or ordain for service.
    reason: lexical_alternative
translation:
  language: ko
  text: 칠 일 동안 그들은 제단을 위해 속죄하고 그것을 깨끗하게 하며, 그것을 성별해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 손을 채우다’이며, 제의적 관용구로서 설치하다, 성별하다, 임직하다의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  english_pob_choice: For seven days
  chosen_korean: 칠 일 동안
  alternatives_korean:
  - 일곱 날 동안
  - 칠 일간
  lexicon: HALOT
  rationale: 지속 기간을 나타내는 עֶרך/기간 표현이므로 한국어에서는 자연스럽게 ‘칠 일 동안’으로 옮겨 시간 범위를 분명히 했습니다.
- source_word: יְכַפְּרוּ
  english_pob_choice: they shall make atonement
  chosen_korean: 속죄하고
  alternatives_korean:
  - 속죄할 것이며
  - 죄를 속하고
  lexicon: HALOT
  rationale: 제의적 문맥에서 כפר는 단순한 정결보다 속죄 행위를 가리키므로, POB의 ‘make atonement’를 따라 ‘속죄하다’를 사용했습니다.
- source_word: וְטִהֲרוּ אֹתוֹ
  english_pob_choice: and cleanse it
  chosen_korean: 그것을 깨끗하게 하며
  alternatives_korean:
  - 그것을 정결하게 하며
  - 그것을 정화하며
  lexicon: HALOT
  rationale: טהר의 의례적 의미를 살리되, 현대 한국어에서 가장 자연스럽고 즉시 이해되는 표현으로 ‘깨끗하게 하다’를 택했습니다.
- source_word: וּמִלְאוּ ידוֹ
  english_pob_choice: and they shall consecrate it
  chosen_korean: 그것을 성별해야 합니다
  alternatives_korean:
  - 그것을 봉헌해야 합니다
  - 그것을 임직해야 합니다
  - 그것을 기명해야 합니다
  lexicon: HALOT
  rationale: 직역하면 ‘그 손을 채우다’이지만, 여기서는 제단을 예배용으로 설치·헌납하는 관용구이므로 한국어 성경에서 통용되는 제의적 동사 ‘성별하다’로 의미를 전달했습니다.
theological_decisions:
- issue: 제단에 대한 וּמִלְאוּ ידוֹ의 처리
  chosen_reading: ‘성별하다’로 옮겨 제단을 예배와 봉사에 구별하여 세우는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘봉헌하다’로 번역할 수 있습니다.
  - ‘임직하다’는 사람에게 더 자연스러워 이 절에서는 덜 적절합니다.
  - ‘그 손을 채우다’는 직역이지만 한국어 의미가 불분명합니다.
  rationale: 히브리어 관용구는 본문에서 제단의 설치/헌납을 가리키므로, 직역의 불투명함을 피하면서도 제의적 구별의 의미를 유지하는 번역이 필요합니다.
  doctrine_reference: 번역 원칙 §1, §3, §6
