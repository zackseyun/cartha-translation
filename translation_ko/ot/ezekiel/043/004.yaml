translation:
  language: ko
  text: 야훼의 영광이 동쪽을 향한 문을 통해 그 집으로 들어왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그 집’. 이 환상 문맥에서는 성전 건물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘동쪽을 향한 문을 통해’라고 옮길 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 존귀
  - 야훼의 영광스러움
  lexicon: HALOT
  rationale: כָּבוֹד는 단순한 ‘존귀’보다 하나님의 현현된 영광을 가리키므로, POB의 ‘glory’에 맞춰 ‘영광’으로 옮겼습니다. יְהוָה는 본문에 직접 있으므로 평행한 표준 표기인 ‘야훼’를 사용했습니다.
- source_word: בָּא אֶל הַבָּיִת
  english_pob_choice: came into the house
  chosen_korean: 그 집으로 들어왔습니다
  alternatives_korean:
  - 그 집에 왔습니다
  - 성전으로 들어왔습니다
  lexicon: HALOT
  rationale: בוא의 기본 뜻을 살려 ‘들어왔습니다’로 옮기고, הַבָּיִת는 직역상 ‘집’이지만 이 환상 문맥에서는 성전 건물을 가리킵니다. 다만 본문 어휘를 보존하기 위해 기본어는 ‘집’으로 유지했습니다.
- source_word: דֶּרֶךְ שַׁעַר ... דֶּרֶךְ הַקָּדִים
  english_pob_choice: by way of the gate that faces east
  chosen_korean: 동쪽을 향한 문을 통해
  alternatives_korean:
  - 동쪽을 마주 보는 문을 통해
  - 동쪽 문을 지나
  lexicon: HALOT
  rationale: דֶּרֶךְ는 경로/통로를 나타내므로 ‘통해’가 자연스럽고, שַׁעַר는 건축 문맥에서 ‘문’으로 옮겼습니다. פָּנָיו דֶּרֶךְ הַקָּדִים는 ‘동쪽을 향한’이라는 방향성을 간결하게 반영했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주’
  - ‘여호와’
  rationale: 본문의 신명기적 표기 יְהוָה를 음역하여, 전통적 대체어보다 원문 고유명을 보존하는 POB 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘the house’의 지시 대상
  chosen_reading: ‘그 집’은 환상 속 성전 건물을 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘성전’
  - ‘궁전’
  rationale: 영어 POB 각주와 같이 문맥상 성전 건물을 뜻하지만, 원문 בַּיִת의 어휘를 그대로 살려 독자가 본문-환상 구조를 따라가도록 했습니다.
  doctrine_reference: POB audit footnote a
