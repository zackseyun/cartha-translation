source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה אֶל הַ/כֹּהֲנִ֣ים הַ/לְוִיִּ֡ם אֲשֶׁ֣ר הֵם֩ מִ/זֶּ֨רַע צָד֜וֹק הַ/קְּרֹבִ֣ים אֵלַ֗/י נְאֻ֛ם אֲדֹנָ֥/י יְהוִ֖ה לְ/שָֽׁרְתֵ֑/נִי פַּ֥ר בֶּן בָּקָ֖ר לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/019.yaml
  text: And you shall give to the Levitical priests who are from the offspring of Zadok[a], who draw near to me to minister to me, declares the Lord GOD, a bull from the herd for a sin offering.
  footnotes:
  - marker: a
    text: Or more idiomatically, 'a bull from the herd' or 'a young bull.' The Hebrew reads literally, 'a bull, a son of the herd.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 사독의 자손인 레위 제사장들, 곧 나에게 나아와 나를 섬기는 그들에게 속죄제물로 소 떼에서 난 수송아지 한 마리를 주어야 합니다. 주 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘젊은 황소 한 마리’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘황소, 소 떼의 아들’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  english_pob_choice: the Levitical priests
  chosen_korean: 레위 제사장들
  alternatives_korean:
  - 레위 사람 제사장들
  - 레위계 제사장들
  lexicon: HALOT
  rationale: 히브리어는 제사장직과 레위 계통을 함께 밝히므로, 한국어에서는 두 요소를 자연스럽게 살린 ‘레위 제사장들’로 옮겼습니다.
- source_word: מִזֶּרַע צָדוֹק
  english_pob_choice: who are from the offspring of Zadok
  chosen_korean: 사독의 자손 가운데 있는
  alternatives_korean:
  - 사독의 후손인
  - 사독의 씨에서 난
  lexicon: HALOT
  rationale: מִזֶּרַע는 혈통적 출신을 가리키므로, ‘자손’으로 옮기되 소속감을 드러내는 ‘가운데 있는’을 더해 관계를 분명히 했습니다.
- source_word: הַקְּרֹבִים אֵלַי לְשָׁרְתֵנִי
  english_pob_choice: who draw near to me to minister to me
  chosen_korean: 내게 가까이 와서 나를 섬기는
  alternatives_korean:
  - 내게 나아와 나를 섬기는
  - 내게 가까이 와서 내게 시중드는
  lexicon: HALOT
  rationale: 제사장 문맥의 קרב과 שׁרת은 예배적 접근과 봉사를 함께 담으므로, ‘가까이 와서 … 섬기는’으로 두 동사의 흐름을 살렸습니다.
- source_word: פַּר בֶּן בָּקָר
  english_pob_choice: a bull from the herd
  chosen_korean: 한 수송아지, 곧 번식한 무리에서 난 한 수송아지
  alternatives_korean:
  - 한 수송아지
  - 한 소 떼에서 난 수송아지
  lexicon: HALOT
  rationale: 영문 POB의 최종 판단과 히브리어의 직역성을 함께 반영해, 본문에는 자연스러운 ‘수송아지’를 두고 뒤에 원문 구조를 풀이적으로 보존했습니다.
- source_word: לְחַטָּאת
  english_pob_choice: for a sin offering
  chosen_korean: 죄를 위한 속죄제물로
  alternatives_korean:
  - 속죄제물로
  - 죄를 위한 제물로
  lexicon: HALOT
  rationale: 제의 문맥에서 חַטָּאת는 단순한 ‘죄’가 아니라 제사 종류를 가리키므로, 한국어 제사 용어인 ‘속죄제물’을 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Lord GOD
  chosen_korean: 주 하나님 여호와
  alternatives_korean:
  - 주 하나님 야훼
  - 주 여호와 하나님
  lexicon: HALOT
  rationale: 본문은 אֲדֹנָי יְהוִה의 결합형이어서 한국어 관용에 맞게 ‘주 하나님 여호와’로 옮겼습니다. 본문 내부의 별도 야훼 표기는 이 구절의 기존 교회용례를 과도하게 흔들 수 있어 채택하지 않았습니다.
theological_decisions:
- issue: 이스라엘 제사장 봉사 문맥의 동사 선택
  chosen_reading: ‘나를 섬기는’으로 옮겨 제의적 봉사와 예배적 섬김을 함께 드러냈습니다.
  alternative_readings:
  - 나를 섬기도록
  - 나를 봉사하도록
  rationale: שׁרת는 일반적 ‘봉사’보다 성소 맥락의 공식적 봉사를 가리키므로, 독자가 제의적 의미를 놓치지 않도록 했습니다.
  doctrine_reference: 성소/제사 용어의 문맥적 보존
