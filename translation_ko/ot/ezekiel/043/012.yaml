  text: 이것이 그 집의 율법입니다. 산 꼭대기에 있는 그 사방의 모든 지역은 지극히 거룩합니다.[a][b] 보십시오, 이것이 그 집의 율법입니다.
  philosophy: optimal-equivalence
  footnotes:
