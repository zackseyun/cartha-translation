revisions:
- from: 이것이 집의 율법입니다. 산 꼭대기에, 그 주변의 모든 경계가 지극히 거룩합니다. 보십시오, 이것이 집의 율법입니다.[a][b]
  to: 이것이 그 집의 율법입니다. 산 꼭대기에 있는 그 사방의 모든 지역은 지극히 거룩합니다.[a][b] 보십시오, 이것이 그 집의 율법입니다.
  rationale: The revision clarifies that the whole area around the house on the mountain is declared supremely holy, retains the repeated declaration and the force of הִנֵּה as “보십시오,” and relocates both lexical alternatives to the phrase they explain. It avoids treating “holy of holies” as a technical name for the inner sanctuary in this context.
