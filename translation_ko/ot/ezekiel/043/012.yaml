base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/012.yaml
  text: 'This is the law of the house: on the top of the mountain[a], all its surrounding territory is most holy. Behold[b], this is the law of the house.'
  footnotes:
  - marker: a
    text: Or, 'all its border all around is most holy.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'holy of holies'; that is, 'most holy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 집의 율법입니다. 산 꼭대기에, 그 주변의 모든 경계가 지극히 거룩합니다. 보십시오, 이것이 집의 율법입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그 주변의 모든 경계가 지극히 거룩합니다.'
    reason: alternative_reading
  - marker: b
    text: 히브리어 '지성소'; 곧 '지극히 거룩한'.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת הַבָּיִת
  english_pob_choice: the law of the house
  chosen_korean: 집의 율법
  alternatives_korean:
  - 집의 가르침
  - 성전의 율법
  lexicon: HALOT
  rationale: תּוֹרָה는 여기서 규범/규정의 뜻으로 쓰이므로 '율법'이 가장 직접적이며, בַּיִת는 '집'을 살려 원문의 구조를 보존했습니다.
- source_word: עַל רֹאשׁ הָהָר
  english_pob_choice: on the top of the mountain
  chosen_korean: 산 꼭대기에
  alternatives_korean:
  - 산의 정상에
  - 산 위에
  lexicon: HALOT
  rationale: רֹאשׁ의 지형적 용법을 한국어의 자연스러운 표현인 '꼭대기'로 옮겨, 산의 꼭대기라는 공간 감각을 유지했습니다.
- source_word: כָּל גְּבֻלוֹ סָבִיב סָבִיב
  english_pob_choice: all its surrounding territory
  chosen_korean: 그 주변의 모든 경계
  alternatives_korean:
  - 그 둘레의 모든 영역
  - 사방의 모든 경계
  lexicon: HALOT
  rationale: גְּבוּל은 '경계/경계선'의 뜻이 기본이므로 '경계'로 옮기되, סָבִיב סָבִיב의 포괄성을 '주변의'와 '모든'으로 반영했습니다.
- source_word: קֹדֶשׁ קָדָשִׁים
  english_pob_choice: most holy
  chosen_korean: 지극히 거룩합니다
  alternatives_korean:
  - 가장 거룩합니다
  - 지성소입니다
  lexicon: HALOT
  rationale: 이 결합은 관용적으로 '가장 거룩한/지극히 거룩한'의 최상급을 뜻하므로, 여기서는 공간의 성격을 설명하는 형용사로 번역했습니다.
theological_decisions:
- issue: 반복되는 선언 구조와 '보라'의 담화 기능
  chosen_reading: 두 번째 '이것이 집의 율법입니다'를 그대로 살리고, הִנֵּה는 '보십시오'로 옮겨 결론을 강조했습니다.
  alternative_readings:
  - '''보라'''
  - '''참으로'''
  rationale: 본문은 처음 진술을 다시 요약하며 강조하므로, 반복을 생략하지 않고 담화 표지를 살리는 것이 원문의 수사 효과를 보존합니다.
  doctrine_reference: 성전/거룩 개념의 본문 수사 보존
