  - marker: b
    text: 히브리어 ‘거룩함 중의 거룩함’; 곧 ‘지극히 거룩한’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת הַבָּיִת
  english_pob_choice: the law of the house
