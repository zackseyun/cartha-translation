base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/007.yaml
  text: And he said to me[a], “Son of man, this is the place of my throne and the place of the soles of my feet, where I will dwell among the children of Israel forever. And the house of Israel shall no longer defile my holy name, neither they nor their kings, by their prostitution and by the corpses of their kings on their high places.”
  footnotes:
  - marker: a
    text: Or possibly, 'and by the corpses of their kings in their death.' The Hebrew final word is traditionally read 'their high places,' which fits the context of cultic defilement, but some understand it in relation to 'their death.'
    reason: alternative_reading
translation:
  language: ko
  text: 그가 내게 말씀하셨습니다. “인자야, 이곳은 내 왕좌가 있는 곳이며 내 발바닥이 닿는 곳입니다. 내가 이스라엘 자손 가운데서 영원히 거할 곳입니다. 이스라엘 족속은 다시는, 곧 그들과 그들의 왕들은 그들의 음행과 그들의 왕들의 시체로 내 거룩한 이름을 더럽히지 아니할 것입니다. 그 시체는 그들의 산당[a]에 있었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 죽음 가운데서’. 히브리어의 마지막 단어는 전통적으로 ‘그들의 산당’으로 읽히며, 이는 제의적 더러움이라는 문맥에 잘 맞습니다. 그러나 일부는 이를 ‘그들의 죽음’과 관련지어 이해합니다.
    reason: alternative_reading
