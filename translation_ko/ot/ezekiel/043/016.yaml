translation:
  language: ko
  text: 제단의 화덕은 길이가 열두 규빗이고 너비도 열두 규빗이었으며, 네 변이 모두 네모났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶל אַרְבַּעַת רְבָעָיו는 문자적으로는 '그의 네 사분면/구역을 향하여'이며, '네 모퉁이에서'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''규빗''은 앞뒤 문맥의 제단 측정에서 보충한 단위입니다.'
    reason: cross_reference
lexical_decisions:
- source_word: הָאֲרִיאֵל
  english_pob_choice: the altar hearth
  chosen_korean: 제단의 화덕
