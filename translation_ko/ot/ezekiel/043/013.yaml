  text: וְ/אֵ֨לֶּה מִדּ֤וֹת הַ/מִּזְבֵּ֨חַ֙ בָּֽ/אַמּ֔וֹת אַמָּ֥ה אַמָּ֖ה וָ/טֹ֑פַח וְ/חֵ֨יק הָ/אַמָּ֜ה וְ/אַמָּה רֹ֗חַב וּ/גְבוּלָ֨/הּ אֶל שְׂפָתָ֤/הּ סָבִיב֙ זֶ֣רֶת הָ/אֶחָ֔ד וְ/זֶ֖ה גַּ֥ב הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/013.yaml
  text: 'And these are the measurements of the altar in cubits (the cubit being a cubit and a handbreadth): its gutter shall be one cubit[a], and one cubit its width, and its border on its rim all around shall be one span[c][b]. And this shall be the base of the altar.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''a cubit, a cubit and a handbreadth,'' i.e., the longer cubit used for these measurements.'
    reason: cultural_note
  - marker: b
    text: Or 'trench' or 'base' for 'gutter' (Hebrew חֵיק); the exact architectural feature is uncertain.
    reason: lexical_alternative
  - marker: c
    text: Or 'this is the height/back-structure of the altar' for 'this shall be the base of the altar' (Hebrew גַּב).
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이것이 제단의 크기입니다. 규빗으로 재되며 — 한 규빗은 규빗에 한 뼘을 더한 길이입니다 — 그 홈은 한 규빗이고, 그 너비도 한 규빗이며, 그 둘레의 가장자리는 사방으로 한 뼘입니다. 이것이 제단의 바닥입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “한 규빗, 곧 한 규빗과 한 뼘”이라는 설명형 표현을 사용합니다. 즉 여기서는 더 긴 규빗을 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어 חֵיק은 정확한 건축 부위를 단정하기 어려워 ‘홈’, ‘도랑’, ‘기초’ 등으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 גַּב은 문맥에 따라 ‘바닥’, ‘높은 부분’, ‘뒤쪽 구조’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹת
  english_pob_choice: measurements
  chosen_korean: 크기
  alternatives_korean:
  - 측량
  - 치수
  lexicon: HALOT
  rationale: 건축적 맥락에서 실제로 전달되는 것은 제단의 수치적 규격이므로, 현대 한국어에서는 ‘크기’가 가장 자연스럽고 읽기 쉽습니다.
- source_word: בָּאַמּוֹת אַמָּה אַמָּה וָטֹפַח
  english_pob_choice: in cubits (the cubit being a cubit and a handbreadth)
  chosen_korean: 규빗으로 재되며 — 한 규빗은 규빗에 한 뼘을 더한 길이입니다
  alternatives_korean:
  - 규빗으로(한 규빗은 규빗과 한 뼘입니다)
  - 규빗으로(곧 규빗 한 개가 규빗과 한 뼘의 길이입니다)
  lexicon: HALOT
  rationale: 영문 POB의 설명을 따라 여기서는 ‘긴 규빗’이라는 해석을 직접 덧붙이지 않고, 히브리어의 설명적 표현을 한국어로 옮겨 측정 단위의 성격을 드러냈습니다.
- source_word: חֵיק
  english_pob_choice: gutter
  chosen_korean: 홈
  alternatives_korean:
  - 도랑
  - 기초
  - 오목한 부분
  lexicon: HALOT
  rationale: 이 표현은 정확한 구조물이 확정되지 않는 건축 용어이므로, 특정 해석을 강하게 고정하지 않으면서도 오목하게 파인 부분을 자연스럽게 나타내는 ‘홈’을 택했습니다.
- source_word: גְּבוּלָהּ ... שְׂפָתָהּ
  english_pob_choice: its border on its rim
  chosen_korean: 그 둘레의 가장자리는
  alternatives_korean:
  - 그 가장자리 둘레는
  - 그 테두리는
  lexicon: HALOT
  rationale: ‘border’와 ‘rim’의 두 겹 구조를 한국어에서 과도하게 반복하지 않으면서, 제단 상부의 둘레와 끝부분을 모두 보존하는 표현으로 옮겼습니다.
- source_word: זֶרֶת
  english_pob_choice: span
  chosen_korean: 한 뼘
  alternatives_korean:
  - 한 장
  - 한 자
  lexicon: HALOT
  rationale: 한국어 성경에서 통용되는 작은 길이 단위 중 ‘한 뼘’이 가장 직관적이며, 원문의 짧은 손길이 단위를 자연스럽게 전달합니다.
- source_word: גַּב
  english_pob_choice: base
  chosen_korean: 바닥
  alternatives_korean:
  - 기초
  - 받침
  - 높은 부분
  lexicon: HALOT
  rationale: 영문 POB의 ‘base’는 이 문맥에서 제단의 아래쪽 기반 구조를 가리키므로, 한국어로는 설명을 과도하게 붙이지 않는 ‘바닥’이 가장 간결합니다.
theological_decisions:
- issue: 희귀한 제단 건축 용어의 해석 범위
  chosen_reading: 구조를 단정하지 않고 측정값을 분명하게 전달하는 데 초점을 두었습니다.
  alternative_readings:
  - חֵיק을 ‘도랑’으로 더 구체화
  - גַּב을 ‘높이’ 또는 ‘등판’으로 옮김
  rationale: 이 절은 교리 진술이 아니라 성전 환상 안의 치수 설명이므로, 본문이 확정하지 않는 세부 구조를 한국어 번역이 앞질러 규정하지 않도록 했습니다.
  doctrine_reference: 번역 원칙 §§1, 3, 5
