lexical_decisions:
- source_word: וַיּוֹלִכֵנִי
  english_pob_choice: Then he brought me
  chosen_korean: 나를 데리고 가셨습니다
  alternatives_korean:
  - 나를 이끄셨습니다
  - 나를 데려가셨습니다
  lexicon: HALOT
  rationale: הִפְעִיל형 동사로 ‘가게 하다, 데리고 가다’의 뜻이므로, 공간 이동을 자연스럽게 드러내는 ‘데리고 가셨습니다’를 택했습니다.
- source_word: אֶל הַשַּׁעַר
  english_pob_choice: to the gate
  chosen_korean: 그 문으로
  alternatives_korean:
  - 그 문에
  - 그 성문으로
  lexicon: HALOT
  rationale: 방향 표지 אֶל은 한국어에서 목적지 표지 ‘-으로’로 옮기는 것이 자연스럽고, הַשַּׁעַר은 성문 맥락을 과도하게 덧붙이지 않고 ‘문’으로 옮겼습니다.
- source_word: שַׁעַר
  english_pob_choice: the gate
  chosen_korean: 그 문
  alternatives_korean:
  - 문
  - 성문
  lexicon: HALOT
  rationale: 히브리어는 ‘문, 그 문’으로 반복하여 구체성과 강조를 더합니다. 이를 ‘그 문으로, 곧 그 문으로’의 반복 구조 대신 ‘그 문으로, 곧 동쪽을 향한 그 문으로’로 압축하되, 반복의 지시성을 유지했습니다.
- source_word: פֹּנֶה דֶּרֶךְ הַקָּדִים
  english_pob_choice: the gate that faces east
  chosen_korean: 동쪽을 향한
  alternatives_korean:
  - 동쪽을 바라보는
  - 동쪽으로 향한
  lexicon: HALOT
  rationale: פֹּנֶה는 방향을 ‘향하다/마주하다’의 의미이므로, 현재형 성격을 살리는 관형사형 ‘향한’이 적절합니다. דֶּרֶךְ הַקָּדִים의 방향 표현은 한국어에서는 ‘동쪽을 향한’으로 자연스럽게 옮겼습니다.
