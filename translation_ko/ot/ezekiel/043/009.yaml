  - 그러므로 이제
  lexicon: HALOT
  rationale: 대화의 전환을 여는 시간 표지로, 현대 한국어에서 자연스럽고 간결한 "이제"가 적절합니다.
- source_word: יְרַחֲקוּ
  english_pob_choice: let them put far
  chosen_korean: 멀리 치워야 합니다
  alternatives_korean:
  - 멀리 두어야 합니다
  - 멀리 제거해야 합니다
  - 멀리 치러야 합니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리면서 한국어에서 자연스러운 결과 표현으로 옮겼습니다. 대상에서 떨어뜨려 없애는 뜻을 "멀리 치우다"로 전달합니다.
- source_word: זְנוּתָם
  english_pob_choice: their prostitution
  chosen_korean: 자기들의 음행
  alternatives_korean:
  - 자기들의 포르노그래피
  - 자기들의 창녀짓
  - 자기들의 음행
  lexicon: HALOT
  rationale: 예언서의 은유적 표현을 너무 해석하지 않으면서도 현대 독자가 이해할 수 있게 옮겼습니다. "음행"이 언약적 불신실함의 함의를 비교적 직접적으로 드러냅니다.
- source_word: פִגְרֵי מַלְכֵיהֶם
  english_pob_choice: the corpses of their kings
  chosen_korean: 자기들의 왕들의 시체
  alternatives_korean:
  - 그들의 왕들의 시체
  - 그들의 왕들의 주검
  - 그들의 왕들의 사체
  lexicon: HALOT
  rationale: פגר의 구체적 의미를 살려 "시체"로 직역했습니다. POB의 콘크리트한 이미지를 유지하되 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: וְשָׁכַנְתִּי
  english_pob_choice: and I will dwell
  chosen_korean: 그러면 내가 … 거하겠습니다
  alternatives_korean:
  - 내가 … 살겠습니다
  - 내가 … 머무르겠습니다
  - 내가 … 거하겠습니다
  lexicon: HALOT
  rationale: שכן의 언약적 임재를 드러내는 표준적인 성경 한국어인 "거하다"를 유지했습니다. 문맥상 조건-결과 관계를 드러내기 위해 앞절을 "그러면"으로 연결했습니다.
- source_word: בְתוֹכָם
  english_pob_choice: in their midst
  chosen_korean: 그들 가운데
  alternatives_korean:
  - 그들 한가운데
  - 그들 가운데서
  - 그들 중심에
  lexicon: HALOT
  rationale: 공간적·공동체적 의미를 자연스럽게 전달하는 표현으로 옮겼습니다. "가운데"가 원문의 임재 이미지를 충분히 보존합니다.
theological_decisions:
- issue: זְנוּתָם의 은유 보존 여부
  chosen_reading: '"음행"으로 옮겨 언약적 불신실함의 은유를 남겼습니다.'
  alternative_readings:
  - 직접 "우상숭배"로 해석
  - '"성적 부도덕"으로 완화'
  rationale: 원문은 단순한 성윤리 문제가 아니라 언약 파기의 예언적 은유를 사용합니다. 따라서 해석을 본문 안에 과도하게 주입하지 않으면서도 은유의 강도를 유지하는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 왕들의 시체를 본문에 그대로 둘지 여부
  chosen_reading: 구체적이고 다소 충격적인 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 왕실 무덤 기념물로 풀이
  - 왕들의 유해로 완화
  rationale: 정확한 역사적 대상은 논의되지만, 히브리어는 실제적인 시체 이미지를 사용합니다. 본문은 그 구체성을 유지하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3
