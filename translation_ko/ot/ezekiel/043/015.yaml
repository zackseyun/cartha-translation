translation:
  language: ko
  text: 제단의 화로는 네 규빗이며,[a] 그 화로에서 위로는 네 뿔이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 하르엘(הַרְאֵל)과 아리엘(אֲרִאֵיל)은 이 문맥에서 정확한 의미가 논쟁되는 제단 용어입니다. 음역하여 ‘하르엘’과 ‘아리엘’로 옮기거나, 문맥에 따라 제단의 화로 또는 상부 구조로 이해하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְאֵל / אֲרִאֵיל
  english_pob_choice: the altar hearth / from the altar hearth
  chosen_korean: 제단의 화덕
  alternatives_korean:
  - 제단의 화구
  - 제단의 불자리
  - 아리엘
  lexicon: HALOT
  rationale: 문맥이 제단의 치수 설명이므로 이 용어들은 고유명사보다 제단 위의 불을 받는 상부 구조를 가리키는 것으로 보고, 기능을 드러내는 ‘화덕’으로 옮겼습니다.
