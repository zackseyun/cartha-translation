    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְאֵל / אֲרִאֵיל
  english_pob_choice: the altar hearth / from the altar hearth
  chosen_korean: 제단의 화덕
  alternatives_korean:
  - 제단의 화구
  - 제단의 불자리
  - 아리엘
  lexicon: HALOT
  rationale: 문맥이 제단의 치수 설명이므로 이 용어들은 고유명사보다 제단 위의 불을 받는 상부 구조를 가리키는 것으로 보고, 기능을 드러내는 ‘화덕’으로 옮겼습니다.
- source_word: אַרְבַּע אַמּוֹת
  english_pob_choice: four cubits
  chosen_korean: 네 규빗
  alternatives_korean:
  - 네 팔꿈치
  - 네 자
  lexicon: HALOT
  rationale: 고대 길이 단위를 유지해 원문의 측정 표현을 보존했습니다.
- source_word: וּלְמַעְלָה
  english_pob_choice: and upward
  chosen_korean: 위로는
  alternatives_korean:
  - 그리고 위로
  - 위쪽으로
  lexicon: HALOT
  rationale: 화덕에서 위쪽으로 이어지는 수직 방향을 자연스럽게 한국어 어순에 맞춰 표현했습니다.
- source_word: הַקְּרָנוֹת
  english_pob_choice: the four horns
  chosen_korean: 네 뿔
  alternatives_korean:
  - 네 뿔들
  - 그 네 뿔
  lexicon: HALOT
  rationale: 제단의 돌출부를 가리키는 일반적 용례를 살려 ‘뿔’로 옮겼고, 히브리어의 수사와 부합하도록 ‘네’로 처리했습니다.
theological_decisions:
- issue: 해석상 어려운 altar term의 처리
  chosen_reading: 고유명사화하지 않고 제단 구조로 읽히는 범위 안에서 ‘제단의 화덕’으로 번역했습니다.
  alternative_readings:
  - ‘아리엘’로 음역
  - ‘하나님의 화덕’처럼 어원 중심으로 번역
  rationale: 본문은 제단의 구체적 치수를 말하므로, 독자가 구조 설명으로 이해하도록 하는 것이 원문의 의도에 가장 가깝습니다. 동시에 어원적 긴장은 어휘 결정에서 보존했습니다.
  doctrine_reference: 성전 환상 본문의 문맥 우선 해석
