id: EZK.21.29
reference: Ezekiel 21:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ יַ֗עַן הַזְכַּרְ/כֶם֙ עֲוֺ֣נְ/כֶ֔ם בְּ/הִגָּל֣וֹת פִּשְׁעֵי/כֶ֗ם לְ/הֵֽרָאוֹת֙ חַטֹּ֣אותֵי/כֶ֔ם בְּ/כֹ֖ל עֲלִילֽוֹתֵי/כֶ֑ם יַ֚עַן הִזָּ֣כֶרְ/כֶ֔ם בַּ/כַּ֖ף תִּתָּפֵֽשׂוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/029.yaml
  text: 'Therefore thus says the Lord GOD: Because you have brought your guilt to remembrance by uncovering your transgressions[a], so that your sins are seen in all your deeds, because you have come to remembrance[b], you will be seized by the hand.'
  footnotes:
  - marker: a
    text: Or 'you have caused your guilt to be remembered.' The Hebrew uses repeated forms of 'remember' (זכר) for rhetorical effect throughout the verse.
    reason: lexical_alternative
  - marker: b
    text: Or 'you will be captured in the hand,' that is, taken into an enemy's grasp.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. 너희가 너희의 반역을 드러내고 너희의 모든 행위에서 너희의 죄가 보이게 하여 너희의 죄과를 기억나게 하였으므로[a], 너희가 기억되었으니, 너희는 손에 붙들릴 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희가 너희의 죄과를 기억되게 하였다.’ 히브리어는 이 절 전체에서 זכר(기억하다) 계열의 말을 반복하여 수사적 효과를 냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희는 손아귀에 붙잡힐 것이다.’ 곧 적의 손아귀에 잡혀 가는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: BDB/HALOT
  rationale: compound divine title를 한국어에서 중복 없이 살리기 위해 '주'와 고유명 '야훼'를 함께 두었습니다. POB의 야훼 표기 원칙을 따르되, '주 하나님'처럼 일반화된 표현보다 מקור의 이름성을 더 직접적으로 드러냅니다.
- source_word: הַזְכַּרְכֶם עֲוֺנְכֶם
  english_pob_choice: you have brought your guilt to remembrance
  chosen_korean: 너희가 너희의 죄악을 드러내어 너희의 죄과를 기억나게 하였고
  alternatives_korean:
  - 너희가 너희의 죄책을 기억나게 하였고
  - 너희가 너희의 죄악을 떠올리게 하였고
  lexicon: HALOT
  rationale: 히필 זכר의 사역성을 살려 단순히 '기억하다'가 아니라 '기억나게 하다'로 옮겼습니다. 목적어 עָוֹן은 문맥상 '죄과/죄악'의 뉘앙스를 함께 가지므로 둘을 나란히 배치해 반복되는 기억-노출 어감을 보존했습니다.
- source_word: בְּהִגָּלוֹת פִּשְׁעֵיכֶם לְהֵרָאוֹת חַטֹּאותֵיכֶם בְּכֹל עֲלִילוֹתֵיכֶם
  english_pob_choice: by uncovering your transgressions, so that your sins are seen in all your deeds
  chosen_korean: 너희의 죄들이 너희의 모든 행위 가운데 드러나게 되었으며
  alternatives_korean:
  - 너희의 범죄가 너희의 모든 행위 속에서 보이게 되었으며
  - 너희의 반역이 너희의 모든 행동 가운데 나타나게 되었으며
  lexicon: HALOT
  rationale: 노출과 가시화의 중첩을 한국어의 한 문장 안에 압축했습니다. פשעים/חטאות/עלילות의 삼중 구조를 모두 직역하면 부자연스러워지므로, '드러나게 되다'로 결과를 묶고 '모든 행위'로 행동 전반의 폭을 살렸습니다.
- source_word: יַעַן הִזָּכֶרְכֶם
  english_pob_choice: because you have come to remembrance
  chosen_korean: 너희가 기억되었으니
  alternatives_korean:
  - 너희가 떠올려졌으니
  - 너희가 기억난 것이므로
  lexicon: HALOT
  rationale: 뒤의 수동/재귀적 זכר를 한국어에서 자연스럽게 '기억되다'로 옮겨 앞의 '기억나게 하다'와 반복어를 대응시켰습니다. 심판 앞에서 그들이 하나님의 기억 속에 들어온다는 긴장을 유지합니다.
- source_word: בַּכַּף תִּתָּפֵשׂוּ
  english_pob_choice: you will be seized by the hand
  chosen_korean: 너희는 손에 붙들릴 것입니다
  alternatives_korean:
  - 너희는 손으로 붙들릴 것입니다
  - 너희는 손에 잡힐 것입니다
  lexicon: HALOT
  rationale: כַּף의 손/손바닥 이미지를 한국어 관용과 직결되게 살리면서도, נתפשׂ의 포획·체포 뉘앙스를 '붙들리다'로 옮겼습니다. '잡히다'보다 덜 가볍고, 적의 손에 사로잡히는 장면을 더 분명하게 드러냅니다.
theological_decisions:
- issue: 여호와/야훼의 표기와 compound title 번역
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 본문은 יְהוִה를 포함하므로 고유명성을 지우지 않고 야훼로 옮겼습니다. '주'를 함께 둠으로써 אֲדֹנָי의 주권 호칭도 동시에 보존합니다.
  doctrine_reference: 'POB Contested Terms: יהוה/YHWH → 야훼'
