  to: 그러므로 주 야훼께서 이렇게 말씀하십니다. 너희가 너희의 반역을 드러내고 너희의 모든 행위에서 너희의 죄가 보이게 하여 너희의 죄과를 기억나게 하였으므로[a], 너희가 기억되었으니, 너희는 손에 붙들릴 것입니다.[b]
