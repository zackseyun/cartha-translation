base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/009.yaml
  text: Because I will cut off from you both the righteous and the wicked[b][a], therefore my sword will go out from its sheath against all flesh from south to north.
  footnotes:
  - marker: a
    text: Or 'I have cut off'; the Hebrew perfect may be rendered as a completed action or as a future/certain action in prophetic context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'all flesh,' a common expression for all mortal people.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너에게서 의인과 악인을 모두 끊어 버릴 것이므로, 내 칼이 칼집에서 나와 남쪽에서 북쪽까지 모든 육체를 향할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 완료형은 문맥에 따라 이미 일어난 일로도, 예언적 확정 미래로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모든 육체’는 모든 필멸의 인간을 가리키는 흔한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  english_pob_choice: Because
  chosen_korean: ~이므로
  alternatives_korean:
  - 왜냐하면
  - ~기 때문에
  lexicon: HALOT
  rationale: 원문의 인과 관계를 자연스럽게 살리면서, 예언적 진술의 앞뒤 연결을 현대 한국어로 매끄럽게 표현합니다.
- source_word: הִכְרַתִּי
  english_pob_choice: I will cut off
  chosen_korean: 끊어 버릴 것입니다
  alternatives_korean:
  - 잘라 버릴 것입니다
  - 끊을 것입니다
  - 멸할 것입니다
  lexicon: HALOT
  rationale: כרת의 핵심 이미지는 ‘끊다/잘라 내다’이므로, 단순한 ‘멸하다’보다 구체성을 살린 ‘끊어 버리다’를 택했습니다. 예언적 확정 미래로 읽는 POB의 판단도 반영했습니다.
- source_word: צַדִּיק וְרָשָׁע
  english_pob_choice: both the righteous and the wicked
  chosen_korean: 의인과 악인을 모두
  alternatives_korean:
  - 의인과 악인
  - 의로운 사람과 악한 사람을 모두
  lexicon: HALOT
  rationale: 대조쌍이 포괄성을 드러내는 표현이므로, POB의 ‘both’를 살려 심판의 적용 범위가 양쪽 모두에 미침을 분명히 했습니다.
- source_word: מִתַּעְרָהּ
  english_pob_choice: from its sheath
  chosen_korean: 칼집에서
  alternatives_korean:
  - 칼집 밖으로
  - 그 칼집에서
  lexicon: HALOT
  rationale: חֶרֶב(칼)과 짝을 이루는 표준적 도구명사로 ‘칼집’이 가장 자연스럽고, 원문의 구체적 이미지도 충분히 보존합니다.
- source_word: אֶל כָּל בָּשָׂר
  english_pob_choice: against all flesh
  chosen_korean: 모든 육체를 향할 것입니다
  alternatives_korean:
  - 모든 사람을 향할 것입니다
  - 모든 인간을 향할 것입니다
  - 온갖 육체를 향할 것입니다
  lexicon: HALOT
  rationale: 직역적 표현인 ‘모든 육체’를 유지해 히브리어 관용구의 엄숙함과 보편성을 살렸습니다. ‘향하다’는 문맥상 적대적 표적을 자연스럽게 드러냅니다.
- source_word: מִנֶּגֶב צָפוֹן
  english_pob_choice: from south to north
  chosen_korean: 남쪽에서 북쪽까지
  alternatives_korean:
  - 네겝에서 북쪽까지
  - 남에서 북까지
  lexicon: HALOT
  rationale: 지역명보다 방향 대구가 강조된다고 보아, 한국어로 가장 분명한 범위 표현인 ‘남쪽에서 북쪽까지’를 택했습니다.
theological_decisions:
- issue: 의인과 악인을 함께 끊어 버린다는 진술의 긴장
  chosen_reading: 현세적·역사적 심판이 구분 없이 미친다는 문맥적 긴장을 그대로 두고 번역합니다.
  alternative_readings:
  - 의인을 겉으로만 의인인 자로 완화해 읽기
  - 궁극적 정죄가 아니라 일시적 심판으로만 축소하기
  rationale: 원문은 심판이 땅 안에서 광범위하게 미친다는 사실을 말할 뿐, 여기서 신학적으로 완화하지 않습니다. 번역도 그 긴장을 보존해야 합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
