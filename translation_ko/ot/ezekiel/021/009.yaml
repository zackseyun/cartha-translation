translation:
  language: ko
  text: 내가 너에게서 의인과 악인을 모두 끊어 버릴 것이므로[a], 내 칼이 칼집에서 나와 남쪽에서 북쪽까지 모든 육체를[b] 치려고 나올 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 완료형은 문맥에 따라 이미 일어난 일로도, 예언적 확정 미래로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모든 육체’는 모든 필멸의 인간을 가리키는 흔한 표현입니다.
    reason: lexical_alternative
