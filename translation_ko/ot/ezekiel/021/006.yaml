  terminology: יְהוָה는 프로젝트 방침과 영어 POB를 따라 ‘야훼’로 유지하는 것이 적절합니다. דְבַר는 예언 공식에 알맞게 ‘말씀’으로 옮겼습니다. 각주는 신명 표기의 대안을 설명하되, 영어 감사 기록과 일치하도록 전통적 대체 번역인 ‘주’를 중심으로 제시합니다.
