  source_fidelity: 원문의 정형적 계시 공식(‘야훼의 말씀이 내게 임하여, 말씀하시기를’)은 전반적으로 반영되어 있습니다. 그러나 ‘말씀이 … 말씀하셨습니다’는 ‘말씀’이 직접 발화한 것처럼 읽혀 주어와 발화 주체의 관계가 한국어에서 부자연스럽습니다. 인용을 도입하는 לֵאמֹר의 기능도 더 분명히 드러낼 필요가 있습니다.
