  alternative_readings:
  - '"여호와의 말씀이…"'
  - '"주님의 말씀이…"'
  rationale: 원문은 יהוה의 말씀과 예언자에게 임하는 계시를 정형적으로 결합합니다. "야훼"를 유지하면 신명과 계시 주체를 분명히 보존할 수 있습니다.
