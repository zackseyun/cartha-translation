id: EZK.21.32
reference: Ezekiel 21:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַוָּ֥ה עַוָּ֖ה עַוָּ֣ה אֲשִׂימֶ֑/נָּה גַּם זֹאת֙ לֹ֣א הָיָ֔ה עַד בֹּ֛א אֲשֶׁר ל֥/וֹ הַ/מִּשְׁפָּ֖ט וּ/נְתַתִּֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/032.yaml
  text: A ruin[a], a ruin, a ruin—I will make it. This also shall not be, until he comes whose right it is[b], and I will give it to him.
  footnotes:
  - marker: a
    text: Or, 'Overthrown, overthrown, overthrown, I will make it.' The Hebrew repeats a noun three times for emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''Whose right it is'' may also be rendered ''to whom the judgment belongs'' or ''to whom it rightfully belongs.'' Many interpreters see an allusion to Genesis 49:10 and thus a messianic reference.'
    reason: alternative_reading
translation:
  language: ko
  text: 파멸, 파멸, 파멸! 내가 그것을 그렇게 되게 하겠습니다. 이것도 권리가 그에게 있는 이가 올 때까지는 존재하지 않을 것입니다. 내가 그것을 그에게 주겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뒤엎음, 뒤엎음, 뒤엎음! 내가 그것을 그렇게 되게 하겠습니다.’ 히브리어는 명사를 세 번 반복하여 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘권리가 그에게 있는 이’는 ‘판결이 그에게 속한 이’ 또는 ‘그것이 정당하게 그에게 속한 이’로도 옮길 수 있습니다. 많은 해석자들은 창세기 49:10을 떠올리며 이를 메시아적 언급으로 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַוָּ֥ה עַוָּ֖ה עַוָּ֣ה
  english_pob_choice: A ruin, a ruin, a ruin
  chosen_korean: 멸망이다, 멸망이다, 멸망이다
  alternatives_korean:
  - 폐허다, 폐허다, 폐허다
  - 무너짐이다, 무너짐이다, 무너짐이다
  lexicon: HALOT
  rationale: 삼중 반복의 강조를 살리면서, 단순한 상태 선언으로 들리게 하여 예언적 파괴 선포의 힘을 유지했습니다.
- source_word: אֲשִׂימֶנָּה
  english_pob_choice: I will make it
  chosen_korean: 내가 그것을 만들겠습니다
  alternatives_korean:
  - 내가 그것을 이루겠습니다
  - 내가 그것을 세우겠습니다
  lexicon: HALOT
  rationale: 동사 שׂים의 기본 의미를 따라 ‘만들다/두다’의 직접성을 살렸고, 대상은 문맥상 왕권 질서의 붕괴로 이해되므로 ‘그것을’로 받았습니다.
- source_word: אֲשֶׁר ל֥וֹ הַ/מִּשְׁפָּ֖ט
  english_pob_choice: whose right it is
  chosen_korean: 그에게는 판결권이 있으니
  alternatives_korean:
  - 그의 권리가 있으니
  - 그에게 속한 심판이 있으니
  - 그가 마땅히 받을 권리가 있으니
  lexicon: HALOT
  rationale: מִשְׁפָּט의 의미 범위 가운데 이 본문에서는 ‘판결/권리’의 법적 자격이 핵심이므로, 통치 자격을 드러내는 ‘판결권’으로 옮겼습니다.
- source_word: וּ/נְתַתִּֽי/וֹ
  english_pob_choice: and I will give it to him
  chosen_korean: 내가 그것을 그에게 주겠습니다
  alternatives_korean:
  - 내가 그것을 그에게 넘기겠습니다
  - 내가 그것을 그에게 맡기겠습니다
  lexicon: HALOT
  rationale: 문맥상 뒤집힌 왕권/통치의 이전을 가리키므로, 과도한 해석을 피하면서도 자연스러운 ‘주다’로 처리했습니다.
theological_decisions:
- issue: ‘그에게는 판결권이 있으니’의 메시아적 함의
  chosen_reading: 주된 본문은 특정 인물을 이름으로 밝히지 않고, 합법적·정당한 통치권의 귀속을 열린 형태로 유지했습니다.
  alternative_readings:
  - 메시아적 왕에 대한 직접 지칭
  - 가까운 역사적 계승자에 대한 언급
  rationale: 원문은 이름을 제시하지 않으므로, 메시아적 연관 가능성은 열어 두되 본문 자체가 그 결론을 미리 확정하지 않도록 했습니다.
  doctrine_reference: 예언 본문의 해석적 긴장 보존
- issue: 반복어의 감탄적 효과
  chosen_reading: ‘멸망이다, 멸망이다, 멸망이다’로 두어 단순 중복보다 선포의 절박함을 드러냈습니다.
  alternative_readings:
  - ‘폐허다, 폐허다, 폐허다’
  - ‘무너짐이다, 무너짐이다, 무너짐이다’
  rationale: 히브리어의 삼중 반복은 단순 정보 전달이 아니라 심판 선언의 강도를 높이므로, 한국어에서도 문장 리듬을 살렸습니다.
  doctrine_reference: 예언 수사의 강조 유지
