  source_fidelity: 핵심 문제는 אֲשֶׁר לוֹ הַמִּשְׁפָּט을 ‘그에게는 판결권이 있으니’로 옮겨, 관계절을 인과절로 바꾸고 מִשְׁפָּט의 문맥상 ‘권리/정당한 권원’을 ‘판결권’으로 좁힌 점입니다. 원문은 ‘권리가 그에게 있는 이’가 올 때까지라는 열린 표현입니다. 또한 לֹא הָיָה는 이 문맥에서 ‘존재하지 않을 것입니다’가 ‘이루어지지 않을 것입니다’보다 가깝습니다.
  naturalness: ‘내가 그것을 만들겠습니다’는 한국어에서 무엇을 어떻게 만든다는 뜻인지 부자연스럽게 비어 있습니다. 반복 선포 뒤에서는 ‘그렇게 되게 하겠습니다’가 지시 대상의 अस्पষ্ট성을 보존하면서 자연스럽습니다. 관계절을 ‘권리가 그에게 있는 이’로 처리하면 현대 한국어 문장으로도 명료합니다.
  terminology: מִשְׁפָּט은 여기서 통치와 관련된 법적 권리 또는 정당한 권원을 가리킬 수 있으므로 ‘권리’로 번역하고, 각주에서 ‘판결/심판이 그에게 속한 이’라는 가능한 대안을 제시합니다. 본문에서 메시아적 신원을 확정하지 않습니다.
