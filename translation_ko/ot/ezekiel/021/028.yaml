  text: וְ/הָיָ֨ה לָ/הֶ֤ם כ/קסום שָׁוְא֙ בְּ/עֵ֣ינֵי/הֶ֔ם שְׁבֻעֵ֥י שְׁבֻע֖וֹת לָ/הֶ֑ם וְ/הֽוּא מַזְכִּ֥יר עָוֺ֖ן לְ/הִתָּפֵֽשׂ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/028.yaml
  text: And it will be to them like a false divination in their eyes; they have sworn sworn oaths to them[a], but he brings guilt to remembrance, so that they may be captured.
  footnotes:
  - marker: a
    text: 'Hebrew: ''sworn oaths to them'' or ''oaths upon oaths for them.'' The phrase is difficult; the main text understands it as referring to binding solemn oaths that they nevertheless disregard.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게는 그것이 그들의 눈에 거짓 점괘처럼 될 것입니다. 그들에게는 맹세한 맹세들이 있으나[a], 그는 죄악을 기억나게 하여 그들이 붙잡히게 하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그들에게 맹세한 맹세들’ 또는 ‘그들을 위한 맹세들 위에 맹세들’입니다. 원문은 압축되어 있어, 여기서는 엄숙하고 구속력 있는 맹세를 가리키는 것으로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כקסום שוא
  english_pob_choice: like a false divination
  chosen_korean: 거짓 점괘처럼
  alternatives_korean:
  - 헛된 점괘처럼
  - 거짓된 점복처럼
  - 빈 점괘처럼
  lexicon: HALOT
  rationale: קסום은 점괘·점복의 뜻이고 שוא는 거짓됨/헛됨을 더하므로, 현대 한국어에서 자연스럽고 직설적인 ‘거짓 점괘’로 옮겼습니다.
- source_word: בעיניהם
  english_pob_choice: in their eyes
  chosen_korean: 그들의 눈에
  alternatives_korean:
  - 그들 보기에
  - 그들의 시각에는
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려, 그들이 그렇게 평가하는 관점을 드러냈습니다.
- source_word: שבעי שבעות להם
  english_pob_choice: they have sworn sworn oaths to them
  chosen_korean: 그들에게는 맹세한 맹세들이 있으나
  alternatives_korean:
  - 그들에게 맹세한 맹세들이 있으나
  - 그들에게는 엄숙한 맹세들이 있으나
  - 그들에게는 맹세 위에 맹세가 있으나
  lexicon: HALOT
  rationale: 중복된 ‘맹세’ 구조를 가능한 한 보존해 원문의 압축성과 중첩을 살렸고, 관계상 절의 대조를 분명히 했습니다.
- source_word: מזכיר עון
  english_pob_choice: brings guilt to remembrance
  chosen_korean: 죄악을 기억나게 하여
  alternatives_korean:
  - 죄책을 기억나게 하여
  - 죄악을 상기시켜
  - 죄를 기억나게 하여
  lexicon: HALOT
  rationale: עון은 문맥상 단순한 죄보다 법정적·도덕적 책임을 띤 ‘죄악’에 가깝기 때문에, ‘기억나게 하다’로 심판적 회상을 보존했습니다.
theological_decisions:
- issue: 마지막 결과절의 주체와 수동성
  chosen_reading: ‘그들이 붙잡히게 하십니다’로 옮겨, 결과는 분명히 드러내되 히브리어 수동적 결과 의미를 유지했습니다.
  alternative_readings:
  - ‘그들이 붙잡히도록 하십니다’
  - ‘그들이 사로잡히게 하십니다’
  rationale: לְהִתָּפֵשׂ는 결과/목적의 부정사이며 군사적 포획의 의미가 강합니다. 한국어에서는 자연스러운 수동 결과로 표현하되, 행위의 필연성을 약화시키지 않았습니다.
  doctrine_reference: 예언 심판의 필연성 및 하나님의 주권적 심판 집행
