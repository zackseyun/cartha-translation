translation:
  language: ko
  text: 그들이 보기에 그것은 헛된 점괘처럼 보일 것입니다. 그들에게 맹세들을 한 자들이 있지만[a], 그는 죄악을 상기시켜 그들이 사로잡히게 할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그들에게 맹세들을 맹세한 자들’입니다. 이 구절은 압축되어 있고 해석이 어렵습니다. ‘그들에게 맹세한 자들’로 이해할 수도 있고, ‘그들을 위한 맹세 위에 맹세들’로 이해할 수도 있습니다.
    reason: lexical_alternative
