theological_decisions:
- issue: 마지막 결과절의 주체와 수동성
  chosen_reading: ‘그들이 붙잡히게 하십니다’로 옮겨, 결과는 분명히 드러내되 히브리어 수동적 결과 의미를 유지했습니다.
  alternative_readings:
  - ‘그들이 붙잡히도록 하십니다’
  - ‘그들이 사로잡히게 하십니다’
  rationale: לְהִתָּפֵשׂ는 결과/목적의 부정사이며 군사적 포획의 의미가 강합니다. 한국어에서는 자연스러운 수동 결과로 표현하되, 행위의 필연성을 약화시키지 않았습니다.
  doctrine_reference: 예언 심판의 필연성 및 하나님의 주권적 심판 집행
