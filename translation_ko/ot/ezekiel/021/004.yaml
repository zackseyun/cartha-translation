translation:
  language: ko
  text: 그러므로 모든 육체가 내가, 야훼가 그것을 불붙였음을 볼 것입니다. 그것은 꺼지지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 육체’는 관용적으로 ‘모든 사람들’의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ / כָּל בָּשָׂר
  english_pob_choice: will see / all flesh
  chosen_korean: 모든 육체가 … 볼 것입니다
  alternatives_korean:
  - 모든 사람이 … 볼 것입니다
  - 모든 사람이 … 알 것입니다
  lexicon: HALOT
  rationale: ‘כָּל בָּשָׂר’의 직역인 ‘모든 육체’를 살리면서, 예언문맥의 보편적 인식을 자연스럽게 표현했습니다. 영어 POB의 ‘all flesh’와 같은 어법을 유지해 본문의 예언적 어조를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 본문의 신명기적 고유명사를 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. ‘주님’은 호칭으로는 자연스럽지만, 여기서는 신적 이름 자체를 드러내는 것이 더 적절합니다.
- source_word: בִּעַרְתִּי/הָ
  english_pob_choice: have kindled it
  chosen_korean: 그것을 불붙였음
  alternatives_korean:
  - 그것을 점화했음
  - 그것을 불태웠음
  lexicon: HALOT
  rationale: בער의 ‘불붙이다/불태우다’ 의미를 따라, 이미 문맥에 있는 불·칼 이미지에 맞게 ‘불붙였음’으로 옮겼습니다. ‘불태웠음’은 소멸의 뉘앙스가 더 강해 문맥보다 좁을 수 있습니다.
- source_word: לֹא תִּכְבֶּה
  english_pob_choice: it will not be quenched
  chosen_korean: 꺼지지 않을 것입니다
  alternatives_korean:
  - 식지 않을 것입니다
  - 소멸되지 않을 것입니다
  lexicon: HALOT
  rationale: 불의 지속을 가리키는 동사를 한국어에서 가장 자연스럽게 살려 ‘꺼지지 않을 것입니다’로 옮겼습니다. 이는 ‘quenched’의 소화·진압 의미를 직접 반영합니다.
theological_decisions:
- issue: 야훼의 직접 발화와 인용부의 주어 강조
  chosen_reading: ‘내가, 야훼가’로 옮겨 주어를 분명히 드러냈습니다.
  alternative_readings:
  - ‘내가 야훼가’
  - ‘내가, 주께서’
  rationale: 히브리어의 ‘나는, 야훼’라는 자기지시를 한국어에서 자연스럽게 보존하기 위해 삽입적 쉼표를 두었습니다. 이는 선언의 강도와 신적 주체성을 함께 드러냅니다.
  doctrine_reference: Source-driven divine self-identification
- issue: ‘all flesh’의 범위
  chosen_reading: ‘모든 육체’로 직역해 예언적 보편성을 유지했습니다.
  alternative_readings:
  - ‘모든 사람’
  - ‘모든 인간’
  rationale: 이 표현은 단순한 집합명칭이 아니라 심판의 보편적 목격을 강조하는 성경적 관용구입니다. 따라서 완화된 번역보다 직역이 본문 효과를 더 잘 보존합니다.
  doctrine_reference: Biblical idiom preservation
