source:
  edition: WLC
  text: בִּֽ/ימִינ֞/וֹ הָיָ֣ה הַ/קֶּ֣סֶם יְרוּשָׁלִַ֗ם לָ/שׂ֤וּם כָּרִים֙ לִ/פְתֹּ֤חַ פֶּה֙ בְּ/רֶ֔צַח לְ/הָרִ֥ים ק֖וֹל בִּ/תְרוּעָ֑ה לָ/שׂ֤וּם כָּרִים֙ עַל שְׁעָרִ֔ים לִ/שְׁפֹּ֥ךְ סֹלְלָ֖ה לִ/בְנ֥וֹת דָּיֵֽק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/027.yaml
  text: 'In his right hand was the divination for Jerusalem: to set battering rams[a], to open the mouth with slaughter, to raise the voice with a battle cry, to set battering rams against the gates, to heap up a siege ramp[b], to build a siege wall.'
  footnotes:
  - marker: a
    text: Or 'to open the mouth for slaughter,' possibly referring to the shouted command or cry that accompanies the attack.
    reason: lexical_alternative
  - marker: b
    text: Or 'to build a bulwark' or 'siege tower'; the Hebrew term refers generally to siegeworks.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 오른손에는 예루살렘을 향한 점괘가 있었습니다. 곧 공성추를 배치하고, 살육을 외치려고 입을 열고[a], 전투 함성으로 소리를 높이고, 성문들을 향해 공성추를 들이대고, 공성 토루를 쌓고, 포위벽을 세우라는 것이었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살육을 위해 입을 열고’ 또는 ‘살육과 함께 입을 열고’로 옮길 수 있습니다. 히브리어 표현은 공격 때 내는 명령이나 함성을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘포위둑’ 또는 ‘공성탑’으로 옮길 수 있습니다. 히브리어는 일반적인 공성 시설을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימִינוֹ / In his right hand
  english_pob_choice: In his right hand
  chosen_korean: 그의 오른손에는
  alternatives_korean:
  - 그의 오른편에는
  - 그의 오른손 안에는
  lexicon: HALOT
  rationale: 위치와 도구성을 함께 살리는 구절이므로, 한국어에서는 자연스러운 처격인 ‘오른손에는’로 옮겨 구체적 이미지를 유지했습니다.
- source_word: הַקֶּסֶם / the divination for Jerusalem
  english_pob_choice: the divination for Jerusalem
  chosen_korean: 예루살렘을 위한 점괘
  alternatives_korean:
  - 예루살렘을 위한 점술
  - 예루살렘을 향한 점괘
  lexicon: HALOT
  rationale: 문맥상 예언적 ‘점괘’가 예루살렘을 가리키는 대상 표지이므로, 지나치게 종교화하지 않고 현대 한국어에서 이해되는 ‘점괘’로 옮겼습니다.
- source_word: כָּרִים / battering rams
  english_pob_choice: battering rams
  chosen_korean: 공성추
  alternatives_korean:
  - 타성추
  - 성벽 부수는 장치
  lexicon: HALOT
  rationale: 성문을 부수는 공격 무기를 가리키므로, 군사적 용례가 분명한 ‘공성추’를 택했습니다.
- source_word: לִפְתֹּחַ פֶּה בְּרֶצַח / to open the mouth with slaughter
  english_pob_choice: to open the mouth with slaughter
  chosen_korean: 살육을 향해 입을 열며
  alternatives_korean:
  - 살육으로 입을 열며
  - 살육을 위해 입을 열며
  - 살육의 외침을 내며
  lexicon: HALOT
  rationale: 직역의 이미지인 ‘입을 열다’를 유지하되, בְּרֶצַח의 폭력성을 한국어에서는 ‘살육’으로 드러내어 공격의 함의를 살렸습니다.
- source_word: בִּתְרוּעָה / with a battle cry
  english_pob_choice: with a battle cry
  chosen_korean: 전투 함성으로
  alternatives_korean:
  - 전투 외침으로
  - 전쟁 함성으로
  lexicon: HALOT
  rationale: תְּרוּעָה는 단순한 소음이 아니라 전투적 환호이므로, 한국어에서는 ‘전투 함성’이 가장 자연스럽고 강하게 대응합니다.
- source_word: סֹלְלָה / a siege ramp
  english_pob_choice: a siege ramp
  chosen_korean: 공성토성
  alternatives_korean:
  - 포위 둑
  - 공성 언덕
  - 포위 토루
  lexicon: HALOT
  rationale: סֹלְלָה는 포위전의 축성물로, 한국어에서 기능을 분명히 드러내는 ‘공성토성’으로 옮겼습니다.
- source_word: דָּיֵק / siege wall
  english_pob_choice: siege wall
  chosen_korean: 포위벽
  alternatives_korean:
  - 공성벽
  - 포위용 성벽
  - 포위진
  lexicon: HALOT
  rationale: 정확한 공학적 세부가 유동적인 용어이므로, 일반 독자가 이해할 수 있는 포위전 축성물이라는 뜻을 살려 ‘포위벽’으로 번역했습니다.
theological_decisions:
- issue: 예루살렘을 향한 점괘가 하나님의 심판 행위를 예고하는 방식
  chosen_reading: 점괘라는 표현을 그대로 살려, 예언적 심판 선포가 실제 전쟁 준비와 연결되는 아이러니를 보존했습니다.
  alternative_readings:
  - 심판의 명령
  - 예언적 표적
  rationale: 본문의 날카로운 긴장을 완화하지 않기 위해, 점술적 언어와 군사적 언어가 겹치는 구조를 유지했습니다.
  doctrine_reference: 예언 문맥의 심판 표상
- issue: 공성 장비와 축성물의 열거
  chosen_reading: 공성추, 공성토성, 포위벽처럼 구체적 전쟁 용어를 사용해 공격의 현실성을 살렸습니다.
  alternative_readings:
  - 전쟁 장비
  - 공성 설비
  rationale: 본문은 추상적 비유보다 실제 포위전 준비를 묘사하므로, 축성의 물성을 드러내는 번역이 더 충실합니다.
  doctrine_reference: 역사적-문학적 문맥 보존
