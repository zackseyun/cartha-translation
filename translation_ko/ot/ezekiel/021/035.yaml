id: EZK.21.35
reference: Ezekiel 21:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָשַׁ֖ב אֶל תַּעְרָ֑/הּ בִּ/מְק֧וֹם אֲשֶׁר נִבְרֵ֛את בְּ/אֶ֥רֶץ מְכֻרוֹתַ֖יִ/ךְ אֶשְׁפֹּ֥ט אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/035.yaml
  text: Return to your sheath[a]. In the place where you were created, in the land of your origins[b], I will judge you.
  footnotes:
  - marker: a
    text: Or 'Put back into its sheath.' The Hebrew directly says 'Return to her/its sheath,' with the sword personified.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the land of your birth' or 'nativity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 칼집으로 돌아가라[a]. 네가 창조된 곳, 곧 네 기원의 땅에서 나는 너를 심판하겠다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 칼집으로 돌려놓아라.’ 히브리어는 문자적으로 ‘그녀/그것의 칼집으로 돌아가라’라고 하며, 칼을 의인화합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁב
  english_pob_choice: Return
  chosen_korean: 돌아가라
  alternatives_korean:
  - 돌려놓아라
  - 되돌아가라
  lexicon: HALOT
  rationale: 칼집으로 향하는 직접 명령이라는 점을 살려 간결한 명령형으로 옮겼습니다.
- source_word: תַּעְרָהּ
  english_pob_choice: your sheath
  chosen_korean: 네 칼집
  alternatives_korean:
  - 그 칼집
  - 그의 칼집
  lexicon: HALOT
  rationale: 히브리어의 여성형 소유 접미사는 칼의 의인화를 드러내지만, 한국어에서는 자연스러운 직접 화법을 위해 ‘네 칼집’으로 옮겼습니다.
- source_word: בְּאֶרֶץ מְכֻרוֹתַיִךְ
  english_pob_choice: in the land of your origins
  chosen_korean: 네 기원의 땅
  alternatives_korean:
  - 네 출생의 땅
  - 네 태어난 땅
  lexicon: HALOT
  rationale: מכורות는 출생/기원/본향의 뜻을 아우르므로, 문맥의 상징성을 살리면서도 과도하게 좁히지 않는 ‘기원의 땅’을 택했습니다.
- source_word: אֶשְׁפֹּט אֹתָךְ
  english_pob_choice: I will judge you
  chosen_korean: 나는 너를 심판하겠다
  alternatives_korean:
  - 나는 너를 판단하겠다
  - 나는 너에게 판결을 내리겠다
  lexicon: HALOT
  rationale: שפט의 법정적·선언적 강도를 반영해 단순한 ‘판단’보다 더 강한 ‘심판하다’를 사용했습니다.
theological_decisions:
- issue: 칼의 의인화와 실제 심판 대상의 긴장
  chosen_reading: 본문의 직접 대상은 의인화된 칼이지만, 그 상징이 가리키는 심판은 바로 앞문맥의 역사적 대상에게 미칩니다.
  alternative_readings:
  - 직접 대상은 암몬 족속이나 그 통치자이다
  - 의인화는 단순 문학 장치일 뿐 실제 대상은 없다
  rationale: 히브리어의 성별 접미사와 ‘칼집’ 이미지를 그대로 살려, 상징을 즉시 해소하지 않고 본문의 긴장을 유지했습니다.
  doctrine_reference: 예언 문학의 상징적 의인화는 해석을 단일화하기보다 문맥 속에서 보존해야 합니다.
