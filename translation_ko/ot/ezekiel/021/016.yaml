  - marker: b
    text: Literally 'in the palm.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the slayer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 닦고[a] 손에 잡도록[b] 주었습니다. 그 칼은 날카롭게 되었고, 닦여서 죽이는 자[c]의 손에 넘겨 주도록 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘광을 내도록’으로 옮길 수 있습니다. 히브리어 מרט는 칼날을 반짝이게 다듬는 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘손바닥에’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘살해자’로 옮길 수 있습니다.
    reason: lexical_alternative
