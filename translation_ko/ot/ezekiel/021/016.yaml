    rationale: 원문은 명시되지 않은 남성 단수 주어가 ‘그것을 주었다’고 말합니다. 한국어에서는 주어를 생략하되 능동형 ‘주었습니다’로 옮기면 불필요한 주체를 보태지 않으면서도 형태를 보존할 수 있습니다.
