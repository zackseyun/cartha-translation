source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן אֹתָ֛/הּ לְ/מָרְטָ֖ה לִ/תְפֹּ֣שׂ בַּ/כָּ֑ף הִֽיא הוּחַ֤דָּה חֶ֨רֶב֙ וְ/הִ֣יא מֹרָ֔טָּה לָ/תֵ֥ת אוֹתָ֖/הּ בְּ/יַד הוֹרֵֽג־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/016.yaml
  text: It is given to be polished[a], to be grasped in the hand. It is sharpened—the sword—and it is polished[c][b], to put it into the hand of a slayer.
  footnotes:
  - marker: a
    text: Or 'burnished' for 'polished' (Hebrew מרט), emphasizing the gleaming preparation of the blade.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in the palm.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the slayer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 닦이도록 주어졌고, 손에 쥐도록 주어졌습니다. 그것은 날카롭게 되었습니다 — 칼이 — 그리고 닦여서, 살육자의 손에 넘겨지도록 했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘번뜩이도록’으로도 옮길 수 있습니다. 히브리어 מרט는 칼날을 반짝이게 다듬는 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘손바닥에’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘살해자’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: is given
  chosen_korean: 주어졌습니다
  alternatives_korean:
  - 주었습니다
  - 주어집니다
  lexicon: HALOT
  rationale: 주어지다의 피동형으로, 주체를 밝히지 않는 도구적·예언적 문맥을 살리면서 영어 POB의 수동적 처리도 반영했습니다.
- source_word: לְמָרְטָה
  english_pob_choice: to be polished
  chosen_korean: 닦이도록
  alternatives_korean:
  - 광을 내도록
  - 번쩍이도록
  lexicon: HALOT
  rationale: מרט의 뜻을 현대 한국어에서 자연스러운 ‘닦다’로 옮겨, 칼날의 준비·광택을 함께 드러내게 했습니다.
- source_word: בַּכָּף
  english_pob_choice: in the hand
  chosen_korean: 손에
  alternatives_korean:
  - 손바닥에
  - 장중에
  lexicon: HALOT
  rationale: 직역상 ‘손바닥’이 가능하지만, 무기를 실제로 쥐는 장면을 분명하게 전하기 위해 ‘손에’로 옮겼습니다.
- source_word: הוּחַדָּה / מֹרָטָּה
  english_pob_choice: is sharpened / is polished
  chosen_korean: 날카롭게 되었습니다 / 닦여서
  alternatives_korean:
  - 예리해졌습니다 / 번쩍이게 되었습니다
  - 갈아졌습니다 / 광이 났습니다
  lexicon: HALOT
  rationale: 히브리어의 병렬 반복과 긴박한 리듬을 살리기 위해 ‘날카롭게 되었습니다’와 ‘닦여서’를 대응시켰습니다.
- source_word: הוֹרֵג
  english_pob_choice: slayer
  chosen_korean: 살육자
  alternatives_korean:
  - 살인자
  - 죽이는 자
  lexicon: HALOT
  rationale: 단순한 행위자보다 무시무시한 처형의 뉘앙스를 살리기 위해 문맥상 강한 ‘살육자’를 택했습니다.
theological_decisions:
- issue: 칼의 주체가 드러나지 않는 수동적 표현
  chosen_reading: 행위를 수행하는 주체를 밝히지 않고, 칼이 준비되어 넘겨지는 과정 자체를 전면에 둡니다.
  alternative_readings:
  - 그가 그것을 닦고 쥐게 한다
  - 하나님이 칼을 준비하신다
  rationale: 본문은 예언적 도구어로 칼의 준비와 전달을 묘사하며, 명시적 주체를 추가하지 않는 것이 원문의 긴장과 모호성을 보존합니다.
  doctrine_reference: 예언 문학의 의도적 주체 생략
