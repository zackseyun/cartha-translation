  source_fidelity: 수정안은 וַיִּתֵּן אֹתָהּ의 능동형과 목적어를 한국어의 자연스러운 무주어 문장으로 반영하고, 두 목적 부정사(‘닦고’, ‘손에 잡도록’) 및 마지막의 ‘죽이는 자의 손에 넘겨 주려고’라는 목적을 보존합니다. הוֹרֵג은 특정한 대량 살해의 뜻을 덧붙이지 않고 ‘죽이는 자’로 옮겼습니다.
  naturalness: 초안의 ‘손에 쥐도록 주어졌습니다’의 반복, ‘날카롭게 되었습니다’의 다소 부자연스러운 연결, ‘넘겨지도록 했습니다’의 피동·사동 충돌을 고쳤습니다. 수정안은 현대 표준 한국어 합쇼체로 자연스럽게 읽힙니다.
  terminology: מרט는 ‘닦다’로 일관되게 옮기고, חֶרֶב은 문맥상 ‘그 칼’로 명시했습니다. הוֹרֵג은 ‘살육자’보다 원문의 일반적 능동분사에 가까운 ‘죽이는 자’를 사용했습니다.
