revisions:
- from: 그것은 닦이도록 주어졌고, 손에 쥐도록 주어졌습니다. 그것은 날카롭게 되었습니다 — 칼이 — 그리고 닦여서, 살육자의 손에 넘겨지도록 했습니다.[a][b][c]
  to: 그것을 닦고[a] 손에 잡도록[b] 주었습니다. 그 칼은 날카롭게 되었고, 닦여서 죽이는 자[c]의 손에 넘겨 주도록 하였습니다.
  rationale: 원문의 능동적 전달과 목적 표현을 회복하고, 칼을 준비하는 병렬 묘사를 유지했습니다. 한국어에서 명시되지 않은 원문 주어는 생략하여 해석상 주체를 특정하지 않았습니다. 또한 의미를 과도하게 강화한 ‘살육자’를 중립적인 ‘죽이는 자’로 바꾸고, 각주 표지를 해당 낱말에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:41:53Z'
