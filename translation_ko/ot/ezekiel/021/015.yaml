id: EZK.21.15
reference: Ezekiel 21:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְמַ֨עַן טְבֹ֤חַ טֶ֨בַח֙ הוּחַ֔דָּה לְמַעַן הֱיֵה לָ֥/הּ בָּ֖רָק מֹרָ֑טָּה א֣וֹ נָשִׂ֔ישׂ שֵׁ֥בֶט בְּנִ֖/י מֹאֶ֥סֶת כָּל עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/015.yaml
  text: So that it may slaughter a slaughter[a], it is sharpened; so that it may have a flash, it is polished[b]. Or shall we rejoice? The scepter of my son despises every tree.
  footnotes:
  - marker: a
    text: Hebrew is difficult in the final clause. 'My son' follows the Masoretic Text; some interpreters understand it more broadly of Judah or my people, and 'every tree' may mean every wooden staff or weapon.
    reason: alternative_reading
  - marker: b
    text: Or 'it may have lightning' or 'it may flash'; the Hebrew expression is elliptical, describing the sword gleaming after polishing.
    reason: lexical_alternative
translation:
  language: ko
  text: 칼은 살육을 행하게 하려고 날카롭게 갈렸으며, 번뜩이는 빛을 내게 하려고 닦였습니다.[b] 아니면 우리가 즐거워하겠습니까? 내 아들의 왕홀은 모든 나무를 멸시합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마지막 절은 난해합니다. ‘내 아들’은 마소라 본문을 따른 표현이며, 일부 해석자들은 이를 유다 또는 내 백성으로 더 넓게 이해합니다. ‘모든 나무’는 모든 목재, 막대기 또는 무기를 뜻할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그것에 번개가 있게 하려고’입니다. ‘번뜩이게 하려고’ 또는 ‘번개를 지니게 하려고’로도 옮길 수 있습니다. 히브리어 표현은 생략적이며, 닦아 광을 낸 칼날의 번뜩임을 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן טְבֹחַ טֶבַח
  english_pob_choice: so that it may slaughter a slaughter
  chosen_korean: 도살할 도살을 위하여
  alternatives_korean:
  - 한 도살을 하기 위하여
  - 도살을 집행하기 위하여
  lexicon: HALOT
  rationale: 히브리어의 목적절과 강조적 중첩을 살리기 위해 자연스러운 완화보다 반복감을 남겼습니다.
- source_word: הוּחַדָּה
  english_pob_choice: it is sharpened
  chosen_korean: sharpened 되어 있으며
  alternatives_korean:
  - 날카롭게 되었습니다
  - 갈아 세워졌습니다
  lexicon: HALOT
  rationale: 대상은 문맥상 칼이므로 수동적 상태를 유지하되, 한국어에서는 상태 서술로 매끄럽게 옮겼습니다.
- source_word: הֱיֵה לָהּ בָרָק
  english_pob_choice: it may flash like lightning
  chosen_korean: 번쩍임을 가지게 하려고
  alternatives_korean:
  - 번개처럼 번쩍이게 하려고
  - 빛남을 가지게 하려고
  lexicon: HALOT
  rationale: 직역보다 ‘번쩍임’으로 엘립시스를 살리고, 비교어를 과하게 보태지 않도록 했습니다.
- source_word: שֵׁבֶט בְּנִי מֹאֶסֶת כָּל עֵץ
  english_pob_choice: The scepter of my son despises every tree
  chosen_korean: 내 아들의 규는 모든 나무를 멸시합니다
  alternatives_korean:
  - 내 아들의 왕홀은 모든 나무를 멸시합니다
  - 내 아들의 지팡이는 모든 나무를 멸시합니다
  lexicon: HALOT
  rationale: שֵׁבֶט은 문맥상 통치의 표지와 징벌의 막대기 의미가 함께 있으므로, 한국어에서는 ‘규’로 옮겨 왕권적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 히브리어 본문의 마지막 절이 매우 난해한 점
  chosen_reading: MT의 난해함을 보존하여, 의미를 완전히 해소하지 않고 직선적으로 옮겼습니다.
  alternative_readings:
  - ‘내 아들의 막대기/지팡이가 모든 나무를 거절합니다’
  - 유다 또는 백성을 가리키는 확장 해석
  rationale: 이 구절은 문법과 의미가 불분명하므로, 해석을 과도하게 정리하기보다 본문의 거칠음을 남겨 두는 것이 원문 충실성에 더 부합합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
