  - severity: medium
    issue: ‘그러면’은 히브리어 אוֹ의 접속적 수사 기능을 충분히 반영하지 못합니다.
    rationale: ‘그러면’은 앞말의 결과를 뜻하지만, 원문은 난해하고 급작스러운 ‘아니면/혹은’의 전환을 보입니다. ‘아니면’이 더 충실합니다.
