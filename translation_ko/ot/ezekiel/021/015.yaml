- from: 그것이 도살할 도살을 위하여 sharpened 되어 있으며, 번쩍임을 가지게 하려고 polished 되어 있습니다. 그러면 우리가 즐거워하겠습니까? 내 아들의 규는 모든 나무를 멸시합니다.[a][b]
  to: 칼은 살육을 행하게 하려고 날카롭게 갈렸으며, 번뜩이는 빛을 내게 하려고 닦였습니다.[b] 아니면 우리가 즐거워하겠습니까? 내 아들의 왕홀은 모든 나무를 멸시합니다.[a]
