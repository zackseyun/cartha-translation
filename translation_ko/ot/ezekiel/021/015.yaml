  source_fidelity: 초안에는 히브리어의 목적 표현과 난해한 수사적 전환을 대체로 보존하려는 의도가 있으나, ‘sharpened’, ‘polished’가 번역되지 않은 채 남아 있어 본문으로 사용할 수 없습니다. 또한 אוֹ는 ‘그러면’보다 ‘아니면’으로 옮겨야 원문의 접속적·수사적 돌연성을 보존합니다. 문맥상 여성 단수 동사가 가리키는 칼을 보충하고, הֱיֵה לָהּ בָרָק의 빛남을 ‘번뜩이는 빛을 내게’로 옮겼습니다. 마지막 절은 MT의 난해함을 해소하지 않고 유지했습니다.
  naturalness: ‘도살할 도살을 위하여’는 현대 한국어로 비문에 가깝고, 영어 단어가 혼입된 표현도 부자연스럽습니다. ‘살육을 행하게 하려고 … 날카롭게 갈렸으며’는 강조된 목적을 자연스러운 현대 문어체로 전달합니다. ‘왕홀’은 ‘규’보다 현대 독자에게 더 이해하기 쉬우면서 שֵׁבֶט의 통치 표지 의미를 보존합니다.
  terminology: 칼, 살육, 왕홀, 멸시하다의 선택은 문맥과 현대 정중 문체에 적절합니다. ‘내 아들’ 및 ‘모든 나무’는 본문의 난해함 때문에 해석적으로 바꾸지 않았으며, 대안적 이해는 각주에서 제시합니다. 각주 표지는 해당 어구 바로 뒤에 배치했습니다.
