source:
  edition: WLC
  text: הִתְאַחֲדִ֥י הֵימִ֖נִי הָשִׂ֣ימִי הַשְׂמִ֑ילִי אָ֖נָה פָּנַ֥יִ/ךְ מֻעָדֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/021.yaml
  text: Gather yourself[a]; go to the right; set yourself to the left[c][b], wherever your face is appointed.
  footnotes:
  - marker: a
    text: Or 'Unite yourself,' 'Compose yourself,' or in context 'Mass yourself.' The Hebrew verb is rare and reflexive, likely conveying concentration or consolidation before striking.
    reason: lexical_alternative
  - marker: b
    text: Literally 'your face.' In Hebrew this can mean the direction one is facing.
    reason: lexical_alternative
  - marker: c
    text: Or 'wherever your face is directed' or 'wherever your face is set.'
    reason: alternative_reading
translation:
  language: ko
  text: 스스로를 한데 모으고[a] 오른쪽으로 가며, 왼쪽으로 돌리십시오[b][c]. 네 얼굴이 정해진 곳은 어디든지 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스스로 하나가 되십시오’, ‘스스로를 가다듬으십시오’, 문맥상 ‘힘을 한데 모으십시오’로도 옮길 수 있습니다. 희귀한 재귀형 동사로, 공격 직전의 집중·응집을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘네 얼굴’입니다. 히브리어에서는 방향을 향하는 쪽을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘네 얼굴이 향하도록 정해진 곳은’ 혹은 ‘네 얼굴이 정해진 곳은’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְאַחֲדִ֥י
  english_pob_choice: Gather yourself
  chosen_korean: 스스로를 한데 모으고
  alternatives_korean:
  - 스스로를 모으고
  - 스스로를 하나로 모으고
  - 집중하고
  lexicon: HALOT
  rationale: 희귀한 재귀형 명령의 응집·집합 의미를 살리면서, 군사적 긴박함도 드러내기 위해 ‘스스로를 한데 모으고’로 옮겼습니다.
- source_word: הֵימִ֖נִי
  english_pob_choice: go to the right
  chosen_korean: 오른쪽으로 가며
  alternatives_korean:
  - 오른쪽으로 가십시오
  - 오른쪽으로 돌리십시오
  - 오른쪽으로 향하십시오
  lexicon: HALOT
  rationale: ‘오른쪽’이라는 방향성과 명령성을 살리되, 앞뒤 동사들과의 병렬을 자연스럽게 하려고 ‘가며’로 연결했습니다.
- source_word: הָשִׂ֣ימִי הַשְׂמִילִי
  english_pob_choice: set yourself to the left
  chosen_korean: 왼쪽으로 돌리십시오
  alternatives_korean:
  - 왼쪽에 두십시오
  - 왼쪽으로 돌리며 진행하십시오
  - 스스로를 왼쪽에 두십시오
  lexicon: HALOT
  rationale: 동사 שׂים의 ‘놓다/두다’ 뉘앙스와 이어지는 방향 명령을 합쳐, 한국어에서는 군사적 동작에 자연스러운 ‘왼쪽으로 돌리십시오’로 압축했습니다.
- source_word: אָ֖נָה פָּנַ֥יִ/ךְ מֻעָדֽוֹת
  english_pob_choice: wherever your face is appointed
  chosen_korean: 네 얼굴이 정해진 곳은 어디든지 말입니다
  alternatives_korean:
  - 네 얼굴이 향하도록 정해진 곳은 어디든지 말입니다
  - 네 얼굴이 향한 곳은 어디든지 말입니다
  - 네 얼굴이 지정된 곳은 어디든지 말입니다
  lexicon: HALOT
  rationale: ‘얼굴’의 방향 의미를 보존하면서 מֻעָדוֹת의 수동적 ‘정해진/지정된’ 뜻을 살려, 방향이 이미 정해진 지점을 가리키는 표현으로 옮겼습니다.
theological_decisions:
- issue: 직접된 대상이 본문에 생략된 군사적 명령문
  chosen_reading: 본문의 생략된 대상(문맥상 칼/무력)을 한국어 본문에 보충하지 않고, 짧고 절박한 연속 명령으로 유지했습니다.
  alternative_readings:
  - ‘오 칼아’처럼 대상을 본문에 명시함
  - 명령을 군대 전체에 대한 지시로 풀어씀
  rationale: 히브리어는 여성 단수 명령형의 연쇄로 구성되어 있으며, 바로 앞뒤 문맥이 personified sword를 전제합니다. 본문 밖 정보를 본문에 덧붙이지 않기 위해 생략을 유지했습니다.
  doctrine_reference: 원문 우선, 과잉해설 금지
