id: EZK.21.3
reference: Ezekiel 21:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ לְ/יַ֣עַר הַ/נֶּ֔גֶב שְׁמַ֖ע דְּבַר יְהוָ֑ה כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֡ה הִנְ/נִ֣י מַֽצִּית בְּ/ךָ֣ אֵ֡שׁ וְ/אָכְלָ֣ה בְ/ךָ֣ כָל עֵֽץ לַח֩ וְ/כָל עֵ֨ץ יָבֵ֤שׁ לֹֽא תִכְבֶּה֙ לַהֶ֣בֶת שַׁלְהֶ֔בֶת וְ/נִצְרְבוּ בָ֥/הּ כָּל פָּנִ֖ים מִ/נֶּ֥גֶב צָפֽוֹנָ/ה־־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/003.yaml
  text: 'And say to the forest of the Negev[a], ‘Hear the word of Yahweh. Thus says the Lord GOD: Behold, I am kindling a fire in you, and it will consume in you every green tree and every dry tree. The blazing flame will not be quenched[b], and by it every face from south to north will be scorched.’'
  footnotes:
  - marker: a
    text: Or “the forest of the southland.” Hebrew negev can mean “south/southland” or refer more specifically to the Negev region.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the LORD”; the divine name YHWH is rendered “the LORD” in keeping with the project’s standard practice.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 남쪽[a] 숲에게 말하십시오. “남쪽 숲아, 야훼의 말씀을 들으십시오. 주 야훼께서 이렇게 말씀하십니다. 보십시오, 내가 네 안에 불을 붙이겠다. 그 불이 네 안의 모든 푸른 나무와 모든 마른 나무를 삼킬 것이며, 타오르는 불길은 꺼지지 않을 것이다. 그 불로 말미암아 남쪽에서 북쪽까지 모든 얼굴이 그을릴 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 네겝은 ‘남쪽/남방’을 뜻할 수도 있고, 더 구체적으로 ‘네겝 지역’을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַר הַנֶּגֶב
  english_pob_choice: the forest of the Negev
  chosen_korean: 남쪽 숲
  alternatives_korean:
  - 네겝 숲
  - 남방의 숲
  lexicon: HALOT
  rationale: יַעַר는 문자적으로 숲/삼림이고, הַנֶּגֶב은 이 문맥에서 지리명인 네겝보다도 '남쪽/남방'의 뜻이 자연스러워, 한국어에서는 이미지와 지시성을 살려 '남쪽 숲'으로 옮겼습니다.
- source_word: שְׁמַע דְּבַר יְהוָה
  english_pob_choice: Hear the word of Yahweh
  chosen_korean: 야훼의 말씀을 들으라
  alternatives_korean:
  - 야훼의 말을 들으라
  - 야훼의 말씀에 귀를 기울이라
  lexicon: HALOT
  rationale: 예언적 소명의 상투적 명령형을 살려 '말씀을 들으라'로 옮겼고, דְּבַר는 단순한 '말'보다 공식적이고 권위 있는 '말씀'이 더 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본 프로젝트의 원칙에 따라 신명기적 고유명사 יְהוָה는 대체 호칭이 아닌 음역 '야훼'로 유지했습니다.
- source_word: לַהֶבֶת שַׁלְהֶבֶת
  english_pob_choice: the blazing flame
  chosen_korean: 타오르는 불길
  alternatives_korean:
  - 불꽃이 활활 이는 불길
  - 타는 화염
  lexicon: HALOT
  rationale: 중첩된 어형이 불길의 격렬함을 강조하므로, 한국어에서도 단순한 '불'보다 강조가 살아나는 '타오르는 불길'로 옮겼습니다.
- source_word: וְנִצְרְבוּ בָהּ כָּל פָּנִים
  english_pob_choice: and by it every face ... will be scorched
  chosen_korean: 그 불에 ... 모든 얼굴이 그을릴 것입니다
  alternatives_korean:
  - 그 불에 ... 모든 얼굴이 타들어 갈 것입니다
  - 그 불에 ... 모든 얼굴이 상할 것입니다
  lexicon: HALOT
  rationale: פָּנִים을 문자적으로 살려 '얼굴'로 두었고, 열기에 의해 표면이 손상되는 뉘앙스는 '그을리다'가 가장 가깝습니다.
theological_decisions:
- issue: 심판의 불과 숲의 비유를 본문에서 해석할지 여부
  chosen_reading: 비유를 그대로 유지하고, 숲을 곧바로 유다로 풀이하지 않았습니다.
  alternative_readings:
  - '''유다의 남쪽 땅''으로 명시적으로 풀어 쓰기'
  - '''남방의 회중''처럼 해석을 본문에 삽입하기'
  rationale: 본문 자체는 이미지로 말하고 있으므로, 해석은 문맥에 맡기고 원문의 비유적 긴장을 보존하는 편이 원문 충실도에 더 부합합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve metaphor without importing interpretation'
