lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: came
  chosen_korean: 임하여
  alternatives_korean:
  - 오셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 예언 공식에서 ‘말씀이 …에게 임하다’는 한국어 성경에서 자연스럽고, 원문의 도착/도래 의미를 과도하게 평탄화하지 않으면서도 ‘came’의 기능을 잘 살립니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언적 계시의 정형 표현인 דְבַר יְהוָה를 한국어에서는 ‘말씀’으로 옮기는 것이 가장 정확하고 관용적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 본문의 신명사יהוה를 한국어 성경 독자에게 익숙한 표기인 ‘여호와’로 옮겼습니다. 이 기록은 본문 자체보다 POB의 영어 단층을 따라가야 하므로, 영어 본문의 ‘Yahweh’와는 별도로 한국어 독자 가독성을 우선했습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  lexicon: HALOT
  rationale: 예언자에게 향하는 방향을 자연스러운 현대 한국어로 나타내기 위해 ‘내게’를 선택했습니다.
- source_word: לֵאמֹר
  english_pob_choice: 'saying:'
  chosen_korean: 이르셨습니다.
  alternatives_korean:
  - 말하여 이르시되
  - 말씀하시기를
  lexicon: HALOT
  rationale: 히브리어에서 뒤따르는 직접 화법을 여는 연결 표지이지만, 한국어에서는 문맥상 종결 없이 이어지는 ‘이르시며’보다 이 문장 자체를 매끄럽게 닫는 표현이 적절합니다. 다만 본 절만 단독 제시되므로 다음 절로 이어지는 개방성을 위해 문장 끝에 쉼표 대신 마침표와 각주를 둡니다.
theological_decisions:
- issue: 여호와/야훼 표기 선택
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 절의 핵심 신학 표지는 신명사יהוה의 음역입니다. 한국어 본문에서는 널리 인지되는 표기인 ‘여호와’를 사용하되, 영어 POB의 ‘Yahweh’ 선택은 각주로 대응해 원문 식별 가능성을 보존했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH → Yahweh'
