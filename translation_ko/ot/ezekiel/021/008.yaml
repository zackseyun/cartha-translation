  text: וְ/אָמַרְתָּ֞ לְ/אַדְמַ֣ת יִשְׂרָאֵ֗ל כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֣י אֵלַ֔יִ/ךְ וְ/הוֹצֵאתִ֥י חַרְבִּ֖/י מִ/תַּעְרָ֑/הּ וְ/הִכְרַתִּ֥י מִמֵּ֖/ךְ צַדִּ֥יק וְ/רָשָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/008.yaml
  text: 'And say to the land of Israel[a], ‘Thus says Yahweh: Behold, I am against you, and I will draw my sword from its sheath and cut off from you both righteous and wicked.’'
  footnotes:
  - marker: a
    text: Or, 'the righteous and the wicked.' The Hebrew names both groups explicitly, underscoring the sweeping scope of the announced judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 이스라엘 땅에게 말하여라. ‘주 야훼께서 이렇게 말씀하십니다. 보아라, 내가 너를 대적하노니, 내 칼을 그 칼집에서 뽑아내어 너에게서 의인과 악인을 끊어 버리겠습니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘땅’이지만, 예언적 호칭에서는 그 땅의 주민과 영토를 함께 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: לְאַדְמַת יִשְׂרָאֵל
  english_pob_choice: the land of Israel
  chosen_korean: 이스라엘 땅
  alternatives_korean:
  - 이스라엘의 토지
  - 이스라엘의 땅
  lexicon: HALOT
  rationale: אַדְמָה는 기본적으로 땅/토지를 뜻하며, 예언자적 호칭에서는 영토와 그 거주민을 함께 가리키므로 한국어에서는 자연스러운 ‘이스라엘 땅’이 가장 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 공적 이름을 가리키는 본문이므로 관례적 대체칭호 ‘주’보다 하나님의 고유명 ‘야훼’를 옮겨 원문 식별성을 살렸습니다.
- source_word: הִנְנִי אֵלַיִךְ
  english_pob_choice: Behold, I am against you
  chosen_korean: 보아라, 내가 너를 대적하노니
  alternatives_korean:
  - 보라, 내가 너를 대적합니다
  - 보아라, 내가 너에게 맞서 있습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 단순한 위치 진술이 아니라 강한 적대/대면 선언이므로, ‘대적하다’로 적대의 뉘앙스를 드러냈습니다.
- source_word: וְהוֹצֵאתִי חַרְבִּי מִתַּעְרָהּ
  english_pob_choice: I will draw my sword from its sheath
  chosen_korean: 내 칼을 그 칼집에서 뽑아내어
  alternatives_korean:
  - 내 칼을 칼집에서 빼어
  - 내 칼을 그 칼집에서 꺼내어
  lexicon: HALOT
  rationale: 검과 칼집의 이미지가 분명하므로, 영어 POB의 ‘draw’를 살리되 한국어에서는 관용적으로 자연스러운 ‘뽑아내다’로 옮겼습니다.
- source_word: צַדִּיק וְרָשָׁע
  english_pob_choice: both righteous and wicked
  chosen_korean: 의인과 악인
  alternatives_korean:
  - 의로운 자와 악한 자
  - 의인들과 악인들
  lexicon: HALOT
  rationale: 히브리어는 두 범주를 명시적으로 병렬 제시하므로, 한국어도 간결하게 ‘의인과 악인’으로 유지해 심판의 포괄성을 보존했습니다.
theological_decisions:
- issue: 의인과 악인이 함께 언급되는 심판의 범위
  chosen_reading: 본문이 말하는 칼의 심판은 이 땅 안의 의인과 악인 모두에게 미친다고 그대로 옮겼습니다.
  alternative_readings:
  - 공동체적 심판으로 이해해 개별 구분의 긴장을 완화할 수 있습니다.
  - ‘의인과 악인’의 대구를 설명적으로 풀어 심판의 범위를 희석할 수 있습니다.
  rationale: 원문은 두 범주를 명시하며 긴장을 해소하지 않으므로, 번역도 그 급진성을 그대로 보존해야 합니다.
  doctrine_reference: '번역 원칙 §3: 신학적 긴장을 해소하지 말고 보존한다.'
