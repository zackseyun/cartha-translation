  text: 바벨론의 왕이 두 길의 갈림길[a]에 서서, 길의 머리에 섰으니, 점치는 일을 행하려 함이라. 그는 화살을 흔들어[b] 집신[c]을 묻고, 간을 살피나니.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 원문은 '길의 어머니'라 하였으나, 이는 길의 갈림점, 즉 두 길이 갈라지는 곳을 뜻하는 관용구입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '그가 집신들을 묻는다'는 뜻이며, '테라핌'은 점치는 데 사용된 우상들을 가리킵니다.
    reason: alternative_reading
  - marker: c
    text: 곧 간을 살피는 방법으로 점치는 일을 행함을 이릅니다.
    reason: alternative_reading
