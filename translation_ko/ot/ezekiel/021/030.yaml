revisions:
- from: 너, 살육당한 악한 자여, 이스라엘의 통치자여, 네 날이 끝의 벌이 임할 때에 이르렀습니다.[a][b]
  to: 그러나 너, 죽임을 당한[b] 악한 자, 이스라엘의 지도자여, 끝의 벌이 닥칠 때[a] 네 날이 왔습니다.
  rationale: 원문의 어순과 예언적 심판 호격을 유지하면서, 현대 표준 한국어로 더 자연스러운 ‘죽임을 당한’과 ‘네 날이 왔습니다’를 사용했습니다. 논쟁적인 עֲוֺן קֵץ는 본문에서 문맥상 ‘끝의 벌’로 번역하되, 죄악/죄책이라는 대안은 정확한 위치의 각주에 보존했습니다. 각주 표지를 설명 대상 어휘에 각각 연결하고, 오류로 삽입된 ‘כאן’을 원어 חָלָל로 정정했습니다.
