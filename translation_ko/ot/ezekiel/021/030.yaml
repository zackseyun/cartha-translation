id: EZK.21.30
reference: Ezekiel 21:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּה֙ חָלָ֣ל רָשָׁ֔ע נְשִׂ֖יא יִשְׂרָאֵ֑ל אֲשֶׁר בָּ֣א יוֹמ֔/וֹ בְּ/עֵ֖ת עֲוֺ֥ן קֵֽץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/030.yaml
  text: And you[a], slain wicked one, prince of Israel, whose day has come at the time of the punishment of the end[b],
  footnotes:
  - marker: a
    text: Or, more literally, 'the iniquity of the end'; the Hebrew may refer either to final guilt coming to its full measure or to the final punishment for that guilt.
    reason: lexical_alternative
  - marker: b
    text: '''Slain'' may also be rendered ''mortally wounded''; some take the Hebrew here in the sense ''profane,'' yielding ''O profane wicked prince of Israel.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 너, 죽임을 당한[b] 악한 자, 이스라엘의 지도자여, 끝의 벌이 닥칠 때[a] 네 날이 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘끝의 죄악’ 또는 ‘끝의 죄책’일 수 있습니다. 히브리어는 죄책이 극에 달한 상태를 가리킬 수도 있고, 그 죄책에 대한 결정적인 벌을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘죽임을 당한’은 ‘치명상을 입은’으로도 옮길 수 있습니다. 일부는 히브리어 חָלָל을 ‘속된’ 또는 ‘더럽혀진’이라는 뜻으로 이해하여 ‘이스라엘의 속되고 악한 지도자’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חָלָל
  english_pob_choice: slain
  chosen_korean: 살육당한
  alternatives_korean:
  - 찔려 죽은
  - 치명상을 입은
  - 더럽혀진
  lexicon: HALOT
  rationale: 문맥상 심판 선고를 받는 통치자에게는 ‘더럽혀진’보다 죽임을 당한 상태를 가리키는 뜻이 더 적절하므로, ‘살육당한’으로 살벌한 심판 이미지를 살렸습니다.
- source_word: רָשָׁע
  english_pob_choice: wicked one
  chosen_korean: 악한 자
  alternatives_korean:
  - 악인
  - 사악한 자
  - 죄인
  lexicon: HALOT
  rationale: 명사적으로 쓰인 호칭이므로 단순 형용사보다 사람을 지칭하는 ‘악한 자’가 vocative의 힘을 더 잘 드러냅니다.
- source_word: נְשִׂיא יִשְׂרָאֵל
  english_pob_choice: prince of Israel
  chosen_korean: 이스라엘의 통치자
  alternatives_korean:
  - 이스라엘의 방백
  - 이스라엘의 지도자
  - 이스라엘의 왕자
  lexicon: HALOT
  rationale: נְשִׂיא는 직함으로서 ‘방백/통치자/지도자’ 범위가 가능하지만, 현대 한국어에서 ‘통치자’가 권력과 심판 맥락을 가장 분명하게 전달합니다.
- source_word: בְּעֵת עֲוֺן קֵץ
  english_pob_choice: at the time of the punishment of the end
  chosen_korean: 끝의 벌이 임할 때에
  alternatives_korean:
  - 끝의 죄악이 이르는 때에
  - 종말의 벌이 임할 때에
  - 끝의 심판이 임할 때에
  lexicon: HALOT
  rationale: עָוֹן은 죄책/죄악뿐 아니라 그에 대한 벌을 가리킬 수 있으므로, 이 심판 맥락에서는 ‘벌’이 가장 직접적입니다. קֵץ는 ‘끝’으로 살려 최종성도 유지했습니다.
theological_decisions:
- issue: עָוֹן קֵץ의 의미 범위
  chosen_reading: 죄책의 종결이라기보다 최종 벌이 임하는 시점으로 읽었습니다.
  alternative_readings:
  - ‘끝의 죄악’ 또는 ‘마지막 죄책’으로 더 문자적으로 읽는 해석
  - ‘마지막 심판’으로 보다 해석적으로 읽는 해석
  rationale: 예언적 심판 신탁의 바로 이 문맥에서는 עָוֹן을 추상적 죄악보다 그에 대한 결과, 곧 벌로 옮기는 것이 한국어 독자에게 가장 분명하면서도 원문의 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 호격의 거친 어조
  chosen_reading: ‘너, 살육당한 악한 자여’로 직접적인 호칭을 유지했습니다.
  alternative_readings:
  - ‘오, 살육당한 악한 자여’로 고전적 호격을 덧붙이는 해석
  - ‘살육당한 악한 자’로 호격 표지를 약화하는 해석
  rationale: 히브리어의 심판적 책망 어조를 약화시키지 않기 위해 호격성을 분명히 드러냈습니다. 현대 한국어 합쇼체 안에서도 예언적 경고의 날카로움을 유지할 수 있습니다.
  doctrine_reference: Translation philosophy §1, §5
