  naturalness: ‘살육당한’은 사람에게 쓰일 수 있으나 이 문맥에서는 다소 부자연스럽고 과도하게 구체적입니다. ‘죽임을 당한’이 חָלָל의 피살·치명상 의미를 자연스럽게 보존합니다. ‘네 날이 … 이르렀습니다’보다 ‘네 날이 … 왔습니다’가 현대 한국어에서 더 자연스럽습니다.
  terminology: נְשִׂיא는 ‘지도자’로 자연스럽게 옮길 수 있습니다. רָשָׁע의 ‘악한 자’와 עָוֺן의 문맥적 ‘벌’은 유지하되, ‘더럽혀진’이 아니라 어근상 가능한 ‘속된/더럽힌’ 계열의 대안이라는 점을 정확히 설명합니다.
