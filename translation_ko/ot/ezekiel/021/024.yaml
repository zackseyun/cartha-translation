  source_fidelity: 초안은 ‘바벨론 왕의 칼’과 두 길 및 표식의 상징 행위를 대체로 보존합니다. 그러나 יֵצְאוּ שְׁנֵיהֶם(‘그 둘이 나올 것이다/나오게 하라’)를 ‘나뉘게 하고’로 옮긴 것은 원문의 ‘한 땅에서 나옴’이라는 표현을 분기라는 해석으로 앞당깁니다. 또한 두 번째 בָּרֵא는 성읍으로 가는 길의 머리에 표식을 만들라는 지시인데, 초안의 반복된 ‘세우라’는 지시의 연결이 다소 불명확합니다.
  naturalness: ‘너, 인자야’와 해라체 명령형은 요청된 현대 한국어 합쇼체와 맞지 않습니다. ‘인자여’와 ‘-하십시오’를 사용하고, ‘표’는 일반적이어서 방향 표식이라는 문맥을 충분히 드러내지 못하므로 ‘이정표’가 더 자연스럽고 명료합니다.
  terminology: ‘인자’는 에스겔에서의 בֶּן־אָדָם 호칭을 보존하는 적절한 전통적 용어입니다. יָד은 이 문맥에서 문자적 ‘손’보다 방향을 가리키는 표식으로 이해하는 것이 적절하므로 ‘이정표’로 번역합니다. עִיר은 특정 도시를 본문이 명시하지 않으므로 ‘성읍’으로 유지합니다.
