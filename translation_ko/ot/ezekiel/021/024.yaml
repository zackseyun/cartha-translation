source:
  edition: WLC
  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם שִׂים לְ/ךָ֣ שְׁנַ֣יִם דְּרָכִ֗ים לָ/בוֹא֙ חֶ֣רֶב מֶֽלֶךְ בָּבֶ֔ל מֵ/אֶ֥רֶץ אֶחָ֖ד יֵצְא֣וּ שְׁנֵי/הֶ֑ם וְ/יָ֣ד בָּרֵ֔א בְּ/רֹ֥אשׁ דֶּֽרֶךְ עִ֖יר בָּרֵֽא־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/024.yaml
  text: And you[a], son of man, set for yourself two roads for the sword of the king of Babylon to come by; both of them shall go out from one land. And make a signpost[b]; make it at the head of the road to the city.
  footnotes:
  - marker: a
    text: Hebrew 'hand' here likely means a marker or signpost indicating direction.
    reason: lexical_alternative
  - marker: b
    text: Or 'make it at the beginning of the road to the city'; the Hebrew phrase may refer to the road's head or chief junction.
    reason: alternative_reading
translation:
  language: ko
  text: 너, 인자야, 네게 두 길을 두어 바벨론 왕의 칼이 오게 하라. 두 길 모두 한 땅에서 나뉘게 하고, 길머리에 표를 세우라. 성읍으로 가는 길머리에 그것을 세우라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘손’은 여기서 방향을 가리키는 표식, 곧 이정표를 뜻하는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘길의 시작점에’로 옮길 수 있습니다. 히브리어 표현은 길의 머리, 곧 주된 갈림길을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 인자야
  - 인간아
  lexicon: HALOT
  rationale: 에스겔의 호칭 관용구를 보존하면서도 한국어 성경 전통에서 통용되는 직접 호칭을 살렸습니다.
- source_word: שִׂים לְךָ
  english_pob_choice: set for yourself
  chosen_korean: 네게 두어
  alternatives_korean:
  - 네게 세워
  - 너를 위해 정해
  - 너 자신을 위해 마련해
  lexicon: HALOT
  rationale: 상징 행위의 명령으로서 ‘두다/두어’가 가장 자연스럽고, 수혜 대상 ‘לךָ’의 반사적 뉘앙스를 살립니다.
- source_word: יָד
  english_pob_choice: signpost
  chosen_korean: 표
  alternatives_korean:
  - 손
  - 표지판
  - 이정표
  lexicon: HALOT
  rationale: 본문의 ‘손’은 문자적으로는 손이지만 방향을 가리키는 표식이라는 해석을 반영해야 하므로, 간결한 ‘표’로 옮겼습니다.
- source_word: בָּרֵא
  english_pob_choice: make
  chosen_korean: 세우라
  alternatives_korean:
  - 만들라
  - 마련하라
  - 지어라
  lexicon: HALOT
  rationale: 희귀한 명령형의 구체 형상을 단정하지 않으면서, 표식을 실제로 설치하는 동작을 드러내기 위해 ‘세우다’를 택했습니다.
- source_word: בְּרֹאשׁ דֶּרֶךְ
  english_pob_choice: at the head of the road
  chosen_korean: 길머리에
  alternatives_korean:
  - 길의 머리에
  - 길의 시작점에
  - 길목에
  lexicon: HALOT
  rationale: ‘머리’의 직역을 살리되 한국어로는 자연스럽게 합성어 ‘길머리’로 옮겨 출발점/분기점의 의미를 함께 담았습니다.
theological_decisions:
- issue: 상징행위 명령문의 직설성
  chosen_reading: 예언자 에스겔에게 실제로 두 갈래 길과 표식을 마련하라고 명령하는 상징행위로 직역했습니다.
  alternative_readings:
  - 비유적으로 ‘길을 택하라’로 완화
  - 의미를 풀어 ‘갈림길을 표시하라’로 의역
  rationale: 본문은 해석 설명이 아니라 상징 행위 지시이므로, 예언적 긴장과 심판의 실제성을 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: 예언서의 표징 행위 해석 원칙
- issue: ‘바벨론 왕의 칼’의 이미지 보존
  chosen_reading: ‘칼’ 이미지를 유지해 전쟁과 정복의 메타포를 드러냈습니다.
  alternative_readings:
  - ‘군대’ 또는 ‘공격’으로 의미화
  rationale: 원문은 칼을 매개로 한 심판 이미지를 사용하므로, 현대 독자가 불편해할 수 있어도 상징의 날카로움을 보존하는 것이 본문에 충실합니다.
  doctrine_reference: 예언적 심판 표상
