  lexicon: HALOT
  rationale: 희귀한 명령형의 구체 형상을 단정하지 않으면서, 표식을 실제로 설치하는 동작을 드러내기 위해 ‘세우다’를 택했습니다.
- source_word: בְּרֹאשׁ דֶּרֶךְ
  english_pob_choice: at the head of the road
  chosen_korean: 길머리에
