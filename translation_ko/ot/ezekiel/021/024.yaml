  - 길의 시작점에
  - 길목에
  lexicon: HALOT
  rationale: ‘머리’의 직역을 살리되 한국어로는 자연스럽게 합성어 ‘길머리’로 옮겨 출발점/분기점의 의미를 함께 담았습니다.
theological_decisions:
- issue: 상징행위 명령문의 직설성
  chosen_reading: 예언자 에스겔에게 실제로 두 갈래 길과 표식을 마련하라고 명령하는 상징행위로 직역했습니다.
  alternative_readings:
  - 비유적으로 ‘길을 택하라’로 완화
  - 의미를 풀어 ‘갈림길을 표시하라’로 의역
  rationale: 본문은 해석 설명이 아니라 상징 행위 지시이므로, 예언적 긴장과 심판의 실제성을 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: 예언서의 표징 행위 해석 원칙
- issue: ‘바벨론 왕의 칼’의 이미지 보존
  chosen_reading: ‘칼’ 이미지를 유지해 전쟁과 정복의 메타포를 드러냈습니다.
  alternative_readings:
  - ‘군대’ 또는 ‘공격’으로 의미화
  rationale: 원문은 칼을 매개로 한 심판 이미지를 사용하므로, 현대 독자가 불편해할 수 있어도 상징의 날카로움을 보존하는 것이 본문에 충실합니다.
  doctrine_reference: 예언적 심판 표상
