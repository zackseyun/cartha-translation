  text: בֶּן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ דֶּ֣רֶךְ תֵּימָ֔נָ/ה וְ/הַטֵּ֖ף אֶל דָּר֑וֹם וְ/הִנָּבֵ֛א אֶל יַ֥עַר הַ/שָּׂדֶ֖ה נֶֽגֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/002.yaml
  text: Son of man[a], set your face toward the south, and preach toward the south[c][b], and prophesy against the forest of the field in the Negeb.
  footnotes:
  - marker: a
    text: 'Hebrew uses three related southern terms in sequence: ''Teman/south,'' ''darom/south,'' and ''Negeb.'' The repetition intensifies the oracle''s focus on the southern land.'
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'preach' is literally 'drip' or 'let drop,' a Hebrew metaphor for prophetic speech.
    reason: lexical_alternative
  - marker: c
    text: Or 'against the forest of the open field in the south.'
    reason: alternative_reading
translation:
  language: ko
  text: 인자야[a], 네 얼굴을 남쪽으로 향하게 하고, 남쪽을 향해 외치며[b], 네겝의 들판 숲을 향해 예언하십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘데만/남쪽’, ‘다롬/남쪽’, ‘네겝’이라는 세 남방 계열 표현을 연속해서 사용하여, 예언이 남쪽 땅에 집중됨을 강화합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 문자적으로는 ‘떨어뜨리다/방울지게 하다’에 가깝고, 예언적 발화를 가리키는 비유입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘남쪽의 들판 숲을 향해’.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인간
  lexicon: HALOT
  rationale: 에스겔에서 반복되는 예언자 호칭의 문맥을 살리면서, 한국어에서 비교적 직접적으로 대응되는 ‘인자’를 택해 형식과 반복성을 보존했습니다.
- source_word: שִׂים פָּנֶיךָ
  english_pob_choice: set your face
  chosen_korean: 네 얼굴을 ... 향하게 하다
  alternatives_korean:
  - 네 얼굴을 돌리다
  - 네 얼굴을 두다
  lexicon: HALOT
  rationale: 히브리어 관용구의 방향 설정과 결단의 이미지를 살리기 위해 ‘향하게 하다’로 옮겼습니다.
- source_word: וְהַטֵּף
  english_pob_choice: preach
  chosen_korean: 외치다
  alternatives_korean:
  - 전하다
  - 예언하다
  - 말을 떨어뜨리다
  lexicon: HALOT
  rationale: 원뜻은 ‘떨어뜨리다/흐르게 하다’이지만 예언적 발화를 가리키는 비유이므로, 한국어에서는 비유를 과도하게 풀지 않으면서도 경고적 선포의 힘이 살아 있는 ‘외치다’를 택했습니다.
- source_word: אֶל דָּרוֹם
  english_pob_choice: toward the south
  chosen_korean: 남쪽을 향해
  alternatives_korean:
  - 남쪽을 향하여
  - 남쪽으로
  lexicon: HALOT
  rationale: 앞의 동작과 자연스럽게 연결되도록 방향성을 살려 번역했습니다. 이 절에서는 ‘남쪽’ 관련 표현이 연속되므로, 과도한 해석어를 덧붙이지 않았습니다.
- source_word: אֶל יַעַר הַשָּׂדֶה נֶגֶב
  english_pob_choice: against the forest of the field in the Negeb
  chosen_korean: 네겝의 들판 숲을 향해
  alternatives_korean:
  - 네겝의 들 숲을 향해
  - 남쪽의 들판 숲을 향해
  - 네겝의 들판 숲을 향하여
  lexicon: HALOT
  rationale: ‘יער השדה’의 낯선 결합을 가능한 한 그대로 보존하고, 마지막의 נגב는 고유 지역명으로 음역해 앞선 두 개의 방향어와 구별했습니다.
theological_decisions:
- issue: 세 번 연속되는 남쪽 계열 표현의 처리
  chosen_reading: ‘남쪽’과 ‘네겝’을 분리해 옮겨, 반복되는 남방 어휘의 압박감을 살렸습니다.
  alternative_readings:
  - 모두 ‘남쪽’으로 통일
  - 마지막도 ‘남쪽’으로 해석
  rationale: 히브리어 본문은 תֵּימָנָה, דָּרוֹם, נֶגֶב을 연속 사용하여 남쪽에 대한 집중을 강화합니다. 이를 단일어로 평탄화하면 수사적 효과가 약해지므로, 마지막 용어는 지역명으로 남겼습니다.
  doctrine_reference: 본문 수사와 어휘 반복의 보존
