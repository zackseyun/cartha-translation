base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/002.yaml
  text: Son of man[a], set your face toward the south, and preach toward the south[c][b], and prophesy against the forest of the field in the Negeb.
  footnotes:
  - marker: a
    text: 'Hebrew uses three related southern terms in sequence: ''Teman/south,'' ''darom/south,'' and ''Negeb.'' The repetition intensifies the oracle''s focus on the southern land.'
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'preach' is literally 'drip' or 'let drop,' a Hebrew metaphor for prophetic speech.
    reason: lexical_alternative
  - marker: c
    text: Or 'against the forest of the open field in the south.'
    reason: alternative_reading
translation:
  language: ko
  text: 인자여[a], 얼굴을 남쪽으로 향하게 하시고, 남쪽을 향하여 예언의 말을 쏟아 내시며[b], 네겝의 들판 숲을 향하여 예언하십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘데만/남쪽’, ‘다롬/남쪽’, ‘네겝’이라는 세 남방 계열 표현을 연속해서 사용하여, 예언이 남쪽 땅에 집중됨을 강화합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 문자적으로는 ‘떨어뜨리다/방울지게 하다’에 가깝고, 예언적 발화를 가리키는 비유입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘남쪽의 들판 숲을 향하여’.
    reason: alternative_reading
