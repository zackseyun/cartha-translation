id: EZK.21.17
reference: Ezekiel 21:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זְעַ֤ק וְ/הֵילֵל֙ בֶּן אָדָ֔ם כִּי הִיא֙ הָיתָ֣ה בְ/עַמִּ֔/י הִ֖יא בְּ/כָל נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל מְגוּרֵ֤י אֶל חֶ֨רֶב֙ הָי֣וּ אֶת עַמִּ֔/י לָ/כֵ֖ן סְפֹ֥ק אֶל יָרֵֽךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/017.yaml
  text: Cry out and wail[a], son of man, for it has come upon my people; it is upon all the princes of Israel. They are given over to the sword along with my people[b]; therefore strike your thigh.
  footnotes:
  - marker: a
    text: Or, 'Terrors because of the sword have come upon my people.' The Hebrew of this clause is difficult, and the exact force of מְגוּרֵי is debated.
    reason: alternative_reading
  - marker: b
    text: Striking the thigh is a gesture of grief, shock, or lament in prophetic literature.
    reason: cultural_note
translation:
  language: ko
  text: 외치며 통곡하라, 인자야. 그것이 내 백성에게 임하였고 — 이스라엘의 모든 지도자들 위에 있다. 그들은 내 백성과 함께 칼에 넘겨졌으니, 그러므로 네 허벅지를 치라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '칼로 인한 두려움들이 내 백성에게 닥쳤다.' 이 절의 히브리어는 어렵고, מְגוּרֵי의 정확한 힘은 논쟁적입니다.
    reason: alternative_reading
  - marker: b
    text: 허벅지를 치는 것은 예언문학에서 슬픔, 충격, 또는 애도의 몸짓입니다.
    reason: cultural_note
lexical_decisions:
- source_word: זְעַק
  english_pob_choice: Cry out
  chosen_korean: 외치며
  alternatives_korean:
  - 부르짖으며
  - 소리치며
  lexicon: HALOT
  rationale: 강한 비탄의 명령형으로서 단순한 '부르짖다'보다 행위의 즉시성과 긴박감을 살렸습니다.
- source_word: וְהֵילֵל
  english_pob_choice: wail
  chosen_korean: 통곡하라
  alternatives_korean:
  - 애곡하라
  - 울부짖어라
  lexicon: HALOT
  rationale: ילל의 애도와 통곡의 의미를 현대 한국어에서 자연스럽고 강하게 전달합니다.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  english_pob_choice: the princes of Israel
  chosen_korean: 이스라엘의 모든 지도자들
  alternatives_korean:
  - 이스라엘의 모든 방백들
  - 이스라엘의 모든 왕족들
  lexicon: HALOT
  rationale: '''נְשִׂיאִים''은 에스겔에서 통치자·유력자를 가리키므로, 현대 독자가 이해하기 쉬운 ''지도자들''로 옮기되 범위를 넓히는 ''모든''을 유지했습니다.'
- source_word: מְגוּרֵי אֶל חֶרֶב הָיוּ
  english_pob_choice: They are given over to the sword
  chosen_korean: 그들은 … 칼에 넘겨졌으니
  alternatives_korean:
  - 그들은 칼에 넘겨졌으니
  - 그들은 칼에 내맡겨졌으니
  lexicon: HALOT
  rationale: POB의 형식을 따라 '넘겨졌다'로 심판에 대한 수동적 인도를 드러내고, 출발점의 난해성을 고려해 본문에서는 간결하게 처리했습니다.
- source_word: סְפֹק אֶל יָרֵךְ
  english_pob_choice: strike your thigh
  chosen_korean: 네 허벅지를 치라
  alternatives_korean:
  - 네 허벅지를 치라
  - 네 넓적다리를 치라
  lexicon: HALOT
  rationale: 예언적 애도 동작을 문자적으로 살리면서도 한국어에서 이해 가능한 신체 부위 표현을 택했습니다.
theological_decisions:
- issue: מְגוּרֵי clause의 난해한 의미
  chosen_reading: 본문은 '칼에 넘겨졌다'로 옮기되, 원문이 담고 있는 해석상의 불확실성은 본문에서 과도하게 해소하지 않았습니다.
  alternative_readings:
  - '''칼로 인한 두려움들이 내 백성에게 닥쳤다'''
  - '''그들은 칼에 대한 공포에 사로잡혔다'''
  rationale: 히브리어 מְגוּרֵי의 정확한 힘이 논쟁적이므로, 번역문은 문맥상 확실한 심판의 도래를 유지하면서도 세부 해석은 단정하지 않습니다.
  doctrine_reference: Translation philosophy §3 (preserve genuine ambiguity)
