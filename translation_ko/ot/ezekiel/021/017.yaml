  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 두 번째 הִיא의 전치사구를 직역한 “지도자들 위에 있다”는 한국어에서 부자연스럽고, 재난/심판이 지도자들에게도 미친다는 뜻으로 옮기는 것이 문맥과 원문의 의미를 더 잘 전달합니다. 난해한 מְגוּרֵי אֶל־חֶרֶב 절을 “칼에 넘겨졌다”로 처리한 것은 영어 POB의 선택과 부합하며, 대안 해석은 각주에 보존해야 합니다.
  naturalness: “외치며 통곡하라”보다 병렬 명령인 “부르짖고 통곡하라”가 더 자연스럽고 원문의 두 명령을 분명히 드러냅니다. 또한 “~위에 있다”를 “~에게도 미쳤다”로 고쳐 현대 표준 한국어의 자연스러운 예언문 문체를 확보했습니다.
  terminology: “인자”, “이스라엘”, “칼”, “허벅지”는 적절합니다. נְשִׂיאֵי를 “지도자들”로 옮긴 것은 현대어로 무난합니다. “모든 지도자”로 다듬어 불필요한 복수 표지를 피했습니다.
