  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 עָוֺן קֵץ를 ‘끝의 죄악이 닥치는 때’로 옮기면서 ‘닥치는’의 주체를 죄악으로 바꾸었으나, 히브리어에서 ‘이르렀다’(בָּא)는 ‘그들의 날’을 수식합니다. 또한 원문의 목적 부정사 לָתֵת을 ‘두려는’으로 처리하고 뒤에 ‘때문입니다’를 보태어 인과관계를 도입했습니다. 본문은 ‘그 날이 … 이른 죽임당한 악인들’이라는 관계절과 ‘두기 위함’이라는 목적 구문을 보존해야 합니다.
  naturalness: ‘살육된’과 ‘목덜미 위’는 현대 한국어에서 다소 부자연스럽고, 히브리어 צַוְּאר는 일반적으로 ‘목’입니다. ‘죽임당한 악인들의 목 위’가 더 자연스러우면서도 난해한 이미지를 보존합니다. לָךְ는 이 문맥에서 칼을 향한 말이므로 ‘당신을 위해’보다 ‘너에 대하여’가 자연스럽고, 직접 호칭의 문맥도 유지합니다.
  terminology: שָׁוְא와 כָּזָב은 각각 ‘거짓 환상’과 ‘거짓’으로, קסם은 ‘점을 치다’로 옮겼습니다. עָוֺן은 죄악·죄과·처벌의 의미 범위를 지니므로 본문에서는 ‘죄과’를 사용하고, 대안은 각주에 남겼습니다. ‘끝’(קֵץ)을 ‘종말’로 신학적으로 확대하지 않았습니다.
