translation:
  language: ko
  text: 그들이 너에 대하여 거짓 환상을 보고 너에 대하여 거짓을 점치는 것은[a], 그 날이 끝의 죄과의 때에 이른 죽임당한 악인들의 목 위에 너를 두기 위함입니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 너에 대하여 거짓을 보고 너에 대하여 거짓을 점칠 때.’
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘죽임당한 악인들의 목 위에’는 난해한 이미지입니다. 이미 죽임당한 자들 가운데에 너를 넘어뜨린다는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘끝의 죄악의 때에’ 또는 ‘마지막 죄과의 때에’.
    reason: alternative_reading
