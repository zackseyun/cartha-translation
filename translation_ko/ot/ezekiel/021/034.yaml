revisions:
- from: 그들이 당신을 위해 거짓 환상을 보며 당신을 위해 거짓말로 점치고 있을 때, 당신을 그 살육된 악인들의 목덜미 위에 두려는 것입니다. 그들의 날이 끝의 죄악이 닥치는 때에 이르렀기 때문입니다.[a][b][c]
  to: 그들이 너에 대하여 거짓 환상을 보고 너에 대하여 거짓을 점치는 것은[a], 그 날이 끝의 죄과의 때에 이른 죽임당한 악인들의 목 위에 너를 두기 위함입니다.[b][c]
  rationale: 원문의 시간·목적 구조를 보존하고, ‘그 날이 이른’이라는 관계절을 올바르게 악인들에게 연결했습니다. 난해한 ‘목 위에’의 이미지는 본문에서 유지하되 해석적 가능성은 각주로 제한했습니다. 각주 표지도 해당 어구에 직접 배치했습니다.
