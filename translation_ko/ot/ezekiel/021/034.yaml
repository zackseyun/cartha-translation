    rationale: אֲשֶׁר בָּא יוֹמָם은 ‘그들의 날이 이른’이라는 관계절로서 ‘죽임당한 악인들’을 수식합니다. 초안의 ‘끝의 죄악이 닥치는 때에 … 이르렀기 때문입니다’는 원문에 없는 인과관계와 ‘죄악이 닥침’이라는 사건을 도입합니다.
