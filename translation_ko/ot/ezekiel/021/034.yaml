  text: while they see false visions for you and divine lies for you[a], to place you on the necks of the slain wicked[c][b], whose day has come at the time of the punishment of the end.
  footnotes:
  - marker: a
    text: Or 'when they see falsehood for you and divine deception for you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'on the necks of the slain wicked,' a difficult image; possibly meaning to bring you down among those already slain.
    reason: lexical_alternative
  - marker: c
    text: Or 'at the time of the iniquity of the end' or 'at the time of final guilt.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 당신을 위해 거짓 환상을 보며 당신을 위해 거짓말로 점치고 있을 때, 당신을 그 살육된 악인들의 목덜미 위에 두려는 것입니다. 그들의 날이 끝의 죄악이 닥치는 때에 이르렀기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 당신을 위해 거짓을 보고 당신을 위해 거짓으로 점친다.’
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘살육된 악인들의 목덜미 위에’는 난해한 이미지로, 이미 죽은 자들 가운데에 당신을 떨어뜨린다는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘끝의 죄악이 닥치는 때에’ 혹은 ‘마지막 죄과의 때에’.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֲזוֹת
  english_pob_choice: while they see
  chosen_korean: -을 때
  alternatives_korean:
