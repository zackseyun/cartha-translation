  lexicon: HALOT
  rationale: חזה의 부정사구를 시간 부사절로 옮겨, 점술 행위가 진행되는 상황을 자연스러운 한국어로 나타냈습니다.
- source_word: שָׁוְא
  english_pob_choice: false visions
  chosen_korean: 거짓 환상
  alternatives_korean:
  - 헛된 환상
  - 공허한 환상
  - 거짓된 환상
  lexicon: HALOT
  rationale: 예언적 문맥에서 שָׁוְא는 단순한 공허함보다 ‘거짓됨’의 뉘앙스가 강하므로 ‘거짓 환상’으로 옮겼습니다.
- source_word: בִּקְסָם כָּזָב
  english_pob_choice: and divine lies
  chosen_korean: 거짓말로 점치고
  alternatives_korean:
  - 거짓으로 점치고
  - 점술로 거짓말하고
  - 거짓된 점을 하며
  lexicon: HALOT
  rationale: קסם은 점술 행위이므로 동사로 풀고, כָּזָב은 점술의 내용이 ‘거짓말’임을 드러내도록 처리했습니다.
- source_word: אֶל צַוְּארֵי חַלְלֵי רְשָׁעִים
  english_pob_choice: to place you on the necks of the slain wicked
  chosen_korean: 그 살육된 악인들의 목덜미 위에 두려는 것입니다
  alternatives_korean:
  - 그 죽임당한 악인들의 목 위에 두려는 것입니다
  - 그 살해된 악인들의 목에 올려놓으려는 것입니다
  - 그 살육된 악인들 위에 두려는 것입니다
  lexicon: HALOT
  rationale: 희귀하고 난해한 이미지는 원문의 구체성을 살려 최대한 보존하되, 한국어에서는 ‘목덜미 위’로 옮겨 다소 생경한 은유를 유지했습니다.
- source_word: עֲוֺן קֵץ
  english_pob_choice: the punishment of the end
  chosen_korean: 끝의 죄악이 닥치는 때
  alternatives_korean:
  - 끝의 죄의 때
  - 종말의 죄과가 임하는 때
  - 마지막 죄악의 때
  lexicon: HALOT
  rationale: עָוֺן은 문맥상 ‘죄악/죄과’와 그 결과를 함께 품을 수 있어, 영어 POB의 해석적 처리를 지나치게 좁히지 않도록 ‘끝의 죄악이 닥치는 때’로 옮겼습니다.
theological_decisions:
- issue: 난해한 ‘목덜미 위에 두다’의 은유를 얼마나 풀어 쓸지
  chosen_reading: 은유를 크게 해석하지 않고, 원문의 생경함을 보존했습니다.
  alternative_readings:
  - 그 살육된 자들과 함께 넘어뜨리려는 뜻
  - 이미 죽은 자들 가운데에 끼워 넣으려는 뜻
  rationale: 본문의 시각적 긴장은 예언적 심판 선언의 효과에 속하므로, 과도한 설명을 넣기보다 원문의 거친 이미지를 유지하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §3
- issue: עֲוֺן קֵץ의 의미를 ‘죄악’ 중심으로 둘지 ‘심판’ 중심으로 둘지
  chosen_reading: ‘끝의 죄악이 닥치는 때’로 두어 죄와 심판의 결합을 함께 드러냈습니다.
  alternative_readings:
  - 끝의 심판 때
  - 마지막 죄과의 때
  - 종말의 벌이 임하는 때
  rationale: 예언서의 משפט/עון 계열 표현은 죄와 그 결과를 함께 가리키는 경우가 많아, 단일한 ‘심판’으로 평탄화하기보다 양가성을 남겼습니다.
  doctrine_reference: Translation philosophy §3
