id: EZK.21.10
reference: Ezekiel 21:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָֽדְעוּ֙ כָּל בָּשָׂ֔ר כִּ֚י אֲנִ֣י יְהוָ֔ה הוֹצֵ֥אתִי חַרְבִּ֖/י מִ/תַּעְרָ֑/הּ לֹ֥א תָשׁ֖וּב עֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/010.yaml
  text: And all flesh will know that I[a], Yahweh, have drawn my sword from its sheath; it will not return again.
  footnotes:
  - marker: a
    text: Or 'all humanity' or 'all people'; literally 'all flesh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 모든 육체가 내가, 야훼가, 내 칼을 칼집에서 빼낸 줄 알게 될 것입니다. 그것은 다시 돌아오지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 육체’는 문자적으로 ‘모든 살’이며, 관용적으로는 ‘모든 사람/온 인류’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ כָּל בָּשָׂר
  english_pob_choice: And all flesh will know
  chosen_korean: 그러므로 모든 육체가 … 알게 될 것입니다
  alternatives_korean:
  - 모든 사람이 … 알게 될 것입니다
  - 온 인류가 … 알게 될 것입니다
  lexicon: HALOT
  rationale: ‘כָּל בָּשָׂר’은 문자적으로 ‘모든 육체’이므로, POB처럼 범위를 넓히되 이미지가 살아 있는 표현을 본문에 유지했습니다.
- source_word: כִּי אֲנִי יְהוָה
  english_pob_choice: that I, Yahweh,
  chosen_korean: 내가, 야훼가,
  alternatives_korean:
  - 내가 야훼인 줄
  - 내가 주님인 줄
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 화자 식별의 강조를 살리기 위해 호격이 아니라 삽입적 동격으로 처리했습니다.
- source_word: הוֹצֵאתִי חַרְבִּי מִתַּעְרָהּ
  english_pob_choice: have drawn my sword from its sheath
  chosen_korean: 내 칼을 칼집에서 빼낸
  alternatives_korean:
  - 내 칼을 칼집에서 뽑은
  - 내 칼을 칼집에서 꺼낸
  lexicon: HALOT
  rationale: 전쟁 이미지와 ‘칼집’의 대응을 자연스럽게 살리기 위해 ‘빼내다’를 택했습니다. 영어 POB의 ‘drawn’과도 잘 맞습니다.
- source_word: לֹא תָשׁוּב עוֹד
  english_pob_choice: it will not return again
  chosen_korean: 다시 돌아오지 않을 것입니다
  alternatives_korean:
  - 더는 돌아오지 않을 것입니다
  - 결코 돌아오지 않을 것입니다
  lexicon: HALOT
  rationale: עוֹד의 ‘다시/더 이상’을 반영하면서도 과도한 절대화는 피하기 위해 ‘다시 돌아오다’로 옮겼습니다.
theological_decisions:
- issue: 여호와 대체어 처리
  chosen_reading: יהוה를 ‘야훼’로 음역해 하나님의 고유명을 본문에 직접 드러냈습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 이 절은 하나님의 이름을 직접 말하는 인식 공식이므로, 신학적·문헌학적 이유로 고유명 ‘야훼’를 보존하는 것이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘모든 육체’의 범위
  chosen_reading: 인간 전체를 가리키는 보편적 심판 경고로 읽었습니다.
  alternative_readings:
  - 이스라엘만 가리킴
  - 모든 생명체
  rationale: 에스겔의 문맥에서 ‘모든 육체’는 심판의 보편성을 강조하는 관용구이므로, 범위를 좁히지 않고 그대로 살렸습니다.
  doctrine_reference: Ezekiel 21의 심판 선포 문맥
