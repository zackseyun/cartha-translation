  source_fidelity: 첫 접속사 וְ는 단순 연결이며 ‘그러므로’라는 결론적 의미를 요구하지 않습니다. 또한 ‘내가, 야훼가’는 한국어 문장 구조상 화자 식별과 동작의 관계가 불분명합니다. 수정문은 ‘나 야훼가’로 원문의 강조된 화자 표지를 자연스럽게 반영하고, 칼이 다시 칼집으로 돌아가지 않는다는 여성 단수 동사의 지시 대상도 명시합니다.
  naturalness: ‘모든 육체’는 성서적 관용구로 유지할 수 있으나, 각주 표지를 해당 표현 바로 뒤에 두어 범위를 분명히 했습니다. ‘더 이상 … 돌아가지 않을 것입니다’는 현대 표준어 합쇼체에서 자연스럽고 עוֹד의 ‘더 이상’을 잘 반영합니다.
  terminology: יהוה는 프로젝트 방침대로 ‘야훼’로 유지했습니다. תער는 ‘칼집’, חרב는 ‘칼’로 일관되게 옮겼습니다. ‘모든 육체’의 문자적 어휘와 관용적 의미는 각주에서 구별했습니다.
