revisions:
- from: 그러므로 모든 육체가 내가, 야훼가, 내 칼을 칼집에서 빼낸 줄 알게 될 것입니다. 그것은 다시 돌아오지 않을 것입니다.[a]
  to: 모든 육체[a]는 나 야훼가 내 칼을 칼집에서 빼낸 것을 알게 될 것입니다. 그 칼은 더 이상 칼집으로 돌아가지 않을 것입니다.
  rationale: 결론 접속사 ‘그러므로’를 제거하여 원문의 단순 연결을 과잉 해석하지 않았습니다. 화자 식별 구문을 ‘나 야훼가’로 재구성하여 문법성과 원문 충실성을 함께 확보했습니다. 마지막 절의 주어가 칼임을 명시하고 ‘더 이상’으로 עוֹד의 의미를 자연스럽게 반영했습니다. 각주는 해당 관용구에 직접 연결되도록 옮기고, 본문의 ‘육체’와 각주의 직역 설명 사이의 혼동을 피하도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
