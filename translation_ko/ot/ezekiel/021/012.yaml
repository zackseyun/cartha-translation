revisions:
- from: 그리고 그 일이 있으리니, 그들이 당신에게 “무엇 때문에 신음하고 있습니까?”라고 말하면, 당신은 “소식 때문입니다. 그것이 오고 있기 때문입니다.”라고 말하십시오. 그러면 모든 마음이 녹고, 모든 손이 힘을 잃으며, 모든 영이 기가 꺾이고, 모든 무릎이 물처럼 될 것입니다. 보십시오, 그것이 오고 있으며, 일어날 것입니다. 주 여호와의 말입니다.[a][b]
  to: 그들이 네게 “왜 신음하고 있습니까?”라고 묻거든, 너는 “그 소식 때문입니다. 그것이 다가오고 있기 때문입니다.”라고 대답하십시오. 그러면 모든 마음이 녹고, 모든 손에 힘이 빠지며, 모든 기운이 꺾이고, 모든 무릎에서 물이 흐를 것입니다.[a] 보십시오, 그것이 다가오고 있으며 반드시 이루어질 것입니다. 주 야훼의 말입니다.[b]
  rationale: 도입절을 히브리어의 조건·시간 구문에 맞게 고치고, 무릎과 물의 난해한 이미지를 해석으로 대체하지 않고 보존했습니다. 각주 표지를 해당 단어·표현 가까이에 배치하고 내용을 바로잡았으며, 제공된 신명 방침에 맞추어 ‘야훼’를 사용했습니다. וְנִהְיָתָה는 임박한 심판의 확실한 성취를 나타내므로 ‘반드시 이루어질 것입니다’로 옮겼습니다.
