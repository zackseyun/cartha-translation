  - severity: medium
    issue: ‘모든 무릎이 물처럼 될 것입니다’
    rationale: תֵּלַכְנָה מַּיִם은 문자적으로 무릎에 물이 흐르는 모습을 말하는 이례적 표현입니다. ‘물처럼 되다’는 다른 성경적 관용구를 연상시키며 동사와 이미지를 변경합니다.
  - severity: medium
    issue: 각주 표지 위치와 a 각주의 직역 설명
    rationale: a 표지는 무릎 표현에, b 표지는 ‘소식’에 붙어야 합니다. 또한 ‘물을 향해/처럼 달리다’는 히브리어 구문을 정확히 설명하지 못합니다.
