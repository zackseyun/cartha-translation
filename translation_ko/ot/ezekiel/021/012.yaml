  source_fidelity: 수정이 필요합니다. וְהָיָה כִּי는 ‘그리고 그 일이 있으리니’가 아니라, 사람들이 묻는 상황을 도입하는 ‘그들이 … 묻거든/물으면’의 구문입니다. 또한 ‘모든 무릎이 물처럼 될 것입니다’는 원문의 ‘무릎들이 물을 흘리다/물이 흐르다’라는 이례적 표현을 다른 관용구로 바꾸어 버립니다. 원문의 모호성과 생생한 신체 이미지를 본문과 각주에서 보존하는 편이 안전합니다.
  naturalness: ‘네게’와 ‘대답하십시오’는 현대 한국어 성경 문맥에서 자연스럽고 합쇼체를 유지합니다. ‘모든 무릎에서 물이 흐를 것입니다’는 의도적으로 낯선 원문 이미지를 보존하지만, 각주로 이해를 돕습니다. ‘마음이 녹고’, ‘손에 힘이 빠지고’, ‘기운이 꺾이고’는 병렬성과 현대성을 함께 갖습니다.
  terminology: רוח은 이 문맥에서 인간의 기운·담력을 가리키므로 ‘기운’으로 옮겨 성령으로 오해될 가능성을 피했습니다. אֲדֹנָי יְהוִה는 제공된 신명 방침에 따라 ‘주 야훼’로 옮겼습니다. שְׁמוּעָה는 ‘소식’으로 유지하되, ‘보고/전갈’ 가능성을 각주에 제시합니다.
