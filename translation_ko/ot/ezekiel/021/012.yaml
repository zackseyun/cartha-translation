id: EZK.21.12
reference: Ezekiel 21:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי יֹאמְר֣וּ אֵלֶ֔י/ךָ עַל מָ֖ה אַתָּ֣ה נֶאֱנָ֑ח וְ/אָמַרְתָּ֡ אֶל שְׁמוּעָ֣ה כִֽי בָאָ֡ה וְ/נָמֵ֣ס כָּל לֵב֩ וְ/רָפ֨וּ כָל יָדַ֜יִם וְ/כִהֲתָ֣ה כָל ר֗וּחַ וְ/כָל בִּרְכַּ֨יִם֙ תֵּלַ֣כְנָה מַּ֔יִם הִנֵּ֤ה בָאָה֙ וְ/נִֽהְיָ֔תָה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/012.yaml
  text: And it shall be[a], when they say to you, ‘Why are you groaning?’ that you shall say, ‘Because of the news, for it is coming.’ Then every heart will melt, all hands will grow weak, every spirit will faint, and all knees will run with water. Look, it is coming, and it will happen[b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: 'Hebrew: ''all knees will run with water,'' a vivid idiom for terror and collapse; some understand it as knees becoming weak like water, others as loss of bodily control from fear.'
    reason: cultural_note
  - marker: b
    text: Or 'because of the report' for 'Because of the news.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 네게 “왜 신음하고 있습니까?”라고 묻거든, 너는 “그 소식 때문입니다. 그것이 다가오고 있기 때문입니다.”라고 대답하십시오. 그러면 모든 마음이 녹고, 모든 손에 힘이 빠지며, 모든 기운이 꺾이고, 모든 무릎에서 물이 흐를 것입니다.[a] 보십시오, 그것이 다가오고 있으며 반드시 이루어질 것입니다. 주 야훼의 말입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘모든 무릎이 물을 흘릴 것이다’입니다. 공포로 말미암은 쇠약을 나타내는 이례적이고 생생한 표현이며, 무릎이 물처럼 약해진다는 뜻 또는 공포로 인한 신체 통제 상실을 암시한다는 해석도 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘소식’은 ‘보고’ 또는 ‘전갈’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱנָח
  english_pob_choice: groaning
  chosen_korean: 신음하고 있습니까
  alternatives_korean:
  - 한숨 쉬고 있습니까
  - 신음하십니까
  lexicon: HALOT
  rationale: אָנַח의 수동형은 들리는 탄식과 신음의 의미를 가지므로, 약한 뉘앙스의 ‘한숨’보다 ‘신음’이 더 원문에 가깝습니다.
- source_word: שְׁמוּעָה
  english_pob_choice: the news
  chosen_korean: 소식
  alternatives_korean:
  - 보고
  - 전갈
  lexicon: HALOT
  rationale: 여기서는 다가오는 재앙에 대한 전달된 소식을 가리키므로, 현대 한국어에서 자연스럽고 무게를 유지하는 ‘소식’이 적절합니다.
- source_word: וְנָמֵס כָּל לֵב / וְרָפוּ כָל יָדַיִם / וְכִהֲתָה כָל רוּחַ
  english_pob_choice: every heart will melt / all hands will grow weak / every spirit will faint
  chosen_korean: 모든 마음이 녹고, 모든 손이 힘을 잃으며, 모든 영이 기가 꺾이고
  alternatives_korean:
  - 모든 마음이 녹아내리고, 모든 손이 무기력해지며, 모든 영이 희미해지고
  - 모든 마음이 녹고, 모든 손이 약해지며, 모든 기운이 꺾이고
  lexicon: HALOT
  rationale: 세 가지 병렬적 이미지—마음, 손, רוח—를 살려 각각 ‘녹고 / 힘을 잃으며 / 기가 꺾이고’로 옮겼습니다. ‘영’은 여기서 사람의 내적 기세를 가리키므로 성령이 아니라 일반적인 영으로 두었습니다.
- source_word: וְכָל בִּרְכַּיִם תֵּלַכְנָה מַּיִם
  english_pob_choice: all knees will run with water
  chosen_korean: 모든 무릎이 물처럼 될 것입니다
  alternatives_korean:
  - 모든 무릎에서 물이 흐를 것입니다
  - 모든 무릎이 물처럼 흐를 것입니다
  lexicon: HALOT
  rationale: 원문의 강렬한 관용구는 공포로 인한 무력함과 통제 상실을 나타냅니다. 한국어에서는 직역이 부자연스러워 ‘물처럼 될 것입니다’로 옮겨 의미를 보존했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 여호와
  alternatives_korean:
  - 주 하나님
  - 주 여호와 하나님
  lexicon: HALOT
  rationale: אֲדֹנָי와 יְהוָה가 결합된 호칭은 한국어에서 관례적으로 ‘주 여호와’로 처리해 이중 호칭의 중복을 피하면서도 신적 호칭을 드러냅니다.
theological_decisions:
- issue: ‘영’의 의미와 신적 영인지 여부
  chosen_reading: 여기서의 רוח은 사람의 내적 기운·담력을 가리키는 일반 명사로 보고 ‘영’으로 번역했습니다.
  alternative_readings:
  - 성령
  - 기운
  rationale: 문맥상 각 심장이 녹고 손이 약해지는 병렬 속에서 공포로 꺾이는 인간의 내적 상태를 묘사합니다. 따라서 신적 위격으로 오해될 수 있는 ‘성령’은 피했습니다.
  doctrine_reference: Ezekiel 21:12 문맥상 רוּחַ의 일반적 인간 내면 의미
