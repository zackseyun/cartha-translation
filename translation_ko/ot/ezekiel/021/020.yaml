  - 칼의 번쩍임
  lexicon: HALOT
  rationale: 희귀 명사로서 칼이 빛나며 번뜩이는 모습을 가리키므로, ‘번뜩임’으로 짧고 선명하게 살렸습니다.
- source_word: עֲשׂוּיָה לְבָרָק מְעֻטָּה לְטָבַח
  english_pob_choice: It is made for lightning ... drawn for slaughter
  chosen_korean: 번개를 위해 만들어졌고, 살육을 위해 날카롭게 되었습니다
  alternatives_korean:
  - 번개처럼 빛내도록 만들어졌고, 살육을 위해 다듬어졌습니다
  - 번개를 위해 만들어졌고, 도살을 위해 다듬어졌습니다
  lexicon: HALOT
  rationale: 마지막 구절은 난해하므로, 번개/빛남과 살육 준비라는 두 이미지를 한국어로 드러내되 ‘날카롭게 되다’로 칼의 전투적 준비 상태를 반영했습니다.
theological_decisions:
- issue: 예언적 심판 선언의 어조
  chosen_reading: 문맥상 하나님이 심판 도구인 칼을 세우시는 선언이므로, 직설적이고 단호한 문장으로 유지했습니다.
  alternative_readings:
  - 완곡하게 풀어 쓰는 번역
  - 상징성을 약화한 일반 서술
  rationale: 에스겔 21장의 심판 신탁은 충격과 긴박감을 의도하므로, 한국어도 그 긴장을 보존해야 합니다.
  doctrine_reference: 에스겔 21장 심판 신탁의 문맥
