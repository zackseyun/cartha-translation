  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 용기와 결심이 무너지는 상태이므로, 자연스러운 한국어로 ‘마음이 녹다’라고 옮겨 이미지와 의미를 함께 살렸습니다.
- source_word: וְהַרְבֵּה הַמִּכְשֹׁלִים
  english_pob_choice: and the stumbling blocks may be many
  chosen_korean: 걸려 넘어질 것들이 많게
  alternatives_korean:
  - 걸림돌들이 많게
  - 많은 사람이 넘어지게
  lexicon: HALOT
  rationale: 본문의 מִכְשׁוֹל은 문자적 ‘걸림돌’과 결과적 ‘넘어짐’ 둘 다 가능하므로, 본문 이미지와 의미를 함께 보존하는 표현을 택했습니다.
- source_word: אִבְחַת חָרֶב
  english_pob_choice: the flash of the sword
  chosen_korean: 칼의 번뜩임
  alternatives_korean:
