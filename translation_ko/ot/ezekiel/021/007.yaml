  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֶּן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל יְר֣וּשָׁלִַ֔ם וְ/הַטֵּ֖ף אֶל מִקְדָּשִׁ֑ים וְ/הִנָּבֵ֖א אֶל אַדְמַ֥ת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/007.yaml
  text: Son of man[a], set your face toward Jerusalem, and preach toward the sanctuaries, and prophesy against the land of Israel.
  footnotes:
  - marker: a
    text: Hebrew literally, 'let [your words] drip against the sanctuaries,' a prophetic idiom for speaking or preaching judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 예루살렘을 향하여 네 얼굴을 두고, 성소들을 향하여 예언하여 떨어뜨리며, 이스라엘 땅을 향하여 예언하라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘성소들을 향하여 [네 말이] 떨어지게 하라’는 뜻으로, 예언적 심판 선포를 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔에 대한 고정된 호칭으로서, 한국어에서는 관용적으로 굳은 ‘인자’를 살리되 호격 ‘-야’를 붙여 직접 부름의 기능을 드러냈습니다.
- source_word: שִׂים פָּנֶיךָ אֶל
  english_pob_choice: set your face toward
  chosen_korean: 네 얼굴을 두고
  alternatives_korean:
  - 네 얼굴을 향하여 두고
  - 네 얼굴을 돌려
  lexicon: HALOT
  rationale: 결단된 방향 설정을 나타내는 관용구이므로 직역적 이미지인 ‘얼굴을 두고’를 살리면서 자연스러운 한국어 어순으로 옮겼습니다.
- source_word: וְהַטֵּף
  english_pob_choice: preach against
  chosen_korean: 예언하여 떨어뜨리며
  alternatives_korean:
  - 전하여
  - 선포하여
  lexicon: HALOT
  rationale: 히브리어의 문자적 뜻인 ‘떨어뜨리다/방울져 흐르게 하다’라는 이미지를 살려, 심판 선포의 예언적 관용을 한국어로 드러냈습니다. 이는 단순한 설교 행위보다 하나님의 말씀이 쏟아져 나오는 뉘앙스를 보존합니다.
- source_word: מִקְדָּשִׁים
  english_pob_choice: the sanctuaries
  chosen_korean: 성소들을
  alternatives_korean:
  - 성전들을
  - 거룩한 곳들을
  lexicon: HALOT
  rationale: 히브리어 복수형을 반영해 단수화하지 않았고, 예배 공간의 성격을 살리기 위해 ‘성소들’로 옮겼습니다.
theological_decisions:
- issue: וְהִנָּבֵא אֶל אַדְמַת יִשְׂרָאֵל의 방향성과 심판 뉘앙스
  chosen_reading: ‘이스라엘 땅을 향하여 예언하라’로 옮겨, 목표 대상의 방향성을 유지하면서 심판 맥락은 문맥에 맡겼습니다.
  alternative_readings:
  - 이스라엘 땅을 대적하여 예언하라
  - 이스라엘 땅을 향하여 심판을 예언하라
  rationale: 본문의 אֶל은 표적/대상 방향을 표시하며, 여기서 반드시 ‘against’로 고정할 필요는 없습니다. 그러나 전체 문맥이 심판 선언이므로 ‘예언하라’ 자체가 충분히 그 힘을 전달합니다.
  doctrine_reference: 원어 우선 원칙; 문맥이 명시하는 심판 성격은 추가 해석어 없이 유지
