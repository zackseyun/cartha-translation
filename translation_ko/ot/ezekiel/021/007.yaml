  rationale: 히브리어의 문자적 뜻인 ‘떨어뜨리다/방울져 흐르게 하다’라는 이미지를 살려, 심판 선포의 예언적 관용을 한국어로 드러냈습니다. 이는 단순한 설교 행위보다 하나님의 말씀이 쏟아져 나오는 뉘앙스를 보존합니다.
- source_word: מִקְדָּשִׁים
  english_pob_choice: the sanctuaries
  chosen_korean: 성소들을
  alternatives_korean:
  - 성전들을
  - 거룩한 곳들을
  lexicon: HALOT
  rationale: 히브리어 복수형을 반영해 단수화하지 않았고, 예배 공간의 성격을 살리기 위해 ‘성소들’로 옮겼습니다.
theological_decisions:
- issue: וְהִנָּבֵא אֶל אַדְמַת יִשְׂרָאֵל의 방향성과 심판 뉘앙스
  chosen_reading: ‘이스라엘 땅을 향하여 예언하라’로 옮겨, 목표 대상의 방향성을 유지하면서 심판 맥락은 문맥에 맡겼습니다.
  alternative_readings:
  - 이스라엘 땅을 대적하여 예언하라
  - 이스라엘 땅을 향하여 심판을 예언하라
  rationale: 본문의 אֶל은 표적/대상 방향을 표시하며, 여기서 반드시 ‘against’로 고정할 필요는 없습니다. 그러나 전체 문맥이 심판 선언이므로 ‘예언하라’ 자체가 충분히 그 힘을 전달합니다.
  doctrine_reference: 원어 우선 원칙; 문맥이 명시하는 심판 성격은 추가 해석어 없이 유지
