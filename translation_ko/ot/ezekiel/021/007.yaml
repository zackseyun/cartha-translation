translation:
  language: ko
  text: 인자야, 예루살렘을 향하여 얼굴을 정하고, 성소들을 향하여 예언을 선포하고[a], 이스라엘 땅을 향하여 예언하라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘성소들을 향하여 [네 말을] 방울져 떨어뜨려라’라는 뜻입니다. 이는 예언적 심판 선포를 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
