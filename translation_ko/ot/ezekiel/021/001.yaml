  naturalness: ‘야훼의 말씀이 내게 임하여 이르셨습니다’는 한국어 성경 문체에 정착된 표현이면서도 현대 표준어 합쇼체에 맞습니다. 접속사 ‘그리고’는 히브리어 서두의 와우를 기계적으로 옮기지 않아도 되는 관용적 문맥이므로 생략할 수 있습니다.
