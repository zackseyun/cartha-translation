id: EZK.21.31
reference: Ezekiel 21:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הָסִיר֙ הַ/מִּצְנֶ֔פֶת וְ/הָרִ֖ים הָֽ/עֲטָרָ֑ה זֹ֣את לֹא זֹ֔את הַ/שָּׁפָ֣לָה הַגְבֵּ֔הַ וְ/הַ/גָּבֹ֖הַ הַשְׁפִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/031.yaml
  text: 'Thus says the Lord GOD: Remove the turban[a], and take off the crown. This will not remain the same: exalt the lowly[b], and humble the exalted.'
  footnotes:
  - marker: a
    text: Or, 'This shall be no more,' or 'This will not be as it was.' The Hebrew is terse and elliptical, emphasizing that the present order is being overturned.
    reason: alternative_reading
  - marker: b
    text: '''Turban'' may specifically refer to a priestly headdress; ''crown'' refers to royal authority. The verse announces the removal of established leadership symbols.'
    reason: cultural_note
translation:
  language: ko
  text: 주 야훼께서 이같이 말씀하십니다. 터번을 벗기고 왕관을 치우십시오. 이것은 더 이상 예전과 같지 않을 것입니다. 낮은 자를 높이고 높은 자를 낮추십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와
  lexicon: HALOT
  rationale: 합쇼체 본문에서 אֲדֹנָי와 יהוה의 중복성을 살리되, 한국어에서는 관용적으로 자연스러운 ‘주 하나님’이 가장 간결하게 대응합니다.
- source_word: הָסִיר הַמִּצְנֶפֶת
  english_pob_choice: Remove the turban
  chosen_korean: 터번을 벗기고
  alternatives_korean:
  - 터번을 제거하고
  - 관을 벗기고
  lexicon: HALOT
  rationale: מִצְנֶפֶת는 감싸는 머리쓰개이므로 ‘터번’이 직접적이며, 명령의 동작성을 살려 ‘벗기고’로 옮겼습니다.
- source_word: וְהָרִים הָעֲטָרָה
  english_pob_choice: and take off the crown
  chosen_korean: 왕관을 내려놓으십시오
  alternatives_korean:
  - 왕관을 벗기십시오
  - 왕관을 없애십시오
  lexicon: HALOT
  rationale: רום의 ‘들어 올리다’가 이 문맥에서는 권위의 표지를 치워 버리는 뜻으로 쓰이므로, 한국어로는 ‘내려놓다’가 가장 자연스럽게 그 전복적 뉘앙스를 전달합니다.
- source_word: זֹאת לֹא זֹאת
  english_pob_choice: This will not remain the same
  chosen_korean: 이것은 그대로 있지 않을 것입니다
  alternatives_korean:
  - 이것은 더 이상 이대로가 아닐 것입니다
  - 이것은 이렇게 남아 있지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 반복 표현이 현재 질서의 붕괴와 전환을 가리키므로, ‘그대로 있지 않을 것입니다’로 간결하게 재현했습니다.
- source_word: הַשָּׁפָלָה הַגְבֵּהַ / וְהַגָּבֹהַ הַשְׁפִּיל
  english_pob_choice: exalt the lowly, and humble the exalted
  chosen_korean: 낮은 자를 높이고, 높은 자를 낮추십시오
  alternatives_korean:
  - 비천한 자를 높이고, 높은 자를 낮추십시오
  - 낮은 자를 들어 올리고, 높은 자를 끌어내리십시오
  lexicon: HALOT
  rationale: 대구를 살리면서 שׁפל/גבה의 반전 구조를 직역에 가깝게 옮기되, 한국어에서 인격 대상임을 분명히 하기 위해 ‘자’를 보탰습니다.
theological_decisions:
- issue: 권위 표지의 전복과 사회적 반전
  chosen_reading: 터번과 왕관의 제거를 통해 제사장적·왕권적 표지가 뒤집히는 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 의복 교체로 읽는 해석
  - 예언적 과장으로만 약화시키는 해석
  rationale: 주석 전통과 영어 POB의 문화적 주석에 따라, 이 절은 단지 물건을 치우는 말이 아니라 기존 지도 질서의 전복을 선언합니다.
  doctrine_reference: POB source-note and cultural-note on symbolic reversal
- issue: זֹאת לֹא זֹאת의 압축된 표현
  chosen_reading: 현재 상태가 유지되지 않고 질서가 뒤바뀐다는 뜻으로 처리했습니다.
  alternative_readings:
  - ‘이것은 이것이 아니다’로 직역
  - ‘이것은 더 이상 없다’로 단정
  rationale: 히브리어의 생략된 구조가 주는 긴장과 모호성을 너무 좁히지 않으면서, 예언의 단절성을 한국어로 드러내기 위해서입니다.
  doctrine_reference: Preserve theological tension rather than resolve it
