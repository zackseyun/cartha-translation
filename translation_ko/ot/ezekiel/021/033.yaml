    text: Or 'their taunt' or 'their reviling.'
    reason: lexical_alternative
  - marker: c
    text: Or 'unsheathed for slaughter, burnished to devour, to flash like lightning.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너 사람아, 예언하고 이렇게 말하십시오. “주 야훼께서 이렇게 말씀하십니다. 암몬 자손[a]과 그들의 조롱[b]에 대하여 말씀하십니다.” 또 이렇게 말하십시오. “칼, 칼이 살육을 위해 뽑혔고, 삼키도록 닦여 번쩍이도록 하였습니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘암몬 사람들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 비방’, ‘그들이 받은 모욕’ 또는 ‘그들의 수치’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘살육을 위해 칼이 뽑혔고, 삼키도록 윤이 나게 닦여, 번쩍이도록 하였다’.
    reason: lexical_alternative
