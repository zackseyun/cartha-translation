  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם הִנָּבֵ֤א וְ/אָֽמַרְתָּ֙ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהֹוִ֔ה אֶל בְּנֵ֥י עַמּ֖וֹן וְ/אֶל חֶרְפָּתָ֑/ם וְ/אָמַרְתָּ֗ חֶ֣רֶב חֶ֤רֶב פְּתוּחָה֙ לְ/טֶ֣בַח מְרוּטָ֔ה לְ/הָכִ֖יל לְמַ֥עַן בָּרָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/033.yaml
  text: 'And you[a], son of man, prophesy and say, ‘Thus says the Lord GOD concerning the sons of Ammon and concerning their reproach’: And you shall say, ‘A sword, a sword, drawn for slaughter, polished for devouring[c][b], so that it flashes like lightning.’'
  footnotes:
  - marker: a
    text: Or 'the Ammonites.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their taunt' or 'their reviling.'
    reason: lexical_alternative
  - marker: c
    text: Or 'unsheathed for slaughter, burnished to devour, to flash like lightning.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너[ [a] ] 사람아, 예언하여 말하십시오. 「주 하나님께서 이렇게 말씀하십니다. 곧 암몬 자손과 그들의 수치에 대하여 말씀하십니다. 너는 또 이렇게 말하여라. ‘칼이여, 칼이여, 살육을 위하여 뽑혔고, 삼키기 위하여 닦여서 번개처럼 번뜩이게 되었도다[ [c] ][ [b] ]’」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘암몬 사람들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 조롱’ 혹은 ‘그들의 비방’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘칼이 뽑혀 살육을 위해, 빛나게 닦여 삼키도록, 번개처럼 번뜩이게 되어 있다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 사람아
  alternatives_korean:
  - 인자여
  - 인간아
  - 사람의 아들아
  lexicon: HALOT
  rationale: 에스겔서의 관용적 신적 호칭으로서, 직역보다 한국어에서 자연스럽고도 직접적인 부름말인 ‘사람아’가 문맥의 긴장을 잘 살립니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와 하나님
  - 주 하나님 여호와
  lexicon: HALOT
  rationale: 복합 호칭의 이중성을 살리면서 한국어에서 어색한 반복을 피하기 위해 ‘주 하나님’으로 옮겼습니다.
- source_word: חֶרְפָּתָם
  english_pob_choice: their reproach
  chosen_korean: 그들의 수치
  alternatives_korean:
  - 그들의 비방
  - 그들의 조롱
  - 그들의 욕됨
  lexicon: HALOT
  rationale: 문맥상 모욕·경멸·수치를 모두 아우를 수 있으나, 한국어에서는 관계적 모욕의 결과를 드러내는 ‘수치’가 가장 자연스럽습니다.
- source_word: פְּתוּחָה לְטֶבַח מְרוּטָה לְהָכִיל
  english_pob_choice: drawn for slaughter, polished for devouring
  chosen_korean: 살육을 위하여 뽑혔고, 삼키기 위하여 닦여서
  alternatives_korean:
  - 도살을 위하여 뽑혔고, 삼키기 위하여 번들거리게 닦여서
  - 학살을 위하여 뽑혔고, 먹어치우기 위하여 닦여서
  lexicon: HALOT
  rationale: 칼 이미지의 연쇄를 살리되, פְּתוּחָה는 ‘뽑히다/뽑혀 있다’의 군사적 관용을 반영하고, לְהָכִיל은 파괴적 ‘삼키다’로 옮겨 칼의 포식적 비유를 유지했습니다.
- source_word: לְמַעַן בָּרָק
  english_pob_choice: so that it flashes like lightning
  chosen_korean: 번개처럼 번뜩이게 되었도다
  alternatives_korean:
  - 번개같이 번쩍이게 하려고
  - 번개처럼 빛나게 되었도다
  lexicon: HALOT
  rationale: בָּרָק의 시각적 섬광을 한국어의 ‘번뜩이다’로 살려, 단순한 밝음이 아니라 위협적이고 순간적인 섬광을 드러냈습니다.
theological_decisions:
- issue: יהוה를 한국어로 어떻게 표기할지
  chosen_reading: 본문에는 ‘주 하나님’을 쓰고, 주석적 표기는 두지 않았습니다.
  alternative_readings:
  - 야훼
  - 여호와
  - 주 야훼
  rationale: 이 구절의 핵심은 야훼의 발언 형식이 아니라 예언 심판의 내용이므로, 본문 가독성을 위해 합성 호칭을 한국어 관용으로 처리했습니다.
  doctrine_reference: POB Korean naming convention for יְהוָה / YHWH
- issue: ‘칼이여, 칼이여’의 반복과 명령적 어조
  chosen_reading: 반복과 감탄형을 그대로 살려 칼의 심판 선포를 직접적으로 드러냈습니다.
  alternative_readings:
  - 칼아, 칼아
  - 칼이여, 칼이여
  rationale: 히브리어의 반복은 단순 장식이 아니라 예언적 긴급성과 강도를 드러내므로, 평이하게 축소하지 않고 그대로 살렸습니다.
  doctrine_reference: Prophetic rhetoric in Ezekiel
