theological_decisions:
- issue: יהוה를 한국어로 어떻게 표기할지
  chosen_reading: 본문에는 ‘주 하나님’을 쓰고, 주석적 표기는 두지 않았습니다.
  alternative_readings:
  - 야훼
  - 여호와
  - 주 야훼
  rationale: 이 구절의 핵심은 야훼의 발언 형식이 아니라 예언 심판의 내용이므로, 본문 가독성을 위해 합성 호칭을 한국어 관용으로 처리했습니다.
  doctrine_reference: POB Korean naming convention for יְהוָה / YHWH
- issue: ‘칼이여, 칼이여’의 반복과 명령적 어조
  chosen_reading: 반복과 감탄형을 그대로 살려 칼의 심판 선포를 직접적으로 드러냈습니다.
  alternative_readings:
  - 칼아, 칼아
  - 칼이여, 칼이여
  rationale: 히브리어의 반복은 단순 장식이 아니라 예언적 긴급성과 강도를 드러내므로, 평이하게 축소하지 않고 그대로 살렸습니다.
  doctrine_reference: Prophetic rhetoric in Ezekiel
