  to: 너는 칼이 암몬 자손의 랍바와 요새화된 예루살렘에 있는 유다로 오도록 길을 정해야 합니다.[a][b]
  rationale: 수정문은 길을 ‘정하다’로 옮겨 명령된 상징 행위의 성격을 보존하고, ‘요새화된 예루살렘에 있는 유다’로 번역하여 유다와 예루살렘 사이의 원문 위치 관계를 유지합니다. ‘향하여/대적하여’의 통사적 여지는 각주에서 제시하되, 본문은 목적지로서의 기본 표현을 유지했습니다.
