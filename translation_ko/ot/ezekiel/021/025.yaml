source:
  edition: WLC
  text: דֶּ֣רֶךְ תָּשִׂ֔ים לָ/ב֣וֹא חֶ֔רֶב אֵ֖ת רַבַּ֣ת בְּנֵֽי עַמּ֑וֹן וְ/אֶת יְהוּדָ֥ה בִ/ירוּשָׁלִַ֖ם בְּצוּרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/025.yaml
  text: You shall set a road for the sword to come to Rabbah of the Ammonites[b][a], and to Judah in fortified Jerusalem.
  footnotes:
  - marker: a
    text: Or 'against Rabbah of the sons of Ammon, and against Judah in fortified Jerusalem.' The Hebrew construction can be expressed in English either as movement toward or hostile advance against these places.
    reason: alternative_reading
  - marker: b
    text: Rabbah was the chief city of the Ammonites.
    reason: cultural_note
translation:
  language: ko
  text: 너는 칼이 암몬 자손의 랍바와 요새화된 예루살렘에 있는 유다로 오도록 길을 정해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘암몬 자손의 랍바를 향하여, 그리고 요새화된 예루살렘에 있는 유다를 향하여’로 옮길 수 있습니다. 히브리어 구문은 ‘~을 향하여’ 또는 ‘~을 대적하여’로 표현될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 랍바는 암몬 자손의 주요 도시였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: דֶּרֶךְ
  english_pob_choice: a road
  chosen_korean: 길
  alternatives_korean:
  - 도로
  - 길목
  - 로선
  lexicon: HALOT
  rationale: 군사적 진격의 길을 표시하는 문맥이므로 자연스러운 현대 한국어인 ‘길’로 옮기되, 인위적·기계적 느낌을 줄였습니다.
- source_word: תָּשִׂים לָבוֹא
  english_pob_choice: you shall set a road for the sword to come
  chosen_korean: 너는 칼이 오도록 길을 내야 합니다
  alternatives_korean:
  - 너는 칼을 위하여 길을 두어야 합니다
  - 너는 칼이 들어오게 길을 마련해야 합니다
  lexicon: HALOT
  rationale: שׂים의 ‘두다/놓다’와 בוא의 목적·결과를 함께 살리면서, 현대 한국어에서 ‘길을 내다’가 가장 자연스럽게 진군 경로를 마련하는 이미지를 전달합니다.
- source_word: חֶרֶב
  english_pob_choice: the sword
  chosen_korean: 칼
  alternatives_korean:
  - 칼날
  - 검
  lexicon: HALOT
  rationale: 예언서의 심판 도구로서의 무기를 한국어로 가장 직관적으로 전달할 수 있는 표현은 ‘칼’입니다. 여기서는 상징적·전쟁적 용법을 살려 자연스럽게 옮겼습니다.
- source_word: בְּצוּרָה
  english_pob_choice: fortified
  chosen_korean: 요새화된
  alternatives_korean:
  - 견고한
  - 성곽으로 둘러싸인
  - 성채화된
  lexicon: HALOT
  rationale: בְּצוּרָה의 요새화/성채화된 상태를 직접 반영해, ירושלים의 방어적 성격을 분명히 드러냈습니다.
theological_decisions:
- issue: אֵת רַבַּת בְּנֵי עַמּוֹן 및 וְאֶת יְהוּדָה의 방향성
  chosen_reading: 랍바와 유다/예루살렘을 칼이 향해 가는 두 목적지로 병렬 제시했습니다.
  alternative_readings:
  - ‘랍바와 유다를 향하여’처럼 단순 방향만 드러내는 읽기
  - ‘랍바와 유다를 치려고’처럼 노골적인 대적 의미를 전면화하는 읽기
  rationale: 히브리어 문장은 목적지/대상으로 읽을 수 있으며, 앞뒤 문맥의 전쟁 심판 이미지를 해치지 않으면서도 원문의 병렬 구조를 가장 잘 드러내기 위해 ‘오도록/가게 하여야 합니다’로 옮겼습니다.
  doctrine_reference: 예언적 심판 선언의 병렬 구조와 대상 지시
