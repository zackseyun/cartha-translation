  verdict: revise
  source_fidelity: 수정이 필요합니다. 본문은 칼의 진로가 암몬 자손의 랍바와 ‘요새화된 예루살렘에 있는 유다’라는 두 대상/목적지로 향함을 나타냅니다. 초안의 ‘유다, 곧 ... 예루살렘’은 유다와 예루살렘을 동격으로 단정하여 히브리어의 위치 표현 בִירוּשָׁלַיִם을 충분히 반영하지 못합니다. 또한 ‘길을 내다’는 실제 도로를 건설한다는 뜻으로도 쉽게 읽히므로, 여기의 표지 행위인 ‘길을 정하다’가 더 정확합니다.
  naturalness: ‘칼이 오도록 길을 정해야 합니다’와 ‘요새화된 예루살렘에 있는 유다로’는 현대 표준 한국어의 합쇼체로 자연스럽고, 원문의 목적 및 위치 관계를 분명하게 전달합니다.
  terminology: ‘칼’, ‘암몬 자손’, ‘랍바’, ‘요새화된 예루살렘’, ‘유다’는 원문의 전쟁 이미지와 지명·민족명을 적절히 보존합니다. ‘암몬 사람들’도 가능하지만 בְּנֵי עַמּוֹן의 직역적 표현인 ‘암몬 자손’이 본문에서 무리 없이 쓰입니다.
  issues:
  - severity: medium
    issue: ‘유다, 곧 요새화된 예루살렘’이 위치 관계를 동격 관계로 바꿉니다.
    rationale: 히브리어는 וְאֶת־יְהוּדָה 뒤에 בִירוּשָׁלַיִם בְּצוּרָה를 두어 유다와 예루살렘의 관계를 위치적으로 표현합니다. ‘유다, 곧 예루살렘’은 유다 전체와 그 수도를 동일시하는 인상을 주므로, ‘요새화된 예루살렘에 있는 유다’로 보존하는 편이 안전합니다.
