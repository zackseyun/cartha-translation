  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֥ה בֶן אָדָ֖ם הֵֽאָנַ֑ח בְּ/שִׁבְר֤וֹן מָתְנַ֨יִם֙ וּ/בִ/מְרִיר֔וּת תֵּֽאָנַ֖ח לְ/עֵינֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/011.yaml
  text: And you[a], son of man, groan with breaking loins, and in bitterness you shall groan before their eyes.
  footnotes:
  - marker: a
    text: Or 'with broken loins' / 'with breaking of the loins.' The Hebrew image expresses intense bodily anguish.
    reason: lexical_alternative
translation:
  language: ko
  text: 너, 인자야, 허리가 부서질 듯이 신음하고, 쓰라림 속에서 그들 앞에서 신음하여라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘허리가 부서질 듯이’는 히브리어의 ‘부서짐/파열’ 이미지를 살린 표현입니다. 직역하면 ‘부서지는 허리’ 또는 ‘부서진 허리’가 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 인간아
  - 너, 사람의 아들아
  lexicon: HALOT
  rationale: 에스겔서에서 반복되는 신적 호칭이므로, 관용적이면서도 책 전체의 반복성을 살리는 전통적 대응인 ‘인자’를 택했습니다.
- source_word: הֵאָנַח / תֵּאָנַח
  english_pob_choice: groan
  chosen_korean: 신음하다
  alternatives_korean:
  - 탄식하다
  - 괴로워하다
  - 끙끙거리다
  lexicon: HALOT
  rationale: אנח는 들리는 탄식·신음을 가리키므로, 육체적 고통과 애도의 강도를 함께 드러내는 ‘신음하다’가 적절합니다.
- source_word: בְּשִׁבְר֤וֹן מָתְנַ֨יִם֙
  english_pob_choice: with broken loins / with breaking loins
  chosen_korean: 허리가 부서질 듯이
  alternatives_korean:
  - 부서진 허리로
  - 허리의 부서짐으로
  - 허리가 깨진 채
  lexicon: HALOT
  rationale: 직역의 이미지를 유지하되 한국어에서 자연스럽게 읽히도록, ‘broken/breaking loins’의 신체적 격통을 ‘허리가 부서질 듯이’로 옮겼습니다.
- source_word: וּבִ/מְרִירוּת
  english_pob_choice: and in bitterness
  chosen_korean: 쓰라림 속에서
  alternatives_korean:
  - 쓴맛 속에서
  - 비통함 속에서
  - 쓴 마음으로
  lexicon: HALOT
  rationale: מְרִירוּת의 핵심은 단순 감정어보다 ‘쓴맛/쓰라림’의 질감이므로, 추상명사와 감각을 함께 살리는 ‘쓰라림 속에서’를 선택했습니다.
- source_word: לְ/עֵינֵי/הֶם
  english_pob_choice: before their eyes
  chosen_korean: 그들 앞에서
  alternatives_korean:
  - 그들 눈앞에서
  - 그들이 보는 앞에서
  - 그들 보기에
  lexicon: HALOT
  rationale: 히브리어 관용구의 공개적·가시적 의미를 자연스러운 한국어 관용으로 옮기되, 수치와 공개성을 유지하기 위해 ‘그들 앞에서’로 렌더링했습니다.
theological_decisions:
- issue: 두 번째 동사의 명령/미래형 뉘앙스
  chosen_reading: ‘신음하여라’로 명령형의 강한 촉구를 살리되, 앞의 문맥에 맞게 예언적 지시로 읽었습니다.
  alternative_readings:
  - ‘신음할 것이다’
  - ‘신음해야 한다’
  - ‘신음하라’
  rationale: 히브리어 imperfect는 여기서 예언적 지시의 힘을 띠므로, 한국어에서는 합쇼체 문맥을 해치지 않는 범위에서 명령형으로 옮기는 것이 가장 자연스럽습니다.
  doctrine_reference: 예언서의 수행적 명령 형식
- issue: 몸의 이미지(허리/신음)의 직설성
  chosen_reading: 신체 이미지를 완화하지 않고 그대로 드러냈습니다.
  alternative_readings:
  - ‘고통 가운데’
  - ‘몹시 괴로워’
  rationale: 문맥은 에스겔의 상징행동으로서 극심한 육체적 고통을 의도하므로, 완곡화하면 예언 행위의 충격과 상징성이 약해집니다.
  doctrine_reference: 예언적 상징행위
