id: EZK.21.14
reference: Ezekiel 21:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֶּן אָדָ֕ם הִנָּבֵא֙ וְ/אָ֣מַרְתָּ֔ כֹּ֖ה אָמַ֣ר אֲדֹנָ֑/י אֱמֹ֕ר חֶ֥רֶב חֶ֛רֶב הוּחַ֖דָּה וְ/גַם מְרוּטָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/014.yaml
  text: 'Son of man[a], prophesy and say, ‘Thus says the Lord GOD: Say, “A sword, a sword, sharpened and also polished.”’'
  footnotes:
  - marker: a
    text: Or 'burnished' for 'polished.' The Hebrew term suggests a sword made smooth and gleaming for slaughter.
    reason: lexical_alternative
translation:
  language: ko
  text: 「인자야, 예언하고 말하십시오. 주께서 이렇게 말씀하십니다. ‘칼, 칼이 날카롭게 벼려졌고 또 윤이 났습니다.’」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘윤이 났습니다’로 옮긴 말은 칼을 닦아 매끈하고 빛나게 했다는 뜻이며, ‘번쩍이게 닦였습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서의 정해진 호칭을 살리되, 현대 한국어에서 호소형으로 자연스럽게 들리도록 ‘인자야’로 옮겼습니다.
- source_word: הִנָּבֵא וְאָמַרְתָּ
  english_pob_choice: prophesy and say
  chosen_korean: 예언하여 말하라
  alternatives_korean:
  - 예언하고 말하라
  - 예언하여 이르라
  lexicon: HALOT
  rationale: 연속 명령의 기능을 분명히 하면서도, 히브리어의 예언 선포 동사를 현대 한국어 명령문으로 간결하게 반영했습니다.
- source_word: אֲדֹנָי
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 본문의 주어는 신적 칭호이므로 POB 기본 원칙에 따라 ‘야훼’를 사용했고, 한국어에서는 ‘주’와 결합해 엄숙한 선지자 공식을 유지했습니다.
- source_word: חֶרֶב חֶרֶב הוּחַדָּה וְגַם מְרוּטָה
  english_pob_choice: A sword, a sword, sharpened and also polished
  chosen_korean: 칼이여, 칼이여, 날카롭게 벼려졌고 또한 윤이 났습니다
  alternatives_korean:
  - 칼이여, 칼이여, 날카롭게 되었고 또한 닦였습니다
  - 칼이여, 칼이여, 예리하게 갈렸고 또한 윤이 났습니다
  lexicon: HALOT
  rationale: 반복된 ‘칼’의 강한 호소성을 살리면서, ‘벼리다’와 ‘윤이 나다’로 무기 준비의 폭력적 이미지를 과장 없이 전달했습니다.
theological_decisions:
- issue: 예언 공식 안의 신적 칭호를 한국어로 어떻게 구분할지
  chosen_reading: ‘주 야훼께서 이렇게 말씀하십니다’로 옮겨, 선지자적 공식과 신적 발화를 분명히 했습니다.
  alternative_readings:
  - 주께서 말씀하십니다
  - 주 하나님께서 말씀하십니다
  rationale: 에스겔의 공식 문구를 평이하게 만들기보다, 신적 발화의 장중함과 본문의 직접성을 보존하는 쪽이 원문의 기능에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: יְהוָה default ''야훼''; divine titles translated distinctly'
- issue: 직접 인용 내부의 명령형 화법
  chosen_reading: 인자에게 주는 명령은 높임말 호소형으로, 인용된 칼에 대한 말은 의인화된 호명으로 처리했습니다.
  alternative_readings:
  - 전부 평서형으로 통일
  - 인용부도 모두 높임말로 처리
  rationale: 원문은 선지자에게 향한 명령과 그 안의 시적 호명법이 다르므로, 한국어에서도 기능 차이를 드러내는 것이 소스 충실도에 더 적합합니다.
  doctrine_reference: Korean style and discourse representation in prophetic speech
