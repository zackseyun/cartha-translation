id: EZK.21.5
reference: Ezekiel 21:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֹמַ֕ר אֲהָ֖הּ אֲדֹנָ֣/י יְהוִ֑ה הֵ֚מָּה אֹמְרִ֣ים לִ֔/י הֲ/לֹ֛א מְמַשֵּׁ֥ל מְשָׁלִ֖ים הֽוּא׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/005.yaml
  text: Then I said[a], “Ah, Lord GOD! They are saying of me[b], ‘Is he not a speaker of parables?’”
  footnotes:
  - marker: a
    text: Or 'They are saying to me, “Is he not speaking parables?”' The Hebrew may be taken either as what they say to Ezekiel or as what they say about him.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'mashal mashalim,' literally 'one who speaks parables/proverbs.' The phrase can also suggest figurative or enigmatic speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 제가 말씀드렸습니다. “아, 주 야훼님! 그들이 저를 두고 ‘그는 비유를 풀이하는 자가 아니냐?’ 하고 말하고 있습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 나에게 “그는 비유를 말하는 자가 아니냐?” 하고 말하고 있습니다.’로도 옮길 수 있습니다. 히브리어는 예언자에게 직접 하는 말로도, 그에 대한 평으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘mashal mashalim’은 문자적으로 ‘비유들을 말하는 자’이며, 비유적이거나 난해한 말투를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: Then I said
  chosen_korean: 그때 제가 말씀드렸습니다
  alternatives_korean:
  - 그리고 제가 말했습니다
  - 그러자 제가 말했습니다
  lexicon: HALOT
  rationale: 와우-연속형 1인칭 동사는 서술의 진행을 나타내므로, 한국어에서는 자연스러운 순서 표지로 ‘그때/그러자’를 살려 문맥의 흐름을 유지했습니다.
- source_word: אֲהָהּ
  english_pob_choice: Ah
  chosen_korean: 아
  alternatives_korean:
  - 아아
  - 슬프도다
  lexicon: HALOT
  rationale: 탄식과 당혹을 드러내는 감탄사이므로, 과도하게 옛스러운 표현보다 현대 한국어의 짧은 탄식어 ‘아’가 가장 무난합니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: Lord GOD
  chosen_korean: 주 야훼님
  alternatives_korean:
  - 주 하나님
  - 주 여호와님
  lexicon: HALOT
  rationale: 주격 호칭 ‘아도나이’와 신명 ‘야훼’를 함께 반영하되, 한국어에서는 직접호칭의 존칭형을 써서 ‘주 야훼님’으로 옮겼습니다. 이는 본문이 선지자의 탄식 속 하나님께 직접 아뢰는 말이라는 점을 드러냅니다.
- source_word: מְמַשֵּׁל מְשָׁלִים
  english_pob_choice: a speaker of parables
  chosen_korean: 비유를 풀이하는 자
  alternatives_korean:
  - 비유를 말하는 자
  - 수수께끼를 말하는 자
  - 비유를 하는 자
  lexicon: HALOT
  rationale: 반복 구조는 단순히 ‘말하다’보다 비유적 발화를 가리키므로, 한국어에서는 ‘비유를 풀이하다’로 옮겨 원문의 관용적·해석적 성격을 살렸습니다. 여기서 ‘풀이하다’는 내용 자체를 설명하는 것이 아니라, 사람들이 예언자의 말투를 비유적으로 받아들인다는 뉘앙스를 담습니다.
- source_word: הֲלֹא
  english_pob_choice: Is he not
  chosen_korean: 그는 ... 아니냐
  alternatives_korean:
  - 그가 ... 아니냐
  - 그는 ... 아닌가
  lexicon: HALOT
  rationale: 반문형 질문을 한국어의 종결 의문형으로 옮겨, 사람들의 평가가 사실상 비난 섞인 확인 질문임을 보존했습니다.
theological_decisions:
- issue: 아도나이 + 야훼의 복합 호칭 번역
  chosen_reading: ‘주 야훼님’으로 옮겨 선지자의 직접 호소와 하나님의 고유 이름을 함께 드러냅니다.
  alternative_readings:
  - ‘주 하나님님’
  - ‘주 여호와님’
  rationale: 본문은 신성호칭의 결합을 사용하므로, 하나님의 이름을 지우지 않으면서도 한국어에서 직접호칭의 공손성을 유지하는 표현을 택했습니다. 전통적 관용어 ‘여호와’ 대신 ‘야훼’를 사용해 본문 언어의 직접성을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 사람들의 발언이 ‘나에게’인지 ‘나에 관하여’인지
  chosen_reading: ‘그들이 저를 두고 … 하고 말하고 있습니다’로 처리해, 발화 내용이 예언자 자신에 대한 평가임을 드러냅니다.
  alternative_readings:
  - ‘그들이 저에게 … 하고 말하고 있습니다’
  - ‘그들이 제게 … 하고 말하고 있습니다’
  rationale: 히브리어 לִי는 문맥상 단순한 수신자 표지보다 ‘나에 관하여’라는 의미가 강할 수 있으므로, 한국어에서는 ‘저를 두고’로 자연스럽게 나타냈습니다. 이는 사람들의 비꼬는 평판을 더 분명하게 전달합니다.
  doctrine_reference: 문맥상 담화 방향의 해석
