translation:
  language: ko
  text: 내가 내 분노를 너에게 쏟아붓고, 내 진노의 불을 너를 향해 내뿜겠습니다. 그리고 내가 너를 포악한 사람들[a], 곧 파괴의 장인들[b]의 손에 넘겨주겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사나운 사람들’; 문자적으로는 ‘불타는 사람들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘파괴에 능한 사람들’이나 ‘멸망의 장인들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַכְתִּי עָלַיִךְ זַעְמִי
  english_pob_choice: And I will pour out my indignation on you
  chosen_korean: 내가 내 분노를 너에게 쏟아붓고
  alternatives_korean:
  - 내가 내 진노를 너에게 쏟고
  - 내가 내 격분을 너에게 쏟아붓고
  lexicon: HALOT
  rationale: שָׁפַךְ의 ‘붓다’ 이미지를 살려 ‘쏟아붓다’로 옮겼고, זַעַם은 심판 맥락의 강한 분노를 자연스럽게 드러내는 ‘분노’로 렌더링했습니다.
- source_word: בְּאֵשׁ עֶבְרָתִי אָפִיחַ עָלַיִךְ
  english_pob_choice: with the fire of my wrath I will blow on you
  chosen_korean: 내 진노의 불로 너에게 불을 내뿜겠습니다
  alternatives_korean:
  - 내 진노의 불로 너에게 숨을 불어넣겠습니다
  - 내 진노의 불로 너에게 불어대겠습니다
  lexicon: HALOT
  rationale: אָפִיחַ의 ‘불다/내뿜다’ 이미지를 살리되 한국어에서 더 자연스럽게 들리도록 ‘불을 내뿜겠습니다’로 옮겼습니다. עֶבְרָה는 심판의 격렬한 ‘진노’로 처리했습니다.
- source_word: וּנְתַתִּיךְ בְּיַד אֲנָשִׁים בֹּעֲרִים
  english_pob_choice: and I will give you into the hand of brutal men
  chosen_korean: 그리고 내가 너를 포악한 사람들[a]의 손에 넘겨주겠습니다
  alternatives_korean:
  - 그리고 내가 너를 잔혹한 사람들의 손에 넘겨주겠습니다
  - 그리고 내가 너를 불타는 사람들의 손에 넘겨주겠습니다
  lexicon: HALOT
  rationale: בֹּעֲרִים의 문자적 ‘불타는’ 이미지는 문맥상 파괴적이고 폭력적인 사람들을 가리키므로, 의미를 드러내는 ‘포악한 사람들’로 옮겼습니다.
- source_word: חָרָשֵׁי מַשְׁחִית
  english_pob_choice: craftsmen of destruction
  chosen_korean: 곧 파괴의 장인들[b]
  alternatives_korean:
  - 곧 멸망의 장인들
  - 곧 파괴에 능한 사람들
  lexicon: HALOT
  rationale: חָרָשׁ을 단순히 추상화하기보다 ‘장인들’로 살려, 파괴를 능숙하게 만들어 내는 자들이라는 은유를 보존했습니다.
theological_decisions:
- issue: 서로 다른 두 분노 표현(זַעַם / עֶבְרָה)의 구분
  chosen_reading: ‘분노’와 ‘진노’로 구분해 반복 속의 점층을 드러냈습니다.
  alternative_readings:
  - 두 표현을 모두 ‘진노’로 통일하기
  - 두 표현을 모두 ‘분노’로 통일하기
  rationale: 히브리어는 인접한 두 분노 어휘를 겹치게 사용해 심판의 강도를 높입니다. 한국어에서도 같은 말로 평면화하지 않고 약간의 차이를 두어 수사적 압박을 보존했습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
