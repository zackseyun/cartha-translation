  text: וְ/שָׁפַכְתִּ֤י עָלַ֨יִ/ךְ֙ זַעְמִ֔/י בְּ/אֵ֥שׁ עֶבְרָתִ֖/י אָפִ֣יחַ עָלָ֑יִ/ךְ וּ/נְתַתִּ֗י/ךְ בְּ/יַד֙ אֲנָשִׁ֣ים בֹּֽעֲרִ֔ים חָרָשֵׁ֖י מַשְׁחִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/036.yaml
  text: And I will pour out my indignation on you[a]; with the fire of my wrath I will blow on you, and I will give you into the hand of brutal men[b], craftsmen of destruction.
  footnotes:
  - marker: a
    text: Or 'fierce men'; literally 'burning men.'
    reason: lexical_alternative
  - marker: b
