base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/019.yaml
  text: And you[a], son of man, prophesy and strike palm to palm, and let the sword be doubled a third time—the sword of the slain. It is the sword of the great slain one[c][b], the one that presses in on them.
  footnotes:
  - marker: a
    text: Or 'clap your hands.' The Hebrew literally says 'strike palm to palm,' describing a prophetic gesture.
    reason: lexical_alternative
  - marker: b
    text: Or 'threefold.' The Hebrew expression may denote the sword being intensified to a third stroke or made threefold.
    reason: lexical_alternative
  - marker: c
    text: Or 'that penetrates them.' The final participle can convey the sword's pressing in, entering, or surrounding effect.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 사람아, 예언하고 손바닥을 서로 치며, 칼을 세 번이나 두 배로 하라. 죽임을 당한 자들의 칼, 곧 그들을 향해 밀려드는 큰 칼이 죽임을 당한 자들의 칼이다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '손바닥을 치라.' 히브리어는 문자적으로 '손바닥을 서로 친다'고 하여 예언적인 제스처를 묘사합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '세 번.' 히브리어 표현은 칼이 세 번째 타격으로 강화되거나 세 배가 됨을 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 '그들을 관통하는.' 마지막 분사형은 칼이 밀려들거나 들어오거나 둘러싸는 효과를 전달할 수 있습니다.
    reason: alternative_reading
