  source_fidelity: 수정이 필요합니다. 초안의 ‘남아 있지 않겠습니까?’는 한국어에서 ‘남아 있을 것’이라는 긍정적 기대를 묻는 말로도 쉽게 읽혀, לֹא יִהְיֶה(‘없게 되다/존재하지 않다’)의 부정을 흐릴 수 있습니다. וּמָה אִם의 난해한 수사 의문은 ‘…없어진다면, 어떻게 되겠습니까?’로 옮기면 원문의 조건적·반문적 성격을 보존합니다.
  naturalness: ‘왜냐하면 시험이 있기 때문입니다’와 ‘…어떻게 되겠습니까?’는 현대 표준어 합쇼체에서 자연스럽습니다. 각주 표지는 해당 어구 바로 뒤에 두어 참조 대상이 분명하도록 조정했습니다.
  terminology: שֵׁבֶט은 문맥상 ‘홀’로 유지하되 어휘 범위는 각주로 밝혔습니다. אֲדֹנָי יְהוִה는 제공된 POB 신명 방침에 맞추어 ‘주 야훼’로 옮겼습니다. מֹאֶסֶת의 능동 의미는 ‘멸시하는’으로 보존했습니다.
