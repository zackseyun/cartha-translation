id: EZK.21.18
reference: Ezekiel 21:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י בֹ֔חַן וּ/מָ֕ה אִם גַּם שֵׁ֥בֶט מֹאֶ֖סֶת לֹ֣א יִֽהְיֶ֑ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/018.yaml
  text: For there is a testing[b][a]; and what if even the scepter that despises will not remain? declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or, 'For there is a testing; and what if even the despising scepter will be no more?' The Hebrew of this verse is notably difficult, especially the clause about the scepter.
    reason: alternative_reading
  - marker: b
    text: Hebrew שֵׁבֶט can mean 'scepter,' 'rod,' or 'tribe.' Here 'scepter' is chosen because the context favors royal/judicial imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 시험이 있습니다. 그리고 심지어 멸시하는 그 홀이 남아 있지 않겠습니까? 주 하나님께서 말씀하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 어렵습니다. 특히 홀에 관한 절은 ‘멸시하는 홀이 남아 있지 않겠느냐’ 또는 ‘멸시하는 홀이 더 이상 없게 되지 않겠느냐’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: שֵׁבֶט은 ‘홀’, ‘지팡이’, ‘막대기’, ‘지파’ 등을 뜻할 수 있습니다. 여기서는 문맥상 왕권과 재판의 상징인 ‘홀’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי בֹחַן
  english_pob_choice: For there is a testing
  chosen_korean: 그런 시험이 있습니다
  alternatives_korean:
  - 시험이 있습니다
  - 연단이 있습니다
  - 검증이 있습니다
  lexicon: HALOT
  rationale: בֹחַן의 간결한 명사적 표현을 살려 사건의 성격을 먼저 제시하면서, 한국어에서는 매끄럽게 ‘그런 시험’으로 받아 주었습니다.
- source_word: וּמָה אִם גַּם
  english_pob_choice: and what if even
  chosen_korean: 그리고 심지어 … 않겠습니까
  alternatives_korean:
  - 그리고 만일 …
  - 그런데 심지어 …
  - 그리고 … 일까요
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문과 강조를 자연스러운 합쇼체 의문으로 옮기되, 조건적 긴장과 반문성을 유지했습니다.
- source_word: שֵׁבֶט
  english_pob_choice: scepter
  chosen_korean: 홀
  alternatives_korean:
  - 지팡이
  - 막대기
  - 홀
  lexicon: HALOT
  rationale: 문맥상 통치권을 가리키는 왕권 이미지가 강하므로 ‘홀’로 옮겨 POB의 ‘scepter’ 선택을 한국어로 반영했습니다.
- source_word: מֹאֶסֶת לֹא יִהְיֶה
  english_pob_choice: the scepter that despises will not remain
  chosen_korean: 멸시하는 그 홀이 남아 있지 않겠습니까
  alternatives_korean:
  - 멸시하는 그 홀은 없어지지 않겠습니까
  - 멸시하는 홀이 남아 있지 않겠습니까
  - 멸시하는 그 홀은 존재하지 않겠습니까
  lexicon: HALOT
  rationale: מֹאֶסֶת의 능동적 분사적 성격을 살려 ‘멸시하는’으로 꾸미고, לֹא יִהְיֶה를 상황상 ‘남아 있지 않다’로 풀어 생존/지속 부정을 드러냈습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와 하나님
  - 주 하나님
  lexicon: HALOT
  rationale: 한국어 본문에서는 합쇼체 예언 공식에 맞게 ‘주 하나님’으로 옮기되, 아도나이+여호와 결합의 엄숙한 호칭을 유지했습니다.
theological_decisions:
- issue: אָדֹנָי + יְהוִה의 합성 호칭 처리
  chosen_reading: ‘주 하나님’으로 통합해 번역하고, 중복된 ‘주 주’ 형태는 피합니다.
  alternative_readings:
  - ‘주 야훼’
  - ‘주 하나님 야훼’
  rationale: 한국어 예언문에서 어색한 반복을 피하면서도, 본문의 공식적 신적 발화를 자연스럽고 엄숙하게 전달합니다.
  doctrine_reference: 'POB contested terms: divine title rendering in prophetic formulas'
