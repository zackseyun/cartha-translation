reference: Ezekiel 21:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/אֵ֤שׁ תִּֽהְיֶה֙ לְ/אָכְלָ֔ה דָּמֵ֥/ךְ יִהְיֶ֖ה בְּ/ת֣וֹךְ הָ/אָ֑רֶץ לֹ֣א תִזָּכֵ֔רִי כִּ֛י אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/037.yaml
  text: You will be fuel for the fire; your blood will be in the midst of the land. You will not be remembered[a], for I, Yahweh, have spoken.
  footnotes:
  - marker: a
    text: Or, 'your bloodguilt will be in the midst of the land.' The Hebrew literally reads 'your blood,' which in context may imply bloodshed or bloodguilt.
    reason: lexical_alternative
translation:
  language: ko
  text: 불에 탈 땔감이 될 것입니다. 당신의 피가 그 땅 한가운데에 있을 것입니다. 당신은 기억되지 않을 것입니다[a]. 나 야훼가 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 피의 죄가 그 땅 한가운데에 있을 것입니다.’ 히브리어는 문자적으로 ‘당신의 피’라고 되어 있으나, 문맥상 피흘림이나 피의 죄를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵשׁ תִּהְיֶה לְאָכְלָה
  english_pob_choice: for the fire; fuel for the fire
  chosen_korean: 불에 탈 땔감이 될 것입니다
  alternatives_korean:
  - 불의 먹이가 될 것입니다
  - 불에 타는 연료가 될 것입니다
  lexicon: HALOT
  rationale: לְאָכְלָה는 불에 의해 ‘먹히는 것’, 곧 소모될 대상을 가리키므로, 한국어에서는 자연스럽고 이미지가 살아 있는 ‘땔감’으로 옮겼습니다.
- source_word: דָּמֵךְ
  english_pob_choice: your blood
  chosen_korean: 당신의 피
  alternatives_korean:
  - 당신의 피흘림
  - 당신의 피의 죄
  lexicon: HALOT
  rationale: 본문은 문자적으로 ‘당신의 피’라고 말하므로, 혈흔/피흘림의 함의를 주석으로 덧붙이지 않고 직접 옮겨 원문의 이미지를 보존했습니다.
- source_word: בְּתוֹךְ הָאָרֶץ
  english_pob_choice: in the midst of the land
  chosen_korean: 그 땅 한가운데에
  alternatives_korean:
  - 그 땅 가운데에
  - 그 땅 안에
  lexicon: HALOT
  rationale: בְּתוֹךְ의 공적이고 노출된 공간감을 살리기 위해 단순한 ‘안에’보다 ‘한가운데에’가 더 적합합니다.
- source_word: לֹא תִזָּכֵרִי
  english_pob_choice: you will not be remembered
  chosen_korean: 당신은 기억되지 않을 것입니다
  alternatives_korean:
  - 당신은 기억되지 못할 것입니다
  - 당신은 언급되지 않을 것입니다
  lexicon: HALOT
  rationale: 니팔형 זכר는 수동적으로 ‘기억되다’의 의미가 자연스러우므로, 현대 한국어에서 가장 مستقیم한 ‘기억되지 않을 것입니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신성호칭은 전통 대체어가 아니라 고유명사로 드러내는 것이 원문의 명명 방식을 보존하므로, 프로젝트 기본값대로 ‘야훼’를 사용했습니다.
- source_word: דִּבַּרְתִּי
  english_pob_choice: have spoken
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말해 두었습니다
  - 말하였습니다
  lexicon: HALOT
  rationale: 예언적 판결문 공식의 종결성을 살리면서도 현대 문체에 자연스럽게 맞도록 ‘말했습니다’로 옮겼습니다.
theological_decisions:
- issue: דָּמֵךְ의 의미를 ‘피’로 둘지 ‘피의 죄/피흘림’으로 풀지
  chosen_reading: 본문에는 주석 없이 ‘당신의 피’로 두고, 여운으로 피흘림과 심판을 남깁니다.
  alternative_readings:
  - 당신의 피흘림
  - 당신의 피의 죄
  rationale: 히브리어는 문자적으로 ‘당신의 피’라고 말하므로, 해석을 본문에 앞서 주입하기보다 독자가 문맥 속에서 폭력과 유혈의 함의를 읽도록 두는 편이 원문 충실도에 맞습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 해석적 긴장 보존'
