  source_fidelity: 첫 절의 히브리어 גדל은 ‘저를 크게 떠벌리다’가 아니라, ‘나를 대적하여 스스로를 크게 하다/스스로를 높이다’라는 자기 과시를 뜻합니다. 또한 עָלַי가 두 절 모두에 반복되므로 두 절에서 모두 ‘나를 대적하여/거슬러’라는 적대 방향을 드러내는 것이 좋습니다. 명시적 주어 אֲנִי는 ‘내가’로 보존했습니다.
  naturalness: ‘입으로 나를 대적하여 스스로를 높였다’와 ‘말을 많이 늘어놓았다’는 현대 표준 한국어에서 자연스럽고, 합쇼체 종결을 유지합니다. 원안의 ‘저를 거창하게 떠벌렸다’는 한국어상 목적어 관계도 부자연스럽습니다.
  terminology: ‘스스로를 높이다’는 문맥상 교만한 자기 과시를 표현하면서도 특정 교리적 해석을 덧붙이지 않습니다. ‘나를 대적하여’는 적대적 발화 문맥의 עָלַי를 충실히 반영합니다.
