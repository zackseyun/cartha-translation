id: EZK.35.13
reference: Ezekiel 35:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תַּגְדִּ֤ילוּ עָלַ/י֙ בְּ/פִי/כֶ֔ם וְ/הַעְתַּרְתֶּ֥ם עָלַ֖/י דִּבְרֵי/כֶ֑ם אֲנִ֖י שָׁמָֽעְתִּי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/013.yaml
  text: And with your mouth you magnified yourselves against me[a], and multiplied your words against me[b]; I myself have heard.
  footnotes:
  - marker: a
    text: Or 'you boasted against me'; the Hebrew literally speaks of making yourselves great against God.
    reason: lexical_alternative
  - marker: b
    text: Or 'heaped up your words against me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여러분은 입으로 나를 대적하여 스스로를 높였고[a], 나를 대적하여 여러분의 말을 많이 늘어놓았습니다[b]. 내가 들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 대적하여 스스로 자랑하였습니다’; 히브리어는 문자적으로 ‘나를 대적하여 자신들을 크게 하였다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나를 대적하여 여러분의 말을 쌓아 올렸습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגְדִּילוּ עָלַי בְּפִיכֶם
  english_pob_choice: you magnified yourselves against me / with your mouth
  chosen_korean: 입으로 저를 거창하게 떠벌렸고
  alternatives_korean:
  - 입으로 저를 크게 하였고
  - 입으로 저를 자랑하였고
  lexicon: HALOT
  rationale: גדל의 사역형이 여기서는 하나님을 향한 교만한 자기과시를 뜻하므로, ‘거창하게 떠벌리다’로 hostile boast의 뉘앙스를 살렸습니다. ‘입으로’는 בְּפִיכֶם의 구체성을 유지합니다.
- source_word: וְהַעְתַּרְתֶּם
  english_pob_choice: multiplied / heaped up
  chosen_korean: 쌓아 올렸습니다
  alternatives_korean:
  - 많이 늘어놓았습니다
  - 무더기로 쏟아냈습니다
  lexicon: HALOT
  rationale: 어근 עתר의 ‘많게 하다/늘리다’ 의미를 한국어에서 말의 누적 이미지를 살려 표현했습니다. ‘쌓아 올리다’는 단순한 수량 증가보다 적대적 발언의 축적을 드러냅니다.
- source_word: דִּבְרֵיכֶם
  english_pob_choice: your words
  chosen_korean: 여러분의 말
  alternatives_korean:
  - 여러분의 말들
  - 여러분의 발언
  lexicon: HALOT
  rationale: 직역적 ‘말들’보다 한국어에서 자연스러운 단수 집합명사 ‘말’을 택해, 구체적인 발화 전체를 가리키는 히브리어 용법을 살렸습니다.
- source_word: אֲנִי שָׁמָעְתִּי
  english_pob_choice: I myself have heard
  chosen_korean: 나는 직접 들었습니다
  alternatives_korean:
  - 나 자신이 들었습니다
  - 내가 들었습니다
  lexicon: HALOT
  rationale: אֲנִי의 강조를 ‘직접’으로 옮겨, 단순한 청취가 아니라 하나님이 실제로 들으셨다는 법정적 선언을 자연스럽게 전달했습니다.
theological_decisions:
- issue: 하나님을 향한 적대적 발언의 강도
  chosen_reading: ‘거창하게 떠벌렸고’와 ‘쌓아 올렸습니다’로, 단순한 언급이 아니라 하나님을 향한 교만한 도발을 분명히 드러냈습니다.
  alternative_readings:
  - ‘자랑하였고’처럼 더 완곡하게
  - ‘말을 많이 하였고’처럼 중립적으로
  rationale: עָלַי의 반복과 자기 과시 동사가 결합되어 있어, 본문은 단순한 발언이 아니라 하나님께 맞서는 오만한 말하기를 말합니다. 번역도 그 긴장을 약화시키지 않아야 합니다.
  doctrine_reference: Ezekiel 35:13 문맥; translation philosophy §§1, 3, 6
