  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִלֵּאתִ֥י אֶת הָרָ֖י/ו חֲלָלָ֑י/ו גִּבְעוֹתֶ֤י/ךָ וְ/גֵאוֹתֶ֨י/ךָ֙ וְ/כָל אֲפִיקֶ֔י/ךָ חַלְלֵי חֶ֖רֶב יִפְּל֥וּ בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/008.yaml
  text: And I will fill its mountains with its slain; on your hills[a], in your valleys, and in all your ravines, those slain by the sword will fall.
  footnotes:
  - marker: a
    text: Or, more literally, 'will fall in them,' referring to the hills, valleys, and ravines just named.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그 산들을 그들의 살해된 자들로 채울 것이며, 네 언덕들[a]과 네 골짜기들과 네 모든 협곡에 칼에 죽임을 당한 자들이 엎드러질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들 가운데에’에 가깝습니다. 여기서는 앞에 나온 언덕, 골짜기, 협곡을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתִ֥י
  english_pob_choice: And I will fill
  chosen_korean: 내가 ... 채울 것이며
  alternatives_korean:
  - 내가 ... 채우겠습니다
  - 그리고 내가 ... 채울 것입니다
  lexicon: WLC; HALOT
  rationale: 예언적 선언의 미래 뜻을 자연스러운 한국어로 옮기되, בראש의 waw를 반영해 연결형 어미 ‘-며’를 사용했습니다.
- source_word: הָרָ֖י/ו חֲלָלָ֑י/ו
  english_pob_choice: its mountains with its slain
  chosen_korean: 그 산들을 그들의 살해된 자들로
  alternatives_korean:
  - 그 산들을 그들의 죽은 자들로
  - 그 산들을 그들의 전사한 자들로
  lexicon: HALOT
  rationale: חָלָל은 전쟁 맥락에서 ‘살해된 자들/죽임을 당한 자들’이 핵심이어서 단순한 ‘죽은 자들’보다 폭력성을 살렸습니다.
- source_word: גִּבְעוֹתֶיךָ
  english_pob_choice: your hills
  chosen_korean: 네 언덕들
  alternatives_korean:
  - 네 산들
  - 네 높은 곳들
  lexicon: HALOT
  rationale: 문맥상 지형 목록이므로 ‘언덕들’이 가장 직접적이며, ‘높은 곳들’은 예배 장소의 뉘앙스를 불필요하게 불러옵니다.
- source_word: וְ/גֵאוֹתֶ֨י/ךָ֙ וְ/כָל אֲפִיקֶ֔י/ךָ
  english_pob_choice: in your valleys, and in all your ravines
  chosen_korean: 네 골짜기들과 네 모든 협곡에
  alternatives_korean:
  - 네 계곡들과 네 모든 골짜기에
  - 네 낮은 곳들과 네 모든 골짜기에
  lexicon: HALOT
  rationale: 열거된 지형 흐름에 맞춰 ‘골짜기들’과 ‘협곡’으로 옮겨, 공간적 대비와 운반성 있는 지형 묘사를 유지했습니다.
- source_word: חַלְלֵי חֶרֶב יִפְּל֥וּ בָ/הֶֽם
  english_pob_choice: those slain by the sword will fall
  chosen_korean: 칼에 죽임을 당한 자들이 엎드러질 것입니다
  alternatives_korean:
  - 칼에 죽임을 당한 자들이 그들 가운데서 쓰러질 것입니다
  - 칼에 죽은 자들이 엎드러질 것입니다
  lexicon: HALOT
  rationale: בָהֶם의 장소성을 ‘엎드러질 것입니다’로 자연스럽게 처리하면서, sword-agent 표현을 앞부분에 반영했습니다.
theological_decisions:
- issue: 지형 목록의 반복 전치사와 문장 리듬
  chosen_reading: ‘네 언덕들과 네 골짜기들과 네 모든 협곡에’로 옮겨 반복되는 위치 표지를 한국어에서도 살렸습니다.
  alternative_readings:
  - 전치사를 줄여 한 번만 표기하는 방식
  - ‘...에...에...에’의 단순 병렬
  rationale: 히브리어의 누적적 심판 이미지가 지형 전체를 덮는다는 점을 드러내기 위해 반복을 보존했습니다.
  doctrine_reference: 예언서의 심판 묘사와 수사적 강조
