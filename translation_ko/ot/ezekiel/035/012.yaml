source:
  edition: WLC
  text: וְֽ/יָדַעְתָּ֮ כִּֽי אֲנִ֣י יְהוָה֒ שָׁמַ֣עְתִּי אֶת כָּל נָאָֽצוֹתֶ֗י/ךָ אֲשֶׁ֥ר אָמַ֛רְתָּ עַל הָרֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֣ר שממה לָ֥/נוּ נִתְּנ֖וּ לְ/אָכְלָֽה־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/012.yaml
  text: Then you will know that I am Yahweh. I have heard all your revilings that you spoke against the mountains of Israel[a], saying, ‘They are desolate; they have been given to us for food.’
  footnotes:
  - marker: a
    text: Or 'all your contemptuous words' or 'all your revilings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 너희는 내가 야훼인 줄 알게 될 것입니다. 내가 너희가 이스라엘의 산들에 대하여 한 모든 모욕을 들었습니다. 너희가 말하기를 ‘그것들은 황폐하다. 그것들은 우리에게 먹을 것으로 주어졌다’고 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 모든 경멸의 말’ 또는 ‘너희의 모든 모욕’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  english_pob_choice: Then you will know
  chosen_korean: 그러면 너희는 … 알게 될 것입니다
  alternatives_korean:
  - 그때 너희는 … 알게 될 것입니다
  - 그리고 너희는 … 알게 될 것입니다
  lexicon: WLC / HALOT
  rationale: 예언적 결과를 나타내는 וְ + 완료형을 한국어의 결과·판단 전환을 드러내는 ‘그러면’으로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC / DOCTRINE.md contested terms
  rationale: 개역 관용인 ‘여호와’ 대신, 프로젝트 기본값에 따라 신명기적 고유명칭을 ‘야훼’로 음역했습니다.
- source_word: נָאָצוֹתֶיךָ
  english_pob_choice: revilings
  chosen_korean: 모욕
  alternatives_korean:
  - 비웃음
  - 경멸의 말
  - 욕설
  lexicon: HALOT
  rationale: נאץ 계열은 경멸적·모욕적 언사를 가리키므로, 한국어로는 직접적이면서도 과도하게 확대하지 않는 ‘모욕’이 적절합니다.
- source_word: עַל הָרֵי יִשְׂרָאֵל
  english_pob_choice: against the mountains of Israel
  chosen_korean: 이스라엘의 산들에 대하여
  alternatives_korean:
  - 이스라엘의 산들을 향해
  - 이스라엘의 산들에 맞서
  lexicon: HALOT
  rationale: עַל의 적대적 뉘앙스는 문맥상 분명하지만, 한국어에서는 자연스러운 ‘대하여’로 옮겨 공격적 발화를 드러냈습니다.
- source_word: נִתְּנוּ לְאָכְלָה
  english_pob_choice: they have been given to us for food
  chosen_korean: 우리에게 먹을 것으로 주어졌다
  alternatives_korean:
  - 우리가 먹도록 주어졌다
  - 먹이로 우리에게 넘겨졌다
  lexicon: HALOT
  rationale: נִתְּנוּ + לְאָכְלָה의 ‘먹도록 넘겨짐’을 직역에 가깝게 살리되, 한국어에서 자연스러운 수동 표현으로 정리했습니다.
theological_decisions:
