  yaml_path: translation/ot/ezekiel/035/012.yaml
  text: Then you will know that I am Yahweh. I have heard all your revilings that you spoke against the mountains of Israel[a], saying, ‘They are desolate; they have been given to us for food.’
  footnotes:
  - marker: a
    text: Or 'all your contemptuous words' or 'all your revilings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 너는 내가 야훼인 줄 알게 될 것입니다. 나는 네가 이스라엘의 산들을 향해 ‘그것들은 황폐하다. 그것들은 우리에게 먹을 것으로 주어졌다’라고 말하며 한 모든 모욕의 말을 들었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네가 한 모든 경멸의 말’ 또는 ‘네가 한 모든 모욕’.
    reason: lexical_alternative
lexical_decisions:
