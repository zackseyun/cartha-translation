id: EZK.35.14
reference: Ezekiel 35:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה כִּ/שְׂמֹ֨חַ֙ כָּל הָ/אָ֔רֶץ שְׁמָמָ֖ה אֶעֱשֶׂה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/014.yaml
  text: 'Thus says the Lord GOD: As the whole earth rejoiced[b][a], I will make you desolate.'
  footnotes:
  - marker: a
    text: Or 'When the whole earth rejoices, I will make you desolate.' The Hebrew conjunction can be understood temporally.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the whole earth'; some take this more locally as 'the whole land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. “온 땅이 기뻐할 때에 내가 너를 황폐하게 만들겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 땅이 기뻐하듯이.’ 히브리어 접속사는 시간적 또는 비교적으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘온 땅’은 ‘온 세상’으로도, 더 국지적인 ‘온 나라’ 또는 ‘온 지역’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이같이 말씀하십니다
  - 이와 같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 선포 공식의 단호한 문체를 살리되, 현대 한국어에서 자연스러운 공적 선언으로 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 합성 신칭의 핵심인 יְהוִה는 본 프로젝트 기본값에 따라 야훼로 옮기고, אֲדֹנָי와의 결합은 ‘주’로 반영했습니다.
- source_word: כִּשְׂמֹחַ כָּל הָאָרֶץ
  english_pob_choice: As the whole earth rejoiced
  chosen_korean: 온 땅이 기뻐하던 때에
  alternatives_korean:
  - 온 땅이 기뻐할 때에
  - 온 땅이 기뻐하므로
  lexicon: HALOT
  rationale: כִּ + 부정사구는 여기서 시간적 배경을 나타낼 수 있어, 영어 주석의 대안 읽기를 따라 ‘때에’로 옮겼습니다.
- source_word: שְׁמָמָה אֶעֱשֶׂה לָּךְ
  english_pob_choice: I will make you desolate
  chosen_korean: 나는 너를 황폐하게 하겠습니다
  alternatives_korean:
  - 나는 너를 황무지로 만들겠습니다
  - 나는 너를 황폐로 만들겠습니다
  lexicon: HALOT
  rationale: עשה + ל + 대명사는 ‘너를 ~가 되게 하다’의 관용으로 이해되어, 결과 상태를 자연스럽게 드러내는 한국어로 옮겼습니다.
theological_decisions:
- issue: 야훼의 심판 선언에서 אֲדֹנָי יְהוִה의 호칭 결합을 어떻게 보일지
  chosen_reading: ‘주 야훼’로 옮겨 주권적 호칭과 언약 이름을 함께 드러냈습니다.
  alternative_readings:
  - ‘주 하나님’
  - ‘주 여호와’
  rationale: 본문은 예언자적 심판 선언의 권위를 강조하므로, 아도나이의 주권성과 야훼의 고유 이름을 함께 보존하는 것이 가장 직접적입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: כִּשְׂמֹחַ 구문의 시간적/비교적 가능성
  chosen_reading: 시간적 의미를 따라 ‘온 땅이 기뻐하던 때에’로 번역했습니다.
  alternative_readings:
  - ‘온 땅이 기뻐할 때에’
  - ‘온 땅이 기뻐함에 따라’
  rationale: 영문 POB 주석이 밝히듯 히브리어 접속사는 시간적 이해가 가능하며, 문맥상 심판이 기쁨의 시점과 맞물린다는 점을 드러내는 번역이 적절합니다.
  doctrine_reference: 본문 문법의 시간적 부사절 해석
