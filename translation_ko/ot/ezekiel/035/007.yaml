  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָֽתַתִּי֙ אֶת הַ֣ר שֵׂעִ֔יר לְ/שִֽׁמְמָ֖ה וּ/שְׁמָמָ֑ה וְ/הִכְרַתִּ֥י מִמֶּ֖/נּוּ עֹבֵ֥ר וָ/שָֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/007.yaml
  text: I will make Mount Seir a desolation and a waste[a], and I will cut off from it those who pass through and return.
  footnotes:
  - marker: a
    text: Or 'I will cut off from it everyone going through and coming back'; the Hebrew participles may describe all movement through the land as a merism.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 세일 산을 황폐와 황무지로 만들고, 거기를 지나가며 돌아오는 자들을 그 가운데에서 끊어 버리겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅을 오가며 들어가고 나오는 모든 사람을 끊어 버리겠습니다’; 히브리어 분사는 그 땅을 지나는 모든 이동을 가리키는 총칭적 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: I will make
  chosen_korean: ~로 만들겠습니다
  alternatives_korean:
  - ~로 두겠습니다
  - ~로 정하겠습니다
  lexicon: HALOT
  rationale: נתן은 여기서 ‘주다’의 직역보다 목적어를 어떤 상태로 ‘되게 하다’는 사역적 의미가 분명하므로, 자연스럽게 ‘~로 만들다’로 옮겼습니다.
- source_word: הַר שֵׂעִיר
  english_pob_choice: Mount Seir
  chosen_korean: 세일 산
  alternatives_korean:
  - 세일 산악지대
  - 세일 산지
  lexicon: HALOT
  rationale: 고유 지명은 표준 음역을 따르되, הַר의 직접 대응으로 ‘산’을 유지해 본문의 지리적 이미지를 살렸습니다.
- source_word: לְשִׁמְמָה וּשְׁמָמָה
  english_pob_choice: a desolation and a waste
  chosen_korean: 황폐와 황무지
  alternatives_korean:
  - 황폐와 폐허
  - 철저한 황폐
  lexicon: HALOT
  rationale: 동의어의 병렬을 살려 두 명사를 모두 유지했고, ‘황폐/황무지’로 반복 강도를 한국어에서도 드러냈습니다.
- source_word: עֹבֵר וָשָׁב
  english_pob_choice: those who pass through and return
  chosen_korean: 지나가며 돌아오는 자들
  alternatives_korean:
  - 오가며 다니는 자들
  - 지나갔다가 돌아오는 자들
  lexicon: HALOT
  rationale: 이 분사는 단순한 개인 묘사보다 그 땅을 오가는 움직임 전체를 가리킬 수 있으므로, 문맥을 따라 ‘지나가며 돌아오는 자들’로 유연하게 옮겼습니다.
theological_decisions:
- issue: 심판 선언의 반복 강조
  chosen_reading: ‘황폐와 황무지’와 ‘끊어 버리겠습니다’를 그대로 살려 심판의 강도를 약화시키지 않았습니다.
  alternative_readings:
  - ‘완전히 폐허가 되게 하겠습니다’처럼 하나로 압축
  - ‘없애 버리겠습니다’로 완화
  rationale: 히브리어는 병렬 명사와 심판 동사를 통해 강한 선언을 구성하므로, 한국어에서도 그 수사적 무게를 보존하는 것이 본문의 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
