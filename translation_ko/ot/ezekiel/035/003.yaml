source:
  edition: WLC
  text: וְ/אָמַ֣רְתָּ לּ֗/וֹ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י אֵלֶ֖י/ךָ הַר שֵׂעִ֑יר וְ/נָטִ֤יתִי יָדִ/י֙ עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/ךָ שְׁמָמָ֥ה וּ/מְשַׁמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/003.yaml
  text: 'and say to it[a], ‘Thus says the Lord GOD: Behold, I am against you, Mount Seir, and I will stretch out my hand against you and make you a desolation and a waste.’'
  footnotes:
  - marker: a
    text: Or 'and make you a desolation and an object of horror/astonishment.' The second noun can carry the sense of devastation that evokes horror.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그에게 말하십시오. ‘주 야훼께서 이렇게 말씀하십니다. 보십시오, 내가 세일 산을 거슬러 너에게 있노라. 내가 내 손을 너에게 뻗어 너를 황폐함과 폐허가 되게 하겠습니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너를 황폐함과 공포/놀라움의 대상으로 삼으리라’일 수 있습니다. 둘째 명사는 황폐가 사람을 놀라게 하는 상태를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 아도나이와 여호와의 복합 호칭을 둘 다 살리되, 본 프로젝트의 기본값에 따라 יְהוָה는 ‘야훼’로 옮겼습니다. ‘주 하나님’은 이름 요소가 약해지고, ‘여호와’는 본 지침의 기본어휘와 맞지 않습니다.
- source_word: הִנְנִי אֵלֶיךָ
  english_pob_choice: Behold, I am against you
  chosen_korean: 보십시오, 내가 …을 거슬러 너에게 있노라
  alternatives_korean:
  - 보십시오, 내가 너를 대적합니다
  - 보십시오, 내가 너를 거슬러 있습니다
  lexicon: HALOT
  rationale: הִנְנִי의 선포적 긴장을 ‘보십시오’로 살리고, אֵלֶיךָ는 심판 문맥의 적대적 방향성을 ‘거슬러’로 직접 드러냈습니다. 다만 한국어 자연성을 위해 ‘너를 대적합니다’도 가능하지만, 동작의 방향성과 직설성을 유지하려고 ‘거슬러 너에게 있노라’를 택했습니다.
- source_word: הַר שֵׂעִיר
  english_pob_choice: Mount Seir
  chosen_korean: 세일 산
  alternatives_korean:
  - 세일 산지
  - 세일 산(산악지대)
  lexicon: HALOT
  rationale: 지명으로 굳은 표현이므로 음역을 유지하되, 히브리어의 הַר를 한국어 관용에 맞게 ‘산’으로 옮겼습니다. 본문이 산을 향한 직접 호칭이므로 ‘산지’보다 간결한 ‘세일 산’이 적합합니다.
- source_word: וְנָטִיתִי יָדִי עָלֶיךָ
  english_pob_choice: I will stretch out my hand against you
  chosen_korean: 내 손을 너에게 뻗어
  alternatives_korean:
  - 내 손을 너를 향해 뻗어
  - 내 손을 너를 거슬러 펴
  lexicon: HALOT
  rationale: 심판의 관용구를 ‘내 손을 … 뻗어’로 살리되, 앞의 ‘거슬러’와 결합해 적대적 의미를 분명히 했습니다. 한국어에서 ‘손을 펴다’보다 ‘뻗다’가 행위의 방향성과 긴박감을 더 잘 전달합니다.
- source_word: שְׁמָמָה וּמְשַׁמָּה
  english_pob_choice: a desolation and a waste
  chosen_korean: 황폐함과 폐허
  alternatives_korean:
  - 황무지와 폐허
  - 황폐와 놀람의 대상
  lexicon: HALOT
  rationale: 두 명사를 중첩된 파괴의 효과로 보아 자연스러운 한국어 쌍으로 옮겼습니다. 영어 POB가 제시한 ‘horror/astonishment’의 가능성은 본문에 직접 드러내기보다 각주 처리하는 쪽이 더 적절합니다.
theological_decisions:
- issue: 여호와 이름의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본 프로젝트의 기본값과 소스-직결성을 따라 יְהוָה를 ‘야훼’로 표기했습니다. 이 절의 ‘주’는 아도나이를 옮긴 것으로 보아, 이름과 호칭을 구분하는 것이 문맥상 중요합니다.
  doctrine_reference: 'POB translation doctrine: YHWH default rendering; Contested terms table'
