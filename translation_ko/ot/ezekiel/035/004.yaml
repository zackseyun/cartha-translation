  rationale: 본문은 신명기적 인식 공식에서 여호와 신명을 직접 사용하므로, 프로젝트 표준에 따라 번역어 ‘야훼’를 유지해 고유한 언약명과 심판 선언의 긴장을 드러냈습니다.
