lexical_decisions:
- source_word: עָרֶיךָ
  english_pob_choice: your cities
  chosen_korean: 네 도시들
  alternatives_korean:
  - 네 성읍들
  - 네 도시
  lexicon: HALOT
  rationale: 복수형 עיר+2인칭 남성 단수 접미사는 여러 도시를 가리키므로, 현대 한국어에서는 자연스러운 복수 표현인 ‘네 도시들’로 옮겼습니다.
- source_word: חָרְבָּה אָשִׂים
  english_pob_choice: I will make your cities ruins
  chosen_korean: 폐허로 만들겠고
  alternatives_korean:
  - 폐허가 되게 하겠고
  - 황폐한 곳으로 만들겠고
  lexicon: HALOT
  rationale: ‘שׂוּם’의 ‘make’ 기능과 ‘חָרְבָּה’의 파괴 상태를 함께 살려, 결과 상태를 분명히 드러내는 ‘폐허로 만들다’로 옮겼습니다.
- source_word: שְׁמָמָה תִהְיֶה
  english_pob_choice: you will become a desolation
  chosen_korean: 황폐하게 될 것이며
  alternatives_korean:
  - 황폐가 될 것이며
  - 폐허가 될 것이며
  lexicon: HALOT
  rationale: ‘שְׁמָמָה’는 단순한 상태 형용사보다 ‘황폐/폐허’의 상태를 가리키므로, 예언적 심판문의 흐름에 맞게 상태 변화를 나타내는 표현으로 옮겼습니다.
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  english_pob_choice: then you will know that I am Yahweh
  chosen_korean: 그때 너는 내가 야훼임을 알게 될 것이다
  alternatives_korean:
  - 그러면 너는 내가 야훼임을 알게 될 것이다
  - 그리하여 너는 내가 야훼임을 알게 될 것이다
  lexicon: HALOT
  rationale: 예언서의 인식 공식 ‘알게 될 것이다… 내가 야훼’는 심판의 결과로 하나님의 정체를 깨닫게 되는 문맥이므로, 결론을 나타내는 ‘그때’와 직접 호명인 ‘야훼’를 유지했습니다.
theological_decisions:
