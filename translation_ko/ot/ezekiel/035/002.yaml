lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 사람아
  alternatives_korean:
  - 인자여
  - 죽을 자여
  lexicon: HALOT
  rationale: 에스겔에서 반복되는 신적 호칭의 관용구를 살리되, 한국어에서는 직접 호명형인 ‘사람아’가 어색함을 덜고 원문의 압박감을 유지합니다.
- source_word: שִׂים פָּנֶיךָ עַל
  english_pob_choice: set your face against
  chosen_korean: 네 얼굴을 … 향하여 두다
  alternatives_korean:
  - 네 얼굴을 … 대다
  - 네 시선을 … 돌리다
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴을 두다/세우다’라는 구체적 이미지를 보존하면서, 문맥상 적대적 방향성을 한국어의 ‘향하여’로 드러냈습니다.
- source_word: הַר שֵׂעִיר
  english_pob_choice: Mount Seir
  chosen_korean: 세일 산
  alternatives_korean:
  - 세일 산지
  - 세일
  lexicon: HALOT
  rationale: 고유 지명은 음역형을 따르되, ‘산’이라는 מקור의 지리적 형식을 유지하는 것이 자연스럽습니다.
- source_word: וְהִנָּבֵא עָלָיו
  english_pob_choice: and prophesy against it
  chosen_korean: 그것을 향하여 예언하십시오
  alternatives_korean:
  - 그것을 향하여 예언하라
  - 그것을 거슬러 예언하십시오
  lexicon: HALOT
  rationale: ‘예언하다’는 동사를 살리면서, עַל의 적대 뉘앙스는 앞 절의 방향성과 문맥으로 드러나도록 했습니다. 한국어에서는 ‘거슬러’보다 반복되는 평행구조가 더 분명합니다.
theological_decisions:
- issue: 예언 명령문의 어조
  chosen_reading: 하나님이 에스겔에게 직접 명령하시는 장면이므로, 본문 전체를 합쇼체로 유지하되 직설적 명령은 ‘십시오’로 옮겼습니다.
  alternative_readings:
  - 반말체로 옮김
  - 더 고전적인 ‘-하라’체 사용
  rationale: 한국어 독자에게도 신적 위임의 엄중함과 공적 예언 행위의 형식을 분명히 전달합니다.
  doctrine_reference: 예언자 소명과 신적 위임의 언어 형식
