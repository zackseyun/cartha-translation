- source_word: לְדָם אֶעֶשְׂךָ / דָם
  english_pob_choice: I will make you blood / blood
  chosen_korean: 너를 피로 만들겠고 / 피
  alternatives_korean:
  - 너를 피투성이로 만들겠고
