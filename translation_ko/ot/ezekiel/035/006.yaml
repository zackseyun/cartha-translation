  text: לָ/כֵ֣ן חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה כִּֽי לְ/דָ֥ם אֶעֶשְׂ/ךָ֖ וְ/דָ֣ם יִרְדֲּפֶ֑/ךָ אִם לֹ֥א דָ֛ם שָׂנֵ֖אתָ וְ/דָ֥ם יִרְדֲּפֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/006.yaml
  text: Therefore[a], as I live, declares the Lord GOD, I will make you blood, and blood will pursue you. Surely you have not hated blood[b], so blood will pursue you.
  footnotes:
  - marker: a
    text: Or, more literally, 'I will make you blood'; the Hebrew likely evokes both bloodshed and bloodguilt through repeated wordplay on 'blood.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'blood'; here the sense is likely 'bloodshed' or violent bloodguilt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 살아 있음을 두고 맹세합니다. 주 야훼의 말씀입니다. 내가 너를 피로 만들겠으며[a], 피가 너를 뒤쫓을 것입니다. 네가 피를 미워하지 않았으므로[b] 피가 너를 뒤쫓을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역에 가깝게는 ‘내가 너를 피로 만들겠다’입니다. 히브리어는 ‘피’를 반복하여 피 흘림과 피에 관한 죄책을 함께 떠올리게 하는 어휘 유희를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘피’입니다. 여기서는 ‘피 흘림’ 또는 폭력으로 인한 피의 죄책을 뜻할 수도 있습니다.
    reason: lexical_alternative
