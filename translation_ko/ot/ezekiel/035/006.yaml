translation:
  language: ko
  text: 그러므로 나는 살아 있습니다. 주 야훼의 말씀이니라. 내가 너를 피로 만들겠고, 피가 너를 뒤쫓을 것입니다. 네가 피를 미워하지 않았으니, 피가 너를 뒤쫓을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내가 너를 피로 만들겠다’입니다. 히브리어는 여기서 ‘피 흘림’과 ‘피의 죄책’을 함께 떠올리게 하는 말장난을 사용합니다.
    reason: lexical_alternative
