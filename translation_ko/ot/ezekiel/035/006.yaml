theological_decisions:
- issue: YHWH의 표기와 אֲדֹנָי יְהוִה 결합형
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 본문의 יאוה를 프로젝트 기본값인 ‘야훼’로 옮기고, אֲדֹנָי와 결합된 관용적 호칭은 ‘주 야훼’로 처리해 신적 자기선언의 직접성을 보존했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: אִם לֹא의 문맥 기능
  chosen_reading: 네가 피를 미워하지 않았으니
  alternative_readings:
  - 정녕 네가 피를 미워하지 않았으니
  - 네가 피를 미워하지 않았으므로
  rationale: 이 구절의 אִם לֹא는 단순 조건이라기보다 심판의 근거를 강조하는 표현이므로, 한국어에서는 원인/근거를 드러내는 종결로 자연스럽게 처리했습니다.
  doctrine_reference: Hebrew discourse function in context
