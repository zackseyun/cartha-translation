  lexicon: HALOT
  rationale: 반복되는 דָם의 말장난과 문학적 긴장을 살리기 위해 본문은 ‘피’를 유지했습니다. ‘피투성이’나 ‘유혈’은 의미를 풀어 주지만 반복 효과를 약화시킵니다.
- source_word: דָם יִרְדֲּפֶךָ
  english_pob_choice: blood will pursue you
  chosen_korean: 피가 너를 뒤쫓을 것입니다
