  - 피가 너를 쫓을 것입니다
  lexicon: HALOT
  rationale: ‘뒤쫓다’는 הדין/심판의 추격 이미지를 유지하면서도 한국어로 자연스럽습니다.
- source_word: דָם שָׂנֵאתָ
  english_pob_choice: you have not hated blood
  chosen_korean: 네가 피를 미워하지 않았으니
  alternatives_korean:
  - 네가 피를 싫어하지 않았으니
  - 네가 피를 혐오하지 않았으니
  lexicon: HALOT
  rationale: 직역상 ‘피’를 유지하되, 한국어에서는 ‘미워하다’가 히브리어의 강한 혐오/반감 표현을 가장 가깝게 전달합니다.
theological_decisions:
- issue: YHWH의 표기와 אֲדֹנָי יְהוִה 결합형
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 본문의 יאוה를 프로젝트 기본값인 ‘야훼’로 옮기고, אֲדֹנָי와 결합된 관용적 호칭은 ‘주 야훼’로 처리해 신적 자기선언의 직접성을 보존했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: אִם לֹא의 문맥 기능
  chosen_reading: 네가 피를 미워하지 않았으니
  alternative_readings:
  - 정녕 네가 피를 미워하지 않았으니
  - 네가 피를 미워하지 않았으므로
  rationale: 이 구절의 אִם לֹא는 단순 조건이라기보다 심판의 근거를 강조하는 표현이므로, 한국어에서는 원인/근거를 드러내는 종결로 자연스럽게 처리했습니다.
  doctrine_reference: Hebrew discourse function in context
