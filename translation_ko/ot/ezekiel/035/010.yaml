  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַ֣עַן אֲ֠מָרְ/ךָ אֶת שְׁנֵ֨י הַ/גּוֹיִ֜ם וְ/אֶת שְׁתֵּ֧י הָ/אֲרָצ֛וֹת לִ֥/י תִהְיֶ֖ינָה וִֽ/ירַשְׁנ֑וּ/הָ וַֽ/יהוָ֖ה שָׁ֥ם הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/010.yaml
  text: Because you said[a], ‘These two nations and these two lands will be mine[b], and we will possess them’—though Yahweh was there—
  footnotes:
  - marker: a
    text: Or 'the two nations' and 'the two lands.' The Hebrew uses the article; 'these' is supplied in English to reflect the specific entities in view from the context.
    reason: lexical_alternative
  - marker: b
    text: Or 'and the LORD was there' or 'while the LORD was there.' The Hebrew conjunction can be read in more than one way; the main text takes it concessively to reflect the sense of Edom's presumptuous claim.
    reason: alternative_reading
translation:
  language: ko
  text: 네가 말하기를 ‘이 두 민족과 이 두 땅은 내 것이 될 것이며, 우리는 그것들을 차지하겠다’ 하였기 때문입니다. — 그러나 야훼께서 거기 계셨습니다 —[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이’는 문맥상 특정한 두 민족과 두 땅을 가리키는 지시성을 살리기 위한 보충입니다. 히브리어는 관사를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 끝절의 קשר는 ‘그리고/그러나/야훼께서 거기 계셨습니다’로도 읽을 수 있습니다. 본문은 에돔의 주장과 야훼의 현존 사이의 긴장을 드러내기 위해 양보적 의미로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן אֲמָרְךָ
  english_pob_choice: Because you said
  chosen_korean: 네가 말하기를 … 하였기 때문입니다
  alternatives_korean:
  - 네가 말했기 때문입니다
  - 네가 말한 까닭입니다
  lexicon: HALOT
  rationale: 원문의 원인 표지를 자연스러운 현대 한국어 인과 절로 옮기되, ‘말하기를’로 인용문을 바로 이끌어 발화 행위를 드러냈습니다.
- source_word: שְׁנֵי הַגּוֹיִם וְאֶת שְׁתֵּי הָאֲרָצוֹת
  english_pob_choice: these two nations and these two lands
  chosen_korean: 이 두 민족과 이 두 땅
  alternatives_korean:
  - 그 두 민족과 그 두 땅
  - 두 민족과 두 땅
  lexicon: HALOT
  rationale: 문맥상 특정 대상을 가리키는 정관성을 살리기 위해 ‘이’로 옮겼고, גוים/ארצות의 병렬을 ‘민족/땅’으로 대응시켰습니다.
- source_word: וִירַשְׁנוּהָ
  english_pob_choice: and we will possess them
  chosen_korean: 우리는 그것들을 차지하겠다
  alternatives_korean:
  - 우리는 그것들을 소유하겠다
  - 우리는 그것들을 점유하겠다
  lexicon: HALOT
  rationale: ירשׁ의 ‘차지하다/빼앗아 차지하다’ 뉘앙스를 살리되, 현대어에서 자연스럽고 침략적 점유의 함의를 유지하는 표현을 택했습니다.
- source_word: וַיהוָה שָׁם הָיָה
  english_pob_choice: though Yahweh was there
  chosen_korean: 그러나 야훼께서 거기 계셨습니다
  alternatives_korean:
  - 야훼께서 거기 계셨습니다
  - 그런데 야훼께서 거기 계셨습니다
  lexicon: HALOT
  rationale: 히브리어의 단순 연결을 본문 맥락상 역접·양보로 드러내기 위해 ‘그러나’로 옮겼고, 야훼의 임재를 존중하는 종결형으로 처리했습니다.
theological_decisions:
- issue: 끝절의 וַיהוָה שָׁם הָיָה의 관계
  chosen_reading: 본문의 도발적 대조를 살려 ‘그러나 야훼께서 거기 계셨습니다’로 번역했습니다.
  alternative_readings:
  - 그리고 야훼께서 거기 계셨습니다
  - 야훼께서 거기 계셨습니다 — 그곳에 계셨습니다
  rationale: 문맥에서 에돔의 자의적 점유 선언이 야훼의 현존과 정면으로 충돌하므로, 단순 병렬보다 양보/역접이 독자에게 본문의 긴장을 더 정확히 전달합니다.
  doctrine_reference: 'translation philosophy: preserve tension where genuine ambiguity exists'
- issue: 이 두 민족/땅의 지시 대상
  chosen_reading: 본문에는 지시 대상을 직접 풀지 않고 ‘이’만으로 유지했습니다.
  alternative_readings:
  - 유다와 이스라엘
  - 그 두 나라와 그 두 땅
  rationale: 히브리어 자체가 여기서는 명시적 이름을 주지 않으므로, 해석을 본문에 덧씌우지 않고 문맥이 허용하는 수준의 지시성만 살렸습니다.
  doctrine_reference: original-language primacy
