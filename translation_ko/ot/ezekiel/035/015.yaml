  - 황무지가 될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 명사적 술어인 שְׁמָמָה를 한국어에서는 상태 진술로 옮기되, 최종 결과의 심판성을 유지하기 위해 '황폐할 것입니다'로 처리했습니다.
- source_word: הַר שֵׂעִיר
  english_pob_choice: Mount Seir
  chosen_korean: 세일 산
  alternatives_korean:
  - 세일 산아
  - 세일 산
  lexicon: HALOT
  rationale: 지명은 통용되는 음역을 따르되, 호격을 살리기 위해 문장 안에서는 자연스러운 주어 표지로 처리했습니다.
- source_word: וְכָל אֱדוֹם כֻּלָּהּ
  english_pob_choice: and all Edom, all of it
  chosen_korean: 온 에돔, 곧 그 전부
  alternatives_korean:
