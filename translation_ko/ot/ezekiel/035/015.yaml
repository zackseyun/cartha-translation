  - 에돔 전체
  lexicon: HALOT
  rationale: כָּל과 כֻּלָּהּ의 중첩된 전면성을 한국어에서 한 번의 '온'과 보충구 '그 전부'로 드러내어, 단순한 총칭보다 강조를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 하나님의 고유 이름을 직역 대체어로 가리지 않고, 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
theological_decisions:
- issue: 보응 구조의 직설성
  chosen_reading: ‘네가 … 기뻐한 것 같이, 나도 너에게 그렇게 하겠습니다’로 에돔의 기쁨과 야훼의 심판을 대칭적으로 드러냈습니다.
  alternative_readings:
  - ‘네가 … 기뻐한 대로’
  - ‘네가 … 즐거워한 만큼’
  rationale: 본문은 단순한 감정 묘사가 아니라 동일한 행위에 대한 응보를 선포하므로, 대응 구조가 분명하게 보이도록 번역했습니다.
  doctrine_reference: lex talionis / divine judgment in prophetic speech
- issue: 하나님의 이름 표기
  chosen_reading: 마지막 절의 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본문이 사용한 고유한 언약명을 보존해 독자가 인격적·역사적 하나님의 자기계시를 확인하도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
