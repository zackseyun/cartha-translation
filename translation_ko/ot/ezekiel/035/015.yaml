  text: כְּ/שִׂמְחָ֨תְ/ךָ֜ לְ/נַחְלַ֧ת בֵּֽית יִשְׂרָאֵ֛ל עַ֥ל אֲשֶׁר שָׁמֵ֖מָה כֵּ֣ן אֶעֱשֶׂה לָּ֑/ךְ שְׁמָמָ֨ה תִֽהְיֶ֤ה הַר שֵׂעִיר֙ וְ/כָל אֱד֣וֹם כֻּלָּ֔/הּ וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/015.yaml
  text: 'As you rejoiced over the inheritance of the house of Israel because it was desolate[a], so I will do to you: desolate you will be, Mount Seir, and all Edom, all of it[b]. Then they will know that I am Yahweh.'
  footnotes:
  - marker: a
    text: 'Or ''you will be desolate.'' The Hebrew more literally uses the noun ''desolation'': ''you will become a desolation.'''
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'and all Edom, all of it,' an emphatic way of saying the whole of Edom.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 이스라엘 집의 기업이 황폐해진 것을 두고 기뻐한 것처럼, 나도 네게 그렇게 하겠습니다. 세일 산과 온 에돔, 곧 그 전부가 폐허가 될 것입니다.[a][b] 그러면 그들은 내가 야훼인 줄 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 ‘황폐, 폐허’라는 명사를 술어로 사용합니다. ‘황폐할 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘온 에돔, 그 전부’라고 하여 에돔 전체를 거듭 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשִׂמְחָתְךָ
  english_pob_choice: As you rejoiced
  chosen_korean: 네가 … 기뻐한 것 같이
  alternatives_korean:
