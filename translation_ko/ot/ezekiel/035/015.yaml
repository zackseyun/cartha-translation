source:
  edition: WLC
  text: כְּ/שִׂמְחָ֨תְ/ךָ֜ לְ/נַחְלַ֧ת בֵּֽית יִשְׂרָאֵ֛ל עַ֥ל אֲשֶׁר שָׁמֵ֖מָה כֵּ֣ן אֶעֱשֶׂה לָּ֑/ךְ שְׁמָמָ֨ה תִֽהְיֶ֤ה הַר שֵׂעִיר֙ וְ/כָל אֱד֣וֹם כֻּלָּ֔/הּ וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/015.yaml
  text: 'As you rejoiced over the inheritance of the house of Israel because it was desolate[a], so I will do to you: desolate you will be, Mount Seir, and all Edom, all of it[b]. Then they will know that I am Yahweh.'
  footnotes:
  - marker: a
    text: 'Or ''you will be desolate.'' The Hebrew more literally uses the noun ''desolation'': ''you will become a desolation.'''
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'and all Edom, all of it,' an emphatic way of saying the whole of Edom.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 이스라엘 집의 기업을 두고 그것이 황폐하였다고 기뻐한 것 같이, 나도 너에게 그렇게 하겠습니다. 세일 산아, 너와 온 에돔, 곧 그 전부가 황폐할 것입니다. 그러면 그들이 내가 야훼인 줄 알게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘황폐’라는 명사 형태를 더 직접적으로 사용합니다. 따라서 ‘황폐하게 될 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘에돔과 그 전부’라는 식으로 전체성을 겹쳐 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשִׂמְחָתְךָ
  english_pob_choice: As you rejoiced
  chosen_korean: 네가 … 기뻐한 것 같이
  alternatives_korean:
  - 네 기쁨처럼
  - 네가 즐거워한 것 같이
  lexicon: HALOT
  rationale: 비교를 나타내는 כְ의 힘을 살리면서, שִׂמְחָה를 자연스러운 동사 구문으로 옮겨 문맥의 응보적 대비를 분명히 했습니다.
- source_word: לְנַחְלַת בֵּית יִשְׂרָאֵל
  english_pob_choice: over the inheritance of the house of Israel
  chosen_korean: 이스라엘 집의 기업을 두고
  alternatives_korean:
  - 이스라엘 집의 유업을 두고
  - 이스라엘 집의 소유를 두고
  lexicon: HALOT
  rationale: נַחֲלָה의 기본 의미인 '기업/유업'을 살리되, לְ가 기쁨의 대상·계기를 표시하는 점을 한국어 조사 '두고'로 자연스럽게 반영했습니다.
- source_word: שְׁמָמָה תִהְיֶה
  english_pob_choice: you will be desolate
  chosen_korean: 황폐할 것입니다
  alternatives_korean:
  - 황폐가 될 것입니다
  - 황무지가 될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 명사적 술어인 שְׁמָמָה를 한국어에서는 상태 진술로 옮기되, 최종 결과의 심판성을 유지하기 위해 '황폐할 것입니다'로 처리했습니다.
- source_word: הַר שֵׂעִיר
  english_pob_choice: Mount Seir
  chosen_korean: 세일 산
  alternatives_korean:
  - 세일 산아
  - 세일 산
  lexicon: HALOT
  rationale: 지명은 통용되는 음역을 따르되, 호격을 살리기 위해 문장 안에서는 자연스러운 주어 표지로 처리했습니다.
- source_word: וְכָל אֱדוֹם כֻּלָּהּ
  english_pob_choice: and all Edom, all of it
  chosen_korean: 온 에돔, 곧 그 전부
  alternatives_korean:
  - 에돔 모두, 그 전부
  - 에돔 전체
  lexicon: HALOT
  rationale: כָּל과 כֻּלָּהּ의 중첩된 전면성을 한국어에서 한 번의 '온'과 보충구 '그 전부'로 드러내어, 단순한 총칭보다 강조를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 하나님의 고유 이름을 직역 대체어로 가리지 않고, 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
theological_decisions:
- issue: 보응 구조의 직설성
  chosen_reading: ‘네가 … 기뻐한 것 같이, 나도 너에게 그렇게 하겠습니다’로 에돔의 기쁨과 야훼의 심판을 대칭적으로 드러냈습니다.
  alternative_readings:
  - ‘네가 … 기뻐한 대로’
  - ‘네가 … 즐거워한 만큼’
  rationale: 본문은 단순한 감정 묘사가 아니라 동일한 행위에 대한 응보를 선포하므로, 대응 구조가 분명하게 보이도록 번역했습니다.
  doctrine_reference: lex talionis / divine judgment in prophetic speech
- issue: 하나님의 이름 표기
  chosen_reading: 마지막 절의 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본문이 사용한 고유한 언약명을 보존해 독자가 인격적·역사적 하나님의 자기계시를 확인하도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
