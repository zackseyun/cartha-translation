  text: 그러므로, 내가 살아 있음을 두고 맹세합니다. 주 하나님께서 선언하십니다. 내가 너의 분노와 너의 질투에 따라 너를 다루겠으며, 그것들을 네가 그들에 대한 미움 때문에 행한 만큼 갚아 주겠습니다. 또한 내가 너를 심판할 때 그들 가운데서 나 자신을 드러내겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
