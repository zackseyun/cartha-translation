  yaml_path: translation/ot/ezekiel/035/011.yaml
  text: Therefore[a], as I live, declares the Lord GOD, I will deal with you according to your anger and according to your jealousy, which you acted out because of your hatred against them; and I will make myself known through them when I judge you.
  footnotes:
  - marker: a
    text: Or, 'I will be known among them' or 'I will make myself known through them.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 내가 살아 있음을 두고 맹세한다. 주 야훼의 말씀이다. 나는 네가 그들에 대한 미움으로 드러낸 네 분노와 네 질투에 따라 너를 다루겠다. 내가 너를 심판할 때, 나는 그들 가운데에서 알려지겠다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들을 통하여 나를 알게 하겠다.”
    reason: וְנוֹדַעְתִּי בָם은 “그들 가운데에서 알려지겠다”로도, “그들을 통하여 자신을 알게 하겠다”로도 이해될 수 있다.
