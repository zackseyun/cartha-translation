theological_decisions:
- issue: 야훼의 자기 현시 방식(וְנוֹדַעְתִּי בָם)
  chosen_reading: 하나님이 에돔을 심판하시는 사건 속에서, 에돔이 미워한 그들 가운데서 자신을 드러내신다는 의미로 옮겼습니다.
  alternative_readings:
  - 그들 가운데서 알려지신다
  - 그들을 통해 자신을 알리신다
  rationale: 본문은 심판과 자기 계시를 분리하지 않고 함께 제시하므로, 결과를 단정하기보다 심판 속 현시라는 긴장을 유지했습니다.
  doctrine_reference: 'POB translation philosophy: preserve theological tension rather than resolve it'
