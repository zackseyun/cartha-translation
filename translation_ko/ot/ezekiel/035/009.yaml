  text: 내가 너를 영원한 황무지로 만들 것이며, 네 성읍들에는 사람이 살지 않을 것입니다. 그러면 너희는 내가 야훼인 줄 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
