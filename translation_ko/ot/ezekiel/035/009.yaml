    text: 히브리어 복수명사 שִׁמְמוֹת는 ‘황무지들’ 또는 ‘폐허들’처럼 복수로도 옮길 수 있습니다. 여기서는 파괴의 상태를 강조하는 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
