  text: 네가 영원한 적대감을 품고 이스라엘 자손[a]을 칼의 권세에 넘겨주었기 때문이다. 그들이 재앙을 당할 때, 끝의 형벌의 때[b]에 그렇게 하였다.
  philosophy: optimal-equivalence
  footnotes:
