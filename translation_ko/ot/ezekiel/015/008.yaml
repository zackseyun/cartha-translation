  source_fidelity: 핵심 의미는 대체로 전달하지만, ‘신실하지 않게 행하다’는 מָעֲלוּ מַעַל이 나타내는 배신적·신의 위반의 강한 뜻을 충분히 살리지 못하며 한국어로도 다소 부자연스럽습니다. ‘황무지’도 가능하나, שְׁמָמָה의 황폐·폐허 상태는 ‘황폐한 곳’이 더 직접적으로 드러냅니다.
  naturalness: 문장을 나눈 방식과 합쇼체는 적절합니다. 다만 ‘신실하지 않게 행하였기’보다 ‘신의를 저버렸기’가 현대 표준어에서 더 자연스럽고 명료합니다.
  terminology: אֲדֹנָי יְהוִה는 ‘주 야훼’로 일관되게 옮겼으며 적절합니다. מָעַל은 본문에서 ‘언약’이라는 말을 명시하지 않으므로, 각주에서도 이를 유일한 번역처럼 제시하지 않고 ‘신의를 저버리다’를 우선 제시하는 편이 안전합니다.
