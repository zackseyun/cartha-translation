id: EZK.15.8
reference: Ezekiel 15:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּ֥י אֶת הָ/אָ֖רֶץ שְׁמָמָ֑ה יַ֚עַן מָ֣עֲלוּ מַ֔עַל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/008.yaml
  text: And I will make the land a desolation[a], because they have acted unfaithfully[b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: 'Hebrew: ''they have committed a breach of faith'' or ''they have been faithless.'''
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew title: ''Lord Yahweh''; traditionally rendered ''the Lord GOD'' to reflect the combination of ''Adonai'' with the divine name YHWH.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 그 땅을 황무지로 만들겠습니다[a]. 그들이 신실하지 않게 행하였기 때문입니다[b]. 주 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘황폐하게’ 또는 ‘폐허가 되게’.'
    reason: lexical_alternative
  - marker: b
    text: '히브리어: ‘언약을 어겼기 때문에’ 또는 ‘신의를 저버렸기 때문에’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: And I will make
  chosen_korean: 내가 ... 만들겠습니다
  alternatives_korean:
  - 내가 ... 두겠습니다
  - 내가 ... 정하겠습니다
  lexicon: HALOT
  rationale: נתן의 결과적 의미를 살려 ‘~로 만들다’로 옮기되, 단순히 두거나 정하는 느낌보다 심판의 변화를 분명하게 드러내었습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 땅
  - 나라
  - 이 땅
  lexicon: HALOT
  rationale: 에스겔의 심판 문맥에서 הארץ는 우주적 ‘땅’이 아니라 특정한 경계가 있는 지역을 가리키므로 ‘그 땅’이 가장 자연스럽습니다.
- source_word: שְׁמָמָה
  english_pob_choice: a desolation
  chosen_korean: 황무지로
  alternatives_korean:
  - 황폐하게
  - 폐허로
  - 황량한 상태로
  lexicon: HALOT
  rationale: 명사형의 상태를 한국어에서 자연스럽게 풀어 주면서도, 단순 형용사보다 파괴된 상태를 분명히 드러내는 표현을 택했습니다.
- source_word: מָעֲלוּ מַעַל
  english_pob_choice: they have acted unfaithfully
  chosen_korean: 신실하지 않게 행하였기
  alternatives_korean:
  - 신의를 저버렸기
  - 언약을 어겼기
  - 배신하였기
  lexicon: HALOT
  rationale: 이 결합은 단순한 실수보다 언약적 불성실과 배신을 강하게 뜻하므로, POB의 선택을 따라 ‘신실하지 않게 행하다’로 옮겼습니다.
theological_decisions:
- issue: 하나님 칭호 אֲדֹנָי יְהוִה의 한국어 처리
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 하나님
  - 주 여호와
  - 주 하나님 야훼
  rationale: 본문의 דבר형식 종결문에서 아도나이와 YHWH의 결합을 직접 드러내기 위해 고유신명은 ‘야훼’로, אדני는 ‘주’로 옮겼습니다. 전통적 ‘주 하나님’은 의미는 전달하지만 신명 자체를 가립니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה / YHWH → 야훼'
