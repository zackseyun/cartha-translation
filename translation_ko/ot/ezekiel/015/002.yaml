source:
  edition: WLC
  text: בֶּן אָדָ֕ם מַה יִּֽהְיֶ֥ה עֵץ הַ/גֶּ֖פֶן מִ/כָּל עֵ֑ץ הַ/זְּמוֹרָ֕ה אֲשֶׁ֥ר הָיָ֖ה בַּ/עֲצֵ֥י הַ/יָּֽעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/002.yaml
  text: Son of man[a], how is the wood of the vine better than any wood, the branch that is among the trees of the forest?
  footnotes:
  - marker: a
    text: Or, more formally, 'what is the wood of the vine more than any wood, the branch that is among the trees of the forest?' The Hebrew is elliptical and comparative.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람아, 포도나무의 나무, 곧 숲의 나무들 가운데 있는 그 가지가 다른 어떤 나무보다 무엇이 더 낫습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 비교를 생략적으로 표현합니다. 더 직역하면 ‘포도나무의 나무가 모든 나무보다 무엇이겠습니까? 곧 숲의 나무들 가운데 있는 가지가 말입니다’라고 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 사람아
  alternatives_korean:
  - 인자여
  - 사람의 아들아
  lexicon: HALOT
  rationale: 에스겔의 예언자 호칭으로서 직역된 관용을 살리되, 한국어에서는 호격 기능이 분명한 ‘사람아’가 자연스럽고 문맥상 메시아 칭호로 오해될 가능성도 줄입니다.
- source_word: מַה יִּהְיֶה
  english_pob_choice: how is ... better
  chosen_korean: 무엇이 ... 더 낫습니까
  alternatives_korean:
  - 어찌 ... 더 낫습니까
  - 무엇이 ... 더 나습니까
  lexicon: HALOT
  rationale: 히브리어의 비교적 질문을 한국어에서 자연스러운 반문으로 옮겼습니다. POB가 밝힌 비교적·생략적 구조를 살리기 위해 ‘무엇이’와 ‘더 낫습니까’를 사용했습니다.
- source_word: עֵץ הַגֶּפֶן / הַזְּמוֹרָה
  english_pob_choice: the wood of the vine / the branch
  chosen_korean: 포도나무의 나무 / 가지
  alternatives_korean:
  - 포도나무 목재 / 덩굴가지
  - 포도나무의 가지
  lexicon: HALOT
  rationale: 본문이 포도 ‘식물’보다 그 ‘나무/재료’와 ‘가지’를 대비하므로, 앞은 ‘나무’, 뒤는 단순히 ‘가지’로 구분해 재료성과 비유성을 함께 드러냈습니다.
- source_word: בַּעֲצֵי הַיָּעַר
  english_pob_choice: among the trees of the forest
  chosen_korean: 숲의 나무들 가운데
  alternatives_korean:
  - 숲의 나무들 속에
  - 숲의 나무들 사이에
  lexicon: HALOT
  rationale: 장소 관계를 한국어에서 자연스럽게 풀어 ‘가운데’로 옮겼으며, 복수성을 살리기 위해 ‘나무들’로 번역했습니다.
theological_decisions:
- issue: בֶּן אָדָם의 호칭 처리
  chosen_reading: 메시아 칭호가 아니라 예언자 에스겔에게 주어진 인간 호칭으로 이해하고 ‘사람아’로 옮겼습니다.
  alternative_readings:
  - 인자여로 옮겨 전통적 어감 유지
  - 사람의 아들아로 직역
  rationale: 본문은 에스겔을 향한 직접 호격입니다. 한국어 독자에게는 ‘사람아’가 기능적으로 가장 분명하며, 본문 자체의 예언자적 대화 구조를 흐리지 않습니다.
  doctrine_reference: 예언자 호칭과 본문 맥락
- issue: 비교문법의 생략 보충
  chosen_reading: 히브리어의 축약된 비교 질문을 한국어에서 완결된 반문으로 풀어 읽게 했습니다.
  alternative_readings:
  - 더 문자적으로 ‘포도나무의 나무가 무엇이겠습니까?’
  - 영어 POB처럼 ‘어떻게 더 낫습니까’식 표현
  rationale: 원문은 ‘무엇이 될 것인가’의 비교 뉘앙스를 갖는 생략적 질문입니다. 한국어에서는 의미를 분명히 하되 과도한 해석을 더하지 않는 수준으로 보충했습니다.
  doctrine_reference: 히브리어 시적·수사적 문장 구조
