id: EZK.15.7
reference: Ezekiel 15:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בָּ/הֶ֔ם מֵ/הָ/אֵ֣שׁ יָצָ֔אוּ וְ/הָ/אֵ֖שׁ תֹּֽאכְלֵ֑/ם וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בְּ/שׂוּמִ֥/י אֶת פָּנַ֖/י בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/007.yaml
  text: And I will set my face against them[a]. They have come out from the fire, but the fire will consume them. Then you will know that I am Yahweh[b], when I set my face against them.
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''set my face against them,'' expressing determined opposition and judgment.'
    reason: cultural_note
  - marker: b
    text: Or 'They came out of the fire, but the fire will devour them.' The Hebrew contrasts coming out from one fire with being consumed by fire nonetheless.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들에게 맞서 내 얼굴을 돌리겠습니다[a]. 그들이 불에서 나왔으나, 불이 그들을 삼킬 것입니다. 내가 그들에게 맞서 내 얼굴을 돌릴 때에, 너희는 내가 야훼인 줄 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘내 얼굴을 그들에게 두다’는 그들에게 단호히 맞서 심판하겠다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־פָּנַי בָּהֶם
  english_pob_choice: I will set my face against them
  chosen_korean: 내가 그들 위에 내 얼굴을 두겠습니다
  alternatives_korean:
  - 내가 그들에 맞서 내 얼굴을 두겠습니다
  - 내가 그들을 향해 내 얼굴을 돌리겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리되, 한국어에서는 ‘얼굴을 두다’가 다소 직역적으로 들릴 수 있어 ‘그들 위에’로 대상의 위압과 심판의 방향성을 드러냈습니다.
- source_word: מֵהָאֵשׁ יָצָאוּ
  english_pob_choice: They have come out from the fire
  chosen_korean: 그들은 불에서 나왔지만
  alternatives_korean:
  - 그들은 불에서 나왔습니다만
  - 그들은 불 속에서 나왔지만
  lexicon: HALOT
  rationale: יצא의 기본 뜻인 ‘나오다’를 유지하되, 앞뒤 대조를 살리기 위해 절을 연결하는 ‘하지만’을 앞에 배치했습니다.
- source_word: וְהָאֵשׁ תֹּאכְלֵם
  english_pob_choice: the fire will consume them
  chosen_korean: 불이 그들을 삼킬 것입니다
  alternatives_korean:
  - 불이 그들을 먹어치울 것입니다
  - 불이 그들을 소멸할 것입니다
  lexicon: HALOT
  rationale: אכל은 불이 대상을 ‘삼키다/먹어치우다’는 뜻이므로, 한국어에서는 자연스럽고 강한 심판 이미지를 살리는 ‘삼키다’를 택했습니다.
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  english_pob_choice: Then you will know that I am Yahweh
  chosen_korean: 그제야 너희는 내가 야훼임을 알게 될 것입니다
  alternatives_korean:
  - 그러면 너희는 내가 야훼임을 알게 될 것입니다
  - 그때 너희는 내가 야훼인 줄 알게 될 것입니다
  lexicon: HALOT
  rationale: 결과를 나타내는 흐름을 ‘그제야’로 살렸고, יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 심판 선언에서 고유한 언약 이름을 보존하는 것이 중요하므로, 일반적 대체 호칭이 아닌 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘내 얼굴을 두다’ 관용구의 보존
  chosen_reading: 관용구를 본문에 유지하되 한국어 어순을 조금 조정
  alternative_readings:
  - 내가 그들에 맞서겠습니다
  - 내가 그들을 심판하겠습니다
  rationale: 이 표현은 단순한 반대가 아니라 의도적 적대와 심판의 결의를 드러내므로, 의미를 약화시키는 해석어로 바꾸지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1, #5'
