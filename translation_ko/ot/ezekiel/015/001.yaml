- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  - 일
  lexicon: HALOT
  rationale: יהוה의 דבר은 단순한 정보가 아니라 신적 계시이므로, 한국어 성경에서 확립된 ‘말씀’이 원문의 반복적 예언 공식과 신학적 무게를 가장 잘 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명사는 전통적 대체어가 아니라 고유명사로 처리해야 하므로, 프로젝트 기본어인 ‘야훼’를 사용했습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내게로
  lexicon: HALOT
  rationale: 1인칭 목적어를 자연스러운 현대 문어체로 옮기되, 예언자에게 말씀이 향해 오는 방향성을 간단하게 드러내기 위해 ‘내게’를 택했습니다.
theological_decisions:
