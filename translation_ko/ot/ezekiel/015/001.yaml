lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: came
  chosen_korean: 임하여
  alternatives_korean:
  - 오셨습니다
  - 이르셨습니다
  - 있었습니다
  lexicon: HALOT
  rationale: 예언문 서두의 관용구에서 דבר־יהוה가 ‘오다/임하다’는 표현으로 전달되므로, 현대 한국어에서는 ‘임하여’가 가장 자연스럽고 원문의 운동감을 살립니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  - 일
  lexicon: HALOT
  rationale: יהוה의 דבר은 단순한 정보가 아니라 신적 계시이므로, 한국어 성경에서 확립된 ‘말씀’이 원문의 반복적 예언 공식과 신학적 무게를 가장 잘 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명사는 전통적 대체어가 아니라 고유명사로 처리해야 하므로, 프로젝트 기본어인 ‘야훼’를 사용했습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내게로
  lexicon: HALOT
  rationale: 1인칭 목적어를 자연스러운 현대 문어체로 옮기되, 예언자에게 말씀이 향해 오는 방향성을 간단하게 드러내기 위해 ‘내게’를 택했습니다.
theological_decisions:
- issue: 예언 공식의 직역성과 한국어 자연스러움
  chosen_reading: ‘야훼의 말씀이 내게 임하여 말씀하셨습니다’로 옮겨, 신적 계시의 도래를 보존했습니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 와서 말씀하시기를’
  - ‘야훼의 말씀이 내게 있었다고’
  rationale: 히브리어 예언 서두의 전형적 표현을 한국어에서 가장 익숙하면서도 원문의 계시적 뉘앙스를 잃지 않게 전달해야 했습니다.
  doctrine_reference: Ezekiel의 예언 서문 관용구
