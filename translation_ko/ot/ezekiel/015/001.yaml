  chosen_reading: ‘야훼의 말씀이 내게 임하여 말씀하셨습니다’로 옮겨, 신적 계시의 도래를 보존했습니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 와서 말씀하시기를’
