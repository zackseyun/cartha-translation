id: EZK.15.3
reference: Ezekiel 15:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/יֻקַּ֤ח מִמֶּ֨/נּוּ֙ עֵ֔ץ לַ/עֲשׂ֖וֹת לִ/מְלָאכָ֑ה אִם יִקְח֤וּ מִמֶּ֨/נּוּ֙ יָתֵ֔ד לִ/תְל֥וֹת עָלָ֖י/ו כָּל כֶּֽלִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/003.yaml
  text: Is wood taken from it to make anything useful? Or do they take from it a peg to hang every kind of vessel on it?[a][b][c]
  footnotes:
  - marker: a
    text: Or, 'to make anything for work' / 'for any useful task.' The Hebrew phrase לַעֲשׂוֹת לִמְלָאכָה emphasizes practical usefulness.
    reason: lexical_alternative
  - marker: b
    text: '''Peg'' could also be rendered ''stake'' or ''nail,'' but the sense is a fixed support from which objects are hung.'
    reason: lexical_alternative
  - marker: c
    text: '''Vessel'' here is a broad term for an article, implement, or container, not only pottery.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것으로 무엇인가를 만들기 위해 그 나무를 가져가겠습니까? 아니면 그 나무에서 못을 가져가서 각종 그릇을 그것에 걸겠습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לַעֲשׂוֹת לִמְלָאכָה는 ‘일하기 위해’만이 아니라 ‘실용적 용도에 맞게 만들기 위해’라는 뉘앙스를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 יָתֵד은 여기서 못, 말뚝, 걸이용 못을 아우를 수 있는 고정 지지물을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 כֶּלִי는 단순한 도자기만이 아니라 그릇, 기구, 용구 같은 물건 전체를 넓게 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֻקַּח
  english_pob_choice: Is ... taken
  chosen_korean: 가져가겠습니까
  alternatives_korean:
  - 취하겠습니까
  - 가져올 수 있겠습니까
  lexicon: HALOT
  rationale: 수동적 질문의 뉘앙스를 자연스러운 합쇼체 의문문으로 옮겼습니다. 문맥상 단순한 ‘take’보다 ‘가져가다’가 물질을 취해 쓰는 의미를 더 잘 드러냅니다.
- source_word: מִמֶּנּוּ
  english_pob_choice: from it
  chosen_korean: 그것으로
  alternatives_korean:
  - 그 나무에서
  - 거기서
  lexicon: HALOT
  rationale: 앞선 포도나무/그 나무를 가리키는 지시를 한국어에서 매끄럽게 받으려면 ‘그것으로’가 가장 자연스럽습니다. 뒤 문장의 반복을 줄이면서도 지시 대상을 유지합니다.
- source_word: לַעֲשׂוֹת לִמְלָאכָה
  english_pob_choice: to make anything useful
  chosen_korean: 무엇인가를 만들기
  alternatives_korean:
  - 어떤 쓸모 있는 일을 하기 위해
  - 무엇인가 쓸 만한 것을 만들기 위해
  lexicon: HALOT
  rationale: מְלָאכָה의 실용성/작업성은 드러내되, 본문에 없는 ‘유용한’을 과도하게 삽입하지 않도록 직역에 가깝게 처리했습니다. 한국어에서는 이어지는 문맥이 이미 쓸모 여부를 묻고 있으므로 ‘무엇인가를 만들기’가 충분합니다.
- source_word: יָתֵד
  english_pob_choice: a peg
  chosen_korean: 못
  alternatives_korean:
  - 말뚝
  - 걸이못
  - 못대
  lexicon: HALOT
  rationale: 이 장면은 걸어 두는 고정 지지물을 가리키므로, 한국어에서는 가장 간결하고 이해하기 쉬운 ‘못’으로 옮겼습니다. 필요하면 주석에서 peg/stake의 폭을 설명할 수 있습니다.
- source_word: כָּל כֶּלִי
  english_pob_choice: every kind of vessel
  chosen_korean: 각종 그릇
  alternatives_korean:
  - 모든 그릇
  - 각종 기구
  - 온갖 물건
  lexicon: HALOT
  rationale: כֶּלִי는 용기·도구·기물까지 포괄하는 넓은 말이므로, 여기서는 hanging 대상의 범위를 살리는 ‘각종 그릇’이 가장 무난합니다. ‘그릇’은 한국어에서 물건/기구를 넓게 받는 전통적 표현으로도 기능합니다.
theological_decisions:
- issue: 수사적 질문의 기능
  chosen_reading: 이 절은 실제 정보 전달보다, 포도나무 목재의 무용성을 강하게 드러내는 두 개의 수사적 질문으로 읽었습니다.
  alternative_readings:
  - 단순한 설명문으로 완화하는 읽기
  - 비유적 경고보다 일반 진술로 처리하는 읽기
  rationale: 문맥 전체가 포도나무의 쓸모 없음과 심판의 정당성을 강조하므로, 한국어에서도 질문형을 유지해야 원문의 압박감이 살아납니다.
  doctrine_reference: 문맥-수사 기능 보존
