  source_fidelity: 초안은 두 수사 의문문의 형태를 보존했으나, 첫 문장에서 ‘그것으로 … 그 나무를 가져가다’라고 하여 מִמֶּנּוּ(‘그것에서/그것으로부터’)와 עֵץ(‘나무, 목재’)의 관계가 뒤바뀌었습니다. 또한 לִמְלָאכָה의 실용적·작업 목적은 본문에서 드러내는 편이 적절합니다. 둘째 문장의 כָּל־כֶּלִי는 단순히 ‘그릇’에 한정되지 않으므로 넓은 표현으로 옮겼습니다.
  naturalness: ‘그것에서 목재를 가져다가’는 앞 절의 포도나무를 받는 한국어 표현으로 자연스럽습니다. ‘그 못에’는 עָלָיו의 가장 가까운 선행사인 יָתֵד(못/말뚝)를 한국어에서 명확히 해 줍니다.
  terminology: עֵץ는 이 문맥에서 ‘목재’, יָתֵד은 ‘못’으로 옮기되 주석에서 ‘말뚝/걸이못’의 가능성을 밝혔습니다. כֶּלִי는 ‘기물’로 번역하여 용기·도구·물품을 포괄하는 의미를 유지했습니다.
