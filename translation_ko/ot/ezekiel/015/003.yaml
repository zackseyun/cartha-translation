  to: 그것에서 목재를 가져다가 쓸모 있는 것을 만들겠습니까? 아니면 거기에서 못 하나를 가져다가 온갖 기물을 그 못에 걸겠습니까?[a][b][c]
  rationale: 수동 수사 의문문의 의미를 유지하면서, 목재가 포도나무에서 취해지는 원문의 문장 관계를 바로잡았습니다. ‘쓸모 있는 것’은 לִמְלָאכָה의 작업·용도 의미를 반영하며, ‘온갖 기물’은 כָּל־כֶּלִי의 넓은 범위를 보존합니다. ‘그 못에’는 한국어에서 걸리는 대상을 분명히 한 것이며, 주석은 יָתֵד과 כֶּלִי의 어휘 범위를 보완합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:40:37Z'
