    text: 또는 ‘불에 먹힐 것으로’; 직역하면 ‘먹기/소비하기를 위하여’이며, 불이 나무를 먹는 것으로 의인화하여 표현합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘어떤 일에 적합하겠습니까?’ 또는 ‘만들기에 쓸 만하겠습니까?’
