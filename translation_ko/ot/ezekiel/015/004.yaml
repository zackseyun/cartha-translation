source:
  edition: WLC
  text: הִנֵּ֥ה לָ/אֵ֖שׁ נִתַּ֣ן לְ/אָכְלָ֑ה אֵת֩ שְׁנֵ֨י קְצוֹתָ֜י/ו אָכְלָ֤ה הָ/אֵשׁ֙ וְ/תוֹכ֣/וֹ נָחָ֔ר הֲ/יִצְלַ֖ח לִ/מְלָאכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/004.yaml
  text: Look[a], it is given to the fire for fuel. The fire has consumed both of its ends, and its middle is charred[b]. Is it fit for any work?
  footnotes:
  - marker: a
    text: Or 'to be consumed'; literally 'for eating,' with fire personified as consuming the wood.
    reason: lexical_alternative
  - marker: b
    text: Or 'useful for work' or 'suitable for workmanship.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 이것은 불에 먹을 것으로 주어졌습니다. 불이 그 두 끝을 삼켰고, 가운데는 그을렸습니다[b]. 그것이 어떤 일에도 쓸모가 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘삼키기 위해’, 곧 불이 나무를 ‘먹는’ 의인화된 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘일에 유용합니다’ 혹은 ‘만들기에 적합합니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 주의하십시오
  lexicon: HALOT
  rationale: 주의를 끄는 지시 표현으로, 현대 한국어에서 자연스럽고 합쇼체 문맥에도 맞게 옮겼습니다.
- source_word: לְאָכְלָה
  english_pob_choice: for fuel
  chosen_korean: 불에 먹을 것으로
  alternatives_korean:
  - 불에 타서 소모되도록
  - 불에 태워질 것으로
  lexicon: HALOT
  rationale: 히브리어의 문자적 ‘먹다/소모하다’ 이미지를 살리면서도, 불이 목재를 ‘먹는’ 은유를 한국어로 전달하도록 했습니다.
- source_word: נָחָר
  english_pob_choice: is charred
  chosen_korean: 그을렸습니다
  alternatives_korean:
  - 숯처럼 탔습니다
  - 타들어 갔습니다
  lexicon: HALOT
  rationale: 끝부분이 탄 뒤 가운데가 손상된 상태를 자연스럽게 드러내는 표현으로, ‘charred’의 상태값을 잘 반영합니다.
- source_word: לִמְלָאכָה
  english_pob_choice: for any work
  chosen_korean: 어떤 일에도 쓸모가 있겠습니까
  alternatives_korean:
  - 어떤 작업에도 쓸 수 있겠습니까
  - 아무 일에도 쓸 만하겠습니까
  lexicon: HALOT
  rationale: מְלָאכָה의 기능적·실용적 의미를 살려, 단순히 ‘일’이 아니라 ‘쓸모’의 문제로 옮겼습니다.
theological_decisions:
- issue: 예언적 수사에서의 판단 질문
  chosen_reading: 문장 끝을 반문형으로 옮겨, 버려질 장작의 무용성을 선지자적 판단으로 드러냈습니다.
  alternative_readings:
  - 평서문으로 완화하여 ‘쓸 수 없습니다’라고 옮길 수 있음
  - 직역하여 ‘일에 적합합니까?’로 둘 수 있음
  rationale: 히브리어 수사 의문문이 단순 정보 요청이 아니라 심판적 결론을 끌어내는 장치이므로, 한국어에서도 반문의 힘을 보존했습니다.
  doctrine_reference: 예언서 수사법
