  terminology: ‘보십시오’, ‘삼켰고’, ‘그을렸습니다’, ‘어떤 일에 쓸모가 있겠습니까?’는 현대 합쇼체 및 예언적 반문에 적절합니다. ‘땔감’은 לְאָכְלָה의 문맥상 자연스러운 기능적 표현이며, 문자적 소비 이미지는 각주에서 보완합니다.
