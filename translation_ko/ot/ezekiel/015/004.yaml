  text: 보십시오, 이것은 불에 태울 땔감으로[a] 넘겨졌습니다. 불이 그 두 끝을 삼켰고, 그 가운데는 그을렸습니다. 그것이 어떤 일에 쓸모가 있겠습니까[b]?
  philosophy: optimal-equivalence
  footnotes:
