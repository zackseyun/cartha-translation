  text: 'Therefore thus says the Lord GOD: As the wood of the vine among the trees of the forest[a], which I have given to the fire for fuel, so I have given the inhabitants of Jerusalem.'
  footnotes:
  - marker: a
    text: Hebrew 'to the fire for consumption'; that is, as something to be burned up. Or, more literally, 'to the fire to be consumed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 하나님께서 이처럼 말씀하십니다. “포도나무의 나무가 숲의 나무들 가운데서 불에 던져져 연료가 되는 것과 같이[a], 내가 예루살렘 주민들을 그렇게 내어주었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘먹기 위해 불에’로, 곧 ‘타서 없어지도록’이라는 뜻입니다.
    reason: lexical_alternative
