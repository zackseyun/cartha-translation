  - 흠 없을 때
  - 온전했을 때
  lexicon: HALOT
  rationale: 포도나무 가지의 물리적 훼손 전 상태를 가리키므로 도덕적 의미를 피하고 ‘온전하다’로 옮겼습니다.
- source_word: לֹא יֵעָשֶׂה לִמְלָאכָה
  english_pob_choice: it was not made for any work
  chosen_korean: 어떤 일에도 쓰이지 않았습니다
  alternatives_korean:
  - 어떤 일에도 만들어지지 않았습니다
  - 어떤 일에도 쓸모가 없었습니다
  - 어떤 일에 쓰이도록 만들어지지 않았습니다
  lexicon: HALOT
  rationale: 능동적 제작보다 ‘일/노동에 쓰임’이라는 기능 부재를 드러내기 위해 수동적이고 자연스러운 표현을 사용했습니다.
- source_word: אַף כִּי
  english_pob_choice: How much less
  chosen_korean: 하물며
  alternatives_korean:
  - 얼마나 더더욱
  - 더구나
  - 하물며 더
  lexicon: HALOT
  rationale: ‘lesser to greater’의 수사적 논법을 한국어의 관용적 반어/강조인 ‘하물며’로 가장 자연스럽게 살렸습니다.
- source_word: אֵשׁ אֲכָלַתְהוּ וַיֵּחָר
  english_pob_choice: the fire has consumed it and it is charred
  chosen_korean: 불이 그것을 삼키고 그것이 그슬렸다면
  alternatives_korean:
  - 불이 그것을 삼키고 그것이 타버렸다면
  - 불이 그것을 먹어 치우고 그것이 검게 그을렸다면
  - 불이 그것을 삼키고 그것이 숯처럼 되었다면
  lexicon: HALOT
  rationale: ‘삼키다’는 אש אכל의 강한 소멸 이미지를 보존하고, ‘그슬리다’는 화재 후 손상된 상태를 과도하게 해석하지 않으면서도 자연스럽게 전달합니다.
theological_decisions:
- issue: 비유의 처리
  chosen_reading: 본문의 비유를 주석적으로 풀지 않고, 불탄 포도나무 가지의 무용함이라는 이미지 자체를 보존했습니다.
  alternative_readings:
  - 유다/예루살렘을 본문 안에 명시적으로 넣는 번역
  - 의미를 풀어 ‘심판받은 백성’으로 바꾸는 번역
  rationale: 문맥이 비유의 대상을 설명하더라도 이 절 자체는 이미지 언어로 말하므로, 본문 수준에서는 해석을 앞세우지 않는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
