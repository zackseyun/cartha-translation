  text: הִנֵּה֙ בִּֽ/הְיוֹת֣/וֹ תָמִ֔ים לֹ֥א יֵֽעָשֶׂ֖ה לִ/מְלָאכָ֑ה אַ֣ף כִּי אֵ֤שׁ אֲכָלַ֨תְ/הוּ֙ וַ/יֵּחָ֔ר וְ/נַעֲשָׂ֥ה ע֖וֹד לִ/מְלָאכָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/005.yaml
  text: Look[a], when it was whole, it was not made for any work. How much less, when the fire has consumed it and it is charred[c][b], can it still be made for any work?
  footnotes:
  - marker: a
    text: Or 'sound' or 'intact' for 'whole.' The Hebrew describes the wood before it has been damaged by fire.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew ''How much less,'' an argument from the lesser to the greater: if it was useless when intact, it is even less useful after being burned.'
    reason: lexical_alternative
  - marker: c
    text: Or 'scorched' for 'charred.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그것이 온전할 때에는 어떤 일에도 쓰이지 않았습니다. 하물며 불이 그것을 삼키고 그것이 그슬렸다면, 이제 어떻게 다시 어떤 일에라도 쓰일 수 있겠습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온전한’은 타지기 전의 물리적 훼손 없음, 곧 ‘sound/intact’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘하물며’라는, 더 적은 경우에서 더 큰 경우로 나아가는 논법을 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그슬렸다’는 ‘타서 검게 그을린/그슬린’ 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 주의를 끄는 감탄·지시를 한국어 합쇼체로 살리기 위해 ‘보십시오’를 택했습니다.
- source_word: תָמִים
  english_pob_choice: whole
  chosen_korean: 온전할 때
  alternatives_korean:
