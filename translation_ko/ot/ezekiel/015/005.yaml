source:
  edition: WLC
  text: הִנֵּה֙ בִּֽ/הְיוֹת֣/וֹ תָמִ֔ים לֹ֥א יֵֽעָשֶׂ֖ה לִ/מְלָאכָ֑ה אַ֣ף כִּי אֵ֤שׁ אֲכָלַ֨תְ/הוּ֙ וַ/יֵּחָ֔ר וְ/נַעֲשָׂ֥ה ע֖וֹד לִ/מְלָאכָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/005.yaml
  text: Look[a], when it was whole, it was not made for any work. How much less, when the fire has consumed it and it is charred[c][b], can it still be made for any work?
  footnotes:
  - marker: a
    text: Or 'sound' or 'intact' for 'whole.' The Hebrew describes the wood before it has been damaged by fire.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew ''How much less,'' an argument from the lesser to the greater: if it was useless when intact, it is even less useful after being burned.'
    reason: lexical_alternative
  - marker: c
    text: Or 'scorched' for 'charred.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그것이 온전할[a] 때에는 어떤 일에도 쓰이지 않았습니다. 하물며[b] 불이 그것을 삼키고 그것이 그을렸다면[c], 이제 다시 어떤 일에라도 쓰일 수 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온전한’은 불에 타기 전, 물리적으로 손상되지 않은 상태를 뜻합니다. ‘멀쩡한’ 또는 ‘완전한’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘하물며’는 작은 경우에서 더 큰 경우로 나아가는 논증을 나타냅니다. 온전할 때도 쓸모가 없었다면, 불에 탄 뒤에는 더욱 그러하다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그을렸다’는 ‘검게 그을렸다’ 또는 ‘타 버렸다’로도 옮길 수 있습니다.
    reason: lexical_alternative
