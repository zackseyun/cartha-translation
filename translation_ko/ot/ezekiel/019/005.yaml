translation:
  language: ko
  text: 그 암사자는 자신이 헛되이 기다렸고 자기 희망이 사라진 것을 보고, 자기 새끼들 가운데 하나를 데려다가 어린 사자로 삼았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘힘이 빠졌다’, ‘실망했다’라는 뜻일 수 있습니다. 히브리어 표현이 어려우므로, 본문은 문맥상 좌절된 기다림의 의미를 따랐습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  english_pob_choice: When she saw
  chosen_korean: 보고
  alternatives_korean:
