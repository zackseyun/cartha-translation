  yaml_path: translation/ot/ezekiel/019/005.yaml
  text: When she saw that she had waited in vain[a], that her hope was lost, she took one of her cubs and made him a young lion.
  footnotes:
  - marker: a
    text: Or 'she was weakened' / 'she was disappointed.' The Hebrew term is difficult; the main text follows the contextual sense of frustrated waiting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 헛되이 기다렸다는 것을 보고—그의 희망이 사라졌기 때문에—그는 자기 새끼들 가운데 하나를 잡아 어린 사자로 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘힘이 빠졌다’, ‘실망했다’의 뜻일 수 있습니다. 히브리어가 어려운 표현이므로, 본문은 문맥상 좌절된 기다림의 의미를 따랐습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  english_pob_choice: When she saw
  chosen_korean: 보고
  alternatives_korean:
  - 보았을 때
  - 그녀가 보았고
  lexicon: HALOT
  rationale: 와우-연속의 서술 진행을 자연스럽게 살리면서, 뒤따르는 내용 전체를 받아들이는 한국어 서술로 간결하게 옮겼습니다.
- source_word: נוֹחֲלָה
  english_pob_choice: she had waited in vain
  chosen_korean: 헛되이 기다렸다는 것을
  alternatives_korean:
  - 허탈해졌다는 것을
  - 실망했다는 것을
  - 힘이 빠졌다는 것을
  lexicon: HALOT
  rationale: 문맥상 단순한 신체적 쇠약보다 좌절된 기대를 가리키므로, 영어 POB의 해석을 따라 ‘헛되이 기다리다’로 옮겼습니다.
- source_word: גֻּרֶיהָ
  english_pob_choice: her cubs
  chosen_korean: 자기 새끼들
  alternatives_korean:
  - 자기 새끼곰들
  - 자기 새끼들 가운데서
  lexicon: HALOT
  rationale: 사자 비유에서 גּוּר는 ‘새끼/어린 짐승’을 뜻하므로, 현대 한국어에서 자연스럽고 이미지가 분명한 ‘새끼들’을 택했습니다.
- source_word: כְּפִיר
  english_pob_choice: a young lion
  chosen_korean: 어린 사자
  alternatives_korean:
  - 젊은 사자
  - 어린 수사자
  lexicon: HALOT
  rationale: כְּפִיר은 일반적인 ‘사자’보다 어린 단계의 사자를 가리키므로, 구별을 살려 ‘어린 사자’로 번역했습니다.
- source_word: שָׂמָתְהוּ
  english_pob_choice: made him a young lion
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 세웠습니다
  - 두었습니다
  - 정했습니다
  lexicon: HALOT
  rationale: 동사의 기본 의미는 ‘두다/만들다’이며, 여기서는 비유적으로 그를 어린 사자로 ‘만들었다’는 결과를 자연스럽게 전달합니다.
theological_decisions:
- issue: 애가의 은유적 동물 이미지 유지
  chosen_reading: 사자 암컷과 새끼의 비유를 그대로 살려, 정치적·예언적 조롱의 톤이 약해지지 않도록 했습니다.
  alternative_readings:
  - 강하게 키웠습니다
  - 그를 장수로 세웠습니다
  rationale: 본문은 왕조에 대한 애가적 비유이므로, 해석을 과도하게 풀기보다 원문의 상징을 보존하는 편이 독자의 이해에 더 충실합니다.
  doctrine_reference: 예언서의 상징 언어와 심판 선언
