revisions:
- from: 그가 헛되이 기다렸다는 것을 보고—그의 희망이 사라졌기 때문에—그는 자기 새끼들 가운데 하나를 잡아 어린 사자로 만들었습니다.[a]
  to: 그 암사자는 자신이 헛되이 기다렸고 자기 희망이 사라진 것을 보고, 자기 새끼들 가운데 하나를 데려다가 어린 사자로 삼았습니다.[a]
  rationale: 여성 단수 주어와 소유 접미사를 암사자로 일관되게 반영하고, 원문에 없는 인과관계와 포획의 뉘앙스를 제거했습니다. 난해한 נוֹחֲלָה에 대한 본문 선택과 대안은 각주로 보존했습니다.
