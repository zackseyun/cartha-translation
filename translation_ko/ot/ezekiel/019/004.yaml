id: EZK.19.4
reference: Ezekiel 19:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֥וּ אֵלָ֛י/ו גּוֹיִ֖ם בְּ/שַׁחְתָּ֣/ם נִתְפָּ֑שׂ וַ/יְבִאֻ֥/הוּ בַֽ/חַחִ֖ים אֶל אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/004.yaml
  text: The nations heard of him[a]; he was caught in their pit[c][b], and they brought him with hooks to the land of Egypt.
  footnotes:
  - marker: a
    text: Or 'heard of him.' The Hebrew idiom may denote hearing reports concerning him rather than hearing him directly.
    reason: lexical_alternative
  - marker: b
    text: Or 'trap' for 'pit.' The image is of a hunting pit used to capture prey.
    reason: lexical_alternative
  - marker: c
    text: '''With hooks'' may refer to restraining hooks or rings used on captured animals or prisoners.'
    reason: cultural_note
translation:
  language: ko
  text: 민족들이 그에 대해 들었고[a], 그는 그들의 함정[b]에 잡혔으며, 그들은 그를 갈고리로 이집트 땅으로 데려갔습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 단순히 ‘듣다’보다 ‘~에 대한 소식을 듣다’의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘함정’은 ‘구덩이’에 해당하는 히브리어의 포획 이미지까지 함께 살린 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘갈고리’는 포로나 짐승을 제어할 때 쓰는 장치일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  english_pob_choice: heard of him
  chosen_korean: 그에 대해 들었고
  alternatives_korean:
  - 그를 들었고
  - 그의 소식을 들었고
  lexicon: HALOT
  rationale: 히브리어 관용구는 직접 청취보다 그에 관한 소식을 접했다는 뜻으로 읽는 것이 자연스럽기 때문에, 한국어도 ‘~에 대해 들었습니다’로 옮겨 의미를 드러냈습니다.
- source_word: גּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 민족들이
  alternatives_korean:
  - 나라들이
  - 열방이
  lexicon: HALOT
  rationale: 에스겔 문맥에서 외국 민족들을 가리키므로, ‘민족들’이 가장 무난하면서도 문맥에 맞는 표현입니다.
- source_word: בְּשַׁחְתָּם
  english_pob_choice: in their pit
  chosen_korean: 그들의 함정에
  alternatives_korean:
  - 그들의 구덩이에
  - 그들의 구덩이 속에
  lexicon: HALOT
  rationale: 사냥용 구덩이의 이미지가 있으나 포획의 의미를 살리기 위해 ‘함정’으로 옮겼습니다. 본문 주석의 ‘pit/trap’ 양면성을 반영합니다.
- source_word: בַחַחִים
  english_pob_choice: with hooks
  chosen_korean: 갈고리로
  alternatives_korean:
  - 갈고리를 가지고
  - 고리로
  lexicon: HALOT
  rationale: 사로잡힌 짐승이나 포로를 제어하는 도구를 가리키므로, 도구적 의미가 드러나도록 ‘갈고리로’로 옮겼습니다.
theological_decisions:
- issue: 포획 장면의 폭력적 이미지와 문학적 은유 유지
  chosen_reading: 사냥과 포로 체포의 이중 이미지를 약화시키지 않고 그대로 살렸습니다.
  alternative_readings:
  - 완곡하게 ‘붙잡혔습니다’로만 처리하는 방식
  - ‘덫’으로만 좁혀 번역하는 방식
  rationale: 본문은 사냥의 구덩이와 갈고리를 함께 사용해 포획과 굴욕을 강하게 그리므로, 이를 완곡화하지 않고 유지하는 것이 원문의 힘에 더 가깝습니다.
  doctrine_reference: 예언적 비유와 심판 이미지의 보존
