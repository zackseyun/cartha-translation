  text: וַ/יִּתְהַלֵּ֥ךְ בְּ/תוֹךְ אֲרָי֖וֹת כְּפִ֣יר הָיָ֑ה וַ/יִּלְמַ֥ד לִ/טְרָף טֶ֖רֶף אָדָ֥ם אָכָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/006.yaml
  text: He prowled among the lions; he became a young lion[a]. He learned to tear prey; he devoured men.
  footnotes:
  - marker: a
    text: Or 'he ate people' / 'he devoured humankind'; Hebrew 'man' can function collectively here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 사자들 가운데를 배회하더니, 젊은 사자가 되었습니다. 그는 먹이를 찢는 법을 배웠고, 사람들을 삼켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사람을 먹었다”, “인류를 삼켰다”로 옮길 수도 있습니다. 히브리어 ‘사람’은 여기서 집합적으로 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  english_pob_choice: prowled
  chosen_korean: 배회하더니
  alternatives_korean:
  - 거닐더니
  - 돌아다니더니
  lexicon: HALOT
  rationale: 반복적·포식적 이동을 나타내는 동작을 살리기 위해 단순한 '걷다'보다 맥락상 더 강한 '배회하다'를 택했습니다.
- source_word: בְּתוֹךְ אֲרָיוֹת
  english_pob_choice: among the lions
  chosen_korean: 사자들 가운데를
  alternatives_korean:
  - 사자들 한가운데를
  - 사자들 사이를
  lexicon: HALOT
  rationale: בְּתוֹךְ의 '가운데/가운데서'라는 공간 감각을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: כְּפִיר
  english_pob_choice: young lion
  chosen_korean: 젊은 사자
  alternatives_korean:
  - 어린 사자
  - 사자 새끼
  lexicon: HALOT
  rationale: כְּפִיר은 아직 성체는 아니지만 이미 위협적인 어린 수사자를 가리키므로, '젊은 사자'가 이미지와 뉘앙스를 가장 잘 살립니다.
- source_word: לִטְרָף טֶרֶף
  english_pob_choice: to tear prey
  chosen_korean: 먹이를 찢는 법을
  alternatives_korean:
  - 먹이를 잡는 법을
  - 먹이를 덮치는 법을
  lexicon: HALOT
  rationale: 동사의 강한 파괴성을 보이기 위해 단순한 '잡다'보다 '찢다'를 택했고, 학습한 행위를 드러내기 위해 '법을'을 보탰습니다.
- source_word: אָדָם
  english_pob_choice: men
  chosen_korean: 사람들을
  alternatives_korean:
  - 사람들
  - 인류를
  lexicon: HALOT
  rationale: 히브리어 אָדָם이 여기서는 집합적으로 쓰이므로, 단수적인 '사람'보다 복수의 피해 대상을 드러내는 '사람들을'이 문맥과 더 잘 맞습니다.
theological_decisions:
- issue: 동물 포식 비유 속 אָדָם의 집합적 의미
  chosen_reading: 사람들을
  alternative_readings:
  - 인류를
  - 사람들
  rationale: 이 절은 인간론을 논하는 문장이 아니라 포식의 잔혹성을 그리는 비유이므로, 집합적 의미를 살리되 과도하게 추상화하지 않는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for אָדָם'
