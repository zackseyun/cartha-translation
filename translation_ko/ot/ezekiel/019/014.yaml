  to: 불이 그 가지들 가운데 한 가지에서 나와 그 열매를 삼켰습니다.[a] 그 안에는 강한 가지, 곧 다스리기 위한 홀이 없었습니다.[b] 이것은 애가입니다. 그것은 애가가 되었습니다.
