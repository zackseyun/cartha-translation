id: EZK.19.14
reference: Ezekiel 19:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֵּצֵ֨א אֵ֜שׁ מִ/מַּטֵּ֤ה בַדֶּ֨י/הָ֙ פִּרְיָ֣/הּ אָכָ֔לָה וְ/לֹא הָ֥יָה בָ֛/הּ מַטֵּה עֹ֖ז שֵׁ֣בֶט לִ/מְשׁ֑וֹל קִ֥ינָה הִ֖יא וַ/תְּהִ֥י לְ/קִינָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/014.yaml
  text: And fire went out from a branch of its limbs[a]; it consumed its fruit, and there was not in it a strong branch, a scepter to rule. This is a lamentation[b], and it has become a lamentation.
  footnotes:
  - marker: a
    text: Or 'from a rod among its branches'; Hebrew מַטֶּה can mean 'branch,' 'rod,' or 'staff.' The main text follows the vine imagery, while the verse's later 'scepter' preserves the royal sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'there was no strong rod in it, no scepter for ruling.' The Hebrew intentionally blends vine imagery with royal imagery.
    reason: alternative_reading
translation:
  language: ko
  text: 불이 그 가지들 가운데 한 가지에서 나와 그 열매를 삼켰습니다.[a] 그 안에는 강한 가지, 곧 다스리기 위한 홀이 없었습니다.[b] 이것은 애가입니다. 그것은 애가가 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 가지들 중 한 막대에서’. 히브리어 מַטֶּה는 ‘가지’, ‘막대’, ‘홀’을 뜻할 수 있습니다. 본문은 포도나무 비유를 따르지만, 뒤의 ‘홀’은 왕권의 의미를 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 안에 강한 막대도, 다스리기 위한 홀도 없었습니다’. 히브리어는 포도나무 이미지와 왕권 이미지를 의도적으로 섞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  english_pob_choice: And fire went out
  chosen_korean: 불이 ... 나와
  alternatives_korean:
  - 불이 나왔습니다
  - 불이 일어나
  lexicon: HALOT
  rationale: wayyiqtol의 진행감을 살리면서도 현대 한국어에서 자연스러운 동사로 옮겼습니다. 불의 이미지는 구체적으로 유지하되 과도한 의인화는 피했습니다.
- source_word: מִמַּטֵּה בַדֶּיהָ
  english_pob_choice: from a branch of its limbs
  chosen_korean: 그 가지들 가운데 한 가지에서
  alternatives_korean:
  - 그 가지의 줄기에서
  - 그 가지들 중 한 가지에서
  lexicon: HALOT
  rationale: מַטֶּה와 בַדִּים가 같은 식물 비유 안에서 겹치므로, 한국어에서는 ‘가지들 가운데 한 가지’로 중첩된 가지 이미지를 살렸습니다. POB가 지적한 나무/홀의 이중 의미를 무리하게 단일화하지 않았습니다.
- source_word: פִּרְיָהּ אָכָלָה
  english_pob_choice: it consumed its fruit
  chosen_korean: 그 열매를 삼켰습니다
  alternatives_korean:
  - 그 열매를 먹어버렸습니다
  - 그 열매를 삼켰습니다
  lexicon: HALOT
  rationale: 불이 열매를 파괴하는 강도를 살리기 위해 ‘삼키다’를 택했습니다. 열매는 포도나무 비유에 맞는 자연스러운 대응어입니다.
- source_word: שֵׁבֶט לִמְשׁוֹל
  english_pob_choice: a scepter to rule
  chosen_korean: 다스리는 홀
  alternatives_korean:
  - 통치하는 홀이
  - 다스리기 위한 홀
  lexicon: HALOT
  rationale: שֵׁבֶט의 왕권적 의미를 한국어 ‘홀’로 옮겨 POB가 보존한 왕실/통치 이미지를 반영했습니다. ‘다스리는’은 목적·기능을 함께 드러냅니다.
- source_word: קִינָה הִיא וַתְּהִי לְקִינָה
  english_pob_choice: This is a lamentation, and it has become a lamentation
  chosen_korean: 이것은 애가입니다. 그리고 그것은 애가가 되었습니다
  alternatives_korean:
  - 이것은 슬픔의 노래입니다. 그리고 그것은 슬픔의 노래가 되었습니다
  - 이것은 애가입니다. 그리고 애가가 되었습니다
  lexicon: HALOT
  rationale: קִינָה는 예언적 애도시를 가리키므로 교회적 관용어보다 ‘애가’를 유지했습니다. 두 절의 반복도 원문처럼 살렸습니다.
theological_decisions:
- issue: 포도나무 비유와 왕권 비유의 긴장 보존
  chosen_reading: ‘가지’와 ‘홀’을 함께 두어 식물 이미지와 통치 이미지가 동시에 들리게 했습니다.
  alternative_readings:
  - 전부 ‘막대’로 통일해 왕권만 강조하는 읽기
  - 전부 ‘가지’로 통일해 식물 비유만 강조하는 읽기
  rationale: 본문은 의도적으로 포도나무 이미지와 왕권 이미지를 섞어 유다 왕조의 몰락을 표현합니다. 한쪽으로 평탄화하면 원문의 수사적 긴장이 사라집니다.
  doctrine_reference: Translation philosophy §3, §5
