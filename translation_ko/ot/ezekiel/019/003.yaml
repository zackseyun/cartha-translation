lexical_decisions:
- source_word: וַתַּעַל
  english_pob_choice: She brought up
  chosen_korean: 길러 내어
  alternatives_korean:
  - 키워 내어
  - 기르어
  lexicon: HALOT
  rationale: עלה의 기본 의미인 ‘올리다/가져올리다’가 새끼를 기르며 성장시키는 이미지로 쓰였으므로, 자연스러운 현대 한국어 동사구로 ‘길러 내어’라고 옮겼습니다.
- source_word: אֶחָד מִגֻּרֶיהָ
  english_pob_choice: one of her cubs
  chosen_korean: 자기 새끼들 가운데 하나
  alternatives_korean:
  - 자기 새끼 중 하나
  - 자기 새끼 하나
  lexicon: HALOT
  rationale: partitive 구조를 살리면서도 ‘cub/whelp’의 동물 새끼 이미지를 자연스럽게 전달하기 위해 이렇게 옮겼습니다.
- source_word: כְּפִיר
  english_pob_choice: a young lion
  chosen_korean: 젊은 사자
  alternatives_korean:
  - 어린 사자
  - 젊은 숫사자
  lexicon: HALOT
  rationale: כְּפִיר은 단순한 새끼보다 사냥할 수 있을 만큼 자란 어린 사자를 가리키므로, ‘젊은 사자’가 상태의 역동성과 위협성을 함께 살립니다.
- source_word: וַיִּלְמַד לִטְרָף טֶרֶף
  english_pob_choice: he learned to tear prey
  chosen_korean: 먹이를 찢는 법을 배워
  alternatives_korean:
  - 먹이를 찢도록 배워
  - 먹이를 뜯는 법을 배워
  lexicon: HALOT
  rationale: 동사-명사 어근 반복이 주는 포악한 사냥 이미지를 살리기 위해 ‘먹이를 찢는 법을 배워’라고 옮겼습니다.
- source_word: אָדָם
  english_pob_choice: people
  chosen_korean: 사람들을
  alternatives_korean:
  - 사람을
  - 인간을
  lexicon: HALOT
  rationale: 히브리어가 단수 אָדָם을 쓰지만 한국어에서는 문맥상 집합적 의미가 더 자연스러워 ‘사람들을’로 옮기되, 인간 대상의 폭력성을 유지했습니다.
- source_word: אָכָל
  english_pob_choice: he devoured people
  chosen_korean: 집어삼켰습니다
  alternatives_korean:
  - 삼켰습니다
  - 먹어 치웠습니다
  lexicon: HALOT
  rationale: 포식적 폭력을 강조하는 동사로, 단순한 ‘먹다’보다 ‘집어삼키다’가 문맥의 잔혹성을 더 직접적으로 드러냅니다.
theological_decisions:
- issue: אָדָם의 번역에서 단수 형태와 한국어 자연성의 긴장
  chosen_reading: 문맥상 집합적 의미를 살려 ‘사람들을’로 번역했습니다.
  alternative_readings:
  - 사람을
  - 인간을
  rationale: 히브리어는 단수형이지만, 포식 장면에서 대상이 일반 인류를 가리키는 것으로 이해되므로 한국어에서는 자연스러운 집합 표현을 택했습니다. 다만 폭력의 대상이 ‘인간’임은 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; contested terms policy for אָדָם
