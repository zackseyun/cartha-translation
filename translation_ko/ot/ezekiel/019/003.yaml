translation:
  language: ko
  text: 그녀는 자기 새끼들 가운데 하나를 길렀습니다. 그 새끼는 젊은 사자가 되었고, 먹이를 찢는 법을 배워 사람을 집어삼켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
