id: EZK.19.8
reference: Ezekiel 19:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ עָלָ֥י/ו גּוֹיִ֛ם סָבִ֖יב מִ/מְּדִינ֑וֹת וַֽ/יִּפְרְשׂ֥וּ עָלָ֛י/ו רִשְׁתָּ֖/ם בְּ/שַׁחְתָּ֥/ם נִתְפָּֽשׂ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/008.yaml
  text: Then nations from the provinces set themselves against him all around[a], and they spread their net over him[b]; he was caught in their pit.
  footnotes:
  - marker: a
    text: Or 'came against him all around from the provinces.' The Hebrew idiom can be rendered more literally as 'set against him.'
    reason: lexical_alternative
  - marker: b
    text: '''Pit'' likely refers to a trap-pit used in hunting.'
    reason: cultural_note
translation:
  language: ko
  text: 여러 지방에서 온 여러 민족이 사방에서 그를 대적하고[a], 그 위에 자기들의 그물을 펼쳤습니다. 그는 그들의 구덩이에서 붙잡혔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러 지방에서 온 여러 민족이 사방에서 그에게 맞섰습니다.’ 히브리어 관용구는 더 문자적으로 ‘그를 향하여 자신들을 두었다’라는 뜻입니다.
    reason: alternative_reading
  - marker: b
    text: ‘구덩이’는 사냥에 쓰는 포획용 구덩이를 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו גּוֹיִם סָבִיב מִמְּדִינוֹת
  english_pob_choice: set themselves against him all around / from the provinces
  chosen_korean: 여러 민족이 주변 모든 곳에서 그를 치러 올라와
  alternatives_korean:
  - 그를 둘러싸고 대적하여
  - 그를 둘러싸고 올라와
  - 주변의 여러 지방에서 그를 쳐들어와
  lexicon: HALOT
  rationale: נתן עליו는 단순한 이동보다 적대적 행동 개시를 뜻하므로, 군사적·대적적 뉘앙스를 살려 ‘치러 올라와’로 옮겼습니다. גּוֹיִם과 מִמְּדִינוֹת은 외세의 여러 정치 단위를 가리키므로 ‘여러 민족’과 ‘주변 모든 곳에서’로 자연스럽게 풀었습니다.
- source_word: וַיִּפְרְשׂוּ עָלָיו רִשְׁתָּם
  english_pob_choice: they spread their net over him
  chosen_korean: 그물로 그를 덮고
  alternatives_korean:
  - 그의 위에 그물을 펼치고
  - 그물망을 그에게 펴고
  - 그물을 그 위에 펼치고
  lexicon: HALOT
  rationale: פָּרַשׂ는 ‘펴다, 펼치다’이지만 한국어에서는 ‘그물을 덮다’가 포획의 그림을 더 분명하게 전달합니다. ‘그물’은 사냥 은유를 유지하는 직역적 핵심어입니다.
- source_word: בְּשַׁחְתָּם
  english_pob_choice: in their pit
  chosen_korean: 함정에
  alternatives_korean:
  - 그들의 구덩이에
  - 그들의 함정 구덩이에
  - 그들의 구덩이 속에
  lexicon: HALOT
  rationale: שַׁחַת은 일반적 ‘구덩이’일 수 있지만 문맥상 사냥용 함정의 뉘앙스가 강하므로 ‘함정’으로 번역해 문화적 기능을 드러냈습니다.
- source_word: נִתְפָּשׂ
  english_pob_choice: he was caught
  chosen_korean: 그를 잡았습니다
  alternatives_korean:
  - 그가 붙잡혔습니다
  - 그는 사로잡혔습니다
  - 그는 걸려들었습니다
  lexicon: HALOT
  rationale: 수동형의 결과 상태를 한국어로 자연스럽게 보이게 하면서도 사냥 은유를 살리기 위해 ‘잡았습니다’로 옮겼습니다. ‘사로잡혔습니다’는 전투적 뉘앙스가 강해 여기서는 덜 직접적입니다.
theological_decisions:
- issue: 포로·사냥 은유의 보존
  chosen_reading: 이 절은 정치적 공격을 사냥 이미지로 묘사하므로, ‘그물’과 ‘함정’을 유지해 포획의 긴장감을 살렸습니다.
  alternative_readings:
  - 의역하여 단순히 ‘공격했다’고 풀기
  - ‘덫’ 중심으로 완화해 옮기기
  rationale: 문맥의 핵심은 단순한 적대가 아니라 압도적 포획과 몰락이기 때문에, 은유를 약화시키지 않는 것이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: 예레미야·에스겔의 심판 이미지와 예언적 비유 해석 원칙
