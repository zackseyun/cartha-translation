source:
  edition: WLC
  text: וְ/עַתָּ֖ה שְׁתוּלָ֣ה בַ/מִּדְבָּ֑ר בְּ/אֶ֖רֶץ צִיָּ֥ה וְ/צָמָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/013.yaml
  text: And now she is planted in the wilderness[a], in a dry and thirsty land.
  footnotes:
  - marker: a
    text: Or "transplanted in the wilderness." The Hebrew participle can be understood in context as implying removal and replanting, though the form itself more directly means "planted."
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제 그것은 광야에 심겨 있으며, 마른 땅이요 목마른 땅에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘심겨’는 히브리어 분사 שְׁתוּלָה의 직접적 의미를 따른 것이며, 문맥상 ‘옮겨 심겨’로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그리고 지금
  lexicon: HALOT
  rationale: 접속사 וְ와 시간 부사 עַתָּה의 전환감을 함께 살리기 위해 ‘그리고 이제’로 옮겼습니다.
- source_word: שְׁתוּלָה
  english_pob_choice: is planted
  chosen_korean: 심겨 있으며
  alternatives_korean:
  - 심겨 있습니다
  - 옮겨 심겨 있으며
  lexicon: HALOT
  rationale: 형태는 ‘심어진 상태’의 분사적 표현이므로, 본문이 말하는 현재 상태를 살려 ‘심겨 있으며’로 옮겼습니다. 문맥상 ‘옮겨 심다’의 함의는 있으나, 단어 자체는 직접적으로 그것을 명시하지 않으므로 본문에는 넣지 않았습니다.
- source_word: בַמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에
  alternatives_korean:
  - 사막에
  - 들판에
  lexicon: HALOT
  rationale: מִדְבָּר는 단순한 사막보다 성서적 ‘광야’의 황량하고 버려진 이미지를 더 잘 드러냅니다.
- source_word: צִיָּה וְצָמָא
  english_pob_choice: dry and thirsty
  chosen_korean: 마른 땅이요 목마른 땅
  alternatives_korean:
  - 메마른 땅이요 목마른 땅
  - 마르고 목마른 땅
  lexicon: HALOT
  rationale: 두 명사가 병렬로 땅의 상태를 압축적으로 묘사하므로, 한국어에서도 명사구를 유지해 반복을 살렸습니다. ‘목마른’은 땅의 결핍 상태를 자연스럽게 전달합니다.
theological_decisions:
- issue: 광야로의 배치가 단순 위치 묘사인지, 심판에 따른 이식 이미지를 포함하는지
  chosen_reading: 본문은 ‘심겨 있음’이라는 현재 상태를 말하면서도, 문맥상 심판 아래 놓인 옮겨짐의 결과를 암시한다고 보았습니다.
  alternative_readings:
  - 단순히 광야에 존재하는 상태로만 읽기
  - ‘옮겨 심겨 있음’으로 더 분명히 읽기
  rationale: 히브리어 분사형 자체는 ‘심어진 상태’를 직접 말하지만, 앞뒤 문맥은 제거와 재배치를 함의할 수 있습니다. 그래서 본문에는 과도한 해석을 넣지 않고, 오독을 막기 위해 문맥적 함의는 따로 보존했습니다.
  doctrine_reference: 문맥 주해 및 히브리어 분사 해석
