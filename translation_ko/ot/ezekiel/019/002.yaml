id: EZK.19.2
reference: Ezekiel 19:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ מָ֤ה אִמְּ/ךָ֙ לְבִיָּ֔א בֵּ֥ין אֲרָי֖וֹת רָבָ֑צָה בְּ/ת֥וֹךְ כְּפִרִ֖ים רִבְּתָ֥ה גוּרֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/002.yaml
  text: and say[a], ‘What was your mother? A lioness. Among lions she lay down[b]; in the midst of young lions she reared her cubs.’
  footnotes:
  - marker: a
    text: Or 'Among lionesses she lay down.' The Hebrew plural can be understood more generally as 'lions,' but some translators render it by sense to match the feminine imagery of 'lioness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'she raised' or 'she made many' her cubs. The Hebrew verb can carry the idea of increase, but in this context it likely refers to rearing offspring.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이렇게 말하십시오. ‘너희 어머니는 무엇이었느냐? 암사자였습니다. 사자들 사이에 누워 있었고, 새끼사자들 한가운데서 자기 새끼들을 길렀습니다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 어머니는 암사자들 가운데 있었다.’ 히브리어 복수형은 더 일반적으로 ‘사자들’로 이해할 수 있지만, 문맥의 여성적 이미지에 맞추어 뜻을 따라 ‘암사자들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 새끼들을 키웠습니다’ 또는 ‘자기 새끼들을 많이 두었습니다.’ 히브리어 동사는 증가의 뜻을 품을 수 있지만, 이 문맥에서는 새끼를 기르는 뜻이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָמַרְתָּ
  english_pob_choice: and say
  chosen_korean: 그리고 이렇게 말하십시오
  alternatives_korean:
  - 그리고 말하십시오
  - 말하십시오
  lexicon: WLC
  rationale: 예언적 지시를 자연스러운 한국어 명령형으로 옮기되, 단순 동작보다 이어지는 인용문을 여는 기능이 드러나도록 했습니다.
- source_word: מָה אִמְּךָ
  english_pob_choice: What was your mother?
  chosen_korean: 너희 어머니는 무엇이었느냐?
  alternatives_korean:
  - 너의 어머니는 무엇이었습니까?
  - 어머니는 무엇이었느냐?
  lexicon: HALOT
  rationale: מָה의 수사적 질문을 살리면서도, 후속 비유 설명을 자연스럽게 받도록 직역보다 한국어 문답 구조를 선택했습니다.
- source_word: לְבִיָּא
  english_pob_choice: a lioness
  chosen_korean: 암사자
  alternatives_korean:
  - 사자 암컷
  - 암컷 사자
  lexicon: HALOT
  rationale: 여성형 동물명사이므로 모성 이미지와 맞는 표준어 ‘암사자’로 옮겼습니다.
- source_word: בֵּין אֲרָיוֹת / בְּתוֹךְ כְּפִרִים
  english_pob_choice: Among lions ... in the midst of young lions
  chosen_korean: 사자들 사이에 ... 새끼사자들 한가운데서
  alternatives_korean:
  - 사자들 가운데 ... 어린 사자들 한가운데서
  - 암사자들 사이에 ... 새끼사자들 한가운데서
  lexicon: HALOT
  rationale: 아르요트와 케피림의 대비를 유지하되, POB의 구분처럼 앞은 일반 복수 ‘사자들’, 뒤는 ‘새끼사자들’로 옮겨 수사적 평행을 보존했습니다.
- source_word: רָבָצָה / רִבְּתָה גוּרֶיהָ
  english_pob_choice: she lay down ... she reared her cubs
  chosen_korean: 누워 있었고 ... 자기 새끼들을 길렀습니다
  alternatives_korean:
  - 엎드려 있었고 ... 자기 새끼들을 키웠습니다
  - 누워 있었고 ... 자기 새끼들을 많게 했습니다
  lexicon: HALOT
  rationale: רָבָצָה는 짐승의 ‘눕다/엎드리다’ 이미지를 살려 ‘누워 있었고’로, רִבְּתָה는 단순 증식보다 양육의 뜻이 이 문맥에서 더 분명하므로 ‘길렀습니다’로 옮겼습니다.
theological_decisions:
- issue: 예언적 직접화법의 문체
  chosen_reading: 직접 인용문은 예언자에게 주어진 명령을 ‘말하십시오’로, 인용문 안은 과거 서술형으로 유지했습니다.
  alternative_readings:
  - 전부 평서형으로 처리
  - 인용문을 간접화법으로 바꾸기
  rationale: 히브리어의 명령+인용 구조를 보존해야 상징적 애가의 힘이 살아나므로, 한국어에서도 발화 행위를 분명히 드러냈습니다.
  doctrine_reference: 예언서 수사와 문학적 형식 보존
