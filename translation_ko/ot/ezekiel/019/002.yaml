source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ מָ֤ה אִמְּ/ךָ֙ לְבִיָּ֔א בֵּ֥ין אֲרָי֖וֹת רָבָ֑צָה בְּ/ת֥וֹךְ כְּפִרִ֖ים רִבְּתָ֥ה גוּרֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/002.yaml
  text: and say[a], ‘What was your mother? A lioness. Among lions she lay down[b]; in the midst of young lions she reared her cubs.’
  footnotes:
  - marker: a
    text: Or 'Among lionesses she lay down.' The Hebrew plural can be understood more generally as 'lions,' but some translators render it by sense to match the feminine imagery of 'lioness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'she raised' or 'she made many' her cubs. The Hebrew verb can carry the idea of increase, but in this context it likely refers to rearing offspring.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 말하십시오. ‘너의 어머니는 무엇이었습니까? 암사자였습니다. 사자들 사이에[a] 누워 있었고, 새끼사자들 한가운데서 자기 새끼들을 길렀습니다.[b]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘암사자들 사이에 누워 있었다.’ 히브리어 복수형은 더 일반적으로 ‘사자들’로 이해할 수 있지만, 문맥의 여성적 이미지에 맞추어 뜻을 따라 ‘암사자들’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 새끼들을 키웠습니다’ 또는 ‘자기 새끼들을 많이 두었습니다.’ 히브리어 동사는 증가의 뜻을 품을 수 있지만, 이 문맥에서는 새끼를 기르는 뜻이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָמַרְתָּ
  english_pob_choice: and say
  chosen_korean: 그리고 이렇게 말하십시오
  alternatives_korean:
