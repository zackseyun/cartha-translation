  naturalness: 인용문 안의 ‘무엇이었느냐?’는 현대 합쇼체 문맥의 ‘말하십시오’ 및 ‘암사자였습니다’와 높임말 종결이 섞입니다. ‘무엇이었습니까?’로 통일하면 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘암사자’, ‘사자들’, ‘새끼사자들’, ‘새끼들을 길렀습니다’는 적절합니다. 각주 a는 ‘사자들 사이에’에, 각주 b는 ‘길렀습니다’에 붙여 해당 어휘의 대안을 정확히 가리키도록 해야 합니다.
