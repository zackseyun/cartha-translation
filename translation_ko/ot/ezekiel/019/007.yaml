  text: He knew their widows[a], and he laid waste their cities; the land and its fullness was desolated by the sound of his roaring.
  footnotes:
  - marker: a
    text: Hebrew 'he knew their/his widows.' The verb 'knew' may carry a hostile or sexual nuance in context; some understand the line more concretely as abuse of women. Others, following an alternative reading, render 'he destroyed their palaces.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들의 과부들을[a] 알았고, 그들의 도시들을 황폐하게 하였습니다. 그의 포효 소리 때문에 그 땅과 그 안에 가득한 모든 것이 황폐해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 형태상 ‘그의 과부들’이라고 합니다. 문맥과 이어지는 ‘그들의 도시들’에 따라 ‘그들의 과부들’로 이해할 수 있습니다. ‘알다’는 여기서 적대적이거나 성적인 뉘앙스를 지닌 완곡한 표현일 수 있습니다. 일부는 다른 독해에 따라 ‘그의 궁전들’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  english_pob_choice: he knew
  chosen_korean: 알았고
  alternatives_korean:
  - 알았으며
  - 침범하였고
  - 유린하였고
  lexicon: HALOT
  rationale: 기본 의미인 ‘알다’를 살리되, 본문 맥락상 성적·폭력적 뉘앙스가 있을 수 있는 어려움을 과도하게 해석하지 않고 보존하기 위해 직역에 가깝게 옮겼습니다.
- source_word: אַלְמְנוֹתָיו
  english_pob_choice: their widows
  chosen_korean: 그들의 과부들을
  alternatives_korean:
  - 그의 과부들을
  - 그들의 궁전들을
  lexicon: HALOT
  rationale: 히브리어 본문을 따라 ‘과부들’로 옮기고, 지시 대상은 영어 POB의 판단대로 ‘그들의’로 처리했습니다. 난해한 다른 독해는 본문 밖 해석 문제로 남겨 두었습니다.
- source_word: וְעָרֵיהֶם הֶחֱרִיב
  english_pob_choice: and he laid waste their cities
  chosen_korean: 그들의 도시들을 황폐하게 하였습니다
  alternatives_korean:
  - 그들의 도시들을 파괴하였습니다
  - 그들의 성읍들을 황폐하게 하였습니다
  lexicon: HALOT
  rationale: החריב의 ‘황폐하게 하다/폐허로 만들다’라는 의미를 살려, 시적·심판적 어조에 맞는 ‘황폐하게 하였습니다’를 선택했습니다.
- source_word: אֶרֶץ וּמְלֹאָהּ
  english_pob_choice: the land and its fullness
  chosen_korean: 그 땅과 그 충만한 것들
  alternatives_korean:
  - 그 땅과 그 안에 가득한 것들
  - 그 땅과 그 모든 것
  lexicon: HALOT
  rationale: 관용구를 단순 평면화하지 않고, 땅과 그 안에 채워진 모든 것을 가리키는 압축 표현을 한국어로 최대한 보존했습니다.
theological_decisions:
- issue: אַלְמְנוֹתָיו의 난해한 의미를 어떻게 처리할지
  chosen_reading: 본문의 ‘과부들’이라는 MT 어휘를 유지하고, 더 추정적인 대안은 본문이 아니라 해석 차원에 남겼습니다.
  alternative_readings:
  - 그의 과부들
  - 그들의 궁전들
  rationale: 이 구절은 교리 문제가 아니라 본문 의미가 어려운 어휘·본문비평 문제입니다. 원문 우선 원칙에 따라 MT의 표층 의미를 유지하는 편이 투명하며, 매끈한 추정을 본문에 끼워 넣지 않았습니다.
  doctrine_reference: 번역 원칙 §§1, 3, 5
