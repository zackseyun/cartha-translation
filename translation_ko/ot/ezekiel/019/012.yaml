  - 땅에 내던져졌습니다
  lexicon: HALOT
  rationale: ‘땅에’와 수동 동사를 통해 굴욕적 추락과 폭력적 이동을 함께 살렸습니다.
- source_word: מַטֵּה עֻזָּהּ
  english_pob_choice: her strong branch
  chosen_korean: 그녀의 강한 가지
  alternatives_korean:
  - 그녀의 강한 막대기
  - 그녀의 힘의 지팡이
  - 그녀의 강한 줄기
  lexicon: HALOT
  rationale: 문맥의 식물 은유를 본문에서 살리되, 히브리어가 지닌 왕권적 함의는 주해 가능한 여지를 남겼습니다.
theological_decisions:
- issue: מַטֵּה עֻזָּהּ의 이중 가능성(가지/통치 지팡이)
  chosen_reading: 본문에는 ‘그녀의 강한 가지’로 두고, 각주에 대체 의미를 제시했습니다.
  alternative_readings:
  - 그녀의 힘의 지팡이
  - 그녀의 강력한 홀
  rationale: 앞뒤가 포도나무와 그 열매의 붕괴를 그리는 연속된 은유이므로, 본문은 식물 이미지를 유지하는 편이 원문 수사에 더 충실합니다. 동시에 문맥상 왕권적 함의가 있어 각주로 보존했습니다.
  doctrine_reference: 번역 원칙 §3, §5
