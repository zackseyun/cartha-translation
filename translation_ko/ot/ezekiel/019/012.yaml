  lexicon: HALOT
  rationale: 심판 맥락의 화노를 자연스럽게 드러내면서도 축약된 전치사 구의 힘을 유지했습니다.
- source_word: לָאָרֶץ הֻשְׁלָכָה
  english_pob_choice: was thrown down to the ground
  chosen_korean: 땅에 던져졌습니다
