base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/012.yaml
  text: But she was uprooted in wrath; she was thrown down to the ground[a]. And the east wind dried up her fruit; her strong branch was torn off and withered; fire consumed it.
  footnotes:
  - marker: a
    text: Or 'her mighty scepter' or 'the rod of her strength'; the Hebrew term can carry both branch imagery and royal-rule overtones in this lament.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그녀는 진노 가운데 뿌리째 뽑혀 땅에 던져졌습니다[a]. 동풍이 그녀의 열매를 말려 버렸고, 그녀의 강한 가지는 꺾여 시들었으며, 불이 그것을 삼켜 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 힘 있는 지팡이’, ‘그녀의 힘의 막대기’로도 옮길 수 있습니다. 히브리어는 여기서 가지 이미지와 왕권적 함의를 함께 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֻּתַּשׁ
  english_pob_choice: was uprooted
  chosen_korean: 뿌리째 뽑혀
  alternatives_korean:
  - 뽑혀
  - 뿌리째 들어 올려져
  lexicon: HALOT
  rationale: 포도나무가 땅에서 제거되는 이미지를 살리기 위해 ‘뿌리째 뽑히다’를 택했습니다.
- source_word: בְּחֵמָה
