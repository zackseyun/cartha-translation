base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/009.yaml
  text: They put him in a cage with hooks[a], and brought him to the king of Babylon; they brought him into strongholds[b], so that his voice might no longer be heard on the mountains of Israel.
  footnotes:
  - marker: a
    text: Or 'into fortresses,' 'into a prison,' or possibly 'into siege works'; the Hebrew term can denote strongholds or places associated with capture/confinement.
    reason: lexical_alternative
  - marker: b
    text: Or 'his roar might no longer be heard.' The Hebrew literally says 'his voice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 갈고리[a]로 그를 우리에 가두고, 그를 바빌론 왕에게로 데리고 갔습니다. 그들은 그를 요새들[b]로 데리고 가서, 그의 소리가 더 이상 이스라엘의 산들에서 들리지 않게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고리들로.’ 히브리어는 포획한 짐승이나 포로를 제어하는 데 쓰는 갈고리나 고리를 가리킬 수 있습니다. 그것이 신체의 어느 부위에 사용되었는지는 본문이 말하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성채들로,’ ‘감옥으로,’ 혹은 ‘포위 진지들로.’ 히브리어는 견고한 장소, 또는 포획·구금과 관련된 장소를 가리킬 수 있습니다.
    reason: lexical_alternative
