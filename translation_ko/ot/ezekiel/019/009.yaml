language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּתְּנֻ֤/הוּ בַ/סּוּגַר֙ בַּֽ/חַחִ֔ים וַ/יְבִאֻ֖/הוּ אֶל מֶ֣לֶךְ בָּבֶ֑ל יְבִאֻ֨/הוּ֙ בַּ/מְּצֹד֔וֹת לְמַ֗עַן לֹא יִשָּׁמַ֥ע קוֹל֛/וֹ ע֖וֹד אֶל הָרֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/009.yaml
  text: They put him in a cage with hooks[a], and brought him to the king of Babylon; they brought him into strongholds[b], so that his voice might no longer be heard on the mountains of Israel.
  footnotes:
  - marker: a
    text: Or 'into fortresses,' 'into a prison,' or possibly 'into siege works'; the Hebrew term can denote strongholds or places associated with capture/confinement.
    reason: lexical_alternative
  - marker: b
    text: Or 'his roar might no longer be heard.' The Hebrew literally says 'his voice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그를 갈고리[a]가 달린 우리에 가두고 바빌론 왕에게로 끌고 갔으며, 그를 요새들[b]로 끌고 갔습니다. 이는 그의 소리가 더 이상 이스라엘의 산들에서 들리지 않게 하려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성채들로,’ ‘감옥으로,’ 혹은 ‘포위 진지들로’일 수 있습니다. 히브리어는 포획·구금과 연관된 견고한 장소를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 울부짖음이 더 이상 들리지 않게.’ 히브리어는 문자적으로 ‘그의 소리’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֻהוּ
  english_pob_choice: They put him
  chosen_korean: 그들은 그를 … 가두고
  alternatives_korean:
  - 그들은 그를 넣고
  - 그들은 그를 두고
  lexicon: WLC / HALOT
  rationale: 동작의 결과가 감금이라는 점을 분명히 드러내면서도, 한국어에서 자연스러운 행위 동사를 택했습니다.
- source_word: בַסּוּגַר
  english_pob_choice: in a cage
  chosen_korean: 우리
  alternatives_korean:
  - 감옥
  - 감금 장소
  lexicon: HALOT
  rationale: POB의 ‘cage’에 맞춰 포획된 짐승 이미지를 살리기 위해 ‘우리’로 옮겼습니다.
- source_word: בַּחַחִים
  english_pob_choice: with hooks
  chosen_korean: 갈고리[a]가 달린
  alternatives_korean:
  - 갈고리로
  - 고리로
  lexicon: HALOT
  rationale: 갈고리의 도구성을 드러내되, 원문이 구체적 위치를 말하지 않으므로 ‘달린’ 정도로만 처리했습니다.
- source_word: בַּמְּצֹדוֹת
  english_pob_choice: into strongholds
  chosen_korean: 요새들[b]
  alternatives_korean:
  - 성채들
  - 포위 진지들
  - 감옥
  lexicon: HALOT
  rationale: 문맥상 단순한 성채라기보다 포획·구금의 장소를 가리킬 수 있어, POB의 주석 가능성을 살려 ‘요새들’로 두었습니다.
- source_word: קוֹל
  english_pob_choice: voice
  chosen_korean: 소리
  alternatives_korean:
  - 음성
  - 목소리
  - 울부짖음
  lexicon: HALOT
  rationale: 사자 비유의 문맥에서 인간의 ‘목소리’보다 더 포괄적인 ‘소리’가 자연스럽고, POB의 ‘voice’/‘roar’ 여지를 함께 담을 수 있습니다.
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  english_pob_choice: on the mountains of Israel
  chosen_korean: 이스라엘의 산들
  alternatives_korean:
  - 이스라엘의 산지
  - 이스라엘의 산 위에서
  lexicon: HALOT
  rationale: Ezekiel 특유의 지리적 표현을 직역에 가깝게 유지해 문맥상의 상징성을 보존했습니다.
theological_decisions:
- issue: 사자 비유의 유지와 역사적 특정화
  chosen_reading: 본문의 짐승 포획 이미지를 유지하고, 왕의 정체를 본문 안에서 명시하지 않았습니다.
  alternative_readings:
  - 그 왕을 본문에서 곧바로 여호야긴 등으로 특정하는 번역
  rationale: 히브리어는 여기서 이름을 제시하지 않으므로, 비유적 레지스터를 보존하는 것이 본문이 의도한 효과를 가장 잘 전달합니다.
  doctrine_reference: Translation philosophy §§1, 3
