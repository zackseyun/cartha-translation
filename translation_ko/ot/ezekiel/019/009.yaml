  rationale: 문맥상 단순한 성채라기보다 포획·구금의 장소를 가리킬 수 있어, POB의 주석 가능성을 살려 ‘요새들’로 두었습니다.
- source_word: קוֹל
  english_pob_choice: voice
  chosen_korean: 소리
  alternatives_korean:
  - 음성
  - 목소리
  - 울부짖음
  lexicon: HALOT
  rationale: 사자 비유의 문맥에서 인간의 ‘목소리’보다 더 포괄적인 ‘소리’가 자연스럽고, POB의 ‘voice’/‘roar’ 여지를 함께 담을 수 있습니다.
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  english_pob_choice: on the mountains of Israel
  chosen_korean: 이스라엘의 산들
