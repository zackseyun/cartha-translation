source:
  edition: WLC
  text: וְ/אַתָּה֙ שָׂ֣א קִינָ֔ה אֶל נְשִׂיאֵ֖י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/001.yaml
  text: And you[b][a], raise a lamentation over the princes of Israel.
  footnotes:
  - marker: a
    text: Or 'take up a lament' or 'lift up a dirge.'
    reason: lexical_alternative
  - marker: b
    text: '''Princes'' may refer specifically to the royal rulers of Judah/Israel, not merely leaders in general.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 당신은 이스라엘의 통치자들을 두고 애가를 지으십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘애가를 지으십시오’는 문자적으로 ‘애가를 들어 올리십시오’라는 히브리어 관용구를 옮긴 것입니다. 이는 애가를 시작하여 읊거나 선포하라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘통치자들’에 해당하는 히브리어는 고위 지도자들 또는 방백들을 가리킵니다. 이 장의 문맥에서는 왕조적 통치자들을 가리킬 수 있지만, 본문은 이를 단순히 왕족이나 왕들로 한정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַתָּה
  english_pob_choice: And you,
  chosen_korean: 그리고 당신은
  alternatives_korean:
  - 그리고 너는
  - 그런데 당신은
  - 이제 당신은
  lexicon: WLC
  rationale: 직접적 지시를 살리되, 예언자에게 향한 화자 전환의 흐름을 한국어에서 자연스럽게 전달합니다.
- source_word: שָׂא קִינָה
  english_pob_choice: raise a lamentation
  chosen_korean: 애가를 지어야 합니다
  alternatives_korean:
  - 애가를 올려야 합니다
  - 슬픔의 노래를 불러야 합니다
  - 애도를 시작해야 합니다
  lexicon: HALOT
  rationale: 문자적으로는 ‘들다/일으키다’이지만 관용적으로 애가를 선포하는 뜻이므로, 시가적-예언적 기능을 드러내는 ‘애가를 짓다’로 옮겼습니다.
- source_word: אֶל נְשִׂיאֵי
  english_pob_choice: over the princes
  chosen_korean: 향해
  alternatives_korean:
  - 위하여
  - 대하여
  - 위에
  lexicon: HALOT
  rationale: 애가의 대상이 되는 사람들을 가리키므로, 한국어에서는 ‘향해’가 관계를 가장 자연스럽게 드러내며 추상화도 과하지 않습니다.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  english_pob_choice: the princes of Israel
  chosen_korean: 이스라엘의 왕족들을
  alternatives_korean:
  - 이스라엘의 방백들을
  - 이스라엘의 지도자들을
  - 이스라엘의 군주들을
  lexicon: HALOT
  rationale: ‘נְשִׂיאֵי’는 일반 지도자보다 왕실·통치 엘리트의 뉘앙스가 강하므로, 본문 맥락의 왕조적 함의를 살리되 원문의 범위를 과도하게 좁히지 않도록 ‘왕족들’로 처리했습니다.
theological_decisions:
- issue: נְשִׂיאֵי의 범위
  chosen_reading: 주된 본문은 ‘왕족들’로 두어 정치적·왕조적 함의를 드러내되, 특정 개인 왕들로 단정하지는 않습니다.
  alternative_readings:
  - 왕들
  - 지도자들
  rationale: 히브리어는 ‘왕들’보다 넓고 ‘지도자들’보다 구체적이어서, 애가의 대상이 되는 왕실 계열을 암시하면서도 본문이 허용하는 모호성을 보존하는 번역이 필요합니다.
  doctrine_reference: 본문의 역사적-문학적 범위를 유지
