  lexicon: HALOT
  rationale: 비교 표지 כ를 살려 어머니를 포도나무에 비유하는 이미지를 자연스러운 한국어로 옮겼습니다.
- source_word: בְּדָמְךָ
  english_pob_choice: in your blood
  chosen_korean: 네 피 가운데 있는
  alternatives_korean:
  - 네 피 안에 있는
  - 네 혈통 가운데 있는
  lexicon: HALOT
  rationale: 본문의 난해한 표현을 평탄화하지 않고, 영어 POB처럼 주요 난점을 본문 안에서 최대한 보존했습니다.
- source_word: עַל מַיִם שְׁתוּלָה
  english_pob_choice: planted by waters
  chosen_korean: 물가에 심긴
