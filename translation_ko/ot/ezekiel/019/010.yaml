translation:
  language: ko
  text: 네 어머니는 네 피 가운데서[a] 물가에 심긴 포도나무와 같았습니다. 그 포도나무는 많은 물로 말미암아 열매가 많고 가지가 무성했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘네 피 가운데서’입니다. 이 표현은 난해합니다. 일부는 이를 ‘네 모습을 따라’ 또는 ‘네 포도원에’로 이해하거나 본문을 그렇게 수정합니다.
    reason: alternative_reading
