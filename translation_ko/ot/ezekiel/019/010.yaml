  lexicon: HALOT
  rationale: ‘물’ 옆이라는 장소감을 담는 동시에, 식재의 이미지를 간결하게 표현했습니다.
- source_word: פֹּרִיָּה וַעֲנֵפָה
  english_pob_choice: fruitful and full of branches
  chosen_korean: 열매를 맺고 가지가 무성하였는데
  alternatives_korean:
  - 열매가 많고 가지가 무성하였는데
  - 열매 맺고 가지가 많았는데
  lexicon: HALOT
  rationale: 형용사적 표현을 한국어 서술로 풀어, 포도나무의 생산성과 번성함을 함께 살렸습니다.
- source_word: מִמַּיִם רַבִּים
  english_pob_choice: because of abundant waters
  chosen_korean: 물이 풍부했기 때문입니다
  alternatives_korean:
  - 많은 물 때문에
  - 풍성한 물로 말미암아
  lexicon: HALOT
  rationale: מִן의 원인/출처 용법을 반영해, 결실과 번성의 원인이 풍부한 물임을 분명히 했습니다.
theological_decisions:
- issue: 난해한 구절 בְּדָמְךָ의 처리
