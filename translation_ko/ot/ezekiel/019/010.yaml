  text: Your mother was like a vine in your vineyard[a], planted by waters; she was fruitful and full of branches because of abundant waters.
  footnotes:
  - marker: a
    text: Hebrew 'in your blood,' a difficult phrase. Some interpret or emend it as 'in your likeness' or 'in your vineyard.'
    reason: alternative_reading
translation:
  language: ko
  text: 네 어머니는 물가에 심긴, 네 피 가운데 있는 포도나무와 같았습니다. 그 포도나무는 열매를 맺고 가지가 무성하였는데, 이는 물이 풍부했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 직역하면 ‘네 피 가운데 있는’입니다. 다만 ‘네 닮음 가운데 있는’ 또는 ‘네 포도원에 있는’으로 이해하는 견해도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִמְּךָ
  english_pob_choice: your mother
  chosen_korean: 네 어머니
  alternatives_korean:
  - 너의 어머니
  - 어머니
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘네 어머니’이므로, 본문의 은유를 해석해 ‘왕가’로 바꾸지 않고 그대로 유지했습니다.
- source_word: כַגֶּפֶן
