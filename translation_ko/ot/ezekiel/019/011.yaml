  - 가지가 풍성한 가운데
  lexicon: HALOT
  rationale: דָּלִיּוֹת는 덩굴성 가지/매달린 가지를 가리키므로, 현대 독자가 이해하기 쉬운 ‘많은 가지들’로 옮기되 풍성함의 뜻을 유지했습니다.
theological_decisions:
- issue: 포도나무 비유에서 ‘아래/위’의 공간적 대비를 어떻게 살릴지
  chosen_reading: ‘두터운 가지들 사이에서’와 ‘드러났습니다’로 옮겨, 과장된 높이와 눈에 띄는 번성의 이미지를 유지했습니다.
  alternative_readings:
  - ‘구름들 위에서’로 옮겨 전통적 관용을 따르는 읽기
  - ‘우뚝 솟아’로 요약하는 읽기
  rationale: 히브리어 문맥은 왕권의 과시가 아니라 포도나무의 과성장을 묘사하므로, 식물적·시각적 대비를 보존하는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: 시적·예언적 비유의 문맥 보존
