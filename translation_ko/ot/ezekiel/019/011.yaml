  text: And she had strong branches for rulers’ scepters[a], and its stature rose high among the thick boughs; it was seen in its height, in the abundance of its branches.
  footnotes:
  - marker: a
    text: Or 'above the dense foliage.' The Hebrew likely refers to thick boughs or dense growth; the traditional rendering 'above the clouds' is possible but less likely in this vine context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 포도나무에는 통치자들의 홀로 쓰일 만한 강한 가지들이 있었고, 그 높이는 무성한 가지들 사이에서 높이 솟았습니다.[a] 그 포도나무는 그 높은 키와 풍성한 가지들로 눈에 띄었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빽빽한 잎사귀 위에서’. 히브리어는 이 포도나무 비유에서 무성한 가지나 빽빽한 생장을 가리킬 가능성이 크지만, 전통적으로는 ‘구름 위에서’로 옮기기도 합니다.
    reason: lexical_alternative
