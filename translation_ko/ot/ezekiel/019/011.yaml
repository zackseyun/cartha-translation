  - 그 높이에서 보였으며
  lexicon: HALOT
  rationale: נִפְעַל의 수동성을 살려 ‘드러났으며’로 옮기고, בְּגָבְהוֹ의 서술적 용법을 한국어의 병렬 표현으로 처리했습니다.
- source_word: בְּרֹב דָּלִיֹּתָיו
  english_pob_choice: in the abundance of its branches
  chosen_korean: 많은 가지들 가운데
  alternatives_korean:
