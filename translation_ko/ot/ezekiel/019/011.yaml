  lexicon: HALOT
  rationale: שֵׁבֶט의 ‘홀/지팡이’ 의미를 살리되, אֶל의 방향·적합성 뉘앙스를 한국어에서는 ‘맞먹는’으로 자연스럽게 표현했습니다.
- source_word: עַל בֵּין עֲבֹתִים
  english_pob_choice: among the thick boughs
