  text: וַ/יִּֽהְיוּ לָ֞/הּ מַטּ֣וֹת עֹ֗ז אֶל שִׁבְטֵי֙ מֹֽשְׁלִ֔ים וַ/תִּגְבַּ֥הּ קֽוֹמָת֖/וֹ עַל בֵּ֣ין עֲבֹתִ֑ים וַ/יֵּרָ֣א בְ/גָבְה֔/וֹ בְּ/רֹ֖ב דָּלִיֹּתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/011.yaml
  text: And she had strong branches for rulers’ scepters[a], and its stature rose high among the thick boughs; it was seen in its height, in the abundance of its branches.
  footnotes:
  - marker: a
    text: Or 'above the dense foliage.' The Hebrew likely refers to thick boughs or dense growth; the traditional rendering 'above the clouds' is possible but less likely in this vine context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그에게는 통치자의 홀에 맞먹는 강한 가지들이 있었고, 그의 키는 두터운 가지들 사이에서 높아졌으며, 그 높이와 많은 가지들 가운데서 드러났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두터운 수풀 위에서’. 히브리어는 구름보다 두터운 가지나 빽빽한 생장을 가리킬 가능성이 더 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטּוֹת עֹז
  english_pob_choice: strong branches
  chosen_korean: 강한 가지들
  alternatives_korean:
  - 강한 막대기들
  - 힘센 지팡이들
  lexicon: HALOT
  rationale: 포도나무 비유의 문맥이므로 מַטּוֹת을 식물 이미지인 ‘가지들’로 살리고, עֹז는 ‘강한’으로 옮겨 힘의 뉘앙스를 반영했습니다.
- source_word: אֶל שִׁבְטֵי מֹשְׁלִים
  english_pob_choice: for rulers’ scepters
  chosen_korean: 통치자의 홀에 맞먹는
  alternatives_korean:
  - 통치자들의 홀을 위한
  - 통치자들의 홀에 이르는
  lexicon: HALOT
  rationale: שֵׁבֶט의 ‘홀/지팡이’ 의미를 살리되, אֶל의 방향·적합성 뉘앙스를 한국어에서는 ‘맞먹는’으로 자연스럽게 표현했습니다.
- source_word: עַל בֵּין עֲבֹתִים
  english_pob_choice: among the thick boughs
  chosen_korean: 두터운 가지들 사이에서
  alternatives_korean:
  - 두터운 수풀 가운데
  - 짙은 가지들 사이에서
  - 구름들 위에서
  lexicon: HALOT
  rationale: 이 포도나무 비유에서는 ‘구름’보다 밀생한 가지·잎의 이미지가 직접적이므로, עֲבֹתִים을 ‘두터운 가지들’로 옮겼습니다.
- source_word: וַיֵּרָא בְגָבְהוֹ
  english_pob_choice: it was seen in its height
  chosen_korean: 그 높이와 함께 드러났으며
  alternatives_korean:
  - 그 높이로 인해 보였으며
  - 그 높이에서 보였으며
  lexicon: HALOT
  rationale: נִפְעַל의 수동성을 살려 ‘드러났으며’로 옮기고, בְּגָבְהוֹ의 서술적 용법을 한국어의 병렬 표현으로 처리했습니다.
- source_word: בְּרֹב דָּלִיֹּתָיו
  english_pob_choice: in the abundance of its branches
  chosen_korean: 많은 가지들 가운데
  alternatives_korean:
  - 많은 뻗은 가지들 가운데
  - 가지가 풍성한 가운데
  lexicon: HALOT
  rationale: דָּלִיּוֹת는 덩굴성 가지/매달린 가지를 가리키므로, 현대 독자가 이해하기 쉬운 ‘많은 가지들’로 옮기되 풍성함의 뜻을 유지했습니다.
theological_decisions:
- issue: 포도나무 비유에서 ‘아래/위’의 공간적 대비를 어떻게 살릴지
  chosen_reading: ‘두터운 가지들 사이에서’와 ‘드러났습니다’로 옮겨, 과장된 높이와 눈에 띄는 번성의 이미지를 유지했습니다.
  alternative_readings:
  - ‘구름들 위에서’로 옮겨 전통적 관용을 따르는 읽기
  - ‘우뚝 솟아’로 요약하는 읽기
  rationale: 히브리어 문맥은 왕권의 과시가 아니라 포도나무의 과성장을 묘사하므로, 식물적·시각적 대비를 보존하는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: 시적·예언적 비유의 문맥 보존
