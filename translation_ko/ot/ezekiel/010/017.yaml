  lexicon: HALOT
  rationale: ב + 부정사구의 시간·상황 용법을 한국어 조건문처럼 자연스럽게 옮기되, 환상 내에서의 정지 상태를 드러내기 위해 ‘서 있으면’으로 다듬었습니다.
- source_word: יַעֲמֹדוּ
