  text: בְּ/עָמְדָ֣/ם יַעֲמֹ֔דוּ וּ/בְ/רוֹמָ֖/ם יֵר֣וֹמּוּ אוֹתָ֑/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/017.yaml
  text: When they stood still[a], these stood still; and when they were lifted up, these were lifted up with them, for the spirit of the living creature was in them.
  footnotes:
  - marker: a
    text: Or 'the spirit of life was in them,' if הַחַיָּה is taken more abstractly; Hebrew also allows the nuance of 'breath' or 'wind' for 'spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 서 있으면 이것들도 서 있고, 그들이 들리면 이것들도 그들과 함께 들립니다. 이는 살아 있는 생물의 영이 그들 안에 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘서 있으면’은 히브리어의 시간·상황적 용법을 자연스럽게 옮긴 것이며, 직역하면 ‘그들이 서 있을 때’입니다.
    reason: source_note
lexical_decisions:
- source_word: בְּעָמְדָם
  english_pob_choice: when they stood still
  chosen_korean: 그들이 서 있으면
  alternatives_korean:
  - 그들이 서 있을 때
  - 그들이 멈추면
  lexicon: HALOT
  rationale: ב + 부정사구의 시간·상황 용법을 한국어 조건문처럼 자연스럽게 옮기되, 환상 내에서의 정지 상태를 드러내기 위해 ‘서 있으면’으로 다듬었습니다.
- source_word: יַעֲמֹדוּ
  english_pob_choice: these stood still
  chosen_korean: 이것들도 서 있고
  alternatives_korean:
  - 이것들도 서 있습니다
  - 이것들도 멈춰 있습니다
  lexicon: HALOT
  rationale: 문맥상 대상은 그룹과 함께 움직이는 바퀴이므로, 지시어 ‘이것들’을 보존하고 서술의 병렬성을 살려 ‘서 있고’로 대응시켰습니다.
- source_word: רוּחַ הַחַיָּה
  english_pob_choice: the spirit of the living creature
  chosen_korean: 살아 있는 생물의 영
  alternatives_korean:
  - 생물의 영
  - 살아 있는 생명의 영
  - 살아 있는 생물의 숨
  lexicon: HALOT
  rationale: רוּחַ의 의미 범위(영/숨/바람)를 보존하되, 환상 설명의 동력 원리를 가리키는 점을 살려 ‘영’으로 번역했습니다. הַחַיָּה는 에스겔의 문맥상 ‘living creature’에 맞추어 ‘살아 있는 생물’로 옮겼습니다.
- source_word: בָּהֶם
  english_pob_choice: was in them
  chosen_korean: 그들 안에 있기 때문입니다
  alternatives_korean:
  - 그 안에 있기 때문입니다
  - 그들 속에 있기 때문입니다
  lexicon: HALOT
  rationale: 단순한 장소 관계를 자연스러운 한국어로 풀어, 원문의 인과 연결(כִּי)을 살린 설명절로 처리했습니다.
theological_decisions:
- issue: רוּחַ의 의미를 환상 안에서 어떻게 보존할지
  chosen_reading: 살아 있는 생물의 영
  alternative_readings:
  - 생명의 숨
  - 바람
  rationale: 이 구절은 바퀴와 생물의 동작이 완전히 일치하는 이유를 설명하므로, 단순한 물리적 ‘바람’보다 생동과 인도를 포함하는 ‘영’이 원문의 신학적 긴장을 더 잘 유지합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
