  source_fidelity: 수정이 필요합니다. 원문의 두 시간절은 ‘그들이 서 있을 때/들려 올라갈 때’라는 의미인데, 초안의 ‘들리면’과 ‘들립니다’는 한국어에서 주로 청각적 의미로 이해되어 רום(높이 들리다, 올라가다)의 물리적 상승을 전달하지 못합니다. ‘들려 올라가다’로 고쳐야 합니다. 또한 원문의 단수 정관사형 הַחַיָּה는 문맥상 집합적일 수 있으므로 ‘그 생물’로 옮기고 주석에서 대안을 보존하는 것이 적절합니다.
  naturalness: ‘그들이 서 있으면’도 가능한 표현이지만, 상관된 두 시간절에는 ‘그들이 서 있을 때 … 그들이 들려 올라갈 때’가 더 자연스럽고 원문의 시간적 병렬을 명확히 나타냅니다. ‘이것들도’는 앞 문맥의 바퀴를 가리키는 지시어로 자연스럽습니다.
  terminology: 에스겔 환상의 חַיָּה에는 ‘생물’을 사용하고, רוּחַ는 ‘영’으로 유지합니다. ‘살아 있는 생물’은 중복적이고 다소 부자연스러우므로 ‘그 생물’이 더 적절합니다. ‘영’의 숨/바람 및 ‘생명의 영’이라는 해석 가능성은 주석으로 보존합니다.
