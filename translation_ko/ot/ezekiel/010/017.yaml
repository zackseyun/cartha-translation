  alternatives_korean:
  - 이것들도 서 있습니다
  - 이것들도 멈춰 있습니다
  lexicon: HALOT
  rationale: 문맥상 대상은 그룹과 함께 움직이는 바퀴이므로, 지시어 ‘이것들’을 보존하고 서술의 병렬성을 살려 ‘서 있고’로 대응시켰습니다.
- source_word: רוּחַ הַחַיָּה
  english_pob_choice: the spirit of the living creature
  chosen_korean: 살아 있는 생물의 영
  alternatives_korean:
  - 생물의 영
  - 살아 있는 생명의 영
  - 살아 있는 생물의 숨
  lexicon: HALOT
  rationale: רוּחַ의 의미 범위(영/숨/바람)를 보존하되, 환상 설명의 동력 원리를 가리키는 점을 살려 ‘영’으로 번역했습니다. הַחַיָּה는 에스겔의 문맥상 ‘living creature’에 맞추어 ‘살아 있는 생물’로 옮겼습니다.
- source_word: בָּהֶם
  english_pob_choice: was in them
  chosen_korean: 그들 안에 있기 때문입니다
  alternatives_korean:
  - 그 안에 있기 때문입니다
  - 그들 속에 있기 때문입니다
  lexicon: HALOT
  rationale: 단순한 장소 관계를 자연스러운 한국어로 풀어, 원문의 인과 연결(כִּי)을 살린 설명절로 처리했습니다.
theological_decisions:
- issue: רוּחַ의 의미를 환상 안에서 어떻게 보존할지
  chosen_reading: 살아 있는 생물의 영
  alternative_readings:
  - 생명의 숨
  - 바람
  rationale: 이 구절은 바퀴와 생물의 동작이 완전히 일치하는 이유를 설명하므로, 단순한 물리적 ‘바람’보다 생동과 인도를 포함하는 ‘영’이 원문의 신학적 긴장을 더 잘 유지합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
