id: EZK.10.15
reference: Ezekiel 10:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּרֹ֖מּוּ הַ/כְּרוּבִ֑ים הִ֣יא הַ/חַיָּ֔ה אֲשֶׁ֥ר רָאִ֖יתִי בִּֽ/נְהַר כְּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/015.yaml
  text: And the cherubim rose up[a]. They were the living creature that I had seen by the Kebar Canal.
  footnotes:
  - marker: a
    text: Or, 'They were the living creatures that I saw by the river Chebar.' The Hebrew has singular 'the living creature,' likely identifying the cherubim with the class of beings seen earlier; 'Kebar Canal' may also be rendered 'river Chebar.'
    reason: alternative_reading
translation:
  language: ko
  text: 그룹들은 올라갔습니다. 그것은 내가 그발 강에서 보았던 살아 있는 생물이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들은 내가 그발 강에서 보았던 살아 있는 생물들이었습니다.’ 히브리어는 단수 ‘살아 있는 생물’을 쓰며, 아마도 앞에서 본 존재들의 종류를 가리켜 그룹들과 동일시합니다. ‘그발 강’은 ‘그발 운하’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרֹמּוּ
  english_pob_choice: rose up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 올라왔습니다
  - 들려 올라갔습니다
  lexicon: HALOT
  rationale: 위로 상승하는 움직임을 자연스러운 현대 한국어로 옮겼습니다. ‘올라갔습니다’는 비전 장면의 상승 동작을 잘 살리면서도 과도하게 수동적으로 만들지 않습니다.
- source_word: הַכְּרוּבִים
  english_pob_choice: the cherubim
  chosen_korean: 그룹들은
  alternatives_korean:
  - 케루빔은
  - 그룹들
  lexicon: HALOT
  rationale: 히브리어 כְּרוּבִים은 성경적 음역형을 살려 ‘그룹들’로 옮겼습니다. ‘그룹’은 전통적 ‘천사’로 평준화하지 않고, 에스겔의 환상적 존재라는 종별 감각을 유지합니다.
- source_word: הַחַיָּה
  english_pob_choice: the living creature
  chosen_korean: 살아 있는 생물
  alternatives_korean:
  - 살아 있는 생명체
  - 생물
  lexicon: HALOT
  rationale: 에스겔 1장과 10장에서 반복되는 환상적 존재를 가리키므로, 한국어에서 가장 직접적인 대응인 ‘살아 있는 생물’을 택했습니다. 단수형을 유지해 히브리어의 ‘the living creature’와의 연결을 보존했습니다.
- source_word: בִּנְהַר כְּבָר
  english_pob_choice: by the Kebar Canal
  chosen_korean: 그발 강에서
  alternatives_korean:
  - 그발 운하에서
  - 케바르 강에서
  lexicon: HALOT
  rationale: 지명은 한국어 성경에서 널리 알려진 ‘그발’을 사용했고, נְהַר는 문맥상 강/수로를 뜻하므로 자연스럽게 ‘강에서’로 옮겼습니다. POB의 ‘Canal’ 선택과 달리, 본문 자체의 장소 인식을 한국어 독자가 즉시 이해할 수 있게 했습니다.
theological_decisions:
- issue: ‘group of cherubim’과 ‘the living creature’의 동일시
  chosen_reading: ‘그룹들은 … 살아 있는 생물이었습니다’로 옮겨, 히브리어의 집합적이면서도 단수적인 동일시를 그대로 살렸습니다.
  alternative_readings:
  - ‘그것은 … 생물이었습니다’처럼 단수로만 처리
  - ‘그룹은 … 생물들이었습니다’처럼 복수로만 처리
  rationale: 히브리어는 복수 주어 뒤에 단수 계사와 단수 명사를 두어, 이전 환상과의 동일시를 문학적으로 강조합니다. 한국어는 주어-서술 호응을 위해 복수 주어와 단수 보어를 병치하되, 동일시의 긴장을 풀지 않았습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it.
