review_pass:
  verdict: revise
  source_fidelity: 원문은 한 그룹이 그룹들 사이에서 손을 내밀어 그 사이에 있는 불에 이르고, 그것을 들어 아마포 옷을 입은 이의 두 손바닥에 놓은 뒤 그 인물이 받아 나가는 순서를 나타냅니다. 초안의 ‘불로, 그것을 집어’는 조사와 문장 연결이 부자연스러워 ‘불 쪽으로 손을 뻗어, 그것을 들어’로 고쳐야 합니다. חָפְנֵי는 쌍수 형태이므로 ‘두 손바닥’이 적절합니다.
  naturalness: ‘그룹이 … 불 쪽으로 손을 뻗어’는 현대 표준어 합쇼체에서 자연스럽고, 동작의 방향과 연속성을 명료하게 드러냅니다. ‘아마포 옷을 입은 이’도 격조를 유지하면서 자연스럽습니다.
  terminology: ‘그룹’과 ‘아마포’는 통용되는 성서 용어로 유지할 수 있습니다. 원문이 이 절에서 수령자를 명시적으로 ‘사람’이라 부르지 않으므로 ‘아마포 옷을 입은 이’를 유지합니다. 공간 표현을 설명하는 각주 a는 반복된 두 표현 모두에 걸리도록 본문에 배치합니다.
  issues:
  - severity: medium
    issue: ‘불로, 그것을 집어’의 문법 및 연결
    rationale: ‘불로’는 여기서 손을 뻗는 목표를 자연스럽게 표시하지 못하며, 쉼표 뒤의 ‘그것을’과도 연결이 어색합니다. 원문의 אֶל(…으로/…쪽으로)과 동작 순서를 반영해 ‘불 쪽으로 손을 뻗어, 그것을 들어’로 고칩니다.
  - severity: low
    issue: חָפְנֵי의 수 표현
    rationale: 초안의 단수 ‘손바닥’은 히브리어 쌍수형을 충분히 반영하지 못합니다. ‘두 손바닥’이 구체적 의미를 보존합니다.
  - severity: low
    issue: 각주 표지 위치
    rationale: 초안은 모든 표지를 절 끝에 몰아두어 어느 표현을 설명하는지 불분명합니다. 공간 표현과 수령자 표현 뒤에 각각 붙입니다.
