reference: Ezekiel 10:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ הַ/כְּר֨וּב אֶת יָד֜/וֹ מִ/בֵּינ֣וֹת לַ/כְּרוּבִ֗ים אֶל הָ/אֵשׁ֙ אֲשֶׁר֙ בֵּינ֣וֹת הַ/כְּרֻבִ֔ים וַ/יִּשָּׂא֙ וַ/יִּתֵּ֔ן אֶל חָפְנֵ֖י לְבֻ֣שׁ הַ/בַּדִּ֑ים וַ/יִּקַּ֖ח וַ/יֵּצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/007.yaml
  text: Then the cherub stretched out his hand from among the cherubim to the fire that was among the cherubim[a], and he lifted it up and put it into the palms of the one clothed in linen[b], who took it and went out.
  footnotes:
  - marker: a
    text: Or, more formally, 'from between the cherubim' ... 'the fire that was between the cherubim.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'to the palms of the one clothed in linen'; in context this is the same figure earlier called 'the man clothed in linen' (10:2, 10:6).
    reason: cross_reference
translation:
  language: ko
  text: 그룹이 그룹들 사이에서 그룹들 사이에 있는 불 쪽으로 손을 뻗어, 그것을 들어 아마포 옷을 입은 이의 두 손바닥에 놓았습니다.[a][b] 그가 그것을 받아 나갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그룹들 사이에서’ 및 ‘그룹들 사이에 있는’입니다. 본문은 이 공간 관계를 반복하여, 그 사이에서 불이 옮겨지는 장면을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 이 인물은 10:2, 10:6의 ‘아마포 옷을 입은 사람’과 같은 인물입니다.
    reason: cross_reference
lexical_decisions:
- source_word: הַכְּרוּב
  english_pob_choice: the cherub
  chosen_korean: 그룹
  alternatives_korean:
  - 그룹 하나
  - 그룹
  lexicon: HALOT
  rationale: 히브리어 단수형 주어를 살려 단수 행동을 보이는 존재로 옮겼습니다. 관용적 한국어 성서어인 ‘그룹’을 사용하되, 복수 전체와 혼동되지 않도록 문맥상 단수 주어로 처리했습니다.
- source_word: מִבֵּינוֹת לַכְּרוּבִים / בֵּינוֹת הַכְּרֻבִים
  english_pob_choice: from among the cherubim / among the cherubim
  chosen_korean: 그룹들 사이에서 / 그룹들 사이에 있는
  alternatives_korean:
  - 그룹들 가운데서
  - 그룹들 사이에서
  lexicon: HALOT
  rationale: 반복되는 위치 표현을 한국어로 자연스럽게 살려, 단순한 이동이 아니라 그룹들 ‘사이’라는 공간 관계를 보이게 했습니다.
- source_word: וַיִּשָּׂא וַיִּתֵּן
  english_pob_choice: he lifted it up and put it into
  chosen_korean: 불로, 그것을 집어 … 손바닥에 두었습니다
  alternatives_korean:
  - 그것을 들어 … 손바닥에 놓았습니다
  - 그것을 집어 … 손바닥에 주었습니다
  lexicon: HALOT
  rationale: 동작의 연속인 ‘들어 옮김/넣음’을 한국어 동사 연쇄로 살렸습니다. 영어 본문의 ‘it’은 문맥상 불/숯을 가리키므로, 대상이 분명해지도록 ‘불로’로 받았습니다.
- source_word: חָפְנֵי
  english_pob_choice: the palms
  chosen_korean: 손바닥
  alternatives_korean:
  - 두 손바닥
  - 오므린 손바닥
  lexicon: HALOT
  rationale: 히브리어는 손의 오목한 부분을 가리키므로 ‘손바닥’이 가장 직접적입니다. 문맥상 두 손바닥을 뜻할 수 있으나 원문에는 복수 표지가 없으므로 단순형을 유지했습니다.
- source_word: לְבֻשׁ הַבַּדִּים
  english_pob_choice: the one clothed in linen
  chosen_korean: 아마포 옷 입은 이
  alternatives_korean:
  - 아마포 옷을 입은 사람
  - 아마포를 입은 이
  lexicon: HALOT
  rationale: 이 절 자체는 ‘사람’이라는 명사를 반복하지 않으므로, 앞선 문맥을 과하게 끌어오지 않도록 ‘이’로 간결하게 옮겼습니다. ‘아마포’는 제의적/시각적 표지를 살리는 표준 번역입니다.
theological_decisions:
- issue: 불/숯의 대상이 한국어에서 얼마나 구체적으로 드러나는가
  chosen_reading: 문맥상 ‘불’로 이해되지만, 원문은 직접 목적어를 생략하므로 번역도 그 긴장을 유지했습니다.
  alternative_readings:
  - 숯
  - 불덩이
  - 그것
  rationale: 히브리어는 빼앗아 옮기는 대상을 암시할 뿐 명시하지 않습니다. 한국어 본문은 자연성을 위해 ‘불로’라 하되, 과도한 구체화인 ‘숯’을 본문에 확정적으로 넣지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
