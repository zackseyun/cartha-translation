id: EZK.10.22
reference: Ezekiel 10:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/דְמ֣וּת פְּנֵי/הֶ֔ם הֵ֣מָּה הַ/פָּנִ֗ים אֲשֶׁ֤ר רָאִ֨יתִי֙ עַל נְהַר כְּבָ֔ר מַרְאֵי/הֶ֖ם וְ/אוֹתָ֑/ם אִ֛ישׁ אֶל עֵ֥בֶר פָּנָ֖י/ו יֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/022.yaml
  text: And the likeness of their faces was the same as the faces that I had seen by the Kebar River—their appearances and themselves[b][a]. Each one went straight ahead.
  footnotes:
  - marker: a
    text: Literally, 'their appearance and themselves,' emphasizing that these were the same beings Ezekiel had seen earlier by the Kebar River.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'each one went toward the direction of his face,' an idiom meaning they moved straight forward without turning.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 얼굴 모양은 내가 그발 강가에서 보았던 얼굴들과 같았습니다. 그들의 모습과 그들 자신도 그러했습니다[a]. 각각은 곧장 앞으로 나아갔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 모습과 그들 자신’입니다. 히브리어의 압축된 반복은 에스겔이 이전에 본 존재들과 지금 보는 존재들이 동일하다는 점을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘각각은 자기 얼굴이 향한 쪽으로 갔습니다’입니다. 관용구로서 방향을 바꾸지 않고 곧장 전진한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת / דְּמוּת
  english_pob_choice: the likeness
  chosen_korean: 모양은 … 같았습니다
  alternatives_korean:
  - 형상은 … 같았습니다
  - 모습은 … 같았습니다
  lexicon: HALOT
  rationale: דְּמוּת의 핵심인 유사성과 대응 관계를 살리기 위해 ‘모양’과 ‘같다’를 함께 써서, 단순한 외형 묘사보다 동일성의 비교를 드러냈습니다.
- source_word: פְּנֵיהֶם / הַפָּנִים
  english_pob_choice: their faces ... the faces
  chosen_korean: 그들의 얼굴의 모양 … 얼굴들
  alternatives_korean:
  - 그들의 얼굴 … 그 얼굴
  - 그들의 모습 … 그 모습
  lexicon: HALOT
  rationale: פָּנִים의 문자적 의미인 ‘얼굴’을 유지해 환상 속 존재들의 구체적 이미지를 보존했습니다.
- source_word: מַרְאֵיהֶם וְאוֹתָם
  english_pob_choice: their appearances and themselves
  chosen_korean: 그들의 모습과 그들 자신
  alternatives_korean:
  - 그들의 나타남과 그들 자신
  - 그들의 외형과 그들
  lexicon: HALOT
  rationale: 히브리어의 압축적 반복을 살려 단순한 중복이 아니라 앞선 환상과의 동일성을 강조하는 표현으로 옮겼습니다.
- source_word: אִישׁ אֶל עֵבֶר פָּנָיו יֵלֵכוּ
  english_pob_choice: Each one went straight ahead
  chosen_korean: 각각은 곧장 앞으로 나아갔습니다
  alternatives_korean:
  - 각각은 자기 얼굴의 방향으로 갔습니다
  - 각각은 앞으로 곧게 갔습니다
  lexicon: HALOT
  rationale: 직역하면 관용구이므로, 의미 기능을 살려 ‘곧장 앞으로’로 옮겨 방향을 바꾸지 않고 전진한다는 뜻을 분명히 했습니다.
theological_decisions:
- issue: 환상 속 존재들의 동일성 강조
  chosen_reading: ‘그들의 모습과 그들 자신’으로 옮겨, 이전 그발 강가 환상과 동일한 존재들이라는 중첩된 확인을 드러냈습니다.
  alternative_readings:
  - 의미를 풀어 ‘같은 존재들이었습니다’로 정리하는 방식
  - 단순히 ‘그들의 모습’만 옮겨 중복을 줄이는 방식
  rationale: 본문은 시각적 유사성만이 아니라 동일성 자체를 재확인하므로, 압축된 중복을 지우지 않고 유지하는 것이 해석상 중요합니다.
  doctrine_reference: 에스겔 1장 환상과의 연속성
- issue: 전진의 방향성
  chosen_reading: ‘곧장 앞으로 나아갔습니다’로 관용구를 자연스럽게 옮겼습니다.
  alternative_readings:
  - ‘자기 얼굴의 방향으로 갔습니다’의 직역
  - ‘멈추지 않고 앞으로 갔습니다’의 풀어쓰기
  rationale: 히브리어 관용구가 전달하는 ‘돌이키지 않고 직진함’의 의미를 한국어로 명확하게 드러내는 것이 본문 의도에 가장 가깝습니다.
  doctrine_reference: 환상 속 생물들의 질서 있고 일관된 움직임
