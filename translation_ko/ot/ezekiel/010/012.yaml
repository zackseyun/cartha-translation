base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/012.yaml
  text: And all their bodies[a], their backs, their hands, their wings[b], and the wheels were full of eyes all around—the wheels belonging to the four of them.
  footnotes:
  - marker: a
    text: Or, more literally, 'their flesh.'
    reason: lexical_alternative
  - marker: b
    text: The final clause may be rendered more compactly, 'their four wheels' or 'the wheels of the four of them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들의 몸과 등의 면과 손과 날개와 바퀴들은 사방으로 눈으로 가득하였으니 — 그 네 것의 바퀴들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 살’입니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 더 간단히 ‘네 생물의 바퀴들’ 또는 ‘그 넷의 바퀴들’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂרָם
  english_pob_choice: their bodies
  chosen_korean: 그들의 몸
  alternatives_korean:
  - 그들의 육체
  - 그들의 살
  lexicon: HALOT
  rationale: 열거된 신체 부위 맥락에서는 בָּשָׂר의 문자적 ‘살’보다 전체 형체를 뜻하는 ‘몸’이 한국어에서 자연스럽고, POB의 ‘their bodies’와도 대응됩니다.
- source_word: גַבֵּיהֶם
  english_pob_choice: their backs
  chosen_korean: 등의 면
  alternatives_korean:
  - 등
  - 등판
  - 등쪽
  lexicon: HALOT
  rationale: 직역하면 ‘등’이지만, הַגַּבִּים가 생명체의 외형적 표면을 가리키는 듯한 이 목록에서는 ‘등의 면’이 시각적 묘사를 더 잘 살립니다.
- source_word: מְלֵאִים עֵינַיִם סָבִיב
  english_pob_choice: were full of eyes all around
  chosen_korean: 사방으로 눈으로 가득하였으니
  alternatives_korean:
  - 눈으로 사방 가득하였으니
  - 사방이 눈으로 가득하였으니
  lexicon: HALOT
  rationale: ‘눈으로 가득’이라는 구조를 유지하되, ‘사방으로’로 סָבִיב의 방향성을 살려 현대 한국어 문장으로 자연스럽게 옮겼습니다.
- source_word: לְאַרְבַּעְתָּם / אוֹפַנֵּיהֶם
  english_pob_choice: the wheels belonging to the four of them
  chosen_korean: 그 네 것의 바퀴들
  alternatives_korean:
  - 네 생물의 바퀴들
  - 그 넷의 바퀴들
  lexicon: HALOT
  rationale: 라멕 관계형의 소속/연관을 드러내기 위해 단순 소유격보다 ‘그 네 것의’로 옮겨, 바퀴가 네 생물에 속한 것임을 분명히 했습니다.
theological_decisions:
- issue: 열거의 신체 부위와 환상적 존재의 묘사
  chosen_reading: ‘몸, 등의 면, 손, 날개, 바퀴’의 물리적 열거를 최대한 유지해 환상의 구체성과 기괴함을 약화하지 않았습니다.
  alternative_readings:
  - 비유적으로 완화해 ‘형체’나 ‘겉모습’으로 묶는 읽기
  rationale: 본문은 환상 속 존재의 구성 요소를 세밀하게 나열하므로, 이를 추상화하지 않고 그대로 드러내는 것이 소스의 의도를 가장 잘 보존합니다.
  doctrine_reference: 에스겔 10장의 환상 묘사 원문 보존 원칙
