- from: 그리고 그들의 몸과 등의 면과 손과 날개와 바퀴들은 사방으로 눈으로 가득하였으니 — 그 네 것의 바퀴들이었습니다.[a][b]
  to: 그들의 온몸[a]과 등과 손과 날개와 바퀴, 곧 그 네 생물에 속한 바퀴들[b]은 사방에 눈이 가득하였습니다.
  rationale: ‘등의 면’을 원문의 기본 의미와 현대 한국어에 맞는 ‘등’으로 고치고, ‘그 네 것’을 문맥상 네 생물을 가리키는 표현으로 바로잡았습니다. 마지막의 반복된 ‘바퀴’를 ‘곧’으로 동격 처리하여 히브리어의 명료화 기능과 라멕의 연관·소속 뉘앙스를 보존했습니다. ‘온몸’ 및 ‘눈이 가득하였습니다’는 신체 부위의 열거와 환상적 묘사를 자연스럽게 유지합니다.
