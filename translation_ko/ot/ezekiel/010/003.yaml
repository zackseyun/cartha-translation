  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/כְּרֻבִ֗ים עֹֽמְדִ֛ים מִ/ימִ֥ין לַ/בַּ֖יִת בְּ/בֹא֣/וֹ הָ/אִ֑ישׁ וְ/הֶ/עָנָ֣ן מָלֵ֔א אֶת הֶ/חָצֵ֖ר הַ/פְּנִימִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/003.yaml
  text: Now the cherubim were standing on the right side of the house when the man went in[a], and the cloud filled the inner court.
  footnotes:
  - marker: a
    text: 'Hebrew: ''on the right side of the house.'' In temple orientation this refers to the south side.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그룹한들은 집의 오른쪽에 서 있었는데, 그 사람이 들어갈 때 그 구름이 안뜰을 가득 채웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ''집의 오른쪽에''. 성전 방향에서는 이것이 남쪽을 가리킵니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכְּרֻבִים
  english_pob_choice: the cherubim
  chosen_korean: 그룹한들
  alternatives_korean:
  - 케루빔
  - 그룹들
  lexicon: HALOT
  rationale: 히브리어 כרוב의 표준 음역을 따르되, 한국어 성경 문맥에서 통용되는 천상 존재 명칭으로 옮겼습니다. '그룹들'보다 고유한 존재 명칭임이 더 분명하게 드러납니다.
- source_word: עֹמְדִים
  english_pob_choice: were standing
  chosen_korean: 서 있었는데
  alternatives_korean:
  - 서 있었습니다
  - 서 있었습니다만
  lexicon: HALOT
  rationale: 분사형의 지속적 상태를 살려 장면 속 자세를 자연스럽게 나타냈습니다.
- source_word: מִימִין לַבַּיִת
  english_pob_choice: on the right side of the house
  chosen_korean: 집의 오른쪽에
  alternatives_korean:
  - 집의 남쪽에
  - 집의 오른편에
  lexicon: HALOT
  rationale: 원문은 문자적으로 '집의 오른쪽'이므로 이를 직접 살렸습니다. 본절만으로는 방향을 남쪽으로 풀어 쓰지 않는 것이 더 투명합니다.
- source_word: בְּבֹאוֹ הָאִישׁ
  english_pob_choice: when the man went in
  chosen_korean: 그 사람이 들어갈 때
  alternatives_korean:
  - 그 사람이 들어갔을 때
  - 사람이 들어올 때
  lexicon: HALOT
  rationale: 부사적 זמן용법을 자연스럽게 살려 '들어갈 때'로 옮겼고, 히브리어의 단순한 '그 사람'을 유지했습니다.
- source_word: הֶעָנָן ... הֶחָצֵר הַפְּנִימִית
  english_pob_choice: the cloud ... the inner court
  chosen_korean: 그 구름이 안뜰을
  alternatives_korean:
  - 그 구름이 내뜰을
  - 구름이 안쪽 뜰을
  lexicon: HALOT
  rationale: 성전 용어로 '내뜰'도 가능하지만, 현대 한국어에서 더 즉시 이해되는 '안뜰'을 택했습니다. 구름은 특정한 영광의 현현이지만 명사 자체는 단순히 '구름'으로 유지했습니다.
theological_decisions:
- issue: מִימִין의 공간 방향 처리
  chosen_reading: 원문 그대로 '집의 오른쪽'으로 옮겼습니다.
  alternative_readings:
  - 집의 남쪽
  - 집의 오른편
  rationale: 성전 방향성을 해석해 남쪽으로 풀 수도 있지만, 본절의 히브리어가 직접 말하는 공간 관계는 '오른쪽'이므로 본문 표면 의미를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
