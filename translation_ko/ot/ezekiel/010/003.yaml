  naturalness: ‘그룹들’은 한국어 성경 문맥에서 자연스럽고 널리 알아볼 수 있는 표현입니다. 시간절을 문두에 두고 두 장면을 ‘-고’로 연결하면 원문의 동시적 장면 전개를 현대 합쇼체로 명료하게 전달합니다.
