translation:
  language: ko
  text: 내가 보니, 그룹들 곁에 네 바퀴가 있었는데, 각 그룹 곁에 한 바퀴씩 있었고, 그 바퀴들의 모습은 황옥 같은 돌의 모양이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘다르시스 돌’의 정확한 보석 동정은 확실하지 않습니다. 황옥, 베릴, 또는 다른 귀석을 가리킬 수 있습니다.
    reason: lexical_alternative
