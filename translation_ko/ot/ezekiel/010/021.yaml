lexical_decisions:
- source_word: אַרְבָּעָה אַרְבָּעָה / לְאֶחָד
  english_pob_choice: Each one had four
  chosen_korean: 각 생물은 네 얼굴이 있고
  alternatives_korean:
  - 각자 네 얼굴이 있었습니다
  - 네 얼굴이 각각 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 분배적 반복을 한국어에서 자연스럽게 풀어, 각 생물마다 네 얼굴이 있음을 명확히 나타냈습니다.
- source_word: פָנִים
  english_pob_choice: faces
  chosen_korean: 얼굴
  alternatives_korean:
  - 면
  - 낯
  lexicon: HALOT
  rationale: 환상 문맥의 복수 명사로서, 표준적이고 직관적인 ‘얼굴’이 가장 직접적으로 대응합니다.
- source_word: יְדֵי אָדָם
  english_pob_choice: human hands
  chosen_korean: 사람의 손과 같은 모습
  alternatives_korean:
  - 사람의 손
  - 인간의 손
  lexicon: HALOT
  rationale: אָדָם을 특정 남성 ‘사람’이 아니라 인간 일반으로 읽되, 환상적 유사성을 보존하기 위해 ‘-과 같은 모습’을 더해 דְמוּת의 뉘앙스를 살렸습니다.
- source_word: תַּחַת כַּנְפֵיהֶם
  english_pob_choice: under their wings
  chosen_korean: 그 날개 아래에는
  alternatives_korean:
  - 날개 아래에는
  - 그들의 날개 아래에는
  lexicon: HALOT
  rationale: 전치사의 공간적 관계를 자연스러운 한국어 어순으로 옮겨, 시각적 장면을 매끄럽게 드러냈습니다.
theological_decisions:
- issue: אָדָם을 ‘사람’으로 옮김
  chosen_reading: 사람의 손
  alternative_readings:
  - 남자의 손
  - 인간의 손
  rationale: 이 구절은 성별을 말하려는 것이 아니라 형상적 유사성을 말하므로, 남성화된 표현을 피하고 인간 일반을 가리키는 ‘사람’을 선택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table (אָדָם), Translation philosophy §4'
