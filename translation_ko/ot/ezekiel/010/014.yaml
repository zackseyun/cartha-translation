id: EZK.10.14
reference: Ezekiel 10:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַרְבָּעָ֥ה פָנִ֖ים לְ/אֶחָ֑ד פְּנֵ֨י הָ/אֶחָ֜ד פְּנֵ֣י הַ/כְּר֗וּב וּ/פְנֵ֤י הַ/שֵּׁנִי֙ פְּנֵ֣י אָדָ֔ם וְ/הַ/שְּׁלִישִׁי֙ פְּנֵ֣י אַרְיֵ֔ה וְ/הָ/רְבִיעִ֖י פְּנֵי נָֽשֶׁר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/014.yaml
  text: 'And each one had four faces: the face of the first was the face of the cherub[a], and the face of the second was the face of a man, and the third the face of a lion[b], and the fourth the face of an eagle.'
  footnotes:
  - marker: a
    text: Ezekiel 1:10 describes the corresponding face as that of an ox; here the Hebrew text reads 'the cherub.'
    reason: cross_reference
  - marker: b
    text: Or 'vulture' for 'eagle'; the Hebrew term can refer more broadly to a large bird of prey.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 각 생물의 얼굴은 네 가지였습니다. 첫째 얼굴은 그룹의 얼굴이요, 둘째 얼굴은 사람의 얼굴이요, 셋째 얼굴은 사자의 얼굴이요, 넷째 얼굴은 독수리의 얼굴이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에스겔 1:10은 대응되는 얼굴을 소의 얼굴로 묘사합니다. 여기의 히브리어 본문은 ‘그룹’이라고 읽습니다.
    reason: cross_reference
  - marker: b
    text: ‘독수리’는 큰 맹금류를 가리키는 넓은 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבָּעָה פָנִים לְאֶחָד
  english_pob_choice: And each one had four faces
  chosen_korean: 그리고 각 생물의 얼굴은 네 가지였습니다
  alternatives_korean:
  - 그리고 각각 네 얼굴이 있었습니다
  - 그리고 각자 네 얼굴을 가지고 있었습니다
  lexicon: WLC; HALOT
  rationale: 히브리어는 서술어가 생략된 분사구문이므로 한국어에서는 자연스럽게 존재 진술로 풀어야 하며, לְאֶחָד의 분배적 의미를 ‘각 생물’로 살렸습니다.
- source_word: הַכְּרוּב
  english_pob_choice: the cherub
  chosen_korean: 그룹의 얼굴
  alternatives_korean:
  - 그룹의 얼굴
  - 그룹의 것
  lexicon: WLC; HALOT
  rationale: 본문은 ‘그룹’이라고 분명히 읽으므로, 전통적 관용인 ‘그룹’으로 옮기되 다음의 열거 구조를 살려 ‘얼굴’을 반복했습니다.
- source_word: פְּנֵי אָדָם
  english_pob_choice: the face of a man
  chosen_korean: 사람의 얼굴
  alternatives_korean:
  - 한 사람의 얼굴
  - 인간의 얼굴
  lexicon: WLC; HALOT
  rationale: אָדָם은 이 환상 목록에서 집합명사보다 개별 인간의 얼굴을 가리키므로, 자연스러운 표준어로 ‘사람의 얼굴’을 택했습니다.
- source_word: נָשֶׁר
  english_pob_choice: an eagle
  chosen_korean: 독수리의 얼굴
  alternatives_korean:
  - 매의 얼굴
  - 큰 새의 얼굴
  lexicon: WLC; HALOT
  rationale: POB의 본문 선택은 ‘eagle’이므로 기본 본문은 ‘독수리’로 두고, 더 넓은 맹금류 가능성은 본문이 아니라 주석에서 다루는 편이 적절합니다.
theological_decisions:
- issue: 에스겔 1:10의 ‘소 얼굴’과 여기의 ‘그룹’ 얼굴 사이의 긴장
  chosen_reading: 본문대로 ‘그룹의 얼굴’로 옮기고, 1장 10절과의 대응은 주석으로만 알립니다.
  alternative_readings:
  - ‘소의 얼굴’로 조화시키기
  - ‘그룹-소의 얼굴’처럼 설명적으로 옮기기
  rationale: 수용 본문이 여기서는 분명히 ‘그룹’을 읽으므로, 조화를 위해 본문을 바꾸지 않고 원문 표기를 보존해야 합니다.
  doctrine_reference: 원문 우선 원칙과 본문 긴장 보존
- issue: נָשֶׁר의 번역 범위
  chosen_reading: 본문에는 ‘독수리’로 두고, 용례상 더 넓은 맹금류 가능성은 각주로 처리합니다.
  alternative_readings:
  - ‘독수리/솔개’처럼 본문에 병기하기
  - ‘큰 새의 얼굴’로 완화하기
  rationale: 예언 환상에서 전통적 이미지와 한국어 가독성을 함께 살리되, 어휘적 범위의 긴장은 각주로 남겨 두는 것이 가장 투명합니다.
  doctrine_reference: 어휘적 불확정성 보존
