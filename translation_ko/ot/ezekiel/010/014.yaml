revisions:
- from: 그리고 각 생물의 얼굴은 네 가지였습니다. 첫째 얼굴은 그룹의 얼굴이요, 둘째 얼굴은 사람의 얼굴이요, 셋째 얼굴은 사자의 얼굴이요, 넷째 얼굴은 독수리의 얼굴이었습니다.[a][b]
