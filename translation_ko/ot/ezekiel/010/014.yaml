  rationale: 분배적 첫 구절을 원문에 더 가깝고 자연스러운 한국어로 다듬고, 현대 합쇼체에 맞게 열거 연결을 정리했습니다. ‘그룹’과 ‘독수리’의 본문 선택은 유지했으며, 두 각주를 관련 낱말에 정확히 연결하고 원문의 어휘적·본문적 긴장을 보존했습니다.
