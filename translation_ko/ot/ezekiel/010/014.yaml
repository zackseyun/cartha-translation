  naturalness: ‘얼굴은 네 가지였습니다’와 열거의 ‘이요’는 현대 표준어 합쇼체 문장으로 다소 부자연스럽거나 문어적입니다. ‘각각 네 얼굴이 있었습니다’ 및 ‘이었고/이었으며’의 연결이 더 자연스럽고 일관됩니다.
  terminology: ‘그룹’, ‘사람’, ‘사자’, ‘독수리’는 적절합니다. ‘그룹’과 ‘독수리’에 해당 각주 표지를 각각 바로 붙여, 각주의 지시 대상이 분명하도록 해야 합니다.
