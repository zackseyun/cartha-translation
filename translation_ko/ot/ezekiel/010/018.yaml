    issue: ‘나와 있었습니다’가 완료된 서사 동작을 진행·결과 상태로 바꿉니다.
    rationale: וַיֵּצֵא는 단순한 연속 서사 동작(‘나왔다/나와’)입니다. ‘-아/어 있었습니다’는 원문에 없는 지속 상태를 첨가하며, 이어지는 ‘섰습니다’와의 동작 연쇄도 약화합니다.
