lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나와 있었습니다
  alternatives_korean:
  - 나갔습니다
  - 떠났습니다
  - 나왔습니다
  lexicon: HALOT
  rationale: 출구 쪽으로 움직이는 구체적 동작을 살리되, 한국어에서는 문어체 서술에 자연스러운 진행·결과의 뉘앙스를 담아 ‘나와 있었습니다’로 옮겼습니다.
- source_word: כְּבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 영예
  - 주님의 영광
  - 야훼의 현현
  lexicon: HALOT
  rationale: כָּבוֹד는 이 문맥에서 야훼의 임재와 영광을 가리키므로, POB의 ‘Yahweh’를 따라 ‘야훼의 영광’으로 직역해 신학적 표지를 보존했습니다.
- source_word: מִפְתַּן הַבָּיִת
  english_pob_choice: threshold of the house
  chosen_korean: 집의 문지방
  alternatives_korean:
  - 성전의 문지방
  - 집의 문턱
  - 집의 문입구
  lexicon: HALOT
  rationale: 히브리어는 해석어 ‘성전’이 아니라 ‘집’을 쓰므로, 원문의 표현을 보존해 ‘집의 문지방’으로 옮겼습니다.
- source_word: הַכְּרוּבִים
  english_pob_choice: the cherubim
  chosen_korean: 그룹들
  alternatives_korean:
  - 그룹 위에
  - 천사들
  - 케루빔들
  lexicon: HALOT
  rationale: 에스겔의 환상에서 쓰이는 고유한 천상 존재를 가리키므로, 한국어 성경에서 통용되는 ‘그룹’ 계열을 유지하되 복수성을 드러내어 ‘그룹들’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 드러낼 것인가
  chosen_reading: ‘야훼’로 직접 옮겨 하나님의 고유한 이름을 보존했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 יְהוָה를 직접 사용하므로, POB의 방침에 따라 호칭 대체어보다 고유명인 ‘야훼’를 택하는 것이 स्रोत의 신학적 식별성을 더 분명하게 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: הַבָּיִת를 ‘성전’으로 풀어 쓸지 여부
  chosen_reading: 문맥이 성전을 가리키더라도 원문 어휘를 따라 ‘집’으로 유지했습니다.
  alternative_readings:
  - 성전
  rationale: 이 환상에서 referent는 성전이지만, 원문은 해석을 덧붙이지 않고 ‘집’을 사용하므로, 독자가 문맥으로 파악하도록 두는 편이 원문 충실도에 맞습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
