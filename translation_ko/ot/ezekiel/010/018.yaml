  verdict: revise
  source_fidelity: 히브리어의 두 와우 연속형 동사는 환상 서술의 완료된 연속 동작을 나타냅니다. 초안의 ‘나와 있었습니다’는 진행·상태를 더하여 첫 동작을 ‘이미 나와 있는 상태’처럼 만들므로, 단순 과거 ‘나와’로 고치는 것이 적절합니다. ‘집의 문지방 위에서’, ‘그룹들 위에’는 מֵעַל과 עַל의 공간 관계를 무리 없이 보존합니다.
  naturalness: ‘그때 야훼의 영광이 집의 문지방 위에서 나와 그룹들 위에 섰습니다’는 현대 표준어 합쇼체로 자연스럽고, 원문의 간결한 환상 서술을 유지합니다.
  terminology: יְהוָה는 POB 방침에 따라 ‘야훼’로, כָּבוֹד는 ‘영광’으로 유지했습니다. הַבַּיִת는 본문의 어휘를 따라 ‘집’으로 번역하고, 각주의 ‘성전’ 대안을 유지했습니다. כְּרוּבִים은 한국어 성경 용례에 맞는 ‘그룹들’로 유지할 수 있습니다.
  issues:
