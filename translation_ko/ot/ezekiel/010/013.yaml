  text: לָ/א֖וֹפַנִּ֑ים לָ/הֶ֛ם קוֹרָ֥א הַ/גַּלְגַּ֖ל בְּ/אָזְנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/013.yaml
  text: As for the wheels[a], they were called “the whirling wheel” in my hearing.
  footnotes:
  - marker: a
    text: Or “they were called ‘the wheel’ in my hearing.” The Hebrew גַּלְגַּל may mean “wheel,” but here “wheelwork” is used to preserve the distinction from אֹופַנִּים (“wheels”).
    reason: lexical_alternative
translation:
  language: ko
  text: 그 바퀴들에 관해서는, 그것들이 내 귀에 “회전하는 바퀴”라고 불렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그것들이 내 귀에 ‘바퀴’라고 불렸습니다.” 히브리어 גַּלְגַּל은 “바퀴”를 뜻할 수 있지만, 여기서는 אֹופַנִּים(“바퀴들”)과의 구별을 보존하기 위해 “회전하는 바퀴”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֹופַנִּים
  english_pob_choice: As for the wheels
  chosen_korean: 그 바퀴들에 관해서는
  alternatives_korean:
  - 바퀴들에 대하여는
  - 바퀴들에 관해서는
  lexicon: HALOT
  rationale: 앞의 ל는 단순한 방향표시보다 화제 표지를 이루므로, 한국어에서는 문맥상 ‘~에 관해서는’으로 주제를 드러내는 것이 자연스럽습니다.
- source_word: לָהֶם + קוֹרָא
  english_pob_choice: they were called
  chosen_korean: 그것들이 ...라고 불렸습니다
  alternatives_korean:
  - 그것들에게 ...라고 불렸습니다
  - 그것들을 ...라고 불렀습니다
  lexicon: HALOT
  rationale: 동사의 형태와 문맥상 누군가가 바퀴들의 명칭을 들려준 상황이므로, 수동적 의미의 ‘불렸습니다’가 가장 잘 맞습니다.
- source_word: הַגַּלְגַּל
  english_pob_choice: the whirling wheel / the wheelwork
  chosen_korean: 회전하는 바퀴
  alternatives_korean:
  - 바퀴장치
  - 바퀴작동부
  - 회전하는 바퀴
  lexicon: HALOT
  rationale: 기존 אֹופַנִּים(바퀴들)과 동일하게 ‘바퀴’로만 옮기면 구별이 사라지므로, גַּלְגַּל의 회전·구름의 이미지를 살려 ‘회전하는 바퀴’로 옮겼습니다.
- source_word: בְּאָזְנָי
  english_pob_choice: in my hearing
  chosen_korean: 내 귀에
  alternatives_korean:
  - 내가 듣는 데서
  - 내가 듣는 앞에서
  - 내 귀에
  lexicon: HALOT
  rationale: 히브리어 관용구는 선지자가 실제로 들은 구술을 가리키므로, 현대 한국어에서는 ‘내 귀에’가 간결하면서도 청각적 목격을 잘 전달합니다.
