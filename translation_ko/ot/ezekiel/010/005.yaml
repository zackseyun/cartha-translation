  rationale: 이 구절의 초점은 신적 호칭 자체보다 그룹 날개 소리의 위엄을 하나님의 권능에 견주는 데 있으므로, 의미 전달이 분명한 번역형을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
