  - 그룹들의 날갯짓
  lexicon: HALOT
  rationale: ‘날개’의 소유 관계를 그대로 살리되, 한국어에서는 자연스러운 압축으로 처리해 원문의 이미지를 유지했습니다.
- source_word: הֶחָצֵר הַחִיצֹנָה
  english_pob_choice: the outer court
  chosen_korean: 바깥뜰
  alternatives_korean:
  - 외뜰
  - 바깥 마당
  lexicon: HALOT
  rationale: 성전 문맥의 חָצֵר를 ‘뜰’로 옮겨 독자가 즉시 성전 공간을 떠올리게 했고, חִיצֹנָה는 ‘바깥’으로 분명히 드러냈습니다.
- source_word: אֵל שַׁדַּי
  english_pob_choice: God Almighty
  chosen_korean: 하나님 전능자
  alternatives_korean:
  - 전능하신 하나님
  - 전능자 하나님
  lexicon: HALOT
  rationale: POB의 제목 번역 원칙을 따라 ‘El Shaddai’를 음역하지 않고 의미를 살렸으며, 문맥상 비교 대상이 되는 신적 호칭을 유지했습니다.
- source_word: בְּדַבְּרוֹ
  english_pob_choice: when he speaks
  chosen_korean: 말하심
  alternatives_korean:
  - 말씀하실 때
  - 말하실 때
  lexicon: HALOT
  rationale: בְּדַבְּרוֹ는 ‘그가 말할 때/말함에’의 시간·상태를 나타내므로, 비교절의 간결함을 위해 명사화해 ‘말하심’으로 처리했습니다.
theological_decisions:
- issue: אֵל שַׁדַּי의 한국어 처리
  chosen_reading: ‘하나님 전능자’로 번역해 음역을 피했습니다.
  alternative_readings:
