translation:
  language: ko
  text: 그룹의 날개 소리는 바깥뜰에까지 들렸는데, 하나님 전능자의 말하심과 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘엘 샤다이의 말하실 때와 같은 소리.’ 여기서는 ה־אֵל שַׁדַּי를 ‘하나님 전능자’로 옮겼습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹל
  english_pob_choice: And the sound
  chosen_korean: 그룹의 날개 소리
  alternatives_korean:
  - 그룹들의 날갯소리
  - 그룹들의 소리
  lexicon: HALOT
  rationale: קוֹל은 여기서 가시적이거나 구체적인 ‘소리’를 가리키므로, 동사형보다 명사구로 자연스럽게 옮겼습니다.
- source_word: כַּנְפֵי הַכְּרוּבִים
  english_pob_choice: of the wings of the cherubim
  chosen_korean: 그룹의 날개
  alternatives_korean:
  - 그룹들의 날개
  - 그룹들의 날갯짓
  lexicon: HALOT
  rationale: ‘날개’의 소유 관계를 그대로 살리되, 한국어에서는 자연스러운 압축으로 처리해 원문의 이미지를 유지했습니다.
- source_word: הֶחָצֵר הַחִיצֹנָה
  english_pob_choice: the outer court
  chosen_korean: 바깥뜰
  alternatives_korean:
  - 외뜰
  - 바깥 마당
  lexicon: HALOT
  rationale: 성전 문맥의 חָצֵר를 ‘뜰’로 옮겨 독자가 즉시 성전 공간을 떠올리게 했고, חִיצֹנָה는 ‘바깥’으로 분명히 드러냈습니다.
- source_word: אֵל שַׁדַּי
  english_pob_choice: God Almighty
  chosen_korean: 하나님 전능자
  alternatives_korean:
  - 전능하신 하나님
  - 전능자 하나님
  lexicon: HALOT
  rationale: POB의 제목 번역 원칙을 따라 ‘El Shaddai’를 음역하지 않고 의미를 살렸으며, 문맥상 비교 대상이 되는 신적 호칭을 유지했습니다.
- source_word: בְּדַבְּרוֹ
  english_pob_choice: when he speaks
  chosen_korean: 말하심
  alternatives_korean:
  - 말씀하실 때
  - 말하실 때
  lexicon: HALOT
  rationale: בְּדַבְּרוֹ는 ‘그가 말할 때/말함에’의 시간·상태를 나타내므로, 비교절의 간결함을 위해 명사화해 ‘말하심’으로 처리했습니다.
theological_decisions:
- issue: אֵל שַׁדַּי의 한국어 처리
  chosen_reading: ‘하나님 전능자’로 번역해 음역을 피했습니다.
  alternative_readings:
  - 엘 샤다이
  - 전능하신 하나님
  rationale: 이 구절의 초점은 신적 호칭 자체보다 그룹 날개 소리의 위엄을 하나님의 권능에 견주는 데 있으므로, 의미 전달이 분명한 번역형을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
