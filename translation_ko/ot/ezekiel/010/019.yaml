id: EZK.10.19
reference: Ezekiel 10:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׂא֣וּ הַ/כְּרוּבִ֣ים אֶת כַּ֠נְפֵי/הֶם וַ/יֵּר֨וֹמּוּ מִן הָ/אָ֤רֶץ לְ/עֵינַ/י֙ בְּ/צֵאתָ֔/ם וְ/הָ/אֽוֹפַנִּ֖ים לְ/עֻמָּתָ֑/ם וַֽ/יַּעֲמֹ֗ד פֶּ֣תַח שַׁ֤עַר בֵּית יְהוָה֙ הַ/קַּדְמוֹנִ֔י וּ/כְב֧וֹד אֱלֹהֵֽי יִשְׂרָאֵ֛ל עֲלֵי/הֶ֖ם מִ/לְ/מָֽעְלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/019.yaml
  text: Then the cherubim lifted up their wings and rose from the earth before my eyes as they went out[a], with the wheels beside them; and it stood at the entrance of the eastern gate of the house of Yahweh[c][b], and the glory of the God of Israel was above them, from above.
  footnotes:
  - marker: a
    text: Or 'and the wheels were opposite them / alongside them.' The Hebrew expression denotes corresponding position.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'it stood' is singular; the subject may be the composite throne-chariot structure rather than the cherubim alone.
    reason: alternative_reading
  - marker: c
    text: '''the LORD'' renders the divine name YHWH.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그 그룹들이 자기 날개를 들어 땅에서 내 눈앞에 떠올라 나가는데, 바퀴들은 그들 곁에 있었습니다. 그리고 그것은 여호와의 집 동쪽 문 어귀에 서 있었고, 이스라엘의 하나님의 영광은 그들 위에, 위로부터 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 대응하는 위치, 곧 ‘나란히’의 뉘앙스를 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 단수형이며, 앞선 그룹과 바퀴를 아우르는 복합 수레-보좌를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘여호와’는 신적 이름 יְהוָה를 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּרוּבִים
  english_pob_choice: the cherubim
  chosen_korean: 그 그룹들
  alternatives_korean:
  - 그룹들
  - 그룹 천사들
  lexicon: HALOT
  rationale: כרובים은 환상 문맥의 특수한 천상 존재를 가리키므로, 한국어에서는 전통적 음역보다 의미를 드러내는 ‘그룹들’로 옮기되 복수성을 살렸습니다.
- source_word: וַיִּשְׂאוּ ... אֶת כַּנְפֵיהֶם
  english_pob_choice: lifted up their wings
  chosen_korean: 자기 날개를 들어
  alternatives_korean:
  - 자기 날개를 들고
  - 날개를 들어 올리고
  lexicon: HALOT
  rationale: נשא는 여기서 물건을 ‘들어 올리다’는 동작이 자연스러워, 날개의 상승 동작을 간결하고 시각적으로 옮겼습니다.
- source_word: לְעֵינַי ... בְּצֵאתָם
  english_pob_choice: before my eyes ... as they went out
  chosen_korean: 내 눈앞에 떠올라 나가는데
  alternatives_korean:
  - 내 눈앞에서 나가는데
  - 내 눈앞에서 떠오르며 나가는데
  lexicon: HALOT
  rationale: 시각적 환상 묘사를 살리기 위해 ‘떠오르다’와 ‘나가다’를 함께 반영하여, 출현과 이동이 동시에 보이는 장면을 표현했습니다.
- source_word: וְהָאוֹפַנִּים לְעֻמָּתָם
  english_pob_choice: with the wheels beside them
  chosen_korean: 바퀴들은 그들 곁에 있었습니다
  alternatives_korean:
  - 바퀴들은 그들 옆에 있었습니다
  - 바퀴들은 그들과 나란히 있었습니다
  lexicon: HALOT
  rationale: לְעֻמָּתָם은 단순한 동반이 아니라 대응하는 위치 관계를 나타내므로, ‘곁에’로 자연스럽게 옮기면서 함께 움직이는 장면을 유지했습니다.
- source_word: פֶּתַח שַׁעַר
  english_pob_choice: the entrance of the eastern gate
  chosen_korean: 동쪽 문 어귀
  alternatives_korean:
  - 동쪽 문 입구
  - 동쪽 성문 어귀
  lexicon: HALOT
  rationale: פֶּתַח은 ‘문/게이트의 입구, 어귀’라는 뜻이므로, 문학적이면서도 직접적인 ‘어귀’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: project_default
  rationale: 이 구절의 기존 영어 POB가 본문에서 Yahweh를 사용하므로, 한국어 본문은 이에 대응하는 교회 공용 표기 ‘여호와’를 유지했습니다.
- source_word: וּכְבוֹד אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the glory of the God of Israel
  chosen_korean: 이스라엘의 하나님의 영광
  alternatives_korean:
  - 이스라엘의 하나님 영광
  - 이스라엘의 하나님이신 영광
  lexicon: HALOT
  rationale: כָּבוֹד는 하나님의 현현적 영광을 가리키므로, 소유구조를 살려 ‘하나님의 영광’으로 옮겼습니다.
theological_decisions:
- issue: וַיַּעֲמֹד의 주어 처리
  chosen_reading: ‘그것은 서 있었습니다’로 단수형을 유지했습니다.
  alternative_readings:
  - 그들이 서 있었습니다
  - 그는 서 있었습니다
  rationale: 히브리어 동사는 단수형이므로, 복수 주어에 맞추어 평준화하지 않고 앞선 환상 전체를 가리키는 집합적 단수로 보존했습니다.
  doctrine_reference: 문맥상 환상 수레-보좌 전체를 단수로 지시하는 문법적 선택
