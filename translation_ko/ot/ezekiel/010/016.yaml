source:
  edition: WLC
  text: וּ/בְ/לֶ֨כֶת֙ הַ/כְּרוּבִ֔ים יֵלְכ֥וּ הָ/אוֹפַנִּ֖ים אֶצְלָ֑/ם וּ/בִ/שְׂאֵ֨ת הַ/כְּרוּבִ֜ים אֶת כַּנְפֵי/הֶ֗ם לָ/רוּם֙ מֵ/עַ֣ל הָ/אָ֔רֶץ לֹא יִסַּ֧בּוּ הָ/אוֹפַנִּ֛ים גַּם הֵ֖ם מֵ/אֶצְלָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/016.yaml
  text: When the cherubim moved[a], the wheels moved beside them; and when the cherubim lifted up their wings to rise from the earth, the wheels also did not turn away from beside them.
  footnotes:
  - marker: a
    text: Or 'did not turn from beside them.' The Hebrew emphasizes that the wheels did not depart from the cherubim's side as they rose.
    reason: lexical_alternative
translation:
  language: ko
  text: 그룹들이 움직일 때에는 바퀴들도 그들 곁에서 함께 움직였습니다. 그룹들이 땅에서 떠오르도록 자기 날개를 들어 올릴 때에도 바퀴들은 그들 곁에서 물러나지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “물러나지 않았습니다”는 ‘그들 곁에서 돌아서지/떨어져 나가지 않았다’는 뜻을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלֶכֶת / יֵלְכ֥וּ
  english_pob_choice: When the cherubim moved ... the wheels moved
  chosen_korean: “그룹들이 움직일 때에는 … 바퀴들도 … 함께 움직였습니다”
  alternatives_korean:
  - 그룹들이 갈 때에는 … 바퀴들도 갔습니다
  - 그룹들이 나아갈 때에는 … 바퀴들도 나아갔습니다
  lexicon: HALOT
  rationale: הלך의 반복을 한국어에서 “움직이다”로 자연스럽게 살려, 환상 속의 동시적 이동을 분명히 했습니다.
- source_word: הַכְּרוּבִים
  english_pob_choice: the cherubim
  chosen_korean: 그룹들
  alternatives_korean:
  - 케루빔들
  - 그룹
  lexicon: HALOT
  rationale: 한국어 성경 전통에서 겔 10장의 כרובים는 대체로 “그룹”으로 옮겨져 왔고, 환상 문맥에서 복수형도 자연스럽습니다.
- source_word: הָאוֹפַנִּים
  english_pob_choice: the wheels
  chosen_korean: 바퀴들
  alternatives_korean:
  - 휠들
  - 수레바퀴들
  lexicon: HALOT
  rationale: אופן의 기본 뜻을 सीधे 반영하여 환상 장면의 반복적 이미지인 “바퀴들”로 옮겼습니다.
- source_word: אֶצְלָם / מֵאֶצְלָם
  english_pob_choice: beside them / from beside them
  chosen_korean: 그들 곁에서 / 그들 곁에서 물러나지 않았습니다
  alternatives_korean:
  - 그들 옆에서 / 그들 옆에서 떠나지 않았습니다
  - 그들 가까이서 / 그들 가까이서 떨어지지 않았습니다
  lexicon: HALOT
  rationale: אצל의 근접 의미를 살려 바퀴와 그룹의 밀착된 동행을 드러냈습니다. “물러나지 않았다”는 not turn away의 공간적 의미를 자연스럽게 담습니다.
theological_decisions:
- issue: 환상 묘사의 반복과 동시성
  chosen_reading: 바퀴들이 그룹들과 분리되지 않고 같은 움직임을 유지한다는 점을 강조했습니다.
  alternative_readings:
  - 단순히 같은 방향으로 갔다고 완화해 옮길 수 있음
  - 바퀴가 그룹을 따라갔다고만 표현할 수 있음
  rationale: 본문은 단순한 동행보다 ‘곁에서 벗어나지 않음’을 반복해 강조하므로, 분리되지 않는 일치성을 살리는 번역이 더 source-direct합니다.
  doctrine_reference: Ezekiel 10:16의 환상 문맥
