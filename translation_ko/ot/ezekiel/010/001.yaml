  text: Then I looked[a], and behold, on the expanse that was above the heads of the cherubim there appeared over them something like a sapphire stone, in appearance like the likeness of a throne.
  footnotes:
  - marker: a
    text: Or, more specifically, 'like a lapis lazuli stone'; the Hebrew term traditionally rendered 'sapphire' may denote a deep blue precious stone identified differently in modern mineral terms.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 보니, 그룹들의 머리 위에 있는 궁창에 청옥 같은 것이 보좌의 형상을 닮은 모습으로 그들 위에 나타났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘청옥’은 여기서 현대 광물명으로 정확히 특정하기보다, 히브리어가 가리키는 깊은 푸른빛의 귀석 이미지를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  english_pob_choice: Then I looked
  chosen_korean: 내가 보니
  alternatives_korean:
  - 내가 보았습니다
  - 내가 보게 되었습니다
  lexicon: HALOT
  rationale: 예언 환상 서술의 시점을 자연스럽게 열어 주는 1인칭 관찰 표현으로 옮겼습니다.
- source_word: הָרָקִיעַ
  english_pob_choice: the expanse
  chosen_korean: 궁창
  alternatives_korean:
