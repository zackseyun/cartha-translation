source:
  edition: WLC
  text: וָ/אֶרְאֶ֗ה וְ/הִנֵּ֤ה אֶל הָ/רָקִ֨יעַ֙ אֲשֶׁר֙ עַל רֹ֣אשׁ הַ/כְּרֻבִ֔ים כְּ/אֶ֣בֶן סַפִּ֔יר כְּ/מַרְאֵ֖ה דְּמ֣וּת כִּסֵּ֑א נִרְאָ֖ה עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/001.yaml
  text: Then I looked[a], and behold, on the expanse that was above the heads of the cherubim there appeared over them something like a sapphire stone, in appearance like the likeness of a throne.
  footnotes:
  - marker: a
    text: Or, more specifically, 'like a lapis lazuli stone'; the Hebrew term traditionally rendered 'sapphire' may denote a deep blue precious stone identified differently in modern mineral terms.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 보니, 보좌 위의 날개들 머리 위에 있는 궁창에, 청옥 같은 돌, 곧 보좌의 모양 같은 것이 나타났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘청옥’은 여기서 현대 광물명으로 정확히 특정하기보다, 히브리어가 가리키는 깊은 푸른빛의 귀석 이미지를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  english_pob_choice: Then I looked
  chosen_korean: 내가 보니
  alternatives_korean:
  - 내가 보았습니다
  - 내가 보게 되었습니다
  lexicon: HALOT
  rationale: 예언 환상 서술의 시점을 자연스럽게 열어 주는 1인칭 관찰 표현으로 옮겼습니다.
- source_word: הָרָקִיעַ
  english_pob_choice: the expanse
  chosen_korean: 궁창
  alternatives_korean:
  - 확장된 하늘
  - 하늘 궁창
  lexicon: HALOT
  rationale: 에스겔의 환상 문맥에서 상부의 넓은 천상 구조를 가리키므로, 성경적 용례가 있는 ‘궁창’을 유지했습니다.
- source_word: כְּאֶבֶן סַפִּיר
  english_pob_choice: something like a sapphire stone
  chosen_korean: 청옥 같은 돌
  alternatives_korean:
  - 사파이어 같은 돌
  - 라피스 라줄리 같은 돌
  lexicon: HALOT
  rationale: 히브리어는 현대 광물학적 동정이 아니라 푸른 계열의 귀석에 대한 비유이므로, 전통적 대응인 ‘청옥’을 택해 시각적 인상을 살렸습니다.
- source_word: כְּמַרְאֵה דְּמוּת כִּסֵּא
  english_pob_choice: in appearance like the likeness of a throne
  chosen_korean: 보좌의 모양 같은
  alternatives_korean:
  - 보좌의 형상 같은
  - 보좌의 모습을 닮은
  lexicon: HALOT
  rationale: 겹겹의 비교어가 직접 동일시가 아닌 환상적 유사성을 강조하므로, ‘모양 같은’으로 조심스럽게 유지했습니다.
theological_decisions:
- issue: 환상 대상의 직접 동일시를 피하는 표현
  chosen_reading: ‘청옥 같은 돌, 곧 보좌의 모양 같은 것이 나타났습니다’로 번역해, 보좌를 단정하기보다 비유적·시각적 유사성을 유지했습니다.
  alternative_readings:
  - ‘청옥 같은 보좌가 보였습니다’
  - ‘보좌가 나타났습니다’
  rationale: 본문은 ‘같이/모양/형상’의 연쇄로 본 것의 간접성을 강조하므로, 이를 평탄화하지 않고 신학적 긴장을 보존해야 합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
