  lexicon: HALOT
  rationale: 에스겔의 환상 문맥에서 상부의 넓은 천상 구조를 가리키므로, 성경적 용례가 있는 ‘궁창’을 유지했습니다.
- source_word: כְּאֶבֶן סַפִּיר
  english_pob_choice: something like a sapphire stone
  chosen_korean: 청옥 같은 돌
  alternatives_korean:
  - 사파이어 같은 돌
  - 라피스 라줄리 같은 돌
  lexicon: HALOT
  rationale: 히브리어는 현대 광물학적 동정이 아니라 푸른 계열의 귀석에 대한 비유이므로, 전통적 대응인 ‘청옥’을 택해 시각적 인상을 살렸습니다.
- source_word: כְּמַרְאֵה דְּמוּת כִּסֵּא
  english_pob_choice: in appearance like the likeness of a throne
  chosen_korean: 보좌의 모양 같은
  alternatives_korean:
  - 보좌의 형상 같은
  - 보좌의 모습을 닮은
  lexicon: HALOT
  rationale: 겹겹의 비교어가 직접 동일시가 아닌 환상적 유사성을 강조하므로, ‘모양 같은’으로 조심스럽게 유지했습니다.
theological_decisions:
- issue: 환상 대상의 직접 동일시를 피하는 표현
  chosen_reading: ‘청옥 같은 돌, 곧 보좌의 모양 같은 것이 나타났습니다’로 번역해, 보좌를 단정하기보다 비유적·시각적 유사성을 유지했습니다.
  alternative_readings:
  - ‘청옥 같은 보좌가 보였습니다’
  - ‘보좌가 나타났습니다’
  rationale: 본문은 ‘같이/모양/형상’의 연쇄로 본 것의 간접성을 강조하므로, 이를 평탄화하지 않고 신학적 긴장을 보존해야 합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
