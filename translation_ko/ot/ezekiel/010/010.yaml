id: EZK.10.10
reference: Ezekiel 10:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַ֨רְאֵי/הֶ֔ם דְּמ֥וּת אֶחָ֖ד לְ/אַרְבַּעְתָּ֑/ם כַּ/אֲשֶׁ֛ר יִהְיֶ֥ה הָ/אוֹפַ֖ן בְּ/ת֥וֹךְ הָ/אוֹפָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/010.yaml
  text: As for their appearance[a], the four of them had one likeness[b], as when a wheel is within a wheel.
  footnotes:
  - marker: a
    text: Or 'the same likeness'; the Hebrew emphasizes that all four shared an identical form.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'as when the wheel is within the wheel.' English uses 'a wheel ... a wheel' idiomatically in this simile.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 모습은 네 생물의 모습이 하나의 모양이었으니, 마치 바퀴가 바퀴 안에 있는 것 같았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַרְאֵיהֶם
  english_pob_choice: As for their appearance
  chosen_korean: 그들의 모습은
  alternatives_korean:
  - 그들의 appearance는
  - 그들의 외형은
  lexicon: HALOT
  rationale: מַרְאֶה는 보이는 모습이나 외형을 뜻하므로, 문맥상 자연스러운 ‘모습’으로 옮겼습니다. 앞의 וּ는 단순 접속보다 화제 제시 기능이 강해 한국어에서는 주제화로 처리했습니다.
- source_word: דְּמוּת אֶחָד לְאַרְבַּעְתָּם
  english_pob_choice: one likeness ... the four of them
  chosen_korean: 네 생물의 모습이 하나의 모양이었으니
  alternatives_korean:
  - 네 생물에게는 하나의 형상이었으니
  - 네 생물은 동일한 모양이었으니
  lexicon: HALOT
  rationale: דְּמוּת는 ‘모양, 형상, 닮음’의 뜻이 있어 ‘모습/모양’으로 옮겼고, אֶחָד는 네 존재가 같은 형상을 공유함을 나타내므로 ‘하나의 모양’으로 uniformity를 살렸습니다.
- source_word: כַּאֲשֶׁר יִהְיֶה הָאוֹפַן בְּתוֹךְ הָאוֹפָן
  english_pob_choice: as when a wheel is within a wheel
  chosen_korean: 마치 바퀴가 바퀴 안에 있는 것 같았습니다
  alternatives_korean:
  - 마치 바퀴 속에 바퀴가 있는 것 같았습니다
  - 바퀴가 바퀴 안에 있는 것처럼 보였습니다
  lexicon: HALOT
  rationale: 비유절의 כַּאֲשֶׁר יִהְיֶה는 자연스러운 한국어 비교구문으로 처리했고, בְּתוֹךְ는 ‘안에’로 간결하게 옮겨 환상적 이미지가 흐려지지 않게 했습니다.
