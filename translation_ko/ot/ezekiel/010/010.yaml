  terminology: מַרְאֶה와 דְּמוּת는 각각 ‘모습’과 ‘모양’으로 구별해 옮길 수 있습니다. ‘바퀴 안에 바퀴’는 בְּתוֹךְ הָאוֹפָן의 공간적 이미지를 충실히 전달합니다.
