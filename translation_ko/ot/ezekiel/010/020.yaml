source:
  edition: WLC
  text: הִ֣יא הַ/חַיָּ֗ה אֲשֶׁ֥ר רָאִ֛יתִי תַּ֥חַת אֱלֹהֵֽי יִשְׂרָאֵ֖ל בִּֽ/נְהַר כְּבָ֑ר וָ/אֵדַ֕ע כִּ֥י כְרוּבִ֖ים הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/020.yaml
  text: This was the living creature that I saw beneath the God of Israel by the Kebar Canal[a], and I knew that they were cherubim.
  footnotes:
  - marker: a
    text: Or 'at the river Kebar'; the Hebrew term can refer to a river or a canal. 'Chebar' is the traditional English form of the name.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 내가 이스라엘의 하나님 아래, 그발 운하에서 본 그 살아 있는 존재였습니다[a]. 나는 그들이 그룹임을 알게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그발 강에서’로 옮길 수 있습니다. 히브리어 נְהַר는 강이나 운하를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִיא הַחַיָּה
  english_pob_choice: This was the living creature
  chosen_korean: 이것은 ... 그 살아 있는 존재였습니다
  alternatives_korean:
  - 그것은 ... 그 살아 있는 존재였습니다
  - 이것은 ... 그 생물였습니다
  - 이것은 ... 그 생명체였습니다
  lexicon: HALOT
  rationale: 비전 맥락의 화자 회상문이므로 지시어는 자연스럽게 ‘이것은’으로 옮기고, חַיָּה는 단순한 동물이 아니라 환상적 존재를 가리키므로 ‘살아 있는 존재’로 번역했습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘 하나님
  - 이스라엘의 신
  lexicon: HALOT
  rationale: 언약적 호칭을 살리기 위해 관형 관계를 자연스럽게 유지한 ‘이스라엘의 하나님’으로 옮겼습니다.
- source_word: בִּנְהַר כְּבָר
  english_pob_choice: by the Kebar Canal
  chosen_korean: 그발 운하에서
  alternatives_korean:
  - 그발 강가에서
  - 그발 강에서
  - 그발 운하 곁에서
  lexicon: HALOT
  rationale: נְהַר는 문맥상 강/운하를 모두 가리킬 수 있으나 바벨론 지역의 지리적 정황을 반영해 ‘운하’로 두었고, 전통 음역보다 표준 음역 ‘그발’을 따랐습니다.
- source_word: כְרוּבִים
  english_pob_choice: cherubim
  chosen_korean: 그룹
  alternatives_korean:
  - 케루빔
  - 그룹들
  - 천사들
  lexicon: HALOT
  rationale: 한국 교회 전통에서 정착된 ‘그룹’을 사용해 환상적 존재의 고유명칭을 보존하고, 일반적인 ‘천사들’로 평준화하지 않았습니다.
theological_decisions:
- issue: 환상 속 존재의 정체를 드러내는 문장 구조
  chosen_reading: ‘나는 그들이 그룹임을 알게 되었습니다’로, 예언자가 이전에 본 존재를 뒤늦게 식별한 서술을 그대로 살렸습니다.
  alternative_readings:
  - ‘그것이 그룹이라는 것을 알았습니다’
  - ‘그들이 그룹인 줄 알았습니다’
  rationale: 본문의 ידע + כִּי는 단순 추측이 아니라 인식의 도달을 말하므로, 예언자의 깨달음을 분명히 드러내는 서술이 필요합니다.
  doctrine_reference: Ezekiel 10의 환상 서술과 천상 존재 인식
