id: EZK.10.6
reference: Ezekiel 10:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/צַוֺּת/וֹ֙ אֶת הָ/אִ֤ישׁ לְבֻֽשׁ הַ/בַּדִּים֙ לֵ/אמֹ֔ר קַ֥ח אֵשׁ֙ מִ/בֵּינ֣וֹת לַ/גַּלְגַּ֔ל מִ/בֵּינ֖וֹת לַ/כְּרוּבִ֑ים וַ/יָּבֹא֙ וַֽ/יַּעֲמֹ֔ד אֵ֖צֶל הָ/אוֹפָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/006.yaml
  text: And it happened[a], when he commanded the man clothed in linen, saying, “Take fire from between the wheelwork, from between the cherubim,” that he went in and stood beside the wheel.
  footnotes:
  - marker: a
    text: Or “from among the wheelwork”; the Hebrew גַּלְגַּל can refer to a wheel or a whirling wheel structure in this vision.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그 가는 옷을 입은 그 사람에게 명령할 때에 이런 일이 일어났습니다. “그룹들 사이, 곧 바퀴 사이에서 불을 가져가십시오.” 그가 들어가서 바퀴 곁에 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바퀴틀 사이에서’로도 옮길 수 있습니다. 히브리어 גַּלְגַּל은 이 환상에서 바퀴나 회전하는 구조를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 이런 일이 일어났습니다
  alternatives_korean:
  - 일어났습니다
  - 그 일이 있었습니다
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 서술 진행 기능을 살리면서, 현대 한국어에서 자연스럽고 문체가 과도하게 고어화되지 않도록 했습니다.
- source_word: לְבֻשׁ הַבַּדִּים
  english_pob_choice: the man clothed in linen
  chosen_korean: 가는 옷을 입은 그 사람
  alternatives_korean:
  - 세마포 옷을 입은 사람
  - 리넨 옷을 입은 사람
  lexicon: HALOT
  rationale: POB의 ‘linen’을 한국어 성경에서 자연스럽게 풀어 ‘가는 옷’으로 옮겼고, 이 비전에서 이미 알려진 인물을 가리키므로 ‘그 사람’으로 처리했습니다.
- source_word: מִבֵּינוֹת לַגַּלְגַּל
  english_pob_choice: from between the wheelwork
  chosen_korean: 그룹들 사이, 곧 바퀴 사이에서
  alternatives_korean:
  - 바퀴틀 사이에서
  - 회전하는 바퀴 사이에서
  lexicon: HALOT
  rationale: גַּלְגַּל의 구조적 의미를 살려 단순한 단수 ‘바퀴’보다 주변 문맥의 복수적 배열을 반영했습니다. POB의 ‘wheelwork’ 취지를 한국어로 과도하게 해설하지 않으면서 전달했습니다.
- source_word: וַיָּבֹא וַיַּעֲמֹד אֵצֶל הָאוֹפָן
  english_pob_choice: he went in and stood beside the wheel
  chosen_korean: 그가 들어가서 바퀴 곁에 섰습니다
  alternatives_korean:
  - 그가 가서 바퀴 곁에 섰습니다
  - 그가 들어가 바퀴 옆에 섰습니다
  lexicon: HALOT
  rationale: וַיָּבֹא를 단순히 ‘왔다’로 하지 않고, 비전 장면 안으로 들어가는 방향성을 살려 ‘들어가서’로 옮겼습니다. אֵצֶל은 자연스러운 ‘곁에’로 처리했습니다.
theological_decisions:
- issue: 명령의 주체를 특정하지 않음
  chosen_reading: ‘그가 명령할 때에’로 두어 주체를 명시적으로 ‘주님’이나 ‘여호와’로 바꾸지 않았습니다.
  alternative_readings:
  - 주님이 명령할 때에
  - 야훼께서 명령할 때에
  rationale: 히브리어는 여기서 대명사 접미사만 사용하므로, 본문이 직접 밝히지 않은 주체를 번역이 앞서 특정하지 않도록 했습니다.
  doctrine_reference: 서술 흐름과 신학적 긴장을 보존
