  yaml_path: translation/ot/ezekiel/010/008.yaml
  text: And the cherubim appeared to have the form of a human hand under their wings[a].
  footnotes:
  - marker: a
    text: Or, 'a human hand.' The Hebrew reads literally 'the form of a hand of a man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그룹들이 날개 아래에 사람의 손의 형상이 있는 것이 보였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람의 손의 형상’. 히브리어는 문자적으로 ‘한 사람의 손의 형상’이라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  english_pob_choice: appeared to have
  chosen_korean: 있는 것이 보였습니다
  alternatives_korean:
  - 보였습니다
  - 있는 듯했습니다
  lexicon: HALOT
  rationale: 니팔형의 ‘보이다/드러나 보이다’라는 관찰 의미를 살려, 환상에서 눈에 띈 상태를 자연스럽게 표현했습니다.
- source_word: לַכְּרֻבִים
  english_pob_choice: the cherubim
  chosen_korean: 그룹들이
  alternatives_korean:
  - 그룹들에게
  - 그룹들
  lexicon: HALOT
  rationale: 문맥상 ‘그룹들’이 주어가 되어 무엇이 보였는지를 말하므로, 한국어에서는 자연스럽게 주어형으로 옮겼습니다.
- source_word: תַּבְנִית יַד אָדָם
  english_pob_choice: the form of a human hand / a man's hand
  chosen_korean: 사람의 손의 형상
  alternatives_korean:
  - 사람 손의 형상
  - 한 사람의 손의 형상
  lexicon: HALOT
  rationale: תַּבְנִית의 ‘형상/모양’을 살리고, יַד אָדָם의 문면을 직접 반영하되 한국어에서는 ‘사람의 손의 형상’이 가장 직역적이면서도 읽히는 표현이어서 선택했습니다.
- source_word: תַּחַת כַּנְפֵיהֶם
  english_pob_choice: under their wings
  chosen_korean: 날개 아래에
  alternatives_korean:
  - 그들의 날개 아래에
  - 날개 밑에
  lexicon: HALOT
  rationale: 위치 관계를 단순하고 분명하게 전달하는 공간 표현으로 옮겼습니다.
theological_decisions:
- issue: אָדָם을 ‘사람’으로 옮길지, ‘인간’으로 일반화할지
  chosen_reading: 사람의 손
  alternative_readings:
  - 인간의 손
  - 한 사람의 손
  rationale: 본문은 환상 속에서 보이는 구체적 형상을 묘사하므로, 추상적인 ‘인간’보다 문자적이고 시각적인 ‘사람’이 מקור의 형상을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §4; Contested terms table for אָדָם'
