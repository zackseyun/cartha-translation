  text: And he said to the man clothed in linen[a], “Go in among the wheelwork, under the cherub, and fill your hands with coals of fire from among the cherubim, and scatter them over the city.” And he went in before my eyes.
  footnotes:
  - marker: a
    text: Or “between the wheels.” The Hebrew term may refer to the wheeled structure collectively rather than a single wheel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 아마포 옷을 입은 사람에게 말했습니다. 「그룹 사이, 바퀴들 가운데로 들어가서, 그룹들 사이에서 불타는 숯을 너의 두 손에 가득 담아, 그 도시 위에 뿌리십시오.」 그는 제 눈앞에서 들어갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바퀴들 가운데로’는 히브리어가 바퀴 하나보다 바퀴 구조 전체를 가리킬 수 있음을 반영한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבֻשׁ הַבַּדִּים
  english_pob_choice: clothed in linen
  chosen_korean: 아마포 옷을 입은
  alternatives_korean:
  - 아마포를 입은
  - 베로 된 옷을 입은
  lexicon: HALOT
  rationale: 아마포 자체가 옷감의 종류를 가리키므로, 인물을 의복으로 식별하는 영어 POB의 형식을 살리면서 자연스러운 현대 한국어로 옮겼습니다.
- source_word: בֵּינוֹת לַגַּלְגַּל
  english_pob_choice: among the wheelwork
  chosen_korean: 그룹 사이, 바퀴들 가운데로
  alternatives_korean:
  - 바퀴들 사이로
  - 바퀴장치 가운데로
  lexicon: HALOT
  rationale: 여기서는 단일 바퀴보다 전체적인 바퀴 구조를 가리킬 가능성이 크므로, POB의 wheelwork 취지를 반영하되 한국어에서는 ‘바퀴들’로 풀어 주었습니다.
- source_word: מִבֵּינוֹת לַכְּרֻבִים
  english_pob_choice: from among the cherubim
  chosen_korean: 그룹들 사이에서
  alternatives_korean:
  - 그룹들 가운데에서
  - 그룹들 사이로
  lexicon: HALOT
  rationale: 출처가 그룹들 사이의 공간임을 살리되, 한국어에서 원활하게 읽히도록 ‘사이에서’로 옮겼습니다.
- source_word: גַחֲלֵי אֵשׁ
  english_pob_choice: coals of fire
  chosen_korean: 불타는 숯
  alternatives_korean:
  - 불의 숯
  - 불씨
  lexicon: HALOT
  rationale: 직역형인 ‘불타는 숯’이 심판의 생생한 이미지를 보존하며, ‘숯불’보다 원문의 물질감을 더 잘 드러냅니다.
theological_decisions:
