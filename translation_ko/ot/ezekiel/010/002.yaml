  to: 그가 아마포 옷을 입은 사람에게 말씀하셨습니다. “바퀴 장치 가운데로[a], 그 그룹 아래로 들어가십시오. 그룹들 사이에서 불타는 숯을 두 손에 가득 담아 그 도시 위에 뿌리십시오.” 그가 제가 보는 앞에서 들어갔습니다.
