  chosen_reading: 주석적 해설을 본문에 넣지 않고, 도시 위에 숯을 뿌리라는 명령 자체를 그대로 드러냈습니다.
  alternative_readings:
  - 정결/정화 상징을 본문에 암시하는 번역
  rationale: 문맥상 예루살렘에 대한 심판 행위이지만, 절 자체는 상징을 설명하지 않으므로 본문의 긴장을 유지하는 쪽이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
