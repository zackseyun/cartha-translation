source:
  edition: WLC
  text: וַ/יָּ֤רָם כְּבוֹד יְהוָה֙ מֵ/עַ֣ל הַ/כְּר֔וּב עַ֖ל מִפְתַּ֣ן הַ/בָּ֑יִת וַ/יִּמָּלֵ֤א הַ/בַּ֨יִת֙ אֶת הֶ֣/עָנָ֔ן וְ/הֶֽ/חָצֵר֙ מָֽלְאָ֔ה אֶת נֹ֖גַהּ כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/004.yaml
  text: And the glory of Yahweh rose up from above the cherub to the threshold of the house[a], and the house was filled with the cloud[b], and the court was filled with the brightness of the glory of Yahweh.
  footnotes:
  - marker: a
    text: Or 'from over the cherub.' The Hebrew uses the singular 'cherub' here.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the threshold of the temple.' Hebrew 'house' in this context refers to the sanctuary/temple building.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 영광이 그룹[a] 위에서 집의 문지방[b]으로 올라갔습니다. 그 집은 그 구름으로 가득 찼고, 뜰은 야훼의 영광의 광채로 가득 찼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그룹 위로부터’. 히브리어는 여기서 단수형 ‘그룹’을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성전의 문지방으로’. 이 문맥의 히브리어 ‘집’은 성전 건물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה / כְּבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 여호와의 영광
  - 주님의 영광
  lexicon: HALOT
  rationale: POB가 יְהוָה를 Yahweh로 처리하므로, 한국어도 예배적 일반화보다 음역형 ‘야훼’를 유지해 원문 고유명과의 대응을 분명히 했습니다.
- source_word: מֵעַל הַכְּרוּב
  english_pob_choice: from above the cherub
  chosen_korean: 그룹 위에서
  alternatives_korean:
  - 그룹 위로부터
  - 그룹 위에서부터
  lexicon: HALOT
  rationale: מֵעַל의 공간적 출발점을 살리되, 이동 동사와 자연스럽게 맞도록 ‘~위에서’로 옮겼습니다. 히브리어 단수형을 반영해 ‘그룹’으로 두었습니다.
- source_word: הַבַּיִת / מִפְתַּן הַבָּיִת
  english_pob_choice: the house / the threshold of the house
  chosen_korean: 집의 문지방
  alternatives_korean:
  - 성전의 문지방
  - 집의 문턱
  lexicon: HALOT
  rationale: Ezekiel의 성전 환상 맥락을 유지하면서도 הַבַּיִת의 직역을 살려 ‘집’으로 두었고, מִפְתָּן은 현대 한국어에서 가장 직접적인 ‘문지방’으로 옮겼습니다.
- source_word: הֶעָנָן
  english_pob_choice: the cloud
  chosen_korean: 구름
  alternatives_korean:
  - 그 구름
  - 운무
  lexicon: HALOT
  rationale: 정관사가 있으나 한국어에서는 반복적 성경 문맥에서 수식어 없이도 특정한 신현적 구름으로 읽히므로 간결하게 ‘구름’으로 처리했습니다.
- source_word: נֹגַהּ
  english_pob_choice: brightness
  chosen_korean: 광채
  alternatives_korean:
  - 밝음
  - 빛남
  - 영광
  lexicon: HALOT
  rationale: נֹגַהּ는 단순한 밝기보다 빛나는 현현의 뉘앙스가 있어, ‘광채’가 ‘영광’과 구별되면서도 시각적 밝음을 잘 드러냅니다.
theological_decisions:
