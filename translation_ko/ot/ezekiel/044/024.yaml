source:
  edition: WLC
  text: וְ/עַל רִ֗יב הֵ֚מָּה יַעַמְד֣וּ ל/שפט בְּ/מִשְׁפָּטַ֖/י ו/שפט/הו וְ/אֶת תּוֹרֹתַ֤/י וְ/אֶת חֻקֹּתַ/י֙ בְּ/כָל מוֹעֲדַ֣/י יִשְׁמֹ֔רוּ וְ/אֶת שַׁבְּתוֹתַ֖/י יְקַדֵּֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/024.yaml
  text: In a dispute[a], they shall stand to judge; they shall judge it according to my judgments. They shall keep my laws and my statutes at all my appointed times[b], and they shall keep my Sabbaths holy.
  footnotes:
  - marker: a
    text: Or 'case,' 'controversy,' or 'lawsuit' for 'dispute.'
    reason: lexical_alternative
  - marker: b
    text: '''My appointed times'' may also be rendered ''my appointed festivals'' or ''my set times.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 분쟁이 있을 때에는 그들이 서서 재판해야 합니다.[a] 그들은 내 법도에 따라 그것을 판결해야 합니다. 그들은 나의 모든 정한 때[b]에 내 율법과 내 규례를 지켜야 하며, 내 안식일들을 거룩하게 지켜야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘분쟁’은 ‘사건’, ‘논쟁’, 또는 ‘소송’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나의 모든 정한 때’는 ‘나의 모든 정해진 절기’ 또는 ‘나의 모든 정해진 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
