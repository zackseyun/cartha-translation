  rationale: תּוֹרָה와 חֻקָּה의 법적·규범적 뉘앙스를 살리되, 현대 한국어에서 너무 교회적이거나 중복적으로 들리는 표현은 피하고 ‘법/규례’로 구분했습니다.
- source_word: מוֹעֲדַי
  english_pob_choice: my appointed times
  chosen_korean: 모든 나의 정한 때
  alternatives_korean:
  - 모든 나의 정해진 절기
  - 모든 나의 appointed times
  - 모든 나의 절기
  lexicon: HALOT
  rationale: מוֹעֵד은 절기보다 넓게 ‘정해진 때’를 포함하므로, 제의적 절기만으로 좁히지 않도록 ‘정한 때’로 번역했습니다.
- source_word: שַׁבְּתוֹתַי
  english_pob_choice: my Sabbaths
  chosen_korean: 내 안식일들
  alternatives_korean:
  - 내 안식일
  - 내 안식일들
  - 내 안식일들
  lexicon: HALOT
  rationale: 히브리어 복수를 드러내기 위해 단수화하지 않고 ‘안식일들’로 옮겼습니다. 한국어에서 다소 낯설 수 있으나 원문 복수성을 보존합니다.
theological_decisions:
- issue: שַׁבְּתוֹתַי의 복수와 규범적 준수 표현
  chosen_reading: ‘내 안식일들’을 유지하고, ‘거룩하게 해야 합니다’로 의무적 헌신을 분명히 했습니다.
