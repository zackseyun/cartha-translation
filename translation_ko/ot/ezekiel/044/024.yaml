language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַל רִ֗יב הֵ֚מָּה יַעַמְד֣וּ ל/שפט בְּ/מִשְׁפָּטַ֖/י ו/שפט/הו וְ/אֶת תּוֹרֹתַ֤/י וְ/אֶת חֻקֹּתַ/י֙ בְּ/כָל מוֹעֲדַ֣/י יִשְׁמֹ֔רוּ וְ/אֶת שַׁבְּתוֹתַ֖/י יְקַדֵּֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/024.yaml
  text: In a dispute[a], they shall stand to judge; they shall judge it according to my judgments. They shall keep my laws and my statutes at all my appointed times[b], and they shall keep my Sabbaths holy.
  footnotes:
  - marker: a
    text: Or 'case,' 'controversy,' or 'lawsuit' for 'dispute.'
    reason: lexical_alternative
  - marker: b
    text: '''My appointed times'' may also be rendered ''my appointed festivals'' or ''my set times.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 분쟁이 있으면 그들은 재판하기 위해 서야 합니다. 그들은 내 판단에 따라 그것을 판결해야 합니다. 그들은 모든 나의 정한 때에 내 법과 내 규례를 지켜야 하며, 내 안식일들을 거룩하게 해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘분쟁’은 ‘사건,’ ‘논쟁,’ 또는 ‘소송’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나의 정한 때’는 ‘나의 정해진 절기’ 또는 ‘나의 정해진 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  english_pob_choice: dispute
  chosen_korean: 분쟁
  alternatives_korean:
  - 논쟁
  - 송사
  - 소송
  - 다툼
  lexicon: HALOT
  rationale: 법정 맥락의 רִיב을 현대 한국어에서 자연스럽고 넓게 포괄하는 ‘분쟁’으로 옮겨, 사법적 성격을 살리면서도 ‘소송’처럼 지나치게 협소해지지 않게 했습니다.
- source_word: יַעַמְדוּ לְשָׁפֵט
  english_pob_choice: shall stand to judge
  chosen_korean: 재판하기 위해 서야 합니다
  alternatives_korean:
  - 판결하기 위해 서야 합니다
  - 심판하기 위해 서야 합니다
  - 서서 판결해야 합니다
  lexicon: HALOT
  rationale: ‘서다’와 ‘재판하다/판결하다’의 결합을 살려, 단순 기능 설명이 아니라 공적 사법 직무에 나아가 서는 이미지를 보존했습니다.
- source_word: בְּמִשְׁפָּטַי
  english_pob_choice: according to my judgments
  chosen_korean: 내 판단에 따라
  alternatives_korean:
  - 내 판결에 따라
  - 내 심판에 따라
  - 내 규례에 따라
  lexicon: HALOT
  rationale: 여기서는 법적 판단 기준을 가리키므로 ‘판결/판단’이 적절하지만, 본문 전체의 반복을 고려해 한국어로는 자연스러운 ‘내 판단에 따라’로 옮겼습니다.
- source_word: תּוֹרֹתַי / חֻקֹּתַי
  english_pob_choice: my laws and my statutes
  chosen_korean: 내 법과 내 규례
  alternatives_korean:
  - 내 율법과 내 규례
  - 내 가르침과 내 규례
  - 내 법들과 내 규정
  lexicon: HALOT
  rationale: תּוֹרָה와 חֻקָּה의 법적·규범적 뉘앙스를 살리되, 현대 한국어에서 너무 교회적이거나 중복적으로 들리는 표현은 피하고 ‘법/규례’로 구분했습니다.
- source_word: מוֹעֲדַי
  english_pob_choice: my appointed times
  chosen_korean: 모든 나의 정한 때
  alternatives_korean:
  - 모든 나의 정해진 절기
  - 모든 나의 appointed times
  - 모든 나의 절기
  lexicon: HALOT
  rationale: מוֹעֵד은 절기보다 넓게 ‘정해진 때’를 포함하므로, 제의적 절기만으로 좁히지 않도록 ‘정한 때’로 번역했습니다.
- source_word: שַׁבְּתוֹתַי
  english_pob_choice: my Sabbaths
  chosen_korean: 내 안식일들
  alternatives_korean:
  - 내 안식일
  - 내 안식일들
  - 내 안식일들
  lexicon: HALOT
  rationale: 히브리어 복수를 드러내기 위해 단수화하지 않고 ‘안식일들’로 옮겼습니다. 한국어에서 다소 낯설 수 있으나 원문 복수성을 보존합니다.
theological_decisions:
- issue: שַׁבְּתוֹתַי의 복수와 규범적 준수 표현
  chosen_reading: ‘내 안식일들’을 유지하고, ‘거룩하게 해야 합니다’로 의무적 헌신을 분명히 했습니다.
  alternative_readings:
  - ‘내 안식일’을 단수로 자연화하기
  - ‘구별해야 합니다’로 완화하기
  rationale: 원문은 복수형을 분명히 사용하며, קדש의 사역적 의미는 단순 준수보다 ‘거룩하게 함’이 더 직접적입니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
