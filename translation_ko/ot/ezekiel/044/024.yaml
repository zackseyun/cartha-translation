  lexicon: HALOT
  rationale: ‘서다’와 ‘재판하다/판결하다’의 결합을 살려, 단순 기능 설명이 아니라 공적 사법 직무에 나아가 서는 이미지를 보존했습니다.
- source_word: בְּמִשְׁפָּטַי
  english_pob_choice: according to my judgments
  chosen_korean: 내 판단에 따라
  alternatives_korean:
