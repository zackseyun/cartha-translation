  rationale: 여기서는 법적 판단 기준을 가리키므로 ‘판결/판단’이 적절하지만, 본문 전체의 반복을 고려해 한국어로는 자연스러운 ‘내 판단에 따라’로 옮겼습니다.
- source_word: תּוֹרֹתַי / חֻקֹּתַי
  english_pob_choice: my laws and my statutes
  chosen_korean: 내 법과 내 규례
  alternatives_korean:
  - 내 율법과 내 규례
  - 내 가르침과 내 규례
  - 내 법들과 내 규정
