    rationale: בְּשָׁרְתָם בְּשַׁעֲרֵי ... וָבָיְתָה는 ‘양털이 그들 위에 오르지 않을’ 상황, 곧 그들이 안뜰의 문들과 성전에서 섬길 때를 수식합니다. 초안의 마지막 문장은 앞 조항을 모호하게 반복합니다.
  - severity: medium
    issue: ‘양털이 오르지 못하게 해야 합니다’가 비자연적이고 행위 주체를 추가합니다.
    rationale: 원문은 양털이 그들 위에 있지 말아야 한다는 금지이지, 별도의 누군가가 이를 막아야 한다는 지시가 아닙니다.
  - severity: medium
    issue: ‘수종들다’와 ‘집 안’의 어휘 선택이 현대 표준어 및 성전 문맥에 충분히 적합하지 않습니다.
    rationale: ‘수종들다’는 고어적·종속적 뉘앙스가 강합니다. ‘집’은 여기서 성전 건물을 뜻하므로 ‘성전 안’이 문맥상 명료합니다.
