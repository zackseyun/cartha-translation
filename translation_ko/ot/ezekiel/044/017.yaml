id: EZK.44.17
reference: Ezekiel 44:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/בוֹאָ/ם֙ אֶֽל שַׁעֲרֵי֙ הֶ/חָצֵ֣ר הַ/פְּנִימִ֔ית בִּגְדֵ֥י פִשְׁתִּ֖ים יִלְבָּ֑שׁוּ וְ/לֹֽא יַעֲלֶ֤ה עֲלֵי/הֶם֙ צֶ֔מֶר בְּ/שָֽׁרְתָ֗/ם בְּ/שַׁעֲרֵ֛י הֶ/חָצֵ֥ר הַ/פְּנִימִ֖ית וָ/בָֽיְתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/017.yaml
  text: And when they enter the gates of the inner court[a], they shall wear linen garments[b]; no wool shall come upon them while they minister in the gates of the inner court and in the house.
  footnotes:
  - marker: a
    text: Or, 'they shall not wear wool.' The Hebrew more literally says, 'no wool shall come upon them.'
    reason: lexical_alternative
  - marker: b
    text: '''The house'' here refers to the temple building.'
    reason: cultural_note
translation:
  language: ko
  text: 그들이 안뜰의 문들로 들어갈 때에는 아마포 옷을 입어야 하며, 수종들 때에는 그들 위에 양털이 오르지 못하게 해야 합니다. 그리고 안뜰의 문들과 집 안에서 섬길 때에도 그러해야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּגְדֵי פִשְׁתִּים / יִלְבָּשׁוּ
  english_pob_choice: they shall wear linen garments
  chosen_korean: 아마포 옷을 입어야 하며
  alternatives_korean:
  - 린넨 옷을 입어야 하며
  - 아마포 옷을 입습니다
  lexicon: WLC; HALOT
  rationale: פִשְׁתִּים은 재질상 아마포/리넨을 뜻하므로, 성경적이면서도 현대 한국어에 자연스러운 ‘아마포 옷’을 택했습니다. יִלְבָּשׁוּ는 규정된 복장을 뜻하므로 ‘입어야 하며’로 옮겼습니다.
- source_word: וְלֹא יַעֲלֶה עֲלֵיהֶם צֶמֶר
  english_pob_choice: no wool shall come upon them
  chosen_korean: 그들 위에 양털이 오르지 못하게 해야 합니다
  alternatives_korean:
  - 그들은 양털을 입어서는 안 됩니다
  - 양털이 그들 위에 없어야 합니다
  lexicon: WLC; HALOT
  rationale: 히브리어는 문자적으로 ‘양털이 그들 위로 올라가지 못한다’는 표현이므로, POB의 직역 감각을 살려 ‘오르지 못하게’로 유지했습니다. 다만 한국어에서는 ‘입다’보다 원문의 금지 이미지를 더 직접적으로 드러내기 위해 이 표현을 택했습니다.
- source_word: בְּשָׁרְתָם
  english_pob_choice: while they minister
  chosen_korean: 수종들 때에는
  alternatives_korean:
  - 섬길 때에는
  - 사역할 때에는
  lexicon: HALOT
  rationale: 성전 규례 문맥의 제의적 봉사를 반영하기 위해 ‘수종들다’를 썼습니다. 일반적 ‘섬기다’보다 예식 수행의 뉘앙스를 조금 더 분명히 합니다.
- source_word: וָבָיְתָה
  english_pob_choice: in the house
  chosen_korean: 집 안에서
  alternatives_korean:
  - 성전 안에서
  - 집에서
  lexicon: HALOT
  rationale: 이 ‘집’은 예루살렘 성전 건물을 가리키므로, 공간성을 살리면서도 이해하기 쉬운 ‘집 안에서’로 옮겼습니다. 본문 대비를 위해 ‘안뜰의 문들’과 짝을 이루게 했습니다.
theological_decisions:
- issue: 제의적 규례의 어휘 선택
  chosen_reading: ‘수종들다’로 제사장적 봉사의 예식성을 드러냅니다.
  alternative_readings:
  - ‘섬기다’로 중립적으로 처리
  - ‘봉사하다’로 현대화
  rationale: 이 절은 일반 봉사가 아니라 성전 안에서의 제의적 직무를 다루므로, 단순한 일상어보다 예전적 색채가 있는 표현이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: Ezekiel 44:17의 성전 규례 문맥
