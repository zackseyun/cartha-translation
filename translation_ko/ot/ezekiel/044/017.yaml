revisions:
- from: 그들이 안뜰의 문들로 들어갈 때에는 아마포 옷을 입어야 하며, 수종들 때에는 그들 위에 양털이 오르지 못하게 해야 합니다. 그리고 안뜰의 문들과 집 안에서 섬길 때에도 그러해야 합니다.
  to: 그들이 안뜰의 문들로 들어갈 때에는 아마포 옷을 입어야 합니다. 그들이 안뜰의 문들과 성전 안에서 섬길 때에는 양털 옷을 입어서는 안 됩니다.
  rationale: 문장을 두 규정으로 정돈하되, 후반의 ‘섬길 때’와 두 장소 표현을 양털 금지 조항에 연결했습니다. ‘아마포’와 ‘양털’의 재질 대조를 유지하고, 현대 합쇼체에 맞추어 ‘수종들다’를 ‘섬기다’로 바꾸었습니다. ‘성전 안’은 원문의 ‘그 집’이 가리키는 성전 건물을 문맥적으로 명료하게 드러냅니다.
