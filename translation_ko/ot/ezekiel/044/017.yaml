  timestamp: '2026-07-13T17:44:58Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 후반의 장소·시간 수식어(‘안뜰의 문들과 집 안에서 섬길 때’)를 양털 금지에 직접 연결하지 않고 별도 문장으로 반복하여, 히브리어의 문장 구조와 의미 관계를 흐립니다. 또한 ‘양털이 오르지 못하게 해야 합니다’는 한국어에서 부자연스럽고 누가 금지를 시행하는지 불필요하게 바꿉니다.
  naturalness: ‘수종들다’는 현대 표준어 합쇼체 성경 번역에서 지나치게 고어적이며 일반 독자에게 자연스럽지 않습니다. ‘집 안’은 성전 환상 문맥의 지시 대상을 일상 주택처럼 들리게 할 수 있으므로 ‘성전 안’이 명료하고 자연스럽습니다.
  terminology: ‘아마포 옷’은 פִשְׁתִּים의 재질을 적절히 반영합니다. 제의적 섬김은 교파적 의미를 덧붙이지 않는 ‘섬기다’로 옮기는 것이 적절합니다. צֶמֶר의 금지는 한국어 관용에 따라 ‘양털 옷을 입어서는 안 됩니다’로 표현하되, 원문의 착용 금지 의미를 보존합니다.
  issues:
