base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/020.yaml
  text: They shall not shave their heads[a], nor let their hair grow long; they shall surely trim the hair of their heads.
  footnotes:
  - marker: a
    text: Or, 'they shall keep the hair of their heads well trimmed.' The Hebrew expression in the final clause is somewhat compact and may be rendered in several closely related ways.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 머리를 밀어서는 안 되며, 머리털을 길게 자라도록 두어서도 안 됩니다. 그들은 머리털을 반드시 다듬어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 마지막 표현은 간결하여, ‘머리털을 잘 다듬어야 합니다’ 또는 ‘머리털을 가지런히 잘라야 합니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלֵּחוּ
  english_pob_choice: shall shave
  chosen_korean: 머리를 밀어서는 안 되며
  alternatives_korean:
  - 머리를 깎아서는 안 되며
  - 머리를 삭발해서는 안 되며
  lexicon: HALOT
  rationale: גלח의 기본 뜻은 머리나 수염을 면도하듯 미는 것이므로, 문맥의 금지 규정을 자연스럽게 살려 ‘머리를 밀다’로 옮겼습니다.
- source_word: פֶרַע / יְשַׁלֵּחוּ
  english_pob_choice: their hair grow long / let ... grow
  chosen_korean: 머리를 길게 늘어뜨려서도 안 됩니다
  alternatives_korean:
  - 머리카락을 길게 자라게 해서는 안 됩니다
  - 헝클어진 채로 두어서는 안 됩니다
  lexicon: HALOT
  rationale: פֶרַע와 שלח의 결합은 단정하지 않게 풀어두는 상태를 가리키므로, 제사장 단정 규정의 맥락에서 ‘길게 늘어뜨리다’로 자연스럽게 표현했습니다.
- source_word: כָּסוֹם יִכְסְמוּ
  english_pob_choice: shall surely trim
  chosen_korean: 머리털을 반드시 다듬어야 합니다
  alternatives_korean:
  - 머리털을 꼭 잘라야 합니다
  - 머리털을 가지런히 잘라야 합니다
  lexicon: HALOT
  rationale: בה 강조형(부정사 절대형+동사형)의 강한 권고를 ‘반드시’로 살리고, קסם의 정리·다듬기 의미를 ‘다듬다’로 옮겨 과도한 삭발 뉘앙스를 피했습니다.
theological_decisions:
- issue: 제사장 머리 손질 규정의 금지와 명령의 균형
  chosen_reading: ‘밀어서는 안 된다’와 ‘반드시 다듬어야 한다’를 함께 두어, 금지와 허용된 관리의 경계를 분명히 했습니다.
  alternative_readings:
  - ‘삭발해서는 안 된다’로만 옮겨 더 강하게 읽는 방식
  - ‘정돈해야 한다’로만 옮겨 금지의 긴장을 약화하는 방식
  rationale: 본문은 완전 삭발과 방임적 장발을 모두 배제하고 중간의 단정한 관리만 허용하므로, 두 개의 대조를 함께 드러내는 번역이 가장 충실합니다.
  doctrine_reference: 제사장 거룩함과 구별의 표지(겔 44장 문맥)
