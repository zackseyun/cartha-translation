source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֨ר יְשָׁרְת֤וּ אוֹתָ/ם֙ לִ/פְנֵ֣י גִלּֽוּלֵי/הֶ֔ם וְ/הָי֥וּ לְ/בֵֽית יִשְׂרָאֵ֖ל לְ/מִכְשׁ֣וֹל עָוֺ֑ן עַל כֵּן֩ נָשָׂ֨אתִי יָדִ֜/י עֲלֵי/הֶ֗ם נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/נָשְׂא֖וּ עֲוֺנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/012.yaml
  text: Because they ministered to them before their idols and became a stumbling block of iniquity for the house of Israel[a], therefore I have raised my hand against them, declares the Lord GOD[b], and they will bear their iniquity.
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''I have lifted up my hand against them,'' a gesture that can signal a solemn oath or judicial action; here the context favors a judgment declaration against them.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they served them before their idols.' The Hebrew pronoun 'them' is somewhat compressed in English and may refer to those associated with the idols or, by sense, to the idols themselves.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 자기들의 우상들 앞에서 그들을 섬기며 이스라엘 집에 죄악의 걸림돌이 되었기 때문입니다. 그러므로 나는 그들에 맞서 내 손을 들었습니다[a], 주 하나님이 선언하십니다[b]. 그들은 자기 죄악을 져야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘내 손을 들어 올렸다’는 엄숙한 맹세나 재판적 행위를 가리킬 수 있으며, 여기서는 심판 선언의 뜻이 더 강합니다.
    reason: lexical_alternative
  - marker: b
    text: 예언자적 선언 형식입니다.
    reason: source_note
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  english_pob_choice: Because
  chosen_korean: ~기 때문입니다
  alternatives_korean:
  - 왜냐하면
  - ~하였으므로
  lexicon: HALOT
  rationale: 원문의 명시적 인과를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: יְשָׁרְתוּ אוֹתָם
  english_pob_choice: they ministered to them
  chosen_korean: 그들을 섬기며
  alternatives_korean:
  - 그들에게 봉사하며
  - 그들을 시중들며
  lexicon: HALOT
  rationale: 성전적/제의적 봉사 맥락을 살리되, 한국어에서 과도하게 전문적인 어감을 피했습니다.
- source_word: לִפְנֵי גִלּוּלֵיהֶם
  english_pob_choice: before their idols
  chosen_korean: 자기들의 우상들 앞에서
  alternatives_korean:
  - 자기들의 우상들 앞에
  - 자기들의 우상들 면전에
  lexicon: HALOT
  rationale: לִפְנֵי의 공간적 의미를 살려, 우상숭배의 공개적·면전적 장면을 드러냈습니다.
- source_word: לְמִכְשׁוֹל עָוֺן
  english_pob_choice: a stumbling block of iniquity
  chosen_korean: 죄악의 걸림돌
  alternatives_korean:
  - 죄의 걸림돌
  - 죄악의 장애물
  lexicon: HALOT
  rationale: 히브리어의 관용적 비유를 보존하면서도 한국어에서 이해 가능한 표현으로 옮겼습니다.
- source_word: נָשָׂאתִי יָדִי עֲלֵיהֶם
  english_pob_choice: I have raised my hand against them
  chosen_korean: 내 손을 들었습니다
  alternatives_korean:
  - 내 손을 들어올렸습니다
  - 내 손을 그들 위에 들었습니다
  lexicon: HALOT
  rationale: 맹세/재판적 제스처를 품은 관용구를 직역에 가깝게 유지하되, 본문 문맥상 대적·심판의 뜻은 ‘그들에 맞서’로 드러냈습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님이 선언하십니다
  alternatives_korean:
  - 주 하나님이 말씀하십니다
  - 주 야훼께서 선언하십니다
  lexicon: HALOT
  rationale: 예언 선포 সূত্র어를 현대 문체로 옮겼고, 본 프로젝트 기본어에 따라 여호와가 아니라 ‘하나님’과 직함 조합으로 처리했습니다.
- source_word: וְנָשְׂאוּ עֲוֺנָם
  english_pob_choice: and they will bear their iniquity
  chosen_korean: 그들은 자기 죄악을 져야 합니다
  alternatives_korean:
  - 그들은 자기 죄악을 감당해야 합니다
  - 그들은 자기 죄책을 져야 합니다
  lexicon: HALOT
  rationale: ‘bear’의 부담·책임·형벌 함의를 살리기 위해 ‘지다’를 사용했고, 문맥상 미래적 심판을 분명히 했습니다.
theological_decisions:
- issue: 신적 선포 공식에서 יְהוִה의 처리
  chosen_reading: ‘주 하나님’으로 옮기고, 선포 동사 ‘선언하십니다’로 예언적 권위를 살렸습니다.
  alternative_readings:
  - ‘주 야훼’
  - ‘주 LORD’
  rationale: 본문은 아도나이 + 야훼 조합이지만, 한국어 가독성과 프로젝트 기본어를 고려해 직함 중심으로 처리했습니다.
  doctrine_reference: 'Project glossary: Θεός→하나님, YHWH default handling; Ezekiel prophetic oracle formula'
