review_pass:
  verdict: revise
  source_fidelity: 히브리어의 인과 구조, 우상 앞에서의 섬김, 이스라엘 집에 대한 ‘죄악의 걸림돌’, 손을 드는 심판 관용구, 그리고 죄악을 짊어짐은 대체로 반영되었습니다. 그러나 אָדֹנָי יְהוִה의 신명 요소를 ‘주 하나님’으로만 처리하면 원문의 야훼 이름이 소실됩니다. 또한 וְנָשְׂאוּ는 미래 진술인데 ‘져야 합니다’는 의무 표현으로 바뀌므로 미래의 심판 결과를 직접적으로 옮기는 편이 낫습니다.
  naturalness: 합쇼체 문체는 전반적으로 자연스럽습니다. 다만 ‘그들은 자기 죄악을 져야 합니다’보다 ‘그들은 자기들의 죄악을 짊어질 것입니다’가 현대 한국어에서 더 자연스럽고 원문의 미래형에도 맞습니다. ‘선언하십니다’도 가능하나 예언 공식에는 ‘말씀하십니다’가 더 자연스럽습니다.
  terminology: ‘이스라엘 집’, ‘우상’, ‘죄악의 걸림돌’은 적절합니다. אֲדֹנָי יְהוִה는 ‘주 야훼’로 옮겨 신명과 주권 칭호를 모두 보존해야 합니다. ‘그들을’의 지시 대상은 히브리어에서 압축되어 있으므로 본문에서 단정하지 않고 각주로 설명하는 것이 적절합니다.
