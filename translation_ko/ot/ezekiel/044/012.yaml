    rationale: 원문은 주권 칭호와 고유 신명을 함께 사용합니다. 제공된 영어 POB의 신명 처리 방침도 ‘Yahweh’를 요구하므로 한국어 본문도 ‘주 야훼’로 보존하는 것이 적절합니다.
