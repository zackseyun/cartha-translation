    rationale: 현대 합쇼체 서술문 안에서 독자에게 직접 명령하는 듯한 ‘보아라’는 부자연스럽습니다. ‘내가 보니’가 וָאֵרֶא וְהִנֵּה의 시각적 주목을 자연스럽게 전달합니다.
