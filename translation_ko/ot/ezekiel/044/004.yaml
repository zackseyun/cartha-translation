source:
  edition: WLC
  text: וַ/יְבִיאֵ֜/נִי דֶּֽרֶךְ שַׁ֣עַר הַ/צָּפוֹן֮ אֶל פְּנֵ֣י הַ/בַּיִת֒ וָ/אֵ֕רֶא וְ/הִנֵּ֛ה מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֣ית יְהוָ֑ה וָ/אֶפֹּ֖ל אֶל פָּנָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/004.yaml
  text: Then he brought me by way of the north gate to the front of the house[a], and I looked, and behold, the glory of Yahweh filled the house of Yahweh[b]; and I fell on my face.
  footnotes:
  - marker: a
    text: Or, 'through the north gate.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house of the LORD'; that is, the temple. The translation keeps 'house' to reflect Ezekiel's wording.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그가 나를 북쪽 문길로 이끌어 집 앞까지 데려갔습니다[a]. 내가 보니, 보아라, 야훼의 영광이 야훼의 집을 가득 채우고 있었습니다[b]. 그래서 나는 얼굴을 땅에 대고 엎드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘북쪽 문을 통해’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘야훼의 집’입니다. 곧 성전입니다. 번역은 에스겔의 표현을 반영하려고 ‘집’을 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  english_pob_choice: Then he brought me
  chosen_korean: 그가 나를 … 데려갔습니다
  alternatives_korean:
  - 그가 나를 … 이끌었습니다
  - 그가 나를 … 데리고 갔습니다
  lexicon: HALOT
  rationale: 히필형 בוא는 ‘데려오다/데려가다’의 뜻이므로, 한국어에서는 자연스럽게 ‘데려갔습니다’로 옮겨 직접적인 이동 결과를 드러냈습니다.
- source_word: דֶּרֶךְ שַׁעַר הַצָּפוֹן
  english_pob_choice: by way of the north gate
  chosen_korean: 북쪽 문길로
  alternatives_korean:
  - 북쪽 문을 지나
  - 북쪽 문을 통해
  lexicon: HALOT
  rationale: דֶּרֶךְ은 여기서 경로를 나타내므로 ‘~로’로 처리했고, ‘문길’은 문을 통과하는 길이라는 공간감을 살리면서도 지나치게 설명적이지 않게 했습니다.
- source_word: מָלֵא כְבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh filled
  chosen_korean: 야훼의 영광이 … 가득 채우고 있었습니다
  alternatives_korean:
  - 야훼의 영광이 … 가득했습니다
  - 야훼의 영광이 … 가득 채웠습니다
  lexicon: HALOT
  rationale: מָלֵא의 상태를 한국어에서 자연스러운 진행·충만상으로 표현해, 성전 환상 속에서 ‘가득함’의 현장성을 살렸습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 집
  - 야훼의 성전
  lexicon: HALOT
  rationale: 본문이 בַּיִת/בֵּית의 ‘집’ 언어를 유지하므로, POB의 판단을 따라 ‘성전’으로 매끈하게 바꾸지 않고 ‘집’을 보존했습니다.
- source_word: וָאֶפֹּל אֶל פָּנָי
  english_pob_choice: and I fell on my face
  chosen_korean: 얼굴을 땅에 대고 엎드렸습니다
  alternatives_korean:
  - 얼굴에 엎드렸습니다
  - 엎드렸습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 경외의 완전한 엎드림을 뜻하므로, 한국어에서 의미가 분명한 ‘얼굴을 땅에 대고 엎드리다’로 옮겼습니다.
theological_decisions:
- issue: YHWH(יְהוָה)의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신적 고유명사를 제목적 표현 ‘주’로 바꾸지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약적 고유성을 보존했습니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → 야훼
- issue: ‘집’ 언어의 보존
  chosen_reading: 야훼의 집
  alternative_readings:
  - 야훼의 성전
  - 야훼의 궁전
  rationale: 에스겔의 성전 환상은 반복적으로 ‘집’(בַּיִת) 언어를 사용하므로, 해석어를 앞질러 넣지 않고 원문의 표현층을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
