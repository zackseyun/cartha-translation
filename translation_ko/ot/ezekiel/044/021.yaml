  lexicon: HALOT
  rationale: ‘모든 제사장’의 보편적 금지라는 뜻을 살리되, 한국어에서는 주어를 먼저 두는 방식이 읽기 자연스럽습니다.
- source_word: הֶחָצֵר הַפְּנִימִית
  english_pob_choice: the inner court
  chosen_korean: 내실
  alternatives_korean:
