  lexicon: HALOT
  rationale: 법규적 금지문이므로 한국어에서는 금지의 규범성을 분명히 드러내는 표현이 자연합니다.
- source_word: כָּל כֹּהֵן
  english_pob_choice: No priest / every priest
  chosen_korean: 제사장은 모두
  alternatives_korean:
