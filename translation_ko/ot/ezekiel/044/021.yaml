  - 내뜰
  lexicon: HALOT
  rationale: 성전 문맥의 חָצֵר를 ‘뜰’로 옮길 수 있으나, 여기서는 대비되는 ‘inner’의 기능을 살려 더 짧고 분명한 ‘내실’을 택했습니다.
