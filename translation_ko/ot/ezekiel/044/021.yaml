lexical_decisions:
- source_word: יַיִן
  english_pob_choice: wine
  chosen_korean: 포도주
  alternatives_korean:
  - 술
  - 와인
  lexicon: HALOT
  rationale: יַיִן은 기본적으로 포도주를 가리키므로, 현대 한국어에서도 가장 직접적인 대응인 포도주를 택했습니다.
- source_word: לֹא יִשְׁתּוּ
  english_pob_choice: shall not drink
