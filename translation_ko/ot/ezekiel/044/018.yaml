  text: פַּאֲרֵ֤י פִשְׁתִּים֙ יִהְי֣וּ עַל רֹאשָׁ֔/ם וּ/מִכְנְסֵ֣י פִשְׁתִּ֔ים יִהְי֖וּ עַל מָתְנֵי/הֶ֑ם לֹ֥א יַחְגְּר֖וּ בַּ/יָּֽזַע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/018.yaml
  text: Linen turbans shall be on their heads[a], and linen undergarments shall be on their loins; they shall not gird themselves with anything that causes sweat.
  footnotes:
  - marker: a
    text: Or more literally, 'they shall not gird themselves with sweat.' The Hebrew is elliptical; the sense is likely that they must not wear or fasten garments that produce perspiration.
    reason: lexical_alternative
translation:
  language: ko
  text: 머리에 아마로 만든 관을 쓰고, 허리에는 아마로 만든 속바지를 입어야 합니다. 그들은 땀이 나게 하는 것으로 허리를 동이지 말아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘땀으로 허리를 동이지 말아야 합니다’입니다. 히브리어는 생략된 표현으로, 땀을 유발하는 옷이나 동임을 금하는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּאֲרֵי
  english_pob_choice: turbans
  chosen_korean: 관
  alternatives_korean:
  - 머리수건
  - 두건
  - 장식 관
  lexicon: HALOT
  rationale: 제사장 복식 문맥에서 머리에 쓰는 예복용 관을 가리키므로, 현대 한국어로는 기능과 격식을 함께 살리는 ‘관’이 가장 자연스럽습니다.
- source_word: פִשְׁתִּים
  english_pob_choice: linen
  chosen_korean: 아마로 만든
  alternatives_korean:
  - 리넨의
  - 삼베의
  - 마직물로 만든
  lexicon: HALOT
  rationale: 원문은 재질을 가리키며, POB의 ‘linen’을 한국어로는 ‘아마로 만든’으로 옮기면 천의 재질을 분명히 하면서도 성경적 문맥을 유지할 수 있습니다.
- source_word: מִכְנְסֵי
  english_pob_choice: undergarments
  chosen_korean: 속바지
  alternatives_korean:
  - 속옷
  - 하의
  - 바지
  lexicon: HALOT
  rationale: 제사장이 피부에 닿게 입는 하의용 의복을 뜻하므로, 현대 독자가 이해하기 쉬우면서도 기능을 드러내는 ‘속바지’가 적절합니다.
- source_word: בַּיָּזַע
  english_pob_choice: with anything that causes sweat
  chosen_korean: 땀이 나게 하는 것으로
  alternatives_korean:
  - 땀을 유발하는 것으로
  - 땀나는 것으로
  - 땀나게 하는 것을 가지고
  lexicon: HALOT
  rationale: 히브리어는 생략이 있는 표현이라, 한국어에서는 ‘땀이 나게 하는 것으로’라고 풀어써서 POB가 지적한 의미를 드러내되 원문의 절제를 유지합니다.
theological_decisions:
- issue: 마지막 금지문의 축약 표현
  chosen_reading: ‘동이지 말아야 합니다’로 옮겨, 단순한 복장 규정이 아니라 땀을 유발하는 방식의 허리 동임 금지를 보이게 했습니다.
  alternative_readings:
  - ‘허리에 땀이 나게 하는 것을 두르지 말아야 합니다’
  - ‘땀을 유발하는 띠를 매지 말아야 합니다’
  rationale: 히브리어는 매우 압축적이며, POB도 이를 ‘sweat를 일으키는 것’으로 해석합니다. 한국어는 관용적으로 풀되, 규정의 실제 의도를 과도하게 특정하지 않도록 했습니다.
  doctrine_reference: Translation philosophy items 1, 3, and 6
