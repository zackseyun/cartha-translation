  lexicon: HALOT
  rationale: 히브리어는 생략이 있는 표현이라, 한국어에서는 ‘땀이 나게 하는 것으로’라고 풀어써서 POB가 지적한 의미를 드러내되 원문의 절제를 유지합니다.
theological_decisions:
- issue: 마지막 금지문의 축약 표현
  chosen_reading: ‘동이지 말아야 합니다’로 옮겨, 단순한 복장 규정이 아니라 땀을 유발하는 방식의 허리 동임 금지를 보이게 했습니다.
  alternative_readings:
  - ‘허리에 땀이 나게 하는 것을 두르지 말아야 합니다’
  - ‘땀을 유발하는 띠를 매지 말아야 합니다’
  rationale: 히브리어는 매우 압축적이며, POB도 이를 ‘sweat를 일으키는 것’으로 해석합니다. 한국어는 관용적으로 풀되, 규정의 실제 의도를 과도하게 특정하지 않도록 했습니다.
  doctrine_reference: Translation philosophy items 1, 3, and 6
