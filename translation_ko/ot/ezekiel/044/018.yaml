  lexicon: HALOT
  rationale: 원문은 재질을 가리키며, POB의 ‘linen’을 한국어로는 ‘아마로 만든’으로 옮기면 천의 재질을 분명히 하면서도 성경적 문맥을 유지할 수 있습니다.
