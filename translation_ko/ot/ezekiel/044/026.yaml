- from: 그리고 그가 정결하게 된 후에, 그를 위하여 일곱 날을 셉니다.[a]
  to: 그리고 그가 정결하게 된 뒤에는 그를 위하여 일곱 날을 세어야 합니다.[a]
  rationale: 법규적 문맥의 동사 형태를 현대 합쇼체에서 자연스러운 의무 표현으로 수정하고, 시간 연결을 ‘뒤에는’으로 다듬었습니다. 정결의 의례적 의미, 칠 일이라는 기간, 그리고 ‘그를 위하여’라는 관련 대상을 보존했습니다.
