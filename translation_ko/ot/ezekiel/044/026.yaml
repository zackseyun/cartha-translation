id: EZK.44.26
reference: Ezekiel 44:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַחֲרֵ֖י טָֽהֳרָת֑/וֹ שִׁבְעַ֥ת יָמִ֖ים יִסְפְּרוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/026.yaml
  text: And after his cleansing[a], they shall count seven days for him.
  footnotes:
  - marker: a
    text: Or “his purification.” The Hebrew refers to ritual cleansing in the priestly context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 정결하게 된 후에, 그를 위하여 일곱 날을 셉니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 정결.” 히브리어는 제사장적 맥락의 의례적 정결을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי
  english_pob_choice: And after
  chosen_korean: 그리고 … 후에
  alternatives_korean:
  - 그리고 그 뒤에
  - … 후에
  lexicon: HALOT
  rationale: 앞의 규정과의 담화 연속성을 살리기 위해 접속사 ‘그리고’를 두고, אַחֲרֵי의 시간적 순서를 ‘후에’로 옮겼습니다.
- source_word: טָהֳרָתוֹ
  english_pob_choice: his cleansing
  chosen_korean: 그가 정결하게 된 것
  alternatives_korean:
  - 그의 정결
  - 그의 정화
  - 그가 깨끗해진 것
  lexicon: HALOT
  rationale: 제사장적 의례 맥락의 정결 상태를 반영해, 도덕적 의미를 덧씌우지 않고 ‘정결하게 된 것’으로 풀었습니다.
- source_word: יִסְפְּרוּ
  english_pob_choice: they shall count off
  chosen_korean: 셉니다
  alternatives_korean:
  - 세어야 합니다
  - 일수를 셉니다
  - 카운트합니다
  lexicon: HALOT
  rationale: ספר의 규정적 계산 의미를 살리되, 한국어에서는 자연스럽고 문어체에 맞게 미래-의무적 표현으로 옮겼습니다.
- source_word: לוֹ
  english_pob_choice: for him
  chosen_korean: 그를 위하여
  alternatives_korean:
  - 그를 위해
  - 그에게
  - 그를 향하여
  lexicon: HALOT
  rationale: 여격/수혜 의미를 제의 절차의 기준 대상으로 자연스럽게 드러내기 위해 ‘그를 위하여’로 옮겼습니다.
theological_decisions:
- issue: 정결의 성격
  chosen_reading: 이 절은 제사장적 의례상의 정결을 말하므로, 내적 성화나 도덕적 정화로 확장하지 않았습니다.
  alternative_readings:
  - 그의 성결
  - 그의 영적 정결
  rationale: 원문 טָהֳרָה는 문맥상 의식적 정결을 가리키며, 본문이 말하지 않는 신학적 확장을 피하는 것이 원문의 힘을 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
