revisions:
- from: 그러나 사독의 아들들인 레위 제사장들은 이스라엘 자손이 내게서 떠나 잘못된 길로 갔을 때에도 내 성소의 책임을 지켰으므로 — 그들은 내게 가까이 나아와 나를 섬기고, 내 앞에 서서 내게 기름과 피를 바칠 것입니다. 주 여호와의 말씀이니라.[a][b][c]
  to: 그러나 사독의 아들들, 곧 레위 제사장들은 이스라엘 자손들이 나를 떠나 길을 잃었을 때에 내 성소의 직무를 지켰던 이들입니다.[a] 그들은 내게 가까이 나아와 나를 섬기고, 내 앞에 서서 내게 기름[b]과 피를 바칠 것입니다. 주 야훼[c]의 말씀입니다.
  rationale: The revision removes added concession and causality, clarifies the Hebrew apposition without flattening the lineage term, uses a more natural Korean rendering for the sanctuary duty, relocates notes to their relevant words, replaces the defective footnote c, and applies the supplied POB policy of rendering יהוה as ‘야훼.’
