id: EZK.44.15
reference: Ezekiel 44:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם בְּנֵ֣י צָד֗וֹק אֲשֶׁ֨ר שָׁמְר֜וּ אֶת מִשְׁמֶ֤רֶת מִקְדָּשִׁ/י֙ בִּ/תְע֤וֹת בְּנֵֽי יִשְׂרָאֵל֙ מֵֽ/עָלַ֔/י הֵ֛מָּה יִקְרְב֥וּ אֵלַ֖/י לְ/שָֽׁרְתֵ֑/נִי וְ/עָמְד֣וּ לְ/פָנַ֗/י לְ/הַקְרִ֥יב לִ/י֙ חֵ֣לֶב וָ/דָ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/015.yaml
  text: But the Levitical priests[a], the sons of Zadok, who kept the charge of my sanctuary when the sons of Israel went astray from me—they shall come near to me to minister to me, and they shall stand before me to offer to me fat and blood[c][b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'the priests, the Levites.' The Hebrew can be read appositionally rather than as the smoother English phrase 'Levitical priests.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the people of Israel' or 'the Israelites' for 'the sons of Israel.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the Lord YHWH'; English convention renders this as 'the Lord GOD' to avoid 'Lord LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 사독의 아들들, 곧 레위 제사장들은 이스라엘 자손들이 나를 떠나 길을 잃었을 때에 내 성소의 직무를 지켰던 이들입니다.[a] 그들은 내게 가까이 나아와 나를 섬기고, 내 앞에 서서 내게 기름[b]과 피를 바칠 것입니다. 주 야훼[c]의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘레위 제사장들’은 히브리어 표현을 자연스럽게 옮긴 것입니다. 직역하면 ‘제사장들, 곧 레위인들’로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기름’은 희생 제사에서 바쳐지는 기름을 가리킵니다.
    reason: source_note
  - marker: c
    text: 히브리어는 ‘주 야훼’(אַדֹנָי יְהוִה)입니다. ‘야훼’는 하나님의 고유한 이름인 יהוה를 옮긴 것입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וְהַכֹּהֲנִים הַלְוִיִּם
  english_pob_choice: But the Levitical priests
  chosen_korean: 레위 제사장들
  alternatives_korean:
  - 레위인 제사장들
  - 제사장들, 곧 레위인들
  lexicon: HALOT
  rationale: 사독의 아들들과 대비되는 제사장 집단을 가리키므로, 한국어에서는 자연스럽게 ‘레위 제사장들’로 옮겨 제사장직과 레위 계통을 함께 드러냈습니다.
- source_word: שָׁמְרוּ אֶת מִשְׁמֶרֶת מִקְדָּשִׁי
  english_pob_choice: kept the charge of my sanctuary
  chosen_korean: 내 성소의 책임을 지켰으므로
  alternatives_korean:
  - 내 성소의 직무를 지켰으므로
  - 내 성소의 경계를 지켰으므로
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת는 단순한 ‘지킴’보다 맡겨진 직무·책임의 뉘앙스가 강해, 성소 봉사와 관련된 기술적 의미를 살려 ‘책임’으로 옮겼습니다.
- source_word: הֵמָּה יִקְרְבוּ אֵלַי לְשָׁרְתֵנִי וְעָמְדוּ לְפָנַי
  english_pob_choice: they shall come near to me to minister to me, and they shall stand before me
  chosen_korean: 그들은 내게 가까이 나아와 나를 섬기고, 내 앞에 서서
  alternatives_korean:
  - 그들은 내게 가까이 와서 나를 섬기며, 내 앞에 서서
  - 그들은 내게 접근하여 나를 섬기고, 내 앞에 서서
  lexicon: HALOT
  rationale: 제의적 접근과 봉사의 순서를 살려 ‘가까이 나아와’와 ‘내 앞에 서서’를 유지했고, לְשָׁרְתֵנִי는 예배 맥락의 ‘섬기다’로 옮겼습니다.
- source_word: לְהַקְרִיב לִי חֵלֶב וָדָם
  english_pob_choice: to offer to me fat and blood
  chosen_korean: 내게 기름과 피를 바칠 것입니다
  alternatives_korean:
  - 내게 제물의 기름과 피를 드릴 것입니다
  - 내게 기름과 피를 제사로 바칠 것입니다
  lexicon: HALOT
  rationale: חֵלֶב은 희생제의 ‘기름’으로, וָדָם은 그대로 ‘피’로 옮겨 제의적 희생의 핵심 요소를 드러냈습니다. ‘바치다’는 제의적 헌납을 자연스럽게 표현합니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 여호와의 말씀이니라
  alternatives_korean:
  - 주 하나님 여호와의 말씀이니라
  - 주 야훼의 말씀이니라
  lexicon: HALOT
  rationale: 예언 선언 공식인 נְאֻם을 ‘말씀이니라’로 옮기고, אֲדֹנָי יְהוִה는 한국어 교회용어의 관례에 따라 ‘주 여호와’로 처리했습니다.
theological_decisions:
- issue: 사독의 아들들만 성소 봉사에 가까이 나아오는 제의적 특권의 보존
  chosen_reading: 본문의 대비를 살려, 배교한 레위인들과 구별되는 사독 계열 제사장만이 하나님께 가까이 나아가 봉사하는 것으로 옮겼습니다.
  alternative_readings:
  - 사독 자손의 특별한 성직 권한으로 완화해 읽는 해석
  - 단순히 성전 업무 분담으로 중화하는 해석
  rationale: 문맥상 이는 단순 행정 분담이 아니라 언약적·제의적 접근 권한의 구별을 말하므로, ‘가까이 나아오다’와 ‘내 앞에 서다’를 유지해 긴장을 보존했습니다.
  doctrine_reference: Ezekiel 44 문맥의 성소 접근 규정
