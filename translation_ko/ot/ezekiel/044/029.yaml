revisions:
- from: 그들은 소제물과 속죄제와 속건제를 먹을 것입니다. 이스라엘의 모든 ḥerem도 그들에게 속할 것입니다.[a][b]
  to: 그들은 소제와 속죄제[a]와 속건제를 먹을 것입니다. 이스라엘에서 온전히 바쳐진 모든 것은 그들의 것이 될 것입니다.[b]
  rationale: 제사장 몫을 규정하는 문맥과 원문의 법적 소유 표현을 유지했습니다. חֵרֶם을 전쟁 맥락의 ‘진멸된 것’으로 본문에 한정하지 않고, 이 문맥에 맞는 ‘온전히 바쳐진 것’으로 번역하되 의미 범위는 각주에서 보존했습니다. 각주 표지는 해당 어휘 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
