source:
  edition: WLC
  text: הַ/מִּנְחָה֙ וְ/הַ/חַטָּ֣את וְ/הָ/אָשָׁ֔ם הֵ֖מָּה יֹֽאכְל֑וּ/ם וְ/כָל חֵ֥רֶם בְּ/יִשְׂרָאֵ֖ל לָ/הֶ֥ם יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/029.yaml
  text: They shall eat the grain offering[a], the sin offering, and the guilt offering[b], and every devoted thing in Israel shall be theirs.
  footnotes:
  - marker: a
    text: Or 'the purification offering' for 'the sin offering.'
    reason: lexical_alternative
  - marker: b
    text: '''Devoted thing'' translates Hebrew ḥerem, something irrevocably set apart to God; in other contexts the term can carry the sense ''devoted to destruction.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 소제물과 속죄제와 속건제를 먹을 것입니다. 이스라엘의 모든 ḥerem도 그들에게 속할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소제물’은 제의 문맥에서 מִנְחָה를 가리키는 표준적인 옮김입니다.
    reason: source_note
  - marker: b
    text: ḥerem은 하나님께 돌려진 것으로, 문맥에 따라 ‘진멸된 것’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  english_pob_choice: the grain offering
  chosen_korean: 소제물
  alternatives_korean:
  - 곡식제물
  - 곡식 예물
  lexicon: HALOT
  rationale: 문맥이 제사장 몫을 말하는 제의 규정이므로, פְּרִי스트리 제사 용어인 소제물로 옮겨 본문이 가리키는 제의 범주를 살렸습니다.
- source_word: הַחַטָּאת
  english_pob_choice: the sin offering
  chosen_korean: 속죄제
  alternatives_korean:
  - 죄제
  - 정결제물
  lexicon: HALOT
  rationale: 연속된 제사 목록에서 חַטָּאת는 죄와 관련된 제사 명칭으로 기능하므로, 한국어 성경에서 널리 쓰이는 속죄제를 채택했습니다.
- source_word: הָאָשָׁם
  english_pob_choice: the guilt offering
  chosen_korean: 속건제
  alternatives_korean:
  - 유죄제
  - 배상제
  lexicon: HALOT
  rationale: אָשָׁם은 죄책/책임을 다루는 제사로, 전통적이면서도 기능을 드러내는 속건제가 가장 자연스럽습니다.
- source_word: חֵרֶם
  english_pob_choice: every devoted thing
  chosen_korean: ḥerem
  alternatives_korean:
  - 바친 것
  - 바쳐 구별된 것
  - 진멸된 것
  lexicon: HALOT
  rationale: 이 구절의 관심은 전쟁의 ‘진멸’이 아니라 하나님께 돌려진 소유 규정입니다. 한국어 본문에서는 의미를 단정해 풀기보다 원어 음역을 유지하고, 용례가 넓은 전문어임을 주석으로 드러냈습니다.
theological_decisions:
- issue: חֵרֶם의 의미 범위
  chosen_reading: 본문에는 ‘ḥerem’으로 음역하고, 그 성격을 주석 없이 ‘모든 ḥerem’으로만 남겨 제의적 소유 규정을 보존했습니다.
  alternative_readings:
  - 진멸된 것
  - 바쳐진 것
  rationale: 이 절은 제사장에게 돌아가는 몫을 열거하는 맥락이므로, 전쟁 맥락의 ‘진멸’ 의미를 본문에 밀어 넣으면 문맥을 왜곡합니다. 동시에 ‘바쳐진 것’으로 단정하면 해석을 좁힐 수 있어, 원문의 긴장을 보존하는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
