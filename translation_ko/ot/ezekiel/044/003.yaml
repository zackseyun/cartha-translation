id: EZK.44.3
reference: Ezekiel 44:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶֽת הַ/נָּשִׂ֗יא נָ֥שִׂיא ה֛וּא יֵֽשֶׁב בּ֥/וֹ לֶ/אֱכָול לֶ֖חֶם לִ/פְנֵ֣י יְהוָ֑ה מִ/דֶּ֨רֶךְ אֻלָ֤ם הַ/שַּׁ֨עַר֙ יָב֔וֹא וּ/מִ/דַּרְכּ֖/וֹ יֵצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/003.yaml
  text: As for the prince[a], because he is the prince, he may sit in it to eat bread before Yahweh. He shall enter by way of the porch of the gate, and shall go out by the same way.
  footnotes:
  - marker: a
    text: Or, 'he shall go out by the way he came in.' The Hebrew literally says, 'from his way he shall go out,' likely meaning the same route just mentioned.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 군주[a]에 관해서는, 그가 군주이므로 그 안에 앉아 야훼 앞에서 떡을 먹을 수 있습니다. 그는 문 문의 현관으로 들어가고, 같은 길로 나가야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘군주’는 특별한 권한을 가진 통치자를 가리키지만, 이 구절만으로 그 정체를 단정하지는 않습니다.
    reason: theological_note
lexical_decisions:
- source_word: אֶת הַנָּשִׂיא / נָשִׂיא
  english_pob_choice: the prince
  chosen_korean: 군주
  alternatives_korean:
  - 왕자
  - 지도자
  - 통치자
  lexicon: HALOT
  rationale: 에스겔의 문맥에서 נָשִׂיא는 특정한 통치자/수장을 가리키므로, 일반적인 ‘지도자’보다 지위가 드러나는 ‘군주’가 적절합니다. 다만 메시아로 단정하지 않도록 중립성을 유지했습니다.
- source_word: נָשִׂיא הוּא
  english_pob_choice: because he is the prince
  chosen_korean: 그가 군주이므로
  alternatives_korean:
  - 그가 바로 군주이므로
  - 군주이기 때문에
  lexicon: HALOT
  rationale: 반복과 대명사가 주는 이유·강조를 한국어에서는 인과 표현으로 자연스럽게 살렸습니다. 단순 서술보다 예외 허용의 근거가 분명해집니다.
- source_word: לֶאֱכָל לֶחֶם
  english_pob_choice: to eat bread
  chosen_korean: 떡을 먹을 수 있습니다
  alternatives_korean:
  - 빵을 먹을 수 있습니다
  - 식을 들 수 있습니다
  lexicon: HALOT
  rationale: 히브리어 직역상 ‘떡/빵을 먹다’이지만, 한국어에서는 식사를 뜻하는 관용이므로 문맥을 해치지 않게 ‘떡을 먹다’를 유지했습니다. 다만 ‘bread’의 직설성을 보존하기 위해 과도한 의역은 피했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 여호와 앞에서
  - 주님 앞에서
  lexicon: Transliteration policy
  rationale: 프로젝트 기본값에 따라 יהוה는 학술적 음역인 ‘야훼’로 옮겼습니다. 예배·제의적 공간감은 ‘앞에서’가 가장 직접적으로 전달합니다.
- source_word: מִדֶּרֶךְ אֻלָם הַשַּׁעַר
  english_pob_choice: by way of the porch of the gate
  chosen_korean: 문 문의 현관으로
  alternatives_korean:
  - 문 문의 현관을 통해
  - 문 현관으로
  lexicon: HALOT
  rationale: אֻלָם은 성문 구조의 ‘현관/주랑’이므로 ‘현관’으로 옮겼습니다. ‘문 문의’는 원문의 성문-현관 관계를 드러내기 위한 직설적 보존입니다.
- source_word: וּמִדַּרְכּוֹ יֵצֵא
  english_pob_choice: and shall go out by the same way
  chosen_korean: 같은 길로 나가야 합니다
  alternatives_korean:
  - 자기가 들어온 길로 나가야 합니다
  - 그와 같은 길로 나가야 합니다
  lexicon: HALOT
  rationale: 마지막 구는 동일 경로로 나가는 절차적 대칭을 뜻하므로 ‘같은 길’로 간명하게 살렸습니다. 영어 POB가 암시한 동일 경로 해석을 자연스럽게 반영했습니다.
theological_decisions:
- issue: נָשִׂיא의 신분을 어떻게 제시할 것인가
  chosen_reading: ‘군주’로 옮기되 메시아적 해석을 주석 없이 본문에 넣지 않았습니다.
  alternative_readings:
  - 메시아
  - 통치자
  rationale: 본문 자체는 특권을 가진 נָשִׂיא를 말하지만, 그 정체를 이 구절만으로 확정하지는 않습니다. 번역은 본문의 기능을 드러내면서도 해석 논쟁을 앞서 결론내리지 않도록 중립을 유지했습니다.
  doctrine_reference: Translation philosophy §3; Ezekiel temple vision interpretation
