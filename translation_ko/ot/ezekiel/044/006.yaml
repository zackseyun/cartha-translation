translation:
  language: ko
  text: 그리고 너는 반역한 자[a], 곧 이스라엘 집에게 말하십시오. ‘주 야훼께서 이렇게 말씀하십니다. 이스라엘 집아, 너희의 모든 가증한 일은 이제 그만이다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘반역한 자’를 뜻합니다. 이 명사는 ‘반역’으로도, 문맥상 이스라엘 공동체 전체를 가리키는 집합적 호칭으로도 이해될 수 있습니다.
    reason: lexical_alternative
