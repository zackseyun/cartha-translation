  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘의 집
  - 이스라엘 가문
  lexicon: HALOT
  rationale: 언약적·민족적 호칭을 직역에 가깝게 유지해 반복되는 에스겔의 공식 표현과 신학적 울림을 살렸습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와
  - 주 하나님이
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 공식 호칭의 위계를 한국어에서 자연스럽게 드러내기 위해 '주 하나님'으로 옮겼습니다. 다만 본 절은 이미 기존 POB의 영어 аудिट에서 'the Lord GOD'을 사용하고 있어, 본문은 합쇼체에 맞게 압축했습니다.
- source_word: רַב לָכֶם
  english_pob_choice: Enough
  chosen_korean: 이제 충분하다
  alternatives_korean:
  - 그만하면 충분하다
  - 그만두어도 된다
  - 이제 그만이다
  lexicon: HALOT
  rationale: 관용구의 핵심은 '더 이상 지속해서는 안 됨'이므로, 한국어에서는 판단·경고의 뉘앙스를 살려 자연스럽게 번역했습니다.
- source_word: תּוֹעֲבוֹתֵיכֶם
  english_pob_choice: abominations
  chosen_korean: 너희의 모든 가증한 일
  alternatives_korean:
  - 너희의 모든 가증한 것들
  - 너희의 모든 혐오스러운 일
  - 너희의 모든 역겨운 일
  lexicon: HALOT
  rationale: 에스겔의 정결·우상숭배 문맥에서 תּוֹעֵבָה의 강한 도덕적·제의적 혐오를 유지하기 위해 '가증한 일'을 택했습니다.
theological_decisions:
