translation:
  language: ko
  text: 그리고 네가 반역한 자들아, 이스라엘 집에게 말하여라. 주 하나님께서 이렇게 말씀하신다. “이스라엘 집아, 너희의 모든 가증한 일로는 이제 충분하다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘반역하는 자/반역’의 뜻이며, 문맥상 이스라엘 공동체 전체를 가리키는 집합적 호칭으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרִי
  english_pob_choice: the rebellious house
  chosen_korean: 네가 반역한 자들
  alternatives_korean:
  - 반역의 집
  - 반역한 사람들
  - 반역한 자
  lexicon: HALOT
  rationale: 히브리어는 단수 명사이지만 문맥상 이스라엘 전체를 집합적으로 부르는 표현이므로, 한국어에서는 직접 호격으로 풀어 집합적 반역의 성격을 살렸습니다.
- source_word: בֵּית יִשְׂרָאֵל
