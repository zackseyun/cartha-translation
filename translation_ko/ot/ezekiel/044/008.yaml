id: EZK.44.8
reference: Ezekiel 44:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֥א שְׁמַרְתֶּ֖ם מִשְׁמֶ֣רֶת קָדָשָׁ֑/י וַ/תְּשִׂימ֗וּ/ן לְ/שֹׁמְרֵ֧י מִשְׁמַרְתִּ֛/י בְּ/מִקְדָּשִׁ֖/י לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/008.yaml
  text: You have not kept charge of my holy things[a], but have appointed others to keep charge in my sanctuary for you.
  footnotes:
  - marker: a
    text: Or 'instead of you,' highlighting that others were appointed to perform the sanctuary charge in your place.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 내 거룩한 것들을 지키지 않았고, 내 성소에서 너희를 위해 내 직무를 지키는 다른 이들을 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 대신’ — 다른 이들이 너희 자리를 대신하여 성소 직무를 수행했다는 뜻을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַרְתֶּם / מִשְׁמֶרֶת
  english_pob_choice: have kept charge
  chosen_korean: 지키지 않았고
  alternatives_korean:
  - 맡은 책임을 지키지 않았고
  - 직무를 지키지 않았고
  - 충실히 수행하지 않았고
  lexicon: HALOT
  rationale: שׁמר과 מִשְׁמֶרֶת의 결합은 단순한 보호보다 맡겨진 성소 직무를 충실히 수행하는 뜻이므로, 한국어에서는 자연스럽게 ‘지키다’로 옮기되 문맥상 책임 수행의 뉘앙스를 살렸습니다.
- source_word: קָדָשַׁי
  english_pob_choice: my holy things
  chosen_korean: 내 거룩한 것들
  alternatives_korean:
  - 내 거룩한 일들
  - 내 거룩한 것
  - 내 성물들
  lexicon: HALOT
  rationale: קָדָשַׁי는 성소의 물건만이 아니라 거룩하게 구별된 모든 사역과 사물까지 아우를 수 있으므로, 범위를 좁히지 않는 ‘거룩한 것들’을 선택했습니다.
- source_word: וַתְּשִׂימוּן לְשֹׁמְרֵי מִשְׁמַרְתִּי
  english_pob_choice: have appointed others to keep charge
  chosen_korean: 내 직무를 지키는 다른 이들을 세웠습니다
  alternatives_korean:
  - 내 직무를 맡는 다른 이들을 세웠습니다
  - 다른 이들을 세워 내 직무를 맡게 했습니다
  - 내 직무를 지키는 자들을 임명했습니다
  lexicon: HALOT
  rationale: שׂים은 ‘두다/세우다’의 뜻이지만, 인원을 배치하는 행위이므로 ‘세웠습니다’가 가장 자연스럽고, לְשֹׁמְרֵי는 ‘지키는 다른 이들’로 풀어 직무 위임의 기능을 드러냈습니다.
- source_word: בְּמִקְדָּשִׁי
  english_pob_choice: in my sanctuary
  chosen_korean: 내 성소에서
  alternatives_korean:
  - 내 성전에서
  - 내 거룩한 처소에서
  - 내 성소 안에서
  lexicon: HALOT
  rationale: מִקְדָּשׁ는 예언서의 성전 구역을 가리키는 표준적인 ‘성소’가 가장 정확하며, 장소 전치사는 한국어에서 자연스럽게 ‘에서’로 옮겼습니다.
theological_decisions:
- issue: 'לָכֶם의 관계: ‘for you’ vs ‘instead of you’'
  chosen_reading: 본문에는 ‘너희를 위해’로 두고, 대체·대리의 뉘앙스는 본문 흐름이 허용하는 범위 안에서 유지했습니다.
  alternative_readings:
  - 너희 대신
  - 너희를 대신하여
  - 너희를 위하여
  rationale: 히브리어 전치사 לָכֶם은 ‘너희를 위해/너희에게’와 ‘너희 대신’의 여지를 모두 가지지만, 본문 본문은 성소 직무의 위임을 직접적으로 말하므로 본문에는 과도한 해석을 넣지 않고, 대리 뉘앙스는 문맥상 암시로 남겨 두는 편이 가장 안전합니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it.
