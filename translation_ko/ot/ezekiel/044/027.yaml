  text: וּ/בְ/יוֹם֩ בֹּא֨/וֹ אֶל הַ/קֹּ֜דֶשׁ אֶל הֶ/חָצֵ֤ר הַ/פְּנִימִית֙ לְ/שָׁרֵ֣ת בַּ/קֹּ֔דֶשׁ יַקְרִ֖יב חַטָּאת֑/וֹ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/027.yaml
  text: And on the day he enters the sanctuary[a], into the inner court, to minister in the sanctuary, he shall present his sin offering, declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'his purification offering.' The Hebrew חַטָּאת in sacrificial contexts can denote the offering for sin/purification.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 성소로, 곧 안뜰로 들어가서 성소에서 섬기는 날에는 자기 속죄제를 드려야 합니다. 주 하나님께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 정결제를 드려야 합니다’. 히브리어 חַטָּאת은 제의 문맥에서 죄를 위한 제물 또는 정결을 위한 제물을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם בֹּאוֹ
  english_pob_choice: And on the day he enters
  chosen_korean: 그가 … 들어가는 날에는
  alternatives_korean:
  - 그가 들어오는 날에는
  - 들어갈 때에는
  lexicon: HALOT
  rationale: Hebrew temporal expression with infinitive plus suffix is rendered naturally as a Korean time clause while preserving the specific ‘on the day’ force.
- source_word: אֶל הַקֹּדֶשׁ אֶל הֶחָצֵר הַפְּנִימִית
  english_pob_choice: the sanctuary, into the inner court
  chosen_korean: 성소로, 곧 안뜰로
  alternatives_korean:
  - 성소로, 내실 뜰로
  - 거룩한 곳으로, 안뜰로
  lexicon: HALOT
  rationale: The repeated directional preposition is reflected by a movement phrase plus appositional ‘곧’ to show the inner court as a further specification of the sanctuary destination.
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  english_pob_choice: to minister in the sanctuary
  chosen_korean: 성소에서 섬기는
  alternatives_korean:
  - 성소에서 봉사하는
  - 거룩한 곳에서 섬기는
  lexicon: HALOT
  rationale: In priestly context שׁרת denotes cultic service; ‘섬기다’ preserves that liturgical sense without over-formalizing into ecclesiastical terminology.
- source_word: יַקְרִיב חַטָּאתוֹ
  english_pob_choice: he shall present his sin offering
  chosen_korean: 자기 속죄제를 드려야 합니다
  alternatives_korean:
  - 자기 속죄제를 바쳐야 합니다
  - 자기 죄제물을 드려야 합니다
  lexicon: HALOT
  rationale: חַטָּאת in sacrificial usage can denote the purification/sin offering; ‘속죄제’ is a source-direct Korean cultic term and ‘드리다’ fits sacrificial presentation.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님께서 말씀하십니다
  alternatives_korean:
  - 주 여호와께서 말씀하십니다
  - 주 하나님의 말씀입니다
  lexicon: HALOT
  rationale: The solemn oracle formula is rendered with a declarative speech tag in modern Korean; the divine title is kept as ‘주 하나님’ to reflect the compounded אֲדֹנָי יְהוִה without awkward repetition.
theological_decisions:
- issue: Rendering of חַטָּאת in sacrificial context
  chosen_reading: 속죄제
  alternative_readings:
  - 죄제
  - 정결제
  rationale: The verse regulates priestly entry and sacrifice, so the offering sense is primary; ‘속죄제’ preserves the cultic category while acknowledging the purification dimension in a source note rather than flattening it.
  doctrine_reference: Levitical sacrificial terminology; source note on חַטָּאת
- issue: Compound divine title אֲדֹנָי יְהוִה
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 여호와
  - 주 LORD
  rationale: Korean readability and reverence are best served by ‘주 하나님,’ which conveys the doubled divine title without producing an unnatural repetition in modern Korean.
  doctrine_reference: Divine-name rendering policy for compound אֲדֹנָי יְהוִה
