  text: כִּ֣י אִם הַ/לְוִיִּ֗ם אֲשֶׁ֤ר רָֽחֲקוּ֙ מֵֽ/עָלַ֔/י בִּ/תְע֤וֹת יִשְׂרָאֵל֙ אֲשֶׁ֣ר תָּע֣וּ מֵֽ/עָלַ֔/י אַחֲרֵ֖י גִּלּֽוּלֵי/הֶ֑ם וְ/נָשְׂא֖וּ עֲוֺנָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/010.yaml
  text: But the Levites who went far from me when Israel went astray[a], who went astray from me after their idols, shall bear their iniquity.
  footnotes:
  - marker: a
    text: Or, 'shall bear their iniquity' or 'shall bear their guilt.' The Hebrew idiom includes both culpability and the penalty that follows from it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이스라엘이 길을 잃던 때에 나에게서 멀어졌으며, 그들의 우상들을 따라 나에게서 길을 잃은 레위인들은 자기들의 죄악을 담당해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기들의 죄악을 담당하다’라는 히브리어 관용구는 그들의 죄책을 지는 것과 그 죄에 따르는 결과를 받는 것을 모두 가리킬 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  - 오직
  lexicon: HALOT
  rationale: 앞절의 제한에 대한 대비적 예외를 자연스러운 현대 한국어로 살리기 위해 ‘그러나’를 택했습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위인들
  alternatives_korean:
  - 레위 사람들
  - 레위 지파 사람들
  lexicon: HALOT
  rationale: 히브리어가 제사장 일반이 아니라 레위인을 직접 지칭하므로, 표준적인 성서 용례인 ‘레위인들’로 옮겼습니다.
- source_word: רָחֲקוּ מֵעָלַי / אַחֲרֵי גִּלּוּלֵיהֶם
  english_pob_choice: went far from me / after their idols
  chosen_korean: 나에게서 멀어진 / 그들의 우상들을 따라 나에게서 멀어진
  alternatives_korean:
  - 나에게서 떠난
  - 나에게서 멀리 간
  - 그들의 우상 뒤를 따른
  lexicon: HALOT
  rationale: ‘멀어지다’는 관계적 소원함을, ‘우상들을 따라’는 אַחֲרֵי의 추종적 뉘앙스를 함께 살려 반복 구조를 유지했습니다.
- source_word: וְנָשְׂאוּ עֲוֺנָם
  english_pob_choice: shall bear their iniquity
  chosen_korean: 자기의 죄악을 담당해야 합니다
  alternatives_korean:
  - 자기의 죄악을 져야 합니다
  - 자기의 죄를 담당해야 합니다
  - 자기의 죄책을 져야 합니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 죄책과 그 결과를 함께 가리키므로, POB의 ‘bear their iniquity’에 맞추어 ‘담당하다’로 옮기되 결과적 책임의 무게를 살렸습니다.
theological_decisions:
- issue: עָוֺן / וְנָשְׂאוּ עֲוֺנָם의 의미 범위
  chosen_reading: ‘죄악을 담당해야 합니다’로 옮겨, 단순한 내적 죄책만이 아니라 그에 따르는 책임과 징계를 함께 드러냈습니다.
  alternative_readings:
  - ‘죄악을 져야 합니다’
  - ‘죄책을 져야 합니다’
  - ‘벌을 받아야 합니다’
  rationale: 본문은 레위인들의 제사장적 특권 배제가 심판의 맥락에 있으므로, POB의 주석처럼 죄책과 그 결과를 함께 보이되 한국어에서는 ‘담당하다’가 가장 직접적으로 그 관용구를 전달합니다.
  doctrine_reference: 번역 철학 §1, §5
