revisions:
- from: 그러나 이스라엘이 잘못된 길로 갈 때 나에게서 멀어진 레위인들, 곧 그들의 우상들을 따라 나에게서 멀어진 레위인들은 자기의 죄악을 담당해야 합니다.[a]
  to: 그러나 이스라엘이 길을 잃던 때에 나에게서 멀어졌으며, 그들의 우상들을 따라 나에게서 길을 잃은 레위인들은 자기들의 죄악을 담당해야 합니다.[a]
  rationale: 두 히브리어 동사를 구별하여 רחק는 ‘멀어지다’로, 반복되는 תעה는 ‘길을 잃다’로 옮겼습니다. 이로써 이스라엘과 레위인들의 일탈을 연결하는 원문의 반복을 보존했습니다. 주어 반복을 제거하여 현대 한국어 문장으로 자연스럽게 다듬었고, 마지막 관용구는 죄책과 그 결과 사이의 해석상 열린 범위를 본문과 각주에서 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:44:53Z'
review_pass:
  verdict: revise
  source_fidelity: 대체로 충실하지만, 초안은 두 번째 תעוּ(‘길을 잃다/빗나가다’)를 다시 ‘멀어진’으로 옮겨 원문의 동사 구별과 이스라엘의 일탈과 레위인들의 일탈 사이의 반복을 잃었습니다. 또한 ‘곧 … 레위인들은’이라는 중복 구조는 원문에 없는 설명적 동격을 만들고 문장을 부자연스럽게 합니다.
  naturalness: 합쇼체와 성서적 격식은 적절합니다. 다만 주어를 두 번 반복하는 ‘레위인들, 곧 … 레위인들은’은 현대 표준어에서 불필요하게 장황합니다. 상대절을 한 주어에 연결하면 더 자연스럽고 명료합니다.
  terminology: ‘레위인들’, ‘우상들’, ‘죄악을 담당해야 합니다’는 적절합니다. ‘죄악을 담당하다’는 히브리어 관용구의 죄책 및 그 결과라는 열린 의미 범위를 유지하므로 유지할 수 있습니다.
  issues:
  - severity: medium
    issue: 두 번째 ‘나에게서 멀어진’
    rationale: 원문은 첫 절에서 רחק(멀어지다)를, 이어서 תעה(길을 잃다, 빗나가다)를 사용합니다. 초안은 둘 다 ‘멀어지다’로 처리하여 원문의 어휘적 구별과 ‘이스라엘이 길을 잃음/레위인들이 길을 잃음’의 반복을 약화합니다.
  - severity: low
    issue: ‘곧 … 레위인들은’의 중복
    rationale: 히브리어는 한 주어 ‘레위인들’에 두 관계절을 붙입니다. 초안의 동격 표현과 주어 반복은 원문에 없는 재진술이며 문장 흐름을 해칩니다.
