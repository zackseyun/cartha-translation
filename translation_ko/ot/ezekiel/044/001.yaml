source:
  edition: WLC
  text: וַ/יָּ֣שֶׁב אֹתִ֗/י דֶּ֣רֶךְ שַׁ֤עַר הַ/מִּקְדָּשׁ֙ הַֽ/חִיצ֔וֹן הַ/פֹּנֶ֖ה קָדִ֑ים וְ/ה֖וּא סָגֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/001.yaml
  text: Then he brought me back by way of the outer gate of the sanctuary[a], the one facing east, and it was shut.
  footnotes:
  - marker: a
    text: Or 'Then he turned me back by way of the outer gate of the sanctuary.' The Hebrew verb can be rendered more literally as 'turned/returned me,' but the sense is that the guide caused Ezekiel to go back to this gate.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 성소의 바깥문, 곧 동쪽을 향한 문으로 다시 데리고 갔는데, 그 문은 닫혀 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 나를 성소의 바깥문으로 되돌렸습니다.’ 히브리어 동사는 더 문자적으로는 ‘나를 돌이키다/되돌리다’로 옮길 수 있지만, 뜻은 안내자가 에스겔을 그 문으로 다시 가게 한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  english_pob_choice: brought me back
  chosen_korean: 다시 데리고 갔는데
  alternatives_korean:
  - 되돌렸는데
  - 데리고 돌아갔는데
  - 돌려보냈는데
  lexicon: HALOT
  rationale: שוב의 사역적 의미를 살려, 단순한 ‘돌아가다’보다 ‘다시 데리고 가다’가 안내자가 에스겔을 그 문으로 되돌려 보낸 동작을 자연스럽게 나타냅니다.
- source_word: שַׁעַר הַמִּקְדָּשׁ הַחִיצוֹן
  english_pob_choice: the outer gate of the sanctuary
  chosen_korean: 성소의 바깥문
  alternatives_korean:
  - 성전 바깥문
  - 성소 바깥문
  - 성전의 바깥문
  lexicon: HALOT
  rationale: מקדש는 여기서 거룩한 परिसर/성소 영역을 가리키므로 ‘성소’로 옮기고, החיצון은 문의 위치를 대비하는 ‘바깥문’으로 간결하게 반영했습니다.
- source_word: הַפֹּנֶה קָדִים
  english_pob_choice: the one facing east
  chosen_korean: 곧 동쪽을 향한
  alternatives_korean:
  - 동쪽을 바라보는
  - 동쪽을 향해 있는
  - 동쪽을 향한
  lexicon: HALOT
  rationale: 현재분사구는 해당 문의 방향을 특정하므로, ‘곧’으로 동격을 풀어 주고 ‘동쪽을 향한’으로 방향성을 분명히 했습니다.
- source_word: וְהוּא סָגוּר
  english_pob_choice: and it was shut
  chosen_korean: 그 문은 닫혀 있었습니다
  alternatives_korean:
  - 그 문은 잠겨 있었습니다
  - 그리고 그것은 닫혀 있었습니다
  - 그것은 닫혀 있었습니다
  lexicon: HALOT
  rationale: סגור의 상태를 문맥에 맞게 상태동사로 옮겨 ‘닫혀 있었습니다’라고 했고, 문에 대한 지시를 분명히 하기 위해 ‘그 문은’으로 받았습니다.
theological_decisions:
- issue: 닫혀 있는 동쪽 바깥문을 어떻게 전할지
  chosen_reading: 단순한 물리적 상태를 나타내는 서술로 옮기고, 상징적 해석은 본문 자체에 맡겼습니다.
  alternative_readings:
  - 예언적 상징을 암시하는 표현으로 풀어 쓰기
  - ‘닫아 두었습니다’처럼 행위 중심으로 옮기기
  rationale: 히브리어는 문이 ‘닫혀 있는’ 상태를 진술할 뿐이므로, 해석을 덧붙이지 않고 장면의 사실성을 그대로 살리는 것이 소스에 충실합니다.
  doctrine_reference: 본문 관찰 우선 원칙
