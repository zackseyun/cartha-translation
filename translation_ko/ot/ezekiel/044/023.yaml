  text: וְ/אֶת עַמִּ֣/י יוֹר֔וּ בֵּ֥ין קֹ֖דֶשׁ לְ/חֹ֑ל וּ/בֵין טָמֵ֥א לְ/טָה֖וֹר יוֹדִעֻֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/023.yaml
  text: They shall teach my people the difference between the holy and the common[b][a], and make them know the difference between the unclean and the clean.
  footnotes:
  - marker: a
    text: Or 'the holy and the profane.'
    reason: lexical_alternative
  - marker: b
    text: Or 'cause them to discern between the unclean and the clean.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내 백성에게 거룩한 것과 일반적인 것의 차이를 가르치고, 또 부정한 것과 정결한 것의 차이를 알게 해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘일반적인 것’은 여기서 ‘거룩하지 않은 것’, 곧 제의적으로 구별되지 않은 것을 뜻합니다.
    reason: cultural_note
  - marker: b
    text: ‘알게 해야 합니다’는 히브리어의 사역적 의미를 살린 표현으로, 문맥상 ‘분별하게 하다’의 뜻도 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹרוּ
  english_pob_choice: shall teach
  chosen_korean: 가르치고
  alternatives_korean:
  - 교훈할 것이고
  - 교수하고
  lexicon: HALOT
  rationale: 히필형 ירה는 여기서 제사장적 맥락의 ‘가르치다/교훈하다’의 뜻이므로, 현대 한국어에서는 가장 자연스러운 ‘가르치고’로 옮겼습니다.
- source_word: בֵּין קֹדֶשׁ לְחֹל
  english_pob_choice: the difference between the holy and the common
  chosen_korean: 거룩한 것과 일반적인 것의 차이
  alternatives_korean:
  - 거룩한 것과 속된 것의 차이
  - 거룩한 것과 평범한 것의 차이
  - 거룩한 것과 비거룩한 것의 차이
  lexicon: HALOT
  rationale: קֹדֶשׁ/חֹל의 대비를 한국어에서 직접 드러내기 위해 ‘차이’를 살렸고, חֹל은 도덕적 ‘속됨’보다 비거룩한 상태를 나타내는 점을 반영해 ‘일반적인 것’으로 옮겼습니다.
- source_word: טָמֵא / טָהוֹר
  english_pob_choice: unclean / clean
  chosen_korean: 부정한 것과 정결한 것
  alternatives_korean:
  - 더러운 것과 깨끗한 것
  - 부정한 것과 깨끗한 것
  lexicon: HALOT
  rationale: 제의적·율법적 문맥에서 טָמֵא/טָהוֹר는 한국어 성경의 관용을 따르되, 현대어로도 분명한 ‘부정한 것과 정결한 것’이 가장 정확합니다.
- source_word: יוֹדִעֻם
  english_pob_choice: make them know
  chosen_korean: 알게 해야 합니다
  alternatives_korean:
  - 알게 하고
  - 깨닫게 해야 합니다
  lexicon: HALOT
  rationale: 히필의 사역적·원인적 뉘앙스를 한국어에서 자연스럽게 살리기 위해 ‘알게 해야 합니다’로 옮겼습니다.
theological_decisions:
- issue: חֹל의 의미를 ‘profane’로 강하게 윤리화할지 여부
  chosen_reading: ‘일반적인 것’으로 옮겨 거룩/비거룩의 제의적 대비를 유지했습니다.
  alternative_readings:
  - 속된 것
  - 평범한 것
  - 비거룩한 것
  rationale: 이 구절은 거룩함과 정결함을 구분하도록 제사장들이 가르치는 문맥이므로, ‘profane’처럼 적극적 모독의 뉘앙스를 덧씌우기보다 비거룩한 상태를 나타내는 중립적 표현이 더 적절합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
