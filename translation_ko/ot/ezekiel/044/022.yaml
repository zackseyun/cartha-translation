revisions:
- from: 그들은 자신들을 위하여 아내로 과부나 이혼한 여인을 데려와서는 안 됩니다. 다만 이스라엘 집의 씨에서 난 처녀들은 데려올 수 있습니다. 그러나 제사장의 과부가 된 과부는 데려올 수 있습니다.[a]
  to: 그들은 과부나 이혼한 여자를 아내로 맞아서는 안 됩니다. 오직 이스라엘 집안의 후손인 처녀들만 아내로 맞을 수 있습니다. 그러나 제사장의 아내였다가 과부가 된 여자는 아내로 맞을 수 있습니다.[a]
  rationale: 혼인 제한(과부와 이혼한 여자의 금지), 허용되는 대상(이스라엘 집의 후손인 처녀), 그리고 제사장과 관련된 과부의 예외를 모두 유지했습니다. 한국어에서 불필요한 직역과 명사 중복을 바로잡되, 마지막 구절의 직역적 형태와 מִן의 관계적 해석 가능성은 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:45:29Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 법적 제한과 예외는 초안에 보존되어 있습니다. 그러나 ‘이스라엘 집의 씨에서 난’은 히브리어의 혈통 표현을 지나치게 직역하여 현대 한국어에서 부자연스럽습니다. 또한 마지막 절의 ‘제사장의 과부가 된 과부’는 같은 뜻의 명사가 중복되어 의미가 불명료해집니다. ‘제사장의 아내였다가 과부가 된 여자’는 מִכֹּהֵן이 가리키는 관계를 자연스럽게 드러내면서도, 직역상의 여지는 각주로 보존합니다.
  naturalness: ‘자신들을 위하여 아내로 … 데려오다’와 ‘씨에서 난 처녀들’은 현대 표준 한국어의 법규적 문체로 다소 어색합니다. ‘아내로 맞다’, ‘이스라엘 집안의 후손인 처녀들’이 합쇼체 규정 문장에 자연스럽습니다.
  terminology: ‘과부’, ‘이혼한 여자’, ‘처녀’, ‘제사장’은 원문의 법적·사회적 범주를 무리 없이 반영합니다. ‘여자’는 이 문맥에서 법적 혼인 대상의 지칭으로 중립적이며, ‘여인’보다 문장 흐름이 간결합니다.
  issues:
  - severity: medium
    issue: ‘이스라엘 집의 씨에서 난 처녀들’이라는 표현
    rationale: מִזֶּרַע בֵּית־יִשְׂרָאֵל은 이스라엘 집의 혈통/후손을 뜻합니다. ‘씨에서 난’은 현대 한국어에서 어색하고 불필요하게 생물학적으로 들릴 수 있으므로 ‘이스라엘 집안의 후손인’으로 옮기는 것이 정확하고 자연스럽습니다.
  - severity: medium
    issue: ‘제사장의 과부가 된 과부’라는 중복 표현
    rationale: אַלְמָנָה가 반복되는 히브리어의 표현을 한국어에서 그대로 중첩하면 의미가 불명료해집니다. 문맥상 죽은 남편이 제사장이었던 여자를 뜻하므로 이를 본문에서 명확히 하고, 논쟁 가능한 직역은 각주에 남겨야 합니다.
