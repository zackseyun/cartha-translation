id: EZK.44.22
reference: Ezekiel 44:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַלְמָנָה֙ וּ/גְרוּשָׁ֔ה לֹֽא יִקְח֥וּ לָ/הֶ֖ם לְ/נָשִׁ֑ים כִּ֣י אִם בְּתוּלֹ֗ת מִ/זֶּ֨רַע֙ בֵּ֣ית יִשְׂרָאֵ֔ל וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר תִּֽהְיֶ֣ה אַלְמָנָ֔ה מִ/כֹּהֵ֖ן יִקָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/022.yaml
  text: They shall not take for themselves as wives a widow or a divorced woman[a], but only virgins from the offspring of the house of Israel; however, they may take a widow who is the widow of a priest.
  footnotes:
  - marker: a
    text: Or, more literally, 'a widow who became a widow from a priest.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 과부나 이혼한 여자를 아내로 맞아서는 안 됩니다. 오직 이스라엘 집안의 후손인 처녀들만 아내로 맞을 수 있습니다. 그러나 제사장의 아내였다가 과부가 된 여자는 아내로 맞을 수 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘제사장에게서 과부가 된 과부’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַלְמָנָה / גְרוּשָׁה
  english_pob_choice: a widow or a divorced woman
  chosen_korean: 과부나 이혼한 여인
  alternatives_korean:
  - 과부나 이혼녀
  - 과부나 이혼당한 여자
  lexicon: HALOT
  rationale: אַלְמָנָה는 ‘과부’, גְרוּשָׁה는 법적 상태를 드러내는 ‘이혼한 여인’이 자연스럽고 정확합니다.
- source_word: יִקְחוּ לָהֶם לְנָשִׁים
  english_pob_choice: take for themselves as wives
  chosen_korean: 자신들을 위하여 아내로 데려와서는 안 됩니다
  alternatives_korean:
  - 아내로 맞아서는 안 됩니다
  - 결혼해서는 안 됩니다
  lexicon: HALOT
  rationale: 히브리어의 ‘취하다/데려오다’와 ‘아내로’의 결합을 살리되, 한국어로는 금지 규정이 분명하게 들리도록 옮겼습니다.
- source_word: בְּתוּלֹת מִזֶּרַע בֵּית יִשְׂרָאֵל
  english_pob_choice: virgins from the offspring of the house of Israel
  chosen_korean: 이스라엘 집의 씨에서 난 처녀들
  alternatives_korean:
  - 이스라엘 집의 후손인 처녀들
  - 이스라엘 집에서 난 동정녀들
  lexicon: HALOT
  rationale: בְּתוּלוֹת은 ‘처녀들’이고, זֶרַע는 단순한 후손보다 씨/종족 계승의 뉘앙스를 가지므로 ‘씨에서 난’으로 대응했습니다.
- source_word: וְהָאַלְמָנָה אֲשֶׁר תִּהְיֶה אַלְמָנָה מִכֹּהֵן
  english_pob_choice: a widow who is the widow of a priest
  chosen_korean: 제사장의 과부가 된 과부
  alternatives_korean:
  - 제사장의 과부인 과부
  - 제사장에게서 과부가 된 과부
  lexicon: HALOT
  rationale: מִכֹּהֵן의 관계를 ‘제사장의 과부’로 풀어, 죽은 남편이 제사장이었음을 드러냈습니다. 다만 한국어 중복을 줄이기 위해 뒤의 אַלְמָנָה는 한 번만 유지했습니다.
theological_decisions:
- issue: 제사장 결혼 규정의 범위
  chosen_reading: 이 구절을 성전 환상 안의 제사장 규정으로 그대로 옮기고, 일반적 결혼 윤리로 확장하지 않았습니다.
  alternative_readings:
  - 보편적 결혼 금지 규정으로 읽기
  - 완화된 권고로 바꾸기
  rationale: 본문은 에스겔의 제사장 규례 문맥에 속하므로, 제한과 예외를 법적 문장 그대로 보존하는 것이 가장 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
