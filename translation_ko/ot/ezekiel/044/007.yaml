id: EZK.44.7
reference: Ezekiel 44:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/הֲבִיאֲ/כֶ֣ם בְּנֵֽי נֵכָ֗ר עַרְלֵי לֵב֙ וְ/עַרְלֵ֣י בָשָׂ֔ר לִ/הְי֥וֹת בְּ/מִקְדָּשִׁ֖/י לְ/חַלְּל֣/וֹ אֶת בֵּיתִ֑/י בְּ/הַקְרִֽיבְ/כֶ֤ם אֶת לַחְמִ/י֙ חֵ֣לֶב וָ/דָ֔ם וַ/יָּפֵ֨רוּ֙ אֶת בְּרִיתִ֔/י אֶ֖ל כָּל תּוֹעֲבוֹתֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/007.yaml
  text: when you brought in foreigners[a], uncircumcised in heart and uncircumcised in flesh, to be in my sanctuary, to profane it—my house—when you presented my food, the fat and the blood, and they broke my covenant[c][b], along with all your abominations.
  footnotes:
  - marker: a
    text: Or 'sons of a foreign land' / 'foreign sons'; Hebrew literally 'sons of foreignness.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my bread'; in sacrificial context this means God's food offering.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew shifts to 'they broke my covenant,' likely referring to the foreigners just mentioned; some take the sense more generally as continuing the accusation against 'you.'
    reason: alternative_reading
translation:
  language: ko
  text: 너희가 이방인[a]들, 곧 마음에 할례받지 못하고 육체에도 할례받지 못한 자들을 내 성소에 들여와 그것을 더럽혔습니다—내 집을 더럽히기 위해서였습니다—또 너희가 내 음식인 기름과 피를 드렸으며, 그들이 내 언약[c][b]을 깨뜨렸고, 너희의 모든 가증한 일과 더불어 그리하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낯선 땅의 아들들’ / ‘낯선 자들의 아들들’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘낯섦의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘내 빵’입니다. 제사 문맥에서는 하나님의 제의적 음식이라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 여기서 ‘그들이 내 언약을 깨뜨렸다’로 문법이 바뀝니다. 바로 앞의 이방인들을 가리키는 것으로 볼 수도 있고, ‘너희’에 대한 고발이 계속된 것으로 볼 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּהֲבִיאֲכֶם
  english_pob_choice: when you brought in
  chosen_korean: 들여와
  alternatives_korean:
  - 가져와
  - 데려와
  lexicon: HALOT
  rationale: 히필형의 ‘bring in’/‘cause to enter’ 의미를 자연스럽게 살려, 성소 안으로 사람을 들여보내는 행위를 분명히 드러냈습니다.
- source_word: בְּנֵי נֵכָר
  english_pob_choice: foreigners
  chosen_korean: 이방인[a]들
  alternatives_korean:
  - 외국인들
  - 타국 사람들
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 언약 공동체 밖의 ‘타자’라는 의미를 보존하기 위해 ‘이방인들’을 택했습니다. 다만 원문은 문자적으로 ‘낯선 자들의 아들들’입니다.
- source_word: עַרְלֵי לֵב / עַרְלֵי בָשָׂר
  english_pob_choice: uncircumcised in heart / uncircumcised in flesh
  chosen_korean: 마음에 할례받지 못하고 육체에도 할례받지 못한
  alternatives_korean:
  - 마음과 육체에 할례받지 않은
  - 마음이 무할례이고 육체도 무할례인
  lexicon: HALOT
  rationale: 예언서의 관용구를 살리기 위해 ‘할례받지 못한’ 표현을 유지했습니다. ‘마음’과 ‘육체’의 병렬도 그대로 보존했습니다.
- source_word: לְחַלְּלֹו אֶת בֵּיתִי
  english_pob_choice: to profane it—my house—
  chosen_korean: 그것을 더럽혔습니다—내 집을 더럽히기 위해서였습니다—
  alternatives_korean:
  - 내 집을 더럽히려고
  - 내 집인 그것을 더럽혔습니다
  lexicon: HALOT
  rationale: 원문의 목적/결과 뉘앙스를 살리면서, ‘내 집’이 곧 앞의 성소를 재진술한 것임을 한국어의 삽입구로 표시했습니다. 전통적 ‘성전’을 쓰지 않고 ‘내 집’의 신전 은유를 유지했습니다.
- source_word: לַחְמִי
  english_pob_choice: my food
  chosen_korean: 내 음식
  alternatives_korean:
  - 내 빵
  - 내 양식
  lexicon: HALOT
  rationale: 제사 문맥에서 ‘bread’가 하나님께 바쳐지는 제의적 ‘음식’을 뜻하므로, 직역보다 의미를 드러내는 ‘음식’을 택했습니다.
- source_word: חֵלֶב וָדָם
  english_pob_choice: the fat and the blood
  chosen_korean: 기름과 피
  alternatives_korean:
  - 지방과 피
  - 기름기와 피
  lexicon: HALOT
  rationale: 제의적 희생물의 핵심 항목을 한국어 성경 관용에 맞게 간명하게 옮겼습니다.
- source_word: וַיָּפֵרוּ אֶת בְּרִיתִי
  english_pob_choice: and they broke my covenant
  chosen_korean: 그들이 내 언약[c][b]을 깨뜨렸고
  alternatives_korean:
  - 그들이 내 언약을 어겼고
  - 그들이 내 언약을 파기했고
  lexicon: HALOT
  rationale: ‘언약을 깨뜨리다’는 히브리어 관용구를 자연스럽게 살렸습니다. 주어가 문법상 직전의 ‘그들’(이방인들)로 바뀌는 긴장을 그대로 반영했습니다.
- source_word: אֶל כָּל תּוֹעֲבוֹתֵיכֶם
  english_pob_choice: along with all your abominations
  chosen_korean: 너희의 모든 가증한 일과 더불어
  alternatives_korean:
  - 너희의 모든 가증한 일에 더하여
  - 너희의 모든 가증한 일과 함께
  lexicon: HALOT
  rationale: אֶל의 덧붙임/추가 의미를 살려, 죄목이 누적되는 어조를 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘성소를 더럽혔다’와 ‘내 집’을 병치하는 구조
  chosen_reading: ‘그것’은 앞의 ‘내 성소’를 가리키고, ‘내 집’은 그 성소를 다시 풀어 설명하는 삽입적 재진술로 읽었습니다.
  alternative_readings:
  - ‘그것’이 뒤의 ‘내 집’을 가리킨다고 볼 수 있습니다
  - ‘내 집’을 별개의 대상로 읽을 수 있습니다
  rationale: 히브리어의 인칭대명사와 명사구의 근접 구조를 보존하는 편이 원문 긴장을 가장 잘 드러냅니다. 한국어에서는 대시로 재진술 관계를 표시했습니다.
  doctrine_reference: Translation philosophy §3 — 원문이 만든 긴장을 해소하지 않고 보존
