    rationale: 히브리어에서 ‘기름과 피’는 ‘내 음식’의 제의적 내용을 구체화합니다. ‘내 음식, 곧 기름과 피’가 이 관계를 더 정확히 드러냅니다.
  revised_text: 너희가 이방인[a]들, 곧 마음에는 할례를 받지 않고 육체에는 할례를 받지 않은 자들을 내 성소에 있게 하여 그것, 곧 내 집을 더럽히고, 너희가 내 음식[b], 곧 기름과 피를 드릴 때에, 그들이 내 언약[c]을 깨뜨렸습니다. 이는 너희의 모든 가증한 일에 더한 것입니다.
