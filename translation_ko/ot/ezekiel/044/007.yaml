review_pass:
  verdict: revise
  source_fidelity: 초안은 בַּהֲבִיאֲכֶם와 בְּהַקְרִיבְכֶם의 시간적 부정사구를 각각 이미 일어난 서술과 목적절로 바꾸어, 원문의 ‘너희가 … 들여오고/드릴 때에’ 구조를 충분히 보존하지 못합니다. 또한 לְחַלְּלוֹ אֶת־בֵּיתִי는 ‘그것, 곧 내 집’을 더럽히는 구조인데, 초안은 ‘더럽혔습니다—… 위해서였습니다’로 문법 관계를 뒤집었습니다. 수정문은 이 관계와 3인칭 복수 ‘그들이’의 문법 전환을 유지합니다.
  naturalness: 수정문은 현대 표준어 합쇼체로, 긴 히브리어 문장의 종속 관계를 ‘-고, -때에’로 자연스럽게 연결합니다. ‘그것, 곧 내 집’은 원문의 대명사와 뒤따르는 명사구의 긴밀한 관계를 표시하는 데 필요한 최소한의 보존적 표현입니다.
  terminology: ‘이방인’, ‘할례’, ‘성소’, ‘내 집’, ‘언약’, ‘가증한 일’은 예언서·제의 문맥에 적합합니다. לַחְמִי의 의미역은 ‘내 음식’으로 옮기되, ‘기름과 피’가 그 내용을 이룬다는 점을 ‘곧’으로 밝혔습니다. ‘기름’은 제의 문맥의 חֵלֶב에 대한 한국어 성경의 관용적 대응입니다.
  issues:
  - severity: high
    issue: 시간적 부정사구가 완료 서술 및 목적절로 변경됨
    rationale: ‘들여와 그것을 더럽혔습니다—… 더럽히기 위해서였습니다—’는 원문의 ‘들여와 … 더럽히고, … 드릴 때에’라는 연속적 종속 구조를 ‘이미 더럽혔다’와 ‘그 목적이었다’로 바꿉니다.
  - severity: high
    issue: ‘그것—내 집’의 문법 관계가 왜곡됨
    rationale: לְחַלְּלוֹ אֶת־בֵּיתִי에서 남성 단수 목적어 접미사와 뒤따르는 ‘내 집’은 같은 성소를 가리키는 긴밀한 표현입니다. 초안의 대시 삽입문은 이를 별도의 목적 설명으로 처리합니다.
  - severity: medium
    issue: 각주 b의 앵커가 ‘내 음식’이 아니라 ‘언약’에 붙음
    rationale: 각주 b는 לַחְמִי(문자적으로 ‘내 빵’)에 관한 주석이므로 ‘내 음식’에 붙어야 합니다. 현재 [c][b]는 독자가 b를 ‘언약’ 관련 주석으로 오해하게 합니다.
