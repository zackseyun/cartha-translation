  to: 그들이 바깥뜰로[a], 곧 백성이 있는 바깥뜰로 나갈 때에는, 그들이 직무를 수행할 때 입는 옷을 벗어 거룩한 방들에 두고 다른 옷을 입어야 합니다. 그들의 옷으로 백성을 거룩하게 해서는 안 됩니다.[b]
  rationale: 문장 구조를 한국어 합쇼체 규정문으로 자연스럽게 다듬되, 의복을 벗고 보관한 뒤 다른 옷을 입는 명령과 최종 금지를 분명히 유지했습니다. ‘거룩하게 하다’는 원문의 제의적 의미를 보존하며, 특정 교파적 해석을 덧붙이지 않습니다. 문화 각주와 어휘 각주를 각각 실제 설명 대상에 연결해 각주 앵커를 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
