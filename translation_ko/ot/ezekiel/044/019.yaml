    issue: 각주 표지가 설명 내용과 떨어져 있음
    rationale: 현 초안의 문화 각주는 ‘바깥뜰’의 반복을 설명하지만 표지는 절 끝, 곧 ‘거룩하게 하지’ 뒤에 있습니다. 독자가 주석의 대상을 오해할 수 있으므로 해당 어구 뒤로 옮겨야 합니다.
  - severity: low
    issue: ‘섬길 때 입던 옷’의 시제 뉘앙스
    rationale: מְשָׁרְתִם은 그들이 직무를 수행하는 가운데 입는 옷을 가리킵니다. ‘입던’도 가능하나, ‘직무를 수행할 때 입는’이 현재적·기능적 의미를 더 잘 보존합니다.
