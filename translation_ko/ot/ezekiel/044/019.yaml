review_pass:
  verdict: revise
  source_fidelity: 히브리어의 반복된 ‘바깥뜰’과 ‘백성에게/백성이 있는 곳으로’의 보충 설명, 직무 중 입는 의복을 벗어 거룩한 방들에 두는 순서, 그리고 의복으로 백성을 거룩하게 하지 말라는 결말을 충실히 반영합니다. 다만 초안의 ‘그렇게 해서 … 하지 못하게 해야 합니다’는 원문의 직접적인 금지/목적을 우회적으로 바꾸고, 행위 주체도 다소 흐립니다.
  naturalness: ‘그들이 섬길 때 입던 옷’은 이해되지만 현재의 직무 수행을 나타내는 분사에 비해 과거의 습관적 의복처럼 들릴 수 있습니다. ‘직무를 수행할 때 입는 옷’이 더 정확하고 자연스럽습니다. 마지막 절은 ‘해선 안 됩니다’로 옮기면 합쇼체를 유지하면서도 명료합니다.
  terminology: 성전 문맥에서 חָצֵר는 ‘뜰’, לִשְׁכָה는 ‘방’, קדש 피엘은 ‘거룩하게 하다’로 옮기는 것이 적절합니다. ‘성결하게 하다’ 같은 교회 내부 용어는 필요하지 않습니다. 각주 표지는 설명 대상에 붙여야 하므로, 바깥뜰 반복 설명은 해당 구절에, ‘거룩하게 하다’의 어휘 대안은 최종절에 각각 배치했습니다.
  issues:
  - severity: medium
    issue: 마지막 절의 ‘그렇게 해서 그들의 옷으로 백성을 거룩하게 하지 못하게 해야 합니다’
    rationale: 히브리어는 제사장들이 의복으로 백성을 거룩하게 하지 않게 되는 규정을 제시합니다. ‘하지 못하게 해야 합니다’는 불필요한 우회 표현이며, 누가 막아야 하는지가 흐려집니다.
