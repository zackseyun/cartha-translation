source:
  edition: WLC
  text: וּ֠/בְ/צֵאתָ/ם אֶל הֶ/חָצֵ֨ר הַ/חִיצוֹנָ֜ה אֶל הֶ/חָצֵ֣ר הַ/חִיצוֹנָה֮ אֶל הָ/עָם֒ יִפְשְׁט֣וּ אֶת בִּגְדֵי/הֶ֗ם אֲשֶׁר הֵ֨מָּה֙ מְשָׁרְתִ֣ם בָּ֔/ם וְ/הִנִּ֥יחוּ אוֹתָ֖/ם בְּ/לִֽשְׁכֹ֣ת הַ/קֹּ֑דֶשׁ וְ/לָֽבְשׁוּ֙ בְּגָדִ֣ים אֲחֵרִ֔ים וְ/לֹֽא יְקַדְּשׁ֥וּ אֶת הָ/עָ֖ם בְּ/בִגְדֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/019.yaml
  text: When they go out to the outer court[a], to the outer court where the people are, they shall take off their garments in which they minister and leave them in the holy chambers. Then they shall put on other garments[b], so that they may not make the people holy with their garments.
  footnotes:
  - marker: a
    text: Or 'sanctify the people' or 'consecrate the people' with their garments.
    reason: lexical_alternative
  - marker: b
    text: The repeated 'to the outer court' in Hebrew emphasizes movement from the priestly area into the court accessible to the people.
    reason: cultural_note
translation:
  language: ko
  text: 그들이 바깥뜰로, 곧 백성이 있는 바깥뜰로 나갈 때에는, 그들이 섬길 때 입던 옷을 벗어 거룩한 방들에 두고, 다른 옷을 입어야 합니다. 그렇게 해서 그들의 옷으로 백성을 거룩하게 하지 못하게 해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘바깥뜰’이 반복되어, 제사장 구역에서 백성이 출입하는 구역으로 이동하는 점을 강조합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְצֵאתָם
  english_pob_choice: When they go out
  chosen_korean: 그들이 ... 나갈 때에는
  alternatives_korean:
  - 그들이 ... 나가면
  - 나갈 때
  lexicon: HALOT
  rationale: חשיבת זמן을 나타내는 분사적/부정사적 구문으로 보고, 한국어에서는 자연스러운 시간절로 옮겼습니다.
- source_word: הֶחָצֵר הַחִיצוֹנָה / אֶל הָעָם
  english_pob_choice: the outer court where the people are
  chosen_korean: 바깥뜰로, 곧 백성이 있는 바깥뜰로
  alternatives_korean:
  - 바깥뜰로, 곧 백성이 있는 곳으로
  - 바깥뜰, 곧 백성에게로
  lexicon: HALOT
  rationale: 반복된 '바깥뜰'을 살리고, 뒤의 '백성'은 장소를 설명하는 동격적 보충으로 처리해 성전의 구역 구분을 분명히 했습니다.
- source_word: יִפְשְׁטוּ אֶת בִּגְדֵיהֶם
  english_pob_choice: they shall take off their garments
  chosen_korean: 그들이 섬길 때 입던 옷을 벗어
  alternatives_korean:
  - 그들의 옷을 벗어
  - 벗고
  lexicon: HALOT
  rationale: 동사 פשט는 여기서 의복을 벗는 뜻이므로 '벗다'를 사용했고, 목적이 분명하도록 '섬길 때 입던'을 덧붙여 문맥을 드러냈습니다.
- source_word: וְלֹא יְקַדְּשׁוּ אֶת הָעָם בְּבִגְדֵיהֶם
  english_pob_choice: so that they may not make the people holy with their garments
  chosen_korean: 그들의 옷으로 백성을 거룩하게 하지 못하게 해야 합니다
  alternatives_korean:
  - 그들의 옷으로 백성을 성결하게 하지 못하게 해야 합니다
  - 그들의 옷 때문에 백성이 거룩해지지 않게 해야 합니다
  lexicon: HALOT
  rationale: פיעל קדש는 문맥상 '거룩하게 하다'/'성별하다'의 능동 원인 표현이므로, 교회적 용어 '성결'보다 직접적인 '거룩하게 하다'를 택했습니다.
theological_decisions:
- issue: 의복을 통한 거룩함의 전이
  chosen_reading: 제사장들의 거룩한 직무복이 백성에게 접촉을 통해 거룩함을 전달하는 일을 막으라는 규정으로 이해했습니다.
  alternative_readings:
  - 단순히 예식상 구분을 지키라는 뜻
  - 백성을 실제로 거룩하게 만드는 효력이 있다기보다 부정한 혼합을 피하라는 뜻
  rationale: 에스겔의 성전 환상에서는 거룩이 공간과 사물에 실제로 관련되므로, 최종절의 금지는 의복을 통한 거룩함의 접촉 전이를 가리키는 것으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 성전 정결과 거룩의 경계 설정(에스겔 44장 문맥)
