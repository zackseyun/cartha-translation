id: EZK.44.13
reference: Ezekiel 44:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא יִגְּשׁ֤וּ אֵלַ/י֙ לְ/כַהֵ֣ן לִ֔/י וְ/לָ/גֶ֨שֶׁת֙ עַל כָּל קָ֣דָשַׁ֔/י אֶל קָדְשֵׁ֖י הַ/קְּדָשִׁ֑ים וְ/נָֽשְׂאוּ֙ כְּלִמָּתָ֔/ם וְ/תוֹעֲבוֹתָ֖/ם אֲשֶׁ֥ר עָשֽׂוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/013.yaml
  text: They shall not come near to me to serve as priests for me[a], nor to come near any of my holy things, the most holy things; but they shall bear their shame and the abominations that they have done.
  footnotes:
  - marker: a
    text: Or 'to the Holy of Holies.' The Hebrew phrase can refer either to the most holy things or to the innermost holy place; here the context favors the former.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 내게 가까이 오지 못하여 나를 위해 제사장으로 섬기지 못하며, 내 모든 거룩한 것들, 곧 지극히 거룩한 것들[a]에도 가까이 오지 못할 것입니다. 그러나 그들은 자기 수치와 그들이 행한 가증한 일들을 짊어질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구문은 ‘지극히 거룩한 것들’ 또는 ‘지성소’를 가리킬 수 있습니다. 여기서는 문맥상 전자가 더 적절합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִגְּשׁוּ אֵלַי
  english_pob_choice: come near to me
  chosen_korean: 내게 가까이 오지 못하다
  alternatives_korean:
  - 내게 접근하지 못하다
  - 내 앞으로 나아오지 못하다
  lexicon: HALOT
  rationale: 성전 문맥의 נגשׁ를 한국어의 자연스러운 금지 표현인 ‘가까이 오다’로 살리면서, 접근 금지를 분명히 했습니다.
- source_word: לְכַהֵן לִי
  english_pob_choice: to serve as priests for me
  chosen_korean: 나를 위해 제사장으로 섬기다
  alternatives_korean:
  - 나를 위해 제사장 직분을 행하다
  - 나를 위해 제사장으로 봉사하다
  lexicon: HALOT
  rationale: כהן의 기능적 의미를 살려 직무를 수행하는 표현으로 옮겼고, 한국어 교회어의 ‘제사장으로 섬기다’는 직분성과 봉사의 뉘앙스를 함께 전달합니다.
- source_word: אֶל קָדְשֵׁי הַקְּדָשִׁים
  english_pob_choice: the most holy things
  chosen_korean: 지극히 거룩한 것들
  alternatives_korean:
  - 가장 거룩한 것들
  - 지성소
  lexicon: HALOT
  rationale: 문맥이 공간인 ‘지성소’보다 성물 범주를 가리키는 읽음을 더 강하게 뒷받침하므로, POB의 해석을 따라 물건/성물 의미를 유지했습니다.
- source_word: כְּלִמָּתָם
  english_pob_choice: their shame
  chosen_korean: 자기 수치
  alternatives_korean:
  - 자기 부끄러움
  - 자기 치욕
  lexicon: HALOT
  rationale: כלמה는 단순 감정이 아니라 심판 아래의 수치 상태를 가리키므로, 간결하게 ‘수치’로 옮겨 법적·예언적 어조를 살렸습니다.
- source_word: וְתוֹעֲבוֹתָם
  english_pob_choice: the abominations
  chosen_korean: 가증한 것들
  alternatives_korean:
  - 역겨운 행위들
  - 혐오스러운 것들
  lexicon: HALOT
  rationale: תועבות의 강한 언약적·도덕적 비난을 ‘가증한 것들’로 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: קָדְשֵׁי הַקְּדָשִׁים의 의미
  chosen_reading: 성물 범주로 이해하여 ‘지극히 거룩한 것들’로 번역했습니다.
  alternative_readings:
  - 공간으로서 ‘지성소’
  - ‘가장 거룩한 것들’
  rationale: 바로 앞의 ‘내 모든 거룩한 것들’과 병행되므로, 성소 건축물의 한 공간보다 거룩한 물건/제의 대상에 대한 접근 금지가 더 자연스럽습니다. 다만 원문의 중의성은 해석으로 완전히 제거하지 않았습니다.
  doctrine_reference: 성물-공간의 중의성을 보존하고, 문맥에 따른 가장 가능한 읽음을 제시합니다.
