  naturalness: ‘네 마음을 두고’는 현대 표준어에서 이 문맥의 집중·주의라는 뜻이 충분히 자연스럽지 않습니다. ‘마음을 기울이십시오’가 합쇼체에 맞고 명령의 기능을 자연스럽게 전달합니다. ‘눈으로 보고 귀로 들으십시오’는 원문의 감각적 병렬을 유지합니다.
  terminology: ‘야훼’, ‘인자’, ‘규례’, ‘법’, ‘야훼의 집’, ‘성소’는 유지할 수 있습니다. ‘법’에 관한 주석의 ‘여기’가 아랍 문자 ‘هنا’로 잘못 표기되어 있어 고쳐야 합니다. 주석 표지는 각 해당 표현에 직접 붙이는 편이 적절합니다.
