  - 여호와
  lexicon: project default / YHWH contested-term policy
  rationale: 원문 신명호칭을 직접 옮겨 공개·검증 가능한 표기를 유지합니다. 문맥상 주석 없이 ‘주님’으로 완화하지 않았습니다.
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: project default / Ezekiel address formula
  rationale: 에스겔에서 반복되는 예언자 호칭의 문학적 관용구를 보존하기 위해 직역에 가까운 ‘인자’를 택했습니다.
- source_word: שִׂים לִבְּךָ / וְשַׂמְתָּ לִבְּךָ
  english_pob_choice: set your heart
  chosen_korean: 네 마음을 두다
  alternatives_korean:
  - 마음을 두십시오
  - 주의를 기울이십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심인 ‘마음을 두다/향하다’ 이미지를 살리되, 현대 한국어에서 자연스럽게 읽히도록 옮겼습니다.
- source_word: חֻקּוֹת ... וְתורת/ו
  english_pob_choice: statutes ... laws
  chosen_korean: 규례 ... 법
  alternatives_korean:
  - 율례 ... 율법
  - 규정 ... 가르침
  lexicon: HALOT
  rationale: 성전 출입과 관련된 규범적 맥락을 반영해 ‘규례’와 ‘법’을 사용했습니다. ‘율법’은 토라 전체를 떠올리게 할 수 있어 여기서는 더 좁은 규범성에 맞추었습니다.
theological_decisions:
- issue: ‘house of Yahweh’와 ‘sanctuary’의 공간 구분
  chosen_reading: ‘야훼의 집’과 ‘성소’로 구분해 옮김
  alternative_readings:
  - 둘 다 ‘성전’으로 통일
  - ‘야훼의 집’을 ‘성전’으로만 옮김
  rationale: 원문은 집(בַּיִת)과 성소(מִקְדָּשׁ)를 병렬로 두어 출입 규정을 강조합니다. 둘을 모두 ‘성전’으로 평준화하면 공간 대비가 약해집니다.
  doctrine_reference: Ezekiel 44 cultic-ordinance context; source-level spatial distinction
- issue: 직접 명령문의 높임말 처리
  chosen_reading: 하나님의 직접 말씀 안에서는 예언자에게 존대 명령형(-십시오)을 사용함
  alternative_readings:
  - 일반 서술형 종결로 평준화
  - 명령형을 모두 평서로 완화
  rationale: 원문은 신적 명령의 긴박성과 권위를 드러내므로, 한국어에서는 합쇼체 명령형을 사용해 그 효과를 보존했습니다.
  doctrine_reference: Korean register policy for divine speech
