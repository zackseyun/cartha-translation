base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/005.yaml
  text: And Yahweh said to me[a], “Son of man, set your heart, and see with your eyes, and hear with your ears all that I am speaking to you concerning all the statutes of the house of Yahweh and all its laws[b]. Set your heart on the entrance of the temple and on all the exits of the sanctuary.”
  footnotes:
  - marker: a
    text: Or 'pay attention' for 'set your heart'; the Hebrew idiom literally speaks of directing the heart, meaning focused attention and concern.
    reason: lexical_alternative
  - marker: b
    text: Or 'all its instructions' for 'all its laws'; the Hebrew plural can denote prescribed teachings or regulations, not only legislation in a narrow sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 제게 말씀하셨습니다. 「인자야, 마음을 기울이십시오[a]. 눈으로 보고 귀로 들으십시오. 내가 야훼의 집의 모든 규례와 그 모든 법[b]에 관하여 네게 말하는 모든 것을 들으십시오. 집의 입구와 성소의 모든 출구에 마음을 기울이십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마음을 기울이십시오’는 히브리 관용구를 옮긴 것으로, 여기서는 단순한 감정보다 집중된 주의와 내적 준비를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘법’은 여기의 복수형이 좁은 의미의 법률만이 아니라 규정된 지침이나 가르침까지 포함할 수 있음을 반영합니다.
    reason: lexical_alternative
