  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּ֣י אוֹתָ֔/ם שֹׁמְרֵ֖י מִשְׁמֶ֣רֶת הַ/בָּ֑יִת לְ/כֹל֙ עֲבֹ֣דָת֔/וֹ וּ/לְ/כֹ֛ל אֲשֶׁ֥ר יֵעָשֶׂ֖ה בּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/014.yaml
  text: Yet I will appoint them to keep charge of the house[a], for all its service and for all that is done in it.
  footnotes:
  - marker: a
    text: Or 'the temple.' Hebrew 'the house,' a common designation for the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 그들을 집의 모든 일과 그 안에서 이루어지는 모든 일에 대한 책임을 맡은 사람들로 세우겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘집’은 에스겔의 환상 속 성전을 가리키는 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: Yet I will appoint
  chosen_korean: 그러나 내가 ...로 세우겠습니다
  alternatives_korean:
  - 그리고 내가 ...로 주겠습니다
  - 그리고 내가 ...로 임명하겠습니다
  lexicon: HALOT
  rationale: 문맥상 단순 ‘주다’보다 직무를 부여하는 ‘세우다/임명하다’가 더 자연스럽고, 앞선 심판 문맥의 전환을 ‘그러나’로 살렸습니다.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  english_pob_choice: to keep charge
  chosen_korean: 책임을 맡은 사람들
  alternatives_korean:
  - 맡은 책임을 지키는 사람들
  - 경비를 맡은 사람들
  - 맡겨진 직무를 지키는 자들
  lexicon: HALOT
  rationale: 히브리어의 관용구적 ‘감독/보호 책임’은 한국어에서 직역보다 ‘책임을 맡은 사람들’이 가장 자연스럽고, 이어지는 ‘집의 모든 일’과도 잘 맞습니다.
- source_word: הַבָּיִת
  english_pob_choice: the house
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 그 집
  lexicon: HALOT
  rationale: 본문의 기본 표지를 따라 ‘집’으로 옮기되, 에스겔의 환상 성전 맥락이 드러나도록 번역 안에서 과도하게 특정하지 않았습니다.
- source_word: לְכֹל עֲבֹדָתוֹ וּלְכֹל אֲשֶׁר יֵעָשֶׂה בוֹ
  english_pob_choice: for all its service and for all that is done in it
  chosen_korean: 집의 모든 일과 그 안에서 이루어지는 모든 일
  alternatives_korean:
  - 그 집의 모든 봉사와 그 안에서 하는 모든 일
  - 그 집의 모든 섬김과 그 안에서 이루어지는 모든 일
  lexicon: HALOT
  rationale: עֲבֹדָה의 폭넓은 뜻을 고려해 ‘봉사’로 좁히지 않고 ‘일’로 처리해 성전의 실무와 예전적 기능을 함께 포괄했습니다.
theological_decisions:
- issue: 하나님이 맡기시는 직무의 성격
  chosen_reading: 레위인들에게 성전의 실무와 관련된 포괄적 관리 책임을 부여하시는 말씀으로 읽었습니다.
  alternative_readings:
  - 성전 봉사 직무만을 말하는 것으로 읽을 수 있습니다
  - 행정적 관리보다 예전적 봉사를 강조하는 것으로 읽을 수 있습니다
  rationale: ‘집의 모든 일’과 ‘그 안에서 이루어지는 모든 일’의 병렬이 책임의 범위를 넓게 제시하므로, 한쪽으로만 좁히지 않았습니다.
  doctrine_reference: Ezekiel 44:10-16의 문맥적 레위인 직무 구분
- issue: ‘집’의 번역
  chosen_reading: 히브리어 בית를 본문대로 ‘집’으로 유지했습니다.
  alternative_readings:
  - 문맥상 ‘성전’으로 풀어 쓸 수 있습니다
  rationale: 문맥상 성전임은 분명하지만, 원문의 표지를 유지하는 것이 에스겔의 표현을 더 직접적으로 반영합니다.
  doctrine_reference: 성전 환상 문맥
