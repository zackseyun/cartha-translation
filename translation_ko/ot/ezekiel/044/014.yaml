  verdict: revise
  source_fidelity: ‘책임을 맡은 사람들’은 שֹׁמְרֵי מִשְׁמֶרֶת의 ‘맡아 지키는/수호하는 직무’라는 반복 표현을 일반적인 책임자로 다소 약화합니다. 또한 원문은 그들이 집의 모든 봉사와 그 안에서 행해지는 모든 일을 담당하도록 세운다는 범위를 명시합니다.
  naturalness: 초안은 현대 한국어로 자연스럽지만, ‘집의 모든 일과 그 안에서 이루어지는 모든 일에 대한 책임을 맡은 사람들’은 수식 범위가 길고 ‘모든 일’의 반복이 다소 무겁습니다. 동사 구조를 나누어 직무와 범위를 분명히 하면 더 자연스럽습니다.
  terminology: ‘집’은 בַּיִת의 표현을 보존하며, 각주로 성전 문맥을 밝힌 것은 적절합니다. עֲבֹדָה는 예전적 봉사를 포함하되 이에 한정되지 않으므로 ‘모든 일’로 넓게 옮길 수 있습니다. 다만 שֹׁמְרֵי מִשְׁמֶרֶת의 수호·관리 의미는 본문에 드러나야 합니다.
