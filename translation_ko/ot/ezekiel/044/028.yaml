  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיְתָ֤ה לָ/הֶם֙ לְֽ/נַחֲלָ֔ה אֲנִ֖י נַֽחֲלָתָ֑/ם וַ/אֲחֻזָּ֗ה לֹֽא תִתְּנ֤וּ לָ/הֶם֙ בְּ/יִשְׂרָאֵ֔ל אֲנִ֖י אֲחֻזָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/028.yaml
  text: 'And this shall be their inheritance: I am their inheritance[a]. And you shall give them no possession in Israel[b]; I am their possession.'
  footnotes:
  - marker: a
    text: 'Or, ''And it shall be for them as an inheritance: I am their inheritance.'' The Hebrew opening is elliptical.'
    reason: lexical_alternative
  - marker: b
    text: '''Possession'' may also be rendered ''landholding'' or ''property,'' referring to a permanent holding in the land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게는 이것이 기업이 될 것입니다. 나는 그들의 기업입니다[a]. 너희는 이스라엘에서 그들에게 어떤 소유도 주어서는 안 됩니다[b]. 나는 그들의 소유입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들에게는 기업이 될 것입니다. 나는 그들의 기업입니다.” 히브리어 첫머리는 생략이 있는 표현입니다.
    reason: alternative_reading
  - marker: b
    text: “소유”는 “땅 소유”나 “토지 점유”로도 옮길 수 있으며, 이곳에서는 이스라엘 안에서의 영구적 소유권을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְנַחֲלָה
  english_pob_choice: And this shall be their inheritance
  chosen_korean: 그들에게는 이것이 기업이 될 것입니다
  alternatives_korean:
  - 이것이 그들의 상속분이 될 것입니다
  - 이것이 그들의 유산이 될 것입니다
  - 그들에게 이것이 유업이 될 것입니다
  lexicon: HALOT
  rationale: 히브리어는 생략된 주어가 있는 선언형이라, 영어 POB의 'this'를 따라 한국어에서도 앞의 제사 규정 전체를 가리키는 지시어로 처리했습니다. נחלה는 법적·분배적 뉘앙스를 살려 '기업'으로 옮겼습니다.
- source_word: נַחֲלָתָם
  english_pob_choice: their inheritance
  chosen_korean: 나는 그들의 기업입니다
  alternatives_korean:
  - 나는 그들의 상속분입니다
  - 나는 그들의 유산입니다
  - 나는 그들의 유업입니다
  lexicon: HALOT
  rationale: 같은 어근을 유지해 반복을 드러내기 위해 앞뒤를 모두 '기업'으로 통일했습니다. 하나님 자신이 제사장들의 몫이라는 점을 직설적으로 살리는 표현입니다.
- source_word: וַ/אֲחֻזָּה לֹֽא תִתְּנ֤וּ לָ/הֶם֙ בְּ/יִשְׂרָאֵ֔ל
  english_pob_choice: And you shall give them no possession in Israel
  chosen_korean: 너희는 이스라엘에서 그들에게 어떤 소유도 주어서는 안 됩니다
  alternatives_korean:
  - 너희는 이스라엘에서 그들에게 어떤 땅도 주어서는 안 됩니다
  - 너희는 이스라엘에서 그들에게 어떤 재산도 주어서는 안 됩니다
  - 너희는 이스라엘에서 그들에게 어떤 소유지 분깃도 주어서는 안 됩니다
  lexicon: HALOT
  rationale: אֲחֻזָּה는 토지 점유나 소유를 가리킬 수 있어, 영어 POB의 'possession'을 따라 넓은 의미의 '소유'로 옮겼습니다. 부정 명령의 법적 강도를 살리기 위해 '주어서는 안 됩니다'를 사용했습니다.
- source_word: אֲנִי אֲחֻזָּתָם
  english_pob_choice: I am their possession
  chosen_korean: 나는 그들의 소유입니다
  alternatives_korean:
  - 나는 그들의 기업입니다
  - 나는 그들의 소유지입니다
  - 나는 그들의 분깃입니다
  lexicon: HALOT
  rationale: 앞의 '소유'와 대응시키되, 히브리어의 반복되는 소유 개념을 한국어에서도 유지했습니다. 하나님이 제사장들의 실제 몫이라는 의미를 간명하게 전달합니다.
theological_decisions:
- issue: נחלה와 אחזה의 구별을 한국어에서 어떻게 유지할지
  chosen_reading: נחלה는 '기업', אחזה는 '소유'로 나누어 번역해, 두 개의 유사하지만 다른 토지·분깃 어휘를 구별했습니다.
  alternative_readings:
  - 둘 다 '기업'으로 통일하기
  - 둘 다 '소유'로 통일하기
  rationale: 본문은 제사장들에게 일반적인 토지 상속이 없으며, 야훼 자신이 그들의 몫이라는 점을 두 번 강조합니다. 용어를 구분해야 이 신학적 대비가 흐려지지 않습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
