  - severity: medium
    issue: 각주 표지가 ‘어머니’에 붙어 있음
    rationale: 각주의 내용은 ‘남편을 둔 적이 없는 자매’(אֲשֶׁר לֹא הָיְתָה לְאִישׁ)를 설명하므로, 표지도 그 자매 표현 바로 뒤에 놓여야 합니다.
