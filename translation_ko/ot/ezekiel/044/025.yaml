source:
  edition: WLC
  text: וְ/אֶל מֵ֣ת אָדָ֔ם לֹ֥א יָב֖וֹא לְ/טָמְאָ֑ה כִּ֣י אִם לְ/אָ֡ב וּ֠/לְ/אֵם וּ/לְ/בֵ֨ן וּ/לְ/בַ֜ת לְ/אָ֗ח וּ/לְ/אָח֛וֹת אֲשֶֽׁר לֹא הָיְתָ֥ה לְ/אִ֖ישׁ יִטַּמָּֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/025.yaml
  text: And they shall not go near a dead person to make themselves unclean; but for father or mother[a], for son or daughter, for brother, or for a sister who has not belonged to a man, they may make themselves unclean.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'a sister who is unmarried.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 시체에게 가까이 가서 자신을 부정하게 해서는 안 됩니다. 다만 아버지나 어머니[a], 아들이나 딸, 형제나 남편에게 속하지 않은 자매를 위해서는 자신을 부정하게 해도 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 관용적으로는 ‘미혼인 자매’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵת אָדָם
  english_pob_choice: a dead person
  chosen_korean: 시체
  alternatives_korean:
  - 죽은 사람
  - 죽은 남자
  lexicon: HALOT
  rationale: 문맥상 제사장 정결 규정에서 접촉 대상은 ‘죽은 사람’이 아니라 মৃত의 상태를 가리키는 시체이므로, 한국어에서는 더 직접적이고 정확한 ‘시체’가 자연스럽습니다.
- source_word: יָבֹוא אֶל
  english_pob_choice: go near
  chosen_korean: 가까이 가서
  alternatives_korean:
  - 가서
  - 접근해서
  lexicon: HALOT
  rationale: 이 동사는 단순한 이동이 아니라 시체에 대한 근접·접촉 가능성을 뜻하므로, ‘가까이 가서’가 금지의 성격을 더 분명히 드러냅니다.
- source_word: לְטָמְאָה / יִטַּמָּאוּ
  english_pob_choice: to make themselves unclean / they may make themselves unclean
  chosen_korean: 자신을 부정하게 해서는 안 됩니다 / 자신을 부정하게 해도 됩니다
  alternatives_korean:
  - 부정하게 되어서는 안 됩니다 / 부정하게 되어도 됩니다
  - 더럽혀져서는 안 됩니다 / 더럽혀져도 됩니다
  lexicon: HALOT
  rationale: 히브리어 정결 어휘의 규정적 용법을 살리기 위해 ‘부정하게 하다’로 옮기고, 마지막 절은 허용을 나타내므로 ‘해도 됩니다’로 풀어 한국어 법규 문체를 유지했습니다.
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  english_pob_choice: who has not belonged to a man
  chosen_korean: 남편에게 속하지 않은
  alternatives_korean:
  - 남자에게 속하지 않은
  - 아직 결혼하지 않은
  - 남편이 없는
  lexicon: HALOT
  rationale: 히브리어의 관계적 관용구를 너무 좁게 ‘미혼’으로 고정하지 않고, 본문의 말맛을 살려 ‘남편에게 속하지 않은’으로 옮겼습니다.
theological_decisions:
- issue: 예외절의 법적 힘
  chosen_reading: 허용을 나타내는 표현으로 이해해 ‘해도 됩니다’로 번역했습니다.
  alternative_readings:
  - 명령문처럼 ‘해야 합니다’
  - 단순 미래로 ‘할 것입니다’
  rationale: 본문은 금지의 예외를 열거하는 정결 규정이므로, 의무가 아니라 허용을 나타내는 것으로 읽는 것이 문맥에 맞습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
