  source_fidelity: 예외로 허용되는 친족 목록과 마지막 미완료형의 허용 의미는 초안이 대체로 정확히 반영합니다. 다만 מֵת אָדָם에 대한 접근은 한국어에서 ‘시체에게’가 아니라 ‘시체에’라고 해야 하며, 자매 한정절의 각주는 해당 표현에 붙어야 합니다.
