revisions:
- from: 그들은 시체에게 가까이 가서 자신을 부정하게 해서는 안 됩니다. 다만 아버지나 어머니[a], 아들이나 딸, 형제나 남편에게 속하지 않은 자매를 위해서는 자신을 부정하게 해도 됩니다.
  to: 그들은 시체에 가까이 가서 자신을 부정하게 해서는 안 됩니다. 그러나 아버지나 어머니, 아들이나 딸, 형제나 남편을 둔 적이 없는 자매[a]를 위해서는 자신을 부정하게 해도 됩니다.
  rationale: 시체에 대한 접근을 나타내는 한국어 조사 결합을 바로잡고, 자매 한정절을 현대 한국어로 자연스럽게 다듬었습니다. ‘미혼’은 본문의 혼인 관계 관용구를 관용적으로 풀어쓴 표현이므로 각주로 유지했으며, 본문은 처녀성 등을 단정하지 않습니다. 각주 표지는 설명 대상인 자매 한정절로 옮겼습니다.
