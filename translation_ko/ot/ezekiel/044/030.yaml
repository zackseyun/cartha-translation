  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רֵאשִׁית֩ כָּל בִּכּ֨וּרֵי כֹ֜ל וְ/כָל תְּר֣וּמַת כֹּ֗ל מִ/כֹּל֙ תְּרוּמ֣וֹתֵי/כֶ֔ם לַ/כֹּהֲנִ֖ים יִֽהְיֶ֑ה וְ/רֵאשִׁ֤ית עֲרִסֽוֹתֵי/כֶם֙ תִּתְּנ֣וּ לַ/כֹּהֵ֔ן לְ/הָנִ֥יחַ בְּרָכָ֖ה אֶל בֵּיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/030.yaml
  text: And the first of all the firstfruits of everything[a], and every contribution from all your contributions, shall belong to the priests. You shall give the first of your dough to the priest[c][b], to cause a blessing to rest on your house.
  footnotes:
  - marker: a
    text: Or 'every offering from all your offerings.' The Hebrew term refers to a portion set apart and contributed for sacred use.
    reason: lexical_alternative
  - marker: b
    text: Or 'the first of your kneaded dough'; the Hebrew term can refer to dough or, by extension, the kneading batch.
    reason: lexical_alternative
  - marker: c
    text: That is, so that blessing may rest upon your household.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 온갖 첫 열매의 첫 것은 모두, 너희가 바치는 모든 거제물 가운데 모든 거제물은 제사장들의 것이 될 것입니다. 너희는 너희 반죽의 첫 부분을 제사장에게 주어야 합니다. 이는 복이 너희 집에 머물게 하려는 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 모든 예물에서 나오는 모든 예물’. 히브리어는 거룩한 용도로 따로 떼어 바치는 몫을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희 반죽의 첫 부분’. 히브리어는 반죽 자체 또는, 넓게는 반죽하는 한 덩이를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 복이 너희 집안에 머물게 하려는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית + בִּכּוּרֵי
  english_pob_choice: the first of all the firstfruits
  chosen_korean: 모든 첫 열매의 첫 부분
  alternatives_korean:
  - 첫 열매들 가운데 첫째 되는 것
  - 첫 열매의 첫것
  - 가장 좋은 첫 열매
  lexicon: HALOT
  rationale: רֵאשִׁית가 בִּכּוּרֵי와 함께 겹쳐 강조를 이루므로, 한국어에서도 단순히 ‘첫 열매’로 뭉개지 않고 ‘첫 열매의 첫 부분’으로 층위를 살렸습니다.
- source_word: תְּרוּמַת / תְּרוּמוֹתֵיכֶם
  english_pob_choice: contribution / your contributions
  chosen_korean: 예물의 모든 거제물
  alternatives_korean:
  - 드리는 것의 모든 예물
  - 헌물의 모든 헌물
  - 거제 예물
  lexicon: HALOT
  rationale: תְּרוּמָה의 핵심은 성별하여 들어 올려 바치는 몫이므로, 전통 용어를 완전히 피하지 않으면서도 문맥상 의미를 드러내는 ‘거제물’을 택했습니다. 앞의 ‘예물’은 일반적 봉헌을, 뒤의 ‘거제물’은 그중 성별된 몫을 구분해 줍니다.
- source_word: לַכֹּהֲנִים / לַכֹּהֵן
  english_pob_choice: the priests / the priest
  chosen_korean: 제사장들에게 / 제사장에게
  alternatives_korean:
  - 제사장들에게 / 그 제사장에게
  - 제사장들 / 제사장
  - 사제들에게 / 사제
  lexicon: HALOT
  rationale: כהן은 성전 제의를 맡은 제사장을 가리키므로, 한국어에서도 통상적이면서도 직분 의미가 분명한 ‘제사장’을 유지했습니다. 복수와 단수의 차이도 살렸습니다.
- source_word: עֲרִסוֹתֵיכֶם
  english_pob_choice: the first of your dough
  chosen_korean: 너희가 드리는 반죽한 첫 부분
  alternatives_korean:
  - 너희의 반죽한 첫 부분
  - 너희의 첫 반죽
  - 너희의 반죽덩이의 첫 부분
  lexicon: HALOT
  rationale: עֲרִסָה는 반죽 전체 또는 반죽용 덩이를 가리킬 수 있어 문맥상 첫 몫의 의미를 살려 ‘반죽한 첫 부분’으로 옮겼습니다. POB의 주석처럼 ‘떡반죽’보다 제의적 첫 몫이 드러나도록 했습니다.
- source_word: לְהָנִיחַ בְּרָכָה
  english_pob_choice: to cause a blessing to rest
  chosen_korean: 복을 머물게 하려는 것입니다
  alternatives_korean:
  - 복이 머물게 하려는 것입니다
  - 복을 내려 머물게 하려는 것입니다
  - 복이 집에 임하게 하려는 것입니다
  lexicon: HALOT
  rationale: הניח는 ‘쉬게 하다/머물게 하다’의 뜻이므로, 축복을 추상화하지 않고 ‘복을 머물게 하다’로 번역해 결과적 목적을 살렸습니다.
theological_decisions:
- issue: 집에 임하는 복의 범위
  chosen_reading: 이 약속은 제사장에게 첫 몫을 드린 결과로 ‘복’이 집에 머무는 것을 말하며, 그 복의 구체적 형태는 열어 둡니다.
  alternative_readings:
  - 물질적 번영 약속
  - 일반적 언약적 호의
  rationale: 히브리어는 단순히 ‘복’이 집에 머문다고만 말하므로, 한국어도 의미를 좁히지 않고 source의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
