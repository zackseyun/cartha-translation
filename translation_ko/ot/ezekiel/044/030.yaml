  rationale: 원문의 반복된 כָּל 및 תְּרוּמָה 표현을 가능한 한 보존하면서, 한국어에서 관계가 분명하도록 문장을 조정했습니다. ‘반죽한 첫 부분’을 소유 관계가 드러나는 ‘너희 반죽의 첫 부분’으로 바로잡았습니다. 복의 내용은 구체화하지 않았고, ‘집’은 본문에 유지하되 각주에서 ‘집안’이라는 관용적 뜻을 밝혔습니다.
