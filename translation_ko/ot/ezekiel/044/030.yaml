- from: 또 모든 첫 열매의 첫 부분과 너희가 드리는 모든 예물의 모든 거제물은 제사장들에게 속할 것입니다. 너희는 반죽한 첫 부분을 제사장에게 주어야 하니, 그것이 너희 집에 복을 머물게 하려는 것입니다.[a][b][c]
