id: EZK.44.16
reference: Ezekiel 44:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֜מָּה יָבֹ֣אוּ אֶל מִקְדָּשִׁ֗/י וְ/הֵ֛מָּה יִקְרְב֥וּ אֶל שֻׁלְחָנִ֖/י לְ/שָׁרְתֵ֑/נִי וְ/שָׁמְר֖וּ אֶת מִשְׁמַרְתִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/016.yaml
  text: They themselves shall enter my sanctuary[a], and they themselves shall come near to my table to minister to me, and they shall keep my charge.
  footnotes:
  - marker: a
    text: Or 'my altar' or 'my altar-table,' since 'table' here is used in a temple-service context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내 성소에 들어가고, 내 상에 가까이 나아와 나를 섬기며, 내 직분을 지킬 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘상’은 제의 문맥에서 제단 또는 제단상으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  english_pob_choice: they themselves
  chosen_korean: 그들은
  alternatives_korean:
  - 그들 자신은
  - 바로 그들은
  lexicon: HALOT
  rationale: 히브리어 대명사는 문맥상 제사장에게만 허락된 특권을 강조하지만, 한국어에서는 ‘그들 자신은’보다 간결한 ‘그들은’이 자연스럽고 본문의 배타성을 문맥으로 충분히 드러냅니다.
- source_word: מִקְדָּשִׁי
  english_pob_choice: my sanctuary
  chosen_korean: 내 성소
  alternatives_korean:
  - 내 성전
  - 내 거룩한 곳
  lexicon: HALOT
  rationale: מִקְדָּשׁ은 성스러운 장소/성소를 가리키므로, 예배 맥락을 살리면서도 직역에 가까운 ‘성소’가 가장 직접적입니다.
- source_word: שֻׁלְחָנִי
  english_pob_choice: my table
  chosen_korean: 내 상
  alternatives_korean:
  - 내 식탁
  - 내 제단상
  - 내 제단
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘상/식탁’이므로 본문 표면을 따라 ‘내 상’으로 옮겼습니다. 제의적 맥락상 제단으로 이해될 수 있지만, 본문 자체의 어휘는 유지하는 것이 더 적절합니다.
- source_word: לְשָׁרְתֵנִי
  english_pob_choice: to minister to me
  chosen_korean: 나를 섬기며
  alternatives_korean:
  - 나를 시중들며
  - 나를 봉사하며
  lexicon: HALOT
  rationale: שרת는 제사장적 예배 봉사를 뜻하므로, 단순한 ‘섬김’보다 예배·성전 봉사의 뉘앙스를 살리되 한국어로 자연스러운 ‘나를 섬기며’를 택했습니다.
- source_word: מִשְׁמַרְתִּי
  english_pob_choice: my charge
  chosen_korean: 내 직분
  alternatives_korean:
  - 내 책임
  - 내 맡은 일
  - 내 명령
  lexicon: HALOT
  rationale: 제사장 문맥에서 מִשְׁמֶרֶת는 맡겨진 의무와 직무를 뜻합니다. ‘직분’은 한국어 성경 문맥에서 제의적·공적 책무를 비교적 잘 살립니다.
theological_decisions:
- issue: 성소 접근과 제사장 특권의 배타성
  chosen_reading: ‘그들은’으로 간명하게 옮기되, 문맥 전체에서 오직 지정된 제사장들만 성소에 들어가고 상에 가까이 갈 수 있다는 배타성을 유지했습니다.
  alternative_readings:
  - 그들 자신은
  - 바로 그들은
  rationale: 히브리어 독립 인칭대명사는 강조를 주지만, 한국어에서는 과도한 중복이 되기 쉬워 문맥적 강조로 처리했습니다.
  doctrine_reference: Ezekiel 44:15-16의 제의 질서와 성소 접근 규정
