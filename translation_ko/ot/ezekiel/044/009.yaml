id: EZK.44.9
reference: Ezekiel 44:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ כָּל בֶּן נֵכָ֗ר עֶ֤רֶל לֵב֙ וְ/עֶ֣רֶל בָּשָׂ֔ר לֹ֥א יָב֖וֹא אֶל מִקְדָּשִׁ֑/י לְ/כָל בֶּן נֵכָ֔ר אֲשֶׁ֕ר בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/009.yaml
  text: 'Thus says the Lord GOD: No foreigner[a], uncircumcised in heart and uncircumcised in flesh, shall enter my sanctuary[b], of any foreigner who is among the sons of Israel.'
  footnotes:
  - marker: a
    text: Or, 'no son of a foreign land.' The Hebrew idiom means 'foreigner.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'among the sons of Israel'; that is, among the people of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 하나님께서 이렇게 말씀하십니다. “어떤 이방인도, 마음에 할례받지 않고 육신에 할례받지 않은 자는 내 성소에 들어오지 못합니다. 곧 이스라엘 자손 가운데 있는 어떤 이방인도 그러합니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר / אֲדֹנָי יְהוִה
  english_pob_choice: Thus says the Lord GOD
  chosen_korean: 주 하나님께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주 야훼께서 이렇게 말씀하십니다
  - 주 하나님이 이와 같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자 공식을 현대 한국어로 자연스럽게 살리되, 합쇼체의 공적 선포 어조를 유지했습니다. אֲדֹנָי + יְהוִה의 결합은 영어 POB의 'the Lord GOD'에 대응하여 '주 하나님'으로 옮겼습니다.
- source_word: כָּל בֶּן נֵכָר
  english_pob_choice: No foreigner
  chosen_korean: 어떤 이방인도
  alternatives_korean:
  - 어떤 외국인도
  - 어떤 타국인도
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자 그대로 '낯선 아들'이 아니라 외부자/이방인을 뜻하므로, 배제의 범위를 자연스럽게 드러내는 '어떤 이방인도'로 옮겼습니다.
- source_word: עֶרֶל לֵב / וְעֶרֶל בָּשָׂר
  english_pob_choice: uncircumcised in heart ... and uncircumcised in flesh
  chosen_korean: 마음에 할례받지 않고 육신에 할례받지 않은 자
  alternatives_korean:
  - 마음의 포피를 벗기지 않고 육신의 포피를 벗기지 않은 자
  - 마음에 할례가 없고 육신에 할례가 없는 자
  lexicon: HALOT
  rationale: עֶרֶל은 '할례받지 않은' 상태를 가리키는 표준 예언자적 표현이므로, 상징적 의미를 살려 '마음에/육신에 할례받지 않은'으로 옮겼습니다. '포피'를 넣는 직역보다 한국어 독자가 비유적 대조를 더 분명히 이해할 수 있습니다.
- source_word: אֶל מִקְדָּשִׁי
  english_pob_choice: my sanctuary
  chosen_korean: 내 성소에
  alternatives_korean:
  - 내 성전 안으로
  - 내 성소 안으로
  lexicon: HALOT
  rationale: מִקְדָּשׁ은 거룩한 공간/성소를 뜻하므로, 문맥에 맞는 직접 번역인 '내 성소에'를 택했습니다. 동사 '들어오다'와 함께 자연스러운 방향성을 이룹니다.
- source_word: אֲשֶׁר בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  english_pob_choice: who is among the sons of Israel
  chosen_korean: 이스라엘 자손 가운데 있는
  alternatives_korean:
  - 이스라엘 자손들 한가운데 있는
  - 이스라엘 백성 가운데 있는
  lexicon: HALOT
  rationale: בְּתוֹךְ의 '가운데/한가운데' 의미를 살리되, 한국어에서는 '가운데 있는'이 가장 자연스럽습니다. '이스라엘 자손'은 집단 전체를 가리키는 성경적 표현을 유지합니다.
theological_decisions:
- issue: 여호와/야훼 표기와 아도나이-יהוה 결합 처리
  chosen_reading: 본문의 직접적인 신명 표기는 한국어 본문에서 '주 하나님'으로 옮기고, 예언자적 선포의 위엄을 유지했습니다.
  alternative_readings:
  - 주 야훼
  - 주 하나님께서
  rationale: 이 절은 '주 하나님'이라는 титլ형 표현이 예언자의 공식 발화로 기능하므로, 본문 가독성과 프로젝트의 한국어 스타일을 고려해 '주 하나님'을 선택했습니다. 야훼 표기는 본 절의 직역 목적상 본문보다 주석적 장치에 더 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: '''이방인''의 범위와 제한'
  chosen_reading: 본문은 '마음과 육신에 할례받지 않은 이방인'을 성소 प्रवेश 금지 대상으로 제시합니다.
  alternative_readings:
  - 모든 이방인을 전면적으로 배제한다
  - 특정한 거류 외국인만을 가리킨다
  rationale: 히브리어는 '이방인'을 다시 설명하여 그 종류를 한정하므로, 과도한 일반화나 축소 없이 문장 자체의 제한을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
