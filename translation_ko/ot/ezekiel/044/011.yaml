id: EZK.44.11
reference: Ezekiel 44:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָי֤וּ בְ/מִקְדָּשִׁ/י֙ מְשָׁ֣רְתִ֔ים פְּקֻדּוֹת֙ אֶל שַׁעֲרֵ֣י הַ/בַּ֔יִת וּֽ/מְשָׁרְתִ֖ים אֶת הַ/בָּ֑יִת הֵ֠מָּה יִשְׁחֲט֨וּ אֶת הָ/עֹלָ֤ה וְ/אֶת הַ/זֶּ֨בַח֙ לָ/עָ֔ם וְ/הֵ֛מָּה יַעַמְד֥וּ לִ/פְנֵי/הֶ֖ם לְ/שָֽׁרְתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/011.yaml
  text: Yet they shall be ministers in my sanctuary[a], having oversight at the gates of the temple and ministering in the temple. They shall slaughter the burnt offering and the sacrifice for the people[c][b], and they shall stand before them to minister to them.
  footnotes:
  - marker: a
    text: Or 'charges' or 'duties' at the gates of the temple.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house'; in this temple-vision context, 'temple' clarifies the referent.
    reason: lexical_alternative
  - marker: c
    text: Or 'on behalf of the people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 내 성소에서 문들을 감독하는 책임이 있는 섬기는 이들이 되고, 그 집에서 섬기는 이들이 될 것입니다. 그들은 백성을 위해 번제와 제물을 잡을 것이며, 그들 앞에 서서 그들을 섬길 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘문들을 감독하는 책임’은 본문의 פְּקֻדּוֹת이 가리킬 수 있는 ‘맡은 일/책무’의 기능적 뜻을 풀어 쓴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 ‘그 집’이지만, 이 환상 문맥에서는 성전 건물을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘백성을 위해’는 히브리어 לָעָם의 수혜적 의미를 따른 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתִים
  english_pob_choice: ministers / ministering
  chosen_korean: 섬기는 이들 / 섬기는
  alternatives_korean:
  - 종
  - 봉사하는 이들
  - 섬기는 자들
  lexicon: HALOT
  rationale: 성전 문맥의 שׁרת은 일반적 ‘섬기다’보다 예배적·직무적 봉사를 가리키므로, 현대어로는 ‘섬기는 이들’이 가장 자연스럽고 ‘minister’의 격식을 비교적 잘 살립니다.
- source_word: פְּקֻדּוֹת
  english_pob_choice: having oversight
  chosen_korean: 감독하는 책임
  alternatives_korean:
  - 맡은 직무
  - 맡은 일
  - 책무
  lexicon: HALOT
  rationale: 문들과 결합될 때 단순한 ‘직무’보다 문을 지키고 관리하는 ‘감독/책임’의 기능이 드러나므로 이렇게 옮겼습니다.
- source_word: שַׁעֲרֵי הַבַּיִת / הַבָּיִת
  english_pob_choice: the gates of the temple / the temple
  chosen_korean: 그 집
  alternatives_korean:
  - 성전
  - 성전의 문들
  - 그 집의 문들
  lexicon: HALOT
  rationale: 에스겔의 성전 환상에서 בַּיִת은 성전 전체를 가리킬 수 있지만, 본절에서는 문과 집이 병렬로 나오므로 ‘그 집’으로 유지해 원문 대비를 살렸습니다.
- source_word: הָעֹלָה וְאֶת הַזֶּבַח
  english_pob_choice: the burnt offering and the sacrifice
  chosen_korean: 번제와 제물
  alternatives_korean:
  - 번제와 희생제물
  - 번제와 희생
  - 번제와 제사
  lexicon: HALOT
  rationale: עֹלָה는 관용적으로 ‘번제’가 맞고, זֶבַח은 여기서 특정 제사 종류보다 넓은 제의적 ‘제물/희생물’로 읽혀 ‘제물’이 가장 무난합니다.
- source_word: לָעָם
  english_pob_choice: for the people
  chosen_korean: 백성을 위해
  alternatives_korean:
  - 백성을 위하여
  - 백성에게
  - 백성을 대신하여
  lexicon: HALOT
  rationale: ל의 수혜·관련 의미를 살려 ‘위해’로 옮겼고, 영문 주석의 ‘on behalf of’까지 과도하게 고정하지 않았습니다.
- source_word: לְשָׁרְתָם
  english_pob_choice: to minister to them
  chosen_korean: 그들을 섬길
  alternatives_korean:
  - 그들에게 봉사할
  - 그들을 시중들
  - 그들을 도울
  lexicon: HALOT
  rationale: 동일 어근 שׁרת를 앞절과 일관되게 살려, 마지막 부정사도 ‘섬기다’로 대응시켜 구조를 드러냈습니다.
theological_decisions:
- issue: 이 절의 레위인/성전 봉사자의 지위
  chosen_reading: 이들은 제사장처럼 나아가는 것이 아니라, 문 감독과 제물 도살, 보조적 섬김을 맡은 하위 성전 봉사자로 묘사됩니다.
  alternative_readings:
  - 제사장적 직무를 계속 수행한다
  rationale: 문맥상 앞절의 제한을 이어 받아, 이 절은 접근권이 있는 제사장과 구별되는 보조적 직무를 제시합니다.
  doctrine_reference: 에스겔 44장 문맥
