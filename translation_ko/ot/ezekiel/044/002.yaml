  source_fidelity: 핵심 의미는 히브리어 본문에 충실합니다. 반복되는 ‘닫힘’, 열 수 없음, 어떤 사람도 들어올 수 없음, 그리고 야훼께서 이미 그 문으로 들어가셨다는 인과관계가 모두 보존되었습니다. 다만 각주가 ‘제게’에 붙어 있어, אִישׁ의 일반적 남성 단수 용법을 설명하는 각주의 실제 대상과 맞지 않습니다.
  naturalness: 합쇼체는 일관되고 자연스럽습니다. ‘그리로’도 가능하지만, 반복되는 출입구를 명확히 하고 본문의 어휘를 유지하도록 ‘그 문으로’가 더 직접적입니다. 마지막의 ‘그것은’은 ‘그 문은’으로 되받는 편이 한국어에서 더 자연스럽습니다.
  terminology: ‘야훼’, ‘이스라엘의 하나님’, ‘문’은 프로젝트의 어휘 선택과 본문 문맥에 적절합니다. אִישׁ은 이 문맥에서 일반적 인간을 가리키므로 ‘아무도’는 안전한 한국어 번역이며, 원문의 남성 단수 형태는 각주로 밝혀야 합니다.
