id: EZK.44.2
reference: Ezekiel 44:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלַ֜/י יְהוָ֗ה הַ/שַּׁ֣עַר הַ/זֶּה֩ סָג֨וּר יִהְיֶ֜ה לֹ֣א יִפָּתֵ֗חַ וְ/אִישׁ֙ לֹא יָ֣בֹא ב֔/וֹ כִּ֛י יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּ֣א ב֑/וֹ וְ/הָיָ֖ה סָגֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/002.yaml
  text: And Yahweh said to me[a], “This gate shall remain shut; it shall not be opened, and no one shall enter through it, because Yahweh, the God of Israel, has entered through it. Therefore it shall remain shut.”
  footnotes:
  - marker: a
    text: Or 'no one shall enter through it.' The Hebrew says 'no man,' using a masculine singular form with generic force.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 제게 말씀하셨습니다. “이 문은 닫혀 있어야 합니다. 열려서는 안 되며, 아무도 그 문으로 들어가서는 안 됩니다[a]. 이는 이스라엘의 하나님 야훼께서 그 문으로 들어가셨기 때문입니다. 그러므로 이 문은 닫혀 있어야 합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 일반적 의미로 쓰인 남성 단수 ‘이쉬’(אִישׁ)를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 YHWH 기본 원칙에 따라 고유신명사로 옮기고, 일반 호칭인 ‘주님’으로 대체하지 않았습니다.
- source_word: הַשַּׁעַר הַזֶּה
  english_pob_choice: this gate
  chosen_korean: 이 문
  alternatives_korean:
  - 그 문
  - 이 성문
  lexicon: HALOT
  rationale: 문맥이 성전 환상 속 출입구를 가리키므로 ‘문’으로 옮기되, 지시어는 근칭 ‘이’를 살렸습니다.
- source_word: סָגוּר יִהְיֶה / וְהָיָה סָגוּר
  english_pob_choice: shall remain shut / it shall remain shut
  chosen_korean: 닫힌 채로 있어야 합니다
  alternatives_korean:
  - 닫혀 있어야 합니다
  - 닫힌 상태로 있을 것입니다
  lexicon: HALOT
  rationale: 단순 미래가 아니라 지속 상태를 강조하는 표현이므로, 한국어에서도 계속된 닫힘의 상태를 자연스럽게 드러냈습니다.
- source_word: וְאִישׁ לֹא יָבֹא בוֹ
  english_pob_choice: and no man shall enter through it
  chosen_korean: 아무도 그리로 들어가서는 안 됩니다
  alternatives_korean:
  - 아무도 그 문으로 들어가서는 안 됩니다
  - 남자는 그리로 들어가서는 안 됩니다
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 אִישׁ은 여기서 일반적 의미로 쓰이므로, 한국어에서는 의미를 분명하게 하되 문맥상 자연스러운 ‘아무도’로 옮겼습니다.
- source_word: בָּא בוֹ
  english_pob_choice: has entered through it
  chosen_korean: 그리로 들어가셨기 때문입니다
  alternatives_korean:
  - 그 문으로 들어가셨기 때문입니다
  - 그리로 들어가신 때문입니다
  lexicon: HALOT
  rationale: 문이 닫혀 있어야 하는 근거로 제시된 완료 사건이므로 과거완료적 인과를 살려 옮겼습니다.
theological_decisions:
- issue: ‘no man’의 한국어 처리와 성중립화 여부
  chosen_reading: 본문의 일반적 금지를 자연스럽게 드러내기 위해 ‘아무도’로 옮겼습니다.
  alternative_readings:
  - 남자는
  - 사람은
  rationale: 히브리어 אִישׁ은 남성형이지만 여기서는 일반적 인간을 가리키는 용례이므로, 한국어 독자에게는 금지의 범위를 가장 명확하게 전달하는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
- issue: 신적 직설 인용의 존댓말
  chosen_reading: 직접 인용 안에서 하나님이 말씀하신 부분은 한국어 서술체와 구분되는 표준 합쇼체로 유지했습니다.
  alternative_readings:
  - 반말형 직접화법
  - 비격식 구어체
  rationale: 본문은 예언적 계시 서술이므로, 한국어 본문 전체의 문체 일관성을 유지하되 하나님의 말씀은 존중을 드러내는 형식으로 처리했습니다.
  doctrine_reference: POB Korean style guideline
