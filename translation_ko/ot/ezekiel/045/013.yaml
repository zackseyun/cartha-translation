id: EZK.45.13
reference: Ezekiel 45:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֹ֥את הַ/תְּרוּמָ֖ה אֲשֶׁ֣ר תָּרִ֑ימוּ שִׁשִּׁ֤ית הָֽ/אֵיפָה֙ מֵ/חֹ֣מֶר הַֽ/חִטִּ֔ים וְ/שִׁשִּׁיתֶם֙ הָֽ/אֵיפָ֔ה מֵ/חֹ֖מֶר הַ/שְּׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/013.yaml
  text: 'This is the contribution that you shall offer: one-sixth of an ephah from each homer of wheat[a], and one-sixth of an ephah from each homer of barley.'
  footnotes:
  - marker: a
    text: An ephah and a homer are ancient units of dry measure; the verse specifies a fixed grain contribution of one-sixth of an ephah per homer.
    reason: cultural_note
translation:
  language: ko
  text: 여러분이 바쳐야 할 헌납분은 이러합니다. 밀 한 호멜마다 에바 육분의 일을, 보리 한 호멜마다도 에바 육분의 일을 바치십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에바와 호멜은 고대의 건량 단위입니다. 이 절은 밀 한 호멜과 보리 한 호멜마다 각각 에바 육분의 일을 헌납하도록 규정합니다.
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמָה
  english_pob_choice: contribution
  chosen_korean: 예물
  alternatives_korean:
  - 공물
  - 봉헌물
  - 헌납분
  lexicon: HALOT
  rationale: 이 문맥의 תְּרוּמָה는 성전 제의의 일반적 '제물'보다, 측정된 몫으로 바쳐야 하는 지정분에 가깝습니다. 한국어에서는 행정적·제의적 성격을 함께 살릴 수 있는 '예물'이 가장 자연스럽습니다.
- source_word: תָּרִימוּ
  english_pob_choice: you shall offer
  chosen_korean: 바쳐야 할
  alternatives_korean:
  - 드려야 할
  - 올려 바쳐야 할
  - 헌상해야 할
  lexicon: HALOT
  rationale: 히필형의 관용적 의미가 '들어 올리다'보다 '바치다/드리다'에 가깝기 때문에, 정해진 몫을 제의적으로 내는 뜻을 살려 '바치다'를 썼습니다.
- source_word: שִׁשִּׁית
  english_pob_choice: one-sixth
  chosen_korean: 여섯째 몫
  alternatives_korean:
  - 육분의 일
  - 여섯 분의 하나
  - 1/6
  lexicon: HALOT
  rationale: 분수 자체는 '육분의 일'로 풀 수 있지만, 예물의 할당분이라는 행정적 뉘앙스를 살리기 위해 '여섯째 몫'으로 자연화했습니다.
- source_word: אֵיפָה
  english_pob_choice: ephah
  chosen_korean: 에바
  alternatives_korean:
  - 에파
  - 곡물단위
  lexicon: HALOT
  rationale: 고대 건량 단위는 음역을 유지해야 정확성이 보존됩니다. 한국어 성서 표기에서 통용되는 '에바'를 채택했습니다.
- source_word: חֹמֶר
  english_pob_choice: homer
  chosen_korean: 호멜
  alternatives_korean:
  - 호메르
  - 곡물단위
  lexicon: HALOT
  rationale: 또 다른 고대 용량 단위이므로 음역을 유지했습니다. 한국어 성서 관례에 맞는 '호멜'이 가장 안정적입니다.
- source_word: מֵ/חֹמֶר
  english_pob_choice: from each homer
  chosen_korean: 호멜마다
  alternatives_korean:
  - 호멜에서
  - 호멜당
  lexicon: HALOT
  rationale: 분배 규정을 뜻하므로 단순한 출처보다 분배 단위가 드러나는 '마다'를 사용해 영어 POB의 distributive sense를 반영했습니다.
theological_decisions:
- issue: 측정된 곡물 공물의 성격
  chosen_reading: 본문을 일반적인 자원 헌납이 아니라, 정해진 비율로 산정되는 성전 예물 규정으로 읽었습니다.
  alternative_readings:
  - 단순한 농산물 기부 규정
  - 상징적 헌신 표현
  rationale: 문맥상 수량과 단위가 핵심이므로, 상징화하거나 완화하지 않고 제의적·행정적 규정으로 드러내는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: Ezekiel 45:13-15의 성전 질서 규정
- issue: 분수 표현의 한국어화
  chosen_reading: '''one-sixth''를 문자적으로 옮기되, 한국어에서는 ''여섯째 몫''으로 표현했습니다.'
  alternative_readings:
  - 육분의 일
  - 1/6
  rationale: 수학적 정확성은 유지하면서도, 제의적 할당 규정이라는 문맥에서 더 읽기 자연스럽고 이해하기 쉬운 표현을 선택했습니다.
  doctrine_reference: 성전 헌납/예물 규정
