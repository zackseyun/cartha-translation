revisions:
- from: 이것은 여러분이 바쳐야 할 예물입니다. 곡식으로는 밀 한 호멜마다 에바의 여섯째 몫을, 보리로는 호멜마다 에바의 여섯째 몫을 바치십시오.[a]
  to: 여러분이 바쳐야 할 헌납분은 이러합니다. 밀 한 호멜마다 에바 육분의 일을, 보리 한 호멜마다도 에바 육분의 일을 바치십시오.[a]
  rationale: 원문의 분수와 병행 구조를 명료하게 보존하고, 정해진 바침의 몫이라는 תְּרוּמָה의 문맥적 의미를 자연스러운 현대 한국어로 드러냈습니다. 원문에서 논의될 수 있는 두 번째 분수형의 형태는 영어 POB의 판단을 따라 앞 항목과 병행되는 ‘육분의 일’로 옮겼으며, 별도의 해석적 확장은 하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:45:03Z'
