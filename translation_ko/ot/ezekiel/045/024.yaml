id: EZK.45.24
reference: Ezekiel 45:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִנְחָ֗ה אֵיפָ֥ה לַ/פָּ֛ר וְ/אֵיפָ֥ה לָ/אַ֖יִל יַֽעֲשֶׂ֑ה וְ/שֶׁ֖מֶן הִ֥ין לָ/אֵיפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/024.yaml
  text: And as the grain offering[a], he shall provide an ephah for each bull and an ephah for each ram, and a hin of oil for each ephah.
  footnotes:
  - marker: a
    text: Or 'he shall make' or 'he shall prepare'; the Hebrew verb is literally 'do/make' and in sacrificial context can refer to preparing or providing the required offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 소제물로는, 수송아지마다 에바 한 개, 숫양마다 에바 한 개를 드리고, 에바 한 개마다 기름 한 힌을 드리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 만들어야 합니다’ 혹은 ‘그가 준비해야 합니다’; 히브리어 동사는 문자적으로는 ‘하다/만들다’이며, 제의 문맥에서는 요구되는 제물을 마련해 바치는 뜻으로 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנְחָה
  english_pob_choice: grain offering
  chosen_korean: 소제물
  alternatives_korean:
  - 곡식제물
  - 곡식 예물
  - 헌물
  lexicon: HALOT
  rationale: 제의 문맥의 מִנְחָה는 단순한 ‘예물’보다 제의적 ‘소제물’이 더 정확하며, 본문이 곡물 제사의 규정을 다루므로 전통적이지만 의미를 분명히 하는 표지로 사용했습니다.
- source_word: אֵיפָה
  english_pob_choice: ephah
  chosen_korean: 에바
  alternatives_korean:
  - 에바(한 단위)
  - 되
  - 약 22리터
  lexicon: HALOT
  rationale: 에바는 성막/성전 규정의 전문 측량단위이므로 현대 환산값보다 음역을 유지해 본문의 제의적 정밀성을 살렸습니다.
- source_word: לַפָּר / לָאַיִל
  english_pob_choice: for each bull / for each ram
  chosen_korean: 수송아지마다 / 숫양마다
  alternatives_korean:
  - 각 수송아지마다 / 각 숫양마다
  - 수송아지 한 마리마다 / 숫양 한 마리마다
  lexicon: HALOT
  rationale: 히브리어 ל의 분배적 용법을 한국어 ‘-마다’로 자연스럽게 옮겨, 제의 규정이 동물 한 마리당 얼마를 바쳐야 하는지 분명하게 드러냈습니다.
- source_word: יַעֲשֶׂה
  english_pob_choice: he shall provide
  chosen_korean: 드리십시오
  alternatives_korean:
  - 준비해야 합니다
  - 제공해야 합니다
  - 만들어야 합니다
  lexicon: HALOT
  rationale: עשה는 문자적으로 ‘하다/만들다’이지만 제의 규정에서는 필요한 예물을 ‘마련하여 바치다’의 뜻으로 읽히므로, 한국어에서는 예배·제의 문맥에 맞는 ‘드리십시오’로 옮겼습니다.
- source_word: הִין
  english_pob_choice: hin
  chosen_korean: 힌
  alternatives_korean:
  - 힌(한 단위)
  - 약 3.7리터
  lexicon: HALOT
  rationale: 기름의 액량 단위를 그대로 보존하기 위해 음역을 유지했습니다.
theological_decisions:
- issue: 제의 규정에서 동물마다 정해진 소제와 기름의 비율을 어떻게 드러낼지
  chosen_reading: 본문의 규격성과 반복성을 살려 ‘수송아지마다… 숫양마다… 에바 한 개마다 기름 한 힌’으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 현대식으로 ‘각 수송아지에…’처럼 풀어 쓰기
  - 일반적인 ‘제물’로 넓혀 번역하기
  rationale: 이 절은 제의 절차의 정확한 배분을 제시하므로, 비율과 단위의 반복을 희석하지 않는 것이 본문의 의도에 더 충실합니다.
  doctrine_reference: 제의법/성전 규정의 정확성
