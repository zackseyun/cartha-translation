id: EZK.45.5
reference: Ezekiel 45:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/חֲמִשָּׁ֨ה וְ/עֶשְׂרִ֥ים אֶ֨לֶף֙ אֹ֔רֶךְ וַ/עֲשֶׂ֥רֶת אֲלָפִ֖ים רֹ֑חַב יהיה לַ/לְוִיִּם֩ מְשָׁרְתֵ֨י הַ/בַּ֧יִת לָ/הֶ֛ם לַ/אֲחֻזָּ֖ה עֶשְׂרִ֥ים לְשָׁכֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/005.yaml
  text: And an area twenty-five thousand long and ten thousand wide shall be for the Levites[a], the ministers of the house, for their possession[b], with twenty chambers.
  footnotes:
  - marker: a
    text: Or possibly, 'as their possession for twenty chambers/rooms.' The final phrase is syntactically difficult in Hebrew.
    reason: alternative_reading
  - marker: b
    text: '''The house'' here refers to the temple.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 길이 이만오천, 너비 일만인 구역은 그 집에서 섬기는 레위 사람들에게 그들의 소유로 주어질 것이며, 스무 개의 방이 딸려 있을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 여기서 성전을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 마지막 구절은 히브리어 문장 구조가 다소 압축되어 있습니다. ‘스무 개의 방이 딸려 있을 것입니다’로 옮길 수 있으며, 또는 ‘그들의 소유로서 스무 개의 방을 위한 것’으로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַחֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  english_pob_choice: twenty-five thousand
  chosen_korean: 이만오천
  alternatives_korean:
  - 오만
  - 스물다섯 천
  lexicon: HALOT
  rationale: 히브리어의 ‘다섯과 스무’식 수사는 현대 한국어에서는 자연스럽게 ‘이만오천’으로 옮기는 것이 가장 정확하고 읽기 쉽습니다.
- source_word: אֹרֶךְ / רֹחַב
  english_pob_choice: long / wide
  chosen_korean: 길이 / 너비
  alternatives_korean:
  - 긴 / 넓은
  - 길이로 / 너비로
  lexicon: HALOT
  rationale: 두 차원의 측정어이므로 명사형 ‘길이, 너비’로 살려 수치 표현의 기능을 분명히 했습니다.
- source_word: לַלוִיִּם מְשָׁרְתֵי הַבַּיִת
  english_pob_choice: for the Levites, the ministers of the house
  chosen_korean: 레위 사람들, 곧 집의 일꾼들
  alternatives_korean:
  - 레위 사람들, 곧 집의 봉사자들
  - 레위인들, 곧 성전에서 섬기는 자들
  lexicon: HALOT
  rationale: מְשָׁרְתֵי는 제사장적 ‘봉사/섬김’의 수행자를 가리키지만, 한국어 ‘일꾼’은 직분화된 교회 용어를 덜 불러오면서 기능을 잘 드러냅니다.
- source_word: הַבַּיִת
  english_pob_choice: the house
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 그 집
  lexicon: HALOT
  rationale: 직역하면 ‘집’이지만 에스겔 문맥상 성전이 가리켜진다는 점을 본문 안의 직역을 해치지 않는 범위에서 유지했습니다.
- source_word: לָהֶם לַאֲחֻזָּה
  english_pob_choice: for their possession
  chosen_korean: 그들의 소유로서
  alternatives_korean:
  - 그들의 소유가 될
  - 그들에게 소유로
  lexicon: HALOT
  rationale: אֲחֻזָּה는 토지·분깃으로서의 소유를 뜻하므로, 소유권/분깃의 느낌을 살려 ‘그들의 소유로서’로 옮겼습니다.
- source_word: עֶשְׂרִים לְשָׁכֹת
  english_pob_choice: with twenty chambers
  chosen_korean: 스무 개의 방
  alternatives_korean:
  - 스무 칸
  - 스무 개의 방들
  lexicon: HALOT
  rationale: לְשָׁכֹת는 성전 구역의 방/칸을 가리키므로 한국어 성경에서 이해하기 쉬운 ‘방’을 선택했습니다.
theological_decisions:
- issue: הַבַּיִת의 지시 대상
  chosen_reading: 본문의 ‘집’은 성전을 가리키는 표현으로 이해하되, 본문 번역에서는 설명을 덧붙이지 않고 직역을 유지했습니다.
  alternative_readings:
  - 본문에서 곧바로 ‘성전’으로 풀어 쓰기
  - ‘궁전’으로 이해하기
  rationale: 에스겔서는 ‘집’이라는 표현을 성전 지칭으로 반복 사용하므로, 본문은 원어의 표현을 보존하고 독자가 문맥으로 파악하도록 두는 편이 source-direct합니다.
  doctrine_reference: 에스겔 40–48장의 성전 환상 문맥
