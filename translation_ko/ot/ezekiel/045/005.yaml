  to: 그리고 길이 이만오천, 너비 일만인 구역은 그 집에서 섬기는 레위 사람들에게 그들의 소유로 주어질 것이며, 스무 개의 방이 딸려 있을 것입니다.[a][b]
  rationale: 성전 봉사자를 가리키는 표현을 현대 한국어의 자연스러운 문어체로 바로잡고, 소유와 방에 관한 문장 연결을 다듬었습니다. 히브리어 마지막 구절의 구문적 불확실성은 해소된 것으로 단정하지 않고 대안 독법을 각주에 유지했습니다.
