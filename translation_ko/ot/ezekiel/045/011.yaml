theological_decisions:
- issue: 도량형 규정의 의미를 어떻게 살릴 것인가
  chosen_reading: 단순한 설명이 아니라, 성전 체계 안에서 공적이고 고정된 규격을 제정하는 규정으로 번역했습니다.
  alternative_readings:
  - 서술적으로만 '같은 양'이라고 완화하는 번역
  - 현대적 단위 감각에 맞춰 풀어쓰는 번역
  rationale: 본문은 두 도량형의 동일한 표준을 법규처럼 규정하므로, 정해진 기준성과 규범성을 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 성전 규례와 공적 기준의 일관성(겔 45장의 문맥)
