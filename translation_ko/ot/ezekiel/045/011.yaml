- source_word: חֹמֶר
  english_pob_choice: homer
  chosen_korean: 호멜
  alternatives_korean:
  - 호메르
  - 고르
  lexicon: HALOT
  rationale: 히브리어 도량형명은 음역을 유지하는 것이 원문 투명성과 주해 가능성에 가장 적합합니다.
- source_word: מַתְכֻּנְתּוֹ
  english_pob_choice: their standard
  chosen_korean: 그 기준
