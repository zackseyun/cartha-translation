  rationale: 본문은 두 도량형의 동일한 표준을 법규처럼 규정하므로, 정해진 기준성과 규범성을 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 성전 규례와 공적 기준의 일관성(겔 45장의 문맥)
