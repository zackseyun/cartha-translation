- from: 에바와 밧은 같은 기준으로 되어야 합니다[a]. 곧 밧은 한 호멜의 십분의 일을 담고, 에바도 한 호멜의 십분의 일을 담아야 합니다[b][c]. 그 기준은 호멜에 따라야 합니다.
  to: 에바와 밧은 동일한 정량이어야 합니다[a]. 곧 밧은 호멜의 십분의 일을 담을 수 있어야 하고, 에바도 호멜의 십분의 일을 담을 수 있어야 합니다[b][c]. 그 정량은 호멜에 따라야 합니다.
  rationale: 용량 단위의 규정이라는 원문의 중심을 ‘동일한 정량’과 병행된 ‘담을 수 있어야 합니다’로 분명히 했습니다. 호멜을 기준으로 하는 마지막 문장과, 코르라는 전통적 다른 명칭을 알리는 각주도 유지했습니다.
