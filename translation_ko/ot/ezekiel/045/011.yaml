  lexicon: HALOT
  rationale: 문맥상 두 단위의 동일한 규격을 말하므로, 단순한 '양'보다 규범적 기준을 드러내는 표현이 더 정확합니다.
- source_word: מַעְשַׂר הַחֹמֶר / עֲשִׂירִת הַחֹמֶר
  english_pob_choice: a tenth of a homer
  chosen_korean: 한 호멜의 십분의 일
