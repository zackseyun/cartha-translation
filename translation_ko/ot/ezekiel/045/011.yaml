  text: הָ/אֵיפָ֣ה וְ/הַ/בַּ֗ת תֹּ֤כֶן אֶחָד֙ יִֽהְיֶ֔ה לָ/שֵׂ֕את מַעְשַׂ֥ר הַ/חֹ֖מֶר הַ/בָּ֑ת וַ/עֲשִׂירִ֤ת הַ/חֹ֨מֶר֙ הָֽ/אֵיפָ֔ה אֶל הַ/חֹ֖מֶר יִהְיֶ֥ה מַתְכֻּנְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/011.yaml
  text: The ephah and the bath shall be of one measure[a], so that the bath may hold a tenth of a homer, and the ephah a tenth of a homer[c][b]; their standard shall be according to the homer.
  footnotes:
  - marker: a
    text: Or 'their fixed proportion shall be according to the homer.'
    reason: lexical_alternative
  - marker: b
    text: A homer was a larger standard measure; both the ephah (dry measure) and the bath (liquid measure) were set at one-tenth of it.
    reason: cultural_note
  - marker: c
    text: '''Cor'' is a traditional alternative name for the homer.'
    reason: alternative_reading
translation:
  language: ko
  text: 에바와 밧은 같은 기준으로 되어야 합니다[a]. 곧 밧은 한 호멜의 십분의 일을 담고, 에바도 한 호멜의 십분의 일을 담아야 합니다[b][c]. 그 기준은 호멜에 따라야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 정해진 비율은 호멜에 따라야 합니다.’
    reason: alternative_reading
  - marker: b
    text: 호멜은 더 큰 고대 도량형으로, 에바(마른 곡식 측량)와 밧(액체 측량)은 그 십분의 일로 정해졌습니다.
    reason: cultural_note
  - marker: c
    text: ‘코르’는 호멜의 전통적 대체 명칭입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֵיפָה / הַבַּת
  english_pob_choice: The ephah and the bath
  chosen_korean: 에바와 밧
