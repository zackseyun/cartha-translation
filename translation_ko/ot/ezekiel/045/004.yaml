  text: קֹ֣דֶשׁ מִן הָ/אָ֜רֶץ ה֗וּא לַ/כֹּ֨הֲנִ֜ים מְשָׁרְתֵ֤י הַ/מִּקְדָּשׁ֙ יִֽהְיֶ֔ה הַ/קְּרֵבִ֖ים לְ/שָׁרֵ֣ת אֶת יְהוָ֑ה וְ/הָיָ֨ה לָ/הֶ֤ם מָקוֹם֙ לְ/בָ֣תִּ֔ים וּ/מִקְדָּ֖שׁ לַ/מִּקְדָּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/004.yaml
  text: It is a holy portion of the land; it shall be for the priests[a], the ministers of the sanctuary, who draw near to minister to Yahweh. And it shall be for them as a place for houses and as a holy place for the sanctuary.
  footnotes:
  - marker: a
    text: Or 'and a holy place for the sanctuary'; the Hebrew expression is compact and may refer to a consecrated area belonging to the sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 땅에서 떼어 낸 거룩한 몫입니다. 그것은 성소에서 섬기는 제사장들, 곧 야훼를 섬기려고 가까이 나아가는 자들의 몫이 될 것입니다. 그것은 그들에게 집들을 위한 곳과 성소를 위한 거룩한 곳이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소를 위한 거룩한 구역’으로 옮길 수 있습니다. 히브리어 표현은 압축적이며, 성소에 속하거나 성소를 위해 구별된 공간을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֶשׁ מִן הָאָרֶץ
  english_pob_choice: a holy portion of the land
  chosen_korean: 땅의 거룩한 몫
  alternatives_korean:
  - 땅에서 떼어 낸 거룩한 몫
  - 거룩한 땅의 몫
  - 성스러운 구역
  lexicon: HALOT
  rationale: 여기서 קֹדֶשׁ은 추상적 ‘거룩함’이 아니라 땅에서 따로 구분된 할당분이므로, ‘몫’으로 분배의 의미를 살리고 ‘거룩한’으로 성별됨을 드러냈습니다.
- source_word: לַכֹּהֲנִים מְשָׁרְתֵי הַמִּקְדָּשׁ
  english_pob_choice: for the priests, the ministers of the sanctuary
  chosen_korean: 성소의 일꾼인 제사장들에게
  alternatives_korean:
  - 성소의 봉사자들인 제사장들에게
  - 성전의 사역자들인 제사장들에게
  lexicon: HALOT
  rationale: מְשָׁרְתֵי는 제의적 봉사를 하는 자들을 가리키므로 ‘일꾼’으로 옮겨, 교회 직분 용어를 불필요하게 떠올리지 않게 했습니다.
- source_word: הַקְּרֵבִים לְשָׁרֵת אֶת יְהוָה
  english_pob_choice: who draw near to minister to Yahweh
  chosen_korean: 곧 야훼를 섬기려고 가까이 나아가는 자들
  alternatives_korean:
  - 야훼를 섬기려고 나아오는 자들
  - 야훼께 봉사하려고 가까이 오는 자들
  lexicon: HALOT
  rationale: הַקְּרֵבִים의 제의적 ‘가까이 나아감’을 살려 ‘가까이 나아가는 자들’로 옮겼고, לְשָׁרֵת는 문맥상 제사장적 봉사를 뜻하므로 ‘섬기다’로 자연스럽게 처리했습니다.
- source_word: מָקוֹם לְבָתִּים
  english_pob_choice: a place for houses
  chosen_korean: 집들을 위한 자리
  alternatives_korean:
  - 집들을 위한 장소
  - 거처들을 위한 자리
  - 주택을 위한 자리
  lexicon: HALOT
  rationale: בתים를 직역해 ‘집들’로 두되, 실제 배정 공간을 뜻하므로 ‘자리’로 풀어 주었습니다.
- source_word: וּמִקְדָּשׁ לַמִּקְדָּשׁ
  english_pob_choice: and as a holy place for the sanctuary
  chosen_korean: 성소를 위한 거룩한 구역
  alternatives_korean:
  - 성소를 위한 거룩한 곳
  - 성소를 위한 성별된 구역
  - 성소를 위한 거룩한 공간
  lexicon: HALOT
  rationale: 이 짧은 구절은 성소에 속한 성별된 구획을 가리키므로, ‘구역’으로 공간성을 살리고 ‘거룩한’으로 קדש의 중복을 반영했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: Project default
  rationale: 본문의 신명문을 한국어 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 고유한 언약 이름을 보존했습니다.
theological_decisions:
- issue: 제사장직과 성소 봉사의 묘사
  chosen_reading: 제사장들을 단순한 직무 인력이 아니라 성소에 가까이 나아가 야훼를 섬기는 제의적 봉사자로 표현했습니다.
  alternative_readings:
  - 교회식 직분 용어로 일반화하는 읽기
  - 그냥 ‘섬기는 자들’로 약화하는 읽기
  rationale: 에스겔의 문맥은 성전 질서와 제의적 접근을 강조하므로, 이를 한국어에서도 흐리지 않도록 했습니다.
