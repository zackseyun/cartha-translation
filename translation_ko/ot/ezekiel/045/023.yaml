lexical_decisions:
- source_word: וְ/שִׁבְעַ֨ת יְמֵֽי הֶ/חָ֜ג
  english_pob_choice: During the seven days of the feast
  chosen_korean: 절기의 이레 동안
  alternatives_korean:
  - 그 절기의 일곱 날 동안
  - 명절의 이레 동안
  lexicon: HALOT
  rationale: חַג는 제의적 절기/명절을 가리키며, 문맥상 기간을 자연스럽게 드러내기 위해 ‘절기’와 ‘이레 동안’을 사용했습니다.
- source_word: יַעֲשֶׂ֧ה עוֹלָ֣ה
  english_pob_choice: he shall provide as a burnt offering
  chosen_korean: 번제물을 드려야 합니다
  alternatives_korean:
  - 번제물을 바쳐야 합니다
  - 번제물로 준비해야 합니다
  lexicon: HALOT
  rationale: 제의 문맥의 עָשָׂה를 한국어에서는 제물 행위에 맞게 ‘드리다’로 옮기는 것이 가장 자연스럽고, עוֹלָה는 정착된 용어인 ‘번제물’로 번역했습니다.
- source_word: לַֽ/יהוָ֗ה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: 본문의 여호와 이름을 POB 기준에 따라 ‘야훼’로 옮기고, 여격 표지를 살려 ‘-께’를 붙였습니다.
- source_word: תְּמִימִם
  english_pob_choice: without blemish
  chosen_korean: 흠 없는
  alternatives_korean:
  - 결점 없는
  - 온전한
  lexicon: HALOT
  rationale: 제의적으로 합당한 제물의 자격을 나타내는 말이므로, 표준적이고 간결한 ‘흠 없는’을 선택했습니다.
- source_word: חַטָּ֕את שְׂעִ֥יר עִזִּ֖ים
  english_pob_choice: a sin offering a male goat
  chosen_korean: 속죄제물로 숫염소 한 마리를
  alternatives_korean:
  - 속죄제물로 한 숫염소를
  - 죄제물로 숫염소 한 마리를
  lexicon: HALOT
  rationale: חַטָּאת은 문맥상 제물의 종류를 가리키므로 ‘속죄제물’로 풀고, שְׂעִיר עִזִּים은 자연스러운 한국어 제의 표현인 ‘숫염소 한 마리’로 옮겼습니다.
theological_decisions:
