  text: During the seven days of the feast he shall provide as a burnt offering to Yahweh seven bulls and seven rams without blemish each day for the seven days[b][a], and as a sin offering one male goat each day.
  footnotes:
  - marker: a
    text: Or 'festival' for 'feast.'
    reason: lexical_alternative
  - marker: b
    text: Or 'purification offering' for 'sin offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 절기의 이레 동안[a], 그는 야훼께 번제물로 날마다 흠 없는 수소 일곱 마리와 숫양 일곱 마리를 드려야 합니다. 또 날마다 속죄제물로[b] 숫염소 한 마리를 드려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘명절’이라고 할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정결 제물’이라고 옮길 수 있습니다.
    reason: lexical_alternative
