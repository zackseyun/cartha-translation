id: EZK.45.21
reference: Ezekiel 45:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ֠/רִאשׁוֹן בְּ/אַרְבָּעָ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֔דֶשׁ יִהְיֶ֥ה לָ/כֶ֖ם הַ/פָּ֑סַח חָ֕ג שְׁבֻע֣וֹת יָמִ֔ים מַצּ֖וֹת יֵאָכֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/021.yaml
  text: In the first month[a], on the fourteenth day of the month, you shall have the Passover, a feast of seven days[b]; unleavened bread shall be eaten.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the Passover, a feast of seven days.' Elsewhere the Passover and the Feast of Unleavened Bread can be distinguished, but here the text presents them together.
    reason: alternative_reading
  - marker: b
    text: Or 'for seven days.' The Hebrew expression is literally 'weeks of days,' an idiom here meaning a seven-day period.
    reason: lexical_alternative
translation:
  language: ko
  text: 첫째 달, 곧 그 달 열나흗날에는 너희가 유월절[a], 곧 칠 일 동안의 절기[b]를 지켜야 합니다. 무교병을 먹어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘유월절, 칠 일의 절기’라고 말합니다. 다른 곳에서는 유월절과 무교절을 구별할 수 있지만, 여기서는 함께 제시됩니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘칠 일간의 절기’. 히브리어 표현은 문자적으로 ‘날들의 주들’이며, 여기서는 칠 일의 기간을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרִאשׁוֹן
  english_pob_choice: In the first month
  chosen_korean: 첫째 달
  alternatives_korean:
  - 첫째 달에
  - 첫 달
  lexicon: HALOT
  rationale: 달력 표현이므로 ‘첫째’는 순서를, ‘달’은 문맥상 보충되는 명사를 자연스럽게 드러냅니다.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  english_pob_choice: on the fourteenth day of the month
  chosen_korean: 그 달의 열나흗날
  alternatives_korean:
  - 그 달의 열네째 날
  - 열나흗날
  lexicon: HALOT
  rationale: 히브리어의 날짜 공식이므로 한국어에서도 관용적인 날짜 표기로 옮기되, ‘그 달’로 문맥을 분명히 했습니다.
- source_word: הַפָּסַח
  english_pob_choice: the Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 그 유월절
  - 유월절 절기
  lexicon: HALOT
  rationale: 한국어 성경에서 확립된 절기명인 ‘유월절’을 사용해 독자가 즉시 절기를 식별하도록 했습니다.
- source_word: חָג שְׁבֻעוֹת יָמִים
  english_pob_choice: a feast of seven days
  chosen_korean: 일주일 동안의 절기
  alternatives_korean:
  - 일곱 날의 절기
  - 칠 일간의 절기
  lexicon: HALOT
  rationale: 직역의 ‘일곱 날’도 가능하지만, כאן은 기간 관용구를 한국어에서 자연스럽고 명확하게 풀어 ‘일주일 동안’으로 옮겼습니다. 단, 본문이 유월절과 별도 절기를 분리하지 않고 함께 제시하는 점은 유지했습니다.
- source_word: מַצּוֹת יֵאָכֵל
  english_pob_choice: unleavened bread shall be eaten
  chosen_korean: 무교병을 먹어야 합니다
  alternatives_korean:
  - 무교병이 먹혀야 합니다
  - 누룩 없는 떡을 먹어야 합니다
  lexicon: HALOT
  rationale: 문맥상 유월절 규례의 식품 규정이므로 전통적으로 쓰이는 ‘무교병’을 택했고, 수동형의 명령적 뉘앙스를 한국어 의무형으로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 유월절과 칠일 절기의 관계
  chosen_reading: 유월절을 칠일 절기로 완전히 분리하지 않고, 본문이 제시하는 결합된 방식 그대로 옮겼습니다.
  alternative_readings:
  - 유월절과 무교절을 두 개의 절기로 분리하여 번역함
  - ‘유월절 절기’라는 단일 명칭으로 완전히 합침
  rationale: 히브리어는 ‘유월절, 일곱 날의 절기’라는 병렬적 제시를 사용하므로, 후대의 더 엄격한 구분을 번역에 미리 주입하지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
