  text: וְ/הַ/שֶּׁ֖קֶל עֶשְׂרִ֣ים גֵּרָ֑ה עֶשְׂרִ֨ים שְׁקָלִ֜ים חֲמִשָּׁ֧ה וְ/עֶשְׂרִ֣ים שְׁקָלִ֗ים עֲשָׂרָ֤ה וַ/חֲמִשָּׁה֙ שֶׁ֔קֶל הַ/מָּנֶ֖ה יִֽהְיֶ֥ה לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/012.yaml
  text: And the shekel shall be twenty gerahs[a]; twenty shekels, twenty-five shekels[b], and fifteen shekels shall be your mina.
  footnotes:
  - marker: a
    text: The Hebrew lists the mina as 'twenty shekels, twenty-five shekels, and fifteen shekels'—that is, a total of sixty shekels. This differs from other ancient reckonings of the mina and likely reflects a specific standard in Ezekiel's temple legislation.
    reason: cultural_note
  - marker: b
    text: Or 'maneh.' The Hebrew term refers to a larger unit of weight or money.
    reason: lexical_alternative
translation:
  language: ko
  text: 세겔은 스무 게라입니다. 스무 세겔, 스물다섯 세겔, 열다섯 세겔이 너희의 마네가 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 마네를 ‘스무 세겔, 스물다섯 세겔, 열다섯 세겔’로 열거하며, 합계는 예순 세겔입니다. 이는 다른 고대의 마네 환산과 다르며, 에스겔의 성전 규례 안에서의 특정 기준을 반영하는 것으로 보입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘미나’. 히브리어 용어는 더 큰 무게 또는 화폐 단위를 가리킵니다.
    reason: lexical_alternative
