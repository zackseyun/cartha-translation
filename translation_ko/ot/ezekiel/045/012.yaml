  lexicon: HALOT
  rationale: 현대 한국어의 표준 수사로 옮겼습니다.
- source_word: הַמָּנֶה
  english_pob_choice: your mina
  chosen_korean: 너희의 마네
  alternatives_korean:
  - 너희의 미나
  - 너희의 마네야
  lexicon: HALOT
  rationale: 이 항목은 POB의 주석처럼 더 큰 무게·화폐 단위인 ‘mina’를 가리키므로, 음역을 유지해 단위 체계를 보존했습니다. 본문은 ‘너희의’로 수신자에게 주어진 규격임을 살렸습니다.
- source_word: יִהְיֶה לָכֶם
  english_pob_choice: shall be your
