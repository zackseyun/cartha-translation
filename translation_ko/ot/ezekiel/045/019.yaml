id: EZK.45.19
reference: Ezekiel 45:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֣ם הַ/חַטָּ֗את וְ/נָתַן֙ אֶל מְזוּזַ֣ת הַ/בַּ֔יִת וְ/אֶל אַרְבַּ֛ע פִּנּ֥וֹת הָ/עֲזָרָ֖ה לַ/מִּזְבֵּ֑חַ וְ/עַ֨ל מְזוּזַ֔ת שַׁ֖עַר הֶ/חָצֵ֥ר הַ/פְּנִימִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/019.yaml
  text: And the priest shall take some of the blood of the sin offering and put it on the doorposts of the temple[a], on the four corners of the altar ledge, and on the doorposts of the gate of the inner court.
  footnotes:
  - marker: a
    text: Or 'purification offering.' The Hebrew term can denote the offering associated with sin and cleansing in sacrificial contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 속죄제[a]의 피를 조금 가져다가 성전의 문설주와 제단 받침대의 네 모퉁이와 안뜰 문설주에 바를 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제’. 히브리어 용어는 제의 문맥에서 죄와 정결과 관련된 제물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  english_pob_choice: shall take
  chosen_korean: 가져다가
  alternatives_korean:
  - 취할 것입니다
  - 가지고 갈 것입니다
  lexicon: HALOT
  rationale: 제의적 절차에서 피의 일부를 ‘가져다가’ 다음 동작으로 옮기는 흐름을 자연스럽게 살렸습니다.
- source_word: מִדַּם הַחַטָּאת
  english_pob_choice: some of the blood of the sin offering
  chosen_korean: 속죄제의 피를 조금
  alternatives_korean:
  - 죄를 위한 제물의 피를 조금
  - 정결제의 피를 조금
  lexicon: HALOT
  rationale: חַטָּאת는 제의 문맥에서 제물 자체를 가리키므로, 전통적이고 문맥에 맞는 ‘속죄제’를 유지하되 양을 나타내는 ‘조금’을 넣어 מן의 부분성을 살렸습니다.
- source_word: מְזוּזַת הַבַּיִת
  english_pob_choice: the doorposts of the temple
  chosen_korean: 성전의 문설주
  alternatives_korean:
  - 성전 문의 기둥
  - 성전의 문기둥
  lexicon: HALOT
  rationale: מְזוּזָה는 문설주/문틀의 세로 기둥을 뜻하므로 ‘문설주’로 옮겼고, הבית는 에스겔 성전 환상 안의 건물을 가리켜 ‘성전’으로 구체화했습니다.
- source_word: הָעֲזָרָה לַמִּזְבֵּחַ
  english_pob_choice: the four corners of the ledge of the altar
  chosen_korean: 제단의 네 귀퉁이
  alternatives_korean:
  - 제단의 네 모퉁이
  - 제단의 네 끝
  lexicon: HALOT
  rationale: 여기서 עֲזָרָה는 구조물의 둘레/돌출부를 가리키는 기술적 표현이지만, 한국어로는 제단의 네 귀퉁이가 가장 직접적으로 해당 위치를 전달합니다.
- source_word: הֶחָצֵר הַפְּנִימִית
  english_pob_choice: the inner court
  chosen_korean: 안뜰
  alternatives_korean:
  - 내뜰
  - 내부 뜰
  lexicon: HALOT
  rationale: 성전 문맥의 הֶחָצֵר הַפְּנִימִית는 관용적으로 ‘안뜰’이 가장 자연스럽고 의미가 분명합니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미
  chosen_reading: ‘속죄제’로 옮겨 제물의 종류를 분명히 하되, 문맥상 정결 기능도 함께 암시하도록 유지했습니다.
  alternative_readings:
  - 정결제
  - 속죄제물
  rationale: 이 절은 피를 바르는 정결 의식을 묘사하므로, 단순히 ‘죄’가 아니라 제의적 제물을 가리키는 전통적 용례를 살리는 것이 적절합니다.
  doctrine_reference: 레 4장, 겔 43–45장의 성전 정결 맥락
