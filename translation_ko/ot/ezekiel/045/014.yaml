source:
  edition: WLC
  text: וְ/חֹ֨ק הַ/שֶּׁ֜מֶן הַ/בַּ֣ת הַ/שֶּׁ֗מֶן מַעְשַׂ֤ר הַ/בַּת֙ מִן הַ/כֹּ֔ר עֲשֶׂ֥רֶת הַ/בַּתִּ֖ים חֹ֑מֶר כִּֽי עֲשֶׂ֥רֶת הַ/בַּתִּ֖ים חֹֽמֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/014.yaml
  text: And the fixed due of oil shall be one bath of oil from each cor[a], from ten baths, that is, one homer[c][b], for ten baths are one homer.
  footnotes:
  - marker: a
    text: 'Hebrew: ''a tenth of the bath from the cor.'' The verse expresses the oil tribute as one-tenth of a cor/homer, with the following clause explaining that a homer equals ten baths.'
    reason: lexical_alternative
  - marker: b
    text: A bath, cor, and homer are ancient Israelite units of measure; the text itself notes that ten baths equal one homer.
    reason: cultural_note
  - marker: c
    text: Or 'shall be one bath of oil from each cor'.
    reason: previous_rendering
translation:
  language: ko
  text: 기름의 정한 몫은 이러합니다. 바트로 잴 때, 코르마다 바트의 십분의 일을 내야 합니다.[a] 코르는 열 바트, 곧 한 호멜입니다. 열 바트가 한 호멜이기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘코르에서 바트의 십분의 일’이라고 합니다. 이는 코르를 기준으로 바트의 십분의 일을 기름 공물로 정하는 표현입니다.
    reason: source_note
  - marker: b
    text: 바트, 코르, 호멜은 고대 이스라엘의 부피 단위입니다. 본문은 열 바트가 한 호멜과 같다고 반복하여 설명합니다.
    reason: cultural_note
lexical_decisions:
- source_word: חֹק
  english_pob_choice: fixed due
  chosen_korean: 정한 몫
  alternatives_korean:
  - 정해진 분량
  - 규정된 몫
  - 의무분
  lexicon: HALOT
  rationale: 공물·제물의 문맥에서 חֹק은 추상적 ‘규례’보다 정해져 바쳐야 할 분량이라는 뜻이 강하므로, ‘정한 몫’으로 옮겨 제도성과 의무성을 함께 살렸습니다.
- source_word: שֶּׁמֶן
  english_pob_choice: oil
  chosen_korean: 기름
  alternatives_korean:
  - 올리브기름
  - 유
  lexicon: HALOT
  rationale: 원문은 단순히 ‘기름’이라 말하며 종류를 명시하지 않으므로, 한국어도 넓은 의미의 ‘기름’을 유지했습니다.
- source_word: מַעְשַׂר
  english_pob_choice: from each
  chosen_korean: 십분의 일
  alternatives_korean:
  - 열째
  - 일할
  - 각각의
  lexicon: HALOT
  rationale: 히브리어 מַעְשַׂר는 ‘십분의 일/십일조’의 수량 관계를 드러내므로, POB의 소스 이해를 따라 분량 계산이 분명해지도록 ‘십분의 일’로 옮겼습니다.
- source_word: כֹּר / חֹמֶר / בַּת
  english_pob_choice: cor / homer / bath
  chosen_korean: 코르 / 호멜 / 바트
  alternatives_korean:
  - 코르 / 고멜 / 밧
  - 고대 히브리 부피 단위
  lexicon: HALOT
  rationale: 본문이 단위의 상호 환산을 설명하므로, 현대 환산값 대신 음역을 유지해 원문의 계량 체계를 보존했습니다.
theological_decisions:
- issue: 단위 환산 설명의 처리
  chosen_reading: “열 바트가 한 호멜”이라는 원문의 설명을 그대로 살려, 공물의 양과 환산 관계를 모두 드러냈습니다.
  alternative_readings:
  - 현대식 리터 환산으로 풀어쓰기
  - 설명 절을 생략하고 단순 수량만 제시
  rationale: 본문의 의도는 정확한 분량 규정과 그 환산 설명에 있으므로, 현대 환산으로 바꾸면 고대 계량의 본문 자체가 흐려집니다.
  doctrine_reference: 성경 본문 정확성 및 역사적-문법적 해석
