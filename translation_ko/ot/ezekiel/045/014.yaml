  source_fidelity: 현 번역은 מַעְשַׂר הַבַּת מִן־הַכֹּר(‘코르에서 바트의 십분의 일’)을 ‘각 코르에서 바트의 십분의 일’로 옮긴 점은 맞습니다. 그러나 앞부분을 ‘한 바트의 기름’이라고 단정하여, 정한 몫 자체가 한 바트인 것처럼 읽히게 합니다. 히브리어의 ‘기름의 바트’는 여기서 기름을 재는 단위의 명시로 처리하는 편이 안전합니다. 또한 원문의 반복적인 단위 등식도 보존해야 합니다.
