  terminology: ‘정한 몫’, ‘기름’, ‘바트’, ‘코르’, ‘호멜’은 적절합니다. 단위명은 음역으로 유지하고 각주에서 고대 이스라엘의 부피 단위임을 설명하는 것이 좋습니다.
