  lexicon: HALOT
  rationale: 공물·제물의 문맥에서 חֹק은 추상적 ‘규례’보다 정해져 바쳐야 할 분량이라는 뜻이 강하므로, ‘정한 몫’으로 옮겨 제도성과 의무성을 함께 살렸습니다.
- source_word: שֶּׁמֶן
