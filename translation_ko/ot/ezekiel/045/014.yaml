revisions:
- from: 그리고 기름의 정한 몫은 한 바트의 기름이며, 각 코르에서 바트의 십분의 일입니다. 즉, 열 바트가 한 호멜이므로 한 호멜입니다.[a][b]
  to: 기름의 정한 몫은 이러합니다. 바트로 잴 때, 코르마다 바트의 십분의 일을 내야 합니다.[a] 코르는 열 바트, 곧 한 호멜입니다. 열 바트가 한 호멜이기 때문입니다.[b]
  rationale: 원문을 우선하여, 공물 비율을 코르마다 바트의 십분의 일로 명확히 옮겼습니다. ‘기름의 바트’는 정한 몫의 총량을 한 바트로 선언하는 말로 처리하지 않고 측정 단위의 맥락으로 자연스럽게 반영했습니다. 또한 원문에 있는 ‘열 바트=한 호멜’의 반복을 삭제하거나 불완전한 문장으로 만들지 않고 그대로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:45:09Z'
