  lexicon: HALOT
  rationale: 원문은 단순히 ‘기름’이라 말하며 종류를 명시하지 않으므로, 한국어도 넓은 의미의 ‘기름’을 유지했습니다.
- source_word: מַעְשַׂר
  english_pob_choice: from each
  chosen_korean: 십분의 일
  alternatives_korean:
  - 열째
  - 일할
  - 각각의
  lexicon: HALOT
  rationale: 히브리어 מַעְשַׂר는 ‘십분의 일/십일조’의 수량 관계를 드러내므로, POB의 소스 이해를 따라 분량 계산이 분명해지도록 ‘십분의 일’로 옮겼습니다.
- source_word: כֹּר / חֹמֶר / בַּת
  english_pob_choice: cor / homer / bath
  chosen_korean: 코르 / 호멜 / 바트
  alternatives_korean:
