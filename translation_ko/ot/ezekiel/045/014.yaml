  - 고대 히브리 부피 단위
  lexicon: HALOT
  rationale: 본문이 단위의 상호 환산을 설명하므로, 현대 환산값 대신 음역을 유지해 원문의 계량 체계를 보존했습니다.
theological_decisions:
- issue: 단위 환산 설명의 처리
  chosen_reading: “열 바트가 한 호멜”이라는 원문의 설명을 그대로 살려, 공물의 양과 환산 관계를 모두 드러냈습니다.
  alternative_readings:
  - 현대식 리터 환산으로 풀어쓰기
  - 설명 절을 생략하고 단순 수량만 제시
  rationale: 본문의 의도는 정확한 분량 규정과 그 환산 설명에 있으므로, 현대 환산으로 바꾸면 고대 계량의 본문 자체가 흐려집니다.
  doctrine_reference: 성경 본문 정확성 및 역사적-문법적 해석
