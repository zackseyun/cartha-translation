  rationale: 본문의 לַיהוָה는 하나님의 고유 이름을 가리키므로, 프로젝트 기준에 따라 ‘야훼’로 일관되게 표기했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
