base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/001.yaml
  text: 'And when you divide the land as an inheritance[a], you shall set apart a contribution to Yahweh, a holy portion from the land: twenty-five thousand cubits in length and ten thousand in width[b]. It shall be holy within all its surrounding boundary.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''twenty-five thousand length and ten thousand width''; ''cubits'' is implied by the measurement context and supplied for clarity.'
    reason: cultural_note
  - marker: b
    text: Or 'allot the land by lot as an inheritance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 땅을 분깃으로 나눌 때에, 너희는 그 땅에서 야훼께 드릴 거룩한 구역을 따로 구분해야 합니다. 길이는 이만오천, 너비는 만인데[a], 그 모든 둘레 안에서 거룩해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘길이 이만오천, 너비 만’이라고 되어 있으며, 이 단위는 문맥상 암시됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְהַפִּילְכֶם
  english_pob_choice: when you divide
  chosen_korean: 땅을 분깃으로 나눌 때에
  alternatives_korean:
  - 제비로 땅을 나눌 때에
  - 땅을 나눌 때에
  lexicon: HALOT
  rationale: 지파별 분배 맥락을 살려 ‘분깃으로 나누다’로 옮기되, 제비의 절차를 과도하게 단정하지 않도록 했습니다.
- source_word: תָּרִימוּ תְרוּמָה
  english_pob_choice: you shall set apart a contribution
  chosen_korean: …드릴 거룩한 구역을 따로 구분해야 합니다
  alternatives_korean:
  - …봉헌물을 드려야 합니다
  - …거제물을 들어 올려야 합니다
  lexicon: HALOT
  rationale: תְרוּמָה를 예배용 전문어로 고정하기보다, 본문이 땅의 한 구역을 성별하는 뜻이므로 ‘따로 구분하다’로 풀어 현대 한국어에서 자연스럽고 정확하게 표현했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: 도기본
  rationale: 기존 프로젝트 기본값에 따라 YHWH는 ‘야훼’로 옮기고, 성별 대상이므로 여격 조사 ‘-께’를 붙였습니다.
- source_word: קֹדֶשׁ מִן הָאָרֶץ
  english_pob_choice: a holy portion from the land
  chosen_korean: 거룩한 구역을
  alternatives_korean:
  - 성별된 몫을
  - 거룩한 몫을
  lexicon: HALOT
  rationale: 여기서 קֹדֶשׁ은 단순한 성품이 아니라 땅에서 떼어 낸 성별된 영역을 가리키므로 ‘구역’이 가장 직접적입니다.
- source_word: אֹרֶךְ ... וְרֹחַב
  english_pob_choice: twenty-five thousand cubits in length and ten thousand in width
  chosen_korean: 길이는 이만오천, 너비는 만인데
  alternatives_korean:
  - 길이 이만오천, 너비 만인데
  - 이만오천 길이와 만 너비인데
  lexicon: HALOT
  rationale: 히브리어의 병렬 측정 표현을 한국어 문장으로 간결하게 살렸고, 영어 POB처럼 문맥상 암시되는 단위를 본문에 드러내지 않았습니다.
- source_word: קֹדֶשׁ הוּא
  english_pob_choice: It shall be holy
  chosen_korean: 거룩해야 합니다
  alternatives_korean:
  - 거룩합니다
  - 거룩할 것입니다
  lexicon: HALOT
  rationale: 법적·지시문 맥락을 살려 상태 서술이 아니라 규정적 의미의 ‘거룩해야 합니다’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
