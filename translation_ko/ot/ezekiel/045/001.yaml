  to: 땅을 분깃으로 나눌 때에, 너희는 그 땅에서 야훼께 바칠 거룩한 몫을 따로 떼어 놓아야 합니다. 그 길이는 이만오천이고 너비는 만입니다[a]. 그 구역 전체는 사방 경계 안에서 거룩해야 합니다.
