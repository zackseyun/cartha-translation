  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֚ל הָ/עָ֣ם הָ/אָ֔רֶץ יִהְי֖וּ אֶל הַ/תְּרוּמָ֣ה הַ/זֹּ֑את לַ/נָּשִׂ֖יא בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/016.yaml
  text: All the people of the land shall give this contribution to the prince in Israel[a][b].
  footnotes:
  - marker: a
    text: Or, more literally, 'All the people of the land shall be for this contribution to the prince in Israel.' The Hebrew idiom likely means that the people are to provide this assessed contribution for the prince.
    reason: lexical_alternative
  - marker: b
    text: '''Contribution'' translates Hebrew terumah, a set-apart portion or offering; ''offering'' or ''tribute'' are also possible depending on whether the cultic or civic aspect is emphasized.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 땅의 모든 백성은 이 예물을 이스라엘의 통치자에게 바쳐야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로는 “그 땅의 모든 백성이 이 예물을 위하여 통치자에게 속할 것이다”라는 뜻이 될 수 있습니다. 문맥상으로는 백성이 이 지정된 몫을 통치자를 위해 제공하라는 의미입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 תְּרוּמָה는 구별된 몫, 예물, 헌물, 공물 등을 가리킬 수 있습니다. 이 문맥에서는 성전과 통치자 책임이 함께 걸린 지정 예물을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הָעָם הָאָרֶץ
  english_pob_choice: All the people of the land
  chosen_korean: 그 땅의 모든 백성
  alternatives_korean:
  - 그 땅의 모든 사람들
  - 그 땅의 백성 전체
  - 그 나라의 모든 백성
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 ‘그 땅의 백성’으로 옮기되, 전체성을 드러내기 위해 ‘모든’을 붙였습니다.
- source_word: יִהְיוּ אֶל
  english_pob_choice: shall give
  chosen_korean: 바쳐야 합니다
  alternatives_korean:
  - 드려야 합니다
  - 주어야 합니다
  - 속해야 합니다
  lexicon: HALOT
  rationale: 직역하면 ‘~을 향하여/에게 있게 되다’이지만, 문맥상 지정된 예물을 제공하라는 뜻이므로 현대 한국어로는 ‘바치다’가 가장 자연스럽고 문맥을 살립니다.
- source_word: הַתְּרוּמָה
  english_pob_choice: contribution
  chosen_korean: 이 예물
  alternatives_korean:
  - 이 기여분
  - 이 헌물
  - 이 공물
  lexicon: HALOT
  rationale: תְּרוּמָה는 분리된 몫이라는 뜻이 있어, 제의적·공적 성격을 모두 품을 수 있게 일반적인 ‘예물’로 옮겼습니다. 여기서는 영어 POB의 ‘contribution’을 너무 행정적으로 좁히지 않되, 종교적 ‘희생제물’로도 과도하게 한정하지 않도록 했습니다.
- source_word: לַנָּשִׂיא
  english_pob_choice: to the prince
  chosen_korean: 통치자에게
  alternatives_korean:
  - 왕에게
  - 지도자에게
  - 군주에게
  lexicon: HALOT
  rationale: 에스겔의 נָשִׂיא는 왕이라기보다 지정된 통치자/공적 대표를 가리키므로, ‘통치자’가 가장 무난하게 그 기능을 전달합니다.
theological_decisions:
- issue: 예물을 누구에게 드린다는 의미를 어떻게 처리할지
  chosen_reading: ‘이 예물을 … 통치자에게 바쳐야 합니다’로 옮겨, 단순 귀속이 아니라 의무적 제공의 의미를 드러냈습니다.
  alternative_readings:
  - ‘이 예물은 … 통치자에게 속해야 합니다’
  - ‘이 예물은 … 통치자를 위한 것입니다’
  rationale: 히브리어의 ‘~에게 있다’는 관용구는 여기서 헌납/제공의 뜻으로 쓰이므로, 문맥상 요구되는 행위를 분명히 해야 합니다.
  doctrine_reference: Ezekiel 45:13-17의 성전 질서와 통치자 책임
- issue: ‘열방의 공물’이 아니라 ‘예물’로 둔 선택
  chosen_reading: ‘예물’로 옮겨 제의적 성격을 열어 두되, 본문이 허락하는 범위에서만 의미를 확장했습니다.
  alternative_readings:
  - ‘공물’
  - ‘헌물’
  - ‘부세’
  rationale: 이 절은 성전 관련 문맥에 속하지만 동시에 통치자에게 돌아가는 지정 몫이므로, 지나치게 종교적이거나 정치적으로만 좁히지 않는 표현이 필요합니다.
  doctrine_reference: Temple offering and civic assessment in Ezekiel
