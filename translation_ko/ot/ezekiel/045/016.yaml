  source_fidelity: 히브리어의 주어는 ‘그 땅의 모든 백성’이며, 이들이 정해진 תְּרוּמָה를 נָשִׂיא에게 제공해야 한다는 뜻입니다. 본문의 בְּיִשְׂרָאֵל은 ‘이스라엘의’로 소유 관계를 단정하기보다 ‘이스라엘 안에 있는’으로 옮기는 편이 원문에 더 충실합니다.
  naturalness: ‘그 땅의 모든 백성’과 ‘바쳐야 합니다’는 현대 표준 한국어 합쇼체에서 자연스럽습니다. 다만 ‘예물’은 자발적 선물의 뉘앙스를 띨 수 있어, 정해져 부과되는 몫이라는 문맥에는 ‘헌물’이 더 적절합니다.
  terminology: נָשִׂיא는 에스겔에서 일관되게 특정 공적 지도자를 가리키므로 ‘통치자’가 적절합니다. תְּרוּמָה는 여기서 성전 관련 목적과 공적 부담의 성격을 함께 지닌 구별된 몫이므로 ‘헌물’로 번역하고 각주에서 가능한 의미 범위를 밝혀 둡니다.
