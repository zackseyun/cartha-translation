  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה רַב לָ/כֶם֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל חָמָ֤ס וָ/שֹׁד֙ הָסִ֔ירוּ וּ/מִשְׁפָּ֥ט וּ/צְדָקָ֖ה עֲשׂ֑וּ הָרִ֤ימוּ גְרֻשֹֽׁתֵי/כֶם֙ מֵ/עַ֣ל עַמִּ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/009.yaml
  text: 'Thus says the Lord GOD: Enough from you[a], princes of Israel! Remove violence and plunder, and do justice and righteousness. Put away your evictions from my people, declares the Lord GOD.'
  footnotes:
  - marker: a
    text: Or 'your expulsions' or 'your acts of dispossession.' The Hebrew term refers to driving people out; in this context it likely includes forced removal from land or property.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 하나님께서 이렇게 말씀하십니다. 「그만하십시오, 이스라엘의 지도자들아! 폭력과 약탈을 제거하고, 공의와 의를 행하십시오. 내 백성에게서 너희의 추방을 거두십시오」— 주 하나님께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 축출’, ‘너희의 내쫓음’으로도 옮길 수 있습니다. 히브리어는 사람들을 몰아내는 행위를 가리키며, 이 문맥에서는 토지나 재산에서 강제로 내모는 뜻까지 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 하나님의 주
  lexicon: 공동 관행 및 본문 문맥
  rationale: 아도나이+야훼의 중복 존칭을 한국어에서는 자연스럽게 '주 하나님'으로 옮기되, 신적 호칭의 격을 유지했습니다.
- source_word: רַב לָכֶם
  english_pob_choice: Enough from you
  chosen_korean: 그만하십시오
  alternatives_korean:
  - 충분합니다
  - 그만두십시오
  - 이제 그만입니다
  lexicon: HALOT
  rationale: 문맥상 강한 책망과 중단 요구를 나타내므로, 현대 한국어에서 직접적이고 자연스러운 금지·중지 표현을 택했습니다.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  english_pob_choice: princes of Israel
  chosen_korean: 이스라엘의 지도자들
  alternatives_korean:
  - 이스라엘의 군주들
  - 이스라엘의 통치자들
  - 이스라엘의 왕자들
  lexicon: HALOT
  rationale: 예언서 문맥에서 נָשִׂיא는 정치적 지배층을 가리키므로, 한국어 독자가 오해 없이 이해할 수 있게 '지도자들'로 옮겼습니다.
- source_word: חָמָס וָשֹׁד
  english_pob_choice: violence and plunder
  chosen_korean: 폭력과 약탈
  alternatives_korean:
  - 포악과 약탈
  - 폭행과 탈취
  - 폭력과 탈취
  lexicon: HALOT
  rationale: חָמָס와 שֹׁד의 짝을 한국어에서 가장 직접적으로 드러내는 표현으로, 사회적 착취와 폭압의 뉘앙스를 살렸습니다.
- source_word: מִשְׁפָּט וּצְדָקָה
  english_pob_choice: justice and righteousness
  chosen_korean: 공의와 의
  alternatives_korean:
  - 정의와 의
  - 공정과 의
  - 정의와 공의
  lexicon: HALOT
  rationale: 율법적·윤리적 질서를 함께 가리키는 표준적 히브리어 쌍을 한국어의 성경적 용례에 맞게 구분해 옮겼습니다.
- source_word: הָרִימוּ גְרֻשֹׁתֵיכֶם
  english_pob_choice: Put away your evictions
  chosen_korean: 너희의 추방을 거두십시오
  alternatives_korean:
  - 너희의 축출을 치우십시오
  - 너희의 내쫓음을 거두십시오
  - 너희의 추방 행위를 거두십시오
  lexicon: HALOT
  rationale: גְרֻשׁוֹת는 사람을 몰아내는 행위를 가리키므로, '추방'으로 넓게 살리되 동사 '거두다'로 부당한 행위를 제거하라는 명령성을 유지했습니다.
theological_decisions:
- issue: 예언적 책망의 직접성
  chosen_reading: ‘그만하십시오, 이스라엘의 지도자들아!’로 강한 직접 호통을 살렸습니다.
  alternative_readings:
  - ‘충분합니다, 이스라엘의 지도자들아!’
  - ‘이제 그만입니다, 이스라엘의 지도자들아!’
  rationale: רַב לָכֶם의 책망 톤을 약화하지 않기 위해, 현대 한국어에서 자연스럽지만 날카로운 중단 명령으로 옮겼습니다.
  doctrine_reference: '예언서 번역 원칙: 경고·책망의 수사적 강도 보존'
- issue: 공의/의의 구분
  chosen_reading: ‘공의와 의’로 두 항을 구별했습니다.
  alternative_readings:
  - ‘정의와 의’
  - ‘공정과 의’
  rationale: מִשְׁפָּט와 צְדָקָה는 단순 동의 반복이 아니라 공동체 통치와 올바름을 함께 요구하는 쌍이므로, 한국어에서도 두 요소를 분리해 드러냈습니다.
  doctrine_reference: '번역 일관성 원칙: 히브리어 윤리쌍 보존'
