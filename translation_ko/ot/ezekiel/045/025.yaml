  lexicon: HALOT
  rationale: עשה + כאלה는 단순한 ‘행하다’보다 앞선 규정을 반복 이행한다는 뜻이 강하므로, 제물을 임의로 덧붙이지 않으면서도 반복 명령을 드러냈습니다.
