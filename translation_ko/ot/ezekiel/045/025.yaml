  english_pob_choice: the sin offering, the burnt offering, the grain offering, and the oil
  chosen_korean: 속죄제와 번제와 소제와 기름
  alternatives_korean:
  - 죄제와 번제와 곡식제물과 기름
  - 속죄제와 전번제와 곡식제물과 기름
  lexicon: HALOT
  rationale: 문맥상 정해진 제사 항목들의 목록이므로, 한국어 제사 용어를 표준적으로 옮기되 마지막 ‘기름’도 항목으로 보존했습니다.
theological_decisions:
- issue: יַעֲשֶׂה의 주어와 사역 뉘앙스
  chosen_reading: 주어는 앞문맥의 ‘그’(통치자)로 유지하고, 사역은 ‘같은 방식으로 행해야 합니다’로 중립적으로 옮겼습니다.
  alternative_readings:
  - 그가 같은 제물을 제공해야 합니다
  - 그가 같은 것을 해야 합니다
  rationale: 앞뒤 문맥이 통치자의 제의적 책임을 말하지만, 히브리어 동사 자체는 제물을 ‘바치다’보다 넓으므로 역할을 과도하게 특정하지 않으면서 반복 명령을 살렸습니다.
  doctrine_reference: Ezekiel 45 제의 규례의 문맥적 주어 해석
