  lexicon: HALOT
  rationale: 히브리어의 정형화된 날짜 표현을 한국어에서도 직접적으로 살렸습니다.
- source_word: יַעֲשֶׂה כָ/אֵלֶּה
  english_pob_choice: he shall provide the same offerings
  chosen_korean: 같은 방식으로 행해야 합니다
  alternatives_korean:
