base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/025.yaml
  text: 'In the seventh month[a], on the fifteenth day of the month, at the feast, he shall provide the same offerings for seven days: the sin offering, the burnt offering, the grain offering[b], and the oil.'
  footnotes:
  - marker: a
    text: Or 'during the feast' or 'at the festival.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'he shall do like these'; that is, he shall provide the same prescribed offerings.
    reason: lexical_alternative
translation:
  language: ko
  text: 일곱째 달, 그 달의 열다섯째 날, 절기에 그는 일곱 날 동안 그것을 같은 방식으로 행해야 합니다. 곧 속죄제와 번제와 소제와 기름입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘절기 동안’ 혹은 ‘그 축제 때에’.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘그가 이같이 행할 것이다’입니다. 곧 앞서 정해진 제물을 같은 방식으로 반복한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּ/שְּׁבִיעִי
  english_pob_choice: In the seventh month
  chosen_korean: 일곱째 달
  alternatives_korean:
