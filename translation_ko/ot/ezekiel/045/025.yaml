  source_fidelity: 초안의 ‘그것을 같은 방식으로 행해야 합니다. 곧 …입니다’는 כָאֵלֶּה(‘이와 같이/이것들과 같이’)와 뒤따르는 비교·항목 열거의 관계를 부정확하게 처리합니다. 특히 ‘그것’은 본문에 없는 단수 지시 대상을 만들고, ‘곧’은 뒤의 제사 항목들을 앞 문장의 동격 설명으로 오해하게 합니다. 본문은 절기 칠 일 동안 앞서 규정한 것과 같은 방식으로 속죄제·번제·소제·기름에 관해 시행하도록 지시합니다.
  naturalness: ‘이레 동안’과 ‘…에 대해서도 이와 같이 해야 합니다’는 현대 표준 한국어의 합쇼체로 자연스럽고, 제의 규례 문맥에서도 과도하게 구어적이지 않습니다. ‘그 절기’는 히브리어의 정관사를 무리 없이 반영합니다.
  terminology: חַטָּאת은 ‘속죄제’, עֹלָה는 ‘번제’, מִנְחָה는 ‘소제’로 일관되게 옮겼습니다. שֶׁמֶן은 ‘기름’으로 보존했습니다. יַעֲשֶׂה를 ‘해야 합니다’로 두어 통치자의 책임을 반영하되, 제사장만의 행위인 ‘집례하다’ 등을 덧붙이지 않았습니다.
