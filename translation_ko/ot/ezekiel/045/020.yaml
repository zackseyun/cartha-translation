  yaml_path: translation/ot/ezekiel/045/020.yaml
  text: And so you shall do on the seventh day of the month for anyone who sins unintentionally or through simplicity[b][a]; thus you shall make atonement for the temple.
  footnotes:
  - marker: a
    text: Or 'for a man who errs and for the simple one.' The Hebrew may distinguish two classes of persons, and פֶּתִי can also be rendered 'naive' or 'simple.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house,' referring here to the temple/sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 달의 일곱째 날에도 이와 같이 하십시오. 실수로 죄를 범한 사람과 순진한 사람으로 말미암아 성전을 위하여 속죄하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그 집’이라고 되어 있으며, 여기서는 성전 또는 성소를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘실수하는 사람으로부터와 순진한 사람으로부터’라고 할 수 있습니다. פֶּתִי는 ‘단순한 사람’, ‘순진한 사람’, 또는 ‘미숙한 사람’으로도 옮길 수 있으며, 두 부류의 사람을 구별하는 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  english_pob_choice: And so
  chosen_korean: 그리고… 이와 같이
  alternatives_korean:
  - 그러므로
  - 또한
  lexicon: WLC/HALOT
  rationale: 앞선 정결 규례를 이어 받는 연결어이므로, 단순한 순접보다 이어짐과 대응을 살리는 표현을 택했습니다.
- source_word: בְּשִׁבְעָה בַחֹדֶשׁ
  english_pob_choice: on the seventh day of the month
  chosen_korean: 그 달의 일곱째 날
  alternatives_korean:
