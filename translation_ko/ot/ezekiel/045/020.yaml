  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֵ֤ן תַּֽעֲשֶׂה֙ בְּ/שִׁבְעָ֣ה בַ/חֹ֔דֶשׁ מֵ/אִ֥ישׁ שֹׁגֶ֖ה וּ/מִ/פֶּ֑תִי וְ/כִפַּרְתֶּ֖ם אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/020.yaml
  text: And so you shall do on the seventh day of the month for anyone who sins unintentionally or through simplicity[b][a]; thus you shall make atonement for the temple.
  footnotes:
  - marker: a
    text: Or 'for a man who errs and for the simple one.' The Hebrew may distinguish two classes of persons, and פֶּתִי can also be rendered 'naive' or 'simple.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house,' referring here to the temple/sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 달의 일곱째 날에, 실수로 죄를 범한 사람이나 단순함으로 그런 일을 한 사람을 위하여 이와 같이 하십시오. 이렇게 하여 성전을 속죄해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그 집’이라고 되어 있으며, 여기서는 성전/성소를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: פֶּתִי는 ‘단순한 사람’, ‘순진한 사람’, 또는 ‘미숙한 사람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  english_pob_choice: And so
  chosen_korean: 그리고… 이와 같이
  alternatives_korean:
  - 그러므로
  - 또한
  lexicon: WLC/HALOT
  rationale: 앞선 정결 규례를 이어 받는 연결어이므로, 단순한 순접보다 이어짐과 대응을 살리는 표현을 택했습니다.
- source_word: בְּשִׁבְעָה בַחֹדֶשׁ
  english_pob_choice: on the seventh day of the month
  chosen_korean: 그 달의 일곱째 날
  alternatives_korean:
  - 그 달의 일곱째 날에
  - 그 달의 일곱째 날짜에
  lexicon: WLC/HALOT
  rationale: 히브리어는 달 안의 ‘일곱째’ 시점을 뜻하므로, 한국어에서도 자연스럽게 ‘일곱째 날’로 옮겼습니다.
- source_word: שֹׁגֶה וּמִפֶּתִי
  english_pob_choice: who sins unintentionally or through simplicity
  chosen_korean: 실수로 죄를 범한 사람이나 단순함으로 그런 일을 한 사람
  alternatives_korean:
  - 부지중에 죄를 범한 사람이나 어리석음으로 그런 일을 한 사람
  - 헤매다가 죄를 범한 사람이나 순진함으로 그런 일을 한 사람
  lexicon: WLC/HALOT
  rationale: שֹׁגֶה는 ‘실수로/부지중에 어긋남’을, פֶּתִי는 ‘단순함, 순진함, 미숙함’을 가리킬 수 있어 두 범주를 구분해 살리되 과도하게 해석하지 않았습니다.
- source_word: הַבָּיִת
  english_pob_choice: the temple
  chosen_korean: 성전
  alternatives_korean:
  - 그 집
  - 성소
  lexicon: WLC/HALOT
  rationale: 에스겔의 성전 환상 문맥에서 ‘그 집’은 성전/성소를 가리키므로, 한국어 독자에게 직접적인 ‘성전’으로 옮겼습니다.
theological_decisions:
- issue: 속죄의 대상과 원인 관계
  chosen_reading: 문장은 사람의 범죄를 언급하지만, 직접 목적어는 성전이므로 ‘성전을 속죄해야 합니다’로 남겼습니다.
  alternative_readings:
  - 그 사람을 속죄해야 합니다
  - 그들의 죄를 속해야 합니다
  rationale: 본문은 인간 행위를 원인으로 제시하지만 속죄의 대상은 ‘집/성전’입니다. 그 긴장을 풀어 사람에게만 돌리지 않고 성전 중심의 진술을 유지했습니다.
  doctrine_reference: 'Translation philosophy #3: preserve theological tension rather than resolve it'
- issue: מֵאִישׁ의 일반성
  chosen_reading: ‘사람’을 써서 남성형 단수이지만 일반적 의미를 살렸습니다.
  alternative_readings:
  - 남자
  - 누구든지
  rationale: 히브리어 형태는 남성 단수지만 문맥상 포괄적이므로, 성별을 제한하지 않는 일반 명사로 자연스럽게 표현했습니다.
  doctrine_reference: 'Translation philosophy #4: gender-accurate over gender-neutral'
