  naturalness: ‘성읍의 소유지로’와 ‘너비 오천, 길이 이만 오천인 땅’은 현대 표준어의 법적·분배 문맥에 자연스럽습니다. ‘이스라엘 온 집’은 히브리어 집단 명칭을 보존하면서도 ‘온 이스라엘의 집’보다 자연스럽습니다.
  terminology: אֲחֻזָּה는 이 문맥에서 ‘소유지’가 적절하며, תְּרוּמַת הַקֹּדֶשׁ은 장 전체의 토지 헌정·구획 용어와 연결되는 ‘거룩한 바침’으로 유지할 수 있습니다. ‘이스라엘 온 집’은 בֵּית יִשְׂרָאֵל의 집단적 용례를 충실히 반영합니다.
