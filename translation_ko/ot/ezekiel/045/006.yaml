id: EZK.45.6
reference: Ezekiel 45:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲחֻזַּ֨ת הָ/עִ֜יר תִּתְּנ֗וּ חֲמֵ֤שֶׁת אֲלָפִים֙ רֹ֔חַב וְ/אֹ֗רֶךְ חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף לְ/עֻמַּ֖ת תְּרוּמַ֣ת הַ/קֹּ֑דֶשׁ לְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/006.yaml
  text: And as the city's property[a], you shall give an area five thousand wide and twenty-five thousand long, alongside the holy contribution[b]; it shall belong to the whole house of Israel.
  footnotes:
  - marker: a
    text: Or 'alongside the holy contribution' or 'parallel to the holy contribution.' The Hebrew expression can denote spatial alignment as well as correspondence in measure.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'house of Israel,' a collective term for the people of Israel.
    reason: cultural_note
translation:
  language: ko
  text: 또 성읍의 소유지로는 너비 오천, 길이 이만 오천인 땅을 거룩한 바침에 맞추어 정해야 합니다.[a] 이것은 이스라엘 온 집에 속하게 해야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 공간적으로 ‘나란히’ 또는 ‘맞은편에’라는 뜻도, 측정이나 배치에서 ‘대응하여’라는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 온 집’은 이스라엘 백성 전체를 가리키는 집단 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֲחֻזַּת הָעִיר
  english_pob_choice: the city's property
  chosen_korean: 성읍의 소유
  alternatives_korean:
  - 성읍의 소유지
  - 성읍의 몫
  - 성읍의 토지 소유
  lexicon: HALOT
  rationale: אֲחֻזָּה는 소유지/점유지를 뜻하므로, 문맥에 맞게 ‘성읍의 소유’로 옮겨 지정된 분배 몫이라는 뜻을 살렸습니다.
- source_word: חֲמֵשֶׁת אֲלָפִים רֹחַב / וְאֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  english_pob_choice: five thousand wide / twenty-five thousand long
  chosen_korean: 너비 오천, 길이 이만오천
  alternatives_korean:
  - 오천의 너비와 이만오천의 길이
  - 너비가 오천, 길이가 이만오천
  - 오천 너비, 이만오천 길이
  lexicon: HALOT
  rationale: 히브리어의 압축된 수량 표현을 그대로 따라, ‘너비/길이’의 명사구로 간결하게 옮겼습니다. 본절에는 단위가 명시되지 않으므로 본문에 보충하지 않았습니다.
- source_word: לְעֻמַּת
  english_pob_choice: alongside the holy contribution
  chosen_korean: 거룩한 바침을 따라서
  alternatives_korean:
  - 거룩한 바침과 나란히
  - 거룩한 바침에 대응하여
  - 거룩한 바침과 함께
  lexicon: HALOT
  rationale: לְעֻמַּת은 공간적 나란함과 측정상 대응을 함께 가질 수 있어, 성읍 몫이 성소 몫과 관계된 위치에 놓인다는 뜻을 살려 ‘따라서’로 옮겼습니다.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  english_pob_choice: the holy contribution
  chosen_korean: 거룩한 바침
  alternatives_korean:
  - 거룩한 헌물
  - 거룩한 기부분
  - 성스러운 봉헌
  lexicon: HALOT
  rationale: תְּרוּמָה는 분리하여 바치는 봉헌물/기여분을 가리키므로, 에스겔 45장의 성별된 토지 몫이라는 문맥을 살려 ‘거룩한 바침’으로 옮겼습니다.
- source_word: לְכָל בֵּית יִשְׂרָאֵל
  english_pob_choice: to the whole house of Israel
  chosen_korean: 온 이스라엘의 집에
  alternatives_korean:
  - 온 이스라엘 집을 위하여
  - 이스라엘 온 집에
  - 이스라엘의 온 집에
  lexicon: HALOT
  rationale: בֵּית יִשְׂרָאֵל은 집단 명칭이므로 ‘온 이스라엘의 집’으로 옮겨, 이 땅이 특정 지파가 아니라 공동체 전체에 속한다는 점을 분명히 했습니다.
theological_decisions:
- issue: 마지막 소유·귀속 표현
  chosen_reading: ‘it shall belong’의 뜻을 살려 ‘속해야 합니다’로 옮겼습니다.
  alternative_readings:
  - ‘됩니다’
  - ‘소유가 됩니다’
  - ‘있을 것입니다’
  rationale: 단순 존재가 아니라 분배된 땅의 귀속을 말하므로, 소유/귀속의 함의를 드러내는 표현이 더 적절합니다.
  doctrine_reference: 토지 분배와 언약 공동체의 공동 귀속(민 26–34; 겔 45장)
- issue: 거룩한 몫과 성읍 몫의 관계
  chosen_reading: ‘거룩한 바침을 따라서’로 관계성과 배치를 함께 드러냈습니다.
  alternative_readings:
  - ‘거룩한 바침 곁에’
  - ‘거룩한 바침과 나란히’
  - ‘거룩한 바침에 대응하여’
  rationale: 히브리어 לְעֻמַּת은 단순한 인접성보다 기준/대응 관계까지 담을 수 있어, 성소 몫을 기준으로 성읍 몫이 배치된다는 문맥을 보존했습니다.
  doctrine_reference: 성소 몫과 공동체 몫의 구분 및 질서(겔 45:1-6)
