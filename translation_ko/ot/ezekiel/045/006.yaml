revisions:
- from: 그리고 성읍의 소유로는 너희가 너비 오천, 길이 이만오천의 땅을 바쳐야 합니다. 그것은 거룩한 바침을 따라서이며, 온 이스라엘의 집에 속해야 합니다.[a][b]
  to: 또 성읍의 소유지로는 너비 오천, 길이 이만 오천인 땅을 거룩한 바침에 맞추어 정해야 합니다.[a] 이것은 이스라엘 온 집에 속하게 해야 합니다.[b]
  rationale: 토지 배정의 동사를 ‘정해야 합니다’로 바꾸어 제의적 봉헌이라는 오해를 제거했습니다. 성읍 소유지를 ‘소유지’로 명확히 하고, 치수는 원문의 압축성을 유지하되 한국어 문장 안에서 자연스럽게 ‘…인 땅’으로 연결했습니다. לְעֻמַּת의 논쟁 가능한 공간·대응 의미는 본문에서 과도하게 특정하지 않고 ‘맞추어’로 옮기며 각주에서 보존했습니다. 마지막 귀속 조항은 원문의 규범적 미래형과 소유 의미를 반영했습니다.
