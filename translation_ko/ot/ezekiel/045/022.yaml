base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/022.yaml
  text: On that day the prince shall provide[a], for himself and for all the people of the land, a bull as a sin offering.
  footnotes:
  - marker: a
    text: Or 'a bull for a purification offering.' The Hebrew חַטָּאת can denote the offering that removes sin or impurity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 그 통치자는 자신과 그 땅의 모든 백성을 위하여 속죄제물로 황소 한 마리를 드려야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제물로 드릴 황소’로 옮길 수 있습니다. 히브리어 חַטָּאת은 죄나 부정을 제거하는 제물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּשִׂיא
  english_pob_choice: the prince
  chosen_korean: 그 고관
  alternatives_korean:
  - 그 군주
  - 그 지도자
  - 그 왕자
  lexicon: HALOT
  rationale: 에스겔의 הַנָּשִׂיא는 성전 환상 속 행정·공적 책임을 지는 통치자를 가리키므로, 현대 한국어에서 위계와 직분을 살리되 지나치게 왕족적으로 들리지 않는 ‘고관’으로 옮겼습니다.
- source_word: וְעָשָׂה
  english_pob_choice: shall provide
  chosen_korean: 드려야 합니다
  alternatives_korean:
  - 제공해야 합니다
  - 행해야 합니다
  - 드려야 하겠습니다
  lexicon: HALOT
  rationale: 제의 문맥에서 עשה는 단순히 ‘하다’가 아니라 제물을 마련하여 바치는 행위를 가리킬 수 있으므로, 한국어에서는 예배·제사 행위를 직접 드러내는 ‘드리다’로 옮겼습니다.
- source_word: פַּר
  english_pob_choice: a bull
  chosen_korean: 수송아지 하나
  alternatives_korean:
  - 황소 한 마리
  - 송아지 한 마리
  - 수소 한 마리
  lexicon: HALOT
  rationale: פַּר은 제의 용례에서 수컷 소를 뜻하므로, 제물의 종류를 분명히 하면서도 자연스러운 한국어 제의 표현인 ‘수송아지’를 선택했습니다.
- source_word: חַטָּאת
  english_pob_choice: sin offering
  chosen_korean: 속죄제
  alternatives_korean:
  - 죄제
  - 정결제
  - 속죄를 위한 제물
  lexicon: HALOT
  rationale: 여기서는 추상적 ‘죄’가 아니라 제물의 명칭이므로, 전통적이면서도 제의 기능을 분명히 하는 ‘속죄제’로 옮겼습니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미
  chosen_reading: 속죄제
  alternative_readings:
  - 정결제
  - 죄를 위한 제물
  rationale: 본문에는 ‘수송아지’가 병치되어 제물 자체를 가리키므로, 독자가 제의 항목으로 이해하도록 ‘속죄제’를 유지했습니다. 다만 이 용어는 죄와 부정 둘 모두를 다루는 제의적 기능을 충분히 포괄합니다.
  doctrine_reference: Translation philosophy §5 (핵심 용어의 일관성과 문맥상 예외 허용)
