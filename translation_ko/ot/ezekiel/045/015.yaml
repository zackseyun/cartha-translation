  text: and one sheep from every two hundred from the well-watered pastures of Israel[a], for a grain offering and for a burnt offering and for peace offerings, to make atonement for them, declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'from the watered land of Israel' or 'from the rich pastureland of Israel.' The Hebrew phrase likely refers to well-watered grazing land.
