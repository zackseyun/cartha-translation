  lexicon: HALOT
  rationale: 의무 공납의 비율을 나타내는 표현이므로, 한국어에서는 ‘두백 마리마다’가 비율 감각을 가장 분명하게 전달합니다.
- source_word: מִמַּשְׁקֵה יִשְׂרָאֵל
  english_pob_choice: from the well-watered pastures of Israel
  chosen_korean: 이스라엘의 잘 물댄 목초지
  alternatives_korean:
  - 이스라엘의 물댄 땅
  - 이스라엘의 비옥한 목초지
  - 이스라엘의 잘 물 주는 땅
  lexicon: HALOT
  rationale: 문자적으로는 ‘물댄/물 주는 것’이지만, 양을 공급하는 토지의 성격을 가리키는 메타포이므로 ‘목초지’로 풀어 문맥을 살렸습니다.
- source_word: לְמִנְחָה וּלְעוֹלָה וְלִשְׁלָמִים
  english_pob_choice: for a grain offering and for a burnt offering and for peace offerings
  chosen_korean: 곡식제물과 번제와 화목제물로
  alternatives_korean:
  - 소제와 번제와 화목제물로
  - 곡식제사와 번제와 화목제사로
  - 곡식제물과 번제와 평화제물로
  lexicon: HALOT
  rationale: מִנְחָה는 제의 문맥에서 ‘곡식제물’이 가장 직접적이며, שְׁלָמִים은 전통적 ‘화목제물’이 용례와 신학적 무게를 가장 잘 보존합니다.
