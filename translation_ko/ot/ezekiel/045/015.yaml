  text: וְ/שֶׂה אַחַ֨ת מִן הַ/צֹּ֤אן מִן הַ/מָּאתַ֨יִם֙ מִ/מַּשְׁקֵ֣ה יִשְׂרָאֵ֔ל לְ/מִנְחָ֖ה וּ/לְ/עוֹלָ֣ה וְ/לִ/שְׁלָמִ֑ים לְ/כַפֵּ֣ר עֲלֵי/הֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/015.yaml
  text: and one sheep from every two hundred from the well-watered pastures of Israel[a], for a grain offering and for a burnt offering and for peace offerings, to make atonement for them, declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'from the watered land of Israel' or 'from the rich pastureland of Israel.' The Hebrew phrase likely refers to well-watered grazing land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 양 떼 가운데에서, 곧 이스라엘의 잘 물댄 목초지에서 나온 것 가운데서 두백 마리마다 한 마리의 양을 곡식제물과 번제와 화목제물로 드려 그들에게 속죄할 것입니다. 주 야훼의 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잘 물댄 목초지’는 히브리어 מִמַּשְׁקֵה יִשְׂרָאֵל의 의미를 풀어 옮긴 것입니다. 직역하면 ‘이스라엘의 물댄 땅/물 공급된 곳’일 수 있으며, 문맥상 목축에 알맞은 비옥한 방목지를 가리킬 가능성이 큽니다.
    reason: source_note
lexical_decisions:
- source_word: וְשֶׂה אַחַת
  english_pob_choice: and one sheep
  chosen_korean: 한 마리의 양
  alternatives_korean:
  - 한 마리의 어린양
  - 양 한 마리
  - 한 마리의 작은 가축
  lexicon: HALOT
  rationale: שֶׂה는 양 떼의 개체를 가리키며 문맥상 연령을 특정하지 않으므로, 과도하게 좁히지 않는 ‘양’이 가장 자연스럽습니다.
- source_word: מִן הַצֹּאן מִן הַמָּאתַיִם
  english_pob_choice: from every two hundred
  chosen_korean: 두백 마리마다
  alternatives_korean:
  - 두백 마리에서 한 마리씩
  - 두백 마리 중 한 마리
  - 두백 마리마다 한 마리씩
  lexicon: HALOT
  rationale: 의무 공납의 비율을 나타내는 표현이므로, 한국어에서는 ‘두백 마리마다’가 비율 감각을 가장 분명하게 전달합니다.
- source_word: מִמַּשְׁקֵה יִשְׂרָאֵל
  english_pob_choice: from the well-watered pastures of Israel
  chosen_korean: 이스라엘의 잘 물댄 목초지
  alternatives_korean:
  - 이스라엘의 물댄 땅
  - 이스라엘의 비옥한 목초지
  - 이스라엘의 잘 물 주는 땅
  lexicon: HALOT
  rationale: 문자적으로는 ‘물댄/물 주는 것’이지만, 양을 공급하는 토지의 성격을 가리키는 메타포이므로 ‘목초지’로 풀어 문맥을 살렸습니다.
- source_word: לְמִנְחָה וּלְעוֹלָה וְלִשְׁלָמִים
  english_pob_choice: for a grain offering and for a burnt offering and for peace offerings
  chosen_korean: 곡식제물과 번제와 화목제물로
  alternatives_korean:
  - 소제와 번제와 화목제물로
  - 곡식제사와 번제와 화목제사로
  - 곡식제물과 번제와 평화제물로
  lexicon: HALOT
  rationale: מִנְחָה는 제의 문맥에서 ‘곡식제물’이 가장 직접적이며, שְׁלָמִים은 전통적 ‘화목제물’이 용례와 신학적 무게를 가장 잘 보존합니다.
