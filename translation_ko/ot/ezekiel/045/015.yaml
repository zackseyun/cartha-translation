translation:
  language: ko
  text: 그리고 이스라엘의 물이 넉넉한 목초지에서 기른 양 떼 이백 마리마다 양 한 마리를 곡식 제물과 번제와 화목 제물로 드려, 그들을 위하여 속죄하게 할 것입니다. 주 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물이 넉넉한 목초지’는 히브리어 מִמַּשְׁקֵה יִשְׂרָאֵל을 문맥에 따라 풀어 옮긴 것입니다. 직역에 가깝게는 ‘이스라엘의 물 댄 땅’ 또는 ‘이스라엘의 물 공급지’로도 이해될 수 있으며, 양 떼와 관련된 문맥에서는 물이 넉넉한 방목지나 비옥한 목초지를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֶׂה אַחַת
  english_pob_choice: and one sheep
  chosen_korean: 한 마리의 양
  alternatives_korean:
  - 한 마리의 어린양
  - 양 한 마리
