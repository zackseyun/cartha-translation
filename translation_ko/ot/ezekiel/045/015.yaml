  lexicon: HALOT
  rationale: שֶׂה는 양 떼의 개체를 가리키며 문맥상 연령을 특정하지 않으므로, 과도하게 좁히지 않는 ‘양’이 가장 자연스럽습니다.
- source_word: מִן הַצֹּאן מִן הַמָּאתַיִם
  english_pob_choice: from every two hundred
  chosen_korean: 두백 마리마다
