  text: יִהְיֶ֤ה מִ/זֶּה֙ אֶל הַ/קֹּ֔דֶשׁ חֲמֵ֥שׁ מֵא֛וֹת בַּ/חֲמֵ֥שׁ מֵא֖וֹת מְרֻבָּ֣ע סָבִ֑יב וַ/חֲמִשִּׁ֣ים אַמָּ֔ה מִגְרָ֥שׁ ל֖/וֹ סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/002.yaml
  text: From this there shall be for the holy place a square of five hundred by five hundred all around[b][a], with fifty cubits of open land for it all around.
  footnotes:
  - marker: a
    text: Or 'for the sanctuary.' The Hebrew קֹדֶשׁ here can denote the sacred area more generally, not only the sanctuary building itself.
    reason: lexical_alternative
  - marker: b
    text: Or 'pasture land' or 'common land' for the surrounding open area (מִגְרָשׁ).
    reason: lexical_alternative
translation:
  language: ko
  text: 이것으로부터 거룩한 곳을 위해 사방으로 오백 곱하기 오백 되는 정사각형이 있을 것이며, 그 주위에는 오십 규빗의 빈 땅이 있을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소를 위해’. כאן의 קֹדֶשׁ은 성소 건물뿐 아니라 더 넓은 성스러운 구역을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘목초지’ 혹은 ‘공용지’. 여기의 מִגְרָשׁ은 둘러싼 빈 공간을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/זֶּה
  english_pob_choice: From this
  chosen_korean: 이것으로부터
  alternatives_korean:
  - 이로부터
  - 이것에서
  lexicon: HALOT
  rationale: 이전 구획을 가리키며 그중에서 떼어 내는 의미이므로, 문맥상 자연스러운 ‘이것으로부터’로 옮겼습니다.
- source_word: אֶל הַ/קֹּדֶשׁ
  english_pob_choice: for the holy place
  chosen_korean: 거룩한 곳을 위해
  alternatives_korean:
