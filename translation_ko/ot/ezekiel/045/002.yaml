  text: From this there shall be for the holy place a square of five hundred by five hundred all around[b][a], with fifty cubits of open land for it all around.
  footnotes:
  - marker: a
    text: Or 'for the sanctuary.' The Hebrew קֹדֶשׁ here can denote the sacred area more generally, not only the sanctuary building itself.
    reason: lexical_alternative
  - marker: b
    text: Or 'pasture land' or 'common land' for the surrounding open area (מִגְרָשׁ).
    reason: lexical_alternative
translation:
  language: ko
  text: 이로부터 거룩한 곳[a]을 위하여 사방이 오백인 정사각형이 있을 것이며, 그 주위에는 오십 규빗의 빈 터[b]가 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소를 위해’. 여기의 קֹדֶשׁ은 성소 건물뿐 아니라 더 넓은 성스러운 구역을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘목초지’ 혹은 ‘공용지’. 여기의 מִגְרָשׁ은 둘러싼 빈 공간을 뜻합니다.
    reason: lexical_alternative
