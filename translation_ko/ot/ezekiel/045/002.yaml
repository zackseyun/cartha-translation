  - 거룩한 구역을 위해
  lexicon: HALOT
  rationale: 여기서는 이동이 아니라 할당 목적을 나타내므로 ‘~을 위해’로 처리했고, קֹדֶשׁ은 건물보다 더 넓은 성스러운 구역까지 아우를 수 있어 ‘거룩한 곳’으로 보존했습니다.
- source_word: מְרֻבָּע
  english_pob_choice: a square
  chosen_korean: 정사각형
  alternatives_korean:
  - 사각형
  - 네모
  lexicon: HALOT
  rationale: 형태를 나타내는 말이므로 한국어 수학·공간 표현에 맞는 ‘정사각형’이 가장 명확합니다.
- source_word: מִגְרָשׁ
  english_pob_choice: open land
  chosen_korean: 빈 땅
  alternatives_korean:
  - 열린 땅
  - 공터
  - 목초지
  lexicon: HALOT
  rationale: 성소 주변의 비워 둔 완충 지대를 가리키므로, 기능을 드러내는 ‘빈 땅’이 본문 의미를 가장 직접적으로 전달합니다.
- source_word: אַמָּה
  english_pob_choice: cubits
  chosen_korean: 규빗
  alternatives_korean:
  - 자
  - 길이
  lexicon: HALOT
  rationale: 고대 히브리 길이 단위이므로 관례적 음역어인 ‘규빗’을 유지해 측량 표현을 보존했습니다.
theological_decisions:
- issue: 'קֹדֶשׁ의 범위: 건물 내부 성소인지, 성스러운 구역 전체인지'
  chosen_reading: 성소 건물 자체로 좁히지 않고 ‘거룩한 곳’으로 넓게 유지했습니다.
  alternative_readings:
  - 성소를 위해
  - 성소 구역을 위해
  rationale: English POB 주석이 이 단어가 성소 건물만이 아니라 더 넓은 성스러운 영역을 가리킬 수 있다고 명시하므로, 그 긴장을 한국어에서도 지우지 않았습니다.
  doctrine_reference: 텍스트 내 어휘 범위 보존
