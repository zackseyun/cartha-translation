language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ תִּקַּ֥ח פַּר בֶּן בָּקָ֖ר תָּמִ֑ים וְ/חִטֵּאתָ֖ אֶת הַ/מִּקְדָּֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/018.yaml
  text: 'Thus says the Lord GOD: In the first month[a], on the first day of the month, you shall take a bull from the herd without blemish, and you shall purify the sanctuary.'
  footnotes:
  - marker: a
    text: Or, 'you shall make atonement for the sanctuary.' The Hebrew verb here is a ritual term that can denote purification or decontamination from sin.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. 첫째 달 초하루에 흠 없는 수송아지 한 마리를 가져다가 성소를 정결하게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소를 위하여 속죄하십시오’라고 옮길 수 있습니다. 여기서 히브리어 동사는 죄로 인한 오염을 제거하는 제의적 정결을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 아도나이+יהוה의 결합은 주권 호칭과 고유신명 표지가 함께 있는 고정 결합이므로, POB의 원어 직결 원칙에 따라 야훼를 유지하고 주를 앞에 두어 구별을 살렸습니다.
- source_word: בָּרִאשׁוֹן
  english_pob_choice: In the first month
  chosen_korean: 첫째 달
  alternatives_korean:
  - 첫 달
  - 첫 번째 달
  lexicon: HALOT
  rationale: 뒤의 לַחֹדֶשׁ가 달(月)을 분명히 하므로, 한국어에서도 달력 날짜 표현으로 자연스럽게 풀어 ‘첫째 달’로 옮겼습니다.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  english_pob_choice: on the first day of the month
  chosen_korean: 그 달의 초하루
  alternatives_korean:
  - 그 달의 첫째 날
  - 그 달의 첫날
  lexicon: HALOT
  rationale: 히브리어 관용적 날짜 표현을 현대 한국어의 관용구로 옮겨, 단순한 서수보다 달력상 ‘초하루’의 의미를 분명히 했습니다.
- source_word: פַּר בֶּן בָּקָר תָּמִים
  english_pob_choice: a bull from the herd without blemish
  chosen_korean: 소 떼 가운데서 흠 없는 수송아지 하나
  alternatives_korean:
  - 흠 없는 수소 한 마리
  - 흠 없는 황소 한 마리
  lexicon: HALOT
  rationale: בן בקר은 가축 떼의 수컷 송아지/젊은 수소를 가리키므로, 제의 문맥에서 자연스러운 ‘수송아지’로 옮기되, ‘흠 없는’은 제물 적합성을 드러내는 표준 제의어로 유지했습니다.
- source_word: וְחִטֵּאתָ אֶת הַמִּקְדָּשׁ
  english_pob_choice: you shall purify the sanctuary
  chosen_korean: 성소를 정결하게 하십시오
  alternatives_korean:
  - 성소를 속죄하십시오
  - 성소를 깨끗하게 하십시오
  lexicon: HALOT
  rationale: חטא의 제의적 사역은 여기서 ‘죄를 지우다’보다 정화/정결의 기능을 가리키므로, POB의 ‘purify’에 맞추어 ‘정결하게 하다’로 옮겼습니다.
theological_decisions:
- issue: חטֵּאתָ의 제의적 의미를 ‘속죄’로 좁힐지, ‘정결하게 하다’로 넓게 유지할지
  chosen_reading: ‘성소를 정결하게 하십시오’로 번역해 제의적 정화와 속죄의 긴장을 함께 열어 둡니다.
  alternative_readings:
  - 성소를 속죄하십시오
  - 성소를 깨끗하게 하십시오
  rationale: 본문은 성소에 적용되는 제의 동사를 사용하므로, 단일한 교리 용어로 고정하기보다 정화의 기능을 직접 드러내면서도 전통적 속죄 해석 가능성을 닫지 않는 번역이 원문에 더 충실합니다.
  doctrine_reference: 제의적 정결과 속죄의 관계는 본문이 유지하는 긴장으로 남겨 둡니다.
