revisions:
- from: 이 땅은 그에게 이스라엘 안에서 한 소유로 돌아갈 것입니다. 또 내 고관들은 다시는 내 백성을 압제하지 못할 것이며, 그들은 그 땅을 이스라엘 집에게 그들의 지파대로 주어야 합니다.[a]
  to: 이 땅은 이스라엘 안에서 그에게 소유지가 될 것입니다. 내 통치자들은 다시는 내 백성을 압제하지 않을 것이며, 그들은 이스라엘 집에 그들의 지파에 따라 그 땅을 줄 것입니다.[a]
  rationale: ‘소유지’로 토지 보유의 뜻을 보존하고, 반환·능력·의무라는 추가 의미를 제거했습니다. 마지막 절은 히브리어의 전치된 목적어가 허용하는 어순을 각주로만 제시하여 의미를 과도하게 확정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:45:01Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 절의 ‘돌아갈 것입니다’는 히브리어의 단순한 소유·귀속 표현에 ‘되돌아감’을 덧붙입니다. 또한 ‘압제하지 못할’과 ‘주어야 합니다’는 각각 능력/금지와 의무의 뉘앙스를 더하므로, 미래 진술로 옮기는 것이 적절합니다.
  naturalness: ‘이스라엘 집에게’보다 수여의 대상을 나타내는 ‘이스라엘 집에’가 자연스럽습니다. ‘소유지’는 토지 보유를 뜻하는 אֲחֻזָּה의 문맥을 잘 살립니다.
  terminology: נְשִׂיאַי는 에스겔 45장의 통치 직함과 연결되므로 ‘내 통치자들’로 옮겼습니다. ‘압제하다’, ‘이스라엘 집’, ‘지파에 따라’는 적절합니다.
  issues:
  - severity: medium
    issue: ‘한 소유로 돌아갈 것입니다’
    rationale: יִהְיֶה לּוֹ לַאֲחֻזָּה는 그에게 소유지/소유가 된다는 뜻이며, ‘돌아가다’가 암시하는 반환·회귀는 본문에 없습니다.
  - severity: medium
    issue: ‘압제하지 못할 것이며’와 ‘주어야 합니다’
    rationale: 두 미완료형은 이 문맥에서 미래의 결과/명령적 선언을 나타내지만, ‘못하다’는 능력 또는 금지, ‘-어야 하다’는 의무를 명시하여 원문의 양태를 불필요하게 좁힙니다.
  - severity: low
    issue: 각주의 대안 제시가 본문 번역과 실질적으로 구별되지 않음
    rationale: 히브리어의 전치된 ‘땅’은 ‘그 땅을 ... 줄 것이다’로 읽을 수 있으나, 기존 각주는 동일한 의미를 장황하게 반복합니다. 어순상 대안임을 분명히 하는 편이 낫습니다.
  revised_text: 이 땅은 이스라엘 안에서 그에게 소유지가 될 것입니다. 내 통치자들은 다시는 내 백성을 압제하지 않을 것이며, 그들은 이스라엘 집에 그들의 지파에 따라 그 땅을 줄 것입니다.[a]
  revised_footnotes:
