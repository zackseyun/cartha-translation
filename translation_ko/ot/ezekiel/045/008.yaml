id: EZK.45.8
reference: Ezekiel 45:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/אָ֛רֶץ יִֽהְיֶה לּ֥/וֹ לַֽ/אֲחֻזָּ֖ה בְּ/יִשְׂרָאֵ֑ל וְ/לֹא יוֹנ֨וּ ע֤וֹד נְשִׂיאַ/י֙ אֶת עַמִּ֔/י וְ/הָ/אָ֛רֶץ יִתְּנ֥וּ לְ/בֵֽית יִשְׂרָאֵ֖ל לְ/שִׁבְטֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/008.yaml
  text: This land shall belong to him as a possession in Israel. And my princes shall no longer oppress my people[a], but they shall give the land to the house of Israel according to their tribes.
  footnotes:
  - marker: a
    text: Or 'and the land they shall give to the house of Israel by their tribes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 땅은 이스라엘 안에서 그에게 소유지가 될 것입니다. 내 통치자들은 다시는 내 백성을 압제하지 않을 것이며, 그들은 이스라엘 집에 그들의 지파에 따라 그 땅을 줄 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 어순은 ‘그 땅을 이스라엘 집에 그들의 지파에 따라 줄 것이다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לָאָרֶץ / This land
  english_pob_choice: This land
  chosen_korean: 이 땅
  alternatives_korean:
  - 그 땅
  - 그 땅은
  lexicon: HALOT
  rationale: 앞에 나온 תחום 땅을 가리키는 지시적 표현으로, 한국어에서는 ‘이 땅’이 POB의 deictic force를 가장 자연스럽게 살립니다.
- source_word: יִהְיֶה לּוֹ לַאֲחֻזָּה / shall belong to him as a possession
  english_pob_choice: shall belong to him as a possession
  chosen_korean: 그에게 … 한 소유로 돌아갈 것입니다
  alternatives_korean:
  - 그의 소유가 될 것입니다
  - 그에게 소유로 있을 것입니다
  lexicon: HALOT
  rationale: 소유 개념 אֲחֻזָּה를 단순한 ‘재산’보다 ‘소유’로 옮기고, מִשְׁפָּטִי 문맥에서의 귀속을 ‘돌아갈 것입니다’로 풀어 소유권 귀속을 드러냈습니다.
- source_word: נְשִׂיאַי / my princes
  english_pob_choice: my princes
  chosen_korean: 내 고관들
  alternatives_korean:
  - 내 방백들
  - 내 통치자들
  lexicon: HALOT
  rationale: נָשִׂיא의 정치적 지위를 살리면서도 한국어에서 ‘내 고관들’이 본문 내 통치 엘리트의 의미를 비교적 중립적으로 전달합니다.
- source_word: יוֹנוּ … אֶת עַמִּי / oppress my people
  english_pob_choice: oppress my people
  chosen_korean: 내 백성을 압제하지 못할
  alternatives_korean:
  - 내 백성을 학대하지 못할
  - 내 백성을 억압하지 못할
  lexicon: HALOT
  rationale: 히필 ינה는 단순한 불친절이 아니라 권력에 의한 착취·압제를 뜻하므로, ‘압제하다’가 원문의 강도를 가장 잘 반영합니다.
- source_word: לְשִׁבְטֵיהֶם / according to their tribes
  english_pob_choice: according to their tribes
  chosen_korean: 그들의 지파대로
  alternatives_korean:
  - 그들의 지파에 따라
  - 지파별로
  lexicon: HALOT
  rationale: 분배의 기준이 지파 단위임을 간명하게 살리기 위해 관용적이고도 분배 의미가 분명한 ‘-대로’를 택했습니다.
theological_decisions:
- issue: ‘my princes’의 지위와 소유권 귀속의 연결
  chosen_reading: 이 구절은 왕권의 사적 전횡을 제한하고, 통치자가 백성을 착취하는 대신 땅을 공정하게 분배해야 한다는 예언적 질서를 말합니다.
  alternative_readings:
  - 일반적인 지도층에 대한 윤리적 권고
  - 재산권 분배에 대한 행정 규정
  rationale: 문맥상 ‘내 고관들’은 단순 도덕 훈계가 아니라, 하나님의 질서 아래서 통치권이 백성 압제에 사용되지 않아야 함을 선언합니다.
  doctrine_reference: Ezekiel 45의 토지 분배와 공의에 관한 예언 문맥
