  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַֽל הַ/נָּשִׂ֣יא יִהְיֶ֗ה הָ/עוֹל֣וֹת וְ/הַ/מִּנְחָה֮ וְ/הַ/נֵּסֶךְ֒ בַּ/חַגִּ֤ים וּ/בֶ/חֳדָשִׁים֙ וּ/בַ/שַּׁבָּת֔וֹת בְּ/כָֽל מוֹעֲדֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הֽוּא יַעֲשֶׂ֞ה אֶת הַ/חַטָּ֣את וְ/אֶת הַ/מִּנְחָ֗ה וְ/אֶת הָֽ/עוֹלָה֙ וְ/אֶת הַ/שְּׁלָמִ֔ים לְ/כַפֵּ֖ר בְּעַ֥ד בֵּֽית יִשְׂרָאֵֽל־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/017.yaml
  text: And the burnt offerings[a], the grain offering, and the drink offering at the feasts, at the new moons, and at the Sabbaths—at all the appointed times of the house of Israel—shall be the prince’s responsibility. He shall provide the sin offering, the grain offering, the burnt offering, and the peace offerings[b], to make atonement for the house of Israel.
  footnotes:
  - marker: a
    text: Or 'the purification offering' for 'the sin offering.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the fellowship offerings' or 'the offerings of well-being' for 'the peace offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 절기와 초하루와 안식일, 곧 이스라엘 집의 모든 정한 때에 드릴 번제와 곡식제물과 전제는 군주가 맡아야 합니다. 그는 이스라엘 집을 위하여 속죄제[a]와 곡식제물과 번제와 화목제물[b]을 마련하여 속죄해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제물’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘화평제물’ 또는 ‘평안제물’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּשִׂיא
  english_pob_choice: the prince
  chosen_korean: 그 군주
  alternatives_korean:
  - 그 왕
  - 그 지도자
  - 그 통치자
  lexicon: HALOT
  rationale: 에스겔서의 נָשִׂיא는 단순한 일반 지도자보다 공적 책임을 지는 통치자를 가리키므로, 전통적 교회어를 그대로 따르기보다 문맥을 살려 ‘군주’로 옮겼습니다.
- source_word: הָעוֹלוֹת / הָעֹלָה
  english_pob_choice: the burnt offerings / the burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 번제물
  - 완전번제
  lexicon: HALOT
  rationale: 제의 문맥에서 עֹלָה는 표준적으로 번제이므로, 한국어 성경 용례와 가독성을 고려해 ‘번제’로 일관되게 옮겼습니다.
- source_word: הַמִּנְחָה
  english_pob_choice: the grain offering
  chosen_korean: 곡식제물
  alternatives_korean:
  - 소제
  - 곡식제
  - 곡식제사
  lexicon: HALOT
  rationale: מִנְחָה는 이 문맥에서 곡물의 헌물을 가리키므로, 기존 교회 용어 ‘소제’보다 의미가 더 드러나는 ‘곡식제물’을 채택했습니다.
- source_word: הַנֵּסֶךְ
  english_pob_choice: the drink offering
  chosen_korean: 전제
  alternatives_korean:
  - 술제물
  - 붓는 제물
  lexicon: HALOT
  rationale: נֶסֶךְ는 붓는 제물로서의 전제를 뜻하므로, 제의 용어로 굳어진 ‘전제’를 사용했습니다.
- source_word: הַחַטָּאת
  english_pob_choice: the sin offering
  chosen_korean: 속죄제
  alternatives_korean:
  - 죄제
  - 속죄물
  lexicon: HALOT
  rationale: 제사 규정에서 חַטָּאת는 단순한 죄가 아니라 제물 자체를 가리키므로, 의미를 분명히 하는 ‘속죄제’를 선택했습니다.
- source_word: הַשְּׁלָמִים
  english_pob_choice: the peace offerings
  chosen_korean: 화목제물
  alternatives_korean:
  - 화평제물
  - 평안제물
  - 평화제물
  lexicon: HALOT
  rationale: שְׁלָמִים은 ‘평화’보다 관계 회복과 교제를 드러내는 제의 성격이 강하므로, 한국어 성경에서 널리 쓰이는 ‘화목제물’로 옮겼습니다.
- source_word: לְכַפֵּר בְּעַד
  english_pob_choice: to make atonement for
  chosen_korean: 속죄하려고
  alternatives_korean:
  - 속죄하기 위해
  - 대속하려고
  - 화해시키려고
  lexicon: HALOT
  rationale: כפר의 제의적 의미를 살리되 문장을 자연스럽게 하기 위해 ‘속죄하다’ 동사형으로 처리했습니다.
theological_decisions:
- issue: 제사 책임의 주체를 어떻게 드러낼 것인가
  chosen_reading: 이 구절은 제사를 직접 집례한다기보다, 그 군주가 절기 제사들을 마련해야 하는 책임을 진다고 읽어 옮겼습니다.
  alternative_readings:
  - 그 군주가 제사장을 대신해 제사를 집례한다
  - 그 군주가 단지 명목상 책임만 진다
  rationale: 원문 עַל הַנָּשִׂיא יִהְיֶה와 뒤따르는 יַעֲשֶׂה는 책임 부과의 뉘앙스를 가지므로, 주체의 역할을 과장하지 않고 ‘책임’과 ‘마련해야 합니다’로 표현했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
- issue: 속죄 언어의 범위를 어디까지 유지할 것인가
  chosen_reading: 원문의 제의적 속죄 언어를 그대로 살려, 이스라엘 집을 위한 속죄로 번역했습니다.
  alternative_readings:
  - 보다 일반적인 ‘용서’로 완화한다
  - 후대 신학 용어로 재해석한다
  rationale: 본문은 에스겔의 성전 환상 안에서 제의적 속죄를 말하므로, 이를 완화하거나 체계신학 용어로 바꾸지 않았습니다.
  doctrine_reference: 'Translation philosophy: Never import doctrinal claims the text does not make.'
