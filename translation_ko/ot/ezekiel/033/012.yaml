  to: 인자여, 네 백성의 아들들에게[a] 말하십시오. 의로운 자의 의는 그가 범죄하는 날에 그를 구해 주지 못하며, 악한 자의 악은 그가 자기 악에서 돌이키는 날에 그것 때문에 걸려 넘어지지 않을 것입니다[b]. 또한 의로운 자는 그가 죄를 짓는 날에 그것으로[c] 살 수 없습니다.
  rationale: 합쇼체를 일관되게 적용하고, ‘자손’이 유발하는 ‘후손’의 의미를 피하여 원문의 집합 표현을 더 직접적으로 옮겼습니다. ‘그것’은 원문의 대명사적 응집성과 대구를 보존하도록 유지했으며, 해당 각주 표지를 각 표현에 재배치했습니다.
