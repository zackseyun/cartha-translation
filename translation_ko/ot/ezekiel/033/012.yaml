id: EZK.33.12
reference: Ezekiel 33:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם אֱמֹ֤ר אֶל בְּנֵֽי עַמְּ/ךָ֙ צִדְקַ֣ת הַ/צַּדִּ֗יק לֹ֤א תַצִּילֶ֨/נּוּ֙ בְּ/י֣וֹם פִּשְׁע֔/וֹ וְ/רִשְׁעַ֤ת הָֽ/רָשָׁע֙ לֹֽא יִכָּ֣שֶׁל בָּ֔/הּ בְּ/י֖וֹם שׁוּב֣/וֹ מֵֽ/רִשְׁע֑/וֹ וְ/צַדִּ֗יק לֹ֥א יוּכַ֛ל לִֽ/חְי֥וֹת בָּ֖/הּ בְּ/י֥וֹם חֲטֹאתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/012.yaml
  text: 'And you[a], son of man, say to the sons of your people: The righteousness of the righteous man will not deliver him in the day of his transgression, and the wickedness of the wicked man—he will not stumble by it in the day he turns from his wickedness[c][b]; and the righteous man will not be able to live by it in the day of his sin.'
  footnotes:
  - marker: a
    text: Or, more dynamically, 'your people.' The Hebrew says 'the sons of your people.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he will not fall because of it.' The Hebrew uses the image of stumbling.
    reason: lexical_alternative
  - marker: c
    text: That is, by his prior righteousness. The Hebrew pronoun is feminine singular, matching 'righteousness.'
    reason: lexical_alternative
translation:
  language: ko
  text: '너, 인자야, 네 백성의 자손에게 말하여라: 의로운 자의 의는 그가 범죄하는 날에 그를 구해 주지 못하고, 악한 자의 악은 그가 자기 악에서 돌이키는 날에 그것 때문에 걸려 넘어지지 않을 것입니다. 또한 의로운 자도 그가 죄를 짓는 날에는 그것으로 살 수 없습니다.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: the sons of your people는 문자적으로는 ‘네 백성의 자손들’입니다.
    reason: source_note
  - marker: b
    text: ‘걸려 넘어지다’는 히브리어 כשל의 비유를 따른 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 ‘그것’은 문맥상 앞선 ‘의’를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서의 고정된 신적 호칭을 살리기 위해 직역적 의미보다 전통적 문학 기능을 반영한 ‘인자’를 택했습니다.
- source_word: בְּנֵי עַמְּךָ
  english_pob_choice: the sons of your people
  chosen_korean: 네 백성의 자손
  alternatives_korean:
  - 네 백성
  - 네 백성의 사람들
  lexicon: HALOT
  rationale: 히브리어의 ‘아들들’ 표현을 유지해 성별을 지닌 집합 표현을 보존했습니다.
- source_word: צִדְקַת הַצַּדִּיק / רִשְׁעַת הָרָשָׁע
  english_pob_choice: the righteousness of the righteous man / the wickedness of the wicked man
  chosen_korean: 의로운 자의 의 / 악한 자의 악
  alternatives_korean:
  - 의인의 의 / 악인의 악
  - 의로운 이의 의 / 악한 이의 악
  lexicon: HALOT
  rationale: 문맥상 추상명사 צִדְקָה/רִשְׁעָה와 사람을 가리키는 형용사형의 대조를 살리면서도, ‘의인/악인’보다 원문의 반복 대구를 더 직접적으로 드러내기 위해 ‘의로운 자/악한 자’와 ‘의/악’을 대응시켰습니다.
- source_word: תַצִּילֶנּוּ / יִכָּשֶׁל / יוּכַל לִחְיוֹת
  english_pob_choice: will not deliver him / he will not stumble by it / will not be able to live by it
  chosen_korean: 그를 구해 주지 못하고 / 그것 때문에 걸려 넘어지지 않을 것입니다 / 그것으로 살 수 없습니다
  alternatives_korean:
  - 그를 건져 주지 못하고
  - 그것으로 인해 넘어지지 않을 것입니다
  - 그것으로 살아남을 수 없습니다
  lexicon: HALOT
  rationale: 구원의 종말론적 뉘앙스를 과도하게 덧씌우지 않도록 ‘구해 주다’를 사용했고, כשל의 은유를 ‘걸려 넘어지다’로 보존했으며, יכל의 불가능성을 ‘살 수 없다’로 간결하게 옮겼습니다.
theological_decisions:
- issue: 의인의 과거 의가 현재의 범죄를 덮어 주는지, 악인의 과거 악이 회개 후에도 계속 걸림돌이 되는지
  chosen_reading: 본문의 대구 구조를 따라, 이전의 의는 범죄의 날에 자동 보호가 되지 않고 이전의 악도 돌이킨 뒤에는 걸림돌로 남지 않는다는 원칙을 그대로 드러냈습니다.
  alternative_readings:
  - 구원 상실에 대한 교리적 선언
  - 성도의 견인에 대한 교리적 선언
  rationale: 예언적 경고의 시점과 윤리적 책임을 살리는 것이 우선이므로, 체계신학적 결론은 본문 밖으로 확장하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 마지막 절의 바탕이 되는 대명사 ‘그것’의 지시 대상
  chosen_reading: ‘그것’으로 유지하여, 앞선 ‘의’와 ‘악’에 각각 자연스럽게 연결되도록 했습니다.
  alternative_readings:
  - ‘그의 의로’처럼 명시적으로 풀기
  - ‘그의 이전 상태로’처럼 일반화하기
  rationale: 히브리어의 여성 단수 대명사가 앞선 추상명사를 가리키는 구조를 유지해야 대구와 연결성이 보존됩니다.
  doctrine_reference: Translation philosophy §1
