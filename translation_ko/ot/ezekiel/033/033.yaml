  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/בֹאָ֑/הּ הִנֵּ֣ה בָאָ֔ה וְ/יָ֣דְע֔וּ כִּ֥י נָבִ֖יא הָיָ֥ה בְ/תוֹכָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/033.yaml
  text: When it comes—and look, it is coming—then they will know that a prophet has been among them.
translation:
  language: ko
  text: 그것이 오면—보십시오, 그것이 오고 있습니다—그제야 그들은 자기들 가운데 한 예언자가 있었다는 것을 알게 될 것입니다.
  philosophy: formal
lexical_decisions:
- source_word: וּבְבֹאָהּ / בָאָה
  english_pob_choice: When it comes—and look, it is coming—
  chosen_korean: 그것이 오면—보십시오, 그것이 오고 있습니다—
  alternatives_korean:
  - 그것이 오면—보라, 그것이 오고 있습니다—
  - 그것이 임하면—보십시오, 그것이 임하고 있습니다—
  lexicon: בוא
  rationale: 히브리어의 반복을 살려 ‘오면’과 ‘오고 있습니다’로 긴박한 도래감을 중첩해 옮겼습니다. English POB의 ‘look’에 해당하는 감탄은 예언적 강조를 살려 ‘보십시오’로 처리했습니다.
- source_word: וְיָדְעוּ
  english_pob_choice: then they will know
  chosen_korean: 그제야 그들은 … 알게 될 것입니다
  alternatives_korean:
  - 그러면 그들은 … 알게 될 것입니다
  - 그때 그들은 … 알게 될 것입니다
  lexicon: ידע
  rationale: 결과를 나타내는 흐름을 드러내기 위해 ‘그제야’로 옮겨, 단순한 시간표시보다 인식의 성립을 강조했습니다.
- source_word: נָבִיא הָיָה בְתוֹכָם
  english_pob_choice: a prophet has been among them
  chosen_korean: 자기들 가운데 한 예언자가 있었다는 것
  alternatives_korean:
  - 그들 가운데 한 예언자가 있었다는 것
  - 그들 한가운데 예언자가 있었다는 것
  lexicon: נביא
  rationale: ‘among them’의 군중/공동체 내부성을 살리기 위해 ‘자기들 가운데’로 풀었고, 완료된 존재 사실을 한국어 관용에 맞게 ‘있었다는 것’으로 정리했습니다.
theological_decisions:
- issue: 예언의 성취를 드러내는 반복 강조
  chosen_reading: ‘오면—보십시오, 그것이 오고 있습니다—’로 반복을 유지해 심판/예언 성취의 절박함을 드러냈습니다.
  alternative_readings:
  - 반복을 줄여 ‘그것이 오면 그들이 알게 될 것입니다’로 간단히 처리
  - ‘보라’로 보다 성서적 어조를 강화
  rationale: 본문의 중복 동사와 감탄이 예언적 확증의 힘을 만들기 때문에 이를 약화시키지 않았습니다.
  doctrine_reference: 예언 성취와 하나님의 말씀의 확증
