  text: כֹּֽה תֹאמַ֨ר אֲלֵ/הֶ֜ם כֹּה אָמַ֨ר אֲדֹנָ֣/י יְהוִה֮ חַי אָנִי֒ אִם לֹ֞א אֲשֶׁ֤ר בֶּֽ/חֳרָבוֹת֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וַֽ/אֲשֶׁר֙ עַל פְּנֵ֣י הַ/שָּׂדֶ֔ה לַ/חַיָּ֥ה נְתַתִּ֖י/ו לְ/אָכְל֑/וֹ וַ/אֲשֶׁ֛ר בַּ/מְּצָד֥וֹת וּ/בַ/מְּעָר֖וֹת בַּ/דֶּ֥בֶר יָמֽוּתוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/027.yaml
  text: 'Thus you shall say to them[a], ‘Thus says the Lord GOD: As I live, surely those who are in the ruins will fall by the sword, and whoever is on the face of the field I have given to the wild animals to be devoured[c][b], and those who are in the strongholds and in the caves will die by pestilence.’'
  footnotes:
  - marker: a
    text: Hebrew 'waste places' or 'desolate places'; rendered 'ruins' for clear modern English in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'I have given him for food to the wild animals.' The Hebrew uses a singular suffix, likely with distributive force.
    reason: lexical_alternative
  - marker: c
    text: Or 'plague.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 그들에게 이렇게 말해야 합니다. ‘주 하나님께서 이렇게 말씀하십니다. 내가 살아 있는 한, 무너진 곳에 있는 자들은 반드시 칼에 쓰러질 것이며, 들의 열린 곳에 있는 자는 내가 그를 먹이로 들짐승에게 넘겼으니 삼켜질 것이고, 산성들과 동굴들에 있는 자들은 전염병으로 죽을 것입니다.’[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 בֶּחֳרָבוֹת는 문자적으로 ‘무너진 곳들/폐허들’입니다.
    reason: source_note
  - marker: b
    text: 원문 עַל פְּנֵי הַשָּׂדֶה는 직역하면 ‘들의 면 위에/들의 표면에’로, 노출된 들판을 가리킵니다.
    reason: source_note
  - marker: c
    text: 히브리어는 단수 대명사 어미를 쓰지만, 문맥상 집합적 의미로 이해됩니다.
    reason: source_note
lexical_decisions:
- source_word: כֹּה תֹאמַר ... כֹּה אָמַר
  english_pob_choice: Thus you shall say ... Thus says
  chosen_korean: 너는 그들에게 이렇게 말해야 합니다 … 이렇게 말씀하십니다
  alternatives_korean:
  - 그들에게 이렇게 말하십시오 … 이렇게 말씀하십니다
  - 너는 그들에게 말해야 합니다 … 말씀하십니다
  lexicon: HALOT
  rationale: 예언자에게 전달하는 메시지 공식과 신탁 도입을 자연스러운 현대 한국어로 살리되, 반복된 כֹּה의 형식감도 유지했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와
  lexicon: HALOT
  rationale: אֲדֹנָי와 YHWH가 결합된 호칭을 한국어에서 중복감 없이 옮기기 위해 ‘주 하나님’으로 처리했습니다.
- source_word: אֲשֶׁר בֶּחֳרָבוֹת
  english_pob_choice: those who are in the ruins
  chosen_korean: 무너진 곳에 있는 자들
  alternatives_korean:
  - 폐허들에 있는 자들
  - 황폐한 곳에 있는 자들
  lexicon: HALOT
  rationale: חֳרָבוֹת의 파괴된 장소라는 뜻을 구체적으로 드러내면서도, 문맥상 심판 아래 놓인 사람들을 자연스럽게 가리키도록 했습니다.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  english_pob_choice: on the face of the field
  chosen_korean: 들의 열린 곳
  alternatives_korean:
  - 밭의 겉면
  - 들판의 표면
  lexicon: HALOT
  rationale: ‘face of the field’의 표면적 어감을 살리되 한국어에서 의미가 통하도록 ‘열린 곳’으로 옮겨 노출됨을 강조했습니다.
- source_word: לַחַיָּה נְתַתִּיו לְאָכְלוֹ
  english_pob_choice: I have given to the wild animals to be devoured
  chosen_korean: 내가 그를 먹이로 들짐승에게 넘겼으니 삼켜질 것이고
  alternatives_korean:
  - 내가 그를 들짐승의 먹이로 주었으니 먹히게 될 것이고
  - 그를 들짐승에게 넘겨 삼키게 하였고
  lexicon: HALOT
  rationale: 히브리어의 ‘주다/넘기다’와 ‘먹다’ 관계를 한국어에서 ‘먹이로 … 넘겼다’로 풀어, 단순한 수동보다 심판의 적극적 전달을 드러냈습니다.
- source_word: בַּדֶּבֶר יָמוּתוּ
  english_pob_choice: will die by pestilence
  chosen_korean: 전염병으로 죽을 것입니다
  alternatives_korean:
  - 역병으로 죽을 것입니다
  - 염병으로 죽을 것입니다
  lexicon: HALOT
  rationale: דֶּבֶר의 심판적 질병을 현대 독자가 바로 이해하도록 ‘전염병’으로 옮겼습니다.
theological_decisions:
- issue: YHWH를 한국어에서 어떻게 처리할지
  chosen_reading: ‘주 하나님’으로 번역해 신탁의 위엄과 한국어 가독성을 함께 살렸습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절의 핵심은 하나님의 권위 있는 선포이며, 본문 내부의 호칭 중첩을 자연스럽게 전달하는 것이 우선이었습니다.
  doctrine_reference: Divine name rendering in prophetic formulae
