base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/027.yaml
  text: 'Thus you shall say to them[a], ‘Thus says the Lord GOD: As I live, surely those who are in the ruins will fall by the sword, and whoever is on the face of the field I have given to the wild animals to be devoured[c][b], and those who are in the strongholds and in the caves will die by pestilence.’'
  footnotes:
  - marker: a
    text: Hebrew 'waste places' or 'desolate places'; rendered 'ruins' for clear modern English in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'I have given him for food to the wild animals.' The Hebrew uses a singular suffix, likely with distributive force.
    reason: lexical_alternative
  - marker: c
    text: Or 'plague.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 그들에게 이렇게 말해야 합니다. ‘주 야훼께서 이렇게 말씀하십니다. 내가 살아 있음을 두고 맹세합니다. 폐허들에 있는 자들은 반드시 칼에 쓰러질 것이며[a], 들판에 있는 자는 내가 그를 들짐승의 먹이로 내주었으니, 그에게 먹힐 것입니다[b][c]. 요새들과 동굴들에 있는 자들은 전염병으로 죽을 것입니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בֶּחֳרָבוֹת는 ‘폐허들’, ‘황폐한 곳들’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 עַל פְּנֵי הַשָּׂדֶה는 직역하면 ‘들의 표면 위에’이며, 여기서는 피할 곳 없이 드러난 들판을 가리킵니다.
    reason: source_note
  - marker: c
    text: 히브리어는 ‘그를’이라는 단수 대명사 어미를 사용합니다. 이 문맥에서는 앞의 ‘들판에 있는 자’를 개별적으로 가리키는 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
