  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/שׁ֤וּב רָשָׁע֙ מֵֽ/רִשְׁעָת֔/וֹ וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָ֑ה עֲלֵי/הֶ֖ם ה֥וּא יִֽחְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/019.yaml
  text: And when a wicked man turns from his wickedness and does justice and righteousness[a], by them he shall live.
  footnotes:
  - marker: a
    text: Or 'because of them' or 'upon them'; the Hebrew phrase refers back to 'justice and righteousness' as the basis on which he lives.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 악인이 자기의 악에서 돌이켜 정의와 의를 행하면, 그로 말미암아 살 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그로 인해’, ‘그 위에’; 이 히브리어 구는 ‘정의와 의’를 삶의 근거로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְשׁוּב
  english_pob_choice: And when ... turns
  chosen_korean: 그리고 ... 돌이켜
  alternatives_korean:
  - '...할 때'
  - 그러나 ... 돌이킬 때
  lexicon: HALOT
  rationale: infinitive construct로 이루어진 시간절을 자연스러운 한국어 조건·시간 표현으로 옮기되, 단순한 접속이 아닌 전환의 흐름을 살렸습니다.
- source_word: רָשָׁע
  english_pob_choice: a wicked man
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람
  - 악한 자
  lexicon: HALOT
  rationale: 형용사가 명사처럼 쓰인 표현으로, 예언서의 도덕적 대조를 간결하게 드러내는 ‘악인’이 가장 직접적입니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: by them
  chosen_korean: 그로 말미암아
  alternatives_korean:
  - 그것들로 인해
  - 그것들로
  lexicon: HALOT
  rationale: 문맥상 ‘정의와 의’가 삶의 근거/수단이 된다는 뜻이므로, 원인·근거를 드러내는 ‘그로 말미암아’가 한국어로 가장 분명합니다.
theological_decisions:
- issue: ‘by them’의 인과·근거 관계를 어떻게 드러낼 것인가
  chosen_reading: ‘그로 말미암아’로 옮겨, 정의와 의가 삶의 근거가 된다는 점을 살렸습니다.
  alternative_readings:
  - ‘그것들로’처럼 단순 수단으로만 옮길 수 있음
  - ‘그 때문에’로 원인만 강조할 수 있음
  rationale: 히브리어 עלֵיהֶם은 여기서 단순한 동작 도구보다 ‘정의와 의를 행함’이 생명의 근거가 됨을 시사하므로, 본문이 가진 긴장을 보존하는 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
