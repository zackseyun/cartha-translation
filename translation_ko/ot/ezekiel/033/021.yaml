  naturalness: ‘그해는 열두째 해’는 히브리어 날짜 공식을 자연스럽게 옮기지 못하고 다소 어색합니다. ‘우리가 사로잡혀 간 지 열두째 해, 열째 달 초닷새에’가 현대 표준어 문장으로 더 자연스럽고 명확합니다.
