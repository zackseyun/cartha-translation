id: EZK.33.21
reference: Ezekiel 33:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֞י בִּ/שְׁתֵּ֧י עֶשְׂרֵ֣ה שָׁנָ֗ה בָּ/עֲשִׂרִ֛י בַּ/חֲמִשָּׁ֥ה לַ/חֹ֖דֶשׁ לְ/גָלוּתֵ֑/נוּ בָּא אֵלַ֨/י הַ/פָּלִ֧יט מִ/ירוּשָׁלִַ֛ם לֵ/אמֹ֖ר הֻכְּתָ֥ה הָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/021.yaml
  text: And it happened in the twelfth year[a], in the tenth month, on the fifth day of the month of our exile, that the fugitive from Jerusalem came to me, saying[b], “The city has been struck down.”
  footnotes:
  - marker: a
    text: Or “the survivor from Jerusalem.”
    reason: lexical_alternative
  - marker: b
    text: Or “The city has fallen.” The Hebrew more literally says “has been struck down.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그해는 열두째 해[a], 곧 열째 달 다섯째 날이었는데, 우리의 포로 생활 중에 예루살렘에서 도망쳐 온 사람이 내게 와서 말했습니다[b]. “그 성이 함락되었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “예루살렘에서 온 생존자”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그 성이 무너졌습니다.” 히브리어는 더 문자적으로 “쳐졌습니다”라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁתֵּ֧י עֶשְׂרֵ֣ה שָׁנָ֗ה
  english_pob_choice: in the twelfth year
  chosen_korean: 열두째 해
  alternatives_korean:
  - 열두 해째
  - 열두 번째 해
  lexicon: HALOT
  rationale: 히브리어 연대기 공식의 기능을 살려 자연스러운 현대 한국어로 옮겼습니다.
- source_word: לְ/גָלוּתֵ֑/נוּ
  english_pob_choice: of our exile
  chosen_korean: 우리의 포로 생활 중에
  alternatives_korean:
  - 우리의 포로기 동안
  - 우리의 유배 중에
  lexicon: HALOT
  rationale: גָּלוּת는 단순한 ‘감금’보다 추방된 상태를 가리키므로, 문맥상 자연스럽고 이해하기 쉬운 ‘포로 생활’로 옮겼습니다.
- source_word: הַ/פָּלִ֧יט
  english_pob_choice: the fugitive
  chosen_korean: 도망쳐 온 사람
  alternatives_korean:
  - 도망자
  - 피난해 온 사람
  - 생존자
  lexicon: HALOT
  rationale: ‘fugitive’의 핵심은 재난에서 빠져나와 도착한 사람이라는 점이므로, 문맥에 맞게 현재 도착 사실을 드러내는 표현을 택했습니다.
- source_word: הֻכְּתָ֥ה
  english_pob_choice: has been struck down
  chosen_korean: 함락되었습니다
  alternatives_korean:
  - 무너졌습니다
  - 쳐졌습니다
  - 무찔렸습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘쳐서 쓰러뜨리다/쳐지다’의 수동형이지만, 성이 전쟁으로 무너졌다는 결과를 한국어에서 가장 자연스럽게 드러내는 표현은 ‘함락되었습니다’입니다.
theological_decisions:
- issue: 예루살렘을 가리키는 ‘the city’와 직설적 파국 표현의 보존
  chosen_reading: 본문의 ‘그 성’과 ‘함락되었습니다’를 살려, 단순한 소식 전달이 아니라 심판 현실의 충격을 유지했습니다.
  alternative_readings:
  - 그 도시가 무너졌습니다
  - 그 성이 무너졌습니다
  rationale: 히브리어는 일반명사 ‘도시’를 유지하고, 동사도 ‘strike down’의 수동을 사용합니다. 이를 한국어에서 과도하게 완화하지 않기 위해 전쟁적 파국을 분명히 드러냈습니다.
  doctrine_reference: 에스겔 33장 문맥의 예루살렘 함락 선포
