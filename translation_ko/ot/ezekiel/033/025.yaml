revisions:
- from: 그러므로 그들에게 말하십시오[a]. "주 야훼께서 이렇게 말씀하십니다. 너희는 피를 먹고, 너희 우상들에게 눈을 들어 올리며, 피를 흘리는데[c][b], 그런데도 너희가 그 땅을 차지하겠느냐?"
  to: 그러므로 그들에게 말하십시오[a]. “주 야훼께서 이렇게 말씀하십니다. 너희는 피와 함께 먹고, 너희 우상들을 향해 눈을 들며[c], 피를 흘리는데, 그런데도 너희가 그 땅을 차지하겠느냐?”[b]
  rationale: 전치사 עַל의 의미 범위를 보존하기 위해 ‘피와 함께 먹고’로 고쳤고, 한국어 관용에 맞게 ‘우상들을 향해 눈을 들며’로 다듬었습니다. 우상 관련 각주 앵커를 해당 단어 뒤로 옮겼으며, 결론의 수사 의문문과 합쇼체 격식은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:44:31Z'
review_pass:
  verdict: revise
  source_fidelity: 주요 의미와 수사 의문문의 처리, 그리고 יהוה를 ‘야훼’로 옮긴 점은 원문에 충실합니다. 다만 עַל הַדָּם은 단순히 ‘피를 먹고’라고 하면 전치사구의 ‘피와 함께/피가 있는 채로’라는 표현을 축소할 수 있으므로 ‘피와 함께 먹고’가 더 안전합니다.
  naturalness: ‘우상들에게 눈을 들어 올리며’는 현대 한국어에서 어색한 결합입니다. 히브리어 관용의 방향성을 살리면서 자연스러운 ‘너희 우상들을 향해 눈을 들며’로 고치는 것이 좋습니다.
  terminology: ‘주 야훼’는 אֲדֹנָי יְהוִה에 적절합니다. ‘우상’은 גִּלּוּלִים의 기본 뜻을 자연스럽게 전달하며, 그 경멸적 뉘앙스는 각주로 보완할 수 있습니다. c 각주는 해당 낱말 바로 뒤에 놓아야 합니다.
  issues:
  - severity: medium
    issue: עַל הַדָּם을 ‘피를 먹고’로 번역함
    rationale: 원문의 עַל(‘~와 함께/~위에서’)이 지닌 표현상의 모호성과 관계를 한국어 본문에서 잃습니다. ‘피와 함께 먹고’는 혈액 금지 위반을 단정적으로 과잉 해석하지 않으면서 원문 표현을 보존합니다.
  - severity: medium
    issue: ‘우상들에게 눈을 들어 올리며’의 비자연스러운 표현
    rationale: 한국어에서는 ‘눈을 들어 올리다’보다 ‘~을 향해 눈을 들다’가 자연스럽습니다. 또한 히브리어 אֶל의 방향성도 더 잘 드러납니다.
  - severity: low
    issue: c 각주의 앵커 위치
    rationale: c 각주는 גִּלּוּלִים(우상)의 경멸적 성격을 설명하므로 ‘피를 흘리는데’ 뒤가 아니라 ‘우상들’ 바로 뒤에 붙여야 참조 대상이 분명합니다.
