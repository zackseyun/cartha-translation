id: EZK.33.25
reference: Ezekiel 33:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵן֩ אֱמֹ֨ר אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה עַל הַ/דָּ֧ם תֹּאכֵ֛לוּ וְ/עֵינֵ/כֶ֛ם תִּשְׂא֥וּ אֶל גִּלּוּלֵי/כֶ֖ם וְ/דָ֣ם תִּשְׁפֹּ֑כוּ וְ/הָ/אָ֖רֶץ תִּירָֽשׁוּ־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/025.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: You eat with the blood, and you lift up your eyes to your idols, and you shed blood[c][b]; shall you then possess the land?’'
  footnotes:
  - marker: a
    text: Or, more literally, “You eat over/with the blood,” likely referring to eating meat in violation of the prohibition concerning blood.
    reason: lexical_alternative
  - marker: b
    text: Or “and yet would you possess the land?” The Hebrew final clause may be read as an indignant rhetorical challenge.
    reason: alternative_reading
  - marker: c
    text: Hebrew גִּלּוּלִים is a contemptuous term for idols.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 그들에게 말하십시오[a]. "주 야훼께서 이렇게 말씀하십니다. 너희는 피를 먹고, 너희 우상들에게 눈을 들어 올리며, 피를 흘리는데[c][b], 그런데도 너희가 그 땅을 차지하겠느냐?"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들에게 말하라’입니다.
    reason: source_note
  - marker: b
    text: 마지막 절은 ‘그런데도 너희가 그 땅을 차지하겠느냐?’라는 뜻의 수사 의문문으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 גִּלּוּלִים는 우상에 대한 경멸적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 그래서
  lexicon: HALOT
  rationale: 앞 절의 고발을 바탕으로 한 추론적 접속을 자연스럽게 살리면서도 예언자적 문맥의 격식을 유지합니다.
- source_word: אֱמֹר אֲלֵיהֶם
  english_pob_choice: say to them
  chosen_korean: 그들에게 말하십시오
  alternatives_korean:
  - 그들에게 전하십시오
  - 그들에게 말씀하십시오
  lexicon: HALOT
  rationale: 예언자에게 주어진 직접 명령을 공손한 현대 한국어로 옮기되, 발화 행위 자체를 분명히 유지합니다.
- source_word: כֹּה אָמַר אֲדֹנָי יְהֹוִה
  english_pob_choice: Thus says the Lord GOD
  chosen_korean: 주 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주 하나님께서 이렇게 말씀하십니다
  - 주 여호와께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 본문의 예언자적 선포 공식을 살리면서, 문맥상 신명기적 계시명의 표준 표기를 야훼로 반영했습니다.
- source_word: עַל הַדָּם תֹּאכֵלוּ
  english_pob_choice: You eat with the blood
  chosen_korean: 너희는 피를 먹고
  alternatives_korean:
  - 너희는 피와 함께 먹고
  - 너희는 피 위에서 먹고
  lexicon: HALOT
  rationale: עַל + הדם의 관용적 표현은 혈액 금지 위반의 구체성을 지시하므로, 한국어에서 가장 직접적인 ‘피를 먹고’로 옮겼습니다.
- source_word: וְעֵינֵיכֶם תִּשְׂאוּ אֶל גִּלּוּלֵיכֶם
  english_pob_choice: and you lift up your eyes to your idols
  chosen_korean: 너희 우상들에게 눈을 들어 올리며
  alternatives_korean:
  - 너희 우상들을 향해 눈을 들며
  - 너희 우상들을 바라보며
  lexicon: HALOT
  rationale: ‘눈을 들어 올리다’의 히브리어 관용을 유지해 예배적/의존적 지향을 드러내고, גִּלּוּלִים의 경멸성을 ‘우상’으로 옮겼습니다.
- source_word: וְדָם תִּשְׁפֹּכוּ
  english_pob_choice: and you shed blood
  chosen_korean: 피를 흘리는데
  alternatives_korean:
  - 피를 쏟는데
  - 피를 흘리고
  lexicon: HALOT
  rationale: 히브리어의 통상적 폭력 표현을 한국어 관용구로 자연스럽게 살렸습니다.
- source_word: וְהָאָרֶץ תִּירָשׁוּ
  english_pob_choice: Shall you then possess the land?
  chosen_korean: 그런데도 너희가 그 땅을 차지하겠느냐?
  alternatives_korean:
  - 그런데도 너희가 그 땅을 소유하겠느냐?
  - 그 땅을 차지할 수 있겠느냐?
  lexicon: HALOT
  rationale: 결론부는 인과적 논박이 담긴 수사 의문문이므로, 단순 서술보다 책망의 힘이 드러나는 반문으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 사용하는 언약명은 프로젝트 기본값에 따라 야훼로 옮겨, 예언 선포 안에서 이름의 고유성을 보존했습니다.
  doctrine_reference: Contested terms — יהוה / YHWH → 야훼
- issue: ‘그 땅을 차지하겠느냐?’의 문장 힘
  chosen_reading: 수사 의문문으로 처리
  alternative_readings:
  - 서술문으로 처리
  - 완곡한 가능성 표현
  rationale: 문맥은 죄책과 상속 불가를 드러내는 책망이므로, 반문으로 옮겨 심판의 압박을 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve source sense in readable modern Korean'
