id: EZK.33.18
reference: Ezekiel 33:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/שׁוּב צַדִּ֥יק מִ/צִּדְקָת֖/וֹ וְ/עָ֣שָׂה עָ֑וֶל וּ/מֵ֖ת בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/018.yaml
  text: When a righteous man turns from his righteousness and does injustice[b][a], he shall die because of them.
  footnotes:
  - marker: a
    text: Or 'wrong,' 'iniquity,' or 'unrighteousness' for 'injustice.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in them' or 'by them'; the sense is that he dies on account of those wrongful deeds.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인이라도 자기 의에서 돌아서서 불의를 행하면, 그 일들 때문에 죽을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בָּהֶם는 문자적으로는 ‘그들 안에서/그것들 안에서’이지만, 문맥상 직전의 불의한 행위들을 가리켜 ‘그 일들 때문에’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: עָוֶל은 ‘불의’ 외에도 ‘잘못’, ‘죄악’, ‘부정’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב / צַדִּיק
  english_pob_choice: When a righteous man turns
  chosen_korean: 의인이라도 ... 돌아서서
  alternatives_korean:
  - 의인이 ... 돌이켜
  - 의인이 ... 돌아가
  lexicon: HALOT
  rationale: 조건-시간 절을 자연스러운 현대 한국어로 옮기되, צַדִּיק는 성별을 지우지 않고 ‘의인’으로 표현했습니다.
- source_word: מִצִּדְקָתוֹ
  english_pob_choice: from his righteousness
  chosen_korean: 자기 의에서
  alternatives_korean:
  - 자기의 의에서
  - 그의 의에서
  - 의로운 행실에서
  lexicon: HALOT
  rationale: צדקה를 ‘의’로 옮겨 도덕적/언약적 상태를 직접 드러냈고, 소유격은 ‘자기’로 자연스럽게 처리했습니다.
- source_word: עָוֶל
  english_pob_choice: injustice
  chosen_korean: 불의
  alternatives_korean:
  - 부정
  - 불공정
  - 악
  lexicon: HALOT
  rationale: POB의 ‘injustice’에 대응해 한국어 성서어법에서 자주 쓰이면서도 의미를 넓게 담는 ‘불의’를 선택했습니다.
- source_word: וּמֵת בָּהֶם
  english_pob_choice: he shall die because of them
  chosen_korean: 그 일들 때문에 죽을 것입니다
  alternatives_korean:
  - 그것들 때문에 죽을 것입니다
  - 그 죄들로 인해 죽을 것입니다
  - 그것들 안에서 죽을 것입니다
  lexicon: HALOT
  rationale: בָּהֶם의 원뜻인 ‘그것들 안에서/그것들로 말미암아’를 문맥에 따라 원인 의미로 풀어, 잘못된 행위들에 대한 사법적 결과를 분명히 했습니다.
theological_decisions:
- issue: 의인의 전환이 의미하는 신학적 범주
  chosen_reading: 본문의 경고를 그대로 살려, 의인이 의에서 돌아서 불의를 행하면 그 행위들 때문에 죽는다고 옮겼습니다.
  alternative_readings:
  - 구원 상실의 교리로 단정함
  - 단지 육체적 죽음만을 뜻한다고 한정함
  rationale: 히브리어는 도덕적 전환과 그 결과를 말할 뿐이므로, 교리적 결론을 미리 고정하지 않고 긴장을 유지해야 합니다.
  doctrine_reference: 본문 우선 원칙; 신학적 긴장 보존
