id: EZK.33.16
reference: Ezekiel 33:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל חטאת/ו אֲשֶׁ֣ר חָטָ֔א לֹ֥א תִזָּכַ֖רְנָה ל֑/וֹ מִשְׁפָּ֧ט וּ/צְדָקָ֛ה עָשָׂ֖ה חָי֥וֹ יִֽחְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/016.yaml
  text: None of the sins that he committed will be remembered against him[a]; he has done justice and righteousness; he shall surely live.
  footnotes:
  - marker: a
    text: Or 'will not be counted against him.' The Hebrew literally says 'will not be remembered to him,' with a judicial sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 지은 죄는 어느 하나도 그에게 불리하게 기억되지 않을 것입니다[a]. 그는 정의와 의를 행했습니다. 그는 반드시 살 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 기억되지 않을 것입니다.’ 히브리어는 문자적으로 ‘그에게 기억되지 않을 것입니다’라고 말하며, 여기서는 죄가 그에게 불리하게 적용되거나 거론되지 않는다는 법정적 의미를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל חטאתו אֲשֶׁר חָטָא
  english_pob_choice: None of the sins that he committed
  chosen_korean: 그가 지은 모든 죄
  alternatives_korean:
  - 그가 범한 죄들
  - 그의 모든 죄
  lexicon: HALOT
  rationale: כָּל과 יח수형 ‘그의 죄’가 문맥상 분배적으로 작동하므로, 한국어에서도 복수적·분배적 의미가 드러나는 ‘모든 죄’로 옮겼습니다.
- source_word: לֹא תִזָּכַרְנָה לוֹ
  english_pob_choice: will be remembered against him
  chosen_korean: 그에게 기억되지 않을 것입니다
  alternatives_korean:
  - 그에게 기억되지 않을 것입니다—그에게 불리하게
  - 그에게 기억되지 않을 것입니다
  - 그에게 계산되지 않을 것입니다
  lexicon: HALOT
  rationale: זכר의 수동형과 전치사 ל의 결합은 단순 기억이 아니라 그 사람과 관련된 법정적 기억을 뜻하므로, 본문은 자연스럽게 두되 각주로 ‘불리하게 셈해지다’의 대안 가능성을 남겼습니다.
- source_word: מִשְׁפָּט וּצְדָקָה עָשָׂה
  english_pob_choice: he has done justice and righteousness
  chosen_korean: 그는 정의와 의를 행했습니다
  alternatives_korean:
  - 그는 공의와 의를 행했습니다
  - 그는 정의와 공의를 행했습니다
  lexicon: HALOT
  rationale: 예언서의 상투적 윤리쌍을 한국어에서 가장 직접적으로 살리기 위해 מִשְׁפָּט은 ‘정의’, צְדָקָה는 ‘의’로 옮겼고, עשה는 문맥상 행위의 실천을 나타내어 ‘행했습니다’로 처리했습니다.
- source_word: חָיוֹ יִחְיֶה
  english_pob_choice: he shall surely live
  chosen_korean: 그는 반드시 살 것입니다
  alternatives_korean:
  - 그는 틀림없이 살 것입니다
  - 그는 살아서 살 것입니다
  lexicon: HALOT
  rationale: 동사 어근의 반복이 강조하는 확실성을 한국어의 ‘반드시’로 살려, 단순 미래보다 강한 확증을 드러냈습니다.
theological_decisions:
- issue: 죄의 ‘기억됨’이 갖는 법정적 의미
  chosen_reading: ‘그에게 기억되지 않을 것입니다’로 옮기되, 각주에서 그것이 ‘불리하게 셈해지지 않는다’는 법정적 뉘앙스를 반영하도록 했습니다.
  alternative_readings:
  - 그에게 불리하게 셈해지지 않을 것입니다
  - 그에게 기억되지 않을 것입니다—법정적으로
  rationale: 본문은 회개한 사람의 과거 죄가 더 이상 책임 추궁의 근거로 기억되지 않는다는 뜻을 가지므로, 신학적 해설을 본문에 과도하게 덧붙이지 않으면서도 그 긴장을 보존해야 합니다.
  doctrine_reference: 예언자적 책임/용서의 표상은 후대 교리 용어로 평탄화하지 않고 본문 자체의 법정적 언어를 유지합니다.
