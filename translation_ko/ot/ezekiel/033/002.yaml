  source_fidelity: 핵심 의미와 조건문의 구조, ‘칼’과 ‘파수꾼’의 비유적·문학적 어휘는 대체로 충실합니다. 다만 בְּנֵי עַמְּךָ를 ‘너의 백성의 자손들’로 옮기면 ‘후손’이라는 시간적 의미가 강해져 원문의 직접 호칭에 부정확합니다. 또한 ‘칼을 가져오다’는 한국어에서 다소 직역투입니다.
  naturalness: ‘말하여 그들에게 말하라’는 원문의 반복을 지나치게 기계적으로 재현하여 부자연스럽습니다. ‘말하여 그들에게 이르라’가 현대 한국어 성경 문체 안에서 자연스럽고 명료합니다. ‘칼을 내리다’는 전쟁·심판의 칼이라는 표현과 자연스럽게 결합합니다.
  terminology: ‘인자야’와 ‘파수꾼’은 에스겔의 반복 어휘와 문맥상 기능을 적절히 보존합니다. ‘아들들’은 한국어에서 다소 표지적인 표현이나, 원문의 남성 복수 명사를 보존하려는 번역 방침에 부합하며 ‘자손들’보다 정확합니다.
