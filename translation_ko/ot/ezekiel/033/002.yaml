  rationale: 원문의 미완결 조건절(33:3으로 이어짐)을 한국어에서도 ‘…세우면,’으로 보존했습니다. ‘자손들’을 ‘아들들’로 고쳐 후손이라는 불필요한 의미를 제거했고, 동사와 관용 표현을 현대 격식체에 맞게 다듬었습니다. 각주 표지는 본문 말미에 유지하며, ‘칼’의 비유적 쓰임만 간결하게 설명했습니다.
