- from: 인자야, 너의 백성의 자손들에게 말하여 그들에게 말하라. 「내가 어떤 땅에 칼을 가져올 때에, 그 땅의 백성이 그들 가운데서 한 사람을 택하여 자기들의 파수꾼으로 세운다면」[a]
