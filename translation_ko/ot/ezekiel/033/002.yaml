base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/002.yaml
  text: Son of man[a], speak to the sons of your people and say to them, ‘If I bring a sword upon a land, and the people of the land take one man from among them and appoint him as their watchman,’
  footnotes:
  - marker: a
    text: Or 'If I bring the sword upon a land.' The Hebrew 'sword' is a conventional image for warfare or judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 너의 백성의 자손들에게 말하여 그들에게 말하라. 「내가 어떤 땅에 칼을 가져올 때에, 그 땅의 백성이 그들 가운데서 한 사람을 택하여 자기들의 파수꾼으로 세운다면」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘칼’은 여기서 전쟁과 심판을 가리키는 관용적 이미지일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔에서 반복되는 신적 호칭을 살리기 위해 직역적 대체어보다 관용적으로 굳어진 ‘인자’의 호칭을 유지했습니다.
- source_word: בְּנֵי עַמְּךָ
  english_pob_choice: the sons of your people
  chosen_korean: 너의 백성의 자손들에게
  alternatives_korean:
  - 너의 백성에게
  - 너의 백성의 아들들에게
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표현을 그대로 반영하되, 한국어에서는 자연스러운 집합 표현인 ‘자손들’로 옮겨 성별 표지를 유지했습니다.
- source_word: אָבִיא עָלֶיהָ חָרֶב
  english_pob_choice: I bring a sword upon a land
  chosen_korean: 내가 어떤 땅에 칼을 가져올 때에
  alternatives_korean:
  - 내가 그 땅에 칼을 가져올 때에
  - 내가 그 땅에 전쟁을 가져올 때에
  lexicon: HALOT
  rationale: ‘칼’은 히브리어의 전쟁·심판 이미지를 보존하는 구체적 표현이므로, 해석어인 ‘전쟁’보다 원형 이미지를 살렸습니다.
- source_word: וְנָתְנוּ אֹתוֹ לָהֶם לְצֹפֶה
  english_pob_choice: appoint him as their watchman
  chosen_korean: 자기들의 파수꾼으로 세운다면
  alternatives_korean:
  - 자기들의 파수꾼으로 임명한다면
  - 자기들을 지키는 사람으로 세운다면
  lexicon: HALOT
  rationale: צֹפֶה는 주변 문맥상 경계·감시 역할이므로, 전통적이면서도 기능을 분명히 드러내는 ‘파수꾼’을 선택했습니다.
theological_decisions:
- issue: 조건절의 범위와 어조
  chosen_reading: 전체를 가정법 조건문으로 처리하고, 인용문 안에서도 예언적 지시가 이어지는 구조를 유지했습니다.
  alternative_readings:
  - 직설적 미래로 옮김
  - 조건절을 앞에서 끊어 설명문으로 재구성
  rationale: 히브리어 כִּי와 전체 문맥은 가상의 상황 제시이므로, 한국어에서도 조건문의 긴장감을 보존하는 것이 본문 기능에 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
