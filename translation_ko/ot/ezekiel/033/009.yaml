  to: 그러나 당신이 악한 사람에게 자기 길에서 돌이키라고 경고했는데도 그가 자기 길에서 돌이키지 않으면, 그는 자기 죄악 가운데서[a] 죽을 것이지만, 당신은 당신의 생명을[b] 건질 것입니다.
