  terminology: ‘악한 사람’, ‘길’, ‘돌이키다’, ‘죄악’, ‘생명’, ‘건지다’는 문맥과 현대 한국어에 적절합니다. נֶפֶשׁ는 이 문맥에서 비물질적 영혼으로 단정하지 않는 것이 타당하므로 ‘생명’을 유지하되, 각주에서 ‘자신/영혼’의 가능한 이해를 설명합니다.
