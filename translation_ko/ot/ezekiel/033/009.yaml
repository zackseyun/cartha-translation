id: EZK.33.9
reference: Ezekiel 33:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/אַתָּה כִּֽי הִזְהַ֨רְתָּ רָשָׁ֤ע מִ/דַּרְכּ/וֹ֙ לָ/שׁ֣וּב מִמֶּ֔/נָּה וְ/לֹא שָׁ֖ב מִ/דַּרְכּ֑/וֹ ה֚וּא בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/אַתָּ֖ה נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/009.yaml
  text: But if you warn a wicked man to turn from his way[a], and he does not turn from his way, he will die in his iniquity[b]; but you will have delivered your soul.
  footnotes:
  - marker: a
    text: Or 'you have saved your soul.' Here 'life' renders Hebrew nephesh in the sense of one's life/self, not necessarily the immaterial soul.
    reason: lexical_alternative
  - marker: b
    text: '''He will die in his iniquity'' may also be understood as ''he will die for his iniquity.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 악한 사람에게 그의 길에서 돌이키라고 경고하였는데도 그가 자기 길에서 돌이키지 않으면, 그는 자기 죄악으로 죽을 것이고, 당신은 당신의 생명을 건질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신은 당신의 생명을 구하였습니다.’ 여기서 ‘생명’은 히브리어 nephesh를 옮긴 것으로, 반드시 비물질적 영혼만을 뜻하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그는 자기 죄악으로 죽을 것이다’는 ‘그는 자기 죄악 때문에 죽을 것이다’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִזְהַרְתָּ
  english_pob_choice: warn
  chosen_korean: 경고하였는데도
  alternatives_korean:
  - 경고했습니다
  - 주의를 주었는데도
  - 일러 주었는데도
  lexicon: HALOT
  rationale: 히필 형태의 זהר는 ‘경고하다’의 뜻이므로, 단순한 훈계보다 분명한 경고의 뉘앙스를 살렸습니다.
- source_word: רָשָׁע
  english_pob_choice: wicked man
  chosen_korean: 악한 사람
  alternatives_korean:
  - 악인
  - 사악한 사람
  - 악한 자
  lexicon: HALOT
  rationale: 서술적 성격의 רָשָׁע를 한국어에서 자연스러운 품사로 옮기되, 도덕적 평가를 유지하기 위해 ‘악한 사람’으로 렌더링했습니다.
- source_word: מִדַּרְכּוֹ ... לָשׁוּב מִמֶּנָּה
  english_pob_choice: to turn from his way
  chosen_korean: 그의 길에서 돌이키라고
  alternatives_korean:
  - 그의 길에서 돌아서라고
  - 그의 길을 떠나라고
  - 그 길에서 돌아오라고
  lexicon: HALOT
  rationale: ‘길’은 예언서에서 행위와 삶의 방식을 가리키는 은유이므로 그대로 살렸고, ‘돌이키다’로 회개/전환의 동작을 표현했습니다.
- source_word: וְלֹא שָׁב מִדַּרְכּוֹ
  english_pob_choice: and he does not turn from his way
  chosen_korean: 그가 자기 길에서 돌이키지 않으면
  alternatives_korean:
  - 그가 그 길에서 돌이키지 않으면
  - 그가 자기 길로 돌아서지 않으면
  lexicon: HALOT
  rationale: 히브리어의 반복을 한국어에서 자연스럽게 처리하면서도 동일한 ‘길’ 이미지를 유지했습니다.
- source_word: בַּעֲוֺנוֹ
  english_pob_choice: in his iniquity
  chosen_korean: 자기 죄악으로
  alternatives_korean:
  - 자기 죄악 가운데서
  - 자기 죄악 안에서
  - 그의 죄악 안에서
  lexicon: HALOT
  rationale: בְּ + עָוֹן은 죽음의 결과/상태를 나타낼 수 있어, 한국어에서는 원인-결과가 드러나는 ‘~으로’가 가장 자연스럽습니다.
- source_word: הִצַּלְתָּ־
  english_pob_choice: you will have delivered
  chosen_korean: 당신은 당신의 생명을 건질 것입니다
  alternatives_korean:
  - 당신은 당신의 생명을 구할 것입니다
  - 당신은 당신의 혼을 건질 것입니다
  - 당신은 당신 자신을 구할 것입니다
  lexicon: HALOT
  rationale: נצל의 기본 의미인 ‘구하다, 건지다’를 살렸고, נֶפֶשׁ는 여기서 영혼보다 ‘생명’이 문맥상 더 정확합니다.
- source_word: נַפְשְׁךָ
  english_pob_choice: your soul / your life
  chosen_korean: 당신의 생명
  alternatives_korean:
  - 당신의 영혼
  - 당신 자신
  lexicon: HALOT
  rationale: 본문의 נֶפֶשׁ는 형이상학적 ‘영혼’보다 생명/자기 존재를 가리키므로, 독자가 오해하지 않도록 ‘생명’으로 옮겼습니다.
theological_decisions:
- issue: נֶפֶשׁ의 의미와 한국어 ‘영혼’ 사용 여부
  chosen_reading: 문맥상 ‘생명’으로 번역하여, 파수꾼의 책임이 실제 생명 보전과 무죄 선언에 관련됨을 드러냅니다.
  alternative_readings:
  - 당신의 영혼을 건질 것입니다
  - 당신 자신을 건질 것입니다
  rationale: 이 절은 인간론적 영혼/몸 구분보다 경고를 통해 책임을 다했는지 여부를 다루므로, ‘영혼’보다 ‘생명’이 원문 의미를 더 직접적으로 전달합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ‘그는 자기 죄악으로 죽을 것이다’의 관계
  chosen_reading: 개인의 죽음이 자기 죄악과 연결되지만, 파수꾼의 책임은 경고 여부에 달려 있다는 긴장을 그대로 유지합니다.
  alternative_readings:
  - 그는 자기 죄악 때문에 죽을 것이다
  - 그는 자기 죄악에 따라 죽을 것이다
  rationale: 히브리어의 간결한 표현을 과도하게 풀지 않고, 죄와 죽음의 연결 및 파수꾼의 면책을 함께 보존했습니다.
  doctrine_reference: Translation philosophy §3
