  rationale: צַדִּיק은 단순히 성품이 좋은 사람이 아니라 ‘의인’이라는 정체성 명사를 가리키므로, 간결하게 ‘의인’으로 옮겼습니다.
- source_word: חָיֹה יִחְיֶה / He shall surely live
