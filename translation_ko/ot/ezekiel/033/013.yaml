  lexicon: HALOT
  rationale: 강조형 ‘살아야 살 것이다’의 의미를 한국어의 ‘반드시’로 살렸고, 직접 화법 안에서는 인칭을 자연스럽게 드러내기 위해 2인칭으로 옮겼습니다.
- source_word: צִדְקָתוֹ / his righteousness
