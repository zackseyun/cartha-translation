theological_decisions:
- issue: ‘의인’이 자기 의를 믿고 불의를 행할 때의 경고를 어떻게 표현할지
  chosen_reading: 문맥의 경고를 완화하지 않고, 의로운 행위가 ‘기억되지 않는다’는 법정적·언약적 뉘앙스를 그대로 살렸습니다.
  alternative_readings:
  - 의로운 행위가 ‘인정되지 않는다’고 더 해석적으로 옮김
  - 구원 상실 논쟁을 피하려고 완곡하게 처리함
  rationale: 히브리어는 실제 경고를 제시하며, 본문이 말하는 긴장—이전 의로운 행위가 불의 앞에서 기억되지 않음—을 보존하는 것이 원문 충실성에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
