id: EZK.33.24
reference: Ezekiel 33:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֶּן אָדָ֗ם יֹ֠שְׁבֵי הֶ/חֳרָב֨וֹת הָ/אֵ֜לֶּה עַל אַדְמַ֤ת יִשְׂרָאֵל֙ אֹמְרִ֣ים לֵ/אמֹ֔ר אֶחָד֙ הָיָ֣ה אַבְרָהָ֔ם וַ/יִּירַ֖שׁ אֶת הָ/אָ֑רֶץ וַ/אֲנַ֣חְנוּ רַבִּ֔ים לָ֛/נוּ נִתְּנָ֥ה הָ/אָ֖רֶץ לְ/מוֹרָשָֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/024.yaml
  text: Son of man, the inhabitants of these ruins on the land of Israel are saying, ‘Abraham was only one man, yet he possessed the land; but we are many—the land has been given to us as a possession.’
translation:
  language: ko
  text: 「사람의 아들아, 이스라엘 땅에 있는 이 황폐한 곳의 주민들이 말하기를, ‘아브라함은 오직 한 사람이었으나 그가 그 땅을 소유하였고, 우리는 많으니 그 땅이 우리에게 소유로 주어졌다’」[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 “사람의 아들”이며, 에스겔서에서 예언자를 부르는 호칭입니다.
    reason: cross_reference
lexical_decisions:
- source_word: בֶּן אָדָ֗ם
  english_pob_choice: Son of man
  chosen_korean: 사람의 아들아
  alternatives_korean:
  - 인자여
  - 사람아
  lexicon: 인자
  rationale: 에스겔의 예언자 호칭으로서 전통적이고 본문 기능을 살리는 호격을 택했습니다.
- source_word: יֹשְׁבֵי הֶחֳרָבוֹת
  english_pob_choice: the inhabitants of these ruins
  chosen_korean: 이 황폐한 곳의 주민들
  alternatives_korean:
  - 이 폐허들의 주민들
  - 이 무너진 곳의 거주자들
  lexicon: 주민 / 황폐한 곳
  rationale: 거주 대상을 사람으로 분명히 하되, חֳרָבוֹת의 폐허·황폐 상태를 직접 드러내는 표현으로 옮겼습니다.
- source_word: אֶחָד ... וַיִּירַשׁ אֶת הָאָרֶץ
  english_pob_choice: Abraham was only one man, yet he possessed the land
  chosen_korean: 아브라함은 오직 한 사람이었으나 그가 그 땅을 소유하였고
  alternatives_korean:
  - 아브라함은 하나였으나 그가 그 땅을 차지하였고
  - 아브라함은 한 사람뿐이었으나 그가 그 땅을 상속받았고
  lexicon: 오직 한 사람 / 소유하다
  rationale: Pob의 ‘only one man’과 ‘possessed the land’를 따라 수량 대비와 소유의 논리를 살렸습니다. '상속받다'는 가능하지만 כאן의 핵심은 점유·소유 주장에 더 가깝다고 보았습니다.
- source_word: לְמוֹרָשָׁה
  english_pob_choice: as a possession
  chosen_korean: 소유로
  alternatives_korean:
  - 유산으로
  - 상속 재산으로
  lexicon: 소유 / 기업
  rationale: 문맥상 이 구절은 땅을 자신들에게 귀속된 소유물로 주장하는 뜻이 강하므로, 간결하게 '소유로'로 옮겼습니다.
theological_decisions:
- issue: 아브라함의 땅 소유 표현과 언약적 정당성 주장
  chosen_reading: 본문은 주민들의 자기정당화 주장을 직접 인용하며, 그 주장의 허구성을 약화시키지 않고 그대로 드러냅니다.
  alternative_readings:
  - 언약의 기업을 암시하는 중립적 표현으로 순화
  - '''상속''을 중심으로 신학적 의미를 보강'
  rationale: 히브리어와 POB의 진행은 그들이 수를 근거로 땅의 소유권을 주장하는 장면이므로, 신학적으로 완화하지 않고 주장 자체를 선명하게 보존했습니다.
  doctrine_reference: 토지 언약 / 심판 문맥
