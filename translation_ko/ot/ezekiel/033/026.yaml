  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֲמַדְתֶּ֤ם עַֽל חַרְבְּ/כֶם֙ עֲשִׂיתֶ֣ן תּוֹעֵבָ֔ה וְ/אִ֛ישׁ אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ טִמֵּאתֶ֑ם וְ/הָ/אָ֖רֶץ תִּירָֽשׁוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/026.yaml
  text: You stand on your sword[a], you commit abominations, and each of you defiles his neighbor’s wife[b]. Shall you then possess the land?
  footnotes:
  - marker: a
    text: Literally, 'You stand on your sword.' The expression likely means relying on violence or armed power.
    reason: lexical_alternative
  - marker: b
    text: Or 'Will you inherit the land?'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 너희의 칼을 의지하고[a], 가증한 일을 행하며, 각기 자기 이웃의 아내를 더럽히고도 그 땅을 차지하겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '너희가 너희 칼 위에 섰다'입니다. 문맥상 폭력이나 무력에 기대는 태도를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그 땅을 유업으로 받겠습니까?'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמַדְתֶּם עַל חַרְבְּכֶם
  english_pob_choice: You stand on your sword
  chosen_korean: 칼 위에 의지하고
  alternatives_korean:
  - 칼 위에 서고
  - 칼을 의지하고
  - 칼에 기대고
  lexicon: HALOT
  rationale: 히브리어는 직역하면 '너희가 너희 칼 위에 섰다'이지만, 문맥상 폭력과 무력에 기대는 태도를 가리키므로 한국어에서는 '의지하고'로 그 함의를 살렸습니다.
- source_word: חַרְבְּכֶם
  english_pob_choice: your sword
  chosen_korean: 칼
  alternatives_korean:
  - 검
  - 무기
  lexicon: HALOT
  rationale: חרב는 구체적으로 '칼/검'이며, 문맥의 폭력성을 살리기 위해 일반적인 '무기'보다 구체적인 '칼'을 택했습니다.
- source_word: תּוֹעֵבָה
  english_pob_choice: abominations
  chosen_korean: 가증한 일
  alternatives_korean:
  - 가증한 것들
  - 혐오스러운 일
  - 역겨운 일
  lexicon: HALOT
  rationale: תועבה는 윤리적·언약적 차원의 혐오스러운 행위를 가리키므로, 단수 집합적 의미를 살려 '가증한 일'로 옮겼습니다.
- source_word: וְאִישׁ אֶת אֵשֶׁת רֵעֵהוּ טִמֵּאתֶם
  english_pob_choice: each of you defiles his neighbor’s wife
  chosen_korean: 각기 이웃의 아내를 더럽히니
  alternatives_korean:
  - 각 사람마다 이웃의 아내를 더럽히니
  - 각기 자기 이웃의 아내를 더럽히니
  lexicon: HALOT
  rationale: איש의 분배적 용법을 '각기'로 살리고, טמא의 Piel을 성적·도덕적 오염의 강한 표현인 '더럽히다'로 옮겼습니다.
- source_word: וְהָאָרֶץ תִּירָשׁוּ
  english_pob_choice: Shall you then possess the land?
  chosen_korean: 그러고도 그 땅을 차지하겠느냐?
  alternatives_korean:
  - 그러고도 그 땅을 소유하겠느냐?
  - 그러고도 그 땅을 유업으로 받겠느냐?
  lexicon: HALOT
  rationale: 문맥상 예언자적 책망의 수사 의문문이므로 '차지하겠느냐?'로 자연스럽게 옮겼고, ירש의 '점유/차지' 의미를 살렸습니다.
theological_decisions:
- issue: 마지막 절의 문장 유형
  chosen_reading: '수사적 의문문으로 처리했습니다: ''그러고도 그 땅을 차지하겠느냐?'''
  alternative_readings:
  - '서술문으로 처리: ''그리고 너희가 그 땅을 차지할 것이다'''
  rationale: 문맥은 폭력과 부정함을 지닌 자들에 대한 예언자적 질책이므로, 선언보다 도전적인 수사 의문문이 원문의 책망 효과를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 남성 분배적 표현
  chosen_reading: '''각기 ... 이웃의 아내''로 남성적 분배 의미를 보존했습니다.'
  alternative_readings:
  - 성중립화하여 '각 사람의 이웃의 아내'
  - 복수 중립화하여 '너희 각자가 이웃의 아내'
  rationale: 히브리어 איש은 여기서 분배적 남성 의미를 지니며, 간음 대상의 사회적 관계를 분명히 드러내기 위해 그 성별 표지를 약화하지 않았습니다.
  doctrine_reference: Translation philosophy §4
