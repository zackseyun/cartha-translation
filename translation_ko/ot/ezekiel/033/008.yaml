  text: בְּ/אָמְרִ֣/י לָ/רָשָׁ֗ע רָשָׁע֙ מ֣וֹת תָּמ֔וּת וְ/לֹ֣א דִבַּ֔רְתָּ לְ/הַזְהִ֥יר רָשָׁ֖ע מִ/דַּרְכּ֑/וֹ ה֤וּא רָשָׁע֙ בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/008.yaml
  text: When I say to the wicked[a], ‘Wicked one, you shall surely die,’ and you do not speak to warn the wicked from his way, that wicked man shall die in his iniquity, but I will require his blood from your hand.
  footnotes:
  - marker: a
    text: Or, 'I will hold you accountable for his blood.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 악인에게 말할 때에, “악인아, 너는 반드시 죽을 것이다” 하였는데도 네가 악인을 그의 길에서 돌이키도록 경고하려고 말하지 않으면, 그 악인은 자기의 악행 때문에 죽을 것이나, 나는 그의 피를 네 손에서 찾을 것이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 피에 대한 책임을 네게서 묻겠다’는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָמְרִי / When I say
  english_pob_choice: When I say
  chosen_korean: 내가 말할 때에
  alternatives_korean:
  - 내가 말하면
  - 내가 말하는 때에
  lexicon: HALOT
  rationale: 히브리어 בְּ + 동사구가 시간적 종속절을 이루므로, 한국어에서는 자연스러운 조건적-시간 표현인 “말할 때에”로 옮겼습니다.
- source_word: לָרָשָׁע / to the wicked
  english_pob_choice: to the wicked
  chosen_korean: 악인에게
  alternatives_korean:
  - 악한 자에게
  - 죄인에게
  lexicon: HALOT
  rationale: רָשָׁע는 법적 ‘죄인’보다 도덕적 범주인 ‘악인’을 가리키므로, 기본 어휘를 유지했습니다.
- source_word: לְהַזְהִיר / to warn
  english_pob_choice: to warn
  chosen_korean: 경고하려고 말하지 않으면
  alternatives_korean:
  - 경고하지 않으면
  - 깨우치려고 말하지 않으면
  lexicon: HALOT
  rationale: 히필형의 ‘경고하다’ 의미를 살리되, 뒤의 ‘말하지 않으면’과 연결해 사역적 뉘앙스를 드러냈습니다.
- source_word: מִדַּרְכּוֹ / from his way
  english_pob_choice: from his way
  chosen_korean: 그의 길에서
  alternatives_korean:
  - 그의 행실에서
  - 그의 삶의 길에서
  lexicon: HALOT
  rationale: ‘길’은 히브리어의 삶의 방식 은유를 한국어에서도 가장 직접적으로 보존합니다.
- source_word: בַּעֲוֺנוֹ / in his iniquity
  english_pob_choice: in his iniquity
  chosen_korean: 자기의 악행 때문에
  alternatives_korean:
  - 자기의 죄악 가운데
  - 자기의 죄책 가운데
  lexicon: HALOT
  rationale: עָוֹן은 단순한 행위보다 그 행위의 죄책·악행을 함께 담으므로, 현대 한국어에서는 원인과 책임을 함께 드러내는 표현으로 옮겼습니다.
- source_word: וְדָמוֹ מִיָּדְךָ אֲבַקֵּשׁ / I will require his blood from your hand
  english_pob_choice: I will require his blood from your hand
  chosen_korean: 나는 그의 피를 네 손에서 찾을 것이다
  alternatives_korean:
  - 나는 그의 피값을 네 손에서 요구할 것이다
  - 나는 그의 피에 대한 책임을 네게서 물을 것이다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘피를 찾다’는 책임 추궁을 뜻하므로, 원문 이미지를 살리면서도 한국어로 자연스럽게 이해되도록 ‘찾을 것이다’로 옮겼습니다.
theological_decisions:
- issue: 악인의 죽음과 파수꾼의 책임을 함께 보존하는가
  chosen_reading: 악인은 자기의 악행 때문에 죽고, 동시에 파수꾼은 경고하지 않은 책임으로 그의 피를 요구받습니다.
  alternative_readings:
  - 파수꾼이 악인의 죄책을 대신 진다
  - 경고의 의무는 단지 수사적 표현일 뿐 실제 책임은 없다
  rationale: 히브리어는 ‘그는 자기의 악행 때문에 죽을 것이다’와 ‘나는 그의 피를 네 손에서 찾을 것이다’를 함께 말해 두 진술의 긴장을 유지합니다.
  doctrine_reference: '번역 원칙: 본문이 함께 붙드는 긴장을 해소하지 말고 그대로 보존한다.'
