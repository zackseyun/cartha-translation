id: EZK.33.20
reference: Ezekiel 33:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֕ם לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י אִ֧ישׁ כִּ/דְרָכָ֛י/ו אֶשְׁפּ֥וֹט אֶתְ/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽלפ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/020.yaml
  text: Yet you say[a], ‘The way of the Lord is not just.’ I will judge each of you according to his ways[b], O house of Israel.
  footnotes:
  - marker: a
    text: Or 'The way of the Lord is not fair' or 'is not right.' The Hebrew expression concerns whether God's manner of judgment is considered equitable.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each man according to his ways.' The verse addresses the house of Israel as a whole while stressing individual accountability.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희는 말합니다. “주님의 길은 옳지 않다[a].” 이스라엘 집이여, 나는 너희 각 사람을 저마다의 행실에 따라[b] 심판하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “공정하지 않다” 또는 “바르지 않다.” 히브리어 표현은 하나님의 심판 방식이 공평한가에 관한 문제를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “각 사람을 그의 길들에 따라”라고 합니다. 이 구절은 이스라엘 집 전체에게 말하면서도 각 개인의 책임을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  english_pob_choice: Yet you say
  chosen_korean: 그러나 너희는 말합니다
  alternatives_korean:
  - 그런데 너희는 말합니다
  - 그렇지만 너희는 말합니다
  lexicon: WLC context; POB audit trail
  rationale: 예언적 반응문으로서 앞선 하나님의 변론에 대한 대조를 나타내므로, 한국어에서는 역접 접속사 ‘그러나’로 자연스럽게 살렸습니다.
- source_word: לֹא יִתָּכֵן
  english_pob_choice: is not just
  chosen_korean: 옳지 않다
  alternatives_korean:
  - 공정하지 않다
  - 옳지 못하다
  - 바르지 않다
  lexicon: HALOT
  rationale: 이 표현은 하나님의 판단이 공정한지에 대한 법정적 불평이므로, 현대 한국어에서 의미가 또렷한 ‘옳지 않다’를 택했습니다.
- source_word: דֶּרֶךְ אֲדֹנָי
  english_pob_choice: the way of the Lord
  chosen_korean: 주님의 길
  alternatives_korean:
  - 주의 길
  - 주님의 방식
  lexicon: HALOT
  rationale: דֶּרֶךְ의 관용적 의미인 ‘행위 방식, 행로’를 살리되, 한국어에서는 자연스러운 ‘주님의 길’로 옮겼습니다. 아도나이는 본문 관례에 따라 ‘주님’으로 번역했습니다.
- source_word: אִישׁ כִּדְרָכָיו
  english_pob_choice: each of you according to his ways
  chosen_korean: 너희 각 사람을 그의 길에 따라
  alternatives_korean:
  - 너희 각 사람을 그의 행실에 따라
  - 각 사람을 그 길들에 따라
  lexicon: HALOT
  rationale: אִישׁ의 분배적 단수와 כִּדְרָכָיו의 단수 소유격을 함께 살리기 위해 ‘너희 각 사람’과 ‘그의 길’을 유지했습니다. 복수 ‘길들’보다 원문의 형식을 더 잘 반영합니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: O house of Israel
  chosen_korean: 이스라엘 집아
  alternatives_korean:
  - 이스라엘 집이여
  - 이스라엘 집
  lexicon: HALOT
  rationale: 예언자적 호격을 드러내기 위해 ‘-아’ 호격을 사용했습니다. ‘이스라엘 집’은 공동체 전체를 가리키는 표준적 표현입니다.
theological_decisions:
- issue: 하나님의 길에 대한 불평을 법정적 언어로 보존할지 여부
  chosen_reading: ‘옳지 않다’
  alternative_readings:
  - ‘공정하지 않다’
  - ‘바르지 않다’
  rationale: 문맥은 단순한 감정표현이 아니라 심판의 공정성을 둘러싼 고발이므로, 도덕적·법정적 뉘앙스를 갖는 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §§3, 6
- issue: 공동체 호칭과 개인 책임의 긴장
  chosen_reading: ‘이스라엘 집아, 너희 각 사람을 그의 길에 따라’
  alternative_readings:
  - ‘이스라엘 집 전체를’
  - ‘너희를’
  rationale: 원문은 집합적 호칭을 유지하면서도 개인 단위의 책임을 강조하므로, 공동체와 개인 책임의 긴장을 평탄화하지 않았습니다.
  doctrine_reference: Translation philosophy §§4, 5
