  to: 사람아[a], 내가 너를 이스라엘 집을 위한 파수꾼으로 세웠습니다. 네가 내 입에서 나오는 말씀을 들을 때, 너는 그들에게 나의 경고를 전해야 합니다.
  rationale: 원문의 호칭, 파수꾼 위임, ‘내 입에서’라는 직접 계시의 이미지, 그리고 하나님에게서 비롯되는 경고의 의미를 보존했습니다. ‘나의 경고를 전해야 합니다’는 מִמֶּנִּי의 출처 의미를 자연스러운 현대 한국어로 명확히 표현합니다. 시간 조건은 히브리어의 위임-의무 연결을 따라 ‘들을 때’로 유지했습니다. 불필요하고 잘못 배치된 각주를 삭제하고, בֶן־אָדָם에만 관련 각주를 올바르게 연결했습니다.
