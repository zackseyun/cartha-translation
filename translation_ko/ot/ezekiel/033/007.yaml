  source_fidelity: 초안은 전반적 위임 구조를 반영하지만, מִמֶּנִּי(‘나에게서/나로부터’)를 ‘내게서 경고하라’로 옮긴 것은 한국어 문법과 의미 전달 모두에서 부정확합니다. 또한 ‘삼았나니’와 ‘경고하라’는 요청된 현대 합쇼체와 맞지 않습니다.
