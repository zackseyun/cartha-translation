  terminology: בֶן־אָדָם은 에스겔에서 반복되는 호칭이므로 ‘사람아’로 유지할 수 있습니다. צֹפֶה는 ‘파수꾼’, לְבֵית יִשְׂרָאֵל은 ‘이스라엘 집을 위한’, דָּבָר는 ‘말씀’으로 옮기는 것이 문맥과 한국어 성경 문체에 적절합니다. 각주 a와 b는 본문 위치 및 설명 대상이 맞지 않고, a는 실질적인 대안을 제공하지 않습니다.
