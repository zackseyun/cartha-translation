id: EZK.33.29
reference: Ezekiel 33:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בְּ/תִתִּ֤/י אֶת הָ/אָ֨רֶץ֙ שְׁמָמָ֣ה וּ/מְשַׁמָּ֔ה עַ֥ל כָּל תּוֹעֲבֹתָ֖/ם אֲשֶׁ֥ר עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/029.yaml
  text: Then they will know that I am Yahweh[b][a], when I make the land a desolation and a waste because of all the abominations that they have committed.
  footnotes:
  - marker: a
    text: Or 'and they will know.' The Hebrew conjunction can be rendered simply 'and,' but here it likely carries the sense of result in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'a desolation and an astonishment/horror.' The second Hebrew noun can emphasize not only ruin but the appalling effect of that ruin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면[a] 그들은 내가 야훼인 줄 알게 될 것입니다. 내가 그들이 저지른 모든 가증한 일들 때문에 그 땅을 황폐하게 하고 폐허가 되게 할 때입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 그들은 알게 될 것입니다.’ 히브리어 접속사는 단순한 ‘그리고’로도 옮길 수 있지만, 여기서는 문맥상 결과의 의미가 더 강합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘황폐와 경악의 대상이 되게 할 때입니다.’ 두 번째 히브리어 명사는 폐허뿐 아니라 그 폐허가 불러일으키는 경악 또는 공포의 뉘앙스를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  english_pob_choice: Then they will know
  chosen_korean: 그러면 그들은 … 알게 될 것입니다
  alternatives_korean:
  - 그리고 그들은 … 알게 될 것입니다
  lexicon: HALOT
  rationale: 연결 접속사 וְ는 문맥상 결과를 나타내므로 한국어에서는 ‘그러면’으로 처리해 결과성을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: יהוה의 고유명은 본 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 신적 호칭으로 대체하지 않았습니다.
- source_word: שְׁמָמָה וּמְשַׁמָּה
  english_pob_choice: a desolation and a waste
  chosen_korean: 황폐함과 폐허
  alternatives_korean:
  - 황폐함과 황폐함
  - 황무지와 폐허
  lexicon: HALOT
  rationale: 두 명사는 모두 파괴된 상태를 가리키지만 동일어 반복을 피하기 위해 ‘황폐함과 폐허’로 옮겨 원문의 중첩된 황폐성을 자연스럽게 드러냈습니다.
- source_word: עַל כָּל תּוֹעֲבֹתָם אֲשֶׁר עָשׂוּ
  english_pob_choice: because of all the abominations that they have committed
  chosen_korean: 그들이 저지른 모든 가증한 일들 때문입니다
  alternatives_korean:
  - 그들이 행한 모든 가증한 일들 때문입니다
  - 그들의 모든 가증한 일들 때문에
  lexicon: HALOT
  rationale: עַל은 여기서 원인/근거를 나타내므로 ‘때문입니다’로 풀었고, תּוֹעֵבָה는 예언서의 통상적 무게를 살려 ‘가증한 일들’로 옮겼습니다.
theological_decisions:
- issue: 하나님이 ‘알게 하신다’는 심판 인식 구조
  chosen_reading: 심판을 통해 그들이 야훼의 정체와 주권을 깨닫게 되는 결과를 강조했습니다.
  alternative_readings:
  - 단순한 사실 인지
  - 계시적 인식
  rationale: יַדַע 계열은 단순 지식보다 심판 사건을 통한 인식의 획득을 가리키므로, 결과를 나타내는 ‘그러면’과 ‘알게 될 것입니다’로 그 신학적 구조를 드러냈습니다.
  doctrine_reference: 'Ezekiel의 인식 공식: 심판을 통한 야훼 인식'
- issue: 문장 순서와 ‘때문에’의 인과 강조
  chosen_reading: ‘그 땅을 황폐함과 폐허로 만들 때’ 뒤에 원인을 분명히 붙여 심판과 죄의 인과를 보존했습니다.
  alternative_readings:
  - 원인절을 앞에 두는 번역
  - 보다 완곡한 인과 표현
  rationale: 원문은 심판 행위와 그 근거를 함께 제시하므로, 한국어에서도 결과와 원인을 분리하되 연결해 읽히도록 구성했습니다.
  doctrine_reference: 예언서의 심판-죄 대응 구조
