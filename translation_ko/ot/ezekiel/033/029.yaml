revisions:
- from: 그러면 그들은 내가 야훼인 줄 알게 될 것입니다. 내가 그 땅을 황폐함과 폐허로 만들 때, 곧 그들이 저지른 모든 가증한 일들 때문입니다.[a]
  to: 그러면[a] 그들은 내가 야훼인 줄 알게 될 것입니다. 내가 그들이 저지른 모든 가증한 일들 때문에 그 땅을 황폐하게 하고 폐허가 되게 할 때입니다.[b]
  rationale: 원인구를 ‘내가 … 할 때’ 절 안에 직접 배치하여 히브리어의 심판-원인 관계를 정확히 보존했습니다. 결과를 나타내는 ‘그러면’과 야훼의 이름 표기는 유지했습니다. 두 황폐 명사의 병렬은 본문에서 자연스럽게 옮기고, 두 번째 명사의 가능한 경악/공포 뉘앙스는 각주로 보존했습니다.
