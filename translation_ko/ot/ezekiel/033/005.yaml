base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/005.yaml
  text: He heard the sound of the trumpet and did not take warning[a]; his blood will be upon himself. But if he takes warning[b], he will save his life.
  footnotes:
  - marker: a
    text: Or, 'his blood will be upon him'—a Hebrew idiom meaning he bears responsibility for his own death.
    reason: lexical_alternative
  - marker: b
    text: Or, 'he will deliver his soul/self.' Here 'life' fits the context of escaping death.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 나팔 소리를 듣고도 경고를 받아들이지 않았습니다. 그의 피는 그 자신에게 돌아갈 것입니다[a]. 그러나 경고를 받아들이는 사람은 자기 목숨을 구할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘그의 피는 그에게 있을 것입니다.’ 이는 그가 자기 죽음에 대한 책임을 진다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘그는 자기 생명을 건질 것입니다.’ 여기서 ‘목숨’은 문맥상 죽음에서 보존되는 생명을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֨וֹל הַ/שּׁוֹפָ֤ר
  english_pob_choice: the sound of the trumpet
  chosen_korean: 나팔 소리
  alternatives_korean:
  - 나팔의 소리
  - 뿔나팔 소리
  - 경고 나팔 소리
  lexicon: HALOT
  rationale: שׁוֹפָר는 경고용 악기인 뿔나팔을 가리키지만, 한국어에서는 “나팔 소리”가 가장 자연스럽고 경고 신호라는 기능도 충분히 전달합니다.
- source_word: נִזְהָר
  english_pob_choice: take warning
  chosen_korean: 경고를 받다
  alternatives_korean:
  - 경고를 듣다
  - 경고를 받아들이다
  - 주의를 받다
  lexicon: HALOT
  rationale: 이 동사는 단순 청취가 아니라 경고를 받아들여 조치를 취하는 뜻이므로, 수동적 의미를 살린 “경고를 받다”가 적절합니다.
- source_word: דָּמוֹ בּוֹ יִהְיֶה
  english_pob_choice: his blood will be on himself
  chosen_korean: 그의 피는 자기 자신에게 있게 될 것입니다
  alternatives_korean:
  - 그의 피는 그에게 있을 것입니다
  - 그는 자기 피의 책임을 져야 할 것입니다
  - 그의 피는 자기에게 돌아갈 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 죽음의 책임이 본인에게 있음을 뜻하므로, ‘피가 자기 자신에게 있다’는 이미지를 유지해 책임 귀속을 드러냈습니다.
- source_word: נַפְשׁוֹ מִלֵּט
  english_pob_choice: he will save his life
  chosen_korean: 그는 자기 생명을 건질 것입니다
  alternatives_korean:
  - 그는 자기 목숨을 구할 것입니다
  - 그는 자기 영혼을 건질 것입니다
  - 그는 자기 생명을 구원할 것입니다
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 죽음에서 보존되는 ‘생명/목숨’을 가리키므로, 문맥상 자연스러운 ‘자기 생명’을 택했습니다.
theological_decisions:
- issue: 책임 귀속을 나타내는 피의 관용구
  chosen_reading: 그의 피는 자기 자신에게 있게 될 것입니다
  alternative_readings:
  - 그의 피는 그에게 있을 것입니다
  - 그는 자기 죽음의 책임을 져야 합니다
  rationale: 히브리어 관용구를 설명으로 풀어버리기보다 그대로 살려, 경고를 거부한 자에게 책임이 돌아간다는 משפט적·윤리적 무게를 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 책임과 심판의 긴장을 보존
