    reason: lexical_alternative
  revision_rationale: The revision makes the response required by נִזְהָר explicit and active, replaces an awkward literal Korean calque of the blood idiom with a natural responsibility-attribution expression, selects the idiomatic Korean term ‘목숨’ for life in a death-threat context, and moves each explanatory note to its proper textual anchor. It retains the source’s personal-responsibility imagery without reducing it to a doctrinal paraphrase.
