source:
  edition: WLC
  text: אֱמֹ֨ר אֲלֵי/הֶ֜ם חַי אָ֣נִי נְאֻ֣ם אֲדֹנָ֣/י יְהוִ֗ה אִם אֶחְפֹּץ֙ בְּ/מ֣וֹת הָ/רָשָׁ֔ע כִּ֣י אִם בְּ/שׁ֥וּב רָשָׁ֛ע מִ/דַּרְכּ֖/וֹ וְ/חָיָ֑ה שׁ֣וּבוּ שׁ֜וּבוּ מִ/דַּרְכֵי/כֶ֧ם הָ/רָעִ֛ים וְ/לָ֥/מָּה תָמ֖וּתוּ בֵּ֥ית יִשְׂרָאֵֽל־׀׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/011.yaml
  text: Say to them[a], ‘As I live,’ declares the Lord GOD, ‘I take no pleasure in the death of the wicked, but rather that the wicked turn from his way and live. Turn back, turn back from your evil ways! Why will you die[b], O house of Israel?’
  footnotes:
  - marker: a
    text: Or 'I do not delight in the death of the wicked.' The Hebrew verb can denote pleasure, delight, or desire.
    reason: lexical_alternative
  - marker: b
    text: The repeated command 'Turn back, turn back' is emphatic; the Hebrew verb is the same one used earlier for the wicked person 'turning' from his way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 말하십시오. ‘내가 살아 있음을 두고 맹세합니다. 주 하나님이 말씀하십니다. 나는 악인이 죽는 것을 기뻐하지 않습니다[a]. 오히려 악인이 자기 길에서 돌이켜 살기를 기뻐합니다. 여러분의 악한 길에서 돌이키십시오, 돌이키십시오![b] 이스라엘 집아, 어찌하여 죽으려 합니까?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기뻐하지 않습니다’는 히브리어 חפץ의 뜻을 반영한 것으로, 문맥에 따라 ‘원하지 않습니다’ 또는 ‘즐거워하지 않습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘돌이키십시오, 돌이키십시오’의 반복은 강한 강조입니다. 같은 히브리어 동사가 앞부분에서 악인이 자기 길에서 ‘돌이켜’ 사는 것을 말할 때에도 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָ֣נִי
  english_pob_choice: As I live
  chosen_korean: 내가 살아 있음을 두고 맹세하니
  alternatives_korean:
  - 내가 살아 있노라
  - 내 생명을 두고
  lexicon: HALOT
  rationale: 히브리어의 서약 공식으로, 한국어에서는 맹세의 뉘앙스를 살리면서도 자연스럽게 들리도록 옮겼습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님이 말씀하십니다
  alternatives_korean:
  - 주 여호와께서 말씀하십니다
  - 주 하나님께서 선언하십니다
  lexicon: HALOT
  rationale: ‘declares’의 예언자적 선언 형식을 ‘말씀하십니다’로 옮기고, 아도나이+야훼의 이중 호칭은 한국어에서 가장 자연스러운 ‘주 하나님’으로 처리했습니다.
- source_word: אֶחְפֹּץ ... כִּי אִם
  english_pob_choice: I take no pleasure ... but rather that
  chosen_korean: 나는 ... 기뻐하지 않고, 오히려 ... 기뻐합니다
  alternatives_korean:
  - 나는 ... 원하지 않고, 도리어 ... 원합니다
  - 나는 ... 즐거워하지 않고, 오히려 ... 바라십니다
  lexicon: HALOT
  rationale: חפץ의 핵심을 ‘기뻐하다/기뻐하지 않다’로 살려, 하나님의 정서적 태도와 대비 구조를 분명하게 드러냈습니다.
- source_word: שׁוּבוּ שׁוּבוּ מִדַּרְכֵיכֶם הָרָעִים
  english_pob_choice: Turn back, turn back from your evil ways
  chosen_korean: 돌이키십시오, 돌이키십시오! 여러분의 악한 길에서 돌이키십시오!
  alternatives_korean:
  - 회개하십시오, 회개하십시오! 여러분의 악한 길에서 돌아서십시오!
  - 돌아오십시오, 돌아오십시오!
  lexicon: HALOT
  rationale: שׁוּב의 반복을 강조된 명령으로 살리되, ‘회개하다’보다 원래의 이동/전환 이미지를 보존하는 ‘돌이키다’를 택했습니다.
theological_decisions:
- issue: 악인의 죽음에 대한 하나님의 태도
  chosen_reading: 하나님이 악인의 죽음을 기뻐하지 않으시고, 돌이켜 살기를 기뻐하신다는 대조를 그대로 유지했습니다.
  alternative_readings:
  - 하나님이 악인의 죽음을 원하지 않으신다고 더 강하게 옮기기
  - 하나님의 뜻을 예정론적으로 해설하기
  rationale: 본문은 예언적 호소로서 하나님의 성품을 직접 진술하므로, 신학 체계를 덧씌우지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: 본문의 직접 진술을 우선하고 체계신학적 조정은 하지 않음
