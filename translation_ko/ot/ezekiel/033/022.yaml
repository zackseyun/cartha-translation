  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יַד יְהוָה֩ הָיְתָ֨ה אֵלַ֜/י בָּ/עֶ֗רֶב לִ/פְנֵי֙ בּ֣וֹא הַ/פָּלִ֔יט וַ/יִּפְתַּ֣ח אֶת פִּ֔/י עַד בּ֥וֹא אֵלַ֖/י בַּ/בֹּ֑קֶר וַ/יִּפָּ֣תַח פִּ֔/י וְ/לֹ֥א נֶאֱלַ֖מְתִּי עֽוֹד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/022.yaml
  text: Now the hand of Yahweh had been upon me in the evening[a], before the fugitive came, and he opened my mouth until he came to me in the morning. So my mouth was opened, and I was no longer mute.
  footnotes:
  - marker: a
    text: Or 'before the survivor came.' The Hebrew term refers to one who has escaped and survived.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 야훼의 손이 저에게 저녁에 임하셨는데, 도망자가 오기 전이었습니다. 그분이 제 입을 열어 주셔서 그가 아침에 저에게 올 때까지 그러하셨습니다. 그러자 제 입이 열렸고, 나는 더 이상 말 못 하는 상태가 아니었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַד יְהוָה
  english_pob_choice: the hand of Yahweh / the LORD
  chosen_korean: 야훼의 손
  alternatives_korean:
  - 주님의 손
  - 여호와의 손
  lexicon: HALOT
  rationale: 예언자에게 임하는 하나님의 능동적 역사라는 관용구를 살리면서, 본문에 직접 있는 신명 표기를 한국어에서도 보존했습니다.
- source_word: בָּעֶרֶב
  english_pob_choice: in the evening
  chosen_korean: 저녁에
  alternatives_korean:
  - 저녁 무렵에
  - 그 저녁에
  lexicon: HALOT
  rationale: 단순한 시간 부사이므로 자연스러운 현대 한국어로 옮겼습니다.
- source_word: וַיִּפְתַּח אֶת פִּי
  english_pob_choice: he opened my mouth
  chosen_korean: 제 입을 열어 주셔서
  alternatives_korean:
  - 제 입을 여셨습니다
  - 제 입을 열게 하셨습니다
  lexicon: HALOT
  rationale: 직역하면 어색할 수 있으나, 본문의 신적 행위와 ‘입이 열림’이라는 반복 구조를 살리기 위해 ‘열어 주시다’로 옮겼습니다.
- source_word: עַד בּוֹא אֵלַי בַּבֹּקֶר
  english_pob_choice: until he came to me in the morning
  chosen_korean: 그가 아침에 저에게 올 때까지
  alternatives_korean:
  - 그가 아침에 저에게 올 때까지
  - 그가 아침에 저에게 도착할 때까지
  lexicon: HALOT
  rationale: עַד의 종결점 의미를 살려 ‘-할 때까지’로 옮겼고, 반복되는 ‘그가’는 문맥상 도망자를 가리킵니다.
- source_word: וְלֹא נֶאֱלַמְתִּי עוֹד
  english_pob_choice: and I was no longer mute
  chosen_korean: 나는 더 이상 말 못 하는 상태가 아니었습니다
  alternatives_korean:
  - 나는 더 이상 벙어리가 아니었습니다
  - 나는 더 이상 침묵하지 않았습니다
  lexicon: HALOT
  rationale: 문맥상 일시적 언어 불능을 가리키므로, 현대 한국어에서 비하 뉘앙스가 강한 표현은 피하고 상태 설명으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 יְהוָה가 직접 나오므로, 본문이 지닌 고유한 언약 নাম을 가리기보다 음역으로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘손’의 관용적 의미
  chosen_reading: 야훼의 실제적 역사와 예언자에 대한 압도적 임재
  alternative_readings:
  - 단순한 신체 비유
  - 신적 영감의 일반적 표현
  rationale: 히브리어 ‘야훼의 손’은 예언자에게 임하는 강력한 하나님의 작용을 뜻하므로, 단순 비유로 약화시키지 않았습니다.
  doctrine_reference: Ezekiel prophetic idiom / source text context
