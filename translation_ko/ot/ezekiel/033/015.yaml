  lexicon: HALOT
  rationale: 단순 반환이 아니라 잘못 보유한 것을 원상대로 돌려놓는 뉘앙스를 살리되, 문맥상 평이하게 표현했습니다.
- source_word: בְּחֻקּוֹת הַחַיִּים
  english_pob_choice: in the statutes of life
  chosen_korean: 생명의 규례들 가운데서
  alternatives_korean:
  - 생명의 규례 안에서
  - 살게 하는 규례들 가운데서
  - 생명 주는 규례들 가운데서
  lexicon: HALOT
  rationale: 문구의 관용성과 병행을 유지하면서도, 규례들이 삶의 영역/질서와 관련됨을 드러내는 표현으로 옮겼습니다.
- source_word: לְבִלְתִּי עֲשׂוֹת עָוֶל
  english_pob_choice: without doing injustice
  chosen_korean: 불의를 행하지 않으면
  alternatives_korean:
  - 그릇됨을 행하지 않으면
  - 부정의를 저지르지 않으면
  - 불의한 일을 하지 않으면
  lexicon: HALOT
  rationale: 부정행위를 금하는 법적·도덕적 뜻을 간결하게 살리기 위해 동사구로 자연스럽게 정리했습니다.
theological_decisions:
- issue: חָיוֹ יִחְיֶה / לֹא יָמוּת의 생명-죽음 약속의 범위
  chosen_reading: ‘반드시 살 것이며, 죽지 않을 것입니다’로 직역성을 유지하되, 그 생명이 물리적·언약적 차원을 모두 포괄할 수 있도록 좁혀 말하지 않았습니다.
  alternative_readings:
  - 살아남을 것입니다
  - 언약적으로 살게 될 것입니다
  - 영원히 살 것입니다
  rationale: 히브리어의 강조형과 예언적 경고/약속 구조를 보존하면서, 본문이 허용하는 의미 범위를 인위적으로 한정하지 않기 위함입니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
