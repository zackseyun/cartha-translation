  text: חֲבֹ֨ל יָשִׁ֤יב רָשָׁע֙ גְּזֵלָ֣ה יְשַׁלֵּ֔ם בְּ/חֻקּ֤וֹת הַֽ/חַיִּים֙ הָלַ֔ךְ לְ/בִלְתִּ֖י עֲשׂ֣וֹת עָ֑וֶל חָי֥וֹ יִֽחְיֶ֖ה לֹ֥א יָמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/015.yaml
  text: if the wicked man restores the pledge[a], repays what he has stolen, walks in the statutes of life without doing injustice, he shall surely live[b]; he shall not die.
  footnotes:
  - marker: a
    text: Or 'returns what was taken in pledge'—the Hebrew refers to restoring an item held as security for a loan.
    reason: lexical_alternative
  - marker: b
    text: Or 'walks in life-giving statutes' or 'walks by the statutes that give life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악인이 전당물을 돌려주고, 훔친 것을 갚으며, 생명의 규례들 가운데서 걸어가 불의를 행하지 않으면, 그는 반드시 살 것이며, 죽지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전당물’은 대출의 담보로 잡힌 물건을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘생명의 규례들’은 문자적으로는 ‘생명을 주는 규례들’ 또는 ‘생명에 속한 규례들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל
  english_pob_choice: the pledge
  chosen_korean: 전당물
  alternatives_korean:
