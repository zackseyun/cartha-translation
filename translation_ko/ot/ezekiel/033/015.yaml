  naturalness: ‘담보로 잡은 물건을 돌려주고’, ‘생명의 규례들을 따라 살며’로 고치면 현대 표준 한국어의 격식 있는 성경 문체로 자연스럽고, 본문의 법적·윤리적 어조도 유지됩니다.
