translation:
  language: ko
  text: 그러나 네 백성의 자손들은 말합니다[a], ‘주님의 길은 옳지 않다.’ 그러나 그들의 길이 옳지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옳지 않다’, ‘정당하지 않다’의 뜻입니다. 두 번 나오는 ‘옳지 않다’에 대한 대안입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי עַמְּךָ
  english_pob_choice: the sons of your people
  chosen_korean: 네 백성의 자손들
  alternatives_korean:
  - 네 백성
  - 네 백성의 아들들
  - 네 백성의 사람들
  lexicon: HALOT
  rationale: 히브리어의 ‘sons of your people’를 성별을 지우지 않으면서도 한국어로 자연스럽게 옮겼습니다. 단순히 ‘네 백성’으로 풀면 원문의 친족적·집단적 표현이 약해집니다.
- source_word: לֹא יִתָּכֵן
  english_pob_choice: is not just
  chosen_korean: 옳지 않다
  alternatives_korean:
  - 정당하지 않다
  - 공정하지 않다
  - 옳은 일이 아니다
  lexicon: HALOT
  rationale: 이 동사는 문맥상 ‘옳다/정당하다’의 판정에 가깝기 때문에, 고발의 뉘앙스를 살리되 한국어에서 자연스러운 ‘옳지 않다’로 옮겼습니다. ‘공정하다’는 다소 현대적 사회윤리 용어로 좁아질 수 있습니다.
- source_word: דֶּרֶךְ אֲדֹנָי
  english_pob_choice: the way of the Lord
  chosen_korean: 주님의 길
  alternatives_korean:
  - 주님의 방식
  - 주님의 길입니다
  - 주님의 도
  lexicon: HALOT
  rationale: 히브리어의 ‘길’은 단순한 행동 방식보다 삶의 행로와 판결 방식까지 포함하는 표현이므로, 한국어에서도 직역에 가까운 ‘길’을 유지했습니다. ‘주님’은 אֲדֹנָי의 통상적 한국어 대응입니다.
- source_word: וְהֵמָּה דַּרְכָּם
  english_pob_choice: though it is their own way
  chosen_korean: 그러나 그들의 길이
  alternatives_korean:
  - 오히려 그들의 길이
  - 그렇지만 그들의 길이
  - 그들 자신의 길이
  lexicon: HALOT
  rationale: 원문의 대조점은 하나님의 길에 대한 평가가 실제로는 그들에게 되돌아간다는 데 있습니다. 한국어에서는 ‘그러나’로 역전 구조를 살리고, ‘그들의 길’에 반복된 판단을 적용해 문장을 자연스럽게 만들었습니다.
theological_decisions:
- issue: 하나님의 길에 대한 인간의 판정과 반전 구조
  chosen_reading: 첫 절의 비난과 끝 절의 반전을 모두 ‘옳지 않다’로 대응시켜, 비난이 사실은 그들의 길에 되돌아간다는 점을 분명히 했습니다.
  alternative_readings:
  - ‘정당하지 않다’로 더 법정적 어감을 살리는 해석
  - ‘공정하지 않다’로 사회윤리적 어감을 살리는 해석
  rationale: 본문은 하나님의 공의에 대한 공격이 곧 사람들의 자기기만임을 드러내므로, 같은 평가어를 반복해 역설을 살리는 것이 본문의 신학적 수사에 가장 충실합니다.
  doctrine_reference: 에스겔 18장, 33장의 하나님의 공의와 인간 책임
- issue: 직접화법의 인용 부호와 담화 이동
  chosen_reading: 직접 인용을 「」로 표시하고, 말하는 주체 전환을 ‘그러나’로 드러냈습니다.
  alternative_readings:
  - 인용문 없이 서술형으로 풀기
  - 쉼표만으로 대조를 표시하기
  rationale: 예언서의 논쟁적 문맥에서는 누가 무엇을 말하는지와 그 말이 어떻게 반박되는지가 중요하므로, 한국어에서도 담화 전환을 선명하게 보여 주는 것이 좋습니다.
  doctrine_reference: 본문 담화 구조 보존 원칙
