    rationale: ‘이르셨습니다’는 자연스럽게 야훼를 주체로 요구하지만, 바로 앞 문법상 주어는 ‘말씀’입니다. 전통적인 ‘이르시되’ 공식과 달리 현대 합쇼체에서는 문법적 관계를 명시하는 편이 자연스럽습니다.
