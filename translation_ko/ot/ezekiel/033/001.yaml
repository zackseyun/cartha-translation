lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 임하여
  alternatives_korean:
  - 오셨습니다
  - 이르렀습니다
  - 다가왔습니다
  lexicon: HALOT
  rationale: 예언 공식의 서두로서 ‘말씀이 ... 임하다’는 한국어에서 자연스럽고, 히브리어의 사건 개시와 말씀의 도래를 함께 살립니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: ‘여호와의 말씀’이라는 예언서의 정형 표현을 한국어에서도 그대로 살려, 단순한 정보 전달보다 계시로서의 말씀성을 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유명사 יְהוָה를 신학적 관례에 따라 ‘야훼’로 옮겨, 호칭이 아닌 언약 이름이라는 점을 보존합니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 저에게
  - 나에게
  lexicon: HALOT
  rationale: 1인칭 목적어는 예언자에게 직접 임한 계시라는 점을 자연스럽게 드러내는 ‘내게’가 가장 간결합니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말씀하시기를
  - 이르시며
  lexicon: HALOT
  rationale: 히브리어 공식을 한국어에서 매끄럽게 풀어, 뒤따를 직접 화법을 예고하는 기능을 살리면서도 문장 흐름을 자연스럽게 했습니다.
theological_decisions:
- issue: 예언 공식에서 하나님의 직접적 발화 전달 방식
  chosen_reading: ‘야훼의 말씀이 내게 임하여 이르셨습니다’로, 말씀의 도래와 발화를 함께 표현했습니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 와서 말하였다’
  - ‘야훼께서 내게 말씀하셨습니다’
  rationale: 원문은 단순한 정보 전달이 아니라 예언자의 소명 장면을 여는 공식입니다. ‘말씀이 임하다’와 종결부의 발화를 함께 살려 계시의 권위와 서술 형식을 보존합니다.
  doctrine_reference: 예언서 서론의 계시 공식; divine speech formula
