  source_fidelity: 히브리어의 호칭, ‘이스라엘 집’, 죄의 병렬, ‘우리 위에’, 그리고 죄들 ‘가운데서’ 쇠잔해 가는 절망의 질문을 대체로 충실히 보존합니다. 다만 각주 표지가 해당 어휘에 직접 붙지 않아 그 적용 범위가 불명확합니다.
  naturalness: ‘말하여라’는 현대 공식 존대체(합쇼체)와 맞지 않습니다. 하나님의 명령은 ‘말하십시오’로 옮기는 것이 요구된 문체에 맞습니다. ‘그것들 가운데서’는 선행하는 ‘범죄와 죄’를 분명히 가리킵니다.
  terminology: ‘인자’, ‘이스라엘 집’, ‘범죄와 죄’, ‘쇠잔해 가다’는 예언서의 격식과 의미를 무난히 살립니다. 각주의 대안은 활용형보다 기본형으로 제시하는 편이 자연스럽습니다.
