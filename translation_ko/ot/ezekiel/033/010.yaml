  to: 「인자야, 이스라엘 집에 말하십시오. ‘너희가 이렇게 말하였다. “참으로 우리의 범죄와 우리의 죄가 우리 위에 있고, 그것들 가운데서 우리가 쇠잔해 가니[a], 어떻게 우리가 살 수 있겠느냐?”’」
  rationale: 본문의 의미는 유지하면서, 명령형을 합쇼체로 바로잡고 각주 표지를 해당 히브리어 동사의 번역어에 직접 연결했습니다. ‘그것들 가운데서’는 בָּם의 직역적 모호성을 유지하되 한국어에서 그 지시 대상을 명확히 합니다.
