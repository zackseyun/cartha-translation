  - severity: low
    issue: 각주 표지의 범위가 불명확함
    rationale: 각주가 נְמַקִּים(‘쇠잔해 가다’)의 어휘 대안을 설명하지만 표지가 문장 끝에 있어 어느 낱말을 설명하는지 즉시 알기 어렵습니다. 해당 표현 뒤에 표지를 두는 것이 적절합니다.
  - severity: low
    issue: 각주 대안의 제시 형식
    rationale: ‘썩어 가는’/‘시들어 가는’보다 기본형인 ‘썩어 가다’ 또는 ‘시들어 가다’가 어휘 대안 각주로 더 자연스럽습니다.
