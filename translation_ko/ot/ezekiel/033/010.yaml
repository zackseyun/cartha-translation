source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם אֱמֹר֙ אֶל בֵּ֣ית יִשְׂרָאֵ֔ל כֵּ֤ן אֲמַרְתֶּם֙ לֵ/אמֹ֔ר כִּֽי פְשָׁעֵ֥י/נוּ וְ/חַטֹּאתֵ֖י/נוּ עָלֵ֑י/נוּ וּ/בָ֛/ם אֲנַ֥חְנוּ נְמַקִּ֖ים וְ/אֵ֥יךְ נִֽחְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/010.yaml
  text: 'And you[a], son of man, say to the house of Israel, ‘Thus you have said: “Surely our transgressions and our sins are upon us, and in them we are wasting away; so how can we live?”’'
  footnotes:
  - marker: a
    text: Or 'rotting away' / 'pining away' for 'we are wasting away.' The Hebrew verb suggests wasting, decay, or languishing under the weight of guilt and judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 「인자야, 이스라엘 집에 말하십시오. ‘너희가 이렇게 말하였다. “참으로 우리의 범죄와 우리의 죄가 우리 위에 있고, 그것들 가운데서 우리가 쇠잔해 가니[a], 어떻게 우리가 살 수 있겠느냐?”’」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘썩어 가다’ 또는 ‘시들어 가다’로 옮길 수 있습니다. 히브리어 동사는 죄책과 심판 아래에서 쇠잔해 가는 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔의 고정된 예언자 호칭이므로 직역형인 ‘인자’를 유지해 prophetic register를 살렸습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘의 집
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 공동체 표상을 살리기 위해 ‘집’을 유지했습니다.
- source_word: פְשָׁעֵינוּ / חַטֹּאתֵינוּ
  english_pob_choice: our transgressions / our sins
  chosen_korean: 우리의 범죄와 우리의 죄
  alternatives_korean:
  - 우리의 반역과 우리의 죄
  - 우리의 허물과 우리의 죄
  lexicon: HALOT
  rationale: 두 항목의 병렬을 그대로 살리되, פשע의 반역성은 한국어의 ‘범죄’로, חטאת의 일반적 죄성은 ‘죄’로 옮겼습니다.
- source_word: נְמַקִּים
  english_pob_choice: we are wasting away
  chosen_korean: 우리가 쇠잔해 가니
  alternatives_korean:
  - 우리가 썩어 가니
  - 우리가 소모되어 가니
  - 우리가 메말라 가니
  lexicon: HALOT
  rationale: POB가 지적한 지속적 쇠퇴·소진의 의미를 살리면서도 현대 한국어에서 자연스럽고 과도하게 생물학적이지 않은 표현을 택했습니다.
theological_decisions:
- issue: 이스라엘의 말이 단순한 고백인지, 심판 아래의 절망인지
  chosen_reading: '절망적 자각을 드러내는 말로 옮겼습니다: ‘... 어떻게 우리가 살 수 있겠느냐?’'
  alternative_readings:
  - 단순한 회개 고백처럼 부드럽게 읽는 번역
  rationale: 마지막 질문과 ‘쇠잔해 가다’는 표현이 죄책의 인식과 그 결과에 대한 절망을 함께 보여 주므로, 그 긴장을 그대로 보존했습니다.
  doctrine_reference: 본문의 정서와 수사 유지
