lexical_decisions:
- source_word: וְרָאָה
  english_pob_choice: and he sees
  chosen_korean: 보고
  alternatives_korean:
  - 보며
  - 보게 되고
  - 본다면
  lexicon: HALOT
  rationale: 문맥상 경계자의 행동을 현재적 서술로 풀어 ‘보고’라고 하면 경고 동작의 연속성이 자연스럽게 살아납니다.
- source_word: הַחֶרֶב בָּאָה עַל הָאָרֶץ
  english_pob_choice: the sword coming against the land
  chosen_korean: 칼이 땅으로 다가오는 것
  alternatives_korean:
  - 칼이 땅에 임하는 것
  - 칼이 그 땅을 치러 오는 것
  - 전쟁이 닥치는 것
  lexicon: HALOT
  rationale: 히브리어의 구체적 이미지인 ‘칼’을 유지하되, 한국어에서는 ‘다가오는 것’으로 위협적 접근을 살려 ‘against’의 압박감을 반영했습니다.
- source_word: וְתָקַע בַּשּׁוֹפָר
  english_pob_choice: and he blows the trumpet
  chosen_korean: 나팔을 불어
  alternatives_korean:
  - 나팔을 불고
  - 뿔나팔을 불어
  - 경보를 울려
  lexicon: HALOT
  rationale: שׁוֹפָר의 기능은 경보 신호이므로 한국어의 관용 표현인 ‘나팔을 불어’로 옮기되, 원문의 신호 행위를 보존했습니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성에게
  alternatives_korean:
  - 사람들에게
  - 백성들에게
  - 그 사람들에게
  lexicon: HALOT
  rationale: 예언적 경고 대상인 공동체를 한국어 성서 문맥에 맞게 ‘백성’으로 옮겨, 단순한 군중이 아니라 책임을 지닌 집단임을 드러냈습니다.
theological_decisions:
