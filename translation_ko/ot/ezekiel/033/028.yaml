source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אֶת הָ/אָ֨רֶץ֙ שְׁמָמָ֣ה וּ/מְשַׁמָּ֔ה וְ/נִשְׁבַּ֖ת גְּא֣וֹן עֻזָּ֑/הּ וְ/שָֽׁמְמ֛וּ הָרֵ֥י יִשְׂרָאֵ֖ל מֵ/אֵ֥ין עוֹבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/028.yaml
  text: And I will make the land a desolation and a waste[a], and the pride of its strength will cease, and the mountains of Israel will be desolate[b], with no one passing through.
  footnotes:
  - marker: a
    text: Or 'an astonishment' for 'a waste'; the Hebrew term can carry the sense of something so ruined that it causes horror or astonishment.
    reason: lexical_alternative
  - marker: b
    text: Or 'the majesty of its strength.' The Hebrew phrase can be read more neutrally, but in this judgment context 'the pride of its strength' best fits.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 그 땅을 황폐와 폐허가 되게 할 것이며[a], 그 힘의 자랑은 그칠 것이며[b], 이스라엘의 산들은 아무도 지나가지 않아 황폐해질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘놀라움’으로도 옮길 수 있습니다. 히브리어는 너무 황폐하여 사람에게 경악이나 놀라움을 일으키는 상태를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 힘의 위엄’으로도 옮길 수 있습니다. 이 히브리어 표현은 더 중립적으로 읽힐 수도 있으나, 심판의 맥락에서는 ‘그 힘의 자랑’이 더 적절합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: I will make
  chosen_korean: 내가 … 되게 하며
  alternatives_korean:
  - 내가 … 하며
  - 내가 …으로 둘 것이며
  - 내가 …으로 만들고
  lexicon: HALOT
  rationale: 직역상 '주다/두다'이지만, 이어지는 황폐 선고 구조에서는 원인적 의미의 '되게 하다'가 자연스럽고 본문의 효과를 잘 드러냅니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 그 나라
  - 땅
  lexicon: HALOT
  rationale: 에스겔의 심판 맥락에서 특정 지역, 곧 이스라엘 땅을 가리키므로 '그 땅'이 가장 정확합니다.
- source_word: שְׁמָמָה וּמְשַׁמָּה
  english_pob_choice: a desolation and a waste
  chosen_korean: 황폐와 황무지
  alternatives_korean:
  - 황폐와 폐허
  - 황폐와 황량함
  - 놀람과 황폐
  lexicon: HALOT
  rationale: 두 명사의 병렬을 살리면서도 한국어에서 중복이 과하지 않게 옮겼습니다. 첫 항목의 강한 붕괴 상태와 둘째 항목의 황무한 상태를 함께 드러냅니다.
- source_word: גְּאוֹן עֻזָּהּ
  english_pob_choice: the pride of its strength
  chosen_korean: 그 능력의 자랑
  alternatives_korean:
  - 그 힘의 위엄
  - 그 힘의 자랑
  - 그 능력의 위세
  lexicon: HALOT
  rationale: 이 구절은 심판 맥락에서 긍정적 '위엄'보다 부정적 '자랑'이 더 잘 맞습니다. '능력'은 עֹז의 기본 의미를 반영하고, 소유격 '-의'로 전체 표현을 압축했습니다.
- source_word: מֵאֵין עוֹבֵר
  english_pob_choice: with no one passing through
  chosen_korean: 아무도 지나가지 않는 가운데
  alternatives_korean:
  - 지나가는 사람이 없이
  - 지나가는 자가 없게
  - 아무도 통과하지 않으며
  lexicon: HALOT
  rationale: 단순한 부재를 넘어 황폐로 인한 무인지대를 나타내므로, 한국어의 자연스러운 상태 표현으로 옮겼습니다.
theological_decisions:
- issue: גְּאוֹן의 뉘앙스
  chosen_reading: '''위엄''보다 ''자랑''을 택해 심판 속 자만의 의미를 드러냈습니다.'
  alternative_readings:
  - 그 능력의 위엄
  - 그 힘의 위세
  rationale: 본문은 땅의 영광을 선고받는 장면이므로, 중립적 장엄함보다 스스로 내세우는 자랑의 뉘앙스가 원문의 경고성을 더 정확히 전달합니다.
  doctrine_reference: 원문이 허용하는 긴장을 보존하고, judgment oracle의 수사적 힘을 약화시키지 않도록 합니다.
