  yaml_path: translation/ot/ezekiel/033/014.yaml
  text: And when I say to the wicked man[a], ‘You shall surely die,’ and he turns from his sin and does justice and righteousness,
  footnotes:
  - marker: a
    text: Or, 'and he returns from his sin and does what is just and right.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 악인에게 말할 때, ‘너는 반드시 죽을 것이다’라고 하는데, 그가 자기의 죄에서 돌이켜 정의와 의를 행하면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그가 자기의 죄에서 돌아서서 옳고 바른 일을 행하면.’
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְאָמְרִי
  english_pob_choice: And when I say
  chosen_korean: 내가 … 말할 때
  alternatives_korean:
  - 내가 … 말하며
  - 내가 … 이르렀을 때
  lexicon: HALOT
  rationale: יִאמר의 시간적 용법을 자연스러운 한국어 조건·시점 표현으로 옮겼습니다. ‘말할 때’가 원문의 시점을 가장 간결하게 드러냅니다.
- source_word: לָרָשָׁע
  english_pob_choice: to the wicked man
  chosen_korean: 악인에게
  alternatives_korean:
  - 악한 사람에게
  - 악한 자에게
  lexicon: HALOT
  rationale: רָשָׁע는 단순한 ‘나쁜 사람’보다 도덕적·언약적 의미의 ‘악인’이 더 정확합니다. 남성 단수의 대표적 표현은 한국어에서 자연스럽게 일반화할 수 있습니다.
- source_word: מוֹת תָּמוּת
  english_pob_choice: You shall surely die
  chosen_korean: 너는 반드시 죽을 것이다
  alternatives_korean:
  - 너는 반드시 죽게 될 것이다
  - 죽고 또 죽을 것이다
  lexicon: HALOT
  rationale: 부정사 절대형의 강조를 ‘반드시’로 옮겨 확실성을 살렸습니다. 직역적 반복은 한국어에서 어색하므로 표준적인 강조 표현을 택했습니다.
- source_word: וְשָׁב מֵחַטָּאתוֹ
  english_pob_choice: and he turns from his sin
  chosen_korean: 그가 자기의 죄에서 돌이켜
  alternatives_korean:
  - 그가 죄에서 돌아서
  - 그가 자기 죄에서 돌아오며
  lexicon: HALOT
  rationale: שׁוּב는 여기서 단순 이동이 아니라 죄에서의 회심/전환을 뜻하므로 ‘돌이켜’가 적절합니다. ‘자기의 죄에서’는 소유격을 분명히 살립니다.
- source_word: מִשְׁפָּט וּצְדָקָה
  english_pob_choice: justice and righteousness
  chosen_korean: 정의와 의를
  alternatives_korean:
  - 공의와 의를
  - 정의와 공의를
  lexicon: HALOT
  rationale: מִשְׁפָּט과 צְדָקָה는 서로 다른 윤리적 범주를 유지해야 하므로 두 항을 분리했습니다. ‘정의’와 ‘의’가 문맥상 가장 직접적이며 POB의 구분을 잘 반영합니다.
theological_decisions:
- issue: 회개 동사의 방향성
  chosen_reading: ‘돌이켜’로 옮겨 죄에서 하나님께로의 방향 전환을 함축하되, 문장 자체는 죄로부터의 전환에 초점을 둡니다.
  alternative_readings:
  - ‘돌아오면’으로 더 회개적 의미를 드러내는 읽기
  - 단순히 ‘되돌아가면’으로 약화하는 읽기
  rationale: 히브리어 שׁוּב는 예언서에서 회개를 포함하는 표준 동사이지만, 본절의 직접 대상은 ‘죄에서’의 전환입니다. 그래서 회개 신학을 과잉 주입하지 않으면서도 의미를 보존했습니다.
  doctrine_reference: Ezekiel 33 문맥의 회개-책임 구조
- issue: 윤리 쌍항의 보존
  chosen_reading: ‘정의와 의’로 두 개념을 구분해 유지합니다.
  alternative_readings:
  - ‘옳고 바른 일’로 하나의 관용구로 합치는 읽기
  - ‘공의와 의’로 전통 용어를 고정하는 읽기
  rationale: 본문은 מִשְׁפָּט와 צְדָקָה를 병렬로 두어 윤리적 충실성을 강조합니다. 한국어에서도 두 항을 분리해야 원문의 신학적 긴장을 보존할 수 있습니다.
  doctrine_reference: 히브리어 윤리 어휘의 병렬 구조
