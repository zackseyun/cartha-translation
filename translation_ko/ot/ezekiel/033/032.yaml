id: EZK.33.32
reference: Ezekiel 33:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנְּ/ךָ֤ לָ/הֶם֙ כְּ/שִׁ֣יר עֲגָבִ֔ים יְפֵ֥ה ק֖וֹל וּ/מֵטִ֣ב נַגֵּ֑ן וְ/שָֽׁמְעוּ֙ אֶת דְּבָרֶ֔י/ךָ וְ/עֹשִׂ֥ים אֵינָ֖/ם אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/032.yaml
  text: Look[a], you are to them like a sensual song, with a beautiful voice and skillful playing; they hear your words, but they do not do them.
  footnotes:
  - marker: a
    text: Or 'like a love song.' The Hebrew expression can denote passionate or sensual desire; the phrase emphasizes that they treat the prophet's message as attractive entertainment.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 당신은 그들에게 관능적인 노래와 같아서 아름다운 목소리와 능숙한 연주를 지녔습니다. 그들은 당신의 말을 듣지만, 그것을 행하지는 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사랑 노래’일 수 있습니다. 히브리어 표현은 열정적이거나 관능적인 욕망을 나타낼 수 있으며, 여기서는 그들이 예언자의 메시지를 매력적인 오락처럼 대한다는 점을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְּךָ
  english_pob_choice: Look, you are
  chosen_korean: 보십시오, 당신은
  alternatives_korean:
  - 보라, 당신은
  - 보십시오, 그대는
  lexicon: HALOT
  rationale: הִנֵּה의 주의를 끄는 감탄/지시 기능을 살려 현대 한국어에서는 ‘보십시오’로 자연스럽게 옮기고, 부착된 인칭대명사는 ‘당신은’으로 처리했습니다.
- source_word: כְּשִׁיר עֲגָבִים
  english_pob_choice: like a sensual song
  chosen_korean: 관능적인 노래와 같아서
  alternatives_korean:
  - 사랑 노래와 같아서
  - 음탕한 노래와 같아서
  - 애욕의 노래와 같아서
  lexicon: HALOT
  rationale: עֲגָבִים의 유혹적·성적 뉘앙스를 살리되 과도하게 노골적이지 않게 ‘관능적인’으로 옮겼습니다. ‘사랑 노래’는 의미를 너무 중화할 수 있어 피했습니다.
- source_word: יְפֵה קוֹל וּמֵטִב נַגֵּן
  english_pob_choice: with a beautiful voice and skillful playing
  chosen_korean: 아름다운 목소리와 능숙한 연주를 지녔습니다
  alternatives_korean:
  - 아름다운 목소리와 연주 솜씨를 지녔습니다
  - 아름다운 음성에 능숙한 연주를 보입니다
  lexicon: HALOT
  rationale: 직역투의 ‘목소리가 아름답고 연주를 잘함’보다, 한국어에서 더 자연스러운 서술형으로 옮기되 두 형용 성격을 모두 유지했습니다.
- source_word: וְעֹשִׂים אֵינָם אוֹתָם
  english_pob_choice: but they do not do them
  chosen_korean: 그것을 행하지는 않습니다
  alternatives_korean:
  - 그것을 실행하지는 않습니다
  - 그것을 실천하지는 않습니다
  lexicon: HALOT
  rationale: ‘עשה’의 행함/수행 의미를 살려 ‘행하다’로 번역해 청각적 수용과 실제 순종의 대비를 분명히 했습니다.
theological_decisions:
- issue: 예언 메시지를 즐길거리로 소비하는 태도
  chosen_reading: 본문의 비판은 그들이 예언자의 말을 순종의 대상으로 듣지 않고, 매력적인 공연처럼 소비한다는 데 있습니다.
  alternative_readings:
  - 단순히 좋아한다는 뜻으로 완화하는 해석
  - 중립적인 음악 취향 묘사로 보는 해석
  rationale: 문맥상 핵심은 미학적 평가가 아니라 청종-불순종의 대비이므로, ‘관능적인 노래’라는 강한 표현을 유지해 책망의 성격을 드러냈습니다.
  doctrine_reference: Ezekiel 33 문맥; 해석 원칙
