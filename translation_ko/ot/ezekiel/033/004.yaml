    issue: ‘그 경고를 듣는 사람’이 원문의 첫 ‘듣는 사람’에 없는 목적어를 첨가하고 ‘나팔 소리를 듣고’와 중복됩니다.
    rationale: 히브리어는 ‘듣는 사람이 나팔 소리를 듣고’라고 하여, 분사와 동사의 반복으로 청취 행위를 강조합니다. 첫 표현에 ‘경고’를 넣으면 이 반복과 문장 구조가 흐려집니다.
  - severity: medium
    issue: ‘칼이 와서 그를 죽일 때’는 וַתִּקָּחֵהוּ를 ‘죽이다’로 구체화합니다.
    rationale: לקח은 ‘취하다, 데려가다’이며, 죽음의 결과는 문맥상 암시되지만 동사 자체가 직접 ‘죽이다’는 아닙니다. 원문의 절제된 표현을 유지하는 것이 안전합니다.
  revised_text: 그러면 나팔 소리를 듣는 사람이 그 경고에 주의하지 않으면, 칼이 와서 그를 데려가도 그의 피는 그의 머리 위에 있을 것입니다.[a]
