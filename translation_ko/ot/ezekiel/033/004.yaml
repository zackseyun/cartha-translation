  lexicon: HALOT
  rationale: 본문의 책임 있는 반응 실패를 드러내기 위해 ‘경고를 받다’로 옮겼고, ‘take warning’의 수동·응답적 뉘앙스를 살렸습니다.
- source_word: ק֤וֹל הַשּׁוֹפָר֙
  english_pob_choice: the sound of the trumpet
  chosen_korean: 나팔 소리
  alternatives_korean:
