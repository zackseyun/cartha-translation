  text: then if the one who hears hears the sound of the trumpet and does not take warning[a], and the sword comes and takes him away, his blood will be on his own head.
  footnotes:
  - marker: a
    text: 'Hebrew: ''his blood will be on his head,'' an idiom meaning he bears responsibility for his own death.'
    reason: cultural_note
translation:
  language: ko
  text: 그러면 그 경고를 듣는 사람이 나팔 소리를 듣고도 경고를 받지 않으면, 칼이 와서 그를 죽일 때 그의 피는 자기 머리 위에 있게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용으로, ‘그의 피가 그의 머리 위에 있다’는 뜻이며 자기 죽음의 책임을 스스로 진다는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמַע ... הַשֹּׁמֵעַ
  english_pob_choice: then if the one who hears hears
  chosen_korean: 그 경고를 듣는 사람이 ... 듣고도
  alternatives_korean:
  - 듣는 자가 ... 듣고도
  - 듣는 사람이 ... 듣고도
  lexicon: HALOT
  rationale: 조건문의 지속을 한국어에서 자연스럽게 풀어, 단순한 ‘그리고’보다 ‘...하고도’/‘-면’의 조건감으로 옮겼습니다.
- source_word: נִזְהָר
  english_pob_choice: take warning
  chosen_korean: 경고를 받지 않으면
