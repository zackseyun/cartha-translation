  - 트럼펫 소리
  lexicon: HALOT
  rationale: קוֹל의 청각적 신호를 한국어 관용에 맞게 ‘나팔 소리’로 간명하게 옮겼습니다.
- source_word: דָּמ֥וֹ בְרֹאשׁוֹ יִהְיֶה
  english_pob_choice: his blood will be on his own head
  chosen_korean: 그의 피는 자기 머리 위에 있게 됩니다
  alternatives_korean:
  - 그의 피는 자기 머리 위에 있게 됩니다
  - 그의 피는 그의 머리 위에 있을 것입니다
  - 그는 자기 책임을 지게 됩니다
  lexicon: HALOT
  rationale: ‘피가 머리 위에 있다’는 히브리어 관용을 보존해 책임 귀속의 강한 이미지를 살렸고, POB의 설명적 의도를 유지했습니다.
theological_decisions:
- issue: 책임 귀속의 관용구 처리
  chosen_reading: ‘그의 피는 자기 머리 위에 있게 됩니다’로 관용구를 유지합니다.
  alternative_readings:
  - 그가 자기 죽음의 책임을 져야 합니다
  - 그의 피의 책임이 그에게 있습니다
  rationale: 본문은 단순한 결과보다 개인적 책임과 유죄성을 강조하므로, 해설로 풀기보다 히브리어 관용을 보존하는 편이 경고-심판의 수사적 힘을 더 잘 전달합니다.
  doctrine_reference: 'Translation philosophy #3, #6'
