id: EZK.33.6
reference: Ezekiel 33:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/הַ/צֹּפֶה כִּֽי יִרְאֶ֨ה אֶת הַ/חֶ֜רֶב בָּאָ֗ה וְ/לֹֽא תָקַ֤ע בַּ/שּׁוֹפָר֙ וְ/הָ/עָ֣ם לֹֽא נִזְהָ֔ר וַ/תָּב֣וֹא חֶ֔רֶב וַ/תִּקַּ֥ח מֵ/הֶ֖ם נָ֑פֶשׁ ה֚וּא בַּ/עֲוֺנ֣/וֹ נִלְקָ֔ח וְ/דָמ֖/וֹ מִ/יַּֽד הַ/צֹּפֶ֥ה אֶדְרֹֽשׁ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/006.yaml
  text: But if the watchman sees the sword coming and does not blow the trumpet[a], and the people are not warned, and the sword comes and takes a life from among them, that one is taken away in his iniquity[b], but I will require his blood from the watchman's hand.
  footnotes:
  - marker: a
    text: Or 'do not take warning.' The Hebrew can be understood either as the people not being warned or as their not heeding warning; the main text follows the causal emphasis created by the watchman's failure to sound the trumpet.
    reason: lexical_alternative
  - marker: b
    text: '''His blood ... from the watchman''s hand'' is a legal idiom of accountability for a death.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 파수꾼이 칼이 오는 것을 보고도 나팔을 불지 않아 백성이 경고를 받지 못한 채[a], 칼이 와서 그들 가운데서 한 사람의 목숨을 빼앗으면, 그 사람은 자기 죄악 때문에 죽임을 당하지만, 나는 파수꾼의 손에서 그 사람의 피를 요구하겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경고를 받지 못한 채’는 파수꾼이 나팔을 불지 않은 결과를 살린 번역입니다. 히브리어는 백성이 경고를 받지 못했다는 뜻과 백성이 경고를 듣고도 주의하지 않았다는 뜻, 둘 다로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘파수꾼의 손에서 그 사람의 피를 요구하겠습니다’는 그 죽음에 관하여 파수꾼에게 법적 책임을 묻겠다는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַצֹּפֶה
  english_pob_choice: the watchman
  chosen_korean: 파수꾼
  alternatives_korean:
  - 망보는 자
  - 초병
  lexicon: HALOT
  rationale: צֹפֶה는 지키며 살피는 자를 가리키므로, 에스겔 33장의 예언적 책임 문맥에 가장 자연스럽고 관용적인 한국어로 ‘파수꾼’을 택했습니다.
- source_word: תָקַע בַּשּׁוֹפָר
  english_pob_choice: blow the trumpet
  chosen_korean: 나팔을 불지
  alternatives_korean:
  - 나팔을 울리지
  - 뿔나팔을 불지
  lexicon: HALOT
  rationale: שׁוֹפָר는 경고 신호의 악기로서 ‘나팔’이 한국어 성경 문맥에서 가장 직접적이며, 동사는 경고를 알리는 행위를 분명하게 드러내는 ‘불다’로 옮겼습니다.
- source_word: וְהָעָם לֹא נִזְהָר
  english_pob_choice: and the people are not warned
  chosen_korean: 백성이 경고를 받지 못한 채
  alternatives_korean:
  - 백성이 경고를 받지 않아
  - 백성이 경고를 듣지 않아
  lexicon: HALOT
  rationale: נִזְהָר는 ‘경고를 받다/경고를 듣고 주의하다’의 뜻이 있어, 여기서는 파수꾼의 실패로 인한 결과를 살려 수동적 표현인 ‘경고를 받지 못한 채’로 옮겼습니다.
- source_word: וַתִּקַּח מֵהֶם נָפֶשׁ
  english_pob_choice: takes a life from among them
  chosen_korean: 그들 가운데서 한 사람의 생명을 빼앗으면
  alternatives_korean:
  - 그들 가운데서 한 생명을 데려가면
  - 그들 가운데서 한 사람을 데려가면
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 개인의 생명/한 사람을 뜻하므로, 문맥의 자연스러움과 죽음의 결과를 살려 ‘한 사람의 생명’으로 표현했습니다.
- source_word: בַּעֲוֺנוֹ נִלְקָח
  english_pob_choice: is taken away in his iniquity
  chosen_korean: 자기의 악행으로 인해 붙들린 것이지만
  alternatives_korean:
  - 자기의 죄악 가운데서 끌려간 것이지만
  - 자기의 죄악 때문에 취해진 것이지만
  lexicon: HALOT
  rationale: עָוֹן은 ‘죄악/악행’과 ‘죄책’의 뉘앙스를 함께 가지므로, 전형적인 법정적 표현을 한국어로 너무 도식화하지 않으면서도 원문의 인과를 드러내는 문장으로 옮겼습니다.
- source_word: מִיַּד הַצֹּפֶה אֶדְרֹשׁ
  english_pob_choice: I will require ... from the watchman's hand
  chosen_korean: 나는 파수꾼의 손에서 그의 피를 요구하겠습니다
  alternatives_korean:
  - 나는 파수꾼에게 그의 피에 대한 책임을 요구하겠습니다
  - 나는 파수꾼의 손에서 그 피를 묻겠습니다
  lexicon: HALOT
  rationale: דרשׁ + מִיַּד는 법적 책임을 묻는 관용구이므로, ‘요구하겠습니다’로 번역하고 ‘손에서’를 살려 책임 소재의 이미지를 보존했습니다.
theological_decisions:
- issue: 피를 요구하겠다는 המשפט적 표현의 보존
  chosen_reading: 하나님이 파수꾼에게 실제로 책임을 물으신다는 법정적 진술을 그대로 살렸습니다.
  alternative_readings:
  - 책임을 묻겠다
  - 피값을 치르게 하겠다
  rationale: 원문은 단순한 도덕적 비난이 아니라 죽음에 대한 법적·언약적 책임 추궁을 말하므로, 한국어에서도 ‘피를 요구하다’의 직설성을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
