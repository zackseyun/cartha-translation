revisions:
- from: 그러나 파수꾼이 칼이 오는 것을 보고도 나팔을 불지 않아 백성이 경고를 받지 못한 채, 칼이 와서 그들 가운데서 한 사람의 생명을 빼앗으면, 그 사람은 자기의 악행으로 인해 붙들린 것이지만 나는 파수꾼의 손에서 그의 피를 요구하겠습니다.[a][b]
  to: 그러나 파수꾼이 칼이 오는 것을 보고도 나팔을 불지 않아 백성이 경고를 받지 못한 채[a], 칼이 와서 그들 가운데서 한 사람의 목숨을 빼앗으면, 그 사람은 자기 죄악 때문에 죽임을 당하지만, 나는 파수꾼의 손에서 그 사람의 피를 요구하겠습니다.[b]
  rationale: 수정은 원문의 조건문과 책임의 이중 진술을 유지하면서, ‘붙들린’이라는 오해 소지가 있는 표현을 죽음의 문맥에 맞게 바로잡았습니다. 또한 ‘죄악’을 사용하여 עָוֹן의 의미 폭을 보존했고, 각주 표지를 설명 대상에 직접 연결했습니다.
