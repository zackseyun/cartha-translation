base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/030.yaml
  text: And you[a], son of man, the sons of your people who talk about you beside the walls and in the doorways of the houses, each one speaking with another, each man with his brother, saying[b], ‘Come now and hear what the word is that comes from Yahweh.’
  footnotes:
  - marker: a
    text: Or, 'who speak with you,' though the context more likely means they are talking about Ezekiel among themselves.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'that comes out from the LORD'; that is, the prophetic word proceeding from him.
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 네 백성의 자손들이 벽 곁과 집들의 출입구에서 너를 두고[a] 말하며, 저마다 자기 형제에게 말하기를, “자, 와서 야훼에게서 나오는[b] 말씀이 무엇인지 들어봅시다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘너에 관하여 말하는’이라는 뜻입니다. 문맥상 에스겔에게 직접 말하는 것보다, 그들끼리 에스겔에 대해 말하는 것을 가리키는 것이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나오는’은 히브리어 ‘나아오는/밖으로 나오는’의 방향성을 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자야
  alternatives_korean:
