  lexicon: HALOT
  rationale: ב + דבר의 의미를 자연스러운 현대 한국어로 옮기되, ‘너와 이야기하다’가 아니라 ‘너에 대해 말하다’라는 방향을 살렸습니다.
- source_word: אֵצֶל הַקִּירוֹת / וּבְפִתְחֵי הַבָּתִּים
  english_pob_choice: beside the walls / in the doorways of the houses
  chosen_korean: 성곽 곁과 집들의 문간에서
  alternatives_korean:
  - 담 곁과 집들의 문턱에서
  - 벽 곁과 집들의 문입구에서
  lexicon: HALOT
  rationale: 공간의 근접성과 가정의 출입 지점을 현대적이면서도 이미지가 살아 있게 전달했습니다. ‘성곽’은 복수 ‘walls’의 도시적 외곽 이미지를 반영합니다.
- source_word: מָה הַדָּבָר הַיּוֹצֵא מֵאֵת יְהוָה
  english_pob_choice: what the word is that comes from Yahweh
  chosen_korean: 야훼에게서 나오는 말씀이 무엇인지
  alternatives_korean:
  - 야훼에게서 나오는 말이 무엇인지
  - 야훼로부터 나오는 말씀이 무엇인지
  lexicon: HALOT
  rationale: דבר을 예언적 ‘말씀’으로 살리고, היוצא의 역동성을 ‘나오는’으로 유지했습니다. 메아리처럼 흘러나오는 예언의 출처를 드러내기 위해 ‘에게서’로 처리했습니다.
