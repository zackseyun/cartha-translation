  - 인간아
  lexicon: HALOT
  rationale: 에스겔서에서 반복되는 신적 호칭을 한국어 성경 관용에 맞게 ‘인자’로 옮기되, 직접 호격을 드러내기 위해 ‘-야’를 붙였습니다.
- source_word: הַנִּדְבָּרִים בְּךָ
  english_pob_choice: who talk about you
  chosen_korean: 너에 대해 이야기하며
  alternatives_korean:
  - 너를 두고 말하며
