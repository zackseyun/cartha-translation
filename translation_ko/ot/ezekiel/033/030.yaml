  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם בְּנֵ֣י עַמְּ/ךָ֗ הַ/נִּדְבָּרִ֤ים בְּ/ךָ֙ אֵ֣צֶל הַ/קִּיר֔וֹת וּ/בְ/פִתְחֵ֖י הַ/בָּתִּ֑ים וְ/דִבֶּר חַ֣ד אֶת אַחַ֗ד אִ֤ישׁ אֶת אָחִי/ו֙ לֵ/אמֹ֔ר בֹּֽאוּ נָ֣א וְ/שִׁמְע֔וּ מָ֣ה הַ/דָּבָ֔ר הַ/יּוֹצֵ֖א מֵ/אֵ֥ת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/030.yaml
  text: And you[a], son of man, the sons of your people who talk about you beside the walls and in the doorways of the houses, each one speaking with another, each man with his brother, saying[b], ‘Come now and hear what the word is that comes from Yahweh.’
  footnotes:
  - marker: a
    text: Or, 'who speak with you,' though the context more likely means they are talking about Ezekiel among themselves.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'that comes out from the LORD'; that is, the prophetic word proceeding from him.
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 네 백성의 아들들이 성곽 곁과 집들의 문간에서 너에 대해 이야기하며, 서로가 서로에게 말하기를—“자, 와서 야훼에게서 나오는 말씀이 무엇인지 들어보자.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너에 대해 이야기하며’는 히브리어의 ב + דבר를 반영한 것으로, 문맥상 에스겔에게 ‘말을 거는’ 것보다 그에 대해 수군거리는 뜻이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나오는’은 히브리어 היוצא의 방향성을 살린 표현입니다. ‘오는’으로만 옮기면 출처에서 밖으로 나오는 뉘앙스가 약해집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서에서 반복되는 신적 호칭을 한국어 성경 관용에 맞게 ‘인자’로 옮기되, 직접 호격을 드러내기 위해 ‘-야’를 붙였습니다.
- source_word: הַנִּדְבָּרִים בְּךָ
  english_pob_choice: who talk about you
  chosen_korean: 너에 대해 이야기하며
  alternatives_korean:
  - 너를 두고 말하며
  - 너에 관해 말하며
  lexicon: HALOT
  rationale: ב + דבר의 의미를 자연스러운 현대 한국어로 옮기되, ‘너와 이야기하다’가 아니라 ‘너에 대해 말하다’라는 방향을 살렸습니다.
- source_word: אֵצֶל הַקִּירוֹת / וּבְפִתְחֵי הַבָּתִּים
  english_pob_choice: beside the walls / in the doorways of the houses
  chosen_korean: 성곽 곁과 집들의 문간에서
  alternatives_korean:
  - 담 곁과 집들의 문턱에서
  - 벽 곁과 집들의 문입구에서
  lexicon: HALOT
  rationale: 공간의 근접성과 가정의 출입 지점을 현대적이면서도 이미지가 살아 있게 전달했습니다. ‘성곽’은 복수 ‘walls’의 도시적 외곽 이미지를 반영합니다.
- source_word: מָה הַדָּבָר הַיּוֹצֵא מֵאֵת יְהוָה
  english_pob_choice: what the word is that comes from Yahweh
  chosen_korean: 야훼에게서 나오는 말씀이 무엇인지
  alternatives_korean:
  - 야훼에게서 나오는 말이 무엇인지
  - 야훼로부터 나오는 말씀이 무엇인지
  lexicon: HALOT
  rationale: דבר을 예언적 ‘말씀’으로 살리고, היוצא의 역동성을 ‘나오는’으로 유지했습니다. 메아리처럼 흘러나오는 예언의 출처를 드러내기 위해 ‘에게서’로 처리했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기적 고유명 יהוה를 직접 사용하므로, 관례적 대체어보다 고유 이름을 드러내는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
