  source_fidelity: ‘성곽’은 אֵצֶל הַקִּירוֹת(벽들 곁)를 도시의 성벽으로 좁혀 본문의 공간상을 바꾸므로 ‘벽 곁’으로 고쳐야 합니다. 또한 ‘서로가 서로에게’는 אִישׁ אֶת אָחִיו의 ‘각 사람이 자기 형제에게’라는 분배적 표현을 충분히 반영하지 못합니다. בְּנֵי עַמְּךָ는 문맥상 백성 구성원을 가리키므로, 현대 한국어에서 남성만을 뜻하게 되기 쉬운 ‘아들들’ 대신 ‘자손들’로 옮겼습니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지합니다. 인용문도 ‘들어봅시다’로 처리하여 요청된 격식체와 일관되게 했습니다. ‘벽 곁과 집들의 출입구에서’, ‘저마다 자기 형제에게 말하기를’은 원문의 병렬과 반복을 자연스럽게 보존합니다.
  terminology: ‘인자야’는 에스겔서의 정형적 호칭으로 유지하고, יהוה는 정책에 따라 ‘야훼’로 유지했습니다. דָּבָר는 예언적 발화라는 문맥을 살려 ‘말씀’으로, הַיּוֹצֵא는 출처로부터 나아오는 방향성을 살려 ‘나오는’으로 옮겼습니다. 각주 a의 ‘수군거리는’은 원문에 없는 경멸적 뉘앙스이므로 삭제해야 합니다.
