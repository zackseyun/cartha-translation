source:
  edition: WLC
  text: וְ/יָב֣וֹאוּ אֵ֠לֶי/ךָ כִּ/מְבוֹא עָ֞ם וְ/יֵשְׁב֤וּ לְ/פָנֶ֨י/ךָ֙ עַמִּ֔/י וְ/שָֽׁמְעוּ֙ אֶת דְּבָרֶ֔י/ךָ וְ/אוֹתָ֖/ם לֹ֣א יַֽעֲשׂ֑וּ כִּֽי עֲגָבִ֤ים בְּ/פִי/הֶם֙ הֵ֣מָּה עֹשִׂ֔ים אַחֲרֵ֥י בִצְעָ֖/ם לִבָּ֥/ם הֹלֵֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/031.yaml
  text: And they come to you as people come[a], and they sit before you as my people, and they hear your words, but they do not do them; for with their mouth they speak lustful things[b], while their heart goes after their unjust gain.
  footnotes:
  - marker: a
    text: Or 'lusts,' 'sensual desires,' or possibly 'amorous songs.' The Hebrew term is rare and may refer either to what they speak with their mouths or to the kind of entertainment they make of the prophet's words.
    reason: lexical_alternative
  - marker: b
    text: '''Unjust gain'' may also be rendered ''profit,'' ''greed,'' or ''covetous gain.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 사람이 찾아오듯이 당신에게 와서 당신 앞에 앉아 내 백성인 것처럼 당신의 말을 듣지만, 그것을 행하지는 않습니다. 그들의 입으로는 음란한 말을 하지만, 그들의 마음은 불의한 이익을 따라갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘음란한 말’은 히브리어의 희귀어 עֲגָבִים를 반영한 것으로, 욕망의 말, 관능적인 말, 또는 노래처럼 즐기는 표현까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘불의한 이익’은 ‘이득’, ‘탐욕스러운 이익’, ‘부정한 이익’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְבוֹא עָם
  english_pob_choice: as people come
  chosen_korean: 사람이 찾아오듯이
  alternatives_korean:
  - 사람들이 오는 것처럼
  - 한 무리가 오는 것처럼
  lexicon: HALOT
  rationale: 비유의 핵심은 평범한 사람들의 내방 방식과의 비교이므로, 자연스러운 한국어로 ‘사람이 찾아오듯이’라고 옮겨 비교감을 살렸습니다.
- source_word: עַמִּי
  english_pob_choice: my people
  chosen_korean: 내 백성인 것처럼
  alternatives_korean:
  - 내 백성처럼
  - 내 백성이라 하듯이
  lexicon: HALOT
  rationale: 언약적 소속을 드러내면서도, 실제 순종이 없는 위선을 드러내기 위해 ‘인 것처럼’의 뉘앙스를 살렸습니다.
- source_word: עֲגָבִים בְּפִיהֶם הֵמָּה עֹשִׂים
  english_pob_choice: with their mouth they speak lustful things
  chosen_korean: 그들의 입으로는 음란한 말을 하지만
  alternatives_korean:
  - 그들의 입으로는 음욕 어린 말을 하지만
  - 그들의 입으로는 정욕적인 말을 하지만
  lexicon: HALOT
  rationale: 희귀어 עֲגָבִים는 여기서 입으로 드러나는 말과 연결되므로, 성적 욕망을 연상시키는 동시에 한국어로 지나치게 특정 장르에 묶지 않는 ‘음란한 말’로 번역했습니다.
- source_word: בִצְעָם
  english_pob_choice: their unjust gain
  chosen_korean: 불의한 이익
  alternatives_korean:
  - 부정한 이익
  - 탐욕스러운 이익
  - 불의한 이득
  lexicon: HALOT
  rationale: בצע는 단순한 이익이 아니라 부당하게 얻는 이익의 색채가 있으므로, 도덕적 평가를 분명히 하는 ‘불의한 이익’으로 옮겼습니다.
- source_word: וְאוֹתָם לֹא יַעֲשׂוּ
  english_pob_choice: but they do not do them
  chosen_korean: 그것을 행하지는 않습니다
  alternatives_korean:
  - 그것을 하지 않습니다
  - 그것을 실행하지는 않습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘말을 행하다’라는 관용구를 살려, 단순 부정이 아니라 순종의 결여를 드러내는 ‘행하지는 않습니다’로 옮겼습니다.
theological_decisions:
- issue: 말과 마음의 대비가 드러내는 위선의 구조
  chosen_reading: 이 구절은 겉으로는 말씀을 듣는 백성처럼 보이지만, 실제로는 입의 말과 마음의 추구가 분열된 위선적 청중을 묘사합니다.
  alternative_readings:
  - 말의 내용이 단지 친절하거나 호의적인 표현일 수 있다는 읽기
  - 이들을 말씀을 음악처럼 즐기는 청중으로 보는 읽기
  rationale: 문맥이 ‘듣지만 행하지 않음’과 ‘입’ 대 ‘마음’의 대조를 강조하므로, 위선과 내적 분열을 분명히 드러내는 해석이 가장 직접적입니다.
  doctrine_reference: Ezekiel 33:30-33 문맥
