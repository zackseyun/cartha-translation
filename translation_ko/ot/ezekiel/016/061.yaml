source:
  edition: WLC
  text: וְ/זָכַ֣רְתְּ אֶת דְּרָכַיִ/ךְ֮ וְ/נִכְלַמְתְּ֒ בְּ/קַחְתֵּ֗/ךְ אֶת אֲחוֹתַ֨יִ/ךְ֙ הַ/גְּדֹל֣וֹת מִמֵּ֔/ךְ אֶל הַ/קְּטַנּ֖וֹת מִמֵּ֑/ךְ וְ/נָתַתִּ֨י אֶתְ/הֶ֥ן לָ֛/ךְ לְ/בָנ֖וֹת וְ/לֹ֥א מִ/בְּרִיתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/061.yaml
  text: Then you will remember your ways and be ashamed when you receive your sisters[a], those older than you along with those younger than you; and I will give them to you as daughters[b], but not because of your covenant.
  footnotes:
  - marker: a
    text: Or, 'when you take your sisters, those older than you and those younger than you.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'not because of your covenant' indicates that this restoration does not arise from Jerusalem's own covenantal claim or merit.
    reason: cross_reference
translation:
  language: ko
  text: 그러면 네가 네 길을 기억하고, 네 자매들[a], 곧 너보다 나이 많은 자매들과 너보다 나이 어린 자매들을 받아들일 때에 부끄러워할 것입니다. 내가 그들을 네게 딸들로 주겠습니다[b]. 그러나 그것은 네 언약으로 말미암는 것이 아닙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘네가 네 자매들, 곧 너보다 나이 많은 자매들과 너보다 나이 어린 자매들을 맞아들일 때에’
    reason: alternative_reading
  - marker: b
    text: ‘네 언약으로 말미암는 것이 아닙니다’는 그들을 딸들로 주시는 일이 ‘네 언약’에서 비롯되지 않음을 말합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְזָכַרְתְּ אֶת דְּרָכַיִךְ
  english_pob_choice: Then you will remember your ways
  chosen_korean: 그러면 네가 네 길을 기억하고
  alternatives_korean:
  - 그리고 네가 네 길을 기억하고
  - 그때 네가 네 길을 기억하고
  lexicon: HALOT
  rationale: זכר의 결과적 미래 의미를 살려 ‘그러면’으로 연결했고, דֶּרֶךְ는 도덕적 ‘행실’보다 원문 이미지를 살리는 ‘길’로 옮겼습니다.
- source_word: וְנִכְלַמְתְּ
  english_pob_choice: and be ashamed
  chosen_korean: 부끄러워할 것이며
  alternatives_korean:
  - 수치를 당할 것이며
  - 부끄러움을 느낄 것이며
  lexicon: HALOT
  rationale: נכלם의 수치·부끄러움 의미를 자연스러운 한국어로 살렸습니다.
- source_word: הַגְּדֹלוֹת מִמֵּךְ ... הַקְּטַנּוֹת מִמֵּךְ
  english_pob_choice: those older than you along with those younger than you
  chosen_korean: 너보다 나이 많은 자매들과 너보다 나이 어린 자매들을
  alternatives_korean:
  - 너보다 큰 자매들과 너보다 작은 자매들을
  - 너보다 연장된 자매들과 너보다 어린 자매들을
  lexicon: HALOT
  rationale: 문자적으로는 ‘더 큰/작은’이지만 자매 비유 안에서 연장·연소를 가리키므로 한국어에서는 ‘나이 많은/어린’이 가장 분명합니다. ‘들과’로 두 집단을 함께 묶어 אֶל의 병렬 감각을 살렸습니다.
- source_word: וְנָתַתִּי אֶתְהֶן לָךְ לְבָנוֹת
  english_pob_choice: and I will give them to you as daughters
  chosen_korean: 내가 그들을 네게 딸들로 주겠으나
  alternatives_korean:
  - 내가 그들을 네게 딸로 주겠으나
  - 내가 그들을 네게 딸들로 삼아 주겠으나
  lexicon: HALOT
  rationale: לְבָנוֹת의 관계적 편입을 ‘딸들로’로 직역에 가깝게 유지했습니다.
- source_word: וְלֹא מִבְּרִיתֵךְ
  english_pob_choice: but not because of your covenant
  chosen_korean: 네 언약 때문에는 아닙니다
  alternatives_korean:
  - 네 언약으로 말미암은 것은 아닙니다
  - 네 언약으로 인한 것은 아닙니다
  lexicon: HALOT
  rationale: מִ는 원인/근거를 부정하는 방향으로 읽어, 축복의 근거가 예루살렘의 언약적 자격이 아님을 간명하게 드러냈습니다.
theological_decisions:
- issue: ‘네 언약’의 의미와 근거 부정
  chosen_reading: 회복과 ‘딸들’의 부여는 예루살렘 자신의 언약적 자격이나 공로에서 나오지 않는다는 뜻으로 유지했습니다.
  alternative_readings:
  - 예루살렘과 맺은 언약에 따른 것이 아니라는 뜻
  - 예루살렘의 언약 소유를 근거로 하지 않는다는 뜻
  rationale: 본문의 대조는 하나님의 주권적 주심과 예루살렘의 자격 부재를 대비합니다. 그 긴장을 풀어 쓰지 않고 그대로 남겼습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
