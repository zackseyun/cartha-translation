  to: 그러면 네가 네 길을 기억하고, 네 자매들[a], 곧 너보다 나이 많은 자매들과 너보다 나이 어린 자매들을 받아들일 때에 부끄러워할 것입니다. 내가 그들을 네게 딸들로 주겠습니다[b]. 그러나 그것은 네 언약으로 말미암는 것이 아닙니다.
