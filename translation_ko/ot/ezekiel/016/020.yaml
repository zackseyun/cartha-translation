lexical_decisions:
- source_word: בָּנַ֤יִךְ וְאֶת בְּנוֹתַ֨יִךְ
  english_pob_choice: your sons and your daughters
  chosen_korean: 당신은 당신이 나에게 낳은 당신의 아들과 딸들을
  alternatives_korean:
  - 당신의 아들과 딸들을
  - 당신이 낳은 아들과 딸들을
  lexicon: 자녀 관계 표현
  rationale: 히브리어는 단순 소유가 아니라 ‘나에게서 낳은’ 관계를 분명히 하므로, 한국어도 출생의 귀속을 드러내어 원문의 강조를 살렸습니다.
