  lexicon: sexual infidelity metaphor
  rationale: 에스겔 16장의 일관된 혼인-음행 비유를 따라, 직설적이되 한국어 성경 문체에서 널리 통용되는 ‘음행’을 사용했습니다.
theological_decisions:
- issue: 히브리어 수사 의문문인 “Was your prostitution too small a thing?”의 처리
  chosen_reading: ‘당신의 음행이 너무 사소한 일이었습니까?’로 직역하여 책망의 수사적 충격을 유지했습니다.
  alternative_readings:
  - ‘그것만으로는 부족했습니까?’
  - ‘그 정도로도 모자랐습니까?’
  rationale: 본문은 단순 정보가 아니라 가증한 행위를 더 크게 드러내는 예언자적 질책이므로, 완곡하게 풀지 않고 수사 의문문 구조를 보존했습니다.
  doctrine_reference: 예언서의 심판 수사
