lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 인간이여
  lexicon: HALOT
  rationale: 에스겔서의 반복적 신적 호칭을 살리면서도 한국어에서 자연스럽고 공인된 성경적 호칭인 ‘인자야’를 사용했습니다. ‘사람의 아들아’는 직역에 가깝지만 문맥적 기능이 약해집니다.
- source_word: הוֹדַע
  english_pob_choice: make known to
  chosen_korean: 알리십시오
  alternatives_korean:
  - 알게 하십시오
  - 알려 주십시오
  - 고지하십시오
  lexicon: HALOT
  rationale: 히필 명령형의 사역적 의미를 한국어 공손 명령으로 자연스럽게 옮겼습니다. ‘알리십시오’는 목적어 앞에 오는 대상(예루살렘)과 내용(가증한 일들)의 구조를 무리 없이 반영합니다.
- source_word: תּוֹעֲבֹתֶיהָ
  english_pob_choice: her abominations
  chosen_korean: 그 여인의 가증한 일들
  alternatives_korean:
  - 그 여인의 가증들
  - 그녀의 가증한 행위들
  - 그 여인의 혐오스러운 일들
  lexicon: HALOT
  rationale: ‘תּוֹעֵבָה’의 강한 도덕·언약적 혐오 의미를 ‘가증한 일들’로 살렸습니다. 3인칭 여성 단수 접미사는 예루살렘의 의인화를 따라 ‘그 여인의’로 반영했습니다.
- source_word: יְרוּשָׁלִַם
  english_pob_choice: Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 예루살렘성
  lexicon: HALOT
  rationale: 지명은 한국어 성경에서 널리 통용되는 음역 ‘예루살렘’을 유지했습니다.
theological_decisions:
- issue: 예루살렘의 여성화된 수식 유지
  chosen_reading: ‘그 여인의’로 번역해 여성 단수 인칭을 분명히 드러냈습니다.
  alternative_readings:
  - 그것의
  - 예루살렘의
  rationale: 본문은 예루살렘을 여인으로 의인화한 뒤 이어지는 비유를 준비하므로, 중성화하면 수사적 장치가 약화됩니다.
  doctrine_reference: Translation philosophy §4 (gender-accurate over gender-neutral)
