  source_fidelity: ‘그 여인의’는 히브리어 여성 단수 접미사가 가리키는 예루살렘의 여성 의인화를 보존하려는 의도는 좋지만, 원문에 없는 명사 ‘여인’을 본문에 보충합니다. 본절에서는 접미사를 ‘그녀의’로 옮겨 여성 지시를 보존하면서도 보충을 피하는 편이 더 충실합니다. הוֹדַע의 사역 명령과 복수 ‘가증한 일들’은 적절히 반영되었습니다.
  naturalness: ‘인자야’와 ‘알리십시오’는 에스겔의 반복되는 신적 호칭 및 현대 합쇼체 명령으로 자연스럽습니다. ‘예루살렘에게 그녀의 가증한 일들을’은 지명과 대명사의 결합이 다소 문어적이지만, 본문의 의인화와 소유 접미사를 보존하는 절제된 표현입니다.
  terminology: ‘인자’, ‘예루살렘’, ‘가증한 일들’은 한국어 성경 문맥에서 안정적이며 원문의 강한 도덕적·언약적 비난을 충분히 전달합니다.
