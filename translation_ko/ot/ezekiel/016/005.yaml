source:
  edition: WLC
  text: לֹא חָ֨סָה עָלַ֜יִ/ךְ עַ֗יִן לַ/עֲשׂ֥וֹת לָ֛/ךְ אַחַ֥ת מֵ/אֵ֖לֶּה לְ/חֻמְלָ֣ה עָלָ֑יִ/ךְ וַֽ/תֻּשְׁלְכִ֞י אֶל פְּנֵ֤י הַ/שָּׂדֶה֙ בְּ/גֹ֣עַל נַפְשֵׁ֔/ךְ בְּ/י֖וֹם הֻלֶּ֥דֶת אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/005.yaml
  text: No eye pitied you enough to do for you even one of these things[a], to have compassion on you; instead, you were thrown out into the open field in loathing of your life on the day you were born.
  footnotes:
  - marker: a
    text: Or 'because your life was abhorred.' The Hebrew phrase בְּגֹעַל נַפְשֵׁךְ is compact and may be rendered more literally as an expression of abhorrence directed toward the newborn herself.
    reason: lexical_alternative
translation:
  language: ko
  text: 아무 눈도 너를 불쌍히 여기지 않아 이 중 한 가지라도 네게 해 주어 너를 불쌍히 여길 사람이 없었습니다. 오히려 너는 네 생명을 혐오하는 가운데, 네가 태어난 날 들판의 앞면에 내던져졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘네 생명이 혐오받는 가운데’에 가깝습니다. 히브리어 בְּגֹעַל נַפְשֵׁךְ는 신생아 자신을 향한 혐오와 경멸을 압축적으로 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא חָסָה עָלַיִךְ עַיִן
  english_pob_choice: No eye pitied you
  chosen_korean: 아무 눈도 너를 불쌍히 여기지 않아
  alternatives_korean:
  - 어느 눈도 너를 불쌍히 여기지 않아
  - 아무도 너를 불쌍히 여기지 않아
  lexicon: HALOT
  rationale: 히브리어의 ‘눈’이라는 의인화된 표현을 살리면서, 현대 한국어에서 자연스러운 ‘불쌍히 여기다’로 옮겼습니다.
- source_word: לַעֲשׂוֹת לָךְ אַחַת מֵאֵלֶּה
  english_pob_choice: to do for you even one of these things
  chosen_korean: 이 중 한 가지라도 네게 해 주어
  alternatives_korean:
  - 이것들 가운데 한 가지라도 네게 해 주어
  - 이 중 하나라도 네게 해 주어
  lexicon: HALOT
  rationale: 앞절의 돌봄 행위를 가리키는 표현이므로, ‘이 중 한 가지라도’로 최소한의 한 항목도 없었다는 뜻을 살렸습니다.
- source_word: בְּגֹעַל נַפְשֵׁךְ
  english_pob_choice: in loathing of your life
  chosen_korean: 네 생명을 혐오하는 가운데
  alternatives_korean:
  - 네 생명을 혐오하여
  - 네 생명에 대한 혐오 속에서
  - 네 생명이 혐오받는 가운데
  lexicon: HALOT
  rationale: נֶפֶשׁ를 여기서는 단순한 ‘목숨/생명’으로 보고, POB의 ‘loathing of your life’에 맞춰 혐오의 정서를 직접적으로 드러냈습니다.
- source_word: אֶל פְּנֵי הַשָּׂדֶה
  english_pob_choice: into the open field
  chosen_korean: 들판의 앞면에 내던져졌습니다
  alternatives_korean:
  - 들판으로 내던져졌습니다
  - 벌판 한가운데로 내던져졌습니다
  - 드러난 들판으로 내던져졌습니다
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지인 ‘들판의 פני/표면’을 보존해, 버려짐과 노출을 살리는 방향으로 옮겼습니다.
- source_word: וַתֻּשְׁלְכִי
  english_pob_choice: you were thrown out
  chosen_korean: 내던져졌습니다
  alternatives_korean:
  - 던져졌습니다
  - 버려졌습니다
  - 밖으로 내던져졌습니다
  lexicon: HALOT
  rationale: 수동적 폭력성과 방치의 이미지를 함께 살리기 위해 ‘내던져지다’를 선택했습니다.
theological_decisions:
- issue: 태어난 직후의 완전한 방치와 모멸을 어떻게 드러낼지
  chosen_reading: ‘아무 눈도… 불쌍히 여기지 않아’와 ‘내던져졌습니다’로, 신생아에 대한 전면적 무관심과 폭력적 버려짐을 직접적으로 표현했습니다.
  alternative_readings:
  - ‘아무도 너를 돌보지 않아’처럼 완화된 표현
  - ‘버려졌습니다’만으로 정리하는 표현
  rationale: 본문은 단순한 방치가 아니라 생명 자체를 경멸하는 수준의 버림을 말하므로, 완화하지 않고 원문의 충격을 보존하는 것이 필요합니다.
  doctrine_reference: Ezekiel 16:5의 상징적 출생 서술
