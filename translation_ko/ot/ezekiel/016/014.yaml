translation:
  language: ko
  text: 당신의 아름다움 때문에 네 명성이 여러 민족들 가운데 퍼져 나갔습니다. 이는 내가 당신에게 두른 내 영광으로 인해 그것이 완전했기 때문입니다. 주 하나님께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너의 이름이 민족들 가운데 나갔다’입니다. 즉, 명성이나 평판이 널리 퍼졌다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא / שֵׁם
  english_pob_choice: went out / fame
  chosen_korean: 명성이 … 퍼져 나갔습니다
  alternatives_korean:
  - 이름이 … 나갔습니다
  - 평판이 … 퍼져 나갔습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘이름이 나가다’ 관용구를 한국어에서 자연스럽게 풀어, 문자적 ‘이름’보다 의미상 핵심인 명성의 확산을 드러냈습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 여러 민족들 가운데
  alternatives_korean:
  - 민족들 가운데
  - 나라들 가운데
  - 이방 민족들 가운데
  lexicon: HALOT
  rationale: 문맥상 이스라엘 주변의 여러 민족을 가리키므로, 교회적 용례보다 중립적인 ‘민족들’을 택했습니다.
- source_word: בְּיָפְיֵךְ
  english_pob_choice: because of your beauty
  chosen_korean: 당신의 아름다움 때문에
  alternatives_korean:
  - 당신의 아름다움으로 인해
  - 당신의 아름다움 때문에
  - 당신의 아름다움으로
  lexicon: HALOT
  rationale: 전치사 ב의 원인적 용법을 분명히 살려, 명성이 퍼진 이유가 아름다움 때문임을 직접적으로 드러냈습니다.
- source_word: כָּלִיל בַּהֲדָרִי
  english_pob_choice: it was perfect through my splendor
  chosen_korean: 내가 당신에게 두른 내 영광으로 인해 그것이 완전했기 때문입니다
  alternatives_korean:
  - 내가 당신 위에 둔 내 영광으로 그것이 완전했기 때문입니다
  - 내가 당신에게 베푼 내 위엄으로 그것이 완전했기 때문입니다
  lexicon: HALOT
  rationale: כָּלִיל은 ‘완전한/온전한’의 뜻을, הָדָר은 ‘영광/위엄/아름다움’의 뜻을 가지므로, 하나님이 입히신 장식적·왕적 영광이라는 이미지를 살려 옮겼습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님께서 말씀하십니다
  alternatives_korean:
  - 주 하나님께서 선포하십니다
  - 주 야훼께서 말씀하십니다
  - 주 하나님의 말씀이십니다
  lexicon: HALOT
  rationale: 예언적 선언 공식을 현대 한국어에서 자연스러운 종결로 옮겼고, יְהוִה는 본문 전체의 번역 관례에 따라 ‘주 하나님’으로 처리했습니다.
theological_decisions:
- issue: 야훼/주 하나님 표기 선택
  chosen_reading: 본문은 ‘주 하나님’으로 번역하고, 예언자적 선언 공식은 한국어 독자가 즉시 인식할 수 있게 유지했습니다.
  alternative_readings:
  - 주 야훼
  - 주 하나님
  rationale: 이 절은 אנדרדוני יְהוִה의 고정 공식으로 끝나므로, 한국어 본문에서는 가독성과 일관성을 위해 ‘주 하나님’이 가장 안정적입니다.
  doctrine_reference: POB Korean naming convention for YHWH in this verse
