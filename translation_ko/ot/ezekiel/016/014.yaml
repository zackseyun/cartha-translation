translation:
  language: ko
  text: 너의 아름다움 때문에 네 명성이 민족들 가운데 퍼져 나갔습니다. 내가 네게 입힌 나의 영화로 네 아름다움이 완전했기 때문입니다. 주 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
