id: EZK.16.57
reference: Ezekiel 16:57
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/טֶרֶם֮ תִּגָּלֶ֣ה רָעָתֵ/ךְ֒ כְּמ֗וֹ עֵ֚ת חֶרְפַּ֣ת בְּנוֹת אֲרָ֔ם וְ/כָל סְבִיבוֹתֶ֖י/הָ בְּנ֣וֹת פְּלִשְׁתִּ֑ים הַ/שָּׁאט֥וֹת אוֹתָ֖/ךְ מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/057.yaml
  text: before your wickedness was uncovered[a], as at the time of the reproach of the daughters of Aram and all those around her, the daughters of the Philistines[c][b], who despise you from every side.
  footnotes:
  - marker: a
    text: Or 'was revealed' or 'was exposed' for 'was uncovered.'
    reason: lexical_alternative
  - marker: b
    text: '''Aram'' is traditionally rendered ''Syria.'' The Hebrew reads ''daughters of Aram.'''
    reason: alternative_reading
  - marker: c
    text: '''The daughters of the Philistines'' is a Hebrew idiom for the Philistine people or cities.'
    reason: cultural_note
translation:
  language: ko
  text: 네 수치가 드러나기 전에는, 아람의 딸들과 그 둘레에 있는 모든 자, 곧 네 주변의 블레셋 딸들이 네게서 받던 수치와 같았습니다. 그들은 사방에서 너를 업신여겼습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘드러나기’는 히브리어 nifal의 공개적 노출 이미지를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 전통적 번역의 ‘시리아’가 아니라 ‘아람’을 읽습니다.
    reason: alternative_reading
  - marker: c
    text: ‘블레셋의 딸들’은 블레셋 사람들/도시들을 가리키는 셈어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּטֶרֶם ... תִּגָּלֶה
  english_pob_choice: before ... was uncovered
  chosen_korean: '...드러나기 전에는'
  alternatives_korean:
  - '...밝혀지기 전에'
  - '...폭로되기 전에'
  lexicon: HALOT
  rationale: תִּגָּלֶה의 수동적 ‘드러남/노출됨’ 이미지를 살리면서, 한국어에서는 자연스럽게 ‘드러나기 전’으로 옮기는 것이 가장 간결합니다.
- source_word: רָעָתֵךְ
  english_pob_choice: your wickedness
  chosen_korean: 네 수치
  alternatives_korean:
  - 네 악함
  - 네 악행
  lexicon: HALOT
  rationale: 문맥상 단순한 도덕적 악보다 공개적 수치와 치욕의 드러남이 강조되므로, 직전 절의 수치 어휘와 맞물리게 ‘네 수치’로 옮겼습니다.
- source_word: חֶרְפַּת ... בְּנוֹת אֲרָם ... בְּנוֹת פְּלִשְׁתִּים
  english_pob_choice: the reproach of the daughters of Aram ... the daughters of the Philistines
  chosen_korean: 아람의 딸들 ... 블레셋 딸들
  alternatives_korean:
  - 아람 사람들 ... 블레셋 사람들
  - 아람의 여자들 ... 블레셋의 여자들
  lexicon: HALOT
  rationale: 히브리어의 ‘딸들’ 관용구를 유지해 집단/도시들을 가리키는 표현을 보존했습니다. ‘블레셋’은 표준적 음역을 따랐습니다.
- source_word: הַשָּׁאטוֹת אוֹתָךְ
  english_pob_choice: who despise you
  chosen_korean: 너를 업신여겼습니다
  alternatives_korean:
  - 너를 멸시합니다
  - 너를 깔봅니다
  lexicon: HALOT
  rationale: שׁאט의 경멸·경시 의미를 한국어의 ‘업신여기다’로 옮기면, 단순 조롱보다 지속적 경멸의 뉘앙스를 더 잘 살릴 수 있습니다.
theological_decisions:
- issue: 문장 앞부분의 비교 구조와 수치의 대상
  chosen_reading: ‘네 수치가 드러나기 전’으로 시작해, 이어지는 ‘아람의 딸들... 블레셋 딸들’과의 비교가 공개적 수치의 맥락임을 드러냈습니다.
  alternative_readings:
  - ‘네 악이 드러나기 전’
  - ‘네 악행이 폭로되기 전’
  rationale: 문맥 전체가 예루살렘의 치욕과 수치의 공개를 말하므로, 한국어에서는 ‘악’보다 ‘수치’가 독자에게 본문의 수치-수치 비교를 더 분명히 전달합니다.
  doctrine_reference: Ezekiel 16의 수치/심판 표상
- issue: ‘딸들’ 관용구의 처리
  chosen_reading: 민족/도시 집단을 가리키는 셈어 관용구를 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 의역하여 ‘아람 사람들’과 ‘블레셋 사람들’
  rationale: 이 절의 표현은 단순한 여성 개인이 아니라 집단적 조롱의 표지이므로, 관용구를 보존해 본문의 사회-역사적 강도를 살렸습니다.
  doctrine_reference: 구약 시가·예언서의 관용 표현
