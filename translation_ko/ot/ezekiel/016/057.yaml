  source_fidelity: 수정이 필요합니다. רָעָתֵךְ는 ‘네 악/악행’이지 ‘네 수치’가 아니며, 원문의 ‘아람의 딸들’과 ‘블레셋의 딸들’은 예루살렘을 업신여기는 주변 집단으로 제시됩니다. 초안의 ‘그들이 네게서 받던 수치’는 수치의 방향을 뒤집고 원문에 없는 내용을 더합니다.
  naturalness: 초안의 ‘네 수치가 드러나기 전에는 … 수치와 같았습니다’는 무엇과 무엇이 같은지 불명확하며 의미 연결도 자연스럽지 않습니다. 원문의 비교적·시간적 표현이 문맥 의존적이라는 점을 고려하여, 한국어에서는 ‘치욕을 당하던 때처럼 그러하였습니다’로 보완하되 주변 집단의 경멸을 명확히 나타내는 것이 안전합니다.
  terminology: רָעָה는 예언자적 고발 문맥에서 ‘악’으로 옮기는 것이 적절합니다. ‘아람’, ‘블레셋’, 그리고 집단·도시를 가리키는 관용적 ‘딸들’은 유지할 수 있습니다. הַשָּׁאטוֹת는 완료형 ‘업신여겼습니다’보다 지속성을 드러내는 ‘업신여기는’이 적합합니다.
