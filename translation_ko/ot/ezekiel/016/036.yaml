  - severity: high
    issue: ‘네 가증한 우상들 가운데 모든 우상들’의 구조와 의미 오류
    rationale: 원문은 ‘네 가증함들의 모든 우상들’이라는 명사구이며, ‘가운데’라는 공간적 관계나 우상의 중복을 말하지 않습니다.
  - severity: medium
