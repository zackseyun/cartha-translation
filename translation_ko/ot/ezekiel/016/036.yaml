- from: 주 하나님께서 이렇게 말씀하십니다. “네 재물이 쏟아졌고[a], 네 음부가 네 음행들 가운데서 네 연인들과 함께 드러났으며, 네 가증한 우상들 가운데 모든 우상들 때문이요[b], 또 네가 그들에게 준 네 자녀들의 피 때문입니다[c].”
  to: 주 여호와께서 이렇게 말씀하십니다. “이는 네 청동이 쏟아지고[a], 네 연인들과 음행할 때에 네 벌거벗음이 드러났으며, 네 모든 가증한 우상들 때문이고[b], 또 네가 그들에게 준 네 자녀들의 피 때문입니다[c].”
  rationale: 원문의 어휘적 모호성과 영어 POB의 본문 선택을 보존하기 위해 ‘청동’을 본문에 유지하고, ‘재물’ 해석은 주석으로 옮겼습니다. 성적 수치의 관용어는 ‘벌거벗음’으로, 우상 관련 명사구는 현대 한국어에 자연스럽고 원문 의미를 보존하는 ‘네 모든 가증한 우상들’로 바로잡았습니다. 인과 관계는 절 단독 번역에서도 완결되도록 합쇼체로 구성했습니다.
  reviewer_model: gpt-5.6-terra
