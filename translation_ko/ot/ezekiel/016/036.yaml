id: EZK.16.36
reference: Ezekiel 16:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהֹוִ֗ה יַ֣עַן הִשָּׁפֵ֤ךְ נְחֻשְׁתֵּ/ךְ֙ וַ/תִּגָּלֶ֣ה עֶרְוָתֵ֔/ךְ בְּ/תַזְנוּתַ֖יִ/ךְ עַל מְאַהֲבָ֑יִ/ךְ וְ/עַל֙ כָּל גִּלּוּלֵ֣י תוֹעֲבוֹתַ֔יִ/ךְ וְ/כִ/דְמֵ֣י בָנַ֔יִ/ךְ אֲשֶׁ֥ר נָתַ֖תְּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/036.yaml
  text: 'Thus says the Lord GOD: Because your bronze was poured out[a], and your nakedness was uncovered in your prostitutions with your lovers, and because of all the idols of your abominations, and because of the blood of your children whom you gave to them[c][b],'
  footnotes:
  - marker: a
    text: Or possibly 'your wealth was poured out'; the Hebrew 'your bronze' may function metaphorically for wealth lavished on illicit lovers, and some take it more broadly as a figure for lewd exposure.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the idols of your abominations'; that is, your detestable idols.
    reason: lexical_alternative
  - marker: c
    text: That you gave to them, i.e., in child sacrifice to idols.
    reason: cultural_note
translation:
  language: ko
  text: 주 여호와께서 이렇게 말씀하십니다. “이는 네 청동이 쏟아지고[a], 네 연인들과 음행할 때에 네 벌거벗음이 드러났으며, 네 모든 가증한 우상들 때문이고[b], 또 네가 그들에게 준 네 자녀들의 피 때문입니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘네 청동’ 또는 ‘네 놋’입니다. 문맥상 연인들에게 탕진한 재물이나 부를 비유적으로 가리킨다고 보기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘네 가증함들의 모든 우상들’입니다. 곧 네 모든 혐오스러운 우상들을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 문맥상 우상들에게 자녀를 바친 일을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי יְהֹוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 하나님께서
  lexicon: HALOT
  rationale: 히브리어의 주권 호칭 결합을 한국어에서 자연스럽게 살리되, 야훼를 본문에서 직접 노출하지 않고도 경고 발화의 장엄함을 유지하기 위해 ‘주 하나님’으로 옮겼습니다.
- source_word: נְחֻשְׁתֵּךְ
  english_pob_choice: your bronze
  chosen_korean: 네 재물
  alternatives_korean:
  - 네 놋
  - 네 청동
  - 네 부
  lexicon: HALOT
  rationale: POB의 영어 본문은 비유 가능성을 주석으로 열어 두지만, 최신 교정에서는 문맥상 금전적·소모적 의미를 더 강하게 반영합니다. 한국어에서는 ‘네 재물’이 이 문맥의 수치와 낭비를 가장 자연스럽게 전달합니다.
- source_word: וַתִּגָּלֶה עֶרְוָתֵךְ
  english_pob_choice: your nakedness was uncovered
  chosen_korean: 네 음부가 드러났으며
  alternatives_korean:
  - 네 벌거벗음이 드러났으며
  - 네 수치가 드러났으며
  lexicon: HALOT
  rationale: 직역적 ‘벌거벗음’도 가능하지만, 예언서의 성적 수치 맥락에서 ‘음부’가 히브리어의 신체·수치 이미지를 더 직접적으로 전달합니다.
- source_word: בְּתַזְנוּתַיִךְ
  english_pob_choice: in your prostitutions
  chosen_korean: 네 음행들 가운데서
  alternatives_korean:
  - 네 창녀 행위들 가운데서
  - 네 매춘들 가운데서
  - 네 음행 가운데
  lexicon: HALOT
  rationale: 복수형의 반복적 행위를 살리면서도 현대 한국어에서 지나치게 노골적이거나 어색하지 않도록 ‘음행들 가운데서’로 옮겼습니다.
- source_word: גִּלּוּלֵי תוֹעֲבוֹתַיִךְ
  english_pob_choice: the idols of your abominations
  chosen_korean: 네 가증한 우상들 가운데 모든 우상들
  alternatives_korean:
  - 네 가증한 우상들
  - 네 혐오스러운 우상들
  - 네 우상들의 가증함
  lexicon: HALOT
  rationale: גִּלּוּלִים의 멸시적 뉘앙스를 ‘우상들’로 살리고, תּוֹעֵבָה의 도덕적 혐오를 ‘가증한’으로 반영했습니다. 한국어에서는 ‘그 우상들’보다 반복 강조가 드러나도록 구조를 약간 풀었습니다.
- source_word: אֲשֶׁר נָתַתְּ לָהֶם
  english_pob_choice: whom you gave to them
  chosen_korean: 네가 그들에게 준
  alternatives_korean:
  - 네가 그들에게 바친
  - 네가 그들에게 내준
  - 네가 그들에게 희생으로 준
  lexicon: HALOT
  rationale: 히브리어 동사 ‘주다’를 그대로 살리되, 문맥상 자녀 희생을 떠올리게 하는 표현은 본문이 허용하는 범위에서만 주석으로 남기기 위해 ‘준’으로 유지했습니다.
theological_decisions:
- issue: נְחֻשְׁתֵּךְ의 해석 범위
  chosen_reading: 본문은 ‘네 재물’로 옮겨 문맥상 비유적 축재·낭비의 의미를 드러내되, 히브리어의 물질적 어감을 완전히 지우지 않도록 했습니다.
  alternative_readings:
  - 네 놋
  - 네 청동
  - 네 부
  rationale: 히브리어는 문자적으로 ‘놋/청동’이지만, 이 절의 고발 문맥에서는 재산을 탕진한 비유로 읽는 해석이 강합니다. 한국어 본문에서는 그 해석을 과도하게 확정하지 않으면서도 현대 독자가 이해할 수 있는 방향을 택했습니다.
  doctrine_reference: 번역 원칙 §1, §3
- issue: 자녀의 피와 인신제사 암시
  chosen_reading: ‘네가 그들에게 준 네 자녀들의 피’로 옮겨, 본문이 직접 말하는 ‘주다’를 보존하면서도 문맥이 암시하는 우상에게 바친 자녀 희생을 주석 없이 본문에 과잉 삽입하지 않았습니다.
  alternative_readings:
  - 네가 그들에게 바친 네 자녀들의 피
  - 네가 그 우상들에게 희생한 네 자녀들의 피
  rationale: 본문은 희생 제의의 결과를 고발하지만, 히브리어 표면형은 ‘주었다’입니다. 번역은 텍스트의 표현을 보존하고, 해석은 독자에게 열어 두는 쪽이 더 정직합니다.
  doctrine_reference: 번역 원칙 §1, §5
