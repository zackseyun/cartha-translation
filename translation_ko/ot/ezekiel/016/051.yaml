- from: 사마리아도 당신의 죄의 절반만큼도 죄를 짓지 않았습니다. 당신은 그들보다 더 많은 가증한 일들을 저질렀고, 당신이 저지른 모든 가증한 일들로 말미암아 당신의 자매들을 의롭게 보이게 했습니다.[a]
