id: EZK.16.51
reference: Ezekiel 16:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שֹׁ֣מְר֔וֹן כַּ/חֲצִ֥י חַטֹּאתַ֖יִ/ךְ לֹ֣א חָטָ֑אָה וַ/תַּרְבִּ֤י אֶת תּוֹעֲבוֹתַ֨יִ/ךְ֙ מֵ/הֵ֔נָּה וַ/תְּצַדְּקִי֙ אֶת אחות/ך בְּ/כָל תּוֹעֲבוֹתַ֖יִ/ךְ אֲשֶׁ֥ר עשיתי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/051.yaml
  text: And Samaria did not sin half as much as you; you multiplied your abominations more than they[a], and by all your abominations that you committed, you made your sisters appear righteous.
  footnotes:
  - marker: a
    text: Or 'you justified your sisters.' The Hebrew can be rendered more literally this way, but the sense in context is that Jerusalem's greater wickedness made them seem righteous by comparison.
    reason: lexical_alternative
translation:
  language: ko
  text: 사마리아도 당신의 죄의 절반만큼도 죄를 짓지 않았습니다. 당신은 그들보다 더 많은 가증한 일들을 저질렀고, 당신이 저지른 모든 가증한 일들로 말미암아 당신의 자매들을 의롭게 보이게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 자매들을 의롭다 하셨습니다.’ 히브리어는 더 문자적으로 이렇게 옮길 수 있지만, 문맥상 의미는 예루살렘의 더 큰 악이 비교상 그들을 의롭게 보이게 했다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמְרוֹן
  english_pob_choice: Samaria
  chosen_korean: 사마리아
  alternatives_korean:
  - 사마리아 성
  - 사마리아(사마리아 지역)
  lexicon: HALOT
  rationale: 고유 지명으로서 현대 표기인 사마리아가 자연스럽고, 문맥상 북왕국의 도시/지역을 가리키는 인격화된 이름으로 읽힙니다.
- source_word: כַּחֲצִי חַטֹּאתַיִךְ
  english_pob_choice: did not sin even half as much as you
  chosen_korean: 당신의 죄의 절반만큼도 죄를 짓지 않았습니다
  alternatives_korean:
  - 당신의 죄의 반도 짓지 않았습니다
  - 당신만큼 절반도 죄를 짓지 않았습니다
  lexicon: HALOT
  rationale: 비교구문을 한국어로 자연스럽게 옮기기 위해 ‘절반만큼도’로 처리했고, חטא의 도덕적 맥락을 살려 ‘죄를 짓다’로 옮겼습니다.
- source_word: תּוֹעֲבוֹתַיִךְ
  english_pob_choice: your abominations
  chosen_korean: 가증한 일들
  alternatives_korean:
  - 가증한 행위들
  - 혐오스러운 일들
  lexicon: HALOT
  rationale: 예언서의 강한 종교·도덕적 질감을 유지하기 위해 ‘가증한 일들’을 택했고, 복수성을 살리기 위해 복수형으로 옮겼습니다.
- source_word: וַתְּצַדְּקִי אֶת אֲחוֹתַיִךְ
  english_pob_choice: you made your sisters appear righteous
  chosen_korean: 당신의 자매들을 의롭게 보이게 했습니다
  alternatives_korean:
  - 당신의 자매들을 의롭다 하셨습니다
  - 당신의 자매들을 의롭다고 보이게 했습니다
  lexicon: HALOT
  rationale: צדק의 이곳 용법은 실제 의롭다 선언이 아니라 비교상 ‘의롭게 보이게 함’이므로, POB의 해석을 반영해 오해를 줄이면서도 본문의 역설을 유지했습니다.
theological_decisions:
- issue: ‘의롭게 하다/의롭다 하다’의 의미 범위
  chosen_reading: 실제적인 법정적 의롭다 선언이 아니라, 예루살렘의 더 큰 악이 사마리아와 다른 자매들을 상대적으로 의롭게 보이게 하는 비교적 표현으로 읽었습니다.
  alternative_readings:
  - 당신의 자매들을 의롭다 하셨습니다
  - 당신의 자매들을 의롭게 하셨습니다
  rationale: 문맥상 하나님 앞에서의 선언이 아니라 충격적인 비교 수사이므로, 신학적 오독을 피하면서 원문의 역설을 보존해야 합니다.
  doctrine_reference: 원어 우선과 문맥 의미 보존
- issue: ‘자매들’의 복수성
  chosen_reading: 문맥상 사마리아와 소돔을 가리키는 복수 ‘자매들’로 옮겼습니다.
  alternative_readings:
  - 당신의 자매
  - 당신의 자매들(도시들)
  rationale: 히브리어 형태와 문맥상 복수 개념이 요구되므로, 한국어에서도 복수로 드러내는 것이 정확합니다.
  doctrine_reference: 문맥 우선 번역 원칙
