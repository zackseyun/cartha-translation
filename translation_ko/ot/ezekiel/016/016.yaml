  text: וַ/תִּקְחִ֣י מִ/בְּגָדַ֗יִ/ךְ וַ/תַּֽעֲשִׂי לָ/ךְ֙ בָּמ֣וֹת טְלֻא֔וֹת וַ/תִּזְנִ֖י עֲלֵי/הֶ֑ם לֹ֥א בָא֖וֹת וְ/לֹ֥א יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/016.yaml
  text: You took some of your garments and made for yourself colorful high places[a], and you prostituted yourself on them—such things should not come[b], nor should they be.
  footnotes:
  - marker: a
    text: Or 'patched high places,' 'variegated high places,' or 'multi-colored shrines.' The Hebrew adjective is difficult and likely refers to the decorated appearance made from the garments.
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult Hebrew. It may mean 'such things should not happen,' or more literally, 'they should not come, and it should not be.'
    reason: alternative_reading
translation:
  language: ko
  text: 당신은 당신의 옷들 가운데 일부를 가져다가, 색색으로 꾸민 산당들을 만들었습니다[a]. 그리고 그 위에서 음행했습니다. 그런 일들이 일어나서는 안 되며[b], 그런 일이 있어서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘덧댄 산당들’, ‘무늬 있는 산당들’, ‘다색의 신당들’로 옮길 수 있습니다. 히브리어 형용사는 난해하며, 옷으로 꾸민 장식적 또는 여러 색의 외형을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 난해한 히브리어입니다. ‘그런 일들이 일어나서는 안 되며, 그런 일이 있어서는 안 된다’는 뜻일 수 있습니다. 더 직역하면 ‘그것들은 오지 말아야 하며, 그것은 있어서는 안 된다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְחִי מִבְּגָדַיִךְ
  english_pob_choice: You took some of your garments
  chosen_korean: 당신은 자기 옷들 가운데서 몇 벌을 가져다가
  alternatives_korean:
  - 당신은 옷들에서 일부를 가져다가
  - 당신은 당신의 옷들 중 몇 벌을 가져다가
  lexicon: HALOT
  rationale: 미분사적 ‘מן’의 부분적 의미를 살려 단순한 ‘옷을 가져갔다’보다 ‘가운데서 몇 벌을’로 옮겼습니다.
- source_word: בָּמוֹת טְלֻא֔וֹת
  english_pob_choice: colorful high places
  chosen_korean: 칠색 높은 곳들
  alternatives_korean:
  - 색색의 높은 곳들
  - 무늬 있는 높은 곳들
  - 알록달록한 산당들
  lexicon: HALOT
  rationale: טְלֻאוֹת는 험하게 ‘patched’만으로 고정하기 어려워, 장식적·다채로운 외형을 드러내는 방향으로 ‘칠색’으로 처리했습니다. ‘높은 곳들’은 בָּמוֹת의 직역을 유지했습니다.
- source_word: וַתִּזְנִי עֲלֵיהֶם
  english_pob_choice: you prostituted yourself on them
  chosen_korean: 그 위에서 몸을 팔았습니다
  alternatives_korean:
  - 그 위에서 음행했습니다
  - 그 위에서 창기짓을 했습니다
  lexicon: HALOT
  rationale: זנה의 노골적 비유를 약화하지 않되 현대 한국어에서 자연스럽게 읽히도록 ‘몸을 팔다’로 옮겼습니다.
- source_word: לֹא בָאוֹת וְלֹא יִהְיֶה
  english_pob_choice: such things should not come, nor should they be
  chosen_korean: 그런 일은 오면 안 되고, 있어서는 안 됩니다
  alternatives_korean:
  - 그런 일은 와서는 안 되고, 있어서는 안 됩니다
  - 그런 일은 생기면 안 되고, 있어서는 안 됩니다
  lexicon: HALOT
  rationale: 끝절의 난해한 히브리어를 과도하게 해석하지 않고, 금지·부당성의 뉘앙스를 살려 ‘오면 안 되고, 있어서는 안 됩니다’로 번역했습니다.
theological_decisions:
- issue: 예언서의 성적 비유를 완화할지 여부
  chosen_reading: ‘몸을 팔다’로 유지하여 언약 불신실함을 드러내는 노골적 비유를 보존했습니다.
  alternative_readings:
  - ‘불성실했다’처럼 완화된 표현
  - ‘음행했다’로 더 직설적으로 처리
  rationale: 에스겔은 우상숭배를 충격적인 성적 은유로 고발하므로, 완화하면 예언적 수사의 강도가 약해집니다. 한국어에서는 현대적이면서도 노골성이 유지되는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 6
