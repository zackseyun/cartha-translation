revisions:
- from: 당신은 자기 옷들 가운데서 몇 벌을 가져다가, 칠색 높은 곳들을 만들었습니다[a]. 그리고 그 위에서 몸을 팔았습니다. 그런 일은 오면 안 되고[b], 있어서는 안 됩니다.
  to: 당신은 당신의 옷들 가운데 일부를 가져다가, 색색으로 꾸민 산당들을 만들었습니다[a]. 그리고 그 위에서 음행했습니다. 그런 일들이 일어나서는 안 되며[b], 그런 일이 있어서는 안 됩니다.
  rationale: 원문의 어휘 범위를 넘는 ‘칠색’을 제거하고, בָּמוֹת의 제의적 의미를 ‘산당’으로 명확히 했습니다. זנה의 강한 예언적 성적 은유는 유지하되 문자적 성매매로 협소화될 수 있는 표현 대신 ‘음행했습니다’를 사용했습니다. 마지막 난해한 절은 본문에서 자연스럽게 옮기고, 원문의 문자적이고 불규칙한 표현 가능성은 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
