  rationale: 예언자적 호명에서의 2인칭 여성 단수 명령을 표준어 합쇼체 명령으로 옮겨, 공적 경고의 어조를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
