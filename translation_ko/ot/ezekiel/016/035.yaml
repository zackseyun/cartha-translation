    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 그런즉
  lexicon: HALOT
  rationale: 앞선 책망을 근거로 한 결론을 자연스럽게 여는 접속사로, 원문의 논리적 연결을 간결하게 살렸습니다.
- source_word: זוֹנָה
