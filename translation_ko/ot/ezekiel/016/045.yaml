  text: 당신은 자기 남편과 자녀들을 혐오한 당신 어머니의 딸이며[a], 자기 남편들과 자녀들을 혐오한 당신 자매들의 자매입니다. 당신의 어머니는 헷 사람이고 당신의 아버지는 아모리 사람입니다.
  philosophy: optimal-equivalence
  footnotes:
