translation:
  language: ko
  text: 그때에 내가 너를 물로 씻고[a], 네 몸에 묻은 피를 씻어 내고[b], 기름을 발라 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물로 목욕시켰다’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면, ‘네 위에 있는 피를 씻어 냈다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְחָצֵךְ
  english_pob_choice: I washed you
  chosen_korean: 내가 너를 물로 씻고
  alternatives_korean:
  - 내가 너를 목욕시키고
  - 내가 너를 씻어 주고
  lexicon: HALOT
  rationale: רחץ의 기본 의미를 살리면서 한국어로 가장 자연스러운 동작 표현인 '씻고'를 택했습니다. 영어 POB의 'washed you'와도 직접 대응합니다.
- source_word: בַּמַּיִם
  english_pob_choice: with water
  chosen_korean: 물로
  alternatives_korean:
  - 물로써
  - 물 안에서
  lexicon: HALOT
  rationale: 히브리어 ב의 도구/수단 용법을 한국어 조사 '로'로 옮기면, 씻는 수단이라는 의미가 가장 자연스럽게 드러납니다.
- source_word: וָאֶשְׁטֹף דָּמַיִךְ מֵעָלַיִךְ
  english_pob_choice: rinsed your blood off you
  chosen_korean: 네 피를 너에게서 씻어 내고
  alternatives_korean:
  - 네 피를 너에게서 헹궈 내고
  - 네 피를 네 위에서 씻어 내고
  lexicon: HALOT
  rationale: שטף는 ‘씻어 내다/헹구다’의 물리적 제거를 가리키므로, '씻어 내고'가 영어 POB의 'rinsed ... off you'를 가장 잘 반영합니다. '너에게서'는 'from upon you'의 몸에 붙은 것을 제거하는 이미지를 살립니다.
- source_word: וָאֲסֻכֵךְ בַּשָּׁמֶן
  english_pob_choice: anointed you with oil
  chosen_korean: 기름을 발라 주었습니다
  alternatives_korean:
  - 기름을 부어 주었습니다
  - 기름으로 너를 바르고
  lexicon: HALOT
  rationale: סוך는 의례적 '기름부음'도 가능하지만, 이 절의 문맥은 상처 입고 더럽혀진 몸을 돌보는 실제 행위에 가깝기 때문에 '기름을 발라 주었습니다'가 과도한 종교적 해석을 덜어 주면서도 돌봄의 뜻을 살립니다.
theological_decisions:
- issue: 이 절의 씻음과 기름 바름의 성격
  chosen_reading: 본문의 비유적 배경을 유지하되, 번역 자체는 실제 신체적 돌봄의 동작처럼 구체적으로 표현했습니다.
  alternative_readings:
  - 언약적 정결 예식이나 성례적 의미를 암시하는 표현으로 옮김
  rationale: 에스겔 16장은 예루살렘을 버려진 아이에 비유한 확장 비유이므로, 번역은 상징 해석을 덧붙이기보다 본문의 구체적 이미지를 보존하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
