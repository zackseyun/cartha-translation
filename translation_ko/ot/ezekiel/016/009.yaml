  rationale: 수정문은 רחץ의 ‘씻다’, שטף의 씻어 제거하는 동작, מֵעָלַיִךְ의 몸 표면에 붙어 있던 피라는 이미지를 자연스러운 현대 한국어로 보존합니다. 마지막 동작은 원문의 기름 바름을 그대로 유지하며, 비유의 신체적 돌봄 묘사에 별도의 교리적 해석을 더하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:40:33Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 세 동작(물로 씻음, 몸 위의 피를 씻어 냄, 기름을 바름)은 대체로 충실히 옮겼습니다. 다만 ‘네 피를 너에게서’는 한국어에서 피의 소유자를 지나치게 전면화하여 부자연스럽고, מֵעָלַיִךְ(‘네 위에서/네 몸에서’)의 표면 부착 이미지를 충분히 자연스럽게 드러내지 못합니다.
  naturalness: ‘네 몸에 묻은 피를 씻어 내고’가 현대 표준어에서 자연스럽고, 본문의 구체적인 신체 돌봄 이미지를 보존합니다. 각주 표지도 해당 어구 바로 뒤에 두어 참조 관계를 명확히 했습니다.
  terminology: ‘기름을 발라 주었습니다’는 סוך의 몸에 기름을 바르는 행위를 자연스럽게 나타내며, 본문에 없는 의례적·교리적 의미를 강요하지 않습니다. ‘목욕시켰다’와 직역적 대안은 각주로 유지합니다.
  issues:
  - severity: medium
    issue: ‘네 피를 너에게서 씻어 내고’라는 표현
    rationale: 한국어에서는 ‘네 피’가 혈연·생명으로서의 소유 관계를 강하게 환기하고 ‘너에게서’도 제거의 표면 위치를 어색하게 처리합니다. 원문의 ‘네 위에 있는 피’를 자연스럽게 나타내려면 ‘네 몸에 묻은 피’가 적절합니다.
