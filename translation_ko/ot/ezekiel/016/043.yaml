  source_fidelity: 첫 절의 인과관계와 ‘네 길을 네 머리 위에 두다’라는 보응의 비유는 유지되어야 합니다. 그러나 말미의 히브리어는 본문 전승과 형태 해석이 어려운 구절이며, 통상적으로는 미래/결과의 뜻(‘더는 … 행하지 않을 것이다’)으로 이해됩니다. 현 번역의 완료 부정(‘행하지도 아니하였음이니라’)은 이 문맥에 맞지 않습니다.
  naturalness: 현 번역은 ‘주 하나님께서 말씀하시기를 … 하셨나니’처럼 간접화법과 종결 표현이 겹쳐 현대 한국어로 매우 부자연스럽고, ‘당신’은 하나님이 예루살렘을 책망하는 직접 호칭으로 어색합니다. 현대적이면서도 본문의 예언적 문체에 맞게 직접 인용으로 정리했습니다.
  terminology: אֲדֹנָי יְהוִה는 ‘주 여호와’로, תּוֹעֵבוֹת은 ‘가증한 일들’로, זִמָּה는 이 문맥에서 ‘음란한 일’로 옮겼습니다. ‘길을 머리에 두다’는 문자적으로 남기기보다 한국어에서 의미가 드러나는 보응 표현인 ‘행위의 대가를 머리 위에 돌려주다’로 옮겼습니다.
