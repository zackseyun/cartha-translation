    text: 또는, “네가 네 모든 가증한 일에 더하여 이 음란한 일을 행하지 않을 것이다.” 말미의 히브리어 구절은 해석이 어렵습니다. 어떤 이들은 이를 예루살렘의 음란함이 모든 가증한 일들과 함께, 또는 그 위에 더해져 행해졌다는 뜻으로 이해합니다.
