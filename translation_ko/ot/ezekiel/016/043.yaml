  text: Because you did not remember the days of your youth[a], but enraged me with all these things, therefore I also have put your way on your own head, declares the Lord GOD, and you have not committed lewdness beyond all your abominations.
  footnotes:
  - marker: a
    text: Or, 'and you did not do this lewdness in addition to all your abominations.' The Hebrew of the final clause is difficult, and some take it as saying Jerusalem's lewdness was committed along with, or on top of, all her abominations.
    reason: alternative_reading
translation:
  language: ko
  text: 네가 젊었을 때의 날들을 기억하지 않고 이 모든 일로 나를 격노하게 하였으므로, 보라, 나도 네 행위의 대가를 네 머리 위에 돌려주었다. 주 여호와의 말이다. 그러므로 네가 네 모든 가증한 일에 더하여 이 음란한 일을 다시는 행하지 않을 것이다.[a]
  philosophy: optimal-equivalence
  footnotes:
