id: EZK.16.17
reference: Ezekiel 16:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּקְחִ֞י כְּלֵ֣י תִפְאַרְתֵּ֗/ךְ מִ/זְּהָבִ֤/י וּ/מִ/כַּסְפִּ/י֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ֔/ךְ וַ/תַּעֲשִׂי לָ֖/ךְ צַלְמֵ֣י זָכָ֑ר וַ/תִּזְנִי בָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/017.yaml
  text: You took your beautiful jewels from my gold and my silver[a], which I had given to you, and made for yourself male images[c][b], and you prostituted yourself with them.
  footnotes:
  - marker: a
    text: Or 'your splendid ornaments' or 'your beautiful articles.' The Hebrew term can refer broadly to objects or articles, but here likely means ornamental items made from precious metals.
    reason: lexical_alternative
  - marker: b
    text: Or 'male idols' or 'images in the form of males.'
    reason: alternative_reading
  - marker: c
    text: The expression 'prostituted yourself' renders a recurring prophetic metaphor for covenant unfaithfulness expressed through idolatry.
    reason: cultural_note
translation:
  language: ko
  text: 당신은 내가 당신에게 준 나의 금과 은으로 된 당신의 아름다운 장식품들[a]을 가져다가, 자신을 위하여 남성 형상들[b]을 만들고, 그것들과 음행하였습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 화려한 장식품들’ 또는 ‘당신의 아름다운 물건들’. 히브리어는 넓게 물건이나 기구를 가리킬 수 있으나, 여기서는 금과 은으로 된 장식물을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘남성 우상들’ 또는 ‘남성의 형상들’.
    reason: alternative_reading
  - marker: c
    text: ‘음행하였습니다’는 우상숭배로 드러난 언약에 대한 불충실을 가리키는 예언서의 반복적 은유를 옮긴 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  english_pob_choice: your beautiful jewels
  chosen_korean: 네 아름다운 보석들
  alternatives_korean:
  - 네 화려한 장식품들
  - 네 아름다운 장식들
  - 네 빛나는 물건들
  lexicon: HALOT
  rationale: כְּלִי는 넓게 물건/기구/그릇을 가리키지만, 여기서는 금과 은으로 된 장식물을 뜻하므로 ‘보석들’이 자연스럽고, תִפְאַרְתֵּךְ의 아름다움/화려함도 함께 살립니다.
- source_word: מִזְּהָבִי וּמִכַּסְפִּי
  english_pob_choice: from my gold and my silver
  chosen_korean: 내 금과 내 은에서
  alternatives_korean:
  - 내 금과 내 은으로부터
  - 내 금과 내 은으로
  - 내 금과 내 은에서 가져온
  lexicon: HALOT
  rationale: מִן의 출처 의미를 살려, 그 재료가 소유자의 것이었고 그에게서 받은 것임을 드러내기 위해 ‘에서’로 옮겼습니다.
- source_word: צַלְמֵי זָכָר
  english_pob_choice: male images
  chosen_korean: 남자 형상들
  alternatives_korean:
  - 남자 우상들
  - 남성 형상들
  - 남자의 형상들
  lexicon: HALOT
  rationale: צֶלֶם은 기본적으로 ‘형상/상’이고 זָכָר은 분명히 ‘수컷, 남자’를 뜻하므로, 해석을 앞세운 ‘우상’보다 원문에 더 가까운 ‘남자 형상들’로 두었습니다.
- source_word: וַתִּזְנִי בָם
  english_pob_choice: and you prostituted yourself with them
  chosen_korean: 그것들과 더불어 음행하였습니다
  alternatives_korean:
  - 그것들과 더불어 창기를 행하였습니다
  - 그것들과 음행하였습니다
  - 그것들로 말미암아 음행하였습니다
  lexicon: HALOT
  rationale: 지속적으로 반복되는 예언서의 성적 비유를 살리면서도 현대 한국어에서 과도하게 직설적이거나 낡은 표현을 피하기 위해 ‘음행하였습니다’로 옮겼습니다. ‘그것들과 더불어’는 בָם의 관계성을 반영합니다.
theological_decisions:
- issue: 예언서의 성적 은유를 얼마나 직접적으로 유지할지
  chosen_reading: ‘음행하였습니다’로 성적·언약적 배신의 이미지를 유지했습니다.
  alternative_readings:
  - 그것들과 더불어 불충하였습니다
  - 그것들과 더불어 우상숭배를 하였습니다
  rationale: 에스겔은 충격적인 성적 이미지를 통해 예루살렘의 언약 파기를 고발하므로, 이를 완화하지 않고 유지하는 것이 원문의 수사적 힘을 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
