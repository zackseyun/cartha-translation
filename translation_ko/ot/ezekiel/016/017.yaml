    text: 또는 ‘당신의 화려한 장식품들’ 또는 ‘당신의 아름다운 물건들’. 히브리어는 넓게 물건이나 기구를 가리킬 수 있으나, 여기서는 금과 은으로 된 장식물을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘남성 우상들’ 또는 ‘남성의 형상들’.
    reason: alternative_reading
  - marker: c
    text: ‘음행하였습니다’는 우상숭배로 드러난 언약에 대한 불충실을 가리키는 예언서의 반복적 은유를 옮긴 것입니다.
    reason: cultural_note
