source:
  edition: WLC
  text: וְ/שָׂרְפ֤וּ בָתַּ֨יִ/ךְ֙ בָּ/אֵ֔שׁ וְ/עָשׂוּ בָ֣/ךְ שְׁפָטִ֔ים לְ/עֵינֵ֖י נָשִׁ֣ים רַבּ֑וֹת וְ/הִשְׁבַּתִּי/ךְ֙ מִ/זּוֹנָ֔ה וְ/גַם אֶתְנַ֖ן לֹ֥א תִתְּנִי עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/041.yaml
  text: They will burn your houses with fire and execute judgments against you before the eyes of many women[a]. I will put a stop to your prostitution[c][b], and you will no longer give payment.
  footnotes:
  - marker: a
    text: Or 'in the sight of many women.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your prostitution'; alternatively, 'from being a prostitute.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term refers to payment associated with prostitution; some render it 'harlot’s pay' or 'fee.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 당신의 집들을 불태우고, 많은 여성들이 보는 앞에서[a] 당신에게 심판을 집행할 것입니다. 내가 당신이 음행을 그만두게 할 것이며[b], 당신은 다시는 대가를 주지 않을 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 여성들의 눈앞에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘음행으로부터’입니다. ‘음행하는 자가 되는 것을 그치게 하겠다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 매춘과 관련하여 주는 대가를 가리킵니다. ‘창기의 삯’ 또는 ‘삯’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרְפוּ בָתַּיִךְ בָּאֵשׁ
  english_pob_choice: they will burn your houses with fire
  chosen_korean: 당신의 집들을 불로 태울 것입니다
  alternatives_korean:
  - 당신의 집들을 불로 태울 것이며
  - 불로 당신의 집들을 태울 것입니다
  lexicon: HALOT
  rationale: שורף의 심판 문맥을 미래형으로 살리되, בָּאֵשׁ는 한국어에서 자연스러운 도구·수단 표현인 '불로'로 옮겼습니다.
- source_word: וְעָשׂוּ בָךְ שְׁפָטִים
  english_pob_choice: execute judgments against you
  chosen_korean: 당신에게 심판을 집행할 것입니다
  alternatives_korean:
  - 당신에게 판결을 집행할 것입니다
  - 당신에게 심판을 행할 것입니다
  lexicon: HALOT
  rationale: עשה + שְׁפָטִים는 단순한 판단이 아니라 공적 징벌의 집행을 뜻하므로, 법정적·형벌적 뉘앙스를 살려 '심판을 집행하다'로 옮겼습니다.
- source_word: לְעֵינֵי נָשִׁים רַבּוֹת
  english_pob_choice: before the eyes of many women
  chosen_korean: 많은 여성들의 눈앞에서
  alternatives_korean:
  - 많은 여성들의 보는 앞에서
  - 많은 여성들이 보는 앞에서
  lexicon: HALOT
  rationale: 직역하면 '많은 여성들의 눈앞에'이지만, 한국어에서는 '눈앞에서'가 공개적 수치의 장면을 가장 자연스럽게 전달합니다.
- source_word: מִזּוֹנָה
  english_pob_choice: your prostitution
  chosen_korean: 당신의 음행을
  alternatives_korean:
  - 당신의 창녀짓을
  - 당신의 매춘을
  lexicon: HALOT
  rationale: ‘from your prostitution’의 반복적·관계적 상태를 한국어에서 자연스럽게 드러내면서도, 에스겔의 은유적 성적 언어를 약화시키지 않기 위해 '음행'을 택했습니다.
- source_word: וְגַם אֶתְנַן לֹא תִתְּנִי עוֹד
  english_pob_choice: and you will no longer give payment
  chosen_korean: 다시는 값을 주지 않을 것입니다
  alternatives_korean:
  - 더는 값을 주지 않을 것입니다
  - 다시는 대가를 주지 않을 것입니다
  lexicon: HALOT
  rationale: אֶתְנַן은 매춘과 연결된 '지불'이므로, 한국어에서는 관용적으로도 통하는 '값'으로 옮겨 그 행위의 거래성을 드러냈습니다.
theological_decisions:
- issue: 에스겔의 성적 은유를 본문에서 얼마나 직접적으로 드러낼 것인가
  chosen_reading: 은유를 완화하지 않고 '음행'으로 유지했습니다.
  alternative_readings:
  - '''불신앙''이나 ''우상숭배''로 추상화하기'
  - 더 노골적인 매춘 표현으로 옮기기
  rationale: 원문은 언약 배반을 성적 은유로 강하게 고발하므로, 의미를 추상화해 완화하지 않되 현대 한국어 공용역으로 읽을 수 있는 수준의 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
