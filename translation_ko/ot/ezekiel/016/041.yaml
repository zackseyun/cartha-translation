  to: 그들은 당신의 집들을 불태우고, 많은 여성들이 보는 앞에서[a] 당신에게 심판을 집행할 것입니다. 내가 당신이 음행을 그만두게 할 것이며[b], 당신은 다시는 대가를 주지 않을 것입니다.[c]
  rationale: 미래형을 일관되게 복원하고, ‘그치게 하다’의 사역 의미와 음행으로부터의 중단을 자연스럽게 반영했습니다. ‘대가’와 연결 각주를 통해 אֶתְנַן의 문맥적 의미를 명료하게 했으며, 성적 은유 자체는 유지했습니다.
