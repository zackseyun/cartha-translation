  source_fidelity: 첫 두 절반은 원문의 미래 심판 연쇄와 공적 처벌의 뜻을 대체로 충실히 옮겼습니다. 그러나 וְהִשְׁבַּתִּיךְ는 미래의 하나님의 행위인데 초안의 ‘멈추게 하며’는 현재형으로 되어 있어 미래형으로 고쳐야 합니다. 또한 אֶתְנַן은 매춘과 연관된 지불/대가이므로 문맥상 ‘값’보다 ‘대가’가 더 분명합니다.
  naturalness: ‘불태우고’, ‘많은 여성들이 보는 앞에서’, ‘음행을 그만두게 할 것이며’는 현대 한국어 공용역 합쇼체에서 자연스럽고 원문의 공개적 심판 및 인과적 사역 의미를 유지합니다.
  terminology: ‘음행’은 예루살렘의 언약 배반을 표현하는 원문의 성적 은유를 불필요하게 추상화하지 않는 적절한 표현입니다. ‘대가’는 אֶתְנַן의 거래적 의미를 드러내며, 각주에서 매춘 관련 지불이라는 의미를 명시합니다.
