  text: חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם עָֽשְׂתָה֙ סְדֹ֣ם אֲחוֹתֵ֔/ךְ הִ֖יא וּ/בְנוֹתֶ֑י/הָ כַּ/אֲשֶׁ֣ר עָשִׂ֔ית אַ֖תְּ וּ/בְנוֹתָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/048.yaml
  text: As I live[a], declares the Lord GOD, your sister Sodom, she and her daughters[b], has not done as you and your daughters have done.
  footnotes:
  - marker: a
    text: 'Hebrew oath formula: literally, ''As I live ... if Sodom your sister has done ...'' The construction expresses a strong negation.'
    reason: lexical_alternative
  - marker: b
    text: '''Daughters'' refers to the towns or communities associated with Sodom and with Jerusalem.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 살아 있노라—주 하나님이 말씀하십니다—네 자매 소돔과 그 딸들은, 너와 너의 딸들이 한 것처럼, 그렇게 하지는 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 맹세 공식입니다. 문자적으로는 ‘내가 살아 있노라 ... 만일 소돔 네 자매가 ...’에 가깝지만, 의미는 강한 부정입니다.
    reason: source_note
  - marker: b
    text: ‘딸들’은 소돔과 예루살렘에 속한 주변 도시나 공동체를 가리키는 은유입니다.
    reason: cultural_note
lexical_decisions:
- source_word: חַי אָ֗נִי
  english_pob_choice: As I live
  chosen_korean: 내가 살아 있노라
  alternatives_korean:
  - 내가 살아 있음을 두고
  - 내 생명을 걸고
  lexicon: HALOT
  rationale: 히브리어 맹세 공식의 관용적 강세를 살리되, 현대 한국어에서 자연스럽고 엄숙한 선서형으로 옮겼습니다.
- source_word: נְאֻם אֲדֹנָ֣/י יְהוִ֔ה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님이 말씀하십니다
  alternatives_korean:
  - 주 야훼께서 말씀하십니다
  - 주 하나님의 말씀입니다
  lexicon: HALOT
  rationale: 예언 공식인 נְאֻם을 ‘말씀하십니다’로 옮겨 선지자적 선언의 톤을 유지했고, אֲדֹנָי יְהוִה는 국내 번역 관행보다 원문 직결성을 살려 ‘주 하나님’으로 처리했습니다.
- source_word: סְדֹם אֲחוֹתֵ֔/ךְ הִ֖יא וּ/בְנוֹתֶ֑י/הָ
  english_pob_choice: your sister Sodom, she and her daughters
  chosen_korean: 네 자매 소돔과 그 딸들은
  alternatives_korean:
  - 너의 자매 소돔과 그 딸들은
  - 네 자매 소돔, 곧 그 딸들은
  lexicon: HALOT
  rationale: ‘자매’ 비유를 유지해 예루살렘과 소돔의 친족적 대비를 드러냈고, ‘딸들’은 소돔에 속한 주변 도시·공동체를 가리키는 은유로 남겼습니다.
- source_word: כַּ/אֲשֶׁ֣ר עָשִׂ֔ית אַ֖תְּ וּ/בְנוֹתָֽיִ/ךְ
  english_pob_choice: as you and your daughters have done
  chosen_korean: 너와 너의 딸들이 한 것처럼
  alternatives_korean:
  - 네가 너의 딸들과 한 것처럼
  - 너와 네 딸들이 행한 것처럼
  lexicon: HALOT
  rationale: 비교 표지 כַּאֲשֶׁר를 자연스러운 한국어 비교구문으로 옮기고, 여성 단수 2인칭 직접호칭의 대조를 유지했습니다.
theological_decisions:
- issue: חַי ... אִם 구조의 의미
  chosen_reading: 형식상 조건문이 아니라 강한 부정 서약으로 이해하여 ‘...하지는 않았습니다’로 옮겼습니다.
  alternative_readings:
  - 문자적으로 ‘...하면’
  - ‘...하였는지’와 같은 직역
  rationale: 히브리어 맹세 공식에서 אִם은 실제 조건이 아니라 단호한 부정을 나타내므로, 한국어에서도 오해 없는 부정문으로 재현해야 합니다.
  doctrine_reference: 원문 우선 번역 원칙
- issue: 예언 선언문의 존칭/문체
  chosen_reading: ‘말씀하십니다’ 체를 사용해 하나님의 직접 선언으로 분명히 했습니다.
  alternative_readings:
  - ‘말한다’
  - ‘선언하십니다’
  rationale: 본문은 예언적 신탁이므로, 합쇼체 안에서 하나님의 직접 발화를 드러내는 존칭형이 문맥에 가장 적합합니다.
  doctrine_reference: 예언문 서술 양식
