  lexicon: HALOT
  rationale: תָּחַשׁ의 정확한 재료는 불확실하므로, 특정 동물명을 단정하지 않고 고급 소재라는 점을 드러내는 ‘고운 가죽’으로 옮겼습니다.
- source_word: שֵׁשׁ
  english_pob_choice: fine linen
  chosen_korean: 고운 베
  alternatives_korean:
  - 고운 리넨
  - 고운 삼베
  lexicon: HALOT
  rationale: שֵׁשׁ은 고급 리넨 계열의 천을 가리키므로, 현대 한국어에서 과도하게 외래어화하지 않으면서 품격을 드러내는 ‘고운 베’로 번역했습니다.
- source_word: מֶשִׁי
  english_pob_choice: silk
  chosen_korean: 비단
  alternatives_korean:
  - 실크
  - 고운 직물
  lexicon: HALOT
  rationale: מֶשִׁי는 값비싼 직물을 뜻하는 말로, 전통적으로 널리 이해되는 ‘비단’이 사치와 장식의 뉘앙스를 가장 잘 전달합니다.
