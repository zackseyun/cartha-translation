base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/010.yaml
  text: I clothed you with embroidered cloth[a], put fine leather sandals on you, wrapped you in fine linen[b], and covered you with silk.
  footnotes:
  - marker: a
    text: Or 'a costly fabric' for 'silk'; the precise identification of the Hebrew term is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew תָּחַשׁ refers to a material used for fine footwear; its exact animal/source is uncertain, so 'fine leather' is used here rather than a more speculative identification such as 'porpoise skin' or 'dugong skin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 수놓은 옷으로 입히고, 고운 가죽 신을 신기고, 고운 베로 감싸고, 비단으로 덮어 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고운 가죽’은 תָּחַשׁ의 정확한 동물·재료를 단정하지 않기 위한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘비단’은 מֶשִׁי가 가리키는 값비싼 직물의 전통적 대응어를 따른 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִקְמָה
  english_pob_choice: embroidered cloth
  chosen_korean: 수놓은 옷
  alternatives_korean:
  - 수놓은 천
  - 자수 놓인 옷감
  lexicon: HALOT
  rationale: רִקְמָה는 수놓인 재료나 직물을 가리키므로, 한국어에서는 자연스럽게 ‘수놓은 옷’으로 옮겨 직물의 화려함을 살렸습니다.
- source_word: תָּחַשׁ
  english_pob_choice: fine leather
  chosen_korean: 고운 가죽
  alternatives_korean:
  - 세련된 가죽
  - 희귀한 가죽
  lexicon: HALOT
  rationale: תָּחַשׁ의 정확한 재료는 불확실하므로, 특정 동물명을 단정하지 않고 고급 소재라는 점을 드러내는 ‘고운 가죽’으로 옮겼습니다.
- source_word: שֵׁשׁ
  english_pob_choice: fine linen
  chosen_korean: 고운 베
  alternatives_korean:
  - 고운 리넨
  - 고운 삼베
  lexicon: HALOT
  rationale: שֵׁשׁ은 고급 리넨 계열의 천을 가리키므로, 현대 한국어에서 과도하게 외래어화하지 않으면서 품격을 드러내는 ‘고운 베’로 번역했습니다.
- source_word: מֶשִׁי
  english_pob_choice: silk
  chosen_korean: 비단
  alternatives_korean:
  - 실크
  - 고운 직물
  lexicon: HALOT
  rationale: מֶשִׁי는 값비싼 직물을 뜻하는 말로, 전통적으로 널리 이해되는 ‘비단’이 사치와 장식의 뉘앙스를 가장 잘 전달합니다.
theological_decisions:
- issue: 화려한 혼인/장식 이미지의 유지
  chosen_reading: 신분 상승과 돌봄을 나타내는 연속된 의복 장식 이미지로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 비유적 의미를 풀어서 ‘아름답게 꾸며 주었습니다’로 의역
  - 문화적 설명을 덧붙여 의미를 확장
  rationale: 본문은 의복을 차례로 입히는 동작을 통해 은혜로운 돌봄과 존귀하게 하심을 보여 주므로, 그 상징적 연쇄를 보존하는 것이 중요합니다.
  doctrine_reference: 에스겔 16장의 비유적 서술
