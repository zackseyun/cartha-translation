source:
  edition: WLC
  text: וְ/זָכַרְתִּ֨י אֲנִ֧י אֶת בְּרִיתִ֛/י אוֹתָ֖/ךְ בִּ/ימֵ֣י נְעוּרָ֑יִ/ךְ וַ/הֲקִמוֹתִ֥י לָ֖/ךְ בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/060.yaml
  text: But I myself will remember my covenant with you in the days of your youth[b][a], and I will establish for you an everlasting covenant.
  footnotes:
  - marker: a
    text: Or 'eternal covenant.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'my covenant with you in the days of your youth,' recalling the earlier covenant relationship without specifying here which covenant administration is in view.
    reason: cross_reference
translation:
  language: ko
  text: 그러나 나는 네 젊은 날에 너와 맺은 내 언약을 기억하고, 너를 위하여 영원한 언약을 세우겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영구한 언약’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘네 젊은 날에 너와 맺은 내 언약’이라고 하여, 앞서 언급된 언약 관계를 상기시키지만 여기서 어느 언약을 가리키는지는 특정하지 않습니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/זָכַרְתִּי אֲנִי
  english_pob_choice: But I myself will remember
  chosen_korean: 그러나 나는 … 기억하고
  alternatives_korean:
  - 그리고 나는 … 기억하고
  - 내가 … 기억하고
  lexicon: HALOT
  rationale: 문맥상 심판에서 회복으로 전환되는 대조를 살려 ‘그러나’로 옮기고, העצמיות를 나타내는 독립 인칭대명사 אֲנִי는 ‘나는’으로 드러내어 강조를 보존했습니다.
- source_word: בְּרִיתִי אוֹתָךְ
  english_pob_choice: my covenant with you
  chosen_korean: 네게 맺은 내 언약
  alternatives_korean:
  - 너와의 내 언약
  - 내 언약을 너와
  lexicon: HALOT
  rationale: 히브리어의 ‘내 언약 + 너’를 한국어에서는 관계를 자연스럽게 드러내는 ‘네게 맺은 내 언약’으로 옮겨, 언약 관계의 방향성을 유지했습니다.
- source_word: בִּימֵי נְעוּרַיִךְ
  english_pob_choice: in the days of your youth
  chosen_korean: 네가 젊었던 날에
  alternatives_korean:
  - 네 젊은 날에
  - 네 청춘의 날에
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하기보다 한국어에서 자연스럽고 과도하게 문어적이지 않은 표현으로 옮기되, 젊음의 시기를 가리키는 시간표현은 유지했습니다.
- source_word: בְּרִית עוֹלָם
  english_pob_choice: an everlasting covenant
  chosen_korean: 영원한 언약
  alternatives_korean:
  - 영구한 언약
  - 영원한 계약
  lexicon: HALOT
  rationale: 표준적인 성경 언약 용례를 따라 ‘언약’을 유지하고, עוֹלָם은 POB의 ‘everlasting’에 맞춰 ‘영원한’으로 옮겼습니다.
theological_decisions:
- issue: ‘내 언약’의 범위와 특정 언약 체계로의 환원
  chosen_reading: 본문이 말하는 ‘내 언약’을 그대로 두고, 어느 시대적 언약인지 단정하지 않았습니다.
  alternative_readings:
  - 시내 언약으로 특정하기
  - 새 언약으로 특정하기
  rationale: 히브리어는 단지 하나님이 ‘내 언약’을 기억하신다고 말할 뿐이므로, 본문이 명시하지 않은 신학적 특정화를 피하고 회복 언약의 긴장을 보존했습니다.
  doctrine_reference: 본문 우선; 불필요한 체계신학적 단정 회피
