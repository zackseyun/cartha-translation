lexical_decisions:
- source_word: גֶּב
  english_pob_choice: mound
  chosen_korean: 둑
  alternatives_korean:
  - 언덕
  - 둔덕
  - 축대
  lexicon: HALOT
  rationale: 희귀한 건축물/구조물 표현으로서 구체성을 유지하면서도, 문맥의 우상숭배적 성격을 과도하게 해석하지 않기 위해 비교적 중립적인 ‘둑’을 택했습니다.
- source_word: רָמָה
  english_pob_choice: high place
  chosen_korean: 높은 곳
  alternatives_korean:
  - 산당
  - 높은 지대
  - 높은 장소
  lexicon: HALOT
  rationale: 예언서 문맥에서는 예배 장소를 가리키는 경우가 많지만, 본절의 구조상 명사적 표현을 살려 직역에 가깝게 옮겼습니다. 문맥이 산당적 의미를 드러내므로 각주로 연결합니다.
- source_word: רְחוֹב
  english_pob_choice: square
  chosen_korean: 광장
  alternatives_korean:
  - 거리
  - 공터
  - 공공장소
  lexicon: HALOT
  rationale: 도시 안의 열린 공적 공간이라는 뜻을 살려 ‘광장’으로 옮겼습니다. ‘거리’보다 공개성과 중심성을 더 잘 드러냅니다.
- source_word: וַתִּבְנִי לָךְ / וַתַּעֲשִׂי לָךְ
  english_pob_choice: You built for yourself / made for yourself
  chosen_korean: 너는 자신을 위하여 / 만들었습니다
  alternatives_korean:
  - 너는 스스로 / 지었습니다
  - 너는 자신을 위해 / 세웠습니다
  lexicon: HALOT
  rationale: לָךְ의 수혜적·반사적 뉘앙스를 ‘자신을 위하여’로 살렸습니다. 주어-동사의 자연스러운 한국어 흐름도 함께 고려했습니다.
theological_decisions:
- issue: ‘high place’의 해석을 본문에서 산당으로 직접 명시할지 여부
  chosen_reading: 본문은 ‘높은 곳’으로 두고, 각주로 희귀한 히브리어와 산당적 의미 가능성을 열어 둡니다.
  alternative_readings:
  - 산당으로 직접 번역
  - 우상 제의 장소로 의역
  rationale: 이 절의 히브리어는 희귀하며, 본문만으로는 특정 건축 형태를 단정하기 어렵습니다. 그러나 전체 문맥은 우상숭배를 강하게 암시하므로, 본문은 비교적 직역하고 해석 가능성은 각주로 보존하는 편이 원문 긴장을 더 잘 유지합니다.
  doctrine_reference: 원문 우선 원칙; 어휘적 불확실성 보존
