  source_fidelity: 수혜·반사 의미의 לָךְ가 두 동사 모두에 나타나므로 한국어에서도 두 절에 각각 반영하는 것이 좋습니다. גֶּב는 불확실한 희귀어이지만 ‘둑’은 통상 물길을 막거나 보호하는 제방을 뜻하여 문맥에 없는 기능을 부여할 수 있습니다. ‘둔덕’은 영어 POB의 ‘mound’와 히브리어의 구체적·불확실한 구조물 의미를 더 중립적으로 보존합니다. רָמָה는 이 문맥에서 제의적 ‘high place’를 가리키므로 ‘산당’이 한국어 성경 문체에서 자연스럽고 의미상 적절합니다.
