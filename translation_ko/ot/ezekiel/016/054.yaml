revisions:
- from: 그리하여 네가 네 수치를 담당하고, 네가 행한 모든 것으로 말미암아 부끄러워하며, 그들에게 위로가 되어 가게 하려 함이라.[a]
  to: 이는 네가 그들을 위로할 때에 네 수치를 감당하고, 네가 행한 모든 일 때문에 부끄러워하게 하려는 것입니다.[a]
  rationale: 목적을 나타내는 לְמַעַן을 ‘이는 … 하려는 것입니다’로 옮기고, בְּנַחֲמֵךְ אֹתָן은 본문에서 가장 직접적인 상황적 독법인 ‘그들을 위로할 때에’로 번역했습니다. 대안적으로 가능한 수단적 및 ‘위로가 되다’의 독법은 각주에 보존했습니다. 원문의 수치와 위로의 긴장은 설명으로 해소하지 않았습니다.
  reviewer_model: gpt-5.6-terra
