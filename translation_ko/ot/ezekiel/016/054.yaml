id: EZK.16.54
reference: Ezekiel 16:54
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְמַ֨עַן֙ תִּשְׂאִ֣י כְלִמָּתֵ֔/ךְ וְ/נִכְלַ֕מְתְּ מִ/כֹּ֖ל אֲשֶׁ֣ר עָשִׂ֑ית בְּ/נַחֲמֵ֖/ךְ אֹתָֽ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/054.yaml
  text: so that you may bear your disgrace and be ashamed because of all that you have done[a], becoming a comfort to them.
  footnotes:
  - marker: a
    text: Or, 'when you comfort them,' or 'by comforting them.' The Hebrew expression can be understood in more than one closely related way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 네가 네 수치를 담당하고, 네가 행한 모든 것으로 말미암아 부끄러워하며, 그들에게 위로가 되어 가게 하려 함이라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 위로할 때’, ‘그들을 위로함으로써’. 히브리어 표현은 서로 아주 가까운 여러 방식으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: so that
  chosen_korean: 그리하여 … 하려 함이라
  alternatives_korean:
  - 그래서 … 하려고
  - 그 목적으로
  lexicon: HALOT
  rationale: 목적/결과를 이끄는 לְמַעַן의 기능을 현대 한국어에서 자연스럽게 드러내기 위해 ‘그리하여 … 하려 함이라’로 옮겼습니다.
- source_word: תִּשְׂאִי כְלִמָּתֵךְ
  english_pob_choice: you may bear your disgrace
  chosen_korean: 네가 네 수치를 담당하고
  alternatives_korean:
  - 네가 네 수치를 지고
  - 네가 네 수치를 تحمل하고
  lexicon: HALOT
  rationale: ‘bear’의 감각을 ‘담당하다’로 살리면 단순한 감정이 아니라 감당해야 할 공적 수치의 부담이 드러납니다. ‘수치’는 כְלִמָּה의 명예 훼손적 뉘앙스를 현대어로 잘 전달합니다.
- source_word: וְנִכְלַמְתְּ מִכֹּל אֲשֶׁר עָשִׂית
  english_pob_choice: and be ashamed because of all that you have done
  chosen_korean: 네가 행한 모든 것으로 말미암아 부끄러워하며
  alternatives_korean:
  - 네가 행한 모든 일 때문에 부끄러워하며
  - 네가 한 모든 일로 말미암아 수치를 당하며
  lexicon: HALOT
  rationale: נכלם의 ‘부끄러워하다/수치를 당하다’ 중, 문맥상 내적 수치감과 결과 상태를 함께 드러내는 ‘부끄러워하며’를 택했습니다. 전치사 מִן은 원인/계기를 나타낼 수 있어 ‘~으로 말미암아’로 옮겼습니다.
- source_word: בְּנַחֲמֵךְ אֹתָן
  english_pob_choice: becoming a comfort to them
  chosen_korean: 그들에게 위로가 되어 가게 하려 함이라
  alternatives_korean:
  - 그들을 위로할 때
  - 그들에게 위로가 되며
  lexicon: HALOT
  rationale: נחם의 관계절적·상황적 용법을 살려, ‘위로가 되어 가다’로 진행성을 드러냈습니다. 목적절 안에서 미래적 상황을 자연스럽게 표현하면서도 원문의 애매성을 지우지 않도록 했습니다.
theological_decisions:
- issue: 예루살렘이 소돔과 사마리아에게 ‘위로가 됨’과 그에 따른 수치의 관계
  chosen_reading: 예루살렘은 회복의 자리에서 그들에게 위로가 되는 그 반전 때문에 더욱 수치를 담당하게 됩니다.
  alternative_readings:
  - 예루살렘이 그들을 위로했기 때문에 수치를 당합니다
  - 예루살렘이 그들을 위로하는 행위 자체로 수치를 느낍니다
  rationale: 문맥(16:53-55)에서 이 절은 장차 함께 회복될 반전 속에서 예루살렘의 수치가 깊어지는 장면입니다. 원문의 긴장을 풀어 설명하기보다, 위로와 수치가 동시에 성립하는 구조를 그대로 유지했습니다.
  doctrine_reference: '번역 원칙 §3: 문맥적·신학적 긴장을 해소하지 말고 보존한다'
