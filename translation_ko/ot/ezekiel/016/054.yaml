  verdict: revise
  source_fidelity: 목적을 나타내는 לְמַעַן과 ‘수치를 지다/감당하다’의 관용을 대체로 반영했으나, ‘위로가 되어 가게 하려 함이라’는 בְּנַחֲמֵךְ אֹתָן의 행위·상황 표현을 진행적 사역 구조로 바꾸어 원문의 관계를 과도하게 재구성합니다. 또한 ‘그리하여’는 목적보다는 결과를 우선시합니다.
  naturalness: ‘그리하여 네가 … 하려 함이라’ 및 ‘위로가 되어 가게’는 현대 표준어 합쇼체 성경 문체로도 부자연스럽고, 문장 안의 목적 관계가 불분명합니다. ‘이는 … 하려는 것입니다’와 ‘그들을 위로할 때’를 사용하면 자연스럽고 명료합니다.
  terminology: כְלִמָּה에는 ‘수치’, נשׂא에는 ‘감당하다’, נכלם에는 ‘부끄러워하다’를 사용하는 것이 적절합니다. אֹתָן은 직접목적어이므로 본문에서는 ‘그들을 위로할 때’가 더 직접적입니다.
  issues:
