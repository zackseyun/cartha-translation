source:
  edition: WLC
  text: וַ/תִּבְטְחִ֣י בְ/יָפְיֵ֔/ךְ וַ/תִּזְנִ֖י עַל שְׁמֵ֑/ךְ וַ/תִּשְׁפְּכִ֧י אֶת תַּזְנוּתַ֛יִ/ךְ עַל כָּל עוֹבֵ֖ר ל/וֹ יֶֽהִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/015.yaml
  text: But you trusted in your beauty[a], and you prostituted yourself because of your name, and you poured out your prostitutions on every passerby[b]; they became his.
  footnotes:
  - marker: a
    text: Or 'because of your fame' / 'because of your reputation'; Hebrew 'name' often carries the sense of renown here.
    reason: lexical_alternative
  - marker: b
    text: 'The final clause is terse in Hebrew: ''to him let it be'' or ''it became his,'' expressing that what she offered was given over to each passerby.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너는 네 아름다움을 믿었고, 네 이름 때문에 네가 음행을 저질렀으며, 지나가는 사람마다 네 음행을 쏟아부었습니다. 그것이 그의 것이 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이름’은 여기서 ‘명성’ 또는 ‘평판’의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 히브리어로 매우 간결하여, ‘그에게 속하였다’ 또는 ‘그의 것이 되었다’는 뜻을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְטְחִי בְיָפְיֵךְ
  english_pob_choice: you trusted in your beauty
  chosen_korean: 네 아름다움을 믿었고
  alternatives_korean:
  - 네 아름다움에 의지했고
  - 네 아름다움을 신뢰했고
  lexicon: HALOT
  rationale: בטח의 핵심은 신뢰/의지이며, ב와 함께 ‘~을 믿다/신뢰하다’로 자연스럽게 옮길 수 있습니다. 비난의 뉘앙스를 살리면서도 현대 한국어로 매끄럽게 표현했습니다.
- source_word: וַתִּזְנִי
  english_pob_choice: you prostituted yourself
  chosen_korean: 네가 음행을 저질렀으며
  alternatives_korean:
  - 네가 창녀처럼 행동했으며
  - 네가 몸을 팔았으며
  - 네가 음행을 행했으며
  lexicon: HALOT
  rationale: זנה는 예언서 맥락에서 성적 불륜과 언약적 배신을 함께 드러내므로, 노골적이면서도 현대어로 읽히는 ‘음행을 저지르다’를 택했습니다.
- source_word: עַל שְׁמֵךְ
  english_pob_choice: because of your name
  chosen_korean: 네 이름 때문에
  alternatives_korean:
  - 네 명성 때문에
  - 네 평판 때문에
  lexicon: HALOT
  rationale: שֵׁם은 여기서 고유명칭이 아니라 ‘이름/명성/평판’의 의미 범위를 갖지만, 본문에는 ‘네 이름’으로 두고 그 함의를 문맥이 드러내게 하는 것이 원문에 더 가깝습니다.
- source_word: וַתִּשְׁפְּכִי אֶת תַּזְנוּתַיִךְ עַל כָּל עוֹבֵר
  english_pob_choice: you poured out your prostitutions on every passerby
  chosen_korean: 지나가는 사람마다 네 음행을 쏟아부었습니다
  alternatives_korean:
  - 지나가는 자마다 네 음행을 쏟아부었습니다
  - 지나가는 사람마다 네 음행을 퍼부었습니다
  lexicon: HALOT
  rationale: שׁפך의 ‘쏟아붓다’ 이미지를 살리고, תַּזְנוּתַיִךְ의 복수형을 ‘음행’으로 옮겨 반복적이고 노골적인 성격을 유지했습니다. ‘every passerby’는 한국어에서 자연스러운 ‘지나가는 사람마다’로 처리했습니다.
- source_word: לוֹ יֶהִי
  english_pob_choice: they became his
  chosen_korean: 그것이 그의 것이 되었습니다
  alternatives_korean:
  - 그에게 속하게 되었습니다
  - 그의 것이었습니다
  lexicon: HALOT
  rationale: 끝절의 קצר한 התבטאות는 각 지나가는 이에게 내어준 상태를 가리키므로, 소유 귀속의 의미를 드러내는 한국어로 옮겼습니다. 대명사의 지시 대상이 단수처럼 보이게 하는 오해를 줄이기 위해 ‘그것이’로 처리했습니다.
theological_decisions:
- issue: 예언적 성적 은유의 보존
  chosen_reading: 본문의 노골적인 음행 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 언약적 불신실함처럼 완곡하게 처리
  - 비유를 약화시켜 도덕적 일탈로 일반화
  rationale: 히브리어는 예루살렘의 우상숭배와 배신을 성적 은유로 강하게 고발하므로, 이를 완화하면 본문의 예언적 충격과 수사적 힘이 약해집니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
