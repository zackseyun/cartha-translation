  source_fidelity: 핵심 어휘와 성적 은유는 대체로 보존되었습니다. 그러나 히브리어의 연속된 2인칭 여성 단수 완료형을 따라야 할 자리에서 존대 종결 ‘쏟아부었습니다/되었습니다’가 섞여, 수신자 ‘너’에 대한 직접 고발의 문체와 문법적 일관성이 무너집니다. 또한 ‘그것이’는 복수형 ‘네 음행들’에 상응하는 지시를 단수화합니다.
  naturalness: 현대 표준 한국어로 이해 가능하나, ‘너는’과 해라체 과거 ‘믿었고’ 뒤에 합쇼체 종결이 결합된 것은 부자연스럽고 목표 합쇼체에 맞지 않습니다. 합쇼체로 일관되게 정리하는 것이 안전합니다.
  terminology: ‘음행’은 זנה 및 תזנות의 노골적인 예언자적 은유를 유지하는 적절한 용어입니다. ‘네 이름 때문에’는 원문의 형식적 표현을 보존하며, 명성/평판의 의미는 각주가 적절히 안내합니다. 마지막 절은 히브리어가 압축적이고 선행사가 불명확하므로, 단수 ‘그것’으로 확정하기보다 ‘그것들은’으로 복수 가능성을 드러내는 편이 영어 POB의 선택 및 히브리어 복수 명사와 더 잘 맞습니다.
