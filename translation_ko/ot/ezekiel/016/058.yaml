  yaml_path: translation/ot/ezekiel/016/058.yaml
  text: You have borne your lewdness and your abominations[a], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'have borne your punishment' or 'have borne your guilt.' The Hebrew verb can carry judicial overtones in context.
