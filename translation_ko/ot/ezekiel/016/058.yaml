  lexicon: HALOT
  rationale: תּוֹעֵבָה의 혐오·가증의 강도를 살리면서, 복수형이 가리키는 반복된 행위를 한국어로 자연스럽게 반영했습니다.
- source_word: נְשָׂאתִם
  english_pob_choice: have borne
  chosen_korean: 담당하였느니라
  alternatives_korean:
  - 짊어졌느니라
  - 감당하였느니라
  - 받아내었느니라
  lexicon: HALOT
  rationale: 이 동사는 ‘짊어지다/감당하다’의 뜻과 더불어 심판 맥락에서는 죄의 결과를 겪는 뉘앙스를 가질 수 있어, 본문이 의도하는 책임과 결과를 함께 살리기 위해 ‘담당하다’를 택했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 주 야훼의 말씀이니라
  alternatives_korean:
  - 야훼의 말씀이니라
  - 주님의 말씀이니라
  - 야훼께서 말씀하신다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם יְהוָה는 한국어에서 통상적인 선언문 형식을 살려 마무리했고, יְהוָה는 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: נְשָׂאתִם의 심판적 함의
  chosen_reading: ‘담당하였느니라’는 죄책의 결과를 이미 겪는다는 뜻을 열어 두되, ‘벌을 받았다’나 ‘죄책을 졌다’로 단정하지 않습니다.
  alternative_readings:
  - 네 벌을 받았느니라
  - 네 죄책을 졌느니라
  rationale: 히브리어는 책임·결과·형벌의 의미를 모두 열어 둘 수 있으므로, 본문이 가진 긴장을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
