  text: 네가 네 음란한 행실과 네 가증한 일들을 짊어졌습니다[a]—야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘짊어졌습니다’는 이 동사의 심판 문맥에서의 용법을 반영합니다. 문맥상 ‘벌을 받았습니다’ 또는 ‘죄책을 졌습니다’로도 이해될 수 있습니다.
    reason: lexical_alternative
