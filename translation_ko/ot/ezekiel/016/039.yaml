id: EZK.16.39
reference: Ezekiel 16:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּ֨י אוֹתָ֜/ךְ בְּ/יָדָ֗/ם וְ/הָרְס֤וּ גַבֵּ/ךְ֙ וְ/נִתְּצ֣וּ רָמֹתַ֔יִ/ךְ וְ/הִפְשִׁ֤יטוּ אוֹתָ/ךְ֙ בְּגָדַ֔יִ/ךְ וְ/לָקְח֖וּ כְּלֵ֣י תִפְאַרְתֵּ֑/ךְ וְ/הִנִּיח֖וּ/ךְ עֵירֹ֥ם וְ/עֶרְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/039.yaml
  text: I will give you into their hand[a], and they will tear down your vaulted chamber and demolish your high places. They will strip you of your clothes, take your beautiful jewelry[b], and leave you naked and bare.
  footnotes:
  - marker: a
    text: Or 'your mound,' 'your shrine,' or 'your arch'; the Hebrew term is rare and likely refers to a built structure associated with Jerusalem's illicit worship imagery in this chapter.
    reason: lexical_alternative
  - marker: b
    text: Or 'your splendid ornaments' or 'the articles of your splendor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 그들의 손에 넘기겠습니다[a]. 그들은 너의 둥근 건축물과 너의 산당들을 헐어버릴 것입니다. 그들은 너의 옷을 벗기고 너의 아름다운 장신구[b]를 가져가며, 너를 벌거벗은 채로, 알몸인 상태로 남겨 둘 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너의 둔덕’, ‘너의 신당’, 혹은 ‘너의 아치’로 옮길 수 있습니다. 이 히브리어는 드물며, 이 장에서의 우상숭배적 건축물 이미지를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너의 화려한 장식품’ 혹은 ‘너의 아름다움의 기물’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי / בְּיָדָם
  english_pob_choice: I will give you into their hand
  chosen_korean: 내가 그들을 그들의 손에 넘기겠습니다
  alternatives_korean:
  - 내가 그들에게 넘기겠습니다
  - 내가 그들의 손에 내어주겠습니다
  lexicon: HALOT
  rationale: ‘손에 넘기다’는 히브리어 관용구 ‘into the hand of’의 처분·지배 의미를 살리면서 한국어로도 자연스럽습니다.
- source_word: גַבֵּךְ
  english_pob_choice: your vaulted chamber
  chosen_korean: 너의 둥근 건축물
  alternatives_korean:
  - 너의 아치형 건축물
  - 너의 둥근 방
  - 너의 요새
  lexicon: HALOT
  rationale: 이 단어는 본문에서 희귀한 건축물 이미지를 가리키므로, 뜻을 단정적으로 특정하기보다 형태를 드러내는 ‘둥근 건축물’로 옮겨 과도한 해석을 피했습니다.
- source_word: וְהִפְשִׁיטוּ אוֹתָךְ בְּגָדַיִךְ
  english_pob_choice: They will strip you of your clothes
  chosen_korean: 그들은 너의 옷을 벗기고
  alternatives_korean:
  - 그들은 너를 옷 벗겨
  - 그들은 너의 옷을 벗겨 버리고
  lexicon: HALOT
  rationale: 히브리어 동사는 공적 수치의 의미를 지닌 ‘벗기다’이므로, 수동적으로 완화하지 않고 직접적인 동작으로 살렸습니다.
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  english_pob_choice: your beautiful jewelry
  chosen_korean: 너의 아름다운 장신구
  alternatives_korean:
  - 너의 화려한 장식품
  - 너의 영광의 기물
  - 너의 아름다운 물건들
  lexicon: HALOT
  rationale: כְּלִי는 ‘물건/기물/기구’의 폭이 있지만, 문맥상 몸에 지닌 장식물을 가리키는 것으로 읽히므로 ‘장신구’가 가장 자연스럽습니다.
- source_word: עֵירֹם וְעֶרְיָה
  english_pob_choice: naked and bare
  chosen_korean: 벌거벗은 채로, 알몸인 상태로
  alternatives_korean:
  - 벌거벗고, 드러난 채로
  - 맨몸으로, 완전히 벗겨진 채로
  lexicon: HALOT
  rationale: 두 표현의 중첩을 한국어에서도 반복적으로 살려, 완전한 노출과 수치를 강조했습니다.
theological_decisions:
- issue: 예언적 수치와 성적-정치적 수탈의 중첩 이미지
  chosen_reading: 건축물 파괴와 몸의 벗김을 추상화하지 않고, 본문이 의도하는 물리적·수치적 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 단순히 ‘심판받게 할 것이다’로 일반화
  - 수치를 완화해 은유적으로 처리
  rationale: 에스겔 16장은 예루살렘을 배신한 여인으로 묘사하는 확장 은유를 사용하므로, 구체적 이미지의 강도를 보존하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
