  verdict: revise
  source_fidelity: 첫 문장에서 목적어가 원문의 여성 단수 목적격 ‘너’(אֹתָךְ)가 아니라 ‘그들’로 잘못 옮겨졌습니다. 이를 ‘너를’로 바로잡아야 합니다. 그 밖에 건축물 파괴, 옷을 벗김, 장신구 탈취, 벌거벗은 상태로 남겨짐이라는 연속된 심판 이미지는 충실히 유지됩니다.
  naturalness: ‘둥근 건축물’은 한국어에서 다소 부자연스럽고 영어 감사본의 ‘vaulted chamber’와도 거리가 있습니다. 희귀어의 불확실성은 각주로 보존하되 본문은 ‘아치형 건축물’로 하는 편이 자연스럽습니다. 마지막의 ‘벌거벗은 채로, 알몸인 상태로’는 설명체로 중복되어 ‘벌거벗고 드러난 채로’로 간결하게 다듬었습니다.
  terminology: ‘산당’, ‘장신구’, ‘그들의 손에 넘기다’는 문맥과 한국어 성경 문체에 적절합니다. גַּבֵּךְ의 의미가 확정되지 않으므로 본문에서 단정하지 않고 각주에 대안을 유지합니다.
