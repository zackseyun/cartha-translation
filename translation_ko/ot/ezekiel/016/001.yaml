  text: 야훼의 말씀이 내게 임하여 이르셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 신명기적 언약명 יְהוָה를 사용합니다. 전통 번역에서는 보통 ‘주’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה
  english_pob_choice: And the word of Yahweh came
  chosen_korean: 야훼의 말씀이 … 임하여
  alternatives_korean:
  - 야훼의 말씀이 내게 왔습니다
  - 야훼의 말씀이 내게 이르셨습니다
  lexicon: HALOT
  rationale: 예언서의 정형구인 “the word … came”를 한국어에서 자연스럽게 살리되, ‘말씀’으로 דבר의 예언적 의미를 유지했습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내 쪽으로
  lexicon: HALOT
  rationale: 화자에게 향한 도달 방향을 간결한 현대 한국어 ‘내게’로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하여
  - 라고 말씀하시며
  lexicon: HALOT
  rationale: 뒤따르는 직접 화법을 여는 서술어로 기능하므로, 한국어에서는 반복적 ‘말하여’보다 예언적 계시 문맥에 맞는 ‘이르셨습니다’로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥상 대명사나 칭호가 아니라 언약 이름 יְהוָה 자체이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 예언 공식의 시제·동작상
  chosen_reading: ‘말씀이 … 임하여’로, 계시가 선지자에게 도달하는 사건성을 드러냈습니다.
  alternative_readings:
  - ‘말씀이 내게 왔습니다’로 더 평이하게 처리
  - ‘야훼께서 내게 말씀하셨습니다’로 인격적 발화를 전면화
  rationale: 히브리어 공식문구는 단순한 전달보다 계시의 도래를 강조하므로, ‘임하다’를 사용해 본문의 힘을 보존했습니다.
  doctrine_reference: 예언서 서두의 계시 공식 일반
