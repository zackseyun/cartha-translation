source:
  edition: WLC
  text: וַ/תִּזְנִ֧י אֶל בְּנֵֽי מִצְרַ֛יִם שְׁכֵנַ֖יִ/ךְ גִּדְלֵ֣י בָשָׂ֑ר וַ/תַּרְבִּ֥י אֶת תַּזְנֻתֵ֖/ךְ לְ/הַכְעִיסֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/026.yaml
  text: You prostituted yourself with the sons of Egypt[a], your neighbors, great of flesh[b], and multiplied your prostitution to provoke me to anger.
  footnotes:
  - marker: a
    text: Or 'the Egyptians.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'great of flesh,' a crude sexual description; some translations render more interpretively, such as 'lustful' or 'well-endowed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 네 이웃인 이집트 사람들, 곧 육체가 큰 사람들과 함께 몸을 팔았고, 네 몸파는 짓을 더 많이 해서 나를 격노하게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 문자적으로 ‘이집트의 아들들’입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 ‘육체가 큰’이라는 거친 성적 표현입니다. 일부 번역은 ‘정욕적인’ 또는 ‘몸집이 큰’처럼 풀어 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזְנִי
  english_pob_choice: You prostituted yourself
  chosen_korean: 몸을 팔았고
  alternatives_korean:
  - 음행하였고
  - 창녀처럼 행하였고
  - 음란하게 행동하였고
  lexicon: HALOT
  rationale: זנה의 노골적인 성적 은유를 살리되, 현대 한국어에서 자연스럽고 직설적인 표현으로 옮겼습니다.
- source_word: בְּנֵי מִצְרַיִם
  english_pob_choice: the sons of Egypt
  chosen_korean: 이집트 사람들
  alternatives_korean:
  - 이집트의 아들들
  - 이집트인들
  - 이집트의 자손들
  lexicon: HALOT
  rationale: 직역의 기형적 느낌보다 의미 전달이 우선되는 문맥이므로, POB의 각주 대안을 따라 자연스러운 집단명으로 옮겼습니다.
- source_word: גִּדְלֵי בָשָׂר
  english_pob_choice: great of flesh
  chosen_korean: 육체가 큰 사람들
  alternatives_korean:
  - 살이 큰 사람들
  - 큰 몸집의 사람들
  - 성적으로 탐욕스러운 사람들
  lexicon: HALOT
  rationale: 원문의 거친 육체적 표현을 지나치게 순화하지 않으면서도 한국어로는 이해 가능한 형태로 보존했습니다.
- source_word: תַּזְנֻתֵךְ
  english_pob_choice: your prostitution
  chosen_korean: 네 몸파는 짓
  alternatives_korean:
  - 네 음행
  - 네 창녀짓
  - 네 음란한 행위
  lexicon: HALOT
  rationale: 앞선 동사와 같은 어근 계열의 반복성을 살리면서, 반복되는 노골성을 한국어에서도 드러내는 표현을 택했습니다.
- source_word: לְהַכְעִיסֵנִי
  english_pob_choice: to provoke me to anger
  chosen_korean: 나를 격노하게 했습니다
  alternatives_korean:
  - 나를 화나게 했습니다
  - 내 분노를 일으켰습니다
  - 나를 진노하게 했습니다
  lexicon: HALOT
  rationale: הכעיס의 결과 상태를 분명히 하되, 예언서의 강한 감정 표현에 맞춰 ‘격노하게 하다’로 옮겼습니다.
theological_decisions:
- issue: 예언서의 성적 은유 강도
  chosen_reading: ‘몸을 팔았고’, ‘네 몸파는 짓’으로 원문의 충격성을 유지했습니다.
  alternative_readings:
  - ‘부정하였고’로 완화
  - ‘음행하였고’로 일반화
  rationale: 이 구절은 언약 배반을 노골적 성적 언어로 고발하므로, 의미를 완화하지 않고 독자가 원문의 수위를 느끼도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: בְּנֵי מִצְרַיִם의 처리
  chosen_reading: 의미상 자연스러운 ‘이집트 사람들’을 본문에 두고, 문자형은 주석 수준으로 보존하지 않았습니다.
  alternative_readings:
  - ‘이집트의 아들들’ 직역
  - ‘이집트인들’ 일반화
  rationale: 한국어 본문에서 ‘sons of Egypt’의 직역은 어색하므로, 의미 전달을 우선하되 원문의 집단 지시를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 5
