  text: 너는 네 이웃인 이집트 사람들[a], 곧 성기가 큰 자들[b]과 음행하였고, 네 음행을 더욱 늘려 나를 격노하게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
