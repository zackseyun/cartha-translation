theological_decisions:
- issue: 소돔의 죄를 어떻게 범주화할 것인가
  chosen_reading: 본문이 직접 말하는 교만, 풍요, 안일, 그리고 가난한 이들에 대한 무관심을 그대로 드러내고, 다른 논쟁적 죄목을 암시적으로 끼워 넣지 않았습니다.
  alternative_readings:
  - 성적 죄를 중심으로 읽히도록 번역을 조정함
  - 단순히 '잘못' 정도로 약화함
  rationale: 이 절의 히브리어는 사회적·윤리적 타락을 명시하므로, 번역은 본문이 말하는 범위를 넘지 않으면서도 그 긴장을 약화시키지 않아야 합니다.
  doctrine_reference: 번역 원칙 1, 3
