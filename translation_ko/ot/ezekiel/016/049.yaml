base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/049.yaml
  text: 'Look[a], this was the guilt of your sister Sodom: pride, fullness of bread, and prosperous ease belonged to her and to her daughters[c][b], but she did not strengthen the hand of the poor and needy.'
  footnotes:
  - marker: a
    text: Hebrew 'her daughters'—that is, the towns or settlements associated with Sodom.
    reason: cultural_note
  - marker: b
    text: Or 'fullness of bread.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'did not strengthen the hand of the poor and needy,' an idiom meaning she did not support or help them.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 이것이 바로 당신의 자매 소돔의 죄악이었습니다. 곧 교만과 먹을 것의 풍족함과 평온한 안일함이 그녀와 그녀의 딸들에게[a] 있었으나, 그녀는 가난한 이들과 궁핍한 이들을 돕지 않았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '그 딸들'은 소돔에 딸린 성읍들이나 정착지들을 가리키는 도시 은유입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어로는 직역하여 '가난한 이들과 궁핍한 이들의 손을 강하게 하지 않았다'이며, 그들을 돕거나 지원하지 않았다는 뜻입니다.
    reason: lexical_alternative
