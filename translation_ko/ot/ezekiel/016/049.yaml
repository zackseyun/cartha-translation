  text: הִנֵּה זֶ֣ה הָיָ֔ה עֲוֺ֖ן סְדֹ֣ם אֲחוֹתֵ֑/ךְ גָּא֨וֹן שִׂבְעַת לֶ֜חֶם וְ/שַׁלְוַ֣ת הַשְׁקֵ֗ט הָ֤יָה לָ/הּ֙ וְ/לִ/בְנוֹתֶ֔י/הָ וְ/יַד עָנִ֥י וְ/אֶבְי֖וֹן לֹ֥א הֶחֱזִֽיקָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/049.yaml
  text: 'Look[a], this was the guilt of your sister Sodom: pride, fullness of bread, and prosperous ease belonged to her and to her daughters[c][b], but she did not strengthen the hand of the poor and needy.'
  footnotes:
  - marker: a
    text: Hebrew 'her daughters'—that is, the towns or settlements associated with Sodom.
    reason: cultural_note
  - marker: b
    text: Or 'fullness of bread.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'did not strengthen the hand of the poor and needy,' an idiom meaning she did not support or help them.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 이것이 바로 당신 자매 소돔의 죄악이었습니다. 교만과 빵의 충만함과 평안한 안일함이 그녀와 그녀의 딸들에게 있었으나, 가난한 이들과 궁핍한 이들의 손을 붙들어 주지 않았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '자매'는 예루살렘과 비교되는 소돔의 관계를 살린 표현입니다.
    reason: source_note
  - marker: b
    text: 또는 '빵의 충만함'.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 '가난한 이들과 궁핍한 이들의 손을 붙들어 주지 않았다'는 그들을 지원하거나 도와주지 않았다는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה זֶה
  english_pob_choice: Look, this was
  chosen_korean: 보십시오, 이것이 바로
  alternatives_korean:
  - 보라, 이것이 바로
  - 보십시오, 이것이었습니다
  lexicon: HALOT
  rationale: 서두의 강조 표지를 현대 한국어의 직접적 호소형으로 살려, 예언자적 단정의 힘을 유지했습니다.
- source_word: עֲוֺן
  english_pob_choice: guilt
  chosen_korean: 죄악
  alternatives_korean:
  - 죄
  - 죄책
  - 잘못
  lexicon: HALOT
  rationale: 문맥상 단순한 행위가 아니라 소돔의 도덕적 책임과 죄의 덩어리를 가리키므로, 자연스러운 합쇼체 문맥에서 '죄악'이 가장 적절합니다.
- source_word: גָּאוֹן
  english_pob_choice: pride
  chosen_korean: 교만
  alternatives_korean:
  - 오만
  - 자만
  - 긍지
  lexicon: HALOT
  rationale: 부정적 도덕 의미를 가진 어휘이므로, 한국어 성경 문맥에서 가장 직접적인 '교만'을 택했습니다.
- source_word: שִׂבְעַת לֶחֶם
  english_pob_choice: fullness of bread
  chosen_korean: 빵의 충만함
  alternatives_korean:
  - 빵의 풍족함
  - 빵이 넉넉함
  - 음식의 풍성함
  lexicon: HALOT
  rationale: 영어 POB가 주석적으로 보존한 'fullness of bread'를 한국어에서도 직역에 가깝게 유지해, 단순한 '풍요'로 평준화하지 않았습니다.
- source_word: שַׁלְוַת הַשְׁקֵט
  english_pob_choice: prosperous ease
  chosen_korean: 평안한 안일함
  alternatives_korean:
  - 번영 속의 안일함
  - 평온한 안락
  - 안락한 평정
  lexicon: HALOT
  rationale: 물질적 안녕과 도덕적 나태/무감각이 함께 드러나는 표현이므로, '평안한 안일함'으로 두 층위를 함께 살렸습니다.
- source_word: יָד ... לֹא הֶחֱזִיקָה
  english_pob_choice: she did not strengthen the hand of
  chosen_korean: 손을 붙들어 주지 않았습니다
  alternatives_korean:
  - 손을 강하게 하지 않았습니다
  - 도와주지 않았습니다
  - 붙들어 주지 않았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 이미지를 한국어로 너무 무디게 풀지 않되, 독자에게 자연스럽게 읽히도록 '손을 붙들어 주다'로 옮겼습니다.
- source_word: עָנִי וְאֶבְיוֹן
  english_pob_choice: the poor and needy
  chosen_korean: 가난한 이들과 궁핍한 이들
  alternatives_korean:
  - 가난하고 궁핍한 이들
  - 가난한 자들과 빈궁한 자들
  - 불쌍한 이들과 궁핍한 이들
  lexicon: HALOT
  rationale: 사회적·물질적 취약성을 나타내는 한 쌍을 한국어의 중립적 현대 표현으로 살렸습니다.
theological_decisions:
- issue: 소돔의 죄를 어떻게 범주화할 것인가
  chosen_reading: 본문이 직접 말하는 교만, 풍요, 안일, 그리고 가난한 이들에 대한 무관심을 그대로 드러내고, 다른 논쟁적 죄목을 암시적으로 끼워 넣지 않았습니다.
  alternative_readings:
  - 성적 죄를 중심으로 읽히도록 번역을 조정함
  - 단순히 '잘못' 정도로 약화함
  rationale: 이 절의 히브리어는 사회적·윤리적 타락을 명시하므로, 번역은 본문이 말하는 범위를 넘지 않으면서도 그 긴장을 약화시키지 않아야 합니다.
  doctrine_reference: 번역 원칙 1, 3
