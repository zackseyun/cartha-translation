  to: 이는 내가 네가 행한 모든 일에 대하여 너를 위하여 속죄할 때에, 네가 기억하고 부끄러워하며 네 수치 때문에 더 이상 입을 열 여지[a]가 없게 하려는 것입니다[b]. 주 야훼께서 말씀하십니다.
  rationale: 목적절(‘이는 … 하려는 것입니다’)과 속죄의 시간절(‘내가 … 속죄할 때에’)을 연결하여 원문의 통사 관계를 회복했습니다. ‘입을 열 여지’로 관용구의 비유를 보존하고, 속죄의 대상 관계는 ‘너를 위하여’로 정확하고 자연스럽게 처리했습니다. 각주 표지도 해당 표현 바로 뒤에 재배치했습니다.
