source:
  edition: WLC
  text: לְמַ֤עַן תִּזְכְּרִי֙ וָ/בֹ֔שְׁתְּ וְ/לֹ֨א יִֽהְיֶה לָּ֥/ךְ עוֹד֙ פִּתְח֣וֹן פֶּ֔ה מִ/פְּנֵ֖י כְּלִמָּתֵ֑/ךְ בְּ/כַפְּרִ/י לָ/ךְ֙ לְ/כָל אֲשֶׁ֣ר עָשִׂ֔ית נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/063.yaml
  text: so that you may remember and be ashamed[a], and no longer have any opening of the mouth because of your disgrace, when I make atonement for you for all that you have done[b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'any occasion to open your mouth'; the Hebrew idiom literally says 'opening of the mouth.'
    reason: lexical_alternative
  - marker: b
    text: Or 'when I atone for you.' The Hebrew verb carries atonement/reconciliation language, not merely general forgiveness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 네가 기억하고 부끄러워하게 되며, 네 수치 때문에 더 이상 입을 열 수 없게 될 것입니다. 내가 네가 행한 모든 일에 대하여 너를 속죄할 때입니다. 주 여호와의 말씀이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 히브리어 관용구는 직역하면 '입의 여는 것'입니다. 자연스러운 한국어로는 '입을 열 수 있는 여지'를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: כפר는 단순한 용서보다 속죄/화목의 의미를 지니는 동사입니다. 문맥상 하나님의 회복 행위를 가리킵니다.
    reason: theological_note
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: so that
  chosen_korean: 그리하여
  alternatives_korean:
  - 그렇게 하여
  - 네가 기억하도록
  lexicon: HALOT
  rationale: 목적/결과를 나타내는 לְמַעַן의 흐름을 자연스러운 문맥 연결어로 살리면서도, 뒤의 두 절차(기억함, 부끄러워함)를 매끈하게 이어 줍니다.
- source_word: וָבֹשְׁתְּ
  english_pob_choice: and be ashamed
  chosen_korean: 부끄러워하게 되며
  alternatives_korean:
  - 수치를 당하게 되며
  - 부끄러움을 느끼게 되며
  lexicon: HALOT
  rationale: בוש의 핵심 의미인 수치/부끄러움을 현대 한국어에서 가장 직접적으로 전달합니다. 수동적 '수치를 당하다'보다 여기서는 상태 변화에 더 가깝게 옮겼습니다.
- source_word: פִּתְחוֹן פֶּה
  english_pob_choice: any opening of the mouth
  chosen_korean: 입을 열 수 없게
  alternatives_korean:
  - 입을 열 여지가 없게
  - 말문이 막히게
  lexicon: HALOT
  rationale: 히브리어 관용구의 이미지인 '입의 여는 것'을 지나치게 풀지 않고, 한국어에서 같은 효과를 내는 표현으로 옮겼습니다. '말문이 막히다'는 의미는 살지만 원문 이미지를 덜 보존합니다.
- source_word: בְּכַפְּרִי לָךְ
  english_pob_choice: when I make atonement for you
  chosen_korean: 내가 … 너를 속죄할 때입니다
  alternatives_korean:
  - 내가 … 너를 속죄할 때
  - 내가 … 너를 대속할 때입니다
  lexicon: HALOT
  rationale: כפר의 제의적·신학적 무게를 살리기 위해 단순히 '용서하다'가 아니라 '속죄하다'를 택했습니다. 문맥상 회복을 위한 하나님의 행위라는 점도 보존합니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 여호와의 말씀이십니다
  alternatives_korean:
  - 주 하나님의 말씀이십니다
  - 주 여호와께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언서 공식 종결구를 한국어 성경 문체에 맞게 옮기되, אֲדֹנָי יְהוִה의 결합을 보존했습니다. 본문 전통에 따라 야훼는 '여호와'로 두었습니다.
theological_decisions:
- issue: כפר의 신학적 함의 보존
  chosen_reading: '''속죄하다''로 옮겨, 단순한 감정적 용서가 아니라 하나님이 죄를 처리하시는 제의적·관계적 의미를 드러냈습니다.'
  alternative_readings:
  - 용서하다
  - 사해 주다
  - 화해시키다
  rationale: 문맥은 예루살렘의 수치 제거를 하나님의 언약적 처분과 연결합니다. 따라서 히브리어의 속죄/회복 어휘를 약화시키지 않는 것이 중요합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
