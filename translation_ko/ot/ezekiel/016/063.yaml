  source_fidelity: 수정 전 본문은 לְמַעַן의 목적 용법을 단순 결과 연결어로 다소 약화하고, בְּכַפְּרִי의 시간절을 독립문인 “때입니다”로 처리하여 원문의 문장 관계가 무너졌습니다. 또한 לָךְ는 ‘너를 속죄하다’보다 ‘너를 위하여 속죄하다’로 옮기는 것이 문법과 한국어 어법 모두에 충실합니다. ‘입을 열 여지’는 פִּתְחוֹן פֶּה의 관용적 표현을 적절히 보존합니다.
  naturalness: ‘내가 … 너를 위하여 속죄할 때에’로 시간절을 바꾸고, 그 결과를 같은 문장 안에 연결하여 현대 표준어 합쇼체로 자연스럽게 다듬었습니다. ‘너를 속죄하다’와 ‘때입니다’의 비문도 해소했습니다.
  terminology: כפר는 ‘속죄하다’로 유지하되 여격 לָךְ를 ‘너를 위하여’로 명시했습니다. 아도나이 יהוה는 감사 자료의 이름 방침에 맞추어 ‘주 야훼’로 옮겼습니다. נְאֻם은 ‘말씀하십니다’로 자연스럽게 반영했습니다.
