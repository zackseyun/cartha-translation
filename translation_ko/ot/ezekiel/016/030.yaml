source:
  edition: WLC
  text: מָ֤ה אֲמֻלָה֙ לִבָּתֵ֔/ךְ נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה בַּ/עֲשׂוֹתֵ/ךְ֙ אֶת כָּל אֵ֔לֶּה מַעֲשֵׂ֥ה אִשָּֽׁה זוֹנָ֖ה שַׁלָּֽטֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/030.yaml
  text: How weak your heart is[a], declares the Lord GOD, when you do all these things, the deeds of a brazen prostitute,
  footnotes:
  - marker: a
    text: Or 'the deeds of a domineering prostitute'; the Hebrew adjective can convey bold, overbearing, or shameless behavior.
    reason: lexical_alternative
translation:
  language: ko
  text: “당신의 마음은 어찌 그리 약합니까? 주 야훼의 말씀입니다. 당신이 이 모든 일을 하는 것은 뻔뻔한[a] 매춘부의 행위입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지배적인’ 또는 ‘오만한’. 히브리어 형용사는 대담하고 수치 없는 태도, 또는 거만하고 지배적인 태도를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֲמֻלָה לִבָּתֵךְ
  english_pob_choice: How weak your heart is
  chosen_korean: 당신의 마음은 얼마나 약합니까
  alternatives_korean:
  - 당신의 마음은 얼마나 쇠약합니까
  - 당신의 마음은 얼마나 병들었습니까
  lexicon: HALOT
  rationale: 감탄문의 정도를 살리면서, לִבָּתֵךְ의 ‘마음’ 이미지를 유지하고 אֲמֻלָה의 ‘약함/쇠약함’을 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 여호와의 말씀이니라
  alternatives_korean:
  - 주 하나님 여호와의 말씀이니라
  - 주 야훼의 말씀입니다
  lexicon: HALOT
  rationale: 예언 선포 공식 נְאֻם을 ‘말씀이니라’로, אֲדֹנָי יְהוִה를 전통적 한국어 성서 관용에 따라 ‘주 여호와’로 옮겼습니다.
- source_word: מַעֲשֵׂה אִשָּׁה זוֹנָה שַׁלָּטֶת
  english_pob_choice: the deeds of a brazen prostitute
  chosen_korean: 뻔뻔한 창녀의 행위
  alternatives_korean:
  - 대담한 창녀의 행위
  - 주제넘게 행세하는 창녀의 행위
  lexicon: HALOT
  rationale: זוֹנָה의 성적·도덕적 비난을 ‘창녀’로 직역하고, שַׁלָּטֶת의 ‘대담함/뻔뻔함/오만함’ 가운데 문맥상 ‘뻔뻔한’으로 압축해 POB의 ‘brazen’ 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 예언자적 비난의 수사 강도
  chosen_reading: ‘뻔뻔한 창녀의 행위’로 직설적으로 옮겨, 원문의 강한 도덕적 책망을 완화하지 않았습니다.
  alternative_readings:
  - ‘무례한 창녀의 행위’
  - ‘음란한 여인의 행위’
  rationale: בַּעֲשׂוֹתֵךְ אֶת כָּל אֵלֶּה가 단순 묘사가 아니라 전체 행위를 규정하는 판단문이므로, 한국어에서도 수사적 충격을 유지해야 합니다.
  doctrine_reference: 예언서의 언약적 책망과 죄 고발의 정직한 번역 원칙
- issue: 직접 인용의 어조
  chosen_reading: 직접 화법 안의 책망문을 합쇼체로 유지하되, 단정적 선포는 ‘말씀이니라’로 처리했습니다.
  alternative_readings:
  - 직접 화법을 평서형으로 통일
  - 더 고전적인 종결 어미 사용
  rationale: 본문은 하나님께서 예루살렘을 향해 선포하시는 예언이므로, 현대 문체를 유지하면서도 신적 발화의 권위를 분명히 해야 합니다.
  doctrine_reference: 번역 스타일 가이드 — 현대 표준어 합쇼체와 예언문 어조
