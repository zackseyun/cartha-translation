  text: וַ/אֲחוֹתֵ֨/ךְ הַ/גְּדוֹלָ֤ה שֹֽׁמְרוֹן֙ הִ֣יא וּ/בְנוֹתֶ֔י/הָ הַ/יּוֹשֶׁ֖בֶת עַל שְׂמֹאולֵ֑/ךְ וַ/אֲחוֹתֵ֞/ךְ הַ/קְּטַנָּ֣ה מִמֵּ֗/ךְ הַ/יּוֹשֶׁ֨בֶת֙ מִֽ/ימִינֵ֔/ךְ סְדֹ֖ם וּ/בְנוֹתֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/046.yaml
  text: Your older sister is Samaria[a], she and her daughters, who dwell to your left; and your younger sister, who dwells to your right, is Sodom and her daughters.
  footnotes:
  - marker: a
    text: That is, from Jerusalem's perspective, Samaria is to the north and Sodom to the south.
    reason: cultural_note
translation:
  language: ko
  text: 네 언니는 사마리아입니다. 그와 그 딸들은 네 왼쪽에 살고 있으며, 네 동생은 소돔입니다. 그와 그 딸들은 네 오른쪽에 삽니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 예루살렘의 관점에서 사마리아는 북쪽에 있고 소돔은 남쪽에 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: אֲחוֹתֵךְ
  english_pob_choice: your older sister / your younger sister
  chosen_korean: 언니 / 동생
  alternatives_korean:
  - 누이
  - 자매
  lexicon: HALOT
  rationale: 비유적 친족 표현을 한국어로 자연스럽게 살리기 위해 일반적인 친족 호칭을 사용했습니다. 여성 화자에게는 ‘언니/동생’이 상하 관계를 가장 직접적으로 전달합니다.
- source_word: הַגְּדוֹלָה
  english_pob_choice: older
  chosen_korean: 언니
  alternatives_korean:
  - 더 큰
  - 큰
  lexicon: HALOT
  rationale: 직역하면 ‘큰’이지만, 자매 관계의 비유에서는 한국어에서 ‘언니’가 연령상 우위를 가장 자연스럽게 나타냅니다.
- source_word: שֹׁמְרוֹן
  english_pob_choice: Samaria
  chosen_korean: 사마리아
  alternatives_korean:
  - 사마리아 성
  - 사마리아 사람들
  lexicon: HALOT
  rationale: 고유명사는 통용 표기인 ‘사마리아’를 따랐습니다.
- source_word: וּבְנוֹתֶיהָ
  english_pob_choice: she and her daughters
  chosen_korean: 그와 그 딸들
  alternatives_korean:
  - 그와 그 주변 마을들
  - 그와 그 속한 성읍들
  lexicon: HALOT
  rationale: ‘딸들’은 종속된 도시들을 가리키는 비유를 보존합니다. 주어는 사마리아와 그 딸들을 함께 묶는 구조를 따라 ‘그와’로 처리했습니다.
- source_word: הַיּוֹשֶׁבֶת
  english_pob_choice: who dwell
  chosen_korean: 살고 있으며
  alternatives_korean:
  - 거주하며
  - 앉아 있으며
  lexicon: HALOT
  rationale: יָשַׁב의 기본 의미인 ‘거주하다/살다’를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: עַל שְׂמֹאולֵךְ / מִימִינֵךְ
  english_pob_choice: to your left / to your right
  chosen_korean: 네 왼쪽 / 네 오른쪽
  alternatives_korean:
  - 네 좌편 / 네 우편
  - 네 북쪽 / 네 남쪽
  lexicon: HALOT
  rationale: 히브리어의 신체 기준 공간 표현을 그대로 살려 본문에서는 ‘왼쪽/오른쪽’으로 옮겼습니다. 지리적 함의는 본문이 아니라 각주에서 설명하는 것이 더 충실합니다.
- source_word: סְדֹם
  english_pob_choice: Sodom
  chosen_korean: 소돔
  alternatives_korean:
  - 소돔 성
  lexicon: HALOT
  rationale: 고유명사는 통용 표기인 ‘소돔’을 따랐습니다.
theological_decisions:
- issue: 좌우 표현의 지리적 함의
  chosen_reading: 본문은 ‘네 왼쪽’과 ‘네 오른쪽’을 유지하고, 방향의 지리적 의미는 각주로 처리합니다.
  alternative_readings:
  - 북쪽/남쪽으로 풀어 쓰기
  rationale: 히브리어는 몸 기준의 공간 표현을 사용하며, 본문에 곧바로 북/남을 넣으면 해석을 본문에 앞세우게 됩니다. 원문 이미지를 보존하는 것이 우선입니다.
  doctrine_reference: 'Translation philosophy: source-directed imagery preservation'
