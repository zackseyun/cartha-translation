  to: 너의 큰언니는 사마리아[a]이며, 사마리아와 그 딸들은 네 왼쪽에 살고 있습니다. 너보다 어린 네 여동생은 소돔이며, 소돔과 그 딸들은 네 오른쪽에 살고 있습니다.
