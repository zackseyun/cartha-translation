id: EZK.16.55
reference: Ezekiel 16:55
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲחוֹתַ֗יִ/ךְ סְדֹ֤ם וּ/בְנוֹתֶ֨י/הָ֙ תָּשֹׁ֣בְןָ לְ/קַדְמָתָ֔/ן וְ/שֹֽׁמְרוֹן֙ וּ/בְנוֹתֶ֔י/הָ תָּשֹׁ֖בְןָ לְ/קַדְמָתָ֑/ן וְ/אַתְּ֙ וּ/בְנוֹתַ֔יִ/ךְ תְּשֻׁבֶ֖ינָה לְ/קַדְמַתְ/כֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/055.yaml
  text: And your sisters[a], Sodom and her daughters, will return to their former state, and Samaria and her daughters will return to their former state, and you and your daughters will return to your former state.
  footnotes:
  - marker: a
    text: Or 'will be restored to their former condition.' The Hebrew more literally says 'will return to their former state.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네 자매인 소돔과 그 딸들은 이전 상태로 돌아갈 것이며, 사마리아와 그 딸들도 이전 상태로 돌아갈 것이고, 너와 네 딸들도 이전 상태로 돌아갈 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이전 상태로 회복될 것입니다.’ 히브리어는 더 문자적으로 ‘이전 상태로 돌아갈 것입니다’라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲחוֹתַיִךְ
  english_pob_choice: your sisters
  chosen_korean: 네 자매들
  alternatives_korean:
  - 네 자매 도시들
  - 네 자매들, 곧 관련된 도시들
  lexicon: HALOT
  rationale: 도시를 의인화한 자매 이미지가 본문에서 중요하므로, 설명을 덧붙이지 않고 ‘네 자매들’을 유지했습니다.
- source_word: בְנוֹתֶיהָ / בְנוֹתַיִךְ
  english_pob_choice: her daughters / your daughters
  chosen_korean: 그 딸들 / 네 딸들
  alternatives_korean:
  - 그 산하 도시들 / 네 산하 도시들
  - 그 속한 마을들 / 네 속한 마을들
  lexicon: HALOT
  rationale: 히브리어의 직역상 ‘딸들’이지만, 예언서의 도시-의인화 비유를 살리기 위해 관계를 풀어쓰지 않았습니다.
- source_word: תָּשֹׁבְנָה / תְּשֻׁבֶינָה
  english_pob_choice: will return
  chosen_korean: 돌아갈 것입니다
  alternatives_korean:
  - 회복될 것입니다
  - 되돌아갈 것입니다
  lexicon: HALOT
  rationale: 반복되는 שוב의 기본 의미를 살려 ‘돌아가다’로 옮기되, 한국어 문장에서는 미래형으로 자연스럽게 표현했습니다.
- source_word: לְקַדְמָתָן / לְקַדְמַתְכֶן
  english_pob_choice: to their former state / to your former state
  chosen_korean: 전과 같은 상태로
  alternatives_korean:
  - 옛 상태로
  - 이전의 상태로
  lexicon: HALOT
  rationale: ‘전(前)과 같은 상태’는 원문의 ‘이전의 상태’라는 뜻을 자연스럽게 살리면서, 회복/복귀의 함의를 과도하게 덧붙이지 않습니다.
- source_word: וְ
  english_pob_choice: and
  chosen_korean: 그리고 / 그리고
  alternatives_korean:
  - 또
  - 또한
  lexicon: HALOT
  rationale: 세 병렬 절의 연결을 그대로 드러내기 위해 단순 접속을 유지했습니다.
theological_decisions:
- issue: 소돔과 사마리아, 예루살렘의 ‘돌아감’이 의미하는 회복의 방식
  chosen_reading: ‘전과 같은 상태로 돌아갈’로 옮겨, 회복의 메커니즘이나 최종 신학을 단정하지 않았습니다.
  alternative_readings:
  - ‘회복될 것입니다’로 보다 해석적으로 옮길 수 있음
  rationale: 본문은 שוב와 ‘former state’의 반복으로 역전/회복을 말하지만, 소돔의 회복 가능성에 대한 신학적 쟁점은 본문 밖의 논쟁이므로 번역에서 해결하지 않았습니다.
  doctrine_reference: 본문이 드러내는 긴장을 보존합니다.
