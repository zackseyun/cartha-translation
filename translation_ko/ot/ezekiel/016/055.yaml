  to: 그리고 네 자매인 소돔과 그 딸들은 이전 상태로 돌아갈 것이며, 사마리아와 그 딸들도 이전 상태로 돌아갈 것이고, 너와 네 딸들도 이전 상태로 돌아갈 것입니다.[a]
