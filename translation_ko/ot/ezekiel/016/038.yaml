translation:
  language: ko
  text: 내가 너를 음행하는 여자들과 피를 흘리는 여자들의 판결로 심판하겠으며, 너를 분노와 질투의 피에 내주겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘피에’, 곧 피 흘림의 형벌 또는 분노와 질투 가운데 가해지는 피의 심판을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁפַטְתִּיךְ
  english_pob_choice: And I will judge you
  chosen_korean: 내가 너를 … 심판하겠으며
  alternatives_korean:
  - 내가 너를 … 판단하겠습니다
  - 내가 너를 … 재판하겠습니다
  lexicon: HALOT
  rationale: שׁפט는 여기서 하나님의 사법적 행위를 가리키므로, ‘심판하다’가 법정적 의미와 예언서의 엄중한 뉘앙스를 함께 살립니다.
- source_word: מִשְׁפְּטֵי
  english_pob_choice: with the judgments of
  chosen_korean: …의 판결로
  alternatives_korean:
  - …의 심판으로
  - …의 판단으로
  lexicon: HALOT
  rationale: 구성형 복수는 판단의 기준/양식을 나타내므로, 한국어에서는 자연스러운 법정 표현인 ‘판결로’로 옮겨 법적 강도를 유지했습니다.
- source_word: נֹאֲפוֹת וְשֹׁפְכֹת דָּם
  english_pob_choice: women who commit adultery and who shed blood
  chosen_korean: 음행하는 여자들과 피를 흘리는 여자들
  alternatives_korean:
  - 간음하는 여자들과 피를 흘리는 여자들
  - 간음한 여자들과 살인하는 여자들
  lexicon: HALOT
  rationale: 여기서는 여성 복수 분사로 된 비유적 표현이므로, ‘음행하는 여자들’과 ‘피를 흘리는 여자들’로 병렬을 살려 원문의 도덕적 고발을 직접적으로 드러냈습니다.
- source_word: וּנְתַתִּיךְ דַּם
  english_pob_choice: and I will give you over to blood
  chosen_korean: 너를 … 피에 내주겠습니다
  alternatives_korean:
  - 너를 … 피로 넘기겠습니다
  - 너를 … 피의 심판에 내주겠습니다
  lexicon: HALOT
  rationale: נתן + 목적어 보충 구조는 ‘넘겨주다/내주다’의 사법적 인도를 뜻하므로, 해석을 덧붙이지 않으면서도 한국어에서 자연한 ‘내주다’로 옮겼습니다.
- source_word: חֵמָה וְקִנְאָה
  english_pob_choice: in wrath and jealousy
  chosen_korean: 분노와 질투
  alternatives_korean:
  - 진노와 질투
  - 노여움과 질투
  lexicon: HALOT
  rationale: חֵמָה는 격렬한 분노, קִנְאָה는 언약적 질투를 가리키므로, ‘분노와 질투’가 본문의 심판·언약 이미지를 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 하나님의 ‘질투’와 징계의 언어를 어떻게 보존할 것인가
  chosen_reading: ‘분노와 질투의 피에 내주겠습니다’로 번역해, 하나님이 배신당한 언약의 주로서 내리는 심판의 긴장을 유지했습니다.
  alternative_readings:
  - ‘분노와 열심의 피에 내주겠습니다’
  - ‘분노와 질투 가운데 피흘리게 하겠습니다’
  rationale: 본문은 혼인 비유와 재판 언어를 함께 사용하므로, 이를 완화하지 않고 ‘질투’를 그대로 살려 언약적 배신에 대한 하나님의 반응을 드러내는 편이 원문에 더 충실합니다.
  doctrine_reference: 예언적 심판 언어와 언약적 질투의 병존을 보존
