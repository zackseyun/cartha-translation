  - 네 높아지던 날에
  lexicon: HALOT
  rationale: גאון의 부정적 의미를 ‘교만’으로 옮기고, 시간표현을 자연스럽게 풀어 문장의 공세적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 수사적 질문의 강도
  chosen_reading: 반문형으로 옮겨, 예루살렘의 죄를 책망하는 예언자적 공격성을 유지했습니다.
  alternative_readings:
  - 평서형으로 ‘네 입에 올리는 이야기거리가 아니었다’고 옮김
  rationale: 본문은 단순 정보가 아니라 책망의 수사로 기능하므로, 한국어에서도 그 압박감을 보존하는 것이 중요합니다.
  doctrine_reference: 예언서 수사와 문맥적 기능 보존
