  yaml_path: translation/ot/ezekiel/016/056.yaml
  text: Was not Sodom your sister a byword in your mouth in the day of your pride?[a]
  footnotes:
  - marker: a
    text: Or 'a report,' 'something spoken of,' or 'an object of talk.' The Hebrew likely refers to Sodom as a notorious example on Jerusalem's lips.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 누님 소돔이 네 입에 올리는 이야기거리가 아니었느냐 — 네가 교만하던 날에?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소문’, ‘입에 오르내리는 것’, ‘화제거리’로 볼 수 있습니다. 히브리어는 여기서 소돔이 예루살렘 입에서 악명 높은 본보기로 거론되었음을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  english_pob_choice: Was not
  chosen_korean: 아니었느냐
  alternatives_korean:
  - 아니었습니까
  - 아니었느냐고
  lexicon: HALOT
  rationale: 부정과 함께 오는 수사적 질문의 힘을 살리기 위해 평서가 아니라 반문형으로 옮겼습니다.
- source_word: הָיְתָה
