  lexicon: HALOT
  rationale: 히브리어가 단순한 ‘보고된 소식’보다 입에 오르내리는 통상적 화제를 가리키므로, 문맥상 비난과 조롱의 뉘앙스를 담는 자연스러운 표현을 택했습니다.
- source_word: בְּפִיךְ
