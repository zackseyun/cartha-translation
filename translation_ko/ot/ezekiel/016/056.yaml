review_pass:
  verdict: revise
  source_fidelity: 히브리어의 수사적 부정 의문문, ‘자매’ 도시 은유, ‘입에’라는 발화 관용구, 그리고 교만의 때라는 시간 표현은 대체로 반영되었습니다. 다만 ‘입에 올리는 이야기거리’는 한국어에서 주체·표현 결합이 부자연스럽고, לִשְׁמוּעָה의 ‘말/소문으로 거론됨’이라는 의미를 충분히 살리지 못합니다.
  naturalness: 초안의 ‘네’와 ‘-느냐’는 요청된 현대 격식체 합쇼체와 맞지 않습니다. 또한 ‘소돔이 네 입에 올리는 이야기거리’는 소돔이 이야기를 올리는 듯하게 읽힐 수 있습니다. ‘당신의 자매 소돔은 … 당신의 입에 오르내리는 말이 아니었습니까?’가 자연스럽고 문법적으로도 명확합니다.
  terminology: אֲחוֹתֵךְ는 에스겔 16장의 도시 의인화 은유를 보존하는 ‘당신의 자매’로 옮기는 것이 적절합니다. גְּאוֹנָיִךְ는 부정적 의미의 ‘교만’이 적합합니다. לִשְׁמוּעָה는 본문에서는 ‘입에 오르내리는 말’로 번역하고, 각주에서 ‘소문/들은 말/화제’의 어휘 범위를 제시할 수 있습니다.
  issues:
