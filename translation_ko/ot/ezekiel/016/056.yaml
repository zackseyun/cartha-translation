    rationale: 이 표현은 소돔이 ‘이야기거리’를 입에 올리는 것으로 문법적으로 오해될 수 있습니다. בְּפִיךְ와 לִשְׁמוּעָה의 결합은 ‘당신의 입에 오르내리는 말’로 옮기면 자연스럽고 원문의 발화 관용구도 보존됩니다.
  - severity: low
