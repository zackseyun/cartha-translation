revisions:
- from: 네 누님 소돔이 네 입에 올리는 이야기거리가 아니었느냐 — 네가 교만하던 날에?[a]
  to: 당신의 자매 소돔은 당신이 교만하던 날에 당신의 입에 오르내리는 말이 아니었습니까?[a]
  rationale: 합쇼체를 일관되게 적용하고, 도시를 가리키는 ‘자매’ 은유를 보존했습니다. 또한 ‘입에 오르내리는 말’이라는 자연스러운 한국어 관용 표현으로 히브리어의 ‘입에 있는 말/소문’이라는 의미를 재현했습니다. 각주는 가능한 어휘 범위를 제시하되, 본문만으로 ‘악명 높은 본보기’라는 해석을 단정하지 않도록 조정했습니다.
