  chosen_korean: 네 입에
  alternatives_korean:
  - 네 입술에
  - 네 입속에
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 유지해, 말과 발화의 영역을 분명히 드러냈습니다.
- source_word: גְּאוֹנָיִךְ
  english_pob_choice: your pride
  chosen_korean: 네가 교만하던 날에
