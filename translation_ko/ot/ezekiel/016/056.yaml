  rationale: 단순 과거 상태를 가리키므로 ‘되다’보다 존재/상태의 서술인 ‘-이-’를 살렸습니다.
- source_word: לִשְׁמוּעָה
  english_pob_choice: a byword
  chosen_korean: 이야기거리
