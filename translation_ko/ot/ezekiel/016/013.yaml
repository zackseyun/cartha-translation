  to: 당신은 금과 은으로 몸을 꾸몄고, 당신의 의복은 고운 아마포와 비단[b]과 수놓은 천이었습니다. 당신은 고운 가루와 꿀과 기름을 먹고, 매우 아름다워져 왕권에 이르렀습니다.[a]
  rationale: 문체를 현대 합쇼체로 통일하고, 고급 직물 명칭을 자연스러운 표준어로 다듬었습니다. 무엇보다 각주 [a]와 [b]를 각각 설명 대상인 ‘왕권’과 ‘비단’에 직접 연결하여 원어상의 해석·어휘 불확실성을 정확히 표시했습니다. ‘왕권에 이르렀습니다’는 왕정적 지위로의 상승이라는 본문의 비유를 보존하면서도 여성 형상에 ‘왕위’나 ‘왕후’를 단정적으로 부과하지 않습니다.
