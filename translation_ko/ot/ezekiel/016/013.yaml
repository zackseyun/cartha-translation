  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תַּעְדִּ֞י זָהָ֣ב וָ/כֶ֗סֶף וּ/מַלְבּוּשֵׁ/ךְ֙ ששי וָ/מֶ֨שִׁי֙ וְ/רִקְמָ֔ה סֹ֧לֶת וּ/דְבַ֛שׁ וָ/שֶׁ֖מֶן אכלתי וַ/תִּ֨יפִי֙ בִּ/מְאֹ֣ד מְאֹ֔ד וַֽ/תִּצְלְחִ֖י לִ/מְלוּכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/013.yaml
  text: You adorned yourself with gold and silver[a], and your clothing was fine linen, silk, and embroidered cloth. You ate fine flour, honey, and oil[b], and you became exceedingly beautiful and prospered to royalty.
  footnotes:
  - marker: a
    text: Or 'prospered into a kingdom' or 'came to queenship.' The Hebrew expression can denote successful advancement into royal status more generally.
    reason: alternative_reading
  - marker: b
    text: The precise identification of the textile rendered 'silk' is uncertain; it refers to a luxurious fabric.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 금과 은으로 몸을 꾸몄고, 당신의 의복은 고운 아마포와 비단[b]과 수놓은 천이었습니다. 당신은 고운 가루와 꿀과 기름을 먹고, 매우 아름다워져 왕권에 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 ‘번성하여 왕적 지위에 이르다’, ‘왕국에 이르다’, 또는 여성 형상에 맞추어 ‘왕후의 지위에 이르다’로 이해될 수 있습니다. 여기서는 특정 제도적 의미를 한정하지 않고 왕적 지위로의 성공적인 상승을 나타냅니다.
    reason: alternative_reading
  - marker: b
    text: ‘비단’으로 옮긴 히브리어 직물 명칭의 정확한 종류는 확실하지 않습니다. 고급 직물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעְדִּי
  english_pob_choice: You adorned yourself
  chosen_korean: 몸을 꾸몄으며
  alternatives_korean:
  - 스스로 장식했으며
  - 치장했으며
  lexicon: HALOT
  rationale: 어근 עדה의 ‘장식하다/꾸미다’ 의미를 살리되, 문맥의 직접목적어들과 자연스럽게 이어지도록 현대 한국어로 다듬었습니다.
- source_word: שֵׁשִׁי / מֶשִׁי / רִקְמָה
  english_pob_choice: fine linen, silk, and embroidered cloth
  chosen_korean: 고운 베실과 비단과 수놓은 천
  alternatives_korean:
  - 고운 모시와 비단과 수놓은 옷감
  - 고운 베와 비단과 자수 놓인 천
  lexicon: HALOT
  rationale: שֵׁשׁ은 고급 리넨 계열을 가리키므로 ‘고운 베실’로, מֶשִׁי는 전통적으로 ‘비단’이 자연스러워 그대로 옮겼으며, רִקְמָה는 직물 자체를 가리키므로 ‘수놓은 천’으로 옮겼습니다.
- source_word: סֹלֶת וּדְבַשׁ וָשֶׁמֶן
  english_pob_choice: fine flour, honey, and oil
  chosen_korean: 고운 가루와 꿀과 기름
  alternatives_korean:
  - 고운 밀가루와 꿀과 기름
  - 고급 가루와 꿀과 기름
  lexicon: HALOT
  rationale: סֹלֶת는 고운 곡물 가루를 뜻하므로 ‘고운 가루’가 직역에 가깝고, דְבַשׁ과 שֶׁמֶן은 각각 ‘꿀’과 ‘기름’으로 간결하게 유지했습니다.
- source_word: וַתִּצְלְחִי לִמְלוּכָה
  english_pob_choice: prospered to royalty
  chosen_korean: 왕권에 이르렀습니다
  alternatives_korean:
  - 왕권으로 번영하였습니다
  - 왕위에 이르렀습니다
  - 왕국에 이르렀습니다
  lexicon: HALOT
  rationale: צָלַח은 단순 번영보다 ‘성공적으로 이르다/발전하다’의 뉘앙스가 있고, לִמְלוּכָה는 여성형 수신자에게도 ‘왕권/왕적 지위’로 포괄적으로 옮기는 것이 본문의 승격 이미지를 가장 잘 보존합니다.
theological_decisions:
- issue: יַלד? Actually metaphorical royal elevation of Jerusalem
  chosen_reading: 예루살렘이 값비싼 치장과 음식으로 번성하여 왕적 지위에 이르는 비유로 읽었습니다.
  alternative_readings:
  - 단순한 물질적 풍요의 묘사로만 읽는 것
  - ‘왕국이 되었다’로 국가적 성립을 강조하는 것
  rationale: 본문은 혼인-치장 이미지와 함께 도시의 지위 상승을 그리므로, ‘왕권’은 여성적 은유를 해치지 않으면서 גם 정치적 승격을 함께 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
