  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֤ת כָּל תּוֹעֲבֹתַ֨יִ/ךְ֙ וְ/תַזְנֻתַ֔יִ/ךְ לֹ֥א זכרתי אֶת יְמֵ֣י נְעוּרָ֑יִ/ךְ בִּֽ/הְיוֹתֵ/ךְ֙ עֵרֹ֣ם וְ/עֶרְיָ֔ה מִתְבּוֹסֶ֥סֶת בְּ/דָמֵ֖/ךְ הָיִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/022.yaml
  text: And in all your abominations and your prostitutions[a], you did not remember the days of your youth, when you were naked and bare[c][b], wallowing in your blood.
  footnotes:
  - marker: a
    text: Or 'your acts of prostitution'; the Hebrew uses prostitution imagery for Jerusalem's covenantal and idolatrous unfaithfulness.
    reason: lexical_alternative
  - marker: b
    text: Or 'naked and exposed.'
    reason: lexical_alternative
  - marker: c
    text: Or 'squirming in your blood' or 'kicking about in your blood'; the Hebrew verb depicts a helpless, blood-covered condition.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네 모든 가증한 일들과 네 음행 가운데서도 너는 네 젊은 날들을 기억하지 않았습니다. 곧 네가 벌거벗고 알몸으로, 네 피 속에서 뒹굴고 있던 때를 말입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘음행’은 여기서 문자적 성적 행위만이 아니라 예언서가 즐겨 쓰는 언약적·우상숭배적 불신실함의 은유를 포함합니다.
    reason: theological_note
  - marker: b
    text: 또는 ‘드러난 채’ 또는 ‘노출된 채’.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘네 피 속에서 버둥거리고 있던’처럼, 무력하게 피투성이가 된 상태를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תּוֹעֲבֹתַיִךְ
  english_pob_choice: your abominations
  chosen_korean: 네 모든 가증한 일들
  alternatives_korean:
  - 네 모든 가증한 것들
  - 네 모든 혐오스러운 행위들
  lexicon: HALOT
  rationale: תּוֹעֵבָה는 예언서에서 도덕적·제의적 역겨움을 가리키므로, 한국어로는 완곡한 ‘잘못’보다 ‘가증한 일들’이 심판의 강도를 더 잘 보존합니다.
- source_word: תַזְנֻתַיִךְ
  english_pob_choice: your prostitutions
  chosen_korean: 네 음행
  alternatives_korean:
  - 네 창기질
  - 네 음란 행위
  lexicon: HALOT
  rationale: 예언서의 성적 은유를 살리되, 한국어 합쇼체 본문에서 지나치게 거칠지 않게 ‘음행’으로 옮겨, 언약적 불신실함을 포함하는 구체적 성적 이미지를 유지했습니다.
- source_word: עֵרֹם וְעֶרְיָה
  english_pob_choice: naked and bare
  chosen_korean: 벌거벗고 알몸으로
  alternatives_korean:
  - 벌거벗고 드러난 채
  - 나체로 드러나
  lexicon: HALOT
  rationale: 중첩 표현의 강조를 살리기 위해 두 겹의 한국어 표현을 유지했습니다. ‘알몸’은 노출과 취약성을, ‘벌거벗고’는 상태를 직접적으로 드러냅니다.
- source_word: מִתְבּוֹסֶסֶת בְּדָמֵךְ
  english_pob_choice: wallowing in your blood
  chosen_korean: 네 피 속에서 뒹굴고 있던
  alternatives_korean:
  - 네 피 속에서 버둥거리던
  - 네 피에 뒤범벅된
  lexicon: HALOT
  rationale: 히트폴엘의 반복적·자기연루적 동작성을 살려 ‘뒹굴고 있던’으로 옮겼습니다. POB의 ‘wallowing’이 지닌 생생한 혈흔 이미지를 한국어로 유지합니다.
- source_word: לֹא זכרתי אֶת יְמֵי נְעוּרָיִךְ
  english_pob_choice: you did not remember the days of your youth
  chosen_korean: 너는 네 젊은 날들을 기억하지 않았습니다
  alternatives_korean:
  - 너는 네 젊은 시절을 기억하지 않았습니다
  - 너는 네 청춘의 날들을 기억하지 않았습니다
  lexicon: HALOT
  rationale: 직역의 ‘젊은 날들’이 원문의 시간적 대조를 가장 자연스럽게 보존합니다. 주어·목적어 관계도 한국어에서 무리 없이 드러납니다.
theological_decisions:
- issue: 예언자적 성적 은유를 완화할 것인가
  chosen_reading: ‘음행’과 ‘뒹굴고 있던’ 같은 직접적 표현을 유지하여, 예루살렘의 언약 배반과 수치의 이미지를 희석하지 않았습니다.
  alternative_readings:
  - ‘불신실함’
  - ‘부정함’
  - ‘더럽혀진 상태’
  rationale: 에스겔 16장은 충격적인 성적 은유로 언약 파기를 고발하므로, 추상화하면 본문의 수사적·신학적 압력이 약해집니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
