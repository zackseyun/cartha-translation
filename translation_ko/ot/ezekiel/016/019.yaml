id: EZK.16.19
reference: Ezekiel 16:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לַחְמִ/י֩ אֲשֶׁר נָתַ֨תִּי לָ֜/ךְ סֹ֣לֶת וָ/שֶׁ֤מֶן וּ/דְבַשׁ֙ הֶֽאֱכַלְתִּ֔י/ךְ וּ/נְתַתִּ֧י/הוּ לִ/פְנֵי/הֶ֛ם לְ/רֵ֥יחַ נִיחֹ֖חַ וַ/יֶּ֑הִי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/019.yaml
  text: And my bread that I gave you—fine flour[a], oil, and honey with which I fed you—you set before them as a pleasing aroma, and so it was[c][b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'my food that I gave you.' Hebrew 'bread' can sometimes stand more broadly for food.
    reason: lexical_alternative
  - marker: b
    text: '''A pleasing aroma'' is standard sacrificial language, here used ironically of what was offered before idols.'
    reason: cultural_note
  - marker: c
    text: Hebrew 'Lord GOD' represents אֲדֹנָי יְהוִה; the divine name יְהוָה is rendered 'the LORD' by translation policy.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 네게 준 내 빵—곧 고운 밀가루와 기름과 꿀—을 네가 그들 앞에 향기로운 제물로 차려 놓았으니, 그 일이 과연 그렇게 되었습니다. 주 하나님께서 선언하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לֶחֶם은 여기서 ‘빵’이지만, 넓게는 ‘음식’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘향기로운 제물’은 본래 제사 언어인데, 여기서는 우상에게 바친 것을 빗대어 사용한 표현입니다.
    reason: theological_note
lexical_decisions:
- source_word: לַחְמִי
  english_pob_choice: my bread
  chosen_korean: 내 빵
  alternatives_korean:
  - 내 음식
  lexicon: HALOT
  rationale: לֶחֶם은 기본적으로 ‘빵’이지만 ‘음식’까지 넓어질 수 있으므로, 구체적이면서도 다음 열거와 잘 맞는 ‘내 빵’을 택했습니다.
- source_word: סֹלֶת
  english_pob_choice: fine flour
  chosen_korean: 고운 밀가루
  alternatives_korean:
  - 곱게 빻은 가루
  - 고운 가루
  lexicon: HALOT
  rationale: 제의적·식재적 맥락을 살리면서 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: הֶאֱכַלְתִּיךְ
  english_pob_choice: I fed you
  chosen_korean: 내가 … 준
  alternatives_korean:
  - 내가 먹여 준
  - 내가 먹을 것을 준
  lexicon: HALOT
  rationale: 히필의 사역 의미를 살리되, 여기서는 ‘먹이다’보다 ‘주다’가 열거된 음식 항목들과 더 긴밀하게 연결됩니다.
- source_word: לְרֵיחַ נִיחֹחַ
  english_pob_choice: as a pleasing aroma
  chosen_korean: 향기로운 제물로
  alternatives_korean:
  - 기쁘게 하는 향기로
  - 향기로운 향으로
  lexicon: HALOT
  rationale: 직역하면 ‘기분 좋은 향기’이지만, 본문에서는 제의 언어를 우상에게 바친 것에 아이러니하게 적용하므로 ‘제물로’까지 드러내어 의미를 살렸습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님께서 선언하십니다
  alternatives_korean:
  - 주 하나님께서 말씀하십니다
  - 주 야훼 하나님께서 선언하십니다
  lexicon: HALOT
  rationale: 예언적 선언 공식은 한국어에서 ‘선언하십니다’로 자연스럽고, אֲדֹנָי יְהוִה는 관례적으로 ‘주 하나님’으로 옮겼습니다.
theological_decisions:
- issue: ‘향기로운 제물’의 아이러니한 제의 언어
  chosen_reading: 우상 앞에 바친 것을 가리키는 제의적 표현을 그대로 살려, 긍정이 아니라 심판적 아이러니로 읽히게 했습니다.
  alternative_readings:
  - ‘향기로운 향으로’처럼 더 일반적으로 옮김
  - 아이러니를 설명적으로 풀어씀
  rationale: 본문은 하나님께 드리는 제사에 쓰이던 언어를 우상 숭배에 적용하여 비난하므로, 그 긴장을 본문 안에서 유지하는 것이 중요합니다.
  doctrine_reference: 'Translation philosophy #3, preserve theological tension rather than resolve it'
