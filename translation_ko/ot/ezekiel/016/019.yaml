revisions:
- from: 내가 네게 준 내 빵—곧 고운 밀가루와 기름과 꿀—을 네가 그들 앞에 향기로운 제물로 차려 놓았으니, 그 일이 과연 그렇게 되었습니다. 주 하나님께서 선언하십니다.[a][b]
  to: 내가 네게 준 내 빵, 곧 내가 너에게 먹인 고운 밀가루와 기름과 꿀을 네가 그들 앞에 향기로운 냄새가 되게 하려고 놓았으며, 그렇게 되었습니다. 주 야훼께서 선언하십니다.[a][b][c]
  rationale: 원문의 두 공급 동사(‘주다’와 ‘먹이다’)를 모두 복원하고, 제의 관용구에는 본문에 없는 ‘제물’을 보태지 않았습니다. 불필요한 강조어를 제거했으며, 신명을 구별하여 반영했습니다. 각주는 빵의 의미 범위, 제의 관용구의 아이러니, 신명 표기를 각각 간결하게 설명합니다.
