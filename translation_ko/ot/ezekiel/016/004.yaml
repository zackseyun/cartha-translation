  text: 네 출생[a]에 관하여는 네가 태어난 날에 네 탯줄이 끊어지지 아니하였고 너를 씻어 깨끗하게 하지 아니하였으며 너를 소금으로 문지르지 아니하였고[b] 너를 띠로 감싸지 아니하였다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '너를 깨끗이 하라' 또는 '너의 피부를 매끄럽게 하라'. 히브리어 용어가 희귀하며 해석자들이 정결을 강조하는지 아니면 신생아의 피부를 문지르는 것을 강조하는지에 대해 의견이 다르다.
    reason: alternative_reading
  - marker: b
    text: 즉 고대 신생아 돌봄 관례에 따라 아기를 소금으로 문지르던 것이다.
    reason: alternative_reading
  - marker: c
    text: 또는 '너를 띠로 감싸지 아니하였다'.
    reason: alternative_reading
