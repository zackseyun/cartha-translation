  source_fidelity: 원문의 심판 선언, ‘손을 내밀다’, 할당된 몫의 삭감, 적대자들의 욕망/뜻에 넘겨짐, 그리고 블레셋의 ‘딸들’이라는 의인화를 대체로 충실히 반영했습니다. 다만 초안은 ‘너를 너를’이라는 중복이 있고, ‘딸들에게’가 문장 끝에 놓여 원문의 ‘그들의 뜻/욕망에’라는 지배 관계가 흐려집니다.
  naturalness: ‘너를 너를’은 명백한 오기입니다. 또한 ‘너를 … 뜻에 넘겨주었습니다—곧 … 딸들에게’는 ‘뜻’과 ‘딸들’의 관계가 문법적으로 자연스럽지 않습니다. 적대자들과 블레셋의 딸들이 동격임을 본문 안에서 분명히 하고, ‘뜻에’가 그 집단을 수식하도록 재배치하는 것이 자연스럽습니다.
  terminology: ‘보십시오’, ‘네 몫’, ‘블레셋 사람들의 딸들’은 현대 공손 문체와 예언적 의인화를 잘 살립니다. זִמָּה에 대해서는 ‘음행한 길’보다 명사구인 ‘음행의 길’이 히브리어의 ‘음행의/방탕의 길’을 더 자연스럽고 정확하게 나타냅니다.
