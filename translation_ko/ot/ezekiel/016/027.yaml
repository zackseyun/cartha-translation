id: EZK.16.27
reference: Ezekiel 16:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה נָטִ֤יתִי יָדִ/י֙ עָלַ֔יִ/ךְ וָ/אֶגְרַ֖ע חֻקֵּ֑/ךְ וָ/אֶתְּנֵ֞/ךְ בְּ/נֶ֤פֶשׁ שֹׂנְאוֹתַ֨יִ/ךְ֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים הַ/נִּכְלָמ֖וֹת מִ/דַּרְכֵּ֥/ךְ זִמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/027.yaml
  text: And behold[a], I stretched out my hand against you, and I reduced your allotted portion, and gave you over to the desire of those who hate you, the daughters of the Philistines[c][b], who are ashamed of your lewd way.
  footnotes:
  - marker: a
    text: Or 'your due,' 'your allowance,' or 'your share' for 'your allotted portion.' The Hebrew term can denote what is prescribed or allotted.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the will of those who hate you.' The Hebrew expression literally includes 'soul,' here meaning desire, appetite, or will.
    reason: lexical_alternative
  - marker: c
    text: '''The daughters of the Philistines'' preserves the prophetic personification of peoples or cities as daughters.'
    reason: cultural_note
translation:
  language: ko
  text: 보십시오[a], 내가 너를 향해 내 손을 내밀고, 네 몫을 줄였으며, 너를 너를 미워하는 자들의 뜻에 넘겨주었습니다—곧 너의 음행한 길을 부끄러워하는 블레셋 사람들의 딸들에게[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보십시오’는 히브리어의 주의를 끄는 도입을 현대 한국어 공손 표현으로 옮긴 것입니다.
    reason: korean_style_note
  - marker: b
    text: ‘너를 너를 미워하는 자들의 뜻에 넘겨주었습니다’는 원문의 ‘영혼/목숨’을 포함하는 표현을 ‘뜻’으로 풀어, 욕망·의지·의도 전체를 아우르도록 한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘블레셋 사람들의 딸들’은 민족이나 도시를 ‘딸들’로 의인화하는 예언적 표현을 보존한 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 감탄형 도입을 현대 한국어의 공손한 명령형으로 살려, 본문의 긴박한 시선 유도 기능을 유지했습니다.
- source_word: נָטִיתִי יָדִי עָלַיִךְ
  english_pob_choice: I stretched out my hand against you
  chosen_korean: 내 손을 내밀고
  alternatives_korean:
  - 내 손을 뻗고
  - 내 손을 펼치고
  - 내 손을 들어
  lexicon: HALOT
  rationale: 심판 행위를 나타내는 관용구를 직역하되, 한국어에서 자연스러운 ‘손을 내밀다’로 옮겨 이미지와 행위성을 함께 살렸습니다.
- source_word: חֻקֵּךְ
  english_pob_choice: your allotted portion
  chosen_korean: 네 몫
  alternatives_korean:
  - 네 분깃
  - 네 할당분
  - 네 배당된 몫
  lexicon: HALOT
  rationale: 문맥상 ‘정해져 주어진 몫/배당’의 뜻이므로, 과도하게 제도적이지 않으면서도 빼앗긴 분량을 드러내는 ‘몫’을 택했습니다.
- source_word: בְּנֶפֶשׁ שֹׂנְאוֹתַיִךְ
  english_pob_choice: to the desire of those who hate you
  chosen_korean: 너를 너를 미워하는 자들의 뜻에 넘겨주었습니다
  alternatives_korean:
  - 너를 미워하는 자들의 욕망에 넘겨주었습니다
  - 너를 미워하는 자들의 마음에 넘겨주었습니다
  - 너를 미워하는 자들의 소원에 넘겨주었습니다
  lexicon: HALOT
  rationale: נֶפֶשׁ의 ‘욕구/뜻/마음’ 범위를 고려해, 현대 한국어에서 가장 넓고 문맥에 맞는 ‘뜻’으로 처리해 호전적 의지에의 종속을 나타냈습니다.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  english_pob_choice: the daughters of the Philistines
  chosen_korean: 블레셋 사람들의 딸들
  alternatives_korean:
  - 블레셋의 딸들
  - 블레셋 여자들
  - 블레셋 사람들의 딸들
  lexicon: HALOT
  rationale: 민족/도시를 ‘딸들’로 의인화하는 예언 문체를 보존하기 위해 직역했으며, 한국어 독자가 민족 집단을 자연스럽게 인식하도록 ‘블레셋 사람들’로 풀었습니다.
- source_word: מִדַּרְכֵּךְ זִמָּה
  english_pob_choice: of your lewd way
  chosen_korean: 너의 음행한 길
  alternatives_korean:
  - 너의 방탕한 길
  - 너의 음란한 길
  - 너의 부정한 길
  lexicon: HALOT
  rationale: דרך + זִמָּה의 성적·도덕적 타락을 본문 강도에 맞게 살리되, 한국어 성경 문체에서 잘 통하는 ‘음행한 길’로 압축했습니다.
theological_decisions:
- issue: 심판의 직접 화법과 성적-도덕적 비유의 강도
  chosen_reading: 하나님의 1인칭 심판 선언과 노골적인 수치를 동반한 비유를 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 심판을 추상적 처벌 표현으로 바꾸기
  - 성적 함의를 일반적 악행 표현으로 약화하기
  rationale: 본문은 언약 불성실을 고발하는 예언적 비유의 일부이므로, 이미지의 수위까지 보존해야 청중이 의도된 책망과 심판의 무게를 정확히 듣습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
