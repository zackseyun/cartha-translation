  to: 보십시오[a], 내가 너를 향해 내 손을 내밀었고, 네 몫을 줄였으며, 너를 미워하는 자들, 곧 네 음행의 길을 부끄러워하는 블레셋 사람들의 딸들[c]의 뜻[b]에 너를 넘겨주었습니다.
  rationale: 중복된 목적어를 삭제하고, ‘너를 미워하는 자들’과 ‘블레셋 사람들의 딸들’이 동격임을 쉼표와 ‘곧’으로 명시했습니다. 또한 ‘그들의 뜻에’ 해당하는 히브리어 구문이 블레셋의 딸들을 수식하도록 문장을 재구성하여, 단순히 그들에게 넘겨졌다는 뜻으로 바뀌지 않게 했습니다. ‘음행의 길’은 원문의 명사 결합과 성적·도덕적 비난의 함의를 자연스럽게 유지합니다.
