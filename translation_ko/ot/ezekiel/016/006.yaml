  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶעֱבֹ֤ר עָלַ֨יִ/ךְ֙ וָֽ/אֶרְאֵ֔/ךְ מִתְבּוֹסֶ֖סֶת בְּ/דָמָ֑יִ/ךְ וָ/אֹ֤מַר לָ/ךְ֙ בְּ/דָמַ֣יִ/ךְ חֲיִ֔י וָ/אֹ֥מַר לָ֖/ךְ בְּ/דָמַ֥יִ/ךְ חֲיִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/006.yaml
  text: And I passed by you and saw you wallowing in your blood[a], and I said to you, ‘In your blood, live!’ Yes, I said to you, ‘In your blood[b], live!’
  footnotes:
  - marker: a
    text: Or, 'Though you were in your blood, live!' The Hebrew preposition can be understood with a concessive nuance in context.
    reason: alternative_reading
  - marker: b
    text: The line 'In your blood, live!' is repeated in Hebrew for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 네 곁을 지나가다가 너를 보니, 네가 네 피 속에서 몸부림치고 있었습니다. 내가 너에게 말하였습니다. ‘네 피 속에서 사십시오!’[a] 내가 다시 너에게 말하였습니다. ‘네 피 속에서 사십시오!’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네가 네 피 속에 있었으나 사십시오!’로 이해할 수도 있습니다. 히브리어 전치사는 문맥상 양보의 뉘앙스를 지닐 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어에서는 ‘네 피 속에서 사십시오!’라는 말이 반복되어 강조됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר עָלַיִךְ
  english_pob_choice: I passed by you
  chosen_korean: 내가 너를 지나가며
  alternatives_korean:
  - 내가 네 곁을 지나며
  - 내가 너를 지나쳐
  lexicon: WLC / HALOT
  rationale: עבר의 이동 감각을 자연스러운 현대 한국어로 살리되, ‘지나가다’로 장면의 진행을 유지했습니다.
- source_word: מִתְבּוֹסֶסֶת
  english_pob_choice: wallowing / thrashing about
  chosen_korean: 피투성이 속에서 발버둥치고 있었고
  alternatives_korean:
  - 피투성이로 뒹굴고 있었고
  - 피 속에서 몸부림치고 있었고
  lexicon: HALOT
  rationale: 반복적으로 몸을 움직이며 버티는 뉘앙스를 살리기 위해 ‘발버둥치다’를 택했고, 단순한 ‘뒹굴다’보다 긴박감을 유지했습니다.
- source_word: בְּדָמָיִךְ
  english_pob_choice: in your blood
  chosen_korean: 네 피 속에서
  alternatives_korean:
  - 네 피 안에서
  - 네 피 가운데
  lexicon: HALOT
  rationale: 히브리어 בְּ의 공간적/상황적 감각을 보존해, 본문의 충격적인 이미지를 완화하지 않도록 했습니다.
- source_word: חֲיִי
  english_pob_choice: live!
  chosen_korean: 살아라!
  alternatives_korean:
  - 살라!
  - 살아 있으라!
  lexicon: HALOT
  rationale: 여성 단수 명령형을 한국어 명령문으로 직역하되, 자연스럽고 단호한 어조의 ‘살아라!’로 옮겼습니다.
theological_decisions:
- issue: בְּדָמָיִךְ חֲיִי의 전치사 ב 의미
  chosen_reading: 주본문에서는 ‘네 피 속에서 살아라!’로 직역해, 문법적 긴장과 충격을 그대로 남겼습니다.
  alternative_readings:
  - ‘네 피 가운데서도 살아라!’ 같은 완화된 이해
  - ‘비록 네 피 속에 있을지라도 살아라!’ 같은 양보적 이해
  rationale: 본문은 ב의 의미를 한 가지로 매끈하게 풀어내지 않고도 읽힐 수 있으므로, 본문 자체의 거친 압축성을 보존했습니다. 양보적 해석 가능성은 주석 없이 본문에 흡수하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
