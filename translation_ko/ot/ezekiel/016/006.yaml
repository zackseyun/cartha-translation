- from: 내가 너를 지나가며 보니, 네가 피투성이 속에서 발버둥치고 있었고, 내가 너에게 말하였다. ‘네 피 속에서 살아라!’ 내가 다시 너에게 말하였다. ‘네 피 속에서 살아라!’[a][b]
  to: 내가 네 곁을 지나가다가 너를 보니, 네가 네 피 속에서 몸부림치고 있었습니다. 내가 너에게 말하였습니다. ‘네 피 속에서 사십시오!’[a] 내가 다시 너에게 말하였습니다. ‘네 피 속에서 사십시오!’[b]
  rationale: 이동 표현을 자연스럽게 다듬고, 원문의 ‘네 피’ 이미지를 보존했습니다. 원문의 두 ‘내가 너에게 말하였다’ 절은 한국어에서도 두 번 유지하되, 두 번째의 반복 기능을 ‘다시’로 드러냈습니다. 전치사 ב의 논쟁적/압축적 기능은 본문에서 ‘속에서’로 남기고 양보적 독해는 각주로 제한했습니다.
