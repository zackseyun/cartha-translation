- from: 네가 음행을 행할 때에 너는 다른 여자들과 달랐으니, 아무도 너를 찾아와 음행하지 않았고 너는 오히려 값을 주었으며, 값도 너에게 주어지지 않았으므로, 네가 거꾸로 된 것이 되었습니다.[a]
  to: 당신의 음행은 다른 여자들과 정반대였습니다. 아무도 당신을 찾아 음행하지 않았습니다[a]. 그런데도 당신은 대가를 주었고, 당신에게는 대가가 주어지지 않았습니다. 그러므로 당신은 정반대가 되었습니다.
