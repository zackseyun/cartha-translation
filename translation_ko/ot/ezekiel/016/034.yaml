  text: וַ/יְהִי בָ֨/ךְ הֵ֤פֶךְ מִן הַ/נָּשִׁים֙ בְּ/תַזְנוּתַ֔יִ/ךְ וְ/אַחֲרַ֖יִ/ךְ לֹ֣א זוּנָּ֑ה וּ/בְ/תִתֵּ֣/ךְ אֶתְנָ֗ן וְ/אֶתְנַ֛ן לֹ֥א נִתַּן לָ֖/ךְ וַ/תְּהִ֥י לְ/הֶֽפֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/034.yaml
  text: 'And in your prostitution you were the opposite of other women: no one solicited you[a], but you gave payment, and no payment was given to you; so you became the opposite.'
  footnotes:
  - marker: a
    text: Literally, 'after you no one prostituted himself'; the sense is that unlike ordinary prostitutes, you were not sought out by clients.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 음행을 행할 때에 너는 다른 여자들과 달랐으니, 아무도 너를 찾아와 음행하지 않았고 너는 오히려 값을 주었으며, 값도 너에게 주어지지 않았으므로, 네가 거꾸로 된 것이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘네 뒤에 아무도 음행하지 않았다’는 뜻이지만, 문맥상 일반적인 매춘처럼 손님이 너를 찾지 않았다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵפֶךְ / לְהֶפֶךְ
  english_pob_choice: the opposite / the opposite
  chosen_korean: 거꾸로 된 것
  alternatives_korean:
  - 반대
  - 뒤집힌 상태
  - 거꾸로 된 상태
  lexicon: HALOT
  rationale: 반복되는 전환어의 역설을 살리면서, 문맥상 ‘정상적인 매춘의 질서가 뒤집힌 상태’라는 뜻을 한국어로 자연스럽게 드러냅니다.
- source_word: בְּתַזְנוּתַיִךְ
  english_pob_choice: your prostitution
  chosen_korean: 네가 음행을 행할 때에
  alternatives_korean:
  - 네 매춘 가운데
  - 네 음행 가운데
  - 네 창녀짓 가운데
  lexicon: HALOT
  rationale: 예언서의 수치스러운 성적 은유를 유지하되, 현대 한국어에서 과도하게 비속하지 않으면서도 소스를 직접적으로 반영합니다.
- source_word: וְאַחֲרַיִךְ לֹא זוּנָּה
  english_pob_choice: no one solicited you
  chosen_korean: 아무도 너를 찾아와 음행하지 않았고
  alternatives_korean:
  - 아무도 너를 찾아오지 않았고
  - 아무도 너를 좇아와 음행하지 않았고
  - 아무도 너와 음행하려 하지 않았고
  lexicon: HALOT
  rationale: 직역하면 ‘네 뒤를 따라 음행한 이가 없었다’는 뜻이지만, 본문 문맥의 ‘손님이 찾아오지 않은 매춘’이라는 아이러니를 한국어에서 가장 분명히 전달합니다.
- source_word: אֶתְנָן
  english_pob_choice: payment
  chosen_korean: 값
  alternatives_korean:
  - 대가
  - 보수
  - 품삯
  lexicon: HALOT
  rationale: 매춘의 대가라는 의미를 살리면서 두 절의 반복을 간결하게 연결할 수 있는 중립적 표현입니다.
theological_decisions:
- issue: 예언자적 성적 은유를 완화할지 여부
  chosen_reading: ‘음행’과 ‘값’의 어휘를 유지하여, 예루살렘의 언약 불성실을 노골적인 성적 은유로 드러냈습니다.
  alternative_readings:
  - ‘불성실’이나 ‘우상숭배’로 완화
  - 완곡하게 ‘타락’으로 처리
  rationale: 에스겔은 충격적인 은유 자체로 의미를 전달하므로, 이를 추상화하면 본문의 수사와 심판의 강도가 약해집니다.
  doctrine_reference: Translation philosophy §§1, 6
