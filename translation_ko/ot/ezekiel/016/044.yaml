  lexicon: HALOT
  rationale: 주의를 끄는 감탄사로, 예언적 경고의 급박함을 살리면서도 한국어 문장 흐름에 맞게 옮겼습니다.
- source_word: הַמֹּשֵׁל / יִמְשֹׁל
