  text: 보라, 당신에 대해 속담을 말하는 사람마다 이렇게 속담을 말할 것입니다. ‘어머니가 어떠하면 딸도 그렇다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 משל은 여기서 ‘다스리다’가 아니라 ‘속담을 말하다/사용하다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보라
  alternatives_korean:
