  alternative_readings:
  - 더 강한 조롱조로 풀기
  - 완곡하게 설명문으로 바꾸기
  rationale: 본문은 예루살렘의 행위를 속담화하여 공적 수치를 드러내는 방식이므로, 수사적 힘을 약화시키지 않되 과장도 피했습니다.
