id: EZK.16.28
reference: Ezekiel 16:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּזְנִי֙ אֶל בְּנֵ֣י אַשּׁ֔וּר מִ/בִּלְתִּ֖י שָׂבְעָתֵ֑/ךְ וַ/תִּזְנִ֕י/ם וְ/גַ֖ם לֹ֥א שָׂבָֽעַתְּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/028.yaml
  text: You prostituted yourself with the sons of Assyria because you were not satisfied[a]; you prostituted yourself with them[b], and even then you were not satisfied.
  footnotes:
  - marker: a
    text: 'Or ''the Assyrians.'' Hebrew: ''the sons of Assyria.'''
    reason: lexical_alternative
  - marker: b
    text: Hebrew uses the repeated metaphor of prostitution/whoredom for Jerusalem's unfaithfulness in alliances and idolatry.
    reason: cultural_note
translation:
  language: ko
  text: 당신은 만족하지 못했기 때문에 앗수르의 아들들과 더불어 음행하였고, 그들과도 음행하였지만, 그래도 만족하지 못하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘앗수르의 아들들’은 집단명으로서 ‘앗수르 사람들’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 같은 성적 비유를 반복하여 예루살렘의 언약적 불신실함을 강조합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּזְנִי
  english_pob_choice: you prostituted yourself
  chosen_korean: 음행하였고
  alternatives_korean:
  - 창녀처럼 행하였고
  - 음란하게 행하였고
  - 몸을 팔았고
  lexicon: HALOT
  rationale: זנה는 에스겔에서 예루살렘의 언약적·우상숭배적 배신을 성적 비유로 강하게 드러내므로, 이를 완화하지 않고 ‘음행하다’로 옮겨 비유의 충격을 유지했습니다.
- source_word: בְּנֵי אַשּׁוּר
  english_pob_choice: the sons of Assyria
  chosen_korean: 앗수르의 아들들과
  alternatives_korean:
  - 앗수르 사람들과
  - 앗수르의 자손들과
  lexicon: HALOT
  rationale: 히브리어 표현을 따라 직역하되, 한국어에서는 집단 지시가 자연스럽게 드러나도록 ‘앗수르의 아들들’을 복수 조사와 함께 옮겼습니다.
- source_word: מִ/בִּלְתִּי שָׂבְעָתֵ֑/ךְ
  english_pob_choice: because you were not satisfied
  chosen_korean: 당신은 만족하지 못했기 때문에
  alternatives_korean:
  - 만족하지 못했으므로
  - 배부르지 못했기 때문에
  - 흡족하지 못했기 때문에
  lexicon: HALOT
  rationale: מִבִּלְתִּי는 원인·상황을 나타내므로, 반복되는 ‘만족하지 못함’을 앞에 두어 문장의 이유 관계를 분명하게 살렸습니다.
- source_word: וַ/תִּזְנִ֕י/ם
  english_pob_choice: you prostituted yourself with them
  chosen_korean: 그들과도 음행하였지만
  alternatives_korean:
  - 그들과도 음행하였고
  - 그들과 더불어 몸을 팔았지만
  - 그들과도 창기처럼 행하였지만
  lexicon: HALOT
  rationale: 접미사 ‘-ם’이 앞의 앗수르 집단을 다시 가리키므로 ‘그들과도’로 명시해 반복 구조를 보존했고, 뒤의 재강조를 위해 ‘도’와 ‘지만’을 함께 살렸습니다.
- source_word: לֹ֥א שָׂבָֽעַתְּ
  english_pob_choice: you were not satisfied
  chosen_korean: 그래도 만족하지 못하였습니다
  alternatives_korean:
  - 그래도 배부르지 못하였습니다
  - 그럼에도 흡족하지 못하였습니다
  - 여전히 만족하지 못하였습니다
  lexicon: HALOT
  rationale: שׂבע의 반복을 같은 한국어 동사로 유지해 에스겔의 수사적 후렴을 드러냈고, 현대어로는 ‘만족하다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 에스겔 16장의 성적 비유를 완화할지 여부
  chosen_reading: ‘음행하다’ 표현을 본문에 그대로 유지해 예루살렘의 정치적·종교적 배신을 노골적인 성적 비유로 드러냈습니다.
  alternative_readings:
  - ‘불신실하게 행하다’로 완화
  - ‘동맹을 추구하다’로 정치적 의미만 강조
  rationale: 본문은 충격적인 성적 은유를 통해 언약 파기를 고발하므로, 이를 순화하면 예언 수사의 강도와 신학적 긴장이 약화됩니다.
  doctrine_reference: '성경 번역 원칙: 원어의 은유와 수사적 긴장을 보존'
