id: EZK.16.31
reference: Ezekiel 16:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/בְנוֹתַ֤יִ/ךְ גַּבֵּ/ךְ֙ בְּ/רֹ֣אשׁ כָּל דֶּ֔רֶךְ וְ/רָמָתֵ֥/ךְ עשיתי בְּ/כָל רְח֑וֹב וְ/לֹא הייתי כַּ/זּוֹנָ֖ה לְ/קַלֵּ֥ס אֶתְנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/031.yaml
  text: When you built your mound at the head of every road and made your high place in every square[a], you were not like a prostitute[c][b], in that you scorned payment.
  footnotes:
  - marker: a
    text: Or 'your vaulted chamber' or 'your shrine-platform'; the Hebrew term refers to a raised structure associated with the chapter's prostitution imagery.
    reason: lexical_alternative
  - marker: b
    text: Or 'at every street corner.' Literally, 'at the head of every road.'
    reason: lexical_alternative
  - marker: c
    text: That is, unlike an ordinary prostitute, Jerusalem did not act for pay; the following verses explain that she gave gifts instead of receiving them.
    reason: cross_reference
translation:
  language: ko
  text: 네가 모든 길 어귀에 네 둔덕[a]을 쌓고 모든 광장에 네 높은 곳을 세웠을 때, 너는 보수를 업신여긴다는 점에서 창녀[c]와 같지 않았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 아치형 방’ 또는 ‘네 신전의 높인 단’으로 옮길 수 있습니다. 히브리어는 이 장의 매춘 비유와 관련된 높인 구조물을 가리키지만, 그 정확한 형태는 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘모든 길의 머리에서’입니다.
    reason: lexical_alternative
  - marker: c
    text: 곧, 보통의 창녀와 달리 예루살렘은 대가를 받고 행동하지 않았다는 뜻입니다. 이어지는 절들은 예루살렘이 오히려 선물을 주었다고 설명합니다.
    reason: cross_reference
lexical_decisions:
- source_word: בִּבְנוֹתַיִךְ
  english_pob_choice: when you built
  chosen_korean: 네가 ... 쌓고
  alternatives_korean:
  - 네가 ... 지을 때
  - 네가 ... 세울 때
  lexicon: HALOT
  rationale: פִּעֵל식 건축 행위를 자연스러운 한국어로 풀어, 시간적 부사절의 기능을 살리면서도 본문의 정죄 어조를 유지했습니다.
- source_word: גַּבֵּךְ
  english_pob_choice: your mound
  chosen_korean: 네 둑
  alternatives_korean:
  - 네 언덕
  - 네 둔덕
  - 네 축대
  lexicon: HALOT
  rationale: 정확한 구조를 단정하기보다, 높이 쌓아 올린 인공적 구조라는 감각을 살리는 쪽이 본문의 음란-우상 숭배 비유에 더 가깝습니다.
- source_word: בְּרֹאשׁ כָּל־דֶּרֶךְ
  english_pob_choice: at the head of every road
  chosen_korean: 길 어귀마다
  alternatives_korean:
  - 모든 길의 머리마다
  - 모든 길목마다
  lexicon: HALOT
  rationale: '''머리''의 공간적 은유를 한국어 관용에 맞게 옮겨, 공공의 눈에 띄는 자리라는 뜻을 드러냈습니다.'
- source_word: לְקַלֵּס אֶתְנָן
  english_pob_choice: because you scorned payment
  chosen_korean: 보수를 업신여겼기 때문입니다
  alternatives_korean:
  - 삯을 멸시했기 때문입니다
  - 보수를 깔보았기 때문입니다
  lexicon: HALOT
  rationale: קַלֵּס의 조롱·경멸의 뉘앙스를 '업신여기다'로 옮기고, אֶתְנָן은 매춘 비유 안에서 '보수'로 간결하게 처리했습니다.
theological_decisions:
- issue: Ezekiel의 노골적인 성적 비유 유지
  chosen_reading: '''창녀''와 ''보수''를 그대로 살려, 예루살렘의 우상숭배를 완곡하게 돌리지 않았습니다.'
  alternative_readings:
  - 우상 숭배하는 여자
  - 음행하는 여자
  - 매춘부
  rationale: 에스겔 16장은 충격적인 성적 은유를 의도적으로 사용하므로, 이를 종교적 추상어로 약화하면 예언 수사의 힘이 사라집니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: 마지막 절의 논리 관계
  chosen_reading: '''네가 보수를 업신여겼기 때문입니다''로 옮겨, 보통 창녀와는 달리 값을 받지 않았다는 역설을 드러냈습니다.'
  alternative_readings:
  - 보수를 받지 않았기 때문입니다
  - 값을 원치 않았기 때문입니다
  rationale: 문맥상 다음 절들이 예루살렘이 오히려 선물을 주었다는 역설을 펼치므로, '업신여겼다'는 표현이 그 대비를 가장 잘 예고합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
