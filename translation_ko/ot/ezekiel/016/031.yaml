revisions:
- from: 네가 길 어귀마다 네 둑을 쌓고, 모든 광장에 네 높은 곳을 세웠을 때, 너는 창녀와 같지 않았습니다. 곧 네가 보수를 업신여겼기 때문입니다.[a][b][c]
  to: 네가 모든 길 어귀에 네 둔덕[a]을 쌓고 모든 광장에 네 높은 곳을 세웠을 때, 너는 보수를 업신여긴다는 점에서 창녀[c]와 같지 않았습니다.[b]
  rationale: ‘둑’을 의미 범위가 더 적절한 ‘둔덕’으로 바꾸고, 마지막 부정 비교를 ‘보수를 업신여긴다는 점에서’로 통합했습니다. 이는 히브리어의 비교 및 불확정적인 건축 용어를 보존하며, 원문의 노골적인 비유와 현대 합쇼체 문체를 유지합니다. 각주 표지도 해당 어구에 직접 연결했습니다.
