translation:
  language: ko
  text: 그리고 이렇게 되었습니다. 당신의 모든 악행 이후에—오호, 오호, 당신에게! —주 야훼께서 선포하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그리고 이렇게 되었습니다’는 히브리어 와우-연속형의 서술 전환을 살린 번역입니다.
    reason: source_note
  - marker: b
    text: 원문은 ‘오호, 오호’로 반복되어, 애가와 심판을 겹쳐 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it came about
  chosen_korean: 그리고 이렇게 되었습니다
  alternatives_korean:
  - 그리고 그렇게 되었습니다
  - 그 일이 일어났습니다
  lexicon: WLC context / narrative waw-consecutive
  rationale: 서술 전환을 자연스럽게 살리면서도, 뒤이은 심판 선언으로 이어지는 전개를 한국어로 매끄럽게 드러냅니다.
- source_word: אַחֲרֵי כָּל רָעָתֵךְ
  english_pob_choice: after all your wickedness
  chosen_korean: 당신의 모든 악행 이후에
  alternatives_korean:
  - 당신의 모든 악함 이후에
  - 당신의 모든 죄악 뒤에
  lexicon: HALOT
  rationale: רָעָה는 כאן 도덕적 악을 가리키므로, ‘악행’이 의미를 분명하게 전달하며 ‘모든’의 포괄성도 유지합니다.
- source_word: א֣וֹי א֣וֹי לָ֔ךְ
  english_pob_choice: woe, woe to you!
  chosen_korean: 오호, 오호, 당신에게!
  alternatives_korean:
  - 화로다, 화로다, 당신에게!
  - 슬프도다, 슬프도다, 당신에게!
  lexicon: HALOT
  rationale: 히브리어의 중복 감탄사는 애가와 심판을 함께 강화하므로, 반복을 그대로 살리되 문어체에서 통용 가능한 강한 탄식으로 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 יהוה는 ‘야훼’로 옮기고, אֲדֹנָי와 결합된 호칭은 중복을 피하면서도 주권적 칭호를 유지합니다.
theological_decisions:
- issue: 중복된 탄식 ‘אוי אוי’의 효과
  chosen_reading: 애가와 심판을 동시에 강화하는 반복 탄식으로 유지했습니다.
  alternative_readings:
  - 단순한 ‘불행하다’ 정도로 완화
  - 한 번만 ‘오호’로 줄임
  rationale: 원문의 반복은 감정의 증폭과 선포의 긴박성을 드러내므로, 한국어에서도 두 번 반복해 심판적 무게를 보존합니다.
  doctrine_reference: 예언서의 심판 선언 수사
