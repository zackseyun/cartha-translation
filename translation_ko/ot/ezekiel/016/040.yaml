  - marker: b
    text: Or 'hack you to pieces with their swords.' The Hebrew verb suggests violent cutting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 당신을 치려고 무리를 불러 모아, 돌로 당신을 치고, 자기들의 칼로 당신을 베어 낼 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱלוּ עָלַיִךְ קָהָל
  english_pob_choice: They will bring up an assembly against you
  chosen_korean: 그들은 당신에게 대회[a]를 모아 올리고
  alternatives_korean:
  - 그들은 당신을 치러 모임을 일으키고
  - 그들은 당신에게 집회를 소집하고
  lexicon: HALOT
  rationale: קָהָל은 단순한 군중보다 공식적으로 모인 집합체이므로 ‘대회’로 옮겨 공적·공동체적 성격을 살렸고, עָלַיִךְ의 적대적 방향성은 ‘당신에게’와 ‘모아 올리고’로 반영했습니다.
- source_word: וְרָגְמוּ
  english_pob_choice: they will stone you
  chosen_korean: 돌로 당신을 쳐 죽이며
  alternatives_korean:
  - 당신에게 돌을 던지며
  - 돌로 당신을 돌로 치며
  lexicon: HALOT
  rationale: רגם은 처형적 ‘돌로 치다’의 뜻이므로, 한국어에서 자연스럽고 결과를 분명히 드러내는 ‘쳐 죽이다’로 옮겼습니다.
- source_word: בָּאָבֶן
  english_pob_choice: with stones
  chosen_korean: 돌로
  alternatives_korean:
  - 돌들을 가지고
  - 돌로써
  lexicon: HALOT
  rationale: 히브리어 관용구상 ‘돌로 치다’로 굳어지므로, 재료·수단을 가장 간결하게 드러내는 ‘돌로’가 적절합니다.
- source_word: וּבִתְּקוּךְ בְּחַרְבוֹתָם
  english_pob_choice: and cut you down with their swords
  chosen_korean: 자기들의 칼로 당신을 베어 버릴 것입니다
  alternatives_korean:
  - 자기들의 칼로 당신을 잘라 버릴 것입니다
  - 자기들의 칼로 당신을 난도질할 것입니다
  lexicon: HALOT
  rationale: בּתק은 단순 절단보다 폭력적 베어 냄을 뜻하므로, 무기 수단을 유지하면서도 한국어에서 강한 파괴성을 담는 ‘베어 버리다’로 옮겼습니다.
theological_decisions:
- issue: 예루살렘을 향한 공적 심판과 폭력적 처벌의 병치
  chosen_reading: 공동체적 심판 절차를 연상시키는 ‘대회’와 실제 처형을 뜻하는 ‘돌로 치다’, ‘칼로 베다’를 함께 살려, 법정적·전쟁적 이미지를 둘 다 약화하지 않았습니다.
  alternative_readings:
  - 군사 공격으로만 읽게 단순화하는 번역
  - 법적 처형으로만 읽게 제한하는 번역
  rationale: 원문은 집합, 돌형, 칼폭력을 연속시켜 예루살렘에 대한 공개적 심판을 강하게 그리므로, 어느 한쪽으로 환원하지 않는 편이 본문 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
