  yaml_path: translation/ot/ezekiel/016/040.yaml
  text: They will bring up an assembly against you[b][a], and they will stone you and cut you down with their swords.
  footnotes:
  - marker: a
    text: Or 'bring an assembly against you.' The Hebrew verb can be rendered more idiomatically in English with 'bring against' rather than the more literal 'bring up.'
