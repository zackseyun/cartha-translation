  rationale: 집결된 공동체가 예루살렘을 대적하여 공개적으로 폭력을 행사하는 장면을 유지하면서, ‘대회’와 ‘모아 올리다’라는 부자연스럽고 부정확한 표현을 바로잡았습니다. 원문의 법적·군사적 긴장은 ‘당신을 치려고 무리를 불러 모아’와 뒤따르는 돌과 칼의 폭력으로 보존됩니다.
