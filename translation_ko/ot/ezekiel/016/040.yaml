review_pass:
  verdict: revise
  source_fidelity: ‘대회’는 קָהָל의 공적 집합이라는 뜻보다 현대 한국어의 행사·경기 대회를 우선 연상시켜 부정확합니다. 또한 ‘당신에게’는 עָלַיִךְ의 적대적 방향을 충분히 나타내지 못합니다. ‘당신을 치려고 무리를 불러 모아’는 적대적 집결과 공개적 처벌의 맥락을 자연스럽게 보존합니다. רגם은 ‘돌로 치다’로, בתק은 칼에 의한 격렬한 절단을 뜻하는 ‘베어 낼 것입니다’로 옮기는 것이 적절합니다.
  naturalness: ‘무리를 불러 모아’와 ‘당신을 치려고’는 현대 표준어에서 자연스럽고, 문장 종결도 합쇼체에 맞습니다. ‘대회를 모아 올리고’는 한국어 어법과 의미 모두에서 부자연스럽습니다.
  terminology: קָהָל은 여기서 종교 용어인 ‘회중’이나 현대 행사 의미의 ‘대회’보다 ‘무리’가 문맥상 적절합니다. 폭력적 심판 이미지는 완화하지 않되, 본문에 없는 결과를 지나치게 명시하지 않기 위해 ‘쳐 죽이며’ 대신 ‘돌로 ... 치고’를 사용합니다.
  issues:
