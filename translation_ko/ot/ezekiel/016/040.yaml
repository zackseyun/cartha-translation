  - severity: medium
    issue: ‘당신에게’가 עָלַיִךְ의 적대적 의미를 불충분하게 반영함
    rationale: 이 문맥의 עַל은 단순한 방향이 아니라 ‘대항하여/치려고’라는 적대적 관계를 나타냅니다.
  - severity: low
    issue: ‘쳐 죽이며’가 원문의 동작보다 결과를 명시함
    rationale: 돌로 치는 행위 자체가 처형적 맥락을 지니지만, 동사가 명시하지 않은 결과를 별도로 확정하기보다 ‘돌로 치고’가 더 직접적입니다.
