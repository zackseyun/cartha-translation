  rationale: 예언자에게 주어진 전달 명령과 공적 신탁 도입을 살리기 위해 ‘말하시오’와 ‘이렇게 말씀하십니다’를 사용했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
