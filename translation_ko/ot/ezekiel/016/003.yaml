base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/003.yaml
  text: 'and say[a], ‘Thus says the Lord GOD to Jerusalem: Your origin and your birth are from the land of the Canaanite; your father was an Amorite, and your mother a Hittite.’'
  footnotes:
  - marker: a
    text: Or, more smoothly, “from the land of Canaan.” The Hebrew more literally reads “from the land of the Canaanite,” preserving the ethnic emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이렇게 말하십시오. 「주 야훼께서 예루살렘에 이렇게 말씀하십니다. 너의 기원과 너의 출생은 가나안 사람들의 땅에서 비롯되었고, 너의 아버지는 아모리 사람이었으며, 너의 어머니는 헷 사람이었습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 매끄럽게는 ‘가나안 땅에서’라고도 옮길 수 있습니다. 히브리어는 문자적으로 단수형을 사용하여 ‘가나안 사람의 땅에서’라고 하며, 가나안 사람이라는 민족적 강조를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ ... כֹּה אָמַר
  english_pob_choice: and say, ‘Thus says
  chosen_korean: 그리고 말하시오. 「…이렇게 말씀하십니다」
