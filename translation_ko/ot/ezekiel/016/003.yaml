  rationale: 아도나이와 여호와의 결합을 둘 다 드러내면서도 한국어에서 중복처럼 들리지 않도록 ‘주 야훼’로 옮겼습니다.
- source_word: מְכֹרֹתַיִךְ
  english_pob_choice: your origin
  chosen_korean: 너의 기원
  alternatives_korean:
  - 너의 출처
  - 너의 뿌리
  - 너의 출생
  lexicon: HALOT
  rationale: 출생과 병렬을 이루는 ‘source/origin’의 의미를 살려, 혈통적·역사적 유래를 가리키는 표현으로 ‘기원’을 선택했습니다.
- source_word: מֵאֶרֶץ הַכְּנַעֲנִי
  english_pob_choice: from the land of the Canaanite
  chosen_korean: 가나안 사람의 땅에서
  alternatives_korean:
  - 가나안의 땅에서
  - 가나안 사람 땅에서
  lexicon: HALOT
  rationale: 문자적으로는 ‘가나안 사람의 땅에서’이므로, 민족적 강조를 흐리지 않도록 영어 POB의 설명을 따라 자연스럽게 옮겼습니다.
