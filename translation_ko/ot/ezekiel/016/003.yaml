base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/003.yaml
  text: 'and say[a], ‘Thus says the Lord GOD to Jerusalem: Your origin and your birth are from the land of the Canaanite; your father was an Amorite, and your mother a Hittite.’'
  footnotes:
  - marker: a
    text: Or, more smoothly, “from the land of Canaan.” The Hebrew more literally reads “from the land of the Canaanite,” preserving the ethnic emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 말하시오. 「주 야훼께서 예루살렘에 이렇게 말씀하십니다. 너의 기원과 너의 출생은 가나안 사람의 땅에서 비롯되었고, 너의 아버지는 아모리 사람이었으며, 너의 어머니는 헷 사람이었습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 매끄럽게는 ‘가나안 땅에서’라고도 옮길 수 있습니다. 히브리어는 문자적으로 ‘가나안 사람의 땅에서’라고 되어 있어 민족적 강조를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ ... כֹּה אָמַר
  english_pob_choice: and say, ‘Thus says
  chosen_korean: 그리고 말하시오. 「…이렇게 말씀하십니다」
  alternatives_korean:
  - 그리고 말하십시오. 「…이렇게 말씀하십니다」
  - 그리고 이르시오. 「…이렇게 말씀하십니다」
  lexicon: HALOT
  rationale: 예언자에게 주어진 전달 명령과 공적 신탁 도입을 살리기 위해 ‘말하시오’와 ‘이렇게 말씀하십니다’를 사용했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 아도나이와 여호와의 결합을 둘 다 드러내면서도 한국어에서 중복처럼 들리지 않도록 ‘주 야훼’로 옮겼습니다.
- source_word: מְכֹרֹתַיִךְ
  english_pob_choice: your origin
  chosen_korean: 너의 기원
  alternatives_korean:
  - 너의 출처
  - 너의 뿌리
  - 너의 출생
  lexicon: HALOT
  rationale: 출생과 병렬을 이루는 ‘source/origin’의 의미를 살려, 혈통적·역사적 유래를 가리키는 표현으로 ‘기원’을 선택했습니다.
- source_word: מֵאֶרֶץ הַכְּנַעֲנִי
  english_pob_choice: from the land of the Canaanite
  chosen_korean: 가나안 사람의 땅에서
  alternatives_korean:
  - 가나안의 땅에서
  - 가나안 사람 땅에서
  lexicon: HALOT
  rationale: 문자적으로는 ‘가나안 사람의 땅에서’이므로, 민족적 강조를 흐리지 않도록 영어 POB의 설명을 따라 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접 화법에서의 호칭과 인용부호 처리
  chosen_reading: ‘주 야훼께서 … 말씀하십니다’로 공적 예언 신탁 형식을 유지했습니다.
  alternative_readings:
  - ‘주 하나님께서 … 말씀하십니다’
  - 직접 평서문으로만 처리
  rationale: 본문은 예언자에게 전달되는 신탁이므로, 공적 선언체를 유지하는 것이 수사와 권위를 가장 잘 보존합니다.
  doctrine_reference: 예언 신탁의 형식 보존
