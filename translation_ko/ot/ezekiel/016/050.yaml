  text: 그들은 교만해져 내 앞에서 가증한 일을 저질렀습니다. 그래서 내가 그것들을 내가 본 대로 없애 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '내가 본 때/대로'에 가깝고, 앞 절의 '가증한 일'이 암시된 목적어입니다.
    reason: source_note
