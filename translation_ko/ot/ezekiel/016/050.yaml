  verdict: revise
  source_fidelity: ‘그것들을’은 선행하는 소돔과 그 딸들(여성 복수)을 가리키는 히브리어 목적어 אֶתְהֶן을 부적절하게 사물화합니다. 또한 ‘내가 본 대로’는 כַּאֲשֶׁר רָאִיתִי를 방법·기준으로 읽게 하므로, 이 문맥에서 자연스러운 시간적 의미인 ‘내가 그것을 보았을 때’를 본문에 반영하는 것이 안전합니다.
  naturalness: ‘그들은 교만해져’와 ‘가증한 일을 저질렀습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘없애 버렸습니다’는 제거보다 소멸·전멸의 뜻을 강하게 내포할 수 있으므로, 원문의 포괄적인 제거 행위를 ‘제거했습니다’로 옮기는 편이 더 절제되고 정확합니다.
  terminology: ‘교만해져’, ‘가증한 일’, ‘내 앞에서’는 גבהּ, תּוֹעֵבָה, לְפָנַי의 도덕적·심판적 어조를 적절히 전달합니다. 목적어는 사람들을 가리키므로 ‘그들을’로 고칩니다.
  issues:
  - severity: medium
    issue: 목적어를 ‘그것들을’로 번역함
    rationale: 히브리어 אֶתְהֶן은 여성 복수 대명사이며 문맥상 소돔과 그 딸들/주민들을 가리킵니다. 한국어에서 ‘그것들’은 이를 사물화합니다.
  - severity: medium
    issue: ‘내가 본 대로’가 כַּאֲשֶׁר רָאִיתִי의 문맥상 시간적 의미를 기준·방식 의미로 바꿈
    rationale: 이 절에서는 앞선 가증한 일을 보신 뒤 내린 심판을 말하므로 ‘내가 그것을 보았을 때’가 자연스럽고 영어 POB의 ‘when I saw it’와도 일치합니다.
  - severity: low
    issue: ‘없애 버렸습니다’가 원문의 제거보다 강한 소멸 뉘앙스를 가질 수 있음
    rationale: וָאָסִיר는 ‘제거하다/치우다’의 처분 행위이며, 본문이 구체적 방식이나 전멸을 명시하지 않으므로 ‘제거했습니다’가 더 안전합니다.
  revised_text: 그들은 교만해져 내 앞에서 가증한 일을 저질렀습니다. 그래서 내가 그것을 보았을 때 그들을 제거했습니다.[a]
