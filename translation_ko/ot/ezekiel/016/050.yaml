translation:
  language: ko
  text: 그들은 교만해져 내 앞에서 가증한 일을 저질렀습니다. 그래서 내가 그것을 보았을 때 그들을 제거했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내가 보았을 때/본 대로’라고 합니다. 여기서는 앞의 ‘가증한 일’이 목적어로 암시되어 있습니다.
    reason: source_note
