  terminology: ‘간음하는 아내’는 הָאִשָּׁה הַמְּנָאָפֶת의 혼인 및 간음 이미지를 유지합니다. ‘취합니다’는 성적·혼인적 배신이라는 문맥을 불필요하게 완화하거나 구체화하지 않으면서 תִּקַּח을 충실히 반영합니다.
