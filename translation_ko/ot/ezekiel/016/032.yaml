    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה
  english_pob_choice: wife
  chosen_korean: 아내
  alternatives_korean:
  - 여자
  - 부인
  lexicon: HALOT
  rationale: 문맥의 뒤 구절이 ‘자기 남편’이라고 밝히므로, 일반적인 ‘여자’보다 혼인 관계를 드러내는 ‘아내’가 원문의 의미를 더 정확히 반영합니다.
- source_word: הַמְּנָאָפֶת
  english_pob_choice: adulterous
  chosen_korean: 간음하는
  alternatives_korean:
  - 간음한
  - 간음하는 여자
  - 음행하는
  lexicon: HALOT
  rationale: 분사형의 특징을 살려 지속적 성격을 나타내는 ‘간음하는’으로 옮겨, 단순한 과거 사실보다 행위의 성향을 드러냈습니다.
- source_word: תַּחַת
  english_pob_choice: instead of
  chosen_korean: 대신에
  alternatives_korean:
  - 대신
  - 대신하여
  - 자리에
  lexicon: HALOT
  rationale: 이 전치사는 장소가 아니라 대체·교환을 나타내므로, ‘대신에’가 남편을 밀어내고 다른 이들을 취한다는 뜻을 가장 직접적으로 전달합니다.
- source_word: זָרִים
  english_pob_choice: strangers
  chosen_korean: 낯선 사람들
  alternatives_korean:
  - 낯선 자들
  - 이방인들
  - 다른 남자들
  lexicon: HALOT
  rationale: 원어는 ‘외부의 낯선 이들’을 가리키며, 이 맥락에서는 성적·언약적 배신을 함께 살리기 위해 ‘낯선 사람들’이 가장 무난합니다.
theological_decisions:
- issue: 간음 이미지를 완화하지 않고 보존할지 여부
  chosen_reading: 혼인 배신의 비유를 직접 유지하여 ‘간음하는 아내는 자기 남편 대신에 낯선 사람들을 데려옵니다’라고 옮겼습니다.
  alternative_readings:
  - 남편 대신 다른 남자들을 받아들입니다.
  - 남편을 버리고 다른 사람들을 취합니다.
  rationale: 에스겔의 언약 불성실 비유가 핵심이므로, 도덕적·성적 긴장을 약화시키지 않는 직설적 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
