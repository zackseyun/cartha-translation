id: EZK.16.29
reference: Ezekiel 16:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תַּרְבִּ֧י אֶת תַּזְנוּתֵ֛/ךְ אֶל אֶ֥רֶץ כְּנַ֖עַן כַּשְׂדִּ֑ימָ/ה וְ/גַם בְּ/זֹ֖את לֹ֥א שָׂבָֽעַתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/029.yaml
  text: You multiplied your prostitution to the land of Canaan[a], to Chaldea; yet even with this you were not satisfied.
  footnotes:
  - marker: a
    text: Or 'toward the land of Canaan, to the Chaldeans,' or 'to the land of Canaan—Chaldea.' The Hebrew syntax is compressed, and the phrase may identify Canaan figuratively with Chaldea/Babylonia or describe an extension from Canaan as far as Chaldea.
    reason: alternative_reading
translation:
  language: ko
  text: 너는 네 음행을 가나안 땅을 향해, 갈대아에까지 더하였으나[a], 이것으로도 만족하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 압축된 구문입니다. ‘가나안 땅을 향해 갈대아까지’, ‘가나안 땅에서 갈대아까지’, 또는 ‘가나안 땅—갈대아’로 이해할 수 있습니다. 이 표현은 가나안과 갈대아의 지리적·상징적 관계를 압축적으로 나타냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּרְבִּי
  english_pob_choice: You multiplied
  chosen_korean: 더하였으나
  alternatives_korean:
  - 증가시켰으나
  - 늘렸으나
  - 배가시켰으나
  lexicon: HALOT
  rationale: 히필형의 증대·강화 의미를 한국어에서 자연스럽게 살리되, 뒤의 비난 문맥에 맞게 행위의 누적을 드러내는 표현으로 옮겼습니다.
- source_word: תַּזְנוּתֵךְ
  english_pob_choice: your prostitution
  chosen_korean: 네 음행
  alternatives_korean:
  - 네 창녀짓
  - 네 음란 행위
  - 네 매춘
  lexicon: HALOT
  rationale: 예언서의 비유적 성적 배역을 유지하면서도 현대 한국어에서 과도하게 직설적이거나 어색한 표현을 피하기 위해 ‘음행’을 택했습니다. 이는 도덕적 일반화로 약화시키지 않으면서도 본문의 상징성을 보존합니다.
- source_word: אֶרֶץ כְּנַעַן כַּשְׂדִּימָה
  english_pob_choice: to the land of Canaan[a], to Chaldea
  chosen_korean: 가나안 땅까지, 갈대아까지
  alternatives_korean:
  - 가나안 땅을 향해, 갈대아를 향해
  - 가나안 땅에서 갈대아까지
  - 가나안 땅 곧 갈대아까지
  lexicon: HALOT
  rationale: 압축된 지리 구문을 한국어에서 읽히기 쉽게 풀어, 방향·확장의 감각을 살린 ‘~까지’로 옮겼습니다. ‘갈대아’는 본문 지시를 따라 지역명으로 유지했습니다.
- source_word: לֹא שָׂבָעַתְּ
  english_pob_choice: you were not satisfied
  chosen_korean: 만족하지 않았습니다
  alternatives_korean:
  - 충족되지 않았습니다
  - 배부르지 않았습니다
  - 흠족하지 않았습니다
  lexicon: HALOT
  rationale: שׂבע의 ‘만족/충족됨 없음’ 의미를 현대적이고 문어체로 전달했습니다. 본문의 비유적 ‘갈망의 불충족’도 함께 드러납니다.
theological_decisions:
- issue: 예언서의 노골적 성적 은유 유지
  chosen_reading: ‘음행’으로 직접 옮겨, 예루살렘의 언약적 배반을 성적 비유로 드러냈습니다.
  alternative_readings:
  - 네 불신실함
  - 네 죄악
  - 네 음란함
  rationale: 에스겔의 수사는 충격을 주기 위한 노골성을 가지므로, 이를 도덕적 추상어로 약화시키면 본문의 예언적 강도가 줄어듭니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: ‘이 일로도’의 양보적 연결
  chosen_reading: ‘이 일로도 만족하지 않았습니다’로 양보와 불만족의 결론을 유지했습니다.
  alternative_readings:
  - 그럼에도 만족하지 않았습니다
  - 이것으로도 만족하지 않았습니다
  rationale: 히브리어의 וְגַם בְּזֹאת는 단순 병렬이 아니라 ‘이런데도’라는 누적·양보 효과를 내므로, 한국어에서도 그 긴장을 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 6
