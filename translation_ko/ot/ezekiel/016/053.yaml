revisions:
- from: 내가 그들의 포로 상태를 돌이키고—소돔과 그 딸들의 포로 상태와 사마리아와 그 딸들의 포로 상태를 돌이키며, 또 너의 포로 상태도 그들 가운데서 돌이키겠습니다.[a][b]
  to: 내가 소돔과 그 딸들[b]의 형편, 사마리아와 그 딸들의 형편, 그리고 그들 가운데 있는 너의 형편을 회복시키겠습니다.[a]
  rationale: 회복 관용구를 ‘형편을 회복시키다’로 번역하여 원문의 포괄적 회복 의미와 영어 POB의 ‘restore fortunes’를 반영했습니다. 한 동사 아래에 소돔, 사마리아, 예루살렘(‘너’)의 형편을 병렬로 배열하여 히브리어의 구조를 자연스러운 합쇼체 한국어로 재현했습니다. ‘딸들’과 ‘그들 가운데 있는’은 본문에 남겨 원문의 비유와 공간적 관계를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:40:34Z'
