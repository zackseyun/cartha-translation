id: EZK.16.53
reference: Ezekiel 16:53
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׁבְתִּי֙ אֶת שְׁבִ֣יתְ/הֶ֔ן אֶת שבית סְדֹם֙ וּ/בְנוֹתֶ֔י/הָ וְ/אֶת שבית שֹׁמְר֖וֹן וּ/בְנוֹתֶ֑י/הָ ו/שבית שְׁבִיתַ֖יִ/ךְ בְּ/תוֹכָֽ/הְנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/053.yaml
  text: And I will restore their fortunes—the fortunes of Sodom and her daughters[a], and the fortunes of Samaria and her daughters—and your fortunes among them[b],
  footnotes:
  - marker: a
    text: Or 'restore their captivity' / 'bring back their captives.' The Hebrew idiom often means to reverse a people's condition and so can be rendered 'restore fortunes.'
    reason: lexical_alternative
  - marker: b
    text: '''Daughters'' here refers to dependent towns or surrounding settlements associated with Sodom and Samaria.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 소돔과 그 딸들[b]의 형편, 사마리아와 그 딸들의 형편, 그리고 그들 가운데 있는 너의 형편을 회복시키겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형편을 회복시키다’는 히브리어 관용구로, 포로 상태의 회복을 포함하여 처지나 형편의 반전을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘딸들’은 소돔과 사마리아에 딸린 종속 성읍들 또는 주변 정착지를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁבְתִּי
  english_pob_choice: And I will restore
  chosen_korean: 돌이키고
  alternatives_korean:
  - 회복하고
  - 되돌리고
  - 돌려보내고
  lexicon: HALOT
  rationale: שוב의 사역적 용법을 살려 ‘상태를 돌이키다’로 옮기면, 단순한 이동이 아니라 형편의 반전을 나타내는 원뜻을 유지할 수 있습니다.
- source_word: שְׁבִיתְהֶן / שבית / שְׁבִיתַיִךְ
  english_pob_choice: fortunes
  chosen_korean: 포로 상태
  alternatives_korean:
  - 형편
  - 운명
  - 포로들
  lexicon: HALOT
  rationale: 영어 POB의 ‘fortunes’는 히브리어 관용구의 포괄적 회복 의미를 살린 것이므로, 한국어에서는 문맥상 자연스럽고 원뜻을 드러내는 ‘포로 상태’로 옮겼습니다.
- source_word: וּבְנוֹתֶיהָ
  english_pob_choice: and her daughters
  chosen_korean: 그 딸들
  alternatives_korean:
  - 그 성읍들
  - 그 주변 마을들
  lexicon: HALOT
  rationale: 직역 이미지인 ‘딸들’을 본문에 유지해 히브리어 비유를 살리고, 그 지리적 의미는 주석 없이도 문맥상 충분히 읽히도록 했습니다.
- source_word: בְּתוֹכָהְנָה
  english_pob_choice: among them
  chosen_korean: 그들 가운데서
  alternatives_korean:
  - 그들의 한가운데서
  - 그들 중에서
  lexicon: HALOT
  rationale: ‘among them’의 관계적·위치적 의미를 자연스러운 현대 한국어로 옮겨, 세 공동체가 함께 언급되는 구조를 유지했습니다.
theological_decisions:
- issue: restoration idiom in a judgment-restoration oracle
  chosen_reading: ‘포로 상태를 돌이키다’로 옮겨, 회복의 총체적 반전을 드러냈습니다.
  alternative_readings:
  - 포로들을 돌려보내다
  - 포로들을 데려오다
  rationale: 소돔까지 포함된 본문에서는 단순 귀환보다 상태의 전환이 더 넓은 의미이므로, 예언적 반전의 힘을 살리는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: ‘daughters’ as dependent settlements
  chosen_reading: 본문에서는 ‘딸들’을 유지했습니다.
  alternative_readings:
  - 주변 성읍들
  - 속한 마을들
  rationale: 히브리어의 도시-종속 공동체 비유를 보존해, 본문의 수사와 심판/회복의 범위를 그대로 드러내기 위함입니다.
  doctrine_reference: Translation philosophy §1, §6
