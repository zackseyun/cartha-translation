  source_fidelity: 히브리어의 순서와 핵심 의미를 대체로 충실히 반영합니다. ‘수놓은 옷들’, ‘덮다’, ‘내 기름과 내 향’, ‘앞에 두다’는 각각 בִּגְדֵי רִקְמָתֵךְ, וַתְּכַסִּים, וְשַׁמְנִי וּקְטָרְתִּי, נָתַתְּ לִפְנֵיהֶם에 잘 대응합니다. 다만 두 히브리어 복수 대명사의 대상을 한국어에서 일관되게 사물 지시로 처리하는 편이 문맥상 더 자연스럽습니다.
  naturalness: 현 문장은 ‘네가’로 시작하면서 종결을 ‘두었습니다’로 맺어 합쇼체 문장 안에서 주어-종결 표현의 높임 및 문체가 어색합니다. ‘두었으며’로 고치면 고전 예언서 문맥에 적합한 현대적 격식체가 됩니다. 우상 형상을 가리키는 대명사는 ‘그들’보다 ‘그것들’이 한국어에서 자연스럽습니다.
  terminology: ‘수놓은 옷들’, ‘기름’, ‘향’은 적절합니다. 특히 ‘향’은 קְטֹרֶת의 제의적 문맥을 무리 없이 보존합니다. 본문에서 ‘우상’이라고 명시하지 않고 대명사를 유지한 것은 원문에 충실합니다.
