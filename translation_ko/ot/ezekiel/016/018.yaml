  rationale: בִּגְדֵי는 ‘옷/의복’이고 רִקְמָה는 수놓음, 자수를 가리키므로 ‘수놓은 옷들’이 자연스럽고 장식된 사치를 드러냅니다.
- source_word: וַתְּכַסִּים
  english_pob_choice: covered them
  chosen_korean: 그것들을 덮었으며
  alternatives_korean:
  - 그것들을 입혔으며
  - 그것들을 가렸으며
  lexicon: HALOT
  rationale: 동사의 기본 의미는 ‘덮다’이므로 원문에 가장 가깝게 옮겼고, 문맥상 우상에 옷을 입히는 뉘앙스는 주석 여지를 남겼습니다.
- source_word: וְשַׁמְנִי / וּקְטָרְתִּי
  english_pob_choice: my oil and my incense
  chosen_korean: 내 기름과 내 향
  alternatives_korean:
  - 내 기름과 내 향품
  - 내 올리브기름과 내 향
  lexicon: HALOT
  rationale: שֶׁמֶן과 קְטֹרֶת의 기본 대응을 살려 각각 ‘기름’과 ‘향’으로 옮기되, 소유격 ‘내’를 유지해 하나님께 속한 예물을 남용했다는 점을 살렸습니다.
- source_word: לִפְנֵיהֶם
  english_pob_choice: before them
  chosen_korean: 그들 앞에
  alternatives_korean:
  - 그 앞에
  - 그들 면전 앞에
  lexicon: HALOT
  rationale: לִפְנֵי의 기본 의미인 ‘앞에/앞에서’를 살려, 문맥상 우상들을 향해 두었다는 뜻을 간결하게 드러냈습니다.
