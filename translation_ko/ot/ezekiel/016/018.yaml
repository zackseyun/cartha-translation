source:
  edition: WLC
  text: וַ/תִּקְחִ֛י אֶת בִּגְדֵ֥י רִקְמָתֵ֖/ךְ וַ/תְּכַסִּ֑י/ם וְ/שַׁמְנִ/י֙ וּ/קְטָרְתִּ֔/י נתתי לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/018.yaml
  text: You took your embroidered garments and covered them[a], and you set my oil and my incense before them.
  footnotes:
  - marker: a
    text: Or 'clothed them.' The Hebrew verb literally means 'covered them,' but in context it may imply dressing the idols with the garments.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 네 수놓은 옷들을 가져다가 그것들을 덮었으며, 또 내 기름과 내 향을 그들 앞에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들을 입혔습니다.’ 히브리어 동사는 문자적으로는 ‘덮다’이지만, 문맥상 우상에 옷을 입히는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי רִקְמָתֵךְ
  english_pob_choice: your embroidered garments
  chosen_korean: 네 수놓은 옷들
  alternatives_korean:
  - 네 수놓은 의복
  - 네 자수 놓인 옷들
  lexicon: HALOT
  rationale: בִּגְדֵי는 ‘옷/의복’이고 רִקְמָה는 수놓음, 자수를 가리키므로 ‘수놓은 옷들’이 자연스럽고 장식된 사치를 드러냅니다.
- source_word: וַתְּכַסִּים
  english_pob_choice: covered them
  chosen_korean: 그것들을 덮었으며
  alternatives_korean:
  - 그것들을 입혔으며
  - 그것들을 가렸으며
  lexicon: HALOT
  rationale: 동사의 기본 의미는 ‘덮다’이므로 원문에 가장 가깝게 옮겼고, 문맥상 우상에 옷을 입히는 뉘앙스는 주석 여지를 남겼습니다.
- source_word: וְשַׁמְנִי / וּקְטָרְתִּי
  english_pob_choice: my oil and my incense
  chosen_korean: 내 기름과 내 향
  alternatives_korean:
  - 내 기름과 내 향품
  - 내 올리브기름과 내 향
  lexicon: HALOT
  rationale: שֶׁמֶן과 קְטֹרֶת의 기본 대응을 살려 각각 ‘기름’과 ‘향’으로 옮기되, 소유격 ‘내’를 유지해 하나님께 속한 예물을 남용했다는 점을 살렸습니다.
- source_word: לִפְנֵיהֶם
  english_pob_choice: before them
  chosen_korean: 그들 앞에
  alternatives_korean:
  - 그 앞에
  - 그들 면전 앞에
  lexicon: HALOT
  rationale: לִפְנֵי의 기본 의미인 ‘앞에/앞에서’를 살려, 문맥상 우상들을 향해 두었다는 뜻을 간결하게 드러냈습니다.
theological_decisions:
- issue: 마스코트 복수 대명사 ‘them’의 지시 대상
  chosen_reading: ‘그들’은 문맥상 우상들/형상들을 가리키는 것으로 두었습니다.
  alternative_readings:
  - 대상을 명시하지 않고 그대로 두는 읽기
  - ‘우상들’을 본문에 직접 넣는 읽기
  rationale: 원문은 대명사만 사용하므로 본문에는 ‘그들’로 유지하되, 앞뒤 문맥이 우상 숭배를 지시하므로 의미는 분명하게 전달했습니다.
  doctrine_reference: 문맥적 지시 대명사 처리
