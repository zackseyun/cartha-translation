language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֠/כֵן הִנְ/נִ֨י מְקַבֵּ֤ץ אֶת כָּל מְאַהֲבַ֨יִ/ךְ֙ אֲשֶׁ֣ר עָרַ֣בְתְּ עֲלֵי/הֶ֔ם וְ/אֵת֙ כָּל אֲשֶׁ֣ר אָהַ֔בְתְּ עַ֖ל כָּל אֲשֶׁ֣ר שָׂנֵ֑את וְ/קִבַּצְתִּי֩ אֹתָ֨/ם עָלַ֜יִ/ךְ מִ/סָּבִ֗יב וְ/גִלֵּיתִ֤י עֶרְוָתֵ/ךְ֙ אֲלֵ/הֶ֔ם וְ/רָא֖וּ אֶת כָּל עֶרְוָתֵֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/037.yaml
  text: Therefore[a], behold, I am gathering all your lovers with whom you found pleasure, and all whom you loved, along with all whom you hated; and I will gather them against you from every side, and I will uncover your nakedness to them[c][b], and they will see all your nakedness.
  footnotes:
  - marker: a
    text: Or 'in whom you delighted.' The Hebrew verb can denote taking pleasure or delight.
    reason: lexical_alternative
  - marker: b
    text: That is, all categories of her illicit partners and enemies alike are summoned for judgment.
    reason: cultural_note
  - marker: c
    text: '''Uncover your nakedness'' is prophetic shame language for public exposure and humiliation.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 보십시오, 내가 네가 좋아했던 모든 연인들과 네가 사랑했던 모든 이들, 그리고 네가 미워했던 모든 이들을 모으고 있습니다. 내가 그들을 사방에서 너에게로 모아들여 그들 앞에 네 벌거벗은 몸을 드러내겠으며, 그들은 네 모든 벌거벗은 것을 보게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘좋아했던’은 히브리어 동사의 ‘즐거움/기쁨을 얻다’라는 뜻을 반영한 것으로, 성적·배신적 관계의 함의를 완화하지 않으려는 선택입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 예루살렘의 불법한 관계와 적대 세력이 함께 심판 자리로 소환됨을 뜻합니다.
    reason: cultural_note
  - marker: c
    text: ‘벌거벗은 몸을 드러내다’는 공개적 수치와 굴욕을 가리키는 예언적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그렇기 때문에
  - 그래서
  lexicon: HALOT
  rationale: 앞선 고발과 심판 선언의 결과를 잇는 인과 접속사로, 예언서의 재판적 논리를 자연스럽게 살립니다.
- source_word: הִנְנִי מְקַבֵּץ
  english_pob_choice: behold, I am gathering
  chosen_korean: 보십시오, 내가 … 모으고 있습니다
  alternatives_korean:
  - 보라, 내가 … 모으고 있습니다
  - 보십시오, 내가 … 모으겠습니다
  lexicon: HALOT
  rationale: 히브리어의 즉각성과 엄숙성을 살리기 위해 호소형을 넣었고, 진행형으로 임박한 심판 행위를 표현했습니다.
- source_word: מְאַהֲבַיִךְ / אֲשֶׁר עָרַבְתְּ עֲלֵיהֶם
  english_pob_choice: your lovers with whom you found pleasure
  chosen_korean: 네가 좋아했던 모든 연인들
  alternatives_korean:
  - 네가 즐거움을 누렸던 모든 연인들
  - 네가 기뻐했던 모든 연인들
  lexicon: HALOT
  rationale: עָרַב는 이 문맥에서 ‘즐거움을 얻다/좋아하다’의 뜻이므로, 관계의 성적·배신적 함의를 드러내되 한국어로는 과도하게 문어적이지 않게 옮겼습니다.
- source_word: וְאֵת כָּל אֲשֶׁר אָהַבְתְּ / עַל כָּל אֲשֶׁר שָׂנֵאת
  english_pob_choice: and all whom you loved, along with all whom you hated
  chosen_korean: 네가 사랑했던 모든 이들, 그리고 네가 미워했던 모든 이들
  alternatives_korean:
  - 네가 사랑한 모든 이들, 또 네가 미워한 모든 이들
  - 네가 사랑했던 모든 이들, 더불어 네가 미워했던 모든 이들
  lexicon: HALOT
  rationale: 사랑한 대상과 미워한 대상을 모두 포괄하는 병렬 구조를 그대로 살려, 열거의 폭과 심판 대상의 총체성을 유지했습니다.
- source_word: וְגִלֵּיתִי עֶרְוָתֵךְ אֲלֵהֶם
  english_pob_choice: and I will uncover your nakedness to them
  chosen_korean: 그들 앞에 네 벌거벗은 몸을 드러내겠으며
  alternatives_korean:
  - 그들에게 네 수치를 드러내겠으며
  - 그들 앞에서 네 벌거벗음을 드러내겠으며
  lexicon: HALOT
  rationale: עֶרְוָה의 직역적 의미를 살리되, 한국어에서는 ‘벌거벗은 몸’이 수치의 공적 노출이라는 예언적 이미지를 가장 분명하게 전달합니다.
- source_word: וְרָאוּ אֶת כָּל עֶרְוָתֵךְ
  english_pob_choice: and they will see all your nakedness
  chosen_korean: 그들은 네 모든 벌거벗은 것을 보게 될 것입니다
  alternatives_korean:
  - 그들은 네 모든 벌거벗은 몸을 보게 될 것입니다
  - 그들은 네 모든 수치를 보게 될 것입니다
  lexicon: HALOT
  rationale: 반복된 עֶרְוָה를 보존하면서도 한국어에서 자연스럽게 읽히도록, 노출의 총체성을 강조하는 표현을 선택했습니다.
theological_decisions:
- issue: 예언적 성적-수치 메타포의 보존
  chosen_reading: ‘연인들’과 ‘벌거벗은 몸’의 구체적 이미지를 유지해, 정치적 동맹이나 단순한 수치심으로 완화하지 않았습니다.
  alternative_readings:
  - 동맹자들/협력자들로 완화해 번역
  - 수치/치욕으로 일반화해 번역
  rationale: 본 절은 언약 배반을 공적 노출과 수치의 언어로 심판하는 장면이므로, 원문의 예언적 충격과 신학적 날카로움을 보존하는 것이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
