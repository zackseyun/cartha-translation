source:
  edition: WLC
  text: אֶל כָּל רֹ֣אשׁ דֶּ֗רֶךְ בָּנִית֙ רָֽמָתֵ֔/ךְ וַ/תְּתַֽעֲבִי֙ אֶת יָפְיֵ֔/ךְ וַ/תְּפַשְּׂקִ֥י אֶת רַגְלַ֖יִ/ךְ לְ/כָל עוֹבֵ֑ר וַ/תַּרְבִּ֖י אֶת תזנת/ך־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/025.yaml
  text: At every street corner you built your high place[a], and you made your beauty detestable[b]. You spread your legs to every passerby and multiplied your prostitution.
  footnotes:
  - marker: a
    text: Or 'At every road junction' (literally, 'at every head of the way').
    reason: lexical_alternative
  - marker: b
    text: Or 'multiplied your whoring.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 거리 모퉁이마다 네 높임 자리를 쌓고, 네 아름다움을 역겹게 만들었으며[b], 지나가는 모든 이에게 네 다리를 벌리고 네 음행을 더했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘네 창녀짓을 더했습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל כָּל רֹאשׁ דֶּרֶךְ
  english_pob_choice: At every street corner
  chosen_korean: 네 거리 모퉁이마다
  alternatives_korean:
  - 네 길의 머리마다
  - 모든 길목마다
  - 모든 도로의 교차점마다
  lexicon: WLC / HALOT
  rationale: 히브리어 관용구는 길이 만나는 두드러진 지점을 가리키므로, 현대 한국어에서는 자연스럽고 공적 노출감을 살리는 ‘거리 모퉁이’가 적절합니다.
- source_word: רָמָתֵךְ
  english_pob_choice: your high place
  chosen_korean: 네 높임 자리
  alternatives_korean:
  - 네 산당
  - 네 높은 곳
  - 네 제의적 높은 자리
  lexicon: HALOT
  rationale: ‘높임 자리’는 רָמָה의 문자적 의미와 우상숭배적 제의 장소라는 문맥을 함께 살리면서, 한국 교회 전통어 ‘산당’으로 의미를 미리 고정하지 않도록 합니다.
- source_word: וַתַּעֲבִי אֶת יָפְיֵךְ
  english_pob_choice: you made your beauty detestable
  chosen_korean: 네 아름다움을 역겹게 만들었으며
  alternatives_korean:
  - 네 아름다움을 가증스럽게 만들었으며
  - 네 아름다움을 혐오스럽게 만들었으며
  - 네 아름다움을 더럽혔으며
  lexicon: HALOT
  rationale: תעב의 핵심은 ‘가증스럽게/역겹게 만들다’이므로, 대상이 된 ‘아름다움’의 역전 효과를 드러내는 ‘역겹게 만들다’가 가장 직접적입니다.
- source_word: וַתְּפַשְּׂקִי אֶת רַגְלַיִךְ לְכָל עוֹבֵר
  english_pob_choice: You spread your legs to every passerby
  chosen_korean: 지나가는 모든 이에게 네 다리를 벌리고
  alternatives_korean:
  - 지나가는 모든 이에게 네 다리를 벌려
  - 모든 지나가는 자에게 네 다리를 벌리고
  - 지나가는 자마다 네 다리를 벌리고
  lexicon: HALOT
  rationale: 본문의 성적 은유를 완화하지 않기 위해 직설적으로 옮기되, 한국어에서 문법적으로 자연스러운 현재 서술형으로 다듬었습니다.
- source_word: וַתַּרְבִּי אֶת תזנתך
  english_pob_choice: and multiplied your prostitution
  chosen_korean: 네 음행을 더했습니다
  alternatives_korean:
  - 네 창녀짓을 더했습니다
  - 네 매춘을 더했습니다
  - 네 음행을 증가시켰습니다
  lexicon: HALOT
  rationale: תזנה는 예언서에서 우상숭배의 성적 비유를 가리키므로, 현대적이면서도 신학적 함의를 보존하는 ‘음행’이 적절합니다.
theological_decisions:
- issue: 노골적인 성적 은유를 본문 수준에서 유지할지 여부
  chosen_reading: 직설적 표현인 ‘네 다리를 벌리고’, ‘음행’을 본문에 유지합니다.
  alternative_readings:
  - 완곡하게 ‘자기를 내어주고’로 순화
  - 전통적 표현 ‘음행하다’만 사용
  rationale: 히브리어는 공적 우상숭배의 수치와 파괴성을 충격적으로 드러내므로, 완곡화하면 예언적 고발의 힘이 약해집니다.
  doctrine_reference: 번역 원칙 §§1, 6
