  naturalness: ‘수치를 지니십시오’도 이해할 수 있으나, 심판과 치욕을 감당한다는 נשא의 관용적 뜻에는 ‘수치를 감당하십시오’가 더 자연스럽고 정확합니다. 수정문은 현대 표준어 합쇼체를 유지하면서 수식 관계를 명료하게 합니다.
