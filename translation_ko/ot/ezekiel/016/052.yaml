source:
  edition: WLC
  text: גַּם אַ֣תְּ שְׂאִ֣י כְלִמָּתֵ֗/ךְ אֲשֶׁ֤ר פִּלַּלְתְּ֙ לַֽ/אֲחוֹתֵ֔/ךְ בְּ/חַטֹּאתַ֛יִ/ךְ אֲשֶׁר הִתְעַ֥בְתְּ מֵ/הֵ֖ן תִּצְדַּ֣קְנָה מִמֵּ֑/ךְ וְ/גַם אַ֥תְּ בּ֨וֹשִׁי֙ וּ/שְׂאִ֣י כְלִמָּתֵ֔/ךְ בְּ/צַדֶּקְתֵּ֖/ךְ אַחְיוֹתֵֽ/ךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/052.yaml
  text: You also[a], bear your disgrace, because you pronounced judgment in favor of your sisters. By your sins in which you acted more abominably than they, they have become more righteous than you. So you too, be ashamed and bear your disgrace[b], because you made your sisters appear righteous.
  footnotes:
  - marker: a
    text: 'Or ''you judged in favor of your sisters'' / ''you interceded for your sisters.'' The Hebrew is ironic: Jerusalem''s sins have effectively vindicated her sisters by comparison.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they are justified more than you.' The sense is comparative, not that they were righteous in an absolute sense.
    reason: alternative_reading
translation:
  language: ko
  text: 너도[a] 네 수치를 감당하십시오. 네가 그들보다 더 가증하게 행한 네 죄로 네 자매들을 변호하였으니, 그들이 너보다 더 의롭습니다[b]. 그러므로 너도 부끄러워하며 네 수치를 감당하십시오. 네가 네 자매들을 의롭다고 보이게 하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 자매들을 위하여 판결했다’ / ‘네 자매들을 위하여 중재했다’. 히브리어는 아이러니를 띤 표현으로, 예루살렘의 죄가 비교상 자매들을 변호해 준 셈이 되었다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 너보다 더 정당하다’. 여기서 ‘더 의롭다’는 절대적 의로움이 아니라 비교적 의미입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאִי כְלִמָּתֵךְ
  english_pob_choice: bear your disgrace
  chosen_korean: 네 수치를 지니십시오
  alternatives_korean:
  - 네 수치를 감당하십시오
  - 네 수치를 تحمل하십시오
  lexicon: HALOT
  rationale: נשא의 관용적 용법은 단순히 ‘들다’가 아니라 수치/치욕을 짊어지다라는 뜻이므로, 현대 한국어에서는 ‘지니다’로 그 짐의 지속적 부담을 살렸습니다.
- source_word: פִּלַּלְתְּ לַאֲחוֹתֵךְ
  english_pob_choice: you pleaded for your sisters
  chosen_korean: 네 자매들을 위해 판결한 것은
  alternatives_korean:
  - 네 자매들을 위해 중재한 것은
  - 네 자매들을 위해 변론한 것은
  lexicon: HALOT
  rationale: פלל의 문맥상 의미는 단순한 감정 표현이 아니라 ‘판결/중재 쪽으로 작용하다’는 아이러니한 법정적 뉘앙스가 있어, 한국어에서는 간결하게 ‘판결한 것은’으로 옮겼습니다.
- source_word: תִּצְדַּקְנָה מִמֵּךְ
  english_pob_choice: they are more righteous than you
  chosen_korean: 그들이 너보다 더 의롭습니다
  alternatives_korean:
  - 그들이 너보다 더 의롭다고 여겨집니다
  - 그들이 너보다 더 의롭다 인정됩니다
  lexicon: HALOT
  rationale: 비교 구문에서 צדק은 절대적 무죄가 아니라 상대적 ‘의롭다/옳다’의 판정을 뜻하므로, 본문 의미를 흐리지 않으면서도 한국어에서는 직설적으로 ‘더 의롭습니다’로 옮겼습니다.
- source_word: בְּצַדֶּקְתֵּךְ אַחְיוֹתֵךְ
  english_pob_choice: because you made your sisters appear righteous
  chosen_korean: 네가 네 자매들을 의롭다고 보이게 하였기 때문입니다
  alternatives_korean:
  - 네가 네 자매들을 의롭다 하였기 때문입니다
  - 네가 네 자매들을 의인처럼 보이게 하였기 때문입니다
  lexicon: HALOT
  rationale: צדק의 파생형을 영어 POB처럼 비교적·법정적 효과로 살려, 자매들이 실제로 의롭다는 뜻이 아니라 ‘의롭다고 보이게 된’ 결과를 드러냈습니다.
theological_decisions:
- issue: 예루살렘의 죄가 소돔·사마리아의 상대적 의로움을 드러내는 역설
  chosen_reading: 자매들이 실제로 무죄하거나 절대적으로 의롭다는 뜻이 아니라, 예루살렘의 더 큰 가증함 때문에 비교상 더 의롭게 보인다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 자매들이 절대적으로 의롭다고 읽는 번역
  - 법정적 무죄 선고만 강조하는 번역
  rationale: 에스겔 16장의 수사는 충격적 비교를 통해 예루살렘의 죄를 고발하는 것이므로, 상대적 정당화라는 긴장을 풀지 않고 보존해야 합니다.
  doctrine_reference: 원문의 비교·풍자적 수사를 보존하여 신학적 긴장을 유지합니다.
