    rationale: בְּחַטֹּאתַיִךְ는 자매들을 위한 변호/정당화가 발생하게 된 수단·계기이며, 그 죄는 자매들보다 더 가증하게 행한 죄로 한정됩니다. 이를 ‘판결의 이유’라고만 하면 문맥의 비교적 역설이 약화됩니다.
