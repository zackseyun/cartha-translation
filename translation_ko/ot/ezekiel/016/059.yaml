  terminology: אֲדֹנָי יְהוִה는 ‘주 야훼’로 두 요소를 보존했습니다. אָלָה는 문맥상 ‘맹세’로 번역하되, ‘저주’ 및 저주 제재를 수반하는 맹세라는 가능성을 각주에 남깁니다. 각주 표지는 해당 어휘 ‘맹세’에 직접 붙입니다.
