  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה ו/עשית אוֹתָ֖/ךְ כַּ/אֲשֶׁ֣ר עָשִׂ֑ית אֲשֶׁר בָּזִ֥ית אָלָ֖ה לְ/הָפֵ֥ר בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/059.yaml
  text: 'For thus says the Lord GOD: I will deal with you as you have done[a], because you despised the oath by breaking the covenant.'
  footnotes:
  - marker: a
    text: Or 'the curse'; the Hebrew term can denote an oath, especially one carrying covenantal curse-sanctions.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. “내가 네가 행한 것대로 너를 대하겠습니다. 네가 언약을 깨뜨림으로써 맹세[a]를 멸시하였기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저주’. 히브리어 אָלָה는 언약적 저주 제재를 동반하는 맹세를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 합성 호칭은 주권 호칭과 언약 이름을 함께 드러내므로, POB의 Yahweh 원칙에 따라 '야훼'를 유지하고 '주'로 אֲדֹנָי를 살렸습니다.
- source_word: וְעָשִׂית אוֹתָךְ
  english_pob_choice: I will deal with you
  chosen_korean: 내가 … 너를 대하겠습니다
  alternatives_korean:
  - 내가 … 너에게 행하겠습니다
  - 내가 … 너를 다루겠습니다
  lexicon: HALOT
  rationale: עשה + 목적어의 관용구를 한국어에서 자연스럽고 재판적 뉘앙스가 살아 있는 '대하다'로 옮겼습니다.
- source_word: בָּזִית
  english_pob_choice: you despised
  chosen_korean: 멸시하였기 때문입니다
  alternatives_korean:
  - 경멸하였기 때문입니다
  - 업신여겼기 때문입니다
  lexicon: HALOT
  rationale: בזה는 단순한 무시보다 강한 경멸/멸시의 의미가 있으므로, 예언적 책망의 톤을 살려 '멸시하다'를 선택했습니다.
- source_word: אָלָה
  english_pob_choice: the oath
  chosen_korean: 맹세
  alternatives_korean:
  - 서약
  - 저주
  lexicon: HALOT
  rationale: 문맥상 '언약을 깨뜨리다'와 맞물려 맹세의 의미가 우선이지만, אָלָה가 저주-제재를 동반한 맹세를 가리킬 수 있어 주석으로 긴장을 보존합니다.
theological_decisions:
- issue: ו/עשית אוֹתָךְ as divine retribution formula
  chosen_reading: 내가 네가 행한 것대로 너를 대하겠습니다
  alternative_readings:
  - 내가 너에게 네가 한 대로 하겠습니다
  - 내가 네게 행한 대로 하겠습니다
  rationale: 본문의 보응 공식은 단순한 행동 묘사가 아니라 언약적 심판 선언이므로, 한국어도 그 공적·법정적 뉘앙스를 유지했습니다.
  doctrine_reference: Ezekiel covenant lawsuit context; preserve retributive symmetry
