  source_fidelity: ‘그러므로’에는 히브리어 כִּי의 근거 제시 기능을 넘어선 추론적 접속의 뉘앙스가 있어 삭제하는 것이 적절합니다. 또한 לְהָפֵר는 여기서 언약을 깨뜨리려는 목적이라기보다 언약을 깨뜨리는 행위와 연결되므로, ‘깨뜨리려고’는 본문 의미를 좁힙니다.
