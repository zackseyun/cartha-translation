id: EZK.16.12
reference: Ezekiel 16:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶתֵּ֥ן נֶ֨זֶם֙ עַל אַפֵּ֔/ךְ וַ/עֲגִילִ֖ים עַל אָזְנָ֑יִ/ךְ וַ/עֲטֶ֥רֶת תִּפְאֶ֖רֶת בְּ/רֹאשֵֽׁ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/012.yaml
  text: And I put a ring on your nose[a], earrings on your ears[b], and a splendid crown on your head.
  footnotes:
  - marker: a
    text: Or 'a nose-ring on your nose.' The Hebrew נֶזֶם often refers specifically to a nose ornament in such contexts.
    reason: lexical_alternative
  - marker: b
    text: Literally 'a crown of beauty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 네 코에 코고리를, 네 귀에 귀고리를 달고, 네 머리에는 화려한 왕관을 씌웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן
  english_pob_choice: And I put
  chosen_korean: 나는 … 두고 / 달며 / 씌웠습니다
  alternatives_korean:
  - 나는 … 주었습니다
  - 나는 … 놓았습니다
  lexicon: HALOT
  rationale: 문맥상 몸의 각 부분에 장신구를 ‘놓는’ 행위이므로, 단순한 ‘주었습니다’보다 배치 동작을 드러내는 ‘두고/달며/씌웠습니다’가 더 자연스럽고 מקור에 가깝습니다.
- source_word: נֶזֶם עַל אַפֵּךְ
  english_pob_choice: a ring on your nose
  chosen_korean: 네 코에 반지
  alternatives_korean:
  - 네 코에 코걸이
  - 네 코에 코장식
  lexicon: HALOT
  rationale: נֶזֶם은 보통 코 장신구를 가리킬 수 있지만, 본문이 이미 ‘코에’라고 명시하므로 중복을 피하고 장식물의 기본 의미를 살려 ‘반지’로 옮겼습니다.
- source_word: וַעֲגִילִים עַל אָזְנָיִךְ
  english_pob_choice: earrings on your ears
  chosen_korean: 네 귀에 귀고리
  alternatives_korean:
  - 네 귀에 귀걸이
  - 네 귀에 고리 장식
  lexicon: HALOT
  rationale: עגילים은 귀 장식물로서 현대 한국어의 표준적 대응은 ‘귀고리/귀걸이’입니다. 장식의 기능을 분명히 하면서도 문맥의 병렬 구조를 살렸습니다.
- source_word: וַעֲטֶרֶת תִּפְאֶרֶת
  english_pob_choice: a splendid crown
  chosen_korean: 화려한 왕관
  alternatives_korean:
  - 아름다운 왕관
  - 영광스러운 왕관
  - 아름다운 관
  lexicon: HALOT
  rationale: תִּפְאֶרֶת은 아름다움·화려함·영광의 뉘앙스를 가지므로, 의복과 장식의 맥락에서 ‘화려한’이 가장 직접적으로 대응합니다.
