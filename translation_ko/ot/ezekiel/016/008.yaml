source:
  edition: WLC
  text: וָ/אֶעֱבֹ֨ר עָלַ֜יִ/ךְ וָ/אֶרְאֵ֗/ךְ וְ/הִנֵּ֤ה עִתֵּ/ךְ֙ עֵ֣ת דֹּדִ֔ים וָ/אֶפְרֹ֤שׂ כְּנָפִ/י֙ עָלַ֔יִ/ךְ וָ/אֲכַסֶּ֖ה עֶרְוָתֵ֑/ךְ וָ/אֶשָּׁ֣בַֽע לָ֠/ךְ וָ/אָב֨וֹא בִ/בְרִ֜ית אֹתָ֗/ךְ נְאֻ֛ם אֲדֹנָ֥/י יְהוִ֖ה וַ/תִּ֥הְיִי לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/008.yaml
  text: When I passed by you and saw you[a], behold, your time was the time for love. So I spread the edge of my garment over you and covered your nakedness. I swore myself to you and entered into a covenant with you, declares the Lord GOD[b], and you became mine.
  footnotes:
  - marker: a
    text: Or, more literally, 'I spread my wing over you.' The Hebrew idiom can refer to the edge of a garment and evokes marital protection or claim.
    reason: lexical_alternative
  - marker: b
    text: '''The time for love'' may also be rendered ''the time for caresses'' or ''the time for lovemaking''; the Hebrew carries romantic and erotic overtones within the marriage metaphor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 네 곁을 지나가다가 너를 보니, 보십시오, 네 때가 사랑의 때였습니다. 내가 내 옷자락을 네 위에 펴서 네 벌거벗음을 가리고, 네게 맹세하고 너와 언약을 맺었습니다. 주 야훼의 말씀입니다. 그러자 네가 내 것이 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘내 날개를 네 위에 펼치다’는 관용적으로 옷자락을 펼쳐 덮는 행위를 가리킬 수 있으며, 혼인 관계에서의 보호와 결연의 뜻을 함께 띱니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사랑의 때’는 ‘애무의 때’ 또는 ‘잠자리의 때’로도 옮길 수 있습니다. 히브리어는 이 혼인 비유 안에서 연애적·성적 뉘앙스를 함께 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר עָלַיִךְ
  english_pob_choice: When I passed by you
  chosen_korean: 내가 네 곁을 지나며
  alternatives_korean:
  - 내가 너를 지나가며
  - 내가 네 앞을 지나며
  lexicon: HALOT
  rationale: עָבַר עַל은 단순한 이동보다 ‘곁을 지나가다’의 뜻이 자연스럽고, 장면의 긴밀함을 살리기 위해 ‘네 곁을 지나며’로 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보아라
  alternatives_korean:
  - 보라
  - 이제
  lexicon: HALOT
  rationale: 히브리어 הִנֵּה의 주의 환기 효과를 살리기 위해 직설적이면서도 현대 한국어에서 자연스러운 감탄형 ‘보아라’를 택했습니다.
- source_word: עִתֵּךְ עֵת דֹּדִים
  english_pob_choice: your time was the time for love
  chosen_korean: 네 때는 사랑의 때였으나
  alternatives_korean:
  - 네 때는 연애의 때였으나
  - 네 때는 정사의 때였으나
  lexicon: HALOT
  rationale: דֹּדִים은 사랑과 성적/혼인적 뉘앙스를 함께 가지므로, 노골화도 완화도 피하면서 메타포의 폭을 유지하는 ‘사랑의 때’로 옮겼습니다.
- source_word: וָאֶפְרֹשׂ כְּנָפִי עָלַיִךְ
  english_pob_choice: I spread the edge of my garment over you
  chosen_korean: 내가 내 옷자락을 네 위에 펴서
  alternatives_korean:
  - 내 날개를 네 위에 펴서
  - 내 겉옷의 가장자리를 네 위에 펴서
  lexicon: HALOT
  rationale: כָּנָף는 문자적으로 ‘날개’지만 옷자락/가장자리의 관용구로도 쓰이므로, 혼인적 보호와 청혼의 함의를 한국어에서 분명히 드러내는 ‘옷자락’을 사용했습니다.
- source_word: וָאֲכַסֶּה עֶרְוָתֵךְ
  english_pob_choice: and covered your nakedness
  chosen_korean: 네 벌거벗음을 가리고
  alternatives_korean:
  - 네 수치를 가리고
  - 네 알몸을 덮고
  lexicon: HALOT
  rationale: עֶרְוָה는 단순한 ‘수치’보다 실제 노출된 벌거벗음을 가리키므로, 본문의 육체적·상징적 함의를 함께 살리는 표현을 택했습니다.
- source_word: וָאָבוֹא בִבְרִית אֹתָךְ
  english_pob_choice: and entered into a covenant with you
  chosen_korean: 너와 언약을 맺었으니
  alternatives_korean:
  - 너와 계약을 맺었으니
  - 너와 언약 안으로 들어갔으니
  lexicon: HALOT
  rationale: בוא בברית는 관용적으로 ‘언약을 맺다/들어가다’의 뜻이므로, 한국어 성경에서 익숙하면서도 본문에 충실한 ‘언약을 맺다’를 선택했습니다.
theological_decisions:
- issue: 혼인-언약 비유와 성적 뉘앙스의 처리
  chosen_reading: 과도하게 완곡하거나 노골적으로 만들지 않고, ‘사랑의 때’, ‘옷자락’, ‘벌거벗음’, ‘언약’의 연결을 그대로 살렸습니다.
  alternative_readings:
  - 완전히 완곡한 표현으로 바꾸기
  - 성적 표현을 더 직접적으로 드러내기
  rationale: 이 절은 예루살렘에 대한 야훼의 언약적 사랑을 혼인 이미지로 묘사하므로, 비유의 신학적 힘을 약화시키지 않으면서도 한국어로 읽을 수 있는 수준을 유지해야 합니다.
  doctrine_reference: Ezekiel 16:8 marriage-covenant imagery
- issue: אֲדֹנָי יְהוִה의 한국어 처리
  chosen_reading: ‘주 여호와’로 옮기고, 발화 표지는 본문 안에 덧붙였습니다.
  alternative_readings:
  - 주 야훼
  - 주 하나님
  rationale: 본문의 예언자적 공식 ‘주 여호와의 말씀이니라’를 한국어 예언서 문체에 맞게 전달하되, 주석 없이도 즉시 인식되는 전통적 호칭을 유지했습니다.
  doctrine_reference: POB divine-name rendering convention
