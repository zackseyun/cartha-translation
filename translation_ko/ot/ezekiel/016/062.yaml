  lexicon: HALOT
  rationale: 히필형 קום은 언약을 ‘서게 하다/세우다’는 뜻이므로, 한국어에서는 ‘세우다’가 가장 자연스럽고 언약 문맥도 잘 살립니다.
- source_word: אֲנִי
  english_pob_choice: I myself
  chosen_korean: 내가 바로
  alternatives_korean:
  - 내가
  - 내가 친히
  - 바로 내가
  lexicon: HALOT
  rationale: 독립 인칭대명사가 주는 강조를 살리기 위해 주어를 앞세워 ‘내가 바로’로 옮겼습니다.
- source_word: בְּרִיתִי
