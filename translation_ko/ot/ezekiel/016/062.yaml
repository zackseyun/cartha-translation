  - 주님
  rationale: 본문은 호칭이 아니라 언약의 고유명사를 사용하므로, 대체 칭호인 ‘주님’보다 이름 자체를 드러내는 ‘야훼’가 원문 효과를 더 정확히 반영합니다.
