    rationale: כִּמְעַט קָט는 문자적으로 ‘아주 작은 일인 양’이라는 표현을 포함합니다. 문맥상 그 뜻이 ‘그것으로는 너무 부족하다는 듯’이라는 수사적 상승으로 작동한다고 설명해야 하며, 문자적 의미가 ‘아니다’라고 해서는 안 됩니다.
