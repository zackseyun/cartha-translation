theological_decisions:
- issue: 예루살렘의 죄책 비교와 수사적 상승
  chosen_reading: 예루살렘은 다른 도시들의 죄를 단순히 모방한 것이 아니라, 오히려 그들보다 더 심하게 타락한 것으로 제시됩니다.
  alternative_readings:
  - 예루살렘이 잠시 덜 심각한 길을 갔다는 의미로 읽을 수 있음
  - 예루살렘이 그들과는 다른 종류의 타락을 했다는 뜻으로 읽을 수 있음
  rationale: כִּמְעַט קָט 뒤의 문맥이 비교의 반전과 상승을 이루므로, 본문이 말하는 예언적 고발의 강도를 그대로 유지하는 것이 가장 적절합니다.
  doctrine_reference: Translation philosophy §3 (source tension and rhetorical force preserved)
