  text: Yet you did not walk in their ways or act according to their abominations[a]; as if that were too little[b], you became more corrupt than they in all your ways.
  footnotes:
  - marker: a
    text: Or more literally, 'and you did/committed their abominations.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''as a very little thing,'' meaning that even matching their sins was not enough; Jerusalem went beyond them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너는 그들의 길을 따라 걷지도 않고 그들의 가증한 일들을 행하지도 않았습니다만,[a] 그것조차 너무 작은 일인 양, 너는 네 모든 길에서 그들보다 더 타락했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 가증한 일들을 하고’ 또는 ‘저질렀다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구를 직역하면 ‘아주 작은 일인 양’입니다. 문맥에서는 그 정도로는 충분하지 않았다는 듯, 예루살렘이 그들보다 더 나아가 타락했음을 강조합니다.
    reason: lexical_alternative
