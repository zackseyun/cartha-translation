revisions:
- from: 그러나 네가 그들의 길로 걷지 아니하고 그들의 가증한 일들을 행하지도 아니하였으며, 그것조차도 너무 작은 일인 듯하여, 네가 모든 길에서 그들보다 더 타락하였느니라.[a][b]
  to: 그러나 너는 그들의 길을 따라 걷지도 않고 그들의 가증한 일들을 행하지도 않았습니다만,[a] 그것조차 너무 작은 일인 양, 너는 네 모든 길에서 그들보다 더 타락했습니다.[b]
  rationale: 원문의 대조와 수사적 상승을 유지하면서, 문체를 현대 표준어 합쇼체로 통일했습니다. ‘그들의 길을 따라 걷다’로 히브리어의 길 은유를 자연스럽게 살렸고, ‘네 모든 길에서’로 반복되는 דרך 어휘도 보존했습니다. 각주 표지는 해당 어구 뒤에 배치했으며, 관용구 각주는 문자적 표현과 문맥상의 기능을 모두 정확히 설명하도록 고쳤습니다.
