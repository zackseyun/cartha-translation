base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/047.yaml
  text: Yet you did not walk in their ways or act according to their abominations[a]; as if that were too little[b], you became more corrupt than they in all your ways.
  footnotes:
  - marker: a
    text: Or more literally, 'and you did/committed their abominations.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''as a very little thing,'' meaning that even matching their sins was not enough; Jerusalem went beyond them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 네가 그들의 길로 걷지 아니하고 그들의 가증한 일들을 행하지도 아니하였으며, 그것조차도 너무 작은 일인 듯하여, 네가 모든 길에서 그들보다 더 타락하였느니라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 가증한 일들을 하고/저질렀다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, ‘아주 작은 일’이라는 뜻이 아니라 오히려 그것만으로는 충분하지 않았다는 수사입니다.
    reason: lexical_alternative
