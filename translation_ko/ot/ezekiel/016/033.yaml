  text: לְ/כָל זֹנ֖וֹת יִתְּנוּ נֵ֑דֶה וְ/אַ֨תְּ נָתַ֤תְּ אֶת נְדָנַ֨יִ/ךְ֙ לְ/כָל מְאַֽהֲבַ֔יִ/ךְ וַ/תִּשְׁחֳדִ֣י אוֹתָ֗/ם לָ/ב֥וֹא אֵלַ֛יִ/ךְ מִ/סָּבִ֖יב בְּ/תַזְנוּתָֽיִ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/033.yaml
  text: Men give a prostitute her payment, but you gave your gifts to all your lovers, and you bribed them to come to you from all around for your prostitutions.
translation:
  language: ko
  text: 모든 창녀에게는 사례금이 주어집니다. 그러나 너는 네 연인들 모두에게 네 선물을 주었고, 또 네 음행 때문에 사방에서 네게 오게 하려고 그들을 매수하였느니라.[a][b][c]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘매춘부’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사랑하는 자들’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘뇌물로 샀느니라’
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹנוֹת
  english_pob_choice: a prostitute
  chosen_korean: 창녀
  alternatives_korean:
  - 매춘부
  - 음녀
  lexicon: זֹנָה
  rationale: 문맥상 실제 성매매 여성을 가리키는 직설적 표현이므로, 완곡한 종교어보다 한국어로도 강한 원문의 비판성을 살리는 ‘창녀’를 택했습니다.
- source_word: נֵדֶה
  english_pob_choice: payment
  chosen_korean: 사례금
  alternatives_korean:
  - 보수
  - 대가
  - 삯
  lexicon: נֵדֶה
  rationale: 통상적 ‘임금’보다 성적 행위에 대한 보상이라는 뉘앙스가 있어, 한국어에서 거래적 보상을 드러내는 ‘사례금’으로 옮겼습니다.
- source_word: מְאַהֲבַיִךְ
  english_pob_choice: your lovers
  chosen_korean: 네 연인들
  alternatives_korean:
  - 네 애인들
  - 네 사랑하는 자들
  lexicon: אהב
  rationale: 예언적 비유에서의 관계를 직역하되, 행위의 도덕적 타락을 흐리지 않기 위해 일상적 ‘연인들’을 사용했습니다.
- source_word: וַתִּשְׁחֳדִי
  english_pob_choice: you bribed them
  chosen_korean: 그들을 매수하였느니라
  alternatives_korean:
  - 그들을 뇌물로 샀느니라
  - 그들에게 뇌물을 주었느니라
  lexicon: שׁחד
  rationale: 히브리어 동사의 핵심은 금전/선물로 상대를 움직이는 ‘매수’이므로, 관계를 미화하는 표현보다 직접적인 경제적 조작을 드러냈습니다.
theological_decisions:
- issue: 예언적 정죄에서의 성적 은유를 얼마나 직접적으로 살릴지
  chosen_reading: 원문이 의도하는 수치와 도덕적 고발을 유지하기 위해 ‘창녀’, ‘음행’, ‘매수’처럼 직설적 표현을 사용했습니다.
  alternative_readings:
  - 완곡한 ‘음녀’ 중심 표현
  - 비유를 약화한 일반적 ‘죄인’ 표현
  rationale: 에스겔 16장의 수사적 충격을 낮추면 본문의 심판 선언이 흐려지므로, 원문의 거친 비난을 한국어에서도 보존하는 것이 필요합니다.
  doctrine_reference: 예언서의 언약 배반 고발과 심판 선포
