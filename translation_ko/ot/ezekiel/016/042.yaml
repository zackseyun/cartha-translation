id: EZK.16.42
reference: Ezekiel 16:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲנִחֹתִ֤י חֲמָתִ/י֙ בָּ֔/ךְ וְ/סָ֥רָה קִנְאָתִ֖/י מִמֵּ֑/ךְ וְ/שָׁ֣קַטְתִּ֔י וְ/לֹ֥א אֶכְעַ֖ס עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/042.yaml
  text: So I will satisfy my wrath against you[a], and my jealousy will turn away from you[b]; then I will be quiet and no longer be angry.
  footnotes:
  - marker: a
    text: Or 'my zeal will depart from you.' The Hebrew קִנְאָה can mean either 'jealousy' or 'zeal'; 'jealousy' fits the marital-covenant imagery of this chapter best.
    reason: lexical_alternative
  - marker: b
    text: Literally 'I will cause my wrath to rest in you.' The translation 'I will satisfy my wrath against you' expresses the sense that the wrath is spent or settled.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런즉 내가 너에 대한 내 분노를 풀고, 내 질투가 너에게서 떠나며, 내가 잠잠해지고 다시는 성내지 않겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 질투’는 히브리어 קִנְאָה의 가능한 뜻 가운데 하나입니다. 이 장의 혼인 언약 이미지에는 ‘질투’가 ‘열심’보다 더 직접적으로 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 분노를 풀고’는 문자적으로는 ‘내 분노를 네 안에 쉬게 하다’에 가깝습니다. 여기서는 분노가 완전히 가라앉는 뜻을 자연스럽게 드러냈습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲנִחֹתִי חֲמָתִי
  english_pob_choice: I will satisfy my wrath
  chosen_korean: 내 분노를 풀고
  alternatives_korean:
  - 내 진노를 쉬게 하고
  - 내 분노를 거두고
  - 내 분노를 가라앉히고
  lexicon: HALOT
  rationale: 히필 형태는 ‘쉬게 하다/놓아두다’의 감각이지만, 문맥상 분노가 소진·진정되는 뜻이므로 한국어에서는 ‘풀다’가 가장 자연스럽고 원뜻을 과도하게 약화하지 않습니다.
- source_word: חֲמָתִי
  english_pob_choice: my wrath
  chosen_korean: 내 분노
  alternatives_korean:
  - 내 진노
  - 내 격분
  lexicon: HALOT
  rationale: 지속적인 언약적 심판의 감정을 나타내므로 ‘분노’가 가장 넓고 안정적인 대응이며, ‘진노’도 가능하지만 여기서는 문장 흐름이 더 부드럽습니다.
- source_word: קִנְאָתִי
  english_pob_choice: my jealousy
  chosen_korean: 내 질투
  alternatives_korean:
  - 내 열심
  - 내 시기
  lexicon: HALOT
  rationale: 이 장의 혼인 언약 비유에서는 קִנְאָה를 ‘열심’보다 ‘질투’로 옮기는 것이 문맥의 배우자적 배경을 가장 잘 보존합니다.
- source_word: וְשָׁקַטְתִּי
  english_pob_choice: I will be quiet
  chosen_korean: 내가 잠잠해지고
  alternatives_korean:
  - 내가 शांत해지고
  - 내가 고요해지고
  - 내가 쉬고
  lexicon: HALOT
  rationale: שׁקט는 소란이 그친 정적을 가리키므로, ‘잠잠해지고’가 분노와 질투가 가라앉는 병렬을 잘 살립니다.
- source_word: וְלֹא אֶכְעַס עוֹד
  english_pob_choice: no longer be angry
  chosen_korean: 다시는 성내지 않겠습니다
  alternatives_korean:
  - 더는 화내지 않겠습니다
  - 다시는 분노하지 않겠습니다
  - 더 이상 진노하지 않겠습니다
  lexicon: HALOT
  rationale: כעס는 ‘성내다/화내다’의 직접적 동사이므로, 한국어 동작 동사로 옮겨 결말의 단호함을 유지했습니다.
theological_decisions:
- issue: 야훼의 감정 언어를 약화시키지 않는 번역
  chosen_reading: ‘분노’, ‘질투’, ‘성내다’를 실제적인 언약-심판 언어로 유지했습니다.
  alternative_readings:
  - ‘진노’로 통일
  - ‘질투’ 대신 ‘열심’ 사용
  - 감정 표현을 완화하여 ‘불쾌하다’로 처리
  rationale: 이 절은 언약 위반에 대한 하나님의 응답을 혼인 비유로 묘사하므로, 감정 표현을 추상화하면 본문의 수사와 신학적 긴장이 약해집니다.
  doctrine_reference: 언약 신실성과 심판의 긴장 보존
