  lexicon: proper nouns
  rationale: 히브리어 고유명사를 현대 한국어 음역에 맞게 옮겼습니다.
- source_word: הִנְנִי אֵלֶיךָ
  english_pob_choice: Behold, I am against you
  chosen_korean: 보십시오, 내가 ...를 대적합니다
  alternatives_korean:
  - 보라, 내가 ...에게 임합니다
  - 보십시오, 내가 ...와 함께합니다
  lexicon: formulaic prophetic threat
  rationale: 히브리어 관용구는 단순한 위치가 아니라 적대 선언이므로 ‘대적합니다’로 직역에 가깝게 표현했습니다.
theological_decisions:
- issue: יהוה와 아도나이의 결합 호칭
  chosen_reading: ‘주 야훼’로 병기하여 주권 호칭과 고유언약명을 함께 살렸습니다.
  alternative_readings:
  - ‘주 하나님’
  - ‘주 여호와’
  rationale: 원문은 אדני יהוה로, 두 요소를 모두 보존해야 신적 호칭의 중첩이 드러납니다.
  doctrine_reference: 언약명 YHWH 보존 / 신명 사용
