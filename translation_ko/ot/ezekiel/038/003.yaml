lexical_decisions:
- source_word: יְהוִה
  english_pob_choice: LORD GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: YHWH
  rationale: 원문의 언약명칭을 보존하기 위해 야훼를 쓰고, 아도나이와 결합된 호칭은 문맥상 ‘주’로 살렸습니다.
- source_word: נְשִׂיא רֹאשׁ
  english_pob_choice: chief prince
  chosen_korean: 최고 지도자
  alternatives_korean:
  - 족장
  - 우두머리 왕자
  - 주권자
  lexicon: nasi + rosh
  rationale: POB의 수정본이 ‘chief prince’를 반영하므로, 계층적 우위와 지도성을 함께 드러내는 표현으로 옮겼습니다.
- source_word: מֶשֶׁךְ וְתֻבָל
