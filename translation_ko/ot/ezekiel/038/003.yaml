  lexicon: proper nouns
  rationale: 히브리어 고유명사를 현대 한국어 음역에 맞게 옮겼습니다.
- source_word: הִנְנִי אֵלֶיךָ
  english_pob_choice: Behold, I am against you
  chosen_korean: 보십시오, 내가 ...를 대적합니다
