source:
  edition: WLC
  text: הִכֹּן֙ וְ/הָכֵ֣ן לְ/ךָ֔ אַתָּ֕ה וְ/כָל קְהָלֶ֖/ךָ הַ/נִּקְהָלִ֣ים עָלֶ֑י/ךָ וְ/הָיִ֥יתָ לָ/הֶ֖ם לְ/מִשְׁמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/007.yaml
  text: Be prepared[b][a], and prepare yourself—you and all your assembly who are gathered around you—and be a guard for them.
  footnotes:
  - marker: a
    text: Or 'Get ready, and make yourself ready.' The paired verbs intensify the command to readiness and preparation.
    reason: lexical_alternative
  - marker: b
    text: Or 'be on guard for them' or 'be their keeper.' The Hebrew may suggest guarding, watching over, or taking charge of them.
    reason: lexical_alternative
translation:
  language: ko
  text: 준비하십시오[a]. 당신과 당신 주위에 모여든 당신의 모든 무리와 함께 스스로를 준비하십시오. 그리고 그들을 지키는 자가 되십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘준비하십시오, 또 스스로를 갖추십시오.’ 쌍을 이루는 동사는 준비와 대비의 명령을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 위한 경비가 되십시오’ 또는 ‘그들을 경계하는 자가 되십시오.’ 히브리어는 지키고 살피며 돌보거나 감독하는 역할을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכֹּן / וְהָכֵן לְךָ
  english_pob_choice: Be prepared … and prepare yourself
  chosen_korean: 준비하십시오, 또 스스로를 준비하십시오
  alternatives_korean:
  - 갖추십시오, 또 자신을 갖추십시오
  - 준비되십시오, 또 준비하십시오
  lexicon: HALOT
  rationale: 쌍을 이루는 명령형의 반복적·강조적 뉘앙스를 살리면서, 합쇼체에서 자연스럽고 직접적인 ‘준비하다’로 옮겼습니다.
- source_word: קְהָלֶךָ
  english_pob_choice: your assembly
  chosen_korean: 당신의 모든 회중
  alternatives_korean:
  - 당신의 집회
  - 당신의 무리
  - 당신의 모임
  lexicon: HALOT
  rationale: קהל의 ‘모인 집단’ 의미를 유지하면서, 전쟁 문맥에서 단순한 군중보다 넓고 중립적인 ‘회중’이 가장 가깝습니다.
- source_word: הַנִּקְהָלִים עָלֶיךָ
  english_pob_choice: who are gathered around you
  chosen_korean: 당신을 따라 모여든 이들
  alternatives_korean:
  - 당신 곁에 모여 있는 이들
  - 당신에게로 모여든 이들
  - 당신 주위에 모여든 이들
  lexicon: HALOT
  rationale: ‘모여 있다’는 상태와 ‘~에게로’의 방향성을 함께 살리되, ‘around you’의 공간적 감각은 한국어 자연성을 고려해 ‘따라’로 완화해 옮겼습니다.
- source_word: לְמִשְׁמָר
  english_pob_choice: be a guard for them
  chosen_korean: 그들을 위한 경비가 되십시오
  alternatives_korean:
  - 그들을 지키는 경비가 되십시오
  - 그들의 경비가 되십시오
  - 그들을 지키는 자가 되십시오
  lexicon: HALOT
  rationale: מִשְׁמָר는 단순한 ‘지키다’보다 경계·경비·보초의 직무를 포함하므로, 역할을 드러내는 ‘경비’가 source-direct 하면서도 문맥에 맞습니다.
theological_decisions:
- issue: 문장 구조의 병렬적 강조
  chosen_reading: 두 명령형을 각각 살려 ‘준비하십시오, 또 스스로를 준비하십시오’로 옮겼습니다.
  alternative_readings:
  - 한 문장으로 ‘준비하고 스스로를 갖추십시오’
  - ‘준비되십시오’로 단순화
  rationale: 히브리어의 연속 명령은 단순 중복이 아니라 준비를 강조하는 수사이므로, 한국어에서도 병렬을 보존하는 것이 더 충실합니다.
  doctrine_reference: 본문 수사 구조 보존
- issue: ‘회중’의 사용
  chosen_reading: 군사적 집합체를 가리키는 קהל을 ‘회중’으로 옮겼습니다.
  alternative_readings:
  - 군대
  - 무리
  - 집회
  rationale: 전쟁 문맥이지만, מקור 단어 자체는 ‘모인 공동체’의 넓은 뜻을 가지므로, 지나친 군사화보다 원문의 범위를 유지하는 번역이 적절합니다.
  doctrine_reference: 어휘 의미 범위 보존
