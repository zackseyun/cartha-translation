  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הַֽ/אַתָּה ה֨וּא אֲשֶׁר דִּבַּ֜רְתִּי בְּ/יָמִ֣ים קַדְמוֹנִ֗ים בְּ/יַד֙ עֲבָדַ/י֙ נְבִיאֵ֣י יִשְׂרָאֵ֔ל הַֽ/נִּבְּאִ֛ים בַּ/יָּמִ֥ים הָ/הֵ֖ם שָׁנִ֑ים לְ/הָבִ֥יא אֹתְ/ךָ֖ עֲלֵי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/017.yaml
  text: 'Thus says the Lord GOD: Are you the one of whom I spoke in former days by the hand of my servants the prophets of Israel[c][b][a], who prophesied in those days for years that I would bring you against them?'
  footnotes:
  - marker: a
    text: Hebrew 'by the hand of,' an idiom meaning 'through' or 'by means of.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in ancient days' or 'in days of old.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'in those days, years'; the wording emphasizes that these prophecies were spoken over an extended period.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. "내가 예전부터 이스라엘의 내 종들인 예언자들의 손으로, 곧 그들이 그 날들에 여러 해 동안 예언하며 내가 너를 그들 위로 끌어오리라고 말한 그 사람이 바로 너냐?"[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘손으로’는 ‘통하여/매개로’라는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘예전부터’는 ‘옛날에’ 또는 ‘옛적에’의 뜻을 담습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그 날들에 여러 해 동안’은 예언이 오랜 기간에 걸쳐 주어졌음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: אָדֹנָי와 יְהוִה의 겹친 신적 칭호를 한국어에서 자연스럽게 살리되, 프로젝트 기본어인 야훼를 유지했습니다.
- source_word: בְּיַד
  english_pob_choice: by the hand of
  chosen_korean: '...의 손으로'
  alternatives_korean:
  - '...을 통해'
  - '...로 말미암아'
  lexicon: HALOT
  rationale: 예언적 매개를 가리키는 관용구를 직역에 가깝게 살려, 선지자들을 통한 전달이라는 매개성을 드러냈습니다.
- source_word: בְּיָמִים קַדְמוֹנִים
  english_pob_choice: in former days
  chosen_korean: 예전부터
  alternatives_korean:
  - 옛날에
  - 옛적에
  lexicon: HALOT
  rationale: 시간적으로 앞선 기간을 가리키는 표현을 현대적이면서도 원문의 회고적 뉘앙스를 해치지 않게 옮겼습니다.
- source_word: עֲבָדַי
  english_pob_choice: my servants
  chosen_korean: 내 종들
  alternatives_korean:
  - 내 일꾼들
  - 내 노예들
  lexicon: HALOT
  rationale: 예언자들의 하나님께 대한 봉사라는 문맥에서 기본어인 종이 가장 적합하며, 노예는 여기서는 본문이 의도하는 강조가 아닙니다.
theological_decisions:
