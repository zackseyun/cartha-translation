  yaml_path: translation/ot/ezekiel/038/009.yaml
  text: You will come up like a storm; you will be like a cloud covering the land—you and all your troops, and many peoples with you.
translation:
  language: ko
  text: 당신과 당신의 모든 부대와 당신과 함께 있는 많은 민족들은 폭풍처럼 올라올 것이며, 땅을 덮는 구름처럼 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עָלִיתָ֙ ... תָב֔וֹא
  english_pob_choice: You will come up ... you will come
  chosen_korean: “올라오며 … 될 것입니다”
  alternatives_korean:
  - “올라올 것입니다”
  - “나아올 것입니다”
  lexicon: עָלָה / בּוֹא
  rationale: 두 동사가 병렬로 있으므로 단순한 ‘오다’로 평면화하지 않고, 올라오는 움직임과 닥쳐오는 도착감을 함께 살렸습니다.
- source_word: כַּ/שֹּׁאָ֣ה
  english_pob_choice: like a storm
  chosen_korean: “폭풍처럼”
  alternatives_korean:
  - “소용돌이처럼”
  - “재난처럼”
  lexicon: שׁוֹאָה
  rationale: 문맥상 급습하는 재앙적 기세를 가리키므로, 현대 한국어에서 즉각적으로 힘과 위협을 전달하는 ‘폭풍처럼’으로 옮겼습니다.
- source_word: כֶּ/עָנָ֛ן לְ/כַסּ֥וֹת הָ/אָ֖רֶץ
  english_pob_choice: like a cloud covering the land
  chosen_korean: “땅을 덮는 구름처럼”
  alternatives_korean:
  - “땅을 가리는 구름처럼”
  - “땅을 덮어 가는 구름처럼”
  lexicon: כְּ + עָנָן / כָּסָה
  rationale: ‘덮다’가 히브리어 כסה의 직접적 의미를 가장 잘 반영하며, 땅 전체를 뒤덮는 시각적 이미지를 보존합니다.
- source_word: וְ/כָל אֲגַפֶּ֔י/ךָ
  english_pob_choice: and all your troops
  chosen_korean: “당신의 모든 군대”
  alternatives_korean:
  - “당신의 모든 부대”
  - “당신의 모든 전열”
  lexicon: אָגַף
  rationale: 군사적 편제와 병력을 가리키는 표현이므로, 현대 독자가 이해하기 쉬운 ‘군대’로 옮기되 집합성은 유지했습니다.
- source_word: וְ/עַמִּ֥ים רַבִּ֖ים אוֹתָֽ/ךְ־
  english_pob_choice: and many peoples with you
  chosen_korean: “그리고 당신과 함께한 많은 민족들이”
  alternatives_korean:
  - “그리고 많은 백성이 당신과 함께할 것입니다”
  - “그리고 수많은 민족들이 당신과 함께할 것입니다”
  lexicon: עַם
  rationale: ‘민족들’은 복수의 ժողովուրդ/עמים을 살리며, 전쟁 동맹의 다층성을 드러냅니다.
theological_decisions:
- issue: 예언적 비유의 강도
  chosen_reading: ‘폭풍’과 ‘구름’의 이중 이미지를 그대로 살려, 침공의 압도성과 불가항력성을 약화시키지 않았습니다.
  alternative_readings:
  - 비유를 완화해 ‘큰 무리처럼’으로 옮김
  - 이미지를 설명적으로 풀어 ‘급습하는 군대처럼’으로 옮김
  rationale: 히브리어 원문은 단순한 이동 묘사가 아니라 재앙적 침공의 시각적·체감적 이미지를 제공하므로, 이를 보존하는 것이 본문의 효과를 더 정확히 전달합니다.
  doctrine_reference: 에스겔 38장의 심판 예언과 상징적 전쟁 이미지
- issue: 문장의 종결 형식
  chosen_reading: 선언형 미래 시제를 사용해 예언 진술의 확정성과 공적 문체를 유지했습니다.
  alternative_readings:
  - 명령형이나 추측형으로 완화
  - 현재형 서술로 변환
  rationale: 히브리어 연속 미완료형은 예언적 미래 진술로 기능하므로, 한국어에서도 ‘-할 것입니다’로 옮기는 것이 가장 자연스럽고 공정합니다.
  doctrine_reference: 예언 문체의 한국어 대응
