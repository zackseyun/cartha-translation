  source_fidelity: 히브리어는 고그를 향해 ‘폭풍처럼 올라올 것’과 ‘땅을 덮는 구름처럼 될 것’을 예언하며, 그 주체에 그와 그의 모든 아가핌(군사 부대/병력) 및 그와 함께한 많은 민족들을 포함합니다. 초안은 핵심 비유와 군사적 집단성을 대체로 충실히 반영합니다. 다만 첫 미래 동사 תָבוֹא의 예언적 미래를 ‘올라오며’로 처리한 것은 뒤의 미래 서술에 종속되는 느낌을 주며, 문말의 ‘민족들이’는 한국어 문장으로 미완결입니다.
  naturalness: ‘당신과 당신의 모든 군대, 그리고 당신과 함께한 많은 민족들이’는 서술어 없이 끝나 자연스러운 현대 한국어 문장이 아닙니다. 주어들을 앞에 결집하고 두 비유의 술어를 함께 적용하면 합쇼체 예언 문체로 매끄럽고 원문의 포함 관계도 드러납니다.
