  source_fidelity: 현 초안은 첫 번째 동사구의 약탈 의미를 전달하지만, 두 번째 병행 부정사(וְלָבֹז בַּז)가 독립적으로 드러나지 않아 원문의 두 겹친 약탈 목적이 축소되었습니다. 또한 לְהָשִׁיב יָדְךָ עַל의 대상을 향한 행위가 ‘향하게 하려는’이라는 중첩된 표현으로 불분명합니다. 수정문은 두 병행 목적과 ‘손을 … 향하여 돌리다’의 비유를 모두 보존합니다.
  naturalness: ‘지금 사람이 살고 있는 폐허와 … 백성에게로 향하게 하려는’은 수식 범위와 문장 구조가 다소 어색합니다. ‘이제 사람이 사는 폐허가 되었던 곳들과 … 백성에게 네 손을 향하여 돌리려는’으로 정리하면 현대 표준어 합쇼체 문장으로 자연스럽고, 두 대상을 병렬로 분명히 제시합니다.
  terminology: מִקְנֶה וְקִנְיָן은 ‘가축과 소유물’로 적절합니다. חֳרָבוֹת נוֹשָׁבוֹת은 과거의 황폐와 현재의 거주를 함께 나타내도록 ‘이제 사람이 사는 폐허가 되었던 곳들’로 옮겼습니다. טַבּוּר הָאָרֶץ의 은유적 지리 표현은 ‘땅 한가운데’ 및 각주로 적절히 처리됩니다.
