revisions:
- from: 노략질하여 노략물을 빼앗고, 네 손을 돌려 지금 사람이 살고 있는 폐허와, 민족들 가운데서 모여 나온 백성 곧 가축과 소유물을 가진, 땅의 한가운데에 거주하는 백성에게로 향하게 하려는 것입니다.[a]
  to: 전리품을 빼앗고 약탈물을 노략하며, 이제 사람이 사는 폐허가 되었던 곳들과 민족들 가운데서 모인 백성, 곧 가축과 소유물을 얻고 땅 한가운데에 사는 백성에게 네 손을 향하여 돌리려는 것입니다.[a]
  rationale: 두 개의 병행된 약탈 목적구를 모두 반영하되, 한국어에서 부자연스러운 동족어 반복은 ‘전리품을 빼앗고 약탈물을 노략하며’로 처리했습니다. ‘손을 돌리다’라는 원문의 비유를 유지하고, 두 공격 대상을 명확히 병렬화했습니다. 각주는 טַבּוּר의 문자적 은유와 관용적 의미를 함께 보존합니다.
