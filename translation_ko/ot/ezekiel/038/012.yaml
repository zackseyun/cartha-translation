id: EZK.38.12
reference: Ezekiel 38:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/שְׁלֹ֥ל שָׁלָ֖ל וְ/לָ/בֹ֣ז בַּ֑ז לְ/הָשִׁ֨יב יָדְ/ךָ֜ עַל חֳרָב֣וֹת נוֹשָׁבֹ֗ת וְ/אֶל עַם֙ מְאֻסָּ֣ף מִ/גּוֹיִ֔ם עֹשֶׂה֙ מִקְנֶ֣ה וְ/קִנְיָ֔ן יֹשְׁבֵ֖י עַל טַבּ֥וּר הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/012.yaml
  text: to seize spoil and to carry off plunder[a], to turn your hand against ruins now inhabited and against a people gathered from the nations, who have acquired livestock and goods, who dwell at the center of the earth.
  footnotes:
  - marker: a
    text: Literally, 'the navel of the earth,' an idiom for the center or middle of the land/world.
    reason: lexical_alternative
translation:
  language: ko
  text: 노략질하여 노략물을 빼앗고, 네 손을 돌려 지금 사람이 살고 있는 폐허와, 민족들 가운데서 모여 나온 백성 곧 가축과 소유물을 가진, 땅의 한가운데에 거주하는 백성에게로 향하게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘땅의 한가운데’는 문자적으로는 ‘땅의 배꼽’이지만, 중심이나 한복판을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹל שָׁלָל
  english_pob_choice: to seize spoil
  chosen_korean: 노략질하여 노략물을 빼앗고
  alternatives_korean:
  - 노략물을 탈취하고
  - 약탈하여 약탈물을 빼앗고
  lexicon: HALOT
  rationale: 히브리어의 동사+동족목적어 구조를 살리되, 한국어에서는 반복을 자연스럽게 풀어 ‘노략질하여 노략물을 빼앗고’로 옮겼습니다.
- source_word: וְלָבֹז בַּז
  english_pob_choice: to carry off plunder
  chosen_korean: 노략물을 빼앗고
  alternatives_korean:
  - 노략물을 끌고 가고
  - 약탈물을 가지고 가고
  lexicon: HALOT
  rationale: 앞절과 평행하는 두 번째 동족 구조이므로 의미를 중복해서라도 ‘노략물’을 유지해 원문의 강조를 드러냈습니다.
- source_word: חֳרָבוֹת נוֹשָׁבוֹת
  english_pob_choice: ruins now inhabited
  chosen_korean: 지금 사람이 살고 있는 폐허
  alternatives_korean:
  - 거주하는 폐허
  - 황폐한 곳인데 지금 사람이 사는 곳
  lexicon: HALOT
  rationale: 과거의 황폐함과 현재의 거주 상태가 함께 드러나도록 역설적 표현을 살렸습니다.
- source_word: עַם מְאֻסָּף מִגּוֹיִם
  english_pob_choice: a people gathered from the nations
  chosen_korean: 민족들 가운데서 모여 나온 백성
  alternatives_korean:
  - 열방에서 모인 백성
  - 민족들로부터 모인 백성
  lexicon: HALOT
  rationale: ‘민족들’이라는 복수적 뉘앙스를 살리면서, 포로 귀환·재집결의 의미를 분명히 하기 위해 ‘모여 나온’으로 옮겼습니다.
- source_word: עֹשֶׂה מִקְנֶה וְקִנְיָן
  english_pob_choice: who have acquired livestock and goods
  chosen_korean: 가축과 소유물을 가진
  alternatives_korean:
  - 가축과 재산을 가진
  - 가축과 물품을 축적한
  lexicon: HALOT
  rationale: עֹשֶׂה를 ‘만들다’로 직역하지 않고, 축적된 재산 상태를 나타내는 표현으로 풀어 한국어에서 자연스럽게 처리했습니다. קִנְיָן은 경제적 소유물의 뜻을 살려 ‘소유물’로 옮겼습니다.
- source_word: טַבּ֥וּר הָאָרֶץ
  english_pob_choice: the center of the earth
  chosen_korean: 땅의 한가운데
  alternatives_korean:
  - 땅의 배꼽
  - 땅의 중심
  lexicon: HALOT
  rationale: ‘배꼽’의 직역은 이미지가 강하지만 오해 소지가 있어, 영어 POB의 해석을 따라 중심을 뜻하는 관용적 표현으로 옮겼습니다.
theological_decisions:
- issue: 전리품을 노리는 침공 의도의 표현
  chosen_reading: ‘노략질하여 노략물을 빼앗고’로 반복 구조를 살려 침략의 탐욕과 폭력을 그대로 드러냈습니다.
  alternative_readings:
  - 단순히 ‘탈취하려고’로 완화함
  - ‘약탈하려고’로 단일 동사화함
  rationale: 본문은 단순 이동이 아니라 약탈 목적의 공격을 말하므로, 원문의 강한 동족어 반복을 약화하지 않는 것이 중요합니다.
  doctrine_reference: Translation philosophy §6 (source-direct, readable modern Korean)
