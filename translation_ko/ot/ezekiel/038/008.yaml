revisions:
- from: 많은 날이 지난 뒤에 너는 소집될 것입니다[a]. 그 후의 해들에 너는 칼에서 회복된 땅, 많은 민족들 가운데서 모인 땅, 이스라엘의 산들로 들어갈 것입니다. 그 산들은 늘 황폐한 곳이었습니다. 그러나 그 땅은 민족들 가운데서 끌려 나왔고, 그들 모두가 안전하게 살 것입니다.
  to: 여러 날이 지난 뒤에 너는 소집될 것입니다[a]. 해들이 끝날 무렵에 너는 칼의 피해에서 회복되고 많은 민족들 가운데서 주민들이 모여 돌아온 땅, 곧 이스라엘의 산들 위로 들어갈 것입니다. 그 산들은 오랫동안 황폐해 있었습니다. 그러나 그 땅의 주민들은 민족들 가운데서 돌아왔고, 그들 모두가 안전하게 살 것입니다.
  rationale: 시간 표현은 원문의 ‘해들의 끝/마지막 부분’을 자연스럽게 보존하도록 ‘해들이 끝날 무렵에’로 수정했습니다. 땅과 그 주민을 환유적으로 말하는 히브리어 표현은 한국어에서 오해되지 않도록 ‘주민들이 모여 돌아온 땅’ 및 ‘그 땅의 주민들’로 풀었습니다. 이는 귀환·집결과 안전한 거주라는 문맥을 명확히 할 뿐, 종말론적 시간표나 특정 교리를 덧붙이지 않습니다. ‘이스라엘의 산들 위로’는 תבוא와 עַל의 이동·도착 의미를 보존합니다.
  reviewer_model: gpt-5.6-terra
