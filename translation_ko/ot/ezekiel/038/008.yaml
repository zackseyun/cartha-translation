  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/יָּמִ֣ים רַבִּים֮ תִּפָּקֵד֒ בְּ/אַחֲרִ֨ית הַ/שָּׁנִ֜ים תָּב֣וֹא אֶל אֶ֣רֶץ מְשׁוֹבֶ֣בֶת מֵ/חֶ֗רֶב מְקֻבֶּ֨צֶת֙ מֵ/עַמִּ֣ים רַבִּ֔ים עַ֚ל הָרֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר הָי֥וּ לְ/חָרְבָּ֖ה תָּמִ֑יד וְ/הִיא֙ מֵ/עַמִּ֣ים הוּצָ֔אָה וְ/יָשְׁב֥וּ לָ/בֶ֖טַח כֻּלָּֽ/ם׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/008.yaml
  text: After many days you will be mustered[a]; in the latter years you will come into a land restored from the sword, gathered from many peoples, onto the mountains of Israel, which had been a continual waste; but it was brought out from the peoples[b], and all of them will dwell securely.
  footnotes:
  - marker: a
    text: Or 'you will be visited' or 'you will be summoned.' The Hebrew likely carries the sense of being called up or mustered for action.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the latter years'; some translations render 'in the latter days.'
    reason: alternative_reading
translation:
  language: ko
  text: 많은 날이 지난 뒤에 너는 소집될 것입니다[a]. 그 후의 해들에 너는 칼에서 회복된 땅, 많은 민족들 가운데서 모인 땅, 이스라엘의 산들로 들어갈 것입니다. 그 산들은 늘 황폐한 곳이었습니다. 그러나 그 땅은 민족들 가운데서 끌려 나왔고, 그들 모두가 안전하게 살 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소집될 것입니다’, ‘호명될 것입니다’. 히브리어는 이 문맥에서 전투를 위한 호출·동원의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפָּקֵד
  english_pob_choice: you will be mustered
  chosen_korean: 소집될 것입니다
  alternatives_korean:
  - 호명될 것입니다
  - 소집명령을 받을 것입니다
  - 점호될 것입니다
  lexicon: HALOT
  rationale: פקד의 니팔형은 이 전쟁적 문맥에서 단순한 ‘방문’보다 동원·소집의 뜻이 강하므로, 군사적 뉘앙스를 살려 ‘소집되다’로 옮겼습니다.
- source_word: בְּאַחֲרִית הַשָּׁנִים
  english_pob_choice: in the latter years
  chosen_korean: 그 후의 해들에
  alternatives_korean:
  - 마지막 해들에
  - 후년들에
  - 말년에
  lexicon: HALOT
  rationale: 직역적인 ‘해들의 후반’에 가까운 표현을 택해, 흔한 종말 공식인 ‘말세에’로 신학적 해석을 앞서 넣지 않도록 했습니다.
- source_word: עַל הָרֵי יִשְׂרָאֵל
  english_pob_choice: upon the mountains of Israel
  chosen_korean: 이스라엘의 산들로 들어갈 것입니다
  alternatives_korean:
  - 이스라엘의 산들 위로 들어갈 것입니다
  - 이스라엘의 산들 위에 있을 것입니다
  lexicon: HALOT
  rationale: תבוא와 결합한 עַל은 이동의 도착점을 나타낼 수 있으므로, 한국어에서는 자연스럽게 ‘…로 들어가다’로 풀어 방향성을 살렸습니다.
- source_word: וְיָשְׁבוּ לָבֶטַח כֻּלָּם
  english_pob_choice: and all of them will dwell securely
  chosen_korean: 그들 모두가 안전하게 살 것입니다
  alternatives_korean:
  - 그들 모두가 평안히 거할 것입니다
  - 그들 모두가 안전히 거주할 것입니다
  lexicon: HALOT
  rationale: ישב + לבטח의 관용구를 ‘안전하게 살다’로 옮겨, 정착·거주의 의미와 सुरक्षा(안전)의 뜻을 함께 드러냈습니다.
theological_decisions:
- issue: 종말적 시간표현의 처리
  chosen_reading: ‘그 후의 해들에’로 옮겨, 본문의 시간표현을 그대로 살리고 ‘말세’ 같은 더 강한 종말 용어는 쓰지 않았습니다.
  alternative_readings:
  - 말세에
  - 마지막 때에
  rationale: 히브리어는 ‘해들의 끝/후반’을 말하므로, POB의 audit trail을 따라 더 익숙한 종말 문구로 평준화하지 않고 본문 고유의 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
