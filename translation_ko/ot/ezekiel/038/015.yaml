  source_fidelity: 초안은 예언적 미래 의미, 북방의 먼 지역이라는 관용구, 말 탄 무리와 군대라는 핵심 요소를 대체로 반영합니다. 그러나 ‘당신과 함께 많은 백성이며’는 원문의 동반 집단을 서술어에 무리하게 연결하고, ‘큰 무리와 강한 군대가 될 것입니다’는 원문의 명사구를 ‘될 것이다’라는 결과 상태로 바꾸어 의미와 통사 관계를 흐립니다.
  naturalness: ‘북쪽 깊은 곳’은 지리적 거리보다 내부의 깊이를 연상시킬 수 있어 ‘북쪽 가장 먼 곳’이 더 정확하고 자연스럽습니다. 또한 ‘많은 백성이며’와 ‘다들’은 현대의 격식 있는 성서 문체에서 부자연스럽습니다.
  terminology: עַמִּים는 복수이므로 ‘많은 민족’으로 옮기는 것이 적절합니다. קָהָל은 이 군사 문맥에서 ‘큰 무리’, חַיִל은 ‘강한 군대’로 번역할 수 있습니다. 특정 교파적 함의는 추가하지 않았습니다.
