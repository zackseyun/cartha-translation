  to: 그리고 당신은 당신의 자리에서, 북쪽 가장 먼 곳에서 올 것입니다. 당신과 함께 많은 민족이 올 것이며, 그 많은 민족은 모두 말을 타고 큰 무리와 강한 군대를 이룰 것입니다.[a][b]
  rationale: 원문의 예언적 미래와 ‘당신 및 동반한 많은 민족’의 구성을 유지하면서, 한국어 문장을 자연스럽고 명료하게 재구성했습니다. ‘북쪽 가장 먼 곳’으로 히브리어 관용구의 거리·극단 의미를 살렸고, 많은 민족이 모두 말을 타며 큰 무리와 군대를 이룬다는 관계를 분명히 했습니다. 각주 표지는 해당 대안이 관련되는 구절 끝에 유지했습니다.
