  text: וּ/בָ֤אתָ מִ/מְּקֽוֹמְ/ךָ֙ מִ/יַּרְכְּתֵ֣י צָפ֔וֹן אַתָּ֕ה וְ/עַמִּ֥ים רַבִּ֖ים אִתָּ֑/ךְ רֹכְבֵ֤י סוּסִים֙ כֻּלָּ֔/ם קָהָ֥ל גָּד֖וֹל וְ/חַ֥יִל רָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/015.yaml
  text: And you will come from your place[a], from the far north—you and many peoples with you[b], all of them riding horses—a great assembly and a mighty army.
  footnotes:
  - marker: a
    text: Or, 'from the remotest parts of the north' or 'from the uttermost north.' The Hebrew idiom refers to the farthest reaches of the north.
    reason: lexical_alternative
  - marker: b
    text: Or, 'a great company and a vast force.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신은 당신의 자리에서, 북쪽 가장 먼 곳에서 올 것입니다. 당신과 함께 많은 민족이 올 것이며, 그 많은 민족은 모두 말을 타고 큰 무리와 강한 군대를 이룰 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 ‘북쪽의 가장 먼 곳들’ 또는 ‘북쪽의 가장 먼 끝’을 뜻합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘큰 무리와 거대한 군대’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָאתָ
  english_pob_choice: And you will come
  chosen_korean: 그리고 당신은 … 오게 될 것입니다
  alternatives_korean:
  - 그리고 당신은 … 올 것입니다
  - 그러면 당신은 … 오게 될 것입니다
  lexicon: HALOT
  rationale: 예언적 문맥의 미래 의미를 살리되, 합쇼체로 자연스럽게 옮기기 위해 ‘오게 될 것입니다’를 택했습니다.
- source_word: מִמְּקוֹמְךָ
  english_pob_choice: from your place
  chosen_korean: 당신의 자리에서
  alternatives_korean:
  - 당신의 곳에서
  - 당신의 위치에서
  lexicon: HALOT
  rationale: מָקוֹם의 기본 뜻인 ‘장소/자리’를 따라 직역성을 유지하면서도 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: מִיַּרְכְּתֵי צָפוֹן
  english_pob_choice: from the far north
  chosen_korean: 북쪽 깊은 곳에서
  alternatives_korean:
  - 북쪽 끝에서
  - 북쪽 먼 곳에서
  - 북쪽 가장 먼 곳에서
  lexicon: HALOT
  rationale: 히브리어 관용구가 가리키는 지리적 ‘먼 북쪽/가장 먼 북쪽’을 한국어에서 이미지가 살아 있는 표현으로 옮겼습니다.
- source_word: וְעַמִּים רַבִּים אִתָּךְ
  english_pob_choice: you and many peoples with you
  chosen_korean: 당신과 함께 많은 백성이며
  alternatives_korean:
  - 당신과 함께 많은 민족이
  - 당신과 함께 많은 나라들이
  lexicon: HALOT
  rationale: עַמִּים은 단순한 ‘나라들’보다 여러 집단의 ‘백성들’을 가리키므로, 다수의 동반 집단이라는 점을 살려 번역했습니다.
- source_word: רֹכְבֵי סוּסִים
  english_pob_choice: all of them riding horses
  chosen_korean: 다들 말을 탄
  alternatives_korean:
  - 모두 말을 타고 있는
  - 전부 말을 탄
  lexicon: HALOT
  rationale: ‘말을 탄’으로 히브리어의 직설적 이미지를 살리고, 군사적 기동성을 자연스럽게 드러냈습니다.
- source_word: קָהָל גָּדוֹל וְחַיִל רָב
  english_pob_choice: a great assembly and a mighty army
  chosen_korean: 큰 무리와 강한 군대
  alternatives_korean:
  - 큰 집회와 강한 군대
  - 거대한 집단과 막강한 군대
  - 큰 회중과 큰 군대
  lexicon: HALOT
  rationale: קָהָל은 군사 문맥에서 ‘모인 무리’의 뜻이 강하므로 교회적 연상을 피하고, חַיִל은 ‘군대/군사력’의 의미를 살려 번역했습니다.
