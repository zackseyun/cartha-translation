translation:
  language: ko
  text: 바사와 구스와 붓이 그들과 함께 있습니다. 그들 모두가 방패와 투구를 갖추고 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「바사」는 פָּרַס의 관용적 한국어 표기입니다.
    reason: source_note
  - marker: b
    text: '「구스」와 「붓」은 해석적 동일시(예: 에티오피아, 리비아)보다 원문 음역을 우선한 표기입니다.'
    reason: cultural_note
lexical_decisions:
- source_word: פָּרַס
  english_pob_choice: Persia
  chosen_korean: 바사
  alternatives_korean:
  - 페르시아
  lexicon: HALOT
  rationale: 원문은 민족/지역명 פָּרַס를 가리키므로, 현대 표준 외래어 표기와 성경 지명 관용형 사이에서 한국어 성경에서 널리 쓰이는 「바사」를 택했습니다.
