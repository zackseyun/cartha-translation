  - 방패와 투구를
  lexicon: HALOT
  rationale: 군사 장비의 일반적인 한국어 대응어를 사용해 원문의 무장 이미지를 직접적으로 전달했습니다.
theological_decisions:
- issue: 열거된 민족명과 군사 장비의 병렬 구조를 어떻게 살릴 것인가
  chosen_reading: 민족명들을 앞에 두고, 뒤의 무장 묘사를 별도 절로 분리하지 않고 한 문장 안에서 병렬로 유지했습니다.
  alternative_readings:
  - 민족명 뒤에 설명적 쉼표를 더 많이 넣는 방식
  - 무장 묘사를 먼저 제시하는 방식
  rationale: 본문은 연합 세력을 나열한 뒤 그들의 공통된 무장을 덧붙이는 구조이므로, 한국어에서도 같은 정보 흐름을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 본문의 서술 구조 보존 원칙
- issue: 지명 음역과 전통적 해석 지명 사이의 선택
  chosen_reading: 구스와 붓은 음역을 유지하고, 해석적 동일시를 본문이 아닌 주석 영역으로 남길 수 있게 했습니다.
  alternative_readings:
  - 구스=에티오피아, 붓=리비아
  rationale: 원문 고유명사의 역사적·지리적 범위를 본문에서 미리 확정하지 않고, 독자가 원문을 직접 보도록 하는 편이 source-direct 원칙에 부합합니다.
  doctrine_reference: 고유명사 처리 원칙
