  text: וְ/הִתְגַּדִּלְתִּי֙ וְ/הִתְקַדִּשְׁתִּ֔י וְ/נ֣וֹדַעְתִּ֔י לְ/עֵינֵ֖י גּוֹיִ֣ם רַבִּ֑ים וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/023.yaml
  text: I will show myself great and show myself holy[a], and I will make myself known in the sight of many nations[b]. Then they will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'I will magnify myself ... sanctify myself ... and be known.' The Hebrew verbs are reflexive/passive in form and can be rendered more formally, but the main text expresses their sense in clear modern English.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'YHWH'; traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 나의 위대함을 드러내고 나의 거룩함을 나타내며, 많은 나라들이 보는 앞에서 나를 알리겠습니다.[a] 그러면 그들은 내가 야훼[b]인 줄 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사들은 반사형 또는 수동형 형태입니다. 더 형식적으로는 ‘내 자신을 크게 하고 거룩하게 하며 알려지게 하겠다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘YHWH’; 전통적인 한국어 성경에서는 ‘여호와’로, 일부 번역에서는 ‘주’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְגַּדִּלְתִּי
  english_pob_choice: I will show myself great
  chosen_korean: 내가 스스로 위대하게 드러나고
  alternatives_korean:
  - 내가 스스로 크게 나타나고
  - 내가 스스로 위대해지고
  lexicon: HALOT
  rationale: Hitpael의 반사적·표시적 힘을 살리기 위해 단순한 ‘자랑하다’가 아니라 ‘스스로 위대하게 드러나다’로 옮겼습니다.
- source_word: וְהִתְקַדִּשְׁתִּי
  english_pob_choice: show myself holy
  chosen_korean: 스스로 거룩함을 나타내며
  alternatives_korean:
  - 스스로 거룩하게 되며
  - 스스로 성결하게 되며
  lexicon: HALOT
  rationale: קדשׁ의 Hitpael은 하나님이 자신의 거룩함을 열방 앞에 드러내고 입증하시는 뜻이므로, 한국어에서는 ‘거룩함을 나타내다’가 가장 자연스럽고 의미를 덜 흐립니다.
- source_word: לְעֵינֵי גּוֹיִם רַבִּים
  english_pob_choice: in the sight of many nations
  chosen_korean: 많은 나라들의 눈앞에서
  alternatives_korean:
  - 많은 나라들 앞에서
  - 많은 민족들의 눈앞에서
  lexicon: HALOT
  rationale: 직역에 가까우면서도 공개적·가시적 노출의 뉘앙스를 살리기 위해 ‘눈앞에서’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대신 고유명사 음역인 ‘야훼’를 사용하여 신적 이름을 보존했습니다.
theological_decisions:
- issue: 자기영광/self-manifestation 표현의 한국어 톤
  chosen_reading: ‘스스로 위대하게 드러나고 스스로 거룩함을 나타내며’로, 자기과시가 아니라 열방 앞에서의 신적 현시를 강조했습니다.
  alternative_readings:
  - ‘스스로 크게 하며 스스로 거룩하게 하며’
  - ‘자기를 영화롭게 하며 거룩하게 하며’
  rationale: 히브리어 반사형이 지시하는 것은 하나님이 자신을 높이기 위한 행동이 아니라 자신의 위대함과 거룩함을 공개적으로 드러내시는 것입니다. 한국어도 그 긴장을 유지해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주’
  rationale: 본문의 결론부는 고유한 언약 이름을 직접 드러내므로, 제목어 ‘주’로 완화하지 않고 프로젝트 기본값인 ‘야훼’를 유지했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
