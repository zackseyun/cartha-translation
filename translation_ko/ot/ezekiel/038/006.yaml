reference: Ezekiel 38:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גֹּ֚מֶר וְ/כָל אֲגַפֶּ֔י/הָ בֵּ֚ית תּֽוֹגַרְמָ֔ה יַרְכְּתֵ֥י צָפ֖וֹן וְ/אֶת כָּל אֲגַפָּ֑י/ו עַמִּ֥ים רַבִּ֖ים אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/006.yaml
  text: Gomer and all its troops[b][a], the house of Togarmah from the far north and all its troops—many peoples are with you.
  footnotes:
  - marker: a
    text: Or 'all its wings' / 'all its divisions'; the Hebrew term can denote wings, extremities, or attached companies. Here it is rendered 'troops' because of the military context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the remote parts of the north.'
    reason: lexical_alternative
translation:
  language: ko
  text: 고멜과 그 모든 부대[a], 북쪽 먼 곳[b]의 도갈마의 집과 그 모든 부대, 곧 많은 민족이 당신과 함께 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부대’로 옮긴 히브리어 אֲגַפֶּיהָ와 אֲגַפָּיו는 문자적으로 ‘그 날개들’ 또는 ‘그 끝부분들’을 뜻할 수 있으며, 여기서는 군사적·조직적 문맥에 따라 부속 부대들을 가리키는 것으로 이해했습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘북쪽의 먼 곳들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּמֶר
  english_pob_choice: Gomer
  chosen_korean: 고멜
  alternatives_korean:
  - 고메르
  - 고멜 사람들
  lexicon: 고유명사 표기
  rationale: 민족/지역 고유명사는 음역하는 것이 원문의 지시 대상을 가장 직접적으로 보존합니다.
- source_word: אֲגַפֶּיהָ / אֲגַפָּיו
  english_pob_choice: its troops
  chosen_korean: 그 모든 부대
  alternatives_korean:
  - 그 모든 날개
  - 그 모든 구역
  - 그 모든 분견대
  lexicon: HALOT
  rationale: 문맥이 군사적 연합을 묘사하므로, 문자적 ‘날개’보다 현대 독자가 이해할 수 있는 ‘부대’가 원문의 기능을 더 잘 전달합니다.
- source_word: בֵּית תּוֹגַרְמָה
  english_pob_choice: the house of Togarmah
  chosen_korean: 도갈마의 집
  alternatives_korean:
  - 도갈마 가문
  - 도갈마의 백성
  - 도갈마 집안
  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘~의 집’을 유지해 혈연/지리적 집단 표지를 살리되, 고유명사는 음역했습니다.
- source_word: יַרְכְּתֵי צָפוֹן
  english_pob_choice: from the far north
  chosen_korean: 먼 북쪽에 있는
  alternatives_korean:
  - 북쪽의 가장 먼 곳에 있는
  - 북쪽 끝에 있는
  - 극북의
  lexicon: HALOT
  rationale: ‘북쪽의 가장 먼 곳’이라는 지리적 강도를 자연스러운 현대 한국어로 풀어, 원문의 원거리·변두리 뉘앙스를 살렸습니다.
- source_word: עַמִּים רַבִּים
  english_pob_choice: many peoples
  chosen_korean: 많은 백성
  alternatives_korean:
  - 많은 민족
  - 많은 사람들
  - 많은 여러 백성
  lexicon: HALOT
  rationale: עַמִּים는 정치 단위보다 집단/민족성을 가리키는 경우가 많아 ‘백성’으로 옮기되 복수성은 ‘많은’으로 살렸습니다.
theological_decisions:
- issue: 에스겔 38장의 군사적 집결 묘사
  chosen_reading: ‘부대’와 ‘많은 백성’으로 옮겨, 단순 지리 설명이 아니라 연합된 군사·민족 세력의 집결로 읽히게 했습니다.
  alternative_readings:
  - 문자적으로 ‘날개’
  - 중립적으로 ‘무리’
  rationale: 본문은 전쟁 문맥 속 열거이므로, 군사적 함의를 희석하지 않는 번역이 원문 의도를 더 충실히 드러냅니다.
  doctrine_reference: 에스겔 38:1–6의 전쟁/심판 맥락
- issue: ‘북쪽’ 표현의 강도
  chosen_reading: ‘먼 북쪽에 있는’으로 처리해 지리적 방향을 넘는 위협적·변방적 함의를 살렸습니다.
  alternative_readings:
  - ‘북쪽 끝의’
  - ‘북쪽 가장자리의’
  rationale: יַרְכְּתֵי는 단순한 방위를 넘어 외곽·원방을 가리키는 표현이므로, 현대어에서도 그 긴장감을 유지하는 것이 적절합니다.
  doctrine_reference: 에스겔의 열방 심판 및 종말론적 상징성
