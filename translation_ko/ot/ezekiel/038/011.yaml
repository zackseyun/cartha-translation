  text: וְ/אָמַרְתָּ֗ אֶֽעֱלֶה֙ עַל אֶ֣רֶץ פְּרָז֔וֹת אָבוֹא֙ הַ/שֹּׁ֣קְטִ֔ים יֹשְׁבֵ֖י לָ/בֶ֑טַח כֻּלָּ֗/ם יֹֽשְׁבִים֙ בְּ/אֵ֣ין חוֹמָ֔ה וּ/בְרִ֥יחַ וּ/דְלָתַ֖יִם אֵ֥ין לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/011.yaml
  text: and you will say[a], ‘I will go up against a land of unwalled villages; I will come against those who are at rest, who dwell securely, all of them dwelling without walls[d][c][b], and having no bars or gates.’
  footnotes:
  - marker: a
    text: Or 'a land of open country' or 'a land of rural settlements'; the Hebrew term refers to places lacking defensive walls.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will come to'; the rendering 'come against' reflects the hostile context of Gog's speech.
    reason: lexical_alternative
  - marker: c
    text: Or 'bars or gates'; 'doors' is the more direct rendering of the Hebrew, though the context is defensive structures.
    reason: lexical_alternative
  - marker: d
    text: Or 'all of them dwelling without a wall, and having no bar or doors.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 너는 말해야 합니다. ‘나는 울타리 없는 땅을 향해 올라가겠고, 평안히 쉬는 자들, 안전하게 거주하는 자들, 곧 그들 모두가 담이 없이 살며 빗장도 문도 없는 곳으로 가겠노라.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פְּרָזוֹת는 방어벽이 없는 거주지나 개방된 촌락들을 가리킬 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וְאָמַרְתָּ
  english_pob_choice: and you will say
  chosen_korean: 그리고 너는 말해야 합니다
  alternatives_korean:
  - 그리고 너는 말할 것입니다
  - 그리고 너는 말하라고 하십시오
  lexicon: WLC
  rationale: 예언적 전개에서 미래/명령의 뉘앙스를 살리되, 한국어에서는 자연스러운 합쇼체로 옮겼습니다.
- source_word: אֶרֶץ פְּרָזוֹת
  english_pob_choice: a land of unwalled villages
  chosen_korean: 울타리 없는 땅
  alternatives_korean:
  - 울타리 없는 마을들의 땅
  - 성벽 없는 농촌 지역
  lexicon: WLC
  rationale: פְּרָזוֹת는 방어 시설이 없는 개방된 거주지를 가리키므로, 핵심 대비인 ‘무방비 상태’를 간결하게 드러내는 표현을 택했습니다.
- source_word: הַשֹּׁקְטִים יֹשְׁבֵי לָבֶטַח
  english_pob_choice: those who are at rest, who dwell securely
  chosen_korean: 평안히 쉬는 자들, 안전하게 거주하는 자들
  alternatives_korean:
  - 고요히 지내는 자들, 안전하게 거주하는 자들
  - 편안히 있는 자들, 안전하게 사는 자들
  lexicon: WLC
  rationale: 두 분사는 병렬로 사람들의 शांत함과 안전을 묘사하므로, ‘쉬다/거주하다’의 동사를 살려 상태를 분명히 했습니다.
- source_word: בְּאֵין חוֹמָה וּבְרִיחַ וּדְלָתַיִם
  english_pob_choice: without a wall, and having no bars or gates
  chosen_korean: 담이 없이 살며 빗장도 문도 없는 곳
  alternatives_korean:
  - 담도 빗장도 문도 없는 곳
  - 성벽도 빗장도 문도 없는 곳
  lexicon: WLC
  rationale: חוֹמָה는 방어용 ‘성벽’이지만, 여기서는 일상적 방어 부재를 드러내는 ‘담’이 자연스럽고, וּבְרִיחַ / דְלָתַיִם은 각각 ‘빗장’과 ‘문’으로 직접 대응시켰습니다.
theological_decisions:
- issue: 표적이 되는 공동체의 상태를 어떻게 드러낼지
  chosen_reading: ‘평안히 쉬는 자들, 안전하게 거주하는 자들’로 옮겨, 공격자의 시선에서 본 무방비한 평온을 살렸습니다.
  alternative_readings:
  - ‘조용한 자들, 안전하게 사는 자들’
  - ‘태평하게 거주하는 자들’
  rationale: 본문의 초점은 내부의 평안이 아니라 외부 침입자가 보기에 취약한 평온함에 있으므로, 그 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: Ezekiel 38:11의 문맥상 전쟁 서술
