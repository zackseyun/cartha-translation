source:
  edition: WLC
  text: וּ/בְ/קִנְאָתִ֥/י בְ/אֵשׁ עֶבְרָתִ֖/י דִּבַּ֑רְתִּי אִם לֹ֣א בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ רַ֣עַשׁ גָּד֔וֹל עַ֖ל אַדְמַ֥ת יִשְׂרָאֵֽל־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/019.yaml
  text: 'For in my jealousy[a], in the fire of my wrath, I have spoken: surely on that day there will be a great earthquake upon the land of Israel.'
  footnotes:
  - marker: a
    text: Or 'a great shaking' or 'a great trembling.' The Hebrew רַעַשׁ can denote a broader shaking, though 'earthquake' fits the context well.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 질투와 내 진노의 불 가운데 말하였으니, 그날에 이스라엘 땅에 큰 지진이 일어날 것임이 분명합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְקִנְאָתִי
  english_pob_choice: For in my jealousy
  chosen_korean: 내 질투와
  alternatives_korean:
  - 내 열심과
  - 내 질투 안에서
  lexicon: HALOT
  rationale: קִנְאָה는 언약적 ‘질투’의 뜻을 살려야 하므로, 단순한 ‘열심’보다 ‘질투’가 본문의 강한 감정과 관계적 긴장을 더 직접적으로 드러냅니다. 앞의 연결어 וּ는 한국어에서 자연스럽게 생략하거나 문맥상 이어지는 방식으로 처리했습니다.
- source_word: בְאֵשׁ עֶבְרָתִי
  english_pob_choice: in the fire of my wrath
  chosen_korean: 내 진노의 불 가운데
  alternatives_korean:
  - 내 분노의 불 가운데
  - 내 격노의 불 가운데
  lexicon: HALOT
  rationale: אֵשׁ의 불 이미지를 유지하고, עֶבְרָה는 단순한 화남보다 강한 ‘진노’가 어울려 한국어로 직역에 가깝게 옮겼습니다. 전치사 בְ는 ‘가운데’로 처리해 불의 매개적 이미지를 보존했습니다.
- source_word: רַעַשׁ גָּדוֹל
  english_pob_choice: a great earthquake
  chosen_korean: 큰 지진
  alternatives_korean:
  - 큰 흔들림
  - 큰 진동
  lexicon: HALOT
  rationale: רַעַשׁ은 흔들림 전반을 뜻할 수 있지만, 이 구절에서는 땅과 관련된 종말론적 심판 문맥이므로 ‘지진’이 가장 자연스럽고 강한 대응어입니다.
theological_decisions:
- issue: 하나님의 감정 언어를 약화시키지 않는 번역
  chosen_reading: 내 질투와 내 진노의 불 가운데
  alternative_readings:
  - 내 열심과 내 분노의 불 가운데
  - 내 질투와 내 격노의 불 가운데
  rationale: 본문은 하나님의 언약적 질투와 진노를 직접적이고 인격적인 방식으로 진술하므로, 이를 완화하지 않고 그대로 드러내는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §3
- issue: 독백적 선언의 어조 유지
  chosen_reading: …말하였으니, 그날에…일어날 것임이 분명합니다
  alternative_readings:
  - …말하였으니, 그날에…있을 것입니다
  - …말하였으니, 그날에…반드시 있습니다
  rationale: 히브리어의 확언적 구조를 살리되, 현대 한국어에서 예언적 확실성을 자연스럽게 드러내기 위해 ‘일어날 것임이 분명합니다’로 옮겼습니다.
  doctrine_reference: Translation philosophy §2
