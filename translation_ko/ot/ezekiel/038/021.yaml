  source_fidelity: 개정이 필요합니다. 초안의 ‘그의 온 산들’은 히브리어 הָרַי(‘내 산들’)의 1인칭 소유격을 ‘그의’로 잘못 옮겼고, עָלָיו(‘그를 대적하여/그에게 맞서’)의 적대 방향도 충분히 반영하지 못했습니다. 마지막 절의 בְּאָחִיו는 단순히 ‘형제에게 있을’ 칼이 아니라 각 사람의 칼이 자기 형제를 향하는 상황을 뜻합니다.
  naturalness: ‘칼을 부르겠습니다’는 시적·예언적 문맥에서는 가능하지만, ‘그의 온 산들에’ 및 ‘형제에게 있을 것입니다’는 현대 표준 한국어로 부자연스럽고 의미 관계가 불분명합니다. ‘내 모든 산 위에 그를 대적할 칼을 부르겠습니다’, ‘자기 형제를 향할 것입니다’로 고치면 문법 관계와 뜻이 분명해집니다.
  terminology: 신명은 제공된 최신 신학 결정 및 프로젝트 방침에 따라 ‘야훼’로 통일했습니다. אֲדֹנָי יְהוִה는 ‘주 야훼’로, נְאֻם은 합쇼체에 맞추어 ‘말씀이십니다’로 옮겼습니다. ‘형제’는 원문의 남성 단수 표현과 상호 살육의 관용적 이미지를 보존합니다.
  issues:
