    text: Or 'And I will call for a sword against him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 그의 온 산들에 칼을 부르겠습니다[a]. 주 여호와의 말씀이옵니다. 각 사람의 칼이 그의 형제에게 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그에게 칼을 불러오겠습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרָאתִי
  english_pob_choice: And I will summon
  chosen_korean: 내가 … 칼을 부르겠습니다
  alternatives_korean:
  - 내가 … 칼을 소집하겠습니다
  - 내가 … 칼을 소환하겠습니다
  lexicon: WLC/HALOT
  rationale: קרא의 여기서는 단순한 ‘부르다’보다 심판의 도구를 불러내는 뜻이므로, 한국어에서는 ‘칼을 부르다’로 옮겨 소환·동원되는 뉘앙스를 살렸습니다.
- source_word: עָלָיו לְכָל הָרַי
  english_pob_choice: against him on all my mountains
  chosen_korean: 그의 온 산들에
  alternatives_korean:
  - 그에게 맞서 내 모든 산들에
  - 내 모든 산들 위에서 그를 향하여
  lexicon: WLC/HALOT
  rationale: 히브리어의 장소 표지를 살리면서도 문장을 자연스럽게 하기 위해 ‘온 산들에’로 옮겼고, 소유격 ‘my mountains’는 문맥상 하나님이 말씀하시는 산들로 이해되어 앞뒤로 드러납니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 여호와의 말씀이옵니다
  alternatives_korean:
  - 주 하나님께서 말씀하십니다
  - 주 여호와의 선언입니다
  lexicon: WLC/HALOT
  rationale: 예언자적 공식을 한국어로 자연스럽게 옮기되, 아도나이+יהוה 결합을 그대로 반영해 ‘주 여호와’로 처리했습니다.
- source_word: חֶרֶב אִישׁ בְּאָחִיו תִּהְיֶה
  english_pob_choice: every man's sword will be against his brother
  chosen_korean: 각 사람의 칼이 그의 형제에게 있을 것입니다
  alternatives_korean:
  - 각 사람의 칼이 그의 형제를 칠 것입니다
  - 각 사람의 칼이 그의 형제에게 향할 것입니다
  lexicon: WLC/HALOT
  rationale: 분배적 표현 אִישׁ을 ‘각 사람’으로 살리고, ‘형제’는 동족 간의 내분이라는 직설적 이미지를 유지하기 위해 그대로 두었습니다.
theological_decisions:
- issue: 예언적 심판의 자기파괴적 전투 묘사
  chosen_reading: 하나님이 적대 세력 내부의 칼부림을 일으키시는 것으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 서로 싸우게 될 것입니다
  - 자멸하게 될 것입니다
  rationale: 본문의 핵심은 단순한 전투 결과가 아니라 야훼의 주권적 심판으로 인해 내부에서 칼이 돌이키는 것에 있으므로, 완화하지 않고 보존했습니다.
  doctrine_reference: Ezekiel 38:21 context; divine judgment motif
