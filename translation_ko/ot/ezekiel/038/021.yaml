    rationale: ‘그의 온 산들에 칼을 부르겠습니다’는 칼이 누구를 향하는지 드러내지 않습니다. ‘그를 대적할 칼’로 보완해야 합니다.
  - severity: medium
    issue: ‘각 사람의 칼이 그의 형제에게 있을 것입니다’
    rationale: בְּאָחִיו는 이 문맥에서 칼의 목표·방향을 나타냅니다. ‘자기 형제를 향할 것입니다’가 원문의 상호 공격 의미를 자연스럽게 전달합니다.
