translation:
  language: ko
  text: 그러므로 예언하십시오, 인자여, 그리고 곡에게 이렇게 말하십시오. 「주 하나님께서 이렇게 말씀하십니다. 그날에 내 백성 이스라엘이 안전하게 거주할 때에, 네가 그것을 알지 못하겠느냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: לָבֶטַח는 ‘안전하게’ 또는 ‘안전 속에’로도 옮길 수 있습니다.
    reason: lexical_alternative
