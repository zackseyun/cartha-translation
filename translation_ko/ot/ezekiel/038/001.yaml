lexical_decisions:
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 선포
  - 전언
  lexicon: HALOT
  rationale: 예언 공식에서 דְבַר יְהוָה는 단순한 '말'보다 하나님의 권위 있는 '말씀'을 가리키므로, 표준적인 한국어 성경 문맥에 맞게 '말씀'으로 옮겼습니다.
- source_word: וַיְהִי
  english_pob_choice: came
  chosen_korean: 임하여
  alternatives_korean:
  - 왔습니다
  - 이르러 왔습니다
  - 되었습니다
  lexicon: HALOT
  rationale: 영어 POB의 'came'는 예언자에게 임하는 하나님의 말씀이라는 관용구를 반영합니다. 한국어에서는 '말씀이 내게 임하여'가 이 공식성을 자연스럽게 살리면서도 직역의 경직함을 피합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 지침에 따라 여호와 대용어 대신 신명역의 고유명사인 '야훼'를 사용하여, 본문의 언약적 신명 표지를 보존했습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내 앞에
  lexicon: HALOT
  rationale: אֵלַי는 예언자에게 향하는 방향을 단순히 나타내므로, 현대 표준어에서 자연스러운 '내게'로 옮겼습니다.
theological_decisions:
- issue: 예언 공식의 문체와 신적 주체성
  chosen_reading: '''야훼의 말씀이 내게 임하여 말씀하셨습니다''로, 말씀의 도래와 직접 화법을 모두 살렸습니다.'
  alternative_readings:
  - '''야훼의 말씀이 내게 임했습니다'''
  - '''야훼의 말씀이 내게 이르렀습니다'''
  rationale: 히브리어 המקרא의 예언 공식은 단순 전달이 아니라 야훼의 말씀이 예언자에게 주도적으로 도달하는 사건을 나타냅니다. 한국어에서도 '임하다'를 사용해 그 긴장과 권위를 보존했습니다.
  doctrine_reference: 예언자적 계시의 직접성
- issue: 신명 표지의 번역
  chosen_reading: יהוה를 '야훼'로 옮겼습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 원문이 고유한 신명 יְהוָה를 사용하므로, 제목어 '주'로 흡수하지 않고 이름 자체를 드러내는 번역 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
