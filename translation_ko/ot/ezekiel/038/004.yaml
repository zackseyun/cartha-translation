  text: וְ/שׁ֣וֹבַבְתִּ֔י/ךָ וְ/נָתַתִּ֥י חַחִ֖ים בִּ/לְחָיֶ֑י/ךָ וְ/הוֹצֵאתִי֩ אוֹתְ/ךָ֨ וְ/אֶת כָּל חֵילֶ֜/ךָ סוּסִ֣ים וּ/פָרָשִׁ֗ים לְבֻשֵׁ֤י מִכְלוֹל֙ כֻּלָּ֔/ם קָהָ֥ל רָב֙ צִנָּ֣ה וּ/מָגֵ֔ן תֹּפְשֵׂ֥י חֲרָב֖וֹת כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/004.yaml
  text: I will turn you around[a], put hooks in your jaws, and bring you out—you and all your army, horses and horsemen, all of them clothed in full armor, a great assembly with shield and buckler[b], all of them wielding swords.
  footnotes:
  - marker: a
    text: Or 'in your cheeks.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew distinguishes two kinds of shields here, likely a large shield and a smaller shield; traditional renderings often read 'shield and buckler.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 너를 돌이켜 네 입에 갈고리를 꽂고, 너와 너의 모든 군대, 곧 말들과 기병들, 모두가 온갖 무장을 갖춘 큰 무리, 큰 방패와 작은 방패를 든 자들, 모두가 칼을 휘두르는 자들을 끌어내리겠다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘턱’이나 ‘뺨’도 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여기서 서로 다른 두 종류의 방패를 구별합니다. 전통적으로는 ‘방패와 작은 방패’ 또는 ‘방패와 버클러’로 옮깁니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְשׁוֹבַבְתִּיךָ
  english_pob_choice: I will turn you around
  chosen_korean: 내가 너를 돌이켜
  alternatives_korean:
  - 내가 너를 돌려
  - 내가 너를 되돌려
  lexicon: HALOT
  rationale: 하나님이 고그의 진행 방향을 주권적으로 바꾸는 이미지를 살리되, 현대 한국어에서 자연스럽고 간결하게 표현했습니다.
- source_word: חַחִים
  english_pob_choice: hooks
  chosen_korean: 갈고리
  alternatives_korean:
  - 훅
  - 고리
  lexicon: HALOT
  rationale: 짐승이나 포로를 제어하는 금속 고리의 구체적 이미지를 살리기 위해 ‘갈고리’를 택했습니다.
- source_word: בִּלְחָיֶיךָ
  english_pob_choice: in your jaws
  chosen_korean: 네 입에
  alternatives_korean:
  - 네 턱에
  - 네 뺨에
  lexicon: HALOT
  rationale: 히브리어는 ‘턱/볼’ 범위를 가질 수 있지만, 한국어에서는 ‘입에 갈고리를 꽂다’가 제어의 관용적이고도 구체적인 이미지에 가장 가깝습니다.
- source_word: צִנָּה וּמָגֵן
  english_pob_choice: shield and buckler
  chosen_korean: 큰 방패와 작은 방패
  alternatives_korean:
  - 방패와 작은 방패
  - 방패와 버클러
  lexicon: HALOT
  rationale: 두 종류의 방어구를 구별하는 히브리어의 대비를 그대로 드러내기 위해 크기 차이를 명시했습니다.
theological_decisions:
- issue: 하나님의 직접적 주권과 심판 실행
  chosen_reading: 하나님이 고그와 그 군대를 직접 ‘돌이키고’ ‘끌어내는’ 주체로 제시됩니다.
  alternative_readings:
  - 하나님이 단지 허용하시는 정도로 이해하는 읽기
  rationale: 연속되는 1인칭 능동형 동사가 주도적 행위를 분명히 하므로, 그 긴장을 완화하지 않고 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
