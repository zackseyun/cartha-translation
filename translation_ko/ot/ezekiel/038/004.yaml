  terminology: ‘턱’, ‘갈고리’, ‘군대’, ‘기병’, ‘완전한 무장’, ‘큰 방패와 작은 방패’, ‘칼을 쥔 자들’은 문맥상 적절합니다. ‘큰 방패와 작은 방패’는 특정 고대 방패의 정확한 크기나 용도를 단정하지 않는 설명적 번역입니다.
