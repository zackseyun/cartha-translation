base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/004.yaml
  text: I will turn you around[a], put hooks in your jaws, and bring you out—you and all your army, horses and horsemen, all of them clothed in full armor, a great assembly with shield and buckler[b], all of them wielding swords.
  footnotes:
  - marker: a
    text: Or 'in your cheeks.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew distinguishes two kinds of shields here, likely a large shield and a smaller shield; traditional renderings often read 'shield and buckler.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 너를 돌이키고 네 턱에 갈고리들을 꿰어, 너와 네 모든 군대, 곧 말들과 기병들, 모두 완전한 무장을 갖춘 큰 무리, 큰 방패와 작은 방패를 들고 모두 칼을 쥔 자들을 끌어내겠다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 ‘턱’ 또는 ‘뺨’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여기서 서로 다른 두 종류의 방패를 구별합니다. 전통적인 번역에서는 흔히 ‘방패와 버클러’로 옮깁니다.
    reason: cultural_note
