  source_fidelity: ‘입에’는 לְחָיֶיךָ(턱/뺨)의 의미 범위보다 넓고 부정확합니다. 또한 ‘끌어내리겠다’는 아래로 끌어내린다는 뜻을 더하여 הוֹצֵאתִי(끌어내다/데리고 나오게 하다)를 벗어납니다. ‘온갖 무장’도 ‘온전한/완전한 장비’라는 מִכְלוֹל의 뜻보다 ‘여러 종류의’라는 뜻으로 기울 수 있습니다.
