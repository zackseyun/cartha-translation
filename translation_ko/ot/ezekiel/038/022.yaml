source:
  edition: WLC
  text: וְ/נִשְׁפַּטְתִּ֥י אִתּ֖/וֹ בְּ/דֶ֣בֶר וּ/בְ/דָ֑ם וְ/גֶ֣שֶׁם שׁוֹטֵף֩ וְ/אַבְנֵ֨י אֶלְגָּבִ֜ישׁ אֵ֣שׁ וְ/גָפְרִ֗ית אַמְטִ֤יר עָלָי/ו֙ וְ/עַל אֲגַפָּ֔י/ו וְ/עַל עַמִּ֥ים רַבִּ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/022.yaml
  text: And I will enter into judgment with him by pestilence and bloodshed[a]; and I will rain down on him, on his troops, and on the many peoples who are with him, torrential rain, hailstones, fire[c][b], and sulfur.
  footnotes:
  - marker: a
    text: Or 'torrential rain.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditional English: ''fire and brimstone''; Hebrew ''fire and sulfur.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'his bands' or 'his armies'; the Hebrew term refers to the forces accompanying him.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 전염병과 유혈로 그를 심판하겠으며, 그와 그의 군대[c]와 그와 함께 있는 많은 민족들 위에 폭우[a]와 우박과 불과 유황[b]을 쏟아붓겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쏟아지는 비’.
    reason: lexical_alternative
  - marker: b
    text: 전통적인 영어 표현은 ‘fire and brimstone’이지만, 히브리어는 ‘불과 유황’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 부대들’ 또는 ‘그의 전열’; 히브리어는 그를 따르는 군사 집단을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁפַּטְתִּי אִתּוֹ
  english_pob_choice: I will enter into judgment with him
  chosen_korean: 그와 더불어 심판하겠습니다
  alternatives_korean:
  - 그와 함께 재판하겠습니다
  - 그를 심판하겠습니다
  lexicon: HALOT
  rationale: 히브리어 נִשְׁפַּטְתִּי + אִתּוֹ는 단순히 판결을 내린다는 뜻보다 ‘상대와 더불어 심판의 소송/공방에 들어가다’는 뉘앙스를 담습니다. 한국어에서는 이를 자연스럽게 ‘그와 더불어 심판하겠습니다’로 옮겨 법정적 긴장을 살렸습니다.
- source_word: בְּדֶבֶר וּבְדָם
  english_pob_choice: by pestilence and bloodshed
  chosen_korean: 전염병과 피흘림으로
  alternatives_korean:
  - 역병과 피흘림으로
  - 전염병과 유혈로
  lexicon: HALOT
  rationale: דֶּבֶר은 재앙적 전염병/역병을 가리키며, דָּם은 문맥상 실제 피보다 폭력적 죽음의 결과인 ‘피흘림’이 더 정확합니다. 한국어에서는 심판 목록의 병렬성을 살려 간결하게 표현했습니다.
- source_word: וְגֶשֶׁם שׁוֹטֵף
  english_pob_choice: torrential rain
  chosen_korean: 폭우
  alternatives_korean:
  - 쏟아지는 비
  - 장대비
  lexicon: HALOT
  rationale: שׁוֹטֵף는 ‘쏟아져 흐르는, 범람하는’ 성격을 가진 비를 나타냅니다. ‘폭우’는 현대 한국어에서 가장 자연스럽게 그 압도적 이미지를 전달합니다.
- source_word: אֲגַפָּיו
  english_pob_choice: his troops
  chosen_korean: 그의 군대
  alternatives_korean:
  - 그의 부대들
  - 그의 대오
  lexicon: HALOT
  rationale: 군사적 문맥에서 אֲגַפָּיו는 동반하는 병력/전열을 가리킵니다. 영어 POB의 ‘his troops’와 같이 한국어에서는 독자가 즉시 이해할 수 있는 ‘그의 군대’로 옮겼습니다.
- source_word: אֵשׁ וְגָפְרִית
  english_pob_choice: fire and sulfur
  chosen_korean: 불과 유황
  alternatives_korean:
  - 불과 황
  - 불과 유황가루
  lexicon: HALOT
  rationale: גָפְרִית는 전통적 ‘유황’에 해당하는 직접적인 현대어입니다. ‘불과 유황’은 구약 심판 어휘의 관용을 보존하면서도 현대 독자가 이해할 수 있습니다.
theological_decisions:
- issue: ‘심판하다’의 법정적 긴장
  chosen_reading: ‘그와 더불어 심판하겠습니다’로 옮겨 단순한 처벌 선언이 아니라 상대와 맞서는 법정적 심판 행위를 드러냈습니다.
  alternative_readings:
  - 그를 심판하겠습니다
  - 그에게 벌을 내리겠습니다
  rationale: 본문은 하나님이 대상과 ‘더불어’ 심판의 장에 들어가시는 모습을 말하므로, 관계적 대결과 공적 판결의 긴장을 유지하는 번역이 더 적절합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
