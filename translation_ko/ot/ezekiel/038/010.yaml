id: EZK.38.10
reference: Ezekiel 38:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יַעֲל֤וּ דְבָרִים֙ עַל לְבָבֶ֔/ךָ וְ/חָשַׁבְתָּ֖ מַחֲשֶׁ֥בֶת רָעָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/010.yaml
  text: 'Thus says the Lord GOD: On that day[a], things will come up in your heart[b], and you will devise an evil plan.'
  footnotes:
  - marker: a
    text: Hebrew 'in your heart'; in Hebrew idiom, the heart is the center of thought and intention, not only emotion.
    reason: cultural_note
  - marker: b
    text: Or 'matters will arise in your heart.' The Hebrew דְבָרִים can mean 'words' or more broadly 'matters/things.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. 「그날에 네 마음[a]에 일들[b]이 떠오르고, 너는 악한 계획을 꾸밀 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘마음’은 감정만이 아니라 생각과 의도의 중심을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 דְבָרִים는 ‘말들’일 수도 있고, 더 넓게는 ‘일들’ 또는 ‘생각거리들’일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 말씀하시기를
  - 이와 같이 말씀하십니다
  lexicon: WLC
  rationale: 예언자적 선포 공식의 격식을 살리면서도 현대 한국어 합쇼체에 자연스럽게 맞췄습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  lexicon: WLC
  rationale: 본문의 복합 칭호를 한국어에서 가장 자연스럽게 드러내는 표현으로 옮겼습니다. 여기서는 인용부 내 표준 경어를 유지하면서도 신적 칭호의 중첩을 보존했습니다.
- source_word: יַעֲלוּ דְבָרִים
  english_pob_choice: things will come up
  chosen_korean: 생각들이 떠오르고
  alternatives_korean:
  - 사실들이 떠오르고
  - 말들이 떠오르고
  - 마음에 일들이 생기고
  lexicon: HALOT
  rationale: דְבָרִים는 직역하면 ‘말들/일들’이지만, 문맥상 내면에서 발생하는 사고·의도를 가리키므로 한국어에서는 ‘생각들이 떠오르다’로 자연스럽게 옮겼습니다.
- source_word: עַל לְבָבֶךָ
  english_pob_choice: in your heart
  chosen_korean: 네 마음속에
  alternatives_korean:
  - 네 قلب에
  - 네 마음에
  - 네 속에
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 사유와 의도의 중심이므로, 의미를 살려 ‘마음속에’로 표현했습니다.
- source_word: וְחָשַׁבְתָּ מַחֲשֶׁבֶת רָעָה
  english_pob_choice: you will devise an evil plan
  chosen_korean: 너는 악한 계획을 꾸밀 것입니다
  alternatives_korean:
  - 너는 악한 계략을 세울 것입니다
  - 너는 악한 생각을 품을 것입니다
  - 너는 악한 계획을 계획할 것입니다
  lexicon: HALOT
  rationale: חשב의 의도적 계산과 명사형 반복의 강조를 살려, 단순한 생각이 아니라 실제로 짜는 ‘계획’을 반영했습니다. ‘꾸밀’은 불의한 도모의 뉘앙스를 담습니다.
theological_decisions:
- issue: 예언 선포문의 화자 존칭과 직설문 처리
  chosen_reading: 주 하나님께서 이렇게 말씀하십니다
  alternative_readings:
  - 주 하나님께서 말씀하십니다
  - 주 여호와께서 이렇게 말씀하십니다
  rationale: 본문의 공식적 예언 선포를 현대 문체로 유지하되, 하나님의 직접 발화를 분명히 드러내기 위해 ‘이렇게 말씀하십니다’를 선택했습니다.
  doctrine_reference: 예언서 문체 보존 원칙
