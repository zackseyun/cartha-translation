  text: 바다의 물고기와 하늘의 새들과 들의 짐승들과 땅 위를 기어 다니는 모든 것들과 땅 위에 있는 모든 사람[a]이 내 앞에서 떨 것입니다. 산들은 무너지고, 가파른 곳들은 무너져 내리며, 모든 성벽은 땅에 무너져 내릴 것입니다.
