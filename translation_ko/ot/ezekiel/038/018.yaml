- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 야훼의 말씀이니라
  alternatives_korean:
  - 주 하나님 야훼의 말씀입니다
  - 주 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: נְאֻם의 예언적 화자 표지를 ‘말씀이니라’로 기능적으로 옮기고, 문맥상의 신명은 프로젝트 기본값에 따라 ‘야훼’로 유지했습니다.
theological_decisions:
- issue: 예언적 발화 공식의 한국어 문체와 하나님의 직접 발화 표지
  chosen_reading: 문장 전체를 서술형 예언 선언으로 두고, נְאֻם을 ‘주 야훼의 말씀이니라’로 처리했습니다.
  alternative_readings:
  - ‘주 야훼께서 선언하십니다’
  - ‘주 야훼의 선언입니다’
  rationale: 히브리어 예언 공식을 한국어에서 과도하게 평탄화하지 않으면서도, 독자가 화자 전환을 분명히 알아차리게 하는 전통적이면서도 현대적인 서술형을 택했습니다.
  doctrine_reference: Prophetic speech formula / divine oracle rendering
- issue: אַף의 신체 은유 보존
  chosen_reading: ‘내 콧속에서’로 문자적 이미지를 살려 분노의 상승을 표현했습니다.
  alternative_readings:
  - ‘내 분노 속에서’
  - ‘내 코에서’
  rationale: 본문은 분노의 감정만이 아니라 신체 은유까지 포함하므로, 한국어 본문에서 그 긴장을 지우지 않기 위해 보다 구체적인 이미지를 유지했습니다.
  doctrine_reference: Lexical tension / anthropomorphic idiom
