  rationale: עַל의 적대적 이동을 ‘치러’로 옮겨 공격성을 드러내고, אַדְמָה는 이 문맥에서 ‘땅’이 가장 직접적입니다.
- source_word: תַּעֲלֶה חֲמָתִי בְּאַפִּי
  english_pob_choice: my wrath will rise up in my nostrils
  chosen_korean: 내 분노가 내 콧속에서 치밀어 오를 것입니다
