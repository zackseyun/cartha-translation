translation:
  language: ko
  text: 그리고 그날에, 곧 곡이 이스라엘 땅을 치러 올 때에, 주 야훼의 말씀이니라, 내 분노가 내 콧속에서 치밀어 오를 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘내 코에서/콧속에서’로, 코가 분노를 뜻하는 관용적 표현으로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it will happen
  chosen_korean: 그리고 … 것입니다
  alternatives_korean:
  - 그날에 … 됩니다
  - 그리고 … 일어납니다
  lexicon: HALOT
  rationale: 예언적 미래 도입 공식으로서 한국어에서는 자연스러운 미래 서술형으로 옮기되, 문맥의 장엄함을 유지했습니다.
- source_word: בַּיּוֹם הַהוּא / בְּיוֹם בּוֹא גוֹג
  english_pob_choice: on that day / on the day when Gog comes
  chosen_korean: 그날에, 곧 곡이 … 올 때에
  alternatives_korean:
  - 그날에, 곡이 … 오는 날
  - 그때 곡이 … 올 때
  lexicon: HALOT
  rationale: 두 시간 표현을 분리해 반복된 예언적 시점을 살리고, בּוֹא를 종속절 ‘올 때에’로 자연스럽게 처리했습니다.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  english_pob_choice: against the land of Israel
  chosen_korean: 이스라엘 땅을 치러
  alternatives_korean:
  - 이스라엘 땅을 향해
  - 이스라엘 땅에 대하여
  lexicon: HALOT
  rationale: עַל의 적대적 이동을 ‘치러’로 옮겨 공격성을 드러내고, אַדְמָה는 이 문맥에서 ‘땅’이 가장 직접적입니다.
- source_word: תַּעֲלֶה חֲמָתִי בְּאַפִּי
  english_pob_choice: my wrath will rise up in my nostrils
  chosen_korean: 내 분노가 내 콧속에서 치밀어 오를 것입니다
  alternatives_korean:
  - 내 진노가 내 코에서 치밀어 오를 것입니다
  - 내 분노가 내 코에서 솟아오를 것입니다
  lexicon: HALOT
  rationale: אַף의 문자적 이미지인 코/콧속을 살리면서도 한국어에서 이해 가능한 신체적 분노 표현으로 옮겼습니다. ‘치밀어 오르다’는 עלה의 상승 이미지를 잘 반영합니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 야훼의 말씀이니라
  alternatives_korean:
  - 주 하나님 야훼의 말씀입니다
  - 주 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: נְאֻם의 예언적 화자 표지를 ‘말씀이니라’로 기능적으로 옮기고, 문맥상의 신명은 프로젝트 기본값에 따라 ‘야훼’로 유지했습니다.
theological_decisions:
- issue: 예언적 발화 공식의 한국어 문체와 하나님의 직접 발화 표지
  chosen_reading: 문장 전체를 서술형 예언 선언으로 두고, נְאֻם을 ‘주 야훼의 말씀이니라’로 처리했습니다.
  alternative_readings:
  - ‘주 야훼께서 선언하십니다’
  - ‘주 야훼의 선언입니다’
  rationale: 히브리어 예언 공식을 한국어에서 과도하게 평탄화하지 않으면서도, 독자가 화자 전환을 분명히 알아차리게 하는 전통적이면서도 현대적인 서술형을 택했습니다.
  doctrine_reference: Prophetic speech formula / divine oracle rendering
- issue: אַף의 신체 은유 보존
  chosen_reading: ‘내 콧속에서’로 문자적 이미지를 살려 분노의 상승을 표현했습니다.
  alternative_readings:
  - ‘내 분노 속에서’
  - ‘내 코에서’
  rationale: 본문은 분노의 감정만이 아니라 신체 은유까지 포함하므로, 한국어 본문에서 그 긴장을 지우지 않기 위해 보다 구체적인 이미지를 유지했습니다.
  doctrine_reference: Lexical tension / anthropomorphic idiom
