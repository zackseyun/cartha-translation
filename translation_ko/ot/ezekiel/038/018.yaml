translation:
  language: ko
  text: 그날, 곧 곡이 이스라엘 땅을 치러 오는 날에, 내 분노가 내 콧속에서 치밀어 오를 것입니다. 주 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘내 코에서/콧속에서’로, ‘코’가 분노를 뜻하는 관용적 표현으로 쓰입니다.
    reason: lexical_alternative
