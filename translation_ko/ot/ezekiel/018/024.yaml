id: EZK.18.24
reference: Ezekiel 18:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/שׁ֨וּב צַדִּ֤יק מִ/צִּדְקָת/וֹ֙ וְ/עָ֣שָׂה עָ֔וֶל כְּ/כֹ֨ל הַ/תּוֹעֵב֜וֹת אֲשֶׁר עָשָׂ֧ה הָ/רָשָׁ֛ע יַעֲשֶׂ֖ה וָ/חָ֑י כָּל צדקת/ו אֲשֶׁר עָשָׂה֙ לֹ֣א תִזָּכַ֔רְנָה בְּ/מַעֲל֧/וֹ אֲשֶׁר מָעַ֛ל וּ/בְ/חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א בָּ֥/ם יָמֽוּת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/024.yaml
  text: But when a righteous man turns away from his righteousness and does injustice[a], doing all the abominations that the wicked man does, shall he live? None of the righteous deeds that he has done will be remembered. In the treachery by which he has acted treacherously[c][b], and in the sin that he has committed—in them he shall die.
  footnotes:
  - marker: a
    text: Or 'all the detestable things.'
    reason: lexical_alternative
  - marker: b
    text: '''Acted treacherously'' may also be rendered ''been unfaithful'' or ''committed trespass''; the Hebrew emphasizes breach of faith through a cognate noun-verb pair.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'in them he shall die,' referring to the treachery and sin just mentioned.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 의로운 사람이 자기 의에서 돌아서서 불의를 행하고, 악인이 하는 모든 가증한 일들을 다 행하면, 그가 살겠습니까? 그가 행한 의로운 일은 하나도 기억되지 않을 것입니다. 그가 배반하여 배반한 그 배반과 그가 범한 죄 가운데서—그 가운데서 그는 죽을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가증한 일들’은 ‘모든 가증한 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘배반하여 배반한’은 ‘신실하지 못하여 신실하지 못한’ 또는 ‘트집/과실을 범한’으로도 옮길 수 있지만, 히브리어의 어근 반복이 강조하는 언약적 배반을 살렸습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그 가운데서’는 곧 앞에 나온 배반과 죄를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  english_pob_choice: a righteous man
  chosen_korean: 의로운 사람
  alternatives_korean:
  - 의로운 남자
  - 의인
  lexicon: HALOT
  rationale: 남성 단수의 대표적 인물을 가리키는 표현으로, 현대 한국어에서 자연스럽고 성 중립적 독해도 가능하도록 '사람'을 택했습니다.
- source_word: מִצִּדְקָתוֹ
  english_pob_choice: from his righteousness
  chosen_korean: 자기 의에서
  alternatives_korean:
  - 자기의에서
  - 그의 의로움에서
  lexicon: HALOT
  rationale: מן의 출발점 의미를 살리면서, כאן의 צדקה를 윤리적 상태로 읽어 '의'로 옮겼습니다. '자기'는 소유격의 자연스러운 한국어 처리입니다.
- source_word: וְעָשָׂה עָוֶל
  english_pob_choice: and does injustice
  chosen_korean: 불의를 행하고
  alternatives_korean:
  - 불의를 하고
  - 죄를 짓고
  lexicon: HALOT
  rationale: עָוֶל은 단순한 '잘못'보다 불의/불공정을 뜻하므로, 사전적 강도를 살려 '불의'로 옮겼습니다.
- source_word: כְּכֹל הַתּוֹעֵבוֹת
  english_pob_choice: all the abominations
  chosen_korean: 악인이 하는 모든 가증한 일들
  alternatives_korean:
  - 모든 가증한 것들
  - 모든 혐오스러운 일들
  lexicon: HALOT
  rationale: תועבות의 강한 도덕·언약적 혐오를 유지하려고 '가증한 일들'로 옮겼습니다. 동사형 '하는'은 히브리어 미완료형의 현재적 일반성을 반영합니다.
- source_word: כָּל צִדְקֹתָו
  english_pob_choice: None of the righteous deeds
  chosen_korean: 그가 행한 의로운 일은 하나도
  alternatives_korean:
  - 그의 의로운 일들은 모두
  - 그의 의로운 행위는 하나도
  lexicon: HALOT
  rationale: 부정과 결합된 총칭적 표현이므로 '하나도'로 분배적 부정을 분명히 했습니다. '의로운 일'은 צדקות의 복수성을 자연스럽게 반영합니다.
- source_word: בְּמַעֲלוֹ אֲשֶׁר מָעַל
  english_pob_choice: In the treachery by which he has acted treacherously
  chosen_korean: 그가 배반하여 배반한 그 배반
  alternatives_korean:
  - 그가 신실하지 못하게 신실하지 못한 그 불성실
  - 그가 범한 배신의 배반
  lexicon: HALOT
  rationale: מעל의 어근 반복을 한국어에서 단순한 '죄'로 지우지 않고, 언약적 배반의 뉘앙스가 드러나도록 '배반'을 반복해 옮겼습니다.
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר חָטָא
  english_pob_choice: and in the sin that he has committed
  chosen_korean: 그가 범한 죄
  alternatives_korean:
  - 그가 지은 죄
  - 그의 죄
  lexicon: HALOT
  rationale: חטא의 기본 의미를 살려 '범한 죄'로 옮겼고, 과잉 반복은 줄이되 책임의 행위성을 유지했습니다.
- source_word: בָּם יָמוּת
  english_pob_choice: in them he shall die
  chosen_korean: —그 가운데서 그는 죽을 것입니다
  alternatives_korean:
  - —그 안에서 그는 죽을 것입니다
  - —그들로 말미암아 그는 죽을 것입니다
  lexicon: HALOT
  rationale: בָּם의 지시 대상을 바로 앞의 '배반'과 '죄'로 이해해, 한국어에서는 관계를 자연스럽게 드러내는 '그 가운데서'로 옮겼습니다.
theological_decisions:
- issue: 의로운 사람의 이전 의로운 행위가 어떻게 처리되는가
  chosen_reading: 이전의 의로운 행위는 기억되지 않는다고 직설적으로 옮겨, 현재의 배반과 죄에 대한 하나님의 심판 선언을 그대로 드러냈습니다.
  alternative_readings:
  - 이전 공로를 상실한다는 표현
  - 구원의 보증이 취소된다는 표현
  rationale: 본문은 공로 체계나 신학적 조정을 설명하지 않고, 이전의 의로운 행위가 '기억되지 않는다'고 말합니다. 그 긴장을 보존하는 것이 본문 충실성에 맞습니다.
  doctrine_reference: 개인의 도덕적 책임과 심판을 본문 수준에서 보존
