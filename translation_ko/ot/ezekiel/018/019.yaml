id: EZK.18.19
reference: Ezekiel 18:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֕ם מַדֻּ֛עַ לֹא נָשָׂ֥א הַ/בֵּ֖ן בַּ/עֲוֺ֣ן הָ/אָ֑ב וְ/הַ/בֵּ֞ן מִשְׁפָּ֧ט וּ/צְדָקָ֣ה עָשָׂ֗ה אֵ֣ת כָּל חֻקּוֹתַ֥/י שָׁמַ֛ר וַ/יַּעֲשֶׂ֥ה אֹתָ֖/ם חָיֹ֥ה יִחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/019.yaml
  text: Yet you say[a], ‘Why does the son not bear the iniquity of the father?’ Because the son has done justice and righteousness, has kept all my statutes, and has done them; he shall surely live.
  footnotes:
  - marker: a
    text: Or 'the guilt of the father' or 'the punishment for the father's iniquity.' The Hebrew idiom 'bear iniquity' can include both guilt and its consequences.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희는 말합니다. ‘어째서 아들이 아버지의 죄악을 담당하지 않습니까?’ 아들이 정의와 의를 행하고 내 모든 규례를 지키며 그것들을 행하였으므로 그는 반드시 살 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  english_pob_choice: Yet you say
  chosen_korean: 그러나 너희는 말합니다
  alternatives_korean:
  - 그리고 너희는 말합니다
  - 그런데 너희는 말합니다
  lexicon: HALOT
  rationale: 대조적 화제 전환을 살리되, 한국어에서는 반대·항의의 도입으로 자연스러운 ‘그러나’가 문맥상 적절합니다.
- source_word: לֹא נָשָׂא
  english_pob_choice: does ... not bear
  chosen_korean: 담당하지 않습니까
  alternatives_korean:
  - 지지 않습니까
  - 짊어지지 않습니까
  lexicon: HALOT
  rationale: נשא + עוון의 관용적 의미를 살려 단순한 물리적 ‘짊어짐’보다 죄책/결과를 함께 포괄할 수 있는 ‘담당하다’를 택했습니다.
- source_word: בַּעֲוֺן הָאָב
  english_pob_choice: the iniquity of the father
  chosen_korean: 아버지의 죄악
  alternatives_korean:
  - 아버지의 죄책
  - 아버지의 죄의 대가
  lexicon: HALOT
  rationale: עון의 의미 범위를 좁히지 않고 도덕적 악과 그 책임을 함께 드러내는 ‘죄악’으로 옮겼습니다.
- source_word: מִשְׁפָּט וּצְדָקָה
  english_pob_choice: justice and righteousness
  chosen_korean: 정의와 의
  alternatives_korean:
  - 공의와 의
  - 정의와 바름
  lexicon: HALOT
  rationale: Ezekiel에서 반복되는 משפט/צדקה의 짝을 한국어 신학 용례에 맞게 ‘정의와 의’로 유지했습니다.
theological_decisions:
- issue: 아들이 아버지의 עון을 ‘담당한다’는 표현의 범위
  chosen_reading: 죄책만이 아니라 그 결과까지 포함할 수 있는 관용어로 유지했습니다.
  alternative_readings:
  - 아버지의 죄책을 짊어진다
  - 아버지의 죄의 벌을 받는다
  rationale: 히브리어 관용구의 긴장을 풀어 단일 교리 문장으로 만들지 않고, 개인 책임을 강조하는 본문 구조를 그대로 살렸습니다.
  doctrine_reference: '번역 원칙 §3: 신학적 긴장을 보존하고 과도하게 해석하지 않음'
