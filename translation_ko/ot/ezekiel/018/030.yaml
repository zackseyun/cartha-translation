base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/030.yaml
  text: Therefore I will judge each man according to his ways[a], O house of Israel, declares the Lord GOD. Repent and turn away from all your transgressions, so that iniquity may not become a stumbling block to you.
  footnotes:
  - marker: a
    text: Or, 'so that your iniquity may not become your ruin.' The Hebrew final phrase is compact and may emphasize either iniquity as the stumbling block or iniquity as leading to ruin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 나는 이스라엘 집아, 너희 각 사람을 그의 길대로 심판하겠습니다. 주 야훼의 선언입니다. 돌아오고, 너희 모든 범죄에서 돌이키십시오. 그러면 죄악이 너희의 걸림돌이 되지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 죄악이 너희의 멸망이 되지 않게 하려는 것이다’로도 옮길 수 있습니다. 히브리어 마지막 구절은 매우 압축적이어서, 죄악이 걸림돌이라는 뜻과 죄악이 결국 멸망으로 이끈다는 뜻을 함께 열어 둡니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ כִּדְרָכָיו
  english_pob_choice: each man according to his ways
  chosen_korean: 너희 각 사람을 그의 길대로
  alternatives_korean:
  - 각 사람을 그의 행실대로
  - 각자를 그의 삶의 길대로
  lexicon: HALOT
  rationale: אִישׁ의 분배적 단수와 דֶּרֶךְ의 은유를 함께 살리기 위해 ‘각 사람’과 ‘길대로’를 사용했습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 야훼의 선언입니다
  alternatives_korean:
  - 주 하나님 야훼의 선언입니다
  - 주 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 선언 공식을 자연스러운 현대 한국어로 옮기되, 결합 호칭을 유지하기 위해 ‘주 야훼’로 렌더링했습니다.
- source_word: שׁוּבוּ וְהָשִׁיבוּ
  english_pob_choice: Repent and turn away
  chosen_korean: 돌아오고, 너희 모든 범죄에서 돌이키십시오
  alternatives_korean:
  - 회개하고, 너희 모든 범죄를 버리십시오
  - 돌아서고, 너희 모든 죄과에서 돌아서십시오
  lexicon: HALOT
  rationale: שׁוּב의 기본 뜻인 ‘돌아오다/돌이키다’를 살리면서, שני imperatives의 병렬을 한국어 명령형으로 자연스럽게 표현했습니다.
- source_word: מִכָּל פִּשְׁעֵיכֶם
  english_pob_choice: from all your transgressions
  chosen_korean: 너희 모든 범죄에서
  alternatives_korean:
  - 너희 모든 반역에서
  - 너희 모든 허물에서
  lexicon: HALOT
  rationale: פֶּשַׁע의 반역·범죄 의미를 고려해, 법정·예언 문맥에 맞는 ‘범죄’를 선택했습니다.
- source_word: לְמִכְשׁוֹל עָוֺן
  english_pob_choice: so that iniquity may not become a stumbling block to you
  chosen_korean: 죄악이 너희의 걸림돌이 되지 않을 것입니다
  alternatives_korean:
  - 죄악이 너희에게 걸림돌이 되지 않을 것입니다
  - 죄악이 너희의 몰락이 되지 않을 것입니다
  lexicon: HALOT
  rationale: ‘걸림돌’로 מִכְשׁוֹל의 은유를 유지하되, עָוֺן의 압축된 의미는 ‘죄악’으로 남겨 문맥상 경고의 강도를 살렸습니다.
theological_decisions:
- issue: 합쇼체 명령과 예언자적 직접 경고의 톤
  chosen_reading: ‘돌아오고… 돌이키십시오’로 현대 예언 경고의 긴박함을 유지했습니다.
  alternative_readings:
  - ‘회개하십시오’로 완화
  - ‘돌아오라’로 반말화
  rationale: 히브리어 명령형의 촉구성을 살리면서도 한국어 성경의 공적·문어체 품위를 유지하기 위해 합쇼체 명령을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
