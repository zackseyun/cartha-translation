id: EZK.18.25
reference: Ezekiel 18:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֕ם לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י שִׁמְעוּ נָא֙ בֵּ֣ית יִשְׂרָאֵ֔ל הֲ/דַרְכִּ/י֙ לֹ֣א יִתָּכֵ֔ן הֲ/לֹ֥א דַרְכֵי/כֶ֖ם לֹ֥א יִתָּכֵֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/025.yaml
  text: 'Yet you say[a], ‘The way of the Lord is not just.’ Hear now, house of Israel: Is my way not just? Is it not your ways that are not just?'
  footnotes:
  - marker: a
    text: Or 'right' or 'fair' for 'just' in each occurrence of 'is not just.' The Hebrew term here concerns what is proper or equitable.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여러분은 「주님의 길은 공정하지 않다」[a]라고 말합니다. 이제 들으십시오, 이스라엘 집안이여. 내 길이 공정하지 않습니까? 오히려 공정하지 않은 것은 여러분의 길이 아닙니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절에서 ‘공정하다’는 각 용례마다 ‘옳다’, ‘바르다’, ‘공평하다’로도 옮길 수 있습니다. 히브리어는 무엇이 마땅하고 공평한지를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  english_pob_choice: Yet you say
  chosen_korean: 그러나 여러분은 …라고 말합니다
  alternatives_korean:
  - 그런데 여러분은 …라고 말합니다
  - 그러나 너희는 …라고 말합니다
  lexicon: HALOT
  rationale: 대조적 반박 문맥이므로 연결어를 ‘그러나’로 살려 주었습니다. 예언자적 항변의 직접성을 위해 2인칭 복수를 유지하되, 현대 한국어 문체에 맞게 정리했습니다.
- source_word: יִתָּכֵן
  english_pob_choice: is just
  chosen_korean: 공정하지 않다
  alternatives_korean:
  - 옳지 않다
  - 정당하지 않다
  - 공평하지 않다
  lexicon: HALOT
  rationale: 이 동사는 여기서 도덕적·법적 타당성을 묻는 말이므로 ‘공정하다/공정하지 않다’가 POB의 ‘just’와 가장 잘 대응합니다. ‘공평하다’도 가능하지만, 본문의 논쟁적·심판적 어조는 ‘공정하다’가 더 잘 드러냅니다.
- source_word: אֲדֹנָי
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인이신 분
  lexicon: HALOT
  rationale: 하나님을 가리키는 호칭이므로 한국어 관용에 맞는 ‘주님’을 사용했습니다. 인용문 안에서는 소유격형보다 호칭형이 자연스럽습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: house of Israel
  chosen_korean: 이스라엘 집안
  alternatives_korean:
  - 이스라엘 집
  - 이스라엘 집안 사람들
  lexicon: HALOT
  rationale: 예언서의 집단적 언약 호칭을 유지하면서도 현대 한국어로는 ‘집안’이 가장 자연스럽게 공동체 전체를 가리킵니다. ‘집’보다 공동체적 뉘앙스가 분명합니다.
- source_word: הֲדַרְכִּי … הֲלֹא דַרְכֵיכֶם
  english_pob_choice: Is my way not just? Is it not your ways that are not just?
  chosen_korean: 내 길이 공정하지 않습니까? 공정하지 않은 것은 오히려 너희 길이 아니냐?
  alternatives_korean:
  - 내 길이 옳지 않습니까? 오히려 너희 길이 옳지 않은 것이 아니냐?
  - 내 길이 공정하지 않습니까? 너희 길이 오히려 공정하지 않지 않습니까?
  lexicon: HALOT
  rationale: 히브리어의 대조를 살리기 위해 ‘내 길’과 ‘너희 길’을 맞세웠고, 뒤 문장은 반전 구조를 살려 수사적 질문으로 옮겼습니다. 복수형 ‘길들’보다 본문의 집단적 삶의 방식 전체를 가리키는 한국어 ‘길’이 더 자연스럽습니다.
theological_decisions:
- issue: ‘יִתָּכֵן’을 어떻게 한국어로 균형 있게 옮길지
  chosen_reading: ‘공정하다’로 일관되게 번역해 하나님의 길과 인간의 길을 윤리적·법적 기준에서 대조했습니다.
  alternative_readings:
  - ‘옳다’
  - ‘공평하다’
  rationale: 이 장의 핵심은 하나님의 공의에 대한 이스라엘의 불평을 반박하는 데 있습니다. ‘공정하다’는 단순한 감정적 공평함보다 न्याय/공의의 판정성을 더 잘 드러내며, 본문의 논쟁적 신학을 약화시키지 않습니다.
  doctrine_reference: 에스겔 18장 문맥의 하나님의 공의와 인간 책임
- issue: 직설 인용문의 호칭과 청중 호명
  chosen_reading: 이스라엘을 향한 선지자적 책망으로 현대 합쇼체를 쓰되, উদ্ধ요문 안의 직접 발화는 수사적 질문 형태를 유지했습니다.
  alternative_readings:
  - 전면적인 평서문화
  - 더 강한 명령형 어조
  rationale: 본문은 책망이지만, 원문은 질문형 반문으로 상대의 판단을 겨냥합니다. 합쇼체로 옮기되 반문 구조를 유지해야 독자가 본문의 신학적 긴장을 그대로 느낄 수 있습니다.
  doctrine_reference: 예언서 담화 구조와 수사적 반문
