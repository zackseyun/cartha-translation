reference: Ezekiel 18:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּרְאֶ֣ה ו/ישוב מִ/כָּל פְּשָׁעָ֖י/ו אֲשֶׁ֣ר עָשָׂ֑ה חָי֥וֹ יִחְיֶ֖ה לֹ֥א יָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/028.yaml
  text: Because he considered and turned back from all his transgressions that he had committed[a], he will surely live[b]; he will not die.
  footnotes:
  - marker: a
    text: Or 'For he saw' or 'And he saw'; the Hebrew verb is literally 'saw,' here likely meaning perceived or considered.
    reason: lexical_alternative
  - marker: b
    text: Or 'repented' for 'turned back'; the Hebrew says 'turned/returned,' preserving the image of reversal from sin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 자기의 모든 허물에서 돌아섰고, 곧 자신이 저지른 모든 죄에서 돌아섰으니, 그는 반드시 살 것입니다[a][b]. 그는 죽지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 보았다’/‘그가 살폈다’로 옮길 수 있습니다. 히브리어 동사는 문자적으로 ‘보다’이지만, 여기서는 분별하여 인식하는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘돌아섰다’ 대신 ‘회개했다’로 옮길 수 있습니다. 히브리어는 ‘돌다/돌아오다’의 이미지를 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאֶה
  english_pob_choice: Because he considered
  chosen_korean: 그가 … 돌아섰고
  alternatives_korean:
  - 그가 보았고
  - 그가 고려했고
  lexicon: HALOT
  rationale: 히브리어 ראה는 기본적으로 ‘보다’이지만, 문맥상 죄를 분별하고 방향을 바꾸는 인식의 뉘앙스가 강하므로 한국어에서는 단순 시각보다 결과를 드러내는 연결로 처리했습니다.
- source_word: וישוב
  english_pob_choice: turned back
  chosen_korean: 돌아섰고
  alternatives_korean:
  - 회개했고
  - 되돌아갔고
  lexicon: HALOT
  rationale: שׁוּב의 핵심 이미지는 ‘돌아가다/되돌아서다’이므로, 신학적 용어로 고정된 ‘회개하다’보다 원문 이미지가 보이도록 ‘돌아서다’를 택했습니다.
- source_word: מִכָּל פְּשָׁעָיו
  english_pob_choice: from all his transgressions
  chosen_korean: 자기의 모든 허물에서
  alternatives_korean:
  - 자기의 모든 범죄에서
  - 자기의 모든 죄과에서
  lexicon: HALOT
  rationale: פֶּשַׁע는 ‘반역/허물/범죄’의 성격을 가지므로, 한국어에서는 죄의 무게를 유지하면서도 문맥에 자연스러운 ‘허물’을 선택했습니다.
- source_word: חָיוֹ יִחְיֶה
  english_pob_choice: he will surely live
  chosen_korean: 반드시 살 것입니다
  alternatives_korean:
  - 정녕 살 것입니다
  - 살고 살 것입니다
  lexicon: HALOT
  rationale: 히브리어의 부정사 절대형+미완료형은 강조를 나타내므로, 한국어에서는 반복보다 자연스러운 강조 부사 ‘반드시’로 그 힘을 살렸습니다.
theological_decisions:
- issue: ‘살다/죽다’의 범위
  chosen_reading: 형벌·생명 약속을 구체적으로 좁히지 않고, 본문의 직접적 약속과 경고를 그대로 유지했습니다.
  alternative_readings:
  - 육체적 생존
  - 언약적 생명
  - 영적 생명
  rationale: 에스겔의 경고/약속 문맥은 생명과 죽음의 범위를 단정적으로 한정하지 않으므로, 본문의 긴장을 보존하는 번역이 더 충실합니다.
  doctrine_reference: 본문의 신학적 긴장을 해소하지 않고 보존
