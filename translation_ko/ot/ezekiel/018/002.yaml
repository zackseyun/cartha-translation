    rationale: 한국어에서 ‘이가 시다’는 뜻이 불명확하거나 ‘치아가 시다’로 읽힐 수 있습니다. 신 포도로 인한 치아의 불쾌한 감각을 나타내는 ‘이가 시큰해진다’가 자연스럽고 충실합니다.
