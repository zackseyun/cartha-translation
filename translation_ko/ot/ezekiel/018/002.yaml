revisions:
- from: “어찌하여 너희는 이 비유를 이스라엘 땅에서 되풀이하며 말합니까? ‘아버지들이 신 포도를 먹었으나 자녀들의 이가 시다’라고 말입니다.”[a]
  to: “너희가 ‘아버지들이 신 포도를 먹으면 자녀들의 이가 시큰해진다[a]’라는 이 속담을 이스라엘 땅에서 되풀이해 말하는 것은 어찌 된 일입니까?”
  rationale: ‘속담’으로 장르를 정확히 구별하고, 원문의 반복적으로 속담을 사용한다는 뜻을 ‘되풀이해 말하다’로 보존했습니다. 속담 내부는 한국어의 일반적 인과 표현인 ‘먹으면 … 시큰해진다’로 옮겨, 원문의 병렬된 세대 간 결과 관계를 역접 없이 자연스럽게 드러냈습니다. 각주에는 원문의 ‘아들들’이라는 형태와 תִּקְהֶינָה의 문자적 ‘무뎌지다’ 가능성을 남겨 두었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:40:37Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. מָשָׁל은 이 문맥에서 이야기형 ‘비유’가 아니라 속담이므로 ‘속담’으로 옮겨야 합니다. 또한 ‘먹었으나’의 역접은 히브리어 접속사 וְ가 나타내는 속담의 병렬·인과 관계를 부정확하게 만듭니다. תִּקְהֶינָה는 치아가 신 포도로 인해 느끼는 시큰함/무뎌짐을 가리키므로 ‘이가 시다’보다 ‘이가 시큰해진다’가 자연스럽고 의미가 분명합니다.
  naturalness: ‘이 비유를 … 되풀이하며 말합니까? …라고 말입니다’는 ‘말하다’가 중복되고 인용문의 연결도 다소 어색합니다. 인용된 속담을 앞에 두고 ‘이 속담을 … 되풀이해 말하는 것은 어찌 된 일입니까?’라고 하면 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘아버지들’과 ‘자녀들’은 원문의 성별 표지 및 대표적 후손 의미를 균형 있게 반영합니다. ‘신 포도’는 정착된 표현으로 적절합니다. מָשָׁל은 여기서 반드시 ‘속담’으로 구별하는 것이 좋습니다.
  issues:
