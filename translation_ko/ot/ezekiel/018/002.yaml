  text: What do you mean, that you keep repeating this proverb in the land of Israel[a], saying, ‘The fathers eat sour grapes, and the children’s teeth are set on edge’?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''The fathers eat sour grapes, and the sons’ teeth are dulled / set on edge.'''
    reason: lexical_alternative
translation:
  language: ko
  text: “어찌하여 너희는 이 비유를 이스라엘 땅에서 되풀이하며 말합니까? ‘아버지들이 신 포도를 먹었으나 자녀들의 이가 시다’라고 말입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘아버지들이 신 포도를 먹고, 아들들의 이가 시다 / 시큼해진다.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לָּכֶם
  english_pob_choice: What do you mean
  chosen_korean: 어찌하여 너희는
  alternatives_korean:
  - 무슨 일입니까
  - 너희에게 무슨 일이 있습니까
  - 무슨 뜻으로 그러합니까
  lexicon: HALOT
  rationale: 상대의 행동을 꾸짖거나 따져 묻는 관용구이므로, 자연스러운 항의·질책의 뉘앙스를 살려 ‘어찌하여 너희는’으로 옮겼습니다.
- source_word: מֹשְׁלִים אֶת הַמָּשָׁל הַזֶּה
  english_pob_choice: you keep repeating this proverb
  chosen_korean: 이 비유를 … 되풀이하며 말합니까
  alternatives_korean:
  - 이 비유를 … 말합니까
  - 이 속담을 … 되풀이합니까
  - 이 비유를 … 사용합니까
  lexicon: HALOT
  rationale: מָשָׁל은 여기서 이야기형 ‘비유’가 아니라 속담적 표현이므로 ‘비유’로 두되, 반복적 관용을 드러내기 위해 ‘되풀이하며 말하다’로 번역했습니다.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  english_pob_choice: in the land of Israel
  chosen_korean: 이스라엘 땅에서
  alternatives_korean:
  - 이스라엘 땅에 관하여
  - 이스라엘의 땅에서
  - 이스라엘 땅 위에서
  lexicon: HALOT
  rationale: עַל은 문맥상 ‘대하여’의 느낌도 있지만, 여기서는 예언자가 실제로 그 땅 안에서 유포되는 속담을 문제 삼는 문맥이므로 자연스럽고 직접적인 ‘이스라엘 땅에서’로 옮겼습니다.
- source_word: אָבוֹת … בֹסֶר … בָּנִים תִּקְהֶינָה
  english_pob_choice: The fathers eat sour grapes, and the children’s teeth are set on edge
  chosen_korean: 아버지들이 신 포도를 먹었으나 자녀들의 이가 시다
  alternatives_korean:
  - 아버지들이 신 포도를 먹고 자녀들의 이가 시다
  - 아버지들이 신 포도를 먹었고 자녀들의 이가 시다
  - 아버지들이 덜 익은 포도를 먹으나 자녀들의 이가 시다
  lexicon: HALOT
  rationale: אָבוֹת는 ‘아버지들’로, בֹסֶר은 성숙하지 않은 포도의 쓴맛·신맛을 함께 가리키므로 관용적으로 널리 이해되는 ‘신 포도’로 옮겼습니다. תִּקְהֶינָה는 영어 POB의 ‘set on edge’에 해당하는 치아의 불쾌한 시큰거림/시림을 ‘이가 시다’로 간결하게 재현했습니다.
theological_decisions:
- issue: בָּנִים의 번역 범위
  chosen_reading: 형태는 남성복수지만, 문맥상 후손 전체를 가리키므로 ‘자녀들’로 옮겼습니다.
  alternative_readings:
  - 아들들의 이가 시다
  - 자식들의 이가 시다
  rationale: 이 속담은 아버지-자녀의 세대적 귀결을 말하는 일반화된 표현이므로, 남성성을 과도하게 부각하는 ‘아들들’보다 대표적 후손 의미를 살린 ‘자녀들’이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
