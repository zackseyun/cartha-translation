source:
  edition: WLC
  text: כָּל פְּשָׁעָי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה לֹ֥א יִזָּכְר֖וּ ל֑/וֹ בְּ/צִדְקָת֥/וֹ אֲשֶׁר עָשָׂ֖ה יִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/022.yaml
  text: None of the transgressions that he has committed will be remembered against him[a]; by the righteousness that he has practiced[b], he will live.
  footnotes:
  - marker: a
    text: Or 'will not be held against him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in his righteousness' or 'by his righteousness'; the Hebrew preposition can be understood in more than one closely related sense here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 범한 모든 허물은 그에게서 기억되지 않을 것입니다[a]; 그가 행한 의로 그는 살 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 불리하게 기억되지 않을 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 의 안에서’ 혹은 ‘그의 의로’. 히브리어 전치사는 여기서 서로 밀접한 몇 가지 의미로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל פְּשָׁעָיו
  english_pob_choice: None of the transgressions
  chosen_korean: 그가 범한 모든 허물
  alternatives_korean:
  - 그의 모든 범죄
  - 그의 모든 죄과
  - 그가 지은 모든 반역
  lexicon: HALOT
  rationale: כָּל의 총괄성과 פְּשָׁעִים의 반역/허물 의미를 살리되, 한국어에서는 ‘모든 허물’이 법정적·도덕적 함의를 자연스럽게 전달합니다.
- source_word: לֹא יִזָּכְרוּ לוֹ
  english_pob_choice: will be remembered against him
  chosen_korean: 그에게서 기억되지 않을 것입니다
  alternatives_korean:
  - 그에게 불리하게 기억되지 않을 것입니다
  - 그에게 대하여 기억되지 않을 것입니다
  - 그에게 묻히지 않을 것입니다
  lexicon: HALOT
  rationale: נִזְכָּר의 수동 의미를 직접 살리면서, לּוֹ의 관계를 한국어의 ‘~에게서’로 자연스럽게 옮겨 문맥의 책임/계산 의미를 과도하게 덧붙이지 않았습니다.
- source_word: בְּצִדְקָת֥וֹ
  english_pob_choice: by the righteousness / because of the righteousness
  chosen_korean: 그가 행한 의로
  alternatives_korean:
  - 그의 의 안에서
  - 그의 의로
  - 그의 의 때문에
  lexicon: HALOT
  rationale: ב의 도구적·원인적 뉘앙스를 함께 살려 ‘그가 행한 의로’라고 옮겼습니다. צדקה는 여기서 상태보다 실제로 행해진 의로운 삶을 가리키므로 ‘행한 의’가 적절합니다.
- source_word: אֲשֶׁר עָשָׂה
  english_pob_choice: that he has practiced
  chosen_korean: 그가 행한
  alternatives_korean:
  - 그가 실천한
  - 그가 한
  - 그가 실행한
  lexicon: HALOT
  rationale: 의(צדקה)와 결합할 때 한국어에서는 ‘행한’이 가장 자연스럽고, 실제로 드러난 행위라는 점을 분명히 합니다.
theological_decisions:
- issue: 이 구절의 חיים(살다)을 어떻게 처리할지
  chosen_reading: ‘살 것입니다’로 직역에 가깝게 유지하여, 예언서 특유의 언약적·사법적 생명 약속을 보존했습니다.
  alternative_readings:
  - ‘생명을 누릴 것입니다’
  - ‘살아남을 것입니다’
  rationale: 본문은 단순한 생존 묘사보다 야훼 앞에서의 삶/생명 약속을 말하므로, 의미를 좁히지 않고 ‘살다’의 폭을 유지하는 것이 가장 안전합니다.
  doctrine_reference: 언약적 생명 약속을 과도하게 해석하지 않고 본문 표현을 보존함.
