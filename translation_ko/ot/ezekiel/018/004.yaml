  text: 보십시오, 모든 생명은 내 것입니다. 아버지의 생명도 아들의 생명도 내 것입니다. 죄를 짓는 사람, 바로 그 사람이 죽을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֶפֶשׁ은 문맥에 따라 ‘영혼’, ‘생명’, ‘자기’, 또는 ‘사람’을 뜻할 수 있습니다.
    reason: lexical_alternative
