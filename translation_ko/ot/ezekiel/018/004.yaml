revisions:
- from: 보십시오, 모든 생명은 내 것입니다. 아버지의 생명처럼 아들의 생명도 — 둘 다 내 것입니다. 죄를 짓는 생명은 죽을 것입니다.[a]
  to: 보십시오, 모든 생명은 내 것입니다. 아버지의 생명도 아들의 생명도 내 것입니다. 죄를 짓는 사람, 바로 그 사람이 죽을 것입니다.[a]
  rationale: 원문의 병렬 소유 선언을 한국어 병렬 구문으로 바로잡고, 마지막 절의 נֶפֶשׁ을 도덕적 책임을 지는 개인이라는 문맥에 맞게 ‘사람’으로 옮겼습니다. 이는 영어 POB의 문맥적 어휘 선택과도 일치하며, 히브리어의 강조는 ‘바로 그 사람이’로 보존했습니다.
