  text: הֵ֤ן כָּל הַ/נְּפָשׁוֹת֙ לִ֣/י הֵ֔נָּה כְּ/נֶ֧פֶשׁ הָ/אָ֛ב וּ/כְ/נֶ֥פֶשׁ הַ/בֵּ֖ן לִ/י הֵ֑נָּה הַ/נֶּ֥פֶשׁ הַ/חֹטֵ֖את הִ֥יא תָמֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/004.yaml
  text: Look[a], every life belongs to me. The life of the father is like the life of the son—both belong to me. The person who sins is the one who will die.
  footnotes:
  - marker: a
    text: Or 'all souls are mine ... the soul who sins shall die.' Hebrew נֶפֶשׁ can mean 'soul,' 'life,' 'self,' or 'person,' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 모든 생명은 내 것입니다. 아버지의 생명처럼 아들의 생명도 — 둘 다 내 것입니다. 죄를 짓는 생명은 죽을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֶפֶשׁ은 문맥에 따라 ‘영혼’, ‘생명’, ‘자기’, ‘사람’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보시오
  - 보십시오, 보라
  lexicon: HALOT
  rationale: 주의를 끄는 선언문 서두로 이해하여, 현대 한국어에서 자연스럽고 공적인 호소력을 지닌 명령형으로 옮겼습니다.
- source_word: כָּל הַנְּפָשׁוֹת
  english_pob_choice: every life
  chosen_korean: 모든 생명
  alternatives_korean:
  - 모든 영혼
  - 모든 사람
  - 모든 목숨
  lexicon: HALOT
  rationale: נֶפֶשׁ의 범위를 영혼으로 좁히지 않고, 하나님께 속한 인간의 생명 전체라는 뜻을 살려 ‘모든 생명’으로 옮겼습니다.
- source_word: לִי הֵנָּה
  english_pob_choice: belongs to me
  chosen_korean: 내 것입니다
  alternatives_korean:
  - 내 것입니다만
  - 내 소유입니다
  - 제게 속합니다
  lexicon: HALOT
  rationale: 히브리어의 소유 진술을 자연스럽게 살리되, 하나님의 소유권을 분명하게 드러내는 표현으로 옮겼습니다.
- source_word: הַנֶּפֶשׁ הַחֹטֵאת
  english_pob_choice: The person who sins
  chosen_korean: 죄를 짓는 생명
  alternatives_korean:
  - 죄를 짓는 사람
  - 죄를 범하는 자
  - 죄짓는 영혼
  lexicon: HALOT
  rationale: 반복된 נֶפֶשׁ을 일관되게 살려, 최종 절에서도 ‘생명’을 유지하면서 행위 주체성을 분명히 했습니다. 영어 본문의 ‘person’보다 원어 반복을 더 직접적으로 반영합니다.
theological_decisions:
- issue: נֶפֶשׁ의 의미를 이 구절에서 어떻게 한국어로 처리할지
  chosen_reading: 소유 진술에서는 ‘생명’으로, 책임 진술에서는 ‘죄를 짓는 생명’으로 일관되게 옮겼습니다.
  alternative_readings:
  - 영혼
  - 사람
  - 목숨
  rationale: 이 본문은 인간 존재의 비물질적 부분을 논하기보다, 모든 انسانی জীব이 하나님께 속해 있으며 죄에 대한 책임이 개별적으로 돌아간다는 점을 말합니다. ‘영혼’은 한국어에서 지나치게 형이상학적으로 들릴 수 있어, 원문의 반복을 살린 ‘생명’이 더 적합합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
