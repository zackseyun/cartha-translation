review_pass:
  verdict: revise
  source_fidelity: 첫 두 절의 ‘모든 생명’과 ‘내 것입니다’는 נֶפֶשׁ 및 소유 진술을 문맥상 적절히 반영합니다. 다만 כְּנֶפֶשׁ הָאָב וּכְנֶפֶשׁ הַבֵּן은 아버지와 아들의 생명이 모두 하나님께 속한다는 병렬을 말하므로, ‘아버지의 생명도 아들의 생명도’가 ‘…처럼’보다 직접적입니다. 마지막의 הַנֶּפֶשׁ הַחֹטֵאת הִיא는 죄의 책임을 지는 개인을 가리키므로 ‘생명’보다 ‘사람’이 충실하며, ‘바로 그 사람이’가 הִיא의 강조를 살립니다.
  naturalness: ‘죄를 짓는 생명’은 현대 한국어에서 행위 주체를 가리키는 표현으로 부자연스럽고 의미가 다소 불명확합니다. ‘죄를 짓는 사람, 바로 그 사람이 죽을 것입니다’는 합쇼체의 공적 문체에서 자연스럽고 원문의 개별 책임 강조도 명료하게 전달합니다.
  terminology: נֶפֶשׁ은 앞선 소유 진술에서는 ‘생명’으로, 마지막 책임 진술에서는 ‘사람’으로 문맥에 따라 옮기는 것이 적절합니다. 이는 ‘영혼’이라는 한국어 표현이 유발할 수 있는 좁은 형이상학적 함의를 강제하지 않으면서 원문의 의미 범위를 보존합니다.
