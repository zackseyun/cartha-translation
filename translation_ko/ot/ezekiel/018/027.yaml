  source_fidelity: 히브리어의 시간적·조건적 도입구(“악인이 … 돌이켜”), 그가 행한 악, “정의와 의”(מִשְׁפָּט וּצְדָקָה), 그리고 נֶפֶשׁ를 문맥상 ‘생명’으로 이해한 결과절을 충실히 반영합니다. יְחַיֶּה의 피엘 의미도 ‘자기 생명을 보존할 것입니다’로 적절히 전달됩니다.
  naturalness: 현대 표준 한국어의 합쇼체로 자연스럽고, 예언서의 격조에도 맞습니다. ‘악인이 자기가 행한 악에서 돌이켜서’는 의미가 분명하며 부자연스러운 중복으로 보이지 않습니다.
  terminology: ‘악인’, ‘정의와 의’, ‘생명’은 본문과 문맥에 알맞습니다. 특히 נֶפֶשׁ를 ‘영혼’으로 본문에 고정하지 않고 ‘생명’으로 번역한 것은 에스겔 18장의 삶과 죽음의 대조에 부합합니다. 각주도 가능한 어휘 범위를 적절히 알립니다.
