  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/שׁ֣וּב רָשָׁ֗ע מֵֽ/רִשְׁעָת/וֹ֙ אֲשֶׁ֣ר עָשָׂ֔ה וַ/יַּ֥עַשׂ מִשְׁפָּ֖ט וּ/צְדָקָ֑ה ה֖וּא אֶת נַפְשׁ֥/וֹ יְחַיֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/027.yaml
  text: And when a wicked man turns away from the wickedness that he has done and does justice and righteousness[a], he will preserve his life.
  footnotes:
  - marker: a
    text: Or 'he will keep himself alive' or 'he will save his soul alive.' The Hebrew idiom uses 'his nephesh,' which can mean 'life,' 'self,' or 'soul' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 악인이 자기가 행한 악에서 돌이켜서 정의와 의를 행하면, 그는 자기 생명을 보존할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그는 자기 자신을 살릴 것입니다' 혹은 '그는 자기 영혼을 살려 둘 것입니다'. 히브리어 관용구는 '그의 네페쉬'를 사용하며, 문맥에 따라 '생명', '자기 자신', '영혼'을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/שׁוּב
  english_pob_choice: And when ... turns away
  chosen_korean: 돌이켜서
  alternatives_korean:
  - 그리고 돌이킬 때
  - 돌아서서
  lexicon: HALOT
  rationale: שׁוּב의 시간적·조건적 용법을 살려, 이전의 행위에서 돌아서는 동작을 자연스럽게 옮겼습니다.
- source_word: רָשָׁע
  english_pob_choice: a wicked man
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람
  - 사악한 사람
  lexicon: HALOT
  rationale: 부정적 성격을 지닌 남성 단수 실명사이므로, 예언서에서 자연스러운 표준 표현인 '악인'으로 옮겼습니다.
- source_word: מִשְׁפָּט וּצְדָקָה
  english_pob_choice: justice and righteousness
  chosen_korean: 정의와 의
  alternatives_korean:
  - 공의와 의
  - 정의와 공의
  lexicon: HALOT
  rationale: 이 짝은 윤리적·법적 행위를 가리키는 정형 표현이므로, 각각의 뉘앙스를 살려 '정의와 의'로 구분했습니다.
- source_word: אֶת נַפְשׁוֹ יְחַיֶּה
  english_pob_choice: he will preserve his life
  chosen_korean: 그는 자기 생명을 보존할 것입니다
  alternatives_korean:
  - 그는 자기 생명을 살릴 것입니다
  - 그는 자기 목숨을 지킬 것입니다
  lexicon: HALOT
  rationale: נפש의 여기서의 의미를 '생명'으로 보고, חיה의 사역적 뜻을 결과 중심으로 '보존하다'로 옮겨 문맥의 삶/죽음 대조를 분명히 했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역 범위
  chosen_reading: 자기 생명
  alternative_readings:
  - 자기 영혼
  - 자기 자신
  rationale: 문맥이 도덕적 행위의 결과로서의 생존/죽음을 논하므로, '영혼'보다 '생명'이 히브리어의 구체적 의미와 본문 논지를 더 정확히 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3
