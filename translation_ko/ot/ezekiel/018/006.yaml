  text: אֶל הֶֽ/הָרִים֙ לֹ֣א אָכָ֔ל וְ/עֵינָי/ו֙ לֹ֣א נָשָׂ֔א אֶל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל וְ/אֶת אֵ֤שֶׁת רֵעֵ֨/הוּ֙ לֹ֣א טִמֵּ֔א וְ/אֶל אִשָּׁ֥ה נִדָּ֖ה לֹ֥א יִקְרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/006.yaml
  text: he does not eat on the mountains[a], does not lift up his eyes to the idols of the house of Israel, does not defile his neighbor’s wife[c][b], and does not approach a woman during her menstrual impurity.
  footnotes:
  - marker: a
    text: Or 'eat at the mountain shrines'; the phrase refers to participating in sacrificial meals at high places.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'idols' uses a strongly contemptuous term for false gods.
    reason: lexical_alternative
  - marker: c
    text: '''Does not approach'' is a Hebrew euphemism for sexual relations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 산들에서 먹지 않고, 이스라엘 집의 우상들에 눈을 들지 않으며, 그의 이웃의 아내를 더럽히지 않고, 월경 중인 여인에게 가까이 가지 않습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘산들에서 먹다’는 산당에서 드리는 제의적 식사에 참여한다는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어의 ‘우상들’은 거짓 신들을 가리키는 경멸적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘가까이 가지 않다’는 성관계를 가리키는 완곡어법입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל הֶהָרִים ... אָכָל
  english_pob_choice: eat on the mountains
  chosen_korean: 산들에서 먹지 않고
  alternatives_korean:
