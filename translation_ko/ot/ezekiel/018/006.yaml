  - 바라보지 않으며
  lexicon: HALOT
  rationale: ‘눈을 들어’는 히브리어 관용을 비교적 자연스럽게 살리는 표현으로, 우상에 대한 주목/의존의 뉘앙스를 유지합니다.
- source_word: גִּלּוּלֵי
  english_pob_choice: idols
  chosen_korean: 우상들
  alternatives_korean:
  - 우상들
  - 더러운 우상들
  lexicon: HALOT
  rationale: 본문의 멸시적 어조는 유지하되, 본문 자체에서는 가장 분명한 표준어인 ‘우상들’로 번역하고, 경멸적 뉘앙스는 주석에서 처리하는 편이 원문에 더 충실합니다.
- source_word: לֹא טִמֵּא
  english_pob_choice: does not defile
  chosen_korean: 더럽히지 않고
  alternatives_korean:
  - 부정하게 하지 않고
  - 더럽히지 않고
  lexicon: HALOT
  rationale: 성적/예식적 오염의 긴장을 살리기 위해 ‘더럽히다’를 택했습니다. 한국어에서도 도덕적·정결적 함의를 함께 품을 수 있습니다.
- source_word: אִשָּׁה נִדָּה
  english_pob_choice: a woman during her menstrual impurity
  chosen_korean: 월경 중인 여인
  alternatives_korean:
  - 월경 부정의 여인
  - 월경 중의 여인
  lexicon: HALOT
  rationale: 현대 한국어에서 ‘부정’은 어색하고 오해 소지가 있어, 정결 상태를 드러내면서도 자연스러운 ‘월경 중인 여인’으로 옮겼습니다.
- source_word: לֹא יִקְרָב
  english_pob_choice: does not approach
  chosen_korean: 가까이 가지 않습니다
  alternatives_korean:
  - 접근하지 않습니다
  - 가까이 하지 않습니다
  - 관계를 갖지 않습니다
  lexicon: HALOT
  rationale: 히브리어 완곡어법을 본문에서 과도하게 직설화하지 않고, 한국어에서도 완곡성과 의미를 함께 전달하기 위해 ‘가까이 가지 않습니다’로 옮겼습니다.
theological_decisions:
- issue: 산에서 먹는 행위의 제의적 의미를 본문에서 얼마나 드러낼지
  chosen_reading: 본문은 ‘산들에서 먹지 않고’로 유지하고, 산당 제의의 함의는 본문 밖에서 확인 가능하게 둡니다.
  alternative_readings:
  - 산당에서 먹지 않고
  - 산 위 제사 잔치에 참여하지 않고
  rationale: 원문은 산당의 제의적 식사를 암시하지만, 본문을 해설문처럼 바꾸지 않는 것이 더 직접적입니다. 이 절은 의인 묘사의 목록형 표현이므로 히브리어 이미지를 보존하는 편이 적절합니다.
  doctrine_reference: Original-language primacy; preserve source imagery unless the text itself specifies otherwise.
- issue: ‘더럽히다’와 ‘월경 중인 여인’의 정결 언어를 어떻게 처리할지
  chosen_reading: 도덕적·정결적 긴장을 해소하지 않고 그대로 유지합니다.
  alternative_readings:
  - 부정하게 하지 않고 / 월경 중의 여인에게 가까이 가지 않습니다
  - 성적 관계를 맺지 않고
  rationale: 본문은 성적 금지와 정결 개념을 함께 담고 있으므로, 지나치게 윤리적이거나 위생적인 말로 환원하지 않는 것이 원문 의미를 더 잘 보존합니다.
  doctrine_reference: Preserve theological tension between moral and ritual purity.
