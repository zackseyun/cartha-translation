  lexicon: HALOT
  rationale: 히브리어의 산당 관련 관용을 본문에서 너무 풀어 쓰지 않고, 한국어에서도 원문 이미지를 살리기 위해 ‘산들에서’로 옮겼습니다.
- source_word: וְעֵינָיו לֹא נָשָׂא
  english_pob_choice: does not lift up his eyes
  chosen_korean: 눈을 들지 않으며
  alternatives_korean:
