    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ
  english_pob_choice: But if a man
  chosen_korean: 그러나 만일 어떤 사람이
  alternatives_korean:
  - 그리고 어떤 사람이
  - 만일 어떤 사람이
  - 그러나 만일 한 남자가
  lexicon: HALOT
  rationale: 히브리어 אִישׁ의 대표적 개별 사례를 살리되, 현대 한국어에서는 성별을 전면화한 ‘사람’이 자연스러워 문맥의 보편적 조건문을 유지했습니다. 앞의 וְ는 대조적 전환으로 이해해 ‘그러나’로 옮겼습니다.
- source_word: יִהְיֶה
  english_pob_choice: is
  chosen_korean: 있으면
  alternatives_korean:
  - 되면
  - 이 되면
  - 있을 경우
  lexicon: HALOT
  rationale: 히브리어 동사의 일반적 조건 용법을 한국어 조건문으로 자연스럽게 풀어, 상태의 지속을 드러내는 ‘있으면’으로 옮겼습니다.
- source_word: צַדִּיק
  english_pob_choice: righteous
  chosen_korean: 의롭고
  alternatives_korean:
  - 의롭다면
  - 의인이고
  - 공의로운
  lexicon: HALOT
  rationale: צַדִּיק는 도덕적·언약적 올바름을 가리키므로, 뒤의 ‘의를 행하다’와 짝을 이루는 형용사로 ‘의롭다’가 가장 직접적입니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 공의를 행하며
  alternatives_korean:
  - 정의를 행하며
  - 심판을 행하며
  - 재판을 행하며
  lexicon: HALOT
  rationale: 여기서는 단순한 법정 판결보다 삶의 공정한 질서를 가리키는 윤리적 용법이므로, 한국어 성경어휘 가운데서는 ‘공의’가 가장 적절합니다.
- source_word: וּ/צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의를 행하면
  alternatives_korean:
  - 의를 실천하면
  - 정의를 행하면
  - 올바름을 행하면
  lexicon: HALOT
  rationale: מִשְׁפָּט와 짝을 이루는 צְדָקָה를 ‘의’로 옮겨 두 개념의 구별을 살렸고, 동사 עשה와 결합한 관용을 ‘행하다’로 간결하게 유지했습니다.
theological_decisions:
- issue: 공의/의의 병렬 표현
  chosen_reading: 공의와 의를 각각 구별해 옮겼습니다.
  alternative_readings:
  - 공의와 정의
  - 정의와 의
  - 공정과 의로움
  rationale: 히브리어의 고정된 윤리쌍 מִשְׁפָּט / צְדָקָה는 동일어 반복이 아니라 의미 구분이 있으므로, 한국어에서도 두 항을 분리해 문장의 윤리적 긴장을 보존했습니다.
  doctrine_reference: Source-first lexical distinction; preserve paired Hebrew ethics
- issue: 대표적 남성 단수의 처리
  chosen_reading: אִישׁ의 대표적 개별 사례를 한국어에서는 성별 비강조 표현으로 옮겼습니다.
  alternative_readings:
  - 한 남자가
  - 남자가
  - 어떤 남자가
  rationale: 히브리어 형태는 남성 단수이지만, 한국어에서는 인물 유형을 제시하는 법적·예언적 조건문에서 성별을 전면화하지 않아도 본뜻이 유지되므로 문체상 ‘어떤 사람이’가 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §4 (Gender-accurate over gender-neutral)
