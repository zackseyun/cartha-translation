- source_word: גָּזַל גֵּזֶל אָח
  english_pob_choice: robbed his brother
  chosen_korean: 자기 형제를 약탈하다
  alternatives_korean:
  - 자기 형제를 강탈하다
  - 형제를 빼앗다
  - 한 형제를 약탈하다
  lexicon: HALOT
  rationale: אָח를 공동체의 동료 구성원까지 포함할 수 있는 관계어로 보아 ‘형제’로 옮기고, 약탈/강탈 계열로 폭력성과 착취성을 드러냈습니다.
- source_word: בְּתוֹךְ עַמָּיו
  english_pob_choice: among his people
  chosen_korean: 자기 백성 가운데서
  alternatives_korean:
  - 그의 백성 한가운데서
  - 자기 ժողովրդի 가운데서
  - 자기 백성 안에서
  lexicon: HALOT
  rationale: 공동체 내부에서 벌어진 행위라는 공간적·사회적 뉘앙스를 살리기 위해 ‘가운데서’를 선택했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보라,
  - 여기 보십시오
  lexicon: HALOT
  rationale: 예언적 담화 표지의 돌출성을 유지하면서도 현대 한국어 독자에게 자연스럽고 격식 있는 명령형으로 옮겼습니다.
- source_word: בַּעֲוֹנוֹ
  english_pob_choice: in his iniquity
  chosen_korean: 자기의 죄악 안에서
  alternatives_korean:
  - 자기의 죄악 가운데서
  - 자기의 죄악으로
  - 자기의 죄 가운데서
  lexicon: HALOT
  rationale: ‘in’의 상태/처지 뉘앙스를 살리기 위해 ‘안에서’를 유지했고, עָוֹן의 무게를 ‘죄악’으로 반영했습니다.
theological_decisions:
- issue: perfect form מֵת의 미래적 확정성
  chosen_reading: ‘죽을 것입니다’로 옮겨, 실제 시제보다 판결의 확정성을 드러냈습니다.
  alternative_readings:
  - 죽습니다
  - 죽었습니다
  rationale: 예언·법정적 문맥에서 완료형이 결과의 확실성을 표현하므로, 한국어에서는 미래로 처리해 선언의 확정성을 살렸습니다.
  doctrine_reference: 예언적 확정 표현은 서술 시제보다 판결 성격을 우선함
- issue: 보편적 개인 책임의 강조
  chosen_reading: 아버지의 죽음이 다른 사람의 죄가 아니라 자기 죄악의 결과임을 드러내는 구조를 유지했습니다.
  alternative_readings:
  - 일반적인 죄의 결과 진술로 약화
  - 가계적 책임을 암시하는 표현
  rationale: 18장 전체의 논지를 훼손하지 않도록 소유격·원인절·결과절을 그대로 살렸습니다.
  doctrine_reference: 에스겔 18장의 व्यक्तिगत 책임 원리
