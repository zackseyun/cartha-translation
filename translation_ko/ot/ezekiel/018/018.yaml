id: EZK.18.18
reference: Ezekiel 18:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָבִ֞י/ו כִּֽי עָ֣שַׁק עֹ֗שֶׁק גָּזַל֙ גֵּ֣זֶל אָ֔ח וַ/אֲשֶׁ֥ר לֹא ט֛וֹב עָשָׂ֖ה בְּ/ת֣וֹךְ עַמָּ֑י/ו וְ/הִנֵּה מֵ֖ת בַּ/עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/018.yaml
  text: As for his father[a], because he practiced extortion, robbed his brother, and did what was not good among his people, behold[d][c][b], he shall die in his iniquity.
  footnotes:
  - marker: a
    text: Or 'practiced oppression.' The Hebrew uses a verb-noun pairing for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'robbed a brother.' 'Brother' may be read generically for a fellow member of the community.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'behold,' an emphatic discourse marker.
    reason: lexical_alternative
  - marker: d
    text: Or 'he dies in his iniquity' or 'he is dead in his iniquity'; the Hebrew perfect presents the outcome as certain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아버지[a]가 왜냐하면[b] 착취를 행하고, 자기 형제[c]를 약탈하고, 자기 백성[d] 가운데서 좋지 않은 일을 했으므로, 보십시오, 그는 자기의 죄악 안에서 죽을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 아버지’는 문맥상 앞서 언급된 아버지를 되받는 말입니다.
    reason: source_note
  - marker: b
    text: 히브리어 כִּי를 여기서는 원인 관계를 나타내는 ‘왜냐하면’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘형제’는 문자적 혈연형제이면서도 공동체의 동료 구성원을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘자기 백성’은 공동체 내부를 가리키는 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: אָבִיו
  english_pob_choice: his father
  chosen_korean: 그의 아버지
  alternatives_korean:
  - 아버지
  - 그 아버지
  lexicon: HALOT
  rationale: 소유격 3인칭 남성 단수의 관계를 분명히 살리되, 문맥상 앞선 아버지를 가리키는 연결을 자연스럽게 유지했습니다.
- source_word: עָשַׁק עֹשֶׁק
  english_pob_choice: practiced extortion
  chosen_korean: 착취를 행하다
  alternatives_korean:
  - 압제를 행하다
  - 학대를 행하다
  - 착취를 저지르다
  lexicon: HALOT
  rationale: 동사-명사 어근 반복의 강한 강조를 한국어에서 가장 자연스럽게 살릴 수 있는 표현으로 옮겼습니다.
- source_word: גָּזַל גֵּזֶל אָח
  english_pob_choice: robbed his brother
  chosen_korean: 자기 형제를 약탈하다
  alternatives_korean:
  - 자기 형제를 강탈하다
  - 형제를 빼앗다
  - 한 형제를 약탈하다
  lexicon: HALOT
  rationale: אָח를 공동체의 동료 구성원까지 포함할 수 있는 관계어로 보아 ‘형제’로 옮기고, 약탈/강탈 계열로 폭력성과 착취성을 드러냈습니다.
- source_word: בְּתוֹךְ עַמָּיו
  english_pob_choice: among his people
  chosen_korean: 자기 백성 가운데서
  alternatives_korean:
  - 그의 백성 한가운데서
  - 자기 ժողովրդի 가운데서
  - 자기 백성 안에서
  lexicon: HALOT
  rationale: 공동체 내부에서 벌어진 행위라는 공간적·사회적 뉘앙스를 살리기 위해 ‘가운데서’를 선택했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보라,
  - 여기 보십시오
  lexicon: HALOT
  rationale: 예언적 담화 표지의 돌출성을 유지하면서도 현대 한국어 독자에게 자연스럽고 격식 있는 명령형으로 옮겼습니다.
- source_word: בַּעֲוֹנוֹ
  english_pob_choice: in his iniquity
  chosen_korean: 자기의 죄악 안에서
  alternatives_korean:
  - 자기의 죄악 가운데서
  - 자기의 죄악으로
  - 자기의 죄 가운데서
  lexicon: HALOT
  rationale: ‘in’의 상태/처지 뉘앙스를 살리기 위해 ‘안에서’를 유지했고, עָוֹן의 무게를 ‘죄악’으로 반영했습니다.
theological_decisions:
- issue: perfect form מֵת의 미래적 확정성
  chosen_reading: ‘죽을 것입니다’로 옮겨, 실제 시제보다 판결의 확정성을 드러냈습니다.
  alternative_readings:
  - 죽습니다
  - 죽었습니다
  rationale: 예언·법정적 문맥에서 완료형이 결과의 확실성을 표현하므로, 한국어에서는 미래로 처리해 선언의 확정성을 살렸습니다.
  doctrine_reference: 예언적 확정 표현은 서술 시제보다 판결 성격을 우선함
- issue: 보편적 개인 책임의 강조
  chosen_reading: 아버지의 죽음이 다른 사람의 죄가 아니라 자기 죄악의 결과임을 드러내는 구조를 유지했습니다.
  alternative_readings:
  - 일반적인 죄의 결과 진술로 약화
  - 가계적 책임을 암시하는 표현
  rationale: 18장 전체의 논지를 훼손하지 않도록 소유격·원인절·결과절을 그대로 살렸습니다.
  doctrine_reference: 에스겔 18장의 व्यक्तिगत 책임 원리
