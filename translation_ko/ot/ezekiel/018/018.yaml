source:
  edition: WLC
  text: אָבִ֞י/ו כִּֽי עָ֣שַׁק עֹ֗שֶׁק גָּזַל֙ גֵּ֣זֶל אָ֔ח וַ/אֲשֶׁ֥ר לֹא ט֛וֹב עָשָׂ֖ה בְּ/ת֣וֹךְ עַמָּ֑י/ו וְ/הִנֵּה מֵ֖ת בַּ/עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/018.yaml
  text: As for his father[a], because he practiced extortion, robbed his brother, and did what was not good among his people, behold[d][c][b], he shall die in his iniquity.
  footnotes:
  - marker: a
    text: Or 'practiced oppression.' The Hebrew uses a verb-noun pairing for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'robbed a brother.' 'Brother' may be read generically for a fellow member of the community.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'behold,' an emphatic discourse marker.
    reason: lexical_alternative
  - marker: d
    text: Or 'he dies in his iniquity' or 'he is dead in his iniquity'; the Hebrew perfect presents the outcome as certain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아버지[a]는 착취를 일삼고[b], 한 형제[c]를 약탈하며, 그의 백성[d] 가운데서 좋지 않은 일을 했으므로, 보십시오[e], 그는 자기 죄악 가운데서 죽을 것입니다[f].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 아버지’는 문맥상 앞서 언급된 아버지를 다시 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘착취하다’와 같은 어근의 명사를 함께 써서 행위의 강도를 강조합니다. 또는 ‘압제를 행하고’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘한 형제’는 혈연 형제일 수 있으며, 공동체의 동료 구성원을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘그의 백성 가운데서’는 그가 속한 공동체 내부에서라는 뜻입니다.
    reason: source_note
  - marker: e
    text: 히브리어 ‘보라’에 해당하는 강조의 담화 표지입니다.
    reason: lexical_alternative
  - marker: f
    text: 히브리어는 직역하면 ‘그는 자기 죄악 가운데서 죽었다/죽는다’가 될 수 있는 완료형입니다. 여기서는 예언적·사법적 결과의 확실성을 나타내므로 ‘죽을 것입니다’로 옮겼습니다.
    reason: lexical_alternative
