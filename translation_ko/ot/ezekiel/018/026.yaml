  text: בְּ/שׁוּב צַדִּ֧יק מִ/צִּדְקָת֛/וֹ וְ/עָ֥שָׂה עָ֖וֶל וּ/מֵ֣ת עֲלֵי/הֶ֑ם בְּ/עַוְל֥/וֹ אֲשֶׁר עָשָׂ֖ה יָמֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/026.yaml
  text: When a righteous man turns away from his righteousness and does injustice[a], and dies because of them[b], he shall die for the injustice that he has done.
  footnotes:
  - marker: a
    text: Or 'and does wrong' / 'and commits iniquity.' The Hebrew עָוֶל carries the sense of injustice, wrong, or unrighteousness.
    reason: lexical_alternative
  - marker: b
    text: '''Because of them'' refers to the wrongful acts just mentioned; the Hebrew uses a plural pronoun.'
    reason: lexical_alternative
translation:
  language: ko
  text: 의인이 자기의 의에서 돌이켜 불의를 행하고, 그러한 일들 때문에 죽으면, 그가 행한 불의 때문에 죽습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עָוֶל은 불의, 부정, 잘못의 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그러한 일들’은 히브리어의 복수 대명사를 반영하며, 문맥상 바로 앞에 언급된 잘못된 행위들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב צַדִּיק מִצִּדְקָתוֹ
  english_pob_choice: When a righteous man turns away from his righteousness
  chosen_korean: 의인이 자기의 의에서 돌이켜
  alternatives_korean:
  - 의인이 자기의 의에서 돌아서
  - 의인이 자기의 의로부터 돌아오면
  lexicon: HALOT
  rationale: ב + שוב의 시간/조건 절을 한국어에서 자연스럽게 「돌이켜」로 살렸고, מִצִּדְקָתוֹ는 개인의 윤리적 상태를 가리키므로 「자기의 의」가 가장 직접적입니다.
- source_word: וְעָשָׂה עָוֶל
  english_pob_choice: and does injustice
  chosen_korean: 불의를 행하고
  alternatives_korean:
  - 불의를 저지르고
  - 불의를 행하며
  lexicon: HALOT
  rationale: עָוֶל의 핵심 의미인 불의/부정을 한국어의 고정 결합인 「불의를 행하다」로 옮겨, 법적·윤리적 뉘앙스를 유지했습니다.
- source_word: וּמֵת עֲלֵיהֶם
  english_pob_choice: and dies because of them
  chosen_korean: 그들 때문에 죽으면
  alternatives_korean:
  - 그것들 때문에 죽으면
  - 그 일들 때문에 죽으면
  lexicon: HALOT
  rationale: 히브리어 복수 대명사는 바로 앞의 잘못된 행위들을 가리키므로, 영어 POB의 해설을 따라 복수를 살린 「그들」로 반영했습니다.
- source_word: בְּעַוְלוֹ אֲשֶׁר עָשָׂה יָמוּת
  english_pob_choice: he shall die for the injustice that he has done
  chosen_korean: 그가 행한 불의 때문에 반드시 죽습니다
  alternatives_korean:
  - 그가 행한 불의로 인해 반드시 죽습니다
  - 그가 저지른 불의 때문에 반드시 죽습니다
  lexicon: HALOT
  rationale: 문장의 결론을 인과적으로 분명히 하면서도 המשפט적/선언적 강도를 살리기 위해 「반드시 죽습니다」로 옮겼고, עַוְלֹו는 앞의 「불의」와 일관되게 처리했습니다.
theological_decisions:
- issue: 의인이 돌이킨다는 표현이 구원의 최종 상태를 단정하는지 여부
  chosen_reading: 본문이 말하는 도덕적·언약적 경고를 그대로 옮기고, 더 넓은 교리 논쟁은 번역에서 해결하지 않았습니다.
  alternative_readings:
  - 최종적인 배교를 암시하는 읽기
  - 실제적 전락을 약화시키는 읽기
  rationale: 히브리어는 의인이 의에서 돌이켜 불의를 행하고 그 결과 죽는다는 경고를 직접 진술할 뿐이므로, 본문 이상의 체계신학적 결론을 번역에 주입하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
