  text: וְ/הִנֵּה֙ הוֹלִ֣יד בֵּ֔ן וַ/יַּ֕רְא אֶת כָּל חַטֹּ֥את אָבִ֖י/ו אֲשֶׁ֣ר עָשָׂ֑ה וַ/יִּרְאֶ֕ה וְ/לֹ֥א יַעֲשֶׂ֖ה כָּ/הֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/014.yaml
  text: But behold[a], he fathers a son, and he sees all the sins that his father has done; he sees them[b], and he does not do likewise.
  footnotes:
  - marker: a
    text: Or, 'he begets a son.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew repeats ''he sees'' for emphasis: ''he sees ... he sees, and does not do likewise.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 보십시오[a], 그가 아들을 낳고 자기 아버지가 행한 모든 죄를 보게 됩니다. 그는 그것들을 보면서[b]도, 그와 같이 하지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 아들을 낳습니다.’
    reason: lexical_alternative
  - marker: b
    text: '히브리어는 ‘보다’를 반복하여 강조합니다: ‘그는 … 그는 보면서, 그와 같이 하지 않습니다.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: But behold
  chosen_korean: 그러나 보십시오
  alternatives_korean:
  - 보십시오
  - 그런데 보십시오
  - 그러나 보라
  lexicon: HALOT
  rationale: 새 장면으로 전환하는 감탄적 표지를 살리면서, 앞 절과의 대비를 ‘그러나’로 반영했습니다. ‘보십시오’는 현대 합쇼체에서 자연스럽고, 예언적·논증적 주의를 환기합니다.
- source_word: הוֹלִיד בֵּן
  english_pob_choice: he fathers a son
  chosen_korean: 그가 아들을 낳고
  alternatives_korean:
  - 그가 아들을 두고
  - 그가 아들을 갖고
  - 그가 아들을 생기게 하고
  lexicon: HALOT
  rationale: 히필 ילד의 생성/생육 의미를 따라 ‘낳다’로 옮겼습니다. ‘아들을 두다’는 의미를 약화시키고, ‘낳다’가 원문의 생식적 행위를 더 직접적으로 드러냅니다.
- source_word: וַיַּרְא ... וַיִּרְאֶה
  english_pob_choice: he sees ... he sees
  chosen_korean: 보게 됩니다 … 그는 그것들을 보면서
  alternatives_korean:
  - 보고 … 보고
  - 보며 … 보며
  - 살펴보고 … 살펴봅니다
  lexicon: HALOT
  rationale: 히브리어의 반복된 ‘보다’를 한국어에서도 두 번 드러내어 강조를 살렸습니다. 첫 번째는 목적절로, 두 번째는 동작의 지속성과 반복을 살리는 표현으로 처리했습니다.
- source_word: כָּל חַטֹּאת אָבִיו אֲשֶׁר עָשָׂה
  english_pob_choice: all the sins that his father has done
  chosen_korean: 자기 아버지가 행한 모든 죄
  alternatives_korean:
  - 아버지가 지은 모든 죄
  - 아버지가 저지른 모든 죄
  - 그 아버지의 모든 죄
  lexicon: HALOT
  rationale: חַטֹּאת의 구체적 행위성을 따라 ‘죄’로 옮기고, ‘행한’을 붙여 단순한 상태가 아니라 실제로 저지른 행위를 나타냈습니다. ‘자기 아버지’는 소유 관계를 분명히 합니다.
- source_word: וְלֹא יַעֲשֶׂה כָּהֵן
  english_pob_choice: and he does not do likewise
  chosen_korean: 그와 같이 하지 않습니다
  alternatives_korean:
  - 그렇게 하지 않습니다
  - 같은 짓을 하지 않습니다
  - 그처럼 행하지 않습니다
  lexicon: HALOT
  rationale: כָּהֵן의 비교 의미를 자연스럽게 살려 ‘그와 같이’로 옮겼습니다. 직역보다 한국어 문맥에서 무리 없는 비교구를 택해 대조를 분명히 했습니다.
theological_decisions:
- issue: 반복된 ‘보다’ 동사의 기능
  chosen_reading: 아들은 아버지의 죄를 분명히 인식하고도 그것을 따르지 않습니다.
  alternative_readings:
  - 단순 목격에 그칠 수 있습니다
  - 인지 여부는 강조되지 않습니다
  rationale: 문맥상 에스겔 18장의 논지는 개인의 행위 책임이므로, 반복된 ‘보다’를 도덕적 분별과 거부의 대비로 살렸습니다. 다만 본문이 반복 자체를 통해 강조하는 범위를 넘지 않도록 ‘인식하고도’ 같은 해석어는 본문에 직접 넣지 않았습니다.
  doctrine_reference: Ezekiel 18의 개인 책임 강조
