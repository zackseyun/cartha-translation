  naturalness: ‘그가 아들을 낳고’는 남성 주어와 함께 다소 부자연스러울 수 있으므로, 현대 한국어에서 자연스러운 ‘아들을 두었는데’를 사용했습니다. 주어를 ‘그 아들’로 명시하여 지시 관계를 분명히 했고, 반복 동사는 ‘봅니다 … 보고도’로 자연스럽게 유지했습니다.
