source:
  edition: WLC
  text: כִּ֣י לֹ֤א אֶחְפֹּץ֙ בְּ/מ֣וֹת הַ/מֵּ֔ת נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה וְ/הָשִׁ֖יבוּ וִֽ/חְיֽוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/032.yaml
  text: For I take no pleasure in the death of the one who dies[a], declares the Lord GOD[c][b]. Therefore turn back and live.
  footnotes:
  - marker: a
    text: Or 'I do not desire the death of the dying one.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Lord GOD' represents אֲדֹנָי יְהוִה; alternatively, 'the Lord Yahweh.'
    reason: alternative_reading
  - marker: c
    text: Or 'return and live.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 죽는 사람[a]의 죽음을 기뻐하지 않습니다. 주 야훼[b]의 말씀입니다. 그러므로 돌이켜[c] 사십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “죽어 가는 사람”으로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 אֲדֹנָי יְהוִה는 “주 야훼”에 해당합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 “돌아와서 사십시오”로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אֶחְפֹּץ
  english_pob_choice: I take no pleasure
  chosen_korean: 기뻐하지 않습니다
  alternatives_korean:
  - 원하지 않습니다
  - 즐거워하지 않습니다
  lexicon: HALOT
  rationale: חפץ는 단순한 의지보다 기쁨·즐거움의 뉘앙스를 가지므로, 하나님의 태도를 자연스럽게 드러내는 ‘기뻐하지 않습니다’로 옮겼습니다.
- source_word: בְּמוֹת הַמֵּת
  english_pob_choice: in the death of the one who dies
  chosen_korean: 죽는 자의 죽음
  alternatives_korean:
  - 죽는 사람의 죽음
  - 죽어 가는 자의 죽음
  lexicon: HALOT
  rationale: 히브리어의 반복 표현을 한국어에서도 간결하게 살려, 죽음 자체와 그 대상의 연결을 유지했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  lexicon: HALOT
  rationale: 합쇼체 문맥에서 예언자적 선언 화행을 자연스럽게 전달하면서도, אֲדֹנָי와 יְהוִה의 결합을 ‘주 하나님’으로 반영했습니다.
- source_word: וְהָשִׁיבוּ וִחְיוּ
  english_pob_choice: Therefore turn back and live
  chosen_korean: 그러므로 돌이켜서 살아가십시오
  alternatives_korean:
  - 그러므로 돌아서서 사십시오
  - 그러므로 회개하고 살아가십시오
  lexicon: HALOT
  rationale: שוב의 기본 이미지를 따라 ‘돌이키다’를 사용했고, 생존을 넘어 지속적인 삶의 초대를 살려 ‘살아가십시오’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 의도와 죽음의 관계
  chosen_reading: 나는 죽는 자의 죽음을 기뻐하지 않습니다
  alternative_readings:
  - 나는 죽는 자의 죽음을 원하지 않습니다
  - 나는 죽는 자의 죽음에 즐거워하지 않습니다
  rationale: 본문은 하나님이 죽음 자체를 기뻐하지 않으신다고 말하며, 심판 경고 속에서도 회복의 초대를 드러냅니다. 한국어에서는 ‘기뻐하지 않습니다’가 그 긴장을 가장 직접적으로 보존합니다.
  doctrine_reference: 원문 우선 번역 원칙; 심판과 회복의 긴장 유지
- issue: 명령문의 문체
  chosen_reading: 그러므로 돌이켜서 살아가십시오
  alternative_readings:
  - 그러므로 돌아오십시오 그리고 사십시오
  - 그러므로 회개하십시오 그리고 살아가십시오
  rationale: 예언적 권면이므로 청자에게 직접 호소하는 명령형을 유지했습니다. ‘회개하다’는 신학적으로 맞닿지만, כאן의 שוב는 우선 ‘돌이키다/돌아오다’의 물리적·관계적 이미지를 보존하는 것이 더 직접적입니다.
  doctrine_reference: 예언서의 청중 지향적 호소; שוב의 기본 의미 보존
