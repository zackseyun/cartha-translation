source:
  edition: WLC
  text: הֶ/חָפֹ֤ץ אֶחְפֹּץ֙ מ֣וֹת רָשָׁ֔ע נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה הֲ/ל֛וֹא בְּ/שׁוּב֥/וֹ מִ/דְּרָכָ֖י/ו וְ/חָיָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/023.yaml
  text: Do I take any pleasure at all in the death of the wicked? declares the Lord GOD[c][b][a]. Is it not rather in his turning from his ways and living?
  footnotes:
  - marker: a
    text: Or 'Do I indeed delight in the death of the wicked?' The Hebrew verb can express pleasure, delight, or desire.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'declares the Lord GOD' (אֲדֹנָי יְהוִה). The divine name יְהוָה is normally rendered 'the LORD'; in this compound title English convention uses 'GOD' to avoid 'Lord LORD.'
    reason: lexical_alternative
  - marker: c
    text: Or 'when he turns from his ways and lives.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 악인의 죽음을 조금이라도 기뻐하겠습니까? 주 야훼의 말씀입니다. 오히려 그가 자기 길에서 돌이켜 사는 것을 기뻐하는 것이 아니겠습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 정말 악인의 죽음을 기뻐하겠습니까?’ 히브리어 동사는 기쁨, 즐거움 또는 원함을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘주 야훼의 말씀’(אֲדֹנָי יְהוִה). 이 합성 칭호는 ‘주’와 신적 이름 יְהוָה를 함께 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그가 자기 길에서 돌이켜 살 때에’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחָפֹץ אֶחְפֹּץ
  english_pob_choice: Do I take any pleasure at all
  chosen_korean: 내가 어찌하여 ... 조금이라도 기뻐하겠느냐
  alternatives_korean:
  - 내가 정말 기뻐하겠느냐
  - 내가 과연 즐거워하겠느냐
  lexicon: HALOT
  rationale: 히브리어의 강조형 질문을 한국어의 수사적 반문으로 살려, 하나님의 감정적·의지적 거부를 동시에 드러내도록 했습니다.
- source_word: מוֹת רָשָׁע
  english_pob_choice: the death of the wicked
  chosen_korean: 악인의 죽음
  alternatives_korean:
  - 악한 사람의 죽음
  - 악한 자의 죽음
  lexicon: HALOT
  rationale: 명사구를 간결하게 유지해 원문의 일반적·대표적 의미를 살리고, '악인'으로 관용적 성격을 보존했습니다.
- source_word: בְּשׁוּבוֹ מִדְּרָכָיו
  english_pob_choice: in his turning from his ways
  chosen_korean: 자기 길에서 돌이켜
  alternatives_korean:
  - 자기 길에서 돌아서
  - 자기 행실에서 돌이켜
  lexicon: HALOT
  rationale: '''길들''은 히브리어의 삶의 방식 비유를 잘 반영하므로 그대로 살렸고, ''돌이켜''로 회개와 방향 전환의 동작을 표현했습니다.'
- source_word: וְחָיָה
  english_pob_choice: and living
  chosen_korean: 살아가는 것이 아니겠느냐
  alternatives_korean:
  - 살지 않겠느냐
  - 살게 되는 것이 아니겠느냐
  lexicon: HALOT
  rationale: 수사적 기대를 자연스럽게 드러내기 위해 현재적 지속을 느끼게 하는 '살아가는 것'을 택했으며, 히브리어의 단순한 결과 진술을 과도하게 목적화하지 않았습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 원문의 합성 칭호를 살리면서 프로젝트 기본값에 따라 יהוה를 '야훼'로 옮겼고, '주'를 더해 '주 야훼'로 처리했습니다.
theological_decisions:
- issue: '하나님의 태도: 악인의 죽음에 대한 기쁨 여부'
  chosen_reading: 본문의 수사적 반문을 따라 하나님이 악인의 죽음을 기뻐하지 않으심을 분명히 하되, 회개와 생명의 길을 대조로 제시했습니다.
  alternative_readings:
  - 하나님이 악인의 죽음을 원하지 않으심
  - 하나님이 악인의 죽음에 즐거움을 느끼지 않으심
  rationale: חפץ는 기쁨·즐거움·원함을 모두 아우를 수 있으므로, 한국어에서는 '기뻐하다'를 써서 정서적·의지적 뉘앙스를 함께 남겼습니다.
  doctrine_reference: 심판과 자비의 긴장을 해소하지 않고 본문 자체에 맡김
