  source_fidelity: 첫 반문에 있는 히브리어 강조형(הֶחָפֹץ אֶחְפֹּץ)은 ‘조금이라도’로 잘 반영되어 있습니다. 그러나 ‘어찌하여’는 원문에 없는 이유·원인 질문을 더하므로 삭제하는 편이 정확합니다. 둘째 절의 וְחָיָה는 지속성을 특별히 나타내지 않으므로 ‘살아가다’보다 ‘살다’가 더 충실합니다.
  naturalness: 현 초안의 ‘-느냐’와 ‘말씀이니라’는 요청된 현대 합쇼체와 일치하지 않습니다. ‘-겠습니까?’ 및 ‘말씀입니다’로 고치면 현대적이고 공적인 존대 문체가 됩니다. ‘주 야훼’는 현대 한국어에서 다소 어색한 칭호 결합이나, 원문의 두 요소를 보존하는 번역으로는 가능합니다.
  terminology: ‘악인’, ‘죽음’, ‘자기 길’, ‘돌이키다’는 원문의 어휘와 비유를 적절히 보존합니다. אֲדֹנָי יְהוִה는 ‘주 야훼’로 유지하되, 현 각주의 ‘주 LORD’는 한국어 각주 안에서 부자연스럽고 번역 선택의 설명도 부정확하므로 고칩니다.
