  source_fidelity: 수정이 필요합니다. 초안의 ‘가난한 자에게 손을 내밀지 아니하고’는 손을 돌이키거나 거두는 원문의 관용구와 반대 방향의 행위로 읽힐 수 있습니다. ‘가난한 사람에게서 손을 거두다’로 고쳐 원문의 비유를 보존하고, 주석에서 착취·해를 삼간다는 문맥적 뜻을 밝혔습니다. 나머지 핵심 내용, 곧 대부 이득을 받지 않음, 하나님의 משפט과 חקה를 준수함, 아버지의 죄악 때문에 죽지 않음, 그리고 강조된 ‘반드시 살 것’은 충실하게 반영됩니다.
  naturalness: 수정문은 현대 표준어의 격식 있는 합쇼체로 자연스럽게 다듬었습니다. 원문의 반복적 연결을 무리하게 한 문장에 누적하지 않고 두 문장으로 나누었으며, 각주 표지를 해당 표현 바로 뒤에 배치했습니다.
