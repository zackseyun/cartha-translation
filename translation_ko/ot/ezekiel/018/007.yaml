  text: 그는 아무도 압제하지 않고, 빚 때문에 잡아 둔 담보를 돌려주며[a], 강탈을 하지 않고, 배고픈 사람에게 자기 빵을 주며[b], 벌거벗은 사람을 옷으로 덮어 줍니다[c].
