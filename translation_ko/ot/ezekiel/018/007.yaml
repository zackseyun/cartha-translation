translation:
  language: ko
  text: 그는 아무도 압제하지 않고, 빚 때문에 잡아 둔 담보를 돌려주며, 탈취하지 않고, 배고픈 사람에게 자기 빵을 주며, 벌거벗은 사람을 옷으로 덮어 줍니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빚 때문에 잡아 두었던 담보를 돌려준다’ 혹은 ‘채무자에게 담보물을 돌려준다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘자기 빵’입니다. 곧 자기 음식이라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘벌거벗은 사람에게 옷을 입혀 준다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹנֶה
  english_pob_choice: oppress
  chosen_korean: 압제하지 않고
  alternatives_korean:
  - 학대하지 않고
  - 착취하지 않고
  - 억압하지 않고
  lexicon: HALOT
  rationale: 히필형 동사 ינה는 부당하게 누르거나 착취하는 뜻이므로, 사회·경제적 해악을 드러내는 ‘압제하다’가 가장 직접적입니다.
- source_word: אִישׁ
  english_pob_choice: anyone
  chosen_korean: 아무도
  alternatives_korean:
  - 사람을
  - 어떤 사람도
  - 누구도
  lexicon: HALOT
  rationale: 형식상 단수 남성형이지만 여기서는 일반적인 윤리 진술이므로, 자연스러운 한국어로 포괄성을 나타내는 ‘아무도’가 적절합니다.
- source_word: חֲבֹלָתוֹ חוֹב יָשִׁיב
  english_pob_choice: restores the debtor’s pledge
  chosen_korean: 빚 때문에 잡아 둔 담보를 돌려주며
  alternatives_korean:
  - 채무자의 담보물을 되돌려주며
  - 빚 보증으로 잡은 물건을 돌려주며
  - 빚으로 잡아 둔 저당물을 돌려주며
  lexicon: HALOT
  rationale: 이 표현은 채무의 담보로 잡은 물건을 돌려준다는 뜻이므로, ‘담보’를 쓰되 ‘빚 때문에 잡아 둔’으로 채무 상황을 분명히 했습니다.
- source_word: לַחְמוֹ
  english_pob_choice: his bread
  chosen_korean: 자기 빵
  alternatives_korean:
  - 자기 음식
  - 그의 빵
  - 자기 양식
  lexicon: HALOT
  rationale: 히브리어의 ‘빵’은 실제 음식 전체를 가리킬 수 있지만, 원문 이미지를 살리기 위해 직역에 가까운 ‘자기 빵’을 택했습니다.
