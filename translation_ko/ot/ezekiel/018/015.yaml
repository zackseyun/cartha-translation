id: EZK.18.15
reference: Ezekiel 18:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל הֶֽ/הָרִים֙ לֹ֣א אָכָ֔ל וְ/עֵינָי/ו֙ לֹ֣א נָשָׂ֔א אֶל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ לֹ֥א טִמֵּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/015.yaml
  text: He has not eaten on the mountains[a], nor lifted up his eyes to the idols of the house of Israel[b]; he has not defiled his neighbor’s wife.
  footnotes:
  - marker: a
    text: Or, more explicitly, “has not eaten at the mountain shrines,” referring to participation in idolatrous worship.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term for “idols” is contemptuous and may carry the sense of “filthy idols.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 산들에서 먹지 않았고[a], 이스라엘 집의 우상들[b]을 향하여 눈을 들어보지도 않았으며, 자기 이웃의 아내를 더럽히지도 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 풀어 쓰면 “산당에서 먹지 않았다”는 뜻으로, 우상숭배 제의에 참여한 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘우상들’은 멸시적 표현으로, ‘더러운 우상들’에 가까운 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הֶֽ/הָרִים֙ לֹ֣א אָכָ֔ל
  english_pob_choice: has not eaten on the mountains
  chosen_korean: 산들에서 먹지 않았고
  alternatives_korean:
  - 산 위에서 먹지 않았고
  - 산당에서 먹지 않았고
  lexicon: HALOT
  rationale: 히브리어 관용구를 너무 풀지 않고 살리되, 한국어에서는 ‘산들에서’보다 ‘산 위에서’가 자연스럽지만 원문의 고지대/산당 뉘앙스를 열어 두기 위해 비교적 직역형으로 두었습니다.
- source_word: וְעֵינָיו לֹא נָשָׂא אֶל
  english_pob_choice: nor lifted up his eyes to
  chosen_korean: 눈을 들어보지도 않았으며
  alternatives_korean:
  - 눈을 들어보지 않았으며
  - 바라보지 않았으며
  lexicon: HALOT
  rationale: ‘눈을 들다’라는 히브리어 관용을 유지하면서도 한국어 문장으로 자연스럽게 들리도록 ‘들어보다’로 옮겼습니다.
- source_word: גִּלּוּלֵי בֵּית יִשְׂרָאֵל
  english_pob_choice: the idols of the house of Israel
  chosen_korean: 이스라엘 집의 우상들
  alternatives_korean:
  - 이스라엘 집의 우상들
  - 이스라엘 집의 더러운 우상들
  lexicon: HALOT
  rationale: ‘집 of Israel’의 언약적 표현을 살리기 위해 ‘이스라엘 집’으로 옮겼고, 경멸적 뉘앙스는 본문 외 해설로 남기고 기본어 ‘우상들’을 사용했습니다.
- source_word: אֵשֶׁת רֵעֵהוּ לֹא טִמֵּא
  english_pob_choice: he has not defiled his neighbor’s wife
  chosen_korean: 자기 이웃의 아내를 더럽히지도 않았습니다
  alternatives_korean:
  - 자기 이웃의 아내를 더럽히지도 않았습니다
  - 자기 이웃의 아내를 부정하게 하지도 않았습니다
  lexicon: HALOT
  rationale: 성적 불결과 의례적 오염을 함께 띠는 טמא의 무게를 살리기 위해 ‘더럽히다’를 택했고, ‘부정하게 하다’는 다소 설명적이라 대안으로 두었습니다.
theological_decisions:
- issue: 산에서 먹는 행위의 의미
  chosen_reading: 단순한 식사가 아니라 산당적 우상숭배에 참여하는 행위라는 문맥을 유지하기 위해 직역형을 살렸습니다.
  alternative_readings:
  - ‘산당에서 먹지 않았고’처럼 의미를 풀어 쓴 번역
  - 일반적 지리 표현으로만 읽는 번역
  rationale: 에스겔에서는 ‘산들에서 먹다’가 우상 제의와 결부된 상투적 표현이므로, 본문의 이미지와 비난의 강도를 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 우상숭배 비판과 언약적 순결
- issue: 성적 죄를 ‘더럽힘’으로 표현하는 문제
  chosen_reading: ‘자기 이웃의 아내를 더럽히지도 않았습니다’로 옮겨 간음이 가져오는 도덕적·의례적 오염을 함께 드러냈습니다.
  alternative_readings:
  - ‘간음하지도 않았습니다’로 도덕 행위만 직접 표기
  - ‘위반하지도 않았습니다’로 행위성을 중화한 번역
  rationale: 히브리어는 단순한 법적 위반보다 ‘부정하게 함’의 범주를 강조하므로, 이를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 성 윤리와 언약적 정결
