id: EZK.18.29
reference: Ezekiel 18:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָֽמְרוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י הַ/דְּרָכַ֞/י לֹ֤א יִתָּֽכְנּוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל הֲ/לֹ֥א דַרְכֵי/כֶ֖ם לֹ֥א יִתָּכֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/029.yaml
  text: Yet the house of Israel says[a], ‘The way of the Lord is not just.’ Are my ways not just, O house of Israel? Is it not your ways that are not just?
  footnotes:
  - marker: a
    text: Or 'The way of the Lord is not right' or 'is not fair.' The Hebrew verb concerns what is measured or ordered rightly; here it refers to moral rectitude in the Lord's dealings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 이스라엘 족속은 말합니다[a]. “주님의 길은 옳지 않습니다.” 이스라엘 족속아, 내 길이 옳지 않으냐? 옳지 않은 것은 너희 길이 아니냐?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 길은 바르지 않습니다’ 또는 ‘공정하지 않습니다’. 히브리어 동사는 어떤 것이 올바르게 측정되거나 질서 있게 정해지는 것을 가리키며, 여기서는 주님께서 행하시는 일이 도덕적으로 바른지를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  english_pob_choice: Yet ... says
  chosen_korean: 그런데 ... 말합니다
  alternatives_korean:
  - 그리고 ... 말합니다
  - 그러나 ... 말합니다
  lexicon: WLC/문맥
  rationale: 앞 문맥의 반박에 이어지는 대조적 흐름을 살려 ‘그런데’로 옮겼고, 회중이 계속 주장하는 현재형 발화를 한국어 자연스러운 직접화법으로 처리했습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘의 집
  - 이스라엘
  lexicon: HALOT
  rationale: 공동체 전체를 가리키는 ‘집’을 보존해 언약적·집단적 뉘앙스를 유지했습니다.
- source_word: לֹא יִתָּכֵן
  english_pob_choice: is not just
  chosen_korean: 옳지 않습니다
  alternatives_korean:
  - 바르지 않습니다
  - 정당하지 않습니다
  - 공정하지 않습니다
  lexicon: HALOT
  rationale: 문맥상 하나님의 행하심에 대한 도덕적 판정을 나타내므로, ‘just’를 너무 추상적인 ‘의롭다’보다 일상적이면서도 규범성을 살리는 ‘옳다’ 계열로 옮겼습니다. 부정형으로는 원문의 비난을 직접 반영했습니다.
- source_word: דֶּרֶךְ / הַדְּרָכַי / דַרְכֵיכֶם
  english_pob_choice: way / my ways / your ways
  chosen_korean: 길 / 내 길들 / 너희 길들
  alternatives_korean:
  - 길 / 내 방식들 / 너희 방식들
  - 길 / 내 행실들 / 너희 행실들
  lexicon: HALOT
  rationale: 같은 어휘의 반복과 대조를 살리기 위해 ‘길’을 유지했고, 복수형은 한국어에서도 반복성과 대비가 드러나도록 ‘길들’로 옮겼습니다.
theological_decisions:
- issue: 주님의 길에 대한 도덕 평가 표현
  chosen_reading: ‘옳다/옳지 않다’로 일관되게 번역했습니다.
  alternative_readings:
  - ‘정당하다/정당하지 않다’
  - ‘공정하다/공정하지 않다’
  rationale: 이 절은 여호와의 처우가 도덕적으로 바르고 균형 잡혔는지에 대한 논쟁이므로, 법정적·윤리적 힘을 함께 담는 ‘옳다’가 가장 자연스럽습니다. ‘공정하다’는 현대적 감정 공평성에 기울 수 있어 피했습니다.
  doctrine_reference: Translation philosophy §5 (핵심 용어 일관성)
