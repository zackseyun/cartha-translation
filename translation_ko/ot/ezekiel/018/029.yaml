revisions:
- from: 그런데 이스라엘 집은 말합니다[a]. 「주님의 길은 옳지 않습니다.」 이스라엘 집아, 내 길들이 옳지 않으냐? 옳지 않은 것은 너희 길들이 아니냐?
  to: 그런데 이스라엘 족속은 말합니다[a]. “주님의 길은 옳지 않습니다.” 이스라엘 족속아, 내 길이 옳지 않으냐? 옳지 않은 것은 너희 길이 아니냐?
  rationale: 집단 호칭을 자연스러운 한국어 성경 문체인 ‘이스라엘 족속’으로 바꾸고, 한국어에서 부자연스러운 복수 표지 ‘길들’을 제거했습니다. 이는 히브리어의 반복과 대조를 유지하면서도 현대 표준어의 자연스러움을 높입니다. 각주도 원문의 의미 범위를 더 정확하고 자연스럽게 표현하도록 다듬었습니다.
