  text: 그는 내 규례를 따라 행하고 내 법도를 지켜 진실하게 행합니다[a]. 그는 의로운 사람입니다. 그는 반드시 살 것입니다. 주 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
