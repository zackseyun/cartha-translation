source:
  edition: WLC
  text: בְּ/חֻקּוֹתַ֧/י יְהַלֵּ֛ךְ וּ/מִשְׁפָּטַ֥/י שָׁמַ֖ר לַ/עֲשׂ֣וֹת אֱמֶ֑ת צַדִּ֥יק הוּא֙ חָיֹ֣ה יִֽחְיֶ֔ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/009.yaml
  text: He walks in my statutes and keeps my judgments[a], acting faithfully; he is righteous; he shall surely live, declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'to do truth,' that is, to act with truthfulness or faithfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 내 규례들 안에서 행하며 내 규례들을 지켜 진실을 행합니다[a]. 그는 의롭습니다. 그는 반드시 살 것입니다. 주 야훼의 말씀이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진실을 행하여,’ 곧 참되게 또는 신실하게 행하여.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֻקּוֹתַי
  english_pob_choice: in my statutes
  chosen_korean: 내 규례들 안에서
  alternatives_korean:
  - 내 법도들 안에서
  - 내 율례들 안에서
  lexicon: HALOT
  rationale: חֻקּוֹת은 정해진 규례·법도를 뜻하므로, 한국어에서는 문맥의 언약적 법규 느낌을 살려 ‘규례들’로 옮겼습니다.
- source_word: יְהַלֵּךְ
  english_pob_choice: walks
  chosen_korean: 행하며
  alternatives_korean:
  - 걷고
  - 삶을 살며
  lexicon: HALOT
  rationale: הלך의 관용적 용법은 삶의 방식 전체를 가리키므로, 한국어에서는 자연스러운 행위 진행형인 ‘행하며’로 옮겨 행실의 지속성을 살렸습니다.
- source_word: לַעֲשׂוֹת אֱמֶת
  english_pob_choice: acting faithfully
  chosen_korean: 진실을 행합니다
  alternatives_korean:
  - 신실하게 행합니다
  - 진리를 행합니다
  - 성실하게 행합니다
  lexicon: HALOT
  rationale: אֱמֶת은 여기서 단순한 ‘진리’보다 신실함·참됨의 실천을 가리키므로, 영어 주석의 긴장을 살려 직역적이면서도 한국어로는 ‘진실을 행하다’로 표현했습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 야훼의 말씀
  alternatives_korean:
  - 주 야훼께서 말씀하십니다
  - 주 하나님 야훼의 말씀
  - 주 여호와의 말씀
  lexicon: HALOT
  rationale: אֲדֹנָי יְהוִה는 주권적 선언 공식을 이루므로, 본문 전통에 맞춰 하나님의 이름은 ‘야훼’로, 선언 형식은 ‘말씀’으로 옮겨 장엄한 어조를 유지했습니다.
theological_decisions:
- issue: 야훼의 호칭과 문장 종결의 경어 수준
  chosen_reading: 본문 서술은 합쇼체로 유지하되, 마지막 선언 공식은 ‘주 야훼의 말씀입니다’로 옮겨 예언적 종결의 공적·권위적 어조를 살렸습니다.
  alternative_readings:
  - 주 야훼께서 말씀하십니다
  - 주 야훼의 말씀이십니다
  rationale: 예언문 말미의 נְאֻם 공식은 단순 설명보다 선언적 종결을 요구하므로, 한국어에서도 문체를 약화하지 않으면서 공적 진술의 느낌을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
