  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חַי אָ֕נִי נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה אִם יִֽהְיֶ֨ה לָ/כֶ֜ם ע֗וֹד מְשֹׁ֛ל הַ/מָּשָׁ֥ל הַ/זֶּ֖ה בְּ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/003.yaml
  text: As I live[a], declares the Lord GOD[b], this proverb shall no longer be used by you in Israel.
  footnotes:
  - marker: a
    text: 'Hebrew oath idiom: ''If this proverb shall still be for you in Israel,'' with the sense ''Surely this proverb shall no longer be used by you in Israel.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'quoted' or 'spoken'; the Hebrew verb refers to employing a proverb or proverbial saying.
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 살아 있듯이”— 주 야훼의 말씀입니다— 이스라엘에서 너희는 다시는 이 속담을 쓰지 못할 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 맹세 관용구로, 문자적으로는 ‘이 속담이 여전히 너희에게 있을 것이다’라는 형식이지만 뜻은 ‘이 속담은 더 이상 너희에게 쓰이지 않을 것이다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 속담을 ‘말하다’ 또는 ‘사용하다’는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָ֕נִי
  english_pob_choice: As I live
  chosen_korean: “내가 살아 있듯이”
  alternatives_korean:
  - “내가 살아 있는 한”
  - “나의 생명으로 맹세하노라”
  lexicon: HALOT
  rationale: 히브리어의 맹세 관용구를 직역하기보다, 한국어에서 동일한 엄숙한 서두로 들리도록 ‘내가 살아 있듯이’로 옮겨 원문의 맹세 기능을 보존했습니다.
- source_word: נְאֻ֖ם
  english_pob_choice: declares
  chosen_korean: 주 야훼의 말씀입니다
  alternatives_korean:
  - 주 야훼께서 선포하십니다
  - 주 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언적 선포 공식이므로 서술형 ‘말씀입니다’로 처리해 한국어 본문에서 자연스럽고 권위 있는 선언으로 들리게 했습니다.
- source_word: אֲדֹנָ֣/י יְהוִ֑ה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 합성 신칭을 한국어에서 중복된 ‘주 주님’ 식으로 만들지 않고, 본문에서 야훼를 직접 드러내는 공용 표기를 택했습니다.
- source_word: עוֹד מְשֹׁ֛ל הַ/מָּשָׁ֥ל הַ/זֶּה
  english_pob_choice: this proverb shall no longer be used
  chosen_korean: 이 속담을 쓰지 못할 것입니다
  alternatives_korean:
  - 이 속담을 더 이상 사용하지 못할 것입니다
  - 이 비유를 더 이상 말하지 못할 것입니다
  lexicon: HALOT
  rationale: מָשָׁל을 이 문맥의 민간 속담으로 이해해 ‘속담’으로 옮겼고, מְשֹׁל의 ‘사용/말하기’ 기능은 한국어의 ‘쓰다’로 자연스럽게 반영했습니다.
- source_word: בְּיִשְׂרָאֵל
  english_pob_choice: in Israel
  chosen_korean: 이스라엘에서
  alternatives_korean:
  - 이스라엘 가운데서
  - 이스라엘 안에서
  lexicon: HALOT
  rationale: 문맥상 속담의 유통 장소를 나타내므로 가장 간결한 장소 부사로 옮겼습니다.
theological_decisions:
- issue: יהוה를 한국어에서 어떻게 드러낼지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본 프로젝트 기본어휘에 따라 언약적 신명 יהוה를 ‘야훼’로 유지해, 원문이 가진 고유한 신명성을 흐리지 않도록 했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
