  verdict: revise
  source_fidelity: 대체로 원문에 충실합니다. נֶשֶׁךְ와 תַרְבִּית의 병렬을 ‘이자’와 ‘이익’으로 구별했고, מֵעָוֶל יָשִׁיב יָדוֹ의 절제 관용구도 보존했습니다. 다만 מִשְׁפַּט אֱמֶת는 이 문맥에서 특히 당사자들 사이에 행하는 참된/진실한 판결을 가리키므로, ‘참된 정의를 행합니다’보다 ‘참된 판결을 내립니다’가 법적 의미를 더 직접적으로 드러냅니다.
  naturalness: ‘불의에서 손을 거두어 둡니다’는 ‘-어 두다’가 지속적 보관의 뉘앙스를 더하여 다소 부자연스럽습니다. ‘불의에서 손을 거두며’가 현대 표준 한국어로 자연스럽고 원문의 관용적 비유도 유지합니다. 각주 표지도 해당 표현 바로 뒤에 두는 편이 독자에게 명확합니다.
  terminology: ‘이자를 붙여 빌려주다’는 대출 이자를 명확히 나타냅니다. תַרְבִּית의 ‘이익’은 첫 용어와의 구별을 유지하되, 본문 병렬상 대출에서 얻는 증가분이라는 문맥을 가집니다. משפט אמת는 교리적 용어를 덧붙이지 않고 ‘참된 판결’로 옮겼습니다.
