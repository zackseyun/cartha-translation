  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/נֶּ֣שֶׁךְ לֹֽא יִתֵּ֗ן וְ/תַרְבִּית֙ לֹ֣א יִקָּ֔ח מֵ/עָ֖וֶל יָשִׁ֣יב יָד֑/וֹ מִשְׁפַּ֤ט אֱמֶת֙ יַֽעֲשֶׂ֔ה בֵּ֥ין אִ֖ישׁ לְ/אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/008.yaml
  text: He does not lend at interest or take profit[a]; he keeps his hand back from injustice[c][b]; he executes true justice between one man and another.
  footnotes:
  - marker: a
    text: Or 'He does not lend on usury or take increase.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'he turns back his hand from injustice.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'between man and man,' a legal idiom for judging fairly between two parties.
    reason: cultural_note
translation:
  language: ko
  text: 그는 이자를 붙여 빌려주지 않고[a] 이익도 받지 않으며, 불의에서 손을 거두며[b] 한 사람과 다른 사람 사이에서 참된 판결을 내립니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 대출에 붙는 이자를 뜻하며, 착취적인 고리대의 뉘앙스를 지닐 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘자기 손을 불의에서 되돌린다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 ‘사람과 사람 사이에서’는 두 당사자 사이에서 공정하게 판결하는 것을 가리키는 법정 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בַּנֶּשֶׁךְ לֹא יִתֵּן
  english_pob_choice: He does not lend at interest
  chosen_korean: 이자를 붙여 빌려주지 않고
  alternatives_korean:
  - 고리로 빌려주지 않고
  - 이자로 빌려주지 않고
  lexicon: HALOT
  rationale: נֶשֶׁךְ은 대출에 붙는 이자를 가리키므로, 현대 한국어에서는 ‘이자를 붙여 빌려주다’가 의미를 가장 분명하게 전달합니다.
- source_word: וְתַרְבִּית לֹא יִקָּח
  english_pob_choice: or take profit
  chosen_korean: 이익도 받지 않으며
  alternatives_korean:
  - 증가분도 받지 않으며
  - 이자를 더 받지 않으며
  lexicon: HALOT
  rationale: תַרְבִּית은 이득/증가분이라는 뜻이어서, 앞의 ‘이자’와 구별되도록 ‘이익’으로 옮겼습니다.
- source_word: מֵעָוֶל יָשִׁיב יָדוֹ
  english_pob_choice: he keeps his hand back from injustice
  chosen_korean: 불의에서 손을 거두어 둡니다
  alternatives_korean:
  - 불의에서 손을 되돌립니다
  - 불의에서 손을 물립니다
  lexicon: HALOT
  rationale: 직역하면 ‘그는 자기 손을 되돌린다’는 관용구이므로, 손을 거두는 이미지를 살리되 자연스러운 현대 한국어로 표현했습니다.
- source_word: מִשְׁפַּט אֱמֶת יַעֲשֶׂה
  english_pob_choice: he executes true justice
  chosen_korean: 참된 정의를 행합니다
  alternatives_korean:
  - 참된 판단을 행합니다
  - 진실한 재판을 합니다
  lexicon: HALOT
  rationale: מִשְׁפַּט אֱמֶת는 법적 판단과 도덕적 진실성을 함께 내포하므로, ‘정의’를 기본으로 하되 ‘참된’으로 질을 드러냈습니다.
- source_word: בֵּין אִישׁ לְאִישׁ
  english_pob_choice: between one man and another
  chosen_korean: 한 사람과 다른 사람 사이에서
  alternatives_korean:
  - 한 남자와 다른 남자 사이에서
  - 사람과 사람 사이에서
  lexicon: HALOT
  rationale: 히브리어는 대표적 법정 관용구이므로 판결 상황을 살리면서도, 현대 한국어에서는 자연스럽게 ‘한 사람과 다른 사람’으로 옮겼습니다.
theological_decisions:
- issue: 재정적 착취를 가리키는 두 용어의 구분
  chosen_reading: ‘이자를 붙여 빌려주지 않고’와 ‘이익도 받지 않으며’로 구별해 번역했습니다.
  alternative_readings:
  - 두 표현 모두 ‘이자’로 통일
  - ‘고리’와 ‘증가분’으로 더 기술적으로 구분
  rationale: 본문은 נֶשֶׁךְ과 תַרְבִּית의 병렬을 사용하므로, 의미를 지나치게 합치지 않으면서도 현대 독자가 이해할 수 있게 약간의 차이를 두었습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy points 5 and 6
- issue: 법정 관용구의 보존
  chosen_reading: ‘한 사람과 다른 사람 사이에서’로 법적 중재의 의미를 살렸습니다.
  alternative_readings:
  - ‘사람과 사람 사이에서’로 일반화
  - ‘두 사람 사이에서’로 수량을 명시
  rationale: 원문의 בֵּין אִישׁ לְאִישׁ는 단순한 일반 인칭이 아니라 공정한 판결을 가리키는 법률적 표현이므로, 그 기능을 드러내는 번역이 필요합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy point 4
