id: EZK.18.21
reference: Ezekiel 18:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ/רָשָׁ֗ע כִּ֤י יָשׁוּב֙ מִ/כָּל חטאת/ו אֲשֶׁ֣ר עָשָׂ֔ה וְ/שָׁמַר֙ אֶת כָּל חֻקּוֹתַ֔/י וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָ֑ה חָיֹ֥ה יִחְיֶ֖ה לֹ֥א יָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/021.yaml
  text: But if the wicked man turns back from all his sins that he has committed[a], and keeps all my statutes, and does justice and righteousness, he shall surely live; he shall not die.
  footnotes:
  - marker: a
    text: Or 'repents' for 'turns back'; the Hebrew verb literally means 'turn/return' and here describes turning away from sin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 악인이 자기의 범한 모든 죄에서 돌아서서 내 모든 규례를 지키고 정의와 공의를 행하면, 그는 반드시 살 것이요, 죽지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌아서서’는 히브리어 שׁוּב의 기본 의미인 ‘돌아가다/되돌아오다’를 따른 표현입니다. 여기서는 죄에서 등을 돌리는 의미를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָשָׁע
  english_pob_choice: the wicked man
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람
  - 악한 자
  lexicon: HALOT
  rationale: 히브리어는 남성 단수이지만, 한국어에서는 ‘악인’이 자연스럽게 개인을 가리키면서도 성별을 과도하게 드러내지 않아 본문의 유형적 의미를 잘 살립니다.
- source_word: יָשׁוּב
  english_pob_choice: turns back
  chosen_korean: 돌아서서
  alternatives_korean:
  - 돌이켜서
  - 돌아와서
  - 회개해서
  lexicon: HALOT
  rationale: שׁוּב의 기본 의미인 ‘돌아가다/되돌아오다’를 살려, 죄에서 등지는 방향성을 분명히 표현했습니다. ‘회개하다’는 신학적으로 좁혀질 수 있어 피했습니다.
- source_word: חֻקּוֹתַי
  english_pob_choice: my statutes
  chosen_korean: 내 모든 규례
  alternatives_korean:
  - 내 모든 법도
  - 내 모든 율례
  - 내 규례들
  lexicon: HALOT
  rationale: חֻקִּים 계열은 한국어 성경에서 ‘규례/율례/법도’로 갈리지만, 여기서는 언약적 규범을 뜻하는 항목성을 살려 ‘규례’를 택했습니다. ‘모든’은 원문의 총괄성을 반영합니다.
- source_word: מִשְׁפָּט וּצְדָקָה
  english_pob_choice: justice and righteousness
  chosen_korean: 정의와 공의
  alternatives_korean:
  - 공의와 의
  - 정의와 의
  - 올바름과 공의
  lexicon: HALOT
  rationale: 두 개의 상이한 윤리 용어를 한국어에서도 구별해 보이기 위해 관용적 짝인 ‘정의와 공의’를 사용했습니다. 이는 개념을 흐리지 않으면서도 본문의 병렬성을 유지합니다.
- source_word: חָיֹה יִחְיֶה
  english_pob_choice: he shall surely live
  chosen_korean: 반드시 살 것이요
  alternatives_korean:
  - 반드시 살아날 것이요
  - 정녕 살 것이요
  - 분명히 살 것입니다
  lexicon: HALOT
  rationale: 부정과 대조되는 강조 표현을 한국어의 ‘반드시’로 옮겨 확언의 힘을 살렸습니다. ‘살 것이요’는 예언적 선언의 장중한 문체를 유지합니다.
theological_decisions:
- issue: Ezekiel의 חיים/מות 언어를 육체적 생존으로만 좁힐지 여부
  chosen_reading: ‘반드시 살 것이요, 죽지 않을 것입니다’로 넓게 유지하여 언약적 생명/죽음의 긴장을 그대로 남김
  alternative_readings:
  - 육체적으로 살아남을 것입니다
  - 영적으로 살 것입니다
  - 구원받을 것입니다
  rationale: 본문은 심판 맥락에서 생명과 죽음을 선언하지만, 그 의미를 단일 차원으로 확정하지 않습니다. 한국어도 이 긴장을 보존해 독자가 본문의 범위를 스스로 읽도록 두었습니다.
  doctrine_reference: Ezekiel 18의 생명-죽음 어휘와 언약적 책임의 문맥
