  lexicon: HALOT
  rationale: הוליד는 ‘낳다/낳게 하다’의 뜻이므로, 남성 주어가 자녀를 두는 경우를 자연스럽게 살려 ‘낳아’로 옮겼습니다. 문맥상 앞절과 대조되는 조건이어서 ‘그러나’로 연결했습니다.
- source_word: פָּרִיץ
  english_pob_choice: violent
  chosen_korean: 폭력적인
  alternatives_korean:
  - 포악한
  - 난폭한
  - 폭군 같은
  lexicon: HALOT
  rationale: פריץ는 폭력적이고 포악한 사람을 가리키며, 이어지는 ‘피를 흘리게 하는’ 표현과도 잘 맞는 직접적인 형용사이므로 ‘폭력적인’으로 옮겼습니다.
- source_word: שֹׁפֵךְ דָּם
  english_pob_choice: one who sheds blood
  chosen_korean: 피를 흘리게 하고
  alternatives_korean:
  - 피를 흘리는 자
  - 피를 흘리는 사람
  lexicon: HALOT
  rationale: 직역하면 ‘피를 흘리는 자’이지만, 한국어에서는 행위 동사로 풀어 ‘피를 흘리게 하고’가 히브리어 관용을 자연스럽게 살립니다.
- source_word: מֵ/אַחַד מֵ/אֵֽלֶּה
  english_pob_choice: of these things
  chosen_korean: 이 일들 가운데 하나라도
  alternatives_korean:
  - 이것들 가운데 하나라도
  - 이것들 중 하나라도
  lexicon: HALOT
  rationale: 구문은 ‘이것들 가운데 하나’의 뜻이므로, 앞의 ‘하나라도’와 결합해 단수의 강조를 살린 자연스러운 한국어로 옮겼습니다.
