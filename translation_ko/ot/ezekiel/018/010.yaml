  text: 그러나 그가 폭력적인 아들을 낳아 피를 흘리게 하고, 이 일들 가운데 하나라도 행하면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘피를 흘리게 하고’는 히브리어 관용을 한국어로 풀어 옮긴 것입니다. 직역하면 ‘피를 흘리는 자’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹלִיד
  english_pob_choice: But if he fathers
  chosen_korean: 그러나 그가 …을 낳아
  alternatives_korean:
  - 그리고 그가 …을 낳아
  - 그러나 그가 …을 두어
  lexicon: HALOT
  rationale: הוליד는 ‘낳다/낳게 하다’의 뜻이므로, 남성 주어가 자녀를 두는 경우를 자연스럽게 살려 ‘낳아’로 옮겼습니다. 문맥상 앞절과 대조되는 조건이어서 ‘그러나’로 연결했습니다.
- source_word: פָּרִיץ
  english_pob_choice: violent
  chosen_korean: 폭력적인
  alternatives_korean:
  - 포악한
  - 난폭한
  - 폭군 같은
  lexicon: HALOT
  rationale: פריץ는 폭력적이고 포악한 사람을 가리키며, 이어지는 ‘피를 흘리게 하는’ 표현과도 잘 맞는 직접적인 형용사이므로 ‘폭력적인’으로 옮겼습니다.
- source_word: שֹׁפֵךְ דָּם
  english_pob_choice: one who sheds blood
  chosen_korean: 피를 흘리게 하고
  alternatives_korean:
  - 피를 흘리는 자
  - 피를 흘리는 사람
  lexicon: HALOT
  rationale: 직역하면 ‘피를 흘리는 자’이지만, 한국어에서는 행위 동사로 풀어 ‘피를 흘리게 하고’가 히브리어 관용을 자연스럽게 살립니다.
- source_word: מֵ/אַחַד מֵ/אֵֽלֶּה
  english_pob_choice: of these things
  chosen_korean: 이 일들 가운데 하나라도
  alternatives_korean:
  - 이것들 가운데 하나라도
  - 이것들 중 하나라도
  lexicon: HALOT
  rationale: 구문은 ‘이것들 가운데 하나’의 뜻이므로, 앞의 ‘하나라도’와 결합해 단수의 강조를 살린 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 첫 연결사의 대조적·조건적 뉘앙스
  chosen_reading: ‘וְ’를 단순한 ‘그리고’가 아니라 문맥상 ‘그러나’로 옮김
  alternative_readings:
  - 그리고
  - 또
  rationale: 히브리어 접속사는 형태상 단순 연결이지만, 문맥은 의로운 아버지와 대비되는 경우를 새로 제시하므로 한국어에서는 대조를 드러내는 것이 의미 전달에 더 적절합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; discourse coherence in prophetic legal reasoning.'
