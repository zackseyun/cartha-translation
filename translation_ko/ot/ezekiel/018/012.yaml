base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/012.yaml
  text: He has oppressed the poor and needy[a], committed robbery, not returned a pledge, lifted up his eyes to the idols, and done an abomination.
  footnotes:
  - marker: a
    text: Hebrew גִּלּוּלִים is a contemptuous term for idols, carrying a pejorative sense such as 'filthy idols.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 가난한 자와 궁핍한 자를 학대하고, 강탈하며, 전당물을 돌려주지 않고, 우상들에게 눈을 들어, 가증한 일을 저질렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִּלּוּלִים는 우상을 낮잡아 이르는 말로, ‘더러운 우상들’ 같은 경멸적 뉘앙스를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנִי וְאֶבְיוֹן
  english_pob_choice: the poor and needy
  chosen_korean: 가난한 자와 궁핍한 자
  alternatives_korean:
  - 가난하고 궁핍한 자
  - 가난한 사람과 궁핍한 사람
  lexicon: HALOT
  rationale: 사회적으로 취약한 사람들을 가리키는 관용적 병렬 표현이므로, 한국어에서도 두 겹의 취약성을 드러내는 표현을 택했습니다.
- source_word: הוֹנָה
  english_pob_choice: has oppressed
  chosen_korean: 학대하고
  alternatives_korean:
  - 억압하고
  - 착취하고
  - 부당하게 대하고
  lexicon: HALOT
  rationale: 문맥이 가난하고 궁핍한 자를 대상으로 한 경제적·사회적 해악이므로, 단순한 ‘잘못하다’보다 강한 착취적 해를 드러내는 표현을 선택했습니다.
- source_word: חֲבֹל לֹא יָשִׁיב
  english_pob_choice: not returned a pledge
  chosen_korean: 전당물을 돌려주지 않고
  alternatives_korean:
  - 담보를 돌려주지 않고
  - 저당물을 돌려주지 않고
  - 맡긴 물건을 돌려주지 않고
  lexicon: HALOT
  rationale: חֲבֹל은 빚과 관련된 전당물/담보를 뜻하므로, 한국어에서도 법적·경제적 뉘앙스가 보이는 ‘전당물’을 사용했습니다.
- source_word: הַגִּלּוּלִים
  english_pob_choice: the idols
  chosen_korean: 우상들
  alternatives_korean:
  - 더러운 우상들
  - 우상 신들
  lexicon: HALOT
  rationale: 본문의 핵심 의미는 우상숭배이며, 모멸적 뉘앙스는 본문 각주로 보완하는 편이 자연스럽습니다.
theological_decisions:
- issue: 우상에 눈을 듦이라는 관용구의 처리
  chosen_reading: ‘우상들에게 눈을 들어’로 직역에 가깝게 살려, 시선의 방향이 곧 예배적 지향을 암시하도록 두었습니다.
  alternative_readings:
  - ‘우상을 바라보고’
  - ‘우상을 섬기고’
  rationale: 히브리어는 시선의 이미지를 사용하므로, 그 이미지를 보존하면서 문맥상 우상숭배의 의미를 독자가 읽어내도록 하는 편이 원문 투명성에 더 가깝습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it
