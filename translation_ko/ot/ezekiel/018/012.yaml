  source_fidelity: 원문의 열거 구조와 핵심 의미를 대체로 충실히 옮겼습니다. 다만 וְאֶל־הַגִּלּוּלִים נָשָׂא עֵינָיו는 ‘우상들에게 눈을 들어’보다 ‘우상들을 향해 눈을 들고’가 히브리어의 방향성과 한국어 문법을 모두 더 정확히 반영합니다. חֲבֹל은 현대 한국어에서 ‘담보물’로 옮기는 것이 ‘전당물’보다 넓고 명료합니다.
  naturalness: ‘우상들에게 눈을 들어’는 조사 결합이 다소 부자연스럽습니다. ‘우상들을 향해 눈을 들고’는 현대 표준어 합쇼체 문장 안에서 자연스럽고, 원문의 시각적 관용구도 보존합니다. 각주는 해당 어휘 바로 뒤에 두는 편이 독자의 이해와 각주 연결에 적절합니다.
  terminology: ‘가난한 자와 궁핍한 자’, ‘학대하고’, ‘우상들’, ‘가증한 일’은 문맥과 성경적 격식에 적절합니다. ‘담보물’은 채무를 위해 잡힌 물건이라는 חֲבֹל의 의미를 자연스럽게 전달합니다. גִּלּוּלִים의 경멸적 어감은 본문을 과도하게 해석하지 않고 각주에서 보완하는 것이 적절합니다.
