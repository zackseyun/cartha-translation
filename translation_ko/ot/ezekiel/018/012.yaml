  - severity: low
    issue: 각주 표지가 문장 끝에 배치됨
    rationale: 각주는 גִּלּוּלִים, 곧 ‘우상들’의 경멸적 어감을 설명하므로 해당 단어 바로 뒤에 표기하는 것이 앵커의 지시 대상을 분명히 합니다.
  - severity: low
