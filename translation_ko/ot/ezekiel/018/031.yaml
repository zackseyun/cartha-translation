id: EZK.18.31
reference: Ezekiel 18:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַשְׁלִ֣יכוּ מֵ/עֲלֵי/כֶ֗ם אֶת כָּל פִּשְׁעֵי/כֶם֙ אֲשֶׁ֣ר פְּשַׁעְתֶּ֣ם בָּ֔/ם וַ/עֲשׂ֥וּ לָ/כֶ֛ם לֵ֥ב חָדָ֖שׁ וְ/ר֣וּחַ חֲדָשָׁ֑ה וְ/לָ֥/מָּה תָמֻ֖תוּ בֵּ֥ית יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/031.yaml
  text: Cast away from yourselves all your transgressions by which you have transgressed[a], and make for yourselves a new heart and a new spirit. Why should you die, O house of Israel?
  footnotes:
  - marker: a
    text: Or 'Cast away from yourselves all your rebellions in which you have rebelled.' The Hebrew repeats the same root for 'transgressions' and 'have transgressed,' emphasizing culpability.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 너희에게서 모든 허물을 버리고, 너희를 위해 새 마음과 새 영을 만드십시오. 이스라엘 집아, 어찌하여 죽으려 합니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희의 허물들을 너희에게서 버리고… 너희가 그 허물들을 범한 곳에서 돌이키라.” 히브리어는 ‘허물’과 ‘허물을 범하다’에 같은 어근을 반복하여 책임을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁלִיכוּ מֵעֲלֵיכֶם
  english_pob_choice: Cast away from yourselves
  chosen_korean: 너희는 너희에게서 ... 버리고
  alternatives_korean:
  - 너희에게서 ... 내던지고
  - 너희에게서 ... 던져 버리고
  lexicon: HALOT
  rationale: שלך의 강한 제거 명령을 한국어에서 가장 자연스럽고 단호하게 살리기 위해 '버리다'를 썼고, '너희에게서'로 붙어 있는 것을 떼어내는 뜻을 담았습니다.
- source_word: פִּשְׁעֵיכֶם / פְּשַׁעְתֶּם
  english_pob_choice: your transgressions / you have transgressed
  chosen_korean: 허물 / 허물을 범하셨습니다
  alternatives_korean:
  - 반역 / 반역하셨습니다
  - 범죄 / 범죄하셨습니다
  lexicon: HALOT
  rationale: 같은 어근의 명사·동사 반복을 한국어에서도 드러내기 위해 '허물'과 '허물을 범하다'를 대응시켜, 책임과 반복 강조를 살렸습니다.
- source_word: לֵב חָדָשׁ וְרוּחַ חֲדָשָׁה
  english_pob_choice: a new heart and a new spirit
  chosen_korean: 새 마음과 새 영
  alternatives_korean:
  - 새 심령과 새 영
  - 새 마음과 새 روح
  lexicon: HALOT
  rationale: '''마음''은 לֵב의 핵심 의미를 현대 한국어에서 가장 직접적으로 전하고, רוּחַ는 여기서 비인격적 ''바람''이 아니라 인간 내면의 ''영''이므로 그대로 살렸습니다.'
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: O house of Israel
  chosen_korean: 이스라엘 집아
  alternatives_korean:
  - 이스라엘 집이여
  - 이스라엘의 집아
  lexicon: HALOT
  rationale: 예언자적 직접 호소를 반영해 호격을 살렸고, 현대 한국어에서는 '집'을 공동체 지칭으로 자연스럽게 읽히도록 구성했습니다.
theological_decisions:
- issue: 회개 촉구와 내적 새로움의 책임 주체
  chosen_reading: 명령문을 그대로 살려, 이스라엘에게 스스로 허물을 버리고 새 마음과 새 영을 만들라고 촉구합니다.
  alternative_readings:
  - 하나님이 주시는 새 마음과 새 영으로 완화하여 옮김
  - '''얻으라''로 바꾸어 인간 책임을 약화시킴'
  rationale: 본문은 인간 책임을 강하게 요구하는 예언적 권면이므로, 이후 본문의 하나님의 새 마음 부여와 미리 조화시키지 않고 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §3
