revisions:
- from: 너희는 너희에게서 모든 허물을 버리고, 너희를 위해 새 마음과 새 영을 만드십시오. 이스라엘 집아, 어찌하여 죽으려 합니까?[a]
  to: 너희가 범한[a] 모든 허물을 너희에게서 버리고, 너희를 위하여 새 마음과 새 영을 만드십시오. 이스라엘 족속아, 어찌하여 죽겠습니까?
  rationale: 히브리어의 명령 두 개, פשע 명사·동사의 반복, ‘새 마음과 새 영’의 짝, 그리고 이스라엘 공동체를 향한 수사적 질문을 모두 보존했습니다. 각주는 본문에 없는 권면을 더하지 않고, פשע 계열의 가능한 어휘 대안만 설명하도록 바로잡았습니다.
