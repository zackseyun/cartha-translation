review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 히브리어의 관계절(‘너희가 그것들로 범한’)을 본문에서 빠뜨렸고, 마지막 질문의 미완료형을 ‘죽으려 합니까’로 옮겨 죽으려는 의도/임박성을 덧붙였습니다. פשע의 명사·동사 반복도 본문에서 재현되어야 합니다.
  naturalness: ‘이스라엘 집아’보다 공동체를 가리키는 예언서의 호격으로 ‘이스라엘 족속아’가 현대 한국어 성서 문맥에서 더 자연스럽습니다. ‘너희가 범한 모든 허물을 너희에게서 버리고’는 명령의 강도와 제거의 방향을 자연스럽게 전달합니다.
  terminology: לֵב와 רוּחַ는 각각 ‘마음’과 ‘영’으로 유지하며, עשה의 명령은 해석적으로 약화하지 않고 ‘만드십시오’로 옮깁니다. פשע는 ‘허물/범하다’로 대응시켜 동근 반복을 보존하되, ‘허물’의 다소 약한 뉘앙스는 각주에서 ‘반역/반역하다’ 대안을 제시합니다.
  issues:
  - severity: high
    issue: 관계절 누락
    rationale: ‘너희가 범한’(אֲשֶׁר פְּשַׁעְתֶּם בָּם)이 본문 번역에서 빠져 있어, 명사와 동사의 동근 반복 및 책임 강조가 사라졌습니다.
  - severity: high
    issue: 질문의 상(相)과 의미 왜곡
    rationale: ‘어찌하여 죽으려 합니까?’는 죽으려는 의도 또는 임박성을 암시합니다. 본문의 수사적 질문은 ‘어찌하여 죽겠습니까?’가 적절합니다.
  - severity: high
    issue: 각주의 근거 없는 내용 추가
    rationale: 현 각주의 ‘돌이키라’는 히브리어 본문에 없으며, 제시된 대안도 본문 구문의 충실한 번역이 아닙니다.
  - severity: medium
    issue: 호격의 부자연스러움
    rationale: ‘이스라엘 집아’는 한국어에서 공동체 호칭으로 어색합니다. ‘이스라엘 족속아’가 בֵּית יִשְׂרָאֵל의 집단적 호격을 자연스럽게 전달합니다.
  revised_text: 너희가 범한[a] 모든 허물을 너희에게서 버리고, 너희를 위하여 새 마음과 새 영을 만드십시오. 이스라엘 족속아, 어찌하여 죽겠습니까?
