source:
  edition: WLC
  text: עַ֤ם הָ/אָ֨רֶץ֙ עָ֣שְׁקוּ עֹ֔שֶׁק וְ/גָזְל֖וּ גָּזֵ֑ל וְ/עָנִ֤י וְ/אֶבְיוֹן֙ הוֹנ֔וּ וְ/אֶת הַ/גֵּ֥ר עָשְׁק֖וּ בְּ/לֹ֥א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/029.yaml
  text: The people of the land have practiced oppression and committed robbery; they have mistreated the poor and needy[a], and they have oppressed the foreigner without justice.
  footnotes:
  - marker: a
    text: Or 'the sojourner' or 'the resident alien.' The Hebrew term refers to a foreign-born person residing among the people.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 땅의 백성은 압제를 행하고 강탈을 저질렀으며, 가난한 자와 궁핍한 자를 학대하였고, 외국인을 정의 없이 억압하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘외국인’은 히브리어 ‘גֵּר’의 현대적 옮김입니다. 이 말은 이스라엘 가운데 거주하는 비토착민, 곧 거류하는 이방인을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם הָאָרֶץ
  english_pob_choice: the people of the land
  chosen_korean: 이 땅의 백성
  alternatives_korean:
  - 그 땅의 백성
  - 그 나라의 백성
  - 땅의 사람들
  lexicon: HALOT
  rationale: ‘עם הארץ’는 이 문맥에서 단순한 사회계층 용어보다 그 땅의 주민 전체를 가리키므로, 직역에 가깝되 한국어로 자연스러운 ‘이 땅의 백성’으로 옮겼습니다.
- source_word: עָשְׁקוּ עֹשֶׁק / וְגָזְלוּ גָּזֵל
  english_pob_choice: have practiced oppression / and committed robbery
  chosen_korean: 압제를 행하고 강탈을 저질렀으며
  alternatives_korean:
  - 압제를 했고 강탈했습니다
  - 학대를 저지르고 탈취했습니다
  - 억압을 일삼고 약탈했습니다
  lexicon: HALOT
  rationale: 동사-명사 어근 반복이 행위의 상습성과 강도를 높이므로, ‘행하고/저질렀으며’로 그 반복 효과를 살렸습니다. ‘강탈’은 단순 도둑질보다 폭력성과 불의가 강한 תחושת에 더 가깝습니다.
- source_word: וְעָנִי וְאֶבְיוֹן הוֹנ֔וּ
  english_pob_choice: they have mistreated the poor and needy
  chosen_korean: 가난한 자와 궁핍한 자를 학대하였고
  alternatives_korean:
  - 가난한 자와 궁핍한 자를 괴롭혔고
  - 가난하고 궁핍한 사람들을 학대하였고
  - 가난한 자와 궁핍한 자를 학대했습니다
  lexicon: HALOT
  rationale: ‘עָנִי וְאֶבְיוֹן’은 사회적·경제적으로 취약한 사람들을 가리키는 상투적 쌍어구이므로, ‘가난한 자와 궁핍한 자’로 구분해 살렸습니다. ‘הוֹנוּ’는 착취적 학대를 뜻해 ‘학대하였고’가 문맥상 가장 직접적입니다.
- source_word: הַגֵּר
  english_pob_choice: the foreigner
  chosen_korean: 외국인
  alternatives_korean:
  - 나그네
  - 거류민
  - 이방인
  lexicon: HALOT
  rationale: ‘גֵּר’는 이스라엘 가운데 거주하는 비토착민을 가리키지만, 여기서는 현대 독자가 즉시 이해할 수 있는 ‘외국인’이 가장 투명합니다. 전통적 ‘나그네’는 의미가 흐려질 수 있어 피했습니다.
- source_word: בְּלֹא מִשְׁפָּט
  english_pob_choice: without justice
  chosen_korean: 정의 없이
  alternatives_korean:
  - 공의 없이
  - 재판 없이
  - 법 없이
  lexicon: HALOT
  rationale: ‘מִשְׁפָּט’는 단순한 재판 절차가 아니라 올바른 법적·도덕적 질서를 가리키므로, ‘정의 없이’가 가장 압축적이고 의미를 잘 드러냅니다.
theological_decisions:
- issue: 예언자적 고발의 수위 유지
  chosen_reading: 사회악을 일반적 ‘잘못’으로 완화하지 않고 압제, 강탈, 학대, 정의의 부재를 그대로 드러냈습니다.
  alternative_readings:
  - 그들은 나쁘게 행동했습니다
  - 그들은 죄를 지었습니다
  rationale: 본문은 구체적 언약 위반을 열거하는 고발문이므로, 추상적 도덕 평가로 바꾸면 예언적 날카로움이 약해집니다.
  doctrine_reference: 'Translation philosophy: source-grounded prophetic indictment should preserve concrete injustice terms.'
