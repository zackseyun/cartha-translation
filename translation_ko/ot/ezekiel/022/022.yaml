  text: As silver is melted in the midst of a furnace[a], so you will be melted in the midst of it; and you will know that I, Yahweh, have poured out my wrath on you.
  footnotes:
  - marker: a
    text: Or 'inside it'; the pronoun refers to the city (Jerusalem) in the immediate context.
    reason: lexical_alternative
translation:
  language: ko
  text: 용광로 한가운데에서 은이 녹는 것처럼, 너희도 그 한가운데에서 녹을 것입니다. 그러면 너희는 나 야훼가 내 분노를 너희 위에 쏟아부었다는 것을 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 한가운데에서’의 ‘그’는 바로 앞 문맥에서 예루살렘, 곧 그 성읍을 가리킵니다.
    reason: lexical_alternative
