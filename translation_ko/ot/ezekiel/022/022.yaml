- from: 은이 용광로 가운데에서 녹이듯이, 그와 같이 너희도 그 한가운데에서 녹을 것입니다. 그러면 너희는 내가 야훼이며, 내 분노를 너희에게 쏟아부은 사람이라는 것을 알게 될 것입니다.[a]
  to: 용광로 한가운데에서 은이 녹는 것처럼, 너희도 그 한가운데에서 녹을 것입니다. 그러면 너희는 나 야훼가 내 분노를 너희 위에 쏟아부었다는 것을 알게 될 것입니다.[a]
