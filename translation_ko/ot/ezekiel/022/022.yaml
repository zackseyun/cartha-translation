base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/022.yaml
  text: As silver is melted in the midst of a furnace[a], so you will be melted in the midst of it; and you will know that I, Yahweh, have poured out my wrath on you.
  footnotes:
  - marker: a
    text: Or 'inside it'; the pronoun refers to the city (Jerusalem) in the immediate context.
    reason: lexical_alternative
translation:
  language: ko
  text: 은이 용광로 가운데에서 녹이듯이, 그와 같이 너희도 그 한가운데에서 녹을 것입니다. 그러면 너희는 내가 야훼이며, 내 분노를 너희에게 쏟아부은 사람이라는 것을 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 한가운데에서’는 문맥상 예루살렘을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: כְּהִתּוּךְ כֶּסֶף
  english_pob_choice: As silver is melted
  chosen_korean: 은이 … 녹이듯이
  alternatives_korean:
  - 은이 … 녹는 것처럼
  - 은을 녹이듯이
  lexicon: HALOT
  rationale: 비교 구문으로서의 ‘as … is melted’를 살려, 금속 정련 이미지를 자연스러운 한국어로 옮겼습니다.
- source_word: בְּתוֹךְ כּוּר
  english_pob_choice: in the midst of a furnace
  chosen_korean: 용광로 가운데에서
  alternatives_korean:
  - 풀무불 가운데에서
  - 도가니 한가운데에서
  lexicon: HALOT
  rationale: כּוּר의 제련 용광로 이미지를 살리되, 현대 한국어에서 직관적인 ‘용광로’를 택해 심판의 압박감을 드러냈습니다.
- source_word: תֻּתְּכוּ בְתוֹכָהּ
  english_pob_choice: you will be melted in the midst of it
  chosen_korean: 그 한가운데에서 녹을 것입니다
  alternatives_korean:
  - 그 안에서 녹을 것입니다
  - 그 가운데에서 녹아 버릴 것입니다
  lexicon: HALOT
  rationale: 반복되는 ‘한가운데’ 표현을 유지해 히브리어의 중첩된 공간 이미지를 보존했습니다. ‘it’은 문맥상 예루살렘을 가리키지만, 원문처럼 암시적으로 남겼습니다.
- source_word: שָׁפַכְתִּי חֲמָתִי
  english_pob_choice: I have poured out my wrath
  chosen_korean: 내 분노를 너희에게 쏟아부은 사람이라는 것을
  alternatives_korean:
  - 내 진노를 너희에게 쏟아부었다는 것을
  - 내 분노를 너희에게 쏟아부었다는 것을
  lexicon: HALOT
  rationale: חֵמָה는 단순한 감정보다 격렬한 심판의 분노를 가리키므로 ‘분노’를 택했습니다. 동사는 ‘쏟아붓다’로, 영어 POB의 강한 유출 이미지를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사본의 여호와 대체어가 아니라 하나님의 고유명사를 직접 드러내는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘알게 될 것입니다’의 인식 공식
  chosen_reading: 심판을 통해 야훼의 주권과 자기 계시를 깨닫게 되는 예언자적 인식 공식으로 처리했습니다.
  alternative_readings:
  - 단순한 정보 인지
  - 회개를 전제한 신앙 고백
  rationale: 에스겔의 전형적 ‘너희는 알게 될 것이다’ 공식은 단순 지식 전달이 아니라, 심판 속에서 하나님의 정체와 행위를 인식하게 되는 언약적 판결 선포입니다.
  doctrine_reference: Ezekiel recognition formula; covenant judgment motif
