    rationale: 이 표현은 야훼의 자기 선언과 ‘내가 분노를 쏟아부었다’라는 절을 ‘사람’이라는 관계 명사로 부자연스럽게 바꾸며, 신적 화자의 직접성을 약화시킵니다. ‘나 야훼가 … 쏟아부었다는 것을’이 원문 구조와 한국어 문법에 맞습니다.
