- from: 「인자야, 이스라엘 집은 내게 찌꺼기가 되었고, 그들 모두는 놋과 주석과 철과 납이 녹는 가마 한가운데 있는 것이며, 그들은 은의 찌꺼기입니다.」[a]
  to: 「인자야, 이스라엘 집은 내게 찌꺼기가 되었습니다. 그들 모두는 제련 가마 안에 있는 놋[a]과 주석과 철과 납이며, 은의 찌꺼기입니다.」
  rationale: 제련로 표현을 원문의 위치 관계에 맞게 ‘제련 가마 안에 있는’으로 바로잡고, 불명확한 ‘것이며’를 금속 목록을 받는 ‘이며’로 교체했습니다. 어휘 대안 각주의 표지를 ‘놋’에 직접 연결했습니다. ‘은의 찌꺼기’는 원문의 비유와 구성 관계를 보존하기 위해 유지했습니다.
