id: EZK.22.18
reference: Ezekiel 22:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֶּן אָדָ֕ם הָיוּ לִ֥/י בֵֽית יִשְׂרָאֵ֖ל ל/סוג כֻּלָּ֡/ם נְ֠חֹשֶׁת וּ/בְדִ֨יל וּ/בַרְזֶ֤ל וְ/עוֹפֶ֨רֶת֙ בְּ/ת֣וֹךְ כּ֔וּר סִגִ֥ים כֶּ֖סֶף הָיֽוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/018.yaml
  text: Son of man[a], the house of Israel has become dross to me; all of them are bronze and tin and iron and lead in the midst of a furnace; they are the dross of silver.
  footnotes:
  - marker: a
    text: Or 'copper' for 'bronze' (נְחֹשֶׁת).
    reason: lexical_alternative
translation:
  language: ko
  text: 「인자야, 이스라엘 집은 내게 찌꺼기가 되었고, 그들 모두는 놋과 주석과 철과 납이 녹는 가마 한가운데 있는 것이며, 그들은 은의 찌꺼기입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘놋’은 여기서 ‘구리’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָ֕ם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인자여
  lexicon: HALOT
  rationale: 에스겔의 대표적 소명 형식을 한국어 예언서 관습에 맞게 ‘인자’로 옮기되, 직접 호격이 드러나도록 ‘-야’를 붙였습니다.
- source_word: הָיוּ לִ֥י
  english_pob_choice: has become ... to me
  chosen_korean: 내게 찌꺼기가 되었고
  alternatives_korean:
  - 내게 찌꺼기가 되었습니다
  - 내게 찌꺼기였습니다
  lexicon: HALOT
  rationale: 야훼의 평가적 관계를 보존하면서, 완료형의 결과 상태를 한국어 과거 완료 감각으로 자연스럽게 표현했습니다.
- source_word: לְסוּג / סִגִים
  english_pob_choice: dross / the dross of silver
  chosen_korean: 찌꺼기 / 은의 찌꺼기
  alternatives_korean:
  - 드로스
  - 불순물
  - 은의 불순물
  lexicon: HALOT
  rationale: 제련 문맥의 금속 찌꺼기를 가리키는 말로서 ‘찌꺼기’가 가장 직관적이면서도 이미지 손상을 덜 하므로, 뒤의 ‘은의 찌꺼기’와 함께 메타포를 살렸습니다.
- source_word: בְּתוֹךְ כּוּר
  english_pob_choice: in the midst of a furnace
  chosen_korean: 녹는 가마 한가운데 있는 것이며
  alternatives_korean:
  - 제련 가마 안에 있는 것이며
  - 가마 한가운데 있는 것이며
  lexicon: HALOT
  rationale: כּוּר의 제련 용도를 드러내기 위해 ‘녹는 가마’로 옮겼고, בְּתוֹךְ는 ‘한가운데’로 살려 강한 제련 이미지가 유지되게 했습니다.
- source_word: נְחֹשֶׁת וּ/בְדִיל וּ/בַרְזֶל וְ/עוֹפֶרֶת
  english_pob_choice: bronze and tin and iron and lead
  chosen_korean: 놋과 주석과 철과 납
  alternatives_korean:
  - 구리와 주석과 철과 납
  - 청동과 주석과 철과 납
  lexicon: HALOT
  rationale: 금속 목록은 전통적으로 통용되는 재료명으로 옮기되, נְחֹשֶׁת은 문맥상 ‘놋’이 자연스럽고 ‘주석, 철, 납’은 직역성을 유지합니다.
theological_decisions:
- issue: ‘to me’의 신학적 함의
  chosen_reading: ‘내게’로 직역하여 야훼의 평가와 소유 관계를 드러냈습니다.
  alternative_readings:
  - 내 눈에는
  - 내 앞에서
  rationale: 본문은 이스라엘의 가치 하락을 하나님의 관점에서 진술하므로, 해석을 덧붙이기보다 관계 표지를 직접 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 금속 제련 은유의 보존
  chosen_reading: 찌꺼기와 제련 가마 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 도덕적 부패로 일반화
  - 쓸모없게 된 백성으로 의역
  rationale: 이 구절의 예언적 충격은 정련/배출의 이미지에 있으므로, 신학적 메시지를 약화시키는 평이한 의역은 피했습니다.
  doctrine_reference: Translation philosophy §1, §3
