  text: 'And say, ‘Thus says the Lord GOD: O city that sheds blood in her midst, so that her time may come, and that makes idols against herself to defile herself!’'
translation:
  language: ko
  text: 그리고 말하십시오. ‘주 야훼께서 이렇게 말씀하십니다. 피를 자기 한가운데서 흘리는 도성아, 네 때가 이르도록 하고, 자기 몸을 더럽히기 위하여 자기에게 우상들을 만드는 도성아!’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִיר
  english_pob_choice: city
  chosen_korean: 도성
  alternatives_korean:
  - 성
  - 도시
  lexicon: עִיר
  rationale: 예언적 책망의 대상이 단순한 행정 도시가 아니라 인격화된 공동체로 제시되므로, 문어체에서 격식을 갖춘 ‘도성’이 원문의 수사와 잘 맞습니다.
- source_word: יְהוִה
  english_pob_choice: Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 여호와
  - 주 하나님
  lexicon: יהוה
  rationale: 원문의 신명 표기를 프로젝트 기본값에 따라 ‘야훼’로 옮기고, אדני와 결합된 관용을 ‘주 야훼’로 처리했습니다.
- source_word: שֹׁפֶכֶת דָּם
  english_pob_choice: that sheds blood
  chosen_korean: 피를 ... 흘리는
  alternatives_korean:
  - 피를 흘리는
  - 피를 쏟는
  lexicon: שׁפך דם
  rationale: 살상과 폭력을 지속적으로 행하는 상태를 드러내기 위해 현재분사적 표현으로 옮겼습니다.
- source_word: גִלּוּלִים
  english_pob_choice: idols
  chosen_korean: 우상들
  alternatives_korean:
  - 우상
  - 우상 신상들
  lexicon: גִּלּוּלִים
  rationale: 문맥상 예언자적 우상 비판의 일반 명사이므로, 복수성을 살려 ‘우상들’로 옮겼습니다.
theological_decisions:
- issue: 도성을 향한 직접적인 책망의 호명
  chosen_reading: ‘도성아’로 직접 호명해 인격화된 공동체를 정면으로 책망하는 어조를 살렸습니다.
  alternative_readings:
  - ‘도시여’
  - ‘성읍아’
  rationale: 히브리어 원문은 단순 묘사가 아니라 예언적 직접 호명을 포함하므로, 한국어에서도 탄식형 호명으로 긴장을 유지했습니다.
  doctrine_reference: 예언서의 심판 선포 수사
