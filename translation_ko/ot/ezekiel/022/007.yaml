base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/007.yaml
  text: In you they have treated father and mother with contempt[a]; in your midst they have oppressed the sojourner[c][b]; in you they have defrauded the fatherless and the widow.
  footnotes:
  - marker: a
    text: Or 'the foreigner' or 'the resident alien' for 'the sojourner.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the orphan and the widow' for 'the fatherless and the widow.'
    reason: lexical_alternative
  - marker: c
    text: The repeated 'in you' addresses the city directly, personifying Jerusalem as a woman.
    reason: cultural_note
translation:
  language: ko
  text: 네 안에서 그들은 아버지와 어머니를 업신여겼습니다[a] — 네 한가운데서 그들은 나그네를 압제했습니다[b][c]. 네 안에서 그들은 아버지 없는 자와 과부를 착취했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경멸했습니다’나 ‘하찮게 여겼습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거류민’이나 ‘외국인’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘네 한가운데서’는 도성을 직접 호명하는 수사로, 예루살렘을 인격화합니다.
    reason: cultural_note
lexical_decisions:
- source_word: הֵקַלּוּ
  english_pob_choice: have treated ... with contempt
  chosen_korean: 업신여겼습니다
  alternatives_korean:
  - 경멸했습니다
  - 하찮게 여겼습니다
  lexicon: HALOT
  rationale: קלל의 히필은 ‘가볍게 여기다, 업신여기다’의 뜻이므로, 현대 한국어에서 자연스럽고 모욕의 강도를 살리는 ‘업신여기다’를 선택했습니다.
- source_word: לַגֵּר
  english_pob_choice: the sojourner
  chosen_korean: 나그네
  alternatives_korean:
  - 거류민
  - 외국인
  lexicon: HALOT
  rationale: גֵּר의 사회-언약적 범주를 살리면서도 한국어에서 덜 기술적인 표현으로 읽히는 ‘나그네’를 택했습니다. 여기서는 단순한 민족 구분보다 ‘함께 거주하는 보호 대상’의 뉘앙스가 중요합니다.
- source_word: יָתוֹם
  english_pob_choice: the fatherless
  chosen_korean: 아버지 없는 자
  alternatives_korean:
  - 고아
  - 부친 없는 자
  lexicon: HALOT
  rationale: 직역상 ‘아버지 없는 자’이며, POB의 의도를 따라 ‘고아’로 완전히 평준화하지 않고 히브리어의 표지를 보존했습니다.
- source_word: הוֹנוּ
  english_pob_choice: have defrauded
  chosen_korean: 착취했습니다
  alternatives_korean:
  - 사취했습니다
  - 학대했습니다
  - 속였습니다
  lexicon: HALOT
  rationale: הונ의 히필은 불의한 착취와 해악을 가리키므로, 경제적·사회적 압박까지 포함하는 ‘착취하다’가 본문 문맥에 가장 잘 맞습니다.
theological_decisions:
- issue: ‘네 안에서’ 반복과 도시의 인격화
  chosen_reading: 반복된 ‘네 안에서’/‘네 한가운데서’를 그대로 살려 예루살렘을 여성 단수로 직접 호명하는 구조를 보존했습니다.
  alternative_readings:
  - ‘너희 가운데’로 일반화
  - 주어를 수동형으로 완화
  rationale: 본문의 수사적 고발은 도성을 인격화해 직접 심문하는 방식이므로, 반복 구조를 유지해야 משפט적 책망의 강도가 드러납니다.
  doctrine_reference: Ezekiel’s prophetic rhetoric; source-text discourse structure
