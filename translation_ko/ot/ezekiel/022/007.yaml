revisions:
- from: 네 안에서 그들은 아버지와 어머니를 업신여겼습니다[a] — 네 한가운데서 그들은 나그네를 압제했습니다[b][c]. 네 안에서 그들은 아버지 없는 자와 과부를 착취했습니다.
  to: 네 안에서는 그들이 아버지와 어머니를 업신여겼고[a], 네 한가운데에서는 거류민을 억압했으며[b][c], 네 안에서는 아버지 없는 이와 과부를 착취했습니다.
  rationale: 거주 외국인을 뜻하는 גֵּר의 핵심 의미를 보존하도록 ‘나그네’를 ‘거류민’으로 바꾸었습니다. 또한 ‘아버지 없는 이’로 다듬어 자연스러운 현대 한국어를 유지하면서 יָתוֹם의 ‘아버지 없는’ 표지를 보존했습니다. 세 절에 반복되는 도시를 향한 직접 고발의 구조와 완료된 고발의 어조는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:43:11Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 세 고발절과 ‘네 안에서/네 한가운데서’의 반복은 대체로 잘 보존했습니다. 다만 גֵּר를 ‘나그네’로 옮기면 일시적 여행자라는 뜻으로 읽히기 쉬워, 공동체 안에 거주하는 비토착민이라는 원문의 사회적 범주가 약해집니다.
  naturalness: ‘아버지 없는 자’는 현대 한국어에서 다소 경직되어 있습니다. ‘아버지 없는 이’가 같은 표지를 보존하면서 더 자연스럽습니다. 대시 대신 절을 병렬로 이어 주면 한국어 문장 흐름도 안정됩니다.
