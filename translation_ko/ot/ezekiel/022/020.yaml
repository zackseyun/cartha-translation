id: EZK.22.20
reference: Ezekiel 22:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קְבֻ֣צַת כֶּ֡סֶף וּ֠/נְחֹשֶׁת וּ/בַרְזֶ֨ל וְ/עוֹפֶ֤רֶת וּ/בְדִיל֙ אֶל תּ֣וֹךְ כּ֔וּר לָ/פַֽחַת עָלָ֥י/ו אֵ֖שׁ לְ/הַנְתִּ֑יךְ כֵּ֤ן אֶקְבֹּץ֙ בְּ/אַפִּ֣/י וּ/בַ/חֲמָתִ֔/י וְ/הִנַּחְתִּ֥י וְ/הִתַּכְתִּ֖י אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/020.yaml
  text: As silver and bronze and iron and lead and tin are gathered into the midst of a furnace[a], to blow fire on it in order to melt it, so I will gather you in my anger and in my wrath[b], and I will place you there and melt you.
  footnotes:
  - marker: a
    text: Or 'copper' for 'bronze' (נְחֹשֶׁת).
    reason: lexical_alternative
  - marker: b
    text: The final verb continues the furnace metaphor and can also be rendered 'smelt you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 은과 놋과 철과 납과 주석이 용광로 한가운데에 모여, 그 위에 불을 불어 그것을 녹이듯이, 나도 내 분노와 내 진노 가운데 너희를 모으고[a], 거기에 두어 너희를 녹이겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구리’.
    reason: lexical_alternative
  - marker: b
    text: 마지막 동사는 제련 비유를 계속하며, ‘너희를 제련하겠습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְבֻצַת / אֶקְבֹּץ
  english_pob_choice: are gathered / I will gather
  chosen_korean: 모여 / 모으고
  alternatives_korean:
  - 모아지고 / 내가 모으고
  - 집합되고 / 내가 집합시키고
  lexicon: HALOT
  rationale: 히브리어의 קבץ 반복을 살려 앞의 금속 집합과 하나님의 행위를 같은 어근 감각으로 연결했습니다. 자연스러운 현대 한국어에서는 ‘모이다/모으다’가 가장 직접적입니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  lexicon: HALOT
  rationale: 금속 목록의 전통적 대응으로 ‘놋’이 가장 간결하며, 본문의 제련 이미지와도 잘 맞습니다. ‘구리’는 원소 느낌이 강해 이 문맥에서는 덜 적합합니다.
- source_word: אֶל תּוֹךְ כּוּר
  english_pob_choice: into the midst of a furnace
  chosen_korean: 용광로 한가운데에
  alternatives_korean:
  - 풀무 한가운데에
  - 제련로 한가운데에
  lexicon: HALOT
  rationale: כּוּר는 제련용 용광로/풀무 계열의 용어이므로, 본문의 강한 심판 비유를 살리면서도 한국어로는 ‘용광로 한가운데’가 가장 분명합니다.
- source_word: וְהִתַּכְתִּי אֶתְכֶם
  english_pob_choice: and melt you
  chosen_korean: 너희를 녹이겠습니다
  alternatives_korean:
  - 너희를 제련하겠습니다
  - 너희를 녹여 버리겠습니다
  lexicon: HALOT
  rationale: 히브리어의 제련-용해 이미지를 그대로 살려 ‘녹이다’로 옮겼습니다. 여기서는 정화보다 심판의 소멸적 측면이 두드러지므로 ‘제련하다’만으로 완화하지 않았습니다.
theological_decisions:
- issue: 제련 비유의 심판성 유지
  chosen_reading: 심판의 문맥을 따라 금속을 ‘녹이는’ 강한 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘연단하다’로 완화
  - ‘시험하다’로 추상화
  rationale: 본문은 예루살렘에 대한 징벌 선언의 결론부이므로, 정련의 유익을 강조하기보다 하나님의 분노와 진노 아래 놓이는 심판의 긴장을 보존해야 합니다.
  doctrine_reference: 원문 우선 번역 원칙; 심판-정화 이미지의 문맥 구분
