revisions:
- from: 보라, 내가 네가 행한 너의 부당한 이득을 향해 손바닥을 치고, 또 너의 한가운데에 있던 피 흘림을 향해서도 그렇게 합니다.[a][b]
  to: 보십시오, 내가 네가 얻은 너의 부당한 이득[a]과 네 한가운데에 있던 피 흘림[b] 때문에 내 손바닥을 쳤습니다.
  rationale: 손을 치는 몸짓과 두 고발 사유의 관계를 ‘때문에’로 바로잡고, 원문에 없는 ‘그렇게 합니다’를 삭제했습니다. ‘내 손바닥을 쳤습니다’는 כַּפִּי의 구체성을 유지하며, ‘부당한 이득’과 ‘피 흘림’은 각각 בֶּצַע와 דָּמִים의 문맥적 의미를 보존합니다. 각주 표지는 해당 어휘 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:43:14Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 두 전치사(אֶל, עַל)는 이 문맥에서 손뼉 치는 심판의 몸짓이 향하는 대상이라기보다 그 몸짓을 일으키는 고발 사유를 나타냅니다. 따라서 ‘이득을 향해 손바닥을 치고’는 한국어 의미와 원문의 관계를 모두 부정확하게 만듭니다. 또한 히브리어는 두 번째 절에서 ‘그렇게 한다’라는 별도 동사를 반복하지 않습니다.
  naturalness: ‘너의 부당한 이득을 향해 손바닥을 치고’는 현대 한국어에서 부자연스럽고, ‘향해서도 그렇게 합니다’는 원문에 없는 내용을 보충하며 시제와 문체도 앞 절과 어긋납니다. ‘…때문에 내 손바닥을 쳤습니다’가 자연스럽고 구체적 몸짓을 보존합니다.
  terminology: בֶּצַע는 ‘부당한 이득’으로, דָּמִים은 문맥상 ‘피 흘림’으로 옮기는 것이 적절합니다. 각주 b의 ‘피 흘림에 대한 책임’은 가능한 해석이지만, 어휘 대안으로는 ‘피의 죄책’이 원문의 집합적 피/유혈 및 죄책의 함의를 더 직접적으로 반영합니다.
  issues:
  - severity: high
    issue: 전치사구를 ‘…을 향해’로 번역함
    rationale: אֶל과 עַל은 손을 치는 동작의 직접적 목표를 뜻한다기보다, 불의한 이득과 유혈 때문에 일어나는 하나님의 심판적 분노의 몸짓과 관련됩니다. 한국어에서는 ‘…때문에’가 문맥과 관용을 가장 잘 전달합니다.
  - severity: high
    issue: ‘향해서도 그렇게 합니다’라는 반복 행위의 삽입
    rationale: 원문에는 두 번째 대상에 대해 별도의 ‘그렇게 한다’가 없으며, 단일한 손뼉 치는 몸짓의 사유가 두 병렬 명사구로 제시됩니다.
  - severity: medium
    issue: 현재형 ‘합니다’와 앞 절 연결의 불일치
    rationale: הִכֵּיתִי는 완료형이며 예언적 선언으로 생생한 현재로 처리할 여지는 있지만, 현 번역은 과거형 연결어 ‘있던’ 뒤에 현재형 ‘합니다’를 덧붙여 문장이 불안정합니다. 완료형을 ‘쳤습니다’로 일관되게 옮기는 것이 안전합니다.
