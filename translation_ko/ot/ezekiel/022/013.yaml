  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּה֙ הִכֵּ֣יתִי כַפִּ֔/י אֶל בִּצְעֵ֖/ךְ אֲשֶׁ֣ר עָשִׂ֑ית וְ/עַ֨ל דָּמֵ֔/ךְ אֲשֶׁ֥ר הָי֖וּ בְּ/תוֹכֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/013.yaml
  text: And behold[a], I strike my hand against your unjust gain that you have made[b], and against the bloodshed that has been in your midst.
  footnotes:
  - marker: a
    text: Or 'your dishonest gain' or 'your greed.' The Hebrew term can denote profit gained by injustice or violence.
    reason: lexical_alternative
  - marker: b
    text: Or 'your bloodguilt.' The Hebrew 'bloods' can refer collectively to acts of bloodshed and the guilt attached to them.
    reason: lexical_alternative
translation:
  language: ko
  text: 보라, 내가 네가 행한 너의 부당한 이득을 향해 손바닥을 치고, 또 너의 한가운데에 있던 피 흘림을 향해서도 그렇게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너의 부정한 이득’, ‘너의 탐욕’으로 옮길 수 있습니다. 히브리어는 불의나 폭력으로 얻은 이득을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너의 피 흘림에 대한 책임’으로 옮길 수 있습니다. 히브리어의 ‘피들’은 집단적 유혈 행위와 그에 따른 죄책을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보라
  alternatives_korean:
  - 이제 보라
  - 보십시오
  lexicon: HALOT
  rationale: 예언적 주의를 환기하는 감탄형을 살리기 위해 ‘보라’로 옮겼습니다.
- source_word: הִכֵּיתִי כַפִּי
  english_pob_choice: I strike my hand
  chosen_korean: 손바닥을 치고
  alternatives_korean:
  - 내 손을 치고
  - 내 손바닥을 맞부딪치고
  lexicon: HALOT
  rationale: כף의 신체적 제스처를 한국어에서 자연스럽게 드러내면서도, 심판의 몸짓이라는 구체성을 유지했습니다.
- source_word: בִּצְעֵךְ
  english_pob_choice: your unjust gain
  chosen_korean: 너의 부당한 이득
  alternatives_korean:
  - 너의 불의한 이득
  - 너의 부정한 이익
  - 너의 탐욕
  lexicon: HALOT
  rationale: בצע가 단순한 ‘이익’이 아니라 불의하게 얻은 이득을 가리키므로, 경제적 의미와 도덕적 평가를 함께 담는 표현을 택했습니다.
- source_word: דָּמֵךְ
  english_pob_choice: the bloodshed
  chosen_korean: 피 흘림
  alternatives_korean:
  - 피
  - 피 흘린 죄
  - 피 흘림과 그 죄책
  lexicon: HALOT
  rationale: 복수적 ‘피들’이 집단적 유혈과 그 책임까지 가리킬 수 있으므로, 도시 안의 폭력을 포괄하는 ‘피 흘림’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 손 제스처를 어떻게 옮길지
  chosen_reading: ‘손바닥을 치고’로 옮겨, 분노한 심판의 몸짓이라는 구체성을 살렸습니다.
  alternative_readings:
  - 손을 치고
  - 손바닥을 맞부딪치고
  - 손을 내리치고
  rationale: 본문은 추상적 선언이 아니라 예루살렘의 죄에 대한 가시적인 심판 행위를 그리므로, 제스처를 완화하지 않고 유지했습니다.
  doctrine_reference: 예언서의 의인화된 심판 표상
