source:
  edition: WLC
  text: עֶרְוַת אָ֖ב גִּלָּה בָ֑/ךְ טְמֵאַ֥ת הַ/נִּדָּ֖ה עִנּוּ בָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/010.yaml
  text: In you they uncover a father's nakedness[c][b][a]; in you they violate a woman in her menstrual impurity.
  footnotes:
  - marker: a
    text: Hebrew 'uncover a father's nakedness,' a Levitical idiom for illicit sexual relations; compare Lev 18:7.
    reason: cross_reference
  - marker: b
    text: 'Or ''among you.'' The Hebrew addresses Jerusalem as a woman/city: ''in you.'''
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the impurity of menstruation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 가운데서 아버지의 알몸을 드러내며, 너희 가운데서 여인의 월경 부정을 범합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아버지의 알몸을 드러내다’는 레위기의 성적 금기 관용구로, 불법한 성관계를 가리킵니다. 레 18:7 참조.
    reason: cross_reference
  - marker: b
    text: 또는 ‘너희 가운데서’. 히브리어는 예루살렘을 여자/도시로 부르며 ‘너희 안에서’라고 말합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘월경의 부정’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת אָב
  english_pob_choice: a father's nakedness
  chosen_korean: 아버지의 알몸
  alternatives_korean:
  - 아버지의 벌거벗음
  - 아버지의 나체
  lexicon: HALOT
  rationale: 히브리어의 관용구를 살리되, 한국어에서는 ‘알몸’이 성적 수치와 노출의 의미를 가장 자연스럽게 전달합니다.
- source_word: גִּלָּה
  english_pob_choice: they uncover
  chosen_korean: 드러내며
  alternatives_korean:
  - 벗기며
  - 폭로하며
  lexicon: HALOT
  rationale: 성적 문맥에서 ‘드러내다’가 ‘알몸을 드러내다’라는 관용 표현과 맞물려 원문의 동작을 무리 없이 옮깁니다.
- source_word: בָךְ
  english_pob_choice: in you
  chosen_korean: 너희 가운데서
  alternatives_korean:
  - 너희 안에서
  - 너희 중에서
  lexicon: HALOT
  rationale: 예루살렘을 여성화된 공동체로 부르는 직접 호소를 유지하면서, 집단 내부에서 벌어지는 죄라는 의미를 한국어로 자연스럽게 드러냅니다.
- source_word: טְמֵאַת הַנִּדָּה
  english_pob_choice: a woman in her menstrual impurity
  chosen_korean: 여인의 월경 부정
  alternatives_korean:
  - 월경의 부정함
  - 생리 부정
  lexicon: HALOT
  rationale: 의례적 부정을 가리키는 표현이므로 ‘부정’으로 옮기고, ‘월경’으로 그 구체적 상태를 분명히 했습니다.
- source_word: עִנּוּ
  english_pob_choice: they violate
  chosen_korean: 범합니다
  alternatives_korean:
  - 학대합니다
  - 괴롭힙니다
  - 유린합니다
  lexicon: HALOT
  rationale: 이 성적 문맥에서는 단순한 ‘괴롭히다’보다 성적 침해를 포함하는 ‘범하다’가 원문의 중대성을 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 히브리 관용구를 직역에 가깝게 유지할지 여부
  chosen_reading: ‘아버지의 알몸을 드러내다’라는 표현을 본문에 유지해 레위기적 성적 금기와의 연관성을 보존했습니다.
  alternative_readings:
  - ‘아버지의 아내와 간음하다’처럼 풀어 쓰기
  - ‘근친상간을 저지르다’로 요약하기
  rationale: 원문은 특정 법적 관용구를 사용하므로, 해석을 과도하게 확정하기보다 사본의 표현 자체를 보존하는 편이 문맥과 상호본문성을 더 잘 살립니다.
  doctrine_reference: 레위기 18장 성윤리 규정과의 상호본문성
- issue: 여성화된 예루살렘에 대한 2인칭 직접 호소
  chosen_reading: ‘너희 가운데서’로 반복해 공동체 내부의 죄를 드러내되, 예루살렘을 향한 예언자적 고발의 직접성을 유지했습니다.
  alternative_readings:
  - ‘그들 가운데서’
  - ‘당신 안에서’
  rationale: 히브리어 2인칭 여성 단수의 도시-인격화를 반영하면서도, 한국어에서는 복수처럼 들릴 수 있는 문맥을 살려 공동체적 책임을 드러내는 표현을 택했습니다.
  doctrine_reference: 예언서의 도시 인격화 및 언약 공동체 책임
