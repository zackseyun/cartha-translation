  text: עֶרְוַת אָ֖ב גִּלָּה בָ֑/ךְ טְמֵאַ֥ת הַ/נִּדָּ֖ה עִנּוּ בָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/010.yaml
  text: In you they uncover a father's nakedness[c][b][a]; in you they violate a woman in her menstrual impurity.
  footnotes:
  - marker: a
    text: Hebrew 'uncover a father's nakedness,' a Levitical idiom for illicit sexual relations; compare Lev 18:7.
    reason: cross_reference
  - marker: b
    text: 'Or ''among you.'' The Hebrew addresses Jerusalem as a woman/city: ''in you.'''
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the impurity of menstruation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 안에서 아버지의 알몸을 드러내고, 월경 부정 중인 여자를 욕보입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아버지의 알몸을 드러내다’는 레위기의 성적 금기 관용구로, 불법한 성관계를 가리킵니다. 레 18:7 참조.
    reason: cross_reference
  - marker: b
    text: 또는 ‘네 가운데서’. 히브리어는 예루살렘을 여자/도시로 부르며 ‘네 안에서’라고 말합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘월경의 부정’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת אָב
  english_pob_choice: a father's nakedness
  chosen_korean: 아버지의 알몸
  alternatives_korean:
  - 아버지의 벌거벗음
  - 아버지의 나체
  lexicon: HALOT
  rationale: 히브리어의 관용구를 살리되, 한국어에서는 ‘알몸’이 성적 수치와 노출의 의미를 가장 자연스럽게 전달합니다.
- source_word: גִּלָּה
