id: EZK.22.12
reference: Ezekiel 22:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שֹׁ֥חַד לָֽקְחוּ בָ֖/ךְ לְמַ֣עַן שְׁפָךְ דָּ֑ם נֶ֧שֶׁךְ וְ/תַרְבִּ֣ית לָקַ֗חַתְּ וַ/תְּבַצְּעִ֤י רֵעַ֨יִ/ךְ֙ בַּ/עֹ֔שֶׁק וְ/אֹתִ֣/י שָׁכַ֔חַתְּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/012.yaml
  text: In you they have taken bribes to shed blood; you have taken interest and profit[a], and you have extorted your neighbors by oppression, and you have forgotten me, declares the Lord GOD.
  footnotes:
  - marker: a
    text: 'Or ''usury and increase.'' The Hebrew uses two related terms for profit from lending: ''interest'' (נֶשֶׁךְ) and ''profit/increase'' (תַרְבִּית).'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 가운데서 사람들은 피를 흘리려고 뇌물을 받았고, 당신은 이자와 이윤을 챙겼으며[a], 폭력으로 당신의 이웃들을 착취하였고, 또 나를 잊어버렸습니다. 주 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이자와 증식’입니다. 히브리어는 대출로 얻는 이익을 가리키는 서로 관련된 두 용어, 곧 ‘이자’(נֶשֶׁךְ)와 ‘이윤/증식’(תַרְבִּית)을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  english_pob_choice: bribes
  chosen_korean: 뇌물
  alternatives_korean:
  - 뇌물을
  - 뇌물수수
  lexicon: HALOT
  rationale: בָךְ로 이어지는 공동체 내부의 부패를 드러내므로, 단순한 ‘뇌물’이 문맥과 가장 잘 맞습니다.
- source_word: נֶשֶׁךְ וְתַרְבִּית
  english_pob_choice: interest and profit
  chosen_korean: 이자와 이윤
  alternatives_korean:
  - 이자와 수익
  - 고리와 증식
  lexicon: HALOT
  rationale: 두 관련 용어의 병렬을 살리되, 현대 한국어에서 이해되는 경제 용어로 옮겨 착취적 대출 이익을 드러냈습니다.
- source_word: וַתְּבַצְּעִי רֵעַיִךְ בָּעֹשֶׁק
  english_pob_choice: you have extorted your neighbors by oppression
  chosen_korean: 폭력으로 당신의 이웃들을 착취하였고
  alternatives_korean:
  - 억압으로 당신의 이웃들을 착취하였고
  - 부당하게 당신의 이웃들을 빼앗았고
  lexicon: HALOT
  rationale: בצע는 부당한 이득을 취하는 의미이므로 ‘착취하다’로 옮기고, בָּעֹשֶׁק은 수단의 성격을 드러내는 ‘폭력으로’로 처리했습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 야훼의 말씀입니다
  alternatives_korean:
  - 주 하나님 야훼의 말씀입니다
  - 주 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언 종결 공식을 한국어 선언문체로 자연스럽게 옮기면서, מקור의 신명기적 이름을 ‘야훼’로 보존했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: ‘야훼’로 직역하여 언약 이름을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 본문은 אדני + יהוה 결합형이므로, 독자가 고유한 언약 이름을 인지하도록 ‘야훼’를 유지하는 것이 원문 충실성에 유리합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה / YHWH → 야훼'
