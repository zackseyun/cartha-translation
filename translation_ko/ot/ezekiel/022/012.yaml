    rationale: עֹשֶׁק은 억압, 부당한 착취, 갈취를 가리킵니다. 물리적 폭력으로 한정하는 ‘폭력’은 의미 범위를 좁힙니다.
  revised_text: 당신 안에서 사람들이 피를 흘리려고 뇌물을 받았고, 당신은 이자와 이윤을 취하였으며[a], 억압으로 당신의 이웃들을 착취하였고, 또 나를 잊어버렸습니다. 주 야훼의 말씀입니다.
