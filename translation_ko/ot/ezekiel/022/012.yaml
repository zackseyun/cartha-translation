  verdict: revise
  source_fidelity: 첫 절의 בָךְ는 예루살렘을 여성 단수 ‘당신’으로 부르는 표현이므로, ‘그들 가운데서 사람들은’은 원문의 인칭과 화자를 불필요하게 바꿉니다. ‘당신 안에서 사람들이’로 옮겨야 합니다. 또한 בָּעֹשֶׁק은 ‘폭력’보다 억압·부당한 착취/갈취를 뜻하므로 ‘억압으로’가 더 충실합니다.
  naturalness: ‘당신 안에서 사람들이’는 도시를 인격화하여 고발하는 예언 문맥을 자연스럽게 유지합니다. ‘이자와 이윤을 취하였으며’와 ‘억압으로 … 착취하였고’는 현대 표준 한국어의 격식 있는 성경 문체에 맞습니다.
  terminology: שֹׁחַד은 ‘뇌물’, נֶשֶׁךְ וְתַרְבִּית은 구별을 보존하여 ‘이자와 이윤’으로 유지할 수 있습니다. אֲדֹנָי יְהוִה는 주어진 명명 방침에 따라 ‘주 야훼’로 유지합니다. נְאֻם의 선언 공식은 ‘주 야훼의 말씀입니다’로 적절합니다.
  issues:
