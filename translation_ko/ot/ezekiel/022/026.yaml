  edition: WLC
  text: כֹּהֲנֶ֜י/הָ חָמְס֣וּ תוֹרָתִ/י֮ וַ/יְחַלְּל֣וּ קָדָשַׁ/י֒ בֵּֽין קֹ֤דֶשׁ לְ/חֹל֙ לֹ֣א הִבְדִּ֔ילוּ וּ/בֵין הַ/טָּמֵ֥א לְ/טָה֖וֹר לֹ֣א הוֹדִ֑יעוּ וּ/מִ/שַׁבְּתוֹתַ/י֙ הֶעְלִ֣ימוּ עֵֽינֵי/הֶ֔ם וָ/אֵחַ֖ל בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/026.yaml
  text: Her priests have done violence to my law and have profaned my holy things[a]. They have not distinguished between the holy and the common, and they have not made known the difference between the unclean and the clean. They have hidden their eyes from my Sabbaths[b], and I have been profaned among them.
  footnotes:
  - marker: a
    text: Or 'between the holy and the profane.' The Hebrew term here more precisely means what is common or ordinary, in contrast to what is holy.
    reason: lexical_alternative
  - marker: b
    text: Or 'I was profaned in their midst.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍의 제사장들은 내 율법을 유린하고 내 거룩한 것들을 모독했습니다. 그들은 거룩한 것과 속된 것을 구별하지 않았으며[a], 부정한 것과 정한 것의 구별을 알려 주지 않았습니다. 그들은 내 안식일들을 외면했고, 나는 그들 가운데서 모독을 받았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 것과 일반적인 것’을. 여기서 히브리어 ‘속된 것’은 거룩한 것과 대조되는 일반적·일상적인 것을 뜻하며, 단순히 악한 것을 뜻하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나는 그들 한가운데서 모독을 받았습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמְסוּ
  english_pob_choice: have done violence to
  chosen_korean: 폭력을 행사하고
  alternatives_korean:
  - 유린하고
  - 폭행하고
  lexicon: HALOT
  rationale: חמס는 단순한 ‘어기다’보다 강한 폭력적 침해를 뜻하므로, 제사장들의 율법 대우가 파괴적이고 가해적이라는 점을 살리기 위해 ‘폭력을 행사하고’로 옮겼습니다.
- source_word: תוֹרָתִי
  english_pob_choice: my law
  chosen_korean: 내 율법
  alternatives_korean:
  - 내 교훈
  - 내 토라
  lexicon: HALOT
  rationale: 이 문맥은 제사장의 가르침과 판별 책임을 꾸짖는 자리이므로, 한국어에서는 간결하고 문맥에 맞는 ‘율법’이 가장 자연스럽습니다.
- source_word: בֵּין קֹדֶשׁ לְחֹל
  english_pob_choice: between the holy and the common
  chosen_korean: 거룩한 것과 일반적인 것
  alternatives_korean:
  - 거룩한 것과 속된 것
  - 거룩한 것과 보통의 것
  lexicon: HALOT
  rationale: חֹל은 도덕적으로 ‘악한’ 것이라기보다 ‘일반적·일상적’인 것을 가리키므로, ‘일반적인 것’이 성결 범주 대비를 더 정확하게 드러냅니다.
- source_word: הוֹדִיעוּ
  english_pob_choice: have not made known the difference
  chosen_korean: 차이를 알게 하지 않았습니다
  alternatives_korean:
  - 차이를 알려 주지 않았습니다
  - 구별을 가르치지 않았습니다
  lexicon: HALOT
  rationale: 동사의 기본 의미는 ‘알게 하다’이므로, 제사장들의 교육적 실패를 드러내면서도 원문 동작을 직접 반영하는 표현으로 옮겼습니다.
- source_word: וָאֵחַל
  english_pob_choice: I have been profaned
  chosen_korean: 나는 그들 가운데서 더럽혀졌습니다
  alternatives_korean:
  - 나는 그들 가운데서 profaned 되었습니다
  - 나는 그들 가운데서 모독을 당했습니다
  lexicon: HALOT
  rationale: 문맥상 야훼의 거룩함이 공동체 안에서 훼손된 결과를 말하므로, 수동적 결과를 자연스러운 한국어로 나타내기 위해 ‘더럽혀졌습니다’를 택했습니다.
theological_decisions:
- issue: ‘거룩한 것’과 ‘일반적인 것’의 대비
  chosen_reading: 의례적·성결적 구분을 보존하되, ‘일반적인 것’으로 번역해 도덕적 악과 동일시하지 않았습니다.
  alternative_readings:
  - 거룩한 것과 속된 것
  - 거룩한 것과 보통의 것
  rationale: 본문은 제사장 직무의 성결 분별 실패를 고발하는 것이므로, ‘속된’처럼 도덕적 비난이 강한 말보다 원문의 범주적 대비를 살리는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: וָאֵחַל의 결과적 수동성
  chosen_reading: ‘나는 그들 가운데서 더럽혀졌습니다’로 옮겨, 백성 가운데서 하나님의 거룩함이 침해된 결과를 드러냈습니다.
  alternative_readings:
  - ‘나는 그들 가운데서 더럽혀졌습니다’의 보다 강한 모독 뉘앙스
  - ‘나는 그들 가운데서 속되게 여겨졌습니다’
  rationale: 문맥은 제사장들의 실패가 하나님을 공동체 안에서 더럽히는 결과를 낳았다는 진술이므로, 과도한 해석 없이 수동적 결과를 분명하게 표현했습니다.
  doctrine_reference: Translation philosophy §1, §3
