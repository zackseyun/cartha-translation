    issue: ‘내 율법에 폭력을 행사하고’
    rationale: חמס의 강한 침해를 살리려는 의도는 타당하지만, 한국어에서 법에 ‘폭력을 행사하다’는 결합은 부자연스럽습니다. ‘내 율법을 유린하고’가 비유적 폭력성과 자연스러움을 함께 보존합니다.
  - severity: medium
    issue: חלל을 ‘더럽혔습니다/더럽혀졌습니다’로 번역
    rationale: 본문에는 이미 טמא/טהור(부정/정함)의 범주가 있으므로 ‘더럽히다’는 의례적 부정과 혼동될 수 있습니다. 하나님 및 성물의 거룩함을 침해한다는 뜻에는 ‘모독하다’가 더 직접적입니다.
