    rationale: 각주는 ‘거룩한 것과 속된 것’이라는 대조, 특히 חֹל의 의미를 설명합니다. 현재 ‘내 거룩한 것들’ 뒤에 붙어 있어 설명 대상과 맞지 않으므로 해당 대조 뒤로 옮겨야 합니다.
  - severity: low
    issue: 각주 b가 본문과 실질적으로 동일함
    rationale: 본문의 ‘그들 가운데서’와 각주의 ‘그들 가운데서’는 대안이 되지 않습니다. ‘그들 한가운데서’처럼 직역적 공간 표현을 제시하면 영어 감사 기록의 대안 기능을 유지할 수 있습니다.
