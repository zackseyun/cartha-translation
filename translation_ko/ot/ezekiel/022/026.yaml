revisions:
- from: 그의 제사장들은 내 율법에 폭력을 행사하고 내 거룩한 것들을 더럽혔습니다[a]. 그들은 거룩한 것과 일반적인 것을 구별하지 않았으며, 부정한 것과 정한 것의 차이를 알게 하지 않았습니다. 그들은 내 안식일들[b]에서 눈을 가렸고, 나는 그들 가운데서 더럽혀졌습니다.
  to: 그 성읍의 제사장들은 내 율법을 유린하고 내 거룩한 것들을 모독했습니다. 그들은 거룩한 것과 속된 것을 구별하지 않았으며[a], 부정한 것과 정한 것의 구별을 알려 주지 않았습니다. 그들은 내 안식일들을 외면했고, 나는 그들 가운데서 모독을 받았습니다[b].
  rationale: 원문의 강한 고발, 제의적 성결 범주, 수동적 결론을 유지하면서 현대 한국어의 자연스러운 결합을 사용했습니다. ‘속된 것’은 전통적 성결 용어로 쓰되, 도덕적 악이라는 오해를 막기 위해 각주에서 의미를 한정했습니다. 각주 a의 앵커를 실제 설명 대상에 맞게 옮기고, 각주 b가 본문과 구별되는 실제 대안을 제공하도록 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:40:50Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 고발 구조와 제의적 구별 범주는 대체로 반영되었으나, ‘율법에 폭력을 행사하다’는 한국어 결합이 부자연스럽고, חלל의 의미를 ‘더럽히다’로 일관되게 옮기면 의례적 부정과 혼동될 수 있습니다. 또한 ‘눈을 가렸다’는 원문의 ‘눈을 숨기다’라는 관용구가 뜻하는 의도적 외면을 충분히 전달하지 못합니다.
  naturalness: ‘거룩한 것과 일반적인 것’ 및 ‘차이를 알게 하지 않았습니다’는 현대 표준 한국어에서 다소 어색합니다. ‘거룩한 것과 속된 것’, ‘구별을 알려 주지 않았습니다’, ‘안식일들을 외면했습니다’가 문맥과 합쇼체에 더 자연스럽습니다.
  terminology: ‘율법’, ‘거룩한 것’, ‘부정한 것과 정한 것’, ‘안식일들’은 적절합니다. 다만 하나님과 거룩한 것의 훼손에는 ‘모독하다/모독을 받다’가 ‘더럽히다’보다 정확하며, חֹל은 각주로 ‘속된 것’이 도덕적 악을 뜻하지 않음을 밝혀야 합니다.
  issues:
