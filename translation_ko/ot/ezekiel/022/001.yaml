  - 메시지
  lexicon: HALOT
  rationale: 예언적 공식인 ‘여호와의 말씀’에 해당하는 표준적이고 문맥상 정확한 표현입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
