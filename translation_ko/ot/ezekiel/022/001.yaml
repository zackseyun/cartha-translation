- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥상 신적 고유명사를 직접 가리키므로, 전통적 대체어인 ‘주’ 대신 프로젝트 기본값인 ‘야훼’로 옮겼습니다.
- source_word: אֵלַי
