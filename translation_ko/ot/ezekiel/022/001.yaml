  lexicon: HALOT
  rationale: 문맥상 신적 고유명사를 직접 가리키므로, 전통적 대체어인 ‘주’ 대신 프로젝트 기본값인 ‘야훼’로 옮겼습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내게로
  lexicon: HALOT
  rationale: 히브리어 전치사+인칭접미사가 예언자에게 향한 방향을 나타내므로, 현대 한국어에서 자연스러운 ‘내게’로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시기를
  - 말하여
  lexicon: HALOT
  rationale: 직접화법을 여는 예언 공식이므로, 뒤의 인용절을 준비하는 자연스러운 서술로 처리했습니다.
theological_decisions:
