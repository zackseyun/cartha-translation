- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시기를
  - 말하여
  lexicon: HALOT
  rationale: 직접화법을 여는 예언 공식이므로, 뒤의 인용절을 준비하는 자연스러운 서술로 처리했습니다.
