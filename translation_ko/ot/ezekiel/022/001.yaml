    rationale: 이 표현은 다음 절의 발화를 여는 ‘말씀하시기를’과 달리 절을 종결시키며, 문법적으로는 ‘야훼의 말씀’이 말한 것으로도 읽힐 수 있습니다.
  revised_text: 야훼의 말씀이 내게 임했습니다. 말씀하시기를,
