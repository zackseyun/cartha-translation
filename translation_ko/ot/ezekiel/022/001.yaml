  naturalness: ‘야훼의 말씀이 내게 임했습니다. 말씀하시기를,’은 한국어 성경 문체에서 자연스럽고, 직접 인용이 다음 절에서 계속됨을 명확히 합니다.
  terminology: ‘야훼’, ‘말씀’, ‘내게’, ‘임했습니다’는 원문과 프로젝트 용례에 적절합니다. 각주에서는 YHWH의 전통적 한국어 표기인 ‘여호와’를 명시하고, 본문 선택인 ‘야훼’와의 관계를 간결하게 밝혔습니다.
