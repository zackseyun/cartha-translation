  - 이르렀습니다
  lexicon: HALOT
  rationale: 히브리어 서술 개시 관용구로서, 예언자에게 ‘말씀이 ... 임하다’는 한국어 성경 어법이 자연스럽고 원문의 사건 개시 기능을 잘 드러냅니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
