  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֛עַן הֱי֥וֹת כֻּלְּ/כֶ֖ם לְ/סִגִ֑ים לָ/כֵן֙ הִנְ/נִ֣י קֹבֵ֣ץ אֶתְ/כֶ֔ם אֶל תּ֖וֹךְ יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/019.yaml
  text: 'Therefore thus says the Lord GOD: Because all of you have become dross[a], therefore behold, I am gathering you into the midst of Jerusalem.'
  footnotes:
  - marker: a
    text: Or 'slag' or 'metal impurities.' The Hebrew refers to the waste material separated from metal in smelting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. “너희가 모두 찌꺼기가 되었으므로, 그러므로 보라, 내가 너희를 예루살렘 한가운데로 모으겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 금을 제련할 때 걸러지는 금속 찌꺼기, 곧 불순물이나 슬래그를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 합쇼체 예언문에서는 אֲדֹנָי와 야훼를 함께 살리되, 본 프로젝트의 기본값에 따라 יְהוִה는 ‘야훼’로 옮기고, אֲדֹנָי의 주권성은 ‘주’로 드러냈습니다.
- source_word: לְסִגִים
  english_pob_choice: dross
  chosen_korean: 찌꺼기
  alternatives_korean:
  - 드로스
  - 불순물
  lexicon: HALOT
  rationale: 금속 제련에서 제거되는 폐기물을 가리키는 비유를 한국어로 자연스럽게 살리기 위해 ‘찌꺼기’를 택했습니다. 본문의 판단적 이미지도 유지됩니다.
- source_word: קֹבֵץ אֶתְכֶם
  english_pob_choice: am gathering you
  chosen_korean: 너희를 모으겠습니다
  alternatives_korean:
  - 너희를 모으고 있습니다
  - 너희를 모을 것입니다
  lexicon: HALOT
  rationale: 예언적 확정 미래의 뉘앙스를 살리면서도 한국어 예언 선언문에 자연스러운 공손한 미래형으로 옮겼습니다.
- source_word: אֶל תּוֹךְ יְרוּשָׁלִָם
  english_pob_choice: into the midst of Jerusalem
  chosen_korean: 예루살렘 한가운데로
  alternatives_korean:
  - 예루살렘 가운데로
  - 예루살렘 안으로
  lexicon: HALOT
  rationale: תּוֹךְ의 ‘가운데/한가운데’라는 공간적 이미지를 유지해, 단순히 ‘예루살렘 안으로’로 평탄화하지 않았습니다.
theological_decisions:
- issue: 예언 심판 선언에서의 화자 표지와 존칭
  chosen_reading: ‘주 야훼께서 이렇게 말씀하십니다’로 시작해 선지자적 심판 어조를 유지했습니다.
  alternative_readings:
  - ‘주 하나님께서 말씀하십니다’
  - 직접 인용 없이 서술형으로 완화
  rationale: 원문의 단호한 선언 공식(כֹּה אָמַר)과 신적 권위를 분명히 드러내기 위해 예언문 표지를 보존했습니다.
  doctrine_reference: '예언서 번역 원칙: 신탁 공식과 하나님의 직접 발화를 약화시키지 않음'
