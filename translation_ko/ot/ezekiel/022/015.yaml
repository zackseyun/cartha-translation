    text: 또는 ‘네 부정을 네게서 없애겠다’ 또는 ‘네 안의 부정을 끝내겠다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲפִיצוֹתִי
  english_pob_choice: I will scatter
  chosen_korean: 흩고
  alternatives_korean:
  - 흩겠습니다
  - 분산시키겠습니다
  - 흩어 버리겠습니다
  lexicon: HALOT
  rationale: 심판 맥락의 분산·추방 이미지를 살려 ‘흩다’를 기본으로 두었고, 뒤의 ‘흩어 버리며’와 평행을 이루도록 간결하게 옮겼습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 민족들 가운데로
  alternatives_korean:
  - 열국 가운데로
  - 나라들 가운데로
  - 이방 민족들 가운데로
  lexicon: HALOT
  rationale: 여기서는 포로가 될 대상의 외국 정치체를 가리키므로, 전통 교회어인 ‘이방인’보다 ‘민족들’이 원문 범위를 더 정확히 반영합니다.
- source_word: וְזֵרִיתִיךְ
  english_pob_choice: and disperse you
  chosen_korean: 흩어 버리며
  alternatives_korean:
  - 분산시키며
  - 키질하듯 흩으며
  - 뿌리며
  lexicon: HALOT
  rationale: זרה의 ‘흩다/키질하다’는 의미를 살리되, 앞 절의 동사와 중복을 피하고 한국어 문맥에서 자연스러운 ‘흩어 버리다’를 택했습니다.
- source_word: טֻמְאָתֵךְ מִמֵּךְ
  english_pob_choice: your uncleanness from you
  chosen_korean: 너희의 더러움을 너희에게서 깨끗하게 제거하겠습니다
  alternatives_korean:
  - 너희의 부정을 너희에게서 없애겠습니다
  - 너희의 부정함을 너희에게서 제거하겠습니다
  - 너희의 불결함을 너희에게서 씻어 내겠습니다
  lexicon: HALOT
  rationale: טֻמְאָה는 의례적·도덕적 부정을 함께 담을 수 있어 ‘더러움’으로 넓게 옮겼고, וַהֲתִמֹּתִי의 결과를 ‘깨끗하게 제거하다’로 풀어 심판을 통한 정결의 의미를 드러냈습니다.
theological_decisions:
- issue: 심판과 정결의 관계
  chosen_reading: 포로로 흩으시는 심판 자체가 더러움을 제거하는 정결의 행위로 제시되므로, 본문은 징벌과 정결을 분리하지 않고 함께 유지했습니다.
  alternative_readings:
  - 심판만 강조하는 읽기
  - 정결만 강조하는 읽기
  rationale: 히브리어 동사와 목적어가 ‘더러움의 제거’를 직접 말하므로, 심판이 곧 정결의 수단이 된다는 긴장을 그대로 보존하는 것이 본문에 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
