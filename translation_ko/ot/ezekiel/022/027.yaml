id: EZK.22.27
reference: Ezekiel 22:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׂרֶ֣י/הָ בְ/קִרְבָּ֔/הּ כִּ/זְאֵבִ֖ים טֹ֣רְפֵי טָ֑רֶף לִ/שְׁפָּךְ דָּם֙ לְ/אַבֵּ֣ד נְפָשׁ֔וֹת לְמַ֖עַן בְּצֹ֥עַ בָּֽצַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/027.yaml
  text: Her princes within her are like wolves tearing prey[a], to shed blood, to destroy lives[b], in order to gain dishonest profit.
  footnotes:
  - marker: a
    text: Or 'to destroy persons' or 'to destroy souls'; Hebrew nephashot can denote persons, lives, or souls depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'to make unjust gain' or 'to gain by extortion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 방백들은 그들 가운데 있는 이리와 같아서, 피를 흘리게 하고, 생명들을 멸하며[a], 불의한 이득을 얻으려 합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람들을 멸하며’, ‘영혼들을 멸하며’로도 옮길 수 있습니다. 히브리어 네페쉬는 문맥에 따라 사람, 생명, 영혼을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘부정한 이득을 얻으려 합니다’, ‘착취로 이득을 얻으려 합니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֶיהָ
  english_pob_choice: her princes
  chosen_korean: 그의 방백들
  alternatives_korean:
  - 그의 지도자들
  - 그의 관리들
  lexicon: HALOT
  rationale: שַׂר는 통치자·방백·관리의 뜻을 가지지만, 이 문맥의 예언적 고발에서는 정치적 권력층을 가리키는 ‘방백들’이 가장 직접적입니다.
- source_word: בְּקִרְבָּהּ
  english_pob_choice: within her
  chosen_korean: 그들 가운데
  alternatives_korean:
  - 그의 한가운데
  - 그 안에
  lexicon: HALOT
  rationale: 도시/공동체 내부의 부패를 가리키는 표현이므로 ‘가운데’가 ‘within her’의 공간적·공동체적 뉘앙스를 자연스럽게 살립니다.
- source_word: לְאַבֵּד נְפָשׁוֹת
  english_pob_choice: to destroy lives
  chosen_korean: 생명들을 멸하며
  alternatives_korean:
  - 사람들을 멸하며
  - 영혼들을 멸하며
  lexicon: HALOT
  rationale: נֶפֶשׁ은 여기서 형이상학적 ‘영혼’보다 구체적인 생명/생존자를 뜻하므로, POB의 ‘lives’를 따라 ‘생명들’로 옮기고 파괴성을 살리기 위해 ‘멸하다’를 썼습니다.
- source_word: בְּצֹעַ בָּצַע
  english_pob_choice: to gain dishonest profit
  chosen_korean: 불의한 이득을 얻으려 합니다
  alternatives_korean:
  - 부정한 이익을 얻으려 합니다
  - 착취로 이득을 얻으려 합니다
  lexicon: HALOT
  rationale: בָּצַע는 단순한 이득이 아니라 부정하고 탐욕스러운 이득을 가리키므로, ‘불의한 이득’이 의미를 직설적으로 드러냅니다.
theological_decisions:
- issue: נְפָשׁוֹת의 번역이 ‘생명’인가 ‘사람들’인가
  chosen_reading: ‘생명들’로 번역하여 시민들의 실제 생명이 파괴되는 현실을 드러냅니다.
  alternative_readings:
  - 사람들
  - 영혼들
  rationale: 본문은 통치자들의 폭력과 유혈을 고발하는 사회윤리적 문맥이므로, 인간의 불멸 영혼에 대한 교리보다 실제 생명의 파괴를 가리키는 것으로 읽는 것이 적절합니다.
  doctrine_reference: 문맥 우선 원칙; 본문이 말하지 않는 인간론 교리를 덧씌우지 않습니다.
