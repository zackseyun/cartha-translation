id: EZK.22.5
reference: Ezekiel 22:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/קְּרֹב֛וֹת וְ/הָ/רְחֹק֥וֹת מִמֵּ֖/ךְ יִתְקַלְּסוּ בָ֑/ךְ טְמֵאַ֣ת הַ/שֵּׁ֔ם רַבַּ֖ת הַ/מְּהוּמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/005.yaml
  text: Those who are near and those who are far from you will mock you[a], defiled of name[b], full of turmoil.
  footnotes:
  - marker: a
    text: Or 'unclean in reputation,' 'whose name is defiled,' or more literally 'defiled of name.' The Hebrew phrase is compressed and may refer to Jerusalem's polluted reputation.
    reason: lexical_alternative
  - marker: b
    text: Or 'full of confusion,' 'full of uproar,' or 'abounding in disorder.'
    reason: lexical_alternative
translation:
  language: ko
  text: 가까운 자들과 멀리 있는 자들이 다 너를 비웃을 것입니다. 이름이 더럽혀진 자여, 소란이 가득합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘더럽혀진 자여’, ‘평판이 더럽혀진 자여’, 또는 더 문자적으로는 ‘이름이 더럽혀진 자여’로도 옮길 수 있습니다. 히브리어 구문이 압축되어 있어, 예루살렘의 더럽혀진 명성을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘혼란이 가득합니다’, ‘요란함이 가득합니다’, 또는 ‘무질서가 넘칩니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרֹבוֹת וְהָרְחֹקוֹת
  english_pob_choice: those who are near and those who are far
  chosen_korean: 가까운 자들과 멀리 있는 자들
  alternatives_korean:
  - 가까이 있는 자들과 멀리 있는 자들
  - 가까운 이들과 먼 이들
  lexicon: HALOT
  rationale: 평행 구조를 살리면서도 현대 한국어에서 자연스럽게 읽히는 대칭 표현으로 옮겼습니다.
- source_word: יִתְקַלְּסוּ בָךְ
  english_pob_choice: will mock you
  chosen_korean: 너를 비웃을 것입니다
  alternatives_korean:
  - 너를 조롱할 것입니다
  - 너를 희롱할 것입니다
  lexicon: HALOT
  rationale: 히트파엘 동사의 조소·모욕 의미를 살리되, 한국어에서 가장 직접적이고 자연스러운 ‘비웃다’를 택했습니다.
- source_word: טְמֵאַת הַשֵּׁם
  english_pob_choice: defiled of name
  chosen_korean: 이름이 더럽혀진 자여
  alternatives_korean:
  - 명예가 더럽혀진 자여
  - 이름이 부정하게 된 자여
  - 오염된 이름의 자여
  lexicon: HALOT
  rationale: 히브리어의 압축된 구문을 지나치게 풀지 않고, ‘이름’과 ‘더럽혀짐’을 유지해 수치스러운 평판이라는 긴장을 드러냈습니다.
- source_word: רַבַּת הַמְּהוּמָה
  english_pob_choice: full of turmoil
  chosen_korean: 소란이 가득합니다
  alternatives_korean:
  - 혼란이 가득합니다
  - 요란함이 가득합니다
  - 소란으로 가득합니다
  lexicon: HALOT
  rationale: מְהוּמָה의 난동·소란·혼란의 폭넓은 뜻을 반영하면서, 문맥상 도시의 혼란스러운 상태를 간명하게 표현했습니다.
theological_decisions:
- issue: טְמֵאַת הַשֵּׁם의 압축된 수치 표현을 어떻게 한국어로 드러낼지
  chosen_reading: ‘이름이 더럽혀진 자여’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘평판이 더럽혀진 자여’
  - ‘이름이 더럽혀진 평판의 자여’
  - ‘더럽혀진 이름의 자여’
  rationale: 예언적 조롱의 강도를 약화시키지 않기 위해, 의미를 설명적으로 풀기보다 압축성을 살렸습니다. 다만 한국어 관용을 고려해 ‘더럽혀진’으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: 도시/예루살렘을 본문에 명시할지 여부
  chosen_reading: 본문은 2인칭 ‘너’와 여성형 수사를 유지했습니다.
  alternative_readings:
  - ‘예루살렘아, 너를 비웃을 것입니다’
  - ‘도시여, 이름이 더럽혀진 자여’
  rationale: 앞뒤 문맥이 대상을 이미 식별하므로, 원문에 없는 명시를 덧붙이지 않았습니다. 수사적 호칭은 한국어에서 ‘자여’로 처리해 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
