revisions:
- from: 가까운 자들과 멀리 있는 자들이 다 너를 비웃을 것입니다. 이름이 더럽혀진 자여, 소란이 가득합니다.[a][b]
  to: 가까운 자들과 너에게서 먼 자들이 너를 비웃을 것입니다. 이름이 더럽혀진 자여[a], 소란이 가득한 자여[b]!
  rationale: 원문의 ‘가까운/먼’ 대조에서 ‘너에게서’라는 기준점을 복원했습니다. 두 개의 여성형 묘사구를 모두 호격으로 옮겨 예루살렘을 향한 예언적 비난의 병렬 구조를 보존했으며, 각주 표지를 실제 설명 대상에 붙였습니다. ‘이름이 더럽혀진’은 히브리어의 압축된 표현을 과도하게 특정 해석으로 풀지 않는 안전한 번역입니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:40:48Z'
review_pass:
  verdict: revise
  source_fidelity: ‘멀리 있는 자들’은 מִמֵּךְ(‘너에게서/너로부터’)의 기준점을 충분히 드러내지 못합니다. 또한 רַבַּת הַמְּהוּמָה는 도시를 수식하는 명사구인데, 초안의 ‘소란이 가득합니다’는 독립 서술문이 되어 히브리어의 호격·병렬 묘사를 훼손합니다.
  naturalness: ‘너에게서 먼 자들’은 원문의 공간적 대조를 자연스럽게 살립니다. ‘이름이 더럽혀진 자여, 소란이 가득한 자여!’는 예언적 조롱의 호격과 병렬을 현대 표준 한국어로 명료하게 재현합니다.
  terminology: טְמֵאַת הַשֵּׁם의 압축성과 ‘이름/평판’의 여지를 본문에서는 ‘이름이 더럽혀진’으로 보존하고, 각주에서 ‘평판’ 해석을 제시합니다. מְהוּמָה는 ‘소란’으로 옮기되 ‘혼란, 소요, 무질서’의 대안을 각주에 둡니다.
  issues:
  - severity: medium
    issue: מִמֵּךְ의 ‘너에게서’가 본문 번역에서 빠졌습니다.
    rationale: ‘멀리 있는 자들’만으로도 일반적 거리 의미는 전달되지만, 원문은 가까운 자들과 ‘너에게서 먼’ 자들을 대조합니다.
  - severity: high
    issue: ‘소란이 가득합니다’가 원문의 호격적 수식어를 독립 평서문으로 바꿉니다.
    rationale: רַבַּת הַמְּהוּמָה는 앞의 טְמֵאַת הַשֵּׁם와 병렬로 수신자(여성형 도시)를 묘사합니다. 한국어에서도 ‘소란이 가득한 자여’처럼 호격 묘사로 처리해야 합니다.
  - severity: medium
    issue: 각주 표지가 해당 어구에 붙어 있지 않습니다.
