lexical_decisions:
- source_word: נִחַלְתְּ
  english_pob_choice: you will be profaned
  chosen_korean: 더럽혀질 것이며
  alternatives_korean:
  - 모독될 것이며
  - 속되게 될 것이며
  - 부정하게 될 것이며
  lexicon: HALOT
  rationale: 이 동사형은 에스겔의 정결/거룩 문맥에서 공적 profanation을 가리키므로, 한국어에서도 ‘더럽혀지다’로 거룩함의 훼손을 직접 드러내는 것이 가장 자연스럽습니다.
- source_word: בָּךְ
  english_pob_choice: in yourself
  chosen_korean: 너 자신 안에서
  alternatives_korean:
  - 너를 통해서
  - 너 자신에게서
  - 네 안에서
  lexicon: HALOT
  rationale: 히브리어 전치사 בְּ는 대상 내부에 일어나는 상태를 가리키므로, ‘너 자신 안에서’가 본문의 자기-관련적 뉘앙스를 비교적 충실하게 살립니다.
- source_word: לְעֵינֵי גוֹיִם
  english_pob_choice: before the eyes of the nations
  chosen_korean: 민족들의 눈앞에서
  alternatives_korean:
  - 민족들의 시야 앞에서
  - 열방의 눈앞에서
  - 민족들 앞에서
  lexicon: HALOT
  rationale: 직역적 관용구를 유지하되 한국어로 자연스럽게 옮기기 위해 ‘눈앞에서’로 처리했고, גוֹיִם은 예언문맥의 외국 민족들을 가리키므로 ‘민족들’이 무난합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 대체 칭호가 아니라 고유명으로 드러나야 하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
