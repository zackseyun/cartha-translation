base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/016.yaml
  text: And you will be profaned through yourself before the eyes of the nations[a], and you will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'you will be defiled' or 'you will be dishonored in yourself.' The Hebrew verb may be understood with nuances of profanation, defilement, or public dishonor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 너는 너 자신 안에서 민족들의 눈앞에서 더럽혀질 것이며, 네가 내가 야훼인 줄 알게 될 것이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘더럽혀지다’, ‘부정하게 되다’, ‘모독을 당하다’의 뉘앙스를 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִחַלְתְּ
  english_pob_choice: you will be profaned
  chosen_korean: 더럽혀질 것이며
  alternatives_korean:
  - 모독될 것이며
  - 속되게 될 것이며
  - 부정하게 될 것이며
  lexicon: HALOT
  rationale: 이 동사형은 에스겔의 정결/거룩 문맥에서 공적 profanation을 가리키므로, 한국어에서도 ‘더럽혀지다’로 거룩함의 훼손을 직접 드러내는 것이 가장 자연스럽습니다.
- source_word: בָּךְ
  english_pob_choice: in yourself
  chosen_korean: 너 자신 안에서
  alternatives_korean:
  - 너를 통해서
  - 너 자신에게서
  - 네 안에서
  lexicon: HALOT
  rationale: 히브리어 전치사 בְּ는 대상 내부에 일어나는 상태를 가리키므로, ‘너 자신 안에서’가 본문의 자기-관련적 뉘앙스를 비교적 충실하게 살립니다.
- source_word: לְעֵינֵי גוֹיִם
  english_pob_choice: before the eyes of the nations
  chosen_korean: 민족들의 눈앞에서
  alternatives_korean:
  - 민족들의 시야 앞에서
  - 열방의 눈앞에서
  - 민족들 앞에서
  lexicon: HALOT
  rationale: 직역적 관용구를 유지하되 한국어로 자연스럽게 옮기기 위해 ‘눈앞에서’로 처리했고, גוֹיִם은 예언문맥의 외국 민족들을 가리키므로 ‘민족들’이 무난합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 대체 칭호가 아니라 고유명으로 드러나야 하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: חלל의 의미 범위
  chosen_reading: 거룩함이 훼손되는 공적 profanation
  alternative_readings:
  - 단순한 수치나 모욕
  - 오염/부정의 상태
  rationale: 에스겔의 심판·거룩 어휘망 안에서 이 동사는 단순한 체면 손상이 아니라, 열방 앞에서 하나님의 거룩이 훼손되는 사건으로 읽는 것이 문맥에 가장 잘 맞습니다.
  doctrine_reference: 거룩/성결과 심판의 예언자적 언어
