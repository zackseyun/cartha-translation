id: EZK.22.24
reference: Ezekiel 22:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֶּן אָדָ֕ם אֱמָר לָ֕/הּ אַ֣תְּ אֶ֔רֶץ לֹ֥א מְטֹהָרָ֖ה הִ֑יא לֹ֥א גֻשְׁמָ֖/הּ בְּ/י֥וֹם זָֽעַם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/024.yaml
  text: Son of man[a], say to her[c][b], ‘You are a land not cleansed and not rained on in the day of indignation.’
  footnotes:
  - marker: a
    text: Or, 'not purified.' The Hebrew participle can denote a state of uncleanness or not having been cleansed.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression is rare and may also be understood as 'without rain' or 'not showered upon' in the day of wrath.
    reason: lexical_alternative
  - marker: c
    text: Or, 'in the day of wrath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 그에게 말하라. “너는 깨끗하게 되지 않은 땅이며, 진노의 날에 비를 맞지 않은 땅이다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘깨끗하게 되지 않은’은 히브리어 분사가 나타내는 ‘정결하게 만들어지지 않은 상태’를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀한 히브리어 표현은 ‘비를 맞지 않은’뿐 아니라 ‘비가 내리지 않은’ 또는 ‘소나기를 받지 않은’ 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인자여
  lexicon: HALOT
  rationale: 에스겔에서의 관용적 예언자 호칭을 살리기 위해 직역적 호칭인 ‘인자야’를 사용했습니다. 한국어에서 ‘사람아’는 의미는 가깝지만 호칭의 문체와 전통적 예언자 어조를 덜 보존합니다.
- source_word: אֱמָר לָהּ
  english_pob_choice: say to her
  chosen_korean: 그에게 말하라
  alternatives_korean:
  - 그녀에게 말하라
  - 그 땅에게 말하라
  lexicon: HALOT
  rationale: 히브리어의 대명사와 뒤의 ‘땅’이 곧 대상임을 고려해 한국어에서는 자연스럽게 ‘그에게’보다 더 명시적인 대응이 가능하지만, 본문은 뒤에서 땅을 직접 규정하므로 호칭 구조를 따라 ‘그에게 말하라’로 두었습니다.
- source_word: לֹא מְטֹהָרָה
  english_pob_choice: not cleansed
  chosen_korean: 깨끗하게 되지 않은
  alternatives_korean:
  - 정결해지지 않은
  - 씻기지 않은
  - 부정한
  lexicon: HALOT
  rationale: מְטֹהָרָה는 단순 상태가 아니라 ‘깨끗하게 만들어지지 않은’ 수동적 뉘앙스를 가지므로, ‘깨끗하게 되지 않은’이 가장 직접적으로 이를 반영합니다. ‘부정한’은 의미는 가깝지만 결과 상태만 강하게 들릴 수 있습니다.
- source_word: לֹא גֻשְׁמָהּ
  english_pob_choice: not rained on
  chosen_korean: 비를 맞지 않은
  alternatives_korean:
  - 비가 내리지 않은
  - 비를 받지 않은
  - 비가 내려 적셔지지 않은
  lexicon: HALOT
  rationale: 희귀한 גשם 형태는 비/소나기와 관련된 수동적 표현이므로, 한국어에서는 ‘비를 맞지 않은’으로 자연스럽게 옮기되 수동성을 유지했습니다. 이는 원문의 난해함을 지우지 않으면서도 문맥상 농경적 이미지가 살아나게 합니다.
- source_word: בְּיוֹם זָעַם
  english_pob_choice: in the day of indignation
  chosen_korean: 진노의 날에
  alternatives_korean:
  - 분노의 날에
  - 격분의 날에
  - 노여움의 날에
  lexicon: HALOT
  rationale: זָעַם은 심판 맥락에서 ‘진노’가 가장 알맞고 한국어 예언 문맥과도 잘 맞습니다. ‘날에’는 히브리어 전치사 구문을 자연스럽게 살리기 위한 처리입니다.
theological_decisions:
- issue: 땅의 상태를 도덕적 부정과 농경적 결핍 중 어느 쪽으로 좁힐지
  chosen_reading: 본문의 두 이미지를 함께 살려, 정결의 결핍과 비의 부재를 동시에 말하는 심판 선언으로 옮겼습니다.
  alternative_readings:
  - 오직 도덕적 부정만 강조하는 읽기
  - 오직 가뭄과 기근의 자연 현상만 강조하는 읽기
  rationale: 히브리어는 정결/부정 이미지와 비의 부재 이미지를 결합하므로, 어느 한쪽으로 단순화하지 않고 긴장을 보존하는 것이 본문의 수사와 신학을 더 정확히 반영합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
