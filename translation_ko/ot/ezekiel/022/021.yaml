source:
  edition: WLC
  text: וְ/כִנַּסְתִּ֣י אֶתְ/כֶ֔ם וְ/נָפַחְתִּ֥י עֲלֵי/כֶ֖ם בְּ/אֵ֣שׁ עֶבְרָתִ֑/י וְ/נִתַּכְתֶּ֖ם בְּ/תוֹכָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/021.yaml
  text: I will gather you[a], and I will blow on you with the fire of my wrath, and you will be melted within it.
  footnotes:
  - marker: a
    text: Or 'in its midst.' The pronoun may point to the city in the broader context or to the furnace/crucible in the smelting metaphor.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 너희를 모아들이고, 내 분노의 불로 너희 위에 불어 넣어 너희가 그 안에서 녹을 것이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 안에서’는 도성 또는 용광로/도가니를 가리킬 수 있습니다. 본문은 문맥상 둘 다 열어 둡니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִנַּסְתִּי
  english_pob_choice: I will gather
  chosen_korean: 모아들이고
  alternatives_korean:
  - 모으고
  - 불러모으고
  - 집합시키고
  lexicon: HALOT
  rationale: 사람들을 심판을 위해 한데 불러 모으는 동작을 자연스럽게 살리면서, 단순 수집보다 능동적이고 목적성 있는 뉘앙스를 전달합니다.
- source_word: נָפַחְתִּי עֲלֵיכֶם
  english_pob_choice: I will blow on you
  chosen_korean: 너희 위에 불어 넣어
  alternatives_korean:
  - 너희에게 불어
  - 너희를 향해 불어
  - 너희 위로 불어
  lexicon: HALOT
  rationale: 용광로/풀무 이미지를 살려 불을 더 격렬하게 하는 ‘불어 넣다’로 옮겼고, עַל의 방향성은 ‘위에’로 반영했습니다.
- source_word: בְּאֵשׁ עֶבְרָתִי
  english_pob_choice: with the fire of my wrath
  chosen_korean: 내 분노의 불
  alternatives_korean:
  - 내 진노의 불
  - 내 분노의 화염
  - 내 격분의 불
  lexicon: HALOT
  rationale: אֵשׁ의 문자적 ‘불’과 עֶבְרָה의 격한 분노를 함께 유지했습니다. ‘분노’는 문맥 전반의 심판 어조와 잘 맞습니다.
- source_word: נִתַּכְתֶּם
  english_pob_choice: you will be melted
  chosen_korean: 너희가 … 녹을 것이다
  alternatives_korean:
  - 너희가 녹아버릴 것이다
  - 너희가 제련될 것이다
  - 너희가 녹게 될 것이다
  lexicon: HALOT
  rationale: 금속이 열에 의해 녹는 심판 비유를 가장 직관적으로 전달하는 표현입니다. ‘제련되다’는 지나치게 기술적이어서 본문의 이미지보다 공정을 앞세웁니다.
- source_word: בְּתוֹכָהּ
  english_pob_choice: within it
  chosen_korean: 그 안에서
  alternatives_korean:
  - 그 속에서
  - 그 가운데서
  - 그 한가운데서
  lexicon: HALOT
  rationale: 여성 단수 대명사의 선행사를 특정하지 않고 POB의 유보를 유지했습니다. 도성인지 용광로인지의 모호성을 본문 그대로 남깁니다.
theological_decisions:
- issue: בְּתוֹכָהּ의 지시 대상 모호성 보존
  chosen_reading: ‘그 안에서’로 옮겨, 도성이나 용광로/도가니 중 어느 하나로 단정하지 않았습니다.
  alternative_readings:
  - 그 도시 가운데서
  - 그 용광로 가운데서
  rationale: 문맥은 예루살렘과 제련 비유를 겹쳐 사용하므로, 하나로 확정하지 않고 긴장을 유지하는 것이 स्रोत의 효과를 더 잘 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
