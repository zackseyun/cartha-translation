source:
  edition: WLC
  text: קָדָשַׁ֖/י בָּזִ֑ית וְ/אֶת שַׁבְּתֹתַ֖/י חִלָּֽלְתְּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/008.yaml
  text: You have despised my holy things[a], and you have profaned my Sabbaths.
  footnotes:
  - marker: a
    text: Or 'my sanctuaries' / 'my holy places.' The Hebrew can refer more specifically to sacred places, but here it is rendered more broadly as 'my holy things.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 내 거룩한 것들을 멸시하였고, 내 안식일들을 더럽혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 구체적으로 ‘내 성소들’ 또는 ‘내 거룩한 곳들’을 뜻할 수 있습니다. 그러나 여기서는 보다 넓게 ‘내 거룩한 것들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָדָשַׁי
  english_pob_choice: my holy things
  chosen_korean: 내 거룩한 것들
  alternatives_korean:
  - 내 성소들
  - 내 거룩한 곳들
  - 내 성스러운 것들
  lexicon: HALOT
  rationale: 복수형 소유격이 가리키는 폭넓은 ‘거룩한 것들’을 살리기 위해 단수적 건물명보다 넓은 표현을 택했습니다. “거룩한”은 성물/성소의 성격을 유지하면서도 과도한 축소를 피합니다.
- source_word: בָּזִית
  english_pob_choice: you have despised
  chosen_korean: 멸시하였고
  alternatives_korean:
  - 경멸하였고
  - 업신여겼고
  - 무시하였고
  lexicon: HALOT
  rationale: בזה의 기본 의미인 ‘경멸하다, 업신여기다’를 자연스러운 문어체로 옮기되, 이어지는 동사와 병렬되도록 간결하게 처리했습니다.
- source_word: שַׁבְּתֹתַי
  english_pob_choice: my Sabbaths
  chosen_korean: 내 안식일들
  alternatives_korean:
  - 내 안식일
  - 내 안식일 절기들
  lexicon: HALOT
  rationale: 복수형을 유지해 원문의 반복성과 언약적 절기 감각을 살렸습니다. 한국어에서도 복수 표지가 가능하므로 단수화하지 않았습니다.
- source_word: חִלָּלְתְּ
  english_pob_choice: you have profaned
  chosen_korean: 더럽혔습니다
  alternatives_korean:
  - 속되게 했습니다
  - 모독했습니다
  - 훼손했습니다
  lexicon: HALOT
  rationale: 예배·거룩의 맥락에서 חלל의 ‘거룩하지 않게 하다’는 뜻을 직접적으로 드러내기 위해 “더럽혔습니다”를 택했습니다. 한국어에서 가장 즉각적으로 성물의 오염/모독을 전달합니다.
theological_decisions:
- issue: ‘my holy things’의 범위
  chosen_reading: 성전 건물로 한정하지 않고 하나님께 속한 거룩한 대상 전반을 가리키는 넓은 의미로 이해했습니다.
  alternative_readings:
  - 내 성소들처럼 성전 공간으로 한정하는 읽기
  rationale: 히브리어 복수형과 에스겔의 성결 주제를 고려하면 범위를 좁히기보다 넓게 두는 편이 원문과 POB의 해석을 더 잘 반영합니다.
  doctrine_reference: Translation philosophy §1, §5
