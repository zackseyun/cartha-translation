reference: Ezekiel 22:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶשְׁפֹּ֤ךְ עֲלֵי/הֶם֙ זַעְמִ֔/י בְּ/אֵ֥שׁ עֶבְרָתִ֖/י כִּלִּיתִ֑י/ם דַּרְכָּ/ם֙ בְּ/רֹאשָׁ֣/ם נָתַ֔תִּי נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/031.yaml
  text: So I poured out my indignation on them[a]; with the fire of my wrath I consumed them. I have put their way on their own heads[c][b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: 'Hebrew: ''I have put their way on their heads,'' a prophetic idiom meaning that the consequences of their conduct have come back upon them.'
    reason: lexical_alternative
  - marker: b
    text: Or 'with the fire of my fury I destroyed them.'
    reason: alternative_reading
  - marker: c
    text: Hebrew אֲדֹנָי יְהוִה, traditionally rendered 'Lord GOD'; elsewhere the divine name יְהוָה is rendered 'the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들 위에 내 격분을 쏟아부었고, 내 진노의 불로 그들을 멸하였습니다.[b] 나는 그들의 길을 그들의 머리 위에 돌려놓았습니다.[a] 주 야훼께서 말씀하십니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 그들의 행실의 결과가 그들 자신에게 돌아왔다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 격노의 불로 그들을 멸망시켰습니다’.
    reason: alternative_reading
  - marker: c
    text: 히브리어 אֲדֹנָי יְהוִה는 ‘주 야훼’입니다. נְאֻם אֲדֹנָי יְהוִה 전체는 예언적 선언 공식입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁפֹּךְ
  english_pob_choice: I poured out
  chosen_korean: 쏟아부었으며
  alternatives_korean:
  - 쏟았습니다
  - 부었습니다
  lexicon: HALOT
  rationale: 쏟아붓는 동사는 진노가 대상 위로 ‘부어지는’ 심판 이미지를 살리면서 한국어로도 자연스럽습니다.
- source_word: זַעְמִי
  english_pob_choice: my indignation
  chosen_korean: 내 격분
  alternatives_korean:
  - 내 분노
  - 내 진노
  lexicon: HALOT
  rationale: זַעַם의 դատ적·격정적 뉘앙스를 살리기 위해 단순한 ‘분노’보다 더 강한 ‘격분’을 택했습니다.
- source_word: בְּאֵשׁ עֶבְרָתִי
  english_pob_choice: with the fire of my wrath
  chosen_korean: 내 진노의 불
  alternatives_korean:
  - 내 분노의 불
  - 내 격노의 불
  - 내 진노의 불로
  lexicon: HALOT
  rationale: 불 심판의 비유를 살리기 위해 ‘불’ 이미지를 유지했고, 수단의 의미는 뒤의 ‘멸하였습니다’와 함께 자연스럽게 드러나도록 했습니다.
- source_word: כִּלִּיתִים
  english_pob_choice: I consumed them
  chosen_korean: 그들을 멸하였습니다
  alternatives_korean:
  - 그들을 소멸시켰습니다
  - 그들을 끝장냈습니다
  - 그들을 소진시켰습니다
  lexicon: HALOT
  rationale: כלה는 여기서 단순한 ‘태워 먹다’보다 심판적 종결을 뜻하므로, 한국어 성경체에서 자연스러운 ‘멸하다’로 옮겼습니다.
- source_word: דַּרְכָּם בְּרֹאשָׁם נָתַתִּי
  english_pob_choice: I have put their way on their own heads
  chosen_korean: 나는 그들의 길을 그들 머리 위에 두었습니다
  alternatives_korean:
  - 나는 그들의 행실을 그들 머리 위에 되돌렸습니다
  - 나는 그들의 길을 그들 머리에 얹었습니다
  - 나는 그들의 행위를 그들 머리 위로 돌렸습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 과도하게 풀지 않고 ‘길’과 ‘머리 위’ 이미지를 유지해, 행위의 결과가 본인에게 돌아온다는 의미를 드러냈습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님이 말씀하십니다
  alternatives_korean:
  - 주 하나님의 말씀입니다
  - 주 여호와께서 말씀하십니다
  - 주 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언 공식을 한국어에서 자연스럽게 표현하면서도 אֲדֹנָי יְהוִה의 이중 칭호를 살리기 위해 ‘주 하나님’으로 옮겼습니다.
theological_decisions:
- issue: 징벌적 심판 표현의 강도
  chosen_reading: ‘격분’, ‘진노의 불’, ‘멸하였습니다’처럼 원문의 강한 심판 언어를 그대로 살렸습니다.
  alternative_readings:
  - 부드러운 ‘노여움’이나 ‘벌하셨습니다’로 완화하는 방식
  rationale: 본문은 단순한 훈계가 아니라 하나님의 직접적이고 강한 심판 선언이므로, 그 도덕적·예언적 무게를 약화하지 않는 것이 중요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ‘그들의 길을 그들 머리 위에 두었습니다’의 관용구 처리
  chosen_reading: 관용구를 유지하되 한국어로 이해 가능하도록 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - ‘그들의 행실의 결과를 그들 자신에게 돌리셨습니다’처럼 해석 중심으로 옮기는 방식
  rationale: 원문은 보응의 관용구를 사용하므로, 결과를 설명하는 의역보다 이미지 자체를 보존하는 편이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: Ezekiel judgment idiom / retributive justice
