reference: Ezekiel 22:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/דָמֵ֨/ךְ אֲשֶׁר שָׁפַ֜כְתְּ אָשַׁ֗מְתְּ וּ/בְ/גִלּוּלַ֤יִ/ךְ אֲשֶׁר עָשִׂית֙ טָמֵ֔את וַ/תַּקְרִ֣יבִי יָמַ֔יִ/ךְ וַ/תָּב֖וֹא עַד שְׁנוֹתָ֑יִ/ךְ עַל כֵּ֗ן נְתַתִּ֤י/ךְ חֶרְפָּה֙ לַ/גּוֹיִ֔ם וְ/קַלָּסָ֖ה לְ/כָל הָ/אֲרָצֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/004.yaml
  text: By your blood that you have shed[a], you have become guilty, and by your idols that you have made, you have become unclean. You have brought your days near and have come to your years[b]. Therefore I have made you a reproach to the nations and a mockery to all the lands.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'You have hastened your days and reached the end of your years.' The Hebrew idiom likely refers to the approach of Jerusalem's appointed time of judgment.
    reason: lexical_alternative
  - marker: b
    text: The term translated 'idols' is a contemptuous Hebrew word often used in Ezekiel for false gods, carrying a pejorative sense beyond a neutral term for images.
    reason: cultural_note
translation:
  language: ko
  text: 네가 흘린 피로 말미암아 네가 죄책을 지었고, 네가 만든 우상들[a]로 말미암아 부정해졌습니다. 네 날을 가까이 끌어왔고 네 해에 이르렀습니다.[b] 그러므로 내가 너를 민족들에게 수치거리가 되게 하였고, 모든 땅에 조롱거리가 되게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우상들’로 번역한 히브리어 말은 에스겔서에서 흔히 쓰이는 경멸적인 표현으로, 중립적인 ‘형상’보다 부정적인 뉘앙스를 지닙니다.
    reason: cultural_note
  - marker: b
    text: ‘네 날을 가까이 끌어왔고 네 해에 이르렀습니다’는 히브리어의 시간 관용구입니다. 예루살렘에 정해진 심판의 때가 가까워졌다는 뜻일 수 있으나, 본문은 그 뜻을 직접 풀어 말하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדָמֵךְ אֲשֶׁר שָׁפַכְתְּ
  english_pob_choice: By your blood that you have shed
  chosen_korean: 네 피로 네가 죄를 지었고
  alternatives_korean:
  - 네가 흘린 피로 네가 죄를 지었고
  - 네가 흘린 피 때문에 네가 죄를 지었고
  lexicon: HALOT
  rationale: ב + דם의 혈흔/피흘림에 따른 유죄를 한국어에서는 간명하게 ‘네 피로’로 살리고, שׁפך의 결과를 ‘죄를 지었고’로 이어 혈죄의 법정적 의미를 드러냈습니다.
- source_word: וּבְגִלּוּלַיִךְ
  english_pob_choice: and by your idols
  chosen_korean: 네가 만든 네 우상들로
  alternatives_korean:
  - 네 우상들로
  - 네 더러운 우상들로
  lexicon: HALOT
  rationale: גִלּוּלִים의 경멸적 뉘앙스는 유지하되 본문 흐름을 해치지 않도록 기본어는 ‘우상들’로 두고, ‘네가 만든’으로 제작 행위를 앞세워 우상숭배의 책임을 분명히 했습니다.
- source_word: טָמֵאת
  english_pob_choice: you have become unclean
  chosen_korean: 네가 더러워졌습니다
  alternatives_korean:
  - 네가 부정해졌습니다
  - 네가 불결해졌습니다
  lexicon: HALOT
  rationale: טמא의 예언자적 정결/부정 어휘를 한국어에서 현대적이고 직관적인 ‘더러워졌습니다’로 옮겨, 도덕적·의례적 오염이 함께 걸리는 표현을 살렸습니다.
- source_word: וַתַּקְרִיבִי יָמַיִךְ וַתָּבֹוא עַד שְׁנוֹתָיִךְ
  english_pob_choice: You have brought your days near and have come to your years
  chosen_korean: 네 날들을 앞당겼고, 네 연수에 이르렀습니다
  alternatives_korean:
  - 네 날들을 가까이 가져왔고, 네 연수에 이르렀습니다
  - 네 날들을 앞당겼고, 네 세월에 다다랐습니다
  lexicon: HALOT
  rationale: 두 절은 심판 때가 임박했다는 관용구로 보고, ‘앞당겼고’로 첫 절의 동사를 자연스럽게 풀면서도 ‘연수’로 후절의 시간적 완결을 대응시켰습니다.
- source_word: חֶרְפָּה … וְקַלָּסָה
  english_pob_choice: a reproach … a mockery
  chosen_korean: 수치가 되게 하였고 … 조롱거리가 되게 하였습니다
  alternatives_korean:
  - 치욕이 되게 하였고 … 희롱거리가 되게 하였습니다
  - 수모가 되게 하였고 … 비웃음거리가 되게 하였습니다
  lexicon: HALOT
  rationale: חֶרְפָּה와 קַלָּסָה의 병렬 조롱·멸시를 한국어에서 ‘수치/조롱거리’로 짝지어, 단순한 감정이 아니라 열방 앞의 공적 망신이라는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 피흘림과 우상숭배에 대한 이중 고발의 표현 방식
  chosen_reading: 혈죄와 부정이 서로 구별되면서도 함께 누적되는 예언자적 고발 구조를 그대로 유지했습니다.
  alternative_readings:
  - 두 항을 하나의 일반적 죄악으로 완화하는 방식
  - 정결/부정을 단순 의례 문제로만 좁히는 방식
  rationale: 원문은 피흘림으로 인한 유죄와 우상으로 인한 더러움을 병렬로 제시하므로, 이를 한 범주로 흡수하지 않고 각각의 무게를 보존해야 합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
