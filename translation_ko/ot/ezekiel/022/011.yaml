  lexicon: HALOT
  rationale: 반복되는 אִישׁ의 병렬 구조를 한국어에서도 살려, 개별 범죄자들을 차례로 나열하는 문맥을 분명하게 했습니다.
- source_word: עָשָׂה תּוֹעֵבָה
