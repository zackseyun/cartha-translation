source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֶת אֵ֣שֶׁת רֵעֵ֗/הוּ עָשָׂה֙ תּֽוֹעֵבָ֔ה וְ/אִ֥ישׁ אֶת כַּלָּת֖/וֹ טִמֵּ֣א בְ/זִמָּ֑ה וְ/אִ֛ישׁ אֶת אֲחֹת֥/וֹ בַת אָבִ֖י/ו עִנָּה בָֽ/ךְ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/011.yaml
  text: One man commits an abomination with his neighbor’s wife[a], another defiles his daughter-in-law with lewdness, and another violates his sister, his father’s daughter[c][b], within you.
  footnotes:
  - marker: a
    text: Or 'does a detestable act with.' The Hebrew idiom is literally 'does an abomination.'
    reason: lexical_alternative
  - marker: b
    text: Or 'with sexual depravity' for 'with lewdness.'
    reason: lexical_alternative
  - marker: c
    text: Or 'humiliates' or 'ravishes.' The Hebrew verb can denote sexual violation with an added sense of humiliation or abuse.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 사람이 이웃의 아내와[a] 가증한 일을 행하고, 또 한 사람이 자기 며느리를 음란함으로 더럽히며, 또 한 사람이 자기 자매, 곧 자기 아버지의 딸[b]을 너희 가운데서[c] 학대합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이웃의 아내와 가증한 일을 한다’입니다. 히브리어 관용구는 문자적으로 ‘가증한 일을 한다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아버지에게서 난 자기 자매’입니다. 히브리어는 근친상간 관계를 법률적·가족적 표현으로 구체화합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘너희 가운데서’입니다. 히브리어 בָּךְ는 도시로 의인화된 예루살렘을 가리키므로, 장소성을 살려 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: וְאִישׁ
