  lexicon: HALOT
  rationale: 이 동사는 단순한 성관계보다 강한 폭력·모욕의 뉘앙스를 지니므로, 피해성과 가해성을 함께 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 성적 범죄를 완곡하게 낮추지 않을지
  chosen_reading: ‘가증한 일’, ‘더럽히며’, ‘학대합니다’처럼 강한 윤리적 어휘를 유지했습니다.
  alternative_readings:
  - ‘관계를 맺고’
  - ‘부정을 저지르고’
  - ‘욕보입니다’
  rationale: 본문은 언약 공동체의 심각한 도덕적 붕괴를 고발하므로, 죄의 무게를 약화시키는 완곡어보다 원문의 규탄 강도를 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 6
