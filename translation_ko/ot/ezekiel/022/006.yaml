translation:
  language: ko
  text: 보십시오[a], 이스라엘의 지도자들이 네 가운데, 곧 각기 자기 팔에 따라 네 가운데 있어 피를 흘리려 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘보라/보시오’에 해당하는 감탄사로, 주의를 강하게 환기합니다.
    reason: source_note
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게
  lexicon: HALOT
  rationale: 문맥에서 예언적 주의를 환기하는 감탄사이므로, 현대 한국어에서 자연스럽고도 직접적인 명령형인 ‘보십시오’로 옮겨 주의를 강하게 이끕니다.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  english_pob_choice: the princes of Israel
  chosen_korean: 이스라엘의 지도자들
  alternatives_korean:
  - 이스라엘의 왕자들
  - 이스라엘의 군주들
  lexicon: HALOT
  rationale: נָשִׂיא는 문맥상 왕족 호칭보다 통치·책임을 지닌 우두머리를 가리키므로, 한국어로는 정치적 통치층을 드러내는 ‘지도자들’이 가장 자연스럽습니다.
- source_word: לִזְרֹעוֹ
  english_pob_choice: according to his power
  chosen_korean: 각기 자기 팔에 따라
  alternatives_korean:
  - 각기 자기 힘에 따라
  - 자기 팔대로
  lexicon: HALOT
  rationale: 히브리어 ‘팔’은 힘/권세의 관용적 표현이므로, 본문의 이미지를 살리면서도 의미를 드러내는 ‘자기 팔’로 직역적 관용을 유지했습니다.
- source_word: לְמַעַן שְׁפָךְ דָּם
  english_pob_choice: to shed blood
  chosen_korean: 피를 흘리려 하였습니다
  alternatives_korean:
  - 피를 흘리기 위해 있었습니다
  - 피 흘리기를 위하여 있었습니다
  lexicon: HALOT
  rationale: 목적을 나타내는 구조이지만 한국어에서는 ‘~하려 하였습니다’가 책임 있는 의도와 행위를 간결하게 드러내므로, 단순 목적보다 문맥의 비난 어조를 잘 전달합니다.
theological_decisions:
- issue: 예언적 고발문의 어조
  chosen_reading: 직설적 고발을 유지해 ‘보십시오’와 ‘피를 흘리려 하였습니다’로 재현했습니다.
  alternative_readings:
  - 완곡하게 ‘있었습니다’ 정도로 중립화
  - 도덕적 평가를 약화시켜 서술화
  rationale: 본문은 예루살렘의 지도층을 고발하는 신탁이므로, 문장의 경고성과 책망을 약화시키지 않는 쪽이 원문의 기능을 더 잘 보존합니다.
  doctrine_reference: 예언서의 심판 선언과 언어적 수사 보존
