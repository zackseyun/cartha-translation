revisions:
- from: 그녀의 예언자들은 그들을 위해 백색 회반죽을 발랐습니다[a]. 그들은 허위를 보고 거짓을 점쳤으며, 「주 야훼께서 이같이 말씀하셨다」라고 말하지만[b], 야훼께서는 말씀하지 않으셨습니다.
