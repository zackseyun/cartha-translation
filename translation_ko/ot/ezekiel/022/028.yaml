  rationale: 두 차례 나오는 ‘그들을 위해’를 모두 보존하고, 예언적 시현을 뜻하는 분사를 자연스러운 한국어로 명료화했습니다. 도시를 가리키는 여성 단수 소유 표현은 한국어에서 자연스럽게 ‘그 성읍의’로 처리했습니다. 또한 각주 a의 잘못된 대안 번역을 원문의 논쟁적 어휘 범위 안에서 바로잡았습니다.
