  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/נְבִיאֶ֗י/הָ טָח֤וּ לָ/הֶם֙ תָּפֵ֔ל חֹזִ֣ים שָׁ֔וְא וְ/קֹסְמִ֥ים לָ/הֶ֖ם כָּזָ֑ב אֹמְרִ֗ים כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וַֽ/יהוָ֖ה לֹ֥א דִבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/028.yaml
  text: And her prophets have plastered for them with whitewash[a], seeing falsehood and divining lies for them, saying[b], ‘Thus says the Lord GOD,’ when Yahweh has not spoken.
  footnotes:
  - marker: a
    text: Or “with untempered mortar” or “with flimsy plaster.” The Hebrew image is of a deceptive coating that hides defects.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “the Lord GOD” (אֲדֹנָי יְהוִה); elsewhere the divine name יְהוָה is rendered “the LORD.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀의 예언자들은 그들을 위해 백색 회반죽을 발랐습니다[a]. 그들은 허위를 보고 거짓을 점쳤으며, 「주 야훼께서 이같이 말씀하셨다」라고 말하지만[b], 야훼께서는 말씀하지 않으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “덧칠하지 않은 회반죽” 혹은 “엉성한 회반죽”으로도 옮길 수 있습니다. 히브리어의 이미지는 결함을 숨기는 기만적 코팅입니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어: “주 하나님”(אֲדֹנָי יְהוִה). 본문에서는 뒤의 신명 יְהוָה를 ‘야훼’로 옮겼습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְבִיאֶיהָ
  english_pob_choice: And her prophets
  chosen_korean: 그녀의 예언자들은
  alternatives_korean:
  - 그 예언자들은
  - 그 도시의 예언자들은
  lexicon: WLC 문맥
  rationale: 3인칭 여성 단수 소유격은 문맥상 예루살렘의 예언자들을 가리키므로 ‘그녀의 예언자들’이 자연스럽고 원문 관계를 살립니다.
- source_word: טָחוּ לָהֶם תָּפֵל
  english_pob_choice: have plastered for them with whitewash
  chosen_korean: 그들을 위해 백색 회반죽을 발랐습니다
  alternatives_korean:
  - 그들을 위해 백색 석회를 발랐습니다
  - 그들을 위해 백색 도배를 했습니다
  lexicon: HALOT
  rationale: 동사는 표면을 바르거나 회반죽하는 뜻이므로, 속임수로 결함을 가리는 벽 이미지를 살려 ‘백색 회반죽을 바르다’로 옮겼습니다.
- source_word: חֹזִים שָׁוְא וְקֹסְמִים לָהֶם כָּזָב
  english_pob_choice: seeing falsehood and divining lies for them
  chosen_korean: 허위를 보고 거짓을 점쳤으며
  alternatives_korean:
  - 허상을 보고 거짓을 점쳤으며
  - 헛것을 보고 거짓을 점쳤으며
  lexicon: HALOT
  rationale: שָׁוְא와 כָּזָב의 병렬을 살려 ‘허위’와 ‘거짓’으로 간결하게 대응했고, קֹסְמִים은 점술 행위를 분명히 드러내기 위해 ‘점쳤으며’로 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: 프로젝트 기본 용례
  rationale: אֲדֹנָי와 יְהוִה의 결합을 한국어에서 중복 없이 살리기 위해 ‘주 야훼’로 옮겼습니다. 문맥상 신탁 발화의 권위를 드러냅니다.
- source_word: וַיהוָה לֹא דִבֵּר
  english_pob_choice: when Yahweh has not spoken
  chosen_korean: 야훼께서는 말씀하지 않으셨습니다
  alternatives_korean:
  - 야훼께서 말씀하지 않으셨습니다
  - 야훼께서는 말하지 않으셨습니다
  lexicon: 프로젝트 기본 용례
  rationale: הווה 완료 부정은 현재적 효력을 가진 부정으로 옮겨 ‘말씀하지 않으셨습니다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 신탁 공식을 가장하는 거짓 예언의 직접 화법
  chosen_reading: 「주 야훼께서 이같이 말씀하셨다」라고 말하지만
  alternative_readings:
  - 「주 야훼께서 이같이 말씀하십니다」라고 말하지만
  - 「주 야훼의 말씀이 있습니다」라고 말하지만
  rationale: 히브리어의 예언자 공식 כֹּה אָמַר을 그대로 드러내면서, 뒤의 부정절과 대조가 분명하도록 과거형 보고문으로 처리했습니다.
  doctrine_reference: Ezekiel 22:28의 거짓 예언 고발 구조
- issue: ‘백색 회반죽’의 은유 보존
  chosen_reading: 백색 회반죽
  alternative_readings:
  - 백색 도막
  - 하얀 석회칠
  rationale: 본문은 결함을 감추는 표면 처리의 은유이므로, 전통적 교회어보다 건축적 이미지를 직접 살리는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
