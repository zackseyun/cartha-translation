source:
  edition: WLC
  text: אַנְשֵׁ֥י רָכִ֛יל הָ֥יוּ בָ֖/ךְ לְמַ֣עַן שְׁפָךְ דָּ֑ם וְ/אֶל הֶֽ/הָרִים֙ אָ֣כְלוּ בָ֔/ךְ זִמָּ֖ה עָשׂ֥וּ בְ/תוֹכֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/009.yaml
  text: Men of slander were in you in order to shed blood[a]; and on the mountains they ate[c][b]; they committed lewdness in your midst.
  footnotes:
  - marker: a
    text: Or 'men of slander,' 'talebearers,' or 'informers.' The Hebrew term can refer to trafficking in accusations or defamation.
    reason: lexical_alternative
  - marker: b
    text: That is, they participated in illicit meals at the high places, likely associated with idolatrous worship.
    reason: cultural_note
  - marker: c
    text: Or 'wickedness' or 'sexual depravity.' The Hebrew term often carries a sense of shameless moral outrage, frequently sexual.
    reason: lexical_alternative
translation:
  language: ko
  text: 험담하는 사람들이 너희 가운데 있어 피를 흘리게 하였으며, 산 위에서 그들은 먹었고, 너희 가운데에서 음행을 행하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘험담, 중상, 이간, 고발’까지 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 산 위에서 먹었다는 말은 대개 산당이나 우상 숭배와 관련된 불법적 식사를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 이 말은 흔히 성적 타락이나 수치스러운 도덕적 악행을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי רָכִיל
  english_pob_choice: Men of slander
  chosen_korean: 험담하는 사람들
  alternatives_korean:
  - 중상하는 사람들
  - 비방하는 사람들
  - 이간질하는 사람들
  lexicon: HALOT
  rationale: רָכִיל은 단순한 말많음을 넘어 중상·비방·이간질을 포함하는 말로, 문맥상 공동체 내부의 파괴적 언사와 고발성 언행을 가리키므로 자연스러운 현대 한국어로 ‘험담하는 사람들’이 적절합니다.
- source_word: לְמַעַן שְׁפָךְ דָּם
  english_pob_choice: in order to shed blood
  chosen_korean: 피를 흘리게 하였으며
  alternatives_korean:
  - 피를 흘리려고
  - 피를 흘리도록
  - 피를 흘리게 하기 위하여
  lexicon: HALOT
  rationale: לְמַעַן + 부정사는 목적/결과를 나타내므로, ‘피를 흘리게 하였습니다’가 목적성과 실제 결과를 함께 살립니다.
- source_word: וְאֶל הֶהָרִים אָכְלוּ
  english_pob_choice: and on the mountains they ate
  chosen_korean: 산 위에서 그들은 먹었고
  alternatives_korean:
  - 산들에서 그들은 먹었고
  - 산당에서 먹었고
  - 산 위에서 먹었고
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘산들 위/로’에서 먹었다는 표현으로, 우상 숭배와 연관된 산당 식사를 암시하지만 본문 이미지는 유지하는 것이 좋으므로 ‘산 위에서’로 옮겼습니다.
- source_word: זִמָּה
  english_pob_choice: lewdness
  chosen_korean: 음행
  alternatives_korean:
  - 음탕함
  - 방탕
  - 수치스러운 행위
  lexicon: HALOT
  rationale: זִמָּה는 성적 타락과 수치스러운 도덕적 폭거를 함께 포함할 수 있으므로, 본문 맥락에서 가장 직접적이고 성경적 울림을 유지하는 ‘음행’으로 번역했습니다.
theological_decisions:
- issue: 산 위에서 먹었다는 표현의 암시적 의미
  chosen_reading: 산당에서의 불법적 제의 식사를 직접 설명하지 않고, 본문 이미지를 살리면서 암시를 유지합니다.
  alternative_readings:
  - 산당에서 먹었다
  - 우상 제사에 참여하여 먹었다
  rationale: 본문은 산(들) 위에서 먹었다고만 말하며, 이는 우상 숭배와 연결될 수 있지만 본문 자체의 이미지보다 해석을 앞세우면 과잉해석이 될 수 있습니다. 따라서 주석 없이도 의미를 읽을 수 있게 하되, 본문 표현은 보존합니다.
  doctrine_reference: 예언서의 우상 숭배 고발과 문학적 이미지 보존
