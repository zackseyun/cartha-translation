  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֲבַקֵּ֣שׁ מֵ/הֶ֡ם אִ֣ישׁ גֹּֽדֵר גָּדֵר֩ וְ/עֹמֵ֨ד בַּ/פֶּ֧רֶץ לְ/פָנַ֛/י בְּעַ֥ד הָ/אָ֖רֶץ לְ/בִלְתִּ֣י שַׁחֲתָ֑/הּ וְ/לֹ֖א מָצָֽאתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/030.yaml
  text: And I sought among them for a man who would build up a wall and stand in the breach before me on behalf of the land[a], so that I would not destroy it[b], but I found none.
  footnotes:
  - marker: a
    text: Or 'stand in the gap.' The Hebrew image is of taking one's place in a breach in the wall, with the sense of protective intervention.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a man.' The singular masculine form may function representatively, but the translation preserves the wording of the source.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 그들 가운데서 담을 쌓아 보수하고, 내 앞에서 그 틈에 서서 그 땅을 위하여 중보하여 내가 그것을 멸하지 않게 할 한 사람을 찾았으나, 찾지 못했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֲבַקֵּשׁ
  english_pob_choice: And I sought
  chosen_korean: 그리고 나는 찾았습니다
  alternatives_korean:
  - 그리고 나는 구했습니다
  - 그리고 나는 찾고 있었습니다
  lexicon: HALOT
  rationale: בקש의 의미를 살려 ‘찾다’로 옮기고, 예언 문맥의 흐름을 따라 앞의 접속을 ‘그리고’로 처리했습니다.
- source_word: מֵהֶם
  english_pob_choice: from among them
  chosen_korean: 그들 가운데서
  alternatives_korean:
  - 그들 중에서
  - 그들 사이에서
  lexicon: HALOT
  rationale: מן + 대명사는 집단 안에서 대상을 골라내는 뜻이므로, 한국어에서는 자연스럽게 ‘가운데서’로 옮겨 선발의 뉘앙스를 살렸습니다.
- source_word: גֹּדֵר גָּדֵר
  english_pob_choice: who would build up a wall
  chosen_korean: 담을 쌓아 보수하고
  alternatives_korean:
  - 벽을 세워 보수하고
  - 담을 수축하고
  - 성벽을 보수하고
  lexicon: HALOT
  rationale: 직역하면 반복 구조가 어색하므로, 방어적 장벽을 다시 세우는 이미지를 살려 ‘담을 쌓아 보수하다’로 옮겼습니다.
- source_word: וְעֹמֵד בַּפֶּרֶץ
  english_pob_choice: and stand in the breach
  chosen_korean: 그 틈에 서서
  alternatives_korean:
  - 그 무너진 틈에 서서
  - 파괴된 틈에 서서
  - 그 균열에 서서
  lexicon: HALOT
  rationale: פֶּרֶץ는 성벽의 ‘틈/파괴된 곳’이므로, 방어와 중보의 이미지를 함께 살리는 자연스러운 표현으로 ‘그 틈’으로 옮겼습니다.
- source_word: בְּעַד הָאָרֶץ
  english_pob_choice: on behalf of the land
  chosen_korean: 그 땅을 위하여 중보하여
  alternatives_korean:
  - 그 땅을 위하여
  - 그 땅을 대신하여
  - 그 땅을 위해 중재하여
  lexicon: HALOT
  rationale: 땅을 대신해 서는 대표 행위가 포함되므로 단순한 목적어 표지보다 ‘중보하다’가 문맥의 대표·간구 의미를 더 분명히 드러냅니다.
theological_decisions:
- issue: 방어적 이미지와 중보적 기능의 동시 보존
  chosen_reading: 성벽 보수와 ‘틈에 서는’ 방어 이미지를 유지하면서, 그 행위를 ‘그 땅을 위하여 중보하다’로 풀어 대표적 간구의 의미를 함께 드러냈습니다.
  alternative_readings:
  - ‘그 땅을 위해 서다’처럼 더 직역하기
  - ‘간구하다’로만 단순화하기
  rationale: 히브리어는 실제 성벽 이미지와 하나님 앞에서의 대표적 개입을 함께 담으므로, 둘 중 하나로 평평하게 만들지 않았습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: אִישׁ의 성별-지시 유지
  chosen_reading: ‘한 사람’으로 옮겨 대표성은 살리되, 한국어에서는 ‘사람’이 자연스럽게 남성 단수의 지시를 포괄하도록 했습니다.
  alternative_readings:
  - ‘한 남자’
  - ‘어떤 사람’
  rationale: 히브리어 אִישׁ의 남성 단수 형태를 무리 없이 반영하면서도, 현대 한국어에서는 성별 강조보다 문맥의 대표성이 더 중요하다고 보았습니다.
  doctrine_reference: Translation philosophy §4
