    rationale: גֹּדֵר גָּדֵר는 담/울타리를 세우는 사람이라는 방어적 비유를 나타냅니다. 문맥상 복구의 함의는 있을 수 있으나 ‘보수하다’를 본문에 추가할 필요는 없습니다.
