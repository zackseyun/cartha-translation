    rationale: 히브리어는 ‘그 땅을 위하여/위해’를 말하며, ‘내 앞에서’ 서는 장면이 중보적 함의를 줄 수는 있어도 중보 행위 자체를 명시하지는 않습니다. 직접 표현으로 모호성을 보존해야 합니다.
