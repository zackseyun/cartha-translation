lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 임하여
  alternatives_korean:
  - 이르셨습니다
  - 왔습니다
  - 되었고
  lexicon: HALOT
  rationale: 예언서의 고정 표현에서 wayyiqtol은 단순 사건 진행보다 계시가 선포자에게 도달하는 양상을 드러내므로, 한국어에서는 ‘임하다’로 자연스럽고도 본문 기능을 살렸습니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: ‘야훼의 말씀’은 예언 공식의 관용구이므로, 한국어에서도 ‘말씀’이 원문의 공식성과 계시성을 가장 잘 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 לְבַר יְהוָה의 신명은 POB 관례에 따라 ‘야훼’로 옮겨, 고유한 언약 이름을 존칭 대체어로 바꾸지 않았습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내게로
  lexicon: HALOT
  rationale: 1인칭 목적격은 현대 표준어에서 가장 자연스러운 ‘내게’로 옮겼습니다.
theological_decisions:
- issue: 예언적 계시 공식의 문체
  chosen_reading: ‘야훼의 말씀이 내게 임하여 이르셨습니다’로 옮겨, 계시가 선포자에게 도달하는 사건성과 직접성을 살렸습니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 왔습니다’
  - ‘야훼의 말씀이 내게 임했습니다’
  rationale: 히브리어 예언 공식은 단순 정보 전달이 아니라 하나님의 발화가 선지자에게 도달하는 계시적 사건을 나타내므로, 한국어에서도 공문체적이면서도 직접적인 표현이 적절합니다.
  doctrine_reference: 예언 계시의 직접성
