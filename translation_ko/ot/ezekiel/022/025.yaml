revisions:
- from: 그의 예언자들의 공모가 그 한가운데에 있습니다[a]. 마치 으르렁거리는 사자가 먹잇감을 찢듯이, 그들은 사람들의 생명을 삼키고 재물과 값진 것들을 빼앗으며, 그 한가운데에 있는 과부들을 많게 했습니다.
  to: 그 성읍 한가운데에는 그 성읍의 예언자들이 꾸민 음모가 있습니다. 그들은 먹잇감을 찢는 포효하는 사자처럼 사람들의 생명을 삼키고[a], 재물과 귀중품을 빼앗으며, 그 성읍에 과부를 많이 만들었습니다.
  rationale: 성읍을 가리키는 여성 접미사를 한국어에서 명확히 하고, נֶפֶשׁ 관련 각주를 해당 번역어에 연결했습니다. 또한 사자의 비유와 ‘과부를 많이 만들다’라는 폭력의 결과를 현대 표준 한국어 합쇼체로 자연스럽게 다듬되, 원문의 비유와 반복되는 성읍 내부의 강조를 보존했습니다.
