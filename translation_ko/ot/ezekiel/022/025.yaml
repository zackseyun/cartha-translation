base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/025.yaml
  text: 'A conspiracy of her prophets is in her midst[a], like a roaring lion tearing prey: they have devoured lives, they take wealth and precious things, they have multiplied her widows in her midst.'
  footnotes:
  - marker: a
    text: Or 'they have devoured persons' or, more literally, 'souls.' Hebrew nephesh often means a living being or life, not only the immaterial soul.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍 한가운데에는 그 성읍의 예언자들이 꾸민 음모가 있습니다. 그들은 먹잇감을 찢는 포효하는 사자처럼 사람들의 생명을 삼키고[a], 재물과 귀중품을 빼앗으며, 그 성읍에 과부를 많이 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람들을 삼켰다’, 더 문자적으로는 ‘네페쉬들을 삼켰다’일 수 있습니다. 히브리어 네페쉬(nephesh)는 종종 비물질적인 영혼만이 아니라 살아 있는 존재나 생명을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁר
  english_pob_choice: conspiracy
  chosen_korean: 공모
  alternatives_korean:
  - 음모
  - 결탁
  lexicon: HALOT
  rationale: 예언자들의 집단적이고 악한 결탁을 나타내므로, ‘공모’가 비밀스러운 협력과 죄책을 함께 드러냅니다.
- source_word: בְּתוֹכָהּ
  english_pob_choice: in her midst
  chosen_korean: 그 한가운데에
  alternatives_korean:
  - 그 안에
  - 그 가운데
  lexicon: HALOT
  rationale: 도시 내부에서 벌어지는 일을 가리키는 관용을 살리면서, 앞뒤 반복 구조를 한국어로 자연스럽게 드러냅니다.
- source_word: נֶפֶשׁ אָכָלוּ
  english_pob_choice: they have devoured lives
  chosen_korean: 사람들의 생명을 삼키고
  alternatives_korean:
  - 사람들을 삼키고
  - 영혼들을 삼키고
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 비물질적 ‘영혼’이 아니라 살아 있는 존재의 생명/삶을 뜻하므로, POB의 ‘lives’를 따라 ‘생명’으로 옮겼습니다.
- source_word: חֹסֶן וִיקָר
  english_pob_choice: wealth and precious things
  chosen_korean: 재물과 값진 것들
  alternatives_korean:
  - 부와 귀한 것들
  - 부유함과 보물
  lexicon: HALOT
  rationale: חֹסֶן과 וִיקָר는 약탈된 물질적 재산을 가리키므로, 함께 자연스러운 병렬을 이루는 ‘재물과 값진 것들’로 옮겼습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역 범위
  chosen_reading: ‘생명’으로 번역하여 폭력의 결과를 강조했습니다.
  alternative_readings:
  - 영혼
  - 사람들
  rationale: 이 본문은 구원의 영혼론이 아니라 살육과 착취의 고발이므로, 후대의 신학적 의미를 앞세우지 않고 히브리어 관용을 보존했습니다.
  doctrine_reference: 원어 우선 원칙과 의미 범위 보존
