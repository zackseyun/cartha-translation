translation:
  language: ko
  text: 당신의 마음이 견뎌 내겠느냐, 아니면 내가 당신에게 행하는 날에 당신의 손이 굳세겠느냐? 나, 야훼가 말하였고, 내가 그것을 행하겠습니다.[a]
