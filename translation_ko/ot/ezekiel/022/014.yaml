- from: 당신의 마음이 견뎌 내겠느냐, 아니면 내가 당신에게 행하는 날에 당신의 손이 굳세겠느냐? 나, 야훼가 말하였고, 내가 그것을 행하겠습니다.[a]
  to: 내가 너를 다룰 날에 네 마음이 견뎌 내겠습니까? 네 손이 굳세겠습니까? 나 야훼가 말하였고, 내가 그것을 행하겠습니다.[a]
  rationale: 시간절을 문두로 옮겨 두 병렬 의문문 전체에 적용됨을 분명히 했습니다. ‘너를 다룰’은 히브리어의 대상에 대한 하나님의 직접 행위를 자연스럽게 옮기되 ‘심판’처럼 동사 자체보다 좁은 법정 용어를 강요하지 않습니다. 의문형을 합쇼체로 통일하고, 각주를 완결된 대안 번역으로 정비했습니다.
