translation:
  language: ko
  text: 내가 너를 다룰 날에 네 마음이 견뎌 내겠습니까? 네 손이 굳세겠습니까? 나 야훼가 말하였고, 내가 그것을 행하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
