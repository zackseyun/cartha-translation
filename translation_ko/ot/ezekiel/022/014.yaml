  naturalness: 초안의 ‘당신의 마음/손’은 하나님이 예루살렘을 향해 하는 선포 안에서는 다소 거리감이 있고, ‘견뎌 내겠느냐’는 합쇼체 요구와 맞지 않습니다. ‘네’와 ‘-겠습니까?’를 사용하여 현대 표준어의 정중한 성경 문체로 다듬었습니다.
