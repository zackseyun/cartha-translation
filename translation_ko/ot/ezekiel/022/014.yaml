    text: 또는 “내가 너를 대적하여 행할 날에 네 마음이 굳게 서겠습니까? 네 손이 강하겠습니까?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַעֲמֹד לִבֵּךְ
  english_pob_choice: Will your heart endure
  chosen_korean: 당신의 마음이 견뎌 내겠느냐
  alternatives_korean:
  - 당신의 마음이 서 있겠느냐
  - 당신의 마음이 버텨 내겠느냐
  lexicon: HALOT
  rationale: 히브리어 עמד의 직역인 ‘서다’보다, 심판을 견디는 능력을 묻는 수사적 질문이므로 ‘견뎌 내다’가 의미를 가장 자연스럽게 드러냅니다.
- source_word: תֶּחֱזַקְנָה יָדַיִךְ
  english_pob_choice: your hands remain strong
  chosen_korean: 당신의 손이 굳세겠느냐
  alternatives_korean:
  - 당신의 손이 강하겠느냐
  - 당신의 손이 버티겠느냐
  lexicon: HALOT
  rationale: 손의 힘과 실행 능력을 가리키는 관용을 살리면서, 한국어에서는 ‘굳세다’가 지속적 강인함을 간결하게 전달합니다.
- source_word: אֲשֶׁר אֲנִי עֹשֶׂה אוֹתָךְ
  english_pob_choice: when I deal with you
  chosen_korean: 내가 당신에게 행하는 날에
  alternatives_korean:
  - 내가 당신을 대적하여 행하는 날에
  - 내가 당신을 심판하는 날에
  lexicon: HALOT
  rationale: 문맥상 심판 행위이지만, 동사 자체보다 넓은 의미를 유지하기 위해 ‘행하는’으로 옮겨 원문의 직접성을 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명사יהוה는 칭호 ‘주’로 치환하지 않고 고유명사 ‘야훼’로 옮겼습니다.
- source_word: וְעָשִׂיתִי
  english_pob_choice: I will do it
  chosen_korean: 내가 그것을 행하겠습니다
  alternatives_korean:
  - 내가 그것을 하겠습니다
  - 내가 그것을 이루겠습니다
  lexicon: HALOT
  rationale: 예언적 완료의 확실성을 한국어 미래형으로 살리되, 선포의 엄중함을 유지하기 위해 ‘행하겠습니다’를 택했습니다.
theological_decisions:
- issue: 심판 맥락에서의 ‘내가 당신에게 행하는’ 표현
  chosen_reading: 직접적인 심판 행위를 암시하되, 동사 자체는 넓게 유지했습니다.
  alternative_readings:
  - 내가 당신을 심판하는 날에
  - 내가 당신을 대적하는 날에
  rationale: 히브리어는 대상에게 행해지는 하나님의 직접적 개입을 말하지만, 본문이 동사만으로 심판의 법정 용어를 명시하지 않으므로 과도한 구체화를 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 예언적 완료 ‘וְעָשִׂיתִי’
  chosen_reading: ‘내가 그것을 행하겠습니다’로 미래 확정성을 표현했습니다.
  alternative_readings:
  - 내가 그것을 행하였고
  - 내가 그것을 하고 말겠습니다
  rationale: 하나님의 말씀 선포 뒤에 이어지는 확정적 성취를 한국어의 자연스러운 미래로 옮겨, 선언의 확실성을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 6
