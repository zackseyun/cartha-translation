  edition: WLC
  text: בַּ/שָּׁנָה֙ הָ/עֲשִׂירִ֔ית בָּ/עֲשִׂרִ֕י בִּ/שְׁנֵ֥ים עָשָׂ֖ר לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/001.yaml
  text: In the tenth year[a], in the tenth month, on the twelfth day of the month, the word of Yahweh came to me, saying,
  footnotes:
  - marker: a
    text: 'Hebrew: ''the word of YHWH.'' Main text renders the divine name as ''the LORD'' per project style; alternatively, ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 열째 해[a] 열째 달, 그 달 열두째 날에 야훼의 말씀이 내게 임하여 말씀하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘야훼의 말씀이’라는 뜻입니다. 본문은 프로젝트 기준에 따라 하나님의 이름을 ‘야훼’로 옮겼습니다.
    reason: ot_citation
lexical_decisions:
- source_word: בַּשָּׁנָה הָעֲשִׂירִית
  english_pob_choice: In the tenth year
  chosen_korean: 열째 해
  alternatives_korean:
  - 열째 해의
  - 십 년째 해
  lexicon: HALOT
  rationale: 히브리어 날짜 공식의 핵심은 ‘열째’라는 서수와 ‘해’이며, 본문에는 기준 연도가 명시되지 않으므로 이를 덧붙이지 않고 간결하게 옮겼습니다.
- source_word: בָּעֲשִׂרִי
  english_pob_choice: in the tenth month
  chosen_korean: 열째 달
  alternatives_korean:
  - 열째 달에
  - 십월에
  lexicon: HALOT
  rationale: 히브리어는 달의 서수만 제시하고 있으므로, 한국어에서는 자연스럽고 공식적인 날짜 표현으로 ‘달’을 보충했습니다.
- source_word: הָיָה דְבַר יְהוָה
  english_pob_choice: the word of Yahweh came
  chosen_korean: 야훼의 말씀이 ... 임하여
  alternatives_korean:
  - 야훼의 말씀이 ... 와서
  - 야훼의 말씀이 ... 이르러
  lexicon: HALOT
  rationale: 예언서의 관용구인 ‘말씀이 임하다’를 사용해 단순한 존재 진술보다 계시의 도래를 살렸고, יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말씀하셨습니다.
  alternatives_korean:
  - 이르시되
  - 말하여
  lexicon: HALOT
  rationale: 뒤이어 올 신탁의 직접 발화를 자연스럽게 이어 주기 위해 한국어 종결형으로 정리했습니다.
theological_decisions:
- issue: יהוה(YHWH) 표기
  chosen_reading: 본문의 신명사טרגרাম마톤은 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  - LORD
  rationale: 이 절은 יְהוָה를 직접 사용하므로, 본 프로젝트의 원문 가시성 원칙에 따라 인격적 고유명칭을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
