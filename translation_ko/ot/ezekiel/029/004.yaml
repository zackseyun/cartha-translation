  - 네 턱 안에
  lexicon: HALOT
  rationale: לְחִי의 ‘턱/볼’ 가능성 가운데, 포획 도구가 꽂히는 거대한 수중 생물의 신체부위로는 ‘턱’이 문맥에 가장 잘 맞습니다.
- source_word: יְאֹרֶיךָ
  english_pob_choice: your Nile channels
  chosen_korean: 네 나일 수로들
  alternatives_korean:
  - 네 강들
  - 네 운하들
  - 네 나일의 물길들
  lexicon: HALOT
  rationale: 이 본문이 이집트 맥락에서 나일과 그 물길을 가리키므로, 일반적인 ‘강’보다 ‘나일 수로들’이 지리적 함의를 더 분명히 드러냅니다.
- source_word: הִדְבַּקְתִּי / תִּדְבָּק
  english_pob_choice: make ... cling / will cling
  chosen_korean: 달라붙게 하며 / 달라붙을 것입니다
  alternatives_korean:
  - 붙게 하며 / 붙을 것입니다
  - 달라붙도록 하며 / 달라붙을 것입니다
  - 들러붙게 하며 / 들러붙을 것입니다
  lexicon: HALOT
  rationale: דבק의 핵심은 ‘붙다/달라붙다’이므로, 피동적 느낌이 강한 ‘달라붙다’를 써서 물고기와 비늘의 접착 이미지를 보존했습니다.
- source_word: וְהַעֲלִיתִיךָ
  english_pob_choice: I will bring you up
  chosen_korean: 내가 너를 ... 끌어올릴 것이고
  alternatives_korean:
  - 내가 너를 ... 올릴 것이고
  - 내가 너를 ... 끌어낼 것이고
  - 내가 너를 ... 들어올릴 것이고
  lexicon: HALOT
  rationale: עלה의 ‘위로 올라오게 하다’와 포획·구출의 동작을 함께 살리기 위해 ‘끌어올리다’를 택했습니다.
- source_word: מִתּוֹךְ
  english_pob_choice: from the midst of
  chosen_korean: 한가운데에서
  alternatives_korean:
  - 가운데에서
  - 속에서
  - 한복판에서
  lexicon: HALOT
  rationale: 물속 깊은 곳에서 끌어내는 동작을 강조하는 표현이므로, ‘한가운데에서’가 ‘from the midst of’의 힘을 잘 전달합니다.
theological_decisions:
- issue: 파라오를 거대한 수중 생물로 비유하는 심판 이미지
  chosen_reading: 파라오를 나일의 포식적 존재로 묘사하는 파괴적 심판 선언을 그대로 유지했습니다.
  alternative_readings:
  - 비유를 완화해 단순한 ‘끌어냄’으로 처리하는 읽기
  - 상징성을 약화시켜 문자적 어투로 평탄화하는 읽기
  rationale: 본문의 갈고리, 비늘, 물고기, 나일 수로라는 연쇄적 이미지는 파라오에 대한 조롱 섞인 심판 선언이므로, 이를 완화하지 않고 원문의 긴장을 유지해야 합니다.
  doctrine_reference: Ezekiel 29:4의 심판 신탁 문맥
