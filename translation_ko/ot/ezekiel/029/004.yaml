  - 후크
  - 갈고리와 갈고랑이
  lexicon: HALOT
  rationale: 물고기나 큰 수중 생물을 붙잡아 끌어내는 도구라는 점을 살려, 현대 한국어에서 가장 자연스러운 ‘갈고리’로 옮겼습니다.
- source_word: בִּלְחָיֶיךָ
  english_pob_choice: in your jaws
  chosen_korean: 네 턱에
  alternatives_korean:
