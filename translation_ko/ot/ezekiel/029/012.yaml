  terminology: ‘이집트 땅’, ‘성읍’, ‘나라들’, ‘여러 땅’은 적절합니다. 황폐와 파괴의 병렬은 유지하되, 주석은 본문에 없는 ‘완전히’라는 강조를 넣지 않고 히브리어의 유사 어휘 병렬을 설명하도록 조정했습니다.
