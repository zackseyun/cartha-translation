  rationale: נתן + 목적어 + שְׁמָמָה는 단순한 '주다'보다 어떤 상태로 '되게 하다/만들다'의 의미가 강하므로, 상태 변화를 드러내는 표현을 택했습니다.
- source_word: בְּתוֹךְ אֲרָצוֹת נְשַׁמּוֹת / בְּתוֹךְ עָרִים מָחֳרָבוֹת
  english_pob_choice: among desolated lands / among ruined cities
