  text: וְ/נָתַתִּ֣י אֶת אֶרֶץ֩ מִצְרַ֨יִם שְׁמָמָ֜ה בְּ/ת֣וֹךְ אֲרָצ֣וֹת נְשַׁמּ֗וֹת וְ/עָרֶ֨י/הָ֙ בְּ/ת֨וֹךְ עָרִ֤ים מָֽחֳרָבוֹת֙ תִּֽהְיֶ֣יןָ שְׁמָמָ֔ה אַרְבָּעִ֖ים שָׁנָ֑ה וַ/הֲפִצֹתִ֤י אֶת מִצְרַ֨יִם֙ בַּ/גּוֹיִ֔ם וְֽ/זֵרִיתִ֖י/ם בָּ/אֲרָצֽוֹת־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/012.yaml
  text: And I will make the land of Egypt a desolation among desolated lands[a], and her cities will be a desolation among ruined cities for forty years[b]; and I will scatter Egypt among the nations and disperse them through the lands.
  footnotes:
  - marker: a
    text: Or 'among devastated lands' and 'among devastated cities.' The Hebrew uses closely related terms for desolation and ruin in parallel clauses.
    reason: lexical_alternative
  - marker: b
    text: That is, Egypt's people; the Hebrew shifts from the place-name 'Egypt' to the plural pronoun 'them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이집트 땅을 황폐한 땅들 가운데 한 곳으로 만들고, 그 성읍들은 무너진 성읍들 가운데서 사십 년 동안 황폐하게 될 것입니다.[a] 내가 이집트를 나라들 가운데 흩어 놓고, 그들을 여러 땅에 흩어 놓겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘황폐한’과 ‘무너진’으로 옮긴 히브리어 말은 서로 가까운 뜻을 지닌 병렬 표현입니다. 달리 ‘황폐한 땅들’과 ‘황폐한 성읍들’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 이집트의 주민들을 가리킵니다. 히브리어는 앞에서는 지명 ‘이집트’를 쓰고, 뒤에서는 복수 대명사로 바꿉니다.
    reason: lexical_alternative
