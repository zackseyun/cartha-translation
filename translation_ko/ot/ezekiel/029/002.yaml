translation:
  language: ko
  text: “인자야, 네 얼굴을 이집트 왕 바리새에게 돌리고, 그와 온 이집트를 향하여 예언하라.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בן אדם은 에스겔서에서 반복되는 호칭으로, ‘인자’ 외에 ‘사람아’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 죽을 자야
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서에서 반복되는 호칭을 살리면서도, 한국어 성경에서 이미 익숙한 ‘인자’ 형식을 유지해 예언적 소명 어조를 보존했습니다.
- source_word: שִׂים פָּנֶיךָ
  english_pob_choice: set your face
  chosen_korean: 네 얼굴을 … 돌리고
  alternatives_korean:
  - 네 얼굴을 … 향하고
  - 네 얼굴을 … 세우고
  lexicon: HALOT
  rationale: 직역만 하면 어색할 수 있어도, ‘얼굴을 돌리다’는 히브리어 관용구의 방향 전환과 적대적 태도를 비교적 자연스럽게 드러냅니다.
- source_word: עַל
  english_pob_choice: against
  chosen_korean: …을 향하여
  alternatives_korean:
  - …을 대하여
  - …에게 맞서
  lexicon: HALOT
  rationale: 문맥상 심판 예언의 대상 지시를 한국어로 풀어내되, 본문 전체의 적대적 방향성은 앞의 동사구와 함께 유지했습니다.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  english_pob_choice: Pharaoh king of Egypt
  chosen_korean: 이집트 왕 바리새
  alternatives_korean:
  - 이집트 왕 파라오
  - 바로 이집트 왕
  lexicon: HALOT
  rationale: ‘파라오’는 직함 성격이 강하므로 한국어에서는 고유명처럼 굳은 음역 ‘바리새’를 쓰기보다 설명형으로 옮길 수 있어 보이나, 본문 증거에 없는 형태이므로 최종적으로는 고유명 음역을 보류해야 합니다.
- source_word: וְהִנָּבֵא
  english_pob_choice: and prophesy
  chosen_korean: 예언하라
  alternatives_korean:
  - 예언자답게 선포하라
  - 예언자로 말하라
  lexicon: HALOT
  rationale: 예언 행위 명령을 직접적으로 옮겨, 소명 문장의 긴박함과 권위를 유지했습니다.
- source_word: מִצְרַיִם כֻּלָּהּ
  english_pob_choice: all Egypt
  chosen_korean: 온 이집트
  alternatives_korean:
  - 이집트 전체
  - 이집트의 온 땅
  lexicon: HALOT
  rationale: כֻלָּהּ의 총괄성을 한국어 관용으로 자연스럽게 살려 ‘온 이집트’로 옮겼습니다.
theological_decisions:
- issue: 예언자 호칭의 한국어 등가
  chosen_reading: ‘인자야’로 옮겨 에스겔의 반복적 소명 호칭을 유지했습니다.
  alternative_readings:
  - 사람아
  - 죽을 자야
  rationale: 이 절은 단순 호칭이 아니라 예언자 소명의 공식적 개시이므로, 기존 성경 독자에게 익숙하면서도 원문의 장르적 기능을 보존하는 표현이 적절합니다.
  doctrine_reference: prophetic_call
- issue: 심판 예언의 방향성
  chosen_reading: ‘네 얼굴을 … 돌리고’와 ‘…을 향하여 예언하라’로 적대적 지시를 드러냈습니다.
  alternative_readings:
  - 중립적 표지로만 처리
  - 단순히 ‘대하여’로만 옮김
  rationale: 히브리어 관용구는 단순한 시선 이동이 아니라 공적 대면과 심판 선언을 뜻하므로, 한국어에서도 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: prophetic_oracle
