translation:
  language: ko
  text: “인자야, 파라오, 곧 이집트 왕을 향해 네 얼굴을 돌리고, 그와 온 이집트를 거슬러 예언하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בן אדם은 에스겔서에서 반복되는 호칭으로, ‘인자’ 외에 ‘사람아’ 또는 ‘죽을 자야’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 죽을 자야
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서에서 반복되는 호칭을 살리면서도, 한국어 성경에서 이미 익숙한 ‘인자’ 형식을 유지해 예언적 소명 어조를 보존했습니다.
- source_word: שִׂים פָּנֶיךָ
  english_pob_choice: set your face
