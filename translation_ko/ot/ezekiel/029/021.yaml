id: EZK.29.21
reference: Ezekiel 29:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא אַצְמִ֤יחַ קֶ֨רֶן֙ לְ/בֵ֣ית יִשְׂרָאֵ֔ל וּ/לְ/ךָ֛ אֶתֵּ֥ן פִּתְחֽוֹן פֶּ֖ה בְּ/תוֹכָ֑/ם וְ/יָדְע֖וּ כִּי אֲנִ֥י יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/021.yaml
  text: On that day I will cause a horn to sprout for the house of Israel[a], and I will give you an opening of the mouth among them[b], and they will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'I will make a horn grow'—that is, I will raise up strength or honor for the house of Israel.
    reason: lexical_alternative
  - marker: b
    text: '''An opening of the mouth'' is a Hebrew idiom for being enabled or permitted to speak, likely echoing Ezekiel''s earlier periods of restricted speech.'
    reason: cultural_note
translation:
  language: ko
  text: 그날에 나는 이스라엘의 집에 뿔을 돋아나게 하겠고, 너에게는 그들 가운데서 입을 열 기회를 주겠습니다. 그러면 그들이 내가 야훼임을 알게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뿔’은 문자 그대로의 뿔이 아니라, 회복된 힘과 존귀를 가리키는 은유입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘입을 열 기회’는 말할 수 있게 됨을 뜻하는 히브리어 관용구로, 에스겔의 이전 침묵 상태를 떠올리게 합니다.
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: On that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 날에
  - 그 날
  lexicon: HALOT
  rationale: 표준적인 예언서 시간 표지로서 자연스럽게 옮기되, 구약 예언의 종결적·결정적 순간성을 유지합니다.
- source_word: אַצְמִיחַ קֶרֶן
  english_pob_choice: I will cause a horn to sprout
  chosen_korean: 뿔을 돋아나게 하겠고
  alternatives_korean:
  - 뿔을 자라게 하겠고
  - 뿔을 일으키겠고
  - 힘을 회복시켜 주겠고
  lexicon: HALOT
  rationale: צמח의 사역형과 קֶרֶן의 이미지성을 살려, 은유를 풀어버리지 않고 한국어로도 ‘돋아나게 하다’라는 생장 이미지를 유지했습니다.
- source_word: פִּתְחוֹן פֶּה
  english_pob_choice: an opening of the mouth
  chosen_korean: 입을 열 기회
  alternatives_korean:
  - 입을 여는 일
  - 말할 수 있는 기회
  - 입을 열 수 있게
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역만 하지 않고, 에스겔의 침묵/발화 맥락을 드러내는 자연스러운 한국어로 옮기되 ‘말할 수 있음’의 의미를 보존했습니다.
- source_word: בְּתוֹכָם
  english_pob_choice: among them
  chosen_korean: 그들 가운데서
  alternatives_korean:
  - 그들 중에서
  - 그들 한가운데서
  lexicon: HALOT
  rationale: 공동체 내부를 가리키는 공간적 관계를 살리기 위해 ‘가운데서’를 선택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 신적 고유명사는 ‘야훼’로 옮겨, 칭호가 아닌 이름이라는 점을 드러냈습니다.
theological_decisions:
- issue: ‘뿔’의 의미를 어떻게 처리할 것인가
  chosen_reading: 상징을 풀어 설명하지 않고, 회복된 힘과 존귀의 이미지를 담은 은유로 그대로 유지했습니다.
  alternative_readings:
  - ‘힘’으로 의역하기
  - 메시아적 인물로 명시하기
  rationale: 본문 자체는 강세/존귀의 회복을 상징하는 이미지를 말할 뿐, 특정 인물로의 직접 지시를 요구하지 않으므로 은유를 보존하는 것이 원문 충실성에 더 적합합니다.
  doctrine_reference: '번역 원칙: 본문이 허용하는 긴장을 유지하고 신학적 결론을 앞서 확정하지 않습니다.'
- issue: ‘입을 열 기회’의 범위
  chosen_reading: 에스겔의 제한된 발화가 풀리는 맥락을 반영하되, 그 방식과 지속성은 단정하지 않았습니다.
  alternative_readings:
  - 완전한 침묵 해제
  - 단순한 설교 기회
  rationale: 표현은 발화를 허락받는 상황을 가리키지만, 본절만으로 영구적 해제인지 특정 순간의 발화인지까지 정교하게 규정하지 않는 편이 원문에 더 가깝습니다.
  doctrine_reference: '번역 원칙: 원어 우선, 해석적 세부는 본문이 말하는 만큼만 제시합니다.'
