  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דַּבֵּ֨ר וְ/אָמַרְתָּ֜ כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֤י עָלֶ֨י/ךָ֙ פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם הַ/תַּנִּים֙ הַ/גָּד֔וֹל הָ/רֹבֵ֖ץ בְּ/ת֣וֹךְ יְאֹרָ֑י/ו אֲשֶׁ֥ר אָמַ֛ר לִ֥/י יְאֹרִ֖/י וַ/אֲנִ֥י עֲשִׂיתִֽ/נִי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/003.yaml
  text: 'Speak and say[a], ‘Thus says the Lord GOD: Behold, I am against you, Pharaoh king of Egypt, the great sea monster lying in the midst of his Nile channels, who says, “My Nile is mine[b], and I made myself.”’'
  footnotes:
  - marker: a
    text: Or “the great dragon”; in context, the image may also evoke a crocodile-like Nile monster.
    reason: lexical_alternative
  - marker: b
    text: Or “My river is mine, and I made it for myself.” The Hebrew may be read as Pharaoh boasting either of owning the Nile or of having made himself.
    reason: alternative_reading
translation:
  language: ko
  text: 말하라. 그리고 말하십시오. 「주 하나님이 이렇게 말씀하십니다. 보라, 내가 너를 대적하노라, 곧 이집트 왕 바로, 자기 강줄기들 가운데 누워 있는 그 큰 바다 괴물아. 그는 말하기를 ‘내 나일은 내 것이고, 내가 나를 만들었다’고 합니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바다 괴물’은 문맥상 ‘큰 용’ 또는 나일의 악어를 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 나일은 내 것이다, 그리고 내가 나를 만들었다’는 바로의 자기 과시를 드러냅니다. 일부는 ‘나일을 나 자신을 위해 만들었다’로도 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר וְאָמַרְתָּ
  english_pob_choice: Speak and say
  chosen_korean: 말하라. 그리고 말하십시오.
  alternatives_korean:
  - 말하라. 그리고 말하라.
  - 말하고 말하십시오.
  lexicon: HALOT
  rationale: 히브리어의 연속 명령형을 살리되, 본문 앞부분은 직접 전달 명령의 강세를 유지하는 반말 명령, 이어지는 인용 도입은 문체상 더 자연스러운 공손체로 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 하나님
  lexicon: HALOT
  rationale: 합쇼체 본문에서 אֲדֹנָי와 יְהוִה의 이중 호칭을 살리기 위해 ‘주 하나님’으로 옮겼습니다. ‘야훼’를 직접 넣는 방식도 가능하지만, 이 구절은 예언문 공식에서의 결합 호칭이므로 가독성과 구별성을 함께 고려했습니다.
- source_word: הִנְנִי עָלֶיךָ
  english_pob_choice: Behold, I am against you
  chosen_korean: 보라, 내가 너를 대적하노라
  alternatives_korean:
  - 보라, 내가 너를 치나니
  - 보라, 내가 너를 반대하노라
  lexicon: HALOT
  rationale: הִנְנִי의 예언적 긴급성을 ‘보라’로 살리고, עַל의 적대적 용례는 관계적 ‘대적하다’로 옮겨 심판 선언의 압박을 유지했습니다.
- source_word: תַּנִּים הַגָּדוֹל
  english_pob_choice: the great sea monster
  chosen_korean: 그 큰 바다 괴물
  alternatives_korean:
  - 그 큰 용
  - 그 큰 물괴물
  - 그 큰 악어
  lexicon: HALOT
  rationale: POB의 ‘sea monster’를 따라 초월적·상징적 이미지를 살리되, 나일 맥락에서 지나치게 동물학적으로 좁혀지는 ‘악어’는 피했습니다. ‘바다 괴물’은 괴물성·혼돈 상징을 보존합니다.
- source_word: בְּתוֹךְ יְאֹרָיו / יְאֹרִי
  english_pob_choice: in the midst of his Nile channels / My Nile
  chosen_korean: 자기 강줄기들 가운데 / 내 나일
  alternatives_korean:
  - 자기 나일 수로들 가운데
  - 자기 나일들 가운데
  lexicon: HALOT
  rationale: יְאֹר는 이집트 문맥에서 나일 강 및 그 수로를 가리키므로, 첫째는 복수 소유 구조를 ‘강줄기들’로, 둘째는 바로의 소유 주장으로서 ‘내 나일’로 옮겨 원문의 반복 대비를 살렸습니다.
- source_word: וַאֲנִי עֲשִׂיתִנִי
  english_pob_choice: and I made myself
  chosen_korean: 내가 나를 만들었다
  alternatives_korean:
  - 내가 나 자신을 만들었다
  - 내가 나를 지었다
  lexicon: HALOT
  rationale: 어미가 1인칭 단수 목적어를 가리키므로, POB가 지적한 자기창조의 뉘앙스를 그대로 드러내는 ‘내가 나를 만들었다’를 선택했습니다.
theological_decisions:
- issue: 이사야적/예언적 심판 공식의 존칭과 직접 발화의 등록
  chosen_reading: 예언 도입은 공손체, 인용 내부는 심판 선언의 직설을 유지했습니다.
  alternative_readings:
  - 전체를 공손체로 통일
  - 전체를 명령형으로 통일
  rationale: 히브리어 예언문의 격식은 한국어에서 완전히 동일하게 재현되기 어렵습니다. 따라서 ‘말하십시오’와 같은 도입부 공손체와, ‘내가 너를 대적하노라’ 같은 신적 선포의 직설을 함께 유지해 원문의 수사적 긴장을 보존했습니다.
  doctrine_reference: 'POB style principle: preserve prophetic force and register shifts without domesticating the speech'
- issue: פַּרְעֹה의 자기 신격화와 심판 대상성
  chosen_reading: 바로를 ‘자기 강줄기들 가운데 누워 있는 그 큰 바다 괴물’로 옮겨 교만한 권세 이미지와 혼돈 괴물 상징을 함께 보존했습니다.
  alternative_readings:
  - ‘큰 용’으로 제한
  - ‘악어’로 자연화
  rationale: 본문은 바로를 단순한 동물이 아니라 제국 권세와 혼돈의 상징으로 형상화합니다. 이를 자연화하면 심판 선언의 신학적 날카로움이 약해지므로 상징적 표현을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve imagery into a merely zoological referent
