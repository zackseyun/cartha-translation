  text: בֶּן אָדָ֗ם נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּ֠בֶל הֶעֱבִ֨יד אֶת חֵיל֜/וֹ עֲבֹדָ֤ה גְדֹלָה֙ אֶל צֹ֔ר כָּל רֹ֣אשׁ מֻקְרָ֔ח וְ/כָל כָּתֵ֖ף מְרוּטָ֑ה וְ֠/שָׂכָר לֹא הָ֨יָה ל֤/וֹ וּ/לְ/חֵיל/וֹ֙ מִ/צֹּ֔ר עַל הָ/עֲבֹדָ֖ה אֲשֶׁר עָבַ֥ד עָלֶֽי/הָ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/018.yaml
  text: Son of man[a], Nebuchadnezzar king of Babylon made his army labor greatly against Tyre; every head was made bald and every shoulder was rubbed bare[c][b], yet there was no pay for him or for his army from Tyre for the labor that he had performed against it.
  footnotes:
  - marker: a
    text: Or 'Mortal' for 'Son of man,' a common address to Ezekiel; the Hebrew is literally 'son of man.'
    reason: lexical_alternative
  - marker: b
    text: Or 'great labor' or 'hard service.'
    reason: lexical_alternative
  - marker: c
    text: The imagery of every head made bald and every shoulder rubbed bare likely reflects the physical strain of siege labor.
    reason: cultural_note
translation:
  language: ko
  text: 인자야, 바벨론 왕 느부갓네살이 그의 군대를 두로를 향해 큰 노역을 하게 하였습니다. 그래서 모든 머리는 벗겨지고 모든 어깨는 쓸려 벗겨졌으나, 그와 그의 군대가 두로에게서 그 노역에 대한 삯을 받지 못하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인자’는 여기서 에스겔에게 주어지는 상투적 호칭입니다. 원문은 문자적으로 ‘사람의 아들’입니다.
    reason: source_note
  - marker: b
    text: ‘큰 노역’은 ‘큰 일/큰 봉사’보다 원문의 강한 노동 부담을 더 직접적으로 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: 머리가 벗겨지고 어깨가 쓸려 벗겨진 이미지는 공성 작업의 육체적 마모를 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔에서 반복되는 호칭형을 살리기 위해 직역적 호칭을 유지했습니다. 한국어에서는 문맥상 호격의 자연스러움을 위해 ‘인자야’로 옮겼습니다.
- source_word: הֶעֱבִיד ... עֲבֹדָה גְדֹלָה
  english_pob_choice: made his army labor greatly
  chosen_korean: 그의 군대를 … 큰 노역을 하게 하였습니다
  alternatives_korean:
  - 그의 군대를 … 크게 수고하게 하였습니다
  - 그의 군대를 … 큰 봉사를 하게 하였습니다
  lexicon: HALOT
  rationale: 히필의 사역적 뉘앙스를 살려 단순히 ‘일하다’가 아니라 ‘하게 하다’로 옮겼고, ‘큰 노역’으로 עבודה의 강도를 반영했습니다.
- source_word: כָּל רֹאשׁ מֻקְרָח וְכָל כָּתֵף מְרוּטָה
  english_pob_choice: every head was made bald and every shoulder was rubbed bare
  chosen_korean: 모든 머리는 벗겨지고 모든 어깨는 쓸려 벗겨졌으나
  alternatives_korean:
  - 모든 머리는 대머리가 되고 모든 어깨는 문질러져 벗겨졌으나
  - 모든 머리는 삭이고 모든 어깨는 닳아 벗겨졌으나
  lexicon: HALOT
  rationale: 전투·공성 노동의 신체적 마모를 드러내기 위해 수동 결과를 살렸습니다. ‘벗겨지고’와 ‘쓸려 벗겨졌으나’는 원문의 반복 평행을 자연스럽게 반영합니다.
- source_word: שָׂכָר
  english_pob_choice: pay
  chosen_korean: 삯
  alternatives_korean:
  - 품삯
  - 보수
  - 급료
  lexicon: HALOT
  rationale: 노동의 대가라는 의미를 살리되, 문맥상 금전적 보상을 간결하게 드러내는 표준어로 ‘삯’을 선택했습니다.
theological_decisions:
- issue: 에스겔의 예언자 호칭 번역
  chosen_reading: ‘Son of man’은 설명역보다 호격형 ‘인자야’로 유지했습니다.
  alternative_readings:
