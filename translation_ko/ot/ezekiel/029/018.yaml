  to: 인자야, 바벨론 왕 느부갓네살이 그의 군대에게 두로를 치는 데 막대한 수고를 하게 하였습니다. 그리하여 모든 머리가 대머리가 되고 모든 어깨가 쓸려 벗겨졌으나, 그와 그의 군대는 그가 두로를 치며 한 그 수고에 대한 삯을 두로에게서 받지 못하였습니다.[a][b][c]
  rationale: 군사 문맥의 적대 방향과 ‘대머리가 된’ 결과 상태를 분명히 하고, 노동 표현을 현대 한국어에서 자연스럽고 의미 범위가 적절한 말로 다듬었습니다. 마지막 관계절의 단수 동사 ‘그가 한’을 유지하여 히브리어 עָבַד의 단수 주어(느부갓네살)를 반영했습니다.
