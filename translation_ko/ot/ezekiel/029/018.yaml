  - ‘인간아’로 일반화하기
  rationale: 본문의 반복되는 예언자 호칭 기능을 보존하면서도 한국어 독자가 즉시 인지할 수 있는 예언서적 호격을 택했습니다.
  doctrine_reference: Ezekiel prophetic address formula
