review_pass:
  verdict: revise
  source_fidelity: ‘두로를 향해’는 군사 문맥의 אֶל צֹר가 나타내는 적대적 방향을 충분히 드러내지 못합니다. 또한 ‘머리가 벗겨지고’는 두피가 벗겨지는 뜻으로도 읽혀, מֻקְרָח(대머리가 된)의 결과 상태를 더 정확히 옮길 필요가 있습니다. 수정문은 히필의 사역 의미, 큰 고역, 신체적 마모, 그리고 두로에게서 보수를 얻지 못한 사실을 보존합니다.
  naturalness: ‘그의 군대에게 두로를 치는 데 막대한 수고를 하게 하였습니다’와 ‘모든 머리가 대머리가 되고’는 현대 표준 한국어 합쇼체에서 자연스럽고 뜻이 분명합니다. ‘삯’은 노동의 대가라는 문맥에 적절합니다.
  terminology: 에스겔에서 반복되는 호격 בֶּן־אָדָם은 관용적 성서 용례인 ‘인자야’로 유지합니다. 느부갓네살, 바벨론, 두로의 명칭도 통용 표기를 유지합니다. ‘막대한 수고’는 עֲבֹדָה גְדֹלָה의 광범위하고 고된 노동을 표현하되 ‘노역’이 지닐 수 있는 제도화된 강제 부역의 뉘앙스를 불필요하게 한정하지 않습니다.
  issues:
  - severity: medium
    issue: ‘두로를 향해’가 군사적 적대 방향을 약화함
    rationale: אֶל צֹר는 이 문맥에서 두로를 상대로 한 공성·군사 활동의 방향입니다. ‘두로를 치는 데’가 이를 한국어로 더 명확히 전달합니다.
  - severity: medium
    issue: ‘모든 머리는 벗겨지고’가 원문의 ‘대머리가 됨’과 달리 읽힐 수 있음
    rationale: מֻקְרָח은 대머리가 된 상태를 가리킵니다. 한국어 ‘벗겨지다’는 피부가 벗겨지는 의미도 강하므로 ‘모든 머리가 대머리가 되고’가 더 정확합니다.
  - severity: low
    issue: ‘큰 노역’의 의미 범위가 다소 좁음
    rationale: עֲבֹדָה גְדֹלָה는 크고 고된 노동·수고를 뜻합니다. ‘막대한 수고’는 강도를 살리면서도 특정한 부역 제도로 한정하지 않습니다.
