id: EZK.29.5
reference: Ezekiel 29:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/נְטַשְׁתִּ֣י/ךָ הַ/מִּדְבָּ֗רָ/ה אוֹתְ/ךָ֙ וְ/אֵת֙ כָּל דְּגַ֣ת יְאֹרֶ֔י/ךָ עַל פְּנֵ֤י הַ/שָּׂדֶה֙ תִּפּ֔וֹל לֹ֥א תֵאָסֵ֖ף וְ/לֹ֣א תִקָּבֵ֑ץ לְ/חַיַּ֥ת הָ/אָ֛רֶץ וּ/לְ/ע֥וֹף הַ/שָּׁמַ֖יִם נְתַתִּ֥י/ךָ לְ/אָכְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/005.yaml
  text: I will cast you into the wilderness[a], you and all the fish of your streams. You will fall on the open field; you will not be gathered or collected[c][b]. I have given you as food to the beasts of the earth and to the birds of the heavens.
  footnotes:
  - marker: a
    text: Or 'the fish of your Nile channels'; the Hebrew term for 'streams' is often used for the Nile and its waterways in Egyptian contexts.
    reason: cultural_note
  - marker: b
    text: Or 'you will not be gathered or gathered together'; the Hebrew uses two near-synonymous verbs to intensify that no one will recover or bury the body.
    reason: lexical_alternative
  - marker: c
    text: The final clause is literally 'I have given you for food,' a prophetic perfect expressing the certainty of the coming judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 광야로 내던지고, 너와 네 강들의 모든 물고기도 함께 내던질 것이다. 네가 들판 위에 떨어질 것이며, 거두어지지도, 모아지지도 않을 것이다. 나는 너를 땅의 짐승들과 하늘의 새들의 먹이로 주었다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강들’은 이집트 문맥에서 나일과 그 수로들을 가리키는 히브리어 표현을 자연스럽게 옮긴 것입니다.
    reason: cultural_note
  - marker: b
    text: ‘거두어지다’와 ‘모아지다’는 거의 같은 뜻의 동사를 나란히 써서, 누구도 시신을 수습하지 못한다는 점을 강하게 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 문자적으로는 ‘먹을 것으로’에 가깝지만, 예언적 완료로서 심판의 확실성을 나타냅니다.
    reason: theological_note
lexical_decisions:
- source_word: וּנְטַשְׁתִּיךָ
  english_pob_choice: I will cast you
  chosen_korean: 내가 너를 내던지고
  alternatives_korean:
  - 내가 너를 버리고
  - 내가 너를 던져 버리고
  lexicon: HALOT
  rationale: נטשׁ은 단순한 방치보다 강제적 내쫓음과 폐기를 나타내는 심판 문맥이므로, 한국어에서는 ‘내던지다’가 그 폭력성과 추방성을 가장 직접적으로 드러냅니다.
- source_word: הַמִּדְבָּרָה
  english_pob_choice: into the wilderness
  chosen_korean: 광야로
  alternatives_korean:
  - 들판으로
  - 사막으로
  lexicon: HALOT
  rationale: 방향형 어미가 이동의 목적지를 나타내므로 ‘광야로’가 자연스럽고, 심판의 황량한 장소성을 유지합니다.
- source_word: דְּגַת יְאֹרֶיךָ
  english_pob_choice: the fish of your streams
  chosen_korean: 네 강들의 모든 물고기
  alternatives_korean:
  - 네 나일 수로들의 물고기
  - 네 시내들의 물고기
  lexicon: HALOT
  rationale: יְאֹר는 이집트 맥락에서 나일의 수로들을 가리키지만, 본문 의미를 자연스럽게 전달하기 위해 ‘강들’로 옮기고, 집합적 ‘물고기’는 한국어에서 수량감을 살려 표현했습니다.
- source_word: תִּפּוֹל / לֹא תֵאָסֵף / וְלֹא תִקָּבֵץ
  english_pob_choice: You will fall on the open field; you will not be gathered or collected
  chosen_korean: 들판 위에 떨어질 것이며, 거두어지지도, 모아지지도 않을 것이다
  alternatives_korean:
  - 들판 위에 쓰러질 것이며, 거두이지도, 모이지도 않을 것이다
  - 들판 위에 떨어질 것이며, 거둬들이지도, 모으지도 않을 것이다
  lexicon: HALOT
  rationale: 세 동사는 노출된 채 방치되어 시신이 수습되지 않는 심판을 강조하므로, ‘거두다/모으다’의 병렬로 두 번의 부정을 살려 중첩된 거절감을 보존했습니다.
- source_word: נְתַתִּיךָ לְאָכְלָה
  english_pob_choice: I have given you as food
  chosen_korean: 나는 너를 … 먹이로 주었다
  alternatives_korean:
  - 나는 너를 먹이로 주었다
  - 나는 너를 먹을 것으로 주었다
  lexicon: HALOT
  rationale: אָכְלָה는 ‘먹이/먹을 것’이지만, 포식 동물에게 넘겨진다는 심판의 이미지를 살려 ‘먹이’로 옮겼고, 완료형은 예언적 확실성을 유지합니다.
theological_decisions:
- issue: 예언적 완료( prophetic perfect )의 처리
  chosen_reading: 나는 너를 땅의 짐승들과 하늘의 새들의 먹이로 주었다
  alternative_readings:
  - 내가 너를 땅의 짐승들과 하늘의 새들의 먹이로 줄 것이다
  rationale: 히브리어 완료형은 장차 일어날 심판을 이미 확정된 일처럼 선포하므로, 한국어도 완료형으로 유지해 심판의 확실성과 선언적 긴장을 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘광야’와 ‘들판’의 대비
  chosen_reading: 광야로 … 들판 위에 떨어질 것이며
  alternative_readings:
  - 사막으로 … 들판에 쓰러질 것이며
  rationale: 강제 추방의 장소(광야)와 방치된 노출의 장소(들판)를 구분해, 본문이 그리는 심판의 진행을 더 분명히 드러냈습니다.
  doctrine_reference: Translation philosophy §2
