  text: לֹ֤א תַעֲבָר בָּ/הּ֙ רֶ֣גֶל אָדָ֔ם וְ/רֶ֥גֶל בְּהֵמָ֖ה לֹ֣א תַעֲבָר בָּ֑/הּ וְ/לֹ֥א תֵשֵׁ֖ב אַרְבָּעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/011.yaml
  text: No human foot will pass through it[a], and no animal foot will pass through it; and it will not be inhabited for forty years.
  footnotes:
  - marker: a
    text: Literally, 'No foot of man ... and no foot of beast.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 발도 그곳을 지나가지 않으며, 짐승의 발도 그곳을 지나가지 않고, 사십 년 동안 그곳에는 사람이 살지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사람의 발 … 짐승의 발’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶגֶל אָדָם
  english_pob_choice: human foot
  chosen_korean: 사람의 발
  alternatives_korean:
  - 인간의 발
  - 사람 발
  lexicon: HALOT
  rationale: אָדָם의 일반적 인간성을 살리면서도, 한국어에서는 ‘사람의 발’이 가장 자연스럽고 집합적 의미를 잘 드러냅니다.
- source_word: תַעֲבָר בָּהּ
  english_pob_choice: will pass through it
  chosen_korean: 그 안을 지나가지 못하고
  alternatives_korean:
  - 그 안을 통과하지 못하고
  - 그 땅을 지나가지 못하고
  lexicon: HALOT
  rationale: עבר + ב의 이동 이미지를 살려 ‘지나가다’로 옮겼고, 문맥상 금지 의미를 반영해 부정형으로 처리했습니다.
- source_word: רֶגֶל בְּהֵמָה
  english_pob_choice: animal foot
  chosen_korean: 짐승의 발
  alternatives_korean:
  - 동물의 발
  - 짐승 발
  lexicon: HALOT
  rationale: 히브리어 병행구를 따라 ‘발’을 유지했고, בְּהֵמָה는 본문 대비를 살리는 전통적 대응인 ‘짐승’이 더 적합합니다.
- source_word: לֹא תֵשֵׁב אַרְבָּעִים שָׁנָה
  english_pob_choice: it will not be inhabited for forty years
  chosen_korean: 사십 년 동안 거기에 사람이 살지 않을 것입니다
  alternatives_korean:
  - 사십 년 동안 거기에 거주하지 않을 것입니다
  - 사십 년 동안 그곳이 비어 있을 것입니다
  lexicon: HALOT
  rationale: ישב의 ‘거주하다/살다’ 의미를 자연스러운 한국어로 풀어, 황폐한 땅이 사람이 거주하지 않는 상태가 된다는 뜻을 분명히 했습니다.
theological_decisions:
- issue: אָדָם을 성별 중립적 일반 인간으로 옮길지 여부
  chosen_reading: ‘사람’으로 옮겨 남성 한정이 아닌 일반 인간을 가리키게 했습니다.
  alternative_readings:
  - 남자의 발
  - 인간의 발
  rationale: 본문은 특정 남성을 말하는 것이 아니라 누구의 발도 지나가지 않는다는 일반 진술이므로, 성별 오해를 피하면서 원문의 포괄성을 유지하는 번역이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for אָדָם; Translation philosophy §4'
