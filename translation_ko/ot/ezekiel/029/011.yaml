  source_fidelity: 히브리어는 애굽 땅에 사람이나 짐승의 발이 지나가지 않고 사십 년 동안 사람이 거주하지 않을 것이라는 예언을 병행 구조로 진술합니다. 초안의 의미는 대체로 충실하나, ‘지나가지 못하고’는 원문의 단순 미래 부정(‘지나가지 않을 것이다’)에 없는 능력·불가능의 뉘앙스를 더합니다.
  naturalness: ‘그 안을’도 이해되지만 땅·지역을 가리키는 문맥에서는 ‘그곳을’이 더 자연스럽습니다. 병행되는 두 절을 ‘지나가지 않으며/지나가지 않고’로 연결하면 현대 표준어 문장도 매끄럽습니다.
  terminology: אָדָם은 일반 인류를 가리키므로 ‘사람’, בְּהֵמָה는 문맥상 ‘짐승’으로 옮긴 것이 적절합니다. ‘사십 년’과 ‘사람이 살지 않을 것입니다’도 ישב의 토지 거주 의미를 자연스럽게 전달합니다.
