  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִן הַ/מַּמְלָכוֹת֙ תִּהְיֶ֣ה שְׁפָלָ֔ה וְ/לֹֽא תִתְנַשֵּׂ֥א ע֖וֹד עַל הַ/גּוֹיִ֑ם וְ/הִ֨מְעַטְתִּ֔י/ם לְ/בִלְתִּ֖י רְד֥וֹת בַּ/גּוֹיִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/015.yaml
  text: It will be the lowliest of the kingdoms[a], and it will no longer exalt itself above the nations; and I will diminish them[d][c][b], so that they will not rule over the nations.
  footnotes:
  - marker: a
    text: Or 'among the kingdoms' for 'of the kingdoms.' The Hebrew construction marks Egypt as the most abased in comparison with the other kingdoms.
    reason: lexical_alternative
  - marker: b
    text: Or 'be lifted up' instead of 'exalt itself.' The Hebrew can express either passive elevation or reflexive self-exaltation; the context of national pride favors 'exalt itself.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'I will make them few.' The pronoun is plural, referring to Egypt's people/power collectively.
    reason: lexical_alternative
  - marker: d
    text: Hebrew 'in/among the nations'; rendered 'over the nations' because the verb 'rule' in English normally takes 'over' for the object of dominion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 왕국들 가운데 가장 낮은 자가 될 것이며, 다시는 나라들 위로 스스로 높아지지 못할 것입니다. 그리고 내가 그것을 줄여서 나라들을 다스리지 못하게 할 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מן은 여기서 비교·최상급의 뜻을 띠며, ‘왕국들 가운데’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘스스로 높아지다’ 또는 ‘들려지다’로도 옮길 수 있습니다. 문맥상 국가의 교만이 더 두드러집니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘내가 그것들을 적게 만들 것이다’입니다. 복수 대명사는 이집트의 백성/세력을 집합적으로 가리킵니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 ‘나라들 가운데/위에’의 뜻이지만, ‘다스리다’와 함께 쓰일 때 한국어에서는 ‘나라들 위에’가 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַמַּמְלָכוֹת
  english_pob_choice: of the kingdoms
  chosen_korean: 왕국들 가운데 가장 낮은 자
  alternatives_korean:
  - 왕국들 중 가장 낮은 자
  - 왕국들 가운데
  lexicon: HALOT
  rationale: מן의 비교·우위 구문을 한국어에서 자연스럽게 살리기 위해 '가운데'를 쓰고, 최상급 의미는 '가장 낮은'으로 옮겼습니다.
- source_word: תִּהְיֶה שְׁפָלָה
  english_pob_choice: it will be the lowliest
  chosen_korean: 가장 낮은 자가 될 것이며
  alternatives_korean:
  - 가장 비천한 자가 될 것이며
  - 낮아질 것이며
  lexicon: HALOT
  rationale: שָׁפָל의 낮아짐과 수치를 비교적 강하게 드러내되, 현대 한국어에서 자연스러운 문맥을 위해 명사화하여 옮겼습니다.
- source_word: וְלֹא תִתְנַשֵּׂא עוֹד עַל הַגּוֹיִם
  english_pob_choice: it will no longer exalt itself above the nations
  chosen_korean: 다시는 나라들 위로 스스로 높아지지 못할 것입니다
  alternatives_korean:
  - 다시는 나라들 위에 스스로 들려지지 못할 것입니다
  - 다시는 나라들 위에 군림하지 못할 것입니다
  lexicon: HALOT
  rationale: נשא의 히트파엘형이 가진 자기 고양의 뉘앙스를 살려 '스스로 높아지다'로 옮기고, על은 위계적 우위를 나타내는 '위로'로 처리했습니다.
- source_word: וְהִמְעַטְתִּים
  english_pob_choice: and I will diminish them / make them few
  chosen_korean: 내가 그것을 줄여서
  alternatives_korean:
  - 내가 그것들을 줄여서
  - 내가 그것을 감소시켜
  lexicon: HALOT
  rationale: מעט의 히필은 '적게 만들다/줄이다'의 뜻이므로, 인칭대명사의 집합적 지시를 한국어에서는 문맥상 '그것'으로 받아 간결하게 처리했습니다.
theological_decisions:
- issue: 나라들 위의 자기 고양과 하나님의 심판 언어
  chosen_reading: 예언문의 정치적 교만을 직접적으로 드러내는 '스스로 높아지다'를 유지했습니다.
  alternative_readings:
  - '''군림하다''로 완화하여 옮김'
  - '''들려지다''로 수동적으로 옮김'
  rationale: 본문은 이집트의 국가적 교만과 낮아짐을 대조하므로, 수치와 자기 고양의 대비를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 예언서의 심판과 교만/낮아짐의 주제
- issue: 마지막 절의 목적절 표현
  chosen_reading: '''나라들을 다스리지 못하게 할 것입니다''로 목적·결과를 분명히 했습니다.'
  alternative_readings:
  - '''나라들을 통치하지 못하도록'''
  - '''나라들 위에 다스리지 못하게'''
  rationale: לְבִלְתִּי는 방지 목적을 나타내므로, 현대 한국어에서 가장 명료한 결과 표현으로 옮겼습니다.
  doctrine_reference: 하나님의 주권적 심판 선언
