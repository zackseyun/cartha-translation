  text: וְ/יָֽדְעוּ֙ כָּל יֹשְׁבֵ֣י מִצְרַ֔יִם כִּ֖י אֲנִ֣י יְהוָ֑ה יַ֧עַן הֱיוֹתָ֛/ם מִשְׁעֶ֥נֶת קָנֶ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/006.yaml
  text: Then all the inhabitants of Egypt will know that I am Yahweh[a], because they were a staff of reed to the house of Israel.
  footnotes:
  - marker: a
    text: Or 'a reed staff.' The Hebrew image is of something used for support but too weak to bear weight.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이집트의 모든 주민이 내가 야훼인 줄 알게 될 것입니다. 이는 그들이 이스라엘 집에게 갈대 지팡이가 되었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갈대 지팡이’라고도 할 수 있습니다. 히브리어 이미지는 의지할 수는 있지만 무게를 버티기에는 너무 약한 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  english_pob_choice: Then ... will know
  chosen_korean: 알게 될 것입니다
  alternatives_korean:
  - 알 것입니다
  - 알아차릴 것입니다
  lexicon: HALOT
  rationale: 예언문맥의 결과·전개를 살려 미래 완료식으로 옮겼고, ‘알다’는 에스겔의 인식 공식에 맞는 가장 직접적인 대응입니다.
- source_word: כָּל יֹשְׁבֵי מִצְרַיִם
  english_pob_choice: all the inhabitants of Egypt
  chosen_korean: 이집트의 모든 주민
  alternatives_korean:
  - 이집트에 사는 모든 사람
  - 이집트의 모든 거주자
  lexicon: HALOT
  rationale: ‘거주하는 자들’의 집합적 의미를 자연스러운 현대 한국어로 옮기되, 범위를 분명히 하기 위해 ‘이집트의’로 처리했습니다.
- source_word: כִּי אֲנִי יְהוָה
  english_pob_choice: that I am Yahweh
  chosen_korean: 내가 야훼인 줄
  alternatives_korean:
  - 내가 야훼라는 것을
  - 내가 주님인 줄
  lexicon: HALOT
  rationale: POB의 본문 방침에 따라 신명은 ‘야훼’로 유지했고, 인식절의 내용절을 한국어에서 가장 자연스럽게 표현했습니다.
- source_word: מִשְׁעֶנֶת קָנֶה
  english_pob_choice: a staff of reed
  chosen_korean: 갈대 지팡이
  alternatives_korean:
  - 갈대 막대기
  - 갈대로 된 지팡이
  lexicon: HALOT
  rationale: ‘지지용이지만 약해서 하중을 못 버티는’ 이미지를 살리면서, 한국어에서 비유를 바로 알아듣기 쉬운 결합형으로 옮겼습니다.
theological_decisions:
- issue: 야훼라는 신명 유지
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 신명 원칙을 따르며, 에스겔의 ‘야훼를 알게 될 것’이라는 인식 공식의 언약적 강도를 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
