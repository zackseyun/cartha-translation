revisions:
- from: 그러므로 이집트의 모든 주민이 내가 야훼인 줄 알게 될 것입니다. 이는 그들이 이스라엘 집에게 갈대 지팡이가 되었기 때문입니다.[a]
  to: 그때 이집트의 모든 주민이 내가 야훼인 줄 알게 될 것입니다. 그들이 이스라엘 집에 의지할 갈대 지팡이가 되었기 때문입니다.[a]
  rationale: Opening with ‘그때’ reflects the consequential progression of the waw without imposing a stronger causal inference. The revised metaphor uses idiomatic Korean and retains both ‘이스라엘 집’ and the staff’s function as support. The footnote is revised to provide a real lexical alternative and a faithful explanation of the image.
