translation:
  language: ko
  text: 그리고 제이십칠년[a] 초하루에 야훼의 말씀이 내게 임하여 말씀하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는 ‘달 초하루에’ 또는 ‘그 달의 초하루에’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 … 말씀하셨습니다
  alternatives_korean:
  - 그리고 … 있었습니다
  - 그리고 … 일어났습니다
  lexicon: HALOT
  rationale: 히브리어 서술 도입 공식의 사건·전환 기능을 한국어에서는 자연스럽게 연결어와 서술 동사로 살렸습니다.
- source_word: בְּעֶשְׂרִים וָשֶׁבַע שָׁנָה
  english_pob_choice: in the twenty-seventh year
  chosen_korean: 제이십칠년
  alternatives_korean:
  - 스물일곱째 해
  - 이십칠년
  lexicon: HALOT
  rationale: 예언서의 연대 표기를 한국어 성경문체에 맞게 서수형으로 옮겨, 연대 표지로서의 기능을 분명히 했습니다.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  english_pob_choice: on the first day of the month
  chosen_korean: 초하루
  alternatives_korean:
  - 달의 첫째 날
  - 한날
  lexicon: HALOT
  rationale: 히브리어 관용구가 가리키는 ‘달의 첫날’을 한국어의 통용 표현인 ‘초하루’로 옮겨 의미를 직접 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사호를 직역적 호칭으로 바꾸지 않고, 프로젝트 기본어인 ‘야훼’를 사용해 고유명사성을 보존했습니다.
theological_decisions:
- issue: 예언 수식어의 종결 방식
  chosen_reading: ‘야훼의 말씀이 내게 임하여 말씀하셨습니다’로 옮겨, 예언적 계시 공식의 수동적 수용과 직접적 발화를 함께 드러냈습니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 있었습니다’
  - ‘야훼의 말씀이 내게 와서 이르렀습니다’
  rationale: 히브리어 הָיָה דְבַר יְהוָה אֵלַי 구조는 단순 소유가 아니라 계시의 도래를 뜻하므로, 한국어에서도 ‘임하다’와 발화 동사를 함께 써 예언 공식의 무게를 살렸습니다.
  doctrine_reference: 예언적 계시 공식(구약 예언서의 표준 서술)
- issue: 직접 인용 도입의 문체
  chosen_reading: ‘말씀하셨습니다’로 마무리해 다음 절의 직접 화법으로 자연스럽게 넘어가게 했습니다.
  alternative_readings:
  - ‘말씀하여 이르시기를’
  - ‘말씀하시며’
  rationale: לֵאמֹר는 뒤따르는 신탁을 여는 표지이므로, 한국어에서도 구어체가 아닌 정중한 서술형으로 연결해 문맥상 계시 발화의 시작을 분명히 했습니다.
  doctrine_reference: 예언문학의 직접 화법 도입 관례
