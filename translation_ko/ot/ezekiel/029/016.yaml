source:
  edition: WLC
  text: וְ/לֹ֣א יִֽהְיֶה עוֹד֩ לְ/בֵ֨ית יִשְׂרָאֵ֤ל לְ/מִבְטָח֙ מַזְכִּ֣יר עָוֺ֔ן בִּ/פְנוֹתָ֖/ם אַחֲרֵי/הֶ֑ם וְ/יָ֣דְע֔וּ כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/016.yaml
  text: And it will no longer be for the house of Israel a source of confidence[a], bringing iniquity to remembrance when they turn after them[c][b]; then they will know that I am the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'confidence,' 'trust,' or 'security.' The Hebrew term refers to something relied on for safety.
    reason: lexical_alternative
  - marker: b
    text: Or 'reminding them of guilt' or 'bringing guilt to mind.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'Lord GOD' represents אֲדֹנָי יְהוִה, literally 'Lord YHWH.'
    reason: alternative_reading
translation:
  language: ko
  text: 그것은 더 이상 이스라엘 집에 의지할 대상, 곧 그들이 그들을 따를 때 죄악을 상기시키는 것이 되지 않을 것입니다[a][b]. 그러면 그들은 내가 주 야훼임을 알게 될 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신뢰’, ‘확신’, ‘안전’으로 옮길 수 있습니다. 히브리어는 안전을 위해 의지하는 대상이나 근거를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죄책을 상기시키는 것’, ‘죄를 떠올리게 하는 것’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 아도나이 יְהוִה는 문자적으로 ‘주 야훼’입니다. 아도나이와 하나님의 이름 야훼를 결합한 호칭입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְבֵית יִשְׂרָאֵל
  english_pob_choice: for the house of Israel
  chosen_korean: 이스라엘 집에
  alternatives_korean:
