  - 이스라엘 백성에게
  lexicon: HALOT
  rationale: ‘집’의 언약적 집단성을 살리기 위해 직역에 가까운 ‘이스라엘 집’을 유지했습니다.
- source_word: לְמִבְטָח
  english_pob_choice: a source of confidence
  chosen_korean: 신뢰의 대상
  alternatives_korean:
  - 믿음의 대상
  - 안전의 근거
  - 의지처
  lexicon: HALOT
  rationale: מִבְטָח은 단순한 느낌의 ‘확신’보다 의지하게 되는 대상이나 근거를 가리키므로, 현대 한국어에서 자연스럽고 의미를 드러내는 ‘신뢰의 대상’으로 옮겼습니다.
- source_word: מַזְכִּיר עָוֺן
  english_pob_choice: bringing iniquity to remembrance
  chosen_korean: 악을 기억나게 하는 것
  alternatives_korean:
  - 죄를 상기시키는 것
  - 죄책을 떠올리게 하는 것
  - 악행을 기억나게 하는 것
  lexicon: HALOT
  rationale: ‘기억나게 하는’의 인과성을 살리되, עָוֺן을 여기서는 도덕적 악/죄책의 범위로 이해하여 지나치게 심리화하지 않는 표현을 택했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  - 주 하나님 야훼
  lexicon: HALOT
  rationale: 한국어 가독성과 POB의 현재 어투를 고려해 ‘주 하나님’으로 옮겼습니다. 다만 본문이 아도나이+YHWH의 결합 호칭임은 유지했습니다.
theological_decisions:
- issue: 결합 호칭 אֲדֹנָי יְהוִה의 한국어 처리
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 여호와
  - 주 야훼
  rationale: 이 구절의 핵심은 하나님의 주권적 자기선언이므로, 한국어 본문에서는 자연스러운 합성 호칭을 쓰되, 원문의 이중 호칭 구조를 해치지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: divine name rendering and readability in compounds'
- issue: 끝 결과를 나타내는 וְיָדְעוּ כִּי의 처리
  chosen_reading: 그러면 그들은 … 알게 될 것입니다
  alternative_readings:
  - 그리고 그들은 … 알게 될 것입니다
  - 그리하여 그들은 … 알게 될 것입니다
  rationale: 문맥상 앞선 진술의 결과를 나타내므로 ‘그러면’으로 옮겨 논리 흐름을 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md: preserve discourse force without over-paraphrase'
