source:
  edition: WLC
  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה מִ/קֵּ֞ץ אַרְבָּעִ֤ים שָׁנָה֙ אֲקַבֵּ֣ץ אֶת מִצְרַ֔יִם מִן הָ/עַמִּ֖ים אֲשֶׁר נָפֹ֥צוּ שָֽׁמָּ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/013.yaml
  text: 'For thus says the Lord GOD: At the end of forty years I will gather Egypt from the peoples among whom they were scattered[a].'
  footnotes:
  - marker: a
    text: Hebrew 'from the peoples'; alternatively, 'from the nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이와 같이 말씀하십니다. “사십 년이 끝날 때에 내가 이집트를, 그들이 흩어졌던 민족들 가운데서 모으겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘민족들로부터’이며, 대안으로 ‘나라들로부터’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 야훼께서
  alternatives_korean:
  - 주 하나님께서
  - 주 야훼께서
  lexicon: HALOT
  rationale: 이 구절의 핵심은 예언자 선포의 주체를 하나님의 언약 이름으로 드러내는 데 있으며, 합쇼체 본문에서는 중복 тит울을 피하면서도 יְהוִה를 직접 반영한 ‘야훼’가 가장 source-direct합니다.
- source_word: כֹּה אָמַר
  english_pob_choice: thus says
  chosen_korean: 이와 같이 말씀하십니다
  alternatives_korean:
  - 이렇게 말씀하십니다
  - 주께서 이같이 말씀하십니다
  lexicon: HALOT
  rationale: 히브리 예언자 공식문구를 현대 한국어 예언 선언체로 옮기되, 지나치게 고어적인 ‘가라사대’를 피하고 합쇼체를 유지했습니다.
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  english_pob_choice: At the end of forty years
  chosen_korean: 사십 년이 끝날 때에
  alternatives_korean:
  - 사십 년 끝에
  - 사십 년 후에
  lexicon: HALOT
  rationale: מִקֵּץ는 기간의 종료점을 가리키므로 단순한 ‘후에’보다 ‘끝날 때에’가 더 정확합니다.
- source_word: אֲקַבֵּץ
  english_pob_choice: I will gather
  chosen_korean: 모으겠습니다
  alternatives_korean:
  - 모아들이겠습니다
  - 모으겠습니다
  lexicon: HALOT
  rationale: 여기서는 흩어진 백성을 다시 불러 모으는 회복적 수집의 뜻이므로 ‘모으다’가 자연스럽고, ‘가져오겠습니다’보다 원문의 집합 이미지를 잘 살립니다.
- source_word: מִצְרַיִם
  english_pob_choice: Egypt
  chosen_korean: 이집트를
  alternatives_korean:
  - 애굽을
  - 이집트 백성을
  lexicon: HALOT
  rationale: 본문은 राष्ट्र/국가 전체를 가리키는 metonymy이므로 지명 형태를 유지했습니다. 한국어에서는 현대 표준 외래어 표기인 ‘이집트’가 가장 읽기 자연스럽습니다.
- source_word: מִן הָעַמִּים
  english_pob_choice: from the peoples
  chosen_korean: 민족들 가운데서
  alternatives_korean:
  - 백성들 가운데서
  - 열국 가운데서
  lexicon: HALOT
  rationale: עַמִּים의 문자적 대응은 ‘민족들’이며, 한국어에서는 ‘가운데서’가 분산된 상태를 자연스럽게 표현합니다.
theological_decisions:
- issue: 예언자 공식을 현대 한국어로 옮길 때의 문체
  chosen_reading: 합쇼체의 선언형으로 ‘야훼께서 이와 같이 말씀하십니다’라고 옮겼습니다.
  alternative_readings:
  - ‘야훼가 이와 같이 말씀한다’
  - ‘주 하나님이 이같이 말씀하신다’
  rationale: 본문은 하나님의 직접 선포를 여는 공식이므로, 한국어 본문에서도 경건한 거리감과 현재적 권위를 동시에 유지해야 합니다. 합쇼체가 가장 안정적입니다.
  doctrine_reference: 'POB Korean style guide: prophetic/divine speech in standard formal-polite Korean'
