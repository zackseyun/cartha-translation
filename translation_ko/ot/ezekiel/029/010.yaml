source:
  edition: WLC
  text: לָ/כֵ֛ן הִנְ/נִ֥י אֵלֶ֖י/ךָ וְ/אֶל יְאֹרֶ֑י/ךָ וְ/נָתַתִּ֞י אֶת אֶ֣רֶץ מִצְרַ֗יִם לְ/חָרְבוֹת֙ חֹ֣רֶב שְׁמָמָ֔ה מִ/מִּגְדֹּ֥ל סְוֵנֵ֖ה וְ/עַד גְּב֥וּל כּֽוּשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/010.yaml
  text: Therefore[a], behold, I am against you and against your Nile channels, and I will make the land of Egypt ruins, a desolation laid waste, from Migdol to Syene[c][b], as far as the border of Cush.
  footnotes:
  - marker: a
    text: Or 'your rivers'; the Hebrew term in Egyptian contexts often refers specifically to the Nile and its branches or canals.
    reason: lexical_alternative
  - marker: b
    text: Syene is the ancient city near modern Aswan, marking Egypt's southern extent.
    reason: cultural_note
  - marker: c
    text: Cush refers to the region south of Egypt, often associated with Nubia rather than the boundaries of the modern state of Ethiopia.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 보십시오. 내가 너와 네 나일 수로들을 대적합니다. 내가 이집트 땅을 폐허와 철저히 황폐한 불모지로 만들겠습니다. 믹돌에서 스웨네까지, 곧 구스의 경계까지 그러하겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나일 수로들’은 이집트 문맥에서 히브리어 יְאֹר가 나일강과 그 지류나 운하를 가리킬 수 있음을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 스웨네는 오늘날의 아스완 부근에 있던 고대 도시로, 이집트의 남쪽 끝을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 구스는 이집트 남쪽의 지역을 가리키며, 현대 국가인 에티오피아의 국경과 동일시할 수 없습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִנְנִי אֵלֶיךָ
  english_pob_choice: behold, I am against you
  chosen_korean: 보십시오, 내가 너를 향해 있습니다
  alternatives_korean:
  - 보라, 내가 너를 대적합니다
  - 보십시오, 내가 너를 대적하고 있습니다
  lexicon: HALOT
  rationale: 예언적 선언의 정형 표현인 הִנְנִי의 엄숙한 화행을 살리면서, 전치사 אֵלֶיךָ는 단순한 '대적'보다 방향성과 긴장을 함께 드러내는 '너를 향해'로 옮겼습니다.
- source_word: יְאֹרֶיךָ
  english_pob_choice: your Nile channels
  chosen_korean: 너의 나일 수로들
  alternatives_korean:
  - 너의 강들
  - 너의 나일 강줄기들
  - 너의 나일 운하들
  lexicon: HALOT
  rationale: 이집트 문맥의 יְאֹר은 일반적인 '강'보다 나일과 그 지류·수로를 가리키므로, 이집트적 배경을 살리는 '나일 수로들'로 번역했습니다.
- source_word: לְחָרְבוֹת חֹרֶב שְׁמָמָה
  english_pob_choice: ruins, a desolation laid waste
  chosen_korean: 폐허들, 황무한 황폐
  alternatives_korean:
  - 완전한 폐허와 황폐
  - 폐허와 황무함
  - 황폐한 폐허
  lexicon: HALOT
  rationale: 파괴를 뜻하는 말들이 중첩된 표현이므로, 한 단어로 평평하게 만들지 않고 '폐허들'과 '황무한 황폐'로 누적된 폐허감을 살렸습니다.
- source_word: מִמִּגְדֹּל סְוֵנֵה ... גְּבוּל כּוּשׁ
  english_pob_choice: from Migdol to Syene ... as far as the border of Cush
  chosen_korean: 믹돌에서 스웨네에 이르기까지, 그리고 구스의 경계에 이르기까지
  alternatives_korean:
  - 믹돌에서 시에네에 이르기까지, 곧 구스 경계까지
  - 믹돌에서 아스완에 이르기까지, 그리고 에티오피아 경계까지
  lexicon: HALOT
  rationale: 지명은 히브리어 형태를 따라 음역했고, כּוּשׁ은 현대국가명이 아니라 성경적 지리명인 '구스'로 유지해 본문의 범위를 그대로 드러냈습니다.
theological_decisions:
- issue: 예언적 심판 공식의 화행 강도
  chosen_reading: '''보십시오, 내가 너를 향해 있습니다''로 옮겨 야훼의 직접적 विरोध 선언을 유지했습니다.'
  alternative_readings:
  - '''내가 너를 대적합니다'''
  - '''내가 너를 향하여 있노라'''
  rationale: 본문은 단순한 예고가 아니라 하나님의 심판적 대면을 선포합니다. 따라서 현대 한국어에서 자연스럽되, 예언 선언의 긴장과 엄중함을 약화하지 않는 표현을 택했습니다.
  doctrine_reference: 예언서의 심판 선언, 하나님의 주권적 개입
