id: EZK.29.14
reference: Ezekiel 29:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׁבְתִּי֙ אֶת שְׁב֣וּת מִצְרַ֔יִם וַ/הֲשִׁבֹתִ֤י אֹתָ/ם֙ אֶ֣רֶץ פַּתְר֔וֹס עַל אֶ֖רֶץ מְכֽוּרָתָ֑/ם וְ/הָ֥יוּ שָׁ֖ם מַמְלָכָ֥ה שְׁפָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/014.yaml
  text: And I will restore the fortunes of Egypt and bring them back to the land of Pathros[a], to the land of their origin[b], and there they will be a lowly kingdom.
  footnotes:
  - marker: a
    text: Or, 'I will bring back the captives of Egypt' / 'I will restore the captivity of Egypt.' The Hebrew idiom can be rendered more literally, though here it likely refers more broadly to restoring Egypt's condition.
    reason: lexical_alternative
  - marker: b
    text: Pathros was a region of Upper Egypt, here described as the Egyptians' land of origin.
    reason: cultural_note
translation:
  language: ko
  text: 내가 이집트의 형편을 회복시키고[a] 그들을 바드로스 땅[b], 곧 그들의 고향 땅으로 돌아오게 하겠습니다. 그들은 այնտեղ서 보잘것없는 나라가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이집트의 형편을 회복시키고’는 히브리어 관용구 שׁוּב שְׁבוּת의 넓은 뜻을 살린 번역입니다. 문자적으로는 ‘이집트의 포로들을 돌아오게 하다’ 또는 ‘이집트의 포로 상태를 되돌리다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바드로스’는 상이집트의 한 지역으로, 여기서는 이집트인들의 고향 땅으로 묘사됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁבְתִּי אֶת־שְׁבוּת מִצְרַיִם
  english_pob_choice: I will restore the fortunes of Egypt
  chosen_korean: 내가 이집트의 회복을 이루고
  alternatives_korean:
  - 내가 이집트의 포로를 돌아오게 하고
  - 내가 이집트의 포로 상태를 회복하고
  lexicon: HALOT
  rationale: שׁוּב שְׁבוּת는 예언서에서 흔히 ‘회복하다/상태를 되돌리다’는 관용구이므로, 한국어도 문맥에 맞게 ‘회복을 이루다’로 옮겨 포로 귀환을 뜻하는 문자적 의미에만 좁히지 않았습니다.
- source_word: וַהֲשִׁבֹתִי אֹתָם
  english_pob_choice: and bring them back
  chosen_korean: 그들을 다시 … 돌아오게 하겠습니다
  alternatives_korean:
  - 그들을 다시 데려오겠습니다
  - 그들을 되돌리겠습니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려 하나님이 직접 그들을 귀환시키신다는 점을 분명히 했고, 현대 한국어에서는 ‘돌아오게 하겠습니다’가 자연스럽습니다.
- source_word: אֶרֶץ פַּתְרוֹס
  english_pob_choice: the land of Pathros
  chosen_korean: 바드로스 땅
  alternatives_korean:
  - 바드로스
  - 파트로스 땅
  lexicon: HALOT
  rationale: 지명은 현대 외래어 표기 관행에 따라 음역하되, 원문의 ‘땅’(אֶרֶץ)을 유지해 장소 구문을 분명히 했습니다.
- source_word: עַל אֶרֶץ מְכֻרָתָם
  english_pob_choice: to the land of their origin
  chosen_korean: 그들의 근원지의 땅
  alternatives_korean:
  - 그들의 출생의 땅
  - 그들의 고향 땅
  lexicon: HALOT
  rationale: מְכוּרָה는 출생지/근원지를 가리키므로, ‘근원지’로 원뜻을 살리되 ‘땅’과 결합해 반환 목적지를 분명히 했습니다.
- source_word: מַמְלָכָה שְׁפָלָה
  english_pob_choice: a lowly kingdom
  chosen_korean: 보잘것없는 나라
  alternatives_korean:
  - 낮은 나라
  - 겸손한 나라
  - 미천한 나라
  lexicon: HALOT
  rationale: שָׁפָל은 낮아진 상태·비천함을 뜻하므로, 위상 축소를 드러내는 표현으로 ‘보잘것없는’이 자연스럽고도 강도를 유지합니다.
theological_decisions:
- issue: שׁוּב שְׁבוּת의 번역 범위
  chosen_reading: ‘이집트의 회복을 이루다’로 넓게 번역했습니다.
  alternative_readings:
  - ‘이집트의 포로를 돌려보내다’
  - ‘이집트의 포로 상태를 회복하다’
  rationale: 바로 뒤에서 실제 귀환 장소가 명시되므로, 앞절은 관용구의 회복 의미를 살려 중복을 피하는 것이 본문의 예언적 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘그들의 근원지의 땅’에서 עַל의 처리
  chosen_reading: 문맥상 이동 방향을 따라 ‘…로 돌아오게 하겠습니다’ 안에 흡수했습니다.
  alternative_readings:
  - ‘그들의 근원지의 땅 위에’
  - ‘그들의 근원지 땅으로’
  rationale: 히브리어 전치사 עַל을 직역한 ‘위에’는 한국어에서 부자연스러우므로, 이동 동사와 결합해 ‘~로 돌아오게’로 의미를 보존했습니다.
  doctrine_reference: Translation philosophy §6
