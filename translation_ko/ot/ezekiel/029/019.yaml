source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י נֹתֵ֛ן לִ/נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל אֶת אֶ֣רֶץ מִצְרָ֑יִם וְ/נָשָׂ֨א הֲמֹנָ֜/הּ וְ/שָׁלַ֤ל שְׁלָלָ/הּ֙ וּ/בָזַ֣ז בִּזָּ֔/הּ וְ/הָיְתָ֥ה שָׂכָ֖ר לְ/חֵילֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/019.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am giving the land of Egypt to Nebuchadnezzar king of Babylon, and he will carry off its multitude, plunder its spoil, and seize its booty; and it will be wages for his army.'
  footnotes:
  - marker: a
    text: Hebrew 'its multitude/abundance'; here likely meaning Egypt's wealth or resources in the context of plunder.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. "보십시오, 내가 바벨론 왕 느부갓네살에게 이집트 땅을 넘겨 주겠습니다. 그가 그 무리[a]를 끌고 가고, 그들의 전리품을 약탈하고, 그들의 노획물을 빼앗을 것이며, 그것이 그의 군대의 삯이 될 것입니다."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '그의 무리/풍성함'에 해당하며, 여기서는 바벨론 군대가 약탈해 갈 이집트의 총체적 자원이나 인구를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 예언자적 신탁 서두의 결합 호칭을 살리되, 프로젝트 기본값에 따라 신명은 야훼로 옮기고 아도나이는 주로 처리했습니다.
- source_word: הִנְנִי נֹתֵן
  english_pob_choice: Behold, I am giving
  chosen_korean: 보십시오, 내가 넘겨 주겠습니다
  alternatives_korean:
  - 보라, 내가 주겠습니다
  - 내가 지금 주겠습니다
  lexicon: HALOT
  rationale: הִנְנִי의 엄숙한 선언성과 נֹתֵן의 확정적 현재 진행을 한국어 예언문답체로 자연스럽게 옮겼습니다.
- source_word: הֲמֹנָהּ
  english_pob_choice: its multitude
  chosen_korean: 그 무리
  alternatives_korean:
  - 그들의 풍부한 재물
  - 그 많은 것들
  lexicon: HALOT
  rationale: 문자적으로는 '무리/풍성함'이지만, 약탈 동사들과 병렬을 이루는 맥락에서 집단과 자원의 총체를 함께 가리킬 수 있어, 본문 흐름을 살려 '그 무리'로 옮기고 각주로 여지를 남겼습니다.
- source_word: שָׂכָר
  english_pob_choice: wages
  chosen_korean: 삯
  alternatives_korean:
  - 보상
  - 임금
  lexicon: HALOT
  rationale: 군대의 노동·원정에 대한 대가라는 뉘앙스를 살리기 위해 '삯'을 선택했습니다.
theological_decisions:
- issue: YHWH의 번역과 예언자적 선언의 어조
  chosen_reading: 신명은 야훼로 유지하고, 직설적 예언 선언문을 현대 합쇼체로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 직역형 '주가 말하셨다'
  rationale: 프로젝트의 신명 표준을 따르면서도, 히브리어 예언 공식의 무게를 잃지 않도록 현대적이되 단호한 선언체를 유지했습니다.
  doctrine_reference: POB contested terms table for יהוה YHWH; translation style guide
