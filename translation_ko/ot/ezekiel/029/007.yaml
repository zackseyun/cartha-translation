  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/תָפְשָׂ֨/ם בְּ/ךָ֤ ב/כפ/ך תֵּר֔וֹץ וּ/בָקַעְתָּ֥ לָ/הֶ֖ם כָּל כָּתֵ֑ף וּ/בְ/הִֽשָּׁעֲנָ֤/ם עָלֶ֨י/ךָ֙ תִּשָּׁבֵ֔ר וְ/הַעֲמַדְתָּ֥ לָ/הֶ֖ם כָּל מָתְנָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/007.yaml
  text: When they took hold of you with their hand[a], you were crushed, and you split open every shoulder for them; and when they leaned on you, you were broken[b], and you made all their hips stand unsteadily.
  footnotes:
  - marker: a
    text: Or 'when they relied on you.' The Hebrew keeps the physical image 'leaned on you,' continuing the reed metaphor.
    reason: lexical_alternative
  - marker: b
    text: Or 'all their loins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 손으로 당신을 붙잡을 때, 당신은 부서졌고, 그들을 위해 모든 어깨를 찢어 놓았습니다. 그리고 그들이 당신에게 기대면, 당신은 부러졌고, 그들의 모든 허리를 불안정하게 서게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 당신을 의지할 때’. 히브리어는 갈대 은유를 이어 가는 ‘당신에게 기대다’라는 물리적 이미지를 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 허리 전체’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתָפְשָׂם בְּךָ
  english_pob_choice: when they took hold of you
  chosen_korean: 그들이 당신을 붙잡을 때
  alternatives_korean:
  - 그들이 당신을 움켜잡을 때
  - 그들이 당신을 붙들 때
  lexicon: HALOT
  rationale: בְּ+부정사구의 시간적 용법을 살려 ‘~할 때’로 옮기고, 물리적으로 붙드는 이미지를 ‘붙잡다’로 자연스럽게 재현했습니다.
- source_word: תֵּרֹוץ
  english_pob_choice: you were crushed
  chosen_korean: 당신은 부서졌고
  alternatives_korean:
  - 당신은 짓눌렸고
  - 당신은 깨졌고
  lexicon: HALOT
  rationale: נִפְעַל רָצַץ의 수동적 파괴를 한국어의 ‘부서지다’로 옮겨, 뒤의 שבר과 구별되는 첫 번째 파손 이미지를 유지했습니다.
- source_word: וּבָקַעְתָּ לָהֶם כָּל כָּתֵף
  english_pob_choice: you split open every shoulder for them
  chosen_korean: 그들을 위해 모든 어깨를 찢어 놓았습니다
  alternatives_korean:
  - 그들을 위해 모든 어깨를 갈라 놓았습니다
  - 그들을 위해 모든 어깨를 쪼개 놓았습니다
  lexicon: HALOT
  rationale: בקע의 핵심인 ‘갈라/찢어 열다’ 중에서 결과의 폭력성을 가장 직접적으로 드러내는 ‘찢어 놓다’를 택했습니다. ‘어깨’는 כָּתֵף의 직역을 유지합니다.
- source_word: וּבְהִשָּׁעֲנָם עָלֶיךָ
  english_pob_choice: when they leaned on you
  chosen_korean: 그들이 당신에게 기대면
  alternatives_korean:
  - 그들이 당신에 기대면
  - 그들이 당신을 의지하면
  lexicon: HALOT
  rationale: שען의 몸의 지지 이미지를 살려 ‘기대다’로 옮겼고, 해석적 확장인 ‘의지하다’는 본문 본연의 물리적 은유를 약화시켜 제외했습니다.
- source_word: תִּשָּׁבֵר
  english_pob_choice: you were broken
  chosen_korean: 당신은 부러졌고
  alternatives_korean:
  - 당신은 깨졌고
  - 당신은 산산이 부서졌고
  lexicon: HALOT
  rationale: שבר의 수동 의미를 살리되, 앞절의 ‘부서지다’와 반복을 피하려고 ‘부러지다’를 사용했습니다.
- source_word: וְהַעֲמַדְתָּ לָהֶם כָּל מָתְנַיִם
  english_pob_choice: and you made all their hips stand unsteadily
  chosen_korean: 그들의 모든 허리를 불안정하게 서게 했습니다
  alternatives_korean:
  - 그들의 모든 허리를 흔들리게 했습니다
  - 그들의 모든 허리를 떨리게 했습니다
  lexicon: HALOT
  rationale: מָתְנַיִם은 ‘허리/허리 부분’을 가리키므로 ‘허리’로 옮기고, Hiphil의 원리상 ‘서게 하다’를 살리면서 결과적 불안정을 ‘불안정하게’로 표현했습니다.
theological_decisions:
- issue: 레드(갈대) 은유의 보존
  chosen_reading: 정치적 ‘의존’으로 풀지 않고, 몸의 접촉과 파손 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 그들을 의지하게 될 때
  - 그들이 당신을 의지할 때
  rationale: 앞절의 갈대 은유가 이어지는 문맥이므로, 물리적 이미지가 곧 예언적 비판의 힘이 되도록 두는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
