  source_fidelity: 첫 절의 ‘그가 수고한 것에 대한’은 히브리어 בָּהּ(‘그것을/그곳에서’)가 가리키는 대상을 본문에서 완전히 지워 버립니다. 문맥상 두로를 가리킬 가능성이 높다는 주석은 유지하되, 번역문에도 대명사를 남겨 원문의 연결과 불확정성을 함께 보존하는 편이 낫습니다. ‘그들이’라는 복수와 ‘나를 위하여 일했기 때문’의 인과는 원문에 충실합니다.
  naturalness: ‘그가 그것을 치며 수고한 대가로’는 군사 원정 문맥에서 자연스럽고, ‘그것’을 주석 표지와 직접 연결합니다. 나머지 문장은 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘품삯’, ‘이집트 땅’, ‘주 하나님’은 모두 적절합니다. 다만 ‘품삯’은 노동의 대가라는 문맥상 의미를 잘 전달하므로 유지할 수 있습니다. 예언자적 종결 공식도 ‘주 하나님께서 말씀하십니다’로 자연스럽게 옮겼습니다.
