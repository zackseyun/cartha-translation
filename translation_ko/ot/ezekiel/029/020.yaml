id: EZK.29.20
reference: Ezekiel 29:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פְּעֻלָּת/וֹ֙ אֲשֶׁר עָ֣בַד בָּ֔/הּ נָתַ֥תִּי ל֖/וֹ אֶת אֶ֣רֶץ מִצְרָ֑יִם אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/020.yaml
  text: As his wages for which he labored against it[a], I have given him the land of Egypt, because they worked for me[c][b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'As payment for his work which he did against it.' The Hebrew noun can mean 'work,' 'deed,' or 'wages/recompense.'
    reason: lexical_alternative
  - marker: b
    text: The pronoun 'it' likely refers to Tyre from the preceding context (29:18).
    reason: cross_reference
  - marker: c
    text: Or 'because they acted for me' or 'because they did it for me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 수고한 것에 대한 그의 품삯으로[a], 내가 그에게 이집트 땅을 주었습니다. 그들이 나를 위하여 일했기 때문입니다[c][b] — 주 하나님께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 한 일에 대한 대가로’. 히브리어 명사는 ‘일’, ‘행위’, ‘품삯/보상’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘그것’은 앞문맥(29:18)의 두로를 가리키는 것으로 이해됩니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘그들이 나를 위해 행했다’ / ‘그들이 나를 위해 일했다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּעֻלָּתוֹ
  english_pob_choice: his wages
  chosen_korean: 품삯
  alternatives_korean:
  - 보상
  - 임금
  - 삯
  lexicon: HALOT
  rationale: פְּעֻלָּה는 ‘일/행위’와 ‘보상·품삯’의 뜻을 모두 가질 수 있으며, 여기서는 사역의 대가로 주어지는 보상적 의미가 강하므로 ‘품삯’이 가장 자연스럽고 구체적입니다.
- source_word: אֲשֶׁר עָבַד בָּהּ
  english_pob_choice: for which he labored against it
  chosen_korean: 그가 수고한 것에 대한
  alternatives_korean:
  - 그가 그것을 대적하여 수고한
  - 그가 그곳에서 수고한
  - 그가 그것을 위하여 일한
  lexicon: HALOT
  rationale: 문맥상 ‘그것’은 앞문맥의 두로를 가리키며, युद्ध/원정의 수고를 뜻하므로 한국어에서는 앞의 명사구를 살려 간결하게 ‘수고한 것에 대한’으로 옮겼습니다.
- source_word: אֶת אֶרֶץ מִצְרַיִם
  english_pob_choice: the land of Egypt
  chosen_korean: 이집트 땅
  alternatives_korean:
  - 애굽 땅
  - 이집트
  - 이집트의 땅
  lexicon: HALOT
  rationale: 히브리어의 ‘땅’을 보존하되, 현대 표준어와 지명 표기를 고려해 ‘이집트 땅’으로 옮겼습니다.
- source_word: אֲשֶׁר עָשׂוּ לִי
  english_pob_choice: because they worked for me
  chosen_korean: 그들이 나를 위하여 일했기 때문입니다
  alternatives_korean:
  - 그들이 나를 위해 행했기 때문입니다
  - 그들이 나를 위해 일했기 때문입니다
  - 그들이 나를 위하여 행하였기 때문입니다
  lexicon: HALOT
  rationale: עָשׂוּ는 단순히 ‘하다’이지만, 보상 문맥에서는 실제로 ‘섬기다/일하다’의 의미가 자연스러워 ‘일했기’로 옮겨 원문의 인과를 살렸습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님께서 말씀하십니다
  alternatives_korean:
  - 주 야훼께서 말씀하십니다
  - 주 하나님께서 선언하십니다
  - 주 하나님이 말씀하십니다
  lexicon: HALOT
  rationale: 예언 종결 공식 נְאֻם은 한국어 성경문체에서 ‘말씀하십니다’로 자연스럽게 처리할 수 있으며, אֲדֹנָי יְהוִה는 통상적 경어를 유지해 ‘주 하나님’으로 옮겼습니다.
theological_decisions:
- issue: ‘그들이 나를 위하여 일했다’는 표현의 신학적 강도
  chosen_reading: 느부갓네살과 그의 군대가 야훼의 도구로서 역사했다는 의미를 유지하되, 그것을 더 넓은 승인이나 언약적 친밀감으로 확장하지 않았습니다.
  alternative_readings:
  - 그들은 단지 자기 제국의 목적을 위해 움직였다는 중립적 읽기
  - 하나님이 그들의 침략을 적극 승인하셨다는 강한 읽기
  rationale: 본문은 이집트가 보상으로 주어진 이유를 명시적으로 ‘나를 위하여 일했기 때문’이라고 제시하므로, 그 신학적 긴장을 그대로 보존하는 것이 적절합니다.
  doctrine_reference: 하나님의 주권과 열방 역사에 대한 도구성
