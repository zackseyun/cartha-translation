  - 폐허와 폐허
  lexicon: HALOT
  rationale: 두 명사가 겹쳐 황폐한 상태를 강조하므로, 한국어에서도 병렬 명사로 충격과 파괴의 중첩을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 이 프로젝트의 기본 원칙에 따라 신명은 ‘야훼’로 옮겼습니다. 이는 언약적 고유명을 직접 드러냅니다.
theological_decisions:
- issue: ‘나는 야훼인 줄 알게 될 것입니다’의 인식 공식
  chosen_reading: 심판의 결과로 이집트가 야훼의 주권을 깨닫게 된다는 예언적 인식 공식으로 유지했습니다.
  alternative_readings:
  - 단순한 정보 인지
  - 신적 자기계시의 약화된 표현
  rationale: 에스겔의 전형적 인식 공식(‘그들이 알게 될 것이다’)을 보존해야 심판과 계시의 신학이 살아납니다.
