lexical_decisions:
- source_word: וְהָיְתָה
  english_pob_choice: will become
  chosen_korean: 될 것입니다
  alternatives_korean:
  - 이 될 것입니다
  - 가 될 것입니다
  lexicon: HALOT
  rationale: 예언적 결과 상태를 미래로 옮겨 자연스럽게 표현했습니다. ‘되다’는 영어 POB의 transition 의미를 무리 없이 반영합니다.
- source_word: אֶרֶץ מִצְרַיִם
