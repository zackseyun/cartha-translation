  text: 그리고 이집트 땅은 황폐와 폐허가 될 것이며, 그들은 내가 야훼인 줄 알게 될 것입니다. 이는 그가 “나일강[a]은 내 것이며, 내가 그것을 만들었다”라고 말했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
