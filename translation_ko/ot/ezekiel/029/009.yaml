  lexicon: HALOT
  rationale: אֶרֶץ의 구체적 ‘땅/영토’ 뉘앙스를 살리기 위해 단순한 나라 이름보다 ‘땅’을 유지했습니다.
- source_word: לִשְׁמָמָה וְחָרְבָּה
  english_pob_choice: a desolation and a waste
  chosen_korean: 폐허와 황무지
  alternatives_korean:
