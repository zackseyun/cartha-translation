  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֶ/אָמֹ֤ר תֹּאמַר֙ אֱלֹהִ֣ים אָ֔נִי לִ/פְנֵ֖י הֹֽרְגֶ֑/ךָ וְ/אַתָּ֥ה אָדָ֛ם וְ/לֹא אֵ֖ל בְּ/יַ֥ד מְחַלְלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/009.yaml
  text: Will you still say[a], ‘I am a god,’ before the one who kills you? But you are a man, and not a god[c][b], in the hand of those who wound you.
  footnotes:
  - marker: a
    text: Or, “Will you indeed say” or “Will you really keep saying”; the Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a man'; the contrast is between a human being and deity.
    reason: lexical_alternative
  - marker: c
    text: Or “those who defile you”; the Hebrew verb can carry the sense of profaning or desecrating, highlighting the humiliation of one who claimed to be divine.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 “나는 하나님이다”라고 여전히 말하겠습니까[a]? 너는 사람이지 하나님이 아니며[c][b], 너를 욕되게 하는 자들의 손에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 부정사 절대형과 미완료형을 함께 써서 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “사람”입니다. 여기서는 인간과 신격의 대비가 핵심입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “너를 더럽히는 자들”입니다. 동사는 모독·더럽힘의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאָמֹר תֹּאמַר
  english_pob_choice: Will you still say
  chosen_korean: “...라고 여전히 말하겠습니까”
  alternatives_korean:
  - “...라고 정말 계속 말하겠습니까”
  - “...라고 과연 말하겠습니까”
  lexicon: HALOT
  rationale: 분사절+미완료형의 강조를 한국어에서는 ‘여전히’와 의문형으로 자연스럽게 살려, 반어적 책망의 뉘앙스를 유지했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: a god
  chosen_korean: “하나님이다”
  alternatives_korean:
  - “신이다”
  - “신적인 존재다”
  lexicon: HALOT
  rationale: 히브리어는 문맥상 자칭 신격화에 대한 조롱이므로, 한국어에서는 관사 구분이 없더라도 단정적 자칭을 직접적으로 옮겨 ‘하나님’이라 한 뒤, 주해에서 인간 통치자의 허황된 자기신격화를 보존했습니다.
- source_word: אָדָם / אֵל
  english_pob_choice: a man / a god
  chosen_korean: “사람이지 하나님이 아니며”
  alternatives_korean:
  - “인간이지 신이 아니며”
  - “사람이며 하나님이 아닙니다”
  lexicon: HALOT
  rationale: אָדָם과 אֵל의 대조를 표준어의 강한 대조 구조로 살렸고, ‘사람’과 ‘하나님’의 대비가 가장 직설적으로 원문의 반박을 드러냅니다.
- source_word: מְחַלְלֶיךָ
  english_pob_choice: those who profane you
  chosen_korean: “너를 욕되게 하는 자들”
  alternatives_korean:
  - “너를 더럽히는 자들”
  - “너를 능욕하는 자들”
  - “너를 모독하는 자들”
  lexicon: HALOT
  rationale: 이 동사는 물리적 상처보다 ‘신성/존엄을 더럽히다’의 함의를 지니므로, 한국어에서는 ‘욕되게 하다’로 수치와 비하를 함께 드러내면서도 지나치게 해석적이지 않게 했습니다.
theological_decisions:
- issue: אֱלֹהִים와 אֵל의 신격 주장/부정 표현
  chosen_reading: 문맥상 하나님(야훼) 자체에 대한 진술이 아니라, 두로 통치자의 자칭 신격을 조롱하는 표현으로 처리했습니다.
  alternative_readings:
  - “신이다”로 완화
  - “하나님”을 한 번만 써서 종교적 중립화
  rationale: 본문의 초점은 참 하나님을 논하는 것이 아니라 인간 왕의 교만한 자기신격화와 그 붕괴입니다. 한국어에서도 그 반어를 선명하게 유지해야 원문의 신학적 긴장이 보존됩니다.
  doctrine_reference: 원문 우선 원칙; 자기신격화에 대한 예언적 조롱
