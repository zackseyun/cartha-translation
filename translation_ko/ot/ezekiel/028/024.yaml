revisions:
- from: 이제는 이스라엘 집안을 위해, 그들 주변에서 그들을 업신여기는 자들 가운데서도, 괴로움을 주는 가시덤불도, 아픔을 주는 가시도 더 이상 없을 것입니다. 그러면 그들은 내가 주 여호와임을 알게 될 것입니다.[a]
  to: 이스라엘 집에는 그들을 업신여기는 사방의 모든 자들에게서 오는 쓰라림을 일으키는 가시덤불[a]이나 아픔을 주는 가시가 더 이상 없을 것입니다. 그들은 내가 주 야훼임을 알게 될 것입니다.
  rationale: 수정문은 부정 존재 구문의 대상(‘이스라엘 집에는’)을 자연스럽게 재현하고, 가시와 가시덤불이 이스라엘을 멸시하는 사방의 자들에게서 온다는 수식 관계를 명료하게 했습니다. 두 식물 이미지와 각각의 해로운 효과를 구별해 보존했으며, 각주를 해당 어휘에 직접 연결했습니다. 또한 프로젝트의 명시된 YHWH 표기 원칙에 따라 ‘주 야훼’를 사용했습니다.
  reviewer_model: gpt-5.6-terra
