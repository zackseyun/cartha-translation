source:
  edition: WLC
  text: וְ/לֹֽא יִהְיֶ֨ה ע֜וֹד לְ/בֵ֣ית יִשְׂרָאֵ֗ל סִלּ֤וֹן מַמְאִיר֙ וְ/ק֣וֹץ מַכְאִ֔ב מִ/כֹּל֙ סְבִ֣יבֹתָ֔/ם הַ/שָּׁאטִ֖ים אוֹתָ֑/ם וְ/יָ֣דְע֔וּ כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/024.yaml
  text: And the house of Israel will no longer have a brier that causes bitterness or a thorn that causes pain from all those around them who despise them[a]. Then they will know that I am the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'a prickle that embitters'; the Hebrew image is of a sharp, injurious plant used metaphorically for hostile neighbors.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제는 이스라엘 집안을 위해, 그들 주변에서 그들을 업신여기는 자들 가운데서도, 괴로움을 주는 가시덤불도, 아픔을 주는 가시도 더 이상 없을 것입니다. 그러면 그들은 내가 주 여호와임을 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쓰라림을 일으키는 가시덤불’; 히브리어 이미지는 적대적인 이웃을 가리키는 날카롭고 해로운 식물 비유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבֵית יִשְׂרָאֵל
  english_pob_choice: for the house of Israel
  chosen_korean: 이스라엘 집안을 위해
  alternatives_korean:
  - 이스라엘의 집을 위해
  - 이스라엘 집에
  lexicon: HALOT
  rationale: 전치사 לְ의 대상/이익 의미를 살려, 집합적 언약 공동체인 ‘이스라엘 집안’을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: סִלּוֹן מַמְאִיר / קוֹץ מַכְאִב
  english_pob_choice: a brier that causes bitterness / a thorn that causes pain
  chosen_korean: 괴로움을 주는 가시덤불 / 아픔을 주는 가시
  alternatives_korean:
  - 쓰라림을 일으키는 가시덤불 / 고통을 주는 가시
  - 비통하게 하는 가시덤불 / 상처 주는 가시
  lexicon: HALOT
  rationale: 두 식물 이미지를 분리해 병렬 구조를 유지했고, מַמְאִיר와 מַכְאִב의 결과적·원인적 뉘앙스를 ‘괴로움을 주는’, ‘아픔을 주는’으로 살렸습니다.
- source_word: מִכֹּל סְבִיבֹתָם הַשָּׁאטִים אוֹתָם
  english_pob_choice: from all those around them who despise them
  chosen_korean: 그들 주변에서 그들을 업신여기는 자들 가운데서도
  alternatives_korean:
  - 그들 둘레의 모든 민족 가운데서 그들을 멸시하는 자들
  - 사방의 이웃들 중 그들을 업신여기는 자들 가운데서도
  lexicon: HALOT
  rationale: 단순한 지리적 ‘주변’이 아니라 적대적 이웃 집단을 가리키므로, ‘업신여기는 자들’로 contempt를, ‘가운데서도’로 출처 범위를 살렸습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 여호와
  alternatives_korean:
  - 주 하나님
  - 주 야훼
  lexicon: HALOT
  rationale: הַ/אֲדֹנָי와 YHWH의 결합을 한국어 전통 표기로 구분해 살렸고, 본문 흐름상 신명기적 고유명칭은 ‘여호와’로 표기했습니다.
theological_decisions:
- issue: וְיָדְעוּ כִּי אֲנִי의 인식 공식 번역
  chosen_reading: 그러면 그들은 내가 주 여호와임을 알게 될 것입니다.
  alternative_readings:
  - 그리고 그들은 내가 주 여호와임을 알게 될 것입니다.
  - 그리하여 그들은 내가 주 여호와임을 알게 될 것입니다.
  rationale: 예언문에서 흔한 결과 진술을 한국어로 자연스럽게 드러내기 위해 ‘그러면’으로 옮겼습니다. 예언의 종결 인식 공식은 신학적 결론을 약화시키지 않고 직설적으로 유지했습니다.
  doctrine_reference: Ezekiel recognition formula
- issue: YHWH 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 본 절의 אֲדֹנָי יְהוִה는 한국 교회 독자에게 익숙한 합성 호칭을 유지하는 것이 읽기와 음성 낭독에서 더 직접적이므로 ‘주 여호와’로 처리했습니다.
  doctrine_reference: 'Project glossary: divine name rendering'
