  - 그리하여 그들은 내가 주 여호와임을 알게 될 것입니다.
  rationale: 예언문에서 흔한 결과 진술을 한국어로 자연스럽게 드러내기 위해 ‘그러면’으로 옮겼습니다. 예언의 종결 인식 공식은 신학적 결론을 약화시키지 않고 직설적으로 유지했습니다.
  doctrine_reference: Ezekiel recognition formula
- issue: YHWH 표기
  chosen_reading: 여호와
  alternative_readings:
