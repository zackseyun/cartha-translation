  source_fidelity: 현 초안은 두 식물 비유와 그들의 해로운 효과, 그리고 이스라엘을 멸시하는 주변 자들에 대한 언급을 대체로 보존합니다. 그러나 לְבֵית יִשְׂרָאֵל은 여기서 ‘이스라엘 집안을 위해’보다 ‘이스라엘 집에는’이 자연스럽고, מִכֹּל סְבִיבֹתָם은 가시 비유의 근원인 적대적 주변자들을 나타내므로 ‘가운데서도’는 부정확한 첨가 의미를 냅니다. 프로젝트의 YHWH 표기 방침 및 영어 감사 기록에 따라 אֲדֹנָי יְהוִה는 ‘주 야훼’로 구별했습니다.
  naturalness: ‘그들 주변에서 그들을 업신여기는 자들 가운데서도’는 수식 관계가 무겁고 ‘도’가 불필요합니다. ‘그들을 업신여기는 사방의 모든 자들에게서 오는’으로 옮기면 현대 표준 한국어에서 비유와 적대자들의 관계가 분명해집니다. ‘이스라엘 집’은 성경의 집합적 언약 명칭을 보존하면서도 자연스럽습니다.
  terminology: סִלּוֹן과 קוֹץ의 병렬은 각각 ‘가시덤불’과 ‘가시’로 유지했습니다. מַמְאִיר의 다소 불확정적인 뉘앙스는 본문에서 ‘쓰라림을 일으키는’으로, 각주에서는 대안으로 밝혔습니다. אֲדֹנָי יְהוִה는 프로젝트의 신명 표기 원칙에 맞추어 ‘주 야훼’로 옮겼습니다.
