  rationale: 이 절의 문맥에서는 아도나이와 YHWH의 중첩을 한국어에서 가장 안정적으로 드러내는 방식이 ‘주 하나님’입니다. 본문은 직접적인 야훼 음역보다 예언문 공식의 기능이 더 두드러집니다.
