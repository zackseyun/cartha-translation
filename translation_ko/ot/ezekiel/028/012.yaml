source:
  edition: WLC
  text: בֶּן אָדָ֕ם שָׂ֥א קִינָ֖ה עַל מֶ֣לֶךְ צ֑וֹר וְ/אָמַ֣רְתָּ לּ֗/וֹ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אַתָּה֙ חוֹתֵ֣ם תָּכְנִ֔ית מָלֵ֥א חָכְמָ֖ה וּ/כְלִ֥יל יֹֽפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/012.yaml
  text: 'Son of man[a], raise a lament over the king of Tyre, and say to him, ‘Thus says the Lord GOD: You were the seal of perfection[b], full of wisdom and perfect in beauty.’'
  footnotes:
  - marker: a
    text: Or 'You are the seal of perfection'; the Hebrew lacks an explicit copular verb, and the tense is supplied from context.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the seal of perfection'; alternatively, 'the signet of perfection' or 'the one sealing the pattern.'
    reason: lexical_alternative
translation:
  language: ko
  text: '[a] 인자야, 두로 왕을 두고 애가를 지어 그에게 말하여라. “주 하나님이 이렇게 말씀하십니다. 너는 완전함의 인장이었고[b], 지혜가 충만하며 아름다움이 완전하였도다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘너는’에 해당하는 명시적 연결동사가 없으므로, 문맥에 따라 현재형 또는 과거형으로 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 ‘완전함의 인장’이며, ‘봉인’ 또는 ‘도장’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔에서 반복되는 호칭형 표현으로, 한국어에서는 “인자”를 그대로 살리면 문학적·호칭적 기능을 유지할 수 있습니다.
- source_word: שָׂא קִינָה
  english_pob_choice: raise a lament
  chosen_korean: 애가를 지어
  alternatives_korean:
  - 애가를 일으켜
  - 탄식을 올려
  lexicon: HALOT
  rationale: ‘raise a lament’의 관용적 의미를 한국어 성경 문맥에 자연스럽게 옮기되, 단순한 ‘슬퍼하다’보다 예언적 애가의 형식을 드러내기 위해 ‘애가를 짓다’를 택했습니다.
- source_word: חוֹתֵם תָּכְנִית
  english_pob_choice: the seal of perfection
  chosen_korean: 완전함의 인장
  alternatives_korean:
  - 완전함의 봉인
  - 완전함의 도장
  - 완전함의 표
  lexicon: HALOT
  rationale: POB의 문구를 따라 ‘seal’의 핵심 이미지를 살리되, 한국어에서는 ‘인장’이 ‘봉인’보다 신분·권위와 표상을 함께 담아 더 적절합니다.
- source_word: מָלֵא חָכְמָה
  english_pob_choice: full of wisdom
  chosen_korean: 지혜가 충만하며
  alternatives_korean:
  - 지혜로 가득하며
  - 지혜가 가득하며
  lexicon: HALOT
  rationale: 직역에 가깝게 하면서도 한국어 병렬 구문에 맞게 자연스럽게 다듬었습니다.
- source_word: וּכְלִיל יֹפִי
  english_pob_choice: perfect in beauty
  chosen_korean: 아름다움이 완전하였도다
  alternatives_korean:
  - 아름다움이 온전하였도다
  - 아름다움이 완벽하였도다
  lexicon: HALOT
  rationale: ‘complete/perfect’의 의미를 유지하되, 시적 선언 어조를 살리기 위해 종결형을 사용했습니다.
theological_decisions:
- issue: יְהוָה를 포함한 אֲדֹנָי יְהוִה의 번역
  chosen_reading: 주 하나님
  alternative_readings:
