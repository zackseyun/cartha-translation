source:
  edition: WLC
  text: בֶּן אָדָ֕ם שָׂ֥א קִינָ֖ה עַל מֶ֣לֶךְ צ֑וֹר וְ/אָמַ֣רְתָּ לּ֗/וֹ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אַתָּה֙ חוֹתֵ֣ם תָּכְנִ֔ית מָלֵ֥א חָכְמָ֖ה וּ/כְלִ֥יל יֹֽפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/012.yaml
  text: 'Son of man[a], raise a lament over the king of Tyre, and say to him, ‘Thus says the Lord GOD: You were the seal of perfection[b], full of wisdom and perfect in beauty.’'
  footnotes:
  - marker: a
    text: Or 'You are the seal of perfection'; the Hebrew lacks an explicit copular verb, and the tense is supplied from context.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the seal of perfection'; alternatively, 'the signet of perfection' or 'the one sealing the pattern.'
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 두로 왕을 두고 애가를 지어 그에게 말하십시오. “주 야훼께서 이렇게 말씀하십니다. 너는[a] 완전함의 인장이었고[b], 지혜가 충만하며 아름다움이 완전했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에는 ‘너는’ 뒤에 해당하는 명시적 연결동사가 없으므로, 문맥에 따라 ‘너는 …이다’ 또는 ‘너는 …이었다’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 ‘본(모형)의 인을 치는 자’로도 이해할 수 있습니다. ‘완전함의 인장’, ‘완전함의 도장’ 또는 ‘본을 인치는 자’라는 번역이 가능합니다.
    reason: lexical_alternative
lexical_decisions:
