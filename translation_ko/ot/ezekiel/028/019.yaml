  source_fidelity: 수정이 필요합니다. 초안의 ‘너를 보고’는 히브리어 עָלֶיךָ(너에 관하여/너 때문에)에 없는 시각적 행위를 덧붙입니다. 또한 ‘더는 없어질 것입니다’는 이미 ‘없다’인 וְאֵינְךָ를 ‘없어지다’라는 변화 과정으로 바꾸므로, 존재 부정을 직접 나타내는 표현이 더 충실합니다. 예언적 완료의 수사적 확실성은 한국어 미래 표현으로 유지할 수 있습니다.
  naturalness: ‘민족들 가운데서 너를 아는 모든 이들이’는 자연스럽지만, ‘너를 보고 소스라치게’는 다소 구어적이며 원문의 관계를 좁힙니다. ‘너로 말미암아 경악할 것입니다’와 ‘영원토록 더 이상 존재하지 않을 것입니다’는 현대 표준어 합쇼체에서 자연스럽고 엄정한 예언 문맥에 적합합니다.
  terminology: עַמִּים은 ‘민족들’로, בַּלָּהוֹת는 문맥상 ‘공포의 대상’으로 옮기는 것이 적절합니다. ‘공포’ 자체가 되었다는 표현도 가능하나, 한국어에서는 대상성의 의미를 보충한 표현이 더 명료합니다. ‘영원토록’은 עַד עוֹלָם의 지속적 최종성을 잘 반영합니다.
