    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יוֹדְעֶיךָ
  english_pob_choice: All who know you
  chosen_korean: 민족들 가운데서 너를 아는 모든 이들
  alternatives_korean:
  - 너를 아는 모든 사람들
  - 너를 아는 이들 모두
  lexicon: HALOT
  rationale: כָּל과 ידע의 분사구문을 집합적으로 살려 ‘너를 아는 모든 이들’로 옮기되, 뒤의 בָּעַמִּים과 자연스럽게 연결되도록 문맥상 위치를 앞으로 풀어냈습니다.
- source_word: בָּעַמִּים
  english_pob_choice: among the peoples
  chosen_korean: 민족들 가운데서
  alternatives_korean:
  - 백성들 가운데서
  - 나라들 가운데서
  lexicon: HALOT
  rationale: עַמִּים의 복수성을 살리면서도 한국어에서는 ‘민족들’이 가장 무난하게 ‘peoples’를 전달합니다. ‘나라들’은 정치적 뉘앙스가 더 강합니다.
- source_word: שָׁמְמוּ עָלֶיךָ
  english_pob_choice: are appalled at you
  chosen_korean: 너를 보고 소스라치게 놀랄 것입니다
  alternatives_korean:
  - 너를 보고 놀라게 될 것입니다
  - 너 때문에 경악할 것입니다
  lexicon: HALOT
  rationale: שָׁמֵם은 단순한 놀람보다 경악·충격의 반응을 담으므로 ‘소스라치게 놀라다’로 강도를 살렸습니다. 시간 감각은 예언적 완료의 결과성을 고려해 미래로 풀었습니다.
- source_word: בַּלָּהוֹת הָיִיתָ
  english_pob_choice: you have become a horror
  chosen_korean: 너는 공포가 되었고
  alternatives_korean:
  - 너는 공포의 대상이 되었고
  - 너는 소름 끼치는 존재가 되었고
  lexicon: HALOT
  rationale: בַּלָּהוֹת은 복수형이지만 문맥상 ‘공포/공포의 대상’이라는 상태를 가리키므로, 자연스러운 한국어 술어명사로 ‘공포가 되었다’고 옮겼습니다. 영어 POB의 ‘a horror’보다 원문의 충격성을 직접적으로 드러냅니다.
- source_word: וְאֵינְךָ עַד עוֹלָם
  english_pob_choice: you will be no more forever
  chosen_korean: 영원히 더는 없어질 것입니다
  alternatives_korean:
  - 영원히 더는 존재하지 않을 것입니다
  - 영원히 사라질 것입니다
  lexicon: HALOT
  rationale: 존재 부정 표현을 직역하되 한국어에서 자연스럽고 강한 종결감이 있도록 ‘더는 없어질 것입니다’로 옮겼습니다. ‘영원히’는 עַד עוֹלָם의 최종성과 지속성을 반영합니다.
theological_decisions:
- issue: 문장의 종말적 소멸 표현의 강도
  chosen_reading: ‘더는 없어질 것입니다’로 옮겨, 단순한 실종이 아니라 회복 불가능한 최종 소멸의 수사를 드러냈습니다.
  alternative_readings:
  - ‘더는 존재하지 않을 것입니다’
  - ‘영원히 사라질 것입니다’
  rationale: 히브리어의 존재 부정과 עַד עוֹלָם의 결합은 예언적 심판의 최종성을 강조합니다. 다만 본문 자체의 수사를 넘어서 교리적 결론을 덧붙이지는 않았습니다.
  doctrine_reference: 원문 수사의 최종성 보존; 예언적 심판 언어의 강도 유지
