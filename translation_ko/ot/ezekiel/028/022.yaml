source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֤י עָלַ֨יִ/ךְ֙ צִיד֔וֹן וְ/נִכְבַּדְתִּ֖י בְּ/תוֹכֵ֑/ךְ וְֽ/יָדְע֞וּ כִּֽי אֲנִ֣י יְהוָ֗ה בַּ/עֲשׂ֥וֹתִ/י בָ֛/הּ שְׁפָטִ֖ים וְ/נִקְדַּ֥שְׁתִּי בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/022.yaml
  text: 'and say[a], ‘Thus says the Lord GOD: Behold, I am against you, Sidon, and I will be glorified in your midst[b]. And they will know that I am Yahweh when I execute judgments in her and show myself holy in her.’'
  footnotes:
  - marker: a
    text: Or 'I will gain glory in your midst.' The Hebrew verb can emphasize God’s being honored or his displaying his glory through judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'be sanctified in her' or 'manifest my holiness in her.' The expression means that the LORD’s holiness is publicly vindicated through his acts of judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 말하라. “주 야훼께서 이렇게 말씀하십니다. 보라, 내가 네게 대적하노니, 시돈아. 내가 네 한가운데서 영광을 받으리라[a]. 내가 그 성읍에 심판을 집행할 때[b] 그들은 내가 야훼인 줄 알게 되며, 내가 그 성읍에서 나의 거룩함을 드러내리라.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '내가 네 한가운데서 영광을 얻게 되리라.' 히브리어 동사는 하나님의 영광을 받으심과 그 영광이 드러남을 모두 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '내가 그 안에서 심판들을 행할 때.' 이 표현은 야훼의 심판 행위가 그 성읍 안에서 일어남을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: אֲדֹנָי와 여호와의 결합을 한국어에서도 두 요소로 구분해 살리되, 프로젝트 기본어인 야훼를 사용해 본문의 고유한 신명 호칭을 유지했습니다.
- source_word: הִנְנִי עָלַיִךְ
  english_pob_choice: Behold, I am against you
  chosen_korean: 보라, 내가 네게 대적하노니
  alternatives_korean:
  - 보라, 내가 너를 대적합니다
  - 보라, 내가 너를 향해 있노라
  lexicon: HALOT
  rationale: 선지자적 선언의 엄중한 어조를 '보라'로 살리고, עַל의 적대적 의미는 '대적하다'로 분명하게 옮겼습니다.
- source_word: וְנִכְבַּדְתִּי בְּתוֹכֵךְ
  english_pob_choice: I will be glorified in your midst
  chosen_korean: 내가 네 한가운데서 영광을 받으리라
  alternatives_korean:
  - 내가 네 가운데서 영광스럽게 되리라
  - 내가 네 한가운데서 높임을 받으리라
  lexicon: HALOT
  rationale: נכבד의 수동적 자기-영화 어감을 한국어에서는 '영광을 받다'로 자연스럽게 옮기되, 심판을 통한 하나님의 자기-입증이라는 뜻을 유지했습니다.
- source_word: בַּעֲשׂוֹתִי בָהּ שְׁפָטִים
  english_pob_choice: when I execute judgments in her
  chosen_korean: 내가 그 성읍에 심판을 집행할 때
  alternatives_korean:
  - 내가 그 안에서 심판들을 행할 때
  - 내가 그 성읍 안에서 판결을 내릴 때
  lexicon: HALOT
  rationale: שפטים는 여기서 구체적 판결이 아니라 하나님의 심판 행위를 가리키므로 '심판을 집행하다'로 옮겼고, בָּהּ는 도시를 가리키는 문맥에 따라 '그 성읍'으로 풀었습니다.
- source_word: וְנִקְדַּשְׁתִּי בָהּ
  english_pob_choice: show myself holy in her
  chosen_korean: 나의 거룩함을 드러내리라
  alternatives_korean:
  - 그 안에서 내가 거룩함을 보이리라
  - 그 성읍에서 내가 거룩하게 되리라
  lexicon: HALOT
  rationale: קדש의 니팔은 단순히 '거룩하다'보다 하나님의 거룩이 역사 속에서 드러나고 입증되는 의미를 가지므로, 현대 한국어에서 그 뜻을 분명히 하는 표현을 택했습니다.
theological_decisions:
- issue: 하나님의 영광과 거룩함이 심판을 통해 드러난다는 표현
  chosen_reading: 내가 … 영광을 받으리라 … 나의 거룩함을 드러내리라
  alternative_readings:
  - 내가 … 영광을 얻으리라 … 내가 거룩하게 되리라
  - 내가 … 높임을 받으리라 … 나의 거룩함이 입증되리라
  rationale: 이 구절은 심판이 단순한 처벌이 아니라 야훼의 영광과 거룩함을 공개적으로 드러내는 사건임을 말하므로, 두 동사를 각각 살려 신학적 긴장을 보존했습니다.
  doctrine_reference: 'Ezekiel 28:22; DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
