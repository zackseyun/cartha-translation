lexical_decisions:
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언 공식인 ‘the word of Yahweh’의 무게를 살리기 위해 일반적인 ‘말’보다 경어적·신학적으로 안정된 ‘말씀’을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문이 신명기적 전승의 고유 신명기 이름을 직접 쓰므로, POB 기준에 따라 대체 칭호가 아닌 ‘야훼’로 옮겼습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 내게로
  - 나에게
  lexicon: HALOT
  rationale: 예언자가 계시의 수신자임을 자연스럽게 드러내는 현대 문어체로 ‘내게’를 선택했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하며
  - 이르기를
  lexicon: HALOT
  rationale: 다음 절의 직접 화법을 여는 연결 표지이므로, 한국어 예언서 문맥에서 자연스러운 서술 연결인 ‘이르셨습니다’를 사용했습니다.
theological_decisions:
- issue: 예언 공식에서의 야훼의 이름 보존
  chosen_reading: ‘야훼의 말씀’으로 직접 옮겨 신적 발화의 인격적·언약적 성격을 드러냅니다.
  alternative_readings:
  - ‘주님의 말씀’으로 완화
  - ‘여호와의 말씀이’로 전통 표기 사용
  rationale: 영문 POB가 표제어가 아닌 고유 이름 Yahweh를 유지하므로, 한국어도 이를 따라 신적 칭호로 바꾸지 않고 본문 차원의 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
