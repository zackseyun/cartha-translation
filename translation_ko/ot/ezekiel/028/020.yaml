translation:
  language: ko
  text: 야훼의 말씀이 내게[a] 임하여 이르셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 YHWH; 전통적으로는 ‘주’ 또는 ‘주님’으로 옮깁니다.
