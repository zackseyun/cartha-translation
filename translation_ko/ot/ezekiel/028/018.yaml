id: EZK.28.18
reference: Ezekiel 28:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵ/רֹ֣ב עֲוֺנֶ֗י/ךָ בְּ/עֶ֨וֶל֙ רְכֻלָּ֣תְ/ךָ֔ חִלַּ֖לְתָּ מִקְדָּשֶׁ֑י/ךָ וָֽ/אוֹצִא אֵ֤שׁ מִ/תּֽוֹכְ/ךָ֙ הִ֣יא אֲכָלַ֔תְ/ךָ וָ/אֶתֶּנְ/ךָ֤ לְ/אֵ֨פֶר֙ עַל הָ/אָ֔רֶץ לְ/עֵינֵ֖י כָּל רֹאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/018.yaml
  text: By the abundance of your iniquities[a], in the unrighteousness of your trade, you profaned your sanctuaries[c][b]; so I brought out fire from your midst—it consumed you—and I turned you to ashes on the earth in the sight of all who saw you.
  footnotes:
  - marker: a
    text: 'Or ''your holy places.'' The Hebrew is plural: ''your sanctuaries.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'your trading' or 'your commerce.'
    reason: lexical_alternative
  - marker: c
    text: Some translate 'I brought out fire from within you'; the Hebrew depicts fire emerging from his midst as the instrument of judgment.
    reason: alternative_reading
translation:
  language: ko
  text: 네 죄악의 많음과 네 무역의 불의로 네 성소들을 더럽혔습니다. 그래서 내가 네 한가운데에서 불을 내보냈더니, 그것이 너를 삼켰고, 내가 너를 땅 위의 재로 만들어 너를 보는 모든 사람의 눈앞에 두었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어는 복수형입니다: ‘네 성소들’.'
    reason: source_note
  - marker: b
    text: ‘무역’은 ‘거래’나 ‘상거래’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 일부 번역은 ‘네 속에서 불을 내보냈다’로 옮기지만, 히브리어는 불이 네 한가운데에서 나와 심판의 도구가 되는 그림을 그립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵרֹב עֲוֺנֶיךָ
  english_pob_choice: By the abundance of your iniquities
  chosen_korean: 네 죄악의 많음
  alternatives_korean:
  - 네 죄악의 풍성함
  - 네 불법의 많음
  - 네 죄과의 많음
  lexicon: HALOT
  rationale: מֵרֹב은 원인/근거를 나타내며, עָוֹן은 단순한 ‘죄’보다 죄악성과 죄책을 함께 담습니다. 한국어에서는 ‘네 죄악의 많음’이 원문의 중량감을 가장 자연스럽게 살립니다.
- source_word: בְּעֶוֶל רְכֻלָּתְךָ
  english_pob_choice: in the unrighteousness of your trade
  chosen_korean: 네 무역의 불의
  alternatives_korean:
  - 네 거래의 불의
  - 네 상거래의 불의
  - 네 장사의 불의
  lexicon: HALOT
  rationale: רְכֻלָּה는 상업 활동을 가리키므로 ‘무역’이 본문 맥락에 잘 맞습니다. עֶוֶל은 정의의 반대인 불의이므로 ‘불의’로 옮겨 도덕적 평가를 분명히 했습니다.
- source_word: חִלַּלְתָּ מִקְדָּשֶׁיךָ
  english_pob_choice: you profaned your sanctuaries
  chosen_korean: 네 성소들을 더럽혔습니다
  alternatives_korean:
  - 네 성소들을 속되게 했습니다
  - 네 성소들을 욕되게 했습니다
  - 네 거룩한 곳들을 더럽혔습니다
  lexicon: HALOT
  rationale: מִקְדָּשֶׁיךָ는 복수형이므로 단수 ‘성소’로 평준화하지 않고 복수를 유지했습니다. חִלֵּל은 성스러운 것을 훼손하는 뜻이어서 ‘더럽혔습니다’가 자연스럽고 직접적입니다.
- source_word: וָאוֹצִא אֵשׁ מִתּוֹכְךָ הִיא אֲכָלַתְךָ
  english_pob_choice: so I brought out fire from your midst—it consumed you
  chosen_korean: 그래서 내가 네 한가운데에서 불을 내보냈더니, 그것이 너를 삼켰고
  alternatives_korean:
  - 그래서 내가 네 가운데에서 불을 끌어냈더니, 그것이 너를 먹어치웠고
  - 그래서 내가 네 속에서 불을 내보냈더니, 그것이 너를 삼켰고
  lexicon: HALOT
  rationale: מִתּוֹךְךָ는 ‘네 한가운데/속에서’라는 공간적 이미지를 살렸고, אשׁ은 한국어에서 보통 대명사 없이 ‘그것’으로 받는 것이 자연스럽습니다. אכל은 심판 비유로 ‘삼키다’가 적절합니다.
- source_word: וָאֶתֶּנְךָ לְאֵפֶר
  english_pob_choice: I turned you to ashes
  chosen_korean: 내가 너를 땅 위의 재로 만들어
  alternatives_korean:
  - 내가 너를 재로 돌려
  - 내가 너를 재가 되게 하여
  - 내가 너를 재로 만들고
  lexicon: HALOT
  rationale: וָאֶתֶּןְךָ לְאֵפֶר은 결과 상태를 나타내는 관용 표현이므로 ‘재로 만들어’가 의미를 잘 전달합니다. POB의 수정 반영처럼 ‘turned/reduced to ashes’의 결과성을 살렸습니다.
theological_decisions:
- issue: 공적 심판의 가시성
  chosen_reading: ‘너를 보는 모든 사람의 눈앞에’로 옮겨 심판의 공개성을 분명히 했습니다.
  alternative_readings:
  - ‘모든 보는 자들 앞에서’
  - ‘모든 관중의 눈앞에’
  rationale: לְעֵינֵי כָּל רֹאֶיךָ는 단순한 목격이 아니라 공개적 수치를 강조합니다. 한국어에서도 ‘눈앞에’가 심판의 가시성과 모욕감을 함께 전달합니다.
  doctrine_reference: 공개 심판 이미지 보존
- issue: ‘네 성소들’의 복수형 유지
  chosen_reading: 복수형을 그대로 유지하여 ‘네 성소들’로 번역했습니다.
  alternative_readings:
  - ‘네 성소’
  - ‘네 거룩한 곳’
  rationale: 히브리어는 분명한 복수형이며, 본문은 그 복수성을 통해 cultic한 파괴를 강조합니다. 이를 단수화하면 원문의 긴장이 약해집니다.
  doctrine_reference: 본문 형태 보존
