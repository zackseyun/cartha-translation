review_pass:
  verdict: revise
  source_fidelity: 마지막 절의 ‘너를 땅 위의 재로 만들어 너를 보는 모든 사람의 눈앞에 두었습니다’는 히브리어의 ‘재로 만들다’와 ‘보는 이들의 눈앞에서’라는 공적 가시성의 수식 관계를 흐립니다. ‘눈앞에 두었습니다’는 원문에 없는 별도의 배치 행위를 뜻할 수 있습니다. 또한 각주 표지는 해당 어휘·구절 가까이에 두는 편이 기능적으로 명확합니다.
  naturalness: 초안의 첫 두 절은 자연스럽고 합쇼체에 맞습니다. 다만 마지막 연결구문은 ‘재로 만들어 … 눈앞에 두었습니다’가 한국어에서 재가 된 대상을 사람들 앞에 놓았다는 뜻으로 읽힐 수 있어 다듬는 것이 안전합니다. ‘네 한가운데에서 불이 나오게 하였더니’와 ‘눈앞에서 … 재가 되게 하였습니다’는 현대 표준어로 자연스럽습니다.
  terminology: ‘죄악’, ‘불의’, ‘무역’, ‘성소들’, ‘더럽혔습니다’는 각각 עָוֹן, עֶוֶל, רְכֻלָּה, מִקְדָּשֶׁיךָ, חִלַּלְתָּ를 적절히 반영합니다. ‘성소들’의 복수와 그 문맥상 논쟁적인 성격을 유지하며 특정 해석을 강요하지 않습니다.
  issues:
  - severity: medium
    issue: 마지막 절에서 ‘눈앞에 두었습니다’가 추가적인 행위를 암시합니다.
    rationale: וָאֶתֶּנְךָ לְאֵפֶר는 재가 되게 하는 심판의 결과를 말하고, לְעֵינֵי כָּל רֹאֶיךָ는 그 일이 모든 목격자의 눈앞에서 일어남을 수식합니다. ‘너를 … 눈앞에 두었다’는 원문에 없는 배치 의미를 도입할 수 있습니다.
  - severity: low
    issue: 각주 표지가 모두 문장 끝에 몰려 있어 해당 어휘와의 연결이 불명확합니다.
    rationale: a는 ‘성소들’, b는 ‘무역’, c는 불이 나오는 표현에 각각 붙이는 것이 각주의 범위와 기능을 분명히 합니다.
  revised_text: 네 죄악이 많고 네 무역에 불의가 있었으므로, 네 성소들을[a] 더럽혔습니다. 그래서 내가 네 한가운데에서 불이 나오게 하였더니,[c] 그 불이 너를 삼켰습니다. 내가 너를 보는 모든 이의 눈앞에서 너를 땅 위의 재가 되게 하였습니다.
  revised_footnotes:
  - marker: a
    text: ‘성소들’은 ‘거룩한 곳들’로도 옮길 수 있습니다. 히브리어는 복수형입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘무역’은 ‘거래’나 ‘상거래’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 일부 번역은 ‘네 속에서 불을 내보냈다’로 옮깁니다. 히브리어는 불이 네 한가운데에서 나와 심판의 도구가 되는 모습을 묘사합니다.
    reason: alternative_reading
  revision_rationale: 원문의 인과 관계, 성소의 복수형, 불이 대상의 한가운데에서 나오는 이미지, 그리고 목격자들 앞에서 이루어지는 공개적 심판을 보존했습니다. 마지막 절의 수식 관계를 한국어에서 명료하게 하여 ‘눈앞에 두다’라는 비원문적 행위가 암시되지 않도록 했습니다. 각주 b는 제공된 영문 감사 추적의 무역 어휘 대안을 보존하지만, 본문에서 선택된 ‘무역’에는 별도 표지를 붙이지 않아도 본문 의미에는 영향이 없습니다.
