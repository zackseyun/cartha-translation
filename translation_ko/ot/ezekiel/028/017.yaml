translation:
  language: ko
  text: 당신의 아름다움 때문에 네 마음이 높아졌고, 네 광채 때문에 네 지혜를 더럽혔습니다. 내가 너를 땅에 던졌고, 왕들 앞에 두어 그들이 너를 바라보게 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּבַהּ לִבְּךָ
  english_pob_choice: Your heart was lifted up
  chosen_korean: 네 마음이 높아졌고
  alternatives_korean:
  - 네 마음이 교만해졌고
  - 네 마음이 높이 들렸고
  lexicon: HALOT
  rationale: ‘마음이 높아지다’는 히브리어 관용구의 상향 이미지를 살리면서 교만의 의미를 자연스럽게 드러냅니다.
- source_word: בְּיָפְיֶךָ
  english_pob_choice: because of your beauty
  chosen_korean: 당신의 아름다움 때문에
  alternatives_korean:
  - 네 아름다움 때문에
  - 네 아름다움으로 인해
  lexicon: HALOT
  rationale: ב의 원인적 용법을 한국어의 ‘때문에’로 풀어, 마음이 높아진 이유를 분명하게 전달합니다.
- source_word: שִׁחַתָּ חָכְמָתְךָ
  english_pob_choice: you corrupted your wisdom
  chosen_korean: 네 지혜를 더럽혔습니다
  alternatives_korean:
  - 네 지혜를 부패시켰습니다
  - 네 지혜를 망가뜨렸습니다
  lexicon: HALOT
  rationale: ‘corrupted’는 단순 파괴보다 도덕적·지적 손상을 가리키므로, 한국어로는 ‘더럽혔다’가 그 타락의 뉘앙스를 더 잘 살립니다.
- source_word: עַל יִפְעָתֶךָ
  english_pob_choice: because of your splendor
  chosen_korean: 네 광채 때문에
  alternatives_korean:
  - 네 찬란함 때문에
  - 네 화려함 때문에
  lexicon: HALOT
  rationale: יִפְעָה는 빛나는 외양과 찬란함을 뜻하므로, 앞의 ‘아름다움’과 평행을 이루는 ‘광채’로 옮겼습니다.
- source_word: עַל אֶרֶץ הִשְׁלַכְתִּיךָ
  english_pob_choice: I cast you to the earth
  chosen_korean: 내가 너를 땅에 던졌고
  alternatives_korean:
  - 내가 너를 땅으로 던졌고
  - 내가 너를 지면에 내던졌고
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 심판의 하강 지점을 가리키므로 ‘땅’이 가장 직접적이며, הִשְׁלַכְתִּיךָ의 강한 동작은 ‘던졌고’로 살렸습니다.
- source_word: לִפְנֵי מְלָכִים נְתַתִּיךָ לְרַאֲוָה בָךְ
  english_pob_choice: I set you before kings, for them to look at you
  chosen_korean: 왕들 앞에 두어 그들이 너를 바라보게 했습니다
  alternatives_korean:
  - 왕들 앞에 두어 그들이 너를 보게 했습니다
  - 왕들 앞에 세워 그들이 너를 바라보게 했습니다
  lexicon: HALOT
  rationale: ‘set you before kings’와 ‘for them to look at you’의 목적 관계를 자연스러운 한국어로 연결해, 왕들 앞에 놓인 공개적 수치를 드러냅니다.
theological_decisions:
- issue: 화자의 심판 행위와 공개적 조롱의 강도
  chosen_reading: ‘왕들 앞에 두어 그들이 너를 바라보게 했다’로 옮겨, 단순한 배치가 아니라 공개적 조롱과 경고의 성격을 드러냈습니다.
  alternative_readings:
  - ‘왕들 앞에 세웠다’로만 처리
  - ‘구경거리로 삼았다’로 직설화
  rationale: לְרַאֲוָה는 ‘보게 함’의 목적을 갖고 있으므로, 본문이 말하는 수치를 유지하되 과도한 해설어는 피했습니다.
  doctrine_reference: 심판 본문의 수치화된 공개성 유지
- issue: 대상자의 정체성 해석
  chosen_reading: 이 구절은 두로 왕을 향한 예언적 조롱의 형식으로 유지하고, 그 이상으로 신학적 동일시를 번역에 반영하지 않았습니다.
  alternative_readings:
  - 순전히 인간 왕으로 한정
  - 타락한 천상의 존재를 직접 암시
  rationale: 히브리어 본문이 직접 말하는 것은 단수 2인칭의 왕을 향한 심판 선언이므로, 번역은 본문이 분명히 말하는 범위를 넘어서지 않아야 합니다.
  doctrine_reference: 본문의 수사와 신학적 긴장 보존
