id: EZK.28.14
reference: Ezekiel 28:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֨תְּ כְּר֔וּב מִמְשַׁ֖ח הַ/סּוֹכֵ֑ךְ וּ/נְתַתִּ֗י/ךָ בְּ/הַ֨ר קֹ֤דֶשׁ אֱלֹהִים֙ הָיִ֔יתָ בְּ/ת֥וֹךְ אַבְנֵי אֵ֖שׁ הִתְהַלָּֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/014.yaml
  text: You were an anointed guardian cherub[a], and I placed you on the holy mountain of God[b]; you walked in the midst of stones of fire.
  footnotes:
  - marker: a
    text: Or 'anointed cherub that covers,' traditionally 'anointed covering cherub.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew text begins with a feminine-form pronoun ('you'), while the surrounding verbs and suffixes are masculine; the sense is still singular 'you.'
    reason: textual_variant
translation:
  language: ko
  text: 당신은 기름부음 받은 덮는 그룹[a]이며, 내가 당신을 하나님의 거룩한 산[b]에 두었고, 당신은 불의 돌들 가운데를 다녔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘덮는 기름부음 받은 그룹’. 전통적으로는 ‘기름부음 받은 덮는 그룹’이라고도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 여성형 ‘당신’으로 시작하지만, 앞뒤 동사와 접미사는 남성형입니다. 의미상 단수 ‘당신’을 가리킵니다.
    reason: textual_variant
lexical_decisions:
- source_word: כְּר֔וּב
  english_pob_choice: cherub
  chosen_korean: 그룹
  alternatives_korean:
  - 천사 같은 존재
  - 그룹
  lexicon: HALOT
  rationale: 히브리어 כְּרוּב은 성소와 보좌 이미지를 지닌 특정 천상 존재를 가리키므로, 한국어 성경 전통에서 굳어진 ‘그룹’을 사용해 구체성을 보존했습니다.
- source_word: מִמְשַׁ֖ח הַ/סּוֹכֵ֑ךְ
  english_pob_choice: anointed guardian
  chosen_korean: 기름부음 받은 덮는
  alternatives_korean:
  - 기름부음 받은 가리는
  - 기름부음 받은 보호하는
  lexicon: HALOT
  rationale: מִמְשַׁח은 ‘기름부음 받은’으로, הַסּוֹכֵךְ은 문자적으로 ‘덮는/가리는’ 뜻이므로, POB의 해석적 ‘guardian’을 따르되 원문의 ‘덮는’ 이미지를 살려 직역성을 유지했습니다.
- source_word: וּ/נְתַתִּ֗י/ךָ בְּ/הַ֨ר קֹ֤דֶשׁ אֱלֹהִים֙
  english_pob_choice: I placed you on the holy mountain of God
  chosen_korean: 내가 당신을 하나님의 거룩한 산에 두었고
  alternatives_korean:
  - 내가 당신을 하나님의 거룩한 산에 놓았고
  - 내가 당신을 하나님의 거룩한 산 위에 두었고
  lexicon: HALOT
  rationale: נָתַן은 이 문맥에서 ‘두다/놓다/세우다’의 의미이므로, 자연스러운 한국어 동사 ‘두다’로 옮겨 위치 부여의 뉘앙스를 살렸습니다.
- source_word: אַבְנֵי אֵ֖שׁ
  english_pob_choice: stones of fire
  chosen_korean: 불의 돌들
  alternatives_korean:
  - 불붙은 돌들
  - 불타는 돌들
  lexicon: HALOT
  rationale: אַבְנֵי אֵשׁ의 기이한 시적 이미지를 과도하게 풀지 않고, POB처럼 직설적으로 ‘불의 돌들’로 옮겨 원문의 긴장과 낯섦을 보존했습니다.
theological_decisions:
- issue: 대상에 대한 높임과 성별 표지
  chosen_reading: 본문 시작의 אַתְּ는 여성형 표지이지만, 이어지는 동사·접미사는 남성형이므로 한국어는 단수 대명사 ‘당신’으로 일관해 본문의 대상 지시를 유지했습니다.
  alternative_readings:
  - 여성형을 반영한 다른 표기
  - 성별 표지를 드러내지 않는 완전 중립화
  rationale: POB의 주석처럼 이는 표기상 불일치일 뿐, 의미상 동일한 단수 대상을 가리키므로 번역에서 과도하게 성별을 부각하지 않는 것이 본문의 흐름에 맞습니다.
  doctrine_reference: 텍스트 비평/문법 주석
- issue: 고양된 그룹-왕 이미지의 해석
  chosen_reading: 그룹적·에덴적·왕권적 이미지를 하나로 환원하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 단순히 두로 왕에 대한 비유로만 제한
  - 초자연적 존재에 대한 직접 묘사로 확정
  rationale: 이 절은 신성하고 신화적인 언어를 사용하므로, 번역은 해석을 선행하지 않고 본문의 긴장을 보존해야 합니다.
  doctrine_reference: 해석적 긴장 보존
