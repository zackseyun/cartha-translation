source:
  edition: WLC
  text: מוֹתֵ֧י עֲרֵלִ֛ים תָּמ֖וּת בְּ/יַד זָרִ֑ים כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/010.yaml
  text: You will die the death of the uncircumcised by the hand of foreigners[a], for I have spoken, declares the Lord GOD.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the deaths of the uncircumcised you will die,' an idiom meaning you will die a death like that of the uncircumcised.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 할례받지 못한 자들의 죽음을 당하고, 이방인의 손에 죽을 것이다. 이는 내가 말했기 때문이다. 주 야훼의 말씀이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘할례받지 못한 자들의 죽음들을 네가 죽을 것이다’라는 뜻으로, ‘할례받지 못한 자들처럼 죽는 죽음’이라는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹתֵי עֲרֵלִים
  english_pob_choice: the death of the uncircumcised
  chosen_korean: 할례받지 못한 자들의 죽음
  alternatives_korean:
  - 할례받지 못한 자들의 죽음들
  - 할례받지 못한 자들처럼 죽는 죽음
  lexicon: HALOT
  rationale: 히브리어의 관용적 복수형 מותֵי를 한국어에서 자연스럽게 ‘죽음’으로 옮기되, עֲרֵלִים의 수치·언약적 뉘앙스를 살리기 위해 ‘할례받지 못한 자들’로 옮겼습니다.
- source_word: בְּיַד זָרִים
  english_pob_choice: by the hand of foreigners
  chosen_korean: 이방인의 손에
  alternatives_korean:
  - 외국인의 손에
  - 낯선 이들의 손에
  lexicon: HALOT
  rationale: ‘손에’는 히브리어의 행위자/도구 의미를 살리는 표현이며, זָרִים는 단순한 ‘낯선 사람들’보다 심판 문맥에서 ‘이방인’이 더 정확합니다.
- source_word: כִּי אֲנִי דִבַּרְתִּי
  english_pob_choice: for I have spoken
  chosen_korean: 이는 내가 말했기 때문이다
  alternatives_korean:
  - 내가 말했으므로
  - 내가 직접 말했기 때문이다
  lexicon: HALOT
  rationale: 심판 선언의 확정성을 드러내는 원인절로 자연스럽게 옮겼습니다. 영어의 완료형은 한국어에서 현재적 확정의 뜻으로 처리하는 것이 가장 적절합니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: Project default glossary / DOCTRINE.md
  rationale: YHWH는 프로젝트 기본어인 ‘야훼’로 옮기고, אֲדֹנָי와 결합한 호칭은 한국어에서 ‘주 야훼’로 간결하게 처리해 중복을 피했습니다.
theological_decisions:
- issue: 심판 선언의 직접성
  chosen_reading: 미래형 경고를 2인칭 직설로 유지하여, 대상자에게 임하는 확정된 죽음을 분명히 드러냈습니다.
  alternative_readings:
  - 너는 죽게 될 것이다
  - 너는 반드시 죽을 것이다
  rationale: 히브리어 תָּמוּת는 예언적 미래이면서 판결 선고의 성격이 강하므로, 단순 예고보다 선언적 어조를 살렸습니다.
  doctrine_reference: 예언서의 심판 경고 어조 보존
