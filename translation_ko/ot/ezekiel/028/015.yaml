  text: You were blameless in your ways from the day you were created[a], until unrighteousness was found in you.
  footnotes:
  - marker: a
    text: Or 'perfect in your ways.' The Hebrew term can denote completeness or integrity; here 'blameless' was chosen to fit the moral context.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 자기 길에서 창조된 날부터 흠이 없었으나, 불의가 당신 안에서 발견될 때까지였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신의 길에서 완전했다'로 옮길 수 있습니다. 히브리어 תָּמִים은 완전함 또는 온전함을 뜻할 수 있으나, 여기서는 도덕적 맥락을 따라 '흠이 없다'로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
