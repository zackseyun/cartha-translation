source:
  edition: WLC
  text: הִנֵּ֥ה חָכָ֛ם אַתָּ֖ה מ/דנאל כָּל סָת֖וּם לֹ֥א עֲמָמֽוּ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/003.yaml
  text: Look[a], you are wiser than Danel; no hidden thing is obscure to you.
  footnotes:
  - marker: a
    text: Hebrew 'Danel'; traditionally 'Daniel.' The spelling here lacks the yod found in the more familiar form, so the main text preserves the Hebrew form while noting the traditional identification.
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 당신은 다넬보다 더 지혜롭습니다. 감추어진 어떤 것도 당신에게는 어둡지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 철자는 더 익숙한 ‘다니엘’이 아니라 דנאל(다넬)입니다. 본문은 이 철자를 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  - 보세요
  lexicon: HALOT
  rationale: 문맥상 강한 주목을 이끄는 감탄/지시어이므로, 현대 표준어에서 자연스럽고 합쇼체에 맞는 ‘보십시오’로 옮겼습니다.
- source_word: חָכָם
  english_pob_choice: wiser
  chosen_korean: 더 지혜롭습니다
  alternatives_korean:
  - 지혜롭습니다
  - 더 현명합니다
  lexicon: HALOT
  rationale: 히브리어는 이름 앞 전치사 מ 때문에 비교 구문이므로, 한국어도 비교를 분명히 드러내는 ‘더 지혜롭습니다’로 옮겼습니다.
- source_word: מ/דנאל
  english_pob_choice: than Danel
  chosen_korean: 다넬보다
  alternatives_korean:
  - 다니엘보다
  - 단엘보다
  lexicon: HALOT
  rationale: 자음 표기가 דנאל이므로 고유명사는 음역을 유지해 ‘다넬’로 두고, 비교 표지는 한국어 조사 ‘-보다’로 자연스럽게 처리했습니다.
- source_word: כָּל סָתוּם
  english_pob_choice: no hidden thing
  chosen_korean: 감추어진 어떤 것도
  alternatives_korean:
  - 숨은 것은 하나도
  - 어떤 숨겨진 것도
  - 비밀스러운 것은 하나도
  lexicon: HALOT
  rationale: ‘감추어지다/닫히다’의 구체성을 살리면서도 한국어에서 자연스럽게 전체 부정을 드러내는 표현으로 옮겼습니다.
- source_word: לֹא עֲמָמוּךָ
  english_pob_choice: is obscure to you
  chosen_korean: 당신에게는 어둡지 않습니다
  alternatives_korean:
  - 당신에게는 분명하지 않습니다
  - 당신에게는 가려지지 않습니다
  - 당신에게는 숨겨지지 않습니다
  lexicon: HALOT
  rationale: 어근의 핵심인 ‘어둡다/희미하다’의 의미를 살려, 단순한 은닉이 아니라 이해 불가능함이 없다는 뜻을 드러냈습니다.
theological_decisions:
- issue: 다넬(Danel) 표기와 전통적 ‘다니엘’의 관계
  chosen_reading: 본문의 자음 표기를 따라 ‘다넬’로 유지했습니다.
  alternative_readings:
  - 다니엘로 통일하는 읽기
  - 다니엘을 암시하는 동일인물 해석
  rationale: 본문은 familiar form인 다니엘의 철자와 다르므로, 본문 가시성을 유지하는 것이 출처 충실성에 더 적합합니다.
  doctrine_reference: 본문비평/고유명사 처리
