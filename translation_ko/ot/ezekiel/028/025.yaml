  text: כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בְּ/קַבְּצִ֣/י אֶת בֵּ֣ית יִשְׂרָאֵ֗ל מִן הָֽ/עַמִּים֙ אֲשֶׁ֣ר נָפֹ֣צוּ בָ֔/ם וְ/נִקְדַּ֥שְׁתִּי בָ֖/ם לְ/עֵינֵ֣י הַ/גּוֹיִ֑ם וְ/יָֽשְׁבוּ֙ עַל אַדְמָתָ֔/ם אֲשֶׁ֥ר נָתַ֖תִּי לְ/עַבְדִּ֥/י לְ/יַעֲקֹֽב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/025.yaml
  text: 'Thus says the Lord GOD: When I gather the house of Israel from the peoples among whom they were scattered[a], and I show myself holy among them in the sight of the nations, then they will dwell on their own land that I gave to my servant Jacob.'
  footnotes:
  - marker: a
    text: Or, more formally, 'I will be sanctified in them' or 'I will prove myself holy through them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. 내가 이스라엘 집안을 그들이 흩어져 있던 민족들 가운데서 모으고, 민족들이 보는 앞에서 그들 가운데서 거룩하게 드러날 때, 그들은 내가 내 종 야곱에게 준 그들의 땅에서 살게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘내가 그들 가운데서 거룩하게 될 것이다’라고 할 수 있습니다. 또는 문맥상 ‘내가 그들을 통해 거룩함을 드러낼 것이다’라는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: אֲדֹנָי와 יְהוִה가 결합된 예언자적 호칭이므로 두 요소를 모두 살리되, 본문에서 기본값인 야훼를 사용해 언약 이름을 직접 드러냈습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘 백성
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 공동체적·언약적 표현인 ‘집’을 유지해 단순히 민족 집단으로 평면화하지 않았습니다.
- source_word: הָעַמִּים ... הַגּוֹיִם
  english_pob_choice: the peoples ... the nations
  chosen_korean: 민족들 ... 민족들의 눈앞에서
  alternatives_korean:
  - 백성들 ... 나라들
  - 민족들 ... 나라들의 눈앞에서
  lexicon: HALOT
  rationale: עַמִּים과 גּוֹיִם의 차이를 구분해 둘 다 ‘민족들’로 옮기되, 뒤의 관용구는 ‘눈앞에서’로 자연스럽게 풀었습니다.
- source_word: וְנִקְדַּשְׁתִּי בָם
  english_pob_choice: I show myself holy through them
  chosen_korean: 나는 그들 가운데서 나의 거룩함을 나타낼 것이며
  alternatives_korean:
  - 나는 그들 안에서 거룩하게 될 것이며
  - 나는 그들로 말미암아 거룩함을 드러낼 것이며
  lexicon: HALOT
  rationale: 니팔의 קדשׁ은 하나님이 스스로 거룩하심을 드러내시는 뜻이므로, ‘거룩하게 되다’보다 ‘거룩함을 나타내다’가 신학적 긴장을 보존하면서도 한국어로 자연스럽습니다.
- source_word: וְיָשְׁבוּ עַל אַדְמָתָם
  english_pob_choice: then they will dwell on their own land
  chosen_korean: 그러면 그들은 ... 자기 땅에 살게 될 것입니다
  alternatives_korean:
  - 그러면 그들은 ... 그들의 땅에 거주할 것입니다
  - 그러면 그들은 ... 자기 땅에 거하게 될 것입니다
  lexicon: HALOT
  rationale: יָשַׁב의 정착 거주 의미를 살려 ‘살다’로 옮겼고, 소유 대명사로 귀환의 회복을 분명히 했습니다.
theological_decisions:
- issue: יַהְוֶה의 한국어 표기와 예언자적 호칭 보존
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 본문의 언약 이름을 직접 드러내면서도 אֲדֹנָי와의 결합을 한국어 예언서 문맥에서 자연스럽게 유지하기 위한 선택입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH → Yahweh'
- issue: וְנִקְדַּשְׁתִּי בָם의 신학적 의미
  chosen_reading: 그들 가운데서 나의 거룩함을 나타낼 것이며
  alternative_readings:
  - 그들 안에서 거룩하게 될 것이며
  - 그들로 말미암아 거룩함을 드러낼 것이며
  rationale: 하나님이 도덕적으로 변화된다는 뜻이 아니라, 이스라엘의 회복을 통해 민족들 앞에서 하나님의 거룩하심이 공적으로 드러난다는 의미를 보존했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
