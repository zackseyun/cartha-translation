revisions:
- from: 주 야훼께서 이렇게 말씀하십니다. 내가 이스라엘 집을 그들이 흩어져 있던 민족들 가운데서 모을 때, 나는 그들 가운데서 나의 거룩함을 나타낼 것이며, 민족들의 눈앞에서 그렇게 할 것입니다. 그러면 그들은 내가 내 종 야곱에게 준 자기 땅에 살게 될 것입니다.[a]
  to: 주 야훼께서 이렇게 말씀하십니다. 내가 이스라엘 집안을 그들이 흩어져 있던 민족들 가운데서 모으고, 민족들이 보는 앞에서 그들 가운데서 거룩하게 드러날 때, 그들은 내가 내 종 야곱에게 준 그들의 땅에서 살게 될 것입니다.[a]
  rationale: The revision joins the public ‘before the nations’ phrase directly to the divine self-sanctification clause, removes the redundant ‘그렇게 할 것입니다,’ and uses ‘거룩하게 드러나다’ to reflect the Hebrew Niphal without over-resolving its nuance. The collective expression is made more idiomatic with ‘이스라엘 집안,’ and the footnote is corrected for both grammar and lexical accuracy.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:41:29Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the gathering of the house of Israel, their scattering among the peoples, public manifestation of divine holiness before the nations, and renewed dwelling in the land given to Jacob. However, it redundantly renders the public-witness phrase as a separate action ('민족들의 눈앞에서 그렇게 할 것입니다'), rather than attaching it directly to the manifestation of holiness. The footnote's first alternative is also not genuinely more literal, and its second alternative has an ungrammatical expression ('그들로 통해').
  naturalness: ‘이스라엘 집’ is understandable but somewhat unnatural as a Korean collective designation; ‘이스라엘 집안’ is smoother while retaining the household/corporate image. Combining the holiness clause with ‘민족들이 보는 앞에서’ produces a more natural and source-shaped Korean sentence.
  terminology: ‘주 야훼’ appropriately preserves both elements of אֲדֹנָי יְהוִה under the supplied naming policy. ‘거룩하게 드러나다’ preserves the Niphal sense without implying any change in God. ‘민족들’ is retained for both Hebrew terms, as in the draft; the contextual distinction is still clear.
  issues:
  - severity: medium
    issue: The phrase ‘민족들의 눈앞에서 그렇게 할 것입니다’ adds an unnecessary separate action and weakens the direct connection of לְעֵינֵי הַגּוֹיִם with the sanctification clause.
    rationale: The Hebrew states that God is sanctified/manifested as holy among them ‘before the eyes of the nations.’ Korean should attach this phrase directly to the holiness manifestation.
  - severity: medium
    issue: The footnote alternatives are inaccurate or ungrammatical.
    rationale: ‘그들 가운데서 내가 거룩함을 나타낼 것이다’ is interpretive rather than more literal for וְנִקְדַּשְׁתִּי, and ‘그들로 통해’ should be ‘그들을 통해.’ A revised note should distinguish the literal passive form from the interpretive instrumental sense.
  revised_text: 주 야훼께서 이렇게 말씀하십니다. 내가 이스라엘 집안을 그들이 흩어져 있던 민족들 가운데서 모으고, 민족들이 보는 앞에서 그들 가운데서 거룩하게 드러날 때, 그들은 내가 내 종 야곱에게 준 그들의 땅에서 살게 될 것입니다.[a]
