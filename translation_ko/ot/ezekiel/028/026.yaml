  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָשְׁב֣וּ עָלֶי/הָ֮ לָ/בֶטַח֒ וּ/בָנ֤וּ בָתִּים֙ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/יָשְׁב֖וּ לָ/בֶ֑טַח בַּ/עֲשׂוֹתִ֣/י שְׁפָטִ֗ים בְּ/כֹ֨ל הַ/שָּׁאטִ֤ים אֹתָ/ם֙ מִ/סְּבִ֣יבוֹתָ֔/ם וְ/יָ֣דְע֔וּ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/026.yaml
  text: They will dwell on it securely, and they will build houses and plant vineyards. They will dwell securely when I execute judgments on all those who treat them with contempt all around them. Then they will know that I am the LORD their God.
translation:
  language: ko
  text: 그들은 그 위에 안전하게 살며, 집들을 짓고 포도원들을 심을 것입니다. 내가 그들 주위에서 그들을 멸시하는 모든 이들에 대해 심판을 집행할 때에도 그들은 안전하게 살 것입니다. 그러면 그들은 내가 그들의 하나님인 야훼임을 알게 될 것입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘그들 위에’입니다.
    reason: source_note
lexical_decisions:
- source_word: וְיָשְׁבוּ עָלֶיהָ לָבֶטַח / וְיָשְׁבוּ לָבֶטַח
  english_pob_choice: They will dwell on it securely ... They will dwell securely
  chosen_korean: 안전하게 살며 ... 안전하게 살 것입니다
  alternatives_korean:
  - 평안히 거하며
  - 안심하고 살며
  lexicon: יָשַׁב / לָבֶטַח
  rationale: 반복되는 ‘거하다/살다’와 ‘안전하게’의 의미를 자연스럽게 살리되, 현대 한국어에서 본문 흐름에 맞게 ‘살다’를 택했습니다.
- source_word: וּבָנוּ בָתִּים וְנָטְעוּ כְרָמִים
  english_pob_choice: they will build houses and plant vineyards
  chosen_korean: 집들을 짓고 포도원들을 심을 것입니다
  alternatives_korean:
  - 집을 짓고 포도원을 심을 것입니다
  - 집들을 세우고 포도밭들을 가꿀 것입니다
  lexicon: בָּתִּים / כְרָמִים
  rationale: ‘포도원’을 직역해 농경적 정착과 번영의 이미지를 유지했고, 복수형은 문맥상 일반적 복수로 옮겼습니다.
- source_word: בַּעֲשׂוֹתִי שְׁפָטִים בְּכֹל הַשָּׁאטִים אֹתָם מִסְּבִיבוֹתָם
  english_pob_choice: when I execute judgments on all those who treat them with contempt all around them
  chosen_korean: 내가 그들 주위에서 그들을 멸시하는 모든 이들에 대해 심판을 집행할 때에도
  alternatives_korean:
  - 내가 그들을 둘러싼 모든 멸시하는 자들에게 심판을 내릴 때에도
  - 내가 사방에서 그들을 업신여기는 모든 사람에게 판결을 행할 때에도
  lexicon: שָׁאַט / שְׁפָטִים
  rationale: 핵심 대조는 ‘멸시하다/업신여기다’와 ‘심판을 집행하다’이므로, POB의 ‘treat ... with contempt’를 반영해 의미를 분명히 했습니다.
- source_word: יְהוָה אֱלֹהֵיהֶם
  english_pob_choice: the LORD their God
  chosen_korean: 그들의 하나님인 야훼
  alternatives_korean:
  - 그들의 하나님이신 야훼
  - 야훼 그들의 하나님
  lexicon: יהוה + אֱלֹהִים
  rationale: 본문의 יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 소유 관계는 한국어 어순에 맞춰 자연스럽게 처리했습니다.
theological_decisions:
- issue: 언약 회복의 표지로서의 안전과 심판
  chosen_reading: 안전하게 거주하는 상태와 주변의 멸시하는 이들에 대한 하나님의 심판이 함께 제시되는 것으로 옮겼습니다.
  alternative_readings:
  - 심판을 앞세워 보호를 부차화하는 번역
  - ‘안전히 거주’만 강조해 심판의 배경을 약화하는 번역
  rationale: 문장은 보호의 결과와 그 보호를 확증하는 심판을 함께 말하므로, 둘 다 문장 구조에서 드러나도록 유지했습니다.
  doctrine_reference: 언약적 보호와 공의의 심판
- issue: יהוה의 호칭
  chosen_reading: 마지막 절의 יהוה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본값과 원문 가시성을 따라 고유 신명 표기를 유지하는 편이 원문 추적성에 유리합니다.
  doctrine_reference: 신명 표기 일관성
