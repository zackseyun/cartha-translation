    text: 또는 ‘네 마음을 하나님의 마음과 같게 하였기 때문이다.’ 히브리어 אֱלֹהִים은 문맥에 따라 ‘하나님’, ‘한 신’, 또는 ‘신들’을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그러니
  lexicon: HALOT
  rationale: 앞선 책망에 이어지는 결과를 자연스럽게 잇는 추론 접속사로, 예언문 맥락에 어울리는 격식을 유지합니다.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  english_pob_choice: thus says the Lord GOD
  chosen_korean: 주 야훼께서 이같이 말씀하십니다
  alternatives_korean:
