source:
  edition: WLC
  text: לָ/כֵ֕ן כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה יַ֛עַן תִּתְּ/ךָ֥ אֶת לְבָבְ/ךָ֖ כְּ/לֵ֥ב אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/006.yaml
  text: 'Therefore thus says the Lord GOD: Because you have made your heart like the heart of a god,[a]'
  footnotes:
  - marker: a
    text: Or 'like the heart of God.' Hebrew אֱלֹהִים can mean 'God,' 'a god,' or 'gods' depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 주 야훼께서 이같이 말씀하십니다. 네가 네 마음을 하나님의 마음처럼 만들었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 마음처럼’. 히브리어 אֱלֹהִים은 문맥에 따라 ‘하나님’, ‘한 신’, ‘신들’을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그러니
  lexicon: HALOT
  rationale: 앞선 책망에 이어지는 결과를 자연스럽게 잇는 추론 접속사로, 예언문 맥락에 어울리는 격식을 유지합니다.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  english_pob_choice: thus says the Lord GOD
  chosen_korean: 주 야훼께서 이같이 말씀하십니다
  alternatives_korean:
  - 주 하나님께서 이같이 말씀하십니다
  - 주 야훼께서 말씀하시기를 이르십니다
  lexicon: HALOT
  rationale: 예언자적 전령 공식의 현재형 선포를 살리면서, 아도나이+יהוה 결합은 한국어에서 두 호칭을 함께 드러내는 방식으로 옮겼습니다.
- source_word: יַעַן
  english_pob_choice: Because
  chosen_korean: -기 때문입니다
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: HALOT
  rationale: 직접 원인 제시를 한국어 문장 구조에 맞게 종결 이유형으로 반영해, 선언문의 힘을 유지했습니다.
- source_word: כְּלֵב אֱלֹהִים
  english_pob_choice: like the heart of a god
  chosen_korean: 하나님의 마음처럼
  alternatives_korean:
  - 한 신의 마음처럼
  - 하나님의 마음처럼
  lexicon: HALOT
  rationale: 문맥상 교만한 신격화의 비교를 드러내되, 영어 POB의 주석처럼 אֱלֹהִים의 해석 가능성을 열어 두기 위해 본문은 자연스러운 비교어로 처리했습니다.
theological_decisions:
- issue: אֱלֹהִים의 비교구를 한국어 본문에서 어떻게 처리할지
  chosen_reading: 하나님의 마음처럼
  alternative_readings:
  - 신의 마음처럼
  - 한 신의 마음처럼
  rationale: 원문은 두로 왕의 자만을 고발하는 문맥이지만, 한국어에서는 ‘하나님/신’의 대비가 신격화 비판을 약화시키지 않으면서도 비교의 과장을 살려 줍니다. 주석 없이 단정적으로 ‘신’으로 밀기보다, 본문은 읽기 자연성을 택하고 해석 쟁점은 각주로 남겼습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
