  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어에서 자연스러운 방향 설정 표현으로 옮겼습니다. '얼굴'은 פָּנֶיךָ의 구체성을 유지합니다.
- source_word: צִידוֹן
  english_pob_choice: Sidon
  chosen_korean: 시돈
  alternatives_korean:
  - 사돈
  lexicon: HALOT
  rationale: 지명은 통용되는 한국어 음역 '시돈'을 사용했습니다.
- source_word: וְהִנָּבֵא עָלֶיהָ
  english_pob_choice: and prophesy against her
  chosen_korean: 그 성을 향하여 예언하여라
  alternatives_korean:
  - 그 성에 대하여 예언하여라
  - 그 성을 향하여 예언하라
  lexicon: HALOT
  rationale: 예언 행위의 대상이 시돈이라는 점을 분명히 하면서, 심판적 뉘앙스를 한국어에서 과도하게 확정하지 않고 본문 흐름에 맞게 살렸습니다.
