lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서의 반복되는 호격을 살리면서도 한국어에서 자연스럽게 부를 수 있는 표현으로 옮겼습니다. 여기서는 메시아 호칭이 아니라 선지자 에스겔에게 주어진 직접 호칭입니다.
