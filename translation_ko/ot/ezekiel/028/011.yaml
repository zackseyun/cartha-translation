translation:
  language: ko
  text: 야훼의 말씀이 내게 임했습니다. 야훼께서 이렇게 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: יְהוָה(야훼). 전통적으로 ‘여호와’로 번역됩니다.'
