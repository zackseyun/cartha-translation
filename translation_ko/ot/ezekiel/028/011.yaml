lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: came
  chosen_korean: 임하여
  alternatives_korean:
  - 왔습니다
  - 이르렀습니다
  lexicon: HALOT
  rationale: 예언서의 관용구 ‘말씀이 임하다’를 사용해, 원문의 사건 발생과 신적 계시의 도착을 자연스럽게 살렸습니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언적 공식에서 דְבַר יְהוָה는 단순한 정보가 아니라 하나님의 발화된 말씀을 가리키므로 ‘말씀’이 가장 정확합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 기준에 따라 Tetragrammaton은 титula가 아닌 고유명사로서 ‘야훼’로 옮겼습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내게로
  lexicon: HALOT
  rationale: 예언자 에스겔이 계시의 수신자임을 자연스러운 현대 한국어로 드러내는 가장 간결한 표현입니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하여
  - 이르시기를
  lexicon: HALOT
  rationale: 한국어에서는 ‘말하여’보다 뒤의 직접 화법 도입을 마무리하는 서술형 종결이 더 자연스러워, 전체 구문을 한 번 더 ‘말씀하셨습니다’로 풀었습니다.
theological_decisions:
- issue: 예언 공식에서 하나님의 이름을 어떻게 표기할지
  chosen_reading: ‘야훼’로 직역해 하나님의 고유한 언약 이름을 보존했습니다.
  alternative_readings:
  - ‘주님’으로 옮겨 전통적 경어를 따르는 읽기
  rationale: 본문이 יְהוָה를 직접 사용하므로, 호칭 대체보다 고유명 보존이 원문의 신학적 무게를 더 잘 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
