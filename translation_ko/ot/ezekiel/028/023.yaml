base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/023.yaml
  text: And I will send pestilence into her[a], and blood into her streets; the slain will fall in her midst by the sword all around her. Then they will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'bloodshed into her streets.' The Hebrew reads literally 'blood,' likely referring to violent bloodshed in the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그 안에 전염병과 피를 보내고, 그 거리들에 피를 보내며, 그 가운데에서 살륙당한 자들이 칼에 맞아 사방에서 쓰러질 것입니다. 그러면 그들은 내가 야훼임을 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 거리들에 피흘림.’ 히브리어는 문자적으로 ‘피’라고 되어 있으며, 도성 안의 폭력적 유혈을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  english_pob_choice: And I will send
  chosen_korean: 내가 … 보내고
  alternatives_korean:
  - 내가 … 파견하고
  - 내가 … 보내어
  lexicon: HALOT
  rationale: 예언적 선언의 미래적 의미를 살리되, 한국어에서는 가장 자연스러운 ‘보내다’를 사용했습니다.
- source_word: דֶּבֶר
  english_pob_choice: pestilence
  chosen_korean: 전염병
  alternatives_korean:
  - 역병
  - 재앙성 질병
  lexicon: HALOT
  rationale: 심판 맥락에서 집단적 질병 재앙을 뜻하므로, 한국어로는 의미가 분명한 ‘전염병’이 적절합니다.
- source_word: וָדָם
  english_pob_choice: and blood
  chosen_korean: 피
  alternatives_korean:
  - 피흘림
  - 유혈
  lexicon: HALOT
  rationale: 본문이 문자적으로는 ‘피’를 말하지만, 도시의 폭력적 유혈을 가리키는 맥락이므로 본문에는 ‘피’를 두고 그 의미를 그대로 살렸습니다.
- source_word: חָלָל
  english_pob_choice: the slain
  chosen_korean: 살륙당한 자들
  alternatives_korean:
  - 죽임당한 자들
  - 죽은 자들
  lexicon: HALOT
  rationale: חָלָל은 전쟁이나 심판으로 죽임을 당한 자들을 가리키므로, 단순한 사망보다 폭력성을 드러내는 표현을 택했습니다.
theological_decisions:
