  text: And I will send pestilence into her[a], and blood into her streets; the slain will fall in her midst by the sword all around her. Then they will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'bloodshed into her streets.' The Hebrew reads literally 'blood,' likely referring to violent bloodshed in the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그 안에 전염병을 보내고, 그 거리들에는 피가 흐르게 하겠다.[a] 그 가운데에서 죽임당한 자들이 그 도성을 사방에서 치는 칼에 쓰러질 것이다. 그러면 그들은 내가 야훼임을 알게 될 것이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 거리들에 피흘림이 있게 하겠다.’ 히브리어는 문자적으로 ‘피’라고 되어 있으며, 도성 안의 폭력적인 유혈을 가리키는 것으로 보입니다.
    reason: lexical_alternative
