  source_fidelity: 수정이 필요합니다. 초안은 ‘피’를 두 번 보내는 것으로 옮겨 히브리어의 병렬 구조(그 안에 전염병, 그 거리들에 피)를 중복시켰습니다. 또한 ‘사방에서’는 쓰러지는 자들의 위치가 아니라 그 도성을 둘러싼 칼의 공격을 수식하도록 처리하는 편이 원문에 더 충실합니다.
  naturalness: ‘살륙당한 자들’은 현대 표준어에서 다소 부자연스럽고, ‘죽임당한 자들’이 문맥의 폭력적 죽음을 자연스럽게 전달합니다. ‘그 거리들에는 피가 흐르게 하겠다’는 한국어에서 원문의 ‘피를 보내다’라는 심판 이미지를 무리 없이 재현합니다.
  terminology: דֶּבֶר는 ‘전염병’, חָלָל은 ‘죽임당한 자들’, יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 유지합니다. ‘피’는 본문에 보존하고, ‘피흘림’이라는 해석적 대안은 각주로 둡니다.
