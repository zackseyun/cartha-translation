  lexicon: HALOT
  rationale: לֵב의 문자적 ‘심장’ 이미지를 유지할 수도 있으나, 공간적 관용구로서 ‘한가운데’가 원문의 중심/한복판 의미를 가장 자연스럽게 전달합니다.
