  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/שַּׁ֖חַת יֽוֹרִד֑וּ/ךָ וָ/מַ֛תָּה מְמוֹתֵ֥י חָלָ֖ל בְּ/לֵ֥ב יַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/008.yaml
  text: They will bring you down to the pit[c][b][a], and you will die the death of one slain in the heart of the seas.
  footnotes:
  - marker: a
    text: Or "to the grave" or "to destruction"; Hebrew "to the pit."
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally "the deaths of one slain," an idiom for a violent death.
    reason: lexical_alternative
  - marker: c
    text: Or "in the midst of the seas."
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 너를 구덩이로 끌어내릴 것이며, 네가 바다들의 한가운데서 죽임당한 자의 죽음을 죽을 것이다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “무덤으로” 혹은 “멸망으로”; 히브리어는 “구덩이로”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “죽음들 of one slain”으로, 폭력적 죽음을 나타내는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “바다들의 한가운데에서”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשַּׁחַת
  english_pob_choice: to the pit
  chosen_korean: 구덩이로
  alternatives_korean:
  - 무덤으로
  - 멸망으로
  - 지옥으로
  lexicon: HALOT
  rationale: שַׁחַת은 문맥에 따라 구덩이, 무덤, 멸망을 가리킬 수 있으나, 여기서는 하강 동사와 결합해 구체적인 ‘구덩이’ 이미지를 살리는 것이 원문의 감각을 가장 잘 보존합니다.
- source_word: יוֹרִדוּךָ
  english_pob_choice: they will bring you down
  chosen_korean: 끌어내릴 것이며
  alternatives_korean:
  - 내려보낼 것이며
  - 떨어뜨릴 것이며
  - 끌어내려 갈 것이며
  lexicon: HALOT
  rationale: 히필형의 사역 의미를 반영해 ‘내리게 하다’의 힘을 살리되, 한국어에서 자연스러운 ‘끌어내리다’로 옮겼습니다.
- source_word: מְמוֹתֵי חָלָל
  english_pob_choice: the death of one slain
  chosen_korean: 죽임당한 자의 죽음
  alternatives_korean:
  - 살해된 자의 죽음
  - 죽임당한 자들의 죽음
  - 살해당하는 죽음
  lexicon: HALOT
  rationale: 히브리어의 복수형 관용구 ‘죽음들’은 한국어로 직역하면 부자연스러우므로, 폭력적 죽음을 드러내는 관용적 표현으로 옮겼습니다.
- source_word: בְּלֵב יַמִּים
  english_pob_choice: in the heart of the seas
  chosen_korean: 바다들의 한가운데서
  alternatives_korean:
  - 바다들의 중심에서
  - 바다들의 한복판에서
  - 바다의 한가운데서
  lexicon: HALOT
  rationale: לֵב의 문자적 ‘심장’ 이미지를 유지할 수도 있으나, 공간적 관용구로서 ‘한가운데’가 원문의 중심/한복판 의미를 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: שַׁחַת을 종말론적 지옥 개념으로 고정할지 여부
  chosen_reading: 구덩이
  alternative_readings:
  - 무덤
  - 지옥
  - 멸망
  rationale: 본문은 심판과 죽음을 말하지만, 어휘 자체는 특정한 사후 세계 교리를 요구하지 않으므로 ‘구덩이’로 남겨 원문의 이미지와 해석의 여지를 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
