  text: They will bring you down to the pit[c][b][a], and you will die the death of one slain in the heart of the seas.
  footnotes:
  - marker: a
    text: Or "to the grave" or "to destruction"; Hebrew "to the pit."
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally "the deaths of one slain," an idiom for a violent death.
    reason: lexical_alternative
  - marker: c
    text: Or "in the midst of the seas."
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 너를 구덩이로[a] 내려 보낼 것이며, 너는 바다들의 한가운데에서[c] 죽임당한 자의 죽음으로[b] 죽을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “무덤으로” 또는 “멸망으로”; 히브리어는 “구덩이로”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “죽임당한 자의 죽음들”로, 폭력적인 죽음을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “바다들의 한복판에서”.
    reason: lexical_alternative
