  naturalness: ‘당신의 속’은 이 문맥에서 다소 부자연스럽고, ‘당신 안에는 폭력이 가득했고’가 현대 표준 한국어에서 더 자연스럽습니다. 또한 ‘감싸는 그룹아, 내가 당신을 그렇게 하였습니다’는 한국어 문장으로도 부자연스럽고 의미가 불명확합니다. ‘보호하는 그룹아’를 멸망 동작과 직접 연결하면 자연스럽습니다.
  terminology: ‘하나님의 산’, ‘불의 돌들’, ‘그룹’은 유지할 수 있습니다. הַסֹּכֵךְ은 문자적으로 ‘덮는/감싸는’이지만 문맥상 보호 기능을 나타내므로 본문에서는 ‘보호하는’으로, 각주에서 문자적 대안을 제시합니다. רְכֻלָּה의 각주에서 ‘밀거래’라고 특정하는 것은 원어가 요구하지 않는 불법성의 함의를 더하므로 제거합니다.
