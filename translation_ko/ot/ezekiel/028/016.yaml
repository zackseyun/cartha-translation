id: EZK.28.16
reference: Ezekiel 28:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/רֹ֣ב רְכֻלָּתְ/ךָ֗ מָל֧וּ תוֹכְ/ךָ֛ חָמָ֖ס וַֽ/תֶּחֱטָ֑א וָ/אֶחַלֶּלְ/ךָ֩ מֵ/הַ֨ר אֱלֹהִ֤ים וָֽ/אַבֶּדְ/ךָ֙ כְּר֣וּב הַ/סֹּכֵ֔ךְ מִ/תּ֖וֹךְ אַבְנֵי אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/016.yaml
  text: By the abundance of your trade[a], your midst was filled with violence, and you sinned; so I cast you as profane from the mountain of God, and I destroyed you, O guardian cherub[c][b], from the midst of the stones of fire.
  footnotes:
  - marker: a
    text: Or 'your trading' or 'your commerce'; the Hebrew term can also carry the sense of 'trafficking.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I cast you out as defiled.' The Hebrew verb means 'to profane' or 'treat as unholy,' likely with the sense of expulsion from a sacred place.
    reason: lexical_alternative
  - marker: c
    text: Or 'covering cherub.' The Hebrew participle literally means 'covering/overshadowing,' here rendered 'guardian' to express its protective sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 무역이 많아지자 당신의 속이 폭력으로 가득 찼고, 당신은 죄를 지었습니다. 그래서 나는 당신을 하나님의 산에서 속된 자로 내쳤고, 불의 돌들 가운데서 당신을 멸망시켰습니다. 감싸는 그룹아, 내가 당신을 그렇게 하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 거래’나 ‘당신의 상업’으로도 옮길 수 있습니다. 히브리어는 ‘밀거래/매매’의 뉘앙스까지 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 당신을 속된 자로 내쳤다’로도 옮길 수 있습니다. 동사는 ‘속되게 하다’ 또는 ‘거룩하지 않게 하다’의 뜻을 가지며, 성소에서의 추방 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘덮는 그룹’으로도 옮길 수 있습니다. 분사형은 문자적으로 ‘덮는/감싸는’의 뜻이지만, 여기서는 보호하는 기능을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב רְכֻלָּתְךָ
  english_pob_choice: By the abundance of your trade
  chosen_korean: 당신의 무역이 많아지자
  alternatives_korean:
  - 당신의 거래가 많아지자
  - 당신의 상업이 많아지자
  - 당신의 무역의 많음으로
  lexicon: HALOT
  rationale: רְכֻלָּה는 무역, 거래, 상업의 뜻을 가지며 문맥상 원인/배경을 나타내므로, 한국어에서는 자연스러운 인과 흐름인 ‘-자’로 옮겼습니다.
- source_word: מָלוּ תוֹכְךָ חָמָס
  english_pob_choice: your midst was filled with violence
  chosen_korean: 당신의 속이 폭력으로 가득 찼고
  alternatives_korean:
  - 당신의 가운데가 폭력으로 가득 찼고
  - 당신의 내부가 폭력으로 가득 찼고
  - 당신의 한가운데가 폭력으로 가득 찼고
  lexicon: HALOT
  rationale: תוֹךְ을 단순한 물리적 ‘안쪽’보다 공동체적 중심을 가리키는 표현으로 보고, 영어 POB의 ‘your midst’에 맞춰 ‘속’을 택했습니다.
- source_word: וָאֶחַלֶּלְךָ
  english_pob_choice: so I cast you as profane
  chosen_korean: 그래서 나는 당신을 하나님의 산에서 속된 자로 내쳤고
  alternatives_korean:
  - 그래서 나는 당신을 속되게 하였고
  - 그래서 나는 당신을 더럽혀 내쫓았고
  - 그래서 나는 당신을 부정하게 하였고
  lexicon: HALOT
  rationale: חלל의 핵심은 ‘거룩하지 않게 하다/속되게 하다’이므로, 단순한 오염보다 성소적 배제의 뉘앙스를 살려 ‘속된 자로 내치다’로 옮겼습니다.
- source_word: כְּרוּב הַסֹּכֵךְ
  english_pob_choice: O guardian cherub
  chosen_korean: 감싸는 그룹아
  alternatives_korean:
  - 보호하는 그룹아
  - 덮는 그룹아
  - 호위하는 그룹아
  lexicon: HALOT
  rationale: הַסֹּכֵךְ은 문자적으로 ‘덮는/감싸는’의 뜻이므로, EN POB의 ‘guardian’보다 원형에 더 가까운 한국어로 ‘감싸는’에 보존했습니다. 호격 형태를 반영해 ‘-아’를 붙였습니다.
- source_word: מִתּוֹךְ אַבְנֵי אֵשׁ
  english_pob_choice: from the midst of the stones of fire
  chosen_korean: 불의 돌들 가운데서
  alternatives_korean:
  - 불의 돌들 한가운데서
  - 불의 돌들 사이에서
  - 불의 돌들 가운데
  lexicon: HALOT
  rationale: מִתּוֹךְ의 공간적 관계를 살리면서도 현대 한국어에서 매끄럽게 읽히도록 ‘가운데서’로 옮겼습니다.
theological_decisions:
- issue: חלל과 אבד의 연속 동작을 어떻게 처리할지
  chosen_reading: ‘속된 자로 내쳤고 … 멸망시켰습니다’로 옮겨, 성소적 추방과 파괴를 함께 드러냈습니다.
  alternative_readings:
  - ‘속되게 하였고 … 없애버렸습니다’
  - ‘더럽혀 쫓아냈고 … 망하게 했습니다’
  rationale: 본문은 단순한 도덕적 비난이 아니라 하나님 임재의 영역에서의 추방과 심판을 함께 말하므로, 두 동사를 분리해 그 긴장을 살렸습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: 화자가 누구이며 ‘그룹’ 이미지가 무엇을 가리키는지
  chosen_reading: 인물의 정체를 해석으로 확정하지 않고, 본문의 직접 호칭과 그룹 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 완전히 왕 비유로 평탄화하는 번역
  - 사탄 혹은 원시적 천사 타락을 명시하는 번역
  rationale: 본문 자체가 왕적 이미지와 그룹 이미지를 함께 유지하므로, 번역은 그 긴장을 보존해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
