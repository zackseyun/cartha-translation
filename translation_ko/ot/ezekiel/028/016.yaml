revisions:
- from: 당신의 무역이 많아지자 당신의 속이 폭력으로 가득 찼고, 당신은 죄를 지었습니다. 그래서 나는 당신을 하나님의 산에서 속된 자로 내쳤고, 불의 돌들 가운데서 당신을 멸망시켰습니다. 감싸는 그룹아, 내가 당신을 그렇게 하였습니다.[a][b][c]
  to: 당신의 무역이 풍성했기 때문에 당신 안에는 폭력이 가득했고, 당신은 죄를 지었습니다. 그래서 나는 당신을 하나님의 산에서 속된 자로 내쳤고,[b] 보호하는 그룹아,[c] 당신을 불의 돌들 가운데서 멸망시켰습니다.[a]
  rationale: 원문의 직접 호칭과 신비로운 그룹 이미지를 해석적으로 특정하지 않고 보존했습니다. 호격을 ‘멸망시켰습니다’ 절에 연결하고, 원문에 없는 마지막 문장을 삭제했습니다. ‘무역이 풍성했기 때문에’는 בְּרֹב의 인과적 용법을 자연스럽게 반영하며, ‘당신 안에는’은 תּוֹךְ의 비유적 의미를 무리 없이 살립니다. 각주 표지는 각각 무역(a), 속되게 함/추방(b), 보호·덮음(c)의 해당 표현에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:41:23Z'
