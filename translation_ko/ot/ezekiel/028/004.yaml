  - 네 분별로
  - 네 통찰로
  lexicon: HALOT
  rationale: תבונה는 지혜와 짝을 이루는 ‘이해, 분별, 통찰’의 의미이므로, 지혜와 구별되는 인지적 능력을 살려 ‘총명’으로 옮겼습니다.
- source_word: עָשִׂיתָ לְּךָ חָיִל
  english_pob_choice: you made wealth for yourself
  chosen_korean: 너는 자기 자신을 위해 재물을 만들었고
  alternatives_korean:
  - 너는 자기 자신을 위해 부를 모았고
  - 너는 자기 자신을 위해 힘을 얻었고
  - 너는 자기 자신을 위해 재력을 만들었고
  lexicon: HALOT
  rationale: חיל은 문맥에 따라 힘, 재력, 재물, 자원 등을 뜻할 수 있으나, 다음 절의 금과 은 및 곳간이 물질적 축적을 가리키므로 ‘재물’이 가장 적절합니다. ‘만들었다’는 히브리어 동사 קשר를 따라 형식을 살린 표현입니다.
- source_word: בְּאוֹצְרוֹתֶיךָ
  english_pob_choice: into your treasuries
  chosen_korean: 네 곳간들에
  alternatives_korean:
  - 네 보물창고들에
  - 네 창고들에
  - 네 금고들에
  lexicon: HALOT
  rationale: אוצר는 보관된 재화의 저장소를 가리키므로, 금과 은이 들어 있는 장소라는 문맥을 살려 ‘곳간’으로 옮겼습니다.
theological_decisions:
- issue: חָיִל의 의미 범위
  chosen_reading: 본문에서는 ‘재물’로 번역해 경제적 축적을 드러내되, 용어 자체가 힘/재력/자원까지 포괄할 수 있음을 주석으로 남깁니다.
  alternative_readings:
  - 힘
  - 권세
  - 재력
  - 자원
  rationale: 문맥이 금·은과 곳간을 언급하므로 주된 의미는 물질적 부입니다. 다만 히브리어의 넓은 의미 영역을 지우지 않기 위해 대안 의미를 보존합니다.
  doctrine_reference: 문맥 우선의 어휘 선택 원칙
