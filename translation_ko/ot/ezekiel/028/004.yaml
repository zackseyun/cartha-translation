translation:
  language: ko
  text: 당신의 지혜와 총명으로 당신은 자신을 위해 재물을 얻었고, 금과 은을 당신의 보물창고에 쌓아 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신을 위해 힘 또는 재력을 얻었다’입니다. 히브리어 חָיִל은 부, 힘, 재력, 자원 등을 뜻할 수 있으나, 여기서는 금과 은과 보물창고의 언급이 ‘재물’이라는 뜻을 더 강하게 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחָכְמָתְךָ
  english_pob_choice: By your wisdom
  chosen_korean: 네 지혜로
  alternatives_korean:
  - 네 지혜를 따라
  - 네 지혜로써
  lexicon: HALOT
  rationale: ב는 수단/방법을 나타내므로 한국어에서는 조사 ‘-로’로 자연스럽게 옮겼습니다.
- source_word: וּבִתְבוּנָתְךָ
  english_pob_choice: and by your understanding
  chosen_korean: 네 총명으로
  alternatives_korean:
