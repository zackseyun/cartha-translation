    rationale: מְלֶאכֶת는 ‘세공/제작’이며, 뒤의 두 명사는 그 세공과 연결됩니다. 초안의 ‘당신의 장식품의 공예와 당신의 받침대’는 소유 관계와 병렬 구조를 재구성하여 원문 충실성을 약화합니다.
  - severity: medium
    issue: 보석 식별 각주 표지가 에덴 구절에 붙어 있습니다.
    rationale: 각주의 내용은 에덴이 아니라 보석 명칭의 불확실성에 관한 것이므로 ‘보석’에 표지를 붙이는 편이 독자에게 정확합니다.
