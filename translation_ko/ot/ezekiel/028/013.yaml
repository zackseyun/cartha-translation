  text: בְּ/עֵ֨דֶן גַּן אֱלֹהִ֜ים הָיִ֗יתָ כָּל אֶ֨בֶן יְקָרָ֤ה מְסֻכָתֶ֨/ךָ֙ אֹ֣דֶם פִּטְדָ֞ה וְ/יָהֲלֹ֗ם תַּרְשִׁ֥ישׁ שֹׁ֨הַם֙ וְ/יָ֣שְׁפֵ֔ה סַפִּ֣יר נֹ֔פֶךְ וּ/בָרְקַ֖ת וְ/זָהָ֑ב מְלֶ֨אכֶת תֻּפֶּ֤י/ךָ וּ/נְקָבֶ֨י/ךָ֙ בָּ֔/ךְ בְּ/י֥וֹם הִבָּרַאֲ/ךָ֖ כּוֹנָֽנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/013.yaml
  text: 'You were in Eden[a], the garden of God; every precious stone was your covering: ruby, topaz, and diamond; beryl, onyx, and jasper; sapphire, turquoise, and emerald; and gold. The workmanship of your tambourines and your sockets was in you; on the day you were created[b], they were prepared.'
  footnotes:
  - marker: a
    text: The precise identification of several stones in this verse is uncertain; ancient gemstone names do not always correspond exactly to modern terms. Possible alternatives include carnelian for 'ruby,' chrysolite for 'topaz' or 'beryl,' lapis lazuli for 'sapphire,' and carbuncle for 'turquoise' or 'emerald.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'The workmanship of your settings and your mountings was in you,' taking the difficult Hebrew terms as referring to jewelry craftsmanship rather than musical instruments.
    reason: alternative_reading
translation:
  language: ko
  text: 당신은 하나님의 동산인 에덴에 있었습니다. 온갖 귀한 보석[a]이 당신을 덮고 있었습니다. 루비, 토파즈, 다이아몬드, 녹주석, 호마노, 벽옥, 사파이어, 터키석, 에메랄드와 금이었습니다. 당신의 소고와 끼움 구멍의 세공이 당신 안에 갖추어져 있었으며, 당신이 지음받은 날에 그것들이 마련되었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 여러 보석 이름은 고대 명칭을 현대 광물명과 정확히 일대일로 대응시키기 어렵습니다. 예를 들어 루비는 홍옥수, 토파즈 또는 녹주석은 황록색 보석, 사파이어는 청금석, 터키석 또는 에메랄드는 석류석이나 붉은 보석으로 이해되기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘당신의 장식 받침대와 끼움쇠의 세공이 당신 안에 갖추어져 있었다.’ 히브리어의 난해한 용어들을 악기가 아니라 보석 장신구의 세공에 관한 말로 이해하는 독법입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעֵדֶן גַּן אֱלֹהִים
  english_pob_choice: You were in Eden, the garden of God
  chosen_korean: 당신은 에덴, 하나님의 동산에 있었습니다
  alternatives_korean:
  - 당신은 에덴에 있었습니다, 하나님의 동산에
  - 당신은 에덴에 있었고, 하나님의 동산에 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 동격 구조를 살려 ‘에덴, 하나님의 동산’으로 옮기고, 현대 한국어에서 자연스럽게 보이도록 위치 부사구를 앞세웠습니다.
- source_word: כָּל אֶבֶן יְקָרָה
  english_pob_choice: every precious stone
  chosen_korean: 온갖 귀한 돌
  alternatives_korean:
  - 모든 보석
  - 각각의 귀한 돌
  lexicon: HALOT
  rationale: 문맥상 보석 목록을 이끄는 표현이므로 ‘보석’도 가능하지만, 원문의 일반 명사성을 살려 ‘귀한 돌’로 두었습니다.
- source_word: מְסֻכָתֶךָ
  english_pob_choice: was your covering
  chosen_korean: 당신의 덮개
  alternatives_korean:
  - 당신을 덮는 것이었습니다
  - 당신의 가리개
  lexicon: HALOT
  rationale: ‘감싸는 것/덮는 것’의 의미를 보존하면서, 보석이 몸이나 장식을 덮는 이미지를 자연스럽게 드러내기 위해 ‘덮개’로 옮겼습니다.
- source_word: תֻּפֶּי/ךָ וּנְקָבֶי/ךָ
  english_pob_choice: your tambourines and your pipes
  chosen_korean: 당신의 장식품의 공예와 당신의 받침대
  alternatives_korean:
  - 당신의 소고와 당신의 관통구멍
  - 당신의 타악기와 당신의 파이프
  lexicon: HALOT
  rationale: 이 구절은 히브리어가 난해하며 문맥상 악기보다 장신구나 세공을 가리킬 가능성이 커서, 영어 POB의 대안 독법을 반영해 공예/받침대의 의미로 옮겼습니다.
- source_word: בְּיוֹם הִבָּרַאֲ/ךָ
  english_pob_choice: on the day you were created
  chosen_korean: 당신이 지음받던 날
  alternatives_korean:
  - 당신이 창조된 날
  - 당신이 만들어진 날
  lexicon: HALOT
  rationale: 피동 생성의 의미를 유지하되, 한국어에서 보다 유려하게 읽히도록 ‘지음받다’로 옮겼습니다.
