id: EZK.28.7
reference: Ezekiel 28:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא עָלֶ֨י/ךָ֙ זָרִ֔ים עָרִיצֵ֖י גּוֹיִ֑ם וְ/הֵרִ֤יקוּ חַרְבוֹתָ/ם֙ עַל יְפִ֣י חָכְמָתֶ֔/ךָ וְ/חִלְּל֖וּ יִפְעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/007.yaml
  text: Therefore[a], behold, I am bringing strangers against you, the most ruthless of the nations; they will draw their swords against the beauty of your wisdom[c][b], and they will defile your splendor.
  footnotes:
  - marker: a
    text: Or 'foreigners' for 'strangers.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they will unsheathe their swords.' Literally, 'they will empty out their swords.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they will profane your radiance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 보십시오, 내가 이방인들[a]—곧 나라들 가운데서 가장 무자비한 자들—을 너에게로 데려오겠다. 그들은 너의 지혜의 아름다움을 향해 자기들의 칼을 빼어[b], 너의 찬란함을 더럽힐 것이다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외국인들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기들의 칼을 뽑아 들고’. 직역하면 ‘자기들의 칼을 비워 내고’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘너의 찬란함을 모독할 것이다’. ‘찬란함’은 ‘광채’ 또는 ‘빛남’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 그런즉
  lexicon: HALOT
  rationale: 앞선 심판 선언에 대한 귀결을 나타내는 인과 접속사로, 현대 한국어에서 가장 자연스럽고 문맥에 맞습니다.
- source_word: הִנְנִי
  english_pob_choice: behold, I am
  chosen_korean: 보십시오, 내가
  alternatives_korean:
  - 보라, 내가
  - 내가 지금
  lexicon: HALOT
  rationale: 예언적 선언의 긴박함과 엄숙함을 살리되, 과도한 고어감을 피하기 위해 ‘보십시오’로 옮겼습니다.
- source_word: זָרִים
  english_pob_choice: strangers
  chosen_korean: 이방인들
  alternatives_korean:
  - 낯선 자들
  - 외인들
  lexicon: HALOT
  rationale: 원어는 혈연·언약 바깥의 타자를 가리키며, 심판 맥락에서는 ‘이방인들’이 한국어 독자에게도 가장 직접적입니다.
- source_word: עָרִיצֵי גּוֹיִם
  english_pob_choice: the most ruthless of the nations
  chosen_korean: 나라들 가운데서 가장 잔인한 자들
  alternatives_korean:
  - 열국 가운데 가장 무자비한 자들
  - 나라들 중의 폭군들
  lexicon: HALOT
  rationale: עָרִיץ의 폭력적·가혹한 뉘앙스를 살리면서도, ההקשר상 실제 전쟁 수행자를 자연스럽게 드러내기 위해 이렇게 옮겼습니다.
- source_word: וְהֵרִיקוּ חַרְבוֹתָם
  english_pob_choice: they will draw their swords
  chosen_korean: 그들은 자기들의 칼을 빼어 내고
  alternatives_korean:
  - 그들은 자기들의 칼을 뽑고
  - 그들은 자기들의 칼을 빼어 들고
  lexicon: HALOT
  rationale: 동사의 직역적 의미는 ‘비우다/쏟아붓다’이지만, 칼과 결합할 때의 관용적 의미를 따라 ‘빼어 내고’로 번역해 공격 행위를 분명히 했습니다.
- source_word: וְחִלְּלוּ
  english_pob_choice: they will defile
  chosen_korean: 더럽힐 것입니다
  alternatives_korean:
  - 모독할 것입니다
  - 욕되게 할 것입니다
  lexicon: HALOT
  rationale: 대상이 제의적 성물이라기보다 왕의 영광/위엄이므로, ‘모독’보다 일반적이면서도 수치를 드러내는 ‘더럽히다’가 적절합니다.
theological_decisions:
- issue: 예언적 심판의 직접적 역사성 유지
  chosen_reading: 이 구절을 두로 왕/도시에 대한 역사적-예언적 심판으로 번역하고, 별도의 우주적 타락 해석은 본문에 넣지 않았습니다.
  alternative_readings:
  - 후대의 유형론적 독해를 본문 표현에 반영하는 읽기
  - 사탄적 타락 서사와 연결해 암시적으로 옮기는 읽기
  rationale: 본문 자체는 침략자, 칼, 지혜, 찬란함의 훼손을 말하는 심판 신탁이므로, 번역은 즉시적 문맥을 보존해야 합니다.
  doctrine_reference: 원문 우선 원칙; 해석 논쟁은 주석 영역에 남기고 본문에는 투사하지 않음.
