  to: 그러므로 보십시오, 내가 이방인들[a]—곧 나라들 가운데서 가장 무자비한 자들—을 너에게로 데려오겠다. 그들은 너의 지혜의 아름다움을 향해 자기들의 칼을 빼어[b], 너의 찬란함을 더럽힐 것이다.[c]
