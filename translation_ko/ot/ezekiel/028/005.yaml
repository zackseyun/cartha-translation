  source_fidelity: 'The draft conveys the principal sense: commercial wisdom produces wealth, and wealth occasions pride. However, ‘장사’ is narrower and more colloquial than רְכֻלָּה, which denotes commercial trading/commerce in this context. The footnote anchors are also all placed at the verse end rather than at the words or clause they explain.'
  naturalness: The sentence is generally clear, but repeated ‘당신의’ is heavy, and ‘당신’ is not the most natural form for a prophetic direct address in standard Korean Bible-style formal prose. ‘네’ with 합쇼체 predicates is idiomatic in this genre. ‘상업 활동’ is more precise and suitably formal than ‘장사.’
  terminology: ‘재물’ appropriately renders חַיִל in this mercantile context, while the footnote properly preserves the possible senses of riches, resources, and strength/power. ‘교만해졌습니다’ accurately communicates the Hebrew pride idiom. ‘거래/상업 활동’ should replace ‘장사’ for רְכֻלָּה.
  issues:
  - severity: medium
    issue: ‘장사’ is an overly narrow and somewhat colloquial rendering of רְכֻלָּה.
    rationale: The Hebrew refers broadly to commercial traffic or commerce, not merely retail selling or a personal business. ‘상업 활동’ retains the activity sense and fits the formal register.
  - severity: medium
    issue: The pronoun ‘당신’ is stylistically unsuitable here.
    rationale: In modern Korean it can be confrontational or marital, whereas prophetic direct address normally uses ‘네’ even with formal-polite sentence endings.
  - severity: low
    issue: Footnote markers are not anchored to their relevant expressions.
    rationale: The trade, pride-idiom, and wealth notes should follow the respective Korean words or clauses. Since חֵילֶךָ occurs twice, its lexical note should be anchored at both occurrences.
