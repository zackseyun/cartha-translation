  text: בְּ/רֹ֧ב חָכְמָתְ/ךָ֛ בִּ/רְכֻלָּתְ/ךָ֖ הִרְבִּ֣יתָ חֵילֶ֑/ךָ וַ/יִּגְבַּ֥הּ לְבָבְ/ךָ֖ בְּ/חֵילֶֽ/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/005.yaml
  text: By your great wisdom in your trade you increased your wealth[c][b][a], and your heart became proud because of your wealth.
  footnotes:
  - marker: a
    text: Or 'in your trading' or 'by your commerce'; the Hebrew term refers to commercial activity.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your heart was lifted up,' an idiom for becoming proud.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew word rendered 'wealth' can also mean 'riches,' 'resources,' or in some contexts 'strength/power.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 큰 지혜와 네 상업 활동으로 네 재물을 늘렸고,[a][c] 네 재물 때문에 네 마음이 교만해졌습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 거래로’나 ‘네 무역으로’로도 옮길 수 있습니다. 히브리어는 상업적 거래 활동을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘네 마음이 높아졌다’는 뜻이며, 교만해졌다는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 히브리어는 ‘재물’ 외에도 ‘부’, ‘자산’, 또는 어떤 문맥에서는 ‘힘’이나 ‘권세’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב חָכְמָתְךָ
  english_pob_choice: By your great wisdom
  chosen_korean: 당신의 큰 지혜로
  alternatives_korean:
  - 당신의 지혜의 풍성함으로
  - 당신의 뛰어난 지혜로
  lexicon: HALOT
  rationale: בְּרֹב은 수단·상황을 나타내며, חָכְמָה는 여기서 지적 능력과 실무적 지혜를 함께 가리킬 수 있으므로 ‘큰 지혜로’가 핵심 의미를 간명하게 살립니다.
- source_word: בִּרְכֻלָּתְךָ
  english_pob_choice: in your trade
  chosen_korean: 당신의 장사로
  alternatives_korean:
  - 당신의 거래로
  - 당신의 상업 활동으로
  - 당신의 무역으로
  lexicon: HALOT
  rationale: רְכֻלָּה는 단순한 물건이 아니라 상업적 거래 활동을 가리키므로, 현대 한국어에서 자연스럽고 활동성을 드러내는 ‘장사로’가 문맥에 잘 맞습니다.
- source_word: חֵילֶךָ
  english_pob_choice: wealth
  chosen_korean: 재물
  alternatives_korean:
  - 부
  - 부유함
  - 자산
  - 권세
  lexicon: HALOT
  rationale: חַיִל은 문맥에 따라 재물, 부, 능력, 힘까지 넓게 뜻하지만, 상업적 성공을 말하는 이 구절에서는 ‘재물’이 가장 직접적이며 뒤의 교만의 원인도 분명하게 드러냅니다.
- source_word: וַיִּגְבַּהּ לְבָבְךָ
  english_pob_choice: your heart became proud
  chosen_korean: 당신의 마음은 … 교만해졌습니다
  alternatives_korean:
  - 당신의 마음이 높아졌습니다
  - 당신의 마음이 우쭐해졌습니다
  - 당신의 마음이 거만해졌습니다
  lexicon: HALOT
  rationale: ‘마음이 높아지다’는 히브리어 관용구를 한국어에서 이해하기 쉬운 결과 상태로 풀되, 자만의 의미를 분명히 드러내기 위해 ‘교만해졌습니다’로 옮겼습니다.
theological_decisions:
- issue: 재물과 교만의 인과관계
  chosen_reading: 당신의 재물 때문에
  alternative_readings:
  - 당신의 재물로 인해
  - 당신의 부 때문에
  rationale: בְּ는 여기서 원인·계기를 나타내므로, 교만의 원인이 재물임을 분명히 드러내는 표현이 문맥과 심판 예언의 날카로움을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘마음이 높아졌다’는 관용구의 처리
  chosen_reading: 교만해졌습니다
  alternative_readings:
  - 마음이 높아졌습니다
  - 마음이 들떴습니다
  rationale: 직역을 주석 없이 유지하면 현대 독자에게 의미가 흐려질 수 있으므로, 관용적 의미를 본문에 반영하고 필요시 원문 이미지를 각주로 보완하는 방식이 적절합니다.
  doctrine_reference: Translation philosophy §6
