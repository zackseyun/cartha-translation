revisions:
- from: 당신의 큰 지혜와 당신의 장사로 당신은 재물을 불렸고, 당신의 마음은 당신의 재물 때문에 교만해졌습니다.[a][b][c]
  to: 네 큰 지혜와 네 상업 활동으로 네 재물을 늘렸고,[a][c] 네 재물 때문에 네 마음이 교만해졌습니다.[b][c]
  rationale: The revision preserves the Hebrew’s commercial context and causal progression while using natural formal Korean for a prophetic address. It replaces colloquial, narrower ‘장사’ with ‘상업 활동,’ replaces potentially misleading ‘당신’ with genre-appropriate ‘네,’ and relocates all footnote anchors to the expressions they document without resolving the lexical breadth of חַיִל beyond what the context supports.
