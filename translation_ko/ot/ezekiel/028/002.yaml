id: EZK.28.2
reference: Ezekiel 28:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֶּן אָדָ֡ם אֱמֹר֩ לִ/נְגִ֨יד צֹ֜ר כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה יַ֣עַן גָּבַ֤הּ לִבְּ/ךָ֙ וַ/תֹּ֨אמֶר֙ אֵ֣ל אָ֔נִי מוֹשַׁ֧ב אֱלֹהִ֛ים יָשַׁ֖בְתִּי בְּ/לֵ֣ב יַמִּ֑ים וְ/אַתָּ֤ה אָדָם֙ וְֽ/לֹא אֵ֔ל וַ/תִּתֵּ֥ן לִבְּ/ךָ֖ כְּ/לֵ֥ב אֱלֹהִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/002.yaml
  text: 'Son of man[a], say to the prince of Tyre, ‘Thus says the Lord GOD: Because your heart is proud, and you say, “I am a god; I sit in the seat of gods in the heart of the seas,” yet you are a man and not a god[b], though you set your heart like the heart of gods.”'
  footnotes:
  - marker: a
    text: Or, “I am God; I sit in the seat of God in the heart of the seas.” Hebrew אֵל / אֱלֹהִים here can be read in a singular sense.
    reason: alternative_reading
  - marker: b
    text: Or, “you set your heart like the heart of God.”
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 두로의 지도자에게 이렇게 말하십시오. “주 하나님께서 이렇게 말씀하십니다. ‘네 마음이 교만해져서 네가 말하기를, “나는 신이다. 나는 바다 한가운데에 있는 신들의 자리[a]에 앉아 있다” 하였기 때문이다. 그러나 너는 사람이요 신이 아니면서도 네 마음을 신들의 마음[b]처럼 여겼다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 하나님이다. 나는 바다 한가운데에 있는 하나님의 자리에 앉아 있다.” 여기서 히브리어 אֵל / אֱלֹהִים은 단수로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “네 마음을 하나님의 마음처럼 여겼다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔의 대표적 예언자 호칭으로서 관용적·상징적 힘을 살리기 위해 직역보다 관용 번역인 '인자'를 유지했습니다.
- source_word: לִנְגִיד צֹר
  english_pob_choice: to the prince of Tyre
  chosen_korean: 두로의 지도자에게
  alternatives_korean:
  - 두로의 왕에게
  - 두로의 통치자에게
  lexicon: HALOT
  rationale: נָגִיד는 문맥상 통치자/지도자를 가리키지만, 여기서는 왕호를 단정하지 않으면서도 권력자를 자연스럽게 드러내는 '지도자'가 적절합니다.
- source_word: יְהֹוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와
  lexicon: 문맥상 합성 칭호
  rationale: 합성 칭호 אֲדֹנָי יְהוִה는 한국어에서 전통적으로 '주 하나님'으로 자연스럽게 옮길 수 있으며, 본문 호칭의 엄중함을 유지합니다.
- source_word: אֵל אָנִי
  english_pob_choice: I am a god
  chosen_korean: 나는 신이다
  alternatives_korean:
  - 나는 하나님이다
  - 나는 신적인 존재다
  lexicon: HALOT
  rationale: 여기서 אֵל은 야훼가 아니라 자칭 신격을 뜻하므로, 고유명사화하지 않은 '신'이 원문의 자기신격화 뉘앙스를 잘 드러냅니다.
- source_word: מוֹשַׁב אֱלֹהִים
  english_pob_choice: the seat of gods
  chosen_korean: 신들의 자리에
  alternatives_korean:
  - 하나님의 자리에
  - 신의 자리에
  - 신들의 거처에
  lexicon: HALOT
  rationale: אֱלֹהִים의 복수적 읽기를 살려 '신들의 자리'로 옮겨, POB가 보존한 다의성과 교만한 왕의 신격화 이미지를 유지했습니다.
- source_word: בְּלֵב יַמִּים
  english_pob_choice: in the heart of the seas
  chosen_korean: 바다 한가운데에
  alternatives_korean:
  - 바다의 중심에
  - 바다 한복판에
  lexicon: HALOT
  rationale: '''heart''의 중심/한가운데 의미를 현대 한국어의 자연스러운 공간 표현으로 풀어, 원문의 생생한 은유를 전달했습니다.'
- source_word: וְאַתָּה אָדָם וְלֹא אֵל
  english_pob_choice: yet you are a man and not a god
  chosen_korean: 너는 사람이요 신이 아니며
  alternatives_korean:
  - 너는 사람이고 신이 아니며
  - 너는 인간이요 신이 아닙니다
  lexicon: HALOT
  rationale: אָדָם과 אֵל의 대조를 간결하게 살려, 인간성과 신격의 대비를 분명하게 드러냈습니다.
- source_word: וַתִּתֵּן לִבְּךָ כְּלֵב אֱלֹהִים
  english_pob_choice: though you set your heart like the heart of gods
  chosen_korean: 네가 네 마음을 신들의 마음처럼 두었기 때문입니다
  alternatives_korean:
  - 네가 네 마음을 신들의 마음과 같게 두었기 때문입니다
  - 네가 네 마음을 하나님의 마음처럼 두었기 때문입니다
  lexicon: HALOT
  rationale: 직역적인 'set your heart'를 한국어 관용에 맞게 '마음을 두다'로 옮기되, '신들의 마음'을 유지하여 앞부분과의 연속성을 보존했습니다.
theological_decisions:
- issue: אֵל / אֱלֹהִים을 단수의 참 하나님으로 볼지, 일반적/복수적 신격으로 볼지
  chosen_reading: 자기 과시의 문맥에 맞춰 '신'과 '신들의'로 번역하여, 두로 통치자의 신격화 주장으로 읽었습니다.
  alternative_readings:
  - 나는 하나님이다
  - 하나님의 자리
  - 하나님의 마음처럼
  rationale: 본문은 이방 통치자의 교만한 자기신격화에 대한 심판 선언이므로, 야훼와 동일시하는 번역보다 일반적 신격 언어를 유지하는 편이 원문의 긴장을 살립니다.
  doctrine_reference: 본문의 신격 주장과 야훼의 유일성을 구분하여, 문맥이 허용하는 다의성을 보존합니다.
