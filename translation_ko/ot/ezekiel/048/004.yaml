  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַ֣ל גְּב֣וּל נַפְתָּלִ֗י מִ/פְּאַ֥ת קָדִ֛מָ/ה עַד פְּאַת יָ֖מָּ/ה מְנַשֶּׁ֥ה אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/004.yaml
  text: And along the border of Naphtali[a], from the east side to the west side, Manasseh, one portion.
  footnotes:
  - marker: a
    text: Hebrew literally, 'Manasseh one.' The word 'portion' is supplied in English because the chapter repeatedly uses this elliptical allotment formula.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 납달리의 경계 곁에는, 동쪽 편에서 서쪽 편까지, 므낫세, 한 몫이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘므낫세, 하나’입니다. 이 장 전체가 반복하는 몫 배정 공식에 따라, 한국어에서는 생략된 ‘몫’을 보완했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל / גְּבוּל
  english_pob_choice: And along the border
  chosen_korean: 그리고 … 경계 곁에는
  alternatives_korean:
  - 그리고 … 경계 위에는
  - 그리고 … 경계에 따라
  lexicon: HALOT
  rationale: territorial allotment 문맥에서 גְּבוּל은 단순한 ‘영토’보다 경계선/경계 구획을 가리키므로, 자연스러운 한국어로 ‘경계 곁’이라고 옮겨 공간적 배열을 살렸습니다.
- source_word: מִפְּאַת קָדִימָה עַד פְּאַת יָמָּה
  english_pob_choice: from the east side to the west side
  chosen_korean: 동쪽 편에서 서쪽 편까지
  alternatives_korean:
  - 동쪽 가장자리에서 서쪽 가장자리까지
  - 동쪽 끝에서 서쪽 끝까지
  lexicon: HALOT
  rationale: פֵּאָה의 반복은 동서 방향의 전 범위를 나타내므로, POB의 의미를 따라 ‘편’으로 간결하게 재현했습니다.
- source_word: מְנַשֶּׁה אֶחָד
  english_pob_choice: Manasseh, one portion
  chosen_korean: 므낫세, 한 몫이 있습니다
  alternatives_korean:
  - 므낫세, 하나입니다
  - 므낫세, 한 분깃입니다
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘므낫세, 하나’이지만, 앞뒤 문맥의 분깃 공식상 영어 POB처럼 생략된 ‘portion’을 보완해야 한국어가 자연스럽고 오해가 없습니다.
