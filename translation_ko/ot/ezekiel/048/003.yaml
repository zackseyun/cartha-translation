base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/003.yaml
  text: And alongside the border of Asher[a], from the eastern side to the western side, Naphtali, one portion.
  footnotes:
  - marker: a
    text: Hebrew literally, 'Naphtali, one.' The word 'portion' is supplied for clarity from the land-allotment context of this chapter.
    reason: lexical_alternative
translation:
  language: ko
  text: 아셀의 경계를 따라, 동쪽에서 서쪽까지는 납달리의 몫 하나입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘납달리, 하나’입니다. 여기서는 이 장의 토지 분배 문맥에 따라 ‘몫’을 보충했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  english_pob_choice: And alongside
  chosen_korean: 그리고 ... 곁에는
  alternatives_korean:
  - 그리고 ... 옆에는
  - 그리고 ... 따라
  lexicon: HALOT
  rationale: 경계에 대해 이어지는 위치 관계를 한국어로 자연스럽게 살리기 위해 ‘곁’으로 옮겼습니다.
- source_word: גְּבוּל
  english_pob_choice: border
  chosen_korean: 경계
  alternatives_korean:
  - 경계선
  - 경계
  lexicon: HALOT
  rationale: 지명 사이의 분배 맥락에서 물리적 ‘경계선’보다, 반복되는 토지 분배 공식에 맞는 ‘경계’가 간결하고 적절합니다.
- source_word: מִ/פְּאַת קָדִימָה ... וְ/עַד פְּאַת יָמָּה
  english_pob_choice: from the eastern side to the western side
  chosen_korean: 동쪽에서 서쪽까지
  alternatives_korean:
  - 동쪽 면에서 서쪽 면까지
  - 동쪽 끝에서 서쪽 끝까지
  lexicon: HALOT
  rationale: פֵּאָה의 ‘면/가장자리’라는 뜻은 이 문맥에서 범위를 나타내므로, 한국어에서는 방향 범위를 가장 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: אֶחָד
  english_pob_choice: one portion
  chosen_korean: 한 몫
  alternatives_korean:
  - 한 부분
  - 한 몫의 분깃
  - 한 몫(곧 한 분깃)
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘하나’지만, 문맥상 지파 분배의 몫을 뜻하므로 이를 드러내는 ‘한 몫’이 가장 덜 설명적이면서도 의미를 보존합니다.
theological_decisions:
- issue: 지파 분배 공식의 압축 표현
  chosen_reading: ‘납달리 한 몫입니다’로 마무리해, 히브리어의 생략된 분깃 개념을 본문 문맥 안에서 드러냈습니다.
  alternative_readings:
  - ‘납달리 하나입니다’
  - ‘납달리 한 분깃입니다’
  rationale: 본절은 단순 숫자 진술이 아니라 토지 분배 공식을 이루므로, ‘몫’으로 풀어 주는 것이 독자가 문맥을 오해하지 않게 합니다.
  doctrine_reference: 본문 문맥 보존 및 분깃/기업 배분 관찰
