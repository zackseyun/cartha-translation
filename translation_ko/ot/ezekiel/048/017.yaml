  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֣ה מִגְרָשׁ֮ לָ/עִיר֒ צָפ֨וֹנָ/ה֙ חֲמִשִּׁ֣ים וּ/מָאתַ֔יִם וְ/נֶ֖גְבָּ/ה חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם וְ/קָדִ֨ימָ/ה֙ חֲמִשִּׁ֣ים וּ/מָאתַ֔יִם וְ/יָ֖מָּ/ה חֲמִשִּׁ֥ים וּ/מָאתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/017.yaml
  text: And the city's open land shall be two hundred fifty cubits to the north[a], two hundred fifty to the south, two hundred fifty to the east[b], and two hundred fifty to the west.
  footnotes:
  - marker: a
    text: Hebrew simply gives the measurements as 'fifty and two hundred' in each direction; this is rendered in standard English order as 'two hundred fifty.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term for the land around the city can also be rendered 'pasture land' or 'common land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍의 열린 땅은 북쪽으로 이백오십 규빗, 남쪽으로 이백오십 규빗, 동쪽으로 이백오십 규빗, 서쪽으로 이백오십 규빗입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִגְרָשׁ
  english_pob_choice: open land
  chosen_korean: 열린 땅
  alternatives_korean:
  - 공터
  - 시유지 주변 땅
  - 목초지
  lexicon: HALOT
  rationale: 성읍 주위에 배정된 구획이라는 뜻을 살려 현대 한국어에서 자연스러운 ‘열린 땅’으로 옮겼습니다. '목초지'는 너무 좁고, '공터'는 도시의 빈 공간처럼 들릴 수 있어 피했습니다.
- source_word: לָעִיר
  english_pob_choice: the city's
  chosen_korean: 그 성읍의
  alternatives_korean:
  - 성읍을 위한
  - 성읍에 속한
  lexicon: HALOT
  rationale: 관계를 나타내는 לָ를 소유·배속 관계로 받아 한국어 소유격으로 풀었습니다.
- source_word: חֲמִשִּׁים וּמָאתַיִם
  english_pob_choice: two hundred fifty
  chosen_korean: 이백오십
  alternatives_korean:
  - 이백오십 규빗
  - 이백오십
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘쉰과 이백’의 순서지만, 한국어에서는 수량을 표준 어순인 ‘이백오십’으로 자연스럽게 정리했습니다.
- source_word: צָפוֹנָה / נֶגְבָּה / קָדִימָה / יָמָּה
  english_pob_choice: to the north / to the south / to the east / to the west
  chosen_korean: 북쪽으로 / 남쪽으로 / 동쪽으로 / 서쪽으로
  alternatives_korean:
  - 북쪽에
  - 북으로
  - 북쪽 편으로
  lexicon: HALOT
  rationale: 방향을 나타내는 종결형을 한국어 조사구로 균형 있게 옮겨 측량 문맥의 열거 구조를 살렸습니다.
