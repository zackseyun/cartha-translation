  source_fidelity: 히브리어는 성읍에 배정된 מִגְרָשׁ의 각 방향 치수를 각각 ‘오십과 이백’으로 제시하며, 문맥상 모두 250규빗입니다. 초안은 네 방향과 수치를 정확히 반영합니다. 다만 ‘열린 땅’은 영어 open land를 직역한 듯하여 מִגְרָשׁ이 가리키는 성읍에 딸린 비건축·공용 성격의 토지를 한국어로 자연스럽게 전달하지 못합니다.
  naturalness: ‘성읍에 딸린 공지’는 측량·토지 배정 문맥에서 자연스럽고, 현대 표준 한국어의 격식 있는 문체에도 맞습니다. 방향 및 수량의 병렬 표현과 ‘입니다’ 종결은 적절합니다.
  terminology: ‘성읍’과 ‘규빗’은 적절합니다. מִגְרָשׁ은 현대 도시의 ‘교외’로 좁히지 않으면서도 ‘열린 땅’보다 자연스러운 ‘공지’로 옮기고, 대안 의미는 주석에서 보완합니다.
  issues:
  - severity: medium
    issue: ‘열린 땅’은 מִגְרָשׁ의 한국어 표현으로 부자연스러운 직역입니다.
    rationale: 이 말은 한국어에서 일반적인 토지 용어로 잘 쓰이지 않으며, 성읍에 배정된 빈 터·공용지라는 문맥적 의미가 선명하지 않습니다.
  revised_text: 성읍에 딸린 공지는 북쪽으로 이백오십 규빗, 남쪽으로 이백오십 규빗, 동쪽으로 이백오십 규빗, 서쪽으로 이백오십 규빗입니다.
