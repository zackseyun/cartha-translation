  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַל֙ גְּב֣וּל יְהוּדָ֔ה מִ/פְּאַ֥ת קָדִ֖ים עַד פְּאַת יָ֑מָּ/ה תִּהְיֶ֣ה הַ/תְּרוּמָ֣ה אֲֽשֶׁר תָּרִ֡ימוּ חֲמִשָּׁה֩ וְ/עֶשְׂרִ֨ים אֶ֜לֶף רֹ֗חַב וְ/אֹ֜רֶךְ כְּ/אַחַ֤ד הַ/חֲלָקִים֙ מִ/פְּאַ֤ת קָדִ֨ימָ/ה֙ עַד פְּאַת יָ֔מָּ/ה וְ/הָיָ֥ה הַ/מִּקְדָּ֖שׁ בְּ/תוֹכֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/008.yaml
  text: 'Along the border of Judah[a], from the east side to the west side, shall be the contribution that you shall set apart: twenty-five thousand in width, and in length like one of the portions, from the east side to the west side[c][b]; and the sanctuary shall be in its midst.'
  footnotes:
  - marker: a
    text: Or 'the offering' or 'the district set apart.' The Hebrew term refers to a portion specially set apart for holy use.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from the east edge to the seaward edge'; 'west side' expresses the idiomatic directional sense.
    reason: lexical_alternative
  - marker: c
    text: That is, like one of the tribes' allotted land portions in length.
    reason: cultural_note
translation:
  language: ko
  text: 유다의 경계를 따라, 동쪽 끝에서 서쪽 끝까지, 여러분이 구별하여 바칠 그 구역[a]이 있을 것입니다. 너비는 이만 오천이고, 길이는 몫들 가운데 하나와 같으며, 동쪽 끝에서 서쪽 끝까지입니다[b][c] 그 한가운데에 성소가 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구별하여 바칠 그 구역’은 히브리어 תְּרוּמָה를 토지 분배 문맥에 맞게 옮긴 것입니다. 이 말은 ‘헌납물’ 또는 ‘바쳐 구별한 몫’이라는 뜻을 담습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘동쪽 끝에서 서쪽 끝까지’는 문자적으로 ‘동쪽 경계에서 바다 쪽 경계까지’입니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 지파들에게 분배된 몫들 가운데 하나와 같은 길이입니다.
    reason: cultural_note
lexical_decisions:
- source_word: גְּבוּל
  english_pob_choice: border
  chosen_korean: 경계
  alternatives_korean:
  - 경계선
  - 지경
  lexicon: HALOT
  rationale: 지파 분배 문맥에서 территorial boundary를 가리키므로 ‘경계’가 자연스럽고, 유다의 땅 분할을 분명하게 드러냅니다.
- source_word: הַתְּרוּמָה
  english_pob_choice: the contribution
  chosen_korean: 구별하여 바칠 그 구역
  alternatives_korean:
  - 바칠 제물
  - 바쳐 구별한 몫
  - 헌납물
  lexicon: HALOT
  rationale: 이 단어는 ‘들어 올린 것’에서 나온 제의적 헌납/구별의 뉘앙스를 가지지만, 여기서는 성소를 위한 토지 구획이므로 ‘구별하여 바칠 그 구역’으로 풀어 기술적 의미를 살렸습니다.
- source_word: תָּרִימוּ
  english_pob_choice: you shall set apart
  chosen_korean: 구별하여 바칠
  alternatives_korean:
  - 바칠
  - 들어 올릴
  lexicon: HALOT
  rationale: 히필형 רום은 여기서 단순 제사 동작보다 ‘따로 떼어 헌납하다/구별하다’의 뜻이므로, 토지 분배 문맥에 맞게 번역했습니다.
- source_word: כְּאַחַד הַחֲלָקִים
  english_pob_choice: like one of the portions
  chosen_korean: 각 몫 중 하나와 같고
  alternatives_korean:
  - 몫들 가운데 하나와 같고
  - 각 분깃 중 하나와 같고
  lexicon: HALOT
  rationale: חֵלֶק은 몫/분깃/할당분을 뜻하며, 직전 문맥의 지파별 분배를 반영해 ‘각 몫’으로 자연스럽게 옮겼습니다.
- source_word: הַמִּקְדָּשׁ בְּתוֹכוֹ
  english_pob_choice: the sanctuary shall be in its midst
  chosen_korean: 성소가 그 한가운데에 있을 것입니다
  alternatives_korean:
  - 성소가 그 중앙에 있을 것입니다
  - 성소가 그 안에 있을 것입니다
  lexicon: HALOT
  rationale: מִקְדָּשׁ는 성전 전체보다 넓은 ‘성소/거룩한 구역’을 가리킬 수 있어, 중심 배치를 드러내는 ‘한가운데’로 옮겼습니다.
theological_decisions:
- issue: 제의적 ‘תרומה’의 성격
  chosen_reading: 토지의 일부를 야훼께 구별하여 바치는 거룩한 구역으로 이해하되, 본문에는 과도한 해석어를 덧붙이지 않았습니다.
  alternative_readings:
  - 단순한 헌물
  - 성전 부지 자체
  rationale: 에스겔 45–48장의 문맥에서 이 항목은 제사 제물보다 거룩히 떼어 놓은 토지 구획의 의미가 강하므로, 그 긴장을 유지하는 표현을 택했습니다.
  doctrine_reference: Ezekiel 45–48 land allotment / holy district
- issue: ‘성소가 그 한가운데’의 중심성
  chosen_reading: 성소의 중앙 배치를 그대로 살려, 거룩한 중심이 분배 전체를 규정한다는 구조를 드러냈습니다.
  alternative_readings:
  - 단순 위치 정보로 축소
  - 상징적 의미를 과장
  rationale: 본문의 초점은 위치 설명이지만, 그 위치가 전체 구역의 성격을 결정하므로 서술적 과장을 피하면서도 중심성을 유지했습니다.
  doctrine_reference: Temple/sanctuary centrality in Ezekiel's restored land vision
