id: EZK.48.12
reference: Ezekiel 48:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיְתָ֨ה לָ/הֶ֧ם תְּרוּמִיָּ֛ה מִ/תְּרוּמַ֥ת הָ/אָ֖רֶץ קֹ֣דֶשׁ קָדָשִׁ֑ים אֶל גְּב֖וּל הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/012.yaml
  text: And it shall be for them a special allotment from the contribution of the land[a], most holy[c][b], beside the territory of the Levites.
  footnotes:
  - marker: a
    text: Or 'a reserved portion' for תְּרוּמִיָּה; the Hebrew term is related to a contribution or offering set apart for sacred use.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'most holy'; compare the superlative expression sometimes rendered 'holy of holies.' Here it describes the sanctity of the land portion.
    reason: lexical_alternative
  - marker: c
    text: Or 'the border of the Levites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 그들에게 땅의 헌물 가운데서 나온 특별한 몫이 되며, 가장 거룩한 것[a][b]이며, 레위 사람들의 경계 곁에 있을 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구별된 몫’으로도 옮길 수 있습니다. 히브리어 תְּרוּמִיָּה는 제의적 헌물과 분리된 전용 몫의 뉘앙스를 함께 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘가장 거룩한’이라는 최상급 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘레위 사람들의 경계’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרוּמִיָּה
  english_pob_choice: a special allotment
  chosen_korean: 특별한 몫
  alternatives_korean:
  - 거룩한 헌물
  - 봉헌된 몫
  - 특별히 구별된 몫
  lexicon: HALOT
  rationale: 이 단어는 이 문맥에서 제의적 ‘헌물’이라기보다 땅으로 구획된 전용 몫을 가리키므로, ‘특별한 몫’이 의미를 자연스럽게 살립니다.
- source_word: מִתְּרוּמַת הָאָרֶץ
  english_pob_choice: from the contribution of the land
  chosen_korean: 땅의 헌물 가운데서 나온
  alternatives_korean:
  - 땅의 봉헌물에서 나온
  - 땅의 구별된 몫에서 나온
  lexicon: HALOT
  rationale: ‘תְּרוּמָה’의 헌물/들어 올린 제물 이미지를 유지하되, 이 본문의 토지 분배 맥락을 살려 ‘땅의 헌물’로 옮겼습니다.
- source_word: קֹדֶשׁ קָדָשִׁים
  english_pob_choice: most holy
  chosen_korean: 가장 거룩한 것
  alternatives_korean:
  - 지극히 거룩한 것
  - 지성소
  lexicon: HALOT
  rationale: 히브리어의 최상급 표현을 직역하되, 대상이 성전 내부가 아니라 토지 구획이므로 전통적 기술어 ‘지성소’는 피하고 ‘가장 거룩한 것’으로 표현했습니다.
- source_word: אֶל גְּבוּל הַלְוִיִּם
  english_pob_choice: beside the territory of the Levites
  chosen_korean: 레위 사람들의 경계 곁에 있을 것입니다
  alternatives_korean:
  - 레위 사람들의 영역 곁에 있을 것입니다
  - 레위 사람들의 경계에 맞닿아 있을 것입니다
  lexicon: HALOT
  rationale: אֶל은 경계 인접을 나타내므로 ‘곁에’로 옮겼고, גְּבוּל은 이 문맥에서 ‘경계/경계선’의 의미가 더 직접적이어서 ‘경계’로 유지했습니다.
theological_decisions:
- issue: ‘가장 거룩한 것’의 대상이 성소가 아니라 토지 구획이라는 점
  chosen_reading: 문맥상 성전 용어로 굳히지 않고, 토지에 적용된 최상급 거룩함으로 읽었습니다.
  alternative_readings:
  - ‘지성소’로 이해하는 읽기
  - ‘가장 거룩한 땅’으로 풀어 쓰는 읽기
  rationale: 에스겔 48장은 성전이 아니라 땅의 분배를 설명하므로, 본문의 거룩함을 성소 개념으로 전치하지 않도록 했습니다.
  doctrine_reference: 문맥 우선 원칙
