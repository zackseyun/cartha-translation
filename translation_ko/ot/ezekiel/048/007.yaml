id: EZK.48.7
reference: Ezekiel 48:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַ֣ל גְּב֣וּל רְאוּבֵ֗ן מִ/פְּאַ֥ת קָדִ֛ים עַד פְּאַת יָ֖מָּ/ה יְהוּדָ֥ה אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/007.yaml
  text: And along the border of Reuben[a], from the eastern side to the western side, Judah[c][b], one portion.
  footnotes:
  - marker: a
    text: Literally, 'Judah, one.' The word 'portion' is implied by the land-allotment formula in this chapter.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sea side' can function as a directional term meaning 'west side.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from the eastern side to the western side, Judah, one portion.'.
    reason: previous_rendering
translation:
  language: ko
  text: 르우벤의 경계 곁으로, 동쪽 끝에서 서쪽 끝까지, 유다, 한 몫입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 '유다, 하나'입니다. 이 장의 반복되는 땅 분배 공식에서 '몫'이 생략되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 '바다 쪽'은 방향을 가리키는 표현으로 '서쪽'을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '동쪽 끝에서 서쪽 끝까지, 유다, 한 몫'으로 옮길 수도 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וְ/עַל
  english_pob_choice: And along
  chosen_korean: -곁으로
  alternatives_korean:
  - 그리고 따라
  - 그 경계 위로
  lexicon: HALOT
  rationale: 지파 몫의 배열을 이어 주는 전치적 표현이므로, 단순한 '그리고'보다 경계에 붙어 있는 흐름을 살리는 '-곁으로'가 자연스럽습니다.
- source_word: גְּבוּל
  english_pob_choice: border
  chosen_korean: 경계
  alternatives_korean:
  - 변경
  - 경계선
  lexicon: HALOT
  rationale: 땅 분배 문맥에서 גְּבוּל은 지파 몫의 경계선을 가리키므로 '경계'가 가장 간결하고 정확합니다.
- source_word: מִ/פְּאַת קָדִים … עַד פְּאַת יָמָּה
  english_pob_choice: from the eastern side to the western side
  chosen_korean: 동쪽 끝에서 서쪽 끝까지
  alternatives_korean:
  - 동쪽 면에서 서쪽 면까지
  - 동쪽 변에서 서쪽 변까지
  lexicon: HALOT
  rationale: פְּאָה는 끝·면·변의 뜻이 있지만, 측량식 배열에서는 방향의 양 끝을 나타내므로 '끝'이 가장 읽기 쉽고 문맥에도 맞습니다.
- source_word: יְהוּדָה אֶחָד
  english_pob_choice: Judah, one portion
  chosen_korean: 유다, 한 몫
  alternatives_korean:
  - 유다, 하나
  - 유다, 한 분깃
  lexicon: HALOT
  rationale: 히브리어는 직역하면 '유다, 하나'이지만, 이 장의 반복되는 분배 공식상 생략된 '몫/분깃'이 암시되므로 한국어에서는 이를 드러내는 것이 문맥에 충실합니다.
theological_decisions:
- issue: 지파 경계와 몫 분배의 압축된 명사구
  chosen_reading: 서술어를 보충하지 않고, 목록형 배분 문구로 유지했습니다.
  alternative_readings:
  - 유다에게는 한 몫이 있습니다
  - 유다가 한 몫을 차지합니다
  rationale: 원문은 동사 없이 경계와 몫을 나열하는 압축된 분배 공식이므로, 한국어에서도 설명을 덧붙이기보다 간명한 열거형으로 살려 원문의 구조를 보존했습니다.
  doctrine_reference: 본문 구조 보존 원칙
