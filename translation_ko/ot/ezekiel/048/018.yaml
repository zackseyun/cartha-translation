source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֨ר בָּ/אֹ֜רֶךְ לְ/עֻמַּ֣ת תְּרוּמַ֣ת הַ/קֹּ֗דֶשׁ עֲשֶׂ֨רֶת אֲלָפִ֤ים קָדִ֨ימָ/ה֙ וַ/עֲשֶׂ֤רֶת אֲלָפִים֙ יָ֔מָּ/ה וְ/הָיָ֕ה לְ/עֻמַּ֖ת תְּרוּמַ֣ת הַ/קֹּ֑דֶשׁ וְ/הָיְתָ֤ה תבואת/ה לְ/לֶ֔חֶם לְ/עֹבְדֵ֖י הָ/עִֽיר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/018.yaml
  text: And the remainder along the length[a], corresponding to the holy contribution, shall be ten thousand to the east and ten thousand to the west; it shall correspond to the holy contribution[b], and its produce shall be for food for the workers of the city.
  footnotes:
  - marker: a
    text: Hebrew יָמָּה is literally 'toward the sea,' a standard Hebrew way of indicating west.
    reason: lexical_alternative
  - marker: b
    text: Or 'for bread'; here 'bread' likely stands for food provisions more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 남은 땅은 거룩한 헌물에 맞먹는 길이로 동쪽으로 만 단, 서쪽으로 만 단이 될 것입니다. 그것은 거룩한 헌물에 맞먹을 것이며, 그 소산은 성읍의 일꾼들을 위한 먹을 것이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יָמָּה는 문자적으로 ‘바다 쪽으로’이지만, 이 문맥에서는 서쪽을 가리키는 관용적 표현입니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘빵을 위해’이지만, 여기서는 식량 공급을 가리키는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר
  english_pob_choice: And the remainder
  chosen_korean: 그리고 남은 땅
  alternatives_korean:
  - 그리고 나머지
  - 그리고 남은 것
  lexicon: HALOT
  rationale: 문맥상 앞에서 구획된 성별된 땅에서 ‘남은 부분’이므로, 한국어에서는 대상이 토지임을 드러내는 ‘남은 땅’이 자연스럽고 분명합니다.
- source_word: לְעֻמַּת תְּרוּמַת הַקֹּדֶשׁ
  english_pob_choice: corresponding to the holy contribution
  chosen_korean: 거룩한 헌물에 맞먹는
  alternatives_korean:
  - 거룩한 헌물에 대응하는
  - 거룩한 헌물과 나란한
  lexicon: HALOT
  rationale: לְעֻמַּת은 단순한 위치보다 ‘대응/대칭/상응’의 관계를 가리키므로, 측량 맥락을 살려 ‘맞먹는’으로 옮겼습니다.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  english_pob_choice: the holy contribution
  chosen_korean: 거룩한 헌물
  alternatives_korean:
  - 거룩한 기여분
  - 거룩한 봉헌물
  lexicon: HALOT
  rationale: 이 절의 תְּרוּמָה는 예물 자체보다 구별해 떼어 놓은 몫/구획을 뜻하므로, 제의적이면서도 토지 분배 문맥에 맞는 ‘헌물’을 선택했습니다.
- source_word: תבואת/ה
  english_pob_choice: its produce
  chosen_korean: 그 소산
  alternatives_korean:
  - 그 수확
  - 그 산출
  lexicon: HALOT
  rationale: תְּבוּאָה는 농경지의 소출을 뜻하므로, 성경적이면서도 자연스러운 ‘소산’이 가장 압축적으로 대응합니다.
- source_word: לְעֹבְדֵי הָעִיר
  english_pob_choice: for the workers of the city
  chosen_korean: 성읍의 일꾼들을 위한
  alternatives_korean:
  - 성읍을 섬기는 사람들을 위한
  - 성읍의 노동자들을 위한
  lexicon: HALOT
  rationale: עֹבְדֵי는 단순한 ‘봉사자’보다 실제로 일하는 사람들을 가리키므로, 직역을 유지하면서도 과도하게 공적·종교적 의미를 부여하지 않는 ‘일꾼들’로 옮겼습니다.
theological_decisions:
- issue: יָמָּה의 방향성
  chosen_reading: ‘서쪽으로’로 번역하되, 본문의 공간 배치를 분명히 드러냈습니다.
  alternative_readings:
  - ‘바다 쪽으로’
  - ‘서방으로’
  rationale: 히브리어 יָמָּה는 문자적으로 ‘바다 쪽’이지만, 이 맥락에서는 서쪽 방향을 가리키는 관용적 표현이므로 현대 한국어 독자를 위해 방향 의미를 우선했습니다.
  doctrine_reference: 본문의 측량·분배 맥락에 따른 방향 용례
- issue: לֶחֶם의 의미 범위
  chosen_reading: ‘먹을 것’으로 옮겨 식량 공급의 뜻을 드러냈습니다.
  alternative_readings:
  - ‘빵’
  - ‘음식’
  rationale: לֶחֶם은 문자적으로 ‘빵’이지만, 여기서는 성읍의 일꾼들에게 지급되는 생계용 식량을 뜻하므로, 협의의 빵보다 넓은 ‘먹을 것’이 문맥에 더 정확합니다.
  doctrine_reference: 농경·분배 문맥에서의 לחם 의미 범위
