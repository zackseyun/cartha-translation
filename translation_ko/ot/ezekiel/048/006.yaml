id: EZK.48.6
reference: Ezekiel 48:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַ֣ל גְּב֣וּל אֶפְרַ֗יִם מִ/פְּאַ֥ת קָדִ֛ים וְ/עַד פְּאַת יָ֖מָּ/ה רְאוּבֵ֥ן אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/006.yaml
  text: And along the border of Ephraim[a], from the east side to the west side, Reuben[b], one portion.
  footnotes:
  - marker: a
    text: Literally, 'Reuben, one.' The word 'portion' is supplied in English because the chapter uses 'one' elliptically for one tribal allotment.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to the side of the sea'; here 'sea' functions as the standard Hebrew term for the west.
    reason: cultural_note
translation:
  language: ko
  text: 에브라임의 경계를 따라, 동쪽 끝에서 서쪽[b] 끝까지는 르우벤의 몫 하나입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘르우벤, 하나’라고 되어 있습니다. 이 장의 문맥에서는 지파에 배정되는 ‘몫’을 가리키는 타원 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘바다 쪽’이라고 합니다. 여기서는 서쪽을 가리키는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  english_pob_choice: And along
  chosen_korean: 그리고 …으로부터
  alternatives_korean:
  - 그리고 … 위에
  - 그리고 … 곁에
  lexicon: HALOT
  rationale: 문맥상 접속과 위치를 함께 드러내야 하므로, 단순한 '그리고'만이 아니라 경계선을 따라 이어지는 흐름을 한국어로 자연스럽게 살렸습니다.
- source_word: גְּבוּל
  english_pob_choice: border
  chosen_korean: 경계
  alternatives_korean:
  - 경계선
  - 변경
  lexicon: HALOT
  rationale: 지파 분배 문맥에서 גְּבוּל은 영토의 경계선을 가리키므로 '경계'가 가장 간결하고 정확합니다.
- source_word: מִפְּאַת קָדִים / וְעַד פְּאַת יָמָּה
  english_pob_choice: from the east side / to the west side
  chosen_korean: 동쪽 끝에서 서쪽 끝까지
  alternatives_korean:
  - 동쪽 변에서 서쪽 변까지
  - 동쪽 면에서 서쪽 면까지
  - 동쪽 가장자리에서 서쪽 가장자리까지
  lexicon: HALOT
  rationale: פֵּאָה의 'side/edge' 뜻과 יָמָּה의 서쪽 방향 용법을 함께 반영하되, 한국어에서는 반복되는 지리 공식을 가장 분명하게 전달하는 '끝'을 택했습니다.
- source_word: אֶחָד
  english_pob_choice: one portion
  chosen_korean: 한 몫
  alternatives_korean:
  - 한 부분
  - 한 몫입니다
  - 하나
  lexicon: HALOT
  rationale: 히브리어는 단순히 '하나'이지만 이 장의 분배 문맥에서는 생략된 '몫/분깃'이 전제되므로, 영어 POB의 해석을 따라 '한 몫'으로 옮겼습니다.
theological_decisions:
- issue: 지파 분배 공식의 압축 표현
  chosen_reading: 문장의 끝을 '한 몫입니다'로 처리해, 히브리어의 생략된 명사를 한국어에서 보충했습니다.
  alternative_readings:
  - '''하나입니다''처럼 더 직역적으로 옮기는 방법'
  - '''한 분깃입니다''처럼 전통 용어를 쓰는 방법'
  rationale: 본절은 분배 목록의 공식적 진술로, 한국어에서 의미를 완결하려면 생략된 명사를 보충하는 것이 가장 명확합니다. 다만 '분깃'은 전통적이지만 현대 독자에게 덜 투명하여 '몫'을 택했습니다.
  doctrine_reference: 본문의 서술 의도와 가독성
