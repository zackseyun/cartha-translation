translation:
  language: ko
  text: 그 둘레는 만 팔천입니다. 그날부터 그 도시의 이름은 ‘야훼께서 거기 계십니다’입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘YHWH shammah’를 음역하면 ‘야훼 삼마’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: סָבִיב
  english_pob_choice: All around
  chosen_korean: 사방으로는
  alternatives_korean:
  - 둘레는
  - 주변은
  lexicon: HALOT
  rationale: 도시의 둘레 전체를 가리키는 공간 표현으로, 현대 한국어에서 자연스럽고 간결한 ‘사방으로는’이 적합합니다.
- source_word: שְׁמֹנָה עָשָׂר אָלֶף
  english_pob_choice: eighteen thousand
  chosen_korean: 만팔천
  alternatives_korean:
  - 만팔천 큐빗
  - 만팔천
  lexicon: HALOT
  rationale: 이 절 자체는 수량만 제시하며 단위를 반복하지 않으므로, 본문 구조를 따라 단위를 덧붙이지 않고 수치만 옮겼습니다.
- source_word: וְשֵׁם הָעִיר
  english_pob_choice: and the name of the city
  chosen_korean: 그리고 그 도시의 이름은
  alternatives_korean:
  - 그리고 도시의 이름은
  - 그리고 그 성읍의 이름은
  lexicon: HALOT
  rationale: ‘도시’는 문맥상 새 성읍에 대한 명명 공식으로 자연스럽고, 정관적 소유 구조를 한국어 어순에 맞게 풀어 옮겼습니다.
- source_word: יְהוָה שָׁמָּה
  english_pob_choice: Yahweh Is There
  chosen_korean: ‘야훼께서 거기 계십니다’
  alternatives_korean:
  - ‘야훼가 거기 있습니다’
  - ‘야훼께서 거기에 계십니다’
  lexicon: HALOT
  rationale: 하나님의 이름 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, שָׁמָּה의 이름적 기능을 살려 도시의 명칭처럼 따옴표로 처리했습니다.
theological_decisions:
- issue: 도시 이름 속 신명 יְהוָה의 처리
  chosen_reading: ‘야훼께서 거기 계십니다’
  alternative_readings:
  - ‘여호와께서 거기 계십니다’
  - ‘주께서 거기 계십니다’
  rationale: 본문은 도시의 공식 명칭으로 야훼의 임재를 선포하므로, 제목화된 이름으로서의 뉘앙스를 보존하면서도 신명은 ‘야훼’로 직접 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
