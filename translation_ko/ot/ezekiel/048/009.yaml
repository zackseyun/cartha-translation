source:
  edition: WLC
  text: הַ/תְּרוּמָ֕ה אֲשֶׁ֥ר תָּרִ֖ימוּ לַֽ/יהוָ֑ה אֹ֗רֶךְ חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף וְ/רֹ֖חַב עֲשֶׂ֥רֶת אֲלָפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/009.yaml
  text: The contribution that you shall set apart for Yahweh shall be twenty-five thousand in length and ten thousand in width[a].
  footnotes:
  - marker: a
    text: Or 'offering' or 'portion set apart.' The Hebrew term refers to something lifted up or designated as a contribution, and in this context it denotes the sacred tract set apart from the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께 드릴 거제물은 길이 이만오천, 너비 일만입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘봉헌물’, ‘구별한 몫’입니다. 히브리어 용어는 들어 올리거나 지정해 구별한 몫을 가리키며, 여기서는 땅에서 따로 떼어 놓은 성역을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרוּמָה
  english_pob_choice: the contribution
  chosen_korean: 거제물
  alternatives_korean:
  - 봉헌물
  - 바침
  - 구별한 몫
  lexicon: HALOT
  rationale: 본문의 תְּרוּמָה는 단순한 제사 제물보다 ‘들어 올려 구별해 드린 것’이라는 의미가 강하므로, 에스겔 45–48장의 성별된 토지 구역 문맥에 맞는 전통 용어인 ‘거제물’로 옮겼습니다.
- source_word: אֲשֶׁר תָּרִימוּ
  english_pob_choice: that you shall set apart
  chosen_korean: 드릴
  alternatives_korean:
  - 구별하여 드릴
  - 바칠
  - 들어 올려 드릴
  lexicon: HALOT
  rationale: רוּם의 사역형은 여기서 ‘거룩한 몫으로 구별하다’는 뜻이므로, 한국어에서는 문맥상 자연스럽고 제의적 헌납 의미를 살리는 ‘드릴’로 압축해 번역했습니다.
- source_word: לַיהוָה
  english_pob_choice: for Yahweh
  chosen_korean: 여호와께
  alternatives_korean:
  - 야훼께
  - 주님께
  lexicon: HALOT
  rationale: POB 영어본의 고유명사는 본문 주석과 달리 한국어 공시성 및 교회 사용성을 고려해 통상 표기인 ‘여호와’로 옮겼습니다. 다만 이는 본문 의미상 헌납 대상이 야훼 자신임을 분명히 합니다.
- source_word: אֹרֶךְ ... וְרֹחַב
  english_pob_choice: in length ... in width
  chosen_korean: 길이 ... 너비
  alternatives_korean:
  - 세로 ... 가로
  - 길 ... 폭
  lexicon: HALOT
  rationale: 두 차원을 병렬로 제시하는 히브리어 구조를 살려 ‘길이’와 ‘너비’로 대응시켰고, 한국어에서 가장 명료한 치수 표현을 택했습니다.
theological_decisions:
- issue: 하나님의 이름 יחוה/YHWH의 한국어 표기
  chosen_reading: 본문에는 통상 표기인 ‘여호와’를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 원문은 יְהוָה를 직접 사용하지만, 한국어 본문에서는 독자 친숙성과 예배·성경 사용 전통을 고려해 ‘여호와’로 옮겼습니다. 다만 이는 번역상의 관습 선택이며, 본문의 헌납 대상이 언약의 하나님임을 흐리지 않습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה/YHWH 표기'
- issue: תְּרוּמָה의 성격
  chosen_reading: 단순한 ‘제물’이 아니라 토지에서 구별된 ‘거제물’로 읽었습니다.
  alternative_readings:
  - 제물
  - 봉헌물
  - 헌물
  rationale: 에스겔 45–48장에서는 תְּרוּמָה가 제의적 희생보다 성별된 구역 전체를 가리키므로, 한국어에서도 그 지리·헌납적 의미를 유지해야 합니다.
  doctrine_reference: 에스겔 45–48장 토지 분배 문맥
