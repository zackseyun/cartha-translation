translation:
  language: ko
  text: 서쪽 편[a]은 사천오백입니다. 그들의 세 문은 곧 갓의 문 하나, 아셀의 문 하나, 납달리의 문 하나입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바다 쪽’(서쪽)을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 동사가 생략된 열거식 표현이라, ‘그들의 문은 세 개’ 또는 ‘그들의 세 문’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת יָמָּה
  english_pob_choice: On the west side
  chosen_korean: 서쪽 편
  alternatives_korean:
  - 서쪽 변
  - 서쪽 면
  - 서쪽 가장자리
  lexicon: HALOT
  rationale: פְּאַת는 가장자리/편을 뜻하고, יָמָּה는 서쪽을 가리키므로, 도시 둘레를 묘사하는 문맥에 맞게 간결한 ‘서쪽 편’으로 옮겼습니다.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
