translation:
  language: ko
  text: 서쪽 편[a]은 사천오백이며, 그 문은 세 개입니다. 곧 갓의 문 하나, 아셀의 문 하나, 납달리의 문 하나입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘바다 쪽’이며, 여기서는 서쪽을 가리킵니다.
