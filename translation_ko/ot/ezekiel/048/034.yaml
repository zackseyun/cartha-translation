theological_decisions:
- issue: 측량값과 문 개수의 열거를 어떻게 문장화할지
  chosen_reading: 수치와 명칭을 해설적으로 풀지 않고, 본문의 목록 체계를 그대로 보존했습니다.
  alternative_readings:
