  - 문이 세 개 있습니다
  - 그들의 문 세 개
  lexicon: HALOT
  rationale: 동사가 생략된 열거식 문장 구조를 살려 ‘세 문’으로 간결하게 옮겼고, 영어 POB의 ‘their’를 반영해 소유/귀속 관계를 유지했습니다.
- source_word: שַׁעַר גָּד אֶחָד / שַׁעַר אָשֵׁר אֶחָד / שַׁעַר נַפְתָּלִי אֶחָד
  english_pob_choice: the gate of Gad, one; the gate of Asher, one; the gate of Naphtali, one
  chosen_korean: 갓의 문 하나, 아셀의 문 하나, 납달리의 문 하나
  alternatives_korean:
  - 갓 문 하나, 아셀 문 하나, 납달리 문 하나
  - 갓 지파의 문 하나, 아셀 지파의 문 하나, 납달리 지파의 문 하나
  lexicon: HALOT
  rationale: 각 항목의 반복적 열거 형식을 보존하기 위해 ‘—의 문 하나’ 구조를 유지했고, 지파 이름은 통용되는 음역형을 사용했습니다.
theological_decisions:
- issue: 측량값과 문 개수의 열거를 어떻게 문장화할지
  chosen_reading: 수치와 명칭을 해설적으로 풀지 않고, 본문의 목록 체계를 그대로 보존했습니다.
  alternative_readings:
  - ‘서쪽 편의 길이는 사천오백이며 문은 세 개입니다’
  - ‘서쪽 변, 사천오백, 문 셋…’
  rationale: 이 절은 예루살렘 성읍 배치의 도식적 기록이므로, 본문의 열거 리듬을 유지하는 것이 의미 전달에 가장 충실합니다.
  doctrine_reference: 문맥 보존과 본문 형식 존중
- issue: ‘문’의 표현을 성문/대문으로 구체화할지
  chosen_reading: 중립적인 ‘문’을 사용했습니다.
  alternative_readings:
  - 성문
  - 대문
  rationale: 히브리어 שַׁעַר는 성문을 가리킬 수 있지만, 본문이 도시의 측량 목록이므로 과도한 구체화 없이 ‘문’으로 두는 편이 원문 구조를 잘 보존합니다.
  doctrine_reference: 어휘 과잉해석 방지
