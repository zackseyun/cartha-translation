  rationale: 이 절은 예루살렘 성읍 배치의 도식적 기록이므로, 본문의 열거 리듬을 유지하는 것이 의미 전달에 가장 충실합니다.
  doctrine_reference: 문맥 보존과 본문 형식 존중
- issue: ‘문’의 표현을 성문/대문으로 구체화할지
  chosen_reading: 중립적인 ‘문’을 사용했습니다.
  alternative_readings:
