  - 사천오백 명
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘오백과 사천’이지만 관용적으로 4,500을 뜻하므로, 현대 한국어 수치 표현에 맞게 ‘사천오백’으로 정리했습니다.
