revisions:
- from: 레위 사람들의 소유와 성읍의 소유 가운데서 — 곧 그 사이에 있을, 곧 그 땅은 왕자의 것이 될 것이니 — 유다의 경계와 베냐민의 경계 사이에 있는 그 땅은 왕자의 것이 될 것입니다.[a][b]
  to: 레위 사람들의 소유지와 성읍의 소유지에서, 곧 유다의 경계와 베냐민의 경계 사이에 있는 통치자에게 속하게 될 땅 가운데에 있는 것은 통치자의 것이 될 것입니다.[a][b]
  rationale: 원문의 전치사구들과 반복되는 소유 귀결을 유지하되, 한국어에서 관계를 명확히 하기 위해 ‘통치자에게 속하게 될 땅 가운데’와 ‘유다의 경계와 베냐민의 경계 사이’를 차례로 배치했습니다. ‘왕자’는 현대어의 친족적 의미를 피하고 원문의 행정적 직함을 보존하도록 ‘통치자’로 고쳤습니다.
