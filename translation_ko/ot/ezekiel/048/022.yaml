translation:
  language: ko
  text: 레위 사람들의 소유지와 성읍의 소유지에서, 곧 유다의 경계와 베냐민의 경계 사이에 있는 통치자에게 속하게 될 땅 가운데에 있는 것은 통치자의 것이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘통치자에게 속하게 될 곳 안에’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘유다의 영토와 베냐민의 영토 사이에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחֻזַּת
  english_pob_choice: property
  chosen_korean: 소유
  alternatives_korean:
  - 재산
  - 소유지
  - 점유지
  lexicon: HALOT
  rationale: 이 단어는 분배된 토지 몫을 가리키므로, 문맥에 맞게 ‘소유’로 옮겨 자연스럽게 소유권·배당의 뜻을 드러냈습니다.
- source_word: בְּתוֹךְ
  english_pob_choice: in the midst of
  chosen_korean: 가운데서 — 곧 그 사이에 있을
  alternatives_korean:
  - 안에서
  - 한가운데
  - 내부에
  lexicon: HALOT
  rationale: 히브리어의 공간적 배치를 살리기 위해 단순한 ‘안에서’보다 ‘가운데서’와 ‘사이에’의 병치를 사용했습니다.
- source_word: נָשִׂיא
  english_pob_choice: prince
  chosen_korean: 왕자
  alternatives_korean:
  - 지도자
  - 통치자
  - 군주
  lexicon: HALOT
  rationale: 에스겔의 분배 문맥에서 고유한 통치 직함으로 쓰이므로, 영어 POB의 ‘prince’를 반영해 ‘왕자’로 옮겼습니다. 다만 현대 한국어에서 왕족으로 오해될 수 있어 본문 뒤에 소유·경계 관계를 분명히 했습니다.
- source_word: גְּבוּל
  english_pob_choice: border
  chosen_korean: 경계
  alternatives_korean:
  - 영역
  - 지경
  - 경계선
  lexicon: HALOT
  rationale: 단순한 행정 구역보다 경계선 자체를 가리키는 뉘앙스를 살려 ‘경계’로 옮겼습니다.
theological_decisions:
- issue: 왕자(nāśîʾ) 직함의 번역을 어떻게 유지할 것인가
  chosen_reading: 본문의 정치·분배 직함을 그대로 살려 ‘왕자’로 옮기고, 메시아적 해석은 본문 밖으로 유보했습니다.
  alternative_readings:
  - 지도자
  - 통치자
  - 메시아적 왕자
  rationale: 에스겔 48장의 토지 분배 문맥은 특정한 행정적 직함을 다루며, 본문 자체는 그를 곧바로 메시아로 규정하지 않습니다. 따라서 용어의 긴장을 유지하는 쪽이 원문에 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
