  text: וְ/אֵ֖לֶּה תּוֹצְאֹ֣ת הָ/עִ֑יר מִ/פְּאַ֣ת צָפ֔וֹן חֲמֵ֥שׁ מֵא֛וֹת וְ/אַרְבַּ֥עַת אֲלָפִ֖ים מִדָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/030.yaml
  text: 'And these are the exits of the city: on the north side[b][a], four thousand five hundred measures.'
  footnotes:
  - marker: a
    text: Or 'the outgoings of the city.' The Hebrew term can denote the city's outward extents or exits.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'five hundred and four thousand,' an order commonly rendered in English as 'four thousand five hundred.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 성읍의 출입구들입니다. 북쪽 편은 사천오백 측량입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘성읍의 나가는 곳/출입구들’로도 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 수사 어순은 ‘오백과 사천’이지만, 한국어에서는 ‘사천오백’으로 옮기는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה תּוֹצְאֹת הָעִיר
  english_pob_choice: And these are the exits of the city
  chosen_korean: 이것이 성읍의 출입구들입니다
  alternatives_korean:
  - 그리고 이것은 성읍의 출입구들입니다
  - 이것들은 성읍의 출입구들입니다
  - 성읍의 나가는 곳은 이렇습니다
  lexicon: HALOT
  rationale: תּוֹצְאֹת는 ‘나가는 곳/출입구들’의 뜻이므로, 문맥상 도시의 외곽 출입 지점을 드러내는 ‘출입구들’이 가장 자연스럽습니다.
- source_word: מִפְּאַת צָפוֹן
  english_pob_choice: on the north side
  chosen_korean: 북쪽 편은
  alternatives_korean:
  - 북쪽 쪽은
  - 북쪽 면은
  - 북쪽 변은
  lexicon: HALOT
  rationale: פֵּאָה는 둘레의 ‘면/변/쪽’을 가리킬 수 있으나, 여기서는 측량 문맥이므로 한국어로는 ‘북쪽 편’이 간결하고 자연스럽습니다.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  english_pob_choice: four thousand five hundred
  chosen_korean: 사천오백
  alternatives_korean:
  - 사천오백이십
  - 오백과 사천
  - 사천오백 명
  lexicon: HALOT
  rationale: 히브리어 어순은 ‘오백과 사천’이지만, 한국어 수사 관용에 따라 총량을 ‘사천오백’으로 옮겼습니다.
- source_word: מִדָּה
  english_pob_choice: measures
  chosen_korean: 측량
  alternatives_korean:
  - 측량으로
  - 측정
  - 척도
  lexicon: HALOT
  rationale: מִדָּה는 여기서 구체 단위보다 ‘측량/재는 기준’을 가리키므로, 본문 전체의 측량 맥락을 살려 ‘측량’으로 옮겼습니다.
theological_decisions:
- issue: 측량 단위의 비명시성
  chosen_reading: 구체적 단위를 덧붙이지 않고 ‘측량’으로 유지했습니다.
  alternative_readings:
  - ‘사천오백 규빗’으로 구체화
  - ‘사천오백 길이’로 풀어쓰기
  rationale: 본문은 단위를 직접 말하지 않으므로, 없는 단위를 보태지 않고 측량 행위 자체를 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 본문 충실성 원칙
