  source_fidelity: 히브리어의 לְאֵלֶּה는 문맥상 앞절의 제사장들을 가리키므로, 무생물 지시인 ‘이것들’보다 ‘이 제사장들’로 밝혀 옮기는 것이 정확합니다. 각 방향의 치수와 야훼의 성소가 그 중앙에 있다는 진술은 유지했습니다. 북쪽의 ‘길이’는 히브리어에서 생략되어 있으나 남쪽 및 전체 구획 묘사에 비추어 자연스럽게 보충할 수 있습니다.
