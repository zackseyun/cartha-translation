base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/010.yaml
  text: 'And for these[a], the holy contribution shall belong to the priests: on the north, twenty-five thousand in length; on the west, ten thousand in width; on the east, ten thousand in width; and on the south, twenty-five thousand in length[b]; and the sanctuary of Yahweh shall be in its midst.'
  footnotes:
  - marker: a
    text: Or 'the sacred district' or 'the consecrated offering'; Hebrew 'the holy contribution,' a set-apart portion assigned for sacred use.
    reason: lexical_alternative
  - marker: b
    text: Or 'on the north, twenty-five thousand'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 제사장들에게는 거룩한 봉헌물[a]이 돌아갈 것입니다. 북쪽은 길이 이만 오천, 서쪽은 너비 일만, 동쪽은 너비 일만, 남쪽은 길이 이만 오천이며, 야훼의 성소는 그 한가운데에 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 구역’ 또는 ‘거룩하게 구별된 봉헌물’. 히브리어 ‘거룩한 봉헌물’은 제의적 용도를 위해 구별된 몫을 가리키며, 여기서는 토지 구획을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  english_pob_choice: And for these
  chosen_korean: 이것들에 대하여는
  alternatives_korean:
  - 이것들에
  - 이것들에게는
  lexicon: HALOT
  rationale: 지시대명사와 ל의 배분/귀속 용법을 살려, 이어지는 토지 배분 문맥에 맞게 ‘대하여는’으로 자연스럽게 옮겼습니다.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  english_pob_choice: the holy contribution
  chosen_korean: 거룩한 봉헌물
  alternatives_korean:
  - 거룩한 기여물
  - 거룩한 헌물
  - 거룩한 구역
  lexicon: HALOT
  rationale: תְּרוּמָה의 제의적 ‘봉헌/거제’ 의미를 살리면서, 본문이 땅 분배를 가리키므로 공간적 ‘구역’만으로 좁히지 않고 제의성과 분배성을 함께 드러내는 표현을 택했습니다.
- source_word: לַכֹּהֲנִים
  english_pob_choice: shall belong to the priests
  chosen_korean: 제사장들에게 속할 것이니
  alternatives_korean:
  - 제사장들을 위한 것이니
  - 제사장들에게 주어질 것이니
  lexicon: HALOT
  rationale: 여격의 수혜자 의미를 한국어에서 가장 분명하게 드러내기 위해 소유/귀속을 나타내는 ‘속하다’를 사용했습니다.
- source_word: מִקְדַּשׁ יְהוָה
  english_pob_choice: the sanctuary of Yahweh
  chosen_korean: 야훼의 성소
  alternatives_korean:
  - 야훼의 성막
  - 야훼의 성전
  lexicon: HALOT
  rationale: מִקְדָּשׁ은 ‘성소/성역’이 기본값이므로, 후대 성전 개념으로 좁히지 않고 ‘성소’로 옮겼습니다.
- source_word: בְּתוֹכֹו
  english_pob_choice: in its midst
  chosen_korean: 그 한가운데에
  alternatives_korean:
  - 그 가운데에
  - 그 중심에
  lexicon: HALOT
  rationale: 중심 배치를 나타내는 공간 표지를 현대 한국어에서 가장 자연스럽고 분명하게 드러내는 표현입니다.
theological_decisions:
