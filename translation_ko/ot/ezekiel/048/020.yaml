    issue: רְבִיעִית를 본문에서 단정적으로 ‘도시의 소유의 한 사분의 일’로 번역함
    rationale: 이 구절에서는 ‘정사각형으로/foursquare’라는 공간적 이해가 강하며, 도시의 소유지가 그 분수의 소유자라는 뜻도 히브리어에 없습니다. 분수적 해석은 가능한 대안으로 주석에 보존하는 것이 안전합니다.
  - severity: high
