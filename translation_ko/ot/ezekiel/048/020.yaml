  lexicon: HALOT
  rationale: 이 문맥은 제사 제물보다 땅의 구획으로 떼어 내는 몫을 가리키므로, 한국어로는 제의적 오해를 줄이면서도 ‘구별하여 드린 몫’의 의미를 살릴 수 있는 예물이 적절합니다.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף ... בַּחֲמִשָּׁה וְעֶשְׂרִים אָלֶף
  english_pob_choice: twenty-five thousand by twenty-five thousand
  chosen_korean: 이만오천 곱하기 이만오천
  alternatives_korean:
  - 이만오천 곱하기 이만오천 규빗
  - 이만오천 대 이만오천
  lexicon: HALOT
  rationale: 본문 자체에는 단위가 반복되지 않으므로, 수치의 가로세로 치수를 자연스럽게 옮기되 단위는 주석으로만 처리하는 POB의 처리 방침을 따랐습니다.
- source_word: רְבִיעִית
  english_pob_choice: as a quarter of
  chosen_korean: 한 사분의 일
  alternatives_korean:
  - 네모난 부분으로
  - 사분의 일로
  lexicon: HALOT
  rationale: 문맥과 POB의 최종 판정에 따라 이 형식을 ‘사분의 일’로 이해하는 편이 가장 직접적이며, ‘네모난’은 이 절의 문법적 관계를 충분히 반영하지 못합니다.
- source_word: אֶל אֲחֻזַּת הָעִיר
  english_pob_choice: the city's property
  chosen_korean: 도시의 소유
  alternatives_korean:
  - 도시의 소유지
