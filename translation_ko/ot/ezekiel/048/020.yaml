translation:
  language: ko
  text: 전체 봉헌 구획은 가로 이만 오천, 세로 이만 오천[a]이 될 것입니다. 여러분은 도시의 소유지와 함께 거룩한 봉헌 구획을 정사각형으로 구별하여 두십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘이만 오천 규빗에 이만 오천 규빗.’ 주변 문맥에서 단위를 보충한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 רְבִיעִית는 ‘한 사분의 일로’로 이해될 수도 있습니다. 그러나 이 절의 치수 표현과 문맥상 ‘정사각형으로’라는 뜻이 유력합니다.
    reason: alternative_reading
