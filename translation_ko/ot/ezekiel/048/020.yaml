translation:
  language: ko
  text: 전체 예물은 이만오천 곱하기 이만오천[a]이 될 것이며, 당신들은 거룩한 예물을 도시의 소유의 한 사분의 일[b]로 구분하여 바쳐야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘이만오천 규빗 곱하기 이만오천 규빗’으로 옮길 수 있습니다. 주변 문맥의 단위를 보충한 해석입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘당신들은 거룩한 예물을 도시의 소유를 위한 한 사분의 일로 구분하여 바쳐야 합니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: תְּרוּמָה / תְּרוּמַת
  english_pob_choice: contribution / contribution
  chosen_korean: 예물
  alternatives_korean:
