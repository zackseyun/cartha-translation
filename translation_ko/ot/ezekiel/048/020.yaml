  lexicon: HALOT
  rationale: אֲחֻזָּה는 소유된 토지/지분을 뜻하므로, 자연스러운 현대 한국어로 ‘소유’라고 옮기되, ‘점유지’처럼 더 기술적인 표현은 문맥상 과도합니다.
theological_decisions:
- issue: רְבִיעִית의 공간적/분수적 이해
  chosen_reading: 이 절에서는 ‘한 사분의 일’로 옮겨, 거룩한 예물이 도시의 소유와 관련해 전체 몫의 1/4에 해당함을 드러냈습니다.
  alternative_readings:
  - 네모난 부분
  - 사각형 몫
  rationale: 이전 수정안의 ‘square’는 문맥상 분수적 분배보다 형태를 강조해 오해를 낳을 수 있으므로, 본문이 말하는 배분 관계를 우선해 분수로 처리했습니다.
  doctrine_reference: Ezekiel 48 land allotment; lexical-context decision
