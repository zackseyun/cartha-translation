revisions:
- from: 남아 있는 다섯 천 규빗은 너비로, 곧 스물다섯 천의 면을 따라 그 도시를 위한 일반 땅이 됩니다. 그것은 거주지와 빈터를 위한 것이며, 도시는 그 한가운데에 있습니다.[a][b][c]
  to: 너비로 남은 오천은 스물다섯 천을 따라 도시를 위한 일반 땅이 될 것입니다.[a] 곧 주거지와 공터를 위한 땅입니다.[b][c] 도시는 그 한가운데에 있을 것입니다.
  rationale: 문장을 원문의 토지 배분 순서에 맞추어 다듬고, 불자연스러운 ‘수량의 면’ 표현을 제거했습니다. ‘공터’로 מִגְרָשׁ의 열린 공간이라는 의미 범위를 더 잘 보존했으며, 각주 표지를 해당 어휘 뒤에 배치했습니다. ‘스물다섯 천’의 단위는 이 절에서 명시되지 않으므로 본문에 보충하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:47:39Z'
