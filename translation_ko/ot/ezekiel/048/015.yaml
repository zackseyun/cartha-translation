source:
  edition: WLC
  text: וַ/חֲמֵ֨שֶׁת אֲלָפִ֜ים הַ/נּוֹתָ֣ר בָּ/רֹ֗חַב עַל פְּנֵ֨י חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף חֹֽל ה֣וּא לָ/עִ֔יר לְ/מוֹשָׁ֖ב וּ/לְ/מִגְרָ֑שׁ וְ/הָיְתָ֥ה הָ/עִ֖יר ב/תוכ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/015.yaml
  text: And the remaining five thousand in width[a], along the face of the twenty-five thousand, shall be common land for the city, for dwelling, and for open land[c][b]; and the city shall be in its midst.
  footnotes:
  - marker: a
    text: Or 'alongside the twenty-five thousand.' The Hebrew phrase literally reads 'along the face of,' a spatial expression that can be rendered in several close ways.
    reason: lexical_alternative
  - marker: b
    text: '''Common land'' renders a Hebrew term meaning land that is not holy or sacred, in contrast to the consecrated allotments described around it.'
    reason: cultural_note
  - marker: c
    text: Or 'open land' may be understood as land around the city for common use, possibly including pastureland.
    reason: lexical_alternative
translation:
  language: ko
  text: 너비로 남은 오천은 스물다섯 천을 따라 도시를 위한 일반 땅이 될 것입니다.[a] 곧 주거지와 공터를 위한 땅입니다.[b][c] 도시는 그 한가운데에 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스물다섯 천을 따라’는 히브리어의 ‘…의 앞면을 따라’를 옮긴 것입니다. 이 표현은 측량된 구역을 따라 나란히 펼쳐지는 공간 관계를 나타내며, 정확한 배치 방향은 단정하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘일반 땅’은 거룩하거나 성별된 땅과 구별되는, 성별되지 않은 땅을 뜻합니다.
    reason: cultural_note
  - marker: c
    text: ‘공터’는 도시 주변의 열린 땅을 뜻하며, 경우에 따라 목초지를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר
  english_pob_choice: the remaining
  chosen_korean: 남아 있는
  alternatives_korean:
  - 남은
  - 나머지
  lexicon: HALOT
  rationale: 남아 있는은 남은 땅이라는 의미를 자연스럽게 전하면서도, 앞선 분배 후에 ‘남아’ 있는 몫이라는 수량·배분 감각을 살립니다.
- source_word: בָּרֹחַב
  english_pob_choice: in width
  chosen_korean: 너비로
  alternatives_korean:
  - 너비에
  - 폭으로
  lexicon: HALOT
  rationale: רֹחַב은 폭/너비를 뜻하므로, 측량 맥락에 맞게 ‘너비로’라고 옮겨 문장 흐름을 자연스럽게 했습니다.
- source_word: עַל פְּנֵי
  english_pob_choice: along the face of
  chosen_korean: 스물다섯 천의 면을 따라
  alternatives_korean:
  - 스물다섯 천에 따라
  - 스물다섯 천을 따라
  - 스물다섯 천 옆으로
  lexicon: HALOT
  rationale: 직역하면 ‘면 위/앞에’이지만, 지리·측량 표현으로는 ‘면을 따라’가 원문의 공간적 방향성을 비교적 가깝게 보존합니다.
- source_word: חֹל
  english_pob_choice: common land
  chosen_korean: 일반 땅
  alternatives_korean:
  - 공용 땅
  - 속되지 않은 땅
  - 속된 땅
  lexicon: HALOT
  rationale: חֹל은 거룩한 땅과 대비되는 ‘성별되지 않은, 보통의’ 성격을 가리키므로, 교회적 어감이 강한 ‘공용’보다 중립적인 ‘일반 땅’이 문맥상 안전합니다.
- source_word: וּלְמִגְרָשׁ
  english_pob_choice: and for open land
  chosen_korean: 빈터를 위한
  alternatives_korean:
  - 공터를 위한
  - 빈 땅을 위한
  - 목초지를 위한
  lexicon: HALOT
  rationale: מִגְרָשׁ는 도시 주변의 열린 공간을 뜻할 수 있으므로, 도시 배치 문맥에서는 ‘빈터’가 가장 압축적으로 그 기능을 드러냅니다.
theological_decisions:
