revisions:
- from: 그리고 남은 것은 왕에게 속합니다. 거룩한 구역과 성읍의 소유물 양쪽에, 곧 동쪽 경계에 이르는 거룩한 구역의 이만오천과 나란히, 서쪽으로도 이만오천과 나란히, 왕에게 주어진 몫과 마주합니다. 거룩한 구역과 성전의 성소는 그 한가운데에 있습니다.[a]
  to: 거룩한 봉헌 구역과 성읍의 소유지 양쪽에 남은 땅은 군주의 것입니다. 그것은 동쪽 경계까지 봉헌 구역의 이만오천[a]에 마주하고, 서쪽으로는 서쪽 경계까지 이만오천에 마주하여, 각 몫에 상응하는 땅입니다. 이것은 군주를 위한 것입니다. 거룩한 봉헌 구역과 성전 성소는 그 가운데에 있습니다.
  rationale: '''군주''를 사용하여 נָשִׂיא의 의미 범위를 보존했습니다. 남은 땅이 거룩한 봉헌 구역과 성읍 소유지의 양쪽에 놓이고, 동·서쪽의 이만오천 구획에 대응한다는 원문의 공간 서술을 명료하게 재현했습니다. 측량 단위는 원문이 이 절에서 밝히지 않으므로 본문에 보충하지 않았습니다.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:47:40Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. נָשִׂיא는 에스겔 45–48장의 정해진 직함으로, '왕'은 원문보다 강한 왕정적 의미를 더합니다. 또한 원문의 반복되는 공간 관계와 마지막의 '군주를 위한' 귀결이 초안에서는 '왕에게 주어진 몫과 마주합니다'로 바뀌어 문법적·의미적 연결이 흐려졌습니다. 성소는 '성전의 성소'가 아니라 '성전의 성소/성전의 성전소'가 아니라 원문의 מִקְדַּשׁ הַבַּיִת에 맞춰 '성전의 성소'로 번역할 수 있으나, '성전의 성소'는 반복적이므로 '성전 성소'로 처리했습니다.
  naturalness: 초안은 '성읍의 소유물 양쪽에'와 '왕에게 주어진 몫과 마주합니다'의 수식 관계가 불분명합니다. 문장을 토지 경계 서술에 맞게 재구성하고, '소유물'은 토지 문맥에 자연스러운 '소유지'로 고쳤습니다.
  terminology: נָשִׂיא는 '군주'로, תְּרוּמַת הַקֹּדֶשׁ는 토지로 드려진 몫이라는 뜻을 보존하는 '거룩한 봉헌 구역'으로 통일했습니다. 원문에 명시되지 않은 측량 단위는 본문에 보충하지 않고 각주로 밝혔습니다.
  issues:
  - severity: medium
    issue: נָשִׂיא를 '왕'으로 번역함
    rationale: 원어는 일반적으로 '지도자, 군주, 방백'을 뜻하며, 이 문맥에서 반드시 왕을 뜻한다고 단정할 수 없습니다. '군주'가 직함의 위상은 살리면서도 과도한 특정화를 피합니다.
  - severity: high
    issue: 토지의 공간 관계 및 군주에게 귀속되는 결론이 불명확함
    rationale: 원문은 동쪽과 서쪽의 이만오천 단위 구획에 대응하는 남은 땅이 군주를 위한 것임을 말합니다. 초안의 '왕에게 주어진 몫과 마주합니다'는 원문의 관계를 다른 대상으로 바꾸고 문장도 부자연스럽습니다.
  - severity: medium
    issue: 이만오천의 단위가 생략된 사실에 관한 각주가 없음
    rationale: 원문은 이 절에서 단위를 명시하지 않습니다. 영어 POB 감사 기록의 관련 각주 취지를 보존하여, 번역이 임의로 단위를 확정하지 않았음을 밝혀야 합니다.
