base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/021.yaml
  text: And what remains shall belong to the prince[a], on both sides of the holy contribution and of the city's property, alongside the twenty-five thousand of the contribution as far as the eastern border, and westward alongside the twenty-five thousand toward the western border, parallel to the portions for the prince. And the holy contribution and the sanctuary of the temple shall be in its midst.
  footnotes:
  - marker: a
    text: Hebrew simply reads 'twenty-five thousand'; the unit is understood from the surrounding context of Ezekiel's land measurements.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 남은 것은 왕에게 속합니다. 거룩한 구역과 성읍의 소유물 양쪽에, 곧 동쪽 경계에 이르는 거룩한 구역의 이만오천과 나란히, 서쪽으로도 이만오천과 나란히, 왕에게 주어진 몫과 마주합니다. 거룩한 구역과 성전의 성소는 그 한가운데에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩한 구역’은 히브리어 תְּרוּמָה(드려진 몫)를 토지 분배 문맥에 맞게 풀어 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: וְהַנּוֹתָר
  english_pob_choice: And what remains
  chosen_korean: 그리고 남은 것은
  alternatives_korean:
  - 그리고 남은 것
  - 그리고 나머지
  lexicon: HALOT
  rationale: 남은 몫이라는 실질적 의미를 살리면서, 문맥상 토지 분배의 잔여분이라는 점을 자연스럽게 드러냅니다.
- source_word: לַנָּשִׂיא
  english_pob_choice: shall belong to the prince
  chosen_korean: 왕에게 속합니다
  alternatives_korean:
  - 군주에게 속합니다
  - 지도자에게 속합니다
  lexicon: HALOT
  rationale: 에스겔 후반부의 נָשִׂיא는 단순한 통치자를 넘어 공동체의 대표적 통치자를 가리키므로, 한국어에서는 독자에게 의미가 분명한 '왕'보다도 군주적 지위를 드러내는 표현을 택했습니다. 다만 본문 전체의 통치자 개념을 살리기 위해 '속합니다'로 소유 관계를 분명히 했습니다.
- source_word: מִזֶּה וּמִזֶּה
  english_pob_choice: on both sides
  chosen_korean: 양쪽에
  alternatives_korean:
  - 이쪽저쪽에
  - 좌우 양편에
  lexicon: HALOT
  rationale: 성소와 성읍 구역을 사이에 둔 좌우 배치를 간결하게 나타내는 한국어 표현입니다.
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  english_pob_choice: of the holy contribution
  chosen_korean: 거룩한 구역
  alternatives_korean:
  - 거룩한 헌물
  - 거룩한 봉헌 구역
  lexicon: HALOT
  rationale: תְּרוּמָה는 문자적으로 '드림/봉헌'이지만, 에스겔 45–48장에서는 땅으로 구별된 성별 구역을 가리키므로, 한국어에서는 기능을 드러내는 '구역'을 사용했습니다.
- source_word: וְלַאֲחֻזַּת הָעִיר
  english_pob_choice: and of the city's property
  chosen_korean: 성읍의 소유물
  alternatives_korean:
  - 성읍의 소유지
  - 성읍의 재산
  lexicon: HALOT
  rationale: אֲחֻזָּה는 소유지/소유물을 뜻하므로, 여기서는 성읍에 속한 토지라는 점을 드러내는 '소유물'이 적절합니다.
- source_word: בְּתוֹכָהּ
  english_pob_choice: in its midst
  chosen_korean: 그 한가운데에
  alternatives_korean:
  - 그 가운데에
  - 그 중앙에
  lexicon: HALOT
  rationale: 여성형 지시대명사가 앞의 거룩한 구역을 가리키므로, 공간적 중심을 자연스럽게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: נָשִׂיא의 지위 번역
  chosen_reading: 에스겔의 땅 분배 문맥에서 נָשִׂיא를 공동체의 통치적 대표로 보고, 한국어 본문에서는 '왕'으로 옮겨 위계를 분명히 했습니다.
  alternative_readings:
  - 군주
  - 지도자
  - 통치자
  rationale: 이 절은 땅의 경계와 몫을 배분하는 행정적·통치적 문맥이므로, 추상적 직함보다 실제 권한을 드러내는 번역이 독자의 이해에 더 직접적입니다. 다만 전통적 메시아적 해석을 강요하지 않기 위해 주석 수준의 해석을 본문에 과도하게 넣지는 않았습니다.
  doctrine_reference: Ezekiel 45–48 temple allotment; civic ruler motif
