  source_fidelity: 히브리어의 경계 공식과 지명 연쇄는 대체로 반영했지만, נַחֲלָה에는 본절에서 명시되지 않은 ‘이집트’를 본문에 보충해서는 안 됩니다. 또한 מֵי는 한국어에서 부자연스러운 ‘물들’보다 집합명사 ‘물’로 옮기는 편이 충실하고 자연스럽습니다.
  naturalness: ‘갓의 경계 곁’은 경계가 어디를 따라 이어지는지를 어색하게 표현하며, ‘남쪽으로 향하는 남쪽 변’도 중복이 부자연스럽습니다. ‘갓의 경계를 따라, 남쪽 변 곧 남쪽으로’는 반복된 남쪽 방향을 보존하면서 경계 기술 문체에 더 자연스럽습니다.
  terminology: ‘갓’, ‘다말’, ‘메리밧-가데스’, ‘와디’, ‘큰 바다’는 유지할 수 있습니다. 다만 ‘메리바-가데스’는 영어 전통이라는 설명보다, 더 익숙한 지명 표기라는 중립적 설명이 적절합니다. ‘이집트 와디’는 본절에 없는 지리적 식별을 추가하므로 삭제합니다.
