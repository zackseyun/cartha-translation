id: EZK.48.28
reference: Ezekiel 48:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַל֙ גְּב֣וּל גָּ֔ד אֶל פְּאַ֖ת נֶ֣גֶב תֵּימָ֑נָ/ה וְ/הָיָ֨ה גְב֜וּל מִ/תָּמָ֗ר מֵ֚י מְרִיבַ֣ת קָדֵ֔שׁ נַחֲלָ֖ה עַל הַ/יָּ֥ם הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/028.yaml
  text: And along the border of Gad[a], on the south side southward, the border shall run from Tamar to the waters of Meribath-kadesh, to the Wadi of Egypt[b], and on to the Great Sea.
  footnotes:
  - marker: a
    text: Meribath-kadesh may also be rendered 'Meribah-kadesh,' the more familiar form of the place name in English translations.
    reason: lexical_alternative
  - marker: b
    text: Or 'the brook of Egypt.' The Hebrew term can denote a wadi or streambed; 'wadi' is used here to avoid suggesting a perennial brook.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 갓의 경계 곁, 남쪽으로 향하는 남쪽 변에서 그 경계는 다말에서 메리밧-가데스의 물들에 이르고, 이집트 와디에 이르러, 큰 바다에 이릅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘메리밧-가데스’는 영어 전통의 더 익숙한 ‘메리바-가데스’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘와디’는 상시적 하천이 아니라 마른 하천바닥까지 포함할 수 있는 계절성 물길을 가리키므로, 단순히 ‘시내’로 옮기지 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל גְּבוּל גָּד
  english_pob_choice: And along the border of Gad
  chosen_korean: 그리고 갓의 경계 곁
  alternatives_korean:
  - 그리고 갓의 경계에
  - 갓의 경계를 따라
  lexicon: HALOT
  rationale: 경계 목록의 도입부로서 ‘곁’은 단순한 소유보다 경계선에 접한 위치감을 살리며, ‘갓의 경계’를 자연스러운 관용으로 옮겼습니다.
- source_word: אֶל פְּאַת נֶגֶב תֵּימָנָה
  english_pob_choice: on the south side southward
  chosen_korean: 남쪽으로 향하는 남쪽 변
  alternatives_korean:
  - 남쪽 변에서 남쪽으로
  - 남쪽 편 남쪽으로
  lexicon: HALOT
  rationale: 겹쳐 나온 남쪽 방향 표현을 둘 다 살리기 위해 ‘남쪽 변’과 ‘남쪽으로 향하는’을 함께 두어, 단순히 ‘남쪽’으로 평평하게 만들지 않았습니다.
- source_word: וְהָיָה גְבוּל
  english_pob_choice: the border shall run
  chosen_korean: 그 경계는 … 이릅니다
  alternatives_korean:
  - 그 경계는 … 됩니다
  - 그 경계는 … 가집니다
  lexicon: HALOT
  rationale: 히브리어의 경계 공식은 한국어에서 선의 진행을 나타내는 동사로 옮기는 것이 자연스럽고, 여기서는 종착점 나열의 흐름을 살려 ‘이릅니다’로 번역했습니다.
- source_word: מֵי מְרִיבַת קָדֵשׁ
  english_pob_choice: the waters of Meribath-kadesh
  chosen_korean: 메리밧-가데스의 물들
  alternatives_korean:
  - 메리바트-가데스의 물들
  - 메리밧-가데스 물
  lexicon: HALOT
  rationale: 지명성을 유지하기 위해 음역을 따랐고, 복수형 ‘물들’은 히브리어 복수형과 경계 지점을 가리키는 표현을 함께 반영합니다.
- source_word: נַחֲלָה
  english_pob_choice: the Wadi of Egypt
  chosen_korean: 이집트 와디
  alternatives_korean:
  - 와디
  - 이집트 시내
  lexicon: HALOT
  rationale: 문맥상 נחל은 상시적 개천이 아니라 와디를 가리키므로 ‘와디’를 사용했고, 영어 POB의 판정에 따라 지리적 식별을 위해 ‘이집트’를 보존했습니다.
- source_word: הַיָּם הַגָּדוֹל
  english_pob_choice: the Great Sea
  chosen_korean: 큰 바다
  alternatives_korean:
  - 대바다
  - 지중해
  lexicon: HALOT
  rationale: 직역에 가까운 ‘큰 바다’로 옮겨, 히브리어의 전통적 해안 경계 명칭을 한국어에서도 그대로 드러냈습니다.
theological_decisions:
- issue: 경계 예언의 문체
  chosen_reading: 미래형이 아니라 경계 배치를 선언하는 현재적·공식적 문장으로 읽어 한국어도 서술적 확정형을 유지했습니다.
  alternative_readings:
  - 미래형 중심의 예언문으로 옮김
  - 과거 서술형으로 처리
  rationale: 히브리어 경계 공식은 실제 지리 설명과 선언적 예언이 겹친 문맥이므로, 한국어에서도 ‘이릅니다’로 흐름을 살리되 과도한 미래 시제를 피했습니다.
  doctrine_reference: Ezekiel의 토지 분배 환상 본문; 본문 장르의 선언적 공식
