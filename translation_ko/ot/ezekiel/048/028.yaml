base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/028.yaml
  text: And along the border of Gad[a], on the south side southward, the border shall run from Tamar to the waters of Meribath-kadesh, to the Wadi of Egypt[b], and on to the Great Sea.
  footnotes:
  - marker: a
    text: Meribath-kadesh may also be rendered 'Meribah-kadesh,' the more familiar form of the place name in English translations.
    reason: lexical_alternative
  - marker: b
    text: Or 'the brook of Egypt.' The Hebrew term can denote a wadi or streambed; 'wadi' is used here to avoid suggesting a perennial brook.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 갓의 경계를 따라, 남쪽 변 곧 남쪽으로, 그 경계는 다말에서 메리밧-가데스의 물[a]까지, 와디[b]를 거쳐 큰 바다까지 이어집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘메리밧-가데스’는 더 익숙한 지명 형태인 ‘메리바-가데스’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘시내’. 히브리어 낱말은 상시적으로 흐르는 하천뿐 아니라 마른 하천바닥을 포함한 계절성 물길을 가리킬 수 있으므로, 여기서는 ‘와디’로 옮겼습니다.
    reason: lexical_alternative
