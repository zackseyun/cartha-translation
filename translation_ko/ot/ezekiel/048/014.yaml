  source_fidelity: ‘땅의 첫 열매’는 רֵאשִׁית הָאָרֶץ를 농산물의 첫 수확으로 좁혀 이해하게 하므로, 성별된 토지 몫을 가리키는 문맥에 맞지 않을 수 있습니다. 또한 יעבור는 본문에 명시되지 않은 목적지인 ‘다른 데로’를 덧붙이지 않고 소유의 이전을 나타내는 표현으로 옮기는 것이 더 충실합니다.
  naturalness: ‘그것의 어떤 것도’보다 ‘그것 가운데 아무것도’가 자연스럽습니다. ‘넘겨져서는 안 됩니다’는 법률적 금지 문맥에서 자연스럽고, 원문의 수동적·비인칭적 이전 이미지를 유지합니다.
  terminology: יהוה는 프로젝트 방침에 따라 ‘야훼’로 유지합니다. קֹדֶשׁ לַיהוָה는 ‘야훼께 속한 거룩한 것’으로 옮겨 거룩함과 헌정·귀속을 함께 드러냅니다. רֵאשִׁית הָאָרֶץ는 본문상 ‘첫 열매’로 단정하지 않고 ‘땅의 첫 몫’으로 번역하며 각주에서 가능한 의미 범위를 보존합니다.
