translation:
  language: ko
  text: 그것 가운데 아무것도 팔아서는 안 되며, 바꾸어서도 안 됩니다. 또 땅의 첫 몫[a]은 넘겨져서는 안 됩니다. 이는 야훼께 속한 거룩한 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅의 첫 몫’(רֵאשִׁית הָאָרֶץ)은 ‘땅의 첫 부분’, ‘땅의 으뜸 부분’ 또는 첫 열매와 같은 성별된 몫을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יִמְכְּרוּ מִמֶּנּוּ
  english_pob_choice: They must not sell any of it
  chosen_korean: 그것의 어떤 것도 팔아서는 안 되며
  alternatives_korean:
  - 그것을 조금이라도 팔아서는 안 되며
  - 그것의 일부라도 팔아서는 안 되며
  lexicon: HALOT
  rationale: מכר의 기본 법적 의미를 살려 ‘팔다’로 옮기고, מִמֶּנּוּ는 한국어 자연성에 맞게 ‘어떤 것도’로 처리해 금지의 범위를 분명히 했습니다.
- source_word: וְלֹא יָמֵר
  english_pob_choice: nor exchange it
  chosen_korean: 바꾸어서도 안 됩니다
  alternatives_korean:
  - 교환해서도 안 됩니다
  - 맞바꾸어서도 안 됩니다
  lexicon: HALOT
  rationale: מוּר의 ‘바꾸다/교환하다’ 의미를 살려, 재산·성물 금지 문맥에서 자연스러운 ‘바꾸다’로 옮겼습니다.
- source_word: וְלֹא יעבור רֵאשִׁית הָאָרֶץ
  english_pob_choice: nor shall this choice portion of the land pass over to another
  chosen_korean: 또 이 땅의 첫 열매는 다른 데로 넘어가게 해서는 안 됩니다
  alternatives_korean:
  - 또 이 땅의 첫 부분은 다른 데로 넘어가게 해서는 안 됩니다
  - 또 이 땅의 첫 몫은 다른 데로 넘어가게 해서는 안 됩니다
  lexicon: HALOT
  rationale: רֵאשִׁית הָאָרֶץ를 POB의 재검토 취지에 맞춰 ‘첫 열매’로 옮겨, 성별된 ‘첫 몫/첫 부분’과 제의적 ‘첫 열매’의 울림을 함께 살렸습니다; יעבור는 소유 이전의 이미지를 살려 ‘넘어가게 하다’로 표현했습니다.
- source_word: כִּי קֹדֶשׁ לַיהוָה
  english_pob_choice: for it is holy to Yahweh
  chosen_korean: 그것은 야훼께 거룩하기 때문입니다
  alternatives_korean:
  - 그것은 야훼께 성별되었기 때문입니다
  - 그것은 야훼께 거룩한 것이기 때문입니다
  lexicon: HALOT
  rationale: קֹדֶשׁ을 상태 진술로서 ‘거룩하다’로 옮기고, לַיהוָה는 전용·귀속의 뜻을 살려 ‘야훼께’로 처리했습니다.
theological_decisions:
