  rationale: 본문의 신명기적 거룩함 선언을 유지하기 위해, 전통적 대체어 ‘주님’이 아니라 고유 신명사 표기 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
