  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/כֹּהֲנִ֤ים הַֽ/מְקֻדָּשׁ֙ מִ/בְּנֵ֣י צָד֔וֹק אֲשֶׁ֥ר שָׁמְר֖וּ מִשְׁמַרְתִּ֑/י אֲשֶׁ֣ר לֹֽא תָע֗וּ בִּ/תְעוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֥ר תָּע֖וּ הַ/לְוִיִּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/011.yaml
  text: It shall be for the priests who are consecrated from the sons of Zadok[a], who kept my charge, who did not go astray when the sons of Israel went astray[c][b], as the Levites went astray.
  footnotes:
  - marker: a
    text: Or 'from among the descendants of Zadok.'
    reason: lexical_alternative
  - marker: b
    text: '''Kept my charge'' refers to faithfully carrying out the duty entrusted by God, especially in priestly service.'
    reason: cultural_note
  - marker: c
    text: Or 'when the people of Israel went astray.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 사독의 자손 가운데서 구별된 제사장들에게 속할 것입니다. 그들은 내 직분을 지켰고, 이스라엘 자손이 그릇되었을 때에 그들처럼 그릇되지 않았습니다. 레위인들도 그처럼 그릇되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사독의 자손들 가운데서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכֹּהֲנִים
  english_pob_choice: for the priests
  chosen_korean: 제사장들에게 속할 것입니다
  alternatives_korean:
  - 제사장들을 위한 것입니다
  - 제사장들에게 돌아갈 것입니다
  lexicon: HALOT
  rationale: ל 접두사는 이 분배 문맥에서 소유/배당의 방향을 나타내므로, 한국어에서는 ‘속할 것입니다’로 자연스럽게 풀어 주어 배정 의미를 살렸습니다.
- source_word: הַמְקֻדָּשׁ
  english_pob_choice: who are consecrated
  chosen_korean: 구별된
  alternatives_korean:
  - 성별된
  - 거룩한
  - 성화된
  lexicon: HALOT
  rationale: קדש의 수동 분사로서 제의적 구별을 가리키므로, ‘구별된’이 종교적 숭고어를 과도하게 덧씌우지 않으면서도 의미를 분명히 드러냅니다.
- source_word: שָׁמְרוּ מִשְׁמַרְתִּי
  english_pob_choice: kept my charge
  chosen_korean: 내 직분을 지켰고
  alternatives_korean:
  - 내 명령을 지켰고
  - 내 맡기신 책임을 지켰고
  - 내 소임을 지켰고
  lexicon: HALOT
  rationale: 이 결합은 단순한 ‘명령’보다 맡겨진 제의적 책무를 뜻하므로, POB의 의미를 살려 ‘직분’으로 옮겼습니다.
- source_word: בִּתְעוֹת בְּנֵי יִשְׂרָאֵל / כַּאֲשֶׁר תָּעוּ הַלְוִיִּם
  english_pob_choice: when the sons of Israel went astray ... as the Levites went astray
  chosen_korean: 이스라엘 자손이 그릇되었을 때에 ... 레위인들도 그처럼 그릇되었습니다
  alternatives_korean:
  - 이스라엘 자손이 타락했을 때에 ... 레위인들도 타락했습니다
  - 이스라엘 자손이 빗나갔을 때에 ... 레위인들도 빗나갔습니다
  lexicon: HALOT
  rationale: תעה는 여기서 물리적 이동보다 도덕·제의적 일탈을 가리키므로, 한국어에서 자연스럽고 문맥에 맞는 ‘그릇되다’로 옮겼습니다.
theological_decisions:
- issue: 사독의 자손과 레위인의 대비를 어떻게 드러낼지
  chosen_reading: 본문의 핵심은 혈통 자체보다, 사독 계열 제사장들의 충실함과 레위인들의 그릇됨을 대비시키는 데 있습니다.
  alternative_readings:
  - 단순히 ‘보상받는 충성’으로만 완화할 수 있습니다.
  - 혈통을 약화시켜 ‘사독의 후손 가운데서’로만 흐릴 수 있습니다.
  rationale: 히브리어는 ‘사독의 자손’이라는 계보와 ‘내 직분을 지킴’이라는 충실성을 함께 근거로 삼으므로, 둘 중 하나를 지우지 않고 함께 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
