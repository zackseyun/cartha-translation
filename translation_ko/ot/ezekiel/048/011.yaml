- from: 그것은 사독의 자손 가운데서 구별된 제사장들에게 속할 것입니다. 그들은 내 직분을 지켰고, 이스라엘 자손이 그릇되었을 때에 그들처럼 그릇되지 않았습니다. 레위인들도 그처럼 그릇되었습니다.[a]
  to: 그것은 사독의 자손에게서 나온[a] 성별된 제사장들에게 돌아갈 것입니다. 그들은 내가 맡긴 직무를 지켰고, 이스라엘 자손이 그릇된 길로 갈 때에도 레위인들이 그릇된 길로 갔던 것처럼 그릇된 길로 가지 않았습니다.
