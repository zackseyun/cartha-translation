  text: 단의 경계를 따라, 동쪽에서 서쪽[a]까지, 아셀의 몫은 하나입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘바다 쪽’이지만, 여기서 ‘바다’는 서쪽을 가리키는 방향어로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  english_pob_choice: And along
  chosen_korean: 경계 위로
  alternatives_korean:
  - 경계 곁에
  - 그리고 경계를 따라
  lexicon: HALOT
  rationale: 전치사와 접속을 살려 지파 몫의 배열을 이어 주는 위치 관계를 나타내며, 한국어에서는 ‘경계 위로’가 간결하게 방향성과 접촉을 함께 드러냅니다.
- source_word: גְּבוּל
  english_pob_choice: border
  chosen_korean: 경계
  alternatives_korean:
  - 변경
  - 영역
  lexicon: HALOT
  rationale: 이 문맥에서 גְּבוּל은 토지 분배의 경계선을 가리키므로, ‘경계’가 가장 직접적입니다.
- source_word: מִפְּאַת קָדִים / עַד פְּאַת יָמָּה
  english_pob_choice: from the eastern side ... to the western side
  chosen_korean: 동쪽에서 서쪽까지
  alternatives_korean:
  - 동쪽 끝에서 서쪽 끝까지
  - 동편에서 바다 편까지
  lexicon: HALOT
  rationale: פֵּאָה는 ‘쪽/변’의 의미를 가지며, יָמָּה는 여기서 서쪽 방향을 가리키므로, 한국어에서는 방향 대칭을 분명히 드러내는 표현이 자연스럽습니다.
- source_word: אֶחָד
  english_pob_choice: one portion
  chosen_korean: 한 몫
  alternatives_korean:
  - 한 분깃
  - 한 몫의 땅
  - 하나
  lexicon: HALOT
  rationale: 에스겔 48장의 반복 공식을 고려하면, 숫자 하나만이 아니라 지파에게 배당된 분량을 가리키므로 ‘몫’이 가장 압축적이면서도 분배 의미를 살립니다.
theological_decisions:
- issue: 서쪽 방향을 나타내는 יָמָּה의 처리
  chosen_reading: 지리적 서쪽 방향으로 풀어 번역했습니다.
  alternative_readings:
  - ‘바다 쪽으로’처럼 직역함
  - 주해 없이 ‘서쪽’만 적음
  rationale: 본문의 문맥은 분깃 배치의 방향 설명이므로, ‘바다’의 직역보다 의미 기능을 드러내는 ‘서쪽’이 독자 이해에 더 정확합니다.
  doctrine_reference: 본문 주해/지리 표현
