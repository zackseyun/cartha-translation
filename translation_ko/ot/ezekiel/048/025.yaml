source:
  edition: WLC
  text: וְ/עַ֣ל גְּב֣וּל שִׁמְע֗וֹן מִ/פְּאַ֥ת קָדִ֛ימָ/ה עַד פְּאַת יָ֖מָּ/ה יִשָׂשכָ֥ר אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/025.yaml
  text: And along the border of Simeon[a], from the east side to the west side, Issachar, one portion.
  footnotes:
  - marker: a
    text: Hebrew literally, 'from the side of the sea.' Here 'sea' functions as a standard Hebrew term for 'west.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 시므온의 경계에서, 동쪽에서 서쪽까지, 잇사갈, 한 몫입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַל
  english_pob_choice: And along
  chosen_korean: 그리고 …에서
  alternatives_korean:
  - 그리고 그 경계에
  - 그리고 …을 따라
  lexicon: HALOT
  rationale: 할당 목록의 연속을 나타내는 קשר로 처리해 한국어에서는 단순 접속사와 위치 표시로 자연스럽게 옮겼습니다.
- source_word: גְּבוּל
  english_pob_choice: border
  chosen_korean: 경계
  alternatives_korean:
  - 변경
  - 영역
  lexicon: HALOT
  rationale: 지파 분배의 선을 가리키므로 ‘경계’가 ‘영역’보다 원문에 더 가깝고, ‘변경’보다 현대 한국어에서 더 명확합니다.
- source_word: מִ/פְּאַת ... עַד פְּאַת ...
  english_pob_choice: from the east side to the west side
  chosen_korean: 동쪽에서 서쪽까지
  alternatives_korean:
  - 동쪽 변에서 서쪽 변까지
  - 동편에서 서편까지
  lexicon: HALOT
  rationale: פֵּאָה의 문자적 ‘변/쪽’ 의미를 살리되, 한국어에서는 방향 대조가 핵심이므로 간결하게 ‘동쪽에서 서쪽까지’로 옮겼습니다.
- source_word: אֶחָד
  english_pob_choice: one portion
  chosen_korean: 한 몫
  alternatives_korean:
  - 하나
  - 한 분깃
  lexicon: HALOT
  rationale: 문맥상 단순 수사 ‘하나’가 아니라 토지 분배 단위를 가리키므로, 반복되는 분깃 구문을 한국어의 ‘한 몫’으로 자연스럽게 살렸습니다.
