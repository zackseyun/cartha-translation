  yaml_path: translation/ot/ezekiel/048/025.yaml
  text: And along the border of Simeon[a], from the east side to the west side, Issachar, one portion.
  footnotes:
  - marker: a
    text: Hebrew literally, 'from the side of the sea.' Here 'sea' functions as a standard Hebrew term for 'west.'
