  rationale: 지시어로 시작하는 요약 선언이므로 한국어에서는 자연스럽게 주어-서술 구조를 보완해 ‘이것은 … 땅이며’로 옮겼습니다.
- source_word: תַּפִּילוּ מִנַּחֲלָה
  english_pob_choice: you shall assign as an inheritance
  chosen_korean: 유산으로 너희가 나눌
  alternatives_korean:
