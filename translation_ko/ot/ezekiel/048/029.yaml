  lexicon: HALOT
  rationale: 나눔/분배의 배경에 ‘상속받은 몫’의 의미가 있어, 현대 한국어에서 문맥이 살아나도록 ‘유산으로’와 ‘나눌’로 옮겼습니다.
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל
