  rationale: 분배의 수혜 대상을 직접적으로 표시하는 여격 구조이므로 ‘지파들에게’로 자연스럽게 처리했습니다.
- source_word: מַחְלְקוֹתָם
  english_pob_choice: their portions
  chosen_korean: 그들의 몫입니다
  alternatives_korean:
