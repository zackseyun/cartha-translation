  - 그들의 분배 몫입니다
  - 그들의 할당 몫입니다
  lexicon: HALOT
  rationale: POB가 ‘their portions’로 택한 것은 단순한 구획이 아니라 각 지파에게 배정된 몫이기 때문이므로, 한국어에서는 짧고 명료한 ‘몫’이 가장 적절합니다.
