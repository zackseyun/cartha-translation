  terminology: נַחֲלָה는 여기서 토지의 상속 재산/기업이라는 기능을 나타내므로 ‘유산’으로 유지할 수 있습니다. מַחְלְקוֹתָם은 단순 몫보다 배정·분배의 뉘앙스가 있으므로 ‘그들에게 배정된 몫’으로 명확히 했습니다. 신명 יהוה는 제시된 POB 방침에 따라 ‘야훼’로 표기합니다.
