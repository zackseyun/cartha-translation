revisions:
- from: 이제 이스라엘 지파들의 이름은 이렇습니다. 북쪽 끝에서, 헤돌론의 길을 따라 하맛 입구까지, 다메섹 경계의 북쪽, 하맛 곁에 이르기까지, 그리고 동쪽 편에서 바다에 이르기까지, 단, 한 몫입니다.[a][b]
  to: 지파들의 이름은 이렇습니다. 북쪽 끝에서부터 헤들론 길 곁으로 레보하맛[a], 하살에난, 다메섹의 북쪽 경계, 하맛 곁에 이르며, 동쪽 경계에서 바다까지가 단의 한 분깃입니다.[b]
  rationale: 누락된 하살에난을 복원하고, 헤들론의 음역을 바로잡았습니다. 레보하맛은 본문의 지명 나열을 보존하도록 음역하되 문자적 의미를 주석으로 옮겼습니다. 마지막 압축 구문은 단의 분깃이 동쪽 경계에서 바다까지 이어짐을 명료하게 하면서도 원문의 경계 목록 형식을 유지하도록 조정했습니다.
