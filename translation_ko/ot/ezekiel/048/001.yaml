base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/001.yaml
  text: 'Now these are the names of the tribes: from the northern extremity[a], beside the way of Hethlon to Lebo-hamath, Hazar-enan, at the border of Damascus northward beside Hamath, and extending from the east side to the sea, Dan[b], one portion.'
  footnotes:
  - marker: a
    text: Hebrew Lebo-hamath, traditionally understood as a place-name; literally, 'the entrance of Hamath.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and it shall have its side from east to sea'; the Hebrew clause is compressed and describes the east-to-west extent of Dan's allotment.
    reason: alternative_reading
translation:
  language: ko
  text: 지파들의 이름은 이렇습니다. 북쪽 끝에서부터 헤들론 길 곁으로 레보하맛[a], 하살에난, 다메섹의 북쪽 경계, 하맛 곁에 이르며, 동쪽 경계에서 바다까지가 단의 한 분깃입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘레보하맛’은 전통적으로 지명으로 이해됩니다. 문자적으로는 ‘하맛의 입구’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 문장은 압축되어 있습니다. 또는 ‘그것의 경계는 동쪽에서 바다까지이다’로 옮길 수 있으며, 단의 분깃이 동쪽에서 바다까지 뻗는다는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת הַשְּׁבָטִים
  english_pob_choice: Now these are the names of the tribes
  chosen_korean: 이제 이스라엘 지파들의 이름은 이렇습니다
  alternatives_korean:
  - 그리고 이스라엘 지파들의 이름은 이렇습니다
  - 이제 열두 지파의 이름은 이렇습니다
  lexicon: WLC / HALOT
  rationale: 목록 도입 표현으로 자연스러운 한국어를 택하되, ‘지파들’로 부족이 아니라 이스라엘의 지파 단위를 분명히 했습니다.
- source_word: מִקְצֵה צָפוֹנָה
  english_pob_choice: from the northern extremity
  chosen_korean: 북쪽 끝에서
  alternatives_korean:
  - 북쪽 극점에서
  - 북쪽 끝단에서
  lexicon: HALOT
  rationale: 경계 목록의 문맥상 ‘extremity’는 지리적 ‘끝’으로 간결하게 옮기는 것이 가장 자연스럽습니다.
- source_word: לְבוֹא חֲמָת
  english_pob_choice: to Lebo-hamath
  chosen_korean: 하맛 입구
  alternatives_korean:
  - 레보-하맛
  - 하맛으로 들어가는 곳
  lexicon: HALOT
  rationale: 본문의 장소명 기능을 살리면서도, 주석 전통이 지적하는 문자적 의미인 ‘하맛의 입구’를 드러냈습니다.
- source_word: אֶל יַד
  english_pob_choice: beside
  chosen_korean: 곁에
  alternatives_korean:
  - 옆에
  - 바로 곁에
  lexicon: HALOT
  rationale: 경계 기술에서 반복되는 관용구로, ‘옆에/곁에’가 ‘beside’의 공간적 인접성을 가장 압축적으로 전달합니다.
- source_word: וְהָיוּ לוֹ פְאַת קָדִים הַיָּם
  english_pob_choice: and extending from the east side to the sea
  chosen_korean: 그리고 동쪽 편에서 바다에 이르기까지
  alternatives_korean:
  - 그리고 동쪽 편에서 서쪽 바다에 이르기까지
  - 그리고 동쪽 변에서 바다까지
  lexicon: HALOT
  rationale: 압축된 히브리어를 한국어로 풀되, 동-서 범위를 나타내는 allotment 설명이라는 점을 유지했습니다.
- source_word: דָּן אֶחָד
  english_pob_choice: Dan, one portion
  chosen_korean: 단, 한 몫입니다
  alternatives_korean:
  - 단, 한 분깃입니다
  - 단, 한 몫의 땅입니다
  lexicon: HALOT
  rationale: 여기서 ‘one’은 지파의 몫/분깃을 가리키므로, ‘한 몫’이 가장 간결하면서도 분배 의미를 살립니다.
theological_decisions:
- issue: 지명 לְבוֹא חֲמָת의 처리
  chosen_reading: 본문에는 장소명처럼 기능하는 ‘하맛 입구’를 본문에 두고, 문자적 뜻을 보존했습니다.
  alternative_readings:
