  rationale: 지명으로 굳어진 전통을 무시하지 않되, 어원적 의미를 함께 드러내어 독자가 경계 표현의 성격을 이해하도록 했습니다.
  doctrine_reference: 지리적 표지의 번역 원칙
- issue: 영역 분할의 압축적 표현
  chosen_reading: ‘한 몫’으로 끝을 맺어 단의 토지 분깃을 간결하게 드러냈습니다.
  alternative_readings:
  - 한 분깃입니다
  - 한 구역입니다
  rationale: 본문의 핵심은 단 지파의 땅 분배이며, ‘몫’은 분배·유업의 의미를 동시에 전달합니다.
  doctrine_reference: 이스라엘 지파 유업 분배 맥락
