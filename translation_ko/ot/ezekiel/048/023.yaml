  text: וְ/יֶ֖תֶר הַ/שְּׁבָטִ֑ים מִ/פְּאַ֥ת קָדִ֛ימָ/ה עַד פְּאַת יָ֖מָּ/ה בִּנְיָמִ֥ן אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/023.yaml
  text: 'And for the rest of the tribes: from the eastern side to the western side[a], Benjamin, one portion.'
  footnotes:
  - marker: a
    text: Literally, 'Benjamin, one.' The word 'portion' is supplied in English because the chapter repeatedly uses 'one' elliptically for one tribal allotment.
    reason: lexical_alternative
translation:
  language: ko
  text: 남은 지파들에 대해서는, 동쪽 경계에서 서쪽 경계까지 베냐민에게 한 몫입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘베냐민, 하나’입니다. 이 장에서는 ‘하나’가 지파에 배정된 한 몫을 가리키므로, 한국어 본문에는 ‘한 몫’을 보완했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  english_pob_choice: And for the rest
  chosen_korean: 남은 지파들을 위해서는
  alternatives_korean:
  - 나머지 지파들을 위해서는
  - 남은 자들에 대해서는
  lexicon: HALOT
  rationale: 문맥상 새 구획을 여는 연결어이므로 ‘남은 지파들’로 옮겨 남은 분배 대상임을 분명히 했습니다.
- source_word: מִפְּאַת קָדִימָה / עַד פְּאַת יָמָּה
  english_pob_choice: from the eastern side ... to the western side
  chosen_korean: 동쪽 끝에서 서쪽 끝까지
  alternatives_korean:
  - 동쪽 경계에서 서쪽 경계까지
  - 동쪽 편에서 서쪽 편까지
  lexicon: HALOT
  rationale: פְּאַה는 ‘끝, 변두리, 경계’를 가리키므로, 반복되는 토지 분배 공식에 맞게 ‘끝’으로 자연스럽게 살렸습니다.
- source_word: בִּנְיָמִן
  english_pob_choice: Benjamin
  chosen_korean: 베냐민
  alternatives_korean:
  - 벤야민
  lexicon: 표준 외래어 표기
  rationale: 성경 지파명으로 확립된 한국어 표기를 따랐습니다.
- source_word: אֶחָד
  english_pob_choice: one portion
  chosen_korean: 한 몫
  alternatives_korean:
  - 한 분깃
  - 하나
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘하나’이지만, 본 장에서 반복되는 생략형 표현이므로 분배 단위가 드러나도록 ‘한 몫’으로 보완했습니다.
