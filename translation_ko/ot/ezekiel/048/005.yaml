lexical_decisions:
- source_word: וְעַל
  english_pob_choice: And along
  chosen_korean: 그리고 … 곁에는
  alternatives_korean:
  - 그리고 … 따라
  - 그리고 … 위에는
  lexicon: HALOT
  rationale: 경계 구획을 이어 주는 접속과 위치 관계를 함께 살려, 자연스러운 한국어로 연속성을 표현했습니다.
- source_word: גְּבוּל
  english_pob_choice: border
  chosen_korean: 경계
  alternatives_korean:
  - 경계선
  - 변경
  - 지경
  lexicon: HALOT
  rationale: 이 문맥에서는 영토의 분할선을 가리키므로, ‘경계’가 가장 직접적이고 현대적인 대응입니다.
- source_word: מִפְּאַת קָדִימָה … עַד פְּאַת יָמָּה
  english_pob_choice: from the east side … to the west side
  chosen_korean: 동쪽 끝에서 서쪽 끝까지
  alternatives_korean:
  - 동쪽 편에서 서쪽 편까지
  - 동쪽 가장자리에서 서쪽 가장자리까지
  lexicon: HALOT
  rationale: פֵּאָה의 ‘끝/모서리/쪽’ 의미를 살리되, 구획의 양 끝을 가리키는 한국어 관용으로 자연스럽게 옮겼습니다.
- source_word: אֶחָד
  english_pob_choice: one portion
  chosen_korean: 한 몫
  alternatives_korean:
  - 하나
  - 한 몫의 몫
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘하나’이지만, 분배 문맥에서는 ‘한 몫’이 보충된 의미를 가장 잘 드러냅니다. English POB의 ‘one portion’에 해당하는 해석을 반영했습니다.
