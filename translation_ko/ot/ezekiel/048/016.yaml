  language: ko
  text: 그리고 그 측량은 이렇습니다. 북쪽 변이 사천오백이요, 남쪽 변이 사천오백이며, 동쪽 변이 사천오백이요, 서쪽 변이 사천오백입니다.
  philosophy: optimal-equivalence
