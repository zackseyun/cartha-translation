  text: וְ/הָ/עֹבֵ֖ד הָ/עִ֑יר יַעַבְד֕וּ/הוּ מִ/כֹּ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/019.yaml
  text: And those who serve the city shall serve it from all the tribes of Israel[a][b].
  footnotes:
  - marker: a
    text: Or 'the worker of the city shall serve it'—the Hebrew singular participle may be taken individually, but here it likely has a collective sense.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'serve it/him'; the suffix is masculine singular. It refers to the city in context, so English renders 'it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍에서 일하는 자들은 이스라엘의 모든 지파 중에서 그 성읍을 섬길 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹבֵד
  english_pob_choice: those who serve / those who work
  chosen_korean: 그 성읍에서 일하는 자들
  alternatives_korean:
  - 그 성읍을 섬기는 자들
  - 그 일꾼
  - 그 성읍에서 일할 사람들
  lexicon: HALOT
  rationale: 히브리어 분사는 단수형이지만 집합적 의미로 쓰인 것으로 보이므로, 한국어에서는 자연스러운 복수 표현인 ‘일하는 자들’로 옮겨 집합성을 살렸습니다.
- source_word: הָעִיר
  english_pob_choice: the city
  chosen_korean: 그 성읍
  alternatives_korean:
  - 그 도시
  - 그 읍
  lexicon: HALOT
  rationale: 문맥상 예루살렘의 새 구획을 가리키는 공적인 도시 개념이라, 현대어이면서도 성경 문맥에 어울리는 ‘성읍’을 택했습니다.
- source_word: יַעַבְדֻהוּ
  english_pob_choice: shall serve it
  chosen_korean: 섬길 것입니다
  alternatives_korean:
  - 일할 것입니다
  - 봉사할 것입니다
  - 그를 섬길 것입니다
  lexicon: HALOT
  rationale: עבד의 핵심 의미를 살려 ‘섬기다’로 옮겼고, 목적어는 앞의 ‘성읍’을 가리키므로 한국어에서는 자연스럽게 반복하지 않았습니다.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: from all the tribes of Israel
  chosen_korean: 이스라엘의 모든 지파 중에서
  alternatives_korean:
  - 이스라엘의 모든 지파에서
  - 이스라엘의 모든 지파로부터
  lexicon: HALOT
  rationale: מִן + כֹּל의 출처/구성 의미를 ‘중에서’로 자연스럽게 표현하여, 봉사 인력이 모든 지파에서 충원됨을 드러냈습니다.
