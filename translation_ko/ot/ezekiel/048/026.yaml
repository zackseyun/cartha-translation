id: EZK.48.26
reference: Ezekiel 48:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַ֣ל גְּב֣וּל יִשָׂשכָ֗ר מִ/פְּאַ֥ת קָדִ֛ימָ/ה עַד פְּאַת יָ֖מָּ/ה זְבוּלֻ֥ן אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/026.yaml
  text: And along the border of Issachar[a], from the east side to the west side, Zebulun[b], one portion.
  footnotes:
  - marker: a
    text: Hebrew literally, 'Zebulun one'; 'portion' is supplied from the chapter's repeated land-allotment formula.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sea side' is an idiom for the west side.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이사갈의 경계 곁에서, 동쪽 끝에서 서쪽 끝까지, 스불론의 한 몫입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘스불론, 하나’이며, 이 장의 반복된 분깃 공식에 따라 ‘몫’을 보완했습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘서쪽/바다 쪽’ 표현은 지리적으로 서쪽을 가리키는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/עַל גְּבוּל
  english_pob_choice: And along the border
  chosen_korean: 그리고 … 경계 곁에서
  alternatives_korean:
  - 그리고 경계 위에
  - 그리고 경계 따라
  lexicon: HALOT
  rationale: גְּבוּל은 지파 분배 문맥에서 경계선/경계 지역을 가리키므로 ‘경계’로 옮기고, עַל의 공간적 감각은 ‘곁에서’로 자연스럽게 살렸습니다.
- source_word: מִפְּאַת קָדִימָה עַד פְּאַת יָמָּה
  english_pob_choice: from the east side to the west side
  chosen_korean: 동쪽 끝에서 서쪽 끝까지
  alternatives_korean:
  - 동쪽에서 서쪽으로
  - 동쪽 면에서 서쪽 면까지
  lexicon: HALOT
  rationale: פְּאַה는 문자적으로 ‘변두리/면’이지만, 경계 측정 공식에서는 방향의 양 끝을 뜻하므로 한국어에서는 ‘끝’이 가장 자연스럽고 분명합니다.
- source_word: זְבוּלֻן אֶחָד
  english_pob_choice: Zebulun, one portion
  chosen_korean: 스불론의 한 몫입니다
  alternatives_korean:
  - 스불론, 한 몫입니다
  - 스불론은 한 몫입니다
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘스불론, 하나’이지만, 본장의 반복 분배 공식상 생략된 ‘몫/분깃’이 전제되므로 ‘한 몫’으로 보완했습니다.
theological_decisions:
- issue: 지파 분배 공식의 압축된 문장 구조
  chosen_reading: 끝부분의 אֶחָד을 독립된 ‘하나’가 아니라 분깃 수를 가리키는 공식적 표현으로 이해했습니다.
  alternative_readings:
  - 스불론 하나입니다
  - 스불론 한 개입니다
  rationale: 이 절은 앞뒤 문맥에서 땅 분배를 나열하는 형식이므로, 한국어에서도 분배 단위를 드러내는 번역이 본문의 의도를 더 정확히 전달합니다.
  doctrine_reference: 본문 문맥 우선의 형식-의미 일치 원칙
