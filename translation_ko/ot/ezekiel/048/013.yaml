  - severity: low
    issue: ‘차지합니다’
    rationale: 히브리어는 동사 없이 레위인 몫의 치수를 제시합니다. ‘차지하다’는 점유 또는 취득을 암시할 수 있으므로, 배정된 몫을 중립적으로 나타내는 존재·미래 표현으로 조정합니다.
