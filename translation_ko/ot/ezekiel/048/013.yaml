theological_decisions:
- issue: 지파 분배 본문의 토지 배정 동사 표현
  chosen_reading: ‘차지합니다’로 옮겨, 제사장 지역과 나란한 레위 지파 몫의 실제 배정성을 드러냈습니다.
  alternative_readings:
  - ‘갖습니다’로 보다 중립적으로 처리
  - ‘있습니다’로 단순 존재문 처리
  rationale: 본 절은 예언적 이상 배분의 기술이므로, 단순한 존재가 아니라 분배·배정의 행위가 핵심입니다. 한국어에서는 ‘차지하다’가 그 기능을 비교적 직접적으로 전달합니다.
