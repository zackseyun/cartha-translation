translation:
  language: ko
  text: 레위 사람들은 제사장들의 경계와 나란히 길이 이만오천과 너비 일만을 차지합니다. 그 전체 길이는 이만오천이고, 너비는 일만입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘이만오천’과 ‘일만’만 말하며, ‘규빗’은 에스겔 48장의 주변 문맥에서 보완되는 단위입니다.
    reason: source_note
lexical_decisions:
