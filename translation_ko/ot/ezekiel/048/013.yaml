  source_fidelity: 수치와 길이·너비의 병행은 정확하나, לְעֻמַּת גְּבוּל הַכֹּהֲנִים는 제사장들의 ‘경계’ 자체보다 그 경계로 규정된 구역에 인접한 레위인 몫을 가리킵니다. 또한 ‘차지합니다’는 본문의 무동사적 배정 기술보다 점유·획득의 뉘앙스를 더합니다.
  naturalness: ‘제사장들의 경계와 나란히’는 무엇이 경계와 나란한지 다소 어색하고, ‘차지합니다’도 토지 배정 문맥에서는 다소 강합니다. ‘제사장들의 구역과 나란히 … 땅이 있을 것입니다’가 현대 표준어 합쇼체에서 더 자연스럽고 분명합니다.
  terminology: ‘레위 사람들’, ‘제사장들’, ‘길이’, ‘너비’는 적절합니다. גְּבוּל은 여기서 경계선보다 경계 지어진 제사장들의 ‘구역’으로 옮기는 것이 문맥에 맞습니다.
