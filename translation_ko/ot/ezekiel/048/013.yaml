translation:
  language: ko
  text: 레위 사람들에게는 제사장들의 구역과 나란히 길이 이만 오천, 너비 일만의 땅이 있을 것입니다.[a] 전체 길이는 이만 오천이고 너비는 일만입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 히브리어 본문에는 ‘이만 오천’과 ‘일만’ 뒤에 단위가 명시되어 있지 않습니다. ‘규빗’은 에스겔 48장의 주변 문맥에 따라 보완한 것입니다.
    reason: source_note
