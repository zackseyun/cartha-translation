base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/033.yaml
  text: 'On the south side[a], 4,500 cubits by measure, with three gates: the gate of Simeon, one; the gate of Issachar, one; the gate of Zebulun, one.'
  footnotes:
  - marker: a
    text: Hebrew simply says '4,500 by measure'; 'cubits' is supplied from the immediate context of the city's dimensions in this section.
    reason: cross_reference
translation:
  language: ko
  text: 남쪽 면은 측량대로 4,500규빗이며, 성문이 셋입니다. 시므온의 성문 하나, 잇사갈의 성문 하나, 스불론의 성문 하나입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘4,500, 측량대로’라고만 말하지만, 이 문맥에서는 바로 앞의 성읍 치수 단위인 규빗이 생략되어 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/פְאַת נֶגְבָּה
  english_pob_choice: On the south side
  chosen_korean: 남쪽 면은
  alternatives_korean:
  - 남쪽 편은
  - 남쪽 쪽은
  lexicon: HALOT
  rationale: פאה는 성읍의 ‘면/변’이라는 뜻이므로, 건축적 맥락에 맞게 ‘남쪽 면’으로 옮겼습니다. 문맥상 자연스러운 주어-서술 구조를 위해 조사 ‘은’을 붙였습니다.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  english_pob_choice: 4,500
  chosen_korean: 4,500규빗
  alternatives_korean:
  - 사천오백 규빗
  - 4,500
  lexicon: HALOT
  rationale: 영어 POB가 바로 앞 문맥의 단위를 반영해 ‘cubits’를 보충하므로, 한국어도 같은 방식으로 ‘규빗’을 보충해 의미를 분명히 했습니다.
- source_word: שַׁ֣עַר שִׁמְע֞וֹן אֶחָ֗ד
  english_pob_choice: the gate of Simeon, one
  chosen_korean: 시므온의 성문 하나
  alternatives_korean:
  - 시므온의 문 하나
  - 시므온의 성문 한 개
  lexicon: HALOT
  rationale: 반복 목록의 형식을 살리되, 한국어에서는 ‘the gate of Simeon, one’을 ‘시므온의 성문 하나’로 자연스럽게 압축했습니다. ‘성문’은 성읍 성문이라는 문맥을 분명히 합니다.
- source_word: שַׁ֤עַר יִשָּׂשכָר֙ אֶחָ֔ד
  english_pob_choice: the gate of Issachar, one
  chosen_korean: 잇사갈의 성문 하나
  alternatives_korean:
  - 잇사갈의 문 하나
  - 잇사갈의 성문 한 개
  lexicon: HALOT
  rationale: 앞 항목과 같은 병렬 구조를 유지해 각 지파 이름이 동일한 형식으로 제시되도록 했습니다.
- source_word: שַׁ֥עַר זְבוּלֻ֖ן אֶחָֽד
  english_pob_choice: the gate of Zebulun, one
  chosen_korean: 스불론의 성문 하나
  alternatives_korean:
  - 스불론의 문 하나
  - 스불론의 성문 한 개
  lexicon: HALOT
  rationale: 목록의 반복 리듬과 대칭성을 보존하기 위해 앞의 두 항목과 같은 방식으로 옮겼습니다.
