  lexicon: HALOT
  rationale: פאה는 성읍의 ‘면/변’이라는 뜻이므로, 건축적 맥락에 맞게 ‘남쪽 면’으로 옮겼습니다. 문맥상 자연스러운 주어-서술 구조를 위해 조사 ‘은’을 붙였습니다.
