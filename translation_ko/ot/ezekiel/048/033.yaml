  text: 'On the south side[a], 4,500 cubits by measure, with three gates: the gate of Simeon, one; the gate of Issachar, one; the gate of Zebulun, one.'
  footnotes:
  - marker: a
    text: Hebrew simply says '4,500 by measure'; 'cubits' is supplied from the immediate context of the city's dimensions in this section.
    reason: cross_reference
translation:
  language: ko
  text: 남쪽 면은 측량대로 4,500규빗이며, 성문이 셋입니다. 시므온의 성문 하나, 잇사갈의 성문 하나, 스불론의 성문 하나입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘4,500, 측량대로’라고만 말하지만, 이 문맥에서는 바로 앞의 성읍 치수 단위인 규빗이 생략되어 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/פְאַת נֶגְבָּה
  english_pob_choice: On the south side
  chosen_korean: 남쪽 면은
  alternatives_korean:
  - 남쪽 편은
