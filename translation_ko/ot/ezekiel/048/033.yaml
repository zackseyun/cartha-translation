  lexicon: HALOT
  rationale: 반복 목록의 형식을 살리되, 한국어에서는 ‘the gate of Simeon, one’을 ‘시므온의 성문 하나’로 자연스럽게 압축했습니다. ‘성문’은 성읍 성문이라는 문맥을 분명히 합니다.
