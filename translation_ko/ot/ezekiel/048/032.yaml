translation:
  language: ko
  text: 동쪽 편에는 사방이 사천오백 규빗이며, 성문이 셋 있습니다. 요셉의 성문이 하나, 베냐민의 성문이 하나, 단의 성문이 하나입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘사천오백’만 적고 있으며, 단위인 ‘규빗’은 이 장의 측량 문맥에서 보충됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: פְּאַת קָדִימָה
  english_pob_choice: the east side
  chosen_korean: 동쪽 편
  alternatives_korean:
  - 동편
  - 동쪽 면
