translation:
  language: ko
  text: 동쪽 편은 사천오백 규빗[a]이며, 성문이 셋 있습니다. 요셉의 성문이 하나, 베냐민의 성문이 하나, 단의 성문이 하나입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘사천오백’만 적고 있으며, 단위인 ‘규빗’은 이 장의 측량 문맥에서 보충됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: פְּאַת קָדִימָה
  english_pob_choice: the east side
  chosen_korean: 동쪽 편
  alternatives_korean:
  - 동편
  - 동쪽 면
  - 동쪽 변
  lexicon: HALOT
  rationale: פְּאַת는 ‘쪽/편/면’의 뜻이고 קָדִימָה는 동쪽 방향을 가리키므로, 본문의 경계·방향 설명에 자연스러운 ‘동쪽 편’으로 옮겼습니다.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  english_pob_choice: four thousand five hundred cubits
  chosen_korean: 사천오백 규빗
  alternatives_korean:
  - 사천오백
  - 사천오백 큐빗
  - 사천오백 척
  lexicon: HALOT
  rationale: 히브리어 수량은 관용적으로 4,500이며, 문맥상 단위가 도시 측량의 규빗임이 분명하므로 ‘규빗’을 보충해 옮겼습니다.
- source_word: וּשְׁעָרִים שְׁלֹשָׁה
  english_pob_choice: with three gates
  chosen_korean: 성문이 셋 있습니다
  alternatives_korean:
  - 성문 셋과 함께
  - 세 개의 성문이 있습니다
  - 성문이 세 개 있습니다
  lexicon: HALOT
  rationale: 열거적 설명을 현대 한국어로 자연스럽게 풀어 쓰되, 뒤의 각 문을 세어 주는 구조를 살려 ‘성문이 셋 있습니다’로 옮겼습니다.
- source_word: שַׁעַר
  english_pob_choice: gate
  chosen_korean: 성문
  alternatives_korean:
  - 문
  - 문짝
  - 대문
  lexicon: HALOT
  rationale: 예루살렘 성의 구조를 가리키는 문맥이므로 단순한 ‘문’보다 ‘성문’이 더 정확합니다.
