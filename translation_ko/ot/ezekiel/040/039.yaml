source:
  edition: WLC
  text: וּ/בְ/אֻלָ֣ם הַ/שַּׁ֗עַר שְׁנַ֤יִם שֻׁלְחָנוֹת֙ מִ/פּ֔וֹ וּ/שְׁנַ֥יִם שֻׁלְחָנ֖וֹת מִ/פֹּ֑ה לִ/שְׁח֤וֹט אֲלֵי/הֶם֙ הָ/עוֹלָ֔ה וְ/הַ/חַטָּ֖את וְ/הָ/אָשָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/039.yaml
  text: And in the portico of the gate were two tables on this side and two tables on that side[a], on which they slaughtered the burnt offering, the sin offering[b], and the guilt offering.
  footnotes:
  - marker: a
    text: Or 'the purification offering' for 'the sin offering'; the Hebrew term can denote the offering associated with purification from sin/impurity.
    reason: lexical_alternative
  - marker: b
    text: Or 'the reparation offering' for 'the guilt offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 문의 현관에는 이쪽에 상 두 개와 저쪽에 상 두 개가 있었고, 그 상들 위에서 번제와 속죄제[a]와 속건제[b]를 잡았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제’로 옮길 수 있습니다. 히브리어는 죄나 부정에서 정결하게 되는 것과 관련된 제물을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘배상제’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאֻלָם הַשַּׁעַר
  english_pob_choice: And in the portico of the gate
  chosen_korean: 문지기 문의 현관에는
  alternatives_korean:
  - 문지기 문의 포르티코에는
  - 문지기 문의 현관에
  lexicon: HALOT
  rationale: אֻלָם은 건축 맥락에서 현관/주랑/포르티코를 가리키며, 합쇼체의 자연스러운 문맥을 위해 ‘현관’으로 옮겼습니다.
- source_word: שְׁנַיִם שֻׁלְחָנוֹת ... וּשְׁנַיִם שֻׁלְחָנוֹת
  english_pob_choice: two tables on this side and two tables on that side
  chosen_korean: 이쪽에 두 개의 상, 저쪽에 두 개의 상
  alternatives_korean:
  - 한쪽에 두 개의 상, 다른쪽에 두 개의 상
  - 이편에 두 개의 상, 저편에 두 개의 상
  lexicon: HALOT
  rationale: 반복되는 수사와 대칭 구조를 살려 양편 배치를 한국어로 자연스럽게 표현했습니다.
- source_word: לִשְׁחֹט
  english_pob_choice: they slaughtered
  chosen_korean: 잡았습니다
  alternatives_korean:
  - 도살했습니다
  - 잡았습니다
  lexicon: HALOT
  rationale: 제의 문맥의 희생 동물 처리 행위를 한국어 예배 언어로 과도하게 약화하지 않으면서도, 본문이 묘사하는 기능을 간결하게 드러내기 위해 ‘잡다’를 선택했습니다. ‘도살하다’는 현대어에서 지나치게 생경할 수 있습니다.
- source_word: הַחַטָּאת
  english_pob_choice: the sin offering
  chosen_korean: 속죄제
  alternatives_korean:
  - 죄제
  - 정결제
  lexicon: HALOT
  rationale: חַטָּאת은 제의 목록에서 통상 ‘속죄제’로 옮기며, POB 각주가 제시하는 ‘purification offering’의 가능성은 각주로 보완하는 것이 적절합니다.
- source_word: הָאָשָׁם
  english_pob_choice: the guilt offering
  chosen_korean: 속건제
  alternatives_korean:
  - 배상제
  - 유죄제
  lexicon: HALOT
  rationale: אָשָׁם은 제의 문맥에서 ‘속건제’가 한국어 성경의 표준적 대응이며, POB의 ‘reparation offering’ 뉘앙스와도 부합합니다.
theological_decisions:
- issue: 제의 용어를 표준 교회어와 본문 뉘앙스 사이에서 어떻게 처리할지
  chosen_reading: 번제, 속죄제, 속건제로 옮기고, חַטָּאת의 정결/속죄 뉘앙스는 본문 각주로 남깁니다.
  alternative_readings:
  - 번제, 정결제, 속건제
  - 번제, 죄제, 배상제
  rationale: 본문은 성전 환상의 규정적 열거이므로, 본문에는 가장 인지 가능한 제의 명칭을 두되, 어휘가 가질 수 있는 정결·배상 뉘앙스는 삭제하지 않고 각주로 보존하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
