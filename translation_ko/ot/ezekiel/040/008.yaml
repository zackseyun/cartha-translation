base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/008.yaml
  text: 'Then he measured the vestibule of the gate on the inside: one rod[a][b].'
  footnotes:
  - marker: a
    text: Or 'one reed.' The Hebrew term can denote a reed used as a measuring rod.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the house.' In Ezekiel's temple vision, 'the house' often refers to the temple building; the exact spatial nuance of 'from' here is difficult.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 성문의 현관을 안쪽에서 측량하였습니다. 한 갈대 길이였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “한 측량 막대 길이”. 히브리어 표현은 측량에 쓰는 갈대를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “집에서”입니다. 에스겔의 성전 환상에서 “집”은 종종 성전 건물을 가리키므로, 이 전치사의 정확한 공간 뉘앙스는 분명하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  english_pob_choice: Then he measured
  chosen_korean: 그가 측량하니
  alternatives_korean:
  - 그가 재니
  - 그가 재었습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서도, 건축 치수 측정이라는 문맥에 맞게 '측량하다'를 택했습니다.
- source_word: אֻלָם
  english_pob_choice: vestibule
  chosen_korean: 현관
  alternatives_korean:
  - 전실
  - 포치
  lexicon: HALOT
  rationale: שער 앞의 건축 공간을 현대 한국어로 가장 분명하게 드러내는 말로 '현관'을 선택했습니다.
- source_word: הַשַּׁעַר
  english_pob_choice: the gate
  chosen_korean: 성문
  alternatives_korean:
  - 문
  - 문간
  lexicon: HALOT
  rationale: 성전 환상 문맥에서 מדובר한 구조물을 한국어로 자연스럽게 풀어 '성문'으로 옮겼습니다.
- source_word: מֵהַבַּיִת
  english_pob_choice: on the inside / from the temple building
  chosen_korean: 안쪽에서
  alternatives_korean:
  - 성전 건물에서
  - 집에서
  - 안에서
  lexicon: HALOT
  rationale: מִן의 정확한 공간 관계는 다소 어려우므로, 영어 POB가 반영한 문맥상 의미를 따라 내부 방향을 드러내는 '안쪽에서'로 옮겼습니다.
- source_word: קָנֶה אֶחָד
  english_pob_choice: one rod
  chosen_korean: 한 갈대
  alternatives_korean:
  - 한 막대
  - 한 측량막대
  lexicon: HALOT
  rationale: 본문의 도량형 표현을 살리기 위해 직역 쪽을 택했습니다. 영어 주석처럼 갈대가 측량 막대로 쓰일 수 있다는 점을 한국어 본문에서는 '갈대'로 유지하고 각주로 보완합니다.
