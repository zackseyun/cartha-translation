id: EZK.40.11
reference: Ezekiel 40:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֛מָד אֶת רֹ֥חַב פֶּֽתַח הַ/שַּׁ֖עַר עֶ֣שֶׂר אַמּ֑וֹת אֹ֣רֶךְ הַ/שַּׁ֔עַר שְׁל֥וֹשׁ עֶשְׂרֵ֖ה אַמּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/011.yaml
  text: 'Then he measured the width of the entrance of the gate: ten cubits[b][a], and the length of the gate: thirteen cubits.'
  footnotes:
  - marker: a
    text: Or 'gateway' instead of 'gate'; the Hebrew שַׁעַר can denote the gate structure as a whole, not only the door opening.
    reason: lexical_alternative
  - marker: b
    text: Some translations render the second measurement more interpretively (for example, as the depth or span of the gateway), but the Hebrew text simply says 'the length of the gate.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 문 입구의 너비를 재었는데, 열 규빗이었습니다. 또 문의 길이는 열세 규빗이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָד
  english_pob_choice: Then he measured
  chosen_korean: 그는 ... 재었는데
  alternatives_korean:
  - 그리고 재었습니다
  - 그가 측정했습니다
  lexicon: HALOT
  rationale: 연속된 환상 서술의 동작 진행을 자연스럽게 살리면서도, 측량 행위라는 점을 분명히 하기 위해 ‘재었습니다’ 계열로 옮겼습니다.
- source_word: רֹחַב פֶּתַח הַשַּׁעַר
  english_pob_choice: the width of the entrance of the gate
  chosen_korean: 문 입구의 너비
  alternatives_korean:
  - 문 통로의 너비
  - 문 출입구의 너비
  lexicon: HALOT
  rationale: פֶּתַח의 ‘entrance/opening’와 שַׁעַר의 구조적 의미를 함께 살리되, 한국어에서는 ‘문 입구’가 가장 간결하고 자연스럽습니다.
- source_word: עֶשֶׂר אַמּוֹת
  english_pob_choice: ten cubits
  chosen_korean: 열 규빗
  alternatives_korean:
  - 열 큐빗
  - 10규빗
  lexicon: HALOT
  rationale: 고대 척도 ‘אַמּוֹת’를 본문 그대로 보존하기 위해 ‘규빗’을 유지했습니다.
- source_word: אֹרֶךְ הַשַּׁעַר
  english_pob_choice: the length of the gate
  chosen_korean: 문의 길이
  alternatives_korean:
  - 문 길이
  - 문 통로의 길이
  lexicon: HALOT
  rationale: 두 번째 치수는 히브리어가 단순히 ‘길이’를 말하므로, 해석을 덧붙이지 않고 표준적인 한국어로 옮겼습니다.
- source_word: שְׁלֹשׁ עֶשְׂרֵה אַמּוֹת
  english_pob_choice: thirteen cubits
  chosen_korean: 열세 규빗
  alternatives_korean:
  - 13규빗
  - 열세 큐빗
  lexicon: HALOT
  rationale: 숫자와 단위를 직설적으로 대응시켜 측정문장의 형식을 유지했습니다.
