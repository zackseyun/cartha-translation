  text: וְ/הִנֵּ֥ה חוֹמָ֛ה מִ/ח֥וּץ לַ/בַּ֖יִת סָבִ֣יב סָבִ֑יב וּ/בְ/יַ֨ד הָ/אִ֜ישׁ קְנֵ֣ה הַ/מִּדָּ֗ה שֵׁשׁ אַמּ֤וֹת בָּֽ/אַמָּה֙ וָ/טֹ֔פַח וַ/יָּ֜מָד אֶת רֹ֤חַב הַ/בִּנְיָן֙ קָנֶ֣ה אֶחָ֔ד וְ/קוֹמָ֖ה קָנֶ֥ה אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/005.yaml
  text: 'And behold[a], there was a wall outside the house, all around, and in the hand of the man was a measuring reed of six cubits, each cubit being a cubit and a handbreadth. And he measured the width of the structure: one reed[b], and the height: one reed.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''six cubits by the cubit and a handbreadth,'' that is, using a long cubit of a regular cubit plus a handbreadth.'
    reason: cultural_note
  - marker: b
    text: Or 'the width of the building.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그 집 바깥 사방에 담이 있었고, 그 사람의 손에는 길이가 여섯 규빗인 측량 갈대가 있었습니다. 이 규빗은 보통 규빗에 한 뼘을 더한 것이었습니다[a]. 그가 그 건축물의 너비를 재니 한 측량 갈대였고, 높이도 한 측량 갈대였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘규빗과 한 뼘으로 된’이라고 합니다. 곧 보통 규빗에 한 뼘을 더한 긴 규빗을 측량 기준으로 사용했다는 뜻입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그 건물의 너비’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보니
  - 자
  lexicon: HALOT
  rationale: 예언적 환시에서 새로운 장면을 지시하는 감탄/주의 환기 표현을 살리되, 현대 한국어에서 자연스러운 직접 주목 표현으로 옮겼습니다.
- source_word: קְנֵה הַמִּדָּה
  english_pob_choice: a measuring reed
  chosen_korean: 측량하는 갈대
  alternatives_korean:
  - 측량 막대
  - 재는 갈대
  lexicon: HALOT
  rationale: 갈대(קנה) 자체가 측량 도구로 쓰이는 점을 반영해, 단순한 막대보다 원문에 더 가까운 표현을 택했습니다.
- source_word: בָּאַמָּה וָטֹפַח
  english_pob_choice: each cubit being a cubit and a handbreadth
  chosen_korean: 각 규빗은 규빗 한 뼘이었습니다
  alternatives_korean:
  - 규빗 하나에 한 뼘이 더한 것이었습니다
  - 규빗과 한 뼘으로 이루어졌습니다
  lexicon: HALOT
  rationale: 히브리어가 ‘긴 규빗’을 설명하는 구문이므로, 한국어에서도 규빗의 실제 기준이 추가 한 뼘을 포함한다는 점이 드러나도록 옮겼습니다.
- source_word: רֹחַב הַבִּנְיָן
  english_pob_choice: the width of the structure
  chosen_korean: 그 건축물의 너비
  alternatives_korean:
  - 그 건물의 폭
  - 그 구조물의 너비
  lexicon: HALOT
  rationale: 문맥상 성전 환시의 건축적 치수를 말하므로 ‘건축물’로 옮기되, 본문의 치수 항목에 맞게 ‘너비’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 환시 도입어의 어조
  chosen_reading: 보십시오로 옮겨 예언적 시각성의 즉각성을 살렸습니다.
  alternative_readings:
  - 그리고 보니
  - 보라
  rationale: 이 구절은 단순 서술이 아니라 환시 속 장면 전환이므로, 독자에게 장면을 직접 지시하는 어조를 유지하는 것이 본문의 기능에 더 가깝습니다.
  doctrine_reference: 예언서 환시 서술의 화용적 기능
