    issue: ‘각 규빗은 규빗 한 뼘이었습니다’의 측량 기준 표현
    rationale: 히브리어 בָּאַמָּה וָטֹפַח은 한 규빗에 한 뼘을 더한 긴 규빗을 뜻합니다. 초안은 이를 ‘규빗 한 뼘’으로 압축하여, 규빗의 길이가 한 뼘이라는 뜻으로 오해될 여지가 있습니다.
