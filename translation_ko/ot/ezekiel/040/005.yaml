  source_fidelity: 히브리어의 환시적 도입, 집 바깥을 두른 담, 여섯 규빗 길이의 측량 갈대, 그리고 너비와 높이가 각각 한 갈대라는 측량 결과는 대체로 충실히 반영되었습니다. 다만 ‘규빗 한 뼘’은 한국어에서 한 규빗 자체가 한 뼘이라는 뜻으로 읽힐 수 있으므로, 보통 규빗에 한 뼘을 더한 긴 규빗이라는 측량 기준을 분명히 해야 합니다.
  naturalness: ‘보십시오’는 합쇼체의 환시 도입으로 가능하나, 문장 전체에서는 ‘그 집 바깥 사방에’와 ‘측량 갈대’를 사용하면 더 자연스럽고 일관됩니다. 측량 결과의 ‘한 갈대’는 앞서 제시된 측량 단위를 반복하여 ‘한 측량 갈대’로 밝혀 주는 편이 명료합니다.
  terminology: אַמָּה는 ‘규빗’, טֹפַח은 ‘뼘’, קְנֵה הַמִּדָּה는 ‘측량 갈대’로 옮겼습니다. בִּנְיָן은 본문에서 ‘건축물’로 유지하고, ‘건물’은 가능한 어휘 대안으로 각주에 제시합니다.
  issues:
