source:
  edition: WLC
  text: ו/איל/ו לֶֽ/חָצֵר֙ הַ/חִ֣יצוֹנָ֔ה וְ/תִמֹרִ֥ים אֶל איל/ו מִ/פּ֣וֹ וּ/מִ/פּ֑וֹ וּ/שְׁמֹנֶ֥ה מַעֲל֖וֹת מעל/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/037.yaml
  text: Its portico faced the outer court[a], and palm trees were on its jambs, on this side and on that side[b]; and eight steps went up to it.
  footnotes:
  - marker: a
    text: Or 'palm-tree decorations were on its pilasters.' The Hebrew names palm trees explicitly, but in this architectural context the reference may be to carved palm motifs rather than literal trees.
    reason: lexical_alternative
  - marker: b
    text: Or 'its vestibule/porch was toward the outer court.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 문설주들은 바깥뜰 쪽을 향하고[a], 그 문설주들 양쪽에는 종려나무가 있었으며[b], 그 문으로 올라가는 계단은 여덟 개였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 문기둥들은 바깥뜰 쪽을 향하고.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘종려나무 장식이 있었습니다.’ 히브리어는 ‘종려나무’라고 하지만, 이 건축 문맥에서는 새긴 종려나무 무늬를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵילָו / אֵילָיו
  english_pob_choice: its portico
  chosen_korean: 그 현관
  alternatives_korean:
  - 그 주랑
  - 그 베란다
  - 그 포치
  lexicon: HALOT
  rationale: 여기서는 성전 문 구조의 돌출된 출입 공간을 가리키므로, 현대 한국어로는 ‘현관’이 가장 자연스럽고 기능을 잘 드러냅니다. ‘포치’는 외래어 느낌이 강하고, ‘주랑’은 고전 건축 용어로 다소 무겁습니다.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  english_pob_choice: faced the outer court
  chosen_korean: 바깥뜰을 향했고
  alternatives_korean:
  - 바깥뜰 쪽에 있었고
  - 바깥뜰을 향하여 있었고
  - 바깥뜰 쪽이었다
  lexicon: HALOT
  rationale: 전치사 ל의 방향성을 한국어에서 직접적으로 살려 ‘향했고’로 옮겼습니다. 이는 단순 위치보다 구조의 방향을 분명히 합니다.
- source_word: תִמֹרִים
  english_pob_choice: palm trees
  chosen_korean: 종려나무
  alternatives_korean:
  - 야자나무
  - 종려나무 장식
  - 종려나무 무늬
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 종려나무를 말하므로 기본 어휘는 그대로 살렸습니다. 이 본문이 건축 장식 문맥이라는 점은 주석으로 남기지 않고 본문에서는 원형을 유지했습니다.
- source_word: אֶל אֵילָיו
  english_pob_choice: on its jambs
  chosen_korean: 그 기둥들에는
  alternatives_korean:
  - 그 문설주에는
  - 그 설주들에는
  - 그 측면 기둥들에는
  lexicon: HALOT
  rationale: 문맥상 장식이 붙는 건축 부재를 한국어로 가장 무리 없이 드러내기 위해 ‘기둥들’로 옮겼습니다. 영어 POB의 jambs가 문설주/측면 기둥을 가리키는 점을 반영합니다.
- source_word: שְׁמֹנֶה מַעֲלוֹת / מַעֲלוֹ
  english_pob_choice: eight steps went up to it
  chosen_korean: 그곳으로 올라가는 계단이 여덟 개 있었습니다
  alternatives_korean:
  - 여덟 계단이 그곳으로 올라갔습니다
  - 그것으로 올라가는 여덟 계단이 있었습니다
  - 여덟 층계가 그곳으로 이어졌습니다
  lexicon: HALOT
  rationale: 히브리어는 수량과 상승 동작을 함께 제시하므로, 한국어에서는 자연스럽게 ‘계단이 여덟 개 있었습니다’로 풀어 구조를 살렸습니다. ‘올라가는’으로 상승 방향을 명시해 원문의 기능을 보존했습니다.
theological_decisions:
- issue: 성전 문 구조의 기술적 표현을 얼마나 직설적으로 옮길 것인가
  chosen_reading: 건축 묘사를 본문 그대로 따라가되, 한국어에서 이해되는 기능어로 정리했습니다.
  alternative_readings:
  - 전문 건축 용어를 더 엄밀하게 유지하는 번역
  - 의미를 풀어 설명하는 번역
  rationale: 이 구절은 신학적 해설보다 성전 구조의 정밀한 묘사가 핵심이므로, 독자가 장면을 바로 그릴 수 있도록 직설적이고 절제된 표현을 택했습니다.
  doctrine_reference: Ezekiel 40의 성전 환상 구조 묘사
- issue: ‘종려나무’의 문자적/장식적 가능성
  chosen_reading: 본문에는 ‘종려나무’로 두고, 장식 여부는 본문 밖에서 판단할 수 있게 했습니다.
  alternative_readings:
  - ‘종려나무 장식’으로 본문에 반영
  - ‘종려나무 무늬’로 본문에 반영
  rationale: 히브리어는 나무 자체를 말하지만 건축 맥락상 장식일 가능성이 있습니다. 그러나 원문이 그 의미를 명시하지 않으므로, 본문은 문자형을 유지하고 독자에게 과잉 해석을 강요하지 않았습니다.
  doctrine_reference: 원문 어휘의 보수적 처리 원칙
