lexical_decisions:
- source_word: וַיָּמָד
  english_pob_choice: Then he measured
  chosen_korean: 그가 측량하니
  alternatives_korean:
  - 그가 재니
  - 그가 측정하니
  lexicon: BDB / HALOT
  rationale: מדד는 치수를 재는 동작으로, 문맥상 건축 측량이므로 ‘측량하다’가 가장 자연스럽고 정확합니다.
- source_word: הֶחָצֵר
  english_pob_choice: the court
  chosen_korean: 뜰
  alternatives_korean:
  - 마당
  - 법정
  lexicon: BDB / HALOT
  rationale: 성전 환상 문맥의 חָצֵר는 성전 뜰을 가리키므로, 한국어 성경 문체에서도 잘 맞는 ‘뜰’로 옮겼습니다.
- source_word: מְרֻבָּעַת
  english_pob_choice: square
  chosen_korean: 네모꼴이었으며
  alternatives_korean:
  - 정사각형이었으며
  - 사각형이었으며
  lexicon: HALOT
  rationale: 형태상 ‘사각의/네모난’ 뜻을 분명히 하되, 자연스러운 현대 한국어로는 ‘네모꼴’이 가장 간결합니다.
- source_word: לִפְנֵי הַבָּיִת
  english_pob_choice: before the house
  chosen_korean: 집 앞에
  alternatives_korean:
  - 성전 앞에
  - 집 앞쪽에
  lexicon: BDB / HALOT
  rationale: בַּיִת는 본문 내 성전 건물을 가리키지만, 한국어에서는 위치 관계를 직접 드러내는 ‘집 앞에’가 원문에 더 가깝습니다.
theological_decisions:
- issue: לִפְנֵי הַבָּיִת의 공간 관계를 어떻게 드러낼지
  chosen_reading: 제단은 집 앞에 있었습니다
  alternative_readings:
