  source_fidelity: 원문의 와우 계속형은 서술 순서를 따라 ‘그가 … 측량했습니다’로 자연스럽게 옮길 수 있습니다. 뜰의 길이와 너비가 각각 백 규빗이며 정사각형이라는 진술, 그리고 제단이 그 집 앞에 있다는 위치 관계가 모두 유지되어야 합니다.
  naturalness: 초안의 ‘측량하니’와 ‘있었습니다’의 결합은 합쇼체 문체 안에서 다소 혼합되어 보입니다. 문장을 ‘측량했습니다’로 통일하고, 각주 표지를 해당 어휘 바로 뒤에 두면 현대 한국어의 명료성과 문체 일관성이 좋아집니다.
