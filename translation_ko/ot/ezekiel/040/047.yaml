  text: וַ/יָּ֨מָד אֶת הֶ/חָצֵ֜ר אֹ֣רֶךְ מֵאָ֣ה אַמָּ֗ה וְ/רֹ֛חַב מֵאָ֥ה אַמָּ֖ה מְרֻבָּ֑עַת וְ/הַ/מִּזְבֵּ֖חַ לִ/פְנֵ֥י הַ/בָּֽיִת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/047.yaml
  text: 'Then he measured the court: one hundred cubits long and one hundred cubits wide[a], square[b]; and the altar was before the house.'
  footnotes:
  - marker: a
    text: Or 'courtyard.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'before the house'; here 'house' refers to the temple building in Ezekiel's vision.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 뜰을 측량하니 길이도 백 규빗이고 너비도 백 규빗이어서, 네모꼴이었으며, 제단은 집 앞에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뜰마당’입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘집’은 에스겔 환상 속 성전 건물을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּמָד
  english_pob_choice: Then he measured
  chosen_korean: 그가 측량하니
  alternatives_korean:
  - 그가 재니
  - 그가 측정하니
  lexicon: BDB / HALOT
  rationale: מדד는 치수를 재는 동작으로, 문맥상 건축 측량이므로 ‘측량하다’가 가장 자연스럽고 정확합니다.
- source_word: הֶחָצֵר
  english_pob_choice: the court
  chosen_korean: 뜰
  alternatives_korean:
  - 마당
  - 법정
  lexicon: BDB / HALOT
  rationale: 성전 환상 문맥의 חָצֵר는 성전 뜰을 가리키므로, 한국어 성경 문체에서도 잘 맞는 ‘뜰’로 옮겼습니다.
- source_word: מְרֻבָּעַת
  english_pob_choice: square
  chosen_korean: 네모꼴이었으며
  alternatives_korean:
  - 정사각형이었으며
  - 사각형이었으며
  lexicon: HALOT
  rationale: 형태상 ‘사각의/네모난’ 뜻을 분명히 하되, 자연스러운 현대 한국어로는 ‘네모꼴’이 가장 간결합니다.
- source_word: לִפְנֵי הַבָּיִת
  english_pob_choice: before the house
  chosen_korean: 집 앞에
  alternatives_korean:
  - 성전 앞에
  - 집 앞쪽에
  lexicon: BDB / HALOT
  rationale: בַּיִת는 본문 내 성전 건물을 가리키지만, 한국어에서는 위치 관계를 직접 드러내는 ‘집 앞에’가 원문에 더 가깝습니다.
theological_decisions:
- issue: לִפְנֵי הַבָּיִת의 공간 관계를 어떻게 드러낼지
  chosen_reading: 제단은 집 앞에 있었습니다
  alternative_readings:
  - 제단은 성전 앞에 있었습니다
  - 제단은 집 맞은편에 있었습니다
  rationale: 본문은 제단의 배치 위치를 묘사하는 것이므로, 해석을 덧붙이지 않고 단순한 공간 관계를 유지했습니다.
  doctrine_reference: 성전 환상 본문 해석
