  yaml_path: translation/ot/ezekiel/040/033.yaml
  text: And its guardrooms[a], its side pillars, and its portico were according to these measurements; and it and its side pillars had windows all around. Its length was fifty cubits[b], and its width twenty-five cubits.
  footnotes:
  - marker: a
    text: Or 'jambs' or 'pilasters' for 'side pillars.' The Hebrew architectural term is difficult and may refer to structural gateway members.
    reason: lexical_alternative
  - marker: b
    text: Or 'vestibule' or 'porch' for 'portico.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 보초방들과 그의 옆기둥들과 그의 현관은 이 측정에 따랐습니다. 그리고 그와 그의 옆기둥들에는 사방으로 창문들이 있었습니다. 길이는 쉰 규빗이었고, 너비는 스물다섯 규빗이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּא
