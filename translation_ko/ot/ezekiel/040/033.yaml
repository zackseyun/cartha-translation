  - 감시방들
  - 문지기방들
  lexicon: HALOT
  rationale: 성전 문 구조의 작은 방들을 기능적으로 드러내되, 현대 독자가 이해할 수 있는 건축 용어로 옮겼습니다.
- source_word: אַיִל
  english_pob_choice: side pillars
