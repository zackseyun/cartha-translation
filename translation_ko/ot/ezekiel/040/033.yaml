  source_fidelity: 둘째 절의 וּלְאֵילַמּוֹ는 ‘그의 현관/주랑’(אֵילָם)을 가리킵니다. 초안의 ‘그의 옆기둥들’은 이 절의 히브리어와 일치하지 않습니다.
  naturalness: ‘이 측정에 따랐습니다’도 이해되지만, 치수의 일치를 표현하는 ‘이 치수들과 같았습니다’가 현대 한국어에서 더 자연스럽고 정확합니다. 나머지 문장 구조와 합쇼체는 적절합니다.
  terminology: תָּא의 ‘보초방들’, אַיִל의 ‘옆기둥들’, אֵילָם의 ‘현관’은 가능한 번역입니다. 다만 창문이 있는 대상으로는 본문에 따라 ‘현관’을 유지해야 합니다.
  issues:
