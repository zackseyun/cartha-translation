  source_fidelity: 원문의 לִשְׁכָּה וּפִתְחָהּ(‘방 하나와 그 출입구’) 및 הַשְּׁעָרִים의 복수(‘문들’)는 유지되어야 합니다. 초안은 대체로 충실하지만, ‘그리고 문설주들 곁에는’은 접속사와 장소구의 연결이 다소 부자연스럽고, ‘방과 그 문’은 출입구라는 관계를 충분히 드러내지 못합니다.
  naturalness: ‘또 그 문들의 문설주 곁에 방 하나와 그 출입문이 있고’로 하면 현대 표준어 합쇼체의 설명적 문체를 유지하면서 건축 묘사의 관계가 더 명료해집니다. ‘씻어 냅니다’는 띄어쓰기상 가능하나, 여기서는 단순하고 중립적인 ‘씻습니다’가 자연스럽습니다.
