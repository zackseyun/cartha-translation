base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/038.yaml
  text: There was a chamber with its doorway by the gateposts of the gates[a]; there they would rinse the burnt offering.
  footnotes:
  - marker: a
    text: The Hebrew architectural term rendered 'gateposts' may also be understood as 'vestibules,' 'projecting pillars,' or a similar structural feature of the gate complex.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 문설주들 곁에는 방과 그 문이 있으며, 그곳에서 그들은 번제물을 씻어 냅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 이 건축 용어는 ‘문설주’로 옮길 수 있지만, ‘현관부’나 ‘돌출 기둥’ 같은 구조로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁכָּה
  english_pob_choice: a chamber
  chosen_korean: 방
  alternatives_korean:
  - 방
  - 곁방
  - 전실
  lexicon: HALOT
  rationale: 성전·문 구조의 맥락상 ‘chamber’는 단순한 일반실보다 부속 공간을 가리키므로, 한국어에서는 지나치게 전문적인 느낌을 피하면서도 기능을 드러내는 ‘방’으로 옮겼습니다.
- source_word: וּפִתְחָהּ
  english_pob_choice: with its doorway
  chosen_korean: 그 문이 있으며
  alternatives_korean:
  - 그 문이 있으며
  - 그 입구가 있으며
  - 그 문이 있고
  lexicon: HALOT
  rationale: 접속된 명사구를 자연스러운 한국어로 풀어 ‘방과 그 문’으로 처리해, 방의 출입구를 함께 언급하는 구조를 살렸습니다.
- source_word: בְּאֵילִים
  english_pob_choice: by the gateposts
  chosen_korean: 문설주들 곁에는
  alternatives_korean:
  - 문설주들 곁에는
  - 기둥들 곁에는
  - 문기둥들 곁에는
  lexicon: HALOT
  rationale: אֵילִים는 문 구조의 돌출부/기둥류를 가리키는 기술어로 이해될 수 있어, 가장 접근 가능한 표현인 ‘문설주들’로 옮기되 복수성을 유지했습니다.
- source_word: יָדִיחוּ
  english_pob_choice: they would rinse
  chosen_korean: 씻어 냅니다
  alternatives_korean:
  - 씻어 냅니다
  - 헹굽니다
  - 씻습니다
  lexicon: HALOT
  rationale: 제의적 예비 동작으로서 ‘rinse’의 의미를 살리기 위해 ‘씻어 내다’ 계열을 택했고, 서술문의 관습적·기능적 현재로 옮겼습니다.
theological_decisions:
- issue: 제의적 행위의 명시성
  chosen_reading: 번제물을 단순한 ‘제물’이 아니라 ‘번제물’로 분명히 옮겼습니다.
  alternative_readings:
  - 제물
  - 번제
  rationale: 원문 הָעֹלָה는 번제 제의를 가리키므로, 성전 환상 문맥에서 제의적 의미가 흐려지지 않도록 구체성을 유지했습니다.
  doctrine_reference: 레위기 1장 번제 규정, 에스겔 40장 성전 환상
