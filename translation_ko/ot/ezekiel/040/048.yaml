id: EZK.40.48
reference: Ezekiel 40:48
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְבִאֵ/נִי֮ אֶל אֻלָ֣ם הַ/בַּיִת֒ וַ/יָּ֨מָד֙ אֵ֣ל אֻלָ֔ם חָמֵ֤שׁ אַמּוֹת֙ מִ/פֹּ֔ה וְ/חָמֵ֥שׁ אַמּ֖וֹת מִ/פֹּ֑ה וְ/רֹ֣חַב הַ/שַּׁ֔עַר שָׁלֹ֤שׁ אַמּוֹת֙ מִ/פּ֔וֹ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת מִ/פּֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/048.yaml
  text: 'Then he brought me to the vestibule of the house[a], and he measured the jambs of the vestibule: five cubits on this side and five cubits on that side[c][b]; and the width of the gate was three cubits on this side and three cubits on that side.'
  footnotes:
  - marker: a
    text: Or 'portico' or 'porch' for 'vestibule.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house'; in this vision, the temple building is meant.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term rendered 'jambs' is an architectural word that can also be translated 'posts' or 'side pillars.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 집[a]의 현관으로 데리고 갔습니다. 그가 현관의 문설주[b]를 재니, 이쪽은 다섯 규빗이요 저쪽도 다섯 규빗이었고, 문간의 너비는 이쪽은 세 규빗이요 저쪽도 세 규빗이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 문자적으로는 집이지만, 이 환상에서는 성전 건물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘문설주’는 원문의 건축 용어로, 문 양옆의 구조물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֻלָם
  english_pob_choice: vestibule
  chosen_korean: 현관
  alternatives_korean:
  - 전실
  - 포티코
  - 현관홀
  lexicon: HALOT
  rationale: 성전 건축 맥락에서 प्रवेश부 앞 공간을 가리키므로, 한국어로는 기능적으로 자연스러운 ‘현관’이 가장 간명합니다.
- source_word: הַבַּיִת
  english_pob_choice: the house
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 건물
  lexicon: HALOT
  rationale: 원문은 문자적으로 ‘집’이지만, 에스겔의 환상에서는 성전 건물을 뜻하므로 본문 의미를 유지하면서도 원문 감각을 살려 ‘집’으로 옮겼습니다.
- source_word: אֵל אֻלָם
  english_pob_choice: the jambs of the vestibule
  chosen_korean: 현관의 문설주
  alternatives_korean:
  - 현관의 기둥
  - 현관의 옆기둥
  - 현관의 문기둥
  lexicon: HALOT
  rationale: 측정 대상은 प्रवेश구 양옆의 구조물로, 한국어 건축어휘에서는 ‘문설주’가 가장 정확하고 간결합니다.
- source_word: שַׁעַר
  english_pob_choice: gate
  chosen_korean: 문간
  alternatives_korean:
  - 문
  - שער
  - 대문
  lexicon: HALOT
  rationale: 이 문맥에서는 출입구의 폭을 말하므로 ‘문간’이 문턱/통로의 너비를 자연스럽게 드러내며, 단순한 문짝보다 원문 의도에 가깝습니다.
- source_word: אַמּוֹת
  english_pob_choice: cubits
  chosen_korean: 규빗
  alternatives_korean:
  - 큐빗
  - 자
  lexicon: HALOT
  rationale: 성서 도량형의 표준 음역으로 ‘규빗’을 사용해 독자가 고대 측량 표현임을 바로 알 수 있게 했습니다.
theological_decisions:
- issue: 환상 속 측량 보고의 문체
  chosen_reading: 서술체를 유지해 측량의 반복성과 정확성을 그대로 드러냈습니다.
  alternative_readings:
  - 보다 풀어서 설명하는 방식
  - 현대 건축용어로 완전히 치환하는 방식
  rationale: 본문은 상징적 환상 안의 정밀한 측량을 기록하므로, 설명을 덧붙이기보다 측정 결과를 직접 제시하는 편이 원문의 기능을 잘 보존합니다.
  doctrine_reference: 성전 환상 본문의 문학적·예언적 성격
- issue: ‘집’과 ‘현관’의 결합
  chosen_reading: ‘집’은 원문을 따라 두고, 공간명은 한국어 건축어로 자연화했습니다.
  alternative_readings:
  - 일관되게 ‘성전’으로 번역
  - 모든 공간을 직역하여 낯선 구조를 유지
  rationale: 원문이 architectural imagery를 유지하므로, 본문의 상징성을 훼손하지 않으면서도 한국어 가독성을 확보하는 균형을 택했습니다.
  doctrine_reference: 에스겔 40장의 성전 환상
