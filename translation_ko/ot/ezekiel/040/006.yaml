- from: 그가 동쪽을 향한 그 문으로 들어가서, 그 층계들을 올라가며 문의 문지방을 측량하니, 한 갈대 너비였습니다. 또 다른 문지방도 한 갈대 너비였습니다.[a]
  to: 그는 동쪽을 향한 문으로 가서 그 층계를 올라갔습니다. 그리고 그 문의 문지방을 측량하니, 너비가 한 갈대였습니다. 또 다른 문지방도 너비가 한 갈대였습니다.[a]
