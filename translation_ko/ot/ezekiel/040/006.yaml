source:
  edition: WLC
  text: וַ/יָּב֗וֹא אֶל שַׁ֨עַר֙ אֲשֶׁ֤ר פָּנָי/ו֙ דֶּ֣רֶךְ הַ/קָּדִ֔ימָ/ה וַ/יַּ֖עַל ב/מעלות/ו וַ/יָּ֣מָד אֶת סַ֣ף הַ/שַּׁ֗עַר קָנֶ֤ה אֶחָד֙ רֹ֔חַב וְ/אֵת֙ סַ֣ף אֶחָ֔ד קָנֶ֥ה אֶחָ֖ד רֹֽחַב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/006.yaml
  text: 'Then he came to the gate that faced east[a], and he went up its steps and measured the threshold of the gate: one reed wide. And the other threshold was one reed wide.'
  footnotes:
  - marker: a
    text: Or, "And one threshold was one reed wide." The Hebrew says "one threshold," but in context it likely refers to the corresponding threshold on the other side of the gate.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 동쪽을 향한 그 문으로 들어가서, 그 층계들을 올라가며 문의 문지방을 측량하니, 한 갈대 너비였습니다. 또 다른 문지방도 한 갈대 너비였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또 다른 문지방을 가리키는 뜻입니다. 히브리어는 직역하면 ‘하나의 문지방’이지만, 문맥상 맞은편의 대응 문지방을 뜻하는 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר
  english_pob_choice: gate
  chosen_korean: 문
  alternatives_korean:
  - 성문
  - 게이트
  lexicon: HALOT
  rationale: 여기서는 건축 구조의 일부로 측량되는 입구를 가리키므로, 자연스럽고 간결한 표준어인 ‘문’이 가장 적절합니다. 문맥상 단순한 출입문이 아니라 문 전체 구조를 뜻하므로 번역이 과도하게 축소되지는 않습니다.
- source_word: אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִימָה
  english_pob_choice: that faced east
  chosen_korean: 동쪽을 향한
  alternatives_korean:
  - 동쪽을 마주한
  - 동쪽 쪽을 향한
  lexicon: HALOT
  rationale: 직역하면 ‘그 얼굴/앞이 동쪽을 향한’이지만, 한국어에서는 방향을 나타내는 관용적 표현인 ‘동쪽을 향한’이 가장 자연스럽고 원문의 방향성을 잘 보존합니다.
- source_word: בְּמַעֲלֹתָיו
  english_pob_choice: its steps
  chosen_korean: 그 층계들을
  alternatives_korean:
  - 그 계단들을
  - 그 층계를
  lexicon: HALOT
  rationale: 문에 이르는 상승 경로의 여러 ‘steps’를 문맥상 자연스럽게 드러내기 위해 ‘층계들’을 택했습니다. 단수처럼 들리지 않도록 복수 표지를 살렸습니다.
- source_word: סַף הַשַּׁעַר
  english_pob_choice: the threshold of the gate
  chosen_korean: 문지방
  alternatives_korean:
  - 문턱
  - 문의 문지방
  - 문턱 부분
  lexicon: HALOT
  rationale: 측량되는 건축 요소는 ‘threshold/sill’이므로 ‘문지방’이 가장 정확합니다. 앞의 ‘문의’는 원문의 관계를 분명히 하기 위해 덧붙였습니다.
- source_word: קָנֶה אֶחָד רֹחַב
  english_pob_choice: one reed wide
  chosen_korean: 한 갈대 너비
  alternatives_korean:
  - 갈대 한 자
  - 한 갈대만큼 넓이
  lexicon: HALOT
  rationale: 측량 단위인 ‘갈대’를 그대로 살려 원문의 척도 감각을 유지했습니다. ‘너비’는 רֹחַב의 명사적 의미를 자연스럽게 전달합니다.
- source_word: וְאֵת סַף אֶחָד
  english_pob_choice: And the other threshold
  chosen_korean: 또 다른 문지방
  alternatives_korean:
  - 그리고 하나의 문지방
  - 다른 하나의 문지방
  lexicon: HALOT
  rationale: 히브리어의 ‘하나’는 여기서 대응되는 반대편 문지방을 가리키는 분배적 표현이므로, 한국어에서는 의미를 분명히 하는 ‘또 다른’으로 옮겼습니다.
