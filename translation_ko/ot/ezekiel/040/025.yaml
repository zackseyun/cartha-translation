  text: וְ/חַלּוֹנִ֨ים ל֤/וֹ ו/ל/אילמ/ו סָבִ֣יב סָבִ֔יב כְּ/הַ/חֲלֹּנ֖וֹת הָ/אֵ֑לֶּה חֲמִשִּׁ֤ים אַמָּה֙ אֹ֔רֶךְ וְ/רֹ֕חַב חָמֵ֥שׁ וְ/עֶשְׂרִ֖ים אַמָּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/025.yaml
  text: And it had windows all around[a], and its porch also had windows all around, like these windows. The length was fifty cubits, and the width twenty-five cubits.
  footnotes:
  - marker: a
    text: Or 'vestibule' or 'portico' for 'porch' (Hebrew אֵילָם), an architectural term in Ezekiel's temple vision.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것에는 사방으로 창문들이 있었고, 그 현관에도 사방으로 창문들이 있었습니다. 이 창문들과 같았으며, 길이는 오십 규빗, 너비는 스물다섯 규빗이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 건축 용어로 ‘전실’, ‘주랑’이라고 옮길 수 있습니다(히브리어 אֵילָם).
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלּוֹנִים
  english_pob_choice: windows
  chosen_korean: 창문들
  alternatives_korean:
  - 창들
  - 개구부들
  lexicon: HALOT
  rationale: 건축 맥락에서 חַלּוֹנִים은 문자 그대로 ‘창문들’을 뜻하므로, 자연스러운 현대 한국어인 ‘창문들’로 옮겼습니다.
- source_word: לוֹ
  english_pob_choice: it had
  chosen_korean: 그것에는
  alternatives_korean:
  - 그것이 가지고 있었습니다
  - 그것에 있었습니다
  lexicon: HALOT
  rationale: 히브리어 소유/존재 표현을 한국어에서는 ‘그것에는’으로 풀어, 기계적인 소유 관계보다 구조물에 딸린 상태를 살렸습니다.
- source_word: וְלְאֵילָמָו
  english_pob_choice: and its porch also had windows
  chosen_korean: 그 현관에도 창문들이 있었습니다
  alternatives_korean:
  - 그 포치에도 창문들이 있었습니다
  - 그 전실에도 창문들이 있었습니다
  lexicon: HALOT
  rationale: אֵילָם은 에스겔 성전 환상에서 구조물의 돌출된 현관/전실을 가리키므로, 읽기 쉬운 ‘현관’으로 옮겼습니다.
- source_word: סָבִיב סָבִיב
  english_pob_choice: all around
  chosen_korean: 사방으로
  alternatives_korean:
  - 둘레에 둘레에
  - 온 사방에
  lexicon: HALOT
  rationale: 중첩된 표현의 둘레 강조를 한국어의 간결한 관용 표현인 ‘사방으로’로 압축했습니다.
theological_decisions:
- issue: 에스겔 성전 환상의 건축 묘사 어조
  chosen_reading: 수치와 구조를 그대로 전달하는 기술문으로 유지했습니다.
  alternative_readings:
  - 의미를 풀어 상징적으로 해석하는 번역
  - 전통 성전 용어를 관습적으로 바꾸는 번역
  rationale: 이 절은 상징 해설보다 건축 치수와 배치를 정확히 전달하는 것이 핵심이므로, 본문의 관찰적 어조를 유지했습니다.
  doctrine_reference: 성전 환상 본문(에스겔 40장)의 문맥적 기술성
- issue: אֵילָם의 용어 선택
  chosen_reading: ‘현관’으로 번역하되, 구조물의 건축 용어임을 살렸습니다.
  alternative_readings:
  - 전통 번역의 ‘주랑’
  - 직역형 ‘포치/포르티코’
  rationale: 한국어 성경 독자가 바로 이해할 수 있으면서도 환상 속 건축 요소라는 점을 잃지 않는 중간 지점을 택했습니다.
  doctrine_reference: 성전 환상 건축 용어의 문맥적 정확성
