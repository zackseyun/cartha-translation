  - severity: low
    issue: 장소 표현의 중복
    rationale: ‘안쪽 문 바깥에는 … 안뜰에’는 원문의 두 위치 정보를 보존하지만 한국어 어순상 다소 무겁습니다. ‘안뜰, 곧 안쪽 문 바깥에’로 재배치해 의미를 유지할 수 있습니다.
  - severity: low
