  rationale: 문두의 연결감과 공간적 위치를 함께 살리기 위해 ‘그리고 ... 바깥에는’으로 옮겼습니다.
- source_word: לִשְׁכוֹת שָׁרִים
  english_pob_choice: chambers for singers
  chosen_korean: 노래하는 사람들을 위한 방들
  alternatives_korean:
