base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/044.yaml
  text: And outside the inner gate were chambers for singers in the inner court[a], which were beside the shoulder of the north gate, with their front toward the south; one was beside the shoulder of the east gate[c][b], facing toward the north.
  footnotes:
  - marker: a
    text: Or 'beside the side of the north gate.' The Hebrew uses 'shoulder' metaphorically for the side or flank of a structure.
    reason: lexical_alternative
  - marker: b
    text: Or 'beside the side of the east gate.' The Hebrew again uses 'shoulder' for the side of the gate structure.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew text of this verse is syntactically compressed, and some translations smooth the layout description differently; the sense is that singer-chambers stood in the inner court near the north and east gates, with opposite orientations southward and northward.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 안쪽 문 바깥에는 노래하는 사람들을 위한 방들이 안뜰에 있었는데[a], 북쪽 문의 곁에 있었고 그 앞은 남쪽을 향해 있었습니다. 하나는 동쪽 문의 곁에 있었고[b][c], 그 앞은 북쪽을 향해 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 건축물의 ‘곁/옆면’을 뜻하는 כֶּתֶף를 문자적으로는 ‘어깨’처럼 표현합니다. 여기서는 자연스러운 한국어를 위해 ‘곁에’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 이 위치도 같은 건축 용어 כֶּתֶף로 표현합니다. 한국어에서는 문맥상 ‘동쪽 문의 곁에’가 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: 문장이 매우 압축되어 있어, 일부 번역은 배치 순서를 조금 다듬어 표현합니다. 뜻은 안뜰 안쪽의 북문과 동문 근처에 노래하는 사람들의 방들이 배치되었다는 것입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִחוּצָה
  english_pob_choice: And outside
  chosen_korean: 그리고 ... 바깥에는
  alternatives_korean:
  - 그리고 ... 밖에는
  - 또 ... 바깥에는
  lexicon: HALOT
  rationale: 문두의 연결감과 공간적 위치를 함께 살리기 위해 ‘그리고 ... 바깥에는’으로 옮겼습니다.
- source_word: לִשְׁכוֹת שָׁרִים
  english_pob_choice: chambers for singers
  chosen_korean: 노래하는 사람들을 위한 방들
  alternatives_korean:
  - 성가대 방들
  - 노래하는 이들을 위한 방들
  lexicon: HALOT
  rationale: לִשְׁכּוֹת는 성전 건축 맥락의 ‘방/별실’이 자연스럽고, שָׁרִים은 직역보다 기능을 드러내는 ‘노래하는 사람들’이 적절합니다.
- source_word: אֶל כֶּתֶף שַׁעַר הַצָּפוֹן / אֶל כֶּתֶף שַׁעַר הַקָּדִים
  english_pob_choice: beside the shoulder of the north gate / east gate
  chosen_korean: 북쪽 문의 곁에 / 동쪽 문의 곁에
  alternatives_korean:
  - 북쪽 문의 옆면에
  - 북쪽 문의 어깨에
  lexicon: HALOT
  rationale: כֶּתֶף의 문자적 ‘어깨’를 한국어 본문에 그대로 두면 어색하므로, 건축 위치를 자연스럽게 드러내는 ‘곁에’로 풀어 옮겼습니다.
- source_word: וּפְנֵיהֶם דֶּרֶךְ הַדָּרוֹם / פְּנֵי דֶּרֶךְ הַצָּפוֹן
  english_pob_choice: with their front toward the south / facing toward the north
  chosen_korean: 그 앞은 남쪽을 향해 있었습니다 / 그 앞은 북쪽을 향해 있었습니다
  alternatives_korean:
  - 남쪽을 향하고 있었습니다
  - 북쪽을 향하고 있었습니다
  lexicon: HALOT
  rationale: פָּנִים의 방향성을 ‘앞’과 ‘향하다’로 풀어, 구조물의 면/전면이 지닌 공간적 지시를 유지했습니다.
theological_decisions:
- issue: 성전 환상에서의 방 배치 묘사와 문학적 압축
  chosen_reading: 원문의 압축된 배치 설명을 풀어 쓰되, 두 구역의 방향 대비(남쪽/북쪽)를 그대로 보존했습니다.
  alternative_readings:
  - 문장 구조를 더 매끈하게 재배열하는 번역
  - ‘한쪽은 ... 다른 한쪽은 ...’ 식의 설명적 번역
  rationale: 히브리어는 축약된 건축 묘사이므로, 한국어에서는 이해 가능성을 위해 약간 풀되 본문의 공간 대조를 손상하지 않도록 했습니다.
  doctrine_reference: Ezekiel’s temple vision; source-text clarity over smoothing
