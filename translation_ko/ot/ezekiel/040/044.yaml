base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/044.yaml
  text: And outside the inner gate were chambers for singers in the inner court[a], which were beside the shoulder of the north gate, with their front toward the south; one was beside the shoulder of the east gate[c][b], facing toward the north.
  footnotes:
  - marker: a
    text: Or 'beside the side of the north gate.' The Hebrew uses 'shoulder' metaphorically for the side or flank of a structure.
    reason: lexical_alternative
  - marker: b
    text: Or 'beside the side of the east gate.' The Hebrew again uses 'shoulder' for the side of the gate structure.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew text of this verse is syntactically compressed, and some translations smooth the layout description differently; the sense is that singer-chambers stood in the inner court near the north and east gates, with opposite orientations southward and northward.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 안뜰, 곧 안쪽 문 바깥에 노래하는 이들을 위한 방들이 있었습니다. 그 방들은 북쪽 문의 곁에 있었고, 그 방들의 앞면은 남쪽을 향해 있었습니다[a]. 또 하나는 동쪽 문의 곁에 있었고, 그 앞면은 북쪽을 향해 있었습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כֶּתֶף는 문자적으로 ‘어깨’이지만, 여기서는 건축물의 곁이나 옆면을 가리킵니다. 따라서 ‘북쪽 문의 곁에’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 동쪽 문의 위치에도 같은 건축 용어 כֶּתֶף를 사용합니다. 문맥상 ‘동쪽 문의 곁에’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 문장은 매우 압축되어 있어 배치 관계를 조금 다르게 다듬어 옮기는 번역들도 있습니다. 요지는 안뜰에 있는 노래하는 이들의 방들이 북문과 동문 곁에 있으며, 각각 남쪽과 북쪽을 향한다는 것입니다.
    reason: alternative_reading
lexical_decisions:
