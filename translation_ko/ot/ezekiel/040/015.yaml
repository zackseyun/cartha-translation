  source_fidelity: 핵심 측량 관계와 ‘오십 규빗’은 충실하게 옮겼습니다. 다만 같은 שַׁעַר를 앞에서는 ‘성문’, 뒤에서는 ‘문’으로 달리 번역하여 건축 용어의 지시 대상이 불균형하며, ‘안쪽 문의 현관’은 소유·수식 관계가 다소 불분명합니다. ‘바깥 문’과 ‘안쪽 문 현관’으로 통일하면 히브리어의 구조를 더 명료하게 반영합니다.
