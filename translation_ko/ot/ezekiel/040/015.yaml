base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/015.yaml
  text: And from the front of the outer gateway to the front of the vestibule of the inner gate was fifty cubits[a][b][c].
  footnotes:
  - marker: a
    text: Hebrew text is difficult at 'the outer gateway'; the underlying term is unusual here. Many interpreters understand it to mean the outer gate/gateway from the context of the surrounding measurements.
    reason: textual_variant
  - marker: b
    text: Or 'porch' for 'vestibule.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'gate' may also be rendered 'gateway' in this chapter because it refers to a gate-complex rather than only the doors.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 바깥 문 앞에서 안쪽 문 현관 앞까지의 거리는 오십 규빗이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문에서 ‘바깥’에 해당하는 말은 이곳에서 난해합니다. 주변의 측량 문맥상 바깥 문, 곧 바깥 문 구조물을 가리키는 것으로 이해하는 견해가 많습니다.
    reason: textual_variant
  - marker: b
    text: ‘현관’은 ‘주랑’ 또는 ‘포치’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 장에서 ‘문’은 단순한 문짝뿐 아니라 문 구조물 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  english_pob_choice: And from
  chosen_korean: 그리고 …부터
  alternatives_korean:
  - 그리고 …에서
  - 또 …에서
  lexicon: HALOT
  rationale: 측정 구문에서 시작점을 표시하므로, 단순 연결이 아니라 거리의 출발점을 나타내는 ‘…부터’를 택했습니다.
- source_word: הַשַּׁעַר / הַשַּׁעַר הַפְּנִימִי
  english_pob_choice: the gateway / the inner gate
  chosen_korean: 성문 / 안쪽 문
  alternatives_korean:
  - 문
  - 게이트
  lexicon: HALOT
  rationale: 이 장의 שׁער는 문짝보다 문-구조 전체를 가리키므로, ‘성문’으로 옮겨 건축적 의미를 살렸습니다. 다만 한국어 문맥의 자연스러움을 위해 두 번째는 ‘안쪽 문’으로 간결하게 처리했습니다.
- source_word: אֻלָם
  english_pob_choice: the vestibule
  chosen_korean: 현관
  alternatives_korean:
  - 주랑
  - 포치
  lexicon: HALOT
  rationale: 성전 건축 용어로서 प्रवेश 공간을 가리키므로, 현대 한국어에서 가장 기능적으로 가까운 ‘현관’을 택했습니다.
- source_word: חֲמִשִּׁים אַמָּה
  english_pob_choice: fifty cubits
  chosen_korean: 오십 규빗
  alternatives_korean:
  - 쉰 규빗
  - 오십 자
  lexicon: HALOT
  rationale: 규빗은 성경 측량 단위로서 관용적이고, ‘오십’은 본문의 수량을 직접 드러냅니다.
theological_decisions:
- issue: ‘외부/바깥’와 ‘내부/안쪽’의 건축적 대비를 어떻게 드러낼지
  chosen_reading: 측량 대상이 성문 복합체의 바깥쪽과 안쪽을 잇는 거리임을 분명히 드러냈습니다.
  alternative_readings:
  - 바깥문/내문
  - 외문/내문
  rationale: 본문의 의미는 신학적 해석보다 건축 측량의 정확성에 있으므로, 문맥상 대비되는 공간 관계를 가장 분명하게 표현했습니다.
  doctrine_reference: Ezekiel 40의 성전 환상 측량 문맥
