translation:
  language: ko
  text: 그 현관은 바깥뜰을 향하고 있었고, 그 기둥들에는 종려나무 모양이 있었으며, 거기로 올라가는 층계는 여덟 개였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 성전 건축 용어는 전문적이어서, 번역본에 따라 ‘현관/전실/주랑’처럼 다르게 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלַמּוֹ
  english_pob_choice: its portico
  chosen_korean: 그 현관
  alternatives_korean:
  - 그 포르티코
  - 그 전실
  - 그 주랑
  lexicon: HALOT
  rationale: 성전 환상 문맥의 건축 용어로, 현대 한국어에서는 기능적으로 ‘현관’이 가장 자연스럽고, 지나치게 내부 공간처럼 들리는 ‘전실’보다 구조를 잘 드러냅니다.
- source_word: אֶל חָצֵר הַחִיצוֹנָה
  english_pob_choice: faced the outer court
  chosen_korean: 바깥뜰을 향하고 있었고
  alternatives_korean:
  - 바깥뜰을 마주하고 있었고
  - 바깥뜰 쪽에 있었고
  - 바깥뜰을 향하여 있었다
  lexicon: HALOT
  rationale: 방향성 אֶל을 한국어에서는 ‘향하고 있었다’로 옮겨, 단순 위치가 아니라 외뜰 쪽을 향한 배치를 분명하게 나타냈습니다.
- source_word: תִמֹרִים
  english_pob_choice: palm trees
  chosen_korean: 종려나무 모양이
  alternatives_korean:
  - 종려나무 장식이
  - 야자나무 모양이
  - 종려 장식이
  lexicon: HALOT
  rationale: 건축 장식의 형상을 가리키므로 실제 나무라기보다 ‘모양’으로 처리해 맥락을 살렸고, 성경적 통용을 고려해 ‘종려나무’를 유지했습니다.
- source_word: מַעֲלוֹת שְׁמוֹנֶה
  english_pob_choice: eight steps
  chosen_korean: 층계는 여덟 개였습니다
  alternatives_korean:
  - 계단은 여덟 개였습니다
  - 계단 여덟 개가 있었습니다
  - 여덟 층계가 있었습니다
  lexicon: HALOT
  rationale: 여기서는 단순한 계단 수를 말하므로 가장 자연스러운 현대어인 ‘층계’와 수량 표현을 사용했습니다.
theological_decisions:
- issue: 성전 건축 묘사의 직역성과 가독성
  chosen_reading: 전문 건축 용어를 과도하게 풀지 않고, 한국어 독자가 구조적 배치를 바로 그릴 수 있도록 직역에 가까운 표현을 택했습니다.
  alternative_readings:
  - 의역하여 ‘문간채’나 ‘문채’로 풀기
  - 전통 교회어휘에 맞춰 더 장중하게 다듬기
  rationale: 이 절은 예언적 환상 속 성전의 상세 도면을 전달하므로, 의미를 흐리는 장식적 번역보다 시각적 정확성이 우선입니다.
  doctrine_reference: 에스겔 40장의 성전 환상은 묘사 자체가 메시지 전달의 핵심이므로, 건축 디테일을 보존하는 번역 원칙을 따릅니다.
