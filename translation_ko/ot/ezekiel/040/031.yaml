  text: Its portico faced the outer court[a], and palm trees were on its jambs, and eight steps went up to it.
  footnotes:
  - marker: a
    text: Or 'its vestibule ... its pilasters'; the Hebrew architectural terms in Ezekiel 40 are specialized and sometimes rendered differently in English versions.
