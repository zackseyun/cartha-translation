base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/032.yaml
  text: Then he brought me into the inner court by way of the east[a], and he measured the gate according to these measurements.
  footnotes:
  - marker: a
    text: Or 'the gateway.' The Hebrew שַׁעַר can refer either to the gate itself or to the larger gate structure in this temple vision.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 저를 동쪽 길을 통해 안뜰로 데려갔고, 그 문[a]을 이 치수대로 측량했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘문 구조물’입니다. 히브리어 שַׁעַר은 이 성전 환상에서 문 자체를 가리키기도 하고, 더 큰 문 구조물을 가리키기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  english_pob_choice: Then he brought me
  chosen_korean: 그가 저를 데려가서
  alternatives_korean:
  - 그가 저를 인도해서
  - 그가 저를 데리고 들어가서
  lexicon: HALOT
  rationale: 서술의 연속성을 살리면서 בוא의 사역적 의미를 자연스럽게 옮기기 위해 ‘데려가서’를 택했습니다.
- source_word: הֶחָצֵר הַפְּנִימִי
  english_pob_choice: the inner court
  chosen_korean: 안뜰
  alternatives_korean:
  - 내뜰
  - 안쪽 뜰
  lexicon: HALOT
  rationale: 성전 환상 맥락에서 חָצֵר의 공간성을 살리되, 한국어로 간결하고 읽기 쉬운 ‘안뜰’이 가장 자연스럽습니다.
- source_word: דֶּרֶךְ הַקָּדִים
  english_pob_choice: by way of the east
  chosen_korean: 동쪽 길로
  alternatives_korean:
  - 동쪽으로 난 길로
  - 동편 길로
  lexicon: HALOT
  rationale: דֶּרֶךְ를 ‘길’로 풀고 הַקָּדִים을 ‘동쪽’으로 옮겨, 이동 경로를 분명하게 표현했습니다.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  english_pob_choice: according to these measurements
  chosen_korean: 이 측량들에 따라
  alternatives_korean:
  - 이 기준에 따라
  - 이 치수에 따라
  lexicon: HALOT
  rationale: 성전 건축 문맥의 측량/치수 개념을 유지하기 위해 ‘측량’으로 옮겼고, כְּ의 부합 의미를 ‘~에 따라’로 자연스럽게 살렸습니다.
theological_decisions:
- issue: שַׁעַר의 번역 범위
  chosen_reading: ‘문’으로 옮기되, 건축 구조물 전체를 가리킬 수 있는 여지는 남겼습니다.
  alternative_readings:
  - ‘문지방’
  - ‘문관문’
  rationale: 이 절은 측량 행위에 초점이 있고, 한국어 ‘문’은 gate/gateway 모두를 포괄할 수 있어 본문 흐름을 과하게 좁히지 않습니다.
  doctrine_reference: 본문 해석/성전 환상 문맥
- issue: ‘동쪽’의 방향 표현
  chosen_reading: ‘동쪽 길로’라고 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘동편으로’
  - ‘동쪽을 통해’
  rationale: 하나님의 성전 환상에서 방향 표지는 단순 지리 정보이므로, 의미를 약화시키지 않는 범위에서 직접적으로 옮겼습니다.
  doctrine_reference: 본문의 공간적 지시
