source:
  edition: WLC
  text: בְּ/עֶשְׂרִ֣ים וְ/חָמֵ֣שׁ שָׁנָ֣ה לְ֠/גָלוּתֵ/נוּ בְּ/רֹ֨אשׁ הַ/שָּׁנָ֜ה בֶּ/עָשׂ֣וֹר לַ/חֹ֗דֶשׁ בְּ/אַרְבַּ֤ע עֶשְׂרֵה֙ שָׁנָ֔ה אַחַ֕ר אֲשֶׁ֥ר הֻכְּתָ֖ה הָ/עִ֑יר בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה הָיְתָ֤ה עָלַ/י֙ יַד יְהוָ֔ה וַ/יָּבֵ֥א אֹתִ֖/י שָֽׁמָּ/ה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/001.yaml
  text: In the twenty-fifth year of our exile[a], at the beginning of the year, on the tenth day of the month, in the fourteenth year after the city had been struck down, on that very day the hand of Yahweh was upon me[b], and he brought me there.
  footnotes:
  - marker: a
    text: 'Hebrew: ''at the head of the year''; this may refer to the New Year observance, but the phrase is rendered more transparently here as ''at the beginning of the year.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'after the city had fallen' / 'after the city had been captured.' The Hebrew more literally says 'after the city had been struck down.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 포로로 끌려간 지 스물다섯째 해, 해의 시작에[a], 그 달 열째 날, 그 성이 쳐부서진 지 열넷째 해가 되는 바로 그날에[b] 야훼의 손이 내 위에 있었습니다. 그분이 나를 그리로 데리고 가셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘해의 머리’라고 합니다. 이 표현은 새해의 절기나 새해 첫날을 가리킬 수도 있으나, 본문에서는 해석을 확정하지 않고 ‘해의 시작’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 성이 함락된 지’ 또는 ‘그 성이 무너진 지’라고 옮길 수 있습니다. 히브리어는 문자적으로 그 성이 ‘쳐서 쓰러뜨려졌다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶשְׂרִים וְחָמֵשׁ שָׁנָה לְגָלוּתֵנוּ
  english_pob_choice: In the twenty-fifth year of our exile
  chosen_korean: 우리 포로 생활의 이십오 년째
  alternatives_korean:
  - 우리 포로 됨의 이십오 년째
  - 우리 추방 생활의 이십오 년째
  lexicon: HALOT
  rationale: גָּלוּת는 단순한 감금보다 ‘포로로 끌려가 있는 상태/유배’의 의미이므로, 본문 맥락에 맞게 포로 생활로 옮겼습니다.
- source_word: בְּרֹאשׁ הַשָּׁנָה
  english_pob_choice: at the beginning of the year
  chosen_korean: 해의 시작 첫머리
  alternatives_korean:
  - 연초에
  - 해의 시작에
  lexicon: HALOT
  rationale: 직역의 ‘연두/새해 첫날’로 단정하기보다, 히브리어의 ‘해의 머리’라는 표현을 드러내면서도 현대 한국어로 자연스럽게 풀었습니다.
- source_word: הֻכְּתָה הָעִיר
  english_pob_choice: the city had been struck down
  chosen_korean: 그 성이 함락된 지
  alternatives_korean:
  - 그 성이 쳐부서진 지
  - 그 성이 무너진 지
  lexicon: HALOT
  rationale: הֻכְּתָה는 문자적으로 ‘맞아 쓰러지다/쳐맞다’의 수동형이어서, 영어 POB의 ‘struck down’에 맞춰 폭력적 함의가 보이도록 하되 한국어에서는 도시 상황에 자연스러운 ‘함락되다’를 택했습니다.
- source_word: יַד יְהוָה
  english_pob_choice: the hand of Yahweh was upon me
  chosen_korean: 야훼의 손이 내 위에 있었습니다
  alternatives_korean:
  - 야훼의 손이 내게 임했습니다
  - 야훼의 능력이 내 위에 있었습니다
  lexicon: HALOT
  rationale: 예언서의 상투적 표현인 ‘손’ 이미지를 유지해 강제성·임재를 함께 드러냈고, 프로젝트 기본값에 따라 יְהוָה를 야훼로 옮겼습니다.
- source_word: וַיָּבֵא אֹתִי שָׁמָּה
  english_pob_choice: and he brought me there
  chosen_korean: 그분이 나를 그리로 데리고 가셨습니다
  alternatives_korean:
  - 그분이 나를 거기로 데리고 가셨습니다
  - 그분이 나를 그곳으로 이끌어 가셨습니다
  lexicon: HALOT
  rationale: וַיָּבֵא는 단순 이동보다 ‘데리고/이끌어 데려가다’의 뉘앙스가 있어, 예언적 인도성을 살리면서도 현대 문체로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 예언적 체험 서술의 강도 유지
  chosen_reading: ‘야훼의 손이 내 위에 있었습니다’와 같이 직접적인 신적 작용 표현을 유지했습니다.
  alternative_readings:
  - ‘야훼께서 나를 붙드셨습니다’
  - ‘야훼의 권능이 내게 임했습니다’
  rationale: 에스겔의 관용구인 ‘여호와의 손/야훼의 손’은 단순한 감정보다 예언적 압도와 계시 개입을 암시하므로, 완화하지 않고 직역에 가깝게 보존했습니다.
  doctrine_reference: 예언서의 계시 수단과 신적 주도성
- issue: 성읍 파괴 표현
  chosen_reading: ‘함락된 지’로 옮겨 도시의 파괴 사건을 역사적·군사적 맥락 속에서 드러냈습니다.
  alternative_readings:
  - ‘무너진 지’
  - ‘빼앗긴 지’
  rationale: 히브리어 수동형은 단순 붕괴보다 공격으로 인한 쓰러짐을 내포하므로, 사건의 폭력성과 역사성을 함께 보존하는 표현을 택했습니다.
  doctrine_reference: 예루살렘 심판과 포로기 역사 이해
