  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣מָד אֶת הַ/שַּׁ֗עַר מִ/גַּ֤ג הַ/תָּא֙ לְ/גַגּ֔/וֹ רֹ֕חַב עֶשְׂרִ֥ים וְ/חָמֵ֖שׁ אַמּ֑וֹת פֶּ֖תַח נֶ֥גֶד פָּֽתַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/013.yaml
  text: 'Then he measured the gateway from the roof of one guardroom to the roof of the other: twenty-five cubits wide[b][a], doorway opposite doorway.'
  footnotes:
  - marker: a
    text: Or 'from the roof of the side room to its roof.' The Hebrew term תָּא refers to a chamber within the gate structure, often understood here as a guardroom.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'doorway opposite doorway,' describing entrances facing each other across the gateway.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그 문루를 한 보초방의 지붕에서 다른 지붕까지 재니, 너비가 스물다섯 규빗이었고, 문곁문이 문곁문과 마주하고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘측실의 지붕에서 그 지붕까지’로도 옮길 수 있습니다. 히브리어 תָּא는 문루 구조 안의 방을 가리키며, 여기서는 보초방으로 이해되는 경우가 많습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘문곁문이 문곁문을 마주하고’입니다. 두 출입구가 서로를 향해 마주 보는 대칭을 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  english_pob_choice: Then he measured
  chosen_korean: 그가 ... 재니
  alternatives_korean:
  - 그가 ... 측정하니
  - 그가 ... 잴 때
  lexicon: HALOT
  rationale: 완료된 서술 진행을 자연스럽게 살리면서도 측량 행위를 분명하게 드러내기 위해 ‘재니’를 사용했습니다.
- source_word: הַשַּׁעַר
  english_pob_choice: the gateway
  chosen_korean: 그 문루
  alternatives_korean:
  - 그 문
  - 그 관문
  lexicon: HALOT
  rationale: 에스겔 40장의 문은 단순한 문짝이 아니라 구조물 전체를 가리키므로, 건축적 뉘앙스를 살리는 ‘문루’가 적절합니다.
- source_word: מִגַּג הַתָּא לְגַגּוֹ
  english_pob_choice: from the roof of one guardroom to the roof of the other
  chosen_korean: 한 보초방의 지붕에서 다른 지붕까지
  alternatives_korean:
  - 한 측실의 지붕에서 그 지붕까지
  - 측실의 지붕에서 지붕까지
  lexicon: HALOT
  rationale: תָּא는 성문 구조 안의 작은 방으로, 문맥상 보초방으로 옮기는 것이 이해를 돕습니다. 대명사 어미는 한국어에서 ‘다른’으로 풀어 양쪽 지붕의 대응을 분명히 했습니다.
- source_word: פֶּתַח נֶגֶד פָּתַח
  english_pob_choice: doorway opposite doorway
  chosen_korean: 문곁문이 문곁문과 마주하고
  alternatives_korean:
  - 문이 문과 마주하고
  - 출입구가 출입구와 마주하고
  lexicon: HALOT
  rationale: 반복되는 명사와 נֶגֶד의 대칭 구조를 살리기 위해 ‘마주하고’로 직역에 가깝게 옮겼습니다. ‘문곁문’은 성문 구조의 출입구라는 기능을 담기 위한 선택입니다.
