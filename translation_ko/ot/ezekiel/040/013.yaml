  source_fidelity: 핵심 치수와 대칭적 출입구의 묘사는 원문에 부합합니다. 다만 פֶּתַח는 여기서 ‘문곁문’이 아니라 출입구/문간을 뜻하며, 현행 표현은 한국어 단어로 성립하지 않아 원문의 건축 용어를 정확히 전달하지 못합니다.
  naturalness: ‘문곁문이 문곁문과’는 비문이며 현대 표준 한국어로 자연스럽지 않습니다. ‘출입구가 출입구와 마주하고 있었습니다’는 히브리어의 반복과 대칭을 보존하면서 자연스럽습니다. 또한 ‘다른 지붕’은 무엇의 지붕인지 다소 생략되어 있으므로 ‘다른 보초방의 지붕’으로 명시하는 편이 분명합니다.
  terminology: ‘문루’는 에스겔 40장의 건축 구조 전체를 가리키는 הַשַּׁעַר의 문맥에 무난합니다. תָּא는 문루 안의 작은 방을 가리키므로 본문의 ‘보초방’ 및 대안 각주의 ‘측실’은 모두 가능한 처리입니다. פֶּתַח는 ‘출입구’로 옮깁니다.
