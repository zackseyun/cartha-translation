  text: And the chamber whose front faces north is for the priests who keep charge of the altar. They are the sons of Zadok[a], who from among the sons of Levi come near to Yahweh to minister to him.
  footnotes:
  - marker: a
    text: Or 'who draw near from among the sons of Levi to the LORD to serve him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 북쪽을 향한 그 방은 제단의 직무를 맡은 제사장들을 위한 것입니다. 그들은 사독의 아들들이니, 레위의 아들들 가운데서 야훼께 가까이 나아가 그분을 섬기는 자들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '레위의 아들들 가운데서 주께 가까이 나아가 그를 섬기는 자들'로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לִּשְׁכָּה
  english_pob_choice: chamber
  chosen_korean: 방
  alternatives_korean:
  - 침실
  - 방(실)
  - 실
  lexicon: HALOT
  rationale: 성전 환상 문맥에서 기능이 정해진 공간이지만, 한국어에서는 '방'이 가장 자연스럽고 과도한 고어화 없이 지정 공간의 의미를 전달합니다.
- source_word: פָּנֶיהָ דֶּרֶךְ הַצָּפוֹן
  english_pob_choice: whose front faces north
  chosen_korean: 북쪽을 향한
  alternatives_korean:
  - 북쪽을 향한 그
  - 북쪽을 바라보는
  - 북쪽 방향의
  lexicon: HALOT
  rationale: 방의 방향을 설명하는 표현이므로, '북쪽을 향한'으로 간결하게 옮겨 건축적 배치를 분명히 했습니다.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת הַמִּזְבֵּחַ
  english_pob_choice: who keep charge of the altar
  chosen_korean: 제단의 직무를 맡은
  alternatives_korean:
  - 제단을 지키는
  - 제단의 책임을 맡은
  - 제단의 경계를 지키는
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת는 단순한 '경비'보다 직무·책임의 의미가 강하므로, 제사장적 역할을 살려 '직무를 맡은'으로 옮겼습니다.
- source_word: בְנֵי צָדוֹק
  english_pob_choice: the sons of Zadok
  chosen_korean: 사독의 아들들
  alternatives_korean:
  - 사독의 자손들
  - 사독의 아들들입니다
  - 사독 집안
  lexicon: HALOT
  rationale: 족보적·제의적 표지를 유지하기 위해 직역에 가까운 '사독의 아들들'을 택했습니다.
- source_word: הַקְּרֵבִים מִ/בְּנֵי לֵוִי אֶל יְהוָה לְשָׁרְתֽוֹ
  english_pob_choice: who from among the sons of Levi come near to Yahweh to minister to him
  chosen_korean: 레위의 아들들 가운데서 야훼께 가까이 나아가 그분을 섬기는 자들
  alternatives_korean:
  - 레위의 아들들 가운데서 야훼께 나아가 그분을 섬기는 자들
  - 레위의 아들들 가운데서 야훼께 접근하여 그분을 섬기는 자들
  - 레위 자손 가운데 야훼께 나아가 섬기는 자들
  lexicon: HALOT
  rationale: קרב의 제의적 뉘앙스를 '가까이 나아가'로 살렸고, לְשָׁרְתוֹ는 성소 봉사의 맥락을 따라 '섬기는'으로 옮겼습니다. מִבְּנֵי לֵוִי의 부분적 선택도 '가운데서'로 드러냈습니다.
theological_decisions:
- issue: 여호와/야훼의 표기와 제의적 접근의 표현
  chosen_reading: 본문의 יְהוָה는 프로젝트 기본값에 따라 '야훼'로 옮기고, 제사장들이 그분께 '가까이 나아간다'는 제의적 특권을 그대로 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주께
  - 하나님께
  rationale: 문서화된 표기 원칙을 따르면서도, הקרב의 성소 접근 의미를 약화시키지 않기 위해 '가까이 나아가'를 유지했습니다.
  doctrine_reference: Project default for יְהוָה; priestly service language in Ezekiel 40
- issue: 사독의 아들들과 레위인 사이의 구분
  chosen_reading: 사독의 아들들을 레위의 아들들 가운데 한 구별된 집단으로 보존했습니다.
  alternative_readings:
  - 레위 사람 전체를 가리키는 표현
  - 사독의 아들들에 대한 후대 신학적 확대
  rationale: 히브리어는 레위인 전체가 아니라 사독 계열을 좁혀 말하므로, 본문의 범위를 넓히지 않고 구별을 유지했습니다.
  doctrine_reference: Priestly hierarchy in Ezekiel 40:46
