    rationale: פָּנֶיהָ는 단순한 북향 이상으로 그 방의 ‘앞면’ 또는 정면의 방향을 가리킵니다. 한국어에서 ‘앞면이 북쪽을 향한’이라고 하면 이 의미를 자연스럽게 보존할 수 있습니다.
