  text: 그 경비실들[a]과 곁기둥들[b]과 현관[c]에는 사방에 창문들이 있었으며, 길이는 오십 규빗이고 너비는 이십오 규빗이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경비실들’은 성전 문 구조에 딸린 작은 방들을 가리킵니다. ‘방들’ 또는 ‘칸들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘곁기둥들’은 문 구조의 측면 기둥 또는 구조물을 가리키는 기술 용어입니다. ‘문설주들’ 또는 ‘벽기둥들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘현관’은 성전 문 앞의 돌출된 입구 공간을 가리킵니다. ‘현관채’ 또는 ‘주랑 현관’으로도 옮길 수 있습니다.
    reason: lexical_alternative
