  text: Its guardrooms[a], its side pillars, and its portico, with windows all around[b], had a length of fifty cubits and a width of twenty-five cubits.
  footnotes:
  - marker: a
    text: Or 'jambs' or 'pilasters' for 'side pillars.' The Hebrew architectural term is somewhat technical.
    reason: lexical_alternative
  - marker: b
    text: Or 'vestibule' or 'porch' for 'portico.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 감방들과 그의 측기둥들과 그의 현관에는 사방으로 창문들이 있었으며, 길이는 오십 규빗이요 너비는 이십오 규빗이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감방들’은 문맥상 성전 문 구조에 딸린 작은 방들을 가리키며, 더 기술적으로는 ‘방들’ 또는 ‘칸들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘현관’은 여기서 성전 문 앞의 돌출된 입구 공간을 가리키며, 더 기술적으로는 ‘포르티코’나 ‘주랑 현관’으로도 옮길 수 있습니다.
    reason: lexical_alternative
