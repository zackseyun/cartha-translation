  text: And there was a barrier of one cubit in front of the side rooms[a], and a barrier of one cubit on the other side[b]; and each side room was six cubits on this side and six cubits on that side.
  footnotes:
  - marker: a
    text: Or 'guardrooms,' 'cells,' or 'alcoves' for 'side rooms' (Hebrew תָּאוֹת), referring to small chambers in the gate structure.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses repeated deictic expressions, literally 'from here' and 'from there,' to indicate the measurements on opposite sides.
    reason: lexical_alternative
translation:
  language: ko
  text: 곁방들[a] 앞에는 한 규빗 너비의 경계 구획이 있었고, 반대편에도 한 규빗 너비의 경계 구획이 있었습니다. 각 곁방은 이쪽으로 여섯 규빗, 저쪽으로도 여섯 규빗이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘곁방들’은 히브리어 תָּאוֹת를 옮긴 말입니다. 문 구조 안의 작은 방들을 가리키며, ‘경비실들’, ‘칸들’, 또는 ‘알코브들’로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘이쪽에서’와 ‘저쪽에서’라는 지시 표현을 반복하여 맞은편 양쪽의 치수를 나타냅니다.
    reason: lexical_alternative
