base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/021.yaml
  text: 'Its guardrooms were three on this side and three on that side[a], and its side pillars and its portico had the same measurements as the first gate: its length was fifty cubits[b], and the width twenty-five cubits.'
  footnotes:
  - marker: a
    text: Or 'jambs' or 'pilasters' for 'side pillars'; the Hebrew architectural term is somewhat uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'vestibule' or 'porch' for 'portico.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 문지기 방은 이쪽에 셋, 저쪽에 셋이 있었고, 그 옆기둥[a]과 현관[b]의 치수도 첫째 성문의 치수와 같았습니다. 길이는 오십 규빗이었고, 너비는 이십오 규빗이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옆기둥’에 해당하는 히브리어 건축 용어는 뜻이 다소 불확실합니다. ‘문설주’ 또는 ‘벽기둥’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘현관’에 해당하는 히브리어는 ‘전실’ 또는 ‘현관채’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּא
  english_pob_choice: guardrooms
  chosen_korean: 문지기 방
  alternatives_korean:
  - 경비실
  - 감시방
  - 작은 방
  lexicon: HALOT
  rationale: 문맥상 성문 구조 안에 있는 작은 방들이며, ‘문지기’라는 기능이 Ezekiel 40장의 용도를 가장 자연스럽게 드러냅니다.
- source_word: שְׁלוֹשָׁה מִפּוֹ ... וּשְׁלֹשָׁה מִפֹּו
  english_pob_choice: three on this side and three on that side
  chosen_korean: 이쪽에도 셋, 저쪽에도 셋
  alternatives_korean:
  - 한쪽에 셋, 다른쪽에 셋
  - 이편에 셋, 저편에 셋
  lexicon: HALOT
  rationale: 대칭 배치를 나타내는 분배 표현이므로, 현대 한국어에서 가장 자연스럽고 간결하게 옮겼습니다.
- source_word: אֵיל
  english_pob_choice: side pillars
  chosen_korean: 옆기둥
  alternatives_korean:
  - 문기둥
  - 기둥
  - 문설주
  lexicon: HALOT
  rationale: 해당 건축 용어의 세부 의미가 다소 불확실하므로, POB의 ‘side pillars’를 반영하되 한국어로는 구조적 요소를 드러내는 ‘옆기둥’을 택했습니다.
- source_word: אֵלַם
  english_pob_choice: portico
  chosen_korean: 현관
  alternatives_korean:
  - 주랑
  - 포티코
  - 전실
  lexicon: HALOT
  rationale: 문 앞 진입 공간을 가리키는 말로, 현대 한국어 성경에서 이해하기 쉬운 ‘현관’이 적절합니다.
- source_word: כְּמִדַּת הַשַּׁעַר הָרִאשׁוֹן
  english_pob_choice: had the same measurements as the first gate
  chosen_korean: 첫째 문과 같은 크기
  alternatives_korean:
  - 첫째 문의 측정과 같았습니다
  - 첫째 문과 같은 측량이었습니다
  lexicon: HALOT
  rationale: 비교 대상의 치수가 동일하다는 뜻을 자연스럽게 풀어, 측량 용어를 과도하게 직역하지 않으면서도 의미를 보존했습니다.
