  text: אֹ֣רֶךְ הָ/אֻלָ֞ם עֶשְׂרִ֣ים אַמָּ֗ה וְ/רֹ֨חַב֙ עַשְׁתֵּ֣י עֶשְׂרֵ֣ה אַמָּ֔ה וּ/בַֽ/מַּעֲל֔וֹת אֲשֶׁ֥ר יַעֲל֖וּ אֵלָ֑י/ו וְ/עַמֻּדִים֙ אֶל הָ֣/אֵילִ֔ים אֶחָ֥ד מִ/פֹּ֖ה וְ/אֶחָ֥ד מִ/פֹּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/049.yaml
  text: The length of the vestibule was twenty cubits, and the width was twelve cubits, and by the steps by which one went up to it; and pillars were beside the sidewalls, one on this side and one on that side.
translation:
  language: ko
  text: 현관의 길이는 이십 규빗이고 너비는 십이 규빗이며, 그것으로 올라가는 계단이 있었습니다. 또 기둥들이 옆벽 곁에 하나는 이쪽에, 하나는 저쪽에 있었습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 문맥상 ‘현관’은 성전의 출입부를 가리키는 건축 용어입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֻלָם / vestibule
  english_pob_choice: vestibule
  chosen_korean: 현관
  alternatives_korean:
  - 주랑
  - 전실
  lexicon: אֻלָם
  rationale: 성전 건축 맥락의 출입 공간을 자연스럽고 과장 없이 옮기기 위해 ‘현관’을 택했습니다.
- source_word: אַמָּה / cubit
  english_pob_choice: cubits
  chosen_korean: 규빗
  alternatives_korean:
  - 자
  - 척
  lexicon: אַמָּה
  rationale: 성경 도량형의 관용 표기인 ‘규빗’이 원문 수치를 그대로 전달합니다.
- source_word: מַעֲלוֹת / steps
  english_pob_choice: steps
  chosen_korean: 계단
  alternatives_korean:
  - 층계
  - 오름
  lexicon: מַעֲלוֹת
  rationale: ‘올라가는’ 동작과 함께 쓰여 출입을 위한 계단 구조를 분명하게 드러내는 말로 옮겼습니다.
- source_word: עַמּוּדִים ... אֵילִים
  english_pob_choice: pillars ... sidewalls
  chosen_korean: 기둥들이 옆벽 곁에
  alternatives_korean:
  - 기둥들이 측벽 곁에
  - 기둥들이 문설주 곁에
  lexicon: עַמּוּדִים / אֵילִים
  rationale: POB의 ‘sidewalls’를 반영해 구조물의 위치 관계를 보존했고, ‘기둥’으로 직역해 건축 묘사를 유지했습니다.
