  text: וְ/אֶל הַ/כָּתֵ֣ף מִ/ח֗וּצָ/ה לָ/עוֹלֶה֙ לְ/פֶ֨תַח֙ הַ/שַּׁ֣עַר הַ/צָּפ֔וֹנָ/ה שְׁנַ֖יִם שֻׁלְחָנ֑וֹת וְ/אֶל הַ/כָּתֵ֣ף הָ/אַחֶ֗רֶת אֲשֶׁר֙ לְ/אֻלָ֣ם הַ/שַּׁ֔עַר שְׁנַ֖יִם שֻׁלְחָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/040.yaml
  text: And on the outer side[a], by the ascent to the entrance of the north gate, were two tables; and on the other side, which belonged to the porch of the gate[c][b], were two tables.
  footnotes:
  - marker: a
    text: Or 'side' / 'flank' for 'shoulder' in this architectural description.
    reason: lexical_alternative
  - marker: b
    text: Or 'at the ascent' or 'where one goes up to the entrance of the north gate.'
    reason: lexical_alternative
  - marker: c
    text: Or 'which was by the porch of the gate'; the Hebrew expression indicates association with the gate's porch/vestibule.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 북쪽 문 입구로 올라가는 곳의 바깥쪽 어깨에는 상이 둘 있었고, 문의 현관에 속한 다른 쪽 어깨에는 상이 둘 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כָּתֵף는 문자적으로는 ‘어깨’이지만, 이 건축 묘사에서는 옆부분이나 돌출부를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘올라가는 곳’은 ‘입구로 올라가는 계단/오름길’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 אֻלָם은 문 앞의 현관, 전실, 주랑을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּתֵף
  english_pob_choice: shoulder
  chosen_korean: 어깨
  alternatives_korean:
  - 옆면
  - 측면
  - 쪽
  lexicon: HALOT
  rationale: 건축 묘사에서 문자적으로는 ‘어깨’이지만, 한국어에서는 구조물의 돌출된 옆부분을 가리키는 생생한 이미지로 살릴 수 있어 본문의 구체성을 보존합니다.
- source_word: מִחוּצָה
  english_pob_choice: outer side
  chosen_korean: 바깥쪽
  alternatives_korean:
  - 외부의
  - 밖의
  - 바깥 면
  lexicon: HALOT
  rationale: 공간 대비를 나타내므로 ‘바깥쪽’이 자연스럽고, 바로 뒤의 ‘어깨’와 결합해 문맥상의 위치를 명확히 드러냅니다.
- source_word: לָעוֹלֶה לְפֶתַח הַשַּׁעַר הַצָּפוֹנָה
  english_pob_choice: by the ascent to the entrance of the north gate
  chosen_korean: 북쪽 문 입구로 올라가는 곳
  alternatives_korean:
  - 북쪽 문의 입구로 올라가는 계단 쪽
  - 북쪽 문의 प्रवेश로로 올라가는 곳
  lexicon: HALOT
  rationale: ‘올라가는 곳’으로 계단/경사로가 있는 접근부를 간결하게 반영했고, ‘문 입구’로 פתח의 प्रवेश적 의미를 살렸습니다.
- source_word: אֻלָם הַשַּׁעַר
  english_pob_choice: porch of the gate
  chosen_korean: 문의 현관
  alternatives_korean:
  - 문의 주랑
  - 문의 전실
  - 문 현관
  lexicon: HALOT
  rationale: אֻלָם은 성전/문 구조에서 ‘현관·전실’에 가까워, 현대 한국어에서 이해되는 ‘현관’이 가장 간명합니다. '속한'을 덧붙여 לְ의 연관 관계도 반영했습니다.
theological_decisions:
- issue: 성전 환상 속 건축 용어의 직역과 가독성 균형
  chosen_reading: 기술적이지만 과도하게 전문화되지 않은 한국어로, 구조적 위치 관계를 눈에 보이듯 옮겼습니다.
  alternative_readings:
  - 건축 전문어를 더 많이 사용한 번역
  - 더 관용적인 평서형 번역
  rationale: 이 절은 신학적 해석보다 성전 구조의 정확한 위치 묘사가 핵심이므로, 원문의 공간 관계를 손상시키지 않는 범위에서 자연스러운 현대어를 택했습니다.
  doctrine_reference: 성전 환상 본문의 서술적 정확성
