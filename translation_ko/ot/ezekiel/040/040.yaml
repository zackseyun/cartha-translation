  text: And on the outer side[a], by the ascent to the entrance of the north gate, were two tables; and on the other side, which belonged to the porch of the gate[c][b], were two tables.
  footnotes:
  - marker: a
    text: Or 'side' / 'flank' for 'shoulder' in this architectural description.
    reason: lexical_alternative
  - marker: b
    text: Or 'at the ascent' or 'where one goes up to the entrance of the north gate.'
    reason: lexical_alternative
  - marker: c
    text: Or 'which was by the porch of the gate'; the Hebrew expression indicates association with the gate's porch/vestibule.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 북쪽 문 입구로 올라가는 곳[b] 곁의 바깥쪽 옆면[a]에는 상이 두 개 있었고, 그 문 현관[c] 쪽의 다른 옆면에도 상이 두 개 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כָּתֵף는 문자적으로 ‘어깨’이지만, 이 건축 묘사에서는 옆부분, 측면, 또는 돌출부를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘올라가는 곳’은 북쪽 문 입구로 올라가는 계단이나 오름길을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 אֻלָם은 문 앞의 현관 또는 전실을 가리킵니다. ‘현관 쪽’은 히브리어 전치사가 나타내는 연관 또는 인접 관계를 옮긴 것입니다.
    reason: lexical_alternative
