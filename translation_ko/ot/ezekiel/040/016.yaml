  - 그들의 파일라스터들
  lexicon: HALOT
  rationale: 해부학적/건축학적 난해어를 한국어로 읽히게 하되, 구조물의 측면 요소라는 의미를 보존하기 위해 ‘옆기둥들’을 택했습니다.
- source_word: אֵלַמּוֹת
  english_pob_choice: the porticos
  chosen_korean: 현관들
  alternatives_korean:
  - 포르티코들
  - 주랑들
  - 베스티뷔르들
  lexicon: HALOT
  rationale: 현대 한국어에서 자연스럽고 입구 구조를 잘 드러내는 대응어로 ‘현관들’을 사용했습니다.
- source_word: תִּמֹרִים
  english_pob_choice: palm-tree decorations
  chosen_korean: 종려나무 장식
  alternatives_korean:
  - 야자나무 장식
  - 종려무늬
  - 종려 장식
  lexicon: HALOT
  rationale: 문맥이 실제 나무가 아니라 장식 요소이므로, POB의 decorative sense를 따라 ‘종려나무 장식’으로 옮겼습니다.
