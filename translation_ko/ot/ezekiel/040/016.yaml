  lexicon: HALOT
  rationale: 에스겔 40장의 성문 구조상 gate chambers를 가리키므로, 기능이 드러나는 ‘보초실’로 옮겼습니다.
- source_word: אֵלֵיהֶמָה
  english_pob_choice: their side pillars
  chosen_korean: 그들의 옆기둥들
  alternatives_korean:
  - 그들의 문설주들
