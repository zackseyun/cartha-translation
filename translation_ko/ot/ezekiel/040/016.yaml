  text: וְ/חַלֹּנ֣וֹת אֲטֻמ֣וֹת אֶֽל הַ/תָּאִ֡ים וְ/אֶל֩ אֵלֵי/הֵ֨מָה לִ/פְנִ֤ימָה לַ/שַּׁ֨עַר֙ סָבִ֣יב סָבִ֔יב וְ/כֵ֖ן לָ/אֵֽלַמּ֑וֹת וְ/חַלּוֹנ֞וֹת סָבִ֤יב סָבִיב֙ לִ/פְנִ֔ימָה וְ/אֶל אַ֖יִל תִּמֹרִֽים־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/016.yaml
  text: And there were recessed windows toward the guardrooms and toward their side pillars[a], inward, all around the gate; and likewise for the porticos. And windows were all around on the inside[c][b], and on each pillar were palm-tree decorations.
  footnotes:
  - marker: a
    text: Or 'closed windows,' 'narrow windows,' or 'windows with recessed frames.' The Hebrew adjective likely describes a particular architectural form rather than windows that could not admit light at all.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew terms for these gateway structural elements (rendered here 'side pillars' and 'pillar') are difficult architectural vocabulary; alternatives include 'jambs' or 'pilasters.'
    reason: lexical_alternative
  - marker: c
    text: Or 'vestibules' or 'porches' for 'porticos.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 보초실과 그들의 옆기둥들을 향하여 안쪽으로, 곧 성문 주위로 사방에 움푹 들어간 창문들이 있었고, 현관들에도 그와 같이 있었습니다. 안쪽으로 사방에 창문들이 있었고, 각 기둥에는 종려나무 장식이 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘움푹 들어간’은 히브리어 אֲטֻמוֹת의 건축적 의미를 살린 번역으로, ‘닫힌’보다 정확하지만 완전히 밀폐되었다는 뜻은 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: ‘옆기둥들’은 이 구절의 건축 용어를 풀어 옮긴 것이며, 문설주나 파일라스터로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘현관들’은 여기의 אֵלַמּוֹת에 대한 자연스러운 한국어 대응어이며, ‘주랑’이나 ‘베스티뷔르’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלֹּנוֹת אֲטֻמוֹת
  english_pob_choice: recessed windows
  chosen_korean: 움푹 들어간 창문들
  alternatives_korean:
  - 닫힌 창문들
  - 좁은 창문들
  - 막힌 창문들
  lexicon: HALOT
  rationale: 아키텍처 문맥에서 단순히 ‘닫힌’으로 옮기면 빛이 전혀 들지 않는다는 뜻으로 오해될 수 있어, POB의 ‘recessed’에 맞게 ‘움푹 들어간’으로 형상을 살렸습니다.
- source_word: הַתָּאִים
  english_pob_choice: the guardrooms
  chosen_korean: 보초실
  alternatives_korean:
  - 측실
  - 방들
  - 경비실
  lexicon: HALOT
  rationale: 에스겔 40장의 성문 구조상 gate chambers를 가리키므로, 기능이 드러나는 ‘보초실’로 옮겼습니다.
- source_word: אֵלֵיהֶמָה
  english_pob_choice: their side pillars
  chosen_korean: 그들의 옆기둥들
  alternatives_korean:
  - 그들의 문설주들
  - 그들의 측면 기둥들
  - 그들의 파일라스터들
  lexicon: HALOT
  rationale: 해부학적/건축학적 난해어를 한국어로 읽히게 하되, 구조물의 측면 요소라는 의미를 보존하기 위해 ‘옆기둥들’을 택했습니다.
- source_word: אֵלַמּוֹת
  english_pob_choice: the porticos
  chosen_korean: 현관들
  alternatives_korean:
  - 포르티코들
  - 주랑들
  - 베스티뷔르들
  lexicon: HALOT
  rationale: 현대 한국어에서 자연스럽고 입구 구조를 잘 드러내는 대응어로 ‘현관들’을 사용했습니다.
- source_word: תִּמֹרִים
  english_pob_choice: palm-tree decorations
  chosen_korean: 종려나무 장식
  alternatives_korean:
  - 야자나무 장식
  - 종려무늬
  - 종려 장식
  lexicon: HALOT
  rationale: 문맥이 실제 나무가 아니라 장식 요소이므로, POB의 decorative sense를 따라 ‘종려나무 장식’으로 옮겼습니다.
