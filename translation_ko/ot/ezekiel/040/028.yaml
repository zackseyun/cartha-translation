  source_fidelity: 히브리어는 그가 화자를 남문을 통하여 내뜰로 데려간 뒤, 그 남문을 앞서 제시된 치수에 맞추어 측량했다고 말합니다. 초안의 문장 구조와 ‘남문으로’는 대체로 이를 반영하지만, 영어 ‘inner court’가 번역문에 그대로 남아 있어 한국어 번역으로는 부적절합니다.
