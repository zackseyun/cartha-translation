language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְבִיאֵ֛/נִי אֶל חָצֵ֥ר הַ/פְּנִימִ֖י בְּ/שַׁ֣עַר הַ/דָּר֑וֹם וַ/יָּ֨מָד֙ אֶת הַ/שַּׁ֣עַר הַ/דָּר֔וֹם כַּ/מִּדּ֖וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/028.yaml
  text: Then he brought me into the inner court by way of the south gate[b][a], and he measured the south gate according to these measurements.
  footnotes:
  - marker: a
    text: Or 'through the south gate.' The Hebrew preposition can indicate entry by means of the gate.
    reason: lexical_alternative
  - marker: b
    text: That is, the gate had the same measurements as those previously described.
    reason: cross_reference
translation:
  language: ko
  text: 그가 나를 남문으로 inner court에 데려갔습니다. 그리고 그 남문을 이 측량대로 측량했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘남문으로’는 प्रवेश 경로를 드러내는 해석을 반영한 번역입니다. 히브리어 전치사 ב는 ‘남문을 통해’라는 뜻도 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이 측량대로’는 앞서 제시된 동일한 규격과 일치함을 뜻합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַ/יְבִיאֵ֛/נִי
  english_pob_choice: Then he brought me
  chosen_korean: 그가 나를 데려갔습니다
  alternatives_korean:
  - 그가 나를 이끌어 갔습니다
  - 그가 나를 데리고 갔습니다
  lexicon: HALOT
  rationale: 히필 של בוא는 ‘데려가다/이끌어 가다’의 뜻이므로, 자연스러운 서술로 옮겼습니다.
- source_word: אֶל חָצֵר הַ/פְּנִימִי
  english_pob_choice: the inner court
  chosen_korean: inner court에
  alternatives_korean:
  - 안뜰에
  - 내뜰에
  lexicon: HALOT
  rationale: חָצֵר הַפְּנִימִי는 성전 환상 문맥의 고유한 건축 용어이므로, 기존 용어를 유지하되 한국어에서는 ‘inner court’로 보존해 주석적 추적성을 살렸습니다.
- source_word: בְּ/שַׁ֣עַר הַ/דָּר֑וֹם
  english_pob_choice: by way of the south gate
  chosen_korean: 남문으로
  alternatives_korean:
  - 남문을 통해
  - 남문을 지나
  lexicon: HALOT
  rationale: ב + שער는 진입의 경로나 수단을 나타낼 수 있으므로, POB의 해석을 따라 자연스러운 ‘~으로’로 옮겼습니다.
- source_word: כַּ/מִּדּ֖וֹת הָ/אֵֽלֶּה
  english_pob_choice: according to these measurements
  chosen_korean: 이 측량대로
  alternatives_korean:
  - 이런 규격대로
  - 이 치수대로
  lexicon: HALOT
  rationale: מִדּוֹת는 건축 치수/규격을 가리키므로, 반복된 측량 표지를 살려 ‘이 측량대로’로 옮겼습니다.
