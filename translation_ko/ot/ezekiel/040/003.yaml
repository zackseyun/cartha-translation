source:
  edition: WLC
  text: וַ/יָּבֵ֨יא אוֹתִ֜/י שָׁ֗מָּ/ה וְ/הִנֵּה אִישׁ֙ מַרְאֵ֨/הוּ֙ כְּ/מַרְאֵ֣ה נְחֹ֔שֶׁת וּ/פְתִיל פִּשְׁתִּ֥ים בְּ/יָד֖/וֹ וּ/קְנֵ֣ה הַ/מִּדָּ֑ה וְ/ה֥וּא עֹמֵ֖ד בַּ/שָּֽׁעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/003.yaml
  text: He brought me there[a], and behold, there was a man whose appearance was like the appearance of bronze, with a linen cord in his hand and a measuring reed[c][b]; and he was standing in the gateway.
  footnotes:
  - marker: a
    text: Or, 'whose appearance was like bronze.' The Hebrew repeats 'appearance' for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or, 'a cord of flax' or 'a flax line.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'at the gate.' The Hebrew term can refer to the gate structure or gateway area.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 거기로 데려가니, 보라, 한 사람이 있었는데, 그의 모습은 놋의 모습 같았고, 그의 손에는 삼베끈과 측량하는 갈대가 있었으며, 그는 문 어귀에 서 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘놋처럼 보이는 모습’입니다. 히브리어는 ‘모습’을 반복하여 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘삼베줄’ 또는 ‘아마줄’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘문에서’입니다. 히브리어 표현은 문 구조 자체나 문 주변의 공간을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אוֹתִי שָׁמָּה
  english_pob_choice: He brought me there
  chosen_korean: 그가 나를 거기로 데려가니
  alternatives_korean:
  - 그가 나를 거기로 데려왔고
  - 그가 나를 그곳으로 데려가니
  lexicon: HALOT
  rationale: 서술의 진행과 장소 이동을 자연스러운 현대 한국어로 살리되, 선행 문맥의 인도를 받는 흐름을 유지했습니다.
- source_word: מַרְאֵהוּ כְּמַרְאֵה נְחֹשֶׁת
  english_pob_choice: whose appearance was like the appearance of bronze
  chosen_korean: 그의 모습은 놋의 모습 같았고
  alternatives_korean:
  - 그의 모습은 놋처럼 보였고
  - 그의 외형은 놋의 외형과 같았고
  lexicon: HALOT
  rationale: ‘모습’과 반복된 ‘모습’을 모두 살려 원문의 강조를 반영했고, 비전적 광택을 가진 금속 이미지는 한국어 성경 전통상 ‘놋’이 더 적절합니다.
- source_word: פְּתִיל פִּשְׁתִּים
  english_pob_choice: a linen cord
  chosen_korean: 삼베끈
  alternatives_korean:
  - 마포끈
  - 아마끈
  - 삼실
  lexicon: HALOT
  rationale: פִּשְׁתִּים은 아마/삼베 계열 섬유를 가리키므로, 측량 도구라는 기능을 살리면서도 간결한 ‘삼베끈’으로 옮겼습니다.
- source_word: קְנֵה הַמִּדָּה
  english_pob_choice: a measuring reed
  chosen_korean: 측량하는 갈대
  alternatives_korean:
  - 측량 막대
  - 재는 갈대
  - 측량 지팡이
  lexicon: HALOT
  rationale: ‘갈대’라는 재료적 이미지를 유지하되, 용도가 측량임을 분명히 드러내어 비전의 도구성을 보존했습니다.
- source_word: בַּשַּׁעַר
  english_pob_choice: in the gateway
  chosen_korean: 문 어귀에
  alternatives_korean:
  - 문에
  - 문간에
  - 성문 안에
  lexicon: HALOT
  rationale: שַׁעַר의 건축적 범위를 한국어로 과도하게 좁히지 않으면서, 출입 지점에 서 있는 장면을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 그 인물의 정체를 특정할지 여부
  chosen_reading: 본문의 진술에 따라 단순히 ‘한 사람’으로 남겨 두었습니다.
  alternative_readings:
  - 천사로 밝히기
  - 신현적 존재로 해석하기
  rationale: 히브리어 본문은 인물의 정체를 설명하지 않고 외형과 도구만 제시하므로, 번역은 그 긴장을 해소하지 않고 그대로 유지해야 합니다.
  doctrine_reference: '번역 원칙: 본문이 명시하지 않은 신학적 동일시를 덧붙이지 않음.'
