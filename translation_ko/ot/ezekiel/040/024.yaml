id: EZK.40.24
reference: Ezekiel 40:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יּוֹלִכֵ֨/נִי֙ דֶּ֣רֶךְ הַ/דָּר֔וֹם וְ/הִנֵּה שַׁ֖עַר דֶּ֣רֶךְ הַ/דָּר֑וֹם וּ/מָדַ֤ד איל/ו ו/אילמ/ו כַּ/מִּדּ֖וֹת הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/024.yaml
  text: Then he led me by way of the south[a], and behold, there was a gate facing south[b]. He measured its side pillars and its porch according to these measurements.
  footnotes:
  - marker: a
    text: Or, more technically, 'its jambs' for 'its side pillars.' The Hebrew architectural term likely refers to the gate's supporting side structures.
    reason: lexical_alternative
  - marker: b
    text: That is, the gate's dimensions matched those previously described.
    reason: cross_reference
translation:
  language: ko
  text: 그가 나를 남쪽 길로 데리고 가셨습니다. 그런데 보십시오, 남쪽을 향한 문이 있었습니다. 그는 그 문의 문기둥들[a]과 현관을 이 치수들대로 재셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 기술적으로는 ‘문설주들’로 옮길 수 있습니다. 히브리어 건축 용어는 문을 지지하는 측면 구조물을 가리키는 듯합니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 앞서 제시된 치수들과 같았다는 뜻입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיּוֹלִכֵנִי
  english_pob_choice: Then he led me
  chosen_korean: 그가 나를 ... 데리고 가시는데
  alternatives_korean:
  - 그가 나를 이끄셨는데
  - 그가 나를 데리고 가셨는데
  lexicon: HALOT
  rationale: 인과·진행을 담는 Hiphil 계열의 ‘이끌다/데리고 가다’ 의미를 살리되, 환상 서술의 흐름에 맞게 자연스러운 한국어로 옮겼습니다.
- source_word: דֶּרֶךְ הַדָּרוֹם / שַׁעַר דֶּרֶךְ הַדָּרוֹם
  english_pob_choice: by way of the south / a gate facing south
  chosen_korean: 남쪽 길 / 남쪽을 향한 문
  alternatives_korean:
  - 남쪽으로 가는 길 / 남쪽을 향한 문
  - 남쪽 길 / 남쪽 문
  lexicon: HALOT
  rationale: 반복되는 방향어를 그대로 살려 성전 환상의 공간적 배치를 분명하게 하되, ‘문’은 독자에게 자연스러운 건축 표현으로 정리했습니다.
- source_word: אֵילוֹ / וְאֵילַמּוֹ
  english_pob_choice: its side pillars / its porch
  chosen_korean: 양쪽 기둥 / 현관
  alternatives_korean:
  - 문설주 / 현관
  - 옆기둥 / 현관
  lexicon: HALOT
  rationale: POB의 해석처럼 건축 구조물로 이해하되, ‘side pillars’의 기능을 드러내는 ‘양쪽 기둥’을 택하고 ‘porch’는 현대 독자에게 이해 쉬운 ‘현관’으로 옮겼습니다.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  english_pob_choice: according to these measurements
  chosen_korean: 이 모든 측량과 같게
  alternatives_korean:
  - 이 같은 측량대로
  - 이 측량들과 같은 크기로
  lexicon: HALOT
  rationale: 단순한 비교가 아니라 앞서 제시된 치수와의 일치성을 나타내므로, ‘같게’로 대응 관계를 분명히 했습니다.
theological_decisions:
- issue: 예언 환상 서술에서의 시제·존대 처리
  chosen_reading: 서술은 현대 한국어 합쇼체로 유지하고, 하나님/주님의 직접 화법이 아니므로 과도한 경어를 피했습니다.
  alternative_readings:
  - 완전한 과거 서술로 통일
  - 더 강한 종교적 존대를 사용
  rationale: 히브리어 내러티브의 진행감을 살리면서도 한국어 성경 문체의 가독성을 확보하기 위한 선택입니다.
  doctrine_reference: 본문은 성전 환상 서술로, 신학적 논쟁점보다 서술 충실성이 우선입니다.
