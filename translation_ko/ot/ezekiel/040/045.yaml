  source_fidelity: 수정이 필요합니다. לִשְׁכָּה는 ‘방’으로 적절히 옮겼고, 남쪽을 향한다는 공간 묘사 및 제사장들에게 배정되었다는 뜻도 대체로 보존되었습니다. 그러나 שֹׁמְרֵי מִשְׁמֶרֶת는 성전에서 맡은 직무·책임을 수행한다는 뜻이므로 ‘성전의 일을 맡아 지키는’보다 ‘성전의 직무를 맡아 수행하는’이 더 정확하고 자연스럽습니다. 또한 화자가 누구인지 본절 자체에서 높임을 요구하지 않으므로 ‘말씀하셨습니다’는 불필요한 높임을 더할 수 있습니다.
  naturalness: ‘남쪽을 향한 것으로’와 ‘일을 맡아 지키는’은 다소 어색합니다. ‘남쪽을 향하고’ 및 ‘성전의 직무를 맡아 수행하는’으로 고치면 현대 표준어 합쇼체에서 더 명료하고 자연스럽습니다.
  terminology: ‘성전’은 이 환상 문맥의 הַבָּיִת를 분명히 하는 적절한 번역입니다. 다만 현 각주는 ‘방’에 붙어 있으면서 실제로는 הַבָּיִת(성전/집)의 번역 대안을 설명하므로, 각주 표지는 ‘성전’에 붙여야 합니다. ‘또는 방’은 본문 번역과 같아 번역 대안으로 기능하지 못합니다.
