base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/045.yaml
  text: 'Then he spoke to me: “This chamber[a], whose front faces south, is for the priests who keep charge of the temple.”'
  footnotes:
  - marker: a
    text: Or “the house.” In this temple-vision context, the Hebrew term commonly refers to the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 내게 말했습니다. “이 방은 남쪽을 향하고, 성전[a]의 직무를 맡아 수행하는 제사장들을 위한 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “집.” 이 성전 환상 문맥에서 히브리어 ‘집’은 보통 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלַי
  english_pob_choice: Then he spoke to me
  chosen_korean: 그가 내게 말씀하셨습니다
  alternatives_korean:
  - 그가 내게 말했습니다
  - 그가 내게 이르셨습니다
  lexicon: HALOT
  rationale: 서술적 전환과 직접화법 도입을 자연스럽게 살리면서, 격식 있는 현대 한국어로는 ‘말씀하셨습니다’가 가장 무리 없습니다.
- source_word: זֹה הַלִּשְׁכָּה
  english_pob_choice: This chamber
  chosen_korean: 이 방
  alternatives_korean:
  - 이 방들
  - 이 전실
  - 이 침실
  lexicon: HALOT
  rationale: לִשְׁכָּה는 성전 건축 맥락에서 ‘chamber/room’에 해당하지만, 한국어에서는 ‘방’이 현대 독자에게 가장 직접적이며 과도한 상징화를 피합니다. 다만 각주로 번역 대안을 남겼습니다.
- source_word: לַכֹּהֲנִים שֹׁמְרֵי מִשְׁמֶרֶת הַבָּיִת
  english_pob_choice: is for the priests who keep charge of the temple
  chosen_korean: 성전의 일을 맡아 지키는 제사장들을 위한 것입니다
  alternatives_korean:
  - 성전의 책임을 지키는 제사장들을 위한 것입니다
  - 성전 일을 담당하는 제사장들을 위한 것입니다
  lexicon: HALOT
  rationale: לְ의 지정/배정 의미를 ‘위한 것입니다’로 살리고, שֹׁמְרֵי מִשְׁמֶרֶת는 단순한 경비보다 맡겨진 직무를 수행하는 뜻이므로 ‘일을 맡아 지키는’으로 옮겼습니다.
- source_word: הַבָּיִת
  english_pob_choice: the temple
  chosen_korean: 성전
  alternatives_korean:
  - 집
  - 그 집
  lexicon: HALOT
  rationale: 이 본문은 에스겔의 성전 환상 안에 있으므로 הַבָּיִת는 ‘성전’으로 옮겨야 한국어 독자가 대상을 명확히 이해합니다.
theological_decisions:
- issue: הַבָּיִת의 지시 대상
  chosen_reading: 성전으로 특정
  alternative_readings:
  - 집으로 직역
  - 그 집으로 직역
  rationale: 건축적·환상적 문맥에서 ‘집’은 모호하므로, 본문의 참조 대상을 명시해 오해를 줄였습니다. 이는 신학적 확정이 아니라 문맥에 따른 지시 대상 분명화입니다.
  doctrine_reference: Translation philosophy §1, §6
