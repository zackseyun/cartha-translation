base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/004.yaml
  text: And the man said to me[a], “Son of man, see with your eyes, and hear with your ears, and set your heart on all that I show you, for you were brought here so that I might show you these things. Declare to the house of Israel all that you see.”
  footnotes:
  - marker: a
    text: Or 'mortal' or 'human one' for 'Son of man.' The Hebrew expression is Ezekiel’s regular form of address.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람이 제게 말했습니다. 「인자야, 네 눈으로 보고, 네 귀로 듣고, 네 마음을 내가 네게 보여 주는 모든 것에 두어라. 네가 이곳으로 끌려온 것은 내가 네게 이것들을 보여 주려는 까닭이니, 네가 보는 모든 것을 이스라엘 집에 알려라」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인자’는 여기서 예수 그리스도에 대한 칭호가 아니라, 에스겔에게 반복되는 호칭입니다.
    reason: source_note
lexical_decisions:
- source_word: הָאִישׁ
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 그 사람
  lexicon: HALOT
  rationale: 비전 장면의 앞선 문맥에 나온 인물을 자연스럽게 가리키면서도, 히브리어의 평범한 명사성을 유지하기 위해 ‘그 사람’으로 옮겼습니다.
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 죽을 인간아
  lexicon: HALOT
  rationale: 에스겔에서 반복되는 호칭형을 살리기 위해 전통적으로 굳어진 직역형 ‘인자야’를 택했고, 일반 명사 ‘אָדָם’의 어감을 완화하지 않았습니다.
- source_word: וְשִׂים לִבְּךָ
  english_pob_choice: set your heart
  chosen_korean: 네 마음을 … 두어라
  alternatives_korean:
  - 주의를 기울여라
  - 네 마음을 두어라
  lexicon: HALOT
  rationale: ‘마음(לֵב)’이 생각과 의지, 주의의 중심이라는 히브리어 관용을 살리기 위해 단순한 ‘주의를 기울이다’보다 ‘마음을 두다’ 계열을 유지했습니다.
- source_word: הַגֵּד
  english_pob_choice: declare
  chosen_korean: 알려라
  alternatives_korean:
  - 선포하여라
  - 전하여라
  lexicon: HALOT
  rationale: 예언적 명령의 엄중함은 살리되, 한국어에서 지나치게 설교체로 굳지 않도록 ‘알려라’를 사용했습니다.
theological_decisions:
- issue: 에스겔의 반복 호칭 בֶּן אָדָם의 한국어 처리
  chosen_reading: 인자야
  alternative_readings:
  - 사람아
  - 인간아
  rationale: 이 표현은 메시아 칭호가 아니라 예언자에게 주는 정형화된 부름말이므로, 반복성과 문학적 리듬을 보존하는 방향을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: 번역은 문맥상 고정 관용구의 반복성을 보존할 것'
- issue: 목적절 כִּי לְמַעַן הַרְאוֹתְכָה הֻבָאתָה הֵנָּה의 ‘show you these things’ 처리
  chosen_reading: 내가 네게 이것들을 보여 주려는 까닭이니
  alternative_readings:
  - 내가 너를 보여 주기 위해 이곳으로 데려왔기 때문이니
  - 내가 너에게 보여 주려고 네가 이곳에 끌려왔기 때문이니
  rationale: 히브리어의 목적 의미와 복수적 비전 내용(‘이것들’)을 함께 드러내기 위해 단수형 ‘그것’을 피하고 집합적 표현을 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: 원문이 요구하는 의미 범위를 지나치게 축소하지 말 것'
