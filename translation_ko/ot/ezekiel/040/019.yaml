  rationale: 히브리어의 공간 표지 ‘문 앞에서 … 안뜰 앞까지’와 מִחוּץ의 ‘바깥쪽에서’를 각각 명시하여 건축적 측량 범위를 보존했습니다. 마지막 방향어는 원문의 압축된 표현을 한국어 문장으로 자연스럽게 풀되, 각주가 설명하는 분배적 의미를 본문에 과도하게 덧붙이지 않도록 ‘동쪽과 북쪽도 그러했습니다’로 옮겼습니다.
