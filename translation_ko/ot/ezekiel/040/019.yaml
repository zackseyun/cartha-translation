  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣מָד רֹ֡חַב מִ/לִּ/פְנֵי֩ הַ/שַּׁ֨עַר הַ/תַּחְתּ֜וֹנָ/ה לִ/פְנֵ֨י הֶ/חָצֵ֧ר הַ/פְּנִימִ֛י מִ/ח֖וּץ מֵאָ֣ה אַמָּ֑ה הַ/קָּדִ֖ים וְ/הַ/צָּפֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/019.yaml
  text: 'Then he measured the width from the front of the lower gate to the front of the inner court outside: one hundred cubits[b][a], to the east and to the north.'
  footnotes:
  - marker: a
    text: Or 'the lower gateway.' The Hebrew term for 'gate' can refer to the gate structure as a whole, not merely the doorway.
    reason: lexical_alternative
  - marker: b
    text: That is, the measurement was one hundred cubits for both the eastern side and the northern side.
    reason: cross_reference
translation:
  language: ko
  text: 그가 아래 문에서 안뜰 바깥쪽 앞까지의 너비를 측량하니, 백 규빗이었습니다. 곧 동쪽과 북쪽입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘문’은 단순한 출입구만이 아니라 문 구조 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 이 측량은 동쪽과 북쪽 양쪽에 대해 각각 백 규빗이었다는 뜻입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּמָד
  english_pob_choice: Then he measured
  chosen_korean: 그가 ... 측량하니
  alternatives_korean:
  - 그가 ... 재니
  - 그가 ... 재었습니다
  lexicon: HALOT
  rationale: 건축 환상 문맥에서 מדד는 단순히 재는 행위이므로, 현대 문어에서 자연스럽고도 정확한 ‘측량하다’로 옮겼습니다.
- source_word: רֹחַב
  english_pob_choice: the width
  chosen_korean: 너비
  alternatives_korean:
  - 폭
  - 가로
  lexicon: HALOT
  rationale: 공간·건축 측정치로서의 רֹחַב을 한국어의 표준적인 측정 명사 ‘너비’로 옮겼습니다.
- source_word: מִלִּפְנֵי ... לִפְנֵי
  english_pob_choice: from the front of ... to the front of
  chosen_korean: '... 앞까지'
  alternatives_korean:
  - '... 앞에서 ... 앞까지'
  - '... 면에서 ... 면까지'
  lexicon: HALOT
  rationale: 앞뒤 기준점을 표시하는 공간 표현이므로, 중복을 줄이되 두 지점의 범위를 드러내는 ‘앞까지’로 압축했습니다.
- source_word: הַשַּׁעַר הַתַּחְתּוֹנָה
  english_pob_choice: the lower gate
  chosen_korean: 아래 문
  alternatives_korean:
  - 아랫문
  - 낮은 문
  - 아래쪽 문
  lexicon: HALOT
  rationale: שער는 구조물 전체를 가리킬 수 있어 ‘문’보다는 ‘문’으로 자연스럽게 옮기되, 아래에 위치한 구획임을 살려 ‘아래 문’으로 했습니다.
- source_word: מֵאָה אַמָּה
  english_pob_choice: one hundred cubits
  chosen_korean: 백 규빗
  alternatives_korean:
  - 일백 규빗
  - 백 길
  lexicon: HALOT
  rationale: 측량 단위를 보존하기 위해 ‘규빗’을 유지했습니다. 수량은 한국어에서 간결한 ‘백’이 자연스럽습니다.
- source_word: הַקָּדִים וְהַצָּפוֹן
  english_pob_choice: to the east and to the north
  chosen_korean: 곧 동쪽과 북쪽입니다
  alternatives_korean:
  - 동쪽과 북쪽에 해당합니다
  - 동쪽과 북쪽을 뜻합니다
  lexicon: HALOT
  rationale: 히브리어의 방향 표시는 앞선 측량값이 동쪽과 북쪽 양쪽에 적용됨을 요약하므로, 설명적 보충을 최소화한 ‘곧’으로 방향성을 풀어 주었습니다.
theological_decisions:
- issue: 측량 환상 속 공간 지시의 전달 방식
  chosen_reading: 직역적 구조를 유지하되 한국어에서 중복되는 전치사 표지를 줄여, 측량의 범위와 방향을 명확히 보이도록 했습니다.
  alternative_readings:
  - 문장형 설명을 더 늘려 구조를 풀어 쓰는 방식
  - 전치사 반복을 모두 보존하는 더 직역적인 방식
  rationale: 이 절은 신학적 논쟁점보다는 건축적·공간적 정보 전달이 핵심이므로, 의미 손실 없이 읽기 쉬운 형태가 적절합니다.
  doctrine_reference: Ezekiel 40의 성전 환상과 측량 묘사
- issue: ‘문’과 ‘문간/문관’의 범위
  chosen_reading: 전통적 교회 용어보다 구조물 자체를 가리키는 ‘문’을 택해, שער가 문틀과 출입구 전체를 포함할 수 있다는 점을 살렸습니다.
  alternative_readings:
  - 문간
  - 문관
  - 게이트
  rationale: 본문의 어휘 범위가 단순한 개구부를 넘을 수 있으므로, 본문 주석 가능성을 열어 두는 번역이 더 투명합니다.
  doctrine_reference: 텍스트의 건축 용어 의미 범위
