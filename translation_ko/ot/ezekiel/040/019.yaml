    rationale: מִחוּץ는 측량이 바깥쪽에서 이루어짐을 나타내며, ‘안뜰 바깥쪽 앞’이라는 결합은 한국어에서 안뜰의 바깥쪽 부분을 뜻하는 듯 읽힐 수 있습니다.
  - severity: low
    issue: 방향 종결구의 연결이 부자연스러움
    rationale: ‘곧 동쪽과 북쪽입니다’는 무엇이 동쪽과 북쪽인지 분명하지 않습니다. 문맥상 두 방향 모두에 동일한 치수가 적용됨을 자연스럽게 밝혀야 합니다.
