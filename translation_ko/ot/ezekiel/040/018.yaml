  yaml_path: translation/ot/ezekiel/040/018.yaml
  text: And the pavement was beside the side of the gates[a], corresponding to the length of the gates—the lower pavement.
  footnotes:
  - marker: a
    text: Or 'opposite the length of the gates'; the Hebrew לְעֻמַּת can denote spatial correspondence or position opposite something.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 성문들의 옆에는 성문들의 길이에 대응하는 포장된 바닥이 있었는데 — 그 아래쪽 포장된 바닥이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성문들의 길이에 마주하여’; 히브리어 לְעֻמַּת은 공간적 대응이나 어떤 것의 맞은편 위치를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרִצְפָה
  english_pob_choice: the pavement
  chosen_korean: 포장된 바닥
  alternatives_korean:
  - 포장
  - 포장된 마당
  - 바닥
  lexicon: HALOT
  rationale: רִצְפָה는 성전 환상 문맥에서 포장된 표면을 가리키므로, 자연스러운 건축 용어로 ‘포장된 바닥’이 의미를 분명히 드러냅니다.
- source_word: אֶל כֶּתֶף
  english_pob_choice: beside the side
  chosen_korean: 옆에
  alternatives_korean:
  - 곁에
  - 옆면에
  - 측면에
  lexicon: HALOT
  rationale: כֶּתֶף는 문자적으로 ‘어깨’이지만 여기서는 건축적 ‘옆/측면’을 뜻하므로, 위치 관계를 직접적으로 나타내는 ‘옆에’가 적절합니다.
- source_word: לְעֻמַּת
  english_pob_choice: corresponding to
  chosen_korean: 대응하는
  alternatives_korean:
  - 마주한
  - 맞닿은
  - 상응하는
  lexicon: HALOT
  rationale: 이 말은 단순한 ‘반대편’보다 측량상 맞물린 대응 관계를 나타내므로, 영어 POB의 해석을 따라 ‘대응하는’으로 옮겼습니다.
- source_word: הָרִצְפָה הַתַּחְתּוֹנָה
  english_pob_choice: the lower pavement
  chosen_korean: 아래쪽 포장된 바닥
  alternatives_korean:
  - 낮은 포장
  - 하부 포장
  - 아래 포장된 바닥
  lexicon: HALOT
  rationale: תַּחְתּוֹנָה는 다른 상층 구조와 구별되는 아래쪽 층위를 표시하므로, 한국어로는 ‘아래쪽’으로 풀어 자연스럽게 구분했습니다.
theological_decisions:
- issue: 성전 환상에서의 공간 관계를 어떻게 드러낼지
  chosen_reading: 측량된 건축 관계를 보존하기 위해 방향어를 줄이고, ‘대응하는’과 ‘아래쪽’으로 구조적 배치를 드러냈습니다.
  alternative_readings:
  - ‘마주한’처럼 대립적 의미를 강하게 드러내는 번역
  - ‘옆에’만으로 평면적 위치만 드러내는 번역
  rationale: 본문은 단순한 위치 설명이 아니라 성문 길이와 포장 바닥의 정밀한 배치를 말하므로, 측량적 대응을 보존하는 번역이 필요합니다.
  doctrine_reference: 성전 환상 본문의 서술적·건축적 정밀성 보존
