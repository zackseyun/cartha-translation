  rationale: רִצְפָה는 성전 환상 문맥에서 포장된 표면을 가리키므로, 자연스러운 건축 용어로 ‘포장된 바닥’이 의미를 분명히 드러냅니다.
- source_word: אֶל כֶּתֶף
