    text: 또는 ‘성문들의 길이에 마주하여’; 히브리어 לְעֻמַּת은 공간적 상응이나 어떤 것의 맞은편 위치를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרִצְפָה
  english_pob_choice: the pavement
  chosen_korean: 포장된 바닥
  alternatives_korean:
  - 포장
  - 포장된 마당
  - 바닥
