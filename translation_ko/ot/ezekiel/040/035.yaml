lexical_decisions:
- source_word: וַיְבִיאֵנִי
  english_pob_choice: Then he brought me
  chosen_korean: 그가 저를 데리고 가서
  alternatives_korean:
  - 그가 저를 데려갔습니다
  - 그가 저를 이끌어 갔습니다
  lexicon: HALOT
  rationale: 동작의 연속을 나타내는 서술이므로 ‘그러자’로 전개를 살리고, בוא의 사역형은 장소 이동을 동반하는 자연스러운 한국어 ‘데리고 가다’로 옮겼습니다.
- source_word: שַׁעַר הַצָּפוֹן
  english_pob_choice: the north gate
  chosen_korean: 북문
  alternatives_korean:
  - 북쪽 문
  - 북문
  lexicon: HALOT
  rationale: 성전 구조를 가리키는 고정된 방향 명칭이므로 간결하고 문맥에 맞는 ‘북문’이 가장 자연스럽습니다.
- source_word: וּמָדַד
  english_pob_choice: and measured it
  chosen_korean: 측량했습니다
  alternatives_korean:
  - 재어 보았습니다
  - 재었습니다
  lexicon: HALOT
  rationale: 문맥상 성전 구조의 치수를 재는 행위이므로 ‘측량하다’가 건축적·공적 맥락을 가장 분명하게 드러냅니다.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  english_pob_choice: according to these measurements
  chosen_korean: 이와 같은 측량대로
  alternatives_korean:
  - 이러한 치수대로
  - 이 측량에 따라
  lexicon: HALOT
  rationale: כ의 대응·일치 의미를 살려, 앞서 제시된 동일한 규격을 따른다는 점을 자연스럽게 나타내는 표현으로 옮겼습니다.
