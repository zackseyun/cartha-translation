  source_fidelity: 히브리어의 서술 진행(וַ), ‘나를 데리고 가다’, ‘북문’, 그리고 앞서 제시된 치수와 일치하게 측량한다는 뜻을 대체로 충실히 반영했습니다. 다만 ‘이와 같은 측량대로’는 מִדּוֹת(치수·규격)를 ‘측량’이라는 행위와 혼동할 여지가 있습니다.
