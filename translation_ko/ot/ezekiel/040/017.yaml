revisions:
- from: 그가 저를 바깥뜰로 데리고 들어갔습니다. 보십시오, 뜰을 위해 사방에 마련된 방들과 포장된 마당이 있었는데, 그 포장된 마당에 속한 방이 서른이었습니다.[a]
  to: 그가 나를 바깥뜰로 데리고 들어갔습니다. 보십시오, այնտեղ에는 방들이 있었고, 뜰 둘레 사방에는 포장이 마련되어 있었습니다. 그 포장 곁에 방이 서른 개 있었습니다.[a]
  rationale: 포장이 뜰 둘레 사방에 마련되었다는 원문의 수식 관계를 분명히 하고, 반복된 סָבִיב סָבִיב의 공간적 강조를 ‘뜰 둘레 사방에’로 반영했습니다. 마지막 구절은 논쟁적인 אֶל의 관계를 ‘포장 곁에’와 각주로 보수적으로 처리하여, ‘위에’, ‘향하여’, 또는 소속 관계를 단정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:44:46Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘뜰을 위해 사방에 마련된 방들과 포장된 마당’은 ‘사방에/둘레에 마련된’이 히브리어에서 포장(רִצְפָה)을 수식하는 구조를 방들에도 걸리는 것처럼 만들며, 포장과 방들의 배치 관계를 흐립니다. 또한 אֶל הָרִצְפָה는 정확한 공간 관계가 논쟁적이므로 ‘속한’처럼 소속 관계를 확정하기보다 보수적으로 옮기는 편이 안전합니다.
  naturalness: ‘포장된 마당’보다 건축·바닥면을 가리키는 ‘포장’이 רִצְפָה에 더 직접적이고 자연스럽습니다. 문장을 둘로 나누어 포장이 뜰 둘레에 마련되었음을 명료하게 하였습니다. 합쇼체 서술도 유지하였습니다.
  terminology: חָצֵר는 ‘뜰’, הַחִיצוֹנָה는 ‘바깥뜰’, לְשָׁכוֹת는 성전 건축 문맥에서 ‘방들’로 유지했습니다. רִצְפָה는 ‘포장’으로, אֶל הָרִצְפָה의 불확정적인 관계는 본문과 각주에서 보존했습니다.
  issues:
