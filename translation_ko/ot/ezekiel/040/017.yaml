  text: וַ/יְבִיאֵ֗/נִי אֶל הֶֽ/חָצֵר֙ הַ/חִ֣יצוֹנָ֔ה וְ/הִנֵּ֤ה לְשָׁכוֹת֙ וְ/רִֽצְפָ֔ה עָשׂ֥וּי לֶ/חָצֵ֖ר סָבִ֣יב סָבִ֑יב שְׁלֹשִׁ֥ים לְשָׁכ֖וֹת אֶל הָ/רִֽצְפָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/017.yaml
  text: Then he brought me into the outer court[a], and behold, there were chambers and a pavement made for the court all around, all around; thirty chambers were on the pavement.
  footnotes:
  - marker: a
    text: Or 'were by the pavement' or 'were toward the pavement.' The Hebrew says literally 'thirty chambers to the pavement,' indicating their relation to the paved area.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 바깥뜰로 데리고 들어갔습니다. 보십시오, այնտեղ에는 방들이 있었고, 뜰 둘레 사방에는 포장이 마련되어 있었습니다. 그 포장 곁에 방이 서른 개 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 포장을 따라’ 또는 ‘그 포장을 향하여’입니다. 히브리어는 문자적으로 ‘포장에 대하여 방 서른 개’라고 하며, 방들과 포장의 정확한 공간 관계를 명시하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  english_pob_choice: Then he brought me
  chosen_korean: 그가 저를 데리고 들어갔습니다
  alternatives_korean:
  - 그가 저를 데려갔습니다
  - 그가 저를 이끌어 갔습니다
  lexicon: WLC/HALOT
  rationale: 서술 진행을 살리면서 히브리어 동사의 이동·인도 의미를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: הֶחָצֵר הַחִיצוֹנָה
  english_pob_choice: the outer court
  chosen_korean: 바깥뜰
  alternatives_korean:
  - 바깥 마당
  - 외부 뜰
  lexicon: WLC/HALOT
  rationale: 성전 환상 문맥에서 חָצֵר는 ‘뜰’이 기본이며, ‘바깥뜰’이 건축적 대비를 가장 분명하게 드러냅니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보시니
  lexicon: WLC/HALOT
  rationale: 환상 서술의 시각적 주의를 살리되, 현대 한국어에서 자연스러운 감탄·전환 표현으로 처리했습니다.
- source_word: לְשָׁכוֹת
  english_pob_choice: chambers
  chosen_korean: 방들
  alternatives_korean:
  - 방실들
  - 방칸들
  - 골방들
  lexicon: WLC/HALOT
  rationale: 성전 구조물의 용례상 ‘방들’보다 ‘방칸들’이 어색하지 않으면서도 건축적 공간을 전달할 수 있어 선택했습니다; 다만 문맥의 격식은 앞뒤 구문으로 보완했습니다.
- source_word: וְרִצְפָה
  english_pob_choice: and a pavement
  chosen_korean: 포장된 마당
  alternatives_korean:
  - 포장
  - 포석
  - 포장한 마당
  lexicon: WLC/HALOT
  rationale: רִצְפָה는 단순한 ‘포장’이 아니라 바닥이 깔린 공간을 가리키므로, 뜰의 일부로 기능하는 ‘포장된 마당’으로 옮겼습니다.
- source_word: סָבִיב סָבִיב
  english_pob_choice: all around, all around
  chosen_korean: 사방에
  alternatives_korean:
  - 둘레둘레
  - 사방사방
  - 두루두루
  lexicon: WLC/HALOT
  rationale: 히브리어 반복의 강조는 유지하되 한국어에서는 ‘사방에’로 압축해 중복 어색함을 피했습니다.
- source_word: שְׁלֹשִׁים לְשָׁכוֹת אֶל הָרִצְפָה
  english_pob_choice: thirty chambers were on the pavement
  chosen_korean: 그 포장된 마당에 속한 방이 서른이었습니다
  alternatives_korean:
  - 그 포장된 마당에 있는 방이 서른이었습니다
  - 그 포장된 마당 쪽에 방이 서른 있었습니다
  lexicon: WLC/HALOT
  rationale: אֶל הָרִצְפָה는 단순한 ‘위에’보다 관계·배치를 나타내므로, POB의 주석 취지를 반영해 ‘속한’으로 번역해 공간적 연관을 드러냈습니다.
theological_decisions:
- issue: 환상 서술의 직접성
  chosen_reading: ‘보십시오’와 직설적 이동 동사를 사용해 예언 환상의 장면 전환을 그대로 드러냈습니다.
  alternative_readings:
  - 완만하게 ‘거기에는’으로 풀기
  - 서술을 더 설명적으로 바꾸기
  rationale: 에스겔의 환상 체험은 장면 전환과 시각적 제시가 핵심이므로, 이를 완화하지 않고 직접적으로 옮겼습니다.
  doctrine_reference: 예언서 환상 서술의 문학적 형식 보존
- issue: אֶל הָרִצְפָה의 관계 표현
  chosen_reading: ‘그 포장된 마당에 속한’으로 옮겨 위치보다 배치·연결을 강조했습니다.
  alternative_readings:
  - ‘포장된 마당 위에’
  - ‘포장된 마당 곁에’
  - ‘포장된 마당을 향해’
  rationale: 히브리어 전치사 אֶל은 여기서 단순한 수직 위치보다 구조적 연관을 나타내므로, 오해를 줄이기 위해 관계적 표현을 택했습니다.
  doctrine_reference: 성전 환상 구조 묘사의 공간 관계 보존
