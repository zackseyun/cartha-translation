    issue: ‘사방에 마련된’의 수식 범위가 불분명합니다.
    rationale: 원문에서 ‘뜰 둘레 사방에 마련된’ 것은 포장입니다. 초안의 병렬 명사구는 방들과 포장된 마당 모두가 ‘뜰을 위해 사방에 마련된’ 것으로 읽힐 수 있습니다.
  - severity: medium
    issue: ‘포장된 마당에 속한’은 אֶל הָרִצְפָה의 관계를 소속으로 과도하게 특정합니다.
    rationale: 전치사 אֶל은 이 건축 묘사에서 포장과의 위치·방향·인접 관계를 나타내지만, ‘속한’은 원문에 없는 소유·소속 관계를 더합니다.
  - severity: low
    issue: רִצְפָה를 ‘포장된 마당’으로 옮기면 ‘뜰’과 공간 개념이 중복됩니다.
    rationale: 이 단어는 뜰 안에 마련된 포장된 바닥면/포장을 가리키므로 ‘포장’이 더 직접적입니다.
