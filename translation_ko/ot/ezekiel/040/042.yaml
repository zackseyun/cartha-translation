  text: וְ/אַרְבָּעָה֩ שֻׁלְחָנ֨וֹת לָ/עוֹלָ֜ה אַבְנֵ֣י גָזִ֗ית אֹרֶךְ֩ אַמָּ֨ה אַחַ֤ת וָ/חֵ֨צִי֙ וְ/רֹ֨חַב אַמָּ֤ה אַחַת֙ וָ/חֵ֔צִי וְ/גֹ֖בַהּ אַמָּ֣ה אֶחָ֑ת אֲלֵי/הֶ֗ם וְ/יַנִּ֤יחוּ אֶת הַ/כֵּלִים֙ אֲשֶׁ֨ר יִשְׁחֲט֧וּ אֶת הָ/עוֹלָ֛ה בָּ֖/ם וְ/הַ/זָּֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/042.yaml
  text: And four tables for the burnt offering were of cut stone[a], a cubit and a half long, a cubit and a half wide, and one cubit high[b]. On them they placed the implements with which they slaughtered the burnt offering and the sacrifice.
  footnotes:
  - marker: a
    text: Or 'of hewn stone.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew zebaḥ can mean 'sacrifice' generally; in some contexts it refers more specifically to a peace offering.
    reason: alternative_reading
translation:
  language: ko
  text: 번제를 위한 네 개의 상은 다듬은 돌로 만든[a] 것이었는데, 길이는 한 규빗 반, 너비는 한 규빗 반, 높이는 한 규빗이었습니다. 그 상들 위에 그들은 번제와 제물을 잡는 데 쓰는 기구들을 놓았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘깎은 돌로 만든’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 זֶבַח는 일반적으로 ‘희생제물’ 또는 ‘제사’를 뜻할 수 있으며, 어떤 문맥에서는 더 구체적으로 화목제를 가리키기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  english_pob_choice: tables
  chosen_korean: 상
  alternatives_korean:
  - 테이블
  - 탁자
  - 제단상
  lexicon: HALOT
  rationale: 문맥상 도살과 제사에 쓰이는 평면을 가리키므로, 현대 한국어에서 자연스럽고 기능을 드러내는 ‘상’이 적절합니다.
- source_word: אַבְנֵי גָזִית
  english_pob_choice: of cut stone
  chosen_korean: 다듬은 돌로 만든
  alternatives_korean:
  - 깎은 돌로 만든
  - 정으로 다듬은 돌로 만든
  - 다듬은 석재로 만든
  lexicon: HALOT
  rationale: 직역적이되 현대어로 자연스럽게 옮기기 위해 ‘다듬은 돌로 만든’으로 했습니다. 이는 POB의 ‘cut stone’과 같은 재료 의미를 유지합니다.
- source_word: וְיַנִּיחוּ אֶת הַכֵּלִים
  english_pob_choice: they placed the implements
  chosen_korean: 그들은 ... 기구들을 놓았습니다
  alternatives_korean:
  - 그들은 ... 기구들을 두었습니다
  - 그들은 ... 도구들을 놓았습니다
  - 그들은 ... 기물들을 놓았습니다
  lexicon: HALOT
  rationale: כֵּלִים은 일반 ‘그릇’보다 더 넓은 ‘기구/도구’의 뜻이 자연스러워, 제사 준비용 도구라는 기능을 드러내는 ‘기구들’을 선택했습니다.
- source_word: אֲשֶׁר יִשְׁחֲטוּ
  english_pob_choice: with which they slaughtered
  chosen_korean: 잡는 데 쓰는
  alternatives_korean:
  - 도살하는 데 쓰는
  - 잡아 죽이는 데 쓰는
  - 도축하는 데 쓰는
  lexicon: HALOT
  rationale: 제사 맥락에서 제물의 살해 행위를 한국어로 너무 기술적으로 만들기보다, ‘잡는 데 쓰는’으로 기능을 드러내면서도 본문의 거친 의미를 약화시키지 않았습니다.
- source_word: וְהַזָּבַח
  english_pob_choice: and the sacrifice
  chosen_korean: 제물
  alternatives_korean:
  - 희생제물
  - 희생제사
  - 제사
  lexicon: HALOT
  rationale: זֶבַח는 이 절에서 특정 제사명으로 한정되지 않으므로, 보다 넓은 의미의 ‘제물’로 옮겨 POB의 광의 번역을 반영했습니다.
theological_decisions:
- issue: זֶבַח의 범주를 특정 제사로 좁힐지 여부
  chosen_reading: ‘제물’로 넓게 번역하여 특정한 화목제나 다른 제사 유형으로 한정하지 않았습니다.
  alternative_readings:
  - 화목제
  - 희생제물
  rationale: 히브리어 עצמו가 이 절에서 제사의 범주를 명시적으로 좁히지 않으므로, 본문의 범위를 유지하는 번역이 더 충실합니다.
  doctrine_reference: 원문 우선 번역 원칙; 문맥이 허용하는 범위를 넘는 제의 분류의 선제적 결정 회피
- issue: 목적/용도의 표현 방식
  chosen_reading: ‘번제용으로는’이라고 옮겨 לָעוֹלָה의 용도성을 앞세웠습니다.
  alternative_readings:
  - 번제를 위한
  - 번제에 쓰이는
  - 번제용의
  rationale: 히브리어 ל-는 용도·지정의 뜻을 갖기 때문에, 한국어에서도 기능적 용도를 분명히 드러내는 표현이 가장 자연스럽습니다.
  doctrine_reference: 형태-의미 대응 원칙; 제의적 용도의 명시 유지
