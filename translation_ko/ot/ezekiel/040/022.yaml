    rationale: 한국어에서 ‘계단으로’는 수단 또는 방향으로 다소 어색하게 들릴 수 있습니다. ‘일곱 계단을 통해’가 원문의 בְּ와 건축적 접근을 자연스럽게 전달합니다.
