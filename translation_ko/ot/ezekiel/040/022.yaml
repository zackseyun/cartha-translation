base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/022.yaml
  text: Its windows[a], its porch, and its palm-tree decorations had the same measurements as the gate that faced east. People would go up to it by seven steps[c][b], and its porch was in front of them.
  footnotes:
  - marker: a
    text: Or 'its vestibule' or 'its portico' for both occurrences of the architectural term.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'its palm trees'; in context this likely refers to palm-tree carvings or decorative motifs rather than literal trees.
    reason: cultural_note
  - marker: c
    text: 'The Hebrew uses a plural verb (''they would go up''), likely as an impersonal expression: ''one would go up'' or ''people would go up.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그 창들과 주랑[a]과 종려나무 장식[b]은 동쪽을 향한 문과 같은 치수였습니다. 사람들이 일곱 계단을 통해 그 문으로 올라갔으며[c], 그 주랑은 그들 앞에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주랑’은 입구에 덧붙은 건축 구조를 가리키는 말입니다. ‘현관’, ‘현관채’, 또는 ‘포르티코’로도 옮길 수 있으며, 이 절에 두 번 나옵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 종려나무들’입니다. 이 건축 문맥에서는 실제 나무보다 종려나무 모양의 조각이나 장식물을 가리키는 것으로 보입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 동사는 복수형입니다. 여기서는 ‘그들이 올라갔다’ 또는 ‘사람들이 올라갔다’라는 비인칭적 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַלּוֹנוֹ
  english_pob_choice: its windows
  chosen_korean: 그 창들
  alternatives_korean:
  - 그 창
  - 그 창문들
  lexicon: HALOT
  rationale: חַלּוֹן은 건축 맥락에서 창 또는 창 개구부를 뜻하므로, 복수성을 살린 ‘창들’이 자연스럽고 원문의 집합적 뉘앙스도 반영합니다.
- source_word: וְאֵלַמּוֹ / וְאֵילַמּוֹ
  english_pob_choice: its porch
  chosen_korean: 그 주랑
  alternatives_korean:
  - 그 현관
  - 그 베란다
  - 그 현관문간
  lexicon: HALOT
  rationale: 성전 건축 용어인 אֵילָם/אוּלָם은 단순한 가정용 현관보다 건축적 전면 구조를 가리키므로, ‘주랑’이 가장 정확합니다.
- source_word: וְתִמָּרוֹ
  english_pob_choice: its palm-tree decorations
  chosen_korean: 그 종려나무 장식
  alternatives_korean:
  - 그 종려나무들
  - 그 종려 장식
  - 그 야자나무 장식
  lexicon: HALOT
  rationale: 문맥상 실제 나무가 아니라 장식적 형상을 뜻하므로, 영어 POB의 해석을 따라 ‘장식’으로 분명히 했습니다.
- source_word: וּבְמַעֲלוֹת שֶׁבַע יַעֲלוּ ב֔וֹ
  english_pob_choice: They would go up to it by seven steps
  chosen_korean: 사람들이 그리로 일곱 계단으로 올라갔고
  alternatives_korean:
  - 그들이 그리로 일곱 계단으로 올라갔고
  - 그리로 일곱 계단을 올라갔고
  lexicon: HALOT
  rationale: 히브리어 3인칭 복수는 비인칭적 용법으로 보이므로, 한국어에서는 의미를 분명히 하는 ‘사람들이’로 옮겨 자연스럽게 했습니다.
theological_decisions:
- issue: 문을 향한 방향성과 계단 배치의 묘사
