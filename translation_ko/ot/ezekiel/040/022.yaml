  rationale: 이 절은 환상 속 성전 구조의 치수를 설명하는 문맥이므로, 원문이 말하는 공간적 관계를 우선 보존하는 것이 가장 충실합니다.
  doctrine_reference: 본문 우선 원칙; 문맥적 해석 절제
