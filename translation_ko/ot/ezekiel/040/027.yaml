translation:
  language: ko
  text: 그리고 안뜰로 가는 남쪽을 향한[a] 문이 있었으며, 그가 문에서 문까지 남쪽 방향으로 재니 백 규빗이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 첫 번째 ‘남쪽을 향한’은 ‘남쪽 방향으로’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘남쪽의 길/방향으로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁעַר
  english_pob_choice: And there was a gate
  chosen_korean: 그리고 … 문이 있었습니다
  alternatives_korean:
  - 그리고 … 문이 있었습니다
  - 그리고 … 문이 있었습니다
  lexicon: HALOT
  rationale: 히브리어는 무동사 절이므로 한국어에서는 존재를 자연스럽게 드러내는 표현을 보충했습니다. 문맥상 성전 환시의 구조물인 שַׁעַר는 ‘문’이 적절합니다.
- source_word: לֶחָצֵר הַפְּנִימִי
  english_pob_choice: to the inner court
  chosen_korean: 내원 뜰로
  alternatives_korean:
  - 안뜰로
  - 내뜰로
  lexicon: HALOT
  rationale: לְ는 방향·관련을 나타내므로 접근 방향을 살려 ‘~로’로 옮겼습니다. פְּנִימִי는 성전 구조 설명에서 ‘내원’이 의미를 가장 분명히 전달합니다.
- source_word: דֶּרֶךְ הַדָּרוֹם
  english_pob_choice: toward the south
  chosen_korean: 남쪽 방향에
  alternatives_korean:
  - 남쪽으로
  - 남쪽 편에
  lexicon: HALOT
  rationale: 첫 번째는 문의 위치를 지정하므로 ‘남쪽 방향에’로 두어 POB의 첫 항목처럼 방향성보다 위치를 드러냈습니다. 두 번째는 측정의 방향을 나타내므로 본문에서 별도로 ‘남쪽 방향으로’ 옮겼습니다.
- source_word: מִשַּׁעַר אֶל הַשַּׁעַר
  english_pob_choice: from gate to gate
  chosen_korean: 문에서 문까지
  alternatives_korean:
  - 문에서 문까지
  - 문으로부터 문까지
  lexicon: HALOT
  rationale: 측정 구문이 두 대응하는 문 사이의 거리를 나타내므로 한국어도 간결하게 ‘문에서 문까지’로 처리했습니다.
- source_word: מֵאָה אַמּוֹת
  english_pob_choice: one hundred cubits
  chosen_korean: 백 규빗
  alternatives_korean:
  - 백 규빗
  - 한 백 규빗
  lexicon: HALOT
  rationale: 고대 치수를 그대로 유지해 원문 투명성을 살렸습니다. 규빗은 환산하지 않고 현존하는 표준 음역을 따랐습니다.
