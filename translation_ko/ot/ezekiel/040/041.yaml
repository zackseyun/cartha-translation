  text: אַרְבָּעָ֨ה שֻׁלְחָנ֜וֹת מִ/פֹּ֗ה וְ/אַרְבָּעָ֧ה שֻׁלְחָנ֛וֹת מִ/פֹּ֖ה לְ/כֶ֣תֶף הַ/שָּׁ֑עַר שְׁמוֹנָ֥ה שֻׁלְחָנ֖וֹת אֲלֵי/הֶ֥ם יִשְׁחָֽטוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/041.yaml
  text: Four tables on this side and four tables on that side[a], by the side of the gate—eight tables[c][b]; on them they slaughtered.
  footnotes:
  - marker: a
    text: Or “on one side and on the other side.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “at the shoulder of the gate,” an idiom for the side or flank of the gate structure.
    reason: cultural_note
  - marker: c
    text: Or “they shall slaughter”; the Hebrew imperfect may describe either future action or the intended/customary use of the tables.
    reason: lexical_alternative
translation:
  language: ko
  text: 이쪽에 네 개의 상이 있고 저쪽에 네 개의 상이 있으며[a], 문 곁에[b] 모두 여덟 개의 상이 있습니다. 그 위에서 제물을 잡습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “한쪽에는 네 개의 상이 있고 다른 쪽에는 네 개의 상이 있으며.”
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “문의 어깨에”로, 문 구조의 옆면이나 측면을 가리키는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “그들이 제물을 잡을 것입니다.” 히브리어 미완료형은 미래의 일을 나타내거나 이 상들의 정해진 또는 관습적인 용도를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
