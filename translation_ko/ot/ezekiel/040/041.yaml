  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַרְבָּעָ֨ה שֻׁלְחָנ֜וֹת מִ/פֹּ֗ה וְ/אַרְבָּעָ֧ה שֻׁלְחָנ֛וֹת מִ/פֹּ֖ה לְ/כֶ֣תֶף הַ/שָּׁ֑עַר שְׁמוֹנָ֥ה שֻׁלְחָנ֖וֹת אֲלֵי/הֶ֥ם יִשְׁחָֽטוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/041.yaml
  text: Four tables on this side and four tables on that side[a], by the side of the gate—eight tables[c][b]; on them they slaughtered.
  footnotes:
  - marker: a
    text: Or “on one side and on the other side.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “at the shoulder of the gate,” an idiom for the side or flank of the gate structure.
    reason: cultural_note
  - marker: c
    text: Or “they shall slaughter”; the Hebrew imperfect may describe either future action or the intended/customary use of the tables.
    reason: lexical_alternative
translation:
  language: ko
  text: 이쪽에는 네 개의 상이 있고 저쪽에는 네 개의 상이 있으며[a], 문 옆에—곧 여덟 개의 상이 있었는데[b]—그 위에서 제물을 잡았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “한쪽에는 다른 쪽에는.”
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “문의 어깨에”로, 문 구조의 옆면이나 측면을 가리키는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “그들이 잡을 것입니다.” 히브리어 미완료형은 미래적이거나 관습적인 사용을 둘 다 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  english_pob_choice: tables
  chosen_korean: 상
  alternatives_korean:
  - 탁자
  - 식탁
  - 제물 잡는 상
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘table’이지만, 이어지는 ‘그 위에서 잡다’와 성전 출입구의 제의적 용법을 고려해 한국어에서는 ‘상’이 가장 자연스럽고 기능도 무난하게 드러납니다.
- source_word: מִפֹּה ... מִפֹּה
  english_pob_choice: on this side ... on that side
  chosen_korean: 이쪽에는 ... 저쪽에는
  alternatives_korean:
  - 한쪽에는 ... 다른 쪽에는
  - 여기에는 ... 저기에는
  lexicon: HALOT
  rationale: 대칭적 공간 대비를 살리면서도 현대 한국어에서 가장 자연스러운 대응으로 옮겼습니다.
- source_word: לְכֶתֶף הַשָּׁעַר
  english_pob_choice: by the side of the gate
  chosen_korean: 문 옆에
  alternatives_korean:
  - 문의 어깨에
  - 문 곁에
  - 문의 측면에
  lexicon: HALOT
  rationale: 직역하면 ‘문의 어깨’지만, 건축적 관용구로서의 의미는 ‘문 옆/측면’이므로 독자가 바로 이해할 수 있게 했습니다.
- source_word: יִשְׁחָטוּ
  english_pob_choice: they slaughtered
  chosen_korean: 제물을 잡았습니다
  alternatives_korean:
  - 그들이 잡았습니다
  - 도살했습니다
  - 잡게 되어 있었습니다
  lexicon: HALOT
  rationale: 한국어 성경문맥에서 제의적 도살은 ‘제물을 잡다’가 가장 직접적이면서도 본문의 기능을 잘 드러냅니다. 종결은 과거형으로 하되, 비전적 묘사의 상태를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 성전 비전의 동사 시제 처리
  chosen_reading: 문맥상 단회 과거 서술이라기보다 성전 구조의 기능을 설명하는 묘사로 읽고, 한국어는 자연스러운 완료 서술로 옮겼습니다.
  alternative_readings:
  - ‘그들이 잡을 것입니다’처럼 미래로 옮김
  - ‘그들은 잡곤 했습니다’처럼 상습으로 옮김
  rationale: 히브리어 미완료형은 이 절에서 실제 행위의 반복/지정 기능을 모두 열어 둘 수 있으나, 한국어에서는 시설 설명의 서술문으로 읽는 것이 가장 덜 과잉해석적입니다.
  doctrine_reference: 본문 문맥의 서술 기능에 대한 번역 판단
- issue: ‘tables’의 제의적 뉘앙스
  chosen_reading: 일반 명사 ‘상’을 쓰되, 문맥 전체가 제물 잡는 용도임을 한국어 동사에서 드러냈습니다.
  alternative_readings:
  - ‘도살상’으로 명시
  - ‘제물상’으로 명시
  rationale: 명사에 기능을 과하게 덧붙이면 원문의 단순한 명명법을 넘을 수 있어, 기능은 동사와 문맥으로 표현했습니다.
  doctrine_reference: 원문 어휘의 과잉 해석 방지
