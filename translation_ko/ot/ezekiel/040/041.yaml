  - 문 곁에
  - 문의 측면에
  lexicon: HALOT
  rationale: 직역하면 ‘문의 어깨’지만, 건축적 관용구로서의 의미는 ‘문 옆/측면’이므로 독자가 바로 이해할 수 있게 했습니다.
- source_word: יִשְׁחָטוּ
  english_pob_choice: they slaughtered
  chosen_korean: 제물을 잡았습니다
  alternatives_korean:
  - 그들이 잡았습니다
  - 도살했습니다
  - 잡게 되어 있었습니다
  lexicon: HALOT
  rationale: 한국어 성경문맥에서 제의적 도살은 ‘제물을 잡다’가 가장 직접적이면서도 본문의 기능을 잘 드러냅니다. 종결은 과거형으로 하되, 비전적 묘사의 상태를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 성전 비전의 동사 시제 처리
  chosen_reading: 문맥상 단회 과거 서술이라기보다 성전 구조의 기능을 설명하는 묘사로 읽고, 한국어는 자연스러운 완료 서술로 옮겼습니다.
  alternative_readings:
  - ‘그들이 잡을 것입니다’처럼 미래로 옮김
  - ‘그들은 잡곤 했습니다’처럼 상습으로 옮김
  rationale: 히브리어 미완료형은 이 절에서 실제 행위의 반복/지정 기능을 모두 열어 둘 수 있으나, 한국어에서는 시설 설명의 서술문으로 읽는 것이 가장 덜 과잉해석적입니다.
  doctrine_reference: 본문 문맥의 서술 기능에 대한 번역 판단
- issue: ‘tables’의 제의적 뉘앙스
  chosen_reading: 일반 명사 ‘상’을 쓰되, 문맥 전체가 제물 잡는 용도임을 한국어 동사에서 드러냈습니다.
  alternative_readings:
  - ‘도살상’으로 명시
  - ‘제물상’으로 명시
  rationale: 명사에 기능을 과하게 덧붙이면 원문의 단순한 명명법을 넘을 수 있어, 기능은 동사와 문맥으로 표현했습니다.
  doctrine_reference: 원문 어휘의 과잉 해석 방지
