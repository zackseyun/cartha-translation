  yaml_path: translation/ot/ezekiel/040/034.yaml
  text: Its portico faced the outer court[a], and palm trees were on its jambs, on this side and on that side[b]; and eight steps went up to it.
  footnotes:
  - marker: a
    text: Or 'palm-tree carvings,' since the term is literal ('palm trees') but likely refers to decorative motifs in this architectural context.
    reason: lexical_alternative
  - marker: b
    text: Or 'side pillars' for 'jambs.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 현관은 바깥뜰을 향했고[a], 그 기둥 좌우에는 종려나무가 있었으며[b], 계단이 여덟 개 있어 그리로 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘종려나무 조각무늬’로 볼 수 있습니다. 이 표현은 문자적으로는 ‘종려나무들’이지만, 성전 건축 문맥에서는 장식 모티프를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘측기둥들’로 옮길 수 있습니다. 여기의 말은 문의 문설주/옆기둥을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלַמּוֹ
  english_pob_choice: Its portico
  chosen_korean: 그의 현관은
  alternatives_korean:
  - 그의 포르티코는
  - 그의 전실은
  lexicon: HALOT
  rationale: 성전 문맥의 אֵלָם은 돌출된 현관/전실을 가리키므로, 현대 한국어에서 기능과 공간감을 살리는 ‘현관’으로 옮겼습니다.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  english_pob_choice: faced the outer court
  chosen_korean: 바깥뜰을 향했고
  alternatives_korean:
  - 바깥뜰을 향하였고
  - 외뜰을 향했고
  lexicon: HALOT
  rationale: ל은 방향을 나타내므로, 자연스러운 한국어 구문으로 ‘~을 향했고’로 처리했습니다.
- source_word: וְתִמֹרִים
  english_pob_choice: and palm trees
  chosen_korean: 종려나무가 있었으며
  alternatives_korean:
  - 종려나무들이 있었으며
  - 종려나무 장식이 있었으며
  lexicon: HALOT
  rationale: 히브리어는 문자 그대로 ‘종려나무들’이지만 건축 맥락상 장식 모티프일 가능성이 있어, 본문에는 직역성을 유지하되 한국어에서는 대상의 존재를 자연스럽게 표현했습니다.
- source_word: אֶל־אֵלָיו
  english_pob_choice: were on its jambs
  chosen_korean: 그 기둥 좌우에는
  alternatives_korean:
  - 그 문설주에는
  - 그 측기둥에는
  lexicon: HALOT
  rationale: 문맥상 שער의 구조물인 jambs를 한국어 건축어법에 맞게 ‘기둥 좌우’로 풀어, 위치 관계를 분명히 했습니다.
- source_word: וּשְׁמֹנֶה מַעֲלוֹת
  english_pob_choice: and eight steps
  chosen_korean: 계단이 여덟 개 있어
  alternatives_korean:
  - 여덟 계단이 있어
  - 그리고 여덟 계단이 있어
  lexicon: HALOT
  rationale: מַעֲלוֹת는 계단/단을 뜻하므로, 간결하고 현대적인 ‘계단이 여덟 개’로 옮겼습니다.
- source_word: מַעֲלוֹ
  english_pob_choice: went up to it
  chosen_korean: 그리로 올라갔습니다
  alternatives_korean:
  - 그곳으로 올라갔습니다
  - 그곳에 이르렀습니다
  lexicon: HALOT
  rationale: 끝 문구는 계단의 기능을 나타내므로, 한국어에서는 동작의 결과를 드러내는 ‘올라갔습니다’로 자연스럽게 마무리했습니다.
theological_decisions:
- issue: 성전 건축 묘사의 직역성과 가독성
  chosen_reading: 건축 용어를 과도하게 해설하지 않고, 구조와 방향 관계가 보이도록 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 현관/전실/포치 등을 더 기술적으로 풀어 쓰는 방식
  - 장식 모티프를 본문에 명시하는 방식
  rationale: 이 절은 신학적 해석보다 성전 구조 묘사가 핵심이므로, 본문이 말하는 공간 배치와 상징적 장식 가능성을 동시에 훼손하지 않는 쪽을 택했습니다.
  doctrine_reference: Ezekiel 40 temple vision; source-text description
- issue: 문법상 ‘그의’의 지시 대상
  chosen_reading: 구조물의 소속을 가리키는 3인칭 소유를 살려 ‘그의’로 옮겼습니다.
  alternative_readings:
  - 그 현관은
  - 그 문은
  rationale: 히브리어의 소유 접사를 없애면 구조물 간의 연관성이 약해지므로, 본문의 지시 관계를 유지했습니다.
  doctrine_reference: Hebrew possessive suffix usage
