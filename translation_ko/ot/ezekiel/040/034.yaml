  text: ו/אלמ/ו לֶֽ/חָצֵר֙ הַ/חִ֣יצוֹנָ֔ה וְ/תִמֹרִ֥ים אֶל אל/ו מִ/פּ֣וֹ וּ/מִ/פּ֑וֹ וּ/שְׁמֹנֶ֥ה מַעֲל֖וֹת מעל/ו־׃
