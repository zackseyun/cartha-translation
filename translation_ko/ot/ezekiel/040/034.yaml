  lexicon: HALOT
  rationale: מַעֲלוֹת는 계단/단을 뜻하므로, 간결하고 현대적인 ‘계단이 여덟 개’로 옮겼습니다.
- source_word: מַעֲלוֹ
  english_pob_choice: went up to it
  chosen_korean: 그리로 올라갔습니다
  alternatives_korean:
  - 그곳으로 올라갔습니다
  - 그곳에 이르렀습니다
  lexicon: HALOT
  rationale: 끝 문구는 계단의 기능을 나타내므로, 한국어에서는 동작의 결과를 드러내는 ‘올라갔습니다’로 자연스럽게 마무리했습니다.
theological_decisions:
- issue: 성전 건축 묘사의 직역성과 가독성
  chosen_reading: 건축 용어를 과도하게 해설하지 않고, 구조와 방향 관계가 보이도록 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 현관/전실/포치 등을 더 기술적으로 풀어 쓰는 방식
  - 장식 모티프를 본문에 명시하는 방식
  rationale: 이 절은 신학적 해석보다 성전 구조 묘사가 핵심이므로, 본문이 말하는 공간 배치와 상징적 장식 가능성을 동시에 훼손하지 않는 쪽을 택했습니다.
  doctrine_reference: Ezekiel 40 temple vision; source-text description
- issue: 문법상 ‘그의’의 지시 대상
  chosen_reading: 구조물의 소속을 가리키는 3인칭 소유를 살려 ‘그의’로 옮겼습니다.
  alternative_readings:
  - 그 현관은
  - 그 문은
  rationale: 히브리어의 소유 접사를 없애면 구조물 간의 연관성이 약해지므로, 본문의 지시 관계를 유지했습니다.
  doctrine_reference: Hebrew possessive suffix usage
