  text: Its portico faced the outer court[a], and palm trees were on its jambs, on this side and on that side[b]; and eight steps went up to it.
  footnotes:
  - marker: a
    text: Or 'palm-tree carvings,' since the term is literal ('palm trees') but likely refers to decorative motifs in this architectural context.
    reason: lexical_alternative
  - marker: b
    text: Or 'side pillars' for 'jambs.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 현관은 바깥뜰을 향하였고, 그 문설주[b] 양쪽에는 종려나무가[a] 있었으며, 그리로 올라가는 계단은 여덟 개였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘종려나무 조각무늬’로 볼 수 있습니다. 이 표현은 문자적으로는 ‘종려나무들’이지만, 성전 건축 문맥에서는 장식 모티프를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘측기둥들’로 옮길 수 있습니다. 여기의 말은 문의 문설주/옆기둥을 가리킬 수 있습니다.
    reason: lexical_alternative
