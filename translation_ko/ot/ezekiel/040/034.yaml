  rationale: 히브리어는 문자 그대로 ‘종려나무들’이지만 건축 맥락상 장식 모티프일 가능성이 있어, 본문에는 직역성을 유지하되 한국어에서는 대상의 존재를 자연스럽게 표현했습니다.
