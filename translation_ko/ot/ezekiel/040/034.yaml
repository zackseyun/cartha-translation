  rationale: 문맥상 שער의 구조물인 jambs를 한국어 건축어법에 맞게 ‘기둥 좌우’로 풀어, 위치 관계를 분명히 했습니다.
- source_word: וּשְׁמֹנֶה מַעֲלוֹת
  english_pob_choice: and eight steps
  chosen_korean: 계단이 여덟 개 있어
  alternatives_korean:
