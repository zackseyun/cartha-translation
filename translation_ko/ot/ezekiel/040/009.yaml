  naturalness: ‘문간의 현관’은 ‘문간’과 ‘현관’의 의미가 겹쳐 현대 한국어에서 다소 부자연스럽습니다. ‘그 문의 현관’이 문 구조물에 속한 현관/전실이라는 관계를 더 자연스럽게 나타냅니다. 또한 각주 표지는 해당 낱말에 직접 붙이는 편이 명확합니다.
