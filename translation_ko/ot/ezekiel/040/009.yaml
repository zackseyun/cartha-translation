source:
  edition: WLC
  text: וַ/יָּ֜מָד אֶת אֻלָ֤ם הַ/שַּׁ֨עַר֙ שְׁמֹנֶ֣ה אַמּ֔וֹת ו/איל/ו שְׁתַּ֣יִם אַמּ֑וֹת וְ/אֻלָ֥ם הַ/שַּׁ֖עַר מֵ/הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/009.yaml
  text: 'Then he measured the portico of the gate: eight cubits[a], and its side pillars two cubits[b]; and the portico of the gate was toward the temple.'
  footnotes:
  - marker: a
    text: Or 'its jambs,' 'its pilasters,' or 'its posts' for the architectural term rendered 'side pillars.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house'; in this temple vision, the term refers to the temple building.
    reason: cultural_note
translation:
  language: ko
  text: 그가 그 문간의 현관을 쟀는데, 여덟 규빗이었고, 그 옆기둥들은 두 규빗이었으며, 그 문간의 현관은 성전 쪽을 향해 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옆기둥들’로 옮긴 히브리어 אֵיל은 이 문맥에서 문설주, 기둥, 돌출된 지지부를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘집’이지만, 이 환시에서는 성전 건물을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֻלָם
  english_pob_choice: portico
  chosen_korean: 현관
  alternatives_korean:
  - 포르티코
  - 주랑
  - 현관문간
  lexicon: HALOT
  rationale: 문과 성전 구조를 잇는 입구 공간이라는 점을 살려, 현대 한국어에서 가장 자연스러운 건축 용어인 ‘현관’으로 옮겼습니다.
- source_word: הַשַּׁעַר
  english_pob_choice: the gate
  chosen_korean: 문간
  alternatives_korean:
  - 문
  - 대문
  - 문루
  lexicon: HALOT
  rationale: 이 구절은 성전 비전의 구조물 측량이므로, 단순한 출입문보다 구조적 의미가 드러나는 ‘문간’이 더 적합합니다.
- source_word: אֵילוֹ
  english_pob_choice: its side pillars
  chosen_korean: 옆기둥들
  alternatives_korean:
  - 기둥들
  - 문설주들
  - 옆설주들
  - 버팀기둥들
  lexicon: HALOT
  rationale: 문짝 양옆의 구조적 지지물을 가리키는 점을 살려 ‘옆기둥들’로 번역했고, 영어 주석처럼 정확한 건축 대응은 다소 열려 있음을 유지했습니다.
- source_word: מֵהַבָּיִת
  english_pob_choice: was toward the temple
  chosen_korean: 성전 쪽을 향해 있었습니다
  alternatives_korean:
  - 성전 쪽에 있었습니다
  - 성전 편이었습니다
  - 집 쪽에서였습니다
  lexicon: HALOT
  rationale: 여기서 ‘집’은 일반 가옥이 아니라 성전 건물을 가리키므로, 본문 기능을 드러내는 ‘성전 쪽’을 택했습니다.
theological_decisions:
- issue: 건축 비전에서의 공간 방향성 표현
  chosen_reading: ‘문간의 현관은 성전 쪽을 향해 있었습니다’로 옮겨, 단순 위치가 아니라 성전 중심의 방향성을 드러냈습니다.
  alternative_readings:
  - ‘성전 안쪽에 있었습니다’
  - ‘성전 편이었습니다’
  rationale: 히브리어의 방향 표시는 이 비전에서 단순한 지리 정보보다 성전 구조의 질서를 보여 주므로, 방향성을 보존하는 번역이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: Ezekiel 40 temple vision / sacred space orientation
- issue: 측량 동사의 서술 방식
  chosen_reading: ‘쟀는데’로 처리해 순차적 비전 서술을 유지했습니다.
  alternative_readings:
  - ‘측량했는데’
  - ‘재었습니다’
  rationale: 문맥상 눈앞에서 진행되는 환시의 연속 동작이므로, 한국어에서도 장면 전개가 자연스럽게 이어지도록 했습니다.
  doctrine_reference: Narrative sequencing in prophetic vision
