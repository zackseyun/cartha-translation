  text: 그리고 그 문은 북쪽을 향하여 바깥뜰 쪽에 있는 문이었습니다. 그가 그 길이와 너비를 쟀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 얼굴이 북쪽을 향한’입니다.
