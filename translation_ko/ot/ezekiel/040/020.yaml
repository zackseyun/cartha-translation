lexical_decisions:
- source_word: וְהַשַּׁעַר
  english_pob_choice: As for the gate
  chosen_korean: 그 문은
  alternatives_korean:
  - 그리고 그 문은
  - 문은
  lexicon: HALOT
  rationale: 문장 첫머리의 וְ는 단순 접속이 아니라 서술 대상을 이어 주는 기능이므로, 한국어에서는 자연스러운 화제 표지로 처리했습니다.
- source_word: פָּנָיו דֶּרֶךְ הַצָּפוֹן
  english_pob_choice: whose front faced north
  chosen_korean: 북쪽을 향하여
  alternatives_korean:
  - 북쪽을 바라보는
  - 북쪽을 향한
  lexicon: HALOT
  rationale: פָּנִים의 직역인 ‘얼굴’보다 건축 맥락의 방향성을 살린 ‘향하여’가 더 정확하면서도 자연스럽습니다.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  english_pob_choice: toward the outer court
  chosen_korean: 바깥뜰 쪽에 있는
  alternatives_korean:
  - 바깥뜰을 향한
  - 외뜰 쪽의
  lexicon: HALOT
  rationale: ל의 관계·지향 의미를 살려 문이 바깥뜰 쪽에 위치해 있음을 분명히 했습니다. ‘바깥뜰’은 본문의 성전 공간 구분을 유지하는 표준적 표현입니다.
- source_word: מָדַד אָרְכּוֹ וְרָחְבּוֹ
  english_pob_choice: he measured its length and its width
  chosen_korean: 그가 그 길이와 너비를 쟀습니다
  alternatives_korean:
  - 그가 그 길이와 폭을 쟀습니다
  - 그는 그것의 길이와 너비를 측정했습니다
  lexicon: HALOT
  rationale: 건축 치수 문맥이므로 ‘길이와 너비’가 가장 직접적입니다. 동사는 현대 한국어에서 자연스러운 ‘재다’로 옮겼습니다.
