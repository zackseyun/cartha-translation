  text: וְ/תָאֵ֨י הַ/שַּׁ֜עַר דֶּ֣רֶךְ הַ/קָּדִ֗ים שְׁלֹשָׁ֤ה מִ/פֹּה֙ וּ/שְׁלֹשָׁ֣ה מִ/פֹּ֔ה מִדָּ֥ה אַחַ֖ת לִ/שְׁלָשְׁתָּ֑/ם וּ/מִדָּ֥ה אַחַ֛ת לָ/אֵילִ֖ם מִ/פֹּ֥ה וּ/מִ/פּֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/010.yaml
  text: And the guardrooms of the gate facing east were three on this side and three on that side[a]; the three of them had one measure[b], and the side pillars had one measure on this side and on that side.
  footnotes:
  - marker: a
    text: Or 'side rooms' for 'guardrooms'; the Hebrew term refers to small chambers built into the gate structure.
    reason: lexical_alternative
  - marker: b
    text: Or 'jambs' or 'pilasters' for 'side pillars'; the exact architectural term is debated in Ezekiel's temple vision.
    reason: lexical_alternative
translation:
  language: ko
  text: 동쪽을 향한 성문의 방들은 이쪽에도 셋, 저쪽에도 셋이었으며[a], 그 셋은 모두 한 같은 크기였고[b], 이쪽과 저쪽의 기둥들도 한 같은 크기였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '측실들'로도 옮길 수 있습니다. 히브리어 תָאֵי 는 성문 구조 안에 붙은 작은 방들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '같은 치수였습니다'로도 옮길 수 있습니다. 여기서는 건축 치수의 동일성을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָאֵי
  english_pob_choice: guardrooms
  chosen_korean: 성문의 방들
  alternatives_korean:
  - 경비실
  - 측실
  - 작은 방들
  lexicon: HALOT
  rationale: 성전 환상 안의 שער 부속공간을 기능보다 형태 중심으로 과도하게 좁히지 않으면서, 한국어로 자연스럽고 본문의 건축적 의미를 유지하는 표현입니다.
- source_word: דֶּרֶךְ הַקָּדִים
  english_pob_choice: facing east
  chosen_korean: 동쪽을 향한
  alternatives_korean:
  - 동쪽을 향한 방향의
  - 동쪽 편의
  lexicon: HALOT
  rationale: 직역적인 '동쪽의 길'보다 성문의 방향을 말하는 문맥에 맞게 '동쪽을 향한'으로 옮겨, 구조물의 방위를 분명히 했습니다.
- source_word: מִדָּה אַחַת
  english_pob_choice: one measure
  chosen_korean: 한 같은 크기
  alternatives_korean:
  - 같은 치수
  - 하나의 치수
  - 동일한 크기
  lexicon: HALOT
  rationale: 반복되는 건축 치수의 통일성을 살리기 위해 '한 같은 크기'로 옮겼습니다. 다소 어색해 보일 수 있으나, 원문의 강조점인 동일한 측정을 분명히 전달합니다.
- source_word: אֵילִם
  english_pob_choice: side pillars
  chosen_korean: 기둥들
  alternatives_korean:
  - 옆기둥들
  - 문기둥들
  - 측면 기둥들
  lexicon: HALOT
  rationale: 문맥상 성문 구조를 이루는 수직 지지물을 가리키므로 '기둥들'로 옮겼습니다. 본문이 이미 성문 방위를 설명하므로 과도한 전문용어보다 간명한 표현이 적절합니다.
theological_decisions:
- issue: 건축 환상에서의 반복적 대칭 표현을 어떻게 살릴지
  chosen_reading: 이쪽/저쪽, 셋/셋, 한 같은 크기라는 반복을 그대로 드러내어 구조적 질서와 정확성을 강조했습니다.
  alternative_readings:
  - 의역하여 더 유려하게 정리하는 방식
  - 중복 표현을 줄여 한 문장으로 압축하는 방식
  rationale: 에스겔 40장의 환상은 성전의 정밀한 질서를 보여 주므로, 반복과 대칭을 줄이지 않고 보존하는 것이 본문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 성전 환상 본문의 문학적·신학적 질서성
