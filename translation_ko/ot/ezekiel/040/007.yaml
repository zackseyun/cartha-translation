source:
  edition: WLC
  text: וְ/הַ/תָּ֗א קָנֶ֨ה אֶחָ֥ד אֹ֨רֶךְ֙ וְ/קָנֶ֤ה אֶחָד֙ רֹ֔חַב וּ/בֵ֥ין הַ/תָּאִ֖ים חָמֵ֣שׁ אַמּ֑וֹת וְ/סַ֣ף הַ֠/שַּׁעַר מֵ/אֵ֨צֶל אוּלָ֥ם הַ/שַּׁ֛עַר מֵֽ/הַ/בַּ֖יִת קָנֶ֥ה אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/007.yaml
  text: And each guardroom was one reed long and one reed wide[a], and between the guardrooms was five cubits[c][b]. And the threshold of the gate beside the portico of the gate on the inside was one reed.
  footnotes:
  - marker: a
    text: Or 'side room' or 'chamber' for 'guardroom' (Hebrew תָּא), an architectural term in Ezekiel's temple vision.
    reason: lexical_alternative
  - marker: b
    text: Or 'vestibule' or 'porch' for 'portico' (Hebrew אוּלָם).
    reason: lexical_alternative
  - marker: c
    text: The phrase 'toward the inside' renders Hebrew 'from the house,' likely indicating the inner side of the gate complex rather than a separate house.
    reason: cultural_note
translation:
  language: ko
  text: 각 문간방[a]은 길이와 너비가 각각 측량 갈대 한 대였고, 문간방들 사이에는 다섯 규빗이 있었습니다. 또 문의 현관[b] 곁 안쪽에 있는 문의 문지방은 측량 갈대 한 대였습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘문간방’은 히브리어 תָּא의 건축 용어를 옮긴 것입니다. ‘경비실’, ‘측실’ 또는 ‘방’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘현관’은 히브리어 אוּלָם을 옮긴 것입니다. 문 구조의 ‘전실’, ‘주랑’ 또는 ‘포치’를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘안쪽’은 히브리어 ‘집에서’(מֵהַבַּיִת)를 성전 건물 또는 성문 구조의 내부 쪽을 가리키는 말로 이해한 번역입니다. 정확한 건축상 지시 대상은 논의됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַתָּא / guardroom
  english_pob_choice: guardroom
  chosen_korean: 감시방
  alternatives_korean:
  - 측실
  - 칸
  - 방
  lexicon: HALOT
  rationale: 성전 문 구조 속 작은 방이라는 기능을 살려 ‘감시방’으로 옮겼습니다. 일반적인 ‘방’보다 구조적·기능적 의미가 더 분명합니다.
- source_word: קָנֶה אֶחָד
  english_pob_choice: one reed
  chosen_korean: 한 갈대
  alternatives_korean:
  - 한 측량 갈대
  - 한 자대
  - 한 막대
  lexicon: HALOT
  rationale: 문맥상 갈대는 식물이 아니라 측정 단위이므로, 간결하게 ‘한 갈대’로 두어 측량 표현을 유지했습니다.
- source_word: אוּלָם הַשַּׁעַר
  english_pob_choice: the portico of the gate
  chosen_korean: 문의 포르티코
  alternatives_korean:
  - 문의 현관
  - 문의 주랑
  - 문의 베스티불
  lexicon: HALOT
  rationale: אוּלָם의 건축적 의미를 살리되 현대 독자가 구조를 떠올리기 쉬운 외래어 ‘포르티코’를 택했습니다.
- source_word: מֵהַבַּיִת
  english_pob_choice: on the inside
  chosen_korean: 안쪽에 있는 곳에
  alternatives_korean:
  - 안쪽에서
  - 집에서부터
  - 내부 쪽에
  lexicon: HALOT
  rationale: 여기서의 בַּיִת은 주택이 아니라 성전 구조의 내부 방향을 가리키므로, ‘안쪽에 있는 곳에’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 성전 환상에서 건축 치수의 표현 방식
  chosen_reading: 문학적·예전적 장식어를 덜고, 원문의 치수 정보와 공간 관계를 직접 드러내는 기술문으로 옮겼습니다.
  alternative_readings:
  - 더 의역적으로 ‘각 방의 크기는…’로 풀기
  - 전통적 성전 용어로 익숙하게 바꾸기
  rationale: 이 절은 신학적 해설보다 정확한 건축 묘사가 핵심이므로, 원문의 측량 정보와 위치 관계를 보존하는 쪽이 독자 이해에 가장 충실합니다.
  doctrine_reference: 에스겔 40장 성전 환상
- issue: ‘문지방’과 ‘안쪽’의 위치 관계
  chosen_reading: ‘문지방은 문의 포르티코 옆, 안쪽에 있는 곳에’로 두어 구조의 방향성을 유지했습니다.
  alternative_readings:
  - ‘집에서’로 직역하기
  - ‘내부’만으로 단순화하기
  rationale: 원문은 건물의 ‘집’이 아니라 성전 단지의 안쪽 방향을 말하므로, 독자가 공간 배치를 오해하지 않도록 내부 방향을 분명히 했습니다.
  doctrine_reference: 에스겔 40장 성전 환상
