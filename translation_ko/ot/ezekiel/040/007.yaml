revisions:
- from: 각 감시방은 길이도 한 갈대, 너비도 한 갈대였고, 감시방들 사이의 간격은 다섯 규빗이었습니다. 그리고 문의 문지방은 문의 포르티코 옆, 안쪽에 있는 곳에 한 갈대였습니다.[a][b][c]
  to: 각 문간방[a]은 길이와 너비가 각각 측량 갈대 한 대였고, 문간방들 사이에는 다섯 규빗이 있었습니다. 또 문의 현관[b] 곁 안쪽에 있는 문의 문지방은 측량 갈대 한 대였습니다.[c]
  rationale: 치수 정보와 병렬 구조를 유지하면서, 측량 단위인 קָנֶה를 한국어에서 분명히 했습니다. תָּא의 기능을 ‘감시’로 단정하지 않고 건축적으로 중립적인 ‘문간방’을 사용했습니다. 마지막 구절은 원문의 공간적 모호성을 보존하도록 본문을 간결하게 처리하고, 논쟁 가능한 ‘집에서’의 지시를 각주에서 설명했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:47:10Z'
