  - severity: medium
    issue: ‘감시방’은 תָּא의 기능을 단정함
    rationale: 원어는 성문 구조 안의 작은 방을 가리키는 건축 용어이며, 실제 경비 기능은 문맥상 추론될 수 있어도 어휘 자체가 이를 확정하지는 않습니다.
