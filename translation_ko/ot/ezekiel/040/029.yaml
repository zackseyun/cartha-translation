  text: And its guardroom[a], its side pillars, and its porch were according to these measurements; and it had windows, and its porch had windows, all around. The length was fifty cubits[b], and the width twenty-five cubits.
  footnotes:
  - marker: a
    text: Or 'jambs,' 'pilasters,' or 'posts' for 'side pillars.'
    reason: lexical_alternative
  - marker: b
    text: Or 'vestibule' for 'porch.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 경비실과 곁기둥들[a]과 현관[b]은 이 치수와 같았으며, 그것과 그 현관에는 사방으로 창문들이 있었습니다. 길이는 오십 규빗이었고 너비는 이십오 규빗이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘문설주들’, ‘벽기둥들’, ‘기둥들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘현관부’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָא
  english_pob_choice: guardroom
  chosen_korean: 감옥
  alternatives_korean:
  - 경비실
  - 감방
  - 문지기방
  lexicon: HALOT
  rationale: 문맥상 성전/성문 구조의 작은 방이지만, 한국어에서 ‘guardroom’의 기능을 가장 가까이 전달하는 말로는 ‘감옥’보다 ‘경비실’이 더 자연스럽습니다. 다만 본문이 가리키는 건축적 방의 성격을 너무 일반화하지 않도록 최소한의 직역성을 남겼습니다.
- source_word: וְאֵילָיו
  english_pob_choice: side pillars
  chosen_korean: 측기둥들
  alternatives_korean:
  - 옆기둥들
  - 곁기둥들
  - 문기둥들
  lexicon: HALOT
  rationale: POB의 ‘side pillars’를 한국어 건축 용어로 직접 살려 ‘측기둥들’로 옮겼습니다. ‘문기둥들’도 가능하지만, 본문은 문의 양옆 구조물이라는 점보다 구조적 배치를 말하므로 ‘측-’이 더 중립적입니다.
- source_word: אֵילָם
  english_pob_choice: porch
  chosen_korean: 포치
  alternatives_korean:
  - 현관
  - 주랑
  - 현관부
  lexicon: HALOT
  rationale: 이 절의 ‘porch’는 현대 건축의 ‘현관’보다 성문 구조의 돌출된 전실에 가깝기 때문에, 전통 교회 용어를 피하면서도 건축적 차이를 유지하는 ‘포치’를 채택했습니다.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  english_pob_choice: according to these measurements
  chosen_korean: 이 측량에 따른
  alternatives_korean:
  - 이러한 치수대로의
  - 이 측정값에 맞는
  - 이 치수와 같은
  lexicon: HALOT
  rationale: 히브리어는 앞서 제시된 치수와의 일치를 뜻하므로, 반복된 구조의 대응을 자연스럽게 살리는 ‘이 측량에 따른’으로 옮겼습니다.
- source_word: חַלּוֹנוֹת
  english_pob_choice: windows
  chosen_korean: 창문들
  alternatives_korean:
  - 창들
  - 창구멍들
  - 창문
  lexicon: HALOT
  rationale: 단순한 개구부보다 ‘창문’이 더 자연스럽고, 복수형을 반영해 ‘창문들’로 처리했습니다.
