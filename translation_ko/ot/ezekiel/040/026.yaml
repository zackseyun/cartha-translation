source:
  edition: WLC
  text: וּ/מַעֲל֤וֹת שִׁבְעָה֙ עלות/ו ו/אלמ/ו לִ/פְנֵי/הֶ֑ם וְ/תִמֹרִ֣ים ל֗/וֹ אֶחָ֥ד מִ/פּ֛וֹ וְ/אֶחָ֥ד מִ/פּ֖וֹ אֶל איל/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/026.yaml
  text: And its ascent had seven steps[a], with its vestibule before them; and it had palm-tree ornaments, one on this side and one on that side[b], on its jambs.
  footnotes:
  - marker: a
    text: Or 'porch' for 'vestibule' (Heb. אֵילָם), a traditional rendering in temple-vision contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'posts' or 'side pillars' for 'jambs' (Heb. אֵילָו).
    reason: lexical_alternative
translation:
  language: ko
  text: 그 오르막에는 일곱 계단이 있었고, 그 계단들 앞에는 현관[a]이 있었으며, 그 문설주[b]에는 이쪽에 하나, 저쪽에 하나씩 종려나무 장식이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘현관’은 히브리어 אֵילָם을 현대적으로 옮긴 말입니다. 이 성전 건축 문맥에서는 ‘낭실’ 또는 ‘포치’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘문설주’는 히브리어 אֵילָו를 옮긴 말입니다. ‘측기둥’ 또는 ‘기둥’으로도 번역할 수 있으나, 출입구 양쪽의 구조 부재라는 뜻을 더 분명히 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת / עֲלוֹתוֹ
  english_pob_choice: its ascent had seven steps
  chosen_korean: 그 오르막에는 일곱 계단이 있었고
  alternatives_korean:
  - 그 올라감에는 일곱 계단이 있었습니다
  - 그 계단 오름에는 일곱 계단이 있었습니다
  - 일곱 계단이 그곳으로 올라가게 되어 있었습니다
  lexicon: HALOT
  rationale: מַעֲלוֹת는 단순한 ‘계단들’보다 오르막/계단 접근로의 의미가 있어, 문맥상 건축적 상승로를 살리면서도 자연스럽게 옮겼습니다.
- source_word: וְאֵילַמּוֹ
  english_pob_choice: with its vestibule
  chosen_korean: 그 앞에 현관이 있었으며
  alternatives_korean:
  - 그 앞에 전정이 있었으며
  - 그 앞에 주랑이 있었으며
  - 그 앞에 현관(포치)이 있었으며
  lexicon: HALOT
  rationale: 에스겔의 성전 환상에서 אֵילָם은 출입구 앞의 건축 구조를 가리키므로, 현대 한국어에서 가장 이해하기 쉬운 ‘현관’을 택했습니다.
- source_word: וְתִמֹרִים
  english_pob_choice: palm-tree ornaments
  chosen_korean: 종려나무 장식
  alternatives_korean:
  - 종려나무 무늬
  - 종려 장식
  - 종려나무 문양 장식
  lexicon: HALOT
  rationale: 문맥이 실제 나무가 아니라 조각·장식 모티프를 가리키므로, ‘장식’으로 분명히 했습니다.
- source_word: אֶחָד מִפֹּה וְאֶחָד מִפֹּה
  english_pob_choice: one on this side and one on that side
  chosen_korean: 여기에도 하나, 저기에도 하나
  alternatives_korean:
  - 한쪽에 하나, 다른 쪽에 하나
  - 이쪽에 하나, 저쪽에 하나
  - 양쪽에 하나씩
  lexicon: HALOT
  rationale: 대칭적 분포를 나타내는 관용구이므로, 한국어에서도 좌우 대칭감을 살리는 표현으로 옮겼습니다.
- source_word: אֵילָו
  english_pob_choice: jambs
  chosen_korean: 기둥
  alternatives_korean:
  - 기둥머리
  - 문설주
  - 측기둥
  lexicon: HALOT
  rationale: 건축 용어로는 ‘문설주’가 정확하지만, 문맥상 독자 이해를 위해 본문에는 더 자연스러운 ‘기둥’을 사용했습니다. 다만 의미상 출입구 양쪽의 구조물을 가리킵니다.
theological_decisions:
- issue: 성전 환상 건축 용어의 현대어화
  chosen_reading: 전문 건축어보다 독자가 즉시 이해할 수 있는 현대어를 사용하되, 구조 의미는 유지했습니다.
  alternative_readings:
  - 전정/주랑/문설주 같은 더 전문적인 번역
  - 전통적 성구체 표현
  rationale: 이 절은 예배 교리보다 성전 구조 묘사가 핵심이므로, 본문 가시성과 정확성의 균형을 우선했습니다.
  doctrine_reference: 성전 환상 묘사의 문자적·시각적 전달
- issue: ‘종려나무 장식’의 비문자성
  chosen_reading: 실제 나무가 아니라 장식 문양임을 본문에서 드러냈습니다.
  alternative_readings:
  - 그냥 ‘종려나무들’로 옮기는 방식
  rationale: 건축 맥락에서 독자가 오해하지 않도록, 상징적 장식 요소라는 점을 분명히 했습니다.
  doctrine_reference: 성전 장식의 상징적 도상 이해
