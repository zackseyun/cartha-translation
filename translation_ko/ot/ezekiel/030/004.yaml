source:
  edition: WLC
  text: וּ/בָאָ֥ה חֶ֨רֶב֙ בְּ/מִצְרַ֔יִם וְ/הָיְתָ֤ה חַלְחָלָה֙ בְּ/כ֔וּשׁ בִּ/נְפֹ֥ל חָלָ֖ל בְּ/מִצְרָ֑יִם וְ/לָקְח֣וּ הֲמוֹנָ֔/הּ וְ/נֶהֶרְס֖וּ יְסוֹדֹתֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/004.yaml
  text: And a sword will come against Egypt[a], and there will be anguish in Cush, when the slain fall in Egypt, and they take away her wealth[c][b], and her foundations are torn down.
  footnotes:
  - marker: a
    text: Cush is the region south of Egypt, often corresponding broadly to ancient Nubia rather than the modern nation-state of Ethiopia.
    reason: cultural_note
  - marker: b
    text: Or 'there will be trembling in Cush.' The Hebrew term can denote shaking, writhing, or anguish in response to disaster.
    reason: lexical_alternative
  - marker: c
    text: Or 'they take away her multitude/abundance.' The Hebrew word can refer to a population, abundance, or wealth; here it is rendered in the sense of plundered riches.
    reason: lexical_alternative
translation:
  language: ko
  text: 칼이 이집트에 닥치고, 구스에는 고통이 있을 것입니다. 이집트에서 죽임당한 자들이 쓰러질 때, 사람들이 그 무리를 빼앗아 가고 그 기초들이 무너질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 구스는 이집트 남쪽 지역으로, 오늘날의 에티오피아 국가와는 다를 수 있으며 넓게는 고대 누비아에 대응합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘구스에 떨림이 있을 것이다.’ 히브리어는 재난에 대한 떨림, 몸부림, 고통을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 풍성함/무리를 빼앗아 갈 것이다.’ 히브리어는 인구, 풍성함, 재물을 가리킬 수 있으며 여기서는 약탈당하는 대상의 넓은 의미를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִצְרַיִם
  english_pob_choice: against Egypt
  chosen_korean: 이집트에 닥치고
  alternatives_korean:
  - 이집트에
  - 이집트를 향해
  - 이집트 위에
  lexicon: HALOT
  rationale: 전쟁 맥락의 '칼'이 침략의 도래를 가리키므로, 단순한 위치격보다 재난이 이집트에 임함을 드러내는 표현으로 옮겼습니다.
- source_word: חַלְחָלָה
  english_pob_choice: anguish
  chosen_korean: 고통
  alternatives_korean:
  - 떨림
  - 전율
  - 괴로움
  lexicon: HALOT
  rationale: 이 어휘는 떨림, 몸부림, 공포의 혼란을 아우르므로, 현대 한국어에서 자연스럽고 포괄적인 '고통'으로 옮겼습니다.
- source_word: הֲמוֹנָהּ
  english_pob_choice: wealth
  chosen_korean: 그 무리
  alternatives_korean:
  - 그 풍성함
  - 그 재물
  - 그 많음
  lexicon: HALOT
  rationale: 이 단어는 무리, 많음, 풍성함, 재물을 모두 가리킬 수 있지만, 본문 병행 구조와 정복·약탈 문맥을 함께 고려해 '그 무리'로 옮기되, 약탈당하는 대상의 다수를 드러냈습니다.
- source_word: יְסוֹדֹתֶיהָ
  english_pob_choice: her foundations
  chosen_korean: 그 기초들
  alternatives_korean:
  - 그 토대들
  - 그 기반들이
  - 그 바닥들이
  lexicon: HALOT
  rationale: 건축적 이미지와 비유적 국가 기반의 함의를 함께 보존하기 위해 직역에 가까운 '기초들'을 사용했습니다.
theological_decisions:
- issue: 구스 지명의 현대화 여부
  chosen_reading: 구스를 유지했습니다.
  alternative_readings:
  - 에티오피아로 옮김
  - 누비아로 설명
  rationale: 원문 고유명사를 보존하는 것이 예언 문맥의 지리적 범위를 가장 정확히 드러내며, 본문 각주로 역사적 범위를 설명할 수 있습니다.
  doctrine_reference: 역사-지리적 번역 원칙
- issue: הֲמוֹנָהּ의 의미 범위
  chosen_reading: 약탈 대상의 다중성/무리성을 드러내는 번역을 택했습니다.
  alternative_readings:
  - 그 재물
  - 그 풍성함
  - 그 군중
  rationale: 정복 문맥에서 'wealth'만으로 좁히면 히브리어의 넓은 의미와 문장의 파괴적 이미지가 줄어들 수 있으므로, 다중의 인구와 부를 함께 시사하는 표현을 유지했습니다.
  doctrine_reference: 문맥 우선의 어휘 보존
