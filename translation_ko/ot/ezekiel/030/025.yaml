id: EZK.30.25
reference: Ezekiel 30:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַחֲזַקְתִּ֗י אֶת זְרֹעוֹת֙ מֶ֣לֶךְ בָּבֶ֔ל וּ/זְרֹע֥וֹת פַּרְעֹ֖ה תִּפֹּ֑לְנָה וְֽ/יָדְע֞וּ כִּֽי אֲנִ֣י יְהוָ֗ה בְּ/תִתִּ֤/י חַרְבִּ/י֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/נָטָ֥ה אוֹתָ֖/הּ אֶל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/025.yaml
  text: I will strengthen the arms of the king of Babylon[a], but Pharaoh’s arms will fall. Then they will know that I am Yahweh[b], when I put my sword into the hand of the king of Babylon and he stretches it out against the land of Egypt.
  footnotes:
  - marker: a
    text: Or, 'and Pharaoh’s arms will fail.' The Hebrew says 'fall,' preserving the image of military collapse.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD' represents the divine name YHWH.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 바빌론 왕의 팔을 강하게 하겠고, 바로의 팔은 떨어질 것입니다. 그들이 내가 야훼임을 알게 될 것입니다. 곧 내가 내 칼을 바빌론 왕의 손에 두고, 그가 그것을 이집트 땅을 향해 휘두를 때입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַחֲזַקְתִּי
  english_pob_choice: I will strengthen
  chosen_korean: 강하게 하겠고
  alternatives_korean:
  - 강하게 하겠습니다
  - 튼튼하게 하겠고
  - 힘 있게 하겠고
  lexicon: HALOT
  rationale: חזק의 사역형을 한국어에서 자연스럽게 옮기면서, 전쟁 문맥의 능력 부여를 살리기 위해 ‘강하게 하다’를 택했습니다.
- source_word: זְרֹעוֹת / זְרֹעוֹת פַּרְעֹה
  english_pob_choice: arms / Pharaoh’s arms
  chosen_korean: 팔 / 바로의 팔
  alternatives_korean:
  - 팔들 / 바로의 팔들
  - 힘 / 바로의 힘
  lexicon: HALOT
  rationale: 히브리어의 구체적 신체 이미지를 유지하기 위해 추상어보다 ‘팔’을 썼고, 복수형은 한국어에서 자연스러운 단수 집합 표현으로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB 기본 원칙에 따라 신적 이름 YHWH를 칭호가 아닌 고유명사 ‘야훼’로 옮겼습니다.
- source_word: בְּתִתִּי חַרְבִּי בְּיַד מֶלֶךְ בָּבֶל
  english_pob_choice: when I put my sword into the hand of the king of Babylon
  chosen_korean: 내 칼을 바빌론 왕의 손에 두고
  alternatives_korean:
  - 내 칼을 바빌론 왕의 손에 넣고
  - 내 칼을 바빌론 왕의 손에 주고
  lexicon: HALOT
  rationale: נתן의 ‘두다/주다’ 의미를 살리되, ‘손에 두다’라는 관용을 유지해 야훼가 심판의 도구를 넘겨주시는 그림을 보존했습니다.
- source_word: וְנָטָה אֹתָהּ אֶל אֶרֶץ מִצְרָיִם
  english_pob_choice: and he stretches it out against the land of Egypt
  chosen_korean: 그가 그것을 이집트 땅을 향해 휘두를 때입니다
  alternatives_korean:
  - 그가 그것을 이집트 땅을 향해 펼칠 때입니다
  - 그가 그것을 이집트 땅을 향해 뻗을 때입니다
  lexicon: HALOT
  rationale: נטה의 기본 감각인 ‘펴다/뻗다’를 군사적 문맥에 맞게 ‘휘두르다’로 옮겨, 실제 공격 행위를 분명하게 했습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: YHWH를 ‘야훼’로 직역해 하나님의 언약적 고유명을 드러냄
  alternative_readings:
  - ‘주’로 대체
  - ‘여호와’로 표기
  rationale: 본문이 단순한 칭호가 아니라 신적 이름을 직접 사용하므로, 독자가 그 고유성을 인지하도록 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 바빌론의 행위와 야훼의 주권
  chosen_reading: 바빌론 왕은 야훼의 칼을 집행하는 도구로 제시됨
  alternative_readings:
  - 바빌론의 군사력이 독자적으로 강화됨
  - 야훼의 심판 도구라는 점을 약화시킨 번역
  rationale: 본문은 야훼가 직접 ‘내 칼’을 바빌론 왕의 손에 두신다고 말하므로, 인간 왕의 행위 뒤에 있는 신적 주권과 심판 도구성을 함께 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
