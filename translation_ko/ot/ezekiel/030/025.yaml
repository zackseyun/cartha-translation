review_pass:
  verdict: revise
  source_fidelity: 초안은 야훼가 바빌론 왕의 팔을 강하게 하고, 자신의 칼을 그의 손에 주어 이집트를 향하게 한다는 핵심 이미지와 행위 주체를 대체로 보존합니다. 그러나 마지막 문장이 ‘그들이 알게 될 것입니다’와 ‘…때입니다’를 부자연스럽게 분리하여 히브리어의 시간절과 결과절의 관계를 훼손합니다. 또한 נָטָה의 ‘뻗다/펴다’를 ‘휘두르다’로 좁힌 것은 안전하지 않습니다.
  naturalness: ‘바로의 팔은 떨어질 것입니다’는 직역적이지만 한국어에서 신체 부위가 실제로 탈락하는 뜻으로도 쉽게 들립니다. 본문의 군사적·은유적 문맥을 살려 ‘꺾일 것입니다’로 옮기고, 직역의 ‘떨어지다’는 각주로 보완하는 것이 현대 표준어 합쇼체에서 자연스럽습니다. 시간절을 앞세워 문장을 재구성하면 명료하고 자연스럽습니다.
  terminology: ‘바빌론’, ‘바로’, ‘이집트’, ‘야훼’는 일관되고 적절합니다. ‘내 칼을 … 손에 주고’는 נתן의 의미와 도구 이미지에 더 자연스럽게 부합합니다. ‘뻗을 때에’는 נטה의 구체적 동작을 보존합니다.
  issues:
  - severity: high
    issue: 마지막 절의 문장 연결이 비문에 가깝습니다.
    rationale: ‘그들이 … 알게 될 것입니다. 곧 … 휘두를 때입니다’는 히브리어 בְּתִתִּי(‘내가 … 할 때에’)가 수식하는 결과를 한국어에서 완결된 문장으로 연결하지 못합니다.
  - severity: medium
    issue: וְנָטָה אֹתָהּ를 ‘휘두르다’로 번역했습니다.
    rationale: נטה는 여기서 칼을 ‘뻗다/펴다’라는 방향성과 이미지를 나타냅니다. ‘휘두르다’는 공격 동작의 방식을 추가하므로 ‘뻗다’가 더 충실합니다.
  - severity: medium
    issue: ‘팔은 떨어질 것입니다’가 한국어에서 부자연스럽고 의미가 과도하게 문자화됩니다.
    rationale: 히브리어의 ‘떨어지다’는 군사적 붕괴의 은유입니다. 한국어 본문에서는 ‘꺾이다’가 자연스럽게 그 무력화 이미지를 전달하며, 직역은 각주로 밝혀 투명성을 확보할 수 있습니다.
  revised_text: 내가 바빌론 왕의 팔들을 강하게 하겠으나, 바로의 팔들은 꺾일 것입니다. 내가 내 칼을 바빌론 왕의 손에 주고 그가 그것을 이집트 땅을 향하여 뻗을 때에, 그들은 내가 야훼인 줄 알 것입니다.
  revised_footnotes:
  - marker: a
    text: 직역하면, ‘바로의 팔들은 떨어질 것이다’입니다. 히브리어는 군사적 힘의 붕괴를 팔이 떨어지는 모습으로 표현합니다.
    reason: lexical_alternative
  revision_rationale: 시간절(‘내가 … 주고 그가 … 뻗을 때에’)을 결과절(‘그들은 … 알 것입니다’)에 직접 연결해 원문의 문법 관계를 회복했습니다. 칼을 ‘휘두르다’ 대신 ‘뻗다’로 옮겨 נטה의 방향성 있는 이미지를 보존했습니다. ‘팔들이 꺾이다’는 한국어의 자연스러운 은유로 사용하되, נפל의 직역적 표현은 각주에서 제시했습니다.
