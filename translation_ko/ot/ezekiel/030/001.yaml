  rationale: ‘이렇게 말씀하셨습니다’는 לֵאמֹר가 다음 절의 직접 발화를 이끈다는 기능을 자연스러운 현대 합쇼체로 드러냅니다. ‘야훼의 말씀’과 ‘내게 임하여’는 원문의 예언 공식과 수신자를 유지합니다. 각주는 신명사에 관한 영어 감사 기록의 정보를 한국어로 정확히 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:41:36Z'
