  text: 야훼의 말씀이 내게 임하여 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה는 전통적으로 ‘주님’으로 옮기기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 임하여
  alternatives_korean:
  - 이르러
  - 오셨습니다
  - 일어났습니다
  lexicon: HALOT
  rationale: 히브리어 서두의 서사 연결과 ‘말씀이 … 오다’라는 관용적 예언 공식은 한국어에서 ‘말씀이 내게 임하여’로 자연스럽고도 출발점이 분명하게 드러납니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언 공식 דְבַר יְהוָה는 단순한 정보가 아니라 하나님의 권위 있는 선포를 가리키므로, ‘말씀’이 소스의 격식을 가장 잘 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명사 טetragrammaton을 제목어가 아닌 고유명으로 드러내기 위해 프로젝트 기본값대로 ‘야훼’를 사용했습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내 앞으로
  lexicon: HALOT
  rationale: 예언자에게 향하는 방향성을 현대 한국어로 가장 자연스럽게 살리기 위해 ‘내게’를 선택했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시되
  - 말하여
  lexicon: HALOT
  rationale: 히브리어의 인용 도입은 한국어에서 반복을 줄여 주는 서술형으로 처리해도 되므로, 뒤따를 직접 인용 없이도 완결되는 형태로 옮겼습니다.
theological_decisions:
- issue: 예언 공식에서 신적 발화의 주체를 어떻게 드러낼지
  chosen_reading: ‘야훼의 말씀이 내게 임하여 말씀하셨습니다’로 옮겨, 말씀이 도착하는 동작과 발화의 주체를 함께 보존했습니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 임하여 이르셨습니다’
  - ‘야훼의 말씀이 내게 임하셨습니다’
  rationale: 히브리어 המקרא식 공식은 단순 전달이 아니라 신적 계시의 개시를 표지하므로, 한국어에서도 ‘임하다’와 ‘말씀하셨습니다’를 함께 써서 계시 사건성과 인격적 발화를 동시에 드러내는 편이 원문에 가깝습니다.
  doctrine_reference: 예언서의 계시 서두(신적 발화 공식)
