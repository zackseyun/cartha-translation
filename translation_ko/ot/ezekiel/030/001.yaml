  source_fidelity: ‘야훼의 말씀’, ‘내게’, ‘임하여’는 히브리어 예언 공식의 핵심을 충실히 옮깁니다. 다만 לֵאמֹר는 뒤따르는 발화를 도입하므로, 이를 분명히 표지하는 표현이 필요합니다.
  naturalness: ‘말씀이 내게 임하여 말씀하셨습니다’도 성서 한국어 관습에서는 이해되지만, ‘말씀’이 발화 주체인 듯하게 들릴 수 있고 다음 절의 인용을 도입한다는 기능이 충분히 드러나지 않습니다. ‘이렇게’를 넣으면 현대적인 합쇼체를 유지하면서 문맥 연결이 명확해집니다.
  terminology: ‘야훼’와 ‘말씀’은 프로젝트의 신명 표기 및 예언 공식의 격식에 적절합니다. 각주의 전통적 대체 표기는 영어 감사 기록에 맞추어 ‘주’로 정확히 제시하는 것이 좋습니다.
