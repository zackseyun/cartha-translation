id: EZK.30.16
reference: Ezekiel 30:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַ֤תִּי אֵשׁ֙ בְּ/מִצְרַ֔יִם ח֤וּל תחיל סִ֔ין וְ/נֹ֖א תִּהְיֶ֣ה לְ/הִבָּקֵ֑עַ וְ/נֹ֖ף צָרֵ֥י יוֹמָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/016.yaml
  text: And I will set fire in Egypt[a]; Sin will writhe in anguish, and No will be broken open[d][c][b], and Noph will have enemies by day.
  footnotes:
  - marker: a
    text: Sin is the Egyptian city commonly identified with Pelusium.
    reason: cross_reference
  - marker: b
    text: No is commonly identified with Thebes.
    reason: cross_reference
  - marker: c
    text: Noph is commonly identified with Memphis.
    reason: cross_reference
  - marker: d
    text: Or 'Noph will have adversaries in the daytime.' The Hebrew clause is terse and may emphasize open, continual attack.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이집트에 불을 지르겠습니다. 신[a]은 고통 속에서 몸부림칠 것이며, 노[b]는 뚫릴 것입니다. 노프[c]에는 대낮에 대적들이 있을 것입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 신은 이집트 북동부의 도시로, 흔히 펠루시움과 동일시됩니다.
    reason: cross_reference
  - marker: b
    text: 노는 흔히 테베와 동일시됩니다.
    reason: cross_reference
  - marker: c
    text: 노프는 흔히 멤피스와 동일시됩니다.
    reason: cross_reference
  - marker: d
    text: 또는 ‘노프는 낮에 대적을 당할 것입니다.’ 히브리어 구문은 매우 간결하며, 공개적이고 계속되는 공격을 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֵשׁ
  english_pob_choice: I will set fire
  chosen_korean: 불을 놓겠습니다
  alternatives_korean:
  - 불을 두겠습니다
  - 불을 보내겠습니다
  lexicon: HALOT
  rationale: נתן with אֵשׁ in a judgment oracle is idiomatically rendered as “fire를 놓다,” preserving the causative action and the image of destructive judgment.
- source_word: חוּל תחיל
  english_pob_choice: will writhe in anguish
  chosen_korean: 고통 속에서 몸부림칠 것입니다
  alternatives_korean:
  - 떨 것입니다
  - 산고처럼 괴로워할 것입니다
  - 고통으로 떨칠 것입니다
  lexicon: HALOT
  rationale: חוּל는 단순한 떨림보다 몸이 뒤틀리는 고통의 이미지를 지니므로, “몸부림치다”로 생생한 심판의 고통을 살렸습니다.
- source_word: תִּהְיֶה לְהִבָּקֵעַ
  english_pob_choice: will be broken open
  chosen_korean: 무너져 뚫릴 것입니다
  alternatives_korean:
  - 함락될 것입니다
  - 부서져 열릴 것입니다
  - 갈라질 것입니다
  lexicon: HALOT
  rationale: Niphal infinitive of בקע는 ‘쪼개지다/뚫리다’의 수동적 침입 이미지를 가지므로, 성이 공격으로 무너져 열리는 모습을 드러내기 위해 “무너져 뚫리다”로 옮겼습니다.
- source_word: צָרֵי יוֹמָם
  english_pob_choice: will have enemies by day
  chosen_korean: 대적들을 낮에 만날 것입니다
  alternatives_korean:
  - 낮에 적들을 겪을 것입니다
  - 대적들이 낮에 있을 것입니다
  - 대적들이 대낮에 있을 것입니다
  lexicon: HALOT
  rationale: צָרֵי는 ‘원수/대적’이 가장 자연스럽고, יוֹמָם은 ‘낮에/대낮에’의 공개적·계속적 공격을 가리키므로, 동사를 보충해 한국어로 자연스럽게 구성했습니다.
- source_word: סִין / נֹא / נֹף
  english_pob_choice: Sin / No / Noph
  chosen_korean: 신 / 노 / 노프
  alternatives_korean:
  - 씬 / 놋 / 멤피스
  - 시느 / 노 / 놉
  lexicon: HALOT
  rationale: 본문의 음역을 따라 고유명사를 표기했고, 역사적 동일시는 본문이 아닌 각주에서 처리하는 원칙을 따랐습니다.
theological_decisions:
- issue: 심판 오라클의 표현 강도
  chosen_reading: ‘불을 놓겠습니다’, ‘몸부림칠 것입니다’, ‘무너져 뚫릴 것입니다’처럼 물리적·폭력적 이미지를 약화하지 않고 유지했습니다.
  alternative_readings:
  - ‘불을 일으키겠습니다’
  - ‘고통받을 것입니다’
  - ‘함락될 것입니다’
  rationale: 본문은 이집트의 도시들에 대한 가혹한 심판을 선언하므로, 한국어에서도 심판의 가시성과 파괴성을 선명하게 드러내는 쪽이 원문 의도에 더 충실합니다.
  doctrine_reference: 예언서 심판 선언의 문학적 강도 유지
