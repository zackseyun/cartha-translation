    issue: 각주 d가 노에 붙어 있으나, 각주 내용은 노프에 관한 마지막 절의 대안을 설명합니다. 또한 b와 c의 위치도 해당 지명과 일치하지 않습니다.
    rationale: 각주 표지와 설명 대상이 일치해야 하며, 현재 배열은 독자에게 잘못된 연결을 제시합니다.
