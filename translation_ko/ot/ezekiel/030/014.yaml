  lexicon: HALOT
  rationale: 히브리어 관용구가 지닌 사법적·징벌적 의미를 살리기 위해 '집행하다'를 사용했습니다.
theological_decisions:
- issue: 직접적 신적 행위의 표현
  chosen_reading: 하나님이 심판의 직접 행위자로서 '내가 ... 하겠고' 형식으로 분명히 말하는 구조를 유지했습니다.
  alternative_readings:
  - '''허락하겠다''처럼 간접 원인으로 완화하는 번역'
  - 수동적으로 바꾸어 주어를 약화하는 번역
  rationale: 본문은 화자가 직접 심판을 수행하겠다고 말하므로, 그 신학적 긴장과 권위를 약화하지 않도록 직접서술을 보존했습니다.
  doctrine_reference: 예언서의 신적 주권과 심판 선언
