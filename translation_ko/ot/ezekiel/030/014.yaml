  text: וַ/הֲשִׁמֹּתִי֙ אֶת פַּתְר֔וֹס וְ/נָתַ֥תִּי אֵ֖שׁ בְּ/צֹ֑עַן וְ/עָשִׂ֥יתִי שְׁפָטִ֖ים בְּ/נֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/014.yaml
  text: I will make Pathros desolate[a], and I will set fire in Zoan[c][b], and I will execute judgments on No.
  footnotes:
  - marker: a
    text: Or 'lay Pathros waste.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I will kindle a fire in Zoan.' Literally, 'I will give fire in Zoan.'
    reason: lexical_alternative
  - marker: c
    text: No is the Egyptian city also known as Thebes.
    reason: cultural_note
translation:
  language: ko
  text: 내가 바트로스를 황폐하게 하겠고[a], 소안에 불을 놓겠으며[b], 노에 대해 심판을 집행하겠습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “바트로스를 폐허로 만들겠다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “소안에 불을 지르겠다.” 직역하면 “소안에 불을 주겠다”입니다.
    reason: lexical_alternative
  - marker: c
    text: 노는 이집트의 도시로, 테베라고도 불립니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  english_pob_choice: I will make desolate
  chosen_korean: 황폐하게 하겠고
  alternatives_korean:
  - 폐허로 만들겠고
  - 황폐하게 만들겠고
  - 황량하게 하겠고
  lexicon: HALOT
  rationale: 파괴로 인해 사람이 살 수 없는 상태가 되는 결과를 자연스럽게 드러내면서, 예언적 심판 문맥의 강도를 유지합니다.
- source_word: פַּתְרוֹס
  english_pob_choice: Pathros
  chosen_korean: 바트로스
  alternatives_korean:
  - 파트로스
  lexicon: modern transliteration
  rationale: 고유지명은 현대 외래어 표기 원칙에 따라 음역하되, 한국어 표기에서 통용성이 높은 형태를 택했습니다.
- source_word: וְנָתַתִּי אֵשׁ
  english_pob_choice: I will set fire
  chosen_korean: 불을 놓겠으며
  alternatives_korean:
  - 불을 지르겠으며
  - 불을 붙이겠으며
  - 불을 내리겠으며
  lexicon: HALOT
  rationale: 직역의 '불을 주다'보다 한국어에서 자연스럽고, 의도된 파괴 행위를 선명하게 드러내는 표현입니다.
- source_word: וְעָשִׂיתִי שְׁפָטִים
  english_pob_choice: I will execute judgments
  chosen_korean: 심판을 집행하겠습니다
  alternatives_korean:
  - 심판을 행하겠습니다
  - 판결을 집행하겠습니다
  - 심판을 내리겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구가 지닌 사법적·징벌적 의미를 살리기 위해 '집행하다'를 사용했습니다.
theological_decisions:
- issue: 직접적 신적 행위의 표현
  chosen_reading: 하나님이 심판의 직접 행위자로서 '내가 ... 하겠고' 형식으로 분명히 말하는 구조를 유지했습니다.
  alternative_readings:
  - '''허락하겠다''처럼 간접 원인으로 완화하는 번역'
  - 수동적으로 바꾸어 주어를 약화하는 번역
  rationale: 본문은 화자가 직접 심판을 수행하겠다고 말하므로, 그 신학적 긴장과 권위를 약화하지 않도록 직접서술을 보존했습니다.
  doctrine_reference: 예언서의 신적 주권과 심판 선언
