id: EZK.30.13
reference: Ezekiel 30:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה וְ/הַאֲבַדְתִּ֨י גִלּוּלִ֜ים וְ/הִשְׁבַּתִּ֤י אֱלִילִים֙ מִ/נֹּ֔ף וְ/נָשִׂ֥יא מֵ/אֶֽרֶץ מִצְרַ֖יִם לֹ֣א יִֽהְיֶה ע֑וֹד וְ/נָתַתִּ֥י יִרְאָ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/013.yaml
  text: 'Thus says the Lord GOD: I will destroy the idols and put an end to the images from Noph[a], and there will no longer be a prince from the land of Egypt[b]; and I will put fear in the land of Egypt.'
  footnotes:
  - marker: a
    text: Noph is the Hebrew name for the Egyptian city later known in Greek as Memphis.
    reason: cross_reference
  - marker: b
    text: Or 'there will no longer be a ruler from the land of Egypt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. “내가 우상들을 멸하고, 노프의 형상들을 끝내 버리겠습니다[a]. 이집트 땅에서 더 이상 통치자가[b] 나오지 않을 것이며, 내가 이집트 땅에 두려움을 두겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 노프는 이집트 도시의 히브리어 이름으로, 그리스어 이름 멤피스에 대응합니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘이집트 땅에서 더 이상 통치자가 나오지 않을 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 합쇼체 본문에서 אֲדֹנָי יְהוִה의 이중 호칭을 살리기 위해 ‘주’와 고유명 ‘야훼’를 함께 두었습니다. POB의 영문 관행을 따라 하나님의 언약 이름을 드러내되, 한국어 교회 관용어인 ‘여호와’보다 स्रोत 직역성을 우선했습니다.
- source_word: גִלּוּלִים
  english_pob_choice: idols
  chosen_korean: 우상들
  alternatives_korean:
  - 우상
  - 우상덩어리들
  lexicon: HALOT
  rationale: 경멸적 뉘앙스가 있는 용어지만, 본문의 판단 선언을 자연스럽고 분명하게 전달하는 기본어로 ‘우상들’을 택했습니다. 지나친 의역인 ‘우상덩어리들’은 본문 품위를 해칠 수 있어 배제했습니다.
- source_word: אֱלִילִים
  english_pob_choice: images
  chosen_korean: 형상들
  alternatives_korean:
  - 우상들
  - 헛된 형상들
  lexicon: HALOT
  rationale: 앞의 גִלּוּלִים와 구별되는 근접 동의어이므로 같은 ‘우상’으로 평면화하지 않고, 우상 조각상의 물질적 형태를 살리는 ‘형상들’로 옮겼습니다.
- source_word: מִנֹּף
  english_pob_choice: from Noph
  chosen_korean: 노프
  alternatives_korean:
  - 멤피스
  lexicon: HALOT
  rationale: 영문 POB의 주석 방침과 맞추어 고유지명을 음역했습니다. 역사적 대응지명인 ‘멤피스’는 주석으로 처리될 수 있으나 본문은 히브리어 지명을 유지하는 편이 source-direct합니다.
- source_word: וְנָשִׂיא מֵאֶרֶץ מִצְרַיִם לֹא יִהְיֶה עוֹד
  english_pob_choice: there will no longer be a prince from the land of Egypt
  chosen_korean: 이집트 땅에서 더 이상 통치자가 나오지 않을 것이며
  alternatives_korean:
  - 이집트 땅에서 더 이상 왕자가 나오지 않을 것이며
  - 이집트 땅에서 더 이상 지도자가 나오지 않을 것이며
  lexicon: HALOT
  rationale: נָשִׂיא는 문맥상 ‘통치자/지도자’의 뜻이 자연스럽고, 한국어 ‘왕자’는 오해를 부르기 쉬워 피했습니다. POB의 주석적 대안인 ‘ruler’를 반영해 정치적 통치 상실을 분명히 했습니다.
- source_word: וְנָתַתִּי יִרְאָה
  english_pob_choice: I will put fear
  chosen_korean: 내가 … 두겠습니다
  alternatives_korean:
  - 내가 두려움을 주겠습니다
  - 내가 공포를 두겠습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘주다/두다’ 동사를 살려 직설적 판단 행위로 표현했습니다. 명사 יִרְאָה는 여기서 긍정적 경외가 아니라 두려움이므로 문맥상 ‘두려움’을 사용했습니다.
theological_decisions:
- issue: YHWH를 한국어 본문에서 어떻게 표기할 것인가
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 본 절은 אֲדֹנָי와 YHWH의 결합형이므로, 주호칭과 언약 이름을 모두 드러내는 표기가 필요합니다. ‘주 야훼’는 본문 구조를 보존하면서도 신학적으로 동일시를 흐리지 않습니다.
  doctrine_reference: POB contested terms table for יְהוָה / translation philosophy
- issue: גִלּוּלִים와 אֱלִילִים의 반복을 한국어에서 어떻게 처리할 것인가
  chosen_reading: ‘우상들’과 ‘형상들’로 구분
  alternative_readings:
  - 둘 다 우상들
  - 둘 다 우상
  rationale: 히브리어는 같은 사물을 가리키는 경멸적·묘사적 이중표현을 사용합니다. 한국어에서 둘 다 ‘우상’으로 만들면 수사적 변이가 사라지므로, 두 번째는 형상성을 드러내는 쪽으로 살렸습니다.
  doctrine_reference: 표현상의 수사 보존
