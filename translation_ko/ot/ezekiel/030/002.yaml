  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֶּן אָדָ֕ם הִנָּבֵא֙ וְ/אָ֣מַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הֵילִ֖ילוּ הָ֥הּ לַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/002.yaml
  text: 'Son of man[a], prophesy and say, ‘Thus says the Lord GOD: Wail[b], “Alas for the day!”’'
  footnotes:
  - marker: a
    text: 'Hebrew: ''Howl'' is another possible rendering of the imperative; ''wail'' was chosen for natural modern English while preserving the force of lament.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'Ah for the day!' The Hebrew interjection expresses grief or dread at the coming day of judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: “인자야, 예언하여 말하십시오. 주 하나님이 이렇게 말씀하십니다. ‘울부짖어라[a], “아, 그 날이여!”’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘울부짖어라’는 히브리어 명령형의 강한 비탄·애곡을 살린 번역입니다. ‘통곡하라’도 가능하지만, 본문은 더 격한 애가의 울음소리를 요구합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 감탄사 הָהּ는 ‘아, 아아’와 같은 비탄의 소리로, 다가오는 심판의 날에 대한 슬픔과 두려움을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 인간아
  - 죽을 자야
  lexicon: HALOT
  rationale: 에스겔서의 반복되는 신적 호칭을 살리기 위해 직역적 호격을 유지했습니다. 한국어 성경에서는 이미 굳어진 ‘인자야’가 본문의 호칭성과 반복성을 가장 잘 보존합니다.
- source_word: הִנָּבֵא וְאָמַרְתָּ
  english_pob_choice: prophesy and say
  chosen_korean: 예언하여 말하십시오
  alternatives_korean:
  - 예언하고 말하십시오
  - 예언하십시오 그리고 말씀하십시오
  - 예언하시오
  lexicon: HALOT
  rationale: 예언하라는 명령과 그 뒤의 발화를 함께 살려 두 동작을 자연스럽게 합쳤습니다. 합쇼체 명령으로, 선지자에게 주어지는 공식적 지시의 어조를 유지했습니다.
- source_word: יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  - 주 하나님께서
  lexicon: HALOT
  rationale: 아도나이와 결합된 신칭을 한국어에서 중복 없이 살리기 위해 ‘주 하나님’으로 옮겼습니다. 기존 교회어인 ‘여호와’ 대신, 본문이 요구하는 경칭과 고유명 사이의 긴장을 과도하게 풀지 않는 선택입니다.
- source_word: הֵילִילוּ
  english_pob_choice: Wail
  chosen_korean: 울부짖어라
  alternatives_korean:
  - 통곡하라
  - 슬피 부르짖어라
  - 울어라
  lexicon: HALOT
  rationale: ליל의 강한 애곡·비탄의 명령을 살리기 위해 단순한 ‘울다’보다 강한 표현을 택했습니다. 영어 POB의 ‘wail’과 같은 정서 강도를 한국어에서 자연스럽게 전달합니다.
- source_word: הָהּ
  english_pob_choice: Alas
  chosen_korean: 아
  alternatives_korean:
  - 아아
  - 슬프다
  - 오
  lexicon: HALOT
  rationale: 짧은 비탄의 감탄사를 한국어 감탄 ‘아’로 옮겨, 뒤따르는 날에 대한 애도와 두려움을 압축적으로 드러냈습니다.
theological_decisions:
- issue: 형식적 예언 전달 속의 직접 인용 구조
  chosen_reading: “주 하나님이 이렇게 말씀하십니다. ‘…’”로 처리해 예언자 명령과 신적 발화를 분명히 구분했습니다.
  alternative_readings:
  - “주 하나님이 말씀하십니다”
  - “주 하나님께서 말씀하신다”
  rationale: 히브리어의 כֹּה אָמַר 공식은 예언 선포의 권위를 드러내므로, 한국어에서도 문어적·공식적 틀을 유지하는 편이 본문 의도를 더 잘 반영합니다.
  doctrine_reference: 예언자적 수식어와 신적 인용의 구분
- issue: יהוה의 한국어 처리
  chosen_reading: 본문은 ‘주 하나님’으로 두되, 고유 신명은 노출하지 않고 아도나이와의 결합을 자연스럽게 반영했습니다.
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 이 절의 핵심은 신명 자체보다 선지자에게 주어지는 권위 있는 신탁 형식입니다. 한국어에서는 ‘주 하나님’이 가장 덜 인위적으로 그 기능을 재현합니다.
  doctrine_reference: 신명 번역 관행과 예언문 형식
