lexical_decisions:
- source_word: וְעָשִׂיתִי
  english_pob_choice: Thus I will execute
  chosen_korean: 이렇게 내가 … 집행하겠습니다
  alternatives_korean:
  - 그리고 내가 … 하겠습니다
  - 내가 … 행하겠습니다
  lexicon: HALOT
  rationale: עשה는 כאן שְׁפָטִים와 함께 쓰여 ‘심판을 집행하다’라는 관용적 뜻을 이루므로, 단순한 ‘하다’보다 ‘집행하다’가 더 정확합니다. 영어 POB의 결과적 전환 ‘Thus’도 한국어 ‘이렇게’로 반영했습니다.
- source_word: שְׁפָטִים
  english_pob_choice: judgments
  chosen_korean: 심판들
  alternatives_korean:
  - 판결들
  - 심판 행위들
  - 재판들
  lexicon: HALOT
  rationale: 예언서의 심판 맥락에서 복수형 שְׁפָטִים는 하나님의 여러 심판적 조치를 가리키므로, 개별 행위의 다수를 드러내는 ‘심판들’이 적절합니다.
- source_word: בְּמִצְרַיִם
  english_pob_choice: on Egypt
  chosen_korean: 이집트에
  alternatives_korean:
  - 이집트 위에
  - 이집트에 대하여
  - 이집트 안에서
  lexicon: HALOT
  rationale: 히브리어 전치사는 문자적으로 ‘안에’이지만, 여기서는 징벌의 대상에 대한 관용적 한국어로 ‘이집트에’가 자연스럽고 원문의 표적성을 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 프로젝트 기본 용례
  rationale: 본문의 신명사 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮기며, Ezekiel의 인식 공식 ‘내가 …임을 알게 될 것입니다’와 함께 언약적 자기계시를 보존합니다.
theological_decisions:
- issue: 예언 심판 공식의 어조
  chosen_reading: “심판들을 집행하겠습니다”로 번역해 선언적이고 법정적인 어조를 유지했습니다.
  alternative_readings:
  - ‘벌을 내리겠습니다’
  - ‘심판하겠습니다’
  rationale: שְׁפָטִים는 단순한 감정적 처벌보다 공적·사법적 판정을 가리키므로, ‘집행하다’가 본문의 엄중한 선포를 더 잘 드러냅니다.
  doctrine_reference: Ezekiel judgment formulas; lexical-context consistency
- issue: “내가 야훼임을 알게 될 것입니다”의 인식 공식
  chosen_reading: ידע의 반복되는 예언서 공식으로서 ‘알게 될 것입니다’를 유지했습니다.
  alternative_readings:
  - ‘깨닫게 될 것입니다’
  - ‘인정하게 될 것입니다’
  rationale: ידע는 단순 인지보다 하나님의 행위로 인해 드러나는 계시적 인식을 포함하므로, Ezekiel의 핵심 반복문을 약화시키지 않도록 직역을 유지했습니다.
  doctrine_reference: Ezekiel recognition formula
