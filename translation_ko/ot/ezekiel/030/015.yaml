  source_fidelity: ‘시온’은 히브리어 지명 סִין(Sin)과 음가가 다르며 예루살렘의 시온과 혼동될 수 있으므로 ‘신’으로 바로잡아야 합니다. 또한 두 지명 주석 표지는 각각 해당 지명 바로 뒤에 두는 것이 적절합니다. 그 밖에 ‘쏟아 붓다’, ‘무리’, ‘끊다’는 원문의 심판 언어와 의미 범위를 충실히 보존합니다.
  naturalness: ‘곧 이집트의 요새’는 앞선 지명 ‘신’을 설명하는 동격 관계를 자연스럽게 드러냅니다. 현대 표준어에서는 ‘이집트’가 ‘애굽’보다 일반적으로 자연스럽고, 합쇼체 미래 선언으로 ‘끊겠습니다’가 적절합니다.
  terminology: חֵמָה는 ‘나의 분노’, מָעוֹז는 ‘요새’, הָמוֹן은 해석을 과도하게 좁히지 않는 ‘무리’, כרת의 심판 은유는 ‘끊겠습니다’로 옮깁니다. 지명은 번역하지 않고 음역하며, 신과 노의 통상적 역사적 식별은 각주에서만 제공합니다.
