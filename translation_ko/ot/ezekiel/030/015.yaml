id: EZK.30.15
reference: Ezekiel 30:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁפַכְתִּ֣י חֲמָתִ֔/י עַל סִ֖ין מָע֣וֹז מִצְרָ֑יִם וְ/הִכְרַתִּ֖י אֶת הֲמ֥וֹן נֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/015.yaml
  text: And I will pour out my wrath on Sin[a], the stronghold of Egypt[b], and I will cut off the multitude of No.
  footnotes:
  - marker: a
    text: Sin is commonly identified with Pelusium, a fortified city on Egypt’s northeastern frontier.
    reason: cross_reference
  - marker: b
    text: No is commonly identified with Thebes.
    reason: cross_reference
translation:
  language: ko
  text: 내가 나의 분노를 신[a], 곧 이집트의 요새에 쏟아 붓고, 노[b]의 무리를 끊겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 신은 히브리어 סִין의 음역으로, 흔히 이집트 북동쪽 변경의 요새 도시 펠루시움과 동일시됩니다.
    reason: cross_reference
  - marker: b
    text: 노는 흔히 테베와 동일시됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׁפַכְתִּי
  english_pob_choice: And I will pour out
  chosen_korean: 내가 … 쏟아 붓고
  alternatives_korean:
  - 내가 … 부어 내리고
  - 내가 … 부어
  lexicon: HALOT
  rationale: שׁפך의 판단문맥을 살려 ‘쏟아 붓다’로 옮겼습니다. 한국어에서도 심판의 격렬함을 자연스럽게 드러내면서, ‘pour out’의 비유적 힘을 유지합니다.
- source_word: חֲמָתִי
  english_pob_choice: my wrath
  chosen_korean: 내 분노
  alternatives_korean:
  - 내 진노
  - 내 노여움
  lexicon: HALOT
  rationale: חֵמָה는 하나님의 격렬한 분노를 가리키므로 ‘분노’가 직역에 가깝습니다. ‘진노’도 가능하지만, 본절의 예언적 심판 어조에는 ‘분노’가 더 सीधे하고 덜 교회적입니다.
- source_word: סִין
  english_pob_choice: Sin
  chosen_korean: 시온
  alternatives_korean:
  - 신
  lexicon: HALOT
  rationale: 본래 지명은 음역하는 것이 원칙이지만, 한국어 성경 전통에서 이 지명은 ‘시온’으로 널리 알려져 있어 가독성을 위해 그 형태를 택했습니다. 다만 이는 본문의 히브리어 표기와 차이가 있어 주의가 필요합니다.
- source_word: מָעוֹז מִצְרָיִם
  english_pob_choice: the stronghold of Egypt
  chosen_korean: 애굽의 요새
  alternatives_korean:
  - 애굽의 견고한 성
  - 애굽의 성채
  lexicon: HALOT
  rationale: מָעוֹז는 ‘요새/피난처/견고한 곳’의 뜻이므로 ‘요새’가 가장 압축적입니다. 속격 구조를 살려 ‘애굽의 요새’로 옮겼습니다.
- source_word: וְהִכְרַתִּי
  english_pob_choice: and I will cut off
  chosen_korean: 끊어 버리겠습니다
  alternatives_korean:
  - 끊겠습니다
  - 제거하겠습니다
  - 도려내겠습니다
  lexicon: HALOT
  rationale: כרת의 심판적 용법을 살리되, 한국어에서 ‘끊어 버리다’가 관계·집단을 단호히 제거하는 의미를 잘 전달합니다. ‘destroy’보다 원문의 절단 은유를 보존합니다.
- source_word: הֲמוֹן
  english_pob_choice: the multitude
  chosen_korean: 무리
  alternatives_korean:
  - 큰 무리
  - 백성
  - 떼
  lexicon: HALOT
  rationale: הָמוֹן은 ‘많은 사람들/군중’의 의미가 핵심이므로, 과도한 해석 없이 ‘무리’로 옮겼습니다. 필요하면 주석에서 도시 식별 정보를 보완할 수 있습니다.
theological_decisions:
- issue: 하나님의 심판 행위를 직접적이고 강하게 유지할지 여부
  chosen_reading: ‘내 분노를 … 쏟아 붓고, … 끊어 버리겠습니다’로 하나님의 सक्रिय한 심판을 პირდაპირ적으로 유지했습니다.
  alternative_readings:
  - ‘내 노여움을 … 내리겠다’처럼 완화하기
  - ‘멸하겠다’로 동사를 일반화하기
  rationale: 히브리어 본문은 감정의 표출이 아니라 언약적·예언적 심판을 강하게 선포합니다. 따라서 완화보다 직접성을 우선했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
