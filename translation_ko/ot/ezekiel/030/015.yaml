  to: 내가 나의 분노를 신[a], 곧 이집트의 요새에 쏟아 붓고, 노[b]의 무리를 끊겠습니다.
  rationale: 원문의 지명 סִין을 ‘신’으로 정확히 음역하여 ‘시온’과의 혼동을 제거했습니다. מָעוֹז מִצְרָיִם의 동격적 설명은 ‘신, 곧 이집트의 요새’로 유지했고, הֲמוֹן의 넓은 의미는 ‘무리’로 보존했습니다. 각주 표지를 해당 지명에 연결했으며, 역사적 식별은 단정하지 않고 ‘흔히 … 동일시됩니다’로 제시했습니다.
  reviewer_model: gpt-5.6-terra
