  - 민족들을 위한 때
  lexicon: HALOT
  rationale: 가장 간명하게 원문의 탈격적·관계적 의미를 살렸고, ‘민족들’은 גּוֹיִם의 일반적 의미를 반영합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
