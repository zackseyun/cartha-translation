base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/003.yaml
  text: For the day is near[a], yes, the day of Yahweh is near; it will be a day of clouds[c][b], a time of nations.
  footnotes:
  - marker: a
    text: Or, more literally, 'a day of cloud.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the time of the nations.' The Hebrew phrase is terse and may refer to a decisive season concerning the nations.
    reason: alternative_reading
  - marker: c
    text: Hebrew 'the day of the LORD,' a prophetic expression for a day of divine intervention in judgment.
    reason: cross_reference
translation:
  language: ko
  text: 이는 그 날이 가까웠습니다. 곧 야훼의 날이 가까웠습니다. 그것은 구름의 날이 될 것이며, 민족들의 때가 될 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘민족들의 때’는 매우 압축된 히브리어 표현으로, 민족들에 관한 결정적인 시기를 가리킬 수 있습니다.
    reason: alternative_reading
