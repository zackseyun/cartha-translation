  - 여호와
  rationale: 본 구절은 예언적 관용구 ‘야훼의 날’을 포함하므로, 프로젝트 기본 원칙에 따라 신명은 야훼로 유지했습니다.
  doctrine_reference: 'POB contested terms policy: יהוה / YHWH → 야훼'
- issue: ‘여호와의 날’ 관용구의 처리
  chosen_reading: 야훼의 날
  alternative_readings:
  - 주님의 날
  - 야훼께 속한 날
  rationale: 본문은 단순한 시간표현이 아니라 야훼의 개입과 심판을 가리키는 예언적 표현이므로, 의미를 약화시키지 않는 직역형을 택했습니다.
  doctrine_reference: 예언서 관용구 보존 원칙
