  - 여호와의 날
  lexicon: HALOT
  rationale: POB의 원칙대로 신명 표기를 야훼로 반영했고, 예언서의 관용구를 직역하여 소유·관계 의미를 드러냈습니다.
- source_word: יוֹם עָנָן
  english_pob_choice: a day of clouds
  chosen_korean: 구름의 날
  alternatives_korean:
  - 구름이 낀 날
  - 구름들의 날
  lexicon: HALOT
  rationale: 히브리어의 압축된 명사구를 보존해 재난·심판의 암시를 살렸습니다. 영어 각주처럼 문자적으로는 ‘구름의 날’에 가깝습니다.
- source_word: עֵת גּוֹיִם
  english_pob_choice: a time of nations
  chosen_korean: 민족들의 때
  alternatives_korean:
