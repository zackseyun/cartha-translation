source:
  edition: WLC
  text: כִּֽי קָר֣וֹב י֔וֹם וְ/קָר֥וֹב י֖וֹם לַֽ/יהוָ֑ה י֣וֹם עָנָ֔ן עֵ֥ת גּוֹיִ֖ם יִֽהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/003.yaml
  text: For the day is near[a], yes, the day of Yahweh is near; it will be a day of clouds[c][b], a time of nations.
  footnotes:
  - marker: a
    text: Or, more literally, 'a day of cloud.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the time of the nations.' The Hebrew phrase is terse and may refer to a decisive season concerning the nations.
    reason: alternative_reading
  - marker: c
    text: Hebrew 'the day of the LORD,' a prophetic expression for a day of divine intervention in judgment.
    reason: cross_reference
translation:
  language: ko
  text: 이는 날이 가깝습니다[a]. 곧 야훼의 날이 가깝습니다. 그것은 구름의 날이 될 것이며[b], 민족들의 때가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 ‘구름의 날’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘민족들의 때’는 매우 압축된 히브리어 표현으로, 민족들에 관한 निर्ण정적 시기라는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 곧
  lexicon: HALOT
  rationale: 앞 문맥의 설명적 연결을 살리되, 한국어에서 원인절처럼 무겁게 들리지 않도록 간결한 서두로 옮겼습니다.
- source_word: קָרוֹב / יוֹם
  english_pob_choice: the day is near
  chosen_korean: 날이 가깝습니다
  alternatives_korean:
  - 그 날이 가깝습니다
  - 날이 임박했습니다
  lexicon: HALOT
  rationale: 히브리어의 단정적 현재 진술을 자연스러운 합쇼체로 옮겼고, 반복되는 ‘날’의 수사 효과를 유지했습니다.
- source_word: לַיהוָה
  english_pob_choice: the day of Yahweh
  chosen_korean: 야훼의 날
  alternatives_korean:
  - 주님의 날
  - 여호와의 날
  lexicon: HALOT
  rationale: POB의 원칙대로 신명 표기를 야훼로 반영했고, 예언서의 관용구를 직역하여 소유·관계 의미를 드러냈습니다.
- source_word: יוֹם עָנָן
  english_pob_choice: a day of clouds
  chosen_korean: 구름의 날
  alternatives_korean:
  - 구름이 낀 날
  - 구름들의 날
  lexicon: HALOT
  rationale: 히브리어의 압축된 명사구를 보존해 재난·심판의 암시를 살렸습니다. 영어 각주처럼 문자적으로는 ‘구름의 날’에 가깝습니다.
- source_word: עֵת גּוֹיִם
  english_pob_choice: a time of nations
  chosen_korean: 민족들의 때
  alternatives_korean:
  - 열국의 때
  - 민족들을 위한 때
  lexicon: HALOT
  rationale: 가장 간명하게 원문의 탈격적·관계적 의미를 살렸고, ‘민족들’은 גּוֹיִם의 일반적 의미를 반영합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본 구절은 예언적 관용구 ‘야훼의 날’을 포함하므로, 프로젝트 기본 원칙에 따라 신명은 야훼로 유지했습니다.
  doctrine_reference: 'POB contested terms policy: יהוה / YHWH → 야훼'
- issue: ‘여호와의 날’ 관용구의 처리
  chosen_reading: 야훼의 날
  alternative_readings:
  - 주님의 날
  - 야훼께 속한 날
  rationale: 본문은 단순한 시간표현이 아니라 야훼의 개입과 심판을 가리키는 예언적 표현이므로, 의미를 약화시키지 않는 직역형을 택했습니다.
  doctrine_reference: 예언서 관용구 보존 원칙
