source:
  edition: WLC
  text: וּ/בִֽ/תְחַפְנְחֵס֙ חָשַׂ֣ךְ הַ/יּ֔וֹם בְּ/שִׁבְרִ/י שָׁם֙ אֶת מֹט֣וֹת מִצְרַ֔יִם וְ/נִשְׁבַּת בָּ֖/הּ גְּא֣וֹן עֻזָּ֑/הּ הִ֚יא עָנָ֣ן יְכַסֶּ֔/נָּה וּ/בְנוֹתֶ֖י/הָ בַּ/שְּׁבִ֥י תֵלַֽכְנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/018.yaml
  text: And in Tahpanhes the day will grow dark when I break there the bars of Egypt[a], and the pride of her strength will cease in her. As for her, a cloud will cover her[b], and her daughters will go into captivity.
  footnotes:
  - marker: a
    text: Or 'the yoke-bars of Egypt.' The Hebrew metaphor may refer to the supports of Egypt's power or dominion.
    reason: lexical_alternative
  - marker: b
    text: '''Her daughters'' is a common prophetic expression for a city''s dependent towns or surrounding settlements.'
    reason: cultural_note
translation:
  language: ko
  text: 다바네스에서 그날이 어두워질 것입니다. 내가 거기서 이집트의 막대들[a]을 꺾을 때, 그곳에서 이집트의 힘에 대한 자랑이 그칠 것입니다. 그곳은 구름이 덮을 것이며, 그 딸들[b]은 포로로 끌려갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이집트의 막대들’은 권세나 지배를 떠받치는 지지물 또는 멍에 막대의 비유일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 딸들’은 예언서에서 한 도시나 나라에 딸린 주변 마을이나 정착지를 가리키는 관용적 표현일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבִתְחַפְנְחֵס
  english_pob_choice: And in Tahpanhes
  chosen_korean: 다바네스에서
  alternatives_korean:
  - 다바네스 안에서
  - 다바네스에
  lexicon: HALOT
  rationale: 지명은 현대 음역으로 옮기고, 장소 부사격은 한국어에서 자연스러운 '에서'로 처리했습니다.
- source_word: חָשַׂךְ הַיּוֹם
  english_pob_choice: the day will grow dark
  chosen_korean: 그날이 어두워질 것입니다
  alternatives_korean:
  - 그날이 어두워질 것입니다
  - 그날이 어둠 속에 놓일 것입니다
  lexicon: HALOT
  rationale: חשׂך의 어두워짐 이미지를 직설적으로 살리되, 예언적 심판의 분위기를 자연스러운 한국어로 옮겼습니다.
- source_word: מֹטוֹת מִצְרַיִם
  english_pob_choice: the bars of Egypt
  chosen_korean: 이집트의 막대들
  alternatives_korean:
  - 이집트의 멍에 막대들
  - 이집트의 지지대들
  lexicon: HALOT
  rationale: 문맥상 권세를 떠받치는 비유적 '막대/봉'의 이미지를 유지했습니다. 전통 번역의 '멍에'는 본문이 요구하는 비유를 지나치게 해석할 수 있어 피했습니다.
- source_word: וְנִשְׁבַּת בָּהּ
  english_pob_choice: will cease in her
  chosen_korean: 그 힘의 자랑이 그 안에서 그칠 것입니다
  alternatives_korean:
  - 그 안에서 그칠 것입니다
  - 그 안에서 사라질 것입니다
  lexicon: HALOT
  rationale: 구문 전체의 주어를 '힘의 자랑'으로 풀어, 단순한 소멸보다 '그침/중단'의 의미를 살렸습니다.
- source_word: וּבְנוֹתֶי/הָ
  english_pob_choice: her daughters
  chosen_korean: 그 딸들은
  alternatives_korean:
  - 그녀의 딸들은
  - 그 주변 마을들은
  lexicon: HALOT
  rationale: 예언서의 '딸들'은 속한 도시/주변 정착지를 가리키는 관용적 표현이지만, 본문 투명성을 위해 본문에서는 직역을 유지했습니다.
theological_decisions:
- issue: 의인화된 여성 대명사와 '딸들'의 지시 대상
  chosen_reading: 여성 단수 대명사는 다바네스/도시 이미지에 연결하고, '딸들'은 그에 속한 주변 정착지들을 가리키는 예언적 표현으로 보았습니다.
  alternative_readings:
  - 더 넓게 이집트 전체를 여성화한 표현으로 볼 수 있습니다.
  rationale: 가까운 문맥에 다바네스가 직접 제시되고, 예언서에서 도시의 '딸들'은 종속 마을들을 가리키는 관용이므로, 본문 이미지를 유지하는 것이 가장 투명합니다.
  doctrine_reference: 예언적 도시 의인화의 보존
- issue: הִיא의 처리
  chosen_reading: 독립대명사의 강조를 한국어에서는 별도 '그것은/그녀는'을 덧붙이지 않고 문장 흐름과 대명사 반복으로 드러냈습니다.
  alternative_readings:
  - '''그녀는''을 따로 넣어 강조할 수 있습니다.'
  rationale: 한국어에서는 주어 반복이 과도한 강조가 될 수 있어, 원문의 강세를 자연스럽게 유지하는 방식이 더 적절합니다.
  doctrine_reference: 강조는 보존하되 불필요한 문체화는 피함
