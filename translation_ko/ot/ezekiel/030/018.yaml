    rationale: 히브리어의 ‘그녀의 힘의 자랑’은 문맥상 이집트의 힘과 연결됩니다. ‘이집트의 힘에 대한 자랑’은 불필요한 교리적 해석 없이 의미를 명료하게 합니다.
