source:
  edition: WLC
  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בְּ/תִתִּ/י אֵ֣שׁ בְּ/מִצְרַ֔יִם וְ/נִשְׁבְּר֖וּ כָּל עֹזְרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/008.yaml
  text: Then they will know that I am Yahweh[a], when I set fire to Egypt and all her helpers are broken.
  footnotes:
  - marker: a
    text: Or 'all her allies are broken.' The Hebrew literally says 'all her helpers,' which may refer to Egypt's supporting nations or forces.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내가 야훼임을 알게 될 것입니다. 내가 이집트에 불을 놓을 때, 그리고 그 모든 도우미들이 무너질 때입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 모든 동맹국들이 무너질 것입니다.’ 히브리어는 문자적으로 ‘그의 모든 도우미들’을 말하며, 이는 이집트를 돕는 나라들이나 세력을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  english_pob_choice: Then they will know
  chosen_korean: 그들은 … 알게 될 것입니다
  alternatives_korean:
  - 그들은 … 알 것입니다
  - 그들은 … 알게 됩니다
  lexicon: HALOT
  rationale: 미래 결과를 나타내는 문맥이므로 자연스러운 미래 표현으로 옮기되, ידע의 기본 뜻인 ‘알다’를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문은 신명기식 대체어가 아니라 여호와 이름 자체를 사용하므로, 본 프로젝트 기본값에 따라 야훼로 옮겼습니다.
- source_word: בְּמִצְרַיִם
  english_pob_choice: in Egypt
  chosen_korean: 이집트에
  alternatives_korean:
  - 이집트 안에
  - 이집트를 향해
  lexicon: HALOT
  rationale: 전치사 ב의 기본 장소 의미를 살려 ‘이집트에’로 옮겼습니다. 심판의 방향성은 문맥이 이미 분명히 드러냅니다.
- source_word: וְנִשְׁבְּרוּ כָּל עֹזְרֶיהָ
  english_pob_choice: and all her helpers are broken
  chosen_korean: 그리고 그 모든 도우미들이 무너질 때입니다
  alternatives_korean:
  - 그리고 그 모든 동맹국들이 무너질 때입니다
  - 그리고 그 모든 조력자들이 부서질 때입니다
  lexicon: HALOT
  rationale: עֹזְרֶיהָ의 직역 의미인 ‘도우미들’을 살리되, 문맥상 이집트를 떠받치는 세력/동맹을 가리킬 수 있어 ‘도우미들’로 보존했습니다. נִשְׁבְּרוּ는 ‘부서지다/무너지다’ 가운데 더 자연스러운 ‘무너지다’를 택했습니다.
theological_decisions:
- issue: 야훼 이름의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
