  - 주님
  rationale: 본문의 신명사형은 고유명사이므로, 주석 전통의 대체어보다 이름 자체를 드러내는 표기를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
