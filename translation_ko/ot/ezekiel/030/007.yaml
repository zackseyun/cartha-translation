lexical_decisions:
- source_word: וְנָשַׁמּוּ
  english_pob_choice: they will be desolated
  chosen_korean: 황폐하게 될 것입니다
  alternatives_korean:
  - 황폐될 것입니다
  - 황무지가 될 것입니다
  - 폐허가 될 것입니다
  lexicon: WLC; HALOT
  rationale: 니팔형의 결과 상태를 살려 ‘황폐하게 되다’로 옮겼습니다. 영어 POB의 ‘be desolated’에 대응하면서도 현대 한국어에서 자연스럽습니다.
- source_word: בְּתוֹךְ אֲרָצוֹת
  english_pob_choice: among desolated lands
  chosen_korean: 황폐한 땅들 가운데서
  alternatives_korean:
  - 황폐한 땅들 속에서
  - 황폐한 땅들 가운데
  - 황폐한 나라들 가운데서
  lexicon: WLC; HALOT
  rationale: בְּתוֹךְ의 ‘한복판/가운데’를 한국어의 ‘가운데서’로 옮겨 비교적 위치 관계를 드러냈습니다. אֲרָצוֹת는 문맥상 ‘땅들/영토들’이 자연스럽습니다.
- source_word: וְעָרָיו ... עָרִים נַחֲרָבֹות
  english_pob_choice: and its cities will be among ruined cities
  chosen_korean: 그 성읍들도 무너진 성읍들 가운데서 있게 될 것입니다
  alternatives_korean:
  - 그 도시들도 무너진 도시들 가운데서 있게 될 것입니다
  - 그 성읍들도 폐허가 된 성읍들 가운데 있을 것입니다
  lexicon: WLC; HALOT
  rationale: ‘성읍’은 예언서의 도시 단위를 살리는 전통적이면서도 문맥에 맞는 표기입니다. נַחֲרָבֹות는 ‘무너진’으로 옮겨 파괴된 상태를 직접 드러냈습니다.
