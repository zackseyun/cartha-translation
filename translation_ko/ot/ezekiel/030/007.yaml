  source_fidelity: 히브리어의 병렬 구조와 미래 서술은 대체로 반영되었습니다. 그러나 첫 절의 וְנָשַׁמּוּ는 ‘황폐하게 될’보다 ‘황폐해질/황폐하게 될’로 가능하나, 뒤의 ‘그 성읍들도 … 가운데서 있게 될 것입니다’는 תִּהְיֶינָה의 단순 계사 용법을 한국어에서 지나치게 직역하여 어색하게 만들었습니다. ‘있게 될’은 장소에 새로 존재하게 된다는 뉘앙스를 낼 수 있으므로, 비교·배치 관계를 자연스럽게 살린 ‘있을 것입니다’가 적절합니다.
  naturalness: 현대 표준어 합쇼체로서 ‘황폐한 땅들 가운데서 황폐하게 될’은 반복이 다소 무겁지만 원문의 같은 어근 반복을 반영하므로 유지할 수 있습니다. 다만 ‘가운데서 있게 될 것입니다’는 현대 한국어 관용에 맞지 않아 고쳐야 합니다. ‘성읍’은 이해 가능하지만 현대 일반 독자에게는 ‘도시’가 더 자연스럽습니다.
  terminology: ‘황폐하다’는 שׁמם 계열의 황폐 상태를 잘 반영하며, ‘무너진’은 נחרבות의 파괴·폐허 상태를 무난히 전달합니다. 국가로서의 이집트를 받는 3인칭 단수 소유 접미사는 ‘그 도시들’로 자연스럽게 처리할 수 있습니다. 신학적으로 특수한 용어 문제는 없습니다.
