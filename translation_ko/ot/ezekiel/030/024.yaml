  to: 내가 바벨론 왕의 두 팔을 강하게 하겠습니다. 내가 내 칼을 그의 손에 주겠습니다. 그러나 내가 바로의 두 팔을 꺾겠으며, 그는 죽임당한 사람이 신음하듯 그 앞에서 신음할 것입니다.[a]
