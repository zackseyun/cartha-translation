base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/024.yaml
  text: And I will strengthen the arms of the king of Babylon[a], and I will put my sword into his hand; but I will break the arms of Pharaoh, and he will groan before him with the groanings of a slain man.
  footnotes:
  - marker: a
    text: Or, 'before me,' if the final pronoun is understood to refer to the LORD rather than to the king of Babylon.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 바벨론 왕의 두 팔을 강하게 하겠습니다. 내가 내 칼을 그의 손에 주겠습니다. 그러나 내가 바로의 두 팔을 꺾겠으며, 그는 죽임당한 사람이 신음하듯 그 앞에서 신음할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 앞에서’. 마지막 대명사가 바벨론 왕이 아니라 나, 곧 여호와를 가리킨다고 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חִזַּקְתִּי
  english_pob_choice: I will strengthen
  chosen_korean: 강하게 하며
  alternatives_korean:
  - 강화하며
  - 굳세게 하며
  lexicon: HALOT
  rationale: 미래적 선지자 어법을 살리면서 군사적 힘의 증강이라는 이미지를 자연스럽게 옮겼습니다.
- source_word: זְרֹעוֹת
  english_pob_choice: arms
  chosen_korean: 팔들
  alternatives_korean:
  - 팔
  - 힘
  - 권세
  lexicon: HALOT
  rationale: 직역된 신체 이미지를 유지해, 바로의 팔을 ‘꺾는’ 뒤 대비가 선명하게 드러나게 했습니다.
- source_word: נָתַתִּי אֶת חַרְבִּי בְּיָדוֹ
  english_pob_choice: I will put my sword into his hand
  chosen_korean: 내 칼을 그의 손에 두겠고
  alternatives_korean:
  - 내 칼을 그의 손에 넣겠고
  - 내 칼을 그의 손에 주겠고
  lexicon: HALOT
  rationale: 소유격 ‘내 칼’을 살려 야훼의 심판 도구라는 점을 드러내고, 손에 둔다는 표현으로 위임된 행위를 자연스럽게 전달했습니다.
- source_word: נַאֲקוֹת חָלָל
  english_pob_choice: the groanings of a slain man
  chosen_korean: 살육당한 자의 신음처럼
  alternatives_korean:
  - 죽임당한 자의 신음처럼
  - 살해당한 자의 신음처럼
  lexicon: HALOT
  rationale: חָלָל을 단순한 부상자보다 전투에서 죽임당한 자로 이해해 ‘살육당한 자’로 옮기고, 고통의 소리를 ‘신음’으로 살렸습니다.
theological_decisions:
- issue: לְפָנָיו의 지시 대상
  chosen_reading: ‘그 앞에서’는 바로 왕을 가리키는 것으로 두었습니다.
  alternative_readings:
  - ‘내 앞에서’로 이해할 수 있습니다.
  rationale: 가장 가까운 선행사는 ‘그의 손’의 ‘그’로, 문맥상 바벨론 왕의 수중에 야훼의 칼이 주어지는 흐름이 이어집니다. 다만 대안 독법도 남아 있는 만큼 본문 해석의 긴장은 해소하지 않았습니다.
  doctrine_reference: 의미가 genuine하게 모호할 때는 신학적 긴장을 보존합니다.
