  source_fidelity: 전반적인 대조 구조와 미래적 예언 어법은 잘 반영되었습니다. 그러나 חָלָל은 ‘살육당한 자’보다 일반적으로 ‘죽임당한 자/쓰러진 자’에 가깝고, ‘살육’은 집단적·잔혹한 학살의 뉘앙스를 부가합니다. 또한 נָתַתִּי ... בְּיָדוֹ는 한국어로 ‘그의 손에 주다’가 더 직접적이고 자연스럽습니다.
  naturalness: ‘팔들을’과 ‘그의 손에 두겠고’는 이해되지만 현대 표준어에서는 다소 번역투입니다. 신체 은유를 보존하면서 ‘두 팔’ 및 ‘손에 주겠습니다’로 하면 자연스럽습니다. 합쇼체에 맞추어 문장 종결도 일관되게 정리했습니다.
  terminology: ‘바벨론 왕’, ‘바로’, ‘내 칼’, ‘팔’의 은유를 유지했습니다. ‘죽임당한 사람’은 חָלָל의 전쟁·폭력 문맥을 보존하되 ‘살육’이 덧붙이는 과도한 뉘앙스를 피합니다. 마지막 대명사의 선행사는 바벨론 왕으로 읽되, 여호와를 가리킬 가능성은 각주로 보존합니다.
  issues:
