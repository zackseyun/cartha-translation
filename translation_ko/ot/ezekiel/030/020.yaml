base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/020.yaml
  text: And it happened in the eleventh year, in the first month, on the seventh day of the month, that the word of Yahweh came to me, saying,
translation:
  language: ko
  text: 열한 번째 해 첫째 달 일곱째 날에 야훼의 말씀이 나에게 임하여 이르기를,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 제십일 년에
  alternatives_korean:
  - 그리고 일어났습니다
  - 그 일이 있었습니다
  lexicon: WLC 문맥상 날짜 표지
  rationale: 히브리어 wayyiqtol은 여기서 서술 사건의 시작을 알리는 날짜 서문이므로, 한국어에서는 자연스러운 연대 표지로 풀어 앞부분을 정리했습니다.
- source_word: בְּאַחַת עֶשְׂרֵה שָׁנָה / בָּרִאשׁוֹן / בְּשִׁבְעָה לַחֹדֶשׁ
  english_pob_choice: in the eleventh year, in the first month, on the seventh day of the month
  chosen_korean: 제십일 년, 곧 첫째 달 초이렛날
  alternatives_korean:
  - 열한째 해 첫째 달 일곱째 날
  - 제십일 년 첫째 달 일곱째 날
  lexicon: 히브리어 날짜 관용구
  rationale: ‘첫째 달’과 ‘초이렛날’이 날짜 공식의 핵심이므로, 한국어에서도 연대-월-일 순서를 살려 압축적으로 옮겼습니다.
- source_word: הָיָה דְבַר יְהוָה
  english_pob_choice: the word of Yahweh came
  chosen_korean: 야훼의 말씀이 내게 임하여
  alternatives_korean:
  - 야훼의 말씀이 내게 와서
  - 야훼의 말씀이 내게 이르러
  lexicon: 예언 공식
  rationale: ‘말씀이 임하다’는 예언서의 표준적 한국어 표현으로, מקור의 ‘있었다/왔다’라는 발생적 의미와 계시의 도착성을 함께 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: Tetragrammaton
  rationale: 기존 POB 방침에 따라 신명은 ‘야훼’로 옮겨, 인명적·언약적 고유성을 유지했습니다.
theological_decisions:
- issue: 예언 전형문의 종결 방식
  chosen_reading: ‘말씀하시기를’로 마무리해 다음 절의 직접화를 열어 두었습니다.
  alternative_readings:
  - ‘말씀하여’
  - ‘말하셨습니다’
  rationale: לֵאמֹר는 다음 절의 인용을 여는 표지이므로, 한국어에서도 서술을 닫지 않고 직접화로 이어지게 했습니다.
  doctrine_reference: 예언서 담화 구조 보존
- issue: 여호와/야훼 표기
  chosen_reading: 본문에는 ‘야훼’를 사용했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 이 구절은 야훼의 고유명이 직접 나타나므로, 제목화된 대체어보다 이름 자체를 보존하는 것이 원문 의미를 더 분명히 드러냅니다.
  doctrine_reference: 이름-칭호 구분
