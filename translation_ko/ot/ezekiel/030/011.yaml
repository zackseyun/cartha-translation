  to: 그와 그와 함께 있는 그의 백성, 곧 민족들 가운데 잔인한 자들이 끌려와 그 땅을 파괴할 것입니다[a]. 그들은 이집트를 향해 칼을 빼어 들고 그 땅을 죽임당한 자들로 가득 채울 것입니다.
