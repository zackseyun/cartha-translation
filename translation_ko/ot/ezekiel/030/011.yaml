source:
  edition: WLC
  text: ה֠וּא וְ/עַמּ֤/וֹ אִתּ/וֹ֙ עָרִיצֵ֣י גוֹיִ֔ם מֽוּבָאִ֖ים לְ/שַׁחֵ֣ת הָ/אָ֑רֶץ וְ/הֵרִ֤יקוּ חַרְבוֹתָ/ם֙ עַל מִצְרַ֔יִם וּ/מָלְא֥וּ אֶת הָ/אָ֖רֶץ חָלָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/011.yaml
  text: He and his people with him—the ruthless of the nations—will be brought in to destroy the land[a]. They will draw their swords against Egypt and fill the land with the slain.
  footnotes:
  - marker: a
    text: Or 'the ruthless ones of the nations' / 'the terrible ones of the nations.' The Hebrew expression emphasizes the brutal character of the invading peoples.
    reason: lexical_alternative
translation:
  language: ko
  text: 그와 그와 함께 있는 그의 백성, 곧 민족들 가운데 잔인한 자들이 끌려와 그 땅을 파괴할 것입니다[a]. 그들은 이집트를 향해 칼을 빼어 들고 그 땅을 죽임당한 자들로 가득 채울 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족들 가운데 포악한 자들’ / ‘민족들 가운데 무서운 자들’. 히브리어 표현은 침략 민족들의 잔혹한 성격을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוֹ
  english_pob_choice: his people
  chosen_korean: 그의 백성
  alternatives_korean:
  - 그의 군대
  - 그의 부대
  lexicon: HALOT
  rationale: עַם은 기본적으로 ‘백성/사람들’이며, 전투 집단을 가리킬 수 있으나 ‘군대’로 좁히기보다 원문 구조를 살려 ‘백성’으로 옮겼습니다.
- source_word: עָרִיצֵי גוֹיִם
  english_pob_choice: the ruthless of the nations
  chosen_korean: 민족들 가운데 가장 잔인한 자들
  alternatives_korean:
  - 민족들 가운데 잔인한 자들
  - 민족들의 폭군들
  - 민족들 가운데 무서운 자들
  lexicon: HALOT
  rationale: עָרִיץ는 폭력적이고 잔혹한 성격을 가리키므로, POB의 의미를 따라 ‘잔인한 자들’로 옮기되 집합적 수식을 자연스럽게 풀어 한국어화했습니다.
- source_word: וְהֵרִיקוּ חַרְבוֹתָם עַל
  english_pob_choice: They will draw their swords against
  chosen_korean: 칼을 빼어 들고
  alternatives_korean:
  - 그들의 칼을 꺼내어
  - 그들의 칼을 뽑아
  - 칼을 뽑아
  lexicon: HALOT
  rationale: ‘검을/칼을 비우다, 뽑다’라는 관용적 전투 표현을 한국어 군사 관용에 맞게 ‘칼을 빼어 들고’로 옮겼습니다.
- source_word: חָלָל
  english_pob_choice: the slain
  chosen_korean: 살륙한 자들
  alternatives_korean:
  - 죽임당한 자들
  - 전사한 자들
  - 엎드러진 자들
  lexicon: HALOT
  rationale: חָלָל은 전투에서 죽임을 당한 자들을 뜻하므로, 단순한 시체보다 전투적 뉘앙스를 보존하는 표현을 택했습니다.
theological_decisions:
- issue: 예언적 미래 시제와 군사적 이미지의 유지
  chosen_reading: 원문의 연속된 미래형을 살려 침공과 학살의 진행을 단정적으로 예고하는 문장으로 옮겼습니다.
  alternative_readings:
  - 현재형으로 완화하는 번역
  - 추상적으로 ‘파괴하다’만 강조하는 번역
  rationale: 본문은 심판 예언으로서 실제 침공과 살륙을 강하게 선포하므로, 한국어도 그 긴박한 미래성을 약화하지 않았습니다.
  doctrine_reference: 예언서의 심판 선포 방식
