  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲפִצוֹתִ֤י אֶת מִצְרַ֨יִם֙ בַּ/גּוֹיִ֔ם וְ/זֵרִיתִ֥י אוֹתָ֖/ם בָּ/אֲרָצ֑וֹת וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/026.yaml
  text: I will scatter Egypt among the nations[a], and I will disperse them through the lands. Then they will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'I will scatter them among the nations, and disperse them through the countries.' The Hebrew first names 'Egypt' and then refers to its people with 'them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이집트를 민족들 가운데로 흩어 버리고, 그들을 여러 땅에 흩어 놓겠습니다. 그러면 그들은 내가 야훼임을 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그들을 민족들 가운데로 흩고, 여러 땅에 흩어 놓겠습니다.’ 여기서는 먼저 ‘이집트’가 나오고, 이어 복수 대명사 ‘그들을’로 그 백성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲפִצוֹתִי
  english_pob_choice: I will scatter
  chosen_korean: 흩어 버리고
  alternatives_korean:
  - 흩겠습니다
  - 흩어놓겠습니다
  - 분산시키겠습니다
  lexicon: HALOT
  rationale: 피동적 결과를 낳는 심판 행위로서 ‘scatter’의 이미지를 살려 ‘흩어 버리고’로 옮겼습니다. 뒤의 동사와 중복을 피하면서도 의미를 유지합니다.
- source_word: מִצְרַיִם
  english_pob_choice: Egypt
  chosen_korean: 이집트
  alternatives_korean:
  - 애굽
  - 이집트 사람들
  lexicon: HALOT
  rationale: 히브리어의 지명 형태를 따라 나라 이름으로 옮겼습니다. 이어지는 복수 대명사 ‘그들을’이 집단 구성원들을 가리킨다는 점도 자연스럽게 살릴 수 있습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 민족들 가운데로
  alternatives_korean:
  - 나라들 가운데로
  - 열국 가운데로
  - 민족들 사이에
  lexicon: HALOT
  rationale: גּוֹיִם의 기본 의미를 따라 ‘민족들’로 옮기고, 이동·분산의 방향을 드러내기 위해 ‘가운데로’로 처리했습니다.
- source_word: וְזֵרִיתִי
  english_pob_choice: I will disperse
  chosen_korean: 흩어 놓겠습니다
  alternatives_korean:
  - 분산시키겠습니다
  - 뿔뿔이 흩겠습니다
  - 흩어 버리겠습니다
  lexicon: HALOT
  rationale: 첫 번째 동사와 같은 계열이지만, כאן은 더 넓은 지역으로 퍼뜨리는 느낌이 있어 ‘흩어 놓겠습니다’로 다르게 살렸습니다. 심판의 강제성과 완결성도 담습니다.
- source_word: אוֹתָם
  english_pob_choice: them
  chosen_korean: 그들을
  alternatives_korean:
  - 그것을
  - 그 사람들을
  lexicon: HALOT
  rationale: 앞의 ‘이집트’가 집합적 지시를 하므로, 실제 지시 대상인 사람들을 가리키는 복수 대명사로 옮겼습니다.
- source_word: בָּאֲרָצוֹת
  english_pob_choice: through the lands
  chosen_korean: 여러 땅에
  alternatives_korean:
  - 나라들에
  - 땅들에
  - 각지에
  lexicon: HALOT
  rationale: אֲרָצוֹת의 복수성을 살리되 한국어에서 자연스럽게 들리도록 ‘여러 땅에’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사를 전통적 호칭으로 대체하지 않고, 프로젝트 기본값에 따라 ‘야훼’로 음역했습니다.
theological_decisions:
- issue: 여호와/주님이 아니라 고유명사 יְהוָה를 어떻게 드러낼 것인가
  chosen_reading: ‘야훼’로 직접 옮겨, 심판 선언의 결론이 하나님의 언약 이름을 분명히 가리키게 했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 단순한 호칭이 아니라 신적 이름을 직접 사용합니다. 한국어 교회어의 관습보다 स्रोत의 고유명사를 보존하는 것이 본문의 의도를 더 투명하게 전달합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
