source:
  edition: WLC
  text: וְ/נָתַתִּ֤י יְאֹרִים֙ חָֽרָבָ֔ה וּ/מָכַרְתִּ֥י אֶת הָ/אָ֖רֶץ בְּ/יַד רָעִ֑ים וַ/הֲשִׁמֹּתִ֞י אֶ֤רֶץ וּ/מְלֹאָ/הּ֙ בְּ/יַד זָרִ֔ים אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/012.yaml
  text: And I will make the Nile channels dry[a], and I will sell the land into the hand of evil men; and I will devastate the land and its fullness by the hand of foreigners. I am Yahweh[c][b]; I have spoken.
  footnotes:
  - marker: a
    text: Or 'the canals' or 'the rivers'; in Egypt the term likely refers to the Nile waterways.
    reason: lexical_alternative
  - marker: b
    text: Or 'hand over the land'; the Hebrew verb is literally 'sell,' a judgment image for giving a people over to hostile power.
    reason: lexical_alternative
  - marker: c
    text: Or 'the land and all that is in it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 나일의 수로들을 마르게 하고[a], 그 땅을 악한 자들의 손에 팔고[b], 그 땅과 그 안에 가득한 모든 것을 이방인들의 손으로 황폐하게 하겠습니다[c]. 나는 야훼입니다. 내가 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘운하들’, ‘강들’. 이집트 문맥에서 이 말은 나일의 물길들을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘팔다’입니다. 심판 문맥에서는 적대 세력에게 넘겨주거나 내주는 것을 비유적으로 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 땅과 그 충만함’. 히브리어는 그 땅과 그 안을 채우는 모든 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְאֹרִים
  english_pob_choice: the Nile channels
  chosen_korean: 나일의 수로들
  alternatives_korean:
  - 나일 운하들
  - 나일 강줄기들
  - 나일의 물길들
  lexicon: HALOT
  rationale: 이집트 문맥에서 יְאֹרִים은 일반적인 강이 아니라 나일과 그 수로망을 가리키므로, ‘나일의 수로들’이 지리적 배경과 의미를 함께 살립니다.
- source_word: וּמָכַרְתִּי
  english_pob_choice: I will sell
  chosen_korean: 넘겨주고
  alternatives_korean:
  - 팔고
  - 내어주고
  - 양도하고
  lexicon: HALOT
  rationale: 히브리어의 문자적 뜻은 ‘팔다’이지만, 심판 맥락에서는 적대 세력에게 넘겨지는 행위를 가리키므로 한국어에서는 유려하게 ‘넘겨주고’로 옮기되, 문맥의 사법적 강도를 유지했습니다.
- source_word: אֶרֶץ וּמְלֹאָהּ
  english_pob_choice: the land and its fullness
  chosen_korean: 그 땅과 그 충만한 것
  alternatives_korean:
  - 그 땅과 그 안에 있는 모든 것
  - 그 땅과 그 충만함
  - 그 땅과 그 가득 찬 것
  lexicon: HALOT
  rationale: מְלֹאָהּ는 단순한 ‘내용물’보다 그 땅을 채우는 모든 것을 가리키므로, 직역성을 살린 ‘그 충만한 것’으로 두어 의미의 폭을 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유한 신명 יְהוָה는 본 프로젝트 기본어인 ‘야훼’로 옮겨, 호칭으로 대체하지 않고 언약적 고유명을 드러냈습니다.
theological_decisions:
- issue: 심판 선언에서의 동사 연쇄와 확정적 종결
  chosen_reading: ‘말라버리게 하며… 넘겨주고… 황폐하게 하겠습니다’로 연속된 의지/심판 선언을 살리고, 마지막에 ‘내가 말했습니다’로 확정성을 드러냈습니다.
  alternative_readings:
  - 평서형으로 약화하여 ‘말라지게 하고… 넘겨주며… 황폐하게 할 것이다’
  - ‘주었습니다’처럼 이미 완결된 과거로 처리
  rationale: 예언적 심판 선언의 미래적 확정성과 하나님의 주도권을 유지하려면, 한국어에서도 연속 동작과 종결 공식이 모두 선명해야 합니다.
  doctrine_reference: 예언 문체와 심판 신탁의 확정성
