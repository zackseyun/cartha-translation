  text: בֶּן אָדָ֕ם אֶת זְר֛וֹעַ פַּרְעֹ֥ה מֶֽלֶךְ מִצְרַ֖יִם שָׁבָ֑רְתִּי וְ/הִנֵּ֣ה לֹֽא חֻ֠בְּשָׁה לָ/תֵ֨ת רְפֻא֜וֹת לָ/שׂ֥וּם חִתּ֛וּל לְ/חָבְשָׁ֥/הּ לְ/חָזְקָ֖/הּ לִ/תְפֹּ֥שׂ בֶּ/חָֽרֶב־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/021.yaml
  text: Son of man[a], I have broken the arm of Pharaoh king of Egypt, and behold, it has not been bound up to apply remedies, to put on a bandage, to bind it, to strengthen it so that it may grasp the sword.
  footnotes:
  - marker: a
    text: Or 'to give remedies'; the Hebrew phrase refers to applying medical treatment to the broken arm.
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 내가 바로바로바로를 부러뜨렸습니다. 보라, 그것이 아직 감싸지지 않아 치료를 더하고, 붕대를 감고, 그것을 묶고, 그것을 강하게 하여 칼을 붙잡게 하려 하지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘치료책을 더하다’로 옮길 수 있습니다. 히브리어 표현은 부러진 팔에 의학적 처치를 가하는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서의 반복되는 예언자 호칭을 살리기 위해 직역적 호칭을 유지했습니다. 한국어에서는 호격을 자연스럽게 드러내기 위해 ‘인자야’로 옮겼습니다.
- source_word: זְרֹעַ
  english_pob_choice: arm
  chosen_korean: 팔
  alternatives_korean:
  - 팔뚝
  - 힘
  lexicon: HALOT
  rationale: 정치·군사적 은유를 그대로 보존하기 위해 신체 부위인 ‘팔’을 사용했습니다.
- source_word: לָתֵת רְפֻאוֹת
  english_pob_choice: to apply healing / remedies
  chosen_korean: 치료를 더하고
  alternatives_korean:
  - 치료책을 더하고
  - 치유를 더하고
  lexicon: HALOT
  rationale: 복수형 명사와 치료 행위를 함께 살리면서도 한국어에서 자연스럽게 읽히도록 ‘치료를 더하다’로 옮겼습니다.
- source_word: חִתּוּל
  english_pob_choice: a bandage
  chosen_korean: 붕대
  alternatives_korean:
  - 감는 천
  - 반창고
  lexicon: HALOT
  rationale: 의학적 감싸기 이미지를 현대 한국어로 가장 분명하게 전달하는 표현입니다.
- source_word: לִתְפֹּשׂ בֶּחָרֶב
  english_pob_choice: so that it may grasp the sword
  chosen_korean: 칼을 붙잡게
  alternatives_korean:
  - 칼을 잡게
  - 칼을 쥐게
  lexicon: HALOT
  rationale: 회복된 전투 능력을 보여 주는 동작을 살리기 위해 ‘붙잡다’를 택했습니다.
theological_decisions:
- issue: 예언자 호칭의 음역과 호격 처리
  chosen_reading: ‘인자야’로 옮겨 예언자에게 직접 말하는 호칭임을 드러냈습니다.
  alternative_readings:
  - ‘사람의 아들아’
  - ‘인자’
  rationale: 히브리어 본문의 직접 호격을 한국어 문장 흐름 속에서 분명히 드러내면서도, 에스겔서의 반복되는 신학적·수사적 기능을 보존하기 위함입니다.
  doctrine_reference: 예언자 소명과 하나님의 직접 발화 형식
