  lexicon: HALOT
  rationale: 원문은 지명 '이집트'를 직접 목적어로 쓰지만, 뒤의 복수 대명사로 백성을 가리키는 메톤미를 담고 있어 지명 그대로 유지하는 것이 원문에 충실합니다.
