  lexicon: HALOT
  rationale: 복수형 '땅들'의 분산성을 살리면서도, 앞절과 평행을 이루는 표현으로 '여러 땅 가운데로'가 무리 없습니다.
theological_decisions:
- issue: ‘이집트’와 복수 대명사 ‘그들’의 지시 대상 처리
  chosen_reading: 첫 절에서는 나라 이름 '이집트'를 그대로 두고, 둘째 절의 복수는 '그들'로 옮겨 백성을 가리키는 메톤미를 유지했습니다.
  alternative_readings:
  - 첫 절부터 '이집트인들'로 풀어 의미를 명시함
  rationale: 히브리어가 나라 이름과 복수 대명사를 나란히 쓰는 긴장을 한국어도 그대로 드러내는 편이 원문 가독성과 의미 모두에 유리합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it; Original-language primacy over translation tradition.'
