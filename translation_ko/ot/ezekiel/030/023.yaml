  rationale: גּוֹיִם은 문맥상 '민족들/나라들'이 가능하지만, 심판과 포로 분산의 표현에서는 '여러 민족 가운데로'가 한국어로 가장 자연스럽고 넓은 분산을 잘 드러냅니다.
