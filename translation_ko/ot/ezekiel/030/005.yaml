  verdict: revise
  source_fidelity: 원문의 민족·지명 목록과 ‘그들과 함께 칼에 쓰러질 것이다’라는 심판 진술은 대체로 반영했습니다. 그러나 כּוּב의 음역을 ‘구벡’으로 한 것은 히브리어 자음 배열과 맞지 않으며, ‘쿠브’로 바로잡는 것이 안전합니다. 또한 ‘그들도 함께’는 אִתָּם(‘그들과 함께’)의 관계를 충분히 드러내지 못합니다.
  naturalness: ‘언약의 땅의 자손이 — 그들도 함께’는 한국어 문장 연결이 부자연스럽습니다. ‘언약의 땅의 자손들도 그들과 함께’로 고치면 원문의 연관 관계를 살리면서 현대 한국어 문장으로 자연스럽습니다.
  terminology: 구스, 붓, 룻은 음역 원칙에 부합합니다. כּוּב은 불확실한 희귀 지명이므로 해석적 지명화보다 ‘쿠브’라는 음역이 적절합니다. ‘칼에 쓰러질 것입니다’는 예언적 문맥과 히브리어 관용 표현을 잘 보존합니다.
