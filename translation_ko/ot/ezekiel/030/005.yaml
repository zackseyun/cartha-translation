  text: כּ֣וּשׁ וּ/פ֤וּט וְ/לוּד֙ וְ/כָל הָ/עֶ֣רֶב וְ/כ֔וּב וּ/בְנֵ֖י אֶ֣רֶץ הַ/בְּרִ֑ית אִתָּ֖/ם בַּ/חֶ֥רֶב יִפֹּֽלוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/005.yaml
  text: Cush and Put and Lud and all the mixed people and Cub and the sons of the land of the covenant—with them they will fall by the sword[a][b][c].
  footnotes:
  - marker: a
    text: Or 'all Arabia,' 'all the mercenaries,' or 'all the mixed multitude' for 'all the mixed people' (Hebrew עֶרֶב).
    reason: lexical_alternative
  - marker: b
    text: '''Cub'' is a rare place-name; the identification is uncertain. It may also be rendered ''Kub.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'the people of the land of the covenant.' The phrase may refer to people allied by treaty, and some understand it as referring to Judeans living in Egypt.
    reason: alternative_reading
translation:
  language: ko
  text: 구스와 붓과 룻과 모든 섞인 백성과 쿠브와 언약의 땅의 자손들도 그들과 함께 칼에 쓰러질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 섞인 백성’은 히브리어 עֶרֶב를 옮긴 말이며, ‘온 아라비아’, ‘모든 용병들’, 또는 ‘모든 섞인 무리’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘쿠브’는 드문 지명이며 그 위치나 정체는 확실하지 않습니다. ‘구브’로도 음역할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘언약의 땅의 자손’은 ‘언약의 땅의 백성’으로도 이해할 수 있습니다. 이 표현은 조약으로 연합한 사람들을 가리킬 수도 있으며, 이집트에 거주한 유다인들을 가리킨다고 이해하는 견해도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כּוּשׁ
  english_pob_choice: Cush
  chosen_korean: 구스
  alternatives_korean:
  - 에티오피아
  lexicon: HALOT
  rationale: 고유명사는 음역을 따르는 것이 원문 지리·민족 명칭을 가장 직접적으로 보존합니다.
- source_word: כָל הָעֶרֶב
  english_pob_choice: all the mixed people
  chosen_korean: 모든 섞인 백성
  alternatives_korean:
  - 모든 혼합 무리
  - 모든 잡다한 사람들
  - 온 아라비아
  lexicon: HALOT
  rationale: עֶרֶב는 특정 민족명보다 섞인 집단을 가리키는 뜻이 자연스러워, 원문의 모호성을 살리되 한국어로는 현대 독자가 이해하기 쉬운 ‘섞인 백성’으로 옮겼습니다.
- source_word: כּוּב
  english_pob_choice: Cub
  chosen_korean: 구벡
  alternatives_korean:
  - 쿠브
  - 구브
  lexicon: HALOT
  rationale: 희귀한 지명은 음역을 유지하되, 히브리 자음에 더 가까운 표기를 택했습니다. 다만 전승상 식별이 불확실하므로 주석 여지를 남깁니다.
- source_word: בְנֵי אֶרֶץ הַבְּרִית
  english_pob_choice: the sons of the land of the covenant
  chosen_korean: 언약의 땅의 자손
  alternatives_korean:
  - 언약의 땅의 백성
  - 언약의 땅 사람들
  lexicon: HALOT
  rationale: בְנֵי를 ‘자손’으로 옮겨 원문의 직역성을 살렸고, ‘땅의 언약’인지 ‘언약의 땅’인지의 구문적 모호성은 그대로 보존했습니다.
- source_word: בַּחֶרֶב יִפֹּלוּ
  english_pob_choice: they will fall by the sword
  chosen_korean: 칼에 쓰러질 것입니다
  alternatives_korean:
  - 칼로 쓰러질 것입니다
  - 칼에 떨어질 것입니다
  - 칼에 죽을 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘떨어지다/쓰러지다’ 의미를 살리되, 한국어에서는 자연스러운 예언적 종말 표현으로 ‘쓰러질 것입니다’를 택했습니다.
theological_decisions:
- issue: ‘언약의 땅’의 가리키는 대상이 불확정적임
  chosen_reading: 본문에는 특정 집단을 단정하지 않고, 원문이 허용하는 모호성을 유지했습니다.
  alternative_readings:
  - 유다인들을 가리킨다는 해석
  - 조약으로 연합한 사람들을 가리킨다는 해석
  rationale: 예언 문맥에서 독자에게 확정되지 않은 역사적 식별을 본문 속에 끼워 넣기보다, 원문의 불확실성을 유지하는 편이 더 충실합니다.
  doctrine_reference: 성경해석의 문맥 우선성과 본문 보존 원칙
