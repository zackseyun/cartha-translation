  text: בַּח֥וּרֵי אָ֛וֶן וּ/פִי בֶ֖סֶת בַּ/חֶ֣רֶב יִפֹּ֑לוּ וְ/הֵ֖נָּה בַּ/שְּׁבִ֥י תֵלַֽכְנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/017.yaml
  text: The young men of Aven and Pi-beseth will fall by the sword[b][a], and these cities will go into captivity.
  footnotes:
  - marker: a
    text: Aven likely refers to On, that is, Heliopolis in Egypt.
    reason: alternative_reading
  - marker: b
    text: Pi-beseth is commonly identified with Bubastis.
    reason: alternative_reading
translation:
  language: ko
  text: 아웬의 젊은이들과 피-베셋의 젊은이들은 칼에 쓰러지고, 이 성읍들은 포로로 끌려갈 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아웬은 아마도 이집트의 온, 곧 헬리오폴리스를 가리키는 이름입니다.
    reason: alternative_reading
  - marker: b
    text: 피-베셋은 흔히 부바스티스로 식별됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּח֥וּרֵי
  english_pob_choice: young men of
  chosen_korean: 젊은이들
  alternatives_korean:
  - 젊은 남자들
  - 청년들
  lexicon: HALOT
  rationale: בַּחוּרִים은 전투·심판 맥락에서 결혼 전후의 젊은 남자들을 가리키므로, 자연스러운 표준어로 ‘젊은이들’이라고 옮겼습니다.
- source_word: אָ֛וֶן
  english_pob_choice: Aven
  chosen_korean: 아웬
  alternatives_korean:
  - 온
  lexicon: HALOT
  rationale: 지명은 본문 형태를 따라 음역하는 것이 기본이므로 ‘아웬’을 유지했습니다. 영어 주석이 제시한 온/헬리오폴리스 연관성은 본문이 아니라 주석에서 다루는 편이 적절합니다.
- source_word: וּפִי בֶ֖סֶת
  english_pob_choice: Pi-beseth
  chosen_korean: 피-베셋
  alternatives_korean:
  - 부바스티스
  lexicon: HALOT
  rationale: 히브리어 지명 형태를 따라 음역했고, 역사적 식별명인 부바스티스는 본문이 아니라 주석적 대안으로 남겨 두는 것이 좋습니다.
- source_word: בַּ/חֶ֣רֶב יִפֹּ֑לוּ
  english_pob_choice: will fall by the sword
  chosen_korean: 칼에 쓰러지고
  alternatives_korean:
  - 칼로 죽고
  - 칼에 의해 쓰러지고
  lexicon: HALOT
  rationale: 히브리어 관용구를 살리되 한국어에서 더 자연스럽고 간결하게 ‘칼에 쓰러지고’로 옮겼습니다. ‘쓰러지다’는 전쟁 심판에서의 죽음을 충분히 전달합니다.
- source_word: בַּ/שְּׁבִ֥י תֵלַֽכְנָה
  english_pob_choice: will go into captivity
  chosen_korean: 포로로 끌려갈 것입니다
  alternatives_korean:
  - 포로로 갈 것입니다
  - 포로가 되어 갈 것입니다
  lexicon: HALOT
  rationale: 직역의 ‘포로로 가다’보다, 감금·이송의 결과를 분명히 드러내는 ‘포로로 끌려가다’가 심판 문맥에 더 적합합니다. 본문의 이동 동사 의미도 유지됩니다.
theological_decisions:
- issue: 여성형 복수 대명사 וְהֵנָּה의 지시 대상
  chosen_reading: ‘이 성읍들’로 명시했습니다.
  alternative_readings:
  - 그들은
  - 그 여자들은
  rationale: 문맥상 지시 대상은 앞서 언급된 두 도시이므로, 한국어에서의 오해를 막기 위해 대상을 명시했습니다.
  doctrine_reference: 문맥 지시대명사 명료화
