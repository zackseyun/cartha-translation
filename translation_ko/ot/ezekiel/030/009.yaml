id: EZK.30.9
reference: Ezekiel 30:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יֵצְא֨וּ מַלְאָכִ֤ים מִ/לְּ/פָנַ/י֙ בַּ/צִּ֔ים לְ/הַחֲרִ֖יד אֶת כּ֣וּשׁ בֶּ֑טַח וְ/הָיְתָ֨ה חַלְחָלָ֤ה בָ/הֶם֙ בְּ/י֣וֹם מִצְרַ֔יִם כִּ֥י הִנֵּ֖ה בָּאָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/009.yaml
  text: On that day messengers will go out from before me in ships to terrify Cush[a], secure as she is, and trembling will come upon them on the day of Egypt, for behold[c][b], it is coming.
  footnotes:
  - marker: a
    text: Or 'envoys'; the Hebrew word can also mean 'angels,' but in this context it most likely refers to human messengers sent with news of Egypt's fall.
    reason: lexical_alternative
  - marker: b
    text: Or 'Ethiopia.' The Hebrew place-name is Cush.
    reason: alternative_reading
  - marker: c
    text: Literally 'on the day of Egypt,' that is, the day when judgment comes upon Egypt.
    reason: cultural_note
translation:
  language: ko
  text: 그날에 내 앞에서 사자들이 배들을 타고 나가서, 안전한 상태에 있는 구스를 떨게 할 것입니다. 그리고 이집트의 날에 그들 가운데 떨림이 임할 것이니, 보십시오, 그것이 오고 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사자들’은 여기서 초자연적 천사보다, 이집트의 몰락 소식을 전하러 파견된 인간 사절을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 지명은 ‘구스’입니다.
    reason: alternative_reading
  - marker: c
    text: ‘이집트의 날’은 곧 이집트에 심판이 임하는 때를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들
  - 메신저들
  - 천사들
  lexicon: HALOT
  rationale: 문맥이 국가적 심판과 소식 전달을 가리키므로, 초월적 존재보다 사람 사절을 뜻하는 넓은 표현이 적절합니다. 한국어에서는 고어적이지만 ‘사자들’이 본문 맥락에 맞는 전령 의미를 가장 간결하게 담습니다.
- source_word: מִלְּפָנַי
  english_pob_choice: from before me
  chosen_korean: 내 앞에서
  alternatives_korean:
  - 내게서
  - 내 임재에서
  - 내 앞에서부터
  lexicon: HALOT
  rationale: ‘before me’의 공간적·임재적 뉘앙스를 살려, 단순한 출처가 아니라 야훼의 면전에서 파견된다는 뜻을 유지했습니다.
- source_word: בַּצִּים
  english_pob_choice: in ships
  chosen_korean: 배들을 타고
  alternatives_korean:
  - 배들로
  - 배 안에서
  - 선박을 타고
  lexicon: HALOT
  rationale: 히브리어는 해상 이동 수단을 가리키며, 한국어에서는 자연스러운 이동 표현인 ‘타고’가 수단성을 잘 드러냅니다.
- source_word: כּוּשׁ
  english_pob_choice: Cush
  chosen_korean: 구스
  alternatives_korean:
  - 에티오피아
  lexicon: HALOT
  rationale: 지명은 음역 원칙에 따라 ‘구스’로 옮겼습니다. 전통적 해석지명인 ‘에티오피아’는 본문이 가진 고유명사성을 약화시킬 수 있습니다.
- source_word: בֶּטַח
  english_pob_choice: secure as she is
  chosen_korean: 안전한 상태에 있는
  alternatives_korean:
  - 평안한
  - 안심하고 있는
  - 안전 속에 있는
  lexicon: HALOT
  rationale: 구스의 자기 인식이 ‘안전/보장됨’이라는 상태를 가리키므로, 형용사적이면서도 상황 설명이 가능한 표현을 택했습니다.
- source_word: חַלְחָלָה
  english_pob_choice: trembling
  chosen_korean: 떨림
  alternatives_korean:
  - 전율
  - 공포
  - 몸부림
  lexicon: HALOT
  rationale: 이 명사는 두려움에서 오는 떨림과 경련적 동요를 뜻하므로, 물리적·정서적 반응을 함께 남기는 ‘떨림’이 무난합니다.
- source_word: בְּיוֹם מִצְרַיִם
  english_pob_choice: on the day of Egypt
  chosen_korean: 이집트의 날에
  alternatives_korean:
  - 이집트의 그 날에
  - 이집트의 심판의 날에
  - 이집트가 당하는 날에
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 따라 직역에 가깝게 두되, 한국어에서 자연스럽게 읽히도록 구성했습니다.
theological_decisions:
- issue: ‘사자들’의 정체를 초자연적 존재가 아니라 인간 사절로 읽을지 여부
  chosen_reading: 본문은 국가적 소식을 전하는 인간 전령을 가리키는 것으로 옮겼습니다.
  alternative_readings:
  - 천사로 옮길 수 있습니다.
  - ‘전령들’처럼 더 중립적으로 둘 수 있습니다.
  rationale: POB의 영어 주해가 이 문맥에서는 인간 사절이 가장 가능성 높다고 보므로, 한국어도 그 판단을 반영하되 본문 자체의 어휘 폭은 과도하게 좁히지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
