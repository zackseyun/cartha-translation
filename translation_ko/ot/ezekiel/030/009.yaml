  source_fidelity: 히브리어의 직접 화자 관점(‘내 앞에서’), 배를 통한 파견, 구스의 안심한 상태, 이집트의 날에 닥칠 떨림, 그리고 임박한 사건을 대체로 충실히 옮겼습니다. 다만 בָהֶם은 이 문맥에서 ‘그들 가운데’보다 ‘그들에게/그들 위에’가 더 직접적이며, לְהַחֲרִיד의 사역적 의미도 ‘두렵게 하다’로 더 분명히 나타낼 수 있습니다.
