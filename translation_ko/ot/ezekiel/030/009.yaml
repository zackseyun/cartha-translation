revisions:
- from: 그날에 내 앞에서 사자들이 배들을 타고 나가서, 안전한 상태에 있는 구스를 떨게 할 것입니다. 그리고 이집트의 날에 그들 가운데 떨림이 임할 것이니, 보십시오, 그것이 오고 있습니다.[a][b][c]
  to: 그날에 내 앞에서 사자들이 배를 타고 나가, 안심하고 있는 구스를 두렵게 할 것입니다.[a] 이집트의 날에 그들에게 떨림이 임할 것이니, 보십시오, 그것이 오고 있습니다.[b][c]
  rationale: 문장의 의미를 바꾸지 않고, 사역 동사의 힘을 ‘두렵게 하다’로 분명히 했으며, 떨림이 ‘그들에게’ 임한다는 히브리어 전치사구를 자연스럽게 반영했습니다. 또한 현대 합쇼체에 맞도록 표현을 다듬고, 구스 및 사자들의 어휘적 대안을 각주에 보완했습니다. 마지막 ‘그것’은 여성 단수 동사가 가리키는 임박한 ‘날’ 또는 재앙을 특정하지 않아 원문의 여지를 보존합니다.
