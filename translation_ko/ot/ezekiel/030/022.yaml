base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/022.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against Pharaoh king of Egypt, and I will break his arms, both the strong one and the broken one, and I will make the sword fall from his hand.'
  footnotes:
  - marker: a
    text: Or, 'the strong arm and the broken arm.' The Hebrew adjectives are feminine singular, referring back to 'arm.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이처럼 말씀하십니다. 「보십시오, 내가 이집트 왕 바로에게 맞서 있습니다. 나는 그의 팔들, 곧 강한 팔과 부러진 팔을 꺾고, 그의 손에서 칼이 떨어지게 하겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강한 팔과 부러진 팔’입니다. 히브리어의 형용사는 여성 단수로, 앞의 ‘팔’을 가리킵니다.
    reason: lexical_alternative
