  text: 그러므로 주 야훼께서 이처럼 말씀하십니다. 「보십시오, 내가 바로, 이집트 왕을 대적한다. 내가 그의 두 팔, 곧 강한 팔과 부러진 팔을 꺾고, 그의 손에서 칼이 떨어지게 하겠다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘강한 것과 부러진 것’이라고 하며, 여성 단수 형태로 앞의 ‘팔’을 가리킵니다.
