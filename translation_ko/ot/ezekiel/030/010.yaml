    text: 히브리어 ‘~의 손으로’는 관용적으로 ‘~을 통하여’ 또는 ‘~의 수단으로’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘느부갓레살’로도 옮길 수 있으며, 이 표기는 히브리어 철자에 더 가깝습니다.
