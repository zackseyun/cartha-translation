  language: en
  yaml_path: translation/ot/ezekiel/030/010.yaml
  text: 'Thus says the Lord GOD: I will put an end to the multitude of Egypt by the hand of Nebuchadnezzar king of Babylon[a][b].'
  footnotes:
  - marker: a
    text: Hebrew 'by the hand of,' an idiom meaning 'through' or 'by means of.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Nebuchadrezzar,' reflecting a form closer to the Hebrew spelling.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 하나님께서 이렇게 말씀하십니다. "내가 바벨론 왕 느부갓네살의 손으로 이집트의 무리를 끝장내겠습니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘~의 손으로’는 관용적으로 ‘~을 통하여, ~의 매개로’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 느부갓네살은 히브리어 철자에 더 가까운 ‘느부갓레살’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 말씀하십니다
  - 이같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언적 선포 공식의 엄숙함을 살리면서도 현대 한국어에서는 ‘이렇게 말씀하십니다’가 자연스럽고 직접적입니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와
  lexicon: HALOT
  rationale: 합쇼체의 예언자적 서두에서 ‘주 하나님’이 한국어로 가장 자연스럽고, 본문 기능상 ‘주’와 신적 이름의 결합을 압축해 드러냅니다.
- source_word: וְהִשְׁבַּתִּי אֶת
  english_pob_choice: I will put an end to
  chosen_korean: 내가 ... 끝장내겠습니다
  alternatives_korean:
  - 내가 ... 끝내겠습니다
  - 내가 ... 멈추게 하겠습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미(‘그치게 하다, 중단시키다’)를 한국어에서 심판 선포의 강한 뉘앙스로 옮기기 위해 ‘끝장내겠습니다’를 택했습니다.
- source_word: בְּיַד
  english_pob_choice: by the hand of
  chosen_korean: 의 손으로
  alternatives_korean:
  - 통하여
  - 을/를 통해
  lexicon: HALOT
  rationale: 히브리어 관용구의 대리·도구성을 보존하기 위해 직역형 ‘의 손으로’를 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기와 예언문 서두의 신적 호칭
  chosen_reading: 본문에서는 ‘주 하나님’으로 옮기되, 별도의 야훼 표기는 두지 않았습니다.
  alternative_readings:
  - 야훼
  - 주 야훼
  - 여호와
  rationale: 이 절의 영어 POB는 관습적으로 ‘the Lord GOD’를 사용하며, 한국어 본문은 예언 공식의 유창성과 즉시성을 우선해 ‘주 하나님’으로 처리했습니다. 본절은 직접적인 야훼 표기보다 선언 기능이 더 두드러집니다.
  doctrine_reference: POB terminology default for יְהוָה / YHWH
