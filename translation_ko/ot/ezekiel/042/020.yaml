id: EZK.42.20
reference: Ezekiel 42:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/אַרְבַּ֨ע רוּח֜וֹת מְדָד֗/וֹ ח֤וֹמָה ל/וֹ֙ סָבִ֣יב סָבִ֔יב אֹ֚רֶךְ חֲמֵ֣שׁ מֵא֔וֹת וְ/רֹ֖חַב חֲמֵ֣שׁ מֵא֑וֹת לְ/הַבְדִּ֕יל בֵּ֥ין הַ/קֹּ֖דֶשׁ לְ/חֹֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/020.yaml
  text: He measured it on the four sides[a]; it had a wall all around, five hundred cubits long and five hundred cubits wide[b], to make a separation between the holy and the common.
  footnotes:
  - marker: a
    text: Or 'toward the four directions' or 'on the four winds.'
    reason: lexical_alternative
  - marker: b
    text: Or 'between the holy and the profane.' The Hebrew contrasts what is holy with what is common, that is, not set apart as holy.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그것을 사방에서 측량했습니다[a]. 그 주위에는 사방을 두른 벽이 있었는데, 길이는 오백이고 너비는 오백이었습니다. 이는 거룩한 것과 속된 것[b] 사이를 구별하기 위한 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 방향으로’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘일반적인 것’. 히브리어는 거룩하게 구별되지 않은 것을 가리키며, 반드시 도덕적으로 악한 것을 뜻하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבַּ֨ע רוּחוֹת
  english_pob_choice: on the four sides
  chosen_korean: 네 방향
  alternatives_korean:
  - 네 면
  - 네 쪽
  - 네 방위
  lexicon: HALOT
  rationale: רוּחוֹת는 문자적으로 ‘바람들’이지만 여기서는 측량 맥락의 관용구로 ‘방향/면’을 뜻하므로, 한국어로는 자연스럽게 ‘네 방향’이 가장 직접적입니다.
- source_word: מְדָד֗/וֹ
  english_pob_choice: He measured it
  chosen_korean: 그는 그것을 측정했습니다
  alternatives_korean:
  - 그것의 길이를 쟀습니다
  - 그를 측정했습니다
  lexicon: HALOT
  rationale: 동사의 주어는 생략된 측량자이고 목적어는 앞서 언급된 대상이므로, 한국어에서는 ‘그것을 측정했습니다’가 원문 관계를 가장 분명하게 드러냅니다.
- source_word: חוֹמָה ל/וֹ֙ סָבִ֣יב סָבִ֔יב
  english_pob_choice: it had a wall all around
  chosen_korean: 둘레에는 성벽이 있었고
  alternatives_korean:
  - 사방에 성벽이 있었고
  - 주위에 벽이 둘러 있었고
  lexicon: HALOT
  rationale: 반복된 סָבִיב은 둘러싸는 상태를 강조하므로 ‘둘레에는’으로 압축해 살리되, 건축·성역 문맥에 맞게 ‘성벽’으로 옮겼습니다.
- source_word: לְ/הַבְדִּיל בֵּין הַ/קֹּ֖דֶשׁ לְ/חֹֽל
  english_pob_choice: to make a separation between the holy and the common
  chosen_korean: 거룩한 것과 일반적인 것 사이를 구별하려는 것이었습니다
  alternatives_korean:
  - 거룩한 것과 속된 것 사이를 구분하려는 것이었습니다
  - 거룩한 것과 평범한 것 사이를 나누려는 것이었습니다
  lexicon: HALOT
  rationale: חֹל은 도덕적으로 ‘악한’ 뜻이 아니라 ‘거룩하지 않은 일반 상태’를 가리키므로, 문맥상 ‘일반적인 것’이 가장 덜 왜곡되며 ‘구별하다’는 לְהַבְדִּיל의 목적 의미를 잘 반영합니다.
theological_decisions:
- issue: קֹדֶשׁ מול חֹל의 성소적 대비
  chosen_reading: ‘거룩한 것과 일반적인 것’으로 옮겨, 성결/속됨의 구분을 드러냈습니다.
  alternative_readings:
  - 거룩한 것과 속된 것
  - 거룩한 것과 평범한 것
  rationale: 본문은 도덕적 정죄보다 성역의 경계와 예식적 분리를 말하므로, ‘일반적인 것’이 ‘profane/속된’보다 원문의 범위를 더 정확히 보존합니다.
  doctrine_reference: 성소 언어의 구별을 보존하고, 본문이 말하지 않는 도덕적 함의를 과도하게 부여하지 않음.
