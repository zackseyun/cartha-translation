  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/בֹאָ֣/ם הַ/כֹּהֲנִ֗ים וְ/לֹֽא יֵצְא֤וּ מֵ/הַ/קֹּ֨דֶשׁ֙ אֶל הֶ/חָצֵ֣ר הַ/חִיצוֹנָ֔ה וְ/שָׁ֞ם יַנִּ֧יחוּ בִגְדֵי/הֶ֛ם אֲשֶׁר יְשָׁרְת֥וּ בָ/הֶ֖ן כִּֽי קֹ֣דֶשׁ הֵ֑נָּה ילבשו בְּגָדִ֣ים אֲחֵרִ֔ים וְ/קָרְב֖וּ אֶל אֲשֶׁ֥ר לָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/014.yaml
  text: When the priests enter[a], they shall not go out from the holy place into the outer court, but there they shall leave their garments in which they minister, for they are holy. They shall put on other garments, and then approach what belongs to the people.
  footnotes:
  - marker: a
    text: Or 'that which is for the people'; the Hebrew expression is elliptical and may refer to the area accessible to the people.
    reason: alternative_reading
translation:
  language: ko
  text: 제사장들이 들어올 때에는 거룩한 곳에서 바깥뜰로 나가지 말고, 거기에서 그들이 섬기던 옷을 벗어 두어야 합니다. 그 옷은 거룩하기 때문입니다. 그들은 다른 옷을 입고서야 백성에게 속한 곳으로 나아가야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성에게 속한 것’; 히브리어 표현은 생략적이며, 백성이 접근할 수 있는 구역을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּבֹאָם / When the priests enter
  english_pob_choice: When the priests enter
  chosen_korean: 제사장들이 들어올 때에는
  alternatives_korean:
  - 제사장들이 들어오면
  - 제사장들이 입장할 때에는
  lexicon: HALOT
  rationale: 시작의 זמן절을 자연스러운 한국어 조건·시간 표현으로 옮기되, 규정문의 성격을 살리기 위해 ‘때에는’을 썼습니다.
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 사제들
  - 성직자들
  lexicon: HALOT
  rationale: קדש 문맥의 제의적 직분을 가장 직접적으로 드러내는 표준 번역어입니다.
- source_word: מֵהַקֹּדֶשׁ / אֶל הֶחָצֵר הַחִיצוֹנָה
  english_pob_choice: from the holy place ... into the outer court
  chosen_korean: 거룩한 곳에서 바깥뜰로
  alternatives_korean:
  - 성소에서 바깥뜰로
  - 성한 곳에서 외뜰로
  lexicon: HALOT
  rationale: 대조되는 공간 이동을 유지하면서, קֹדֶשׁ을 ‘거룩한 곳’으로 옮겨 예배 공간의 성격을 분명히 했습니다.
- source_word: וְשָׁם יַנִּיחוּ בִגְדֵיהֶם ... כִּי קֹדֶשׁ הֵנָּה
  english_pob_choice: but there they shall leave their garments ... for they are holy
  chosen_korean: 거기에서 그들이 섬기던 옷을 벗어 두어야 합니다. 그 옷은 거룩하기 때문입니다.
  alternatives_korean:
  - 거기에서 그들의 옷을 두어야 합니다. 그 옷은 거룩하기 때문입니다.
  - 거기에서 그들이 사역하던 옷을 놓아 두어야 합니다. 그 옷은 거룩하기 때문입니다.
  lexicon: HALOT
  rationale: יַנִּיחוּ는 단순히 ‘놓다/두다’이지만, 옷을 갈아입는 문맥이므로 ‘벗어 두다’로 풀어 의미를 분명히 했습니다. 복수 여성 대명사가 옷을 가리키므로 ‘그 옷’으로 정리했습니다.
- source_word: יִלְבְּשׁוּ בְּגָדִים אֲחֵרִים / וְקָרְבוּ אֶל אֲשֶׁר לָעָם
  english_pob_choice: They shall put on other garments, and then approach what belongs to the people.
  chosen_korean: 그들은 다른 옷을 입고서야 백성에게 속한 곳으로 나아가야 합니다.
  alternatives_korean:
  - 그들은 다른 옷을 입고서야 백성에게 속한 것을 향해 나아가야 합니다.
  - 그들은 다른 옷을 입고서야 백성의 몫으로 나아가야 합니다.
  lexicon: HALOT
  rationale: אֲשֶׁר לָעָם은 생략된 목적어가 있는 엘립시스이므로, POB의 취지를 따라 ‘백성에게 속한 곳’으로 처리해 본문이 가리키는 접근 대상을 한국어로 드러냈습니다.
theological_decisions:
- issue: 거룩한 옷과 일반 영역의 분리
  chosen_reading: 제사장은 거룩한 옷을 성소 내부와 바깥뜰 사이의 경계에서 분리해 두고, 일반 영역으로 나아갈 때는 다른 옷을 입어야 합니다.
  alternative_readings:
  - 단순한 의복 교체 규정으로만 읽을 수 있습니다.
  - 특정한 방이나 보관소 지침으로 더 좁게 이해할 수 있습니다.
  rationale: 본문은 제의적 거룩함이 공간 이동과 복장에 실제 규범을 부여한다는 점을 강조합니다. 그래서 ‘거룩한 곳’과 ‘백성에게 속한 곳’의 대비를 유지했습니다.
  doctrine_reference: 성소의 거룩성과 제의적 구별
- issue: ‘백성에게 속한 곳’의 엘립시스
  chosen_reading: 히브리어의 생략 구조를 그대로 살리되, 한국어에서는 ‘곳’을 보충해 문맥상 접근 가능한 영역을 뜻하게 했습니다.
  alternative_readings:
  - ‘백성에게 속한 것’처럼 추상적으로 옮길 수 있습니다.
  - ‘백성을 위한 것’으로 넓게 풀 수 있습니다.
  rationale: POB의 주석처럼 표현이 생략적이어서, 지나친 해석을 피하면서도 한국어 독자가 실제 의미를 이해하도록 최소한의 보충만 했습니다.
  doctrine_reference: 본문의 엘립시스와 문맥적 복원
