base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/001.yaml
  text: Then he brought me out into the outer court by the way toward the north[b][a], and he brought me to the chamber that was opposite the separate area and opposite the building to the north.
  footnotes:
  - marker: a
    text: Hebrew 'the way, way of the north,' an idiomatic directional expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'the separate place.' The Hebrew term refers to a distinct set-apart area in Ezekiel's temple vision.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그가 나를 북쪽으로 가는 길을 따라 바깥뜰로 데리고 나가서, 따로 구분된 공간 맞은편과 북쪽에 있는 건물 맞은편에 있는 방으로 데려갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹצִאֵנִי
  english_pob_choice: Then he brought me out
  chosen_korean: 그가 나를 … 데리고 나가
  alternatives_korean:
  - 그가 나를 밖으로 이끌고
  - 그가 나를 데리고 나왔습니다
  lexicon: HALOT
  rationale: 히필형 יצא의 사역적 의미를 살리면서, 문맥상 이동 동작을 자연스럽게 표현했습니다.
- source_word: הֶחָצֵר הַחִיצוֹנָה
  english_pob_choice: the outer court
  chosen_korean: 바깥뜰
  alternatives_korean:
  - 바깥 마당
  - 외부 뜰
  lexicon: HALOT
  rationale: 성전 환상 문맥의 חָצֵר는 ‘뜰’이 가장 자연스럽고, הַחִיצוֹנָה는 ‘바깥’으로 간명하게 드러냈습니다.
- source_word: הַדֶּרֶךְ דֶּרֶךְ הַצָּפוֹן
  english_pob_choice: by the way toward the north
  chosen_korean: 북쪽 길로
  alternatives_korean:
  - 북쪽으로 가는 길로
  - 북쪽 쪽 길로
  lexicon: HALOT
  rationale: 반복된 דֶּרֶךְ는 한국어에서 ‘길’로 자연스럽게 풀고, 방향 표현은 ‘북쪽’으로 압축해 관용성을 살렸습니다.
- source_word: הַגִּזְרָה
  english_pob_choice: the separate area
  chosen_korean: 따로 구분된 공간
  alternatives_korean:
  - 분리된 구역
  - 따로 떼어 놓은 곳
  lexicon: HALOT
  rationale: Ezekiel의 성전 환상에서 גִּזְרָה는 단순한 ‘장소’보다 구별·분리를 강조하므로, 그 성격을 드러내는 표현을 택했습니다.
