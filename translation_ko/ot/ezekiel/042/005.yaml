  text: וְ/הַ/לְּשָׁכ֥וֹת הָ/עֶלְיוֹנֹ֖ת קְצֻר֑וֹת כִּֽי יוֹכְל֨וּ אַתִּיקִ֜ים מֵ/הֵ֗נָה מֵֽ/הַ/תַּחְתֹּנ֛וֹת וּ/מֵ/הַ/תִּֽכֹנ֖וֹת בִּנְיָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/005.yaml
  text: And the upper chambers were narrower[a], because the galleries took away from them, more than from the lower and the middle parts of the building.
  footnotes:
  - marker: a
    text: Or 'the terraces,' 'colonnades,' or 'ledges' took away from them.' The Hebrew term translated 'galleries' (אַטִּיקִים) is rare and its precise architectural referent is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 위층 방들은 아래층과 중간층보다 더 많이 그 갤러리들 때문에 좁았습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘테라스들,’ ‘콜로네이드들,’ 혹은 ‘턱들’이 그 공간을 빼앗았다는 뜻일 수 있습니다. ‘갤러리들’로 옮긴 히브리어 אַתִּיקִים는 희귀한 건축 용어이므로 정확한 지시 대상은 분명하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְּשָׁכוֹת הָעֶלְיוֹנֹת
  english_pob_choice: the upper chambers
  chosen_korean: 위층 방들
  alternatives_korean:
  - 위쪽 방들
  - 상층 방들
  - 윗방들
  lexicon: HALOT
  rationale: 성전 건축 맥락의 לשכה는 단순한 ‘방’보다 기능적 공간을 가리키지만, 한국어에서는 ‘위층 방들’이 층위 대비를 가장 자연스럽게 살리며 본문의 공간적 대비도 분명하게 드러냅니다.
- source_word: קְצֻרֹות
  english_pob_choice: were narrower
  chosen_korean: 좁았습니다
  alternatives_korean:
  - 더 짧았습니다
  - 줄어 있었습니다
  - 더 좁았습니다
  lexicon: HALOT
  rationale: 문맥상 높이보다 폭이나 점유 면적의 축소를 말하므로 ‘좁다’가 가장 직접적으로 의미를 전달합니다.
- source_word: יוֹכְלוּ אַתִּיקִים
  english_pob_choice: the galleries took away from them
  chosen_korean: 그 갤러리들 때문에
  alternatives_korean:
  - 그 돌출된 회랑들 때문에
  - 그 테라스들 때문에
  - 그 콜로네이드들 때문에
  lexicon: HALOT
  rationale: אַטִּיקִים는 희귀한 건축 용어라 정확한 한국어 대응이 어렵기 때문에, POB의 ‘galleries’를 따라 음역식이 아니라 기능적 표현을 유지하되, 본문에는 ‘그 갤러리들’로 두어 용어의 불확실성을 과도하게 좁히지 않았습니다.
- source_word: מֵהֵנָה מֵהַתַּחְתֹּנוֹת וּמֵהַתִּיכֹנוֹת
  english_pob_choice: more than from the lower and the middle parts
  chosen_korean: 아래층과 중간층보다 더 많이
  alternatives_korean:
  - 아래층과 중간층보다
  - 아래층과 중간층에 비해
  - 아래층과 중간층에서보다
  lexicon: HALOT
  rationale: 히브리어의 비교 구문을 한국어에서 자연스럽게 풀어, 상층 방들이 아래층·중간층보다 더 많이 공간을 빼앗겼다는 뜻을 분명히 했습니다.
