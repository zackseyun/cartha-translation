  text: Facing the length of one hundred cubits was the north entrance[a], and the width was fifty cubits.
  footnotes:
  - marker: a
    text: Or 'In front of the length of one hundred cubits was the north entrance.' The Hebrew spatial expression is compact and may be rendered in several closely related ways.
    reason: lexical_alternative
translation:
  language: ko
  text: 백 척 길이 쪽을 향한 북쪽 입구가 있었고,[a] 너비는 오십 척이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘백 척 길이의 앞에’입니다. 히브리어의 압축된 공간 표현은 ‘백 척 길이 쪽에 북쪽 입구가 있었다’처럼도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶל פְּנֵי
  english_pob_choice: Facing
  chosen_korean: 맞은편에
  alternatives_korean:
  - 마주하여
  - 향하여
  - 앞쪽에
  lexicon: HALOT
  rationale: 공간적 방향을 나타내는 압축된 표현이므로, 건축 문맥에서 자연스럽고 원문 관계를 살리는 '맞은편에'로 옮겼습니다.
- source_word: אֹרֶךְ
  english_pob_choice: length
  chosen_korean: 길이
  alternatives_korean:
  - 긴 변
  - 세로 길이
  - 장변
  lexicon: HALOT
  rationale: 측량 문맥에서 אֹרֶךְ는 종축의 치수를 뜻하므로, 가장 직관적인 '길이'를 사용했습니다.
- source_word: פֶּתַח הַצָּפוֹן
  english_pob_choice: the north entrance
  chosen_korean: 북쪽 입구
  alternatives_korean:
  - 북문
  - 북쪽 문
  - 북편 입구
  lexicon: HALOT
  rationale: פֶּתַח는 '문'보다 넓은 '입구/개구부'의 뜻이 있어, 성전 묘사에 맞는 '입구'를 택했습니다.
- source_word: וְהָרֹחַב
  english_pob_choice: and the width was
  chosen_korean: 너비는
  alternatives_korean:
  - 가로는
  - 폭은
  - 너비가
  lexicon: HALOT
  rationale: רֹחַב은 횡방향 치수이므로 현대 한국어에서 가장 분명한 '너비'로 옮겼고, 서술을 매끄럽게 하기 위해 주제를 앞세웠습니다.
