source:
  edition: WLC
  text: בְּ/רֹ֣חַב גֶּ֣דֶר הֶ/חָצֵ֗ר דֶּ֧רֶךְ הַ/קָּדִ֛ים אֶל פְּנֵ֧י הַ/גִּזְרָ֛ה וְ/אֶל פְּנֵ֥י הַ/בִּנְיָ֖ן לְשָׁכֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/010.yaml
  text: Along the width of the court wall toward the east[a], facing the separate area and facing the building[b], were chambers.
  footnotes:
  - marker: a
    text: Or 'in the width of the court enclosure' or 'along the breadth of the court wall.' The Hebrew is spatially compressed and architectural.
    reason: lexical_alternative
  - marker: b
    text: '''The separate area'' renders a technical term in Ezekiel''s temple vision for a distinct section set apart from surrounding structures.'
    reason: cultural_note
translation:
  language: ko
  text: 성전 뜰 벽의 너비를 따라 동쪽을 향하여, 별도의 구역과 건물을 마주하는 곳에 방들이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘별도의 구역’은 에스겔의 성전 환상에서 주변 구조물과 구별된 기술용어를 반영합니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּרֹחַב
  english_pob_choice: along the width of
  chosen_korean: 너비를 따라
  alternatives_korean:
  - 너비에
  - 폭 안에
  - 폭을 따라
  lexicon: HALOT
  rationale: בְּ + רֹחַב은 단순한 정적 위치보다 폭을 따라 이어지는 공간 배치를 나타내므로, 한국어에서는 자연스럽게 '너비를 따라'로 옮겨 공간적 방향성을 살렸습니다.
- source_word: גֶּדֶר הֶחָצֵר
  english_pob_choice: the court wall
  chosen_korean: 성전 뜰 벽
  alternatives_korean:
  - 뜰의 벽
  - 뜰 울타리
  - 뜰 경계벽
  lexicon: HALOT
  rationale: גֶּדֶר는 울타리보다 벽/경계 구조에 가깝고, 문맥이 성전 환상이므로 '성전 뜰 벽'이 가장 분명합니다.
- source_word: הַגִּזְרָה
  english_pob_choice: the separate area
  chosen_korean: 별도의 구역
  alternatives_korean:
  - 분리된 구역
  - 구별된 곳
  - 분리된 장소
  lexicon: HALOT
  rationale: 이 용어는 에스겔 성전 환상의 기술용어로, 주변 구조물과 구별된 분리 구역을 가리키므로 '별도의 구역'이 의미를 가장 직접적으로 전달합니다.
- source_word: לְשָׁכוֹת
  english_pob_choice: were chambers
  chosen_korean: 방들이 있었습니다
  alternatives_korean:
  - 방들이 있었습니다
  - 작은 방들이 있었습니다
  - 측실들이 있었습니다
  lexicon: HALOT
  rationale: לְשָׁכוֹת는 성전 맥락에서 '방/측실'을 뜻하지만, 한국어 독자가 이해하기 쉽게 하면서도 지나치게 전문화하지 않도록 '방들'로 옮겼습니다.
theological_decisions:
- issue: 에스겔 성전 환상의 기술용어를 얼마나 전문적으로 유지할지
  chosen_reading: '''별도의 구역''으로 유지하되 설명적 과잉은 피했습니다.'
  alternative_readings:
  - '''분리된 장소''로 완화'
  - '''구별된 구역''으로 보다 직역'
  rationale: 본문의 핵심은 건축 묘사이며, 독자가 환상 안의 구획 구분을 바로 파악하도록 하되 한국어에서 어색한 전문어 남발은 피하는 것이 적절합니다.
  doctrine_reference: 에스겔 40–48의 성전 환상 전체 맥락
