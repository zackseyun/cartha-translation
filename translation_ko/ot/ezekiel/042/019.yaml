id: EZK.42.19
reference: Ezekiel 42:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: סָבַ֖ב אֶל ר֣וּחַ הַ/יָּ֑ם מָדַ֛ד חֲמֵשׁ מֵא֥וֹת קָנִ֖ים בִּ/קְנֵ֥ה הַ/מִּדָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/019.yaml
  text: He turned to the west side and measured five hundred reeds with the measuring reed[a][b].
  footnotes:
  - marker: a
    text: Literally, 'to the direction of the sea,' a Hebrew way of indicating the west.
    reason: cultural_note
  - marker: b
    text: Some interpreters and versions read 'cubits' instead of 'reeds' in this measurement context, but the Hebrew here reads 'reeds.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 서쪽 곧 바다 쪽으로 돌아서 측량대에 따라 다섯백 갈대를 쟀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘바다의 방향으로’이지만, 히브리어 관용법에서 ‘바다’는 서쪽을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 어떤 해석자들과 번역본들은 이 측량 문맥에서 ‘갈대’ 대신 ‘규빗’을 읽지만, 히브리어 본문은 여기서 ‘갈대’를 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: סָבַב אֶל רוּחַ הַיָּם
  english_pob_choice: He turned to the west side
  chosen_korean: 서쪽 곧 바다 쪽으로 돌아서
  alternatives_korean:
  - 서쪽으로 돌아서
  - 바다 쪽으로 돌아서
  - 바다의 방향으로 돌아서
  lexicon: HALOT
  rationale: 히브리어의 문자적 의미는 ‘바다의 방향’이지만, 예언적·건축적 맥락에서 이는 서쪽을 가리키므로 방향 의미를 드러내어 옮겼습니다.
- source_word: מָדַד
  english_pob_choice: measured
  chosen_korean: 측량대에 따라 ... 쟀습니다
  alternatives_korean:
  - 측량했습니다
  - 쟀습니다
  lexicon: HALOT
  rationale: 문맥상 성전 구조의 치수를 재는 동사이므로 ‘쟀습니다’로 자연스럽게 옮기되, 뒤의 도구 표현과 함께 측량 행위임을 드러냈습니다.
- source_word: חֲמֵשׁ מֵאוֹת קָנִים
  english_pob_choice: five hundred reeds
  chosen_korean: 다섯백 갈대
  alternatives_korean:
  - 오백 갈대
  - 다섯백 장대
  lexicon: HALOT
  rationale: 히브리어 본문이 ‘갈대들/갈대 단위’(reeds)를 읽으므로 POB의 선택을 따라 ‘갈대’로 유지했습니다. 한국어에서는 수사와 결합할 때 ‘다섯백’이 본문 리듬을 가장 덜 흐립니다.
- source_word: בִּקְנֵה הַמִּדָּה
  english_pob_choice: with the measuring reed
  chosen_korean: 측량대에 따라
  alternatives_korean:
  - 측량 갈대로
  - 측량용 갈대로
  - 재는 갈대로
  lexicon: HALOT
  rationale: 도구·수단을 나타내는 בְּ를 살리되, 현대 한국어에서 다소 낯선 ‘갈대’의 반복을 줄이기 위해 ‘측량대’로 풀어 옮겼습니다. 본문이 재는 기준 막대임을 분명히 합니다.
theological_decisions:
- issue: ‘바다’가 곧 ‘서쪽’을 뜻하는 히브리식 지시법 처리
  chosen_reading: ‘서쪽 곧 바다 쪽으로’로 번역해 지리적 관용 표현을 본문 안에서 풀었습니다.
  alternative_readings:
  - ‘바다의 방향으로’
  - 주석으로만 서쪽 뜻을 처리
  rationale: 예언서의 측량 문맥에서 독자가 방향을 즉시 이해해야 하므로, 문자적 표현과 의미를 함께 제시하는 방식이 가장 투명합니다.
  doctrine_reference: 해석학적 투명성
- issue: ‘갈대’와 ‘측량대’의 병용
  chosen_reading: 본문에는 측량 도구의 기능을 살려 ‘측량대’로 풀고, 수량 단위는 ‘갈대’로 유지했습니다.
  alternative_readings:
  - ‘오백 갈대를 측량 갈대로’
  - ‘오백 장대를 측량대로’
  rationale: 동일 어휘를 직역하면 한국어가 부자연스러워지므로, 본문의 단위와 도구 기능을 각각 살려 오해를 줄였습니다.
  doctrine_reference: 본문 충실성과 가독성의 균형
