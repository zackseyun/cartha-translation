  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֛ת ר֥וּחַ הַ/דָּר֖וֹם מָדָ֑ד חֲמֵשׁ מֵא֥וֹת קָנִ֖ים בִּ/קְנֵ֥ה הַ/מִּדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/018.yaml
  text: 'He measured the south side: five hundred reeds by the measuring reed[a].'
  footnotes:
  - marker: a
    text: Some manuscripts and ancient versions read 'cubits' instead of 'reeds' in this measurement context; the Masoretic Text reads 'reeds.'
    reason: textual_variant
translation:
  language: ko
  text: 그는 남쪽 면을 쟀습니다. 오백 갈대였고, 그 측량 갈대로 쟀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본과 고대역본은 이 치수 문맥에서 ‘갈대’ 대신 ‘규빗’으로 읽습니다. 그러나 마소라 본문은 ‘갈대’라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ר֥וּחַ הַ/דָּר֖וֹם
  english_pob_choice: the south side
  chosen_korean: 남쪽 면
  alternatives_korean:
  - 남쪽 바람
  - 남쪽 방향
  - 남쪽 구역
  lexicon: HALOT
  rationale: 측량 문맥의 רוּחַ는 바람이 아니라 방향/면을 가리키므로, 건축 치수에 자연스러운 ‘남쪽 면’으로 옮겼습니다.
- source_word: מָדָ֑ד
  english_pob_choice: He measured
  chosen_korean: 쟀습니다
  alternatives_korean:
  - 측량했습니다
  - 재었습니다
  lexicon: HALOT
  rationale: מדד의 핵심 의미는 ‘재다/측량하다’이므로, 본문의 반복되는 치수 측정 행위를 현대 한국어로 간결하게 나타냈습니다.
- source_word: קָנִ֖ים
  english_pob_choice: reeds
  chosen_korean: 갈대
  alternatives_korean:
  - 큐빗
  - 지팡이
  lexicon: HALOT
  rationale: 히브리어 본문이 분명히 ‘갈대들(reeds)’이라고 말하므로, 전통적 교회 용례보다 원문 표지를 우선해 ‘갈대’로 옮겼습니다.
- source_word: בִּ/קְנֵ֥ה הַ/מִּדָּֽה
  english_pob_choice: by the measuring reed
  chosen_korean: 측량 갈대로
  alternatives_korean:
  - 측량하는 갈대로
  - 측량용 갈대로
  - 그 측량 갈대로
  lexicon: HALOT
  rationale: בְּ는 도구/수단의 뜻으로 기능하므로 ‘~으로’ 구조를 취했고, 정관사와 명사구는 측량 도구임을 분명히 하는 ‘측량 갈대’로 압축했습니다.
theological_decisions:
- issue: 본문의 반복 측량 표현을 어떻게 한국어로 자연스럽게 유지할지
  chosen_reading: 치수 측량의 반복성을 드러내되, 단순한 묘사로 과장하지 않고 사실적으로 옮겼습니다.
  alternative_readings:
  - ‘남쪽 방향을 쟀습니다’처럼 더 직역하기
  - ‘남쪽 편을 측량하셨습니다’처럼 더 격식 있게 바꾸기
  rationale: 이 절은 계시적 환상 속 성막/성전의 구조 측량을 서술하는 문맥이므로, 신학적 해석을 덧붙이기보다 측량 행위 자체가 보이도록 하는 것이 적절합니다.
  doctrine_reference: Ezekiel 40–42의 성전 환상 문맥
