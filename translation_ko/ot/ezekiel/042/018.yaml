  source_fidelity: 히브리어 본문은 남쪽 면을 측량하여 그 길이가 측량 갈대 500임을 말합니다. 초안의 ‘오백 갈대였고’는 목적격/치수 서술의 연결이 부자연스러워, 측량 결과가 500갈대임을 더 명료하게 표현하는 편이 좋습니다. ‘남쪽 면’, ‘갈대’, 그리고 측량 도구로서의 ‘측량 갈대’ 이해는 원문에 충실합니다.
  naturalness: ‘그는 남쪽 면을 쟀습니다. 오백 갈대였고, 그 측량 갈대로 쟀습니다’는 같은 동작이 어색하게 반복되고 ‘오백 갈대였고’가 미완의 연결처럼 들립니다. 도구와 측량 결과를 한 문장 안에 자연스럽게 배열해야 합니다.
  terminology: ‘갈대’는 קָנִים의 마소라 본문 독법을 보존하며, ‘측량용 갈대’는 בִּקְנֵה הַמִּדָּה의 도구적 의미를 자연스러운 현대 한국어로 전달합니다. ‘규빗’ 이문 관련 각주는 유지하되, ‘고대 역본’으로 띄어 쓰는 것이 표준적입니다.
