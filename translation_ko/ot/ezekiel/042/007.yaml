  text: וְ/גָדֵ֤ר אֲשֶׁר לַ/חוּץ֙ לְ/עֻמַּ֣ת הַ/לְּשָׁכ֔וֹת דֶּ֛רֶךְ הֶ/חָצֵ֥ר הַ/חִֽצוֹנָ֖ה אֶל פְּנֵ֣י הַ/לְּשָׁכ֑וֹת אָרְכּ֖/וֹ חֲמִשִּׁ֥ים אַמָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/007.yaml
  text: And the wall that was outside[a], alongside the chambers, toward the outer court, in front of the chambers—its length was fifty cubits.
  footnotes:
  - marker: a
    text: Or 'opposite the chambers.' The Hebrew preposition can denote correspondence or facing position; 'parallel to' is chosen here because the verse describes architectural alignment and measurement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 바깥에 있는 담은, 방들과 나란히 있으며, 바깥뜰을 향해 있고, 방들 앞에 있었습니다 — 그 길이는 오십 규빗이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘방들과 맞은편에’. 히브리어 전치사는 대응이나 마주봄을 뜻할 수 있으므로, 여기서는 건축적 정렬을 살려 ‘나란히’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָדֵר
  english_pob_choice: wall
  chosen_korean: 담
  alternatives_korean:
  - 벽
  - 울타리
  lexicon: HALOT
  rationale: 성전 건축 문맥의 둘레 구조를 가리키므로, 일상적이면서도 구조물을 뜻하는 ‘담’이 ‘wall’의 기능을 가장 자연스럽게 살립니다.
- source_word: לַחוּץ
  english_pob_choice: outside
  chosen_korean: 바깥에 있는
  alternatives_korean:
  - 밖에 있는
  - 외부에 있는
  lexicon: HALOT
  rationale: 장소 관계를 분명히 하면서도 현대 한국어에서 어색하지 않게 ‘outside’의 외곽 위치를 풀어 옮겼습니다.
- source_word: לְעֻמַּת
  english_pob_choice: parallel to
  chosen_korean: 나란히
  alternatives_korean:
  - 맞은편에
  - 대응하여
  - 평행하게
  lexicon: HALOT
  rationale: 이 전치사는 단순한 ‘맞은편’보다 구조적 정렬과 배치를 나타내므로, 건축 묘사에 맞는 ‘나란히’로 옮겼습니다.
- source_word: לְּשָׁכוֹת
  english_pob_choice: chambers
  chosen_korean: 방들
  alternatives_korean:
  - 골방들
  - 방실들
  - 실들
  lexicon: HALOT
  rationale: 성전 환상에서의 לשכות는 기능적으로 구획된 공간이므로, 한국어로는 ‘방들’이 가장 직접적이면서도 과도하게 해석적이지 않습니다.
theological_decisions:
- issue: 건축 묘사에서 거리·방향 표현의 처리
  chosen_reading: ‘나란히’와 ‘바깥뜰을 향해’로 공간 배치를 분명히 드러내되, 원문이 말하는 설계상의 관계를 과장하지 않았습니다.
  alternative_readings:
  - ‘맞은편에’
  - ‘평행하여’
  - ‘바깥뜰 쪽으로’
  rationale: 본문은 신학적 진술보다 성전 구조의 배치를 전달하므로, 의미를 좁히지 않으면서도 설계적 대비를 읽히게 하는 표현을 택했습니다.
  doctrine_reference: 성전 환상 본문(Ezekiel 40–42)의 서술적·도면적 성격
