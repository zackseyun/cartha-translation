  source_fidelity: ‘사방이 오백 갈대였습니다’는 סָבִיב을 문법적으로 ‘사방 자체가’라는 주어로 바꾸어, 동쪽 변을 측량한 진술을 흐립니다. 또한 ‘갈대’는 여기서 식물이나 단순한 물체 수량이 아니라 측량 단위로 기능하므로, 단위성을 드러내는 표현이 필요합니다. 본문에 있는 ‘다섯 규빗, 갈대’와 문맥상 ‘오백 갈대’라는 이해 사이의 본문 비평적 긴장은 각주로 보존해야 합니다.
  naturalness: ‘측량막대’는 이해 가능하나, 본문 및 각주의 ‘갈대’와 연결되는 ‘측량 갈대’가 더 일관되고 자연스럽습니다. ‘오백 대의 측량 갈대 길이’는 한국어에서 단위로서의 reed를 명료하게 전달합니다.
