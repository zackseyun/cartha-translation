source:
  edition: WLC
  text: מָדַ֛ד ר֥וּחַ הַ/קָּדִ֖ים בִּ/קְנֵ֣ה הַ/מִּדָּ֑ה חֲמֵשׁ אמות קָנִ֛ים בִּ/קְנֵ֥ה הַ/מִּדָּ֖ה סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/016.yaml
  text: 'He measured the east side with the measuring reed: five hundred reeds by the measuring reed[a], all around.'
  footnotes:
  - marker: a
    text: Hebrew literally reads 'five cubits, reeds.' In context, this is commonly understood as 'five hundred reeds,' in harmony with the surrounding measurements (vv. 16–19). Some manuscripts and ancient versions reflect this more explicitly.
    reason: textual_variant
translation:
  language: ko
  text: 그는 동쪽을 측량막대[a]로 쟀는데, 사방이 오백 갈대였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 문자적으로 ‘다섯 규빗, 갈대’라고 읽힙니다. 문맥상 주변의 측량(16–19절)에 맞추면 ‘오백 갈대’로 이해하는 것이 일반적이며, 일부 사본과 고대 역본도 이를 더 분명히 반영합니다.
    reason: textual_variant
lexical_decisions:
- source_word: מָדַד
  english_pob_choice: He measured
  chosen_korean: 쟀는데
  alternatives_korean:
  - 측량했습니다
  - 재었습니다
  lexicon: HALOT
  rationale: 서술 문맥에서 측량 행위를 자연스럽게 옮기되, 성경적 건축 측량의 진행성을 살리기 위해 간결한 과거형을 택했습니다.
- source_word: רוּחַ הַקָּדִים
  english_pob_choice: the east side
  chosen_korean: 동쪽
  alternatives_korean:
  - 동쪽 면
  - 동풍
  lexicon: HALOT
  rationale: 건축 측량 문맥이므로 ‘바람’보다 방향/측면으로 이해하는 것이 원문과 영어 POB의 의도에 맞습니다. 본문 흐름상 ‘동쪽’이 가장 자연스럽습니다.
- source_word: בִּקְנֵה הַמִּדָּה
  english_pob_choice: with the measuring reed
  chosen_korean: 측량막대
  alternatives_korean:
  - 측량하는 갈대
  - 측량대
  lexicon: HALOT
  rationale: 도구성을 살리면서도 반복되는 측량 용어를 한국어로 명료하게 옮기기 위해 ‘측량막대’를 사용했습니다.
- source_word: חֲמֵשׁ אמות קָנִים
  english_pob_choice: five hundred reeds
  chosen_korean: 오백 갈대
  alternatives_korean:
  - 오백 줄기
  - 오백 규빗
  lexicon: HALOT
  rationale: 영어 POB가 본문 맥락과 변이 전승을 따라 ‘five hundred reeds’로 이해한 판단을 반영했습니다. 한국어에서도 본문 표면형의 긴장감을 유지하기 위해 수량을 직접 옮겼습니다.
theological_decisions:
- issue: 측량 단위의 본문 긴장(‘규빗’/‘갈대’ 문제)
  chosen_reading: 본문의 문자형을 과도하게 평준화하지 않고 ‘오백 갈대’로 두었습니다.
  alternative_readings:
  - 오백 규빗
  - 오백 갈대(주석으로 본문 긴장 설명)
  rationale: 히브리어 본문에는 ‘규빗’과 ‘갈대’가 함께 나타나며, 영어 POB도 이를 본문 비평상의 긴장으로 주석 처리합니다. 한국어 본문은 그 긴장을 보존해야 하므로 전통적으로 익숙한 ‘오백 규빗’으로 단순화하지 않았습니다.
  doctrine_reference: 본문비평/번역 원칙
