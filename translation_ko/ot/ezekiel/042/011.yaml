revisions:
- from: 그들 앞에는 그 북쪽의 방들의 모습과 같은 통로가 있었습니다. 그 길이와 마찬가지로 그 너비도 같았고, 그 모든 출구와 그 배열과 그 प्रवेश구도 같았습니다.[a][b]
  to: 그들 앞에는 북쪽에 있는 방들과 같은 모양의 통로가 있었습니다.[a] 길이도 너비도 같았으며, 모든 출구와 배치와 출입구도 같았습니다.[b]
  rationale: 치수 비교가 길이와 너비의 동일성으로 오해되지 않도록, 북쪽 방들과의 문맥상 대응을 반영해 ‘길이도 너비도 같았으며’로 고쳤습니다. 표기 오류를 바로잡고, 건축 용어를 자연스러운 현대 표준 한국어로 정비했습니다. 각주는 원문의 대안적 의미를 보존하면서도 단정적 해석을 피하도록 수정했습니다.
