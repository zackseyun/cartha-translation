  - 그 정해진 방식
  rationale: 이 구절의 문맥은 성전 구조 설명이므로, מִשְׁפְּטֵיהֶן을 법조문처럼 읽기보다 배치와 설계의 방식으로 이해하는 것이 source에 더 충실합니다.
  doctrine_reference: 성전 환상 본문의 서술적·구조적 정확성
