  text: And before them was a passage[a], like the appearance of the chambers that faced north; as was their length, so was their width, and all their exits, their arrangements[b], and their entrances were alike.
  footnotes:
  - marker: a
    text: Or 'in front of them was a passage corresponding to the appearance of the chambers on the north side.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'arrangements' can also mean 'ordinances,' 'regulations,' or 'prescribed manner'; here it likely refers to the structural layout or prescribed design of the chambers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 앞에는 북쪽에 있는 방들과 같은 모양의 통로가 있었습니다.[a] 길이도 너비도 같았으며, 모든 출구와 배치와 출입구도 같았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 앞에는 북쪽에 있는 방들의 모양에 상응하는 통로가 있었다’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘미쉬파트’는 ‘규정’, ‘규례’, 또는 ‘정해진 방식’을 뜻할 수도 있습니다. 여기서는 방들의 배치나 구조를 가리킬 가능성이 높습니다.
    reason: lexical_alternative
