  yaml_path: translation/ot/ezekiel/042/009.yaml
  text: And below these chambers was the entrance from the east[a], as one enters them from the outer court.
  footnotes:
  - marker: a
    text: Or, more literally, 'from the east'; the phrase may indicate either the entrance's eastern location or approach from the east.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 방들 아래에는, 바깥뜰에서 이 방들로 들어갈 때 쓰는 동쪽 입구가 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘동쪽에서’입니다. 이 표현은 입구가 동쪽에 있음을 가리킬 수도 있고, 동쪽에서 그 입구로 접근함을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתַּחְתֶּה
  english_pob_choice: And below
  chosen_korean: 그리고 이 방들의 아래에는
  alternatives_korean:
  - 그리고 아래에는
  - 그리고 이 방들 아래에는
  lexicon: HALOT
  rationale: 문맥상 앞서 언급된 건축 구조와의 공간적 관계를 나타내므로, 자연스러운 한국어로 ‘아래에는’로 옮기되 앞부분의 연결을 살려 주었습니다.
- source_word: לְשָׁכוֹת הָאֵלֶּה
  english_pob_choice: these chambers
  chosen_korean: 이 방들
  alternatives_korean:
  - 이 방들
  - 이 침실들
  - 이 별실들
  lexicon: HALOT
  rationale: 성전 건축 문맥의 לשכות는 기능적으로 ‘방’ 또는 ‘방들’이 가장 직관적이며, ‘방들’은 복수성과 구조적 용도를 무리 없이 전달합니다.
- source_word: הַמָּבוֹא מֵהַקָּדִים
  english_pob_choice: the entrance from the east
  chosen_korean: 동쪽에서 들어가는 입구
  alternatives_korean:
  - 동쪽의 입구
  - 동쪽에서의 प्रवेश구
  - 동쪽에서 오는 입구
  lexicon: HALOT
  rationale: 직역하면 ‘동쪽으로부터’이지만, 여기서는 입구의 위치와 접근 방향이 함께 보이므로 ‘동쪽에서 들어가는 입구’가 원문의 공간적 의미를 가장 잘 드러냅니다.
- source_word: מֵהֶחָצֵר הַחִיצֹנָה
  english_pob_choice: from the outer court
  chosen_korean: 바깥뜰에서
  alternatives_korean:
  - 바깥뜰로부터
  - 외뜰에서
  - 바깥 마당에서
  lexicon: HALOT
  rationale: 성전 설비 문맥의 정형 표현이므로 ‘바깥뜰’이 가장 자연스럽고, 출발점 의미는 조사 ‘에서’로 충분히 전달됩니다.
- source_word: בְּבֹאוֹ לָהֵנָּה
  english_pob_choice: as one enters them
  chosen_korean: 그리로 들어갑니다
  alternatives_korean:
  - 그 안으로 들어갑니다
  - 그곳으로 들어갈 때입니다
  - 들어가게 됩니다
  lexicon: HALOT
  rationale: 히브리어의 무인칭적 진술을 한국어에서는 행위의 진행으로 옮겨, 안내문 같은 문체를 살리면서도 과도한 해석을 피했습니다.
