  rationale: 성전 설비 문맥의 정형 표현이므로 ‘바깥뜰’이 가장 자연스럽고, 출발점 의미는 조사 ‘에서’로 충분히 전달됩니다.
- source_word: בְּבֹאוֹ לָהֵנָּה
  english_pob_choice: as one enters them
  chosen_korean: 그리로 들어갑니다
  alternatives_korean:
  - 그 안으로 들어갑니다
  - 그곳으로 들어갈 때입니다
  - 들어가게 됩니다
  lexicon: HALOT
  rationale: 히브리어의 무인칭적 진술을 한국어에서는 행위의 진행으로 옮겨, 안내문 같은 문체를 살리면서도 과도한 해석을 피했습니다.
