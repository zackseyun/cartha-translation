  lexicon: HALOT
  rationale: 직역하면 ‘동쪽으로부터’이지만, 여기서는 입구의 위치와 접근 방향이 함께 보이므로 ‘동쪽에서 들어가는 입구’가 원문의 공간적 의미를 가장 잘 드러냅니다.
- source_word: מֵהֶחָצֵר הַחִיצֹנָה
  english_pob_choice: from the outer court
  chosen_korean: 바깥뜰에서
