base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/004.yaml
  text: Before the chambers was a walkway ten cubits wide toward the inner court[a], and a passage one cubit wide[b]; and their entrances faced north.
  footnotes:
  - marker: a
    text: Hebrew 'toward the inner [side/area]'; the noun is not stated. Some translations supply 'court' ('toward the inner court'), but 'court' is not explicit in this verse.
    reason: alternative_reading
  - marker: b
    text: The Hebrew text is difficult in this clause. Some understand it as 'a way of one cubit' or, following a different vocalization/tradition, 'one hundred cubits.'
    reason: textual_variant
translation:
  language: ko
  text: 방들 앞에는 안쪽을 향한[a] 너비 열 규빗의 통로가 있고, 한 규빗 너비의 길[b]이 있었으며, 그 방들의 출입구는 북쪽을 향했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘안쪽[부분/지역]을 향하여’라는 뜻이며, 명사 ‘뜰’은 이 절에 명시되어 있지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 이 히브리어 구문은 난해합니다. 어떤 이들은 ‘한 규빗의 길’로 이해하고, 다른 모음 전통을 따르면 ‘백 규빗’으로도 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: לִפְנֵי הַלְּשָׁכוֹת
  english_pob_choice: Before the chambers
  chosen_korean: 방들 앞에는
  alternatives_korean:
  - 그 방들 앞에는
  - 그 방실들 앞에는
  lexicon: HALOT
  rationale: לִפְנֵי는 공간적 전면 관계를 나타내므로, 한국어에서는 자연스럽게 ‘앞에는’으로 옮겼습니다. לשכות는 성전 건축 맥락에서 ‘방들’보다 ‘방’이 현대 한국어에 더 자연스러워 최소한으로 풀어 썼습니다.
- source_word: מַהֲלַךְ עֶשֶׂר אַמּוֹת רֹחַב
  english_pob_choice: a walkway ten cubits wide
  chosen_korean: 너비 열 규빗의 통로
  alternatives_korean:
  - 열 규빗 너비의 통로
  - 열 규빗 넓이의 보행로
  lexicon: HALOT
  rationale: מַהֲלַךְ은 걸어 다니는 공간/통로를 뜻하므로 ‘통로’로 옮겼고, 측정구문은 ‘너비 열 규빗’으로 간결하게 살렸습니다.
- source_word: אֶל הַפְּנִימִית
  english_pob_choice: toward the inner area
  chosen_korean: 안쪽을 향한
  alternatives_korean:
  - 안쪽을 향한
  - 내부를 향한
  - 안쪽 구역을 향한
  lexicon: HALOT
  rationale: 히브리어는 ‘안쪽’이라는 방향만 분명하고 명시된 명사는 없으므로, POB의 주석 취지를 따라 ‘안쪽’으로만 처리해 ‘뜰’ 같은 명사를 보태지 않았습니다.
- source_word: דֶּרֶךְ אַמָּה אֶחָת
  english_pob_choice: a passage one cubit wide
  chosen_korean: 한 규빗 넓이의 길
  alternatives_korean:
  - 한 규빗 길이의 길
  - 한 규빗 너비의 통로
  lexicon: HALOT
  rationale: דֶּרֶךְ은 여기서 접근로/길의 의미가 자연스럽고, אַמָּה אֶחָת은 문맥상 폭을 가리키므로 ‘넓이의 길’로 옮겨 측정 의미를 분명히 했습니다.
- source_word: וּפִתְחֵיהֶם
  english_pob_choice: and their entrances
  chosen_korean: 그들의 출입구는
  alternatives_korean:
  - 그들의 문은
  - 그 출입구들은
  lexicon: HALOT
  rationale: פתח는 문, 출입구, 입구를 뜻하지만 건축 맥락에서는 ‘출입구’가 가장 중립적이고 자연스럽습니다.
theological_decisions:
- issue: 히브리어의 생략된 명사 처리
  chosen_reading: ‘안쪽을 향한’으로만 옮겨, 본문에 없는 ‘뜰/회랑’ 같은 명사를 보태지 않았습니다.
  alternative_readings:
  - ‘안쪽 뜰을 향한’
  - ‘내부 구역을 향한’
  rationale: 본문은 방향만 제공하고 대상 명사를 말하지 않으므로, 독자에게 구조를 상상하게 하되 추가 정보를 강요하지 않는 번역이 더 충실합니다.
  doctrine_reference: 성전 환상 본문에 대한 본문충실성, 텍스트 보존 원칙
- issue: 모호한 치수 구문 처리
  chosen_reading: ‘한 규빗 넓이의 길’로 두어, 본문이 어려운 지점을 드러냈습니다.
  alternative_readings:
  - ‘한 규빗의 길’
  - ‘백 규빗의 길’(다른 전통/모음법)
  rationale: 히브리어 본문은 이 구절이 난해하므로, 평탄화하지 않고 애매성을 유지하는 것이 POB의 주석 취지와 부합합니다.
  doctrine_reference: 본문비평적 겸손, 난구 보존 원칙
