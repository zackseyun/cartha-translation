  text: וַ/יֹּ֣אמֶר אֵלַ֗/י לִֽשְׁכ֨וֹת הַ/צָּפ֜וֹן לִֽשְׁכ֣וֹת הַ/דָּרוֹם֮ אֲשֶׁ֣ר אֶל פְּנֵ֣י הַ/גִּזְרָה֒ הֵ֣נָּה לִֽשְׁכ֣וֹת הַ/קֹּ֗דֶשׁ אֲשֶׁ֨ר יֹאכְלוּ שָׁ֧ם הַ/כֹּהֲנִ֛ים אֲשֶׁר קְרוֹבִ֥ים לַֽ/יהוָ֖ה קָדְשֵׁ֣י הַ/קֳּדָשִׁ֑ים שָׁ֞ם יַנִּ֣יחוּ קָדְשֵׁ֣י הַ/קֳּדָשִׁ֗ים וְ/הַ/מִּנְחָה֙ וְ/הַ/חַטָּ֣את וְ/הָ/אָשָׁ֔ם כִּ֥י הַ/מָּק֖וֹם קָדֹֽשׁ־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/013.yaml
  text: Then he said to me[a], “The north chambers, the south chambers, which are opposite the separate area—they are the holy chambers, where the priests who draw near to Yahweh shall eat the most holy things. There they shall place the most holy things, the grain offering, the sin offering, and the guilt offering[d][c][b], for the place is holy.”
  footnotes:
  - marker: a
    text: Or “facing the separate area.” The Hebrew expression indicates that these chambers were situated opposite the restricted section of the temple complex.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the most holy things,” referring here to offerings of the highest degree of sanctity, not to the inner room called the Holy of Holies.
    reason: lexical_alternative
  - marker: c
    text: Or “purification offering” for “sin offering.”
    reason: alternative_reading
  - marker: d
    text: Or “reparation offering” for “guilt offering.”
    reason: alternative_reading
translation:
  language: ko
  text: 그가 내게 말씀하셨습니다. “구별된 공간 맞은편에 있는 북쪽 방들과 남쪽 방들은 거룩한 방들입니다.[a] 그곳에서 야훼께 가까이 나아가는 제사장들이 지극히 거룩한 것들을 먹을 것입니다.[b] 그들은 그곳에 지극히 거룩한 것들과 곡식제물과 속죄제물[c]과 속건제물[d]을 둘 것입니다. 그 장소가 거룩하기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘맞은편에 있는’은 히브리어 표현이 이 방들이 성전 단지의 구별된 구역을 향해, 또는 그 맞은편에 자리하고 있음을 나타내는 점을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지극히 거룩한 것들’은 여기서 방인 지성소를 가리키는 것이 아니라, 가장 높은 등급의 거룩함에 속한 제물들을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘속죄제물’은 ‘죄제물’ 또는 ‘정결제물’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: ‘속건제물’은 ‘배상제물’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לִשְׁכּוֹת הַצָּפוֹן / לִשְׁכּוֹת הַדָּרוֹם
  english_pob_choice: the north chambers / the south chambers
  chosen_korean: 북쪽 방들 / 남쪽 방들
  alternatives_korean:
  - 북쪽의 방들 / 남쪽의 방들
  - 북쪽 별실들 / 남쪽 별실들
  lexicon: HALOT
  rationale: 성전 환상 문맥의 לִשְׁכָּה는 건축물의 방·칸을 가리키므로, 한국어로는 자연스럽고 간명한 ‘방들’이 적절합니다.
- source_word: אֶל פְּנֵי הַגִּזְרָה
  english_pob_choice: opposite the separate area
  chosen_korean: 그 구별된 공간을 마주 보고 있는
  alternatives_korean:
  - 그 분리된 공간 앞의
  - 그 구별된 뜰을 향한
  lexicon: HALOT
  rationale: פְּנֵי와 אֶל의 결합은 단순한 위치가 아니라 ‘마주 봄/향함’의 방향성을 나타내므로, ‘마주 보고 있는’으로 옮겼습니다.
- source_word: קָדְשֵׁי הַקֳּדָשִׁים
  english_pob_choice: the most holy things
  chosen_korean: 지극히 거룩한 것들
  alternatives_korean:
  - 가장 거룩한 것들
  - 지성물
  lexicon: HALOT
  rationale: 이 표현은 지성소 건물이 아니라 가장 높은 등급의 제사물들을 가리키므로, 오해를 피하면서도 위계를 살린 ‘지극히 거룩한 것들’을 택했습니다.
- source_word: הַמִּנְחָה / הַחַטָּאת / הָאָשָׁם
  english_pob_choice: the grain offering / the sin offering / the guilt offering
  chosen_korean: 곡식제물 / 속죄제물 / 속건제물
  alternatives_korean:
  - 소제 / 속죄제 / 속건제
  - 곡식 예물 / 죄 제물 / 배상 제물
  lexicon: HALOT
  rationale: 제사 용어는 한국어 교회 전통어를 그대로 따르기보다, 본문이 나열하는 제물 종류를 분명히 드러내는 번역이 필요했습니다. ‘곡식제물’은 מִנְחָה의 제의적 성격을, ‘속죄제물’과 ‘속건제물’은 각각 חַטָּאת과 אָשָׁם의 기본 의미를 반영합니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 이 본문은 여호와의 고유명을 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: קָדְשֵׁי הַקֳּדָשִׁים의 범주
  chosen_reading: 제물의 최고 거룩함을 가리키는 표현으로 처리했습니다.
  alternative_readings:
  - 지성소 자체를 가리키는 것으로 읽는 해석
  - ‘가장 거룩한 제물들’로만 좁히는 해석
  rationale: 바로 뒤에 곡식제물, 속죄제물, 속건제물이 나와서, 이 표현이 방을 뜻하는 지성소가 아니라 제물의 등급을 말한다는 점이 분명합니다.
  doctrine_reference: 성소/제물 용어 구분
- issue: 제사장 호칭의 행위성
  chosen_reading: ‘야훼께 가까이 나아가는 자들’로 옮겨 제의적 접근성을 드러냈습니다.
  alternative_readings:
  - ‘야훼께 가까운 자들’
  - ‘야훼 앞에 서는 자들’
  rationale: 히브리어 קְרוֹבִים은 단순한 지리적 근접이 아니라 예배·제사의 접근 행위를 말하므로, 동적인 표현을 유지했습니다.
  doctrine_reference: 제의 언어의 기능적 번역
