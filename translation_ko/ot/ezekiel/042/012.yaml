  text: And corresponding to the doorways of the chambers that were toward the south[a], there was a doorway at the head of the way, the way in front of the protective wall, toward the east[b], as one enters them.
  footnotes:
  - marker: a
    text: Or 'at the beginning of the passage'; the Hebrew repeats 'way/path' several times, and the exact architectural nuance is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'protective' is rare and may also suggest an enclosing or screening wall.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 남쪽에 있는 방들의 문들에 대응하여, 길의 머리 — 곧 그 보호벽 앞의 길 — 동쪽을 향한 문이 있었으니, 그 안으로 들어갈 때입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘통로의 시작에서’; 히브리어는 ‘길/통로’를 여러 번 반복하며, 정확한 건축적 뉘앙스는 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘보호’로 옮긴 히브리어는 희귀어로, 둘러막는 벽이나 가리는 벽을 가리킬 수도 있습니다.
    reason: lexical_alternative
