revisions:
- from: 그리고 남쪽에 있는 방들의 문들에 대응하여, 길의 머리 — 곧 그 보호벽 앞의 길 — 동쪽을 향한 문이 있었으니, 그 안으로 들어갈 때입니다.[a][b]
  to: 남쪽을 향한 방들의 출입구들과 마찬가지로, 그 방들에 들어갈 때 동쪽으로 난 보호벽[b] 앞 길의 어귀[a]에 출입구가 있었습니다.
  rationale: 비교 구문은 ‘…들과 마찬가지로’로 보존했습니다. 동쪽 방향을 문이 아니라 접근로에 연결하고, בבואן을 ‘그 방들에 들어갈 때’로 정확하고 자연스럽게 처리했습니다. 희귀한 벽 관련 표현의 불확실성은 기존 각주를 유지하여 보존했으며, 각주 a의 앵커를 해당 어구로 옮겼습니다.
