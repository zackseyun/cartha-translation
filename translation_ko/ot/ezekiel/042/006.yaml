  text: For they were in three stories[a], and they had no pillars like the pillars of the courts; therefore the upper stories receded more than the lower and middle ones from the ground.
  footnotes:
  - marker: a
    text: Or 'were recessed' or 'were reduced'; the Hebrew verb is rare here, and the exact architectural nuance is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들은 세 층으로 되어 있었고, 그것들에게는 뜰의 기둥들처럼 기둥이 없었습니다. 그러므로 위층은 땅에서 아래층과 중간층보다 더 물러나 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 드문 동사는 여기서 건축적으로 ‘물러나다/들어가다/축소되다’의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그러므로
  alternatives_korean:
  - 왜냐하면
  - 그 까닭에
  lexicon: HALOT
  rationale: 앞절의 구조적 설명에 대한 이유를 이어 주는 연결로서, 한국어에서는 원인-결과 흐름을 자연스럽게 드러내는 ‘그러므로’가 적절합니다.
- source_word: מְשֻׁלָּשׁוֹת
  english_pob_choice: in three stories
  chosen_korean: 세 층으로 되어 있었고
  alternatives_korean:
  - 세 층이었다
  - 세 층으로 이루어져 있었고
  - 세 단으로 되어 있었고
  lexicon: HALOT
  rationale: 건축 문맥에서 ‘three stories’를 직역하기보다, 구조의 상태를 자연스럽게 나타내는 ‘세 층으로 되어 있었고’로 옮겼습니다.
- source_word: וְאֵין לָהֶן עַמּוּדִים כְּעַמּוּדֵי הַחֲצֵרוֹת
  english_pob_choice: and they had no pillars like the pillars of the courts
  chosen_korean: 그것들에게는 뜰의 기둥들처럼 기둥이 없었습니다
  alternatives_korean:
  - 그것들에게는 뜰의 기둥들 같은 기둥이 없었습니다
  - 뜰의 기둥들과 같은 기둥이 없었습니다
  lexicon: HALOT
  rationale: ‘pillars’와 ‘the courts’를 건축적 대조로 유지하면서, 소유를 나타내는 ל의 의미를 한국어의 부정 소유 구문으로 옮겼습니다.
- source_word: נֶאֱצַל
  english_pob_choice: were set back
  chosen_korean: 더 물러나 있었습니다
  alternatives_korean:
  - 들어가 있었습니다
  - 뒤로 물러나 있었습니다
  - 안쪽으로 들어가 있었습니다
  lexicon: HALOT
  rationale: 히브리어 동사의 드문 용례가 지시하는 공간적 후퇴를 과도하게 확정하지 않고, 건축적 ‘set back’의 뜻을 드러내는 표현으로 처리했습니다.
theological_decisions:
- issue: 건축 묘사의 해석 범위
  chosen_reading: 본문이 제시하는 것은 제의적 의미보다 구조적 배치에 대한 설명이므로, 의미를 확장하지 않고 건축적 공간 관계만 전달했습니다.
  alternative_readings:
  - 상징적 의미를 암시하는 번역
  - 성전 신학을 덧붙이는 번역
  rationale: 문맥상 층의 후퇴와 기둥의 부재를 설명하는 기술문이므로, 독자에게 건축 정보가 정확히 전달되도록 했습니다.
  doctrine_reference: 본문 문맥 우선 원칙
- issue: ‘위층은… 더 물러나 있었습니다’의 비교 관계
  chosen_reading: ‘아래층과 중간층보다’에 걸린 비교를 그대로 유지해, 상층이 더 안쪽으로 물러난 구조를 보존했습니다.
  alternative_readings:
  - 상층이 단순히 낮아졌다는 해석
  - 구체적 거리 차이를 산정하는 해석
  rationale: 히브리어의 비교 구문은 상층의 후퇴 정도를 아래층·중간층과 대비시키므로, 비교 관계를 명시적으로 살렸습니다.
  doctrine_reference: 텍스트 비교 구조 보존
