  text: Opposite the twenty cubits that belonged to the inner court[a], and opposite the pavement that belonged to the outer court[b], gallery faced gallery in the third story.
  footnotes:
  - marker: a
    text: Hebrew 'attiq' is a rare architectural term; it may denote a gallery, colonnade, portico, or similar upper structure.
    reason: lexical_alternative
  - marker: b
    text: Or 'on the third level'; the Hebrew likely refers to the third story of the building.
    reason: lexical_alternative
