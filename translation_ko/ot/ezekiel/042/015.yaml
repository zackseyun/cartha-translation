  text: וְ/כִלָּ֗ה אֶת מִדּוֹת֙ הַ/בַּ֣יִת הַ/פְּנִימִ֔י וְ/הוֹצִיאַ֨/נִי֙ דֶּ֣רֶךְ הַ/שַּׁ֔עַר אֲשֶׁ֥ר פָּנָ֖י/ו דֶּ֣רֶךְ הַ/קָּדִ֑ים וּ/מְדָד֖/וֹ סָבִ֥יב סָבִֽיב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/015.yaml
  text: When he had finished measuring the inner house[a], he brought me out by way of the gate that faced east[b], and he measured it all around.
  footnotes:
  - marker: a
    text: Or 'the inner house.' The Hebrew uses 'house' in temple-vision context for the sacred structure.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the gate whose face was toward the east.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 안쪽 집[a]을 측량하기를 마치자, 나를 동쪽을 향한 문[b]으로 이끌어 내고, 그것을 사방으로 두루 측량하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘안쪽 집’입니다. 성전 환상 문맥에서 ‘집’은 성전 구조물을 가리킬 수 있습니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘그 앞면이 동쪽을 향한 문’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה אֶת מִדּוֹת הַבַּיִת הַפְּנִימִי
  english_pob_choice: When he had finished measuring the inner house
  chosen_korean: 그가 안쪽 집의 측량을 마치자
  alternatives_korean:
  - 그가 내실의 측량을 마치자
  - 그가 안쪽 성전의 측량을 마치자
  lexicon: HALOT
  rationale: כלה는 ‘마치다’의 완료 의미를, מִדּוֹת는 문맥상 ‘측량’을 자연스럽게 살려 번역했습니다. בַּיִת은 성전 환상 문맥에서 ‘집’이지만, 한국어에서는 ‘안쪽 집’이 원문 대응을 가장 직접적으로 유지합니다.
- source_word: וְהוֹצִיאַנִי
  english_pob_choice: he brought me out
  chosen_korean: 나를 ... 이끌어 내었고
  alternatives_korean:
  - 나를 데리고 나갔고
  - 나를 밖으로 데리고 나갔고
  lexicon: HALOT
  rationale: הוציא의 사역적 의미를 살리면서, 환상 속 인도 장면에 맞게 ‘이끌어 내다’로 옮겼습니다. 단순한 이동보다 안내·인도의 뉘앙스를 보존합니다.
- source_word: דֶּרֶךְ הַשַּׁעַר אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִים
  english_pob_choice: by way of the gate that faced east
  chosen_korean: 동쪽을 향한 문으로
  alternatives_korean:
  - 동쪽을 바라보는 문으로
  - 동쪽을 향한 성문으로
  lexicon: HALOT
  rationale: פָּנָיו דֶּרֶךְ הַקָּדִים의 방향 표지를 한국어 관용에 맞게 압축해, ‘동쪽을 향한’으로 직역성을 유지했습니다. ‘문’은 성전 환상에서 gate의 기능을 충분히 드러냅니다.
- source_word: וּמְדָדֹו סָבִיב סָבִיב
  english_pob_choice: and he measured it all around
  chosen_korean: 그 집을 사방으로 측량하였습니다
  alternatives_korean:
  - 그것을 사방으로 측량하였습니다
  - 사방에 걸쳐 그 집을 측량하였습니다
  lexicon: HALOT
  rationale: סָבִיב סָבִיב의 반복 강조를 한국어의 ‘사방으로’로 옮겨 둘러 측량하는 뜻을 살렸습니다. 대명사 ‘it’의 지시 대상은 직전의 건축물 전체로 이해해 ‘그 집’으로 분명히 했습니다.
theological_decisions:
- issue: 성전 환상에서의 בַּיִת 해석
  chosen_reading: ‘안쪽 집’으로 두어 원문의 ‘집’ 표현을 보존하되, 성전 환상 맥락을 통해 성전 구조를 가리키는 것으로 읽게 했습니다.
  alternative_readings:
  - ‘안쪽 성전’
  - ‘내실’
  rationale: 이 절은 건축 측량 문맥이므로 해석을 지나치게 종교용어화하지 않고, 원문의 어휘를 먼저 보존하는 편이 더 투명합니다.
  doctrine_reference: Ezekiel temple-vision terminology
