    text: 히브리어 본문은 ‘오백 갈대’라고 읽습니다. 일부 사본과 고대 역본에는 일부 번역본의 ‘오백 규빗’이라는 번역에 반영된 이문이 있습니다. 본문은 여기서 마소라 히브리어 본문을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: מָדַד
  english_pob_choice: He measured
  chosen_korean: 측량했습니다
  alternatives_korean:
