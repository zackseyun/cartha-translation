  source_fidelity: ‘그가 북쪽 편을 측량했습니다’는 מָדַד רוּחַ הַצָּפוֹן을 대체로 충실하게 옮겼습니다. 그러나 ‘측량하는 갈대로 오백 갈대였습니다’는 수단구와 측정 결과의 관계가 부자연스럽고, סָבִיב(‘둘러/사방으로’)의 뜻이 빠졌습니다.
  naturalness: 현 번역의 두 번째 문장은 ‘갈대로 오백 갈대였습니다’라는 형태 때문에 현대 한국어에서 측량 결과를 명료하게 전달하지 못합니다. ‘측량 갈대로 … 둘러 재니, 오백 갈대였습니다’로 고치면 자연스럽고 원문의 구성도 보존됩니다.
  terminology: ‘측량’, ‘측량 갈대’, ‘갈대’는 건축·측량 문맥과 קָנִים의 문자적 의미를 잘 반영합니다. ‘측량하는 갈대’보다 합성 명사인 ‘측량 갈대’가 더 자연스럽습니다. 각주도 마소라 본문과 ‘규빗’ 이문/번역 전통의 관계를 더 정확하고 매끄럽게 밝혀야 합니다.
