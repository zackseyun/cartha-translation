base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/017.yaml
  text: 'He measured the north side: five hundred reeds[a], by the measuring reed all around.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''five hundred reeds.'' Some manuscripts and ancient versions have a reading reflected in some translations as ''five hundred cubits.'' The main text follows the Masoretic Hebrew here.'
    reason: textual_variant
translation:
  language: ko
  text: 그가 북쪽 편을 측량했습니다. 측량하는 갈대로 오백 갈대였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘오백 갈대’라고 읽습니다. 일부 사본과 고대 역본은 ‘오백 규빗’으로 반영된 읽기를 보이지만, 본문은 마소라 본문을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: מָדַד
  english_pob_choice: He measured
  chosen_korean: 측량했습니다
  alternatives_korean:
  - 재었습니다
  - 측정했습니다
  lexicon: HALOT
  rationale: 건축물의 경계와 길이를 재는 문맥이므로 일반적인 ‘재다’보다 ‘측량하다’가 더 정확하고 자연스럽습니다.
- source_word: רוּחַ הַצָּפוֹן
  english_pob_choice: the north side
  chosen_korean: 북쪽 편
  alternatives_korean:
  - 북쪽
  - 북쪽 방향
  - 북쪽 면
  lexicon: HALOT
  rationale: 여기서는 바람이 아니라 성전/건축의 방향을 가리키므로, 공간적 표지인 ‘편’으로 옮겨 측량 대상의 면을 분명히 했습니다.
- source_word: קָנִים
  english_pob_choice: reeds
  chosen_korean: 갈대
  alternatives_korean:
  - 지팡이
  - 막대
  lexicon: HALOT
  rationale: 히브리어 원문이 분명히 ‘갈대들’이라고 말하므로, 단위로 기능하는 측량 갈대를 한국어로도 그대로 드러냈습니다.
- source_word: בִּקְנֵה הַמִּדָּה
  english_pob_choice: by the measuring reed
  chosen_korean: 측량하는 갈대로
  alternatives_korean:
  - 측량 갈대로
  - 측량하는 자로
  lexicon: HALOT
  rationale: 수단을 나타내는 전치사 의미를 살려, 실제 측량 도구인 ‘측량하는 갈대’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 1인칭/서술 시점의 간결한 보고체 유지
  chosen_reading: 비전 기록의 서술을 따라 단순한 과거 보고체로 옮겼습니다.
  alternative_readings:
  - ‘그가 측량하셨습니다’처럼 존칭을 높이는 방식
  - ‘그는 재어 보았습니다’처럼 완곡하게 풀어쓰는 방식
  rationale: 이 구절은 직접 신적 발화가 아니라 환상 속 측량 행위를 기록하는 서술이므로, 의미를 흐리지 않는 중립적 보고체가 가장 적절합니다.
  doctrine_reference: 본문 서술체
