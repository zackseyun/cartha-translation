  - 북쪽 방향
  - 북쪽 면
  lexicon: HALOT
  rationale: 여기서는 바람이 아니라 성전/건축의 방향을 가리키므로, 공간적 표지인 ‘편’으로 옮겨 측량 대상의 면을 분명히 했습니다.
- source_word: קָנִים
  english_pob_choice: reeds
  chosen_korean: 갈대
  alternatives_korean:
  - 지팡이
  - 막대
  lexicon: HALOT
  rationale: 히브리어 원문이 분명히 ‘갈대들’이라고 말하므로, 단위로 기능하는 측량 갈대를 한국어로도 그대로 드러냈습니다.
- source_word: בִּקְנֵה הַמִּדָּה
  english_pob_choice: by the measuring reed
  chosen_korean: 측량하는 갈대로
  alternatives_korean:
  - 측량 갈대로
  - 측량하는 자로
  lexicon: HALOT
  rationale: 수단을 나타내는 전치사 의미를 살려, 실제 측량 도구인 ‘측량하는 갈대’로 자연스럽게 표현했습니다.
