id: EZK.8.7
reference: Ezekiel 8:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֵ֥א אֹתִ֖/י אֶל פֶּ֣תַח הֶֽ/חָצֵ֑ר וָ/אֶרְאֶ֕ה וְ/הִנֵּ֥ה חֹר אֶחָ֖ד בַּ/קִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/007.yaml
  text: Then he brought me to the entrance of the court[a], and I looked, and behold[b], there was a hole in the wall.
  footnotes:
  - marker: a
    text: Or 'and I saw'; the Hebrew verb can denote either the act of looking or the resulting seeing.
    reason: lexical_alternative
  - marker: b
    text: Or 'the courtyard.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 뜰 문 어귀로 데리고 갔습니다. 내가 보니, 보라, 벽에 구멍 하나가 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 보았습니다’; 히브리어 동사는 보는 행위 자체와 그 결과를 모두 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘뜰.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי
  english_pob_choice: Then he brought me
  chosen_korean: 그가 나를 데리고 갔습니다
  alternatives_korean:
  - 그가 나를 데려갔습니다
  - 그가 나를 이끌어 갔습니다
  lexicon: HALOT
  rationale: 히필 완료형의 인도 동작을 자연스럽게 살려 ‘데리고 갔습니다’로 옮겼습니다. 직접적인 이동보다 안내·동행의 뉘앙스가 있어 문맥에 맞습니다.
- source_word: אֶל פֶּתַח הֶחָצֵר
  english_pob_choice: to the entrance of the court
  chosen_korean: 뜰 문 어귀로
  alternatives_korean:
  - 뜰의 입구로
  - 뜰의 문으로
  lexicon: HALOT
  rationale: פֶּתַח은 단순한 ‘입구’보다 ‘문 어귀’가 더 구체적이고, הֶחָצֵר는 성전 문맥에서 ‘뜰’이 적절합니다. ‘어귀’는 ‘entrance’의 위치감을 살립니다.
- source_word: וָאֶרְאֶה
  english_pob_choice: and I looked
  chosen_korean: 내가 보니
  alternatives_korean:
  - 내가 바라보니
  - 내가 보았습니다
  lexicon: HALOT
  rationale: 이 동사는 단순 시각보다 주의 깊게 살펴보는 동작을 담을 수 있어, 발견의 전개를 자연스럽게 보이는 ‘내가 보니’로 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 그리고
  lexicon: HALOT
  rationale: 예언적 장면 전환의 감탄·지시 기능을 살려 ‘보라’로 옮겼습니다. 한국어에서 ‘보라’는 주의 환기와 놀라움을 함께 전달합니다.
- source_word: חֹר אֶחָד בַּקִּיר
  english_pob_choice: there was a hole in the wall
  chosen_korean: 벽에 구멍 하나가 있었습니다
  alternatives_korean:
  - 벽에 한 구멍이 있었습니다
  - 벽 속에 구멍 하나가 있었습니다
  lexicon: HALOT
  rationale: חֹר은 가장 პირდაპირ적인 ‘구멍’이 적절하며, אֶחָד은 수사보다 부정관사 기능이므로 ‘하나’로 자연스럽게 처리했습니다. בַּקִּיר은 ‘벽에’로 간결하게 옮겼습니다.
theological_decisions:
- issue: 예언적 현시의 문체
  chosen_reading: ‘보라’로 장면 전환과 계시의 돌출성을 살렸습니다.
  alternative_readings:
  - 그런데
  - 그리고 보니
  rationale: 본문의 וְהִנֵּה는 단순한 서술 연결보다 눈앞에 드러난 장면을 강조하므로, 한국어에서도 예언적 긴장감을 유지하는 표현이 필요합니다.
  doctrine_reference: 예언서 서술의 현현적 강조
