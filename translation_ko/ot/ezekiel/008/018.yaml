  verdict: revise
  source_fidelity: 원문의 접속·첨가 강조(וְגַם אֲנִי), 심판의 분노, ‘눈이 아끼지 않음’의 신체 비유, 긍휼의 거부, 그리고 큰 소리의 부르짖음에도 듣지 않으심을 유지했습니다. 다만 ‘그뿐만 아니라’는 앞 절의 내용을 ‘그것뿐만 아니라’로 한정·증폭하는 한국어 표현이므로, 단순한 첨가 강조인 וְגַם에 더 가까운 ‘그리고 나도’로 고쳤습니다. 마지막 목적어는 한국어에서 ‘그들을 듣지 않다’가 부자연스러워, 문맥상 그들의 외침을 가리키는 ‘그들의 부르짖음’을 사용했습니다.
  naturalness: ‘내 눈이 아끼지 않을 것이며’는 목적어 없는 한국어로 다소 어색하고, ‘긍휼을 베풀다’는 חמל의 직접적인 정서 동사보다 행위 쪽으로 다소 확장됩니다. ‘내 눈은 아끼지 않겠고, 나도 긍휼히 여기지 않겠습니다’가 현대 표준어 합쇼체에서 자연스럽고 평행을 잘 보존합니다.
  terminology: ‘분노’, ‘아끼다’, ‘긍휼히 여기다’, ‘부르짖다’는 본문의 심판 및 자비 어휘를 과도하게 완화하지 않고 적절히 전달합니다. 기존 각주[a]는 본문 번역의 대안이나 필요한 설명을 제공하지 않으며, ‘직역하면’이라는 설명도 본문과 사실상 동일하여 제거하는 것이 적절합니다.
