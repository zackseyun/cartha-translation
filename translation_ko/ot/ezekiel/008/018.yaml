id: EZK.8.18
reference: Ezekiel 8:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַם אֲנִי֙ אֶעֱשֶׂ֣ה בְ/חֵמָ֔ה לֹֽא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמֹ֑ל וְ/קָרְא֤וּ בְ/אָזְנַ/י֙ ק֣וֹל גָּד֔וֹל וְ/לֹ֥א אֶשְׁמַ֖ע אוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/018.yaml
  text: And I also will act in wrath; my eye will not spare[a], nor will I have compassion. Though they cry in my ears with a loud voice, I will not hear them.
  footnotes:
  - marker: a
    text: Or, 'And they will cry in my ears with a loud voice, but I will not hear them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그뿐만 아니라 나도 분노로 행하겠습니다. 내 눈이 아끼지 않을 것이며, 내가 긍휼을 베풀지도 않겠습니다. 그들이 큰 소리로 내 귀에 부르짖더라도 내가 그들을 듣지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '내 눈이 아끼지 않을 것이다'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  english_pob_choice: And I also / as for me
  chosen_korean: 그뿐만 아니라 나도
  alternatives_korean:
  - 나도 또한
  - 그리고 나도
  lexicon: HALOT
  rationale: 부가와 강조를 함께 지닌 표현이므로, 단순한 접속보다 앞말에 이어지는 강한 추가성을 살린 한국어로 옮겼습니다.
- source_word: אֶעֱשֶׂה בְחֵמָה
  english_pob_choice: will act in wrath
  chosen_korean: 분노로 행하겠습니다
  alternatives_korean:
  - 분노 가운데 행하겠습니다
  - 진노로 행동하겠습니다
  lexicon: HALOT
  rationale: עשה는 여기서 단순한 '하다'보다 निर्ण정적 행위를 가리키므로 '행하다'로, בְחֵמָה는 직접적으로 '분노로' 옮겨 감정의 강도를 살렸습니다.
- source_word: לֹא תָחוֹס עֵינִי וְלֹא אֶחְמֹל
  english_pob_choice: my eye will not spare, nor will I have compassion
  chosen_korean: 내 눈이 아끼지 않을 것이며, 내가 긍휼을 베풀지도 않겠습니다
  alternatives_korean:
  - 내 눈이 불쌍히 여기지 않을 것이며, 내가 가엾게 여기지도 않겠습니다
  - 내 눈이 용서하지 않을 것이며, 내가 불쌍히 여기지도 않겠습니다
  lexicon: HALOT
  rationale: '''눈이 아끼다''라는 히브리어 관용을 직접 살리되, 뒤의 חמל은 같은 뜻으로 반복하지 않고 ''긍휼을 베풀다''로 옮겨 평행법의 뉘앙스를 구분했습니다.'
- source_word: וְקָרְאוּ בְאָזְנַי קוֹל גָּדוֹל
  english_pob_choice: Though they cry in my ears with a loud voice
  chosen_korean: 그들이 큰 소리로 내 귀에 부르짖더라도
  alternatives_korean:
  - 그들이 큰 음성으로 내 귀에 외치더라도
  - 그들이 큰 소리로 내 귀에 울부짖더라도
  lexicon: HALOT
  rationale: קול גדול은 단순한 발화가 아니라 절박한 외침이므로 '부르짖다'로, בְאָזְנַי의 구체적 이미지는 '내 귀에'로 유지했습니다.
- source_word: וְלֹא אֶשְׁמַע אוֹתָם
  english_pob_choice: I will not hear them
  chosen_korean: 내가 그들을 듣지 않겠습니다
  alternatives_korean:
  - 내가 그들의 말을 듣지 않겠습니다
  - 내가 그들에게 귀를 기울이지 않겠습니다
  lexicon: HALOT
  rationale: שמע의 기본 의미를 따라 '듣다'로 옮기되, 문맥상 응답 거부를 자연스럽게 드러내도록 했습니다.
theological_decisions:
- issue: 신적 심판 언어의 강도를 약화하지 않기
  chosen_reading: '''분노로 행하겠습니다'', ''내 눈이 아끼지 않을 것이며'', ''긍휼을 베풀지도 않겠습니다''를 직접적인 신적 발화로 유지했습니다.'
  alternative_readings:
  - '''엄중히 벌하겠습니다''처럼 추상화하기'
  - '''자비를 보이지 않겠습니다''처럼 완화하기'
  rationale: 본문은 하나님의 심판을 감정과 신체 비유를 포함한 직설적 언어로 제시하므로, 이를 도덕적·법정적 표현으로 바꾸지 않고 그대로 보존하는 편이 원문 의미를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 마지막 절의 양보적 관계를 드러내기
  chosen_reading: '''그들이 ... 부르짖더라도 내가 그들을 듣지 않겠습니다''로 옮겼습니다.'
  alternative_readings:
  - '''그들이 ... 부르짖고, 나는 듣지 않겠습니다'''
  - '''그들이 ... 부르짖지만 나는 듣지 않겠습니다'''
  rationale: 히브리어의 단순 접속은 문맥상 양보·대조 관계를 형성하므로, 한국어에서는 '...더라도'로 밝혀 읽기와 의미를 함께 살렸습니다.
  doctrine_reference: Translation philosophy §6
