  to: 그리고 나도 분노 가운데 행하겠습니다. 내 눈은 아끼지 않겠고, 나도 긍휼히 여기지 않겠습니다. 그들이 큰 소리로 내 귀에 부르짖어도, 나는 그들의 부르짖음을 듣지 않겠습니다.
  rationale: 원문의 첨가적 강조와 심판 선언의 직설성을 유지하면서, 현대 한국어의 자연스러운 문장 구조로 다듬었습니다. 양보·대조 관계는 ‘부르짖어도’로 명시하되, 원문이 말하는 듣지 않음의 강도를 약화하지 않았습니다. 현 각주는 본문 이해에 기여하지 않고 영어 감사 기록의 대안 각주와도 대응하지 않아 삭제했습니다.
