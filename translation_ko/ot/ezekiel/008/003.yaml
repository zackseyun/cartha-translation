revisions:
- from: 그가 손처럼 보이는 것을 내밀어 내 머리카락 한 다발로 나를 붙들었으며, 영이 나를 땅과 하늘 사이로 들어 올려 하나님의 환상 가운데 예루살렘으로 데려가서, 북쪽을 향한 안쪽 문 어귀 곧 그곳에 시기하게 하는 질투의 형상이 놓여 있는 곳에 이르게 하였습니다.[a][b]
  to: 그가 손처럼 보이는 것[a]을 내밀어 내 머리카락 한 다발을 붙잡았습니다. 영[b]이 나를 땅과 하늘 사이로 들어 올려 하나님의 환상들 가운데 예루살렘으로 데려갔습니다. 곧 북쪽을 향한 안쪽 문 어귀로 데려갔는데, 그곳에는 질투를 일으키는 질투의 형상이 놓인 자리가 있었습니다.
  rationale: 수정문은 환상 속 이송의 순서를 유지하고, 복수형 ‘환상들’을 반영했습니다. מוֹשַׁב은 ‘형상이 놓인 자리’로 옮겨 장소를 뜻하는 명사성을 살렸습니다. ‘질투를 일으키는 질투’는 다소 반복적이지만, 원문의 קִנְאָה와 הַמַּקְנֶה의 의도적인 어근 반복을 보존하며 교리적 해석을 덧붙이지 않습니다.
  reviewer_model: gpt-5.6-terra
