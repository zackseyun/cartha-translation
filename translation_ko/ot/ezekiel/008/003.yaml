id: EZK.8.3
reference: Ezekiel 8:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֙ תַּבְנִ֣ית יָ֔ד וַ/יִּקָּחֵ֖/נִי בְּ/צִיצִ֣ת רֹאשִׁ֑/י וַ/תִּשָּׂ֣א אֹתִ֣/י ר֣וּחַ בֵּֽין הָ/אָ֣רֶץ וּ/בֵ֣ין הַ/שָּׁמַ֡יִם וַ/תָּבֵא֩ אֹתִ֨/י יְרוּשָׁלְַ֜מָ/ה בְּ/מַרְא֣וֹת אֱלֹהִ֗ים אֶל פֶּ֜תַח שַׁ֤עַר הַ/פְּנִימִית֙ הַ/פּוֹנֶ֣ה צָפ֔וֹנָ/ה אֲשֶׁר שָׁ֣ם מוֹשַׁ֔ב סֵ֖מֶל הַ/קִּנְאָ֥ה הַ/מַּקְנֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/003.yaml
  text: Then he stretched out what looked like a hand and took me by a lock of my head[a], and the Spirit lifted me up between the earth and the heavens and brought me to Jerusalem in visions of God, to the entrance of the inner gate that faces north[b], where the seat of the image of jealousy that provokes jealousy was.
  footnotes:
  - marker: a
    text: Or 'the likeness of a hand.'
    reason: lexical_alternative
  - marker: b
    text: Or 'wind' or 'a spirit' for 'the Spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 손처럼 보이는 것을 내밀어 내 머리카락 한 다발로 나를 붙들었으며, 영이 나를 땅과 하늘 사이로 들어 올려 하나님의 환상 가운데 예루살렘으로 데려가서, 북쪽을 향한 안쪽 문 어귀 곧 그곳에 시기하게 하는 질투의 형상이 놓여 있는 곳에 이르게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘손의 형상’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바람’ 또는 ‘어떤 영’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית יָד
  english_pob_choice: what looked like a hand
  chosen_korean: 손처럼 보이는 것
  alternatives_korean:
  - 손의 형상
  - 손의 모양
  lexicon: HALOT
  rationale: תַּבְנִית은 실제 손이라기보다 손의 형상·모양을 가리키므로, 환상 문맥에 맞게 ‘손처럼 보이는 것’으로 자연스럽게 살렸습니다.
- source_word: בְּצִיצִת רֹאשִׁי
  english_pob_choice: by a lock of my head
  chosen_korean: 내 머리카락 한 다발로
  alternatives_korean:
  - 내 머리카락 한 뭉치로
  - 내 머리의 다발로
  lexicon: HALOT
  rationale: צִיצִת은 머리카락의 한 다발·한 줌을 뜻하므로, 현대 한국어에서 구체적 이미지를 유지하는 ‘머리카락 한 다발’이 가장 자연스럽습니다.
- source_word: בְּמַרְאוֹת אֱלֹהִים
  english_pob_choice: in visions of God
  chosen_korean: 하나님의 환상 가운데
  alternatives_korean:
  - 하나님의 환상들 가운데
  - 하나님으로부터 받은 환상 가운데
  lexicon: HALOT
  rationale: 복수형 마르오트와 예언자적 환상 문맥을 살려 ‘환상 가운데’로 옮기고, ‘하나님의’는 출처와 성격을 함께 열어 두는 방식으로 유지했습니다.
- source_word: הַפּוֹנֶה צָפוֹנָה
  english_pob_choice: that faces north
  chosen_korean: 북쪽을 향한
  alternatives_korean:
  - 북쪽으로 향한
  - 북쪽을 바라보는
  lexicon: HALOT
  rationale: 지시적 방향 표현은 한국어에서 ‘북쪽을 향한’이 가장 간결하며, 문 구조를 과도하게 풀지 않고도 방향성을 분명히 드러냅니다.
- source_word: סֵמֶל הַקִּנְאָה הַמַּקְנֶה
  english_pob_choice: the seat of the image of jealousy that provokes jealousy
  chosen_korean: 시기하게 하는 질투의 형상
  alternatives_korean:
  - 질투를 일으키는 질투의 형상
  - 질투를 부추기는 형상
  lexicon: HALOT
  rationale: קִנְאָה와 מַקְנֶה의 말장난을 살리기 위해 두 번역어를 모두 ‘질투’ 계열로 유지했습니다. ‘시기하게 하는’은 동사의 작용을, ‘질투의 형상’은 명사구를 받아 원문의 반복 효과를 드러냅니다.
theological_decisions:
- issue: רוּחַ를 ‘영’으로 둘지 ‘성령’으로 둘지
  chosen_reading: 영
  alternative_readings:
  - 성령
  - 바람
  - 어떤 영
  rationale: 여기서는 יחזקאל의 환상적 이송 장면이지만, רוּחַ 자체는 문맥상 여전히 바람/영/하나님의 영의 범위를 가질 수 있으므로, 원문의 의미 범위를 좁히지 않기 위해 ‘영’으로 두었습니다.
  doctrine_reference: 의미 범위를 보존하여 본문이 열어 두는 신학적 긴장을 유지함.
