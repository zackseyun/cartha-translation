- from: 그가 내게 말씀하셨습니다[a]. “너는 보았느냐, 인자야? 유다 집이 여기에서 저지른 그 가증한 일들을 행한 것만으로는 너무 사소하단 말이냐? 그들이 또 온 땅에 폭력을 채우고 다시 나를 격노하게 하였느니라. 보라[b], 그들이 가지를 자기 코에 대고 있습니다.”
  to: 그가 내게 말씀하셨습니다. “인자야, 네가 보았습니까? 유다 집이 여기에서 저지른 이 가증한 일들을 행하는 것이 그들에게 그토록 사소한 일입니까? 그들은 이 땅을 폭력으로 가득 채우고 다시 나를 격노하게 합니다. 보십시오, 그들이 가지를 자기들의 코에 대고 있습니다[a][b].”
  rationale: 합쇼체를 일관되게 적용하고, הָאָרֶץ를 문맥에 맞게 ‘이 땅’으로 조정했습니다. 마지막 절의 난해함과 ‘그들의 코’라는 마소라 본문 읽기는 보존했습니다. 두 각주는 설명 대상인 마지막 표현에 직접 연결되도록 앵커 위치를 바로잡았습니다.
