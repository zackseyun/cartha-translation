  text: וַ/יֹּ֣אמֶר אֵלַ/י֮ הֲ/רָאִ֣יתָ בֶן אָדָם֒ הֲ/נָקֵל֙ לְ/בֵ֣ית יְהוּדָ֔ה מֵ/עֲשׂ֕וֹת אֶת הַ/תּוֹעֵב֖וֹת אֲשֶׁ֣ר עָֽשׂוּ פֹ֑ה כִּֽי מָלְא֨וּ אֶת הָ/אָ֜רֶץ חָמָ֗ס וַ/יָּשֻׁ֨בוּ֙ לְ/הַכְעִיסֵ֔/נִי וְ/הִנָּ֛/ם שֹׁלְחִ֥ים אֶת הַ/זְּמוֹרָ֖ה אֶל אַפָּֽ/ם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/017.yaml
  text: Then he said to me[a], “Have you seen, son of man? Is it too trivial a thing for the house of Judah to do the abominations that they have done here, that they should also fill the land with violence and turn again to provoke me? And behold[b], they are putting the branch to their nose.”
  footnotes:
  - marker: a
    text: Or, following some ancient witnesses, “they are putting the branch to my nose.” The Hebrew text reads “their nose.”
    reason: textual_variant
  - marker: b
    text: The phrase “putting the branch to their nose” is obscure and may refer to an idolatrous ritual gesture.
    reason: cultural_note
translation:
  language: ko
  text: 그가 내게 말씀하셨습니다. “인자야, 네가 보았습니까? 유다 집이 여기에서 저지른 이 가증한 일들을 행하는 것이 그들에게 그토록 사소한 일입니까? 그들은 이 땅을 폭력으로 가득 채우고 다시 나를 격노하게 합니다. 보십시오, 그들이 가지를 자기들의 코에 대고 있습니다[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 고대 증언을 따르면 “그들이 가지를 내 코에 대고 있습니다”로 읽을 수 있습니다. 히브리어 본문은 “그들의 코”라고 읽습니다.
    reason: textual_variant
  - marker: b
    text: “가지를 코에 대다”라는 표현은 난해하며, 우상 숭배의 의례적 몸짓을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인간
  lexicon: HALOT
  rationale: 에스겔서의 예언자 호칭으로 굳어진 대응어를 유지해 반복되는 관용구의 문학적 기능을 살렸습니다.
- source_word: הֲנָקֵל
  english_pob_choice: Is it too trivial a thing
  chosen_korean: 너무 사소하단 말이냐
  alternatives_korean:
  - 너무 가벼운 일이냐
  - 사소한 일이냐
  lexicon: HALOT
  rationale: קל의 ‘가벼움/사소함’이라는 뉘앙스를 살리면서, 하나님께서 유다의 행위를 가볍게 여긴다는 비판적 수사를 자연스러운 한국어 의문문으로 옮겼습니다.
- source_word: מָלְאוּ אֶת הָאָרֶץ חָמָס
  english_pob_choice: fill the land with violence
  chosen_korean: 온 땅에 폭력을 채우고
  alternatives_korean:
  - 땅을 폭력으로 가득 채우고
  - 땅에 불의를 채우고
  lexicon: HALOT
  rationale: חָמָס를 예언서의 심판 문맥에서 직접적인 ‘폭력’으로 옮겨, 도덕적 악과 사회적 폭력의 강도를 분명히 했습니다.
- source_word: וְהִנָּם
  english_pob_choice: And behold
  chosen_korean: 보라
  alternatives_korean:
  - 보시오
  - 자, 보라
  lexicon: HALOT
  rationale: 갑작스럽게 시선을 끄는 감탄형을 한국어의 문어체 명령형으로 압축해 장면 전환의 힘을 유지했습니다.
- source_word: שֹׁלְחִים אֶת הַזְּמוֹרָה אֶל אַפָּם
  english_pob_choice: they are putting the branch to their nose
  chosen_korean: 그들이 가지를 자기 코에 대고 있습니다
  alternatives_korean:
  - 그들이 가지를 자기 코로 보내고 있습니다
  - 그들이 가지를 그들의 코에 대고 있습니다
  lexicon: HALOT
  rationale: 문맥이 불분명한 관용적 동작을 과도하게 해석하지 않고, שׁלח의 물리적 동작을 ‘대다’로 옮겨 원문의 기이함을 보존했습니다.
theological_decisions:
- issue: 마지막 행위의 난해한 표현과 가능한 사본 차이
  chosen_reading: 본문을 그대로 따라 ‘자기 코에’로 옮기고, 해석을 본문 밖으로 밀어내지 않았습니다.
  alternative_readings:
  - ‘내 코에’로 읽는 고대 증거에 따른 해석
  - 구체적 우상 숭배 의례로 단정하는 해석
  rationale: 마소라 본문과 일부 고대 증언 사이의 긴장을 해소하지 않고 남겨 두는 편이, POB의 원문 중심 원칙에 더 부합합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
