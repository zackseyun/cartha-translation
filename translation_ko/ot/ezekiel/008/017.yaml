  source_fidelity: 마소라 본문의 수사 의문, 유다 집의 가증한 행위, 땅에 가득한 폭력, 하나님을 다시 격노하게 하는 행위, 그리고 난해한 마지막 몸짓을 전반적으로 충실히 반영합니다. 그러나 ‘온 땅’은 הָאָרֶץ의 문맥상 ‘그 땅/이 땅’보다 넓게 들릴 수 있으며, 앞선 두 의문문은 요청된 합쇼체와 일치하지 않습니다. 또한 본문비평 각주는 해당 난해한 마지막 절에 붙여야 합니다.
  naturalness: ‘너는 보았느냐’와 ‘사소하단 말이냐’는 해라체이므로 현대 공식 존대체(합쇼체) 번역의 문체 기준에 맞지 않습니다. ‘보았습니까’, ‘사소한 일입니까’로 고치면 자연스럽고 일관됩니다. ‘땅을 폭력으로 가득 채우고’가 ‘온 땅에 폭력을 채우고’보다 자연스럽습니다.
  terminology: ‘인자’, ‘유다 집’, ‘가증한 일들’, ‘폭력’, ‘격노하게 하다’는 적절합니다. 마지막의 ‘가지’는 זְמוֹרָה의 넓은 의미를 보존하며, 의례의 구체적 의미를 본문에 덧붙이지 않은 점도 적절합니다.
