revisions:
- from: 그가 제게 말씀하셨습니다. 「인자야, 부디 네 눈을 들어 북쪽을 향하여 보아라」 하셨습니다. 그래서 제가 눈을 들어 북쪽을 보니, 보라, 제단 문 북쪽에 그 질투의 형상이 입구에 있었습니다.[a]
