language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם שָׂא נָ֥א עֵינֶ֖י/ךָ דֶּ֣רֶךְ צָפ֑וֹנָ/ה וָ/אֶשָּׂ֤א עֵינַ/י֙ דֶּ֣רֶךְ צָפ֔וֹנָ/ה וְ/הִנֵּ֤ה מִ/צָּפוֹן֙ לְ/שַׁ֣עַר הַ/מִּזְבֵּ֔חַ סֵ֛מֶל הַ/קִּנְאָ֥ה הַ/זֶּ֖ה בַּ/בִּאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/005.yaml
  text: Then he said to me[a], “Son of man, please lift up your eyes toward the north.” So I lifted up my eyes toward the north, and behold, north of the gate of the altar was this image of jealousy at the entrance.
  footnotes:
  - marker: a
    text: Or “this idol of jealousy,” or “this image that provokes jealousy.” The Hebrew phrase is compact and may denote either the image’s character or its effect in provoking divine jealousy.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. 「인자야, 부디 네 눈을 들어 북쪽을 향하여 보아라」 하셨습니다. 그래서 제가 눈을 들어 북쪽을 보니, 보라, 제단 문 북쪽에 그 질투의 형상이 입구에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “질투를 일으키는 형상”, 혹은 “질투의 우상”. 히브리어는 압축된 표현이라, 형상의 성격을 가리키는지 또는 질투를 유발하는 효과를 가리키는지 모두 가능하다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서의 반복적인 호칭을 살리기 위해 직역적·문학적 대응인 ‘인자야’를 사용했습니다. ‘사람아’는 의미는 분명하지만 고유한 호칭의 울림을 약화시킵니다.
- source_word: שָׂא נָא עֵינֶיךָ
  english_pob_choice: please lift up your eyes
  chosen_korean: 부디 네 눈을 들어
  alternatives_korean:
  - 눈을 들어 보아
  - 눈을 들어라
  lexicon: HALOT
  rationale: ‘눈을 들어’는 히브리어 관용구를 그대로 살리고, נָא의 간청성을 ‘부디’로 옮겼습니다. ‘보아라’는 결과 동작을 자연스럽게 보완합니다.
- source_word: דֶּרֶךְ צָפוֹנָה
  english_pob_choice: toward the north
  chosen_korean: 북쪽을 향하여
  alternatives_korean:
  - 북쪽으로
  - 북쪽을 향해
  lexicon: HALOT
  rationale: 방향 지시를 현대 한국어로 자연스럽게 옮기되, 단순 목적지가 아니라 시선의 방향임을 살리기 위해 ‘향하여’를 택했습니다.
- source_word: סֵמֶל הַקִּנְאָה
  english_pob_choice: image of jealousy
  chosen_korean: 그 질투의 형상
  alternatives_korean:
  - 질투의 형상
  - 질투를 일으키는 형상
  - 우상
  lexicon: HALOT
  rationale: 히브리어의 압축된 명사구를 따라 ‘형상’으로 옮기고, הַקִּנְאָה의 속격을 살려 ‘질투의’로 처리했습니다. 본문이 명시하지 않은 해석어 ‘우상’은 본문에는 넣지 않았습니다.
- source_word: בַּבִּאָה
  english_pob_choice: at the entrance
  chosen_korean: 입구에
  alternatives_korean:
  - 들어가는 곳에
  - 출입구에
  lexicon: HALOT
  rationale: 공간 위치를 간결하게 전달하는 표준어로 옮겼습니다. 문맥상 ‘입구’가 가장 자연스럽고 과도한 해설을 피합니다.
theological_decisions:
- issue: סֵמֶל הַקִּנְאָה의 해석 강도
  chosen_reading: 본문에는 ‘그 질투의 형상’으로 두고, idolatrous 성격은 문맥이 드러내게 했습니다.
  alternative_readings:
  - 질투를 일으키는 형상
  - 우상
  rationale: 히브리어 표현 자체는 짧은 명사구이며, 본문이 직접적으로 동사절을 덧붙이지 않습니다. 따라서 해석을 본문에 과하게 넣지 않고, 문맥이 우상숭배와 야훼의 질투를 보여 주도록 유지했습니다.
  doctrine_reference: 번역 원칙 §3, §5
