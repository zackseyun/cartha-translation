  rationale: 직접 인용을 현대 합쇼체로 매끄럽게 정리하고, 히브리어 지시사 ‘이’를 반영했습니다. ‘제단의 문’으로 구성 관계를 명확히 하되, 정확한 건축적 지시 대상에 관한 해석은 추가하지 않았습니다. ‘질투의 형상’ 및 각주를 유지하여 명사구의 의미상 여지를 보존했습니다.
