translation:
  language: ko
  text: 그래서 내가 안으로 들어가서 보니, 보라, 기어다니는 것과 가증한 짐승의 온갖 형상과 이스라엘 집의 모든 우상들이 사방의 벽에 새겨져 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִּלּוּלֵי는 ‘우상들’이라는 뜻이지만, 매우 경멸적인 표현이므로 ‘똥우상들’ 또는 ‘더러운 우상들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָ/אָבוֹא
  english_pob_choice: So I went in
  chosen_korean: 그래서 내가 안으로 들어가서
  alternatives_korean:
  - 그리고 내가 들어가서
  - 그리하여 내가 들어가서
  lexicon: HALOT
  rationale: 문맥상 성전 안쪽으로 들어가는 동작을 자연스럽게 살리기 위해 ‘안으로 들어가서’로 옮겼고, ‘그래서’로 서술의 진행성을 나타냈습니다.
- source_word: וָֽ/אֶרְאֶה
  english_pob_choice: looked
  chosen_korean: 보니
  alternatives_korean:
  - 보고
  - 살펴보니
  lexicon: HALOT
  rationale: ‘보라’로 이어지는 시각적 제시를 살리면서, 반복을 줄이기 위해 관찰의 결과를 나타내는 ‘보니’를 선택했습니다.
- source_word: כָל תַּבְנִית
  english_pob_choice: every form of
  chosen_korean: 온갖 형상
  alternatives_korean:
  - 모든 형상
  - 각종 형상
  lexicon: HALOT
  rationale: 벽에 새겨진 우상적 이미지들의 집합을 자연스럽게 드러내기 위해 ‘형상’을 택했고, ‘온갖’으로 범주의 포괄성을 살렸습니다.
- source_word: שֶׁקֶץ
  english_pob_choice: detestable beast
  chosen_korean: 가증한 짐승
  alternatives_korean:
  - 혐오스러운 짐승
  - 더러운 짐승
  lexicon: HALOT
  rationale: שֶׁקֶץ의 혐오·가증의 뉘앙스를 유지하되, 본문 구조상 앞의 ‘짐승’을 수식하는 말로 한국어 어순에 맞게 ‘가증한 짐승’으로 옮겼습니다.
- source_word: גִּלּוּלֵי בֵּית יִשְׂרָאֵל
  english_pob_choice: all the idols of the house of Israel
  chosen_korean: 이스라엘 집의 모든 우상들
  alternatives_korean:
  - 이스라엘 집의 모든 우상
  - 이스라엘 집의 모든 우상 숭배상
  lexicon: HALOT
  rationale: גִּלּוּלֵי의 경멸적 뉘앙스를 본문에서는 표준적인 ‘우상’으로 두되, 문맥상 집합성을 살리기 위해 복수형을 유지했습니다.
- source_word: מְחֻקֶּה
  english_pob_choice: were engraved
  chosen_korean: 새겨져 있었습니다
  alternatives_korean:
  - 새겨져 있었습니다
  - 새겨져 있었습니다
  lexicon: HALOT
  rationale: 완료된 상태를 보여 주는 수동 분사로서, 벽에 이미 새겨져 있는 정황을 한국어 진행상태로 자연스럽게 나타냈습니다.
theological_decisions:
- issue: Ezekiel의 우상 비난 어휘 강도
  chosen_reading: 본문에는 ‘우상들’로 옮기되, ‘가증한 짐승’과 문맥 전체로 혐오의 강도를 드러내게 했습니다.
  alternative_readings:
  - ‘똥우상들’처럼 경멸을 직접 드러내는 번역
  - ‘더러운 우상들’
  rationale: 히브리어 גִּלּוּלִים의 조롱적 뉘앙스는 중요하지만, 본문에서 과도하게 노골적인 속어를 쓰기보다 문맥과 어휘 선택으로 공적 번역의 읽기성을 유지하는 편이 적절합니다.
  doctrine_reference: 번역 철학 §5, §6
