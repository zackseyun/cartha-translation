  source_fidelity: 히브리어의 서술 진행(들어가다→보다), 형상 목록, 벽에 새겨진 상태는 대체로 충실합니다. 다만 ‘보니, 보라’는 וָאֶרְאֶה וְהִנֵּה를 한국어에서 중복되고 부자연스럽게 재현합니다. ‘살펴보니’는 관찰과 생생한 제시의 기능을 자연스럽게 함께 전달합니다. 또한 סָבִיב סָבִיב는 ‘사방의 벽’보다 ‘벽 사방에’가 단수인 הַקִּיר 및 반복에 더 가깝습니다.
  naturalness: 현대 공적 문체에서는 ‘보니, 보라’의 연쇄가 어색합니다. ‘내가 안으로 들어가 살펴보니’로 고치고, 목록은 쉼표와 ‘그리고’로 연결하면 합쇼체 서술로 자연스럽습니다.
  terminology: ‘이스라엘 집’, ‘우상’, ‘가증한 짐승’, ‘형상’은 문맥과 예언서의 공적 문체에 적절합니다. גִּלּוּלֵי의 경멸성은 각주에서 밝혀야 하나, ‘똥우상들’은 현대 한국어 공적 성경 문체에 지나치게 속되고 그 정확한 어원적 등가를 단정하는 인상을 줄 수 있습니다. 경멸적 용법 자체를 설명하고 ‘더럽고 혐오스러운 우상들’을 가능한 번역으로 제시하는 편이 안전합니다.
