  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/שִּׁשִּׁ֗ית בַּ/שִּׁשִּׁי֙ בַּ/חֲמִשָּׁ֣ה לַ/חֹ֔דֶשׁ אֲנִי֙ יוֹשֵׁ֣ב בְּ/בֵיתִ֔/י וְ/זִקְנֵ֥י יְהוּדָ֖ה יוֹשְׁבִ֣ים לְ/פָנָ֑/י וַ/תִּפֹּ֤ל עָלַ/י֙ שָׁ֔ם יַ֖ד אֲדֹנָ֥/י יְהֹוִֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/001.yaml
  text: And it happened in the sixth year[a], in the sixth month, on the fifth day of the month, as I was sitting in my house and the elders of Judah were sitting before me[b], that the hand of the Lord GOD fell upon me there.
  footnotes:
  - marker: a
    text: 'Hebrew: ''there the hand of the Lord GOD fell upon me.'' Some translations render ''there'' as ''then,'' but the Hebrew adverb is literally locative.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Lord Yahweh'; Hebrew אֲדֹנָי יְהוִה, a title-plus-divine-name combination traditionally rendered 'Lord GOD.'
    reason: alternative_reading
translation:
  language: ko
  text: 제육 년, 육월 초닷새 날에 내가 집에 앉아 있고 유다의 장로들이 내 앞에 앉아 있을 때, 주 야훼의 손이 거기서 내 위에 임했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שָׁם은 문자적으로 ‘거기서’입니다. 일부 번역은 이를 ‘그때’로 풀지만, 본문은 장소를 가리키는 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 아도나이 יְהוִה는 직함과 신명 결합입니다. 한국어에서는 이를 ‘주 야훼’로 옮겨 두 요소를 함께 보존했습니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 제육 년, 육월 초닷새 날에
  alternatives_korean:
  - 그리고 일어났습니다
  - 그 일이 있었습니다
  lexicon: HALOT
  rationale: 서두의 wayyiqtol은 새 장면을 여는 서술 표지이므로, 한국어에서는 자연스러운 날짜 도입으로 처리해 문장 흐름을 살렸습니다.
- source_word: אֲנִי יוֹשֵׁב בְּבֵיתִי וְזִקְנֵי יְהוּדָה יוֹשְׁבִים לְפָנַי
  english_pob_choice: as I was sitting in my house and the elders of Judah were sitting before me
  chosen_korean: 내가 집에 앉아 있고 유다의 장로들이 내 앞에 앉아 있을 때
  alternatives_korean:
  - 내가 집에 앉아 있었고 유다의 장로들이 내 앞에 앉아 있을 때
  - 내가 집에 앉아 있는 동안 유다의 장로들이 내 앞에 앉아 있을 때
  lexicon: HALOT
  rationale: 두 분사구문은 동시에 진행되는 배경 상황을 나타내므로, ‘-아 있고 / -아 있을 때’로 연결해 지속적 상황과 동시성을 살렸습니다.
- source_word: שָׁם
  english_pob_choice: there
  chosen_korean: 거기서
  alternatives_korean:
  - 그때
  - 그곳에서
  lexicon: HALOT
  rationale: 히브리어 שָׁם은 기본적으로 장소 부사이므로, EN POB의 주석 취지에 따라 시간 부사로 완화하지 않고 ‘거기서’로 옮겼습니다.
- source_word: יְהוָה in אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 문맥상 אֲדֹנָי + יְהוִה의 결합이므로, 직함과 고유명을 함께 드러내되 프로젝트 기본값에 따라 야훼를 유지했습니다.
theological_decisions:
- issue: 아도나이-여호와 결합 호칭의 한국어 처리
  chosen_reading: ‘주 야훼’로 직역하여 직함과 언약 이름을 함께 보존했습니다.
  alternative_readings:
  - ‘주 하나님’으로 통합
  - 전통 번역처럼 ‘주 여호와’로 처리
  rationale: 히브리어는 단순한 일반 호칭이 아니라 직함과 신명 결합을 사용합니다. 이를 한국어에서 하나로 흡수하면 원문이 주는 구별이 약해지므로, 야훼를 유지해 문구의 구조를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
