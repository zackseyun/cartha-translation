revisions:
- from: 그러자 내가 보니, 불의 모습과 같은 형상이 있었는데, 그의 허리로부터 아래로는 불이었고, 그의 허리로부터 위로는 빛나는 광채의 모습, 곧 번쩍이는 호박 같았습니다.[a]
  to: 그러자 내가 보니, 불처럼 보이는 한 형상이 있었습니다. 그 허리처럼 보이는 곳에서 아래로는 불이었고, 그 허리에서 위로는 빛나는 금속과 같은 광채의 모습이었습니다.[a]
  rationale: 반복되는 ‘보임/같음’의 언어를 보존하여 환시 대상의 정체를 단정하지 않았습니다. 아래쪽 묘사에 있는 ‘허리의 외양’ 한정을 반영했고, 의미가 불확실한 חַשְׁמַלָה는 ‘호박’으로 고정하지 않고 본문과 각주에서 그 불확실성을 보존했습니다.
