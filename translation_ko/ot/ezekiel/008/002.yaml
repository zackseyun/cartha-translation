  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶרְאֶ֗ה וְ/הִנֵּ֤ה דְמוּת֙ כְּ/מַרְאֵה אֵ֔שׁ מִ/מַּרְאֵ֥ה מָתְנָ֛י/ו וּ/לְ/מַ֖טָּה אֵ֑שׁ וּ/מִ/מָּתְנָ֣י/ו וּ/לְ/מַ֔עְלָ/ה כְּ/מַרְאֵה זֹ֖הַר כְּ/עֵ֥ין הַ/חַשְׁמַֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/002.yaml
  text: 'Then I looked[a], and behold, a form with the appearance of fire: from what appeared to be his waist and downward, fire; and from his waist and upward, like the appearance of brightness, like gleaming amber.'
  footnotes:
  - marker: a
    text: Or 'like the look of electrum' or 'like glowing metal'; the Hebrew term is rare and denotes a brilliant shining substance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 내가 보니, 불의 모습과 같은 형상이 있었는데, 그의 허리로부터 아래로는 불이었고, 그의 허리로부터 위로는 빛나는 광채의 모습, 곧 번쩍이는 호박 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다른 번역 가능성으로는 ‘전기금속(electrum) 같은 모습’ 또는 ‘빛나는 금속 같은 모습’이 있습니다. 히브리어는 드물고, 눈부시게 빛나는 물질을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  english_pob_choice: Then I looked
  chosen_korean: 그러자 내가 보니
  alternatives_korean:
  - 내가 보았고
  - 그때 내가 보니
  lexicon: HALOT
  rationale: 시각적 환시의 전개를 자연스럽게 살리면서, 첫인칭 관찰 보고의 흐름을 현대 한국어로 옮겼습니다.
- source_word: דְמוּת / כְּמַרְאֵה
  english_pob_choice: a form with the appearance of fire
  chosen_korean: 불의 모습과 같은 형상
  alternatives_korean:
  - 불의 ظاهر을 가진 형상
  - 불처럼 보이는 형상
  lexicon: HALOT
  rationale: דְמוּת와 מַרְאֶה가 반복하는 ‘닮음/보임’의 층위를 살려, 실체를 단정하지 않고 환시적 유사성을 유지했습니다.
- source_word: מָתְנָיו / וּלְמַטָּה
  english_pob_choice: from what appeared to be his waist ... and downward
  chosen_korean: 그의 허리로부터 아래로
  alternatives_korean:
  - 그의 허리에서 아래로
  - 허리 아래로
  lexicon: HALOT
  rationale: 본문의 공간 대비를 분명히 하면서, ‘허리’가 현대 독자에게 가장 자연스러운 해부학적 대응어이므로 이를 택했습니다.
- source_word: מָתְנָיו / וּלְמַעְלָה
  english_pob_choice: and from his waist and upward
  chosen_korean: 그의 허리로부터 위로
  alternatives_korean:
  - 그의 허리에서 위로
  - 허리 위로
  lexicon: HALOT
  rationale: 앞절과 대구를 이루는 상하 대비를 그대로 살렸습니다.
- source_word: זֹהַר
  english_pob_choice: brightness
  chosen_korean: 빛나는 광채
  alternatives_korean:
  - 광휘
  - 밝은 광채
  lexicon: HALOT
  rationale: זֹהַר의 ‘빛남/광휘’를 자연스럽게 풀어, 단순한 밝기보다 눈부신 발광성을 드러냈습니다.
- source_word: חַשְׁמַלָה
  english_pob_choice: gleaming amber
  chosen_korean: 번쩍이는 호박
  alternatives_korean:
  - 번쩍이는 전기석
  - 번쩍이는 금속광
  lexicon: HALOT
  rationale: 희귀어 חַשְׁמַל의 전통적 이해를 반영하면서도, 한국어로는 시각적 찬란함이 살아나도록 ‘호박’을 택했고, 문자적 후보들은 과도한 기술어가 되어 본문의 환시성을 약화시킬 수 있습니다.
theological_decisions:
- issue: 환시 대상의 존재론적 단정 여부
  chosen_reading: ‘~와 같은’, ‘~의 모습’ 같은 비교 표현을 유지해, 본문이 말하는 것을 시각적 유사성 수준에서 번역했습니다.
  alternative_readings:
  - 대상을 곧바로 불이나 금속광으로 단정하는 번역
  rationale: 에스겔은 반복적으로 ‘보이는 것/같은 것’의 어휘를 사용해 환시의 신비와 제한성을 유지합니다. 번역도 그 긴장을 보존하는 편이 본문의 의도에 더 가깝습니다.
  doctrine_reference: 번역 철학 §3 (신학적 긴장을 해소하지 않고 보존)
