revisions:
- from: 그가 제게 말씀하셨습니다. 「인자야, 부디 성벽을 뚫어라。」 그래서 제가 성벽을 뚫으니, 보십시오, 한 개의 입구가 있었습니다.[a]
  to: 그가 제게 말씀하셨습니다. 「인자야, 부디 벽을 뚫어라.[a]」 그래서 제가 벽을 뚫으니, 보십시오, 입구 하나가 있었습니다.
  rationale: 원문의 일반적인 ‘벽’ 의미를 보존하도록 ‘성벽’을 ‘벽’으로 고쳤습니다. פֶּתַח אֶחָד의 단수·수량 뉘앙스는 ‘입구 하나’로 유지했습니다. חתר의 어휘 각주는 해당 동사에 연결하고, 본문과 구별되는 대안을 제시하도록 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:38:14Z'
