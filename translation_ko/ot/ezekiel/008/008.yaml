source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֖ם חֲתָר נָ֣א בַ/קִּ֑יר וָ/אֶחְתֹּ֣ר בַּ/קִּ֔יר וְ/הִנֵּ֖ה פֶּ֥תַח אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/008.yaml
  text: Then he said to me[a], “Son of man, please dig into the wall.” So I dug into the wall, and behold, there was an opening.
  footnotes:
  - marker: a
    text: Or “break through the wall.” The Hebrew verb can mean to dig through or breach a wall.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. 「인자야, 부디 성벽을 뚫어라。」 그래서 제가 성벽을 뚫으니, 보십시오, 한 개의 입구가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “성벽을 뚫어라.” 히브리어 동사는 벽을 파고 들어가거나 돌파하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서의 반복적 신적 호칭을 살리기 위해 직역적 호칭을 유지했습니다. 한국어에서는 관용적으로 정착한 ‘인자야’가 본문의 문체와 대응을 가장 잘 보존합니다.
- source_word: חֲתָר
  english_pob_choice: dig
  chosen_korean: 뚫어라
  alternatives_korean:
  - 파라
  - 파고 들어가라
  - 부수어라
  lexicon: HALOT
  rationale: 동사가 벽에 구멍을 내어 들어가는 행위를 가리키므로, 자연스러운 한국어로는 ‘뚫어라’가 본문의 실제 동작과 결과를 함께 드러냅니다.
- source_word: נָא
  english_pob_choice: please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 이제
  lexicon: HALOT
  rationale: 명령을 누그러뜨리는 화용적 기능을 살리기 위해 공손하면서도 간절한 뉘앙스의 ‘부디’를 택했습니다.
- source_word: פֶּתַח אֶחָד
  english_pob_choice: one opening
  chosen_korean: 한 개의 입구
  alternatives_korean:
  - 한 입구
  - 하나의 문
  - 한 개의 구멍
  lexicon: HALOT
  rationale: פֶּתַח은 단순한 ‘열린 곳/출입구’의 뜻이어서 ‘입구’가 가장 무난합니다. אֶחָד를 반영해 수량을 드러내되, 한국어 문맥상 ‘한 개의’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 에스겔의 ‘인자’ 호칭 보존
  chosen_reading: ‘인자야’로 옮겨, 선지자 에스겔에게 주어진 반복적 호칭임을 드러냈습니다.
  alternative_readings:
  - 사람아
  - 인간아
  rationale: 이 표현은 메시아 칭호가 아니라 에스겔에 대한 소명적 호칭이므로, 본문 반복성과 문학적 기능을 살리는 번역이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy, point 4; Contested terms: אָדָם'
