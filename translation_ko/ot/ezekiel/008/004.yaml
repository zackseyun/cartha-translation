  lexicon: HALOT
  rationale: בִּקְעָה는 골짜기나 넓은 평야를 가리킬 수 있으나, 이 구절의 회고적 연결을 자연스럽게 살리는 기본어로 ‘골짜기’를 택했습니다.
theological_decisions:
- issue: ‘하나님의 영광’의 현현을 설명할지 여부
  chosen_reading: 본문이 말하는 대로, 추가 설명 없이 이스라엘의 하나님의 영광이 ‘있었다’는 진술과 이전에 본 모습과의 비교를 그대로 살렸습니다.
  alternative_readings:
  - 하나님의 임재를 나타내는 빛남으로 풀어 쓰기
  - 신적 현현으로 해설을 덧붙이기
  rationale: 본문은 현현의 성격을 비교로 드러내지만, 그 의미를 해설적으로 완결하지 않습니다. 따라서 본문의 긴장과 직접성을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
