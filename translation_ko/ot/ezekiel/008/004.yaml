language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִ֨נֵּה שָׁ֔ם כְּב֖וֹד אֱלֹהֵ֣י יִשְׂרָאֵ֑ל כַּ/מַּרְאֶ֕ה אֲשֶׁ֥ר רָאִ֖יתִי בַּ/בִּקְעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/004.yaml
  text: And behold[a], there was the glory of the God of Israel, like the appearance that I had seen in the valley.
  footnotes:
  - marker: a
    text: Or 'on the plain.' The Hebrew בִּקְעָה can refer to a broad valley or plain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 보십시오, 거기에 이스라엘의 하나님의 영광이 있었는데, 그것은 내가 골짜기에서 보았던 모습과 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘골짜기’로 옮긴 히브리어 בִּקְעָה는 넓은 평야를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הִנֵּה
  english_pob_choice: And behold
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 그리고 보라
  - 그리고 보게
  lexicon: HALOT
  rationale: 예언서의 갑작스러운 시각적 전환과 강조를 살리기 위해 감탄·지시의 뉘앙스를 유지했습니다.
- source_word: כְּבוֹד
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 광채
  - 영화
  lexicon: HALOT
  rationale: 하나님의 현현 맥락에서 כבוד의 표준 대응인 ‘영광’을 사용해, 눈에 보이는 광휘와 신학적 무게를 함께 보존했습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 하나님이신 하나님
  - 이스라엘 하나님
  lexicon: HALOT
  rationale: 소유·관계 구조를 직접 반영하면서도 한국어에서 가장 자연스러운 관형 구문으로 옮겼습니다.
- source_word: בִּקְעָה
  english_pob_choice: in the valley
  chosen_korean: 골짜기에서
  alternatives_korean:
  - 평야에서
  - 넓은 들판에서
  lexicon: HALOT
  rationale: בִּקְעָה는 골짜기나 넓은 평야를 가리킬 수 있으나, 이 구절의 회고적 연결을 자연스럽게 살리는 기본어로 ‘골짜기’를 택했습니다.
theological_decisions:
- issue: ‘하나님의 영광’의 현현을 설명할지 여부
  chosen_reading: 본문이 말하는 대로, 추가 설명 없이 이스라엘의 하나님의 영광이 ‘있었다’는 진술과 이전에 본 모습과의 비교를 그대로 살렸습니다.
  alternative_readings:
  - 하나님의 임재를 나타내는 빛남으로 풀어 쓰기
  - 신적 현현으로 해설을 덧붙이기
  rationale: 본문은 현현의 성격을 비교로 드러내지만, 그 의미를 해설적으로 완결하지 않습니다. 따라서 본문의 긴장과 직접성을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
