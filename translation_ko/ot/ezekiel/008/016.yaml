source:
  edition: WLC
  text: וַ/יָּבֵ֣א אֹתִ֗/י אֶל חֲצַ֣ר בֵּית יְהוָה֮ הַ/פְּנִימִית֒ וְ/הִנֵּה פֶ֜תַח הֵיכַ֣ל יְהוָ֗ה בֵּ֤ין הָֽ/אוּלָם֙ וּ/בֵ֣ין הַ/מִּזְבֵּ֔חַ כְּ/עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה אִ֑ישׁ אֲחֹ֨רֵי/הֶ֜ם אֶל הֵיכַ֤ל יְהוָה֙ וּ/פְנֵי/הֶ֣ם קֵ֔דְמָ/ה וְ/הֵ֛מָּה מִשְׁתַּחֲוִיתֶ֥ם קֵ֖דְמָ/ה לַ/שָּֽׁמֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/016.yaml
  text: Then he brought me into the inner court of the house of Yahweh[a], and behold, at the entrance of the temple of Yahweh, between the porch and the altar, were about twenty-five men, with their backs toward the temple of Yahweh and their faces toward the east[b]; and they were bowing down toward the east to the sun.
  footnotes:
  - marker: a
    text: Or 'their backs to the temple of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb denotes prostrating oneself in worship; thus, 'they were worshiping the sun' is a possible fuller sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그가 저를 야훼의 집 안뜰로 데려갔습니다. 보십시오, 야훼의 성전 입구 곧 현관과 제단 사이에 약 스물다섯 명의 사람들이 있었는데, 그들은 등을 야훼의 성전 쪽으로 돌리고 얼굴은 동쪽을 향한 채, 동쪽을 향해 해를 향하여 엎드려 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘성전 입구’라고만 적지만, 앞뒤 문맥상 성전 건물의 출입구를 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어 동사는 예배하듯 엎드리는 동작을 뜻할 수 있으므로, ‘해를 숭배하다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 프로젝트 기본값(יהוה/YHWH)
  rationale: 본문의 고유신명은 POB 기본 원칙에 따라 ‘야훼’로 옮겨, титул ‘주’로 바꾸지 않고 히브리어 고유명 자체를 드러냈습니다.
- source_word: חֲצַר בֵּית יְהוָה הַפְּנִימִית
  english_pob_choice: the inner court of the house of Yahweh
  chosen_korean: 야훼의 집 안뜰
  alternatives_korean:
  - 야훼의 집 안쪽 뜰
  - 야훼의 성전 안뜰
  lexicon: HALOT
  rationale: חֲצַר는 ‘뜰/마당’이고 הַפְּנִימִית는 ‘안쪽/안뜰’의 뜻이므로, 자연스러운 현대 한국어로 ‘안뜰’을 택해 내부 공간의 대비를 살렸습니다.
- source_word: פֶּתַח הֵיכַל יְהוָה
  english_pob_choice: the entrance of the temple of Yahweh
  chosen_korean: 야훼의 성전 입구
  alternatives_korean:
  - 야훼의 성전 문
  - 야훼의 전각 입구
  lexicon: HALOT
  rationale: פֶּתַח는 단순한 ‘문’보다 ‘입구/출입구’가 더 정확하고, הֵיכָל은 여기서 성전 건물을 가리키므로 ‘성전 입구’로 옮겼습니다.
- source_word: בֵּין הָאוּלָם וּבֵין הַמִּזְבֵּחַ
  english_pob_choice: between the porch and the altar
  chosen_korean: 현관과 제단 사이
  alternatives_korean:
  - 현관과 제단 사이
  - 포치와 제단 사이
  - 전실과 제단 사이
  lexicon: HALOT
  rationale: אוּלָם은 성전의 전실/현관을 가리키므로, 현대 독자가 바로 이해할 수 있는 ‘현관’을 사용해 공간 배치를 선명하게 했습니다.
- source_word: מִשְׁתַּחֲוִיתֶם קֵדְמָה לַשָּׁמֶשׁ
  english_pob_choice: they were bowing down toward the east to the sun
  chosen_korean: 동쪽을 향해 해를 향하여 엎드려 있었습니다
  alternatives_korean:
  - 해를 향해 엎드려 있었습니다
  - 동쪽을 향해 해를 숭배하고 있었습니다
  lexicon: HALOT
  rationale: מִשְׁתַּחֲוִיתֶם의 핵심은 몸을 낮추어 엎드리는 동작이므로, ‘엎드려’로 구체화하되 ‘해’가 우상숭배의 대상임을 문맥으로 드러냈습니다.
theological_decisions:
- issue: מִשְׁתַּחֲוִיתֶם의 번역 범위
  chosen_reading: ‘엎드려 있었습니다’로 물리적 자세를 중심에 두고, 대상은 ‘해’와 방향 표현으로 함께 드러냅니다.
  alternative_readings:
  - ‘해를 숭배하고 있었습니다’
  - ‘해에 경배하고 있었습니다’
  rationale: 히브리어는 경배의 행위를 포함하지만, 본문은 먼저 자세와 방향을 묘사하므로 과도한 해석어보다 행위의 가시적 측면을 본문대로 살리는 것이 더 정확합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
