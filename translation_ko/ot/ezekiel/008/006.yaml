  naturalness: 초안은 현대 공식 높임말(합쇼체) 요청과 달리 ‘보느냐’, ‘될 것이다’를 사용하며, 대시 뒤의 ‘나를 … 하려는 것이다’가 문법적으로 매끄럽지 않습니다. 질문과 미래 진술을 합쇼체로 통일하고, 수식 관계를 자연스럽게 재구성했습니다.
  terminology: ‘인자야’, ‘이스라엘 집’, ‘가증한 일들’, ‘성소’는 에스겔의 관용적 표현과 핵심 어휘를 적절히 보존합니다. ‘내 성소에서 멀리 떠나게 하는’은 לְרָחֳקָה מֵעַל מִקְדָּשִׁי의 해석상 논쟁 가능성을 각주로 남기면서 본문의 선택된 독법을 반영합니다.
