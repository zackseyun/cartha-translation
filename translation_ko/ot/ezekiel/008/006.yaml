  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם הֲ/רֹאֶ֥ה אַתָּ֖ה מ/הם עֹשִׂ֑ים תּוֹעֵב֨וֹת גְּדֹל֜וֹת אֲשֶׁ֥ר בֵּֽית יִשְׂרָאֵ֣ל עֹשִׂ֣ים פֹּ֗ה לְ/רָֽחֳקָה֙ מֵ/עַ֣ל מִקְדָּשִׁ֔/י וְ/עוֹד֙ תָּשׁ֣וּב תִּרְאֶ֔ה תּוֹעֵב֖וֹת גְּדֹלֽוֹת־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/006.yaml
  text: And he said to me[a], “Son of man, do you see what they are doing, the great abominations that the house of Israel is doing here[b], to drive me far from my sanctuary? Yet you will see even greater abominations.”
  footnotes:
  - marker: a
    text: Or, “to make me go far from my sanctuary,” or possibly, “far from my sanctuary.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew repeats “great abominations”; English renders the second occurrence as “greater abominations” to reflect the sense of escalation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 내게 말씀하셨습니다. 「인자야, 그들이 하는 것을 보느냐? 이스라엘 집이 여기에서 행하는 그 큰 가증한 일들 — 나를 내 성소에서 멀리 떠나게 하려는 것이다. 그러나 너는 더 큰 가증한 일들을 또 보게 될 것이다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나를 내 성소에서 멀리 떠나게 하려는,” 혹은 “내 성소에서 멀리.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “큰 가증한 일들”을 반복합니다. 한국어 본문은 뒤의 뜻을 점층적으로 드러내기 위해 “더 큰 가증한 일들”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인간아
  - 인생아
  lexicon: HALOT
  rationale: 에스겔에서 반복되는 예언자 호칭을 살리기 위해 직역에 가까운 전통적 형식인 ‘인자’로 두고, 한국어 호격을 붙여 직접 호칭을 드러냈습니다.
- source_word: הֲרֹאֶה אַתָּה
  english_pob_choice: do you see
  chosen_korean: 보느냐
  alternatives_korean:
  - 보고 있느냐
  - 보았느냐
  lexicon: HALOT
  rationale: 히브리어의 현재적 질문을 자연스러운 한국어로 옮겨, 단순한 시각 확인이 아니라 예언적 환상 인지를 묻는 뉘앙스를 유지했습니다.
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  english_pob_choice: great abominations
  chosen_korean: 그 큰 가증한 일들
  alternatives_korean:
  - 큰 가증한 일들
  - 큰 역겨운 일들
  - 큰 혐오스러운 일들
  lexicon: HALOT
  rationale: ‘תּוֹעֵבָה’의 강한 언약적·예배적 거부감을 살리기 위해 ‘가증한 일들’로 옮겼고, 반복된 형용사는 문맥상 강도를 드러내는 ‘그 큰’으로 처리했습니다.
- source_word: לְרָחֳקָה מֵעַל מִקְדָּשִׁי
  english_pob_choice: to drive me far from my sanctuary
  chosen_korean: 나를 내 성소에서 멀리 떠나게 하려는 것이다
  alternatives_korean:
  - 나를 내 성소에서 멀리 몰아내려는 것이다
  - 나를 내 성소에서 멀어지게 하려는 것이다
  - 내 성소로부터 나를 멀리하게 하려는 것이다
  lexicon: HALOT
  rationale: 원문의 사역적 거리두기 의미를 살리되, 하나님의 성소를 향한 소유격을 자연스럽게 표현하기 위해 ‘떠나게 하다’를 선택했습니다.
- source_word: מִקְדָּשִׁי
  english_pob_choice: my sanctuary
  chosen_korean: 내 성소
  alternatives_korean:
  - 내 성전
  - 내 거룩한 처소
  lexicon: HALOT
  rationale: מִקְדָּשׁ은 ‘성전’보다 넓은 ‘성소’가 더 정확하며, 소유격은 한국어 관용에 따라 ‘내’로 옮겼습니다.
theological_decisions:
- issue: לְרָחֳקָה מֵעַל מִקְדָּשִׁי의 주체와 방향
  chosen_reading: 그들의 행위가 하나님을 성소에서 멀리 떠나게 하는 결과를 낳는다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 그들의 행위가 성소로부터 사람들을 멀어지게 한다
  - 그들의 행위가 성소에서 멀어지도록 한다
  rationale: 히브리어 동사와 ‘내 성소’의 1인칭 소유격은 단순한 장소 설명보다, 가증한 행위가 야훼의 임재와 성소 관계를 훼손해 떠나게 만드는 효과를 가리키는 것으로 읽는 편이 문맥에 맞습니다.
  doctrine_reference: Translation philosophy §1, §3
