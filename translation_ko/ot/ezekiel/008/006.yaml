  rationale: 합쇼체를 일관되게 적용하고, 첫 질문 안에서 ‘가증한 일들’과 ‘나를 성소에서 멀리 떠나게 함’의 관계가 분명해지도록 문장을 재구성했습니다. ‘더 큰’은 히브리어의 반복 자체를 비교급으로 바꾸었다기보다, וְעוֹד 및 문맥상의 점층을 자연스러운 한국어로 드러내는 번역입니다. 대안적 구문 이해는 각주에 보존했습니다.
