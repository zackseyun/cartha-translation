id: EZK.8.14
reference: Ezekiel 8:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֵ֣א אֹתִ֗/י אֶל פֶּ֨תַח֙ שַׁ֣עַר בֵּית יְהוָ֔ה אֲשֶׁ֖ר אֶל הַ/צָּפ֑וֹנָ/ה וְ/הִנֵּה שָׁם֙ הַ/נָּשִׁ֣ים יֹֽשְׁב֔וֹת מְבַכּ֖וֹת אֶת הַ/תַּמּֽוּז־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/014.yaml
  text: Then he brought me to the entrance of the gate of the house of Yahweh that faces north[a], and behold, there the women were sitting[b], weeping for Tammuz.
  footnotes:
  - marker: a
    text: Tammuz was a Mesopotamian deity associated with seasonal mourning rites; the women are depicted participating in that lament.
    reason: cultural_note
  - marker: b
    text: Or 'mourning for Tammuz.' The Hebrew verb literally means 'weeping.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 그가 저를 야훼의 집 북쪽을 향한 문 어귀로 데려갔습니다[a]. 보십시오, 거기에 여자들이 앉아 있었고[b], 담무스를 위해 울고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 담무스는 계절적 애곡 의례와 연결된 메소포타미아 신으로 이해됩니다. 이 장면은 여자들이 그 애곡에 참여하고 있음을 보여 줍니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘담무스를 위해 애도하고 있었습니다’. 히브리어 동사는 문자적으로 ‘울다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי
  english_pob_choice: Then he brought me
  chosen_korean: 그가 저를 데려갔습니다
  alternatives_korean:
  - 그가 저를 이끌었습니다
  - 그가 저를 데리고 왔습니다
  lexicon: HALOT
  rationale: 히필 형태의 ‘가게 하다/데려오다’의 인과적 의미를 살리면서, 한국어에서는 자연스러운 서술로 ‘데려갔습니다’를 택했습니다.
- source_word: פֶּתַח שַׁעַר
  english_pob_choice: the entrance of the gate
  chosen_korean: 문 어귀
  alternatives_korean:
  - 문 입구
  - 성문 입구
  lexicon: HALOT
  rationale: פֶּתַח과 שַׁעַר의 결합은 단순한 ‘문’보다 ‘어귀/입구’로 드러내는 것이 원문 구조를 더 잘 보존합니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: 직역상 ‘집’이 원문에 가장 가깝고, 전통적 ‘성전’은 해석이 더 들어갑니다. יְהוָה는 본문 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보니
  lexicon: HALOT
  rationale: 예언서의 시각적 전환을 살리면서 현대 한국어에서 자연스럽고 장면을 환기하는 감탄형으로 옮겼습니다.
- source_word: הַנָּשִׁים יֹשְׁבוֹת
  english_pob_choice: the women were sitting
  chosen_korean: 여자들이 앉아 있었습니다
  alternatives_korean:
  - 그 여자들이 앉아 있었습니다
  - 여인들이 앉아 있었습니다
  lexicon: HALOT
  rationale: 복수 여성 주어와 지속적 자세를 드러내기 위해 ‘앉아 있었습니다’를 사용했습니다. ‘여자들’은 본문의 단순한 지시를 직접 살립니다.
- source_word: מְבַכּוֹת
  english_pob_choice: weeping for
  chosen_korean: 울고 있었습니다
  alternatives_korean:
  - 애도하고 있었습니다
  - 통곡하고 있었습니다
  lexicon: HALOT
  rationale: 동사의 기본 의미인 ‘울다’를 우선하고, 우상 숭배 맥락의 애곡을 본문 그대로 드러내기 위해 ‘담무스를 위해’라는 목적어 구조를 유지했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신적 고유명사 יְהוָה를 사용하므로, 번역 전통의 대체 호칭보다 고유명을 드러내는 ‘야훼’를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 담무스의 의미 처리
  chosen_reading: 고유명사 ‘담무스’로 옮기고 본문에는 설명을 덧붙이지 않음
  alternative_readings:
  - 담무스 신을 위해
  - 담무스를 애도하며
  rationale: 히브리어는 고유명을 직접 제시하며, 본문 의미만으로도 그들이 담무스를 향한 애곡에 참여하고 있음을 충분히 보여 주므로 설명적 확장을 본문에 넣지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: Translate titles; transliterate names'
