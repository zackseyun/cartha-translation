id: EZK.8.12
reference: Ezekiel 8:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ/י֮ הֲ/רָאִ֣יתָ בֶן אָדָם֒ אֲשֶׁ֨ר זִקְנֵ֤י בֵֽית יִשְׂרָאֵל֙ עֹשִׂ֣ים בַּ/חֹ֔שֶׁךְ אִ֖ישׁ בְּ/חַדְרֵ֣י מַשְׂכִּית֑/וֹ כִּ֣י אֹמְרִ֗ים אֵ֤ין יְהוָה֙ רֹאֶ֣ה אֹתָ֔/נוּ עָזַ֥ב יְהוָ֖ה אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/012.yaml
  text: Then he said to me[a], “Have you seen, son of man, what the elders of the house of Israel are doing in the darkness, each man in the rooms of his carved image? For they are saying, ‘Yahweh does not see us[c][b]; Yahweh has abandoned the land.’”
  footnotes:
  - marker: a
    text: Or “in the chambers of his imagery” or “in the rooms of his image.” The Hebrew term can refer to figured or carved representations, likely idolatrous images.
    reason: lexical_alternative
  - marker: b
    text: Or “the LORD has forsaken the land.”
    reason: lexical_alternative
  - marker: c
    text: “The land” may mean the land of Israel/Judah; some translate “the earth.”
    reason: alternative_reading
translation:
  language: ko
  text: 그분께서 제게 말씀하셨습니다. “인자야, 이스라엘 집의 장로들이 어둠 속에서 각자 자기 형상의 방들에서 무엇을 하고 있는지 보았느냐?[a] 그들은 ‘야훼께서 우리를 보지 않으신다. 야훼께서 그 땅을 버리셨다’라고 말하고 있습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 형상의 방들’은 히브리어 표현을 옮긴 것입니다. 해당 말은 ‘형상’, ‘그림’, 또는 ‘새긴 표현’을 가리킬 수 있으며, ‘자기 형상이 있는 방들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 땅’은 이스라엘/유다의 땅을 가리킬 가능성이 크지만, ‘땅’ 또는 ‘세상’으로 이해하는 번역도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔에서 반복되는 신적 호칭을 관용적으로 살리면서, 한국어에서는 직접 호칭형인 ‘인자야’가 가장 자연스럽고 문학적 효과도 유지합니다.
- source_word: זִקְנֵי בֵית יִשְׂרָאֵל
  english_pob_choice: the elders of the house of Israel
  chosen_korean: 이스라엘 집의 장로들
  alternatives_korean:
  - 이스라엘의 장로들
  - 이스라엘 가문의 장로들
  lexicon: HALOT
  rationale: ‘집/가문’의 의미를 지닌 בֵית יִשְׂרָאֵל을 그대로 반영해 에스겔 특유의 표현을 보존했습니다.
- source_word: בְּחַדְרֵי מַשְׂכִּיתוֹ
  english_pob_choice: in the rooms of his carved image
  chosen_korean: 자기 우상 방의 안쪽 방들에서
  alternatives_korean:
  - 자기 조각상 방에서
  - 자기 형상 방들에서
  - 자기 우상의 방들에서
  lexicon: HALOT
  rationale: מַשְׂכִּית의 의미 범위가 ‘형상/새긴 우상’까지 가질 수 있으므로, 우상성은 분명히 하고 ‘방/안쪽 방들’의 중첩된 공간감을 살렸습니다.
- source_word: אֵין יְהוָה רֹאֶה אֹתָנוּ
  english_pob_choice: Yahweh does not see us
  chosen_korean: 야훼께서 우리를 보지 않으신다
  alternatives_korean:
  - 야훼께서 우리를 보지 못하신다
  - 주님은 우리를 보지 않으신다
  lexicon: HALOT
  rationale: 부정 분사구의 현재적 진술을 자연스러운 한국어로 옮겼고, 본문에 나온 신명 표기를 그대로 반영했습니다.
- source_word: עָזַב יְהוָה אֶת הָאָרֶץ
  english_pob_choice: Yahweh has abandoned the land
  chosen_korean: 야훼께서 이 땅을 버리셨다
  alternatives_korean:
  - 야훼께서 이 땅을 떠나셨다
  - 야훼께서 땅을 버리셨다
  lexicon: HALOT
  rationale: עָזַב의 강한 단절·포기 뉘앙스를 살려 ‘버리셨다’로 옮기고, הָאָרֶץ는 문맥상 이스라엘의 땅으로 이해되는 ‘이 땅’으로 구체화했습니다.
theological_decisions:
- issue: YHWH divine name in direct quotation
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮기고, 인용문 안에서도 그대로 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 번역본의 기준 용어를 따르면서, 인용된 비난 발언 속에서도 신명 자체를 가리지 않아 원문의 날선 신학적 함의를 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Scope of הָאָרֶץ
  chosen_reading: ‘이 땅’
  alternative_readings:
  - ‘땅’
  - ‘세상’
  rationale: 에스겔의 예언 맥락에서는 추상적 ‘세상’보다 언약적·지리적 의미의 ‘이 땅’이 더 적합합니다.
  doctrine_reference: Ezekiel contextual usage of הָאָרֶץ
