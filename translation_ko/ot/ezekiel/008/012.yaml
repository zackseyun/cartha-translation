    rationale: ‘우상 방의 안쪽 방들’은 חדרים의 ‘방들’과 별개로 ‘안쪽’을 추가하며, מַשְׂכִּית의 ‘형상/그림/새긴 표현’이라는 범위를 ‘우상’으로 확정합니다. 본문은 우상숭배 맥락이지만 해당 명사의 정확한 뉘앙스는 논의됩니다.
