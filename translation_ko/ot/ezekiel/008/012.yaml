  source_fidelity: 핵심 문장 구조와 신명 표기는 대체로 원문에 충실합니다. 그러나 בְּחַדְרֵי מַשְׂכִּיתוֹ는 ‘각자 자기 우상 방의 안쪽 방들’로 옮길 경우 ‘방’이 중복되고, ‘우상’ 및 ‘안쪽’이 본문보다 지나치게 확정됩니다. ‘형상의 방들’로 옮기고 각주에서 가능한 의미 범위를 밝혀 원문의 어휘적 불확실성을 보존하는 편이 안전합니다.
  naturalness: ‘자기 우상 방의 안쪽 방들’은 현대 표준어에서 부자연스럽고 의미 관계가 불분명합니다. ‘각자 자기 형상의 방들에서’는 문맥상 자연스럽고 원문의 분배적 단수와 복수 ‘방들’을 유지합니다. ‘그분께서 제게’는 신적 발화자의 높임을 자연스럽게 반영합니다.
  terminology: ‘인자야’, ‘이스라엘 집’, ‘야훼’는 일관되고 적절합니다. הָאָרֶץ는 본문에서 특정 지역으로 단정하지 않고 ‘그 땅’으로 옮긴 뒤 각주에서 이스라엘/유다 땅일 가능성과 ‘땅/세상’이라는 대안을 제시하는 것이 좋습니다. 감찰·심판이라는 신학적 해설 각주는 원문의 명시적 내용 이상이므로 제외합니다.
