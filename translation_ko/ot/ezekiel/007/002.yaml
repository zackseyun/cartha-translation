translation:
  language: ko
  text: 너, 인자야, 주 야훼께서 이스라엘 땅에 이렇게 말씀하십니다. “끝이다! 끝이 땅의 사방에 닥쳤습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 한 땅의 끝자락들을 가리킬 수도 있고, 더 넓은 문맥에서는 온 땅 또는 온 세상을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인간
  lexicon: HALOT
  rationale: 에스겔의 대표적 호칭을 한국어 성경 전통과 직접 대응시키면서도, 메시아 호칭과 구별되는 예언자적 호출로 유지합니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 두 칭호가 겹친 구조를 보존하면서, 프로젝트 기본값에 따라 יְהוָה를 야훼로 옮겼습니다. 한국어에서 ‘주 야훼’는 두 요소를 모두 드러냅니다.
- source_word: קֵץ / הַקֵּץ
  english_pob_choice: An end! The end
  chosen_korean: 끝났다! 끝이 왔습니다
  alternatives_korean:
  - 끝입니다! 끝이 왔습니다
  - 마침내 끝입니다
  lexicon: HALOT
  rationale: 첫 번째 קֵץ의 돌발적 외침과 두 번째 정관사형의 선언적 반복을 살리기 위해, 짧은 감탄과 완료형 선언으로 구분했습니다.
- source_word: אַרְבַּעַת כַּנְפוֹת הָאָרֶץ
  english_pob_choice: the four corners of the land
  chosen_korean: 땅의 사방
  alternatives_korean:
  - 땅의 네 모퉁이
  - 온 땅의 네 귀퉁이
  lexicon: HALOT
  rationale: ‘네 날개’의 관용적 뜻인 ‘모퉁이/사방’을 살리되, 문맥상 이스라엘 땅 전체를 가리키는 범위를 간결하게 드러냈습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본값에 따라 언약 이름을 ‘야훼’로 유지하여, 일반 칭호인 ‘주’와 구별했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: ‘땅’과 ‘세상’의 범위
  chosen_reading: 이스라엘 땅 / 땅의 사방
  alternative_readings:
  - 이스라엘의 나라 / 세상의 사방
  - 땅의 네 모퉁이
  rationale: 본문이 ‘이스라엘 땅’에 말하는 문맥이므로, अंतिम 구절도 그 땅 전체를 가리키는 것으로 읽어 지역적 심판의 초점을 유지했습니다.
  doctrine_reference: 'english_theological_decisions: Scope of הָאָרֶץ in the final clause'
