  source_fidelity: 히브리어의 반복적이고 돌발적인 선언(קֵץ, 이어서 הַקֵּץ בָּא)과 심판이 ‘땅의 사방’에 미친다는 뜻은 대체로 반영되었습니다. 다만 첫 קֵץ는 ‘끝났다’라는 완료 서술보다 명사적 감탄인 ‘끝이다!’로 옮기는 것이 더 충실합니다. 또한 וְאַתָּה의 호격은 인용 부호로 ‘너’를 분리하기보다 자연스럽게 ‘너, 인자야’로 두는 편이 좋습니다.
  naturalness: ‘너, 인자야’와 ‘끝이다!’는 현대 표준 한국어의 엄숙한 예언자적 문맥에서 자연스럽습니다. ‘땅의 사방에 닥쳤습니다’도 원문의 전치사구를 자연스럽게 살립니다.
  terminology: ‘인자’는 에스겔의 반복되는 호칭으로 적절하며, ‘주 야훼’는 אֲדֹנָי יְהוִה의 두 요소와 프로젝트의 ‘야훼’ 표기를 보존합니다. ‘땅의 사방’은 אַרְבַּעַת כַּנְפוֹת הָאָרֶץ의 관용적 표현을 잘 반영합니다.
