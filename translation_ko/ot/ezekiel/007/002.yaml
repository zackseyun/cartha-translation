base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/002.yaml
  text: 'And you[a], son of man, thus says the Lord GOD to the land of Israel: An end! The end has come upon the four corners of the land.'
  footnotes:
  - marker: a
    text: Or 'the four corners of the earth.' The Hebrew idiom can refer either to the extremities of a land or, in broader contexts, the whole earth.
