reference: Ezekiel 7:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/נְתַתִּ֤י/ו בְּ/יַֽד הַ/זָּרִים֙ לָ/בַ֔ז וּ/לְ/רִשְׁעֵ֥י הָ/אָ֖רֶץ לְ/שָׁלָ֑ל ו/חלל/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/021.yaml
  text: And I will give it into the hand of foreigners for plunder[a], and to the wicked of the earth for spoil[b], and they will profane it.
  footnotes:
  - marker: a
    text: Or 'the wicked of the land.' The Hebrew word can mean either 'earth' or 'land' depending on context.
    reason: alternative_reading
  - marker: b
    text: Or 'defile it' or 'desecrate it.' The verb carries the sense of profaning what is holy.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그것을 외국인들의 손에 넘겨 그들의 약탈물이 되게 하고, 땅의 악인들에게 넘겨 그들의 노획물이 되게 하겠으며, 그들이 그것을 속되게 할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅의 악인들’. 히브리어 ‘땅’은 온 세상을 가리킬 수도 있고 특정 지역이나 나라의 땅을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘더럽힐 것입니다’ 또는 ‘모독할 것입니다’. 이 동사는 거룩한 것을 속되게 하거나 훼손한다는 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּיו
  english_pob_choice: And I will give it
  chosen_korean: 내가 그것을 … 주며
  alternatives_korean:
  - 내가 그것을 넘기며
  - 내가 그것을 건네며
  lexicon: HALOT
  rationale: נתן의 1인칭 선언형을 한국어에서 가장 직접적으로 살려 ‘내가 그것을’로 시작하고, 앞뒤 병렬구조에 맞게 ‘주다’를 사용했습니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: 손에 넘겨
  alternatives_korean:
  - 손에 맡겨
  - 권세 아래에 넘겨
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리되 한국어에서는 ‘손에’보다 동작성이 드러나는 ‘넘겨’로 옮겨, 통제권 이전의 의미를 유지했습니다.
- source_word: הַזָּרִים
  english_pob_choice: foreigners
  chosen_korean: 외국인들
  alternatives_korean:
  - 이방인들
  - 낯선 자들
  lexicon: HALOT
  rationale: 문맥상 침략과 약탈의 주체인 외부 집단이므로, 한국어에서 가장 분명한 대응어인 ‘외국인들’을 택했습니다.
- source_word: וּלְרִשְׁעֵי הָאָרֶץ
  english_pob_choice: and to the wicked of the earth
  chosen_korean: 땅의 악인들에게
  alternatives_korean:
  - 땅의 악한 자들에게
  - 땅의 악인들에게
  lexicon: HALOT
  rationale: רִשְׁעֵי를 ‘악인들’로, הָאָרֶץ를 ‘땅’으로 옮겨 POB의 ‘earth/land’의 양의성을 한국어에서도 너무 좁히지 않으면서 자연스럽게 유지했습니다.
- source_word: לְשָׁלָל
  english_pob_choice: for spoil
  chosen_korean: 노획물로
  alternatives_korean:
  - 전리품으로
  - 약탈물로
  lexicon: HALOT
  rationale: בַּז와 의미상 평행을 이루는 שָׁלָל을 군사적 약탈의 결과물인 ‘노획물’로 옮겨, 단순한 재산이 아니라 전쟁 약탈의 성격을 살렸습니다.
- source_word: וְחִלְּלוּהָ
  english_pob_choice: and they will profane it
  chosen_korean: 그들이 그것을 더럽힐 것입니다
  alternatives_korean:
  - 그들이 그것을 profane할 것입니다
  - 그들이 그것을 속되게 할 것입니다
  lexicon: HALOT
  rationale: חלל의 핵심인 ‘거룩한 것을 속되게 함’은 ‘더럽히다’가 가장 자연스럽게 전달하므로, 한국어 독자가 즉시 이해할 수 있도록 선택했습니다.
theological_decisions:
- issue: חלל의 신학적 무게
  chosen_reading: ‘더럽히다’로 옮기되, 거룩을 훼손하는 의미를 유지합니다.
  alternative_readings:
  - ‘속되게 하다’
  - ‘모독하다’
  rationale: 에스겔에서 심판은 단순한 오염이 아니라 거룩의 침해라는 신학적 구조를 가지므로, 일상어로 번역하되 신성모독의 함의를 잃지 않게 했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological weight without paraphrase.'
