  terminology: ‘주 하나님’은 אֲדֹנָי יְהוִה의 야훼 이름을 일반화합니다. 이 프로젝트의 명시된 신명 표기 방침과 일치하도록 ‘주 야훼’를 사용해야 합니다. ‘재앙’은 심판 문맥의 רָעָה에 적절합니다.
