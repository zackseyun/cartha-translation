base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/005.yaml
  text: 'Thus says the Lord GOD: A disaster[a], a unique disaster—behold, it is coming.'
  footnotes:
  - marker: a
    text: Or 'A disaster, one disaster'; the Hebrew repeats 'disaster' for emphasis, and 'one' may stress singularity or uniqueness.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 하나님께서 이렇게 말씀하십니다. 재앙이 하나, 독특한 재앙이 다가옵니다—보십시오, 그것이 오고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재앙, 하나의 재앙’. 히브리어는 ‘재앙’을 반복하여 강조하며, ‘하나’는 단일성이나 독특함을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 말씀하십니다
  - 이같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 선포문구의 격식을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 하나님 야훼
  lexicon: HALOT
  rationale: 아도나이와 야훼가 결합된 신적 칭호를 한국어에서 중복 없이 자연스럽게 전달하되, 기존 문맥상 하나님으로 읽히게 했습니다.
- source_word: רָעָה אַחַת רָעָה
  english_pob_choice: A disaster, a unique disaster
  chosen_korean: 재앙이 하나, 독특한 재앙
  alternatives_korean:
  - 한 재앙, 독특한 재앙
  - 재앙 하나, 하나뿐인 재앙
  lexicon: HALOT
  rationale: 반복된 רָעָה의 강조와 אַחַת의 수적 단독성을 함께 살리기 위해 ‘하나’와 ‘독특한’의 결합으로 옮겼습니다.
- source_word: הִנֵּה בָאָה
  english_pob_choice: behold, it is coming
  chosen_korean: 보십시오, 그것이 오고 있습니다
  alternatives_korean:
  - 보라, 그것이 오고 있습니다
  - 보십시오, 다가오고 있습니다
  lexicon: HALOT
  rationale: הִנֵּה의 긴급한 지시를 ‘보십시오’로, 임박성을 ‘오고 있습니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: יהוה를 한국어로 어떻게 표기할지
  chosen_reading: 야훼가 아니라 문맥상 ‘주 하나님’으로 풀어 옮겼습니다
  alternative_readings:
  - 야훼
  - 주 야훼
  rationale: 이 절은 아도나이와 결합된 칭호 공식이므로, 직역형 표기보다 한국어 예언문에서 기능적으로 읽히는 ‘주 하나님’이 오독을 줄입니다.
