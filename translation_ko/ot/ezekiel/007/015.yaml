id: EZK.7.15
reference: Ezekiel 7:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/חֶ֣רֶב בַּ/ח֔וּץ וְ/הַ/דֶּ֥בֶר וְ/הָ/רָעָ֖ב מִ/בָּ֑יִת אֲשֶׁ֤ר בַּ/שָּׂדֶה֙ בַּ/חֶ֣רֶב יָמ֔וּת וַ/אֲשֶׁ֣ר בָּ/עִ֔יר רָעָ֥ב וָ/דֶ֖בֶר יֹאכֲלֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/015.yaml
  text: The sword is outside[a], and pestilence and famine are inside. Whoever is in the field will die by the sword, and whoever is in the city[b], famine and pestilence will consume him.
  footnotes:
  - marker: a
    text: Or 'plague' for 'pestilence' (דֶּבֶר).
    reason: lexical_alternative
  - marker: b
    text: Literally 'famine and pestilence will eat him'; 'consume him' renders the Hebrew metaphor idiomatically.
    reason: lexical_alternative
translation:
  language: ko
  text: 칼은 밖에 있고, 전염병과 기근은 안에 있습니다. 들에 있는 자는 누구나 칼에 죽고, 성 안에 있는 자는 누구나 기근과 전염병이 그를 먹어 치울 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전염병’은 דֶּבֶר의 대표적 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘기근과 전염병이 그를 먹을 것이다’라고 말합니다. ‘먹어 치울 것입니다’는 이 은유를 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֶרֶב
  english_pob_choice: the sword
  chosen_korean: 칼
  alternatives_korean:
  - 칼날
  - 전쟁
  lexicon: HALOT
  rationale: 직역하면 ‘검/칼’이지만, 한국어에서는 예언적 심판의 상투적 이미지로서 ‘칼’이 자연스럽고 구체적입니다. ‘전쟁’으로 풀면 원문의 도구적 이미지를 약화시킵니다.
- source_word: בַּחוּץ
  english_pob_choice: outside
  chosen_korean: 밖에
  alternatives_korean:
  - 바깥에
  - 거리에서
  lexicon: HALOT
  rationale: 안쪽과의 대조를 살리는 가장 자연스러운 표준어 표현은 ‘밖에’입니다.
- source_word: הַדֶּבֶר
  english_pob_choice: pestilence
  chosen_korean: 전염병
  alternatives_korean:
  - 역병
  - 재앙
  lexicon: HALOT
  rationale: 예언서의 심판 용례에서 ‘דֶּבֶר’는 역병/전염병을 가리키므로, 현대 한국어에서는 의미가 분명한 ‘전염병’이 적절합니다. ‘역병’도 가능하지만 다소 고어적입니다.
- source_word: מִבָּיִת
  english_pob_choice: inside
  chosen_korean: 안에
  alternatives_korean:
  - 집 안에
  - 내부에
  lexicon: HALOT
  rationale: 원문은 ‘밖’과 대조되는 내부 영역을 말하므로, 문맥상 간결한 ‘안에’가 맞습니다. 영어 POB의 조정처럼 ‘집 안에’를 덧붙이면 원문이 말하지 않는 ‘집’이 들어갑니다.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  english_pob_choice: whoever is in the field
  chosen_korean: 들에 있는 자는 누구나
  alternatives_korean:
  - 밭에 있는 자는 누구나
  - 들판에 있는 자는 누구나
  lexicon: HALOT
  rationale: 분배적 관계절을 한국어에서 자연스럽게 옮기기 위해 ‘누구나’를 사용했습니다. ‘들’은 שָׂדֶה의 폭넓은 열린 들판 의미를 잘 살립니다.
- source_word: בַּחֶרֶב יָמוּת
  english_pob_choice: will die by the sword
  chosen_korean: 칼에 죽고
  alternatives_korean:
  - 칼로 죽고
  - 칼에 의해 죽고
  lexicon: HALOT
  rationale: 히브리어의 수단/원인 표현을 한국어 관용으로 옮기면 ‘칼에 죽다’가 가장 간결합니다. 영어 POB의 ‘will die by the sword’와도 의미가 일치합니다.
- source_word: רָעָב וָדֶבֶר ... יֹאכֲלֶנּוּ
  english_pob_choice: famine and pestilence will consume him
  chosen_korean: 기근과 전염병이 그를 먹어 치울 것입니다
  alternatives_korean:
  - 기근과 전염병이 그를 삼킬 것입니다
  - 기근과 전염병이 그를 먹을 것입니다
  lexicon: HALOT
  rationale: אָכַל의 ‘먹다’ 이미지를 살리되 한국어에서는 ‘먹어 치우다’가 파괴적 소비의 의인화를 자연스럽게 전달합니다. ‘삼키다’보다 원문의 식사/소비 은유가 더 직접적으로 보입니다.
theological_decisions:
- issue: 심판의 삼중 공식 보존
  chosen_reading: ‘칼… 전염병… 기근’의 구체적 심판 이미지를 축약하거나 일반화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 재난, 질병, 굶주림으로 의역
  rationale: 이 구절은 예언서에서 반복되는 언약적 심판 공식이므로, 구체적 표현을 유지해야 신학적·문학적 힘이 보존됩니다.
  doctrine_reference: 'POB 번역 원칙: 원문 이미지 보존과 과도한 의역 자제'
- issue: 성별 포괄화 여부
  chosen_reading: 분배적 단수와 3인칭 남성 단수 대명사를 반영해 ‘누구나 … 그를’로 유지했습니다.
  alternative_readings:
  - 그들을
  - 사람들은
  rationale: 히브리어 문법 구조를 보존하는 것이 우선이며, 본문이 요구하지 않는 복수화는 피했습니다.
  doctrine_reference: 'POB 번역 원칙: 문법-의미 일치'
