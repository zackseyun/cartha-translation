  - 기근과 전염병이 그를 먹을 것입니다
  lexicon: HALOT
  rationale: אָכַל의 ‘먹다’ 이미지를 살리되 한국어에서는 ‘먹어 치우다’가 파괴적 소비의 의인화를 자연스럽게 전달합니다. ‘삼키다’보다 원문의 식사/소비 은유가 더 직접적으로 보입니다.
theological_decisions:
- issue: 심판의 삼중 공식 보존
  chosen_reading: ‘칼… 전염병… 기근’의 구체적 심판 이미지를 축약하거나 일반화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 재난, 질병, 굶주림으로 의역
  rationale: 이 구절은 예언서에서 반복되는 언약적 심판 공식이므로, 구체적 표현을 유지해야 신학적·문학적 힘이 보존됩니다.
  doctrine_reference: 'POB 번역 원칙: 원문 이미지 보존과 과도한 의역 자제'
- issue: 성별 포괄화 여부
  chosen_reading: 분배적 단수와 3인칭 남성 단수 대명사를 반영해 ‘누구나 … 그를’로 유지했습니다.
  alternative_readings:
  - 그들을
  - 사람들은
  rationale: 히브리어 문법 구조를 보존하는 것이 우선이며, 본문이 요구하지 않는 복수화는 피했습니다.
  doctrine_reference: 'POB 번역 원칙: 문법-의미 일치'
