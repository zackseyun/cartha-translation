  lexicon: HALOT
  rationale: 예언서의 심판 용례에서 ‘דֶּבֶר’는 역병/전염병을 가리키므로, 현대 한국어에서는 의미가 분명한 ‘전염병’이 적절합니다. ‘역병’도 가능하지만 다소 고어적입니다.
- source_word: מִבָּיִת
  english_pob_choice: inside
  chosen_korean: 안에
  alternatives_korean:
  - 집 안에
  - 내부에
  lexicon: HALOT
  rationale: 원문은 ‘밖’과 대조되는 내부 영역을 말하므로, 문맥상 간결한 ‘안에’가 맞습니다. 영어 POB의 조정처럼 ‘집 안에’를 덧붙이면 원문이 말하지 않는 ‘집’이 들어갑니다.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  english_pob_choice: whoever is in the field
  chosen_korean: 들에 있는 자는 누구나
  alternatives_korean:
