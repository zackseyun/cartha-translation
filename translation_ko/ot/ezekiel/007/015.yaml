- source_word: רָעָב וָדֶבֶר ... יֹאכֲלֶנּוּ
  english_pob_choice: famine and pestilence will consume him
  chosen_korean: 기근과 전염병이 그를 먹어 치울 것입니다
  alternatives_korean:
