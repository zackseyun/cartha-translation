base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/015.yaml
  text: The sword is outside[a], and pestilence and famine are inside. Whoever is in the field will die by the sword, and whoever is in the city[b], famine and pestilence will consume him.
  footnotes:
  - marker: a
    text: Or 'plague' for 'pestilence' (דֶּבֶר).
    reason: lexical_alternative
  - marker: b
    text: Literally 'famine and pestilence will eat him'; 'consume him' renders the Hebrew metaphor idiomatically.
    reason: lexical_alternative
translation:
  language: ko
  text: 칼은 밖에 있고, 전염병[a]과 기근은 안에 있습니다. 들에 있는 자는 칼에 죽고, 성 안에 있는 자는 기근과 전염병이 그를 먹어 치울 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘역병’. 히브리어 דֶּבֶר는 심판 문맥에서 전염병이나 역병을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘기근과 전염병이 그를 먹을 것이다’라고 말합니다. ‘먹어 치울 것입니다’는 이 파괴적 은유를 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֶרֶב
  english_pob_choice: the sword
  chosen_korean: 칼
  alternatives_korean:
