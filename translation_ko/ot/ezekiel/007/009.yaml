id: EZK.7.9
reference: Ezekiel 7:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמ֑וֹל כִּ/דְרָכַ֜יִ/ךְ עָלַ֣יִ/ךְ אֶתֵּ֗ן וְ/תוֹעֲבוֹתַ֨יִ/ךְ֙ בְּ/תוֹכֵ֣/ךְ תִּֽהְיֶ֔יןָ וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה מַכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/009.yaml
  text: My eye will not spare[a], nor will I show pity. I will bring your ways upon you, and your abominations will be in your midst. Then you will know that I am Yahweh[c][b], who strikes.
  footnotes:
  - marker: a
    text: Or, 'My eye will not pity.' The Hebrew idiom uses 'eye' with a verb of sparing/compassion.
    reason: lexical_alternative
  - marker: b
    text: Or, 'according to your ways I will deal with you.' Literally, 'I will bring your ways upon you.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''the LORD'' represents the divine name YHWH.'
    reason: cultural_note
translation:
  language: ko
  text: 내 눈이 아끼지 않을 것입니다[a], 내가 긍휼을 베풀지 않을 것입니다. 내가 너희의 길을 너희에게 돌려보내겠고[b], 너희의 가증한 것들은 너희 가운데에 있을 것입니다. 그때 너희는 내가 야훼[c], 곧 치는 이임을 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 눈이 아끼지 않을 것이다’입니다. 히브리어는 ‘눈’과 ‘아끼다/불쌍히 여기다’의 관용구를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희 행위대로 너희를 다루겠고’. 직역하면 ‘너희의 길을 너희에게 가져오겠다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 본문은 신적 이름 YHWH를 사용합니다.
    reason: cultural_note
lexical_decisions:
- source_word: תָח֥וֹס עֵינִ֖י
  english_pob_choice: My eye will not spare
  chosen_korean: 내 눈이 아끼지 않을 것입니다
  alternatives_korean:
  - 내 눈이 긍휼히 여기지 않을 것입니다
  - 내가 눈을 돌리지 않을 것입니다
  lexicon: HALOT
  rationale: ‘눈’ 이미지를 살리면서 חוס의 ‘아끼다/봐주다’ 의미를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: אֶחְמ֑וֹל
  english_pob_choice: nor will I show pity
  chosen_korean: 내가 긍휼을 베풀지 않을 것입니다
  alternatives_korean:
  - 내가 불쌍히 여기지 않을 것입니다
  - 내가 불쌍히 여기어주지 않을 것입니다
  lexicon: HALOT
  rationale: 앞절과 같은 단어를 반복하지 않고, 두 번째 동사의 자비/연민 뉘앙스를 분명히 드러냈습니다.
- source_word: כִּדְרָכַ֜יִךְ עָלַ֣יִךְ אֶתֵּ֗ן
  english_pob_choice: I will bring your ways upon you
  chosen_korean: 내가 너희의 길을 너희에게 돌려보내겠고
  alternatives_korean:
  - 내가 너희의 길을 너희 위에 두겠고
  - 내가 너희의 행위대로 너희에게 갚겠고
  lexicon: HALOT
  rationale: 직역의 이미지와 보응 의미를 함께 살리되, 한국어에서 자연스럽게 이해되도록 ‘돌려보내다’로 옮겼습니다.
- source_word: יְהוָ֖ה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와 자리에 해당하는 신명은 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
- source_word: מַכֶּֽה־
  english_pob_choice: who strikes
  chosen_korean: 곧 치는 이임을
  alternatives_korean:
  - 곧 치시는 분임을
  - 곧 치는 분임을
  lexicon: HALOT
  rationale: פעול 분사형의 현재적·지속적 행위를 살려, 심판 행위자라는 점을 간결하게 표현했습니다.
theological_decisions:
- issue: 신명 יְהוָה의 표기
  chosen_reading: ‘야훼’로 직표기합니다.
  alternative_readings:
  - ‘주’로 대체
  - ‘여호와’로 표기
  rationale: 본문이 신적 이름을 직접 사용하므로, 제목화된 ‘주’로 바꾸지 않고 하나님의 고유명을 드러내는 표기를 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH → Yahweh'
- issue: 심판 선언의 종결부
  chosen_reading: ‘내가 야훼, 곧 치는 이임을’로 옮겨 주어 신원 선언과 심판 행위를 함께 유지했습니다.
  alternative_readings:
  - ‘내가 야훼인 줄 알게 될 것입니다’
  - ‘내가 야훼, 곧 치시는 분인 줄 알게 될 것입니다’
  rationale: 히브리어 분사는 단순한 별칭이 아니라 현재적 심판 행위를 드러내므로, 정체성과 행위를 함께 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 3, 6
