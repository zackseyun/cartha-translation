translation:
  language: ko
  text: 모든 손은 힘이 풀리고, 모든 무릎에서는 물이 흐를 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘모든 무릎이 물과 함께 갈 것이다’라고 합니다. 이는 두려움으로 무릎이 꺾이는 상태를 가리키는 관용일 가능성이 크며, 몸의 통제 상실을 포함할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  english_pob_choice: all
  chosen_korean: 모든
  alternatives_korean:
  - 각각의
  - 온
  lexicon: HALOT
  rationale: 두 번 반복되는 הכול적 수량 표현이므로 한국어에서도 ‘모든’으로 일관되게 옮겨 전체성을 살렸습니다.
- source_word: הַיָּדַיִם
