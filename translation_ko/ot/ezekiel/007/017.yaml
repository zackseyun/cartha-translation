source:
  edition: WLC
  text: כָּל הַ/יָּדַ֖יִם תִּרְפֶּ֑ינָה וְ/כָל בִּרְכַּ֖יִם תֵּלַ֥כְנָה מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/017.yaml
  text: All hands will grow weak[a], and all knees will run with water.
  footnotes:
  - marker: a
    text: Hebrew 'all knees will run with water,' likely an idiom for knees giving way in terror, possibly including loss of bodily control.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 손이 약해질 것이며, 모든 무릎이 물처럼 흐를 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘무릎이 물처럼 달릴 것이다’입니다. 이는 두려움으로 무릎이 꺾이는 상태를 가리키는 관용일 가능성이 크며, 몸의 통제 상실을 포함할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  english_pob_choice: all
  chosen_korean: 모든
  alternatives_korean:
  - 각각의
  - 온
  lexicon: HALOT
  rationale: 두 번 반복되는 הכול적 수량 표현이므로 한국어에서도 ‘모든’으로 일관되게 옮겨 전체성을 살렸습니다.
- source_word: הַיָּדַיִם
  english_pob_choice: hands
  chosen_korean: 손
  alternatives_korean:
  - 팔
  - 손들
  lexicon: HALOT
  rationale: 원문 이미지를 그대로 유지하기 위해 신체부위는 자연스러운 ‘손’으로 옮겼고, 힘의 쇠약을 암시하는 관용을 과도하게 풀지 않았습니다.
- source_word: תִּרְפֶּינָה
  english_pob_choice: will grow weak
  chosen_korean: 약해질 것입니다
  alternatives_korean:
  - 힘이 풀릴 것입니다
  - 축 늘어질 것입니다
  lexicon: HALOT
  rationale: רפה의 핵심 의미인 ‘약해짐/느슨해짐’을 현대 한국어에서 자연스럽게 전달하는 표현으로 ‘약해질 것입니다’를 택했습니다.
- source_word: בִּרְכַּיִם ... מָּיִם
  english_pob_choice: all knees will run with water
  chosen_korean: 모든 무릎이 물처럼 흐를 것입니다
  alternatives_korean:
  - 모든 무릎에 물이 흐를 것입니다
  - 모든 무릎이 물로 흘러갈 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘무릎이 물로 달린다’는 난해한 관용이므로, POB의 의미 판단을 따라 공포로 인한 무릎 꺾임과 몸의 통제 상실 가능성을 살리되 원문 어휘인 ‘물’을 보존했습니다.
theological_decisions:
- issue: judgment scene idiom and bodily-control implication
  chosen_reading: 원문은 공포로 인한 무릎의 꺾임을 주로 드러내며, ‘물’은 그 상태를 묘사하는 생생한 관용으로 남깁니다.
  alternative_readings:
  - 노골적으로 ‘오줌을 지릴 것이다’로 풀기
  - 단순히 ‘무릎이 떨릴 것이다’로 완화하기
  rationale: 히브리어의 직설적 이미지와 POB의 절제된 주석 방향을 함께 반영하기 위해, 의미는 드러내되 본문 이상의 노골화를 피했습니다.
  doctrine_reference: 예언 심판의 수사와 관용적 표현
- issue: strength-failure imagery
  chosen_reading: ‘손’과 ‘무릎’의 병렬을 그대로 살려 전면적 무력화와 공포를 강조합니다.
  alternative_readings:
  - 의역하여 ‘모든 사람이 무기력해질 것입니다’로 통합
  - 신체 이미지를 약화시켜 ‘모든 힘이 빠질 것입니다’로 처리
  rationale: 예언문의 수사적 충격을 유지하려면 신체 이미지가 중요하므로, 추상화하지 않고 원문 구조를 보존했습니다.
  doctrine_reference: 예언 문학의 이미지 보존
