  lexicon: WLC/HALOT
  rationale: 2인칭 남성 단수 명령형을 한국어 합쇼체 명령으로 옮겼습니다. ‘만드십시오’가 직접적이면서도 문맥의 예언적 명령 어조를 자연스럽게 살립니다.
