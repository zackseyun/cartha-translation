source:
  edition: WLC
  text: עֲשֵׂ֖ה הָֽ/רַתּ֑וֹק כִּ֣י הָ/אָ֗רֶץ מָֽלְאָה֙ מִשְׁפַּ֣ט דָּמִ֔ים וְ/הָ/עִ֖יר מָלְאָ֥ה חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/023.yaml
  text: Make the chain[a], for the land is full of bloody crimes[b], and the city is full of violence.
  footnotes:
  - marker: a
    text: Or 'fetter' or 'binding.' The Hebrew term likely evokes restraint, imprisonment, or captivity under judgment.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'judgment of bloods.' The phrase likely refers to bloodguilt, murderous injustice, or crimes deserving judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 사슬을 만드십시오. 땅은 피의 죄로 가득하고, 성읍은 폭력으로 가득합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사슬’은 원문의 결박 도구 이미지를 살린 번역입니다. 문맥상 감금, 포박, 포로 상태를 함께 떠올리게 합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘피들의 판결’입니다. 이는 피 흘림에 물든 불의, 곧 혈죄와 살인적 죄악을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה
  english_pob_choice: Make
  chosen_korean: 만드십시오
  alternatives_korean:
  - 만드소서
  - 준비하십시오
  lexicon: WLC/HALOT
  rationale: 2인칭 남성 단수 명령형을 한국어 합쇼체 명령으로 옮겼습니다. ‘만드십시오’가 직접적이면서도 문맥의 예언적 명령 어조를 자연스럽게 살립니다.
- source_word: הָרַתּוֹק
  english_pob_choice: the chain
  chosen_korean: 사슬
  alternatives_korean:
  - 족쇄
  - 채찍쇠
  - 묶음
  lexicon: HALOT
  rationale: 문맥상 심판과 포박의 이미지를 지닌 구체적 도구를 가리키므로, 현대 한국어에서 가장 직관적인 ‘사슬’로 옮겼습니다. ‘족쇄’는 더 좁게 감금 도구에 치우쳐 원문의 상징성을 좁힐 수 있습니다.
- source_word: מִשְׁפַּט דָּמִים
  english_pob_choice: bloody crimes
  chosen_korean: 피의 죄
  alternatives_korean:
  - 유혈의 죄
  - 피 흘림의 판결
  - 피의 심판
  lexicon: HALOT
  rationale: 직역하면 ‘피들의 판결’로 어색하므로, 본문이 말하는 혈죄·살인적 불의의 누적을 한국어로 간명하게 드러내는 표현을 택했습니다. POB의 ‘bloody crimes’처럼 법적·도덕적 타락과 유혈성을 함께 살렸습니다.
- source_word: חָמָס
  english_pob_choice: violence
  chosen_korean: 폭력
  alternatives_korean:
  - 포학
  - 학대
  - 강포
  lexicon: HALOT
  rationale: 예언서에서 רחב한 사회적 폭력과 억압을 포괄하는 기본 대응으로 ‘폭력’을 사용했습니다. ‘포학’도 가능하지만 현대 독자에게는 ‘폭력’이 더 즉각적입니다.
theological_decisions:
- issue: 심판 도구 이미지인 הָרַתּוֹק의 구체성
  chosen_reading: 심판과 포박을 함께 떠올리게 하는 실제적 도구 이미지로 읽고, 추상화하지 않았습니다.
  alternative_readings:
  - 단순한 ‘묶임’ 또는 추상적 ‘결박’
  - 포위전의 일반 준비물로만 제한
  rationale: 7장 전체의 멸망 선고 맥락에서 이 명령은 임박한 심판 아래의 포박·유배 이미지를 환기합니다. 따라서 원문의 물질적 이미지가 흐려지지 않도록 구체성을 유지했습니다.
  doctrine_reference: Ezekiel 7 judgment oracle; captivity imagery
