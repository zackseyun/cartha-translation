  text: עֲשֵׂ֖ה הָֽ/רַתּ֑וֹק כִּ֣י הָ/אָ֗רֶץ מָֽלְאָה֙ מִשְׁפַּ֣ט דָּמִ֔ים וְ/הָ/עִ֖יר מָלְאָ֥ה חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/023.yaml
  text: Make the chain[a], for the land is full of bloody crimes[b], and the city is full of violence.
  footnotes:
  - marker: a
    text: Or 'fetter' or 'binding.' The Hebrew term likely evokes restraint, imprisonment, or captivity under judgment.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'judgment of bloods.' The phrase likely refers to bloodguilt, murderous injustice, or crimes deserving judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 사슬을 만드십시오.[a] 그 땅은 유혈 범죄로 가득하고,[b] 그 성읍은 폭력으로 가득합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘족쇄’ 또는 ‘결박’. 히브리어는 심판 아래의 구속, 감금, 또는 포로 상태를 떠올리게 하는 결박 도구를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘피들의 판결’입니다. 이 난해한 표현은 혈죄, 살인적 불의, 또는 피 흘림과 관련된 범죄를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
