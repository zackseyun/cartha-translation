  - 묶음
  lexicon: HALOT
  rationale: 문맥상 심판과 포박의 이미지를 지닌 구체적 도구를 가리키므로, 현대 한국어에서 가장 직관적인 ‘사슬’로 옮겼습니다. ‘족쇄’는 더 좁게 감금 도구에 치우쳐 원문의 상징성을 좁힐 수 있습니다.
- source_word: מִשְׁפַּט דָּמִים
  english_pob_choice: bloody crimes
  chosen_korean: 피의 죄
  alternatives_korean:
  - 유혈의 죄
  - 피 흘림의 판결
  - 피의 심판
  lexicon: HALOT
  rationale: 직역하면 ‘피들의 판결’로 어색하므로, 본문이 말하는 혈죄·살인적 불의의 누적을 한국어로 간명하게 드러내는 표현을 택했습니다. POB의 ‘bloody crimes’처럼 법적·도덕적 타락과 유혈성을 함께 살렸습니다.
- source_word: חָמָס
  english_pob_choice: violence
  chosen_korean: 폭력
  alternatives_korean:
  - 포학
  - 학대
  - 강포
  lexicon: HALOT
  rationale: 예언서에서 רחב한 사회적 폭력과 억압을 포괄하는 기본 대응으로 ‘폭력’을 사용했습니다. ‘포학’도 가능하지만 현대 독자에게는 ‘폭력’이 더 즉각적입니다.
theological_decisions:
- issue: 심판 도구 이미지인 הָרַתּוֹק의 구체성
  chosen_reading: 심판과 포박을 함께 떠올리게 하는 실제적 도구 이미지로 읽고, 추상화하지 않았습니다.
  alternative_readings:
  - 단순한 ‘묶임’ 또는 추상적 ‘결박’
  - 포위전의 일반 준비물로만 제한
  rationale: 7장 전체의 멸망 선고 맥락에서 이 명령은 임박한 심판 아래의 포박·유배 이미지를 환기합니다. 따라서 원문의 물질적 이미지가 흐려지지 않도록 구체성을 유지했습니다.
  doctrine_reference: Ezekiel 7 judgment oracle; captivity imagery
