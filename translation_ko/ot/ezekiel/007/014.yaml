source:
  edition: WLC
  text: תָּקְע֤וּ בַ/תָּק֨וֹעַ֙ וְ/הָכִ֣ין הַ/כֹּ֔ל וְ/אֵ֥ין הֹלֵ֖ךְ לַ/מִּלְחָמָ֑ה כִּ֥י חֲרוֹנִ֖/י אֶל כָּל הֲמוֹנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/014.yaml
  text: They have blown the trumpet and made everything ready[a], but no one goes to battle[b], for my wrath is against all her multitude.
  footnotes:
  - marker: a
    text: Or 'the horn' or 'the ram's horn.'
    reason: lexical_alternative
  - marker: b
    text: Or 'against all her wealth/abundance,' if הֲמוֹנָהּ is taken in the sense of material abundance rather than population.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 나팔을 불고 모든 것을 갖추었으나[b] 전쟁으로 가는 사람이 없습니다. 이는 내 진노가 그녀의 모든 무리[a]를 향하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “재물/풍성함”으로도 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “나팔” 혹은 “숫양의 뿔”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקְעוּ בַתָּקוֹעַ
  english_pob_choice: They have blown the trumpet
  chosen_korean: 나팔을 불고
  alternatives_korean:
  - 호른을 불고
  - 뿔나팔을 불고
  lexicon: HALOT
  rationale: תקע는 군사적 신호를 위한 나팔/호른을 불다의 뜻이므로, 현대 한국어에서는 군사 문맥에 자연스러운 “나팔을 불고”로 옮겼습니다.
- source_word: וְהָכִין הַכֹּל
  english_pob_choice: and made everything ready
  chosen_korean: 모든 것을 갖추었으나
  alternatives_korean:
  - 모든 것을 준비했으나
  - 모든 것을 정돈했으나
  lexicon: HALOT
  rationale: כין의 ‘준비하다/갖추다’ 뜻을 살려 전체적 군사 준비를 나타내는 “모든 것을 갖추었으나”로 옮겼습니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: to battle
  chosen_korean: 전쟁으로 가는
  alternatives_korean:
  - 전투로 가는
  - 싸우러 가는
  lexicon: HALOT
  rationale: 문맥상 실제 출전 장면이므로 מלחמה를 추상적 ‘전쟁’보다 도착지 표현인 “전쟁으로 가는”으로 자연스럽게 살렸습니다.
- source_word: כָּל הֲמוֹנָהּ
  english_pob_choice: all her multitude
  chosen_korean: 그녀의 모든 무리
  alternatives_korean:
  - 그녀의 모든 인파
  - 그녀의 모든 재물
  lexicon: HALOT
  rationale: המון은 여기서 인구적 ‘무리/군중’의 뜻이 가장 자연스럽지만, 문자상 여성 단수 접미를 유지해 소유 대명사 “그녀의”를 살렸습니다.
theological_decisions:
- issue: הֲמוֹנָהּ의 여성형 소유격을 어떻게 처리할지
  chosen_reading: “그녀의”로 유지해 본문이 지닌 지시 대상의 모호성을 보존했습니다.
  alternative_readings:
  - 예루살렘의 무리
  - 그 성의 무리
  - 그 땅의 무리
  rationale: 접미사의 선행사가 본문 안에서 분명하지 않으므로, 번역이 지시 대상을 단정하지 않고 본문의 긴장을 유지하도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
