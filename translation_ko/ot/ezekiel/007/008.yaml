id: EZK.7.8
reference: Ezekiel 7:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַתָּ֣ה מִ/קָּר֗וֹב אֶשְׁפּ֤וֹךְ חֲמָתִ/י֙ עָלַ֔יִ/ךְ וְ/כִלֵּיתִ֤י אַפִּ/י֙ בָּ֔/ךְ וּ/שְׁפַטְתִּ֖י/ךְ כִּ/דְרָכָ֑יִ/ךְ וְ/נָתַתִּ֣י עָלַ֔יִ/ךְ אֵ֖ת כָּל תּוֹעֲבוֹתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/008.yaml
  text: Now[a], soon I will pour out my wrath on you, and I will spend my anger against you; I will judge you according to your ways[b], and I will bring all your abominations upon you.
  footnotes:
  - marker: a
    text: Or 'shortly' or 'in a little while'; the Hebrew expression denotes imminent judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will exhaust my anger on you.' The Hebrew idiom means that God's anger will run its full course against the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 곧[a] 내가 내 분노를 네게 쏟아붓고, 내 진노를 네게 다 쏟겠습니다.[b] 내가 네 행위대로 너를 심판하고, 네 모든 가증한 일을 네게 돌리겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘곧’은 히브리어 표현이 나타내는 시간적 가까움, 곧 임박함을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 진노를 네게 다 쏟겠습니다’는 히브리어 관용을 따른 표현으로, 진노가 그 대상에게 끝까지 집행됨을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה מִקָּרוֹב
  english_pob_choice: Now, soon
  chosen_korean: 이제 곧
  alternatives_korean:
  - 곧
  - 지금 곧
  - 이제, 조금 후에
  lexicon: HALOT
  rationale: עַתָּה의 즉시성과 מִקָּרוֹב의 임박성을 함께 살려, 한국어에서 자연스러운 ‘이제 곧’으로 압축했습니다.
- source_word: אֶשְׁפּוֹךְ חֲמָתִי עָלַיִךְ
  english_pob_choice: I will pour out my wrath on you
  chosen_korean: 내 분노를 너에게 쏟아붓고
  alternatives_korean:
  - 내 진노를 너에게 쏟고
  - 내 분노를 너에게 부어
  lexicon: HALOT
  rationale: 쏟아붓다로 ‘쏟다’의 은유를 살렸고, חֲמָה는 심판 맥락의 강한 감정이므로 ‘분노’로 옮겼습니다.
- source_word: וְכִלֵּיתִי אַפִּי בָּךְ
  english_pob_choice: I will spend my anger against you
  chosen_korean: 내 노를 너에게 다하겠습니다
  alternatives_korean:
  - 내 분노를 너에게 끝내겠습니다
  - 내 노를 너에게 소진하겠습니다
  lexicon: HALOT
  rationale: כלה의 ‘다하다/끝내다’라는 완료 감각을 살려, 하나님의 노가 끝까지 시행됨을 한국어로 표현했습니다.
- source_word: וּשְׁפַטְתִּיךְ כִּדְרָכָיִךְ
  english_pob_choice: I will judge you according to your ways
  chosen_korean: 네 행위대로 너를 심판하고
  alternatives_korean:
  - 네 길에 따라 너를 심판하고
  - 네 행실에 따라 너를 심판하고
  lexicon: HALOT
  rationale: דְּרָכִים를 단순한 ‘길’보다 실제적 행위·삶의 방식으로 이해해 ‘행위대로’로 풀어 한국어 독자에게 분명하게 전달했습니다.
- source_word: וְנָתַתִּי עָלַיִךְ אֵת כָּל תּוֹעֲבוֹתָיִךְ
  english_pob_choice: I will bring all your abominations upon you
  chosen_korean: 네 모든 가증한 것들을 너에게 가져오겠습니다
  alternatives_korean:
  - 네 모든 가증한 것들을 네 위에 두겠습니다
  - 네 모든 혐오스러운 일들을 너에게 가져오겠습니다
  lexicon: HALOT
  rationale: תּוֹעֵבוֹת는 예언서의 우상숭배·가증함을 가리키는 강한 종교윤리 용어이므로 ‘가증한 것들’로 유지했습니다. 'bring upon'의 심판적 귀결을 ‘가져오겠습니다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 분노 표현 두 개의 병렬성 보존
  chosen_reading: חֲמָה와 אַף를 각각 ‘분노’와 ‘노’로 달리 옮겨, 반복이 주는 심판의 고조를 보존했습니다.
  alternative_readings:
  - 둘 다 ‘분노’로 통일
  - 둘 다 ‘진노’로 통일
  rationale: 원문은 관련되지만 동일하지 않은 두 분노 표현을 나란히 놓아 강도를 높입니다. 한국어에서도 약간 다른 어휘를 써 병렬성과 누적감을 살렸습니다.
  doctrine_reference: 예언적 심판 선언의 수사적 강화
- issue: ‘심판하다’와 ‘행위대로’의 사법적 의미
  chosen_reading: וּשְׁפַטְתִּיךְ는 단순한 처벌보다 사법적 판결을 가리키므로 ‘심판하다’를 유지했습니다.
  alternative_readings:
  - 벌하다
  - 판결하다
  rationale: 후반의 ‘행위대로’와 결합될 때, 하나님이 도덕적·언약적 기준에 따라 판결하신다는 뜻이 더 분명해집니다.
  doctrine_reference: 하나님의 공의와 언약적 심판
