  lexicon: HALOT
  rationale: רֶשַׁע는 도덕적 사악함을 뜻하므로, ‘몽둥이’와의 결합을 살려 ‘악의 몽둥이’로 옮겼습니다.
- source_word: וְלֹא נֹהַּ בָּהֶם
  english_pob_choice: and there is no eminence among them
  chosen_korean: 그들 가운데서 뛰어난 것도 없습니다
  alternatives_korean:
  - 그들 가운데서 높임도 없습니다
  - 그들 가운데서 우뚝한 것도 없습니다
  - 그들 가운데서 명망도 없습니다
  lexicon: HALOT
  rationale: נֹהַּ는 의미가 불확실하여 POB의 ‘eminence’ 선택을 따르되, 한국어에서는 ‘뛰어난 것’으로 옮겨 문맥상 소멸되는 우월성/두드러짐을 드러냈습니다.
- source_word: לֹא מֵהֶם וְלֹא מֵהֲמוֹנָם וְלֹא מֶהֱמֵהֶם
  english_pob_choice: none of them remains, none of their multitude, none of their wealth
  chosen_korean: 그들 가운데 남은 자도 없고, 그들의 무리도 없고, 그들의 재물도 없으며
  alternatives_korean:
  - 그들로부터도 없고, 그들의 무리로부터도 없고, 그들의 풍성함으로부터도 없습니다
  - 그들 가운데 아무것도 남지 않고, 그들의 무리도, 그들의 풍성함도 없습니다
  - 그들 중 아무도 없고, 그들의 무리도 없고, 그들의 풍성함도 없습니다
  lexicon: HALOT
  rationale: 히브리어는 생략적이고 난해하므로 POB의 해석적 흐름을 따라 ‘남은 자/무리/재물’로 풀어, 심판의 총체성을 이해 가능하게 했습니다.
theological_decisions:
- issue: 난해한 히브리어 병렬 부정구의 처리
  chosen_reading: 문맥이 요구하는 총체적 심판을 분명히 하되, 히브리어의 생략성과 불확실성은 각주로 남겼습니다.
  alternative_readings:
  - 원문에 더 가깝게 ‘그들로부터도, 그들의 무리로부터도, 그들의 풍성함으로부터도’라고 옮길 수 있습니다.
  - 마지막 절을 ‘그들 가운데서 아무 뛰어남도 없다’로 더 압축할 수 있습니다.
  rationale: 이 구절은 원문이 매우 압축적이고 난해하므로, 독자가 심판 선언의 의미를 놓치지 않도록 최소한의 해석을 보탰습니다.
  doctrine_reference: 번역 원칙 §§1, 3, 5
