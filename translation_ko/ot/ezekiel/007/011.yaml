  lexicon: HALOT
  rationale: קָם은 ‘일어나다/솟아나다’의 상승 이미지를, לְמַטֵּה는 이 심판 문맥에서 도구적 ‘몽둥이/막대기’ 이미지를 나타내므로, 자연스러운 한국어로 옮겼습니다.
