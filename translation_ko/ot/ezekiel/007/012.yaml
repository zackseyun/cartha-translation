id: EZK.7.12
reference: Ezekiel 7:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ֤א הָ/עֵת֙ הִגִּ֣יעַ הַ/יּ֔וֹם הַ/קּוֹנֶה֙ אַל יִשְׂמָ֔ח וְ/הַ/מּוֹכֵ֖ר אַל יִתְאַבָּ֑ל כִּ֥י חָר֖וֹן אֶל כָּל הֲמוֹנָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/012.yaml
  text: The time has come[a]; the day has arrived. Let not the buyer rejoice, and let not the seller mourn[b], for wrath is against all her multitude.
  footnotes:
  - marker: a
    text: Or 'all her wealth,' if הֲמוֹנָהּ is taken in the sense of abundance/possessions rather than population.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'her multitude,' preserving a feminine personification, likely of the city, land, or community under judgment.
    reason: cultural_note
translation:
  language: ko
  text: 그 때가 왔습니다[a]. 그 날이 이르렀습니다. 사는 사람은 기뻐하지 말고, 파는 사람은 애통해하지 마십시오[b]. 이는 분노가 그 모든 무리 위에 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 모든 부’를 뜻할 수 있습니다. הֲמוֹנָהּ를 풍부함/소유의 의미로 볼 경우입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여성형 단수 소유격으로 ‘그녀의 무리’라고 말합니다. 이는 아마도 심판 아래 있는 성읍, 땅, 또는 공동체를 인격화한 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בָּא הָעֵת הִגִּיעַ הַיּוֹם
  english_pob_choice: The time has come; the day has arrived.
  chosen_korean: 그 때가 왔습니다. 그 날이 이르렀습니다.
  alternatives_korean:
  - 그 시간이 도래했습니다. 그 날이 다가왔습니다.
  - 정해진 때가 왔습니다. 그 날이 이르렀습니다.
  lexicon: HALOT
  rationale: בָּא/הִגִּיעַ의 이중 서술을 살려 도래의 확정성을 두 문장으로 병렬적으로 표현했습니다.
- source_word: הַקּוֹנֶה / הַמּוֹכֵר
  english_pob_choice: the buyer / the seller
  chosen_korean: 사는 사람 / 파는 사람
  alternatives_korean:
  - 구매자 / 판매자
  - 사는 자 / 파는 자
  lexicon: HALOT
  rationale: 분사적 명사구를 현대 한국어에서 자연스럽게 옮기되, 예언적 경고의 직접성을 유지하도록 일상적인 표현을 택했습니다.
- source_word: אַל יִשְׂמָח / אַל יִתְאַבָּל
  english_pob_choice: Let not ... rejoice / let not ... mourn
  chosen_korean: 기뻐하지 말고 / 애통해하지 마십시오
  alternatives_korean:
  - 즐거워하지 말고 / 슬퍼하지 마십시오
  - 기뻐하지 말라 / 통곡하지 말라
  lexicon: HALOT
  rationale: אַל + 미완료의 금지 뉘앙스를 합쇼체 금령으로 옮겼고, יִתְאַבָּל은 단순 슬픔보다 장례적 애통의 뉘앙스가 있어 애통해하다를 선택했습니다.
- source_word: הֲמוֹנָהּ
  english_pob_choice: her multitude
  chosen_korean: 그 모든 무리
  alternatives_korean:
  - 그녀의 무리
  - 그 많은 사람들
  - 그 모든 군중
  lexicon: HALOT
  rationale: 문맥상 사람들의 집합을 가리키는 '무리'를 살리되, 여성형 소유격은 한국어에서 자연스러운 '그'로 처리해 인격화된 대상의 지시를 과도하게 해명하지 않았습니다.
theological_decisions:
- issue: 여성형 소유격 הֲמוֹנָהּ의 처리
  chosen_reading: 본문의 인격화된 대상은 드러내지 않고, '그 모든 무리'로 옮겨 여성형 지시의 긴장을 과도하게 해소하지 않았습니다.
  alternative_readings:
  - 그녀의 무리
  - 그 무리
  - 그 도시의 무리
  rationale: 히브리어는 여성 단수 소유격을 유지해 도시/땅/공동체의 인격화를 암시하므로, 한국어 본문에서는 자연스러운 지시 표현을 쓰되 주석 없이 특정 선행사를 단정하지 않았습니다.
  doctrine_reference: 본문의 문법적 인격화를 보존하되, 번역문에서 불필요한 해석 확정을 피합니다.
- issue: 예언적 금지문의 문체
  chosen_reading: 직설적 경고를 살리기 위해 합쇼체 명령형/금지형을 사용했습니다.
  alternative_readings:
  - 기뻐하지 말라 / 애통해하지 말라
  - 기뻐하지 마십시오 / 애통해하지 마십시오
  rationale: 예언 선포의 엄중함을 현대 공용어로 전달하면서도, 한국어 독자에게는 공손한 합쇼체가 본문 낭독에 적합합니다.
  doctrine_reference: 예언적 선포의 수사적 강도를 보존하는 문체 선택
