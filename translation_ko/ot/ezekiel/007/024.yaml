id: EZK.7.24
reference: Ezekiel 7:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵֽבֵאתִי֙ רָעֵ֣י גוֹיִ֔ם וְ/יָרְשׁ֖וּ אֶת בָּֽתֵּי/הֶ֑ם וְ/הִשְׁבַּתִּי֙ גְּא֣וֹן עַזִּ֔ים וְ/נִחֲל֖וּ מְקַֽדְשֵׁי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/024.yaml
  text: And I will bring the worst of the nations[a], and they will take possession of their houses. I will put an end to the pride of the strong[c][b], and their sanctuaries will be profaned.
  footnotes:
  - marker: a
    text: Or 'the most wicked of the nations.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they will inherit their houses'; the Hebrew verb can mean 'inherit,' 'possess,' or 'dispossess' depending on context.
    reason: lexical_alternative
  - marker: c
    text: Or 'their holy places will be defiled.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 민족들 가운데서 가장 악한 자들을[a] 데려올 것입니다. 그들이 그들의 집들을[b] 차지할 것입니다. 내가 강한 자들의 교만을 끝내겠으며, 그들의 성소들은[c] 더럽혀질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족들 가운데 가장 사악한 자들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 그들의 집들을 상속받을 것입니다’. 히브리어 동사는 문맥에 따라 ‘상속하다’, ‘소유하다’, ‘빼앗다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들의 거룩한 곳들은 더럽혀질 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי / רָעֵי גוֹיִם
  english_pob_choice: And I will bring the worst of the nations
  chosen_korean: 내가 그 민족들 가운데서 가장 악한 자들을 데려오리니
  alternatives_korean:
  - 내가 그 민족들의 가장 악한 자들을 불러오리니
  - 내가 민족들 가운데 최악의 자들을 데려오리니
  lexicon: HALOT
  rationale: 히필형 הֵבֵאתִי는 ‘데려오다/가져오다’의 causative를 살리고, רָעֵי גוֹיִם은 심판 맥락의 최상급적 의미를 살려 ‘가장 악한 자들’로 옮겼습니다.
- source_word: וְיָרְשׁוּ אֶת בָּתֵּיהֶם
  english_pob_choice: and they will take possession of their houses
  chosen_korean: 그들이 그들의 집을 차지할 것입니다
  alternatives_korean:
  - 그들이 그들의 집을 차지하리니
  - 그들이 그들의 집을 빼앗아 차지할 것입니다
  lexicon: HALOT
  rationale: ירשׁ는 문맥상 합법적 상속이 아니라 점령·차지의 뜻이므로, ‘차지하다’로 간결하게 옮겨 강제적 점유의 뉘앙스를 살렸습니다.
- source_word: וְהִשְׁבַּתִּי גְּא֣וֹן עַזִּ֔ים
  english_pob_choice: I will put an end to the pride of the strong
  chosen_korean: 내가 강한 자들의 교만을 끝내고
  alternatives_korean:
  - 내가 강한 자들의 자만을 끝내고
  - 내가 용사들의 교만을 끝내고
  lexicon: HALOT
  rationale: גְּאוֹן은 여기서 긍정적 ‘위엄’보다 심판 대상인 ‘교만’이 문맥에 더 적합하고, עַזִּים은 ‘강한 자들’로 평이하게 옮겼습니다.
- source_word: וְנִחֲלוּ מְקַדְשֵׁי/הֶם
  english_pob_choice: and their sanctuaries will be profaned
  chosen_korean: 그들의 성소들은 더럽혀질 것입니다
  alternatives_korean:
  - 그들의 성소들은 profaned될 것입니다
  - 그들의 거룩한 곳들은 더럽혀질 것입니다
  lexicon: HALOT
  rationale: נחל/חלל의 수동적 의미는 cultic 영역에서 ‘더럽혀지다/모독되다’가 자연스럽고, מְקַדְשֵׁיהֶם은 복수의 ‘성소들’로 옮겼습니다.
theological_decisions:
- issue: גְּאוֹן עַזִּים의 정서적 색조
  chosen_reading: ‘교만’으로 번역해 심판 선언의 비난적 어조를 분명히 했습니다.
  alternative_readings:
  - ‘위엄’으로 옮겨 중립적 또는 긍정적 색조를 살리는 방식
  - ‘자만’으로 더 강하게 비난하는 방식
  rationale: 이 절은 멸망 선언의 일부이므로, 긍정적 의미를 띠는 ‘위엄’보다 죄의 성격을 드러내는 ‘교만’이 본문 효과를 더 잘 전달합니다.
  doctrine_reference: 예언서의 심판 신탁에서 인간의 자고와 교만에 대한 하나님의 심판
