  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 שְׁמוּעָה의 반복은 ‘소문이 소문 위에 일어나다’보다 ‘소문에 소문이 이어지다’로 옮겨야 한국어에서 자연스럽게 누적되는 소식의 뜻을 더 정확히 전달합니다. תּוֹרָה는 이 문맥에서 제사장의 ‘가르침/교훈’을 가리키며, ‘가르침’이 현대 한국어에서 직무상 전하는 instruction의 뜻을 가장 투명하게 나타냅니다.
  naturalness: 초안의 ‘재앙이 재앙 위에 닥치고, 소문이 소문 위에 일어날 것입니다’는 병렬 구조와 시제 연결이 다소 어색합니다. ‘재앙에 재앙이 겹쳐 닥치고, 소문에 소문이 이어질 것입니다’는 반복·축적의 효과를 보존하면서 자연스럽습니다.
  terminology: ‘예언자’, ‘환상’, ‘제사장’, ‘장로들’은 적절합니다. תּוֹרָה에는 ‘가르침’을 사용하고, 각주에서 ‘율법’과 ‘교훈’을 가능한 대안으로 밝혀 의미 범위를 보존합니다. עֵצָה의 ‘조언’도 현대어로 무난합니다.
