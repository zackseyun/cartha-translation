source:
  edition: WLC
  text: הֹוָ֤ה עַל הֹוָה֙ תָּב֔וֹא וּ/שְׁמֻעָ֥ה אֶל שְׁמוּעָ֖ה תִּֽהְיֶ֑ה וּ/בִקְשׁ֤וּ חָזוֹן֙ מִ/נָּבִ֔יא וְ/תוֹרָה֙ תֹּאבַ֣ד מִ/כֹּהֵ֔ן וְ/עֵצָ֖ה מִ/זְּקֵנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/026.yaml
  text: Disaster upon disaster will come[a], and rumor upon rumor will arise. They will seek a vision from a prophet, but instruction will perish from the priest[b], and counsel from the elders.
  footnotes:
  - marker: a
    text: Or 'report upon report.' The Hebrew term can mean either 'rumor' or 'report'; here it likely refers to repeated alarming news spreading through the people.
    reason: lexical_alternative
  - marker: b
    text: Or 'law will perish from the priest.' The Hebrew torah can mean 'instruction,' 'teaching,' or 'law'; in this context it likely refers to priestly instruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 재앙에 재앙이 겹쳐 닥치고, 소문[a]에 소문이 이어질 것입니다. 그들은 예언자에게서 환상을 구하겠지만, 제사장에게서 가르침[b]이 사라지고 장로들에게서 조언이 사라질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소문’은 ‘보고’나 ‘전갈’로도 옮길 수 있습니다. 여기서는 사람들 사이에 잇따라 퍼지는 불안한 소식이라는 뉘앙스를 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가르침’은 ‘율법’ 또는 ‘교훈’으로도 옮길 수 있습니다. 여기서는 제사장이 제공하는 가르침이나 지시를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹוָה
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 재해
  - 참사
  lexicon: HALOT
  rationale: 심판 문맥에서 반복되는 파괴적 재난을 가리키므로, 현대 한국어에서 자연스럽고 강한 ‘재앙’이 적절합니다.
- source_word: עַל הֹוָה / אֶל שְׁמוּעָה
  english_pob_choice: upon disaster / upon rumor
  chosen_korean: 재앙이 재앙 위에 / 소문이 소문 위에
  alternatives_korean:
  - 재앙 위에 재앙
  - 재앙에 이어 재앙
  - 소문에 이어 소문
  lexicon: HALOT
  rationale: 히브리어의 누적·중첩 감각을 살리기 위해 ‘위에’를 반복해 쌓여 가는 재앙과 소문의 흐름을 드러냈습니다.
- source_word: שְׁמוּעָה
  english_pob_choice: rumor
  chosen_korean: 소문
  alternatives_korean:
  - 보고
  - 전갈
  - 뉴스
  lexicon: HALOT
  rationale: 사회 붕괴 속에서 퍼지는 불안한 소식을 가리키므로, ‘소문’이 가장 직접적으로 긴박감을 전달합니다.
- source_word: תּוֹרָה
  english_pob_choice: instruction
  chosen_korean: 교훈
  alternatives_korean:
  - 가르침
  - 율법
  - 훈계
  lexicon: HALOT
  rationale: 여기서는 제사장의 직무와 연결된 권위 있는 지도·가르침을 뜻하므로, 일상적 ‘조언’과 구별되면서도 문맥에 맞는 ‘교훈’이 적절합니다.
- source_word: עֵצָה
  english_pob_choice: counsel
  chosen_korean: 조언
  alternatives_korean:
  - 권고
  - 상담
  - 의논
  lexicon: HALOT
  rationale: 장로들의 숙의적 판단을 가리키는 말이므로, 현대어에서 자연스러운 ‘조언’으로 옮겼습니다.
theological_decisions:
- issue: 제사장에게서 사라지는 תּוֹרָה의 의미
  chosen_reading: 제사장에게서는 교훈이 사라지고
  alternative_readings:
  - 제사장에게서는 율법이 사라지고
  - 제사장에게서는 가르침이 사라지고
  rationale: 이 절은 예언자-제사장-장로라는 세 지도 통로의 붕괴를 말하므로, כאן의 תּוֹרָה는 모세오경 전체보다 제사장적 지도와 판별 기능에 가까운 ‘교훈’으로 읽는 것이 문맥상 가장 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 히브리어의 반복 구조와 종결 어미
  chosen_reading: … 닥치고 / … 일어날 것입니다 / … 사라질 것입니다
  alternative_readings:
  - … 닥칠 것입니다
  - … 일어납니다
  - … 없어질 것입니다
  rationale: 예언적 선언의 단정성과 병렬성을 살리기 위해, 동일한 종결 패턴을 유지하면서도 한국어로는 자연스러운 미래형을 사용했습니다.
  doctrine_reference: Translation philosophy §6
