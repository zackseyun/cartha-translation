- from: 재앙이 재앙 위에 닥치고, 소문이 소문 위에 일어날 것입니다. 그들은 예언자에게서 환상을 구하지만, 제사장에게서는 교훈이 사라지고, 장로들에게서는 조언이 사라질 것입니다.[a][b]
