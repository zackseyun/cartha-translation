    rationale: ‘권위 있는 종교적 지도’는 תּוֹרָה 자체가 아니라 제사장이 제공하는 가르침을 잘못 설명한 표현입니다. 제사장적 가르침 또는 지시라는 뜻으로 바로잡아야 합니다.
