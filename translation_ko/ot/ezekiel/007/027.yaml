id: EZK.7.27
reference: Ezekiel 7:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/מֶּ֣לֶךְ יִתְאַבָּ֗ל וְ/נָשִׂיא֙ יִלְבַּ֣שׁ שְׁמָמָ֔ה וִ/ידֵ֥י עַם הָ/אָ֖רֶץ תִּבָּהַ֑לְנָה מִ/דַּרְכָּ֞/ם אֶעֱשֶׂ֤ה אוֹתָ/ם֙ וּ/בְ/מִשְׁפְּטֵי/הֶ֣ם אֶשְׁפְּטֵ֔/ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/027.yaml
  text: The king will mourn[a], and the prince will clothe himself with desolation, and the hands of the people of the land will tremble. According to their way I will deal with them, and by their own judgments I will judge them[c][b]. Then they will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or, 'the prince will put on horror' or 'will be clothed with desolation.' The Hebrew uses a clothing metaphor with a noun that can denote desolation or appalled ruin.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the hands of the common people will be terrified.' 'People of the land' is a Hebrew expression for the populace.
    reason: lexical_alternative
  - marker: c
    text: Or, 'according to their judgments I will judge them.' The Hebrew may mean that God judges them by the standards reflected in their own judicial practices.
    reason: alternative_reading
translation:
  language: ko
  text: 왕은 애도할 것이고, 방백은 황폐함을 입을 것이며, 그 땅의 백성의 손은 떨릴 것입니다. 그들의 행위에 따라 내가 그들을 대할 것이며, 그들의 판결대로 내가 그들을 심판할 것입니다. 그러면 그들은 내가 야훼임을 알게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘황폐함을 입다’는 히브리어의 옷 입는 은유를 살린 표현입니다. 원문은 ‘황폐함/공포/경악’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 땅의 백성’은 히브리어 관용구로, 여기서는 땅의 일반 백성을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘판결대로’는 히브리어 מִשְׁפָּטֵיהֶם을 법정적 의미로 읽은 번역입니다. ‘그들의 판단/율례’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 군주
  lexicon: HALOT
  rationale: 직접적인 정치적 지위를 가리키므로 가장 자연스럽고 표준적인 ‘왕’으로 옮겼습니다.
- source_word: יִתְאַבָּל
  english_pob_choice: will mourn
  chosen_korean: 애도할 것입니다
  alternatives_korean:
  - 슬퍼할 것입니다
  - 통곡할 것입니다
  lexicon: HALOT
  rationale: 이 동사는 죽음이나 재난 앞의 애도·상례적 슬픔을 뜻하므로, 단순한 감정표현보다 ‘애도하다’가 원문에 더 가깝습니다.
- source_word: יִלְבַּשׁ שְׁמָמָה
  english_pob_choice: will clothe himself with desolation
  chosen_korean: 황폐함을 입을 것입니다
  alternatives_korean:
  - 황망함을 입을 것입니다
  - 황폐함으로 옷 입을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘옷 입다’ 은유를 살리면서, שְׁמָמָה의 핵심 의미인 ‘황폐함/멸망 상태’를 간결하게 반영했습니다.
- source_word: וִידֵי עַם הָאָרֶץ
  english_pob_choice: the hands of the people of the land
  chosen_korean: 그 땅의 백성의 손
  alternatives_korean:
  - 그 땅의 일반 백성의 손
  - 토지의 백성의 손
  lexicon: HALOT
  rationale: 관용구를 직역해 신체적 떨림의 이미지를 유지했으며, POB의 주석처럼 ‘백성/민중’의 뜻을 보존했습니다.
- source_word: תִּבָּהַלְנָה
  english_pob_choice: will tremble
  chosen_korean: 떨릴 것입니다
  alternatives_korean:
  - 두려워할 것입니다
  - 패닉에 빠질 것입니다
  lexicon: HALOT
  rationale: בהל의 수동/반사적 의미는 ‘두려움에 사로잡히다’이지만, 손이 떤다는 구체적 체현을 살려 ‘떨리다’로 옮겼습니다.
- source_word: מִדַּרְכָּם אֶעֱשֶׂה אוֹתָם
  english_pob_choice: According to their way I will deal with them
  chosen_korean: 그들의 행위에 따라 내가 그들을 대할 것이며
  alternatives_korean:
  - 그들의 길에 따라 내가 그들을 행할 것이며
  - 그들의 행실대로 내가 그들에게 행할 것이며
  lexicon: HALOT
  rationale: דֶּרֶךְ를 삶의 방식·행위로 이해해 심판의 기준을 드러내면서도, 한국어로 자연스럽게 읽히도록 했습니다.
- source_word: וּבְמִשְׁפְּטֵיהֶם אֶשְׁפְּטֵם
  english_pob_choice: by their own judgments I will judge them
  chosen_korean: 그들의 판결대로 내가 그들을 심판할 것입니다
  alternatives_korean:
  - 그들의 판단대로 내가 그들을 심판할 것입니다
  - 그들의 율례대로 내가 그들을 심판할 것입니다
  lexicon: HALOT
  rationale: מִשְׁפָּט을 여기서는 법정적 ‘판결’로 보는 것이 문맥상 가장 분명하며, 반복되는 ‘심판하다’와도 잘 맞습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본 용례에 따라 언약명 יְהוָה는 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: '이사야/예레미야가 아닌 에스겔의 인식 공식: ''그러면 그들은 내가 야훼임을 알게 될 것입니다.'''
  chosen_reading: 심판의 결과로 하나님을 인식하게 되는 에스겔의 반복 공식으로 보았습니다.
  alternative_readings:
  - 단순한 정보 습득 진술로 볼 수 있습니다.
  - 형벌의 목적을 약화한 일반적 서술로 볼 수 있습니다.
  rationale: כִּי אֲנִי יְהוָה는 에스겔서의 전형적 인식 공식이므로, 결과절 ‘그러면’으로 원인-결과 관계를 분명히 하되 신학적 함의를 과장하지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §6
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 문맥의 인식 공식 안에서도 고유한 언약명을 보존하는 것이 원문의 신학적 표지를 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
