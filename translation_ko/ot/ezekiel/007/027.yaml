theological_decisions:
- issue: '이사야/예레미야가 아닌 에스겔의 인식 공식: ''그러면 그들은 내가 야훼임을 알게 될 것입니다.'''
  chosen_reading: 심판의 결과로 하나님을 인식하게 되는 에스겔의 반복 공식으로 보았습니다.
  alternative_readings:
  - 단순한 정보 습득 진술로 볼 수 있습니다.
  - 형벌의 목적을 약화한 일반적 서술로 볼 수 있습니다.
  rationale: כִּי אֲנִי יְהוָה는 에스겔서의 전형적 인식 공식이므로, 결과절 ‘그러면’으로 원인-결과 관계를 분명히 하되 신학적 함의를 과장하지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §6
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 문맥의 인식 공식 안에서도 고유한 언약명을 보존하는 것이 원문의 신학적 표지를 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
