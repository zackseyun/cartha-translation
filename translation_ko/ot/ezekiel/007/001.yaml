  - 주
  lexicon: HALOT
  rationale: 원문이 여호와 대체칭이 아닌 신명기적 이름 יְהוָה를 직접 쓰므로, 프로젝트 기본값에 따라 음역 ‘야훼’를 사용해 고유 이름성을 보존했습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내 앞에
  lexicon: HALOT
  rationale: 1인칭 목적어를 자연스럽고 간결하게 옮기되, 예언자에게 임하는 계시의 방향성을 유지하는 표현으로 ‘내게’를 택했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말씀하시며
  - 하여 말씀하셨습니다
  lexicon: HALOT
  rationale: 히브리어 인용 도입부를 한국어에서는 다음 직설 인용을 여는 서술 동사로 자연화하는 것이 적절하여, 뒤 절이 없는 본절에서는 ‘이르셨습니다’로 마무리했습니다.
theological_decisions:
