theological_decisions:
- issue: 보이는 주어 없이 임하는 계시 공식의 한국어 처리
  chosen_reading: ‘야훼의 말씀이 내게 임하여 이르셨습니다’로, 원문의 수동적 계시 수여 구조를 유지했습니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 와서 말씀하셨습니다’
  - ‘야훼께서 내게 말씀하셨습니다’
  rationale: 원문은 ‘말씀’이 예언자에게 ‘임하는’ 전형적 계시 공식이므로, 주어를 하나님 직접 발화로 평탄화하기보다 계시 사건의 형식을 보존하는 편이 원문 의미를 더 정확히 드러냅니다.
