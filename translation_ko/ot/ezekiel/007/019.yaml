id: EZK.7.19
reference: Ezekiel 7:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּסְפָּ֞/ם בַּ/חוּצ֣וֹת יַשְׁלִ֗יכוּ וּ/זְהָבָ/ם֮ לְ/נִדָּ֣ה יִֽהְיֶה֒ כַּסְפָּ֨/ם וּ/זְהָבָ֜/ם לֹֽא יוּכַ֣ל לְ/הַצִּילָ֗/ם בְּ/יוֹם֙ עֶבְרַ֣ת יְהוָ֔ה נַפְשָׁ/ם֙ לֹ֣א יְשַׂבֵּ֔עוּ וּ/מֵעֵי/הֶ֖ם לֹ֣א יְמַלֵּ֑אוּ כִּֽי מִכְשׁ֥וֹל עֲוֺנָ֖/ם הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/019.yaml
  text: They will throw their silver into the streets[a], and their gold will become an unclean thing. Their silver and their gold will not be able to deliver them in the day of Yahweh’s wrath. They will not satisfy their appetite, nor fill their stomachs, for it has become the stumbling block of their iniquity.
  footnotes:
  - marker: a
    text: Or, more literally, “their gold will be for impurity”; the Hebrew term can evoke menstrual uncleanness and thus something ritually repulsive.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기 은을 거리에 내던질 것이며, 자기 금은 부정한 것이 될 것입니다.[a] 그들의 은과 금은 야훼의 진노의 날에 그들을 구해 내지 못할 것입니다. 그들은 자기 식욕을 채우지 못하고, 자기 배도 채우지 못할 것입니다. 그 금이 그들의 죄악의 걸림돌이 되었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, “그들의 금은 부정함을 위한 것이 될 것입니다.” 히브리어 용어는 월경과 관련된 부정함을 연상시켜, 의례적으로 혐오스러운 것을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפָּם ... בַּחוּצוֹת יַשְׁלִיכוּ
  english_pob_choice: they will throw their silver into the streets
  chosen_korean: 그들은 자기 은을 거리에 내던지고
  alternatives_korean:
  - 그들은 자기 은을 거리들에 던지고
  - 그들은 자기 은을 밖으로 던지고
  lexicon: HALOT
  rationale: כֶּסֶף는 문맥상 금과 병렬을 이루는 귀금속 ‘은’이 가장 자연스럽고, בַּחוּצוֹת는 공개된 거리라는 이미지를 살려 ‘거리에’로 옮겼습니다.
- source_word: וּזְהָבָם לְנִדָּה יִהְיֶה
  english_pob_choice: their gold will become an unclean thing
  chosen_korean: 자기 금은 부정한 것이 될 것입니다
  alternatives_korean:
  - 자기 금은 불결한 것이 될 것입니다
  - 자기 금은 부정함이 될 것입니다
  lexicon: HALOT
  rationale: נִדָּה는 성적·의례적 ‘부정함’의 뉘앙스를 지니므로, 본문은 과도한 설명 없이 ‘부정한 것’으로 옮겨 예언적 경멸과 의례적 혐오를 함께 살렸습니다.
- source_word: לֹא יוּכַל לְהַצִּילָם
  english_pob_choice: will not be able to deliver them
  chosen_korean: 그들의 은과 금은 야훼의 진노의 날에 그들을 구해낼 수 없습니다
  alternatives_korean:
  - 그들의 은과 금은 그들을 구원할 수 없습니다
  - 그들의 은과 금은 그들을 건져낼 수 없습니다
  lexicon: HALOT
  rationale: לְהַצִּיל은 일반적 ‘구하다’보다 심판 문맥에서의 ‘구해내다/건져내다’가 잘 맞아, 물질적 재산이 무력함을 분명히 드러내는 표현을 택했습니다.
- source_word: נַפְשָׁם ... וּמֵעֵיהֶם
  english_pob_choice: their appetite ... their stomachs
  chosen_korean: 그들은 자기 식욕을 채우지 못하고, 자기 배를 채우지도 못할 것입니다
  alternatives_korean:
  - 그들은 자기 영혼을 만족시키지 못하고, 자기 속을 채우지도 못할 것입니다
  - 그들은 자기 욕구를 채우지 못하고, 자기 창자를 채우지도 못할 것입니다
  lexicon: HALOT
  rationale: 음식과 배부름의 병행을 따라 נֶפֶשׁ는 ‘식욕’, מֵעֶה는 구체적인 신체 이미지인 ‘배’로 옮겨 본문이 말하는 육체적 허기를 자연스럽게 전달했습니다.
- source_word: מִכְשׁוֹל עֲוֺנָם
  english_pob_choice: the stumbling block of their iniquity
  chosen_korean: 그것이 그들의 죄악의 걸림돌이 되었기 때문입니다
  alternatives_korean:
  - 그것이 그들의 죄의 걸림돌이 되었기 때문입니다
  - 그것이 그들의 죄악을 넘어지게 한 것이 되었기 때문입니다
  lexicon: HALOT
  rationale: מִכְשׁוֹל은 단순한 장애물이 아니라 넘어지게 하는 원인이라는 점을 살려 ‘걸림돌’로 옮겼고, עָוֺן은 도덕적 왜곡을 나타내는 ‘죄악’으로 유지했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 예언자적 화자 속에서 하나님의 언약명을 직접 드러내기 위해 관례적 우회어를 쓰지 않고 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 감정·신체 병렬에서 נֶפֶשׁ의 의미
  chosen_reading: 식욕
  alternative_readings:
  - 영혼
  - 생명
  - 욕망
  rationale: ‘배를 채우다’와 병렬되는 문맥이므로 존재론적 ‘영혼’보다 육체적 허기와 욕구를 드러내는 ‘식욕’이 본문 의도를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1, #3'
