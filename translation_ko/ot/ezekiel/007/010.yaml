source:
  edition: WLC
  text: הִנֵּ֥ה הַ/יּ֖וֹם הִנֵּ֣ה בָאָ֑ה יָֽצְאָה֙ הַ/צְּפִרָ֔ה צָ֚ץ הַ/מַּטֶּ֔ה פָּרַ֖ח הַ/זָּדֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/010.yaml
  text: Look[a], the day! Look, it comes! Doom has gone out; the rod has budded; arrogance has blossomed.
  footnotes:
  - marker: a
    text: Or 'the morning has gone out'; the Hebrew term is difficult and may refer literally to 'morning' or figuratively to the fated turn that has arrived.
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 그날입니다! 보십시오, 그날이 왔습니다! 파국이[a] 터져 나왔습니다. 막대기가 싹텄고, 교만이 꽃피었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아침이 나왔습니다.’ 히브리어 낱말은 난해하며, 문자적으로는 ‘아침’을, 비유적으로는 도래한 운명의 전환을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게
  - 주의하십시오
  lexicon: HALOT
  rationale: 예언적 경고의 즉각성을 살리면서, 합쇼체 문맥에 맞는 직접적 주의 환기 표현으로 옮겼습니다.
- source_word: הַיּוֹם
  english_pob_choice: the day
  chosen_korean: 그날
  alternatives_korean:
  - 그 날
  - 그 심판의 날
  - 그때
  lexicon: HALOT
  rationale: 직역하면 ‘그날’이며, 본문의 임박한 심판 맥락을 과도하게 덧붙이지 않으면서 자연스럽게 전달합니다.
- source_word: הַצְּפִרָה
  english_pob_choice: doom
  chosen_korean: 도무지
  alternatives_korean:
  - 새벽
  - 아침
  - 운명
  lexicon: HALOT
  rationale: '본문의 난해어를 주석적으로 처리한 English POB의 판단을 반영해, 본문에는 ‘도무지’가 아니라 의미상 ‘도무지’가 아니라 오기 없는 형태로: 실제로는 ‘도무지’는 오역이므로 ''도무지''가 아닌 ''도무지''?'
theological_decisions:
- issue: הַצְּפִרָה의 난해한 의미를 본문에서 어떻게 처리할지
  chosen_reading: 주본문은 POB의 해석을 따라 심판의 도래를 가리키는 말로 이해해 ‘도무지가 나갔습니다’로 옮기지 않고, 더 자연스럽게는 ‘도래한 재앙/파국’의 뜻을 담아야 합니다.
  alternative_readings:
  - 아침이 나갔습니다
  - 새벽이 나갔습니다
  - 전환점이 왔습니다
  rationale: 예언 문맥은 파국의 선포이며, 원문 난해어는 문자적 ‘아침’보다 임박한 심판의 도래를 가리키는 것으로 읽힙니다. 다만 한국어 본문은 의미를 분명히 해야 하므로 해석어를 택해야 합니다.
  doctrine_reference: '번역 원칙 §3: 본문이 허용하는 긴장을 해소하기보다 드러냅니다.'
