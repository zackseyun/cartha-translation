id: EZK.7.7
reference: Ezekiel 7:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ֧אָה הַ/צְּפִירָ֛ה אֵלֶ֖י/ךָ יוֹשֵׁ֣ב הָ/אָ֑רֶץ בָּ֣א הָ/עֵ֗ת קָר֛וֹב הַ/יּ֥וֹם מְהוּמָ֖ה וְ/לֹא הֵ֥ד הָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/007.yaml
  text: Doom has come upon you[a], inhabitant of the land. The time has come; the day is near—panic[b], and not joyful shouting on the mountains.
  footnotes:
  - marker: a
    text: Or 'The turn has come upon you' or 'Your destiny has come.' The Hebrew term is rare and difficult.
    reason: lexical_alternative
  - marker: b
    text: Or 'tumult, and not echo on the mountains.' The final clause is difficult; many understand it as a contrast between panic and the usual joyful shouting heard on the mountains, possibly at harvest.
    reason: lexical_alternative
translation:
  language: ko
  text: 재앙이 너에게[a], 이 땅의 주민에게 이르렀습니다. 때가 이르렀고, 날이 가깝습니다. 혼란[b]이 닥치고, 산들에서의 즐거운 외침은 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전환점이 너에게 이르렀다’ 혹은 ‘네 운명이 이르렀다’. 이 히브리어는 희귀하고 난해합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘소동, 그리고 산들에서의 메아리가 아님’. 마지막 절은 난해하며, 많은 이들은 추수 때 산들에서 들리던 즐거운 외침과의 대조로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִירָה
  english_pob_choice: doom
  chosen_korean: 재앙
  alternatives_korean:
  - 파멸
  - 운명
  - 전환점
  lexicon: HALOT
  rationale: 희귀하고 난해한 명사로, 심판 문맥과 앞뒤의 도래 표현에 맞추어 결과적 재난을 드러내는 ‘재앙’으로 옮겼습니다. ‘운명’이나 ‘전환점’도 가능하지만, 본문이 말하는 경고의 강도는 약해집니다.
- source_word: יוֹשֵׁב הָאָרֶץ
  english_pob_choice: inhabitant of the land
  chosen_korean: 이 땅의 주민
  alternatives_korean:
  - 그 땅에 사는 자
  - 땅의 거주자
  - 세상의 주민
  lexicon: HALOT
  rationale: 직접 호칭으로 읽히는 현재분사를 한국어 자연문으로 살려 ‘이 땅의 주민’으로 번역했습니다. ‘땅’은 여기서 이스라엘/국토를 가리키는 문맥에 더 잘 맞습니다.
- source_word: מְהוּמָה
  english_pob_choice: panic
  chosen_korean: 혼란
  alternatives_korean:
  - 공포
  - 소동
  - 패닉
  lexicon: HALOT
  rationale: 심판 가운데 닥치는 불안과 질서를 무너뜨리는 상태를 함께 담기 위해 ‘혼란’을 택했습니다. ‘공포’는 감정에 치우치고, ‘소동’은 다소 약합니다.
- source_word: הֵד הָרִים
  english_pob_choice: joyful shouting on the mountains
  chosen_korean: 산들에서의 즐거운 외침
  alternatives_korean:
  - 산들의 환호
  - 산들에서 들리던 즐거운 외침
  - 산 위의 기쁨의 외침
  lexicon: HALOT
  rationale: 마지막 대조구는 산에서 들리던 축제성 외침과 재앙의 대비를 나타내므로, ‘즐거운 외침’으로 그 함의를 보존했습니다. 직역의 ‘메아리’는 대조가 약해집니다.
theological_decisions:
- issue: 희귀 명사 הַצְּפִירָה의 의미 범위
  chosen_reading: 본문의 심판 선포에 맞추어 ‘재앙’으로 처리하되, 희귀어의 불확실성은 영어 POB의 주석으로 보존합니다.
  alternative_readings:
  - 운명
  - 전환점
  - 파멸
  rationale: 히브리어 자체가 난해하므로 한국어 본문에서는 문맥상 확실한 심판 도착을 드러내되, 어휘적 여지는 각주로 남겨야 합니다.
  doctrine_reference: 예언서 번역의 의미 범위 보존 원칙
- issue: 마지막 대조절의 축제적 배경
  chosen_reading: ‘산들에서의 즐거운 외침’으로 옮겨, 심판의 ‘혼란’과 대조되는 기존의 환호를 드러냅니다.
  alternative_readings:
  - 메아리
  - 외침
  - 환호
  rationale: 본문의 대조는 단순한 소리의 유무가 아니라, 평소의 기쁨과 이제 닥친 भय/혼돈의 충돌입니다. 따라서 의미를 분명히 하는 방향이 적절합니다.
  doctrine_reference: 문맥 대조 보존 원칙
