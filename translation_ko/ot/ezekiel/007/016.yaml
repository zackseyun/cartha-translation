id: EZK.7.16
reference: Ezekiel 7:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פָֽלְטוּ֙ פְּלִ֣יטֵי/הֶ֔ם וְ/הָי֣וּ אֶל הֶ/הָרִ֗ים כְּ/יוֹנֵ֧י הַ/גֵּאָי֛וֹת כֻּלָּ֖/ם הֹמ֑וֹת אִ֖ישׁ בַּ/עֲוֺנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/016.yaml
  text: And their survivors will escape and be on the mountains[a], like doves of the valleys, all of them moaning[c][b], each one in his iniquity.
  footnotes:
  - marker: a
    text: Or 'like doves of the ravines.' The Hebrew term can refer to valleys or wadis/ravines.
    reason: lexical_alternative
  - marker: b
    text: Or 'all of them murmuring/cooing'; the Hebrew verb evokes a low sound and, in context, grief.
    reason: lexical_alternative
  - marker: c
    text: Or 'each one because of his guilt' or 'for his punishment'; the Hebrew word can denote iniquity, guilt, or the consequence of guilt.
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 남은 자는 도망하여 산들 위에 있게 될 것이며, 골짜기의 비둘기들처럼 모두가 신음할 것입니다. 각자 자기의 죄악 가운데서입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘골짜기들’이나 ‘와디/협곡들’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 낮게 내는 소리를 가리키며, 여기서는 애통의 뉘앙스를 가집니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘죄악’, ‘죄책’, 또는 죄에 따른 결과를 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּפָלְטוּ פְּלִיטֵיהֶם
  english_pob_choice: And their survivors will escape
  chosen_korean: 그들의 남은 자는 도망하여
  alternatives_korean:
  - 그들의 생존자들은 피하여
  - 그들의 도망친 자들은
  lexicon: HALOT
  rationale: פְּלִיטֵיהֶם은 ‘살아남아 빠져나온 자들/남은 자들’을 가리키므로 ‘남은 자’가 자연스럽고, וּפָלְטוּ의 탈출 동작은 ‘도망하여’로 살렸습니다.
- source_word: וְהָיוּ אֶל הֶהָרִים
  english_pob_choice: and be on the mountains
  chosen_korean: 산들 위에 있게 될 것이며
  alternatives_korean:
  - 산으로 가게 될 것이며
  - 산들을 향해 있게 될 것이며
  lexicon: HALOT
  rationale: היה + אל은 단순한 위치 상태를 나타내므로, 추가 이동을 보태지 않고 ‘산들 위에 있게 될 것’으로 옮겼습니다.
- source_word: כְּיוֹנֵי הַגֵּאָיוֹת
  english_pob_choice: like doves of the valleys
  chosen_korean: 골짜기의 비둘기들처럼
  alternatives_korean:
  - 계곡의 비둘기들처럼
  - 협곡의 비둘기들처럼
  lexicon: HALOT
  rationale: גֵּאָיוֹת는 ‘골짜기/와디/협곡’ 범위를 가지지만, 문맥상 이해가 쉬운 ‘골짜기’로 하되 지형적 이미지는 유지했습니다.
- source_word: כֻּלָּם הֹמֹות
  english_pob_choice: all of them moaning
  chosen_korean: 모두가 신음할 것입니다
  alternatives_korean:
  - 모두가 흐느낄 것입니다
  - 모두가 웅얼거릴 것입니다
  - 모두가 탄식할 것입니다
  lexicon: HALOT
  rationale: המה는 낮게 내는 소리를 뜻해 애통의 뉘앙스를 띠므로, 비둘기 소리와 결합되는 애가적 울림을 살릴 수 있는 ‘신음하다’로 옮겼습니다.
- source_word: בַּעֲוֺנוֹ
  english_pob_choice: in his iniquity
  chosen_korean: 각자 자기의 죄악 가운데서입니다
  alternatives_korean:
  - 각자 자기의 죄악 때문에입니다
  - 각자 자기의 죄책 가운데서입니다
  - 각자 자기의 죄의 결과로입니다
  lexicon: HALOT
  rationale: עָוֹן은 죄악, 죄책, 죄의 결과를 모두 가질 수 있어 범위를 좁히지 않고 ‘죄악 가운데서’로 옮겨, 개인이 자기 죄와 함께/그 안에 놓인 상태를 남겼습니다.
theological_decisions:
- issue: עָוֹן의 의미 범위
  chosen_reading: ‘죄악’으로 옮기되, 죄책과 그에 따른 결과를 한쪽으로 확정하지 않았습니다.
  alternative_readings:
  - 죄책
  - 죄의 형벌
  - 죄의 결과
  rationale: 본문은 각 사람이 자기의 עָוֹן 안에서 신음한다고 말하므로, 단순한 도덕적 잘못만이 아니라 그 죄와 연결된 책임·결과의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
