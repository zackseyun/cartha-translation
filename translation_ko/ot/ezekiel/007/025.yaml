  lexicon: HALOT
  rationale: 찾는 대상이 실제로 존재하지 않음을 분명히 하되, 문장 흐름상 미래적 결과를 자연스럽게 보여 주도록 부정 존재를 한국어로 풀어 옮겼습니다.
