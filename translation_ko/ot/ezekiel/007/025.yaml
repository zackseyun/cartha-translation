    text: ‘고통’으로 옮긴 히브리어 קְפָדָה는 드문 명사입니다. 문맥에 따라 ‘두려움’, ‘공포’, ‘재앙’, ‘환난’으로도 옮길 수 있으며, 심판으로 말미암은 극심한 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
