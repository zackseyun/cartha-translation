  rationale: 예언적 선언의 완료성을 살리면서도 한국어에서 재앙이 실제로 들이닥오는 긴박함을 전달하기 위해 '닥치고'로 옮겼습니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평강
