base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/025.yaml
  text: Anguish has come[a], and they will seek peace, but there is none.
  footnotes:
  - marker: a
    text: Or 'Terror has come,' 'Calamity has come,' or 'Horror has come.' The Hebrew noun is rare and may emphasize either the dread itself or the disastrous condition produced by judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 고통이 닥치고, 그들은 평강을 찾을 것이나 아무것도 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고통’은 희귀 명사 קְפָדָה의 의미 범위를 넓게 잡은 번역입니다. 문맥상 ‘두려움’, ‘공포’, ‘재앙’, ‘환난’도 가능하지만, 여기서는 심판으로 인한 극심한 상태를 포괄합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְפָדָה
  english_pob_choice: anguish
  chosen_korean: 고통
  alternatives_korean:
  - 두려움
  - 재앙
  - 공포
  - 환난
  lexicon: HALOT
  rationale: 희귀 명사로서 심판에 동반되는 극심한 고통과 두려움을 함께 드러내는 말이므로, 문맥상 가장 자연스럽고 포괄적인 표지로 '고통'을 선택했습니다.
- source_word: בָּא
