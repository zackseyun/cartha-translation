  lexicon: פַּלָּצוּת
  rationale: 본문의 엄습하는 공포 상태를 살리되, 문맥상 지나치게 심리적·추상적으로 흐르지 않도록 ‘두려움’으로 옮겼습니다.
- source_word: בּוּשָׁה
  english_pob_choice: shame
  chosen_korean: 수치
  alternatives_korean:
  - 부끄러움
  - 치욕
  lexicon: בּוּשָׁה
  rationale: 얼굴에 드러나는 공개적 수치를 가리키므로 개인 감정보다 강한 ‘수치’가 문맥에 더 가깝습니다.
- source_word: קָרְחָה
  english_pob_choice: baldness
  chosen_korean: 대머리
  alternatives_korean:
