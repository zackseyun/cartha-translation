  - 베옷을 두를 것입니다
  lexicon: שַׂקִּים
  rationale: 맹렬한 애도와 굴욕의 상징인 sackcloth를 현대 한국어에서 가장 자연스럽게 드러내기 위해 ‘굵은 베옷’을 선택했습니다.
- source_word: פַּלָּצוּת
  english_pob_choice: horror
