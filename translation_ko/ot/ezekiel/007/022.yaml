  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲסִבּוֹתִ֤י פָנַ/י֙ מֵ/הֶ֔ם וְ/חִלְּל֖וּ אֶת צְפוּנִ֑/י וּ/בָאוּ בָ֥/הּ פָּרִיצִ֖ים וְ/חִלְּלֽוּ/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/022.yaml
  text: I will turn my face away from them[a], and they will profane my treasured place[b]; violent men will enter it and profane it.
  footnotes:
  - marker: a
    text: Or 'my treasure,' 'my secret place,' or 'my treasured thing.' The Hebrew likely refers to something precious and protected, probably connected with the sanctuary.
    reason: lexical_alternative
  - marker: b
    text: Or 'ruthless men' or 'robbers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 얼굴을 그들에게서 돌이키면, 그들은 내 귀한 것을[a] 더럽힐 것이며, 포악한 사람들이 그것 안으로 들어가 그것을 더럽힐 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 보물’, ‘내 숨은 곳’, 혹은 ‘내 귀한 것’일 수 있습니다. 히브리어는 무엇인가 귀하고 보호된 대상을 가리키며, 문맥상 성소와 관련된 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִבּוֹתִי פָנַי מֵהֶם
  english_pob_choice: I will turn my face away from them
  chosen_korean: 내가 내 얼굴을 그들에게서 돌이키면
  alternatives_korean:
  - 내가 그들에게서 내 얼굴을 돌리면
  - 내가 그들에게서 내 얼굴을 거두면
  lexicon: HALOT
  rationale: ‘얼굴’은 히브리어 관용구를 살리면서 관계적 관심의 거두어짐을 드러내므로, POB의 직역 성격을 유지해 한국어로도 자연스럽게 옮겼습니다.
- source_word: צְפוּנִי
  english_pob_choice: my treasured place
  chosen_korean: 내 귀한 것
  alternatives_korean:
  - 내 보물
  - 내 감춰 둔 것
  - 내 귀한 곳
  lexicon: HALOT
  rationale: 히브리어는 ‘숨겨 둔/간직한/귀한 것’의 범위를 가지며, 문맥상 성소의 침범을 가리키므로 특정 대상을 단정하지 않고 ‘귀한 것’으로 옮겨 긴장과 모호성을 보존했습니다.
- source_word: פָּרִיצִים
  english_pob_choice: violent men
  chosen_korean: 포악한 사람들
  alternatives_korean:
  - 난폭한 사람들
  - 무법자들
  - 침입자들
  lexicon: HALOT
  rationale: פָּרִיצִים의 폭력성과 무법성을 함께 담되, ‘강도’처럼 의미를 좁히지 않도록 ‘포악한 사람들’로 처리했습니다.
- source_word: וְחִלְּלוּ
  english_pob_choice: they will profane
  chosen_korean: 더럽힐 것이며
  alternatives_korean:
  - 욕되게 할 것이며
  - 속되게 할 것이며
  - 성스럽지 않게 할 것이며
  lexicon: HALOT
  rationale: חלל은 거룩한 것을 훼손하는 뜻이므로, 예배 용어로 굳어진 표현보다 문맥에 맞는 ‘더럽히다’로 반복을 살렸습니다.
theological_decisions:
- issue: צְפוּנִי의 대상
  chosen_reading: 성소와 관련된 귀한/보호된 대상이지만, 한국어 본문에서는 특정 물건이나 장소로 단정하지 않고 ‘내 귀한 것’으로 남겼습니다.
  alternative_readings:
  - 내 보물
  - 내 숨은 곳
  - 내 귀한 곳
  rationale: 문맥은 성소 모독을 가리키지만 히브리어 표현 자체는 압축적이고 다의적이므로, POB의 신중함을 따라 해석을 과도하게 좁히지 않았습니다.
  doctrine_reference: 해석상 긴장 보존
- issue: ‘내 얼굴을 돌이키다’의 표현
  chosen_reading: 하나님의 심판적 철회와 언약적 관심의 거두어짐을 나타내는 직설적 표현으로 유지했습니다.
  alternative_readings:
  - 그들을 외면하다
  - 그들에게서 떠나다
  rationale: 히브리어 관용구를 완화하면 관계적·언약적 뉘앙스가 약해지므로, 직역에 가까운 형태를 선택했습니다.
  doctrine_reference: 언약적 심판 표현
