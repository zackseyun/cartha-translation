source:
  edition: WLC
  text: כִּ֣י הַ/מּוֹכֵ֗ר אֶל הַ/מִּמְכָּר֙ לֹ֣א יָשׁ֔וּב וְ/ע֥וֹד בַּ/חַיִּ֖ים חַיָּתָ֑/ם כִּֽי חָז֤וֹן אֶל כָּל הֲמוֹנָ/הּ֙ לֹ֣א יָשׁ֔וּב וְ/אִ֧ישׁ בַּ/עֲוֺנ֛/וֹ חַיָּת֖/וֹ לֹ֥א יִתְחַזָּֽקוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/013.yaml
  text: For the seller will not return to what was sold[a], though they are still alive; for the vision concerning all its multitude will not turn back[e][d][c][b], and no one will strengthen his life in his iniquity.
  footnotes:
  - marker: a
    text: Or 'to the sale,' that is, to the property or possession that was sold.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'while still among the living, their life'—a compressed expression meaning that even if the parties remain alive, the seller will not recover what was sold.
    reason: lexical_alternative
  - marker: c
    text: Or 'against all its multitude.' The preposition can suggest direction toward the whole population under judgment.
    reason: alternative_reading
  - marker: d
    text: Or 'will not be revoked.' The sense is that the announced judgment will not be reversed.
    reason: alternative_reading
  - marker: e
    text: The Hebrew of the final clause is difficult. It likely means that no one will secure his life by means of his iniquity.
    reason: alternative_reading
translation:
  language: ko
  text: 판매하는 사람은 팔린 것[a]으로 다시 돌아가지 못하며, 그들이 아직 살아 있더라도 그렇습니다[b]. 또 그 모든 무리[ [c]]에 관한 환상은 되돌려지지[d] 않을 것이며, 아무도 자기의 악으로 자기 생명을 굳게 하지 못할 것입니다[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘팔림’, 곧 팔린 재산이나 소유물에 이른다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘아직 살아 있는 동안’이라는 압축된 표현으로, 당사자들이 살아 있어도 팔린 것을 되찾지 못한다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 모든 무리를 향해’. 전치사 אֶל은 대상/방향을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘철회되지’. 선언된 심판이 뒤집히지 않는다는 뜻입니다.
    reason: alternative_reading
  - marker: e
    text: 히브리어 마지막 절은 어렵습니다. 문맥상 아무도 자기의 악으로 자기 생명을 굳게 할 수 없다는 뜻일 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמּוֹכֵר
  english_pob_choice: the seller
  chosen_korean: 판매하는 사람
  alternatives_korean:
  - 판매자
  - 파는 사람
  lexicon: HALOT
  rationale: 활동분사를 자연스러운 한국어로 옮기되, 법률·상거래 장면의 구체성을 유지하기 위해 ‘판매하는 사람’으로 풀었습니다.
- source_word: אֶל הַמִּמְכָּר
  english_pob_choice: to what was sold
  chosen_korean: 팔린 것
  alternatives_korean:
  - 판 것
  - 매각된 것
  - 팔린 재산
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 과도하게 구체화하지 않고, ‘되돌아갈 수 없는 대상’이라는 뜻을 살려 ‘팔린 것’으로 옮겼습니다.
- source_word: חָזוֹן אֶל כָּל הֲמוֹנָהּ
  english_pob_choice: the vision concerning all its multitude
  chosen_korean: 그 모든 무리에 관한 환상
  alternatives_korean:
  - 그 모든 무리를 향한 환상
  - 그 모든 무리에 대한 환상
  lexicon: HALOT
  rationale: אֶל의 방향/대상성을 ‘~에 관한’으로 처리해, 심판 선언의 적용 대상을 드러내면서도 ‘against’처럼 해석을 앞서지 않게 했습니다.
- source_word: בַּעֲוֺנ֛וֹ חַיָּת֖וֹ
  english_pob_choice: by his iniquity / in his iniquity
  chosen_korean: 자기의 악으로 자기 생명을
  alternatives_korean:
  - 자기의 죄악 안에서 자기 생명을
  - 자기의 불의로 자기 생명을
  lexicon: HALOT
  rationale: עָוֹן의 기본값인 ‘악/죄악’ 가운데 이 문맥의 도구·수단적 뉘앙스를 살려 ‘~으로’로 옮겼습니다. 뒤의 ‘생명’은 히브리어의 life/life-force를 그대로 반영합니다.
- source_word: לֹא יִתְחַזָּקוּ
  english_pob_choice: will strengthen
  chosen_korean: 굳게 하지 못할 것입니다
  alternatives_korean:
  - 강하게 하지 못할 것입니다
  - 보존하지 못할 것입니다
  - 지키지 못할 것입니다
  lexicon: HALOT
  rationale: 동사의 ‘강하게 하다/견고하게 하다’라는 핵심 이미지를 유지하되, 한국어에서는 결과를 풀어 ‘굳게 하지 못하다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: '마지막 절의 의미: 죄로 생명을 지킬 수 있는가'
  chosen_reading: 아무도 자기의 악으로 자기 생명을 굳게 하지 못한다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 아무도 자기의 악 가운데서 자기 생명을 보존하지 못한다
  - 아무도 자기의 죄악으로 자기 삶을 안전하게 하지 못한다
  rationale: 히브리어 문장이 난해하므로, 문맥상 선언된 심판을 인간의 죄된 수단으로 되돌릴 수 없다는 의미를 유지했습니다. 신학적으로는 죄가 생명을 ‘강화’하거나 ‘안전하게’ 만들 수 없다는 경고를 보존합니다.
  doctrine_reference: 심판의 불가역성과 죄의 무력함을 그대로 유지
