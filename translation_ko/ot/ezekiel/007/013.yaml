theological_decisions:
- issue: '마지막 절의 의미: 죄로 생명을 지킬 수 있는가'
  chosen_reading: 아무도 자기의 악으로 자기 생명을 굳게 하지 못한다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 아무도 자기의 악 가운데서 자기 생명을 보존하지 못한다
  - 아무도 자기의 죄악으로 자기 삶을 안전하게 하지 못한다
  rationale: 히브리어 문장이 난해하므로, 문맥상 선언된 심판을 인간의 죄된 수단으로 되돌릴 수 없다는 의미를 유지했습니다. 신학적으로는 죄가 생명을 ‘강화’하거나 ‘안전하게’ 만들 수 없다는 경고를 보존합니다.
  doctrine_reference: 심판의 불가역성과 죄의 무력함을 그대로 유지
