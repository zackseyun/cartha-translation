reference: Ezekiel 7:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַתָּה֙ הַ/קֵּ֣ץ עָלַ֔יִ/ךְ וְ/שִׁלַּחְתִּ֤י אַפִּ/י֙ בָּ֔/ךְ וּ/שְׁפַטְתִּ֖י/ךְ כִּ/דְרָכָ֑יִ/ךְ וְ/נָתַתִּ֣י עָלַ֔יִ/ךְ אֵ֖ת כָּל תּוֹעֲבֹתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/003.yaml
  text: Now the end is upon you[a], and I will send my anger against you. I will judge you according to your ways, and I will bring all your abominations upon you.
  footnotes:
  - marker: a
    text: Or 'I will lay all your abominations on you.' The Hebrew literally says 'I will give/put upon you all your abominations,' an idiom for bringing the consequences of those abominations upon the hearer.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 너에게 끝이 닥칩니다[a]. 내가 내 분노를 너에게 보내며, 네 길대로 너를 심판하고, 네 모든 가증한 것들을 너에게 내리겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 네 모든 가증한 것들을 네 위에 놓겠습니다.’ 히브리어는 문자적으로 ‘네 위에 네 모든 가증한 것들을 주다/두다’라고 하며, 그 행위의 결과를 너에게 되돌려 부과한다는 관용어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה הַקֵּץ עָלַיִךְ
  english_pob_choice: Now the end is upon you
  chosen_korean: 이제 너에게 끝이 닥칩니다
  alternatives_korean:
  - 이제 끝이 너에게 닥칩니다
  - 지금 끝이 너에게 닥칩니다
  lexicon: HALOT
  rationale: עַתָּה의 즉시성을 ‘이제’로, הַקֵּץ의 결정적 종결을 ‘끝’으로 옮기고, עָלַיִךְ의 ‘upon you’를 한국어의 자연한 도래 표현인 ‘닥칩니다’로 살렸습니다.
- source_word: וְשִׁלַּחְתִּי אַפִּי בָךְ
  english_pob_choice: I will send my anger against you
  chosen_korean: 내가 내 분노를 너에게 보내며
  alternatives_korean:
  - 내가 내 진노를 너에게 보내며
  - 내가 내 분노를 너를 향해 보내며
  lexicon: HALOT
  rationale: אַף의 관용적 의미를 ‘분노’로 옮겼고, שׁלח의 기본 의미를 따라 ‘보내다’를 유지해 히브리어의 직설성을 보존했습니다.
- source_word: וּשְׁפַטְתִּיךְ כִּדְרָכָיִךְ
  english_pob_choice: I will judge you according to your ways
  chosen_korean: 네 길대로 너를 심판하고
  alternatives_korean:
  - 네 행위대로 너를 심판하고
  - 네 길에 따라 너를 재판하고
  lexicon: HALOT
  rationale: דֶּרֶךְ의 도덕적·행동적 의미를 ‘길’로 유지하면서, משפט의 법정적 뉘앙스를 ‘심판하다’로 옮겨 예언적 판결의 무게를 살렸습니다.
- source_word: וְנָתַתִּי עָלַיִךְ אֵת כָּל תּוֹעֲבֹתָיִךְ
  english_pob_choice: I will bring all your abominations upon you
  chosen_korean: 네 모든 가증한 것들을 너에게 내리겠습니다
  alternatives_korean:
  - 네 모든 가증한 것들을 너에게 두겠습니다
  - 네 모든 가증한 일들을 너에게 가져오겠습니다
  lexicon: HALOT
  rationale: נתן + עַל의 관용적 판단 언어를 ‘내리다’로 옮겨 결과를 부과하는 뜻을 살렸고, תּוֹעֵבוֹת의 강한 혐오·우상숭배적 함의를 ‘가증한 것들’로 보존했습니다.
theological_decisions:
- issue: ‘끝’의 성격
  chosen_reading: 장차 닥칠 역사적·예언적 심판의 종결을 가리키는 말로 읽고, 후대의 기술적 종말론으로 확대하지 않았습니다.
  alternative_readings:
  - 우주적 종말의 최종 ‘끝’으로 읽는 해석
  rationale: 문맥이 예루살렘/땅에 임하는 임박한 심판을 말하므로, 원문의 긴박성과 엄중함은 살리되 과잉 종말론화는 피했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 심판 동사의 격조
  chosen_reading: ‘분노’, ‘심판’, ‘가증한 것들’ 같은 직접적 언어를 완화하지 않고 유지했습니다.
  alternative_readings:
  - ‘진노’처럼 더 전통적이지만 덜 직접적인 표현으로 순화
  rationale: 히브리어 본문의 예언적 공세를 한국어에서도 분명하게 드러내는 것이 source-direct 원칙에 더 부합합니다.
  doctrine_reference: Translation philosophy §6
