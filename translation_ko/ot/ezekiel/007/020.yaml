source:
  edition: WLC
  text: וּ/צְבִ֤י עֶדְי/וֹ֙ לְ/גָא֣וֹן שָׂמָ֔/הוּ וְ/צַלְמֵ֧י תוֹעֲבֹתָ֛/ם שִׁקּוּצֵי/הֶ֖ם עָ֣שׂוּ ב֑/וֹ עַל כֵּ֛ן נְתַתִּ֥י/ו לָ/הֶ֖ם לְ/נִדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/020.yaml
  text: And they made the beauty of his ornament into pride[a], and in it they made the images of their abominations, their detestable things[b]; therefore I have made it an unclean thing to them.
  footnotes:
  - marker: a
    text: Or 'they made with it the images of their abominations, their detestable idols.' The Hebrew phrase 'made in/with it' may indicate either location or material/instrument.
    reason: lexical_alternative
  - marker: b
    text: '''Unclean thing'' translates a Hebrew term associated with ritual impurity; alternatively, ''something to be rejected.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그의 장식의 아름다움을 교만으로 삼았고, 그 안에서[a] 그들의 가증한 것들의 형상, 곧 그들의 혐오스러운 것들을 만들었습니다. 그러므로 내가 그것을 그들에게 부정한 것으로[b] 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 안에서’는 בּוֹ가 위치를 가리키는지, 혹은 재료나 수단을 가리키는지 모두 열어 둡니다.
    reason: alternative_reading
  - marker: b
    text: ‘부정한 것’은 의례적 부정함을 가리킬 수 있으며, 문맥상 ‘버려야 할 것’이라는 뜻도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּצְבִי עֶדְיוֹ
  english_pob_choice: the beauty of his ornament
  chosen_korean: 그의 장식의 아름다움
  alternatives_korean:
  - 그의 장식의 화려함
  - 그의 치장의 아름다움
  lexicon: HALOT
  rationale: צְבִי는 여기서 장식의 미적 가치나 화려함을 가리키므로, 한국어로는 자연스럽고 평가적 힘이 살아 있는 ‘아름다움’으로 옮겼습니다.
- source_word: לְגָאוֹן שָׂמָהוּ
  english_pob_choice: made ... into pride
  chosen_korean: 교만으로 삼았고
  alternatives_korean:
  - 자랑거리로 삼았고
  - 자존심으로 만들었고
  lexicon: HALOT
  rationale: גָאוֹן은 문맥상 긍정적 위엄보다 부정적 ‘교만’의 뜻이 강하므로, 변형의 결과를 드러내는 한국어로 ‘교만으로 삼다’를 택했습니다.
- source_word: וְצַלְמֵי תוֹעֲבֹתָם שִׁקּוּצֵיהֶם עָשׂוּ בוֹ
  english_pob_choice: in it they made the images of their abominations, their detestable things
  chosen_korean: 그 안에서 자신의 가증한 것들의 형상, 곧 그들의 혐오스러운 것들을 만들었습니다
  alternatives_korean:
  - 그 안에 그들의 가증한 것들의 형상, 곧 그들의 혐오스러운 것들을 만들었습니다
  - 그것으로 그들의 가증한 것들의 형상, 곧 그들의 혐오스러운 것들을 만들었습니다
  lexicon: HALOT
  rationale: ‘형상’과 ‘가증한 것들’의 두 명사를 살리면서, בּוֹ의 위치/재료 가능성을 열어 두기 위해 ‘그 안에서’로 옮겼습니다.
- source_word: לְנִדָּה
  english_pob_choice: an unclean thing
  chosen_korean: 부정한 것으로
  alternatives_korean:
  - 더러운 것으로
  - 버려야 할 것으로
  lexicon: HALOT
  rationale: נִדָּה는 의례적 부정함을 띠는 말이므로, 본문이 지닌 예배적·도덕적 오염의 힘을 살리는 ‘부정한 것’이 가장 직접적입니다.
theological_decisions:
- issue: 마지막 절의 심판 표지인 לְנִדָּה의 성격
  chosen_reading: 의례적 부정함과 도덕적 혐오를 함께 드러내는 ‘부정한 것’으로 번역했습니다.
  alternative_readings:
  - 버려야 할 것
  - 혐오스러운 것
  rationale: 이 구절은 우상 사용의 더러움에 대한 하나님의 판결을 말하므로, 단순한 폐기나 감정적 혐오보다 정결/부정 범주의 뉘앙스를 함께 보존하는 것이 좋습니다.
  doctrine_reference: 레위기적 정결/부정 개념, 우상숭배에 대한 예언자적 심판
