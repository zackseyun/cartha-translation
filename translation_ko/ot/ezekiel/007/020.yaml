    rationale: '[a]는 בּוֹ(‘그 안에서/그것으로’)의 해석 가능성을, [b]는 לְנִדָּה(‘부정한 것’)의 의미를 설명합니다. 독자가 어느 말에 각주가 연결되는지 분명히 알 수 있도록 각각 해당 어구 직후에 표지해야 합니다.'
