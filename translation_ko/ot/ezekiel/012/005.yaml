lexical_decisions:
- source_word: לְעֵינֵיהֶם
  english_pob_choice: Before their eyes
  chosen_korean: 그들의 눈앞에서
  alternatives_korean:
  - 그들의 시야에서
  - 그들 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구가 ‘그들이 직접 보게 되는 가운데’라는 공개적 장면을 뜻하므로, 구체적 이미지가 살아 있는 ‘눈앞에서’로 옮겼습니다.
- source_word: חֲתָר
  english_pob_choice: dig through
  chosen_korean: 벽을 뚫고
  alternatives_korean:
  - 벽을 파고
  - 벽을 깨고
  lexicon: HALOT
  rationale: 문맥상 벽을 뚫어 구멍을 내는 행위이므로, 물리적 돌파 이미지를 자연스럽게 드러내는 ‘뚫고’가 적절합니다.
- source_word: וְהוֹצֵאתָ
  english_pob_choice: bring out
  chosen_korean: 내보내십시오
  alternatives_korean:
  - 끌어내십시오
  - 가져내십시오
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려 밖으로 나오게 하는 동작을 나타내며, 명령문으로서의 힘도 유지합니다.
- source_word: בּוֹ
  english_pob_choice: through it
  chosen_korean: 그것으로
  alternatives_korean:
  - 그 안으로
  - 그 구멍을 통해
  lexicon: HALOT
  rationale: 대명사 ‘그것’은 앞의 ‘벽’을 가리키며, 한국어에서는 앞말을 되살려 ‘그것으로’라고 해야 ‘그것을 통해’라는 뜻이 자연스럽게 전달됩니다.
