reference: Ezekiel 12:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֶל עַ֣ם הָ/אָ֡רֶץ כֹּֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה לְ/יוֹשְׁבֵ֤י יְרוּשָׁלִַ֨ם֙ אֶל אַדְמַ֣ת יִשְׂרָאֵ֔ל לַחְמָ/ם֙ בִּ/דְאָגָ֣ה יֹאכֵ֔לוּ וּ/מֵֽימֵי/הֶ֖ם בְּ/שִׁמָּמ֣וֹן יִשְׁתּ֑וּ לְמַ֜עַן תֵּשַׁ֤ם אַרְצָ/הּ֙ מִ/מְּלֹאָ֔/הּ מֵ/חֲמַ֖ס כָּֽל הַ/יֹּשְׁבִ֥ים בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/019.yaml
  text: 'And say to the people of the land[a], ‘Thus says the Lord GOD concerning the inhabitants of Jerusalem in the land of Israel: They will eat their bread with anxiety and drink their water with horror[b], so that her land may be made desolate of its fullness because of the violence of all who dwell in it.’'
  footnotes:
  - marker: a
    text: Or 'drink their water with horror' or 'in dismay'; the Hebrew term can denote appalled desolation as well as devastation.
    reason: lexical_alternative
  - marker: b
    text: Or 'that its land may be laid desolate, stripped of all that fills it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 땅의 백성에게 이렇게 말하십시오. “주 야훼께서 이스라엘 땅에 있는 예루살렘 주민들에 대하여 이렇게 말씀하십니다. ‘그들은 불안 속에서 자기들의 빵을 먹고, 참담함 가운데[a] 자기들의 물을 마실 것입니다. 그 땅이 그 안에 가득한 것을 잃고 황폐하게 될 것이니, 이는 그 안에 사는 모든 이의 폭력 때문입니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּשִׁמָּמוֹן은 ‘황폐함’을 뜻할 수도 있으며, ‘공포’ 또는 ‘경악’의 뉘앙스를 나타낼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם הָאָרֶץ
  english_pob_choice: the people of the land
  chosen_korean: 그 땅의 백성
  alternatives_korean:
  - 그 땅의 사람들
  - 그 지역의 백성
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리되, 에스겔 문맥에서 특정 사회계층 용어로 과도하게 좁히지 않도록 ‘그 땅의 백성’으로 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 이 절의 결합 호칭은 ‘주’와 언약명 ‘야훼’를 함께 살리는 것이 원문 구조를 가장 분명하게 반영합니다.
- source_word: בִּדְאָגָה
  english_pob_choice: with anxiety
  chosen_korean: 두려움 속에서
  alternatives_korean:
  - 불안 속에서
  - 걱정 속에서
  lexicon: HALOT
  rationale: 명사 דְאָגָה는 단순한 걱정보다 절박한 불안과 두려움을 포함하므로, 식량 부족의 공포를 드러내는 표현을 택했습니다.
- source_word: בְּשִׁמָּמוֹן
  english_pob_choice: with horror / in desolation
  chosen_korean: 황폐함 속에서
  alternatives_korean:
  - 공포 속에서
  - 참담함 속에서
  - 황망함 속에서
  lexicon: HALOT
  rationale: 이 단어는 공포와 황폐의 뉘앙스를 함께 가지며, 뒤의 ‘그 땅이 황폐해지게’와 어근상 연결되므로 ‘황폐함 속에서’로 통일감을 살렸습니다.
- source_word: תֵּשַׁם אַרְצָהּ מִמְּלֹאָהּ
  english_pob_choice: her land may be made desolate of its fullness
  chosen_korean: 그 땅이 그 충만함에서 황폐해지게 하려는 것이니
  alternatives_korean:
  - 그 땅이 그 가득한 것에서 황폐해지게 하려는 것이니
  - 그 땅이 그 풍성함에서 비게 하려는 것이니
  lexicon: HALOT
  rationale: ‘מְלֹא’의 ‘가득함/충만함’을 유지하면서, 예언적 심판 문맥에 맞는 ‘황폐해지다’를 사용해 원문의 이미지와 결과를 함께 살렸습니다.
- source_word: כָּל הַיֹּשְׁבִים בָּהּ
  english_pob_choice: all who dwell in it
  chosen_korean: 그 안에 사는 모든 사람
  alternatives_korean:
  - 그 안에 거하는 모든 이
  - 그 안에 거주하는 모든 사람
  lexicon: HALOT
  rationale: 분사적 표현을 자연스러운 현대 한국어로 옮기되, 대상을 포괄하는 의미를 유지했습니다.
theological_decisions:
- issue: 예언 선포의 직접 화법에서의 호칭과 문체
  chosen_reading: 주 야훼께서 말씀하시는 직접 인용을 그대로 두고, 예언 전달문은 합쇼체로 유지했습니다.
  alternative_readings:
  - 전문을 서술형으로 평평하게 옮김
  - ‘주 하나님’으로 일반화함
  rationale: 히브리어의 선포 형식과 하나님 직접 발화를 구분해, 예언자의 전달 문체와 하나님의 발화 권위를 동시에 드러내기 위해서입니다.
  doctrine_reference: 성경 본문 문체 보존 원칙
