id: EZK.12.14
reference: Ezekiel 12:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר סְבִיבֹתָ֥י/ו עזר/ה וְ/כָל אֲגַפָּ֖י/ו אֱזָרֶ֣ה לְ/כָל ר֑וּחַ וְ/חֶ֖רֶב אָרִ֥יק אַחֲרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/014.yaml
  text: And all who are around him—his helpers and all his troops—I will scatter to every wind[b][a], and I will draw out a sword after them.
  footnotes:
  - marker: a
    text: Or 'his helpers' for 'his help'; the Hebrew uses a collective expression that may refer to those assisting him.
    reason: lexical_alternative
  - marker: b
    text: Literally 'to every wind,' that is, in every direction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그를 둘러싼 모든 것—곧 그의 도와주는 자들과 그의 모든 군대—를 내가 사방의 바람으로 흩어 버리고, 그들 뒤로 칼을 빼어 들겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바람마다/모든 바람으로’라는 표현으로, 사방으로 흩어짐을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתָיו
  english_pob_choice: who are around him
  chosen_korean: 그를 둘러싼 모든 것
  alternatives_korean:
  - 그를 둘러싼 자들
  - 그 주변에 있는 이들
  lexicon: HALOT
  rationale: 주변에 있는 사람들을 가리키는 관계적 표현이므로, 자연스러운 한국어로 풀되 ‘둘러싼’으로 원문의 공간적 관계를 살렸습니다.
- source_word: עֶזְרָה
  english_pob_choice: his helpers
  chosen_korean: 그의 도와주는 자들
  alternatives_korean:
  - 그의 도움
  - 그를 돕는 자들
  lexicon: HALOT
  rationale: 추상명사 ‘도움’이 아니라 사람들을 가리키므로, 문맥에 맞게 행위자성을 드러내는 표현을 택했습니다.
- source_word: אֲגַפָּיו
  english_pob_choice: his troops
  chosen_korean: 그의 모든 군대
  alternatives_korean:
  - 그의 부대들
  - 그의 분견대들
  lexicon: HALOT
  rationale: 군사적·집단적 맥락을 살려 ‘군대’로 옮겼고, 전부를 뜻하는 ‘모든’을 더해 포괄성을 반영했습니다.
- source_word: לְכָל רוּחַ
  english_pob_choice: to every wind
  chosen_korean: 사방의 바람으로
  alternatives_korean:
  - 온 사방으로
  - 모든 방향으로
  lexicon: HALOT
  rationale: 히브리어의 관용적 이미지를 그대로 살리면서도 한국어에서 이해 가능한 표현으로 옮겼습니다.
- source_word: חֶרֶב אָרִיק אַחֲרֵיהֶם
  english_pob_choice: I will draw out a sword after them
  chosen_korean: 그들 뒤로 칼을 빼어 들겠습니다
  alternatives_korean:
  - 그들을 뒤쫓아 칼을 빼겠습니다
  - 그들 뒤에 칼을 뽑겠습니다
  lexicon: HALOT
  rationale: ‘칼을 빼어 들다’는 전투적 위협을 자연스럽게 전달하며, ‘뒤로’로 पीछୋ감 있는 추격의 뉘앙스를 반영했습니다.
theological_decisions:
- issue: 예언적 심판 선언의 화자와 시제
  chosen_reading: 야훼의 직접 심판 선언으로 이해하여, 1인칭 미래형으로 옮겼습니다.
  alternative_readings:
  - 단순한 미래 서술로 완화하는 읽기
  - 명령문처럼 처리하는 읽기
  rationale: 본문은 예언 속 신적 발화를 직접적으로 전달하므로, 한국어에서도 단호한 1인칭 미래형을 유지해야 심판 선언의 무게가 살아납니다.
  doctrine_reference: 예언서의 신적 발화와 심판 선언의 직접성
- issue: ‘사방의 바람’ 이미지 보존
  chosen_reading: 직역적 이미지를 유지하되 의미는 문맥상 흩어짐으로 이해되도록 했습니다.
  alternative_readings:
  - ‘사방으로’로 완전 의역
  - 각 방향으로 풀어 설명
  rationale: 히브리어 관용구의 시각적·수사적 힘을 보존하는 것이 본문의 예언적 긴장을 더 잘 드러냅니다.
  doctrine_reference: 본문 이미지의 수사적 보존 원칙
