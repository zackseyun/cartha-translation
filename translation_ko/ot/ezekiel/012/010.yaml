base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/010.yaml
  text: 'Say to them[a], ‘Thus says the Lord GOD: This burden concerns the prince in Jerusalem and all the house of Israel who are in their midst.’'
  footnotes:
  - marker: a
    text: Or 'This oracle is about the prince in Jerusalem and all the house of Israel who are among them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 말하십시오. 「주 야훼께서 이렇게 말씀하십니다. 이 징벌은 예루살렘의 그 지도자와 그들 가운데 있는 온 이스라엘의 집을 가리킵니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 신탁은 예루살렘의 그 지도자와 그들 가운데 있는 온 이스라엘의 집에 관한 것입니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֱמֹר אֲלֵיהֶם
  english_pob_choice: Say to them
  chosen_korean: 그들에게 말하십시오
  alternatives_korean:
  - 그들에게 말하세요
  - 그들에게 전하십시오
  lexicon: HALOT
  rationale: 예언 도입문의 명령형을 자연스럽고 공손한 합쇼체로 옮겼습니다. 내용 전달보다 직접 발화를 여는 기능이 핵심입니다.
- source_word: אֲדֹנָי יְהֹוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 본문의 주어는 주권 호칭 אֲדֹנָי와 언약명 יְהוָה의 결합이므로, POB 기본값에 따라 야훼를 유지했습니다. 한국어에서는 '주 야훼'가 중복을 피하면서도 원문의 결합을 드러냅니다.
- source_word: הַמַּשָּׂא
  english_pob_choice: This burden concerns
  chosen_korean: 이 징벌은
  alternatives_korean:
  - 이 짐은
  - 이 예언은
  - 이 신탁은
  lexicon: HALOT
  rationale: מַשָּׂא의 기본 이미지인 '짐/무거운 부담'과 예언적 무게를 살리되, 한국어 문맥에서는 '징벌'이 이 장의 심판 선언과 가장 직접적으로 맞닿습니다. 다만 대안 의미인 '예언/신탁'도 가능하다는 점은 본문 맥락에서 유지했습니다.
- source_word: אֲשֶׁר הֵמָּה בְתוֹכָם
  english_pob_choice: who are in their midst
  chosen_korean: 그들 가운데 있는
  alternatives_korean:
  - 그들 가운데에 있는
  - 그들 한가운데 있는
  lexicon: HALOT
  rationale: 히브리어의 짧은 관계절을 한국어에서 자연스럽게 풀어 '그들 가운데 있는'으로 옮겼습니다. 대명사 참조를 애매하게 만들지 않으면서 원문의 공간적 표현을 보존합니다.
theological_decisions:
- issue: מַשָּׂא의 한국어 의미 선택
  chosen_reading: 이 징벌은
  alternative_readings:
  - 이 짐은
  - 이 예언은
  - 이 신탁은
  rationale: POB의 영어 초안은 원래 'burden'을 유지하려 했고, 이후 'oracle'로의 수정이 있었지만 최종적으로는 다시 'burden' 계열의 긴장을 살리는 방향이 확인됩니다. 한국어에서는 단순한 중립어보다 심판 문맥의 무게를 드러내는 표현이 본문 의도에 더 부합합니다.
  doctrine_reference: Ezekiel의 심판 선포 문맥에서 מַשָּׂא의 예언적 무게를 보존하는 번역 원칙
