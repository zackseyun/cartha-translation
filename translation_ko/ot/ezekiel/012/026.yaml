id: EZK.12.26
reference: Ezekiel 12:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/026.yaml
  text: And the word of Yahweh came to me, saying,
translation:
  language: ko
  text: 야훼의 말씀이 내게 임하여 말씀하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 임하여
  alternatives_korean:
  - 왔습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 예언 서문의 관용구에서 ‘와서 임하다’는 의미를 자연스럽게 살리면서, 영어 POB의 ‘came’을 한국어로 과도하게 직역하지 않도록 했습니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언 공식 ‘야훼의 말씀’은 한국어 성경에서 확립된 표현이며, ‘메시지’보다 원문의 문체적·신학적 무게를 더 잘 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: P O B의 일관된 원칙에 따라 여호와나 주로 대체하지 않고, 신명기적·언약적 고유명사로서 ‘야훼’를 유지했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르며
  - 말하여
  lexicon: HALOT
  rationale: 뒤따르는 직접 화법을 여는 기능을 한국어에서는 중복된 ‘말씀’보다 종결 동사로 자연스럽게 반영하는 편이 합쇼체 문장에 더 적합합니다.
theological_decisions:
- issue: 예언 서문의 주어와 발화 형식
  chosen_reading: ‘야훼의 말씀이 내게 임하여 말씀하셨습니다’로, 말씀 자체가 주체적으로 선포되는 예언 공식의 무게를 유지했습니다.
  alternative_readings:
  - ‘야훼께서 내게 말씀하셨습니다’
  - ‘야훼의 말씀이 내게 왔습니다’
  rationale: 히브리어는 단순한 전달보다 ‘말씀’의 도래와 발화를 강조하는 예언적 공식이므로, 이를 평이한 인칭 서술로 완화하지 않았습니다.
  doctrine_reference: 예언 서문 공식과 하나님의 자기계시의 주체성
- issue: 합쇼체 안에서의 신적 발화 표지
  chosen_reading: 서술은 합쇼체로 유지하되, 야훼의 직접 발화가 열리는 구조를 보이기 위해 ‘말씀하셨습니다’를 사용했습니다.
  alternative_readings:
  - 전부 평서형으로 단순화
  - 직설적인 인용부호만 사용
  rationale: 한국어 문체상 공손한 서술을 유지하면서도, 원문의 예언적 권위를 약화시키지 않기 위한 선택입니다.
  doctrine_reference: 성경 한국어 번역의 문체와 경외의 표현
