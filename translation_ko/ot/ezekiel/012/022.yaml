source:
  edition: WLC
  text: בֶּן אָדָ֗ם מָֽה הַ/מָּשָׁ֤ל הַ/זֶּה֙ לָ/כֶ֔ם עַל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר יַֽאַרְכוּ֙ הַ/יָּמִ֔ים וְ/אָבַ֖ד כָּל חָזֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/022.yaml
  text: Son of man[a], what is this proverb that you have in the land of Israel, saying, ‘The days drag on, and every vision comes to nothing’?”
  footnotes:
  - marker: a
    text: Or “The days are prolonged, and every vision fails.”
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 이스라엘 땅에서 너희가 ‘날들이 길어지고 모든 환상이 사라진다’라고 말하는 이 속담이 무엇이냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “날들이 지연되고, 모든 환상이 실패한다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔에서 반복되는 하나님의 호칭을 한국어에서 가장 자연스럽게 살리면서도, 고정된 호칭성을 유지하기 위해 ‘인자야’를 택했습니다.
- source_word: מָה הַמָּשָׁל הַזֶּה
  english_pob_choice: what is this proverb
  chosen_korean: 이 속담이 무엇이냐
  alternatives_korean:
  - 이 비유가 무엇이냐
  - 이 말이 무엇이냐
  lexicon: HALOT
  rationale: מָשָׁל은 여기서 이야기 비유가 아니라 떠도는 경구·속담을 가리키므로, 현대 한국어에서도 조롱 섞인 유행어 느낌을 주는 ‘속담’이 가장 맞습니다.
- source_word: יַאַרְכוּ הַיָּמִים
  english_pob_choice: The days drag on
  chosen_korean: 날들이 지연되고
  alternatives_korean:
  - 날들이 길어지고
  - 날들이 더디 지나가고
  lexicon: HALOT
  rationale: 직역하면 ‘날들이 길어진다’이지만, 문맥의 냉소적 뉘앙스를 살려 ‘지연되고’로 옮겼습니다.
- source_word: וְאָבַד כָּל חָזוֹן
  english_pob_choice: and every vision comes to nothing
  chosen_korean: 모든 환상이 사라진다
  alternatives_korean:
  - 모든 환상이 헛되게 된다
  - 모든 환상이 실패한다
  lexicon: HALOT
  rationale: אָבַד는 ‘망하다/사라지다/소멸하다’의 뜻이므로, 예언 성취가 무산된다는 조롱을 드러내는 ‘사라진다’가 자연스럽습니다.
theological_decisions:
- issue: 에스겔의 반복적 호칭 בֶּן אָדָם 번역
  chosen_reading: ‘인자야’로 고정해 문학적 반복성과 신탁의 직접성을 유지했습니다.
  alternative_readings:
  - 사람의 아들아
  - 인간아
  rationale: 여기서는 기독론적 칭호가 아니라 예언자에게 주어지는 호칭이므로, 전통적 예수 칭호 연상을 최소화하면서도 본문의 형식을 유지하는 번역이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: prophetic address forms; context governs אָדָם rendering'
