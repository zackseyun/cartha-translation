  - 더는 끌리지 않을 것입니다
  lexicon: HALOT
  rationale: 문맥상 성취의 지연을 가리키므로, 현대 한국어에서 분명한 ‘지연되다’를 선택했고 ‘더는’으로 지연의 종료를 드러냈습니다.
- source_word: כָּל דְּבָרַי
  english_pob_choice: None of my words
  chosen_korean: 내 모든 말
  alternatives_korean:
