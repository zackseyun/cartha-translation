translation:
  language: ko
  text: 그러므로 그들에게 말하십시오. ‘주 야훼께서 이렇게 말씀하십니다. 내 말은 하나도 더 이상 지연되지 않을 것입니다. 내가 말하는 것은 이루어질 것입니다.’ 주 야훼의 선언입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘더 이상 끌리거나 길어지지 않을 것이다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그래서
  lexicon: HALOT
  rationale: 앞선 맥락에서 결론을 이끄는 접속이므로, 예언문에서 자연스럽고 격식 있는 ‘그러므로’로 옮겼습니다.
