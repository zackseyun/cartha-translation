source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֲלֵי/הֶ֗ם כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה לֹא תִמָּשֵׁ֥ךְ ע֖וֹד כָּל דְּבָרָ֑/י אֲשֶׁ֨ר אֲדַבֵּ֤ר דָּבָר֙ וְ/יֵ֣עָשֶׂ֔ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/028.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: None of my words will be delayed any longer, but the word that I speak will be done,’ declares the Lord GOD.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''will not be prolonged/drawn out any longer.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들에게 말하십시오. ‘주 야훼께서 이렇게 말씀하십니다. 내 모든 말이 더는 지연되지 않을 것입니다. 내가 말하는 그 말은 이루어질 것입니다.’ 주 야훼의 말씀이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘더는 끌리지/늘어나지 않을 것이다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그래서
  lexicon: HALOT
  rationale: 앞선 맥락에서 결론을 이끄는 접속이므로, 예언문에서 자연스럽고 격식 있는 ‘그러므로’로 옮겼습니다.
- source_word: אֱמֹר אֲלֵיהֶם
  english_pob_choice: say to them
  chosen_korean: 그들에게 말하십시오
  alternatives_korean:
  - 그들에게 말하시오
  - 그들에게 전하십시오
  lexicon: HALOT
  rationale: 예언자에게 주어진 직접 명령을 합쇼체로 살리면서, 단순한 전달 행위인 ‘말하다’를 유지했습니다.
- source_word: לֹא תִמָּשֵׁךְ עוֹד
  english_pob_choice: will be delayed any longer
  chosen_korean: 더는 지연되지 않을 것입니다
  alternatives_korean:
  - 더는 길어지지 않을 것입니다
  - 더는 끌리지 않을 것입니다
  lexicon: HALOT
  rationale: 문맥상 성취의 지연을 가리키므로, 현대 한국어에서 분명한 ‘지연되다’를 선택했고 ‘더는’으로 지연의 종료를 드러냈습니다.
- source_word: כָּל דְּבָרַי
  english_pob_choice: None of my words
  chosen_korean: 내 모든 말
  alternatives_korean:
  - 내 말들 하나도
  - 내 모든 말씀
  lexicon: HALOT
  rationale: 히브리어의 총칭적 부정을 한국어에서는 ‘내 모든 말’로 자연스럽게 풀어, 하나도 빠짐없이 이루어진다는 뜻을 살렸습니다.
- source_word: וְיֵעָשֶׂה
  english_pob_choice: will be done
  chosen_korean: 이루어질 것입니다
  alternatives_korean:
  - 행해질 것입니다
  - 성취될 것입니다
  lexicon: HALOT
  rationale: 하나님의 말씀의 실현을 가리키므로, 현대어로도 분명한 결과 완료 뉘앙스를 주는 ‘이루어지다’를 택했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주님 야훼
  lexicon: HALOT
  rationale: 복합 호칭의 긴장감을 보존하면서, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮기고 אֲדֹנָי와 함께 ‘주 야훼’로 표기했습니다.
theological_decisions:
- issue: 신적 발화의 권위 표지인 ‘declares the Lord GOD’의 한국어 처리
  chosen_reading: ‘주 야훼의 말씀이십니다’로 마무리했습니다.
  alternative_readings:
  - ‘주 야훼께서 말씀하십니다’
  - ‘주 야훼의 선언입니다’
  rationale: 예언 공식을 한국어에서 자연스럽게 닫으면서도, 단순 서술보다 하나님의 직접 발화를 더 분명히 드러내기 위해 존대 종결을 사용했습니다.
  doctrine_reference: 예언서의 화자-대언자 구조와 신적 권위 표지
