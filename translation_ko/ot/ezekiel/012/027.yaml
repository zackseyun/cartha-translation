  yaml_path: translation/ot/ezekiel/012/027.yaml
  text: Son of man, look, the house of Israel is saying, ‘The vision that he sees is for many days from now, and he prophesies about distant times.’
translation:
  language: ko
  text: 「인자야, 보라, 이스라엘 집이 말하기를 ‘그가 보는 환상은 여러 날 뒤의 일이며, 그는 먼 때들에 대해 예언한다’」고 합니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘인자’는 에스겔서에서 선지자를 부르는 호칭입니다.
    reason: cross_reference
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 인자여
  lexicon: 인자
  rationale: 에스겔서의 관용적 호칭을 직역하기보다, 같은 문맥에서 선지자를 부르는 소명형을 한국어 성경체에 맞게 살려 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: look
  chosen_korean: 보라
  alternatives_korean:
  - 봐라
  - 주목하라
  lexicon: 보라
  rationale: 화자의 주의를 끄는 감탄사로서 간결하고 직접적인 명령형을 유지했습니다.
- source_word: לְ/יָמִ֣ים רַבִּ֑ים
  english_pob_choice: for many days from now
  chosen_korean: 여러 날 뒤의 일
  alternatives_korean:
  - 많은 날 후의 일
  - 오랜 날 뒤의 일
  lexicon: 날
  rationale: 시간적 거리감을 살리면서도 한국어에서 자연스러운 관용으로, ‘many days from now’의 미래 지연감을 표현했습니다.
- source_word: וּ/לְ/עִתִּ֥ים רְחוֹק֖וֹת
  english_pob_choice: about distant times
  chosen_korean: 먼 때들에 대해
  alternatives_korean:
  - 멀리 떨어진 때에 대해
  - 먼 시기에 대해
  lexicon: 때
  rationale: 복수형 ‘때들’을 반영해 기간의 비정상적, 예언적 거리감을 드러내면서도 의미를 과장하지 않았습니다.
theological_decisions:
- issue: ‘בֶּן אָדָם’의 한국어 호칭 처리
  chosen_reading: 에스겔의 소명 호칭으로서 ‘인자야’를 사용했습니다.
  alternative_readings:
  - 사람의 아들아
  - 인자여
  rationale: 본문은 예수의 칭호가 아니라 에스겔에게 주어진 선지자적 호칭이므로, 문맥상 기능을 살려 번역했습니다.
  doctrine_reference: 에스겔 2:1-3의 반복적 호칭 관습
