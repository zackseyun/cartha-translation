base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/018.yaml
  text: Son of man[a], eat your bread with trembling[b], and drink your water with quaking and anxiety.
  footnotes:
  - marker: a
    text: Or 'with quaking' for 'with trembling'; the Hebrew noun רַעַשׁ can denote shaking or trembling.
    reason: lexical_alternative
  - marker: b
    text: Or 'with trembling and anxiety'; the two Hebrew nouns for the manner of drinking overlap in the sense of agitation and fear.
    reason: lexical_alternative
translation:
  language: ko
  text: “인자야, 떨며 네 떡을 먹고, 떨림과 불안 속에서 네 물을 마시라.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인자’는 에스겔서에서 반복되는 신적 호칭으로, 문자적으로는 ‘사람의 아들’입니다.
    reason: source_note
  - marker: b
    text: 히브리어 두 명사(‘떨림/흔들림’, ‘불안/염려’)는 의미가 겹치므로, 한국어에서는 중복 감각을 살려 합쳐 번역했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
