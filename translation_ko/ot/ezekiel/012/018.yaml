  - 인자
  lexicon: HALOT
  rationale: 에스겔서의 반복되는 신적 호칭을 살리기 위해 직역에 가까운 ‘인자’를 쓰되, 한국어 호격을 반영해 ‘인자야’로 옮겼습니다.
- source_word: בְּרַעַשׁ
  english_pob_choice: with trembling
  chosen_korean: 떨며
