    text: 히브리어는 물을 마시는 방식에 ‘떨림’ 또는 ‘동요’와 ‘불안’ 또는 ‘염려’를 함께 사용합니다. 두 표현은 두려움에 따른 외적 동요와 내적 불안을 함께 나타냅니다.
