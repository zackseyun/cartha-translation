  rationale: 신체적 떨림/흔들림을 간결한 동사 보조형으로 살려, 먹는 행위 자체가 두려움 속에서 이루어지는 장면을 자연스럽게 드러냈습니다.
- source_word: וּמֵימֶיךָ
  english_pob_choice: and your water
  chosen_korean: 네 물을
  alternatives_korean:
  - 네 물을
  - 네 식수를
  lexicon: HALOT
  rationale: 히브리어의 복수형적 표현을 한국어의 자연스러운 단수형 ‘물’로 옮기되, 구체적인 음용 행위를 보존했습니다.
- source_word: בְּרָגְזָה וּבִדְאָגָה
  english_pob_choice: with quaking and anxiety
  chosen_korean: 떨림과 불안 속에서
  alternatives_korean:
  - 떨림과 염려 속에서
  - 흔들림과 불안 속에서
  lexicon: HALOT
  rationale: 두 명사가 가리키는 겹치는 긴장과 두려움을 살리면서, 한국어에서는 음식·음료 전체를 수식하는 관용적 표현으로 한 번에 묶어 자연스럽게 옮겼습니다.
