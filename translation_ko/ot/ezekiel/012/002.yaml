  rationale: 공동체 내부에 놓여 있다는 공간적 긴밀함을 자연스럽게 드러내는 표현으로 '한가운데에'를 선택했습니다.
- source_word: בֵּית הַמֶּרִי / בֵּית מְרִי
  english_pob_choice: a rebellious house
  chosen_korean: 반역하는 집
  alternatives_korean:
  - 반역한 집
  - 반역의 집
  - 패역한 집
  lexicon: HALOT
  rationale: 히브리어의 '집'을 공동체 지칭의 비유로 살리면서, POB의 'rebellious house'에 대응해 '반역하는 집'으로 옮겨 반복되는 예언적 어조를 유지했습니다.
- source_word: עֵינַיִם לָהֶם לִרְאוֹת וְלֹא רָאוּ / אָזְנַיִם לָהֶם לִשְׁמֹעַ וְלֹא שָׁמֵעוּ
  english_pob_choice: have eyes to see but do not see / ears to hear but do not hear
  chosen_korean: 볼 눈이 있어도 보지 못하고 들을 귀가 있어도 듣지 못합니다
  alternatives_korean:
  - 보는 눈이 있어도 보지 못하고 듣는 귀가 있어도 듣지 못합니다
  - 볼 눈은 있어도 보지 못하고 들을 귀는 있어도 듣지 못합니다
  lexicon: HALOT
  rationale: 히브리어의 감각기관 병렬을 한국어 관용과 예언 문체를 함께 살려 옮겼습니다. 동사 앞의 목적형 '볼/들을'은 기능을 강조하고, '보지 못하고/듣지 못합니다'로 원문의 대조를 분명히 했습니다.
theological_decisions:
