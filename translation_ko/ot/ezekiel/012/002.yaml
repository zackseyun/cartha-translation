  text: בֶּן אָדָ֕ם בְּ/ת֥וֹךְ בֵּית הַ/מֶּ֖רִי אַתָּ֣ה יֹשֵׁ֑ב אֲשֶׁ֣ר עֵינַיִם֩ לָ/הֶ֨ם לִ/רְא֜וֹת וְ/לֹ֣א רָא֗וּ אָזְנַ֨יִם לָ/הֶ֤ם לִ/שְׁמֹ֨עַ֙ וְ/לֹ֣א שָׁמֵ֔עוּ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/002.yaml
  text: Son of man[a], you dwell in the midst of a rebellious house, who have eyes to see but do not see, ears to hear but do not hear[b], for they are a rebellious house.
  footnotes:
  - marker: a
    text: Or 'a house of rebellion' or 'a rebellious people.' The Hebrew 'house' is a corporate term for the people as a whole.
    reason: lexical_alternative
  - marker: b
    text: Literally 'eyes are to them to see, and they do not see; ears are to them to hear, and they do not hear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 너는 반역하는 집 한가운데에 살고 있습니다. 그들은 볼 눈이 있어도 보지 못하고 들을 귀가 있어도 듣지 못합니다. 그들이 반역하는 집이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''집''은 여기서 한 집안이 아니라 이스라엘 공동체 전체를 가리키는 집단적 표현입니다.'
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 '볼 눈이 그들에게 있고, 그들이 보지 않으며; 들을 귀가 그들에게 있고, 그들이 듣지 않습니다'라는 구조입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인자여
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서의 대표적 호칭을 한국어 성서에서 널리 알려진 대응인 '인자'로 옮기되, 직접 호명형에 맞게 '-야'를 붙여 문맥의 부름을 살렸습니다.
- source_word: בְּתוֹךְ
  english_pob_choice: in the midst of
  chosen_korean: 한가운데에
  alternatives_korean:
  - 가운데에
  - 한복판에
  - 가운데서
  lexicon: HALOT
  rationale: 공동체 내부에 놓여 있다는 공간적 긴밀함을 자연스럽게 드러내는 표현으로 '한가운데에'를 선택했습니다.
- source_word: בֵּית הַמֶּרִי / בֵּית מְרִי
  english_pob_choice: a rebellious house
  chosen_korean: 반역하는 집
  alternatives_korean:
  - 반역한 집
  - 반역의 집
  - 패역한 집
  lexicon: HALOT
  rationale: 히브리어의 '집'을 공동체 지칭의 비유로 살리면서, POB의 'rebellious house'에 대응해 '반역하는 집'으로 옮겨 반복되는 예언적 어조를 유지했습니다.
- source_word: עֵינַיִם לָהֶם לִרְאוֹת וְלֹא רָאוּ / אָזְנַיִם לָהֶם לִשְׁמֹעַ וְלֹא שָׁמֵעוּ
  english_pob_choice: have eyes to see but do not see / ears to hear but do not hear
  chosen_korean: 볼 눈이 있어도 보지 못하고 들을 귀가 있어도 듣지 못합니다
  alternatives_korean:
  - 보는 눈이 있어도 보지 못하고 듣는 귀가 있어도 듣지 못합니다
  - 볼 눈은 있어도 보지 못하고 들을 귀는 있어도 듣지 못합니다
  lexicon: HALOT
  rationale: 히브리어의 감각기관 병렬을 한국어 관용과 예언 문체를 함께 살려 옮겼습니다. 동사 앞의 목적형 '볼/들을'은 기능을 강조하고, '보지 못하고/듣지 못합니다'로 원문의 대조를 분명히 했습니다.
theological_decisions:
- issue: '''house''를 공동체 비유로 유지할지 여부'
  chosen_reading: '''집''을 그대로 유지해 이스라엘 공동체를 가리키는 비유를 살렸습니다.'
  alternative_readings:
  - 사람들
  - 공동체
  - 백성
  rationale: 본문의 반복되는 '집' 표지는 단순한 집안이 아니라 집단 전체를 가리키는 예언적 은유이므로, 의미를 풀어 쓰기보다 비유 자체를 보존하는 편이 본문 효과를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms)
