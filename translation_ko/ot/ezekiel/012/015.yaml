lexical_decisions:
- source_word: וְיָדְעוּ
  english_pob_choice: And they will know
  chosen_korean: 그리고 그들이 ... 알게 될 것입니다
  alternatives_korean:
  - 그리고 그들이 ... 알게 됩니다
  - 그들이 ... 알 것입니다
  lexicon: HALOT
  rationale: 예언적 결과를 나타내는 완료형을 한국어 미래/결과 표현으로 옮겼으며, 에스겔의 인식 공식에 맞게 자연스러운 합쇼체로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 전통적 신명 표기 관행
  rationale: 프로젝트 기본값에 따라 신명은 음역 ‘야훼’로 옮겨, 원문이 드러내는 언약 이름을 보존했습니다.
- source_word: בַּהֲפִיצִי ... בַּגּוֹיִם
  english_pob_choice: when I scatter them among the nations
  chosen_korean: 내가 그들을 민족들 가운데 흩을 때에
  alternatives_korean:
  - 내가 그들을 나라들 가운데 흩을 때에
  - 내가 그들을 이방인들 가운데 흩을 때에
  lexicon: HALOT
  rationale: ב + 히필 부정사구를 시간적 표현으로 살려 ‘...할 때에’로 옮겼고, גּוֹיִם은 구약 문맥에 맞게 ‘민족들’로 번역했습니다.
- source_word: וְזֵרִיתִי ... בָּאֲרָצוֹת
  english_pob_choice: and disperse them through the lands
  chosen_korean: 내가 그들을 여러 땅에 흩어 버릴 것입니다
  alternatives_korean:
  - 내가 그들을 여러 땅으로 흩을 것입니다
  - 내가 그들을 땅들 가운데 흩어 버릴 것입니다
  lexicon: HALOT
  rationale: זרה의 분산 이미지를 ‘흩어 버리다’로 강하게 살렸고, אֲרָצוֹת의 복수를 ‘여러 땅’으로 자연스럽게 옮겼습니다.
