revisions:
- from: 그리고 그들이 내가 야훼임을 알게 될 것입니다. 내가 그들을 민족들 가운데 흩을 때에, 내가 그들을 여러 땅에 흩어 버릴 것입니다.[a]
  to: 내가 그들을 민족들 가운데 흩어 보내고 여러 땅에 흩어 놓을 때, 그들은 내가 야훼인 줄 알게 될 것입니다.
  rationale: The revision places the temporal scattering-and-dispersing clause before the recognition formula, uses idiomatic contemporary Korean, retains the distinction of the two paired Hebrew verbs without overstating either, and removes a redundant footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:37:36Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the recognition formula, the divine name יְהוָה as ‘야훼,’ and the temporal force of בַּהֲפִיצִי. However, ‘흩을 때에’ is not idiomatic in this context, and the sentence order separates the temporal clause from its result in a way that weakens the Hebrew relationship. ‘흩어 버리다’ adds a completive/discarding nuance not required by וְזֵרִיתִי.
  naturalness: A reordered sentence with natural verbal expressions (‘흩어 보내고,’ ‘흩어 놓을 때’) reads smoothly in modern formal-polite Korean and retains the paired scattering/dispersing imagery.
  terminology: ‘야훼’ appropriately represents the Tetragrammaton in accordance with the stated project decision. ‘민족들’ and ‘여러 땅’ are suitable contextual renderings of גּוֹיִם and אֲרָצוֹת.
  issues:
  - severity: medium
    issue: ‘흩을 때에’ is awkward and nonstandard in contemporary prose for this intended sense.
    rationale: Although it attempts to render the temporal infinitive clause directly, ‘흩어 보내고 … 때’ provides idiomatic Korean while preserving the causative scattering sense.
  - severity: medium
    issue: The temporal clause follows a completed main clause as a separate sentence.
    rationale: The Hebrew states that their recognition of Yahweh occurs when he scatters and disperses them. Placing the entire temporal action before the result preserves this relationship clearly.
  - severity: low
    issue: ‘흩어 버릴 것입니다’ introduces an unnecessary ‘away/completive’ nuance, and footnote a is redundant.
    rationale: זרה means disperse/scatter; ‘흩어 놓다’ is sufficient. Since the main text already renders יהוה as ‘야훼,’ a note merely saying that Hebrew uses ‘야훼’ provides no useful variant or clarification.
  revised_text: 내가 그들을 민족들 가운데 흩어 보내고 여러 땅에 흩어 놓을 때, 그들은 내가 야훼인 줄 알게 될 것입니다.
  revised_footnotes: []
  revision_rationale: The revision places the temporal scattering-and-dispersing clause before the recognition formula, uses idiomatic contemporary Korean, retains the distinction of the two paired Hebrew verbs without overstating either, and removes a redundant footnote.
