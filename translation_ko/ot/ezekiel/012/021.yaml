  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/021.yaml
  text: And the word of Yahweh came to me, saying,
translation:
  language: ko
  text: 야훼의 말씀이 내게 임하여 말씀하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 임하여
  alternatives_korean:
  - 오고
  - 이르시고
  - 있었습니다
  lexicon: HALOT
  rationale: 예언서의 상투적 서두에서 ‘말씀이 ... 임하다’는 한국어가 원문의 사건적 진행과 계시의 도래를 가장 자연스럽게 드러냅니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언자에게 주어지는 신적 발화를 가리키므로 ‘말씀’이 영어 POB의 ‘the word’를 가장 직접적으로 받쳐 주며, 단순한 ‘말’보다 계시성을 분명히 합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와/야훼 사성호를 고유명사로 드러내는 프로젝트 기본값을 따랐습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시며
  - 말하여
  lexicon: HALOT
  rationale: 히브리어 לֵאמֹר는 뒤따르는 직접 화법을 여는 표지이지만, 한국어에서는 문장 전체를 매끄럽게 하기 위해 종결 동사로 흡수했습니다.
theological_decisions:
- issue: 야훼의 말씀이 화자의 주체로 임하는 예언 공식의 톤
  chosen_reading: ‘야훼의 말씀이 내게 임하여 말씀하셨습니다’로, 계시의 도래와 직접 발화를 함께 보존했습니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 이르러 말씀하여’
  - ‘야훼의 말씀이 내게 와서 말했습니다’
  rationale: 원문은 단순한 정보 전달이 아니라 예언자에게 주어지는 하나님의 직접 말씀을 공식적으로 소개합니다. 한국어에서도 계시적 긴장을 약화시키지 않도록 ‘임하여’를 살렸습니다.
  doctrine_reference: 예언서 서두의 계시 공식 이해
