revisions:
- from: 그들의 눈앞에서 그것을 어깨에 메고, 어둠 속에서 그것을 꺼내십시오. 얼굴을 가려서 그 땅을 보지 못하게 하십시오. 이는 내가 당신을 이스라엘 집의 표징으로 삼았기 때문입니다.[a][b]
  to: 그들의 눈앞에서 그것을 어깨에 메고, 어둠[a] 속에서 그것을 내오십시오. 얼굴을 가려서 그 땅을 보지 않도록 하십시오. 내가 당신을 이스라엘 집을 위한 표징[b]으로 삼았기 때문입니다.
  rationale: ‘보지 못하게’의 사역적 모호성을 ‘보지 않도록’으로 바로잡아 히브리어 주어와 의미 관계를 보존했습니다. לְבֵית יִשְׂרָאֵל의 수혜/대상 관계는 ‘이스라엘 집을 위한’으로 명료하게 옮겼습니다. 각주는 원문의 어휘적 가능성을 제시하되 본문의 인물 지시와 해석상 개방성을 유지하도록 정리했습니다.
