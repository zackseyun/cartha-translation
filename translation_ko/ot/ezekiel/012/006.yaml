  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/עֵ֨ינֵי/הֶ֜ם עַל כָּתֵ֤ף תִּשָּׂא֙ בָּ/עֲלָטָ֣ה תוֹצִ֔יא פָּנֶ֣י/ךָ תְכַסֶּ֔ה וְ/לֹ֥א תִרְאֶ֖ה אֶת הָ/אָ֑רֶץ כִּֽי מוֹפֵ֥ת נְתַתִּ֖י/ךָ לְ/בֵ֥ית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/006.yaml
  text: Before their eyes you shall carry it on your shoulder[a]; in the dark you shall bring it out. You shall cover your face so that you do not see the land[b], for I have made you a sign for the house of Israel.
  footnotes:
  - marker: a
    text: Or 'in the twilight.' The Hebrew term can denote gloom or dim light; here it likely refers to moving under cover of darkness.
    reason: lexical_alternative
  - marker: b
    text: Or 'a portent.' The term can refer to a symbolic sign that also carries ominous significance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 눈앞에서 그것을 어깨에 메고, 어둠[a] 속에서 그것을 내오십시오. 얼굴을 가려서 그 땅을 보지 않도록 하십시오. 내가 당신을 이스라엘 집을 위한 표징[b]으로 삼았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어스름/황혼’. 히브리어는 어둠이나 침침한 빛을 뜻할 수 있으나, 여기서는 어둠을 틈탄 이동을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘징조’ 또는 ‘전조’. 히브리어는 상징적 표지와 불길한 의미를 띤 징조를 함께 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵינֵיהֶם
  english_pob_choice: Before their eyes
  chosen_korean: 그들의 눈앞에서
  alternatives_korean:
  - 그들 앞에서
  - 그들이 보는 앞에서
  lexicon: HALOT
  rationale: ‘눈앞에서’는 단순한 동시적 존재보다, 보이는 자리에서 행해지는 표징 행위를 더 생생하게 드러냅니다.
- source_word: עַל כָּתֵף תִּשָּׂא
  english_pob_choice: you shall carry it on your shoulder
  chosen_korean: 그것을 어깨에 메고
  alternatives_korean:
  - 그것을 어깨에 지고
  - 어깨에 그것을 들고
  lexicon: HALOT
  rationale: 어깨에 짊어지는 동작을 자연스러운 한국어로 옮겼고, 문맥상 생략된 목적어를 ‘그것’으로 보충했습니다.
- source_word: בָּעֲלָטָה
  english_pob_choice: in the dark
  chosen_korean: 어둠 속에서
  alternatives_korean:
  - 캄캄한 데서
  - 어스름 속에서
  - 은밀히
  lexicon: HALOT
  rationale: ‘어둠’이 어근의 기본 의미에 가장 가깝고, 행위의 은폐성과 밤의 분위기를 함께 살립니다.
- source_word: מוֹפֵת
  english_pob_choice: a sign
  chosen_korean: 표징
  alternatives_korean:
  - 징조
  - 징표
  - 기호
  lexicon: HALOT
  rationale: 예언자적 행위가 단순한 표시를 넘어 하나님이 주신 상징적 사건이라는 점을 살리기 위해 ‘표징’을 택했습니다.
- source_word: לְבֵית יִשְׂרָאֵל
  english_pob_choice: for the house of Israel
  chosen_korean: 이스라엘 집의
  alternatives_korean:
  - 이스라엘의 집의
  - 이스라엘 가문의
  lexicon: HALOT
  rationale: ‘집’은 성경적 집합 명칭으로 보존하는 것이 자연스럽고, 관용적으로 ‘이스라엘 집’으로 옮겼습니다.
theological_decisions:
- issue: מוֹפֵת의 성격
  chosen_reading: ‘표징’으로 옮겨, 예언자의 행위가 이스라엘을 향한 상징적 계시라는 점을 드러냈습니다.
  alternative_readings:
  - 징조
  - 포트런
  rationale: 본문은 단순한 예고보다 하나님이 정하신 행위-메시지의 성격을 말하므로, 지나치게 불길한 ‘징조’보다 중립적이면서도 예언적 뉘앙스를 가진 ‘표징’이 적합합니다.
  doctrine_reference: 예언적 상징행위의 계시성
- issue: ‘그 땅’을 그대로 유지한 처리
  chosen_reading: ‘그 땅’으로 두어, 원문의 지시 대상을 해석적으로 좁히지 않았습니다.
  alternative_readings:
  - 이스라엘 땅
  - 그 나라
  rationale: 히브리어는 단지 ‘그 땅’이라고만 말하므로, 맥락상 가리키는 바가 분명하더라도 번역문에서는 원문의 개방성을 보존했습니다.
  doctrine_reference: 원문 우선 및 해석 절제
