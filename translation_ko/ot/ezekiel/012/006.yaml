  terminology: ‘이스라엘 집’과 ‘표징’은 적절합니다. 다만 표징 각주는 에스겔 자신이 표징이라는 본문을 ‘상징적 사건’으로 바꾸어 말하지 않고, מוֹפֵת의 가능한 ‘징조/전조’ 뉘앙스만 절제하여 제시하는 것이 좋습니다.
