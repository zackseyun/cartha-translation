  text: For there will no longer be any false vision or flattering divination within the house of Israel[a].
  footnotes:
  - marker: a
    text: Or 'smooth divination.' The Hebrew adjective literally means 'smooth,' here likely in the sense of flattering or deceptively reassuring speech.
