  text: For there will no longer be any false vision or flattering divination within the house of Israel[a].
  footnotes:
  - marker: a
    text: Or 'smooth divination.' The Hebrew adjective literally means 'smooth,' here likely in the sense of flattering or deceptively reassuring speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 더 이상 이스라엘 집 안에 어떤 거짓 환상도, 아첨하는 점술도 없을 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아첨하는’은 히브리어 형용사 ‘매끄러운’의 문맥적 의미를 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 … 때문입니다
  - …이기 때문입니다
  lexicon: HALOT
  rationale: 앞선 선언에 대한 이유를 제시하는 כי의 기능을 한국어의 설명형 종결로 자연스럽게 옮겼습니다.
- source_word: חֲזוֹן שָׁוְא
  english_pob_choice: false vision
  chosen_korean: 거짓 환상
  alternatives_korean:
  - 헛된 환상
  - 속이는 환상
  - 거짓된 이상
  lexicon: HALOT
  rationale: שָׁוְא의 핵심인 ‘거짓/허무’를 살리되, 예언 문맥에서 현대 한국어로 가장 분명한 표현을 택했습니다.
- source_word: מִקְסַם חָלָק
  english_pob_choice: flattering divination
  chosen_korean: 아첨하는 점술
  alternatives_korean:
  - 매끄러운 점술
  - 아첨하는 예언
  - 매끈한 점술
  lexicon: HALOT
  rationale: חָלָק의 문자적 ‘매끄러움’보다 문맥상 사람을 달래고 속이는 화법의 뉘앙스를 살려 ‘아첨하는’으로 옮겼습니다.
- source_word: בְּתוֹךְ בֵּית יִשְׂרָאֵל
  english_pob_choice: within the house of Israel
  chosen_korean: 이스라엘 집 안에
  alternatives_korean:
  - 이스라엘 집 가운데
  - 이스라엘의 집 안에
  - 이스라엘 집 안에서
  lexicon: HALOT
  rationale: בְּתוֹךְ의 내부/범위 의미를 반영하되, ‘house of Israel’의 집합적 표지를 유지했습니다.
theological_decisions:
- issue: חָלָק의 의미를 문자적 ‘매끄러움’으로 둘지, 기능적 ‘아첨’으로 둘지
  chosen_reading: 점술 자체가 ‘아첨하는’ 방식으로 묘사된다고 이해해 번역했습니다.
  alternative_readings:
  - ‘매끄러운 점술’처럼 더 문자적으로 옮길 수 있습니다.
  - ‘매끈한 점술’로 남겨 어휘적 이질감을 살릴 수 있습니다.
  rationale: 히브리어의 문자적 이미지는 보존하되, 예언자적 비판이 겨냥하는 것은 사람을 안심시키는 속임수라는 점이 분명하므로 그 기능을 드러냈습니다.
  doctrine_reference: 의미의 tension을 문맥에 따라 해소하되, source의 비판 강도를 약화시키지 않음
