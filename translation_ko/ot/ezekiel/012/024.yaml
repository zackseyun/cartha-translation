  - …이기 때문입니다
  lexicon: HALOT
  rationale: 앞선 선언에 대한 이유를 제시하는 כי의 기능을 한국어의 설명형 종결로 자연스럽게 옮겼습니다.
- source_word: חֲזוֹן שָׁוְא
  english_pob_choice: false vision
  chosen_korean: 거짓 환상
  alternatives_korean:
