translation:
  language: ko
  text: 이는 더 이상 이스라엘 집 안에 어떤 거짓 환상도, 아첨하는 점술도 없을 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아첨하는’은 히브리어 형용사 ‘매끄러운’의 문맥적 의미를 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
