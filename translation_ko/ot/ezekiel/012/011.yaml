  lexicon: HALOT
  rationale: מוֹפֵת의 대표 기능을 살려 ‘표징’으로 옮겼고, 소유격보다 수신자를 향한 기능을 드러내기 위해 ‘너희에게’를 붙였습니다.
- source_word: כַּאֲשֶׁר עָשִׂיתִי כֵּן יֵעָשֶׂה לָהֶם
  english_pob_choice: just as I have done, so it shall be done to them
  chosen_korean: 내가 한 것과 같이 그들에게도 그렇게 될 것이며
  alternatives_korean:
  - 내가 행한 대로 그들에게도 그렇게 될 것이며
  - 내가 한 것처럼 그들에게도 그렇게 될 것이다
  lexicon: HALOT
  rationale: 비교 구조와 수동적 결과를 자연스럽게 살리기 위해 ‘내가 한 것과 같이 … 그렇게 될 것이며’로 옮겼습니다.
- source_word: בַּגּוֹלָה בַשְּׁבִי יֵלֵכוּ
  english_pob_choice: into exile, into captivity they shall go
  chosen_korean: 포로로 끌려가고 포로가 되어 그들은 갈 것이다
  alternatives_korean:
  - 유배로, 포로로 그들은 갈 것이다
  - 포로로, 포로 상태로 그들은 갈 것이다
  lexicon: HALOT
  rationale: גּוֹלָה와 שְׁבִי의 중복 강조를 살리기 위해 두 표현을 분리했으며, ‘끌려가고’는 유배의 강제성을, ‘포로가 되어’는 포로 상태를 각각 드러냅니다.
theological_decisions:
- issue: Ezekiel의 자기-표징 선언
  chosen_reading: 이 구절은 에스겔의 행동 전체를 심판을 미리 보여 주는 표징으로 제시합니다.
  alternative_readings:
  - 단순한 예언 선언으로만 읽는 해석
  - 징조보다 기적에 가까운 의미로 읽는 해석
  rationale: 히브리어 מוֹפֵת는 단순 예고가 아니라 상징적 표징/경이의 기능을 가지므로, 본문이 지시하는 예언적 행위의 성격을 살렸습니다.
  doctrine_reference: prophetic sign-act
- issue: ‘포로/유배’의 이중 표현
  chosen_reading: ‘포로로 끌려가고 포로가 되어’로 두 낱말의 병치를 유지했습니다.
  alternative_readings:
  - 둘을 합쳐 ‘포로로 갈 것이다’로 단순화
  - ‘유배와 포로’로 병렬화
  rationale: 원문은 גּוֹלָה와 שְׁבִי를 겹쳐 써 심판의 강도를 높이므로, 한국어에서도 중복을 유지해 강조 효과를 보존했습니다.
  doctrine_reference: prophetic emphasis
