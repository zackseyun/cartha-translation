  text: אֱמֹ֖ר אֲנִ֣י מֽוֹפֶתְ/כֶ֑ם כַּ/אֲשֶׁ֣ר עָשִׂ֗יתִי כֵּ֚ן יֵעָשֶׂ֣ה לָ/הֶ֔ם בַּ/גּוֹלָ֥ה בַ/שְּׁבִ֖י יֵלֵֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/011.yaml
  text: 'Say[a], ‘I am a sign to you: just as I have done, so it shall be done to them; into exile[b], into captivity they shall go.’'
  footnotes:
  - marker: a
    text: Or 'I am your sign' or 'I am a portent for you.' The Hebrew מוֹפֵת can denote a sign, portent, or symbolic wonder.
    reason: lexical_alternative
  - marker: b
    text: The paired expressions 'into exile' and 'into captivity' are both retained to reflect the Hebrew's emphatic doubling.
    reason: lexical_alternative
translation:
  language: ko
  text: 말하여라. ‘나는 너희에게 표징이다. 내가 한 것과 같이 그들에게도 그렇게 될 것이며, 포로로 끌려가고 포로가 되어 그들은 갈 것이다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מוֹפֵת는 ‘표징’, ‘징조’, ‘경이로운 표’로도 옮길 수 있습니다. 여기서는 에스겔의 행위가 백성을 위한 상징적 표징이라는 점을 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘포로로 끌려가고 포로가 되어’는 히브리어의 ‘유배’와 ‘포로 상태’의 이중 표현을 보존한 것입니다.
    reason: lexical_alternative
