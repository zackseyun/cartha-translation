source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִשְׁבַּ֨תִּי֙ אֶת הַ/מָּשָׁ֣ל הַ/זֶּ֔ה וְ/לֹֽא יִמְשְׁל֥וּ אֹת֛/וֹ ע֖וֹד בְּ/יִשְׂרָאֵ֑ל כִּ֚י אִם דַּבֵּ֣ר אֲלֵי/הֶ֔ם קָֽרְבוּ֙ הַ/יָּמִ֔ים וּ/דְבַ֖ר כָּל חָזֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/023.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: I will put an end to this proverb, and they will no longer use it as a proverb in Israel. But say to them, “The days have drawn near, and the word of every vision.”’'
  footnotes:
  - marker: a
    text: Hebrew 'the word of every vision'; here 'word' is rendered as 'fulfillment' because the context concerns whether prophetic visions will actually come to pass without delay.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들에게 말하십시오. “주 야훼께서 이렇게 말씀하십니다. 내가 이 속담을 끝내겠다. 그들은 다시는 이스라엘에서 이 속담을 말하지 않을 것이다. 그러나 그들에게 말하십시오. ‘날들이 가까워졌고, 모든 환상에 관한 말씀도 가까워졌다.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘모든 환상에 관한 말씀’은 직역에 가까운 표현입니다. 문맥에서는 모든 예언적 환상이 지체 없이 성취될 때가 가까웠다는 뜻을 가리킬 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  lexicon: HALOT
  rationale: אַדֹנָי와 YHWH가 함께 오는 예언자 공식이므로, 한국어에서는 직역의 어색함을 피하면서도 두 칭호를 함께 살려 ‘주 하나님’으로 옮겼습니다.
- source_word: הַמָּשָׁל הַזֶּה
  english_pob_choice: this proverb
  chosen_korean: 이 비유
  alternatives_korean:
  - 이 속담
  - 이 격언
  lexicon: HALOT
  rationale: 문맥상 민간의 반복 문구를 가리키므로 ‘비유’보다 넓은 ‘속담/격언’도 가능하지만, 본문에서 실제로 입에 오르내리는 관용구라는 점을 살려 ‘비유’로 옮겼습니다.
- source_word: וְלֹא יִמְשְׁלוּ אֹתוֹ עוֹד בְּיִשְׂרָאֵל
  english_pob_choice: and they will no longer use it as a proverb in Israel
  chosen_korean: 그들은 다시는 이스라엘에서 그것을 비유로 말하지 못할 것입니다
  alternatives_korean:
  - 그들은 다시는 이스라엘에서 그것을 속담으로 사용하지 못할 것입니다
  - 그들은 다시는 이스라엘에서 그것을 말로 되풀이하지 못할 것입니다
  lexicon: HALOT
  rationale: 동사 משל의 ‘속담으로 말하다/관용구로 쓰다’의 뜻을 살리되, 한국어에서 자연스러운 서술로 풀어 ‘비유로 말하다’로 옮겼습니다.
- source_word: וּדְבַר כָּל חָזוֹן
  english_pob_choice: the word of every vision
  chosen_korean: 모든 환상의 말
  alternatives_korean:
  - 모든 환상의 말씀
  - 모든 환상의 성취
  lexicon: HALOT
  rationale: דָּבָר를 해석적으로 ‘성취’로 확장하기보다, 영어 POB의 최종 수정과 원문의 ‘말/사건’의 중의를 반영해 ‘말’로 두었습니다.
theological_decisions:
- issue: 여호와/야훼의 표기와 주 하나님 공식
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 본 구절은 아도나이와 YHWH의 결합형 예언 공식이므로, 한국어 독자에게 과도하게 낯설지 않으면서도 신적 호칭의 중복을 드러내는 표현을 택했습니다.
  doctrine_reference: POB renderings of divine name and prophetic formula
