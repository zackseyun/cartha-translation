  source_fidelity: 핵심 의미는 대체로 반영했으나, מָשָׁל은 여기서 앞 절의 민간 속담을 가리키므로 ‘비유’보다 ‘속담’이 정확합니다. 또한 ‘말하지 못할 것입니다’는 능력·허용의 뉘앙스를 더하므로 단순 미래 부정으로 고쳐야 합니다. 마지막 명사절은 ‘가까워졌다’가 생략된 병렬 구조이므로 한국어에서도 그 술어를 보충해 문맥적 의미를 드러내었습니다.
  naturalness: ‘모든 환상의 말’은 한국어에서 부자연스럽고 의미 관계가 불분명합니다. ‘모든 환상에 관한 말씀’으로 옮기고 생략된 술어를 보충하면 현대 표준어 합쇼체에서 자연스럽습니다. 하나님의 직접 발화는 ‘하겠다/않을 것이다’로 유지하여 청자에게 드리는 공손 표현으로 오해되지 않게 했습니다.
  terminology: אֲדֹנָי יְהוִה의 두 요소와 제시된 YHWH 표기 방침을 반영하여 ‘주 야훼’로 옮겼습니다. מָשָׁל은 ‘속담’, חָזוֹן은 ‘환상’으로 유지했습니다. דָּבָר의 ‘말씀/일’ 중의성은 각주에서 보존했습니다.
