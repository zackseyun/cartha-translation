id: EZK.12.3
reference: Ezekiel 12:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם עֲשֵׂ֤ה לְ/ךָ֙ כְּלֵ֣י גוֹלָ֔ה וּ/גְלֵ֥ה יוֹמָ֖ם לְ/עֵֽינֵי/הֶ֑ם וְ/גָלִ֨יתָ מִ/מְּקוֹמְ/ךָ֜ אֶל מָק֤וֹם אַחֵר֙ לְ/עֵ֣ינֵי/הֶ֔ם אוּלַ֣י יִרְא֔וּ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/003.yaml
  text: And you, son of man, prepare for yourself baggage for exile, and go into exile by day before their eyes. You shall go into exile from your place to another place before their eyes. Perhaps they will see, though they are a rebellious house.
translation:
  language: ko
  text: 인자야, 너는 스스로를 위해 포로의 짐을 준비하고, 낮에 그들 앞에서 포로로 끌려가듯 떠나라. 네가 있던 곳에서 다른 곳으로 그들 앞에서 옮겨질 것이다. 그들은 반역하는 집안이므로, 혹시 보게 될지 모른다.
  philosophy: formal
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인자여
  lexicon: 인자
  rationale: Ezekiel의 고정 호칭인 ‘son of man’을 한국어 성서어법에 맞게 ‘인자야’로 옮겨, 호칭성과 직접호소를 함께 살렸습니다.
- source_word: כְּלֵי גוֹלָה
  english_pob_choice: baggage for exile
  chosen_korean: 포로의 짐
  alternatives_korean:
  - 유배 짐
  - 포로 생활의 짐
  lexicon: 포로
  rationale: ‘baggage for exile’는 단순한 여행 짐이 아니라 강제 이주/유배를 전제하는 소지품이므로, 의미를 분명히 하는 ‘포로의 짐’으로 옮겼습니다.
- source_word: וּגְלֵה יוֹמָם
  english_pob_choice: go into exile by day
  chosen_korean: 낮에 … 포로로 끌려가듯 떠나라
  alternatives_korean:
  - 낮에 유배되듯 가라
  - 낮에 포로로 가라
  lexicon: גלה
  rationale: 동사 גלה는 단순 이동이 아니라 ‘포로로 잡혀 떠남/유배됨’의 의미가 핵심이어서, 한국어에서 그 강도를 드러내는 표현을 택했습니다.
- source_word: בֵּית מְרִי
  english_pob_choice: rebellious house
  chosen_korean: 반역하는 집안
  alternatives_korean:
  - 패역한 집안
  - 반항하는 집안
  lexicon: מרי
  rationale: ‘rebellious house’를 관용적인 교회어법으로 완화하지 않고, 원문의 도전성을 살려 ‘반역하는 집안’으로 옮겼습니다.
theological_decisions:
- issue: 예언 행위의 상징성
  chosen_reading: 에스겔이 실제로 포로 행세를 하며 백성 앞에서 표징을 보이는 행위명령으로 읽었습니다.
  alternative_readings:
  - 단순한 상징적 메시지 전달
  - 비유적 경고
  rationale: 문맥의 명령형 연속과 ‘그들 앞에서’의 반복은 실제로 보이게 하는 표징 행위를 요구합니다.
  doctrine_reference: 예언자 표징행위(sign-act)
