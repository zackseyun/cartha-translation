    reason: lexical_alternative
translation:
  language: ko
  text: 나는 야훼입니다. 내가 말할 말씀은 무엇이든 반드시 이루어질 것입니다[a]. 그것은 더 이상 지체되지 않을 것입니다[b]. 반역하는 집안아, 너희 시대에 내가 말씀을 하고 그것을 행할 것입니다. 주 하나님께서 선언하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 말할 그 말씀.’ 히브리어 표현은 강조적이며, 더 형식적으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘더 이상 길게 끌리지 않을 것입니다’ 또는 ‘더 이상 미뤄지지 않을 것입니다.’
    reason: lexical_alternative
