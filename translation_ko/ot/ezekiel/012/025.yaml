  chosen_reading: 본문 첫머리의 יְהוָה는 야훼로, 끝의 אֲדֹנָי יְהוִה는 주 하나님으로 구분했습니다.
  alternative_readings:
  - 야훼 ... 야훼
  - 여호와 ... 주 여호와
  rationale: 본문 안에서 고유명사와 칭호가 함께 쓰이므로, 고유명사는 야훼로, 종결 예언 공식은 읽기 자연스러운 주 하나님으로 구분해 두 요소를 모두 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
