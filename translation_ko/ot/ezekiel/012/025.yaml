  rationale: 문맥상 성취의 지체를 가리키므로, 현대 한국어에서 자연스럽고 직접적인 ‘지연’으로 옮겼습니다.
- source_word: בֵּית הַמֶּרִי
  english_pob_choice: O rebellious house
  chosen_korean: 반역하는 집
