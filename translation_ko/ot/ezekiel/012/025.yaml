  text: כִּ֣י אֲנִ֣י יְהוָ֗ה אֲדַבֵּר֙ אֵת֩ אֲשֶׁ֨ר אֲדַבֵּ֤ר דָּבָר֙ וְ/יֵ֣עָשֶׂ֔ה לֹ֥א תִמָּשֵׁ֖ךְ ע֑וֹד כִּ֣י בִֽ/ימֵי/כֶ֞ם בֵּ֣ית הַ/מֶּ֗רִי אֲדַבֵּ֤ר דָּבָר֙ וַ/עֲשִׂיתִ֔י/ו נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/025.yaml
  text: For I am Yahweh[a]; the word that I speak will be done. It will no longer be delayed, for in your days, O rebellious house, I will speak a word and do it[b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'the word that I speak.' The Hebrew expression is emphatic and can be rendered more formally.
    reason: lexical_alternative
  - marker: b
    text: Or 'It will no longer be prolonged' or 'drawn out any longer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 야훼이기 때문입니다[a]. 내가 말하는 그 말씀은 반드시 이루어질 것입니다. 더 이상 지연되지 않을 것입니다. 너희 날들에, 반역하는 집아, 내가 한 말씀을 말하고 그것을 행할 것입니다[b]. 주 하나님이 선언하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 말하는 말씀.’ 히브리어 표현은 강조적이며, 더 형식적으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘더 이상 길게 끌리지 않을 것입니다’ 혹은 ‘더 이상 끌어지지 않을 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 첫 절에서 신적 고유명사를 드러내는 표현이므로, 프로젝트 기본값에 따라 야훼로 옮겨 하나님의 개인명을 보존했습니다.
- source_word: אֲדַבֵּר אֵת אֲשֶׁר אֲדַבֵּר דָּבָר
  english_pob_choice: the word that I speak / whatever word I speak
  chosen_korean: 내가 말하는 그 말씀
  alternatives_korean:
  - 내가 말하는 무엇이든지 말씀
  - 내가 말하는 말씀
  lexicon: HALOT
  rationale: 히브리어의 강조된 관계구문과 דָּבָר의 ‘말씀/발화’ 성격을 살려, 단순한 ‘말’보다 예언적 발화의 무게를 드러냈습니다.
- source_word: לֹא תִמָּשֵׁךְ עוֹד
  english_pob_choice: It will no longer be delayed
  chosen_korean: 더 이상 지연되지 않을 것입니다
  alternatives_korean:
  - 더 이상 길어지지 않을 것입니다
  - 더 이상 미뤄지지 않을 것입니다
  lexicon: HALOT
  rationale: 문맥상 성취의 지체를 가리키므로, 현대 한국어에서 자연스럽고 직접적인 ‘지연’으로 옮겼습니다.
- source_word: בֵּית הַמֶּרִי
  english_pob_choice: O rebellious house
  chosen_korean: 반역하는 집
  alternatives_korean:
  - 반역하는 집안
  - 반역하는 백성
  lexicon: HALOT
  rationale: ‘집’이라는 언약적 집합체 비유를 유지하면서, מֶרִי의 반항적·반역적 뉘앙스를 살렸습니다.
- source_word: וַעֲשִׂיתִיו
  english_pob_choice: and do it
  chosen_korean: 그것을 행할 것입니다
  alternatives_korean:
  - 그것을 할 것입니다
  - 그것을 이루겠습니다
  lexicon: HALOT
  rationale: 앞의 ‘이루어질 것입니다’와 대응시키되, 히브리어 동사의 직접성을 살려 ‘행하다’로 옮겼습니다.
theological_decisions:
- issue: 신적 이름과 종결 공식의 구분
  chosen_reading: 본문 첫머리의 יְהוָה는 야훼로, 끝의 אֲדֹנָי יְהוִה는 주 하나님으로 구분했습니다.
  alternative_readings:
  - 야훼 ... 야훼
  - 여호와 ... 주 여호와
  rationale: 본문 안에서 고유명사와 칭호가 함께 쓰이므로, 고유명사는 야훼로, 종결 예언 공식은 읽기 자연스러운 주 하나님으로 구분해 두 요소를 모두 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
