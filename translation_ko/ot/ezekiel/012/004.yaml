source:
  edition: WLC
  text: וְ/הוֹצֵאתָ֨ כֵלֶ֜י/ךָ כִּ/כְלֵ֥י גוֹלָ֛ה יוֹמָ֖ם לְ/עֵֽינֵי/הֶ֑ם וְ/אַתָּ֗ה תֵּצֵ֤א בָ/עֶ֨רֶב֙ לְ/עֵ֣ינֵי/הֶ֔ם כְּ/מוֹצָאֵ֖י גּוֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/004.yaml
  text: And you shall bring out your baggage like the baggage of exile by day before their eyes[b][a], and you yourself shall go out in the evening before their eyes like those going out into exile.
  footnotes:
  - marker: a
    text: Or, 'like the baggage of an exile.' The Hebrew expression can be understood either collectively ('baggage of exile') or with an individualized sense ('baggage of an exile').
    reason: lexical_alternative
  - marker: b
    text: Or, 'like people going out into exile' or 'as exiles go out.' The Hebrew literally reads 'like the goings-out of exile/exiles,' an idiom referring to the manner of deportation.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 그들의 눈앞에서 낮에 너의 짐을 유배의 짐처럼[a] 꺼내고, 너 자신은 저녁에 그들의 눈앞에서 유배를 떠나는 사람들처럼[b] 나가십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유배자의 짐처럼.’ 히브리어 표현은 집합적으로 ‘유배의 짐’으로도, ‘한 유배자의 짐’이라는 개인적인 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘유배를 떠나는 사람처럼’ 또는 ‘유배자들이 떠나듯.’ 히브리어는 문자적으로 ‘유배의 떠남들처럼’이라고 하며, 강제 이주의 방식을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵלֶיךָ
  english_pob_choice: your baggage
  chosen_korean: 너의 물건들
  alternatives_korean:
