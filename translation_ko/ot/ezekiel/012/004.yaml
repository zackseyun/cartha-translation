- source_word: כִכְלֵי גוֹלָה
  english_pob_choice: like the baggage of exile
  chosen_korean: 포로의 물건처럼
  alternatives_korean:
  - 포로된 자의 짐처럼
  - 포로 생활의 짐처럼
  - 포로의 짐처럼
  lexicon: HALOT
  rationale: 히브리어는 ‘포로/유배’와 관련된 소유물을 가리키는 비교구이므로, ‘포로의 물건처럼’으로 간명하게 옮겨 유배 상황의 시각적 표지를 살렸습니다.
- source_word: לְעֵינֵיהֶם
  english_pob_choice: before their eyes
