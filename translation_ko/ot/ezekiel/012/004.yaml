  lexicon: HALOT
  rationale: 직역에 가까운 ‘눈앞에서’는 반복되는 공개적 시범 행위를 분명히 드러내며, 히브리어 관용구의 가시성을 잘 보존합니다.
- source_word: כְּמוֹצָאֵי גּוֹלָה
  english_pob_choice: like those going out into exile
  chosen_korean: 포로로 나가는 사람처럼
  alternatives_korean:
  - 포로로 떠나는 사람처럼
  - 유배로 나가는 사람처럼
  - 포로들이 나가듯
  lexicon: HALOT
  rationale: מוֹצָאֵי는 ‘나감/출발’의 복수 구성형으로 사람의 행위를 가리키므로, 추상화하지 않고 인물 중심으로 ‘포로로 나가는 사람처럼’이라고 옮겼습니다.
theological_decisions:
- issue: 예언적 행위의 시간 대비(낮/저녁)와 반복 강조
  chosen_reading: ‘대낮에’와 ‘저녁에’의 대비를 살리고 ‘그들의 눈앞에서’를 두 번 반복해, 포로 상징 행동의 공개성과 의도적 연출을 드러냈습니다.
  alternative_readings:
  - ‘낮에’/‘밤에’로 완화
  - 반복을 줄여 한 번만 표현
  rationale: 본문은 시간 대비와 공개성의 반복을 통해 심판 선고의 가시성을 강조하므로, 이를 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 예언행위의 표징성
- issue: ‘포로’/‘유배’ 표현 선택
  chosen_reading: 본절에서는 ‘포로’로 번역해, 강제 이주와 억류의 체감을 더 직접적으로 전달했습니다.
  alternative_readings:
  - 유배
  - 추방
  - 사로잡힘
  rationale: 히브리어 גּוֹלָה는 유배 상태를 가리키지만, 이 절의 실연 장면에서는 억압된 이동과 강제성을 드러내는 ‘포로’가 한국어 독자에게 더 분명합니다.
  doctrine_reference: 역사적 심판과 강제 포로화
