review_pass:
  verdict: revise
  source_fidelity: The draft preserves the two time settings, the repeated public visibility, and Ezekiel's emphatic personal departure. However, rendering גּוֹלָה as ‘포로’ blurs its primary exilic/deportation sense and makes ‘포로로 나가는’ potentially sound like voluntary movement into prisoner status. ‘대낮’ is also more specific than יוֹמָם (‘by day/during the day’).
  naturalness: The sentence is generally readable, but imperative forms better represent the prophetic instruction in modern formal-polite Korean than ‘나가야 합니다.’ ‘유배의 짐’ and ‘유배를 떠나는 사람들’ are clear, natural expressions in this context.
  terminology: Use ‘유배’ consistently for גּוֹלָה in both comparisons. This retains the source term's connection with deportation/exile without importing the narrower sense of ‘포로.’ ‘짐’ is contextually more precise than the broad ‘물건들’ for portable articles prepared for departure.
  issues:
  - severity: medium
    issue: ‘포로’/‘포로로 나가는’ for גּוֹלָה
    rationale: גּוֹלָה can refer to exile, deportation, or exiles. In this enactment it denotes exile/deportation, not merely captives; ‘포로로 나가는’ is awkward and can distort the movement described.
  - severity: low
    issue: ‘대낮에’ for יוֹמָם
    rationale: The Hebrew means ‘by day/during the day’ in contrast to evening; it does not specifically require midday or broad daylight.
  - severity: low
    issue: Footnote anchors are placed only at the end of the sentence
    rationale: Each lexical-alternative note should be anchored immediately after the expression it explains, so that the two distinct Hebrew phrases are unambiguous.
  revised_text: 너는 그들의 눈앞에서 낮에 너의 짐을 유배의 짐처럼[a] 꺼내고, 너 자신은 저녁에 그들의 눈앞에서 유배를 떠나는 사람들처럼[b] 나가십시오.
