id: EZK.12.13
reference: Ezekiel 12:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פָרַשְׂתִּ֤י אֶת רִשְׁתִּ/י֙ עָלָ֔י/ו וְ/נִתְפַּ֖שׂ בִּ/מְצֽוּדָתִ֑/י וְ/הֵבֵאתִ֨י אֹת֤/וֹ בָבֶ֨לָ/ה֙ אֶ֣רֶץ כַּשְׂדִּ֔ים וְ/אוֹתָ֥/הּ לֹֽא יִרְאֶ֖ה וְ/שָׁ֥ם יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/013.yaml
  text: I will spread my net over him[a], and he will be caught in my snare. Then I will bring him to Babylon, the land of the Chaldeans; yet he will not see it[b], and there he will die.
  footnotes:
  - marker: a
    text: 'Or ''my trap.'' The Hebrew uses two related hunting terms: ''my net'' and ''my snare.'''
    reason: lexical_alternative
  - marker: b
    text: The statement that he will be brought to Babylon yet not see it is often understood in light of 2 Kings 25:7 and Jeremiah 39:7; 52:11.
    reason: cross_reference
translation:
  language: ko
  text: 내가 내 그물을 그 위에 펼치면, 그는 내 덫에 걸릴 것입니다. 그런 다음 내가 그를 바벨론, 곧 갈대아 사람들의 땅으로 데려가겠지만, 그는 거기를 보지 못할 것이며, 거기서 죽을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 서로 관련된 두 포획 표현—‘내 그물’과 ‘내 덫’—을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 그가 바벨론으로 끌려가지만 보지 못한다는 진술은 흔히 열왕기하 25:7, 예레미야 39:7; 52:11과 관련해 이해됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: וּפָרַשְׂתִּי אֶת רִשְׁתִּי
  english_pob_choice: I will spread my net
  chosen_korean: 내 그물을 펼치면
  alternatives_korean:
  - 내 그물을 펼쳐 놓으면
  - 내 그물을 던지면
  lexicon: HALOT
  rationale: פָּרַשׂ는 ‘펴다/펼치다’의 뜻이 핵심이므로, ‘펼치다’로 옮겨 그물 이미지를 자연스럽게 살렸습니다.
- source_word: בִּמְצוּדָתִי
  english_pob_choice: in my snare
  chosen_korean: 내 덫에
  alternatives_korean:
  - 내 올무에
  - 내 함정에
  lexicon: HALOT
  rationale: 앞의 ‘그물’과 병렬을 이루는 사냥/포획 이미지를 유지하면서도 중복을 피하기 위해 ‘덫’으로 옮겼습니다.
- source_word: בָבֶלָה אֶרֶץ כַּשְׂדִּים
  english_pob_choice: to Babylon, the land of the Chaldeans
  chosen_korean: 바벨론, 곧 갈대아 사람들의 땅으로
  alternatives_korean:
  - 바벨론, 곧 갈대아 땅으로
  - 바벨론, 갈대아 사람들의 땅으로
  lexicon: HALOT
  rationale: בָבֶלָה의 방향성을 살려 ‘~으로’로 옮기고, apposition인 ‘갈대아 사람들의 땅’은 ‘곧’으로 풀어 설명했습니다.
- source_word: וְאוֹתָהּ לֹא יִרְאֶה
  english_pob_choice: yet he will not see it
  chosen_korean: 그는 거기를 보지 못할 것이며
  alternatives_korean:
  - 그러나 그는 그것을 보지 못할 것이며
  - 그렇지만 그는 그것을 보지 못할 것입니다
  lexicon: HALOT
  rationale: 히브리어 여성 대명사는 앞선 ‘바벨론/땅’을 가리키므로, 한국어에서는 문맥상 자연스러운 ‘거기’를 사용해 지시 대상을 유지했습니다.
theological_decisions:
- issue: ‘바벨론에 데려가지만 보지 못한다’는 역설
  chosen_reading: 본문의 역설을 설명으로 풀지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘바벨론에 데려가지만 눈이 멀어 보지 못할 것이다’로 해설을 덧붙임
  - 역사적 배경을 본문 안에 직접 삽입함
  rationale: 본문은 결과만 진술하며, 왜 보지 못하는지는 여기서 설명하지 않습니다. 번역에서도 그 긴장을 유지하는 것이 원문과 POB의 주석적 절제를 더 잘 반영합니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
