revisions:
- from: 그들 가운데 있는 그 통치자는 어둠 속에서 자기 짐을 어깨에 메고 나가며, 그를 내보내려고 그들이 담을 뚫을 것입니다. 그는 자기 눈으로 그 땅을 보지 못하게 하려고 자기 얼굴을 가릴 것입니다.[a][b][c]
  to: 그들 가운데 있는 그 통치자는 어둠 속에서[a] 자기 짐을[b] 어깨에 지고 나갈 것입니다. 그들이 그를 그 담을 통해 내보내려고 담을 뚫을 것입니다. 그는 그 땅을 자기 눈으로 보지 못하도록 자기 얼굴을 가릴 것입니다.[c]
  rationale: ‘통치자’와 짐의 문맥상 보충은 유지했습니다. 복수 주어로 전환되는 문장을 분리하고, 담을 뚫은 뒤 그 담을 통해 내보낸다는 בּוֹ의 통로 관계를 드러냈습니다. 마지막 절은 본문에서 목적/결과로 자연스럽게 번역하되, 인과적 해석 가능성은 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:37:33Z'
