  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/נָּשִׂ֨יא אֲשֶׁר בְּ/תוֹכָ֜/ם אֶל כָּתֵ֤ף יִשָּׂא֙ בָּ/עֲלָטָ֣ה וְ/יֵצֵ֔א בַּ/קִּ֥יר יַחְתְּר֖וּ לְ/ה֣וֹצִיא ב֑/וֹ פָּנָ֣י/ו יְכַסֶּ֔ה יַ֗עַן אֲשֶׁ֨ר לֹא יִרְאֶ֥ה לַ/עַ֛יִן ה֖וּא אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/012.yaml
  text: And the prince who is among them will lift his baggage onto his shoulder in the dark and go out[a]. They will dig through the wall to bring him out through it[c][b]. He will cover his face so that he may not see the land with his eyes.
  footnotes:
  - marker: a
    text: Or, 'in the twilight' for 'in the dark.' The Hebrew term can denote gloom or dim light, with the broader sense of concealment.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'will lift onto the shoulder.' 'His baggage' is supplied from the immediate context of the exile sign-act in the surrounding verses.
    reason: cross_reference
  - marker: c
    text: Or, 'because he will not see the land with his eyes.' The Hebrew conjunction may be understood as causal rather than purposive/resultative.
    reason: alternative_reading
translation:
  language: ko
  text: 그들 가운데 있는 그 통치자는 어둠 속에서 자기 짐을 어깨에 메고 나가며, 그를 내보내려고 그들이 담을 뚫을 것입니다. 그는 자기 눈으로 그 땅을 보지 못하게 하려고 자기 얼굴을 가릴 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어둠 속에서’는 히브리어가 지닌 어둠/희미함의 범위를 반영한 번역이며, ‘황혼에’도 가능하지만 여기서는 은폐의 뉘앙스를 우선했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 짐을’은 본절의 동사에 원문상 명시되지 않은 목적어를, 앞선 망명 징조 문맥에 따라 최소한으로 보충한 것입니다.
    reason: cross_reference
  - marker: c
    text: 마지막 절은 ‘그가 그 땅을 보지 못하기 때문에’로도 읽을 수 있으나, 문맥상 목적/결과로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּשִׂיא
  english_pob_choice: the prince
  chosen_korean: 그 통치자
  alternatives_korean:
  - 그 지도자
  - 그 왕
  lexicon: HALOT
  rationale: נָשִׂיא는 여기서 예루살렘의 통치 권력을 가리키는 호칭이므로, 한국어로는 왕보다 덜 단정적인 ‘통치자’가 문맥을 더 정확히 살립니다.
- source_word: בָּעֲלָטָה
  english_pob_choice: in the dark
  chosen_korean: 어둠 속에서
  alternatives_korean:
  - 황혼에
  - 몰래
  lexicon: HALOT
  rationale: 이 단어는 어둠과 가림의 뉘앙스를 가지므로, 시간표시보다 은폐의 감각을 살리는 ‘어둠 속에서’가 적절합니다.
- source_word: בַּקִּיר יַחְתְּרוּ
  english_pob_choice: They will dig through the wall
  chosen_korean: 그들이 담을 뚫을 것입니다
  alternatives_korean:
  - 그들이 벽을 파고 들어갈 것입니다
  - 그들이 벽을 깨뜨릴 것입니다
  lexicon: HALOT
  rationale: חתר는 벽을 뚫거나 파고 들어간다는 구체적 행동을 가리키므로, 사태의 물리성을 살려 ‘담을 뚫다’로 옮겼습니다.
- source_word: פָּנָיו יְכַסֶּה
  english_pob_choice: He will cover his face
  chosen_korean: 자기 얼굴을 가릴 것입니다
  alternatives_korean:
  - 자기 얼굴을 덮을 것입니다
  - 자기 얼굴을 베일로 가릴 것입니다
  lexicon: HALOT
  rationale: 직역을 유지하되 한국어로 자연스럽게 읽히도록 ‘얼굴을 가리다’로 옮겨, 이어지는 시야 차단의 의미를 살렸습니다.
theological_decisions:
- issue: The force of יַעַן אֲשֶׁר in the final clause
  chosen_reading: ‘자기 눈으로 그 땅을 보지 못하게 하려고’로 목적/결과를 살렸습니다.
  alternative_readings:
  - ‘그가 그 땅을 보지 못할 것이기 때문에’로 원인을 살리는 번역
  - ‘그 결과 그가 그 땅을 보지 못할 것이다’로 결과를 살리는 번역
  rationale: 얼굴을 가리는 행동과 뒤따르는 시야 상실이 연결되므로, 한국어에서는 목적과 결과를 함께 담는 표현이 가장 자연스럽고 본문 흐름에도 맞습니다.
  doctrine_reference: Translation philosophy §3
- issue: Implied object with the shoulder idiom
  chosen_reading: ‘자기 짐을 어깨에 메고’로 문맥상 보충했습니다.
  alternative_readings:
  - ‘어깨에 메고’만 두는 번역
  rationale: 본문 자체에는 목적어가 없지만, 앞선 징조행위 문맥에서 망명 짐이 분명하므로 한국어 독자가 장면을 오해하지 않도록 최소한으로 보충했습니다.
  doctrine_reference: Translation philosophy §1, §6
