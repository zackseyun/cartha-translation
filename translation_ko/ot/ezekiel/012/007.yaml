  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אַ֣עַשׂ כֵּן֮ כַּ/אֲשֶׁ֣ר צֻוֵּיתִי֒ כֵּ֠לַ/י הוֹצֵ֜אתִי כִּ/כְלֵ֤י גוֹלָה֙ יוֹמָ֔ם וּ/בָ/עֶ֛רֶב חָתַֽרְתִּי לִ֥/י בַ/קִּ֖יר בְּ/יָ֑ד בָּ/עֲלָטָ֥ה הוֹצֵ֛אתִי עַל כָּתֵ֥ף נָשָׂ֖אתִי לְ/עֵינֵי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/007.yaml
  text: 'So I did as I was commanded: by day I brought out my baggage like the baggage of exile[a], and in the evening I dug through the wall by hand. In the dark I brought it out[b]; I carried it on my shoulder before their eyes.'
  footnotes:
  - marker: a
    text: Or 'like the baggage of a deportee.' The Hebrew phrase refers to belongings prepared for going into exile.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the gloom' or 'at dusk.' The Hebrew term denotes darkness and may imply concealment as well as low light.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 명령받은 대로 행했습니다. 곧 낮에는 포로의 물건[a]처럼 내 물건을 끌어내고, 저녁에는 손으로 성벽을 뚫었습니다. 어둠 속에서 그것을 끌어냈고[b], 그들의 눈앞에서 그것을 어깨에 메었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유배자의 물건’. 히브리어 표현은 포로로 끌려갈 때 준비하는 소지품을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘캄캄한 가운데’나 ‘어스름할 때’. 히브리어는 어둠을 뜻하며, 낮은 조도뿐 아니라 은폐의 뉘앙스도 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּלַי / כִּכְלֵי גוֹלָה
  english_pob_choice: my baggage / the baggage of exile
  chosen_korean: 내 물건 / 포로의 물건
  alternatives_korean:
  - 내 짐
  - 포로의 짐
  - 유배자의 짐
  lexicon: HALOT
  rationale: כְּלִי 계열은 넓게 ‘물건, 도구, 기구’까지 포괄하지만, 이 상징 행위에서는 옮겨 갈 수 있는 소지품을 가리키므로 ‘물건’이 자연스럽고, ‘포로의 물건’은 유배를 앞둔 준비된 소지품이라는 점을 살립니다.
- source_word: חָתַרְתִּי לִי בַקִּיר
  english_pob_choice: I dug through the wall
  chosen_korean: 성벽을 뚫었습니다
  alternatives_korean:
  - 벽을 뚫었습니다
  - 성벽을 파고 들어갔습니다
  - 성벽을 허물었습니다
  lexicon: HALOT
  rationale: חתר는 특히 벽을 ‘파고 뚫다/뚫고 들어가다’의 뜻이어서, 상징 행동의 강도를 살리기 위해 ‘성벽을 뚫었습니다’로 옮겼습니다. ‘성벽’은 문맥상 도시의 방어벽을 가리키는 것으로 이해됩니다.
- source_word: בָּעֲלָטָה
  english_pob_choice: In the dark
  chosen_korean: 어둠 속에서
  alternatives_korean:
  - 캄캄한 가운데
  - 어둑할 때
  - 그늘 속에서
  lexicon: HALOT
  rationale: 이 단어는 어둠, 침침함, 가리움의 뉘앙스를 가지므로 가장 직접적이고 현대적인 표현인 ‘어둠 속에서’를 선택했습니다. 이는 은밀함을 암시하지만 본문의 핵심은 낮/저녁의 시간 대비입니다.
- source_word: לְעֵינֵיהֶם
  english_pob_choice: before their eyes
  chosen_korean: 그들의 눈앞에서
  alternatives_korean:
  - 그들이 보는 앞에서
  - 그들 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 현대 한국어로 옮겨, 이 행위가 공적이고 목격 가능한 표징 행동이었음을 드러냅니다.
theological_decisions:
- issue: 에스겔의 상징 행위의 성격
  chosen_reading: 본문의 물리적 동작을 그대로 유지해 상징성을 과잉 설명하지 않았습니다.
  alternative_readings:
  - 처음부터 ‘포로 생활’을 해설적으로 드러내는 번역
  rationale: 이 절의 상징 의미는 바로 뒤 문맥에서 설명되므로, 여기서는 실제 행동의 연속을 선명하게 보여 주는 것이 원문 의도에 가장 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
