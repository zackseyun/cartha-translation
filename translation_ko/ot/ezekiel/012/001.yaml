lexical_decisions:
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언 공식에서 דְבַר יְהוָה는 하나님의 계시적 ‘말씀’을 가리키므로, 한국어도 단순한 ‘말’보다 ‘말씀’이 의미와 관용을 함께 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명 표기를 POB 원칙에 따라 고유명사 ‘야훼’로 옮겨, 관호적 칭호로 바꾸지 않고 본래의 언약 이름을 드러냅니다.
- source_word: וַיְהִי ... אֵלַי
  english_pob_choice: And ... came to me
  chosen_korean: 내게 임하여
  alternatives_korean:
  - 내게 왔습니다
  - 내게 이르러
  lexicon: HALOT
  rationale: 히브리어 서술 공식은 단순 이동보다 계시의 도달을 강조하므로, ‘임하다’로 하나님의 말씀이 선지자에게 주어지는 뉘앙스를 살렸습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시기를
  - 말하여
  lexicon: HALOT
  rationale: 직접화법 도입 기능을 한국어에서 자연스럽게 풀어, 앞의 ‘말씀이’와 연결되는 서술을 유지했습니다.
theological_decisions:
- issue: 예언 공식에서 ‘말씀’의 주체와 동사 연결
  chosen_reading: ‘야훼의 말씀이 내게 임하여 말씀하셨습니다’로, 말씀 자체가 선지자에게 임해 발화하는 형식을 살렸습니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 왔습니다’
  - ‘야훼께서 내게 말씀하셨습니다’
  rationale: 히브리어 문장은 ‘야훼의 말씀’이 문장 주어로서 선지자에게 도달하는 예언 공식을 이루므로, 단순 인칭 발화로 평탄화하지 않고 계시 사건의 구조를 보존했습니다.
