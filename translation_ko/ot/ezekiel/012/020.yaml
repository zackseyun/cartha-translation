translation:
  language: ko
  text: 그리고 거주하는 도시들은 무너지며, 그 땅은 황폐하게 될 것입니다. 그러면 너희는 내가 야훼인 줄 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무너지며’는 히브리어 חרב의 결과적·파괴적 의미를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים הַנּוֹשָׁבוֹת
  english_pob_choice: the inhabited cities
  chosen_korean: 거주하는 도시들
  alternatives_korean:
  - 거주한 도시들
  - 사람이 사는 도시들
  - 인구가 있는 도시들
  lexicon: HALOT
  rationale: עִיר와 그 분사형은 도시가 실제로 사람이 살고 있는 상태를 가리키므로, ‘거주하는 도시들’이 간결하면서도 대비되는 파괴 상황을 잘 살립니다.
- source_word: תֶּחֱרַבְנָה
  english_pob_choice: will be laid waste
  chosen_korean: 무너지며
  alternatives_korean:
  - 황폐해지며
  - 폐허가 되며
  - 무너져 내리며
  lexicon: HALOT
  rationale: 여기서는 단순한 상태 묘사보다 심판으로 인한 붕괴·파괴의 결과가 강조되므로, 한국어로는 동적인 ‘무너지며’가 자연스럽습니다.
- source_word: שְׁמָמָה תִהְיֶה
  english_pob_choice: will become a desolation
  chosen_korean: 황폐하게 될 것입니다
  alternatives_korean:
  - 황무지가 될 것입니다
  - 황폐가 될 것입니다
  - 폐허가 될 것입니다
  lexicon: HALOT
  rationale: שְׁמָמָה는 단순 형용사보다 ‘황폐/황무’라는 상태 명사를 포함하므로, ‘황폐하게 될 것입니다’로 상태로의 전환을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 יהוה는 별도 호칭이 아니라 신적 고유명으로서, POB 기준에 따라 전통적 대체어 대신 ‘야훼’를 사용합니다.
theological_decisions:
- issue: 심판 결과 이후의 인식 공식
  chosen_reading: “그러면 너희는 내가 야훼인 줄 알게 될 것입니다”로 결과절을 살렸습니다.
  alternative_readings:
  - “그때 너희는 내가 야훼임을 알게 될 것입니다”
  - “그래서 너희는 내가 야훼라는 것을 알게 될 것입니다”
  rationale: 히브리어의 וִידַעְתֶּם כִּי 구조는 단순 정보 전달보다 심판을 통해 하나님의 정체를 인식하게 되는 결과를 나타내므로, 문맥의 인식-심판 패턴을 유지했습니다.
  doctrine_reference: Ezekiel의 인식 공식(‘너희는 … 알게 될 것이다’)
