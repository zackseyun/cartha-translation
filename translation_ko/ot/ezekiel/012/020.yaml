  source_fidelity: ‘거주하는 도시들’은 도시 자체가 거주하는 듯하여 히브리어 분사 הַנּוֹשָׁבוֹת(사람이 사는, inhabited)를 정확히 옮기지 못합니다. 또한 תֶּחֱרַבְנָה는 단순히 건물이 ‘무너지는’ 것보다 도시가 황폐해지는 재난의 상태를 가리킵니다. שְׁמָמָה는 땅이 ‘황무지/황폐한 땅’이 되는 명사적 결과를 나타냅니다.
  naturalness: ‘사람이 사는 도시들’과 ‘황폐해질 것이며’는 현대 표준 한국어에서 자연스럽고, 예언문에 맞는 합쇼체 문체를 유지합니다. ‘야훼인 줄’보다 ‘내가 야훼임을’이 문어적·격식적 문맥에서 더 매끄럽습니다.
