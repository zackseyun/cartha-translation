translation:
  language: ko
  text: 그러나 나는 그들 가운데 몇몇 남자를 칼과 기근과 전염병에서 살아남게 하여 남겨 두겠습니다. 그들이 가게 되는 민족들 가운데서 자기들의 모든 가증한 일을 전하게 하려는 것입니다.[a] 그러면 그들은 내가 야훼인 줄 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가게 되는’에 해당하는 히브리어 동사는 문법상 완료형입니다. 그러나 이 장래 지향적 문맥에서는 그들이 유배되어 이르게 될 민족들을 가리킵니다.
    reason: lexical_alternative
