base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/016.yaml
  text: But I will spare from among them a few men from the sword[a], from famine, and from pestilence, so that they may recount all their abominations among the nations where they go; and they will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'where they have gone.' The Hebrew verb is formally perfect, but the clause can be rendered more idiomatically in English as future-oriented in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 그들 가운데서 칼과 기근과 전염병에서 살아남을 몇 사람을 남겨 두겠습니다. 그들이 가서 있는 모든 민족 가운데서 자기들의 모든 가증한 일들을 전하게 하려는 것이며, 그들은 내가 야훼인 줄 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘몇 사람’은 히브리어의 남성형 복수 표현을 한국어에서 성별 중립적으로 옮긴 것입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וְהוֹתַרְתִּי
  english_pob_choice: I will spare / leave ... remain
  chosen_korean: 남겨 두겠습니다
  alternatives_korean:
  - 남기겠습니다
  - 살려 두겠습니다
  - 남겨 두어 보존하겠습니다
  lexicon: HALOT
  rationale: 히필 יתר의 핵심은 일부를 남겨 두어 생존하게 하는 뜻이므로, 자연스러운 현대 한국어로 ‘남겨 두겠습니다’가 가장 직접적입니다.
- source_word: מֵהֶם
  english_pob_choice: from among them
  chosen_korean: 그들 가운데서
  alternatives_korean:
  - 그들로부터
  - 그들 중에서
  lexicon: HALOT
  rationale: 단순 출처가 아니라 집단 안에서 일부를 가려내는 부분격이므로 ‘그들 가운데서’가 의미를 드러냅니다.
- source_word: אַנְשֵׁי מִסְפָּר
  english_pob_choice: a few men
  chosen_korean: 몇 사람
  alternatives_korean:
  - 적은 수의 사람
  - 몇몇 남자들
  lexicon: HALOT
  rationale: 히브리어는 남성형이지만 한국어에서는 성별 표지가 본문의 초점이 아니므로, 수량이 적다는 뜻을 살려 ‘몇 사람’으로 옮겼습니다.
- source_word: מֵחֶרֶב מֵרָעָב וּמִדָּבֶר
  english_pob_choice: from the sword, from famine, and from pestilence
  chosen_korean: 칼과 기근과 전염병에서
  alternatives_korean:
  - 전쟁과 기근과 전염병에서
  - 칼과 굶주림과 역병에서
  lexicon: HALOT
  rationale: 예언서의 심판 공식인 ‘칼, 기근, 전염병’을 보존하되, 한국어에서는 탈출/보호의 출발점을 한 번에 묶어 자연스럽게 표현했습니다.
- source_word: לְמַעַן יְסַפְּרוּ
  english_pob_choice: so that they may recount
  chosen_korean: 전하게 하려는 것이며
  alternatives_korean:
  - 이야기하게 하려는 것이며
  - 자세히 말하게 하려는 것이며
  lexicon: HALOT
  rationale: ספר의 반복·열거 뉘앙스를 살리면서도, ‘가증한 일들’을 외부 민족들 앞에 알린다는 문맥에 맞게 ‘전하다’를 택했습니다.
- source_word: תּוֹעֲבוֹתֵיהֶם
  english_pob_choice: all their abominations
  chosen_korean: 자기들의 모든 가증한 일들
  alternatives_korean:
  - 자기들의 모든 가증한 것들
  - 자기들의 모든 혐오스러운 행위들
  lexicon: HALOT
  rationale: תּוֹעֵבָה의 강한 종교·도덕적 비난을 약화하지 않기 위해 관용적이면서도 무게가 있는 ‘가증한 일들’을 사용했습니다.
