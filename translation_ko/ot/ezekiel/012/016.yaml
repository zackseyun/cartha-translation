  naturalness: ‘가게 되는 민족들 가운데서’가 현대 표준어에서 자연스럽고, 장래 지향적 문맥도 잘 드러냅니다. ‘살아남게 하여 남겨 두겠습니다’는 히필 יתר의 의도적인 생존자 보존의 뜻을 한국어로 명료하게 전달합니다.
