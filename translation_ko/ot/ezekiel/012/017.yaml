lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 임하여
  alternatives_korean:
  - 왔습니다
  - 일어났습니다
  lexicon: HALOT
  rationale: 예언 공식에서 사건 발생의 서술보다 하나님의 말씀이 예언자에게 도달하는 동적 의미가 핵심이므로, 현대 한국어에서는 ‘임하다’가 가장 자연스럽고 원문의 기능을 잘 드러냅니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: ‘여호와의 말씀’은 예언서의 고정된 공식이므로, 특정한 하나님의 계시를 가리키는 문맥을 살려 ‘말씀’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문이 여호와 대체어가 아닌 신적 고유명사를 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 하나님의 이름성을 보존했습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내게로
  lexicon: HALOT
  rationale: 예언자 에스겔이 계시의 수신자임을 자연스러운 현대 한국어로 드러내기 위해 ‘내게’를 사용했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말씀하시며
  - 이르시기를
  lexicon: HALOT
  rationale: 직접 화법을 여는 सूत्र로서의 기능을 살리기 위해, 다음 절의 인용을 예고하는 형태로 매끄럽게 이어지도록 처리했습니다.
theological_decisions:
- issue: 신적 음성 공식의 한국어 처리
  chosen_reading: ‘야훼의 말씀이 내게 임하여 말씀하셨습니다’로 번역해, 계시의 주체성과 선지자에게 도달하는 계시 행위를 함께 드러냈습니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 와서 이르렀습니다’
  - ‘야훼의 말씀이 내게 임하였습니다’
  rationale: 예언서의 표준 공식을 단순한 정보 전달로 약화시키지 않고, 원문이 강조하는 신적 발화와 계시의 도래를 동시에 보존하기 위한 선택입니다.
  doctrine_reference: 예언적 계시와 하나님의 주권적 발화
- issue: 예언 공식에서 ‘이르다’ 대신 ‘말씀하다’의 사용
  chosen_reading: 반복되는 직접화법 구조를 위해 마지막 절을 ‘말씀하셨습니다’로 마무리했습니다.
  alternative_readings:
  - ‘이르셨습니다’
  - ‘말씀하여 이르셨습니다’
  rationale: 한국어 예언서 문체에서 흔한 과도한 경어 반복을 피하면서도, 원문의 ‘말하여’ 기능을 자연스럽게 담아냅니다.
  doctrine_reference: 직접계시의 문체적 재현
