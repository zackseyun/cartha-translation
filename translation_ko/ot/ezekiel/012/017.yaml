  text: 야훼의 말씀이 내게 임하여 말씀하셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה를 가리키며, 전통적으로는 ‘주’로 옮기기도 합니다.
