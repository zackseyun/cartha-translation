review_pass:
  verdict: revise
  source_fidelity: 히브리어의 호칭, 수사 의문문(הֲלֹא), ‘이스라엘의 집’과 ‘반역의 집’의 동격 관계, 그리고 인용된 질문을 충실히 반영합니다. 다만 초안의 ‘그’는 원문에 명시된 지시사가 아니므로 본문에서는 빼는 편이 더 직접적입니다.
  naturalness: ‘이스라엘 집’보다는 ‘이스라엘의 집’이 표준 한국어에서 더 자연스럽고, 동격은 ‘곧’으로 명료하게 연결할 수 있습니다. 지정된 현대 합쇼체에 맞추어 서술과 인용문을 ‘말하지 않았습니까’, ‘하고 있습니까’로 조정합니다.
  terminology: 에스겔서의 반복 호칭인 ‘인자야’를 유지합니다. בֵּית יִשְׂרָאֵל은 은유적 집합 표현을 보존하여 ‘이스라엘의 집’으로, בֵּית הַמֶּרִי는 문맥상 ‘반역하는 집’으로 옮깁니다.
  issues:
  - severity: medium
    issue: 합쇼체 register 불일치
    rationale: 초안의 ‘말하지 않았느냐?’와 인용문의 ‘하고 있느냐?’는 해라체/반말 계열이며, 요청된 현대 공식 존댓말(합쇼체)과 맞지 않습니다.
  - severity: low
    issue: ‘그’의 불필요한 명시
    rationale: בֵּית הַמֶּרִי에는 지시사가 없습니다. 한국어에서 동격을 강조하려고 ‘그’를 보탤 수는 있으나, 본문에서는 ‘곧’만으로 동격과 비난의 어조가 충분히 드러납니다.
  - severity: low
    issue: ‘이스라엘 집’의 조사 생략
    rationale: ‘이스라엘의 집’이 현대 표준 한국어에서 더 자연스럽고, 원문의 연계 관계도 분명하게 보여 줍니다.
  revised_text: 인자야, 이스라엘의 집, 곧 반역하는 집이 네게 ‘무엇을 하고 있습니까?’ 하고 말하지 않았습니까?
  revised_footnotes:
  - marker: a
    text: 히브리어 בֵּית הַמֶּרִי는 앞의 ‘이스라엘의 집’과 동격입니다. ‘반역하는 집’은 ‘그 반역하는 집’ 또는 ‘반역의 집’으로도 옮길 수 있습니다.
    reason: alternative_reading
  revision_rationale: 원문의 동격 구조와 수사 의문문을 유지하면서, 명시되지 않은 지시사 ‘그’를 본문에서 제거했습니다. 또한 전체 문장을 요청된 합쇼체로 통일했고, 소유격 조사를 보완하여 자연스러운 표준 한국어 문장으로 다듬었습니다.
