base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/009.yaml
  text: Son of man[a], has not the house of Israel, that rebellious house, said to you, ‘What are you doing?’
  footnotes:
  - marker: a
    text: Or 'the rebellious house.' The Hebrew phrase בֵּית הַמֶּרִי is appositional to 'the house of Israel' and can be rendered with or without 'that' in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 이스라엘 집, 곧 반역하는 그 집이 너에게 「무엇을 하고 있느냐?」 하고 말하지 않았느냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בֵּית הַמֶּרִי는 앞의 '이스라엘 집'과 동격으로, '반역하는 그 집' 또는 '그 반역하는 집'으로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서의 고정된 신적 호칭을 살려, 직역적이면서도 한국어 성경에서 문체적으로 자연스러운 호칭인 '인자야'를 택했습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘의 집
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 언약 공동체를 가리키는 관용구를 유지하기 위해 '집'을 살렸습니다.
- source_word: בֵּית הַמֶּרִי
  english_pob_choice: that rebellious house
  chosen_korean: 반역하는 그 집
  alternatives_korean:
  - 그 반역하는 집
  - 반역한 그 집
  - 반역의 집
  lexicon: HALOT
  rationale: מֶרִי의 핵심 의미인 '반역/패역'을 유지하고, 앞의 '이스라엘 집'에 대한 동격적 설명이라는 점을 '그'로 드러냈습니다.
- source_word: מָה אַתָּה עֹשֶׂה
  english_pob_choice: What are you doing?
  chosen_korean: 무엇을 하고 있느냐?
  alternatives_korean:
  - 무엇을 하느냐?
  - 뭘 하고 있느냐?
  lexicon: HALOT
  rationale: 현재 진행의 질문 뉘앙스를 살리기 위해 '하고 있느냐'로 옮겼습니다.
theological_decisions:
- issue: 예언자에게 주어지는 신적 호칭의 한국어 처리
  chosen_reading: ‘בֶּן אָדָם’을 에스겔의 반복적 호칭으로 보아 '인자야'로 유지했습니다.
  alternative_readings:
  - 사람아
  - 인간아
  rationale: 본문의 문학적 반복성과 소명 맥락을 보존하는 것이 중요하므로, 의미 풀이보다 고정 호칭을 우선했습니다.
  doctrine_reference: 에스겔 2–12장의 선지자 소명/호칭 관찰
