lexical_decisions:
- source_word: בְּ/תִתִּ/י אֶת אֶרֶץ מִצְרַיִם שְׁמָמָה
  english_pob_choice: When I make the land of Egypt a desolation
  chosen_korean: 내가 이집트 땅을 황폐한 황무지로 만들고
  alternatives_korean:
  - 내가 이집트 땅을 황무지로 만들고
