  text: When I make the land of Egypt a desolation[a], and the land is stripped of all that fills it, when I strike down all who dwell in it, then they will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'and the land is laid waste, emptied of all that fills it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이집트 땅을 폐허로 만들고, 그 땅이 그 안에 가득한 모든 것을 잃어 황폐해지며[a], 내가 그곳의 모든 주민을 쳐서 쓰러뜨릴 때, 그들은 내가 야훼인 줄 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅이 그 충만함을 빼앗겨 황폐해지며’로 옮길 수 있습니다.
