  lexicon: HALOT
  rationale: שְׁמָמָה의 명사적 힘을 살리되, 한국어에서는 '황폐한 황무지'로 옮겨 상태와 결과를 함께 드러냈습니다.
- source_word: וּנְשַׁמָּה אֶרֶץ מִמְּלֹאָהּ
  english_pob_choice: and the land is stripped of all that fills it
  chosen_korean: 그 땅이 그 안에 가득한 모든 것에서 비어 버릴 때
  alternatives_korean:
  - 그 땅이 그 안에 가득한 모든 것에서 텅 비게 될 때
  - 그 땅이 그 안의 모든 충만함에서 비게 될 때
  lexicon: HALOT
  rationale: מְלֹא/מְלֹאָהּ의 '가득함'과 그것이 비워지는 뜻을 살려, 문자적이면서도 자연스러운 '비어 버리다'로 옮겼습니다.
- source_word: בְּ/הַכּוֹתִי אֶת כָּל יֹשְׁבֵי בָהּ
  english_pob_choice: when I strike down all who dwell in it
  chosen_korean: 내가 그 안에 사는 모든 사람을 쳐서 넘어뜨리면
  alternatives_korean:
  - 내가 그 안에 사는 모든 사람을 치면
  - 내가 그 안에 사는 모든 사람을 죽이면
  lexicon: HALOT
  rationale: הכה는 여기서 심판의 치명적 타격을 가리키므로, 단순 '치다'보다 결과를 드러내는 '쳐서 넘어뜨리다'를 택했습니다.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  english_pob_choice: then they will know that I am Yahweh
  chosen_korean: 그들은 내가 야훼임을 알게 될 것입니다.
  alternatives_korean:
  - 그들은 내가 야훼인 줄 알게 될 것입니다.
  - 그들은 내가 여호와임을 알게 될 것입니다.
  lexicon: HALOT
  rationale: 예언서의 인식 공식은 결과를 나타내는 미래형으로 자연스럽게 살렸고, יְהוָה는 본 프로젝트 기준에 따라 '야훼'로 옮겼습니다.
