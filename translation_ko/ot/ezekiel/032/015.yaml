  terminology: יְהוָה를 ‘야훼’로 옮긴 것은 프로젝트 기준에 맞습니다. ‘주민’은 יֹשְׁבֵי בָהּ를 자연스럽고 정확하게 옮깁니다. הכה는 문맥상 치명적인 심판을 가리키므로 ‘쳐서 쓰러뜨리다’가 ‘쳐서 넘어뜨리다’보다 자연스럽습니다.
