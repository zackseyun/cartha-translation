theological_decisions:
- issue: 인자야라는 호칭의 문체와 신학적 기능
  chosen_reading: 에스겔의 예언자 소명 호칭으로서 직역에 가깝게 유지하되, 현대 한국어에서 자연스럽도록 '인자야'로 호명했습니다.
  alternative_readings:
  - 사람아
  - 인간아
  - 인자
  rationale: 본문의 하나님의 직접 호칭을 완화하지 않고, 에스겔서에서 반복되는 예언자-하나님 관계의 긴박감을 보존합니다.
  doctrine_reference: 에스겔 2–3장의 예언자 소명 패턴
- issue: 아래의 땅 / 구덩이의 사후 세계 이미지
  chosen_reading: 후대의 정식화된 '지옥'으로 바꾸지 않고, 죽은 자들의 영역을 가리키는 시적 하강 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 저승
  - 음부
  - 지옥
  rationale: 본문은 심판의 하강 이미지를 말하지만, 용어를 지나치게 특정 교리로 고정하면 히브리어의 시적 긴장을 잃게 됩니다.
  doctrine_reference: '번역 철학 §3: 신학적 긴장을 해소하지 말고 보존할 것'
