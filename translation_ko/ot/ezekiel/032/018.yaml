source:
  edition: WLC
  text: בֶּן אָדָ֕ם נְהֵ֛ה עַל הֲמ֥וֹן מִצְרַ֖יִם וְ/הוֹרִדֵ֑/הוּ א֠וֹתָ/הּ וּ/בְנ֨וֹת גּוֹיִ֧ם אַדִּרִ֛ם אֶל אֶ֥רֶץ תַּחְתִּיּ֖וֹת אֶת י֥וֹרְדֵי בֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/018.yaml
  text: Son of man[a], wail over the multitude of Egypt, and bring her down, her and the daughters of mighty nations, to the land beneath[c][b], with those who go down to the pit.
  footnotes:
  - marker: a
    text: Or 'lament over the hordes of Egypt.' The Hebrew word can denote a multitude or throng.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the daughters of mighty nations,' a figurative expression for nations or peoples associated with Egypt.
    reason: cultural_note
  - marker: c
    text: Or 'the lower earth' or 'the netherworld.' The Hebrew speaks of the realm beneath, associated with the dead.
    reason: alternative_reading
translation:
  language: ko
  text: 인자야, 이집트의 무리를 향해 통곡하고, 그들을 아래의 땅으로 — 그들과 함께 구덩이로 내려가는 자들과 함께 — 그와 그의 여러 민족의 딸들을 끌어내리십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew 'the multitude of Egypt' can also mean 'the hordes of Egypt.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase 'the daughters of mighty nations' is a figurative expression for peoples associated with Egypt.
    reason: cultural_note
  - marker: c
    text: Or 'the lower earth' or 'the netherworld.' The Hebrew speaks of the realm beneath, associated with the dead.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 인자야
  - 인간아
  lexicon: HALOT
  rationale: 에스겔서의 하나님의 호칭으로 굳어진 표현을 살리되, 표준어 합쇼체에 맞게 직접 호명형으로 처리했습니다.
- source_word: נְהֵה
  english_pob_choice: wail
  chosen_korean: 통곡하다
  alternatives_korean:
  - 애곡하다
  - 슬피 부르짖다
  - 곡하다
  lexicon: HALOT
  rationale: 장례식 같은 애도와 공개적 울부짖음의 강도를 현대 한국어에서 자연스럽게 드러내는 말로 선택했습니다.
- source_word: הֲמוֹן מִצְרַיִם
  english_pob_choice: the multitude of Egypt
  chosen_korean: 이집트의 무리
  alternatives_korean:
  - 이집트의 군중
  - 이집트의 떼
  - 이집트의 수효
  lexicon: HALOT
  rationale: הֲמוֹן의 다중·무리 의미를 살리면서도, 본문이 이집트 전체 집단을 가리키는 judgment 문맥임을 드러내는 자연스러운 표현으로 옮겼습니다.
- source_word: וְהוֹרִדֵהוּ / אוֹתָהּ
  english_pob_choice: bring her down
  chosen_korean: 그들을 … 끌어내리십시오
  alternatives_korean:
  - 그녀를 내려보내십시오
  - 그것을 끌어내리십시오
  - 그를 끌어내리십시오
  lexicon: HALOT
  rationale: 본문의 자음-대명사 불일치를 한국어에서 그대로 재현하기보다, 뒤의 여성형 대명사와 집합명사 맥락을 따라 이집트를 집단으로 처리했습니다. '끌어내리다'는 causative 하강 이미지를 보존합니다.
- source_word: אֶרֶץ תַּחְתִּיּוֹת / אֶת יֹרְדֵי בוֹר
  english_pob_choice: the land beneath / with those who go down to the pit
  chosen_korean: 아래의 땅으로 … 구덩이로 내려가는 자들과 함께
  alternatives_korean:
  - 지하의 땅으로 … 구덩이로 내려가는 자들과 함께
  - 저 아래 땅으로 … 무덤으로 내려가는 자들과 함께
  - 저승으로 … 구덩이로 내려가는 자들과 함께
  lexicon: HALOT
  rationale: 지하세계 이미지를 너무 교리화하지 않도록 '아래의 땅'을 택했고, בוֹר는 문맥상 '구덩이'로 옮겨 죽음의 함의를 살렸습니다.
theological_decisions:
- issue: 인자야라는 호칭의 문체와 신학적 기능
  chosen_reading: 에스겔의 예언자 소명 호칭으로서 직역에 가깝게 유지하되, 현대 한국어에서 자연스럽도록 '인자야'로 호명했습니다.
  alternative_readings:
  - 사람아
  - 인간아
  - 인자
  rationale: 본문의 하나님의 직접 호칭을 완화하지 않고, 에스겔서에서 반복되는 예언자-하나님 관계의 긴박감을 보존합니다.
  doctrine_reference: 에스겔 2–3장의 예언자 소명 패턴
- issue: 아래의 땅 / 구덩이의 사후 세계 이미지
  chosen_reading: 후대의 정식화된 '지옥'으로 바꾸지 않고, 죽은 자들의 영역을 가리키는 시적 하강 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 저승
  - 음부
  - 지옥
  rationale: 본문은 심판의 하강 이미지를 말하지만, 용어를 지나치게 특정 교리로 고정하면 히브리어의 시적 긴장을 잃게 됩니다.
  doctrine_reference: '번역 철학 §3: 신학적 긴장을 해소하지 말고 보존할 것'
