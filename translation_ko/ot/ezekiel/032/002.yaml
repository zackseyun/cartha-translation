base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/002.yaml
  text: 'Son of man[a], raise a lament over Pharaoh king of Egypt, and say to him: You compared yourself to a young lion among the nations, but you were like the monster in the seas; you burst forth in your rivers, and muddied the waters with your feet[c][b], and fouled their rivers.'
  footnotes:
  - marker: a
    text: Or 'You were likened to a young lion among the nations.' The Hebrew verb may be read passively rather than reflexively.
    reason: alternative_reading
  - marker: b
    text: Hebrew tannin/tannim in this context likely refers to a great aquatic creature; possible renderings include 'dragon' or 'sea monster.'
    reason: lexical_alternative
  - marker: c
    text: Or 'you trampled their rivers.' The Hebrew verb emphasizes trampling; 'fouled' brings out the effect in the water imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 인자여[a], 애굽 왕 바로를 두고 애가를 부르십시오. 그에게 이렇게 말씀하십시오. ‘너는 민족들 가운데 젊은 사자로 여김을 받았으나, 너는 바다의 괴물[b]과 같았다. 네 강들에서 날뛰며 네 발로 물을 흐리고, 그들의 강들을 더럽혔다[c].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너는 민족들 가운데 젊은 사자처럼 스스로를 여겼다.’ 히브리어 동사는 수동으로도 재귀적으로도 읽을 수 있다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 탄닌/탄님은 이 문맥에서 큰 수중 생물을 가리킬 가능성이 높다. ‘용’ 또는 ‘바다 괴물’로도 옮길 수 있다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들의 강들을 짓밟았다.’ 히브리어 동사는 짓밟는 행위를 강조하며, ‘더럽혔다’는 물의 이미지에서 그 결과를 드러낸다.
    reason: lexical_alternative
