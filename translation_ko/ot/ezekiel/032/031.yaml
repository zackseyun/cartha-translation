id: EZK.32.31
reference: Ezekiel 32:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אוֹתָ/ם֙ יִרְאֶ֣ה פַרְעֹ֔ה וְ/נִחַ֖ם עַל כָּל המונ/ה חַלְלֵי חֶ֨רֶב֙ פַּרְעֹ֣ה וְ/כָל חֵיל֔/וֹ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/031.yaml
  text: Pharaoh will see them and be comforted over all his multitude[a], Pharaoh and all his army, slain by the sword, declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'and be consoled' / 'and take comfort.' The Hebrew verb can also mean 'be sorry' or 'relent' in other contexts, but here it likely means that Pharaoh finds grim consolation when he sees others sharing his downfall.
    reason: lexical_alternative
translation:
  language: ko
  text: 파라오는 그들을 보고 자기의 온 무리, 곧 칼에 죽임을 당한 파라오와 그의 모든 군대를 두고 위로를 받을 것입니다[a]. 주 하나님이 선포하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 נחם은 문맥에 따라 ‘위로를 받다’, ‘위안을 얻다’, 또는 ‘후회하다’ 등으로 번역될 수 있습니다. 여기서는 파라오가 다른 패망한 무리들을 보고 자기의 온 무리의 죽음을 두고 암울한 위안을 얻는다는 뜻으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֶה
  english_pob_choice: will see
  chosen_korean: 보고
  alternatives_korean:
  - 볼 것이며
  - 보게 될 것이며
  lexicon: HALOT
  rationale: 예언문맥의 미래 의미를 자연스러운 서술형으로 옮기되, 뒤의 감정 반응과 연결되도록 ‘보고’로 처리했습니다.
- source_word: וְנִחַם
  english_pob_choice: and be comforted
  chosen_korean: 위로를 얻을 것입니다
  alternatives_korean:
  - 위로를 받을 것입니다
  - 위안을 얻을 것입니다
  - 마음이 놓일 것입니다
  lexicon: HALOT
  rationale: 문맥상 남의 멸망을 보며 기괴한 안도감을 얻는 뜻을 살리기 위해, 단순한 ‘조금 나아지다’보다 ‘위로를 얻다’가 원문의 역설을 더 잘 보존합니다.
- source_word: עַל כָּל הֲמוֹנוֹ
  english_pob_choice: over all his multitude
  chosen_korean: 자기의 온 무리를 두고
  alternatives_korean:
  - 자기의 모든 무리 위로
  - 자기의 온 무리로 인해
  - 자기의 모든 무리에 관하여
  lexicon: HALOT
  rationale: עַל은 여기서 ‘~에 대하여/두고’의 초점을 띠므로, 위로의 대상이 되는 ‘온 무리’를 한국어 조사구로 풀어 자연스럽게 표현했습니다.
- source_word: חַלְלֵי חֶרֶב
  english_pob_choice: slain by the sword
  chosen_korean: 칼에 죽임을 당한 자들
  alternatives_korean:
  - 칼에 쓰러진 자들
  - 칼에 죽은 자들
  - 칼에 찔려 죽은 자들
  lexicon: HALOT
  rationale: 히브리어 관용구의 폭력성과 집단성을 살리기 위해, 보다 직설적인 ‘죽임을 당한 자들’로 옮겼습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님이 선포하십니다
  alternatives_korean:
  - 주 야훼께서 말씀하십니다
  - 주 하나님이 말씀하십니다
  - 주 하나님의 선포입니다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם은 한국어에서 ‘선포하십니다’가 가장 응집력 있게 대응하며, אֲדֹנָי יְהוִה는 관례적으로 ‘주 하나님’으로 처리했습니다.
theological_decisions:
- issue: YHWH 표기와 아도나이 결합형의 처리
  chosen_reading: ‘주 하나님’으로 번역해 예언적 선언 공식의 장엄함을 유지했습니다.
  alternative_readings:
  - ‘주 야훼’로 직역
  - ‘주님 하나님’으로 번역
  rationale: 이 구절은 אֲדֹנָי 뒤에 יְהוִה가 오는 결합형이라 한국어 본문에서는 중복을 피하면서도 호칭의 무게를 살리는 방식이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — divine name rendering in prophetic formulas'
