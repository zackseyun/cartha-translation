  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וּ/פָרַשְׂתִּ֤י עָלֶ֨י/ךָ֙ אֶת רִשְׁתִּ֔/י בִּ/קְהַ֖ל עַמִּ֣ים רַבִּ֑ים וְ/הֶעֱל֖וּ/ךָ בְּ/חֶרְמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/003.yaml
  text: 'Thus says the Lord GOD: I will spread my net over you with an assembly of many peoples[b][a], and they will haul you up in my dragnet.'
  footnotes:
  - marker: a
    text: Hebrew 'with/in an assembly of many peoples'; the phrase may mean that many peoples are the instrument by which God spreads the net.
    reason: lexical_alternative
  - marker: b
    text: Or 'and they will draw you up in my net.' The Hebrew uses a second fishing-net term here, distinct from 'net' earlier in the verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 여호와께서 이렇게 말씀하십니다. 내가 많은 백성의 모임과 함께[a] 너 위에 내 그물을 펼치겠고, 그들이 너를 내 끌그물로[b] 끌어올릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘많은 백성의 모임 안에서’ 또는 ‘많은 백성의 모임을 통하여’로도 이해될 수 있습니다. 이 경우 많은 백성이 하나님께서 그물을 펼치시는 도구가 된다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 너를 내 그물로 끌어올릴 것입니다.’ 여기에는 앞의 ‘그물’과 다른 낚시 그물 용어가 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 여호와
  alternatives_korean:
  - 주 하나님
  - 주 야훼
  lexicon: HALOT
  rationale: 히브리어의 결합 호칭은 주권적 호칭 אֲדֹנָי와 언약 이름 יְהוָה가 함께 나온 것으로, 한국어 본문에서는 자연스러운 경어 호칭을 살리되 יְהוָה를 여호와로 옮겨 구별을 드러냈습니다.
- source_word: וּפָרַשְׂתִּי
  english_pob_choice: I will spread
  chosen_korean: 내 그물을 펼치겠고
  alternatives_korean:
  - 내 그물을 펼치겠습니다
  - 내 그물을 퍼뜨리겠습니다
  lexicon: HALOT
  rationale: 그물의 이미지를 유지하기 위해 '펼치다'를 택했고, 'spread'의 동작성과 방향성을 한국어로 가장 자연스럽게 살렸습니다.
- source_word: בִּקְהַל עַמִּים רַבִּים
  english_pob_choice: with an assembly of many peoples
  chosen_korean: 많은 백성의 모임 가운데서
  alternatives_korean:
  - 많은 민족의 모임 가운데서
  - 많은 백성의 회중 가운데서
  - 많은 백성의 모임으로
  lexicon: HALOT
  rationale: קהל은 단순한 숫자가 아니라 '모여 있는 집단'을 가리키므로 '모임'으로 살렸고, עמים רבים은 문맥상 '백성'으로 옮겨 복수 집합의 뉘앙스를 유지했습니다.
- source_word: בְּחֶרְמִי
  english_pob_choice: in my dragnet
  chosen_korean: 내 큰 그물
  alternatives_korean:
  - 내 투망
  - 내 자루그물
  - 내 끌그물
  lexicon: HALOT
  rationale: 히브리어의 दूसरा 그물 용어가 앞의 רשת와 구별되지만, 한국어에서 '끌어올리다'와 결합할 때 의미가 자연스럽도록 '큰 그물'로 옮겨 포획의 강도를 드러냈습니다.
