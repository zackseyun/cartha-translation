  - 주 하나님
  rationale: 본문은 אֲדֹנָי יְהוִה의 결합 호칭을 사용하므로, 예배적 호칭 '주'와 고유명사 표지인 여호와를 함께 살려 원문 구별을 보존했습니다.
  doctrine_reference: POB naming convention for YHWH / compound divine titles
