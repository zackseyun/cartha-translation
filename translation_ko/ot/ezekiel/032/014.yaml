base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/014.yaml
  text: Then I will let their waters settle[a], and I will make their rivers flow like oil[b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or, 'I will make their waters sink/subside.' The Hebrew verb can denote causing waters to settle down or become still.
    reason: lexical_alternative
  - marker: b
    text: Or, 'I will lead their rivers like oil,' that is, cause them to move smoothly like oil.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 그들의 물이 가라앉게 하고[a], 그들의 강들을 기름처럼 흐르게 하겠습니다[b]. 주 야훼의 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가라앉게 하고’는 히브리어 히필 동사의 사역적 의미를 살린 번역입니다. ‘그들의 물을 가라앉히다’ 또는 ‘그들의 물이 잠잠해지게 하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘흐르게 하겠습니다’는 직역하면 ‘인도하겠다’ 또는 ‘가게 하겠다’에 가깝지만, 강의 흐름을 자연스럽게 살린 옮김입니다.
    reason: lexical_alternative
