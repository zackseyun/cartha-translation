  - 주 여호와
  rationale: 이 절의 공식문구는 ‘주 하나님’이 한국어 예언문체에서 가장 읽기 자연스럽고, 합성호칭의 경중도 유지합니다. 본문 전체의 문체 일관성도 고려했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: 심판 선언의 화자 표지
  chosen_reading: 말씀하십니다
  alternative_readings:
  - 선언하십니다
