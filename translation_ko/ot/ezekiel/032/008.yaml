base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/008.yaml
  text: All the lights of light in the heavens I will darken over you[a], and I will put darkness over your land, declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'the luminaries in the heavens.' The Hebrew phrase is literally 'the lights of light in the heavens,' referring to the heavenly bodies as sources of light.
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘의 모든 빛나는 광체를 내가 너희 위에 어둡게 하며, 네 땅 위에 어둠을 두겠습니다. 주 하나님께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빛나는 광체’는 히브리어의 문자적 표현인 ‘빛의 빛들’을 자연스럽게 옮긴 것입니다. 이는 하늘의 천체들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מְאֹרֵי אוֹר
  english_pob_choice: All the lights of light
  chosen_korean: 하늘의 모든 빛나는 광체
  alternatives_korean:
  - 하늘의 모든 광명체
  - 하늘의 모든 빛의 등불
  - 하늘의 모든 조명들
  lexicon: HALOT
  rationale: 직역형의 ‘빛의 빛’ 구조는 한국어에서 그대로 옮기면 부자연스러워서, 하늘의 천체를 가리키는 문맥을 살려 ‘빛나는 광체’로 옮겼습니다.
- source_word: בַּשָּׁמַיִם
  english_pob_choice: in the heavens
  chosen_korean: 하늘의
  alternatives_korean:
  - 하늘들의
  - 하늘에 있는
  - 하늘 가운데의
  lexicon: HALOT
  rationale: 복수형 어감을 과도하게 드러내지 않으면서도 우주적 심판 이미지를 유지하기 위해 ‘하늘의’로 자연스럽게 처리했습니다.
- source_word: אַקְדִּירֵם עָלֶיךָ
  english_pob_choice: I will darken over you
  chosen_korean: 내가 너희 위에 어둡게 하며
  alternatives_korean:
  - 내가 너희 위를 어둡게 하며
  - 내가 너희 위에 어둠을 드리우며
  - 내가 너희 위로 어둡게 하며
  lexicon: HALOT
  rationale: הִפְעִיל형의 사역적 의미를 살리되, 한국어에서는 ‘어둡게 하다’가 가장 직접적이고 자연스럽습니다. ‘위에’는 심판이 내려오는 방향성을 보존합니다.
- source_word: וְנָתַתִּי חֹשֶׁךְ
  english_pob_choice: and I will put darkness
  chosen_korean: 어둠을 두겠습니다
  alternatives_korean:
  - 어둠을 놓겠습니다
  - 어둠을 내리겠습니다
  - 어둠을 퍼뜨리겠습니다
  lexicon: HALOT
  rationale: נתן의 기본 의미인 ‘두다/놓다’를 유지해, 원문의 구체성을 살렸습니다. ‘두겠습니다’는 문맥상 예언적 진술에 맞는 격식을 가집니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님께서 말씀하십니다
  alternatives_korean:
  - 주 하나님이 선언하십니다
  - 주 하나님께서 말씀하신다
  - 주 여호와께서 말씀하십니다
  lexicon: HALOT
  rationale: אנֹדָי + יהוה의 합성 호칭은 한국어에서 ‘주 하나님’으로 옮기면 두 요소를 모두 자연스럽게 보존할 수 있습니다. 종결은 예언 공식에 맞춰 ‘말씀하십니다’로 처리했습니다.
theological_decisions:
- issue: 하나님 호칭 יְהוִה의 한국어 처리
