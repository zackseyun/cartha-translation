  yaml_path: translation/ot/ezekiel/032/008.yaml
  text: All the lights of light in the heavens I will darken over you[a], and I will put darkness over your land, declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'the luminaries in the heavens.' The Hebrew phrase is literally 'the lights of light in the heavens,' referring to the heavenly bodies as sources of light.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 하늘의 모든 빛나는 광체를 네 위에서 어둡게 하고, 네 땅 위에 어둠을 두겠습니다. 주 야훼께서 선언하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빛나는 광체’는 히브리어의 문자적 표현인 ‘빛의 빛들’을 자연스럽게 옮긴 것입니다. 이는 하늘의 천체들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מְאֹרֵי אוֹר
  english_pob_choice: All the lights of light
  chosen_korean: 하늘의 모든 빛나는 광체
  alternatives_korean:
  - 하늘의 모든 광명체
  - 하늘의 모든 빛의 등불
  - 하늘의 모든 조명들
  lexicon: HALOT
  rationale: 직역형의 ‘빛의 빛’ 구조는 한국어에서 그대로 옮기면 부자연스러워서, 하늘의 천체를 가리키는 문맥을 살려 ‘빛나는 광체’로 옮겼습니다.
- source_word: בַּשָּׁמַיִם
