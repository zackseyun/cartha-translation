- from: 내가 그의 두려움을 살아 있는 땅에 두었기 때문입니다[a]. 그는 할례받지 않은 자들 가운데, 칼에 죽임을 당한 자들과 함께 눕게 될 것입니다—바로 파라오와 그의 모든 무리입니다. 주 하나님이 선포하십니다.
  to: 내가 그가 끼친 공포를 산 자들의 땅에 두었으므로[a], 그, 곧 파라오와 그의 모든 무리는 할례받지 않은 자들 가운데서 칼에 죽임을 당한 자들과 함께 눕혀질 것입니다. 주 하나님이 선포하십니다.
  rationale: 본문의 기본 독법인 ‘그의 공포’를 유지하면서도, 한국어에서 소유격이 일으킬 수 있는 의미상의 모호함을 ‘그가 끼친 공포’로 해소했습니다. ‘산 자들의 땅’은 죽은 자들의 영역과 대조되는 히브리 관용구를 자연스럽게 반영합니다. 또한 파라오와 그의 무리가 심판의 대상이라는 문장 관계 및 ‘눕혀질’의 수동 의미를 분명히 했습니다.
