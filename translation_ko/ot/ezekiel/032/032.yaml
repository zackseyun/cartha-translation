translation:
  language: ko
  text: 내가 그가 끼친 공포를 산 자들의 땅에 두었으므로[a], 그, 곧 파라오와 그의 모든 무리는 할례받지 않은 자들 가운데서 칼에 죽임을 당한 자들과 함께 눕혀질 것입니다. 주 하나님이 선포하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 고대 증거는 “내 공포”로 읽습니다. 여기의 히브리어 본문은 “그가 끼친 공포”라고 되어 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: נָתַתִּי
  english_pob_choice: I put
  chosen_korean: 두었습니다
  alternatives_korean:
  - 놓았습니다
  - 세웠습니다
  lexicon: HALOT
  rationale: 대상인 ‘두려움’을 특정 영역에 ‘두다’는 배치·설정의 의미를 자연스럽게 살리며, 문맥의 심판 선언에도 잘 맞습니다.
- source_word: חֲתִיתוֹ
  english_pob_choice: his terror
  chosen_korean: 그의 두려움
  alternatives_korean:
  - 그의 공포
  - 그의 경외
  lexicon: HALOT
  rationale: 문맥상 파라오가 생전에 퍼뜨린 공포를 가리키므로 ‘두려움’이 가장 무난하고, 소유격도 원문대로 반영합니다.
- source_word: בְּאֶרֶץ חַיִּים
  english_pob_choice: in the land of the living
  chosen_korean: 살아 있는 땅에
  alternatives_korean:
  - 생명 있는 땅에
  - 생자의 땅에
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어로도 자연스럽게 전달하도록 했습니다. ‘살아 있는 땅’은 죽은 자의 영역과 대비를 분명히 합니다.
- source_word: בְּתוֹךְ עֲרֵלִים
  english_pob_choice: among the uncircumcised
  chosen_korean: 할례받지 않은 자들 가운데
  alternatives_korean:
  - 무할례자들 가운데
  - 할례 없는 자들 가운데
  lexicon: HALOT
  rationale: ‘할례받지 않은 자들’은 문자적 의미를 살리면서도 예언서에서의 수치·이방성 뉘앙스를 유지합니다. ‘가운데’는 בְּתוֹךְ의 위치감을 반영합니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님이 선포하십니다
  alternatives_korean:
  - 주 하나님께서 말씀하십니다
  - 주 야훼께서 선포하십니다
  lexicon: HALOT
  rationale: 예언 공식인 נְאֻם은 단순 과거 서술이 아니라 선언 형식이므로 ‘선포하십니다’로 옮겼습니다. 아도나이+야훼 결합은 한국어 관례에 따라 ‘주 하나님’으로 처리했습니다.
theological_decisions:
- issue: 본문의 3인칭 소유격 חֲתִיתוֹ를 어떻게 이해할지
  chosen_reading: ‘그의 두려움’으로 옮겨 파라오가 남에게 끼친 공포를 가리키는 것으로 반영했습니다.
  alternative_readings:
  - ‘내 두려움’으로 읽는 일부 사본·옛 번역 반영
  - ‘그의 공포’의 보다 강한 표현
  rationale: 주어진 히브리어 본문은 3인칭 소유격을 지니므로 이를 우선 따르되, 본문 전통의 변이 가능성은 각주로 남겨 해석상 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 본문 변이의 경우 각주로 대안 독법 보존
