  yaml_path: translation/ot/ezekiel/032/032.yaml
  text: For I put his terror in the land of the living[a], and he will be laid among the uncircumcised, with those slain by the sword—Pharaoh and all his multitude, declares the Lord GOD.
  footnotes:
  - marker: a
    text: 'Or, following some ancient witnesses: “my terror in the land of the living.” The Hebrew text here reads “his terror.”'
