source:
  edition: WLC
  text: וְ/הִשְׁקֵיתִ֨י אֶ֧רֶץ צָפָתְ/ךָ֛ מִ/דָּמְ/ךָ֖ אֶל הֶֽ/הָרִ֑ים וַ/אֲפִקִ֖ים יִמָּלְא֥וּ/ן מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/006.yaml
  text: I will drench the land with your flowing blood up to the mountains[c][b][a], and the ravines will be filled with you.
  footnotes:
  - marker: a
    text: Or 'I will water the land of your outpouring with your blood.' The Hebrew expression is difficult; the translation 'your flowing blood' brings out the likely sense in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'channels' or 'riverbeds' for 'ravines.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'the ravines will be filled from you,' likely meaning with your blood or remains.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 네 피로 그 땅을 산에까지 적시겠고, 골짜기들은 너로 가득 차게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘적시겠고’는 히브리어 사역형 שׁקה의 심판적 용법을 살린 번역입니다.
    reason: source_note
  - marker: b
    text: ‘골짜기들’은 히브리어 אֲפִקִים이 가리킬 수 있는 물길, 하천 바닥, 골짜기 등의 범위를 포괄하는 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקֵיתִי
  english_pob_choice: I will drench
  chosen_korean: 적시겠고
  alternatives_korean:
  - 물을 주겠고
  - 흠뻑 적시겠고
  - 젖게 하겠고
  lexicon: HALOT
  rationale: שקה의 사역형을 문자적으로만 옮기면 ‘물을 주다’이지만, 심판 맥락에서 피로 땅이 흥건해지는 이미지를 살리기 위해 ‘적시다’를 택했습니다.
- source_word: אֶרֶץ
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 땅
  - 지면
  - 그 나라
  lexicon: HALOT
  rationale: 즉시적 지형 이미지를 유지하면서도 대상 지역을 자연스럽게 가리키기 위해 ‘그 땅’으로 옮겼습니다.
- source_word: אֶל הֶהָרִים
  english_pob_choice: up to the mountains
  chosen_korean: 산에까지
  alternatives_korean:
  - 산들까지
  - 산으로
  - 산까지
  lexicon: HALOT
  rationale: אֶל의 범위 확장 의미를 살려, 피가 퍼져 닿는 한계를 ‘까지’로 표현했습니다.
- source_word: וַאֲפִקִים
  english_pob_choice: the ravines
  chosen_korean: 골짜기들
  alternatives_korean:
  - 협곡들
  - 도랑들
  - 시내골
  lexicon: HALOT
  rationale: אֲפִיקִים은 물길, 골짜기, 하천 바닥 등을 가리킬 수 있으나, 산과 대조되는 심판 풍경에서는 ‘골짜기들’이 가장 자연스럽고 넓게 포착합니다.
- source_word: יִמָּלְאוּן מִמֶּךָּ
  english_pob_choice: will be filled with you
  chosen_korean: 너로 가득 차게 될 것입니다
  alternatives_korean:
  - 네 것으로 가득할 것입니다
  - 너로 채워질 것입니다
  - 너의 흔적으로 가득할 것입니다
  lexicon: HALOT
  rationale: 직역의 ‘너로부터’보다, 문맥상 죽임당한 존재의 피와 잔해가 채워진다는 뜻을 한국어 자연문으로 드러내기 위해 ‘너로 가득 차게 되다’를 택했습니다.
theological_decisions:
- issue: 심판 이미지의 강도
  chosen_reading: 피로 땅을 적시는 폭력적 심판 이미지를 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - ‘물로 적시다’처럼 중화하는 표현
  - ‘젖게 하다’로 완곡하게 옮기는 표현
  rationale: 본문은 애가나 서술이 아니라 신탁 심판의 선언이므로, 피의 충격성과 가시성을 약화시키지 않는 번역이 source-direct합니다.
  doctrine_reference: 예언서의 신탁 심판 표현
