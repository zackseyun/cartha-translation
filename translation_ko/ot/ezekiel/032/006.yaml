  lexicon: HALOT
  rationale: אֶל의 범위 확장 의미를 살려, 피가 퍼져 닿는 한계를 ‘까지’로 표현했습니다.
- source_word: וַאֲפִקִים
  english_pob_choice: the ravines
  chosen_korean: 골짜기들
  alternatives_korean:
  - 협곡들
  - 도랑들
  - 시내골
  lexicon: HALOT
  rationale: אֲפִיקִים은 물길, 골짜기, 하천 바닥 등을 가리킬 수 있으나, 산과 대조되는 심판 풍경에서는 ‘골짜기들’이 가장 자연스럽고 넓게 포착합니다.
- source_word: יִמָּלְאוּן מִמֶּךָּ
  english_pob_choice: will be filled with you
  chosen_korean: 너로 가득 차게 될 것입니다
  alternatives_korean:
