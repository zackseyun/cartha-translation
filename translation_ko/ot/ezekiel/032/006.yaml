  - 너로 채워질 것입니다
  - 너의 흔적으로 가득할 것입니다
  lexicon: HALOT
  rationale: 직역의 ‘너로부터’보다, 문맥상 죽임당한 존재의 피와 잔해가 채워진다는 뜻을 한국어 자연문으로 드러내기 위해 ‘너로 가득 차게 되다’를 택했습니다.
