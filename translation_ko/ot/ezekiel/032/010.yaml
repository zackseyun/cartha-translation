base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/010.yaml
  text: I will make many peoples appalled at you[a], and their kings will shudder over you when I brandish my sword before them; and they will tremble every moment, each man for his own life[c][b], on the day of your downfall.
  footnotes:
  - marker: a
    text: Or 'their kings will be horribly afraid because of you'—the Hebrew uses a verb and cognate noun for intense horror.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'when I make my sword fly before them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from moment to moment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 많은 민족을 너로 말미암아 경악하게 하겠고, 내가 내 칼을 그들 앞에서 휘두를 때에 그들의 왕들은 너로 말미암아 몹시 전율할 것이다.[a][b] 네가 무너지는 날에 그들은 저마다 자기 목숨을 위하여 매 순간 떨 것이다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘너를 두고/너로 말미암아’라는 전치사 표현과 같은 어근의 명사를 결합하여, 왕들의 공포가 매우 격렬함을 강조합니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘그들 앞에서 내 칼을 날게 할 때’입니다.
    reason: lexical_alternative
  - marker: c
    text: 원문은 직역하면 ‘순간들마다’이며, 반복되는 순간마다 계속되는 두려움을 나타냅니다.
    reason: lexical_alternative
