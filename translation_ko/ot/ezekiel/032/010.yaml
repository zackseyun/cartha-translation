reference: Ezekiel 32:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲשִׁמּוֹתִ֨י עָלֶ֜י/ךָ עַמִּ֣ים רַבִּ֗ים וּ/מַלְכֵי/הֶם֙ יִשְׂעֲר֤וּ עָלֶ֨י/ךָ֙ שַׂ֔עַר בְּ/עוֹפְפִ֥/י חַרְבִּ֖/י עַל פְּנֵי/הֶ֑ם וְ/חָרְד֤וּ לִ/רְגָעִים֙ אִ֣ישׁ לְ/נַפְשׁ֔/וֹ בְּ/י֖וֹם מַפַּלְתֶּֽ/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/010.yaml
  text: I will make many peoples appalled at you[a], and their kings will shudder over you when I brandish my sword before them; and they will tremble every moment, each man for his own life[c][b], on the day of your downfall.
  footnotes:
  - marker: a
    text: Or 'their kings will be horribly afraid because of you'—the Hebrew uses a verb and cognate noun for intense horror.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'when I make my sword fly before them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from moment to moment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너에게 많은 민족들을 놀라게 하며, 그들의 왕들이 너 때문에 떨게 하리니, 내가 내 칼을 그들 앞에서 휘두를 때 그들은 끊임없이 떨며 각자 자기 목숨을 위해 떨 것이다. 그것은 네 몰락의 날이다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘네 위에/너를 향해’라는 전치사와 공포를 뜻하는 동족어를 함께 써서, 단순한 놀람보다 강한 전율과 공포를 드러냅니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘그들 앞에서 내 칼을 날리게/날아가게 할 때’입니다.
    reason: lexical_alternative
  - marker: c
    text: 원문은 ‘순간들마다’의 반복을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמּוֹתִי
  english_pob_choice: I will make ... appalled
  chosen_korean: 놀라게 하며
  alternatives_korean:
  - 황폐하게 하며
  - 황망하게 하며
  - 경악하게 하며
  lexicon: HALOT
  rationale: 히필형의 강한 원인적 의미를 살리면서, 뒤따르는 공포 반응과 자연스럽게 이어지도록 ‘놀라게 하며’로 옮겼습니다.
- source_word: עַמִּים רַבִּים
  english_pob_choice: many peoples
  chosen_korean: 많은 민족들을
  alternatives_korean:
  - 많은 백성들을
  - 많은 나라들을
  lexicon: HALOT
  rationale: עַמִּים는 현대어 ‘민족들’이 집단적 인종·종족 단위를 비교적 잘 반영하므로 이를 택했습니다.
- source_word: יִשְׂעֲרוּ ... שַׂעַר
  english_pob_choice: will shudder with horror
  chosen_korean: 떨게 하리니
  alternatives_korean:
  - 전율하게 하리니
  - 공포에 질리게 하리니
  - 무섭게 떨게 하리니
  lexicon: HALOT
  rationale: 동족어 강조가 있는 격렬한 공포와 몸의 떨림을 한국어 자연문으로 압축해, ‘떨다’의 반복으로 공포의 강도를 살렸습니다.
- source_word: בְּעוֹפְפִי חַרְבִּי
  english_pob_choice: when I brandish my sword
  chosen_korean: 내 칼을 ... 휘두를 때
  alternatives_korean:
  - 내 칼을 ... 날릴 때
  - 내 칼을 ... 흔들 때
  - 내 칼을 ... 휘두르실 때
  lexicon: HALOT
  rationale: 직역의 ‘날다’ 이미지는 한국어에서 어색하므로, 무기 동작의 시각적 긴박함을 보존하는 ‘휘두르다’를 사용했습니다.
- source_word: עַל פְּנֵיהֶם
  english_pob_choice: before them
  chosen_korean: 그들 앞에서
  alternatives_korean:
  - 그들 앞에
  - 그들 면전에서
  lexicon: HALOT
  rationale: 공적 심판 장면의 시각적 배치를 살려 ‘앞에서’로 옮겼습니다.
- source_word: לִרְגָעִים
  english_pob_choice: every moment
  chosen_korean: 끊임없이
  alternatives_korean:
  - 매 순간
  - 순간마다
  - 계속
  lexicon: HALOT
  rationale: ‘순간들마다’의 반복성을 한국어에서는 ‘끊임없이’가 가장 자연스럽게 전달합니다.
- source_word: אִישׁ לְנַפְשׁוֹ
  english_pob_choice: each man for his own life
  chosen_korean: 각자 자기 목숨을 위해
  alternatives_korean:
  - 각 사람이 자기 생명을 위해
  - 각자 자기 영혼을 위해
  - 각 사람은 자기 목숨만을 위해
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 생명/목숨의 의미가 분명하므로 ‘목숨’으로 옮겨, 절박한 생존 본능을 드러냈습니다.
- source_word: בְּיוֹם מַפַּלְתֶּךָ
  english_pob_choice: on the day of your downfall
  chosen_korean: 네 몰락의 날
  alternatives_korean:
  - 네 سقوط의 날
  - 네 넘어짐의 날
  - 네 패망의 날
  lexicon: HALOT
  rationale: מַפָּלָה의 심판적 붕괴를 현대 한국어에서 가장 힘 있게 드러내는 말은 ‘몰락’입니다.
theological_decisions:
- issue: 하나님의 직접적 심판 발화
  chosen_reading: 화자는 하나님이 직접 자신의 칼을 휘두르며 열국을 두렵게 하시는 장면으로 번역했습니다.
  alternative_readings:
  - 바벨론을 통한 간접적 심판으로 완화할 수 있음
  rationale: 1인칭 어미와 ‘내 칼’이 주는 직접성을 유지해야 본문의 신적 경고가 약화되지 않습니다.
  doctrine_reference: divine judgment / prophetic oracle
