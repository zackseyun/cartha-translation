  text: וּ/נְטַשְׁתִּ֣י/ךָ בָ/אָ֔רֶץ עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה אֲטִילֶ֑/ךָ וְ/הִשְׁכַּנְתִּ֤י עָלֶ֨י/ךָ֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וְ/הִשְׂבַּעְתִּ֥י מִמְּ/ךָ֖ חַיַּ֥ת כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/004.yaml
  text: I will cast you onto the land[a]; I will throw you down on the open field, and I will cause every bird of the heavens to settle on you[b], and I will satisfy the beasts of all the earth with you.
  footnotes:
  - marker: a
    text: Or 'I will abandon you on the land.' The Hebrew verb can carry the sense of leaving or casting away.
    reason: lexical_alternative
  - marker: b
    text: Literally 'I will satisfy from you the beasts of all the earth,' that is, the beasts will have their fill by feeding on you.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 땅에 내던져서 빈 들판 위에 던질 것이며, 하늘의 모든 새를 네 위에 머물게 하고, 땅의 모든 짐승이 네 것으로 배불리게 할 것이다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְטַשְׁתִּיךָ
  english_pob_choice: I will cast you onto the land
  chosen_korean: 내가 너를 땅에 내던져서
  alternatives_korean:
  - 내가 너를 땅에 버려서
  - 내가 너를 땅에 내버려서
  - 내가 너를 땅에 던져서
  lexicon: HALOT
  rationale: נטשׁ는 ‘버리다/떠나다/내던지다’의 범위를 가지며, 심판 맥락의 폭력성과 폐기 이미지를 살려 ‘내던지다’로 옮겼습니다.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  english_pob_choice: on the open field
  chosen_korean: 빈 들판 위에
  alternatives_korean:
  - 들판 위에
  - 들판의 겉면 위에
  - 드러난 들판 위에
  lexicon: HALOT
  rationale: 직역의 ‘들판의 פני/얼굴’보다, 노출과 황폐함을 드러내는 ‘빈 들판’이 본문의 이미지에 더 자연스럽고 분명합니다.
- source_word: וְהִשְׁכַּנְתִּי עָלֶיךָ כָּל עוֹף הַשָּׁמַיִם
  english_pob_choice: I will cause every bird of the heavens to settle on you
  chosen_korean: 하늘의 모든 새를 네 위에 머물게 하고
  alternatives_korean:
  - 하늘의 모든 새가 네 위에 깃들게 하고
  - 하늘의 모든 새를 네 위에 앉게 하고
  - 하늘의 모든 새가 네 위에 머물도록 하고
  lexicon: HALOT
  rationale: הִשְׁכִּין은 ‘거하게 하다/머물게 하다’의 사역형이므로, 시체 위에 내려앉는 새들의 모습을 살려 ‘머물게 하다’로 옮겼습니다.
- source_word: וְהִשְׂבַּעְתִּי מִמְּךָ חַיַּת כָּל הָאָרֶץ
  english_pob_choice: I will satisfy the beasts of all the earth with you
  chosen_korean: 땅의 모든 짐승이 네 것으로 배불리게 할 것이다
  alternatives_korean:
  - 땅의 모든 짐승을 너로 배부르게 할 것이다
  - 땅의 모든 짐승이 너로 만족하게 될 것이다
  - 땅의 모든 짐승이 네 몸으로 배불리게 할 것이다
  lexicon: HALOT
  rationale: ‘from you’의 직역보다, 먹이의 원천이 ‘너’임을 드러내는 한국어 표현으로 ‘네 것으로 배불리게’가 문맥상 더 분명합니다.
theological_decisions:
- issue: 심판 예언에서 노출된 시체에 대한 가혹한 이미지 유지
  chosen_reading: 새와 짐승이 시체 위에 모여 먹는 파괴적 장면을 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 보다 완곡하게 ‘머물다/찾다’로만 처리하는 읽기
  - ‘배부르게 하다’의 충격을 약화시키는 읽기
  rationale: 본문은 왕의 몰락을 수치와 완전한 폐기로 그리는 예언이므로, 장면의 잔혹성과 조롱적 강도를 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 예언서의 심판 상징과 신적 판결의 공개성
