id: EZK.32.30
reference: Ezekiel 32:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁ֣מָּ/ה נְסִיכֵ֥י צָפ֛וֹן כֻּלָּ֖/ם וְ/כָל צִֽדֹנִ֑י אֲשֶׁר יָרְד֣וּ אֶת חֲלָלִ֗ים בְּ/חִתִּיתָ֤/ם מִ/גְבֽוּרָתָ/ם֙ בּוֹשִׁ֔ים וַ/יִּשְׁכְּב֤וּ עֲרֵלִים֙ אֶת חַלְלֵי חֶ֔רֶב וַ/יִּשְׂא֥וּ כְלִמָּתָ֖/ם אֶת י֥וֹרְדֵי בֽוֹר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/030.yaml
  text: There are all the princes of the north[a], all of them, and all the Sidonians, who went down with the slain in the terror they caused by their might, ashamed. They lie uncircumcised with those slain by the sword[c][b], and they bear their disgrace with those who go down to the pit.
  footnotes:
  - marker: a
    text: Or 'There they are, all the princes of the north.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their terror from their might,' that is, the terror they inspired because of their military strength.
    reason: lexical_alternative
  - marker: c
    text: '''Uncircumcised'' is retained as a literal covenantal term of shame in Ezekiel''s judgment language.'
    reason: cultural_note
translation:
  language: ko
  text: 거기에는 북쪽의 모든 지배자들, 곧 그들 모두와 모든 시돈 사람들이 있습니다. 그들은 자기 힘에서 나온 그 공포 속에서 살육된 자들과 함께 내려갔으며, 부끄러움을 당했습니다. 그들은 칼에 맞아 죽은 자들과 함께 할례받지 않은 채 누워 있으며, 무덤으로 내려가는 자들과 함께 자기 수치를 지니고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  english_pob_choice: There are
  chosen_korean: 거기에는
  alternatives_korean:
  - 거기
  - 거기 있습니다
  lexicon: HALOT
  rationale: Sheol의 존재를 가리키는 지시부사이므로, 단순한 ‘거기’보다 존재를 드러내는 ‘거기에는’이 한국어에서 자연스럽습니다.
- source_word: נְסִיכֵי צָפוֹן
  english_pob_choice: the princes of the north
  chosen_korean: 북쪽의 모든 지배자들
  alternatives_korean:
  - 북쪽의 모든 군왕들
  - 북쪽의 모든 귀족들
  lexicon: HALOT
  rationale: נְסִיךְ의 권력자·통치자 의미를 살리되, 한국어에서 ‘princes’의 왕족 이미지를 피하기 위해 ‘지배자들’로 옮겼습니다.
- source_word: בְּחִתִּיתָם מִגְבוּרָתָם
  english_pob_choice: in the terror they caused by their might
  chosen_korean: 자기 힘에서 나온 그 공포 속에서
  alternatives_korean:
  - 그들이 일으킨 공포 속에서
  - 그들의 힘으로 인한 공포 속에서
  lexicon: HALOT
  rationale: 공포가 그들의 힘에서 비롯되었다는 관계를 보존하려고 직역적 구조를 유지했습니다.
- source_word: עֲרֵלִים
  english_pob_choice: uncircumcised
  chosen_korean: 할례받지 않은 채
  alternatives_korean:
  - 무할례한 채
  - 할례를 받지 않은 상태로
  lexicon: HALOT
  rationale: 에스겔의 수치와 언약 표지의 어휘를 그대로 보존해야 하므로, 해설적 풀이보다 직접적 표현을 택했습니다.
- source_word: וַיִּשְׂאוּ כְלִמָּתָם
  english_pob_choice: they bear their disgrace
  chosen_korean: 자기 수치를 지니고 있습니다
  alternatives_korean:
  - 자기 수치를 짊어지고 있습니다
  - 자기 수치를 감당하고 있습니다
  lexicon: HALOT
  rationale: נשא + כְלִמָּה의 관용구를 한국어의 ‘지니다/짊어지다’로 살리되, 문맥상 현재적 상태를 보이게 했습니다.
theological_decisions:
- issue: ‘할례받지 않은’의 수치 표지 유지
  chosen_reading: 직역적으로 보존해 언약 밖의 수치와 심판을 드러냄
  alternative_readings:
  - ‘언약 밖에 있는’으로 풀이
  - ‘부정한’으로 완화
  rationale: 에스겔의 심판 화법에서 이 표현은 단순한 신체 정보가 아니라 언약적 수치의 표지이므로, 해석을 덧씌우지 않고 그대로 유지하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
- issue: 종결 시제와 상태 묘사
  chosen_reading: 무덤/스올 목록의 현재 상태를 나타내는 합쇼체 현재형으로 옮김
  alternative_readings:
  - 과거형 ‘누웠습니다’
  - 연속 과거형
  rationale: 히브리어 전개는 과거형이지만, 문맥상 죽은 자들의 현재적 상태를 묘사하므로 한국어에서는 현재형이 더 정확합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
