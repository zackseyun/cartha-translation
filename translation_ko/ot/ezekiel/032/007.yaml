source:
  edition: WLC
  text: וְ/כִסֵּיתִ֤י בְ/כַבּֽוֹתְ/ךָ֙ שָׁמַ֔יִם וְ/הִקְדַּרְתִּ֖י אֶת כֹּֽכְבֵי/הֶ֑ם שֶׁ֚מֶשׁ בֶּ/עָנָ֣ן אֲכַסֶּ֔/נּוּ וְ/יָרֵ֖חַ לֹא יָאִ֥יר אוֹרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/007.yaml
  text: When I extinguish you[a], I will cover the heavens and darken their stars; I will cover the sun with a cloud, and the moon will not give its light.
  footnotes:
  - marker: a
    text: Or, 'when I extinguish you' or 'when you are extinguished.' The Hebrew uses the imagery of being put out like a light.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 소멸시킬 때에 하늘을 덮고 그들의 별들을 어둡게 하며, 구름으로 해를 덮을 것이고 달은 자기 빛을 비추지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘꺼뜨리다/소멸시키다’의 이미지를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְכַבּוֹתְךָ
  english_pob_choice: when I extinguish you
  chosen_korean: 내가 너를 소멸시킬 때에
  alternatives_korean:
  - 내가 너를 끌 때에
  - 내가 너를 꺼뜨릴 때에
  lexicon: HALOT
  rationale: כבה의 ‘꺼지다/소멸되다’ 이미지를 살리면서, 예언적 심판 맥락에서 자연스러운 한국어로는 ‘소멸시키다’가 가장 직접적입니다.
- source_word: שָׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘을
  alternatives_korean:
  - 하늘들을
  - 하늘
  lexicon: HALOT
  rationale: 복수형 어감은 있으나 한국어에서는 이 우주적 심판 문맥에서 ‘하늘’이 가장 자연스럽고, 시적 병행도 유지합니다.
- source_word: וְהִקְדַּרְתִּי
  english_pob_choice: and darken
  chosen_korean: 어둡게 하며
  alternatives_korean:
  - 검게 하며
  - 어둡게 만들며
  lexicon: HALOT
  rationale: קדר의 사역형 의미를 간결하게 살려 ‘어둡게 하다’로 옮겼습니다.
- source_word: לֹא יָאִיר אוֹרֽוֹ
  english_pob_choice: will not give its light
  chosen_korean: 자기 빛을 비추지 못할 것입니다
  alternatives_korean:
  - 빛을 주지 못할 것입니다
  - 그 빛을 비추지 못할 것입니다
  lexicon: HALOT
  rationale: הִפְעִיל형 ‘빛을 내다/비추다’의 능동적 의미를 살려, 달이 스스로 빛을 내지 못한다는 뜻을 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 우주적 어둠의 성격
  chosen_reading: 별과 해와 달의 어둠을 실제 천문 현상인지 상징적 심판 언어인지 확정하지 않고, 본문이 가진 예언적 심판 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 문자 그대로의 우주적 붕괴로 한정
  - 정치적 몰락의 은유로만 한정
  rationale: 히브리어 본문은 전형적인 예언적 심판의 우주적 언어를 사용하므로, 번역이 해석을 과도하게 고정하지 않도록 긴장을 보존해야 합니다.
  doctrine_reference: 예언 문학의 상징성과 문자성을 둘 다 열어 두는 해석 보존
