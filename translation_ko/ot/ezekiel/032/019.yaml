  - 부정한 자들
  rationale: 본문은 일반적 ‘이방인’이나 ‘부정한’ 개념이 아니라 할례 부재라는 구체적 표지를 사용하므로, 그 수치와 언약 경계를 흐리지 않는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
