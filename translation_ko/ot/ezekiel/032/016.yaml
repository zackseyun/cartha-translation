source:
  edition: WLC
  text: קִינָ֥ה הִיא֙ וְ/ק֣וֹנְנ֔וּ/הָ בְּנ֥וֹת הַ/גּוֹיִ֖ם תְּקוֹנֵ֣נָּה אוֹתָ֑/הּ עַל מִצְרַ֤יִם וְ/עַל כָּל הֲמוֹנָ/הּ֙ תְּקוֹנֵ֣נָּה אוֹתָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/016.yaml
  text: This is a lamentation[a], and the daughters of the nations will lament over her. They will lament over Egypt and over all her multitude[b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'This is a dirge'; the Hebrew קִינָה can denote a funeral song or lament.
    reason: lexical_alternative
  - marker: b
    text: Or 'the women of the nations'; literally 'the daughters of the nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 애가입니다[a]. 그리고 민족들의 딸들이 그를 애도할 것입니다. 그들은 이집트와 그 모든 무리[b]를 두고 그를 애도할 것입니다. 주 하나님께서 선언하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘곡(哭)’, 히브리어 קִינָה는 장례 노래나 애가를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘민족들의 여자들’, 직역하면 ‘민족들의 딸들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִינָה
  english_pob_choice: lamentation
  chosen_korean: 애가
  alternatives_korean:
  - 애도
  - 통곡의 노래
  lexicon: HALOT
  rationale: 부음(장례) 노래이자 애도의 노래라는 뜻을 살리면서, 한국어에서 간결하고 문학적인 표준어로 자연스럽습니다.
- source_word: בְּנוֹת הַגּוֹיִם
  english_pob_choice: the daughters of the nations
  chosen_korean: 민족들의 딸들
  alternatives_korean:
  - 민족들의 여자들
  - 나라들의 딸들
  lexicon: HALOT
  rationale: 히브리어의 여성형·비유적 표현을 그대로 살려, ‘여자들’로 평준화하지 않고 원문의 이미지와 평행 구조를 유지했습니다.
- source_word: הֲמוֹנָהּ
  english_pob_choice: all her multitude
  chosen_korean: 그 모든 무리
  alternatives_korean:
  - 그 모든 무리들
  - 그 모든 군중
  - 그 모든 떼
  lexicon: HALOT
  rationale: 에스겔에서 הָמוֹן은 특정 집단의 많은 무리/군중을 가리킬 수 있어, ‘무리’가 가장 포괄적이며 문맥상 과도한 군사적 의미를 덧붙이지 않습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님께서 선언하십니다
  alternatives_korean:
  - 주 하나님이 말씀하십니다
  - 주 야훼께서 선언하십니다
  lexicon: HALOT
  rationale: 예언 선포 공식의 문체를 살려 ‘선언하십니다’로 옮기고, אֲדֹנָי + יְהוִה는 한국어 관용에 맞게 ‘주 하나님’으로 구분 없이 자연스럽게 처리했습니다.
theological_decisions:
- issue: 예언 문맥에서 אָנָה/קִינָה류 애가 표현의 음성 유지
  chosen_reading: ‘애가’와 ‘애도할 것입니다’를 함께 써서 명사형과 동사형의 반복을 살렸습니다.
  alternative_readings:
  - ‘슬픈 노래’로 완화
  - 동사만 반복해 ‘슬퍼할 것입니다’로 처리
  rationale: 본문은 단순한 슬픔이 아니라 장례/애도 성격의 공식적 애가를 말하므로, 그 장르적 강도를 보존하는 편이 본문의 뜻에 더 충실합니다.
  doctrine_reference: N/A
