revisions:
- from: “거기에 엘람이 있고, 그 모든 무리가 있으며, 그들의 무덤 둘레에 모두 죽임을 당하여 칼에 쓰러진 자들이 있고, 그들은 모두 할례받지 않은 채 아래 땅으로 내려갔습니다. 그들은 살아 있는 땅에서 자기들의 두려움을 퍼뜨렸고, 구덩이로 내려가는 자들과 함께 자기들의 수치를 지니게 되었습니다.”[a]
