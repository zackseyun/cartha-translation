  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁ֤ם עֵילָם֙ וְ/כָל הֲמוֹנָ֔/הּ סְבִיב֖וֹת קְבֻרָתָ֑/הּ כֻּלָּ֣/ם חֲלָלִים֩ הַ/נֹּפְלִ֨ים בַּ/חֶ֜רֶב אֲֽשֶׁר יָרְד֥וּ עֲרֵלִ֣ים אֶל אֶ֣רֶץ תַּחְתִּיּ֗וֹת אֲשֶׁ֨ר נָתְנ֤וּ חִתִּיתָ/ם֙ בְּ/אֶ֣רֶץ חַיִּ֔ים וַ/יִּשְׂא֥וּ כְלִמָּתָ֖/ם אֶת י֥וֹרְדֵי בֽוֹר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/024.yaml
  text: There is Elam and all her multitude[a], all around her grave, all of them slain, fallen by the sword, who went down uncircumcised to the land below, who spread their terror in the land of the living; and they bore their shame with those who go down to the pit.
  footnotes:
  - marker: a
    text: Or 'to the lower earth' or 'to the netherworld.' The Hebrew literally speaks of 'the land of lower places,' an image for the realm of the dead.
    reason: lexical_alternative
translation:
  language: ko
  text: “거기에 엘람과 그 모든 무리가 있으며, 그들은 그 무덤 둘레에 있습니다. 그들은 모두 죽임을 당하고 칼에 쓰러진 자들이며, 할례받지 않은 채 아래 땅으로[a] 내려갔습니다. 그들은 산 자들의 땅에서 공포를 떨쳤고, 구덩이로 내려가는 자들과 함께 자기들의 수치를 짊어졌습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아래 땅’은 히브리어의 문자적 이미지로, ‘낮은 곳들의 땅’을 뜻하며 죽은 자들의 영역을 가리킵니다. ‘저승’ 또는 ‘지하 세계’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  english_pob_choice: There is
  chosen_korean: 거기에
  alternatives_korean:
  - 거기 있습니다
  - 거기에는
  lexicon: HALOT
  rationale: 지시 부사로서 음부 장면의 위치감을 살리되, 한국어에서는 자연스럽게 “거기에”로 시작하는 것이 가장 직역적이면서도 읽기 좋습니다.
- source_word: עֵילָם
  english_pob_choice: Elam
  chosen_korean: 엘람
  alternatives_korean:
  - 에람
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했습니다.
- source_word: וְכָל הֲמוֹנָהּ
  english_pob_choice: and all her multitude
  chosen_korean: 그 모든 무리
  alternatives_korean:
  - 그 모든 군중
  - 그 모든 떼
  lexicon: HALOT
  rationale: הָמוֹן은 단순한 군중보다 집합적 무리를 가리키므로, 여성 인칭 대명사와 함께 “그 모든 무리”로 옮겨 집단성만 간결하게 드러냈습니다.
- source_word: אֶל אֶרֶץ תַּחְתִּיּוֹת
  english_pob_choice: to the land below
  chosen_korean: 아래 땅으로
  alternatives_korean:
  - 아래의 땅으로
  - 저승으로
  - 지하 세계로
  lexicon: HALOT
  rationale: 영어 POB가 유지한 공간적 이미지를 따라 “아래 땅”으로 옮겨, 사후 세계를 지나치게 체계화하지 않으면서도 하강 이미지를 보존했습니다.
- source_word: יָרְדוּ עֲרֵלִים
  english_pob_choice: went down uncircumcised
  chosen_korean: 할례받지 않은 채 내려갔습니다
  alternatives_korean:
  - 무할례자로 내려갔습니다
  - 할례받지 않은 자로 내려갔습니다
  lexicon: HALOT
  rationale: עֲרֵלִים의 언약적·수치적 뉘앙스를 살리기 위해 “할례받지 않은”을 유지했고, 한국어에서는 상태 부사구로 처리해 문장을 자연스럽게 했습니다.
- source_word: כְלִמָּתָם
  english_pob_choice: their shame
  chosen_korean: 자기들의 수치
  alternatives_korean:
  - 그들의 치욕
  - 그들의 수치심
  lexicon: HALOT
  rationale: כְלִמָּה는 내면 감정보다 공개적 굴욕의 색채가 강하므로 “수치”가 가장 직접적입니다.
theological_decisions:
- issue: ‘uncircumcised’의 번역을 완화할지 여부
  chosen_reading: 할례받지 않은 채
  alternative_readings:
  - 무할례자로
  - 부정한 자로
  rationale: 본문은 민족들의 죽음과 수치를 언약 표지와 연결하므로, 이를 도덕적 일반어로 완화하지 않고 표지 자체를 보존해야 합니다.
  doctrine_reference: 언약 표지와 심판 수사의 긴장을 보존합니다.
- issue: אֶרֶץ תַּחְתִּיּוֹת의 사후 세계 표현 범위
  chosen_reading: 아래 땅
  alternative_readings:
  - 저승
  - 지하 세계
  - 음부
  rationale: 본문은 죽은 자들의 영역을 가리키지만 사후 세계 교리를 체계화하지 않으므로, 해석을 덜 가하는 공간적 표현을 선택했습니다.
  doctrine_reference: 본문이 말하는 범위를 넘어선 종말론적 체계를 덧붙이지 않습니다.
