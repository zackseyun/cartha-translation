  rationale: 원문의 공간적 배치(엘람과 그 무리가 그 무덤 둘레에 있음)를 두 문장으로 분명히 하고, ‘칼에 쓰러진 자들’과 ‘할례받지 않은 채 아래 땅으로 내려간 자들’이라는 연속 수식을 유지했습니다. 또한 ‘산 자들의 땅’과 ‘공포를 떨쳤습니다’를 사용해 관용과 현대적 자연스러움을 함께 살렸으며, 각주를 해당 어구에 직접 연결했습니다.
