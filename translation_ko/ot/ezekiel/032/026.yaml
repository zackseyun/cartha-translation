source:
  edition: WLC
  text: שָׁ֣ם מֶ֤שֶׁךְ תֻּבַל֙ וְ/כָל הֲמוֹנָ֔/הּ סְבִֽיבוֹתָ֖י/ו קִבְרוֹתֶ֑י/הָ כֻּלָּ֤/ם עֲרֵלִים֙ מְחֻ֣לְלֵי חֶ֔רֶב כִּֽי נָתְנ֥וּ חִתִּיתָ֖/ם בְּ/אֶ֥רֶץ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/026.yaml
  text: There are Meshech and Tubal[a], and all her multitude; their graves are all around him. All of them are uncircumcised, slain by the sword, because they spread their terror in the land of the living.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and all her multitude; around him are her graves,' with shifting singular and feminine suffixes in the poetic line.
    reason: lexical_alternative
translation:
  language: ko
  text: 거기에 메섹과 두발[a], 그리고 그의 모든 무리가 있습니다. 그의 둘레에는 그들의 무덤들이 있습니다. 그들 모두는 할례받지 않은 자들, 곧 칼에 죽임을 당한 자들입니다. 이는 그들이 살아 있는 땅에서 공포를 퍼뜨렸기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “그리고 그의 모든 무리; 그의 둘레에는 그녀의 무덤들이”에 가깝습니다. 이 압축된 시구에서는 단수와 복수뿐 아니라 남성형과 여성형 소유 접미사도 전환됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  english_pob_choice: There are
  chosen_korean: 거기에 있습니다
  alternatives_korean:
  - 거기에
  - 거기 있습니다
  lexicon: HALOT
  rationale: 무덤과 지하 세계를 가리키는 지시 표현으로 보아, 한국어에서는 자연스럽게 존재 구문을 보태어 ‘거기에 있습니다’로 옮기는 것이 문맥을 살립니다.
- source_word: מֶשֶׁךְ תֻּבַל
  english_pob_choice: Meshech and Tubal
  chosen_korean: 메섹과 두발
  alternatives_korean:
  - 메섹과 두발족
  - 메셱과 두발
  lexicon: HALOT
  rationale: 고유명사이므로 음역을 유지했습니다. 한국어 성경에서 널리 쓰이는 형태인 ‘메섹’과 ‘두발’을 택해 식별 가능성을 높였습니다.
- source_word: עֲרֵלִים
  english_pob_choice: uncircumcised
  chosen_korean: 할례받지 않은 자들
  alternatives_korean:
  - 무할례자들
  - 할례받지 않은 사람들
  lexicon: HALOT
  rationale: 에스겔의 반복되는 언약적 수치 표현을 그대로 살리기 위해 직역했습니다. ‘무할례자들’보다 현대 한국어에서 더 분명하고 읽기 쉽습니다.
- source_word: מְחֻלְלֵי חֶרֶב
  english_pob_choice: slain by the sword
  chosen_korean: 칼에 맞아 죽었으니
  alternatives_korean:
  - 칼에 죽임을 당했으니
  - 칼에 찔려 죽었으니
  lexicon: HALOT
  rationale: 전쟁에서 치명상을 입어 죽은 결과를 한국어로 자연스럽게 드러내되, 원문의 피동적 상태를 유지했습니다.
- source_word: נָתְנוּ חִתִּיתָם
  english_pob_choice: they spread their terror
  chosen_korean: 그들이 두려움을 퍼뜨렸기 때문입니다
  alternatives_korean:
  - 그들이 공포를 퍼뜨렸기 때문입니다
  - 그들이 두려움을 주었기 때문입니다
  lexicon: HALOT
  rationale: ‘주다/두다’의 관용적 의미를 현대 한국어의 ‘퍼뜨리다’로 옮겨, 그들이 살아 있는 땅에 공포를 확산시킨 적극성을 보존했습니다.
theological_decisions:
- issue: 언약 표지의 수치 표현 보존
  chosen_reading: ‘할례받지 않은 자들’로 직역해 수치와 배제의 의미를 드러냅니다.
  alternative_readings:
  - ‘부정한 자들’로 완화
  - ‘무할례자들’로 축약
  rationale: 에스겔서의 반복되는 죽음-수치 어휘는 단순한 신체 묘사가 아니라 언약적 조롱과 심판을 포함하므로, 이를 완화하지 않고 유지하는 것이 본문의 신학적 힘을 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 시적 대명사 혼합의 처리
  chosen_reading: ‘그들의 무덤이 그 둘레에 있습니다’로 정리하되, 주요 화자는 복수로 살립니다.
  alternative_readings:
  - ‘그의 무덤이 그 둘레에 있습니다’로 문자적으로 유지
  - ‘그녀의 무덤이 그 둘레에 있습니다’로 문자적으로 유지
  rationale: 히브리어는 성과 수가 흔들리는 압축된 시구이므로, 한국어에서는 의미를 분명하게 하되 핵심 이미지인 ‘둘레에 있는 무덤들’을 보존하는 방식이 가장 균형적입니다.
  doctrine_reference: optimal-equivalence
