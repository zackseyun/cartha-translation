  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/חַרְב֤וֹת גִּבּוֹרִים֙ אַפִּ֣יל הֲמוֹנֶ֔/ךָ עָרִיצֵ֥י גוֹיִ֖ם כֻּלָּ֑/ם וְ/שָֽׁדְדוּ֙ אֶת גְּא֣וֹן מִצְרַ֔יִם וְ/נִשְׁמַ֖ד כָּל הֲמוֹנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/012.yaml
  text: By the swords of mighty men I will make your multitude fall— all of them the ruthless ones of the nations[a]. They will plunder the pride of Egypt[b], and all her multitude will be destroyed.
  footnotes:
  - marker: a
    text: Or 'the tyrants of the nations' for 'the ruthless ones of the nations.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the majesty of Egypt'; the Hebrew can denote both pride and grandeur.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 용사의 칼로 네 무리를 쓰러뜨리겠으니—모두 열국의 잔혹한 자들입니다. 그들이 이집트의 교만을 약탈할 것이며, 그 모든 무리가 멸망할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잔혹한 자들’은 ‘폭군들’로도 옮길 수 있으나, 히브리어의 성격 묘사를 더 넓게 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이집트의 교만’은 ‘이집트의 위엄/장엄함’으로도 이해될 수 있으나, 이 심판 문맥에서는 교만의 의미가 앞섭니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַרְבוֹת גִּבּוֹרִים
  english_pob_choice: By the swords of mighty men
  chosen_korean: 용사의 칼로
  alternatives_korean:
  - 강한 자들의 칼로
  - 용맹한 자들의 칼로
  lexicon: HALOT
  rationale: בְּ는 수단을 나타내며, גִּבּוֹרִים는 전투적 맥락에서 ‘용사’가 자연스럽고 힘 있는 대응입니다.
- source_word: הֲמוֹנֶךָ
  english_pob_choice: your multitude
  chosen_korean: 네 무리
  alternatives_korean:
  - 네 군중
  - 네 큰 무리
  lexicon: HALOT
  rationale: הָמוֹן은 단순 인원수보다 ‘무리/떼’의 집합적 뉘앙스를 가지므로, 심판 문맥에 맞게 간결한 ‘무리’로 옮겼습니다.
- source_word: עָרִיצֵי גוֹיִם כֻּלָּם
  english_pob_choice: all of them the ruthless ones of the nations
  chosen_korean: 모두 열국의 잔혹한 자들입니다
  alternatives_korean:
  - 모두 민족들의 포악한 자들입니다
  - 모두 나라들의 폭군들입니다
  lexicon: HALOT
  rationale: עָרִיץ는 ‘잔혹한/포악한’의 의미가 핵심이어서, 통치직을 덧붙이는 ‘폭군’보다 원뜻을 덜 좁히는 표현을 택했습니다.
- source_word: גְּאוֹן מִצְרַיִם
  english_pob_choice: the pride of Egypt
  chosen_korean: 이집트의 교만
  alternatives_korean:
  - 이집트의 위엄
  - 이집트의 자랑
  lexicon: HALOT
  rationale: גָּאוֹן은 ‘교만’과 ‘위엄/장엄’ 사이의 폭이 있지만, 여기서는 심판 예언의 맥락상 멸망당할 대상인 자만을 드러내는 ‘교만’이 가장 적절합니다.
- source_word: וְנִשְׁמַד כָּל הֲמוֹנָהּ
  english_pob_choice: all her multitude will be destroyed
  chosen_korean: 그 모든 무리가 멸망할 것입니다
  alternatives_korean:
  - 그 모든 무리가 파멸할 것입니다
  - 그 모든 무리가 소멸할 것입니다
  lexicon: HALOT
  rationale: נִשְׁמַד는 강한 파괴·멸절의 뜻이 있으나, 한국어에서는 예언적 심판의 엄중함을 유지하면서도 자연스러운 ‘멸망하다’가 적절합니다.
theological_decisions:
- issue: גְּאוֹן의 이중 의미(교만/위엄)
  chosen_reading: ‘교만’으로 번역하되, 예언적 수치와 몰락을 강조했습니다.
  alternative_readings:
  - ‘위엄’으로 번역하여 국가적 장엄함을 살리는 읽기
  - ‘자랑’으로 번역하여 스스로 내세우는 요소를 강조하는 읽기
  rationale: 이 단락은 애가와 심판의 문맥이므로, 이집트의 ‘드러내는 영광’보다 하나님 앞에서 꺾일 ‘교만’의 의미가 더 강하게 드러납니다.
  doctrine_reference: 예언서의 심판 신학
- issue: ‘열국의 잔혹한 자들’의 범위
  chosen_reading: 민족적·국가적 폭력성을 지닌 전쟁 행위자들을 가리키는 일반적 표현으로 유지했습니다.
  alternative_readings:
  - 특정 정치 통치자에 대한 지칭으로 좁히는 읽기
  - 단순한 전사 집단으로만 보는 읽기
  rationale: 히브리어는 직함보다 성격을 묘사하므로, 한국어도 범위를 넓게 유지해 본문이 말하는 폭력성과 잔혹성을 보존했습니다.
  doctrine_reference: 본문의 수사적 병행과 심판 오라클
