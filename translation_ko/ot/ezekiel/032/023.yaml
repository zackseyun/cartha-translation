  source_fidelity: 히브리어의 수동 배치, ‘구덩이’의 깊숙한 곳, 무덤 주위의 집단, 칼에 죽임당함, 그리고 산 자들의 땅에서 공포를 일으킨다는 핵심 의미는 대체로 반영되었습니다. 다만 여성 단수 접미사의 인격화가 한국어 ‘그의’로는 드러나지 않고, קָהָל에 대한 ‘회중’은 종교 집단의 의미를 불필요하게 불러옵니다. 또한 ‘살육된 자’는 현대 한국어에서 다소 부자연스럽습니다.
  naturalness: ‘그의 무덤들’과 ‘그의 무덤’의 반복 및 ‘살육된 자요’라는 연결은 현대 합쇼체 성경 문장으로 매끄럽지 않습니다. ‘그녀의 무리’, ‘죽임을 당한 자들’, ‘산 자들의 땅’이 자연스럽고 원문의 집단적·시적 표현을 유지합니다.
  terminology: בוֹר는 ‘구덩이’로 유지하는 것이 적절합니다. קָהָל은 이 문맥에서 교회적 함의가 강한 ‘회중’보다 중립적인 ‘무리’가 적절합니다. בְּאֶרֶץ חַיִּים은 관용적 대조를 드러내는 ‘산 자들의 땅’으로 옮깁니다.
