source:
  edition: WLC
  text: אֲשֶׁ֨ר נִתְּנ֤וּ קִבְרֹתֶ֨י/הָ֙ בְּ/יַרְכְּתֵי ב֔וֹר וַ/יְהִ֣י קְהָלָ֔/הּ סְבִיב֖וֹת קְבֻרָתָ֑/הּ כֻּלָּ֤/ם חֲלָלִים֙ נֹפְלִ֣ים בַּ/חֶ֔רֶב אֲשֶׁר נָתְנ֥וּ חִתִּ֖ית בְּ/אֶ֥רֶץ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/023.yaml
  text: whose graves were set in the remotest parts of the pit[a], and her assembly was around her grave—all of them slain, fallen by the sword[b], who spread terror in the land of the living.
  footnotes:
  - marker: a
    text: Or 'in the recesses of the pit.'
    reason: lexical_alternative
  - marker: b
    text: Or 'caused terror in the land of the living.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 무덤들은 구덩이의 가장 깊은 곳에 놓였고[a], 그의 회중은 그의 무덤 둘레에 있었으니, 그들 모두가 살육된 자요, 칼에 쓰러진 자이며[b], 살아 있는 땅에서 두려움을 퍼뜨린 자들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구덩이의 움푹한 곳에’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘살아 있는 땅에서 두려움을 일으킨 자들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִתְּנוּ קִבְרֹתֶיהָ
  english_pob_choice: whose graves were set
  chosen_korean: 그의 무덤들은 ... 놓였고
  alternatives_korean:
  - 그의 무덤들은 ... 세워졌고
  - 그의 무덤들은 ... 주어졌고
  lexicon: HALOT
  rationale: נתן의 수동형은 무덤이 ‘배치되다/놓이다’는 뜻으로 읽는 것이 자연스럽고, 무덤과 결합할 때 ‘주어졌다’는 한국어로 부자연스럽습니다.
- source_word: בְּיַרְכְּתֵי בוֹר
  english_pob_choice: in the remotest parts of the pit
  chosen_korean: 구덩이의 가장 깊은 곳에
  alternatives_korean:
  - 구덩이의 가장 먼 곳에
  - 구덩이의 깊은 움푹한 곳에
  lexicon: HALOT
  rationale: יַרְכְּתֵי의 ‘가장 먼/깊숙한 곳’ 뉘앙스를 살려, בוֹר의 표준적 대응인 ‘구덩이’와 함께 지형적 깊이를 자연스럽게 드러냈습니다.
- source_word: קְהָלָהּ
  english_pob_choice: her assembly
  chosen_korean: 그의 회중
  alternatives_korean:
  - 그의 모임
  - 그의 무리
  lexicon: HALOT
  rationale: קהל은 ‘모인 집단’이지만, 여기서는 무덤 둘레를 에워싼 집합체를 가리키므로 ‘회중’이 집합성은 살리되 과도한 종교적 의미를 덜어 줍니다.
- source_word: חֲלָלִים נֹפְלִים בַּחֶרֶב
  english_pob_choice: all of them slain, fallen by the sword
  chosen_korean: 그들 모두가 살육된 자요, 칼에 쓰러진 자이며
  alternatives_korean:
  - 그들 모두가 죽임당한 자요, 칼에 쓰러진 자이며
  - 그들 모두가 전사한 자요, 칼에 쓰러진 자이며
  lexicon: HALOT
  rationale: חֲלָלִים은 단순한 죽음보다 전투적 살육을 가리키므로 ‘살육된 자’로, נֹפְלִים בַּחֶרֶב은 목록형 설명을 살려 ‘칼에 쓰러진 자’로 옮겼습니다.
- source_word: נָתְנ֥וּ חִתִּית
  english_pob_choice: who spread terror
  chosen_korean: 두려움을 퍼뜨린 자들입니다
  alternatives_korean:
  - 공포를 퍼뜨린 자들입니다
  - 두려움을 일으킨 자들입니다
  lexicon: HALOT
  rationale: נתן + חִתִּית의 관용적 의미를 한국어에서 자연스럽게 재현하되, 결과적 공포의 확산을 보여 주는 ‘퍼뜨린’으로 옮겼습니다.
theological_decisions:
- issue: 여성 단수 접미사의 인칭화
  chosen_reading: 히브리어의 여성형 소유 접미사를 한국어에서 모두 ‘그의’로 옮겼습니다.
  alternative_readings:
  - ‘그것의’로 중립화
  - ‘그 나라의’로 풀어 쓰기
  rationale: 예언서의 나라 인격화와 조롱조의 문체를 살리기 위해, 문법적 여성형이 드러내는 인칭화를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: בוֹר의 의미 범위
  chosen_reading: בוֹר를 ‘구덩이’로 옮겼습니다.
  alternative_readings:
  - ‘스올’로 해석
  - ‘무덤’으로 해석
  rationale: 본문은 שְׁאוֹל이 아니라 בוֹר를 사용하므로, 더 특정한 지시를 덧씌우지 않고 이미지 자체를 보존하는 것이 원문에 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
