  to: 그녀의 무덤들은 구덩이의 가장 깊숙한 곳에 놓였고[a], 그녀의 무리는 그녀의 무덤 둘레에 있었습니다. 그들은 모두 죽임을 당한 자들, 칼에 쓰러진 자들이며[b], 산 자들의 땅에서 공포를 일으킨 자들입니다.
  rationale: 여성형 인격화와 집단 명사를 보존하면서, 종교적으로 특수화될 수 있는 ‘회중’을 ‘무리’로 고쳤습니다. 또한 현대 표준 한국어 합쇼체에 맞게 문장을 정리하고, 죽임과 산 자들의 땅이라는 원문의 대조를 자연스럽게 드러냈습니다. ‘구덩이’는 בוֹר의 이미지를 보존하며, 본문이 특정한 사후 세계 용어를 사용한다고 해석하지 않습니다.
