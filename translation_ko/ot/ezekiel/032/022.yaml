translation:
  language: ko
  text: 거기에는 앗수르와 그 온 회중이 있습니다[a]. 그의 무덤들이 그의 주위에 있으며, 그들 모두는 칼에 쓰러져 죽은 자들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 ‘앗수르’에 딸린 ‘그 온 회중’의 접미사는 여성 단수인 반면, 이어지는 ‘그의 무덤들’과 ‘그의 주위에’의 접미사는 남성 단수입니다. 한국어는 문법 성을 나타내지 않지만, 번역은 뒤의 단수 지시를 ‘그의’로 유지합니다.
    reason: lexical_alternative
