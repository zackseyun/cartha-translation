  - 그곳에
  lexicon: HALOT
  rationale: 저승 장면으로 들어가는 지시 부사로서 위치를 분명히 하되, 한국어에서는 자연스럽게 ‘거기에는’으로 옮겨 현장성을 살렸습니다.
