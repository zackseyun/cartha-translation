- source_word: וְכָל־קְהָלָהּ
  english_pob_choice: and all her assembly
  chosen_korean: 그 온 회중
  alternatives_korean:
  - 그 모든 집회
  - 그 모든 무리
  lexicon: HALOT
  rationale: קהל은 모여 있는 집합체를 뜻하므로 ‘회중’이 집합적 의미를 살리며, ‘온’으로 전체성을 보완했습니다.
- source_word: סְבִיבוֹתָיו / קִבְרֹתָיו
  english_pob_choice: all around him / his graves
  chosen_korean: 그들의 무덤이 사방에
  alternatives_korean:
  - 그의 무덤이 사방에
  - 그의 묘소가 둘러
  lexicon: HALOT
  rationale: 히브리어의 남성 3인칭 접미사와 주변 배치를 함께 반영하기 위해 단수 성별을 매끈하게 지우지 않고, 한국어에서는 복수 소유·분포를 자연스럽게 압축해 표현했습니다.
- source_word: חֲלָלִים הַנֹּפְלִים בֶּחָרֶב
  english_pob_choice: all of them are slain, fallen by the sword
  chosen_korean: 칼에 죽어 쓰러진 자들입니다
  alternatives_korean:
  - 칼에 죽고 쓰러진 자들입니다
  - 칼에 살육당해 쓰러진 자들입니다
  lexicon: HALOT
  rationale: חֲלָלִים은 전투에서 죽임을 당한 자들을 가리키므로 ‘죽어 쓰러진 자들’로 옮겨, ‘칼에’라는 전쟁 관용구를 유지했습니다.
theological_decisions:
- issue: 히브리어의 성별·인칭 전환 보존
  chosen_reading: 한국어 본문은 ‘앗수르’의 여성화된 집합 표지와 뒤따르는 소유·지시 표현의 긴장을 완전히 평준화하지 않고, 자연스러운 한국어 안에서 최대한 중립적으로 남겼습니다.
  alternative_readings:
  - 그 온 회중이 사방에 둘린 그의 무덤들
  - 그 온 회중이 사방에 둘린 그녀의 무덤들
  rationale: 본문은 앗수르를 여성으로 의인화하면서도 뒤에서는 남성형 접미사를 사용하여 문학적 긴장을 드러냅니다. 한국어는 성별 접사가 제한적이므로, 의미를 왜곡하지 않는 범위에서 그 긴장을 과도하게 해소하지 않도록 했습니다.
  doctrine_reference: 성서 본문 주해의 문법적 의인화 보존
