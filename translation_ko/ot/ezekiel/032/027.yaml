id: EZK.32.27
reference: Ezekiel 32:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֤א יִשְׁכְּבוּ֙ אֶת גִּבּוֹרִ֔ים נֹפְלִ֖ים מֵ/עֲרֵלִ֑ים אֲשֶׁ֣ר יָרְדֽוּ שְׁא֣וֹל בִּ/כְלֵֽי מִלְחַמְתָּ/ם֩ וַ/יִּתְּנ֨וּ אֶת חַרְבוֹתָ֜/ם תַּ֣חַת רָאשֵׁי/הֶ֗ם וַ/תְּהִ֤י עֲוֺֽנֹתָ/ם֙ עַל עַצְמוֹתָ֔/ם כִּֽי חִתִּ֥ית גִּבּוֹרִ֖ים בְּ/אֶ֥רֶץ חַיִּֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/027.yaml
  text: And they do not lie with the mighty, the fallen from among the uncircumcised[a], who went down to Sheol with their weapons of war, whose swords were placed under their heads, and whose iniquities were upon their bones[e][d][c][b]; for the terror of the mighty was in the land of the living.
  footnotes:
  - marker: a
    text: Or 'And they shall not lie with the mighty'—the Hebrew verb may be understood with a future nuance in this lament.
    reason: lexical_alternative
  - marker: b
    text: Or 'with the fallen mighty from among the uncircumcised.' The Hebrew construction is difficult, and some take 'mighty' and 'fallen' more closely together.
    reason: alternative_reading
  - marker: c
    text: Sheol is the realm of the dead; alternatively, 'the grave' or 'the underworld.'
    reason: lexical_alternative
  - marker: d
    text: '''Iniquities'' may also be understood as ''guilt'' or ''the punishment for their iniquity.'''
    reason: lexical_alternative
  - marker: e
    text: The Hebrew of the final clause is difficult; alternatively, 'for they spread terror as mighty men in the land of the living.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은, 할례받지 않은 자들 가운데서 쓰러진 용사들과 함께 눕지 못합니다. 그들은 무기를 지닌 채 스올로 내려갔고, 자기 칼을 머리 아래에 두었으며, 자기들의 죄악이 그 뼈들 위에 있었습니다. 이는 살아 있는 땅에서 용사들의 공포가 되었기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘함께 눕지 못합니다’는 히브리어 문맥상 매장/안식의 의미를 살린 번역입니다.
    reason: source_note
  - marker: b
    text: ‘스올’은 죽은 자들의 영역을 가리키는 히브리어 용어입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘죄악’은 여기서 죄, 죄책, 혹은 죄에 대한 형벌을 아울러 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יִשְׁכְּבוּ
  english_pob_choice: And they do not lie
  chosen_korean: 그들은 … 눕지 못합니다
  alternatives_korean:
  - 그들은 … 눕지 않습니다
  - 그들은 … 함께 눕지 못합니다
  lexicon: HALOT
  rationale: 장례적 문맥의 שׁכב는 단순한 ‘잠자다’가 아니라 ‘눕다/매장되다’의 이미지를 살리므로, 한국어에서는 ‘눕지 못합니다’로 옮겨 burial 이미지를 유지했습니다.
- source_word: אֶת גִּבּוֹרִים
  english_pob_choice: with the mighty
  chosen_korean: 용사들과 함께
  alternatives_korean:
  - 강한 자들과 함께
  - 용사들 곁에
  lexicon: HALOT
  rationale: אֶת가 여기서는 단순 목적격이 아니라 동반/연합의 뉘앙스로 쓰인 난해한 구문이므로, ‘~와 함께’로 풀어 죽은 자들이 그들과 같은 매장 지위를 누리지 못함을 드러냈습니다.
- source_word: מֵעֲרֵלִים
  english_pob_choice: from among the uncircumcised
  chosen_korean: 할례받지 않은 자들 가운데서
  alternatives_korean:
  - 할례받지 않은 자들 중에서
  - 무할례자들 가운데서
  lexicon: HALOT
  rationale: ‘uncircumcised’를 직역해 이 장 전체의 신학적으로 표지된 범주를 흐리지 않도록 했습니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 저승
  lexicon: HALOT
  rationale: 셰올은 단순한 무덤이나 일반적 저승으로 평탄화하지 않고 음역해, 죽은 자들의 영역이라는 히브리어 개념을 보존했습니다.
- source_word: בִּכְלֵי מִלְחַמְתָּם
  english_pob_choice: with their weapons of war
  chosen_korean: 무기를 지닌 채
  alternatives_korean:
  - 전쟁 무기를 지닌 채
  - 전투 장비를 지닌 채
  lexicon: HALOT
  rationale: כְלֵי מִלְחָמָה는 전쟁에 쓰이는 장비 전반을 가리키므로, 장례 상상력을 살리면서도 자연스러운 한국어인 ‘무기를 지닌 채’로 옮겼습니다.
- source_word: וַיִּתְּנוּ אֶת חַרְבוֹתָם תַּחַת רָאשֵׁיהֶם
  english_pob_choice: whose swords were placed under their heads
  chosen_korean: 자기 칼을 머리 아래에 두었으며
  alternatives_korean:
  - 자기 칼이 머리 아래에 놓였으며
  - 자기 칼을 머리 아래에 놓았으며
  lexicon: HALOT
  rationale: 히브리어의 wayyiqtol 서술을 반영해 능동형으로 처리했으며, 장례 풍습의 구체적 이미지를 살리기 위해 ‘머리 아래에 두었다’고 옮겼습니다.
- source_word: וַתְּהִי עֲוֺנֹתָם עַל עַצְמוֹתָם
  english_pob_choice: and whose iniquities were upon their bones
  chosen_korean: 자기들의 죄악이 그 뼈들 위에 있었습니다
  alternatives_korean:
  - 그들의 죄악이 그 뼈 위에 있었습니다
  - 그들의 죄책이 그 뼈들 위에 있었습니다
  lexicon: HALOT
  rationale: עָוֹן의 가능한 의미인 죄악/죄책/형벌 가운데, 본문이 의도하는 압축성과 음울한 힘을 살리기 위해 ‘죄악’으로 두어 의미를 과도하게 해석하지 않았습니다.
- source_word: כִּי חִתִּית גִּבּוֹרִים בְּאֶרֶץ חַיִּים
  english_pob_choice: for the terror of the mighty was in the land of the living
  chosen_korean: 이는 살아 있는 땅에서 용사들의 공포가 되었기 때문입니다
  alternatives_korean:
  - 이는 살아 있는 땅에서 용사들의 두려움이었기 때문입니다
  - 이는 살아 있는 땅에서 용사들에게 공포를 주었기 때문입니다
  lexicon: HALOT
  rationale: חִתִּית는 ‘공포/두려움’을 뜻하며 문장이 생략적이므로, ‘공포가 되었다’로 옮겨 이들이 생전에는 다른 용사들에게 두려움의 대상이었음을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: עָוֹן의 의미 범위 보존
  chosen_reading: ‘죄악’으로 옮기되, 죄 그 자체인지 죄책인지 형벌인지 하나로 좁히지 않았습니다.
  alternative_readings:
  - 죄책
  - 그들의 죄에 대한 형벌
  rationale: 본문은 עָוֹן의 의미 범위를 압축적으로 담고 있으므로, 한국어도 해석을 단일화하지 않고 긴장을 유지하는 편이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
