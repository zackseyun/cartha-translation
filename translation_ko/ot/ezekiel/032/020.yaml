revisions:
- from: 그들은 칼에 죽임을 당한 자들 가운데에 떨어질 것입니다. 칼이 주어졌습니다. 그를 끌어내리십시오 — 그와 그의 모든 무리를.[a][b]
  to: 그들은 칼에 죽임을 당한 자들 가운데 쓰러질 것입니다. 칼이 주어졌습니다[a]. 그녀와 그녀의 모든 무리를 끌어가십시오[b].
  rationale: 여성형 의인화와 대명사 일치를 회복하고, 원문에 명시되지 않은 ‘아래로’의 방향성을 제거했습니다. ‘칼이 주어졌습니다’라는 압축된 수동문의 애매함은 유지하되, 부정확한 각주 대안을 바로잡고 각주 표지를 해당 구절에 직접 배치했습니다.
