id: EZK.32.20
reference: Ezekiel 32:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/ת֥וֹךְ חַלְלֵי חֶ֖רֶב יִפֹּ֑לוּ חֶ֣רֶב נִתָּ֔נָה מָשְׁכ֥וּ אוֹתָ֖/הּ וְ/כָל הֲמוֹנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/020.yaml
  text: They will fall among those slain by the sword[a]. The sword is given; drag her away[b], and all her multitude.
  footnotes:
  - marker: a
    text: Or, 'A sword is appointed'; the Hebrew clause is terse and may express that the sword has been assigned for judgment.
    reason: alternative_reading
  - marker: b
    text: That is, Egypt personified, together with all her people.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 칼에 죽임을 당한 자들 가운데 쓰러질 것입니다. 칼이 주어졌습니다[a]. 그녀와 그녀의 모든 무리를 끌어가십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 압축된 수동 표현입니다. 문맥상 ‘칼이 정해졌습니다’ 또는 ‘칼이 지정되었습니다’로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그녀’와 ‘그녀의’는 애굽을 여성으로 의인화하여 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ חַלְלֵי חֶרֶב
  english_pob_choice: among those slain by the sword
  chosen_korean: 칼에 죽임을 당한 자들 가운데에
  alternatives_korean:
  - 칼에 죽임을 당한 자들 한가운데에
  - 칼에 죽은 자들 사이에
  lexicon: HALOT
  rationale: בְּתוֹךְ는 ‘가운데에/한가운데에’의 뜻이지만, 문맥상 무리 속에 포함됨을 자연스럽게 보이는 ‘가운데에’로 옮겼습니다.
- source_word: יִפֹּלוּ
  english_pob_choice: will fall
  chosen_korean: 떨어질 것입니다
  alternatives_korean:
  - 무너질 것입니다
  - 쓰러질 것입니다
  lexicon: HALOT
  rationale: 예언적 미래형을 살리되, 심판·사망 맥락에서 단순한 신체적 ‘떨어짐’보다 운명적 몰락을 드러내는 표현으로 옮겼습니다.
- source_word: חֶרֶב נִתָּנָה
  english_pob_choice: The sword is given
  chosen_korean: 칼이 주어졌습니다
  alternatives_korean:
  - 칼이 지정되었습니다
  - 칼이 맡겨졌습니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 수동문을 풀지 않고 직접적으로 옮겨, 심판 선언의 단문성과 긴장을 유지했습니다.
- source_word: מָשְׁכוּ אוֹתָהּ
  english_pob_choice: drag her away
  chosen_korean: 그를 끌어내리십시오
  alternatives_korean:
  - 그녀를 끌어가십시오
  - 그녀를 끌어내십시오
  lexicon: HALOT
  rationale: 문맥의 나라/도시 의인화를 반영해 인칭 대명사를 살렸습니다. 다만 한국어에서는 지시 대상이 분명하도록 ‘끌어내리다’를 택해 죽음의 깊은 곳으로 내려가는 뉘앙스를 드러냈습니다.
- source_word: וְכָל הֲמוֹנֶיהָ
  english_pob_choice: and all her multitude
  chosen_korean: 그와 그의 모든 무리를
  alternatives_korean:
  - 그리고 그의 모든 무리를
  - 또 그의 모든 무리를
  lexicon: HALOT
  rationale: וְ는 단순 접속이므로 ‘그리고/—’보다 문맥상 매끄러운 병렬 연결로 처리했습니다. הֲמוֹנֶיהָ는 집단적 ‘무리’를 뜻하므로 ‘모든 무리’로 옮겼습니다.
theological_decisions:
- issue: 여성 단수 대명사의 지시 대상
  chosen_reading: 대명사는 애굽을 의인화한 여성 단수로 이해해 ‘그를/그의’로 옮기되, 본문의 나라-도시 의인화를 보존했습니다.
  alternative_readings:
  - 칼을 지시하는 것으로 볼 수 있음
  - 더 중립적으로 ‘그것’을 사용할 수 있음
  rationale: 주변 문맥이 파라오/애굽을 반복적으로 여성 의인화하므로, 이를 평탄화하지 않고 인격적 심판 선언으로 유지하는 것이 본문의 수사에 맞습니다.
  doctrine_reference: 예언문학의 의인화 보존
- issue: חֶרֶב נִתָּנָה의 압축성
  chosen_reading: ‘칼이 주어졌습니다’를 유지해 해석을 과도하게 덧붙이지 않았습니다.
  alternative_readings:
  - ‘칼이 지정되었습니다’로 심판의 도구성을 더 풀어쓸 수 있음
  - ‘칼이 판정되었습니다’처럼 의미를 확장할 수 있음
  rationale: 히브리어의 짧고 단호한 어조를 보존해, 애매함 자체가 주는 심판의 엄중함을 남겨 두었습니다.
  doctrine_reference: 본문 긴장 보존
