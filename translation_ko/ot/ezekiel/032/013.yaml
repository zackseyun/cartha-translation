  text: 내가 많은 물 곁에서 그 모든 짐승을 멸하겠고, 사람의 발도 다시는 그 물을 탁하게 하지 않을 것이며,[a] 짐승의 발굽도 그 물을 탁하게 하지 않을 것입니다.[b]
