  naturalness: 현대 표준어 합쇼체로 자연스럽게 다듬었습니다. ‘물들을 흐리게’보다 물이 밟혀 탁해지는 뜻을 명확히 하는 ‘물을 탁하게’가 문맥에 더 적합합니다.
  terminology: ‘멸하다’, ‘짐승’, ‘사람의 발’, ‘발굽’은 원문의 심판 문맥과 병행 구조를 잘 반영합니다. אָדָם의 포괄적 의미는 ‘사람’으로 유지했습니다.
