translation:
  language: ko
  text: 내가 그 강물들 곁에서 그 모든 짐승을 멸하겠고, 사람의 발도 다시는 그것들을 흐리게 하지 못하며, 짐승의 발굽도 그것들을 흐리게 하지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “강물들”은 원문의 ‘많은 물들’이 가리키는 나일의 풍요로운 수계를 자연스럽게 옮긴 표현입니다.
    reason: source_note
  - marker: b
    text: 원문의 동사는 발로 밟아 물을 탁하게 만들다는 뜻입니다.
    reason: lexical_alternative
