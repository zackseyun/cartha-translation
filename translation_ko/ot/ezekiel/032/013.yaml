- source_word: מֵעַל מַיִם רַבִּים
  english_pob_choice: from beside its abundant waters
  chosen_korean: 그 강물들 곁에서
  alternatives_korean:
  - 그 많은 물들에서
  - 그 많은 물가에서
  lexicon: HALOT
  rationale: מֵעַל의 공간적 의미를 한국어로 자연스럽게 드러내기 위해 ‘곁에서’를 사용했고, מַיִם רַבִּים은 나일의 풍부한 물을 가리키므로 ‘강물들’로 압축해 옮겼습니다.
- source_word: רֶגֶל אָדָם
  english_pob_choice: human foot
  chosen_korean: 사람의 발
  alternatives_korean:
  - 인의 발
  - 남자의 발
  lexicon: HALOT
  rationale: אָדָם의 일반적·인류적 용법을 한국어에서 가장 자연스럽게 드러내는 표현은 ‘사람’이므로, 성별 특정을 피하고 일반적 의미를 살렸습니다.
