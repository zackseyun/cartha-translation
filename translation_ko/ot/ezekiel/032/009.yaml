  text: וְ/הִ֨כְעַסְתִּ֔י לֵ֖ב עַמִּ֣ים רַבִּ֑ים בַּ/הֲבִיאִ֤/י שִׁבְרְ/ךָ֙ בַּ/גּוֹיִ֔ם עַל אֲרָצ֖וֹת אֲשֶׁ֥ר לֹֽא יְדַעְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/009.yaml
  text: And I will trouble the hearts of many peoples when I bring your ruin among the nations[c][b][a], into lands that you have not known.
  footnotes:
  - marker: a
    text: Or 'I will anger the heart of many peoples,' or 'I will grieve the hearts of many peoples.'
    reason: lexical_alternative
  - marker: b
    text: Or 'your destruction.' The Hebrew term can denote breaking, fracture, or ruin.
    reason: lexical_alternative
  - marker: c
    text: Or 'to lands that you have not known.' The phrase refers to foreign lands unfamiliar to you.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너의 파멸을 여러 민족 가운데, 네가 알지 못하는 땅들에 가져올 때에 많은 백성들의 마음을 동요시키겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 백성들의 마음을 분노하게 하겠습니다’, ‘괴롭게 하겠습니다’, 또는 ‘슬프게 하겠습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘파멸’은 히브리어 שבר가 가리킬 수 있는 ‘부서짐, 붕괴, 파멸’을 아우릅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘네가 알지 못하는 땅들’은 네게 낯선 외국 땅들을 가리킵니다.
    reason: lexical_alternative
