  rationale: שֶׁבֶר는 ‘부서짐’부터 ‘재난/붕괴’까지 아우르므로, 심판으로 인한 결과를 직역에 가깝게 살린 ‘무너짐’을 선택했습니다.
- source_word: בַּגּוֹיִם עַל אֲרָצוֹת
  english_pob_choice: among the nations, into lands
  chosen_korean: 여러 민족 가운데 가져올 때에 ... 네가 알지 못하는 땅들에 이르게
  alternatives_korean:
  - 민족들 가운데로 ... 땅들에
  - 나라들 가운데 ... 알려지지 않은 땅들에
  - 민족들 가운데에 ... 네가 알지 못한 땅들로
  lexicon: HALOT
  rationale: 동작의 공개성과 확산을 살려 ‘가져올 때에’와 ‘이르게 하겠습니다’로 나누어 옮겼고, עַל אֲרָצוֹת은 이동의 결과 지점을 분명히 하는 한국어로 처리했습니다.
theological_decisions:
- issue: יהוה의 심판이 여러 민족의 ‘마음’에 미치는 효과
  chosen_reading: 하나님이 애굽의 몰락을 여러 민족 앞에 드러내실 때, 그 내면을 동요시키시는 심판으로 읽었습니다.
  alternative_readings:
  - 단순히 분노하게 하시는 것으로 읽을 수 있음
  - 슬픔이나 애도로 국한해 읽을 수 있음
  rationale: 히브리어 사역형 כעס과 ‘마음’의 결합은 특정 감정 하나로 고정되지 않고 복합적 동요를 허용하므로, 그 긴장을 유지하는 번역을 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
