  text: And I will trouble the hearts of many peoples when I bring your ruin among the nations[c][b][a], into lands that you have not known.
  footnotes:
  - marker: a
    text: Or 'I will anger the heart of many peoples,' or 'I will grieve the hearts of many peoples.'
    reason: lexical_alternative
  - marker: b
    text: Or 'your destruction.' The Hebrew term can denote breaking, fracture, or ruin.
    reason: lexical_alternative
  - marker: c
    text: Or 'to lands that you have not known.' The phrase refers to foreign lands unfamiliar to you.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너의 무너짐을 여러 민족 가운데 가져올 때에 많은 백성의 마음을 흔들어 놓겠으며, 네가 알지 못하는 땅들에 이르게 하겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마음을 흔들어 놓다’는 히브리어의 ‘화나게 하다/괴롭게 하다/슬프게 하다’라는 폭넓은 뜻을 포괄합니다.
    reason: alternative_reading
  - marker: b
    text: ‘무너짐’은 히브리어 שבר가 가리킬 수 있는 ‘부서짐, 붕괴, 파멸’을 아우릅니다.
    reason: alternative_reading
  - marker: c
    text: ‘네가 알지 못하는 땅들’은 낯선 외국 땅들을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִכְעַסְתִּי לֵב
  english_pob_choice: I will trouble the hearts of
  chosen_korean: 많은 백성의 마음을 흔들어 놓겠으며
  alternatives_korean:
  - 많은 백성의 마음을 괴롭히겠으며
  - 많은 백성의 마음을 분노하게 하겠으며
  - 많은 백성의 마음을 슬퍼하게 하겠으며
  lexicon: HALOT
  rationale: כעס의 사역형은 단순한 ‘화남’보다 내면의 동요와 불편함을 포함할 수 있어, ‘마음을 흔들어 놓다’가 폭넓은 정서적 교란을 잘 살립니다.
- source_word: עַמִּים רַבִּים
  english_pob_choice: many peoples
  chosen_korean: 많은 백성
  alternatives_korean:
  - 많은 민족
  - 많은 사람들
  - 많은 백성들
  lexicon: HALOT
  rationale: 뒤의 גּוֹיִם와 구별되는 보다 넓은 집단을 가리키므로 ‘백성’으로 옮겨, 민족적·집단적 범위를 자연스럽게 살렸습니다.
- source_word: שִׁבְרְךָ
  english_pob_choice: your ruin
  chosen_korean: 너의 무너짐
  alternatives_korean:
  - 너의 파멸
  - 너의 파괴
  - 너의 부서짐
  lexicon: HALOT
  rationale: שֶׁבֶר는 ‘부서짐’부터 ‘재난/붕괴’까지 아우르므로, 심판으로 인한 결과를 직역에 가깝게 살린 ‘무너짐’을 선택했습니다.
- source_word: בַּגּוֹיִם עַל אֲרָצוֹת
  english_pob_choice: among the nations, into lands
  chosen_korean: 여러 민족 가운데 가져올 때에 ... 네가 알지 못하는 땅들에 이르게
  alternatives_korean:
  - 민족들 가운데로 ... 땅들에
  - 나라들 가운데 ... 알려지지 않은 땅들에
  - 민족들 가운데에 ... 네가 알지 못한 땅들로
  lexicon: HALOT
  rationale: 동작의 공개성과 확산을 살려 ‘가져올 때에’와 ‘이르게 하겠습니다’로 나누어 옮겼고, עַל אֲרָצוֹת은 이동의 결과 지점을 분명히 하는 한국어로 처리했습니다.
theological_decisions:
- issue: יהוה의 심판이 여러 민족의 ‘마음’에 미치는 효과
  chosen_reading: 하나님이 애굽의 몰락을 여러 민족 앞에 드러내실 때, 그 내면을 동요시키시는 심판으로 읽었습니다.
  alternative_readings:
  - 단순히 분노하게 하시는 것으로 읽을 수 있음
  - 슬픔이나 애도로 국한해 읽을 수 있음
  rationale: 히브리어 사역형 כעס과 ‘마음’의 결합은 특정 감정 하나로 고정되지 않고 복합적 동요를 허용하므로, 그 긴장을 유지하는 번역을 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
