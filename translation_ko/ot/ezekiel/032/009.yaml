  lexicon: HALOT
  rationale: 뒤의 גּוֹיִם와 구별되는 보다 넓은 집단을 가리키므로 ‘백성’으로 옮겨, 민족적·집단적 범위를 자연스럽게 살렸습니다.
- source_word: שִׁבְרְךָ
  english_pob_choice: your ruin
  chosen_korean: 너의 무너짐
  alternatives_korean:
