  naturalness: ‘누울 자리’, ‘칼에 맞아 죽은 자들’, ‘공포가 … 놓여 있었다’는 이해 가능하지만, 장례·심판 신탁의 엄숙한 문맥에서는 ‘침상’, ‘칼에 죽임을 당한 자들’, ‘공포가 … 드리워졌기’가 더 자연스럽고 원문의 비유 및 수동 표현을 잘 보존합니다.
  terminology: ‘할례받지 않은 자들’, ‘구덩이로 내려가는 자들’, ‘수치를 짊어졌습니다’는 적절합니다. 다만 성별 전환을 보존하려면 ‘그의 사방’ 및 마지막 ‘그는’을 사용해야 하며, 관련 각주를 해당 지점에 붙여야 합니다.
