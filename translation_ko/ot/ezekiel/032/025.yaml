id: EZK.32.25
reference: Ezekiel 32:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/ת֣וֹךְ חֲ֠לָלִים נָתְנ֨וּ מִשְׁכָּ֥ב לָ/הּ֙ בְּ/כָל הֲמוֹנָ֔/הּ סְבִֽיבוֹתָ֖י/ו קִבְרֹתֶ֑/הָ כֻּלָּ֣/ם עֲרֵלִ֣ים חַלְלֵי חֶ֡רֶב כִּֽי נִתַּ֨ן חִתִּיתָ֜/ם בְּ/אֶ֣רֶץ חַיִּ֗ים וַ/יִּשְׂא֤וּ כְלִמָּתָ/ם֙ אֶת י֣וֹרְדֵי ב֔וֹר בְּ/ת֥וֹךְ חֲלָלִ֖ים נִתָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/025.yaml
  text: Among the slain they made a bed for her with all her multitude[a]; her graves are all around her. All of them are uncircumcised, slain by the sword, because their terror was set in the land of the living. So they bore their disgrace with those who go down to the pit[c][b]; she was placed among the slain.
  footnotes:
  - marker: a
    text: Hebrew shifts from feminine ('her') to masculine ('him/his') in the middle of the verse, likely moving between the nation personified and its representative figure. The translation preserves this shift.
    reason: alternative_reading
  - marker: b
    text: Or 'because they spread their terror in the land of the living.' The Hebrew literally says 'because their terror was set in the land of the living.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he was placed among the slain,' if the final singular is taken to refer to a masculine representative rather than the nation personified as feminine.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 죽임을 당한 자들 가운데에 그녀와 그녀의 모든 무리를 위하여 침상을 마련했습니다. 그녀의 무덤들이 그의 사방에 있습니다.[a] 그들은 모두 할례받지 않은 자들이며 칼에 죽임을 당한 자들입니다. 이는 그들의 공포가 살아 있는 자들의 땅에 드리워졌기 때문입니다.[b] 그들은 구덩이로 내려가는 자들과 함께 자기 수치를 짊어졌고, 그는 죽임을 당한 자들 가운데 놓였습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 여성형(‘그녀의 무덤들’)에서 남성형(‘그의 사방’)으로 바뀝니다. 인격화된 나라와 그 대표자를 오가는 표현일 수 있으며, 번역은 이 전환을 보존합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들이 살아 있는 자들의 땅에 공포를 퍼뜨렸기 때문입니다.’ 히브리어는 문자적으로 ‘그들의 공포가 살아 있는 자들의 땅에 놓였다’라고 말합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 마지막 단수는 남성형입니다. 인격화된 나라의 남성 대표자를 가리킨다고 볼 수 있으며, 여성형 나라를 가리키는 것으로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּתוֹךְ חֲלָלִים
  english_pob_choice: Among the slain
  chosen_korean: 죽임을 당한 자들 가운데서
  alternatives_korean:
  - 죽은 자들 가운데서
  - 죽임을 당한 자들 한가운데서
  lexicon: HALOT
  rationale: חֲלָלִים은 이 문맥에서 전쟁으로 죽임을 당한 자들을 가리키므로, 한국어로는 '죽임을 당한 자들'이 의미를 가장 분명하게 드러냅니다.
- source_word: נָתְנוּ מִשְׁכָּב לָהּ
  english_pob_choice: they made a bed for her
  chosen_korean: 그녀와 함께 누울 자리를 마련했습니다
  alternatives_korean:
  - 그녀를 위해 자리를 만들었습니다
  - 그녀에게 침상을 마련했습니다
  lexicon: HALOT
  rationale: 직역의 '침상'보다 장례/묘지 이미지가 드러나는 '누울 자리'가 본문의 비유를 살리면서도 한국어로 자연스럽습니다.
- source_word: בְּכָל הֲמוֹנָהּ
  english_pob_choice: with all her multitude
  chosen_korean: 그녀의 무리 모두와 함께
  alternatives_korean:
  - 그녀의 큰 무리와 함께
  - 그녀의 모든 군중과 함께
  lexicon: HALOT
  rationale: הֲמוֹן은 집합적 '무리/군중'을 뜻하므로, 문맥상 과도한 해석을 피하면서 '무리'로 옮겼습니다.
- source_word: חִתִּיתָם
  english_pob_choice: their terror
  chosen_korean: 그들의 공포
  alternatives_korean:
  - 그들의 두려움
  - 그들의 경악
  lexicon: HALOT
  rationale: חִתִּית는 상대를 압도하는 공포·두려움을 가리키므로, 현대 한국어에서는 '공포'가 가장 직접적이고 강한 대응어입니다.
- source_word: יֹרְדֵי בוֹר
  english_pob_choice: those who go down to the pit
  chosen_korean: 구덩이로 내려가는 자들
  alternatives_korean:
  - 스올로 내려가는 자들
  - 무덤으로 내려가는 자들
  lexicon: HALOT
  rationale: בוֹר의 기본 이미지를 살려 '구덩이'로 옮겼고, 진행형 표현을 유지해 죽음의 하강 이미지를 보존했습니다.
theological_decisions:
- issue: 성별 지시의 보존 여부
  chosen_reading: 그녀 ... 그녀의 ... 그녀는
  alternative_readings:
  - 그 ... 그의 ... 그는
  - 그녀 ... 그의 ... 그녀는
  rationale: 히브리어 원문은 전체적으로 여성형을 유지하므로, 번역도 이를 그대로 살려 인격화된 나라의 표현을 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve source distinctions rather than harmonize them'
- issue: ‘할례받지 않은 자들’의 직역 유지
  chosen_reading: 할례받지 않은 자들
  alternative_readings:
  - 언약 밖의 자들
  - 부정한 자들
  rationale: 이 표현은 에스겔의 심판 신탁에서 언약적 수치와 배제의 표지이므로, 해석적 완화 없이 구체어를 유지했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition'
