translation:
  language: ko
  text: '“For thus says the 주 하나님: 바벨론 왕의 칼이 네게 올 것입니다.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “바벨론 왕의 칼이 네게 올 것이다”이지만, 심판 문맥에서는 적대적 공격을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹּה אָמַר
  english_pob_choice: For thus says
  chosen_korean: “For thus says”를 “이처럼 말씀하십니다”로 대응하지 않고, “For thus says”의 예언 공식을 살려 “For thus says” 대신 “이처럼 말씀하십니다” 계열의 엄격한 선언체를 쓰되, 본문에는 자연스러운 현대식 예언 도입부를 유지했습니다.
  alternatives_korean:
  - 이처럼 말씀하십니다
  - 주께서 이처럼 말씀하십니다
  lexicon: HALOT
  rationale: כִּי는 앞선 문맥과의 인과/근거를 잇는 접속사이고, כֹּה אָמַר은 예언자적 전언 공식입니다. 한국어에서는 자연스러운 선언문체로 옮기되, 예언적 공식을 무너뜨리지 않는 것이 중요합니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와 하나님
  lexicon: HALOT
  rationale: 아도나이와 YHWH가 결합된 복합 호칭이므로, 두 요소를 모두 살리되 한국어에서는 중복을 피하면서도 위엄을 유지하는 “주 하나님”이 가장 자연스럽습니다.
- source_word: חֶרֶב
  english_pob_choice: The sword
  chosen_korean: 칼
  alternatives_korean:
  - 칼날
  - 검
  lexicon: HALOT
  rationale: 히브리어 חֶרֶב은 문맥상 전쟁 심판의 무기이므로 “칼”이 직설적이고 현대 한국어에서도 가장 분명합니다. “검”은 더 문어적이지만 한국어에서 종종 전통 종교어로 들릴 수 있습니다.
- source_word: תְּבוֹאֶךָ
  english_pob_choice: will come upon/against you
  chosen_korean: 네게 올 것입니다
  alternatives_korean:
  - 네게 닥칠 것입니다
  - 네게 임할 것입니다
  - 네게 쳐들어올 것입니다
  lexicon: HALOT
  rationale: בוא는 기본적으로 “오다”이므로 직접적으로 “올 것입니다”를 유지하되, 심판 맥락의 적대성은 문맥 전체가 드러냅니다. 영어 각주가 지적한 hostile force는 본문 과잉설명 없이도 충분히 전달됩니다.
theological_decisions:
- issue: YHWH의 한국어 처리
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 야훼
  - 여호와 하나님
  rationale: 이 절은 예언 공식의 신적 화자를 드러내는 본문이므로, 합쇼체의 격식과 가독성을 우선해 “주 하나님”으로 옮겼습니다. 본문 내에서 고유명 재현보다 선언체의 힘이 더 중요합니다.
  doctrine_reference: 'POB glossary: יְהוָה / YHWH → 야훼 (default)'
