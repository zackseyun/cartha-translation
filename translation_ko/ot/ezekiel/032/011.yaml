base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/011.yaml
  text: 'For thus says the Lord GOD: The sword of the king of Babylon will come upon you[a].'
  footnotes:
  - marker: a
    text: Hebrew 'the sword of the king of Babylon will come to/against you'; 'against you' brings out the hostile force of the idiom in this judgment context.
