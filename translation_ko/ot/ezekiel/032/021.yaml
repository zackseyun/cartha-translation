id: EZK.32.21
reference: Ezekiel 32:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְדַבְּרוּ ל֞/וֹ אֵלֵ֧י גִבּוֹרִ֛ים מִ/תּ֥וֹךְ שְׁא֖וֹל אֶת עֹֽזְרָ֑י/ו יָֽרְד֛וּ שָׁכְב֥וּ הָ/עֲרֵלִ֖ים חַלְלֵי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/021.yaml
  text: 'The mighty among the chiefs will speak to him from the midst of Sheol[a], with his helpers: ‘They have gone down; they lie still, the uncircumcised[c][b], slain by the sword.’'
  footnotes:
  - marker: a
    text: Or 'the strong among the warriors'; the Hebrew phrase is difficult and could more literally be rendered 'the mighty ones of the warriors.'
    reason: lexical_alternative
  - marker: b
    text: Sheol is the Hebrew term for the realm of the dead; it is not identical in meaning to 'hell.'
    reason: cultural_note
  - marker: c
    text: Or 'with his allies.' The Hebrew can indicate those accompanying him in death.
    reason: lexical_alternative
translation:
  language: ko
  text: 용사들 중 강한 자들[a]이 스올[b] 한가운데에서 그의 도우는 자들과 함께[c] 그에게 말할 것입니다. “그들은 내려가서 누워 있습니다. 곧 할례받지 못한 자들, 칼에 죽임을 당한 자들입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘용사들 중 강한 자들’은 히브리어의 어려운 구문을 옮긴 것입니다. 더 자연스럽게는 ‘강한 용사들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 스올은 히브리어에서 죽은 자들의 처소를 가리키며, 곧바로 ‘지옥’과 같은 뜻은 아닙니다.
    reason: cultural_note
  - marker: c
    text: ‘그의 도우는 자들과 함께’는 ‘그의 동맹들과 함께’로도 옮길 수 있는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבְּרוּ לּוֹ
  english_pob_choice: will speak to him
  chosen_korean: 그에게 말할 것입니다
  alternatives_korean:
  - 그에게 말하겠습니다
  - 그에게 말을 할 것입니다
  lexicon: HALOT
  rationale: 예언적 조롱 장면에서 미래형의 대화 동사를 자연스럽게 살렸습니다.
- source_word: אֵלֵי גִבּוֹרִים
  english_pob_choice: the mighty among the chiefs
  chosen_korean: 용사들 가운데의 강한 자들
  alternatives_korean:
  - 강한 용사들
  - 장수들 가운데의 강한 자들
  - 용사들의 강한 자들
  lexicon: HALOT
  rationale: 문맥상 스올의 전사 집단을 가리키는 어려운 표현이므로, ‘among’의 관계를 살리면서도 위계적·전사적 뉘앙스를 유지했습니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 죽은 자들의 세계
  - 무덤
  - 지옥
  lexicon: HALOT
  rationale: 후대의 ‘지옥’ 개념으로 좁히지 않고, 히브리어 고유 개념을 보존하기 위해 음역했습니다.
- source_word: אֶת עֹזְרָיו
  english_pob_choice: with his helpers
  chosen_korean: 그와 함께 그의 도우는 자들과 더불어
  alternatives_korean:
  - 그의 도우는 자들과 함께
  - 그의 동맹들과 함께
  lexicon: HALOT
  rationale: אֶת의 동반적 용법을 반영하여 ‘함께/더불어’로 옮겼고, עֹזְרָיו는 단순한 보조자보다 전투·정치적 협력자까지 아우를 수 있어 ‘도우는 자들’로 처리했습니다.
- source_word: הָעֲרֵלִים
  english_pob_choice: the uncircumcised
  chosen_korean: 할례받지 못한 자들
  alternatives_korean:
  - 무할례자들
  - 포피를 벗기지 못한 자들
  lexicon: HALOT
  rationale: 에스겔의 언약적 수치 표현을 현대 한국어에서 통용되는 직접적 표현으로 옮겼습니다.
theological_decisions:
- issue: 스올의 번역 처리
  chosen_reading: 스올을 음역하여 고유 개념으로 유지했습니다.
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  - 지옥
  rationale: 본문은 죽은 자의 처소를 말하지만 후대의 ‘지옥’ 교리로 동일시하지 않으므로, 원문의 개념적 범위를 보존하는 것이 더 정확합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘할례받지 못한 자들’의 수치와 심판 뉘앙스
  chosen_reading: 언약 밖에 있는 자들의 수치와 패망을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 중립적 죽은 자들
  - 패망한 자들
  rationale: 에스겔에서 ‘무할례’는 단순한 신체 상태가 아니라 언약적 수치와 배제의 표지이므로 그 긴장을 희석하지 않았습니다.
  doctrine_reference: Ezekiel 32의 심판/수치 어휘
