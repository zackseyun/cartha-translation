    text: Or, more literally, 'with the slain of the sword.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너는, 그 할례받지 않은 자들의 한가운데에서 깨지고, 칼에 죽임을 당한 자들과 함께 누울 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘칼에 죽임을 당한 자들과 함께’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  english_pob_choice: But you
  chosen_korean: 그러나 너는
  alternatives_korean:
  - 그리고 너는
  - 너 또한
  lexicon: HALOT
  rationale: 문맥상 애굽/바로에게 직접 돌리는 대조가 분명하므로, 단순한 접속보다 역접을 살린 ‘그러나’가 POB의 ‘But you’를 더 잘 반영합니다.
- source_word: בְּ/ת֧וֹךְ עֲרֵלִ֛ים
  english_pob_choice: in the midst of the uncircumcised
  chosen_korean: 그 할례받지 않은 자들의 한가운데에서
  alternatives_korean:
  - 그 할례받지 않은 자들 가운데에서
  - 그 포피 있는 자들 가운데에서
  lexicon: HALOT
  rationale: ‘할례받지 않은 자들’은 에스겔에서 수치와 언약 밖의 상태를 가리키는 정형 표현이므로, 의미를 풀어 쓰되 문자성을 유지했습니다.
- source_word: תִּשָּׁבַ֥ר
  english_pob_choice: will be broken
  chosen_korean: 깨지고
  alternatives_korean:
  - 부서지고
  - 산산이 부서지고
  - 무너지고
  lexicon: HALOT
  rationale: נִ팔형의 수동적 파괴를 한국어로 자연스럽게 옮기기 위해 ‘깨지다’를 택했습니다. 뒤의 동사와 병렬을 이루므로 현재형 서술어 연결형으로 처리했습니다.
- source_word: וְ/תִשְׁכַּ֖ב אֶת חַלְלֵי חָרֶב
  english_pob_choice: and will lie with those slain by the sword
  chosen_korean: 칼에 죽임을 당한 자들과 함께 누울 것입니다
  alternatives_korean:
  - 칼에 죽임을 당한 자들과 함께 누울 것입니다
  - 칼에 죽은 자들과 함께 눕게 될 것입니다
  - 칼에 쓰러진 자들과 함께 누울 것입니다
  lexicon: HALOT
  rationale: שׁכב는 장사/죽음의 완곡어법으로 쓰이므로 ‘누울 것입니다’가 적절합니다. 또 אֶת은 이 문맥에서 동반 대상을 나타내므로 ‘~와 함께’로 옮겼습니다.
theological_decisions:
- issue: ‘the uncircumcised’의 표지 기능
  chosen_reading: ‘할례받지 않은 자들’로 직역하여, 죽음 속 수치와 언약 밖의 상태라는 에스겔의 표지를 보존했습니다.
  alternative_readings:
  - 불결한 자들
  - 불신한 자들
  - 이방인들
  rationale: 본문은 도덕적 평가어보다 신체/언약 표지를 사용합니다. 한국어에서도 그 표지성을 유지해야 예언적 조롱과 장례 심판의 뉘앙스가 살아납니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
