translation:
  language: ko
  text: 그러나 너는 할례받지 않은 자들 가운데에서 부서지고, 칼에 죽임을 당한 자들과 함께 누울 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘칼에 쓰러진 자들과 함께’.
