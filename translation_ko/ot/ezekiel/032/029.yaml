id: EZK.32.29
reference: Ezekiel 32:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁ֣מָּ/ה אֱד֗וֹם מְלָכֶ֨י/הָ֙ וְ/כָל נְשִׂיאֶ֔י/הָ אֲשֶׁר נִתְּנ֥וּ בִ/גְבוּרָתָ֖/ם אֶת חַלְלֵי חָ֑רֶב הֵ֛מָּה אֶת עֲרֵלִ֥ים יִשְׁכָּ֖בוּ וְ/אֶת יֹ֥רְדֵי בֽוֹר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/029.yaml
  text: There is Edom[a], her kings and all her princes, who were laid among those slain by the sword despite their might[b]. They lie with the uncircumcised and with those who go down to the pit.
  footnotes:
  - marker: a
    text: Or 'with their might' or 'in their might'; the Hebrew phrase may be read more literally, but the context highlights the irony that their strength did not prevent their downfall.
    reason: lexical_alternative
  - marker: b
    text: '''The pit'' is a common Hebrew image for the realm of the dead or the grave.'
    reason: cultural_note
translation:
  language: ko
  text: 거기에 에돔과 그 왕들, 그리고 그 모든 통치자들이 있습니다. 그들은 그들의 용맹함에도 불구하고 칼에 죽은 자들 가운데 놓였습니다. 그들은 할례받지 않은 자들과 함께, 또 구덩이로 내려가는 자들과 함께 누워 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘할례받지 않은 자들’은 여기서 단순한 신체적 상태보다 언약 밖에 있는 자들의 수치와 배제를 가리키는 예언자적 표현입니다.
    reason: theological_note
  - marker: b
    text: ‘구덩이’는 히브리어에서 종종 죽음의 영역이나 무덤을 가리키는 관용적 이미지입니다.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמָּה
  english_pob_choice: There is
  chosen_korean: 거기에 ... 있습니다
  alternatives_korean:
  - 거기에는 ... 있습니다
  - 거기에 ... 있느냐
  lexicon: HALOT
  rationale: 에스겔 32장의 반복되는 조문식 애가에서 장소를 가리키는 지시어를 살려, 단순한 서술이 아니라 ‘저곳에 있다’는 장면 제시를 유지했습니다.
- source_word: נְשִׂיאֶיהָ
  english_pob_choice: her princes
  chosen_korean: 그 모든 통치자들
  alternatives_korean:
  - 그 모든 방백들
  - 그 모든 왕족들
  lexicon: HALOT
  rationale: נָשִׂיא는 문맥상 왕과 나란히 놓이는 지도자/통치자를 가리키므로, 한국어에서는 현대 독자가 바로 이해할 수 있는 ‘통치자들’을 택했습니다.
- source_word: בִּגְבוּרָתָם
  english_pob_choice: despite their might
  chosen_korean: 그들의 용맹함에도 불구하고
  alternatives_korean:
  - 그들의 능력으로
  - 그들의 힘 가운데
  lexicon: HALOT
  rationale: 문맥의 역설—강함으로 알려진 자들이 오히려 죽은 자들 가운데 놓였다는 점—을 살리기 위해 ‘용맹함에도 불구하고’로 옮겼습니다. 다만 과도한 해석을 피하려고 너무 강한 추론 표현은 피했습니다.
- source_word: עֲרֵלִים
  english_pob_choice: the uncircumcised
  chosen_korean: 할례받지 않은 자들
  alternatives_korean:
  - 무할례자들
  - 할례 없는 자들
  lexicon: HALOT
  rationale: 예언서의 심판 문맥에서 covenantal shame를 드러내는 표현이므로, 종교적 의미를 약화시키지 않도록 문자적으로 옮겼습니다.
- source_word: וְאֶת יֹרְדֵי בוֹר
  english_pob_choice: and with those who go down to the pit
  chosen_korean: 또 구덩이로 내려가는 자들과 함께
  alternatives_korean:
  - 또 무덤으로 내려가는 자들과 함께
  - 또 지하로 내려가는 자들과 함께
  lexicon: HALOT
  rationale: בּוֹר는 여기서 단순한 구멍이 아니라 죽음의 영역을 가리키는 관용어이므로, POB의 ‘pit’을 따라 ‘구덩이’로 두어 이미지와 상호본문성을 보존했습니다.
theological_decisions:
- issue: ‘할례받지 않은 자들’의 신학적 뉘앙스
  chosen_reading: 단순한 신체적 상태가 아니라 언약 밖의 수치와 심판을 암시하는 표현으로 그대로 유지했습니다.
  alternative_readings:
  - 무할례자들로 완화
  - 이방인들로 의역
  rationale: 에스겔의 심판 어휘에서 이 표현은 죽음의 수치와 언약적 배제를 함께 드러내므로, 해설적으로 풀기보다 원 표현의 긴장을 보존하는 편이 본문 의도에 가깝습니다.
  doctrine_reference: 언약 표지와 심판의 수치성 보존
- issue: ‘구덩이’의 의미 범위
  chosen_reading: 죽음의 영역/무덤을 가리키는 시적 이미지로 유지했습니다.
  alternative_readings:
  - 무덤
  - 스올
  rationale: 본문의 병행 구조(‘칼에 죽은 자들’/‘구덩이로 내려가는 자들’)에서 בּוֹר는 실제 구멍이 아니라 사자(死者)의 처소를 가리키는 이미지이므로, 지나친 해석 없이 시적 상징을 살렸습니다.
  doctrine_reference: 예언서의 지하세계 이미지 보존
