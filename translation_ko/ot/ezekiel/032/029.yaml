  naturalness: 합쇼체 문장은 대체로 자연스럽습니다. 다만 ‘에돔과 그 왕들, 그리고 그 모든 통치자들이 있습니다’는 ‘그’의 반복과 열거가 다소 무겁습니다. ‘에돔과 그 왕들 및 모든 지도자들이 있습니다’로 다듬을 수 있습니다. 각주 표지는 해당 표현 바로 뒤에 두는 것이 명확합니다.
  terminology: ‘에돔’, ‘할례받지 않은 자들’, ‘구덩이’는 적절합니다. נְשִׂיאֶיהָ의 ‘통치자들’도 현대적이고 무난합니다. ‘용맹’은 גְּבוּרָה의 군사적 힘을 잘 반영합니다.
