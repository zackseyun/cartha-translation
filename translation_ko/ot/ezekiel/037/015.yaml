lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: came
  chosen_korean: 임하여
  alternatives_korean:
  - 왔습니다
  - 도착했습니다
  - 이르렀습니다
  lexicon: HALOT
  rationale: 예언서의 고정된 공식인 ‘말씀이 …에게 임하다’는 히브리어의 관용적 의미를 자연스럽게 살리면서도, 단순한 이동 동사가 아닌 계시의 도래를 드러냅니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 메시지
  - 말
  - 음성
  lexicon: HALOT
  rationale: 여기서는 하나님의 전달 내용 자체를 가리키므로, 한국어 성경에서 널리 쓰이지만 본문의 무게를 유지하는 ‘말씀’이 가장 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문이 신명기적 칭호가 아니라 여호와의 고유명사 יהוה를 직접 사용하므로, 프로젝트 기본어인 ‘야훼’를 유지했습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 제게
  alternatives_korean:
  - 내게
  - 저에게
  lexicon: HALOT
  rationale: 예언자에게 향하는 방향을 분명히 하면서도 현대 표준어의 공손한 서술체에 맞게 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 예언 공식의 관용적 표현을 직역보다 기능적으로 살릴지 여부
  chosen_reading: ‘말씀이 제게 임하여’로 옮겨 예언적 계시 공식의 울림을 보존했습니다.
  alternative_readings:
  - ‘말씀이 제게 왔습니다’
  - ‘말씀이 제게 이르렀습니다’
  rationale: 이 구절은 단순한 이동 묘사가 아니라 야훼의 계시가 선지자에게 주어지는 정형 공식이므로, 한국어에서도 그 신학적 기능이 드러나야 합니다.
  doctrine_reference: '예언서 서문 공식(예: 겔 1:3, 3:16)의 계시 전달 구조'
