  text: וְ/דַבֵּ֣ר אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּ֨ה אֲנִ֤י לֹקֵ֨חַ֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/בֵּ֥ין הַ/גּוֹיִ֖ם אֲשֶׁ֣ר הָֽלְכוּ שָׁ֑ם וְ/קִבַּצְתִּ֤י אֹתָ/ם֙ מִ/סָּבִ֔יב וְ/הֵבֵאתִ֥י אוֹתָ֖/ם אֶל אַדְמָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/021.yaml
  text: 'Then say to them[a], ‘Thus says the Lord GOD: Behold, I am taking the children of Israel from among the nations where they have gone[b], and I will gather them from all around and bring them to their own land.’'
  footnotes:
  - marker: a
    text: 'Hebrew: ''the children of Israel''; alternatively, ''the sons of Israel.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'from every side.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 이렇게 말하십시오. ‘주 야훼께서 이렇게 말씀하십니다. 보십시오, 내가 이스라엘 자손을 그들이 가서 머물던 민족들 가운데에서 거두어 모으고, 사방에서 그들을 모아 그들의 땅으로 데려가겠습니다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘 자손’으로 되어 있습니다. 다른 가능성으로는 ‘이스라엘의 아들들’이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사방에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדַבֵּר אֲלֵיהֶם
  english_pob_choice: Then say to them
  chosen_korean: 그들에게 이렇게 말하십시오
  alternatives_korean:
  - 그리고 그들에게 말하십시오
  - 그들에게 말하시오
  lexicon: HALOT
  rationale: 예언적 전달 명령의 순차성을 살리면서, 한국어에서는 자연스러운 간접화법 명령으로 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 아도나이와 여호와의 결합을 한국어에서 중복 없이 드러내기 위해 ‘주 야훼’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the children of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 자녀들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 혈연·언약적 표현을 보존하기 위해 관용적인 ‘이스라엘 자손’을 선택했습니다.
- source_word: מִסָּבִיב
  english_pob_choice: from all around
  chosen_korean: 사방에서
  alternatives_korean:
  - 둘러싼 곳에서
  - 주위에서
  lexicon: HALOT
  rationale: ‘사방에서’는 포위된 모든 방향에서의 집결이라는 이미지를 간결하게 살립니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 번역은 본문 자체의 언약명 표지를 드러내기 위해 신명기를 포함한 YHWH를 ‘야훼’로 표기하는 프로젝트 기본 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה / YHWH → 야훼'
