    reason: lexical_alternative
  - marker: b
    text: Or 'from every side.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 이렇게 말하십시오. ‘주 야훼께서 이렇게 말씀하십니다. 보십시오, 내가 이스라엘 자손[a]을 그들이 간 민족들 가운데에서 데려오고, 사방에서[b] 그들을 모아 그들의 땅으로 데려가겠습니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘 자손’으로 되어 있습니다. 다른 가능성으로는 ‘이스라엘의 아들들’이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘둘러싼 곳에서’.
    reason: lexical_alternative
