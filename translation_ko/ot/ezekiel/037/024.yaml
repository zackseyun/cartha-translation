id: EZK.37.24
reference: Ezekiel 37:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַבְדִּ֤/י דָוִד֙ מֶ֣לֶךְ עֲלֵי/הֶ֔ם וְ/רוֹעֶ֥ה אֶחָ֖ד יִהְיֶ֣ה לְ/כֻלָּ֑/ם וּ/בְ/מִשְׁפָּטַ֣/י יֵלֵ֔כוּ וְ/חֻקֹּתַ֥/י יִשְׁמְר֖וּ וְ/עָשׂ֥וּ אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/024.yaml
  text: My servant David will be king over them[a], and there will be one shepherd for all of them. They will walk in my judgments[b], and they will keep my statutes and do them.
  footnotes:
  - marker: a
    text: Or, 'he will be one shepherd for them all.' The Hebrew can be understood with the shepherd clause referring directly to David.
    reason: lexical_alternative
  - marker: b
    text: '''David'' may refer literally to David, to a future Davidic ruler, or typologically to the Messiah; the translation preserves the Hebrew wording without resolving the interpretation.'
    reason: alternative_reading
translation:
  language: ko
  text: 내 종 다윗[b]이 그들을 다스릴 왕이 될 것이며, 그들 모두에게 한 목자가 있을 것입니다[a]. 그들은 나의 법도를 따라 걸으며, 나의 규례들을 지키고 행할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 그들 모두에게 한 목자가 될 것입니다.’ 히브리어는 목자절이 다윗에게 직접 연결된 것으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다윗’은 문자 그대로의 다윗, 장차 올 다윗 계열의 통치자, 또는 유형적으로 메시아를 가리킬 수 있습니다. 번역은 해석을 확정하지 않고 히브리어 표현을 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 나의 종
  - 내 노예
  lexicon: HALOT
  rationale: דָוִד을 가리키는 הוראה적·언약적 표현으로서 ‘종’이 가장 자연스럽고, bonded status를 강조하는 ‘노예’는 이 문맥의 존칭적 왕권 예언에 과합니다.
- source_word: מֶלֶךְ עֲלֵיהֶם
  english_pob_choice: be king over them
  chosen_korean: 그들 위의 왕이 될
  alternatives_korean:
  - 그들을 다스리는 왕이 될
  - 그들 위에 군림할
  lexicon: HALOT
  rationale: מֶלֶךְ의 왕권 의미와 עַל의 지배 관계를 살려 ‘위의 왕’으로 옮겼습니다. ‘다스리는’도 가능하지만 왕정의 직접성을 덜 선명하게 합니다.
- source_word: וְרוֹעֶה אֶחָד יִהְיֶה לְכֻלָּם
  english_pob_choice: there will be one shepherd for all of them
  chosen_korean: 그들 모두를 위한 한 목자가 있을 것입니다
  alternatives_korean:
  - 그들 모두에게 한 목자가 될 것입니다
  - 그들 모두를 치는 한 목자가 있을 것입니다
  lexicon: HALOT
  rationale: רֹעֶה의 목자 이미지를 유지하면서, 인칭을 명시적으로 풀지 않는 히브리어 구조를 반영해 ‘있을 것입니다’로 옮겼습니다.
- source_word: מִשְׁפָּטַי
  english_pob_choice: my judgments
  chosen_korean: 나의 공의
  alternatives_korean:
  - 나의 판단
  - 나의 판단들
  - 나의 규례
  lexicon: HALOT
  rationale: 문맥상 משפט은 단순한 판결보다 언약적·규범적 ‘공의/판정’의 영역을 띠므로, POB의 ‘judgments’를 한국어에서 더 자연스럽고 폭넓게 드러내는 ‘공의’로 옮겼습니다.
- source_word: חֻקֹּתַי
  english_pob_choice: my statutes
  chosen_korean: 나의 규례
  alternatives_korean:
  - 나의 법도
  - 나의 율례
  lexicon: HALOT
  rationale: חֻקָּה 계열은 정해진 규범·조례의 뉘앙스를 가지므로, 현대 한국어에서 문맥상 가장 읽히는 ‘규례’를 택했습니다.
theological_decisions:
- issue: ‘다윗’의 정체를 본문에서 어떻게 처리할지
  chosen_reading: 본문은 해석을 덧붙이지 않고 ‘다윗’을 그대로 유지했습니다.
  alternative_readings:
  - 부활한 역사적 다윗
  - 다윗 계열의 통치자
  - 메시아로서의 다윗
  rationale: 히브리어는 פשוט하게 ‘다윗’이라고 말하므로, 메시아적 해석 가능성은 남기되 본문 안에서 특정 해석을 확정하지 않는 것이 POB의 긴장을 보존합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it in translation.'
- issue: ‘나의 공의 안에서 걸으며’의 표현 범위
  chosen_reading: ‘걸으며’라는 관용을 유지해 삶의 방식 전체를 뜻하는 언약적 행위를 드러냈습니다.
  alternative_readings:
  - 나의 공의를 행하며
  - 나의 공의 안에서 살아가며
  rationale: הלך의 비유적 용법을 살리면 단순한 행동 하나가 아니라 지속적 행실을 뜻한다는 점이 분명해집니다.
  doctrine_reference: 'Hebrew covenantal idiom: הלך as conduct.'
