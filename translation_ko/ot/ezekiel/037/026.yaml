id: EZK.37.26
reference: Ezekiel 37:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית שָׁל֔וֹם בְּרִ֥ית עוֹלָ֖ם יִהְיֶ֣ה אוֹתָ֑/ם וּ/נְתַתִּי/ם֙ וְ/הִרְבֵּיתִ֣י אוֹתָ֔/ם וְ/נָתַתִּ֧י אֶת מִקְדָּשִׁ֛/י בְּ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/026.yaml
  text: I will make with them a covenant of peace[a]; it will be an everlasting covenant with them. And I will place them and multiply them[c][b], and I will set my sanctuary in their midst forever.
  footnotes:
  - marker: a
    text: Or 'it will be for them an everlasting covenant.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I will set/place them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'among them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들과 평강의 언약을 맺을 것이며, 그것은 그들과의 영원한 언약이 될 것입니다. 또 나는 그들을 세우고 그들을 번성하게 하며, 내 성소를 그들 가운데에 영원히 두겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들과 평강의 언약을 맺을 것이며’는 ‘그들에게 영원한 언약이 될 것입니다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그들을 세우고’는 ‘그들을 두고’ 또는 ‘그들을 두어 정하시고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그들 가운데에’는 ‘그들 사이에’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָרַתִּי / בְּרִית שָׁלוֹם
  english_pob_choice: I will make with them a covenant of peace
  chosen_korean: 그들과 평강의 언약을 맺을 것이며
  alternatives_korean:
  - 그들과 평화의 언약을 맺을 것이며
  - 그들과 화평의 언약을 세울 것이며
  lexicon: HALOT
  rationale: כרת + בְּרִית의 관용구를 자연스럽게 풀어 ‘맺다’로 옮기되, שָׁלוֹם은 단순한 정서가 아니라 언약의 성격이므로 ‘평강’으로 유지했습니다.
- source_word: בְּרִית עוֹלָם
  english_pob_choice: an everlasting covenant
  chosen_korean: 영원한 언약
  alternatives_korean:
  - 영속하는 언약
  - 끝없는 언약
  lexicon: HALOT
  rationale: עוֹלָם의 언약 용례는 ‘영원한’이 가장 자연스럽고, 약속의 지속성을 한국어로 분명하게 전달합니다.
- source_word: וּנְתַתִּים
  english_pob_choice: I will place them
  chosen_korean: 그들을 세우고
  alternatives_korean:
  - 그들을 두고
  - 그들을 놓고
  lexicon: HALOT
  rationale: 사람을 목적어로 한 נתן은 단순한 ‘두다’보다 회복과 안정의 뉘앙스를 살리는 ‘세우다’가 적절합니다.
- source_word: מִקְדָּשִׁי בְּתוֹכָם
  english_pob_choice: my sanctuary in their midst
  chosen_korean: 내 성소를 그들 가운데에
  alternatives_korean:
  - 내 성소를 그들 안에
  - 내 성소를 그들 사이에
  lexicon: HALOT
  rationale: מִקְדָּשׁ은 ‘성전’보다 넓은 ‘성소’가 정확하고, בְּתוֹכָם은 개인 내면보다 공동체 한가운데의 뜻이므로 ‘그들 가운데에’로 옮겼습니다.
theological_decisions:
- issue: ‘평강의 언약’과 ‘영원한 언약’의 보존
  chosen_reading: 언약 용어를 약화시키지 않고 그대로 살려, 하나님의 회복이 단순한 축복이 아니라 언약적 결속임을 드러냈습니다.
  alternative_readings:
  - 일반적 화평 약속으로 풀어 쓰는 번역
  - 복지/안녕 중심의 의역
  rationale: 본문은 구조적으로 언약 진술이므로, 평강을 일반적인 안녕으로 축소하면 예언의 신학적 무게가 약해집니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 성소의 위치를 공동체적 현존으로 번역
  chosen_reading: ‘그들 가운데에’로 번역해 하나님의 임재가 공동체 한가운데에 있다는 이미지를 유지했습니다.
  alternative_readings:
  - ‘그들 안에’로 내주 중심 해석
  - ‘그들 사이에’로 더 느슨한 표현
  rationale: 히브리어 בְּתוֹכָם은 공동체적·공간적 중심을 가리키는 것이 가장 자연스러워, 개인 내면화보다 회중 가운데의 임재를 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3
