revisions:
- from: 그러므로 예언하고 그들에게 말하십시오. ‘주 하나님께서 이렇게 말씀하십니다. 보십시오, 내가 너희의 무덤들을 열고, 내 백성아, 너희를 너희의 무덤들에서 끌어올리며, 너희를 이스라엘 땅으로 데려가겠습니다.’[a][b]
  to: 그러므로 예언하고 그들에게 말하십시오. ‘주 하나님께서 이렇게 말씀하십니다. 보십시오, 내가 너희 무덤들을 열고, 나의 백성아[b], 너희를 너희 무덤들에서 올려 내어[a] 이스라엘 땅으로 데려가겠습니다.’
  rationale: The revision preserves the source's deliberate grave-and-ascent language and does not settle whether the imagery is exclusively national restoration or also bears resurrection implications. It removes an avoidable implication of forceful pulling, regularizes the Korean verbal coordination, and places both note markers at the phrases to which they apply.
