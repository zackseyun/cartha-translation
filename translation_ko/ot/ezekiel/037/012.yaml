  - severity: medium
    issue: ‘끌어올리며’ both adds a possible nuance of pulling and is awkwardly coordinated with the final future-polite verb.
    rationale: הֶעֱלָה denotes causing someone to go up; it does not necessarily specify pulling. ‘올려 내어’ keeps the movement out of the graves concrete while avoiding an unnecessary manner implication, and it coordinates naturally with ‘데려가겠습니다.’
  - severity: low
    issue: Both footnote markers occur at the end of the quotation rather than at their respective textual referents.
    rationale: Footnote a concerns the ascent-from-graves phrase, while footnote b concerns the grave-opening imagery and its interpretive scope. Anchoring them locally improves reference clarity.
