source:
  edition: WLC
  text: לָ/כֵן֩ הִנָּבֵ֨א וְ/אָמַרְתָּ֜ אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּה֩ אֲנִ֨י פֹתֵ֜חַ אֶת קִבְרֽוֹתֵי/כֶ֗ם וְ/הַעֲלֵיתִ֥י אֶתְ/כֶ֛ם מִ/קִּבְרוֹתֵי/כֶ֖ם עַמִּ֑/י וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם אֶל אַדְמַ֥ת יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/012.yaml
  text: 'Therefore prophesy and say to them[a], ‘Thus says the Lord GOD: Behold, I am opening your graves and will bring you up from your graves, my people[b], and I will bring you into the land of Israel.’'
  footnotes:
  - marker: a
    text: Or 'and will raise you from your graves.' The Hebrew literally says 'will bring you up from your graves.'
    reason: lexical_alternative
  - marker: b
    text: The imagery may describe Israel's restoration from exile through the language of opening graves, while also resonating with later resurrection hope.
    reason: cross_reference
translation:
  language: ko
  text: 그러므로 예언하고 그들에게 말하십시오. ‘주 하나님께서 이렇게 말씀하십니다. 보십시오, 내가 너희의 무덤들을 열고, 내 백성아, 너희를 너희의 무덤들에서 끌어올리며, 너희를 이스라엘 땅으로 데려가겠습니다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 무덤들에서 너희를 끌어올리겠다.’ 히브리어는 문자적으로 ‘너희의 무덤들에서 너희를 올라가게 하겠다’라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이미지는 포로기 회복을 무덤을 여는 언어로 묘사할 수 있으며, 동시에 후대의 부활 소망과도 울림을 가질 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그런 까닭에
  lexicon: HALOT
  rationale: 앞 문맥의 결론을 여는 추론 표지이므로, 문어적이면서도 자연스러운 ‘그러므로’로 연결합니다.
- source_word: הִנָּבֵא וְאָמַרְתָּ אֲלֵיהֶם
  english_pob_choice: prophesy and say to them
  chosen_korean: 예언하고 그들에게 말하십시오
  alternatives_korean:
  - 예언하여 그들에게 말하십시오
  - 예언하여 그들에게 전하십시오
  lexicon: HALOT
  rationale: 예언 명령과 발화 명령을 분리해 한국어 어순에 맞추되, 예언자의 공식적 전달을 살립니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 하나님의 주권자
  lexicon: HALOT
  rationale: 합쇼체 한국어 본문에서는 복합 칭호의 중복감을 피하면서도 ‘주’와 ‘하나님’을 모두 보존해 히브리어의 이중 호칭을 드러냅니다.
- source_word: פֹתֵחַ אֶת קִבְרֹתֵיכֶם
  english_pob_choice: I am opening your graves
  chosen_korean: 내가 너희의 무덤들을 열고
  alternatives_korean:
  - 내가 너희의 무덤을 열며
  - 내가 너희 무덤들을 열어
  lexicon: HALOT
  rationale: פתח의 현재적·진행적 느낌을 살려 ‘열고’로 옮기고, 복수형 ‘무덤들’을 유지해 원문의 수를 반영합니다.
- source_word: וְהַעֲלֵיתִי אֶתְכֶם מִקִּבְרוֹתֵיכֶם
  english_pob_choice: and will bring you up from your graves
  chosen_korean: 너희를 너희의 무덤들에서 끌어올리며
  alternatives_korean:
  - 너희를 너희의 무덤들에서 올리며
  - 너희를 너희의 무덤들에서 일으키며
  lexicon: HALOT
  rationale: עלה의 ‘위로 올리다’라는 구체적 움직임을 보존하기 위해 ‘끌어올리다’를 택했고, POB의 해석 여지를 따라 ‘부활’로 미리 좁히지 않았습니다.
- source_word: אֶל אַדְמַת יִשְׂרָאֵל
  english_pob_choice: into the land of Israel
  chosen_korean: 이스라엘 땅으로 데려가겠습니다
  alternatives_korean:
  - 이스라엘의 땅으로 데려가겠습니다
  - 이스라엘 땅 안으로 데려가겠습니다
  lexicon: HALOT
  rationale: אַדְמָה의 지리적·회복적 의미를 한국어에서 가장 자연스럽게 전달하는 ‘이스라엘 땅’으로 옮겼습니다.
theological_decisions:
- issue: 무덤을 여는 이미지의 범위
  chosen_reading: 본문의 무덤·끌어올림 이미지를 그대로 살려, 포로기 회복의 비유인지 장차의 부활까지 포함하는지 본문에서 단정하지 않습니다.
  alternative_readings:
  - 순전히 포로 귀환의 비유
  - 개별 육체 부활의 직접 예고
  rationale: 히브리어는 실제 무덤과 상승 동작을 사용하므로, 번역에서 그 긴장을 보존하는 것이 원문의 힘을 가장 잘 드러냅니다.
  doctrine_reference: 해석의 긴장을 보존하고 본문 밖에서 단정하지 않음
