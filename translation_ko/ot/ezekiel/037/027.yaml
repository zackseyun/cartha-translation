  text: My dwelling place will be over them[a], and I will be their God, and they will be my people.
  footnotes:
  - marker: a
    text: Or 'My tabernacle will be over them' or 'My dwelling will be over them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 처소가 그들 위에 있을 것이며, 나는 그들의 하나님이 되고 그들은 내 백성이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 처소’는 문맥상 ‘내 성막’ 또는 ‘내 거처’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּנִי
  english_pob_choice: my dwelling place
  chosen_korean: 내 처소
  alternatives_korean:
  - 내 성막
  - 내 거처
  - 내 거주처
  lexicon: HALOT
  rationale: מִשְׁכָּן은 문자적으로 ‘거처/장막/성막’의 뜻을 가지므로, 본문의 예언적·성전적 이미지를 살리면서도 현대 한국어에서 자연스러운 ‘처소’를 택했습니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: over them
  chosen_korean: 그들 위에
  alternatives_korean:
  - 그들 위로
  - 그들 위에 임하여
  - 그들과 함께
  lexicon: HALOT
  rationale: עַל의 기본 감각인 ‘위에/위로’의 공간적 이미지를 보존해, 보호와 덮임의 뉘앙스를 유지했습니다.
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  english_pob_choice: I will be their God
  chosen_korean: 나는 그들의 하나님이 되고
  alternatives_korean:
  - 나는 그들에게 하나님이 되고
  - 내가 그들의 하나님이 되며
  lexicon: HALOT
  rationale: 히브리어의 언약 공식은 한국어에서도 익숙한 ‘그들의 하나님이 되다’로 옮기되, 서술의 자연스러움을 위해 합쇼체 미래형으로 정리했습니다.
- source_word: וְהֵמָּה יִהְיוּ לִי לְעָם
  english_pob_choice: they will be my people
  chosen_korean: 그들은 내 백성이 될 것입니다
  alternatives_korean:
  - 그들은 나의 백성이 될 것입니다
  - 그들은 내게 한 백성이 될 것입니다
  lexicon: HALOT
  rationale: 두 번째 언약 공식을 ‘내 백성’으로 직역성 있게 옮겨, 전통적 성경 어법과 본문의 상호언약적 대응을 유지했습니다.
theological_decisions:
- issue: 언약 공식의 보존
  chosen_reading: ‘나는 그들의 하나님이 되고 그들은 내 백성이 될 것입니다’라는 대칭 구조를 그대로 유지했습니다.
  alternative_readings:
  - ‘나는 그들에게 하나님이 되고 그들은 내게 한 백성이 될 것입니다’
  - 의역하여 관계적 의미만 전달하는 방식
  rationale: 본절은 언약 관계를 압축적으로 선언하는 공식이므로, 구조를 보존하는 것이 신학적 연속성과 본문 인지를 가장 잘 살립니다.
  doctrine_reference: Translation philosophy §1, §5
