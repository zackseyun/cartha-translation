  naturalness: 현 초안의 서술문은 합쇼체이나 인용문 질문 ‘있겠느냐’는 해라체이므로 지정된 현대 공식-공손 합쇼체와 일치하지 않습니다. ‘있겠습니까?’로 고치면 문체가 일관되고 자연스럽습니다. ‘주 야훼여, 주께서 아십니다’는 원문의 직접 호칭과 존칭을 자연스럽게 재현합니다.
  terminology: ‘인자’는 에스겔서의 반복 호칭으로 적절합니다. ‘주 하나님’은 אֲדֹנָי יְהוִה의 신명 요소를 일반 신적 호칭으로 바꾸므로 ‘주 야훼’로 수정해야 합니다. 이에 따라 ‘전통적으로 주 하나님으로 옮길 수 있다’는 각주도 본문에 불필요하며, 제시된 신명 방침과도 맞지 않습니다.
