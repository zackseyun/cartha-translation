id: EZK.37.3
reference: Ezekiel 37:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם הֲ/תִחְיֶ֖ינָה הָ/עֲצָמ֣וֹת הָ/אֵ֑לֶּה וָ/אֹמַ֕ר אֲדֹנָ֥/י יְהוִ֖ה אַתָּ֥ה יָדָֽעְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/003.yaml
  text: And he said to me[a], “Son of man, can these bones live?” And I said, “Lord GOD, you know.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Lord Yahweh.'' The translation ''Lord GOD'' reflects the customary English rendering of the title אֲדֹנָי יְהוִה, avoiding the awkward repetition ''Lord LORD'' while preserving the divine-name element.'
    reason: alternative_reading
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. 「인자야, 이 뼈들이 살아날 수 있겠습니까?」 제가 대답했습니다. 「주 야훼여, 주께서 아십니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인자
  lexicon: HALOT
  rationale: 에스겔서에서 반복되는 신적 호칭을 살리기 위해 직역적 호칭을 유지하되, 한국어에서는 호격을 자연스럽게 드러내는 「인자야」가 가장 직접적입니다.
- source_word: הֲתִחְיֶינָה הָעֲצָמוֹת הָאֵלֶּה
  english_pob_choice: can these bones live
  chosen_korean: 이 뼈들이 살아날 수 있겠느냐
  alternatives_korean:
  - 이 뼈들이 살겠느냐
  - 이 뼈들이 살아나겠느냐
  lexicon: HALOT
  rationale: 질문형 가능성 의미를 따라 「살아날 수 있겠느냐」로 옮겨, 단순 미래 예측보다 능력/가능 여부를 드러냈습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 주님
  lexicon: HALOT
  rationale: 영어 POB의 관습적 처리인 「Lord GOD」에 대응해, 합쇼체 문맥에서 자연스럽고 존칭이 중복되지 않도록 「주 하나님」으로 옮겼습니다. 여기서 「하나님」은 יְהוִה를 가리키는 신적 호칭을 반영합니다.
- source_word: אַתָּה יָדָעְתָּ
  english_pob_choice: you know
  chosen_korean: 주님께서 아십니다
  alternatives_korean:
  - 주님만 아십니다
  - 주님이 아십니다
  lexicon: HALOT
  rationale: 히브리어는 단순히 「당신이 아십니다」라고 말하지만, 에스겔의 응답은 공손한 직접 호칭이므로 한국어에서는 주어를 생략한 존칭형으로 자연스럽게 다듬었습니다.
theological_decisions:
- issue: יהוה를 한국어로 어떻게 표기할지
  chosen_reading: 이 절의 compound title אֲדֹנָי יְהוִה는 「주 하나님」으로 처리했습니다.
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 문맥상 영어 POB의 「Lord GOD」가 의도한 것은 반복을 피하면서도 신적 이름 요소를 보존하는 것입니다. 한국어에서는 합쇼체 문체와 예언자 응답의 공손함을 살리기 위해 전통적 교회어 「주 하나님」을 택했습니다.
  doctrine_reference: DOCTRINE.md Contested terms — YHWH / divine-name rendering
- issue: 예언자의 응답에서 주어를 어떻게 처리할지
  chosen_reading: 「주 하나님, 주님께서 아십니다」처럼 직접 화법의 공손한 응답으로 옮겼습니다.
  alternative_readings:
  - 주 하나님, 아십니다
  - 주 하나님, 당신이 아십니다
  rationale: 히브리어의 짧은 응답은 겸손한 인정 표현입니다. 한국어에서는 대화체의 자연스러움과 하나님께 드리는 공손함을 함께 살리기 위해 존칭형을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
