base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/014.yaml
  text: I will put my Spirit within you[a], and you will live, and I will settle you on your own land. Then you will know that I am Yahweh. I have spoken, and I have done it, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'my breath' or 'my spirit'; the Hebrew word can also mean 'wind.' Ezekiel 37 intentionally echoes this range of meaning.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 영을 너희 안에 둘 것이니 너희가 살아날 것입니다. 또 내가 너희를 너희 땅에 정착시킬 것이며, 그때 너희는 내가 야훼임을 알게 될 것입니다. 내가 말했고, 내가 이루었습니다. 야훼의 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רוּחַ는 ‘숨’, ‘바람’, ‘영’을 뜻할 수 있으며, 에스겔 37장은 이 의미 범위를 의도적으로 겹쳐 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: רוּחִי
  english_pob_choice: my Spirit
  chosen_korean: 내 영
  alternatives_korean:
  - 내 숨
  - 내 바람
  - 내 영
  lexicon: HALOT
  rationale: רוּחַ는 숨, 바람, 영을 모두 뜻할 수 있지만, 여기서는 하나님의 주어적 소유격과 회복 약속의 문맥이 살아 있는 ‘내 영’이 가장 자연스럽고, 문맥상 생명 부여의 뉘앙스도 함께 살립니다.
- source_word: וִחְיִיתֶם
  english_pob_choice: you will live
  chosen_korean: 너희가 살아날 것입니다
  alternatives_korean:
  - 너희가 살 것입니다
  - 너희가 생명을 얻을 것입니다
  lexicon: HALOT
  rationale: חיה는 단순한 생존보다 ‘살아남/살아나다’까지 포괄할 수 있어, 골짜기 환상과 연결되는 생명 회복의 동작성을 살려 ‘살아날 것입니다’로 옮겼습니다.
- source_word: וְהִנַּחְתִּי אֶתְכֶם עַל אַדְמַתְכֶם
  english_pob_choice: I will settle you on your own land
  chosen_korean: 내가 너희를 너희 땅에 정착시킬 것이며
  alternatives_korean:
  - 내가 너희를 너희 땅에 두겠으며
  - 내가 너희를 너희 땅에 안착시키겠으며
  - 내가 너희를 너희 땅에 머물게 하겠으며
  lexicon: HALOT
  rationale: 히필형의 מנח/נוח 계열은 ‘쉬게 하다, 두다, 정착시키다’의 의미를 가지므로, 회복된 거주와 안정성을 함께 드러내는 ‘정착시키다’가 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사본의 신명기적 고유명사를 제목어로 대체하지 않고, 프로젝트 기본값에 따라 음역형 ‘야훼’를 사용해 인격적 언약 이름을 보존했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말입니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼의 말씀입니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언문 종결 공식의 권위와 문체를 살리면서도 현대 한국어에서 자연스럽게 들리도록 ‘말입니다’로 옮겼습니다.
theological_decisions:
- issue: רוּחִי를 ‘영’으로 유지할지, ‘숨/바람’의 의미를 전면화할지
  chosen_reading: 내 영
  alternative_readings:
  - 내 숨
  - 내 바람
  - 내 영
  rationale: 37장 전체가 רוח의 의미 범위를 의도적으로 겹쳐 쓰지만, 본절은 하나님의 주시는 생명력과 임재가 분명하여 ‘영’을 기본으로 하되, 본문의 다의성을 소거하지 않는 범위에서만 번역했습니다.
  doctrine_reference: Preserve the lexical tension of רוח without flattening the divine gift sense
