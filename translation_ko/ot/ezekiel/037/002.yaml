translation:
  language: ko
  text: 그가 나를 뼈들 사이를 두루 지나가게 하셨습니다.[a] 보십시오, 골짜기 표면[b]에 뼈들이 아주 많이 있었고, 보십시오, 그 뼈들은 매우 말라 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들 위로’라고도 옮길 수 있습니다. 문맥에서는 골짜기에 있는 뼈들에 관하여 두루 이동하는 모습을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구는 문자적으로 ‘골짜기의 얼굴 위에’입니다.
    reason: lexical_alternative
