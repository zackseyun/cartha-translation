  rationale: ‘face of the valley’라는 히브리어 관용구를 직역에 가깝게 유지하되, 한국어에서는 ‘표면’이 시각적 이미지와 문맥을 가장 잘 전달합니다.
- source_word: יְבֵשׁוֹת מְאֹד
  english_pob_choice: very dry
  chosen_korean: 매우 말랐습니다
  alternatives_korean:
  - 지극히 말랐습니다
  - 완전히 말랐습니다
  lexicon: HALOT
  rationale: 뼈의 상태를 과장하지 않으면서도 강한 강조를 보존하기 위해 ‘매우’와 ‘말랐습니다’를 택했습니다.
theological_decisions:
- issue: 예언 환상 서술의 감탄사 וְהִנֵּה의 번역
  chosen_reading: ‘보십시오’로 옮겨 환상의 생생한 주의 환기 효과를 유지했습니다.
  alternative_readings:
