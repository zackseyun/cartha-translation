base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/002.yaml
  text: And he led me around among them[a], all around; and behold, there were very many on the surface of the valley, and behold[b], they were very dry.
  footnotes:
  - marker: a
    text: Or 'he caused me to pass over them all around.' The Hebrew can be rendered more formally, but the main text expresses the likely spatial sense in natural English.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'on the face of the valley.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 그들 사이로, 사방으로 이끄셨습니다. 보십시오, 골짜기 표면에는 매우 많은 것이 있었고, 보십시오, 그것들은 매우 말랐습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들 위로/그들에 대하여’이지만, 문맥상 함께 둘러보는 공간 관계를 나타내므로 ‘그들 사이로’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구는 문자적으로 ‘골짜기의 얼굴 위에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִירַנִי
  english_pob_choice: he led me around
  chosen_korean: 나를 … 이끄셨습니다
  alternatives_korean:
