  lexicon: HALOT
  rationale: 히필 עבר의 사역적 의미를 살리되, 환상 장면에서 자연스러운 이동을 나타내는 ‘이끄셨습니다’로 옮겼습니다.
- source_word: עֲלֵיהֶם סָבִיב סָבִיב
  english_pob_choice: among them, all around
  chosen_korean: 그들 사이로, 사방으로
  alternatives_korean:
  - 그들 위로, 빙빙
  - 그들 주위로, 두루
  lexicon: HALOT
  rationale: 반복된 סָבִיב סָבִיב의 둘러 감는 강조를 ‘사방으로’로 살리고, עֲלֵיהֶם은 이 문맥에서 ‘그들 사이로’로 풀어 공간 관계를 자연스럽게 나타냈습니다.
- source_word: עַל פְּנֵי הַבִּקְעָה
  english_pob_choice: on the surface of the valley
  chosen_korean: 골짜기 표면에는
  alternatives_korean:
  - 골짜기의 얼굴 위에는
  - 골짜기 바닥에는
