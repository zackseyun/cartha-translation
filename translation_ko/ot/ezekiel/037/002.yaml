  - 단순 서술로 생략
  rationale: 예언 환상 내에서 화자의 시선을 독자에게 즉시 공유시키는 기능이 있어, 현대 한국어에서도 명령형보다 경청 유도형인 ‘보십시오’가 합쇼체와 잘 맞습니다.
  doctrine_reference: 예언서 수사와 시점 전환의 보존
