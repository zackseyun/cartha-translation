source:
  edition: WLC
  text: דַּבֵּ֣ר אֲלֵ/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּה֩ אֲנִ֨י לֹקֵ֜חַ אֶת עֵ֤ץ יוֹסֵף֙ אֲשֶׁ֣ר בְּ/יַד אֶפְרַ֔יִם וְ/שִׁבְטֵ֥י יִשְׂרָאֵ֖ל חבר/ו וְ/נָתַתִּי֩ אוֹתָ֨/ם עָלָ֜י/ו אֶת עֵ֣ץ יְהוּדָ֗ה וַֽ/עֲשִׂיתִ/ם֙ לְ/עֵ֣ץ אֶחָ֔ד וְ/הָי֥וּ אֶחָ֖ד בְּ/יָדִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/019.yaml
  text: 'tell them[a], ‘Thus says the Lord GOD: Behold, I am taking the stick of Joseph, which is in the hand of Ephraim, and the tribes of Israel associated with him, and I will place them with it, with the stick of Judah, and make them one stick[b], and they will be one in my hand.’'
  footnotes:
  - marker: a
    text: Or “the tribes of Israel his companions” or “the tribes of Israel joined to him.” The Hebrew form likely refers to the tribes associated with Joseph/Ephraim.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “I will put them upon it, with the stick of Judah.” The wording depicts the symbolic joining of the two sticks into one.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 말하십시오. 「주 야훼께서 이렇게 말씀하십니다. 보십시오, 내가 요셉의 막대기, 곧 에브라임의 손에 있는 것과 요셉/에브라임과 연합한 이스라엘의 지파들을[a] 가져다가 유다의 막대기에 그것들을 붙이고[b], 그것들을 하나의 막대기로 만들겠습니다. 그것들은 내 손에서 하나가 될 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “그와 연합한 이스라엘의 지파들” 또는 “그의 동료인 이스라엘의 지파들”로도 옮길 수 있습니다. 여기서 ‘그’는 문맥상 요셉, 곧 에브라임을 가리키는 것으로 이해됩니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 “그것들을 그 위에, 유다의 막대기와 함께 놓겠다”입니다. 이 표현은 상징적으로 두 막대기를 하나로 결합하는 동작을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֲלֵהֶם
  english_pob_choice: tell them
  chosen_korean: 그들에게 말하십시오
  alternatives_korean:
