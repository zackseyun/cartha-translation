  lexicon: HALOT
  rationale: 예언자적 직접 명령을 자연스러운 현대 공손체로 옮기되, דבר + אל의 지시 성격을 유지했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  lexicon: HALOT
  rationale: 아도나이+יהוה 결합 호칭은 한국어에서 통상적인 호칭 기능을 살려 ‘주 하나님’으로 옮겼고, 본 절의 관용적 예언자 서두를 유지했습니다.
- source_word: עֵץ
  english_pob_choice: stick
  chosen_korean: 막대기
  alternatives_korean:
  - 지팡이
  - 나무 조각
  lexicon: HALOT
  rationale: 상징 행동의 대상이 되는 목재 막대의 형상을 가장 직접적으로 드러내는 말로 ‘막대기’를 택했습니다.
- source_word: וְשִׁבְטֵי יִשְׂרָאֵל חברו
  english_pob_choice: and the tribes of Israel associated with him
  chosen_korean: 그와 연합한 이스라엘의 지파들
  alternatives_korean:
  - 그의 동료인 이스라엘의 지파들
  - 그에게 붙은 이스라엘의 지파들
  lexicon: HALOT
  rationale: חברו의 연합/결합 의미를 살려 정치적·언약적 연대를 자연스럽게 표현했습니다.
- source_word: וְנָתַתִּי אוֹתָם עָלָיו
  english_pob_choice: and I will place them with it
  chosen_korean: 그것들 위에 ... 더하여
  alternatives_korean:
  - 그것들 위에 놓아
  - 그것들에 붙여
  lexicon: HALOT
  rationale: 히브리어의 ‘위에 두다’는 결합 동작을 가리키므로, 상징적 합침을 드러내는 ‘더하여’로 옮겼습니다.
- source_word: וְהָיוּ אֶחָד בְּיָדִי
  english_pob_choice: and they will be one in my hand
  chosen_korean: 그것들은 내 손에서 하나가 될 것입니다
  alternatives_korean:
  - 그것들은 내 손안에서 하나가 될 것입니다
  - 그것들은 내 손에 하나로 있을 것입니다
  lexicon: HALOT
  rationale: 마지막 ‘손’ 이미지를 보존하면서, 결과 상태를 분명히 하는 한국어로 다듬었습니다.
theological_decisions:
- issue: יהוה의 한국어 표기와 아도나이 결합 호칭의 처리
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 이 절의 초점은 신명 표기 자체보다 예언자적 권위 선언의 형식이므로, 합쇼체 본문에서는 예언 공식의 기능을 살리는 호칭을 우선했습니다.
  doctrine_reference: POB Korean name-rendering policy / Ezekiel prophetic formula consistency
- issue: 상징 행동의 결합 동작을 직역할지 문맥화할지
  chosen_reading: 막대기들을 하나의 막대기로 만들며
  alternative_readings:
  - 막대기들을 하나로 합치며
  - 하나의 막대기로 만들어
  rationale: 문맥상 두 막대기의 실제 결합을 보여 주는 상징 행위이므로, 문자상 ‘만들다’ 구조를 유지하되 한국어로는 자연스럽게 연결했습니다.
  doctrine_reference: Ezekiel 37 symbolic action discourse
