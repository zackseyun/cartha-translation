  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָֽדְעוּ֙ הַ/גּוֹיִ֔ם כִּ֚י אֲנִ֣י יְהוָ֔ה מְקַדֵּ֖שׁ אֶת יִשְׂרָאֵ֑ל בִּ/הְי֧וֹת מִקְדָּשִׁ֛/י בְּ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/028.yaml
  text: Then the nations will know that I am Yahweh who sanctifies Israel[c][b][a], when my sanctuary is in their midst forever.
  footnotes:
  - marker: a
    text: Or 'And the nations will know.' The Hebrew conjunction can be rendered simply 'and,' but here it likely carries a consequential sense from the preceding restoration promises.
    reason: lexical_alternative
  - marker: b
    text: Or 'who makes Israel holy.'
    reason: lexical_alternative
  - marker: c
    text: Or 'among them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 여러 민족은 내가 야훼인 줄, 곧 이스라엘을 거룩하게 하시는 분인 줄 알게 될 것입니다. 내 성소가 그들 가운데 영원히 있을 때입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그러면 여러 민족은'으로 옮길 수 있습니다. 히브리어 접속사는 단순한 '그리고'일 수도 있지만, 여기서는 앞선 회복 약속에서 이어지는 결과의 뜻이 더 강해 보입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '이스라엘을 거룩하게 만드시는 분'입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '그들 가운데'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ הַגּוֹיִם
  english_pob_choice: Then the nations will know
  chosen_korean: 그러면 여러 민족은 ... 알게 될 것입니다
  alternatives_korean:
  - 그리고 여러 민족은 ... 알게 될 것입니다
  - 그때 민족들은 ... 알게 될 것입니다
  lexicon: HALOT
  rationale: וְ + ידע의 예언적 결과를 한국어의 '그러면'으로 살렸고, גּוֹיִם은 이 문맥에서 '민족'보다 외부 열방을 드러내는 '여러 민족'으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명기적 고유명사를 칭호가 아니라 음역인 '야훼'로 옮겼습니다.
- source_word: מְקַדֵּשׁ אֶת יִשְׂרָאֵל
  english_pob_choice: who sanctifies Israel
  chosen_korean: 이스라엘을 거룩하게 하시는 분
  alternatives_korean:
  - 이스라엘을 성별하시는 분
  - 이스라엘을 거룩하게 만드시는 분
  lexicon: HALOT
  rationale: '''מקדש''의 핵심은 단순한 도덕적 개선보다 하나님이 이스라엘을 거룩의 상태로 구별하시는 행위이므로, ''거룩하게 하시는 분''이 가장 자연스럽고 신학적 긴장을 덜 훼손합니다.'
- source_word: בְּתוֹכָם לְעוֹלָם
  english_pob_choice: in their midst forever
  chosen_korean: 그들 가운데 영원히
  alternatives_korean:
  - 그들 안에 영원히
  - 그들 한복판에 영원히
  lexicon: HALOT
  rationale: בְּתוֹכָם은 집단적 임재를 뜻하므로 '그들 가운데'가 가장 정확하며, לְעוֹלָם은 현대 한국어에서 자연스러운 '영원히'로 옮겼습니다.
theological_decisions:
- issue: 야훼의 거처가 가져오는 인식의 목적
  chosen_reading: 하나님이 이스라엘을 거룩하게 하시는 사실을 열방이 알게 되는 것이 본문의 목적이라고 보았습니다.
  alternative_readings:
  - 단순히 이스라엘 회복의 결과를 말하는 것으로 볼 수 있습니다.
  - 성소의 존재 자체보다 상징적 의미를 강조할 수 있습니다.
  rationale: 본문은 성소의 영구적 임재와 열방의 인식을 직접 연결하므로, 결과만이 아니라 야훼의 거룩하게 하심이 드러나는 목적 진술로 읽는 것이 문맥에 가장 충실합니다.
  doctrine_reference: Ezekiel 37:28의 거룩-임재 주제 및 야훼 인식 공식
- issue: 직접 화법 여부와 문장 리듬
  chosen_reading: 예언적 선언문으로서 현대 한국어 합쇼체를 유지하되, 하나님의 자기계시 내용은 간결하게 직설로 옮겼습니다.
  alternative_readings:
  - 더 경건체적인 종결을 사용할 수 있습니다.
  - 전문어 '성별하다'를 일관되게 사용할 수 있습니다.
  rationale: 본 절은 서술적 예언이므로 과도한 경건체보다 명료한 선언형이 원문 효과를 더 잘 전달하며, 대중적 가독성을 위해 '거룩하게 하시는' 표현을 택했습니다.
  doctrine_reference: Translation style guideline for modern formal-polite Korean
