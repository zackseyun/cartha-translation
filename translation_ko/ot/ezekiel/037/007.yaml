  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִבֵּ֖אתִי כַּ/אֲשֶׁ֣ר צֻוֵּ֑יתִי וַֽ/יְהִי ק֤וֹל כְּ/הִנָּֽבְאִ/י֙ וְ/הִנֵּה רַ֔עַשׁ וַ/תִּקְרְב֣וּ עֲצָמ֔וֹת עֶ֖צֶם אֶל עַצְמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/007.yaml
  text: So I prophesied as I was commanded[a], and as I prophesied, there was a sound, and behold, a rattling, and the bones came together[b], bone to its bone.
  footnotes:
  - marker: a
    text: Or 'a shaking' or 'an earthquake' for 'a rattling' (רַעַשׁ); the context of bones assembling favors the more specific sense of rattling.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'bone to its bone,' a distributive expression indicating each bone joined to its matching bone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 나는 명령받은 대로 예언했습니다. 내가 예언할 때에 소리가 났고, 보니 덜그럭거리는 소리가 났습니다.[a] 뼈들이 가까이 다가왔고, 뼈마다 제 짝 뼈에 이르렀습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רַעַשׁ은 ‘흔들림’, ‘요동’, ‘지진’ 또는 ‘덜그럭거리는 소리’를 뜻할 수 있습니다. 여기서는 뼈들이 제자리를 찾아 움직이는 문맥상 ‘덜그럭거리는 소리’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘뼈가 제 뼈에’입니다. 이는 각 뼈가 그에 해당하는 짝 뼈에 이르는 것을 나타내는 분배적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבֵּאתִי
  english_pob_choice: I prophesied
  chosen_korean: 내가 예언하니
  alternatives_korean:
  - 내가 예언했습니다
  - 내가 선포하니
  lexicon: HALOT
  rationale: נבא의 예언 행위를 자연스러운 합쇼체 서술로 옮기되, 에스겔의 수행 중인 예언 동작을 살려 “예언하니”로 처리했습니다.
- source_word: כַּאֲשֶׁר צֻוֵּיתִי
  english_pob_choice: as I was commanded
  chosen_korean: 명령받은 대로
  alternatives_korean:
  - 명령받은 그대로
  - 지시받은 대로
  lexicon: HALOT
  rationale: 수동형 ‘명령받다’의 피동성을 유지하면서도 한국어에서 가장 자연스럽고 간결한 대응으로 옮겼습니다.
- source_word: רַעַשׁ
  english_pob_choice: a rattling
  chosen_korean: 요란한 흔들림
  alternatives_korean:
  - 덜그럭거리는 소리
  - 흔들리는 소리
  - 요란한 소리
  lexicon: HALOT
  rationale: 문맥상 뼈가 맞물리며 나는 소리와 움직임을 함께 담아야 하므로, 단순한 ‘지진’보다 뼈들의 결합을 암시하는 감각적 표현을 택했습니다.
- source_word: וַתִּקְרְבוּ עֲצָמוֹת
  english_pob_choice: the bones came together
  chosen_korean: 뼈들이 서로 가까이 와서
  alternatives_korean:
  - 뼈들이 함께 모여
  - 뼈들이 서로 맞추어
  lexicon: HALOT
  rationale: קרב의 기본 의미인 ‘가까이 오다’를 살리면서, 뒤의 ‘뼈가 그 뼈에’와 연결되도록 결과를 자연스럽게 표현했습니다.
- source_word: עֶצֶם אֶל עַצְמוֹ
  english_pob_choice: bone to its bone
  chosen_korean: 뼈가 그 뼈에 맞붙었습니다
  alternatives_korean:
  - 뼈가 자기 뼈에
  - 뼈마다 제 짝뼈에
  lexicon: HALOT
  rationale: 히브리어의 분배적 표현을 한국어에서 그대로 복제하기보다, 각 뼈가 짝을 찾아 정확히 결합하는 의미가 드러나도록 옮겼습니다.
theological_decisions:
- issue: 예언 명령과 즉각적 순종의 연결
  chosen_reading: 에스겔이 받은 명령에 정확히 순종하여 예언하는 흐름을 분명히 드러냈습니다.
  alternative_readings:
  - 명령을 받았다고만 완곡하게 표현함
  - 예언을 일반적 말하기로 낮춤
  rationale: 본문의 핵심은 선지자의 순종과 그에 뒤따르는 기적적 반응이므로, 명령-순종의 연결을 약화하지 않도록 했습니다.
  doctrine_reference: 예언자적 소명과 순종
- issue: רַעַשׁ의 감각적 범위
  chosen_reading: ‘요란한 흔들림’으로 옮겨 소리와 진동의 겹친 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘지진’으로 한정함
  - ‘덜그럭거리는 소리’로만 한정함
  rationale: 문맥은 뼈들이 서로 결합하는 장면이므로, 지질학적 지진으로 고정하기보다 청각적·동작적 충격을 함께 드러내는 쪽이 더 본문적입니다.
  doctrine_reference: 본문 문맥 우선 원칙
