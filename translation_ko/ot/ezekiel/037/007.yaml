  source_fidelity: 개정이 필요합니다. 초안은 명령에 따른 예언과 뼈들의 접근이라는 큰 흐름은 반영하지만, 히브리어의 두 예언 표현(‘내가 예언하였다’와 ‘내가 예언할 때’)을 한 번으로 압축하고, ‘소리’와 이어지는 רַעַשׁ을 ‘요란한 흔들림’으로 옮겨 청각적 장면을 다소 흐렸습니다. 또한 ‘맞붙었습니다’는 קרב(가까이 오다)보다 결합을 더 강하게 단정합니다.
  naturalness: ‘소리가 나고 보니’는 현대 표준어 합쇼체 서술에서 연결 관계가 어색합니다. ‘소리가 났고, 보니 …’로 고치면 הִנֵּה의 현장감과 문장 흐름을 자연스럽게 살릴 수 있습니다. ‘뼈마다 제 짝 뼈에 이르렀습니다’는 분배적 표현을 이해 가능한 한국어로 전달합니다.
  terminology: ‘예언했습니다’, ‘명령받은 대로’, ‘덜그럭거리는 소리’는 현대 한국어 성경 문체에 자연스럽고 원문의 의미 범위에 맞습니다. רַעַשׁ은 여기서 지진으로 확정하지 않고, 뼈들이 움직이는 장면에 어울리는 ‘덜그럭거리는 소리’로 옮깁니다.
