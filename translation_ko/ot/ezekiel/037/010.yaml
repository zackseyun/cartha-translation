base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/010.yaml
  text: So I prophesied as he commanded me[a], and the breath entered into them, and they lived and stood on their feet, an exceedingly great army.
  footnotes:
  - marker: a
    text: Or 'the spirit entered into them.' The Hebrew word רוּחַ can mean 'breath,' 'wind,' or 'spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 내가 그가 나에게 명령하신 대로 예언하니[a], 그 숨이 그들 속으로 들어가고 그들이 살아나 자기 발로 섰습니다. 매우, 매우 큰 군대였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 영이 그들 속으로 들어갔다.’ 히브리어 רוּחַ는 ‘숨’, ‘바람’, ‘영’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנַּבֵּאתִי
  english_pob_choice: I prophesied
  chosen_korean: 내가 … 예언하니
  alternatives_korean:
  - 내가 예언했습니다
  - 내가 예언을 했습니다
  - 예언자로 말하니
  lexicon: HALOT
  rationale: 히트파엘 נבא는 여기서 에스겔의 예언 행위를 가리키므로, 동작의 결과를 서술하는 자연스러운 합쇼체로 ‘예언하니’라고 옮겼습니다.
- source_word: רוּחַ
  english_pob_choice: the breath
  chosen_korean: 그 숨
  alternatives_korean:
  - 그 영
  - 그 바람
  lexicon: HALOT
  rationale: 이 구절에서는 죽은 자들에게 생명을 불어넣는 작용이 핵심이므로 1차 본문에는 ‘숨’을 두어 생기/호흡의 뜻을 살렸습니다.
- source_word: וַיַּעַמְדוּ עַל רַגְלֵיהֶם
  english_pob_choice: stood on their feet
  chosen_korean: 자기 발로 섰습니다
  alternatives_korean:
  - 자기 다리로 섰습니다
  - 발로 서 있었습니다
  - 자기 발 위에 섰습니다
  lexicon: HALOT
  rationale: 히브리어의 직접적 이미지를 유지하면서도 한국어에서 더 자연스럽고 생동감 있게 들리는 표현으로 옮겼습니다.
- source_word: חַיִל גָּדֹול מְאֹד מְאֹד
  english_pob_choice: an exceedingly great army
  chosen_korean: 매우, 매우 큰 군대
  alternatives_korean:
  - 지극히 큰 군대
  - 매우 큰 군대
  - 대단히 큰 군대
  lexicon: HALOT
  rationale: מְאֹד의 반복을 그대로 반영해 강조를 살렸고, חַיִל은 이 환상 문맥에서 군사적 집합체로서 ‘군대’가 가장 적절합니다.
theological_decisions:
- issue: רוּחַ의 번역에서 숨/영/바람의 다의성 보존
  chosen_reading: 본문에는 ‘그 숨’을 두고, 주석에서 ‘영’ 가능성을 보존합니다.
  alternative_readings:
  - 그 영
  - 그 바람
  rationale: 문맥상 생명을 회복시키는 생기라는 뜻이 전면에 있지만, 본문 전체는 רוח의 의도적 중의성을 지니므로 한 의미로 완전히 고정하지 않고 주석으로 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
