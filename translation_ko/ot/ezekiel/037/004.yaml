  rationale: 직접 호명하는 호격이므로 한국어에서도 호격 어미 ‘-아’를 살렸고, יְבֵשׁוֹת은 ‘마른’으로 간결하게 옮겼습니다.
- source_word: דְּבַר יְהוָה
