  lexicon: HALOT
  rationale: 본문의 יְהוָה는 POB의 원어 기반 기준에 따라 ‘야훼’로 옮겼고, דָּבָר은 예언 공식에서 자연스러운 ‘말씀’으로 번역했습니다.
