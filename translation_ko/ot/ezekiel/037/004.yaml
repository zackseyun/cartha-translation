translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. “이 뼈들 위에 예언하여, 그들에게 말하십시오. ‘마른 뼈들아, 야훼의 말씀을 들으라.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 원문은 יְהוָה이며, 전통적으로는 ‘the LORD’로 옮겨졌습니다.
    reason: ot_citation
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  english_pob_choice: Then he said to me
  chosen_korean: 그가 제게 말씀하셨습니다
  alternatives_korean:
  - 그가 제게 말했습니다
  - 그가 제게 이르셨습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서, 화자와 수신자의 관계를 드러내기 위해 ‘말씀하셨습니다’를 택했습니다.
- source_word: הִנָּבֵא עַל הָעֲצָמוֹת הָאֵלֶּה
  english_pob_choice: Prophesy over these bones
  chosen_korean: 이 뼈들 위에 예언하여
  alternatives_korean:
  - 이 뼈들을 향하여 예언하여
  - 이 뼈들에 대해 예언하여
  lexicon: HALOT
  rationale: נבא의 명령형을 ‘예언하다’로 옮기고, עַל은 현장성 있는 ‘위에’로 옮겨 뼈들 자체를 향한 선포라는 장면을 살렸습니다.
- source_word: הָעֲצָמוֹת הַיְבֵשׁוֹת
  english_pob_choice: Dry bones
  chosen_korean: 마른 뼈들아
  alternatives_korean:
  - 메마른 뼈들아
  - 마른 뼈들
  lexicon: HALOT
  rationale: 직접 호명하는 호격이므로 한국어에서도 호격 어미 ‘-아’를 살렸고, יְבֵשׁוֹת은 ‘마른’으로 간결하게 옮겼습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 여호와의 말씀
  - 주님의 말씀
  lexicon: HALOT
  rationale: 본문의 יְהוָה는 POB의 원어 기반 기준에 따라 ‘야훼’로 옮겼고, דָּבָר은 예언 공식에서 자연스러운 ‘말씀’으로 번역했습니다.
theological_decisions:
- issue: 야훼의 호칭을 본문에 직접 반영할지 여부
  chosen_reading: 본문에는 ‘야훼’로 옮기고, 전통적 대체어인 ‘주’나 ‘여호와’는 쓰지 않았습니다.
  alternative_readings:
  - 주님의
  - 여호와의
  rationale: 히브리어 원문에 있는 신명 표기를 가리기보다, POB의 원어 직접 번역 원칙에 맞춰 covenant name을 드러내는 것이 더 충실합니다.
  doctrine_reference: POB terminology on יְהוָה / YHWH
