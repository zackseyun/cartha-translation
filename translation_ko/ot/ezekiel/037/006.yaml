  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּי֩ עֲלֵי/כֶ֨ם גִּדִ֜ים וְֽ/הַעֲלֵתִ֧י עֲלֵי/כֶ֣ם בָּשָׂ֗ר וְ/קָרַמְתִּ֤י עֲלֵי/כֶם֙ ע֔וֹר וְ/נָתַתִּ֥י בָ/כֶ֛ם ר֖וּחַ וִ/חְיִיתֶ֑ם וִ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/006.yaml
  text: I will put sinews on you[a], and I will bring flesh up over you, and I will cover you with skin, and I will put breath in you, and you will live. Then you will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'spirit' or 'wind'; the Hebrew word רוּחַ can carry all three senses, and Ezekiel 37 plays on that range.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 너희 위에 힘줄을 두고, 너희 위에 살을 올리고, 너희 위에 가죽을 덮고, 너희 안에 숨을 넣겠습니다. 그러면 너희가 살고, 내가 야훼인 줄 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘숨’으로 옮겼지만, 히브리어 רוּחַ는 ‘영’이나 ‘바람’도 뜻할 수 있으며, 에스겔 37장은 이 의미 범위를 의도적으로 활용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּדִים
  english_pob_choice: sinews
  chosen_korean: 힘줄
  alternatives_korean:
  - 신경
  - 건
  lexicon: HALOT
  rationale: 뼈와 살을 이어 주는 조직을 가리키므로, 의학적이면서도 자연스러운 ‘힘줄’이 적절합니다. 'sinews'의 해부학적 뉘앙스를 한국어에서 가장 무리 없이 살립니다.
- source_word: וְהַעֲלֵתִי עֲלֵיכֶם בָּשָׂר
  english_pob_choice: I will bring flesh up over you
  chosen_korean: 너희 위에 살을 올리고
  alternatives_korean:
  - 너희에게 살을 입히고
  - 너희 위에 살을 얹고
  lexicon: HALOT
  rationale: 원문의 사역형과 ‘위로 올라오게 함’의 생생한 이미지가 있으므로, 단순한 ‘붙이다’보다 ‘올리다’가 동작성을 더 잘 드러냅니다.
- source_word: וְקָרַמְתִּי עֲלֵיכֶם עוֹר
  english_pob_choice: I will cover you with skin
  chosen_korean: 너희 위에 가죽을 덮고
  alternatives_korean:
  - 너희 위에 피부를 덮고
  - 너희에게 살갗을 입히고
  lexicon: HALOT
  rationale: עור는 사람에게도 ‘가죽/피부’로 갈 수 있지만, 이 환상에서는 몸의 외피를 덧입히는 이미지가 핵심이므로 ‘덮다’를 유지했습니다. ‘가죽’은 재구성의 물질감을 살리면서도 자연스럽습니다.
- source_word: רוּחַ
  english_pob_choice: breath
  chosen_korean: 숨
  alternatives_korean:
  - 호흡
  - 영
  - 바람
  lexicon: HALOT
  rationale: 직전의 신체 재구성 뒤에 이어지는 생명 부여를 가리키므로, 여기서는 ‘숨’이 가장 직접적입니다. 다만 에스겔 37장의 רחוּ/רוּחַ 중의적 여운은 본문 전체의 해석 과제로 남겨 두었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 신명은 음역형 ‘야훼’로 옮겼습니다. 이는 영어 주석의 ‘Yahweh’와도 대응합니다.
theological_decisions:
- issue: רוּחַ의 다의성 처리
  chosen_reading: 본문에는 ‘숨’을 두되, 에스겔 37장 전체가 지닌 ‘숨/영/바람’의 중의성은 해소하지 않고 보존합니다.
  alternative_readings:
  - 영
  - 바람
  rationale: 이 절의 즉각적 문맥은 시신에 생명이 들어와 살아나는 장면이므로 생명 부여의 의미가 우선합니다. 그러나 전체 장의 상징적·신학적 긴장 때문에 다른 의미 가능성은 주석적 여지로 남겨야 합니다.
  doctrine_reference: Translation philosophy §3 (theological tension preserved)
