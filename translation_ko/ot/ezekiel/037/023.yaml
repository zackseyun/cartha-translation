source:
  edition: WLC
  text: וְ/לֹ֧א יִֽטַמְּא֣וּ ע֗וֹד בְּ/גִלּֽוּלֵי/הֶם֙ וּ/בְ/שִׁקּ֣וּצֵי/הֶ֔ם וּ/בְ/כֹ֖ל פִּשְׁעֵי/הֶ֑ם וְ/הוֹשַׁעְתִּ֣י אֹתָ֗/ם מִ/כֹּ֤ל מוֹשְׁבֹֽתֵי/הֶם֙ אֲשֶׁ֣ר חָטְא֣וּ בָ/הֶ֔ם וְ/טִהַרְתִּ֤י אוֹתָ/ם֙ וְ/הָיוּ לִ֣/י לְ/עָ֔ם וַ/אֲנִ֕י אֶהְיֶ֥ה לָ/הֶ֖ם לֵ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/023.yaml
  text: They will no longer defile themselves with their idols[a], with their detestable things, or with any of their transgressions. I will save them from all their dwelling places in which they sinned, and I will cleanse them. Then they will be my people[b], and I will be their God.
  footnotes:
  - marker: a
    text: Or 'from all their settlements where they sinned'; some understand the phrase more generally as rescue from all the places or circumstances associated with their sin.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'idols' here uses a strongly contemptuous term for false gods.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 다시는 그들의 우상들[a]과 그들의 가증한 것들과 그들의 모든 죄과로도 스스로를 더럽히지 않을 것입니다. 나는 그들이 죄를 지었던 모든 거처에서 그들을 구원하고, 그들을 정결하게 하겠습니다. 그러면 그들은 내 백성[b]이 되고, 나는 그들의 하나님이 되겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘우상들’로 번역한 히브리어 말은 거짓 신들을 매우 경멸적으로 부르는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 백성’과 ‘그들의 하나님’은 하나님과 그의 백성의 관계를 나타내는 언약 공식입니다.
    reason: source_note
lexical_decisions:
- source_word: יִטַמְּאוּ
  english_pob_choice: defile themselves
  chosen_korean: 스스로를 더럽히지 않을 것입니다
  alternatives_korean:
  - 자기를 부정하게 하지 않을 것입니다
  - 스스로 부정해지지 않을 것입니다
  lexicon: HALOT
  rationale: 히트파엘의 반사적 의미를 살려 ‘스스로를’로 옮겼고, 의례적·도덕적 오염을 함께 드러내기 위해 ‘더럽히다’를 택했습니다.
- source_word: גִּלּוּלֵיהֶם
  english_pob_choice: their idols
  chosen_korean: 우상들
  alternatives_korean:
  - 그들의 우상들
  - 똥우상들
  lexicon: HALOT
  rationale: 본문의 경멸적 어감은 살리되, 본문 주석 없이도 자연스럽게 읽히는 표준어로 ‘우상들’을 사용했습니다.
- source_word: שִׁקּוּצֵיהֶם
  english_pob_choice: their detestable things
  chosen_korean: 그들의 혐오스러운 것들
  alternatives_korean:
  - 그들의 가증한 것들
  - 그들의 역겨운 것들
  lexicon: HALOT
  rationale: ‘가증한 것들’도 가능하지만, 현대 한국어에서 의미가 선명하도록 혐오 반응을 직접 드러내는 표현을 택했습니다.
- source_word: מוֹשְׁבֹתֵיהֶם / אֲשֶׁר חָטְאוּ בָהֶם
  english_pob_choice: their dwelling places in which they sinned
  chosen_korean: 그들이 죄를 지었던 모든 거처에서
  alternatives_korean:
  - 그들이 죄를 지었던 모든 자리에서
  - 그들이 죄를 범한 모든 거주지에서
  lexicon: HALOT
  rationale: 영문 POB의 ‘dwelling places’ 해석을 따라, מקום의 이미지를 살리면서도 한국어 문맥에서 매끄럽게 읽히도록 ‘거처’로 옮겼습니다.
- source_word: וְטִהַרְתִּי
  english_pob_choice: I will cleanse them
  chosen_korean: 그들을 깨끗하게 하겠습니다
  alternatives_korean:
  - 그들을 정결하게 하겠습니다
  - 그들을 깨끗이 씻어 주겠습니다
  lexicon: HALOT
  rationale: 정결의 의례적 의미와 도덕적 새로움을 함께 담기 위해 ‘깨끗하게 하다’를 선택했습니다.
theological_decisions:
- issue: ‘거처들’의 의미 범위와 죄의 장소성
  chosen_reading: 하나님이 그들을 죄와 연결된 삶의 자리들로부터 구원해 내신 뒤 정결케 하신다는 흐름을 유지했습니다.
  alternative_readings:
  - ‘죄책들/배교들’로 의역하여 해석을 더 분명히 하는 읽기
  - 물리적 유배지나 정착지로만 좁혀 읽는 해석
  rationale: 히브리어 מוֹשְׁבֹתֵיהֶם은 장소와 삶의 터전의 뉘앙스를 모두 가질 수 있으므로, 본문의 긴장을 풀지 않고 보존하는 쪽을 택했습니다.
  doctrine_reference: 본문의 표현 범위를 지나치게 확정하지 말고, 구원-정결-언약 갱신의 순서를 유지합니다.
