  source_fidelity: 히브리어의 반사적 ‘스스로를 더럽히다’, 우상·가증한 것·죄과의 병렬, ‘거처들로부터’의 난해한 장소 표현, 정결케 하심, 그리고 언약 공식의 순서는 대체로 충실히 반영되어 있습니다. 다만 פִּשְׁעֵיהֶם의 ‘모든’ 범위가 ‘어떤’으로 약화되어 있고, 정결의 의미는 ‘깨끗하게’보다 ‘정결하게’가 더 정확합니다.
  naturalness: ‘그들의 어떤 죄과로도’는 현대 한국어에서 다소 어색합니다. ‘그들의 모든 죄과로도’가 원문의 총칭적 범위와 병렬을 자연스럽게 살립니다. ‘가증한 것들’은 본문 문맥의 종교적·도덕적 혐오를 현대 표준어의 격식 있는 성경 문체로 적절히 전달합니다.
