  - 스스로 가져가십시오
  lexicon: HALOT
  rationale: לְךָ의 자기지시적 뉘앙스를 한국어에서 자연스럽게 드러내기 위해 목적어를 동반한 ‘너를 위해’로 옮겼습니다.
- source_word: עֵץ
  english_pob_choice: stick
  chosen_korean: 막대기
  alternatives_korean:
  - 지팡이
  - 나무 조각
  - 목제 판
  lexicon: HALOT
  rationale: 이 표징 행위에서는 손에 들고 글을 쓸 수 있는 물체를 가리키므로, 현대 한국어에서 가장 무난한 ‘막대기’를 본문에 두었습니다.
- source_word: חֲבֵרָיו
  english_pob_choice: his companions
  chosen_korean: 그와 함께한 이들
  alternatives_korean:
  - 그의 동료들
  - 그의 동맹들
  - 그의 연합한 자들
  lexicon: HALOT
  rationale: 관계적 결속을 나타내는 표현이므로, 단순 명사화보다 ‘함께한’으로 원문의 결속 의미를 살렸습니다.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  english_pob_choice: all the house of Israel
  chosen_korean: 온 이스라엘 집
  alternatives_korean:
  - 이스라엘의 온 집
  - 이스라엘 온 집안
  - 이스라엘의 모든 집
  lexicon: HALOT
  rationale: 예언서의 관용구 ‘이스라엘 집’을 보존하되, 전체성을 드러내기 위해 ‘온’을 앞에 두었습니다.
theological_decisions:
- issue: 유다와 요셉/에브라임의 이중 표지 유지
  chosen_reading: 본문의 두 막대기는 유다와 요셉/에브라임을 서로 구분되는 두 집단으로 표지하며, 이를 합쳐질 표징으로 제시합니다.
  alternative_readings:
  - 요셉과 에브라임을 단순한 중복 표현으로 처리함
  - ‘이스라엘 자손들’과 ‘이스라엘 집’을 모두 그냥 ‘이스라엘 사람들’로 평준화함
  rationale: 원문은 역사적 분열 왕국의 대비를 의도적으로 보존하므로, 한국어도 그 긴장을 흐리지 않도록 구분을 유지했습니다.
  doctrine_reference: 예언적 표징행위의 문자-상징 병행
