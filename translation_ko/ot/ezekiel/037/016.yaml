revisions:
- from: 그리고 너, 인자야, 너를 위해 한 막대기를 가져다가 그 위에 「유다와 그와 함께한 이스라엘 자손들」이라고 쓰고, 또 한 막대기를 가져다가 그 위에 「요셉—에브라임의 막대기와 그와 함께한 온 이스라엘 집」이라고 쓰십시오.[a][b][c]
  to: 인자여, 당신은 자신을 위하여 막대기 하나를 가져다가 그 위에 「유다와 그의 동료인 이스라엘 자손들을 위하여[a]」라고 쓰십시오. 또 막대기 하나[c]를 가져다가 그 위에 「요셉을 위하여, 곧 에브라임의 막대기와 그의 동료인 온 이스라엘 집을 위하여[b]」라고 쓰십시오.
  rationale: 수정문은 두 막대기 각각에 기록할 문구를 명확한 인용으로 유지하고, לְ의 표지·귀속 기능을 ‘…을 위하여’로 일관되게 나타냅니다. חֲבֵרָיו는 양쪽 표지에서 해당 집단에 속하거나 연합한 이들을 가리키므로 ‘그의 동료인’으로 옮겨, 요셉/에브라임 및 이스라엘 집의 구별을 흐리지 않았습니다. ‘곧’은 요셉과 ‘에브라임의 막대기’의 동격 관계를 한국어에서 자연스럽게 표시할 뿐, 추가 해석을 도입하지 않습니다.
