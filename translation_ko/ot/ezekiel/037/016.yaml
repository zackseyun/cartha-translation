source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם קַח לְ/ךָ֙ עֵ֣ץ אֶחָ֔ד וּ/כְתֹ֤ב עָלָי/ו֙ לִֽ/יהוּדָ֔ה וְ/לִ/בְנֵ֥י יִשְׂרָאֵ֖ל חבר/ו וּ/לְקַח֙ עֵ֣ץ אֶחָ֔ד וּ/כְת֣וֹב עָלָ֗י/ו לְ/יוֹסֵף֙ עֵ֣ץ אֶפְרַ֔יִם וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל חבר/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/016.yaml
  text: And you[a], son of man, take for yourself one stick and write on it, ‘For Judah and for the sons of Israel, his companions.’ Then take one stick and write on it, ‘For Joseph, the stick of Ephraim, and all the house of Israel[c][b], his companions.’
  footnotes:
  - marker: a
    text: Or 'the children of Israel.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his associates,' 'those joined with him,' or 'his allies.'
    reason: lexical_alternative
  - marker: c
    text: '''Stick'' could also be rendered ''piece of wood'' or, more interpretively, ''wooden tablet.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 인자여, 당신은 자신을 위하여 막대기 하나를 가져다가 그 위에 「유다와 그의 동료인 이스라엘 자손들을 위하여[a]」라고 쓰십시오. 또 막대기 하나[c]를 가져다가 그 위에 「요셉을 위하여, 곧 에브라임의 막대기와 그의 동료인 온 이스라엘 집을 위하여[b]」라고 쓰십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 아들들’. 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 동료들’, ‘그와 연합한 자들’, 혹은 ‘그의 동맹들’.
    reason: lexical_alternative
  - marker: c
    text: ‘막대기’는 ‘나무 조각’ 또는 좀 더 해석적으로 ‘나무 판’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
