source:
  edition: WLC
  text: וְ/עָשִׂ֣יתִי אֹ֠תָ/ם לְ/ג֨וֹי אֶחָ֤ד בָּ/אָ֨רֶץ֙ בְּ/הָרֵ֣י יִשְׂרָאֵ֔ל וּ/מֶ֧לֶךְ אֶחָ֛ד יִֽהְיֶ֥ה לְ/כֻלָּ֖/ם לְ/מֶ֑לֶךְ וְ/לֹ֤א יהיה עוֹד֙ לִ/שְׁנֵ֣י גוֹיִ֔ם וְ/לֹ֨א יֵחָ֥צוּ ע֛וֹד לִ/שְׁתֵּ֥י מַמְלָכ֖וֹת עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/022.yaml
  text: And I will make them one nation in the land[a], on the mountains of Israel, and one king will be king over all of them. They will no longer be two nations[b], and they will no longer be divided into two kingdoms.
  footnotes:
  - marker: a
    text: Or, 'in the hill country of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew, 'and one king will be for all of them as king,' with repetition for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 이 땅, 곧 이스라엘의 산들에서 하나의 민족으로 만들 것이며, 한 왕이 그들 모두의 왕이 될 것입니다. 그들은 더 이상 두 민족이 되지 않을 것이며, 더 이상 두 왕국으로 나뉘지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 산지에서’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그리고 한 왕이 그들 모두를 위해 왕이 될 것이다’라는 반복으로 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי אֹתָם לְגוֹי אֶחָד
  english_pob_choice: And I will make them one nation
  chosen_korean: 내가 그들을 … 하나의 민족으로 만들 것이며
  alternatives_korean:
  - 내가 그들을 하나의 나라로 만들 것이며
  - 내가 그들을 하나의 백성으로 만들 것이며
  lexicon: HALOT
  rationale: עשה + לְ는 ‘~로 만들다’의 구성을 살리는 것이 자연스럽고, גוי는 여기서 뒤의 ‘두 민족’과 대응되므로 ‘민족’으로 일관되게 옮겼습니다.
- source_word: בָּאָרֶץ בְּהָרֵי יִשְׂרָאֵל
  english_pob_choice: in the land, on the mountains of Israel
  chosen_korean: 이 땅, 곧 이스라엘의 산들에서
  alternatives_korean:
  - 이 땅, 곧 이스라엘의 산지에서
  - 그 땅, 곧 이스라엘의 산지에서
  lexicon: HALOT
  rationale: הָאָרֶץ는 이스라엘에 약속된 특정 땅을 가리키는 문맥이므로 ‘이 땅’으로 두고, בְּהָרֵי יִשְׂרָאֵל은 직역성을 살려 ‘이스라엘의 산들’로 옮겼습니다.
- source_word: וּמֶלֶךְ אֶחָד יִהְיֶה לְכֻלָּם לְמֶלֶךְ
  english_pob_choice: and one king will be king over all of them
  chosen_korean: 한 왕이 그들 모두의 왕이 될 것입니다
  alternatives_korean:
  - 한 왕이 그들 모두를 다스릴 것입니다
  - 한 왕이 그들 모두의 통치자가 될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘왕’ 반복을 살려 단순히 ‘다스리다’로 풀기보다 ‘왕이 될 것입니다’로 유지해 강조를 보존했습니다.
- source_word: וְלֹא יִהְיֶה עוֹד לִשְׁנֵי גוֹיִם וְלֹא יֵחָצוּ עוֹד לִשְׁתֵּי מַמְלָכוֹת
  english_pob_choice: They will no longer be two nations, and they will no longer be divided into two kingdoms
  chosen_korean: 그들은 더 이상 두 민족이 되지 않을 것이며, 더 이상 두 왕국으로 나뉘지 않을 것입니다
  alternatives_korean:
  - 그들은 다시는 두 민족이 되지 않을 것이며, 다시는 두 왕국으로 갈라지지 않을 것입니다
  - 그들은 더 이상 두 나라가 되지 않을 것이며, 더 이상 두 왕국으로 분열되지 않을 것입니다
  lexicon: HALOT
  rationale: עוֹד의 반복은 지속적인 부정을 나타내므로 ‘더 이상’으로 자연스럽게 옮겼고, נַחְלָצוּ/חָצָה의 수동적 의미는 ‘나뉘다’로 표현했습니다.
theological_decisions:
- issue: 이 예언의 통일과 왕권을 메시아적으로 명시할지 여부
  chosen_reading: 본문 자체의 표현대로 민족의 통일과 한 왕의 통치를 직접적으로 제시하고, 메시아 해석은 본문 밖에서 열어 둡니다.
  alternative_readings:
  - 주석적 메시아 표현을 본문에 반영함
  - 상징적·영적 통일로만 완화함
  rationale: 이 구절은 나라, 땅, 왕권을 직접 말하지만 여기서는 그 왕을 메시아로 명명하지 않으므로, 즉각적 예언 문장을 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 예언 본문의 즉시 문맥과 더 넓은 정경적 해석을 구분함
