revisions:
- from: 그때 너희는 내가 너희의 무덤들을 열고 너희를 너희의 무덤들에서 올라오게 할 때, 내가 야훼인 줄 알게 될 것입니다. 오 내 백성아.[a][b]
  to: 그때 너희는 내가 너희의 무덤들을 열고 너희를 너희의 무덤들에서 끌어올릴 때, 내가 야훼[a]임을 알게 될 것입니다, 내 백성아.[b]
  rationale: 히브리어의 시간적 בְּ + 부정사구와 הִפְעִיל 사역 의미를 유지하되, 한국어 문장을 자연스럽게 다듬었습니다. ‘야훼’ 뒤에 각주 a를 배치하고 그 대안을 ‘주님’으로 바로잡았으며, 동사 관련 각주 b는 ‘끌어올릴 때’ 뒤에 배치했습니다. 무덤을 열고 끌어올리는 표현은 비유적 회복과 부활적 이미지 사이의 긴장을 해석으로 좁히지 않고 그대로 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:44:38Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하지만, ‘올라오게 하다’는 이 문맥에서 다소 부자연스럽고, 야훼에 붙은 각주 a의 대안 표현이 원문의 신명 대체어를 정확히 반영하지 못합니다.
  naturalness: ‘너희를 너희의 무덤들에서 끌어올릴 때’가 히브리어의 사역적 상승 이미지를 보존하면서 현대 표준 한국어로 더 자연스럽습니다. 호격은 한국어 관습에 맞게 ‘내 백성아’로 두는 것이 자연스럽습니다.
  terminology: יהוה는 프로젝트 방침에 따라 ‘야훼’로 유지합니다. 대안 각주는 ‘주님’으로 제시하여 영어 audit trail의 ‘the LORD’ 대안을 적절히 반영합니다. קבר는 ‘무덤들’, עמי는 ‘내 백성아’로 유지합니다.
  issues:
  - severity: medium
    issue: 각주 a의 내용이 ‘야훼’의 대안 번역을 정확히 제시하지 않습니다.
    rationale: ‘또는 내가 주인 줄’은 ‘주인’(owner/master)으로 읽히며, 영어 audit trail의 ‘the LORD’ 및 신명 대체어에 해당하지 않습니다. ‘주님’이라는 명칭 대안을 제시해야 합니다.
  - severity: low
