    rationale: העלה 히필의 사역 의미는 보존되지만, 무덤에서 사람을 나오게 하는 장면에서는 ‘끌어올리다’가 더 자연스럽고 직접적입니다.
  - severity: low
    issue: 각주 표지가 해당 어휘 바로 뒤에 놓이지 않았습니다.
    rationale: a는 ‘야훼’의 대안이고 b는 ‘끌어올리다’의 대안이므로, 각주 표지를 각각 해당 표현 직후에 두어 참조 관계를 분명히 하는 편이 좋습니다.
