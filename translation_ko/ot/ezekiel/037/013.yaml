id: EZK.37.13
reference: Ezekiel 37:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֣י יְהוָ֑ה בְּ/פִתְחִ֣/י אֶת קִבְרֽוֹתֵי/כֶ֗ם וּ/בְ/הַעֲלוֹתִ֥/י אֶתְ/כֶ֛ם מִ/קִּבְרוֹתֵי/כֶ֖ם עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/013.yaml
  text: Then you will know that I am Yahweh[a], when I open your graves and bring you up from your graves[b], O my people.
  footnotes:
  - marker: a
    text: Or 'And you will know that I am the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and raise you up from your graves.' The Hebrew verb literally means 'cause to go up' or 'bring up.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 너희는 내가 너희의 무덤들을 열고 너희를 너희의 무덤들에서 끌어올릴 때, 내가 야훼[a]임을 알게 될 것입니다, 내 백성아.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희를 너희의 무덤들에서 일으켜 올릴 때’입니다. 히브리어 동사는 문자적으로 ‘위로 올라가게 하다’ 또는 ‘끌어올리다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  english_pob_choice: Then you will know
  chosen_korean: 그때 너희는 … 알게 될 것입니다
  alternatives_korean:
  - 그러면 너희는 … 알게 됩니다
  - 그때 너희는 … 알게 됩니다
  lexicon: HALOT
  rationale: 예언 문맥의 결과/귀결을 살려 ‘그때’를 두고, עתיד적 인식을 ‘알게 될 것입니다’로 자연스럽게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기적 고유명사를 ‘야훼’로 옮겨, 본문의 인칭적 신명성을 보존했습니다.
- source_word: קִבְרוֹתֵיכֶם / מִקִּבְרוֹתֵיכֶם
  english_pob_choice: your graves / from your graves
  chosen_korean: 너희의 무덤들 / 너희의 무덤들에서
  alternatives_korean:
  - 너희 무덤들
  - 너희 묘실들
  lexicon: HALOT
  rationale: קבר의 가장 직접적인 의미를 따라 ‘무덤들’로 옮기고, מן의 출발점을 ‘-에서’로 반영했습니다.
- source_word: וּבְהַעֲלוֹתִי
  english_pob_choice: and bring you up
  chosen_korean: 너희를 … 올라오게 할 때
  alternatives_korean:
  - 너희를 … 데리고 올라올 때
  - 너희를 … 끌어올릴 때
  lexicon: HALOT
  rationale: 히필 עלה의 ‘위로 올라오게 하다’라는 사역 의미를 살리되, 한국어에서는 ‘올라오게 하다’가 가장 सीधे하고 본문 이미지에 충실합니다.
- source_word: עַמִּי
  english_pob_choice: O my people
  chosen_korean: 오 내 백성아
  alternatives_korean:
  - 내 백성아
  - 오 내 백성이여
  lexicon: HALOT
  rationale: Pob의 갱신된 호격을 반영해 ‘오’를 살렸고, עַמִּי의 호격을 한국어 호소형 ‘내 백성아’로 옮겼습니다.
theological_decisions:
- issue: ‘무덤들을 열다’와 ‘무덤들에서 올라오게 하다’의 이미지가 비유적 회복인지, 실제 부활 언어인지
  chosen_reading: 주석적 해석으로 좁히지 않고, 무덤-상승 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 포로 귀환의 은유로만 완화해서 번역하기
  - 장차의 육체적 부활로 명시적으로 풀어 번역하기
  rationale: 히브리어가 의도적으로 강한 죽음-생명 이미지를 쓰므로, 번역문은 신학적 긴장을 보존해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
