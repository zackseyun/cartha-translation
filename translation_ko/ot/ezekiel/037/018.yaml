    rationale: 원문은 ‘우리에게 말해 주지 않겠느냐, 이것들이 네게 무엇인지?’의 순서입니다. ‘이것들이 당신에게 무엇을 뜻하는지 우리에게 말해 주시겠습니까?’는 의미를 명료하게 하면서도 ‘네게’라는 수신자 지향성을 유지합니다.
