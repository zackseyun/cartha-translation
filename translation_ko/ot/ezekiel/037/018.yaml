id: EZK.37.18
reference: Ezekiel 37:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כַֽ/אֲשֶׁר֙ יֹאמְר֣וּ אֵלֶ֔י/ךָ בְּנֵ֥י עַמְּ/ךָ֖ לֵ/אמֹ֑ר הֲ/לֽוֹא תַגִּ֥יד לָ֖/נוּ מָה אֵ֥לֶּה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/018.yaml
  text: And when the sons of your people say to you[a], ‘Will you not tell us what these things are to you?’
  footnotes:
  - marker: a
    text: Literally, 'what are these to you?' The Hebrew idiom asks about the significance of Ezekiel's symbolic action.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네 백성의 아들들이 네게 이렇게 말할 때, 「이것들이 당신에게 무엇을 뜻하는지 우리에게 말해 주시겠습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이것들이 당신에게 무엇입니까?’라고 합니다. 이는 에스겔의 상징 행위가 지닌 의미를 묻는 관용적 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: וְכַאֲשֶׁר
  english_pob_choice: And when
  chosen_korean: 그리고 …할 때
  alternatives_korean:
  - 그리고 …하면
  - 그리고 …할 때에
  lexicon: HALOT
  rationale: 연결사와 시간 절을 자연스럽게 살리되, 예언 행위의 다음 단계로 이어지는 흐름을 현대 한국어로 매끄럽게 옮겼습니다.
- source_word: בְּנֵי עַמְּךָ
  english_pob_choice: the sons of your people
  chosen_korean: 네 백성의 자손들
  alternatives_korean:
  - 당신의 백성
  - 네 백성의 아들들
  - 네 백성 가운데 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표현을 지우지 않고 살리면서도, 한국어에서는 가장 자연스러운 ‘자손들’로 옮겼습니다.
- source_word: הֲלוֹא תַגִּיד לָנוּ
  english_pob_choice: Will you not tell us
  chosen_korean: 우리에게 말하지 않으시겠습니까?
  alternatives_korean:
  - 우리에게 알려 주지 않으시겠습니까?
  - 우리에게 말씀해 주시지 않겠습니까?
  lexicon: HALOT
  rationale: 히필의 ‘알리다/말하다’ 의미를 따라, 단순한 ‘묻다’보다 원문의 직접적 요청을 살리는 ‘말하다’로 옮겼습니다.
- source_word: מָה אֵלֶּה לָּךְ
  english_pob_choice: what these things are to you
  chosen_korean: 이것들이 당신에게 무엇입니까?
  alternatives_korean:
  - 이것들이 당신에게 어떤 것입니까?
  - 이것들이 당신에게 무슨 뜻입니까?
  - 이것들이 당신에게 무엇을 의미합니까?
  lexicon: HALOT
  rationale: 직역형 관용구인 ‘무엇입니까?’를 택해, 상징 행위의 의미를 묻는 히브리어 관용을 가능한 한 그대로 드러냈습니다.
theological_decisions:
- issue: 상징 행위의 의미를 묻는 관용구 처리
  chosen_reading: ‘이것들이 당신에게 무엇입니까?’로 직역하여 상징의 뜻을 묻는 뉘앙스를 본문 안에서 유지했습니다.
  alternative_readings:
  - ‘이것들이 당신에게 무슨 뜻입니까?’
  - ‘이것들이 당신에게 무엇을 의미합니까?’
  rationale: 히브리어는 문자적으로 ‘이것들이 당신에게 무엇인가?’라는 관용적 질문이므로, 해설을 덧붙이기보다 본문이 스스로 상징의 의미를 묻게 하는 구조를 살렸습니다.
  doctrine_reference: 성경 본문 해석의 문맥 우선 원칙
- issue: ‘당신’ 호칭의 유지
  chosen_reading: 예언자에게 직접 말하는 장면이므로 2인칭 정중 호칭 ‘당신’을 유지했습니다.
  alternative_readings:
  - 네
  - 선생님
  - 귀하
  rationale: 합쇼체 서술 안에서 직접 대화의 대상이 명확히 드러나도록 하면서도, 현대 한국어 성경체의 공적 문체를 유지합니다.
  doctrine_reference: 번역 문체 일관성
