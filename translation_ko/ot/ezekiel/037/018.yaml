  source_fidelity: 히브리어의 시간 연결(‘그리고 …할 때’), 발화자(‘네 백성의 아들들’), 수사 의문, 그리고 ‘이것들이 네게 무엇인가’라는 관용적 표현을 보존했습니다. 본문에서는 한국어로 자연스럽게 그 관용의 의미를 드러내되, 각주에서 문자적 표현을 밝혔습니다.
  naturalness: 초안의 ‘네 백성의 자손들’은 해당 공동체의 후손이라는 뜻으로도 읽혀 בְּנֵי עַמְּךָ의 ‘아들들’을 충분히 반영하지 못합니다. 또한 ‘이것들이 당신에게 무엇입니까?’는 현대 한국어에서 질문의 의도가 지나치게 불명확합니다. 발화 순서를 원문과 같이 하고 ‘무엇을 뜻하는지’로 옮기면 자연스럽습니다.
  terminology: 합쇼체 직접 발화에는 ‘말해 주시겠습니까?’를 사용했습니다. 하나님이 에스겔에게 하시는 서술적 발화 안의 2인칭은 성경 문체상 ‘네게’를 유지하고, 인물들이 에스겔에게 하는 인용문에서는 정중한 ‘당신에게’를 유지했습니다.
