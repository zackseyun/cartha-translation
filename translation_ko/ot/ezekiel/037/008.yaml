reference: Ezekiel 37:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָאִ֜יתִי וְ/הִנֵּֽה עֲלֵי/הֶ֤ם גִּדִים֙ וּ/בָשָׂ֣ר עָלָ֔ה וַ/יִּקְרַ֧ם עֲלֵי/הֶ֛ם ע֖וֹר מִ/לְ/מָ֑עְלָ/ה וְ/ר֖וּחַ אֵ֥ין בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/008.yaml
  text: And I looked[a], and behold, there were sinews on them, and flesh had come up, and skin covered them from above; but there was no breath in them.
  footnotes:
  - marker: a
    text: Hebrew ruach can mean 'breath,' 'wind,' or 'spirit.' Here 'breath' fits the lifeless bodies, but the wider passage plays on all three senses.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 보니 그들 위에 힘줄이 생겼고, 살이 올라왔으며, 피부가 그들의 겉을 덮었습니다. 그러나 그들 안에는 숨[a]이 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רוּחַ는 ‘숨’, ‘바람’, ‘영’으로 모두 번역될 수 있습니다. 여기서는 생명 없는 몸들에 대한 묘사이므로 ‘숨’이 가장 잘 맞지만, 본문의 더 넓은 문맥은 이 세 의미를 함께 활용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי
  english_pob_choice: And I looked
  chosen_korean: 내가 보니
  alternatives_korean:
  - 내가 보았습니다
  - 내가 보니
  lexicon: HALOT
  rationale: 예언적 환상 속 관찰 행위를 자연스럽게 드러내면서, 이어지는 장면 전환의 즉시성을 살리기 위해 ‘내가 보니’를 택했습니다.
- source_word: גִּדִים
  english_pob_choice: sinews
  chosen_korean: 힘줄
  alternatives_korean:
  - 근육
  - 건
  lexicon: HALOT
  rationale: 시신이 다시 형성되는 환상적 묘사에서 גידים는 해부학적으로 ‘힘줄’이 가장 직관적이고 한국어 성경 문맥에도 잘 맞습니다.
- source_word: וּבָשָׂר עָלָה
  english_pob_choice: and flesh had come up
  chosen_korean: 살이 올라오며
  alternatives_korean:
  - 살이 올라왔으며
  - 살이 생기며
  lexicon: HALOT
  rationale: עלה의 ‘올라오다/자라나다’ 이미지를 살려, 뼈 위로 조직이 덧입혀지는 과정을 자연스러운 한국어로 옮겼습니다.
- source_word: וַיִּקְרַם עֲלֵיהֶם עוֹר מִלְמָעְלָה
  english_pob_choice: and skin covered them from above
  chosen_korean: 그 위를 피부가 덮었습니다
  alternatives_korean:
  - 그 위를 피부가 덮었습니다
  - 위에서 피부가 덮였습니다
  lexicon: HALOT
  rationale: קרם의 ‘겉을 덮어 층을 이루다’는 뜻을 한국어 동사 ‘덮다’로 옮기되, מִלְמָעְלָה는 문맥상 이미 드러나는 외부/윗면의 방향성을 과도하게 풀지 않고 생략 가능한 범위로 처리했습니다.
- source_word: וְרוּחַ אֵין בָּהֶם
  english_pob_choice: but there was no breath in them
  chosen_korean: 그러나 그들 안에는 숨이 없었습니다
  alternatives_korean:
  - 그러나 그들 안에는 호흡이 없었습니다
  - 그러나 그들 안에는 영이 없었습니다
  lexicon: HALOT
  rationale: 이 장면의 즉각적 의미는 생명이 없는 몸이므로 ‘숨’이 가장 자연스럽습니다. 다만 רוּחַ의 의미 범위(숨/바람/영)는 본문 전체에서 유지되는 긴장으로 남겨 두었습니다.
theological_decisions:
- issue: רוּחַ의 중의성 보존
  chosen_reading: 본절에서는 ‘숨’으로 번역하되, 문맥 전체의 생기 부여/영의 의미 가능성을 지우지 않습니다.
  alternative_readings:
  - 영
  - 바람
  rationale: 마른 뼈 환상은 육체의 재형성과 무생명 상태를 먼저 보여 주므로 본절의 직역적 기능은 ‘숨’이 가장 분명합니다. 그러나 에스겔 37장은 의도적으로 숨, 바람, 영의 겹침을 활용하므로 그 신학적 긴장은 보존해야 합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
