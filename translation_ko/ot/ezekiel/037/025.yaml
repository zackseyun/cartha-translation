source:
  edition: WLC
  text: וְ/יָשְׁב֣וּ עַל הָ/אָ֗רֶץ אֲשֶׁ֤ר נָתַ֨תִּי֙ לְ/עַבְדִּ֣/י לְ/יַֽעֲקֹ֔ב אֲשֶׁ֥ר יָֽשְׁבוּ בָ֖/הּ אֲבֽוֹתֵי/כֶ֑ם וְ/יָשְׁב֣וּ עָלֶ֡י/הָ הֵ֠מָּה וּ/בְנֵי/הֶ֞ם וּ/בְנֵ֤י בְנֵי/הֶם֙ עַד עוֹלָ֔ם וְ/דָוִ֣ד עַבְדִּ֔/י נָשִׂ֥יא לָ/הֶ֖ם לְ/עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/025.yaml
  text: They will dwell in the land that I gave to my servant Jacob[a], where your fathers dwelt; and they will dwell on it, they and their sons and their sons' sons, forever[c][b]. And David my servant will be prince for them forever.
  footnotes:
  - marker: a
    text: Or 'your ancestors.' The Hebrew reads 'your fathers.'
    reason: lexical_alternative
  - marker: b
    text: '''David'' may refer to the promised Davidic ruler; the text does not specify whether this is to be taken as the historical David restored or as a future Davidic figure.'
    reason: alternative_reading
  - marker: c
    text: Or 'leader' or 'ruler.' The Hebrew term is 'prince,' not 'king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내가 내 종 야곱에게 준 땅, 곧 너희 조상들이[a] 살던 땅에 살 것입니다. 그들과 그들의 아들들과 그 아들들의 아들들이 영원히 그 땅에서 살 것이며, 내 종 다윗은 그들을 위한 통치자가[c] 영원히 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너희 아버지들’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다윗’은 역사적 다윗의 회복, 다윗계 통치자, 또는 메시아적 인물을 가리킬 수 있습니다. 본문은 그 정체를 명시하지 않습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 נָשִׂיא는 ‘왕’이 아니라 통치적 지위를 가리키는 말이며, ‘통치자’ 또는 ‘지도자’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבוּ / עַל הָאָרֶץ
  english_pob_choice: They will dwell in the land
  chosen_korean: 그들은 … 땅에 살 것입니다
  alternatives_korean:
  - 그들은 … 땅에 거할 것입니다
  - 그들은 … 땅에 거주할 것입니다
  lexicon: HALOT
  rationale: ישב는 정착하여 사는 뜻이므로 ‘살다’로 자연스럽게 옮기되, 약속의 땅이라는 문맥은 그대로 유지했습니다.
- source_word: לְעַבְדִּי לְיַעֲקֹב
  english_pob_choice: to my servant Jacob
  chosen_korean: 내 종 야곱에게
  alternatives_korean:
  - 내 종 야곱을 위해
  - 내 종 야곱에게
  lexicon: HALOT
  rationale: ל는 כאן 수여 대상을 나타내므로 ‘에게’가 가장 직접적이며, ‘내 종’은 언약적 호칭을 보존합니다.
- source_word: אֲבוֹתֵיכֶם
  english_pob_choice: your fathers
  chosen_korean: 너희 조상들이
  alternatives_korean:
  - 너희 아버지들이
  - 너희 선조들이
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘너희 아버지들’이지만, 한국어에서는 문맥상 대표적 조상 전체를 가리키는 ‘조상들’이 자연스럽고 의미도 잘 전달됩니다.
- source_word: הֵמָּה וּבְנֵיהֶם וּבְנֵי בְנֵיהֶם
  english_pob_choice: they and their sons and their sons' sons
  chosen_korean: 그들과 그들의 아들들과 그들의 손자들이
  alternatives_korean:
  - 그들과 그들의 아들들과 그들의 아들들의 아들들이
  - 그들과 그들의 자녀들과 그들의 손주들이
  lexicon: HALOT
  rationale: ‘sons / sons’ sons’를 그대로 반영해 세대 계승의 반복을 살렸습니다. ‘손자들’은 현대 한국어에서 이해하기 쉽습니다.
- source_word: נָשִׂיא
  english_pob_choice: prince
  chosen_korean: 지도자가
  alternatives_korean:
  - 통치자가
  - 군왕이
  - 왕자가
  lexicon: HALOT
  rationale: 이 단어는 왕(מֶלֶךְ)이 아니라 특정한 통치적 지위를 가리키므로, 본문 문맥에서 자연스럽고 과도한 왕정화를 피하는 ‘지도자’로 옮겼습니다.
theological_decisions:
- issue: ‘David my servant’의 지칭 범위
  chosen_reading: 본문의 ‘다윗’을 그대로 두고, 역사적 다윗인지 다윗 계열 통치자인지 해석을 본문 안에서 결정하지 않았습니다.
  alternative_readings:
  - 부활한 역사적 다윗
  - 미래의 다윗계 메시아적 통치자
  rationale: 히브리어는 פשוט하게 ‘다윗’이라고 말할 뿐이므로, 번역문이 그 정체를 미리 확정하지 않도록 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: נָשִׂיא의 위상
  chosen_reading: ‘지도자’로 옮겨 왕이라는 표현은 피했습니다.
  alternative_readings:
  - 통치자
  - 왕
  - 군왕
  rationale: 에스겔은 의도적으로 왕(מֶלֶךְ)이 아니라 נשיא를 사용하므로, 한국어도 그 구별을 유지해야 합니다.
  doctrine_reference: Keep lexical distinction from מֶלֶךְ.
