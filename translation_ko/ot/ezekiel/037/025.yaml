  to: 그들은 내가 내 종 야곱에게 준 땅, 곧 너희 조상들이[a] 살던 땅에 살 것입니다. 그들과 그들의 아들들과 그 아들들의 아들들이 영원히 그 땅에서 살 것이며, 내 종 다윗은 그들을 위한 통치자가[c] 영원히 될 것입니다.[b]
