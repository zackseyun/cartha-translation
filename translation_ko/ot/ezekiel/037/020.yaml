  text: וְ/הָי֨וּ הָ/עֵצִ֜ים אֲֽשֶׁר תִּכְתֹּ֧ב עֲלֵי/הֶ֛ם בְּ/יָדְ/ךָ֖ לְ/עֵינֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/020.yaml
  text: And the sticks on which you write will be in your hand before their eyes[a].
  footnotes:
  - marker: a
    text: Or “the pieces of wood.” The Hebrew term can refer more broadly to wood, but in this sign-act context it denotes the sticks Ezekiel is holding and inscribing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네가 그 위에 쓸 나무 조각들은 네 손에 들고 그들의 눈앞에 두십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나무 조각들”입니다. 히브리어는 더 넓게는 나무를 가리킬 수 있지만, 이 표징 행위의 문맥에서는 에스겔이 들고 글을 새기는 막대기들을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵצִים
  english_pob_choice: the sticks
  chosen_korean: 나무 조각들
  alternatives_korean:
  - 막대기들
  - 나뭇조각들
  - 나무들
  lexicon: HALOT
  rationale: 문맥상 에스겔이 들고 쓰는 표징용 물건이므로 단순한 ‘나무’보다 더 구체적이면서도 ‘sticks’의 물질성을 살리는 표현이 적절합니다.
- source_word: תִּכְתֹּב עֲלֵיהֶם
  english_pob_choice: on which you write
  chosen_korean: 그 위에 쓸
  alternatives_korean:
  - 그 위에 기록할
  - 그것들 위에 쓸
  - 그 위에 적을
  lexicon: HALOT
  rationale: ‘쓰다’가 글자를 새기거나 기록하는 행위를 폭넓게 포함하므로, 표징 행위의 직접성을 유지하는 ‘쓸’이 가장 자연스럽습니다.
- source_word: בְּיָדְךָ
  english_pob_choice: in your hand
  chosen_korean: 네 손에 들고
  alternatives_korean:
  - 네 손 안에
  - 네 손에
  - 네 손에 쥐고
  lexicon: HALOT
  rationale: 히브리어는 소유보다 실제로 손에 들고 있는 상태를 가리키므로, 한국어에서는 ‘들고’로 그 구체성을 드러냈습니다.
- source_word: לְעֵינֵיהֶם
  english_pob_choice: before their eyes
  chosen_korean: 그들의 눈앞에
  alternatives_korean:
  - 그들 앞에
  - 그들이 보는 데에
  - 그들 눈에 보이게
  lexicon: HALOT
  rationale: 직역에 가까운 ‘눈앞에’가 공개적으로 보이는 표징 행위의 생생함을 살리며, 영어 POB의 ‘before their eyes’도 그대로 반영합니다.
theological_decisions:
- issue: 명령형/예언적 지시의 어조
  chosen_reading: 문장의 지시성을 살려 공손한 명령형 ‘십시오’로 옮겼습니다.
  alternative_readings:
  - 평서형 ‘...있을 것입니다’
  - 명령형 ‘...하라’
  rationale: 이 절은 예언자가 수행할 표징 행동에 대한 지시이므로, 현대 표준어 합쇼체의 직접 지시를 유지하는 편이 원문의 기능에 가장 가깝습니다.
  doctrine_reference: 예언적 표징 행위의 서술 기능
