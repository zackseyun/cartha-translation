  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י הִנָּבֵ֖א אֶל הָ/ר֑וּחַ הִנָּבֵ֣א בֶן אָ֠דָם וְ/אָמַרְתָּ֨ אֶל הָ/ר֜וּחַ כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה מֵ/אַרְבַּ֤ע רוּחוֹת֙ בֹּ֣אִי הָ/ר֔וּחַ וּ/פְחִ֛י בַּ/הֲרוּגִ֥ים הָ/אֵ֖לֶּה וְ/יִֽחְיֽוּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/009.yaml
  text: 'Then he said to me[a], “Prophesy to the breath; prophesy, son of man, and say to the breath, ‘Thus says the Lord GOD: Come from the four winds, O breath, and breathe on these slain, so that they may live.’”'
  footnotes:
  - marker: a
    text: Hebrew רוּחַ can mean breath, wind, or spirit. Here it is rendered 'breath' in the singular and 'winds' in 'the four winds'; alternatively, 'spirit' could be understood, preserving the vision's layered imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. “너는 숨결[a]을 향하여 예언하십시오. 사람아, 예언하고 숨결에게 말하십시오. ‘주 하나님께서 이렇게 말씀하십니다. 숨결아, 네 바람에서 오십시오. 이 죽임당한 자들 위에 불어 그들이 살게 하십시오.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רוּחַ는 ‘숨결’, ‘바람’, 또는 ‘영’을 뜻할 수 있습니다. 여기서 단수형은 문맥에 따라 ‘숨결’로, ‘네 바람’은 네 방향에서 부는 바람으로 옮겼습니다. ‘영’의 의미도 이 환상의 다층적 이미지 안에서 가능할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּבֵא
  english_pob_choice: Prophesy
  chosen_korean: 예언하여라 / 예언하라
  alternatives_korean:
  - 예언해라
  - 예언을 선포하여라
  lexicon: HALOT
  rationale: נבא의 명령형으로서 예언 행위 자체를 요구하므로, 현대 합쇼체에서 가장 직접적인 동사인 ‘예언하다’로 옮겼습니다.
- source_word: הָרוּחַ / רוּחוֹת
  english_pob_choice: breath / winds
  chosen_korean: 바람 / 바람
  alternatives_korean:
  - 숨 / 바람들
  - 영 / 바람들
  lexicon: HALOT
  rationale: 이 절에서는 단수형과 복수형 모두 ‘바람’으로 옮기면 반복되는 호명의 이미지와 ‘네 바람’이라는 관용을 살리면서도, 주석에서 ‘영’의 가능성을 열어 두는 편이 한국어 독자에게 가장 자연스럽습니다.
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 사람의 아들
  alternatives_korean:
  - 인자
  - 한낱 사람
  lexicon: HALOT
  rationale: 에스겔에게 반복되는 신적 호칭을 직역해, 여기서 인자적 칭호가 아니라 선지자의 인간성을 가리키는 표현임을 드러냈습니다.
- source_word: בַּהֲרוּגִים הָאֵלֶּה
  english_pob_choice: on these slain
  chosen_korean: 이 죽임당한 자들 위에
  alternatives_korean:
  - 이 살해된 자들 위에
  - 이 죽은 자들 위에
  lexicon: HALOT
  rationale: הֲרוּגִים의 수동적 피해를 분명히 하기 위해 ‘죽임당한 자들’로 옮겼고, 장면의 폭력성을 약화하지 않도록 했습니다.
theological_decisions:
- issue: רוּחַ의 다층적 의미를 한국어에서 어떻게 보존할 것인가
  chosen_reading: 주된 본문은 ‘바람’으로 두되, 각주로 ‘영’의 가능성을 열어 두어 생기 부여의 이미지와 영적 층위를 함께 보존했습니다.
  alternative_readings:
  - 전부 ‘영’으로 번역
  - 전부 ‘숨’으로 번역
  rationale: 문맥상 명령 대상과 ‘네 바람에서’라는 표현은 바람/방향의 이미지를 강하게 요구하지만, 이 환상은 생기와 영의 중첩을 의도하므로 한 의미로 평면화하지 않았습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
