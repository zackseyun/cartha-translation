revisions:
- from: 그가 제게 말했습니다[a]. 「예언하여 이 바람에게 말하여라. 사람의 아들아, 예언하여 이 바람에게 말하라. 주 야훼께서 이렇게 말씀하십니다. “네 바람에서 와라, 오 바람아, 그리고 이 죽임당한 자들 위에 불어서 그들이 살게 하여라.”」
  to: 그가 제게 말씀하셨습니다. “너는 숨결[a]을 향하여 예언하십시오. 사람아, 예언하고 숨결에게 말하십시오. ‘주 하나님께서 이렇게 말씀하십니다. 숨결아, 네 바람에서 오십시오. 이 죽임당한 자들 위에 불어 그들이 살게 하십시오.’”
