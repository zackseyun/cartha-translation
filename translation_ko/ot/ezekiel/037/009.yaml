  terminology: Use '주 하나님' for אֲדֹנָי יְהוִה, consistent with the English POB's 'the Lord GOD.' Render singular רוּחַ as '숨결' and the plural expression as '네 바람,' with a note preserving breath/wind/spirit ambiguity. The footnote marker should be attached to the relevant term, not to '제게.'
