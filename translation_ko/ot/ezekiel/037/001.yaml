id: EZK.37.1
reference: Ezekiel 37:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָיְתָ֣ה עָלַ/י֮ יַד יְהוָה֒ וַ/יּוֹצִאֵ֤/נִי בְ/ר֨וּחַ֙ יְהוָ֔ה וַ/יְנִיחֵ֖/נִי בְּ/ת֣וֹךְ הַ/בִּקְעָ֑ה וְ/הִ֖יא מְלֵאָ֥ה עֲצָמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/001.yaml
  text: The hand of Yahweh was upon me[a], and he brought me out by the Spirit of Yahweh and set me down in the middle of the valley[b]; it was full of bones.
  footnotes:
  - marker: a
    text: Or, 'in the Spirit of the LORD.' The Hebrew phrase can express either instrument ('by the Spirit') or sphere/state ('in the Spirit').
    reason: lexical_alternative
  - marker: b
    text: '''Valley'' may also be rendered ''plain'' or ''broad valley.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 손이 내 위에 있었고, 그는 나를 야훼의 영으로 데리고 나가 골짜기 한가운데에 내려놓으셨습니다[a]. 그곳은 뼈로 가득했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 영 안에서’. 히브리어 표현은 도구(‘영으로’)와 영역/상태(‘영 안에서’)를 모두 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘골짜기’는 ‘평지’ 또는 ‘넓은 골짜기’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד יְהוָה
  english_pob_choice: the hand of Yahweh
  chosen_korean: 야훼의 손
  alternatives_korean:
  - 야훼의 권능
  - 야훼의 손길
  lexicon: HALOT
  rationale: 히브리어의 구체적 이미지인 ‘손’을 유지해 야훼의 강한 임재와 압박을 직접적으로 드러냈습니다.
- source_word: בְּרוּחַ יְהוָה
  english_pob_choice: by the Spirit of Yahweh
  chosen_korean: 야훼의 영으로
  alternatives_korean:
  - 야훼의 성령으로
  - 야훼의 바람으로
  - 야훼의 영 안에서
  lexicon: HALOT
  rationale: 이 문맥에서는 예언적 이동을 일으키는 신적 매개를 가리키므로 ‘영’이 적절하며, 전치사 בְּ의 도구적 의미를 살려 ‘-으로’로 옮겼습니다.
- source_word: בְּתוֹךְ הַבִּקְעָה
  english_pob_choice: in the middle of the valley
  chosen_korean: 골짜기 한가운데에
  alternatives_korean:
  - 골짜기 한복판에
  - 평지 한가운데에
  - 넓은 골짜기 한가운데에
  lexicon: HALOT
  rationale: בִּקְעָה는 ‘골짜기/넓은 골짜기/평지’로 넓게 쓰이므로, 본문 이미지에 자연스러운 ‘골짜기’를 유지하되 בְּתוֹךְ의 중심성을 반영했습니다.
- source_word: מְלֵאָה עֲצָמוֹת
  english_pob_choice: full of bones
  chosen_korean: 뼈로 가득했습니다
  alternatives_korean:
  - 뼈로 가득 차 있었습니다
  - 뼈가 가득했습니다
  lexicon: HALOT
  rationale: 히브리어의 상태 묘사를 한국어로 자연스럽게 옮기되, ‘full of bones’의 냉혹한 직설성을 유지했습니다.
theological_decisions:
- issue: רוּחַ의 의미를 ‘바람’이 아니라 ‘영’으로 옮길지 여부
  chosen_reading: ‘야훼의 영으로’로 옮겨 예언자적 체험의 신적 주도성을 살렸습니다.
  alternative_readings:
  - ‘야훼의 바람으로’
  - ‘야훼의 영 안에서’
  rationale: 문맥이 단순한 기상 현상이 아니라 야훼의 능동적 개입과 예언적 이동을 말하므로, 의미를 약화시키지 않기 위해 ‘영’을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: 원어의 신학적 긴장을 보존하고, 문맥이 허용하는 가장 직접적인 신적 행위로 번역한다.'
