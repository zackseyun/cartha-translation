base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/017.yaml
  text: Then bring them near to each other for yourself as one stick[b][a], so that they may become one in your hand.
  footnotes:
  - marker: a
    text: Or 'as one stick.' The Hebrew phrase can express either the result 'into one stick' or the state 'as one stick.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'and they shall be for ones in your hand,' an idiom meaning that they become one.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들을 서로에게 가까이 가져다가, 너 자신을 위해 하나의 막대기로 삼으십시오. 그들이 당신의 손에서 하나가 되게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나의 막대기로’. 히브리어 구문은 결과적으로 ‘한 막대기로’가 될 수도, 상태적으로 ‘하나의 막대기로’가 될 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들은 당신의 손에서 하나들이 될 것이다’입니다. 이는 하나가 됨을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
