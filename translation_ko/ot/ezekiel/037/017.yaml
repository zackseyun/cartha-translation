  lexicon: HALOT
  rationale: 직역적 ‘하나들’보다 관용적 결과 의미를 드러내는 ‘하나가 되다’가 히브리어의 합성적 뜻을 더 정확히 반영합니다.
- source_word: בְיָדֶךָ
