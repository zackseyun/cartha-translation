  - marker: b
    text: Literally 'and they shall be for ones in your hand,' an idiom meaning that they become one.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들을 서로 가까이 가져와, 당신을 위하여 한 막대기가 되게 하십시오[a]. 그러면 그것들이 당신의 손 안에서 하나가 될 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 막대기로’. 히브리어 구문은 결과적으로 ‘한 막대기가 되게’를 뜻할 수도, 상태적으로 ‘한 막대기로’를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그것들은 당신의 손 안에서 하나들이 될 것이다’입니다. 이는 하나가 됨을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
