  rationale: 이 구절 자체는 해석보다 행위 묘사에 초점이 있으므로, 뒤 문맥이 설명할 통일의 의미를 미리 주입하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
