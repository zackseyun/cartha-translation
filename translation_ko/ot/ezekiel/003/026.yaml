  source_fidelity: 히브리어의 사역 표현(‘네 혀를 … 붙게 하다’), 그 결과인 발화 불능, ‘그들에게 책망하는 사람’이 되지 못함, 그리고 이유절 ‘그들이 반역의 집이기 때문’은 대체로 충실히 반영되었습니다. 다만 현대 한국어에서 ‘벙어리’는 장애를 지칭하는 낙인적 표현으로 받아들여질 수 있으므로, 본문의 의미인 말할 수 없게 됨을 더 중립적으로 옮기는 것이 안전합니다.
  naturalness: 초안은 앞부분의 해라체(‘하겠고’, ‘것이다’)와 마지막 합쇼체(‘때문입니다’)가 섞여 있어 지정된 현대 합쇼체 문체와 일관되지 않습니다. 문장 전체를 합쇼체로 통일하고, ‘벙어리’는 ‘말을 못 하게 되어’로 바꾸면 자연스럽고 정확합니다.
  terminology: ‘책망하는 사람’은 מוֹכִיחַ의 책망·교정 의미를 적절히 보존합니다. ‘반역의 집’도 에스겔의 반복적 관용구를 보존하는 번역으로 적절합니다. ‘입천장’ 역시 חֵךְ의 자연스러운 대응어입니다.
