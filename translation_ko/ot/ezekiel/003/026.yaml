source:
  edition: WLC
  text: וּ/לְשֽׁוֹנְ/ךָ֙ אַדְבִּ֣יק אֶל חִכֶּ֔/ךָ וְ/נֶֽאֱלַ֔מְתָּ וְ/לֹא תִֽהְיֶ֥ה לָ/הֶ֖ם לְ/אִ֣ישׁ מוֹכִ֑יחַ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/026.yaml
  text: And I will make your tongue cling to the roof of your mouth[a], and you will be mute and will not be for them a man who rebukes[d][c][b], for they are a rebellious house.
  footnotes:
  - marker: a
    text: Or 'to your palate.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you will be silenced' or 'you will be speechless.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'a man who rebukes'; that is, one who reproves or corrects them.
    reason: lexical_alternative
  - marker: d
    text: Hebrew 'a rebellious house,' a common Ezekiel expression for the people as a corporate household in rebellion.
    reason: cultural_note
translation:
  language: ko
  text: 내가 네 혀를 네 입천장에 붙게 하겠으며, 너는 말을 못 하게 되어 그들에게 책망하는 사람이 되지 못할 것입니다. 그들이 반역의 집이기 때문입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֵךְ는 ‘입천장’을 뜻하며, ‘입안의 천장’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘말문이 막혀’ 또는 ‘말하지 못하게 되어’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘책망하는 사람’입니다. 곧 그들을 책망하거나 바로잡는 사람이라는 뜻입니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 ‘반역의 집’은 에스겔에서 백성을 하나의 집단적 집으로 묘사하는 상투적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/לְשׁוֹנְךָ ... אֶל חִכֶּךָ
  english_pob_choice: I will make your tongue cling to the roof of your mouth
  chosen_korean: 네 혀를 네 입천장에 붙게 하겠고
  alternatives_korean:
  - 네 혀를 네 입천장에 달라붙게 하겠고
  - 네 혀가 네 입천장에 붙도록 하겠고
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 ‘붙게 하다’로 옮기되, 현대 한국어에서 자연스러운 신체 이미지로 유지했습니다.
- source_word: וְנֶאֱלַמְתָּ
  english_pob_choice: you will be mute
  chosen_korean: 네가 벙어리가 되어
  alternatives_korean:
  - 네가 말 못 하게 되어
  - 네가 침묵하게 되어
  lexicon: HALOT
  rationale: ‘벙어리’는 결과 상태를 직설적으로 드러내며, 이어지는 신적 침묵의 조치라는 문맥을 잘 반영합니다.
- source_word: לְאִישׁ מוֹכִיחַ
  english_pob_choice: a man who rebukes
  chosen_korean: 책망하는 사람
  alternatives_korean:
  - 꾸짖는 사람
  - 경고하는 사람
  - 책망자
  lexicon: HALOT
  rationale: מוֹכִיחַ의 책망/교정 기능을 살리되, 한국어에서 어색한 명사구보다 서술적 표현이 더 자연스러워 선택했습니다.
- source_word: בֵּית מְרִי
  english_pob_choice: a rebellious house
  chosen_korean: 반역의 집
  alternatives_korean:
  - 패역한 집
  - 반역하는 집
  - 반역의 가문
  lexicon: HALOT
  rationale: 에스겔의 관용구인 ‘house’를 그대로 살려 집단적 언약 공동체를 가리키는 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 하나님이 예언자의 말을 막으시는 방식
  chosen_reading: 신이 입과 혀를 제어하여 선포를 중지시키는 구체적 심판 행위로 읽습니다.
  alternative_readings:
  - 단순한 비유적 침묵
  - 설득력 상실에 대한 은유
  rationale: 혀와 입천장이라는 신체 이미지가 매우 구체적이므로, 실제로 말하지 못하게 하시는 조치로 번역했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘반역의 집’의 공동체적 의미
  chosen_reading: 이스라엘을 하나의 집으로 보는 에스겔의 집단 표상을 유지합니다.
  alternative_readings:
  - 반역한 백성
  - 반역의 무리
  rationale: ‘집’은 단순한 가족이 아니라 언약 공동체 전체를 가리키는 예언서의 표지이므로, 이를 보존해야 본문의 예언적 질감이 살아납니다.
  doctrine_reference: Translation philosophy §1, §5
