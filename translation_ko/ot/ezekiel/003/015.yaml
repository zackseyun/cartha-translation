  source_fidelity: 지명은 תֵּל אָבִיב(텔아비브)인데 초안의 ‘데르 아비브’는 잘못된 음역입니다. 또한 נְהַר כְּבָר는 ‘느할 그발’이 아니라 ‘그발 강’으로 옮기는 것이 적절합니다. מַשְׁמִים은 칠 일 동안 지속된 충격·망연의 상태를 나타내므로 다소 구어적이고 가벼운 ‘어안이 벙벙했습니다’보다 ‘충격에 사로잡혀’가 본문에 더 충실합니다. 히브리어의 거주 표현 반복은 한국어에서 ‘그들이 거기 거주하는 곳에서’로 제한적으로 보존했습니다.
  naturalness: 합쇼체 문장으로 자연스럽게 다듬었습니다. ‘포로들에게, 곧 ... 데르 아비브에’라는 초안의 어색한 병렬을 ‘포로로 끌려간 이들이 있는 텔아비브에’로 정리했으며, ‘앉아’와 칠 일의 지속을 ‘칠 일 동안 ... 앉아 있었습니다’로 분명히 연결했습니다.
  terminology: הַגּוֹלָה는 추상적 포로 상태가 아니라 강제 이주 공동체를 가리키므로 ‘포로로 끌려간 이들’로 옮겼습니다. 지명은 ‘텔아비브’와 ‘그발 강’으로 음역했습니다. 현대 도시 텔아비브와의 혼동 가능성은 있으나, 본문 지명을 임의로 달리 표기할 근거는 없습니다.
  issues:
