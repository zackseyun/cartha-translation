  text: Then I came to the exiles at Tel-abib[a], who were living by the Kebar River, where they were living; and I sat there among them for seven days, appalled.
  footnotes:
  - marker: a
    text: Or 'astonished' or 'stunned.' The Hebrew term conveys a state of shock or devastation.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그발 강가에 거주하는 포로로 끌려간 이들이 있는 텔아비브에 이르렀습니다. 그들이 거기 거주하는 곳에서, 나는 그들 가운데 칠 일 동안 충격에 사로잡혀 앉아 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘망연자실한 채’, ‘경악한 채’. 히브리어는 충격이나 황폐함으로 넋을 잃은 상태를 나타냅니다.
    reason: lexical_alternative
