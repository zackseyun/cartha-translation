  - severity: medium
    issue: ‘느할 그발 강가’는 히브리어 지명·보통명사의 분석을 부정확하게 반영합니다.
    rationale: נְהַר는 ‘강’이라는 보통명사이고 כְּבָר가 고유명입니다. 따라서 ‘그발 강’이 적절합니다.
