  lexicon: HALOT
  rationale: 단순한 놀람이 아니라 충격으로 얼어붙은 상태를 가리키므로, 한국어 관용구로 그 정서를 전달했습니다.
theological_decisions:
- issue: ‘앉아’의 신체 동작과 충격 상태의 결합
  chosen_reading: ‘내가 그들 가운데 앉아 칠 일 동안…’으로 직역성을 살리되, 뒤의 감정어로 정지와 충격을 함께 드러냈습니다.
  alternative_readings:
  - ‘내가 그들 가운데 머물며’
  - ‘내가 그들 가운데 앉아 있다가’
  rationale: 히브리어의 물리적 자세(앉다)는 장면의 침묵과 경직을 형성하므로, 이를 삭제하지 않고 유지하는 편이 본문 효과를 더 잘 보존합니다.
  doctrine_reference: 서사적 묘사
