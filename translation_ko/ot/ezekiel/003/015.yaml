  text: Then I came to the exiles at Tel-abib[a], who were living by the Kebar River, where they were living; and I sat there among them for seven days, appalled.
  footnotes:
  - marker: a
    text: Or 'astonished' or 'stunned.' The Hebrew term conveys a state of shock or devastation.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 포로들에게, 곧 그들이 머물고 있는 느할 그발 강가의 데르 아비브에 이르렀는데, 내가 그들 가운데 앉아 칠 일 동안 그저 어안이 벙벙했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘놀라서 얼어붙은’ 또는 ‘충격을 받은’. 히브리어는 놀람을 넘어선 충격과 황폐함의 상태를 나타냅니다.
    reason: lexical_alternative
