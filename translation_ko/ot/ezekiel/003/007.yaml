source:
  edition: WLC
  text: וּ/בֵ֣ית יִשְׂרָאֵ֗ל לֹ֤א יֹאבוּ֙ לִ/שְׁמֹ֣עַ אֵלֶ֔י/ךָ כִּֽי אֵינָ֥/ם אֹבִ֖ים לִ/שְׁמֹ֣עַ אֵלָ֑/י כִּ֚י כָּל בֵּ֣ית יִשְׂרָאֵ֔ל חִזְקֵי מֵ֥צַח וּ/קְשֵׁי לֵ֖ב הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/007.yaml
  text: But the house of Israel will not be willing to listen to you[a], because they are not willing to listen to me[b]; for all the house of Israel are hard of forehead and stubborn of heart.
  footnotes:
  - marker: a
    text: Or 'hard-faced' or 'stiff-foreheaded'; the Hebrew idiom pictures shameless obstinacy.
    reason: lexical_alternative
  - marker: b
    text: Or 'hard of heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이스라엘 집은 당신에게 들으려 하지 않을 것입니다[a]. 그들은 나에게 들으려 하지 않기 때문입니다[b]. 온 이스라엘 집은 이마가 굳고 마음이 완고한 사람들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '얼굴이 굳다' 또는 '이마가 뻣뻣하다'는 뜻이 될 수 있습니다. 이 히브리어 관용구는 뻔뻔한 완고함을 그립니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '마음이 굳다'라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית יִשְׂרָאֵל
  english_pob_choice: But the house of Israel
  chosen_korean: 그러나 이스라엘 집은
  alternatives_korean:
  - 그리고 이스라엘 집은
  - 이스라엘의 집은
  lexicon: HALOT
  rationale: וּ의 역접적 흐름을 살려 '그러나'로 옮기고, 언약 공동체 표현인 '이스라엘 집'을 유지했습니다.
- source_word: יֹאבוּ / אֹבִים
  english_pob_choice: will not be willing / are not willing
  chosen_korean: 들으려 하지 않을 것입니다 / 들으려 하지 않기 때문입니다
  alternatives_korean:
  - 기꺼이 듣지 않을 것입니다
  - 듣기를 거절할 것입니다
  - 원치 않을 것입니다
  lexicon: HALOT
  rationale: אָבָה의 핵심은 단순 거절보다 '의지/동의의 결여'이므로, 한국어에서도 '들으려 하지 않다'로 의지의 부재를 살렸습니다.
- source_word: לִשְׁמֹעַ אֵלֶיךָ / אֵלַי
  english_pob_choice: to listen to you / to listen to me
  chosen_korean: 당신에게 / 나에게 들으려
  alternatives_korean:
  - 당신의 말을 듣기
  - 당신에게 순종하기
  - 내 말을 듣기
  lexicon: HALOT
  rationale: שׁמע + אל의 청종 의미를 따라 단순 청각보다 '들으려 하다'로 옮겼고, 예언자와 하나님 사이의 평행을 같은 표현으로 유지했습니다.
- source_word: חִזְקֵי מֵצַח וּקְשֵׁי לֵב
  english_pob_choice: hard of forehead and stubborn of heart
  chosen_korean: 이마가 굳고 마음이 완고한
  alternatives_korean:
  - 얼굴이 뻔뻔하고 마음이 완고한
  - 이마가 강하고 마음이 완강한
  - 고집 센
  lexicon: HALOT
  rationale: 히브리어의 신체 이미지와 완고함의 비유를 살리기 위해 직역에 가까운 '이마가 굳고 마음이 완고한'을 택했습니다.
theological_decisions:
- issue: Corporate indictment of Israel
  chosen_reading: '''온 이스라엘 집''으로 전체성을 유지하여, 특정 지도층으로 범위를 좁히지 않았습니다.'
  alternative_readings:
  - 이스라엘의 많은 사람들은
  - 이스라엘 지도자들은
  rationale: 본문은 집합 전체에 대한 판단을 말하므로, 문장의 강도를 완화하지 않고 그대로 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
