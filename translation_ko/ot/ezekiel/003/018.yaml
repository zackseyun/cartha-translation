  source_fidelity: 수정본은 בְּאָמְרִי의 시간 조건(‘내가 … 말할 때’), מות תמות의 강조(‘반드시 죽을 것입니다’), 경고하지 않음과 경고하려 말하지 않음의 두 책임을 보존합니다. 또한 ‘그가 살도록 그의 악한 길에서 돌이키게 하려고’는 מִדַּרְכּוֹ הָרְשָׁעָה לְחַיֹּתוֹ의 목적 관계를 자연스럽게 드러내며, 죽음과 삶의 범위를 해석적으로 한정하지 않습니다. בַּעֲוֺנוֹ의 모호성 및 피를 ‘손에서 요구’하는 사법적 비유도 유지합니다.
  naturalness: 초안의 ‘악한 그의 길’은 현대 한국어 어순으로 다소 부자연스럽고, 전체 문장은 요청된 합쇼체와 일관되지 않았습니다. ‘그의 악한 길’ 및 ‘-습니다’ 체로 고쳐 현대적이고 격식 있는 문장으로 정리했습니다.
  terminology: רָשָׁע는 반복을 살려 ‘악인’으로, עָוֹן은 ‘죄악’으로, דָּם 및 מִיָּדְךָ אֲבַקֵּשׁ는 ‘피를 당신의 손에서 요구하다’로 유지했습니다. ‘돌이키게 하려고’는 길이 행실을 가리키는 비유를 보존하면서 한국어에서 필요한 방향성을 명확히 합니다.
