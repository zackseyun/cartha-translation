  to: 내가 악인에게 ‘당신은 반드시 죽을 것입니다’라고 말할 때, 당신이 그에게 경고하지 않고, 그가 살도록 그의 악한 길에서 돌이키게 하려고 그 악인에게 말하여 경고하지 않으면, 그 악인은 자기 죄악 가운데서[a] 죽을 것입니다. 그러나 나는 그의 피를 당신의 손에서 요구할 것입니다.[b]
  rationale: 수정은 뜻을 바꾸지 않고 문체를 합쇼체로 통일했습니다. 또한 ‘그의 악한 길’로 자연스러운 어순을 회복하고, 삶을 위한 경고의 목적 관계를 명료하게 했습니다. 각주 표지를 각각의 주석 대상 표현 뒤로 옮겼습니다.
