  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/אָמְרִ֤/י לָֽ/רָשָׁע֙ מ֣וֹת תָּמ֔וּת וְ/לֹ֣א הִזְהַרְתּ֗/וֹ וְ/לֹ֥א דִבַּ֛רְתָּ לְ/הַזְהִ֥יר רָשָׁ֛ע מִ/דַּרְכּ֥/וֹ הָ/רְשָׁעָ֖ה לְ/חַיֹּת֑/וֹ ה֤וּא רָשָׁע֙ בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/018.yaml
  text: When I say to the wicked man[a], ‘You shall surely die,’ and you do not warn him, and you do not speak to warn the wicked man from his wicked way so that he may live, that wicked man shall die in his iniquity[b], but I will require his blood from your hand.
  footnotes:
  - marker: a
    text: Or 'I will hold you accountable for his blood.' The Hebrew more literally says, 'I will require his blood from your hand,' a judicial idiom of responsibility.
    reason: lexical_alternative
  - marker: b
    text: '''In his iniquity'' may also be rendered ''for his iniquity'' or ''because of his sin.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 악인에게 ‘당신은 반드시 죽을 것입니다’라고 말할 때, 당신이 그에게 경고하지 않고, 그가 살도록 그의 악한 길에서 돌이키게 하려고 그 악인에게 말하여 경고하지 않으면, 그 악인은 자기 죄악 가운데서[a] 죽을 것입니다. 그러나 나는 그의 피를 당신의 손에서 요구할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죄악 가운데서’는 ‘그의 죄악으로 인해’ 또는 ‘그의 죄 때문에’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 피를 당신의 손에서 요구하다’라고 말하는데, 책임 추궁을 뜻하는 법정 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: לָרָשָׁע / רָשָׁע
  english_pob_choice: the wicked man / the wicked man
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람
  - 악한 자
  - 사악한 사람
  lexicon: HALOT
  rationale: רָשָׁע는 도덕적·법정적 책임을 지닌 개인을 가리키므로, 현대 한국어에서 자연스러운 ‘악인’으로 옮기되 반복된 호칭은 유지했습니다.
- source_word: מוֹת תָּמוּת
  english_pob_choice: You shall surely die
  chosen_korean: 반드시 죽을 것이다
  alternatives_korean:
  - 너는 정녕 죽을 것이다
  - 너는 틀림없이 죽을 것이다
  - 죽고 죽을 것이다
  lexicon: HALOT
  rationale: 히브리어의 강조적 부정/강조 구조를 한국어의 강한 확실성 표현으로 옮겨, 판결문의 엄중함을 살렸습니다.
- source_word: הִזְהַרְתּוֹ / לְהַזְהִיר
  english_pob_choice: warn him / speak to warn
  chosen_korean: 경고하다 / 경고하기 위해 말하다
  alternatives_korean:
  - 경계시키다 / 경고하려고 말하다
  - 주의 주다 / 경고하려고 말하다
  lexicon: HALOT
  rationale: זהר의 히필은 단순 정보 전달이 아니라 실제로 위험을 알리는 경고를 뜻하므로, 두 동사를 각각 살려 책임 있는 ‘경고’의 행위를 드러냈습니다.
- source_word: מִדַּרְכּוֹ הָרְשָׁעָה
  english_pob_choice: from his wicked way
  chosen_korean: 악한 그의 길에서 돌아서도록
  alternatives_korean:
  - 그의 악한 길에서
  - 그의 사악한 길에서 돌이키도록
  - 악한 길에서
  lexicon: HALOT
  rationale: ‘길’은 행실의 비유이므로 유지했고, 반복된 רשע 어군을 반영해 ‘악한’으로 일치시켰습니다. ‘돌아서도록’은 목적 구문을 자연스럽게 풀어줍니다.
- source_word: בַּעֲוֺנוֹ
  english_pob_choice: in his iniquity
  chosen_korean: 자기 죄악 가운데서
  alternatives_korean:
  - 그의 죄악 안에서
  - 그의 죄과로
  - 자기 죄악 때문에
  lexicon: HALOT
  rationale: ב + עָוֹן은 단순한 결과보다 죄악이 동반된 상태를 나타낼 수 있어, ‘가운데서’로 옮겨 죄의 실재와 처벌의 상태를 함께 살렸습니다.
- source_word: מִיָּדְךָ אֲבַקֵּשׁ
  english_pob_choice: I will require his blood from your hand
  chosen_korean: 그의 피를 네 손에서 요구할 것이다
  alternatives_korean:
  - 그의 피를 네 손에서 찾을 것이다
  - 그의 피에 대해 네게 책임을 물을 것이다
  - 그의 피값을 네 손에서 요구할 것이다
  lexicon: HALOT
  rationale: בקשׁ + ‘네 손에서’는 책임 추궁의 법정 관용구이므로, 직유를 살려 ‘요구할 것이다’로 옮겼습니다. ‘피’를 유지해 본문의 사법적 긴장을 보존했습니다.
theological_decisions:
- issue: ‘죽다/살다’의 범위
  chosen_reading: 육체적 죽음이나 영적 죽음으로 한정하지 않고, 본문이 말하는 판결과 생명 보존의 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 육체적 죽음으로만 이해하기
  - 영적 죽음으로만 이해하기
  rationale: 에스겔의 경고 공식은 언약적 심판을 포함할 수 있으므로, 본문이 명시하지 않은 범위를 번역에서 미리 좁히지 않았습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension.'
