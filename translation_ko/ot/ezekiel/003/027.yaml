  to: 그러나 내가 너와 말할 때에 네 입을 열겠고, 너는 그들에게 말할 것입니다. ‘주 야훼께서 이렇게 말씀하십니다. 듣는 자는 들으십시오[a]. 그만두는 자는 그만두십시오. 그들은 반역의 집이기 때문입니다[b].’
  rationale: 신명 יְהוִה를 ‘야훼’로 명시하여 원문과 프로젝트 방침을 따랐습니다. בֵּית מְרִי는 ‘반역의 집’으로 옮겨 에스겔의 반복되는 집단 은유를 보존했습니다. חדל의 의미는 과도하게 ‘거부’로 해석하지 않고 ‘그만두다’로 유지했으며, 본문이 지닌 명령적/예측적 양가성은 각주로 보존했습니다. 각주 표지도 해당 표현에 직접 배치했습니다.
