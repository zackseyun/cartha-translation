id: EZK.3.27
reference: Ezekiel 3:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּֽ/בְ/דַבְּרִ֤/י אֽוֹתְ/ךָ֙ אֶפְתַּ֣ח אֶת פִּ֔י/ךָ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה הַ/שֹּׁמֵ֤עַ יִשְׁמָע֙ וְ/הֶ/חָדֵ֣ל יֶחְדָּ֔ל כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־׀׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/027.yaml
  text: 'But when I speak with you[a], I will open your mouth, and you shall say to them, ‘Thus says the Lord GOD: The one who hears, let him hear; and the one who refrains, let him refrain[b], for they are a rebellious house.’'
  footnotes:
  - marker: a
    text: Or, 'The one who hears will hear, and the one who refuses will refuse.' The Hebrew forms can be taken as either permissive/volitive ('let him hear/refuse') or predictive ('will hear/refuse').
    reason: alternative_reading
  - marker: b
    text: Hebrew 'a rebellious house,' a recurring Ezekiel expression for the people of Israel in their stubborn rebellion.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 내가 너와 말할 때에 네 입을 열겠고, 너는 그들에게 말할 것입니다. ‘주 야훼께서 이렇게 말씀하십니다. 듣는 자는 들으십시오[a]. 그만두는 자는 그만두십시오. 그들은 반역의 집이기 때문입니다[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 분사와 미완료형은 여기서 명령적/허용적 의미로도, ‘들을 것이다/그만둘 것이다’라는 예측적 의미로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘반역의 집’은 에스겔서에 반복되는 표현으로, 완고하게 반역하는 이스라엘 백성을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְדַבְּרִי אֹתְךָ
  english_pob_choice: But when I speak with you
  chosen_korean: 그러나 내가 너와 말할 때에
  alternatives_korean:
  - 내가 너에게 말할 때에
  - 내가 너와 이야기할 때에
  lexicon: HALOT
  rationale: 문맥상 앞선 침묵 선고와 대비되는 전환이므로 ‘그러나’로 시작했고, ב+부정사구의 시간값을 살려 ‘말할 때에’로 옮겼습니다. אֹתְךָ는 직역적으로 ‘너와’가 자연스럽습니다.
- source_word: אֶפְתַּח אֶת פִּיךָ
  english_pob_choice: I will open your mouth
  chosen_korean: 내가 네 입을 열어 주겠고
  alternatives_korean:
  - 네 입을 열겠습니다
  - 내가 네 입을 열겠습니다
  lexicon: HALOT
  rationale: 하나님이 발화를 가능하게 하시는 행위를 드러내기 위해 ‘열어 주다’를 선택했습니다. 단순히 ‘열다’보다 수여·허용의 뉘앙스를 더 잘 살립니다.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  english_pob_choice: Thus says the Lord GOD
  chosen_korean: 주 하나님께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주 여호와께서 이렇게 말씀하십니다
  - 주 야훼께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 예언자 선포 공식을 한국어로 자연스럽게 옮겼습니다. 여기서는 책의 기존 표기 관행과 합쇼체 가독성을 고려해 ‘주 하나님’으로 두었습니다.
- source_word: הַשֹּׁמֵעַ יִשְׁמָע
  english_pob_choice: The one who hears, let him hear
  chosen_korean: 듣는 자는 들으십시오
  alternatives_korean:
  - 듣는 자는 들을 것입니다
  - 듣는 사람은 들으십시오
  lexicon: HALOT
  rationale: 히브리어의 분사+미완료형 반복을 권면/허용의 리듬으로 살렸습니다. 청중을 향한 선지자적 촉구이므로 합쇼체 명령형이 문맥에 맞습니다.
- source_word: וְהֶחָדֵל יֶחְדָּל
  english_pob_choice: and the one who refrains, let him refrain
  chosen_korean: 그만두는 자는 그만두십시오
  alternatives_korean:
  - 멈추는 자는 멈추십시오
  - 물러서는 자는 물러서십시오
  lexicon: HALOT
  rationale: חדל의 기본값인 ‘그치다/중단하다’를 살려 ‘그만두다’로 옮겼습니다. 문맥상 순종적 ‘절제’보다 의도적 중단·거부의 뉘앙스가 더 강합니다.
- source_word: בֵּית מְרִי
  english_pob_choice: they are a rebellious house
  chosen_korean: 그들이 반역하는 집이기 때문입니다
  alternatives_korean:
  - 그들이 반역하는 집이기 때문입니다
  - 그들이 반역의 집이기 때문입니다
  lexicon: HALOT
  rationale: 에스겔의 반복 표현인 ‘집’ 비유를 보존하되, 한국어에서 자연스러운 관계절 구조로 옮겼습니다. ‘반역하는’은 현재적 성향과 지속된 불순종을 함께 드러냅니다.
theological_decisions:
- issue: 예언자적 선포 공식의 한국어 높임말 수준
  chosen_reading: 주 하나님께서 이렇게 말씀하십니다
  alternative_readings:
  - 주 하나님께서 이렇게 말씀하십니다
  - 주 야훼께서 이렇게 말씀하십니다
  rationale: 직접 인용 안에서의 신적 발화는 한국어 합쇼체로 두어 예언 선포의 장중함을 유지했습니다. 본문 자체는 정체적 이름보다 선포 형식이 핵심이므로 가독성을 우선했습니다.
  doctrine_reference: 'POB Korean style guide: divine speech in prophetic discourse'
