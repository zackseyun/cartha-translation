review_pass:
  verdict: revise
  source_fidelity: 핵심 문장 구조와 반복 표현은 대체로 보존되어 있습니다. 다만 אֲדֹנָי יְהוִה에는 신명이 직접 포함되므로 ‘주 하나님’은 원문의 이름 요소를 흐립니다. 또한 בֵּית מְרִי는 ‘반역하는 집’보다 정형 표현을 살린 ‘반역의 집’이 더 충실합니다.
  naturalness: 현대 표준 한국어 합쇼체로 전반적으로 읽히지만, ‘그들이 반역하는 집’은 한국어에서 다소 부자연스럽습니다. ‘그들은 반역의 집이기 때문입니다’가 정형 은유를 유지하면서도 더 자연스럽습니다. 각주 표지는 해당 표현 가까이에 두는 것이 독해상 명확합니다.
  terminology: 아도나이 야훼(אֲדֹנָי יְהוִה)는 ‘주 야훼’로 옮겨 두 요소를 보존해야 합니다. חדל은 문맥상 ‘거부하다’로 한정하지 않고 ‘그만두다/그치다’ 계열로 남기는 것이 안전합니다.
  issues:
