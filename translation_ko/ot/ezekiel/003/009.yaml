translation:
  language: ko
  text: 쇠붙이보다 더 단단한 다이아몬드처럼[a] 내가 당신의 이마를 만들었습니다. 그들을 두려워하지 말고, 그들 앞에서 겁내지 마십시오. 그들은 반역하는 집이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아다만트처럼, 부싯돌보다 더 단단한’; 히브리어 שָׁמִיר는 매우 단단한 돌이나 물질을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשָׁמִיר
  english_pob_choice: diamond
  chosen_korean: 다이아몬드처럼
  alternatives_korean:
  - 강옥처럼
  - 아다만트처럼
  - 매우 단단한 돌처럼
  lexicon: HALOT
  rationale: 문맥상 ‘쇠붙이보다 더 단단한’ 비교를 이루는 매우 단단한 물질이므로, 현대 한국어에서 즉각적으로 경도를 전달하는 ‘다이아몬드’가 가장 자연스럽습니다.
- source_word: חָזָק מִצֹּר
  english_pob_choice: harder than flint
  chosen_korean: 쇠붙이보다 더 단단한
  alternatives_korean:
  - 부싯돌보다 더 단단한
  - 돌보다 더 강한
  lexicon: HALOT
  rationale: צֹר는 경도 이미지를 살리는 ‘부싯돌’이 가장 정확하지만, 한국어 전체 문장의 유창성을 위해 비교 대상의 성질을 살려 ‘쇠붙이보다 더 단단한’으로 옮겼습니다.
- source_word: מִצְחֶךָ
  english_pob_choice: your forehead
  chosen_korean: 당신의 이마
  alternatives_korean:
  - 당신의 이마 부분
  - 당신의 관자놀이
  lexicon: HALOT
  rationale: 신체 비유를 그대로 살려 예언자의 내적 강직함을 드러내는 표현이므로 ‘이마’로 직역하는 것이 적절합니다.
- source_word: בֵּית מְרִי
  english_pob_choice: a rebellious house
  chosen_korean: 반역하는 집
  alternatives_korean:
  - 반역하는 가문
  - 반역하는 백성
  - 반역의 집
  lexicon: HALOT
  rationale: 히브리어의 ‘집’(house) 이미지를 보존해 에스겔에 반복되는 언약적·공동체적 규정을 드러내기 위해, 관용적으로 풀지 않고 ‘반역하는 집’으로 옮겼습니다.
theological_decisions:
- issue: 예언적 사명에서 주어지는 내적 강인함의 비유
  chosen_reading: ‘이마를 다이아몬드처럼 단단하게 만들었다’는 표현을 예언자의 두려움 억제와 사명 수행을 위한 하나님의 부여로 유지했습니다.
  alternative_readings:
  - ‘이마를 강하게 했다’로 완화
  - 비유를 생략하고 직설적으로 번역
  rationale: 원문의 물질 비유는 예언자가 맞설 반항적 공동체 앞에서 하나님이 주시는 불굴의 결의를 강조하므로, 이를 약화시키지 않고 유지하는 것이 문맥에 충실합니다.
  doctrine_reference: Translation philosophy §§1, 5
