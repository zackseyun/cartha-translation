translation:
  language: ko
  text: 부싯돌보다 더 단단한 다이아몬드처럼[a] 내가 네 이마를 만들었다. 그들을 두려워하지 말고 그들 앞에서 겁내지 마십시오. 그들은 반역의 집이기 때문이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아다만트처럼, 곧 부싯돌보다 더 단단한 것처럼’; 히브리어 שָׁמִיר는 매우 단단한 돌이나 물질을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
