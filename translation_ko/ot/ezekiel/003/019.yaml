source:
  edition: WLC
  text: וְ/אַתָּה֙ כִּֽי הִזְהַ֣רְתָּ רָשָׁ֔ע וְ/לֹא שָׁב֙ מֵֽ/רִשְׁע֔/וֹ וּ/מִ/דַּרְכּ֖/וֹ הָ/רְשָׁעָ֑ה ה֚וּא בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/אַתָּ֖ה אֶֽת נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/019.yaml
  text: But if you warn a wicked man and he does not turn from his wickedness or from his wicked way[a], he will die in his iniquity[b], but you will have delivered your life.
  footnotes:
  - marker: a
    text: Or 'he does not turn from his wickedness or from his evil way.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you have saved yourself' or 'you have delivered your soul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신이 악인에게 경고하였는데도 그가 자기의 악행과 자기의 악한 길[a]에서 돌이키지 않으면, 그는 자기 죄악 가운데서 죽을 것이지만, 당신은 당신의 생명[b]을 건지게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기의 악함과 자기의 악한 길에서’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신 자신을 건지게 될 것입니다’ 또는 ‘당신의 목숨을 건지게 될 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִזְהַרְתָּ
  english_pob_choice: warn
  chosen_korean: 경고하다
  alternatives_korean:
  - 경고를 주다
  - 경고하다
  lexicon: HALOT
  rationale: 히필형 זהר의 기본 뜻은 경고하다/주의시키다이므로, 문맥상 간결하고 직접적인 ‘경고하다’가 적절합니다.
- source_word: שָׁב מֵרִשְׁעוֹ וּמִדַּרְכּוֹ הָרְשָׁעָה
  english_pob_choice: does not turn from his wickedness or from his wicked way
  chosen_korean: 자기의 악한 행실과 자기의 악한 길에서 돌이키지 않다
  alternatives_korean:
  - 자기의 악행과 자기의 악한 길에서 돌아서지 않다
  - 자기의 악함과 악한 길에서 돌이키지 않다
  lexicon: HALOT
  rationale: שׁוּב은 본래 ‘돌이키다/돌아오다’이므로, 도덕적 회개로만 좁히지 않고 동작 이미지를 살려 ‘돌이키다’로 옮겼습니다. רֶשַׁע와 ‘악한 길’은 각각 ‘악한 행실’과 ‘악한 길’로 자연스럽게 풀었습니다.
- source_word: בַּעֲוֺנוֹ
  english_pob_choice: in his iniquity
  chosen_korean: 자기 죄악 가운데서
  alternatives_korean:
  - 자기 죄악 안에서
  - 자기 죄 가운데서
  - 자기 죄악으로 인해
  lexicon: HALOT
  rationale: ב + עָוֹן은 단순한 원인보다 ‘죄책/죄악의 상태’ 안에서 죽는다는 뉘앙스를 담을 수 있어, 이를 그대로 살린 ‘죄악 가운데서’가 적절합니다.
- source_word: הִצַּלְתָּ אֶת־נַפְשְׁךָ
  english_pob_choice: you will have delivered your life
  chosen_korean: 당신은 자신의 생명을 건지게 될 것입니다
  alternatives_korean:
  - 당신은 자신의 생명을 구하게 될 것입니다
  - 당신은 자신의 목숨을 건지게 될 것입니다
  - 당신은 자신의 영혼을 구하게 될 것입니다
  lexicon: HALOT
  rationale: נֶפֶשׁ은 여기서 ‘영혼’보다 생명/자기 자신을 가리키므로, 현대 한국어에서 분명한 ‘생명’으로 옮기고 ‘건지다’로 구출의 이미지를 유지했습니다.
theological_decisions:
- issue: ‘죽을 것이지만’의 범위
  chosen_reading: 악인이 경고를 무시할 때의 죽음을 본문의 범위 안에서만 제시하고, 그 죽음이 영원한 형벌인지 여부는 단정하지 않았습니다.
  alternative_readings:
  - 육체적 죽음으로 제한하기
  - 영원한 정죄를 내포한다고 분명히 말하기
  rationale: 히브리어 본문은 ‘자기 죄악 가운데서 죽는다’고 말할 뿐, 죽음의 최종론적 범위를 명시하지 않으므로 그 긴장을 보존했습니다.
  doctrine_reference: 본문이 말하는 범위를 넘지 않기
