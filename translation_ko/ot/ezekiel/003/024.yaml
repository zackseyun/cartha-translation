    rationale: ‘갇혀 있다’는 외부에 의해 감금된 상태로 들리기 쉽고, ‘스스로’가 이에 부자연스럽게 결합합니다. 원문의 자기 격리 명령에는 ‘스스로를 가두어라’가 더 직접적입니다.
  - severity: low
