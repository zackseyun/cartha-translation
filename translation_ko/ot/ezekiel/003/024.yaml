  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּבֹא בִ֣/י ר֔וּחַ וַ/תַּעֲמִדֵ֖/נִי עַל רַגְלָ֑/י וַ/יְדַבֵּ֤ר אֹתִ/י֙ וַ/יֹּ֣אמֶר אֵלַ֔/י בֹּ֥א הִסָּגֵ֖ר בְּ/ת֥וֹךְ בֵּיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/024.yaml
  text: Then the Spirit entered into me and set me on my feet[a], and he spoke to me and said to me, “Go[b], shut yourself inside your house.”
  footnotes:
  - marker: a
    text: Or “a spirit entered into me.”
    reason: alternative_reading
  - marker: b
    text: Hebrew literally “Come, shut yourself inside your house.” English idiom prefers “Go” in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 영이 내 안으로 들어오셔서 나를 내 발로 세우셨습니다[a]. 그분이 내게 말씀하시며 이르셨습니다. "가서[b], 네 집 안에 스스로 갇혀 있으라."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “어떤 영이 내 안으로 들어왔다.”
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 “오라, 네 집 안에 스스로 갇혀 있으라”입니다. 이 문맥에서는 한국어에서 ‘가서’가 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא בִי רוּחַ
  english_pob_choice: Then the Spirit entered into me
  chosen_korean: 영이 내 안으로 들어오셔서
  alternatives_korean:
  - 영이 내게 들어오셨습니다
  - 영이 내 안에 들어오셨습니다
  - 바람이 내게 들어왔습니다
  lexicon: HALOT
  rationale: 이 문맥의 רוּחַ는 에스겔에서 예언적 능력을 주시는 하나님의 영을 가리키므로 ‘영’으로 두고, בִּי의 진입 이미지는 ‘내 안으로 들어오셔서’로 살렸습니다.
- source_word: וַתַּעֲמִדֵנִי עַל רַגְלַי
  english_pob_choice: set me on my feet
  chosen_korean: 나를 내 발로 세우셨습니다
  alternatives_korean:
  - 나로 하여금 내 발로 서게 하셨습니다
  - 내 발로 서게 하셨습니다
  - 나를 일으켜 세우셨습니다
  lexicon: HALOT
  rationale: עמד의 사역적 의미를 살리기 위해 단순한 ‘서다’보다 ‘세우다’를 택했고, 관용적이면서도 직접적인 표현으로 옮겼습니다.
- source_word: בֹּא הִסָּגֵר
  english_pob_choice: Go, shut yourself inside your house
  chosen_korean: 가서, 네 집 안에 스스로 갇혀 있으라
  alternatives_korean:
  - 가서, 네 집 안에 몸을 숨기라
  - 가서, 네 집 안에 갇혀 있으라
  - 들어가 네 집 안에 갇혀 있으라
  lexicon: HALOT
  rationale: בֹּא는 직역상 ‘오라’이지만 한국어 명령문 흐름에서는 이동 지시로 ‘가서’가 자연스럽고, הִסָּגֵר의 반사·피동 뉘앙스는 ‘스스로 갇혀 있으라’로 드러냈습니다.
- source_word: בְּתוֹךְ בֵּיתֶךָ
  english_pob_choice: inside your house
  chosen_korean: 네 집 안에
  alternatives_korean:
  - 네 집 가운데에
  - 네 집 한가운데에
  - 네 집 안에서
  lexicon: HALOT
  rationale: בְּתוֹךְ의 문자적 ‘가운데’보다 여기서는 집 내부에 머무르라는 뜻이 핵심이므로, 현대 한국어에서는 ‘집 안에’가 가장 자연스럽습니다.
theological_decisions:
- issue: רוּחַ의 식별
  chosen_reading: 인간의 어떤 영이 아니라, 에스겔을 예언 사역에 세우시는 하나님의 영으로 이해했습니다.
  alternative_readings:
  - 어떤 영이 내 안으로 들어왔다
  - 바람이 내 안으로 들어왔다
  rationale: 앞뒤 문맥이 에스겔의 선지자적 소명과 능력 부여를 다루므로, 단순한 불특정 영이나 물리적 바람보다 하나님의 영으로 읽는 것이 본문 흐름에 가장 잘 맞습니다.
  doctrine_reference: 에스겔 2:2; 3:12, 14과의 문맥적 연속성
- issue: 직접화법의 어조
  chosen_reading: 하나님의 명령을 한국어 합쇼체로 옮기되, 인용문 안의 명령은 직접적이고 간결한 어조를 유지했습니다.
  alternative_readings:
  - 인용문 전체를 더 완곡하게 옮김
  - 인용문 안에서도 서술체로 완화함
  rationale: 원문의 명령 강도를 약화하지 않으면서도, 현대 한국어 성경체의 가독성을 유지하기 위해 명령형을 직접적으로 살렸습니다.
  doctrine_reference: 예언자에게 주어진 신적 명령의 권위
