revisions:
- from: 그때 영이 내 안으로 들어오셔서 나를 내 발로 세우셨습니다[a]. 그분이 내게 말씀하시며 이르셨습니다. "가서[b], 네 집 안에 스스로 갇혀 있으라."
  to: 그때 영이 내 안으로 들어오셔서 나를 내 발 위에 세우셨습니다[a]. 그분이 내게 말씀하여 이르셨습니다. “가서[b] 네 집 안에 스스로를 가두어라.”
  rationale: 수정은 한국어 어법상 어색한 두 표현을 원문의 의미 범위 안에서 다듬는 데 한정했습니다. ‘내 발 위에’는 원문의 위치 표현을 보존하면서도 자연스러운 한국어 기립 표현이고, ‘스스로를 가두어라’는 닙알 명령형의 자기 격리 의미를 보존합니다. רוּחַ의 문맥적 식별은 본문에서 과도하게 명시하지 않고 기존 각주를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:38:09Z'
