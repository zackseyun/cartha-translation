translation:
  language: ko
  text: 이는 내가 너를 혀가 깊고 말이 무거운 백성에게가 아니라 이스라엘 집에게 보내기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘혀가 깊고, 혀가 무겁다’는 뜻의 히브리 관용구로, 이해하기 어려운 말을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 앞선 소명 진술을 이어 주는 설명적 접속으로, 현대 한국어에서는 원인·이유를 자연스럽게 밝히는 "… 때문입니다"가 가장 잘 맞습니다.
- source_word: עִמְקֵי שָׂפָה
  english_pob_choice: of obscure speech
  chosen_korean: 혀가 깊은
  alternatives_korean:
  - 말이 알아듣기 어려운
  - 낯선 말을 하는
  lexicon: HALOT
  rationale: 직역의 이미지를 살리면서도 한국어에서 뜻이 통하는 관용적 표현으로 옮기기 위해 "혀가 깊은"을 택했습니다. 주석에서 관용구임을 밝혀야 합니다.
- source_word: וְכִבְדֵי לָשׁוֹן
  english_pob_choice: and difficult language
  chosen_korean: 말이 무거운
  alternatives_korean:
  - 혀가 무거운
  - 말하기 어려운
  lexicon: HALOT
  rationale: 히브리어의 병렬 관용구를 맞추어 "무거운"을 유지하되, 한국어에서는 "말이 무거운"으로 자연스럽게 표현했습니다. 앞 구절과 함께 이해 난도가 높은 말을 가리킵니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘 백성
  - 이스라엘의 집
  lexicon: HALOT
  rationale: 예언서의 표준적 언약 용어를 보존하기 위해 직역형인 "이스라엘 집"을 유지했습니다. 익숙한 "이스라엘 백성"으로 풀면 표현의 고유성이 약해집니다.
theological_decisions:
- issue: 히브리어 관용구의 직역성과 가독성
  chosen_reading: '"혀가 깊고 말이 무거운"을 본문에 유지하고, 의미는 주석으로 풀어 줍니다.'
  alternative_readings:
  - '"알아듣기 어려운 말"'
  - '"낯선 언어"'
  rationale: 본절의 핵심은 외국어 자체보다 이해하기 어려운 말을 가리키는 관용구이므로, 본문은 원문의 이미지를 보존하고 주석에서 해설하는 편이 소스에 더 충실합니다.
  doctrine_reference: '성경 번역 원칙: 원문 이미지 보존과 의미 전달의 균형'
