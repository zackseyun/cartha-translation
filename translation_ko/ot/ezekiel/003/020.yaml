id: EZK.3.20
reference: Ezekiel 3:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/שׁ֨וּב צַדִּ֤יק מִ/צִּדְק/וֹ֙ וְ/עָ֣שָׂה עָ֔וֶל וְ/נָתַתִּ֥י מִכְשׁ֛וֹל לְ/פָנָ֖י/ו ה֣וּא יָמ֑וּת כִּ֣י לֹ֤א הִזְהַרְתּ/וֹ֙ בְּ/חַטָּאת֣/וֹ יָמ֔וּת וְ/לֹ֣א תִזָּכַ֗רְןָ צִדְקֹתָ/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/020.yaml
  text: And when a righteous man turns from his righteousness and does injustice[a], and I place a stumbling block before him, he will die. Because you did not warn him, he will die in his sin, and his righteous deeds that he did will not be remembered[d][c][b]; and I will require his blood from your hand.
  footnotes:
  - marker: a
    text: Or 'commits iniquity' / 'does wrong.' The Hebrew term carries the sense of wrongdoing or injustice.
    reason: lexical_alternative
  - marker: b
    text: Or 'I set an obstacle before him.' The Hebrew literally says 'a stumbling block.'
    reason: lexical_alternative
  - marker: c
    text: Or 'his acts of righteousness will not be remembered.'
    reason: lexical_alternative
  - marker: d
    text: That is, God will hold the watchman accountable for the man's bloodguilt.
    reason: cultural_note
translation:
  language: ko
  text: 의인이 자기 의에서 돌아서서 불의를 행하고, 내가 그의 앞에 걸림돌을 두면, 그는 죽을 것입니다. 당신이 그를 경고하지 않았으므로, 그는 자기 죄 가운데서 죽을 것이며, 그가 행한 그의 의로운 행위들은 기억되지 않을 것입니다. 나는 그의 피를 당신의 손에서 요구할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘걸림돌’은 문자적으로는 ‘넘어지게 하는 것’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 피를 요구한다’는 표현은 혈채임 책임을 묻는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: צַדִּיק
  english_pob_choice: a righteous man
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  lexicon: HALOT
  rationale: 단수 남성 명사적 용법을 자연스러운 한국어로 옮기되, 대표성은 유지했습니다.
- source_word: מִצִּדְקוֹ
  english_pob_choice: from his righteousness
  chosen_korean: 자기 의에서
  alternatives_korean:
  - 그의 의에서
  - 의로운 행위에서
  lexicon: HALOT
  rationale: ‘의’는 단순한 도덕성보다 상태와 행위를 함께 포괄하므로, 출발점 의미를 살려 ‘…에서 돌아서서’와 연결했습니다.
- source_word: וְעָשָׂה עָוֶל
  english_pob_choice: and does injustice
  chosen_korean: 불의를 행하고
  alternatives_korean:
  - 불의를 저지르고
  - 악을 행하고
  lexicon: HALOT
  rationale: עָוֶל의 법적·도덕적 무게를 살리면서도 현대 한국어로 자연스럽게 표현했습니다.
- source_word: וְנָתַתִּי מִכְשׁוֹל לְפָנָיו
  english_pob_choice: and I place a stumbling block before him
  chosen_korean: 내가 그의 앞에 걸림돌을 두면
  alternatives_korean:
  - 내가 그의 앞에 장애물을 두면
  - 내가 그의 앞에 넘어지게 하는 것을 두면
  lexicon: HALOT
  rationale: 직역의 ‘걸림돌’ 이미지를 유지하되 한국어로 읽기 자연스럽게 다듬었습니다.
- source_word: וְדָמוֹ מִיָּדְךָ אֲבַקֵּשׁ
  english_pob_choice: and I will require his blood from your hand
  chosen_korean: 나는 그의 피를 당신의 손에서 요구할 것입니다
  alternatives_korean:
  - 나는 그의 피값을 당신에게서 요구할 것입니다
  - 나는 그의 피에 대해 당신에게 책임을 물을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 혈흔/혈채임 책임 관용구를 최대한 보존하면서, 현대어로 이해 가능하도록 했습니다.
theological_decisions:
- issue: 하나님이 ‘걸림돌’을 두신다는 표현
  chosen_reading: ‘걸림돌’을 직접적으로 유지해 하나님의 행위와 책임의 긴장을 해소하지 않았습니다.
  alternative_readings:
  - ‘넘어지게 하는 장애’를 둔다로 완화하기
  - 섭리적 결과만 가리키는 표현으로 바꾸기
  rationale: 원문은 하나님의 직접 행위를 말하므로, 번역이 그 긴장을 미리 설명하거나 약화하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
- issue: 의로운 행위가 ‘기억되지 않을’ 때의 신학적 함의
  chosen_reading: 과거의 의로운 행위가 ‘기억되지 않을 것입니다’라고 옮겨, 경고의 문맥을 유지했습니다.
  alternative_readings:
  - 구원 상실로 해석하기
  - 단순한 수사적 경고로만 축소하기
  rationale: 본문은 심판 맥락에서 이전 행위의 비기억을 말하므로, 교리적 결론은 번역에 덧입히지 않았습니다.
  doctrine_reference: Affirmations; Translation philosophy §3 Preserve theological tension rather than resolve it
