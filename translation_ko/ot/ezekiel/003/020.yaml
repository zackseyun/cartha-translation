  terminology: ‘의인’, ‘의’, ‘불의’, ‘걸림돌’, ‘죄 가운데서’, ‘피를 네 손에서 요구하다’는 핵심 용어와 비유를 충실히 유지합니다. ‘피’는 혈책임의 법정적 비유를 본문에서 보존하고 각주에서만 설명합니다.
