translation:
  language: ko
  text: 그곳에서 야훼의 손이 내게 임하였고, 그분이 내게 말씀하셨습니다. “일어나 골짜기[a]로 나가십시오. 내가 그곳에서 너와 말하겠습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘골짜기’는 ‘평야’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너와 말하겠습니다’는 ‘너에게 말하겠습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד יְהוָה
  english_pob_choice: the hand of Yahweh
  chosen_korean: 야훼의 손
  alternatives_korean:
  - 야훼의 능력
  - 주님의 손
  lexicon: HALOT
  rationale: 히브리어의 ‘손’은 단순한 힘의 추상화보다 실제적인 신적 개입과 압박을 가리키는 예언자적 관용구이므로, 의미를 풀지 않고 이미지를 살렸습니다.
- source_word: וַתְּהִי עָלַי
  english_pob_choice: was upon me
  chosen_korean: 내게 임하였고
  alternatives_korean:
  - 내 위에 있었고
  - 내게 임했고
  lexicon: HALOT
  rationale: ‘위에 있다’의 공간적 이미지를 유지하되 한국어에서 자연스럽고 예언자적 임재를 드러내는 표현으로 ‘임하다’를 택했습니다.
- source_word: הַבִּקְעָה
  english_pob_choice: the valley
  chosen_korean: 골짜기
  alternatives_korean:
  - 계곡
  - 평야
  lexicon: HALOT
  rationale: בִּקְעָה는 골짜기 또는 넓은 평지로도 될 수 있으나, 본문에서는 지형적 하강과 이동의 대비가 살아나는 ‘골짜기’가 가장 무난합니다.
- source_word: אֲדַבֵּר אוֹתָךְ
  english_pob_choice: I will speak with you
  chosen_korean: 내가 너와 말하겠다
  alternatives_korean:
  - 내가 너에게 말하겠다
  - 내가 너와 이야기하겠다
  lexicon: HALOT
  rationale: 동사 דבר의 직접성과 상호성을 살리기 위해 ‘말하다’를 유지했고, אֵת의 관계를 반영해 ‘너와’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 야훼의 이름을 직접 사용하므로, 전통적 대체 칭호보다 고유명사 표기를 유지해 본문의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 명령문 화법
  chosen_reading: 예언자적 직접 명령을 현대 한국어 명령형으로 옮김
  alternative_readings:
  - 완곡한 요청형
  - 서술형 전환
  rationale: ‘일어나서 … 나가라’는 하나님의 직접 지시이므로, 합쇼체 서술 안에서 인용문 명령형을 유지해 권위와 긴박성을 살렸습니다.
  doctrine_reference: Source speech register
