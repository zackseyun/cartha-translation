  lexicon: HALOT
  rationale: ‘무거운 혀’의 관용구를 한국어로 자연스럽게 풀어, 앞의 ‘낯선 말’과 병렬을 이루는 ‘어려운 언어’로 옮겼습니다.
- source_word: שְׁלַחְתִּיךָ
  english_pob_choice: I had sent you
  chosen_korean: 내가 당신을 보냈다면
  alternatives_korean:
  - 내가 당신을 보냈더라면
  - 내가 당신을 보낸다면
  lexicon: HALOT
  rationale: 가정법의 반사실적 뉘앙스를 한국어 조건문으로 살리되, 문맥의 도전적 진술을 자연스럽게 전달하도록 ‘보냈다면’으로 처리했습니다.
theological_decisions:
