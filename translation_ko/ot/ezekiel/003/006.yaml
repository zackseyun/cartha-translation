  text: לֹ֣א אֶל עַמִּ֣ים רַבִּ֗ים עִמְקֵ֤י שָׂפָה֙ וְ/כִבְדֵ֣י לָשׁ֔וֹן אֲשֶׁ֥ר לֹֽא תִשְׁמַ֖ע דִּבְרֵי/הֶ֑ם אִם לֹ֤א אֲלֵי/הֶם֙ שְׁלַחְתִּ֔י/ךָ הֵ֖מָּה יִשְׁמְע֥וּ אֵלֶֽי/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/006.yaml
  text: not to many peoples of obscure speech and difficult language[a], whose words you cannot understand; surely, if I had sent you to them, they would listen to you.
  footnotes:
  - marker: a
    text: Hebrew literally, 'deep of lip and heavy of tongue,' an idiom for speech that is difficult to understand.
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 백성과, 낯선 말과 어려운 언어를 쓰는 이들에게가 아니었습니다. 그들의 말을 당신은 알아듣지 못했을 것입니다. 참으로, 내가 당신을 그들에게 보냈다면, 그들은 당신에게 들었을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘입술이 깊고 혀가 무겁다’로, 이해하기 어려운 말을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים רַבִּים
  english_pob_choice: many peoples
  chosen_korean: 많은 백성
  alternatives_korean:
  - 많은 민족들
  - 많은 사람들
  lexicon: HALOT
  rationale: עַמִּים רַבִּים는 단일 집단이 아니라 복수의 민족/백성을 가리키므로, 한국어에서는 자연스럽고 포괄적인 ‘많은 백성’이 본문 의도를 잘 살립니다.
- source_word: עִמְקֵי שָׂפָה
  english_pob_choice: of obscure speech
  chosen_korean: 낯선 말
  alternatives_korean:
  - 깊은 입술의
  - 불분명한 말
  - 알기 어려운 말
  lexicon: HALOT
  rationale: 직역인 ‘깊은 입술’은 한국어에서 의미가 즉시 전달되지 않으므로, 관용적 의미인 ‘이해하기 어려운 말’의 뉘앙스를 살리면서도 간결한 ‘낯선 말’을 택했습니다.
- source_word: וְכִבְדֵי לָשׁוֹן
  english_pob_choice: and difficult language
  chosen_korean: 어려운 언어
  alternatives_korean:
  - 무거운 혀
  - 어려운 말
  - 난해한 언어
  lexicon: HALOT
  rationale: ‘무거운 혀’의 관용구를 한국어로 자연스럽게 풀어, 앞의 ‘낯선 말’과 병렬을 이루는 ‘어려운 언어’로 옮겼습니다.
- source_word: שְׁלַחְתִּיךָ
  english_pob_choice: I had sent you
  chosen_korean: 내가 당신을 보냈다면
  alternatives_korean:
  - 내가 당신을 보냈더라면
  - 내가 당신을 보낸다면
  lexicon: HALOT
  rationale: 가정법의 반사실적 뉘앙스를 한국어 조건문으로 살리되, 문맥의 도전적 진술을 자연스럽게 전달하도록 ‘보냈다면’으로 처리했습니다.
theological_decisions:
- issue: אִם לֹא의 수사적 힘
  chosen_reading: ‘참으로, ...였다면’으로 강한 반대-가정의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘만일 ... 아니었다면’
  - ‘혹시 ...였다면’
  rationale: 본문은 단순 조건이 아니라 ‘만일 내가 너를 그들에게 보냈다면’이라는 반사실적 강조를 담으므로, 한국어에서도 확언적 대비를 분명히 드러냈습니다.
  doctrine_reference: 본문의 수사 구조 보존
