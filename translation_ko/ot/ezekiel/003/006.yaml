translation:
  language: ko
  text: 많은 민족들, 곧 난해한 말과 어려운 언어를 쓰며 그들의 말을 알아듣지 못할 이들에게 보냄을 받은 것이 아닙니다. 참으로, 내가 당신을 그들에게 보냈더라면, 그들은 당신의 말을 들었을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘입술이 깊고 혀가 무겁다’로, 이해하기 어려운 말을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים רַבִּים
  english_pob_choice: many peoples
  chosen_korean: 많은 백성
  alternatives_korean:
