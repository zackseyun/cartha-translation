id: EZK.3.11
reference: Ezekiel 3:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֵ֨ךְ בֹּ֤א אֶל הַ/גּוֹלָה֙ אֶל בְּנֵ֣י עַמֶּ֔/ךָ וְ/דִבַּרְתָּ֤ אֲלֵי/הֶם֙ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה אִֽם יִשְׁמְע֖וּ וְ/אִם יֶחְדָּֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/011.yaml
  text: And go[a], come to the exiles, to the sons of your people, and speak to them and say to them[b], ‘Thus says the Lord GOD,’ whether they hear or whether they refuse.
  footnotes:
  - marker: a
    text: Or 'the children of your people'; the Hebrew literally says 'sons,' a representative kinship expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'whether they hear or whether they forbear'; the Hebrew literally contrasts hearing with ceasing/refraining, here in the sense of refusing to heed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 가서 포로들, 곧 네 백성의 자손들에게로 가서 그들에게 말하고 그들에게 이렇게 말하십시오. “주 야훼께서 이렇게 말씀하십니다. 그들이 듣든지 듣지 않든지.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포로들’은 히브리어의 집단적 의미를 드러낸 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네 백성의 자손들’은 히브리어가 직역하면 ‘네 백성의 아들들’이라고 하는 남성 복수의 대표적 친족 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘듣든지 듣지 않든지’는 ‘듣다’와 ‘그만두다/중지하다’의 대조를 현대 한국어로 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֵךְ בֹּא
  english_pob_choice: And go, come
  chosen_korean: 그리고 가서
  alternatives_korean:
  - 가서 오십시오
  - 가서 들어가십시오
  lexicon: HALOT
  rationale: 두 동사 연쇄의 이동 명령을 한국어에서 자연스럽게 풀어, 첫 번째 동사의 추진력과 이어지는 파송의 흐름을 살렸습니다.
- source_word: הַגּוֹלָה
  english_pob_choice: the exiles
  chosen_korean: 포로들
  alternatives_korean:
  - 유배자들
  - 포로 공동체
  lexicon: HALOT
  rationale: 여기서는 추상적 '포로 상태'가 아니라 바벨론으로 끌려간 사람들의 집단을 가리키므로, 현대 한국어에서 직설적인 집단 명칭인 '포로들'이 가장 자연스럽습니다.
- source_word: בְּנֵי עַמֶּךָ
  english_pob_choice: the sons of your people
  chosen_korean: 네 백성의 자손들에게
  alternatives_korean:
  - 네 백성의 아들들에게
  - 네 백성에게
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 친족 표현을 보존하되, 한국어에서는 대표적·집합적 의미가 드러나도록 '자손들'로 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼께서
  alternatives_korean:
  - 주 하나님께서
  - 주 여호와께서
  lexicon: HALOT
  rationale: 본문의 아도나이+야훼 결합을 분명히 드러내기 위해, 야훼를 본문에 직접 반영했습니다. 한국어에서는 예언적 전달문의 권위를 살려 '주 야훼께서'로 옮겼습니다.
theological_decisions:
- issue: 예언 전달 공식의 종결 방식
  chosen_reading: 그들이 듣든지 듣지 않든지
  alternative_readings:
  - 그들이 듣든지 아니 듣든지
  - 그들이 듣든지 거절하든지
  rationale: 히브리어의 '듣다/그만두다' 대조를, 한국어에서 성경적 청중 반응 공식에 가까운 '듣든지 듣지 않든지'로 옮겨 거절의 함의를 유지했습니다.
  doctrine_reference: 예언자적 소명 본문의 수신 책임에 대한 서술
