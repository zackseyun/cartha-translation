  source_fidelity: 수정이 필요합니다. הַגּוֹלָה는 포로가 된 사람들의 집단을 가리키며, בְּנֵי עַמֶּךָ는 직역상 ‘네 백성의 아들들’입니다. 또한 אִם יִשְׁמְעוּ וְאִם יֶחְדָּלוּ는 ‘듣다’와 ‘그만두다/삼가다’의 대조로서, 문맥상 ‘듣든지 거절하든지’가 자연스럽습니다.
  naturalness: 초안의 ‘가서 포로들 … 에게로 가서’는 이동 동사가 중복되고, ‘네 백성의 자손들’은 여기서 ‘아들들’이라는 친족 표현보다 후손이라는 뜻으로 읽히기 쉽습니다. ‘포로 공동체’와 ‘네 백성의 아들들’로 옮기고, 명령문의 흐름을 정리하는 것이 현대 한국어 합쇼체에 더 자연스럽습니다.
  terminology: אֲדֹנָי יְהוִה의 결합을 ‘주 야훼’로 옮긴 것은 원문의 두 요소를 구별하여 반영하며 유지할 수 있습니다. 예언적 선언 공식 ‘이렇게 말씀하십니다’도 적절합니다.
