source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם אֵ֥ת אֲשֶׁר תִּמְצָ֖א אֱכ֑וֹל אֱכוֹל֙ אֶת הַ/מְּגִלָּ֣ה הַ/זֹּ֔את וְ/לֵ֥ךְ דַּבֵּ֖ר אֶל בֵּ֥ית יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/001.yaml
  text: Then he said to me[a], “Son of man, eat what you find; eat this scroll, and go, speak to the house of Israel.”
  footnotes:
  - marker: a
    text: Or “whatever you find, eat.” The Hebrew expression can be rendered either way; the sense is that Ezekiel is to consume what is set before him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. “인자야, 네가 발견하는 것을[a] 먹어라. 이 두루마리를 먹고, 가서 이스라엘 집에 말하라.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘네가 발견하는 것’을 ‘무엇을 발견하든’으로도 옮길 수 있습니다. 뜻은 에스겔 앞에 놓인 것을 그가 받아먹으라는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인간아
  - 인자
  lexicon: HALOT
  rationale: 예언자에게 주어지는 직접 호칭을 살리면서, ‘אָדָם’의 대표적 인간성을 유지하기 위해 직역에 가까운 ‘인자야’를 택했습니다. 한국어에서 호격으로 자연스럽게 읽히고, 본문의 위엄도 보존합니다.
- source_word: אֵת אֲשֶׁר תִּמְצָא
  english_pob_choice: what you find
  chosen_korean: 네가 찾는 것
  alternatives_korean:
  - 무엇이든 네가 찾는 것
  - 네가 발견하는 것
  - 네가 찾은 것
  lexicon: HALOT
  rationale: 히브리어 관용구의 뜻은 ‘네가 찾는 것/무엇을 찾든’입니다. 현재형 ‘찾는 것’은 영어 POB의 의미를 유지하면서도 한국어에서 가장 자연스럽게 들립니다.
- source_word: אֱכֹל אֱכוֹל
  english_pob_choice: eat ... eat
  chosen_korean: 먹어라. … 먹고
  alternatives_korean:
  - 반드시 먹어라
  - 먹어, 먹어라
  - 꼭 먹어라
  lexicon: HALOT
  rationale: 반복 명령의 강조를 한국어에서도 드러내기 위해 첫 번째 명령을 보존하고 뒤의 명령을 이어서 배치했습니다. ‘꼭’ 같은 부사는 원문의 반복 강도를 다소 해칠 수 있어 피했습니다.
- source_word: מְגִלָּה
  english_pob_choice: scroll
  chosen_korean: 두루마리
  alternatives_korean:
  - 책
  - 두루마리책
  - 책 두루마리
  lexicon: HALOT
  rationale: ‘scroll’의 고대 필사본 이미지를 가장 직접적으로 옮길 수 있는 한국어는 ‘두루마리’입니다. 전통 교회어의 ‘책’보다 원문 물건성을 더 정확히 드러냅니다.
theological_decisions:
- issue: 예언적 명령문의 전달 방식
  chosen_reading: 직접 인용 안에서 짧은 명령형을 유지해, 먹는 행위가 말씀 수용과 선포의 전제라는 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - ‘읽어라’ 또는 ‘받아들여라’로 의역
  - 명령을 하나의 부드러운 문장으로 통합
  rationale: 본문은 두루마리를 실제로 먹은 뒤 이스라엘 집에 말하라는 상징행위를 요구합니다. 이를 완화하면 예언적 상징의 강도가 약해집니다.
  doctrine_reference: Ezekiel prophetic sign-act; source-text imagery
- issue: 인자 호칭의 문체
  chosen_reading: 예언적 직접 호칭이므로 ‘인자야’로 옮겨 반말형 명령을 받는 대면 구조를 살렸습니다.
  alternative_readings:
  - ‘인자여’
  - ‘사람아’
  rationale: 히브리어 호격의 직접성과 긴급성을 보존하기 위해 호격 어미 ‘-야’를 사용했습니다. 이는 인용문 안의 장면성과 구어적 긴박함을 유지합니다.
  doctrine_reference: Direct-speech register in prophetic literature
