translation:
  language: ko
  text: 그러나 너, 인자야, 보십시오. 그들이 네 위에 밧줄들을[a] 놓고 그것들로 너를 묶어, 네가 그들 가운데로[b] 나가지 못하게 할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밧줄들’은 ‘줄들’ 또는 ‘끈들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들 가운데’입니다.
    reason: lexical_alternative
