id: EZK.3.25
reference: Ezekiel 3:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם הִנֵּ֨ה נָתְנ֤וּ עָלֶ֨י/ךָ֙ עֲבוֹתִ֔ים וַ/אֲסָר֖וּ/ךָ בָּ/הֶ֑ם וְ/לֹ֥א תֵצֵ֖א בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/025.yaml
  text: But you[a], son of man, behold, they will put ropes on you and bind you with them[b], so that you will not go out among them.
  footnotes:
  - marker: a
    text: Or 'cords' or 'bands.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in their midst.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너, 인자야, 보아라, 그들이 네게 밧줄들을 걸고 그것들로 너를 묶어, 네가 그들 가운데로 나가지 못하게 할 것이다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밧줄들’ 또는 ‘줄들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들 가운데’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 사람의 아들
  lexicon: HALOT
  rationale: 에스겔서에서 반복되는 호칭이므로 문학적 일관성을 살려 ‘인자’로 옮겼습니다. 한국어 교회 용어와도 연결되지만, 여기서는 관용적 직함으로 유지하는 것이 본문의 주소 기능을 가장 잘 드러냅니다.
- source_word: הִנֵּה
  english_pob_choice: behold
  chosen_korean: 보아라
  alternatives_korean:
  - 보라
  - 주목하라
  lexicon: HALOT
  rationale: 예언적 주의 환기 표현을 살리되, 현대 한국어에서 자연스럽고 직접적인 명령형으로 옮겼습니다.
- source_word: עֲבוֹתִים
  english_pob_choice: ropes
  chosen_korean: 밧줄들
  alternatives_korean:
  - 줄들
  - 끈들
  - 로프들
  lexicon: HALOT
  rationale: 묶는 도구라는 물리적 이미지를 분명하게 전달하는 말로 ‘밧줄들’을 택했습니다. 단수로 뭉개지지 않도록 복수를 유지했습니다.
- source_word: בְּתוֹכָם
  english_pob_choice: among them
  chosen_korean: 그들 가운데로
  alternatives_korean:
  - 그들 한가운데로
  - 그들 가운데에서
  - 그들 안에서
  lexicon: HALOT
  rationale: 직역의 ‘그들 가운데’ 의미를 살리면서, 동사 ‘나가지 못하게’와 자연스럽게 결합되도록 방향성을 드러냈습니다.
theological_decisions:
- issue: 누가 묶는지에 대한 불특정 복수 주어
  chosen_reading: 주어를 ‘그들’로 두어, 본문이 밝히지 않는 행위자를 특정하지 않았습니다.
  alternative_readings:
  - 하나님의 대리자들로 구체화
  - 백성으로 구체화
  - 수동태로 완화
  rationale: 히브리어의 불특정 3인칭 복수는 행위자를 명시하지 않습니다. 본문의 긴장을 보존하기 위해 해석적으로 좁히지 않았습니다.
  doctrine_reference: 본문의 행위자 불확정성 보존
