  rationale: 히브리어의 불특정 3인칭 복수는 행위자를 명시하지 않습니다. 본문의 긴장을 보존하기 위해 해석적으로 좁히지 않았습니다.
  doctrine_reference: 본문의 행위자 불확정성 보존
