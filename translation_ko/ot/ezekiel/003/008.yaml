translation:
  language: ko
  text: 보십시오. 내가 당신의 얼굴을 그들의 얼굴에 맞서 굳세게 하였고, 당신의 이마를 그들의 이마에 맞서 굳세게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 두 절 모두에서 ‘굳세게’ 대신 ‘강하게’ 또는 ‘단단하게’로 옮길 수 있습니다. 히브리어는 대항에 맞서는 견고함 또는 단단함을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 하나님의 엄숙한 주의를 환기하는 감탄사로, 현대 합쇼체에서 가장 자연스럽고 직접적인 호소형으로 옮겼습니다.
- source_word: נָתַתִּי
  english_pob_choice: I have made
  chosen_korean: 강하게 만들었습니다
  alternatives_korean:
  - 주었습니다
  - 두었습니다
  - 세웠습니다
  lexicon: HALOT
  rationale: 문자적으로는 ‘주다’이지만, 얼굴과 이마를 어떤 상태로 만들었다는 구성에서는 원인적 의미가 핵심이므로 ‘강하게 만들었습니다’로 옮겨 본문의 의도를 살렸습니다.
- source_word: חֲזָקִים / חָזָק
  english_pob_choice: strong
  chosen_korean: 강하게
  alternatives_korean:
  - 굳게
  - 단단하게
  - 굳세게
  lexicon: HALOT
  rationale: 히브리어의 ‘강함/단단함’이 대립 상황에서의 내적 견고함을 나타내므로, 얼굴·이마의 이미지를 살리는 ‘강하게’가 가장 균형적입니다.
- source_word: לְעֻמַּת
  english_pob_choice: against
  chosen_korean: 맞서
  alternatives_korean:
  - 대하여
  - 마주하여
  - 반대하여
  lexicon: HALOT
  rationale: 상대와 정면으로 마주하는 대립 관계를 한국어 동사로 자연스럽게 살렸으며, 단순한 공간적 ‘앞에’보다 충돌의 뉘앙스를 더 분명히 드러냅니다.
theological_decisions:
- issue: 얼굴과 이마의 신체 이미지 보존
  chosen_reading: ‘얼굴’과 ‘이마’를 그대로 유지하여 하나님이 예언자에게 주시는 대면적 담대함의 이미지를 살렸습니다.
  alternative_readings:
  - ‘당신을 완강하게 만들었습니다’처럼 추상화함
  - ‘당신을 강경하게 만들었습니다’처럼 성격 묘사로 바꿈
  rationale: 본문은 추상적 성품 설명보다 신체 비유를 통해 예언적 대항의 힘을 표현하므로, 이미지를 보존하는 번역이 본문 의미를 더 충실하게 전달합니다.
  doctrine_reference: 'Translation philosophy: preserve source-text sense; do not paraphrase beyond what the source warrants.'
