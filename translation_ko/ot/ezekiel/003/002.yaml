  yaml_path: translation/ot/ezekiel/003/002.yaml
  text: So I opened my mouth[a], and he fed me this scroll.
  footnotes:
  - marker: a
    text: Or, more formally, 'and he caused me to eat this scroll' or 'and he made me eat this scroll.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 저는 입을 열었습니다. 그러자 그가 저에게 이 두루마리를 먹이셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘그가 나로 이 두루마리를 먹게 하셨다’ 혹은 ‘그가 나를 이 두루마리를 먹도록 하셨다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶפְתַּ֖ח אֶת פִּ֑י
  english_pob_choice: So I opened my mouth
  chosen_korean: 그래서 저는 입을 열었습니다
  alternatives_korean:
  - 그리고 저는 입을 열었습니다
  - 그때 저는 입을 열었습니다
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 서술 순서를 살리되, 한국어에서는 자연스러운 결과·연결을 나타내는 ‘그래서’로 옮겼고, ‘my mouth’는 관용적으로 ‘입을 열다’로 표현했습니다.
- source_word: וַיַּאֲכִלֵ֔נִי
  english_pob_choice: and he fed me
  chosen_korean: 그가 저에게 … 먹이셨습니다
  alternatives_korean:
  - 그가 저를 먹게 하셨습니다
  - 그가 저에게 먹도록 하셨습니다
  lexicon: HALOT
  rationale: POB가 본문에서는 자연스럽게 ‘fed me’로 두되 각주에서 더 문자적인 ‘caused/made me eat’을 제시하므로, 본문은 한국어로도 자연스러운 ‘먹이셨습니다’를 택하되 causative 뉘앙스를 유지했습니다.
- source_word: אֵת הַמְּגִלָּה הַזֹּאת
  english_pob_choice: this scroll
  chosen_korean: 이 두루마리를
  alternatives_korean:
  - 이 책을
  - 이 두루마리 책을
  lexicon: HALOT
  rationale: מְגִלָּה는 고대의 기록 매체인 ‘두루마리’가 가장 직접적이며, 지시형용사 הַזֹּאת는 한국어에서 자연스럽게 ‘이’로 옮겼습니다.
theological_decisions:
- issue: ‘먹이다’와 ‘먹게 하다’ 사이의 표현 수위
  chosen_reading: 본문에는 ‘먹이셨습니다’로 두되, 하나님/사자가 에스겔에게 두루마리를 먹게 하시는 상징행위를 그대로 드러냈습니다.
  alternative_readings:
  - ‘먹게 하셨습니다’
  - ‘먹도록 하셨습니다’
  rationale: 이 장면은 예언자적 수용과 내면화의 상징이므로, 지나치게 완화하지 않고 causative 의미를 유지하는 것이 본문의 의도를 더 잘 전달합니다.
  doctrine_reference: 예언자 소명과 계시 수용의 상징행위
