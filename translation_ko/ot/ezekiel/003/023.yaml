  text: וָ/אָקוּם֮ וָ/אֵצֵ֣א אֶל הַ/בִּקְעָה֒ וְ/הִנֵּה שָׁ֤ם כְּבוֹד יְהוָה֙ עֹמֵ֔ד כַּ/כָּב֕וֹד אֲשֶׁ֥ר רָאִ֖יתִי עַל נְהַר כְּבָ֑ר וָ/אֶפֹּ֖ל עַל פָּנָֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/023.yaml
  text: So I arose and went out to the valley[a], and behold, the glory of Yahweh was standing there, like the glory that I had seen by the Kebar River; and I fell on my face.
  footnotes:
  - marker: a
    text: Or 'the plain' for 'the valley' (Hebrew biq'ah).
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 일어나 들판으로 나갔더니, 보라, 야훼의 영광이 거기 서 있었는데, 내가 그발 강가에서 보았던 그 영광과 같았습니다. 그래서 나는 얼굴을 땅에 대고 엎드렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들판’은 히브리어 biq'ah의 가능한 번역 중 하나이며, 문맥에 따라 ‘골짜기’ 또는 ‘평원’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּקְעָה
  english_pob_choice: the valley
  chosen_korean: 들판
  alternatives_korean:
  - 계곡
  - 골짜기
  - 평원
  lexicon: HALOT
  rationale: בִּקְעָה는 계곡·평원·넓은 저지대를 가리킬 수 있으므로, 문맥상 넓게 열린 지형을 살려 ‘들판’으로 옮겼습니다. POB의 각주처럼 ‘the valley’에 대한 다른 가능성도 있음을 반영합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문이 여호와 이름(יהוה)을 직접 쓰므로, 프로젝트 기본값에 따라 신적 호칭이 아니라 고유한 이름으로 ‘야훼’를 사용했습니다.
- source_word: כְּבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 존귀
  - 야훼의 영예
  - 야훼의 광채
  lexicon: HALOT
  rationale: כָּבוֹד는 하나님의 임재가 드러나는 ‘영광’을 뜻하므로, 구조를 살려 ‘야훼의 영광’으로 옮겼습니다.
- source_word: וָאֶפֹּל עַל פָּנָי
  english_pob_choice: and I fell on my face
  chosen_korean: 얼굴을 땅에 대고 엎드렸습니다
  alternatives_korean:
  - 얼굴에 엎드렸습니다
  - 얼굴을 땅에 박고 엎드렸습니다
  - 엎드러졌습니다
  lexicon: HALOT
  rationale: 예언자적 경외와 절하는 자세를 드러내기 위해 직역적이면서도 자연스러운 한국어 관용을 함께 살린 표현을 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: ‘야훼’로 직접 음역합니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 본문이 언약 이름을 직접 사용하므로, 이를 호칭으로 대체하지 않고 고유 이름으로 드러내는 것이 원문의 신학적 무게를 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘야훼의 영광’의 의미
  chosen_reading: 가시적 임재를 암시하는 예언자적 현현으로 읽습니다.
  alternative_readings:
  - 단순한 명예 개념
  - 상징적 찬양
  rationale: 에스겔의 환상 문맥에서 ‘영광’은 단순 추상어가 아니라 하나님 임재의 현현을 가리키므로, 그 긴장을 약화하지 않도록 번역했습니다.
  doctrine_reference: Ezekiel visionary glory motif
