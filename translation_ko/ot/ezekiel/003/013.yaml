  - marker: a
    text: Literally, 'touching, each one to her sister'—a Hebrew idiom meaning corresponding to or touching one another.
    reason: lexical_alternative
  - marker: b
    text: Or 'opposite them' for 'beside them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a great noise' or 'a great rattling.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 살아 있는 생물들의 날개가 서로 맞닿는 소리[a]와, 그들 곁에 있는 바퀴들의 소리[b]와, 큰 굉음[c]이 들렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘한 여자가 자기 자매에게 [닿는]’입니다. 날개를 여성형으로 표현한 관용구로서, 날개들이 서로 맞닿는다는 뜻입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘그들 맞은편에 있는’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘큰 소리’ 또는 ‘큰 요란한 울림’으로 옮길 수 있습니다.
    reason: lexical_alternative
