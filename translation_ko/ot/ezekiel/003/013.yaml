  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ק֣וֹל כַּנְפֵ֣י הַ/חַיּ֗וֹת מַשִּׁיקוֹת֙ אִשָּׁ֣ה אֶל אֲחוֹתָ֔/הּ וְ/ק֥וֹל הָ/אוֹפַנִּ֖ים לְ/עֻמָּתָ֑/ם וְ/ק֖וֹל רַ֥עַשׁ גָּדֽוֹל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/013.yaml
  text: and the sound of the wings of the living creatures touching one another[a], and the sound of the wheels beside them[c][b], and the sound of a great rumbling.
  footnotes:
  - marker: a
    text: Literally, 'touching, each one to her sister'—a Hebrew idiom meaning corresponding to or touching one another.
    reason: lexical_alternative
  - marker: b
    text: Or 'opposite them' for 'beside them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a great noise' or 'a great rattling.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 살아 있는 것들의 날개가 서로 닿는 소리와, 그들 곁에 있는 바퀴들의 소리와, 큰 우르렁거림의 소리가 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘각기 자기의 자매에게 닿는’이지만, 여기서는 날개들이 서로 맞닿아 있는 모습을 뜻합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘그들 맞은편에 있는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘큰 소리’나 ‘큰 굉음’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  english_pob_choice: sound
  chosen_korean: 소리
  alternatives_korean:
  - 음성
  - 잡음
  lexicon: HALOT
  rationale: 환상 장면의 여러 청각적 요소를 두루 가리키므로, 발화가 아닌 일반적 청각 표현인 ‘소리’가 가장 자연스럽습니다.
- source_word: כַּנְפֵי הַחַיּוֹת
  english_pob_choice: the wings of the living creatures
  chosen_korean: 살아 있는 것들의 날개
  alternatives_korean:
  - 생물들의 날개
  - 살아 있는 존재들의 날개
  lexicon: HALOT
  rationale: 에스겔 1장의 환상 맥락을 따라 חַיּוֹת은 ‘살아 있는 것들’로 옮기되, 대상이 날개이므로 소유 관계를 분명히 했습니다.
- source_word: מַשִּׁיקוֹת אִשָּׁה אֶל אֲחוֹתָהּ
  english_pob_choice: touching one another
  chosen_korean: 서로 닿는
  alternatives_korean:
  - 각기 자기의 짝에 닿는
  - 이것이 저것에 닿는
  lexicon: HALOT
  rationale: 히브리어 관용구의 직역보다, 날개들 사이의 상호 접촉이라는 뜻을 자연스럽게 드러내는 표현이 적절합니다.
- source_word: לְעֻמָּתָם
  english_pob_choice: beside them
  chosen_korean: 그들 곁에 있는
  alternatives_korean:
  - 그들 맞은편에 있는
  - 그들 옆에 있는
  lexicon: HALOT
  rationale: 공간적 근접을 분명히 하면서도, ‘맞은편’의 가능성을 과도하게 강조하지 않는 표현을 택했습니다.
- source_word: רַעַשׁ גָּדוֹל
  english_pob_choice: a great rumbling
  chosen_korean: 큰 우르렁거림
  alternatives_korean:
  - 큰 요란한 소리
  - 큰 굉음
  lexicon: HALOT
  rationale: רַעַשׁ의 흔들림·요동이 섞인 울림을 살리기 위해 단순한 ‘소리’보다 압도적인 저음을 느끼게 하는 표현을 사용했습니다.
theological_decisions:
- issue: 환상 청각 묘사의 강도 보존
  chosen_reading: ‘큰 우르렁거림’으로 옮겨, 단순한 소음이 아니라 하나님의 보좌 환상에 수반되는 위압적 울림을 드러냈습니다.
  alternative_readings:
  - 큰 소리
  - 큰 굉음
  rationale: 본문의 רַעַשׁ גָּדוֹל은 시각적 장면을 보강하는 강한 청각 이미지이므로, 의미를 약화시키지 않는 범위에서 힘 있는 한국어를 택했습니다.
  doctrine_reference: 에스겔 1–3장의 보좌 환상
