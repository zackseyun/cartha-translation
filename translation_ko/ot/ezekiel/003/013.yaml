theological_decisions:
- issue: 환상 청각 묘사의 강도 보존
  chosen_reading: ‘큰 우르렁거림’으로 옮겨, 단순한 소음이 아니라 하나님의 보좌 환상에 수반되는 위압적 울림을 드러냈습니다.
  alternative_readings:
  - 큰 소리
  - 큰 굉음
  rationale: 본문의 רַעַשׁ גָּדוֹל은 시각적 장면을 보강하는 강한 청각 이미지이므로, 의미를 약화시키지 않는 범위에서 힘 있는 한국어를 택했습니다.
  doctrine_reference: 에스겔 1–3장의 보좌 환상
