id: EZK.3.14
reference: Ezekiel 3:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ר֥וּחַ נְשָׂאַ֖תְ/נִי וַ/תִּקָּחֵ֑/נִי וָ/אֵלֵ֥ךְ מַר֙ בַּ/חֲמַ֣ת רוּחִ֔/י וְ/יַד יְהוָ֥ה עָלַ֖/י חָזָֽקָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/014.yaml
  text: And the Spirit lifted me up and took me away[a], and I went in bitterness, in the heat of my spirit[b], while the hand of Yahweh was strong upon me.
  footnotes:
  - marker: a
    text: Or 'a spirit lifted me up'; 'wind' is also possible for the Hebrew word translated 'Spirit.'
    reason: alternative_reading
  - marker: b
    text: The phrase 'in the heat of my spirit' may also be understood as 'in the rage of my spirit' or 'in the wrath of my spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 영이 나를 들어올려 나를 데려가셨고, 나는 내 영의 격한 열기 가운데서 쓰디쓰게 갔습니다. 그러나 야훼의 손이 내 위에 강하게 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 영’은 ‘한 영’이나 ‘바람’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘내 영의 격한 열기’는 ‘내 영의 분노’ 또는 ‘내 영의 격노’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְר֥וּחַ
  english_pob_choice: the Spirit
  chosen_korean: 그 영
  alternatives_korean:
  - 한 영
  - 바람
  lexicon: HALOT
  rationale: 문맥상 예언자의 이동과 계시를 일으키는 주체이므로 단순한 바람보다 인격적·신적 주체를 살린 ‘그 영’이 가장 적절합니다.
- source_word: נְשָׂאַתְנִי
  english_pob_choice: lifted me up
  chosen_korean: 나를 들어올려
  alternatives_korean:
  - 나를 들어
  - 나를 들어올리고
  lexicon: HALOT
  rationale: נשא의 물리적 상승 이미지를 살리면서, 다음 동사 ‘데려가셨고’와 함께 비전적 이동의 연속성을 자연스럽게 드러냅니다.
- source_word: בַּחֲמַת רוּחִי
  english_pob_choice: in the heat of my spirit
  chosen_korean: 내 영의 격한 열기 가운데서
  alternatives_korean:
  - 내 영의 분노 가운데서
  - 내 영의 격노 가운데서
  - 내 영의 뜨거움 가운데서
  lexicon: HALOT
  rationale: חמה는 ‘열기/분노/격노’의 여지를 가지므로, 영어 POB가 남긴 긴장을 반영해 ‘격한 열기’로 옮겨 감정의 강도와 의미의 개방성을 함께 보존했습니다.
- source_word: וְיַד יְהוָה עָלַי חָזָקָה
  english_pob_choice: while the hand of Yahweh was strong upon me
  chosen_korean: 야훼의 손이 내 위에 강하게 있었습니다
  alternatives_korean:
  - 야훼의 손이 내 위에 강했습니다
  - 야훼의 손이 내게 강하게 임했습니다
  lexicon: HALOT
  rationale: ‘손’이라는 관용구를 그대로 살리고, חזקה의 강한 압박·지배감을 ‘강하게 있었습니다’로 비교적 직역에 가깝게 표현했습니다.
theological_decisions:
- issue: 초두 רוּחַ의 지시 대상
  chosen_reading: 신적 영으로 읽되, 한국어에서는 문맥상 특정 가능한 ‘그 영’으로 제시했습니다.
  alternative_readings:
  - 한 영
  - 바람
  rationale: 주변의 예언적 환상 이동 문맥이 비인격적 바람보다 신적 주체를 더 강하게 지지하므로, 본문 의미를 흐리지 않으면서도 POB의 해석적 유보를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 하나님의 고유 이름을 직접 사용하므로, 프로젝트 기본 원칙에 따라 전통적 대체어보다 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
