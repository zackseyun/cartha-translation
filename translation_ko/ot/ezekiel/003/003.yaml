  lexicon: HALOT
  rationale: 히브리어의 말아 놓은 글물체를 한국어 전통 성경어인 ‘두루마리’로 자연스럽게 살렸습니다.
- source_word: נֹתֵן
  english_pob_choice: I am giving
  chosen_korean: 주는
  alternatives_korean:
  - 주고 있는
  - 줄
  - 내가 주는
  lexicon: HALOT
  rationale: 분사형이 진행 중인 행위를 나타내므로 ‘내가 너에게 주는’으로 현재적 장면성을 유지했습니다.
- source_word: כִּדְבַשׁ לְמָתוֹק
  english_pob_choice: as sweet as honey
  chosen_korean: 꿀처럼 달았습니다
  alternatives_korean:
  - 꿀같이 달았습니다
  - 꿀처럼 아주 달았습니다
