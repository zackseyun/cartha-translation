  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ בִּטְנְ/ךָ֤ תַֽאֲכֵל֙ וּ/מֵעֶ֣י/ךָ תְמַלֵּ֔א אֵ֚ת הַ/מְּגִלָּ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֣ן אֵלֶ֑י/ךָ וָ/אֹ֣כְלָ֔/ה וַ/תְּהִ֥י בְּ/פִ֖/י כִּ/דְבַ֥שׁ לְ/מָתֽוֹק־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/003.yaml
  text: And he said to me[a], “Son of man, feed your belly and fill your inward parts with this scroll that I am giving you.” So I ate it, and it was in my mouth as sweet as honey.
  footnotes:
  - marker: a
    text: Or “human one,” “mortal.” The Hebrew idiom “son of man” is retained here as Ezekiel’s repeated form of address.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. “인자야, 네 배를 먹이고 네 속을 이 두루마리로 채우라. 내가 너에게 주는 이 두루마리를 말이다.” 그래서 제가 그것을 먹었더니, 제 입에서는 꿀처럼 달았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인자’는 이 본문에서 에스겔에게 반복적으로 주어지는 히브리어 관용 호칭을 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 인간아
  - 사람의 아들
  lexicon: HALOT
  rationale: 에스겔의 반복적 호칭으로서 관용적 의미를 살리되, 한국어에서는 직역형 ‘사람의 아들’보다 예언자 호칭으로 기능하는 ‘인자’가 더 자연스럽고 본문 연결도 분명합니다.
- source_word: בִּטְנְךָ
  english_pob_choice: your belly
  chosen_korean: 네 배
  alternatives_korean:
  - 네 배속
  - 네 복부
  - 네 뱃속
  lexicon: HALOT
  rationale: 먹는 이미지가 매우 구체적이므로, 신체 내부의 감각을 살리는 일상적 표현 ‘배’를 택했습니다.
- source_word: תַאֲכֵל
  english_pob_choice: feed
  chosen_korean: 먹이고
  alternatives_korean:
  - 먹으라
  - 먹게 하라
  - 먹여라
  lexicon: HALOT
  rationale: 히필의 사역적 뉘앙스를 반영해 단순한 ‘먹다’보다 ‘먹이다’로 옮겼고, 앞의 신체 이미지와도 잘 맞습니다.
- source_word: וּמֵעֶיךָ
  english_pob_choice: your inward parts
  chosen_korean: 네 속
  alternatives_korean:
  - 네 내장
  - 네 깊은 곳
  - 네 속사람
  lexicon: HALOT
  rationale: ‘속’은 내장까지 포함하는 한국어의 넓은 몸 안쪽 표현으로, 문맥의 육체적·은유적 긴장을 과장 없이 담아냅니다.
- source_word: הַמְּגִלָּה
  english_pob_choice: scroll
  chosen_korean: 두루마리
  alternatives_korean:
  - 책
  - 문서
  - 두루마리 책
  lexicon: HALOT
  rationale: 히브리어의 말아 놓은 글물체를 한국어 전통 성경어인 ‘두루마리’로 자연스럽게 살렸습니다.
- source_word: נֹתֵן
  english_pob_choice: I am giving
  chosen_korean: 주는
  alternatives_korean:
  - 주고 있는
  - 줄
  - 내가 주는
  lexicon: HALOT
  rationale: 분사형이 진행 중인 행위를 나타내므로 ‘내가 너에게 주는’으로 현재적 장면성을 유지했습니다.
- source_word: כִּדְבַשׁ לְמָתוֹק
  english_pob_choice: as sweet as honey
  chosen_korean: 꿀처럼 달았습니다
  alternatives_korean:
  - 꿀같이 달았습니다
  - 꿀처럼 아주 달았습니다
  - 꿀같이 매우 달았습니다
  lexicon: HALOT
  rationale: 히브리어의 비교와 품질을 간결하게 살려, 맛의 인상을 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 예언자에게 주어진 두루마리 섭취의 신체-상징 결합
  chosen_reading: 말씀이 내부로 들어와 예언자의 존재를 채우는 장면을, 실제 섭취와 상징적 내면화가 함께 드러나도록 옮겼습니다.
  alternative_readings:
  - 말씀을 단순히 ‘받아들이다’로 완화하는 번역
  - 상징성을 앞세워 육체적 섭취 이미지를 약화하는 번역
  rationale: 본문은 실제로 먹는 행위와 내면 충만을 함께 제시하므로, 둘 중 하나로 평탄화하지 않고 동시에 드러내는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 예언자적 소명 본문 해석; 본문 문맥상 상징행위의 문자성 유지
