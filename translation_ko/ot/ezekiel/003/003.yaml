  rationale: ‘속’은 내장까지 포함하는 한국어의 넓은 몸 안쪽 표현으로, 문맥의 육체적·은유적 긴장을 과장 없이 담아냅니다.
- source_word: הַמְּגִלָּה
  english_pob_choice: scroll
