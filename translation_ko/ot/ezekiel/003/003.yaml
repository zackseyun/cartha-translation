  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ בִּטְנְ/ךָ֤ תַֽאֲכֵל֙ וּ/מֵעֶ֣י/ךָ תְמַלֵּ֔א אֵ֚ת הַ/מְּגִלָּ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֣ן אֵלֶ֑י/ךָ וָ/אֹ֣כְלָ֔/ה וַ/תְּהִ֥י בְּ/פִ֖/י כִּ/דְבַ֥שׁ לְ/מָתֽוֹק־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/003.yaml
  text: And he said to me[a], “Son of man, feed your belly and fill your inward parts with this scroll that I am giving you.” So I ate it, and it was in my mouth as sweet as honey.
  footnotes:
  - marker: a
    text: Or “human one,” “mortal.” The Hebrew idiom “son of man” is retained here as Ezekiel’s repeated form of address.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. “인자야, 내가 네게 주는 이 두루마리를 배가 부르도록 먹고 네 속을 채우십시오.” 그래서 제가 그것을 먹으니, 그것이 제 입에서 꿀처럼 달았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인자’는 에스겔에게 반복하여 사용되는 히브리어 관용 호칭입니다. ‘사람아’ 또는 ‘인간아’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 인간아
  - 사람의 아들
  lexicon: HALOT
  rationale: 에스겔의 반복적 호칭으로서 관용적 의미를 살리되, 한국어에서는 직역형 ‘사람의 아들’보다 예언자 호칭으로 기능하는 ‘인자’가 더 자연스럽고 본문 연결도 분명합니다.
- source_word: בִּטְנְךָ
