translation:
  language: ko
  text: 그때 그가 저에게 말씀하셨습니다. 「인자야, 가서 이스라엘의 집에 이르러 내 말들을 그들에게 전하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인자’는 에스겔에서 반복되는 관용적 호칭입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  english_pob_choice: Then he said to me
  chosen_korean: 그때 그가 저에게 말씀하셨습니다
  alternatives_korean:
  - 그리고 그가 저에게 말씀하셨습니다
  - 그가 저에게 말씀하셨습니다
  lexicon: WLC; POB English audit trail
  rationale: 완결된 서술 전진을 살리기 위해 ‘그때’로 처리했고, 하나님의 직접 발화 맥락이므로 ‘말씀하셨습니다’가 가장 자연스럽고 존대에 맞습니다.
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 인간아
  - 죽을 자야
  lexicon: WLC; HALOT
  rationale: 에스겔에서 반복되는 호칭을 관용적으로 유지하되, 표준 한국어 성경에서 널리 쓰이는 ‘인자’로 옮겨 문학적·예언자적 울림을 보존했습니다.
- source_word: לֶךְ בֹּא
  english_pob_choice: go, come
  chosen_korean: 가서
  alternatives_korean:
  - 가서 들어가서
  - 가라, 와라
  lexicon: WLC; HALOT
  rationale: 히브리어의 이중 명령을 한국어에서 과도하게 어색하게 반복하지 않고, 핵심 동작 명령을 유지하는 방향으로 ‘가서’로 옮겼습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘의 집
  alternatives_korean:
  - 이스라엘 백성
  - 이스라엘 집안
  lexicon: WLC; HALOT
  rationale: 예언서의 상투적 표현을 살려 공동체적·언약적 뉘앙스를 보존하기 위해 직역 성격의 ‘이스라엘의 집’을 유지했습니다.
- source_word: בִּדְבָרַי
  english_pob_choice: my words
  chosen_korean: 내 말들을
  alternatives_korean:
  - 내 말씀을
  - 내 메시지를
  - 내 말로
  lexicon: WLC; HALOT
  rationale: 복수형 ‘말들’을 살려 원문의 형식을 반영했고, 예언자가 자신의 내용을 만들지 말고 하나님의 발화를 전달한다는 점을 직접적으로 드러냈습니다.
theological_decisions:
- issue: 하나님의 직접 화법에 대한 문체
  chosen_reading: 서술문은 합쇼체로 유지하되, 직접 발화 안의 명령은 예언자적 호칭과 공적 지시의 성격을 살려 자연스러운 명령형으로 처리했습니다.
  alternative_readings:
  - 직접 발화까지 모두 서술체로 평탄화
  - 고어체 명령형 사용
  rationale: 원문의 권위와 예언 명령의 긴장을 보존하면서도 현대 한국어 독자가 바로 이해할 수 있는 문체를 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
