id: EZK.3.21
reference: Ezekiel 3:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֞ה כִּ֧י הִזְהַרְתּ֣/וֹ צַדִּ֗יק לְ/בִלְתִּ֥י חֲטֹ֛א צַדִּ֖יק וְ/ה֣וּא לֹא חָטָ֑א חָי֤וֹ יִֽחְיֶה֙ כִּ֣י נִזְהָ֔ר וְ/אַתָּ֖ה אֶֽת נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/021.yaml
  text: But if you warn a righteous man not to sin[a], and he does not sin, he will surely live because he took warning, and you will have delivered your life.
  footnotes:
  - marker: a
    text: Or 'he was warned' or 'he heeded the warning.' The Hebrew verb can emphasize either receiving the warning or responding to it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 네가 의인을 경고하여 죄를 짓지 않게 하면, 그가 죄를 짓지 않을 것이니, 그가 경고를 받았으므로 반드시 살 것입니다. 그리고 너는 네 생명을 건져낼 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경고를 받았으므로’는 히브리어 נִזְהָר의 범위를 따라 ‘경고를 받다’와 ‘경고를 새겨듣다’의 가능성을 함께 열어 둡니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִזְהַרְתּוֹ
  english_pob_choice: if you warn him
  chosen_korean: 네가 의인을 경고하여
  alternatives_korean:
  - 네가 의인에게 경고하여
  - 네가 의인을 경고하면
  lexicon: HALOT
  rationale: 히필 동사 הזהר는 ‘경고하다/경고를 주다’의 뜻이므로 ‘경고하다’로 옮겼습니다. 조건문 앞머리의 כִּי는 문맥상 ‘~하면’의 의미이지만, 자연스러운 한국어를 위해 조건 절 전체를 매끈하게 연결했습니다.
- source_word: צַדִּיק
  english_pob_choice: a righteous man
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 그 의인
  lexicon: HALOT
  rationale: 형용사가 명사적으로 쓰인 표현이지만 한국어에서는 성별을 드러내는 ‘사람/남자’보다 본래 종교·윤리적 범주를 살리는 ‘의인’이 더 직접적입니다. 여기서는 특정 개인을 일반화한 조건문이므로 관사성도 별도로 표시하지 않았습니다.
- source_word: לְבִלְתִּי חֲטֹא
  english_pob_choice: not to sin
  chosen_korean: 죄를 짓지 않게
  alternatives_korean:
  - 죄짓지 않게
  - 죄를 범하지 않게
  lexicon: HALOT
  rationale: 부정 목적 구문은 ‘~하지 않게’로 옮기면 경고의 목적과 예방의 뉘앙스가 자연스럽게 살아납니다. ‘죄를 짓다’는 성경적 죄 개념을 현대 한국어에서 가장 무리 없이 전달합니다.
- source_word: נִזְהָר
  english_pob_choice: he took warning
  chosen_korean: 그가 경고를 받았으므로
  alternatives_korean:
  - 그가 경고를 받아들였으므로
  - 그가 경고를 새겨들었으므로
  lexicon: HALOT
  rationale: נזהר는 단순한 수동(‘경고를 받다’)과 경고에 대한 반응 모두를 포함할 수 있어, POB의 각주 취지를 따라 ‘경고를 받았으므로’로 처리했습니다. 한국어 본문은 결과를 자연스럽게 보여 주면서도 해석을 과도하게 좁히지 않습니다.
- source_word: חָיוֹ יִחְיֶה
  english_pob_choice: he will surely live
  chosen_korean: 반드시 살 것입니다
  alternatives_korean:
  - 확실히 살 것입니다
  - 꼭 살아날 것입니다
  lexicon: HALOT
  rationale: 부정사 절대형+미완료형의 강조를 한국어 부사 ‘반드시’로 옮겨 확실성을 드러냈습니다. ‘살다’는 원문처럼 생명 보존의 약속을 간결하게 전달합니다.
- source_word: נַפְשְׁךָ
  english_pob_choice: your life
  chosen_korean: 네 생명
  alternatives_korean:
  - 네 목숨
  - 네 영혼
  lexicon: HALOT
  rationale: 네페쉬는 כאן에서 비물질적 ‘영혼’보다 생명/목숨의 뜻이 분명하므로 ‘생명’으로 번역했습니다. ‘목숨’도 가능하지만 문맥상 보다 중립적이고 공적 문체에 맞는 표현은 ‘생명’입니다.
theological_decisions:
- issue: 너는 네 생명을 건져낼 것입니다의 의미
  chosen_reading: 이는 예언자의 개인적 구원을 말하기보다, 경고 책임을 다함으로써 하나님 앞에서의 책임과 피값의 문제에서 벗어난다는 뜻으로 보았습니다.
  alternative_readings:
  - 영적으로 스스로를 구원한다는 뜻
  - 단지 육체적 생존만을 말한다는 뜻
  rationale: 에스겔의 파수꾼 문맥에서는 경고 여부가 상대의 죽음에 대한 책임을 묻는 법정적·언약적 틀 안에 있습니다. 따라서 ‘건져내다’는 책임 면제의 의미를 살리되, 자기구원 교리로 오해되지 않게 유지했습니다.
  doctrine_reference: 파수꾼 본문(겔 3장)에서의 책임과 혈흔/책임 개념을 보존
