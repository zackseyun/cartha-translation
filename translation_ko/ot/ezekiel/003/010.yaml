id: EZK.3.10
reference: Ezekiel 3:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֶּן אָדָ֕ם אֶת כָּל דְּבָרַ/י֙ אֲשֶׁ֣ר אֲדַבֵּ֣ר אֵלֶ֔י/ךָ קַ֥ח בִּֽ/לְבָבְ/ךָ֖ וּ/בְ/אָזְנֶ֥י/ךָ שְׁמָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/010.yaml
  text: Then he said to me[a], “Son of man, receive in your heart all my words that I speak to you, and hear with your ears.”
  footnotes:
  - marker: a
    text: Or 'take into your heart'; the Hebrew verb is literally 'take,' used here for inward reception of God's words.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그가 저에게 말씀하셨습니다. 「인자야, 내가 너에게 말하는 내 모든 말을 네 마음에 받아들이고, 네 귀로 들으십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 ‘가져가다’이지만, 여기서는 하나님의 말씀을 마음속으로 받아들이는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인간아
  - 아담의 아들아
  lexicon: HALOT
  rationale: 에스겔서의 반복적 호칭을 살리기 위해 직역적 관용구인 ‘인자야’를 택했습니다. ‘사람아’는 자연스럽지만 반복되는 소명 형식의 특색을 약화시킬 수 있습니다.
- source_word: אֶת כָּל דְּבָרַי
  english_pob_choice: all my words
  chosen_korean: 내 모든 말
  alternatives_korean:
  - 내 모든 말씀
  - 내가 하는 모든 말
  - 내 모든 말씀들
  lexicon: HALOT
  rationale: דְּבָרִים의 구체적 어감을 살리면서도 한국어에서 가장 자연스럽게 들리는 표현은 ‘내 모든 말’입니다. ‘말씀’은 문맥상 가능하지만, 여기서는 하나님이 ‘말하는 내용’ 자체를 강조하므로 ‘말’이 더 직접적입니다.
- source_word: קַח בִּלְבָבְךָ
  english_pob_choice: receive in your heart
  chosen_korean: 네 마음에 받아들이고
  alternatives_korean:
  - 네 마음에 간직하고
  - 네 마음속에 받아들이고
  - 네 마음에 담고
  lexicon: HALOT
  rationale: 히브리어 קַח의 문자적 ‘가져가라’보다, 마음으로 내부 수용하라는 관용을 살려 ‘받아들이고’로 옮겼습니다. ‘마음에’는 לֵבָב의 내면성(사고와 의지 포함)을 한국어로 무리 없이 드러냅니다.
- source_word: וּבְאָזְנֶיךָ שְׁמָע
  english_pob_choice: and hear with your ears
  chosen_korean: 네 귀로 들으십시오
  alternatives_korean:
  - 네 귀로 들으소서
  - 네 귀로 들으세요
  - 귀로 듣고
  lexicon: HALOT
  rationale: ‘귀’와 ‘듣다’의 신체적 강조를 살리되, 한국어에서는 ‘귀로 들으십시오’가 가장 자연스럽고 명령형의 직접성을 유지합니다.
theological_decisions:
- issue: 예언자에게 주어지는 직접화법의 호칭과 명령형의 존대 수준
  chosen_reading: 하나님이 에스겔에게 직접 말씀하시는 장면이므로 본문 서술은 합쇼체로 유지하되, 인용문 안의 ‘인자야’와 명령은 원문의 직접성을 살려 평서·명령형으로 처리했습니다.
  alternative_readings:
  - 전면적으로 존대화된 인용문
  - 더 고전적인 성서체 어법
  rationale: 원문은 친밀한 소명과 명령을 담고 있어, 지나친 완곡화보다 화자의 직접성을 보존하는 것이 본문 의미에 더 충실합니다. 다만 한국어 전체 문장 흐름은 현대 합쇼체로 맞췄습니다.
  doctrine_reference: 'POB style principle: source-direct rendering with audience-appropriate modern Korean'
