id: EZK.24.17
reference: Ezekiel 24:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵאָנֵ֣ק דֹּ֗ם מֵתִים֙ אֵ֣בֶל לֹֽא תַֽעֲשֶׂ֔ה פְאֵֽרְ/ךָ֙ חֲב֣וֹשׁ עָלֶ֔י/ךָ וּ/נְעָלֶ֖י/ךָ תָּשִׂ֣ים בְּ/רַגְלֶ֑י/ךָ וְ/לֹ֤א תַעְטֶה֙ עַל שָׂפָ֔ם וְ/לֶ֥חֶם אֲנָשִׁ֖ים לֹ֥א תֹאכֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/017.yaml
  text: Groan silently[a]; do not make mourning for the dead. Bind your turban on yourself, and put your sandals on your feet. Do not cover over your mustache[b], and do not eat the bread of men.
  footnotes:
  - marker: a
    text: Or 'Do not cover your upper lip.' The Hebrew expression may refer specifically to the upper lip area rather than the mustache as facial hair.
    reason: lexical_alternative
  - marker: b
    text: '''The bread of men'' likely refers to food provided by others for mourners, that is, mourners'' bread.'
    reason: lexical_alternative
translation:
  language: ko
  text: 신음하되 잠잠히 있으십시오[a]. 죽은 자를 위해 애곡하지 마십시오. 머리에 쓰는 관을 머리에 동이고, 발에는 신을 신으십시오. 수염을 가리우지 마십시오[b]. 또 사람의 떡을 먹지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘윗입술을 가리지 마십시오.’ 히브리어 표현은 수염보다 윗입술 부위를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람의 떡’은 애도자에게 다른 사람들이 제공하는 음식, 곧 애도용 떡을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵאָנֵק
  english_pob_choice: Groan
  chosen_korean: 신음하되
  alternatives_korean:
  - 끙끙거리되
  - 탄식하되
  lexicon: HALOT
  rationale: אנק의 고통·슬픔의 음성을 살리되, 현대 한국어에서 자연스럽게 들리는 ‘신음하다’를 택했습니다.
- source_word: דֹּם
  english_pob_choice: silently
  chosen_korean: 잠잠히 있으십시오
  alternatives_korean:
  - 조용히 하십시오
  - 침묵하십시오
  lexicon: HALOT
  rationale: ‘침묵/정적’을 뜻하는 명령을 합쇼체로 자연화하되, 단순한 소음 억제보다 태도 전체를 포함하도록 했습니다.
- source_word: פְאֵרְךָ / וְלֹא תַעְטֶה עַל שָׂפָם
  english_pob_choice: your turban / Do not cover over your mustache
  chosen_korean: 머리에 쓰는 관을 머리에 동이고 / 수염을 가리우지 마십시오
  alternatives_korean:
  - 터번을 머리에 두르십시오 / 윗입술을 가리지 마십시오
  - 장식 관을 머리에 쓰십시오 / 입술 위를 덮지 마십시오
  lexicon: HALOT
  rationale: פְאֵר은 애도와 대비되는 장식성 머리쓰개이므로 ‘관’으로 풀고, שָׂפָם은 관용적 의미를 살리면서도 한국어 독자가 이해하기 쉬운 ‘수염’으로 옮겼습니다.
- source_word: וְלֶחֶם אֲנָשִׁים לֹא תֹאכֵל
  english_pob_choice: do not eat the bread of men
  chosen_korean: 사람의 떡을 먹지 마십시오
  alternatives_korean:
  - 사람들이 주는 떡을 먹지 마십시오
  - 애도하는 이들의 떡을 먹지 마십시오
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 본문에서는 직역에 가깝게 유지하고, ‘떡’으로 일상 식사를 자연스럽게 나타냈습니다.
theological_decisions:
- issue: 애도 관습 명령의 표준화 정도
  chosen_reading: 본문이 열거하는 구체적 애도 행위를 설명적으로 옮기되, 각 행위에 후대 제도적 의미를 덧씌우지 않았습니다.
  alternative_readings:
  - 제의적 정결 규정으로 해석하기
  - 단순한 슬픔 표현으로만 약화하기
  rationale: 이 구절은 에스겔에게 금지된 애도 표지들을 나열하는 본문이므로, 상징적 행위의 구체성을 유지하는 번역이 원문 의도를 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy items 1 and 3
