  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֨ה יְחֶזְקֵ֤אל לָ/כֶם֙ לְ/מוֹפֵ֔ת כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה תַּעֲשׂ֑וּ בְּ/בֹאָ֕/הּ וִֽ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/024.yaml
  text: And Ezekiel will be a sign for you; according to all that he has done, you will do. When it comes, then you will know that I am the Lord GOD.
translation:
  language: ko
  text: 에스겔은 너희에게 표징이 될 것입니다. 그가 한 모든 일대로 너희도 할 것입니다. 이것이 이루어질 때, 너희는 내가 주 여호와인 줄 알게 될 것입니다.
  philosophy: formal
lexical_decisions:
- source_word: לָכֶם / לְמוֹפֵת
  english_pob_choice: a sign for you
  chosen_korean: 너희에게 표징이 될 것입니다
  alternatives_korean:
  - 너희를 위한 징조가 될 것입니다
  - 너희에게 표적이 될 것입니다
  lexicon: מוֹפֵת
  rationale: מוֹפֵת는 단순한 예고보다 하나님이 뜻을 드러내는 ‘표징’의 성격이 강하므로, 문맥상 자연스러운 ‘표징’으로 옮겼습니다.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה תַּעֲשׂוּ
  english_pob_choice: according to all that he has done, you will do
  chosen_korean: 그가 한 모든 일대로 너희도 할 것입니다
  alternatives_korean:
  - 그가 행한 모든 것을 너희도 행할 것입니다
  - 그가 한 대로 너희도 할 것입니다
  lexicon: עשה
  rationale: 반복과 대응 관계를 살리기 위해 ‘한 모든 일대로’로 옮겨, 행동의 동일성을 분명히 했습니다.
- source_word: בְּבֹאָהּ
  english_pob_choice: When it comes
  chosen_korean: 이것이 이루어질 때
  alternatives_korean:
  - 그것이 올 때
  - 그 일이 닥칠 때
  lexicon: בוא
  rationale: 여성형 지시의 대상은 앞의 ‘표징/일’ 전체를 가리키므로, 사건의 성취를 드러내는 ‘이루어질 때’로 자연스럽게 풀었습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 여호와
  alternatives_korean:
  - 주 하나님
  - 주 야훼
  lexicon: אדני יהוה
  rationale: 히브리어의 결합형 호칭을 한국어에서 두 요소로 살려, POB의 ‘Lord GOD’에 대응하는 관용적 구성을 유지했습니다.
theological_decisions:
- issue: YHWH divine name rendering
  chosen_reading: 문맥의 호칭인 אֲדֹנָי יְהוִה를 ‘주 여호와’로 옮겨, 표준 교회어와 본문 호칭을 함께 드러냈습니다.
  alternative_readings:
  - 주 야훼
  - 주 하나님
  rationale: 이 절의 POB는 ‘the Lord GOD’로 처리하며, 본문 자체가 호칭의 중첩을 강조하므로 한국어에서도 ‘주’와 신명 대역을 함께 보존하는 편이 적절합니다.
  doctrine_reference: 신명기적 호칭 보존; 본문-독자 이해 일치
