  naturalness: ‘그래서 … 사라지게 하십시오’는 앞선 ‘올려놓으십시오’와 결합할 때 현대 한국어에서 중복되고 부자연스럽습니다. 목적을 앞세운 ‘… 없어지도록, 그것을 … 올려놓으십시오’가 합쇼체 명령문으로 자연스럽고 원문의 문법 관계도 드러냅니다.
