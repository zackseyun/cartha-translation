source:
  edition: WLC
  text: וְ/הַעֲמִידֶ֥/הָ עַל גֶּחָלֶ֖י/הָ רֵקָ֑ה לְמַ֨עַן תֵּחַ֜ם וְ/חָ֣רָה נְחֻשְׁתָּ֗/הּ וְ/נִתְּכָ֤ה בְ/תוֹכָ/הּ֙ טֻמְאָתָ֔/הּ תִּתֻּ֖ם חֶלְאָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/011.yaml
  text: Then set it empty on its coals[a], so that it may become hot and its bronze may glow, and its uncleanness within it may be melted, and its corrosion consumed.
  footnotes:
  - marker: a
    text: Or 'its rust' or 'its scum.' The Hebrew term can refer to corrosion on metal and, by extension in this context, the foul residue representing Jerusalem's moral defilement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 빈 채로 그 숯불 위에 올려놓으십시오. 그래서 그것이 뜨거워지고, 그 놋이 달아오르며, 그 안의 더러움이 녹아내리고, 그 녹이 사라지게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘녹’ 또는 ‘찌꺼기’로도 옮길 수 있습니다. 이 히브리어는 금속의 부식뿐 아니라, 이 문맥에서는 예루살렘의 도덕적 더러움을 상징하는 찌꺼기를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמִידֶהָ
  english_pob_choice: Then set it
  chosen_korean: 그것을…올려놓으십시오
  alternatives_korean:
  - 그것을…놓으십시오
  - 그것을…세우십시오
  lexicon: HALOT
  rationale: 말하는 대상이 냄비이므로 한국어에서는 ‘세우다’보다 ‘올려놓다/놓다’가 자연스럽고, 명령의 연속을 부드럽게 이어 주는 표현으로 보았습니다.
- source_word: עַל גֶּחָלֶיהָ
  english_pob_choice: on its coals
  chosen_korean: 그 숯불 위에
  alternatives_korean:
  - 그 숯불 위로
  - 그 불덩이 위에
  lexicon: HALOT
  rationale: גֶּחָלִים는 타는 숯불을 가리키므로 ‘숯불’이 가장 구체적이며, 물건을 그 위에 두는 장면을 한국어로도 분명하게 드러냅니다.
- source_word: נְחֻשְׁתָּהּ
  english_pob_choice: its bronze
  chosen_korean: 그 놋
  alternatives_korean:
  - 그 청동
  - 그 금속
  lexicon: HALOT
  rationale: 예언적 비유의 금속성 이미지를 살리기 위해 ‘놋’을 택했습니다. 한국어 성경에서 익숙하면서도 원문의 재질감을 유지합니다.
- source_word: בְתוֹכָהּ טֻמְאָתָהּ
  english_pob_choice: its uncleanness within it
  chosen_korean: 그 안의 더러움
  alternatives_korean:
  - 그 안의 부정함
  - 그 안의 불결함
  lexicon: HALOT
  rationale: טֻמְאָה의 의례적·도덕적 오염을 모두 포괄하려고 ‘더러움’을 사용했습니다. ‘부정함’보다 현대 한국어에서 직관적이면서도 경멸적 뉘앙스를 유지합니다.
- source_word: חֶלְאָתָהּ
  english_pob_choice: its corrosion
  chosen_korean: 그 녹
  alternatives_korean:
  - 그 부식
  - 그 찌꺼기
  - 그 찌꺼기 같은 녹
  lexicon: HALOT
  rationale: 이 단어는 금속의 녹·부식을 가리킬 수 있어, 쇠붙이의 표면이 벗겨져 사라지는 이미지를 살리는 ‘녹’이 가장 자연스럽습니다. 본문의 도덕적 상징성도 함께 드러납니다.
theological_decisions:
- issue: 제련 비유와 도덕적 오염 이미지를 함께 살리는 방식
  chosen_reading: 금속이 달아오르고 녹이 사라지는 구체적 장면을 유지하면서, ‘더러움’으로 도덕적·의례적 오염을 함께 표현했습니다.
  alternative_readings:
  - ‘죄악’처럼 추상적으로 옮김
  - ‘찌꺼기’만 강조해 물질적 이미지로 축소
  rationale: 본문은 냄비를 가열해 내부의 오염을 제거하는 행위를 예루살렘의 정결 불가능한 상태를 고발하는 표징으로 사용합니다. 그래서 물질적 이미지와 윤리적 판단을 둘 다 지워서는 안 됩니다.
  doctrine_reference: Translation philosophy §3, §5
