revisions:
- from: 그것을 빈 채로 그 숯불 위에 올려놓으십시오. 그래서 그것이 뜨거워지고, 그 놋이 달아오르며, 그 안의 더러움이 녹아내리고, 그 녹이 사라지게 하십시오.[a]
  to: 그것이 뜨거워지고 그 청동이 달아올라, 그 안의 더러움이 녹아 없어지고 그 부식이 다 없어지도록, 그것을 빈 채로 그 숯불 위에 올려놓으십시오.[a]
  rationale: 히브리어의 단일 명령(‘그것을 … 올려놓으십시오’)과 그 목적(가열, 청동의 달아오름, 내부 더러움의 녹아 없어짐, 부식의 소멸)을 한국어의 ‘…하도록’ 구조로 재구성했습니다. 이는 가열된 냄비라는 구체적 장면과 도덕적·의례적 오염의 비유를 모두 보존합니다. ‘청동’과 ‘부식’을 사용하되 각주에서 가능한 대안을 밝혀 어휘적 불확실성을 과도하게 해소하지 않았습니다.
