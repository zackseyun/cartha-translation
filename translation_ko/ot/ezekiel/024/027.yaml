source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִפָּ֤תַח פִּ֨י/ךָ֙ אֶת הַ/פָּלִ֔יט וּ/תְדַבֵּ֕ר וְ/לֹ֥א תֵֽאָלֵ֖ם ע֑וֹד וְ/הָיִ֤יתָ לָ/הֶם֙ לְ/מוֹפֵ֔ת וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/027.yaml
  text: On that day your mouth will be opened when the fugitive comes to you[a], and you will speak and no longer be mute. So you will be a sign to them, and they will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'with the survivor'; the Hebrew phrase is difficult, and may refer to the time when the fugitive arrives with news.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 도망자가 너에게 올 때[a] 네 입이 열리고, 너는 말할 것이며 더 이상 말을 하지 못하지는 않을 것입니다. 그러면 너는 그들에게 표징이 될 것이며, 그들은 내가 야훼인 줄 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 구문상 어렵습니다. 문맥상 예루살렘 함락 소식을 전하는 도망자(또는 생존자)가 도착할 때를 가리킬 수 있습니다. 또는 ‘그 도망자와 함께’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: On that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 날에
  - 그때에
  lexicon: HALOT
  rationale: 예언문맥의 관용적 시간표현을 자연스럽게 살리되, 특정한 종말론적 ‘그날’의 지시를 유지했습니다.
- source_word: יִפָּתַח פִּיךָ
  english_pob_choice: your mouth will be opened
  chosen_korean: 네 입이 열려
  alternatives_korean:
  - 네 입이 열릴 것이며
  - 네 입이 열리게 되어
  lexicon: HALOT
  rationale: 히브리어 수동형을 한국어 자연문으로 옮기되, 에스겔의 침묵이 풀리는 상태 변화를 분명히 했습니다.
- source_word: אֶת הַפָּלִיט
  english_pob_choice: when the fugitive comes to you
  chosen_korean: 도망자가 너에게 올 때
  alternatives_korean:
  - 피난자가 너에게 올 때
  - 생존자가 너에게 올 때
  lexicon: HALOT
  rationale: פָּלִיט은 ‘달아난 자/도망한 자’의 뜻이 강해, 문맥상 예루살렘 함락 소식을 전하는 피난자를 가리키는 자연스러운 표현으로 옮겼습니다.
- source_word: וְהָיִיתָ לָהֶם לְמוֹפֵת
  english_pob_choice: So you will be a sign to them
  chosen_korean: 그렇게 너는 그들에게 표징이 될 것이며
  alternatives_korean:
  - 그리고 너는 그들에게 표징이 될 것이며
  - 너는 그들에게 징조가 될 것이며
  lexicon: HALOT
  rationale: מוֹפֵת은 단순한 표시보다 예언적 ‘표징/징조’의 성격이 있어, 에스겔의 상징행위 문맥을 살려 ‘표징’을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 계약적 신명 יְהוָה는 본 프로젝트 기본어휘에 따라 ‘야훼’로 옮겨, 호칭으로 대체하지 않고 고유한 신명을 보존했습니다.
theological_decisions:
- issue: 에스겔의 입이 열리는 시점과 도망자의 도착의 관계
  chosen_reading: 도망자가 너에게 올 때 입이 열리는 것으로, 침묵의 해제와 소식의 도착이 연결된 표징으로 이해했습니다.
  alternative_readings:
  - 단순히 그날 일반적으로 말하게 된다는 뜻
  - 도망자와의 동반/동행을 뜻한다는 해석
  rationale: 본문은 24:26-27의 문맥에서 예언자의 침묵 해제가 예루살렘 함락의 전달자 도착과 결부된다는 점을 드러내므로, 그 연결을 약화하지 않았습니다.
  doctrine_reference: Ezekiel 24:26-27; Ezekiel 33:21-22
