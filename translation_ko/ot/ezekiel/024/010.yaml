  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַרְבֵּ֤ה הָ/עֵצִים֙ הַדְלֵ֣ק הָ/אֵ֔שׁ הָתֵ֖ם הַ/בָּשָׂ֑ר וְ/הַרְקַח֙ הַ/מֶּרְקָחָ֔ה וְ/הָ/עֲצָמ֖וֹת יֵחָֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/010.yaml
  text: Pile up the wood[a], kindle the fire, cook the flesh thoroughly, and boil the broth[d][c][b]; and let the bones be charred.
  footnotes:
  - marker: a
    text: Or "heap up the wood."
    reason: lexical_alternative
  - marker: b
    text: Or "cook the meat completely." The Hebrew literally says "the flesh."
    reason: lexical_alternative
  - marker: c
    text: Or "prepare the mixture" or "boil the stew."
    reason: lexical_alternative
  - marker: d
    text: Or "let the bones be burned/scorched."
    reason: lexical_alternative
translation:
  language: ko
  text: 나무를 많이 쌓고, 불을 지피고, 고기를 충분히 익히고, 국물을 끓이십시오. 그리고 뼈는 타들어가게 하십시오.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나무를 많이 쌓고’는 ‘나무를 쌓아 올리고’라는 뜻도 됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘살/육체’를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘국물’은 여기서 섞어 끓이는 액체를 가리키는 번역입니다.
    reason: lexical_alternative
  - marker: d
    text: ‘타들어가게 하십시오’는 ‘불에 타서 그을리게 하십시오’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבֵּה הָעֵצִים
  english_pob_choice: Pile up the wood
  chosen_korean: 나무를 많이 쌓고
  alternatives_korean:
  - 장작을 쌓고
  - 나무를 쌓아 올리고
  lexicon: HALOT
  rationale: 동사 רבה의 사역적 뉘앙스를 살리면서, 한국어에서는 ‘많이 쌓다’가 자연스럽고 ‘pile up’의 압박감을 전달합니다.
- source_word: הַדְלֵק הָאֵשׁ
  english_pob_choice: kindle the fire
  chosen_korean: 불을 지피고
  alternatives_korean:
  - 불을 붙이고
  - 불을 일으키고
  lexicon: HALOT
  rationale: 불을 내고 유지하는 명령으로서 ‘지피다’가 가장 직접적이며, 단순한 점화보다 지속적 연소의 이미지를 담습니다.
- source_word: הָתֵם הַבָּשָׂר
  english_pob_choice: cook the flesh thoroughly
  chosen_korean: 고기를 충분히 익히고
  alternatives_korean:
  - 육체를 완전히 익히고
  - 살을 충분히 익히고
  lexicon: HALOT
  rationale: 히브리어 בשר의 직역 ‘살/육체’보다 한국어에서는 조리 맥락상 ‘고기’가 읽기 쉽지만, ‘충분히 익히다’로 완결성을 유지합니다.
- source_word: וְהַרְקַח הַמֶּרְקָחָה
  english_pob_choice: boil the broth
  chosen_korean: 국물을 끓이십시오
  alternatives_korean:
  - 혼합물을 끓이십시오
  - 찌개를 끓이십시오
  lexicon: HALOT
  rationale: רקח와 מֶרְקָחָה는 ‘섞인 액체/조제물’의 뜻이 있으나, 문맥상 솥 안의 액체를 가리키므로 ‘국물’이 과도한 해석 없이 의미를 전달합니다.
- source_word: יֵחָרוּ
  english_pob_choice: let the bones be charred
  chosen_korean: 뼈는 타들어가게 하십시오
  alternatives_korean:
  - 뼈는 그을리게 하십시오
  - 뼈는 숯처럼 타게 하십시오
  lexicon: HALOT
  rationale: 뼈가 강한 열로 손상되는 결과를 살리되, ‘타들어가다’가 ‘charred’의 지속적이고 심한 열화를 한국어로 자연스럽게 표현합니다.
theological_decisions:
- issue: 예언적 조리 명령의 어조
  chosen_reading: 명령형을 그대로 살려, 대상에게 직접 조리 행위를 지시하는 거친 예언적 이미지로 옮겼습니다.
  alternative_readings:
  - 완곡하게 풀어 ‘가열하여 준비하십시오’로 옮길 수 있음
  rationale: 본문은 상징적 심판 행위를 매우 노골적으로 드러내므로, 완화하지 않고 직접적인 명령문을 유지하는 것이 원문의 효과에 부합합니다.
  doctrine_reference: 예레미야/에스겔의 심판 예언 문맥
