source:
  edition: WLC
  text: הַרְבֵּ֤ה הָ/עֵצִים֙ הַדְלֵ֣ק הָ/אֵ֔שׁ הָתֵ֖ם הַ/בָּשָׂ֑ר וְ/הַרְקַח֙ הַ/מֶּרְקָחָ֔ה וְ/הָ/עֲצָמ֖וֹת יֵחָֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/010.yaml
  text: Pile up the wood[a], kindle the fire, cook the flesh thoroughly, and boil the broth[d][c][b]; and let the bones be charred.
  footnotes:
