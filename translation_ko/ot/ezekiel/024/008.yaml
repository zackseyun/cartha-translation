source:
  edition: WLC
  text: לְ/הַעֲל֤וֹת חֵמָה֙ לִ/נְקֹ֣ם נָקָ֔ם נָתַ֥תִּי אֶת דָּמָ֖/הּ עַל צְחִ֣יחַ סָ֑לַע לְ/בִלְתִּ֖י הִכָּסֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/008.yaml
  text: To stir up wrath[a], to take vengeance, I have set her blood on a bare rock[b], so that it would not be covered.
  footnotes:
  - marker: a
    text: Or 'to avenge with vengeance'; the Hebrew uses an infinitive with a cognate noun for emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''Her blood'' may also carry the sense of ''her bloodshed'' or bloodguilt in context, but the Hebrew image is literally ''her blood.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 진노를 일으키고 복수하기[a] 위하여, 나는 그 피를 민둥바위 위에 두어[b] 그것이 덮이지 않게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘복수하다’라는 동사와 같은 어근의 명사를 함께 써서 강조합니다. 직역하면 ‘복수를 복수하기’와 같습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 피’는 문맥상 ‘피흘림’이나 피의 죄를 뜻할 수도 있지만, 히브리어는 문자적으로 ‘그녀의 피’를 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַעֲלוֹת חֵמָה
  english_pob_choice: to stir up wrath
  chosen_korean: 격분을 일으키고
  alternatives_korean:
  - 진노를 일으키고
  - 분노를 불러일으키고
  lexicon: HALOT
  rationale: 히필 부정사와 חֵמָה의 결합은 단순한 감정 묘사보다 ‘일으키다/불러일으키다’의 인과를 드러냅니다. ‘격분’은 예언적 심판 문맥의 강한 감정을 살리면서도 한국어로 자연스럽습니다.
- source_word: לִנְקֹם נָקָם
  english_pob_choice: to take vengeance
  chosen_korean: 복수하기 위하여
  alternatives_korean:
  - 원수를 갚기 위하여
  - 보복하기 위하여
  lexicon: HALOT
  rationale: 명사와 동사의 반복은 강조를 이루므로, 한국어에서는 간결하게 ‘복수하기’로 옮겨 강조 효과를 살렸습니다. 문맥상 인간적 감정이 아니라 न्याय적 응보를 가리키지만, 본문의 강도를 유지하기 위해 직역에 가까운 표현을 택했습니다.
- source_word: דָּמָהּ
  english_pob_choice: her blood
  chosen_korean: 그 피
  alternatives_korean:
  - 그 피흘림
  - 그 유혈
  lexicon: HALOT
  rationale: 히브리어의 단수형 ‘피’를 유지해 이미지의 구체성을 보존했습니다. 문맥상 ‘피흘림/피의 죄’의 뉘앙스가 있을 수 있으나, 본문 자체의 표상을 앞세우는 것이 더 적절합니다.
- source_word: צְחִיחַ סָלַע
  english_pob_choice: a bare rock
  chosen_korean: 벌거벗은 바위
  alternatives_korean:
  - 드러난 바위
  - 민둥바위
  lexicon: HALOT
  rationale: ‘צְחִיחַ’은 덮이거나 흡수되지 않는 노출된 표면을 가리키므로, ‘벌거벗은’은 시각적 대비를 강하게 전달합니다. ‘바위 위에’라는 위치 표현도 원문의 이미지를 그대로 반영합니다.
- source_word: לְבִלְתִּי הִכָּסוֹת
  english_pob_choice: so that it would not be covered
  chosen_korean: 그것이 덮이지 않게
  alternatives_korean:
  - 그것이 가려지지 않게
  - 덮여 있지 않도록
  lexicon: HALOT
  rationale: 목적/결과를 나타내는 구조이므로 한국어에서는 종속절로 자연스럽게 풀었습니다. ‘덮이지 않게’는 피가 공공연히 드러난 상태를 분명히 합니다.
theological_decisions:
- issue: 하나님의 의도적 심판 행위
  chosen_reading: 화자(하나님)가 의도적으로 피를 드러내어 격분과 복수가 일어나게 하신다는 심판 선언으로 옮겼습니다.
  alternative_readings:
  - 단순히 피의 노출 상태를 묘사하는 말로만 읽을 수 있습니다.
  rationale: 첫 인칭 동사 ‘나는 두었다/배치하였다’와 목적 부정사들의 결합은 우연한 노출이 아니라 의도된 재판적 행위를 나타냅니다. 번역에서도 이 능동적·사법적 의미를 유지했습니다.
  doctrine_reference: 예언서의 신적 심판과 언약적 응보의 주제
- issue: ‘복수’의 어조
  chosen_reading: ‘복수하기’로 옮겨 본문의 날카로운 응보 어조를 보존했습니다.
  alternative_readings:
  - ‘원수를 갚기’는 더 완곡하고 관용적일 수 있습니다.
  rationale: 이 구절은 정서적 완곡화보다 예언적 강도를 드러내는 것이 중요하므로, 전통적 교회 용어로 순화하지 않았습니다. 다만 한국어 오독을 줄이기 위해 문맥상 사법적 응보로 이해해야 합니다.
  doctrine_reference: 하나님의 공의와 심판
