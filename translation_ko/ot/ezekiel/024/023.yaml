id: EZK.24.23
reference: Ezekiel 24:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פְאֵרֵ/כֶ֣ם עַל רָאשֵׁי/כֶ֗ם וְ/נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם לֹ֥א תִסְפְּד֖וּ וְ/לֹ֣א תִבְכּ֑וּ וּ/נְמַקֹּתֶם֙ בַּ/עֲוֺנֹ֣תֵי/כֶ֔ם וּ/נְהַמְתֶּ֖ם אִ֥ישׁ אֶל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/023.yaml
  text: Your turbans will be on your heads and your sandals on your feet[a]; you will not mourn and you will not weep[c][b], but you will waste away in your iniquities and groan to one another.
  footnotes:
  - marker: a
    text: Or 'your headdresses' or 'your finery'; the Hebrew term refers to an ornamental head covering, likely a turban in this mourning context.
    reason: lexical_alternative
  - marker: b
    text: '''In your iniquities'' may also be understood as ''because of your iniquities'' or, by extension of the Hebrew term, ''in your guilt.'''
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''each man to his brother.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 너희의 머리에는 너희의 관이 있고 너희의 발에는 너희의 샌들이 있을 것이며[a] 너희는 애곡하지도 않고 울지도 않을 것입니다[c][b]. 그러나 너희는 너희의 죄악들 가운데서 쇠약해지고 서로에게 신음할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 장식용 머리쓰개를 가리키며, 장례 풍습의 맥락에서는 ‘터번’ 또는 ‘관’으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너희의 죄악들 가운데서’는 ‘너희의 죄악들 때문에’ 또는 확장된 의미로 ‘너희의 죄책 가운데서’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: '히브리어: ‘각 사람이 자기 형제에게’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְאֵרֵיכֶם
  english_pob_choice: your turbans
  chosen_korean: 너희의 관
  alternatives_korean:
  - 너희의 두건
  - 너희의 머리장식
  lexicon: HALOT
  rationale: 문맥상 장례의 표지를 벗지 않고 그대로 머리에 두는 장식용 머리쓰개를 가리키므로, 한국어에서는 너무 현대적이거나 추상적인 말보다 ‘관’이 가장 자연스럽고 간결합니다.
- source_word: נַעֲלֵיכֶם
  english_pob_choice: your sandals
  chosen_korean: 너희의 샌들
  alternatives_korean:
  - 너희의 신발
  lexicon: HALOT
  rationale: 고대 이스라엘의 복식 배경을 살리기 위해 일반적 ‘신발’보다 ‘샌들’이 더 स्रोत-직접적입니다.
- source_word: תִסְפְּדוּ / תִבְכּוּ
  english_pob_choice: mourn / weep
  chosen_korean: 애곡하지도 않고 울지도 않을 것입니다
  alternatives_korean:
  - 슬퍼하지도 않고 울지도 않을 것입니다
  - 곡하지도 않고 울지도 않을 것입니다
  lexicon: HALOT
  rationale: תִסְפְּדוּ는 단순한 슬픔보다 장례의 공식적 애곡을 포함하므로 ‘애곡하다’가 더 가깝고, תִבְכּוּ는 ‘울다’가 직접적입니다.
- source_word: בַּעֲוֺנֹתֵיכֶם
  english_pob_choice: in your iniquities
  chosen_korean: 너희의 죄악들 가운데서
  alternatives_korean:
  - 너희의 죄악들 안에서
  - 너희의 죄악들 때문에
  lexicon: HALOT
  rationale: 전치사 ב를 단순한 원인으로만 풀지 않고, 죄와 그 아래 놓인 상태를 함께 드러내도록 ‘가운데서’로 옮겼습니다. POB의 ‘in your iniquities’라는 긴장을 반영합니다.
- source_word: אִישׁ אֶל אָחִיו
  english_pob_choice: each man to his brother
  chosen_korean: 서로에게
  alternatives_korean:
  - 각 사람이 자기 형제에게
  - 한 사람씩 서로에게
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 남성 단수 표현이지만, 한국어 본문에서는 어색한 직역보다 상호적인 비탄의 장면을 자연스럽게 전달하는 표현을 택했습니다. 본문의 남성 표지는 주석으로 설명합니다.
theological_decisions:
- issue: 부정적 종말 경고의 정서 표현
  chosen_reading: ‘쇠약해지고’와 ‘신음할 것입니다’로 심판 아래의 소멸과 고통을 함께 살렸습니다.
  alternative_readings:
  - ‘시들어갈 것입니다’
  - ‘신음하며 지낼 것입니다’
  rationale: מקק과 נהם은 단순한 슬픔을 넘어 심판으로 인한 소모와 탄식을 나타내므로, 한국어에서도 정서적 약화와 신체적/정신적 신음의 두 층위를 유지하는 것이 본문의 힘을 살립니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
