revisions:
- from: 너희의 머리에는 너희의 관이 있고 너희의 발에는 너희의 샌들이 있을 것이며[a] 너희는 애곡하지도 않고 울지도 않을 것입니다[c][b]. 그러나 너희는 너희의 죄악들 가운데서 쇠약해지고 서로에게 신음할 것입니다.
  to: 너희는 머리에 머리쓰개를 쓰고 발에 샌들을 신고 있을 것이며[a], 애곡하지도 울지도 않을 것입니다. 그러나 너희는 너희 죄악 가운데서 쇠약해지고[b], 각 사람이 자기 형제에게 신음할 것입니다[c].
  rationale: ‘머리쓰개’는 פְאֵר의 장식적 머리 덮개라는 의미를 보존하면서 ‘관’이 유발할 수 있는 왕관의 오해를 피합니다. 원문의 명시적 관계 표현인 אִישׁ אֶל אָחִיו는 ‘각 사람이 자기 형제에게’로 번역하고, 관련 각주 표지를 해당 구절로 옮겼습니다. 그 밖에 본문의 심판과 억제된 애도의 대비, 그리고 עון의 해석상 여지는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:41:42Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 병렬 구조와 미래적 진술은 대체로 반영되었으나, פְאֵרֵיכֶם을 ‘관’으로 옮기면 왕관 또는 관모라는 뜻으로 좁혀져 장식적 머리쓰개라는 어휘 범위를 충분히 보존하지 못합니다. 또한 אִישׁ אֶל אָחִיו를 본문에서 ‘서로에게’로 중화한 것은 원문의 명시적 남성 단수·친족 표현을 약화합니다.
  naturalness: ‘머리에 머리쓰개를 쓰고 발에 샌들을 신고 있을 것’은 한국어로 자연스럽고, ‘각 사람이 자기 형제에게 신음할 것’도 엄숙한 예언 문맥에서 무리 없이 읽힙니다. 기존의 ‘죄악들 가운데서’는 가능하나 한국어에서는 복수 ‘-들’을 생략한 ‘죄악 가운데서’가 더 자연스럽습니다.
  terminology: פְאֵר에는 ‘머리쓰개’를 사용하여 과도한 특정화를 피하고 주석에서 ‘터번’과 ‘관’을 가능한 이해로 제시합니다. מקק은 ‘쇠약해질 것’, עון은 본문에서 ‘죄악 가운데서’, נהם은 ‘신음할 것’으로 유지합니다. 원문의 ‘각 사람이 자기 형제에게’를 본문에 반영합니다.
  issues:
  - severity: medium
    issue: ‘관’은 פְאֵרֵיכֶם의 의미를 지나치게 좁히고 한국어에서 왕관으로도 쉽게 이해됩니다.
    rationale: 해당 히브리어는 이 문맥에서 머리에 두는 장식적 머리 덮개/관모를 가리키며, 특정한 왕관을 뜻한다고 단정하기 어렵습니다.
