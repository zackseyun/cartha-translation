translation:
  language: ko
  text: 야훼의 말씀이 내게 임했습니다. 야훼께서 이렇게 말씀하셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: “그리고 야훼의 말씀이 내게 임하여, 말씀하시기를.”'
    reason: alternative_reading
lexical_decisions:
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  - 전언
  lexicon: HALOT
  rationale: 예언 공식에서 דבר은 단순한 소식보다 하나님의 계시적 발화를 가리키므로, 한국어에서는 전통적이면서도 현대적인 ‘말씀’이 가장 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥의 신명기적 예언 공식에서 하나님의 고유명사를 살리기 위해, 관례적 대치어인 ‘주님’ 대신 음역형 ‘야훼’를 사용했습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내 앞에
  lexicon: HALOT
  rationale: 예언자 에스겔이 계시의 수신자임을 자연스럽게 드러내는 현대 한국어 표현으로 ‘내게’를 택했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시며
  - 말하여 이르시며
  lexicon: HALOT
  rationale: 히브리어의 직접화법 도입구를 한국어에서는 중복된 의미를 피하면서도 이어질 신탁을 예고하는 종결형으로 정리했습니다.
theological_decisions:
- issue: 여호와/야훼의 음역 선택
  chosen_reading: ‘야훼’로 직접 음역해 하나님의 언약적 이름을 보존합니다.
  alternative_readings:
  - ‘여호와’로 음역
  - ‘주님’으로 대치
  rationale: 본문은 יְהוָה를 사용하므로, 제목어로 대치하지 않고 고유명을 살려 독자가 신적 발화의 직접성을 인지하도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘말씀이…말씀하셨습니다’의 반복
  chosen_reading: 히브리어 관용구를 따라 ‘야훼의 말씀이 내게 임하여 말씀하셨습니다’로 유지합니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 와서 이르셨습니다’
  - ‘야훼께서 내게 말씀하셨습니다’
  rationale: 예언 공식의 ‘말씀’과 동사의 반복은 의도된 계시 형식을 드러내므로, 문체를 매끈하게 하되 구조적 중복을 제거하지 않았습니다.
  doctrine_reference: 예언서의 계시 공식 보존
