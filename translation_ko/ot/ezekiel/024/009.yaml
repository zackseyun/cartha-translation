  yaml_path: translation/ot/ezekiel/024/009.yaml
  text: 'Therefore thus says the Lord Yahweh: Woe to the city of bloodshed! I also will make the firewood pile great[a][b].'
  footnotes:
  - marker: a
    text: Hebrew 'city of bloods,' an idiom for a city marked by bloodshed or bloodguilt.
    reason: lexical_alternative
  - marker: b
    text: Or 'I too will enlarge the pyre.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. "피 흘림의 성읍아, 화 있으라! 나도 불쏘시개 더미를 크게 하겠습니다[a][b]."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘피들의 성읍’이며, 유혈과 피 흘림의 죄책이 가득한 성읍이라는 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 불쏘시개 더미를 더 크게 하겠다’로 옮길 수 있습니다.
    reason: alternative_reading
