  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. “피 흘림의 성읍아, 화가 있다! 나도 장작더미를 크게 하겠다[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘피들의 성읍’이며, 유혈이나 피 흘림의 죄책으로 얼룩진 성읍을 가리키는 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나도 불을 지필 나무더미를 크게 하겠다’로 옮길 수 있습니다.
    reason: alternative_reading
