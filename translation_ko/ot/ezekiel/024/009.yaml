  source_fidelity: 히브리어의 추론 접속사, 예언자적 선포 공식, 복수형 ‘피들’이 지닌 유혈/피의 죄책의 뜻, 그리고 하나님이 장작더미를 크게 하신다는 이미지를 대체로 충실히 반영합니다. 다만 אוֹי는 성읍을 향한 심판의 탄식·선고이지 명령이 아니므로 ‘화 있으라’는 문법적 방향이 맞지 않습니다.
  naturalness: ‘화 있으라’는 현대 표준 한국어에서 부자연스럽고 원문의 감탄·화 선언을 명령으로 바꿉니다. ‘화가 있다’가 현대적이면서 예언자적 선고를 자연스럽게 보존합니다. 또한 ‘불쏘시개 더미’는 작은 불붙임 재료를 주로 뜻하여, 연료용 나무를 많이 쌓는 문맥에는 ‘장작더미’가 더 정확하고 자연스럽습니다.
  terminology: ‘주 야훼’, ‘피 흘림의 성읍’은 프로젝트의 신명 표기 및 히브리어 דָּמִים의 관용적 의미와 잘 맞습니다. הַמְּדוּרָה는 장례용 화장더미를 명시하지 않으므로 ‘화장더미’는 본문에 없는 함의를 낳을 수 있고, ‘장작더미’가 안전합니다.
