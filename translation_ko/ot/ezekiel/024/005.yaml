  text: Take the choicest of the flock[a], and also pile the bones under it; bring it to a boil, boil it well[b], and let its bones be cooked in it.
  footnotes:
  - marker: a
    text: Or, 'arrange a pile of bones under it.' The Hebrew term translated 'pile' is rare, and the exact nuance is uncertain, though the context clearly refers to placing bones beneath the pot.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'boil its boiling,' an emphatic expression meaning to boil it thoroughly.
    reason: lexical_alternative
