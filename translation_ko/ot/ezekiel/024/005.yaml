  text: 가장 좋은 양 떼를 취하여 그 아래에 뼈들을 쌓고, 그것을 끓이되 충분히 끓이며, 그 뼈들이 그 안에서 익게 하라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
