    text: 또는 '그 아래에 뼈들을 쌓아 올린다.' 히브리어로 번역된 '쌓다'는 희귀한 용어로, 정확한 뉘앙스는 불확실하나 문맥은 냄비 아래에 뼈를 두는 것을 분명히 가리킨다.
    reason: alternative_reading
