id: EZK.24.14
reference: Ezekiel 24:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִ֨י יְהוָ֤ה דִּבַּ֨רְתִּי֙ בָּאָ֣ה וְ/עָשִׂ֔יתִי לֹֽא אֶפְרַ֥ע וְ/לֹא אָח֖וּס וְ/לֹ֣א אֶנָּחֵ֑ם כִּ/דְרָכַ֤יִ/ךְ וְ/כַ/עֲלִילוֹתַ֨יִ/ךְ֙ שְׁפָט֔וּ/ךְ נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/014.yaml
  text: I[a], Yahweh, have spoken; it is coming[b], and I will do it. I will not hold back, nor will I spare, nor will I relent. According to your ways and according to your deeds they will judge you[c], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'I will not withdraw' / 'I will not let up' for 'I will not hold back.'
    reason: lexical_alternative
  - marker: b
    text: Or 'nor will I change my mind' for 'nor will I relent.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew has 'they will judge you,' an unspecified plural that may refer to those carrying out the LORD's judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 나 야훼가 말하였습니다. 그것이 오고 있으며, 내가 그것을 행하겠습니다. 나는 물러서지 않겠습니다[a]. 아끼지 않겠으며, 뜻을 돌이키지 않겠습니다[b]. 너의 길과 너의 행위에 따라 그들이[c] 너를 심판할 것입니다. 주 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물러서지 않겠습니다’는 심판 집행을 유보하거나 중단하지 않으신다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뜻을 돌이키지 않겠습니다’는 ‘후회하지 않는다’ 또는 ‘마음을 바꾸지 않는다’로도 옮길 수 있으나, 여기서는 선포된 심판을 철회하지 않으신다는 뜻을 따랐습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 특정되지 않은 복수 주어를 사용하며, 이는 야훼의 심판을 집행하는 이들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명(神名) יְהוָה는 제목이 아니라 고유한 이름이므로, POB 원칙에 따라 한국어도 전통 대체어보다 음역형 ‘야훼’로 옮겼습니다.
- source_word: וְעָשִׂיתִי
  english_pob_choice: and I will do it
  chosen_korean: 내가 그것을 행하겠습니다
  alternatives_korean:
  - 내가 그것을 하겠습니다
  - 내가 그렇게 하겠습니다
  lexicon: HALOT
  rationale: 예언적 선언에서 완료형이 미래적/결과적 의미로 쓰인 점을 살려, 단순한 과거형이 아니라 결심된 실행의 미래로 표현했습니다.
- source_word: אֶפְרַע
  english_pob_choice: hold back
  chosen_korean: 물러서지 않고
  alternatives_korean:
  - 막지 않고
  - 멈추지 않고
  - 거두어들이지 않고
  lexicon: HALOT
  rationale: 심판 집행을 ‘주저하며 거두다/유보하다’는 뜻으로 이해해, 현대 한국어에서 자연스럽고 긴박한 ‘물러서지 않다’로 옮겼습니다.
- source_word: אֶנָּחֵם
  english_pob_choice: relent
  chosen_korean: 뜻을 돌이키지 않겠습니다
  alternatives_korean:
  - 완화하지 않겠습니다
  - 마음을 바꾸지 않겠습니다
  - 후회하지 않겠습니다
  lexicon: HALOT
  rationale: 하나님께 인간적 ‘후회’나 도덕적 변경을 암시하지 않으면서, 이미 선포된 심판을 철회하지 않으신다는 뜻을 살렸습니다.
- source_word: שְׁפָטוּךְ
  english_pob_choice: they will judge you
  chosen_korean: 그들이 너를 심판할 것입니다
  alternatives_korean:
  - 그들이 너를 판단할 것입니다
  - 너는 심판을 받을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 불특정 3인칭 복수를 살려 주체를 특정하지 않고, משפט의 법정적 의미를 현대 한국어 ‘심판하다’로 표현했습니다.
theological_decisions:
- issue: יְהוָה와 아ֲדֹנָי יְהוִה의 이중 호칭
  chosen_reading: 본문 첫 절의 선언은 ‘나는 야훼입니다’로, 끝의 공식은 ‘주 야훼의 말입니다’로 구분했습니다.
  alternative_readings:
  - 모두 ‘주 하나님’으로 통일
  - 모두 ‘야훼 하나님’으로 통일
  rationale: 히브리어의 신명과 주권 칭호를 구별해 주며, POB의 신명 번역 원칙을 한국어 문장 안에서 일관되게 반영하기 위함입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אֶנָּחֵם의 신학적 뉘앙스
  chosen_reading: ‘뜻을 돌이키지 않겠습니다’로, 선포된 심판의 철회를 부정하는 의미를 유지했습니다.
  alternative_readings:
  - 후회하지 않겠습니다
  - 마음을 바꾸지 않겠습니다
  - 불쌍히 여기지 않겠습니다
  rationale: 하나님의 변덕이나 감정적 후회를 뜻하지 않으면서, 심판을 실행하시는 단호함을 보존합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
