  rationale: 선언의 주의를 환기하는 감탄사로서 ‘보라’가 가장 자연스럽고 예언적 어조를 살립니다.
- source_word: מַחְמַד עֵינֶיךָ
  english_pob_choice: the delight of your eyes
  chosen_korean: 네 눈의 기쁨
  alternatives_korean:
  - 네 눈의 사랑
  - 네 눈의 소망
  - 네 눈의 즐거움
  lexicon: HALOT
  rationale: 히브리어 관용구의 정서적 가치를 살리면서도 한국어에서 자연스러운 표현으로 옮겼습니다. 본문 자체는 대상을 이름 붙이지 않으므로, ‘아내’는 본문에 넣지 않았습니다.
- source_word: בְּמַגֵּפָה
  english_pob_choice: with a blow
  chosen_korean: 한 격타로
  alternatives_korean:
  - 한 타격으로
  - 재앙으로
  - 질병으로
  lexicon: HALOT
  rationale: 이 단수적·개별적 문맥에서는 전염병보다 ‘치명적 타격’의 뉘앙스가 강하므로, 원어가 허용하는 ‘타격/격타’ 계열로 옮겨 모호성을 보존했습니다.
- source_word: וְלֹא תִסְפֹּד וְלֹא תִבְכֶּה
  english_pob_choice: yet you shall not mourn or weep
  chosen_korean: 너는 슬퍼하지도 울지도 말고
  alternatives_korean:
  - 너는 곡하지도 울지도 말고
  - 너는 애곡하지도 울지도 말고
  lexicon: HALOT
  rationale: ‘mourn’의 사회적 애도 행동을 한국어에서 과장 없이 전달하면서, ‘weep’과 평행을 이루도록 매끈하게 구성했습니다.
- source_word: וְלֹא תָבוֹא דִּמְעָתֶךָ
  english_pob_choice: nor shall your tears come
  chosen_korean: 네 눈물도 나오지 못하게 하라
  alternatives_korean:
  - 네 눈물도 오지 않게 하라
  - 네 눈물도 흐르지 못하게 하라
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지를 한국어에서 살리되, 자연스러운 종결 명령으로 처리했습니다. ‘눈물도’로 앞 절과 병렬을 유지했습니다.
theological_decisions:
- issue: 본문이 암시하는 상실의 대상(에스겔의 아내)을 본문에 명시할지 여부
  chosen_reading: 본문에는 은유적 표현인 ‘네 눈의 기쁨’만 두고, 아내라는 식별은 주석 없이 드러내지 않았습니다.
  alternative_readings:
  - 네 눈의 기쁨, 곧 네 아내
  - 네 사랑하는 아내
  rationale: 원문이 여기서는 관용구를 사용하므로, 본문을 넘어서 대상을 해설어로 바꾸지 않는 것이 원문 충실성과 가독성을 함께 지킵니다.
  doctrine_reference: '원문 우선 번역 원칙: 본문이 말하는 만큼만 말하고, 문맥으로 읽히는 내용은 본문 밖으로 밀어내지 않습니다.'
