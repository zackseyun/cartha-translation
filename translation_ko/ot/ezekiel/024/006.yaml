  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אוֹי֮ עִ֣יר הַ/דָּמִים֒ סִ֚יר אֲשֶׁ֣ר חֶלְאָתָ֣/ה בָ֔/הּ וְ/חֶ֨לְאָתָ֔/הּ לֹ֥א יָצְאָ֖ה מִמֶּ֑/נָּה לִ/נְתָחֶ֤י/הָ לִ/נְתָחֶ֨י/הָ֙ הוֹצִיאָ֔/הּ לֹא נָפַ֥ל עָלֶ֖י/הָ גּוֹרָֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/006.yaml
  text: 'Therefore thus says the Lord GOD: Woe to the city of bloodshed[a], the pot whose rust is in it, and whose rust has not gone out from it! Bring it out piece by piece[b]; no lot has fallen on it.'
  footnotes:
  - marker: a
    text: Or 'scum' for 'rust'; the Hebrew term refers to the foul deposit/corrosion clinging to the pot.
    reason: lexical_alternative
  - marker: b
    text: That is, the contents are to be taken out one by one, without selection by lot.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. 「피흘림의 도시[a]여, 화가 있다! 그 속에 녹이 있는 솥이여, 그 녹이 그 안에서 빠져나오지 않았다! 그것을 조각조각 꺼내라[b]. 그것을 두고는 제비가 뽑히지 않았다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘피들의 도시’라고 하며, 단순한 색채가 아니라 유혈과 피 흘린 죄책을 가리킵니다.
    reason: source_note
  - marker: b
    text: 곧 솥의 내용물을 제비로 골라 나누지 않고, 한 조각씩 꺼내라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 이러므로
  lexicon: HALOT
  rationale: 앞선 문맥의 판단을 끌어오는 추론 표지로서 ‘그러므로’가 가장 자연스럽고 문맥 기능을 잘 보존합니다.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  english_pob_choice: thus says the Lord GOD
  chosen_korean: 주 하나님께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주 하나님께서 말씀하시기를 이르시되
  - 주 야훼께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전달 공식의 선포성을 살리면서 현대 한국어로 자연스럽게 옮겼습니다. 여기서는 POB의 기존 영어 관행에 맞춰 직함 중심으로 처리했습니다.
- source_word: עִיר הַדָּמִים
  english_pob_choice: the city of bloodshed
  chosen_korean: 피흘림의 도시
  alternatives_korean:
  - 피의 도시
  - 유혈의 도시
  lexicon: HALOT
  rationale: 복수형 דמים이 단순한 ‘피’가 아니라 피흘림/유혈의 책임을 가리키므로, 비난의 강도를 살려 ‘피흘림의 도시’로 옮겼습니다.
- source_word: חֶלְאָה
  english_pob_choice: rust
  chosen_korean: 녹
  alternatives_korean:
  - 부스러기
  - 찌꺼기
  - 부식
  lexicon: HALOT
  rationale: 그릇의 부식 찌꺼기를 가리키는 이미지이므로 한국어에서는 가장 직접적인 ‘녹’을 택해 은유를 유지했습니다.
- source_word: לִנְתָחֶיהָ לִנְתָחֶיהָ הוֹצִיאָהּ
  english_pob_choice: Bring it out piece by piece
  chosen_korean: 그것을 조각조각 꺼내라
  alternatives_korean:
  - 그것을 한 조각씩 꺼내라
  - 그것을 부분마다 꺼내라
  lexicon: HALOT
  rationale: 반복된 분배적 표현을 한국어의 관용적 반복어 ‘조각조각’으로 살려, 선택 없이 하나씩 꺼내는 뜻을 드러냈습니다.
theological_decisions:
- issue: 야훼/주 하나님 표기
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 이 절의 예언자적 공식에서는 본문 의미 전달이 우선이라 직함 표현을 유지했습니다. 다만 본문 차원의 신명 직접 표기는 한국어 본문에서 별도 주석 없이 과도하게 드러내지 않았습니다.
  doctrine_reference: 'POB contested terms: יְהוָה → 야훼'
