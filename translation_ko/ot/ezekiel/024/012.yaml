id: EZK.24.12
reference: Ezekiel 24:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּאֻנִ֖ים הֶלְאָ֑ת וְ/לֹֽא תֵצֵ֤א מִמֶּ֨/נָּה֙ רַבַּ֣ת חֶלְאָתָ֔/הּ בְּ/אֵ֖שׁ חֶלְאָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/012.yaml
  text: With toil she has wearied herself[a], yet her abundant corrosion does not go out from her[b]; her corrosion remains in the fire.
  footnotes:
  - marker: a
    text: Or 'rust' or 'scum' for 'corrosion.' The Hebrew term denotes the encrusted impurity of the pot in Ezekiel's metaphor.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew is elliptical at the end: literally, ''in the fire her corrosion.'' The translation supplies ''remains'' for clear English sense.'
    reason: lexical_alternative
translation:
  language: ko
  text: 수고를 다하여도 그녀에게서 많은 부식은 사라지지 않고, 불 속에 그 부식이 남아 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תְּאֻנִים은 수고·노력·애씀을 가리키며, 여기서는 그릇을 닦아도 남는 오염의 비유를 이룹니다.
    reason: source_note
  - marker: b
    text: 본문은 문자적으로는 “불 속에 그녀의 부식”이라고 끝나는 축약형입니다. 한국어는 뜻을 분명히 하기 위해 ‘남아 있습니다’를 보충했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּאֻנִים הֶלְאָת
  english_pob_choice: With toil she has wearied herself
  chosen_korean: 수고를 다하여도
  alternatives_korean:
  - 애써도
  - 수고하여도
  - 노고를 들여도
  lexicon: HALOT
  rationale: תְּאֻנִים은 수고·노력의 복수형으로 보이며, 동작의 결과를 자연스럽게 드러내기 위해 부사구로 옮겼습니다. הֶלְאָת의 ‘지치게 하다/지치다’ 뉘앙스는 뒤의 ‘사라지지 않고’와 결합해 헛수고의 느낌을 줍니다.
- source_word: רַבַּת חֶלְאָתָהּ
  english_pob_choice: her abundant corrosion
  chosen_korean: 많은 부식
  alternatives_korean:
  - 많은 녹
  - 많은 찌꺼기
  - 심한 부식
  lexicon: HALOT
  rationale: חֶלְאָה는 그릇에 들러붙은 오염·부식의 이미지를 가지므로, 금속 그릇의 비유를 살리는 ‘부식’으로 옮겼습니다. רַבַּת은 양적·정도적 강도를 나타내어 ‘많은’으로 처리했습니다.
- source_word: וְלֹא תֵצֵא מִמֶּנָּה
  english_pob_choice: yet ... does not go out from her
  chosen_korean: 그녀에게서 사라지지 않고
  alternatives_korean:
  - 그녀에게서 나오지 않고
  - 그녀에게서 벗어나지 않고
  - 그녀에게서 없어지지 않고
  lexicon: HALOT
  rationale: 직역하면 ‘그에게서/그 안에서 나오지 않는다’이지만, 문맥상 오염이 제거되지 않는 뜻이므로 한국어에서는 의미를 드러내는 ‘사라지지 않고’로 옮겼습니다. 다만 원문의 제거 불가 이미지는 유지했습니다.
- source_word: בְּאֵשׁ חֶלְאָתָהּ
  english_pob_choice: her corrosion remains in the fire
  chosen_korean: 불 속에 그 부식이 남아 있습니다
  alternatives_korean:
  - 불 속에 그 부식이 있습니다
  - 불 속에서도 그 부식이 남아 있습니다
  - 불 가운데 그 부식이 남아 있습니다
  lexicon: HALOT
  rationale: 히브리어는 끝이 생략된 축약 표현이므로, 영어처럼 의미를 보충하되 과도하게 해석하지 않고 ‘남아 있습니다’를 넣었습니다. ‘불 속에’는 בְּאֵשׁ의 공간적 이미지를 살립니다.
theological_decisions:
- issue: 정결의 불에도 오염이 제거되지 않는다는 비유
  chosen_reading: 불은 정화를 시도하지만, 이 그릇의 부식은 끝내 제거되지 않습니다.
  alternative_readings:
  - 단순한 쇠붙이의 녹이 아니라 의도적 심판의 불로도 제거되지 않는 죄악의 오염으로 읽을 수 있습니다.
  - 그릇의 부식은 외형적 정화로는 해결되지 않는 내적 부패를 상징합니다.
  rationale: 예레미야/에스겔의 그릇 비유 맥락에서, 물리적 부식과 도덕적 오염이 겹쳐 있으나 본문은 제거 실패를 강조합니다. 따라서 상징성을 과잉 해석하지 않으면서도 심판-정화의 긴장을 살렸습니다.
  doctrine_reference: 겔 24장 문맥의 심판 비유
- issue: 문장 첫 부분의 주어 생략과 여성 인칭
  chosen_reading: 한국어에서는 문맥상 주어를 반복하지 않고 여성 대명사 ‘그녀’를 유지했습니다.
  alternative_readings:
  - 주어를 생략해 자연스럽게 ‘수고를 다하여도 많은 부식은 사라지지 않고’로만 처리할 수 있습니다.
  - ‘그것’으로 비인칭화할 수도 있습니다.
  rationale: 히브리어 3fs 형태가 그릇/예루살렘을 여성화한 인칭화를 반영하므로, 문맥적 인칭을 살리기 위해 ‘그녀’를 유지했습니다.
  doctrine_reference: 에스겔 24장 예루살렘의 의인화
