revisions:
- from: 그 피가 그 한가운데에 있습니다[a]; 그것을 벌거벗은 바위 위에 두었습니다[b]. 그것을 땅 위에 쏟아 부어 먼지로 덮지 않았습니다.
  to: 그 피가 그곳 한가운데에 있습니다[a]. 그것을 민둥바위 위에 두었습니다[b]. 그것을 땅에 쏟아 흙으로 덮지 않았습니다.
  rationale: 본문의 ‘피’ 이미지는 유지하되, 한국어에서 자연스럽고 원문의 물리적 장면에 충실하도록 장소 표현과 바위 표현을 다듬었습니다. 특히 עָפָר는 피를 덮는 흙을 가리키므로 ‘먼지’를 ‘흙’으로 고쳤습니다. 여성 단수 주어는 한국어에서 문맥상 생략하여, 도시를 불필요하게 명시하거나 의인화하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:41:52Z'
