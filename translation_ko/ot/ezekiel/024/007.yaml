id: EZK.24.7
reference: Ezekiel 24:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י דָמָ/הּ֙ בְּ/תוֹכָ֣/הּ הָיָ֔ה עַל צְחִ֥יחַ סֶ֖לַע שָׂמָ֑תְ/הוּ לֹ֤א שְׁפָכַ֨תְ/הוּ֙ עַל הָ/אָ֔רֶץ לְ/כַסּ֥וֹת עָלָ֖י/ו עָפָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/007.yaml
  text: For her blood is in her midst[a]; she set it on a bare rock[b]. She did not pour it out on the ground to cover it with dust.
  footnotes:
  - marker: a
    text: Or 'her bloodguilt'; the Hebrew literally says 'her blood,' using the concrete image to express violent guilt.
    reason: lexical_alternative
  - marker: b
    text: Covering blood with earth alludes to the duty not to leave shed blood exposed; here the blood is left openly visible on bare rock.
    reason: cultural_note
translation:
  language: ko
  text: 그 피가 그 한가운데에 있습니다[a]; 그것을 벌거벗은 바위 위에 두었습니다[b]. 그것을 땅 위에 쏟아 부어 먼지로 덮지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 피에 대한 죄책’. 히브리어는 문자 그대로 ‘그 피’라고 말하지만, 실제로는 폭력의 죄책을 가리키는 구체적 이미지를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 피를 흙으로 덮는 일은 흘린 피를 드러나게 두지 말아야 한다는 관습을 떠올리게 합니다. 여기서는 그 피가 벌거벗은 바위 위에 공개적으로 놓여 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: דָמָהּ
  english_pob_choice: her blood
  chosen_korean: 그 피가
  alternatives_korean:
  - 그 피흘림이
  - 그 피의 죄가
  lexicon: HALOT
  rationale: 원문은 문자 그대로 ‘그의/그녀의 피’를 뜻하므로, 본문이 유지하는 노출된 피의 이미지를 살려 ‘그 피’로 옮겼습니다.
- source_word: בְּתוֹכָהּ
  english_pob_choice: in her midst
  chosen_korean: 그 한가운데에
  alternatives_korean:
  - 그 안에
  - 그 속에
  lexicon: HALOT
  rationale: 도시/공동체 내부라는 공간감을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘한가운데’로 옮겼습니다.
- source_word: עַל צְחִיחַ סֶלַע
  english_pob_choice: on a bare rock
  chosen_korean: 벌거벗은 바위 위에
  alternatives_korean:
  - 맨바위 위에
  - 드러난 바위 위에
  - 민둥바위 위에
  lexicon: HALOT
  rationale: צְחִיחַ의 ‘드러나고 덮이지 않은’ 감각을 살려, 피가 흙에 스며들지 않고 노출된 상태를 분명히 드러내는 표현을 택했습니다.
- source_word: לְכַסּוֹת עָלָיו עָפָר
  english_pob_choice: to cover it with dust
  chosen_korean: 먼지로 덮지
  alternatives_korean:
  - 흙으로 덮지
  - 먼지로 가리지
  lexicon: HALOT
  rationale: עָפָר는 문맥상 흙/먼지 모두 가능하지만, POB가 강조한 ‘덮어 숨김’의 이미지와 ‘bare rock’의 대비를 살리기 위해 ‘먼지’로 옮겼습니다.
theological_decisions:
- issue: 노출된 피의 이미지와 함의
  chosen_reading: 본문의 비유를 해설적으로 풀지 않고, 피가 공개적으로 드러나 있는 상태 자체를 유지했습니다.
  alternative_readings:
  - ‘피의 죄’로 적극 해석하여 옮기기
  - ‘피흘림’으로 도덕적 의미를 본문에 직접 표기하기
  rationale: 이 구절의 책망은 피가 감추어지지 않고 바위 위에 그대로 놓여 있다는 이미지로 전달되므로, 메타포를 과도하게 설명하면 원문의 강도를 약화시킬 수 있습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
