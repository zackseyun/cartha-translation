  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מְשֹׁ֤ל אֶל בֵּית הַ/מֶּ֨רִי֙ מָשָׁ֔ל וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה שְׁפֹ֤ת הַ/סִּיר֙ שְׁפֹ֔ת וְ/גַם יְצֹ֥ק בּ֖/וֹ מָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/003.yaml
  text: 'And speak a proverb to the rebellious house[a], and say to them, ‘Thus says the Lord GOD: Set on the pot; set it on, and also pour water into it.’'
  footnotes:
  - marker: a
    text: Or “a parable.” The Hebrew מָשָׁל can denote a proverb, parable, or figurative saying.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 반역하는 집[a]에게 비유를 말하여 그들에게 이렇게 말하십시오. “주 하나님께서 이렇게 말씀하십니다. 솥을 걸어 놓아라. 솥을 걸어 놓고, 거기에 물도 부어라.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “비유”. 히브리어 מָשָׁל은 속담, 비유, 비유적 말 모두를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשֹׁל
  english_pob_choice: speak a proverb
  chosen_korean: 비유를 말하다
  alternatives_korean:
  - 속담을 말하다
  - 비유를 전하다
  lexicon: HALOT
  rationale: מָשָׁל의 ‘비유/수수께끼 같은 말’ 성격을 살려, 한국어에서는 자연스러운 ‘비유를 말하다’로 옮겼습니다.
- source_word: בֵּית הַמֶּרִי
  english_pob_choice: the rebellious house
  chosen_korean: 반역하는 집
  alternatives_korean:
  - 반역의 집
  - 반역하는 사람들
  lexicon: HALOT
  rationale: 에스겔의 반복되는 예언적 관용구를 살려 ‘집’을 유지했고, 단순한 감정적 반항보다 언약적 불순종의 뉘앙스를 반영해 ‘반역하는’으로 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 하나님 야훼
  lexicon: HALOT
  rationale: 합쇼체 인용문 안에서 예언 공식의 위엄을 살리되, 한국어 독자에게 가장 자연스러운 호칭인 ‘주 하나님’으로 정리했습니다. 본문 전반의 YHWH 표기 원칙은 이 절의 고정된 칭호 때문에 별도 음역을 쓰지 않았습니다.
- source_word: שְׁפֹת הַסִּיר
  english_pob_choice: Set on the pot
  chosen_korean: 솥을 걸어 놓아라
  alternatives_korean:
  - 솥을 올려놓아라
  - 냄비를 걸어 놓아라
  lexicon: HALOT
  rationale: בישול כלי를 뜻하는 הַסִּיר는 문맥상 조리용 솥에 가깝고, שׁפת의 ‘올려 놓다/걸어 놓다’ 의미를 반영해 명령형으로 살렸습니다.
- source_word: וְגַם יְצֹק בּוֹ מָיִם
  english_pob_choice: and also pour water into it
  chosen_korean: 거기에 물도 부어라
  alternatives_korean:
  - 그 안에 물도 부어라
  - 또 물을 붓고
  lexicon: HALOT
  rationale: תִּיצֹק의 ‘붓다’ 의미를 직접 살렸고, ‘도’로 גם의 첨가를 표현했습니다. ‘거기에’는 בּוֹ의 방향성을 자연스럽게 드러냅니다.
theological_decisions:
- issue: 예언 화법 안의 직접 인용과 명령형의 문체
  chosen_reading: 예언자에게는 합쇼체 지시문을 유지하고, 하나님의 직접 발화는 현대 한국어 명령형으로 옮겼습니다.
  alternative_readings:
  - 하옵소서/하옵나이다체로 통일
  - 모든 인용문을 평서형으로 완화
  rationale: 히브리어 원문의 연속 명령과 선언적 어조를 살리기 위해, 서술부는 합쇼체, 인용문 내부는 강한 명령형으로 구분하는 편이 원문 효과를 더 정확히 전달합니다.
  doctrine_reference: Source discourse/register preservation in prophetic speech
