translation:
  language: ko
  text: 인자야, 내가 그들의 요새, 그들의 영광의 기쁨, 그들의 눈에 사랑스러운 것[a], 그들의 마음이 간절히 바라는 것[b]—그들의 아들과 딸들—을 그들에게서 빼앗는 날에, 그렇지 않겠습니까?
  philosophy: optimal-equivalence
  footnotes:
