id: EZK.24.25
reference: Ezekiel 24:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הֲ/ל֗וֹא בְּ/י֨וֹם קַחְתִּ֤/י מֵ/הֶם֙ אֶת מָ֣עוּזָּ֔/ם מְשׂ֖וֹשׂ תִּפְאַרְתָּ֑/ם אֶת מַחְמַ֤ד עֵֽינֵי/הֶם֙ וְ/אֶת מַשָּׂ֣א נַפְשָׁ֔/ם בְּנֵי/הֶ֖ם וּ/בְנוֹתֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/025.yaml
  text: And you[a], son of man, will it not be that on the day when I take from them their stronghold, the joy of their glory, the delight of their eyes[b], and the desire of their soul—their sons and their daughters—
  footnotes:
  - marker: a
    text: Or 'the desire of their eyes' for 'the delight of their eyes.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the desire of their soul' for 'the longing of their soul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너, 인자야, 내가 그들의 견고한 요새, 그들의 영광의 기쁨, 그들의 눈이 즐거워하는 것[a], 그들의 마음이 갈망하는 것[b]—그들의 아들과 딸들—을 그들에게서 빼앗는 날에 그것이 아니겠느냐?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 눈이 원하는 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 영혼이 원하는 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 인간이여
  lexicon: HALOT
  rationale: 에스겔서의 반복적인 신탁 호칭을 표준적으로 살리되, 합쇼체 문장 안에서 자연스럽게 부르기 위해 호격으로 처리했습니다.
- source_word: מָעוּזָּם
  english_pob_choice: their stronghold
  chosen_korean: 그들의 견고한 요새
  alternatives_korean:
  - 그들의 피난처
  - 그들의 강한 보루
  lexicon: HALOT
  rationale: מצ오ז는 물리적 요새이면서 의지처의 뉘앙스도 있어, 문맥상 상징성과 구체성을 함께 살리는 표현으로 옮겼습니다.
- source_word: מַחְמַד עֵינֵיהֶם
  english_pob_choice: the delight of their eyes
  chosen_korean: 그들의 눈이 즐거워하는 것
  alternatives_korean:
  - 그들의 눈의 기쁨
  - 그들의 눈이 사랑하는 것
  lexicon: HALOT
  rationale: 직역하면 ‘눈의 기쁨/사랑하는 것’이지만, 한국어에서는 관계를 풀어 ‘눈이 즐거워하는 것’으로 옮겨 관용성과 의미를 함께 살렸습니다.
- source_word: מַשָּׂא נַפְשָׁם
  english_pob_choice: the longing of their soul
  chosen_korean: 그들의 마음이 갈망하는 것
  alternatives_korean:
  - 그들의 영혼이 갈망하는 것
  - 그들의 마음의 소원
  lexicon: HALOT
  rationale: 영어 POB의 ‘desire/longing’ 계열을 반영하되, 한국어에서 자연스러운 내적 욕구 표현인 ‘마음이 갈망하는 것’으로 번역했습니다.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  english_pob_choice: their sons and their daughters
  chosen_korean: 그들의 아들과 딸들
  alternatives_korean:
  - 그들의 자녀들
  lexicon: HALOT
  rationale: 히브리어의 성별 대구를 유지해, 단순한 ‘자녀들’로 평탄화하지 않았습니다.
theological_decisions:
- issue: 수사 의문문의 종결 방식
  chosen_reading: ‘그것이 아니겠느냐?’로 옮겨 예언적 수사 질문의 확인 요구를 살렸습니다.
  alternative_readings:
  - ‘그렇지 않겠느냐?’
  - ‘그 일이 아니겠느냐?’
  rationale: הֲלוֹא는 단순 정보 질문이 아니라 청중의 동의를 끌어내는 수사 질문이므로, 한국어에서도 기대되는 답을 압박하는 종결을 택했습니다.
  doctrine_reference: 예언서 수사법
