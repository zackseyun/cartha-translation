  lexicon: HALOT
  rationale: 직역하면 ‘눈의 기쁨/사랑하는 것’이지만, 한국어에서는 관계를 풀어 ‘눈이 즐거워하는 것’으로 옮겨 관용성과 의미를 함께 살렸습니다.
- source_word: מַשָּׂא נַפְשָׁם
  english_pob_choice: the longing of their soul
  chosen_korean: 그들의 마음이 갈망하는 것
  alternatives_korean:
  - 그들의 영혼이 갈망하는 것
  - 그들의 마음의 소원
  lexicon: HALOT
  rationale: 영어 POB의 ‘desire/longing’ 계열을 반영하되, 한국어에서 자연스러운 내적 욕구 표현인 ‘마음이 갈망하는 것’으로 번역했습니다.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  english_pob_choice: their sons and their daughters
  chosen_korean: 그들의 아들과 딸들
  alternatives_korean:
  - 그들의 자녀들
  lexicon: HALOT
  rationale: 히브리어의 성별 대구를 유지해, 단순한 ‘자녀들’로 평탄화하지 않았습니다.
theological_decisions:
- issue: 수사 의문문의 종결 방식
  chosen_reading: ‘그것이 아니겠느냐?’로 옮겨 예언적 수사 질문의 확인 요구를 살렸습니다.
  alternative_readings:
  - ‘그렇지 않겠느냐?’
  - ‘그 일이 아니겠느냐?’
  rationale: הֲלוֹא는 단순 정보 질문이 아니라 청중의 동의를 끌어내는 수사 질문이므로, 한국어에서도 기대되는 답을 압박하는 종결을 택했습니다.
  doctrine_reference: 예언서 수사법
