  naturalness: ‘그것이 아니겠느냐?’는 지시 대상이 불분명하며 해라체입니다. ‘그렇지 않겠습니까?’로 고치면 수사적 확인의 뜻과 현대 합쇼체를 함께 살릴 수 있습니다. ‘눈이 즐거워하는 것’도 ‘눈에 사랑스러운 것’보다 덜 자연스럽습니다.
  terminology: ‘인자’는 에스겔서에서 בן־אדם에 대한 관례적 번역으로 유지할 수 있습니다. מָעוֹז는 ‘견고한 요새’보다 ‘요새’가 간결하면서도 문맥상 의지하는 강한 곳이라는 의미를 보존합니다. נֶפֶשׁ은 여기서 ‘마음’으로 자연스럽게 옮길 수 있으며, 각주에서 ‘영혼’ 대안을 제시할 수 있습니다.
