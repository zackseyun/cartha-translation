  source_fidelity: ‘당신의 귀로 직접 듣게’는 히브리어의 청각 관용구를 대체로 반영하지만, ‘직접’은 본문에 명시되지 않은 강조입니다. 또한 הַפָּלִיט은 이 문맥에서 단순 범죄적 뉘앙스를 띨 수 있는 ‘도망자’보다 재난에서 피하여 나온 사람을 가리킵니다.
  naturalness: ‘당신’의 반복은 현대 한국어 성경 문체에서 다소 부자연스럽고, ‘귀로 직접 듣게 하다’도 어색합니다. ‘네게 … 네 귀에 들리게 하다’는 자연스러우면서도 원문의 어휘상을 보존합니다.
  terminology: הַפָּלִיט은 ‘도피한 사람’으로 옮겨 피하여 살아남은 사람이라는 문맥적 의미를 유지했습니다. לְהַשְׁמָעוּת אָזְנָיִם은 ‘귀에 들리게 하다’로 옮기고, 관용적 의미는 각주에서 밝혔습니다.
