translation:
  language: ko
  text: 그날에 그 도피한 사람이 네게 와서 네 귀에 들리게 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘귀에 들리게 하려고’라는 뜻입니다. 이는 ‘네게 소식을 알리려고’라는 관용적 표현이며, 보고를 실제로 듣게 됨을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: On that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 날에
  - 그때에
  lexicon: WLC
  rationale: 지시적 미래 시점을 가리키는 표현이므로, 현대 한국어에서 자연스러운 ‘그날에’로 옮기되 특정 사건의 날이라는 강조를 살렸습니다.
- source_word: הַפָּלִיט
  english_pob_choice: the fugitive
  chosen_korean: 그 도망자
  alternatives_korean:
  - 그 피한 사람
  - 그 생존자
  - 도망친 사람
  lexicon: HALOT
  rationale: פלṭ 계열은 ‘달아나 살아남은 자’의 구체성을 가지므로, 전쟁 맥락에서 자연스럽고 직설적인 ‘도망자’가 가장 가깝습니다.
- source_word: לְהַשְׁמָעוּת אָזְנָיִם
  english_pob_choice: to make it heard with your ears
  chosen_korean: 당신의 귀로 직접 듣게 할 것입니다
  alternatives_korean:
  - 당신의 귀에 들리게 할 것입니다
  - 당신의 귀로 듣게 할 것입니다
  - 당신에게 소식을 전할 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘귀의 듣게 함’이라는 관용구이므로, 단순한 ‘전하다’보다 실제로 들리는 보고라는 감각을 살려 ‘직접 듣게 하다’로 풀었습니다.
theological_decisions:
- issue: 도망자가 전하는 내용의 전달 방식
  chosen_reading: ‘직접 듣게 할 것입니다’로 옮겨, 보고가 간접 전달이 아니라 청각적으로 확증되는 점을 드러냈습니다.
  alternative_readings:
  - ‘소식을 전할 것입니다’
  - ‘당신의 귀에 들리게 할 것입니다’
  rationale: 히브리어 관용은 단순 정보 전달보다 ‘귀로 듣는 실제 보고’를 강조하므로, 의미를 약화시키지 않는 방향으로 자연화했습니다.
  doctrine_reference: 본문 맥락상의 수사적 강조
