  rationale: 문맥상 재앙에서 피하여 나온 사람을 뜻하는 הַפָּלִיט의 의미를 ‘도피한 사람’으로 명확히 하고, 불필요한 ‘직접’을 제거했습니다. 청각적 사역 관용구는 한국어의 자연스러운 표현인 ‘네 귀에 들리게’로 유지했으며, 그 관용적 의미는 각주로 보완했습니다.
