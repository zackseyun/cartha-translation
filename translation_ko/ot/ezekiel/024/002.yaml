  text: בֶּן אָדָ֗ם כתוב לְ/ךָ֙ אֶת שֵׁ֣ם הַ/יּ֔וֹם אֶת עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה סָמַ֤ךְ מֶֽלֶךְ בָּבֶל֙ אֶל יְר֣וּשָׁלִַ֔ם בְּ/עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/002.yaml
  text: 'Son of man[a], write down for yourself the name of the day[c][b], this very day: the king of Babylon has laid siege against Jerusalem on this very day.'
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'write down the date.' Literally, 'write for yourself the name of the day.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says literally, 'this very day' / 'on this very day,' repeating the phrase for emphasis.
    reason: lexical_alternative
  - marker: c
    text: Or, 'has come against Jerusalem.' The Hebrew verb here is rendered in context as the beginning of the Babylonian siege.
    reason: alternative_reading
translation:
  language: ko
  text: 인자야[a], 너를 위하여 이 날의 이름[c], 곧 바로 이 날[b]을 기록해 두십시오. 바빌론 왕이 바로 이 날 예루살렘을 포위하기 시작했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사람의 아들’이지만, 에스겔에게 반복하여 쓰인 관용적 호칭입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘바로 이 날’이라는 표현을 두 번 반복하여 그 날의 정확성을 강하게 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로는 ‘이 날의 이름’이지만, 문맥상 그 날의 날짜를 기록하라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔의 관용적 호칭을 살리기 위해 직역적이면서도 한국어 성경에서 문맥상 통용 가능한 ‘인자’를 택했습니다.
- source_word: כתוב לְךָ
  english_pob_choice: write down for yourself
  chosen_korean: 네게서 … 기록해 두어라
  alternatives_korean:
