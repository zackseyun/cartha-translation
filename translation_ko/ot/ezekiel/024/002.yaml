  lexicon: HALOT
  rationale: לְךָ의 자기지시/개인적 강조를 반영해 단순한 ‘기록하라’보다 보존 목적이 드러나는 표현으로 옮겼습니다.
- source_word: אֶת שֵׁם הַיּוֹם
  english_pob_choice: the name of the day
  chosen_korean: 이 날의 이름
  alternatives_korean:
  - 그 날의 이름
  - 이 날의 명칭
  lexicon: HALOT
  rationale: 영어 POB처럼 히브리어의 문자적 표현을 유지해, 실제로는 날짜 기록을 가리키지만 원문 비유를 보존했습니다.
- source_word: סָמַךְ … אֶל יְרוּשָׁלִַם
  english_pob_choice: has laid siege against Jerusalem
  chosen_korean: 예루살렘을 포위한
  alternatives_korean:
  - 예루살렘을 공격한
  - 예루살렘을 향해 진을 친
  lexicon: HALOT
  rationale: 군사적 문맥에서 סָמַךְ는 포위 시작을 뜻하므로, 한국어에서는 가장 자연스럽고 분명한 ‘포위한’으로 옮겼습니다.
theological_decisions:
- issue: ‘이 매우 날’의 반복 강조를 어떻게 살릴지
  chosen_reading: ‘이 매우 날’로 두 번 반복해 원문의 강조를 그대로 드러냈습니다.
  alternative_readings:
  - ‘바로 오늘’
  - ‘그 바로 그날’
  rationale: 히브리어의 반복된 강조구를 완화하지 않고, 사건의 정확한 시점성과 예언적 표지를 선명하게 유지하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 예언 본문의 표지성 및 역사적 특정성
- issue: ‘포위한’의 의미 범위
  chosen_reading: 단순한 ‘왔다/맞섰다’보다 ‘포위한’으로 역사적 전개를 분명히 했습니다.
  alternative_readings:
  - ‘대적한’
  - ‘쳐들어간’
  rationale: 문맥은 예루살렘에 대한 바빌론의 군사적 봉쇄 개시를 가리키므로, 독자가 본문의 역사적 사건을 즉시 이해하도록 했습니다.
  doctrine_reference: 본문의 역사적-예언적 맥락
