id: EZK.24.13
reference: Ezekiel 24:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/טֻמְאָתֵ֖/ךְ זִמָּ֑ה יַ֤עַן טִֽהַרְתִּי/ךְ֙ וְ/לֹ֣א טָהַ֔רְתְּ מִ/טֻּמְאָתֵ/ךְ֙ לֹ֣א תִטְהֲרִי ע֔וֹד עַד הֲנִיחִ֥/י אֶת חֲמָתִ֖/י בָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/013.yaml
  text: In your uncleanness is lewdness[a]. Because I cleansed you, but you were not cleansed from your uncleanness[b], you will not be cleansed anymore until I have satisfied my wrath against you.
  footnotes:
  - marker: a
    text: 'Or ''Because I cleansed you'' or ''Though I cleansed you.'' The Hebrew can be taken more formally, but the main text reflects the sense demanded by the following clause: ''but you were not cleansed.'''
    reason: lexical_alternative
  - marker: b
    text: Literally 'until I cause my wrath to rest in/on you,' an idiom meaning that God's wrath is fully spent.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 더러움 속에는 음란함이 있습니다[a]. 내가 너를 깨끗하게 하려 하였으나, 너는 네 더러움에서 깨끗해지지 않았으므로[b], 내가 내 분노를 너에게 쏟아놓을 때까지 너는 다시는 깨끗해지지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 더러움 때문에” 혹은 “네 더러움 속에”로도 옮길 수 있습니다. 여기서는 뒤 절의 ‘깨끗해지지 않았으므로’가 요구하는 뜻을 따라 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “네 더러움에서 내가 너를 깨끗하게 하였으나/하려 하였으나”입니다. 본문은 하나님이 정결하게 하려는 행위와 그 거절 사이의 긴장을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֻמְאָתֵךְ
  english_pob_choice: In your uncleanness
  chosen_korean: 네 더러움 속에는
  alternatives_korean:
  - 네 부정함 속에는
  - 네 더러움 안에는
  lexicon: HALOT
  rationale: ב의 함축된 상태를 살리기 위해 ‘속에는’으로 옮기고, טֻמְאָה는 정결 개념을 유지하면서도 현대 한국어에서 자연스러운 ‘더러움’으로 표현했습니다.
- source_word: זִמָּה
  english_pob_choice: lewdness
  chosen_korean: 음란함
  alternatives_korean:
  - 음탕함
  - 방탕함
  - 악행
  lexicon: HALOT
  rationale: 이 단어는 에스겔에서 특히 성적·도덕적 방종의 뉘앙스를 띠므로, 일반적인 ‘악’보다 ‘음란함’이 원문 비난의 강도를 더 잘 드러냅니다.
- source_word: טִהַרְתִּיךְ / וְלֹא טָהַרְתְּ
  english_pob_choice: I tried to cleanse you / but you were not cleansed
  chosen_korean: 내가 너를 깨끗하게 하려 하였으나, 너는 ... 깨끗해지지 않았으므로
  alternatives_korean:
  - 내가 너를 깨끗하게 하였으나
  - 내가 너를 정결하게 하려 하였으나
  lexicon: HALOT
  rationale: 영문 POB가 반영한 문맥상 긴장을 따라, 첫 절은 완료 사실보다 의도된 정결 행위로 읽히도록 ‘하려 하였으나’로 옮겨 다음 절의 ‘깨끗해지지 않았으므로’와 맞물리게 했습니다.
- source_word: חֲמָתִי
  english_pob_choice: my wrath
  chosen_korean: 내 분노
  alternatives_korean:
  - 내 진노
  - 내 노여움
  lexicon: HALOT
  rationale: 예언서의 심판 문맥에서 חֵמָה는 강한 신적 분노를 가리키므로, 현대 한국어에서 직접적이고 엄중한 ‘분노’를 택했습니다.
theological_decisions:
- issue: 첫 번째 정결 동사의 해석을 완료된 정결로 볼지, 거절된/미완의 정결 시도로 볼지
  chosen_reading: 정결하려 하였으나 정결되지 않은 상태로 읽었습니다.
  alternative_readings:
  - 내가 너를 깨끗하게 하였다
  - 내가 너를 깨끗하게 하려고 하였다
  rationale: 바로 뒤의 ‘너는 네 더러움에서 깨끗해지지 않았으므로’와의 대비를 살려, 원문의 심판 논리를 보존하는 읽기가 더 적절합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: ‘내가 내 분노를 너에게 쏟아놓을 때까지’의 관용구 처리
  chosen_reading: 심판이 완결될 때까지 분노가 너에게 임하도록 하는 표현으로 옮겼습니다.
  alternative_readings:
  - 내 분노를 너에게 쉬게 할 때까지
  - 내 분노를 너에게 풀어놓을 때까지
  rationale: 히브리어 관용구는 분노가 완전히 소진되어 ‘쉬게’ 되는 뜻이므로, 한국어에서는 그 심판적 완결성을 자연스럽게 드러내는 방향을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
