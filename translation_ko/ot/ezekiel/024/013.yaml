revisions:
- from: 네 더러움 속에는 음란함이 있습니다[a]. 내가 너를 깨끗하게 하려 하였으나, 너는 네 더러움에서 깨끗해지지 않았으므로[b], 내가 내 분노를 너에게 쏟아놓을 때까지 너는 다시는 깨끗해지지 못할 것입니다.
  to: 네 부정함 속에는 음란함이 있습니다[a]. 내가 너를 깨끗하게 하였는데도, 너는 네 부정함에서 깨끗해지지 않았습니다. 그러므로 내가 내 진노를 네게 다 쏟아 그치게 할 때까지, 너는 다시는 깨끗해지지 못할 것입니다[b].
  rationale: 원문 우선 원칙에 따라 첫 정결 동사의 완료형을 ‘깨끗하게 하였다’로 복원했습니다. 이는 영문 감사 기록에 제시된 ‘tried to cleanse’ 해석 가능성을 배제하는 교리적 판단이 아니라, 히브리어 본문이 명시하지 않은 시도 의미를 본문에 넣지 않으려는 조치입니다. 부정함과 음란함의 예언서적 비난 어휘를 유지하고, 진노 관용구의 심판 완결성을 자연스럽게 밝혔습니다. 각주는 실제 관련 구절에 다시 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:43:18Z'
