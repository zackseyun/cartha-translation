  verdict: revise
  source_fidelity: 첫 정결 동사 טִהַרְתִּיךְ는 피엘 완료형으로, 본문의 ‘하려 하였으나’는 히브리어의 완료 행위를 ‘시도’로 한정하여 옮긴 것입니다. 뒤의 וְלֹא טָהַרְתְּ는 ‘너는 정결해지지 않았다’라는 상태/결과를 나타내므로, 완료된 하나님의 정결 행위와 예루살렘의 지속된 부정함 사이의 긴장을 그대로 보존하는 편이 안전합니다. הֲנִיחִי אֶת־חֲמָתִי בָּךְ는 진노를 다 쏟아 그치게 한다는 관용적 완결성을 드러내도록 수정했습니다.
  naturalness: ‘부정함/정결해지다’는 에스겔의 도덕적·제의적 어휘를 유지하면서 현대 한국어의 공식 문체에서도 자연스럽습니다. 문장을 세 절로 정리하여 원문의 인과와 대조를 분명히 했습니다.
  terminology: טֻמְאָה는 문맥상 단순한 물리적 ‘더러움’보다 도덕적·제의적 함의를 지닌 ‘부정함’으로, זִמָּה는 ‘음란함’으로 옮겼습니다. חֵמָה는 심판 문맥에 맞게 ‘진노’로 옮겼습니다. 각주 표지는 실제로 설명하는 본문 위치에 배치했습니다.
