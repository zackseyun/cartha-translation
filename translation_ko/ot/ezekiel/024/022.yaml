id: EZK.24.22
reference: Ezekiel 24:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֖ם כַּ/אֲשֶׁ֣ר עָשִׂ֑יתִי עַל שָׂפָם֙ לֹ֣א תַעְט֔וּ וְ/לֶ֥חֶם אֲנָשִׁ֖ים לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/022.yaml
  text: 'And you will do as I have done: you will not cover your mustache[b][a], and you will not eat the bread of men.'
  footnotes:
  - marker: a
    text: Or possibly 'the mourner's bread,' that is, food brought by other people to comfort those in mourning.
    reason: lexical_alternative
  - marker: b
    text: Covering the mustache or upper lip was a customary sign of mourning or uncleanness.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 너희는 내가 한 대로 할 것입니다. 너희는 윗입술을 가리지 않을 것이며[a], 사람들의 떡을 먹지 않을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 윗입술이나 콧수염 부위를 가리는 것은 애도나 부정함의 관습적 표시였습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘애도하는 사람의 떡’, 곧 다른 사람들이 슬퍼하는 이들을 위로하려고 가져다준 음식일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם כַּאֲשֶׁר עָשִׂיתִי
  english_pob_choice: And you will do as I have done
  chosen_korean: 그리고 너희는 내가 한 것처럼 할 것입니다
  alternatives_korean:
  - 너희는 내가 한 대로 할 것입니다
  - 너희는 내가 한 것처럼 행할 것입니다
  lexicon: WLC
  rationale: 미래적 예고와 모범-모방 관계를 함께 살리기 위해 ‘할 것입니다’와 ‘내가 한 것처럼’을 사용했습니다.
- source_word: עַל שָׂפָם
  english_pob_choice: you will not cover your mustache
  chosen_korean: 너희는 수염을 가리지 않을 것이며
  alternatives_korean:
  - 너희는 콧수염을 가리지 않을 것이며
  - 너희는 윗입술을 가리지 않을 것이며
  lexicon: HALOT
  rationale: 문맥상 애도 관습의 신체 부위를 가리는 행위를 가리키므로, 현대 한국어로는 짧고 자연한 ‘수염을 가리다’가 가장 직역에 가깝습니다.
- source_word: לֶחֶם אֲנָשִׁים
  english_pob_choice: the bread of men
  chosen_korean: 사람들의 떡
  alternatives_korean:
  - 사람들의 빵
  - 남들이 가져다 준 떡
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 유지해 본문에는 ‘사람들의 떡’으로 두고, 별도 해석을 본문에 과도하게 들이지 않았습니다.
theological_decisions:
- issue: 애도 관습의 의미를 본문에 얼마나 명시할지
  chosen_reading: 본문은 행위 자체를 직접 명령하는 형태로 유지하고, 관습적 의미는 주석으로 처리합니다.
  alternative_readings:
  - 가리개를 쓰지 않을 것입니다
  - 애도 표시를 하지 않을 것입니다
  rationale: 히브리어는 구체적 상징행위를 서술하지만, 본문 의미를 넘어 ‘애도 표시’로 일반화하면 관찰 가능한 신체 동작의 표지를 약화시킬 수 있습니다.
  doctrine_reference: 문맥 주해 원리
