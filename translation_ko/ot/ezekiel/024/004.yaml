source:
  edition: WLC
  text: אֱסֹ֤ף נְתָחֶ֨י/הָ֙ אֵלֶ֔י/הָ כָּל נֵ֥תַח ט֖וֹב יָרֵ֣ךְ וְ/כָתֵ֑ף מִבְחַ֥ר עֲצָמִ֖ים מַלֵּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/004.yaml
  text: Gather its pieces into it[a], every good piece—the thigh and the shoulder[b]; fill it with choice bones.
  footnotes:
  - marker: a
    text: Or 'its cuts of meat' for 'its pieces'; the Hebrew term refers to butchered portions.
    reason: lexical_alternative
  - marker: b
    text: Or 'every choice piece'; 'good' here carries the sense of desirable or select portions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것의 조각들을 그 안에 모으십시오 — 곧 좋은 모든 조각들, 곧 넓적다리와 어깨를 — 그리고 좋은 뼈들로 가득 채우십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것의 고기 조각들’; 히브리어 용어는 도살하여 잘라낸 분할 부위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 좋은 조각들’; 여기서 ‘좋은’은 ‘선별된’ 또는 ‘알맞은’ 조각의 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱסֹף
  english_pob_choice: Gather
  chosen_korean: 모으십시오
  alternatives_korean:
  - 모으세요
  - 가져다 넣으십시오
  - 거두십시오
  lexicon: HALOT
  rationale: 제사장적 조리 지시처럼 들리는 명령형을 살리면서도, 문맥상 흩어진 고기 조각을 한데 넣는 동작을 자연스럽게 나타냅니다.
- source_word: נְתָחֶיהָ
  english_pob_choice: its pieces
  chosen_korean: 그것의 조각들
  alternatives_korean:
  - 그것의 고기 조각들
  - 그것의 토막들
  - 그것의 절단된 조각들
  lexicon: HALOT
  rationale: 히브리어 נתח는 도살·절단된 분할 조각을 가리키므로, 한국어에서는 너무 기계적이지 않게 ‘조각들’로 옮기되 문맥상 대상이 솥에 넣을 고기임을 앞뒤로 드러냅니다.
- source_word: כָּל נֵתַח טוֹב
  english_pob_choice: every good piece
  chosen_korean: 좋은 모든 조각들
  alternatives_korean:
  - 모든 좋은 조각들
  - 좋은 모든 부위들
  - 모든 좋은 부위들
  lexicon: HALOT
  rationale: ‘כל’의 분배적 의미를 살려 ‘모든’으로 옮기고, טוֹב는 여기서 도덕적 ‘좋음’이 아니라 알맞고 값진 ‘좋은/선별된’ 조각의 뜻이므로 자연스러운 형용사로 유지했습니다.
- source_word: יָרֵךְ וְכָתֵף
  english_pob_choice: the thigh and the shoulder
  chosen_korean: 넓적다리와 어깨
  alternatives_korean:
  - 넓적다리와 어깨 부위
  - 허벅지와 어깨
  - 넓적다리와 어깨살
  lexicon: HALOT
  rationale: 동물 도살 맥락의 해부학적 부위를 그대로 반영해야 하므로, 관용적이지만 비교적 정확한 ‘넓적다리와 어깨’를 선택했습니다.
- source_word: מִבְחַר עֲצָמִים
  english_pob_choice: choice bones
  chosen_korean: 좋은 뼈들
  alternatives_korean:
  - 선별된 뼈들
  - 좋은 뼈 조각들
  - 고른 뼈들
  lexicon: HALOT
  rationale: 영어 POB의 수정본이 과도한 최상급을 피했듯이, 히브리어 구성도 ‘가장 좋은’보다는 선별된 뼈들을 뜻하므로 ‘좋은 뼈들’로 단정하게 옮깁니다.
theological_decisions:
- issue: 주전자/솥 비유에서 고기와 뼈를 넣으라는 명령의 냉혹한 이미지 보존
  chosen_reading: 부드럽게 완화하지 않고, 도살된 조각과 뼈를 솥에 넣는 지시의 거친 이미지를 그대로 살렸습니다.
  alternative_readings:
  - ‘재료를 넣으십시오’처럼 중화된 표현
  - ‘살점’을 중심으로 부드럽게 표현
  rationale: 본문은 심판 비유의 감각적 충격을 의도하므로, 일상적 조리 문장처럼 순화하면 예언적 긴장이 약해집니다.
  doctrine_reference: 예언서의 심판 상징과 문학적 강도 유지
- issue: 대상 지시어의 중성화
  chosen_reading: ‘그것’으로 솥을 가리켜 히브리어의 여성형 지시를 한국어의 무생물 지시 관습에 맞게 옮겼습니다.
  alternative_readings:
  - ‘그녀’로 직역
  - 명시적으로 ‘솥’ 반복
  rationale: 한국어에서는 솥을 ‘그녀’로 받는 표현이 부자연스러우므로, 원문 지시 관계는 유지하되 자연스러운 무생물 지시로 처리했습니다.
  doctrine_reference: 한국어 대명사 관습과 원문 지시 관계 보존
