id: EZK.24.18
reference: Ezekiel 24:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֲדַבֵּ֤ר אֶל הָ/עָם֙ בַּ/בֹּ֔קֶר וַ/תָּ֥מָת אִשְׁתִּ֖/י בָּ/עָ֑רֶב וָ/אַ֥עַשׂ בַּ/בֹּ֖קֶר כַּ/אֲשֶׁ֥ר צֻוֵּֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/018.yaml
  text: So I spoke to the people in the morning[a], and my wife died in the evening. Then in the morning I did as I had been commanded.
  footnotes:
  - marker: a
    text: Or, 'And I spoke to the people in the morning ... and in the morning I did as I was commanded.' The Hebrew narrative uses repeated waw-linked verbs; the translation smooths them into natural English while preserving the sequence.
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 내가 아침에 백성에게 말하였고, 저녁에 내 아내가 죽었습니다. 다음 날 아침에 나는 명령받은 대로 행하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 내가 아침에 백성에게 말하였고, 저녁에 내 아내가 죽었습니다. 그리고 아침에 나는 명령받은 대로 행하였습니다.” 히브리어는 와우로 연결된 동사를 반복하여 서술을 진행합니다. 여기서는 시간의 순서를 자연스러운 한국어로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר אֶל הָעָם
  english_pob_choice: So I spoke to the people
  chosen_korean: 내가 ... 백성에게 말하였는데
  alternatives_korean:
  - 내가 ... 사람들에게 말하였는데
  - 내가 ... 백성에게 말하였고
  lexicon: HALOT
  rationale: וַ/וָ- 연속동사는 서사의 진행을 나타내므로 ‘그리하여/…였는데’로 자연스럽게 이어 주고, אֶל הָעָם은 집합적 의미의 ‘백성’으로 옮겼습니다.
- source_word: בַּבֹּקֶר / בָּעָרֶב
  english_pob_choice: in the morning / in the evening
  chosen_korean: 아침에 / 저녁에
  alternatives_korean:
  - 오전에 / 저녁때에
  - 그 아침에 / 그 저녁에
  lexicon: HALOT
  rationale: 대조되는 시간 표현을 한국어에서도 간결하게 대응시키기 위해 일상적이면서도 문어적인 ‘아침에/저녁에’로 옮겼습니다.
- source_word: וַתָּמָת אִשְׁתִּי
  english_pob_choice: my wife died
  chosen_korean: 내 아내가 죽었습니다
  alternatives_korean:
  - 아내가 죽었습니다
  - 내 아내가 세상을 떠났습니다
  lexicon: HALOT
  rationale: מות의 직접적 의미를 따라 ‘죽었습니다’로 옮겼고, אִשְׁתִּי는 관계를 분명히 하는 ‘내 아내’로 번역했습니다.
- source_word: וָאַעַשׂ ... כַּאֲשֶׁר צֻוֵּיתִי
  english_pob_choice: Then in the morning I did as I had been commanded
  chosen_korean: 그 다음 날 아침에 나는 명령받은 대로 행하였습니다
  alternatives_korean:
  - 그리고 아침에 나는 명령받은 대로 했습니다
  - 그리하여 아침에 나는 명령받은 대로 행했습니다
  lexicon: HALOT
  rationale: עשה는 여기서 ‘행하다’로 넓은 순종 행위를 나타내며, כַּאֲשֶׁר צֻוֵּיתִי는 관용적으로 ‘명령받은 대로’가 가장 자연스럽습니다.
theological_decisions:
- issue: 서술의 순서와 시간표현이 예언자적 표징행동의 충격을 드러내는 방식
  chosen_reading: 문장 연결을 매끄럽게 하되, 아내의 죽음과 곧바른 순종의 대비는 그대로 살렸습니다.
  alternative_readings:
  - 원문형에 더 가깝게 ‘그리고/또’의 반복을 살리는 방식
  - 더 완곡하게 ‘세상을 떠났습니다’로 완화하는 방식
  rationale: 히브리어의 연속 동사 구조는 사건의 급박한 진행과 대비를 강조하므로, 한국어에서도 그 긴장감을 유지하는 것이 문맥상 중요합니다.
  doctrine_reference: 에스겔 24장의 표징행동과 예언 수행의 서사적 긴장
