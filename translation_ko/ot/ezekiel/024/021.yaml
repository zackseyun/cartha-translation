  text: אֱמֹ֣ר לְ/בֵ֣ית יִשְׂרָאֵ֗ל כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנְ/נִ֨י מְחַלֵּ֤ל אֶת מִקְדָּשִׁ/י֙ גְּא֣וֹן עֻזְּ/כֶ֔ם מַחְמַ֥ד עֵֽינֵי/כֶ֖ם וּ/מַחְמַ֣ל נַפְשְׁ/כֶ֑ם וּ/בְנֵי/כֶ֧ם וּ/בְנֽוֹתֵי/כֶ֛ם אֲשֶׁ֥ר עֲזַבְתֶּ֖ם בַּ/חֶ֥רֶב יִפֹּֽלוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/021.yaml
  text: 'Say to the house of Israel[a], ‘Thus says the Lord GOD: Behold, I am about to profane my sanctuary, the pride of your strength, the delight of your eyes, and the desire of your soul[c][b]; and your sons and your daughters whom you left behind will fall by the sword.’'
  footnotes:
  - marker: a
    text: Or 'defile' or 'desecrate' my sanctuary.
    reason: lexical_alternative
  - marker: b
    text: Or 'the desire of your eyes' for 'the delight of your eyes.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew expression may also be understood as 'that which your soul pities/cherishes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 집안에게 말하십시오. 「주 야훼께서 이렇게 말씀하십니다. 보십시오, 내가 내 성소를 더럽히겠습니다. 곧 너희 힘의 자랑, 너희 눈이 즐거워하는 것, 너희 마음이 아끼는 것, 그리고 너희가 남겨 두었던 너희 아들들과 너희 딸들이 칼에 쓰러질 것입니다」.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘더럽히겠습니다’는 성소를 부정하게 만들거나 거룩한 용도에서 떼어 놓는 뜻을 함께 담습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너희 눈이 즐거워하는 것’은 ‘너희 눈의 기쁨’ 또는 ‘너희 눈이 사랑하는 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘너희 마음이 아끼는 것’은 ‘너희 혼이 불쌍히 여기는 것’ 혹은 ‘너희 영혼이 소중히 여기는 것’으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר / לְבֵית יִשְׂרָאֵל
  english_pob_choice: Say to the house of Israel
  chosen_korean: 이스라엘 집안에게 말하십시오
  alternatives_korean:
  - 이스라엘 집에게 말하십시오
  - 이스라엘에게 말하십시오
  lexicon: WLC + POB audit trail
  rationale: 예언자에게 주어진 명령형과 집합 명칭을 함께 살려, 단순히 ‘이스라엘’로 평평하게 만들지 않고 공동체 전체를 가리키는 표현을 유지했습니다.
- source_word: מְחַלֵּל
  english_pob_choice: profane
  chosen_korean: 더럽히겠습니다
  alternatives_korean:
  - 속되게 하겠습니다
  - 모독하겠습니다
  - 더럽히고 말겠습니다
  lexicon: HALOT
  rationale: 성소를 거룩한 용도에서 일반 상태로 떨어뜨린다는 뜻을 한국어로 자연스럽게 옮기면서, POB의 ‘profane’가 지닌 성소 훼손의 강한 의미를 유지했습니다.
- source_word: מִקְדָּשִׁי
  english_pob_choice: my sanctuary
  chosen_korean: 내 성소
  alternatives_korean:
  - 내 성전
  - 내 거룩한 곳
  lexicon: HALOT
  rationale: 마קדש의 기본 의미를 살려 ‘성전’보다 넓고 정확한 ‘성소’를 선택했습니다.
- source_word: גְּאוֹן עֻזְּכֶם / מַחְמַד עֵינֵיכֶם / וּמַחְמַל נַפְשְׁכֶם
  english_pob_choice: the pride of your strength, the delight of your eyes, and the desire of your soul
  chosen_korean: 너희 힘의 자랑, 너희 눈이 즐거워하는 것, 너희 마음이 아끼는 것
  alternatives_korean:
  - 너희 힘의 영광, 너희 눈의 기쁨, 너희 영혼의 갈망
  - 너희 힘의 자랑, 너희 눈의 즐거움, 너희 혼이 아끼는 것
  lexicon: HALOT
  rationale: 3중 병렬 구조를 그대로 살리되, ‘마음이 아끼는 것’으로 희귀 표현의 애틋함과 상실감을 드러냈습니다. ‘너희 눈이 즐거워하는 것’은 POB의 ‘delight of your eyes’를 직역보다 자연스럽게 재현합니다.
- source_word: וּבְנֵיכֶם וּבְנוֹתֵיכֶם ... בַּחֶרֶב יִפֹּלוּ
  english_pob_choice: your sons and your daughters ... will fall by the sword
  chosen_korean: 너희가 남겨 두었던 너희 아들들과 너희 딸들이 칼에 쓰러질 것입니다
  alternatives_korean:
  - 너희 아들들과 너희 딸들이 칼에 죽을 것입니다
  - 너희가 남겨 둔 너희 아들들과 너희 딸들이 칼에 엎드러질 것입니다
  lexicon: HALOT
  rationale: 남겨진 자녀들이 예루살렘에 남아 전쟁의 희생이 된다는 문맥을 살려 ‘남겨 두었던’을 넣었고, 히브리어 관용구는 한국어에서 ‘칼에 쓰러질 것입니다’로 보존했습니다.
theological_decisions:
- issue: יְהוִה의 표기와 호칭
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 본문의 신명호칭을 음역해 드러내면서도, 예언 공식의 주격 호칭은 ‘주’로 살려 ‘주 야훼’로 옮겼습니다. 이는 본문이 가진 언약적·선포적 긴장을 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
