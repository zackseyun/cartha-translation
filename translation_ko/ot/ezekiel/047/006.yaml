revisions:
- from: 그가 제게 말씀하셨습니다. "보았느냐, 인자야?" 그리고 그가 저를 이끌어 다시 그 시내 언덕으로 데려오셨습니다.[a][b][c][d]
  to: 그가 내게 말했습니다. “네가 보았습니까, 인자야?” 그러고서 그는 나를 이끌고 다시 시내 둑으로 데려왔습니다.[a][b][c][d]
  rationale: ‘시내 언덕’을 원문의 물가 의미에 맞는 ‘시내 둑’으로 바로잡았습니다. 귀환을 뜻하는 두 번째 동사를 ‘다시 ... 데려왔습니다’로 살리고, 첫 번째 동사는 ‘이끌고’로 보존했습니다. 명시되지 않은 목적어는 보충하지 않았으며, ‘인자’와 관련 각주는 유지했습니다.
