  source_fidelity: ‘시내 언덕’은 שְׂפַת הַנָּחַל(시내의 둑/가장자리)를 ‘언덕’으로 바꾸어 지형을 달리하므로 수정이 필요합니다. 또한 원문의 두 동사 ‘이끌다’와 ‘되돌려 데려오다’를 한국어에서도 구별해 반영하는 편이 정확합니다. 목적어는 히브리어에 명시되지 않았으므로 ‘이것을’을 보태지 않았습니다.
  naturalness: ‘시내 둑’이 물줄기의 가장자리를 가리키는 현대 표준어로 자연스럽고 정확합니다. 직접화법은 요청된 현대 합쇼체에 맞추어 ‘보았습니까’로 옮겼습니다.
  terminology: 에스겔에서 반복되는 בֶּן־אָדָם은 문학적 호칭을 보존하여 ‘인자’로 유지했습니다. נַחַל은 환상의 흐르는 물길 문맥에서 ‘시내’로 두되, 와디·강의 가능성은 각주에 남깁니다.
