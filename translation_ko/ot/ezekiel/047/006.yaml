source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלַ֖/י הֲ/רָאִ֣יתָ בֶן אָדָ֑ם וַ/יּוֹלִכֵ֥/נִי וַ/יְשִׁבֵ֖/נִי שְׂפַ֥ת הַ/נָּֽחַל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/006.yaml
  text: Then he said to me[a], “Have you seen this[d][c][b], son of man?” Then he led me and brought me back to the bank of the stream.
  footnotes:
  - marker: a
    text: Or “Have you seen?”
    reason: lexical_alternative
  - marker: b
    text: Hebrew son of man.
    reason: lexical_alternative
  - marker: c
    text: Or “the edge of the stream”; Hebrew literally “the lip of the stream.”
    reason: lexical_alternative
  - marker: d
    text: Or “wadi” or “river,” depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. "보았느냐, 인자야?" 그리고 그가 저를 이끌어 다시 그 시내 언덕으로 데려오셨습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “보았느냐?”
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 “인자”입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “시내 가장자리”; 히브리어는 문자적으로 “시내의 입술”입니다.
    reason: lexical_alternative
  - marker: d
    text: 문맥에 따라 “와디” 또는 “강”으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  english_pob_choice: Then he said to me
  chosen_korean: 그가 제게 말씀하셨습니다
  alternatives_korean:
  - 그가 제게 말했습니다
  - 그리고 그가 제게 말씀하셨습니다
  lexicon: WLC
  rationale: 서술 흐름을 자연스럽게 잇되, 예언적 대화의 격식을 살려 ‘말씀하셨습니다’를 사용했습니다.
- source_word: הֲרָאִיתָ
  english_pob_choice: Have you seen this
  chosen_korean: 보았느냐
  alternatives_korean:
  - 보았습니까
  - 네가 보았느냐
  lexicon: WLC
  rationale: 히브리어의 수사적 질문을 짧고 직접적으로 살려, 본문의 확인·환기의 뉘앙스를 유지했습니다.
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: WLC
  rationale: 에스겔의 반복적 호칭을 보존하기 위해 ‘인자’를 유지했고, 직접 호격이므로 한국어 자연성을 위해 호격 어미를 붙였습니다.
- source_word: שְׂפַת הַנָּחַל
  english_pob_choice: the bank of the stream
  chosen_korean: 그 시내 언덕으로
  alternatives_korean:
  - 그 시내 언덕가로
  - 그 강둑으로
  - 그 시내 언덕으로
  lexicon: WLC
  rationale: נחל을 이 문맥의 흐르는 물줄기로 보고 ‘시내’로 옮겼으며, שָׂפָה의 문자적 ‘입술/가장자리’를 한국어에서 위치를 가리키는 자연스러운 표현으로 풀어 썼습니다.
theological_decisions:
- issue: 예언자 호칭 בֶן אָדָם의 한국어 보존
  chosen_reading: ‘인자’로 두고 호격을 살려 ‘인자야’로 옮겼습니다.
  alternative_readings:
  - 사람아
  - 인간아
  rationale: 에스겔의 반복되는 소명 형식을 지우지 않고, 본문의 문학적·신학적 패턴을 독자가 인식하도록 하기 위함입니다.
  doctrine_reference: POB source-direct naming convention for Ezekiel's prophetic address
