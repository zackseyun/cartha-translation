  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פְאַת יָם֙ הַ/יָּ֣ם הַ/גָּד֔וֹל מִ/גְּב֕וּל עַד נֹ֖כַח לְב֣וֹא חֲמָ֑ת זֹ֖את פְּאַת יָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/020.yaml
  text: And the west side shall be the Great Sea[a], from the border up to opposite Lebo-hamath[b]. This is the west side.
  footnotes:
  - marker: a
    text: Hebrew Lebo-hamath, traditionally understood as 'the entrance of Hamath,' likely functioning here as a place-name in the northern extent of the land.
    reason: lexical_alternative
  - marker: b
    text: Literally 'sea side'; in Israel's geography this denotes the west side, facing the Mediterranean ('the Great Sea').
    reason: cultural_note
translation:
  language: ko
  text: 그리고 서쪽 변은 큰 바다[a]로부터, 레보-하맛[b] 맞은편까지입니다. 이것이 서쪽 변입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘레보-하맛’을 가리키는 표현으로, 문자적으로는 ‘하맛의 어귀’입니다. 이 구절에서는 북쪽 경계의 지명처럼 기능합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘바다 쪽’이지만, 이스라엘 지리에서는 지중해가 서쪽에 있으므로 ‘서쪽 변’의 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/פְאַת יָם
  english_pob_choice: And the west side
  chosen_korean: 서쪽 변
  alternatives_korean:
  - 서쪽 편
  - 바다 쪽
  - 서해 쪽
  lexicon: HALOT
  rationale: פְּאָה는 경계 묘사에서 ‘변, 가장자리, 측면’의 뜻이며, יָם과 결합한 관용은 지리적으로 서쪽을 가리키므로 ‘서쪽 변’이 의미를 자연스럽게 살립니다.
- source_word: הַ/יָּם הַ/גָּדוֹל
  english_pob_choice: the Great Sea
  chosen_korean: 큰 바다
  alternatives_korean:
  - 대해
  - 지중해
  - 큰 바다
  lexicon: HALOT
  rationale: 히브리어의 표준 지리명칭을 따르되, 한국어에서는 ‘큰 바다’가 원문 표현을 비교적 직접적으로 살리면서도 이해 가능하게 합니다.
- source_word: לְבֹא חֲמָת
  english_pob_choice: Lebo-hamath
  chosen_korean: 레보-하맛
  alternatives_korean:
  - 하맛의 어귀
  - 레보하맛
  - 하맛 입구
  lexicon: HALOT
  rationale: 경계 공식에서 고유 지명처럼 기능하므로 음역을 택했습니다. 원뜻은 ‘하맛의 어귀’이지만, 본문에서는 지명적 용법이 우선합니다.
- source_word: עַד נֹכַח
  english_pob_choice: up to opposite
  chosen_korean: 맞은편까지
  alternatives_korean:
  - 마주한 곳까지
  - 대하여
  - 맞은쪽까지
  lexicon: HALOT
  rationale: נֹכַח의 공간적 의미인 ‘맞은편, 마주한 곳’을 한국어 경계 표현으로 자연스럽게 옮겼습니다.
