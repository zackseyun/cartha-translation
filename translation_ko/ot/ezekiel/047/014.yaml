base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/014.yaml
  text: You shall inherit it[a], each like his brother, concerning which I raised my hand to give it to your fathers[c][b]; and this land shall fall to you as an inheritance.
  footnotes:
  - marker: a
    text: Hebrew 'raised my hand,' an oath idiom; that is, 'swore.'
    reason: lexical_alternative
  - marker: b
    text: Or 'each equally with his brother.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'shall fall to you,' an idiom for being allotted as an inheritance.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 그것을 각각 자기 형제처럼 유업으로 받을 것입니다[a][b]. 내가 그것을 너희 조상들에게 주기로 손을 들어 맹세한 일이 있으며[c], 이 땅은 너희에게 유업으로 떨어질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '내가 손을 들었다'입니다. 이는 맹세를 가리키는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '각각 자기 형제와 동등하게'입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 '너희에게 떨어질 것입니다'입니다. 몫이 배정되어 유업으로 주어지는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְחַלְתֶּם / וּנְחַלְתֶּם אוֹתָהּ
  english_pob_choice: You shall inherit it
  chosen_korean: 그것을 … 유업으로 받을 것입니다
  alternatives_korean:
  - 그것을 상속받을 것입니다
  - 그것을 기업으로 받을 것입니다
  lexicon: HALOT
  rationale: נחל의 유업/상속 의미를 살리되, 한국어에서는 '유업으로 받다'가 토지 분배 맥락을 가장 자연스럽고 문어적으로 드러냅니다.
- source_word: אִישׁ כְּאָחִיו
  english_pob_choice: each like his brother
  chosen_korean: 각각 자기 형제처럼
  alternatives_korean:
  - 각자 형제와 같이
  - 각 사람마다 그의 형제처럼
  lexicon: HALOT
  rationale: 히브리어의 남성형 분배 표현을 유지하면서, 공동체 내의 균등한 분배라는 뜻을 한국어로 자연스럽게 전달했습니다.
- source_word: נָשָׂאתִי אֶת יָדִי
  english_pob_choice: I raised my hand
  chosen_korean: 손을 들어 맹세한
  alternatives_korean:
  - 손을 들어 올린
  - 맹세한
  lexicon: HALOT
  rationale: 직역 이미지를 너무 굳히지 않으면서도, 주석의 오트(맹세) 관용구 의미를 본문에 반영할 수 있도록 '손을 들어 맹세한'으로 옮겼습니다.
- source_word: וְנָפְלָה … בְּנַחֲלָה
  english_pob_choice: shall fall to you as an inheritance
  chosen_korean: 너희에게 유업으로 떨어질 것입니다
  alternatives_korean:
  - 너희에게 분배될 것입니다
  - 너희 몫이 될 것입니다
  lexicon: HALOT
  rationale: נפל의 관용적 용법을 살려 '떨어지다'를 유지했고, 그 결과를 '유업'으로 받아 토지 상속의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 맹세 관용구의 처리
  chosen_reading: 본문에는 '손을 들어 맹세한 일'로 두고, 관용구의 해석을 본문 안에 반영했습니다.
  alternative_readings:
  - '''손을 들었다''를 문자적으로만 옮김'
  - '''맹세했다''로만 평탄화'
  rationale: 하나님이 조상들에게 주기로 하신 언약적 약속의 확실성을 드러내되, 원문 이미지와 해석을 함께 살리는 쪽이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
- issue: 분배의 공평성 표현
  chosen_reading: '''각각 자기 형제처럼''으로 옮겨 공동체 내 균등 분배를 드러냈습니다.'
  alternative_readings:
  - '''각각 동등하게'''
  - '''각자 같은 몫으로'''
  rationale: 본문의 핵심은 혈연적 비교가 아니라 몫의 공평성입니다. 그러나 히브리어 분배 표현을 삭제하지 않기 위해 직역성을 남겼습니다.
  doctrine_reference: 'Translation philosophy: Gender-accurate over gender-neutral.'
