id: EZK.47.19
reference: Ezekiel 47:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פְאַת֙ נֶ֣גֶב תֵּימָ֔נָ/ה מִ/תָּמָ֗ר עַד מֵי֙ מְרִיב֣וֹת קָדֵ֔שׁ נַחֲלָ֖ה אֶל הַ/יָּ֣ם הַ/גָּד֑וֹל וְ/אֵ֥ת פְּאַת תֵּימָ֖נָ/ה נֶֽגְבָּ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/019.yaml
  text: And the south side[a], southward, shall be from Tamar to the waters of Meriboth-kadesh, to the wadi, to the Great Sea. This is the south side[c][b], southward.
  footnotes:
  - marker: a
    text: Or, 'the waters of Meribah-kadesh.' The Hebrew here reads 'Meriboth-kadesh,' a related place-name form.
    reason: alternative_reading
  - marker: b
    text: Or, 'wadi'; the Hebrew term refers to a streambed or watercourse, often seasonal.
    reason: lexical_alternative
  - marker: c
    text: That is, the Mediterranean Sea.
    reason: cultural_note
translation:
  language: ko
  text: 남쪽 변[a], 곧 남쪽으로는 다말에서부터 므리봇-가데스의 물까지, 나할까지, 큰 바다까지입니다. 이것이 남쪽 변[b][c], 곧 남쪽으로입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘메리바-가데스의 물’. 여기의 히브리어는 관련된 지명형인 ‘므리봇-가데스’를 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘와디’; 히브리어 용어는 흔히 계절성인 하천 바닥이나 물길을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 지중해입니다.
    reason: cultural_note
lexical_decisions:
- source_word: פְאַת
  english_pob_choice: side
  chosen_korean: 변
  alternatives_korean:
  - 쪽
  - 변두리
  - 가장자리
  lexicon: HALOT
  rationale: 경계 설명 문맥에서 פְאַת는 단순한 ‘면’보다 경계의 ‘변’이 자연스럽고, 반복되는 지형 목록과도 잘 맞습니다.
- source_word: נֶגֶב / תֵּימָנָה
  english_pob_choice: south side, southward
  chosen_korean: 남쪽 변, 곧 남쪽으로
  alternatives_korean:
  - 남쪽 쪽, 남쪽으로
  - 남쪽 경계, 남쪽으로
  - 남변, 남쪽으로
  lexicon: HALOT
  rationale: 두 표현이 방향을 중복해 강조하므로 ‘남쪽 변, 곧 남쪽으로’로 이중 표지를 살려 번역했습니다.
- source_word: מִתָּמָר
  english_pob_choice: from Tamar
  chosen_korean: 다말에서부터
  alternatives_korean:
  - 다말로부터
  - 다말에서
  - 다말부터
  lexicon: HALOT
  rationale: 지명은 음역하고, 경계의 출발점을 분명히 하기 위해 ‘-에서부터’를 썼습니다.
- source_word: מֵי מְרִיבוֹת קָדֵשׁ
  english_pob_choice: the waters of Meriboth-kadesh
  chosen_korean: 므리봇-가데스의 물
  alternatives_korean:
  - 메리봇-가데스의 물
  - 므리바-가데스의 물
  lexicon: HALOT
  rationale: 히브리어 자음형이 ‘Meriboth-kadesh’를 지지하므로 이를 반영해 음역했고, POB 각주처럼 친숙한 관련 형태와의 차이를 보존했습니다.
- source_word: נַחֲלָה
  english_pob_choice: to the wadi
  chosen_korean: 나할까지
  alternatives_korean:
  - 와디까지
  - 개울까지
  - 계곡까지
  lexicon: HALOT
  rationale: 경계 목록에서 נַחֲלָה는 상속분이 아니라 물길/건천을 가리키므로, 지명적이면서도 지형을 드러내는 ‘나할’ 음역을 유지했습니다.
- source_word: הַיָּם הַגָּדוֹל
  english_pob_choice: the Great Sea
  chosen_korean: 큰 바다
  alternatives_korean:
  - 대해
  - 지중해
  - 큰 바다
  lexicon: HALOT
  rationale: 성경의 관용 지리명칭을 그대로 살리기 위해 ‘큰 바다’로 옮기고, 본문 안에서 현대 지리명으로 풀어쓰지는 않았습니다.
