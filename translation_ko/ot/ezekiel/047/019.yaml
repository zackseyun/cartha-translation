  - 변두리
  - 가장자리
  lexicon: HALOT
  rationale: 경계 설명 문맥에서 פְאַת는 단순한 ‘면’보다 경계의 ‘변’이 자연스럽고, 반복되는 지형 목록과도 잘 맞습니다.
- source_word: נֶגֶב / תֵּימָנָה
  english_pob_choice: south side, southward
  chosen_korean: 남쪽 변, 곧 남쪽으로
  alternatives_korean:
  - 남쪽 쪽, 남쪽으로
  - 남쪽 경계, 남쪽으로
  - 남변, 남쪽으로
  lexicon: HALOT
  rationale: 두 표현이 방향을 중복해 강조하므로 ‘남쪽 변, 곧 남쪽으로’로 이중 표지를 살려 번역했습니다.
- source_word: מִתָּמָר
  english_pob_choice: from Tamar
  chosen_korean: 다말에서부터
  alternatives_korean:
  - 다말로부터
  - 다말에서
  - 다말부터
  lexicon: HALOT
  rationale: 지명은 음역하고, 경계의 출발점을 분명히 하기 위해 ‘-에서부터’를 썼습니다.
- source_word: מֵי מְרִיבוֹת קָדֵשׁ
  english_pob_choice: the waters of Meriboth-kadesh
  chosen_korean: 므리봇-가데스의 물
  alternatives_korean:
  - 메리봇-가데스의 물
  - 므리바-가데스의 물
  lexicon: HALOT
  rationale: 히브리어 자음형이 ‘Meriboth-kadesh’를 지지하므로 이를 반영해 음역했고, POB 각주처럼 친숙한 관련 형태와의 차이를 보존했습니다.
- source_word: נַחֲלָה
  english_pob_choice: to the wadi
  chosen_korean: 나할까지
  alternatives_korean:
  - 와디까지
  - 개울까지
  - 계곡까지
  lexicon: HALOT
  rationale: 경계 목록에서 נַחֲלָה는 상속분이 아니라 물길/건천을 가리키므로, 지명적이면서도 지형을 드러내는 ‘나할’ 음역을 유지했습니다.
- source_word: הַיָּם הַגָּדוֹל
  english_pob_choice: the Great Sea
  chosen_korean: 큰 바다
  alternatives_korean:
  - 대해
  - 지중해
  - 큰 바다
  lexicon: HALOT
  rationale: 성경의 관용 지리명칭을 그대로 살리기 위해 ‘큰 바다’로 옮기고, 본문 안에서 현대 지리명으로 풀어쓰지는 않았습니다.
