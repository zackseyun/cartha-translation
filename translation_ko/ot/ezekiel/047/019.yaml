id: EZK.47.19
reference: Ezekiel 47:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פְאַת֙ נֶ֣גֶב תֵּימָ֔נָ/ה מִ/תָּמָ֗ר עַד מֵי֙ מְרִיב֣וֹת קָדֵ֔שׁ נַחֲלָ֖ה אֶל הַ/יָּ֣ם הַ/גָּד֑וֹל וְ/אֵ֥ת פְּאַת תֵּימָ֖נָ/ה נֶֽגְבָּ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/019.yaml
  text: And the south side[a], southward, shall be from Tamar to the waters of Meriboth-kadesh, to the wadi, to the Great Sea. This is the south side[c][b], southward.
  footnotes:
  - marker: a
    text: Or, 'the waters of Meribah-kadesh.' The Hebrew here reads 'Meriboth-kadesh,' a related place-name form.
    reason: alternative_reading
  - marker: b
    text: Or, 'wadi'; the Hebrew term refers to a streambed or watercourse, often seasonal.
    reason: lexical_alternative
  - marker: c
    text: That is, the Mediterranean Sea.
    reason: cultural_note
translation:
  language: ko
  text: 남쪽 변은, 곧 남쪽 방향으로는 다말에서부터 므리봇-가데스의 물[a]까지, 와디[b]까지, 큰 바다[c]까지입니다. 이것이 남쪽 변, 곧 남쪽 방향입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘메리바-가데스의 물’. 여기의 히브리어는 관련된 지명형인 ‘므리봇-가데스’를 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘와디’; 히브리어 용어는 흔히 계절성인 하천 바닥이나 물길을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 지중해입니다.
    reason: cultural_note
lexical_decisions:
- source_word: פְאַת
  english_pob_choice: side
  chosen_korean: 변
  alternatives_korean:
