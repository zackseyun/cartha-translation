  terminology: ‘땅’, ‘이스라엘’, ‘지파’는 성경의 영토 분배 문맥에 적합한 표준 용어입니다. ‘이스라엘의 지파들에 따라’는 복수형과 분배 기준의 관계를 명확히 합니다.
