  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חִלַּקְתֶּ֞ם אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לָ/כֶ֖ם לְ/שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/021.yaml
  text: So you shall divide this land among yourselves according to the tribes of Israel[a].
  footnotes:
  - marker: a
    text: Or, 'And you shall divide this land for yourselves, for the tribes of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이 땅을 이스라엘의 지파들에 따라 너희끼리 나누어야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחִלַּקְתֶּם
  english_pob_choice: So you shall divide
  chosen_korean: 그러므로 … 나누어야 합니다
  alternatives_korean:
  - 그리고 너희는 나누어야 합니다
  - 너희는 분배해야 합니다
  lexicon: HALOT
  rationale: 피엘형 חלק의 의미인 ‘나누다/분배하다’를 직접 살리되, 앞 문맥의 경계 설명에서 이어지는 전개를 반영해 ‘그러므로’로 자연스럽게 옮겼습니다.
- source_word: הָאָרֶץ הַזֹּאת
  english_pob_choice: this land
  chosen_korean: 이 땅
  alternatives_korean:
  - 이 토지
  - 이 지역
  lexicon: HALOT
  rationale: 영토 분배 문맥에서 אֶרֶץ는 표준적으로 ‘땅’이 가장 직접적이고 넓이도 충분한 대응입니다.
- source_word: לָכֶם
  english_pob_choice: among yourselves
  chosen_korean: 너희끼리
  alternatives_korean:
  - 너희를 위하여
  - 너희에게
  lexicon: HALOT
  rationale: 직역하면 ‘너희를 위하여/너희에게’이지만, 공동체 내부의 상호 분배라는 문맥을 살려 한국어 관용 표현 ‘너희끼리’로 옮겼습니다.
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: according to the tribes of Israel
  chosen_korean: 이스라엘의 지파들에 따라
  alternatives_korean:
  - 이스라엘 지파들에게
  - 이스라엘의 지파들을 위하여
  lexicon: HALOT
  rationale: ל의 분배 기준/관련성을 드러내기 위해 ‘-에 따라’로 옮겼고, ‘지파들’은 복수성을 분명히 하기 위한 표현입니다.
