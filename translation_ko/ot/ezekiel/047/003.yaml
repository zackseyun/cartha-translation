source:
  edition: WLC
  text: בְּ/צֵאת הָ/אִ֥ישׁ קָדִ֖ים וְ/קָ֣ו בְּ/יָד֑/וֹ וַ/יָּ֤מָד אֶ֨לֶף֙ בָּֽ/אַמָּ֔ה וַ/יַּעֲבִרֵ֥/נִי בַ/מַּ֖יִם מֵ֥י אָפְסָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/003.yaml
  text: As the man went out eastward with a measuring line in his hand[a], he measured a thousand cubits and led me through the water, water up to the ankles.
  footnotes:
  - marker: a
    text: Literally, 'waters of ankles,' that is, water reaching the ankles.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람이 손에 측량줄을 들고 동쪽으로 나아갈 때에, 그가 천 규빗을 재고 나를 물 가운데로 지나가게 하였는데, 물이 발목에 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘발목들의 물’이며, 발목에 이르는 물을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/צֵאת הָ/אִ֥ישׁ קָדִ֖ים
  english_pob_choice: As the man went out eastward
  chosen_korean: 그 사람이 동쪽으로 나아가며
  alternatives_korean:
  - 그 사람이 동쪽으로 나갈 때
  - 동쪽으로 나가던 그 사람이
  lexicon: HALOT
  rationale: בְּצֵאת은 시간적 절을 이루며, קָדִים은 방향 부사로 쓰여 ‘동쪽으로’가 자연스럽습니다. ‘나아가며’는 진행 중인 동작을 살려 장면의 흐름을 부드럽게 전달합니다.
- source_word: וְ/קָו בְּ/יָד/וֹ
  english_pob_choice: with a measuring line in his hand
  chosen_korean: 손에 측량줄을 가지고 있었는데
  alternatives_korean:
  - 손에 측량줄을 들고
  - 손안에 측량줄이 있었는데
  lexicon: HALOT
  rationale: קָו는 이 문맥에서 ‘측량줄’이 가장 분명하며, בְּיָדוֹ는 물리적으로 손에 쥔 상태를 뜻하므로 ‘손에 … 가지고 있었습니다’로 옮겼습니다.
- source_word: וַ/יָּמָד אֶ֨לֶף֙ בָּֽ/אַמָּ֔ה
  english_pob_choice: he measured a thousand cubits
  chosen_korean: 그가 천 규빗을 재고
  alternatives_korean:
  - 그가 천 규빗을 측량하고
  - 천 규빗을 그가 재고
  lexicon: HALOT
  rationale: וַיָּמָד는 서술 진행을 이끄는 단순 과거로, ‘재고’가 가장 간결하게 측량 행위를 드러냅니다. אַמָּה는 여기서 거리 단위이므로 ‘규빗’을 유지했습니다.
- source_word: וַ/יַּעֲבִרֵ֥/נִי בַ/מַּ֖יִם
  english_pob_choice: led me through the water
  chosen_korean: 나를 물을 통해 건네주었으니
  alternatives_korean:
  - 나를 물을 지나가게 했으니
  - 나를 물속으로 이끌었으니
  lexicon: HALOT
  rationale: הִעֲבִיר의 사역적 의미는 ‘건네다/지나가게 하다’가 잘 살립니다. 반복되는 ‘물’의 이미지와 함께, 인도하여 건너게 하는 동작을 드러내기 위해 ‘건네주다’를 선택했습니다.
- source_word: מֵ֥י אָפְסָֽיִם
  english_pob_choice: water up to the ankles
  chosen_korean: 그 물은 발목까지 찼습니다
  alternatives_korean:
  - 발목 깊이의 물이었습니다
  - 발목에 이르는 물이었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘발목들의 물’이라는 표현으로, 발목까지 차오른 상태를 뜻하는 관용적 묘사입니다. 한국어에서는 의미를 분명히 하기 위해 ‘발목까지 찼습니다’로 옮겼습니다.
theological_decisions:
- issue: 비전 서술의 이동 동사와 인도 표현
  chosen_reading: ‘건네주었으니’로 옮겨, 사람이 단순히 앞서 걷는 것이 아니라 예언자를 물가를 지나도록 인도하는 역할을 드러냈습니다.
  alternative_readings:
  - ‘데리고 갔으니’
  - ‘이끌어 갔으니’
  rationale: 본문의 사역동사 וַיַּעֲבִרֵנִי는 단순 동행보다 ‘통과하게 하다’의 의미가 강합니다. 한국어에서도 그 주도성을 보존하는 것이 비전의 진행을 더 정확히 드러냅니다.
  doctrine_reference: Ezekiel 47:3의 환상적 행위 묘사; 내러티브 문맥
