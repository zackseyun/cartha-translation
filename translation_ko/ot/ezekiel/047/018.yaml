base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/018.yaml
  text: And the eastern side shall be from between Hauran and Damascus[a], and between Gilead and the land of Israel, the Jordan, from the border to the eastern sea; you shall measure the eastern side.
  footnotes:
  - marker: a
    text: 'Or, more specifically, ''the Dead Sea''; Hebrew: ''the eastern sea.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 동쪽 변은 하우란과 다메섹 사이, 길르앗과 이스라엘 땅 사이의 요단으로, 경계에서 동쪽 바다까지입니다. 너희는 동쪽 변을 재야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동쪽 바다’는 문자적으로 옮긴 것이며, 더 구체적으로는 ‘사해’를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת קָדִים
  english_pob_choice: the eastern side
  chosen_korean: 동쪽 변
  alternatives_korean:
  - 동쪽 측면
  - 동쪽 경계
  - 동쪽 변두리
  lexicon: HALOT
  rationale: 지리적 경계 문맥에서 פאה는 ‘면/변’의 뜻이 자연스럽고, ‘변’이 경계선의 의미를 간결하게 살립니다.
- source_word: מִבֵּין ... וּמִבֵּין ...
  english_pob_choice: from between ... and ...
  chosen_korean: '... 사이, ... 사이'
  alternatives_korean:
  - '...과 ... 사이에서'
  - '... 사이에서'
  lexicon: HALOT
  rationale: 히브리어의 반복된 בין 구문을 한국어의 ‘사이’로 옮겨 경계 설정의 구조를 드러냈습니다.
- source_word: הַיַּרְדֵּן
  english_pob_choice: the Jordan
  chosen_korean: 요단
  alternatives_korean:
  - 요단강
  - 요르단
  lexicon: 표준 성경 지명
  rationale: 성경 지명으로 굳어진 한국어 형태를 따르되, 강 이름임을 굳이 덧붙이지 않아도 문맥상 분명합니다.
- source_word: הַיָּם הַקַּדְמוֹנִי
  english_pob_choice: the eastern sea
  chosen_korean: 동쪽 바다
  alternatives_korean:
  - 동쪽 바다
  - 동편 바다
  - 동해
  lexicon: HALOT
  rationale: 본문은 특정 고유명보다 방향을 나타내는 서술적 명칭을 사용하므로, ‘동쪽 바다’로 직역해 본문의 표현을 보존했습니다.
- source_word: תָּמֹדּוּ
  english_pob_choice: you shall measure
  chosen_korean: 재야 합니다
  alternatives_korean:
  - 측량하셔야 합니다
  - 재어야 합니다
  - 측정해야 합니다
  lexicon: HALOT
  rationale: ‘measure’의 기본 의미를 살리되, 경계 설정 맥락에서 한국어로 가장 자연스러운 ‘재다’를 사용했습니다.
theological_decisions:
- issue: 경계 지정 명령의 어조
  chosen_reading: 예언적 지시문으로서 명령형의 직접성을 살려 ‘너희는 ... 재야 합니다’로 옮겼습니다.
  alternative_readings:
  - '...를 재십시오'
  - '...를 측량해야 합니다'
  rationale: 본문은 단순 설명이 아니라 지파 분배를 위한 실제 측량 지시이므로, 명령성을 흐리지 않으면서 현대 한국어의 합쇼체로 정리했습니다.
  doctrine_reference: 본문 해석의 문제는 아니며, 문체와 담화 기능 보존의 문제입니다.
