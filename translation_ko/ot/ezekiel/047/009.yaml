revisions:
- from: 그리고 떼지어 다니는 모든 살아 있는 생물은 그 강이 가는 곳마다 살아날 것입니다. 또 그곳에 물이 들어가서 정화되므로 물고기가 매우 많아질 것입니다[a]. 강이 가는 곳마다 모든 것이 살아날 것입니다[b].
  to: 그리고 떼 지어 움직이는 모든 살아 있는 생물은 두 물줄기가 이르는 곳마다 살 것입니다[a]. 또 이 물들이 그곳에 이르러 치유되므로 물고기가 매우 많을 것입니다[b]. 그 물줄기가 이르는 곳마다 모든 것이 살 것입니다.
  rationale: 원문의 쌍수/복수형 נַחֲלַיִם과 마지막 단수 הַנָּחַל의 차이를 보존하되, 이 구절의 구문적·지시적 불확실성은 각주에서 대안으로 남겼습니다. 물이 ‘치유된다’는 원문의 은유를 ‘정화’로 해석하여 대체하지 않고 그대로 옮겼으며, 각주 표지를 각각 해당 원어 쟁점에 배치했습니다.
