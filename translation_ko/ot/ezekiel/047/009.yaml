source:
  edition: WLC
  text: וְ/הָיָ֣ה כָל נֶ֣פֶשׁ חַיָּ֣ה אֲֽשֶׁר יִשְׁרֹ֡ץ אֶ֣ל כָּל אֲשֶׁר֩ יָב֨וֹא שָׁ֤ם נַחֲלַ֨יִם֙ יִֽחְיֶ֔ה וְ/הָיָ֥ה הַ/דָּגָ֖ה רַבָּ֣ה מְאֹ֑ד כִּי֩ בָ֨אוּ שָׁ֜מָּ/ה הַ/מַּ֣יִם הָ/אֵ֗לֶּה וְ/יֵרָֽפְאוּ֙ וָ/חָ֔י כֹּ֛ל אֲשֶׁר יָ֥בוֹא שָׁ֖מָּ/ה הַ/נָּֽחַל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/009.yaml
  text: And every living creature that swarms[a], wherever the river goes, will live. And there will be very many fish, because these waters go there and are healed[b]; everything will live wherever the river goes.
  footnotes:
  - marker: a
    text: Hebrew has a dual/plural form, literally 'streams' or 'rivers'; many translations smooth this to the singular 'river.'
    reason: lexical_alternative
  - marker: b
    text: Or 'these waters go there, so that the waters there are healed.' The Hebrew healing imagery is explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 떼 지어 움직이는 모든 살아 있는 생물은 두 물줄기가 이르는 곳마다 살 것입니다[a]. 또 이 물들이 그곳에 이르러 치유되므로 물고기가 매우 많을 것입니다[b]. 그 물줄기가 이르는 곳마다 모든 것이 살 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 쌍수/복수형으로, 문자적으로는 ‘두 물줄기’ 또는 ‘물줄기들’을 뜻할 수 있습니다. 많은 번역은 이를 단수 ‘강’으로 매끈하게 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이 물들이 그곳에 이르므로, 그곳의 물이 치유됩니다.’ 히브리어의 치유 이미지는 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ חַיָּה
  english_pob_choice: living creature
  chosen_korean: 살아 있는 생물
  alternatives_korean:
  - 살아 있는 존재
  - 살아 있는 혼
  lexicon: HALOT
  rationale: 생명체 일반을 가리키며 인간의 ‘혼’이 아니라는 점을 살려, 수중 맥락에 자연스러운 표현으로 옮겼습니다.
- source_word: יִשְׁרֹץ
  english_pob_choice: swarms
  chosen_korean: 떼지어 다니는
  alternatives_korean:
  - 우글거리는
  - 번성하는
  lexicon: HALOT
  rationale: 물속 생물의 들끓는 움직임을 살리되, 한국어에서 지나치게 비속하지 않게 표현했습니다.
- source_word: וְיֵרָפְאוּ
  english_pob_choice: are healed
  chosen_korean: 정화되므로
  alternatives_korean:
  - 치유되므로
  - 깨끗해지므로
  lexicon: HALOT
  rationale: 히브리어의 ‘치유’ 이미지를 보존하되, 물에 대한 은유를 한국어에서 자연스럽게 드러내기 위해 ‘정화’로 옮겼습니다.
- source_word: וָחָי כֹּל
  english_pob_choice: everything will live
  chosen_korean: 모든 것이 살아날 것입니다
  alternatives_korean:
  - 모든 것이 살 것입니다
  - 만물이 살아날 것입니다
  lexicon: HALOT
  rationale: 문맥상 강의 생명 부여 효과를 총괄하는 결론이므로, 미래 완료감보다 평이한 미래형으로 옮겼습니다.
theological_decisions:
- issue: 물의 ‘치유’ 언어를 어떻게 살릴지
  chosen_reading: ‘정화되므로’로 옮겨, 물 자체가 회복되는 비유를 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘치유되므로’로 직역할 수 있습니다.
  - ‘더 맑아지므로’로 풀 수 있습니다.
  rationale: 본문은 실제 물이 ‘치유’되는 이미지를 사용하지만, 한국어에서 물에 직접 ‘치유’가 쓰이면 어색할 수 있어 비유적 복원 의미를 보존하는 방향을 택했습니다.
  doctrine_reference: Translation philosophy §1, §3
