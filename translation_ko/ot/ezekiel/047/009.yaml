  source_fidelity: 현 번역은 첫 절의 נַחֲלַיִם(쌍수/복수)와 마지막의 הַנָּחַל(단수)을 모두 ‘강’으로 평준화하여 형태상 대비를 잃습니다. 또한 וְיֵרָפְאוּ의 명시적 ‘치유’ 이미지를 ‘정화’로 바꾸고, ‘그곳에 물이 들어가서 정화되므로’라고 하여 히브리어의 ‘이 물들이 그곳에 이르며 치유된다’는 표현 및 그 대안적 연결 가능성을 충분히 반영하지 못합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘떼 지어 움직이는’은 יִשְׁרֹץ의 군집적 움직임을 비교적 중립적으로 나타내며, ‘물줄기’는 환상 속 흐르는 물길 문맥에서 자연스럽습니다.
  terminology: נֶפֶשׁ חַיָּה는 ‘살아 있는 생물’, הַדָּגָה는 집합적 의미의 ‘물고기’, רַבָּה מְאֹד는 ‘매우 많을 것’으로 옮겼습니다. רפא의 은유는 교리적으로 해석하지 않고 ‘치유’로 보존했습니다. 쌍수/복수 ‘물줄기들’과 끝의 단수 ‘물줄기’의 차이는 각주로 밝혔습니다.
