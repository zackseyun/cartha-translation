source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה גֵּ֤ה גְבוּל֙ אֲשֶׁ֣ר תִּתְנַחֲל֣וּ אֶת הָ/אָ֔רֶץ לִ/שְׁנֵ֥י עָשָׂ֖ר שִׁבְטֵ֣י יִשְׂרָאֵ֑ל יוֹסֵ֖ף חֲבָלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/013.yaml
  text: 'Thus says the Lord GOD: This is the boundary by which you shall apportion the land as an inheritance among the twelve tribes of Israel[a]; Joseph shall have two portions.'
  footnotes:
  - marker: a
    text: Hebrew 'Joseph, portions'—that is, Joseph is to receive a double territorial share.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. “너희가 이스라엘의 열두 지파에게 그 땅을 상속 재산으로 나누어 줄 경계는 이것입니다. 요셉은 두 몫을[a] 받을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘요셉, 몫들’은 곧 요셉이 토지 분깃을 두 몫 받는다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 합쇼체 문맥에서 אדני יהוה는 존칭 호칭인 ‘주’와 고유 신명 ‘야훼’를 함께 살리는 것이 원문 구조를 가장 잘 반영합니다. POB의 영어 관행인 ‘Lord GOD’의 기능을 한국어에서는 ‘주 야훼’로 옮겼습니다.
- source_word: גֵּה גְבוּל
  english_pob_choice: This is the boundary
  chosen_korean: 이것이 … 경계입니다
  alternatives_korean:
  - 이것이 … 경계선입니다
  - 이것이 … 경계입니다
  lexicon: HALOT
  rationale: 토지 분배 문맥에서 גְּבוּל은 단순한 추상적 ‘한계’보다 실제로 구획을 표시하는 ‘경계’가 자연스럽고 정확합니다. 지시 표현은 한국어 문장 흐름에 맞춰 ‘이것이’로 처리했습니다.
- source_word: תִּתְנַחֲלוּ אֶת הָאָרֶץ
  english_pob_choice: you shall apportion the land as an inheritance
  chosen_korean: 그 땅을 상속 재산으로 나눌
  alternatives_korean:
  - 그 땅을 기업으로 나눌
  - 그 땅을 유산으로 나눌
  lexicon: HALOT
  rationale: 히트파엘 נחל은 단순히 ‘상속받다’가 아니라 분배·배당의 의미를 함께 가집니다. ‘상속 재산으로 나눌’은 분배 행위와 상속 개념을 함께 살려 POB의 해석을 반영합니다.
- source_word: יוֹסֵף חֲבָלִים
  english_pob_choice: Joseph shall have two portions
  chosen_korean: 요셉은 두 몫을 차지할 것입니다
  alternatives_korean:
  - 요셉은 두 분깃을 받을 것입니다
  - 요셉은 두 몫을 가질 것입니다
  lexicon: HALOT
  rationale: חֲבָלִים는 문자적으로는 ‘줄/분량’이지만 이 문맥에서는 토지 몫, 곧 배분된 몫을 뜻합니다. 영어 POB의 ‘two portions’에 맞추되 한국어에서는 관용적으로도 분명한 ‘두 몫’을 선택했습니다.
theological_decisions:
- issue: 하나님 이름의 표기
  chosen_reading: 원문의 יְהוָה를 ‘야훼’로 직역해 고유 신명을 보존했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 역본의 기본 원칙에 따라 신명은 가리키지 않고 드러내는 방향이 원문 추적성과 신학적 투명성에 더 부합합니다. לכן compound title은 ‘주 야훼’로 처리했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
