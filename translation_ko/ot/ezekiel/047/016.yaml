base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/016.yaml
  text: Hamath[a], Berothah, Sibraim—which is between the border of Damascus and the border of Hamath—Hazer-hattikon[c][b], which is toward the border of Hauran.
  footnotes:
  - marker: a
    text: Hebrew Berothah; some compare the related place name 'Berothai' in 2 Samuel 8:8.
    reason: alternative_reading
  - marker: b
    text: Hazer-hattikon is likely a place name; literally, the components mean something like 'middle enclosure/settlement.'
    reason: lexical_alternative
  - marker: c
    text: Or 'which is toward the border of Hauran.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하맛, 브에롯[a], 다메섹의 경계와 하맛의 경계 사이에 있는 시브라임, 그리고 하우란의 경계 쪽에 있는 하세르-하티콘[b][c]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문에는 ‘브에롯’이라고 되어 있습니다. 일부는 사무엘기하 8:8의 관련 지명 ‘브에로다이’와 비교합니다.
    reason: alternative_reading
  - marker: b
    text: 하세르-하티콘은 아마도 지명입니다. 구성 요소를 문자적으로 옮기면 ‘중간의 울타리/정착지’ 정도입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘하우란의 경계에 이르는 곳’.
    reason: lexical_alternative
