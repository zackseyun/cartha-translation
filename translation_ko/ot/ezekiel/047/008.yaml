id: EZK.47.8
reference: Ezekiel 47:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הַ/מַּ֤יִם הָ/אֵ֨לֶּה֙ יוֹצְאִ֗ים אֶל הַ/גְּלִילָה֙ הַ/קַּדְמוֹנָ֔ה וְ/יָרְד֖וּ עַל הָֽ/עֲרָבָ֑ה וּ/בָ֣אוּ הַ/יָּ֔מָּ/ה אֶל הַ/יָּ֥מָּ/ה הַ/מּֽוּצָאִ֖ים ו/נרפאו הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/008.yaml
  text: Then he said to me[a], “These waters flow out toward the eastern district and go down into the Arabah; then they enter the sea. and when they are brought out into the sea[c][b], the waters are healed.”
  footnotes:
  - marker: a
    text: Or 'the Dead Sea.' The Hebrew expression is difficult and is commonly understood as referring to the salt sea east of Judah.
    reason: alternative_reading
  - marker: b
    text: Or 'the waters become fresh.' The Hebrew says literally, 'the waters are healed.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the sea of stagnant waters'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 내게 말했습니다. 「이 물은 동쪽 지역으로 흘러가 아라바로 내려가서 바다에 이릅니다. 그리고 바다로 흘러나가면 그 물이 치유됩니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동쪽 지방’일 수 있습니다. 히브리어 표현은 난해하며, 일반적으로 유다 동쪽의 사해를 가리키는 것으로 이해됩니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그 물이 민물이 됩니다’일 수 있습니다. 히브리어는 문자적으로 ‘그 물이 치유됩니다’라고 말합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘정체된 물의 바다’일 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: הַמַּיִם הָאֵלֶּה
  english_pob_choice: these waters
  chosen_korean: 이 물은
  alternatives_korean:
  - 이 물들
  - 이들 물
  lexicon: HALOT
  rationale: 히브리어 מַיִם은 복수형이지만 한국어에서는 자연스럽게 물을 집합적으로 가리키는 단수형이 가능하므로, 의미와 문체의 유창성을 함께 살려 ‘이 물은’으로 옮겼습니다.
- source_word: הַגְּלִילָה הַקַּדְמוֹנָה
  english_pob_choice: the eastern district
  chosen_korean: 동쪽 지역
  alternatives_korean:
  - 동쪽 구역
  - 동쪽 지방
  lexicon: HALOT
  rationale: 지리적 구획을 뜻하는 표현이므로 고유지명처럼 굳히기보다 현대 한국어의 중립적 지리어인 ‘지역’으로 옮겨 의미를 분명히 했습니다.
- source_word: וּבָאוּ הַיָּמָּה
  english_pob_choice: then they enter the sea
  chosen_korean: 바다에 이릅니다
  alternatives_korean:
  - 바다에 들어갑니다
  - 바다에 도착합니다
  lexicon: HALOT
  rationale: בוא의 도착/진입 뉘앙스를 살리되 한국어에서는 물이 바다로 흘러 들어가는 흐름을 가장 자연스럽게 표현하는 ‘이르다’를 택했습니다.
- source_word: וְנרפאו הַמָּיִם
  english_pob_choice: and the waters are healed
  chosen_korean: 그 물이 치유됩니다
  alternatives_korean:
  - 그 물이 낫습니다
  - 그 물이 새 물처럼 됩니다
  lexicon: HALOT
  rationale: רפא의 직역인 ‘치유되다’를 유지해 본문의 의인화된 이미지와 POB의 소스 직접성을 살렸습니다. 한국어에서는 복수 명사보다 단수 집합명사 ‘그 물’이 더 자연스럽습니다.
theological_decisions:
- issue: 물의 상태를 'fresh'로 완화할지, 'healed'로 직역할지
  chosen_reading: ‘치유됩니다’로 유지하여 물이 회복되는 의인화된 이미지를 살렸습니다.
  alternative_readings:
  - ‘맑아집니다’
  - ‘새 물이 됩니다’
  rationale: 히브리어 רפא는 문자적으로 ‘치유하다’이므로, 결과가 담수화라는 문맥적 함의가 있더라도 본문이 가진 강한 은유를 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 본문의 자연 회복 이미지와 창조 질서의 치유 은유
