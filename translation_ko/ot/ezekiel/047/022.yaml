id: EZK.47.22
reference: Ezekiel 47:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה תַּפִּ֣לוּ אוֹתָ/הּ֮ בְּ/נַחֲלָה֒ לָ/כֶ֗ם וּ/לְ/הַ/גֵּרִים֙ הַ/גָּרִ֣ים בְּ/תוֹכְ/כֶ֔ם אֲשֶׁר הוֹלִ֥דוּ בָנִ֖ים בְּ/תֽוֹכְ/כֶ֑ם וְ/הָי֣וּ לָ/כֶ֗ם כְּ/אֶזְרָח֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל אִתְּ/כֶם֙ יִפְּל֣וּ בְ/נַחֲלָ֔ה בְּ/ת֖וֹךְ שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/022.yaml
  text: And it shall be that you shall allot it as an inheritance for yourselves and for the sojourners who sojourn among you[a], who have fathered children among you; and they shall be to you like a native among the sons of Israel[c][b]. With you they shall receive an inheritance among the tribes of Israel.
  footnotes:
  - marker: a
    text: Or 'foreigners' or 'resident aliens'; Hebrew גֵּר refers to a non-native residing among Israel with recognized standing.
    reason: lexical_alternative
  - marker: b
    text: Literally 'have begotten sons.'
    reason: lexical_alternative
  - marker: c
    text: Or 'as a native-born.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그 땅을 여러분 자신을 위해, 또 여러분 가운데 머무는 나그네들을 위해 몫으로 나누어 주십시오[a]. 그들이 여러분 가운데서 자녀를 낳았을지라도, 그들은 이스라엘 자손 가운데서 토박이 같은 사람[b][c]이 될 것입니다. 그들도 여러분과 함께 이스라엘 지파들 가운데서 몫을 받게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외국인들’, ‘거류민들’로도 옮길 수 있습니다. 히브리어 גֵּר는 이스라엘 가운데 공인된 거주 지위를 가진 비토착민을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘여러분 가운데서 아들들을 낳았을지라도’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘토박이처럼’, ‘원주민처럼’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּפִּלוּ / יִפְּלוּ (נפל in Hiphil/Qal with נַחֲלָה)
  english_pob_choice: allot / receive an inheritance
  chosen_korean: 몫으로 나누어 주십시오 / 몫을 받게 될 것입니다
  alternatives_korean:
  - 나누어 주십시오 / 상속으로 받게 될 것입니다
  - 할당하십시오 / 유업으로 받을 것입니다
  lexicon: HALOT
  rationale: 히필의 능동적 분배와 칼의 수동적 수령을 각각 살리기 위해, 첫 절은 ‘나누어 주십시오’로, 후절은 ‘몫을 받게 될 것입니다’로 구분해 옮겼습니다.
- source_word: נַחֲלָה
  english_pob_choice: inheritance
  chosen_korean: 몫
  alternatives_korean:
  - 기업
  - 유업
  - 상속 몫
  lexicon: HALOT
  rationale: 여기서는 토지 분배 맥락의 ‘정해진 분깃’을 강조하므로, 한국어로는 자연스럽고 법적 뉘앙스를 유지하는 ‘몫’이 가장 직접적입니다.
- source_word: הַגֵּרִים / הַגָּרִים בְּתוֹכְכֶם
  english_pob_choice: sojourners who sojourn among you
  chosen_korean: 여러분 가운데 머무는 나그네들
  alternatives_korean:
  - 여러분 가운데 사는 거류민들
  - 여러분 가운데 있는 외국인들
  lexicon: HALOT
  rationale: גֵּר의 언약-법적 뉘앙스를 살리되, 현대 한국어에서 이해가 쉬운 ‘나그네들’로 옮기고, 동작성을 가진 ‘머무는’으로 반복 동사를 반영했습니다.
- source_word: כְּאֶזְרָח
  english_pob_choice: like a native
  chosen_korean: 토박이 같은 사람
  alternatives_korean:
  - 원주민 같은 사람
  - 태생부터 그 땅 사람 같은 사람
  lexicon: HALOT
  rationale: אֶזְרָח의 ‘토착민/원주민’ 의미를 살리면서도, 비교 표현 כְּ를 분명히 드러내기 위해 ‘토박이 같은’으로 번역했습니다.
- source_word: הוֹלִדוּ בָנִים
  english_pob_choice: have fathered children
  chosen_korean: 자녀를 낳았을지라도
  alternatives_korean:
  - 아들들을 낳았을지라도
  - 자식을 두었을지라도
  lexicon: HALOT
  rationale: 형식적으로는 ‘아들들’이지만, 문맥상 세대 정착의 의미가 핵심이므로 POB의 판단을 따라 성별을 과도하게 좁히지 않고 ‘자녀’로 옮겼습니다.
theological_decisions:
- issue: 거류민의 땅 분배 참여
  chosen_reading: 이 구절은 이스라엘의 거류민에게 실제 토지 상속 몫을 허락하는 진술로 읽었습니다.
  alternative_readings:
  - 단순한 거주 허용만 의미한다는 읽기
  - 상징적 포용만 뜻한다는 읽기
  rationale: ‘몫으로 나누어 주다’, ‘몫을 받다’, ‘지파들 가운데서’라는 반복적 분배 언어가 실제 상속 참여를 강하게 지시하므로 그 힘을 약화시키지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 주는 사회-법적 포함을 보존
- issue: 등록어 ‘나그네’의 선택
  chosen_reading: גֵּר를 현대어 ‘나그네’로 옮겨, 단순 관광객이 아니라 이스라엘 가운데 공인된 거주자라는 뉘앙스를 살렸습니다.
  alternative_readings:
  - 거류민
  - 외국인
  - 이방인
  rationale: 한국 교회 전통어 ‘이방인’은 대립적 종교 뉘앙스가 강해 법적·사회적 의미를 흐릴 수 있어, 본문의 합법적 체류자 의미를 더 잘 드러내는 표현을 택했습니다.
  doctrine_reference: 용례상 사회적 지위와 포함을 우선 반영
