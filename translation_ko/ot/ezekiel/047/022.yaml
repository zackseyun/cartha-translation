revisions:
- from: 그러면 그 땅을 여러분 자신을 위해, 또 여러분 가운데 머무는 나그네들을 위해 몫으로 나누어 주십시오[a]. 그들이 여러분 가운데서 자녀를 낳았을지라도, 그들은 이스라엘 자손 가운데서 토박이 같은 사람[b][c]이 될 것입니다. 그들도 여러분과 함께 이스라엘 지파들 가운데서 몫을 받게 될 것입니다.
  to: 그 땅을 여러분 자신과 여러분 가운데 거주하며 여러분 가운데서 자녀를 둔 거류민들[a]에게 상속 분깃으로 분배해야 합니다[b]. 그들은 이스라엘 자손 가운데 토박이와 같이[c] 여러분에게 여겨져야 합니다. 그들도 여러분과 함께 이스라엘 지파들 가운데서 상속 분깃을 받을 것입니다.
  rationale: 원문의 법규적 토지 분배 진술과 거류민의 동등한 상속 참여를 보존하면서, 원문에 없는 양보 의미를 제거했습니다. ‘상속 분깃’으로 נַחֲלָה의 토지 상속 의미를 명시하고, 각주 표지를 해당 히브리어 어구에 맞추어 재배치했습니다.
