id: EZK.47.12
reference: Ezekiel 47:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַל הַ/נַּ֣חַל יַעֲלֶ֣ה עַל שְׂפָת֣/וֹ מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה כָּל עֵֽץ מַ֠אֲכָל לֹא יִבּ֨וֹל עָלֵ֜/הוּ וְ/לֹֽא יִתֹּ֣ם פִּרְי֗/וֹ לָֽ/חֳדָשָׁי/ו֙ יְבַכֵּ֔ר כִּ֣י מֵימָ֔י/ו מִן הַ/מִּקְדָּ֖שׁ הֵ֣מָּה יֽוֹצְאִ֑ים ו/היו פִרְי/וֹ֙ לְ/מַֽאֲכָ֔ל וְ/עָלֵ֖/הוּ לִ/תְרוּפָֽה־־׀׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/012.yaml
  text: Along the river[a], on its bank, on this side and on that side, every kind of tree for food will grow. Its leaf will not wither, and its fruit will not fail; every month it will bear fresh fruit, because its waters are coming out from the sanctuary. Its fruit will be for food[c][b], and its leaf for healing.
  footnotes:
  - marker: a
    text: Or 'on both sides.' The Hebrew literally says 'from this side and from that side.'
    reason: lexical_alternative
  - marker: b
    text: Or 'every month it will bear fresh fruit.' The Hebrew verb carries the sense of producing early or first-ripe fruit.
    reason: lexical_alternative
  - marker: c
    text: Or 'for medicine' or 'for remedy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 강둑 이쪽과 저쪽에는[a] 먹을 것을 내는 온갖 나무가 자라날 것입니다. 그 잎은 시들지 않고, 그 열매는 다하지 않을 것이며, 달마다 새 열매를 맺을 것입니다.[b] 그 물이 성소에서 나오기 때문입니다. 그 열매는 먹을 것이 되고, 그 잎은 치유를 위해 쓰일 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘양쪽에’. 히브리어는 문자적으로 ‘이쪽에서와 저쪽에서’라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘달마다 이른 익은 열매를 맺을 것입니다’. 히브리어 동사는 처음 또는 일찍 익은 열매를 내는 어감을 지닙니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘치료를 위해’ 또는 ‘약으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלֶה
  english_pob_choice: will grow
  chosen_korean: 자라날 것입니다
  alternatives_korean:
  - 올라갈 것입니다
  - 돋아날 것입니다
  lexicon: HALOT
  rationale: 식물이 강가에서 솟아나는 문맥이므로 문자적인 ‘올라가다’보다 생장 의미를 살린 ‘자라나다’가 원문의 뜻을 자연스럽게 전달합니다.
- source_word: מִזֶּה וּמִזֶּה
  english_pob_choice: on this side and on that side
  chosen_korean: 이쪽과 저쪽
  alternatives_korean:
  - 양쪽에
  - 이편과 저편
  lexicon: HALOT
  rationale: 히브리어의 양쪽 대칭 표현을 그대로 살리되, 한국어에서는 ‘이쪽과 저쪽’이 가장 자연스럽고 시각적입니다.
- source_word: כָּל עֵץ מַאֲכָל
  english_pob_choice: every kind of tree for food
  chosen_korean: 먹을 수 있는 온갖 종류의 나무
  alternatives_korean:
  - 먹을 나무의 온갖 종류
  - 모든 식용 나무
  lexicon: HALOT
  rationale: ‘식용’도 가능하지만, כאן는 열매가 식물의 용도를 말하므로 ‘먹을 수 있는’이 덜 기술적이고 문맥에 맞습니다.
- source_word: לֹא יִבּוֹל עָלֵהוּ
  english_pob_choice: Its leaf will not wither
  chosen_korean: 그 잎은 시들지 않고
  alternatives_korean:
  - 그 잎은 마르지 않고
  - 그 잎사귀는 시들지 않고
  lexicon: HALOT
  rationale: נבל의 식물적 의미를 한국어의 기본 동사 ‘시들다’로 옮겨 생동감을 유지했습니다.
- source_word: לָחֳדָשָׁיו / יְבַכֵּר
  english_pob_choice: every month it will bear fresh fruit
  chosen_korean: 매달 첫 열매를 맺을 것입니다
  alternatives_korean:
  - 매달 새 열매를 맺을 것입니다
  - 매달 처음 익은 열매를 맺을 것입니다
  lexicon: HALOT
  rationale: POB의 영어는 자연화했지만, 히브리어 בכר의 ‘첫/초기 익음’ 뉘앙스를 살리기 위해 ‘첫 열매’를 택했습니다.
- source_word: מִן הַמִּקְדָּשׁ
  english_pob_choice: from the sanctuary
  chosen_korean: 성소에서
  alternatives_korean:
  - 성전에서
  - 성역에서
  lexicon: HALOT
  rationale: 에스겔의 성전 환상 맥락에서 מקדש는 ‘성소’가 가장 직접적이며, 물의 근원을 신학적으로도 또렷하게 드러냅니다.
- source_word: לִתְרוּפָה
  english_pob_choice: for healing
  chosen_korean: 치유가 될 것입니다
  alternatives_korean:
  - 치료가 될 것입니다
  - 약이 될 것입니다
  lexicon: HALOT
  rationale: 열매와 잎의 기능을 병행구로 살리면서, 한국어에서는 목적어구보다 서술형 ‘치유가 될 것입니다’가 자연스럽습니다.
theological_decisions:
- issue: 강의 생명력 이미지와 성전 기원
  chosen_reading: 본문의 생명수-나무 이미지를 상징 과잉 없이 그대로 살리고, 그 근원이 성소에서 나온다는 인과관계를 분명히 드러냈습니다.
  alternative_readings:
  - 종말론적 상징이나 성례전적 의미를 본문에 직접 삽입하는 방식
  rationale: 에스겔의 환상은 강한 신학성을 지니지만, 번역 본문에는 후대 해석을 덧입히지 않고 원문의 이미지와 논리를 우선 보존하는 것이 적절합니다.
  doctrine_reference: translation philosophy items 1 and 3
- issue: יְבַכֵּר의 의미 범위
  chosen_reading: ‘첫 열매’로 옮겨 ‘초기/첫 익음’의 어감을 보존했습니다.
  alternative_readings:
  - ‘새 열매’
  - ‘신선한 열매’
  rationale: 히브리어 어근의 초기 성숙 뉘앙스를 유지해야 원문이 주는 지속적 풍요와 반복적 새로움을 함께 살릴 수 있습니다.
  doctrine_reference: translation philosophy item 5
