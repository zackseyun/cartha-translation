revisions:
- from: 그 강가의 이쪽과 저쪽에는 먹을 수 있는 온갖 종류의 나무가 자라날 것입니다. 그 잎은 시들지 않고, 그 열매는 떨어지지 않을 것이며, 매달 첫 열매를 맺을 것입니다. 그 물이 성소에서 나오기 때문입니다. 그 열매는 먹을 것이 되고, 그 잎은 치유가 될 것입니다.[a][b][c]
  to: 그 강둑 이쪽과 저쪽에는[a] 먹을 것을 내는 온갖 나무가 자라날 것입니다. 그 잎은 시들지 않고, 그 열매는 다하지 않을 것이며, 달마다 새 열매를 맺을 것입니다.[b] 그 물이 성소에서 나오기 때문입니다. 그 열매는 먹을 것이 되고, 그 잎은 치유를 위해 쓰일 것입니다.[c]
  rationale: 원문의 공간 표현, 성소에서 나오는 물이라는 인과관계, 먹을 것과 치유를 위한 잎의 병행을 보존했습니다. 특히 열매가 ‘다하지 않는다’는 지속적 결실의 의미를 회복했으며, יְבַכֵּר의 해석상 폭은 본문과 각주의 조합으로 보존했습니다.
