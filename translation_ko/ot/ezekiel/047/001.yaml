    rationale: מִכֶּתֶף הַבַּיִת הַיְמָנִית는 ‘집의 오른쪽 옆면(어깨/측면) 아래에서’라는 공간 표현입니다. ‘옆면’을 밝혀야 כָּתֵף와 הַיְמָנִית의 기능을 모두 보존합니다.
