source:
  edition: WLC
  text: וַ/יְשִׁבֵ/נִי֮ אֶל פֶּ֣תַח הַ/בַּיִת֒ וְ/הִנֵּה מַ֣יִם יֹצְאִ֗ים מִ/תַּ֨חַת מִפְתַּ֤ן הַ/בַּ֨יִת֙ קָדִ֔ימָ/ה כִּֽי פְנֵ֥י הַ/בַּ֖יִת קָדִ֑ים וְ/הַ/מַּ֣יִם יֹרְדִ֗ים מִ/תַּ֜חַת מִ/כֶּ֤תֶף הַ/בַּ֨יִת֙ הַ/יְמָנִ֔ית מִ/נֶּ֖גֶב לַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/001.yaml
  text: Then he brought me back to the entrance of the house[a], and behold, water was coming out from under the threshold of the house eastward, because the front of the house faced east; and the water was flowing down from under the south side of the house[b], on the right side, south of the altar.
  footnotes:
  - marker: a
    text: Or 'the temple' for 'the house'; the Hebrew text literally reads 'the house,' referring to the temple building in Ezekiel's vision.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from under the shoulder of the house, the right side'; 'shoulder' is an idiom for the side of a structure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 다시 그 집[a]의 입구로 데리고 오셨습니다. 보십시오, 물이 그 집의 문지방 아래에서 동쪽으로 흘러나오고 있었습니다. 그 집의 앞면이 동쪽을 향하고 있었기 때문입니다. 그 물은 집의 오른쪽 옆면 아래[b], 곧 제단 남쪽에서 흘러내리고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 히브리어 본문의 직역입니다. 여기서는 에스겔의 환상 속 성전 건물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘집의 오른쪽 어깨 아래’입니다. ‘어깨’는 여기서 건축물의 옆면 또는 측면을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשִׁבֵנִי
  english_pob_choice: Then he brought me back
  chosen_korean: 그가 나를 다시 데리고 오시니
  alternatives_korean:
  - 그가 나를 다시 돌려보내시니
  - 그가 나를 다시 돌아오게 하시니
  lexicon: HALOT
  rationale: 히필형 שוב의 사역적 의미를 살려 ‘다시 데리고 오시다’로 옮겼고, 문맥상 자연스러운 서술형으로 다듬었습니다.
- source_word: הַבַּיִת / פֶּתַח / מִפְתַּן
  english_pob_choice: the house / entrance / threshold
  chosen_korean: 집의 문간 / 집의 문지방
  alternatives_korean:
  - 성전의 문 / 성전의 문지방
  - 집의 입구 / 집의 문턱
  lexicon: HALOT
  rationale: 본문의 문자적 표현인 ‘집’을 유지하되, 환상 속 성전 건물을 가리키는 점을 드러내기 위해 ‘문간’, ‘문지방’으로 옮겼습니다.
- source_word: קָדִימָה
  english_pob_choice: eastward
  chosen_korean: 동쪽으로
  alternatives_korean:
  - 동쪽을 향해
  - 동편으로
  lexicon: HALOT
  rationale: 방향부사로서의 의미를 살려 간결하게 ‘동쪽으로’라고 옮겼습니다.
- source_word: מִכֶּתֶף הַבַּיִת הַיְמָנִית / מִנֶּגֶב לַמִּזְבֵּחַ
  english_pob_choice: from under the right side of the house, from south of the altar
  chosen_korean: 집의 오른쪽 아래, 제단의 남쪽에서
  alternatives_korean:
  - 집의 남쪽 편, 제단의 남쪽에서
  - 집의 오른편 아래, 제단 남쪽에서
  lexicon: HALOT
  rationale: כָּתֵף의 구조물 비유를 한국어에서 자연스럽게 살려 ‘오른쪽 아래’로 옮기고, 이어지는 방향표현 ‘제단의 남쪽에서’를 분리해 원문 구조를 보존했습니다.
theological_decisions:
- issue: 환상 속 성전 수로의 공간 방향 표현
  chosen_reading: 물의 근원이 문지방 아래에서 동쪽으로 나오는 장면과, 제단의 남쪽이라는 위치 관계를 그대로 드러냈습니다.
  alternative_readings:
  - 상징적으로 정리하여 ‘성전에서 흘러나오는 물’로만 풀어쓰기
  - 방향 정보를 완화해 자연스러운 서술로 통합하기
  rationale: 이 구절은 환상의 지리적·상징적 구도를 통해 의미가 전달되므로, 방향 정보를 축소하지 않고 원문이 가진 공간성을 보존하는 것이 중요합니다.
  doctrine_reference: 에스겔 47장 환상 맥락
