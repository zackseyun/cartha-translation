base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/004.yaml
  text: Again he measured a thousand[a], and led me through the water—water up to the knees. Again he measured a thousand[b], and led me through water up to the waist.
  footnotes:
  - marker: a
    text: Literally, 'a thousand'; the unit 'cubits' is supplied from the previous verse's context.
    reason: cross_reference
  - marker: b
    text: Or 'water up to the loins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다시 그가 일천을 쟀고, 나를 무릎까지 오는 물을 지나게 했습니다. 다시 그가 일천을 쟀고, 나를 허리까지 오는 물을 지나게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘일천’입니다. 단위인 규빗은 앞 절의 문맥에서 보충됩니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘허리까지 오는 물’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  english_pob_choice: he measured
  chosen_korean: 쟀고
  alternatives_korean:
  - 측량했고
  - 재었고
  lexicon: HALOT
  rationale: 측량 행위를 자연스러운 현대 한국어로 옮기되, 반복되는 동작의 진행을 살리기 위해 ‘쟀고’로 간결하게 처리했습니다.
- source_word: אֶלֶף
  english_pob_choice: a thousand
  chosen_korean: 일천
  alternatives_korean:
  - 천
  - 일천 규빗
  lexicon: HALOT
  rationale: 본문은 단순히 ‘a thousand’라고만 말하므로, 본문층에서는 ‘일천’으로 두고, 규빗은 문맥상 보충된다는 점을 그대로 반영했습니다.
- source_word: וַיַּעֲבִרֵנִי
  english_pob_choice: led me through
  chosen_korean: 나를 … 지나게 했습니다
  alternatives_korean:
  - 나를 데리고 지나갔습니다
  - 나를 통과시켰습니다
  lexicon: HALOT
  rationale: 사역형의 ‘~하게 하다’ 의미를 살리면서도 한국어로 자연스럽게 들리도록 ‘지나게 했습니다’로 옮겼습니다.
- source_word: מַיִם בִּרְכָּיִם / מֵי מָתְנָיִם
  english_pob_choice: water up to the knees / water up to the waist
  chosen_korean: 무릎까지 오는 물 / 허리까지 오는 물
  alternatives_korean:
  - 무릎 깊이의 물 / 허리 깊이의 물
  - 무릎까지 차는 물 / 허리까지 차는 물
  lexicon: HALOT
  rationale: 히브리어의 ‘물 + 신체 부위’ 표현을 직역에 가깝게 살리되, 현대 독자가 즉시 이해할 수 있도록 ‘오는 물’로 자연화했습니다.
theological_decisions:
- issue: 측정 단위 ‘일천’의 보충 여부
  chosen_reading: 본문에는 ‘일천’만 두고, 단위인 규빗은 본문 밖 문맥에서 보완된다는 긴장을 유지했습니다.
  alternative_readings:
  - 일천 규빗
  - 천 규빗
  rationale: 히브리어 본문이 단위 자체를 생략한 채 ‘일천’만 제시하므로, 본문층의 절제된 표현을 보존하는 것이 더 충실합니다.
  doctrine_reference: 본문 충실성 / 문맥 보충 원리
