id: EZK.47.11
reference: Ezekiel 47:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בצאת/ו וּ/גְבָאָ֛י/ו וְ/לֹ֥א יֵרָפְא֖וּ לְ/מֶ֥לַח נִתָּֽנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/011.yaml
  text: But its swamps and marshes will not be healed[b][a]; they are left for salt.
  footnotes:
  - marker: a
    text: Or, 'they are given over for salt.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'be healed,' continuing the chapter's imagery of waters being healed or made fresh.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것의 습지와 늪지는 고쳐지지 않을 것이며, 소금으로 남겨질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘소금으로 내버려질 것입니다/소금으로 넘겨질 것입니다’의 뜻입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘고침을 받다/치유되다’라는 동사를 사용하여, 앞 문맥의 물이 ‘고쳐지는’ 이미지를 이어갑니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בצאתו
  english_pob_choice: its swamps
  chosen_korean: 그것의 습지
  alternatives_korean:
  - 그것의 늪
  - 그것의 늪지
  lexicon: HALOT
  rationale: 문맥상 물이 빠져나간 뒤 남는 저지대의 습한 지역을 가리키므로, 자연스러운 현대어로 ‘습지’가 적절합니다. 지시대명사 ‘그것의’는 원문 3인칭 남성 단수 접미사를 반영합니다.
- source_word: וגבאיו
  english_pob_choice: and marshes
  chosen_korean: 늪지
  alternatives_korean:
  - 그리고 웅덩이
  - 그리고 웅덩이들
  lexicon: HALOT
  rationale: גבא는 물이 고인 움푹한 곳, 늪지대의 뜻이므로 ‘늪지’로 옮기면 앞의 ‘습지’와 함께 반복되는 수역 이미지를 살릴 수 있습니다.
- source_word: ירפאו
  english_pob_choice: be healed
  chosen_korean: 고쳐지지 않을 것입니다
  alternatives_korean:
  - 치유되지 않을 것입니다
  - 회복되지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어 לא ירפאו의 ‘고침/치유’ 이미지를 살리되, 한국어에서는 물이 ‘고쳐진다’는 비유를 자연스럽게 전달하기 위해 수동적 표현으로 옮겼습니다.
- source_word: למלח נתנו
  english_pob_choice: they are left for salt
  chosen_korean: 소금으로 남겨질 것입니다
  alternatives_korean:
  - 소금으로 내버려질 것입니다
  - 소금에 맡겨질 것입니다
  lexicon: HALOT
  rationale: למלח נתנו는 ‘소금을 위해/소금으로 지정되다’의 뜻이므로, 결과 상태를 드러내는 ‘소금으로 남겨질 것입니다’가 본문의 판단을 가장 매끄럽게 전달합니다.
theological_decisions:
- issue: ‘치유’ 은유를 물에 적용하는 표현 유지
  chosen_reading: ‘고쳐지지 않을 것입니다’로 물이 치유되는 비유를 한국어에서도 유지했습니다.
  alternative_readings:
  - ‘마르지 않을 것입니다’
  - ‘맑아지지 않을 것입니다’
  rationale: 이 절은 앞 문맥의 ‘물이 고침을 받는다’는 이미지를 이어가므로, 결과만 풀어쓰는 대신 본문의 은유를 보존하는 것이 source-direct합니다.
  doctrine_reference: 문맥적 은유 보존
