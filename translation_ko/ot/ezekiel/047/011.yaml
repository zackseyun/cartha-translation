  rationale: גבא는 물이 고인 움푹한 곳, 늪지대의 뜻이므로 ‘늪지’로 옮기면 앞의 ‘습지’와 함께 반복되는 수역 이미지를 살릴 수 있습니다.
- source_word: ירפאו
  english_pob_choice: be healed
  chosen_korean: 고쳐지지 않을 것입니다
  alternatives_korean:
