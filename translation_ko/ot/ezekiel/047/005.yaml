  source_fidelity: ‘강이 되었는데’는 히브리어에 없는 변화·결과의 뜻을 넣습니다. 본문은 측량한 결과 마주한 물길을 ‘내가 건널 수 없는 강’이라고 서술합니다. 또한 ‘헤엄칠 만한 물이 된 강’은 원문의 동격적 반복 구조를 흐립니다.
  naturalness: 현 문장은 ‘물이 불어나서—헤엄칠 만한 물이 된 강’의 연결이 문법적으로 다소 어색합니다. 원인의 ‘왜냐하면’과 뒤이은 동격적 강조를 자연스럽고 분명하게 나누는 편이 좋습니다.
  terminology: ‘강’, ‘천 척’, ‘건널 수 없는’, ‘헤엄칠 만한 물’은 문맥과 현대 표준어에 적절합니다. 다만 각주 표지는 해당 어구 바로 뒤에 두어야 합니다.
