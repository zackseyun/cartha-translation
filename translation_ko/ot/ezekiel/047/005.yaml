  text: וַ/יָּ֣מָד אֶ֔לֶף נַ֕חַל אֲשֶׁ֥ר לֹֽא אוּכַ֖ל לַ/עֲבֹ֑ר כִּֽי גָא֤וּ הַ/מַּ֨יִם֙ מֵ֣י שָׂ֔חוּ נַ֖חַל אֲשֶׁ֥ר לֹֽא יֵעָבֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/005.yaml
  text: Again he measured a thousand[a], and it was a river that I could not cross, because the waters had risen—waters to swim in[b], a river that could not be crossed.
  footnotes:
  - marker: a
    text: Or 'the waters had swelled.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'waters of swimming,' that is, water deep enough to swim in.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 다시 천 척을 재니, 내가 건널 수 없는 강이었습니다. 물이 불어났으니[a] 헤엄칠 만한 물이었고[b], 건널 수 없는 강이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불어났다’는 히브리어로 물이 높아지거나 불어난 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘헤엄의 물들’이라고 하며, 헤엄칠 만큼 깊은 물을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד אֶלֶף
  english_pob_choice: Again he measured a thousand
  chosen_korean: 그가 다시 천 척을 재고
  alternatives_korean:
  - 그가 다시 천을 재고
  - 그가 천 척을 다시 재고
  lexicon: HALOT
  rationale: 반복된 측량 동작을 나타내는 완료 서술로, ‘다시’로 앞선 측량의 연속성을 살리고 ‘천 척’으로 문맥상 거리 측량을 자연스럽게 드러냈습니다.
- source_word: נַחַל
  english_pob_choice: river
  chosen_korean: 강
  alternatives_korean:
  - 개울
  - 시내
  - 와디
  lexicon: HALOT
  rationale: 비전 속에서 이미 헤엄칠 만큼 깊어진 물길이므로, 한국어에서는 자연스럽게 ‘강’이 본문의 장면을 가장 잘 전달합니다.
- source_word: מֵי שָׂחוּ
  english_pob_choice: waters to swim in
  chosen_korean: 헤엄칠 만한 물
  alternatives_korean:
  - 수영할 물
  - 헤엄치는 데 충분한 물
  lexicon: HALOT
  rationale: 직역적 표현인 ‘물의 헤엄’보다는, 충분히 깊어 헤엄칠 수 있다는 뜻을 한국어 관용에 맞게 풀어 주었습니다.
- source_word: לֹא אוּכַל לַעֲבֹר / לֹא יֵעָבֵר
  english_pob_choice: I could not cross / could not be crossed
  chosen_korean: 내가 건널 수 없는 / 건널 수 없는
  alternatives_korean:
  - 내가 넘어갈 수 없는 / 넘어갈 수 없는
  - 건너갈 수 없는
  lexicon: HALOT
  rationale: 첫 절과 끝 절의 반복을 살려 ‘건널 수 없는’을 반복하고, 같은 의미를 두 번 되풀이하는 히브리어의 강조를 유지했습니다.
- source_word: גָאוּ הַמַּיִם
  english_pob_choice: the waters had risen
  chosen_korean: 물이 불어나서
  alternatives_korean:
  - 물이 높아져서
  - 물이 차올라서
  lexicon: HALOT
  rationale: 물의 깊어짐과 부피 증가를 함께 담는 표현으로, POB의 ‘had risen’이 지시하는 상승/증가의 뉘앙스를 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 반복 강조와 점층 구조
  chosen_reading: 첫 번째 ‘건널 수 없는’은 화자의 한계를, 마지막 ‘건널 수 없는 강’은 강의 성질을 다시 못 박는 구조로 옮겼습니다.
  alternative_readings:
  - 한 번만 ‘건널 수 없는’으로 줄이기
  - 두 표현을 서로 다른 말로 바꾸기
  rationale: 히브리어는 동일 개념을 반복해 점층적 확실성을 주므로, 이를 줄이거나 바꾸면 본문의 긴장과 강조가 약해집니다.
  doctrine_reference: 성경 본문의 수사적 반복 보존 원칙
