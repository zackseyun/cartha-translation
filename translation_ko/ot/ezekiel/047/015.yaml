id: EZK.47.15
reference: Ezekiel 47:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֶ֖ה גְּב֣וּל הָ/אָ֑רֶץ לִ/פְאַ֨ת צָפ֜וֹנָ/ה מִן הַ/יָּ֧ם הַ/גָּד֛וֹל הַ/דֶּ֥רֶךְ חֶתְלֹ֖ן לְב֥וֹא צְדָֽדָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/015.yaml
  text: 'And this shall be the boundary of the land: on the north side[d][c][b][a], from the Great Sea by the way of Hethlon to Lebo-zedad.'
  footnotes:
  - marker: a
    text: Or 'And this is the boundary of the land.' The Hebrew verb is implied rather than explicitly stated.
    reason: lexical_alternative
  - marker: b
    text: '''The Great Sea'' refers to the Mediterranean Sea.'
    reason: cultural_note
  - marker: c
    text: Or 'along the road to Hethlon.'
    reason: lexical_alternative
  - marker: d
    text: The phrase rendered 'as one goes to Zedad' may also be understood more literally as 'to the approach of Zedad.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 땅의 경계입니다. 북쪽으로는 큰 바다에서 헤틀론 길을 따라 레보-스닷까지입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것이 땅의 경계입니다.’ 히브리어에는 동사가 직접 나타나지 않고 생략되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 바다’는 지중해를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘헤틀론 길을 따라’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘레보-스닷’은 더 문자적으로는 ‘스닷에 이르는 곳’ 또는 ‘스닷의 접근로’로 이해될 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  english_pob_choice: And this shall be
  chosen_korean: 이것이
  alternatives_korean:
  - 그리고 이것은
  - 이것은
  lexicon: HALOT
  rationale: 경계 설명을 시작하는 지시문으로서, 한국어에서는 주어-서술형의 간결한 선언이 가장 자연스럽습니다. 영어의 shall be는 한국어에서 별도 미래형으로 옮기지 않아도 됩니다.
- source_word: גְּבוּל הָאָרֶץ
  english_pob_choice: the boundary of the land
  chosen_korean: 땅의 경계
  alternatives_korean:
  - 그 땅의 경계
  - 그 땅의 경계선
  lexicon: HALOT
  rationale: 토지 분배 맥락에서 גְּבוּל은 ‘경계’가 정확하며, הָאָרֶץ는 문맥상 ‘땅’으로 충분히 전달됩니다.
- source_word: לִפְאַת צָפוֹנָה
  english_pob_choice: on the north side
  chosen_korean: 북쪽으로는
  alternatives_korean:
  - 북쪽 면에서는
  - 북쪽 변으로는
  lexicon: HALOT
  rationale: 방향 표지를 한국어에서 가장 자연스럽게 풀어 옮기면 ‘북쪽으로는’이 됩니다. 면/변보다 유려하지만 방향 정보는 그대로 유지합니다.
- source_word: מִן הַיָּם הַגָּדוֹל
  english_pob_choice: from the Great Sea
  chosen_korean: 큰 바다에서
  alternatives_korean:
  - 대해에서
  - 지중해에서
  lexicon: HALOT
  rationale: אנגלית POB는 고유 지명성 때문에 ‘Great Sea’를 유지하지만, 한국어 본문에서는 본문 흐름을 위해 직역형 ‘큰 바다’가 더 직접적입니다. 문화적 주석은 각주로 보완합니다.
- source_word: הַדֶּרֶךְ חֶתְלֹן
  english_pob_choice: by the way of Hethlon
  chosen_korean: 헤틀론 길을 따라
  alternatives_korean:
  - 헤틀론 길로
  - 헤틀론의 길을 따라
  lexicon: HALOT
  rationale: הַדֶּרֶךְ는 경계 기술에서 도로/길을 뜻하므로 ‘길을 따라’가 자연스럽고, 지명 헤틀론은 현대 표기법에 따라 음역했습니다.
- source_word: לְבֹא צְדָדָה
  english_pob_choice: Lebo-zedad
  chosen_korean: 레보-스닷까지
  alternatives_korean:
  - 레보-제닷까지
  - 스닷에 이르는 곳까지
  lexicon: HALOT
  rationale: 히브리어는 מקום명 구성(‘~로 들어감/다가감’)을 보이므로 본문에서는 POB의 수정 취지에 따라 지명 결합형을 살리되, 한국어 음역은 현대식으로 옮겼습니다.
theological_decisions:
- issue: 경계문 공식의 시제와 단정성
  chosen_reading: 한국어 본문은 미래조동사 없이 현재적 선언문으로 옮겼습니다.
  alternative_readings:
  - 이것이 될 것입니다
  - 이것이 됩니다
  rationale: 히브리어의 경계 지정문은 실제 명령이나 예언적 미래보다 공식적 서술에 가깝습니다. 합쇼체의 간결한 선언이 원문의 기능을 가장 잘 반영합니다.
  doctrine_reference: 본문 기능 보존(서술적 경계 공시)
