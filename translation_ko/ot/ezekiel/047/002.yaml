  text: וַ/יּוֹצִאֵ/נִי֮ דֶּֽרֶךְ שַׁ֣עַר צָפוֹנָ/ה֒ וַ/יְסִבֵּ֨/נִי֙ דֶּ֣רֶךְ ח֔וּץ אֶל שַׁ֣עַר הַ/ח֔וּץ דֶּ֖רֶךְ הַ/פּוֹנֶ֣ה קָדִ֑ים וְ/הִנֵּה מַ֣יִם מְפַכִּ֔ים מִן הַ/כָּתֵ֖ף הַ/יְמָנִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/002.yaml
  text: Then he brought me out by way of the north gate[a], and led me around by the outside way to the outer gate, the one facing east; and behold[b], water was trickling from the right side.
  footnotes:
  - marker: a
    text: Or 'water was bubbling out' or 'water was flowing out'; the Hebrew verb suggests a small emerging flow rather than a large current.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from the right shoulder'; here 'shoulder' refers to the side or flank of the structure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 북문을 통해 데리고 나오셨고, 바깥길로 돌아 동쪽을 향한 외문으로 데리고 가셨습니다. 보십시오, 물이 오른쪽 측면에서[b] 조금씩 흘러나오고 있었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물이 솟아 나오고 있었다’ 또는 ‘물이 흘러 나오고 있었다’로 옮길 수 있습니다. 히브리어 동사는 큰 물줄기보다 작게 생겨나 흘러나오는 물을 암시합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘오른쪽 어깨에서’입니다. 여기서는 건축물의 측면 또는 가쪽을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנִי
  english_pob_choice: he brought me out
  chosen_korean: 데리고 나가서
  alternatives_korean:
  - 나를 데리고 나가서
  - 밖으로 이끌어내어
  lexicon: HALOT
  rationale: 히필 형태의 ‘밖으로 내보내다’는 의미를 자연스럽게 살려, 시각적 이동이 드러나는 ‘데리고 나가서’로 옮겼습니다.
- source_word: דֶּרֶךְ שַׁעַר צָפוֹנָה
  english_pob_choice: by way of the north gate
  chosen_korean: 북문 쪽으로
  alternatives_korean:
  - 북문으로
  - 북문을 지나
  lexicon: HALOT
  rationale: ‘דרך’의 이동 경로 감각을 살리되 한국어에서 어색하지 않도록 ‘-쪽으로’로 처리해 진행 방향을 드러냈습니다.
- source_word: מַיִם מְפַכִּים
  english_pob_choice: water was trickling
  chosen_korean: 물이 조금씩 흘러나오고 있었습니다
  alternatives_korean:
  - 물이 졸졸 흐르고 있었습니다
  - 물이 솟아나고 있었습니다
  - 물이 흘러나오고 있었습니다
  lexicon: HALOT
  rationale: ‘מְפַכִּים’의 미세하게 솟거나 흘러나오는 흐름을, 큰 물줄기가 아니라는 점이 보이도록 ‘조금씩 흘러나오다’로 옮겼습니다.
- source_word: מִן הַכָּתֵף הַיְמָנִית
  english_pob_choice: from the right side
  chosen_korean: 오른쪽에서
  alternatives_korean:
  - 오른쪽 옆구리에서
  - 오른쪽 어깨에서
  lexicon: HALOT
  rationale: ‘כָּתֵף’의 문자적 ‘어깨’보다 건축·공간 맥락의 ‘측면/가쪽’ 의미를 따라, 한국어에서는 가장 자연스러운 ‘오른쪽에서’로 처리했습니다.
