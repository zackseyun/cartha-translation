id: EZK.47.17
reference: Ezekiel 47:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֨ה גְב֜וּל מִן הַ/יָּ֗ם חֲצַ֤ר עֵינוֹן֙ גְּב֣וּל דַּמֶּ֔שֶׂק וְ/צָפ֥וֹן צָפ֖וֹנָ/ה וּ/גְב֣וּל חֲמָ֑ת וְ/אֵ֖ת פְּאַ֥ת צָפֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/017.yaml
  text: So the border shall be from the sea to Hazar-enon[a], at the border of Damascus; and on the north, northward, with the border of Hamath[b]. This shall be the north side.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from the sea.'' In context this is the Mediterranean Sea, but the text does not explicitly repeat ''Great Sea'' here.'
    reason: cross_reference
  - marker: b
    text: 'Hazar-enon: traditionally also rendered ''Hazar-enan.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 그 경계는 바다에서 하자르에논까지, 곧 다메섹 경계까지이며, 북쪽으로는 북쪽 쪽에 있는 하맛 경계까지입니다. 이것이 북쪽 변입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바다에서’는 히브리어의 단순한 표현을 따른 것입니다. 문맥상 지중해를 가리키지만, 본문 자체는 여기서 ‘큰 바다’라고 다시 말하지 않습니다.
    reason: cross_reference
  - marker: b
    text: ‘하자르에논’은 전통적으로도 ‘하살에난’으로 옮기기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה גְבוּל
  english_pob_choice: So the border shall be
  chosen_korean: 그 경계는
  alternatives_korean:
  - 그리고 그 경계는
  - 그러므로 그 경계는
  lexicon: HALOT
  rationale: 문맥상 새로운 경계 설명을 여는 서술이므로, 결과를 정리하는 연결어와 함께 자연스러운 현대 한국어 문장으로 옮겼습니다.
- source_word: מִן הַיָּם
  english_pob_choice: from the sea
  chosen_korean: 바다에서
  alternatives_korean:
  - 그 바다에서
  - 대해에서
  lexicon: HALOT
  rationale: 본문은 단순히 ‘바다’라고만 하므로, 본문에 없는 ‘큰’ 바다를 덧붙이지 않고 간결하게 옮겼습니다.
- source_word: חֲצַר עֵינוֹן
  english_pob_choice: Hazar-enon
  chosen_korean: 하자르에논
  alternatives_korean:
  - 하살에논
  - 하자르에난
  lexicon: HALOT
  rationale: 지명은 음역했고, 영어 POB의 표준형 Hazar-enon을 반영하되 한국어 표기법에 맞게 옮겼습니다.
- source_word: וְצָפוֹן צָפוֹנָה
  english_pob_choice: on the north, northward
  chosen_korean: 북쪽으로는 북쪽 쪽에 있는
  alternatives_korean:
  - 북쪽으로는 북쪽으로
  - 북쪽으로
  lexicon: HALOT
  rationale: 히브리어의 중복된 ‘북쪽’ 강조를 살리기 위해, 단순히 ‘북쪽으로’로만 줄이지 않고 방향 중첩을 드러내는 표현을 택했습니다.
- source_word: וְאֵת פְּאַת צָפוֹן
  english_pob_choice: This shall be the north side
  chosen_korean: 이것이 북쪽 변입니다
  alternatives_korean:
  - 이것이 북쪽 면입니다
  - 이것이 북쪽 경계입니다
  lexicon: HALOT
  rationale: 마무리 요약문으로서 ‘면/변’ 가운데 지리적 경계의 맥락을 살리기 위해 ‘변’을 선택했습니다.
