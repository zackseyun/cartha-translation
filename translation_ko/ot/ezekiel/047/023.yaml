source:
  edition: WLC
  text: וְ/הָיָ֣ה בַ/שֵּׁ֔בֶט אֲשֶׁר גָּ֥ר הַ/גֵּ֖ר אִתּ֑/וֹ שָׁ֚ם תִּתְּנ֣וּ נַחֲלָת֔/וֹ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/023.yaml
  text: And it shall be that in the tribe with which the sojourner resides[a], there you shall give him his inheritance, declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'resident alien' for 'sojourner'; the Hebrew גֵּר refers to a non-native person settled among Israel under its communal order, not merely a temporary traveler.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 거류민이 거주하는 지파에서 너희는 그에게 그의 상속 몫을 주어야 합니다. 주 여호와의 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거류민’은 히브리어 גֵּר를 옮긴 말로, 단순한 여행자가 아니라 이스라엘 가운데 정착하여 사는 외부 출신 주민을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַשֵּׁבֶט
  english_pob_choice: in the tribe
  chosen_korean: 그 지파 안에서
  alternatives_korean:
  - 그 지파에서
  - 지파 가운데서
  lexicon: HALOT
  rationale: שֵׁבֶט은 여기서 지파적 할당 범위를 가리키므로, 공간·소속을 함께 드러내는 ‘안에서’가 자연스럽습니다.
- source_word: אֲשֶׁר גָּר הַגֵּר אִתּוֹ
  english_pob_choice: with which the sojourner resides
  chosen_korean: 그 소저너가 거주하는
  alternatives_korean:
  - 그 거류민이 사는
  - 그 거주 외국인이 머무는
  lexicon: HALOT
  rationale: גֵּר는 일시적 여행자가 아니라 이스라엘 가운데 정착해 사는 이방 거주자를 가리키므로, ‘소저너’로 음역해 범주를 보존했습니다.
- source_word: תִּתְּנוּ
  english_pob_choice: you shall give
  chosen_korean: 너희는 ... 주어야 합니다
  alternatives_korean:
  - 너희는 ... 줄 것입니다
  - 너희는 ... 주십시오
  lexicon: HALOT
  rationale: 둘째 인칭 복수의 법적 지시를 한국어의 의무 표현으로 옮겨, 명령성과 미래적 규범성을 함께 살렸습니다.
- source_word: נַחֲלָתוֹ
  english_pob_choice: his inheritance
  chosen_korean: 그의 유산
  alternatives_korean:
  - 그의 상속분
  - 그의 몫
  lexicon: HALOT
  rationale: 문맥상 토지 분배의 상속 몫을 뜻하지만, 한국어에서는 ‘유산’이 가장 간결하게 권리와 배분의 의미를 담습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 여호와의 말입니다
  alternatives_korean:
  - 주 하나님의 말씀입니다
  - 주 야훼의 말씀입니다
  lexicon: HALOT
  rationale: 예언자적 선포 공식이므로 ‘말입니다’로 닫았고, 아도나이+יהוה 결합은 한국 교회 독자에게 익숙한 ‘주 여호와’로 구분했습니다.
theological_decisions:
- issue: יהוה의 표기와 한국어 교회 수용성
  chosen_reading: 주 여호와
  alternative_readings:
  - 주 야훼
  - 주 하나님
  rationale: 원문은 아도나이 뒤에 여호와 이름이 오므로, 한국어 본문에서는 오해 없이 신명 호칭을 전달하는 전통적 결합형을 택했습니다.
  doctrine_reference: 'POB Korean naming policy: YHWH rendering in prophetic formulas'
- issue: 지파-거류민의 언약 공동체 소속
  chosen_reading: 그 지파 안에서 ... 그의 유산을 주어야 합니다
  alternative_readings:
  - 그 지파 가운데 ... 몫을 주어야 합니다
  - 그가 거주하는 곳에서 ... 몫을 주어야 합니다
  rationale: 이 절은 거류민도 지파의 분배 질서 안에서 실제 상속 몫을 받는다는 점을 강조하므로, 공동체적 포함을 약화시키지 않도록 옮겼습니다.
  doctrine_reference: Ezekiel 47 allotment context
