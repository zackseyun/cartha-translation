  source_fidelity: 핵심 구조는 대체로 충실하지만, ‘소저너’는 표준 한국어 성경 번역문에서 부자연스럽고, נַחֲלָתוֹ를 ‘유산’으로 옮기면 개인이 남긴 재산이라는 현대 한국어의 주된 뜻이 강해 토지 분배 맥락의 상속·배정 몫을 충분히 드러내지 못합니다.
  naturalness: ‘그 소저너’는 현대 표준어 합쇼체의 본문 어휘로 적절하지 않습니다. ‘거류민’은 간결하고, 정착하여 사는 외부 출신 주민이라는 גֵּר의 법적·사회적 범주를 자연스럽게 전달합니다. ‘상속 몫’은 이 문맥에서 자연스럽고 구체적입니다.
  terminology: גֵּר는 ‘거류민’으로, נַחֲלָה는 토지 배정과 상속의 의미를 함께 나타내는 ‘상속 몫’으로 옮기는 것이 적절합니다. אֲדֹנָי יְהוִה의 ‘주 여호와’는 한국어 성경의 통용 표기와 원문의 이중 신적 호칭을 모두 보존합니다.
  issues:
