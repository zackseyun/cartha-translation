id: EZK.47.10
reference: Ezekiel 47:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֩ יעמדו עָלָ֜י/ו דַּוָּגִ֗ים מֵ/עֵ֥ין גֶּ֨דִי֙ וְ/עַד עֵ֣ין עֶגְלַ֔יִם מִשְׁט֥וֹחַ לַֽ/חֲרָמִ֖ים יִהְי֑וּ לְ/מִינָ/ה֙ תִּהְיֶ֣ה דְגָתָ֔/ם כִּ/דְגַ֛ת הַ/יָּ֥ם הַ/גָּד֖וֹל רַבָּ֥ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/010.yaml
  text: And it will happen that fishermen will stand beside it[a]; from En-gedi even to En-eglaim there will be a place for spreading nets. Their fish will be of many kinds, like the fish of the Great Sea[b], very many.
  footnotes:
  - marker: a
    text: Or, more literally, 'their fish will be according to its kind,' expressing a great variety of species.
    reason: lexical_alternative
  - marker: b
    text: '''The Great Sea'' refers to the Mediterranean Sea.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 어부들이 그 곁에 서 있을 것입니다. 엔게디에서 엔에글라임까지 그물을 펼 자리가 있을 것입니다. 그곳의 물고기는 여러 종류로[a], 큰 바다의 물고기처럼 매우 많을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 직역하여, ‘그 종류대로’. 여러 종류의 물고기를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 바다’는 지중해를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it will happen
  chosen_korean: 그러면 ... 있을 것입니다
  alternatives_korean:
  - 그리고 그것은 일어날 것입니다
  - 그 일이 있을 것입니다
  lexicon: HALOT
  rationale: 예언적 전개를 자연스럽게 살리면서도 히브리어의 사건 전환 표지를 한국어로 과도하게 경직되지 않게 옮겼습니다.
- source_word: דַּוָּגִים
  english_pob_choice: fishermen
  chosen_korean: 어부들
  alternatives_korean:
  - 낚시꾼들
  - 물고기잡이들
  lexicon: HALOT
  rationale: 물고기를 잡는 사람을 가리키는 표준적이고 자연스러운 번역으로, 본문의 직업적 의미를 분명히 드러냅니다.
- source_word: מִשְׁטוֹחַ לַחֲרָמִים
  english_pob_choice: a place for spreading nets
  chosen_korean: 그물 펼 자리
  alternatives_korean:
  - 그물을 펼치는 장소
  - 그물 널 자리
  lexicon: HALOT
  rationale: 명사구의 기능을 살려 ‘그물 펼 자리’로 간결하게 옮겼고, 어색한 직역보다 본문 장면을 더 분명히 전달합니다.
- source_word: לְמִינָה
  english_pob_choice: of many kinds
  chosen_korean: 여러 종류가 될
  alternatives_korean:
  - 각기 종류대로 될
  - 종류가 다양한
  lexicon: HALOT
  rationale: ‘따라서’의 뉘앙스를 살리되 한국어에서는 물고기의 다양성을 드러내는 표현이 자연스럽기 때문에 ‘여러 종류’로 옮겼습니다.
- source_word: כִּדְגַת הַיָּם הַגָּדוֹל
  english_pob_choice: like the fish of the Great Sea
  chosen_korean: 큰 바다의 물고기들
  alternatives_korean:
  - 대해의 물고기들
  - 지중해의 물고기들
  lexicon: HALOT
  rationale: ‘큰 바다’라는 성서적 표현을 본문에서 보존하고, 식별은 각주로 처리하는 편이 출처 문구를 더 잘 유지합니다.
theological_decisions:
- issue: ‘큰 바다’의 지리적 식별
  chosen_reading: 본문에는 ‘큰 바다’로 두고, 지중해라는 식별은 각주로 처리했습니다.
  alternative_readings:
  - 본문에서 바로 ‘지중해’로 번역하기
  - ‘대해’로만 두기
  rationale: 원문 표현의 성서적 관용구를 보존하면서도 독자가 의미를 오해하지 않도록 하려는 선택입니다.
  doctrine_reference: 본문-각주 구분 원칙
