revisions:
- from: 그러면 어부들이 그곳에 설 것입니다[a]. 엔게디에서 엔에글라임에 이르기까지 그물 펼 자리가 있을 것입니다. 그 물고기들은 여러 종류가 될 것이며, 큰 바다의 물고기들[b]처럼 매우 많을 것입니다.
  to: 그때 어부들이 그 곁에 서 있을 것입니다. 엔게디에서 엔에글라임까지 그물을 펼 자리가 있을 것입니다. 그곳의 물고기는 여러 종류로[a], 큰 바다의 물고기처럼 매우 많을 것입니다[b].
  rationale: 원문의 미래 장면 표지와 어부들이 물가에 서 있는 공간 관계를 보완했습니다. 물고기의 ‘종류’와 ‘수적 풍부함’을 한국어에서 혼동하지 않도록 문장을 다듬었고, 종류에 관한 각주를 해당 단어에 붙여 앵커 오류를 바로잡았습니다. ‘큰 바다’는 원문 표현으로 유지했습니다.
