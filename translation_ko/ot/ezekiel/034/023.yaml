  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֨י עֲלֵי/הֶ֜ם רֹעֶ֤ה אֶחָד֙ וְ/רָעָ֣ה אֶתְ/הֶ֔ן אֵ֖ת עַבְדִּ֣/י דָוִ֑יד ה֚וּא יִרְעֶ֣ה אֹתָ֔/ם וְ/הֽוּא יִהְיֶ֥ה לָ/הֶ֖ן לְ/רֹעֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/023.yaml
  text: And I will raise up over them one shepherd[a], my servant David, and he will shepherd them; he himself will shepherd them[c][b], and he himself will be their shepherd.
  footnotes:
  - marker: a
    text: Or 'I will set up over them one shepherd.'
    reason: lexical_alternative
  - marker: b
    text: '''David'' may refer literally to David as an idealized royal figure, or more broadly to a future Davidic ruler.'
    reason: alternative_reading
  - marker: c
    text: The Hebrew uses the shepherd verb repeatedly; it can also mean 'tend' or 'feed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 그들 위에 한 목자[a], 곧 내 종 다윗을 세우고, 그가 그들을 먹이고[b] 돌보며, 그가 그들의 목자가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 위에 한 목자를 세우겠습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 목자 동사를 반복합니다. 이 동사는 ‘먹이다’나 ‘기르다’의 뜻도 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי / I will raise up
  english_pob_choice: I will raise up
  chosen_korean: 내가 … 세우고
  alternatives_korean:
  - 내가 … 일으키고
  - 내가 … 임명하고
  lexicon: HALOT
  rationale: הקים은 이 문맥에서 지도자를 세워 세운다는 뜻을 담으므로, 한국어에서는 ‘세우다’가 가장 자연스럽고 다의성을 과도하게 좁히지 않습니다.
- source_word: רֹעֶה / shepherd
  english_pob_choice: shepherd
  chosen_korean: 목자
  alternatives_korean:
  - 양치는 이
  - 목양자
  lexicon: HALOT
  rationale: 비유적 지도자-목자 이미지를 살리기 위해 ‘목자’를 택했습니다. 본문 전체의 반복되는 목자 어휘와도 잘 맞습니다.
- source_word: וְרָעָה / he will shepherd
  english_pob_choice: he will shepherd
  chosen_korean: 그가 그들을 먹이고 돌보며
  alternatives_korean:
  - 그가 그들을 목양하며
  - 그가 그들을 치며
  lexicon: HALOT
  rationale: רעה는 목양 문맥에서 ‘먹이다/돌보다/치다’의 뜻을 함께 가지므로, 한국어에서는 ‘먹이고 돌보며’로 의미를 드러내되 목자 비유를 유지했습니다.
- source_word: עַבְדִּי דָוִיד / my servant David
  english_pob_choice: my servant David
  chosen_korean: 내 종 다윗
  alternatives_korean:
  - 내 종 다윗을
  - 다윗, 내 종
  lexicon: HALOT
  rationale: 앱포지션 구조를 살려 ‘내 종 다윗’으로 옮겼습니다. 여기서 ‘종’은 신분적 종속보다 하나님의 소명받은 종이라는 성서적 호칭을 반영합니다.
theological_decisions:
- issue: ‘다윗’의 예언적 지시 대상
  chosen_reading: 본문의 고유명사 ‘다윗’을 그대로 두고, 메시아나 다윗계 통치자로 번역문에서 확장하지 않았습니다.
  alternative_readings:
  - 미래의 다윗계 통치자
  - 메시아
  rationale: 히브리어 본문은 ‘다윗’이라고 말하며, 번역이 해석을 앞질러 단정하지 않도록 원문 표지를 유지했습니다. 예언적 긴장은 주석 없이도 읽히게 두는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙과 예언 본문의 해석적 긴장 보존
