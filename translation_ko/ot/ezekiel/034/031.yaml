id: EZK.34.31
reference: Ezekiel 34:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתֵּ֥ן צֹאנִ֛/י צֹ֥אן מַרְעִיתִ֖/י אָדָ֣ם אַתֶּ֑ם אֲנִי֙ אֱלֹ֣הֵי/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/031.yaml
  text: And you[a], my flock, the flock of my pasture—you are men, and I am your God, declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'human beings' or 'humankind.' Hebrew 'adam' can denote humanity in general; here it contrasts the metaphorical 'flock' with their actual human status.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희, 내 양 떼, 내 목초의 양 떼여—너희는 사람이요, 나는 너희의 하나님입니다. 주 야훼의 말씀이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람’ 또는 ‘인류’로도 옮길 수 있습니다. 히브리어 adam은 여기서 비유적 ‘양 떼’와 대비되는 실제 인간성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֵּן
  english_pob_choice: And you
  chosen_korean: 그리고 너희
  alternatives_korean:
  - 그리고 너희는
  - 그리고 너희들
  lexicon: HALOT
  rationale: 문두의 접속사와 직접 호소를 살리되, 히브리어의 대조적 강조를 자연스럽게 드러내기 위해 ‘그리고 너희’로 옮겼습니다.
- source_word: צֹאנִי / צֹאן מַרְעִיתִי
  english_pob_choice: my flock / the flock of my pasture
  chosen_korean: 내 양 떼 / 내 목초의 양 떼
  alternatives_korean:
  - 내 양 떼 / 내 풀밭의 양 떼
  - 내 양 무리 / 내 목장의 양 떼
  lexicon: HALOT
  rationale: 두 개의 병렬적 목양 표현을 모두 살리기 위해 ‘양 떼’와 ‘목초’를 대응시켰고, apposition의 반복성을 유지했습니다.
- source_word: אָדָם
  english_pob_choice: men
  chosen_korean: 사람이요
  alternatives_korean:
  - 인간이요
  - 사람들이요
  lexicon: HALOT
  rationale: 히브리어 adam의 인간성 강조를 살리되, 한국어에서는 단수·복수를 아우르는 일반명사 ‘사람’이 가장 자연스럽고 직설적이어서 선택했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 YHWH를 ‘야훼’로 옮기고, אֲדֹנָי와 결합된 형식은 한국어에서 중복을 피하면서도 존칭을 유지하는 ‘주 야훼’로 처리했습니다.
theological_decisions:
- issue: אָדָם אַתֶּם의 인류 일반성 vs. 성별 표지
  chosen_reading: ‘사람이요’로 번역해 실제 인간임을 직접 밝히고, 성별을 불필요하게 특정하지 않았습니다.
  alternative_readings:
  - ‘인간이요’
  - ‘사람들이요’
  rationale: 본문의 요지는 목자-양 비유가 아니라 비유의 대상이 실제 인간이라는 점을 드러내는 데 있으므로, 한국어에서는 자연스러운 일반명사로 그 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; Contested terms table for אָדָם
- issue: 주 야훼의 말투
  chosen_reading: 직접 신탁문을 현대 합쇼체로 옮기고, ‘말씀이십니다’로 선포 형식을 살렸습니다.
  alternative_readings:
  - 주 야훼의 말씀입니다
  - 주 야훼의 선언입니다
  rationale: 예언 신탁의 종결 공식을 한국어 공적 문체로 분명히 드러내되, 본문이 지닌 권위와 종결감을 유지하기 위해 ‘말씀이십니다’를 사용했습니다.
  doctrine_reference: 예언서 신탁 공식 번역 원칙
