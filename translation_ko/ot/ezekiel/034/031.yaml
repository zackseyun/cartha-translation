  to: 그리고 너희는 내 양 떼, 내 목초지의 양 떼입니다. 너희는 사람[a]이며, 나는 너희의 하나님입니다. 주 야훼의 말씀입니다.
  rationale: ‘목초’를 ‘목초지’로 고쳐 히브리어 목양 표현을 자연스럽게 반영했습니다. 문두의 직접 호소와 두 차례의 ‘양 떼’ 반복은 유지하되, 현대 합쇼체에 맞게 문장을 정리했습니다. אָדָם의 일반적 인간 의미와 그 비유적 대비는 본문과 각주에서 보존했습니다.
