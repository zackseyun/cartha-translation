source:
  edition: WLC
  text: וְ/נָתַן֩ עֵ֨ץ הַ/שָּׂדֶ֜ה אֶת פִּרְי֗/וֹ וְ/הָ/אָ֨רֶץ֙ תִּתֵּ֣ן יְבוּלָ֔/הּ וְ/הָי֥וּ עַל אַדְמָתָ֖/ם לָ/בֶ֑טַח וְֽ/יָדְע֞וּ כִּי אֲנִ֣י יְהוָ֗ה בְּ/שִׁבְרִ/י֙ אֶת מֹט֣וֹת עֻלָּ֔/ם וְ/הִ֨צַּלְתִּ֔י/ם מִ/יַּ֖ד הָ/עֹבְדִ֥ים בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/027.yaml
  text: The tree of the field will give its fruit[a], and the land will give its produce, and they will be secure on their land. Then they will know that I am Yahweh, when I break the bars of their yoke and deliver them from the hand of those who enslaved them.
  footnotes:
  - marker: a
    text: Or 'those who made them serve' or 'those who worked them.' The Hebrew participle can be rendered more literally, but the context of a broken yoke supports the stronger sense 'enslaved them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들의 멍에 막대기들을 부수고 그들을 노예로 삼던 자들의 손에서 구출할 때, 들판의 나무가 그 열매를 내고 땅이 그 소산을 낼 것이며, 그들은 자기 땅에서 안전하게 지낼 것입니다. 그때 그들은 내가 야훼임을 알 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 일하게 하던 자들’, ‘그들을 부리던 자들’로 옮길 수 있습니다. 히브리어 분사는 더 문자적으로 옮길 경우 이러한 표현이 가능하지만, 멍에를 부수고 구출하는 문맥은 강한 억압의 의미를 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן עֵץ הַשָּׂדֶה אֶת פִּרְיוֹ
  english_pob_choice: The tree of the field will give its fruit
  chosen_korean: 들의 나무가 열매를 내고
  alternatives_korean:
  - 밭의 나무가 그 열매를 내고
  - 들의 나무가 그 열매를 내며
  lexicon: HALOT
  rationale: עֵץ הַשָּׂדֶה의 단수형 이미지를 살리면서도 한국어에서는 자연스럽게 들판의 수목 전체를 가리키는 표현으로 옮겼습니다. פִּרְיוֹ는 ‘그 열매’도 가능하지만, 문맥상 소유를 자연스럽게 드러내는 ‘열매’를 택했습니다.
- source_word: וְהָאָרֶץ תִּתֵּן יְבוּלָהּ
  english_pob_choice: and the land will give its produce
  chosen_korean: 땅이 소산을 내며
  alternatives_korean:
  - 땅이 그 소산을 내며
  - 땅이 수확을 내며
  lexicon: HALOT
  rationale: יְבוּלָהּ는 농경적 ‘산출/소산’의 뜻이 분명하므로, 현대 한국어에서 문맥을 살리는 ‘소산’을 선택했습니다. ‘수확’은 사람이 거두는 행위를 떠올리기 쉬워 원문의 능동적 산출 이미지를 다소 약화합니다.
- source_word: וְהָיוּ עַל אַדְמָתָם לָבֶטַח
  english_pob_choice: they will be secure on their land
  chosen_korean: 그들은 자기 땅에서 안전하게 살 것입니다
  alternatives_korean:
  - 그들은 자기 땅 위에 안전하게 있을 것입니다
  - 그들은 자기 땅에서 평안히 살 것입니다
  lexicon: HALOT
  rationale: לָבֶטַח의 핵심은 안전/보호이므로 ‘안전하게’로 옮겼습니다. ‘살 것입니다’는 מרכיב의 거주감을 자연스럽게 살리면서도 원문에 없는 ‘거하다’를 과하게 덧붙이지 않습니다.
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  english_pob_choice: Then they will know that I am Yahweh
  chosen_korean: 그때 그들은 내가 야훼임을 알 것입니다
  alternatives_korean:
  - 그때 그들은 내가 야훼인 줄 알 것입니다
  - 그때 그들은 내가 야훼라는 것을 알 것입니다
  lexicon: HALOT
  rationale: 야훼는 본 프로젝트 기본값에 따라 신적 고유명사로 음역했습니다. כִּי 이하의 인식 절은 한국어에서 ‘…임을 알다’가 가장 간명하고 자연스럽습니다.
- source_word: מֹטוֹת עֻלָּם
  english_pob_choice: the bars of their yoke
  chosen_korean: 그들의 멍에의 막대기
  alternatives_korean:
  - 그들의 멍에의 막대
  - 멍에를 이루는 막대
  lexicon: HALOT
  rationale: מֹטוֹת는 ‘막대/봉’이고 עֹל과 결합해 억압의 도구 이미지를 이룹니다. ‘막대기’는 지나치게 축소하지 않으면서도 한국어 독자가 억압의 물질성을 이해하게 합니다.
- source_word: הָעֹבְדִים בָּהֶם
  english_pob_choice: those who enslaved them
  chosen_korean: 그들을 그들을 부리던 자들의 손에서 구출할
  alternatives_korean:
  - 그들을 그들을 종으로 삼던 자들의 손에서 구출할
  - 그들을 그들을 부리던 자들의 손에서 건져낼
  lexicon: HALOT
  rationale: עֹבְדִים בָּהֶם은 문자적으로는 ‘그들로 하여금 일하게 한/그들을 부린’ 뜻이지만, 문맥의 멍에 이미지와 결합해 강한 억압을 가리키므로 ‘부리던 자들’로 옮겼습니다. ‘구출하다’는 נצל의 구출 의미를 잘 드러내며, ‘손에서’라는 관용도 보존합니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 고유명사 ‘야훼’로 유지했습니다.
  alternative_readings:
  - ‘주’
  - ‘여호와’
  rationale: 본문이 직접 사용하는 언약명의 표지를 살리기 위해, 일반 호칭인 ‘주’ 대신 고유명사 음역을 택했습니다. 이는 문맥의 ‘내가 …임을 알리라’는 언약 인식 공식과도 잘 맞습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: הָעֹבְדִים בָּהֶם의 억압 강도
  chosen_reading: ‘그들을 부리던 자들’로 번역해 강한 지배·착취 관계를 드러냈습니다.
  alternative_readings:
  - ‘그들을 섬기게 하던 자들’
  - ‘그들을 일하게 하던 자들’
  rationale: 직전의 ‘멍에’와 ‘막대기’ 이미지는 단순 고용보다 억압적 지배를 가리킵니다. 따라서 본문이 허용하는 범위 안에서 해방의 대조를 분명히 하는 번역이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
