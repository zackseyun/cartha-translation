- from: 들의 나무가 열매를 내고, 땅이 소산을 내며, 그들은 자기 땅에서 안전하게 살 것입니다. 그때 그들은 내가 야훼임을 알 것입니다. 내가 그들의 멍에의 막대기를 부수고, 그들을 그들을 부리던 자들의 손에서 구출할 때입니다.[a]
  to: 내가 그들의 멍에 막대기들을 부수고 그들을 노예로 삼던 자들의 손에서 구출할 때, 들판의 나무가 그 열매를 내고 땅이 그 소산을 낼 것이며, 그들은 자기 땅에서 안전하게 지낼 것입니다. 그때 그들은 내가 야훼임을 알 것입니다.[a]
  rationale: 시간절을 문장 앞으로 옮겨 원문의 ‘내가 … 할 때 그들이 야훼를 알 것이다’라는 관계를 분명히 했습니다. 중복된 목적어를 제거하고, 원문에 없는 ‘살다’를 더 절제된 ‘안전하게 지내다’로 조정했습니다. ‘노예로 삼던 자들’은 원문의 억압·해방 문맥과 영어 POB의 ‘enslaved them’을 반영하되, 각주에서 문자적·완화된 대안을 보존합니다.
