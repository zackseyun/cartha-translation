  yaml_path: translation/ot/ezekiel/034/026.yaml
  text: And I will make them and the places around my hill a blessing[a], and I will send down the rain in its season; they will be showers of blessing.
  footnotes:
  - marker: a
    text: Or 'them and the surroundings of my hill.' The phrase likely refers to the area around God's holy hill, often understood as Zion.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들과 내 산 주변을 복이 되게 하겠습니다.[a] 내가 제때에 비를 내리겠으니, 복의 소낙비들이 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들과 내 산 둘레 지역.’ 이 표현은 하나님의 거룩한 산 주변 지역을 가리키는 것으로 보이며, 흔히 시온으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: I will make
  chosen_korean: 복이 되게 하며
  alternatives_korean:
  - 복으로 삼으며
  - 복이 되게 하겠습니다
  - 복이 되도록 하며
  lexicon: HALOT
  rationale: נתן의 결과적 의미를 살려, 단순히 ‘주다’보다 ‘복이 되게 하다’로 옮겨 그들이 복의 역할을 하게 되는 뜻을 드러냈습니다.
- source_word: אוֹתָם וּסְבִיבוֹת גִּבְעָתִי
  english_pob_choice: them and the places around my hill
  chosen_korean: 그들과 내 산기슭 사방
  alternatives_korean:
  - 그들과 내 산 둘레
  - 그들과 내 언덕 주변
  - 그들과 내 산 주위
  lexicon: HALOT
  rationale: סביבות는 ‘둘레/주변/사방’의 공간적 범위를 가리키므로, 자연스러운 한국어로 ‘산기슭 사방’이라 옮겨 주변 지역 전체를 살렸습니다.
- source_word: בְּרָכָה
  english_pob_choice: a blessing
  chosen_korean: 복이 되게
  alternatives_korean:
  - 복이 되도록
  - 축복이 되게
  lexicon: HALOT
  rationale: 명사형 ‘복’을 유지하되, 앞의 동사와 결합해 결과 상태를 나타내는 한국어 표현으로 처리했습니다.
- source_word: הַגֶּשֶׁם בְּעִתּוֹ
  english_pob_choice: the rain in its season
  chosen_korean: 제때에 비를
  alternatives_korean:
  - 때를 따라 비를
  - 알맞은 때에 비를
  lexicon: HALOT
  rationale: עת의 ‘정해진 때/알맞은 때’ 의미를 살려, 농경적·언약적 뉘앙스가 자연스럽게 드러나는 ‘제때에’로 옮겼습니다.
- source_word: גִּשְׁמֵי בְרָכָה יִהְיוּ
  english_pob_choice: they will be showers of blessing
  chosen_korean: 복이 되는 소낙비가 내릴 것입니다
  alternatives_korean:
  - 복의 소낙비가 있을 것입니다
  - 복의 소나기가 될 것입니다
  lexicon: HALOT
  rationale: גִּשְׁמֵי는 복수형 ‘소낙비들/소낙비’에 가까우므로, 반복성을 살리면서도 한국어에서 자연스럽게 ‘소낙비가 내릴 것입니다’로 풀었습니다.
theological_decisions:
- issue: ‘내 산’의 지리적·신학적 지시 대상
  chosen_reading: 본문의 문구를 그대로 살려 ‘내 산기슭’으로 번역하고, 지시 대상을 본문 안에서 특정하지 않았습니다.
  alternative_readings:
  - 시온
  - 예루살렘
  - 성소 산
  rationale: 히브리어는 단지 ‘내 산’이라고만 말하므로, 본문이 직접 밝히지 않은 특정 지명을 본문 속에 삽입하지 않는 편이 원문의 절제와 의도를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
