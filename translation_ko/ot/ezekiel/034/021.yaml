  verdict: revise
  source_fidelity: 히브리어 כָּל(‘모든’)이 한국어 번역에서 빠졌습니다. 또한 עַד אֲשֶׁר는 ‘마침내’로 어느 정도 드러나지만, ‘~할 때까지’로 옮기면 지속된 폭력의 범위와 결과를 더 직접적으로 보존합니다. 나머지 신체 은유와 공격 동사는 원문에 충실합니다.
  naturalness: ‘옆구리와 어깨로 밀어붙이고’, ‘뿔로 … 들이받아’는 현대 표준 한국어에서 자연스럽고 본문의 비유적·고발적 어조에 적절합니다. ‘~할 때까지’ 구문도 합쇼체 문맥에서 매끄럽습니다.
  terminology: הַנַּחְלוֹת는 문맥상 힘없고 병약한 양들을 가리키므로 ‘연약한 자들’은 가능한 번역입니다. 다만 כָּל을 반영하여 ‘모든 연약한 자들’로 해야 합니다. ‘밖으로’는 הַחוּצָה에 적합합니다.
  issues:
