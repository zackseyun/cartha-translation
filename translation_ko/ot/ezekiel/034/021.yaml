  text: יַ֗עַן בְּ/צַ֤ד וּ/בְ/כָתֵף֙ תֶּהְדֹּ֔פוּ וּ/בְ/קַרְנֵי/כֶ֥ם תְּנַגְּח֖וּ כָּל הַ/נַּחְל֑וֹת עַ֣ד אֲשֶׁ֧ר הֲפִיצוֹתֶ֛ם אוֹתָ֖/נָה אֶל הַ/חֽוּצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/021.yaml
  text: Because you push with side and shoulder, and gore all the weak ones with your horns until you have scattered them outside,
translation:
  language: ko
  text: 이는 네가 옆구리와 어깨로 밀어붙이고, 뿔로 연약한 자들을 들이받아, 마침내 그들을 밖으로 흩어 버렸기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּצַד וּבְכָתֵף
  english_pob_choice: with side and shoulder
  chosen_korean: 옆구리와 어깨로
  alternatives_korean:
  - 옆과 어깨로
  - 옆구리와 어깨로 밀어
  lexicon: בְּ + צד / כָתֵף
  rationale: 신체 부위를 그대로 살리되 한국어로 자연스럽게 압박의 도구를 드러내는 ‘~로’ 구문을 택했습니다.
- source_word: תֶּהְדֹּפוּ
  english_pob_choice: you push
  chosen_korean: 밀어붙이고
  alternatives_korean:
  - 밀고
  - 떠밀고
  lexicon: הדף
  rationale: 단순한 ‘밀다’보다 적대적이고 강압적인 뉘앙스가 살아나도록 ‘밀어붙이다’로 옮겼습니다.
- source_word: בְקַרְנֵיכֶם תְנַגְּחוּ
  english_pob_choice: gore ... with your horns
  chosen_korean: 뿔로 들이받아
  alternatives_korean:
  - 뿔로 받받아
  - 뿔로 찔러
  lexicon: נגח
  rationale: נגח의 기본 의미는 ‘받다/들이받다’이므로, 공격성과 동물적 폭력을 드러내는 ‘들이받다’를 사용했습니다.
- source_word: כָּל הַנַּחְלֹות
  english_pob_choice: all the weak ones
  chosen_korean: 연약한 자들을
  alternatives_korean:
  - 약한 자들을
  - 약한 것들을
  lexicon: נחלה
  rationale: 문맥상 ‘유산/몫’보다 연약하고 힘없는 양 떼를 가리키는 표현으로 이해되어, POB의 해석을 따라 ‘연약한 자들’로 번역했습니다.
- source_word: הַחוּצָה
  english_pob_choice: outside
  chosen_korean: 밖으로
  alternatives_korean:
  - 바깥으로
  - 밖으로 내쫓아
  lexicon: חוץ
  rationale: 개정본의 ‘outside’를 직역하되, 한국어에서 자연스러운 이동 방향 표현인 ‘밖으로’를 택했습니다.
theological_decisions:
- issue: 포악한 지도자들의 폭력성과 심판 선언의 직접성
  chosen_reading: 구체적 신체 은유를 완화하지 않고, 압박과 들이받음, 흩어 버림의 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 완곡하게 ‘해치다’ 또는 ‘괴롭히다’로 일반화할 수 있음
  rationale: 본문은 목자 비유 안에서 약자를 밀쳐내고 흩어지게 한 폭력을 고발하므로, 이미지의 날카로움을 보존하는 것이 경고의 힘을 유지합니다.
  doctrine_reference: 에스겔 34장의 목자 심판 신탁
