  - 주님의 말씀
  - 하나님의 말씀
  lexicon: HALOT
  rationale: 본문의 יְהוָה를 POB의 원칙에 따라 ‘야훼’로 옮기고, 예언 공식인 ‘말씀’을 그대로 유지했습니다.
