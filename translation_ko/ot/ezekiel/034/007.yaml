lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 이러므로
  lexicon: HALOT
  rationale: 앞선 책망에서 이어지는 논리적 결론을 나타내는 연결어로, 예언 문맥에 자연스러운 ‘그러므로’가 English POB의 ‘Therefore’를 가장 잘 반영합니다.
- source_word: רֹעִים
  english_pob_choice: shepherds
  chosen_korean: 목자들
  alternatives_korean:
  - 목양자들
  - 지도자들
  - 목사들
  lexicon: HALOT
  rationale: 직역상 ‘목자들’이며, 에스겔 34장의 중심 비유를 유지해야 하므로 해석적 표현인 ‘지도자들’이나 교회 용어인 ‘목사들’로 바꾸지 않았습니다.
- source_word: שִׁמְעוּ
  english_pob_choice: hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 들어 주십시오
  - 들으세요
  lexicon: HALOT
  rationale: 예언적 공적 호소의 명령형을 한국어 합쇼체로 옮겨, POB의 ‘hear’가 가진 엄중한 청취 요구를 살렸습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 여호와의 말씀
  - 주님의 말씀
  - 하나님의 말씀
  lexicon: HALOT
  rationale: 본문의 יְהוָה를 POB의 원칙에 따라 ‘야훼’로 옮기고, 예언 공식인 ‘말씀’을 그대로 유지했습니다.
theological_decisions:
- issue: 여호와/주님 대신 יְהוָה의 고유명사 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 단순 호칭이 아니라 언약적 고유명사 יְהוָה를 직접 사용하므로, 신학적 투명성을 위해 ‘야훼’로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
