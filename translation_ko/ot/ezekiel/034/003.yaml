translation:
  language: ko
  text: 너희는 기름[a]을 먹고 양털을 입으며 살진 짐승[b]을 잡아 죽이면서도 양 떼를 치지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우유’. 일부 번역은 해석 전통이나 고대 역본의 읽기를 따르지만, 히브리어 단어는 보통 ‘기름’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘살진 것’ 또는 ‘선택된 짐승’. 히브리어는 아마도 양 떼 가운데 잘 먹은 개체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵלֶב
  english_pob_choice: the fat
  chosen_korean: 기름
  alternatives_korean:
