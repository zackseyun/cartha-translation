source:
  edition: WLC
  text: אֶת הַ/חֵ֤לֶב תֹּאכֵ֨לוּ֙ וְ/אֶת הַ/צֶּ֣מֶר תִּלְבָּ֔שׁוּ הַ/בְּרִיאָ֖ה תִּזְבָּ֑חוּ הַ/צֹּ֖אן לֹ֥א תִרְעֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/003.yaml
  text: You eat the fat[a], you clothe yourselves with the wool, you slaughter the fattened sheep[b], but you do not shepherd the flock.
  footnotes:
  - marker: a
    text: Or 'the milk'; some translations follow an interpretive tradition or ancient-version reading here, but the Hebrew word normally means 'fat.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the fat one' or 'the choice animal'; the Hebrew likely refers to the well-fed animals of the flock.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 기름을 먹으며, 양털로 몸을 입으며, 살진 짐승을 잡아 죽이면서도, 양 떼는 돌보지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우유’로 옮길 수 있습니다. 일부 번역은 해석 전통이나 고대역본을 따르지만, 히브리어 단어 자체는 보통 ‘기름’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘살진 놈’, ‘선택된 짐승’으로도 옮길 수 있습니다. 여기서는 무리 가운데 잘 먹은 개체를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵלֶב
  english_pob_choice: the fat
  chosen_korean: 기름
  alternatives_korean:
  - 지방
  - 기름진 부분
  - 우유
  lexicon: HALOT
  rationale: חֵלֶב은 보통 ‘기름, 지방’의 의미이므로, 이 문맥에서는 착취적으로 소비되는 ‘기름’을 자연스럽게 옮겼습니다. 영어 POB의 ‘the fat’에 대응하면서도 한국어에서 문맥상 가장 직접적인 감각을 살립니다.
- source_word: הַצֶּמֶר
  english_pob_choice: the wool
  chosen_korean: 양털
  alternatives_korean:
  - 털
  - 양의 털
  - 모직
  lexicon: HALOT
  rationale: צֶמֶר는 ‘양털’을 뜻하므로, 한국어에서도 구체적인 재료 이미지를 유지하는 ‘양털’이 가장 적절합니다.
- source_word: תִּלְבָּשׁוּ
  english_pob_choice: you clothe yourselves with
  chosen_korean: 몸을 입으며
  alternatives_korean:
  - 입으며
  - 걸치며
  - 옷 입으며
  lexicon: HALOT
  rationale: לָבַשׁ의 재귀적 의미를 살려, 단순히 ‘입다’보다 자기 몸에 덧입혀 이익을 취한다는 뉘앙스를 드러내는 표현으로 옮겼습니다. 다만 한국어의 자연스러움을 위해 과도하게 직역하지는 않았습니다.
- source_word: הַבְּרִיאָה
  english_pob_choice: the fattened sheep
  chosen_korean: 살진 짐승
  alternatives_korean:
  - 살진 양
  - 기름진 동물
  - 살이 오른 짐승
  lexicon: HALOT
  rationale: בריא는 ‘살진, 잘 먹은, 건강한’의 뜻이 있으며, 여기서는 무리 가운데서 골라낸 살진 개체를 가리키는 것으로 보입니다. ‘살진 짐승’은 선택된 고기용 가축의 이미지를 한국어로 무리 없이 전달합니다.
- source_word: תִּזְבָּחוּ
  english_pob_choice: you slaughter
  chosen_korean: 잡아 죽이면서도
  alternatives_korean:
  - 도살하면서도
  - 죽이며
  - 희생제물로 바치면서도
  lexicon: HALOT
  rationale: זבח은 제의적 ‘희생하다’의 뜻도 있지만, 여기서는 목자들의 폭력을 고발하는 문맥이므로 ‘잡아 죽이다’가 더 직접적입니다. 영어 POB의 ‘slaughter’와도 맞습니다.
- source_word: תִרְעוּ
  english_pob_choice: you shepherd
  chosen_korean: 돌보지 않습니다
  alternatives_korean:
  - 목양하지 않습니다
  - 양치지 않습니다
  - 먹이지 않습니다
  lexicon: HALOT
  rationale: רעה는 ‘먹이다’보다 넓게 ‘돌보다, 치다, 목양하다’의 뜻이 있어, 문맥상 핵심인 목자 책임의 부재를 한국어로 자연스럽게 드러내는 ‘돌보지 않습니다’를 택했습니다. 다만 영어 POB의 ‘shepherd’에 해당하는 목자 이미지는 문맥 전체에 유지됩니다.
theological_decisions:
- issue: 목자-양 떼 은유의 보존
  chosen_reading: ‘양 떼는 돌보지 않습니다’로 목자 은유를 직접적이되 자연스러운 한국어로 유지했습니다.
  alternative_readings:
  - 양 떼를 먹이지 않습니다
  - 양 떼를 치지 않습니다
  - 양 떼를 목양하지 않습니다
  rationale: 이 절의 책망은 지도자들이 양 떼를 돌보지 않으면서 자기 이익만 챙긴다는 대비에 달려 있으므로, 은유를 약화시키지 않는 표현을 선택했습니다.
  doctrine_reference: 'Translation philosophy #3 and #5'
