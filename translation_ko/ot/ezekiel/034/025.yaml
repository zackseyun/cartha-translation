theological_decisions:
- issue: 평화의 언약(בְּרִית שָׁלוֹם)의 의미 범위
  chosen_reading: 본문에는 '평화의 언약'을 유지하되, 그 안에 담긴 안전·온전함의 뉘앙스를 본문 밖으로 과도하게 확장하지 않았습니다.
  alternative_readings:
  - 정치적 평화만을 뜻하는 것으로 축소
  - 구원론적 축복 전체로 본문에서 확장
  rationale: שָׁלוֹם은 단순한 전쟁 부재를 넘어 안전과 온전함을 포함하지만, 본문은 그 풍성함을 언약이라는 표현 안에 유지하는 것이 가장 충실합니다.
  doctrine_reference: Translation philosophy items 1 and 3
