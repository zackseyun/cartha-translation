id: EZK.34.25
reference: Ezekiel 34:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית שָׁל֔וֹם וְ/הִשְׁבַּתִּ֥י חַיָּֽה רָעָ֖ה מִן הָ/אָ֑רֶץ וְ/יָשְׁב֤וּ בַ/מִּדְבָּר֙ לָ/בֶ֔טַח וְ/יָשְׁנ֖וּ בַּ/יְּעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/025.yaml
  text: I will make with them a covenant of peace[a], and I will remove harmful wild animals from the land[b], so that they may dwell securely in the wilderness and sleep in the forests.
  footnotes:
  - marker: a
    text: Or 'I will cause harmful wild animals to cease from the land.'
    reason: lexical_alternative
  - marker: b
    text: '''Covenant of peace'' can also imply a covenant of wholeness, well-being, and security, not merely the absence of conflict.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들과 평화의 언약을 맺겠습니다. 내가 그 땅에서 해로운 들짐승들을 없애서, 그들이 광야에 안전하게 살고 숲에서 잠들게 하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘평화의 언약’은 단지 전쟁이 없는 상태만이 아니라, 온전함·안전·안녕까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘없애다’는 여기서 해로운 들짐승들을 땅에서 없애는 결과를 자연스럽게 옮긴 말이며, 히브리어는 문자적으로는 ‘그치게 하다’의 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרַתִּי לָהֶם בְּרִית
  english_pob_choice: I will make with them a covenant
  chosen_korean: 그들과 ... 언약을 맺겠습니다
  alternatives_korean:
  - 그들과 ... 언약을 세우겠습니다
  - 그들과 ... 언약을 체결하겠습니다
  lexicon: HALOT
  rationale: כרת ברית의 관용구를 한국어의 자연스러운 언약 체결 표현으로 옮기되, 행위 주체와 대상 관계를 분명히 살렸습니다.
- source_word: בְּרִית שָׁלוֹם
  english_pob_choice: a covenant of peace
  chosen_korean: 평화의 언약
  alternatives_korean:
  - 평강의 언약
  - 평안의 언약
  - 화평의 언약
  lexicon: HALOT
  rationale: שָׁלוֹם의 넓은 의미를 살리면서도, 문맥상 언약의 성격을 유지하는 표현으로 옮겼습니다.
- source_word: חַיָּה רָעָה
  english_pob_choice: harmful wild animals
  chosen_korean: 해로운 들짐승들
  alternatives_korean:
  - 악한 짐승들
  - 위험한 짐승들
  - 해로운 야생동물
  lexicon: HALOT
  rationale: חַיָּה는 들짐승/야생 짐승이고 רָעָה는 도덕적 악보다 해로움·위험성을 가리키므로, 고어적·도덕화된 표현을 피했습니다.
- source_word: בַמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에
  alternatives_korean:
  - 광야에서
  - 들판에서
  - 사막에서
  lexicon: HALOT
  rationale: מִדְבָּר의 넓은 의미를 보존하면서, 안전하게 거주하는 역설적 이미지를 살리는 표준적 표현으로 옮겼습니다.
- source_word: בַּיְּעָרִים
  english_pob_choice: in the forests
  chosen_korean: 숲에서
  alternatives_korean:
  - 숲속에서
  - 삼림에서
  - 숲 가운데서
  lexicon: HALOT
  rationale: יְעָרִים의 수풀/산림 이미지를 현대 한국어에서 가장 자연스럽게 전달하는 말로 옮겼습니다.
theological_decisions:
- issue: 평화의 언약(בְּרִית שָׁלוֹם)의 의미 범위
  chosen_reading: 본문에는 '평화의 언약'을 유지하되, 그 안에 담긴 안전·온전함의 뉘앙스를 본문 밖으로 과도하게 확장하지 않았습니다.
  alternative_readings:
  - 정치적 평화만을 뜻하는 것으로 축소
  - 구원론적 축복 전체로 본문에서 확장
  rationale: שָׁלוֹם은 단순한 전쟁 부재를 넘어 안전과 온전함을 포함하지만, 본문은 그 풍성함을 언약이라는 표현 안에 유지하는 것이 가장 충실합니다.
  doctrine_reference: Translation philosophy items 1 and 3
