source:
  edition: WLC
  text: כֹּה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֨י אֶֽל הָ/רֹעִ֜ים וְֽ/דָרַשְׁתִּ֧י אֶת צֹאנִ֣/י מִ/יָּדָ֗/ם וְ/הִשְׁבַּתִּי/ם֙ מֵ/רְע֣וֹת צֹ֔אן וְ/לֹא יִרְע֥וּ ע֛וֹד הָ/רֹעִ֖ים אוֹתָ֑/ם וְ/הִצַּלְתִּ֤י צֹאנִ/י֙ מִ/פִּי/הֶ֔ם וְ/לֹֽא תִהְיֶ֥יןָ לָ/הֶ֖ם לְ/אָכְלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/010.yaml
  text: 'Thus says the Lord GOD: Behold[a], I am against the shepherds, and I will require my flock from their hand, and I will stop them from shepherding the flock. The shepherds will no longer shepherd them, and I will rescue my flock from their mouth[c][b], and it will no longer be food for them.'
  footnotes:
  - marker: a
    text: Hebrew 'from their hand,' an idiom of accountability and repossession.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will demand my flock from them' / 'I will call them to account for my flock.'
    reason: alternative_reading
  - marker: c
    text: Hebrew 'from their mouth,' preserving the image of the shepherds as devourers rather than protectors.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. “보라, 나는 목자들을 대적한다. 나는 그들의 손에서 내 양 떼를 요구하고, 그들이 양 떼를 치는 일을 멈추게 하겠다. 목자들은 더 이상 그들을 치지 못할 것이며, 나는 내 양 떼를 그들의 입에서 구해 내리니, 그들이 더 이상 그들의 먹이가 되지 못할 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그들의 손에서’는 책임을 묻고 다시 거두어들이는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그들의 입에서’는 목자들을 보호자가 아니라 집어삼키는 자로 묘사하는 이미지를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: דיון 복합 호칭 אֲדֹנָי יְהוִה를 한국어로는 두 요소를 모두 살려 ‘주 야훼’로 옮겼습니다. POB의 YHWH 원형 표기 원칙을 따르면서도 ‘주’로 주권 호칭을 보존합니다.
- source_word: הִנְנִי אֶל
  english_pob_choice: Behold, I am against
  chosen_korean: 보라, 나는 ...를 대적한다
  alternatives_korean:
  - 보라, 나는 ...에 대하여 있다
  - 보라, 나는 ...을 향한다
  lexicon: HALOT
  rationale: 예언적 선언의 긴박함과 적대적 방향성을 살리기 위해 ‘대적한다’를 택했습니다. ‘보라’는 הִנְנִי의 경고적 도입을 자연스럽게 전합니다.
- source_word: וְדָרַשְׁתִּי אֶת צֹאנִי מִיָּדָם
  english_pob_choice: I will require my flock from their hand
  chosen_korean: 내 양 떼를 그들의 손에서 요구하고
  alternatives_korean:
  - 내 양 떼를 그들의 손에서 되찾고
  - 내 양 떼를 그들에게서 책임을 묻고
  lexicon: HALOT
  rationale: ‘from their hand’의 관용적 책임·회수 이미지를 그대로 살리기 위해 ‘손에서 요구하고’로 옮겼습니다. POB의 ‘require’ 선택을 한국어에서도 법정적·회수적 뉘앙스로 유지합니다.
- source_word: וְהִשְׁבַּתִּי/ם מֵרְעוֹת צֹאן
  english_pob_choice: I will stop them from shepherding the flock
  chosen_korean: 그들이 양 떼를 치는 일을 멈추게 하겠다
  alternatives_korean:
  - 그들이 양 떼를 돌보는 일을 멈추게 하겠다
  - 그들을 양 떼를 먹이는 일에서 그치게 하겠다
  lexicon: HALOT
  rationale: רעה의 목양 이미지를 보존하면서도 한국어에서 반복을 지나치게 어색하게 만들지 않도록 ‘양 떼를 치다’를 사용했습니다.
- source_word: וְהִצַּלְתִּי צֹאנִי מִפִּיהֶם
  english_pob_choice: I will rescue my flock from their mouth
  chosen_korean: 내 양 떼를 그들의 입에서 구해 내리니
  alternatives_korean:
  - 내 양 떼를 그들의 입에서 건져 내리니
  - 내 양 떼를 그들의 이빨에서 구해 내리니
  lexicon: HALOT
  rationale: ‘mouth’의 포식자 이미지를 보존하기 위해 직역에 가깝게 ‘입에서’로 유지했습니다. ‘구해 내리니’는 עתיד적 구원 행동을 자연스럽게 전달합니다.
theological_decisions:
- issue: 야훼의 호칭 표기
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 원문은 אֲדֹנָי와 YHWH를 함께 사용합니다. 한국어 본문에서 ‘주’와 고유명 표기를 함께 두어 두 호칭 요소를 모두 드러내는 것이 source-direct합니다.
  doctrine_reference: 'POB contested terms: YHWH = 야훼; compound divine title rendering'
- issue: 목자 비유의 보존
  chosen_reading: 목자들을 대적한다 / 양 떼를 치는 일을 멈추게 하겠다
  alternative_readings:
  - 지도자들을 대적한다
  - 돌보는 일을 멈추게 하겠다
  rationale: 에스겔 34장의 핵심은 지도자 해석보다 목자 은유 자체에 있습니다. 본문이 유지하는 비유를 풀어버리지 않고 그대로 살렸습니다.
  doctrine_reference: Ezekiel 34 metaphor and shepherd imagery
