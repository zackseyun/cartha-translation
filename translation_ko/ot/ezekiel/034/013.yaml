  text: וְ/הוֹצֵאתִ֣י/ם מִן הָ/עַמִּ֗ים וְ/קִבַּצְתִּי/ם֙ מִן הָ֣/אֲרָצ֔וֹת וַ/הֲבִיאֹתִ֖י/ם אֶל אַדְמָתָ֑/ם וּ/רְעִיתִי/ם֙ אֶל הָרֵ֣י יִשְׂרָאֵ֔ל בָּ/אֲפִיקִ֕ים וּ/בְ/כֹ֖ל מוֹשְׁבֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/013.yaml
  text: And I will bring them out from the peoples[a], and gather them from the lands, and bring them into their own land; and I will pasture them on the mountains of Israel, by the streams, and in all the inhabited places of the land.
  footnotes:
  - marker: a
    text: Or 'by the watercourses,' 'in the ravines,' or 'in the channels.' The Hebrew term can refer to streambeds or ravines.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 민족들 가운데서 이끌어 내고, 여러 땅들에서 모아 그들의 땅으로 데려오겠습니다. 내가 그들을 이스라엘의 산들 위와 시내들 곁과 그 땅의 모든 거주지에서 먹이겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אפיקים는 시내, 물길, 골짜기, 수로를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתִים / הָעַמִּים
  english_pob_choice: I will bring them out from the peoples
  chosen_korean: 그들을 민족들 가운데서 이끌어 내고
  alternatives_korean:
  - 백성들 가운데서 데리고 나오고
  - 민족들 가운데서 데려오고
  lexicon: HALOT
  rationale: 출애굽을 연상시키는 강한 동사 הוציא의 사역적 의미를 살리면서, עמים는 여기서 이스라엘이 흩어진 여러 민족 집단을 가리키므로 '민족들 가운데서'로 옮겼습니다.
- source_word: וְקִבַּצְתִּים / הָאֲרָצוֹת
  english_pob_choice: gather them from the lands
  chosen_korean: 여러 땅들에서 모아
  alternatives_korean:
  - 여러 나라들에서 모아
  - 각 땅에서 모아
  lexicon: HALOT
  rationale: קבץ의 흩어진 자들을 다시 모으는 의미를 살려 '모아'로 옮겼고, ארצות의 복수성을 살리기 위해 단수의 '땅'보다 '여러 땅들'을 택했습니다.
- source_word: וַהֲבִיאֹתִים / אַדְמָתָם
  english_pob_choice: bring them into their own land
  chosen_korean: 그들의 땅으로 데려오겠습니다
  alternatives_korean:
  - 그들의 본래 땅으로 데려오겠습니다
  - 그들 자신의 땅으로 데려오겠습니다
  lexicon: HALOT
  rationale: ביא의 인도·도입 의미를 자연스럽게 살려 '데려오겠습니다'로 옮겼고, אדמתם의 소유격은 문맥상 회복된 귀환의 대상이므로 간결하게 '그들의 땅'으로 표현했습니다.
- source_word: וּרְעִיתִים / אֶל הָרֵי יִשְׂרָאֵל / בָּאֲפִיקִים / וּבְכֹל מוֹשְׁבֵי הָאָרֶץ
  english_pob_choice: I will pasture them on the mountains of Israel, by the streams, and in all the inhabited places of the land
  chosen_korean: 내가 그들을 이스라엘의 산들 위와 시내들 곁과 그 땅의 모든 거주지에서 먹이겠습니다
  alternatives_korean:
  - 내가 그들을 이스라엘의 산들에서, 물길들 곁과 그 땅의 모든 거주지에서 먹이겠습니다
  - 내가 그들을 이스라엘의 산들 위에서, 골짜기들 곁과 그 땅의 모든 거주지에서 먹이겠습니다
  lexicon: HALOT
  rationale: רעה는 목양의 '먹이다/목양하다' 둘 다 가능하지만, 이어지는 지형 묘사와의 결합을 고려해 '먹이겠습니다'를 택했습니다. אפיקים은 시내·물길·골짜기·수로를 포함할 수 있으므로 본문 의미를 넓게 담는 '시내들 곁'으로 처리했습니다.
theological_decisions:
- issue: 회복 예언에서 반복되는 주어 '내가'의 강조
  chosen_reading: 하나님이 직접 흩어진 백성을 찾아 모으고 먹이시는 주체로 드러나게 했습니다.
  alternative_readings:
  - 수동적으로 '그들이 돌아오게 될 것입니다'로 완화하는 방식
  - 인간의 귀환 행위를 중심으로 재배열하는 방식
  rationale: 히브리어 동사 연쇄는 야훼의 적극적 주도권을 강조하므로, 이를 유지해야 회복의 신학이 흐려지지 않습니다.
  doctrine_reference: Ezekiel 34의 목자-회복 모티프; divine agency in restoration
