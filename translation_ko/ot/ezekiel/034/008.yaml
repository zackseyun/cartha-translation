  text: חַי אָ֜נִי נְאֻ֣ם אֲדֹנָ֣/י יְהוִ֗ה אִם לֹ֣א יַ֣עַן הֱיֽוֹת צֹאנִ֣/י לָ/בַ֡ז וַ/תִּֽהְיֶינָה֩ צֹאנִ֨/י לְ/אָכְלָ֜ה לְ/כָל חַיַּ֤ת הַ/שָּׂדֶה֙ מֵ/אֵ֣ין רֹעֶ֔ה וְ/לֹֽא דָרְשׁ֥וּ רֹעַ֖/י אֶת צֹאנִ֑/י וַ/יִּרְע֤וּ הָֽ/רֹעִים֙ אוֹתָ֔/ם וְ/אֶת צֹאנִ֖/י לֹ֥א רָעֽוּ־׀־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/008.yaml
  text: As I live[a], declares the Lord GOD, surely because my flock has become plunder and my flock has become food for every wild beast of the field, since there was no shepherd, and my shepherds did not seek my flock[b], but the shepherds fed themselves and did not feed my flock—
  footnotes:
  - marker: a
    text: Hebrew 'prey' is also possible for 'plunder.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the shepherds pastured themselves.' The Hebrew idiom means they cared for their own interests rather than the flock.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 살아 있음을 두고 맹세합니다— 주 하나님이 말씀하십니다. 진실로 내 양 떼가 노획물이 되었고, 내 양 떼가 들의 모든 들짐승의 먹이가 되었으니, 이는 목자가 없기 때문이며, 내 목자들이 내 양 떼를 찾지 않았고, 목자들은 자기들만 먹이고 내 양 떼는 먹이지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '노획물' 또는 '먹이감'의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '목자들이 자기들을 먹였다'입니다. 여기서는 자기 이익만 챙겼다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  english_pob_choice: As I live
  chosen_korean: 내가 살아 있음을 두고 맹세합니다
  alternatives_korean:
  - 내가 살아 있는 한
  - 내 생명을 두고 맹세합니다
  lexicon: HALOT
  rationale: 히브리어 맹세 서두의 엄숙한 자기맹세를 살리기 위해, 단순한 현재 진술보다 맹세 성격이 드러나는 표현으로 옮겼습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님이 말씀하십니다
  alternatives_korean:
  - 주 여호와께서 말씀하십니다
  - 주 야훼 하나님께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언 공식의 נְאֻם은 '말씀하십니다'로, אֲדֹנָי יְהוִה는 한국어에서 자연스럽고 장엄한 호칭인 '주 하나님'으로 옮겨 중복을 피했습니다.
- source_word: לָבַז
  english_pob_choice: plunder
  chosen_korean: 노획물
  alternatives_korean:
  - 약탈물
  - 전리품
  lexicon: HALOT
  rationale: 피해를 입은 양 떼가 강제로 빼앗긴 상태를 드러내기 위해 '노획물'을 택했습니다. '먹이' 이미지와도 구분이 분명합니다.
- source_word: לְאָכְלָה לְכָל חַיַּת הַשָּׂדֶה
  english_pob_choice: food for every wild beast of the field
  chosen_korean: 들의 모든 들짐승의 먹이
  alternatives_korean:
  - 들의 모든 짐승의 먹이
  - 들판의 모든 야수의 먹이
  lexicon: HALOT
  rationale: 예언서의 격식을 살리면서도 자연스러운 한국어가 되도록, 'wild beast of the field'는 '들의 모든 들짐승'으로 옮겼습니다.
- source_word: וַיִּרְעוּ הָרֹעִים אוֹתָם
  english_pob_choice: the shepherds fed themselves
  chosen_korean: 목자들은 자기들만 먹이고
  alternatives_korean:
  - 목자들은 스스로를 먹이고
  - 목자들은 자기 배만 채우고
  lexicon: HALOT
  rationale: 히브리어 관용구가 목자들의 사적 이익 추구를 뜻하므로, 직역보다 한국어에서 같은 비판 효과를 주는 표현으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 여호와
  - 주 야훼
  rationale: 이 절의 문맥은 맹세와 선포 공식이 핵심이므로, 본문 안에서는 직함 중심의 표현을 유지해 예언적 장엄함과 한국어 가독성을 함께 살렸습니다.
  doctrine_reference: POB Korean divine-name policy (YHWH rendering)
