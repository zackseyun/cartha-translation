  - marker: b
    text: 히브리어는 직역하면 ‘노략물/약탈물’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשַׁעְתִּי
  english_pob_choice: I will save
  chosen_korean: 구할 것이며
  alternatives_korean:
  - 구원할 것이며
  - 건져낼 것이며
  lexicon: HALOT
  rationale: 히필형 ישׁע는 야훼의 능동적 구출을 가리키므로, ‘구하다’가 ‘save’의 핵심 의미와 구속적 무게를 함께 살립니다.
- source_word: לְצֹאנִי
  english_pob_choice: my flock
  chosen_korean: 내 양 떼
  alternatives_korean:
  - 내 양 무리
  - 내 양들
  lexicon: HALOT
  rationale: צֹאן은 집합적 ‘무리’를 뜻하므로, 목자 비유에 자연스러운 ‘양 떼’가 개별 양보다 원문 감각을 더 잘 드러냅니다.
- source_word: וְלֹא תִהְיֶינָה עוֹד לָבַז
  english_pob_choice: and they will no longer be prey
  chosen_korean: 그들은 다시는 노략물이 되지 않을 것입니다
  alternatives_korean:
  - 그들은 다시는 약탈의 대상이 되지 않을 것입니다
  - 그들은 다시는 노획물이 되지 않을 것입니다
  lexicon: HALOT
  rationale: לָבַז는 ‘노략/약탈의 대상’이라는 뜻이므로, 영어의 ‘prey’를 그대로 옮기기보다 ‘노략물’로 번역해 약탈당하는 처지를 분명히 했습니다.
- source_word: בֵּין שֶׂה לָשֶׂה
  english_pob_choice: between sheep and sheep
  chosen_korean: 양과 양 사이를
  alternatives_korean:
  - 한 양과 다른 양 사이를
  - 양들 사이를
  lexicon: HALOT
  rationale: 히브리어의 반복형은 무리 안의 개체들 사이를 가리키는 분배적 표현이므로, 반복을 살리되 한국어에서는 자연스럽게 ‘양과 양 사이’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 직접적 구원 행위와 목자 비유
  chosen_reading: 내가 내 양 떼를 구할 것이며
  alternative_readings:
  - 내가 내 양 떼를 건져낼 것이며
  - 내가 내 양 떼를 구원할 것이며
  rationale: 본문은 야훼가 목자로서 자기 양 떼를 직접 구출하는 장면이므로, ‘구하다’가 서술의 힘과 신학적 무게를 함께 유지합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological weight without paraphrase.'
- issue: 무리 안에서의 판결이라는 긴장
  chosen_reading: 내가 양과 양 사이를 판결하겠습니다
  alternative_readings:
  - 내가 한 양과 다른 양 사이를 판결하겠습니다
  rationale: 본문은 외부 적대자만이 아니라 무리 내부의 구성원들 사이를 판결하시는 하나님을 말하므로, 구원과 심판의 긴장을 함께 보존해야 합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
