  rationale: 본문은 야훼가 목자로서 자기 양 떼를 직접 구출하는 장면이므로, ‘구하다’가 서술의 힘과 신학적 무게를 함께 유지합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological weight without paraphrase.'
- issue: 무리 안에서의 판결이라는 긴장
  chosen_reading: 내가 양과 양 사이를 판결하겠습니다
  alternative_readings:
  - 내가 한 양과 다른 양 사이를 판결하겠습니다
  rationale: 본문은 외부 적대자만이 아니라 무리 내부의 구성원들 사이를 판결하시는 하나님을 말하므로, 구원과 심판의 긴장을 함께 보존해야 합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
