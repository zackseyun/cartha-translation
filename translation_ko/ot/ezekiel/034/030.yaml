  naturalness: ‘나 야훼, 곧 그들의 하나님이’ 및 ‘그들 곧 이스라엘 집이’로 동격 관계를 명확히 하면 현대 표준 한국어의 격식 있는 문체에서 자연스럽고 의미도 분명해집니다. 예언자적 종결 공식은 ‘주 야훼의 말씀입니다’로 옮기는 편이 נְאֻם의 공식성과 합쇼체 문체를 자연스럽게 살립니다.
  terminology: יהוה는 ‘야훼’, אֲדֹנָי יְהוִה는 ‘주 야훼’로 구별한 선택은 적절합니다. ‘이스라엘 집’과 ‘내 백성’도 원문의 집합적·언약적 표현을 충실히 보존합니다.
