translation:
  language: ko
  text: 그들은 내가, 야훼, 그들의 하나님이 그들과 함께 있음을, 또 이스라엘 집 곧 그들이 내 백성임을 알게 될 것입니다. 주 야훼께서 선언하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 가운데’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  english_pob_choice: And they will know
  chosen_korean: 그들은 … 알게 될 것입니다
  alternatives_korean:
  - 그들은 … 알 것입니다
  - 그들은 … 알게 되리라
  lexicon: HALOT
  rationale: 예언적 미래를 현대 한국어의 자연스러운 미래 표현으로 옮기되, 단순한 정보 습득이 아니라 인식의 도달을 드러내기 위해 ‘알게 될 것입니다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 POB 원칙에 따라 고유명사로 보존하여 ‘야훼’로 옮겼습니다.
- source_word: אִתָּם
  english_pob_choice: am with them
  chosen_korean: 그들과 함께 있음을
  alternatives_korean:
  - 그들 가운데 있음을
  - 그들 중에 있음을
  lexicon: HALOT
  rationale: 전치사 עִם의 기본 의미를 살려 ‘함께’로 옮기고, 언약적 임재의 뉘앙스를 과도하게 해석하지 않도록 했습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘의 집
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 예언서의 고정 표현을 유지하되 한국어 어순에 맞게 ‘이스라엘 집’으로 옮겨 집합적·언약적 의미를 보존했습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 야훼께서 선언하십니다
  alternatives_korean:
  - 주 하나님 야훼께서 말씀하십니다
  - 주 하나님께서 선언하십니다
  lexicon: HALOT
  rationale: 예언자적 공식을 현대적 문체로 살리면서, אדני + יהוה의 중첩을 ‘주 야훼’로 간결하게 처리했습니다.
theological_decisions:
- issue: יהוה와 אדני יהוה의 이중 표지 처리
  chosen_reading: ‘야훼’와 ‘주 야훼’로 구분해 표기했습니다.
  alternative_readings:
  - ‘여호와’와 ‘주 여호와’
  - ‘주 하나님’
  rationale: 본문은 단독 Tetragrammaton과 ‘주 + Tetragrammaton’ 공식을 함께 쓰므로, 두 층위를 모두 보이게 하되 한국어에서 중복이 과도하지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה YHWH → Yahweh
