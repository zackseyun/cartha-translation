  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶת הָ/אֹבֶ֤דֶת אֲבַקֵּשׁ֙ וְ/אֶת הַ/נִּדַּ֣חַת אָשִׁ֔יב וְ/לַ/נִּשְׁבֶּ֣רֶת אֶחֱבֹ֔שׁ וְ/אֶת הַ/חוֹלָ֖ה אֲחַזֵּ֑ק וְ/אֶת הַ/שְּׁמֵנָ֧ה וְ/אֶת הַ/חֲזָקָ֛ה אַשְׁמִ֖יד אֶרְעֶ֥/נָּה בְ/מִשְׁפָּֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/016.yaml
  text: I will seek the lost[a], and I will bring back the strayed, and I will bind up the injured, and I will strengthen the sick; but the fat and the strong I will destroy. I will shepherd them with justice.
  footnotes:
  - marker: a
    text: Or, "I will feed them in justice" or "I will pasture them with justice." The Hebrew verb can mean feed, pasture, or shepherd.
    reason: lexical_alternative
translation:
  language: ko
  text: 잃어버린 자를 내가 찾고, 흩어진 자를 내가 데려오며, 상한 자를 내가 싸매고, 병든 자를 내가 강하게 하겠습니다. 그러나 살찐 자와 강한 자는 내가 멸하겠습니다. 나는 그들을 정의로 치리하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “정의로 그들에게 먹이를 주겠습니다” 또는 “정의로 그들을 목양하겠습니다.” 히브리어 동사 רעה는 먹이다, 먹이를 주다, 목양하다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹבֶדֶת / אֲבַקֵּשׁ
  english_pob_choice: the lost / I will seek
  chosen_korean: 잃어버린 자를 내가 찾고
  alternatives_korean:
  - 잃은 자를 내가 찾고
  - 잃어버린 양을 내가 찾고
  lexicon: HALOT
  rationale: אבד와 בקש의 대응을 살리되, 목자 문맥에서 자연스러운 동작으로 ‘찾다’를 택했습니다. ‘양’을 덧붙이지 않아 원문이 말하는 집합적 표현을 유지했습니다.
- source_word: הַנִּדַּחַת / אָשִׁיב
  english_pob_choice: the strayed / I will bring back
  chosen_korean: 흩어진 자를 내가 데려오며
  alternatives_korean:
  - 떠나간 자를 내가 돌이키며
  - 길 잃은 자를 내가 데려오며
  lexicon: HALOT
  rationale: נדח의 핵심인 ‘밀려나 흩어짐’을 살려 ‘흩어진 자’로 옮겼고, שוב의 사역적 뉘앙스를 목자의 회수 행동에 맞게 ‘데려오다’로 풀었습니다.
- source_word: לַנִּשְׁבֶּרֶת / אֶחֱבֹשׁ
  english_pob_choice: the injured / I will bind up
  chosen_korean: 상한 자를 내가 싸매고
  alternatives_korean:
  - 부상한 자를 내가 싸매고
  - 깨진 자를 내가 감싸고
  lexicon: HALOT
  rationale: שבר의 ‘부서짐/상함’을 사람·양의 비유에 맞는 ‘상한 자’로 옮기고, חבש는 치료 이미지를 직접 드러내는 ‘싸매다’로 번역했습니다.
- source_word: הַחוֹלָה / אֲחַזֵּק
  english_pob_choice: the sick / I will strengthen
  chosen_korean: 병든 자를 내가 강하게 하겠습니다
  alternatives_korean:
  - 아픈 자를 내가 강하게 하겠습니다
  - 약한 자를 내가 굳세게 하겠습니다
  lexicon: HALOT
  rationale: חלה는 ‘병든’이 가장 직접적이며, חזק은 회복의 결과를 분명히 드러내는 ‘강하게 하다’가 적절합니다.
- source_word: הַשְּׁמֵנָה וְאֶת הַחֲזָקָה / אַשְׁמִיד
  english_pob_choice: the fat and the strong I will destroy
  chosen_korean: 살찐 자와 강한 자는 내가 멸하겠습니다
  alternatives_korean:
  - 기름진 자와 강한 자는 내가 멸하겠습니다
  - 비대한 자와 강한 자는 내가 없애겠습니다
  lexicon: HALOT
  rationale: ‘fat’의 사회적·도덕적 날카로움을 살리기 위해 ‘살찐 자’를 택했고, אַשְׁמִיד는 심판의 강도를 유지하는 ‘멸하다’로 옮겼습니다.
- source_word: אֶרְעֶנָּה בְמִשְׁפָּט
  english_pob_choice: I will shepherd them with justice
  chosen_korean: 나는 그들을 정의로 치리하겠습니다
  alternatives_korean:
  - 나는 그들을 정의로 돌보겠습니다
  - 나는 그들을 공의로 먹이겠습니다
  lexicon: HALOT
  rationale: רעה의 목자적 통치 의미를 ‘치리하다’로 넓게 살렸고, מִשְׁפָּט은 단순한 처벌이 아니라 공정한 통치를 가리키므로 ‘정의로’가 자연스럽습니다.
theological_decisions:
- issue: 마지막 절의 רעה(목자 됨)와 מִשְׁפָּט(정의/심판)의 긴장
  chosen_reading: ‘나는 그들을 정의로 치리하겠습니다’로, 돌봄과 심판을 함께 보존했습니다.
  alternative_readings:
  - ‘나는 그들을 정의로 먹이겠습니다’
  - ‘나는 그들을 공의로 목양하겠습니다’
  rationale: 이 절은 상처 입은 자를 회복시키는 은혜와, 살찐 자와 강한 자를 제거하는 심판을 함께 말합니다. ‘치리하다’는 목자-통치 이미지를 유지하면서 משפט의 통치적·법정적 무게도 함께 드러냅니다.
  doctrine_reference: Translation philosophy §3 (신학적 긴장을 해소하지 말고 보존하기)
