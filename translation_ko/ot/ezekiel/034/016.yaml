  source_fidelity: 앞부분은 히브리어의 연속된 목자 행동(찾다, 돌아오게 하다, 싸매다, 강하게 하다)과 심판 선언을 충실히 옮겼습니다. 다만 마지막 אֶרְעֶנָּה는 기본적으로 ‘먹이다/목양하다/목자로 돌보다’라는 목자 비유를 유지하는 동사이므로, ‘치리하다’만으로 번역하면 목양의 구체적 이미지가 약해지고 통치 의미가 과도하게 전면화됩니다. ‘정의로 목양하겠습니다’가 משפט의 공정한 বিচার·정의의 의미와 목자 비유를 함께 보존합니다.
