  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/צֹאנִ֑/י מִרְמַ֤ס רַגְלֵי/כֶם֙ תִּרְעֶ֔ינָה וּ/מִרְפַּ֥שׂ רַגְלֵי/כֶ֖ם תִּשְׁתֶּֽינָה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/019.yaml
  text: And my flock must graze on what your feet have trampled[b][a], and drink what your feet have muddied.
  footnotes:
  - marker: a
    text: Or 'my sheep' for 'my flock.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'graze from the trampling of your feet ... drink from the muddied/stirred-up water of your feet.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 양 떼는 여러분 발에 밟혀 짓밟힌 곳에서 풀을 뜯고, 여러분 발에 흐려진 것을 마시게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “너희 발의 짓밟음에서”입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “너희 발의 흐려진/휘저어진 것에서”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצֹאנִי
  english_pob_choice: And my flock
  chosen_korean: 내 양 떼
  alternatives_korean:
  - 내 양 떼
  - 내 양들
  lexicon: HALOT
  rationale: צֹאן은 개체보다 집합성을 지닌 가축 떼이므로, 문맥의 목자 비유를 살려 ‘양 떼’로 옮겼습니다. 1인칭 소유는 ‘내’로 반영했습니다.
- source_word: מִרְמַס רַגְלֵיכֶם
  english_pob_choice: on what your feet have trampled
  chosen_korean: 여러분 발에 밟혀 짓밟힌 곳에서
  alternatives_korean:
  - 여러분 발에 짓밟힌 것에서
  - 여러분 발이 밟아 놓은 곳에서
  lexicon: HALOT
  rationale: מִרְמַס는 ‘짓밟힌 자리/것’의 뜻이므로, 먹을 곳이 훼손된 이미지를 살려 ‘밟혀 짓밟힌 곳’으로 풀었습니다.
- source_word: תִּרְעֶינָה
  english_pob_choice: must graze
  chosen_korean: 풀을 뜯고
  alternatives_korean:
  - 풀을 뜯게 되고
  - 먹게 되고
  lexicon: HALOT
  rationale: 동사는 목축 맥락의 기본 의미인 ‘풀을 뜯다’로 옮겨 구체성을 살렸고, 영어 POB의 결과적 뉘앙스는 문장 전체로 드러나게 했습니다.
- source_word: וּמִרְפַּשׂ רַגְלֵיכֶם
  english_pob_choice: what your feet have muddied
  chosen_korean: 여러분 발에 흐려진 것
  alternatives_korean:
  - 여러분 발에 흐려진 물
  - 여러분 발이 더럽힌 것
  lexicon: HALOT
  rationale: מִרְפָּשׂ는 물을 휘저어 탁하게 만든 상태를 가리키므로, 단순한 ‘더럽히다’보다 물의 탁해짐을 드러내는 ‘흐려진’이 문맥에 더 가깝습니다.
theological_decisions:
- issue: 심판 맥락에서 약자들이 희생되는 이미지의 보존
  chosen_reading: 문장을 부드럽게 일반화하지 않고, 짓밟힌 땅과 흐려진 물이라는 구체적 피해를 그대로 살렸습니다.
  alternative_readings:
  - ‘좋은 풀밭’처럼 완곡하게 옮김
  - ‘더러운 물’로 도덕화하여 단순화함
  rationale: 이 절은 부당한 목자/양의 비유 속에서 약자들이 실제로 겪는 훼손을 고발하므로, 이미지의 날카로움을 유지하는 것이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 예언서의 심판 선언과 사회적 책임
- issue: 주어-목적어 관계의 명료화
  chosen_reading: ‘내 양 떼’가 ‘풀을 뜯고 마시는’ 주체임을 한국어 어순으로 분명히 했습니다.
  alternative_readings:
  - 주체를 생략하여 모호하게 표현
  - 수동형으로 바꿔 행위의 결과를 약화
  rationale: 히브리어의 복수 여성형 동사와 소유격이 가리키는 집합체를 한국어에서는 명시적으로 제시해야 의미가 흐려지지 않습니다.
  doctrine_reference: 원문 의미의 명시적 전달
