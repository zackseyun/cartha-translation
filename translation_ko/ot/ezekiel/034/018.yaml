base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/018.yaml
  text: Is it too little for you to graze on the good pasture[a], that you must trample the rest of your pastures with your feet, and to drink clear water[b], that you must muddy what remains with your feet?
  footnotes:
  - marker: a
    text: Or 'settled water,' that is, water left undisturbed and therefore clear.
    reason: lexical_alternative
  - marker: b
    text: Or 'foul' or 'stir up' what remains; the Hebrew verb refers to making the water muddy with the feet.
    reason: lexical_alternative
translation:
  language: ko
  text: 좋은 목초지에서 먹는 것이 너희에게는 작은 일이냐? 너희가 발로 남은 너희 목초지를 짓밟고, 맑은 물을 마시면서도 남은 것을 발로 흐리게 하려느냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘목초지’는 מִרְעֶה의 기본적 뜻인 pasture를 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: הַמְעַט מִכֶּם
  english_pob_choice: Is it too little for you
  chosen_korean: 너희에게는 작은 일이냐
  alternatives_korean:
  - 너희에게는 충분하지 않으냐
  - 너희에게는 너무 적으냐
  lexicon: HALOT
  rationale: 수사적 책망을 살리기 위해 직역보다 한국어로 자연스러운 반문형을 택했습니다.
- source_word: הַמִּרְעֶה הַטּוֹב
  english_pob_choice: the good pasture
  chosen_korean: 좋은 목초지
  alternatives_korean:
  - 좋은 풀밭
  - 좋은 초지
  lexicon: HALOT
  rationale: מִרְעֶה의 목양 이미지를 살리면서 현대 한국어에서 이해하기 쉬운 표현으로 옮겼습니다.
- source_word: וְיֶתֶר מִרְעֵיכֶם
  english_pob_choice: the rest of your pastures
  chosen_korean: 남은 너희 목초지
  alternatives_korean:
  - 너희 목초지의 나머지
  - 남은 너희 초지
  lexicon: HALOT
  rationale: 히브리어 복수 감각을 유지해 ‘너희 목초지’로 옮기되, 남은 부분이라는 뜻을 앞에 두었습니다.
- source_word: תִּרְפֹּשׂוּן
  english_pob_choice: you must muddy what remains
  chosen_korean: 남은 것을 발로 흐리게 하려느냐
  alternatives_korean:
  - 남은 것을 발로 진흙탕으로 만들려느냐
  - 남은 것을 발로 흐트러뜨리려느냐
  lexicon: HALOT
  rationale: 발로 물을 탁하게 만드는 동작을 ‘흐리게 하다’로 자연스럽게 표현해, POB의 ‘muddy’에 해당하는 의미를 살렸습니다.
theological_decisions:
- issue: 수사적 질문의 책망 강도
  chosen_reading: 두 개의 반문을 모두 살려, 이미 충분한 것을 누리면서도 남은 것을 망가뜨리는 비난의 어조를 유지했습니다.
  alternative_readings:
  - 단순 서술형으로 완화하는 번역
  - 더 직접적인 꾸짖음 표현으로 강화하는 번역
  rationale: 본문은 논평이 아니라 선지자적 책망이므로, 독자가 불편함까지 느끼도록 하는 원래의 수사적 압박을 보존했습니다.
  doctrine_reference: 예언서의 책망 수사
