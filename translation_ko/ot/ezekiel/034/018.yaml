revisions:
- from: 좋은 목초지에서 먹는 것이 너희에게는 작은 일이냐? 너희가 발로 남은 너희 목초지를 짓밟고, 맑은 물을 마시면서도 남은 것을 발로 흐리게 하려느냐?[a]
  to: 좋은 목초지에서 풀을 뜯는 것만으로는 너희에게 부족하냐? 그런데도 너희 목초지의 나머지는 발로 짓밟고, 맑은 물[a]을 마시면서도 남은 물은 발로 탁하게 하느냐?[b]
  rationale: 수사적 책망의 구조를 유지하면서, 목양 이미지에는 ‘풀을 뜯다’를 사용하고 물의 대상은 ‘남은 물’로 명시했습니다. ‘발로 탁하게 하다’는 물을 발로 저어 흐리게 만드는 히브리어 동작을 자연스러운 현대 한국어로 재현합니다. 각주는 실제 어휘적 대안과 본문의 해당 표지에 맞추어 교체했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:44:33Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 목초지에서 먹고 남은 목초지를 짓밟으며 물을 흐리게 한다는 핵심 의미를 대체로 전달합니다. 그러나 ‘남은 것을’은 문맥상 남은 물을 가리키므로 명시하는 편이 정확하며, 두 대조 절의 연결도 더 분명히 해야 합니다. מִרְעֵיכֶם의 복수형은 한국어에서 집합적으로 ‘너희 목초지의 나머지’로 자연스럽게 반영할 수 있습니다.
  naturalness: ‘좋은 목초지에서 먹는 것’보다 양의 목양 비유에 맞는 ‘풀을 뜯는 것’이 자연스럽습니다. ‘좋은 목초지에서 풀을 뜯는 것만으로는 너희에게 부족하냐?’와 ‘그런데도’의 연결은 책망하는 수사 질문을 현대 표준어 합쇼체로 매끄럽게 재현합니다.
  terminology: ‘목초지’, ‘풀을 뜯다’, ‘맑은 물’, ‘발로 탁하게 하다’는 목양·물의 이미지를 명료하게 유지합니다. מִשְׁקַע מַיִם은 ‘맑은 물’로 옮기되 ‘가라앉아 맑아진 물’이라는 어휘적 가능성을 각주로 보완합니다. תִּרְפֹּשׂוּן은 단순히 ‘흐리게’ 하기보다 물을 발로 저어 탁하게 만드는 뜻이므로 ‘탁하게 하다’가 더 구체적입니다.
  issues:
