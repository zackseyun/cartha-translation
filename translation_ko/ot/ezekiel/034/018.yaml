    issue: ‘남은 것을’의 지시 대상이 불명확합니다.
    rationale: הַנּוֹתָרִים는 바로 앞의 물과 연결되어 남아 있는 물을 가리킵니다. 한국어에서는 ‘남은 물’을 밝혀야 목초지의 나머지와 혼동되지 않습니다.
  - severity: medium
    issue: 각주 표지가 어휘상 논쟁점에 연결되어 있지 않고, 현 각주 내용은 번역 이해에 실질적으로 기여하지 않습니다.
    rationale: ‘목초지’의 기본 뜻을 설명하는 각주는 불필요한 반면, מִשְׁקַע מַיִם 및 תִּרְפֹּשׂוּן의 의미 범위는 본문 표현과 직접 연결된 각주로 제시하는 것이 적절합니다.
