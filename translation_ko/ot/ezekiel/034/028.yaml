translation:
  language: ko
  text: 그들은 더 이상 나라들의 노략물[a]이 되지 않을 것이며, 땅의 들짐승[b]이 그들을 먹어 치우지 않을 것입니다. 그들은 안전하게 살 것이며, 그들을 두렵게 할 자가 없을 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나라들의 먹잇감’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅의 짐승들’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들은 안전히 살 것이며, 그들을 두렵게 할 자가 없을 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּז / plunder for the nations
  english_pob_choice: plunder for the nations
  chosen_korean: 나라들의 노략물
  alternatives_korean:
  - 나라들의 먹잇감
  - 열방의 노획물
  lexicon: HALOT
  rationale: בַּז는 강제로 빼앗긴 전리품·노략물을 뜻하므로, ‘노략물’이 인간에 의한 약탈 상황을 가장 직접적으로 드러냅니다. גּוֹיִם은 이 문맥에서 ‘열방’보다 중립적인 ‘나라들’이 자연스럽습니다.
- source_word: חַיַּת הָאָרֶץ / the wild animals of the land
  english_pob_choice: the wild animals of the land
  chosen_korean: 땅의 들짐승
  alternatives_korean:
  - 땅의 야생 동물
  - 땅의 짐승
  lexicon: HALOT
  rationale: חַיַּת הָאָרֶץ는 문자적으로 땅의 야생 짐승들을 가리키므로, ‘들짐승’이 현대 한국어에서 가장 간결하고 생생합니다.
- source_word: תֹאכְלֵם / will not devour them
  english_pob_choice: will not devour them
  chosen_korean: 그들을 먹어 치우지 않을 것입니다
  alternatives_korean:
  - 그들을 먹지 않을 것입니다
  - 그들을 삼키지 않을 것입니다
  lexicon: HALOT
  rationale: 동사는 원뜻이 ‘먹다’이지만, 맹수의 공격 맥락에서는 ‘먹어 치우다’가 포식과 파괴의 의미를 더 분명히 전달합니다.
- source_word: לָבֶטַח / securely
  english_pob_choice: securely
  chosen_korean: 안전하게
  alternatives_korean:
  - 평안하게
  - 안심하고
  lexicon: HALOT
  rationale: לָבֶטַח는 안전·보호의 상태를 나타내므로, 동사 ‘살다’와 자연스럽게 결합하는 ‘안전하게’가 가장 무난합니다.
- source_word: וְאֵין מַחֲרִיד / with no one to make them afraid
  english_pob_choice: with no one to make them afraid
  chosen_korean: 두려워하게 할 자가 없을 것입니다
  alternatives_korean:
  - 그들을 두렵게 할 자가 없을 것입니다
  - 그들을 떨게 할 자가 없을 것입니다
  lexicon: HALOT
  rationale: מַחֲרִיד는 ‘두렵게 하다, 떨게 하다’의 인과적 뉘앙스를 가지므로, 인격적 행위자를 살린 ‘두려워하게 할 자’가 원문의 힘을 잘 보존합니다.
theological_decisions:
- issue: 국가적 억압과 짐승의 위협을 어떻게 처리할지
  chosen_reading: 이 절을 역사적·상징적 위협을 모두 포함하는 구체적 회복 약속으로 번역하고, 위협의 성격을 단정적으로 한정하지 않았습니다.
  alternative_readings:
  - 국가적 적대만을 정치적 은유로 환원하는 읽기
  - 야생 동물만을 문자적 위협으로 제한하는 읽기
  rationale: 히브리어는 나라들의 약탈과 들짐승의 위협을 병렬로 제시하므로, 번역은 그 긴장을 유지해야 합니다. 본문이 허용하는 범위 이상으로 종말론적 체계를 덧씌우지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3
