  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 따라서
  lexicon: HALOT
  rationale: 앞선 책망과 선언의 결과를 잇는 인과 접속사로, 예언 문맥의 격식을 살리는 한국어 표현은 ‘그러므로’가 자연스럽습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 합성 호칭의 두 요소를 모두 살리되, 본 프로젝트 기본값에 따라 יהוה는 ‘야훼’로 옮겼습니다. ‘주 하나님’은 두 이름의 결합감을 약화하고, ‘주 여호와’는 본 지침의 표준 표기와 다릅니다.
- source_word: הִנְנִי אָנִי
  english_pob_choice: Behold, I myself
  chosen_korean: 보십시오, 내가 친히
  alternatives_korean:
  - 보라, 내가 친히
  - 내가 바로
  lexicon: HALOT
  rationale: 감탄·주의 환기 표지 הִנְנִי와 강조된 1인칭 אָנִי를 함께 살리기 위해, 공적 선언체인 ‘보십시오’와 강조 부사 ‘친히’를 사용했습니다.
- source_word: שֶׂה בִרְיָה / שֶׂה רָזָה
  english_pob_choice: the fat sheep and the lean sheep
  chosen_korean: 살진 양과 여윈 양
  alternatives_korean:
  - 비만한 양과 마른 양
  - 살이 찐 양과 마른 양
  lexicon: HALOT
  rationale: 히브리어의 단수 명사는 무리의 유형을 가리키는 집합적 용법이므로, POB의 의미를 따라 한국어도 집합적 복수 느낌의 ‘양’으로 옮겼습니다. ‘살진/여윈’은 대조를 선명하게 유지합니다.
