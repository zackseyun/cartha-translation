- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 그런즉
  lexicon: HALOT
  rationale: 앞선 책망의 결론을 여는 연결어로, 현대적이면서도 예언서의 논리 전개를 자연스럽게 살리는 표현입니다.
- source_word: הָרֹעִים
