  terminology: ‘야훼의 말씀’은 דְּבַר יְהוָה라는 예언서의 정형 표현을 자연스럽고 정확하게 반영합니다. ‘말씀’은 이 문맥에서 지나치게 교파적으로 한정되지 않으며, ‘목자들’도 장 전체의 핵심 은유를 보존합니다.
