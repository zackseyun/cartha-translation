  rationale: 문맥상 이 비유는 이스라엘의 지도자들을 가리키지만, 본문의 핵심인 목자 비유를 살려 직역에 가깝게 유지했습니다.
- source_word: שִׁמְעוּ
  english_pob_choice: hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으시오
  - 들어라
