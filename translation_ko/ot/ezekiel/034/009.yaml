  - 여호와의 말씀
  lexicon: HALOT
  rationale: יְהוָה는 본문 원어의 신명으로서 '야훼'를 유지했고, דָּבָר는 예언 공식에 어울리는 '말씀'으로 옮겼습니다.
theological_decisions:
