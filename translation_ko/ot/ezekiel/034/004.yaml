  text: אֶֽת הַ/נַּחְלוֹת֩ לֹ֨א חִזַּקְתֶּ֜ם וְ/אֶת הַ/חוֹלָ֣ה לֹֽא רִפֵּאתֶ֗ם וְ/לַ/נִּשְׁבֶּ֨רֶת֙ לֹ֣א חֲבַשְׁתֶּ֔ם וְ/אֶת הַ/נִּדַּ֨חַת֙ לֹ֣א הֲשֵׁבֹתֶ֔ם וְ/אֶת הָ/אֹבֶ֖דֶת לֹ֣א בִקַּשְׁתֶּ֑ם וּ/בְ/חָזְקָ֛ה רְדִיתֶ֥ם אֹתָ֖/ם וּ/בְ/פָֽרֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/004.yaml
  text: You have not strengthened the weak[a], and you have not healed the sick, and you have not bound up the broken, and you have not brought back the strayed, and you have not sought the lost[c][b]; but with force and with harshness you have ruled them.
  footnotes:
  - marker: a
    text: Or 'the sick' for 'the weak'; the Hebrew term can denote sickness or weakness, but 'weak' is used here to distinguish it from the next phrase, 'the sick.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the driven away' for 'the strayed.' The Hebrew can emphasize being driven off as well as wandering away.
    reason: lexical_alternative
  - marker: c
    text: Or 'with ruthlessness.' The Hebrew term denotes harsh, crushing severity.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 약한 자[a]를 강하게 하지 않았고, 병든 자를 고치지 않았으며, 상한 자를 싸매지 않았고, 흩어진 자[b]를 돌아오게 하지 않았으며, 잃어버린 자를 찾지 않았습니다. 그러나 너희는 힘과 가혹함으로 그들을 다스렸습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘약한 자’는 ‘병든 자’로도 옮길 수 있습니다. 그러나 다음의 ‘병든 자’와 구별하기 위해 여기서는 더 넓은 의미의 쇠약함을 나타내는 말로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘흩어진 자’는 ‘내몰린 자’로도 옮길 수 있습니다. 히브리어는 흩어짐과 쫓겨남의 뉘앙스를 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘가혹함으로’는 ‘무자비하게’ 또는 ‘잔혹하게’로도 옮길 수 있습니다. 히브리어는 짓누르는 듯한 엄혹함을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּחְלוֹת
  english_pob_choice: the weak
  chosen_korean: 약한 자
  alternatives_korean:
  - 병든 자
  - 연약한 자
  lexicon: HALOT
  rationale: 첫 번째 항목은 바로 뒤의 ‘병든 자’와 구별되어야 하므로, ‘약한 자’로 옮겨 힘을 잃은 양의 상태를 드러냈습니다.
- source_word: חִזַּקְתֶּם
  english_pob_choice: have strengthened
  chosen_korean: 강하게 하지 않았고
  alternatives_korean:
  - 강하게 하지 않았습니다
  - 튼튼하게 하지 않았습니다
  lexicon: HALOT
  rationale: 히필형의 ‘강하게 하다’라는 동작성을 살리면서, 앞의 ‘약한 자’와 자연스럽게 짝지었습니다.
- source_word: לַנִּדַּחַת
  english_pob_choice: the strayed
  chosen_korean: 흩어진 자
  alternatives_korean:
  - 길 잃은 자
  - 쫓겨난 자
  lexicon: HALOT
  rationale: 이 동사는 ‘흩어짐/내몰림’의 뉘앙스를 함께 가지므로, 목자-양 비유 안에서 결과 상태를 드러내는 ‘흩어진 자’를 택했습니다.
- source_word: וּבְחָזְקָה ... וּבְפָרֶךְ
  english_pob_choice: with force ... with harshness
  chosen_korean: 힘으로, 또 가혹하게
  alternatives_korean:
  - 강압으로, 또 잔혹하게
  - 폭력으로, 또 혹독하게
  lexicon: HALOT
  rationale: 원문은 다스림의 방식에 두 전치사구를 붙여 압제를 나타내므로, 동사를 과장하지 않고 부사구로 압박성과 잔혹성을 드러냈습니다.
theological_decisions:
- issue: 목자 비유의 유지
  chosen_reading: 사람을 직접 정치어로 바꾸지 않고, ‘약한 자 / 병든 자 / 상한 자 / 흩어진 자 / 잃은 자’라는 양-목자 비유를 그대로 보존했습니다.
  alternative_readings:
  - 백성을 학대했다고만 평면적으로 옮김
  - 비유를 해설적으로 풀어씀
  rationale: 이 본문은 지도자들의 실패를 목자 상징으로 고발하므로, 비유를 유지해야 선지자적 비난의 강도와 성경 내 상호연결이 살아납니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 마지막 절의 압제 표현
  chosen_reading: ‘다스렸습니다’에 ‘힘으로, 또 가혹하게’를 붙여 압제를 구조적으로 드러냈습니다.
  alternative_readings:
  - ‘잔혹하게 지배했습니다’
  - ‘폭력적으로 다스렸습니다’
  rationale: 히브리어는 동사 자체보다 수식어에 부정적 의미를 싣고 있으므로, 원문 구조를 따라 가혹성의 위치를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 6
