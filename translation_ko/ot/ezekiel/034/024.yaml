id: EZK.34.24
reference: Ezekiel 34:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֣י יְהוָ֗ה אֶהְיֶ֤ה לָ/הֶם֙ לֵֽ/אלֹהִ֔ים וְ/עַבְדִּ֥/י דָוִ֖ד נָשִׂ֣יא בְ/תוֹכָ֑/ם אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/024.yaml
  text: And I[a], Yahweh, will be their God, and my servant David will be prince among them. I, Yahweh, have spoken.
  footnotes:
  - marker: a
    text: '''My servant David'' may refer typologically or prophetically to the coming Davidic ruler, that is, the Messiah; the Hebrew text itself reads ''David.'''
    reason: alternative_reading
translation:
  language: ko
  text: 나는 그들의 하나님이 되고, 내 종 다윗은 그들 가운데서 왕자일 것입니다. 나, 야훼가 말하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 종 다윗’은 역사적 다윗을 가리키기보다, 장차 오실 다윗 계열의 통치자, 곧 메시아를 예표하거나 예언적으로 가리킬 수 있습니다. 히브리어 본문은 문자 그대로 ‘다윗’이라고 되어 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 계약적 자기계시의 고유명을 보존하기 위해 전통적 대체어인 ‘주’가 아니라 야훼로 옮겼습니다.
- source_word: לֵאלֹהִים
  english_pob_choice: their God
  chosen_korean: 그들의 하나님
  alternatives_korean:
  - 그들에게 하나님
  - 그들의 신
  lexicon: HALOT
  rationale: ‘~의 하나님 되다’라는 언약 관용구를 자연스럽게 살리기 위해 ‘그들의 하나님’으로 옮겼습니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 종복
  - 내 노예
  lexicon: HALOT
  rationale: 다윗 왕조/언약 문맥에서의 대표적 칭호를 반영하되, 고어적 ‘종복’보다 현대 한국어에 분명한 ‘종’을 택했습니다.
- source_word: נָשִׂיא
  english_pob_choice: prince
  chosen_korean: 왕자
  alternatives_korean:
  - 지도자
  - 통치자
  - 군주
  lexicon: HALOT
  rationale: 이 단어가 에스겔에서 ‘왕’과 구별되는 지위의 통치자를 가리키므로, 권위는 유지하되 왕권을 과도하게 부여하지 않는 ‘왕자’를 채택했습니다.
theological_decisions:
- issue: ‘my servant David’의 해석을 본문에 넣을지 여부
  chosen_reading: 본문은 히브리어 그대로 ‘다윗’을 유지하고, 메시아적/다윗계 통치자 해석은 본문 밖 주석으로 처리하지 않았습니다.
  alternative_readings:
  - 메시아
  - 다윗 계열의 통치자
  - 부활한 역사적 다윗
  rationale: 원문은 해석이 아니라 ‘다윗’이라는 표지를 제시하므로, 본문 번역에서 의미를 확정하기보다 독자가 원문 긴장을 보도록 유지하는 것이 적절합니다.
  doctrine_reference: 에스겔 34장의 목자-왕자 약속에 대한 해석 논의; 번역은 본문 우선 원칙
