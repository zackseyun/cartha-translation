  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִי אָ֕נִי וְ/דָרַשְׁתִּ֥י אֶת צֹאנִ֖/י וּ/בִקַּרְתִּֽי/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/011.yaml
  text: 'For thus says the Lord GOD: Behold[a], I myself will search for my sheep and seek them out.'
  footnotes:
  - marker: a
    text: Or 'and attend to them,' 'and inspect them,' or 'and care for them.' The Hebrew verb can carry the sense of personally looking after the sheep as well as seeking them out.
    reason: lexical_alternative
translation:
  language: ko
  text: “주 야훼께서 이같이 말씀하십니다. 보십시오, 내가 친히 내 양들을 찾고, 그들을 찾아내겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 동사 בִּקֵּר/בקר은 문맥에 따라 ‘살피다’, ‘돌보다’, ‘감독하다’의 뜻을 가질 수 있으나, 여기서는 목자가 잃은 양을 찾아내는 의미가 우선합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 두 겹의 신적 칭호를 그대로 살리되, 야훼를 기본 표기로 유지하여 언약 이름을 보존했습니다. '주 야훼'는 구어적이지만 본문의 장엄함을 해치지 않으면서도 중복 번역을 피합니다.
- source_word: הִנְנִי אָנִי
  english_pob_choice: Behold, I myself
  chosen_korean: 보십시오, 내가 친히
  alternatives_korean:
  - 보라, 내가 친히
  - 이제 내가 직접
  lexicon: HALOT
  rationale: הִנְנִי의 주목 촉구를 '보십시오'로, אָנִי의 강조를 '친히'로 옮겨 하나님의 적극적 개입을 드러냈습니다.
- source_word: וְדָרַשְׁתִּי
  english_pob_choice: will search for
  chosen_korean: 찾고
  alternatives_korean:
  - 찾아 구하고
  - 수색하고
  lexicon: HALOT
  rationale: 목자-양 문맥에서 דָרַשׁ은 단순 탐문보다 잃은 양을 실제로 찾는 움직임이 자연스러워 '찾고'로 간결하게 옮겼습니다.
- source_word: וּבִקַּרְתִּים
  english_pob_choice: and seek them out
  chosen_korean: 찾아내겠습니다
  alternatives_korean:
  - 살피겠습니다
  - 돌보겠습니다
  lexicon: HALOT
  rationale: בקר의 '돌보다/살피다'까지 포함될 수 있으나, 여기서는 앞절과의 평행 속에서 흩어진 양을 실제로 찾아내는 의미를 전면화하는 것이 가장 직접적입니다.
theological_decisions:
- issue: 공적 신적 발화의 한국어 호칭과 존대
  chosen_reading: ‘주 야훼께서’와 서술 전체의 합쇼체를 유지하되, 직접 발화 인용 안에서도 하나님의 자기선언은 현대 문체로 처리했습니다.
  alternative_readings:
  - ‘주 야훼께서’ 대신 ‘주 하나님께서’
  - 인용문을 더 전통적인 예언문 어조로 옮김
  rationale: 히브리어 예언문은 하나님의 권위 있는 선언이므로, 현대적 문체를 유지하면서도 예언적 엄중함을 살리는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Divine address and reverence in Korean rendering'
