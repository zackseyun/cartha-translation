reference: Ezekiel 34:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִ֨י אֶרְעֶ֤ה צֹאנִ/י֙ וַ/אֲנִ֣י אַרְבִּיצֵ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/015.yaml
  text: I myself will shepherd my flock[a], and I myself will make them lie down[c][b], declares the Lord Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''my sheep''; rendered ''my flock'' to preserve the collective sense of the noun in this shepherding context.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will feed my flock.' The Hebrew verb can include the sense of tending or pasturing, not only feeding.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew title: ''Lord Yahweh'' or ''the Lord Yahweh.'' The main text uses the conventional English rendering ''the Lord GOD'' for אֲדֹנָי יְהוִה.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 친히 내 양 떼를 먹이겠고[a] 내가 친히 그들을 눕게 하겠습니다[c][b] — 주 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 양들’이지만, 목자 문맥에서 집합적 의미를 살려 ‘내 양 떼’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사에는 ‘먹이다’뿐 아니라 ‘기르다/목양하다’의 뜻이 포함될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 직역은 ‘눕게 하다’이며, 안전과 안식을 주는 목자의 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  english_pob_choice: I myself
  chosen_korean: 내가 친히
  alternatives_korean:
  - 내가
  - 나 자신이
  lexicon: HALOT
  rationale: 독립대명사와 반복되는 주어의 강조를 한국어에서는 ‘친히’로 자연스럽게 살려, 단순한 주어보다 하나님의 직접적 주도성을 드러냈습니다.
- source_word: אֶרְעֶה
  english_pob_choice: will shepherd
  chosen_korean: 먹이겠고
  alternatives_korean:
  - 목양하겠고
  - 목자처럼 돌보겠고
  lexicon: HALOT
  rationale: 히브리어의 목자-통치 이미지는 한국어에서 동사 하나로 온전히 대응하기 어려워, 문맥상 핵심인 ‘목자처럼 돌보며 먹이다’의 의미를 가장 직접적으로 전달하는 ‘먹이다’를 택했습니다.
- source_word: צֹאנִי
  english_pob_choice: my flock
  chosen_korean: 내 양 떼
  alternatives_korean:
  - 내 양들
  - 내 가축 떼
  lexicon: HALOT
  rationale: 집합명사 צֹאן의 공동체적 의미를 살리기 위해 단순 복수 ‘양들’보다 ‘양 떼’를 사용했습니다.
- source_word: אַרְבִּיצֵם
  english_pob_choice: will make them lie down
  chosen_korean: 그들을 눕게 하겠습니다
  alternatives_korean:
  - 그들이 누워 쉬게 하겠습니다
  - 그들을 쉬게 하겠습니다
  lexicon: HALOT
  rationale: 히필형의 ‘눕게 하다/자리에 들게 하다’라는 사역 의미를 직접 반영해, 목자가 양을 안전한 곳에 쉬게 하는 장면을 살렸습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord Yahweh
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 여호와
  - 주 하나님
  lexicon: HALOT
  rationale: 본문의 חיבור형 호칭은 ‘주’와 언약적 이름을 함께 보존해야 하므로, 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 아도나이-야훼 결합 호칭의 한국어 처리
  chosen_reading: ‘주 야훼의 말씀입니다’로 마무리하여, 주권 호칭과 고유한 신적 이름을 모두 드러냈습니다.
  alternative_readings:
  - ‘주 하나님이 말씀하십니다’
  - ‘주 여호와의 말씀입니다’
  rationale: 히브리어의 두 겹 호칭을 합쳐 버리면 신적 이름의 직접성이 약해집니다. 본문은 하나님의 자기계시적 이름을 포함하므로 프로젝트 기준대로 ‘야훼’를 유지하는 것이 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה / YHWH → 야훼'
