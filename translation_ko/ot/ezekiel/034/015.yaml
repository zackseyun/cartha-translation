  - 주 하나님
  lexicon: HALOT
  rationale: 본문의 חיבור형 호칭은 ‘주’와 언약적 이름을 함께 보존해야 하므로, 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 아도나이-야훼 결합 호칭의 한국어 처리
  chosen_reading: ‘주 야훼의 말씀입니다’로 마무리하여, 주권 호칭과 고유한 신적 이름을 모두 드러냈습니다.
  alternative_readings:
  - ‘주 하나님이 말씀하십니다’
  - ‘주 여호와의 말씀입니다’
  rationale: 히브리어의 두 겹 호칭을 합쳐 버리면 신적 이름의 직접성이 약해집니다. 본문은 하나님의 자기계시적 이름을 포함하므로 프로젝트 기준대로 ‘야훼’를 유지하는 것이 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה / YHWH → 야훼'
