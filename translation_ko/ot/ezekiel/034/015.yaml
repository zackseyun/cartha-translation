source:
  edition: WLC
  text: אֲנִ֨י אֶרְעֶ֤ה צֹאנִ/י֙ וַ/אֲנִ֣י אַרְבִּיצֵ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/015.yaml
  text: I myself will shepherd my flock[a], and I myself will make them lie down[c][b], declares the Lord Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''my sheep''; rendered ''my flock'' to preserve the collective sense of the noun in this shepherding context.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will feed my flock.' The Hebrew verb can include the sense of tending or pasturing, not only feeding.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew title: ''Lord Yahweh'' or ''the Lord Yahweh.'' The main text uses the conventional English rendering ''the Lord GOD'' for אֲדֹנָי יְהוִה.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 친히 내 양 떼를 돌보겠으며[b], 내가 친히 그들을 눕게 하겠습니다[c]. 주 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘내 양 떼를 먹이겠으며.’ 히브리어 동사는 먹이는 행위뿐 아니라 목자가 양 떼를 돌보고 기르는 일을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그들을 눕게 하겠다’입니다. 목자가 양 떼를 안전히 쉬게 하는 모습을 나타냅니다.
    reason: lexical_alternative
