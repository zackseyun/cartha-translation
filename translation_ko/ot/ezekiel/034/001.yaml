translation:
  language: ko
  text: 야훼의 말씀이 제게 임하여 말씀하셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה를 따라 본문에서는 ‘야훼’로 옮겼습니다. 전통적 한국어 성경의 ‘여호와’ 대신 신명사의 직접 음역을 따릅니다.
    reason: ot_citation
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 임하여
  alternatives_korean:
  - 이르러
  - 왔습니다
  - 임했습니다
  lexicon: HALOT
  rationale: 예언 서두의 정형적 표현으로서 ‘말씀이 … 임하다’가 מקור의 서사적 진입과 신적 발화의 도착을 자연스럽게 살립니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: ‘야훼의 말씀’은 예언 공식의 정착된 표현이므로, 단순한 ‘말’보다 ‘말씀’이 מקור의 공적·계시적 성격을 더 정확히 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 신명사 יְהוָה를 대체 тит울로 바꾸지 않고, 본 프로젝트 기본값에 따라 음역 ‘야훼’를 유지했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하며
  - 이르시기를
  lexicon: HALOT
  rationale: 히브리어의 직접화법 도입을 한국어에서는 종결 동사로 자연스럽게 풀어, 이어지는 하나님의 직접 발화를 예고하는 기능을 살렸습니다.
theological_decisions:
- issue: 예언 공식에서 신적 발화의 시작을 어떻게 드러낼 것인가
  chosen_reading: ‘야훼의 말씀이 제게 임하여 말씀하셨습니다’로, 말씀이 임하는 사건성과 야훼의 직접 발화를 함께 표현했습니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 임하여 이르셨습니다’
  - ‘야훼의 말씀이 내게 임했습니다’
  rationale: 본문은 단순 정보 전달이 아니라 선지자에게 임한 계시의 도래를 말하므로, ‘임하여’와 ‘말씀하셨습니다’를 함께 써서 계시의 도착과 발화의 인격성을 모두 보존했습니다.
  doctrine_reference: 예언적 계시의 공식 서두
