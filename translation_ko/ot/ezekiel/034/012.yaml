  text: כְּ/בַקָּרַת֩ רֹעֶ֨ה עֶדְר֜/וֹ בְּ/יוֹם הֱיוֹת֤/וֹ בְ/תוֹךְ צֹאנ/וֹ֙ נִפְרָשׁ֔וֹת כֵּ֖ן אֲבַקֵּ֣ר אֶת צֹאנִ֑/י וְ/הִצַּלְתִּ֣י אֶתְ/הֶ֗ם מִ/כָּל הַ/מְּקוֹמֹת֙ אֲשֶׁ֣ר נָפֹ֣צוּ שָׁ֔ם בְּ/י֥וֹם עָנָ֖ן וַ/עֲרָפֶֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/012.yaml
  text: As a shepherd seeks out his flock on the day he is among his sheep when they have been scattered[a], so I will seek out my sheep[b], and I will rescue them from all the places where they were scattered on a day of clouds and thick darkness.
  footnotes:
  - marker: a
    text: Or 'inspect/care for'; the Hebrew verb carries the sense of attentive oversight as well as seeking out.
    reason: lexical_alternative
  - marker: b
    text: Or 'on the day of cloud and thick darkness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 목자가 자기 양 떼가 흩어졌을 때, 양 떼 가운데 있는 날에 자기 양 떼를 찾아보듯이, 나도 내 양 떼를 찾아보고, 그들이 흩어진 모든 곳에서 그들을 구해 내겠습니다. 곧 구름과 짙은 어둠의 날에 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘찾아보다’는 כאן בקר 계열의 뜻인 살피다, 점검하다, 찾아 나서다를 함께 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구름과 짙은 어둠의 날’은 ‘구름과 깊은 어둠의 날’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבַקָּרַת
  english_pob_choice: As a shepherd seeks out
  chosen_korean: 목자가 … 찾아보듯이
  alternatives_korean:
  - 목자의 살핌처럼
  - 목자가 살펴보듯이
  - 목자의 점검처럼
  lexicon: HALOT
  rationale: בקר 계열의 비교 표현을 한국어로는 ‘찾아보다’로 풀어, 목자의 적극적 탐색과 살핌을 함께 드러냈습니다.
- source_word: נִפְרָשׁוֹת
  english_pob_choice: when they have been scattered
  chosen_korean: 양 떼가 흩어졌을 때
  alternatives_korean:
  - 흩어졌을 때
  - 분산되었을 때
  - 퍼져 흩어졌을 때
  lexicon: HALOT
  rationale: 피동 분사로서의 ‘흩어지다’를 자연스럽게 옮기되, 목자-양의 문맥을 살려 대상이 양 떼임을 앞에서 분명히 했습니다.
- source_word: אֲבַקֵּר
  english_pob_choice: I will seek out
  chosen_korean: 찾아보고
  alternatives_korean:
  - 살펴보겠습니다
  - 찾겠습니다
  - 점검하겠습니다
  lexicon: HALOT
  rationale: 같은 어근 בקר을 반복해, 하나님이 단순히 멀리서 보는 것이 아니라 잃은 양을 능동적으로 찾아 나서는 뜻을 살렸습니다.
- source_word: וְהִצַּלְתִּי
  english_pob_choice: I will rescue
  chosen_korean: 구해 내겠습니다
  alternatives_korean:
  - 구하겠습니다
  - 건져 내겠습니다
  - 구조하겠습니다
  lexicon: HALOT
  rationale: נצל의 구출·탈환 뉘앙스를 살리기 위해 ‘구해 내다’를 택했습니다. 이는 흩어진 양을 위험에서 건져 회복시키는 느낌을 전달합니다.
- source_word: בְּיוֹם עָנָן וַעֲרָפֶל
  english_pob_choice: on a day of clouds and thick darkness
  chosen_korean: 구름과 짙은 어둠의 날
  alternatives_korean:
  - 구름과 깊은 어둠의 날
  - 구름과 캄캄한 어둠의 날
  - 운무와 짙은 어둠의 날
  lexicon: HALOT
  rationale: עָנָן과 עֲרָפֶל의 병치를 한국어로 자연스럽게 옮기면서, 후자를 ‘짙은 어둠’으로 번역해 무거운 심상을 유지했습니다.
theological_decisions:
- issue: 야훼의 목자적 자기 개입
  chosen_reading: 하나님이 친히 자기 양 떼를 찾아 구해 내시는 목자 이미지로 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 메시아적 성취를 미리 드러내는 더 해석적인 번역
  - 목자 비유를 완화한 일반적 보호 표현
  rationale: 본문은 자기 백성을 버려진 양으로 두지 않으시는 야훼의 직접 행위를 강조하므로, 그 긴장을 해설로 풀지 않고 본문 자체의 이미지로 보존했습니다.
  doctrine_reference: 예언서의 야훼 목자 상징을 본문 수준에서 유지
- issue: 흩어짐과 재수집의 대비
  chosen_reading: ‘흩어졌을 때’와 ‘구해 내겠습니다’를 병렬로 두어 분산과 회복의 대비를 유지했습니다.
  alternative_readings:
  - ‘분산되었을 때’처럼 중립적인 표현
  - ‘구원하겠습니다’처럼 포괄적인 종교어
  rationale: 본문의 핵심은 장소적 흩어짐과 그로부터의 실제적 회수이므로, 추상적 구원어보다 구체적 회복 동사를 택했습니다.
  doctrine_reference: 포로 회복과 목자적 보호의 문맥 보존
