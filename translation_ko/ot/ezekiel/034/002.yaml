id: EZK.34.2
reference: Ezekiel 34:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֶּן אָדָ֕ם הִנָּבֵ֖א עַל רוֹעֵ֣י יִשְׂרָאֵ֑ל הִנָּבֵ֣א וְ/אָמַרְתָּ֩ אֲלֵי/הֶ֨ם לָ/רֹעִ֜ים כֹּ֥ה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה ה֤וֹי רֹעֵֽי יִשְׂרָאֵל֙ אֲשֶׁ֤ר הָיוּ֙ רֹעִ֣ים אוֹתָ֔/ם הֲ/ל֣וֹא הַ/צֹּ֔אן יִרְע֖וּ הָ/רֹעִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/002.yaml
  text: 'Son of man[a], prophesy against the shepherds of Israel; prophesy and say to them, to the shepherds[b], ‘Thus says the Lord GOD: Woe to the shepherds of Israel who have been shepherding themselves! Should not the shepherds shepherd the flock?’'
  footnotes:
  - marker: a
    text: Or, 'who feed themselves.' The Hebrew verb is the same shepherding verb used throughout the verse; the sense is that Israel’s leaders were caring for themselves instead of the flock.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sheep'; rendered 'the flock' here for the collective sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 이스라엘의 목자들을 향하여 예언하여라. 예언하고 그들에게, 곧 목자들에게 말하여라. “주 하나님께서 이렇게 말씀하십니다. 이스라엘의 목자들에게 화가 있습니다. 그들은 양 떼를 먹이지 않고 자기 자신만 먹였습니다. 목자들이 양 떼를 먹여야 하지 않겠습니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘먹이다/치다’에 해당하는 히브리어 동사가 본문 전체에 반복됩니다. 여기서는 자기보호가 아니라 자기이익을 위한 돌봄이라는 뜻을 드러내기 위해 ‘자기 자신만 먹였습니다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘양들’이지만, 집합적 의미를 살려 ‘양 떼’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔의 대표적 호칭으로서 관용적·문체적 힘을 살리면서도 현대 한국어에서 자연스럽게 호명할 수 있는 형태를 택했습니다.
- source_word: רוֹעֵי יִשְׂרָאֵל / לָרֹעִים / הָרֹעִים
  english_pob_choice: the shepherds of Israel / the shepherds / the shepherds
  chosen_korean: 이스라엘의 목자들 / 목자들
  alternatives_korean:
  - 이스라엘의 지도자들 / 지도자들
  - 이스라엘의 목동들 / 목동들
  lexicon: HALOT
  rationale: 본문이 끝까지 목자-양 떼의 비유를 유지하므로, 해석어인 ‘지도자들’보다 비유어 ‘목자들’을 살렸습니다.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  english_pob_choice: Thus says the Lord GOD
  chosen_korean: 주 하나님께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주 야훼께서 이렇게 말씀하십니다
  - 주 여호와께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 한국어 본문에서는 אֲדֹנָי יְהוִה의 결합이 중복된 ‘주 주’가 되지 않도록 ‘주 하나님’으로 옮겨, 예언 공식의 엄중한 어조를 자연스럽게 유지했습니다.
- source_word: הָיוּ רֹעִים אוֹתָם
  english_pob_choice: who have been shepherding themselves
  chosen_korean: 그들은 양 떼를 먹이지 않고 자기 자신만 먹였습니다
  alternatives_korean:
  - 그들은 자기 자신만 먹이고 있었습니다
  - 그들은 자신들을 먹이고 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘목자하다/먹이다’ 중복을 한국어에서 그대로 살리되, 문맥상 자기를 돌보는 이기성을 분명히 드러내기 위해 ‘자기 자신만 먹였습니다’로 풀었습니다.
- source_word: הַצֹּאן
  english_pob_choice: the flock
  chosen_korean: 양 떼
  alternatives_korean:
  - 양 무리
  - 양떼
  lexicon: HALOT
  rationale: 집합적 의미를 살리면서도 ‘목자들’과 짝을 이루는 목회적 이미지가 한국어에서 자연스럽게 드러나도록 했습니다.
theological_decisions:
- issue: YHWH in Ezekiel’s prophetic formula
  chosen_reading: 본문에서는 전승적 예언 공식의 엄중함을 살리되, 한국어 독자에게 자연스러운 ‘주 하나님’으로 옮겼습니다.
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 에스겔의 정형 공식인 אֲדֹנָי יְהוִה를 한국어에서 직역식으로 중복하지 않으면서도 신적 권위를 보존해야 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: Whether to interpret the shepherd metaphor as a plain leadership label
  chosen_reading: 비유를 유지해 ‘목자들’로 번역했습니다.
  alternative_readings:
  - 지도자들
  rationale: 본문의 다음 절까지 이어지는 목자-양 떼 이미지가 핵심이므로, 의미를 먼저 해석어로 치환하면 예언적 수사와 책망의 날카로움이 약화됩니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #5'
