revisions:
- from: 인자야, 이스라엘의 목자들을 향하여 예언하여라. 예언하고 그들에게, 곧 목자들에게 말하여라. “주 하나님께서 이렇게 말씀하십니다. 이스라엘의 목자들에게 화가 있습니다. 그들은 양 떼를 먹이지 않고 자기 자신만 먹였습니다. 목자들이 양 떼를 먹여야 하지 않겠습니까?”[a][b]
