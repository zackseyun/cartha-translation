id: EZK.34.14
reference: Ezekiel 34:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/מִרְעֶה טּוֹב֙ אֶרְעֶ֣ה אֹתָ֔/ם וּ/בְ/הָרֵ֥י מְרֽוֹם יִשְׂרָאֵ֖ל יִהְיֶ֣ה נְוֵ/הֶ֑ם שָׁ֤ם תִּרְבַּ֨צְנָה֙ בְּ/נָ֣וֶה טּ֔וֹב וּ/מִרְעֶ֥ה שָׁמֵ֛ן תִּרְעֶ֖ינָה אֶל הָרֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/014.yaml
  text: In good pasture I will pasture them[a], and on the high mountains of Israel their grazing place will be. There they will lie down in a good grazing place[b], and they will feed in rich pasture on the mountains of Israel.
  footnotes:
  - marker: a
    text: Or 'their habitation will be there'; the Hebrew noun can mean an abode or dwelling place as well as a pasture/grazing place.
    reason: lexical_alternative
  - marker: b
    text: Literally 'fat pasture.'
    reason: lexical_alternative
translation:
  language: ko
  text: 좋은 목초지에서 내가 그들을 먹이겠습니다. 이스라엘의 높은 산들에 그들의 목초지가[a] 있을 것입니다. 거기서 그들은 좋은 목초지에 누울 것이며, 이스라엘의 산들에서 기름진 목초지[b]의 풀을 뜯을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 거처’. 히브리어 명사는 거처나 주거지를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘살진 목초지’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִרְעֶה טּוֹב / אֶרְעֶה
  english_pob_choice: In good pasture I will pasture them
  chosen_korean: 좋은 목초지에서 내가 그들을 먹이겠습니다
  alternatives_korean:
  - 좋은 풀밭에서 내가 그들을 치겠습니다
  - 좋은 목장에서 내가 그들을 목양하겠습니다
  lexicon: HALOT
  rationale: מִרְעֶה의 목초지/풀밭 의미와 רעה의 목양·먹이다 의미를 함께 살리기 위해, 자연스러운 한국어로 '먹이겠습니다'를 택했습니다.
- source_word: הָרֵי מְרוֹם יִשְׂרָאֵל
  english_pob_choice: the high mountains of Israel
  chosen_korean: 이스라엘의 높은 산들
  alternatives_korean:
  - 이스라엘의 고지대의 산들
  - 이스라엘의 높은 산악지대
  lexicon: HALOT
  rationale: מְרוֹם의 높이/고도 강조를 살리되, 한국어에서는 '높은 산들'이 가장 직설적이고 자연스럽습니다.
- source_word: נְוֵהֶם
  english_pob_choice: their grazing place
  chosen_korean: 그들의 거처
  alternatives_korean:
  - 그들의 목초지
  - 그들의 거주지
  - 그들의 초장
  lexicon: HALOT
  rationale: נוה는 거처·목초지 모두 가능하지만, 문맥의 '누움'과 병행되는 장소 표현으로는 '거처'가 가장 포괄적이며, 주석에서 대안 의미를 열어 두었습니다.
- source_word: תִּרְבַּצְנָה
  english_pob_choice: they will lie down
  chosen_korean: 누울 것이며
  alternatives_korean:
  - 엎드려 쉴 것이며
  - 편히 누울 것이며
  lexicon: HALOT
  rationale: 가축이 안전하게 눕는 구체적 이미지를 유지하기 위해 '누울'을 사용했습니다.
- source_word: בְּנָוֶה טּוֹב
  english_pob_choice: in a good grazing place
  chosen_korean: 좋은 거처
  alternatives_korean:
  - 좋은 목초지
  - 좋은 초장
  lexicon: HALOT
  rationale: 앞의 נוה를 '거처'로 옮겼으므로 반복되는 표현도 일관되게 처리하되, 목양 비유를 해치지 않도록 각주로 대안 의미를 표시했습니다.
- source_word: מִרְעֶה שָׁמֵן
  english_pob_choice: rich pasture
  chosen_korean: 살진 목초지
  alternatives_korean:
  - 기름진 목초지
  - 풍성한 목초지
  lexicon: HALOT
  rationale: שָׁמֵן의 직역인 '살진'을 살려 풍요와 비옥함을 보존했고, 한국어에서도 충분히 이해 가능한 표현입니다.
theological_decisions:
- issue: 목양 비유의 구체성 유지
  chosen_reading: 추상적인 '돌보겠습니다/쉬게 하겠습니다'보다, 먹이심과 눕게 하심의 목양 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 그들을 돌보겠습니다
  - 그들이 안전히 쉬게 하겠습니다
  rationale: 이 절은 하나님의 목자적 돌봄을 서술하는 연속된 비유이므로, 은유를 평서적 의미로 바꾸지 않는 편이 원문 의도를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
