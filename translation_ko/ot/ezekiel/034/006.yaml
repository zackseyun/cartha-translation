  text: יִשְׁגּ֤וּ צֹאנִ/י֙ בְּ/כָל הֶ֣/הָרִ֔ים וְ/עַ֖ל כָּל גִּבְעָ֣ה רָמָ֑ה וְ/עַ֨ל כָּל פְּנֵ֤י הָ/אָ֨רֶץ֙ נָפֹ֣צוּ צֹאנִ֔/י וְ/אֵ֥ין דּוֹרֵ֖שׁ וְ/אֵ֥ין מְבַקֵּֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/006.yaml
  text: My sheep wandered on all the mountains and on every high hill[a]; my sheep were scattered over the whole face of the earth[b], with no one searching or seeking for them.
  footnotes:
  - marker: a
    text: Or 'went astray' for 'wandered.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the whole face of the earth'; 'earth' could also be rendered 'land' depending on how broadly the scope is understood.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 양 떼는 모든 산과 모든 높은 언덕에서 방황하였고[a], 내 양 떼는 온 땅의 온 얼굴에 흩어졌습니다[b]. 찾는 사람도 없고 찾는 이도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘방황하였고’는 히브리어 동사 שׁגה의 뜻을 살린 번역입니다. 대안으로 ‘길을 잃었고’ 또는 ‘헤매었고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘땅의 온 얼굴’을 뜻합니다. 여기서는 넓은 범위를 가리키므로 ‘땅’으로 옮겼으며, 문학적 이미지를 살리기 위해 ‘얼굴’을 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁגּוּ
  english_pob_choice: wandered
  chosen_korean: 방황하였고
  alternatives_korean:
  - 헤매었고
  - 길을 잃었고
  - 떠돌았고
  lexicon: HALOT
  rationale: שׁגה는 단순 이동이 아니라 길을 벗어나 헤매는 뜻이므로, 문맥의 상실감을 살리는 ‘방황하다’를 택했습니다.
- source_word: צֹאנִי
  english_pob_choice: my sheep
  chosen_korean: 내 양 떼
  alternatives_korean:
  - 내 양들
  - 내 양 무리
  lexicon: HALOT
  rationale: 직역하면 ‘내 양들’이지만, 집합적 목양 이미지를 자연스럽게 살리기 위해 ‘내 양 떼’로 옮겼습니다.
- source_word: וְעַל כָּל פְּנֵי הָאָרֶץ
  english_pob_choice: over the whole face of the earth
  chosen_korean: 온 땅의 온 얼굴에
  alternatives_korean:
  - 온 땅에
  - 땅 전체에
  - 온 세상에
  lexicon: HALOT
  rationale: פְּנֵי הָאָרֶץ의 문자적 이미지를 보존하기 위해 ‘얼굴’을 살렸고, POB의 주석처럼 지리 범위는 ‘땅’으로 두었습니다.
- source_word: וְאֵין דּוֹרֵשׁ וְאֵין מְבַקֵּשׁ
  english_pob_choice: with no one searching or seeking for them
  chosen_korean: 찾는 사람도 없고 찾는 이도 없습니다
  alternatives_korean:
  - 찾아보는 사람도 없고 구하는 이도 없습니다
  - 살피는 이도 없고 찾는 이도 없습니다
  lexicon: HALOT
  rationale: 두 분사 דּוֹרֵשׁ/מְבַקֵּשׁ의 중복된 근접어를 둘 다 살려, ‘searching/ seeking’에 대응하는 두 표현을 병렬로 유지했습니다.
theological_decisions:
- issue: ‘내 양 떼’의 의미 범위
  chosen_reading: 하나님이 버려진 양 떼를 탄식하시는 문맥을 드러내되, 본문 자체의 목양 비유는 과잉 해설하지 않았습니다.
  alternative_readings:
  - 일반적인 목가적 상실 묘사로만 처리
  - ‘이스라엘’ 등 대상을 본문에 명시
  rationale: 에스겔 34장의 전체 문맥상 ‘내 양 떼’는 실패한 목자들 아래 흩어진 하나님의 백성을 가리키므로, 비유를 유지하면서도 신학적 함의를 훼손하지 않는 번역을 택했습니다.
  doctrine_reference: 에스겔 34장 문맥 / 목자-양 비유
