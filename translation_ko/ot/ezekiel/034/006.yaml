translation:
  language: ko
  text: 나의 양 떼는 모든 산과 높은 모든 언덕에서 방황하였고[a], 나의 양 떼는 온 땅에 흩어졌습니다[b]. 찾아보는 이도 없고 찾는 이도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘방황하였고’는 히브리어 동사 שׁגה의 뜻을 살린 번역입니다. 대안으로 ‘길을 잃었고’ 또는 ‘헤매었고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘온 땅의 얼굴[표면]’이라고 합니다. ‘땅’은 문맥에 따라 ‘토지’로도 옮길 수 있으나, 여기서는 넓은 범위를 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁגּוּ
  english_pob_choice: wandered
  chosen_korean: 방황하였고
  alternatives_korean:
