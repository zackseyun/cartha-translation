  lexicon: HALOT
  rationale: פְּנֵי הָאָרֶץ의 문자적 이미지를 보존하기 위해 ‘얼굴’을 살렸고, POB의 주석처럼 지리 범위는 ‘땅’으로 두었습니다.
- source_word: וְאֵין דּוֹרֵשׁ וְאֵין מְבַקֵּשׁ
  english_pob_choice: with no one searching or seeking for them
  chosen_korean: 찾는 사람도 없고 찾는 이도 없습니다
  alternatives_korean:
  - 찾아보는 사람도 없고 구하는 이도 없습니다
  - 살피는 이도 없고 찾는 이도 없습니다
  lexicon: HALOT
  rationale: 두 분사 דּוֹרֵשׁ/מְבַקֵּשׁ의 중복된 근접어를 둘 다 살려, ‘searching/ seeking’에 대응하는 두 표현을 병렬로 유지했습니다.
theological_decisions:
- issue: ‘내 양 떼’의 의미 범위
  chosen_reading: 하나님이 버려진 양 떼를 탄식하시는 문맥을 드러내되, 본문 자체의 목양 비유는 과잉 해설하지 않았습니다.
  alternative_readings:
  - 일반적인 목가적 상실 묘사로만 처리
  - ‘이스라엘’ 등 대상을 본문에 명시
  rationale: 에스겔 34장의 전체 문맥상 ‘내 양 떼’는 실패한 목자들 아래 흩어진 하나님의 백성을 가리키므로, 비유를 유지하면서도 신학적 함의를 훼손하지 않는 번역을 택했습니다.
  doctrine_reference: 에스겔 34장 문맥 / 목자-양 비유
