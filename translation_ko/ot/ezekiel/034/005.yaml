  rationale: 에스겔 34장의 핵심은 이스라엘 지도자들을 목자로 비유하는 예언적 구조에 있습니다. 이를 풀어 쓰면 본문의 신학적 긴장이 약해집니다.
  doctrine_reference: '번역 원칙: 원문 우선, 은유 보존'
