id: EZK.31.6
reference: Ezekiel 31:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/סְעַפֹּתָ֤י/ו קִֽנְנוּ֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וְ/תַ֤חַת פֹּֽארֹתָי/ו֙ יָֽלְד֔וּ כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/בְ/צִלּ/וֹ֙ יֵֽשְׁב֔וּ כֹּ֖ל גּוֹיִ֥ם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/006.yaml
  text: In its branches all the birds of the heavens nested[a], and under its boughs all the beasts of the field gave birth, and in its shade all the many nations dwelt.
  footnotes:
  - marker: a
    text: Or 'all the many nations dwelt in its shadow.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 가지들 사이에 하늘의 모든 새가 둥지를 틀었고, 그 큰 가지들 아래에서 들의 모든 짐승이 새끼를 낳았으며, 그 그늘 아래에는 많은 나라들이 모두 살았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּסְעַפֹּתָיו
  english_pob_choice: in its branches
  chosen_korean: 그 가지들에
  alternatives_korean:
  - 그 가지들 가운데
  - 그 가지들 속에
  - 그 가지들 위에
  lexicon: HALOT
  rationale: סְעַפּוֹת은 큰 가지들/갈라진 가지들을 가리키므로, 장소를 자연스럽게 드러내는 ‘-에’로 옮기되 복수성을 살려 ‘그 가지들’로 렌더링했습니다.
- source_word: קִנְנוּ
  english_pob_choice: nested
  chosen_korean: 깃들었고
  alternatives_korean:
  - 둥지를 틀었고
  - 깃들였고
  lexicon: HALOT
  rationale: 새가 둥지를 트는 이미지를 살리면서도 현대 한국어에서 자연스러운 동사로 ‘깃들다’를 택했습니다.
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  english_pob_choice: all the beasts of the field
  chosen_korean: 들의 모든 짐승이
  alternatives_korean:
  - 들의 모든 들짐승이
  - 들의 모든 야생 짐승이
  lexicon: HALOT
  rationale: חַיַּת הַשָּׂדֶה의 관용적 의미를 살려 ‘들의 짐승’으로 옮겼고, 문맥상 짐승의 출산을 말하므로 ‘모든’으로 포괄성을 유지했습니다.
- source_word: וּבְצִלּוֹ
  english_pob_choice: in its shade
  chosen_korean: 그 그늘 아래에는
  alternatives_korean:
  - 그늘 속에는
  - 그늘에
  lexicon: HALOT
  rationale: צֵל은 단순한 어둠보다 보호와 거처의 이미지를 주므로, 한국어에서는 ‘그늘 아래’가 가장 자연스럽고 의미를 잘 드러냅니다.
- source_word: כֹּל גּוֹיִם רַבִּים
  english_pob_choice: all the many nations
  chosen_korean: 많은 나라의 모든 민족
  alternatives_korean:
  - 많은 민족
  - 모든 많은 나라들
  lexicon: HALOT
  rationale: גּוֹיִם은 ‘민족들/나라들’ 모두 가능하지만, 여기서는 집합적 다수성과 정치적 외연을 함께 살리기 위해 ‘많은 나라의 모든 민족’으로 옮겼습니다.
theological_decisions:
- issue: 확장된 나무 비유를 한국어 본문에서 해설하지 않을지 여부
  chosen_reading: 나무와 새, 짐승, 민족의 이미지를 그대로 유지하고, 상징적 의미를 본문 안에서 풀이하지 않았습니다.
  alternative_readings:
  - 앗수르나 제국을 본문에 직접 풀어 쓰기
  - 민족들의 피난처라는 해석을 본문에 주입하기
  rationale: 이 절은 장대한 비유의 일부이므로, 번역은 이미지를 보존하고 해석은 독자가 문맥에서 따라가게 하는 편이 원문 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §1, §3
