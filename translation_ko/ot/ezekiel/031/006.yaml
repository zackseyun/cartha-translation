    issue: ‘많은 나라의 모든 민족’이 כָּל גּוֹיִם רַבִּים의 구조와 지시 대상을 바꿉니다.
    rationale: 히브리어의 גּוֹיִם은 복수의 나라/민족들이며, ‘많은 나라의 모든 민족’은 각 나라 내부의 모든 민족을 뜻하는 것으로 읽힐 수 있습니다.
  - severity: medium
    issue: קִנְנוּ를 ‘깃들었고’로 번역하여 둥지를 튼다는 어휘적 이미지를 약화합니다.
    rationale: 문맥상 새에 쓰인 קנן은 특히 둥지를 만들거나 틀다는 뜻입니다.
  - severity: low
