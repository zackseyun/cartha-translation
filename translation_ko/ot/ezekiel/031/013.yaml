  rationale: 새가 나무에 자리를 잡는 장면이므로 ‘깃들다’가 ‘dwelt’의 거주·정착 의미와 이미지 모두를 자연스럽게 전달합니다.
- source_word: עוֹף הַשָּׁמַיִם
  english_pob_choice: the birds of the heavens
  chosen_korean: 하늘의 모든 새들
  alternatives_korean:
