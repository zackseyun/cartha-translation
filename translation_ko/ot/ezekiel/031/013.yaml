  text: עַל מַפַּלְתּ֥/וֹ יִשְׁכְּנ֖וּ כָּל ע֣וֹף הַ/שָּׁמָ֑יִם וְ/אֶל פֹּארֹתָ֣י/ו הָי֔וּ כֹּ֖ל חַיַּ֥ת הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/013.yaml
  text: On its fallen trunk all the birds of the heavens will dwell[b][a], and on its boughs will be all the beasts of the field.
  footnotes:
  - marker: a
    text: Or 'On its downfall all the birds of the heavens will dwell.' The Hebrew noun can be rendered more abstractly, but the tree image in context supports the concrete sense 'fallen trunk.'
    reason: lexical_alternative
  - marker: b
    text: Or 'its branches.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 무너진 줄기 위에 하늘의 모든 새들이 깃들고[a], 그 가지들 위에는 들의 모든 짐승들이 있을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 몰락 위에 하늘의 모든 새들이 깃들 것입니다.’ 히브리어 명사는 보다 추상적으로도 옮길 수 있지만, 문맥의 나무 비유가 구체적 의미를 지지합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 큰 가지들.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפַּלְתּוֹ
  english_pob_choice: its fallen trunk
  chosen_korean: 그의 무너진 줄기
  alternatives_korean:
  - 그의 붕괴
  - 그의 몰락
  - 그의 무너진 몸통
  lexicon: HALOT
  rationale: 시적-수목 비유 안에서 추상적인 ‘몰락’보다 무너진 나무의 형체를 살린 ‘무너진 줄기’가 원문의 이미지를 더 잘 보존합니다.
- source_word: יִשְׁכְּנוּ
  english_pob_choice: will dwell
  chosen_korean: 깃들고
  alternatives_korean:
  - 거하고
  - 머무르고
  - 살고
  lexicon: HALOT
  rationale: 새가 나무에 자리를 잡는 장면이므로 ‘깃들다’가 ‘dwelt’의 거주·정착 의미와 이미지 모두를 자연스럽게 전달합니다.
- source_word: עוֹף הַשָּׁמַיִם
  english_pob_choice: the birds of the heavens
  chosen_korean: 하늘의 모든 새들
  alternatives_korean:
  - 하늘의 새들
  - 하늘의 모든 날짐승
  lexicon: HALOT
  rationale: 히브리어의 소유격 표현을 살리되 한국어에서는 자연스러운 관용으로 바꾸어 ‘하늘의 모든 새들’로 옮겼습니다.
- source_word: פֹּארֹתָיו
  english_pob_choice: its boughs
  chosen_korean: 그 가지들
  alternatives_korean:
  - 그 큰 가지들
  - 그 넓게 뻗은 가지들
  - 그 지엽들
  lexicon: HALOT
  rationale: 영어 POB의 ‘boughs’는 큰 가지를 가리키지만, 한국어에서는 ‘가지들’이 가장 자연스럽고 본문의 나무 이미지도 유지합니다.
theological_decisions:
- issue: 예언적 시제의 한국어 처리
  chosen_reading: 미래형으로 옮겨 ‘깃들고 … 있을 것입니다’라고 했습니다.
  alternative_readings:
  - 과거형으로 옮겨 ‘깃들었습니다’
  - 현재형으로 옮겨 ‘깃듭니다’
  rationale: 히브리어 형태는 완료형과 미완료형이 섞여 있지만, 문맥상 무너진 나무의 뒤따를 결과를 예언적으로 진술하므로 한국어에서는 미래를 사용하는 것이 가장 분명합니다.
  doctrine_reference: 예언 문맥의 미래적 진술
