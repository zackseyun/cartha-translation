  source_fidelity: 히브리어의 공간 표현(‘그 쓰러진 것 위에… 그 가지들을 향하여/위에’)과 두 ‘모든’ 수식어를 대체로 충실히 반영했습니다. מַפַּלְתּוֹ는 문맥상 쓰러진 나무의 구체적 잔해를 가리킬 수 있으므로 ‘쓰러진 줄기’는 안전한 번역입니다. 예언 문맥에서 יִשְׁכְּנוּ와 הָיוּ를 미래로 처리한 것도 가능합니다.
  naturalness: 초안의 ‘깃들고 … 있을 것입니다’는 앞 절이 단순 연결형으로 남아 미래의 평행 관계가 다소 불균형합니다. ‘깃들 것이며’로 고치면 현대 한국어 합쇼체 문장으로 자연스럽고 두 절의 미래성이 분명해집니다. ‘무너진 줄기’보다 나무가 넘어지는 장면에는 ‘쓰러진 줄기’가 더 자연스럽습니다.
  terminology: ‘하늘의 모든 새들’, ‘들의 모든 짐승들’은 원문의 포괄 표현과 예언서의 문체를 잘 살립니다. פֹּארֹתָיו는 단순한 잔가지보다 굵고 큰 가지를 뜻하므로 ‘큰 가지들’이 적절합니다.
