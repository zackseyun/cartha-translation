language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְמַ֡עַן אֲשֶׁר֩ לֹא יִגְבְּה֨וּ בְ/קוֹמָתָ֜/ם כָּל עֲצֵי מַ֗יִם וְ/לֹֽא יִתְּנ֤וּ אֶת צַמַּרְתָּ/ם֙ אֶל בֵּ֣ין עֲבֹתִ֔ים וְ/לֹֽא יַעַמְד֧וּ אֵלֵי/הֶ֛ם בְּ/גָבְהָ֖/ם כָּל שֹׁ֣תֵי מָ֑יִם כִּֽי כֻלָּ/ם֩ נִתְּנ֨וּ לַ/מָּ֜וֶת אֶל אֶ֣רֶץ תַּחְתִּ֗ית בְּ/ת֛וֹךְ בְּנֵ֥י אָדָ֖ם אֶל י֥וֹרְדֵי בֽוֹר־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/014.yaml
  text: so that all the trees by the waters may not grow tall in their height[a], and may not set their treetop among the clouds, and that none of the water-drinkers may stand over them in their height; for all of them are given over to death, to the land below, among the sons of man[b], with those who go down to the pit.
  footnotes:
  - marker: a
    text: Or 'into the midst of the thick boughs/foliage.' The Hebrew עֲבֹתִים can be understood as dense growth rather than clouds.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of 'may stand over them in their height' is difficult; it may mean that no other well-watered trees should exalt themselves alongside or above them.
    reason: alternative_reading
translation:
  language: ko
  text: 이것은 모든 물가의 나무가 키가 높아지지 못하고, 그 꼭대기를 구름들 사이에 두지 못하며, 물을 마시는 이들 가운데 그 높이로 자신을 드러내지 못하게 하려는 것입니다. 이는 그들 모두가 죽음에 넘겨져 아래 땅으로, 사람의 자손들 가운데로, 구덩이로 내려가는 이들 가운데로 갔기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  english_pob_choice: so that
  chosen_korean: 이것은 … 하려는 것입니다
  alternatives_korean:
  - …하도록
  - …하기 위함입니다
  lexicon: HALOT
  rationale: 목적/결과를 나타내는 표현을 한국어에서 자연스럽게 풀어 주되, 원문의 목적성을 유지했습니다.
- source_word: וְלֹא יַעַמְדוּ אֵלֵיהֶם בְּגָבְהָם כָּל שֹׁתֵי מָיִם
  english_pob_choice: and that none of the water-drinkers may stand over them in their height
  chosen_korean: 물을 마시는 이들 가운데 그 높이로 자신을 드러내지 못하다
  alternatives_korean:
  - 물 마시는 자들이 그 높이 위에 서지 못하다
  - 물을 마시는 이들 가운데 그들보다 높이 서지 못하다
  lexicon: HALOT
  rationale: 히브리어의 압축되고 난해한 구문을 직역적으로만 옮기기보다, POB의 해석을 따라 ‘높이로 자신을 드러내다’로 옮겨 비교·우월의 뉘앙스를 살렸습니다.
- source_word: שֹׁתֵי מָיִם
  english_pob_choice: the water-drinkers
  chosen_korean: 물을 마시는 이들
  alternatives_korean:
  - 물 마시는 자들
  - 물 마시는 자들(물가의 나무들)
  lexicon: HALOT
  rationale: 문자적으로 ‘물의 마시는 자들’이라는 이미지를 살리면서도, 한국어에서 자연스럽고 해석을 과도하게 고정하지 않는 표현으로 옮겼습니다.
- source_word: יֹרְדֵי בוֹר
  english_pob_choice: those who go down to the pit
  chosen_korean: 구덩이로 내려가는 이들
  alternatives_korean:
  - 구덩이로 내려가는 자들
  - 무덤으로 내려가는 이들
  lexicon: HALOT
  rationale: בּוֹר의 핵심 이미지를 ‘구덩이’로 보존해, 죽음/음부의 은유를 지나치게 평탄화하지 않았습니다.
- source_word: בְּתוֹךְ בְּנֵי אָדָם
  english_pob_choice: among the sons of man
  chosen_korean: 사람의 자손들 가운데
  alternatives_korean:
  - 인간의 자손들 가운데
  - 사람들 가운데
  lexicon: HALOT
  rationale: 형식상 ‘사람의 자손들’을 유지해 히브리어의 문구와 인간의 유한성을 드러내는 대비를 살렸습니다.
theological_decisions:
- issue: 난해한 비교 구문 וְלֹא יַעַמְדוּ אֵלֵיהֶם בְּגָבְהָם
  chosen_reading: ‘그 높이로 자신을 드러내지 못하다’로 의미를 정리하되, 비교·우월의 긴장을 유지했습니다.
  alternative_readings:
  - ‘그들 위에 서지 못하다’
  - ‘그 높이에서 그들과 나란히 서지 못하다’
  rationale: 원문은 다른 물가의 나무들이 높이에서 자라며 우쭐대는 것을 금하는 문맥이므로, 해석을 완전히 평준화하지 않고 POB의 주석적 이해를 한국어로 반영했습니다.
  doctrine_reference: Ezekiel 31 문맥의 교만한 강대국 심판 이미지
- issue: 죽음과 아래 땅, 구덩이의 삼중 표현
  chosen_reading: ‘죽음에 넘겨져 아래 땅으로 … 구덩이로 내려가는 이들’로 삼중 이미지를 보존했습니다.
  alternative_readings:
  - ‘죽음과 음부로’
  - ‘죽음에 이르러 땅 아래로’
  rationale: 원문은 단순한 사망 진술이 아니라 낮아짐/추락의 묵시적 이미지를 겹쳐 말하므로, 이를 하나로 합치지 않고 각각 살렸습니다.
  doctrine_reference: 심판과 낮아짐의 예언적 상징
