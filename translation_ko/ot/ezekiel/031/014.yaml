    rationale: יַעַמְדוּ는 기본적으로 ‘서다’이며, 자기 과시를 뜻하는 동사가 아닙니다. 문맥상 교만의 함의는 있으나, 본문에는 ‘높이 서다’를 유지하는 편이 안전합니다.
  - severity: medium
