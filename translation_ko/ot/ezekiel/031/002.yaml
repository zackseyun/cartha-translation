  text: בֶּן אָדָ֕ם אֱמֹ֛ר אֶל פַּרְעֹ֥ה מֶֽלֶךְ מִצְרַ֖יִם וְ/אֶל הֲמוֹנ֑/וֹ אֶל מִ֖י דָּמִ֥יתָ בְ/גָדְלֶֽ/ךָ־־־־־׃
base_translation:
