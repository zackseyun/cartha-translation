  text: 'Son of man, say to Pharaoh king of Egypt and to his multitude: Whom are you like in your greatness?'
translation:
  language: ko
  text: 「인자야, 이집트 왕 바로와 그의 무리에게 말하십시오. ‘당신의 위대함에 비길 자가 누구입니까?’」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인자여
  lexicon: 인자
  rationale: 에스겔의 예언자 호칭으로 굳어진 מקור을 살리되, 현대 한국어에서 자연스럽고 직접적인 부름말로 처리했습니다.
- source_word: וְאֶל הֲמוֹנֹו
  english_pob_choice: and to his multitude
  chosen_korean: 그의 무리에게
  alternatives_korean:
  - 그의 군중에게
  - 그의 떼에게
  lexicon: 무리
  rationale: 히브리어 הֲמוֹן의 집합적 의미를 살려 ‘무리’로 옮기되, 대상이 바로 개인뿐 아니라 그에게 속한 집단임을 드러냈습니다.
- source_word: מִי דָּמִיתָ
  english_pob_choice: Whom are you like
  chosen_korean: 비할 자가 누구냐?
  alternatives_korean:
  - 누구와 같으냐?
  - 무엇에 비기겠느냐?
  lexicon: 비하다
  rationale: 직역적 ‘누구와 같으냐’보다, 우월성/비교의 질문을 강하게 드러내는 한국어로 자연스럽게 옮겼습니다.
- source_word: בְּגָדְלֶךָ
  english_pob_choice: in your greatness
  chosen_korean: 너의 위대함에
  alternatives_korean:
  - 너의 عظ대함 속에서
  - 네 큰 위세에
  lexicon: 위대함
  rationale: 문맥상 애굽의 자만한 웅대함을 가리키므로, 단순한 크기보다 위세와 장엄함을 포함하는 ‘위대함’을 택했습니다.
theological_decisions:
- issue: 예언자 호칭의 존칭 처리
  chosen_reading: 직접 인용된 하나님의 말씀 안에서도 에스겔의 호칭은 ‘인자야’로 두어 예언적 부름의 긴장을 유지했습니다.
  alternative_readings:
  - 인자여
  - 사람아
  rationale: 본문의 소명 호칭을 부드럽게 바꾸면 에스겔서의 예언자-하나님 대화의 선명함이 약해집니다.
  doctrine_reference: 예언자 소명/신탁 문체
