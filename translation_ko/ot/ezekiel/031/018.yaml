base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/018.yaml
  text: Whom were you like in glory and greatness among the trees of Eden? Yet you shall be brought down with the trees of Eden to the land below; you shall lie among the uncircumcised, with those slain by the sword. This is Pharaoh and all his multitude[a], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'the lower earth' or 'the netherworld.' The Hebrew refers to the realm below, the place of the dead.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 영광과 위대함으로 에덴의 나무들 가운데 누구와 이처럼 같았습니까? 그러나 당신은 에덴의 나무들과 함께 아래 땅[a]으로 끌려 내려갈 것이며, 할례받지 않은 자들 한가운데서 칼에 죽임을 당한 자들과 함께 누울 것입니다. 이것이 바로 파라오와 그의 모든 무리입니다. 주 야훼께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낮은 땅’ 또는 ‘저승’. 히브리어는 아래에 있는 죽은 자들의 영역을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל מִי דָמִיתָ כָּכָה
  english_pob_choice: Whom were you like / thus
  chosen_korean: 너는 … 누구와 같았느냐
  alternatives_korean:
  - 너는 … 누구와 같았습니까
  - 너는 … 누구를 닮았느냐
  lexicon: HALOT
  rationale: דמה의 비교 질문을 자연스러운 한국어로 옮기되, כָּכָה의 강조는 별도 단어 없이 문맥과 어순으로 살렸습니다.
- source_word: כָּבֹוד וּבְגֹדֶל
  english_pob_choice: in glory and greatness
  chosen_korean: 영광과 위대함으로
  alternatives_korean:
  - 영광과 크기로
  - 영광과 عظ대함으로
  lexicon: HALOT
  rationale: 왕적 찬란함과 규모를 함께 담는 표현으로, 단순한 물리적 ‘크기’보다 문맥상의 위세를 드러내는 ‘위대함’을 택했습니다.
- source_word: אֶרֶץ תַּחְתִּית
  english_pob_choice: the land below
  chosen_korean: 아래 땅
  alternatives_korean:
  - 저 아래 땅
  - 하부의 땅
  - 음부
  lexicon: HALOT
  rationale: 본문의 아래쪽 공간 이미지를 유지하면서도, 후대 교리 용어인 ‘음부’로 좁히지 않기 위해 직역에 가까운 ‘아래 땅’을 사용했습니다.
- source_word: בְּתוֹךְ עֲרֵלִים
  english_pob_choice: among the uncircumcised
  chosen_korean: 할례받지 않은 자들 한가운데서
  alternatives_korean:
  - 할례받지 않은 자들 가운데
  - 할례받지 않은 자들 사이에서
  lexicon: HALOT
  rationale: 수치와 경계선 침범의 뉘앙스를 살리기 위해 단순 ‘가운데’보다 ‘한가운데서’를 택했습니다.
- source_word: חַלְלֵי חֶרֶב
  english_pob_choice: those slain by the sword
  chosen_korean: 칼에 죽임을 당한 자들
  alternatives_korean:
  - 칼에 쓰러진 자들
  - 칼에 죽은 자들
  lexicon: HALOT
  rationale: ‘찌름을 당한 자들’ 같은 경직된 직역보다, 전쟁사 문맥에서 자연스럽고 분명한 ‘칼에 죽임을 당한 자들’로 옮겼습니다.
- source_word: הוּא פַרְעֹה וְכָל הֲמוֹנֹה
  english_pob_choice: This is Pharaoh and all his multitude
  chosen_korean: 이것이 바로 파라오와 그의 모든 무리다
  alternatives_korean:
  - 이것이 파라오와 그의 모든 무리다
  - 바로 이것이 파라오와 그의 모든 무리다
  lexicon: HALOT
  rationale: הוּא의 지시성을 살려 결론부를 단정적으로 맺되, הֲמוֹן의 집단성을 ‘무리’로 표현했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 하나님 야훼
  lexicon: HALOT
  rationale: 직접화법이 아닌 예언 결구로서 한국어 예배·성경 문체에 맞는 ‘주 하나님’을 사용하되, 본문의 공식 선언성을 유지했습니다.
theological_decisions:
- issue: אֶרֶץ תַּחְתִּית의 범위
  chosen_reading: ‘아래 땅’으로 옮겨, 죽은 자들의 영역을 암시하되 특정 종말론 지리를 확정하지 않았습니다.
  alternative_readings:
  - 음부
  - 저승
  - 저 아래 세계
  rationale: 히브리어는 ‘아래쪽/밑’의 공간 이미지를 말할 뿐이므로, 과도한 교리화 없이 시적·심판적 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
