- from: 너는 영광과 위대함으로 에덴의 나무들 가운데서 누구와 같았느냐? 그러나 너는 에덴의 나무들과 함께 아래 땅으로 끌려 내려갈 것이며, 할례받지 않은 자들 한가운데서 칼에 죽임을 당한 자들과 함께 누울 것이다. 이것이 바로 파라오와 그의 모든 무리다. 주 하나님께서 말씀하십니다.[a]
