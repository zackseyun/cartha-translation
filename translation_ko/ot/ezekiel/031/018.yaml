  source_fidelity: 히브리어의 비교 질문, 에덴의 나무 비유, 아래로 내려감, 할례받지 않은 자들과 칼에 죽은 자들 사이에 눕는 심판, 그리고 파라오와 그의 무리에 대한 결론은 대체로 충실합니다. 다만 כָּכָה(‘이처럼/그렇게’)의 강조를 한국어에서도 드러내는 것이 안전하며, אֲדֹנָי יְהוִה는 제공된 POB 명명 방침에 따라 ‘주 야훼’로 옮기는 것이 적절합니다.
  naturalness: 초안의 ‘같았느냐’, ‘무리다’는 해라체이고 ‘말씀하십니다’는 합쇼체여서 목표 등록(현대 격식체 합쇼체)이 일관되지 않습니다. 전체를 현대 격식체로 통일하고, 각주 표지는 ‘아래 땅’에 직접 붙이는 편이 독자에게 명확합니다.
  terminology: ‘파라오’, ‘에덴’, ‘할례받지 않은 자들’, ‘칼에 죽임을 당한 자들’은 적절합니다. ‘아래 땅’은 지하 세계를 특정 교리 용어로 단정하지 않아 본문의 모호성을 보존합니다. 신명은 ‘주 야훼’로 통일합니다.
  issues:
