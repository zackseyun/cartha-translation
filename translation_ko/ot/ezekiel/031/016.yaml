  source_fidelity: 원문의 גּוֹיִם은 ‘난민들’이 아니라 ‘민족들/나라들’입니다. 또한 첫 절은 ‘그가 무너지는 소리 때문에 내가 민족들을 떨게 하였다’라는 하나님의 발화이며, 그를 스올로 ‘내려보낸’ 행위와 연결됩니다. 개정문은 이러한 주어, 인과 관계, 그리고 שְׁאוֹל·בּוֹר의 죽음/지하 세계 이미지를 보존합니다.
  naturalness: 초안의 ‘그를 … 함께 하였을 때’는 한국어 문장으로 불완전하고 의미도 불명확합니다. 이를 ‘구덩이로 내려가는 자들과 함께 내려보냈을 때’로 고쳐 자연스럽고 명료한 합쇼체 문장으로 만들었습니다. ‘물을 마시는 모든 것’은 나무 비유를 유지하면서도 원문의 포괄 표현을 보존합니다.
  terminology: ‘스올’은 음역으로 유지하고 대안 번역을 각주로 제시했습니다. ‘민족들’, ‘구덩이’, ‘땅 아래’는 각각 גּוֹיִם, בּוֹר, אֶרֶץ תַּחְתִּית에 충실합니다. 에덴과 레바논의 나무 이미지는 정치적 비유를 과도하게 해설하지 않고 보존했습니다.
