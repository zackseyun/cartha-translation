base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/016.yaml
  text: At the sound of his fall I made nations quake[a], when I brought him down to Sheol with those who go down to the pit; and all the trees of Eden, the choice and best of Lebanon, all that drink water[c][b], were comforted in the earth beneath.
  footnotes:
  - marker: a
    text: Or 'to the grave' or 'to the underworld' for 'to Sheol.'
    reason: lexical_alternative
  - marker: b
    text: Or 'were consoled' or 'took comfort.' The sense may be that the other fallen powers found grim consolation when this great tree also descended.
    reason: lexical_alternative
  - marker: c
    text: Literally 'the lower earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 무너지는 소리에 내가 민족들을 떨게 하였습니다. 내가 그를 스올[a]로, 구덩이로 내려가는 자들과 함께 내려보냈을 때, 에덴의 모든 나무, 곧 레바논의 빼어나고 좋은 모든 것, 물을 마시는 모든 것이 땅 아래[c]에서 위로를 받았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤’ 또는 ‘지하 세계’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘위로받았다’ 또는 ‘위안을 얻었다’. 다른 무너진 권력들이 이 큰 나무도 내려가자 암울한 위안을 얻었다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로 ‘낮은 땅’.
    reason: lexical_alternative
