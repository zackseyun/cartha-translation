source:
  edition: WLC
  text: יָפֶ֣ה עֲשִׂיתִ֔י/ו בְּ/רֹ֖ב דָּֽלִיּוֹתָ֑י/ו וַ/יְקַנְאֻ֨/הוּ֙ כָּל עֲצֵי עֵ֔דֶן אֲשֶׁ֖ר בְּ/גַ֥ן הָ/אֱלֹהִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/009.yaml
  text: I made it beautiful with its many branches[a], and all the trees of Eden that were in the garden of God envied it.
  footnotes:
  - marker: a
    text: Or, 'I made him beautiful ... and all the trees of Eden ... envied him,' if the underlying referent is foregrounded as Assyria/the king rather than the tree image itself.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 그것을 그 많은 가지로 아름답게 만들었습니다. 하나님의 동산에 있는 에덴의 모든 나무가 그것을 시기하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 배후의 지시 대상을 앗수르 또는 그 통치자로 드러내어, ‘내가 그를 아름답게 만들었습니다. 하나님의 동산에 있는 에덴의 모든 나무가 그를 시기하였습니다’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יָפֶה ... עֲשִׂיתִי/ו
  english_pob_choice: I made it beautiful
  chosen_korean: 내가 그것을 ... 아름답게 만들었습니다
  alternatives_korean:
  - 내가 그것을 아름답게 하였습니다
  - 내가 그것을 아름답게 지었습니다
  lexicon: HALOT
  rationale: 히브리어 완료형 1인칭 단수는 하나님의 선언적 행위를 나타내므로, 현대 문체에서 자연스러운 '만들었습니다'로 옮기되 미적 상태는 '아름답게'로 보존했습니다.
- source_word: בְּרֹב דָּלִיּוֹתָיו
  english_pob_choice: with its many branches
  chosen_korean: 많은 가지로
  alternatives_korean:
  - 가지의 많음으로
  - 풍성한 가지들로
  lexicon: HALOT
  rationale: בְּרֹב는 수단/상태를 아우르는 표현이므로 직역보다 '많은 가지로'가 한국어에서 더 자연스럽고, 가지의 풍성함이라는 의미를 유지합니다.
- source_word: וַיְקַנְאֻהוּ
  english_pob_choice: envied it
  chosen_korean: 그것을 질투하였습니다
  alternatives_korean:
  - 그것을 부러워하였습니다
  - 그것을 시기하였습니다
  lexicon: HALOT
  rationale: קנא의 핵심은 단순한 부러움보다 경쟁적 질투/시기이므로, 현대 문어에서는 '질투하다'가 가장 직접적입니다.
- source_word: כָּל עֲצֵי עֵדֶן ... בְּגַן הָאֱלֹהִים
  english_pob_choice: all the trees of Eden that were in the garden of God
  chosen_korean: 에덴의 모든 나무들, 곧 하나님의 동산에 있던 나무들
  alternatives_korean:
  - 하나님의 동산에 있던 에덴의 모든 나무들
  - 에덴의 나무들 모두, 하나님의 동산에 있던 나무들
  lexicon: HALOT
  rationale: 히브리어의 관계절을 한국어에서는 동격적 설명으로 풀어주어, 에덴-하나님의 동산이라는 상징적 장소성을 분명하게 살렸습니다.
theological_decisions:
- issue: '대상 지시: 나무 이미지와 앗수르/왕의 배후 대상'
  chosen_reading: 주어를 '그것'으로 유지하여 나무 비유를 본문 표면에 그대로 남겼습니다.
  alternative_readings:
  - '''그를''로 옮겨 앗수르/왕을 전면에 드러내는 읽기'
  rationale: 문맥상 배후 지시 대상은 있지만, 이 절 자체는 의도적으로 수목 은유를 지속하므로 한국어도 이를 보존하는 편이 본문의 수사와 긴장을 더 잘 드러냅니다.
  doctrine_reference: optimal equivalence; metaphor preservation
