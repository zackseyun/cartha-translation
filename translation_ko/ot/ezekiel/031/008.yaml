  yaml_path: translation/ot/ezekiel/031/008.yaml
  text: Cedars did not overshadow it in the garden of God[a]; cypresses did not compare with its boughs, and plane trees were not like its branches[b]. No tree in the garden of God compared with it in its beauty.
  footnotes:
  - marker: a
    text: Or 'in God's garden.' The Hebrew reads literally 'in the garden of God,' an expression that evokes Eden.
    reason: lexical_alternative
  - marker: b
    text: '''Plane trees'' is the likely sense; traditional translations often read ''chestnut trees.'''
    reason: alternative_reading
translation:
  language: ko
  text: 백향목들도 하나님의 동산에서[a] 그것을 가리지 못했고, 사이프러스나무들도 그 큰 가지들과 견줄 수 없었으며, 버즘나무들도 그 가지들과 같지 못했습니다.[b] 하나님의 동산의 어떤 나무도 그 아름다움에서 그것과 같지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 정원에서’. 히브리어는 문자적으로 ‘하나님의 동산에서’라고 되어 있으며, 에덴을 떠올리게 하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘버즘나무들’은 히브리어 수종명의 유력한 뜻입니다. 전통 번역은 흔히 ‘밤나무들’로 옮겼습니다.
    reason: alternative_reading
