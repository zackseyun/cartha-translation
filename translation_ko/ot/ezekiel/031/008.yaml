  source_fidelity: 개정이 필요합니다. 초안의 ‘레바논의’는 히브리어 본문에 없으므로 삭제해야 합니다. 또한 בְּרוֹשִׁים에 대해 영어 POB가 채택한 ‘cypresses’를 ‘노간주나무’로 옮긴 것은 수종을 달리 특정하는 번역이며, עַרְמֹנִים의 유력한 뜻인 plane trees도 ‘소귀나무’가 아니라 ‘버즘나무’로 옮기는 것이 적절합니다. סְעַפֹּתָיו(큰 가지들)와 פֹארֹתָיו(가지들)의 대비도 바로잡았습니다.
