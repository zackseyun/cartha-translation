  text: אֲרָזִ֣ים לֹֽא עֲמָמֻ/הוּ֮ בְּ/גַן אֱלֹהִים֒ בְּרוֹשִׁ֗ים לֹ֤א דָמוּ֙ אֶל סְעַפֹּתָ֔י/ו וְ/עַרְמֹנִ֥ים לֹֽא הָי֖וּ כְּ/פֹֽארֹתָ֑י/ו כָּל עֵץ֙ בְּ/גַן אֱלֹהִ֔ים לֹא דָמָ֥ה אֵלָ֖י/ו בְּ/יָפְיֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/008.yaml
  text: Cedars did not overshadow it in the garden of God[a]; cypresses did not compare with its boughs, and plane trees were not like its branches[b]. No tree in the garden of God compared with it in its beauty.
  footnotes:
  - marker: a
    text: Or 'in God's garden.' The Hebrew reads literally 'in the garden of God,' an expression that evokes Eden.
    reason: lexical_alternative
  - marker: b
    text: '''Plane trees'' is the likely sense; traditional translations often read ''chestnut trees.'''
    reason: alternative_reading
translation:
  language: ko
  text: 레바논의 백향목들은 하나님의 동산에서 그것을 가리지 못했고, 노간주나무들도 그것의 가지와 견주지 못했으며, 소귀나무들도 그것의 큰 가지와 같지 못했습니다. 하나님의 동산의 어떤 나무도 그 아름다움에서 그것과 같지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 동산에서’. 히브리어는 문자적으로 ‘하나님의 동산에서’라고 되어 있으며, 에덴을 떠올리게 하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘소귀나무들’은 ‘plane trees’에 해당할 가능성이 높습니다. 전통 번역은 흔히 ‘밤나무들’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרָזִים
  english_pob_choice: Cedars
  chosen_korean: 백향목들
  alternatives_korean:
  - 삼나무들
  - 향목들
  lexicon: HALOT
  rationale: אֲַרָזִים는 흔히 백향목으로 옮기는 나무 이름이며, 문맥의 고귀한 비교 이미지에 맞습니다.
- source_word: עֲמָמֻהוּ
  english_pob_choice: did not overshadow it
  chosen_korean: 그것을 가리지 못했고
  alternatives_korean:
  - 그것을 덮지 못했고
  - 그것을 가리지 못하였고
  lexicon: HALOT
  rationale: 시적 대비에서 ‘가리다’가 나무의 수관이 시야를 덮는 이미지를 자연스럽게 살리며, ‘overshadow’의 뜻을 한국어로 간결하게 반영합니다.
- source_word: בְּגַן אֱלֹהִים
  english_pob_choice: in the garden of God
  chosen_korean: 하나님의 동산에서
  alternatives_korean:
  - 하나님의 정원에서
  - 하나님의 동산 안에서
  lexicon: HALOT
  rationale: 직역성을 유지하되 한국어에서 자연스러운 장소 표현으로 옮겼습니다. ‘동산’은 에덴을 암시하는 원문 효과도 보존합니다.
- source_word: בְּרוֹשִׁים
  english_pob_choice: cypresses
  chosen_korean: 노간주나무들
  alternatives_korean:
  - 사이프러스나무들
  - 잣나무들
  lexicon: HALOT
  rationale: 수종은 확정적이지 않지만, 한국어에서는 전통 번역의 관습과 현대적 자연스러움 사이에서 ‘노간주나무들’을 택해 비교 목록의 수목 이미지를 살렸습니다.
- source_word: סְעַפֹּתָיו
  english_pob_choice: its boughs
  chosen_korean: 그것의 가지
  alternatives_korean:
  - 그것의 큰 가지
  - 그것의 굵은 가지
  lexicon: HALOT
  rationale: 큰 갈래의 가지를 가리키는 말로 보이므로, 뒤의 ‘큰 가지’와 구별되는 보다 일반적인 ‘가지’를 사용했습니다.
- source_word: עַרְמֹנִים
  english_pob_choice: plane trees
  chosen_korean: 소귀나무들
  alternatives_korean:
  - 플레인나무들
  - 양버즘나무들
  lexicon: HALOT
  rationale: 영어 POB가 전통적 ‘chestnut trees’보다 식물학적으로 더 유력한 ‘plane trees’를 택한 점을 반영해, 한국어에서도 통용 가능한 수종명으로 옮겼습니다.
- source_word: פֹארֹתָיו
  english_pob_choice: its branches
  chosen_korean: 그것의 큰 가지
  alternatives_korean:
  - 그것의 가지들
  - 그것의 잔가지들
  lexicon: HALOT
  rationale: 앞의 סְעַפֹּתָיו와 어휘를 구분해, 보다 크고 펼쳐진 가지의 이미지를 드러내도록 옮겼습니다.
theological_decisions:
- issue: ‘하나님의 동산’의 처리
  chosen_reading: 본문에는 ‘하나님의 동산’이라고 그대로 두고, 에덴을 본문 안에서 명시적으로 풀지 않았습니다.
  alternative_readings:
  - 에덴
  - 하나님의 에덴
  rationale: 히브리어는 직역하면 ‘하나님의 동산’이며, 에덴을 연상시키지만 본문 자체의 표현을 보존하는 편이 예언적 이미지와 해석의 여지를 함께 지킵니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
