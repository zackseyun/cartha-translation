    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 임하여
  alternatives_korean:
  - 있었습니다
  - 일어났습니다
  lexicon: HALOT
  rationale: 히브리어 서술·날짜 공식의 도입을 한국어에서 자연스럽게 살리기 위해, 사건 발생보다는 계시 도래를 드러내는 동사로 옮겼습니다.
- source_word: בְּאַחַת עֶשְׂרֵה שָׁנָה
  english_pob_choice: in the eleventh year
  chosen_korean: 열한째 해
  alternatives_korean:
  - 열한 해
  - 열한 번째 해
  lexicon: HALOT
  rationale: 연대 표기를 현대 한국어의 자연스러운 서술로 압축하되, 순서 수사를 유지했습니다.
- source_word: בַּשְּׁלִישִׁי
  english_pob_choice: in the third month
  chosen_korean: 셋째 달
  alternatives_korean:
  - 세 번째 달
  - 제삼월
  lexicon: HALOT
  rationale: 히브리어 달수 표현을 직설적으로 옮겨, 본문의 달력 정보가 분명히 드러나게 했습니다.
- source_word: הָיָה דְבַר יְהוָה אֵלַי לֵאמֹר
  english_pob_choice: the word of Yahweh came to me, saying
  chosen_korean: 야훼의 말씀이 내게 임하여 말씀하셨습니다
  alternatives_korean:
  - 야훼의 말씀이 내게 와서 말씀하셨습니다
  - 야훼의 말씀이 내게 임하여 이르셨습니다
  lexicon: HALOT
  rationale: 예언서의 관용구를 따라 '말씀이 임하다'를 유지했고, 이어지는 직접화법 도입은 현대 합쇼체에 맞게 정리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신성호칭을 '야훼'로 옮겨, 전통적 대체어인 '주님'과 구별했습니다.
theological_decisions:
- issue: 예언 공식에서 계시의 도래를 어떻게 표현할지
  chosen_reading: '''말씀이 내게 임하여''로 옮겨, 단순한 시간 경과가 아니라 야훼의 말씀의 주도적 도래를 드러냈습니다.'
  alternative_readings:
  - '''말씀이 내게 왔습니다'''
  - '''말씀이 내게 임했습니다'''
  rationale: 히브리어 הָיָה דְבַר יְהוָה는 예언자에게 임하는 계시 공식을 나타내므로, 한국어에서도 계시의 능동성을 보존하는 표현이 적절합니다.
  doctrine_reference: 예언서의 계시 공식
