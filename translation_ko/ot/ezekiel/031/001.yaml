  source_fidelity: 날짜와 계시 공식은 대체로 반영되었으나, וַיְהִי의 도입 기능이 ‘임하여’에 흡수되어 있고, ‘말씀이 … 말씀하셨습니다’는 주어와 서술어의 결합이 부자연스럽습니다. לֵאמֹר는 이어지는 직접 인용을 여는 기능이므로 콜론으로 표시하는 것이 적절합니다.
  naturalness: ‘열한째 해, 셋째 달, 그달 초하루’는 뜻은 통하지만 날짜 표기로는 ‘열한째 해 셋째 달 초하루’가 더 간결하고 자연스럽습니다. ‘야훼의 말씀이 내게 임했습니다:’는 예언서 계시 공식과 현대 합쇼체를 모두 자연스럽게 살립니다.
