source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֕עַן אֲשֶׁ֥ר גָּבַ֖הְתָּ בְּ/קוֹמָ֑ה וַ/יִּתֵּ֤ן צַמַּרְתּ/וֹ֙ אֶל בֵּ֣ין עֲבוֹתִ֔ים וְ/רָ֥ם לְבָב֖/וֹ בְּ/גָבְהֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/010.yaml
  text: 'Therefore thus says the Lord GOD: Because you grew tall in stature[a], and set your top among the thick boughs, and his heart was lifted up in his height,'
  footnotes:
  - marker: a
    text: Or 'among the thick boughs.' The Hebrew term can refer to dense foliage or thick branches; 'clouds' reflects the sense of extreme height in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 여호와께서 이렇게 말씀하십니다. “네가 높이 자랐고, 네 꼭대기를 빽빽한 가지들 사이에 두었으며,[a] 그의 마음은 그의 높이로 말미암아 교만해졌습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무성한 수풀 가운데’. 히브리어 עֲבוֹתִים은 빽빽한 가지들 또는 무성한 수풀을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה
  english_pob_choice: Therefore thus says the Lord GOD
  chosen_korean: 그러므로 주 하나님께서 이렇게 말씀하십니다
  alternatives_korean:
  - 그러므로 주 여호와께서 이렇게 말씀하십니다
  - 그러므로 주 야훼께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 아도나이-야훼의 이중 호칭을 한국어에서 자연스럽고 공손한 예언문 형식으로 옮기되, 본문이 하나님의 직접 발화를 여는 공식어라는 점을 살려 ‘주 하나님께서’로 처리했습니다.
- source_word: גָּבַהְתָּ בְּקוֹמָה
  english_pob_choice: you grew tall in stature
  chosen_korean: 네가 키가 커져 키 높이가 높아졌고
  alternatives_korean:
  - 네가 위로 자라서 키가 높아졌고
  - 네가 신장이 커져 높아졌고
  lexicon: HALOT
  rationale: ‘height/stature’의 식물적·비유적 이미지를 살리기 위해 추상적 ‘교만해졌다’보다 먼저 실제 높이의 상승을 드러내는 표현으로 옮겼습니다.
- source_word: צַמַּרְתּוֹ וְרָם לְבָבוֹ בְּגָבְהוֹ
  english_pob_choice: and set your top among the thick boughs, and his heart was lifted up in his height
  chosen_korean: 네 꼭대기를 무성한 가지들 사이에 두었으며, 또 그의 마음은 그의 높이 때문에 교만해졌습니다
  alternatives_korean:
  - 네 꼭대기를 두꺼운 가지들 사이에 두었으며, 또 그의 마음은 그의 높이 때문에 높아졌습니다
  - 네 끝을 무성한 가지들 사이에 두었으며, 또 그의 마음은 그의 높이 때문에 우쭐해졌습니다
  lexicon: HALOT
  rationale: צַמַּרְתּוֹ는 나무의 꼭대기를 가리키므로 ‘꼭대기’로 옮겼고, עֲבוֹתִים은 본문 맥락상 무성하고 빽빽한 가지들을 가리키므로 ‘무성한 가지들 사이에’로 처리했습니다. וְרָם לְבָבוֹ는 심장이 ‘높아지다’는 관용구를 넘어 교만의 의미를 드러내므로 ‘교만해졌습니다’로 번역했습니다.
theological_decisions:
- issue: 3인칭으로 바뀌는 주어/대명사 이동
  chosen_reading: 2인칭 호칭(네가, 네) 뒤에 3인칭(그의 마음) 전환을 그대로 유지했습니다.
  alternative_readings:
  - 모두 2인칭으로 통일
  - 모두 3인칭으로 통일
  rationale: 히브리어 본문이 실제로 인칭을 전환하므로, 이를 평탄화하지 않고 그대로 드러내는 편이 원문이 만든 긴장과 예언적 문체를 더 충실히 보존합니다.
  doctrine_reference: 원문 우선 원칙; 번역 전통이 아니라 स्रोत 언어의 인칭 전환을 유지
