id: EZK.31.11
reference: Ezekiel 31:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶ֨תְּנֵ֔/הוּ בְּ/יַ֖ד אֵ֣יל גּוֹיִ֑ם עָשׂ֤וֹ יַֽעֲשֶׂה֙ ל֔/וֹ כְּ/רִשְׁע֖/וֹ גֵּרַשְׁתִּֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/011.yaml
  text: I gave him into the hand of a mighty one of the nations; he will surely deal with him[a]. According to his wickedness I drove him out.
  footnotes:
  - marker: a
    text: Or 'the ruler of nations' / 'the mighty one of the nations.' The Hebrew expression can denote a powerful ruler among the nations.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그를 열방의 강한 자[a]의 손에 넘겨주었습니다. 그는 반드시 그에게 그가 행한 대로 행할 것입니다. 그의 악함에 따라 내가 그를 쫓아냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘열방의 통치자’ / ‘열방의 강한 자’. 히브리어 표현은 열방 가운데 있는 유력한 통치자를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנֵהוּ
  english_pob_choice: I gave him
  chosen_korean: 내가 그를 넘겨주었습니다
  alternatives_korean:
  - 내가 그를 주었습니다
  - 내가 그를 내주었습니다
  lexicon: HALOT
  rationale: נתן의 1인칭 단수 완료형으로, 문맥상 심판의 집행을 가리키므로 ‘주다’보다 심판적 뉘앙스가 드러나는 ‘넘겨주다’가 자연스럽습니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: ~의 손에
  alternatives_korean:
  - ~의 권세에
  - ~의 힘에
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 ‘손에’로 옮겨, 지배·통제 아래 넘겨진 이미지를 보존했습니다.
- source_word: אֵיל גּוֹיִם
  english_pob_choice: a mighty one of the nations
  chosen_korean: 열방의 강한 자
  alternatives_korean:
  - 열방의 통치자
  - 열방의 강한 자들
  lexicon: HALOT
  rationale: אֵיל은 ‘강한 자/유력자’의 뜻이므로, 본문을 과도하게 특정하지 않고 ‘강한 자’로 옮겼습니다. ‘열방의’는 원문 수식을 따라 보존했습니다.
- source_word: עָשׂוֹ יַעֲשֶׂה לוֹ
  english_pob_choice: he will surely deal with him
  chosen_korean: 그는 반드시 그에게 그가 행한 대로 행할 것입니다
  alternatives_korean:
  - 그는 반드시 그에게 행할 것입니다
  - 그는 반드시 그를 다룰 것입니다
  lexicon: HALOT
  rationale: 부정사 절대형+미완료형의 강조를 ‘반드시’로 살리고, 뒤의 ‘그에게’와 함께 원문의 응보적 반복을 한국어로 드러냈습니다.
- source_word: כְּרִשְׁעוֹ
  english_pob_choice: According to his wickedness
  chosen_korean: 그의 악함에 따라
  alternatives_korean:
  - 그의 악에 따라
  - 그의 악행대로
  lexicon: HALOT
  rationale: כְּ의 대응·비례 의미를 살려 ‘~에 따라’로 옮겼고, רֶשַׁע의 도덕적 악을 현대 한국어에서 자연스럽게 나타내기 위해 ‘악함’을 택했습니다.
- source_word: גֵּרַשְׁתִּהוּ
  english_pob_choice: I drove him out
  chosen_korean: 내가 그를 쫓아냈습니다
  alternatives_korean:
  - 내가 그를 내쫓았습니다
  - 내가 그를 몰아냈습니다
  lexicon: HALOT
  rationale: גרש의 핵심 의미인 ‘몰아내다/내쫓다’를 살리되, 현대 문체에서 가장 직관적인 동사로 옮겼습니다.
theological_decisions:
- issue: 열방의 강한 자의 정체를 본문에서 얼마나 특정할 것인가
  chosen_reading: 주 본문은 원문의 일반적 표현을 유지해 ‘열방의 강한 자’로 번역했습니다.
  alternative_readings:
  - ‘열방의 통치자’
  - 바빌론 왕을 본문에 직접 명시
  rationale: 히브리어는 심판의 도구를 일반명사적으로 말하므로, 역사적 지시를 주석 없이 본문에 끌어오지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
