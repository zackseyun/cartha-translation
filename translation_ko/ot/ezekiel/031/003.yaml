  rationale: 이 절은 제국의 크기와 위세를 나무의 장엄한 이미지로 묘사하는 예언적 풍자이므로, 이미지의 과장을 보존해야 본문의 의도가 드러납니다.
  doctrine_reference: 예언 문학의 심판 비유와 상징 해석
