  text: וַ/יְּיִ֣ף בְּ/גָדְל֔/וֹ בְּ/אֹ֖רֶךְ דָּֽלִיּוֹתָ֑י/ו כִּֽי הָיָ֥ה שָׁרְשׁ֖/וֹ אֶל מַ֥יִם רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/007.yaml
  text: So it was beautiful in its greatness[a], in the length of its branches, because its root was by abundant waters.
  footnotes:
  - marker: a
    text: Or "many waters."
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 그 크기와 가지의 길이에서 아름다웠습니다[a]. 그 뿌리가 많은 물가에 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “많은 물들.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְּיִף
  english_pob_choice: it was beautiful
  chosen_korean: 아름다웠습니다
  alternatives_korean:
  - 아름답게 되었습니다
  - 보기 좋았습니다
  lexicon: HALOT
  rationale: 나무의 외형적 아름다움을 서술하는 말이므로, 현대 한국어에서 자연스러운 ‘아름다웠습니다’로 옮기되 상태 서술을 유지했습니다.
- source_word: בְּגָדְלוֹ
  english_pob_choice: in its greatness
  chosen_korean: 그 크기에서
  alternatives_korean:
  - 그 위대함에서
  - 그 크기 안에서
  lexicon: HALOT
  rationale: 문맥상 나무의 장대한 규모를 가리키므로 ‘크기’로 풀어, 원문의 규모 감각을 자연스럽게 살렸습니다.
- source_word: דָּלִיּוֹתָיו
  english_pob_choice: its branches
  chosen_korean: 가지
  alternatives_korean:
  - 큰 가지
  - 굽은 가지
  lexicon: HALOT
  rationale: דליות는 처진/늘어진 가지를 가리키지만, 한국어에서는 단순히 ‘가지’가 가장 분명하고 문맥의 비유를 잘 전달합니다.
- source_word: מַיִם רַבִּים
  english_pob_choice: abundant waters
  chosen_korean: 많은 물가
  alternatives_korean:
  - 많은 물들
  - 풍성한 물가
  lexicon: HALOT
  rationale: 영어 POB가 의미를 살려 ‘abundant waters’로 옮긴 점을 반영하되, 히브리어의 ‘물’과 접경/근접 뉘앙스를 한국어에서는 ‘물가’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 가독성과 원문의 평행 구조 사이의 균형
  chosen_reading: ‘그 크기와 가지의 길이에서’로 병렬 구조를 살려 원문의 묘사성을 유지했습니다.
  alternative_readings:
  - ‘그 크기에서, 가지의 길이에서’
  - ‘그 장대함과 가지의 길이에서’
  rationale: 이 절은 교훈보다 서술적 비유가 핵심이므로, 한국어에서도 병렬된 아름다움의 근거를 분명히 드러내는 쪽이 원문 의도를 잘 전달합니다.
  doctrine_reference: 시적-예언적 묘사
