id: EZK.31.4
reference: Ezekiel 31:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַ֣יִם גִּדְּל֔וּ/הוּ תְּה֖וֹם רֹֽמְמָ֑תְ/הוּ אֶת נַהֲרֹתֶ֗י/הָ הֹלֵךְ֙ סְבִיב֣וֹת מַטָּעָ֔/הּ וְ/אֶת תְּעָלֹתֶ֣י/הָ שִׁלְחָ֔ה אֶ֖ל כָּל עֲצֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/004.yaml
  text: Waters made it grow[a]; the deep made it rise high. Its rivers flowed all around its planting place[b], and it sent out its channels to all the trees of the field.
  footnotes:
  - marker: a
    text: Or 'Its streams went around its planting place.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the deep exalted it' or 'made it tall.'
    reason: lexical_alternative
translation:
  language: ko
  text: 물들이 그것을 자라게 했습니다[a]. 깊음이 그것을 높이 올렸습니다[b]. 그 강들이 그 심은 곳 사방으로 흘렀고, 그 도랑들을 보내어 들의 모든 나무에게 이르게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 심은 곳 주위를 돌며 흐르게 했습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘깊음이 그것을 높였습니다’ 혹은 ‘크게 했습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם
  english_pob_choice: Waters
  chosen_korean: 물들
  alternatives_korean:
  - 물
  - 물들이
  lexicon: HALOT
  rationale: 히브리어 복수형을 살리면서도 집합명사처럼 읽히는 표현이어서, 시적 복수감을 유지하는 ‘물들’을 택했습니다.
- source_word: גִּדְּלוּהוּ
  english_pob_choice: made it grow
  chosen_korean: 자라게 했습니다
  alternatives_korean:
  - 크게 했습니다
  - 자라나게 했습니다
  lexicon: HALOT
  rationale: 나무 비유에 맞게 ‘great’보다 성장 동사를 택해, 영어 POB의 ‘made it grow’와 같은 식물적 이미지를 살렸습니다.
- source_word: רֹמְמָתְהוּ
  english_pob_choice: made it rise high
  chosen_korean: 높이 올렸습니다
  alternatives_korean:
  - 높였습니다
  - 드높였습니다
  lexicon: HALOT
  rationale: ‘높이다/올리다’의 상승 이미지를 살리되, 나무가 위로 뻗는 장면을 자연스럽게 보이게 했습니다.
- source_word: תְּעָלֹתֶיהָ
  english_pob_choice: its channels
  chosen_korean: 그 도랑들
  alternatives_korean:
  - 그 수로들
  - 그 물길들
  lexicon: HALOT
  rationale: 물의 지류·관개 수로를 가리키는 말로 이해하여, 현대 한국어에서 가장 직관적인 ‘도랑들’을 썼습니다.
theological_decisions:
- issue: 확장된 나무 비유에서 대명사와 주어 처리
  chosen_reading: 나무와 물 시스템을 모두 비인칭으로 처리해 ‘그것/그’의 지시를 유지했습니다.
  alternative_readings:
  - ‘그를/그의’로 옮겨 인물화하기
  - ‘그것의’ 대신 반복을 줄여 풀어쓰기
  rationale: 본문은 제국/왕권을 나무로 그린 비유이므로, 영어 POB처럼 비인칭을 유지하는 편이 상징 구조를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
