revisions:
- from: 이방인들, 곧 열방의 무자비한 자들이 그것을 찍어 넘어뜨리고 버려 두었습니다. 그 가지들은 산들 위와 모든 골짜기에 떨어졌고, 그 큰 가지들은 땅의 모든 수로에서 부러졌습니다. 그러자 땅의 모든 민족이 그 그늘에서 내려가 그것을 버려 두었습니다.[a][b][c]
  to: 이방인들[a], 곧 민족들 가운데 포악한 자들이 그것을 베어 쓰러뜨리고 내버려 두었습니다. 그 가지들은 산들 위와 모든 골짜기에 떨어졌고, 그 큰 가지들은 땅의 모든 수로[b]에서 부러졌습니다. 그러자 땅의 모든 민족이 그 그늘에서 내려와 그것을 내버려 두었습니다.[c]
  rationale: The revision makes the felling verb and the construct phrase more precise, uses idiomatic modern Korean for abandonment, and relocates the footnote anchors to their relevant expressions. It retains the Hebrew tree metaphor, the distinction between branches and larger boughs, and the verse’s ambiguity concerning the political referent.
