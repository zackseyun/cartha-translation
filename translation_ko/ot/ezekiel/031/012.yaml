source:
  edition: WLC
  text: וַ/יִּכְרְתֻ֧/הוּ זָרִ֛ים עָרִיצֵ֥י גוֹיִ֖ם וַֽ/יִּטְּשֻׁ֑/הוּ אֶל הֶ֠/הָרִים וּ/בְ/כָל גֵּ֨אָי֜וֹת נָפְל֣וּ דָלִיּוֹתָ֗י/ו וַ/תִּשָּׁבַ֤רְנָה פֹֽארֹתָי/ו֙ בְּ/כֹל֙ אֲפִיקֵ֣י הָ/אָ֔רֶץ וַ/יֵּרְד֧וּ מִ/צִּלּ֛/וֹ כָּל עַמֵּ֥י הָ/אָ֖רֶץ וַֽ/יִּטְּשֻֽׁ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/012.yaml
  text: Foreigners[a], the ruthless of the nations, cut it down and left it. Its branches fell on the mountains and in every valley, and its boughs were broken in all the channels of the land[c][b]. Then all the peoples of the earth went down from its shade and left it.
  footnotes:
  - marker: a
    text: Or 'abandoned it' for the repeated verb 'left it' (וַיִּטְּשֻׁהוּ) in both clauses.
    reason: lexical_alternative
  - marker: b
    text: '''Channels of the land'' may also be rendered ''watercourses of the land'' or ''ravines of the earth.'''
    reason: lexical_alternative
  - marker: c
    text: The fallen tree represents Assyria and its ruler in the larger metaphor of the chapter; English 'it' preserves the tree image, though 'him' is possible if the political referent is foregrounded.
    reason: alternative_reading
translation:
  language: ko
  text: 이방인들, 곧 열방의 무자비한 자들이 그것을 찍어 넘어뜨리고 버려 두었습니다. 그 가지들은 산들 위와 모든 골짜기에 떨어졌고, 그 큰 가지들은 땅의 모든 수로에서 부러졌습니다. 그러자 땅의 모든 민족이 그 그늘에서 내려가 그것을 버려 두었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 반복 동사 וַיִּטְּשֻׁהוּ는 여기서도 ‘버려 두다/떠나다’로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘수로’는 ‘물길’, ‘시내바닥’, ‘골짜기’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 나무 비유는 더 큰 문맥에서 앗시리아와 그 통치자를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זָרִים
  english_pob_choice: Foreigners
  chosen_korean: 이방인들
  alternatives_korean:
  - 외국인들
  - 낯선 자들
  lexicon: HALOT
  rationale: 열방 문맥에서 זָרִים는 단순한 ‘낯선 사람’보다 민족적·정치적 외부자인 ‘이방인들’이 자연스럽습니다.
- source_word: עָרִיצֵי גוֹיִם
  english_pob_choice: the ruthless of the nations
  chosen_korean: 열방의 무자비한 자들
  alternatives_korean:
  - 열방의 포악한 자들
  - 열방의 폭력적인 자들
  lexicon: HALOT
  rationale: עָרִיץ는 포악함·무자비함·폭력성을 함께 담는 말이므로, 한국어에서는 그 긴장을 살리는 ‘무자비한 자들’이 적절합니다.
- source_word: דָלִיּוֹתָיו / פֹארֹתָיו
  english_pob_choice: branches / boughs
  chosen_korean: 가지들 / 큰 가지들
  alternatives_korean:
  - 가지들 / boughs의 음역 없음
  - 가지들 / 넓은 가지들
  lexicon: HALOT
  rationale: 두 어휘가 모두 나무의 가지를 가리키지만 약간의 차이를 가지므로, 첫 항목은 일반적인 ‘가지들’, 둘째는 더 큰 가지를 드러내는 ‘큰 가지들’로 구분했습니다.
- source_word: אֲפִיקֵי הָאָרֶץ
  english_pob_choice: the channels of the land
  chosen_korean: 땅의 모든 수로
  alternatives_korean:
  - 땅의 모든 물길
  - 땅의 모든 골짜기 물길
  lexicon: HALOT
  rationale: אפיק은 개울바닥·물길·수로의 뜻이 있어, 문맥상 흐르는 물의 길을 살리는 ‘수로’가 가장 직접적입니다.
theological_decisions:
- issue: 가지들이 떨어지고 민족들이 떠나는 대상의 지시어
  chosen_reading: 한국어에서도 중성 대명사 ‘그것’을 사용해 나무-제국 비유를 유지했습니다.
  alternative_readings:
  - 그를 사용해 앗시리아의 왕/제국을 더 전면화함
  rationale: 본문은 큰 나무 비유를 계속 전개하므로, 즉각적 이미지인 나무를 살리는 것이 원문 수사에 더 충실합니다.
  doctrine_reference: 문맥적 비유 일관성
