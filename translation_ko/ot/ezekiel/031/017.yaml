revisions:
- from: 그들도 그것과 함께 스올로 내려갔습니다. 칼에 죽임을 당한 자들 가운데 내려갔으며, 그 팔은 민족들 가운데서 그 그늘 아래에 머물렀습니다.[a]
  to: 그들도 그것과 함께 스올로, 곧 칼에 죽임을 당한 자들에게로 내려갔습니다. 그 팔[a], 곧 민족들 가운데서 그 그늘 아래 살던 자들도 그러했습니다.
  rationale: 원문의 단일 ‘내려가다’ 동사를 한 번만 번역하고, 후반의 단수 ‘팔’과 복수 ‘살다’의 긴장을 ‘그 팔, 곧 … 살던 자들’로 보존했습니다. 이는 은유를 본문에서 삭제하지 않으면서도, 팔 자체가 거주했다는 한국어의 부자연스러운 인상을 피합니다. 스올은 음역으로 유지했으며, 각주 표지는 해당 어휘 바로 뒤로 옮겼습니다.
