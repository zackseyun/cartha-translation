id: EZK.31.17
reference: Ezekiel 31:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם הֵ֗ם אִתּ֛/וֹ יָרְד֥וּ שְׁא֖וֹלָ/ה אֶל חַלְלֵי חָ֑רֶב וּ/זְרֹע֛/וֹ יָשְׁב֥וּ בְ/צִלּ֖/וֹ בְּ/ת֥וֹךְ גּוֹיִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/017.yaml
  text: They too went down with it to Sheol[a], to those slain by the sword; its arm dwelt in its shade among the nations.
  footnotes:
  - marker: a
    text: Or 'its strength' or 'its allies'; literally 'its arm.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들도 그것과 함께 스올로 내려갔습니다. 칼에 죽임을 당한 자들 가운데 내려갔으며, 그 팔은 민족들 가운데서 그 그늘 아래에 머물렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 힘’ 혹은 ‘그 동맹들’; 문자적으로는 ‘그 팔’.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הֵם
  english_pob_choice: They too
  chosen_korean: 그들도
  alternatives_korean:
  - 또 그들도
  - 그들 또한
  lexicon: HALOT
  rationale: 추가 대상이 이미 언급된 심판에 함께 포함됨을 간결하게 드러내는 표현으로 옮겼습니다.
- source_word: אִתּוֹ
  english_pob_choice: with it
  chosen_korean: 그것과 함께
  alternatives_korean:
  - 그와 함께
  - 그와 더불어
  lexicon: HALOT
  rationale: 문맥의 앗시리아-백향목 비유를 따라 인칭화된 ‘그’보다 중성적 ‘그것’이 원문의 비유적 대상을 더 잘 반영합니다.
- source_word: יָרְדוּ שְׁאוֹלָה
  english_pob_choice: went down ... to Sheol
  chosen_korean: 스올로 내려갔습니다
  alternatives_korean:
  - 무덤으로 내려갔습니다
  - 죽은 자들의 세계로 내려갔습니다
  lexicon: HALOT
  rationale: שְׁאוֹל을 ‘무덤’으로 풀지 않고 음역 ‘스올’을 유지해, 단순 매장 이상인 히브리어 저승 개념을 보존했습니다.
- source_word: חַלְלֵי חָרֶב
  english_pob_choice: those slain by the sword
  chosen_korean: 칼에 죽임을 당한 자들
  alternatives_korean:
  - 칼에 죽은 자들
  - 칼에 쓰러진 자들
  lexicon: HALOT
  rationale: ‘칼에 의해 죽임을 당한’이라는 원인의 뜻을 분명히 하되, 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: זְרֹעוֹ
  english_pob_choice: its arm
  chosen_korean: 그 팔
  alternatives_korean:
  - 그 힘
  - 그 동맹
  lexicon: HALOT
  rationale: 본문의 직유적 이미지는 ‘팔’이지만, 문맥상 힘이나 지원 세력을 가리킬 수 있는 해석 가능성은 본문 밖에 두고 본문은 이미지를 보존했습니다.
- source_word: בְצִלּוֹ
  english_pob_choice: in its shade
  chosen_korean: 그 그늘 아래에
  alternatives_korean:
  - 그늘에
  - 그 보호 아래
  lexicon: HALOT
  rationale: 보호와 그늘의 이미지를 한국어 관용에 맞게 살리면서도 직역적 감각을 유지했습니다.
- source_word: בְּתוֹךְ גּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 민족들 가운데서
  alternatives_korean:
  - 나라들 가운데서
  - 열국 가운데서
  lexicon: HALOT
  rationale: גּוֹיִם을 ‘민족들’로 옮겨 이사야적/에스겔적 국제 심판 문맥을 자연스럽게 반영했습니다.
theological_decisions:
- issue: שְׁאוֹל의 처리
  chosen_reading: ‘스올’로 음역하여 유지했습니다.
  alternative_readings:
  - ‘무덤’으로 의역
  - ‘죽은 자들의 세계’로 풀어쓰기
  rationale: 히브리어 스올의 개념적 긴장—매장지 이상의 죽은 자들의 영역—을 유지하기 위해 음역을 택했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
