    rationale: 히브리어 יָרְדוּ는 한 번만 쓰였고, ‘스올’과 ‘칼에 죽임을 당한 자들’은 모두 그 동사의 보어입니다.
  - severity: medium
    issue: ‘그 팔은 … 머물렀습니다’는 복수 동사 יָשְׁבוּ와 문맥상 집합적 은유를 충분히 반영하지 못합니다.
    rationale: ‘그 팔’은 문자적 이미지를 유지할 수 있으나, 복수 동사는 그 팔로 가리킨 사람들, 곧 그 그늘 아래 살던 이들을 가리킵니다. 한국어 본문에서는 이를 ‘그 팔, 곧 … 살던 자들도’로 풀어 문법적·의미적 관계를 보존합니다.
