source:
  edition: WLC
  text: עַל כֵּן֙ גָּבְהָ֣א קֹמָת֔/וֹ מִ/כֹּ֖ל עֲצֵ֣י הַ/שָּׂדֶ֑ה וַ/תִּרְבֶּ֨ינָה סַֽרְעַפֹּתָ֜י/ו וַ/תֶּאֱרַ֧כְנָה פארת/ו מִ/מַּ֥יִם רַבִּ֖ים בְּ/שַׁלְּחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/005.yaml
  text: Therefore its height rose above all the trees of the field[a], and its boughs multiplied, and its branches grew long because of abundant waters as it spread out.
  footnotes:
  - marker: a
    text: Or 'when it sent out its shoots/branches.' The Hebrew literally refers to its 'sending out,' with the object left implicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그 키가 들의 모든 나무보다 높아졌고, 그 큰 가지들은 많아졌으며, 많은 물 때문에 그것이 뻗어 나갈 때 그 가지들은 길어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것이 자기의 싹이나 가지들을 내보낼 때’. 히브리어는 문자적으로 ‘그것이 내보낼 때’라고 하며, 무엇을 내보내는지는 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְהָא קֹמָתוֹ מִכֹּל עֲצֵי הַשָּׂדֶה
  english_pob_choice: its height rose above all the trees of the field
  chosen_korean: 그 높이가 들의 모든 나무보다 높아졌고
  alternatives_korean:
  - 그 키가 들의 모든 나무보다 높았고
  - 그 높이가 들의 모든 나무 위로 솟았고
  lexicon: HALOT
  rationale: גובה/קומה의 상승과 비교 구조를 함께 살려, 단순한 상태보다 ‘높아졌고’로 변화와 우월성을 자연스럽게 드러냈습니다.
- source_word: סַרְעַפֹּתָיו
  english_pob_choice: its boughs
  chosen_korean: 그 가지들은
  alternatives_korean:
  - 그 큰 가지들은
  - 그 울창한 가지들은
  lexicon: HALOT
  rationale: 다음 절의 פארתיו와 구별되도록, 더 큰 가지의 분지를 가리키는 뉘앙스를 일반적인 ‘가지들’로 옮겼습니다.
- source_word: וַתֶּאֱרַכְנָה פארת/ו מִמַּיִם רַבִּים
  english_pob_choice: its branches grew long because of abundant waters
  chosen_korean: 많은 물로 인해 그 가지들은 길어졌습니다
  alternatives_korean:
  - 풍성한 물 때문에 그 가지들은 길어졌습니다
  - 많은 물에서 그 가지들은 길어졌습니다
  lexicon: HALOT
  rationale: מן의 원인적 의미를 ‘~로 인해’로 살리고, ארך의 결과적 변화는 ‘길어졌습니다’로 자연스럽게 표현했습니다.
- source_word: בְּשַׁלְּחוֹ
  english_pob_choice: as it spread out
  chosen_korean: 그것이 퍼져 나가면서
  alternatives_korean:
  - 그것이 싹을 내보내면서
  - 그것이 가지를 뻗으면서
  lexicon: HALOT
  rationale: 히브리어의 ‘보내다/내보내다’가 가지나 싹의 확장을 함축하므로, 객체를 과도하게 보완하지 않고 ‘퍼져 나가면서’로 옮겼습니다.
theological_decisions:
- issue: 나무 비유의 인격화된 주어를 어떻게 처리할지
  chosen_reading: 지시대명사 ‘그것’으로 일관되게 옮겨, 왕권/세력의 비유를 자연스럽게 유지했습니다.
  alternative_readings:
  - ‘그 나라가’처럼 의미를 풀어 쓰는 해석
  - ‘그 나무가’처럼 직접적 표상만 유지하는 번역
  rationale: 본문은 나무 비유를 유지한 채 성장과 확장을 말하므로, 해석을 앞세우지 않고 원문의 비유적 표상을 보존하는 편이 더 적절합니다.
  doctrine_reference: 비유 해석의 절제
