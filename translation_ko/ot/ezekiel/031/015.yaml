id: EZK.31.15
reference: Ezekiel 31:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה בְּ/י֨וֹם רִדְתּ֤/וֹ שְׁא֨וֹלָ/ה֙ הֶאֱבַ֜לְתִּי כִּסֵּ֤תִי עָלָי/ו֙ אֶת תְּה֔וֹם וָֽ/אֶמְנַע֙ נַהֲרוֹתֶ֔י/הָ וַ/יִּכָּלְא֖וּ מַ֣יִם רַבִּ֑ים וָ/אַקְדִּ֤ר עָלָי/ו֙ לְבָנ֔וֹן וְ/כָל עֲצֵ֥י הַ/שָּׂדֶ֖ה עָלָ֥י/ו עֻלְפֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/015.yaml
  text: 'Thus says the Lord GOD: On the day he went down to Sheol[a], I caused mourning; I covered the deep because of him, and I restrained its rivers, and the many waters were stopped. I made Lebanon grow dark because of him[c][b], and all the trees of the field fainted because of him.'
  footnotes:
  - marker: a
    text: Or 'the grave' or 'the realm of the dead.' Hebrew 'Sheol' names the underworld of the dead and is left transliterated here to avoid narrowing the sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'I darkened Lebanon because of him.' The Hebrew verb can express causing gloom or darkness, fitting the verse's mourning imagery.
    reason: lexical_alternative
  - marker: c
    text: Or 'all the trees of the field swooned because of him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주 여호와께서 이렇게 말씀하십니다. “그가 스올[a]로 내려간 날에, 내가 애통을 일으켰습니다. 그 때문에 깊음을 덮고 그 강들을 막았으며, 많은 물은 막혔습니다. 내가 그 때문에 레바논을 어둡게 하였고[b], 들의 모든 나무는 그 때문에 기절하였습니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤’, ‘죽은 자들의 세계’. 히브리어 ‘스올’은 죽은 자들의 세계를 가리키므로, 의미를 좁히지 않기 위해 음역했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 그 때문에 레바논을 침울하게 하였다.’ 히브리어 동사는 어둠이나 침울함을 일으키는 뜻을 가질 수 있어, 애도의 이미지를 반영합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘들의 모든 나무가 그 때문에 혼절하였다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 여호와
  alternatives_korean:
  - 주 하나님
  - 주 야훼
  lexicon: HALOT
  rationale: 직함과 신명 결합을 한국어 관용 표현으로 옮기되, 둘을 모두 살려 원문의 중층적 호칭을 유지했습니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자들의 세계
  - 지옥
  lexicon: HALOT
  rationale: 히브리어 고유 개념을 좁은 의미의 무덤이나 후대적 지옥 개념으로 바꾸지 않기 위해 음역을 유지했습니다.
- source_word: הֶאֱבַלְתִּי
  english_pob_choice: I caused mourning
  chosen_korean: 내가 슬픔을 일으켰고
  alternatives_korean:
  - 내가 애곡하게 했고
  - 내가 애통을 일으켰고
  lexicon: HALOT
  rationale: 사역형의 원인을 분명히 드러내면서도 문맥의 애도 이미지를 자연스러운 현대 한국어로 살렸습니다.
- source_word: וָאַקְדִּר עָלָיו לְבָנוֹן
  english_pob_choice: I made Lebanon grow dark because of him
  chosen_korean: 그 때문에 레바논을 어둡게 했고
  alternatives_korean:
  - 그 때문에 레바논을 어둡게 하였고
  - 그 때문에 레바논에 어둠을 내렸고
  lexicon: HALOT
  rationale: קדר의 ‘어둡게 하다/침울하게 하다’의 뜻을 살려, 장송의 분위기와 우울을 함께 전달했습니다.
theological_decisions:
- issue: 스올의 번역 방식
  chosen_reading: 음역 스올을 본문에 유지합니다.
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  - 지옥
  rationale: 본문의 사상 세계를 보존하고, 한국어 독자가 본문 자체의 개념적 범위를 좁게 오해하지 않도록 하기 위함입니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 우주적 애도 이미지의 처리
  chosen_reading: 깊음, 강들, 레바논, 나무를 애도의 표상으로 그대로 살렸습니다.
  alternative_readings:
  - 정치적 몰락의 비유로 본문에서 풀어쓰기
  - 자연재해의 묘사로 단순화
  rationale: 본문의 시적·심판적 이미지를 설명으로 평탄화하지 않고, 본문이 말하는 바를 그대로 전달했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
