  text: 그때 야훼께서 저에게 말씀하셨습니다. “인자야, 네가 아홀라와 아홀리바를 심판하겠느냐? 그들의 가증한 행위를 그들에게 말하여라.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
  rationale: 신적 고유명사를 제목어로 바꾸지 않고, POB의 원칙에 따라 음역형 ‘야훼’로 옮겨 원문이 가진 인격적 이름을 드러냈습니다.
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자
  alternatives_korean:
  - 사람아
  - 인간이여
  lexicon: HALOT
  rationale: 에스겔에서 반복되는 하나님의 호칭을 관용적으로 살리되, 직역의 무게를 유지하는 표준 번역으로 ‘인자’를 선택했습니다.
- source_word: הֲתִשְׁפּוֹט
  english_pob_choice: will you judge
  chosen_korean: 심판하겠느냐
  alternatives_korean:
  - 판단하겠느냐
  - 심판하시겠습니까
  lexicon: HALOT
  rationale: 문맥상 법정적·예언적 선언의 질문이므로 단순한 ‘판단’보다 더 강한 ‘심판하다’를 사용해 원문의 어조를 보존했습니다.
- source_word: תוֹעֲבוֹתֵיהֶן
  english_pob_choice: their abominations
  chosen_korean: 그들의 역겨운 행위
  alternatives_korean:
  - 그들의 가증한 것들
  - 그들의 역겨운 일들
  lexicon: HALOT
  rationale: 예언서의 도덕적·우상숭배적 질책을 드러내면서도 현대 한국어에서 의미가 분명하도록 ‘역겨운 행위’로 옮겼습니다.
