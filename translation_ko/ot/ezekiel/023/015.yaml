base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/015.yaml
  text: with belts fastened at their waists[a], with flowing turbans on their heads, all of them having the appearance of officers, the likeness of the sons of Babylon, Chaldeans[b], the land of their birth.
  footnotes:
  - marker: a
    text: Or 'captains.' The Hebrew שָׁלִשִׁים can denote elite military men or high-ranking officers; 'officers' is used here as a broader rendering.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of Babylon,' a filial expression for Babylonians.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 허리에 띠를 두르고, 머리에는 늘어진 터번을 쓰고 있었으며, 모두 고위 관리들 같은 모습을 하고 있었습니다.[a] 그들은 바빌론의 아들들, 곧 고향 땅이 갈대아인 사람들을 닮은 모습이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고위 관리들’로 옮긴 히브리어 שָׁלִשִׁים은 엘리트 군사 인물 또는 고위 관리를 가리킬 수 있습니다. ‘장교들’ 또는 ‘지휘관들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘바빌론의 아들들, 갈대아 사람들, 그들의 고향 땅’입니다. ‘바빌론의 아들들’은 바빌론 사람들을 가리키는 히브리어의 친족적 표현입니다.
    reason: lexical_alternative
