  text: with belts fastened at their waists[a], with flowing turbans on their heads, all of them having the appearance of officers, the likeness of the sons of Babylon, Chaldeans[b], the land of their birth.
  footnotes:
  - marker: a
    text: Or 'captains.' The Hebrew שָׁלִשִׁים can denote elite military men or high-ranking officers; 'officers' is used here as a broader rendering.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of Babylon,' a filial expression for Babylonians.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 허리에는 띠가 둘려 있고, 머리에는 늘어진 터번을 쓰고 있으며, 모두가 장관들의 모습을 하고 있고, 바빌론의 아들들 곧 갈대아 사람들—그들의 출생지의 사람들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘장관들’은 여기서 히브리어 שָׁלִשִׁים의 넓은 의미를 반영한 번역이며, 엘리트 군사 인물이나 고위 관리까지 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바빌론의 아들들’은 히브리어의 친족적 표현으로, 단순히 ‘바빌론 사람들’이라는 뜻입니다.
    reason: lexical_alternative
