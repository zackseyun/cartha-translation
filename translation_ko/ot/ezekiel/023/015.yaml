theological_decisions:
- issue: דְּמוּת와 두 민족/지명 표현의 병렬 구조
  chosen_reading: ‘바빌론의 아들들 곧 갈대아 사람들—그들의 출생지의 사람들’로, 동일 인물군을 설명하는 앱포지션 구조로 보존했습니다.
  alternative_readings:
  - ‘바빌론의 아들들, 갈대아 사람들, 그들의 출생지’로 단순 병렬 처리
  - ‘바빌론 사람들, 갈대아 사람들’로 통합
  rationale: 히브리어는 ‘유사성’과 ‘출신지’가 겹쳐지는 묘사 구조이므로, 의미를 평평하게 만들지 않고 설명적 병치를 유지하는 것이 본문 효과에 더 가깝습니다.
  doctrine_reference: 문학적-주해적 구조 보존
- issue: שָׁלִשִׁים의 사회적/군사적 지위
  chosen_reading: ‘장관들’로 번역해 단순 병졸이 아닌 상류층·고위 인물의 인상을 살렸습니다.
  alternative_readings:
  - ‘장교들’
  - ‘사령관들’
  rationale: 해당 용어는 구체 직책이 확정적이지 않으므로, 과도하게 군사화하거나 특정 계급으로 고정하기보다 위신과 권위를 드러내는 폭넓은 표현이 적합합니다.
  doctrine_reference: 주해적 신중성
