language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵמָּה֮ גִּלּ֣וּ עֶרְוָתָ/הּ֒ בָּנֶ֤י/הָ וּ/בְנוֹתֶ֨י/הָ֙ לָקָ֔חוּ וְ/אוֹתָ֖/הּ בַּ/חֶ֣רֶב הָרָ֑גוּ וַ/תְּהִי שֵׁם֙ לַ/נָּשִׁ֔ים וּ/שְׁפוּטִ֖ים עָ֥שׂוּ בָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/010.yaml
  text: They uncovered her nakedness[a]; they took her sons and her daughters, and they killed her with the sword. So she became a byword among women[c][b], and they executed judgments on her.
  footnotes:
  - marker: a
    text: Or 'laid bare her nakedness'; the Hebrew idiom can also carry the sense of exposing shame publicly.
    reason: lexical_alternative
  - marker: b
    text: Or 'she became notorious among women'; literally, 'she became a name among women.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they carried out judgments against her.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그녀의 알몸을 드러냈습니다[a]. 그들은 그녀의 아들들과 딸들을 사로잡았고, 그녀를 칼로 죽였습니다. 그래서 그녀는 여성들 사이에서 조롱거리가 되었고[b], 그들은 그녀에게 심판을 집행했습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 수치를 드러냈습니다’. 히브리어 관용구는 공개적 노출과 수치의 의미를 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여성들 사이에서 악명이 높아졌습니다’. 직역하면 ‘여성들 사이에서 이름이 되었습니다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그녀에게 판결을 집행했습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלּוּ עֶרְוָתָהּ
  english_pob_choice: uncovered her nakedness
  chosen_korean: 그녀의 알몸을 드러냈습니다
  alternatives_korean:
  - 그녀의 벌거벗음을 드러냈습니다
  - 그녀의 수치를 드러냈습니다
  - 그녀의 알몸을 벗겼습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 직설성을 살리되, 한국어에서는 ‘알몸을 드러내다’가 성적·수치적 노출의 뉘앙스를 함께 전달합니다.
- source_word: בָּנֶיהָ וּבְנוֹתֶיהָ לָקָחוּ
  english_pob_choice: they took her sons and her daughters
  chosen_korean: 그녀의 아들들과 딸들을 사로잡았고
  alternatives_korean:
  - 그녀의 아들들과 딸들을 데려갔고
  - 그녀의 아들들과 딸들을 빼앗았고
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘가져감’보다 포로로 끌고 간 의미가 강하므로 ‘사로잡다’로 옮겨, 전쟁 포획의 함의를 드러냈습니다.
- source_word: וַתְּהִי שֵׁם לַנָּשִׁים
  english_pob_choice: she became a byword among women
  chosen_korean: 여성들 사이에서 조롱거리가 되었고
  alternatives_korean:
  - 여성들 사이에서 이름난 사람이 되었고
  - 여성들 사이에서 악명이 높아졌고
  - 여성들 사이에서 속담거리가 되었고
  lexicon: HALOT
  rationale: ‘이름’이라는 직역보다 문맥의 부정적 평판을 살려 ‘조롱거리’로 옮기되, 널리 회자되는 뜻도 함께 유지했습니다.
- source_word: וּשְׁפוּטִים עָשׂוּ בָהּ
  english_pob_choice: they executed judgments on her
  chosen_korean: 그들은 그녀에게 심판을 집행했습니다
  alternatives_korean:
  - 그들은 그녀에게 판결을 집행했습니다
  - 그들은 그녀를 심판했습니다
  - 그들은 그녀에게 형벌을 내렸습니다
  lexicon: HALOT
  rationale: 원문의 משפטים 복수형을 단순한 ‘처벌’보다 법정적·재판적 어조로 보존하기 위해 ‘심판을 집행하다’로 옮겼습니다.
theological_decisions:
- issue: Ezekiel 23의 성적 비유를 완화할 것인가
  chosen_reading: ‘알몸을 드러냈습니다’로 직설적 이미지를 유지했습니다.
  alternative_readings:
  - ‘수치를 드러냈습니다’처럼 추상화함
  - ‘공개적으로 창피를 주었습니다’로 완곡화함
  rationale: 예언서의 심판 수사가 가진 충격과 비유적 의미를 희석하지 않도록, 원문의 노출/수치 이미지를 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 마지막 절의 משפטים를 단순 형벌로 옮길지 여부
  chosen_reading: ‘심판을 집행했습니다’로 번역했습니다.
  alternative_readings:
  - ‘그녀를 벌했습니다’
  - ‘그녀에게 형벌을 내렸습니다’
  rationale: 본문은 군사적 폭력만이 아니라 공적 판결로서의 심판을 강조하므로, 법정적 의미를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5
