theological_decisions:
- issue: Ezekiel 23의 성적 비유를 완화할 것인가
  chosen_reading: ‘알몸을 드러냈습니다’로 직설적 이미지를 유지했습니다.
  alternative_readings:
  - ‘수치를 드러냈습니다’처럼 추상화함
  - ‘공개적으로 창피를 주었습니다’로 완곡화함
  rationale: 예언서의 심판 수사가 가진 충격과 비유적 의미를 희석하지 않도록, 원문의 노출/수치 이미지를 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 마지막 절의 משפטים를 단순 형벌로 옮길지 여부
  chosen_reading: ‘심판을 집행했습니다’로 번역했습니다.
  alternative_readings:
  - ‘그녀를 벌했습니다’
  - ‘그녀에게 형벌을 내렸습니다’
  rationale: 본문은 군사적 폭력만이 아니라 공적 판결로서의 심판을 강조하므로, 법정적 의미를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5
