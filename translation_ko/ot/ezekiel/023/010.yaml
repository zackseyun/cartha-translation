base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/010.yaml
  text: They uncovered her nakedness[a]; they took her sons and her daughters, and they killed her with the sword. So she became a byword among women[c][b], and they executed judgments on her.
  footnotes:
  - marker: a
    text: Or 'laid bare her nakedness'; the Hebrew idiom can also carry the sense of exposing shame publicly.
    reason: lexical_alternative
  - marker: b
    text: Or 'she became notorious among women'; literally, 'she became a name among women.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they carried out judgments against her.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그녀의 알몸을 드러냈습니다[a]. 그들은 그녀의 아들들과 딸들을 데려갔고, 그녀를 칼로 죽였습니다. 그래서 그녀는 여성들 사이에서 조롱거리가 되었고[b], 그들은 그녀에게 심판을 내렸습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 수치를 드러냈습니다’. 히브리어 관용구는 공개적 노출과 수치의 의미를 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여성들 사이에서 악명이 높아졌습니다’. 직역하면 ‘여성들 사이에서 이름이 되었습니다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그녀에게 판결을 집행했습니다’.
    reason: lexical_alternative
