  source_fidelity: 첫 절의 ‘알몸을 드러냈습니다’와 ‘칼로 죽였습니다’는 히브리어의 노출 및 칼에 의한 살해 표현을 충실히 보존합니다. 다만 לָקָחוּ는 문맥상 포획을 시사할 수 있어도 기본적으로 ‘데려가다/취하다’이므로, ‘사로잡았습니다’는 원문보다 구체화합니다. 이를 ‘데려갔습니다’로 조정하는 것이 안전합니다. 마지막의 שְׁפוּטִים עָשׂוּ는 심판 행위들을 가리키며, ‘심판을 내렸습니다’는 한국어에서 자연스럽게 그 사법적 의미를 전달합니다.
  naturalness: 합쇼체 문체는 일관되고, ‘여성들 사이에서 조롱거리가 되었습니다’는 שֵׁם לַנָּשִׁים의 부정적 평판이라는 문맥을 자연스럽게 전달합니다. 반복되는 ‘그들은’은 히브리어의 주어를 명료하게 유지하며 이 짧은 구절에서는 부자연스럽지 않습니다.
  terminology: ‘알몸’은 원문의 신체적 노출 이미지를 보존하는 현대 표준어입니다. ‘심판을 내렸습니다’는 ‘판결’보다 שְׁפוּטִים의 폭넓은 사법적 심판/처벌 행위를 더 잘 반영합니다. 각주 b의 ‘악명이 높아졌습니다’와 각주 c의 ‘판결을 집행했습니다’는 가능한 대안을 적절히 제시합니다.
