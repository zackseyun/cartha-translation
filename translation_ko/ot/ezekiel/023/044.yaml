  text: וַ/יָּב֣וֹא אֵלֶ֔י/הָ כְּ/ב֖וֹא אֶל אִשָּׁ֣ה זוֹנָ֑ה כֵּ֣ן בָּ֗אוּ אֶֽל אָֽהֳלָה֙ וְ/אֶל אָ֣הֳלִיבָ֔ה אִשֹּׁ֖ת הַ/זִּמָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/044.yaml
  text: They went in to her as men go in to a prostitute[a]; so they went in to Oholah and to Oholibah[b], women of depravity.
  footnotes:
  - marker: a
    text: Or, more formally, 'He came to her as one goes in to a prostitute; so they came to Oholah and to Oholibah.' The Hebrew opens with a singular verb before shifting to plural.
    reason: textual_variant
  - marker: b
    text: Or 'lewd women.' The Hebrew expression literally reads 'women of depravity/lewdness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 한 창녀에게 들어가듯 그녀에게 들어갔습니다[a]. 그렇게 그들은 오홀라와 오홀리바에게 들어갔으니[b], 음행의 여자들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘그는 그녀에게 한 창녀에게 들어가듯 들어갔다; 그러므로 그들은 오홀라와 오홀리바에게 들어갔다.’ 히브리어는 첫 동사가 단수로 시작했다가 복수로 바뀝니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘음란한 여자들.’ 히브리어 표현은 문자적으로 ‘음행/음란의 여자들’로 읽힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא / בָּאוּ
  english_pob_choice: they went in
  chosen_korean: 들어갔습니다
  alternatives_korean:
  - 갔습니다
  - 들어갔습니다
  lexicon: HALOT
  rationale: בוא는 이 성적 문맥에서 ‘들어가다’라는 관용적 표현이 가장 직접적입니다. 첫 동사의 단수성과 뒤의 복수성을 한국어에서 무리 없이 살리기 위해 문장 전체는 복수 주어로 자연스럽게 옮겼습니다.
- source_word: אֵלֶיהָ
  english_pob_choice: to her
  chosen_korean: 그녀에게
  alternatives_korean:
  - 그녀에게
  - 그녀 안으로
  lexicon: HALOT
  rationale: 직역하면 ‘그녀에게’이지만, 앞의 ‘들어가다’와 결합될 때 한국어에서도 성적 접촉의 관용을 유지합니다.
- source_word: אִשָּׁה זוֹנָה
  english_pob_choice: a prostitute
  chosen_korean: 한 창녀
  alternatives_korean:
  - 한 매춘부
  - 한 음녀
  lexicon: HALOT
  rationale: זוֹנָה는 성매매 여성을 가리키므로 ‘창녀’가 의미를 가장 직접적으로 드러냅니다. 새번역식 현대어로는 ‘매춘부’도 가능하지만, 본문 비교의 노골성을 살리기 위해 ‘창녀’를 택했습니다.
- source_word: אִשֹּׁת הַזִּמָּה
  english_pob_choice: women of depravity
  chosen_korean: 음행의 여자들이었습니다
  alternatives_korean:
  - 방탕한 여자들이었습니다
  - 음란한 여자들이었습니다
  lexicon: HALOT
  rationale: זִמָּה는 단순한 성적 가벼움보다 도덕적 타락과 음란을 함께 담는 말이어서, ‘음행’이 그 무게를 가장 잘 보존합니다. 복수 명사구를 한국어에서 자연스럽게 서술형으로 풀어 옮겼습니다.
theological_decisions:
- issue: 히브리어 첫 동사의 단수-복수 전환 처리
  chosen_reading: 한국어는 ‘그들이 … 들어갔습니다’로 시작해, 문맥상 집단적 행위를 분명히 드러냈습니다.
  alternative_readings:
  - 그가 그녀에게 들어갔습니다 ... 그렇게 그들은 오홀라와 오홀리바에게 들어갔습니다
  rationale: 히브리어는 첫 wayyiqtol이 단수지만 곧바로 복수 동사로 전환됩니다. 영어 POB의 판단처럼 문맥상 행위 주체는 집단이므로, 한국어도 복수로 옮겨 오해를 줄였습니다.
  doctrine_reference: 문법적 수와 서술 초점의 문제
