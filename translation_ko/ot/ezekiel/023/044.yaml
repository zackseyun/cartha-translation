  text: They went in to her as men go in to a prostitute[a]; so they went in to Oholah and to Oholibah[b], women of depravity.
  footnotes:
  - marker: a
    text: Or, more formally, 'He came to her as one goes in to a prostitute; so they came to Oholah and to Oholibah.' The Hebrew opens with a singular verb before shifting to plural.
