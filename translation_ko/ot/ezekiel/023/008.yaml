  text: 그러나 그녀는 이집트[a]에서 비롯된 그녀의 음행을 버리지 않았습니다. 그녀가 젊었을 때 그들은 그녀와 동침하였고[b], 그녀가 처녀였을 때의 가슴을 어루만지고 자기들의 음행을 그녀에게 쏟아부었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트에서 비롯된 그녀의 창기질’. 히브리어는 이 절 전체에서 같은 성적 이미지를 반복하여 언약적 불성실을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들은 그녀와 누웠다’입니다. 이어지는 표현은 직역하면 ‘그들은 그녀의 처녀 시절의 가슴을 만졌다’입니다.
    reason: lexical_alternative
