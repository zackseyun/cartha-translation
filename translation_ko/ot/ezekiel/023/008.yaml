  text: וְ/אֶת תַּזְנוּתֶ֤י/הָ מִ/מִּצְרַ֨יִם֙ לֹ֣א עָזָ֔בָה כִּ֤י אוֹתָ/הּ֙ שָׁכְב֣וּ בִ/נְעוּרֶ֔י/הָ וְ/הֵ֥מָּה עִשּׂ֖וּ דַּדֵּ֣י בְתוּלֶ֑י/הָ וַ/יִּשְׁפְּכ֥וּ תַזְנוּתָ֖/ם עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/008.yaml
  text: Yet she did not abandon her prostitutions from Egypt[a], for in her youth they had lain with her[b], and they fondled her virgin breasts and poured out their prostitution upon her.
  footnotes:
  - marker: a
    text: Or 'her whorings from Egypt.' The Hebrew uses the same prostitution imagery throughout the verse for covenantal unfaithfulness.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'they made/handled the breasts of her virginity,' an explicit sexual image referring to her youthful exploitation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그녀는 이집트[a]에서 비롯된 자기의 음행을 버리지 않았습니다. 그들이 그녀의 젊은 시절에 그녀와 동침하였고[b], 그녀의 처녀 가슴을 만지며 자기들의 음행을 그녀에게 쏟아부었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트에서 비롯된 그녀의 창기질’. 히브리어는 본절 전체에서 같은 성적 이미지를 반복하여 언약적 불성실을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그녀의 처녀성의 가슴들을 만졌다’는 뜻으로, 그녀가 젊었을 때 겪은 성적 착취를 가리키는 노골적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּזְנוּתֶיהָ
  english_pob_choice: her prostitutions
  chosen_korean: 자기의 음행
  alternatives_korean:
  - 그녀의 매춘들
  - 그녀의 창기질
  - 그녀의 매춘 행위들
  lexicon: HALOT
  rationale: 복수형 추상명사는 반복된 음행과 언약적 배역을 함께 가리키므로, 한국어에서는 자연스럽지만 강한 표현인 ‘음행’으로 옮기되 소유를 살려 반복적 성격을 유지했습니다.
- source_word: מִמִּצְרַיִם
  english_pob_choice: from Egypt
  chosen_korean: 이집트에서 비롯된
  alternatives_korean:
  - 이집트로부터
  - 이집트에서
  - 이집트 출신의
  lexicon: HALOT
  rationale: 전치사 מן의 출처 의미를 살려 단순한 위치보다 ‘비롯된’으로 옮겨, 이 음행이 이집트에서 기원했음을 드러냈습니다.
- source_word: שָׁכְבוּ אוֹתָהּ
  english_pob_choice: they had lain with her
  chosen_korean: 그녀와 동침하였고
  alternatives_korean:
  - 그녀와 잠자리를 같이하였고
  - 그녀와 누웠고
  - 그녀와 잠자고
  lexicon: HALOT
  rationale: שׁכב의 성적 완곡어법을 한국어 합쇼체에서 과도한 노골성 없이 유지하기 위해 ‘동침하다’를 택했습니다.
- source_word: עִשּׂוּ דַּדֵּי בְתוּלֶיהָ
  english_pob_choice: they fondled her virgin breasts
  chosen_korean: 그녀의 처녀 가슴을 만지며
  alternatives_korean:
  - 그녀의 처녀 젖가슴을 어루만지며
  - 그녀의 처녀 가슴을 주무르며
  - 그녀의 동정의 가슴을 더듬으며
  lexicon: HALOT
  rationale: 직역상 ‘처녀의 가슴/젖가슴’을 가리키는 노골적 성적 이미지이므로, ‘만지다’로 과도한 세부를 덧붙이지 않으면서도 신체적·성적 접촉을 보존했습니다.
- source_word: וַיִּשְׁפְּכוּ תַזְנוּתָם
  english_pob_choice: poured out their prostitution
  chosen_korean: 자기들의 음행을 그녀에게 쏟아부었습니다
  alternatives_korean:
  - 자기들의 음행을 그녀 위에 쏟았습니다
  - 자기들의 음란을 그녀에게 퍼부었습니다
  - 자기들의 매춘을 그녀에게 쏟아부었습니다
  lexicon: HALOT
  rationale: ‘쏟아붓다’는 원문의 ‘poured out’ 이미지를 살리고, ‘음행’과의 일관성도 유지합니다.
theological_decisions:
- issue: 에스겔의 노골적 성적 비유를 얼마나 직접적으로 살릴 것인가
  chosen_reading: 완곡화하지 않고 성적 이미지와 폭력성을 드러내는 어휘를 유지했습니다.
  alternative_readings:
  - ‘부정’이나 ‘배역’처럼 추상화된 표현으로 순화함
  - 성적 접촉을 전부 은유적 표현으로 약화함
  rationale: 본문은 언약 불성실을 고발하기 위해 충격적인 성적 언어를 의도적으로 사용하므로, 그 수사적 충격을 보존하는 것이 स्रोत 충실성에 더 부합합니다.
  doctrine_reference: Translation philosophy §§1, 6
