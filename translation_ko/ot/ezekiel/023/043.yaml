  source_fidelity: 첫 절의 לְ는 ‘그 여자에게’보다 ‘그 여자에 대하여’로 옮기는 것이 적절합니다. 또한 본문의 난해하고 반복적인 ‘그녀의 음행을 … 그녀 자신도’ 구조와 영어 POB의 ‘with her’를 반영하려면 ‘그녀에게서’가 아니라 ‘그녀와 함께/더불어’가 필요합니다. 히브리어의 구문이 다소 불명확한 점은 해석적으로 과도하게 평탄화하지 않았습니다.
  naturalness: ‘그녀에게서 그녀의 음행을 행하고’는 한국어에서 의미 관계가 부자연스럽고 ‘with her’와도 다릅니다. ‘그녀와 함께 그녀의 음행을 행하겠고’는 원문의 의도적인 반복과 불편한 표현을 보존하면서도 문법적으로 이해 가능합니다.
  terminology: ‘간음’, ‘음행’은 에스겔 23장의 성적 비유 및 반복되는 זנה 계열을 적절히 유지합니다. ‘그녀 자신도’는 וָהִיא의 강조를 반영합니다.
