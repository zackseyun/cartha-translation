  text: וָ/אֹמַ֕ר לַ/בָּלָ֖ה נִֽאוּפִ֑ים עת יזנה תַזְנוּתֶ֖/הָ וָ/הִֽיא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/043.yaml
  text: Then I said of her, worn out by adulteries, ‘Now they will commit her prostitution with her, and she herself as well.’
translation:
  language: ko
  text: 그러자 내가, 간음으로 지쳐 버린 그 여자에게 말했습니다. ‘이제 사람들이 그녀에게서 그녀의 음행을 행하고, 그녀도 또한 그러할 것이다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지쳐 버린’은 히브리어 בָּלָה의 소진·마모 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘음행’은 본문의 반복적 성적 배신을 나타내는 히브리어 זנה 계열을 따른 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַבָּלָה נִאוּפִים
  english_pob_choice: of her, worn out by adulteries
  chosen_korean: 간음으로 지쳐 버린 그 여자에게
  alternatives_korean:
  - 간음으로 닳아 지친 그 여자에게
  - 음행들로 지쳐 버린 그 여자에게
  lexicon: בָּלָה, נִאוּף
  rationale: בָּלָה는 소진·마모의 뉘앙스가 있어 ‘지쳐 버린’으로 자연스럽게 옮겼고, נִאוּפִים는 문맥상 반복적 간음을 가리켜 ‘간음’으로 단순화했습니다.
- source_word: עת יזנה תזנותה
  english_pob_choice: Now they will commit her prostitution
  chosen_korean: 이제 사람들이 그녀에게서 그녀의 음행을 행하고
  alternatives_korean:
  - 이제 그들은 그녀의 음행을 행하고
  - 이제 그들은 그녀의 몸을 더럽히고
  lexicon: עת, זנה, תזנותה
  rationale: 히브리어의 반복 구조를 살리기 위해 ‘이제’와 ‘음행’을 유지하되, 여성의 대상화가 드러나는 소유 구조를 한국어에서도 보이도록 ‘그녀의 음행’을 넣었습니다.
- source_word: וָהִיא
  english_pob_choice: and she herself as well
  chosen_korean: 그녀도 또한 그러할 것이다
  alternatives_korean:
  - 그녀도 역시 그러할 것이다
  - 그녀 자신도 그러할 것이다
  lexicon: וְ + הִיא
  rationale: 마지막 강조는 단순한 추가가 아니라 동일한 행위의 귀결을 강조하므로, ‘그녀도 또한’으로 중복성과 강조를 살렸습니다.
theological_decisions:
- issue: 에스겔 23장의 노골적 성적 비유를 한국어에서 얼마나 직접적으로 보일지
  chosen_reading: ‘음행’과 ‘간음’의 직접어를 유지해 본문의 혐오와 심판 선언을 약화시키지 않았습니다.
  alternative_readings:
  - 완곡하게 ‘타락’이나 ‘부정함’으로 완화
  - ‘음란’만 사용해 성적 언어를 일반화
  rationale: 본문은 의도적으로 충격적 은유를 사용하므로, 완곡화하면 수사적 힘과 심판의 정당한 강도가 줄어듭니다.
  doctrine_reference: 예언서의 심판 수사와 성적 우상숭배 비유
