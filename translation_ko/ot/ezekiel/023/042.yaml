  terminology: ‘광야’, ‘술 취한 자들’, ‘팔찌’, ‘아름다운 관’은 적절합니다. ‘안일한 무리’는 예언서의 비판적 문맥과 שָׁלֵו의 어감을 더 잘 반영합니다.
  issues:
