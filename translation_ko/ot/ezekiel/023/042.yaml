id: EZK.23.42
reference: Ezekiel 23:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ק֣וֹל הָמוֹן֮ שָׁלֵ֣ו בָ/הּ֒ וְ/אֶל אֲנָשִׁים֙ מֵ/רֹ֣ב אָדָ֔ם מוּבָאִ֥ים סובאים מִ/מִּדְבָּ֑ר וַֽ/יִּתְּנ֤וּ צְמִידִים֙ אֶל יְדֵי/הֶ֔ן וַ/עֲטֶ֥רֶת תִּפְאֶ֖רֶת עַל רָאשֵׁי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/042.yaml
  text: And the sound of a carefree multitude was in her[a], and to the men from the mass of mankind were brought drunkards from the wilderness[c][b]; and they put bracelets on their hands and a beautiful crown on their heads.
  footnotes:
  - marker: a
    text: Or 'the sound of a multitude at ease' or 'the sound of a complacent crowd.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of the middle clause is difficult. It may also be understood along the lines of 'and to the men from the multitude of mankind, drunkards were brought from the wilderness.'
    reason: alternative_reading
  - marker: c
    text: '''A beautiful crown'' is literally ''a crown of beauty'' or ''a splendid crown.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀 안에는 한가로운 무리의 소리가 있었고, 사람의 무리 가운데에서 광야에서 데려온 술취한 자들이 있었으며, 그들은 그들의 손에 팔찌를 끼우고 그들의 머리 위에 아름다운 관을 씌웠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한가로운’은 שָׁלֵו의 평안·안일·자족의 뉘앙스를 함께 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 중간절은 난해하여 ‘광야에서 데려온 술취한 자들’로도, ‘사람의 무리에서 온 자들에게 광야에서 술취한 자들이 데려와졌다’는 식으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘아름다운 관’은 문자적으로는 ‘아름다움의 관’ 또는 ‘화려한 관’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹל הָמוֹן שָׁלֵו
  english_pob_choice: the sound of a carefree multitude
  chosen_korean: 한가로운 무리의 소리
  alternatives_korean:
  - 평온한 무리의 소리
  - 안일한 군중의 소리
  lexicon: HALOT
  rationale: קוֹל+הָמוֹן의 감각적 표현을 그대로 살리되, שָׁלֵו의 ‘평안/안일’ 뉘앙스를 ‘한가로운’으로 옮겨 분위기의 도덕적 해이를 함께 드러냈습니다.
- source_word: מֵרֹב אָדָם מוּבָאִים
  english_pob_choice: were brought in from the mass of mankind
  chosen_korean: 사람의 무리 가운데에서 광야에서 데려온
  alternatives_korean:
  - 인류의 무리 가운데에서
  - 사람들의 큰 무리에서
  lexicon: HALOT
  rationale: מֵרֹב אָדָם의 압축된 표현은 ‘사람의 무리’로 살리고, מוּבָאִים은 수동의 ‘데려온’으로 옮겨 외부에서 끌려온 장면을 유지했습니다.
- source_word: סובאים מִמִּדְבָּר
  english_pob_choice: drunkards from the wilderness
  chosen_korean: 광야에서 데려온 술취한 자들이
  alternatives_korean:
  - 광야에서 온 술꾼들이
  - 광야의 주정꾼들이
  lexicon: HALOT
  rationale: 이 구절은 원문상 난해하지만, 문맥상 방탕한 취객을 가리키므로 ‘술취한 자들’로 옮겼고 מִמִּדְבָּר는 ‘광야에서’로 직역해 출처의 낯선 느낌을 보존했습니다.
- source_word: צְמִידִים
  english_pob_choice: bracelets
  chosen_korean: 팔찌
  alternatives_korean:
  - 팔목 장식
  - 완장
  lexicon: HALOT
  rationale: 손/팔에 두는 장신구라는 점을 현대 한국어에서 가장 분명하게 전달하는 기본어를 택했습니다.
- source_word: עֲטֶרֶת תִּפְאֶרֶת
  english_pob_choice: a beautiful crown
  chosen_korean: 아름다운 관
  alternatives_korean:
  - 아름다운 왕관
  - 화려한 관
  - 아름다움의 관
  lexicon: HALOT
  rationale: 직역하면 ‘아름다움의 관’이지만, 한국어에서는 ‘아름다운 관’이 자연스럽고 원문의 장식 이미지도 충분히 살립니다.
theological_decisions:
- issue: 이 구절의 장식과 향락 묘사를 얼마나 직접적으로 드러낼지
  chosen_reading: ‘한가로운 무리’와 ‘술취한 자들’의 대비를 살려, 도덕적 해이와 방탕의 분위기를 완곡하게 낮추지 않고 표현했습니다.
  alternative_readings:
  - ‘평온한 무리’처럼 중립적으로 완화하는 번역
  - ‘술꾼들’처럼 구어적으로 낮추는 번역
  rationale: 예언서의 풍자적·심판적 어조를 유지하려면, 단순한 사회적 활기보다 자기만족적 안일과 향락의 뉘앙스가 드러나야 합니다.
  doctrine_reference: 예언문학의 상징적 고발 어조 보존
- issue: ‘여러분’이 아닌 여성 단수 대명사와 복수 장식 대상의 처리
  chosen_reading: 문맥의 여인/도시 이미지를 따라 ‘그녀 안에’, ‘그들의 손’, ‘그들의 머리’로 옮겼습니다.
  alternative_readings:
  - 주어를 일반화해 ‘그 안에’로 처리
  - 장식 대상을 단수화하여 어색하게 정리
  rationale: 히브리어의 여성 단수 주어와 복수 장식 대상의 긴장을 그대로 보여 주어, 비유의 집단적·상징적 성격을 보존합니다.
  doctrine_reference: 예언 상징언어의 문법적 표지 보존
