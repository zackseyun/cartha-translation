theological_decisions:
- issue: 이 구절의 장식과 향락 묘사를 얼마나 직접적으로 드러낼지
  chosen_reading: ‘한가로운 무리’와 ‘술취한 자들’의 대비를 살려, 도덕적 해이와 방탕의 분위기를 완곡하게 낮추지 않고 표현했습니다.
  alternative_readings:
  - ‘평온한 무리’처럼 중립적으로 완화하는 번역
  - ‘술꾼들’처럼 구어적으로 낮추는 번역
  rationale: 예언서의 풍자적·심판적 어조를 유지하려면, 단순한 사회적 활기보다 자기만족적 안일과 향락의 뉘앙스가 드러나야 합니다.
  doctrine_reference: 예언문학의 상징적 고발 어조 보존
- issue: ‘여러분’이 아닌 여성 단수 대명사와 복수 장식 대상의 처리
  chosen_reading: 문맥의 여인/도시 이미지를 따라 ‘그녀 안에’, ‘그들의 손’, ‘그들의 머리’로 옮겼습니다.
  alternative_readings:
  - 주어를 일반화해 ‘그 안에’로 처리
  - 장식 대상을 단수화하여 어색하게 정리
  rationale: 히브리어의 여성 단수 주어와 복수 장식 대상의 긴장을 그대로 보여 주어, 비유의 집단적·상징적 성격을 보존합니다.
  doctrine_reference: 예언 상징언어의 문법적 표지 보존
