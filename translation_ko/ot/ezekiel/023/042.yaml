  rationale: 손/팔에 두는 장신구라는 점을 현대 한국어에서 가장 분명하게 전달하는 기본어를 택했습니다.
- source_word: עֲטֶרֶת תִּפְאֶרֶת
  english_pob_choice: a beautiful crown
  chosen_korean: 아름다운 관
  alternatives_korean:
