base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/042.yaml
  text: And the sound of a carefree multitude was in her[a], and to the men from the mass of mankind were brought drunkards from the wilderness[c][b]; and they put bracelets on their hands and a beautiful crown on their heads.
  footnotes:
  - marker: a
    text: Or 'the sound of a multitude at ease' or 'the sound of a complacent crowd.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of the middle clause is difficult. It may also be understood along the lines of 'and to the men from the multitude of mankind, drunkards were brought from the wilderness.'
    reason: alternative_reading
  - marker: c
    text: '''A beautiful crown'' is literally ''a crown of beauty'' or ''a splendid crown.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀 안에는 안일한 무리의 소리가 있었고[a], 사람들의 큰 무리에서 온 남자들에게 광야에서 온 술 취한 자들이 데려와졌으며[b], 그들은 그 여자들의 손에 팔찌를 끼우고 그 여자들의 머리에 아름다운 관을 씌웠습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘안일한’은 히브리어 שָׁלֵו의 ‘평안한, 태평한, 자기만족적인’ 뉘앙스를 반영합니다. ‘평온한’ 또는 ‘한가로운’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 중간절은 난해합니다. 본문은 ‘사람들의 큰 무리에서 온 남자들에게 광야에서 온 술 취한 자들이 데려와졌다’로 옮겼습니다. ‘사람들의 큰 무리에서 온 남자들과 함께 광야에서 온 술 취한 자들이 데려와졌다’로 이해할 가능성도 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘아름다운 관’은 문자적으로 ‘아름다움의 관’이며, ‘화려한 관’ 또는 ‘찬란한 관’으로도 옮길 수 있습니다.
    reason: lexical_alternative
