  source_fidelity: 첫 절의 שָׁלֵו는 ‘한가로운’보다 안일하고 자기만족적인 평온을 뜻하므로 ‘안일한’이 더 정확합니다. 또한 난해한 중간절에서 원문의 수동 participle מוּבָאִים(‘데려와졌다/데려왔다’)와 여격 관계를 보존해야 합니다. 마지막 절의 여성 복수 소유 접미사(‘그녀들의 손/머리’)도 한국어에서 드러내는 편이 안전합니다.
