  lexicon: HALOT
  rationale: קוֹל+הָמוֹן의 감각적 표현을 그대로 살리되, שָׁלֵו의 ‘평안/안일’ 뉘앙스를 ‘한가로운’으로 옮겨 분위기의 도덕적 해이를 함께 드러냈습니다.
- source_word: מֵרֹב אָדָם מוּבָאִים
