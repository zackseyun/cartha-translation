  rationale: מֵרֹב אָדָם의 압축된 표현은 ‘사람의 무리’로 살리고, מוּבָאִים은 수동의 ‘데려온’으로 옮겨 외부에서 끌려온 장면을 유지했습니다.
- source_word: סובאים מִמִּדְבָּר
  english_pob_choice: drunkards from the wilderness
  chosen_korean: 광야에서 데려온 술취한 자들이
