- source_word: פַּחוֹת וּסְגָנִים
  english_pob_choice: governors and officials
  chosen_korean: 총독들과 관리들
  alternatives_korean:
  - 지방 총독들과 관리들
  - 관원들과 부관들
  lexicon: HALOT
  rationale: 둘 다 고위 행정관을 가리키며, 한국어에서는 과도한 제도사적 특정화보다 대응성이 높은 ‘총독들과 관리들’이 자연스럽습니다.
- source_word: בַּח֥וּרֵי חֶמֶד
  english_pob_choice: desirable young men
  chosen_korean: 매력적인 젊은이들
  alternatives_korean:
  - 잘생긴 젊은이들
  - 선택된 젊은이들
  lexicon: HALOT
  rationale: חֶמֶד의 심미적·성적 आकर्ष력 뉘앙스를 살리기 위해 ‘매력적인’을 택했고, בַּחוּרִים는 연령대를 드러내는 ‘젊은이들’로 옮겼습니다.
- source_word: פָּרָשִׁים רֹכְבֵי סוּסִים
  english_pob_choice: horsemen riding horses
  chosen_korean: 말 탄 기병들
  alternatives_korean:
  - 말을 타는 기병들
  - 말 위에 탄 기병들
  lexicon: HALOT
  rationale: 중복 표현이지만 히브리어의 강조를 반영해야 하므로, 군사적 집단을 자연스럽게 살리는 동시에 ‘말 탄’으로 반복 의미를 유지했습니다.
