  text: לְבֻשֵׁ֤י תְכֵ֨לֶת֙ פַּח֣וֹת וּ/סְגָנִ֔ים בַּח֥וּרֵי חֶ֖מֶד כֻּלָּ֑/ם פָּרָשִׁ֕ים רֹכְבֵ֖י סוּסִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/006.yaml
  text: clothed in blue[a], governors and officials, all of them desirable young men[c][b], horsemen riding horses.
  footnotes:
  - marker: a
    text: Or 'wearing violet' or 'clothed in purple-blue,' since תְכֵלֶת can denote a blue-violet dyed fabric.
    reason: lexical_alternative
  - marker: b
    text: Or 'handsome young men' or 'choice young men'; the Hebrew emphasizes youthful attractiveness.
    reason: lexical_alternative
  - marker: c
    text: '''Officials'' may also be rendered ''deputies'' or ''prefects.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 푸른 옷을 입은[a] 총독들과 관리들, 모두 매력적인 젊은이들[b], 말 탄 기병들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보랏빛’ 혹은 ‘푸른빛 자주색’으로도 옮길 수 있는데, תְכֵלֶת은 푸른색에서 자주색에 이르는 염색 천을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘잘생긴 젊은이들’ 혹은 ‘선택된 젊은이들’로도 옮길 수 있으며, 히브리어는 젊음의 매력과 미모를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבֻשֵׁי
  english_pob_choice: clothed in
  chosen_korean: 푸른 옷을 입은
  alternatives_korean:
  - 입고 있는
  - 옷을 입은
  lexicon: HALOT
  rationale: לבש의 분사형은 단순 상태 설명이므로, 한국어에서는 자연스럽게 ‘~을 입은’으로 옮기되 뒤의 색상과 결합해 복식 상태를 드러냈습니다.
- source_word: תְכֵלֶת
  english_pob_choice: blue
  chosen_korean: 푸른
  alternatives_korean:
  - 파란
  - 자색-푸른
  lexicon: HALOT
  rationale: תְכֵלֶת은 청색 계열의 염색 천을 가리키므로, 간결하고 문맥에 맞는 ‘푸른’으로 옮겼습니다.
- source_word: פַּחוֹת וּסְגָנִים
  english_pob_choice: governors and officials
  chosen_korean: 총독들과 관리들
  alternatives_korean:
  - 지방 총독들과 관리들
  - 관원들과 부관들
  lexicon: HALOT
  rationale: 둘 다 고위 행정관을 가리키며, 한국어에서는 과도한 제도사적 특정화보다 대응성이 높은 ‘총독들과 관리들’이 자연스럽습니다.
- source_word: בַּח֥וּרֵי חֶמֶד
  english_pob_choice: desirable young men
  chosen_korean: 매력적인 젊은이들
  alternatives_korean:
  - 잘생긴 젊은이들
  - 선택된 젊은이들
  lexicon: HALOT
  rationale: חֶמֶד의 심미적·성적 आकर्ष력 뉘앙스를 살리기 위해 ‘매력적인’을 택했고, בַּחוּרִים는 연령대를 드러내는 ‘젊은이들’로 옮겼습니다.
- source_word: פָּרָשִׁים רֹכְבֵי סוּסִים
  english_pob_choice: horsemen riding horses
  chosen_korean: 말 탄 기병들
  alternatives_korean:
  - 말을 타는 기병들
  - 말 위에 탄 기병들
  lexicon: HALOT
  rationale: 중복 표현이지만 히브리어의 강조를 반영해야 하므로, 군사적 집단을 자연스럽게 살리는 동시에 ‘말 탄’으로 반복 의미를 유지했습니다.
