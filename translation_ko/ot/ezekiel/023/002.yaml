  source_fidelity: 원문은 ‘인자야’라는 호격 뒤에, ‘한 어머니의 딸들’이라는 동격 설명을 지닌 ‘두 여자’가 있었다고 말합니다. 초안도 핵심 의미는 전달하지만, ‘있었는데’와 ‘딸들이었습니다’의 연결은 원문의 단순한 존재 진술에 없는 전환·대조의 뉘앙스를 만들며 문장 구조가 다소 부자연스럽습니다.
  naturalness: ‘한 어머니의 딸인 두 여자가 있었습니다’는 한국어에서 자연스럽고, 두 여자가 동일한 어머니에게서 난 딸들이라는 관계를 분명히 합니다. 현대 표준어 합쇼체의 서술 문체에도 맞습니다.
  terminology: 에스겔의 반복 호격인 ‘인자야’와 נָשִׁים의 비해석적 표현인 ‘두 여자’를 유지하는 것이 적절합니다. 각주 내용은 ‘한 어머니의 딸’이라는 구절의 대안이므로, 기존처럼 ‘인자야’에 붙이지 말고 해당 구절에 붙여야 합니다.
