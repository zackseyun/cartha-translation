  - 두 아내
  lexicon: HALOT
  rationale: 본문은 아직 비유의 마무리 해석을 붙이지 않고 단순히 ‘두 여자’라고 소개하므로, ‘아내들’보다 직접적이고 원문에 가까운 표현을 택했습니다.
- source_word: בְּנ֥וֹת אֵם אַחַ֖ת
  english_pob_choice: daughters of one mother
  chosen_korean: 한 어머니에게서 난 딸들
  alternatives_korean:
  - 한 어머니의 딸들
  - 같은 어머니의 딸들
  lexicon: HALOT
  rationale: 히브리어의 소유/출신 관계를 한국어에서 자연스럽게 풀어, ‘한 어머니에게서 난’으로 두 여자의 동일한 모성을 분명히 했습니다.
- source_word: הָיֽוּ
  english_pob_choice: there were
  chosen_korean: 있었습니다
  alternatives_korean:
  - 있었는데
  - 있었습니다
  lexicon: HALOT
  rationale: 존재 구문의 היה를 한국어 서술형으로 자연스럽게 처리해, 서술 도입의 기능을 살렸습니다.
