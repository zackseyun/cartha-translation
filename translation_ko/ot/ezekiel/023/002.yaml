lexical_decisions:
- source_word: בֶּן אָדָ֑ם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔에서 반복되는 호격을 살려 직역하되, 한국어에서는 자연스러운 예언자 호칭인 ‘인자야’로 옮겨 원문의 호격성과 책 전체의 문체를 보존했습니다.
- source_word: שְׁתַּ֣יִם נָשִׁ֔ים
  english_pob_choice: two women
  chosen_korean: 두 여자
  alternatives_korean:
  - 두 여인
  - 두 아내
  lexicon: HALOT
  rationale: 본문은 아직 비유의 마무리 해석을 붙이지 않고 단순히 ‘두 여자’라고 소개하므로, ‘아내들’보다 직접적이고 원문에 가까운 표현을 택했습니다.
- source_word: בְּנ֥וֹת אֵם אַחַ֖ת
  english_pob_choice: daughters of one mother
  chosen_korean: 한 어머니에게서 난 딸들
  alternatives_korean:
  - 한 어머니의 딸들
  - 같은 어머니의 딸들
  lexicon: HALOT
  rationale: 히브리어의 소유/출신 관계를 한국어에서 자연스럽게 풀어, ‘한 어머니에게서 난’으로 두 여자의 동일한 모성을 분명히 했습니다.
- source_word: הָיֽוּ
  english_pob_choice: there were
  chosen_korean: 있었습니다
  alternatives_korean:
  - 있었는데
  - 있었습니다
  lexicon: HALOT
  rationale: 존재 구문의 היה를 한국어 서술형으로 자연스럽게 처리해, 서술 도입의 기능을 살렸습니다.
theological_decisions:
- issue: ‘인자’ 호칭의 보존
  chosen_reading: 에스겔의 표준 호격을 ‘인자야’로 유지했습니다.
  alternative_readings:
  - ‘사람의 아들아’로 풀어 쓰기
  - ‘인간아’로 일반화하기
  rationale: 이 호칭은 본서의 예언자-청자 관계를 형성하는 반복 표현이므로, 의미를 일반화하기보다 문체와 수사적 힘을 보존하는 편이 본문의 의도에 더 가깝습니다.
  doctrine_reference: prophetic discourse / source-text sensitivity
