  text: וְ/הִשְׁבַּתִּ֥י זִמָּ֖ה מִן הָ/אָ֑רֶץ וְ/נִֽוַּסְּרוּ֙ כָּל הַ/נָּשִׁ֔ים וְ/לֹ֥א תַעֲשֶׂ֖ינָה כְּ/זִמַּתְ/כֶֽנָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/048.yaml
  text: Thus I will put an end to lewdness in the land[a], and all women will be warned and will not act according to your lewdness.
  footnotes:
  - marker: a
    text: Or 'will be disciplined' or 'will be chastened.' The Hebrew verb can denote correction through punishment as well as warning by example.
    reason: lexical_alternative
translation:
  language: ko
  text: 이처럼 내가 그 땅에서 음란을 그치게 하겠으며[a], 모든 여자는 경고를 받아 너희의 음란을 따라 행하지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘징계를 받을 것입니다’, ‘훈계를 받을 것입니다’. 히브리어 동사는 벌을 통한 교정과 본보기로 인한 경고를 모두 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  english_pob_choice: I will put an end
  chosen_korean: 내가 … 그치게 하겠으며
  alternatives_korean:
  - 내가 … 끝내겠으며
  - 내가 … 멈추게 하겠으며
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살리면서, 현대 한국어에서 자연스럽고 단호한 표현인 ‘그치게 하다’로 옮겼습니다.
- source_word: זִמָּה
  english_pob_choice: lewdness
  chosen_korean: 음란
  alternatives_korean:
  - 악행
  - 타락
  - 패륜
  lexicon: HALOT
  rationale: 문맥이 성적·도덕적 타락을 가리키므로, 보다 일반적인 ‘악행’보다 성적 부도덕의 뉘앙스를 드러내는 ‘음란’이 적절합니다.
- source_word: וְנִוַּסְּרוּ
  english_pob_choice: will be warned
  chosen_korean: 경고를 받아
  alternatives_korean:
  - 징계를 받아
  - 교훈을 받아
  - 훈계를 받아
  lexicon: HALOT
  rationale: 이 동사는 징계·교훈의 효과를 모두 가질 수 있는데, 여기서는 본보기로 인한 경계의 의미가 두드러져 ‘경고를 받다’가 가장 직접적입니다.
- source_word: כָּל הַנָּשִׁים
  english_pob_choice: all women
  chosen_korean: 모든 여자는
  alternatives_korean:
  - 모든 여자들은
  - 모든 여성은
  lexicon: HALOT
  rationale: 히브리어의 여성 복수를 그대로 반영해, 예언적 수사 속 성별 표지를 흐리지 않도록 ‘모든 여자’로 직역했습니다.
theological_decisions:
- issue: 예언적 경고의 범위와 성별 표지
  chosen_reading: 본문의 ‘모든 여자’와 2인칭 복수의 ‘너희’를 그대로 살려, 본문의 예언적 경고가 실제 수신자와 상징적 예시를 함께 겨냥한다는 긴장을 유지했습니다.
  alternative_readings:
  - 모든 사람은
  - 그 땅의 모든 여자들은
  rationale: 히브리어가 명시하는 수사 구조를 평탄화하지 않고 보존하는 것이 본문의 경고 효과와 상징성을 더 정확히 드러냅니다.
  doctrine_reference: Gender-accurate rendering; preserve prophetic rhetoric without over-resolving referent scope.
