- source_word: וְנִוַּסְּרוּ
  english_pob_choice: will be warned
  chosen_korean: 경고를 받아
  alternatives_korean:
  - 징계를 받아
  - 교훈을 받아
  - 훈계를 받아
  lexicon: HALOT
  rationale: 이 동사는 징계·교훈의 효과를 모두 가질 수 있는데, 여기서는 본보기로 인한 경계의 의미가 두드러져 ‘경고를 받다’가 가장 직접적입니다.
- source_word: כָּל הַנָּשִׁים
  english_pob_choice: all women
  chosen_korean: 모든 여자는
  alternatives_korean:
  - 모든 여자들은
  - 모든 여성은
  lexicon: HALOT
  rationale: 히브리어의 여성 복수를 그대로 반영해, 예언적 수사 속 성별 표지를 흐리지 않도록 ‘모든 여자’로 직역했습니다.
theological_decisions:
- issue: 예언적 경고의 범위와 성별 표지
  chosen_reading: 본문의 ‘모든 여자’와 2인칭 복수의 ‘너희’를 그대로 살려, 본문의 예언적 경고가 실제 수신자와 상징적 예시를 함께 겨냥한다는 긴장을 유지했습니다.
  alternative_readings:
  - 모든 사람은
  - 그 땅의 모든 여자들은
  rationale: 히브리어가 명시하는 수사 구조를 평탄화하지 않고 보존하는 것이 본문의 경고 효과와 상징성을 더 정확히 드러냅니다.
  doctrine_reference: Gender-accurate rendering; preserve prophetic rhetoric without over-resolving referent scope.
