  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָשַׁבְתְּ֙ עַל מִטָּ֣ה כְבוּדָּ֔ה וְ/שֻׁלְחָ֥ן עָר֖וּךְ לְ/פָנֶ֑י/הָ וּ/קְטָרְתִּ֥/י וְ/שַׁמְנִ֖/י שַׂ֥מְתְּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/041.yaml
  text: You sat on a splendid couch[a], with a table set before it, and on it you placed my incense and my oil.
  footnotes:
  - marker: a
    text: Hebrew feminine suffixes in 'before it' and 'on it' are somewhat ambiguous; they may be understood differently, such as 'before her' for the woman rather than for the couch/table arrangement.
    reason: alternative_reading
translation:
  language: ko
  text: 당신은 화려한 침상에 앉았고, 그 앞에 상이 차려져 있었으며, 그 위에 내 향과 내 기름을 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 여성형 접미사는 문법상 다소 모호합니다. 여기서는 ‘그 앞’을 침상 앞, ‘그 위’를 상 위로 이해하였으나, 특히 ‘그 앞’은 그 여성 인물 앞이라는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִטָּה כְבוּדָּה
  english_pob_choice: a splendid couch
  chosen_korean: 화려한 침상
  alternatives_korean:
  - 화려한 소파
  - 장엄한 침상
  - 호화로운 침대
  lexicon: HALOT
  rationale: מִטָּה는 ‘침상/침대’로도, 앉고 눕는 가구로도 쓰이므로 문맥의 사치스러운 연회·음란 이미지에 맞게 ‘침상’으로 옮기되, כְבוּדָּה의 품격 있고 호사로운 뉘앙스를 ‘화려한’으로 살렸습니다.
- source_word: שֻׁלְחָן עָרוּךְ
  english_pob_choice: a table set
  chosen_korean: 상이 차려져
  alternatives_korean:
  - 준비된 상이
  - 상이 마련되어
  - 차려진 상
  lexicon: HALOT
  rationale: עָרוּךְ는 ‘정돈된, 마련된, 차려진’의 뜻이므로 한국어에서는 연회상을 자연스럽게 떠올리게 하는 ‘차려져’로 옮겼습니다.
- source_word: לְפָנֶיהָ
  english_pob_choice: before it
  chosen_korean: 그 앞에
  alternatives_korean:
  - 그녀 앞에
  - 그 앞쪽에
  - 침상 앞에
  lexicon: HALOT
  rationale: 히브리어 여성형 접미사의 지시 대상이 다소 모호하므로, 영어 POB의 판단을 따라 가구 배치를 우선 살리는 중립적 표현인 ‘그 앞에’를 택했습니다.
- source_word: קְטָרְתִּי וְשַׁמְנִי
  english_pob_choice: my incense and my oil
  chosen_korean: 내 향과 내 기름
  alternatives_korean:
  - 내 향료와 내 기름
  - 내 향기로운 향과 내 기름
  - 내 분향과 내 기름
  lexicon: HALOT
  rationale: קְטָרְתִּי의 1인칭 단수 접미사는 야훼께 속한 향을 가리키므로 ‘내 향’으로 직역해 소유 표지를 유지했고, שַׁמְנִי도 동일하게 ‘내 기름’으로 대응했습니다.
- source_word: שַׂמְתְּ עָלֶיהָ
  english_pob_choice: you placed ... on it
  chosen_korean: 그 위에 두었습니다
  alternatives_korean:
  - 그 위에 놓았습니다
  - 그 위에 올려두었습니다
  - 그 위에 바쳤습니다
  lexicon: HALOT
  rationale: שׂים의 기본 뜻인 ‘두다/놓다’를 살리면서, 반복되는 목적어를 자연스럽게 통합해 한국어 문장 흐름이 끊기지 않도록 했습니다.
theological_decisions:
- issue: ‘내 향’과 ‘내 기름’의 소유격
  chosen_reading: 이를 야훼께 속한 것으로 유지해, 우상적·음란한 장면 속에서 거룩한 것의 전용이라는 긴장을 드러냈습니다.
  alternative_readings:
  - ‘내 향기’와 ‘내 기름’처럼 완화하여 자연스럽게 읽는 방식
  - 단순히 소유를 약화시키는 방식
  rationale: 본문은 값비싼 물품의 진열이 아니라 하나님께 속한 것을 자기 쾌락과 혼합해 사용한 죄책을 강조합니다. 소유격을 유지해야 그 신학적 비난이 선명해집니다.
  doctrine_reference: 거룩한 것의 전용과 언약 파기의 책임
