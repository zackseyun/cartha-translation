id: EZK.23.4
reference: Ezekiel 23:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁמוֹתָ֗/ן אָהֳלָ֤ה הַ/גְּדוֹלָה֙ וְ/אָהֳלִיבָ֣ה אֲחוֹתָ֔/הּ וַ/תִּֽהְיֶ֣ינָה לִ֔/י וַ/תֵּלַ֖דְנָה בָּנִ֣ים וּ/בָנ֑וֹת וּ/שְׁמוֹתָ֕/ן שֹׁמְר֣וֹן אָהֳלָ֔ה וִ/ירוּשָׁלִַ֖ם אָהֳלִיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/004.yaml
  text: 'Their names were Oholah the elder and Oholibah her sister[a]. They became mine and bore sons and daughters. As for their names: Samaria is Oholah[b], and Jerusalem is Oholibah.'
  footnotes:
  - marker: a
    text: The names Oholah and Oholibah likely echo Hebrew words meaning 'her tent' and 'my tent is in her,' reinforcing the allegory.
    reason: cultural_note
  - marker: b
    text: Or 'They were mine'; the Hebrew can be understood as stating possession/relationship, and in context the larger allegory is marital.
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 이름은 나이 많은 아홀라와 그의 자매 아홀리바였습니다[a]. 그들은 내 것이 되었고 아들들과 딸들을 낳았습니다. 그들의 이름을 말하자면, 사마리아는 아홀라이고[b], 예루살렘은 아홀리바입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 두 이름은 각각 ‘그녀의 천막’과 ‘내 천막이 그녀 안에 있다’라는 뜻을 떠올리게 하는 말장난일 가능성이 있습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그들은 내 것이었습니다.’ 히브리어는 소유/관계의 진술로도 이해될 수 있으며, 문맥상 큰 비유는 혼인적입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמוֹתָן
  english_pob_choice: Their names were
  chosen_korean: 그들의 이름은
  alternatives_korean:
  - 그리고 그들의 이름은
  - 그 이름들은
  lexicon: HALOT
  rationale: 두 인물의 소개를 자연스럽게 시작하는 표현으로 옮기되, 이어지는 동일한 이름 재진술을 살릴 수 있게 했습니다.
- source_word: הַגְּדוֹלָה
  english_pob_choice: the elder
  chosen_korean: 나이 많은
  alternatives_korean:
  - 맏이
  - 더 큰
  lexicon: HALOT
  rationale: 둘의 자매 관계 안에서 크기보다 연장됨을 가리키므로, '나이 많은'으로 옮겨 원문의 비교 의미를 드러냈습니다.
- source_word: וַתִּהְיֶינָה לִי
  english_pob_choice: They became mine
  chosen_korean: 그들은 내 것이 되었고
  alternatives_korean:
  - 그들은 내 것이었습니다
  - 그들은 내 소유가 되었습니다
  lexicon: HALOT
  rationale: 단순한 소유 진술을 넘는 관계적 소속을 살리기 위해 '되었고'를 사용해 상태 진입의 뉘앙스를 반영했습니다.
- source_word: בָּנִים וּבָנוֹת
  english_pob_choice: sons and daughters
  chosen_korean: 아들들과 딸들을
  alternatives_korean:
  - 자녀들을
  - 아들과 딸들을
  lexicon: HALOT
  rationale: 히브리어의 남녀 구분을 유지하기 위해 일반화하지 않고 성별 쌍을 그대로 옮겼습니다.
- source_word: שֹׁמְרוֹן אָהֳלָה
  english_pob_choice: Samaria is Oholah
  chosen_korean: 사마리아는 아홀라이고
  alternatives_korean:
  - 사마리아가 아홀라입니다
  - 아홀라는 사마리아입니다
  lexicon: HALOT
  rationale: 비유적 동일시를 분명히 하기 위해 한국어에서 필요한 계사 '는 …이고'를 보완했습니다.
- source_word: וִירוּשָׁלִַם אָהֳלִיבָה
  english_pob_choice: and Jerusalem is Oholibah
  chosen_korean: 예루살렘은 아홀리바입니다
  alternatives_korean:
  - 그리고 예루살렘은 아홀리바입니다
  - 예루살렘이 아홀리바입니다
  lexicon: HALOT
  rationale: 앞절과 평행을 이루게 하되, 도시는 곧 상징적 인물이라는 식별을 선명하게 했습니다.
theological_decisions:
- issue: וַתִּהְיֶינָה לִי의 관계성
  chosen_reading: 소속/관계의 표현으로 옮기고, 본문에 없는 '아내'를 본문 안에 넣지 않았습니다.
  alternative_readings:
  - 그들은 내 아내가 되었습니다
  - 그들은 내 것이었습니다
  rationale: 이 절 자체는 소속 언어를 말할 뿐이므로, 넓은 비유가 혼인적이라는 점은 유지하되 본문보다 더 구체적인 혼인 용어로 좁히지 않았습니다.
  doctrine_reference: 비유의 긴장을 보존하고 본문 범위를 넘지 않기
- issue: 이름의 상징성
  chosen_reading: 이름은 음차하되, 주석으로 히브리어 말장난 가능성을 남겼습니다.
  alternative_readings:
  - 이름 뜻을 본문에 풀어쓰기
  - 주석 없이 단순 음차
  rationale: 본절의 핵심은 도시-인물의 상징적 동일시이므로 본문은 읽기 쉽게 유지하고, 이름의 의미층은 주석으로 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 원문의 수사와 상징을 본문/주석 층위로 분리
