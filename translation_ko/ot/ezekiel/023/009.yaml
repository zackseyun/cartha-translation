id: EZK.23.9
reference: Ezekiel 23:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֥ן נְתַתִּ֖י/הָ בְּ/יַד מְאַֽהֲבֶ֑י/הָ בְּ/יַד֙ בְּנֵ֣י אַשּׁ֔וּר אֲשֶׁ֥ר עָגְבָ֖ה עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/009.yaml
  text: Therefore I gave her into the hand of her lovers[a], into the hand of the sons of Assyria[b], for whom she lusted.
  footnotes:
  - marker: a
    text: 'Or ''the Assyrians.'' Hebrew: ''the sons of Assyria.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'she doted on them.' The Hebrew verb conveys strong desire; here it carries the force of lustful infatuation in Ezekiel's adultery metaphor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 그녀를 그녀의 연인들의 손에, 곧 앗수르의 아들들의 손에 넘겼습니다. 그녀가 그들을 향하여 욕정하였기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘앗수르 사람들’입니다. 히브리어는 ‘앗수르의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀가 그들을 향하여 탐하였습니다.’ 히브리어 동사는 강한 욕망을 뜻하며, 여기서는 에스겔의 간음 은유 안에서 정욕적 집착의 힘을 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그런즉
  lexicon: HALOT
  rationale: 앞 문맥의 판단과 심판 선언을 잇는 인과·결론 표지로서, 현대 한국어에서 가장 자연스럽고 격식 있는 대응을 택했습니다.
- source_word: נְתַתִּיהָ
  english_pob_choice: I gave her
  chosen_korean: 내가 그녀를 ... 넘겼습니다
  alternatives_korean:
  - 내가 그녀를 주었습니다
  - 내가 그녀를 내주었습니다
  - 내가 그녀를 넘겨주었습니다
  lexicon: HALOT
  rationale: אַל/בְּיַד와 결합된 ‘내어주다/넘기다’의 처분적 의미를 살리기 위해, 단순한 ‘주다’보다 권력 이전이 드러나는 표현을 택했습니다.
- source_word: מְאַהֲבֶיהָ
  english_pob_choice: her lovers
  chosen_korean: 그녀의 연인들
  alternatives_korean:
  - 그녀의 사랑하는 사람들
  - 그녀의 정인들
  - 그녀의 애인들
  lexicon: HALOT
  rationale: 에스겔의 간음 은유를 따라 문맥상 부정한 관계 상대를 가리키므로, 중립적 관계어보다 은유를 드러내는 표현을 유지했습니다.
- source_word: בְּנֵי אַשּׁוּר
  english_pob_choice: the sons of Assyria
  chosen_korean: 앗수르의 아들들
  alternatives_korean:
  - 앗수르 사람들
  - 앗수르인들
  lexicon: HALOT
  rationale: 히브리어의 소유격/혈족 표현을 직역에 가깝게 보존해 원문 질감을 살렸습니다. 영어 POB의 각주가 허용하는 ‘앗수르 사람들’은 본문이 아니라 주석적 대안으로 처리했습니다.
- source_word: עָגְבָה עֲלֵיהֶם
  english_pob_choice: she lusted for
  chosen_korean: 그들을 향하여 욕정하였기 때문입니다
  alternatives_korean:
  - 그들을 사모하였기 때문입니다
  - 그들을 탐하였기 때문입니다
  - 그들에게 홀렸기 때문입니다
  lexicon: HALOT
  rationale: 단순한 ‘좋아하다/사모하다’보다, 에스겔의 성적·도덕적 함의를 지닌 강한 욕망을 분명히 드러내는 말로 옮겼습니다.
theological_decisions:
- issue: 에스겔의 외설적 간음 은유를 얼마나 직접적으로 보존할지
  chosen_reading: ‘연인들’과 ‘욕정하였기 때문입니다’를 유지하여 정치적 동맹을 완곡하게 중화하지 않았습니다.
  alternative_readings:
  - ‘동맹자들’과 ‘원하였기 때문입니다’로 더 완곡하게 옮김
  rationale: 원문은 외국 세력과의 결탁을 간음 은유로 고발하므로, 은유의 도덕적 충격을 보존하는 것이 본문의 예언적 힘을 유지합니다.
  doctrine_reference: 번역 철학 §§1, 3, 6
