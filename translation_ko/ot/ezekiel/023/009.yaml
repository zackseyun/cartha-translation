revisions:
- from: 그러므로 내가 그녀를 그녀의 연인들의 손에, 곧 앗수르의 아들들의 손에 넘겼습니다. 그녀가 그들을 향하여 욕정하였기 때문입니다.[a][b]
  to: 그러므로 내가 그녀를 그녀의 연인들, 곧 그녀가 욕정을 품었던[a] 앗수르 사람들[b]의 손에 넘겼습니다.
  rationale: 관계절을 ‘그녀가 욕정을 품었던’으로 복원하여 원문의 통사를 보존했습니다. 현대 한국어의 자연스러움을 위해 ‘앗수르 사람들’을 본문에 쓰고, 히브리어의 ‘앗수르의 아들들’은 해당 어구의 각주로 옮겼습니다. 또한 각주 표지를 각각 욕망 동사와 민족 명칭에 직접 붙여 주석 대상을 명확히 했습니다.
