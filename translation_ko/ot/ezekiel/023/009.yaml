  source_fidelity: 원문의 두 번 반복된 ‘~의 손에’와 ‘내가 ... 넘겼습니다’의 처분/심판 의미는 대체로 잘 반영했습니다. 그러나 אֲשֶׁר עָגְבָה עֲלֵיהֶם은 앗수르 사람들을 수식하는 관계절이지 ‘그녀가 욕정하였기 때문입니다’라는 인과절이 아닙니다. 인과관계를 넣으면 원문의 통사와 강조가 바뀝니다.
  naturalness: ‘그녀가 그들을 향하여 욕정하였기 때문입니다’는 현대 한국어에서 다소 어색하고, 앞 문장의 대상을 다시 인과절로 반복합니다. ‘그녀가 욕정을 품었던 앗수르 사람들’로 관계절을 구성하면 자연스럽고 원문 구조에도 맞습니다. 본문에서는 ‘앗수르 사람들’이 현대 표준어로 자연스러우며, 직역 표현은 각주에 보존할 수 있습니다.
  terminology: ‘연인들’은 에스겔의 성적/간음 은유를 보존하는 적절한 표현입니다. ‘욕정을 품었던’도 עָגְבָה의 강한 욕망과 문맥상의 성적 함의를 무리 없이 전달합니다. ‘앗수르 사람들’에는 ‘앗수르의 아들들’이라는 히브리어 표현을 밝히는 각주를 연결합니다.
