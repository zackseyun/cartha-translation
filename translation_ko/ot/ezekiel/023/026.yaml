lexical_decisions:
- source_word: וְהִפְשִׁיטוּךְ
  english_pob_choice: they will strip you
  chosen_korean: 옷을 벗기고
  alternatives_korean:
  - 벗겨 버리고
  - 알몸으로 만들고
  lexicon: HALOT
  rationale: 히필형 פשט는 대상을 옷에서 벗겨 내는 뜻이므로, ‘옷을 벗기고’가 자연스럽고 원문에 충실합니다.
- source_word: בְּגָדָיִךְ
  english_pob_choice: your garments
  chosen_korean: 네 옷
  alternatives_korean:
  - 네 의복
  - 네 의상
  lexicon: HALOT
  rationale: בגד은 일반적인 의복을 가리키므로, 현대 한국어에서는 ‘옷’이 가장 직접적이고 분명합니다.
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  english_pob_choice: your splendid ornaments
  chosen_korean: 네 화려한 장식품
  alternatives_korean:
  - 네 아름다운 장식품
  - 네 빛나는 장식품
  - 네 장식품
  lexicon: HALOT
  rationale: כְּלִי는 문맥상 장식물이나 장신구를 뜻하고, תפארת는 화려함/찬란함의 뉘앙스를 가지므로 ‘화려한 장식품’이 본문의 장식적 의미를 비교적 सीधे하게 살립니다.
theological_decisions:
- issue: 수치와 모욕의 심판 이미지
  chosen_reading: 신체적 노출을 완곡하게 누그러뜨리지 않고, ‘옷을 벗기고’라고 직접적으로 옮겼습니다.
  alternative_readings:
  - ‘벌거벗기고’
  - ‘수치스럽게 드러내고’
  rationale: 본문은 예루살렘의 심판을 성적·모욕적 이미지로 묘사하므로, 의미를 약화시키지 않는 직역적 표현이 필요합니다.
  doctrine_reference: 예언서의 심판 선언과 언약 위반에 대한 수치의 표상
