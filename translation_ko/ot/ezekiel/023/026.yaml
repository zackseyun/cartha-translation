  lexicon: HALOT
  rationale: כְּלִי는 문맥상 장식물이나 장신구를 뜻하고, תפארת는 화려함/찬란함의 뉘앙스를 가지므로 ‘화려한 장식품’이 본문의 장식적 의미를 비교적 सीधे하게 살립니다.
