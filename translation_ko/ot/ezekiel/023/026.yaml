  lexicon: HALOT
  rationale: בגד은 일반적인 의복을 가리키므로, 현대 한국어에서는 ‘옷’이 가장 직접적이고 분명합니다.
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  english_pob_choice: your splendid ornaments
  chosen_korean: 네 화려한 장식품
