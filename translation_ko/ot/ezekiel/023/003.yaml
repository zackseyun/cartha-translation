  - 창기로 행하였습니다
  lexicon: HALOT
  rationale: זנה의 비유적·성적 의미를 살리되, 한국어에서는 ‘음행하다’가 예언적 고발문맥에 비교적 직접적이고 문체도 과도하게 구어적이지 않습니다.
- source_word: בְּמִצְרַיִם
  english_pob_choice: in Egypt
  chosen_korean: 이집트에서
  alternatives_korean:
  - 애굽에서
  lexicon: HALOT
  rationale: 지명은 현대 표준 표기인 ‘이집트’를 택하되, 고어적 교회 용례인 ‘애굽’보다 현대 독자가 즉시 알아보기 쉬운 표현을 사용했습니다.
- source_word: מֹעֲכוּ שְׁדֵי/הֶן
  english_pob_choice: their breasts were fondled
  chosen_korean: 그들의 가슴이 만져졌고
  alternatives_korean:
  - 그들의 젖가슴이 눌렸고
  - 그들의 유방이 어루만져졌고
  lexicon: HALOT
  rationale: מעך의 문자적 ‘누르다/짓누르다’보다 성적 맥락에서의 침해성을 드러내기 위해, 한국어에서는 ‘만져졌다’로 옮겨 그래픽한 의미를 유지했습니다.
- source_word: וְ/שָׁ֣ם עִשּׂ֔וּ דַּדֵּ֖י בְּתוּלֵי/הֶן
  english_pob_choice: there they handled the breasts of their virginity
  chosen_korean: 거기에서 그들의 처녀의 유방이 다루어졌습니다
  alternatives_korean:
  - 거기에서 그들의 처녀의 가슴이 만져졌습니다
  - 거기에서 그들의 동정의 유방이 다루어졌습니다
  lexicon: HALOT
  rationale: דַּדֵּי בְּתוּלֵיהֶן의 난해하고 노골적인 표현을 과도하게 완화하지 않고, ‘처녀의 유방’으로 직역에 가깝게 살려 성적 오염의 강조를 보존했습니다.
theological_decisions:
- issue: 예언자적 성적 은유의 직설성 유지
  chosen_reading: 주어지는 수치를 약화시키는 완곡어법보다, 본문이 의도한 노골성을 한국어 본문에서도 유지했습니다.
  alternative_readings:
  - ‘더럽혀졌다’와 같은 포괄적 표현으로 완화하기
  - ‘연인들에게 희롱당했다’처럼 은유로 바꾸기
  rationale: 히브리어는 이스라엘의 배교를 충격적으로 고발하기 위해 성적 이미지를 의도적으로 사용하므로, 번역에서도 그 강도를 보존하는 것이 본문 의미에 충실합니다.
  doctrine_reference: 예언문학의 은유와 수사적 충격 효과
