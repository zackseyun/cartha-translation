base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/003.yaml
  text: They prostituted themselves in Egypt[a]; in their youth they committed prostitution there. There their breasts were fondled[c][b], and there their virgin bosoms were handled.
  footnotes:
  - marker: a
    text: Or, 'They played the prostitute in Egypt; in their youth they committed whoredom there.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses explicit sexual imagery to depict early unfaithfulness and defilement.
    reason: cultural_note
  - marker: c
    text: Or, 'there they squeezed their breasts, and there they handled the breasts of their virginity.' The Hebrew expressions are graphic and difficult; the translation aims to preserve the sense in natural English.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 이집트에서 음행하였으며[a], 젊은 시절에 거기에서 음행하였습니다. 거기에서 그들의 유방이 눌렸고[b][c], 거기에서 그들의 처녀 시절의 유방이 다루어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들은 이집트에서 창녀 노릇을 하였으며, 젊은 시절에 거기에서 음행하였습니다.’
    reason: alternative_reading
  - marker: b
    text: 히브리어는 이른 시기의 불성실과 더러움을 묘사하기 위해 노골적인 성적 이미지를 사용합니다.
    reason: cultural_note
  - marker: c
    text: 또는, ‘거기에서 그들이 그들의 유방을 눌렀고, 거기에서 그들이 그들의 처녀 시절의 유방을 다루었습니다.’ 히브리어 표현은 매우 노골적이며 난해합니다. 번역은 자연스러운 한국어로 그 의미를 살리려 하였습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶינָה
  english_pob_choice: they prostituted themselves
  chosen_korean: 음행하였고
  alternatives_korean:
