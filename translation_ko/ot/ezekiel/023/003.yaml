translation:
  language: ko
  text: 그들은 이집트에서 음행하였고[a], 젊은 시절에 거기에서 음행하였습니다. 거기에서 그들의 가슴이 만져졌고[b][c], 거기에서 그들의 처녀의 유방이 다루어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들은 이집트에서 몸을 팔았습니다; 젊은 시절에 거기에서 음행하였습니다.’
    reason: alternative_reading
  - marker: b
    text: 히브리어는 이른 시기의 불성실과 더러움을 묘사하기 위해 노골적인 성적 이미지를 사용합니다.
    reason: cultural_note
  - marker: c
    text: 또는, ‘거기에서 그들의 가슴을 눌렀고, 거기에서 그들의 처녀의 가슴을 다루었습니다.’ 히브리어 표현은 매우 노골적이며 난해하므로, 번역은 자연스러운 한국어로 의미를 살리려 했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶינָה
