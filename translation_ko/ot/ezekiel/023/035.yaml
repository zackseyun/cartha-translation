source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֚עַן שָׁכַ֣חַתְּ אוֹתִ֔/י וַ/תַּשְׁלִ֥יכִי אוֹתִ֖/י אַחֲרֵ֣י גַוֵּ֑/ךְ וְ/גַם אַ֛תְּ שְׂאִ֥י זִמָּתֵ֖/ךְ וְ/אֶת תַּזְנוּתָֽיִ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/035.yaml
  text: 'Therefore thus says the Lord GOD: Because you have forgotten me and cast me behind your back[a], you also must bear your lewdness and your prostitutions.'
  footnotes:
  - marker: a
    text: Or 'and threw me behind your back.' The Hebrew idiom expresses deliberate rejection or disregard.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 말씀하십니다. 네가 나를 잊어버리고 네 등 뒤로 던져 버렸으므로, 너도 네 음란함과 네 음행들을 짊어져야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 단순한 위치 이동보다 의도적인 배척과 무시를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 복합 칭호를 한국어에서 직역에 가깝게 살리되, 본문의 신명 표기를 야훼로 드러내어 원문의 언약명과 주권 칭호를 함께 보존했습니다.
- source_word: שָׁכַחַתְּ אֹתִי
  english_pob_choice: you have forgotten me
  chosen_korean: 네가 나를 잊어버리고
  alternatives_korean:
  - 네가 나를 잊고
  - 네가 나를 잊었습니다
  lexicon: HALOT
  rationale: 완료된 거부 행위를 현재적 책임으로 고발하는 뉘앙스를 살려 '잊어버리고'로 옮겼습니다.
- source_word: וַתַּשְׁלִיכִי אֹתִי אַחֲרֵי גַוֵּךְ
  english_pob_choice: and cast me behind your back
  chosen_korean: 네 등 뒤로 던져 버렸으므로
  alternatives_korean:
  - 네 뒤로 던졌으므로
  - 나를 네 뒤로 내던졌으므로
  lexicon: HALOT
  rationale: 히브리어 관용구의 의도적 배척을 자연스러운 한국어로 살리되, '등 뒤'로 옮겨 POB의 'behind your back'에 해당하는 배척 이미지를 유지했습니다.
- source_word: שְׂאִי זִמָּתֵךְ וְאֶת תַּזְנוּתָיִךְ
  english_pob_choice: you also must bear your lewdness and your prostitutions
  chosen_korean: 너도 네 음란함과 네 음행들을 짊어져야 합니다
  alternatives_korean:
  - 너도 네 음란함과 네 음행들을 져야 합니다
  - 너도 네 음란함과 네 포행을 감당해야 합니다
  lexicon: HALOT
  rationale: 심판 선언의 חובה/결과 의미를 반영해 '짊어져야 합니다'로 옮겼고, זִמָּה와 תַּזְנוּת의 성적·언약적 타락을 각각 '음란함'과 복수형 '음행들'로 구분했습니다.
theological_decisions:
- issue: 야훼의 표기와 복합 신칭호 처리
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 본문은 אֲדֹנָי와 יְהוִה를 함께 사용하므로, 한국어에서도 주권 칭호와 신명 표기를 동시에 드러내는 형태가 가장 원문충실적입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה / YHWH → 야훼'
- issue: 명령형 שְׂאִי의 심판적 기능
  chosen_reading: 너도 네 음란함과 네 음행들을 짊어져야 합니다
  alternative_readings:
  - 너도 네 음란함과 네 음행들을 져야 합니다
  - 너도 네 음란함과 네 음행들을 받게 됩니다
  rationale: 형식상 명령형이지만 문맥상 실제 명령보다 판결 선포이므로, 의무와 불가피성을 함께 드러내는 표현으로 옮겼습니다.
  doctrine_reference: Ezekiel 23 심판 신탁의 선언적 명령
