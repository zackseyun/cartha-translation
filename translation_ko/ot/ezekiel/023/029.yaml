  text: וְ/עָשׂ֨וּ אוֹתָ֜/ךְ בְּ/שִׂנְאָ֗ה וְ/לָקְחוּ֙ כָּל יְגִיעֵ֔/ךְ וַ/עֲזָב֖וּ/ךְ עֵירֹ֣ם וְ/עֶרְיָ֑ה וְ/נִגְלָה֙ עֶרְוַ֣ת זְנוּנַ֔יִ/ךְ וְ/זִמָּתֵ֖/ךְ וְ/תַזְנוּתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/029.yaml
  text: They will deal with you in hatred[a], and they will take all your wealth, and leave you naked and bare; and the nakedness of your prostitutions will be uncovered[c][b], your lewdness and your acts of prostitution.
  footnotes:
  - marker: a
    text: Or 'all you have worked for.' The Hebrew 'your labor' can refer to the fruit or gain of one's toil.
    reason: lexical_alternative
  - marker: b
    text: Or 'the shame of your prostitutions will be exposed.' 'Nakedness' here carries the sense of shameful exposure.
    reason: lexical_alternative
  - marker: c
    text: Or 'along with your lewdness and your acts of prostitution'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 너를 미워하는 마음으로 대할 것이며, 네가 애써 모은 모든 것을 빼앗아 가고, 너를 벌거벗은 몸과 알몸으로 남길 것이다. 또 네 음행의 벌거벗음이 드러나고, 네 음탕함과 네 음행이 드러날 것이다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네가 애써 일한 모든 것.’ 히브리어 ‘네 수고’는 수고의 열매나 소산을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 음행의 수치가 드러날 것이다.’ 여기서 ‘벌거벗음’은 수치스러운 노출의 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘네 음탕함과 네 음행과 함께’.
    reason: previous_rendering
lexical_decisions:
- source_word: וְעָשׂוּ אֹתָךְ בְּשִׂנְאָה
  english_pob_choice: They will deal with you in hatred
  chosen_korean: 너를 미워하는 마음으로 대할 것이다
  alternatives_korean:
  - 너를 미워하며 대할 것이다
  - 너를 증오로 대할 것이다
  lexicon: HALOT
  rationale: עשה + 목적어 + בְּ의 관용적 결합을 한국어로는 ‘대하다’로 살리고, בְּשִׂנְאָה의 적대적 태도를 ‘미워하는 마음으로’로 자연스럽게 옮겼습니다.
- source_word: וְלָקְחוּ כָּל יְגִיעֵךְ
  english_pob_choice: they will take all your wealth / labor
  chosen_korean: 네가 애써 모은 모든 것을 빼앗아 가고
  alternatives_korean:
  - 네 모든 수고를 가져가고
  - 네 모든 재산을 빼앗고
  lexicon: HALOT
  rationale: יְגִיעַ는 ‘수고, 노동’이면서 그 결과로 얻은 소산까지 가리킬 수 있으므로, 문맥의 빼앗김을 드러내면서도 파생 의미를 포괄하는 표현으로 옮겼습니다.
- source_word: וַעֲזָבוּךְ עֵירֹם וְעֶרְיָה
  english_pob_choice: leave you naked and bare
  chosen_korean: 너를 벌거벗은 몸과 알몸으로 남길 것이다
  alternatives_korean:
  - 너를 벌거벗기고 알몸으로 남길 것이다
  - 너를 벌거벗은 채로 남길 것이다
  lexicon: HALOT
  rationale: 중첩된 표현 עֵירֹם וְעֶרְיָה의 강조를 한국어의 이중 표현으로 살리되, 수치와 완전한 박탈감을 분명히 하도록 했습니다.
- source_word: עֶרְוַת זְנוּנַיִךְ
  english_pob_choice: the nakedness of your prostitutions
  chosen_korean: 네 음행의 벌거벗음
  alternatives_korean:
  - 네 음행의 수치
  - 네 음행의 드러남
  lexicon: HALOT
  rationale: עֶרְוָה의 기본 뜻인 ‘벌거벗음’과 수치스러운 노출의 뉘앙스를 함께 살리고, זְנוּנִים은 에스겔의 예언적 성적 비유에 맞게 ‘음행’으로 옮겼습니다.
- source_word: וְזִמָּתֵךְ וְתַזְנוּתָיִךְ
  english_pob_choice: your lewdness and your acts of prostitution
  chosen_korean: 네 음탕함과 네 음행이
  alternatives_korean:
  - 네 음탕함과 네 창기가
  - 네 추행과 네 음행이
  lexicon: HALOT
  rationale: זִמָּה는 이 문맥에서 성적 타락과 방종을 가리키므로 ‘음탕함’이 적절하고, תַזְנוּת는 반복적 행위를 드러내기 위해 ‘음행’으로 옮겼습니다.
theological_decisions:
- issue: 에스겔의 노골적 성적 비유를 어떻게 처리할지
  chosen_reading: ‘음행’, ‘벌거벗음’, ‘음탕함’을 그대로 살려 수치의 예언적 폭력을 약화시키지 않았습니다.
  alternative_readings:
  - ‘부정함’이나 ‘불신실함’처럼 완화된 표현으로 옮김
  - 성적 이미지를 우회적으로 처리함
  rationale: 본문은 예루살렘의 배신과 수치를 충격적인 성적 언어로 폭로하므로, 이를 완화하면 원문의 예언 수사가 약해집니다.
  doctrine_reference: 원문 우선 번역 원칙; 예언서의 수치-노출 이미지 보존
