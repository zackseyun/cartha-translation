base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/021.yaml
  text: Thus you revisited the lewdness of your youth[a], when in Egypt they fondled your breasts[c][b], the breasts of your youth.
  footnotes:
  - marker: a
    text: Or 'you remembered the lewdness of your youth.' The Hebrew verb can mean 'visit,' 'attend to,' or 'call to mind'; here it likely includes the sense of returning to former behavior.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from Egypt'; the phrase is rendered idiomatically as 'in Egypt' because the clause refers to what was done there.
    reason: lexical_alternative
  - marker: c
    text: Or 'fondled your breasts.' The Hebrew expression is sexually explicit and refers to erotic handling in Egypt.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 젊은 시절의 음탕한 행실을 되풀이하셨습니다[a]. 이집트 사람들이 당신의 젊은 시절의 젖가슴을 탐하여 당신의 젖가슴을 더듬던 때에 말입니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신은 젊은 시절의 음탕한 행실을 기억하셨습니다.’ 히브리어 פקד는 ‘방문하다’, ‘돌보다’, ‘기억하다’ 등의 뜻을 가질 수 있습니다. 여기서는 과거의 행실로 다시 돌아가 그것을 되풀이한다는 뜻을 포함하는 것으로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘이집트로부터’입니다. 문맥상 이집트가 행위의 장소이자 행위자들의 출처를 가리키므로, 뜻을 분명히 하기 위해 ‘이집트 사람들이’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신의 젖가슴을 만지던.’ 히브리어 표현은 성적으로 노골적이며, 이집트에서 있었던 에로틱한 접촉을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְקְדִי
  english_pob_choice: you revisited
  chosen_korean: 다시 떠올렸습니다
  alternatives_korean:
