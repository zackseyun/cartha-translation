  text: Thus you revisited the lewdness of your youth[a], when in Egypt they fondled your breasts[c][b], the breasts of your youth.
  footnotes:
  - marker: a
    text: Or 'you remembered the lewdness of your youth.' The Hebrew verb can mean 'visit,' 'attend to,' or 'call to mind'; here it likely includes the sense of returning to former behavior.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from Egypt'; the phrase is rendered idiomatically as 'in Egypt' because the clause refers to what was done there.
    reason: lexical_alternative
  - marker: c
    text: Or 'fondled your breasts.' The Hebrew expression is sexually explicit and refers to erotic handling in Egypt.
    reason: lexical_alternative
translation:
  language: ko
  text: 이렇게 당신은 젊은 시절의 음탕함을 다시 떠올렸습니다[a]. 곧, 이집트에서 당신의 젖가슴을 만졌으니[b][c], 곧 젊은 시절의 젖가슴입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신은 젊은 시절의 음탕함을 기억하였습니다.’ פקד는 ‘방문하다’, ‘돌보다’, ‘기억하다’의 뜻을 가질 수 있으며, 여기서는 과거의 행위로 되돌아감을 포함하는 의미로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘이집트로부터’이지만, 문맥상 그곳에서 벌어진 일을 가리키므로 ‘이집트에서’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신의 젖가슴을 더듬었습니다.’ 히브리어 표현은 성적으로 노골적이며, 이집트에서의 에로틱한 접촉을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְקְדִי
  english_pob_choice: you revisited
  chosen_korean: 다시 떠올렸습니다
  alternatives_korean:
  - 다시 찾아보았습니다
  - 다시 생각해 냈습니다
  - 다시 돌아보았습니다
  lexicon: HALOT
  rationale: פקד는 문맥상 ‘기억하다’와 ‘다시 찾아 행하다’의 뜻을 함께 담을 수 있어, 반복적·재개적 뉘앙스를 살린 ‘다시 떠올렸습니다’가 가장 자연스럽습니다.
- source_word: זִמַּת
  english_pob_choice: lewdness
  chosen_korean: 음탕함
  alternatives_korean:
  - 음란함
  - 타락
  - 사악함
  lexicon: HALOT
  rationale: 성적·도덕적 문맥의 זִמָּה는 노골적인 성적 타락을 가리키므로, 완곡한 ‘타락’보다 직접적인 ‘음탕함’이 원문 힘을 더 잘 살립니다.
- source_word: מִמִּצְרַיִם
  english_pob_choice: in Egypt
  chosen_korean: 이집트에서
  alternatives_korean:
  - 이집트로부터
  - 이집트 안에서
  - 이집트 사람들에 의해
  lexicon: HALOT
  rationale: 형식상 ‘from’이지만, 여기서는 행위가 벌어진 장소를 가리키는 관용적 용법이므로 ‘이집트에서’로 옮기는 편이 문맥에 맞습니다.
- source_word: דַּדַּיִךְ
  english_pob_choice: your breasts
  chosen_korean: 당신의 젖가슴
  alternatives_korean:
  - 당신의 가슴
  - 당신의 유방
  lexicon: HALOT
  rationale: 몸의 부위를 노골적으로 지칭하는 표현이므로, 완곡한 ‘가슴’보다 ‘젖가슴’이 성적 뉘앙스를 더 정확히 전달합니다.
theological_decisions:
- issue: 예언자적 책망에서의 노골적 성적 이미지 보존
  chosen_reading: ‘음탕함’, ‘젖가슴’처럼 본문의 노골적 성적 이미지를 그대로 살렸습니다.
  alternative_readings:
  - ‘부도덕’, ‘가슴’처럼 완곡하게 옮김
  rationale: 이 구절은 예루살렘의 언약 불신실함을 수치스럽고 충격적인 성적 이미지로 고발하므로, 완곡화하면 예언적 수사와 심판의 강도가 약해집니다.
  doctrine_reference: 원문 우선 번역 원칙; 본문이 허용하는 힘을 약화시키지 않음.
