revisions:
- from: 이는 주 하나님께서 말씀하셨기 때문입니다. 그들을 향해 한 집회를 불러올리고, 그들을 공포와 약탈에 넘기십시오.[a]
  to: 이는 주 야훼께서 이렇게 말씀하십니다. “그들을 치도록 한 무리를 올라오게 하고, 그 여자들을 공포와 약탈의 대상으로 넘기십시오.[a]”
  rationale: 원문의 선언 공식과 직접 명령 구조를 회복하고, 심판을 위해 동원되는 집단이라는 문맥에 맞게 קָהָל을 ‘한 무리’로 수정했습니다. 또한 남성 복수에서 여성 복수로 바뀌는 원문의 지시 대상과 אֲדֹנָי יְהוִה에 포함된 신명을 번역에 반영했습니다. זַעֲוָה의 ‘공포/전율의 대상’이라는 어휘적 여지는 각주로 보존했습니다.
