id: EZK.23.46
reference: Ezekiel 23:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הַעֲלֵ֤ה עֲלֵי/הֶם֙ קָהָ֔ל וְ/נָתֹ֥ן אֶתְ/הֶ֖ן לְ/זַעֲוָ֥ה וְ/לָ/בַֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/046.yaml
  text: 'For thus says the Lord GOD: Bring up an assembly against them[a], and give them over to terror and plunder.'
  footnotes:
  - marker: a
    text: Or 'give them over for horror and for plunder.' The Hebrew noun זַעֲוָה can also be rendered 'horror,' emphasizing that they become an object of dread.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 주 하나님께서 말씀하셨기 때문입니다. 그들을 향해 한 집회를 불러올리고, 그들을 공포와 약탈에 넘기십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 공포와 약탈의 대상으로 넘기십시오.’ 히브리어 זַעֲוָה는 ‘공포’ 외에 ‘전율/소름 끼침’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와
  lexicon: HALOT
  rationale: 아도나이와 야훼의 결합을 한국어에서는 중복 없이 ‘주 하나님’으로 옮겨, 영어 POB의 ‘Lord GOD’처럼 두 신칭 요소를 구별하면서도 자연스럽게 표현했습니다.
- source_word: הַעֲלֵה
  english_pob_choice: Bring up
  chosen_korean: 불러올리고
  alternatives_korean:
  - 올려라
  - 불러오십시오
  - 소집하십시오
  lexicon: HALOT
  rationale: 문맥상 심판을 위한 집회의 소집·동원을 뜻하므로, 단순한 물리적 ‘올림’보다 명령성 있는 ‘불러올리다’로 옮겨 원문의 동원 이미지를 살렸습니다.
- source_word: קָהָל
  english_pob_choice: an assembly
  chosen_korean: 한 집회
  alternatives_korean:
  - 한 회중
  - 한 모임
  - 한 무리
  lexicon: HALOT
  rationale: קָהָל의 핵심은 ‘모여 있는 집합체’이므로 ‘집회’로 옮겼고, 심판 문맥에 맞게 군사적 뉘앙스를 과도하게 특정하지 않았습니다.
- source_word: לְזַעֲוָה
  english_pob_choice: to terror
  chosen_korean: 공포에
  alternatives_korean:
  - 전율에
  - 두려움에
  - 소름 끼침에
  lexicon: HALOT
  rationale: זַעֲוָה는 ‘공포/전율/소름 끼침’의 뜻을 가질 수 있으므로, 영어 POB의 ‘terror’에 맞춰 결과 상태를 나타내는 ‘공포에’로 옮겼습니다.
- source_word: לָבַז
  english_pob_choice: and plunder
  chosen_korean: 약탈에
  alternatives_korean:
  - 노략질에
  - 노획에
  - 약탈당하게
  lexicon: HALOT
  rationale: בַּז는 ‘약탈/노획물’을 뜻하므로, 병렬 구조를 살려 ‘공포와 약탈에’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 처리
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 이 절의 אֲדֹנָי יְהוִה는 고정 신칭 결합이므로, 한국어에서는 예배적 표현의 자연스러움과 구별성을 위해 ‘주 하나님’을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: יְהוָה 표기 원칙; אֲדֹנָי יְהוִה 결합 처리'
