  verdict: revise
  source_fidelity: 원문의 כִּי כֹה אָמַר는 과거의 이유절(‘말씀하셨기 때문입니다’)이 아니라 현재적 선언 공식인 ‘이는 주 야훼께서 이렇게 말씀하십니다’로 옮겨야 합니다. 또한 הַעֲלֵה와 וְנָתֹן은 하나의 직접 명령 발화 안에서 유지되어야 하며, עֲלֵיהֶם(남성 복수)에서 אֶתְהֶן(여성 복수)으로 바뀌는 지시 대상의 성을 번역에 반영하는 것이 안전합니다.
  naturalness: ‘한 집회를 불러올리고’는 한국어에서 부자연스럽고, 적대적·징벌적 집단을 가리키는 문맥에도 잘 맞지 않습니다. ‘한 무리를 올라오게 하다’가 원문의 동원 이미지를 자연스럽게 보존합니다. ‘공포와 약탈의 대상으로 넘기다’는 두 לְ구의 결과·처분 의미를 자연스럽게 드러냅니다.
  terminology: אֲדֹנָי יְהוִה의 두 요소와 신명을 보존하여 ‘주 야훼’로 옮깁니다. קָהָל은 여기서 예배 또는 정치적 ‘집회’로 한정하지 않고 ‘무리’로 옮깁니다. זַעֲוָה는 ‘공포’뿐 아니라 사람들이 두려워하는 ‘공포의 대상/전율의 대상’이라는 의미도 가능하므로 각주에 보존합니다.
