  source_fidelity: 히브리어의 핵심 구조와 비유는 대체로 보존되어 있습니다. 그러나 תַּחְתַּי는 ‘내게 속한 동안’보다 ‘내 아래에 있으면서/있을 때’로 옮겨야 원문의 공간적·권위적 혼인 비유를 직접 유지합니다. 또한 עגב의 강한 성적 욕망은 단순히 ‘탐하다’보다 ‘욕정을 품다’가 더 분명하게 전달합니다.
  naturalness: ‘내 아래에 있으면서’는 비유적 문맥에서 자연스럽고, ‘그녀의 연인들, 곧 가까이 있는 앗시리아 사람들에게 욕정을 품했습니다’는 원문의 동격 관계와 방향성을 명료하게 드러냅니다. 다만 ‘품했습니다’가 아닌 ‘품었습니다’로 표기합니다.
