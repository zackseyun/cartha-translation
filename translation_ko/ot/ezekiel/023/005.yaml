  yaml_path: translation/ot/ezekiel/023/005.yaml
  text: Oholah played the prostitute while under me[a], and she lusted after her lovers[c][b], the Assyrians who were nearby.
  footnotes:
  - marker: a
    text: Or 'under me.' The phrase evokes Oholah's status under the LORD in the marriage metaphor.
    reason: lexical_alternative
  - marker: b
    text: Or 'doted on' or 'was infatuated with.' The Hebrew verb expresses strong lustful desire.
    reason: lexical_alternative
  - marker: c
    text: Or 'the Assyrians, nearby ones' / 'the Assyrians, who were near.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오홀라는 내 아래에 있으면서 음행하였고, 그녀의 애인들, 곧 가까이 있는 앗시리아 사람들에게 욕정을 품었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내게 속해 있으면서’. 이 표현은 오홀라가 여호와 아래에 있던 혼인 비유상의 언약적 지위를 암시합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘탐하였습니다’, ‘열렬히 사모하였습니다’. 히브리어 동사는 강한 음욕적 욕망을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘가까운 앗시리아 사람들’, ‘근처에 있는 앗시리아 사람들’.
    reason: lexical_alternative
