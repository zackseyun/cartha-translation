theological_decisions:
- issue: 예언적 간음/음행 비유의 강도 유지
  chosen_reading: ‘음행하다’와 ‘탐하다’를 유지하여 단순한 정치 동맹 이상의 성적·언약적 배신 비유를 보존했습니다.
  alternative_readings:
  - 불성실하다
  - 외교적으로 의지하다
  - 외국 동맹을 추구하다
  rationale: 에스겔은 충격적인 성적 이미지를 통해 언약 파기를 고발하므로, 그 수위를 완화하지 않는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; preserve metaphorical force.'
