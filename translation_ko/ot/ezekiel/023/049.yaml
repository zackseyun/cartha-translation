  text: וְ/נָתְנ֤וּ זִמַּתְ/כֶ֨נָה֙ עֲלֵי/כֶ֔ן וַ/חֲטָאֵ֥י גִלּוּלֵי/כֶ֖ן תִּשֶּׂ֑אינָה וִ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/049.yaml
  text: They will put your lewdness upon you[a], and you will bear the sins of your idols; then you will know that I am the Lord YHWH.
  footnotes:
  - marker: a
    text: Hebrew גִלּוּלִים is a strongly contemptuous term for idols, sometimes rendered more vividly as 'filthy idols' or 'dung-idols.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 너희의 음란함을 너희에게 돌릴 것이며, 너희는 너희 우상[a] 숭배의 죄를 짊어질 것입니다. 그러면 너희는 내가 주 야훼임을 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִלּוּלִים은 우상을 가리키는 매우 경멸적인 말로, 더 노골적으로는 ‘더러운 우상들’ 또는 ‘똥 우상들’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  english_pob_choice: They will put
  chosen_korean: 둘 것이며
  alternatives_korean:
