  - 너희의 비열한 행실
  lexicon: HALOT
  rationale: 에스겔 23장의 성적·도덕적 타락을 드러내는 זִמָּה의 뉘앙스를 '음란함'으로 옮겼습니다.
- source_word: גִלּוּלֵיכֶן
  english_pob_choice: your idols
  chosen_korean: 너희 우상들
  alternatives_korean:
  - 너희 더러운 우상들
  - 너희 똥 우상들
  - 너희 가증한 우상들
  lexicon: HALOT
  rationale: 본문의 핵심 의미는 우상 자체이므로 본문에는 '우상들'을 두고, 조롱적 뉘앙스는 과도한 직역보다 절제했습니다.
- source_word: תִּשֶּׂאינָה
  english_pob_choice: you will bear
  chosen_korean: 짊어질 것입니다
  alternatives_korean:
  - 질 것입니다
  - 메게 될 것입니다
  - 감당할 것입니다
  lexicon: HALOT
  rationale: 죄책과 책임을 '지다'는 의미를 살리되, 짐을 진다는 형상을 유지하기 위해 '짊어지다'를 선택했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord YHWH
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  - 주 야훼 하나님
  lexicon: HALOT
  rationale: 합쇼체 본문에서 두 칭호를 병렬로 유지하되, המקור의 신명 표현을 투명하게 드러내기 위해 '야훼'를 사용했습니다.
theological_decisions:
- issue: 죄를 '지다'의 משפט적·언약적 의미
  chosen_reading: 너희는 너희 우상들의 죄를 짊어질 것입니다
  alternative_readings:
  - 너희는 너희 우상들의 죄를 겪을 것입니다
  - 너희는 너희 우상들의 벌을 받을 것입니다
  rationale: 본문은 단순한 체험보다 죄책의 부담과 책임 이전을 말하므로, '짊어지다'가 משפט적 의미를 가장 잘 보존합니다.
  doctrine_reference: Ezekiel 23의 심판-책임 어휘
