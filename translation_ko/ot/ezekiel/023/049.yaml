  text: They will put your lewdness upon you[a], and you will bear the sins of your idols; then you will know that I am the Lord YHWH.
  footnotes:
  - marker: a
    text: Hebrew גִלּוּלִים is a strongly contemptuous term for idols, sometimes rendered more vividly as 'filthy idols' or 'dung-idols.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 너희의 음란함을 너희 위에 둘 것이며, 너희는 너희 우상들의 죄를 짊어질 것입니다. 그러면 너희는 내가 주 야훼인 줄 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִלּוּלִים은 우상을 가리키는 매우 경멸적인 말로, 문자적으로는 더 노골적으로 '똥 우상들'처럼 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
