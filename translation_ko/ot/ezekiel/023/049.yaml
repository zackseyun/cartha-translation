  - 가져다 놓을 것이며
  - 가할 것이며
  lexicon: HALOT
  rationale: נתן의 구체적 의미를 살려, 결과가 '위에 놓이는' 이미지를 한국어 동사 '두다'로 자연스럽게 옮겼습니다.
- source_word: זִמַּתְכֶןָה
  english_pob_choice: your lewdness
  chosen_korean: 너희의 음란함
