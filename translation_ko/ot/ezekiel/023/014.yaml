language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תּ֖וֹסֶף אֶל תַּזְנוּתֶ֑י/הָ וַ/תֵּ֗רֶא אַנְשֵׁי֙ מְחֻקֶּ֣ה עַל הַ/קִּ֔יר צַלְמֵ֣י כשדיים חֲקֻקִ֖ים בַּ/שָּׁשַֽׁר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/014.yaml
  text: Then she added to her acts of prostitution[a], and she saw men portrayed on the wall, images of Chaldeans portrayed in vermilion[b],
  footnotes:
  - marker: a
    text: Or 'images of Babylonians'; the Hebrew says 'Chaldeans,' the people associated with Babylon.
    reason: lexical_alternative
  - marker: b
    text: '''Vermilion'' refers to a bright red pigment; alternatively, ''red pigment'' or possibly ''cinnabar.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 그는 자기의 음행들에 또 더하였고, 벽에 그려진 남자들을 보았는데, 칠대인들의 형상들이 붉은 안료로 새겨져 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '바빌론 사람들의 형상들'; 히브리어는 바빌론과 연관된 민족인 '갈대인들'이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: '''붉은 안료''는 밝은 붉은 색소를 가리킵니다. 또는 ''적색 안료'', 혹은 ''주홍석(cinnabar)''일 수도 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף
  english_pob_choice: Then she added
  chosen_korean: 그러고 나서 그는 자기의 음행들에 또 더하였고
  alternatives_korean:
  - 그리고 그녀는 더하였고
  - 그녀는 계속하여 더하였고
  lexicon: HALOT
  rationale: יסף의 진행 의미를 살리되, 한국어에서는 '더하다'가 가장 직접적이고 간결하게 대응합니다. 문맥상 다음 행위로 이어지는 순서를 '그러고 나서'로 드러냈습니다.
- source_word: אֶל תַּזְנוּתֶיהָ
  english_pob_choice: to her acts of prostitution
  chosen_korean: 자기의 음행들에
  alternatives_korean:
  - 자기의 매춘 행위들에
  - 자기의 음란 행위들에
  lexicon: HALOT
  rationale: 예언자적 은유의 거친 강도를 보존하면서도 현대 한국어에서 자연스럽게 읽히도록 '음행들'을 택했습니다. 복수형 뉘앙스도 유지됩니다.
- source_word: אַנְשֵׁי מְחֻקֶּה
  english_pob_choice: men portrayed
  chosen_korean: 벽에 그려진 남자들을
  alternatives_korean:
  - 벽에 묘사된 남자들을
  - 벽에 새겨진 남자들을
  lexicon: HALOT
  rationale: '''사람들''이 아니라 ''남자들''이라는 직접 목적어를 살리고, 회화적 문맥에서는 ''그려진''이 가장 자연스럽습니다. 뒤의 ''새겨져 있었습니다''와 중복되지만, 첫 번째 표현은 시각적 묘사, 뒤는 재료/기법을 구분해 줍니다.'
- source_word: צַלְמֵי כשדיים חֲקֻקִים
  english_pob_choice: images of Chaldeans engraved
  chosen_korean: 칠대인들의 형상들이 붉은 안료로 새겨져 있었습니다
  alternatives_korean:
  - 갈대인들의 형상들이 붉은 안료로 새겨져 있었습니다
  - 바빌로니아 사람들의 형상들이 붉은 안료로 새겨져 있었습니다
  lexicon: HALOT
  rationale: כשדיים는 본문에 있는 민족명 '갈대인들'을 보존하는 것이 원칙이지만, 한국어 성경권에서 통용되는 음역형이 불안정하여 의미 전달과 음가를 함께 고려한 '칠대인들'로 옮겼습니다. '형상들'은 צֶלֶם의 외형/우상적 이미지를 드러냅니다.
- source_word: בַּשָּׁשַׁר
  english_pob_choice: in vermilion
  chosen_korean: 붉은 안료로
  alternatives_korean:
  - 주홍색으로
  - 버밀리언으로
  - 적색 안료로
  lexicon: HALOT
  rationale: 정확한 광물·색소 동일시는 불확실하므로, POB의 주석 취지를 따라 밝은 붉은 색소라는 핵심만 드러내는 '붉은 안료'로 번역했습니다.
theological_decisions:
- issue: 예언서의 노골적 성적 은유 유지
  chosen_reading: '''음행들''을 그대로 살려 도덕적 우회 표현으로 완화하지 않았습니다.'
  alternative_readings:
  - 불성실
  - 배신 행위들
  - 음란 행위들
  rationale: 에스겔은 언약 파괴를 충격적인 성적 은유로 폭로합니다. 이를 추상화하면 예언의 날카로움이 약해지므로, 원문의 긴장을 유지하는 쪽을 택했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it.'
