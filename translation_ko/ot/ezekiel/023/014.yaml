  source_fidelity: 원문의 여성 단수 주어는 반드시 ‘그녀’로 옮겨야 하나, 초안의 ‘그는’은 성별을 반대로 옮긴 중대한 오류입니다. כשדים의 표준 한국어 성경식 명칭은 ‘갈대아 사람들’(또는 ‘갈대아인들’)이며, ‘칠대인들’은 부정확합니다. 두 분사의 묘사·새김의 뉘앙스와 붉은 색소의 불확실성은 수정문에서 유지했습니다.
  naturalness: ‘자기의 음행들에 또 더하였고’는 직역투이고 자연스럽지 않습니다. ‘음행을 더욱 일삼았고’는 반복·증가의 의미를 현대 한국어로 자연스럽게 전달합니다. ‘남자들, 곧 … 형상들’은 원문의 동격적 설명을 보존하면서도 한국어 문장 구조에 맞춥니다.
  terminology: ‘음행’은 에스겔의 의도적인 성적 은유를 완화하지 않고 보존합니다. ‘갈대아 사람들’은 כשדים에 대한 확립된 한국어 성경 용례를 따르며, ‘바빌로니아 사람들’은 주석의 문맥적 대안으로 남깁니다. 각주 a는 갈대아 명칭에, 각주 b는 색소 표현에 직접 붙여 앵커를 바로잡았습니다.
