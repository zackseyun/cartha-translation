  text: Then she added to her acts of prostitution[a], and she saw men portrayed on the wall, images of Chaldeans portrayed in vermilion[b],
  footnotes:
  - marker: a
    text: Or 'images of Babylonians'; the Hebrew says 'Chaldeans,' the people associated with Babylon.
    reason: lexical_alternative
  - marker: b
    text: '''Vermilion'' refers to a bright red pigment; alternatively, ''red pigment'' or possibly ''cinnabar.'''
