translation:
  language: ko
  text: 그녀는 음행을 더욱 일삼았고, 벽에 그려진 남자들, 곧 붉은 안료로 새겨진 갈대아 사람들의 형상들을[a][b] 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바빌로니아 사람들의 형상들’; 히브리어는 바빌론과 연관된 민족인 ‘갈대아 사람들’이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘붉은 안료’는 밝은 붉은 색소를 가리킵니다. 또는 ‘적색 안료’, 혹은 ‘주홍석(cinnabar)’일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף
  english_pob_choice: Then she added
  chosen_korean: 그러고 나서 그는 자기의 음행들에 또 더하였고
  alternatives_korean:
