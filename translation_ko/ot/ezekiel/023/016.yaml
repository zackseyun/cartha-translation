  edition: WLC
  text: ו/תעגב עֲלֵי/הֶ֖ם לְ/מַרְאֵ֣ה עֵינֶ֑י/הָ וַ/תִּשְׁלַ֧ח מַלְאָכִ֛ים אֲלֵי/הֶ֖ם כַּשְׂדִּֽימָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/016.yaml
  text: At the sight of her eyes[b][a], she lusted after them and sent messengers to them in Chaldea.
  footnotes:
  - marker: a
    text: Or 'at the sight of them'; literally, 'to/at the sight of her eyes.'
    reason: lexical_alternative
  - marker: b
    text: Or 'sent messengers to them toward Chaldea' / 'to Chaldea.' The Hebrew form has a directional ending.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 그것들을 보는 순간, 그들을 향해 정욕을 품고 갈대아로 그들에게 사신들을 보냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들을 보는 순간’으로 옮길 수 있습니다. 히브리어는 문자적으로 ‘그녀의 눈의 보기에/눈앞에’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘갈대아를 향해’로 옮길 수 있습니다. 히브리어의 종결형은 방향성을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעְגַּב עֲלֵיהֶם
  english_pob_choice: she lusted after them
  chosen_korean: 그들을 향해 정욕을 품고
  alternatives_korean:
  - 그들을 사모하고
  - 그들을 탐하고
  - 그들을 욕망하고
  lexicon: HALOT
  rationale: עגב는 이 문맥에서 단순한 호감이 아니라 성적 욕망이 섞인 강한 열망을 나타내므로, 한국어에서도 완곡한 표현보다 ‘정욕을 품고’가 원문의 긴장을 더 잘 드러냅니다.
- source_word: לְמַרְאֵה עֵינֶיהָ
  english_pob_choice: At the sight of her eyes
  chosen_korean: 그녀가 그것들을 보는 순간
  alternatives_korean:
  - 그녀의 눈에 보이는 대로
  - 그녀의 눈의 보기에
  - 그녀의 눈으로 본 대로
  lexicon: HALOT
  rationale: 히브리어는 직역하면 다소 비문이지만, 원문의 ‘보는 것’과 ‘욕망함’의 연결을 살려 자연스러운 한국어로 옮기면 ‘그녀가 그것들을 보는 순간’이 가장 가깝습니다.
- source_word: וַתִּשְׁלַח מַלְאָכִים אֲלֵיהֶם
  english_pob_choice: and sent messengers to them
  chosen_korean: 그들에게 사신들을 보냈습니다
  alternatives_korean:
  - 그들에게 전달자들을 보냈습니다
  - 그들에게 전령들을 보냈습니다
  - 그들에게 사절들을 보냈습니다
  lexicon: HALOT
  rationale: מַלְאָכִים은 기본적으로 ‘사신/전령’이므로, 문맥상 외교적 뉘앙스를 유지하면서도 현대 한국어에서 자연스러운 ‘사신들’을 택했습니다.
- source_word: כַּשְׂדִּימָה
  english_pob_choice: in Chaldea
  chosen_korean: 갈대아로
  alternatives_korean:
  - 갈대아 땅으로
  - 갈대아에
  - 갈대아 쪽으로
  lexicon: HALOT
  rationale: 방향형 어미가 있는 목적지 표현이므로, ‘갈대아로’가 이동 방향을 가장 직접적으로 반영합니다.
theological_decisions:
- issue: 선지자적 음란 비유의 강도 유지
  chosen_reading: ‘정욕을 품고’로 옮겨, 정치적·종교적 불신실성을 묘사하는 노골적 성적 비유를 약화하지 않았습니다.
  alternative_readings:
  - 그들을 사모하고
  - 그들을 좋아하고
  rationale: 에스겔 23장은 충격적인 성적 이미지를 통해 배역(背逆)의 심각성을 드러내므로, 지나치게 순화하면 예언 수사의 힘이 약해집니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
