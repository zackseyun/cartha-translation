    reason: lexical_alternative
  - marker: b
    text: 또는 ‘갈대아를 향해 그들에게 사신들을 보냈습니다’로 옮길 수 있습니다. 히브리어 ‘갈대아’에는 방향을 나타내는 어미가 붙어 있습니다.
    reason: lexical_alternative
