id: EZK.23.18
reference: Ezekiel 23:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תְּגַל֙ תַּזְנוּתֶ֔י/הָ וַ/תְּגַ֖ל אֶת עֶרְוָתָ֑/הּ וַ/תֵּ֤קַע נַפְשִׁ/י֙ מֵֽ/עָלֶ֔י/הָ כַּ/אֲשֶׁ֛ר נָקְעָ֥ה נַפְשִׁ֖/י מֵ/עַ֥ל אֲחוֹתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/018.yaml
  text: She uncovered her prostitutions and uncovered her nakedness[a]; then my soul was repulsed by her[c][b], just as my soul had been repulsed by her sister.
  footnotes:
  - marker: a
    text: Or 'revealed her acts of prostitution' for 'uncovered her prostitutions.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my soul was alienated from her'; the Hebrew expresses a strong recoil or revulsion.
    reason: lexical_alternative
  - marker: c
    text: The comparison is to her sister Samaria (Oholah) in the surrounding allegory.
    reason: cross_reference
translation:
  language: ko
  text: 그녀는 자기의 음행들을 드러내고 자기의 벌거벗음을 드러냈습니다[a]. 그러자 내 영혼은 그녀로부터 물러났습니다[c][b]. 이는 내 영혼이 그녀의 누이에게서 물러난 것과 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기의 음행 행위를 드러냈습니다’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 영혼은 그녀에게서 소외되었습니다’로도 옮길 수 있습니다. 히브리어는 강한 반발 또는 혐오를 표현합니다.
    reason: lexical_alternative
  - marker: c
    text: 문맥상 비교 대상은 앞서 언급된 그녀의 누이 사마리아(오홀라)입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַתְּגַל / תַּזְנוּתֶיהָ
  english_pob_choice: uncovered her prostitutions
  chosen_korean: 자기의 음행들을 드러내고
  alternatives_korean:
  - 자기의 창녀짓들을 드러내고
  - 자기의 음행을 드러내고
  - 자기의 간음들을 드러내고
  lexicon: HALOT
  rationale: זְנוּת의 반복적·복수적 뉘앙스를 살리기 위해 복수형 ‘음행들’을 택했고, וַתְּגַל의 구체적 이미지도 ‘드러내다’로 보존했습니다.
- source_word: עֶרְוָתָהּ
  english_pob_choice: her nakedness
  chosen_korean: 자기의 벌거벗음을
  alternatives_korean:
  - 자기의 수치를
  - 자기의 나체를
  - 자기의 알몸을
  lexicon: HALOT
  rationale: עֶרְוָה의 핵심은 성적 노출을 동반한 ‘벌거벗음’이므로, 추상화된 ‘수치’보다 본문 이미지에 더 직접적인 표현을 선택했습니다.
- source_word: וַתֵּקַע נַפְשִׁי מֵעָלֶיהָ
  english_pob_choice: my soul was repulsed by her
  chosen_korean: 내 영혼은 그녀로부터 물러났습니다
  alternatives_korean:
  - 내 영혼은 그녀에게서 repuls음을 느꼈습니다
  - 내 영혼은 그녀에게서 멀어졌습니다
  - 내 영혼은 그녀를 혐오했습니다
  lexicon: HALOT
  rationale: נָקַע는 강한 내적 거부와 분리를 가리키므로, ‘물러났습니다’로 반발과 거리두기를 함께 살렸습니다. ‘혐오했습니다’는 감정 과잉이어서 피했습니다.
- source_word: כַּאֲשֶׁר נָקְעָה נַפְשִׁי מֵעַל אֲחוֹתָהּ
  english_pob_choice: just as my soul had been repulsed by her sister
  chosen_korean: 이는 내 영혼이 그녀의 누이에게서 물러난 것과 같았습니다
  alternatives_korean:
  - 그녀의 누이에게서 내 영혼이 물러났던 것과 같았습니다
  - 이는 내 영혼이 그녀의 누이에게서 거부당한 것과 같았습니다
  lexicon: HALOT
  rationale: 비교절의 완료된 과거 관계를 한국어에서는 ‘-한 것과 같았습니다’로 자연스럽게 옮겼고, ‘누이’는 자매 비유를 직접 살립니다.
theological_decisions:
- issue: 노골적 성적 은유의 유지
  chosen_reading: ‘음행들’과 ‘벌거벗음’을 본문에 그대로 유지했습니다
  alternative_readings:
  - ‘불신앙’이나 ‘수치’로 완화
  - 성적 이미지를 삭제하고 추상화
  rationale: 에스겔은 우상숭배와 배신을 드러내기 위해 의도적으로 강한 성적 은유를 사용하므로, 이를 완화하면 예언적 수사가 약화됩니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 하나님의 감정 표현을 완화하지 않음
  chosen_reading: ‘내 영혼은 … 물러났습니다’로 강한 거부 반응을 보존했습니다
  alternative_readings:
  - ‘나는 그녀에게서 돌아섰습니다’
  - ‘나는 그녀와 멀어졌습니다’
  rationale: 히브리어의 인격적·신체적 반응을 희석하지 않고, 본문이 말하는 강한 거부와 긴장을 그대로 드러내기 위해서입니다.
  doctrine_reference: Translation philosophy §3
