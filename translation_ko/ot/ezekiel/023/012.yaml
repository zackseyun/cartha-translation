theological_decisions:
- issue: 에스겔 23장의 성적 비유를 한국어에서 얼마나 직접적으로 드러낼지
  chosen_reading: ‘갈망했습니다’와 ‘매력적인 젊은이들’을 사용해, 본문의 노골적인 욕망 이미지를 약화시키지 않고 그대로 드러냈습니다.
  alternative_readings:
