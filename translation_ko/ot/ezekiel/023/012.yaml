  source_fidelity: 개정이 필요합니다. 초안 본문은 히브리어 קְרֹבִים를 번역하지 않은 채 각주로만 처리하여, 원문의 한 요소가 본문에서 누락되었습니다. 이 말은 뜻이 불확실하므로 특정하게 ‘전사’로 확정하지 않고 본문에는 직역적 표현을 두며 각주에서 가능한 의미를 밝혀야 합니다. 또한 מִכְלוֹל은 단순히 ‘온갖 좋은 옷’이라기보다 화려하고 잘 갖추어진 차림을 가리킵니다.
  naturalness: ‘앗수르의 아들들’은 히브리어 표현을 보존하지만 현대 한국어에서는 다소 낯설 수 있습니다. 그러나 문맥상 남성 집단을 가리키는 표현임을 유지할 수 있으며, 쉼표와 ‘곧’을 사용해 뒤의 직함 및 묘사가 이들을 수식함을 분명히 했습니다. ‘모두 매력적인 젊은이들이었습니다’는 종결 요약을 자연스럽게 재현합니다.
  terminology: ‘총독들과 관리들’은 פַּחוֹת וּסְגָנִים의 행정 직함 병렬을 무리 없이 반영합니다. עָגָבָה의 성적 욕망의 비유적 강도는 ‘욕망했습니다’로 유지했습니다. קְרֹבִים는 불확실성을 보존하여 ‘가까이 있는 자들’로 옮기고, 각주에 측근·수행원이라는 가능성을 제시했습니다.
