  text: אֶל בְּנֵי֩ אַשּׁ֨וּר עָגָ֜בָה פַּח֨וֹת וּ/סְגָנִ֤ים קְרֹבִים֙ לְבֻשֵׁ֣י מִכְל֔וֹל פָּרָשִׁ֖ים רֹכְבֵ֣י סוּסִ֑ים בַּח֥וּרֵי חֶ֖מֶד כֻּלָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/012.yaml
  text: She lusted after the sons of Assyria—governors and officials[a], clothed in full attire, horsemen riding horses, all of them desirable young men.
  footnotes:
  - marker: a
    text: Or 'men at hand' / 'those nearby' for 'warriors' (קְרֹבִים); the Hebrew term is difficult here, and may refer more broadly to attendants or men in close service rather than explicitly to fighters.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 앗수르의 아들들—총독들과 관리들[a], 온갖 좋은 옷을 입은 자들, 말을 타고 다니는 기병들, 모두 매력적인 젊은이들—을 갈망했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가까이 있는 사람들’ / ‘곁에 있는 자들’로 볼 수 있습니다. 히브리어 קְרֹבִים은 이곳에서 의미가 कठिन하여, 전사라기보다 시종이나 가까운 수행원을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָגָבָה
  english_pob_choice: lusted after
  chosen_korean: 갈망했습니다
  alternatives_korean:
  - 정욕하였습니다
  - 욕정했습니다
  - 사모했습니다
  lexicon: HALOT
  rationale: 문맥상 성적·에로틱한 강한 욕망을 나타내므로, 약한 ‘사모했습니다’보다 강도를 살리되 현대 한국어에서 지나치게 노골적이지 않은 ‘갈망했습니다’를 택했습니다.
- source_word: בְּנֵי אַשּׁוּר
  english_pob_choice: the sons of Assyria
  chosen_korean: 앗수르의 아들들
  alternatives_korean:
  - 앗수르 사람들
  - 앗수르인들
  - 앗수르의 남자들
  lexicon: HALOT
  rationale: 직역에 가까운 표현을 유지해 히브리어의 관용적 구성을 드러냈습니다. 다만 한국어에서 자연스럽게 읽히도록 ‘앗수르의 아들들’로 옮겼습니다.
- source_word: פַּחוֹת וּסְגָנִים
  english_pob_choice: governors and officials
  chosen_korean: 총독들과 관리들
  alternatives_korean:
  - 지사들과 관리들
  - 관할자들과 집정관들
  - 총독들과 공직자들
  lexicon: HALOT
  rationale: 두 행정 직함의 병렬을 한국어에서 알아보기 쉽게 살리기 위해 ‘총독들과 관리들’을 선택했습니다. 과도하게 역사특정적인 용어는 피했습니다.
- source_word: לְבֻשֵׁי מִכְלֹל
  english_pob_choice: clothed in full attire
  chosen_korean: 온갖 좋은 옷을 입은 자들
  alternatives_korean:
  - 화려한 옷차림의 사람들
  - 온전한 예복을 입은 자들
  - 아름답게 차려입은 자들
  lexicon: HALOT
  rationale: ‘완전한/풍성한 차림’의 의미를 한국어로 자연스럽게 풀어, 외형적 호화로움과 눈에 띄는 장식을 함께 전달했습니다.
- source_word: בַּחוּרֵי חֶמֶד
  english_pob_choice: desirable young men
  chosen_korean: 매력적인 젊은이들
  alternatives_korean:
  - 아름다운 젊은이들
  - 선택된 젊은이들
  - 아름다운 청년들
  lexicon: HALOT
  rationale: 이 표현의 평가적·유혹적 뉘앙스를 반영하되, 원문의 성적 대상화가 한국어에서 너무 완곡해지지 않도록 ‘매력적인 젊은이들’로 옮겼습니다.
theological_decisions:
- issue: 에스겔 23장의 성적 비유를 한국어에서 얼마나 직접적으로 드러낼지
  chosen_reading: ‘갈망했습니다’와 ‘매력적인 젊은이들’을 사용해, 본문의 노골적인 욕망 이미지를 약화시키지 않고 그대로 드러냈습니다.
  alternative_readings:
  - ‘사모했습니다’처럼 완곡하게 옮김
  - ‘좋아했습니다’처럼 중립화함
  rationale: 이 절은 단순한 정치적 동맹 묘사가 아니라 성적으로 비유된 탐닉을 지적하는 문맥이므로, 독자가 본문의 도덕적 충격을 읽을 수 있도록 강한 표현을 유지했습니다.
  doctrine_reference: 에스겔 23장 전체의 심판 예언 문맥
