source:
  edition: WLC
  text: אֶל בְּנֵי֩ אַשּׁ֨וּר עָגָ֜בָה פַּח֨וֹת וּ/סְגָנִ֤ים קְרֹבִים֙ לְבֻשֵׁ֣י מִכְל֔וֹל פָּרָשִׁ֖ים רֹכְבֵ֣י סוּסִ֑ים בַּח֥וּרֵי חֶ֖מֶד כֻּלָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/012.yaml
  text: She lusted after the sons of Assyria—governors and officials[a], clothed in full attire, horsemen riding horses, all of them desirable young men.
  footnotes:
  - marker: a
    text: Or 'men at hand' / 'those nearby' for 'warriors' (קְרֹבִים); the Hebrew term is difficult here, and may refer more broadly to attendants or men in close service rather than explicitly to fighters.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 앗수르의 아들들, 곧 총독들과 관리들, 가까이 있는 자들[a], 화려하게 차려입은 자들, 말을 탄 기병들을 욕망했습니다. 그들은 모두 매력적인 젊은이들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘측근들’ 또는 ‘곁에서 섬기는 자들’로 옮길 수 있습니다. 히브리어 קְרֹבִים의 정확한 뜻은 이 문맥에서 불확실하며, 전사들을 특별히 가리킨다고 단정할 수는 없습니다.
    reason: lexical_alternative
