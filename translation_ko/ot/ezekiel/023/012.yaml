  rationale: 이 절은 단순한 정치적 동맹 묘사가 아니라 성적으로 비유된 탐닉을 지적하는 문맥이므로, 독자가 본문의 도덕적 충격을 읽을 수 있도록 강한 표현을 유지했습니다.
  doctrine_reference: 에스겔 23장 전체의 심판 예언 문맥
