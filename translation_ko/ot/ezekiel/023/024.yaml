  source_fidelity: 개정이 필요합니다. 초안의 ‘무리가’는 히브리어 및 영어 POB의 ‘troops’에 비해 군사적 성격이 약하고, 뒤의 ‘그들은’과도 문장상 매끄럽게 연결되지 않습니다. 또한 עַמִּים는 복수이므로 ‘백성의 모임’보다 ‘여러 민족의 집단’이 더 충실합니다. 나머지 병거, 수레, 두 종류의 방패, 투구, 그리고 그들의 판결에 따른 심판이라는 기본 의미는 유지됩니다.
  naturalness: 개정문은 병력·병거·수레 및 여러 민족의 집단이 침공해 온다는 구조를 현대 표준 한국어로 자연스럽게 연결합니다. ‘심판을 그들 앞에 두겠습니다’는 다소 직역적인 법정 비유를 보존하면서도 문법적으로 자연스럽습니다.
  terminology: ‘병력’은 הֹצֶן의 정확한 어원·의미가 논의되는 상황에서도 영어 POB의 ‘troops’와 전쟁 문맥을 적절히 반영합니다. צִנָּה와 מָגֵן은 ‘방패와 작은 방패’로 구별하고, קוֹבַע은 ‘투구’로 옮깁니다. מִשְׁפָּט/מִשְׁפְּטֵיהֶם의 법정적 반복은 ‘심판’과 ‘판결’로 유지합니다.
