  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָ֣אוּ עָלַ֡יִ/ךְ הֹ֠צֶן רֶ֤כֶב וְ/גַלְגַּל֙ וּ/בִ/קְהַ֣ל עַמִּ֔ים צִנָּ֤ה וּ/מָגֵן֙ וְ/קוֹבַ֔ע יָשִׂ֥ימוּ עָלַ֖יִ/ךְ סָבִ֑יב וְ/נָתַתִּ֤י לִ/פְנֵי/הֶם֙ מִשְׁפָּ֔ט וּ/שְׁפָט֖וּ/ךְ בְּ/מִשְׁפְּטֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/024.yaml
  text: They will come against you with troops, chariots, and wagons, and with an assembly of peoples. They will set shield and buckler and helmet against you on every side, and I will set judgment before them, and they will judge you by their judgments.
translation:
  language: ko
  text: 무리가 병거와 수레와 백성의 모임과 함께 너를 치러 올 것이며, 그들은 방패와 작은 방패와 투구를 너를 둘러 사방에 두고, 내가 그들 앞에 심판을 두며, 그들이 너를 그들의 판결대로 판결할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָבָא / הֹצֶן
  english_pob_choice: troops
  chosen_korean: 무리
  alternatives_korean:
  - 부대
  - 군대
  - 병력
  lexicon: OT Hebrew lexical context
  rationale: 문맥상 공격해 오는 집단을 가리키며, 영어 POB의 troops를 한국어에서 과도하게 군사 용어로 좁히지 않으면서도 집단성은 살릴 수 있는 말로 옮겼습니다.
- source_word: רֶכֶב וְגַלְגַּל
  english_pob_choice: chariots, and wagons
  chosen_korean: 병거와 수레
  alternatives_korean:
  - 전차와 수레
  - 병거와 마차
  lexicon: OT Hebrew lexical context
  rationale: רֶכֶב은 전통적으로 병거로, גַלְגַּל은 바퀴/수레의 이미지가 있어 영어 POB의 wagons를 반영해 수레로 옮겼습니다.
- source_word: בִקְהַל עַמִּים
  english_pob_choice: an assembly of peoples
  chosen_korean: 백성의 모임
  alternatives_korean:
  - 민족들의 모임
  - 여러 민족의 집회
  lexicon: OT Hebrew lexical context
  rationale: plural peoples의 집합성을 살리되 한국어에서 자연스러운 표현으로 정리했습니다. '백성'은 민족/인민의 넓은 집단을 포괄합니다.
- source_word: צִנָּה וּמָגֵן וְקוֹבַע
  english_pob_choice: shield and buckler and helmet
  chosen_korean: 방패와 작은 방패와 투구
  alternatives_korean:
  - 방패와 손방패와 투구
  - 방패와 원형 방패와 투구
  lexicon: OT Hebrew lexical context
  rationale: צִנָּה와 מָגֵן을 둘 다 방패로 뭉개지 않고, 영어의 buckler를 살려 작은 방패로 구분했습니다.
- source_word: מִשְׁפָּט / מִשְׁפְּטֵי
  english_pob_choice: judgment / judgments
  chosen_korean: 심판 / 판결
  alternatives_korean:
  - 재판 / 판결들
  - 심판 / 판결들
  lexicon: OT Hebrew legal-theological context
  rationale: 첫 번째는 하나님이 두시는 법정적 판단으로서 심판이 자연스럽고, 두 번째는 그들이 행하는 판정행위를 드러내기 위해 판결로 옮겼습니다.
theological_decisions:
- issue: 하나님이 '그들 앞에 심판을 둔다'는 표현의 의미
  chosen_reading: 하나님이 침략자들의 행위를 단순 허용하는 것이 아니라, 그들의 공격을 심판 집행의 장으로 설정하십니다.
  alternative_readings:
  - 하나님이 단지 결과를 예견하신다
  - 하나님이 중립적으로 재판 절차만 시작하신다
  rationale: 본문의 수동적 허용보다 주권적 심판의 구도를 분명히 드러내는 것이 히브리어 동사와 문맥에 더 가깝습니다.
  doctrine_reference: divine sovereignty and judgment
