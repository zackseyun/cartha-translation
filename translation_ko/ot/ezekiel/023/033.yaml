  source_fidelity: 히브리어는 ‘취함과 비통함으로 가득 차게 될 것’과 이어지는 ‘경악과 황폐의 잔, 네 자매 사마리아의 잔’을 같은 술어에 결속합니다. 초안은 핵심 어휘와 사마리아의 비유적 자매 관계를 대체로 충실히 옮겼습니다. 다만 둘째 문장의 ‘잔이 될 것입니다’는 원문에 없는 ‘네가 잔이 된다’는 뜻이 되어 비유의 대상과 문법 관계를 바꿉니다.
  naturalness: ‘공포와 황폐의 잔, 곧 당신의 자매 사마리아의 잔이 될 것입니다’는 한국어 문장 구조상 ‘당신’이 그 잔이 된다는 뜻으로 읽히며 자연스럽지 않습니다. ‘…잔으로 가득 차게 될 것입니다’로 앞의 술어에 연결하면 현대 한국어 합쇼체로 자연스럽고 의미도 명료합니다.
  terminology: ‘취함’, ‘비통함’, ‘황폐’, ‘잔’, ‘사마리아’는 문맥과 표준 성서 용례에 무리가 없습니다. שַׁמָּה는 단순한 공포보다는 경악/참혹한 충격의 뜻도 강하지만, 영어 POB의 ‘horror’ 및 문맥상 ‘공포’는 허용 가능한 번역입니다. ‘자매’는 원문의 성별·친족 비유를 보존합니다.
