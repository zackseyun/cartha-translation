id: EZK.23.33
reference: Ezekiel 23:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁכָּר֥וֹן וְ/יָג֖וֹן תִּמָּלֵ֑אִי כּ֚וֹס שַׁמָּ֣ה וּ/שְׁמָמָ֔ה כּ֖וֹס אֲחוֹתֵ֥/ךְ שֹׁמְרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/033.yaml
  text: You will be filled with drunkenness and grief, with a cup of horror and desolation, the cup of your sister Samaria.
translation:
  language: ko
  text: 당신은 취함과 비통함, 곧 공포와 황폐의 잔, 당신의 자매 사마리아의 잔으로 가득 차게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁכָּר֥וֹן
  english_pob_choice: drunkenness
  chosen_korean: 취함
  alternatives_korean:
  - 술취함
  - 취기
  lexicon: LXX/OT semantic range of intoxication
  rationale: 문맥상 실제 음주보다 심판으로 인한 비틀림과 혼미를 가리키므로, 현대 한국어에서 자연스럽고 과장되지 않은 ‘취함’으로 옮겼습니다.
- source_word: וְיָג֖וֹן
  english_pob_choice: grief
  chosen_korean: 비통함
  alternatives_korean:
  - 슬픔
  - 근심
  - 애통
  lexicon: יָגוֹן
  rationale: 영문 POB의 ‘grief’를 따라 단순 감정보다 더 깊은 상실·비탄의 상태를 드러내는 ‘비통함’을 선택했습니다.
- source_word: כּ֚וֹס שַׁמָּ֣ה וּשְׁמָמָ֔ה
  english_pob_choice: a cup of horror and desolation
  chosen_korean: 공포와 황폐의 잔
  alternatives_korean:
  - 두려움과 황폐의 잔
  - 놀람과 황폐의 잔
  - 경악과 황폐의 잔
  lexicon: כּוֹס + שַׁמָּה/שְׁמָמָה
  rationale: ‘잔’의 비유를 살리되, שַׁמָּה/שְׁמָמָה의 파괴적 충격을 한국어에서 가장 직접적으로 전달하는 ‘공포와 황폐’로 옮겼습니다.
- source_word: אֲחוֹתֵךְ שֹׁמְרוֹן
  english_pob_choice: your sister Samaria
  chosen_korean: 당신의 자매 사마리아
  alternatives_korean:
  - 당신의 언니 사마리아
  - 당신의 누이 사마리아
  lexicon: אֲחוֹתֵךְ + שֹׁמְרוֹן
  rationale: 비유적 친족 호칭을 유지하기 위해 ‘자매’를 썼고, 지명은 통용되는 성서 표기 ‘사마리아’를 유지했습니다.
theological_decisions:
- issue: 심판 비유로서의 ‘잔’ 이미지
  chosen_reading: ‘공포와 황폐의 잔’은 단순한 감정 묘사가 아니라, 하나님께서 내리시는 심판의 몫을 상징하는 비유로 읽었습니다.
  alternative_readings:
  - 감정 상태를 나열하는 표현으로만 읽는 해석
  - 정확한 상징성을 약화시켜 일반적 비유로 처리하는 해석
  rationale: 예언문맥에서 ‘잔’은 수동적으로 받는 심판을 가리키는 핵심 상징이므로, 그 상징성을 드러내는 번역이 본문의 의도를 더 잘 전달합니다.
  doctrine_reference: 예언서의 심판 상징 이해
- issue: ‘취함’의 윤리적·비유적 중의성
  chosen_reading: ‘취함’은 단순한 도덕적 타락만이 아니라 심판으로 인한 혼미와 무력화를 함께 드러내도록 유지했습니다.
  alternative_readings:
  - 알코올 중독의 직접 묘사로 축소하는 해석
  - 비유성을 약화시키고 정서적 비통만 강조하는 해석
  rationale: 히브리어 어휘가 실제 술취함과 심판의 혼미를 함께 암시할 수 있으므로, 그 긴장을 보존하는 것이 더 स्रोत충실합니다.
  doctrine_reference: 예언적 경고의 상징 언어
