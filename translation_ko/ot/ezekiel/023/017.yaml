translation:
  language: ko
  text: 그때 바빌론 사람들이[a] 그녀에게 와서 사랑의 침상[b]에 들었고, 그들의 음행으로 그녀를 더럽혔습니다. 그녀는 그들 때문에 더럽혀졌으며, 그녀의 마음은 그들에게서 멀어졌습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘바빌론의 아들들’입니다. ‘바빌론 사람들’ 또는 ‘바빌론인들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사랑을 나누는 침상’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그녀는 그들을 혐오하게 되었습니다’ 또는 ‘그녀의 영혼은 그들에게서 소외되었습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בָבֶל
  english_pob_choice: the sons of Babylon
  chosen_korean: 바벨의 아들들
  alternatives_korean:
  - 바벨 사람들
  - 바벨인들
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살리면서도 한국어로 자연스럽게 읽히도록 했습니다. ‘바벨 사람들’은 더 매끈하지만 원문의 친족/귀속 표현이 약해집니다.
- source_word: לְמִשְׁכַּב דֹּדִים
  english_pob_choice: the bed of love
  chosen_korean: 사랑의 침상
  alternatives_korean:
  - 사랑의 자리에
  - 연애의 침상
  - 사랑을 나누는 침상
  lexicon: HALOT
  rationale: מִשְׁכָּב의 ‘침상/누움’과 דֹּדִים의 성적 함의를 함께 보존하기 위해 직역적이면서도 한국어로 읽을 수 있는 ‘사랑의 침상’을 택했습니다.
- source_word: בְּתַזְנוּתָם
  english_pob_choice: with their prostitution
  chosen_korean: 그들의 음행으로
  alternatives_korean:
  - 그들의 매춘으로
  - 그들의 음란함으로
  - 그들의 음행과 함께
  lexicon: HALOT
  rationale: זְנוּת의 도덕적·성적 타락 의미를 한국어 성경어법의 ‘음행’으로 옮겼습니다. ‘매춘’은 지나치게 직업적 의미가 강하고, ‘음란함’은 추상적입니다.
- source_word: וַתֵּקַע נַפְשָׁהּ מֵהֶם
  english_pob_choice: her soul was alienated from them
  chosen_korean: 그녀의 영혼은 그들에게서 멀어졌습니다
  alternatives_korean:
  - 그녀는 그들을 혐오하게 되었습니다
  - 그녀의 영혼은 그들에게서 소외되었습니다
  - 그녀는 그들에게 싫증이 났습니다
  lexicon: HALOT
  rationale: 동사의 결과를 단순 감정보다 거리감/이탈의 이미지로 살리기 위해 ‘멀어졌습니다’로 옮겼습니다. 영어 POB의 대안인 alienated/loathed의 긴장을 지나치게 평탄화하지 않도록 했습니다.
theological_decisions:
- issue: 예언적 성적 은유의 보존
  chosen_reading: ‘사랑의 침상’, ‘음행’, ‘더럽혔다’ 같은 표현을 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 정치적 동맹 언어로만 풀어 쓰기
  - 완곡하게 ‘관계를 맺다’ 정도로 낮추기
  rationale: 본문은 ירושלים/오홀리바의 언약적 배반을 성적 은유로 고발하므로, 그 수사를 약화하면 예언의 충격과 의미가 줄어듭니다.
  doctrine_reference: Source-text primacy; no paraphrase beyond what the source warrants.
