- from: 그때 바벨의 아들들이 그녀에게, 곧 사랑의 침상으로 들어와 그들의 음행으로 그녀를 더럽혔고, 그녀도 그들로 말미암아 더럽혀졌으며, 그녀의 영혼은 그들에게서 멀어졌습니다.[a][b][c]
  to: 그때 바빌론 사람들이[a] 그녀에게 와서 사랑의 침상[b]에 들었고, 그들의 음행으로 그녀를 더럽혔습니다. 그녀는 그들 때문에 더럽혀졌으며, 그녀의 마음은 그들에게서 멀어졌습니다.[c]
