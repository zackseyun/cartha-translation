id: EZK.23.31
reference: Ezekiel 23:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/דֶ֥רֶךְ אֲחוֹתֵ֖/ךְ הָלָ֑כְתְּ וְ/נָתַתִּ֥י כוֹסָ֖/הּ בְּ/יָדֵֽ/ךְ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/031.yaml
  text: You have walked in the way of your sister[a], so I will put her cup into your hand.
  footnotes:
  - marker: a
    text: That is, the cup allotted to your sister as a figure of judgment.
    reason: cultural_note
translation:
  language: ko
  text: 너는 네 자매가 걸어간 길을 걸었으므로, 내가 네 자매의 잔을 네 손에 두겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘잔’은 네 자매에게 정해진 심판을 비유적으로 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּ/דֶרֶךְ
  english_pob_choice: in the way
  chosen_korean: 길로
  alternatives_korean:
  - 길에서
  - 행실에서
  - 삶의 길로
  lexicon: HALOT
  rationale: דֶּרֶךְ는 여기서 문자적 도로보다 행실의 방식이라는 비유를 가리키므로, POB의 'in the way'에 맞춰 자연스러운 한국어로 '길로'를 택했습니다.
- source_word: אֲחוֹתֵךְ
  english_pob_choice: your sister
  chosen_korean: 네 언니
  alternatives_korean:
  - 네 누이
  - 네 자매
  lexicon: HALOT
  rationale: 기본 의미는 친족 호칭이지만, 문맥상 예루살렘과 사마리아의 대조를 떠올리게 하는 여성형 친족 비유이므로 한국어에서는 자연스러운 여성 친족 표현인 '언니'로 옮겼습니다.
- source_word: וְנָתַתִּי
  english_pob_choice: so I will put
  chosen_korean: 내가 ... 두겠습니다
  alternatives_korean:
  - 내가 ... 주겠습니다
  - 내가 ... 넣겠습니다
  lexicon: HALOT
  rationale: נתן은 '주다' 외에 '놓다/두다'의 뜻도 있어, '잔을 손에 두다'가 한국어에서도 가장 직접적이고 자연스럽습니다. 영어 POB의 'put'을 반영했습니다.
- source_word: כוֹסָהּ
  english_pob_choice: her cup
  chosen_korean: 그 잔
  alternatives_korean:
  - 그녀의 잔
  - 그 여인의 잔
  - 심판의 잔
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '그녀의 잔'이지만, 한국어에서는 소유격을 풀어내기보다 문맥상 지시되는 잔을 살려 '그 잔'으로 옮겨 비유를 보존했습니다.
theological_decisions:
- issue: 심판의 잔 비유를 본문 안에서 얼마나 풀어 쓸지
  chosen_reading: 본문은 '그 잔'을 유지하고, 심판이라는 해석은 본문 밖 주석으로 남깁니다.
  alternative_readings:
  - 심판의 잔
  - 징벌의 잔
  rationale: 영어 POB도 주석으로만 의미를 밝히고 본문에서는 은유를 유지합니다. 히브리어가 말하는 것은 '그 잔'이지 '심판의 잔'이라는 해설문이 아니므로, 비유를 보존하는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; do not paraphrase beyond what the source text warrants.'
