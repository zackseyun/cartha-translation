id: EZK.23.37
reference: Ezekiel 23:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י נִאֵ֗פוּ וְ/דָם֙ בִּֽ/ידֵי/הֶ֔ן וְ/אֶת גִּלּֽוּלֵי/הֶ֖ן נִאֵ֑פוּ וְ/גַ֤ם אֶת בְּנֵי/הֶן֙ אֲשֶׁ֣ר יָֽלְדוּ לִ֔/י הֶעֱבִ֥ירוּ לָ/הֶ֖ם לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/037.yaml
  text: For they have committed adultery[a], and blood is on their hands; they have committed adultery with their idols, and they even made their sons, whom they bore to me[b], pass through the fire to them as food.
  footnotes:
  - marker: a
    text: Hebrew literally, 'made pass through'; in this context the idiom refers to child sacrifice, traditionally understood as passing through the fire.
    reason: cultural_note
  - marker: b
    text: Or 'for food.' The phrase depicts the children as consumed in sacrificial offering to the idols.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 음행하였고, 그들의 손에는 피가 있습니다. 그들은 자기들의 우상들과 음행하였고, 심지어 내가 낳게 한 자기들의 아들들을 그 우상들에게 불로 지나가게 하여 먹이로 삼았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘지나가게 하다’입니다. 이 문맥에서는 통상 자녀 희생, 곧 불로 지나가게 하는 행위를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 곧 ‘먹이로’. 이 표현은 자녀들이 우상 제의에서 희생 제물처럼 소비되는 모습을 그립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִאֵפוּ
  english_pob_choice: have committed adultery
  chosen_korean: 음행하였고
  alternatives_korean:
  - 간음하였고
  - 불륜을 저질렀고
  lexicon: HALOT
  rationale: 예언서의 언약적 배신을 드러내기 위해 문자적 ‘간음’보다 더 넓은 ‘음행’이 본문의 심판적·비유적 뉘앙스를 함께 살립니다.
- source_word: דָם בִּידֵיהֶן
  english_pob_choice: blood is on their hands
  chosen_korean: 그들의 손에는 피가 있습니다
  alternatives_korean:
  - 그들의 손에 피가 묻어 있습니다
  - 피의 책임이 그들의 손에 있습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 살인 책임/피값의 의미를 자연스러운 현대 한국어로 옮기기 위해 직역에 가깝게 유지했습니다.
- source_word: גִּלּוּלֵיהֶן
  english_pob_choice: their idols
  chosen_korean: 그들의 우상들
  alternatives_korean:
  - 그들의 더러운 우상들
  - 그들의 똥우상들
  lexicon: HALOT
  rationale: ‘우상’이 기본 의미를 분명히 전달하므로 본문에는 표준적인 번역을 쓰되, 히브리어의 경멸적 어감은 과도하게 해설하지 않았습니다.
- source_word: הֶעֱבִירוּ לָהֶם לְאָכְלָה
  english_pob_choice: made ... pass through the fire ... as food
  chosen_korean: 그 우상들에게 불로 지나가게 하여 먹이로 삼았습니다
  alternatives_korean:
  - 그 우상들에게 불로 지나가게 하여 음식으로 삼았습니다
  - 그 우상들에게 불로 지나가게 하였습니다
  lexicon: HALOT
  rationale: ‘불로 지나가게 하다’는 관용구를 살리고, 문맥상 자녀 희생을 드러내기 위해 ‘먹이로 삼다’를 붙여 희생 제의의 섬뜩함을 보존했습니다.
theological_decisions:
- issue: 자녀를 바친 행위를 어떻게 드러낼 것인가
  chosen_reading: ‘불로 지나가게 하여 먹이로 삼았습니다’로 옮겨 자녀 희생의 의미를 본문 안에서 분명히 했습니다.
  alternative_readings:
  - ‘불로 지나가게 하였습니다’
  - ‘불에 지나가게 하여 바쳤습니다’
  rationale: 히브리어는 관용구를 쓰지만 이 문맥은 우상숭배와 피흘림을 함께 고발하므로, 희생 제의의 의미를 한국어 본문에서도 읽히게 하는 것이 타당합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; 관용구의 역사적·신학적 의미를 보존합니다.'
