  naturalness: ‘그들이 나에게 낳아 준 아들들’은 하나님의 소유권·언약적 주장을 자연스러운 현대 한국어로 전달합니다. ‘먹이로 주기 위해 불 가운데로 지나가게 하였습니다’는 한국어 어순상 자연스럽고, 우상에게 자녀를 바친 행위를 분명히 합니다.
