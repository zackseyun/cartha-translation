id: EZK.23.40
reference: Ezekiel 23:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַ֗ף כִּ֤י תִשְׁלַ֨חְנָה֙ לַֽ/אֲנָשִׁ֔ים בָּאִ֖ים מִ/מֶּרְחָ֑ק אֲשֶׁ֨ר מַלְאָ֜ךְ שָׁל֤וּחַ אֲלֵי/הֶם֙ וְ/הִנֵּה בָ֔אוּ לַ/אֲשֶׁ֥ר רָחַ֛צְתְּ כָּחַ֥לְתְּ עֵינַ֖יִ/ךְ וְ/עָ֥דִית עֶֽדִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/040.yaml
  text: And moreover[a], they sent for men coming from far away, to whom a messenger had been sent; and behold, they came—to the one who had washed herself, painted her eyes, and adorned herself with jewelry.
  footnotes:
  - marker: a
    text: Or 'lined her eyes with kohl.' The Hebrew verb refers to applying dark eye cosmetic.
    reason: lexical_alternative
translation:
  language: ko
  text: 더구나 그들은 먼 곳에서 오는 남자들을 불러들였고, 그들에게 전령을 보냈습니다. 보십시오, 그들이 왔습니다. 그들은 몸을 씻고 눈에 콜을 바르고[a] 장신구를 걸친 그 여자에게 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘콜’은 히브리어 동사가 가리키는 검은 눈 화장품으로, 눈가를 검게 칠하는 데 사용했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף כִּי
  english_pob_choice: And moreover
  chosen_korean: 그리고 더욱이
  alternatives_korean:
  - 그리고 더구나
  - 또한 더욱
  lexicon: HALOT
  rationale: 연결사와 강조를 함께 담아 앞선 고발을 한층 더 밀어 올리는 누적적 어조를 살렸습니다.
- source_word: תִשְׁלַחְנָה לַאֲנָשִׁים
  english_pob_choice: they sent for men
  chosen_korean: 남자들에게 사람을 보냈습니다
  alternatives_korean:
  - 남자들을 불렀습니다
  - 남자들에게 보냈습니다
  lexicon: HALOT
  rationale: 히브리어의 목적어 구조를 살리면서도 초청/소환의 뉘앙스를 유지하기 위해 ‘보내다’를 사용했습니다.
- source_word: מַלְאָךְ שָׁלוּחַ
  english_pob_choice: a messenger had been sent
  chosen_korean: 사자가 보내졌는데
  alternatives_korean:
  - 전령이 보내졌는데
  - 사신이 보내졌는데
  lexicon: HALOT
  rationale: מַלְאָךְ의 인간 사자 의미를 살리되, 한국어에서는 ‘사자’가 고풍스럽게 들릴 수 있어 본문 흐름 안에서 간결하게 옮겼습니다.
- source_word: כָּחַלְתְּ עֵינַיִךְ
  english_pob_choice: painted her eyes
  chosen_korean: 눈에 눈화장을 하고
  alternatives_korean:
  - 눈에 먹칠을 하고
  - 눈을 검게 칠하고
  lexicon: HALOT
  rationale: 어근이 가리키는 눈 화장, 곧 콜 사용을 현대 한국어로 자연스럽게 풀어 옮겼습니다. 고유한 화장 행위라는 점은 유지했습니다.
- source_word: וְעָדִית עֶדִי
  english_pob_choice: adorned herself with jewelry
  chosen_korean: 장신구로 몸을 단장한
  alternatives_korean:
  - 보석으로 몸을 꾸민
  - 장식품을 걸치고
  lexicon: HALOT
  rationale: 동사와 목적어의 관용적 결합을 살려 ‘단장하다’로 옮기고, 목적어는 본문 맥락에 맞게 장신구로 구체화했습니다.
theological_decisions:
- issue: 복수 행위자와 단수 여성 수식의 전환
  chosen_reading: 앞부분은 복수 주어로, 뒤의 씻고 화장하고 단장한 행위는 단수 여성으로 옮겼습니다.
  alternative_readings:
  - 전부 복수로 평탄화
  - 전부 단수로 평탄화
  rationale: 히브리어는 두 여자/도시를 함께 말하다가 곧바로 한 여자에게 초점을 좁힙니다. 이 전환을 보존해야 예언적 조롱과 고발의 수사가 살아납니다.
  doctrine_reference: 'Translation philosophy #3, #5'
