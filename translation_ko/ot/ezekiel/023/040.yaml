  source_fidelity: 첫 절의 תִשְׁלַחְנָה לַאֲנָשִׁים는 ‘남자들에게 사람을 보내다’가 아니라 먼 곳의 남자들을 불러들이거나 그들을 위해 사람을 보내는 뜻입니다. 초안은 수신자와 전령의 역할을 뒤바꾸었습니다. 또한 본문의 복수 주어와 뒤따르는 단수 여성의 전환은 유지되어야 합니다.
