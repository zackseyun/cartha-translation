revisions:
- from: 그리고 더욱이 그들은 먼 곳에서 오는 남자들에게 사람을 보냈습니다. 그들에게는 사자가 보내졌는데, 보라, 그들이 왔습니다. 곧 스스로 몸을 씻고, 눈에 눈화장을 하고, 장신구로 몸을 단장한 바로 그 여자에게 왔습니다.[a]
  to: 더구나 그들은 먼 곳에서 오는 남자들을 불러들였고, 그들에게 전령을 보냈습니다. 보십시오, 그들이 왔습니다. 그들은 몸을 씻고 눈에 콜을 바르고[a] 장신구를 걸친 그 여자에게 왔습니다.
  rationale: 초안의 핵심 통사 오류를 바로잡아 먼 곳의 남자들이 초청 대상이고 전령은 그들에게 파견되었음을 명확히 했습니다. ‘그들은’과 ‘그 여자’의 복수·단수 전환을 보존했으며, 콜과 장신구의 단장 묘사를 자연스러운 현대 합쇼체로 옮겼습니다.
