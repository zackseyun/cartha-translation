id: EZK.23.7
reference: Ezekiel 23:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּתֵּ֤ן תַּזְנוּתֶ֨י/הָ֙ עֲלֵי/הֶ֔ם מִבְחַ֥ר בְּנֵֽי אַשּׁ֖וּר כֻּלָּ֑/ם וּ/בְ/כֹ֧ל אֲשֶׁר עָֽגְבָ֛ה בְּ/כָל גִּלּוּלֵי/הֶ֖ם נִטְמָֽאָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/007.yaml
  text: She lavished her prostitutions on them[a], all the choicest sons of Assyria; and with all those for whom she lusted[c][b], with all their idols she defiled herself.
  footnotes:
  - marker: a
    text: Or 'all the choice men of Assyria' or 'all the best of the Assyrians.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses explicit sexual imagery ('prostitutions,' 'lusted') as a prophetic metaphor for political-religious unfaithfulness and idolatry.
    reason: cultural_note
  - marker: c
    text: '''Idols'' translates Ezekiel''s strongly derogatory term for idols.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들의 위에 자기의 음행을 쏟아부었으니[a], 곧 앗수르의 가장 빼어난 아들들 모두와, 그녀가 음욕을 품었던 모든 자들과 함께였으며[b], 그들의 모든 우상으로 말미암아 자신을 더럽혔습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘앗수르의 가장 좋은 남자들 모두’ 혹은 ‘앗수르 사람들 가운데 가장 뛰어난 자들 모두’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 노골적인 성적 이미지를 사용하여, 예언적 은유로서 정치·종교적 불성실과 우상숭배를 드러냅니다.
    reason: cultural_note
  - marker: c
    text: ‘우상’은 에스겔의 강한 경멸적 우상 표현을 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן תַּזְנוּתֶיהָ עֲלֵיהֶם
  english_pob_choice: She lavished her prostitutions on them
  chosen_korean: 그들의 위에 자기의 음행을 쏟아부었으니
  alternatives_korean:
  - 그들에게 자기의 음행을 베풀었으니
  - 그들에게 자기의 음행을 주었으니
  - 그들 위에 자기의 음행을 퍼부었으니
  lexicon: HALOT
  rationale: תַּזְנוּת는 예레미야/에스겔의 예언적 성적 은유를 이루는 표현이므로, 한국어에서는 현대적이면서도 직접적인 ‘음행’으로 살리고, וַתִּתֵּן의 누적·의도성을 ‘쏟아부었으니’로 옮겼습니다.
- source_word: מִבְחַר בְּנֵי אַשּׁוּר כֻּלָּם
  english_pob_choice: all the choicest sons of Assyria
  chosen_korean: 앗수르의 가장 빼어난 아들들 모두
  alternatives_korean:
  - 앗수르의 가장 좋은 아들들 모두
  - 앗수르의 선택된 아들들 모두
  - 앗수르의 모든 귀족들
  lexicon: HALOT
  rationale: מִבְחַר의 ‘선택된/빼어난’ 의미와 בְּנֵי의 남성형을 함께 살리기 위해 ‘아들들’로 두고, 자연스러운 한국어 어순으로 ‘가장 빼어난’이라 옮겼습니다.
- source_word: וּבְכֹל אֲשֶׁר עָגְבָה
  english_pob_choice: and with all those for whom she lusted
  chosen_korean: 그녀가 음욕을 품었던 모든 자들과 함께
  alternatives_korean:
  - 그녀가 정욕을 품었던 모든 자들과 함께
  - 그녀가 탐하던 모든 자들과 함께
  - 그녀가 욕정하던 모든 자들과 함께
  lexicon: HALOT
  rationale: עָגַב의 강한 성적 욕망을 약화하지 않기 위해 ‘음욕을 품다’를 택했고, 관계절은 한국어 문맥에 맞게 ‘모든 자들과 함께’로 정리했습니다.
- source_word: גִּלּוּלֵיהֶם
  english_pob_choice: their idols
  chosen_korean: 그들의 모든 우상
  alternatives_korean:
  - 그들의 모든 우상들
  - 그들의 모든 더러운 우상
  - 그들의 모든 우상숭배 대상
  lexicon: HALOT
  rationale: גִּלּוּלִים는 에스겔의 경멸적 우상 표현이지만, 본문 흐름상 기본 의미인 ‘우상’을 유지하되 ‘모든’으로 범위를 반영했습니다.
- source_word: נִטְמָאָה
  english_pob_choice: she defiled herself
  chosen_korean: 자신을 더럽혔습니다
  alternatives_korean:
  - 스스로 더러워졌습니다
  - 스스로 부정하게 되었습니다
  - 더러워졌습니다
  lexicon: HALOT
  rationale: 니팔형의 결과적·자기관련 의미를 한국어에서 자연스럽게 드러내기 위해 수동보다는 재귀적 뉘앙스의 ‘자신을 더럽혔습니다’를 사용했습니다.
theological_decisions:
- issue: 예언서의 노골적 성적 은유 유지
  chosen_reading: ‘음행’, ‘음욕’ 같은 직접어를 유지해, 본문이 의도한 충격과 언약 불성실의 상징성을 약화하지 않았습니다.
  alternative_readings:
  - ‘불성실’이나 ‘배신’처럼 완화하여 번역
  rationale: 에스겔은 정치·종교적 배교를 성적 은유로 고발하므로, 완화 번역은 예언 수사의 힘을 희석합니다.
  doctrine_reference: 번역 원칙 §1, §3
- issue: ‘아들들’의 성별 표지 보존
  chosen_reading: בְּנֵי를 ‘아들들’로 옮겨 남성 집단임을 유지했습니다.
  alternative_readings:
  - ‘사람들’
  - ‘남자들’
  rationale: 본문은 남성형 친족어를 사용하며, 문맥상 대상 역시 남성 외교·정치 집단으로 이해되므로 성별 표지를 지우지 않았습니다.
  doctrine_reference: 번역 원칙 §4
