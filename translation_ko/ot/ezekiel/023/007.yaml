  source_fidelity: 수정이 필요합니다. 본문의 주어는 여성 단수이므로 첫 낱말 ‘그가’는 ‘그녀는’으로 고쳐야 합니다. 또한 בְּכָל גִּלּוּלֵיהֶם은 ‘그들의 모든 우상으로 말미암아’보다 ‘그들의 모든 우상과 함께’가 전치사 בְּ의 연합적 표현과 원문의 병렬을 더 잘 보존합니다.
  naturalness: ‘그들의 위에’는 한국어로 부자연스럽습니다. ‘그들에게 … 쏟아부었으며’로 옮기면 원문의 능동적이고 과장된 비유를 유지하면서 자연스럽습니다. ‘앗수르의 가장 빼어난 아들들’은 다소 직역적이지만, 원문의 ‘아들들’과 남성 지시를 보존하는 범위에서 허용됩니다.
  terminology: ‘음행’, ‘음욕’, ‘우상’, ‘자신을 더럽혔습니다’는 에스겔의 성적·제의적 비유와 טמא의 자기 관련적 결과를 적절히 전달합니다. 각주는 해당 어구 바로 뒤에 배치되어야 하며, 기존 a와 c의 본문 표지 위치는 내용과 맞지 않았습니다.
