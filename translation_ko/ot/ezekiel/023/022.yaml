  text: לָ/כֵ֣ן אָהֳלִיבָ֗ה כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנְ/נִ֨י מֵעִ֤יר אֶת מְאַהֲבַ֨יִ/ךְ֙ עָלַ֔יִ/ךְ אֵ֛ת אֲשֶׁר נָקְעָ֥ה נַפְשֵׁ֖/ךְ מֵ/הֶ֑ם וַ/הֲבֵאתִ֥י/ם עָלַ֖יִ/ךְ מִ/סָּבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/022.yaml
  text: 'Therefore[a], Oholibah, thus says the Lord GOD: Behold, I am stirring up your lovers against you, those from whom your soul has turned away, and I will bring them against you from every side.'
  footnotes:
  - marker: a
    text: Or 'those whom your soul loathed' / 'those from whom you became alienated.' The Hebrew verb can convey revulsion or estrangement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로, 오홀리바야, 주 야훼께서 이렇게 말씀하십니다. 보십시오, 내가 네 연인들을 — 네 혼이 그들로부터 돌아선 자들을 — 네게 맞서 일으키며, 내가 그들을 사방에서 네게로 끌어오겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 혼이 혐오한 자들’, ‘네가 그들로부터 소원해진 자들’로 옮길 수 있습니다. 히브리어 동사는 혐오와 소원함 둘 다를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 그래서
  lexicon: HALOT
  rationale: 앞선 책망과 심판 선언의 결과를 잇는 표지로, 예언적 논리의 무게를 살리는 ‘그러므로’가 가장 자연스럽습니다.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  english_pob_choice: thus says the Lord GOD
  chosen_korean: 주 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주 하나님께서 이렇게 말씀하십니다
  - 주 여호와께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 아도나이와 여호와의 결합을 한국어에서 구분 없이 합치면 의미 층위가 사라지므로, 본문 표지에 따라 ‘주 야훼’로 옮겼습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold, I am
  chosen_korean: 보십시오, 내가
  alternatives_korean:
  - 보라, 내가
  - 여기 내가
  lexicon: HALOT
  rationale: 하나님의 엄숙한 선언을 드러내는 감탄·지시 용법을 살리되, 현대 한국어에서 자연스러운 예언 문체로 처리했습니다.
- source_word: מֵעִיר
  english_pob_choice: stirring up
  chosen_korean: 일으키며
  alternatives_korean:
  - 부추기며
  - 깨우며
  lexicon: HALOT
  rationale: 문맥상 적대적 행동으로 사람들을 동원하는 뜻이므로, ‘일으키다’가 군사적·심판적 뉘앙스를 가장 잘 담습니다.
- source_word: נָקְעָה נַפְשֵׁךְ מֵהֶם
  english_pob_choice: those from whom your soul has turned away
  chosen_korean: 네 혼이 그들로부터 돌아선 자들
  alternatives_korean:
  - 네가 그들을 혐오한 자들
  - 네가 그들로부터 멀어진 자들
  lexicon: HALOT
  rationale: 히브리어의 주어를 그대로 반영해 ‘네 혼’으로 두고, 혐오와 소원 사이의 긴장을 ‘돌아서다’로 보존했습니다.
- source_word: מִסָּבִיב
  english_pob_choice: from every side
  chosen_korean: 사방에서
  alternatives_korean:
  - 둘레에서
  - 온 사방에서
  lexicon: HALOT
  rationale: 포위·에워쌈의 이미지를 압축적으로 살리는 한국어 표현입니다.
theological_decisions:
- issue: 여호와/야훼 표기와 아도나이 결합 처리
  chosen_reading: ‘주 야훼’로 표기해 두 신명칭의 결합을 드러냈습니다.
  alternative_readings:
  - ‘주 하나님’으로 완화
  - ‘주 여호와’로 관습화
  rationale: 본문은 אֲדֹנָי + יהוה의 중복 호칭을 사용하므로, 관습적 ‘주 하나님’보다 원문 구조를 보존하는 표기가 더 स्रोत-충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
