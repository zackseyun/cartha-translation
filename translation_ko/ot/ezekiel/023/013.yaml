  source_fidelity: ‘더러워졌음’은 가능하지만 טמא의 의례적·도덕적 ‘부정’ 의미를 충분히 특정하지 못합니다. 또한 본문의 마지막 절은 문자적으로 ‘둘에게 한 길’이라는 공통된 행로를 말하며, ‘같은 길을 갔습니다’는 자연스럽지만 약간 해석을 더합니다. ‘같은 길을 걸었습니다’는 비유를 유지하면서 자연스럽게 옮깁니다.
