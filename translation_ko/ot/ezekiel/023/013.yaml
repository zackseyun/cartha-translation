  text: וָ/אֵ֖רֶא כִּ֣י נִטְמָ֑אָה דֶּ֥רֶךְ אֶחָ֖ד לִ/שְׁתֵּי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/013.yaml
  text: And I saw that she had become unclean[b][a]; both of them followed the same way.
  footnotes:
  - marker: a
    text: Or, 'she was defiled.' The Hebrew verb can be read more statively, but the context suggests defilement incurred through her own conduct.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'one way for both of them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그녀가 더러워졌음을 보았습니다. 두 사람은 같은 길을 갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀가 부정해졌습니다.’ 히브리어 동사는 상태적으로도 읽을 수 있지만, 문맥상 스스로의 행위로 인한 더러움의 의미가 두드러집니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘둘을 위한 한 길’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  english_pob_choice: And I saw
  chosen_korean: 나는 … 보았습니다
  alternatives_korean:
  - 그리고 나는 보았습니다
  - 그리고 나는 보게 되었습니다
  lexicon: HALOT
  rationale: 예언자의 목격 진술을 자연스러운 합쇼체로 옮기되, 시제·서술 진행을 해치지 않도록 간결하게 처리했습니다.
- source_word: נִטְמָאָה
  english_pob_choice: she had become unclean
  chosen_korean: 더러워졌음을
  alternatives_korean:
  - 부정해졌음을
  - 부정하게 되었음을
  - 더럽혀졌음을
  lexicon: HALOT
  rationale: נִטְמָאָה는 결과 상태를 나타낼 수 있어 ‘더러워지다’로 옮기되, 도덕적·의례적 오염의 중첩을 유지했습니다.
- source_word: דֶּרֶךְ אֶחָד לִשְׁתֵּיהֶן
  english_pob_choice: both of them followed the same way
  chosen_korean: 두 사람은 같은 길을 갔습니다
  alternatives_korean:
  - 두 사람에게 한 길이 있었습니다
  - 둘 다 같은 길로 갔습니다
  lexicon: HALOT
  rationale: ‘길’은 행실/삶의 방식을 가리키는 비유이므로 직역적이되 한국어에서는 ‘같은 길을 갔습니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 부정(uncleanness)과 도덕적 타락의 중첩
  chosen_reading: 의례적·도덕적 더러움의 이중 의미를 흐리지 않고, 성적인 불충실의 비유를 완화하지 않았습니다.
  alternative_readings:
  - 단순히 ‘부정해졌습니다’로 중성화하기
  - ‘더럽혀졌습니다’로만 도덕적 뉘앙스를 강조하기
  rationale: 이 문맥은 언약 불성실과 성적 은유를 함께 담고 있으므로, 지나치게 순화하지 않으면서도 한국어로 이해 가능한 범위에서 표현했습니다.
  doctrine_reference: Ezekiel 23 문맥의 예언적 비유
