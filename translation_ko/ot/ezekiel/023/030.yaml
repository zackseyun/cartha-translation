  yaml_path: translation/ot/ezekiel/023/030.yaml
  text: These things are done to you because of your prostitution after the nations[a], because you defiled yourself with their idols.
  footnotes:
  - marker: a
    text: Hebrew גִּלּוּלִים is a contemptuous term for idols, sometimes paraphrased 'dung-idols' or 'filthy idols.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 일들이 당신에게 일어나는 것은 당신이 민족들을 따라 음행하였기 때문입니다. 당신이 그들의 우상들로 스스로를 더럽혔기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִּלּוּלִים는 우상을 깎아내리는 경멸적 표현으로, ‘똥우상들’이나 ‘더러운 우상들’처럼 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשֹׂה אֵלֶּה לָךְ
  english_pob_choice: These things are done to you
  chosen_korean: 이런 일들이 당신에게 일어나는 것은
  alternatives_korean:
  - 이런 일들이 당신에게 행해지는 것은
  - 이런 일들은 당신에게 주어지는 것입니다
  lexicon: HALOT
  rationale: 히브리어는 문맥상 이미 언급된 심판 행위들을 가리키므로, 한국어에서는 수동적 사실 진술로 자연스럽게 옮겨 ‘일어나는 것’으로 표현했습니다.
- source_word: בִּזְנוֹתֵךְ אַחֲרֵי גוֹיִם
  english_pob_choice: because of your prostitution after the nations
  chosen_korean: 당신이 민족들을 따라 음행하였기 때문입니다
  alternatives_korean:
  - 당신이 민족들을 따라 창녀처럼 행하였기 때문입니다
  - 당신의 음행으로, 곧 민족들을 따랐기 때문입니다
  lexicon: HALOT
  rationale: זנה의 비유적·성적 이미지를 살리기 위해 ‘음행’으로 옮기되, אַחֲרֵי의 추적/추종 뉘앙스를 ‘따라’로 반영했습니다. ‘민족들’은 문맥상 정치·우상숭배적 주변 민족을 가리키는 직접 번역입니다.
- source_word: נִטְמֵאת
  english_pob_choice: you defiled yourself
  chosen_korean: 스스로를 더럽혔기 때문입니다
  alternatives_korean:
  - 더럽혀졌기 때문입니다
  - 부정하게 되었기 때문입니다
  lexicon: HALOT
  rationale: 니팔형은 결과적 더러움과 책임을 함께 담고 있어, 반사적 의미를 살린 ‘스스로를 더럽혔다’가 문맥상 가장 적절합니다.
- source_word: בְּגִלּוּלֵיהֶם
  english_pob_choice: with their idols
  chosen_korean: 그들의 우상들로
  alternatives_korean:
  - 그들의 우상들과 함께
  - 그들의 우상들로 인해
  lexicon: HALOT
  rationale: ב는 여기서 도구/연관의 뜻을 띠므로 한국어에서는 ‘~로’가 자연스럽습니다. גִּלּוּלִים의 경멸적 뉘앙스는 본문을 지나치게 거칠게 만들지 않기 위해 본문에서는 ‘우상들’로 두었습니다.
theological_decisions:
- issue: 성적 비유를 그대로 보존할지 여부
  chosen_reading: 당신이 민족들을 따라 음행하였기 때문입니다
  alternative_readings:
  - 당신이 민족들을 따라 신실하지 않았기 때문입니다
  - 당신이 민족들을 따르며 우상숭배했기 때문입니다
  rationale: 에스겔은 언약 배반을 성적 비유로 강하게 드러내므로, 이를 도덕적 추상어로 평탄화하지 않고 ‘음행’으로 유지했습니다.
  doctrine_reference: 원문 우선, 비유의 신학적 긴장 보존
