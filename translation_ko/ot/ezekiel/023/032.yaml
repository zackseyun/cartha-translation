base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/032.yaml
  text: 'Thus says the Lord GOD: You will drink your sister’s cup[a], deep and wide; it will be for laughter and for mockery[b], for it holds much.'
  footnotes:
  - marker: a
    text: Or, 'deep and broad.'
    reason: lexical_alternative
  - marker: b
    text: The 'cup' is a prophetic image for an allotted portion of judgment.
    reason: cross_reference
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. 너는 깊고 넓은[a] 네 언니의 잔을 마실 것이다. 그 잔은 웃음거리와 조롱거리가 될 것이다[b]. 많은 것을 담을 수 있기 때문이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘깊고 넓은’.
    reason: lexical_alternative
  - marker: b
    text: ‘잔’은 예언 문맥에서 몫으로 주어진 심판을 가리키는 상징적 이미지입니다.
    reason: cross_reference
lexical_decisions:
- source_word: אֲדֹנָי יְהֹוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: WLC; POB doctrinal glossary
  rationale: אֲדֹנָי와 고유명 יְהוָה의 결합을 살려, титул과 이름을 구별하는 한국어 직역으로 '주 야훼'를 택했습니다. '주 하나님'은 이름 요소가 약해지고, '주 여호와'는 POB 기본 용어와 맞지 않습니다.
- source_word: כּוֹס אֲחוֹתֵךְ
  english_pob_choice: your sister’s cup
  chosen_korean: 네 언니의 잔
  alternatives_korean:
  - 네 자매의 잔
  - 언니의 잔
  lexicon: WLC; HALOT
  rationale: 히브리어 소유격 구성을 그대로 살려 '잔'으로 직역했습니다. 본문은 심판의 몫을 가리키는 예언적 비유이지만, 원문이 사용하는 구체적 이미지를 유지하는 것이 적절합니다.
- source_word: הָעֲמֻקָּה וְהָרְחָבָה
  english_pob_choice: deep and wide
  chosen_korean: 깊고 넓으며
  alternatives_korean:
  - 깊고 넓은
  - 깊고 넓고
  lexicon: HALOT
  rationale: 그릇의 용량을 묘사하는 형용사로, '넓다'가 현대 한국어에서 'broad'보다 자연스럽고 용기 이미지도 잘 전달합니다.
- source_word: לִצְחֹק וּלְלַעַג
  english_pob_choice: for laughter and for mockery
  chosen_korean: 웃음거리와 조롱거리
  alternatives_korean:
  - 웃음과 조롱
  - 비웃음과 조롱
  lexicon: HALOT
  rationale: 히브리어의 목적격/결과적 관용을 한국어에서 '—거리'로 옮겨 공적 수치의 의미를 살렸습니다. '웃음거리'는 צְחֹק의 결과 의미를, '조롱거리'는 לַעַג를 잘 반영합니다.
- source_word: מִרְבָּה לְהָכִיל
  english_pob_choice: for it holds much
  chosen_korean: 가득 담을 수 있기 때문입니다
  alternatives_korean:
  - 많이 담을 수 있기 때문입니다
  - 많은 양을 담기 때문입니다
  lexicon: HALOT
  rationale: 마지막 절은 잔이 왜 조롱거리가 되는지 설명하므로, '담을 수 있다'로 용량의 뉘앙스를 살렸습니다. '가득'은 정도를 강조하되 원문의 과장을 과도하게 덧붙이지 않습니다.
theological_decisions:
- issue: 야훼의 예언 선언 형식
  chosen_reading: 직접화법을 살려 '주 야훼께서 이렇게 말씀하십니다'로 옮겼습니다.
  alternative_readings:
  - 주 야훼가 말씀하신다
  - 주 하나님께서 이렇게 말씀하십니다
  rationale: 예언 서두의 공식 선언문을 현대 합쇼체로 유지하면서도, 원문의 권위성과 단정성을 보존합니다.
  doctrine_reference: POB style and divine-name policy
