  yaml_path: translation/ot/ezekiel/023/038.yaml
  text: 'Moreover, they did this to me: they defiled my sanctuary on that same day, and they profaned my Sabbaths.'
translation:
  language: ko
  text: 또한 그들은 내게 이런 일도 했습니다. 바로 그날 그들은 내 성소를 더럽혔고, 내 안식일들을 모독했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹד זֹאת עָשׂוּ לִי
  english_pob_choice: Moreover, they did this to me
  chosen_korean: 게다가 그들은 나에게 이 일을 했습니다
  alternatives_korean:
  - 또한 그들은 나에게 이 일을 했습니다
  - 더구나 그들은 나에게 이 일을 했습니다
  lexicon: HALOT
  rationale: עוֹד זֹאת의 추가·누적 의미를 ‘게다가’로 살리고, לִי는 단순한 소유가 아니라 하나님께 가해진 개인적 모독이므로 ‘나에게’로 직접 살렸습니다.
- source_word: טִמְּאוּ אֶת מִקְדָּשִׁי
  english_pob_choice: they defiled my sanctuary
  chosen_korean: 내 성소를 더럽혔고
  alternatives_korean:
  - 내 성소를 부정하게 했고
  - 내 성전을 더럽혔고
  lexicon: HALOT
  rationale: מִקְדָּשׁ는 좁게 ‘성전’보다 넓은 성소/거룩한 공간을 가리키므로 ‘성소’가 더 정확하며, טמא의 제의적 오염을 한국어에서 가장 자연스럽게 드러내는 말로 ‘더럽혔고’를 택했습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: on that same day
  chosen_korean: 곧 그날에
  alternatives_korean:
  - 바로 그날에
  - 그날에
  lexicon: HALOT
  rationale: 문맥상 앞서 묘사된 가증한 행위와 같은 날을 가리키므로 ‘곧’으로 즉시성과 압박감을 살리되, 시간표시 자체는 ‘그날에’로 유지했습니다.
- source_word: וְאֶת שַׁבְּתוֹתַי חִלֵּלוּ
  english_pob_choice: and they profaned my Sabbaths
  chosen_korean: 내 안식일들을 더럽혔습니다
  alternatives_korean:
  - 내 안식일들을 profaned했습니다
  - 내 안식일들을 범했습니다
  lexicon: HALOT
  rationale: שַׁבְּתוֹתַי의 복수형을 ‘안식일들’로 보존하고, חלל의 ‘거룩함을 훼손하다/더럽히다’는 의미를 같은 동사로 반복해 제의적 위반의 강도를 유지했습니다.
theological_decisions:
- issue: 성소와 안식일의 제의적 모독을 어떻게 드러낼지
  chosen_reading: ‘성소’와 ‘안식일들’을 유지하고, 두 경우 모두 ‘더럽혔습니다’로 번역해 거룩한 것의 침해라는 신학적 중대성을 보존했습니다.
  alternative_readings:
  - ‘성전’과 ‘안식일’을 쓰고 ‘훼손했습니다’로 완화하는 번역
  rationale: 이 절은 단순한 불결이 아니라 야훼의 거룩한 공간과 시간을 모독한 행위를 고발하므로, 제의적·언약적 위반의 강도를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
