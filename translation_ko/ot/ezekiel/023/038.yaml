    rationale: ‘곧’은 여기서 ‘즉/다시 말해’로도 읽혀 ‘바로 그날’이라는 지시적 강조를 충분히 드러내지 못하며, 문체상도 덜 자연스럽습니다.
  revised_text: 또한 그들은 내게 이런 일도 했습니다. 바로 그날 그들은 내 성소를 더럽혔고, 내 안식일들을 모독했습니다.
