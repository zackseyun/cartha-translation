source:
  edition: WLC
  text: וְ/נָתַתִּ֨י קִנְאָתִ֜/י בָּ֗/ךְ וְ/עָשׂ֤וּ אוֹתָ/ךְ֙ בְּ/חֵמָ֔ה אַפֵּ֤/ךְ וְ/אָזְנַ֨יִ/ךְ֙ יָסִ֔ירוּ וְ/אַחֲרִיתֵ֖/ךְ בַּ/חֶ֣רֶב תִּפּ֑וֹל הֵ֗מָּה בָּנַ֤יִ/ךְ וּ/בְנוֹתַ֨יִ/ךְ֙ יִקָּ֔חוּ וְ/אַחֲרִיתֵ֖/ךְ תֵּאָכֵ֥ל בָּ/אֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/025.yaml
  text: I will set my jealousy against you[a], and they will deal with you in wrath. They will remove your nose and your ears, and your survivors will fall by the sword. They will take your sons and your daughters[b], and your remnant will be consumed by fire.
  footnotes:
  - marker: a
    text: Or 'cut off your nose and your ears.' The Hebrew verb more literally means 'remove,' while the context may imply mutilation.
    reason: lexical_alternative
  - marker: b
    text: Or 'your latter end' or 'what remains of you.' Here the Hebrew likely refers to those left after the initial devastation, hence 'your survivors' / 'your remnant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 질투를 너에게 쏟아 두겠고[a], 그들이 너를 진노로 대할 것입니다. 그들은 네 코와 네 귀를 제거하고, 너의 남은 자들은 칼에 쓰러질 것입니다. 그들은 네 아들들과 네 딸들을 빼앗을 것이며[b], 너의 남은 것은 불에 사를 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 코와 네 귀를 잘라 버리겠다.’ 히브리어 동사는 더 문자적으로는 ‘제거하다’의 뜻이며, 문맥은 훼손을 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너의 나중 것’ 또는 ‘너에게 남은 것.’ 여기서는 히브리어가 초기 파괴 이후에 남은 사람들을 가리키는 것으로 보이므로, ‘남은 자들’ / ‘남은 것’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי קִנְאָתִי בָּךְ
  english_pob_choice: I will set my jealousy against you
  chosen_korean: 내가 내 질투를 너에게 쏟아 두겠고
  alternatives_korean:
  - 내가 내 질투를 너에게 두겠고
  - 내가 내 질투를 너에게 둘 것입니다
  lexicon: HALOT
  rationale: נתן의 ‘두다/놓다’ 의미를 살리되, כאן의 אויב적 방향성을 한국어에서 자연스럽게 드러내기 위해 ‘쏟아 두다’를 택했습니다. קִנְאָה는 언약적 배신에 대한 질투라는 긴장을 유지하기 위해 ‘열심’보다 ‘질투’로 옮겼습니다.
- source_word: וְעָשׂוּ אֹתָךְ בְּחֵמָה
  english_pob_choice: they will deal with you in wrath
  chosen_korean: 그들이 너를 진노로 대할 것입니다
  alternatives_korean:
  - 그들이 너를 분노로 다룰 것입니다
  - 그들이 너를 격노로 대할 것입니다
  lexicon: HALOT
  rationale: עשה + בְחֵמָה의 관용구를 직역하지 않고, 심판 문맥에 맞는 ‘대하다’로 자연스럽게 옮겼습니다. חֵמָה는 예언서의 재판적 어휘에 맞춰 ‘진노’로 번역했습니다.
- source_word: וְאַחֲרִיתֵךְ
  english_pob_choice: your survivors / your remnant
  chosen_korean: 너의 남은 자들
  alternatives_korean:
  - 너의 마지막
  - 너의 남은 것
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘끝’보다 이전 파괴 뒤에 남은 사람들을 가리키므로, POB의 해석을 따라 ‘남은 자들’로 옮겼습니다. 두 번째 출현은 동일 어휘권을 살리면서도 후반부 문맥에 맞게 ‘너의 남은 것’으로 처리했습니다.
- source_word: בַּחֶרֶב תִּפּוֹל
  english_pob_choice: will fall by the sword
  chosen_korean: 칼에 쓰러질 것입니다
  alternatives_korean:
  - 칼로 말미암아 쓰러질 것입니다
  - 칼에 넘어질 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서 가장 자연스러운 심판/전쟁 표현으로 옮겼습니다. ‘쓰러지다’는 죽음과 패배의 함의를 함께 보존합니다.
- source_word: תֵּאָכֵל בָּאֵשׁ
  english_pob_choice: will be consumed by fire
  chosen_korean: 불에 사를 것입니다
  alternatives_korean:
  - 불에 삼켜질 것입니다
  - 불에 태워질 것입니다
  lexicon: HALOT
  rationale: אָכַל의 ‘먹다/삼키다’ 이미지를 한국어에서 ‘사르다’로 옮겨 파괴의 강도를 살렸습니다. POB의 ‘consumed’에 대응하면서도 예언적 심판 어감을 유지합니다.
theological_decisions:
- issue: קִנְאָה의 정서적·언약적 긴장
  chosen_reading: ‘질투’로 번역해 하나님과 배신한 백성 사이의 언약적 관계와 심판의 감정을 함께 드러냈습니다.
  alternative_readings:
  - 열심
  - 시기
  rationale: 이 본문은 단순 감정이 아니라 배신에 대한 언약적 반응을 표현하므로, 한국어에서 가장 직접적으로 그 긴장을 유지하는 ‘질투’를 택했습니다.
  doctrine_reference: 번역 원칙 §3 — 신학적 긴장을 평탄화하지 말 것
