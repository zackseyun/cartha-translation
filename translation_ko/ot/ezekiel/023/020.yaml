reference: Ezekiel 23:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/תַּעְגְּבָ֔/ה עַ֖ל פִּֽלַגְשֵׁי/הֶ֑ם אֲשֶׁ֤ר בְּשַׂר חֲמוֹרִים֙ בְּשָׂרָ֔/ם וְ/זִרְמַ֥ת סוּסִ֖ים זִרְמָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/020.yaml
  text: She lusted after their paramours[a], whose flesh was like the flesh of donkeys[c][b], and whose emission was like the emission of horses.
  footnotes:
  - marker: a
    text: Hebrew literally, 'their concubines.' In context the term is commonly understood metaphorically of sexual partners or lovers.
    reason: lexical_alternative
  - marker: b
    text: '''Flesh'' here likely functions as a sexual euphemism, that is, ''members.'''
    reason: lexical_alternative
  - marker: c
    text: Or more explicitly, 'semen.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기들의 첩을 탐하였는데, 그들의 살은 나귀의 살과 같았고 그들의 유출은 말의 유출과 같았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 첩들’입니다. 문맥상 성적 관계의 상대를 가리키는 비유로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘살’은 여기서 성적 완곡어법, 곧 신체의 특정 부분을 가리키는 표현일 가능성이 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 더 노골적으로는 ‘정액’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעְגְּבָה עַל
  english_pob_choice: She lusted after
  chosen_korean: 그들은 …을 탐하였는데
  alternatives_korean:
  - 그들은 …을 정욕으로 갈망하였는데
  - 그들은 …을 사모하였는데
  lexicon: HALOT
  rationale: עגב은 이 문맥에서 강한 성적 욕망을 나타내므로, 현대 한국어에서 그 힘을 가장 직접적으로 드러내는 ‘탐하다’를 택했습니다.
- source_word: פִּלַגְשֵׁיהֶם
  english_pob_choice: their paramours
  chosen_korean: 자기들의 첩
  alternatives_korean:
  - 자기들의 애인
  - 자기들의 정부
  lexicon: HALOT
  rationale: 히브리어 어형 자체는 פִּלֶגֶשׁ(첩)에서 왔으므로, 본문에는 더 직역적인 ‘첩’을 두고, 문맥상의 성적 함의는 전체 문장으로 드러냈습니다.
- source_word: בְּשַׂר חֲמוֹרִים בְּשָׂרָם
  english_pob_choice: whose flesh was like the flesh of donkeys
  chosen_korean: 그들의 살은 나귀의 살과 같았고
  alternatives_korean:
  - 그들의 몸은 나귀의 몸과 같았고
  - 그들의 육체는 나귀의 육체와 같았고
  lexicon: HALOT
  rationale: בָּשָׂר는 문자적으로 ‘살’이므로 그 표현을 살리되, 이 구절의 성적 완곡어법 가능성은 본문 그대로 유지했습니다.
- source_word: וְזִרְמַת סוּסִים זִרְמָתָם
  english_pob_choice: and whose emission was like the emission of horses
  chosen_korean: 그들의 유출은 말의 유출과 같았습니다
  alternatives_korean:
  - 그들의 정액은 말의 정액과 같았습니다
  - 그들의 사정은 말의 사정과 같았습니다
  lexicon: HALOT
  rationale: זִרְמָה는 ‘흐름/유출’을 뜻하며 여기서는 성적 분비를 가리키므로, 지나치게 노골적이지 않으면서도 원문의 직설성을 살려 ‘유출’로 옮겼습니다.
theological_decisions:
- issue: 성적 비난의 직설적 이미지 보존
  chosen_reading: 원문의 노골적인 성적 비유를 완화하지 않고 그대로 드러냈습니다.
  alternative_readings:
  - 완곡하게 순화한 번역
  - 도덕적 비난을 일반화한 번역
  rationale: 예언자적 비판의 충격과 수치를 약화시키지 않기 위해, 본문이 의도한 성적 은유를 한국어에서도 분명히 보이게 했습니다.
  doctrine_reference: 예언서의 상징적 심판 언어와 본문의 수사적 의도
