  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִי֙ נֹֽתְנָ֔/ךְ בְּ/יַ֖ד אֲשֶׁ֣ר שָׂנֵ֑את בְּ/יַ֛ד אֲשֶׁר נָקְעָ֥ה נַפְשֵׁ֖/ךְ מֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/028.yaml
  text: 'For thus says the Lord GOD: Behold[a], I am giving you into the hand of those whom you hate, into the hand of those from whom your soul has turned away.'
  footnotes:
  - marker: a
    text: Or 'those whom your soul loathes,' or 'those from whom your soul has been torn away.' The Hebrew expression is vivid and can denote deep estrangement or revulsion.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 주 하나님께서 말씀하셨기 때문입니다. 보십시오, 내가 당신을 당신이 미워하는 자들의 손에, 당신의 마음이 그들에게서 돌아선 자들의 손에 넘겨주겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 마음이 그들을 몹시 혐오하는 자들’, 혹은 ‘당신의 마음이 그들에게서 찢겨 나온 자들’로도 옮길 수 있습니다. 히브리어 표현은 생생하며, 깊은 소원함이나 혐오를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와
  lexicon: HALOT
  rationale: 예언서의 고정된 호칭구를 살리되, 한국어에서는 ‘주 하나님’이 ‘주 LORD’의 중복을 피하면서도 높임과 권위를 자연스럽게 전달합니다.
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보라, 지금
  lexicon: HALOT
  rationale: 선언적이고 단호한 예언 문맥을 유지하면서 현대 한국어에서 자연스러운 주의 환기 표현으로 옮겼습니다.
- source_word: נֹתְנָךְ בְּיַד
  english_pob_choice: I am giving you into the hand of
  chosen_korean: 당신을 ... 손에 넘겨주겠습니다
  alternatives_korean:
  - 당신을 ... 손에 주겠습니다
  - 당신을 ... 권세 아래 두겠습니다
  lexicon: HALOT
  rationale: ‘손에’라는 히브리어 관용구를 유지하되, 한국어에서는 통제·처분의 뉘앙스를 드러내는 ‘넘겨주다’가 가장 직접적입니다.
- source_word: נָקְעָה נַפְשֵׁךְ מֵהֶם
  english_pob_choice: those from whom your soul has turned away
  chosen_korean: 당신의 마음이 그들에게서 돌아선 자들
  alternatives_korean:
  - 당신의 영혼이 그들에게서 떨어져 나온 자들
  - 당신이 그들을 몹시 혐오하는 자들
  lexicon: HALOT
  rationale: ‘נפש’의 비유적이고 내적 거리감을 한국어 ‘마음’으로 전달해, POB가 지적한 ‘deep estrangement or revulsion’의 긴장을 과도한 심리화 없이 반영했습니다.
theological_decisions:
- issue: 야훼 신명(יהוה)의 한국어 처리
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 이 절의 영어 POB는 관용적으로 ‘the Lord GOD’를 택했으며, 한국어 본문에서는 예언자적 호칭의 엄숙함을 살리면서도 신명 표기를 본문에 직접 노출하지 않는 형태로 정리했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
