base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/028.yaml
  text: 'For thus says the Lord GOD: Behold[a], I am giving you into the hand of those whom you hate, into the hand of those from whom your soul has turned away.'
  footnotes:
  - marker: a
    text: Or 'those whom your soul loathes,' or 'those from whom your soul has been torn away.' The Hebrew expression is vivid and can denote deep estrangement or revulsion.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하십니다. “보십시오, 내가 당신을 당신이 미워하는 자들의 손에, 당신의 마음이 그들에게서 돌아서 버린 자들의 손에 넘겨주겠습니다.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 마음이 몹시 혐오하는 자들의 손에’, 혹은 ‘당신의 마음이 그들에게서 떨어져 나간 자들의 손에’로 옮길 수 있습니다. 히브리어 표현은 생생하며, 깊은 소원함이나 혐오를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
