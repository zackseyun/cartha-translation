  - 당신이 그들을 몹시 혐오하는 자들
  lexicon: HALOT
  rationale: ‘נפש’의 비유적이고 내적 거리감을 한국어 ‘마음’으로 전달해, POB가 지적한 ‘deep estrangement or revulsion’의 긴장을 과도한 심리화 없이 반영했습니다.
theological_decisions:
