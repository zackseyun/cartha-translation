id: EZK.23.34
reference: Ezekiel 23:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁתִ֨ית אוֹתָ֜/הּ וּ/מָצִ֗ית וְ/אֶת חֲרָשֶׂ֛י/הָ תְּגָרֵ֖מִי וְ/שָׁדַ֣יִ/ךְ תְּנַתֵּ֑קִי כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/034.yaml
  text: You will drink it and drain it dry[a], and you will gnaw its shards, and tear off your breasts; for I have spoken, declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'potsherds' for 'shards.' The Hebrew refers to the broken pieces of a clay vessel.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 그것을 마시고 남김없이 들이킬 것이며[a], 그것의 파편들을 갉아먹고 당신의 유방을 찢어 낼 것입니다. 이는 내가 말하였기 때문입니다. 주 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘토기 조각들’로 옮길 수 있습니다. 히브리어는 깨진 질그릇의 조각을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁתִית אוֹתָהּ
  english_pob_choice: You will drink it
  chosen_korean: 너는 그것을 마실 것이며
  alternatives_korean:
  - 너는 그것을 마시게 될 것이며
  - 너는 그것을 마시리라
  lexicon: HALOT
  rationale: 예언적 미래를 한국어 합쇼체로 자연스럽게 옮기되, 직접 목적어 대명사 '그것'으로 잔의 여성형 대상을 살렸습니다.
- source_word: וּמָצִית
  english_pob_choice: and drain it dry
  chosen_korean: 끝까지 다 빨아들일 것이며
  alternatives_korean:
  - 그리고 그것을 빨아들일 것이며
  - 그리고 그것을 다 비울 것이며
  lexicon: HALOT
  rationale: מצה의 ‘끝까지 빨아내다/짜내다’는 뜻을 살려, 단순히 ‘비우다’보다 이미지가 더 직접적인 표현을 택했습니다.
- source_word: חֲרָשֶׂיהָ
  english_pob_choice: its shards
  chosen_korean: 그 깨어진 조각들
  alternatives_korean:
  - 그 파편들
  - 그 토기 조각들
  lexicon: HALOT
  rationale: 그릇이 깨진 파편을 가리키므로 ‘조각들’로 옮기되, 문맥의 파괴 이미지를 살리기 위해 ‘깨어진’을 덧붙였습니다.
- source_word: וְשָׁדַיִךְ תְּנַתֵּקִי
  english_pob_choice: and tear off your breasts
  chosen_korean: 네 젖을 잡아뜯을 것이다
  alternatives_korean:
  - 네 젖을 찢어낼 것이다
  - 네 가슴을 찢어낼 것이다
  lexicon: HALOT
  rationale: נתק의 ‘떼어내다, 잡아뜯다’라는 폭력적 의미를 약화하지 않기 위해 직설적인 ‘잡아뜯다’를 사용했습니다. ‘젖’은 גוף의 특정 부위를 드러내는 직접 번역입니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 야훼의 말씀입니다
  alternatives_korean:
  - 주 하나님 야훼의 말씀입니다
  - 주 하나님이 말씀하십니다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם은 한국어에서 ‘말씀입니다’로 자연스럽게 드러내고, אֲדֹנָי יְהוִה는 프로젝트 기본값에 따라 ‘주 야훼’로 옮겼습니다.
theological_decisions:
- issue: 폭력적 심판 이미지의 보존
  chosen_reading: ‘끝까지 다 빨아들일 것이며… 잡아뜯을 것이다’처럼 신체 훼손의 충격을 완화하지 않고 그대로 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘다 마실 것이다’ 혹은 ‘찢어낼 것이다’로 순화
  - 상징적 의미로만 처리
  rationale: 본문은 심판의 극단성과 수치를 의도적으로 표현하므로, 한국어에서도 완곡화하지 않는 것이 원문의 의도를 더 정확히 전달합니다.
  doctrine_reference: Ezekiel 23 문맥의 예언적 심판 선언
