theological_decisions:
- issue: 예언서의 성적 비유를 한국어에서 얼마나 직접적으로 살릴지
  chosen_reading: 직접적인 성적/음행 이미지를 유지하되, 현대 한국어에서 과도한 선정성은 피하는 '음행'으로 번역했습니다.
  alternative_readings:
  - 언약적 불충실
  - 부정함
  - 매춘
  rationale: 에스겔은 수치를 주기 위한 강한 비유를 의도하므로, 이를 도덕적 추상어로 약화시키지 않았습니다. 동시에 본문이 요구하는 비유적 의미는 문맥이 드러내도록 했습니다.
  doctrine_reference: Ezekiel 23의 예언적 비유 해석, 번역 원칙 §§1, 5, 6
