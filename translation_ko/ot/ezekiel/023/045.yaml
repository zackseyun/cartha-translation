source:
  edition: WLC
  text: וַ/אֲנָשִׁ֣ים צַדִּיקִ֗ם הֵ֚מָּה יִשְׁפְּט֣וּ אֽוֹתְ/הֶ֔ם מִשְׁפַּט֙ נֹֽאֲפ֔וֹת וּ/מִשְׁפַּ֖ט שֹׁפְכ֣וֹת דָּ֑ם כִּ֤י נֹֽאֲפֹת֙ הֵ֔נָּה וְ/דָ֖ם בִּֽ/ידֵי/הֶֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/045.yaml
  text: But righteous men will judge them with the judgment of adulteresses and with the judgment of women who shed blood[a], because they are adulteresses[b], and blood is on their hands.
  footnotes:
  - marker: a
    text: Or, 'according to the judgment for adulteresses and for women who shed blood.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'blood is in their hands'; the English idiom 'blood is on their hands' expresses guilt for bloodshed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 의로운 남자들이 간음한 여자들에게 내리는 판결과 피를 흘린 여자들에게 내리는 판결로 그들을 심판할 것입니다[a]. 그들은 간음한 여자들이며, 그들의 손에는 피가 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘간음한 여자들과 피를 흘린 여자들에 대한 판결에 따라’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘피가 그들의 손에 있다’입니다. 이 표현은 피 흘림에 대한 책임 또는 죄를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנָשִׁים צַדִּיקִם
  english_pob_choice: righteous men
  chosen_korean: 의로운 남자들
  alternatives_korean:
  - 의로운 사람들
  - 의인들
  lexicon: HALOT
  rationale: 히브리어 אֲנָשִׁים는 남성 복수형이므로 ‘남자들’을 살리고, צַדִּיקִם은 법정적·도덕적 의미를 함께 살려 ‘의로운’으로 옮겼습니다.
- source_word: יִשְׁפְּטוּ אֹתְהֶם
  english_pob_choice: will judge them
  chosen_korean: 그들을 심판할 것입니다
  alternatives_korean:
  - 그들을 판단할 것입니다
  - 그들에게 판결할 것입니다
  lexicon: HALOT
  rationale: 법정 문맥의 שׁפט는 단순한 판단보다 판결·심판의 뉘앙스가 강하므로 ‘심판하다’가 가장 자연스럽고 강하게 대응합니다.
- source_word: מִשְׁפַּט נֹאֲפוֹת וּמִשְׁפַּט שֹׁפְכוֹת דָּם
  english_pob_choice: with the judgment of adulteresses and with the judgment of women who shed blood
  chosen_korean: 간음한 여자들에게 내리는 판결과 피를 흘린 여자들에게 내리는 판결
  alternatives_korean:
  - 간음한 여자들의 판결과 피 흘리는 여자들의 판결
  - 간음한 여자들에 대한 판결과 피를 흘린 여자들에 대한 판결
  lexicon: HALOT
  rationale: מִשְׁפַּט은 ‘판결/재판’으로 옮기고, שני 개의 여성 분사구는 문맥상 여성들을 가리키므로 ‘여자들’로 풀어 법정 의미와 대상의 성별을 함께 드러냈습니다.
- source_word: וְדָם בִּידֵיהֶן
  english_pob_choice: and blood is on their hands
  chosen_korean: 그들의 손에는 피가 있습니다
  alternatives_korean:
  - 그들의 손에 피가 있습니다
  - 그들의 손 위에 피가 있습니다
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘그들의 손에 피가 있다’이지만, 한국어에서는 책임과 유죄를 나타내는 관용을 과장 없이 살려 ‘손에는 피가 있습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘의로운 남자들’의 심판 주체
  chosen_reading: 본문은 하나님이 아니라 인간적 법정 이미지 안에서 ‘의로운 남자들’이 판결을 집행하는 장면을 말합니다.
  alternative_readings:
  - 의로운 남자들은 하나님의 심판을 상징하는 이상적 대리자일 수 있습니다.
  rationale: 히브리어가 직접 ‘의로운 남자들’이라고 말하므로, 상징성을 과도하게 확장하지 않고 법정적 이미지 자체를 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
