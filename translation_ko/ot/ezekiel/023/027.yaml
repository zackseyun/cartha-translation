id: EZK.23.27
reference: Ezekiel 23:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּ֤י זִמָּתֵ/ךְ֙ מִמֵּ֔/ךְ וְ/אֶת זְנוּתֵ֖/ךְ מֵ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לֹֽא תִשְׂאִ֤י עֵינַ֨יִ/ךְ֙ אֲלֵי/הֶ֔ם וּ/מִצְרַ֖יִם לֹ֥א תִזְכְּרִי עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/027.yaml
  text: So I will put an end to your lewdness from you[a], and your prostitution from the land of Egypt; and you will not lift up your eyes to them[b], and you will remember Egypt no more.
  footnotes:
  - marker: a
    text: Or 'you will not look to them'—the Hebrew idiom 'lift up your eyes to' can imply desire, attention, or dependence.
    reason: lexical_alternative
  - marker: b
    text: Or 'and to your prostitution'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 내가 네게서 네 음란함을 그치게 하고, 애굽 땅에서 비롯된 네 음행도 그치게 하겠다. 네가 그들을 향해 눈을 들지도 않을 것이며[a], 애굽을 다시는 기억하지 않을 것이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘눈을 들다’는 단순히 바라보는 것뿐 아니라 욕망, 관심, 또는 의존을 뜻할 수도 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  english_pob_choice: I will put an end to
  chosen_korean: 그치게 하겠다
  alternatives_korean:
  - 끝내겠다
  - 멈추게 하겠다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려, 하나님이 그 행위를 중단시키시는 뜻을 자연스러운 현대어로 옮겼습니다.
- source_word: זִמָּתֵךְ
  english_pob_choice: your lewdness
  chosen_korean: 네 음란함
  alternatives_korean:
  - 네 악행
  - 네 부끄러운 행실
  lexicon: HALOT
  rationale: 이 문맥의 זִמָּה는 일반적 악이 아니라 수치스러운 성적 타락을 가리키므로, 그 성적·도덕적 강도를 드러내는 표현을 택했습니다.
- source_word: וְאֶת זְנוּתֵךְ
  english_pob_choice: and your prostitution
  chosen_korean: 네 음행도
  alternatives_korean:
  - 네 창녀짓도
  - 네 간음도
  lexicon: HALOT
  rationale: זְנוּת는 비유적 문맥에서 음행/매춘을 뜻하므로, 직설적이면서도 현대 한국어에서 읽히는 ‘음행’을 사용했습니다.
- source_word: לֹא תִשְׂאִי עֵינַיִךְ אֲלֵיהֶם
  english_pob_choice: you will not lift up your eyes to them
  chosen_korean: 네가 그들을 향해 눈을 들지도 않을 것이며
  alternatives_korean:
  - 네가 그들을 바라보지도 않을 것이며
  - 네가 그들에게 눈을 돌리지도 않을 것이며
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈을 들다’를 직설적으로 살리되, 한국어 문장에서는 목적 방향을 자연스럽게 드러내어 이미지와 의미를 함께 보존했습니다.
- source_word: מִצְרַיִם
  english_pob_choice: Egypt
  chosen_korean: 애굽
  alternatives_korean:
  - 이집트
  - 애굽 나라
  lexicon: BDB/표준 관용
  rationale: 본문의 고유 지리명은 한국어 성경 전통에서 널리 굳어진 ‘애굽’을 유지해, 고정된 성서 지시 대상을 분명히 했습니다.
theological_decisions:
- issue: 노골적인 성적 은유의 보존
  chosen_reading: ‘음란함’, ‘음행’으로 직접 옮겨 예언적 심판 언어의 수위를 유지했습니다.
  alternative_readings:
  - ‘부도덕함’처럼 완화하기
  - ‘불성실함’으로 비유를 희석하기
  rationale: 이 구절은 우상숭배와 언약 불신실함을 성적 언어로 고발하므로, 완곡하게 바꾸면 예언의 의도와 충격이 약해집니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: ‘눈을 들다’ 관용구의 처리
  chosen_reading: 관용구를 유지하되 ‘그들을 향해’로 방향성을 보강했습니다.
  alternative_readings:
  - ‘그들을 바라보다’로 단순화하기
  - ‘그들에게 의지하다’로 해석 확정하기
  rationale: 본문은 욕망, 주의, 의존의 가능성을 모두 열어 두므로, 하나의 해석으로 좁히지 않고 히브리어 이미지를 보존하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §3
