  source_fidelity: 핵심 동사 ‘그치게 하겠다’는 히브리어 히필의 사역적 의미를 잘 반영합니다. 다만 ‘애굽 땅에서 나온 네 음행’은 구어적으로 다소 거칠고, מֵאֶרֶץ מִצְרָיִם이 수식하는 출처 관계를 더 자연스럽고 분명하게 표현할 수 있습니다. ‘그들을 향해 눈을 들다’는 원문의 의도적으로 열려 있는 관용적 표현을 보존합니다.
  naturalness: ‘네게서 네 음란함을 그치게 하고’가 초안의 ‘네 음란함을 네게서 그치게 하고’보다 현대 한국어의 어순에 자연스럽습니다. 또한 각주 표지는 해당 관용구 바로 뒤에 두는 것이 독자의 이해에 적절합니다.
  terminology: ‘음란함’과 ‘음행’은 זִמָּה 및 זְנוּת의 성적·비유적 심판 언어를 지나치게 완화하지 않고 옮긴 표현입니다. ‘애굽’은 한국어 성경 문맥에서 통용되는 고유명사입니다.
