- from: 그리하여 내가 네 음란함을 네게서 그치게 하고, 애굽 땅에서 나온 네 음행도 그치게 하겠다. 네가 그들을 향해 눈을 들지도 않을 것이며, 애굽을 다시는 기억하지도 않을 것이다.[a][b]
  to: 그러므로 내가 네게서 네 음란함을 그치게 하고, 애굽 땅에서 비롯된 네 음행도 그치게 하겠다. 네가 그들을 향해 눈을 들지도 않을 것이며[a], 애굽을 다시는 기억하지 않을 것이다.
  rationale: 원문의 사역적 선언, 성적 은유, ‘눈을 들다’의 관용적 모호성을 유지했습니다. 어색한 출처 수식어를 자연화하고, 관용구 설명 각주를 해당 어구에 직접 연결했습니다. 본문이 확정하지 않는 ‘향수’나 ‘되돌아감’의 해석을 담은 각주 b는 삭제했습니다.
