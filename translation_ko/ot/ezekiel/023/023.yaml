    issue: פְּקוֹד를 ‘벽돌’로 번역함
    rationale: פְּקוֹד는 여기서 일반명사 ‘벽돌’이 아니라 민족 또는 지역의 고유명사 Pekod입니다. ‘벽돌’은 원문의 지시 대상과 목록 구조를 훼손합니다.
  - severity: medium
    issue: ‘그들과 함께 있었으니’ 및 과거형 서술
    rationale: אֹתָם은 ‘그들과 함께한’으로 앞선 집단들과 아시리아 자손들의 동반 관계를 나타냅니다. 히브리어는 이 절에서 인물·집단의 열거와 분사적 묘사를 제시하므로, 과거의 완료된 사건으로 만들지 않는 편이 충실합니다.
  - severity: low
