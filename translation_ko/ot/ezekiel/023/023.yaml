revisions:
- from: 바벨의 아들들과 모든 갈대아 사람들, 그리고 벽돌과 소아와 고아, 아시리아의 모든 아들들이 그들과 함께 있었으니 — 모두가 아름다운 젊은이들이며, 모두가 총독과 관리들이고, 지휘관들과 명망 있는 사람들로서, 모두가 말 위를 타고 있었습니다.[a][b]
  to: 바벨의 자손들과 모든 갈대아 사람들, 브곳과 쇼아와 코아, 그리고 그들과 함께한 모든 앗수르 자손들입니다. 그들은 모두 빼어난 젊은이들이며, 모두 총독과 관리들이고, 지휘관들과 이름난 사람들로서, 모두 말을 타고 있습니다.[a][b]
  rationale: 고유명사 פְּקוֹד의 오역을 바로잡고, 원문의 병렬 목록과 세 차례의 ‘모두’를 보존했습니다. 아시리아 집단의 동반 관계를 명확히 하되, 히브리어의 열거적 묘사를 불필요한 과거 서술로 바꾸지 않았습니다. 각주는 고유명사 해석의 불확실성과 קְרוּאִים의 어휘적 대안을 각각 유지합니다.
