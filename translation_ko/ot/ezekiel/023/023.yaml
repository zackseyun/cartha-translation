id: EZK.23.23
reference: Ezekiel 23:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵ֧י בָבֶ֣ל וְ/כָל כַּשְׂדִּ֗ים פְּק֤וֹד וְ/שׁ֨וֹעַ֙ וְ/ק֔וֹעַ כָּל בְּנֵ֥י אַשּׁ֖וּר אוֹתָ֑/ם בַּח֨וּרֵי חֶ֜מֶד פַּח֤וֹת וּ/סְגָנִים֙ כֻּלָּ֔/ם שָֽׁלִשִׁים֙ וּ/קְרוּאִ֔ים רֹכְבֵ֥י סוּסִ֖ים כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/023.yaml
  text: the sons of Babylon and all the Chaldeans[a], Pekod and Shoa and Koa, all the sons of Assyria with them—desirable young men, all of them governors and officials, officers and men of renown[b], all of them riding on horses.
  footnotes:
  - marker: a
    text: Pekod, Shoa, and Koa are likely names of peoples or regions allied with Babylon; some take them instead as descriptive labels such as officials, nobles, or warriors.
    reason: alternative_reading
  - marker: b
    text: Or 'distinguished men' or more literally 'called ones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바벨의 아들들과 모든 갈대아 사람들, 그리고 벽돌과 소아와 고아, 아시리아의 모든 아들들이 그들과 함께 있었으니 — 모두가 아름다운 젊은이들이며, 모두가 총독과 관리들이고, 지휘관들과 명망 있는 사람들로서, 모두가 말 위를 타고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: פְּקוֹד, שׁוֹעַ, קוֹעַ는 바벨과 연합한 민족이나 지역 이름일 가능성이 있으며, 어떤 해석은 이를 관리들, 귀족들, 전사들 같은 묘사적 호칭으로 보기도 합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘불린 자들’, 곧 문자적으로는 ‘호명된 사람들’일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בָבֶל
  english_pob_choice: the sons of Babylon
  chosen_korean: 바벨의 아들들
  alternatives_korean:
  - 바벨 사람들
  - 바벨 사람들
  lexicon: HALOT
  rationale: 히브리어의 ‘~의 아들들’ 관용구를 살리면서, 민족·계통적 병렬 구조를 유지하기 위해 직역에 가깝게 옮겼습니다.
- source_word: כַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아 사람들
  alternatives_korean:
  - 갈대아인들
  - 바벨 사람들
  lexicon: HALOT
  rationale: ‘바벨’과 구별되는 별도 민족명으로 처리하여 영어 POB의 구분을 유지했습니다.
- source_word: פְּקוֹד וְשׁוֹעַ וְקוֹעַ
  english_pob_choice: Pekod and Shoa and Koa
  chosen_korean: 벽돌과 소아와 고아
  alternatives_korean:
  - 베고드와 쇼아와 코아
  - 관리들과 귀족들과 전사들
  lexicon: HALOT
  rationale: 문맥상 고유명사 목록으로 보아 음역했으며, 히브리어 형태를 따라 병렬된 이름들을 보존했습니다.
- source_word: פַּחוֹת וּסְגָנִים
  english_pob_choice: governors and officials
  chosen_korean: 총독과 관리들
  alternatives_korean:
  - 지방 총독과 대리들
  - 지사들과 관리들
  lexicon: HALOT
  rationale: 제국 행정 직함을 현대 한국어로 자연스럽게 옮기되, 위계가 느껴지도록 ‘총독’과 ‘관리들’로 대응했습니다.
- source_word: שָׁלִשִׁים וּקְרוּאִים
  english_pob_choice: officers and men of renown
  chosen_korean: 지휘관들과 명망 있는 사람들
  alternatives_korean:
  - 장교들과 불린 자들
  - 지휘관들과 부름받은 자들
  lexicon: HALOT
  rationale: 군사적·명예적 뉘앙스를 함께 살리기 위해 ‘지휘관들’과 ‘명망 있는 사람들’로 옮겼습니다. 영어 POB가 각주로 제시한 ‘called ones’의 문자적 가능성은 본문 가독성을 위해 각주로 처리했습니다.
- source_word: רֹכְבֵי סוּסִים
  english_pob_choice: riding on horses
  chosen_korean: 말 위를 타고 있었습니다
  alternatives_korean:
  - 말을 탄
  - 기마한
  lexicon: HALOT
  rationale: 히브리어 분사구를 따라 상태 묘사로 살렸고, 한국어에서 자연스러운 서술형으로 정리했습니다.
theological_decisions:
- issue: 이 절의 반복되는 ‘모든’과 병렬 목록이 드러내는 강세
  chosen_reading: 각 집단을 ‘모든’으로 반복해, 압도적이고 총체적인 군세의 그림을 본문 그대로 유지했습니다.
  alternative_readings:
  - 한 번만 ‘모든’으로 줄여 자연스럽게 읽는 방식
  - 의미를 압축해 일반적인 군대 묘사로 바꾸는 방식
  rationale: 히브리어의 누적적 반복은 단순 정보 전달이 아니라 장면의 위압감을 형성하므로, 이를 희석하지 않는 쪽이 본문 의도에 더 가깝습니다.
  doctrine_reference: 본문의 수사적 강조 보존 원칙
- issue: פְּקוֹד וְשׁוֹעַ וְקוֹעַ의 해석
  chosen_reading: 고유명사로 읽어 음역을 본문에 두고, 별도 해석 가능성은 각주로 남겼습니다.
  alternative_readings:
  - ‘관리들, 귀족들, 전사들’ 같은 서술적 호칭으로 이해하는 방식
  rationale: 영어 POB가 제시한 대로 지명·민족명 가능성이 문법적으로 열려 있으므로, 본문에서 한쪽 해석으로 고정하지 않고 여지를 유지했습니다.
  doctrine_reference: 본문비평/해석학적 유보
