id: EZK.14.18
reference: Ezekiel 14:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֣ים הָ/אֵלֶּה֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה לֹ֥א יַצִּ֖ילוּ בָּנִ֣ים וּ/בָנ֑וֹת כִּ֛י הֵ֥ם לְ/בַדָּ֖/ם יִנָּצֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/018.yaml
  text: And if these three men were in its midst[a], as I live, declares the Lord GOD, they would not deliver sons or daughters[b]; they alone would be delivered.
  footnotes:
  - marker: a
    text: 'Hebrew: ''sons and daughters.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'would not save' ... 'they alone would be saved'; the Hebrew verb can mean 'deliver,' 'rescue,' or 'save,' but here refers to escape from judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 세 사람이 그 가운데에 있다 하더라도, 내가 살아 있음을 두고 맹세합니다. 주 야훼의 말씀입니다. 그들은 아들이나 딸을[a] 구해 내지 못하고, 그들만 구출될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아들과 딸’이라고 성별을 분명히 말합니다.
    reason: source_note
  - marker: b
    text: 여기서 동사는 ‘구해 내다’, ‘구출하다’ 또는 ‘구원하다’라는 뜻일 수 있으며, 이 문맥에서는 심판에서 벗어나는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  english_pob_choice: And if these three men
  chosen_korean: 그리고 이 세 사람이
  alternatives_korean:
  - 이 세 사람
  - 그리고 이 세 사람들
  lexicon: HALOT
  rationale: 히브리어는 ‘세 사람들’을 가리키는 명시적 표현이며, 문맥상 가정 조건이 이어지므로 한국어에서는 앞뒤 절의 조건성을 살리되 자연스럽게 옮겼습니다.
- source_word: בְּתוֹכָהּ
  english_pob_choice: in its midst
  chosen_korean: 그 가운데에
  alternatives_korean:
  - 그 안에
  - 그 속에
  lexicon: HALOT
  rationale: 직역적 ‘가운데’는 히브리어 관용구를 비교적 가깝게 보존하면서도 현대 한국어에서 어색하지 않습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님이 선언하신다
  alternatives_korean:
  - 주 여호와께서 선언하신다
  - 주 하나님이 말씀하신다
  lexicon: HALOT
  rationale: 아도나이+יהוה의 고정 결합은 한국어에서 ‘주 하나님’이 가장 자연스럽고, נְאֻם은 단순한 ‘말씀하다’보다 공적 선포의 뉘앙스가 강해 ‘선언하신다’로 옮겼습니다.
- source_word: לֹא יַצִּילוּ / יִנָּצֵלוּ
  english_pob_choice: they would not deliver ... they alone would be delivered
  chosen_korean: 구해 내지 못할 것이며, 그들만이 구출될 것입니다
  alternatives_korean:
  - 구원하지 못할 것이며, 그들만이 구원될 것입니다
  - 건져 내지 못할 것이며, 그들만이 건짐을 받을 것입니다
  lexicon: HALOT
  rationale: 앞뒤에 같은 어근 נצל이 반복되므로 ‘구해 내다/구출되다’로 대응시켜 상호 연관성을 살렸습니다. ‘구원’은 여기서의 심판 회피라는 문맥을 다소 넓게 만들 수 있어 피했습니다.
- source_word: בָּנִים וּבָנוֹת
  english_pob_choice: sons or daughters
  chosen_korean: 아들과 딸
  alternatives_korean:
  - 아들들과 딸들
  - 자녀들
  lexicon: HALOT
  rationale: 히브리어의 성별쌍을 살리되, 부정문 뒤에서는 한국어에서 ‘아들과 딸’을 가장 자연스럽게 읽을 수 있습니다.
theological_decisions:
- issue: 야훼/주 하나님 표기
  chosen_reading: 본문에서는 ‘주 하나님’으로 옮기고, 고유명 יהוה를 직접 음역하지 않았습니다.
  alternative_readings:
  - 야훼
  - 주 야훼
  rationale: 이 절의 고정 칭호는 ‘아도나이+יהוה’ 결합형이어서 한국어 합쇼체 본문에서는 ‘주 하나님’이 가장 안정적입니다. 이는 일반 번역 관행을 따르되, 본문의 경어·선언문체를 유지합니다.
  doctrine_reference: 'DOCTRINE.md: contested divine-name rendering in compound title'
- issue: ‘구출/구해 내다’의 범위
  chosen_reading: 시간적 재난과 심판에서의 구출로 제한하여 읽었습니다.
  alternative_readings:
  - 영원한 구원
  - 단순한 생존
  rationale: 문맥은 바벨론 심판 아래서의 보존 여부이므로, 종말론적 구원으로 확장하지 않고 재난 회피의 의미를 유지하는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: temporal deliverance in prophetic judgment context'
