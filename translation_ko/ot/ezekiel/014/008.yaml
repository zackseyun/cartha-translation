  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּ֨י פָנַ֜/י בָּ/אִ֣ישׁ הַ/ה֗וּא וַ/הֲשִֽׂמֹתִ֨י/הוּ֙ לְ/א֣וֹת וְ/לִ/מְשָׁלִ֔ים וְ/הִכְרַתִּ֖י/ו מִ/תּ֣וֹךְ עַמִּ֑/י וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/008.yaml
  text: And I will set my face against that man[a], and I will make him a sign and a proverb, and I will cut him off from the midst of my people. Then you will know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'a byword.' The Hebrew term can denote a proverb, taunt, or public saying about someone.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 얼굴을 그 사람에게 돌리고, 그를 표징과 속담이 되게 하며, 내 백성 가운데서 끊어 버리겠습니다. 그러면 너희는 내가 야훼임을 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속담’에 해당하는 히브리어는 문맥에 따라 ‘비방거리’ 또는 ‘회자되는 말’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָּאִישׁ הַהוּא
  english_pob_choice: I will set my face against that man
  chosen_korean: 내가 내 얼굴을 그 사람에게 돌리고
  alternatives_korean:
  - 내가 내 얼굴을 그 사람에게 대적하여 두고
  - 내가 그 사람에게 맞서 내 얼굴을 두고
  lexicon: HALOT
  rationale: ‘얼굴을 …에게 돌리다’는 히브리어의 신체 이미지와 결단된 विरोध/심판의 뉘앙스를 살리면서 한국어로 자연스럽게 옮긴 표현입니다.
- source_word: לְאוֹת וְלִמְשָׁלִים
  english_pob_choice: a sign and a proverb
  chosen_korean: 표징과 속담이 되게 하며
  alternatives_korean:
  - 표징과 비방거리가 되게 하며
  - 표징과 비유가 되게 하며
  lexicon: HALOT
  rationale: אוֹת는 ‘표징’으로, מָשָׁל은 문맥상 사람들에게 회자되는 말이라는 점을 살려 ‘속담’으로 옮겼습니다. ‘비방거리’는 수치의 뉘앙스는 강하지만 의미를 더 좁힐 수 있습니다.
- source_word: וְהִכְרַתִּיו מִתּוֹךְ עַמִּי
  english_pob_choice: I will cut him off from the midst of my people
  chosen_korean: 내 백성 가운데서 끊어 버리겠습니다
  alternatives_korean:
  - 내 백성 가운데서 도려내겠습니다
  - 내 백성 중에서 제거하겠습니다
  lexicon: HALOT
  rationale: כרת의 언약적·심판적 관용구를 ‘끊어 버리다’로 보존했습니다. ‘가운데서’는 원문의 공간적 이미지를 비교적 직접적으로 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 하나님의 고유명을 제목이 아닌 고유명으로 드러내기 위해 관례적 대치어보다 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 심판 선언 뒤 인식 공식의 종결 효과
  chosen_reading: 그러면 너희는 내가 야훼임을 알게 될 것입니다
  alternative_readings:
  - 그러면 너희는 내가 주님임을 알게 될 것입니다
  - 그리고 너희는 내가 야훼임을 알게 될 것입니다
  rationale: 히브리어의 결과적 연결을 한국어에서 분명하게 드러내기 위해 ‘그러면’을 사용했습니다. 본문의 결론은 단순 정보가 아니라 심판을 통한 인식이므로 이 종결 구조를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘그 사람’에 대한 성중립화 여부
  chosen_reading: 그 사람
  alternative_readings:
  - 그 남자
  - 그 사람(성중립화)
  rationale: 원문은 문법상 남성 단수이지만, 한국어에서는 ‘그 사람’이 자연스럽고 본문의 특정 인물을 지칭하는 기능을 충분히 보존합니다. 다만 ‘인물’로 완전히 추상화하지는 않았습니다.
  doctrine_reference: Translation philosophy §2
