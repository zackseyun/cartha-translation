revisions:
- from: 내가 그 땅에 칼을 가져와 그 땅을 향하여 말하며, 「칼아, 그 땅을 지나가라」 하고 그 땅에서 사람과 짐승을 끊어 버릴 때,[a]
  to: 또는 내가 그 땅을 치려고 칼을 가져오고, ‘칼이 그 땅을 지나가라’ 하고 말하여, 그 땅에서 사람과 짐승을 끊어 버린다면,[a]
