  to: 이 세 사람이 그 가운데에 있다 하더라도, 내가 살아 있음을 두고 맹세합니다. 주 야훼의 말씀입니다. 그들은 아들이나 딸들을 아무도 구해 내지 못하고[a], 그들만 구출될 것이며, 땅은 황폐해질 것입니다.
