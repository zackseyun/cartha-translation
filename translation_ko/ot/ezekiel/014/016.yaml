id: EZK.14.16
reference: Ezekiel 14:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֣ים הָ/אֵלֶּה֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם בָּנִ֥ים וְ/אִם בָּנ֖וֹת יַצִּ֑ילוּ הֵ֤מָּה לְ/בַדָּ/ם֙ יִנָּצֵ֔לוּ וְ/הָ/אָ֖רֶץ תִּהְיֶ֥ה שְׁמָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/016.yaml
  text: Even if these three men were in its midst[a], as I live, declares the Lord GOD, they would deliver neither sons nor daughters; they alone would be delivered, and the land would become a desolation.
  footnotes:
  - marker: a
    text: 'Hebrew: ''if sons and if daughters they would deliver''—an idiom in this oath context meaning they would deliver neither sons nor daughters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 세 사람이 그 가운데에 있다 하더라도, 내가 살아 있음을 두고 맹세합니다. 주 야훼의 말씀입니다. 그들은 아들이나 딸들을 아무도 구해 내지 못하고[a], 그들만 구출될 것이며, 땅은 황폐해질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘아들들이면, 또 딸들이면 그들이 구해 낼 것이다’라는 형태이지만, 맹세 문맥에서는 가능성을 전면 부정하는 관용적 표현입니다. 따라서 ‘아들이나 딸들을 아무도 구해 내지 못할 것이다’라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  english_pob_choice: these three men
  chosen_korean: 이 세 사람
  alternatives_korean:
  - 이 세 남자
  - 이 세 사람들
  lexicon: HALOT
  rationale: 히브리어 אֲנָשִׁים의 성별이 드러나는 경우이므로 ‘사람’보다 더 직접적인 ‘세 사람’을 쓰되, 한국어에서 부자연스러운 성별 중복은 피했습니다.
- source_word: בְּתוֹכָהּ
  english_pob_choice: in its midst
  chosen_korean: 그 가운데에
  alternatives_korean:
  - 그 안에
  - 한가운데에
  lexicon: HALOT
  rationale: 심판받는 대상의 내부에 있음이라는 관용적 의미를 살려 ‘그 가운데에’로 옮겼습니다.
- source_word: אִם בָּנִים וְאִם בָּנוֹת יַצִּילוּ
  english_pob_choice: they would deliver neither sons nor daughters
  chosen_korean: 아들들이나 딸들을 구해 내지 못할 것이며
  alternatives_korean:
  - 아들들이나 딸들을 구원하지 못할 것이며
  - 아들이든 딸이든 구해 내지 못할 것이며
  lexicon: HALOT
  rationale: 이 구문은 서원/맹세 맥락의 관용법으로 가능성을 부정하므로, 직역적 조건문보다 ‘~하지 못할 것’으로 자연스럽게 반영했습니다.
- source_word: הֵמָּה לְבַדָּם יִנָּצֵלוּ
  english_pob_choice: they alone would be delivered
  chosen_korean: 그들만 구원을 받을 것이고
  alternatives_korean:
  - 그들만 구해질 것이고
  - 오직 그들만 살아남을 것이고
  lexicon: HALOT
  rationale: Niphal יִנָּצֵלוּ의 수동성을 살리되, 예언 심판 문맥에서 ‘구원을 받다’가 가장 직접적인 대응이어서 택했습니다.
- source_word: שְׁמָמָה
  english_pob_choice: a desolation
  chosen_korean: 황폐하게
  alternatives_korean:
  - 황무지처럼
  - 폐허가 되어
  lexicon: HALOT
  rationale: 명사형 ‘황폐’를 결과 상태로 자연스럽게 풀어 ‘황폐하게 되다’로 옮겨, 단순 형용사보다 결과적 종결을 드러냈습니다.
theological_decisions:
- issue: יְהוָה in the divine oath formula
  chosen_reading: 주 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신명기적 언약명 יְהוָה를 한국어 프로젝트 기본값인 ‘야훼’로 보존하고, אֲדֹנָי와 결합된 호칭은 ‘주 야훼’로 자연스럽게 처리했습니다.
  doctrine_reference: 'POB contested terms: YHWH → 야훼'
- issue: 대표적 의인의 구원이 자녀에게 미치지 않는다는 긴장
  chosen_reading: 그들만 구원을 받을 것이고
  alternative_readings:
  - 자녀들도 함께 구원받을 것
  - 그들의 가족까지 구원받을 것
  rationale: 본문은 개인적 의로움의 대표성 한계를 강조하므로, 자녀까지 포함시키는 완화 해석을 피하고 원문의 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
