  source_fidelity: 핵심 의미는 대체로 정확합니다. 다만 히브리어의 맹세 공식(חַי־אָנִי)과 그에 따르는 예언자적 선언을 더 자연스럽고 일관되게 반영할 필요가 있습니다. 또한 ‘아들들이나 딸들을’은 한국어에서 ‘어느 한쪽’을 뜻하는 일반적 선택 표현으로도 읽힐 수 있으므로, 원문의 강한 전면 부정(‘아들도 딸도’)을 ‘아무도’로 명시하는 편이 안전합니다.
  naturalness: 초안은 한 절 안에서 ‘말한다/말씀이다’와 ‘것입니다’가 섞여 있어 현대 합쇼체 문체가 일관되지 않습니다. ‘황폐하게 되다’보다 ‘황폐해지다’가 자연스럽고, 수동태인 יִנָּצֵלוּ는 ‘구출될 것이다’가 문맥상 더 직접적입니다.
  terminology: ‘주 야훼’는 אֲדֹנָי יְהוִה를 반영하는 프로젝트 용어 정책과 부합합니다. 다만 ‘구원을 받을’은 구원론적 의미를 넓게 연상시킬 수 있으므로, 현세적 심판에서의 구조를 가리키는 נצל의 문맥에는 ‘구출되다’를 권합니다.
  issues:
