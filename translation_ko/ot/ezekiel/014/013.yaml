  text: בֶּן אָדָ֗ם אֶ֚רֶץ כִּ֤י תֶחֱטָא לִ/י֙ לִ/מְעָל מַ֔עַל וְ/נָטִ֤יתִי יָדִ/י֙ עָלֶ֔י/הָ וְ/שָׁבַ֥רְתִּי לָ֖/הּ מַטֵּה לָ֑חֶם וְ/הִשְׁלַחְתִּי בָ֣/הּ רָעָ֔ב וְ/הִכְרַתִּ֥י מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/013.yaml
  text: Son of man[a], if a land sins against me by acting unfaithfully, and I stretch out my hand against it and break its supply of bread, and send famine upon it, and cut off from it man and beast[b],
  footnotes:
  - marker: a
    text: Literally, 'break its staff of bread,' a Hebrew idiom for cutting off the food supply.
    reason: lexical_alternative
  - marker: b
    text: Or 'people and animals.' The Hebrew reads 'man and beast,' a standard expression for all living inhabitants, human and animal alike.
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 어떤 땅이 나에게 죄를 지어 크게 배신하면, 내가 그 땅을 향해 내 손을 뻗어 그 양식의 공급을 끊고[a], 그 땅에 기근을 보내며, 그곳에서 사람과 짐승을 끊어 버리겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 땅의 떡의 지팡이를 꺾다’입니다. 이는 양식의 공급을 끊는다는 히브리어 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘사람과 짐승’이며, 사람과 동물을 함께 가리키는 관용적 표현입니다.
    reason: lexical_alternative
