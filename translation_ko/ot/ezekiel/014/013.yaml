  chosen_reading: 본문에는 직역 이미지를 살리고, 본문 해설 없이도 관용구의 강도를 드러내는 방향으로 유지했습니다.
  alternative_readings:
  - 양식 공급
  - 식량 공급
  rationale: 시적·예언적 심판 이미지의 날카로움을 약화시키지 않기 위해, 본문은 문자적 표지를 유지하고 독자가 의미를 추론할 수 있게 했습니다.
