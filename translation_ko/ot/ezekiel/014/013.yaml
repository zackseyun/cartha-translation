  text: בֶּן אָדָ֗ם אֶ֚רֶץ כִּ֤י תֶחֱטָא לִ/י֙ לִ/מְעָל מַ֔עַל וְ/נָטִ֤יתִי יָדִ/י֙ עָלֶ֔י/הָ וְ/שָׁבַ֥רְתִּי לָ֖/הּ מַטֵּה לָ֑חֶם וְ/הִשְׁלַחְתִּי בָ֣/הּ רָעָ֔ב וְ/הִכְרַתִּ֥י מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/013.yaml
  text: Son of man[a], if a land sins against me by acting unfaithfully, and I stretch out my hand against it and break its supply of bread, and send famine upon it, and cut off from it man and beast[b],
  footnotes:
  - marker: a
    text: Literally, 'break its staff of bread,' a Hebrew idiom for cutting off the food supply.
    reason: lexical_alternative
  - marker: b
    text: Or 'people and animals.' The Hebrew reads 'man and beast,' a standard expression for all living inhabitants, human and animal alike.
    reason: lexical_alternative
translation:
  language: ko
  text: 인자야, 만일 한 땅이 나에게 신실하지 않게 죄를 짓고 배반하여 내가 내 손을 그 위에 펴서 그 떡의 지팡이를 부러뜨리고, 기근을 그 땅에 보내며, 사람과 짐승을 그 가운데서 끊어 버린다면…[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 떡의 지팡이를 꺾다’로, 곧 식량 공급을 끊는다는 히브리 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘사람과 짐승’이지만, 사람과 동물을 아우르는 총칭입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔의 고정된 예언자 호칭을 살리면서, 직설적 부름의 형태와 문어체 어감을 함께 유지하는 표현으로 옮겼습니다.
- source_word: תֶחֱטָא לִי / לִמְעָל מַעַל
  english_pob_choice: sins against me by acting unfaithfully
  chosen_korean: 나에게 신실하지 않게 죄를 짓고 배반하여
  alternatives_korean:
  - 나에게 죄를 짓고 신실하지 않게 행하여
  - 나를 거슬러 죄를 짓고 언약을 배반하여
  lexicon: HALOT
  rationale: 단순한 일반 죄보다 언약적 불성실과 배반의 중첩을 드러내기 위해 '신실하지 않게'와 '배반하여'를 함께 살렸습니다.
- source_word: מַטֵּה לָחֶם
  english_pob_choice: its supply of bread
  chosen_korean: 그 떡의 지팡이
  alternatives_korean:
  - 그 빵의 공급
  - 그 양식의 지팡이
  lexicon: HALOT
  rationale: 본문의 관용구를 직역해 이미지와 긴장을 보존했습니다. 의미는 문맥상 양식 공급이지만, 본문 자체의 비유를 먼저 드러내기 위해 literal한 표현을 택했습니다.
- source_word: וְהִשְׁלַחְתִּי בָהּ רָעָב
  english_pob_choice: and send famine upon it
  chosen_korean: 기근을 그 땅에 보내며
  alternatives_korean:
  - 기근을 그 위에 보내며
  - 기근을 그 가운데 보내며
  lexicon: HALOT
  rationale: בָּהּ의 방향성을 자연스러운 한국어로 옮겨, 심판으로서의 기근이 그 땅에 임하는 뜻을 분명히 했습니다.
- source_word: אָדָם וּבְהֵמָה
  english_pob_choice: man and beast
  chosen_korean: 사람과 짐승
  alternatives_korean:
  - 사람과 가축
  - 인간과 짐승
  lexicon: HALOT
  rationale: 히브리어의 관용적 총칭을 한국어의 자연스러운 병렬로 살리되, 남성 단수로 좁히지 않도록 '사람'을 택했습니다.
theological_decisions:
