id: EZK.14.15
reference: Ezekiel 14:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֽוּ חַיָּ֥ה רָעָ֛ה אַעֲבִ֥יר בָּ/אָ֖רֶץ וְ/שִׁכְּלָ֑תָּ/ה וְ/הָיְתָ֤ה שְׁמָמָה֙ מִ/בְּלִ֣י עוֹבֵ֔ר מִ/פְּנֵ֖י הַ/חַיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/015.yaml
  text: If I cause dangerous wild animals to pass through the land[a], and they bereave it, and it becomes a desolation, without anyone passing through because of the animals[b],
  footnotes:
  - marker: a
    text: Or 'wild beasts'; literally 'a bad/evil animal,' a collective expression for dangerous wild animals.
    reason: lexical_alternative
  - marker: b
    text: Or 'and they make it childless.' The Hebrew personifies the land as bereaved of its inhabitants.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 악한 짐승들을 땅에 지나가게 하여 그것들이 그 땅을 자식을 잃게 하고, 그 땅이 황무지가 되어 짐승들 때문에 아무도 지나가지 못하게 한다면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘나쁜/악한 짐승’이며, 위험한 들짐승을 가리키는 집합적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 땅을 의인화하여, 거민들을 잃어 ‘자식을 잃은’ 상태가 된 것으로 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֽוּ
  english_pob_choice: If
  chosen_korean: 만약 … 한다면
  alternatives_korean:
  - 만일 … 한다면
  - …한다면
  lexicon: HALOT
  rationale: 가정적 심판 선언의 조건을 자연스럽게 드러내는 표준적인 조건형으로 옮겼습니다.
- source_word: חַיָּה רָעָה
  english_pob_choice: dangerous wild animals
  chosen_korean: 악한 짐승들
  alternatives_korean:
  - 위험한 들짐승들
  - 야생의 짐승들
  lexicon: HALOT
  rationale: 직역적으로는 ‘나쁜/해로운 짐승’이므로, 현대 한국어에서는 위협성을 살린 ‘악한 짐승들’이 원문의 집합적 의미를 가장 간결하게 드러냅니다.
- source_word: וְשִׁכְּלָתָּהּ
  english_pob_choice: and they bereave it
  chosen_korean: 그것들이 그 땅을 자식을 잃게 하고
  alternatives_korean:
  - 그것들이 그 땅을 유산하게 하고
  - 그것들이 그 땅을 황폐하게 하고
  lexicon: HALOT
  rationale: 동사가 본래 ‘자식을 잃다/빼앗기다’의 의미이므로, 땅을 의인화한 표현을 살려 ‘자식을 잃게 하다’로 옮겼습니다.
- source_word: וְהָיְתָה שְׁמָמָה
  english_pob_choice: and it becomes a desolation
  chosen_korean: 그 땅이 황무지가 되어
  alternatives_korean:
  - 그 땅이 황폐하게 되어
  - 그 땅이 황폐가 되어
  lexicon: HALOT
  rationale: 예언서의 재앙 공식에 자주 쓰이는 ‘desolation’의 감각을 살리되, 한국어에서는 ‘황무지’가 가장 자연스럽고 구체적입니다.
- source_word: מִבְּלִי עוֹבֵר
  english_pob_choice: without anyone passing through
  chosen_korean: 아무도 지나가지 못하게 한다면
  alternatives_korean:
  - 지나는 사람이 없게 하고
  - 지나가는 이 없이
  lexicon: HALOT
  rationale: 결과적으로 통행이 끊긴 상태를 한국어 자연문으로 압축해 표현했습니다.
theological_decisions:
- issue: 하나님의 직접적 심판 행위
  chosen_reading: 하나님이 악한 짐승들을 ‘땅에 지나가게 하여’ 심판을 집행하시는 것으로 직설적으로 옮겼습니다.
  alternative_readings:
  - 하나님이 짐승들을 보내어
  - 하나님이 짐승들을 허용하여
  rationale: 히필형이 나타내는 적극적 원인 제공을 약화시키지 않고, 본문의 심판 주권을 그대로 드러내기 위함입니다.
  doctrine_reference: Translation philosophy §1, §3
