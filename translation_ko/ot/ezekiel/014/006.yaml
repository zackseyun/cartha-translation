source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֶל בֵּ֣ית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה שׁ֣וּבוּ וְ/הָשִׁ֔יבוּ מֵ/עַ֖ל גִּלּֽוּלֵי/כֶ֑ם וּ/מֵ/עַ֥ל כָּל תּוֹעֲבֹתֵי/כֶ֖ם הָשִׁ֥יבוּ פְנֵי/כֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/006.yaml
  text: 'Therefore say to the house of Israel[a], ‘Thus says the Lord GOD: Turn back, and turn away from your idols[b], and turn your faces away from all your abominations.’'
  footnotes:
  - marker: a
    text: Or 'Repent, and turn away from your idols.' The Hebrew verb שׁוּב can carry the sense of returning or repenting.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Lord GOD' represents אֲדֹנָי יְהוִה, combining the title 'Lord' with the divine name YHWH.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 이스라엘 집에 말하십시오. “주 야훼께서 이렇게 말씀하십니다. 돌아오고, 너희의 우상들에서 돌아서며, 너희의 모든 가증한 것들에서 너희 얼굴을 돌리십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שׁוּב는 돌아오다, 돌아서다, 또는 회개하다는 뜻으로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 תּוֹעֲבֹתֵיכֶם은 문자적으로는 ‘너희의 가증한 것들’이며, 우상숭배와 그에 속한 모든 혐오스러운 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 그러니
  lexicon: HALOT
  rationale: 앞 문맥의 논리를 받는 추론 접속사이므로, 원문의 결론 제시를 자연스럽게 드러내는 ‘그러므로’가 적절합니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘의 집
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 언약적·공동체적 호칭인 ‘house of Israel’을 직역에 가깝게 살려, 단순한 민족 지칭으로 약화하지 않았습니다.
- source_word: שׁוּבוּ וְהָשִׁיבוּ
  english_pob_choice: Turn back, and turn away
  chosen_korean: 돌아오고 … 돌아서며
  alternatives_korean:
  - 회개하고 … 떠나며
  - 돌이키고 … 끊어내며
  lexicon: HALOT
  rationale: שׁוּב의 회개/귀환 뉘앙스를 살리되, 두 번째 히필형의 분리·철거 의미를 한국어 동사 ‘돌아서다’로 표현해 반복을 피하면서 원문의 동작성을 유지했습니다.
- source_word: גִּלּוּלֵיכֶם
  english_pob_choice: your idols
  chosen_korean: 너희의 우상들
  alternatives_korean:
  - 너희의 우상
  - 너희의 더러운 우상들
  lexicon: HALOT
  rationale: 경멸적 뉘앙스가 있는 용어지만, 본문 문맥의 기본 의미는 ‘우상’이므로 과도한 확대 없이 복수형을 반영했습니다.
- source_word: תּוֹעֲבֹתֵיכֶם
  english_pob_choice: your abominations
  chosen_korean: 너희의 모든 가증한 것들
  alternatives_korean:
  - 너희의 모든 혐오스러운 것들
  - 너희의 모든 가증한 행위들
  lexicon: HALOT
  rationale: ‘가증한 것들’은 예언서의 강한 도덕·종교적 혐오 표현을 유지하며, 문맥상 대상이 행위와 우상숭배를 함께 포괄할 수 있어 중립적으로 살렸습니다.
theological_decisions:
- issue: אֲדֹנָי יְהוִה의 한국어 처리
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 원문의 결합형 호칭을 분리해 주권 칭호 ‘주’와 고유신명 ‘야훼’를 함께 살렸습니다. 이는 전통적 ‘주 여호와’보다 원어 표지와 구분성이 분명합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה / YHWH → 야훼'
