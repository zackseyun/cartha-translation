  lexicon: HALOT
  rationale: 표준적인 언약 공식이므로 한국어에서도 익숙한 대응형을 유지하되, 목적절의 흐름에 맞게 미래형으로 정리했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
