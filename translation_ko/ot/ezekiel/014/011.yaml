  lexicon: HALOT
  rationale: 직역인 ‘뒤를 따라가다’의 이미지를 살리되, 한국어에서는 관계적 불성실을 드러내는 ‘나를 떠나 방황하다’가 더 자연스럽고 원문의 방향성을 유지합니다.
- source_word: יִטַּמְּאוּ בְּכָל פִּשְׁעֵיהֶם
  english_pob_choice: defile themselves with all their transgressions
  chosen_korean: 자기들의 모든 반역으로 더 이상 자신을 더럽히지
  alternatives_korean:
  - 모든 범죄로 스스로를 더럽히지
