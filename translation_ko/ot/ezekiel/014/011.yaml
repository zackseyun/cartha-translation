  lexicon: HALOT
  rationale: פשע의 반역성은 단순한 ‘허물’보다 ‘반역’이 더 강하게 드러내며, 오염의 자기책임성은 ‘자신을 더럽히다’로 표현했습니다.
- source_word: לִי לְעָם ... לָהֶם לֵאלֹהִים
  english_pob_choice: be my people ... be their God
  chosen_korean: 내 백성이 되고, 나는 그들의 하나님이 될 것입니다
  alternatives_korean:
  - 내 백성이 되며, 나는 그들의 하나님이 되겠습니다
  - 내 백성으로 있고, 나는 그들의 하나님으로 있을 것입니다
  lexicon: HALOT
  rationale: 표준적인 언약 공식이므로 한국어에서도 익숙한 대응형을 유지하되, 목적절의 흐름에 맞게 미래형으로 정리했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
