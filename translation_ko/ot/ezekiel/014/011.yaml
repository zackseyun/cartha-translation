  - …하도록
  lexicon: HALOT
  rationale: 목적·결과를 나타내는 לְמַעַן의 기능을 한국어의 목적 종결로 자연스럽게 살렸습니다.
- source_word: יִתְעוּ / מֵאַחֲרַי
