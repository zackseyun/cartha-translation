base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/011.yaml
  text: so that the house of Israel may no longer go astray from me[a], and may no longer defile themselves with all their transgressions, but may be my people, and I may be their God, declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'go astray from me.' The Hebrew literally says 'wander from after me,' an idiom for turning away from following the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 집이 더 이상 나를 떠나 방황하지 않고, 자기들의 모든 반역으로 더 이상 자신을 더럽히지 않게 하려는 것입니다. 그러면 그들은 내 백성이 되고, 나는 그들의 하나님이 될 것입니다. 주 하나님이 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 뒤에서부터 떠나다’라는 뜻으로, 언약적 충성을 저버리고 야훼를 따르지 않음을 가리키는 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: so that
  chosen_korean: …하려는 것입니다
  alternatives_korean:
