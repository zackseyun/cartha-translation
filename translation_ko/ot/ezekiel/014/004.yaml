  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 אֲדֹנָי יְהוִה의 신명 YHWH는 본문 후반의 ‘야훼’와 일관되게 ‘주 야훼’로 옮기는 것이 더 직접적입니다. 또한 בָהּ가 포함된 마지막 절은 문법적으로 난해하므로 ‘수많은 우상에 따라’라는 문맥적 번역을 유지하되, 주석을 해당 절에 정확히 연결해야 합니다.
  naturalness: ‘이스라엘 집의 누구든지’, ‘마음속에 우상들을 끌어올리고’, ‘자기 눈앞에 놓고’는 현대 표준 한국어에서 자연스러우면서 원문의 비유와 구체성을 보존합니다. ‘말하여 그들에게 이르십시오’는 히브리어의 동사 병렬을 지나치게 중복하지 않고 반영합니다.
  terminology: ‘주 야훼’는 אֲדֹנָי יְהוִה를, ‘나 야훼가’는 אֲנִי יְהוָה의 강조를 일관되게 반영합니다. ‘죄악의 걸림돌’과 ‘예언자’는 적절합니다.
