  rationale: 앞선 문맥과의 논리적 연결을 분명히 하면서도 예언 문맥의 격식을 유지합니다.
- source_word: אִישׁ אִישׁ מִבֵּית יִשְׂרָאֵל
  english_pob_choice: Any man of the house of Israel
  chosen_korean: 이스라엘 집안의 어떤 사람이든
  alternatives_korean:
  - 이스라엘 집의 어느 남자든
  - 이스라엘 집안의 누구든
  lexicon: HALOT
  rationale: 분배적 반복의 뜻을 살리되, 현대 한국어에서 자연스럽고 과도하게 남성만 지시하지 않도록 대표성을 유지했습니다.
- source_word: יַעֲלֶה אֶת גִּלּוּלָיו אֶל לִבּוֹ
  english_pob_choice: brings up his idols into his heart
  chosen_korean: 자기의 우상들을 자기 마음에 들여 올리고
  alternatives_korean:
  - 자기의 우상들을 자기 마음으로 끌어올리고
  - 자기의 우상들을 마음에 품고
  lexicon: HALOT
  rationale: עלה의 ‘올리다’ 이미지를 유지해, 우상을 내면에 세우는 강한 비유를 가급적 직접적으로 드러냈습니다.
- source_word: וּמִכְשׁוֹל עֲוֺנוֹ
  english_pob_choice: the stumbling block of his iniquity
  chosen_korean: 자기 죄악의 걸림돌
  alternatives_korean:
  - 자기 죄의 걸림돌
  - 자기 악행의 걸림돌
  lexicon: HALOT
  rationale: מִכְשׁוֹל의 ‘걸림돌’ 은유를 살리고, עָוֹן을 ‘죄악’으로 옮겨 책임과 왜곡된 상태를 함께 드러냈습니다.
- source_word: אֲנִי יְהוָה
  english_pob_choice: I, Yahweh
  chosen_korean: 나 야훼가
  alternatives_korean:
  - 나, 야훼가
  - 내가 야훼입니다
  lexicon: HALOT
  rationale: 직접적인 신적 자기선언을 살리기 위해 이름을 보존했고, 응답의 주체를 강조하는 어순을 유지했습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 아도나이-예호와 결합형의 처리
  chosen_reading: 주 하나님 / 야훼
  alternative_readings:
  - 주 여호와
  - 주 하나님 야훼
  - 여호와 하나님
  rationale: 본문의 אֲדֹנָי יְהוִה는 호칭과 신명 결합형이므로, 전반부는 ‘주 하나님’으로 옮기고 후반부의 신명은 ‘야훼’로 보존해 두 층위를 모두 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 나עניתי לו בּה בּרב גּלּוליו의 응답 의미
  chosen_reading: 그의 많은 우상에 따라 그에게 응답하겠습니다
  alternative_readings:
  - 그의 많은 우상대로 그에게 응답하겠습니다
  - 그의 많은 우상으로 그에게 응답하겠습니다
  - 그의 많은 우상과 관련하여 그에게 응답하겠습니다
  rationale: 난해한 בָּהּ를 한국어의 자연스러운 ‘따라’로 풀어, 하나님이 그 사람의 우상숭배에 상응하는 방식으로 판결하신다는 문맥적 의미를 보존했습니다.
  doctrine_reference: POB source audit note on difficult clause
