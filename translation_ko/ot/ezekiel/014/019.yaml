  chosen_korean: 끊어 버릴
  alternatives_korean:
  - 잘라 없앨
  - 도려내 버릴
  - 제거할
  lexicon: HALOT
  rationale: 언약적 심판의 ‘끊어 버리다’는 뉘앙스를 살리면서, 뒤의 ‘사람과 짐승’에 걸리는 총체적 멸절의 의미를 자연스럽게 드러냅니다.
theological_decisions:
- issue: 오히려/만일의 조건 구조와 심판 선언의 톤
  chosen_reading: ‘또 내가 … 할 수도 있습니다’로 이어지는 가정적 경고문으로 처리했습니다.
  alternative_readings:
  - ‘또는 내가 … 보내면’
  - ‘만일 내가 … 보내면’
  rationale: 히브리어의 연속된 심판 가정문을 한국어에서 지나치게 딱딱하게 누르지 않으면서도, 하나님의 주권적 심판 가능성을 분명히 보존합니다.
  doctrine_reference: Ezekiel 14장의 반복적 심판 선언 구조
- issue: ‘사람과 짐승’의 포괄적 파괴 표현
  chosen_reading: ‘사람과 짐승’을 그대로 유지했습니다.
  alternative_readings:
  - ‘인류와 가축’
  - ‘사람들과 동물들’
  rationale: 히브리어의 관용적 총체 심판 공식을 보존해, 인간과 동물 생명의 전면적 절멸이라는 강한 예언적 효과를 유지합니다.
  doctrine_reference: 히브리어 예언 문체의 관용구
