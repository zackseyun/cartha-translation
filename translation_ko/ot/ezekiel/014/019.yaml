  text: 또 내가 그 땅에 전염병을 보내고, 피로[a] 그 위에 내 진노를 쏟아부어 그 땅에서 사람과 짐승을 끊어 버린다면,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘피 안에서’입니다. 또는 ‘피 흘림으로’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
