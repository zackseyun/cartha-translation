base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/019.yaml
  text: Or if I send a plague against that land and pour out my wrath on it with blood[a], to cut off from it man and beast,
  footnotes:
  - marker: a
    text: Or 'by bloodshed.' The Hebrew reads literally 'in blood.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 내가 그 땅에 전염병을 보내고 그 위에 내 진노를 피와 함께 쏟아부어, 거기서 사람과 짐승을 끊어 버릴 수도 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘피 안에서/피 가운데’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  english_pob_choice: Or if
  chosen_korean: 또 내가 … 할 수도 있습니다
  alternatives_korean:
  - 또는
  - 만일
  lexicon: HALOT
  rationale: 이 절은 앞선 심판 경우들과 병렬되는 가정적 선택을 이어 가므로, 한국어에서는 조건의 반복을 자연스럽게 살려 주는 ‘또 … 할 수도 있습니다’가 적합합니다.
- source_word: דֶּבֶר
  english_pob_choice: plague
  chosen_korean: 전염병
  alternatives_korean:
  - 역병
  - 페스트
  - 질병
  lexicon: HALOT
  rationale: 심판으로 보내지는 전염성 재앙의 뜻을 살리면서 현대 독자가 바로 이해할 수 있는 표현으로 옮겼습니다.
- source_word: בְּדָם
  english_pob_choice: in blood
  chosen_korean: 피와 함께
  alternatives_korean:
  - 피로
  - 피 가운데
  - 피 속에
  lexicon: HALOT
  rationale: 히브리어의 간결한 전치사구를 그대로 살리되, 한국어에서는 ‘피와 함께’가 혈사(血殺)와 함께 쏟아지는 심판의 이미지를 가장 자연스럽게 전달합니다.
- source_word: לְהַכְרִית
  english_pob_choice: to cut off
  chosen_korean: 끊어 버릴
  alternatives_korean:
  - 잘라 없앨
  - 도려내 버릴
  - 제거할
  lexicon: HALOT
  rationale: 언약적 심판의 ‘끊어 버리다’는 뉘앙스를 살리면서, 뒤의 ‘사람과 짐승’에 걸리는 총체적 멸절의 의미를 자연스럽게 드러냅니다.
theological_decisions:
- issue: 오히려/만일의 조건 구조와 심판 선언의 톤
  chosen_reading: ‘또 내가 … 할 수도 있습니다’로 이어지는 가정적 경고문으로 처리했습니다.
  alternative_readings:
  - ‘또는 내가 … 보내면’
  - ‘만일 내가 … 보내면’
  rationale: 히브리어의 연속된 심판 가정문을 한국어에서 지나치게 딱딱하게 누르지 않으면서도, 하나님의 주권적 심판 가능성을 분명히 보존합니다.
  doctrine_reference: Ezekiel 14장의 반복적 심판 선언 구조
- issue: ‘사람과 짐승’의 포괄적 파괴 표현
  chosen_reading: ‘사람과 짐승’을 그대로 유지했습니다.
  alternative_readings:
  - ‘인류와 가축’
  - ‘사람들과 동물들’
  rationale: 히브리어의 관용적 총체 심판 공식을 보존해, 인간과 동물 생명의 전면적 절멸이라는 강한 예언적 효과를 유지합니다.
  doctrine_reference: 히브리어 예언 문체의 관용구
