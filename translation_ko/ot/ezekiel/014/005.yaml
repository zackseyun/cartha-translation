    text: “그들의 마음속에서”는 히브리어 בְּלִבָּם의 난해한 용법을 반영한 것입니다. “그들의 마음을 통하여” 또는 “그들의 마음으로”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
