  yaml_path: translation/ot/ezekiel/014/005.yaml
  text: so that I may seize the house of Israel by their heart[b][a], because all of them have turned away from me through their idols.
  footnotes:
  - marker: a
    text: Or, “in their heart” or “through their heart.” The Hebrew expression is difficult and may indicate the sphere or means by which the LORD takes hold of Israel.
    reason: lexical_alternative
  - marker: b
    text: Or, “have become estranged from me by their idols.”
    reason: alternative_reading
translation:
  language: ko
  text: 내가 그들의 마음으로 이스라엘 집을 붙잡으려는 것은, 그들 모두가 그들의 우상들로 말미암아 내게서 돌아섰기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “그들의 마음으로”는 히브리어 בְּלִבָּם의 난해한 용법을 반영한 것으로, ‘그들의 마음 안에서’ 또는 ‘그들의 마음을 통하여’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “내게서 돌아섰기 때문입니다”는 ‘내게서 멀어졌기 때문입니다’ 또는 ‘내게서 소외되었기 때문입니다’로도 옮길 수 있습니다.
    reason: alternative_reading
