translation:
  language: ko
  text: 그때 이스라엘 장로들 중 몇 사람이 나에게 와서 내 앞에 앉았습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘이스라엘의 장로들 가운데서 온 사람들’이라는 뜻이 될 수 있습니다. 따라서 장로들 전체가 아니라 그들 가운데서 나온 사람들을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... אֲנָשִׁים
  english_pob_choice: Then some of the elders of Israel came to me
  chosen_korean: 그때 이스라엘의 장로들 가운데 일부가 나에게 와서
  alternatives_korean:
  - 그때 이스라엘의 장로들 가운데 사람들이 나에게 와서
  - 그때 이스라엘의 장로들 가운데 몇 사람이 나에게 와서
  lexicon: HALOT
  rationale: 히브리어의 ‘장로들 가운데’라는 출처성 표현을 살리되, 영어 POB의 해설처럼 전체 장로단이 아니라 그들 중 일부가 왔다는 뜻을 한국어로 자연스럽게 드러냈습니다.
- source_word: וַיֵּשְׁבוּ
  english_pob_choice: sat
  chosen_korean: 내 앞에 앉았습니다
  alternatives_korean:
  - 내 앞에 앉아 있었습니다
  - 내 앞에 자리를 잡았습니다
  lexicon: HALOT
  rationale: ישׁב의 기본 의미인 ‘앉다’를 직접 살려, 예언자 앞에서의 실제 자세를 간결하게 표현했습니다.
- source_word: לְפָנַי
  english_pob_choice: before me
  chosen_korean: 내 앞에
  alternatives_korean:
  - 내 앞에서
  - 내 존재 앞에
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 자연스러운 ‘내 앞에’로 옮겨, 단순한 위치가 아니라 대면/청중 관계를 유지했습니다.
