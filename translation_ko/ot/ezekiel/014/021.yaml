id: EZK.14.21
reference: Ezekiel 14:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר אֲדֹנָ֣/י יְהֹוִ֗ה אַ֣ף כִּֽי אַרְבַּ֣עַת שְׁפָטַ֣/י הָ/רָעִ֡ים חֶ֠רֶב וְ/רָעָ֞ב וְ/חַיָּ֤ה רָעָה֙ וָ/דֶ֔בֶר שִׁלַּ֖חְתִּי אֶל יְרוּשָׁלִָ֑ם לְ/הַכְרִ֥ית מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/021.yaml
  text: 'For thus says the Lord GOD: How much more when I send my four disastrous judgments against Jerusalem—sword and famine and wild beasts and plague—to cut off from it man and beast![a][b]'
  footnotes:
  - marker: a
    text: Or 'my four severe judgments.' The Hebrew adjective can mean 'bad,' 'harmful,' or 'disastrous' in this context.
    reason: lexical_alternative
  - marker: b
    text: Or 'pestilence' for 'plague.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 이렇게 말씀하셨습니다. "내가 예루살렘에 보내는 내 네 가지 심판이 얼마나 더 크겠느냐? 곧 칼과 기근과 들짐승과 전염병으로 그곳에서 사람과 짐승을 끊어 버리려는 것이다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 네 가지 엄한 심판’. 히브리어 형용사는 이 문맥에서 ‘악한’, ‘해로운’, ‘재앙적인’ 뜻을 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘전염병’ 대신 ‘역병’으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהֹוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 복합 호칭의 두 요소를 모두 살리면서, 본 프로젝트 기본어인 야훼를 사용해 신적 이름을 직접 드러냈습니다. 한국어에서 ‘주 야훼’는 ‘주 LORD’ 식의 중복을 피하면서도 두 호칭의 결합을 보존합니다.
- source_word: אַרְבַּעַת שְׁפָטַי הָרָעִים
  english_pob_choice: my four disastrous judgments
  chosen_korean: 내 네 가지 심판
  alternatives_korean:
  - 내 네 가지 재앙적인 심판
  - 내 네 가지 엄한 심판
  - 내 네 가지 심판들
  lexicon: HALOT
  rationale: שְׁפָטִים는 여기서 벌하는 행위/심판을 가리키므로 ‘심판’으로 옮겼고, הָרָעִים은 도덕적 악이 아니라 재앙적 성격을 나타내므로 과도한 해석 없이 문맥으로 반영했습니다.
- source_word: חַיָּה רָעָה
  english_pob_choice: wild beasts
  chosen_korean: 들짐승
  alternatives_korean:
  - 야생 동물
  - 사나운 짐승
  lexicon: HALOT
  rationale: 문맥상 사람과 짐승을 해치는 포식적 동물을 가리키므로, 자연스럽고 위협을 잘 전달하는 ‘들짐승’을 택했습니다.
- source_word: דֶבֶר
  english_pob_choice: plague
  chosen_korean: 전염병
  alternatives_korean:
  - 역병
  - 페스트
  lexicon: HALOT
  rationale: 예언서의 재앙 목록에서 현대 독자가 즉시 이해할 수 있는 표현으로 옮겼습니다. ‘역병’도 가능하지만 ‘전염병’이 더 직접적입니다.
- source_word: לְהַכְרִית
  english_pob_choice: to cut off
  chosen_korean: 끊어 버리려는 것이다
  alternatives_korean:
  - 잘라 내기 위해
  - 끊으려는 것이다
  - 멸하려는 것이다
  lexicon: HALOT
  rationale: 언약 심판의 관용구인 ‘cut off’를 살리되, 한국어에서 결과를 분명히 드러내는 ‘끊어 버리다’로 옮겨 단순한 파괴보다 단절·제거의 뉘앙스를 보존했습니다.
- source_word: אָדָם וּבְהֵמָה
  english_pob_choice: man and beast
  chosen_korean: 사람과 짐승
  alternatives_korean:
  - 인간과 짐승
  - 사람과 가축
  - 인간과 동물
  lexicon: HALOT
  rationale: 이 상투구는 인간과 동물을 함께 포괄하는 재앙의 범위를 나타내므로, 가장 자연스럽고 직접적인 ‘사람과 짐승’으로 옮겼습니다.
theological_decisions:
- issue: YHWH rendering in Ezekiel prophetic formula
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 본문의 יְהֹוִה는 야훼의 언약 이름을 직접 가리키므로, 본 프로젝트 기본 원칙에 따라 ‘야훼’를 유지했습니다. ‘주’는 아도나이를 반영하고 ‘야훼’는 고유명을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Register inside quoted divine speech
  chosen_reading: 직접 인용 안에서는 예언 선포체를 유지하되 한국어는 평서문 종결로 통일
  alternative_readings:
  - 명령형으로 강하게 처리
  - 더 예배문체적으로 높임
  rationale: 하나님의 발화는 예언적 선언이므로 현대 한국어의 공식적 평서체로 번역해 단호함을 살렸습니다. 불필요한 예배체화는 원문의 경고성을 약화시킬 수 있습니다.
  doctrine_reference: POB Korean style policy
