id: EZK.14.3
reference: Ezekiel 14:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֶּן אָדָ֗ם הָ/אֲנָשִׁ֤ים הָ/אֵ֨לֶּה֙ הֶעֱל֤וּ גִלּֽוּלֵי/הֶם֙ עַל לִבָּ֔/ם וּ/מִכְשׁ֣וֹל עֲוֺנָ֔/ם נָתְנ֖וּ נֹ֣כַח פְּנֵי/הֶ֑ם הַ/אִדָּרֹ֥שׁ אִדָּרֵ֖שׁ לָ/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/003.yaml
  text: Son of man[a], these men have set up their idols in their hearts and have placed the stumbling block of their iniquity before their faces[b]. Should I indeed let myself be consulted by them?
  footnotes:
  - marker: a
    text: Hebrew גִלּוּלִים is a strongly contemptuous term for idols.
    reason: lexical_alternative
  - marker: b
    text: Or 'Should I really be inquired of by them?' The Hebrew intensifies the question and implies a negative answer.
    reason: alternative_reading
translation:
  language: ko
  text: 인자야, 이 사람들은 자기의 우상들을 자기 마음에 세우고, 자기 죄악의 걸림돌을 자기 얼굴 앞에 두었습니다. 내가 과연 그들에게 내 뜻을 물어주겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람의 아들아
  - 인간아
  lexicon: HALOT
  rationale: 에스겔의 예언자 호칭은 책 전체의 관용구이므로, 현대 한국어에서도 직접적인 호명형인 ‘인자야’로 옮겨 문학적·전통적 기능을 유지했습니다.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  english_pob_choice: these men
  chosen_korean: 이 사람들은
  alternatives_korean:
  - 이 남자들은
  - 이들
  lexicon: HALOT
  rationale: 문맥상 남성 장로들을 가리키지만, 한국어에서는 공적 발화에서 ‘사람들’이 자연스럽고, 성별 정보를 과도하게 강조하지 않으면서도 지시 대상을 분명히 드러냅니다.
- source_word: גִלּוּלֵיהֶם
  english_pob_choice: their idols
  chosen_korean: 자기들의 우상들
  alternatives_korean:
  - 자기들의 우상
  - 그들의 우상들
  lexicon: HALOT
  rationale: 히브리어 גִלּוּלִים의 멸시적 뉘앙스는 본문에 ‘우상들’로 충분히 반영하고, 소유격을 명시해 내부 충성을 향한 예언적 비난을 살렸습니다.
- source_word: עַל לִבָּם
  english_pob_choice: in their hearts
  chosen_korean: 자기 마음에
  alternatives_korean:
  - 그들 마음속에
  - 그들의 심장에
  lexicon: HALOT
  rationale: ‘마음’은 히브리어 לֵב의 인지·의지 중심을 자연스럽게 살리며, 우상이 외적 형상이 아니라 내적 충성의 대상이 되었음을 드러냅니다.
- source_word: מִכְשׁוֹל עֲוֺנָם
  english_pob_choice: the stumbling block of their iniquity
  chosen_korean: 자기 죄악의 걸림돌
  alternatives_korean:
  - 자기 죄의 걸림돌
  - 자기 죄악의 장애물
  lexicon: HALOT
  rationale: מִכְשׁוֹל의 ‘넘어지게 하는 것’ 이미지를 한국어의 ‘걸림돌’로 살리고, עָוֹן은 도덕적 무게를 지닌 ‘죄악’으로 옮겨 예언자적 질감을 유지했습니다.
- source_word: הַאִדָּרֹשׁ אִדָּרֵשׁ לָהֶם
  english_pob_choice: Should I indeed let myself be consulted by them?
  chosen_korean: 내 뜻을 물어주겠습니까?
  alternatives_korean:
  - 내게 묻겠습니까?
  - 그들에게 내가 자문을 들어주겠습니까?
  lexicon: HALOT
  rationale: 히브리어의 ‘묻다/문의하다’와 신적 응답 맥락을 한국어 관용으로 압축하되, ‘과연’으로 강한 반문성을 살려 본문의 거절 뉘앙스를 드러냈습니다.
theological_decisions:
- issue: 신적 응답을 구하는 행위에 대한 수사적 거절의 강도
  chosen_reading: 반문형으로 옮겨 직접적인 ‘아니오’를 덧붙이지 않고, ‘과연’과 ‘-겠습니까?’로 거절의 뜻을 암시했습니다.
  alternative_readings:
  - ‘내가 결코 그들에게 물어주지 않겠습니다’처럼 명시적으로 번역
  - ‘내게 묻도록 하겠습니까?’처럼 더 직설적으로 번역
  rationale: 히브리어의 강한 강조형은 문맥상 부정적 대답을 기대하지만, 본문 자체의 수사적 형태를 보존하는 편이 원문의 긴장을 더 정확히 전달합니다.
  doctrine_reference: 원문의 수사적 긴장 보존; optimal-equivalence
