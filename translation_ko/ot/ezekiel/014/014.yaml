  - severity: medium
    issue: אֲדֹנָי יְהוִה를 ‘주 하나님’으로 처리함
    rationale: 이 표현에는 יהוה가 직접 쓰였으며, 제공된 POB 신명 결정은 이를 ‘Yahweh’로 옮기도록 합니다. 한국어에서는 ‘주 야훼’가 두 요소와 신명을 모두 드러냅니다.
