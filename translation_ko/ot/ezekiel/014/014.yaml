revisions:
- from: 그들 가운데에 이 세 사람이 — 노아, 다니엘, 욥 — 있다고 해도, 그들은 자기들의 의로 자기들만 건져낼 뿐이라고 주 하나님이 선언하십니다.[a]
  to: 그 땅 한가운데에 이 세 사람, 곧 노아와 다니엘과 욥이 있다고 해도, 그들은 자기들의 의로 그들 자신만 건져 낼 뿐입니다. 주 야훼께서 말씀하십니다.[a]
  rationale: ‘그 땅’을 보충하여 여성 단수 지시 대상과 문맥을 정확히 반영하고, 신명 יהוה는 POB 방침에 따라 ‘야훼’로 옮겼습니다. 조건절의 양보 의미와 세 의인의 개인적·배타적인 구출이라는 핵심은 유지했습니다. 다넬/다니엘의 논쟁적 식별은 본문에서 확정하지 않고 각주에 보존했습니다.
