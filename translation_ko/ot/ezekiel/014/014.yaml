  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/הָיוּ שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֤ים הָ/אֵ֨לֶּה֙ בְּ/תוֹכָ֔/הּ נֹ֖חַ דנאל וְ/אִיּ֑וֹב הֵ֤מָּה בְ/צִדְקָתָ/ם֙ יְנַצְּל֣וּ נַפְשָׁ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/014.yaml
  text: even if these three men were in its midst—Noah[a], Daniel, and Job—they would deliver only themselves by their righteousness, declares the Lord GOD.
  footnotes:
  - marker: a
    text: Hebrew דנאל may also be rendered 'Danel'; some understand this as the ancient Near Eastern figure Danel rather than the biblical Daniel.
    reason: alternative_reading
translation:
  language: ko
  text: 그들 가운데에 이 세 사람이 — 노아, 다니엘, 욥 — 있다고 해도, 그들은 자기들의 의로 자기들만 건져낼 뿐이라고 주 하나님이 선언하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דנאל은 ‘다넬’로도 옮길 수 있으며, 일부는 이를 성경의 다니엘보다 고대 근동의 인물 다넬로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיוּ
  english_pob_choice: even if ... were
  chosen_korean: 있다고 해도
  alternatives_korean:
  - 있다면
  - 있어도
  lexicon: HALOT
  rationale: 문맥상 심판 경고의 양보적 조건을 나타내므로, 단순한 과거형보다 '있다고 해도'가 영어 POB의 'even if'를 자연스럽게 반영합니다.
- source_word: בְּתוֹכָהּ
  english_pob_choice: in its midst
  chosen_korean: 그들 가운데에
  alternatives_korean:
  - 그 안에
  - 그 한가운데에
  lexicon: HALOT
  rationale: 여성 단수 대명사는 문맥상 심판받는 도시/땅을 가리키며, 한국어에서는 '그들 가운데에'가 위치감을 살리면서도 자연스럽습니다.
- source_word: בְצִדְקָתָם
  english_pob_choice: by their righteousness
  chosen_korean: 자기들의 의로
  alternatives_korean:
  - 그들의 의로
  - 그들의 의를 통해
  lexicon: HALOT
  rationale: צדקה는 여기서 개인의 의로움/의를 뜻하므로 '의'로 옮기고, 수단의 의미는 조사 '로'로 담았습니다.
- source_word: יְנַצְּלוּ נַפְשָׁם
  english_pob_choice: would deliver only themselves
  chosen_korean: 자기들만 건져낼 뿐
  alternatives_korean:
  - 자기들의 생명만 구할 뿐
  - 자기들만 구원할 뿐
  lexicon: HALOT
  rationale: נצל은 '건져내다/구해내다'의 뜻이므로 구원론적 뉘앙스가 강한 '구원하다'보다 '건져내다'가 더 직접적입니다. נֶפֶשׁ은 여기서 사람 자신을 가리키므로 '자기들만'으로 압축했습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님이 선언하십니다
  alternatives_korean:
  - 주 여호와께서 말씀하십니다
  - 주 하나님의 말씀입니다
  lexicon: HALOT
  rationale: נְאֻם은 예언문 공식이므로 '선언하십니다'가 적절합니다. 아도나이+יהוה의 결합은 한국어에서 전통적 '주 하나님'으로 옮겨 중복을 피했습니다.
- source_word: דנאל
  english_pob_choice: Daniel
  chosen_korean: 다니엘
  alternatives_korean:
  - 다넬
  lexicon: HALOT
  rationale: 히브리어 표기상 'Danel' 가능성이 있으나, 본문 차원에서 가장 자연스러운 한국어 성경 인명은 '다니엘'입니다. 대안 독법은 본문 주석 수준에서만 유지합니다.
theological_decisions:
- issue: 아도나이+יהוה 결합 호칭의 한국어 처리
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 본문의 예언자적 종결 공식을 현대 한국어 합쇼체로 자연스럽게 살리면서도, 두 호칭이 결합된 점을 과도하게 반복하지 않기 위해 '주 하나님'으로 번역했습니다.
  doctrine_reference: 'POB Korean style guideline: direct-source, publication-readable prophetic formula'
- issue: דנאל의 정체 가능성 보존
  chosen_reading: 다니엘
  alternative_readings:
  - 다넬
  rationale: 본문은 인물명 자체를 단정적으로 해설하기보다, 독자가 익숙한 성경 인명으로 읽게 하면서도 대안 독법 가능성은 본문 외부에서 보존하는 편이 더 투명합니다.
  doctrine_reference: 'Translation philosophy: preserve documented tension rather than prematurely resolving it'
