base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/020.yaml
  text: Even if Noah[a], Daniel, and Job were in it, as I live, declares the Lord GOD, they would deliver neither son nor daughter; by their righteousness they would deliver only themselves.
  footnotes:
  - marker: a
    text: Hebrew דנאל may also be read 'Danel,' possibly referring to an ancient righteous figure rather than the better-known Daniel.
    reason: alternative_reading
translation:
  language: ko
  text: 노아와 다니엘과 욥이 그 가운데 있다 할지라도, 내가 살아 있음을 두고 말하노니, 주 하나님이 말씀하십니다. 그들은 아들이든 딸이든 하나도 건져 내지 못할 것이며, 자기들의 의로 자기들만 건져 낼 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דנאל은 ‘다니엘’로도, 고대 의인 ‘다넬(Danel)’로도 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֹחַ דנאל וְאִיּוֹב בְּתוֹכָהּ
  english_pob_choice: Noah, Daniel, and Job were in it
  chosen_korean: 노아와 다니엘과 욥이 그 가운데 있다 할지라도
  alternatives_korean:
  - 노아와 다니엘과 욥이 그 안에 있다 할지라도
  - 노아와 다니엘과 욥이 그 한가운데 있다 할지라도
  lexicon: HALOT
  rationale: בְּתוֹכָהּ는 심판받는 대상 안/가운데를 가리키므로, 자연스러운 현대 한국어로 ‘그 가운데’라고 옮겨 위치감을 유지했습니다.
- source_word: חַי אָנִי נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: as I live, declares the Lord GOD
  chosen_korean: 내가 살아 있음을 두고 말하노니, 주 하나님이 말씀하십니다
  alternatives_korean:
  - 내가 살아 있음을 두고 맹세하노니, 주 하나님이 말씀하십니다
  - 내가 살아 있음을 두고 말하노니, 주 야훼가 말씀하십니다
  lexicon: HALOT
  rationale: 히브리어의 맹세 공식과 신탁 공식을 함께 살리되, 한국어 문장 흐름에 맞게 ‘말씀하십니다’로 정리했습니다. אֲדֹנָי יְהוִה는 본문 자리에 맞는 존칭 표현으로 ‘주 하나님’이 가장 자연스럽습니다.
- source_word: אִם בֵּן אִם בַּת יַצִּילוּ
  english_pob_choice: they would deliver neither son nor daughter
  chosen_korean: 그들은 아들이든 딸이든 하나도 건져 내지 못할 것이며
  alternatives_korean:
  - 그들은 아들이나 딸이나 건져 내지 못할 것이며
  - 그들은 아들이든 딸이든 구원하지 못할 것이며
  lexicon: HALOT
  rationale: אִם...אִם의 배타적 범위를 ‘아들이든 딸이든 하나도’로 옮겨, 예외 없는 부정을 분명히 했습니다. יַצִּילוּ는 심판 문맥의 ‘건져 내다’가 가장 적절합니다.
- source_word: בְצִדְקָתָם יַצִּילוּ נַפְשָׁם
  english_pob_choice: by their righteousness they would deliver only themselves
  chosen_korean: 자기들의 의로 자기들만 건져 낼 것입니다
  alternatives_korean:
  - 그들의 의로 그들 자신만 구해 낼 것입니다
  - 그들의 의로 자기 생명만 건져 낼 것입니다
  lexicon: HALOT
  rationale: בְ는 수단/근거의 뜻을 지니므로 ‘의로’가 간결하고 직접적입니다. נַפְשָׁם는 이 맥락에서 ‘생명’보다는 사람 자신을 가리키므로 ‘자기들만’으로 자연스럽게 살렸습니다.
theological_decisions:
- issue: אֲדֹנָי יְהוִה의 한국어 표기
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 본문은 신탁 공식 안에서 하나님의 절대적 주권을 강조하므로, 현대 한국어에서 가장 즉각적으로 이해되는 존칭 결합인 ‘주 하나님’을 사용했습니다. 이는 본문 의미를 흐리지 않으면서도 합쇼체 문맥에 맞습니다.
  doctrine_reference: POB naming convention for divine titles in Korean OT drafts
- issue: 노아·다니엘·욥의 의로움이 타인에게 미치지 못하는 제한성
  chosen_reading: 그들은 아들이든 딸이든 하나도 건져 내지 못할 것이며
  alternative_readings:
  - 그들은 아들이든 딸이든 구해 내지 못할 것이며
  - 그들은 아들이든 딸이든 살려 내지 못할 것이며
  rationale: 이 절은 의인의 공로가 공동체 전체를 자동으로 구하지 못한다는 제한을 강조합니다. ‘건져 내다’는 이런 심판 문맥의 제한성과 구출 이미지를 함께 유지합니다.
  doctrine_reference: Ezekiel judgment oracle context; preserve source-level tension about individual righteousness
