source:
  edition: WLC
  text: כִּי֩ אִ֨ישׁ אִ֜ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֗ל וּ/מֵ/הַ/גֵּר֮ אֲשֶׁר יָג֣וּר בְּ/יִשְׂרָאֵל֒ וְ/יִנָּזֵ֣ר מֵֽ/אַחֲרַ֗/י וְ/יַ֤עַל גִּלּוּלָי/ו֙ אֶל לִבּ֔/וֹ וּ/מִכְשׁ֣וֹל עֲוֺנ֔/וֹ יָשִׂ֖ים נֹ֣כַח פָּנָ֑י/ו וּ/בָ֤א אֶל הַ/נָּבִיא֙ לִ/דְרָשׁ ל֣/וֹ בִ֔/י אֲנִ֣י יְהוָ֔ה נַֽעֲנֶה לּ֖/וֹ בִּֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/007.yaml
  text: For any man from the house of Israel[a], or from the foreigner who sojourns in Israel, who separates himself from following me and brings up his idols into his heart, and sets the stumbling block of his iniquity before his face, and then comes to the prophet to inquire of me through him, I, Yahweh[d][c][b], will answer him myself.
  footnotes:
  - marker: a
    text: Or, 'each man' or 'anyone.' The Hebrew repeats 'man' for distributive emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''Foreigner who sojourns'' refers to a non-Israelite residing among Israel; traditionally, ''resident alien.'''
    reason: cultural_note
  - marker: c
    text: Hebrew literally, 'separates himself from after me,' that is, turns away from following the LORD.
    reason: lexical_alternative
  - marker: d
    text: Or, 'I, the LORD, will answer him by myself' / 'in my own person.' The Hebrew is compact and emphatic.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 집안의 어떤 사람이나 이스라엘에 머무는 나그네가 나를 따르는 데서 스스로 떨어져 나가고 자기 마음에 자기 우상들을 들여놓으며, 자기 죄악의 걸림돌을 자기 얼굴 앞에 놓고서, 예언자에게 와서 나를 두고 문의하면, 나, 야훼가 그에게 직접 대답하겠습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어떤 사람’은 반복된 ‘사람’의 분배적 의미를 살린 번역입니다.
    reason: alternative_reading
  - marker: b
    text: ‘나그네’는 이스라엘 가운데 거주하는 비이스라엘인을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: ‘나를 따르는 데서 스스로 떨어져 나가고’는 히브리어의 ‘내 뒤에서’라는 관용구를 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: d
    text: ‘그에게 직접 대답하겠습니다’는 ‘내가 친히/내 자신으로’라는 압축된 강조를 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  english_pob_choice: any man
  chosen_korean: 어떤 사람
  alternatives_korean:
  - 각 사람
  - 누구든지
  lexicon: HALOT
  rationale: 히브리어의 중복 표현은 분배적 의미를 가지므로, 성별을 과도하게 드러내지 않으면서도 개별 사례를 가리키는 한국어로 옮겼습니다.
- source_word: מִבֵּית יִשְׂרָאֵל
  english_pob_choice: from the house of Israel
  chosen_korean: 이스라엘 집안
  alternatives_korean:
  - 이스라엘의 집
  - 이스라엘에서
  lexicon: HALOT
  rationale: 언약적·공동체적 표현인 ‘house of Israel’을 한국어에서 자연스럽고도 구조를 보존하는 말로 옮겼습니다.
- source_word: הַגֵּר ... יָגוּר
  english_pob_choice: the foreigner who sojourns
  chosen_korean: 이스라엘에 머무는 나그네
  alternatives_korean:
  - 거주 외국인
  - 이스라엘 가운데 거류하는 외국인
  lexicon: HALOT
  rationale: גֵּר의 핵심은 이스라엘 안에 머무는 비이스라엘인이라는 점이므로, 현대 독자가 이해하기 쉬우면서도 체류·거주의 의미를 살렸습니다.
- source_word: וְיִנָּזֵר מֵאַחֲרַי
  english_pob_choice: who separates himself from following me
  chosen_korean: 나를 따르는 데서 스스로 떨어져 나가고
  alternatives_korean:
  - 나를 따르던 데서 스스로 분리되고
  - 나를 따라가는 데서 스스로 물러나고
  lexicon: HALOT
  rationale: ‘from after me’의 관용적 뜻을 살려, 단순한 거리두기보다 충성의 단절을 드러내도록 옮겼습니다.
- source_word: גִּלּוּלָיו
  english_pob_choice: his idols
  chosen_korean: 자기 우상들
  alternatives_korean:
  - 그의 우상들
  - 자기 우상
  lexicon: HALOT
  rationale: 복수형과 소유격을 반영해 ‘자기 우상들’로 옮겼고, 문맥상 내면화된 우상숭배의 이미지를 유지했습니다.
- source_word: מִכְשׁוֹל עֲוֺנוֹ
  english_pob_choice: the stumbling block of his iniquity
  chosen_korean: 자기 죄악의 걸림돌
  alternatives_korean:
  - 자기 죄의 걸림돌
  - 자기 불법의 장애물
  lexicon: HALOT
  rationale: Ezekiel의 반복되는 표현인 ‘stumbling block’을 그대로 살리되, עָוֹן은 문맥상 무게가 있는 ‘죄악’으로 옮겼습니다.
- source_word: אֲנִי יְהוָה
  english_pob_choice: I, Yahweh
  chosen_korean: 나, 야훼가
  alternatives_korean:
  - 나, 야훼께서
  - 내가, 야훼가
  lexicon: HALOT
  rationale: 고유명사 יְהוָה를 ‘야훼’로 유지하고, 서두의 강조를 한국어 어순으로 자연스럽게 드러냈습니다.
- source_word: נַעֲנֶה לוֹ בִּי
  english_pob_choice: will answer him myself
  chosen_korean: 그에게 직접 대답하겠습니다
  alternatives_korean:
  - 내가 친히 그에게 대답하겠습니다
  - 나 자신으로 그에게 대답하겠습니다
  lexicon: HALOT
  rationale: 히브리어의 압축적 강조를 ‘직접’으로 자연스럽게 풀어, 예언자를 통한 간접 응답이 아니라 야훼 자신이 답하신다는 점을 드러냈습니다.
theological_decisions:
- issue: YHWH divine name rendering
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 יְהוָה가 직접 나오므로 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약 이름의 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: Reflexive apostasy wording in וְיִנָּזֵר מֵאַחֲרַי
  chosen_reading: 나를 따르는 데서 스스로 떨어져 나가고
  alternative_readings:
  - 나에게서 스스로 멀어지고
  - 나를 버리고
  rationale: 단순한 거리감이 아니라 하나님을 따르는 관계를 의도적으로 끊는 행위를 나타내므로, 분리·이탈의 강도를 유지했습니다.
  doctrine_reference: Ezekiel covenant unfaithfulness motif
