  source_fidelity: 전반적으로 히브리어의 조건절 구조, 분배적 표현, 배교와 내면의 우상, 죄악의 걸림돌, 그리고 야훼 자신의 응답이라는 강조를 잘 반영합니다. 그러나 לִדְרָשׁ לוֹ בִי는 예언자에게 와서 그를 통하여 야훼께 묻는다는 관계를 나타내므로, ‘나를 두고 문의하면’보다 이를 명시하는 편이 충실합니다.
