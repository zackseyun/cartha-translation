id: EZK.14.22
reference: Ezekiel 14:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה נֽוֹתְרָה בָּ֜/הּ פְּלֵטָ֗ה הַֽ/מּוּצָאִים֮ בָּנִ֣ים וּ/בָנוֹת֒ הִנָּ/ם֙ יוֹצְאִ֣ים אֲלֵי/כֶ֔ם וּ/רְאִיתֶ֥ם אֶת דַּרְכָּ֖/ם וְ/אֶת עֲלִֽילוֹתָ֑/ם וְ/נִחַמְתֶּ֗ם עַל הָֽ/רָעָה֙ אֲשֶׁ֤ר הֵבֵ֨אתִי֙ עַל יְר֣וּשָׁלִַ֔ם אֵ֛ת כָּל אֲשֶׁ֥ר הֵבֵ֖אתִי עָלֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/022.yaml
  text: Yet behold[a], a remnant will be left in it—those brought out, sons and daughters. Behold, they are coming out to you, and you will see their way and their deeds; and you will be comforted concerning the disaster that I brought upon Jerusalem[c][b], all that I brought upon it.
  footnotes:
  - marker: a
    text: Or 'an escape will remain in it' or 'survivors will be left in it.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons and daughters'; the text explicitly names both rather than using a generic term like 'children.'
    reason: lexical_alternative
  - marker: c
    text: '''Disaster'' here refers to calamity/judgment brought on Jerusalem, not moral evil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그 안에 남겨질 피난민 곧 끌려나온 남자와 여자 자녀가 있을 것입니다. 보십시오, 그들이 여러분에게 나와서 오는 것을 여러분이 보게 될 것이며, 여러분은 내가 예루살렘에 가져온 재앙, 곧 내가 그곳에 가져온 모든 것 때문에 위로를 받을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단순한 ‘남음’보다 ‘탈출하여 살아남은 무리’를 포함하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘자녀들’이 아니라 ‘남자와 여자 자녀’라고 성별 쌍을 명시합니다.
    reason: lexical_alternative
  - marker: c
    text: 여기의 ‘재앙’은 도덕적 악이 아니라 예루살렘에 내린 심판적 재난을 가리킵니다.
    reason: theological_note
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: Yet behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 그러나 보십시오
  - 보라
  lexicon: HALOT
  rationale: 문맥의 급전과 주의 환기를 살리되, 한국어에서는 앞의 판단을 자연스럽게 받는 직접 호명형 표현이 가장 무리 없습니다.
- source_word: נֽוֹתְרָה ... פְּלֵטָה
  english_pob_choice: a remnant will be left
  chosen_korean: 남겨질 피난민
  alternatives_korean:
  - 남아 있을 남은 자
  - 구원받은 무리가 남을 것
  lexicon: HALOT
  rationale: ‘남은 자/피난민’ 계열이 히브리어 פְּלֵטָה의 생존·탈출 뉘앙스를 함께 담습니다. 문맥상 심판에서 살아남은 집단을 가리키므로 ‘피난민’이 단순 잔존보다 더 적절합니다.
- source_word: בָּנִים וּבָנוֹת
  english_pob_choice: sons and daughters
  chosen_korean: 남자와 여자 자녀
  alternatives_korean:
  - 아들과 딸
  - 자녀들
  lexicon: HALOT
  rationale: 히브리어가 성별 쌍을 명시하므로, 일반화된 ‘자녀들’로 평탄화하지 않고 남녀를 드러내는 표현을 택했습니다. 한국어에서는 ‘남자와 여자 자녀’가 성별 대칭을 비교적 직접적으로 보존합니다.
- source_word: וְנִחַמְתֶּם
  english_pob_choice: you will be comforted
  chosen_korean: 위로를 받을 것입니다
  alternatives_korean:
  - 위안을 얻을 것입니다
  - 마음이 놓일 것입니다
  lexicon: HALOT
  rationale: 니팔형의 수동·상태적 의미를 살려, 그들이 보고 나서 받게 되는 정서적 완화와 확신을 자연스럽게 표현합니다.
- source_word: הָרָעָה
  english_pob_choice: the disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 악
  lexicon: HALOT
  rationale: 여기서는 도덕적 ‘악’이 아니라 야훼께서 예루살렘에 내리신 징벌적 재난을 뜻하므로 ‘재앙’이 가장 정확합니다.
theological_decisions:
- issue: 하나님의 심판 행위로서의 הֵבֵאתִי / הֵבֵאתִי עָלֶיהָ
  chosen_reading: 내가 예루살렘에 가져온 재앙, 곧 내가 그곳에 가져온 모든 것
  alternative_readings:
  - 내가 예루살렘에 내린 재앙
  - 내가 예루살렘에 가져온 모든 재앙
  rationale: 본문은 야훼의 직접적 심판 행위를 분명히 말하므로, 이를 약화시키지 않으면서도 ‘악’으로 오해되지 않게 ‘재앙’으로 옮겼습니다. 반복 구조도 살려 심판의 총체성을 드러냈습니다.
  doctrine_reference: 원문 우선 원칙; 신정론적 완화 없이 심판 본문을 그대로 반영
