source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/002.yaml
  text: And the word of Yahweh came to me[a], saying,
  footnotes:
  - marker: a
    text: 'Hebrew YHWH; traditionally rendered ''the LORD'' in English versions. Alternative: ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 말씀이 내게 임하여 말씀하셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה. 영어 전통 역본에서는 보통 ‘the LORD’로 번역하지만, 여기서는 하나님의 이름을 드러내기 위해 ‘야훼’로 옮깁니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 임하여
  alternatives_korean:
  - 있었습니다
  - 이르렀습니다
  - 임하셨습니다
  lexicon: HALOT
  rationale: 예언서의 정형적 서두에서 וַיְהִי 는 단순한 발생이 아니라 ‘말씀이 …에게 이르다/임하다’는 관용적 흐름을 이루므로, 한국어에서는 자연스럽게 ‘임하여’로 살렸습니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 메시지
  - 일
  lexicon: HALOT
  rationale: דְבַר יְהוָה 는 예언자 공식 표현이므로, 해석을 좁히는 ‘메시지’보다 성경적 공식성을 유지하는 ‘말씀’이 원문의 힘을 더 정확히 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 원문 고유명사 יהוה 를 한국어 표준 프로젝트 관례에 따라 ‘야훼’로 옮겨, 제목어 ‘주님’으로 대체하지 않고 신적 이름 자체를 드러냈습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내게로
  lexicon: HALOT
  rationale: אֵלַי 는 1인칭 단수 목적/도착 방향을 나타내므로, 현대 합쇼체 문맥에서 가장 자연스러운 ‘내게’로 번역했습니다.
theological_decisions:
- issue: 예언 공식을 한국어로 어떻게 살릴지
  chosen_reading: ‘야훼의 말씀이 내게 임하여’로 옮겨, 단순 전달보다 예언적 임재와 권위를 함께 드러냈습니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 와서’
  - ‘야훼의 말씀이 내게 이르러’
  rationale: 히브리어 공식문은 단지 정보 전달이 아니라 하나님의 말씀의 도래를 강조하므로, ‘임하여’가 그 신학적 무게를 가장 잘 보존합니다.
  doctrine_reference: 예언서 서두의 표준 공식과 하나님의 말씀의 권위
- issue: 직접화법 도입부의 한국어 절단
  chosen_reading: ‘말씀하셨습니다’로 매듭지어 다음 직접화법을 예고했습니다.
  alternative_readings:
  - ‘말씀하여 이르시기를’
  - ‘말씀하셨다’
  rationale: לֵאמֹר 를 현대 한국어에서는 장황한 ‘이르시기를’보다 간결한 ‘말씀하셨습니다’로 처리해, 합쇼체 본문 흐름을 유지했습니다.
  doctrine_reference: 직접화법 도입 관용
- issue: 야훼 신명 번역
  chosen_reading: ‘야훼’
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: POB의 출처비평 원칙에 따라 Tetragrammaton을 인격적 고유명으로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
