id: EZK.14.9
reference: Ezekiel 14:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/נָּבִ֤יא כִֽי יְפֻתֶּה֙ וְ/דִבֶּ֣ר דָּבָ֔ר אֲנִ֤י יְהוָה֙ פִּתֵּ֔יתִי אֵ֖ת הַ/נָּבִ֣יא הַ/ה֑וּא וְ/נָטִ֤יתִי אֶת יָדִ/י֙ עָלָ֔י/ו וְ/הִ֨שְׁמַדְתִּ֔י/ו מִ/תּ֖וֹךְ עַמִּ֥/י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/009.yaml
  text: And if the prophet is deceived and speaks a word[a], I, Yahweh, have deceived that prophet; and I will stretch out my hand against him and destroy him from the midst of my people Israel.
  footnotes:
  - marker: a
    text: Or 'have enticed that prophet'; some understand the sense more permissively as 'have allowed that prophet to be deceived.'
    reason: alternative_reading
translation:
  language: ko
  text: 예언자가 속임을 받아 어떤 말을 한다면, 나 야훼가 그 예언자를 속인 것입니다[a]. 나는 그에게 대적하여 내 손을 뻗어 이스라엘인 내 백성 가운데서 그를 멸할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 예언자를 유혹한’. 일부는 이를 더 허용적인 뜻으로, ‘그 예언자가 속도록 허락한 것’으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנָּבִיא כִי יְפֻתֶּה
  english_pob_choice: And if the prophet is deceived
  chosen_korean: 예언자가 속임을 받고
  alternatives_korean:
  - 예언자가 속임을 당하고
  - 예언자가 미혹되고
  lexicon: HALOT
  rationale: פּתה의 수동형을 한국어에서 자연스럽게 드러내면서도, 단순한 ‘설득’이 아니라 실제로 잘못된 방향으로 이끌린 상태를 보여 주기 위해 ‘속임을 받다’로 옮겼습니다.
- source_word: וְדִבֶּר דָּבָר
  english_pob_choice: and speaks a word
  chosen_korean: 한 말을 한다면
  alternatives_korean:
  - 한 말을 한다면
  - 말씀을 한다면
  - 한 말을 전한다면
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘말을 말하다’에 가깝지만, 한국어에서는 반복을 줄여도 원문의 간결한 예언 발화를 살릴 수 있어 ‘한 말을 한다면’으로 처리했습니다.
- source_word: אֲנִי יְהוָה
  english_pob_choice: I, Yahweh
  chosen_korean: 나 야훼가
  alternatives_korean:
  - 내가 야훼가
  - 나, 야훼가
  - 나 주님이
  lexicon: contested_terms
  rationale: 본문의 강조된 ‘나’와 신명 יְהוָה를 그대로 드러내기 위해 ‘나 야훼가’로 옮겼습니다. 프로젝트 기본어인 ‘야훼’를 유지해 주석 없이도 원어 결속을 보이게 했습니다.
- source_word: וְנָטִיתִי אֶת יָדִי עָלָיו
  english_pob_choice: and I will stretch out my hand against him
  chosen_korean: 나는 내 손을 그에게 펴서
  alternatives_korean:
  - 나는 내 손을 그에게 뻗어
  - 나는 내 손을 그에게 펴고
  lexicon: HALOT
  rationale: ‘손을 펴다’는 심판 행위를 가리키는 관용구이므로, 방향성인 ‘그에게’를 함께 두어 ‘against him’의 대립 의미를 한국어로 살렸습니다.
- source_word: וְהִשְׁמַדְתִּיו
  english_pob_choice: and destroy him
  chosen_korean: 그를 멸할 것입니다
  alternatives_korean:
  - 그를 멸망시킬 것입니다
  - 그를 없앨 것입니다
  lexicon: HALOT
  rationale: שׁמד의 강한 멸절 의미를 약화하지 않으면서도 예언적 심판 문맥에 자연스러운 동사를 택했습니다.
theological_decisions:
- issue: 여호와의 직접적 속임과 심판의 긴장
  chosen_reading: ‘나 야훼가 그 예언자를 속인 것입니다’로 직접 진술을 유지했습니다.
  alternative_readings:
  - 야훼가 그 예언자가 속도록 허락한 것입니다
  - 야훼가 그 예언자를 미혹한 것입니다
  rationale: 히브리어는 같은 어근을 사용해 예언자의 속임과 야훼의 행위를 함께 말하므로, 본문이 가진 신학적 긴장을 완화하지 않고 그대로 보존했습니다. 다만 한국어에서는 ‘속인 것입니다’가 가장 직설적이어서 본문에 두었습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
