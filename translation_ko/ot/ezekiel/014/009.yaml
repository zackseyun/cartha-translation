revisions:
- from: 예언자가 속임을 받고 한 말을 한다면, 나 야훼가 그 예언자를 속인 것입니다. 나는 내 손을 그에게 펴서 이스라엘 내 백성 가운데서 그를 멸할 것입니다.[a]
  to: 예언자가 속임을 받아 어떤 말을 한다면, 나 야훼가 그 예언자를 속인 것입니다[a]. 나는 그에게 대적하여 내 손을 뻗어 이스라엘인 내 백성 가운데서 그를 멸할 것입니다.
  rationale: 한국어의 모호하거나 부자연스러운 표현을 바로잡고, 심판 행위의 대적 방향성과 각주의 적용 범위를 명확히 했습니다. 야훼의 직접적 속임이라는 본문의 난해한 진술은 해석적으로 완화하지 않고 유지했습니다.
