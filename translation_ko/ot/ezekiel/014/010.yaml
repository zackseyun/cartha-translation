id: EZK.14.10
reference: Ezekiel 14:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָשְׂא֖וּ עֲוֺנָ֑/ם כַּֽ/עֲוֺן֙ הַ/דֹּרֵ֔שׁ כַּ/עֲוֺ֥ן הַ/נָּבִ֖יא יִֽהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/010.yaml
  text: And they will bear their punishment[a]; the punishment of the one who inquires will be the same as the punishment of the prophet.
  footnotes:
  - marker: a
    text: Or, 'And they will bear their guilt/iniquity; the guilt of the one who inquires will be like the guilt of the prophet.' The Hebrew word can refer to iniquity, guilt, or the punishment resulting from guilt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기 형벌을 받을 것입니다. 찾아와 묻는 사람의 형벌은 예언자의 형벌과 같을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 자기 죄악(또는 죄책)을 짊어질 것입니다. 찾아와 묻는 사람의 죄악(또는 죄책)은 예언자의 죄악(또는 죄책)과 같을 것입니다.’ 히브리어 עון은 죄악, 죄책, 또는 그 죄책에서 비롯되는 형벌을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ ... עֲוֺנָם
  english_pob_choice: And they will bear their punishment
  chosen_korean: 그들은 자기 죄악을 짊어질 것입니다
  alternatives_korean:
  - 그들은 자기 형벌을 짊어질 것입니다
  - 그들은 자기 죄책을 지게 될 것입니다
  lexicon: HALOT
  rationale: עון은 이 문맥에서 죄악 자체와 그로 인한 책임/형벌을 함께 가리킬 수 있으므로, ‘짊어지다’로 히브리어 관용을 살리면서 ‘죄악’을 기본 의미로 드러냈습니다.
- source_word: כַּעֲוֺן הַדֹּרֵשׁ
  english_pob_choice: the punishment of the one who inquires will be the same as the punishment of the prophet
  chosen_korean: 문의하는 사람의 죄악도
  alternatives_korean:
  - 찾아 묻는 자의 죄악도
  - 신탁을 구하는 사람의 죄책도
  lexicon: HALOT
  rationale: הַדֹּרֵשׁ는 예언자에게 신탁을 구하는 사람을 가리키므로, 문맥상 ‘문의하는 사람’으로 옮겼습니다. ‘죄악도’는 앞부분과 같은 어휘를 유지해 대응 구조를 보존합니다.
- source_word: הַנָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 예언자의
  alternatives_korean:
  - 선지자의
  - 예언자와
  lexicon: HALOT
  rationale: נביא는 여기서 신탁을 전하는 예언자를 가리키므로 ‘예언자’가 가장 직접적입니다. 앞부분과의 평행을 살리기 위해 동일 어휘를 유지했습니다.
theological_decisions:
- issue: עון을 ‘punishment’로 볼지 ‘guilt/iniquity’로 볼지
  chosen_reading: 본문에서는 ‘죄악을 짊어지다’로 옮기되, 의미상 그 결과로서의 형벌도 함께 암시하도록 했습니다.
  alternative_readings:
  - 그들은 자기 형벌을 짊어질 것입니다
  - 그들은 자기 죄책을 짊어질 것입니다
  rationale: 히브리어 עון은 죄악, 죄책, 그리고 그 결과로서의 형벌을 모두 포괄할 수 있습니다. 한국어 본문은 히브리어 관용을 살려 ‘짊어지다’를 유지하고, 의미의 폭은 문맥 전체가 받쳐 주도록 두었습니다.
  doctrine_reference: 'Translation philosophy §5: consistency of key terms, or documented exception.'
