revisions:
- from: 그러면 그들이 너희를 위로할 것입니다. 너희가 그들의 길과 그들의 행위를 볼 것이기 때문입니다. 그러면 너희는 내가 그 안에서 행한 모든 것을 아무 이유 없이 한 것이 아님을 알게 될 것입니다. 주 여호와의 말씀이니라.[a][b][c]
  to: 너희가 그들의 행실과 행위를 볼 때, 그들이 너희를 위로할 것입니다.[a] 그러면 너희는 내가 그 안에서[c] 행한 모든 일을 아무 이유 없이 한 것이 아님을 알게 될 것입니다.[b] 주 야훼께서 말씀하십니다.
  rationale: 상황을 나타내는 כִּי를 ‘볼 때’로 옮겨 원문의 연결을 보존했습니다. ‘행실’과 ‘행위’로 삶의 방식과 구체적 행위를 구별했으며, 신명 표기와 종결 표현을 최신 프로젝트 방침 및 현대 합쇼체에 맞추었습니다. 각주도 해당 어구에 직접 연결하고, a의 문법적 대안을 정확히 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:40:34Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. כִּי תִרְאוּ는 여기서 ‘때/when’의 상황적 연결로 옮기는 것이 적절한데, 초안의 ‘볼 것이기 때문입니다’는 인과 관계를 과도하게 확정합니다. 또한 신명 표기는 제공된 최신 영어 POB 신학 결정(YHWH → Yahweh)에 맞추어 ‘야훼’로 고쳐야 합니다.
  naturalness: 초안은 ‘것입니다’와 고전적 종결형 ‘말씀이니라’를 함께 사용하여 요청된 현대 합쇼체가 일관되지 않습니다. ‘행실’과 ‘행위’, ‘볼 때’, ‘말씀하십니다’는 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: דַּרְכָּם은 윤리적 삶의 방식이라는 뜻에서 ‘행실’로, עֲלִילוֹתָם은 구체적 행위라는 뜻에서 ‘행위’로 구별했습니다. אֲדֹנָי יְהוָה는 프로젝트의 최신 결정에 따라 ‘주 야훼’로 옮겼습니다. ‘아무 이유 없이’는 לֹא חִנָּם의 비자의적 의미를 잘 보존합니다.
  issues:
  - severity: medium
    issue: ‘너희가 … 볼 것이기 때문입니다’가 כִּי תִרְאוּ를 인과절로 확정함
    rationale: 문맥과 영어 POB의 ‘when’에 따라, 위로가 일어나는 계기/상황을 나타내는 ‘볼 때’가 더 충실합니다.
  - severity: medium
    issue: ‘주 여호와의 말씀이니라’가 최신 프로젝트 신명 정책 및 현대 합쇼체와 불일치함
    rationale: 제공된 영어 POB 신학 결정은 YHWH를 ‘Yahweh’로 표기합니다. 또한 ‘말씀이니라’는 현대 합쇼체가 아니라 문어적 성서체입니다.
  - severity: low
    issue: 각주 a의 대안 번역이 원문의 문법적 대안을 정확히 반영하지 못함
    rationale: 대안은 ‘그들을 보면’이 아니라 생존자들을 수단으로 하는 수동적 의미, 곧 ‘그들로 말미암아 위로를 받을 것입니다’로 제시하는 것이 정확합니다.
  - severity: low
    issue: 각주 표지가 모두 문장 끝에 배치됨
    rationale: a는 ‘위로’ 표현에, b와 c는 각각 해당 절 및 ‘그 안에서’에 붙여 독자가 주석 대상을 즉시 알 수 있게 해야 합니다.
