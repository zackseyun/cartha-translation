id: EZK.14.23
reference: Ezekiel 14:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִחֲמ֣וּ אֶתְ/כֶ֔ם כִּֽי תִרְא֥וּ אֶת דַּרְכָּ֖/ם וְ/אֶת עֲלִֽילוֹתָ֑/ם וִֽ/ידַעְתֶּ֗ם כִּי֩ לֹ֨א חִנָּ֤ם עָשִׂ֨יתִי֙ אֵ֣ת כָּל אֲשֶׁר עָשִׂ֣יתִי בָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/023.yaml
  text: And they will comfort you when you see their ways and their deeds[a], and you will know that I have not done without cause all that I did in it[c][b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or, 'you will be comforted by them' or 'they will console you.' The Hebrew form allows the sense that the survivors become the means of your consolation when their conduct is seen.
    reason: lexical_alternative
  - marker: b
    text: Or, 'I did not do all that I did in her without reason.'
    reason: alternative_reading
  - marker: c
    text: That is, in Jerusalem.
    reason: cross_reference
translation:
  language: ko
  text: 그러면 그들이 너희를 위로할 것입니다. 너희가 그들의 길과 그들의 행위를 볼 것이기 때문입니다. 그러면 너희는 내가 그 안에서 행한 모든 것을 아무 이유 없이 한 것이 아님을 알게 될 것입니다. 주 여호와의 말씀이니라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들을 보면 너희가 위로를 받을 것이다”의 뜻일 수 있습니다. 히브리어 형태는 생존자들이 보이는 모습으로 인해 위로의 수단이 된다는 뜻을 허용합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “내가 그 안에서 내가 한 모든 일을 이유 없이 하지 않았다.”
    reason: alternative_reading
  - marker: c
    text: 즉 예루살렘 안에서입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְנִחֲמוּ אֶתְכֶם
  english_pob_choice: they will comfort you
  chosen_korean: 너희를 위로할 것입니다
  alternatives_korean:
  - 그들이 너희를 위로할 것입니다
  - 너희가 그들에게서 위로를 받을 것입니다
  - 그들이 너희를 위로해 줄 것입니다
  lexicon: HALOT
  rationale: 히브리어 니팔 동사는 ‘그들이 위로한다’는 능동적 결과를 자연스럽게 드러내며, 한국어에서는 ‘위로하다’가 가장 직접적이고 문맥에 맞습니다.
- source_word: דַּרְכָּם
  english_pob_choice: their ways
  chosen_korean: 그들의 길
  alternatives_korean:
  - 그들의 행실
  - 그들의 삶의 방식
  - 그들의 행위
  lexicon: HALOT
  rationale: דֶּרֶךְ의 비유적 의미를 살려 ‘길’로 옮기면 히브리어의 표현을 유지하면서도 윤리적 삶의 방향을 드러낼 수 있습니다.
- source_word: עֲלִילוֹתָם
  english_pob_choice: their deeds
  chosen_korean: 그들의 행위
  alternatives_korean:
  - 그들의 일
  - 그들의 행동
  - 그들의 실천
  lexicon: HALOT
  rationale: עֲלִילוֹת는 구체적 행적을 가리키므로 ‘행위’가 ‘길’과 구별되면서도 품위 있는 현대 한국어로 대응합니다.
- source_word: לֹא חִנָּם
  english_pob_choice: not done without cause
  chosen_korean: 아무 이유 없이 한 것이 아님
  alternatives_korean:
  - 까닭 없이 한 것이 아님
  - 헛되이 한 것이 아님
  - 이유 없이 한 것이 아님
  lexicon: HALOT
  rationale: חִנָּם은 ‘헛되이/무상으로/까닭 없이’의 뜻이므로, 문맥의 법정적·신학적 뉘앙스를 살려 ‘아무 이유 없이’로 옮겼습니다.
- source_word: בָהּ
  english_pob_choice: in it
  chosen_korean: 그 안에서
  alternatives_korean:
  - 그 안에
  - 그 도성 안에서
  - 그 안에서(예루살렘에서)
  lexicon: HALOT
  rationale: 여성형 단수 대명사는 예루살렘을 가리키며, 한국어에서는 ‘그 안에서’가 자연스럽고 직역에 가깝습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 여호와의 말씀이니라
  alternatives_korean:
  - 주 야훼의 말씀이니라
  - 주 하나님의 말씀이니라
  - 주 여호와께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם은 관용적으로 ‘말씀이니라’로 옮기되, 아도나이+יהוה 결합은 한국 교회 독자에게 익숙한 호칭을 유지하되 원문의 엄숙한 종결감을 살렸습니다.
theological_decisions:
- issue: ‘위로’의 성격
  chosen_reading: 생존자들의 행실이 예루살렘 심판의 정당성을 드러내어, 심판을 본 자들에게 위로가 되게 한다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 생존자들의 존재 자체가 위로라는 뜻
  - 보는 이들이 스스로 위로하게 된다는 뜻
  rationale: 문맥상 위로는 감정적 위안보다 하나님의 행위가 ‘까닭 없지 않다’는 인식에서 오는 설명적·신학적 위로입니다.
  doctrine_reference: 본문의 논리 구조를 따라 의미를 보존하되, 신학적 긴장을 완화하지 않습니다.
