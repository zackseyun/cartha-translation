base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/010.yaml
  text: And as Samuel was offering up the burnt offering[a], the Philistines drew near for battle against Israel. But Yahweh thundered with a great sound on that day against the Philistines and threw them into confusion, and they were defeated before Israel.
  footnotes:
  - marker: a
    text: Or 'with a mighty thunder' or 'with a great noise.' The Hebrew literally says 'with a great sound.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘이 번제[a]를 드리고 있을 때, 블레셋 사람들이 이스라엘과 싸우려고 가까이 다가왔습니다. 그런데 야훼께서 그날 블레셋 사람들 위에 큰 소리로 우레를 치셔서 그들을 혼란에 빠뜨리셨고, 그들은 이스라엘 앞에서 패배했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강한 우레로’ 혹은 ‘큰 소리로’. 히브리어는 문자적으로 ‘큰 소리로’라고 말합니다.
    reason: lexical_alternative
