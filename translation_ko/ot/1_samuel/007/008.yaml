  text: וַ/יֹּאמְר֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל שְׁמוּאֵ֔ל אַל תַּחֲרֵ֣שׁ מִמֶּ֔/נּוּ מִ/זְּעֹ֖ק אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/008.yaml
  text: Then the sons of Israel said to Samuel[a], “Do not be silent for us from crying out to Yahweh our God, that he may save us from the hand of the Philistines.”
  footnotes:
  - marker: a
    text: Or 'Do not cease crying out to the LORD our God for us.' The Hebrew literally says, 'Do not be silent for us from crying out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘 자손이 사무엘에게 말했습니다. “우리를 위하여 야훼, 우리 하나님께 부르짖는 일을 그치지 마십시오.[a] 그분께서 블레셋 사람들의 손에서 우리를 구원해 주시도록 하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 위하여 우리 하나님 야훼께 부르짖기를 멈추지 마십시오.’ 히브리어를 직역하면 ‘우리를 위하여 부르짖는 데서 잠잠하지 마십시오’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 직역적 표지를 살리면서도 한국어로 자연스럽게 들리도록 ‘아들들’을 유지했습니다. ‘이스라엘 사람들’은 매끄럽지만 원문 이미지가 약해집니다.
- source_word: אַל תַּחֲרֵשׁ ... מִזְּעֹק
  english_pob_choice: Do not be silent ... from crying out
  chosen_korean: 우리를 위해 ... 부르짖는 일을 그치지 마십시오
  alternatives_korean:
  - 우리를 위해 ... 잠잠하지 마십시오
  - 우리를 위해 ... 부르짖기를 멈추지 마십시오
  lexicon: HALOT
  rationale: 원문은 ‘침묵하다’와 ‘부르짖다’가 함께 있는 관용적 구조이므로, 한국어에서는 의미를 살린 ‘그치지 마십시오’로 자연스럽게 옮겼습니다. ‘잠잠하다’는 더 직역적이지만 현대 문장에서는 다소 어색합니다.
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: Yahweh our God
  chosen_korean: 야훼 우리 하나님
  alternatives_korean:
  - 야훼 우리 하느님
  - 여호와 우리 하나님
  lexicon: HALOT
  rationale: 사본의 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. ‘하나님’은 한국어 개신교 용례를 따르되, 원문 고유명사와 호칭을 구분해 유지했습니다.
- source_word: וְיֹשִׁעֵנוּ מִיַּד פְּלִשְׁתִּים
  english_pob_choice: that he may save us from the hand of the Philistines
  chosen_korean: 그분이 블레셋 사람들의 손에서 우리를 구원하시게 하십시오
  alternatives_korean:
  - 그분이 블레셋 사람들의 손에서 우리를 건져 주시게 하십시오
  - 그분이 블레셋 사람들의 권세에서 우리를 구원하시게 하십시오
  lexicon: HALOT
  rationale: ‘손에서’라는 히브리어 관용을 살려 압제와 통제의 이미지를 보존했습니다. 동사는 ‘구원하다’로 옮겨 משפט적·구원사적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 예배/탄원 문맥에서의 요청 표현
  chosen_reading: ‘그치지 마십시오’와 ‘~하시게 하십시오’로 간청의 힘을 살렸습니다.
  alternative_readings:
  - ‘멈추지 마십시오’
  - ‘구원해 주시도록 해 주십시오’
  rationale: 이스라엘이 사무엘에게 강하게 간청하는 장면이므로, 지나치게 완곡한 표현보다 직접적인 청원을 택했습니다. 이는 원문의 긴급성과 공동체적 의존을 더 잘 드러냅니다.
  doctrine_reference: 1 Samuel 7:8 문맥상 탄원/중재 요청
- issue: 야훼의 이름 표기
  chosen_reading: ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 본문의 יְהוָה는 인격적 신명 자체이므로, 대체 호칭보다 고유명을 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
