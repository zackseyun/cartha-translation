lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  english_pob_choice: judged
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 심판했습니다
  - 재판했습니다
  - 판단했습니다
  - 다스리고 심판했습니다
  lexicon: HALOT
  rationale: שׁפט는 사사 시대 문맥에서 재판만이 아니라 통치·다스림의 기능까지 포함할 수 있으므로, 한국어에서는 제도적 직함을 덜 강조하면서도 왕국 이전의 지도자 역할을 드러내는 ‘다스렸습니다’를 택했습니다.
- source_word: כֹּל יְמֵי חַיָּיו
  english_pob_choice: all the days of his life
  chosen_korean: 평생
  alternatives_korean:
  - 그의 생애 동안
  - 그가 사는 모든 날 동안
  - 삶의 모든 날 동안
  lexicon: HALOT
  rationale: ‘모든 날들’의 관용적 표현을 한국어에서 자연스럽고 간결하게 살리기 위해 ‘평생’으로 옮겼습니다.
theological_decisions:
- issue: 사무엘의 역할을 단순한 재판관으로만 제한할지 여부
  chosen_reading: 사무엘이 이스라엘을 ‘다스렸다’고 번역해 재판과 통치의 이중 뉘앙스를 함께 살렸습니다.
  alternative_readings:
  - ‘판단했습니다’처럼 사법 기능만 강조하는 번역
  - ‘인도했습니다’처럼 지도성만 강조하는 번역
  rationale: 본문의 שׁפט는 사무엘의 역사적 역할을 서술하며, 사법적 판결과 공동체적 통치를 함께 포함할 수 있으므로 어느 한쪽으로 좁히지 않는 것이 원문에 더 충실합니다.
  doctrine_reference: 사사기/사무엘상 본문의 사사 직무 이해
