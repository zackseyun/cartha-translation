  text: וַ/יִּקָּבְצ֣וּ הַ֠/מִּצְפָּתָ/ה וַ/יִּֽשְׁאֲבוּ מַ֜יִם וַֽ/יִּשְׁפְּכ֣וּ לִ/פְנֵ֣י יְהוָ֗ה וַ/יָּצ֨וּמוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא וַ/יֹּ֣אמְרוּ שָׁ֔ם חָטָ֖אנוּ לַ/יהוָ֑ה וַ/יִּשְׁפֹּ֧ט שְׁמוּאֵ֛ל אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/מִּצְפָּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/006.yaml
  text: So they gathered at Mizpah[a], drew water, and poured it out before Yahweh. They fasted on that day and said there[c][b], “We have sinned against Yahweh.” And Samuel judged the sons of Israel at Mizpah.
  footnotes:
  - marker: a
    text: Or “to Mizpah” at the first mention; the Hebrew form includes a directional ending.
    reason: lexical_alternative
  - marker: b
    text: The pouring out of water before the LORD is a ritual act of repentance or lament, though the text does not explain its symbolism explicitly.
    reason: cultural_note
  - marker: c
    text: Hebrew “the sons of Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 미스바[a]에 모여 물을 길어 야훼 앞에 부었습니다[b]. 그날 그들은 금식하고 그곳에서 “우리가 야훼께 죄를 지었습니다”라고 말했습니다. 사무엘은 미스바에서 이스라엘 자손[c]을 다스렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫 언급의 히브리어 형태에는 방향을 나타내는 어미가 있어 문자적으로는 “미스바로”라고 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 야훼 앞에 물을 붓는 행위는 회개나 애도의 의례적 행위로 이해될 수 있으나, 본문은 그 상징을 명시적으로 설명하지 않습니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 문자적으로 “이스라엘의 아들들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  english_pob_choice: they gathered
  chosen_korean: 모여
  alternatives_korean:
  - 모였습니다
  - 집결했습니다
  lexicon: HALOT
  rationale: 니팔식 서술의 자연스러운 결과를 살리면서, 한국어에서도 사람들이 한곳에 모인 사건으로 간명하게 표현했습니다.
- source_word: הַמִּצְפָּתָה / בַּמִּצְפָּה
  english_pob_choice: at Mizpah
  chosen_korean: 미스바에 / 미스바에서
  alternatives_korean:
  - 미스바로
  - 미스바에서
  lexicon: HALOT
  rationale: 첫 번째 표현의 방향성은 한국어에서 ‘에’로 충분히 살릴 수 있고, 끝의 מקום표현은 ‘에서’로 옮겨 같은 장소성을 유지했습니다.
- source_word: וַיִּשְׁפְּכוּ לִפְנֵי יְהוָה
  english_pob_choice: poured it out before Yahweh
  chosen_korean: 야훼 앞에 부었으며
  alternatives_korean:
  - 야훼 앞에 쏟아부었으며
  - 야훼 앞에 쏟았으며
  lexicon: HALOT
  rationale: ‘붓다/쏟다’ 가운데서는 의례적 동작을 가장 직접적으로 드러내는 ‘붓다’를 택했고, לִפְנֵי는 ‘앞에’로 옮겼습니다.
- source_word: וַיִּשְׁפֹּט
  english_pob_choice: judged
  chosen_korean: 심판했습니다
  alternatives_korean:
  - 재판했습니다
  - 다스렸습니다
  - 판단했습니다
  lexicon: HALOT
  rationale: 사무엘의 사사적 역할을 한국어에서 가장 넓고도 분명하게 드러내는 ‘심판하다’를 택했습니다.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: EN POB의 ‘sons of Israel’을 따라 원문의 직역성을 살렸고, 집합적 의미는 문맥이 받쳐 줍니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 원문 יהוה를 따라 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 본문은 하나님의 고유명을 직접 사용하는 장면이므로, 프로젝트 기본값대로 신적 호칭 대체보다 이름의 직접성을 살렸습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: 물을 붓는 행위의 의미
  chosen_reading: 본문이 설명하지 않는 상징은 본문 밖으로 미루고 행위 자체만 유지했습니다.
  alternative_readings:
  - 회개의 상징으로 명시
  - 애곡의 표시로 명시
  rationale: 물 붓기의 신학적 의미는 가능하지만 본문이 직접 해설하지 않으므로, 해석을 본문에 끼워 넣지 않고 서술만 보존했습니다.
  doctrine_reference: Translation philosophy §3
