  lexicon: HALOT
  rationale: ‘집’이라는 공동체-가문 이미지를 살려서 언약 공동체 전체를 가리키는 뉘앙스를 보존했습니다.
- source_word: שָׁבִים אֶל יְהוָה
  english_pob_choice: returning to Yahweh / the LORD
  chosen_korean: 야훼께 돌아오려거든
  alternatives_korean:
  - 야훼께 돌아온다면
  - 야훼께로 돌아서려거든
  lexicon: HALOT
  rationale: שׁוּב의 ‘돌아오다/되돌아가다’ 의미를 살리되, 조건문의 자연스러운 한국어로 옮겼습니다.
- source_word: אֱלֹהֵי הַנֵּכָר ... וְהָעַשְׁתָּרֹת
  english_pob_choice: the foreign gods ... and the Ashtaroths
  chosen_korean: 이방 신들과 아스다롯
  alternatives_korean:
  - 낯선 신들과 아스다롯
  - 외국 신들과 아스다롯
  - 이방의 신들과 아스다롯
  lexicon: HALOT
  rationale: אֱלֹהֵי הַנֵּכָר는 단순히 ‘이상한 신들’이 아니라 언약 백성 밖의 신들을 가리키므로 ‘이방 신들’이 가장 직접적입니다. 아스다롯은 복수형을 살려 음역했습니다.
- source_word: וְהָכִינוּ לְבַבְכֶם אֶל יְהוָה
  english_pob_choice: and direct your heart to Yahweh
  chosen_korean: 너희 마음을 야훼께로 바로잡아
  alternatives_korean:
  - 너희 마음을 야훼께로 준비하여
  - 너희 마음을 야훼께로 굳게 하여
  - 너희 마음을 야훼께로 정하여
  lexicon: HALOT
  rationale: כּוּן은 ‘준비하다’보다 ‘바로 세우다/정렬하다’에 가까워, 마음의 방향을 바로잡는 표현으로 옮겼습니다.
- source_word: וְעִבְדֻהוּ לְבַדּוֹ
  english_pob_choice: and serve him alone
  chosen_korean: 그분만 섬기십시오
  alternatives_korean:
  - 그분만 섬기고
  - 그분만 섬기라
  - 오직 그분만 섬기십시오
  lexicon: HALOT
  rationale: עבד는 예배만이 아니라 전인적 충성을 포함하므로 ‘섬기다’로 넓게 살리면서 독점성을 분명히 했습니다.
- source_word: מִיַּד פְּלִשְׁתִּים
  english_pob_choice: from the hand of the Philistines
  chosen_korean: 블레셋 사람의 손에서
  alternatives_korean:
  - 블레셋 사람들의 손에서
  - 블레셋의 손에서
  - 블레셋 사람의 권세에서
  lexicon: HALOT
  rationale: ‘손에서’라는 히브리어 관용구를 유지해 압제의 힘에서 건져 주는 이미지를 보존했습니다.
