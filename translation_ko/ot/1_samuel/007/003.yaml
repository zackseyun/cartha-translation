source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל אֶל כָּל בֵּ֣ית יִשְׂרָאֵל֮ לֵ/אמֹר֒ אִם בְּ/כָל לְבַבְ/כֶ֗ם אַתֶּ֤ם שָׁבִים֙ אֶל יְהוָ֔ה הָסִ֜ירוּ אֶת אֱלֹהֵ֧י הַ/נֵּכָ֛ר מִ/תּוֹכְ/כֶ֖ם וְ/הָ/עַשְׁתָּר֑וֹת וְ/הָכִ֨ינוּ לְבַבְ/כֶ֤ם אֶל יְהוָה֙ וְ/עִבְדֻ֣/הוּ לְ/בַדּ֔/וֹ וְ/יַצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/003.yaml
  text: Then Samuel said to all the house of Israel[a], “If you are returning to Yahweh with all your heart, remove the foreign gods and the Ashtaroths from among you, and direct your heart to Yahweh and serve him alone[d][c][b], and he will deliver you from the hand of the Philistines.”
  footnotes:
  - marker: a
    text: Or “turning back to the LORD with all your heart.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew plural “Ashtaroths” likely refers to manifestations, images, or cultic forms associated with the goddess Ashtoreth/Astarte.
    reason: cultural_note
  - marker: c
    text: Or “prepare your heart for the LORD.”
    reason: lexical_alternative
  - marker: d
    text: 'Hebrew: “from the hand of the Philistines,” an idiom for deliverance from their power.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 사무엘이 온 이스라엘 집에 말했습니다. “너희가 온 마음으로 야훼께 돌아오려거든, 너희 가운데 있는 이방 신들과 아스다롯을 제거하고, 너희 마음을 야훼께로 바로잡아 그분만 섬기십시오. 그러면 그분이 너희를 블레셋 사람의 손에서 건져 주실 것입니다.”[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “온 마음으로 야훼께 돌아서려거든.”
    reason: alternative_reading
  - marker: b
    text: 복수형 ‘아스다롯’은 아스다롯 여신과 관련된 형상, 표현, 또는 숭배 형태들을 가리킬 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: 또는 “너희 마음을 야훼께로 준비하십시오.”
    reason: alternative_reading
  - marker: d
    text: 히브리어의 “손에서”는 그들의 권세에서 건져 주신다는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל בֵּית יִשְׂרָאֵל
  english_pob_choice: all the house of Israel
  chosen_korean: 온 이스라엘 집
  alternatives_korean:
  - 온 이스라엘
  - 이스라엘의 온 집
  lexicon: HALOT
  rationale: ‘집’이라는 공동체-가문 이미지를 살려서 언약 공동체 전체를 가리키는 뉘앙스를 보존했습니다.
- source_word: שָׁבִים אֶל יְהוָה
  english_pob_choice: returning to Yahweh / the LORD
  chosen_korean: 야훼께 돌아오려거든
  alternatives_korean:
  - 야훼께 돌아온다면
  - 야훼께로 돌아서려거든
  lexicon: HALOT
  rationale: שׁוּב의 ‘돌아오다/되돌아가다’ 의미를 살리되, 조건문의 자연스러운 한국어로 옮겼습니다.
- source_word: אֱלֹהֵי הַנֵּכָר ... וְהָעַשְׁתָּרֹת
  english_pob_choice: the foreign gods ... and the Ashtaroths
  chosen_korean: 이방 신들과 아스다롯
  alternatives_korean:
  - 낯선 신들과 아스다롯
  - 외국 신들과 아스다롯
  - 이방의 신들과 아스다롯
  lexicon: HALOT
  rationale: אֱלֹהֵי הַנֵּכָר는 단순히 ‘이상한 신들’이 아니라 언약 백성 밖의 신들을 가리키므로 ‘이방 신들’이 가장 직접적입니다. 아스다롯은 복수형을 살려 음역했습니다.
- source_word: וְהָכִינוּ לְבַבְכֶם אֶל יְהוָה
  english_pob_choice: and direct your heart to Yahweh
  chosen_korean: 너희 마음을 야훼께로 바로잡아
  alternatives_korean:
  - 너희 마음을 야훼께로 준비하여
  - 너희 마음을 야훼께로 굳게 하여
  - 너희 마음을 야훼께로 정하여
  lexicon: HALOT
  rationale: כּוּן은 ‘준비하다’보다 ‘바로 세우다/정렬하다’에 가까워, 마음의 방향을 바로잡는 표현으로 옮겼습니다.
- source_word: וְעִבְדֻהוּ לְבַדּוֹ
  english_pob_choice: and serve him alone
  chosen_korean: 그분만 섬기십시오
  alternatives_korean:
  - 그분만 섬기고
  - 그분만 섬기라
  - 오직 그분만 섬기십시오
  lexicon: HALOT
  rationale: עבד는 예배만이 아니라 전인적 충성을 포함하므로 ‘섬기다’로 넓게 살리면서 독점성을 분명히 했습니다.
- source_word: מִיַּד פְּלִשְׁתִּים
  english_pob_choice: from the hand of the Philistines
  chosen_korean: 블레셋 사람의 손에서
  alternatives_korean:
  - 블레셋 사람들의 손에서
  - 블레셋의 손에서
  - 블레셋 사람의 권세에서
  lexicon: HALOT
  rationale: ‘손에서’라는 히브리어 관용구를 유지해 압제의 힘에서 건져 주는 이미지를 보존했습니다.
theological_decisions:
