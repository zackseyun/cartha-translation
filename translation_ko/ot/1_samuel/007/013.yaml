base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/013.yaml
  text: So the Philistines were subdued and did not again come into the territory of Israel[a]. And the hand of Yahweh was against the Philistines all the days of Samuel.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the hand of the LORD was upon the Philistines.'' The phrase is an idiom for the LORD''s active power, here in opposition to them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 블레셋 사람들은 굴복하였고 다시는 이스라엘 영토 안으로 들어오지 않았습니다. 야훼의 손은 사무엘의 모든 날 동안 블레셋 사람들을 대적하고 있었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘야훼의 손이 블레셋 사람들 위에 있었다’입니다. 이 표현은 야훼의 능동적인 힘이 그들을 대적하여 작용했음을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  english_pob_choice: were subdued
  chosen_korean: 굴복하였고
  alternatives_korean:
  - 제압되었고
  - 낮아졌고
  - 복종하게 되었고
  lexicon: HALOT
  rationale: 니팔형 כנע는 전쟁·정치적 맥락에서 ‘정복되어 굴복하다’의 뜻이므로, 한국어에서는 ‘굴복하다’가 가장 자연스럽고 결과적 수동 의미를 잘 살립니다.
- source_word: בִּגְבוּל יִשְׂרָאֵל
  english_pob_choice: into the territory of Israel
  chosen_korean: 이스라엘의 경계 안으로
  alternatives_korean:
  - 이스라엘의 영토 안으로
  - 이스라엘의 경계 안에
  - 이스라엘 땅으로
  lexicon: HALOT
  rationale: גְבוּל은 단순한 선형 ‘경계’보다 실제로 넘어 들어가는 공간을 가리킬 수 있어, ‘경계 안으로’가 ‘territory of Israel’의 공간·정치적 뉘앙스를 간결하게 반영합니다.
- source_word: וַתְּהִי יַד יְהוָה ... בַּפְּלִשְׁתִּים
  english_pob_choice: the hand of Yahweh was against the Philistines
  chosen_korean: 야훼의 손이 블레셋 사람들 위에 있었으며
  alternatives_korean:
  - 야훼의 손이 블레셋 사람들에 대하여 있었으며
  - 야훼의 손이 블레셋 사람들을 치고 있었으며
  - 야훼의 손이 블레셋 사람들에게 대적하여 있었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘야훼의 손’은 주님의 능동적 개입을 나타내므로 그대로 살리되, 한국어에서는 ‘위에’가 원문의 표면 이미지를 보존합니다. 대항의 뉘앙스는 이어지는 ‘굴복’과 전체 문맥이 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문은 여호와 대체어가 아닌 고유신명사 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮깁니다.
theological_decisions:
- issue: ‘야훼의 손’ 관용구의 강도
  chosen_reading: ‘야훼의 손이 ... 위에 있었다’로 직역에 가깝게 두되, 문맥상 그 손이 블레셋에 대한 सक्रिय적 억압과 심판을 뜻함을 유지했습니다.
  alternative_readings:
  - ‘야훼의 능력이 블레셋 사람들에 대하여 있었다’
  - ‘야훼께서 블레셋 사람들을 치셨습니다’
  rationale: 원문은 하나님의 능동적 개입을 ‘손’이라는 관용구로 말하므로, 이를 추상화하거나 사건화하기보다 표면 이미지를 보존하는 편이 source-direct합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §6
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신명사는 주어지는 언약적 고유이름이므로, 제목어 ‘주님’으로 바꾸지 않고 음역 ‘야훼’를 사용해 본문이 가진 직접성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
