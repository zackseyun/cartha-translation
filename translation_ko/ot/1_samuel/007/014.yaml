source:
  edition: WLC
  text: וַ/תָּשֹׁ֣בְנָה הֶ/עָרִ֡ים אֲשֶׁ֣ר לָֽקְחוּ פְלִשְׁתִּים֩ מֵ/אֵ֨ת יִשְׂרָאֵ֤ל לְ/יִשְׂרָאֵל֙ מֵ/עֶקְר֣וֹן וְ/עַד גַּ֔ת וְ/אֶ֨ת גְּבוּלָ֔/ן הִצִּ֥יל יִשְׂרָאֵ֖ל מִ/יַּ֣ד פְּלִשְׁתִּ֑ים וַ/יְהִ֣י שָׁל֔וֹם בֵּ֥ין יִשְׂרָאֵ֖ל וּ/בֵ֥ין הָ/אֱמֹרִֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/014.yaml
  text: And the cities that the Philistines had taken from Israel were restored to Israel[a], from Ekron to Gath; and Israel delivered its territory from the hand of the Philistines. And there was peace between Israel and the Amorites.
  footnotes:
  - marker: a
    text: Or, 'the Canaanites,' if 'Amorites' is understood here as a broader term for the peoples of the land.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 블레셋 사람들이 이스라엘에게서 빼앗아 간 성읍들이 에그론에서부터 가드까지 이스라엘에게로 회복되었으며, 이스라엘은 그 성읍들의 영토를 블레셋 사람들의 손에서 건져냈습니다. 그리고 이스라엘과 아모리 사람들 사이에 평화가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가나안 사람들’. 여기서 ‘아모리 사람들’이 그 땅의 주민들을 가리키는 더 넓은 말로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּשֹׁבְנָה
  english_pob_choice: were restored
  chosen_korean: 회복되었으며
  alternatives_korean:
  - 돌아왔으며
  - 되돌려졌으며
  lexicon: HALOT
  rationale: 주어가 성읍들이므로, 단순한 '돌아옴'보다 소유권이 이스라엘 쪽으로 되돌아온 상태를 드러내는 수동 표현이 원문과 POB의 의미를 더 잘 살립니다.
- source_word: הֶעָרִים
  english_pob_choice: the cities
  chosen_korean: 성읍들
  alternatives_korean:
  - 도시들
  - 읍들
  lexicon: HALOT
  rationale: 고대 근동의 영토·정치 문맥에서 '성읍들'이 가장 자연스럽고, 단순한 도시 집합보다 점유된 거점의 뉘앙스를 더 잘 전달합니다.
- source_word: מִיַּד פְּלִשְׁתִּים
  english_pob_choice: from the hand of the Philistines
  chosen_korean: 블레셋 사람들의 손에서
  alternatives_korean:
  - 블레셋 사람들의 권세에서
  - 블레셋 사람들의 힘에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되, 한국어 성경에서도 익숙한 '손에서'를 유지하여 적대적 지배와 탈출의 이미지를 보존했습니다.
- source_word: וְאֶת גְּבוּלָן
  english_pob_choice: its territory
  chosen_korean: 그 영토를
  alternatives_korean:
  - 그 경계를
  - 그 경계 지역을
  lexicon: HALOT
  rationale: '''גבול''은 경계 자체보다 경계가 둘러싼 지배 구역까지 가리킬 수 있으므로, 여기서는 문맥상 ''영토''가 가장 적절합니다.'
- source_word: הָאֱמֹרִי
  english_pob_choice: the Amorites
  chosen_korean: 아모리 사람들
  alternatives_korean:
  - 아모리 족속
  - 가나안 사람들
  lexicon: HALOT
  rationale: 원문은 구체적으로 '아모리'를 가리키므로 본문은 이를 유지했습니다. 다만 이 명칭이 더 넓은 주민 집단을 가리킨다는 해석 가능성은 본문에 두지 않고 별도 각주로 처리합니다.
theological_decisions:
- issue: הָאֱמֹרִי를 '아모리 사람들'로 유지할지, 더 넓은 '가나안 사람들'로 풀지
  chosen_reading: 본문은 '아모리 사람들'로 유지하고, 넓은 집단을 가리킨다는 해석은 각주로 제시합니다.
  alternative_readings:
  - 가나안 사람들
  rationale: 신학적 교리 차이보다는 역사·해석상의 선택이므로, 히브리어 표면형을 우선 보존하는 것이 POB의 원칙에 부합합니다.
  doctrine_reference: 원문 우선, 해석적 대체어는 각주에 보존
