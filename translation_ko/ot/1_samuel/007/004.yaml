  source_fidelity: 히브리어의 순서와 핵심 의미(이스라엘 자손, 바알들·아스다롯의 제거, 야훼만을 섬김)를 대체로 충실히 반영합니다. 다만 문두 접속사 וַ는 이 문맥에서 강한 논리적 결론을 표지하는 ‘그러므로’보다 서술 진행을 나타내는 ‘이에’가 더 적절합니다.
  naturalness: ‘이스라엘 자손’, ‘바알들’, ‘아스다롯’, ‘야훼만 섬겼습니다’는 현대 표준어 합쇼체 성경 문체에서 자연스럽습니다. ‘이에’는 앞 절의 권면에 따른 반응을 매끄럽게 잇습니다.
  terminology: ‘야훼’는 제시된 번역 원칙 및 영어 POB와 일치합니다. עבד는 ‘섬겼습니다’로 옮겨 언약적 충성과 예배를 아우르는 의미를 보존했습니다. 각주에서는 번역문과 일관되게 ‘야훼’를 사용하고, 대안 번역을 명시하는 것이 더 정확합니다.
  issues:
