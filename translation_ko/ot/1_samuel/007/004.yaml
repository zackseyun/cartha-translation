base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/004.yaml
  text: So the sons of Israel removed the Baals and the Ashtaroths[a], and they served Yahweh alone.
  footnotes:
  - marker: a
    text: Or 'worshiped the LORD alone.' The Hebrew verb can denote both service and worship when God is the object.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이스라엘 자손이 바알들과 아스다롯을 제거하고, 야훼만 섬겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עבד는 하나님을 대상으로 할 때 ‘섬기다’와 ‘예배하다’를 모두 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: WLC / HALOT
  rationale: 직역 성격의 인구·언약 표지를 살리기 위해 ‘이스라엘 자손’을 유지했습니다. “사람들/백성”은 자연스럽지만 원문의 친족-언약 표현을 완화합니다.
- source_word: הַבְּעָלִים
  english_pob_choice: the Baals
  chosen_korean: 바알들
  alternatives_korean:
  - 바알 우상들
  - 바알의 상들
  lexicon: HALOT
  rationale: 히브리어 복수형을 그대로 반영해 다수의 바알 숭배 대상 또는 지역적 형태를 보존했습니다. ‘우상들’은 해석을 더 강하게 덧붙입니다.
- source_word: הָעַשְׁתָּרֹת
  english_pob_choice: the Ashtaroths
  chosen_korean: 아스다롯
  alternatives_korean:
  - 아쉬토렛들
  - 아스타르테들
  lexicon: HALOT
  rationale: 히브리어 복수 고유명사의 관용적 음역으로 처리했습니다. 특정 이교 신명/숭배 대상을 지시하므로 일반 명사로 풀지 않았습니다.
- source_word: וַיַּעַבְדוּ אֶת יְהוָה
  english_pob_choice: and they served Yahweh
  chosen_korean: 그리고 야훼만 섬겼습니다
  alternatives_korean:
  - 그리고 야훼만 섬기며 예배했습니다
  - 그리고 야훼만 섬겼습니다
  lexicon: HALOT
  rationale: עבד는 하나님을 대상으로 할 때 ‘섬기다’와 ‘예배하다’의 의미 영역을 가집니다. 여기서는 문맥상 우상 제거 뒤의 전적 충성을 나타내므로 ‘섬기다’를 유지하고, לעבדוֹ의 배타성을 ‘만’으로 드러냈습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신성 사대명사를 직접 쓰므로, 번역문에서도 인격적 고유명사를 보존하는 ‘야훼’를 사용했습니다. 이는 호칭 대체보다 원문 식별성을 더 잘 드러냅니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה YHWH → Yahweh
- issue: עבד의 의미 범위
  chosen_reading: 섬겼습니다
  alternative_readings:
  - 예배했습니다
  - 섬기고 예배했습니다
  rationale: 우상 제거와 결합된 문맥에서 ‘섬기다’는 언약적 충성을 포괄하며, ‘예배하다’보다 원문 동사의 넓은 의미를 더 직접적으로 반영합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
