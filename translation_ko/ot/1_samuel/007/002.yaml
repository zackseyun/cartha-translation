  source_fidelity: 대체로 원문의 시간 경과와 ‘이스라엘의 온 집’이라는 집단 표현을 충실히 반영합니다. 그러나 אַחֲרֵי יְהוָה를 ‘야훼를 따라’로 옮기면 한국어에서는 야훼를 추종하면서 애통했다는 뜻으로 읽혀, 이 문맥의 애가·갈망의 방향성을 충분히 전달하지 못합니다.
  naturalness: ‘그 날수가 많아져서, 모두 이십 년이 되었으며’는 어색한 연결입니다. ‘날들이 많아져 이십 년이 되었고’가 현대 표준 한국어 문어체에서 자연스럽고 원문의 시간 경과 구조도 보존합니다. ‘이스라엘의 온 집’은 ‘온 이스라엘의 집’보다 자연스러우면서 히브리어의 ‘집’ 표현을 유지합니다.
  terminology: ‘법궤’, ‘기럇여아림’, ‘야훼’는 일관되고 적절합니다. וַיִּנָּהוּ는 ‘애통해하였습니다’로 무난합니다. 다만 그 뒤의 אַחֲרֵי는 본문에서 ‘야훼를 향하여’로 처리하고, 사모함이라는 가능한 의미는 주석으로 남기는 편이 자연스럽고 과도한 해석을 피합니다.
