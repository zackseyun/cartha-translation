  text: וַ/יְהִ֗י מִ/יּ֞וֹם שֶׁ֤בֶת הָֽ/אָרוֹן֙ בְּ/קִרְיַ֣ת יְעָרִ֔ים וַ/יִּרְבּוּ֙ הַ/יָּמִ֔ים וַ/יִּֽהְי֖וּ עֶשְׂרִ֣ים שָׁנָ֑ה וַ/יִּנָּה֛וּ כָּל בֵּ֥ית יִשְׂרָאֵ֖ל אַחֲרֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/002.yaml
  text: From the day the ark remained at Kiriath-jearim[a], the days became many, and they were twenty years[b]; and all the house of Israel lamented after Yahweh.
  footnotes:
  - marker: a
    text: Or 'many days passed.' The Hebrew is literally 'the days became many.'
    reason: lexical_alternative
  - marker: b
    text: Or 'longed for the LORD' or 'mourned toward the LORD.' The Hebrew reads 'lamented after the LORD,' an idiom that may express grief and turning toward him.
    reason: alternative_reading
translation:
  language: ko
  text: 법궤가 기럇여아림에 머문 날부터 날들이 많아져 이십 년이 되었고,[a] 이스라엘의 온 집은 야훼를 향하여 애통해하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘날들이 많아졌다’입니다. 이는 오랜 시간이 흘렀다는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼를 사모하며’ 또는 ‘야훼 때문에 애통하며’로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘야훼 뒤에’라고 말하며, 야훼를 향한 애가나 갈망을 나타내는 관용적 표현일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁבֶת הָאָרוֹן
  english_pob_choice: remained
  chosen_korean: 머문
  alternatives_korean:
  - 있던
  - 거주한
  - 앉아 있던
  lexicon: HALOT
  rationale: 법궤가 특정 장소에 계속 머물러 있었다는 뜻을 자연스럽게 살리기 위해 ‘머문’을 택했습니다. “앉다”의 직역은 부자연스럽고, ‘거주하다’는 법궤에 어울리지 않습니다.
- source_word: בְּקִרְיַת יְעָרִים
  english_pob_choice: at Kiriath-jearim
  chosen_korean: 기럇여아림에
  alternatives_korean:
  - 기럇여아림에서
  - 기럇-여아림에
  lexicon: HALOT
  rationale: 지명은 현대 외래어 표기 원칙에 따라 음역했고, 위치를 나타내는 전치사는 장소의 정착 상태를 드러내는 ‘-에’로 옮겼습니다.
- source_word: וַיִּרְבּוּ הַיָּמִים
  english_pob_choice: the days became many
  chosen_korean: 그 날수가 많아져서
  alternatives_korean:
  - 날이 많이 흘러서
  - 많은 날이 지나서
  lexicon: HALOT
  rationale: 히브리어의 ‘날들이 많아졌다’는 시간 경과 관용구를 한국어로 자연스럽게 풀되, 단순한 시간이 흐름만이 아니라 축적된 기간의 뉘앙스를 살렸습니다.
- source_word: וַיִּהְי֖וּ עֶשְׂרִ֣ים שָׁנָ֑ה
  english_pob_choice: they were twenty years
  chosen_korean: 모두 이십 년이 되었으며
  alternatives_korean:
  - 이십 년이었으며
  - 그 기간은 이십 년이었으며
  lexicon: HALOT
  rationale: 앞절의 ‘날수’가 이어져 총기간을 밝히는 구조이므로, ‘되었으며’로 결과적 도달을 표현했습니다. 숫자는 본문 흐름에 맞춰 간결하게 유지했습니다.
- source_word: וַיִּנָּהוּ
  english_pob_choice: lamented
  chosen_korean: 애통해하였습니다
  alternatives_korean:
  - 탄식하였습니다
  - 슬퍼하며 울부짖었습니다
  - 애곡하였습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 그리움보다 슬픔과 탄식이 섞인 lament를 가리키므로, 문어체 한국어의 ‘애통해하다’가 가장 가까운 정서를 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 언약적 고유명사 יְהוָה는 본 프로젝트 기본어에 따라 ‘야훼’로 옮겨, 호칭이 아니라 신명 자체를 드러내도록 했습니다.
theological_decisions:
- issue: אַחֲרֵי יְהוָה의 의미
  chosen_reading: ‘야훼를 따라’로 직역을 유지하되, 이 표현이 회개적 전환이나 그리움을 포함할 수 있어도 본문이 명시하지 않은 완전한 회개 공식으로 확정하지 않았습니다.
  alternative_readings:
  - 야훼를 향해
  - 야훼를 사모하며
  - 야훼 때문에 애통해하며
  rationale: 히브리어 전치사 ‘אַחֲרֵי’는 문자적으로 ‘뒤를 따라’이지만 관용적으로 ‘~을 향하여/뒤따라’의 정서적·관계적 방향성을 띨 수 있습니다. 본문의 긴장을 보존하기 위해 직역을 본문에 두고, 의미 확장 해석은 열어 두었습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
