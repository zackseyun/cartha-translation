source:
  edition: WLC
  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּֽי הִתְקַבְּצ֤וּ בְנֵֽי יִשְׂרָאֵל֙ הַ/מִּצְפָּ֔תָ/ה וַ/יַּעֲל֥וּ סַרְנֵֽי פְלִשְׁתִּ֖ים אֶל יִשְׂרָאֵ֑ל וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּֽרְא֖וּ מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/007.yaml
  text: When the Philistines heard that the sons of Israel had gathered at Mizpah[a], the rulers of the Philistines went up against Israel. When the sons of Israel heard it[b], they were afraid because of the Philistines.
  footnotes:
  - marker: a
    text: Or 'to Mizpah.' The Hebrew form includes a directional ending, though the context indicates the people were assembled there.
    reason: lexical_alternative
  - marker: b
    text: Or 'the lords of the Philistines.' The Hebrew term refers to the recognized Philistine rulers.
    reason: lexical_alternative
translation:
  language: ko
  text: 블레셋 사람들이 이스라엘 자손이 미스바에 모였다는 소식을 듣자[a], 블레셋의 통치자들[b]이 이스라엘을 치러 올라갔습니다. 이스라엘 자손은 이 소식을 듣고 블레셋 사람들을 두려워했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미스바로’. 히브리어는 방향형 어미를 포함하지만, 문맥상 그곳에 모인 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘블레셋의 방백들’. 히브리어 용어는 블레셋의 공인된 지도자들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 형식을 살리면서도 한국어에서 자연스럽게 읽히는 대응으로 옮겼습니다.
- source_word: הַמִּצְפָּתָה
  english_pob_choice: at Mizpah
  chosen_korean: 미스바에
  alternatives_korean:
  - 미스바에서
  - 미스바로
  lexicon: HALOT
  rationale: 문맥상 집결 장소를 나타내므로 장소 부사격으로 처리했습니다. 방향형 어미는 한국어 본문에서는 생략하고, 주해에서 반영했습니다.
- source_word: סַרְנֵי פְלִשְׁתִּים
  english_pob_choice: the rulers of the Philistines
  chosen_korean: 블레셋의 통치자들
  alternatives_korean:
  - 블레셋의 주인들
  - 블레셋의 방백들
  lexicon: HALOT
  rationale: סרנים은 블레셋의 정치·군사 지도자를 가리키므로, 현대 한국어에서 의미가 분명한 ‘통치자들’을 택했습니다.
- source_word: וַיַּעֲלוּ אֶל יִשְׂרָאֵל
  english_pob_choice: went up against Israel
  chosen_korean: 이스라엘을 치러 올라갔습니다
  alternatives_korean:
  - 이스라엘을 향해 올라갔습니다
  - 이스라엘에게 올라갔습니다
  lexicon: HALOT
  rationale: עלה의 군사적 이동을 살리되, אֶל이 이 문맥에서 적대적 접근임을 한국어 관용으로 분명히 했습니다.
- source_word: וַיִּירְאוּ מִפְּנֵי פְלִשְׁתִּים
  english_pob_choice: they were afraid because of the Philistines
  chosen_korean: 블레셋 사람들을 두려워했습니다
  alternatives_korean:
  - 블레셋 때문에 두려워했습니다
  - 블레셋 사람들 앞에서 두려워했습니다
  lexicon: HALOT
  rationale: ‘두려워하다’로 ירא의 기본 의미를 직접 반영했고, 원문의 원인 관계는 한국어 동사구 안에서 자연스럽게 드러나게 했습니다.
