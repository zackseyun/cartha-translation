base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/005.yaml
  text: Then Samuel said[a], “Gather all Israel to Mizpah, and I will pray to Yahweh on your behalf.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''to Yahweh.'' The main text follows the project’s standard rendering of the divine name as ''the LORD.'''
