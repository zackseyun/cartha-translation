source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל קִבְצ֥וּ אֶת כָּל יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑תָ/ה וְ/אֶתְפַּלֵּ֥ל בַּעַדְ/כֶ֖ם אֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/005.yaml
  text: Then Samuel said[a], “Gather all Israel to Mizpah, and I will pray to Yahweh on your behalf.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''to Yahweh.'' The main text follows the project’s standard rendering of the divine name as ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 사무엘이 말했습니다. 「온 이스라엘을 미스바로 모으십시오. 내가 여러분을 위해 야훼께 기도하겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘야훼께’입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속이 서사의 진행을 이끄는 만큼, 한국어에서는 자연스러운 순차 연결인 ‘그러자’로 그 흐름을 살렸습니다.
- source_word: קִבְצוּ
  english_pob_choice: Gather
  chosen_korean: 모으십시오
  alternatives_korean:
  - 모이십시오
  - 소집하십시오
  - 모아오십시오
  lexicon: HALOT
  rationale: 백성을 한곳에 불러 모으는 명령이므로, 한국어에서는 명령형 ‘모으십시오’가 가장 직접적입니다.
- source_word: הַמִּצְפָּתָה
  english_pob_choice: to Mizpah
  chosen_korean: 미스바로
  alternatives_korean:
  - 미스바로 향해
  - 미스바로
  lexicon: HALOT
  rationale: 어미 -ָה의 이동 방향을 반영해 목적지 표시 ‘-로’를 붙였습니다.
- source_word: בַּעַדְכֶם
  english_pob_choice: on your behalf
  chosen_korean: 여러분을 위해
  alternatives_korean:
  - 여러분을 대신하여
  - 여러분을 위하여
  lexicon: HALOT
  rationale: 중보의 의미를 살리되 한국어에서는 가장 자연스러운 ‘~을 위해’로 옮겼습니다. 다만 ‘대신하여’보다 대리·중보의 뉘앙스는 약합니다.
- source_word: יְהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 공용어적 교회 번역어인 ‘주님’ 대신, 본문이 가리키는 신명 표기를 직역 취지에 맞게 ‘야훼’로 두었습니다.
theological_decisions:
- issue: 신명(יהוה)의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 직접 야훼를 사용하므로, 문맥의 언약적 고유성을 보존하기 위해 프로젝트 기본값인 ‘야훼’를 따랐습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
