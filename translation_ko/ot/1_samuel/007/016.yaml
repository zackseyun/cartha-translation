  yaml_path: translation/ot/1_samuel/007/016.yaml
  text: And he would go year by year and make the circuit of Bethel[a], Gilgal, and Mizpah[b], and he judged Israel in all these places.
  footnotes:
  - marker: a
    text: Or "from year to year" or "every year."
    reason: lexical_alternative
  - marker: b
    text: Or "go around"; the Hebrew suggests making a regular circuit among these towns.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 해마다 벧엘과 길갈과 미스바를 두루 다녔으며, 이 모든 곳에서 이스라엘을 재판했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해마다’는 ‘from year to year / every year’의 관용적 반복 의미를 반영한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두루 다녔으며’는 ‘make the circuit of’에 해당하며, 여러 도시를 정기적으로 순회하는 뜻을 드러냅니다.
    reason: lexical_alternative
