theological_decisions:
- issue: 사사 직무의 번역
  chosen_reading: ‘판단하다/다스리다’보다 ‘재판하다’로 번역해 사무엘의 순회 사법 활동을 전면에 드러냈습니다.
  alternative_readings:
  - 이스라엘을 다스렸습니다
  - 이스라엘을 판단했습니다
  rationale: 문맥은 군주적 통치보다 각 지역을 돌며 판결하는 사법적 봉사에 초점을 두므로, 원문의 의미를 가장 직접적으로 전달하는 표현을 선택했습니다.
  doctrine_reference: 사사기·사무엘서의 사사 개념
- issue: 지명 사이 접속
  chosen_reading: ‘벧엘과 길갈과 미스바’를 연속 열거로 유지했습니다.
  alternative_readings:
  - 벧엘, 길갈, 미스바
  - 벧엘과 길갈, 그리고 미스바
  rationale: 히브리어의 단순 병렬 구조를 보존하여 순회 경로의 리듬을 살렸습니다.
  doctrine_reference: 문체/구문 보존
