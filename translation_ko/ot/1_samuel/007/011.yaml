source:
  edition: WLC
  text: וַ/יֵּ֨צְא֜וּ אַנְשֵׁ֤י יִשְׂרָאֵל֙ מִן הַ/מִּצְפָּ֔ה וַֽ/יִּרְדְּפ֖וּ אֶת פְּלִשְׁתִּ֑ים וַ/יַּכּ֕וּ/ם עַד מִ/תַּ֖חַת לְ/בֵ֥ית כָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/011.yaml
  text: Then the men of Israel went out from Mizpah[a], pursued the Philistines[b], and struck them down as far as below Beth-car.
  footnotes:
  - marker: a
    text: Or 'and defeated them as far as below Beth-car.' The Hebrew verb can denote striking in battle with the sense of defeat, not only physical blows.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'below Beth-car,' likely indicating a point lower in elevation than Beth-car.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 이스라엘의 남자들이 미스바에서 나와 블레셋 사람들을 추격하여 벧갈 아래까지[b] 그들을 쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쳤습니다’로 옮긴 히브리어 동사는 전투에서 ‘쳐서 패배시키다’라는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘벧갈 아래’는 지명 벧갈보다 낮은 지점을 가리키는 표현으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  english_pob_choice: the men of Israel
  chosen_korean: 이스라엘 사람들은
  alternatives_korean:
  - 이스라엘의 남자들은
  - 이스라엘 용사들은
  lexicon: HALOT
  rationale: 직역하면 ‘이스라엘의 남자들’이지만, 전투 문맥에서 한국어로는 주어를 자연스럽게 살리되 성별을 과도하게 부각하지 않는 ‘이스라엘 사람들’이 가장 읽기 쉽습니다.
- source_word: מִן הַמִּצְפָּה
  english_pob_choice: from Mizpah
  chosen_korean: 미스바에서
  alternatives_korean:
  - 미스바로부터
  - 미스바 요새에서
  lexicon: HALOT
  rationale: 지명은 음역을 유지하고, 출발점을 나타내는 조사 ‘에서’로 מן의 의미를 간결하게 반영했습니다.
- source_word: וַיִּרְדְּפוּ
  english_pob_choice: pursued
  chosen_korean: 추격하였고
  alternatives_korean:
  - 추격했습니다
  - 뒤쫓았고
  - 추적하였고
  lexicon: HALOT
  rationale: 군사적 맥락의 רדף를 ‘추격하다’로 옮기면, 단순한 뒤따름이 아니라 전투적 पीछ적 의미가 살아납니다.
- source_word: וַיַּכּוּם
  english_pob_choice: struck them down
  chosen_korean: 쳐부수었습니다
  alternatives_korean:
  - 쳐서 무찔렀습니다
  - 때려눕혔습니다
  - 무찔렀습니다
  lexicon: HALOT
  rationale: נכה는 전투에서 ‘치다/쳐서 무찌르다’의 강한 패배 의미를 가질 수 있어, 단순한 ‘죽이다’보다 전투의 승패를 드러내는 표현을 택했습니다.
- source_word: לְבֵית כָּר
  english_pob_choice: Beth-car
  chosen_korean: 베스-갈
  alternatives_korean:
  - 베스-카르
  - 벧갈
  lexicon: HALOT
  rationale: 표준 음역에 맞춰 지명으로 처리했습니다. 본 절의 지명은 위치 표지이므로 번역하지 않았습니다.
theological_decisions:
- issue: 전투 동사의 강도와 결과
  chosen_reading: ‘쳐부수었습니다’로 번역해, 단순 접촉이 아니라 블레셋에 대한 निर्ण정적 패배를 드러냈습니다.
  alternative_readings:
  - ‘쳤습니다’
  - ‘무찔렀습니다’
  - ‘죽였습니다’
  rationale: 히브리어 נכה는 전투 문맥에서 패배/격파를 뜻할 수 있으므로, 본문이 말하는 승리의 힘을 살리되 살상 여부를 과도하게 특정하지 않는 표현이 적절합니다.
  doctrine_reference: 본문 해석상 전투 승리의 서술이며, 교리적 쟁점은 없습니다.
