  - severity: medium
    issue: אַנְשֵׁי יִשְׂרָאֵל을 ‘이스라엘 사람들’로 옮겨 남성 복수 표현이 소거됨
    rationale: 원문은 전투에 나가는 ‘이스라엘의 남자들’을 명시합니다. 이 문맥에서는 ‘이스라엘의 남자들’이 자연스러우면서도 더 충실합니다.
