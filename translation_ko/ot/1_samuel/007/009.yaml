  rationale: 이 프로젝트의 기본 용례에 따라 여호와를 피하고, 본문에 직접 나타난 언약 নাম을 학술적으로 음역한 ‘야훼’를 유지했습니다.
  doctrine_reference: POB glossary — YHWH → 야훼
