  source_fidelity: 히브리어의 핵심 요소들—젖을 먹는 어린 양 한 마리, 온전히 드리는 번제, 이스라엘을 위한 사무엘의 부르짖음, 야훼께서 사무엘에게 응답하심—은 대체로 충실히 반영되었습니다. 다만 ‘전부 번제물로’는 כָּלִיל이 번제를 온전히 드린다는 뜻임을 한국어에서 다소 어색하고 모호하게 전달합니다.
