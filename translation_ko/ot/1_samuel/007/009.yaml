base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/009.yaml
  text: So Samuel took one nursing lamb and offered it as a whole burnt offering to Yahweh. And Samuel cried out to Yahweh on behalf of Israel[a], and Yahweh answered him.
  footnotes:
  - marker: a
    text: Or 'one suckling lamb.' The Hebrew expression refers to a lamb still feeding on milk.
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘은 젖을 먹는 어린 양 한 마리를 가져다가 야훼께 전부 번제물로 바쳤습니다. 그리고 사무엘이 이스라엘을 위해 야훼께 부르짖자, 야훼께서 그에게 응답하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘젖을 빨고 있는 어린 양 한 마리’로 옮길 수 있습니다. 히브리어 표현은 아직 젖을 먹는 양을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טְלֵה חָלָב אֶחָד
  english_pob_choice: one nursing lamb
  chosen_korean: 젖을 먹는 어린 양 한 마리
  alternatives_korean:
  - 젖먹이 양 한 마리
  - 젖을 빨고 있는 어린 양 한 마리
  - 어린 양 한 마리
  lexicon: HALOT
  rationale: חָלָב는 ‘젖/우유’를 가리켜 아직 젖을 먹는 어린 양이라는 뜻이므로, ‘젖을 먹는’으로 자연스럽고 의미를 분명히 살렸습니다.
- source_word: וַיַּעֲלֵה עוֹלָה כָּלִיל
  english_pob_choice: offered it as a whole burnt offering
  chosen_korean: 전부 번제물로 바쳤습니다
  alternatives_korean:
  - 온전히 번제물로 바쳤습니다
  - 전적인 번제물로 드렸습니다
  - 번제로 바쳤습니다
  lexicon: HALOT
  rationale: עוֹלָה는 정규적인 ‘번제’이고, כָּלִיל은 그 제물을 ‘전부/온전히’라는 뜻으로 한정하므로, 제사의 전체성을 드러내는 표현을 택했습니다.
- source_word: בְּעַד יִשְׂרָאֵל
  english_pob_choice: on behalf of Israel
  chosen_korean: 이스라엘을 위해
  alternatives_korean:
  - 이스라엘을 대신하여
  - 이스라엘을 위하여
  - 이스라엘 편에서
  lexicon: HALOT
  rationale: בְּעַד는 여기서 중보·대리의 뉘앙스를 가지므로, 너무 해석적이지 않으면서도 사무엘의 중보 행위를 드러내는 ‘이스라엘을 위해’를 사용했습니다.
- source_word: וַיַּעֲנֵהוּ
  english_pob_choice: answered him
  chosen_korean: 그에게 응답하셨습니다
  alternatives_korean:
  - 그를 들으셨습니다
  - 그에게 대답하셨습니다
  - 응답하셨습니다
  lexicon: HALOT
  rationale: 문맥상 하나님이 사무엘의 부르짖음에 응답하신 것이므로, 기도 응답의 뉘앙스를 살리는 ‘응답하셨습니다’가 가장 적절합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
