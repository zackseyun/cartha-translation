translation:
  language: ko
  text: 그러면 그는 라마로 돌아오곤 했습니다[a]. 그의 집이 거기에 있었기 때문입니다. 그리고 거기서 그는 이스라엘을 다스렸습니다. 그는 거기서 야훼를 위한 제단을 쌓았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, “그의 돌아옴은 라마로였다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשֻׁבָתוֹ
  english_pob_choice: Then he would return
  chosen_korean: 그러면 그는 … 돌아오곤 했습니다
  alternatives_korean:
  - 그리고 그의 돌아옴은
  - 그는 … 돌아왔습니다
  lexicon: HALOT
  rationale: 문맥상 사무엘의 반복적 순환을 가리키므로, 명사형을 직역하기보다 반복성을 살린 서술형으로 옮겼습니다.
- source_word: הָרָמָתָה
  english_pob_choice: to Ramah
  chosen_korean: 라마로
  alternatives_korean:
  - 라마에
  - 라마 쪽으로
  lexicon: HALOT
  rationale: 방향을 나타내는 הָ־를 자연스러운 목적격 조사로 풀어 한국어의 이동 표현으로 처리했습니다.
- source_word: שָׁפַט אֶת יִשְׂרָאֵל
  english_pob_choice: he judged Israel
  chosen_korean: 이스라엘을 다스렸습니다
  alternatives_korean:
  - 이스라엘을 재판했습니다
  - 이스라엘을 심판했습니다
  lexicon: HALOT
  rationale: שׁפט는 여기서 단순 재판 행위보다 사사로서의 통치·재판 역할을 함께 가리키므로, 문맥에 맞게 ‘다스리다’로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼를 위한
  alternatives_korean:
  - 야훼께
  - 여호와께
  lexicon: HALOT
  rationale: 제단의 봉헌 대상을 분명히 드러내기 위해 ‘-를 위한’으로 풀었고, יהוה는 본 번역 원칙에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
