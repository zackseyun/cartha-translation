  source_fidelity: 수정이 필요합니다. 초안은 와예히톨 וַיָּבֹאוּ(‘그들이 왔다’)를 명시적으로 옮기지 않았고, וַיַּעֲלוּ(‘올려 가져갔다’)의 상승 방향도 충분히 드러나지 않습니다. 또한 בַּגִּבְעָה는 아비나답의 집의 위치를 나타내므로 ‘언덕 위에 있는’으로 명확히 하는 것이 적절합니다.
  naturalness: ‘그때’는 문맥상 가능하지만, 본문의 사건 전개는 ‘기럇여아림 사람들이 와서’로 자연스럽고 직접적으로 옮길 수 있습니다. ‘아비나답의 아들 엘르아살’은 ‘그의 아들’보다 선행사를 분명히 하면서도 자연스럽습니다. 합쇼체 종결을 유지했습니다.
  terminology: ‘여호와의 궤’, ‘기럇여아림’, ‘아비나답’, ‘엘르아살’ 및 ‘거룩하게 구별하여’는 한국어 성경 문맥과 원문의 제의적 의미에 부합합니다. ‘기브아’ 가능성은 본문이 아니라 각주에서만 보존합니다.
