  text: וַ/יָּבֹ֜אוּ אַנְשֵׁ֣י קִרְיַ֣ת יְעָרִ֗ים וַֽ/יַּעֲלוּ֙ אֶת אֲר֣וֹן יְהוָ֔ה וַ/יָּבִ֣אוּ אֹת֔/וֹ אֶל בֵּ֥ית אֲבִינָדָ֖ב בַּ/גִּבְעָ֑ה וְ/אֶת אֶלְעָזָ֤ר בְּנ/וֹ֙ קִדְּשׁ֔וּ לִ/שְׁמֹ֖ר אֶת אֲר֥וֹן יְהוָֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/001.yaml
  text: Then the men of Kiriath-jearim came and brought up the ark of Yahweh[a], and they brought it into the house of Abinadab on the hill[b]. And they consecrated Eleazar his son to keep the ark of Yahweh.
  footnotes:
  - marker: a
    text: Or possibly, “at Gibeah,” if בַּגִּבְעָה is taken as a place name rather than the common noun “the hill.”
    reason: alternative_reading
  - marker: b
    text: Hebrew uses the divine name YHWH; rendered here as “the LORD” according to the project’s standard practice.
    reason: lexical_alternative
translation:
  language: ko
  text: 기럇여아림 사람들이 와서 여호와의 궤를 가져올라 언덕 위에 있는 아비나답의 집으로 옮겼습니다. 그리고 아비나답의 아들 엘르아살을 거룩하게 구별하여 여호와의 궤를 지키게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그 언덕’이라는 일반명사를 사용합니다. 이를 지명 ‘기브아’로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַנְשֵׁי קִרְיַת יְעָרִים
  english_pob_choice: the men of Kiriath-jearim
  chosen_korean: 기럇여아림 사람들
  alternatives_korean:
  - 기럇여아림 남자들
  - 기럇여아림의 사람들
  lexicon: HALOT
  rationale: אַנְשֵׁי는 문자적으로 ‘사람들’보다 ‘남자들’에 가깝지만, 한국어 성경 문맥에서는 자연스럽고 간결하게 ‘기럇여아림 사람들’로 옮기는 것이 가장 읽기 좋습니다.
- source_word: אֲרוֹן יְהוָה
  english_pob_choice: the ark of Yahweh
  chosen_korean: 여호와의 궤
  alternatives_korean:
  - 야훼의 궤
  - 여호와의 언약궤
  lexicon: HALOT
  rationale: אֲרוֹן은 이 제의적 문맥에서 ‘궤’가 적절하며, POB의 YHWH 대응은 본문 관례에 따라 ‘여호와’로 옮겼습니다.
- source_word: בַּגִּבְעָה
  english_pob_choice: on the hill
  chosen_korean: 그 언덕에 있는
  alternatives_korean:
  - 기브아에 있는
  - 그 산 위의
  lexicon: HALOT
  rationale: 본문은 관사 있는 일반명사로 읽어 ‘그 언덕’이 가장 직접적입니다. 장소명 ‘기브아’로 단정하지 않고 문맥상의 거주 위치를 자연스럽게 살렸습니다.
- source_word: קִדְּשׁוּ
  english_pob_choice: consecrated
  chosen_korean: 거룩하게 구별하여
  alternatives_korean:
  - 성별하여
  - 봉헌하여
  lexicon: HALOT
  rationale: קדשׁ의 핵심은 성스러운 용도로 ‘구별’하는 것이므로, 한국어에서는 ‘거룩하게 구별하다’가 제의적 의미를 가장 분명하게 드러냅니다.
- source_word: לִשְׁמֹר
  english_pob_choice: to keep
  chosen_korean: 지키게 했습니다
  alternatives_korean:
  - 보호하게 했습니다
  - 보살피게 했습니다
  lexicon: HALOT
  rationale: 여기서는 궤를 맡아 보호하는 관리 의무가 핵심이므로 ‘지키다’가 가장 간명하고, ‘keep’의 의미를 잘 반영합니다.
theological_decisions:
- issue: יהוה(YHWH)의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 제공된 영어 POB가 본문에서 통상적 경건어법을 따르고 있어, 한국어 본문도 같은 관례를 반영해 ‘여호와’로 통일했습니다.
  doctrine_reference: POB project default for Korean publication text in this draft
- issue: בַּגִּבְעָה를 지명으로 볼지 일반명사로 볼지
  chosen_reading: 그 언덕
  alternative_readings:
  - 기브아
  rationale: 히브리어 형태가 관사 있는 일반명사로 읽히므로, 지명화하지 않고 ‘그 언덕’으로 옮겨 본문의 직접적 의미를 유지했습니다.
  doctrine_reference: 'Translation philosophy #1, source-language primacy'
