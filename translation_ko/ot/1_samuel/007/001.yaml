revisions:
- from: 그때 기럇여아림 사람들은 여호와의 궤를 가져다가 그 언덕에 있는 아비나답의 집으로 옮겼고, 그들은 그의 아들 엘르아살을 거룩하게 구별하여 여호와의 궤를 지키게 했습니다.[a]
  to: 기럇여아림 사람들이 와서 여호와의 궤를 가져올라 언덕 위에 있는 아비나답의 집으로 옮겼습니다. 그리고 아비나답의 아들 엘르아살을 거룩하게 구별하여 여호와의 궤를 지키게 했습니다.[a]
  rationale: 원문의 세 연속 서사 동작, 곧 ‘왔다’, ‘올려 가져갔다’, ‘가져왔다’를 한국어에서 자연스럽게 반영했습니다. 지명 여부가 논쟁되는 בַּגִּבְעָה는 본문에서 일반명사 ‘언덕’으로 유지하고, 대안인 ‘기브아’는 각주로 보존했습니다. 아들 관계는 바로 앞의 아비나답을 선행사로 명시하여 한국어의 대명사 모호성을 줄였습니다.
