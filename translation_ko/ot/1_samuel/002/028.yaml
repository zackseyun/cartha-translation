source:
  edition: WLC
  text: וּ/בָחֹ֣ר אֹ֠ת/וֹ מִ/כָּל שִׁבְטֵ֨י יִשְׂרָאֵ֥ל לִ/י֙ לְ/כֹהֵ֔ן לַ/עֲל֣וֹת עַֽל מִזְבְּחִ֗/י לְ/הַקְטִ֥יר קְטֹ֛רֶת לָ/שֵׂ֥את אֵפ֖וֹד לְ/פָנָ֑/י וָֽ/אֶתְּנָ/ה֙ לְ/בֵ֣ית אָבִ֔י/ךָ אֶת כָּל אִשֵּׁ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/028.yaml
  text: And did I not choose him from all the tribes of Israel to be my priest[a], to go up to my altar, to burn incense, to wear an ephod before me? And I gave to your father's house all the food offerings of the sons of Israel.
  footnotes:
  - marker: a
    text: Or, more literally, 'all the offerings made by fire of the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 이스라엘의 모든 지파 가운데서 그를 택하여 내 제사장이 되게 하고, 내 제단에 올라가 분향하며 내 앞에서 에봇을 입게 하지 않았느냐? 또 내가 너의 아버지 집에 이스라엘 자손의 모든 화제물을 주었다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘이스라엘 자손이 불로 드리는 모든 제물’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָחֹר אֹתוֹ
  english_pob_choice: did I not choose him
  chosen_korean: 내가 … 그를 택하여 … 하지 않았느냐
  alternatives_korean:
  - 내가 … 그를 선택하지 않았느냐
  - 내가 … 그를 뽑지 않았느냐
  lexicon: HALOT
  rationale: 수사 의문문으로 된 강한 확언을 한국어에서도 의문형으로 살리되, 선택 행위는 ‘택하다’가 문맥상 가장 자연스럽고 성경적입니다.
- source_word: לִי לְכֹהֵן
  english_pob_choice: to be my priest
  chosen_korean: 내 제사장으로
  alternatives_korean:
  - 나를 위한 제사장으로
  - 내를 섬기는 제사장으로
  lexicon: HALOT
  rationale: 두 개의 ל가 나타내는 소속과 직분을 압축해, 하나님께 속한 제사장이라는 관계를 간결하게 드러냈습니다.
- source_word: לְהַקְטִיר קְטֹרֶת
  english_pob_choice: to burn incense
  chosen_korean: 분향하며
  alternatives_korean:
  - 향을 피우며
  - 향을 사르며
  lexicon: HALOT
  rationale: 제의적 관용구를 현대 한국어로 자연스럽게 옮기되, 구체적 의식 행위를 유지하기 위해 ‘분향하다’를 택했습니다.
- source_word: לָשֵׂאת אֵפוֹד לְפָנַי
  english_pob_choice: to wear an ephod before me
  chosen_korean: 내 앞에서 에봇을 메게
  alternatives_korean:
  - 내 앞에서 에봇을 입게
  - 내 앞에서 에봇을 지니게
  lexicon: HALOT
  rationale: POB의 최종 선택인 ‘wear’보다 히브리어 נשא의 기본 의미에 더 가깝게 ‘메다’를 살렸고, 제사장 예복인 에봇은 음역해 특수한 제의 वस्त를 보존했습니다.
- source_word: אֶת כָּל אִשֵּׁי בְּנֵי יִשְׂרָאֵל
  english_pob_choice: all the food offerings of the sons of Israel
  chosen_korean: 이스라엘 자손의 모든 화제물
  alternatives_korean:
  - 이스라엘 자손의 모든 불로 드리는 제물
  - 이스라엘 자손의 모든 음식제물
  lexicon: HALOT
  rationale: אִשֵּׁי의 문자적 의미를 따라 ‘화제물’로 옮겨, 제의적·신학적 뉘앙스를 보존했습니다. POB 각주가 제시한 ‘offerings made by fire’의 대안도 이 표현이 가장 잘 반영합니다.
theological_decisions:
- issue: 제사장 직분과 제의 행위의 배열
  chosen_reading: ‘내 제사장으로’와 이어지는 ‘제단에 올라가 분향하며 … 에봇을 메게’의 순서를 그대로 유지했습니다.
  alternative_readings:
  - ‘내를 섬기는 제사장으로’처럼 기능을 풀어 쓰는 방식
  - 제의 행위를 한 문장으로 묶어 요약하는 방식
  rationale: 본문은 선택—직분—제단 봉사—분향—에봇 착용의 구체적 열거로 책임과 특권을 강조하므로, 이를 압축하지 않고 드러내는 편이 원문의 힘을 보존합니다.
  doctrine_reference: Translation philosophy §§5–6
- issue: אִשֵּׁי의 번역
  chosen_reading: ‘화제물’
  alternative_readings:
  - ‘불로 드리는 제물’
  - ‘음식제물’
  rationale: 본문은 단순한 제물 일반이 아니라 불에 의해 드려지는 제의적 몫을 가리키므로, 전통적 교회어보다 원문 구분이 선명한 용어가 필요합니다.
  doctrine_reference: Translation philosophy §6
