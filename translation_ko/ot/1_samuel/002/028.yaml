  source_fidelity: 첫 수사 의문문의 선택·직분·제의 행위 열거는 히브리어를 충실히 반영합니다. 그러나 וָאֶתְּנָה는 영어 POB의 감사 추적과 같이 과거 서술로 옮기는 것이 안전하며, 현 번역처럼 별도의 ‘주지 않았느냐?’로 만들면 원문의 진술을 불필요하게 독립 수사 의문문으로 바꿉니다. 또한 에봇은 이 문맥에서 ‘메다’보다 ‘입다’가 자연스럽고, נשא의 문맥적 ‘착용하다’ 의미를 적절히 반영합니다.
  naturalness: ‘내 제사장이 되게 하고’는 ‘내 제사장으로’보다 목적 관계를 더 분명하고 자연스럽게 드러냅니다. ‘에봇을 입게’는 제사장 예복에 쓰는 현대 표준어로 자연스럽습니다. ‘화제물’은 전통적 제의 용어이므로, 문자적 뜻을 밝히는 각주를 유지하는 것이 좋습니다.
