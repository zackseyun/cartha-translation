translation:
  language: ko
  text: 사무엘은 야훼 앞에서 섬기고 있었는데, 아마포 에봇을 입은 소년이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘야훼의 얼굴/임재 앞에서’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמוּאֵל
  english_pob_choice: Now Samuel
  chosen_korean: 사무엘은
  alternatives_korean:
  - 그리고 사무엘은
  - 이제 사무엘은
  lexicon: 고유명사
  rationale: 서술의 자연스러운 흐름을 위해 문두 접속은 한국어에서 생략하고 주어를 바로 제시했습니다.
- source_word: מְשָׁרֵת
  english_pob_choice: was ministering
  chosen_korean: 섬기고 있었는데
  alternatives_korean:
  - 봉사하고 있었는데
  - 시중들고 있었는데
  - 섬겼는데
  lexicon: HALOT
  rationale: 진행 중인 행위를 살리면서, 제의적·성소적 맥락에서 ‘serve’보다 ‘섬기다’가 더 적절합니다.
- source_word: אֶת פְּנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 얼굴 앞에서
  - 야훼의 임재 앞에서
  - 주님 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자적 배경인 ‘얼굴/임재’를 유지하되, 한국어에서는 ‘앞에서’가 가장 자연스럽고 원문의 관계를 드러냅니다.
- source_word: חָגוּר אֵפוֹד בָּד
  english_pob_choice: clothed with a linen ephod
  chosen_korean: 아마포 에봇을 입은
  alternatives_korean:
  - 아마포 에봇을 두른
  - 아마포 에봇을 걸친
  - 리넨 에봇을 입은
  lexicon: HALOT
  rationale: ‘에봇’은 음역을 유지하고, בד는 제의복 문맥의 ‘아마포’로 옮겼습니다. ‘입은’은 현대 한국어에서 옷차림을 가장 자연스럽게 나타냅니다.
- source_word: נַעַר
  english_pob_choice: a boy
  chosen_korean: 소년이었습니다
  alternatives_korean:
  - 아들이었습니다
  - 어린아이였습니다
  - 청년이었습니다
  lexicon: HALOT
  rationale: 문맥상 사무엘의 어린 연령을 나타내므로 ‘소년’이 가장 무난하며, ‘청년’은 과도하고 ‘어린아이’는 너무 낮습니다.
theological_decisions:
- issue: יהוה(YHWH)의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 본문은 신명기적 전통의 고유 이름을 직접 사용하므로, 프로젝트 기본어인 ‘야훼’를 본문에 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
