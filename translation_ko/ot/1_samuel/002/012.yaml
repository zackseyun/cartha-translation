  - 관심이 없었습니다
  lexicon: HALOT
  rationale: ‘알다’를 그대로 살려 관계적·언약적 무지와 불순종의 긴장을 보존합니다.
- source_word: אֶת יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: Project default / source-language alignment
  rationale: 히브리어 고유명사 יהוה를 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 영어 POB의 ‘the LORD’보다 원문 식별성을 높였습니다.
- source_word: וּ/בְנֵי עֵלִי
  english_pob_choice: Now Eli’s sons
  chosen_korean: 엘리의 아들들은
  alternatives_korean:
  - 그리고 엘리의 아들들은
  - 이제 엘리의 아들들은
  lexicon: Hebrew narrative syntax
  rationale: תחילת 서술 전환을 한국어에서는 자연스러운 주제 전개로 처리해, 군더더기 없이 본문 진술을 시작합니다.
theological_decisions:
- issue: ‘야훼를 알지 못했다’의 관계적·언약적 함의 유지 여부
  chosen_reading: 본문의 직설적 표현을 유지해 단순 지식 부재가 아니라 언약적 불순종의 무게를 남겼습니다.
  alternative_readings:
  - ‘야훼를 인정하지 않았습니다’
  - ‘야훼를 전혀 중요하게 여기지 않았습니다’
  rationale: 히브리어 יָדַע는 단순 인지보다 관계적 인정을 포함할 수 있으므로, 해석을 앞세우지 않고 본문의 긴장을 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
