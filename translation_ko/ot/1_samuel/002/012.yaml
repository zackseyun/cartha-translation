  lexicon: HALOT
  rationale: ‘알다’를 그대로 살려 관계적·언약적 무지와 불순종의 긴장을 보존합니다.
- source_word: אֶת יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
