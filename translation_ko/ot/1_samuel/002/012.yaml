translation:
  language: ko
  text: 엘리의 아들들은 무가치한 사람들이었습니다[a]. 그들은 야훼를 알지 못했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘무가치함의 아들들’로, 전통적으로는 ‘벨리알의 아들들’이라고도 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼를 인정하지 않았습니다’ / ‘야훼를 중요하게 여기지 않았습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בְלִיָּעַל
  english_pob_choice: worthless men
  chosen_korean: 무가치한 사람들
  alternatives_korean:
  - 쓸모없는 사람들
  - 악한 사람들
  - 벨리알의 아들들
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자적 뿌리인 ‘무가치함’을 살리면서도, 현대 한국어에서 자연스럽고 도덕적 타락의 뉘앙스를 전달합니다.
- source_word: לֹא יָדְעוּ
  english_pob_choice: did not know
  chosen_korean: 알지 못했습니다
  alternatives_korean:
