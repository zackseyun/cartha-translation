base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/027.yaml
  text: 'And a man of God came to Eli and said to him, “Thus says the LORD: Did I indeed reveal myself to your father''s house when they were in Egypt, belonging to Pharaoh''s house?”'
translation:
  language: ko
  text: 하나님의 사람이 엘리에게 와서 그에게 말했습니다. “야훼께서 이같이 말씀하십니다. 내가 이집트에 있었고 바로의 집에 속해 있던 너의 조상들의 집에 정말로 나를 나타냈느냐?”[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘바로의 집에 속하여 있을 때’라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  english_pob_choice: a man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님 사람
  - 하나님의 종
  lexicon: אִישׁ, אֱלֹהִים
  rationale: 히브리어 관용구로서 예언자적 권위를 지닌 인물을 가리키므로, 자연스럽고 표준적인 한국어 표현인 ‘하나님의 사람’을 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: 이 본문은 직접적인 야훼 말씀 서두이므로, 프로젝트 기본값에 따라 고유 신명은 ‘야훼’로 옮겼습니다.
- source_word: נִגְלֹה נִגְלֵיתִי
  english_pob_choice: Did I indeed reveal myself
  chosen_korean: 정말로 나를 나타냈느냐
  alternatives_korean:
  - 참으로 나를 드러냈느냐
  - 내가 실제로 나를 보였느냐
  lexicon: נגל
  rationale: 강조형 절대부정/부정의 중복이 주는 강조를 살려 ‘정말로’로 옮기고, 자기현현의 의미를 ‘나를 나타냈느냐’로 자연스럽게 표현했습니다.
- source_word: בֵּית אָבִיךָ ... לְבֵית פַּרְעֹה
  english_pob_choice: your father's house ... belonging to Pharaoh's house
  chosen_korean: 너의 조상들의 집에 ... 바로의 집에 속해 있던
  alternatives_korean:
  - 너의 아비의 집에 ... 파라오의 집에 속해 있던
  - 너의 아버지 집에 ... 바로의 집의 소속이던
  lexicon: בית, פרעה
  rationale: POB의 ‘belonging to Pharaoh’s house’를 본문 의미에 맞게 ‘바로의 집에 속해 있던’으로 옮겨, 이스라엘의 처지가 이집트 권력에 예속되어 있었음을 드러냈습니다.
theological_decisions:
- issue: 야훼의 자기계시 질문의 직접성
  chosen_reading: ‘내가 … 나를 나타냈느냐?’를 직설형 질문으로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘나를 보이셨느냐’로 순화
  - 설명형으로 바꾸어 ‘계시하셨느냐’로 의역
  rationale: 본문의 수사적 질문은 야훼의 과거 자기계시를 법정적·언약적 방식으로 환기하므로, 직설성을 유지하는 것이 본문 힘을 보존합니다.
  doctrine_reference: 언약사적 자기계시
- issue: ‘바로의 집에 속해 있던’의 예속 뉘앙스
  chosen_reading: 단순 위치가 아니라 예속 상태를 나타내는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘바로의 집에서’처럼 중립적으로 번역
  - ‘바로의 집 아래에’로 재구성
  rationale: 히브리어 구문과 POB의 조정은 이스라엘이 이집트 안에 있으면서도 바로의 권세 아래 있었음을 시사하므로, 소속/예속의 뉘앙스를 살렸습니다.
  doctrine_reference: 출애굽 기억과 야훼의 구속사
