  revised_text: 엘리는 매우 늙었고, 자기 아들들이 온 이스라엘에게 하는 모든 일을 들었습니다. 또 그들이 회막 입구에서 섬기는 여자들[a]과 함께 누웠다는 것도 들었습니다.
