- from: 엘리는 매우 늙었고, 자기 아들들이 온 이스라엘에 대해 하는 모든 일을 들었습니다. 또 그들이 회막 문 입구에서 섬기는 여자들과 함께 누웠다는 것도 들었습니다.[a]
  to: 엘리는 매우 늙었고, 자기 아들들이 온 이스라엘에게 하는 모든 일을 들었습니다. 또 그들이 회막 입구에서 섬기는 여자들[a]과 함께 누웠다는 것도 들었습니다.
  rationale: 행위의 대상을 더 충실히 드러내도록 '온 이스라엘에게'로 고치고, 중복된 장소 표현을 '회막 입구'로 다듬었습니다. 또한 어휘 대안 각주를 해당 명사구에 붙여 그 적용 범위를 명확히 했습니다. 성적 행위를 가리키는 원문의 완곡어법은 '함께 누웠다'로 유지했습니다.
  reviewer_model: gpt-5.6-terra
