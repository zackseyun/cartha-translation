id: 1SA.2.22
reference: 1 Samuel 2:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עֵלִ֖י זָקֵ֣ן מְאֹ֑ד וְ/שָׁמַ֗ע אֵת֩ כָּל אֲשֶׁ֨ר יַעֲשׂ֤וּ/ן בָּנָי/ו֙ לְ/כָל יִשְׂרָאֵ֔ל וְ/אֵ֤ת אֲשֶֽׁר יִשְׁכְּבוּ/ן֙ אֶת הַ/נָּשִׁ֔ים הַ/צֹּ֣בְא֔וֹת פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/022.yaml
  text: Now Eli was very old[a], and he heard all that his sons were doing to all Israel, and that they were lying with the women who served at the entrance to the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'the women who assembled at the entrance to the tent of meeting.' The Hebrew participle can denote assembling or serving in an organized way.
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리는 매우 늙었고, 자기 아들들이 온 이스라엘에 대해 하는 모든 일을 들었습니다. 또 그들이 회막 문 입구에서 섬기는 여자들과 함께 누웠다는 것도 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사는 '모이다' 또는 '봉사하다'의 의미를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  english_pob_choice: was very old
  chosen_korean: 매우 늙었고
  alternatives_korean:
  - 몹시 늙었고
  - 아주 늙었고
  - 매우 늙었습니다
  lexicon: HALOT
  rationale: 서술적 상태를 자연스러운 현대 한국어로 옮기되, '매우'로 강조를 살리고 '늙었고'로 이어지는 서술 흐름을 유지했습니다.
- source_word: וְשָׁמַע
  english_pob_choice: and he heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 듣고 있었습니다
  - 들었고
  - 듣게 되었습니다
  lexicon: HALOT
  rationale: 서사 진행에서 단순 과거 사실 진술로 읽는 것이 자연스럽기 때문에, 반복 뉘앙스를 덧붙이지 않고 평이하게 옮겼습니다.
- source_word: הַצֹּבְאוֹת
  english_pob_choice: women who served
  chosen_korean: 섬기는 여자들
  alternatives_korean:
  - 모여 있는 여자들
  - 봉사하는 여자들
  - 근무하는 여자들
  lexicon: HALOT
  rationale: 이 분사는 조직적 봉사를 나타낼 수 있으므로, 성막 문맥에 맞는 '섬기는'을 택했습니다. '봉사하는'보다 성막 예배 맥락이 더 직접적으로 드러납니다.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: at the entrance to the tent of meeting
  chosen_korean: 회막 문 입구에서
  alternatives_korean:
  - 회막의 입구에서
  - 회막 입구에서
  - 증거막 문 입구에서
  lexicon: HALOT
  rationale: 성막 관련 정형 표현을 살리면서도 한국어로 간결하게 자연스럽게 들리도록 '회막 문 입구'로 옮겼습니다.
theological_decisions:
- issue: 여자들의 역할을 어떻게 드러낼지
  chosen_reading: '''섬기는 여자들''로 옮겨, 단순한 집합이 아니라 성막 입구에서의 기능적 봉사를 드러냈습니다.'
  alternative_readings:
  - 모여 있는 여자들
  - 봉사하는 여자들
  rationale: 히브리어 분사는 단순 집합도 가능하지만, 출애굽기 38:8과 연결되는 성막 문맥에서는 조직된 봉사가 더 적절합니다. 후대의 제도적 호칭을 덧씌우지 않되, 기능은 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 성적 부정을 어떻게 표현할지
  chosen_reading: '''함께 누웠다''를 사용해 히브리어의 관용적 완곡어법을 그대로 살렸습니다.'
  alternative_readings:
  - 동침했다
  - 잠자리를 같이했다
  - 관계를 맺었다
  rationale: 원문은 노골적 표현이 아니라 통상적 완곡어법을 쓰므로, 의미를 분명히 하면서도 원문의 등록을 유지하는 표현이 가장 적절합니다.
  doctrine_reference: Translation philosophy §6
