id: 1SA.2.32
reference: 1 Samuel 2:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִבַּטְתָּ֙ צַ֣ר מָע֔וֹן בְּ/כֹ֥ל אֲשֶׁר יֵיטִ֖יב אֶת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה זָקֵ֛ן בְּ/בֵיתְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/032.yaml
  text: You will look on the distress of the dwelling in all the good that he does for Israel[a], and there will not be an old man in your house all the days.
  footnotes:
  - marker: a
    text: Or 'an adversary in the dwelling,' 'distress at the sanctuary,' or similar; the Hebrew phrase is difficult.
    reason: alternative_reading
translation:
  language: ko
  text: 당신은 그 처소의 환난을 보게 될 것이며, 그가 이스라엘에게 행하는 모든 선한 일 가운데에서, 당신의 집에는 모든 날 동안 늙은 남자가 하나도 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 매우 난해합니다. ‘처소의 환난’, ‘그 안의 대적’, ‘성소에서의 환난’ 등으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִבַּטְתָּ
  english_pob_choice: you will look on
  chosen_korean: 보게 될 것이며
  alternatives_korean:
  - 바라보게 될 것이며
  - 주시하게 될 것이며
  - 보게 되실 것입니다
  lexicon: HALOT
  rationale: 히필 נבט의 기본 의미인 ‘보다/주목하다’를 살려 자연스러운 미래 서술로 옮겼습니다. 여기서는 감정어를 덧붙이지 않고 단순한 관조를 유지하는 것이 원문의 직접성을 잘 드러냅니다.
- source_word: צַר מָעוֹן
  english_pob_choice: distress of the dwelling
  chosen_korean: 그 처소의 환난
  alternatives_korean:
  - 그 처소의 고통
  - 성소의 환난
  - 그 거처의 압박
  lexicon: HALOT
  rationale: 문구가 난해하므로 POB의 해석적 선택을 반영하되, ‘처소’로 מָעוֹן의 거처/거주지 의미를 살리고 ‘환난’으로 צַר의 곤란·재난 뉘앙스를 담았습니다.
- source_word: בְּכֹל אֲשֶׁר יֵיטִיב אֶת־יִשְׂרָאֵל
  english_pob_choice: in all the good that he does for Israel
  chosen_korean: 이스라엘에게 행하는 모든 선한 일 가운데에서
  alternatives_korean:
  - 이스라엘을 위해 행하는 모든 좋은 일 속에서
  - 이스라엘을 향해 베푸는 모든 선함 가운데에서
  - 이스라엘에게 좋은 일을 하는 모든 때에
  lexicon: HALOT
  rationale: ‘행하는’으로 히필의 동작성을 살리고, ‘선한 일’로 칭찬 가능한 유익을 포괄적으로 표현했습니다. 전치사적 관계는 한국어의 ‘~가운데에서’로 옮겨 원문의 포괄적 범위를 유지했습니다.
- source_word: זָקֵן
  english_pob_choice: an old man
  chosen_korean: 늙은 남자
  alternatives_korean:
  - 늙은 사람
  - 노인
  - 연로한 남자
  lexicon: HALOT
  rationale: 이곳은 직분이 아니라 연령을 가리키므로, 가족/가문 단위의 남성 후계가 끊긴다는 문맥을 분명히 하기 위해 ‘남자’를 살렸습니다. ‘노인’보다 더 직설적인 원어의 판단 문장을 유지합니다.
- source_word: בְּבֵיתְךָ
  english_pob_choice: in your house
  chosen_korean: 당신의 집에는
  alternatives_korean:
  - 당신의 집안에는
  - 당신의 집에는
  - 당신의 가문에는
  lexicon: HALOT
  rationale: 히브리어 ‘집’은 가문/혈통까지 포함할 수 있으나, 한국어에서는 기본형을 유지하고 문맥으로 가문적 의미가 전달되도록 했습니다.
theological_decisions:
- issue: צַר מָעוֹן의 난해한 의미 보존
  chosen_reading: ‘그 처소의 환난’으로 옮겨, 특정한 적대자나 단정적 성소 해석을 과도하게 고정하지 않았습니다.
  alternative_readings:
  - ‘그 처소의 대적’
  - ‘성소에서의 환난’
  - ‘그 거처의 압박’
  rationale: 히브리어가 본문상 난해하므로, 해석을 한쪽으로 과도하게 밀지 않고 POB의 긴장을 유지하는 번역이 필요합니다. 이는 독자가 원문의 불확실성을 인지하게 하며, 본문비평·어휘 해석의 여지를 보존합니다.
  doctrine_reference: Translation philosophy §3
