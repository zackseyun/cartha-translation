  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 언약적 신명은 학술적 음역인 ‘야훼’로 옮겨야 하며, 전통 교회어인 ‘여호와’는 사용하지 않았습니다.
- source_word: יֵחַתּוּ
  english_pob_choice: will be shattered
  chosen_korean: 깨어질 것입니다
  alternatives_korean:
  - 부서질 것입니다
  - 무너질 것입니다
  - 두려워할 것입니다
  lexicon: HALOT
  rationale: 문맥이 승리와 심판의 진술이므로 단순한 정서적 ‘두려워함’보다 패배로 인한 붕괴를 드러내는 표현이 필요합니다.
- source_word: מְרִיבוֹ עָלָיו
  english_pob_choice: the LORD’s adversaries
  chosen_korean: 야훼의 대적들
  alternatives_korean:
  - 그를 대적하는 자들
  - 야훼와 다투는 자들
  lexicon: HALOT
  rationale: 대항·대적의 의미를 살리면서, 대명사 참조를 한국어에서 분명하게 드러내기 위해 ‘야훼의 대적들’로 옮겼습니다.
- source_word: מְשִׁיחוֹ
  english_pob_choice: his Messiah
  chosen_korean: 자기 메시아
  alternatives_korean:
  - 자기 기름부음 받은 자
  - 자기 기름부음 받은 이
  - 자기 그리스도
  lexicon: HALOT
  rationale: 메시아 직함의 종말론적·정경적 무게를 보존하기 위해 ‘메시아’를 택했고, 전통적 교회어 ‘그리스도’는 여기서는 직함 표지를 약화시킬 수 있어 피했습니다.
theological_decisions:
- issue: מְשִׁיחוֹ를 왕정 맥락에서 어떻게 처리할지
  chosen_reading: ‘자기 메시아’로 번역하여 즉각적 왕정 의미와 더 넓은 메시아적 울림을 함께 보존합니다.
  alternative_readings:
  - ‘자기 기름부음 받은 자’
  - ‘자기 왕’
  rationale: 본문은 ‘자기 왕’과 병렬을 이루지만, 히브리어 어휘 자체가 메시아적 표제의 근원이므로 이를 약화시키지 않는 것이 정경적 독해에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve messianic significance where supported by context.'
