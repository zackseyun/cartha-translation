source:
  edition: WLC
  text: יְהוָ֞ה יֵחַ֣תּוּ מריב/ו על/ו בַּ/שָּׁמַ֣יִם יַרְעֵ֔ם יְהוָ֖ה יָדִ֣ין אַפְסֵי אָ֑רֶץ וְ/יִתֶּן עֹ֣ז לְ/מַלְכּ֔/וֹ וְ/יָרֵ֖ם קֶ֥רֶן מְשִׁיחֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/010.yaml
  text: Yahweh’s adversaries will be shattered[a]; he will thunder against them from heaven. Yahweh will judge the ends of the earth[c][b]; he will give strength to his king and lift up the horn of his anointed.
  footnotes:
  - marker: a
    text: Or, “those who contend with him” for “the LORD’s adversaries.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “in heaven”; rendered “from heaven” in English to express the source of the thunder.
    reason: lexical_alternative
  - marker: c
    text: Or, “his anointed one.” Hebrew מְשִׁיחוֹ (meshicho) can denote the LORD’s anointed king and also carries messianic significance.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 대적들은 산산이 부서질 것입니다[a]. 그들을 향해 하늘에서[b] 천둥을 치실 것입니다. 야훼께서는 땅 끝까지 심판하실 것입니다. 그분은 자기 왕에게 힘을 주시고, 자기 기름부음 받은 자의 뿔을 높이실 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 대적하는 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘하늘들 안에서’입니다. 문맥상 천둥이 하늘에서 일어남을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 מְשִׁיחוֹ는 문자적으로 ‘그의 기름부음 받은 자’입니다. ‘그의 메시아’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
