id: 1SA.2.33
reference: 1 Samuel 2:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֗ישׁ לֹֽא אַכְרִ֤ית לְ/ךָ֙ מֵ/עִ֣ם מִזְבְּחִ֔/י לְ/כַלּ֥וֹת אֶת עֵינֶ֖י/ךָ וְ/לַ/אֲדִ֣יב אֶת נַפְשֶׁ֑/ךָ וְ/כָל מַרְבִּ֥ית בֵּיתְ/ךָ֖ יָמ֥וּתוּ אֲנָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/033.yaml
  text: But I will not cut off every man of yours from beside my altar[a], to make your eyes fail and your soul grieve; and all the increase of your house will die by the sword of men.
  footnotes:
  - marker: a
    text: Or, 'will die in the prime of life.' The Hebrew literally says 'will die as men.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 내가 네게 속한 사람을 모두 내 제단 곁에서 끊어 버리지는 않겠습니다. 이는 네 눈을 쇠하게 하고 네 마음을 괴롭게 하려는 것입니다. 네 집에서 번성할 모든 이는 장정으로 죽을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한창 나이에 죽을 것입니다.’ 히브리어는 직역하면 ‘사람들로 죽을 것이다’라고 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ לֹא אַכְרִית לְךָ מֵעִם מִזְבְּחִי
  english_pob_choice: I will not cut off every man of yours from beside my altar
  chosen_korean: 나는 너의 제단 곁에서 너의 남자 하나도 끊어 버리지 않아서
  alternatives_korean:
  - 나는 너의 제단 곁에서 너의 사람 하나도 끊지 않아서
  - 나는 너의 제단 곁에서 너의 남자들을 모두 끊지 않아서
  lexicon: HALOT
  rationale: אַכְרִית의 ‘cut off’는 관계·직분의 제거를 드러내므로 ‘끊어 버리다’로 옮겼고, מֵעִם은 단순한 출처가 아니라 ‘곁에서’라는 근접성을 살렸습니다.
- source_word: לְכַלּוֹת אֶת עֵינֶי/ךָ וְלַאֲדִיב אֶת נַפְשֶׁ/ךָ
  english_pob_choice: to make your eyes fail and your soul grieve
  chosen_korean: 네 눈이 쇠하고 네 혼이 괴롭게 하겠으며
  alternatives_korean:
  - 네 눈이 상하고 네 영혼이 슬프게 하겠으며
  - 네 눈을 쇠하게 하고 네 혼을 슬프게 하겠으며
  lexicon: HALOT
  rationale: 두 목적절은 결과를 나타내므로 한국어에서도 ‘-게 하다’ 구조로 살렸고, עֵינַיִם의 관용적 소진은 ‘쇠하다’로, נֶפֶשׁ은 여기서 내면의 고통을 드러내는 ‘혼’으로 옮겼습니다.
- source_word: וְכָל מַרְבִּית בֵּיתְ/ךָ יָמ֥וּתוּ אֲנָשִׁים
  english_pob_choice: and all the increase of your house will die by the sword of men
  chosen_korean: 네 집의 모든 번성한 자는 사람들에 의하여 죽을 것입니다
  alternatives_korean:
  - 네 집의 모든 증가는 사람들에 의하여 죽을 것입니다
  - 네 집의 모든 자손은 사람들에 의해 죽을 것입니다
  lexicon: HALOT
  rationale: מַרְבִּית는 문자적으로 ‘증가’이지만 사람들을 가리키므로 문맥상 자연스러운 ‘번성한 자’로 옮겼고, אֲנָשִים은 원문의 인간-집단적 폭력을 살려 ‘사람들에 의하여’로 처리했습니다.
theological_decisions:
- issue: 남은 자가 완전히 제거되지 않는다는 긴장
  chosen_reading: 제단 곁에서 완전히 끊기지는 않지만, 남아 있는 자들도 수치와 슬픔 속에서 심판을 겪는다는 뜻을 살렸습니다.
  alternative_readings:
  - 제사직에서 전적으로 끊어진다는 뜻
  - 단지 물리적 생존만 말한다는 뜻
  rationale: 부정문은 전면적 단절이 아니라 잔존을 암시하고, 뒤의 목적절들은 그 잔존이 은혜가 아니라 심판의 도구임을 보여 줍니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
