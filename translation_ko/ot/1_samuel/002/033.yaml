revisions:
- from: 그러나 나는 너의 제단 곁에서 너의 남자 하나도 끊어 버리지 않아서, 네 눈이 쇠하고 네 혼이 괴롭게 하겠으며, 네 집의 모든 번성한 자는 사람들에 의하여 죽을 것입니다.[a]
  to: 그러나 내가 네게 속한 사람을 모두 내 제단 곁에서 끊어 버리지는 않겠습니다. 이는 네 눈을 쇠하게 하고 네 마음을 괴롭게 하려는 것입니다. 네 집에서 번성할 모든 이는 장정으로 죽을 것입니다.[a]
  rationale: 제한된 부정을 ‘모두 … 않다’로 바로잡아, 제단 곁에서 엘리의 계통이 완전히 끊기지는 않는다는 원문의 긴장을 보존했습니다. 두 목적절은 눈의 쇠함과 마음의 괴로움을 일으키려는 목적을 분명히 했습니다. 마지막 표현에서는 원문에 없는 ‘사람들에 의하여’와 ‘칼’을 제거하고, 관용적 해석 가능성은 각주로 처리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:20:57Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 핵심 구문을 몇 곳에서 원문과 다르게 옮깁니다. ‘너의 남자 하나도 끊어 버리지 않아서’는 ‘한 사람도 끊지 않겠다’라는 전면적 부정을 뜻하여, 원문의 ‘모두를 끊지는 않겠다’라는 제한된 부정과 맞지 않습니다. 또한 אֲנָשִׁים은 ‘사람들에 의하여’ 또는 ‘칼로’라는 행위자·수단을 뜻하지 않습니다. 영어 POB 본문의 ‘by the sword of men’도 히브리어 본문에는 근거가 없으며, 그 영어 감사 자료 내부의 ‘as men’ 및 각주 설명과도 충돌합니다.
  naturalness: ‘네 혼이 괴롭게 하겠으며’는 주어와 사역 구성이 어색하고, ‘번성한 자’도 가문의 늘어나는 구성원들을 가리키는 표현으로 자연스럽지 않습니다. 목적을 나타내는 ‘~하려는 것이다’와 ‘네 집에서 번성할 모든 이’로 다듬으면 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: נֶפֶשׁ은 이 문맥에서 ‘혼’보다 자연스러운 ‘마음’으로 옮겼습니다. מַרְבִּית בֵּיתֶךָ는 집안의 증가, 곧 후손/구성원의 번성을 가리키므로 ‘네 집에서 번성할 모든 이’로 번역했습니다. 마지막 אֲנָשִׁים의 정확한 관용적 뉘앙스는 논쟁적이므로 본문에서는 ‘장정으로’로 절제해 옮기고, ‘한창 나이’라는 해석을 각주에 남겼습니다.
  issues:
  - severity: high
    issue: ‘너의 남자 하나도 끊어 버리지 않아서’가 원문의 제한된 부정을 전면 부정으로 바꿉니다.
    rationale: 문맥과 원문의 부정 구문은 엘리의 계통이 제단 곁에서 완전히 제거되지는 않음을 말합니다. ‘하나도 … 않다’는 아무도 제거되지 않는다는 반대 의미가 됩니다.
  - severity: high
    issue: ‘사람들에 의하여 죽을 것입니다’는 אֲנָשִׁים을 피동 행위자로 오해한 번역입니다.
    rationale: 원문에는 ‘의하여’에 해당하는 전치사나 ‘칼’이 없습니다. 이 구절의 אֲנָשִׁים은 죽음의 수단·가해자를 표시하지 않으며, 통상 성년/한창 나이의 죽음이라는 관용적 의미로 이해됩니다.
  - severity: medium
    issue: ‘네 혼이 괴롭게 하겠으며’는 문법적으로 부자연스럽습니다.
    rationale: 두 부정사의 사역 관계를 한국어에서 분명히 해야 합니다. ‘네 마음을 괴롭게 하려는 것이다’가 원문의 목적 관계와 한국어 문법을 모두 살립니다.
  - severity: medium
    issue: 영어 POB 감사 본문의 ‘by the sword of men’은 원문 및 같은 감사 자료의 어휘 주석과 불일치합니다.
    rationale: 한국어 번역은 영어 문구를 따르지 않고 히브리어 본문을 우선해야 합니다. 각주는 논쟁적인 마지막 표현의 가능한 해석을 제시하되, 원문에 없는 폭력적 수단을 추가하지 않아야 합니다.
