- from: 야훼께서 한나를 돌보셨으므로, 그녀가 임신하여 아들 셋과 딸 둘을 낳았습니다[a]. 그리고 소년 사무엘은 야훼 앞에서 자랐습니다[b].
  to: 야훼께서 한나를 돌보셨으므로[a] 한나는 임신하여 아들 셋과 딸 둘을 낳았습니다. 그리고 소년 사무엘은 야훼 앞에서 자랐습니다[b].
  rationale: 의미는 유지하면서, 한국어의 자연스러운 주어 반복으로 ‘그녀’를 대체했습니다. פָּקַד 관련 각주를 실제 어휘 대안으로 고치고 표지를 해당 표현 직후로 옮겼습니다. עִם יְהוָה의 문맥적 번역과 그 직역을 보존하는 각주는 유지했습니다.
