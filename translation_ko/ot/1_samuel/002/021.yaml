  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי פָקַ֤ד יְהוָה֙ אֶת חַנָּ֔ה וַ/תַּ֛הַר וַ/תֵּ֥לֶד שְׁלֹשָֽׁה בָנִ֖ים וּ/שְׁתֵּ֣י בָנ֑וֹת וַ/יִּגְדַּ֛ל הַ/נַּ֥עַר שְׁמוּאֵ֖ל עִם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/021.yaml
  text: For Yahweh visited Hannah[a], and she conceived and bore three sons and two daughters[b]. And the boy Samuel grew before Yahweh.
  footnotes:
  - marker: a
    text: Or 'the LORD attended to Hannah' or 'the LORD cared for Hannah.' The Hebrew verb can denote gracious intervention on someone's behalf.
    reason: lexical_alternative
  - marker: b
    text: Literally 'with the LORD'; in context, this likely means Samuel grew up in the LORD's presence at the sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 한나를 돌보셨으므로, 그녀가 임신하여 아들 셋과 딸 둘을 낳았습니다[a]. 그리고 소년 사무엘은 야훼 앞에서 자랐습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 한나를 돌보셨다’, ‘야훼께서 한나를 살펴주셨다’. 히브리어 동사는 누구를 위한 은혜로운 개입을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘야훼와 함께’입니다. 문맥상 이는 사무엘이 성소에서 야훼 앞에서 자랐다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָקַד
  english_pob_choice: visited
  chosen_korean: 돌보셨으므로
  alternatives_korean:
  - 방문하셨으므로
  - 찾아오셨으므로
  - 살펴주셨으므로
  lexicon: HALOT
  rationale: 본문에서는 여호와의 은혜로운 개입이 한나의 임신으로 이어지므로, 한국어로는 단순한 방문보다 돌봄의 뜻이 드러나는 표현이 더 정확합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 히브리어 고유 신명 יְהוָה를 제목적 표현으로 바꾸지 않고, 프로젝트 기본값에 따라 야훼로 옮겼습니다.
- source_word: וַתַּהַר וַתֵּלֶד
  english_pob_choice: she conceived and bore
  chosen_korean: 임신하여 … 낳았습니다
  alternatives_korean:
  - 잉태하여 … 낳았습니다
  - 아이를 배어 … 낳았습니다
  lexicon: HALOT
  rationale: 임신과 출산의 연속 동작을 현대 한국어로 자연스럽게 드러내되, 서술의 직진성을 유지했습니다.
- source_word: עִם יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼와 함께
  - 야훼의 임재 안에서
  lexicon: HALOT
  rationale: 사무엘의 성전적 성장 맥락에서 문자적 '함께'보다 '앞에서'가 본문의 예배·봉사 환경을 더 정확히 전달합니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  rationale: 본문의 고유한 언약명을 보존하기 위해 전통적 대체 칭호 대신 야훼를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: עִם יְהוָה의 의미
  chosen_reading: 야훼 앞에서
  alternative_readings:
  - 야훼와 함께
  - 야훼의 임재 안에서
  rationale: 여기서의 표현은 신비적 연합이 아니라 성소에서의 삶과 성장이라는 서술적·제의적 의미이므로, 그 긴장을 과도하게 해소하지 않는 방향으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, preserve tension rather than over-resolve
