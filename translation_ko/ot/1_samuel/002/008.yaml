id: 1SA.2.8
reference: 1 Samuel 2:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵקִ֨ים מֵ/עָפָ֜ר דָּ֗ל מֵֽ/אַשְׁפֹּת֙ יָרִ֣ים אֶבְי֔וֹן לְ/הוֹשִׁיב֙ עִם נְדִיבִ֔ים וְ/כִסֵּ֥א כָב֖וֹד יַנְחִלֵ֑/ם כִּ֤י לַֽ/יהוָה֙ מְצֻ֣קֵי אֶ֔רֶץ וַ/יָּ֥שֶׁת עֲלֵי/הֶ֖ם תֵּבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/008.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap, to seat them with nobles and make them inherit a seat of honor. For the pillars of the earth belong to Yahweh[b], and on them he has set the world.
  footnotes:
  - marker: a
    text: Or 'a throne of honor.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the foundations of the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 가난한 사람을 먼지에서 일으키시며, 궁핍한 사람을 재더미에서 들어 올리셔서 귀족들과 함께 앉히시고 명예의 자리[a]를 물려받게 하십니다. 땅의 기둥들[b]은 야훼께 속해 있으며, 그 위에 그분이 세상을 세우셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘명예의 보좌.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅의 기초들.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים / מֵעָפָר דָּל
  english_pob_choice: He raises the poor from the dust
  chosen_korean: 가난한 사람을 먼지에서 일으키시며
  alternatives_korean:
  - 가난한 이를 흙에서 들어 올리시며
  - 궁핍한 사람을 먼지에서 일으키시며
  lexicon: HALOT
  rationale: הֵקִים(히필)은 단순한 ‘세우다’보다 낮은 처지에서 일으켜 세우는 동작을 뜻하므로, ‘일으키시며’로 사회적 반전의 이미지를 살렸습니다. דָּל은 여기서 경제·사회적으로 낮은 처지를 가리키므로 ‘가난한 사람’이 자연스럽습니다.
- source_word: מֵאַשְׁפֹּת / אֶבְיוֹן
  english_pob_choice: from the ash heap / the needy
  chosen_korean: 재더미에서 / 궁핍한 사람
  alternatives_korean:
  - 재더미에서 / 가난한 사람
  - 오물더미에서 / 궁핍한 사람
  lexicon: HALOT
  rationale: אַשְׁפֹּת은 버려진 찌꺼기 더미를 가리키므로 ‘재더미’가 한국어로도 그 비천함을 비교적 자연스럽게 전달합니다. אֶבְיוֹן은 ‘결핍한, 궁핍한’의 뜻이 강해 앞의 דָּל과 구별하여 ‘궁핍한 사람’으로 옮겼습니다.
- source_word: לְהוֹשִׁיב עִם נְדִיבִים / וְכִסֵּא כָבוֹד יַנְחִלֵם
  english_pob_choice: to seat them with nobles and make them inherit a seat of honor
  chosen_korean: 귀족들과 함께 앉히시고 명예의 자리를 유산으로 주십니다
  alternatives_korean:
  - 지도자들과 함께 앉히시고 명예의 보좌를 유산으로 주십니다
  - 귀족들과 함께 앉히시고 영광의 보좌를 상속으로 주십니다
  lexicon: HALOT
  rationale: נְדִיבִים은 통치층·귀족층을 가리킬 수 있어 ‘귀족들’이 가장 직역에 가깝습니다. כִסֵּא כָבוֹד는 문자적으로 ‘영광의 보좌/자리’이지만, 높여 주시는 신분 상승을 한국어로 자연스럽게 살리기 위해 본문은 ‘명예의 자리’로 두고, 더 문자적인 뉘앙스는 별도 각주로 처리했습니다.
- source_word: מְצֻקֵי אֶרֶץ
  english_pob_choice: the pillars of the earth
  chosen_korean: 땅의 기둥들
  alternatives_korean:
  - 땅의 기초들
  - 땅의 받침들
  lexicon: HALOT
  rationale: 시적 우주론 이미지로서 ‘기둥들’이 가장 생생하게 대응합니다. 본문이 세상을 떠받치는 구조를 말하는 것이므로, ‘기초들’은 해석적이지만 보다 추상적이어서 대안으로만 남겼습니다.
- source_word: תֵּבֵל
  english_pob_choice: the world
  chosen_korean: 세상
  alternatives_korean:
  - 거주 세계
  - 땅
  lexicon: HALOT
  rationale: תֵּבֵל은 사람이 사는 질서 있는 세계를 뜻하므로, 현대 한국어에서는 간결한 ‘세상’이 가장 자연스럽습니다.
- source_word: לַיהוָה
  english_pob_choice: belong to Yahweh
  chosen_korean: 야훼께 속해 있으며
  alternatives_korean:
  - 야훼의 것이며
  - 주께 속해 있으며
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 신명은 ‘야훼’로 옮겼습니다. כאן 문맥은 소유·주권을 함께 드러내므로 ‘속해 있으며’가 적절합니다.
theological_decisions:
- issue: 시적 우주 구조 이미지 보존
  chosen_reading: ‘땅의 기둥들’이라는 이미지를 그대로 살려, 하나님이 세계의 질서를 붙드시고 세우시는 주권을 드러내는 시어로 읽게 했습니다.
  alternative_readings:
  - ‘땅의 기초들’로 평탄하게 옮기기
  rationale: 히브리어는 고대 근동의 세계관을 반영하는 시적 표현을 사용하므로, 이를 추상화하면 원문의 힘이 약해집니다. 본문은 은유를 유지하는 편이 원저자의 의도를 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: כִסֵּא כָבוֹד의 위상 표현
  chosen_reading: 본문에는 ‘명예의 자리’를 두어 신분 상승을 자연스럽게 전달하고, 보다 문자적인 ‘보좌’ 뉘앙스는 각주로 보완합니다.
  alternative_readings:
  - ‘명예의 보좌’
  - ‘영광의 보좌’
  rationale: 이 절은 특정 왕위 즉위보다 낮은 자들의 높아짐을 강조하므로, ‘자리’가 본문의 포괄성을 더 잘 살립니다. 다만 히브리어의 왕좌/좌석 이미지는 소실되지 않도록 각주로 남깁니다.
  doctrine_reference: Translation philosophy §6
