  source_fidelity: 본문의 핵심 대조와 의미는 대체로 충실합니다. 다만 יִדָּמּוּ의 가능한 의미 범위를 반영하는 각주에 ‘끊어지다’의 가능성도 포함하는 것이 영어 POB 감사 기록과 원문 어휘의 범위에 더 부합합니다.
  naturalness: ‘자기의 신실한 이들’은 지시 대상이 하나님임을 문법상 알 수 있으나, 현대 표준어에서는 ‘자신의’가 더 자연스럽습니다. 또한 합쇼체 문장에서는 ‘잠잠해지리니’보다 ‘잠잠해질 것이며’가 앞 절과의 병렬 및 종결 방식에 더 매끄럽습니다.
