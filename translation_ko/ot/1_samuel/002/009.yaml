  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רַגְלֵ֤י חסיד/ו יִשְׁמֹ֔ר וּ/רְשָׁעִ֖ים בַּ/חֹ֣שֶׁךְ יִדָּ֑מּוּ כִּֽי לֹ֥א בְ/כֹ֖חַ יִגְבַּר אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/009.yaml
  text: He guards the feet of his faithful ones[a], but the wicked are silenced in darkness[c][b], for not by strength does a man prevail.
  footnotes:
  - marker: a
    text: Hebrew textual tradition may also be read as singular, 'his faithful one'; the plural sense 'his faithful ones' is adopted because it fits the poetic parallelism and likely intended collective meaning.
    reason: textual_variant
  - marker: b
    text: Or 'are still' / 'are cut off'; the Hebrew verb can denote being silent or stilled.
    reason: lexical_alternative
  - marker: c
    text: '''A man'' renders the Hebrew masculine singular used generically here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 자기의 신실한 이들의 발을 지키시지만, 악인들은 어둠 속에서 잠잠해지리니, 사람이 힘으로는 이기지 못하기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전통은 ‘그의 신실한 한 사람’으로도 읽힐 수 있지만, 시의 평행법과 문맥상 집합적 의미가 더 잘 맞아 여기서는 복수로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 원문의 동사는 ‘잠잠하다’ 또는 ‘고요해지다’의 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 남성 단수는 여기서 대표적 의미로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵי
  english_pob_choice: the feet of
  chosen_korean: 발을
  alternatives_korean:
  - 걸음을
  lexicon: HALOT
  rationale: 히브리어 복수 구성형의 구체적 이미지를 살리기 위해 ‘발’을 택했습니다. ‘걸음’도 가능하지만 원문보다 비유적입니다.
- source_word: חסידו
  english_pob_choice: his faithful ones
  chosen_korean: 자기의 신실한 이들
  alternatives_korean:
  - 그의 신실한 한 사람
  - 그의 경건한 이들
  - 성도들
  lexicon: HALOT
  rationale: 본문과 병행구를 따라 집합적 의미를 살리면서, 교회적 용례가 강한 ‘성도’는 피했습니다. ‘신실한’은 언약적 충성을 비교적 직접적으로 옮깁니다.
- source_word: יִדָּמּוּ
  english_pob_choice: are silenced
  chosen_korean: 잠잠해지리니
  alternatives_korean:
  - 침묵하게 되리니
  - 말이 막히리니
  - 스러지리니
  lexicon: HALOT
  rationale: 이 동사는 ‘침묵하다/잠잠하다’의 뜻을 가지므로, 심판의 맥락을 유지하면서도 ‘어둠 속에서’와 자연스럽게 연결되는 표현으로 옮겼습니다.
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 사람이
  alternatives_korean:
  - 한 남자가
  - 누구도
  lexicon: HALOT
  rationale: 히브리어 남성 단수의 대표적·보편적 용법을 한국어에서 부자연스럽지 않게 살리기 위해 ‘사람’으로 옮겼습니다. 성별 중립화를 통한 의미 약화를 피하면서도 현대 독자에게 자연스럽습니다.
theological_decisions:
- issue: ‘야훼의 보호’와 ‘인간의 무력함’의 병렬
  chosen_reading: 하나님이 신실한 자들을 능동적으로 지키시며, 인간은 힘만으로는 승리할 수 없다는 대비를 분명히 드러냈습니다.
  alternative_readings:
  - 보호 일반의 교훈으로 완화하기
  - ‘이긴다’를 단순한 성공으로 낮추기
  rationale: 문맥상 단순한 일반 지혜가 아니라 하나님의 주권적 보호와 인간 القوة의 한계를 선포하는 시적 진술이므로, 대비를 약화시키지 않았습니다.
  doctrine_reference: Translation philosophy §3, §5
