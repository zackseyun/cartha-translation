  rationale: 히브리어 원문과 POB의 직역 성향상, 이 구절은 부정한 요구와 제사장 집안의 타락을 독자가 즉시 느끼도록 해야 하므로 완곡화하지 않았습니다.
  doctrine_reference: 1 Samuel 2:12–17의 문맥상 제사장 아들들의 죄와 성소 질서의 훼손
