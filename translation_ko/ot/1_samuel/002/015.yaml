base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/015.yaml
  text: Even before they burned the fat[a], the priest’s servant would come and say to the man who was sacrificing, “Give meat for the priest to roast, for he will not take boiled meat from you, but only raw.”
  footnotes:
  - marker: a
    text: Or 'the priest’s young man' or 'the priest’s attendant'; the Hebrew נַעַר can denote a youth or a servant, and here likely refers to a subordinate acting for the priest.
    reason: lexical_alternative
translation:
  language: ko
  text: 심지어 그들이 기름을 태우기도 전에, 제사장의 종이 와서 제사를 드리는 사람에게 말하곤 했습니다. “제사장이 구울 고기를 내놓으시오. 그는 당신에게서 삶은 고기는 받지 않고, 오직 날고기만 받습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נַעַר는 ‘젊은이’ 또는 ‘종/시종’이 될 수 있으며, 여기서는 제사장을 보조하는 하급 인물을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם + בְּטֶרֶם
  english_pob_choice: Even before
  chosen_korean: 심지어 … 하기도 전에
  alternatives_korean:
  - 그들이 기름을 태우기 전에도
  - 바로 기름을 태우기 전에
  lexicon: HALOT
  rationale: גַּם의 강조와 בְּטֶרֶם의 시간 선행을 함께 살려, 단순한 ‘~하기 전에’보다 비난의 뉘앙스가 드러나도록 옮겼습니다.
- source_word: נַעַר הַכֹּהֵן
  english_pob_choice: the priest’s servant
  chosen_korean: 제사장의 종
  alternatives_korean:
  - 제사장의 젊은이
  - 제사장의 시종
  - 제사장의 하인
  lexicon: HALOT
  rationale: נַעַר는 ‘젊은이’일 수도 있지만 여기서는 제사장을 대신해 움직이는 하급 인물을 가리키므로 기능을 드러내는 ‘종’이 가장 적절합니다.
- source_word: לִצְלוֹת
  english_pob_choice: to roast
  chosen_korean: 구워 드릴
  alternatives_korean:
  - 굽게 할
  - 구울
  lexicon: HALOT
  rationale: 제사장 몫으로 요구하는 조리 방식을 자연스러운 현대 한국어로 풀되, 제의적 식사 준비라는 의미가 유지되도록 했습니다.
- source_word: מְבֻשָּׁל ... חָי
  english_pob_choice: boiled ... raw
  chosen_korean: 삶은 고기 ... 날고기
  alternatives_korean:
  - 삶은 고기 ... 생고기
  - 익힌 고기 ... 날고기
  lexicon: HALOT
  rationale: 대조가 분명하도록 ‘삶은’과 ‘날’의 대비를 유지했습니다. 한국어에서 ‘날고기’는 ‘raw’의 직접적이고 자연스러운 대응입니다.
theological_decisions:
