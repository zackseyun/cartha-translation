  text: אֵין קָד֥וֹשׁ כַּ/יהוָ֖ה כִּ֣י אֵ֣ין בִּלְתֶּ֑/ךָ וְ/אֵ֥ין צ֖וּר כֵּ/אלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/002.yaml
  text: There is none holy like Yahweh[a], for there is none besides you, and there is no rock like our God.
  footnotes:
  - marker: a
    text: 'Hebrew: "Yahweh." The main text follows the project default of rendering the divine name יְהוָה as "the LORD."'
    reason: alternative_reading
translation:
  language: ko
  text: 주와 같은 거룩한 이는 없습니다. 주 외에는 아무도 없으며, 우리 하나님과 같은 반석도 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 여호와의 이름(יהוה)을 사용합니다. 본문은 프로젝트 관례에 따라 ‘주’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵין קָדוֹשׁ
  english_pob_choice: There is none holy
  chosen_korean: 거룩한 이는 없습니다
  alternatives_korean:
  - 거룩한 분은 없습니다
  - 거룩한 이는 아무도 없습니다
  lexicon: HALOT
  rationale: 부정 존재 구문을 한국어에서 자연스럽게 옮기면서도, 하나님에 대한 절대적 유일성과 거룩함을 분명히 드러내기 위해 ‘거룩한 이는 없습니다’를 택했습니다.
- source_word: כַּיהוָה
  english_pob_choice: like Yahweh
  chosen_korean: 주와 같은
  alternatives_korean:
  - 야훼와 같은
  - 주님과 같은
  lexicon: HALOT
  rationale: 본문의 비교 구조 כַּ는 ‘~와 같은’으로 옮겼고, 한국어 본문에서는 예배적·가독성 균형을 고려해 ‘주’로 처리했습니다. 본 절은 원문의 신명기적 이름을 직접 드러내는 대안도 가능하지만, 프로젝트 관례상 본문은 ‘주’로 두었습니다.
- source_word: בִּלְתֶּךָ
  english_pob_choice: besides you
  chosen_korean: 주 외에는
  alternatives_korean:
  - 주를 제외하고는
  - 주 밖에는
  lexicon: HALOT
  rationale: 배제의 의미를 지닌 표현으로서 ‘외에는’이 가장 자연스럽고, 2인칭 직접 호소의 긴장도 유지합니다.
- source_word: צוּר
  english_pob_choice: rock
  chosen_korean: 반석
  alternatives_korean:
  - 바위
  - 피난처
  lexicon: HALOT
  rationale: 하나님의 견고함과 보호를 가리키는 표준적 은유를 살리기 위해 ‘반석’을 선택했습니다. ‘피난처’는 해석을 덧붙여 이미지 범위를 좁힐 수 있습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 본문에서는 ‘주’로 옮기고, 주석 없이 본문 흐름을 살렸습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 제공된 영어 POB 본문이 ‘the LORD’ 관례를 따르고 있으므로, 한국어 본문도 예배적이고 읽기 쉬운 ‘주’를 사용했습니다. 이는 고유 신명 자체를 본문에 노출하는 번역보다 교회 공동체용 문체에 더 적합합니다.
  doctrine_reference: POB glossary / divine name convention
