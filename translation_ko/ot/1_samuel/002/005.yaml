  to: 배부르던 이들은 떡을 얻으려고 품을 팔고, 배고프던 이들은 그쳤습니다.[a] 심지어 아이를 낳지 못하던 여인은 일곱을 낳았고,[b] 많은 아들을 둔 여인은 쇠약해졌습니다.[c]
