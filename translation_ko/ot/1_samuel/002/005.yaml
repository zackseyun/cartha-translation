  source_fidelity: ‘떡을 위해 품삯을 받고’는 떡을 대가로 임금을 받는다는 뜻으로 읽히기 쉬워, ‘떡을 얻으려고 품을 팔다’라는 נִשְׂכָּרוּ의 고용·품팔이 의미를 충분히 전달하지 못합니다. 또한 עֲקָרָה는 ‘불임’이라는 의학적 단정보다 ‘아이를 낳지 못하던’으로 옮기는 편이 본문의 서술적·시적 표현에 더 충실합니다. חָדֵלּוּ의 목적어 생략은 본문과 주석에서 보존했습니다.
  naturalness: 수정문은 현대 표준 한국어의 합쇼체를 유지하며, 병렬과 반전의 시적 흐름을 자연스럽게 살립니다. 각 주석 표지를 해당 단어·구절 바로 뒤에 배치하여 독해와 구조를 명확히 했습니다.
  terminology: ‘품을 팔다’는 경제적 궁핍 속에서 고용 노동에 들어가는 뜻을 자연스럽게 나타냅니다. ‘많은 아들을 둔 여인’은 בָּנִים의 남성 복수를 보존합니다. ‘아이를 낳지 못하던 여인’은 עֲקָרָה를 교단적 해석이나 의학적 확정 없이 충실히 옮깁니다.
