id: 1SA.2.5
reference: 1 Samuel 2:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׂבֵעִ֤ים בַּ/לֶּ֨חֶם֙ נִשְׂכָּ֔רוּ וּ/רְעֵבִ֖ים חָדֵ֑לּוּ עַד עֲקָרָה֙ יָלְדָ֣ה שִׁבְעָ֔ה וְ/רַבַּ֥ת בָּנִ֖ים אֻמְלָֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/005.yaml
  text: Those who were full have hired themselves out for bread[a], but those who were hungry have ceased. Even the barren woman has borne seven[c][b], but she who had many sons has withered away.
  footnotes:
  - marker: a
    text: Or, 'have ceased'—the Hebrew leaves the object unstated; the sense is that the hungry no longer hunger or no longer lack.
    reason: lexical_alternative
  - marker: b
    text: '''Seven'' may function as a literal number or as a poetic number of fullness/completeness.'
    reason: cultural_note
  - marker: c
    text: Hebrew 'sons'; some translations generalize to 'children.'
    reason: lexical_alternative
translation:
  language: ko
  text: 배부른 이들은 떡을 위해 품삯을 받고, 배고픈 이들은 그쳤습니다. 심지어 불임 여인은 일곱을 낳았고, 많은 아들을 둔 여인은 쇠약해졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그쳤습니다’는 히브리어가 목적어를 생략한 표현으로, 배고픔이 더 이상 지속되지 않음을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘일곱’은 문자적 수일 수도 있고, 충만함/완전함을 나타내는 시적 수일 수도 있습니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 ‘아들들’이라고 되어 있으며, 일부 번역은 이를 ‘자녀들’로 일반화합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂבֵעִים
  english_pob_choice: those who were full
  chosen_korean: 배부른 이들
  alternatives_korean:
  - 만족한 이들
  - 배부른 사람들
  lexicon: HALOT
  rationale: 형용사적 분사를 실질적으로 받아, 풍요에 있던 사람들의 반전을 자연스러운 한국어로 살렸습니다.
- source_word: נִשְׂכָּרוּ
  english_pob_choice: have hired themselves out
  chosen_korean: 품삯을 받고
  alternatives_korean:
  - 고용되었고
  - 품을 팔고
  lexicon: HALOT
  rationale: ‘고용되다’보다 자발적·경제적 의존의 뉘앙스를 살리기 위해, 품삯을 받는 노동 상태로 옮겼습니다.
- source_word: חָדֵלּוּ
  english_pob_choice: have ceased
  chosen_korean: 그쳤습니다
  alternatives_korean:
  - 더는 배고프지 않게 되었습니다
  - 배고픔을 멈추었습니다
  lexicon: HALOT
  rationale: 히브리어는 목적어를 생략한 채 ‘그치다’를 쓰므로, 한국어도 과도한 보충 없이 간결하게 유지했습니다.
- source_word: עֲקָרָה
  english_pob_choice: the barren woman
  chosen_korean: 불임 여인
  alternatives_korean:
  - 잉태하지 못하던 여인
  - 아이를 못 낳던 여인
  lexicon: HALOT
  rationale: 예언적 반전의 대조를 분명히 하면서도 현대 한국어에서 직설적으로 이해되는 표현을 택했습니다.
theological_decisions:
- issue: שִׁבְעָה(‘seven’)의 숫자 의미를 어떻게 처리할지
  chosen_reading: ‘일곱’을 본문대로 유지하고 상징 해석은 본문에 넣지 않았습니다.
  alternative_readings:
  - 완전수로 풀어 ‘충만함’을 암시하기
  - ‘일곱 자녀’를 풀어 쓰기
  rationale: 히브리어가 직접 제시하는 수를 보존해 시적 긴장을 남겨 두는 것이 본문에 더 충실합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
- issue: בָּנִים을 포괄적 ‘자녀들’로 중화할지 여부
  chosen_reading: ‘아들들’에 해당하는 남성 복수를 유지했습니다.
  alternative_readings:
  - 자녀들
  - 아이들
  rationale: 대조 구문에서 히브리어의 성별 표지를 지우지 않고, POB의 성별 정확성 원칙을 따랐습니다.
  doctrine_reference: Translation philosophy §4 (Gender-accurate over gender-neutral)
