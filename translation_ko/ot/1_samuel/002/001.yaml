reference: 1 Samuel 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּתְפַּלֵּ֤ל חַנָּה֙ וַ/תֹּאמַ֔ר עָלַ֤ץ לִבִּ/י֙ בַּֽ/יהוָ֔ה רָ֥מָה קַרְנִ֖/י בַּֽ/יהוָ֑ה רָ֤חַב פִּ/י֙ עַל א֣וֹיְבַ֔/י כִּ֥י שָׂמַ֖חְתִּי בִּ/ישׁוּעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/001.yaml
  text: 'And Hannah prayed and said: “My heart exults in Yahweh[a]; my horn is lifted high in Yahweh. My mouth is opened wide against my enemies[c][b], because I rejoice in your salvation.”'
  footnotes:
  - marker: a
    text: Hebrew 'my horn,' a metaphor for strength, honor, or exalted status.
    reason: cultural_note
  - marker: b
    text: Or 'my mouth boasts over my enemies' / 'I speak boldly against my enemies.' The Hebrew literally says 'my mouth is opened wide against my enemies.'
    reason: lexical_alternative
  - marker: c
    text: Or 'deliverance.' The Hebrew term can mean salvation in a broad sense or concrete rescue from distress.
    reason: lexical_alternative
translation:
  language: ko
  text: 한나가 기도하며 말했습니다. “내 마음이 야훼 안에서 크게 기뻐합니다. 내 뿔이 야훼 안에서 높이 들립니다. 내 입이 내 원수들을 향해 크게 열립니다. 이는 제가 주의 구원으로 기뻐하기 때문입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뿔’은 힘, 존귀, 또는 높여진 지위를 가리키는 히브리어 비유입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘내 입이 내 원수들 위에서 자랑합니다’ / ‘내가 내 원수들을 향해 담대히 말합니다’. 히브리어는 문자적으로는 ‘내 입이 내 원수들을 향해 크게 열립니다’라고 합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘구출’. 이 히브리어는 넓은 의미의 구원이나 환난에서의 구체적 구출을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפַּלֵּל
  english_pob_choice: prayed
  chosen_korean: 기도하며
  alternatives_korean:
  - 기도했습니다
  - 간구했습니다
  lexicon: HALOT
  rationale: 히트파엘 פלל은 기본적으로 ‘기도하다’의 뜻이므로, 서술 동사로 자연스러운 ‘기도하며’로 살리되 뒤의 말하기 동사와 함께 한 문장으로 유지했습니다.
- source_word: עָלַץ לִבִּי
  english_pob_choice: My heart exults
  chosen_korean: 내 마음이 크게 기뻐합니다
  alternatives_korean:
  - 내 마음이 환호합니다
  - 내 마음이 기뻐합니다
  lexicon: HALOT
  rationale: עָלַץ는 단순한 기쁨보다 더 고양된 환희·격양의 뉘앙스가 있어, 합쇼체에서 과장되지 않으면서도 강한 감정을 드러내는 ‘크게 기뻐합니다’를 택했습니다.
- source_word: רָמָה קַרְנִי
  english_pob_choice: my horn is lifted high
  chosen_korean: 내 뿔이 … 높이 들립니다
  alternatives_korean:
  - 내 뿔이 높이 세워집니다
  - 내 힘이 높아집니다
  lexicon: HALOT
  rationale: ‘뿔’은 힘·존귀·높아진 지위를 가리키는 상징을 보존해야 하므로 풀어 쓰지 않고, 동사는 수동적 이미지에 맞게 ‘높이 들립니다’로 옮겼습니다.
- source_word: רָחַב פִּי עַל אֹיְבַי
  english_pob_choice: My mouth is opened wide against my enemies
  chosen_korean: 내 입이 내 원수들을 향해 크게 열립니다
  alternatives_korean:
  - 내 입이 원수들을 향해 넓어집니다
  - 내 입이 원수들 위에 크게 벌어집니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 신체적 이미지를 유지하면서, 현대 한국어에서 이해 가능한 ‘크게 열립니다’로 옮겨 과도한 해석인 ‘자랑합니다’를 본문에 직접 넣지 않았습니다.
- source_word: בִּישׁוּעָתֶךָ
  english_pob_choice: in your salvation
  chosen_korean: 주의 구원으로
  alternatives_korean:
  - 주의 구원 안에서
  - 주의 구원 때문에
  lexicon: HALOT
  rationale: ישועה는 ‘구원’과 ‘구출’의 범위를 가지므로, 본문의 기쁨의 근거를 드러내는 한국어로 ‘주의 구원으로’를 택해 의미를 넓게 보존했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 여호와 대체 титulus가 아니라 신명기적 고유명사 יהוה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겨 고유 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
