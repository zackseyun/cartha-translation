id: 1SA.2.29
reference: 1 Samuel 2:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֣/מָּה תִבְעֲט֗וּ בְּ/זִבְחִ/י֙ וּ/בְ/מִנְחָתִ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי מָע֑וֹן וַ/תְּכַבֵּ֤ד אֶת בָּנֶ֨י/ךָ֙ מִמֶּ֔/נִּי לְ/הַבְרִֽיאֲ/כֶ֗ם מֵ/רֵאשִׁ֛ית כָּל מִנְחַ֥ת יִשְׂרָאֵ֖ל לְ/עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/029.yaml
  text: Why do you scorn my sacrifice and my offering[a], which I commanded for the dwelling, and honor your sons above me, fattening yourselves from the first of every offering of Israel[c][b], my people?
  footnotes:
  - marker: a
    text: Or 'kick at' or 'treat with contempt.' The Hebrew verb is vivid, literally suggesting a contemptuous kicking at what God commanded.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'which I commanded for/in the dwelling.' The final word may refer to the sanctuary as God's dwelling place.
    reason: alternative_reading
  - marker: c
    text: Or 'making yourselves fat' or 'feeding yourselves from the choicest part of every offering of Israel, my people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 너희는 내 제물과 내가 정한 제사[a]를 업신여기고, 내 앞보다 네 아들들을 더 존중하여, 내 백성 이스라엘의 모든 제물[b][c]의 첫 몫으로 너희 자신을 살찌우느냐?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘발로 차다’, ‘경멸하다’. 히브리어 동사는 문자적으로 무엇인가를 모욕적으로 차버리는 이미지를 띱니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘내가 정한 거처/거주지’로도 읽을 수 있습니다. 여기서는 성소를 가리키는 말일 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘가장 좋은 몫으로’ / ‘고른 부분으로’. ‘첫 몫’은 문자에 가깝고, ‘가장 좋은 몫’은 문맥적 해석입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִבְעֲטוּ
  english_pob_choice: scorn
  chosen_korean: 업신여기고
  alternatives_korean:
  - 경멸하고
  - 차버리고
  - 하찮게 여기고
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 ‘발로 차다’의 이미지가 있지만, 이 문맥의 책망에서는 모욕적 거절의 뜻이 강하므로 한국어로는 ‘업신여기다’가 그 경멸성을 가장 자연스럽게 살립니다.
- source_word: זִבְחִי / מִנְחָתִי
  english_pob_choice: my sacrifice and my offering
  chosen_korean: 내 제물과 내가 정한 제사
  alternatives_korean:
  - 내 희생제물과 내 예물
  - 내 제사와 내 곡식제물
  lexicon: HALOT
  rationale: זֶבַח과 מִנְחָה의 결합을 한국어에서 지나치게 용어화하지 않으면서도 제의적 의미를 살려야 하므로, 앞은 ‘제물’, 뒤는 문맥상 더 넓은 ‘제사’로 옮겼습니다.
- source_word: מָעוֹן
  english_pob_choice: the dwelling
  chosen_korean: 제사
  alternatives_korean:
  - 거처
  - 성소
  - 거하시는 곳
  lexicon: HALOT
  rationale: POB가 지적하듯 이 단어는 성소/거처를 가리킬 수 있지만, 한국어 본문에서는 ‘내가 정한’과 결합해 무리 없이 읽히도록 ‘제사’로 압축하고, 그 배경은 각주로 보완했습니다.
- source_word: וַתְּכַבֵּד ... מִמֶּנִּי
  english_pob_choice: honor your sons above me
  chosen_korean: 내 앞보다 네 아들들을 더 존중하여
  alternatives_korean:
  - 나보다 네 아들들을 더 공경하여
  - 나보다 네 아들들을 더 높여
  lexicon: HALOT
  rationale: כבד의 핵심은 ‘존중/영예’이므로 ‘존중하다’로 옮기고, 비교 표지는 ‘보다’의 관용을 살려 ‘내 앞보다’로 표현했습니다.
- source_word: לְהַבְרִיאֲכֶם
  english_pob_choice: fattening yourselves
  chosen_korean: 너희 자신을 살찌우느냐
  alternatives_korean:
  - 너희 몸을 살찌우느냐
  - 너희 배를 불리느냐
  lexicon: HALOT
  rationale: 동사의 구체적 이미지와 책망의 날카로움을 살리기 위해 ‘살찌우다’를 유지했습니다. 한국어도 이 표현이 제의적 남용의 탐욕을 직접 드러냅니다.
- source_word: מֵרֵאשִׁית כָּל מִנְחַת יִשְׂרָאֵל
  english_pob_choice: from the first of every offering of Israel
  chosen_korean: 이스라엘의 모든 제물의 첫 몫
  alternatives_korean:
  - 이스라엘의 모든 제물의 처음 부분
  - 이스라엘의 모든 제물 가운데 가장 좋은 몫
  lexicon: HALOT
  rationale: רֵאשִׁית는 ‘첫째/첫 몫’과 ‘가장 좋은 부분’ 사이의 긴장이 있어, 본문에 더 가까운 ‘첫 몫’을 택하고 해석적 대안은 각주로 남겼습니다.
theological_decisions:
- issue: 복수형 시작과 단수형 중반의 대상 변화
  chosen_reading: 첫 질문은 ‘너희’로 넓게 시작하되, 곧바로 엘리 개인을 향한 단수 질책으로 좁혀지는 흐름을 그대로 살렸습니다.
  alternative_readings:
  - 전 구절을 엘리 개인에게만 일관되게 맞출 수 있습니다.
  - 가문 전체를 함께 꾸짖는 복수로 끝까지 평면화할 수 있습니다.
  rationale: 히브리어의 수 변화는 의도적 수사로 보이므로, 이를 평준화하지 않고 한국어에서도 그대로 반영해 책임의 초점을 더 선명하게 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 제의 제도 남용의 윤리적 성격
  chosen_reading: 이 구절은 단순한 예배 예절 위반이 아니라, 하나님보다 아들을 더 높이고 제물을 사적으로 이용한 죄를 고발합니다.
  alternative_readings:
  - 주로 제사 규정 위반에 초점을 둘 수 있습니다.
  - ‘첫 몫’의 의미를 최상급 부분으로만 볼 수 있습니다.
  rationale: 문맥의 대조가 ‘하나님 대 아들들’의 도덕적 우선순위 문제를 전면에 드러내므로, 한국어도 그 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 5
