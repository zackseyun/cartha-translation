  source_fidelity: 히브리어의 미완료형들은 과거의 한 번의 사건이라기보다 반복된 관행을 서술합니다. 또한 마지막의 복수 주어와 ‘실로에 오는 모든 이스라엘’이라는 범위를 유지해야 합니다.
  naturalness: 초안의 단순 과거형은 관습적 행위를 충분히 드러내지 못하고, ‘실로에 있는 그곳에 오는’은 중복되어 부자연스럽습니다. ‘가마’는 현대 한국어에서 조리 용기보다 가마(窯)를 먼저 연상시킬 수 있습니다.
