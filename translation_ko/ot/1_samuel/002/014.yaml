reference: 1 Samuel 2:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִכָּ֨ה בַ/כִּיּ֜וֹר א֣וֹ בַ/דּ֗וּד א֤וֹ בַ/קַּלַּ֨חַת֙ א֣וֹ בַ/פָּר֔וּר כֹּ֚ל אֲשֶׁ֣ר יַעֲלֶ֣ה הַ/מַּזְלֵ֔ג יִקַּ֥ח הַ/כֹּהֵ֖ן בּ֑/וֹ כָּ֚כָה יַעֲשׂ֣וּ לְ/כָל יִשְׂרָאֵ֔ל הַ/בָּאִ֥ים שָׁ֖ם בְּ/שִׁלֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/014.yaml
  text: and he would thrust it into the basin[a], or the pot, or the kettle, or the cooking pan; all that the fork brought up, the priest would take with it[b]. Thus they did to all Israel who came there to Shiloh.
  footnotes:
  - marker: a
    text: Or 'flesh-hook' for 'fork.' The Hebrew term refers to the meat-hook used in the sacrificial pot.
    reason: lexical_alternative
  - marker: b
    text: The exact distinctions among the vessel names are uncertain; the Hebrew lists several kinds of cooking containers.
    reason: cultural_note
translation:
  language: ko
  text: 그가 그것을 대야나 솥이나 주전자나 냄비에 찔러 넣곤 했습니다. 갈고리가 끌어올리는 것은 무엇이든지 제사장이 그것으로 가져가곤 했습니다. 그들은 실로에 오는 모든 이스라엘 사람에게 이와 같이 하곤 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈고리’는 제물 고기를 건져 올리는 도구를 가리킵니다. 영어 POB 본문의 ‘fork’는 현대 독자를 위한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 그릇 이름들은 정확한 구분이 확실하지 않으며, 여러 종류의 조리용 용기를 나열합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכָּה
  english_pob_choice: and he would thrust it
  chosen_korean: 찔러 넣었습니다
  alternatives_korean:
  - 내리쳤습니다
  - 찌르듯 넣었습니다
  lexicon: HALOT
  rationale: 문맥상 동작은 일반적 ‘침’이 아니라 제사용 갈고리를 그릇 속으로 밀어 넣는 행위이므로, 한국어에서는 ‘찔러 넣다’가 가장 자연스럽고 원문의 반복적 관습행동도 무리 없이 드러냅니다.
- source_word: בַכִּיּוֹר / בַדּוּד / בַקַּלַּחַת / בַפָּרוּר
  english_pob_choice: into the basin, or the pot, or the kettle, or the cooking pan
  chosen_korean: 대야나 솥이나 가마나 냄비
  alternatives_korean:
  - 세숫대야나 가마솥이나 주전자나 조리팬
  - 대야나 가마솥이나 냄비나 팬
  lexicon: HALOT
  rationale: 여러 조리용 그릇의 목록이므로 과도하게 특정하지 않으면서도 현대 독자가 이해할 수 있는 기본 명칭으로 옮겼습니다. 각 항목의 정확한 기물 구분은 불확실하다는 POB 주석을 반영해 ‘대야/솥/가마/냄비’로 보수적으로 처리했습니다.
- source_word: הַמַּזְלֵג
  english_pob_choice: the fork
  chosen_korean: 갈고리
  alternatives_korean:
  - 포크
  - 고기갈고리
  lexicon: HALOT
  rationale: 이 갈고리는 식사용 포크가 아니라 제물 고기를 집어올리는 도구이므로, POB의 주석에 맞춰 ‘갈고리’로 옮겼습니다. 본문에서 ‘포크’보다 기능과 문화적 맥락이 더 분명합니다.
- source_word: יִקַּח הַכֹּהֵן בּוֹ
  english_pob_choice: the priest would take with it
  chosen_korean: 제사장이 그것으로 가져갔습니다
  alternatives_korean:
  - 제사장이 그것으로 취했습니다
  - 제사장이 그것을 가지고 가져갔습니다
  lexicon: HALOT
  rationale: בּוֹ는 갈고리를 가리키므로 도구를 통해 취하는 뜻을 한국어에서 ‘그것으로 가져가다’로 자연스럽게 풀었습니다. 주체가 제사장이라는 점과 도구성 모두를 살렸습니다.
theological_decisions:
- issue: 문장 끝의 일반화된 요약과 주어 수의 변화
  chosen_reading: 앞 절의 단수 행위 서술을 그대로 두되, 마지막 요약은 복수로 ‘그들은 … 행했습니다’라고 옮겼습니다.
  alternative_readings:
  - 끝까지 단수로 맞춰 ‘제사장이 … 행했습니다’라고 통일하기
  - 무인칭처럼 완화하여 ‘이런 식으로 이루어졌습니다’로 옮기기
  rationale: 히브리어는 개인 제사장의 동작에서 집단적 관행 요약으로 넘어가므로, 한국어에서도 그 수의 변화를 지워 버리지 않는 것이 본문 구조를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §3, §5
