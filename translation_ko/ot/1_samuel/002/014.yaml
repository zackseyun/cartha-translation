revisions:
- from: 그것을 대야나 솥이나 가마나 냄비에 찔러 넣었습니다. 갈고리가 끌어올리는 것은 무엇이든지 제사장이 그것으로 가져갔습니다. 이렇게 그들은 실로에 있는 그곳에 오는 온 이스라엘에게 행했습니다.[a][b]
  to: 그가 그것을 대야나 솥이나 주전자나 냄비에 찔러 넣곤 했습니다. 갈고리가 끌어올리는 것은 무엇이든지 제사장이 그것으로 가져가곤 했습니다. 그들은 실로에 오는 모든 이스라엘 사람에게 이와 같이 하곤 했습니다.[a][b]
  rationale: 반복적 관습을 나타내는 히브리어 미완료형을 ‘…하곤 했습니다’로 반영했습니다. ‘실로에 있는 그곳’의 중복을 제거하고, 복수 주어 ‘그들’을 보존했습니다. 용기 명칭 가운데 현대 한국어에서 오해하기 쉬운 ‘가마’를 ‘주전자’로 조정했으며, 정확한 기물 식별의 불확실성은 주석에서 명시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:21:18Z'
