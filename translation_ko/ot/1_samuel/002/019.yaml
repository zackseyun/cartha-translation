  to: 그의 어머니는 그를 위해 작은 겉옷을 만들어, 남편과 함께 해마다 제사를 드리러 올라갈 때마다 그것을 그에게 가져다주었습니다.[a]
  rationale: 여성형 동사에 따라 ‘올라가는’ 주어를 사무엘의 어머니로 바로잡고, 연례 제사의 의미와 반복 행동을 간결하게 재구성했습니다. ‘겉옷’, ‘올라가다’, ‘제사를 드리다’는 원문의 의복·순례·제의 의미를 자연스러운 현대 한국어로 보존합니다.
