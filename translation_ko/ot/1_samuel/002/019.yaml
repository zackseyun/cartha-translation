base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/019.yaml
  text: And his mother would make for him a small robe and bring it up to him from year to year[b][a], when she went up with her husband to offer the yearly sacrifice.
  footnotes:
  - marker: a
    text: Or 'a small cloak' or 'a little mantle.' The Hebrew מְעִיל refers to an outer garment; 'robe' best fits the likely sanctuary setting here.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from days to days,' an idiom meaning 'from year to year' or 'year by year.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 어머니는 그를 위해 작은 겉옷을 만들어 해마다 그것을 그에게 가져다주었으며, 그가 남편과 함께 올라가 해마다 드리는 제사를 드릴 때마다 그랬습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘날들로부터 날들로’라는 관용구로, ‘해마다’ 또는 ‘매년’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעִיל
  english_pob_choice: robe
  chosen_korean: 겉옷
  alternatives_korean:
  - 로브
  - 외투
  - 망토
  lexicon: HALOT
  rationale: מְעִיל은 겉에 입는 외투류를 가리키므로, 한국어에서는 문맥상 자연스럽고 의미 범위도 넓은 ‘겉옷’으로 옮겼습니다. ‘로브’는 음역 느낌이 강하고, ‘망토’는 형태를 지나치게 좁힙니다.
- source_word: קָטֹן
  english_pob_choice: small
  chosen_korean: 작은
  alternatives_korean:
  - 조그마한
  - 작디작은
  lexicon: HALOT
  rationale: 어린 사무엘의 몸에 맞는 크기라는 점을 드러내기 위해 ‘작은’이 가장 자연스럽습니다.
- source_word: מִיָּמִים יָמִימָה
  english_pob_choice: from year to year
  chosen_korean: 해마다
  alternatives_korean:
  - 매년
  - 해마다 해마다
  lexicon: HALOT
  rationale: 직역하면 ‘날들로부터 날들에’이지만, 관용적으로 반복되는 연례 행위를 뜻하므로 ‘해마다’로 옮겼습니다.
- source_word: בַּעֲלוֹתָהּ
  english_pob_choice: when she went up
  chosen_korean: 올라가
  alternatives_korean:
  - 올라갈 때
  - 올라가실 때
  lexicon: HALOT
  rationale: 성소로 올라가는 순례적 뉘앙스를 살리기 위해 ‘올라가’로 표현했습니다. 본문은 그의 어머니의 반복적 행동을 설명하므로 평서적 과거 서술에 맞춥니다.
theological_decisions:
- issue: 제사 표현의 직역성과 자연스러움
  chosen_reading: ‘해마다 드리는 제사’
  alternative_readings:
  - ‘연례 제사’
  - ‘해마다의 희생제물’
  rationale: זֶבַח הַיָּמִים은 정기적으로 반복되는 예배적 희생을 가리키므로, 한국어에서는 의미를 분명히 하면서도 제사 행위를 드러내는 표현이 적절합니다.
  doctrine_reference: 구약 제의 용어의 문맥적 번역 원칙
