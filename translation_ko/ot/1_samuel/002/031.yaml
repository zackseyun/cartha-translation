  yaml_path: translation/ot/1_samuel/002/031.yaml
  text: Look[a], days are coming when I will cut off your strength and the strength of your father's house, so that there will not be an old man in your house.
  footnotes:
  - marker: a
    text: Literally, 'your arm ... the arm of your father's house.' Here 'arm' is a Hebrew metaphor for strength or power.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 날들이 오고 있습니다. 내가 당신의 팔과 당신 아버지의 집의 팔을 끊어 버리겠습니다. 그러면 당신의 집에는 늙은 남자가 한 사람도 없게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 팔 … 당신 아버지의 집의 팔’입니다. 여기서 ‘팔’은 히브리어의 은유로, 힘이나 권세를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 예언적 선언을 여는 주의를 끄는 표현으로, 현대 한국어에서는 ‘보십시오’가 경고성과 공손한 선포의 힘을 함께 살립니다.
- source_word: יָמִים בָּאִים
  english_pob_choice: days are coming
  chosen_korean: 날들이 오고 있습니다
  alternatives_korean:
  - 다가오는 날들이 있습니다
  - 그 날들이 오고 있습니다
  lexicon: HALOT
  rationale: 임박한 심판을 알리는 관용구를 자연스러운 현재진행형으로 옮겨, 미래 지향성과 긴박감을 유지했습니다.
- source_word: זְרֹעֲךָ / זְרֹעַ בֵּית אָבִיךָ
  english_pob_choice: your strength / the strength of your father's house
  chosen_korean: 당신의 팔 / 당신의 아버지 집의 팔
  alternatives_korean:
  - 당신의 힘 / 당신의 아버지 집의 힘
  - 당신의 팔 / 당신의 아버지 집의 힘
  lexicon: HALOT
  rationale: 히브리어 ‘팔’의 문자적 이미지를 유지하되, 본문이 가리키는 능력과 세력을 드러내기 위해 ‘팔’로 직역했습니다. 영어 POB는 의미를 풀어 ‘strength’로 옮겼지만, 원문의 은유를 더 분명히 보이게 하는 쪽이 본문에 더 가깝습니다.
- source_word: מִהְיוֹת זָקֵן בְּבֵיתֶךָ
  english_pob_choice: so that there will not be an old man in your house
  chosen_korean: 당신의 집에는 늙은 사람이 하나도 없게 될 것입니다
  alternatives_korean:
  - 당신의 집에 늙은 사람이 남지 않게 될 것입니다
  - 당신의 집에 노인이 하나도 없게 될 것입니다
  lexicon: HALOT
  rationale: 결과를 나타내는 구문을 한국어에서 자연스럽게 풀어, 집안의 수명이 끊기는 심판의 뜻을 명확히 했습니다. ‘늙은 사람’은 여기서 직분이 아니라 연령을 가리킵니다.
theological_decisions:
- issue: ‘팔’ 은유를 한국어에서 어떻게 드러낼지
  chosen_reading: 문자적 이미지인 ‘팔’을 유지하여, 권세와 힘의 제거라는 심판의 상징을 보이게 했습니다.
  alternative_readings:
  - 의미를 풀어 ‘힘’으로 번역함
  - ‘권세’로 해석해 번역함
  rationale: 원문은 신체 부위를 통해 능력과 세력을 비유합니다. 이 비유를 보존하면 심판 선언의 날카로움과 가문 전체의 쇠퇴를 더 직접적으로 전달할 수 있습니다.
  doctrine_reference: Translation philosophy §1, §5
