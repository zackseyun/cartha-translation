id: 1SA.2.6
reference: 1 Samuel 2:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֖ה מֵמִ֣ית וּ/מְחַיֶּ֑ה מוֹרִ֥יד שְׁא֖וֹל וַ/יָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/006.yaml
  text: Yahweh puts to death and makes alive[a]; he brings down to Sheol and raises up.
  footnotes:
  - marker: a
    text: Or 'the grave' or 'the realm of the dead.' The Hebrew term 'Sheol' refers to the abode of the dead and should not be reduced automatically to 'hell.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 죽이시기도 하시고 살리시기도 하십니다. 그는 스올로 내리기도 하시고 올리기도 하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스올’은 죽은 자들의 거처를 가리키며, 자동으로 ‘지옥’으로 축소해서는 안 됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 고유명사/신명
  rationale: 원문은 하나님의 고유 이름을 사용하므로, POB의 영어 처리와 같이 한국어에서도 대체 호칭이 아닌 음역형 '야훼'로 옮겨 이름성을 보존했습니다.
- source_word: מֵמִית
  english_pob_choice: puts to death
  chosen_korean: 죽이시기도 하시고
  alternatives_korean:
  - 죽게 하시고
  - 죽게 만드시고
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리면서도 한국어에서 자연스러운 신적 행위 표현으로 옮겼습니다.
- source_word: וּמְחַיֶּה
  english_pob_choice: and makes alive
  chosen_korean: 살리시기도 하십니다
  alternatives_korean:
  - 생명을 주시기도 하십니다
  - 살게 하시기도 하십니다
  lexicon: HALOT
  rationale: 앞절과 평행을 이루는 사역적 표현을 유지하기 위해 '살리다'를 사용했습니다. '생명을 주다'보다 죽음-생명 대구가 더 분명합니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 음부
  - 무덤
  - 죽은 자들의 세계
  lexicon: HALOT
  rationale: 히브리어 개념을 좁게 '무덤'이나 전통적 교회어 '음부'로 환원하지 않기 위해 음역형 '스올'을 유지했습니다.
theological_decisions:
- issue: 스올을 한국어에서 어떻게 보존할지
  chosen_reading: '''스올''을 본문에 유지하고, 지옥으로 바꾸지 않았습니다.'
  alternative_readings:
  - 지옥
  - 무덤
  - 죽은 자들의 세계
  rationale: 원문은 사후 세계의 넓은 범주를 가리키며, 후대의 '지옥' 개념으로 곧장 제한하면 시적·신학적 폭이 줄어듭니다. POB의 긴장을 그대로 보존하는 선택입니다.
  doctrine_reference: 원문의 의미 범위를 좁히지 않기
- issue: ‘올리다’의 종말론적 구체화 여부
  chosen_reading: '''올리시기도 하십니다''로 넓게 옮겨, 육체적 부활로 과도하게 특정하지 않았습니다.'
  alternative_readings:
  - 죽은 자 가운데서 다시 살리십니다
  - 무덤에서 건져 올리십니다
  rationale: 히브리어 동사는 시적 평행 속에서 포괄적 회복을 말하며, 본문 자체가 부활 교리를 직접 명시하지는 않습니다. 따라서 의미의 긴장을 유지했습니다.
  doctrine_reference: 본문의 범위를 넘는 구체화 자제
