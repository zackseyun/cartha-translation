  to: 그리고 네 집에 남은 사람은 모두 은 한 조각[a]과 빵 한 덩이를 얻기 위해 그에게 와서 절하며 말할 것입니다. ‘부디 저를 제사장 직무 하나[b]에 소속시켜 주십시오. 제가 빵 한 조각을 먹을 수 있게 해 주십시오.’
  rationale: 본문의 의미와 모호성은 유지하면서, 현대 표준 한국어의 자연스러운 어순·연어로 다듬었습니다. ‘얻기 위해’는 לְ의 목적·의존 관계를 문맥상 자연스럽게 나타내며, ‘소속시켜 주십시오’는 ספח의 결합 의미와 청원의 공손한 합쇼체를 함께 살립니다. 각주 표지도 해당 낱말에 직접 배치했습니다.
