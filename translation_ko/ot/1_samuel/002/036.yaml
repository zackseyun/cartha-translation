  naturalness: ‘은 한 조각’, ‘빵 한 덩이’, ‘제사장 직무 하나에 소속시켜’가 표준 현대 한국어에서 더 자연스럽고 뜻도 분명합니다. ‘와서 절하며’는 본문의 순차적 행동을 잘 드러냅니다.
