source:
  edition: WLC
  text: וְ/הָיָ֗ה כָּל הַ/נּוֹתָר֙ בְּ/בֵ֣יתְ/ךָ֔ יָבוֹא֙ לְ/הִשְׁתַּחֲוֺ֣ת ל֔/וֹ לַ/אֲג֥וֹרַת כֶּ֖סֶף וְ/כִכַּר לָ֑חֶם וְ/אָמַ֗ר סְפָחֵ֥/נִי נָ֛א אֶל אַחַ֥ת הַ/כְּהֻנּ֖וֹת לֶ/אֱכֹ֥ל פַּת לָֽחֶם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/036.yaml
  text: And everyone left in your house will come to bow down to him for a piece of silver and a loaf of bread[a], and will say, ‘Please attach me to one of the priestly offices[b], so that I may eat a morsel of bread.’
  footnotes:
  - marker: a
    text: Or 'for a silver coin'; the Hebrew names a small unit of silver.
    reason: lexical_alternative
  - marker: b
    text: Or 'attach me to one of the priestly duties.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네 집에 남은 사람은 모두 은 한 조각[a]과 빵 한 덩이를 얻기 위해 그에게 와서 절하며 말할 것입니다. ‘부디 저를 제사장 직무 하나[b]에 소속시켜 주십시오. 제가 빵 한 조각을 먹을 수 있게 해 주십시오.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은 한 닢을’; 히브리어는 작은 은 단위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제사장 직무들 가운데 하나에’ 또는 ‘제사장들의 직무 가운데 하나에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר
  english_pob_choice: left
  chosen_korean: 남은 사람
  alternatives_korean:
  - 남아 있는 자
  - 남은 자
  lexicon: HALOT
  rationale: יתר/נותר의 분사로서 심판 이후 ‘남아 있는’ 사람을 가리키므로, 자연스러운 현대 한국어로 ‘남은 사람’이라 옮겼습니다.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  english_pob_choice: to bow down to him
  chosen_korean: 그에게 와서 절하며
  alternatives_korean:
  - 그에게 엎드려 절하며
  - 그에게 경배하며
  lexicon: HALOT
  rationale: 신체적 굴복과 예속의 의미를 살리되, 지나치게 예전적이지 않게 ‘와서 절하다’로 옮겼습니다.
- source_word: לַאֲגֹרַת כֶּסֶף וְכִכַּר לָחֶם
  english_pob_choice: for a piece of silver and a loaf of bread
  chosen_korean: 한 조각 은과 한 덩이 떡
  alternatives_korean:
  - 은 한 닢과 떡 한 덩이
  - 은 한 조각과 빵 한 덩이
  lexicon: HALOT
  rationale: 작은 은 화폐 단위와 소박한 식량의 이미지를 살리기 위해 직역적으로 ‘한 조각 은’과 ‘한 덩이 떡’을 선택했습니다.
- source_word: סְפָחֵנִי
  english_pob_choice: attach me
  chosen_korean: 저를 ... 붙여 주셔서
  alternatives_korean:
  - 저를 ... 붙여 주십시오
  - 저를 ... 속하게 해 주셔서
  lexicon: HALOT
  rationale: ספח의 핵심은 ‘붙이다/덧붙이다’이므로, 제의적 직무에 자신을 연결해 달라는 뜻을 드러내는 ‘붙여 주다’를 사용했습니다.
- source_word: אַחַת הַכְּהֻנּוֹת
  english_pob_choice: one of the priestly offices
  chosen_korean: 제사장 직무들 가운데 하나
  alternatives_korean:
  - 제사장 직분들 가운데 하나
  - 제사장 직무 중 하나
  lexicon: HALOT
  rationale: כְּהֻנּוֹת의 복수형을 단순한 ‘제사장’이 아니라 제사장으로서의 직무/임무 범주로 이해하여, 제도적 뉘앙스를 살렸습니다.
- source_word: פַּת לָחֶם
  english_pob_choice: a morsel of bread
  chosen_korean: 한 조각 떡
  alternatives_korean:
  - 한 입의 떡
  - 떡 한 조각
  lexicon: HALOT
  rationale: פַּת은 작은 조각, 한 입거리를 가리키므로 빈곤한 청원의 느낌이 나도록 ‘한 조각 떡’으로 옮겼습니다.
theological_decisions:
- issue: ‘그에게’의 지시 대상
  chosen_reading: 남은 자들은 제사장 권위를 가진 한 인물에게 굴복하게 됩니다.
  alternative_readings:
  - 더 일반적으로는 그때의 제사장 직위를 지닌 사람을 가리킬 수 있습니다.
  rationale: 본문은 엘리 집안의 역전과 종속을 강조하므로, 특정 권위자 앞에서의 굴복이라는 흐름을 살리되 지시 대상을 과도하게 특정하지 않았습니다.
  doctrine_reference: 1 Samuel 2:36의 심판 선언과 제사장직의 역전
