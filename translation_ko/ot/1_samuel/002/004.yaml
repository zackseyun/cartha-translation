lexical_decisions:
- source_word: קֶשֶׁת
  english_pob_choice: bows
  chosen_korean: 활
  alternatives_korean:
  - 활들
  - 활무기
  lexicon: HALOT
  rationale: 시적 문맥에서 무기 자체를 가리키는 단수형 명사이므로, 한국어에서는 집합적 의미를 자연스럽게 드러내는 ‘활’이 적절합니다.
- source_word: גִּבֹּרִים
  english_pob_choice: the mighty
  chosen_korean: 용사들
  alternatives_korean:
  - 강한 자들
  - 영웅들
  - 힘센 자들
  lexicon: HALOT
  rationale: 전투적·시적 뉘앙스를 살리면서도 지나치게 좁게 ‘군인들’로 한정하지 않기 위해 ‘용사들’로 옮겼습니다.
- source_word: חַתִּים
  english_pob_choice: are shattered
  chosen_korean: 부서지고
  alternatives_korean:
  - 깨지고
  - 산산이 부서지고
  - 꺾이고
  lexicon: HALOT
  rationale: 활과의 결합에서 물리적으로 꺾이거나 산산이 무너지는 이미지를 드러내는 표현으로, 영어 POB의 강한 파괴감을 반영합니다.
- source_word: נִכְשָׁלִים
  english_pob_choice: those who stumble
  chosen_korean: 비틀거리던 자들
  alternatives_korean:
  - 넘어지던 자들
  - 실족하던 자들
  - 흔들리던 자들
  lexicon: HALOT
  rationale: 히브리어 분사는 반복적 상태를 나타내므로, 단발적 사건보다 ‘비틀거리던’이라는 진행·상태감을 살렸습니다.
- source_word: אָזְרוּ חָיִל
  english_pob_choice: are girded with strength
  chosen_korean: 힘으로 띠를 두릅니다
  alternatives_korean:
  - 힘으로 허리를 동입니다
  - 능력으로 무장합니다
  - 힘을 띠로 두릅니다
  lexicon: HALOT
  rationale: אָזַר의 ‘띠를 두르다/동이다’라는 몸의 이미지를 유지하되, 한국어에서 자연스러운 동작 표현으로 옮겼습니다. חָיִל은 여기서 전투력보다 넓은 ‘힘’의 의미가 더 적절합니다.
theological_decisions:
- issue: 반전의 시적 이미지 보존
  chosen_reading: 추상화하지 않고 활, 비틀거림, 띠를 두름이라는 구체적 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 강한 자는 무너지고 약한 자는 강해진다
  rationale: 이 절은 하나님의 역전시키시는 통치를 시적으로 드러내므로, 이미지를 보존해야 본문의 신학적 힘이 약화되지 않습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
