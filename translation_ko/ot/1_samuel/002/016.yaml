  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו הָ/אִ֗ישׁ קַטֵּ֨ר יַקְטִיר֤וּ/ן כַּ/יּוֹם֙ הַ/חֵ֔לֶב וְ/קַ֨ח לְ/ךָ֔ כַּ/אֲשֶׁ֥ר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/אָמַ֥ר ל/ו כִּ֚י עַתָּ֣ה תִתֵּ֔ן וְ/אִם לֹ֖א לָקַ֥חְתִּי בְ/חָזְקָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/016.yaml
  text: And the man would say to him[a], “Let them first burn the fat today, and then take for yourself whatever your soul desires.” But he would say to him, “No, you must give it now; and if not, I will take it by force.”
  footnotes:
  - marker: a
    text: Or, more literally, 'Let them surely burn the fat today, then take for yourself as your soul desires.' The Hebrew uses an emphatic verbal form.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람이 그에게 말하기를 「먼저 오늘 그 기름을 불살라야 합니다. 그런 다음 당신 마음이 원하는 것은 무엇이든지 가져가십시오」라고 하였습니다. 그러나 그는 그에게 말하기를 「아니요, 지금 주셔야 합니다. 그렇지 않으면 내가 힘으로 빼앗겠습니다」라고 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘먼저 … 불살라야 합니다’는 히브리어의 강조형 동사 구조를 한국어에서 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 그 사람
  lexicon: HALOT
  rationale: 특정된 단수 인물을 가리키므로 자연스러운 지시 표현으로 옮겼습니다. 문맥상 제사장에게 말하는 제의 참석자를 가리키며, 불필요한 해석을 덧붙이지 않았습니다.
- source_word: קַטֵּר יַקְטִירוּן
  english_pob_choice: Let them first burn
  chosen_korean: 먼저 … 불살라야 합니다
  alternatives_korean:
  - 먼저 … 태워야 합니다
  - 반드시 먼저 … 불살라야 합니다
  lexicon: HALOT
  rationale: 인피니티브 절대형과 미완료형의 강조를 한국어에서는 ‘먼저’와 의무형으로 풀어, 제의 순서의 우선성과 강조를 함께 살렸습니다.
- source_word: הַחֵלֶב
  english_pob_choice: the fat
  chosen_korean: 그 기름
  alternatives_korean:
  - 그 지방
  - 그 기름기
  lexicon: HALOT
  rationale: 제물에서 불살라야 하는 부분을 가리키는 관용적 표현으로 한국어 성경에서 익숙한 ‘기름’을 사용했습니다.
- source_word: כַּאֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  english_pob_choice: whatever your soul desires
  chosen_korean: 당신 마음이 원하는 것은 무엇이든지
  alternatives_korean:
  - 당신 혼이 원하는 것은 무엇이든지
  - 당신이 원하는 대로
  lexicon: HALOT
  rationale: 히브리어의 ‘영혼/목숨’ 관용을 직역해도 되지만, 한국어에서는 의미상 자연스럽게 ‘마음’으로 옮겨 욕망의 주체를 드러냈습니다.
- source_word: בְחָזְקָה
  english_pob_choice: by force
  chosen_korean: 힘으로 빼앗겠습니다
  alternatives_korean:
  - 강제로 취하겠습니다
  - 무력으로 빼앗겠습니다
  lexicon: HALOT
  rationale: 단순한 ‘취하다’보다 위협의 폭력성을 분명히 드러내기 위해 ‘힘으로 빼앗다’로 옮겼습니다. 동사의 미래적 위협 뉘앙스를 한국어 미래형으로 반영했습니다.
theological_decisions:
- issue: 제사 순서에 대한 서술 방식
  chosen_reading: 본문의 논점을 따라, 기름을 먼저 불사르고 그 뒤에 가져가라는 순서를 본문 안에서 분명히 드러냈습니다.
  alternative_readings:
  - 순서를 덜 명시하여 직역적으로만 옮김
  rationale: 이 절은 제의의 올바른 순서와 그 순서를 무시하는 폭력적 요구의 대비가 핵심이므로, 독자가 바로 이해할 수 있도록 순서를 분명히 했습니다.
  doctrine_reference: 레위기 3:16-17; 7:23-25의 제의 규정과 연결되는 문맥
- issue: 직접화법의 어조
  chosen_reading: 대화의 격한 대립을 살리기 위해, 후반부는 단호한 거절과 위협이 드러나도록 옮겼습니다.
  alternative_readings:
  - 완곡하고 중립적인 어조로 번역
  rationale: 원문의 압박과 강제의 뉘앙스를 약화시키지 않기 위해, ‘아니요’와 ‘빼앗겠습니다’를 사용해 대립을 선명하게 했습니다.
  doctrine_reference: 본문 내 서사적·윤리적 긴장 보존
