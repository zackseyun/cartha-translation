  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִשְׁפַּ֥ט הַ/כֹּהֲנִ֖ים אֶת הָ/עָ֑ם כָּל אִ֞ישׁ זֹבֵ֣חַ זֶ֗בַח וּ/בָ֨א נַ֤עַר הַ/כֹּהֵן֙ כְּ/בַשֵּׁ֣ל הַ/בָּשָׂ֔ר וְ/הַ/מַּזְלֵ֛ג שְׁלֹ֥שׁ הַ/שִּׁנַּ֖יִם בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/013.yaml
  text: 'Now the custom of the priests with the people was this: whenever any man was sacrificing a sacrifice[a], the priest’s servant would come while the meat was boiling, with the three-pronged fork in his hand.'
  footnotes:
  - marker: a
    text: Or “flesh-hook”; the Hebrew refers to a fork-like implement used to take meat from the pot.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 제사장들의 백성에 대한 관례는 이러했습니다. 곧 어떤 사람이든 제물을 바칠 때면, 제사장의 종이 와서 고기가 끓는 동안 손에 삼갈래 포크를 들고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘삼갈래 포크’는 고기를 건져 올리는 갈래 달린 도구를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפַּט
  english_pob_choice: Now the custom
  chosen_korean: 이제 제사장들의 백성에 대한 관례는 이러했습니다
  alternatives_korean:
  - 그리고 제사장들의 백성에 대한 규정은 이러했습니다
  - 제사장들의 백성에 대한 법도는 이러했습니다
  lexicon: HALOT
  rationale: 문맥상 משפט는 재판이 아니라 오랫동안 굳어진 관행을 가리키므로 ‘관례’가 가장 자연스럽습니다. 서두의 ו는 장면 전환을 나타내어 ‘이제’로 풀었습니다.
- source_word: כָּל־אִישׁ זֹבֵחַ זֶבַח
  english_pob_choice: whenever any man was sacrificing a sacrifice
  chosen_korean: 어떤 사람이든 제물을 바칠 때면
  alternatives_korean:
  - 누구든지 제물을 바칠 때면
  - 어떤 남자든 제사를 드릴 때면
  lexicon: HALOT
  rationale: 히브리어의 일반 남성 단수는 ‘어떤 사람’으로 자연스럽게 살리되, POB의 분산적 의미를 반영해 ‘-이든’ 구조로 옮겼습니다. זבח/זבח의 중첩은 한국어에서 과도한 반복이 되므로 ‘제물을 바치다’로 간결하게 옮겼습니다.
- source_word: נַעַר הַכֹּהֵן
  english_pob_choice: the priest’s servant
  chosen_korean: 제사장의 종
  alternatives_korean:
  - 제사장의 시종
  - 제사장의 젊은이
  lexicon: HALOT
  rationale: 여기서는 제사장을 보조하는 역할이 핵심이므로 ‘종’이 기능을 가장 분명하게 드러냅니다. ‘젊은이’는 나이 중심의 뉘앙스가 강해 문맥에 덜 맞습니다.
- source_word: הַמַּזְלֵג שְׁלֹשׁ הַשִּׁנַּיִם
  english_pob_choice: the three-pronged fork
  chosen_korean: 삼갈래 포크
  alternatives_korean:
  - 세 갈래 포크
  - 삼갈래 갈고리
  lexicon: HALOT
  rationale: 도구의 모양을 직접 드러내는 표현이므로 ‘삼갈래’가 מקור의 ‘세 이’라는 형상을 살립니다. 영어 POB의 주석이 말하는 섭취용 갈래 달린 도구라는 점을 반영해 현대어로는 ‘포크’를 택했습니다.
- source_word: בְּיָדוֹ
  english_pob_choice: in his hand
  chosen_korean: 손에
  alternatives_korean:
  - 그의 손에
  - 손 안에
  lexicon: HALOT
  rationale: 도구를 들고 있다는 동작이 핵심이므로 한국어 관용에 맞게 ‘손에’로 간결히 옮겼습니다.
theological_decisions:
- issue: 이 절의 משפט를 법적 심판이 아닌 제사장 관행으로 읽는 문제
  chosen_reading: 제사장들의 백성에 대한 오래된 관례를 소개하는 서술로 읽었습니다.
  alternative_readings:
  - 제사장들의 백성에 대한 권리/몫을 가리킨다고 읽는 해석
  - 제사 규례 자체를 가리킨다고 읽는 해석
  rationale: 본문은 제사장의 행동 방식에 대한 서술로 이어지므로, משפט를 제도적·관습적 의미로 이해해야 문맥이 자연스럽습니다.
  doctrine_reference: 본문 문맥 해석
