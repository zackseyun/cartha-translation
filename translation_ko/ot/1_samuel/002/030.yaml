  - 따라서
  lexicon: HALOT
  rationale: 앞선 책망과 판결에서 이어지는 인과·결론 표지를 자연스럽게 살리면서, 예언적 선언의 논리 흐름을 유지합니다.
- source_word: נְאֻם יְהוָה
