  rationale: 현대 표준어 합쇼체로 문장 종결과 예언 공식의 표현을 일관되게 다듬었습니다. אָמוֹר אָמַרְתִּי의 강조는 ‘분명히’로, כבד의 반복은 ‘공경하다’의 반복으로 보존했습니다. 마지막 동사는 히브리어 수동형과 ‘공경’의 반대 대조를 살려 ‘하찮게 여김을 받을 것입니다’로 수정했으며, 가능한 어휘 범위는 각주에 남겼습니다.
