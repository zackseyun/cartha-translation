  lexicon: HALOT
  rationale: 예언문 공식의 선언성을 살리되, 한국어에서는 종결 어미를 통해 자연스럽고 공적 선언처럼 들리게 했습니다.
- source_word: אָמֹר אָמַרְתִּי
  english_pob_choice: I indeed said
  chosen_korean: 내가 참으로 말하기를
  alternatives_korean:
  - 내가 분명히 말하기를
  - 내가 분명히 말했다
  lexicon: HALOT
  rationale: 히브리어 강조 구문을 직설적으로 반영하되, 한국어에서 과도하게 투박하지 않도록 ‘참으로’로 강조를 살렸습니다.
- source_word: מְכַבְּדַי אֲכַבֵּד
  english_pob_choice: those who honor me I will honor
  chosen_korean: 나를 존중하는 자들을 내가 존중하겠고
  alternatives_korean:
  - 나를 공경하는 자들을 내가 공경하겠고
  - 나를 영예롭게 하는 자들을 내가 영예롭게 하겠고
  lexicon: HALOT
  rationale: כבד의 반복을 한국어에서도 같은 어근으로 되풀이해 상호응보의 수사와 말장난을 보존했습니다.
- source_word: וּבֹזַי יֵקָלּוּ
  english_pob_choice: those who despise me will be lightly esteemed
  chosen_korean: 나를 멸시하는 자들은 천히 여김을 받게 하겠다
  alternatives_korean:
  - 나를 업신여기는 자들은 하찮게 여김을 받게 하겠다
  - 나를 멸시하는 자들은 가벼이 여김을 받게 하겠다
  lexicon: HALOT
  rationale: קלל/קלה의 ‘가볍다, 하찮다, 천하다’는 의미를 살리면서, ‘존중하다’와의 대비를 유지하도록 ‘천히 여김’으로 옮겼습니다.
theological_decisions:
- issue: ‘far be it from me’의 강한 부정 강도
  chosen_reading: ‘결코 그럴 수 없다!’로 번역해, 단순한 유보가 아니라 이전 약속의 무조건성을 거부하는 강한 부정을 드러냈습니다.
  alternative_readings:
  - ‘그럴 수 없다!’
  - ‘내게서 그런 일은 없을 것이다!’
  rationale: 히브리어 חָלִילָה לִּי의 결연한 거절을 약화시키지 않으면서, 현대 한국어에서 자연스럽고 단호하게 들리도록 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
