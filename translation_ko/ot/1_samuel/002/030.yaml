base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/030.yaml
  text: 'Therefore[a], declares Yahweh, the God of Israel: I indeed said that your house and your father’s house would walk before me forever. But now, declares Yahweh: far be it from me! For those who honor me I will honor, but those who despise me will be lightly esteemed.'
  footnotes:
  - marker: a
    text: Or 'will be dishonored' or 'will be treated as insignificant.' The Hebrew verb carries the sense of becoming light, slight, or of little account, in contrast to 'I will honor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이스라엘의 하나님 야훼께서 말씀하십니다. “내가 분명히 말했습니다. 네 집과 네 아버지의 집이 영원히 내 앞에서 다닐 것이라고 말입니다. 그러나 이제 야훼께서 말씀하십니다. ‘결코 그렇지 않습니다! 나를 공경하는 사람은 내가 공경하겠지만, 나를 멸시하는 사람은 하찮게 여김을 받을 것입니다.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하찮게 여김을 받을 것입니다’에 해당하는 히브리어는 ‘가볍다’라는 뜻에서 파생되었으며, ‘업신여김을 받다’ 또는 ‘불명예를 당하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
