- from: 그러므로 야훼, 이스라엘의 하나님께서 말씀하십니다. “내가 참으로 말하기를 네 집과 네 아버지의 집이 영원히 내 앞에서 다니리라 하였으나, 이제 야훼의 말씀이니라. 결코 그럴 수 없다! 나를 존중하는 자들을 내가 존중하겠고, 나를 멸시하는 자들은 천히 여김을 받게 하겠다.”[a]
