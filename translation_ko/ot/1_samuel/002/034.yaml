  - 하루 만에
  lexicon: HALOT
  rationale: 히브리어의 시간 표현은 두 사람이 같은 날 죽는다는 뜻이므로, 자연스러운 한국어로 ‘하루에’라고 했습니다.
theological_decisions:
- issue: 표의 기능
  chosen_reading: 앞서 선포된 심판이 실제로 이루어질 것을 확인하는 표
  alternative_readings:
