  - 표적
  lexicon: HALOT
  rationale: אוֹת는 여기서 예고된 말씀이 실제로 이루어질 것을 가리키는 확인 표지이므로, 문맥상 자연스럽고 간결한 ‘표’로 옮겼습니다.
