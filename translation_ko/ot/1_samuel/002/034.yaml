  text: וְ/זֶה לְּ/ךָ֣ הָ/א֗וֹת אֲשֶׁ֤ר יָבֹא֙ אֶל שְׁנֵ֣י בָנֶ֔י/ךָ אֶל חָפְנִ֖י וּ/פִֽינְחָ֑ס בְּ/י֥וֹם אֶחָ֖ד יָמ֥וּתוּ שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/034.yaml
  text: 'And this will be the sign to you that will come upon your two sons[b][a], Hophni and Phinehas: both of them will die on one day.'
  footnotes:
  - marker: a
    text: Or 'that will happen to your two sons.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'on one day'; that is, both will die the same day.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 곧 당신에게 임할 표입니다. 곧 당신의 두 아들, 홉니와 비느하스가 하루에 모두 죽을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉 두 아들이 같은 날 죽는다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 두 아들에게 일어날 일’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  english_pob_choice: the sign
  chosen_korean: 표
  alternatives_korean:
  - 징조
  - 표적
  lexicon: HALOT
  rationale: אוֹת는 여기서 예고된 말씀이 실제로 이루어질 것을 가리키는 확인 표지이므로, 문맥상 자연스럽고 간결한 ‘표’로 옮겼습니다.
- source_word: אֲשֶׁר יָבֹא אֶל
  english_pob_choice: that will come upon
  chosen_korean: 임할
  alternatives_korean:
  - 다가올
  - 오게 될
  lexicon: HALOT
  rationale: 사건이나 심판이 ‘~에게 임하다’는 한국어가 히브리어의 도래·엄습 뉘앙스를 잘 살립니다.
- source_word: שְׁנֵי בָנֶיךָ
  english_pob_choice: your two sons
  chosen_korean: 당신의 두 아들
  alternatives_korean:
  - 두 아들
  - 두 아드님
  lexicon: HALOT
  rationale: 직접적인 소유 관계를 분명히 드러내기 위해 ‘당신의 두 아들’로 옮겼습니다.
- source_word: בְּיוֹם אֶחָד
  english_pob_choice: on one day
  chosen_korean: 하루에
  alternatives_korean:
  - 같은 날에
  - 하루 만에
  lexicon: HALOT
  rationale: 히브리어의 시간 표현은 두 사람이 같은 날 죽는다는 뜻이므로, 자연스러운 한국어로 ‘하루에’라고 했습니다.
theological_decisions:
- issue: 표의 기능
  chosen_reading: 앞서 선포된 심판이 실제로 이루어질 것을 확인하는 표
  alternative_readings:
  - 단순한 예언적 징조
  - 미리 주어지는 불길한 징후
  rationale: 문맥상 이 표는 엘리 집안에 대한 하나님의 판결이 실제로 성취된다는 확인 역할을 합니다. 그래서 본문 의미를 좁히지 않고 ‘표’로 유지했습니다.
  doctrine_reference: 예언 성취와 하나님의 신실하심
