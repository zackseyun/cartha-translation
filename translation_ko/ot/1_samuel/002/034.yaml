  text: 'And this will be the sign to you that will come upon your two sons[b][a], Hophni and Phinehas: both of them will die on one day.'
  footnotes:
  - marker: a
    text: Or 'that will happen to your two sons.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'on one day'; that is, both will die the same day.
    reason: lexical_alternative
translation:
  language: ko
  text: '이것이 당신에게 표가 될 것입니다. 당신의 두 아들, 곧 홉니와 비느하스에게 임할 일은 이렇습니다[a]: 두 사람은 같은 날[b] 모두 죽을 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 두 아들에게 일어날 일’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘한 날에’입니다. 곧 두 사람이 같은 날 죽는다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  english_pob_choice: the sign
  chosen_korean: 표
