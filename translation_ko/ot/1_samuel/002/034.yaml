  source_fidelity: 히브리어는 ‘당신에게 표가 될 것’과 그 표의 내용, 곧 홉니와 비느하스 두 사람이 한 날에 죽는 일을 명확히 연결합니다. 초안도 핵심 뜻은 전달하지만, ‘당신에게 임할 표’는 표가 엘리에게 임한다는 인상을 주어 관계절의 수식 대상을 흐립니다. 표가 되는 사건은 두 아들에게 임합니다.
  naturalness: ‘표’는 이 문맥에서 가능하나, ‘이것이 곧 당신에게 임할 표입니다’는 현대 한국어로 다소 부자연스럽고 의미 관계가 불분명합니다. ‘당신에게 표가 될 것입니다’와 ‘두 아들에게 임할 일’을 분리하면 자연스럽고 정확합니다.
