  source_fidelity: 첫 절의 וּפִלְלוֹ אֱלֹהִים은 법적 판정/중재의 뜻을 지닐 수 있고, אֱלֹהִים은 하나님 또는 재판관들로 읽힐 여지가 있습니다. 본문은 문맥상 ‘하나님’으로 유지하고 대안은 각주로 보존했습니다. 둘째 절의 יִתְפַּלֶּל은 기본적으로 ‘기도하다’이므로 본문을 ‘기도하겠습니까’로 고쳤으며, ‘중보하다’는 각주에 보존했습니다. 마지막 절의 야훼의 의지와 죽음에 이르게 하심도 완화하지 않았습니다.
  naturalness: ‘아버지의 음성에 귀를 기울이지’보다 ‘아버지의 말씀에 귀를 기울이지’가 현대 표준 한국어에서 자연스럽고, 합쇼체 문장 종결을 일관되게 적용했습니다. 시제·양태도 히브리어의 경고성 병렬에 맞추어 첫 두 절을 미래형으로 정리했습니다.
  terminology: ‘야훼’, ‘하나님’, ‘죄를 짓다’, ‘기도하다’를 유지했습니다. 본문에서 전문 신학어인 ‘중보하다’를 기본 번역으로 삼지 않고, 히브리어 히트파엘의 일반적인 의미에 맞는 ‘기도하다’를 사용했습니다.
