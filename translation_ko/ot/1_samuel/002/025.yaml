reference: 1 Samuel 2:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם יֶחֱטָ֨א אִ֤ישׁ לְ/אִישׁ֙ וּ/פִֽלְל֣/וֹ אֱלֹהִ֔ים וְ/אִ֤ם לַֽ/יהוָה֙ יֶֽחֱטָא אִ֔ישׁ מִ֖י יִתְפַּלֶּל ל֑/וֹ וְ/לֹ֤א יִשְׁמְעוּ֙ לְ/ק֣וֹל אֲבִי/הֶ֔ם כִּֽי חָפֵ֥ץ יְהוָ֖ה לַ/הֲמִיתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/025.yaml
  text: If a man sins against another man[a], God will mediate for him; but if a man sins against Yahweh, who will pray for him? But they would not listen to the voice of their father[b], because Yahweh desired to put them to death.
  footnotes:
  - marker: a
    text: Or 'the judges will judge him.' The Hebrew אֱלֹהִים can sometimes refer to human judges; here the main text reads 'God' because the contrast with 'the LORD' favors a divine referent.
    reason: alternative_reading
  - marker: b
    text: Or 'who will intercede for him?' The Hebrew verb can carry the sense of praying or interceding.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 다른 사람에게 죄를 지으면 하나님이 그를 판단하십니다. 그러나 사람이 야훼께 죄를 지으면 누가 그를 위해 중보하겠습니까? 그러나 그들은 아버지의 음성에 귀를 기울이지 않았습니다. 야훼께서 그들을 죽이시기를 원하셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재판관들이 그를 판결할 것이다.’ 히브리어 אֱלֹהִים은 때때로 인간 재판관을 가리킬 수 있습니다. 그러나 여기서는 ‘야훼’와의 대비가 하나님을 가리키는 해석을 더 강하게 만듭니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘누가 그를 위해 간구하겠습니까?’ 히브리어 동사는 기도하다/간구하다의 뜻을 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ לְאִישׁ
  english_pob_choice: a man ... another man
  chosen_korean: 사람이 다른 사람에게
  alternatives_korean:
  - 한 사람이 다른 사람에게
  - 어떤 사람이 다른 사람에게
  lexicon: HALOT
  rationale: 히브리어가 남성 단수 형태이므로 관계의 대칭을 살리면서도 한국어에서는 자연스럽게 ‘사람’으로 풀었습니다.
- source_word: וּפִלְלוֹ אֱלֹהִים
  english_pob_choice: God will mediate for him
  chosen_korean: 하나님이 그를 판단하십니다
  alternatives_korean:
  - 하나님이 그를 중재하십니다
  - 하나님이 그를 재판하십니다
  lexicon: HALOT
  rationale: פּלל의 사법적 의미를 살려 판정/판결의 성격을 드러내되, 한국어 독자가 즉시 이해할 수 있는 ‘판단하다’로 옮겼습니다.
- source_word: מִי יִתְפַּלֶּל לוֹ
  english_pob_choice: who will pray for him?
  chosen_korean: 누가 그를 위해 중보하겠습니까?
  alternatives_korean:
  - 누가 그를 위해 기도하겠습니까?
  - 누가 그를 위해 변호하겠습니까?
  lexicon: HALOT
  rationale: 히트파엘 פלל의 ‘기도하다/중보하다’ 의미를 반영하고, 앞절의 사법적 어감과의 연결을 살리기 위해 ‘중보하다’를 택했습니다.
- source_word: לְקוֹל אֲבִיהֶם
  english_pob_choice: the voice of their father
  chosen_korean: 아버지의 음성
  alternatives_korean:
  - 아버지의 말을
  - 아버지의 목소리
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 유지하되, 한국어에서도 통하는 표현으로 ‘음성’을 선택했습니다.
- source_word: חָפֵץ יְהוָה
  english_pob_choice: Yahweh desired
  chosen_korean: 야훼께서 ... 원하셨기 때문입니다
  alternatives_korean:
  - 야훼께서 ... 기뻐하셨기 때문입니다
  - 야훼께서 ... 뜻하셨기 때문입니다
  lexicon: HALOT
  rationale: חפץ의 ‘원하다/원하는 마음을 두다’라는 직접적 의미를 살려, 신학적으로도 지나치게 완화하지 않는 ‘원하셨다’를 택했습니다.
- source_word: לַהֲמִיתָם
  english_pob_choice: to put them to death
  chosen_korean: 그들을 죽이시기를
  alternatives_korean:
  - 그들을 죽게 하시기를
  - 그들의 죽음을 이루시기를
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 한국어로 분명하게 드러내기 위해 ‘죽이시다’로 옮겼습니다.
theological_decisions:
- issue: אֱלֹהִים의 번역
  chosen_reading: 하나님
  alternative_readings:
  - 재판관들
  - 판관들
  rationale: 아버지의 법정적 중재와 야훼에 대한 대비가 이어지므로, 여기서는 인간 재판관보다 하나님을 가리키는 읽기가 문맥상 더 강합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 첫 절과 둘째 절의 פלל 반복
  chosen_reading: 첫 절은 판단하다, 둘째 절은 중보하다
  alternative_readings:
  - 둘 다 중재하다
  - 둘 다 기도하다
  rationale: 같은 어근의 반복이 있지만 문맥 기능이 다릅니다. 첫 절은 판결의 의미를, 둘째 절은 대신 나아가 기도/중보하는 의미를 살려 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3
