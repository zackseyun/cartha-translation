source:
  edition: WLC
  text: וּ/בֵרַ֨ךְ עֵלִ֜י אֶת אֶלְקָנָ֣ה וְ/אֶת אִשְׁתּ֗/וֹ וְ/אָמַר֙ יָשֵׂם֩ יְהוָ֨ה לְ/ךָ֥ זֶ֨רַע֙ מִן הָ/אִשָּׁ֣ה הַ/זֹּ֔את תַּ֚חַת הַ/שְּׁאֵלָ֔ה אֲשֶׁ֥ר שָׁאַ֖ל לַֽ/יהוָ֑ה וְ/הָלְכ֖וּ לִ/מְקֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/020.yaml
  text: And Eli would bless Elkanah and his wife and say[b][a], “May Yahweh give you offspring by this woman in place of the petition that was asked for Yahweh.” Then they would go to his place.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in place of the request/loan that she asked from the LORD.'' The wording echoes the root ''ask'' used repeatedly in the Samuel birth narrative and may allude specifically to Samuel as the child obtained by asking and then given to the LORD.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb in 'asked' is masculine singular, but the context points to Hannah as the one who asked for the child (see 1 Samuel 1:20, 27–28).
    reason: alternative_reading
translation:
  language: ko
  text: 엘리는 엘가나와 그의 아내에게 복을 빌며 이렇게 말하곤 했습니다. “야훼께서 이 여인에게서 당신에게 자손을, 야훼께 구한 그 청원[a][b] 대신으로 주시기를 바랍니다.” 그러고 나서 그들은 엘가나의 거처로 돌아갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘요청/청원’에 해당하는 표현을 사용하며, 사무엘 출생 서사 전체에서 반복되는 ‘구하다’라는 어근의 말놀이를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 문법적으로 남성 단수이지만, 문맥상 청원한 이는 한나로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֵרַךְ
  english_pob_choice: would bless
  chosen_korean: 축복하며
  alternatives_korean:
  - 복을 빌며
  - 축복하고
  lexicon: HALOT
  rationale: 서술적 반복 동작을 한국어에서 자연스럽게 나타내기 위해 현재분사형으로 처리하되, ‘복을 빌다’보다 축복 행위의 주체성과 공적 느낌을 살렸습니다.
- source_word: אֶת אֶלְקָנָה וְאֶת אִשְׁתּוֹ
  english_pob_choice: Elkanah and his wife
  chosen_korean: 엘가나와 그의 아내
  alternatives_korean:
  - 엘가나와 한나
  - 엘가나와 그의 아내 한나
  lexicon: HALOT
  rationale: 히브리어가 개인 이름이 아니라 ‘그의 아내’라고 말하므로, 이름을 덧붙이지 않고 관계표현을 유지했습니다.
- source_word: יָשֵׂם יְהוָה לְךָ זֶרַע
  english_pob_choice: May Yahweh give you offspring
  chosen_korean: 야훼께서 … 당신에게 자손을 주시기를 바랍니다
  alternatives_korean:
  - 야훼께서 … 당신에게 후손을 두시기를 바랍니다
  - 야훼께서 … 당신에게 씨를 주시기를 바랍니다
  lexicon: HALOT
  rationale: 축복문맥에서 שׂים의 ‘두다/배정하다’보다 결과적으로 자손을 ‘주시다’는 뜻이 자연스럽고, זֶרַע는 문맥상 ‘자손’이 가장 분명합니다.
- source_word: מִן הָאִשָּׁה הַזֹּאת תַּחַת הַשְּׁאֵלָה
  english_pob_choice: by this woman in place of the petition
  chosen_korean: 이 여인으로 말미암아, … 청원에 대신하여
  alternatives_korean:
  - 이 여인에게서, … 간구에 대신하여
  - 이 여인으로부터, … 요구에 대신하여
  lexicon: HALOT
  rationale: מִן과 תַּחַת의 관계를 한국어에서 각각 ‘말미암아’와 ‘대신하여’로 살려, 출처와 교환의 뉘앙스를 함께 유지했습니다.
- source_word: אֲשֶׁר שָׁאַל לַיהוָה
  english_pob_choice: that was asked for Yahweh / she asked from the LORD
  chosen_korean: 야훼께 구한
  alternatives_korean:
  - 야훼께서 구한
  - 야훼께 구해 달라고 한
  lexicon: HALOT
  rationale: 본문의 어근 שאל의 반복적 말놀이를 살리기 위해 ‘구하다’로 옮겼고, 문맥상 한나의 요청을 가리키는 점을 반영했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 신명기를 직접 음역한 ‘야훼’를 사용해 하나님의 고유명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אֲשֶׁר שָׁאַל의 지시대상
  chosen_reading: 한나가 구한 것으로 이해
  alternative_readings:
  - 엘가나가 구한 것으로 이해
  - ‘야훼께 구해진 청원’으로 중립 처리
  rationale: 동사 형태는 남성 단수이나 앞뒤 서사와 1장 전체 문맥이 한나의 간구를 가리키므로, 의미를 독자에게 분명히 전달하는 쪽을 택했습니다.
  doctrine_reference: Narrative-context decision; no doctrinal implication
