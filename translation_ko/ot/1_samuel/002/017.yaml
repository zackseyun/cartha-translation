  - 주
  rationale: 본문이 야훼의 이름을 직접 사용하므로, 신학적·번역학적 일관성에 따라 호칭 대체어가 아닌 고유명사 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
