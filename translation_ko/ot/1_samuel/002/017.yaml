id: 1SA.2.17
reference: 1 Samuel 2:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תְּהִ֨י חַטַּ֧את הַ/נְּעָרִ֛ים גְּדוֹלָ֥ה מְאֹ֖ד אֶת פְּנֵ֣י יְהוָ֑ה כִּ֤י נִֽאֲצוּ֙ הָֽ/אֲנָשִׁ֔ים אֵ֖ת מִנְחַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/017.yaml
  text: So the sin of the young men was very great before Yahweh[c][b][a], because the men despised Yahweh’s offering.
  footnotes:
  - marker: a
    text: Or 'despised the LORD’s offering.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'before the face of the LORD,' an idiom meaning 'before the LORD' or 'in the LORD’s presence.'
    reason: lexical_alternative
  - marker: c
    text: '''Offering'' translates Hebrew minḥah, which can refer broadly to an offering and in some contexts more specifically to a grain offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 소년들의 죄가 야훼 앞에서 매우 컸습니다. 이는 그 사람들이 야훼의 제물을 멸시하였기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제물’은 히브리어 민하흐(minḥah)를 넓게 옮긴 말로, 문맥에 따라 곡식 제물을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼 앞에서’는 히브리어의 ‘야훼의 얼굴 앞’이라는 관용구로, ‘야훼의 면전에서’라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘멸시하였기’는 히브리어 동사 נִאֲצוּ의 직접적인 뜻을 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  english_pob_choice: sin
  chosen_korean: 죄
  alternatives_korean:
  - 잘못
  - 죄악
  lexicon: HALOT
  rationale: 이 문맥에서는 제사 규정상의 죄가 아니라 엘리의 아들들이 저지른 범죄를 가리키므로, 가장 직접적인 대응인 ‘죄’가 자연스럽습니다.
- source_word: הַנְּעָרִים
  english_pob_choice: the young men
  chosen_korean: 그 소년들
  alternatives_korean:
  - 그 젊은이들
  - 그 하인들
  lexicon: HALOT
  rationale: 나아르는 연령과 지위가 넓은 말이지만, 여기서는 성인 남성인 제사장 아들들을 가리키므로 지나치게 유년적으로 들리지 않으면서도 원어의 기본감을 살리는 표현을 택했습니다.
- source_word: אֶת פְּנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 앞에서
  - 야훼 면전에서
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴 앞’이라는 관용구를 한국어의 자연스러운 ‘앞에서’로 옮겨, 단순한 위치가 아니라 하나님 앞에서의 공적인 상태를 드러냈습니다.
- source_word: נִאֲצוּ
  english_pob_choice: despised
  chosen_korean: 멸시하였기
  alternatives_korean:
  - 경멸하였기
  - 업신여겼기
  lexicon: HALOT
  rationale: 동사는 단순 무시보다 강한 경멸·모욕의 뉘앙스를 가지므로, POB의 ‘despised’를 따라 ‘멸시하다’를 사용했습니다.
- source_word: מִנְחַת יְהוָה
  english_pob_choice: Yahweh’s offering
  chosen_korean: 야훼의 제물
  alternatives_korean:
  - 야훼의 예물
  - 야훼의 바침
  lexicon: HALOT
  rationale: 민하흐는 문맥상 일반적인 제물/예물을 가리키며, 여기서는 제사장 몫을 포함한 제의적 맥락이므로 ‘제물’이 가장 포괄적이고 자연스럽습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 야훼의 이름을 직접 사용하므로, 신학적·번역학적 일관성에 따라 호칭 대체어가 아닌 고유명사 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
