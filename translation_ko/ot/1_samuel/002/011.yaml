  text: וַ/יֵּ֧לֶךְ אֶלְקָנָ֛ה הָ/רָמָ֖תָ/ה עַל בֵּית֑/וֹ וְ/הַ/נַּ֗עַר הָיָ֤ה מְשָׁרֵת֙ אֶת יְהוָ֔ה אֶת פְּנֵ֖י עֵלִ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/011.yaml
  text: Then Elkanah went to Ramah[a], to his house; and the boy was ministering to Yahweh before Eli the priest.
  footnotes:
  - marker: a
    text: Or "before Eli the priest"; the Hebrew literally says "at/in the presence of Eli the priest."
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 엘가나는 라마로 자기 집에 갔고, 그 소년은 제사장 엘리 앞에서 야훼를 섬기고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제사장 엘리 앞에서”; 히브리어는 문자적으로 “제사장 엘리의 얼굴/임재 앞에서”라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... הָרָמָתָה עַל בֵּיתוֹ
  english_pob_choice: went to Ramah, to his house
  chosen_korean: 라마로 자기 집에 갔고
  alternatives_korean:
  - 라마로 돌아갔고
  - 라마로 자기 집으로 갔고
  lexicon: HALOT
  rationale: הלך의 서술 진행을 살려 ‘갔고’로 옮기고, עַל בֵּיתוֹ는 한국어에서 자연스러운 귀착 표현인 ‘자기 집에’로 옮겼습니다.
- source_word: וְהַנַּעַר
  english_pob_choice: the boy
  chosen_korean: 그 소년은
  alternatives_korean:
  - 그 아이는
  - 그 젊은이는
  lexicon: HALOT
  rationale: נַעַר는 문맥상 아직 성전에서 섬기는 어린 소년을 가리키므로 ‘소년’이 가장 자연스럽고 구체적입니다.
- source_word: הָיָה מְשָׁרֵת
  english_pob_choice: was ministering
  chosen_korean: 섬기고 있었습니다
  alternatives_korean:
  - 섬기고 있었습니다
  - 봉사하고 있었습니다
  - 섬겼습니다
  lexicon: HALOT
  rationale: היה + 분사는 지속적 행위를 나타내므로 진행형 뉘앙스를 살린 ‘섬기고 있었습니다’가 적절합니다.
- source_word: אֶת יְהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼를
  alternatives_korean:
  - 야훼께
  - 주님을
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 하나님의 이름 יְהוָה는 본문 원형을 보존하기 위해 ‘야훼’로 옮기며, שׁרת의 목적어로서 조사 ‘를’을 붙였습니다.
- source_word: אֶת פְּנֵי עֵלִי הַכֹּהֵן
  english_pob_choice: before Eli the priest
  chosen_korean: 제사장 엘리 앞에서
  alternatives_korean:
  - 제사장 엘리의 앞에서
  - 제사장 엘리의 면전에서
  lexicon: HALOT
  rationale: ‘얼굴/앞, 임재’의 관용구를 한국어의 관계·공간 표현인 ‘앞에서’로 옮겨, Eli의 감독 아래 이루어지는 섬김이라는 문맥을 과잉 해석 없이 드러냅니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 여호와 표기가 아니라 고유한 언약명 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
