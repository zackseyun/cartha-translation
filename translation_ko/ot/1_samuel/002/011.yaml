translation:
  language: ko
  text: 그 후 엘가나는 라마에 있는 자기 집으로 갔습니다. 그 소년은 제사장 엘리 앞에서[a] 야훼를 섬기고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “제사장 엘리의 얼굴 앞에서”라고 합니다. 이는 제사장 엘리 앞에서, 또는 그가 있는 자리에서라는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
