id: 1SA.2.7
reference: 1 Samuel 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֖ה מוֹרִ֣ישׁ וּ/מַעֲשִׁ֑יר מַשְׁפִּ֖יל אַף מְרוֹמֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/007.yaml
  text: Yahweh makes poor and makes rich[b][a]; he brings low and also lifts up.
  footnotes:
  - marker: a
    text: Or 'The LORD impoverishes'; the Hebrew verb can also carry the broader idea of causing loss or dispossession.
    reason: lexical_alternative
  - marker: b
    text: Or 'exalts' or 'raises up.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 가난하게도 하시고 부하게도 하시며, 낮추기도 하시고 또한 높이기도 하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가난하게 만드신다’. 히브리어 동사는 재산을 잃게 하거나 빼앗는 폭넓은 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘높이신다’ 또는 ‘들어 올리신다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 히브리어 본문의 신명사 יְהוָה를 음역해 고유한 언약명을 드러냈습니다. 전통적 대체어인 ‘주’보다 본문 직접성을 살리고, 영어 POB의 ‘Yahweh’ 선택과도 맞춥니다.
- source_word: מוֹרִישׁ
  english_pob_choice: makes poor
  chosen_korean: 가난하게도 하시고
  alternatives_korean:
  - 빈곤하게도 하시고
  - 가난하게도 만드시고
  - 재산을 잃게도 하시고
  lexicon: HALOT
  rationale: 문맥상 ‘부하게 하다’와 대구를 이루는 경제적 반대 의미로 풀어, 현대 한국어에서 자연스러운 ‘가난하게 하다’를 택했습니다. 영어 POB의 폭넓은 주석 가능성은 유지하되 본문은 균형 있는 대구를 살렸습니다.
- source_word: מַשְׁפִּיל
  english_pob_choice: he brings low
  chosen_korean: 낮추기도 하시고
  alternatives_korean:
  - 겸손하게도 하시고
  - 낮게도 하시고
  - 비천하게도 하시고
  lexicon: HALOT
  rationale: ‘he brings low’의 수직적 이미지를 살려 ‘낮추다’로 옮겼습니다. ‘겸손하게 하다’보다 상태의 하강을 더 직접적으로 드러냅니다.
- source_word: מְרוֹמֵם
  english_pob_choice: lifts up
  chosen_korean: 높이기도 하십니다
  alternatives_korean:
  - 들어 올리기도 하십니다
  - 끌어올리기도 하십니다
  - 높여 주시기도 하십니다
  lexicon: HALOT
  rationale: ‘lifts up’의 상승 이미지를 한국어에서 가장 간결하게 살릴 수 있는 ‘높이다’를 사용했습니다. 앞의 ‘낮추다’와 짝을 이루어 대구를 유지합니다.
theological_decisions:
- issue: 야훼 신명사의 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겨 고유한 이름을 보존했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 하나님의 주권적 행위를 고유한 언약 이름으로 서술하므로, 직함 ‘주’로 대체하지 않고 이름 자체를 드러내는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
