  naturalness: 합쇼체는 일관되지만, ‘너무 교만하게 말하지 말고’보다 ‘그토록 교만한 말을 계속하지 마십시오’가 히브리어의 반복적·강조적 표현을 더 자연스럽고 분명하게 전달합니다. ‘달아 보십니다’는 띄어쓰기를 적용했습니다.
  terminology: ‘야훼’ 및 ‘지식의 하나님’은 프로젝트의 신명 방침과 원문의 표현을 충실히 따릅니다. עֲלִלוֹת에는 원문에 없는 ‘사람의’를 덧붙이지 않고 ‘행위들’로 옮기는 것이 더 직접적입니다.
