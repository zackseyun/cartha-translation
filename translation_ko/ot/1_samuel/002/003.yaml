id: 1SA.2.3
reference: 1 Samuel 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תַּרְבּ֤וּ תְדַבְּרוּ֙ גְּבֹהָ֣ה גְבֹהָ֔ה יֵצֵ֥א עָתָ֖ק מִ/פִּי/כֶ֑ם כִּ֣י אֵ֤ל דֵּעוֹת֙ יְהוָ֔ה ו/לא נִתְכְּנ֖וּ עֲלִלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/003.yaml
  text: Do not keep speaking so very proudly; do not let arrogance come out of your mouth[a], for Yahweh is a God of knowledge, and by him actions are weighed.
  footnotes:
  - marker: a
    text: Or, following the consonantal text more strictly, 'and actions are not weighed.' The main text follows the traditional reading that the LORD evaluates human deeds.
    reason: textual_variant
translation:
  language: ko
  text: 너희는 그토록 교만한 말을 계속하지 마십시오. 오만한 말이 너희 입에서 나오지 않게 하십시오. 야훼는 지식의 하나님이시며, 그분께서는 행위들을 달아 보십니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 자음 본문을 더 엄밀히 따르면, ‘행위들은 평가되지 않습니다’라고 할 수 있습니다. 본문은 야훼께서 인간의 행위를 평가하신다는 전통적 읽기를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּרְבּוּ תְדַבְּרוּ
  english_pob_choice: Do not keep speaking
  chosen_korean: 너무 ... 말하지 말고
  alternatives_korean:
  - 계속 말하지 말고
  - 말을 그치지 말고
  lexicon: HALOT
  rationale: רבה+동사 구조의 반복·강조를 한국어에서는 ‘너무’와 부정 명령으로 자연스럽게 살려, 단순 금지보다 ‘계속해서/지나치게’ 말하는 태도를 억제하는 뉘앙스를 담았습니다.
- source_word: גְּבֹהָה גְבֹהָה
  english_pob_choice: so very proudly
  chosen_korean: 교만하게
  alternatives_korean:
  - 매우 높게
  - 몹시 거만하게
  - 유난히 거만하게
  lexicon: HALOT
  rationale: 겹친 형용사는 높아진 태도와 거만함을 강조하므로, 현대 한국어에서 의미가 가장 분명한 ‘교만하게’로 옮겼습니다.
- source_word: עָתָק מִפִּי/כֶם
  english_pob_choice: do not let arrogance come out of your mouth
  chosen_korean: 너희 입에서 오만한 말이 나오지 못하게 하십시오
  alternatives_korean:
  - 너희 입에서 거만한 말이 나오지 못하게 하십시오
  - 너희 입에서 불손한 말이 나오지 못하게 하십시오
  lexicon: HALOT
  rationale: עָתָק은 오만·무례·불손의 뉘앙스를 가지므로, 문맥의 ‘교만한 말’과 연결되는 ‘오만한 말’로 옮겨 입에서 나오는 말을 직접적으로 표현했습니다.
- source_word: אֵל דֵּעוֹת יְהוָה
  english_pob_choice: the LORD is a God of knowledge
  chosen_korean: 야훼는 지식의 하나님이시며
  alternatives_korean:
  - 야훼는 지식의 하나님이십니다
  - 야훼는 모든 지식을 가지신 하나님이시며
  lexicon: HALOT
  rationale: דֵּעוֹת의 복수형은 풍성함·충만함을 드러내지만 한국어에서는 관용적으로 ‘지식의 하나님’이 가장 자연스럽고, 주어는 야훼로 옮겼습니다.
- source_word: וְלֹא נִתְכְּנוּ עֲלִלֹוֹת
  english_pob_choice: and by him actions are weighed
  chosen_korean: 사람의 행동을 달아보십니다
  alternatives_korean:
  - 사람의 행동은 달아보이지 않습니다
  - 행동들은 그분에 의해 평가됩니다
  lexicon: HALOT
  rationale: 본문의 문자적 난점과 POB의 전통적 읽기를 반영해, 하나님이 인간의 행위를 저울질·평가하신다는 메타포를 한국어의 ‘달아보십니다’로 살렸습니다.
theological_decisions:
- issue: 여호와/야훼로 표기되는 신명
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 고유한 언약명인 ‘야훼’를 본문에 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: וְלֹא נִתְכְּנוּ עֲלִלֹות의 해석
  chosen_reading: 사람의 행동을 달아보십니다
  alternative_readings:
  - 사람의 행동은 달아보이지 않습니다
  - 사람의 행동을 재지 않으십니다
  rationale: 자음본문만 따르면 부정문으로 읽힐 수 있지만, 문맥과 전통적 독해는 야훼께서 인간의 행위를 판별·평가하신다는 뜻을 강하게 지지하므로, 본문에는 이를 살리고 대안은 각주로 남겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
