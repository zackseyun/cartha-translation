source:
  edition: WLC
  text: אַ֖ל בָּנָ֑/י כִּ֠י לֽוֹא טוֹבָ֤ה הַ/שְּׁמֻעָה֙ אֲשֶׁ֣ר אָנֹכִ֣י שֹׁמֵ֔עַ מַעֲבִרִ֖ים עַם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/024.yaml
  text: No[a], my sons; for the report that I hear is not good. You are making Yahweh’s people transgress.
  footnotes:
  - marker: a
    text: Or, following another understanding of the Hebrew, 'the report that I hear the LORD’s people spreading.'
    reason: alternative_reading
translation:
  language: ko
  text: 아니요, 내 아들들아. 내가 듣는 그 소문은 좋지 않습니다. 너희는 야훼의 백성을 죄짓게 하고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또 다른 이해에 따르면, ‘내가 듣는, 야훼의 백성이 퍼뜨리는 그 소문은 좋지 않습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל
  english_pob_choice: 'No'
  chosen_korean: 아니요
  alternatives_korean:
  - 하지 마라
  - 그만
  - 아니
  lexicon: HALOT
  rationale: 직접적인 금지라기보다 엘리가 아들들을 엄하게 꾸짖는 감탄형 부정이므로, 현대 한국어에서 자연스러운 강한 거절 표현으로 옮겼습니다.
- source_word: בָּנַי
  english_pob_choice: my sons
  chosen_korean: 내 아들들아
  alternatives_korean:
  - 내 자녀들아
  - 내 아들아
  lexicon: HALOT
  rationale: 호격이며 남성 복수입니다. ‘아들들아’가 원문의 성별과 직접 부름을 가장 분명히 드러냅니다.
- source_word: הַשְּׁמֻעָה
  english_pob_choice: the report
  chosen_korean: 그 소문
  alternatives_korean:
  - 그 보고
  - 그 이야기
  - 그 소식
  lexicon: HALOT
  rationale: 여기서는 엘리가 듣는 부정적 유포 내용을 가리키므로, 맥락상 ‘소문’이 가장 자연스럽습니다.
- source_word: מַעֲבִרִים עַם יְהוָה
  english_pob_choice: You are making Yahweh’s people transgress
  chosen_korean: 야훼의 백성을 죄짓게 하고 있습니다
  alternatives_korean:
  - 야훼의 백성을 넘어가게 하고 있습니다
  - 야훼의 백성을 범죄하게 하고 있습니다
  - 야훼의 백성을 죄로 이끌고 있습니다
  lexicon: HALOT
  rationale: 히필형 עבר는 문맥상 ‘죄를 짓게 하다/넘어가게 하다’의 의미로 읽히며, 한국어에서는 ‘죄짓게 하다’가 가장 직접적이고 자연스럽습니다.
theological_decisions:
- issue: מַעֲבִרִים עַם יְהוָה의 해석
  chosen_reading: 너희는 야훼의 백성을 죄짓게 하고 있습니다
  alternative_readings:
  - 야훼의 백성이 소문을 퍼뜨리고 있습니다
  - 야훼의 백성을 넘어가게 하고 있습니다
  rationale: 본문의 직접적인 꾸짖음 흐름에 따라, 사무엘상 2:24는 아들들의 행위가 백성으로 하여금 죄에 이르게 한다는 뜻으로 읽는 것이 가장 타당합니다. 대안적 이해는 각주로 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 언약적 신명 자체를 보존하기 위해 ‘야훼’를 사용했습니다. 제목 대체인 ‘주’는 원문 고유명사를 희석합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
