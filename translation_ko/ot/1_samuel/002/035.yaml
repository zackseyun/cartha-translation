review_pass:
  verdict: revise
  source_fidelity: 히브리어의 기본 구조와 의미는 대체로 반영되었으나, 두 각주의 표지가 본문에서 모두 절 끝에 붙어 있어 각각의 대상어(‘제사장’, ‘집’)에 연결되지 않습니다. 또한 בְנַפְשִׁי는 여기서 ‘내 영 안에’보다 하나님의 의지·뜻을 나타내는 자연스러운 한국어로 옮기는 것이 적절합니다.
  naturalness: ‘제사장 하나’, ‘내 영 안에 있는 대로’, ‘모든 날을 걸어갈 것입니다’는 현대 표준 한국어 성경 문체로 다소 부자연스럽습니다. ‘한 신실한 제사장’, ‘내 마음과 내 뜻에 따라’, ‘언제나 … 앞에서 행할 것입니다’가 자연스럽고 원문의 범위를 유지합니다.
  terminology: ‘신실한 제사장’과 ‘나의 기름부음 받은 자’는 적절합니다. בַּיִת נֶאֱמָן은 건물이 아니라 지속되는 가문·계보의 비유이므로, 본문에서는 자연스러운 ‘든든한 집안’으로 옮기고 직역 가능성은 각주로 보완합니다.
  issues:
  - severity: medium
    issue: 각주 a와 b의 표지가 모두 절 끝에 배치되어 있음
    rationale: a는 ‘신실한 제사장’에, b는 ‘집’에 관한 각주입니다. 현재 표지는 두 각주의 선행어를 식별할 수 없게 하며, a의 내용은 특히 ‘제사장’ 뒤에 표기될 경우 내용상 모순됩니다.
  - severity: medium
    issue: ‘내 영 안에 있는 대로’
    rationale: בְּנַפְשִׁי는 בִּלְבָבִי와 병행하여 하나님의 내적 의지와 소망을 강조합니다. 한국어 ‘내 영 안에’는 위치적 표현으로 어색하고, 신적 영 또는 인간 영혼이라는 불필요한 의미를 암시할 수 있습니다.
  - severity: low
    issue: ‘모든 날을 걸어갈 것입니다’
    rationale: הִתְהַלֵּךְ의 ‘걷다’ 비유를 살리려는 의도는 타당하지만, 이 문맥의 지속적 봉사·처신을 한국어로 표현하기에는 부자연스럽습니다.
  revised_text: 내가 나를 위하여 한 신실한 제사장[a]을 일으키겠습니다. 그는 내 마음과 내 뜻에 따라 행할 것입니다. 내가 그를 위하여 든든한 집안[b]을 세워 주겠습니다. 그는 나의 기름부음 받은 자 앞에서 언제나 행할 것입니다.
  revised_footnotes:
  - marker: a
    text: ‘신실한’은 ‘충실한’, ‘믿을 만한’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘신실한 집’. 여기서 ‘집’은 오래 지속되는 가문이나 계보를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘나의 기름부음 받은 자’는 ‘나의 메시아’로도, 문맥상 ‘나의 왕’으로도 옮길 수 있습니다.
    reason: alternative_reading
  revision_rationale: 각주 표지를 해당 선행어 바로 뒤에 배치하여 구조적 오류를 해결했습니다. 기존 a 각주는 원문의 ‘신실한 제사장’이 아니라 ‘신실한 집’에 관한 설명이었으므로 b 위치의 각주로 대체했습니다. ‘마음과 뜻’은 히브리어의 ‘마음과 네페쉬’가 병행하여 나타내는 의지를 현대 한국어로 자연스럽게 재현합니다. ‘든든한 집안’은 בַּיִת נֶאֱמָן의 왕조·가문 비유를 자연스럽게 전달하며, ‘신실한 집’이라는 직역은 각주에 보존했습니다. ‘기름부음 받은 자’에 관한 대안은 본문에 표지가 없더라도 독립 각주 c로 보존하되, 필요한 경우 편집 체계에 따라 해당 어구 뒤에 표기할 수 있습니다.
