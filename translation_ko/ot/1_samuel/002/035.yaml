source:
  edition: WLC
  text: וַ/הֲקִימֹתִ֥י לִ/י֙ כֹּהֵ֣ן נֶאֱמָ֔ן כַּ/אֲשֶׁ֛ר בִּ/לְבָבִ֥/י וּ/בְ/נַפְשִׁ֖/י יַעֲשֶׂ֑ה וּ/בָנִ֤יתִי ל/וֹ֙ בַּ֣יִת נֶאֱמָ֔ן וְ/הִתְהַלֵּ֥ךְ לִ/פְנֵֽי מְשִׁיחִ֖/י כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/035.yaml
  text: And I will raise up for myself a faithful priest[a], who will do according to what is in my heart and in my soul. And I will build for him a faithful house[b], and he will walk before my anointed all the days.
  footnotes:
  - marker: a
    text: Or 'an enduring house'—that is, a lasting household or line.
    reason: lexical_alternative
  - marker: b
    text: '''My anointed one'' could also be rendered ''my Messiah'' or, in context, ''my king.'''
    reason: alternative_reading
translation:
  language: ko
  text: 내가 나를 위해 신실한 제사장 하나를 일으키겠습니다. 그는 내 마음과 내 영 안에 있는 대로 행할 것입니다. 내가 그를 위해 신실한 집을 세우겠습니다. 그리고 그는 나의 기름부음 받은 자 앞에서 모든 날을 걸어갈 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지속되는 집’, 곧 오래 지속되는 가문이나 계열로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나의 메시아’ 혹은 문맥상 ‘나의 왕’으로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲקִימֹתִי
  english_pob_choice: I will raise up
  chosen_korean: 일으키겠습니다
  alternatives_korean:
  - 세우겠습니다
  - 임명하겠습니다
  lexicon: HALOT
  rationale: 하나님이 사람을 직분에 들어서게 하시는 동작을 살리면서도, 단순한 행정적 ‘임명’보다 소명과 부각의 뉘앙스를 보존합니다.
- source_word: לִי
  english_pob_choice: for myself
  chosen_korean: 나를 위해
  alternatives_korean:
  - 나를 위하여
  - 나를 위한
  lexicon: HALOT
  rationale: 하나님의 주도성과 소유성을 자연스러운 한국어로 드러내기 위해 ‘나를 위해’로 옮겼습니다.
- source_word: נֶאֱמָן
  english_pob_choice: faithful
  chosen_korean: 신실한
  alternatives_korean:
  - 충실한
  - 믿을 만한
  lexicon: HALOT
  rationale: 언약적 충성과 직분적 신뢰성을 함께 담기 위해 ‘신실한’을 선택했습니다.
- source_word: מְשִׁיחִי
  english_pob_choice: my anointed
  chosen_korean: 나의 기름부음 받은 자
  alternatives_korean:
  - 내 메시아
  - 내 기름부음 받은 이
  - 내 왕
  lexicon: HALOT
  rationale: 이 절의 역사적 문맥에서 משיח의 기본 뜻을 살리되, 후대의 고정된 호칭으로 좁히지 않기 위해 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: ‘기름부음 받은 자’의 지시 대상
  chosen_reading: 주님의 기름부음 받은 자를 본문 그대로 ‘나의 기름부음 받은 자’로 유지했습니다.
  alternative_readings:
  - 내 메시아
  - 내 왕
  rationale: 문맥상 우선은 이스라엘의 역사적 지도자를 가리키므로, 메시아적 해석 가능성은 남기되 본문에는 강요하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve theological tension rather than resolving it prematurely.'
