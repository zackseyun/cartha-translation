translation:
  language: ko
  text: 그 소년 사무엘은 계속 자라며, 야훼와 사람들 모두에게 호의를 얻었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 הֹלֵךְ וְגָדֵל은 ‘계속 자라다’라는 진행적 관용구입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 ‘야훼와 함께, 또 사람들과 함께’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/נַּעַר
  english_pob_choice: Now the boy
  chosen_korean: 그 소년
  alternatives_korean:
  - 소년
  - 그 아이
  lexicon: HALOT
  rationale: נַעַר는 여기서 성소에서 섬기는 어린 나이를 가리키므로, 현대 한국어에서는 자연스럽고 문맥에 맞는 ‘소년’이 가장 적절합니다. 관사적 תחילית는 앞선 서술과 이어지는 지시로 ‘그’로 처리했습니다.
- source_word: הֹלֵךְ וְ/גָדֵל
  english_pob_choice: continued to grow
  chosen_korean: 계속 자라며
  alternatives_korean:
  - 자라며 계속
  - 자라 가며
  lexicon: HALOT
  rationale: הלך + גדל의 진행상·지속상 관용구를 한국어에서는 ‘계속 자라며’로 옮겨, 단순 성장보다 ‘계속해서 자라는’ 진행을 드러냈습니다.
- source_word: וָ/ט֑וֹב
  english_pob_choice: he was good in the sight of
  chosen_korean: 좋은 사람이었습니다
  alternatives_korean:
  - 호감을 얻었습니다
  - 마음에 들었습니다
  lexicon: HALOT
  rationale: טוֹב는 여기서 단순한 도덕평가라기보다 관계적 평가를 포함하므로, 한국어에서는 ‘좋은 사람이었습니다’로 풀어 두 대상 모두에게 긍정적 평가를 받는 뜻을 자연스럽게 살렸습니다.
- source_word: גַּ֚ם עִם יְהוָה וְ/גַ֖ם עִם אֲנָשִֽׁים
  english_pob_choice: both Yahweh and men
  chosen_korean: 야훼와 사람들 모두에게
  alternatives_korean:
  - 야훼와 사람들 사이에서
  - 야훼와 사람들 앞에서
  lexicon: HALOT
  rationale: גם ... וגם의 평행 구조를 ‘... 모두에게’로 압축해, 야훼와 인간 모두의 평가라는 이중 관계를 간결하게 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: POB doctrine glossary
  rationale: 본문의 신명사 יְהוָה는 프로젝트 기본어휘에 따라 ‘야훼’로 옮겨, 고유한 언약 이름을 보존했습니다.
theological_decisions:
- issue: 야훼와 사람들 모두에게 ‘좋다’는 관계적 평행구를 어떻게 한국어로 살릴지
  chosen_reading: ‘좋은 사람이었습니다’로 옮겨, 야훼와 인간 모두의 평가에서 긍정적임을 함께 드러냈습니다.
  alternative_readings:
  - ‘야훼와 사람들 모두에게 좋은 평가를 받았습니다’
  - ‘야훼와 사람들 앞에서 호감을 얻었습니다’
  rationale: 히브리어의 עִם + טוֹב는 단순 호감 이상의 관계적 승인과 평가를 시사합니다. 한국어에서 과도한 해설 없이도 두 범주의 평가를 함께 담기 위해 간결한 서술형으로 처리했습니다.
  doctrine_reference: 'POB translation principle: source-direct relational meaning; handling of relational approval idioms'
