  rationale: 직역하면 ‘너희의 악한 말/일들’이지만 문맥상 엘리가 아들들의 악행에 대한 보고를 듣는 상황이므로 ‘악한 행위’가 가장 분명합니다.
theological_decisions:
- issue: 직설적 책망의 화법
  chosen_reading: 엘리의 책망을 평서문과 직접화법으로 그대로 살려, 완곡하게 누그러뜨리지 않았습니다.
  alternative_readings:
  - 왜 그런 짓을 하느냐?
  - 어찌하여 그런 일을 하느냐?
  rationale: 본문은 아들들의 지속적 악행에 대한 공개적 경고이므로, 수위를 낮추지 않고 반문 형식의 책망을 유지하는 것이 적절합니다.
  doctrine_reference: 목회적 권면의 직접성; 본문 서사 문맥 보존
