translation:
  language: ko
  text: 그가 그들에게 말했습니다. “왜 너희는 이런 일을 합니까? 나는 이 모든 백성에게서 너희의 악한 행위에 관한 말을 듣고 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘나는 이 모든 백성에게서 너희의 악한 말들/일들을 듣는다’에 가깝습니다. 문맥상 엘리가 아들들의 악행에 관한 보고를 듣는다는 뜻입니다.
    reason: lexical_alternative
