- source_word: אֶת דִּבְרֵיכֶם רָעִים מֵאֵת כָּל הָעָם אֵלֶּה
  english_pob_choice: about your evil deeds from all these people
  chosen_korean: 이 모든 백성에게서 너희의 악한 행위를
  alternatives_korean:
  - 이 모든 백성에게서 너희의 악한 말들을
