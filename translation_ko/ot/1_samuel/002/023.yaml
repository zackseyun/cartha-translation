  text: And he said to them[a], “Why do you do such things? For I hear from all these people about your evil deeds.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'I hear your evil matters/words from all these people.' The sense in context is that Eli is hearing reports of his sons' wicked conduct.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다. "왜 너희는 이런 일을 하느냐? 나는 이 모든 백성에게서 너희의 악한 행위를 듣고 있습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너희의 악한 말/일들을 이 모든 백성에게서 듣는다’에 가깝지만, 문맥상 엘리가 아들들의 악행에 대한 보고를 듣는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  english_pob_choice: And he said to them
  chosen_korean: 그가 그들에게 말했습니다
  alternatives_korean:
