  text: וַֽ/יְהִי֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם וַ/יִּקְבְּצ֨וּ פְלִשְׁתִּ֤ים אֶת מַֽחֲנֵי/הֶם֙ לַ/צָּבָ֔א לְ/הִלָּחֵ֖ם בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֤אמֶר אָכִישׁ֙ אֶל דָּוִ֔ד יָדֹ֣עַ תֵּדַ֗ע כִּ֤י אִתִּ/י֙ תֵּצֵ֣א בַֽ/מַּחֲנֶ֔ה אַתָּ֖ה וַ/אֲנָשֶֽׁי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/001.yaml
  text: Now in those days the Philistines gathered their camps for war[a], to fight against Israel. And Achish said to David, “You surely know that you and your men must go out with me in the camp.”
  footnotes:
  - marker: a
    text: Or “with me in the camp.” The Hebrew word can mean either the encampment itself or, by extension, the military force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 무렵 블레셋 사람들이 이스라엘과 싸우려고 자기들의 군영들을 모아 전쟁을 준비했습니다. 아기스가 다윗에게 말했습니다. “그대와 그대의 부하들이 나와 함께 진영에[a] 나갈 것임을 반드시 알아 두십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진영’은 물리적인 군영을 뜻할 수도 있고, 여기서는 그 군영에 속한 군사 부대 또는 군대를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  english_pob_choice: Now in those days
  chosen_korean: 그 무렵에
  alternatives_korean:
  - 그때에
  - 그 시절에
  lexicon: HALOT
  rationale: 서사 전환 공식의 시간감과 장면 도입 기능을 살리면서, 한국어로는 자연스러운 연결 표현인 ‘그 무렵에’로 옮겼습니다.
- source_word: וַיִּקְבְּצוּ פְלִשְׁתִּים אֶת מַחֲנֵיהֶם
  english_pob_choice: the Philistines gathered their camps
  chosen_korean: 블레셋 사람들이 … 자기 진영들을 모았습니다
  alternatives_korean:
  - 자기 군대를 모았습니다
  - 자기 진영을 모았습니다
  lexicon: HALOT
  rationale: מַחֲנֶה의 기본 의미인 ‘진영/캠프’를 유지하되, 군사적 집합을 한국어로 자연스럽게 드러내기 위해 ‘진영들을 모았습니다’로 표현했습니다.
- source_word: לַצָּבָא לְהִלָּחֵם בְּיִשְׂרָאֵל
  english_pob_choice: for war, to fight against Israel
  chosen_korean: 이스라엘과 싸우려고 전쟁을 위해
  alternatives_korean:
  - 전쟁을 하려고
  - 이스라엘과 전쟁하려고
  lexicon: HALOT
  rationale: 전쟁 목적과 대적 방향을 모두 드러내기 위해 ‘전쟁을 위해’와 ‘이스라엘과 싸우려고’를 함께 살렸습니다.
- source_word: יָדֹעַ תֵּדַע
  english_pob_choice: You surely know
  chosen_korean: 분명히 알고 있습니다
  alternatives_korean:
  - 틀림없이 알고 있습니다
  - 정말 알고 있습니다
  lexicon: HALOT
  rationale: 반복형으로 된 강조를 한국어의 확언 표현 ‘분명히’로 옮겨, 아기스의 확신 어린 어조를 살렸습니다.
- source_word: אִתִּי תֵּצֵא בַּמַּחֲנֶה
  english_pob_choice: must go out with me in the camp
  chosen_korean: 나와 함께 진영으로 나가게 될
  alternatives_korean:
  - 나와 함께 진영에서 나가게 될
  - 나와 함께 진영 안으로 나가게 될
  lexicon: HALOT
  rationale: בַּמַּחֲנֶה를 POB의 ‘in the camp’에 맞춰 ‘진영으로’로 옮겼고, 여기서의 עתיד형은 단순 미래보다 예정/기대의 뉘앙스가 있어 ‘나가게 될’로 처리했습니다.
- source_word: וַאֲנָשֶׁיךָ
  english_pob_choice: you and your men
  chosen_korean: 당신과 당신의 부하들
  alternatives_korean:
  - 당신과 당신의 사람들
  - 당신과 당신의 남자들
  lexicon: HALOT
  rationale: 군사적 문맥에서 남아 있는 추종자들을 한국어로 가장 자연스럽게 가리키는 표현으로 ‘부하들’을 택했습니다.
theological_decisions:
- issue: 블레셋의 군사 집합과 아기스의 요구를 어떤 강도로 표현할지
  chosen_reading: 직역을 과도하게 딱딱하게 만들지 않되, 본문의 군사적 압박과 다윗에 대한 아기스의 지시성을 유지했습니다.
  alternative_readings:
  - 더 문자적으로 ‘진영 안에서’로 옮기는 읽기
  - 더 완화하여 ‘함께 가게 될’ 정도로 처리하는 읽기
  rationale: 히브리어는 군사 동원과 동행 요구를 함께 말하므로, 한국어에서도 둘의 긴장을 모두 보존하는 것이 본문의 의미를 더 잘 전달합니다.
  doctrine_reference: 서사 본문에서의 의미 보존 원칙
