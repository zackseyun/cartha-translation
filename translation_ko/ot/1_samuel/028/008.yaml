  - severity: medium
    issue: ‘신접자를 통해 점을 쳐 주고’는 발화 상대인 여인과의 관계상 어색합니다.
    rationale: 사울은 신접 행위를 하는 여인에게 요청하고 있으므로, 별도 신접자를 경유한다는 뜻처럼 들리지 않게 ‘신접술로’로 옮기는 편이 적절합니다.
  - severity: low
