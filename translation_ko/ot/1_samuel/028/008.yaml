base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/008.yaml
  text: So Saul disguised himself and put on other clothes[a], and he went, he and two men with him. They came to the woman by night, and he said, “Please divine for me by a medium, and bring up for me the one whom I name to you.”
  footnotes:
  - marker: a
    text: Or 'through a familiar spirit.' The Hebrew term refers to a medium associated with necromantic consultation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 사울은 자신을 변장하고 다른 옷을 입었습니다. 그리고 그와 함께한 두 사람과 함께 갔습니다. 그들은 밤에 그 여자에게 이르렀고, 그가 말했습니다. "부디 내게 신접자를 통해 점을 쳐 주고, 내가 당신에게 말하는 그 사람을 불러 올려 주십시오."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘익숙한 영을 통해.’ 히브리어 용어는 강령적 교섭과 관련된 신접자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַפֵּשׂ
  english_pob_choice: disguised himself
  chosen_korean: 자신을 변장하고
  alternatives_korean:
  - 자신을 알아볼 수 없게 하고
  - 얼굴을 바꾸고
  lexicon: HALOT
  rationale: 히트파엘은 사울이 신분을 숨기기 위해 외모를 바꾼 동작을 가리키므로, 현대 한국어에서 가장 자연스럽고 직접적인 ‘변장하다’를 택했습니다.
- source_word: בְּגָדִים אֲחֵרִים
  english_pob_choice: other clothes
  chosen_korean: 다른 옷을 입었습니다
  alternatives_korean:
  - 다른 의복을 입었습니다
  - 이른바 다른 옷으로 갈아입었습니다
  lexicon: HALOT
  rationale: 변장의 일부로 옷을 바꾸는 평이한 의미이므로, 과장 없이 직역에 가까운 표현을 사용했습니다.
- source_word: קָסֳמִי נָא לִי בָּאוֹב
  english_pob_choice: Please divine for me by a medium
  chosen_korean: 부디 내게 신접자를 통해 점을 쳐 주고
  alternatives_korean:
  - 부디 내게 무당을 통해 점을 쳐 주고
  - 부디 내게 영매를 통해 점을 쳐 주고
  lexicon: HALOT
  rationale: 오브는 사자와의 교섭에 연결된 매개자를 뜻하므로, 전통적 교회어인 ‘신접자’를 사용해 본문의 초자연적·점술적 성격을 드러냈습니다.
- source_word: וְהַעֲלִי לִי אֵת אֲשֶׁר אֹמַר אֵלָיִךְ
  english_pob_choice: and bring up for me the one whom I name to you
  chosen_korean: 내가 당신에게 말하는 그 사람을 불러 올려 주십시오
  alternatives_korean:
  - 내가 당신에게 이름하는 그 사람을 올려 주십시오
  - 내가 당신에게 말할 그 사람을 끌어 올려 주십시오
  lexicon: HALOT
  rationale: העלה는 죽은 자를 ‘올려오게 하다’는 장면의 관용을 반영하므로, ‘불러 올리다’로 이미지와 요청의 방향을 함께 살렸습니다.
theological_decisions:
- issue: 점술·강령 요청을 번역에서 어떻게 처리할지
  chosen_reading: 본문의 요청을 완곡하게 약화하지 않고, 사울의 말로서 ‘점을 쳐 주고’와 ‘불러 올려 주십시오’라고 직접 옮겼습니다.
  alternative_readings:
  - ‘마법을 행해 주고’처럼 일반화하기
  - 해석을 덧붙여 ‘거짓으로 불러 올려’처럼 판단하기
  rationale: 이 절은 서술자의 평가보다 사울의 요청 자체를 전달하는 장면이므로, 번역이 본문이 가진 긴장을 보존해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
