source:
  edition: WLC
  text: וַ/יַּ֥רְא שָׁא֖וּל אֶת מַחֲנֵ֣ה פְלִשְׁתִּ֑ים וַ/יִּרָ֕א וַ/יֶּחֱרַ֥ד לִבּ֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/005.yaml
  text: When Saul saw the camp of the Philistines[a], he was afraid, and his heart trembled greatly.
  footnotes:
  - marker: a
    text: Or 'his heart shuddered very much.' The Hebrew keeps the image of the heart as the seat of inner fear.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울은 블레셋 사람들의 진을 보고 두려워하였고, 그의 마음은 몹시 떨렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 마음이 매우 떨렸다’입니다. 히브리어에서 ‘마음’은 내면의 두려움이 자리한 중심으로 표현됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: saw
  chosen_korean: 보자
  alternatives_korean:
  - 보고
  - 바라보자
  lexicon: HALOT
  rationale: 단순한 시각 인지를 자연스러운 서술 연결인 ‘보자’로 옮겨, 사건 진행을 살리면서도 과도한 해석을 피했습니다.
- source_word: מַחֲנֵה
  english_pob_choice: camp
  chosen_korean: 진
  alternatives_korean:
  - 진영
  - 군대
  - 야영지
  lexicon: HALOT
  rationale: 블레셋의 군사적 배치를 구체적으로 드러내는 말로 ‘진’을 택해, 본문의 물리적·군사적 장면을 보존했습니다.
- source_word: וַיִּרָא
  english_pob_choice: he was afraid
  chosen_korean: 두려워했고
  alternatives_korean:
  - 무서워했고
  - 두려움을 느꼈고
  - 두려워했습니다
  lexicon: HALOT
  rationale: 히브리어의 פחד/ירא 계열의 감정 상태를 현대 한국어 서술로 자연스럽게 반영하되, 이어지는 동작과 병렬되도록 연결형으로 처리했습니다.
- source_word: וַיֶּחֱרַד לִבּוֹ מְאֹד
  english_pob_choice: his heart trembled greatly
  chosen_korean: 그의 마음이 크게 떨었습니다
  alternatives_korean:
  - 그의 심장이 크게 떨렸습니다
  - 그의 마음이 몹시 떨렸습니다
  - 그의 마음이 크게 흔들렸습니다
  lexicon: HALOT
  rationale: ‘heart’의 히브리적 내면 표상을 살리면서도 한국어에서 더 자연스러운 ‘마음’으로 옮겼고, ‘trembled greatly’의 강도를 ‘크게 떨었습니다’로 재현했습니다.
theological_decisions:
- issue: ‘heart’의 인류학적 표상 유지
  chosen_reading: ‘마음’으로 옮기되 내면의 두려움이 몸의 떨림으로 드러나는 이미지를 보존했습니다.
  alternative_readings:
  - ‘심장’으로 직역해 신체 기관 이미지를 더 강하게 살리는 읽기
  - ‘속이 떨렸다’로 의미 중심의 의역
  rationale: 본문은 פחד의 심리 상태를 단순 진술하지 않고 ‘마음’의 떨림으로 묘사하므로, 한국어에서도 내면 중심의 이미지를 유지하는 것이 적절합니다.
  doctrine_reference: '성경의 인류학: לב(heart)를 내면의 중심으로 보는 용례'
