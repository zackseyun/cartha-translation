  lexicon: HALOT
  rationale: מָאֵן은 단순한 비동의보다 분명한 거절을 뜻하므로, 서술문에서 자연스럽고 직접적인 ‘거절하다’를 택했습니다.
- source_word: וַיִּפְרְצוּ בוֹ
  english_pob_choice: urged him
  chosen_korean: 그를 재촉하자
  alternatives_korean:
  - 그를 강하게 다그치자
  - 그에게 강권하자
  lexicon: HALOT
  rationale: 이 관용구는 문자적 ‘부수다’가 아니라 강한 압박과 재촉을 뜻하므로, 현대 한국어에서 무리 없는 ‘재촉하다’로 옮겼습니다.
- source_word: לְקֹלָם
  english_pob_choice: he listened to their voice
  chosen_korean: 그들의 목소리를 들었습니다
  alternatives_korean:
  - 그들의 말을 들었습니다
  - 그들의 목소리에 귀를 기울였습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 ‘목소리’를 유지하되, 한국어에서는 자연스러운 동사와 결합해 응답/수용의 뉘앙스를 전달했습니다.
- source_word: מִטָּה
  english_pob_choice: bed
  chosen_korean: 침상
  alternatives_korean:
  - 침대
  - 요
  lexicon: HALOT
  rationale: מִטָּה는 침상이나 누울 자리까지 포괄할 수 있어, 이 장면의 고대적 가구 감각을 살리는 ‘침상’을 택했습니다.
