source:
  edition: WLC
  text: וַ/יְמָאֵ֗ן וַ/יֹּ֨אמֶר֙ לֹ֣א אֹכַ֔ל וַ/יִּפְרְצוּ ב֤/וֹ עֲבָדָי/ו֙ וְ/גַם הָ֣/אִשָּׁ֔ה וַ/יִּשְׁמַ֖ע לְ/קֹלָ֑/ם וַ/יָּ֨קָם֙ מֵֽ/הָ/אָ֔רֶץ וַ/יֵּ֖שֶׁב אֶל הַ/מִּטָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/023.yaml
  text: But he refused and said[a], “I will not eat.” Yet his servants, along with the woman, urged him, and he listened to their voice[c][b]. So he rose from the ground and sat on the bed.
  footnotes:
  - marker: a
    text: Or “pressed him” for “urged him strongly”; the Hebrew idiom conveys strong insistence.
    reason: lexical_alternative
  - marker: b
    text: Literally, “he listened to their voice.”
    reason: lexical_alternative
  - marker: c
    text: “Bed” may also refer to a couch or divan in this setting.
    reason: cultural_note
translation:
  language: ko
  text: 그가 거절하며 말했습니다[a]. “나는 먹지 않겠습니다.” 그러나 그의 종들과 그 여자도 그를 재촉하자, 그는 그들의 목소리를 들었습니다[c][b]. 그래서 그는 땅에서 일어나 침상에 앉았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “간청하며”로 옮길 수 있습니다. 히브리어 관용구는 강한 재촉을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그들의 목소리를 들었다”입니다.
    reason: lexical_alternative
  - marker: c
    text: 여기서 “침상”은 의자형 소파나 긴의자 같은 가구를 가리킬 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמָאֵן
  english_pob_choice: he refused
  chosen_korean: 그가 거절하며
  alternatives_korean:
  - 그가 거부하며
  - 그가 마다하며
  lexicon: HALOT
  rationale: מָאֵן은 단순한 비동의보다 분명한 거절을 뜻하므로, 서술문에서 자연스럽고 직접적인 ‘거절하다’를 택했습니다.
- source_word: וַיִּפְרְצוּ בוֹ
  english_pob_choice: urged him
  chosen_korean: 그를 재촉하자
  alternatives_korean:
  - 그를 강하게 다그치자
  - 그에게 강권하자
  lexicon: HALOT
  rationale: 이 관용구는 문자적 ‘부수다’가 아니라 강한 압박과 재촉을 뜻하므로, 현대 한국어에서 무리 없는 ‘재촉하다’로 옮겼습니다.
- source_word: לְקֹלָם
  english_pob_choice: he listened to their voice
  chosen_korean: 그들의 목소리를 들었습니다
  alternatives_korean:
  - 그들의 말을 들었습니다
  - 그들의 목소리에 귀를 기울였습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 ‘목소리’를 유지하되, 한국어에서는 자연스러운 동사와 결합해 응답/수용의 뉘앙스를 전달했습니다.
- source_word: מִטָּה
  english_pob_choice: bed
  chosen_korean: 침상
  alternatives_korean:
  - 침대
  - 요
  lexicon: HALOT
  rationale: מִטָּה는 침상이나 누울 자리까지 포괄할 수 있어, 이 장면의 고대적 가구 감각을 살리는 ‘침상’을 택했습니다.
