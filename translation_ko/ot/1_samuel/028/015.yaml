revisions:
- from: 그러자 사무엘이 사울에게 말했습니다. “왜 나를 불러 올려서 나를 괴롭히느냐?” 사울이 대답했습니다. “저는 심히 고통스럽습니다. 블레셋 사람들이 저를 치고 있고, 하나님께서 저를 떠나셔서 더는 대답하지 않으십니다 — 선지자들을 통해서도, 꿈을 통해서도 말입니다. 그래서 제가 당신을 불러, 제가 무엇을 해야 할지 알려 달라고 했습니다.”[a][b]
  to: 그러자 사무엘이 사울에게 말했습니다. “왜 나를 불러 올려 나를 괴롭게 합니까?[a]” 사울이 대답했습니다. “저는 몹시 곤경에 처해 있습니다. 블레셋 사람들이 저를 상대로 싸우고 있고, 하나님께서는 저를 떠나셔서 더 이상 예언자들을 통해서도[b] 꿈을 통해서도 제게 대답하지 않으십니다. 그래서 제가 무엇을 해야 할지 제게 알려 달라고 당신을 불렀습니다.”
  rationale: 원문의 ‘불러 올리다’라는 공간적 이미지를 보존하고, רגז의 ‘동요시키고 괴롭히다’라는 뜻을 과도하게 해석하지 않으면서 자연스러운 합쇼체로 다듬었습니다. נביאים은 현대 표준어에 맞춰 ‘예언자들’로 통일했으며, 두 각주를 각각의 해당 표현에 배치했습니다. 사무엘의 정체나 사건의 기제에 관한 해석은 추가하지 않았습니다.
