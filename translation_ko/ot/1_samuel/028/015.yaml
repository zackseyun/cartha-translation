  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לָ֥/מָּה הִרְגַּזְתַּ֖/נִי לְ/הַעֲל֣וֹת אֹתִ֑/י וַ/יֹּ֣אמֶר שָׁ֠אוּל צַר לִ֨/י מְאֹ֜ד וּ/פְלִשְׁתִּ֣ים נִלְחָמִ֣ים בִּ֗/י וֵֽ/אלֹהִ֞ים סָ֤ר מֵֽ/עָלַ/י֙ וְ/לֹֽא עָנָ֣/נִי ע֗וֹד גַּ֤ם בְּ/יַֽד הַ/נְּבִיאִם֙ גַּם בַּ֣/חֲלֹמ֔וֹת וָ/אֶקְרָאֶ֣/ה לְ/ךָ֔ לְ/הוֹדִיעֵ֖/נִי מָ֥ה אֶעֱשֶֽׂה־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/015.yaml
  text: Then Samuel said to Saul[a], “Why have you disturbed me by bringing me up?” Saul answered, “I am in great distress. The Philistines are fighting against me, and God has turned away from me and no longer answers me, either by prophets or by dreams[b]. So I have called you to tell me what I should do.”
  footnotes:
  - marker: a
    text: Or 'Why have you troubled me by bringing me up?'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'by the hand of the prophets,' an idiom meaning 'through the prophets.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 사무엘이 사울에게 말했습니다. “왜 나를 불러 올려 나를 괴롭게 합니까?[a]” 사울이 대답했습니다. “저는 몹시 곤경에 처해 있습니다. 블레셋 사람들이 저를 상대로 싸우고 있고, 하나님께서는 저를 떠나셔서 더 이상 예언자들을 통해서도[b] 꿈을 통해서도 제게 대답하지 않으십니다. 그래서 제가 무엇을 해야 할지 제게 알려 달라고 당신을 불렀습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘괴롭게 합니까’는 ‘불안하게 합니까’ 또는 ‘동요시키고 괴롭힙니까’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘예언자들의 손으로’이며, 여기서는 ‘예언자들을 통하여’라는 뜻의 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְגַּזְתַּנִי
  english_pob_choice: have you disturbed me
  chosen_korean: 나를 괴롭히느냐
  alternatives_korean:
  - 나를 불안하게 하느냐
  - 나를 소란스럽게 하느냐
  lexicon: HALOT
  rationale: רגז는 단순한 심리적 ‘불안’보다 상대를 흔들고 परेशान하게 하는 뜻을 띠므로, 사무엘의 불쾌감을 드러내는 자연스러운 현대어로 옮겼습니다.
- source_word: לְהַעֲלוֹת אֹתִי
  english_pob_choice: by bringing me up
  chosen_korean: 불러 올려서
  alternatives_korean:
  - 올려서
  - 올려오게 해서
  lexicon: HALOT
  rationale: עלה의 ‘올리다’라는 공간적 이미지를 살려, 죽은 자의 영역에서 ‘올려 부르다’는 맥락이 드러나도록 했습니다.
- source_word: צַר לִי מְאֹד
  english_pob_choice: I am in great distress
  chosen_korean: 저는 심히 고통스럽습니다
  alternatives_korean:
  - 저는 매우 괴롭습니다
  - 제가 몹시 곤궁합니다
  lexicon: HALOT
  rationale: 표현이 사울의 내적 압박과 위기 상태를 가리키므로, 현대 한국어에서 충분히 강한 정도를 가진 말로 옮겼습니다.
- source_word: גַּם בְּיַד הַנְּבִיאִם גַּם בַּחֲלֹמוֹת
  english_pob_choice: either by prophets or by dreams
  chosen_korean: 선지자들을 통해서도, 꿈을 통해서도
  alternatives_korean:
  - 예언자들을 통해서도, 꿈을 통해서도
  - 선지자 손을 통해서도, 꿈으로도
  lexicon: HALOT
  rationale: ביד은 매개 수단의 의미이므로 ‘통해서’로 풀었고, גם ... גם의 대응을 ‘...도 ...도’로 살렸습니다.
- source_word: וָאֶקְרָאֶה לְךָ
  english_pob_choice: So I have called you
  chosen_korean: 당신을 불러
  alternatives_korean:
  - 당신을 불러왔습니다
  - 당신을 불렀습니다
  lexicon: HALOT
  rationale: קרא + ל의 호출/소환 의미를 반영하되, 문맥상 ‘불러’로 간결하게 처리해 초자연적 소환의 뉘앙스를 과도하게 덧씌우지 않았습니다.
theological_decisions:
- issue: 사무엘의 발화와 존재 방식
  chosen_reading: 본문이 제시하는 대로 사무엘이 사울에게 말하는 장면을 그대로 옮기고, 그 정체에 대한 해석은 덧붙이지 않았습니다.
  alternative_readings:
  - 그 모습이 사무엘을 가장한 영이라고 해석함
  - 단지 무당의 인식으로 제한함
  rationale: 히브리어 서술은 ‘사무엘이 사울에게 말하되’라고 직접 제시하므로, 번역은 본문의 서술 방식 자체를 보존하는 것이 가장 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
