id: 1SA.28.6
reference: 1 Samuel 28:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בַּֽ/יהוָ֔ה וְ/לֹ֥א עָנָ֖/הוּ יְהוָ֑ה גַּ֧ם בַּ/חֲלֹמ֛וֹת גַּ֥ם בָּ/אוּרִ֖ים גַּ֥ם בַּ/נְּבִיאִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/006.yaml
  text: Saul inquired of Yahweh[a], but Yahweh did not answer him[b], either by dreams or by the Urim or by the prophets.
  footnotes:
  - marker: a
    text: Or 'through dreams ... through the Urim ... through the prophets.'
    reason: lexical_alternative
  - marker: b
    text: The Urim was a priestly means of seeking divine guidance.
    reason: cultural_note
translation:
  language: ko
  text: 사울이 야훼께 물었으나, 야훼께서는 그에게 응답하지 않으셨습니다. 꿈으로도, 우림으로도, 예언자들로도 그러하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물었습니다’는 כאן의 שׁאל이 신탁/인도 구함의 뜻이라는 점을 반영합니다.
    reason: source_note
  - marker: b
    text: ‘우림’은 제사장적 신탁 수단을 가리키는 고유한 культ적 용어입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  english_pob_choice: inquired of Yahweh
  chosen_korean: 야훼께 물었습니다
  alternatives_korean:
  - 야훼를 찾았습니다
  - 야훼께 문의했습니다
  lexicon: HALOT
  rationale: שׁאל은 단순한 질문이 아니라 신적 인도를 구하는 문맥이므로, 현대 한국어에서는 ‘물었습니다’로 자연스럽게 살리되 대상이 하나님임을 분명히 했습니다.
- source_word: וְלֹא עָנָהוּ
  english_pob_choice: did not answer him
  chosen_korean: 그에게 응답하지 않으셨습니다
  alternatives_korean:
  - 그에게 대답하지 않으셨습니다
  - 그에게 답하지 않으셨습니다
  lexicon: HALOT
  rationale: 여기서 ענה는 오라클적 응답을 가리키므로, 한국어에서는 일상적 ‘대답’보다 공적·신학적 뉘앙스가 있는 ‘응답’이 더 적합합니다.
- source_word: בַּחֲלֹמוֹת ... בָּאוּרִים ... בַּנְּבִיאִם
  english_pob_choice: either by dreams or by the Urim or by the prophets
  chosen_korean: 꿈으로도, 우림으로도, 예언자들로도
  alternatives_korean:
  - 꿈을 통해서도, 우림을 통해서도, 예언자들을 통해서도
  - 꿈으로나 우림으로나 예언자들로도
  lexicon: HALOT
  rationale: 반복되는 גַּם의 분배적 힘을 한국어의 ‘~으로도’ 반복으로 옮겨, 각각의 수단을 통해서도 응답이 오지 않았다는 점을 분명히 했습니다.
- source_word: בָּאוּרִים
  english_pob_choice: the Urim
  chosen_korean: 우림
  alternatives_korean:
  - 우림 판결구
  - 우림과 둠밈
  lexicon: HALOT
  rationale: 우림은 제사장적 신탁 수단의 고유명사이므로 번역하지 않고 음역했습니다. 본문에는 단수 관사를 붙이지 않는 것이 한국어에 더 자연스럽습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 여호와 이름 יְהוָה를 POB 원칙에 따라 ‘야훼’로 옮겨, 언약적 고유명을 직접 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 응답이 없었다는 진술의 범위
  chosen_reading: 사울에게는 꿈, 우림, 예언자들 어느 경로로도 야훼의 응답이 없었습니다
  alternative_readings:
  - 사울의 죄에 대한 이유 설명을 덧붙이는 해석
  - 하나님이 완전히 침묵하셨다는 일반화
  rationale: 본문이 말하는 것은 오직 열거된 세 수단을 통한 응답 부재이며, 그 이유는 여기서 설명되지 않으므로 신학적 긴장을 그대로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
