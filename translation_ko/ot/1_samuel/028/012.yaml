base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/012.yaml
  text: When the woman saw Samuel[a], she cried out with a loud voice, and the woman said to Saul, “Why have you deceived me? You are Saul!”
  footnotes:
  - marker: a
    text: Or, 'what appeared to be Samuel.' The Hebrew text simply says 'Samuel,' without explaining the nature of the appearance.
    reason: alternative_reading
translation:
  language: ko
  text: 그 여자가 사무엘[a]을 보자 큰 소리로 외쳤고, 그 여자가 사울에게 말했습니다. “왜 나를 속이셨습니까? 당신이 사울이군요!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사무엘로 보이는 존재.’ 히브리어 본문은 설명 없이 단순히 ‘사무엘’이라고만 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶא הָאִשָּׁה אֶת שְׁמוּאֵל
  english_pob_choice: When the woman saw Samuel
  chosen_korean: 그 여자가 사무엘을 보자
  alternatives_korean:
  - 그 여자가 사무엘을 보았을 때
  - 그 여자가 사무엘을 보고
  lexicon: HALOT
  rationale: ראה의 서술형 진행을 한국어에서는 자연스러운 선행 상황 표현인 ‘보자’로 옮겨, 직접 목격의 의미를 유지했습니다.
- source_word: וַתִּזְעַק בְּקוֹל גָּדוֹל
  english_pob_choice: she cried out with a loud voice
  chosen_korean: 큰 소리로 외쳤고
  alternatives_korean:
  - 큰 목소리로 소리쳤고
  - 큰소리로 외쳤고
  lexicon: HALOT
  rationale: זעק의 강한 외침을 ‘외치다’로 살리고, בְּקוֹל גָּדוֹל의 강도를 자연스러운 한국어 어법으로 압축해 전달했습니다.
- source_word: לָמָּה רִמִּיתָנִי
  english_pob_choice: Why have you deceived me?
  chosen_korean: 왜 나를 속이셨습니까?
  alternatives_korean:
  - 왜 저를 속이셨습니까?
  - 왜 저를 속였습니까?
  lexicon: HALOT
  rationale: רמה의 ‘속이다/기만하다’ 의미를 살리되, 대화체의 직접성을 위해 ‘속이셨습니까?’로 옮겼습니다.
- source_word: וְאַתָּה שָׁאוּל
  english_pob_choice: You are Saul!
  chosen_korean: 당신이 사울이군요!
  alternatives_korean:
  - 당신은 사울이십니다!
  - 당신이 사울이십니다!
  lexicon: HALOT
  rationale: 히브리어의 강조된 주어를 ‘당신이’로 반영하고, 새로 알아차린 사실을 드러내는 종결로 한국어 감탄을 살렸습니다.
theological_decisions:
- issue: 사무엘의 정체를 본문에서 어떻게 처리할지
  chosen_reading: 본문은 ‘사무엘’을 그대로 유지하고, 추가 설명 없이 여인이 실제로 사무엘을 본 것으로 옮겼습니다.
  alternative_readings:
  - 사무엘로 보이는 존재
  - 사무엘의 영
  rationale: 히브리어 본문이 단순히 ‘사무엘’을 말하므로, 정체를 해석으로 확정하지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: '번역 원칙: 본문이 직접 말하는 범위를 넘는 해석을 본문에 삽입하지 않음'
