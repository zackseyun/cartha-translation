  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל לַ/עֲבָדָ֗י/ו בַּקְּשׁוּ לִ/י֙ אֵ֣שֶׁת בַּעֲלַת א֔וֹב וְ/אֵלְכָ֥ה אֵלֶ֖י/הָ וְ/אֶדְרְשָׁה בָּ֑/הּ וַ/יֹּאמְר֤וּ עֲבָדָי/ו֙ אֵלָ֔י/ו הִנֵּ֛ה אֵ֥שֶׁת בַּֽעֲלַת א֖וֹב בְּ/עֵ֥ין דּֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/007.yaml
  text: Then Saul said to his servants, “Find for me a woman who is a medium, so that I may go to her and inquire through her.” And his servants said to him, “Look, there is a woman who is a medium at En-dor.”
translation:
  language: ko
  text: 그때 사울이 자기 종들에게 말했습니다. "나를 위해 신접한 여자를 찾아보아라. 내가 그녀에게 가서 그녀를 통해 알아보겠다." 그의 종들이 그에게 말했습니다. "보십시오, 엔돌에 신접한 여자가 있습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '오브를 가진 여자'로, 영매/신접자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָי/ו
  english_pob_choice: his servants
  chosen_korean: 자기 종들
  alternatives_korean:
  - 그의 종들
  - 시종들
  lexicon: עֶבֶד / δοῦλος
  rationale: 사울의 소속 인원을 자연스럽게 드러내되, 본문의 일반적 종/종속 관계를 유지하기 위해 '자기 종들'로 옮겼습니다.
- source_word: אֵשֶׁת בַּעֲלַת א֔וֹב
  english_pob_choice: a woman who is a medium
  chosen_korean: 신접한 여자
  alternatives_korean:
  - 무당인 여자
  - 주술하는 여자
  lexicon: בַּעֲלַת־אוֹב
  rationale: 히브리어 오브는 영매/신접을 가리키므로, 교회적 완곡어보다 본문의 초자연적 매개 행위를 직접 드러내는 '신접한 여자'를 택했습니다.
- source_word: וְ/אֶדְרְשָׁה בָּ֑/הּ
  english_pob_choice: and inquire through her
  chosen_korean: 그녀를 통해 알아보겠다
  alternatives_korean:
  - 그녀에게 묻겠다
  - 그녀를 통해 신탁을 구하겠다
  lexicon: דָּרַשׁ
  rationale: POB의 'through her'를 반영하면서, 히브리어의 '찾아 묻다/자문하다' 의미를 한국어로 자연스럽게 살려 직역보다 읽히는 표현으로 옮겼습니다.
- source_word: בְּ/עֵ֥ין דּֽוֹר
  english_pob_choice: at En-dor
  chosen_korean: 엔돌에
  alternatives_korean:
  - 엔돌에 있는
  - 엔돌 지역에
  lexicon: 고유명사
  rationale: 지명은 통용 표기 '엔돌'을 따랐고, 위치 관계는 간결한 처격 조사로 처리했습니다.
theological_decisions:
- issue: 사울의 요청이 단순한 상담이 아니라 금지된 초자연적 행위를 지향한다는 점
  chosen_reading: '''신접한 여자''와 ''그녀를 통해 알아보겠다''로 옮겨, 사울이 영적 매개자를 통해 점복하려는 행위를 직접 드러냈습니다.'
  alternative_readings:
  - 부드러운 '무당' 표현
  - 중립적인 '상담한다' 표현
  rationale: 본문의 윤리적·신학적 긴장을 희석하지 않기 위해, 행위의 금지성과 초자연성을 분명히 유지했습니다.
  doctrine_reference: 신 18:10-12; 레 19:31
