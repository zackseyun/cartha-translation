id: 1SA.28.19
reference: 1 Samuel 28:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִתֵּ֣ן יְ֠הוָה גַּ֣ם אֶת יִשְׂרָאֵ֤ל עִמְּ/ךָ֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/מָחָ֕ר אַתָּ֥ה וּ/בָנֶ֖י/ךָ עִמִּ֑/י גַּ֚ם אֶת מַחֲנֵ֣ה יִשְׂרָאֵ֔ל יִתֵּ֥ן יְהוָ֖ה בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/019.yaml
  text: And Yahweh will also give Israel with you into the hand of the Philistines[a], and tomorrow you and your sons will be with me[b]. Yahweh will also give the camp of Israel into the hand of the Philistines.
  footnotes:
  - marker: a
    text: Or, 'with me in death' or 'with me in Sheol.' The Hebrew simply says 'with me.'
    reason: alternative_reading
  - marker: b
    text: Or, 'the camp of Israel.' The Hebrew term can mean 'camp' or, in context, 'army.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 이스라엘도 당신과 함께 블레셋 사람들의 손에 넘기실 것이며, 내일 당신과 당신의 아들들도 나와 함께 있게 될 것입니다. 여호와께서 또한 이스라엘의 진영을 블레셋 사람들의 손에 넘기실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: WLC
  rationale: 한국어 독자에게는 전통적으로 굳어진 신명 표기인 ‘여호와’가 가장 자연스럽고, 본문에서 야훼/여호와의 동일 지칭을 명확히 전달합니다.
- source_word: בְּיַד פְּלִשְׁתִּים
  english_pob_choice: into the hand of the Philistines
  chosen_korean: 블레셋 사람들의 손에 넘기실
  alternatives_korean:
  - 블레셋 사람들의 손에 주실
  - 블레셋 사람들의 권세 아래 두실
  lexicon: HALOT
  rationale: ‘손에’는 히브리어 관용구를 살리고, ‘넘기실’은 적대적 인도/이양의 의미를 자연스럽게 드러냅니다.
- source_word: וּמָחָר אַתָּה וּבָנֶיךָ עִמִּי
  english_pob_choice: and tomorrow you and your sons will be with me
  chosen_korean: 내일 당신과 당신의 아들들도 나와 함께 있게 될 것입니다
  alternatives_korean:
  - 내일 당신과 당신의 아들들도 나와 함께 있을 것입니다
  - 내일 당신과 당신의 아들들도 내 곁에 있게 될 것입니다
  lexicon: HALOT
  rationale: ‘함께 있게 될 것입니다’로 히브리어의 짧은 표현을 유지하면서도, 영어 POB가 보존한 ‘with me’의 모호성을 한국어에서도 그대로 남깁니다.
- source_word: מַחֲנֵה יִשְׂרָאֵל
  english_pob_choice: the camp of Israel
  chosen_korean: 이스라엘의 진영
  alternatives_korean:
  - 이스라엘의 군대
  - 이스라엘의 야영지
  lexicon: HALOT
  rationale: 문맥상 전투 집단을 가리키지만, 히브리어의 בסיס적 의미인 ‘진영/캠프’를 우선 살려 영어 POB의 수정된 선택을 반영했습니다.
theological_decisions:
- issue: ‘나와 함께’의 사후 상태를 명시할 것인가
  chosen_reading: 사후 세계의 구체적 상태를 덧붙이지 않고 ‘나와 함께 있게 될 것입니다’로만 옮겼습니다.
  alternative_readings:
  - 나와 함께 죽게 될 것입니다
  - 나와 함께 스올에 있게 될 것입니다
  - 나와 함께 무덤에 있게 될 것입니다
  rationale: 본문은 사울과 그의 아들들이 사무엘과 같은 상태/영역으로 가게 됨을 말하지만, 그 상태를 신학적으로 해설하지는 않습니다. 그래서 원문의 긴장을 보존했습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 것 이상을 신학적으로 확정하지 않음'
