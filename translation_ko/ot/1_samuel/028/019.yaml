  to: 여호와께서 이스라엘도 당신과 함께 블레셋 사람들의 손에 넘기실 것이며, 내일 당신과 당신의 아들들도 나와 함께 있게 될 것입니다. 여호와께서 또한 이스라엘의 진영을 블레셋 사람들의 손에 넘기실 것입니다.
