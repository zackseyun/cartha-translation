  source_fidelity: 첫 절의 עִמְּךָ는 ‘당신과 함께 있는 이스라엘’처럼 이스라엘을 수식하기보다, 사울과 이스라엘이 함께 블레셋 사람들에게 넘겨짐을 나타냅니다. 이를 문장 배열로 분명히 하는 것이 원문에 더 가깝습니다. ‘나와 함께’는 사후 상태를 특정하지 않아 원문의 모호성을 잘 보존합니다. מַחֲנֵה는 ‘진영’으로 옮길 수 있습니다.
  naturalness: ‘이스라엘도 당신과 함께’가 현대 표준 한국어에서 원문의 결속 범위를 더 자연스럽고 명료하게 드러냅니다. 합쇼체의 예언 선언문으로도 자연스럽습니다.
  terminology: ‘여호와’, ‘블레셋 사람들’, ‘이스라엘’, ‘진영’은 일관되고 적절합니다. 다만 YHWH를 설명하는 각주는 원문이나 제공된 영어 POB의 각주에 근거하지 않으며, 본문 끝에 붙어 내용상 해당 어휘와도 떨어져 있으므로 삭제하는 것이 좋습니다.
