source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה אֶת מִ֖י אַֽעֲלֶה לָּ֑/ךְ וַ/יֹּ֕אמֶר אֶת שְׁמוּאֵ֖ל הַֽעֲלִי לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/011.yaml
  text: Then the woman said[a], “Whom shall I bring up for you?” And he said, “Bring up Samuel for me.”
  footnotes:
  - marker: a
    text: Or “summon up.” The Hebrew verb literally means “bring up” or “cause to come up,” reflecting the idiom used in this necromantic context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여인이 말했습니다[a], “내가 누구를 당신을 위해 끌어올리겠습니다?” 그러자 그가 말했습니다. “사무엘을 나를 위해 끌어올리십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “소환하겠습니까?” 히브리어 동사는 문자적으로 “올려오다” 또는 “올라오게 하다”를 뜻하며, 여기서는 강신술적 상황의 관용구를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר / וַיֹּאמֶר
  english_pob_choice: Then ... said / And he said
  chosen_korean: 말했습니다 / 말했습니다
  alternatives_korean:
  - 이르렀습니다
  - 대답했습니다
  lexicon: HALOT
  rationale: 서술 전개를 자연스럽게 살리면서도 히브리어 wayyiqtol의 단순한 대화 진행을 반영하기 위해 평이한 ‘말했습니다’를 사용했습니다.
- source_word: אֶת מִי
  english_pob_choice: Whom
  chosen_korean: 누구를
  alternatives_korean:
  - 누구를요
  - 누구를 향해
  lexicon: HALOT
  rationale: 목적어 표지가 붙은 의문대명사의 기능을 한국어에서는 목적격 조사 ‘-를’로 반영하는 것이 가장 자연스럽습니다.
- source_word: אַעֲלֶה / הַעֲלִי
  english_pob_choice: shall I bring up / Bring up
  chosen_korean: 끌어올리겠습니다 / 끌어올리십시오
  alternatives_korean:
  - 올려오겠습니다 / 올려오십시오
  - 불러올리겠습니다 / 불러오십시오
  lexicon: HALOT
  rationale: 히필 עלה의 기본 뜻인 ‘올라오게 하다/끌어올리다’를 살려, 주술적 의미를 과도하게 풀지 않고 본문의 이미지와 반복을 유지했습니다.
- source_word: לָּךְ / לִי
  english_pob_choice: for you / for me
  chosen_korean: 당신을 위해 / 나를 위해
  alternatives_korean:
  - 당신에게
  - 내게
  lexicon: HALOT
  rationale: 여기서 ל는 수혜·목적의 용법이므로 한국어에서는 ‘-을 위해’로 옮겨 요청의 방향성을 분명히 했습니다.
theological_decisions:
- issue: 죽은 자를 ‘올려오다’는 주술적 관용구를 어떻게 보존할지
  chosen_reading: ‘끌어올리다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘불러오다’로 완화
  - ‘소환하다’로 의역
  rationale: 본문은 영매적 상황의 표현을 자기 방식대로 말하고 있으므로, 그 긴장을 완화하지 않고 동사 이미지를 그대로 살리는 편이 원문의 의미를 더 잘 드러냅니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
