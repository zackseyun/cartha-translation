translation:
  language: ko
  text: 그 여인이 말했습니다[a], “제가 누구를 당신을 위해 올려오게 하겠습니까?” 그러자 그가 말했습니다, “사무엘을 나를 위해 올려오게 하십시오.”
  philosophy: optimal-equivalence
  footnotes:
