base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/002.yaml
  text: David said to Achish[a], “Then you yourself will know what your servant can do.” And Achish said to David, “Very well[b], I will make you my bodyguard for all your days.”
  footnotes:
  - marker: a
    text: Or, “what your servant will do.” David’s wording is deliberately ambiguous.
    reason: lexical_alternative
  - marker: b
    text: Literally, “keeper for my head,” that is, a personal guard or bodyguard.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 아기스에게 말했습니다. “그러면 당신은 당신의 종이 무엇을 할지 직접 알게 될 것입니다.” 아기스가 다윗에게 말했습니다. “좋습니다. 내가 너를 내 머리의 경호원으로 삼아 네가 살아 있는 동안 내내 있게 하겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “당신의 종이 할 것.” 다윗의 말은 의도적으로 모호합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면, “내 머리를 지키는 자.” 곧 개인 경호원이나 몸을 지키는 사람을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה תֵדַע
  english_pob_choice: you yourself will know
  chosen_korean: 당신은 … 직접 알게 될 것입니다
  alternatives_korean:
  - 당신이 알게 될 것입니다
  - 당신 자신이 알게 될 것입니다
  lexicon: HALOT
  rationale: אַתָּה의 강조를 한국어에서 ‘직접’으로 살려, 단순한 예고보다 화자에게 강조점을 둔 응답임을 드러냈습니다.
- source_word: אֵת אֲשֶׁר יַעֲשֶׂה
  english_pob_choice: what your servant will do
  chosen_korean: 당신의 종이 무엇을 할지
  alternatives_korean:
  - 당신의 종이 할 일을
  - 당신의 종이 무엇을 할 것인지
  lexicon: HALOT
  rationale: 문맥상 다윗의 말은 능력과 행동을 의도적으로 겸손하게 남겨 두는 표현이어서, 영어 POB의 수정안에 맞추어 ‘할지’로 미래적·열린 의미를 살렸습니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 주인의 종
  lexicon: HALOT
  rationale: 여기서는 속박 신분이 아니라 궁정 예의적 자기지칭이므로, 프로젝트 기본값에 따라 ‘종’으로 옮겼습니다.
- source_word: שֹׁמֵר לְרֹאשִׁי
  english_pob_choice: my bodyguard
  chosen_korean: 내 머리의 경호원
  alternatives_korean:
  - 내 머리를 지키는 자
  - 내 머리의 파수꾼
  lexicon: HALOT
  rationale: 직역하면 ‘내 머리를 위한 지키는 자’이므로, 영어 POB의 최종 방침처럼 비유를 풀되 한국어에서 자연스럽게 역할을 드러내는 ‘경호원’으로 옮겼습니다.
- source_word: כָּל הַיָּמִים
  english_pob_choice: for all your days
  chosen_korean: 네가 살아 있는 동안 내내
  alternatives_korean:
  - 네 모든 날 동안
  - 평생
  lexicon: HALOT
  rationale: 히브리어의 지속성을 한국어로 자연스럽게 풀어, 단순한 시간표현보다 임명 기간의 계속성을 강조했습니다.
theological_decisions:
- issue: 아기스의 제안이 단순 직책인지 신체 보호 역할인지
  chosen_reading: ‘경호원’으로 번역하되, 본문 주석 없이도 ‘머리의 경호원’이라는 직역 흔적을 남겨 역할의 성격을 드러냈습니다.
  alternative_readings:
  - ‘내 머리의 지키는 자’로 더 직역하기
  - ‘내 몸을 지키는 자’로 의역하기
  rationale: 본문은 문자적으로는 ‘머리’를 말하지만 의미상 왕의 친위 보호직을 가리키므로, 직역과 기능 의미를 함께 살리는 절충이 필요했습니다.
  doctrine_reference: 본문 해석/서술 관행
