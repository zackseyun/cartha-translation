- from: 다윗이 아기스에게 말했습니다. “그러면 당신은 당신의 종이 무엇을 할지 직접 알게 될 것입니다.” 아기스가 다윗에게 말했습니다. “좋습니다. 내가 너를 내 머리의 경호원으로 삼아 네가 살아 있는 동안 내내 있게 하겠습니다.”[a][b]
