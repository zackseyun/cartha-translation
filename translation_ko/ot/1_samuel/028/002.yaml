  text: David said to Achish[a], “Then you yourself will know what your servant can do.” And Achish said to David, “Very well[b], I will make you my bodyguard for all your days.”
  footnotes:
  - marker: a
    text: Or, “what your servant will do.” David’s wording is deliberately ambiguous.
    reason: lexical_alternative
  - marker: b
    text: Literally, “keeper for my head,” that is, a personal guard or bodyguard.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 아기스에게 말했습니다. “그러면 당신이 직접 당신의 종이 무엇을 할 수 있는지 알게 될 것입니다.”[a] 아기스가 다윗에게 말했습니다. “좋습니다. 내가 당신을 평생 내 경호원으로 삼겠습니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “당신의 종이 무엇을 할지.” 다윗의 말은 의도적으로 모호합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면, “내 머리를 지키는 자.” 곧 개인 경호원, 또는 몸을 지키는 사람을 뜻합니다.
    reason: lexical_alternative
