base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/021.yaml
  text: The woman came to Saul[a], and when she saw that he was very terrified, she said to him, “Behold, your servant has obeyed your voice[b], and I have put my life in my hand and listened to your words that you spoke to me.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''your maidservant has listened to your voice.'' The expression means she heeded or obeyed Saul''s request.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''I have put my life in my hand,'' that is, ''I have risked my life'' or ''taken my life in my hand.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 여인이 사울에게로 와서 그가 몹시 두려워하는 것을 보고 그에게 말했습니다. "보십시오, 당신의 여종은 당신의 목소리에 순종하였고, 제 목숨을 제 손에 두고 당신이 제게 말씀하신 말을 들었습니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 관용구: “제 목숨을 제 손에 두다”는 곧 “목숨을 걸다”, “생명을 위험에 두다”는 뜻입니다.'
    reason: lexical_alternative
  - marker: b
    text: ‘순종하다’는 여기서 פשוט히 듣는 것이 아니라 요청을 받아들여 따르는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא הָאִשָּׁה אֶל שָׁאוּל
  english_pob_choice: The woman came to Saul
  chosen_korean: 여인이 사울에게로 와서
  alternatives_korean:
  - 그 여인이 사울에게 왔습니다
  - 여자가 사울에게로 와서
  lexicon: HALOT
  rationale: wayyiqtol의 서술 진행을 살리면서, אֶל의 방향성을 자연스럽게 '에게로'로 옮겼습니다.
- source_word: כִּי נִבְהַל מְאֹד
  english_pob_choice: he was very terrified
  chosen_korean: 그가 몹시 두려워하는 것을
  alternatives_korean:
  - 그가 매우 두려워하는 것을
  - 그가 크게 당황한 것을
  lexicon: HALOT
  rationale: נבהל은 단순 놀람보다 강한 동요·공포를 가리키므로, 문맥의 긴박함을 반영해 '몹시 두려워하다'로 옮겼습니다.
- source_word: שִׁפְחָתְךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 여종
  alternatives_korean:
  - 당신의 종
  - 당신의 여종/시녀
  lexicon: HALOT
  rationale: שִׁפְחָה는 여성 하인/종이므로 성별을 드러내는 '여종'을 택해 원문의 사회적 뉘앙스를 보존했습니다.
- source_word: שָׁמְעָה ... בְּקוֹלֶךָ
  english_pob_choice: has obeyed your voice
  chosen_korean: 당신의 목소리에 순종하였고
  alternatives_korean:
  - 당신의 소리를 들었고
  - 당신에게 순종하였고
  lexicon: HALOT
  rationale: שׁמע בְּקוֹל은 단순 청취가 아니라 '듣고 따르다/순종하다'의 관용구이므로, 의미를 분명히 하는 '순종하다'를 선택했습니다.
- source_word: וָאָשִׂים נַפְשִׁי בְּכַפִּי
  english_pob_choice: I have put my life in my hand
  chosen_korean: 제 목숨을 제 손에 두고
  alternatives_korean:
  - 제 목숨을 제 손에 넣고
  - 목숨을 걸고
  lexicon: HALOT
  rationale: 히브리어 관용구를 가능하면 이미지 그대로 보존하되, 한국어에서 이해 가능하도록 '목숨을 제 손에 두고'로 옮겼습니다.
theological_decisions:
- issue: 화자의 직접 발화에서의 겸양 표현
  chosen_reading: 여인이 자기 자신을 '당신의 여종'으로 낮추어 말하는 공손한 직접화법을 유지했습니다.
  alternative_readings:
  - '''종''으로 일반화해 번역'
  - 더 현대적인 '제 종'으로 완화
  rationale: 원문은 권력 관계와 자기 비하적 예절을 분명히 드러내므로, 이를 약화시키지 않고 사회적 긴장을 살렸습니다.
  doctrine_reference: 본문의 서사적·사회언어학적 맥락
