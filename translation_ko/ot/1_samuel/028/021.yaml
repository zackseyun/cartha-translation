  naturalness: 초안의 ‘당신의 목소리에 순종하였고’와 ‘제 목숨을 제 손에 두고’는 한국어로 다소 직역투입니다. 특히 후자는 한국어 관용어 ‘목숨을 걸고’를 본문에 쓰고 히브리어의 신체 이미지는 각주로 보존하는 편이 자연스럽습니다.
  terminology: שִׁפְחָתְךָ의 여성 표지를 살린 ‘당신의 여종’은 적절합니다. 직접화법의 높임과 자기낮춤도 유지됩니다. 각주 b에는 한국어가 아닌 ‘просто히’라는 표기가 있어 ‘단순히’로 바로잡아야 합니다.
