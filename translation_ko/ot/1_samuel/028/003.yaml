  - 영혼을 부르는 자들
  lexicon: HALOT
  rationale: 오브는 죽은 자와 교통하는 점술적 매개자를 가리키므로, 현대 독자가 곧바로 이해할 수 있는 한국어 관용어로 옮겼습니다.
- source_word: הַיִּדְּעֹנִים
  english_pob_choice: the spiritists
  chosen_korean: 점쟁이들
  alternatives_korean:
