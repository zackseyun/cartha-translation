  yaml_path: translation/ot/1_samuel/028/003.yaml
  text: Now Samuel had died[a], and all Israel had mourned for him and buried him in Ramah, in his own city. And Saul had removed the mediums and the spiritists from the land.
  footnotes:
  - marker: a
    text: Or 'those with familiar spirits and the wizards.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘이 이미 죽었고, 온 이스라엘이 그를 위해 슬퍼하며 라마, 곧 자기의 고향에 그를 묻었습니다. 그리고 사울은 그 땅에서 무당들과 점쟁이들을 제거했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영을 불러내는 자들과 마법사들.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵת
  english_pob_choice: had died
  chosen_korean: 이미 죽었고
  alternatives_korean:
  - 죽었고
  - 죽어 있었고
  lexicon: HALOT
  rationale: 사건 배경을 앞세우는 영어의 pluperfect 취지를 살리기 위해, 한국어에서도 이미 완료된 상태를 드러내는 표현을 썼습니다.
- source_word: הָאֹבוֹת
  english_pob_choice: the mediums
  chosen_korean: 무당들
  alternatives_korean:
  - 영매들
  - 영혼을 부르는 자들
  lexicon: HALOT
  rationale: 오브는 죽은 자와 교통하는 점술적 매개자를 가리키므로, 현대 독자가 곧바로 이해할 수 있는 한국어 관용어로 옮겼습니다.
- source_word: הַיִּדְּעֹנִים
  english_pob_choice: the spiritists
  chosen_korean: 점쟁이들
  alternatives_korean:
  - 주술사들
  - 예언자 흉내를 내는 자들
  lexicon: HALOT
  rationale: 이 어휘는 오브와 짝을 이루는 초자연적 점술 실천자를 가리키므로, 전통적이지만 문맥상 자연스러운 대응어를 선택했습니다.
- source_word: מֵהָאָרֶץ
  english_pob_choice: from the land
  chosen_korean: 그 땅에서
  alternatives_korean:
  - 그 나라에서
  - 땅에서
  lexicon: HALOT
  rationale: 히브리어의 정관사 있는 ‘땅’은 이스라엘의 영토를 가리키는 관용이므로, 문맥에 맞게 ‘그 땅’으로 옮겼습니다.
theological_decisions:
- issue: 오컬트 실천자 용어를 후대 민속적 상상으로 확대하지 않기
  chosen_reading: 무당들과 점쟁이들
  alternative_readings:
  - 영매들과 마술사들
  - 주술사들과 점술가들
  rationale: 히브리어 명칭은 금지된 점술가들을 가리키지만, 정확한 범주를 후대 서구식 occult 분류로 고정하지 않도록 비교적 중립적인 한국어를 택했습니다.
  doctrine_reference: Translation philosophy §§1, 6
