  to: 사무엘은 이미 죽었고, 온 이스라엘은 그를 위하여 애도하여 그의 성읍 라마에 장사 지냈습니다. 사울은 그 땅에서 영매들과 강신술사들을 제거했습니다.[a]
  rationale: ‘고향’을 원문의 소유격 도시 표현에 맞추어 ‘그의 성읍 라마’로 고쳤습니다. 금지된 두 부류의 실천자는 현대 한국어에서 특정 민속 전통이나 단순 점술로 한정하지 않도록 ‘영매들과 강신술사들’로 옮겼습니다. 대안적이고 전통적인 범주화는 각주에 남겨 어휘상 불확실성과 번역 가능성을 보존했습니다.
