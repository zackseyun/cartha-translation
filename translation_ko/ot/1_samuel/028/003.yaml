  text: Now Samuel had died[a], and all Israel had mourned for him and buried him in Ramah, in his own city. And Saul had removed the mediums and the spiritists from the land.
  footnotes:
  - marker: a
    text: Or 'those with familiar spirits and the wizards.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘은 이미 죽었고, 온 이스라엘은 그를 위하여 애도하여 그의 성읍 라마에 장사 지냈습니다. 사울은 그 땅에서 영매들과 강신술사들을 제거했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신접한 자들과 점술가들.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵת
