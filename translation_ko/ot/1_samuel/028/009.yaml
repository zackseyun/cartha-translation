  to: 그러나 그 여자가 그에게 말했습니다. “보십시오, 당신도 사울이 한 일, 곧 그가 이 땅에서 영매들과 신접자들을 끊어 버린 것을 알고 있습니다. 그런데 왜 제 목숨을 노리는 덫을 놓아 저를 죽이려 하십니까?”[a]
  rationale: The revision preserves the source's emphasis, the removal language of הִכְרִית, and the snare-for-life metaphor, while using more precise Korean designations for the two occult-practice terms. It also regularizes speech register and restores the adversative response force without altering the passage's meaning.
