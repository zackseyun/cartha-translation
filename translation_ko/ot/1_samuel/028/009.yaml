  text: But the woman said to him[a], “Look, you yourself know what Saul has done, that he has cut off the mediums and the spiritists from the land. So why are you laying a snare for my life, to put me to death?”
  footnotes:
  - marker: a
    text: Or, “those with familiar spirits and the wizards.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그 여자가 그에게 말했습니다. "보십시오, 당신은 사울이 어떤 일을 했는지, 곧 그가 이 땅에서 무당들과 점쟁이들을 끊어 버린 것을 이미 알고 계십니다. 그런데 왜 제 목숨을 노리는 덫을 놓아 저를 죽이려 하십니까?"[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “신접한 자들과 박수들.”
    reason: lexical_alternative
