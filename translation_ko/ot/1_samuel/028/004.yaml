  text: וַ/יִּקָּבְצ֣וּ פְלִשְׁתִּ֔ים וַ/יָּבֹ֖אוּ וַ/יַּחֲנ֣וּ בְ/שׁוּנֵ֑ם וַ/יִּקְבֹּ֤ץ שָׁאוּל֙ אֶת כָּל יִשְׂרָאֵ֔ל וַֽ/יַּחֲנ֖וּ בַּ/גִּלְבֹּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/004.yaml
  text: The Philistines gathered and came and camped at Shunem[a], and Saul gathered all Israel[b], and they camped at Gilboa.
  footnotes:
  - marker: a
    text: Or 'encamped' for both occurrences of 'camped.'
    reason: lexical_alternative
  - marker: b
    text: '''At Gilboa'' could also be rendered ''on Gilboa'' or ''at Mount Gilboa,'' since the place refers to the Gilboa highlands.'
    reason: lexical_alternative
translation:
  language: ko
  text: 블레셋 사람들이 모여 와서 수넴에 진을 쳤고[a], 사울은 온 이스라엘을 모아 길보아에 진을 쳤습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진을 쳤고’는 여기와 뒤의 동사 모두에 적용될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘길보아에’는 ‘길보아 산에’ 또는 ‘길보아 산지에’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  english_pob_choice: gathered
  chosen_korean: 모여
  alternatives_korean:
  - 집결하여
  - 모였습니다
  lexicon: HALOT
  rationale: קבץ의 기본 의미인 모임·집결을 자연스러운 서술체로 옮기되, 군사적 정황을 과도하게 해석하지 않도록 했습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: camped
  chosen_korean: 진을 쳤고
  alternatives_korean:
  - 캠프를 쳤고
  - 야영했고
  lexicon: HALOT
  rationale: חנה는 군사적으로 ‘진을 치다/진치다’가 가장 직접적이며, 한국어 성경 문체에서도 전투 상황을 분명히 드러냅니다.
- source_word: בְשׁוּנֵם
  english_pob_choice: at Shunem
  chosen_korean: 수넴에
  alternatives_korean:
  - 수넴에서
  - 수넴에 있는
  lexicon: HALOT
  rationale: 장소 부사어로서 한국어에서는 ‘-에’가 가장 무난하며, 전투 진영의 위치를 자연스럽게 나타냅니다.
- source_word: כָּל יִשְׂרָאֵל
  english_pob_choice: all Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 모든 이스라엘
  - 이스라엘 모든 사람
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현을 살려, 민족 전체/군대를 가리키는 범위를 좁히지 않고 전달했습니다.
theological_decisions:
- issue: 두 진영의 병행 서술에서 동사 반복의 효과
  chosen_reading: 양쪽 모두 ‘진을 쳤다’로 대응시켜 대치 구도를 분명히 살렸습니다.
  alternative_readings:
  - 한쪽만 ‘진을 치다’로 옮기고 다른 쪽은 ‘주둔하다’로 완화할 수 있음
  - 모두 ‘캠프하다’로 일반화할 수 있음
  rationale: 본문은 필리스티아와 이스라엘의 군사적 대치를 단순하고 대칭적으로 제시하므로, 한국어에서도 동일 동사를 반복해 긴장감을 유지하는 것이 원문에 충실합니다.
  doctrine_reference: 서사 본문의 군사적 사실 진술 보존
- issue: ‘길보아’의 지시 대상
  chosen_reading: ‘길보아에’로 옮겨 산지 지형을 암시하되, 원문에 없는 ‘산’은 본문에 넣지 않았습니다.
  alternative_readings:
  - ‘길보아 산에’로 구체화
  - ‘길보아 언덕에’로 의역
  rationale: 히브리어는 단순히 지명을 표기하므로, 영어 POB의 주석처럼 지형적 배경은 참고하되 본문에는 추가 정보를 덧붙이지 않는 것이 적절합니다.
  doctrine_reference: 지명 번역의 절제와 원문 범위 준수
