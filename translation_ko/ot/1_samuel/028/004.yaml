translation:
  language: ko
  text: 블레셋 사람들이 모여 와서 수넴에 진을 쳤고[a], 사울은 온 이스라엘을 모았으며, 그들은 길보아에 진을 쳤습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 두 ‘진을 치다’는 모두 ‘야영하다’ 또는 ‘주둔하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘길보아에’는 ‘길보아 산에’ 또는 ‘길보아 산지에’로도 옮길 수 있습니다.
    reason: lexical_alternative
