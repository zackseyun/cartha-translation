  text: וַ/יִּשָּׁ֤בַֽע לָ/הּ֙ שָׁא֔וּל בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר חַי יְהוָ֕ה אִֽם יִקְּרֵ֥/ךְ עָוֺ֖ן בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/010.yaml
  text: So Saul swore to her by Yahweh[a], saying, “As Yahweh lives, no punishment will come upon you in this matter.”
  footnotes:
  - marker: a
    text: Or 'no guilt will come upon you in this matter.' The Hebrew word can mean 'iniquity,' 'guilt,' or the punishment resulting from guilt.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울은 여호와를 두고 그녀에게 맹세하며 말했습니다. “야훼께서 살아 계신 한, 이 일로 너에게는 어떤 벌도 닥치지 않을 것이다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘벌’은 여기서 עָוֺן이 가질 수 있는 ‘죄책’이나 ‘죄악’보다, 문맥상 여성에게 실제로 닥칠 법적·형벌적 결과를 가리키는 해석입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  english_pob_choice: swore
  chosen_korean: 맹세하며
  alternatives_korean:
  - 맹세했습니다
  - 맹세하고 말했습니다
  lexicon: HALOT
  rationale: שׁבע의 핵심은 엄숙한 서약 행위이므로, 서술 흐름 안에서 자연스럽게 드러나는 ‘맹세하며’로 옮겼습니다.
- source_word: בַּיהוָה / חַי יְהוָה
  english_pob_choice: by Yahweh / As Yahweh lives
  chosen_korean: 여호와를 두고 / 야훼께서 살아 계신 한
  alternatives_korean:
  - 야훼를 두고 / 야훼께서 살아 계신 한
  - 주님을 두고 / 주님께서 살아 계신 한
  lexicon: WLC
  rationale: 본문의 서약 공식과 신명 표기를 함께 반영해, 서술문에서는 ‘여호와’, 직접 인용의 맹세 공식에서는 ‘야훼께서 살아 계신 한’으로 구분했습니다.
- source_word: אִם יִקְּרֵךְ עָוֺן
  english_pob_choice: no punishment will come upon you
  chosen_korean: 너에게는 어떤 벌도 닥치지 않을 것이다
  alternatives_korean:
  - 너에게는 어떤 죄책도 생기지 않을 것이다
  - 이 일로 어떤 불행도 너에게 닥치지 않을 것이다
  lexicon: HALOT
  rationale: 이 표현은 맹세문에서 생략된 부정의 뜻을 가지며, 여기서는 ‘이 일로 인한 법적/형벌적 결과 없음’이 핵심이므로 ‘벌’로 옮겼습니다.
- source_word: בַּדָּבָר הַזֶּה
  english_pob_choice: in this matter
  chosen_korean: 이 일로
  alternatives_korean:
  - 이 문제에서
  - 이 사건에 관해
  lexicon: HALOT
  rationale: 중립적인 דָּבָר를 한국어에서 가장 자연스러운 지시 표현인 ‘이 일로’로 압축해, 앞선 행위를 가리키는 맥락을 살렸습니다.
theological_decisions:
- issue: יהוה 표기와 직접 인용의 서약 공식
  chosen_reading: 서술부는 ‘여호와’, 직접 인용 안의 맹세 공식은 ‘야훼께서 살아 계신 한’으로 구분했습니다.
  alternative_readings:
  - 전체를 ‘야훼’로 통일
  - 전체를 ‘여호와’로 통일
  rationale: 본문에는 사울의 서술적 맹세와 고전적 서약 공식이 함께 나타나므로, 한국어 독자가 서술과 인용의 층위를 구분하도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
