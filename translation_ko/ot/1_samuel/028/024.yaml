base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/024.yaml
  text: Now the woman had a fattened calf in the house[a], and she hurried and slaughtered it. Then she took flour, kneaded it[c][b], and baked unleavened bread.
  footnotes:
  - marker: a
    text: Or 'stall-fed calf' or traditionally 'fatted calf.'
    reason: lexical_alternative
  - marker: b
    text: The verb can be used for sacrificial slaughter in some contexts, but here it refers to butchering the animal for a meal.
    reason: lexical_alternative
  - marker: c
    text: Or 'unleavened cakes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여자는 집에 살진 송아지[a]가 있었는데, 급히 그것을 잡아 죽였습니다. 그리고 가루를 가져다가 반죽하고[b] 무교병을 구웠습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외양간에서 기른 송아지’, 혹은 전통적으로 ‘살진 송아지’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 동사는 일부 문맥에서 ‘반죽하다’의 뜻으로, 여기서는 음식을 만들기 위해 가루를 반죽한 것을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘무교떡들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵגֶל מַרְבֵּק
  english_pob_choice: fattened calf
  chosen_korean: 살진 송아지
  alternatives_korean:
  - 비육한 송아지
  - 사육한 송아지
  - 살진 송아지(집에서 기른)
  lexicon: HALOT
  rationale: עֵגֶל은 어린 소를 가리키고, מַרְבֵּק은 살이 찐 상태를 뜻하므로, 현대 한국어에서 자연스럽고 구체적인 ‘살진 송아지’가 가장 직접적입니다.
- source_word: וַתְּמַהֵר
  english_pob_choice: she hurried
  chosen_korean: 급히
  alternatives_korean:
  - 서둘러
  - 서둘러서
  - 재빨리
  lexicon: HALOT
  rationale: 서술의 속도를 살리면서도 한국어 문장에 과도한 반복을 피하기 위해 부사 ‘급히’로 옮겼습니다.
- source_word: וַתִּזְבָּחֵהוּ
  english_pob_choice: slaughtered it
  chosen_korean: 잡아 죽였습니다
  alternatives_korean:
  - 도살했습니다
  - 잡아 죽여 제물로 바쳤습니다
  - 잡아 죽였습니다
  lexicon: HALOT
  rationale: 문맥상 제의적 ‘제사’가 아니라 식사용 준비이므로, 희생 제물의 뉘앙스를 피하면서 도축 행위를 드러내는 표현을 택했습니다.
- source_word: מַצּוֹת
  english_pob_choice: unleavened bread
  chosen_korean: 무교병
  alternatives_korean:
  - 누룩 없는 떡
  - 무교빵
  - 무교병
  lexicon: HALOT
  rationale: 히브리어의 절기·식사 맥락을 살리기 위해 교회 전통 용어인 ‘무교병’을 유지하되, ‘구웠습니다’와 결합해 의미가 드러나도록 했습니다.
theological_decisions:
- issue: וַתִּזְבָּחֵהוּ의 제의적 용례 가능성
  chosen_reading: 여기서는 예배 제사가 아니라 식사를 위한 도축으로 이해해 ‘잡아 죽였습니다’로 옮겼습니다.
  alternative_readings:
  - 제사했습니다
  - 희생시켰습니다
  rationale: 본문의 바로 뒤 문맥이 음식 준비이며, English POB도 sacrificial overtones를 피했습니다. 따라서 제의화하지 않는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 서사 문맥 우선 원칙; 제의어의 비제의적 용법 구분
