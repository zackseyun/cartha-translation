revisions:
- from: 이제는 청하오니, 당신도 당신 여종의 목소리를 들으시고, 제가 당신 앞에 빵 한 조각을 차려 놓게 하십시오. 드시고, 당신 안에 힘이 나게 하십시오. 당신은 길을 가셔야 하기 때문입니다.[a][b][c]
  to: 이제 부디, 당신도 당신 여종의 말을 들어 주시고[a][b], 제가 빵 한 조각을 당신 앞에 차려 놓게 해 주십시오[c]. 드시고 힘을 얻으십시오. 길을 가셔야 하기 때문입니다.
  rationale: The revision corrects the result clause concerning strength, updates the idiomatic appeal to natural modern formal-polite Korean, and repairs the inaccurate explanatory footnote. It retains the Hebrew’s emphasis that Saul too should heed her, her gendered self-designation as a female servant, the cohortative request to set bread before him, and the reason that he must continue on his journey.
  reviewer_model: gpt-5.6-terra
