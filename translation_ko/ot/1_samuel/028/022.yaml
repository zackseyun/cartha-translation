id: 1SA.28.22
reference: 1 Samuel 28:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁמַֽע נָ֤א גַם אַתָּה֙ בְּ/ק֣וֹל שִׁפְחָתֶ֔/ךָ וְ/אָשִׂ֧מָה לְ/פָנֶ֛י/ךָ פַּת לֶ֖חֶם וֶ/אֱכ֑וֹל וִ/יהִ֤י בְ/ךָ֙ כֹּ֔חַ כִּ֥י תֵלֵ֖ךְ בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/022.yaml
  text: Now then[a], please listen, you also, to the voice of your female servant, and let me set a piece of bread before you. Eat, so that there may be strength in you[c][b], because you must go on your way.
  footnotes:
  - marker: a
    text: Or 'maidservant.' The Hebrew specifically uses a feminine term for servant.
    reason: lexical_alternative
  - marker: b
    text: Literally 'listen to the voice of your female servant,' a Hebrew idiom meaning 'heed your female servant.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a morsel of bread.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 부디, 당신도 당신 여종의 말을 들어 주시고[a][b], 제가 빵 한 조각을 당신 앞에 차려 놓게 해 주십시오[c]. 드시고 힘을 얻으십시오. 길을 가셔야 하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여성형 명사 שִׁפְחָה를 사용하므로, 일반적인 ‘종’보다 ‘여종’이 더 정확합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신 여종의 목소리를 들으십시오’입니다. 이는 ‘여종의 말을 들어 주십시오’ 또는 ‘여종의 말을 따르십시오’라는 뜻의 히브리어 관용 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: פַּת לֶחֶם은 문자적으로 ‘빵 한 조각’ 또는 ‘한 입 크기의 빵’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now then
  chosen_korean: 이제는
  alternatives_korean:
  - 이제
  - 그러니 지금
  lexicon: HALOT
  rationale: 담화 전환과 간청의 분위기를 함께 살리기 위해 단순한 '지금'보다 '이제는'을 택했습니다.
- source_word: שְׁמַע נָא
  english_pob_choice: please ... listen
  chosen_korean: 청하오니 ... 들으시고
  alternatives_korean:
  - 부디 ... 들으십시오
  - 들어 주십시오
  lexicon: HALOT
  rationale: נָא의 공손한 요청을 현대 합쇼체로 옮기되, 문맥상 간절한 청원이라는 점을 살려 '청하오니'를 썼습니다.
- source_word: בְּקוֹל שִׁפְחָתֶךָ
  english_pob_choice: to the voice of your female servant
  chosen_korean: 당신 여종의 목소리를
  alternatives_korean:
  - 당신의 여종의 목소리를
  - 당신의 종의 말을
  - 당신의 여종의 말에
  lexicon: HALOT
  rationale: שִׁפְחָה의 여성형을 살려 '여종'으로 옮겼고, '목소리를 듣다'는 히브리어 관용을 따라 '말을'로 풀기보다 원문 이미지를 유지했습니다.
- source_word: פַּת לֶחֶם
  english_pob_choice: a piece of bread
  chosen_korean: 빵 한 조각
  alternatives_korean:
  - 빵 한 조각
  - 한 입의 빵
  - 빵 한 덩이
  lexicon: HALOT
  rationale: פַּת의 '조각/한 덩어리의 한 부분'이라는 뉘앙스를 자연스러운 현대 한국어로 옮기기 위해 '빵 한 조각'을 선택했습니다.
- source_word: וִיהִי בְךָ כֹּחַ
  english_pob_choice: so that there may be strength in you
  chosen_korean: 당신 안에 힘이 나게 하십시오
  alternatives_korean:
  - 당신 안에 힘이 있게 하십시오
  - 당신에게 힘이 생기게 하십시오
  - 당신 안에 힘이 있도록 하십시오
  lexicon: HALOT
  rationale: 결과/목적을 나타내는 문맥을 살리면서도 한국어로 자연스럽게 들리도록, 직역적 '힘이 있게'보다 '힘이 나게'로 다듬었습니다.
- source_word: כִּי תֵלֵךְ בַּדָּרֶךְ
  english_pob_choice: because you must go on your way
  chosen_korean: 당신은 길을 가셔야 하기 때문입니다
  alternatives_korean:
  - 당신은 길을 가야 하기 때문입니다
  - 당신은 가셔야 하기 때문입니다
  - 당신이 길을 떠나야 하기 때문입니다
  lexicon: HALOT
  rationale: 문맥상 당장 떠나야 하는 실제 이동을 가리키므로, 관용적 '길을 가다'를 쓰되 필요성은 '가셔야 하기 때문입니다'로 표현했습니다.
