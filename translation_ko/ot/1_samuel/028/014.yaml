  source_fidelity: 수정이 필요합니다. אִישׁ זָקֵן의 남성 지시가 초안의 ‘늙은 사람’에서는 약화되었고, וַיִּקֹּד ... וַיִּשְׁתָּחוּ의 연속된 두 동작도 하나로 압축되어 있습니다. 또한 כִּי שְׁמוּאֵל הוּא는 ‘그가 사무엘인 줄’로 옮기는 편이 히브리어의 남성 지시와 식별 내용을 더 정확히 보존합니다.
  naturalness: ‘나이 든 남자’, ‘겉옷을 두르고 있습니다’, ‘얼굴을 땅으로 향하여 몸을 굽히고 엎드렸습니다’는 현대 표준어 합쇼체에서 자연스럽습니다. ‘그녀’는 문맥상 가능하지만 한국어 서사에서는 ‘그 여자’가 더 자연스러울 수 있으나, 본문만으로 신분을 덧붙이지 않기 위해 ‘그 여자’를 사용했습니다.
  terminology: מְעִיל은 문맥상 ‘겉옷’으로 적절하며, עֹטֶה의 두르는 뉘앙스를 보존합니다. שׁחה는 ‘경배하다’로 신학적으로 확정하지 않고 ‘엎드렸습니다’로 옮겨 신체 동작과 문맥상 모호성을 유지했습니다.
