source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַֽה תָּאֳר֔/וֹ וַ/תֹּ֗אמֶר אִ֤ישׁ זָקֵן֙ עֹלֶ֔ה וְ/ה֥וּא עֹטֶ֖ה מְעִ֑יל וַ/יֵּ֤דַע שָׁאוּל֙ כִּֽי שְׁמוּאֵ֣ל ה֔וּא וַ/יִּקֹּ֥ד אַפַּ֛יִם אַ֖רְצָ/ה וַ/יִּשְׁתָּֽחוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/014.yaml
  text: He said to her[a], “What is his appearance?” And she said, “An old man is coming up, and he is wrapped in a robe.” Then Saul knew that it was Samuel[c][b], and he bowed with his face to the ground and prostrated himself.
  footnotes:
  - marker: a
    text: Or 'is ascending' / 'is rising up.' The Hebrew participle emphasizes upward movement.
    reason: lexical_alternative
  - marker: b
    text: Or 'is wearing a robe.' The Hebrew more vividly suggests being wrapped or cloaked in it.
    reason: lexical_alternative
  - marker: c
    text: The final verb can also be rendered 'bowed down' or, in some contexts, 'worshiped'; here it denotes an act of deep prostration before the figure identified as Samuel.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 그 여자에게 말했습니다. “그의 모습이 어떻습니까?” 그 여자가 대답했습니다. “나이 든 남자가 올라오고 있습니다.[a] 그는 겉옷을 두르고 있습니다.[b]” 그러자 사울은 그가 사무엘인 줄 알고, 얼굴을 땅으로 향하여 몸을 굽히고 엎드렸습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사는 진행 중인 동작을 나타냅니다. 또는 ‘올라오고 있다’로 옮길 수 있으며, 아래에서 위로 움직이는 뜻을 포함합니다.
    reason: source_note
  - marker: b
    text: 히브리어 עֹטֶה는 단순히 입는 것보다 옷을 둘러 입거나 두르는 모습을 더 강하게 나타냅니다. 또는 ‘겉옷을 입고 있습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 동사는 ‘절하다’, 문맥에 따라 ‘경배하다’로도 옮길 수 있습니다. 여기서는 사무엘로 식별된 인물 앞에서 몸을 깊이 낮추는 동작을 가리킵니다.
    reason: theological_note
lexical_decisions:
- source_word: מַה תָּאֳרוֹ
  english_pob_choice: What is his appearance?
  chosen_korean: 그의 모습이 어떻습니까?
  alternatives_korean:
  - 그의 외모가 어떻습니까?
  - 그의 생김새가 어떻습니까?
  lexicon: HALOT
  rationale: תָּאֳר refers to visible form or appearance. 한국어에서는 ‘모습’이 가장 자연스럽고, 질문의 목적이 인물 식별에 있음을 잘 드러냅니다.
- source_word: אִישׁ זָקֵן
  english_pob_choice: an old man
  chosen_korean: 한 늙은 사람
  alternatives_korean:
  - 한 노인
  - 한 늙은 남자
  - 한 연로한 사람
  lexicon: HALOT
  rationale: 직역은 가능하지만, כאן은 성별을 포함한 인물 묘사이므로 ‘사람’보다 ‘남자’가 더 좁고, ‘노인’은 다소 완곡합니다. ‘늙은 사람’은 מקור의 직접성을 살립니다.
- source_word: עֹלֶה
  english_pob_choice: is coming up
  chosen_korean: 올라오고 있는데
  alternatives_korean:
  - 올라오고 있습니다
  - 올라오고 있더군요
  - 올라오고 있습니다
  lexicon: HALOT
  rationale: 분사는 진행 중인 동작을 나타내므로, 한국어에서는 ‘올라오고 있는데’가 장면의 진행성과 아래에서 위로의 이동을 자연스럽게 반영합니다.
- source_word: עֹטֶה מְעִיל
  english_pob_choice: is wrapped in a robe
  chosen_korean: 겉옷을 두르고 있습니다
  alternatives_korean:
  - 외투를 입고 있습니다
  - 망토를 두르고 있습니다
  - 겉옷에 싸여 있습니다
  lexicon: HALOT
  rationale: עֹטֶה는 단순 착용보다 ‘두르다/휘감다’의 뉘앙스가 강합니다. מְעִיל은 전통적 의미의 예복형 겉옷이므로 ‘겉옷’을 택해 소스의 묘사력을 살렸습니다.
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה וַיִּשְׁתָּחוּ
  english_pob_choice: he bowed with his face to the ground and prostrated himself
  chosen_korean: 얼굴을 땅에 대고 엎드렸습니다
  alternatives_korean:
  - 얼굴을 땅에 대고 절했습니다
  - 얼굴을 땅에 대고 몸을 굽혔습니다
  - 땅에 엎드려 경배했습니다
  lexicon: HALOT
  rationale: 두 동작이 연속되지만 한국어에서는 자연스러운 하나의 관용 표현으로 압축할 수 있습니다. ‘엎드리다’가 두 절동작의 강도를 가장 잘 전달하며, ‘경배’는 예배적 의미를 앞서 확정할 수 있어 피했습니다.
theological_decisions:
- issue: 마지막 동사의 의미를 ‘경배’로 명시할지 여부
  chosen_reading: ‘엎드렸습니다’로 두어 몸의 낮춤을 드러내되, 예배적 판단은 본문에 직접 덧씌우지 않았습니다.
  alternative_readings:
  - 경배했습니다
  - 절했습니다
  - 땅에 엎드려 경배했습니다
  rationale: 히브리어 שׁחה는 문맥에 따라 경배나 단순한 엎드림을 모두 가질 수 있습니다. 이 장면에서는 사울의 극도의 신체적 굴복을 보여 주지만, 그 행위를 곧바로 신학적으로 규정하면 본문의 긴장을 줄일 수 있습니다.
  doctrine_reference: 본문의 긴장 보존
