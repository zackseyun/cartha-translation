  yaml_path: translation/ot/1_samuel/028/013.yaml
  text: The king said to her[a], “Do not be afraid. What do you see?” And the woman said to Saul[b], “I see a divine being coming up from the earth.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''what have you seen?'' The Hebrew verb is formally past/perfect, though the sense may be immediate in context.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew אֱלֹהִים is plural in form and could be rendered 'gods' or, in context, 'a divine being.'
    reason: alternative_reading
translation:
  language: ko
  text: 왕이 그녀에게 말했습니다[a]. “두려워하지 마십시오. 무엇을 보았습니까?” 그 여인이 사울에게 말했습니다[b]. “신적 존재가 땅에서 올라오는 것을 보았습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신이 본 것은 무엇입니까?’에 가깝고, 완료형을 써도 문맥상 현재의 환시 상황을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אֱלֹהִים은 형태상 복수이며, 문맥에 따라 ‘신들’ 또는 ‘신적 존재’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕이
  alternatives_korean:
  - 그 왕이
  - 사울 왕이
  lexicon: HALOT
  rationale: 히브리어는 고유명사보다 관사 있는 보통명사로 말하므로, ‘왕이’로 두어 서술의 기본 형태를 살렸습니다.
- source_word: אַל תִּירְאִי
  english_pob_choice: Do not be afraid
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
