translation:
  language: ko
  text: 왕이 그녀에게 말했습니다. “두려워하지 마십시오. 무엇을 보았습니까?”[a] 그 여인이 사울에게 말했습니다. “신적 존재가 땅에서 올라오는 것을 보았습니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신이 본 것은 무엇입니까?’에 가깝고, 완료형을 써도 문맥상 현재의 환시 상황을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אֱלֹהִים은 형태상 복수이며, 문맥에 따라 ‘신들’ 또는 ‘신적 존재’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕이
  alternatives_korean:
  - 그 왕이
  - 사울 왕이
  lexicon: HALOT
  rationale: 히브리어는 고유명사보다 관사 있는 보통명사로 말하므로, ‘왕이’로 두어 서술의 기본 형태를 살렸습니다.
- source_word: אַל תִּירְאִי
  english_pob_choice: Do not be afraid
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 마십시오
  lexicon: HALOT
  rationale: 부정 명령형 ירא의 의미를 현대 한국어의 자연스러운 금지 표현으로 옮겼습니다.
- source_word: אֱלֹהִים
  english_pob_choice: a divine being
  chosen_korean: 신적 존재가
  alternatives_korean:
  - 하나님이
  - 신들이
  - 신적 존재들
  lexicon: HALOT
  rationale: 형태는 복수지만 문맥상 여인이 본 초자연적 현상을 말하므로, 다신론적 ‘신들’도, 하나님 동일시도 피하는 중립적 표현을 택했습니다.
- source_word: עֹלִים מִן הָאָרֶץ
  english_pob_choice: coming up from the earth
  chosen_korean: 땅에서 올라오는
  alternatives_korean:
  - 땅에서 올라오는 중인
  - 땅에서 솟아나는
  lexicon: HALOT
  rationale: 올라오는 동작과 지하에서 솟아오르는 장면을 함께 살리되, 한국어에서 가장 자연스러운 현재 진행형으로 정리했습니다.
theological_decisions:
- issue: אֱלֹהִים의 의미를 어떻게 처리할지
  chosen_reading: ‘신적 존재’로 옮겨, 본문이 전하는 초자연적 인식은 살리되 ‘신들’이나 ‘하나님’으로 특정하지 않았습니다.
  alternative_readings:
  - 신들
  - 하나님
  - 영적 존재
  rationale: 이 절은 서술자의 교리 진술이 아니라 여인의 보고이므로, 히브리어의 모호성과 긴장을 보존하는 번역이 적절합니다.
  doctrine_reference: 해석적 중립성 유지
