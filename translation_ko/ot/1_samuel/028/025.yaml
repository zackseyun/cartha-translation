  text: Then she brought it before Saul and before his servants[a], and they ate. Then they rose and went away that night.
  footnotes:
  - marker: a
    text: 'Hebrew literally, ''she brought [it] before Saul and before his servants.'' The object is implied from the previous context: the prepared meal.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그녀가 사울 앞과 그의 종들 앞에 그것을 내놓았고, 그들은 먹었습니다. 그러고 나서 그들은 그날 밤에 일어나 떠났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘사울 앞과 그의 종들 앞에’입니다. 여기서는 앞 문맥에 나온 준비된 음식이 생략되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ לִפְנֵי
  english_pob_choice: Then she brought it before
  chosen_korean: 그녀가 ... 앞에 그것을 내놓았고
  alternatives_korean:
  - 그녀가 ... 앞에 그것을 가져다 놓았고
  - 그녀가 ... 앞에 그것을 차려 놓았고
  lexicon: HALOT
  rationale: נגשׁ의 사역적 뉘앙스를 살려 음식을 손님들 앞에 ‘내놓다’로 옮겼습니다. 한국어에서 식사 장면에 자연스럽고, ‘앞에’는 לִפְנֵי의 공간적 의미를 유지합니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들
  alternatives_korean:
  - 그의 하인들
  - 그의 시종들
  lexicon: HALOT
  rationale: עבד는 문맥상 신분이 강하게 규정된 ‘노예’보다, 왕을 수행하는 사람들을 가리키는 기본값인 ‘종’이 가장 무난합니다. ‘시종들’도 가능하지만 원어의 넓은 범위를 조금 더 직접적으로 반영하는 표현을 택했습니다.
- source_word: וַיֹּאכֵלוּ
  english_pob_choice: and they ate
  chosen_korean: 그들은 먹었습니다
  alternatives_korean:
  - 그들은 그것을 먹었습니다
  - 그들이 먹었습니다
  lexicon: HALOT
  rationale: 동사의 핵심은 단순한 식사 행위이므로 한국어에서는 자연스럽게 목적어를 드러내지 않았습니다. 앞선 문맥에서 음식이 이미 분명하므로 과도한 반복을 피했습니다.
- source_word: וַיָּקֻמוּ וַיֵּלְכוּ
  english_pob_choice: Then they rose and went away
  chosen_korean: 그들은 일어나 떠났습니다
  alternatives_korean:
  - 그들은 일어나 갔습니다
  - 그들은 일어나서 떠났습니다
  lexicon: HALOT
  rationale: 연속 동작을 한국어의 자연스러운 서술로 압축하되, ‘떠났습니다’로 이들의 퇴장을 분명히 했습니다. ‘rose’의 문자성은 ‘일어나’로 유지했습니다.
- source_word: בַּלַּיְלָה הַהוּא
  english_pob_choice: that night
  chosen_korean: 그날 밤에
  alternatives_korean:
  - 그 밤에
  - 그 밤
  lexicon: HALOT
  rationale: 히브리어의 시간 부사구를 현대 한국어에서 자연스러운 ‘그날 밤에’로 옮겼습니다. ‘그날’은 바로 앞 사건과의 긴밀한 연결을 살려 줍니다.
