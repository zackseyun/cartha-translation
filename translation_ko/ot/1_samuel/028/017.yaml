reference: 1 Samuel 28:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ יְהוָה֙ ל֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר בְּ/יָדִ֑/י וַ/יִּקְרַ֨ע יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ מִ/יָּדֶ֔/ךָ וַֽ/יִּתְּנָ֖/הּ לְ/רֵעֲ/ךָ֥ לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/017.yaml
  text: 'And Yahweh has done for you just as he spoke by my hand: Yahweh has torn the kingdom out of your hand and given it to your neighbor[b][a], to David.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''has done for himself.'' Many translations read ''has done to you'' or ''for you,'' smoothing the sense toward Saul; the Masoretic Text here reads ''for him/for himself.'''
    reason: alternative_reading
  - marker: b
    text: Or 'just as he spoke through me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 내 손을 통해 말씀하신 대로[b] 그 자신을 위하여[a] 행하셨습니다. 야훼께서 왕국을 당신의 손에서 찢어 내어 당신의 이웃, 곧 다윗에게 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 לוֹ를 읽습니다. 이는 직역하면 ‘그를 위하여’ 또는 ‘그에게’이며, 문맥상 ‘그 자신을 위하여’로도 이해될 수 있습니다. 많은 번역본은 문맥에 따라 ‘당신을 위하여’ 또는 ‘당신에게’로 옮깁니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내 손으로 말씀하신 대로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC/HALOT
  rationale: 프로젝트 기본값에 따라 언약명 YHWH를 학술적으로 음역해 야훼로 옮겼습니다.
- source_word: וַיַּעַשׂ ... לוֹ
  english_pob_choice: has done for himself
  chosen_korean: 당신을 위해 행하셨습니다
  alternatives_korean:
  - 그를 위해 행하셨습니다
  - 그에게 행하셨습니다
  - 자기 자신을 위해 행하셨습니다
  lexicon: HALOT
  rationale: 영어 POB는 MT의 לוֹ를 매우 문자적으로 반영하지만, 한국어에서는 그 표현이 오해를 낳기 쉬워 주어진 문맥에서 사울에게 향한 결과를 드러내는 방향으로 옮겼습니다. 다만 본문 각주로 MT의 직접적인 ‘그를 위해/자기 자신을 위해’ 가능성을 보존합니다.
- source_word: כַּאֲשֶׁר דִּבֶּר בְּיָדִי
  english_pob_choice: just as he spoke by my hand
  chosen_korean: 그가 내 손으로 말씀하신 대로
  alternatives_korean:
  - 내 손을 통해 말씀하신 대로
  - 내 손을 빌려 말씀하신 대로
  lexicon: HALOT
  rationale: ‘손’은 행위·중개를 나타내는 히브리어 관용구이므로, 직역을 지나치게 어색하지 않게 하면서도 예언적 매개를 살렸습니다.
- source_word: לְרֵעֲךָ
  english_pob_choice: to your neighbor
  chosen_korean: 당신의 이웃인
  alternatives_korean:
  - 당신의 친구인
  - 당신의 동료인
  - 당신의 가까운 사람인
  lexicon: HALOT
  rationale: רֵעַ의 기본 의미를 살려 ‘이웃’으로 옮기고, 바로 뒤의 ‘다윗’과의 동격을 분명히 하기 위해 연결어구로 처리했습니다.
theological_decisions:
- issue: MT לוֹ의 해석을 한국어 본문에서 어떻게 드러낼 것인가
  chosen_reading: 문맥 의미를 따라 사울에게 향한 결과를 본문에 자연스럽게 반영하되, 각주로 MT의 문자적 형태가 남는다는 점을 밝혔습니다.
  alternative_readings:
  - ‘그를 위해 행하셨습니다’
  - ‘자기 자신을 위해 행하셨습니다’
  rationale: 히브리어 본문 자체는 לוֹ를 갖고 있어 직역하면 불완전하게 들리지만, 독자가 본문 의미를 이해하도록 하면서도 원문 독법의 긴장을 지우지 않기 위해 한국어 본문과 각주를 병행했습니다.
  doctrine_reference: Translation philosophy §1, §3
