  yaml_path: translation/ot/1_samuel/028/016.yaml
  text: And Samuel said[a], “Why then do you ask me, since Yahweh has turned away from you and has become your adversary?”
  footnotes:
  - marker: a
    text: Or “has become your adversary.”
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘이 말했습니다. 「그런데 왜 나에게 묻습니까? 야훼께서 당신에게서 돌아서시고 당신의 대적[a]이 되셨습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘적’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל
  english_pob_choice: And Samuel said
  chosen_korean: 사무엘이 말했습니다
  alternatives_korean:
  - 사무엘이 말하였습니다
  - 사무엘이 대답했습니다
  lexicon: HALOT
  rationale: 서술 전개의 waw-consecutive를 한국어 자연어로 풀어 옮기되, 대화 도입의 직설성을 유지했습니다.
- source_word: וְלָמָּה
  english_pob_choice: Why then
  chosen_korean: 그런데 왜
  alternatives_korean:
  - 왜 그러면
  - 왜 그렇다면
  lexicon: HALOT
  rationale: 문맥상 따지는 반문이므로 단순한 ‘왜’보다 연결어가 살아 있는 ‘그런데 왜’가 히브리어의 반박 뉘앙스를 더 잘 드러냅니다.
- source_word: סָר מֵעָלֶיךָ
  english_pob_choice: has turned away from you
  chosen_korean: 당신에게서 돌아서시고
  alternatives_korean:
  - 당신에게서 떠나시고
  - 당신에게서 물러나시고
  lexicon: HALOT
  rationale: סור의 관계적 이탈을 ‘돌아서다’로 옮겨, 단순한 공간 이동보다 여호와와 사울 사이의 관계 단절을 드러냈습니다.
- source_word: וַיְהִי עָרֶךָ
  english_pob_choice: has become your adversary
  chosen_korean: 당신의 대적이 되셨습니다
  alternatives_korean:
  - 당신의 적이 되셨습니다
  - 당신의 적대자가 되셨습니다
  lexicon: HALOT
  rationale: עָר는 단순한 불편함이 아니라 적대하는 상대를 뜻하므로, 합쇼체 안에서 비교적 직역에 가까운 ‘대적’으로 유지했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명사 표기를 인격적 이름으로 보존하기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → Yahweh
- issue: 여호와의 사울에 대한 상태 표현
  chosen_reading: 당신의 대적이 되셨습니다
  alternative_readings:
  - 당신의 적이 되셨습니다
  - 당신의 원수가 되셨습니다
  rationale: 히브리어 עָר의 강한 대립성을 약화시키지 않기 위해, 관계적·법정적 적대감을 함께 담는 ‘대적’을 택했습니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
