  source_fidelity: ‘엎드렸고’는 וַיִּפֹּל(‘쓰러지다/넘어지다’)보다 의도적인 엎드림을 연상시킬 수 있으므로 ‘쓰러졌습니다’로 고치는 편이 원문에 더 가깝습니다. מְלֹא קוֹמָתוֹ는 온몸이 길게 땅에 닿는 모습을 나타내므로 이를 본문에서 보존했습니다. לֶחֶם은 기본적으로 빵이지만 문맥상 음식 일반을 가리킬 수도 있어, 본문은 ‘빵’으로 옮기고 각주에서 그 가능성을 밝혔습니다.
  naturalness: 현대 표준 한국어 합쇼체에서 ‘땅에 엎드렸고’보다 ‘땅에 온몸을 길게 뻗은 채 쓰러졌습니다’가 갑작스러운 سقوط의 서술에 더 자연스럽고 오해가 적습니다. ‘떡’은 현대 한국어에서 주로 쌀떡을 뜻하므로 여기에는 적절하지 않습니다.
  terminology: 인명 ‘사울’, ‘사무엘’은 적절합니다. לֶחֶם에는 현대어 ‘빵’을 사용하되, 원어의 음식 일반 의미 가능성은 각주로 보존합니다.
