translation:
  language: ko
  text: 사울은 곧바로 땅에 온몸을 길게 뻗은 채 쓰러졌고[a], 사무엘의 말 때문에 크게 두려워했습니다. 또한 그에게는 힘이 없었습니다. 그날과 그 밤 내내 빵을 먹지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
