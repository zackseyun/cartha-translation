  text: Saul immediately fell full length to the ground[a], and he was very afraid because of Samuel’s words. There was no strength in him either, because he had eaten no bread all that day and all that night.
  footnotes:
  - marker: a
    text: Hebrew 'bread' can also function more broadly for 'food'; the translation keeps 'bread' to reflect the source wording.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울은 곧바로 몸을 길게 뻗은 채 땅에 엎드렸고[a], 사무엘의 말 때문에 크게 두려워했습니다. 그에게는 힘도 없었습니다. 그날과 그 밤 내내 떡을 먹지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “키의 온전한 길이만큼”이라는 뜻으로, 완전히 길게 쓰러졌다는 의미입니다.
    reason: source_note
