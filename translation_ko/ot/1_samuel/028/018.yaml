id: 1SA.28.18
reference: 1 Samuel 28:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר לֹֽא שָׁמַ֨עְתָּ֙ בְּ/ק֣וֹל יְהוָ֔ה וְ/לֹֽא עָשִׂ֥יתָ חֲרוֹן אַפּ֖/וֹ בַּ/עֲמָלֵ֑ק עַל כֵּן֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה עָשָֽׂה לְ/ךָ֥ יְהוָ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/018.yaml
  text: Because you did not obey the voice of Yahweh and did not carry out his burning anger against Amalek[a], therefore Yahweh has done this thing to you today.
  footnotes:
  - marker: a
    text: Or 'did not execute his fierce anger against Amalek.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 야훼의 목소리에 순종하지 않고 아말렉에게 그분의 타오르는 분노를 내리지 않았으므로,[a] 야훼께서 오늘 이 일을 네게 행하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘맹렬한 분노’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא שָׁמַעְתָּ בְּקוֹל יְהוָה
  english_pob_choice: did not obey the voice of Yahweh
  chosen_korean: 야훼의 목소리를 듣지 않고
  alternatives_korean:
  - 야훼의 말씀에 순종하지 않고
  - 야훼의 음성을 듣지 않고
  lexicon: HALOT
  rationale: שׁמע בְּקוֹל은 단순 청취가 아니라 권위에 대한 순종을 뜻하지만, 한국어에서는 '목소리를 듣다'를 유지하면서 앞뒤 문맥이 순종의 불복종임을 드러내는 방식이 자연스럽습니다.
- source_word: חֲרוֹן אַפּוֹ
  english_pob_choice: his burning anger
  chosen_korean: 그의 타오르는 분노
  alternatives_korean:
  - 그의 맹렬한 분노
  - 그의 불타는 분노
  lexicon: HALOT
  rationale: חֲרוֹן אַף의 불/열 감각을 살리기 위해 '타오르는'을 택했습니다. POB의 'burning anger'와 같은 이미지적 긴장을 한국어에서도 보존합니다.
- source_word: עַל־עֲמָלֵק
  english_pob_choice: against Amalek
  chosen_korean: 아말렉에 대하여
  alternatives_korean:
  - 아말렉을 향하여
  - 아말렉을 상대로
  lexicon: HALOT
  rationale: 앞절의 '분노를 실행하다'와 결합될 때 전치사 עַל은 대상 표지를 나타내므로, 한국어에서는 '대하여'로 옮겨 행위의 방향성을 분명히 했습니다.
- source_word: עָשָׂה לְךָ יְהוָה הַיּוֹם הַזֶּה
  english_pob_choice: Yahweh has done this thing to you today
  chosen_korean: 야훼께서 오늘 이 일을 네게 행하셨습니다
  alternatives_korean:
  - 야훼께서 오늘 이것을 네게 하셨습니다
  - 야훼께서 오늘 이 일을 네게 이루셨습니다
  lexicon: HALOT
  rationale: עשה는 여기서 결과를 가져온 행위로서 '행하다'가 가장 직접적이며, '오늘 이 일'은 히브리어 דבר־הזה의 지시성을 보존합니다.
theological_decisions:
- issue: YHWH의 음역과 왕권적 심판 문맥
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה는 고유명사이므로 POB 원칙에 따라 '야훼'를 유지했습니다. 사울의 불순종에 대한 심판 선언이라는 문맥에서도 호칭이 아니라 언약 이름이 전면에 나와야 합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘분노’ 표현의 이미지 보존
  chosen_reading: 타오르는 분노
  alternative_readings:
  - 맹렬한 분노
  - 불타는 진노
  rationale: POB의 'burning anger'가 반영한 열/불의 이미지를 한국어에서도 살려, 추상적인 '진노'보다 감각적인 '타오르는 분노'를 택했습니다.
  doctrine_reference: source-text lexical tension
