  source_fidelity: ‘야훼의 목소리를 듣지 않고’는 히브리어 שׁמע בְּקוֹל의 문맥상 의미인 ‘순종하다’를 충분히 드러내지 못합니다. 또한 ‘분노를 실행하다’는 한국어 결합이 부자연스럽습니다. ‘목소리에 순종하지 않고’와 ‘분노를 … 내리지 않고’는 불순종 및 아말렉을 향한 심판 집행의 의미를 자연스럽게 보존합니다.
  naturalness: 현행 문장은 합쇼체 종결은 적절하지만 ‘목소리를 듣지 않고’, ‘타오르는 분노를 실행하지’가 현대 표준 한국어에서 다소 직역투입니다. 수정문은 현대적 정중 문체를 유지하면서도 자연스럽습니다.
  terminology: יַהוֶה는 POB 방침대로 ‘야훼’로 유지합니다. חֲרוֹן אַף의 열기 이미지는 ‘타오르는 분노’로 보존하고, 대안 독법은 각주에서 ‘맹렬한 분노’로 제시합니다. ‘행하셨습니다’는 본문의 עָשָׂה와 ‘이 일’을 보존합니다.
