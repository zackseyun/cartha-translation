  to: 네가 야훼의 목소리에 순종하지 않고 아말렉에게 그분의 타오르는 분노를 내리지 않았으므로,[a] 야훼께서 오늘 이 일을 네게 행하셨습니다.
  rationale: ‘순종하다’로 שׁמע בְּקוֹל의 언약적·명령적 의미를 명시하고, ‘아말렉에게 … 분노를 내리다’로 עָשָׂה חֲרוֹן אַפּוֹ בַּעֲמָלֵק의 심판 집행 의미를 자연스러운 한국어로 옮겼습니다. ‘타오르는’은 חֲרוֹן의 열기 이미지를 유지하며, 해석상 더 평이한 대안은 각주에 남겼습니다.
