  source_fidelity: 다윗이 가축을 취하고 그것들을 ‘그 가축’ 앞에 몰며 ‘다윗의 전리품’이라고 말한 기본 의미는 대체로 충실합니다. 그러나 ‘다른 가축’은 히브리어의 지시사 ‘그’(הַהוּא)를 본문에서 해석적으로 확정하므로, 본문에서는 지시의 모호성을 보존하고 주석에서 가능한 문맥적 이해를 제시하는 편이 더 적절합니다.
  naturalness: ‘그들은 그것들을 그 가축 앞에 몰고 가면서 말했습니다’는 현대 표준 한국어의 자연스러운 서술이며, 원문의 연속 동작을 잘 나타냅니다. ‘차지했습니다’는 이 문맥에서 ‘가져갔습니다’보다 전리품으로 취득했다는 뜻을 더 자연스럽게 전달합니다.
