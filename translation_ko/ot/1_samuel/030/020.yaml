reference: 1 Samuel 30:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח דָּוִ֔ד אֶת כָּל הַ/צֹּ֖אן וְ/הַ/בָּקָ֑ר נָהֲג֗וּ לִ/פְנֵי֙ הַ/מִּקְנֶ֣ה הַ/ה֔וּא וַ/יֹּ֣אמְר֔וּ זֶ֖ה שְׁלַ֥ל דָּוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/020.yaml
  text: David took all the flocks and the herds[a]. They drove them ahead of the other livestock, and said[b], “This is David’s spoil.”
  footnotes:
  - marker: a
    text: Or “This is David’s plunder.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew likely means that the animals just taken were driven in front of the previously recovered livestock as a public display, while the people declared them to be David’s spoil.
    reason: cultural_note
translation:
  language: ko
  text: 다윗은 양 떼와 소 떼를 모두 차지했습니다. 그들은 그것들을 그 가축 앞에 몰고 가면서 말했습니다[b]. “이것은 다윗의 전리품입니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이것은 다윗의 약탈물입니다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 아마도 새로 얻은 가축을 이전에 회수한 가축 앞에 몰아 공개적으로 보이게 하면서, 사람들이 그것을 다윗의 전리품이라고 선언한 장면을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 가져갔습니다
  alternatives_korean:
  - 취했습니다
  - 빼앗았습니다
  lexicon: WLC/HALOT
  rationale: 서술맥락에서 단순한 취득을 나타내므로, 과도한 강압을 암시하는 ‘빼앗다’보다 중립적인 ‘가져가다’가 원문의 의미를 잘 살립니다.
- source_word: הַצֹּאן וְהַבָּקָר
  english_pob_choice: the flocks and the herds
  chosen_korean: 양 떼와 소 떼
  alternatives_korean:
  - 양과 소
  - 작은 가축과 큰 가축
  lexicon: HALOT
  rationale: צאן과 בקר의 두 범주를 자연스러운 한국어 짝으로 살리되, 문맥상 가축의 집합을 뜻하는 표현으로 옮겼습니다.
- source_word: נָהֲגוּ לִפְנֵי הַמִּקְנֶה הַהוּא
  english_pob_choice: they drove them ahead of the other livestock
  chosen_korean: 그들은 그것들을 다른 가축 앞에 몰고 가며
  alternatives_korean:
  - 그들은 그것들을 그 가축 앞에 몰고 가며
  - 그들은 그것들을 다른 가축보다 앞서 몰아가며
  lexicon: HALOT
  rationale: נהג는 가축을 ‘몰다’는 뜻이므로 이를 유지했고, לִפְנֵי는 이동 장면에 맞게 ‘앞에’로 옮겼습니다. ‘다른 가축’은 기존에 회수된 가축과 새로 얻은 것을 구별하는 문맥을 반영합니다.
- source_word: שְׁלַל דָּוִד
  english_pob_choice: David’s spoil
  chosen_korean: 다윗의 전리품
  alternatives_korean:
  - 다윗의 노획물
  - 다윗의 약탈물
  lexicon: HALOT
  rationale: שָׁלָל은 전쟁이나 습격에서 얻은 전리품/노획물을 가리키므로, 현대 독자가 바로 이해할 수 있는 ‘전리품’이 가장 적절합니다.
theological_decisions:
- issue: 공개적 귀속 선언의 뉘앙스
  chosen_reading: “이것은 다윗의 전리품입니다.”로 옮겨, 단순 소유 진술이 아니라 전리품의 공개적 귀속 선언임을 살렸습니다.
  alternative_readings:
  - “이것은 다윗의 것입니다.”
  - “다윗이 차지한 것입니다.”
  rationale: 본문은 단순한 소유보다 যুদ্ধ/습격의 전리품이라는 법적·사회적 귀속을 강조하므로, 그 뉘앙스를 유지했습니다.
  doctrine_reference: 본문의 역사 서술과 전리품 개념
- issue: ‘다른 가축 앞에’의 의미
  chosen_reading: 가축을 앞세워 몰아가는 공개적 행렬로 이해했습니다.
  alternative_readings:
  - 단순한 이동 순서 표시
  - 비유적 표현
  rationale: 영문 POB 주석이 밝히듯, 새로 얻은 가축을 이전에 회수한 가축보다 앞세워 보여 주는 장면으로 읽는 것이 문맥상 가장 자연스럽습니다.
  doctrine_reference: 문맥 주해
