base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/021.yaml
  text: David came to the two hundred men who had become too exhausted to follow after David[a], and whom they had left at the Brook Besor. They came out to meet David and to meet the people who were with him[b], and David approached the people and asked them how they were.
  footnotes:
  - marker: a
    text: Or 'asked them about their welfare.' The Hebrew idiom literally refers to asking concerning peace/well-being.
    reason: lexical_alternative
  - marker: b
    text: Or 'had been left behind' / 'were too weary to go on after David' for the clause describing the two hundred men.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 다윗을 따라가기에 너무 지쳐 버린 이백 명의 사람들, 곧 브소르 시내에 남겨 두었던 그들에게 이르렀습니다. 그들은 다윗과 그와 함께한 사람들을 맞으러 나왔고, 다윗은 그 사람들에게 다가가 그들의 안부를 물었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּגְּרוּ מִלֶּכֶת אַחֲרֵי דָוִד
  english_pob_choice: had become too exhausted to follow after David
  chosen_korean: 다윗을 따라가기에 너무 지쳐 버린
  alternatives_korean:
  - 다윗을 따라가다가 지친
  - 다윗을 따라가는 데 지쳐 더는 갈 수 없던
  lexicon: HALOT
  rationale: פִּגְּרוּ는 단순히 뒤처진 것이 아니라 계속 따라갈 수 없을 만큼 기운이 빠진 상태를 가리키므로, 결과 상태를 드러내는 표현으로 옮겼습니다.
- source_word: וַיֹּשִׁיבֻם בְּנַחַל הַבְּשׂוֹר
  english_pob_choice: whom they had left at the Brook Besor
  chosen_korean: 브esor 시내에 남겨 두었던
  alternatives_korean:
  - 브소르 시내에 두었던
  - 브소르 시내에 머물게 했던
  lexicon: HALOT
  rationale: וַיֹּשִׁיבֻם은 그 자리에 머물게 하거나 남겨 두는 뜻이므로, 문맥상 자연스럽고 능동적인 한국어인 '남겨 두었던'으로 옮겼습니다.
- source_word: לִקְרַאת
  english_pob_choice: to meet
  chosen_korean: 맞으러
  alternatives_korean:
  - 마중하러
  - 만나러
  lexicon: HALOT
  rationale: 출격하여 상대를 맞이하는 장면이므로 단순한 '만나러'보다 방향성이 살아 있는 '맞으러'가 적절합니다.
- source_word: שָׁלוֹם
  english_pob_choice: about their welfare
  chosen_korean: 그들의 안부를 물었습니다
  alternatives_korean:
  - 그들의 평안을 물었습니다
  - 그들의 안녕을 물었습니다
  lexicon: HALOT
  rationale: לְשָׁלוֹם은 문자적으로는 평안/안녕을 묻는 관용구이므로, 현대 한국어에서 같은 기능을 하는 '안부를 묻다'로 옮겼습니다.
