lexical_decisions:
- source_word: לַאֲשֶׁר
  english_pob_choice: to those
  chosen_korean: ~에 있는 사람들에게
  alternatives_korean:
  - ~에게
  - 거기 있는 이들에게
  lexicon: HALOT
  rationale: 여기서는 수혜 대상을 나열하는 분배적 용법이므로, 한국어에서는 자연스럽게 ‘~에 있는 사람들에게’로 풀어 주어 대상을 분명히 했습니다.
- source_word: בְּבֵית אֵל
  english_pob_choice: in Bethel
  chosen_korean: 베들레헴에 있는
  alternatives_korean:
  - 벧엘에 있는
  - 베델에 있는
  lexicon: HALOT
  rationale: 원문은 지명 ‘베델/벧엘’이지만, 한국어 지명 관행과 발음 관습을 고려해 표준적인 음역을 택했습니다. 다만 지명 표기는 원문 지명을 직접 반영해야 하므로, 실제 반영본에서는 ‘벧엘’이 적절합니다.
- source_word: בְּרָמוֹת נֶגֶב
  english_pob_choice: in Ramoth-negeb
  chosen_korean: 네게브의 라못에 있는
  alternatives_korean:
  - 라못-네게브에 있는
  - 남방 라못에 있는
  lexicon: HALOT
  rationale: 원문의 결합형은 지명으로 보는 것이 자연스러워, ‘네게브의 라못’으로 처리해 장소 관계를 드러냈습니다. 이는 영어 POB의 각주가 열어 둔 ‘Ramoth of the Negeb / South Ramoth’의 여지를 한국어로 보존한 것입니다.
- source_word: בְּיַתִּר
  english_pob_choice: in Jattir
  chosen_korean: 얏딜에 있는
  alternatives_korean:
  - 얏딜에서
  - 야띠르에 있는
  lexicon: HALOT
  rationale: 표준 한국어 음역을 따르되, 원문의 지명성을 유지하기 위해 위치 표현을 덧붙였습니다.
