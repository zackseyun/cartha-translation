  to: 다윗은 함께 있던 육백 명의 사람들과 가서 브솔 시내[b]에 이르렀습니다. 남은 사람들은 그곳에 머물렀습니다.[a]
  rationale: 동행 표현의 중복을 제거하고, נחל의 의미 범위에 맞게 ‘브솔 시내’로 조정했습니다. 또한 두 각주를 각각 설명 대상인 지명과 동사절에 연결했습니다. ‘남은 사람들’과 ‘머물렀습니다’는 남은 이들이 더 이상 이동하지 않았다는 원문의 문맥상 의미를 유지합니다.
