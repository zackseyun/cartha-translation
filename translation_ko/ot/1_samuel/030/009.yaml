source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ דָּוִ֗ד ה֚וּא וְ/שֵׁשׁ מֵא֥וֹת אִישׁ֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יָּבֹ֖אוּ עַד נַ֣חַל הַ/בְּשׂ֑וֹר וְ/הַ/נּֽוֹתָרִ֖ים עָמָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/009.yaml
  text: So David went[a], he and the six hundred men who were with him, and they came to the Brook Besor[b], where those who were left behind stayed.
  footnotes:
  - marker: a
    text: Or 'the remainder stayed there'; literally, 'the ones remaining stood.'
    reason: lexical_alternative
  - marker: b
    text: '''Brook Besor'' may also be rendered ''Wadi Besor,'' referring to a seasonal streambed or ravine.'
    reason: cultural_note
translation:
  language: ko
  text: 다윗은 함께 있던 육백 명의 사람들과 가서 브솔 시내[b]에 이르렀습니다. 남은 사람들은 그곳에 머물렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘서 있었습니다’이지만, 이 이동 문맥에서는 더 나아가지 않고 그곳에 머문다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘브솔 시내’는 계절성 물길이나 골짜기인 와디를 가리킬 수 있으므로, ‘브솔 와디’로도 옮길 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: So David went
  chosen_korean: 다윗은 … 가서
  alternatives_korean:
  - 다윗이 갔습니다
  - 그러므로 다윗은 갔습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 wayyiqtol로, 한국어에서는 자연스러운 진행형 연결인 ‘가서’가 가장 간결하고 문맥에 맞습니다.
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר אִתּוֹ
  english_pob_choice: he and the six hundred men who were with him
  chosen_korean: 그와 함께 있던 육백 명의 사람들과 함께
  alternatives_korean:
  - 그와 함께 있던 육백 명의 남자들과 함께
  - 그와 육백 명의 사람들이 함께
  lexicon: HALOT
  rationale: 독립 대명사와 동격 구조를 한국어에서 자연스럽게 풀어, 다윗과 동행한 집단을 명확히 드러냈습니다.
- source_word: נַחַל הַבְּשׂוֹר
  english_pob_choice: Brook Besor
  chosen_korean: 브솔 강
  alternatives_korean:
  - 브솔 개천
  - 브솔 와디
  lexicon: HALOT
  rationale: נחל은 하천/개천/와디를 가리킬 수 있으나, 고유지명으로는 ‘브솔 강’이 한국어 독자에게 가장 읽기 쉬우면서도 지리적 실체를 과도하게 특정하지 않습니다.
- source_word: וְהַנּוֹתָרִים עָמָדוּ
  english_pob_choice: where those who were left behind stayed
  chosen_korean: 뒤에 남은 사람들은 머물렀습니다
  alternatives_korean:
  - 남겨진 사람들은 서 있었습니다
  - 남은 자들은 머물러 있었습니다
  lexicon: HALOT
  rationale: ‘남은/뒤에 남은’이 participle의 핵심 뜻을 살리고, ‘서다’의 직역보다 이 이동 문맥에서 의도된 ‘머무르다’가 더 정확합니다.
theological_decisions:
- issue: ‘뒤에 남은 사람들’의 상태를 어떻게 표현할지
  chosen_reading: 이동이 중단되어 그 자리에 머문 상태로 이해해 ‘머물렀습니다’로 옮겼습니다.
  alternative_readings:
  - ‘서 있었습니다’
  - ‘남아 있었습니다’
  rationale: 히브리어 עָמָדוּ의 문자적 의미는 ‘서다’지만, 이 문맥에서는 더 이상 전진하지 않고 멈춘 상태를 가리키므로 의미를 분명히 했습니다.
  doctrine_reference: 서사 문맥의 상식적 의미 전달
