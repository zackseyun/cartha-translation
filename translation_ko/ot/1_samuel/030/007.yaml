source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֗ד אֶל אֶבְיָתָ֤ר הַ/כֹּהֵן֙ בֶּן אֲחִימֶ֔לֶךְ הַגִּֽישָׁ/ה נָּ֥א לִ֖/י הָ/אֵפֹ֑ד וַ/יַּגֵּ֧שׁ אֶבְיָתָ֛ר אֶת הָ/אֵפֹ֖ד אֶל דָּוִֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/007.yaml
  text: Then David said to Abiathar the priest[a], the son of Ahimelech[b], “Please bring me the ephod.” So Abiathar brought the ephod to David.
  footnotes:
  - marker: a
    text: Or 'present to me the ephod.' The Hebrew verb means 'bring near' or 'present.'
    reason: lexical_alternative
  - marker: b
    text: The 'ephod' was a priestly sacred object or garment used in Israel's worship.
    reason: cultural_note
translation:
  language: ko
  text: 다윗이 제사장 아비아달, 곧 아히멜렉의 아들에게 말했습니다. "부디 에봇을 내게 가져오십시오." 아비아달이 다윗에게 에봇을 가져왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "에봇을 내게 가져다주십시오." 히브리어 동사는 '가까이 가져오다' 또는 '제시하다'의 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 에봇은 이스라엘 예배에서 사용된 제사장용 성물 또는 의복이었습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 그때 말했습니다
  lexicon: WLC
  rationale: 서사 진행을 자연스러운 한국어로 살리되, 과도한 부사 없이 단순한 과거 서술로 처리했습니다.
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 사제
  - 신부
  lexicon: WLC
  rationale: 아비아달의 직분을 가리키는 일반적 제의 직함이므로 표준적인 '제사장'을 택했습니다.
- source_word: הַגִּישָׁה נָּא לִי
  english_pob_choice: Please bring me
  chosen_korean: 부디 ... 내게 가져오십시오
  alternatives_korean:
  - 내게 가져오십시오
  - 부디 내게 가져오십시오
  - 내게 제시해 주십시오
  lexicon: WLC
  rationale: הגיש의 '가까이 가져오다/내밀다' 뜻을 살리면서, נָא의 정중한 요청을 한국어 공손 표현으로 옮겼습니다.
- source_word: הָאֵפֹד
  english_pob_choice: the ephod
  chosen_korean: 에봇
  alternatives_korean:
  - 에폿
  - 제사장 의복
  lexicon: WLC
  rationale: 특정한 제의용 물건을 지칭하는 음역어를 유지해 기능을 과도하게 설명하지 않았습니다.
theological_decisions:
- issue: 에봇의 성격을 번역에서 얼마나 설명할 것인가
  chosen_reading: 본문에는 단순히 '에봇'으로 두고, 기능 설명은 본문 밖으로 미뤘습니다.
  alternative_readings:
  - 제사장 예복
  - 거룩한 에봇
  rationale: 이 절 자체는 물건의 명칭을 제시할 뿐이므로, 해석을 앞서기보다 원문의 절제된 표현을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §6
