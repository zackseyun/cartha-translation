reference: 1 Samuel 30:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּכֵּ֥/ם דָּוִ֛ד מֵ/הַ/נֶּ֥שֶׁף וְ/עַד הָ/עֶ֖רֶב לְ/מָֽחֳרָתָ֑/ם וְ/לֹֽא נִמְלַ֤ט מֵ/הֶם֙ אִ֔ישׁ כִּי֩ אִם אַרְבַּ֨ע מֵא֧וֹת אִֽישׁ נַ֛עַר אֲשֶׁר רָכְב֥וּ עַל הַ/גְּמַלִּ֖ים וַ/יָּנֻֽסוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/017.yaml
  text: David struck them down from the twilight until the evening of the next day[a], and not a man of them escaped, except four hundred young men who rode on the camels and fled.
  footnotes:
  - marker: a
    text: Or 'from dawn'; the Hebrew word can refer to twilight at either end of the day. Some take the sense here as morning twilight rather than evening twilight.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 어스름부터 이튿날 저녁까지 그들을 쳐서 쓰러뜨렸습니다[a]. 그들 가운데 한 사람도 빠져나가지 못했습니다. 다만 낙타를 타고 달아난 젊은이 사백 명은 예외였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘새벽부터’로 옮길 수 있습니다. 히브리어 표현은 하루의 양끝 어스름을 가리킬 수 있으며, 여기서는 아침 어스름으로 이해하는 견해도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  english_pob_choice: struck them down
  chosen_korean: 쳐서 쓰러뜨렸습니다
  alternatives_korean:
  - 쳐서 무찔렀습니다
  - 쳐서 넘어뜨렸습니다
  lexicon: HALOT
  rationale: 전투 맥락의 נכה를 단순한 ‘공격하다’보다 강한 타격과 제압을 드러내는 표현으로 옮겼습니다. ‘쓰러뜨리다’는 군사적 패배를 자연스러운 한국어로 살립니다.
- source_word: מֵהַנֶּשֶׁף
  english_pob_choice: from the twilight
  chosen_korean: 해질녘부터
  alternatives_korean:
  - 새벽부터
  - 황혼부터
  lexicon: HALOT
  rationale: נֶשֶׁף은 새벽과 저녁의 어스름을 둘 다 가리킬 수 있어 본문만으로는 양쪽 가능성이 있습니다. 본문 흐름상 저녁 어스름으로 읽는 편이 자연스러워, 의미를 닫지 않으면서도 한국어에서는 ‘해질녘’으로 옮겼습니다.
- source_word: נִמְלַט מֵהֶם אִישׁ
  english_pob_choice: not a man of them escaped
  chosen_korean: 그들 가운데서 한 사람도 도망치지 못했고
  alternatives_korean:
  - 그들 가운데서 한 사람도 빠져나가지 못했고
  - 그들 가운데서 아무도 도망치지 못했고
  lexicon: HALOT
  rationale: 히브리어의 단수 ‘한 사람’이 분배적으로 쓰여 전체 부정을 이룹니다. 이를 살려 ‘한 사람도’로 옮기고, 동사는 ‘도망치다’보다 결과를 분명히 하는 ‘도망치지 못하다’를 택했습니다.
- source_word: אַרְבַּע מֵאוֹת אִישׁ נַעַר
  english_pob_choice: four hundred young men
  chosen_korean: 젊은이 사백 명
  alternatives_korean:
  - 청년 사백 명
  - 젊은 남자 사백 명
  lexicon: HALOT
  rationale: נַעַר는 문맥에 따라 소년, 젊은이, 종 등으로 넓게 쓰이지만, 여기서는 낙타를 타고 달아날 수 있는 전투원입니다. 따라서 어린아이 뉘앙스를 피하면서도 자연스러운 ‘젊은이’로 옮겼습니다.
- source_word: רָכְבוּ עַל הַגְּמַלִּים
  english_pob_choice: rode on the camels
  chosen_korean: 낙타들을 타고
  alternatives_korean:
  - 낙타들 위에 타고
  - 낙타를 타고
  lexicon: HALOT
  rationale: 히브리어의 전치사 ‘~위에’는 한국어에서는 보통 동사 ‘타다’로 자연스럽게 풀립니다. 복수 목적어를 살리기 위해 ‘낙타들을’로 옮겼습니다.
theological_decisions:
- issue: 끝부분의 400명만 남은 진술의 강조
  chosen_reading: ‘한 사람도 도망치지 못했고… 사백 명만 제외되었습니다’로 전체 패배와 예외를 분명히 드러냈습니다.
  alternative_readings:
  - ‘한 사람도 살아남지 못했고’로 더 강하게 표현할 수 있음
  - ‘도망하지 못하고’로 더 직역할 수 있음
  rationale: 본문은 전면적 패주와 예외적 생존을 대비합니다. 한국어에서도 총체적 패배와 제한된 탈출을 분명히 보여 주는 것이 서술 의도를 가장 잘 보존합니다.
  doctrine_reference: 서사적 본문으로서 특별한 교리 쟁점은 없고, 전쟁 서술의 사실성과 강조를 유지하는 문제입니다.
