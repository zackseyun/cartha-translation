    rationale: נֶשֶׁף는 저녁 또는 아침의 어스름을 뜻할 수 있습니다. 영어 감사 기록도 본문에서는 ‘twilight’로 보존하므로, 한국어도 ‘어스름’으로 중립적으로 옮기는 것이 안전합니다.
