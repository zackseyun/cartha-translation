source:
  edition: WLC
  text: וַ/יִּרְדֹּ֣ף דָּוִ֔ד ה֖וּא וְ/אַרְבַּע מֵא֣וֹת אִ֑ישׁ וַ/יַּֽעַמְדוּ֙ מָאתַ֣יִם אִ֔ישׁ אֲשֶׁ֣ר פִּגְּר֔וּ מֵ/עֲבֹ֖ר אֶת נַ֥חַל הַ/בְּשֽׂוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/010.yaml
  text: So David pursued[a], he and four hundred men, while two hundred men stayed behind[b], who were too exhausted to cross the Brook Besor.
  footnotes:
  - marker: a
    text: Or 'who became faint' or 'who lagged behind from exhaustion' for the Hebrew expression.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Brook Besor'; נחל can refer to a brook, wadi, or seasonal streambed.
    reason: cultural_note
translation:
  language: ko
  text: 다윗과 사백 명의 사람이 추격하였고, 이백 명은 브솔 시내[b]를 건너기에는 너무 지쳐서[a] 뒤에 남았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 ‘기진하다’, ‘탈진하다’, 또는 ‘지쳐 뒤처지다’의 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘브솔 시내’; נחל은 시내, 와디, 또는 계절성 하천 바닥을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְדֹּף
  english_pob_choice: pursued
  chosen_korean: 추격하였고
  alternatives_korean:
  - 추적하였고
  - 뒤쫓았고
  lexicon: HALOT
  rationale: רדף는 추격하다/뒤쫓다의 뜻이므로, 군사적 맥락을 살리면서도 현대 문체에 자연스러운 「추격하다」를 택했습니다.
- source_word: הוּא וְאַרְבַּע מֵאוֹת אִישׁ
  english_pob_choice: he and four hundred men
  chosen_korean: 그와 사백 명의 사람들과 함께
  alternatives_korean:
  - 그와 사백 명의 남자들과 함께
  - 그 자신과 사백 명의 사람들과
  lexicon: HALOT
  rationale: הוּא의 강조를 다윗을 앞세운 병행 구조로 살리되, 한국어에서는 「그와 … 함께」가 가장 자연스럽고 문맥에도 맞습니다.
- source_word: וַיַּעַמְדוּ ... מֵעֲבֹר
  english_pob_choice: stayed behind / who were too exhausted to cross
  chosen_korean: 지쳐서 ... 건너지 못하고 뒤에 남았습니다
  alternatives_korean:
  - 머물렀습니다
  - 멈추었습니다
  lexicon: HALOT
  rationale: וַיַּעַמְדוּ와 뒤이은 מֵעֲבֹר의 결합은 단순한 정지가 아니라 탈진으로 인해 더 나아가지 못한 상태이므로, 결과를 드러내는 표현으로 옮겼습니다.
- source_word: נַחַל הַבְּשׂוֹר
  english_pob_choice: the Brook Besor
  chosen_korean: 브솔 시내
  alternatives_korean:
  - 브솔 개천
  - 브솔 와디
  lexicon: HALOT
  rationale: נַחַל은 시내·개천·와디를 가리킬 수 있으므로, 본문 용례에 맞는 지명형 표현으로 「브솔 시내」를 사용했습니다.
