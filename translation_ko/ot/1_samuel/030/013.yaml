  naturalness: 현 문장은 ‘제가 병이 들어 사흘 전부터 나의 주인이 저를 버렸습니다’가 현대 한국어에서 어색하고 의미상 모호합니다. 또한 합쇼체 기준으로 다윗의 질문도 ‘왔습니까?’로 통일하는 편이 자연스럽습니다.
