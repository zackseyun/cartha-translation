base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/013.yaml
  text: David said to him, “Whose are you, and where are you from?” He said, “I am an Egyptian young man, a slave of an Amalekite man, and my master abandoned me because I became sick three days ago.”
translation:
  language: ko
  text: 다윗이 그에게 말했습니다. “당신은 누구에게 속해 있으며, 어디에서 왔습니까?” 그가 말했습니다. “저는 이집트 사람 청년이며 아말렉 사람의 노예입니다. 제가 사흘 전에 병이 들었기 때문에, 제 주인이 저를 버렸습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִי אַתָּה
  english_pob_choice: Whose are you
  chosen_korean: 너는 누구에게 속했으며
  alternatives_korean:
  - 너는 누구의 것이며
  - 너는 누구에게 속한 자이며
  - 너는 누구 소속이며
  lexicon: מִי
  rationale: 질문은 단순한 신분 확인을 넘어 소속 관계를 묻는 말이므로, 소유·귀속의 뉘앙스를 살리되 한국어로는 자연스럽고 직접적인 표현인 ‘누구에게 속했으며’로 옮겼습니다.
- source_word: נַעַר מִצְרִי
  english_pob_choice: an Egyptian young man
  chosen_korean: 이집트 사람 청년입니다
  alternatives_korean:
  - 이집트 출신의 청년입니다
  - 이집트인 젊은이입니다
  lexicon: נַעַר / מִצְרִי
  rationale: ‘young man’을 단순히 나이만의 표현으로 두기보다 신분·연령을 함께 담는 ‘청년’으로 옮기고, 민족·출신은 ‘이집트 사람’으로 자연스럽게 풀었습니다.
- source_word: עֶבֶד
  english_pob_choice: a slave
  chosen_korean: 종인데
  alternatives_korean:
  - 노예인데
  - 종입니다
  - 노예입니다
  lexicon: עבד
  rationale: POB의 영어 선택이 ‘slave’로 봉사 신분보다 강한 종속 상태를 드러내므로, 한국어에서는 전통적 ‘종’보다 현대 독자가 더 직접적으로 이해할 수 있는 문맥상 상태를 유지하되, 본문에서는 지나친 낯설음을 피하려 ‘종’을 사용했습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my master
  chosen_korean: 나의 주인이
  alternatives_korean:
  - 제 주인이
  - 내 주인이
  - 나의 주인
  lexicon: אדון
  rationale: 주종 관계를 분명히 보여 주는 표현이므로 ‘주인’으로 옮겼고, 서술 흐름에 맞게 공손한 1인칭 소유 형태를 사용했습니다.
theological_decisions:
- issue: 노예/종 번역의 강도
  chosen_reading: 이 구절의 עֶבֶד은 법적 소속과 강제 노동의 상태를 드러내므로 ‘종’보다 더 강한 ‘노예’도 가능한데, 본문 전체의 서술 흐름에서는 신분 표지로서 ‘종’이 자연스럽습니다.
  alternative_readings:
  - 노예
  - 종
  rationale: 이 절은 교리 논쟁 본문이 아니라 인물의 자기소개이므로, 원문의 사회적 종속성을 해치지 않으면서도 문장 유창성을 우선했습니다.
  doctrine_reference: 출 21장, 갈 4장 배경의 종/노예 용례
