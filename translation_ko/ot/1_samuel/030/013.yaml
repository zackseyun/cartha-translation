  rationale: 사흘 전이라는 시간 표현을 ‘병이 들다’에 직접 연결하여 원문의 인과와 시간 관계를 명확히 했습니다. 대화의 높임말을 합쇼체로 통일하고, עֶבֶד의 신분적 의미를 ‘노예’로 분명히 했습니다. 원문상 논쟁적이거나 본문 이해에 필수적인 대안은 없어 기존의 설명적 각주는 제거했습니다.
