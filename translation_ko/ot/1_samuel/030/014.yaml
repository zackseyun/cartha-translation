  lexicon: HALOT
  rationale: 군사적 약탈·기습의 의미를 살리면서도 한국어에서 자연스럽고 간결하게 처리하기 위해 ‘습격하다’를 택했습니다.
- source_word: הַכְּרֵתִי
  english_pob_choice: the Kerethites
