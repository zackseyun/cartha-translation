  lexicon: HALOT
  rationale: 직역의 소유 관계를 유지하되 한국어에서는 너무 딱딱한 문구를 피하기 위해 ‘유다에 속한 것’으로 옮겼습니다.
- source_word: נֶגֶב כָּלֵב
  english_pob_choice: the Negev of Caleb
  chosen_korean: 갈렙의 네겝
  alternatives_korean:
  - 갈렙의 남쪽 지역
  - 갈렙의 네게브
  - 갈렙의 남부
  lexicon: HALOT
  rationale: 반복되는 지명 어구를 살리기 위해 ‘네겝’을 음역해 유지했고, 갈렙과의 연관도 그대로 드러냈습니다.
- source_word: שָׂרַפְנוּ בָאֵשׁ
  english_pob_choice: we burned Ziklag with fire
  chosen_korean: 시글락을 불로 태웠습니다
  alternatives_korean:
  - 시글락에 불을 질렀습니다
  - 시글락을 불태웠습니다
  - 시글락을 불로 불태웠습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘불로’(수단)와 동사를 함께 살리면서도 한국어에서 중복이 과도하지 않도록 ‘불로 태우다’로 옮겼습니다.
