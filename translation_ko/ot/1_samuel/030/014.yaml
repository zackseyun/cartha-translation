  naturalness: ‘유다에 속한 것’은 현대 한국어 문장 안에서 부자연스럽고, 병렬된 습격 대상 가운데 무엇을 뜻하는지 अस्पष्ट합니다. ‘유다에 속한 지역’으로 하면 자연스럽고 문맥에도 맞습니다. ‘그렛 사람들’은 한국어 성서에서 널리 쓰이는 집단명 형태입니다.
