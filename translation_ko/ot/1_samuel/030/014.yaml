  - 케레시인들
  lexicon: HALOT
  rationale: 히브리어 인명·집단명은 현대 외래어 표기법에 따라 음역했고, 영어 POB의 표준형 ‘Kerethites’에 대응하는 형태로 처리했습니다.
- source_word: וְעַל אֲשֶׁר לִיהוּדָה
  english_pob_choice: the territory that belongs to Judah
  chosen_korean: 유다에 속한 것
  alternatives_korean:
