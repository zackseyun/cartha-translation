base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/015.yaml
  text: David said to him[a], “Will you lead me down to this raiding party?” He said, “Swear to me by God that you will not kill me or hand me over into the hand of my master, and I will lead you down to this raiding party.”
  footnotes:
  - marker: a
    text: Or “band” or “troop”; the Hebrew term denotes a marauding group.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 그에게 말했습니다. "이 약탈 무리에게 나를 데려다 주겠소?" 그가 말했습니다. "하나님을 두고 나에게 맹세하여, 나를 죽이지도, 내 주인의 손에 넘기지도 않겠다고 하십시오. 그러면 내가 이 약탈 무리에게 당신을 데려다 드리겠습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 이 집단을 가리키는 גדוד를 사용하며, 문맥상 약탈하는 무리·부대를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתוֹרִדֵנִי
  english_pob_choice: Will you lead me down
  chosen_korean: 나를 데려다 주겠소
  alternatives_korean:
  - 나를 아래로 데려가 주겠소
  - 나를 인도하여 내려가 주겠소
  lexicon: HALOT
  rationale: 히필형의 사역적 의미와 이동 방향을 살리되, 한국어에서는 자연스러운 대화체로 "데려다 주다"가 가장 적절합니다.
- source_word: הַגְּדוּד
  english_pob_choice: raiding party
  chosen_korean: 약탈 무리
  alternatives_korean:
  - 약탈대
  - 무리
  - 부대
  lexicon: HALOT
  rationale: 단순한 군대가 아니라 약탈·습격의 성격을 드러내야 하므로, POB의 "raiding party"에 맞춰 "약탈 무리"로 옮겼습니다.
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  english_pob_choice: Swear to me by God
  chosen_korean: 하나님을 두고 나에게 맹세하여
  alternatives_korean:
  - 하나님으로 나에게 맹세하여
  - 하나님으로 내게 맹세하시오
  lexicon: HALOT
  rationale: 히브리어의 맹세 공식을 한국어로 자연스럽게 옮기면서, 신을 증인으로 세우는 의미를 분명히 하기 위해 "하나님을 두고"를 사용했습니다.
- source_word: תַּסְגִּרֵנִי בְּיַד אֲדֹנִי
  english_pob_choice: hand me over into the hand of my master
  chosen_korean: 내 주인의 손에 넘기지도
  alternatives_korean:
  - 내 주인에게 넘기지도
  - 내 주인의 손에 맡기지도
  lexicon: HALOT
  rationale: 히브리어 관용구 "손에"를 보존해 권한과 지배를 드러내면서, 동사는 현대 한국어에서 자연스러운 "넘기다"로 옮겼습니다.
theological_decisions:
- issue: 이 장면의 맹세 대상 표현
  chosen_reading: '"하나님을 두고"로 직역해, 맹세가 하나님을 증인으로 부르는 행위임을 드러냈습니다.'
  alternative_readings:
  - '"하나님께"'
  - '"하나님 앞에서"'
  rationale: 본문은 단순한 종교적 언급이 아니라 맹세 공식이므로, 대상/증인 기능을 흐리지 않는 표현이 필요합니다.
  doctrine_reference: 맹세 공식과 하나님의 증인성
- issue: 아말렉 약탈대의 성격
  chosen_reading: '"약탈 무리"로 옮겨, 단순 집단이 아니라 습격·약탈의 성격을 보존했습니다.'
  alternative_readings:
  - '"무리"'
  - '"부대"'
  rationale: 문맥상 זה의 집단은 이동하는 약탈 집단이므로, 평이한 군사 용어로 중화하지 않는 것이 원문 이해에 더 충실합니다.
  doctrine_reference: 본문 문맥의 역사적·서사적 의미
