  source_fidelity: 마지막 절의 וְיִנְהֲגוּ וְיֵלֵכוּ는 그들이 자기 가족을 이끌고 떠나도록 허용하거나 명하는 복수 3인칭 표현입니다. 초안의 ‘각 사람은 … 떠나게 하시오’는 주어와 명령의 방향이 다소 어색하여, 양보의 뜻을 명확히 하는 표현으로 고쳤습니다. 또한 בְלִיַּעַל은 여기서 고유명사가 아니라 경멸적 인물 규정이므로 ‘불량한’으로 옮겼습니다. ‘나와 함께’의 단수와 뒤따르는 ‘우리가’의 복수는 원문대로 유지했습니다.
  naturalness: ‘악하고 쓸모없는 모든 사람’보다 ‘악하고 불량한 자들이 모두’가 현대 표준어에서 사람의 품성을 가리키는 문맥에 더 자연스럽습니다. 직접화법 안에서는 발화자들의 강경한 말투를 유지하면서도 합쇼체의 ‘-시오’를 사용했습니다.
  terminology: שָׁלָל은 ‘전리품’으로 적절하며, נצל의 문맥적 의미는 ‘되찾은’으로 자연스럽게 반영되었습니다. בְלִיַּעַל을 ‘불량한’으로 옮겨 ‘벨리알’이라는 후대의 고유명사적·신학적 의미를 부과하지 않았습니다.
