base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/022.yaml
  text: Then every wicked and worthless man from among the men who had gone with David answered and said[a], “Because they did not go with me, we will not give them any of the spoil that we recovered[c][b], except that each man may take his wife and his children and lead them away and go.”
  footnotes:
  - marker: a
    text: Or 'plunder' for 'spoil.'
    reason: lexical_alternative
  - marker: b
    text: '''Worthless'' translates beliyyaal here as a descriptive term; alternatively, ''lawless.'''
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'with me'; the speakers are a group, but the quotation preserves the singular form in the source text.
    reason: textual_variant
translation:
  language: ko
  text: 그때 다윗과 함께 갔던 사람들 가운데 악하고 불량한 자들이 모두 대답하여 말했습니다. “그들이 나와 함께 가지 않았으니, 우리가 되찾은 전리품[b] 가운데서는 그들에게 아무것도 주지 않겠소. 다만 각자가 자기 아내와 자녀만 데리고 떠나게 하시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 히브리어 ‘전리품’에 해당하는 말은 ‘약탈물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן / וַיֹּאמְרוּ
  english_pob_choice: Then ... answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 대답했습니다
  lexicon: HALOT
  rationale: 히브리어 서술 흐름을 따라 응답 동사를 살리되, 한국어에서는 중복을 줄인 자연스러운 직접화법 도입으로 옮겼습니다.
- source_word: כָּל אִישׁ רָע וּבְלִיַּעַל
  english_pob_choice: every wicked and worthless man
  chosen_korean: 악하고 쓸모없는 모든 사람
  alternatives_korean:
  - 악하고 악한 모든 사람
  - 악하고 무가치한 모든 사람
  lexicon: HALOT
  rationale: רָע의 도덕적 악함과 בְלִיַּעַל의 경멸적 성격을 함께 살리되, 본문에서 고유명사화하지 않고 인물 평가로 유지했습니다.
- source_word: מֵהָאֲנָשִׁים אֲשֶׁר הָלְכוּ עִם דָּוִד
  english_pob_choice: from the men who had gone with David
  chosen_korean: 다윗과 함께 갔던 사람들 가운데
  alternatives_korean:
  - 다윗과 함께 갔던 사람들 중에서
  - 다윗과 함께 갔던 사람들로부터
  lexicon: HALOT
  rationale: מִן의 부분적 의미를 한국어의 ‘가운데’로 자연스럽게 반영해, 이들이 다윗 무리 안의 일부임을 드러냈습니다.
- source_word: מֵהַשָּׁלָל אֲשֶׁר הִצַּלְנוּ
  english_pob_choice: any of the spoil that we recovered
  chosen_korean: 우리가 되찾은 전리품
  alternatives_korean:
  - 우리가 회수한 약탈물
  - 우리가 구해낸 전리품
  lexicon: HALOT
  rationale: שָׁלָל은 전투에서 얻거나 빼앗긴 물품을 가리키므로 ‘전리품’이 가장 직접적입니다. הִצִּיל의 맥락상 ‘되찾다’가 회복·회수의 뜻을 잘 드러냅니다.
- source_word: אֲשֶׁר הָלְכוּ עִמִּי
  english_pob_choice: who did not go with me
  chosen_korean: 그들이 나와 함께 가지 않았으니
  alternatives_korean:
  - 그들이 우리와 함께 가지 않았으니
  - 그들이 내게 따라오지 않았으니
  lexicon: HALOT
  rationale: 히브리어는 1인칭 단수 ‘나와 함께’로 되어 있어 그 수적 차이를 유지했습니다. 영어 POB가 지적한 긴장을 한국어에서도 보존했습니다.
- source_word: אִישׁ אֶת אִשְׁתּוֹ וְאֶת בָּנָיו
  english_pob_choice: each man may take his wife and his children
  chosen_korean: 각 사람은 자기 아내와 자기 자녀를 데리고 가서
  alternatives_korean:
  - 각 사람은 자기 아내와 자기 아들들을 데리고 가서
  - 각 사람은 자기 아내와 자기 자녀를 취하여
  lexicon: HALOT
  rationale: בָּנָיו를 이 문맥에서 보다 자연스럽게 ‘자녀’로 옮겨 가족 전체를 가리키는 의미를 살렸습니다.
