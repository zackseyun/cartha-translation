  rationale: 와우 연속으로 이어지는 서술을 자연스러운 한국어 시간 연결로 옮기되, 단순한 과거열거보다 앞뒤 동작의 연속성을 드러내기 위해 ‘이르자’를 선택했습니다.
- source_word: וַיְשַׁלַּח מֵהַשָּׁלָל
  english_pob_choice: he sent some of the plunder
  chosen_korean: 전리품 가운데 일부를 보내며
  alternatives_korean:
  - 전리품에서 일부를 보내며
  - 노획물 가운데 일부를 보내며
  lexicon: WLC; HALOT
  rationale: מִן은 전체에서 떼어 보냄을 나타내므로 ‘가운데 일부’를 넣어 분량 감각을 살렸고, 군사적 약탈물을 뜻하는 말은 현대 한국어에서 가장 분명한 ‘전리품’으로 옮겼습니다.
- source_word: לְזִקְנֵ֥י יְהוּדָ֖ה לְרֵעֵ֣הוּ
  english_pob_choice: to the elders of Judah, his friends
  chosen_korean: 유다의 장로들 곧 자기 친구들에게
  alternatives_korean:
  - 유다의 장로들, 그의 친구들에게
  - 유다의 장로들, 자기 벗들에게
  lexicon: WLC; HALOT
  rationale: לְרֵעֵהוּ는 단순한 친분 이상으로 연합 관계를 암시하므로, 관계를 풀어 ‘곧 자기 친구들에게’로 자연스럽게 연결했습니다.
- source_word: בְּרָכָה
  english_pob_choice: a gift
  chosen_korean: 선물
  alternatives_korean:
  - 축복
  - 예물
  lexicon: HALOT
  rationale: 문맥상 물질적 전달물로 기능하므로 본문에는 ‘선물’을 쓰고, 히브리어가 지닌 ‘축복’의 어휘적 중의성은 각주로 남겼습니다.
- source_word: אֹיְבֵי יְהוָה
  english_pob_choice: the enemies of Yahweh
  chosen_korean: 야훼의 원수들
  alternatives_korean:
  - 야훼의 적들
  - 주님의 원수들
  lexicon: WLC; POB divine-name convention
  rationale: 지시 대상은 פועל적 관계를 가진 적대자들이므로 ‘원수들’이 가장 직접적이며, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
