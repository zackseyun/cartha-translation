base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/026.yaml
  text: When David came to Ziklag[a], he sent some of the plunder to the elders of Judah, his friends, saying, “Look, here is a gift for you from the plunder of the enemies of Yahweh.”
  footnotes:
  - marker: a
    text: Or “a blessing for you.” The Hebrew word can mean “blessing,” but here refers to a material gift sent from the plunder.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 시글락에 이르자 유다의 장로들, 곧 자기 친구들에게 전리품 가운데 일부를 보내면서 말했습니다. “보십시오, 이것은 야훼의 원수들의 전리품 가운데서 드리는 여러분을 위한 선물[a]입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “축복”이라고 번역할 수 있습니다. 이 히브리어 단어는 “축복”을 뜻할 수 있지만, 여기서는 전리품에서 보낸 물질적 선물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא דָוִד אֶל צִקְלַג
  english_pob_choice: When David came to Ziklag
  chosen_korean: 다윗이 시글락에 이르자
