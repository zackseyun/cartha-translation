  - 주님
  rationale: 본문의 신명 사합은 고유한 언약 이름을 가리키므로, 표제어를 가리는 대체어 대신 음역형 ‘야훼’를 유지해 원문이 가진 신학적·문헌학적 구분을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: בְּרָכָה의 의미 범위
  chosen_reading: 선물
  alternative_readings:
  - 축복
  - 복
  rationale: 다윗이 전쟁 노획물에서 실제 물품을 보내는 장면이므로, 본문 독자의 이해를 위해 행위의 구체적 의미를 드러내되 어휘적 여운은 각주로 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
