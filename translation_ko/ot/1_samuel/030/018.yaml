reference: 1 Samuel 30:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּצֵּ֣ל דָּוִ֔ד אֵ֛ת כָּל אֲשֶׁ֥ר לָקְח֖וּ עֲמָלֵ֑ק וְ/אֶת שְׁתֵּ֥י נָשָׁ֖י/ו הִצִּ֥יל דָּוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/018.yaml
  text: David recovered all that Amalek had taken[a], and David rescued his two wives.
  footnotes:
  - marker: a
    text: Or 'delivered' in both clauses; the Hebrew uses the same verb in each clause, but English idiom favors 'recovered' for what was taken and 'rescued' for his wives.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 아말렉이 빼앗아 간 모든 것을 되찾았으며[a], 다윗은 자신의 두 아내도 구해냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 두 절 모두 ‘구해냈다’로 옮길 수 있습니다. 히브리어는 두 절에서 같은 동사를 사용하지만, 한국어에서는 첫 절의 빼앗긴 모든 것을 되찾는 일과 둘째 절의 아내들을 구하는 일을 구분하여 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל / הִצִּיל (נצל)
  english_pob_choice: recovered / rescued
  chosen_korean: 되찾았고 / 구해냈습니다
  alternatives_korean:
  - 구출했습니다
  - 구해냈습니다
  - 되찾았습니다
  lexicon: HALOT
  rationale: 같은 어근이 두 번 나오지만, 첫 절은 빼앗긴 소유물을 다시 손에 넣는 뜻이 강해 ‘되찾다’가 자연스럽고, 둘째 절은 아내들을 위험이나 억류에서 건져낸 뉘앙스가 있어 ‘구해내다’가 더 잘 맞습니다.
- source_word: כָּל אֲשֶׁר לָקְחוּ עֲמָלֵק
  english_pob_choice: all that Amalek had taken
  chosen_korean: 아말렉이 빼앗아 간 모든 것
  alternatives_korean:
  - 아말렉이 가져간 모든 것
  - 아말렉 사람들이 빼앗아 간 모든 것
  lexicon: HALOT
  rationale: ‘כָּל אֲשֶׁר’는 ‘모든 것’으로, ‘לָקְחוּ’는 서술 흐름상 과거 완료 느낌의 ‘빼앗아 간’이 자연스럽습니다. ‘아말렉’은 히브리어의 집합적 고유명사 형태를 살려 유지했습니다.
- source_word: עֲמָלֵק
  english_pob_choice: Amalek
  chosen_korean: 아말렉
  alternatives_korean:
  - 아말렉 사람들
  lexicon: HALOT
  rationale: 본문은 집단명이라도 단수형 고유명사로 되어 있으므로, 한국어도 ‘아말렉’을 유지해 원문 형태를 살렸습니다.
- source_word: שְׁתֵּי נָשָׁיו
  english_pob_choice: his two wives
  chosen_korean: 자기의 두 아내
  alternatives_korean:
  - 그의 두 아내
  - 두 아내
  lexicon: HALOT
  rationale: ‘שְׁתֵּי’의 수사를 그대로 살리면서, 소유 관계는 한국어에서 자연스러운 ‘자기의’로 풀어 의미를 분명하게 했습니다.
- source_word: דָּוִד ... דָּוִד
  english_pob_choice: David ... David
  chosen_korean: 다윗은 ... 다윗이
  alternatives_korean:
  - 다윗은 ... 그는
  lexicon: HALOT
  rationale: 히브리어의 이름 반복은 강조 효과가 있으므로, 첫 절과 끝 절 모두 ‘다윗’을 유지해 대명사로 약화시키지 않았습니다.
theological_decisions:
- issue: 같은 동사 נצל의 반복을 한국어에서 동일어로 고정할지 여부
  chosen_reading: 문맥에 따라 ‘되찾다’와 ‘구해내다’로 구분했습니다.
  alternative_readings:
  - 두 절 모두 ‘구하다’
  - 두 절 모두 ‘구출하다’
  rationale: 원문은 동일 어근을 반복하지만, 첫 절은 전리품 회수, 둘째 절은 사람을 건져냄이라는 목적어 차이가 크므로 한국어에서 기능상 차이를 드러내는 것이 의미를 더 정확히 전달합니다.
  doctrine_reference: 번역상의 문맥 구별 원칙
- issue: 아말렉을 집합적 민족명으로 처리할지 단수 고유명사로 둘지
  chosen_reading: 집합적 의미를 유지하되 표기는 ‘아말렉’으로 했습니다.
  alternative_readings:
  - 아말렉 사람들
  - 아말렉 족속
  rationale: 히브리어가 단수형 고유명사를 쓰는 점을 보존하면서도, 한국어 독자가 민족 집단을 이해하도록 문맥이 보완합니다.
  doctrine_reference: 원문 형태 보존 원칙
