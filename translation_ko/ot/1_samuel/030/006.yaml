revisions:
- from: 그리고 다윗은 크게 괴로워했습니다. 백성이 그를 돌로 치자고 말했기 때문입니다. 모든 백성의 혼이 쓰라렸으니 — 각 사람이 자기 아들들과 자기 딸들 때문이었습니다. 그러나 다윗은 야훼, 자기 하나님 안에서 스스로를 굳게 하였습니다.[a]
  to: 다윗은 몹시 곤경에 처했습니다. 백성이 그를 돌로 쳐 죽이자고 하였기 때문입니다. 온 백성의 마음이 쓰라렸습니다[a]. 저마다 자기 아들들과 딸들 때문이었습니다. 그러나 다윗은 자기 하나님 야훼 안에서 스스로 힘을 북돋았습니다.
  rationale: 원문의 인과 관계, ‘온 백성’의 집합성과 ‘저마다’의 분배성, 그리고 다윗이 야훼 안에서 자신을 강하게 한 히트파엘 동사의 뉘앙스를 유지했습니다. 동시에 ‘혼’과 ‘스스로를 굳게 하다’의 직역투를 현대 표준어 합쇼체에 맞게 다듬고, 각주를 해당 어휘에 직접 연결했습니다.
