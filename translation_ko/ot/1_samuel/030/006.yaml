base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/006.yaml
  text: And David was greatly distressed[a], because the people spoke of stoning him, for the soul of all the people was bitter, each man because of his sons and his daughters. But David strengthened himself in Yahweh his God.
  footnotes:
  - marker: a
    text: Or 'the spirit of all the people was bitter,' that is, all the people were deeply embittered.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 몹시 곤경에 처했습니다. 백성이 그를 돌로 쳐 죽이자고 하였기 때문입니다. 온 백성의 마음이 쓰라렸습니다[a]. 저마다 자기 아들들과 딸들 때문이었습니다. 그러나 다윗은 자기 하나님 야훼 안에서 스스로 힘을 북돋았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 백성의 영이 쓰라렸다.’ 히브리어는 ‘혼/생명’을 뜻하는 단수 명사를 집합적으로 사용하며, 온 백성이 깊이 비통하고 쓰라린 상태였음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֶר ... מְאֹד
  english_pob_choice: was greatly distressed
  chosen_korean: 크게 괴로워했습니다
  alternatives_korean:
  - 몹시 곤경에 처했습니다
