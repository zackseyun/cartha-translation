  text: וַ/תֵּ֨צֶר לְ/דָוִ֜ד מְאֹ֗ד כִּֽי אָמְר֤וּ הָ/עָם֙ לְ/סָקְל֔/וֹ כִּֽי מָ֨רָה֙ נֶ֣פֶשׁ כָּל הָ/עָ֔ם אִ֖ישׁ עַל בנ/ו וְ/עַל בְּנֹתָ֑י/ו וַ/יִּתְחַזֵּ֣ק דָּוִ֔ד בַּ/יהוָ֖ה אֱלֹהָֽי/ו־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/006.yaml
  text: And David was greatly distressed[a], because the people spoke of stoning him, for the soul of all the people was bitter, each man because of his sons and his daughters. But David strengthened himself in Yahweh his God.
  footnotes:
  - marker: a
    text: Or 'the spirit of all the people was bitter,' that is, all the people were deeply embittered.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 다윗은 크게 괴로워했습니다. 백성이 그를 돌로 치자고 말했기 때문입니다. 모든 백성의 혼이 쓰라렸으니 — 각 사람이 자기 아들들과 자기 딸들 때문이었습니다. 그러나 다윗은 야훼, 자기 하나님 안에서 스스로를 굳게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '모든 사람의 영이 쓰라렸다'는 뜻으로, 곧 모든 백성이 깊이 쓰라린 상태였다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֶר ... מְאֹד
  english_pob_choice: was greatly distressed
  chosen_korean: 크게 괴로워했습니다
  alternatives_korean:
  - 몹시 곤경에 처했습니다
  - 매우 괴로웠습니다
  - 크게 압박을 받았습니다
  lexicon: HALOT
  rationale: צרר의 압박·곤경 의미와 מְאֹד의 강도를 함께 살리되, 현대 한국어에서 자연스럽고 서사체에 맞는 표현으로 옮겼습니다.
- source_word: לְסָקְלוֹ
  english_pob_choice: of stoning him
  chosen_korean: 그를 돌로 치자고
  alternatives_korean:
  - 그를 돌로 치려고
  - 그를 돌로 치는 것에 대해
  - 그를 돌로 치기로
  lexicon: HALOT
  rationale: אָמְרוּ 뒤의 의도/논의 내용을 한국어에서 자연스럽게 드러내기 위해 '돌로 치자고 말했습니다'로 옮겼습니다.
- source_word: מָרָה נֶפֶשׁ
  english_pob_choice: the soul ... was bitter
  chosen_korean: 혼이 쓰라렸으니
  alternatives_korean:
  - 영이 쓰라렸으니
  - 마음이 괴로웠으니
  - 혼이 bitter했습니다
  lexicon: HALOT
  rationale: 원문의 단수형 'נֶפֶשׁ'를 살려 '혼'으로 두고, עמּ의 집합적 내적 상태를 '쓰라렸다'로 표현했습니다.
- source_word: בַּיהוָה
  english_pob_choice: in Yahweh
  chosen_korean: 야훼 안에서
  alternatives_korean:
  - 야훼 가운데
  - 야훼로 말미암아
  - 주 안에서
  lexicon: HALOT
  rationale: 본문의 하나님의 이름 יְהוָה를 프로젝트 기준에 따라 '야훼'로 옮기고, 전치사 בְּ의 영역/근거감을 '안에서'로 살렸습니다.
theological_decisions:
- issue: 야훼 이름의 표기
  chosen_reading: 본문의 יְהוָה를 '야훼'로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 기록은 히브리어 본문의 신명 직접 표기를 보존해야 하므로, 전통적 대체어보다 स्रोत 직역형 '야훼'를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: יְהוָה YHWH'
- issue: דָּוִד의 자기 강건화 표현
  chosen_reading: '''스스로를 굳게 하였습니다''로 옮겨 דוד의 능동적 자기 격려를 살렸습니다.'
  alternative_readings:
  - 힘을 얻었습니다
  - 용기를 냈습니다
  - 굳세게 되었습니다
  rationale: 히트파엘형 וַיִּתְחַזֵּק의 반사적/중간적 뉘앙스를 보존하여, 하나님 안에서 다윗이 능동적으로 자신을 붙든다는 흐름을 드러냈습니다.
  doctrine_reference: Verb voice / discourse nuance
