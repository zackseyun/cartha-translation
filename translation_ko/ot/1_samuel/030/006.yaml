  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 לְסָקְלוֹ는 돌로 처형하는 행위를 가리키므로 한국어에서는 ‘돌로 쳐 죽이자고’가 더 명확합니다. מָרָה נֶפֶשׁ의 집합적 단수 표현은 ‘온 백성의 마음이 쓰라렸다’로 자연스럽게 보존할 수 있습니다.
  naturalness: ‘모든 백성의 혼이 쓰라렸으니’는 현대 표준어 성서 문체로 다소 부자연스럽고, 대시 뒤의 설명도 문장 흐름을 끊습니다. ‘온 백성의 마음이 쓰라렸습니다. 저마다… 때문이었습니다’가 자연스럽고 원문의 분배적 설명을 잘 드러냅니다. ‘스스로를 굳게 하였습니다’보다 ‘스스로 힘을 북돋았습니다’가 현대 한국어에 더 자연스럽습니다.
  terminology: יַהוָה는 프로젝트 결정에 따라 ‘야훼’로 유지합니다. נֶפֶשׁ는 이 문맥에서 인간의 내적 상태를 뜻하므로 본문에는 ‘마음’을 사용하고, ‘영’은 각주에서 가능한 어휘적 대안으로 제시합니다.
