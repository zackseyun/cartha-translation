  yaml_path: translation/ot/1_samuel/030/004.yaml
  text: Then David and the people who were with him raised their voices and wept until they had no strength left to weep[a].
  footnotes:
  - marker: a
    text: Or, more literally, 'lifted up their voice and wept.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다윗과 그와 함께한 백성이 목소리를 높여, 울 힘조차 남지 않을 때까지 울었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 직역하면, ‘그들의 목소리를 들어 올려 울었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת קוֹלָם
  english_pob_choice: raised their voices
  chosen_korean: 목소리를 높여
  alternatives_korean:
  - 목소리를 들어
  - 소리를 높여
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘들어 올리다 + 목소리’를 한국어에서 가장 자연스럽게 살리면서도, 단순한 소리 크기보다 의도적 발화의 고조를 전달합니다.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  english_pob_choice: the people who were with him
  chosen_korean: 그와 함께한 백성
  alternatives_korean:
  - 그와 함께한 사람들
  - 그와 함께한 무리
  lexicon: HALOT
  rationale: עָם은 여기서 특정 전투 병력이라기보다 함께한 집단 전체를 가리키므로, ‘백성’이 원문의 범위를 비교적 정확히 유지합니다.
- source_word: וַיִּבְכּוּ ... לִבְכּוֹת
  english_pob_choice: wept ... to weep
  chosen_korean: 울었고 ... 울었습니다
  alternatives_korean:
  - 울었고 ... 울 수 있을 때까지
  - 울었고 ... 울 힘이 없을 때까지
  lexicon: HALOT
  rationale: בכה의 기본 의미를 반복해 살리되, 한국어에서는 같은 동사를 반복해도 자연스러우므로 ‘울다’를 유지했습니다.
- source_word: עַד אֲשֶׁר אֵין בָּהֶם כֹּחַ
  english_pob_choice: until they had no strength left
  chosen_korean: 마침내 울 힘조차 남지 않을 때까지
  alternatives_korean:
  - 기력이 남지 않을 때까지
  - 더는 울 힘이 없을 때까지
  lexicon: HALOT
  rationale: ‘힘’은 여기서 단순 체력보다 울 수 있는 역량을 가리키므로, 반복되는 ‘울다’와 연결해 ‘울 힘’으로 구체화했습니다.
theological_decisions:
- issue: 서술의 강도와 반복
  chosen_reading: 단순한 감정 표출이 아니라 집단적 애곡과 극도의 탈진을 함께 드러내는 서술로 옮겼습니다.
  alternative_readings:
  - 그저 울었습니다
  - 몹시 울었습니다
  rationale: 본문은 ‘목소리를 높여’와 ‘울 힘조차 남지 않을 때까지’의 병렬로 비탄의 극치를 강조하므로, 이를 약화하지 않도록 유지했습니다.
  doctrine_reference: 문맥적 서술 보존
