  source_fidelity: 히브리어의 핵심 표현인 ‘목소리를 높여 울다’와, 울 수 있는 힘이 다할 때까지 계속 울었다는 뜻은 대체로 정확히 반영합니다. 그러나 ‘마침내’는 원문에 명시되지 않은 시간적 도달의 뉘앙스를 더하므로 삭제하는 편이 더 충실합니다.
