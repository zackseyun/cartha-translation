  terminology: ‘백성’은 עָם의 넓은 지시 범위를 유지하며, 원문이 구체적으로 ‘병사들’ 또는 ‘사람들’이라고 하지 않는 점을 존중합니다. ‘울다’의 반복도 히브리어의 반복을 적절히 보존합니다.
