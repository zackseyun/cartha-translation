lexical_decisions:
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  english_pob_choice: from that day onward
  chosen_korean: 그날부터 그 뒤로
  alternatives_korean:
  - 그날부터 이후로
  - 그날부터 앞으로
  lexicon: WLC/HALOT
  rationale: 특정 시점부터 이어지는 지속을 한국어의 자연스러운 시간 표현으로 옮겼습니다. '그 뒤로'는 'onward'의 지속성을 살리면서도 문어체로 무리 없이 읽힙니다.
- source_word: וַיְשִׂמֶהָ
  english_pob_choice: he made it
  chosen_korean: 그것을 …로 삼았습니다
  alternatives_korean:
  - 그것을 만들었습니다
  - 그것을 세웠습니다
  lexicon: WLC/HALOT
  rationale: 여기서는 단순 제작이 아니라 앞선 관행을 규범으로 지정하는 의미이므로, 문맥상 '삼다'가 가장 정확합니다.
- source_word: לְחֹק
  english_pob_choice: a statute
  chosen_korean: 규례
  alternatives_korean:
  - 법령
  - 정해진 규칙
  lexicon: WLC/HALOT
  rationale: חֹק은 고정된 규범이나 정례를 가리키며, 한국어 성경어 중 '규례'가 가장 직접적으로 대응합니다.
- source_word: וּלְמִשְׁפָּט
  english_pob_choice: and an ordinance
  chosen_korean: 판결
  alternatives_korean:
  - 규정
  - 율례
  lexicon: WLC/HALOT
  rationale: מִשְׁפָּט은 여기서 법적 판단/규범의 성격을 띠므로, 전통적 교회어 '판결'을 사용해 חֹק과의 병렬을 살렸습니다.
- source_word: לְיִשְׂרָאֵל
  english_pob_choice: for Israel
  chosen_korean: 이스라엘을 위한
  alternatives_korean:
  - 이스라엘에게
  - 이스라엘을 위해
  lexicon: WLC/HALOT
  rationale: 전치사 ל의 적용 대상을 자연스럽게 드러내기 위해 '…을 위한'으로 옮겼습니다.
theological_decisions:
- issue: 완결된 과거와 현재 지속의 결합
  chosen_reading: '''그날부터 그 뒤로''와 ''오늘까지 그렇습니다''로, 제정의 시작과 현재까지의 지속을 함께 드러냈습니다.'
  alternative_readings:
  - '''그날부터 오늘까지'''
  - '''그날부터 지금까지'''
  rationale: 히브리어 관용구는 특정 시점부터 현재 화자의 시점까지 계속되는 상태를 말하므로, 한국어에서도 과거 완료성보다 지속성을 분명히 하는 것이 좋습니다.
  doctrine_reference: 서술의 시점과 관점 유지
