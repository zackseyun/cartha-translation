    rationale: 이 구절의 מִשְׁפָּט은 특정 사건에 대한 사법적 판결이라기보다 חֹק와 병렬을 이루는 정해진 규범·법적 질서를 뜻합니다. 본문의 ‘법도’가 한국어에서 이 기능을 더 자연스럽게 전달합니다.
