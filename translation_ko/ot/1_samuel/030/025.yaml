  verdict: revise
  source_fidelity: 히브리어는 그날부터 시작되어 서술자의 현재까지 계속되는 관행을 말하며, 다윗이 이를 이스라엘의 규범으로 정했음을 나타냅니다. 초안은 지속성과 규범 제정의 핵심을 대체로 반영하지만, 문두의 וַיְהִי와 종결의 עַד הַיּוֹם הַזֶּה를 분리한 두 문장이 한국어에서 다소 부자연스럽고 반복적으로 들립니다.
  naturalness: ‘그날부터 그 뒤로’와 ‘오늘까지 그렇습니다’의 조합은 의미는 전달하지만 ‘그렇습니다’의 지시 대상이 불명확합니다. ‘그날부터 그 후로’ 및 ‘오늘날까지 이어집니다’가 현대 표준어 합쇼체에서 더 자연스럽고 지속의 대상을 분명히 합니다.
  terminology: חֹק와 מִשְׁפָּט의 병렬에서 ‘규례와 판결’은 후자가 개별 재판의 결정을 뜻하기 쉬워 문맥상 부정확합니다. 여기서는 지속적으로 적용되는 규범을 가리키므로 ‘규례와 법도’가 더 적절합니다. 각주에는 가능한 어휘적 대안으로 ‘판결’을 보존할 수 있습니다.
