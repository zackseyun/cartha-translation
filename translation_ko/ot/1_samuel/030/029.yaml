  lexicon: HALOT
  rationale: עִיר의 범위를 고려하되, 본문이 약탈물 분배 대상의 정착지 목록임을 반영하여 현대 한국어에서는 ‘도시들’이 가장 무난하고 직접적입니다.
- source_word: הַיְּרַחְמְאֵלִי
