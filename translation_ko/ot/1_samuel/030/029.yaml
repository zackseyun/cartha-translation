  rationale: 지명은 음역으로 옮기되, 영어 POB의 표준형 Rakal을 반영하여 한국어로는 라칼을 채택했습니다.
- source_word: בְּעָרֵי
  english_pob_choice: in the towns of
  chosen_korean: 도시들에
  alternatives_korean:
  - 성읍들에
