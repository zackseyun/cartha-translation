  text: 그리고 라칼에 있는 자들에게, 그리고 야르함엘 사람들의 도시들에 있는 자들에게, 그리고 게니 사람들의 도시들에 있는 자들에게도 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라칼은 일부 영어 전통에서 ‘Racal’로도 철자됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  english_pob_choice: and to those
  chosen_korean: 그리고 …에 있는 자들에게도
  alternatives_korean:
  - 그리고 …에게
  - 그리고 …에 대하여
  lexicon: HALOT
  rationale: 목록형 분배 문맥에서 방향성 있는 수여를 자연스럽게 살리면서, 반복되는 יחס구조를 한국어로 과도하게 해석하지 않도록 했습니다.
- source_word: בְּרָכָל
