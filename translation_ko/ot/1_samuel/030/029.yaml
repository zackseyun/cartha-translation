  - 예라흐므엘 사람들
  lexicon: HALOT
  rationale: 히브리어 지명/족속명은 영어 POB의 집합적 복수 의미를 따라 ‘사람들’로 옮겨 공동체 집단을 드러냈습니다.
- source_word: הַקֵּינִי
  english_pob_choice: the Kenites
  chosen_korean: 게니 사람들
  alternatives_korean:
  - 게니 족속
