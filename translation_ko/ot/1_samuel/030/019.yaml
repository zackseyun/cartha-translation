id: 1SA.30.19
reference: 1 Samuel 30:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֣א נֶעְדַּר לָ֠/הֶם מִן הַ/קָּטֹ֨ן וְ/עַד הַ/גָּד֜וֹל וְ/עַד בָּנִ֤ים וּ/בָנוֹת֙ וּ/מִ/שָּׁלָ֔ל וְ/עַ֛ד כָּל אֲשֶׁ֥ר לָקְח֖וּ לָ/הֶ֑ם הַ/כֹּ֖ל הֵשִׁ֥יב דָּוִֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/019.yaml
  text: Nothing of theirs was missing[a], from small to great, sons and daughters, spoil, or anything that had been taken from them[b]; David brought back everything.
  footnotes:
  - marker: a
    text: Or 'from the least to the greatest.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'all that they had taken for themselves'; the sense in context is what had been taken from David's people.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 것 중 아무것도 빠진 것이 없었으며, 작은 자부터 큰 자까지, 아들들과 딸들, 전리품과 그들이 빼앗겼던 모든 것까지, 다윗이 모든 것을 되찾았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘작은 자부터 큰 자까지’는 ‘가장 작은 자부터 가장 큰 자까지’라는 뜻의 관용적 포괄 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그들이 자신들을 위해 가져간 모든 것’이지만, 문맥상 다윗의 사람들에게서 빼앗긴 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא נֶעְדַּר
  english_pob_choice: Nothing of theirs was missing
  chosen_korean: 아무것도 빠진 것이 없었으며
  alternatives_korean:
  - 잃은 것이 없었으며
  - 부족한 것이 없었으며
  - 없어진 것이 없었으며
  lexicon: HALOT
  rationale: נֶעְדַּר는 회수 후 ‘빠지다/결여되다’의 뜻이므로, 현대 한국어에서 자연스러운 ‘빠진 것이 없었으며’로 옮겨 결손 없음의 의미를 살렸습니다.
- source_word: מִן הַקָּטֹן וְעַד הַגָּדוֹל
  english_pob_choice: from small to great
  chosen_korean: 작은 자부터 큰 자까지
  alternatives_korean:
  - 가장 작은 자부터 가장 큰 자까지
  - 적은 자부터 많은 자까지
  - 어린 자부터 큰 자까지
  lexicon: HALOT
  rationale: 대구적 포괄 표현이므로 지위나 규모를 망라하는 뜻을 유지하면서도, 한국어에서 인물 집합을 자연스럽게 드러내는 ‘작은 자부터 큰 자까지’를 택했습니다.
- source_word: בָּנִים וּבָנוֹת
  english_pob_choice: sons and daughters
  chosen_korean: 아들들과 딸들
  alternatives_korean:
  - 자녀들
  - 아들과 딸
  - 남자아이들과 여자아이들
  lexicon: HALOT
  rationale: 히브리어가 성별을 구분해 직접 말하므로, 이를 일반화한 ‘자녀들’보다 ‘아들들과 딸들’이 원문을 더 정확히 반영합니다.
- source_word: מִשָּׁלָל
  english_pob_choice: spoil
  chosen_korean: 전리품
  alternatives_korean:
  - 노획물
  - 약탈물
  - 노략물
  lexicon: HALOT
  rationale: 전쟁 맥락의 취득물을 가리키므로, 한국어에서 가장 분명한 군사적 의미를 주는 ‘전리품’을 사용했습니다.
- source_word: כָּל אֲשֶׁר לָקְחוּ לָהֶם
  english_pob_choice: anything that had been taken from them
  chosen_korean: 그들이 빼앗겼던 모든 것까지
  alternatives_korean:
  - 그들이 자기들을 위해 취한 모든 것까지
  - 그들에게서 가져간 모든 것까지
  - 빼앗긴 모든 것까지
  lexicon: HALOT
  rationale: 직역하면 ‘그들이 자신들을 위해 가져간 모든 것’이지만, 문맥상 피해자들의 소유가 탈취된 뜻이므로 한국어에서는 수동적 피해를 분명히 하는 표현으로 옮겼습니다.
- source_word: הַכֹּל הֵשִׁיב
  english_pob_choice: brought back everything
  chosen_korean: 모든 것을 되찾았습니다
  alternatives_korean:
  - 모든 것을 가져왔습니다
  - 모든 것을 돌려놓았습니다
  - 모든 것을 회복시켰습니다
  lexicon: HALOT
  rationale: הֵשִׁיב는 ‘돌아오게 하다’의 사역형이어서 단순한 이동보다 회복·복귀의 뉘앙스가 있습니다. 서술 흐름상 ‘되찾았습니다’가 가장 자연스럽고 간결합니다.
