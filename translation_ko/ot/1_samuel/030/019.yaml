    issue: ‘그들이 빼앗겼던 모든 것’의 대명사 지시와 태
    rationale: 한국어에서는 ‘그들’이 빼앗긴 사람인지 빼앗은 사람인지 불분명합니다. 히브리어는 ‘그들이 자신들을 위하여 가져간 모든 것’이라고 능동으로 말하며, 문맥상 약탈자들은 아말렉 사람들입니다. 본문에서는 ‘그들에게서 빼앗아 간’으로 피해 대상을 명료하게 하고, 각주에서 히브리어의 능동 표현을 밝혀야 합니다.
