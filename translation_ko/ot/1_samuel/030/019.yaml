    rationale: ‘그들의 것 중 아무것도 빠진 것이 없었으며’는 자연스럽지 않고, 긴 열거 뒤에 주어 ‘다윗이’를 두면 읽기 어렵습니다. 두 문장으로 나누어 원문의 의미와 한국어 가독성을 함께 살릴 수 있습니다.
