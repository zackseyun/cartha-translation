base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/005.yaml
  text: 'And David’s two wives had been taken captive: Ahinoam the Jezreelitess and Abigail[b][a], the wife of Nabal the Carmelite.'
  footnotes:
  - marker: a
    text: Or "the Jezreelite woman" or "from Jezreel."
    reason: lexical_alternative
  - marker: b
    text: '"Carmelite" here means a man from Carmel, not a member of a later religious order.'
    reason: cultural_note
translation:
  language: ko
  text: 다윗의 두 아내도 포로로 잡혀 갔습니다. 곧 이스르엘 여인[a] 아히노암과 갈멜 사람[b] 나발의 아내 아비가일입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스르엘 여인’은 ‘이스르엘 사람인 여자’ 또는 ‘이스르엘 출신’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘갈멜 사람’은 후대의 수도회 명칭이 아니라 갈멜 출신의 남자를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁתֵּי נְשֵׁי דָוִד
  english_pob_choice: And David’s two wives
  chosen_korean: 다윗의 두 아내
  alternatives_korean:
  - 다윗의 두 아내들
  - 다윗의 두 아내가
  lexicon: HALOT
  rationale: 히브리어 구성은 ‘다윗의 두 아내’라는 소유 관계를 분명히 하며, 한국어에서도 자연스럽고 간결하게 유지하는 것이 적절합니다.
- source_word: נִשְׁבּוּ
  english_pob_choice: had been taken captive
  chosen_korean: 포로로 잡혀 갔습니다
  alternatives_korean:
  - 포로로 잡혔습니다
  - 사로잡혔습니다
  lexicon: HALOT
  rationale: 수동 완료는 앞선 약탈의 결과를 보고하는 뉘앙스이므로, 문맥상 완료된 상태를 드러내는 ‘포로로 잡혀 갔습니다’가 적절합니다.
- source_word: הַ/יִּזְרְעֵלִית
  english_pob_choice: the Jezreelitess
  chosen_korean: 이스르엘 여인
  alternatives_korean:
  - 이스르엘 사람인 여자
  - 이스르엘 출신 여인
  lexicon: HALOT
  rationale: 여성형 지명 형용사를 한국어에서는 ‘-여인’으로 옮겨 출신지를 표시하되, 낡은 어감이 강한 음역식 표현은 피했습니다.
- source_word: אֵשֶׁת נָבָל הַֽ/כַּרְמְלִי
  english_pob_choice: the wife of Nabal the Carmelite
  chosen_korean: 나발의 아내였는데 그는 갈멜 사람이었습니다
  alternatives_korean:
  - 갈멜 사람 나발의 아내
  - 갈멜 출신 나발의 아내
  lexicon: HALOT
  rationale: ‘갈멜 사람’은 지리적 출신을 가리키므로, 영어 주석처럼 수도사적 의미가 아니라는 점을 살리기 위해 서술로 풀어 옮겼습니다.
theological_decisions:
- issue: 포로로 잡힘을 나타내는 동사의 시제와 서술 방식
  chosen_reading: 이미 벌어진 사건의 결과를 현재 서술 속에서 보고하는 형태로 옮겼습니다.
  alternative_readings:
  - 포로가 되었습니다
  - 사로잡혔습니다
  rationale: 문맥상 다윗의 귀환 이후 확인되는 상태를 나타내므로, 완료된 사건성을 드러내되 한국어 서술 흐름을 자연스럽게 유지했습니다.
  doctrine_reference: 서사 문맥의 시제 일치
