base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/030.yaml
  text: and to those in Hormah[a], and to those in Bor-ashan, and to those in Athach.
  footnotes:
  - marker: a
    text: Bor-ashan is a place name; literally the elements may suggest 'well/pit of smoke,' but the name is transliterated rather than translated.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 호르마에 있는 사람들에게와 보르-아산에 있는 사람들에게와 아타크에 있는 사람들에게도 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보르-아산은 지명입니다. 글자 그대로는 ‘연기 샘/구덩이’쯤의 뜻이 될 수 있지만, 이름으로 음역하는 것이 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  english_pob_choice: and to those
  chosen_korean: ~에 있는 사람들에게도
  alternatives_korean:
  - ~에 있는 이들에게도
  - ~에 있는 자들에게도
  lexicon: HALOT
  rationale: 분배 목록에서 ‘and to those’는 수신자를 가리키는 관용적 표현이므로, 한국어에서는 각 지명 뒤에 ‘~에 있는 사람들에게도’로 자연스럽게 살렸습니다.
- source_word: בְּחָרְמָה
  english_pob_choice: in Hormah
  chosen_korean: 호르마에 있는
  alternatives_korean:
  - 호르마에서
  - 호르마에
  lexicon: HALOT
  rationale: 고유 지명은 음역하고, 전치사 ב의 위치 의미는 ‘~에 있는’으로 옮겨 반복 구조를 유지했습니다.
- source_word: בְּבוֹר עָשָׁן
  english_pob_choice: in Bor-ashan
  chosen_korean: 보르-아산
  alternatives_korean:
  - 보르 아산
  - ‘연기 샘/구덩이’
  lexicon: HALOT
  rationale: 영어 POB가 주석에서 밝히듯 이 표현은 지명으로 처리하는 것이 적절하므로, 뜻풀이보다 음역을 따르고 합성 지명임을 하이픈으로 표시했습니다.
- source_word: בַּעֲתָךְ
  english_pob_choice: in Athach
  chosen_korean: 아타크에 있는
  alternatives_korean:
  - 아타크에서
  - 아타크에
  lexicon: HALOT
  rationale: 마지막 지명도 음역하고, ב의 장소 의미는 앞의 두 항과 동일하게 ‘~에 있는’으로 통일했습니다.
theological_decisions:
- issue: 지명 열거의 문체와 의미 보존
  chosen_reading: 동일한 분배 형식과 장소성을 유지해, 본문이 다윗이 보낸 선물의 수혜자 목록임을 드러내도록 했습니다.
  alternative_readings:
  - 지명만 나열하는 더 압축된 번역
  - ‘~에서’로만 옮기는 번역
  rationale: 이 절은 서술이 아니라 배분 대상의 목록이므로, 반복 구조와 수혜자성을 살리는 번역이 원문의 기능을 가장 잘 드러냅니다.
  doctrine_reference: 서술 기능 보존 원칙
