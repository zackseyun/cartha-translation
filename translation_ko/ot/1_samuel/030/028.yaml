    text: 히브리어의 전치사는 지명과 함께 ‘~에’ 또는 ‘~에서/그곳에 있는’으로 문맥에 따라 옮길 수 있습니다. 여기서는 각 마을의 주민을 가리키므로 ‘~에 있는 이들에게’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 각 지명 앞에 ‘그리고 ~에 있는 이들에게’라는 공식을 반복하여 각 마을의 수신자를 개별적으로 열거합니다.
    reason: lexical_alternative
