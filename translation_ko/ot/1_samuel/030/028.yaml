  footnotes:
  - marker: a
    text: 히브리어의 위치 전치사는 문맥에 따라 ‘~에’ 또는 ‘~에서’로 옮길 수 있으나, 여기서는 마을의 주민을 가리키는 표현으로 이해해 ‘~에 있는 사람들에게’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 각 지명 앞에 ‘그리고 ~에 있는 사람들에게’라는 공식을 반복하여, 각 마을의 수신자를 하나씩 강조합니다.
    reason: lexical_alternative
