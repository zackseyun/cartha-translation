  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/בֹ֨א דָוִ֧ד וַ/אֲנָשָׁ֛י/ו צִֽקְלַ֖ג בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וַ/עֲמָלֵקִ֣י פָֽשְׁט֗וּ אֶל נֶ֨גֶב֙ וְ/אֶל צִ֣קְלַ֔ג וַ/יַּכּוּ֙ אֶת צִ֣קְלַ֔ג וַ/יִּשְׂרְפ֥וּ אֹתָ֖/הּ בָּ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/001.yaml
  text: Now when David and his men came to Ziklag on the third day[a], the Amalekites had made a raid against the Negev and against Ziklag, and they had struck Ziklag and burned it with fire.
  footnotes:
  - marker: a
    text: Or, 'had raided the South'; Hebrew negev can denote either the southern region in general or the specific area known as the Negev.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗과 그의 부하들이 사흘째에 시글락에 이르렀을 때, 아말렉 사람들이 네겝과 시글락을 습격하여 시글락을 치고 불로 태워 버렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּבֹא
  english_pob_choice: Now when ... came
  chosen_korean: '...에 이르렀을 때'
  alternatives_korean:
  - '...에 왔을 때'
  - '...에 도착했을 때'
  lexicon: HALOT
  rationale: 서술 도입의 시간적 배경을 자연스럽게 살리면서, 사건의 동시/선행 관계를 한국어 '-았을 때'로 간명하게 반영했습니다.
- source_word: וַאֲנָשָׁיו
  english_pob_choice: and his men
  chosen_korean: 그의 부하들
  alternatives_korean:
  - 그의 사람들
  - 그와 함께한 사람들
  lexicon: HALOT
  rationale: 다윗의 전투 동반자들을 가리키므로 일반적인 '사람들'보다 군사적 관계가 드러나는 '부하들'이 문맥에 맞습니다.
- source_word: פָשְׁטוּ
  english_pob_choice: had made a raid against
  chosen_korean: 습격하여
  alternatives_korean:
  - 공격하여
  - 약탈하여
  lexicon: HALOT
  rationale: פשט는 이 군사 문맥에서 '급습하다/습격하다'의 뜻이 강하므로, 약탈의 결과보다 공격 행위를 전면에 두는 '습격하여'를 택했습니다.
- source_word: וַיַּכּוּ אֶת צִקְלַג
  english_pob_choice: they had struck Ziklag
  chosen_korean: 시글락을 치고
  alternatives_korean:
  - 시글락을 공격하고
  - 시글락을 때리고
  lexicon: HALOT
  rationale: נכה의 폭넓은 의미를 유지하면서 한국어에서 전투 행위를 자연스럽게 드러내는 '치다'를 사용했습니다.
- source_word: וַיִּשְׂרְפוּ אֹתָהּ בָּאֵשׁ
  english_pob_choice: and burned it with fire
  chosen_korean: 불로 태워 버렸습니다
  alternatives_korean:
  - 불에 태웠습니다
  - 불로 불살랐습니다
  lexicon: HALOT
  rationale: 히브리어의 '불로/불에'라는 강한 파괴 표현을 살리되, 현대 한국어에서 자연스럽고 완결적인 파괴 의미를 주는 표현으로 옮겼습니다.
