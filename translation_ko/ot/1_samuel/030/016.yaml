reference: 1 Samuel 30:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣רִדֵ֔/הוּ וְ/הִנֵּ֥ה נְטֻשִׁ֖ים עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ אֹכְלִ֤ים וְ/שֹׁתִים֙ וְ/חֹ֣גְגִ֔ים בְּ/כֹל֙ הַ/שָּׁלָ֣ל הַ/גָּד֔וֹל אֲשֶׁ֥ר לָקְח֛וּ מֵ/אֶ֥רֶץ פְּלִשְׁתִּ֖ים וּ/מֵ/אֶ֥רֶץ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/016.yaml
  text: When he had led him down[a], behold, they were spread out over the face of all the land[b], eating and drinking and celebrating over all the great spoil that they had taken from the land of the Philistines and from the land of Judah.
  footnotes:
  - marker: a
    text: Or 'scattered over all the land.' The Hebrew participle can emphasize either dispersion or broad spread.
    reason: lexical_alternative
  - marker: b
    text: Or 'celebrating over all the great spoil.' The preposition may be understood as indicating the occasion or basis of their revelry.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그를 이끌고 내려가자, 보십시오, 그들은 온 땅의 곳곳에 흩어져 있었는데, 먹고 마시며 그들이 블레셋 사람들의 땅과 유다의 땅에서 빼앗아 온 그 큰 전리품을 두고 즐기고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘흩어져 있었는데’는 히브리어 분사의 분산 상태를 살린 번역입니다. ‘온 땅에 퍼져 있었다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두고’는 히브리어 전치사 בְּ를 상황적·기준적 의미로 이해한 번역입니다. ‘때문에’ 또는 ‘위하여’로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרִדֵהוּ
  english_pob_choice: When he had led him down
  chosen_korean: 그가 그를 이끌고 내려가자
  alternatives_korean:
  - 그가 그를 데리고 내려가자
  - 그가 그를 내려보내자
  lexicon: HALOT
  rationale: Hiphil ירד의 ‘내려가게 하다/이끌고 내려가다’라는 방향성을 살리면서, 한국어 서술문에서는 ‘이끌고 내려가자’가 자연스럽고 장면 전환도 잘 드러냅니다.
- source_word: נְטֻשִׁים עַל פְּנֵי כָל הָאָרֶץ
  english_pob_choice: they were spread out over the face of all the land
  chosen_korean: 온 땅의 곳곳에 흩어져 있었는데
  alternatives_korean:
  - 온 땅에 퍼져 있었는데
  - 온 땅 위에 널려 있었는데
  lexicon: HALOT
  rationale: פעלת형 분사로 묘사된 넓게 퍼짐/흩어짐을 살리되, ‘온 땅의 곳곳’으로 한국어에서 더 자연스러운 분포감을 주었습니다.
- source_word: וְחֹגְגִים
  english_pob_choice: celebrating
  chosen_korean: 즐기고 있었습니다
  alternatives_korean:
  - 축제하고 있었습니다
  - 잔치를 벌이고 있었습니다
  lexicon: HALOT
  rationale: 앞에 이미 ‘먹고 마시며’가 있어, חֹגְגִים를 ‘잔치하다’로만 좁히기보다 전반적 흥겨운 향유를 나타내는 ‘즐기다’가 문맥에 맞습니다.
- source_word: בְּכֹל הַשָּׁלָל הַגָּדוֹל
  english_pob_choice: over all the great spoil
  chosen_korean: 그들이 … 빼앗아 온 그 큰 전리품을 두고
  alternatives_korean:
  - 그 큰 노획물을 가지고
  - 그 큰 전리품 때문에
  lexicon: HALOT
  rationale: 여기서 ב는 단순 원인보다 ‘~을 두고/그것을 소재로’ 하는 즐김의 근거를 나타내므로, 한국어도 ‘두고’로 그 상황성을 자연스럽게 반영했습니다. ‘전리품’은 군사적 맥락을 분명히 합니다.
theological_decisions:
- issue: 지시성 표현 וְהִנֵּה 의 처리
  chosen_reading: 보십시오
  alternative_readings:
  - 보라
  - 그런데
  rationale: 서술 중 화자의 시선을 갑자기 장면으로 돌리는 감탄/주의 환기 기능을 한국어 현대 문체에서 가장 직접적으로 살리기 위해 ‘보십시오’로 옮겼습니다.
  doctrine_reference: narrative discourse; no doctrinal issue
