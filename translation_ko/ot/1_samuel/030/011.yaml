  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּמְצְא֤וּ אִישׁ מִצְרִי֙ בַּ/שָּׂדֶ֔ה וַ/יִּקְח֥וּ אֹת֖/וֹ אֶל דָּוִ֑ד וַ/יִּתְּנוּ ל֥/וֹ לֶ֨חֶם֙ וַ/יֹּ֔אכַל וַ/יַּשְׁקֻ֖/הוּ מָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/011.yaml
  text: They found an Egyptian man in the field and brought him to David[a]. They gave him bread, and he ate[c][b], and they gave him water to drink.
  footnotes:
  - marker: a
    text: Or, 'in the field.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'and took him to David.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'and they caused him to drink water.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 들에서 한 이집트 사람을 발견하고 그를 다윗에게 데려왔습니다[a]. 그들은 그에게 떡을 주었고, 그는 먹었으며[c][b], 그들이 그에게 물을 마시게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘들에서’.
    reason: alternative_reading
  - marker: b
    text: 또는, ‘그를 다윗에게 데리고 갔습니다’.
    reason: alternative_reading
  - marker: c
    text: 직역하면, ‘그가 물을 마시게 되도록 했다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מִצְרִי
  english_pob_choice: an Egyptian man
  chosen_korean: 한 이집트 사람
  alternatives_korean:
  - 한 이집트인
  - 이집트 사람 한 명
  lexicon: HALOT
  rationale: אִישׁ의 ‘사람/남자’와 מִצְרִי의 민족 표지를 함께 살리되, 한국어에서는 자연스럽게 ‘이집트 사람’으로 옮기는 것이 가장 직접적입니다.
- source_word: בַּשָּׂדֶה
  english_pob_choice: in the field
  chosen_korean: 들에서
  alternatives_korean:
  - 밭에서
  - 들판에서
  lexicon: HALOT
  rationale: שָׂדֶה는 기본적으로 ‘들/밭/필드’ 범위를 가지며, 여기서는 야외의 개활지를 자연스럽게 드러내는 ‘들’이 무난합니다.
- source_word: וַיִּקְחוּ אֹתוֹ אֶל דָּוִד
  english_pob_choice: and brought him to David
  chosen_korean: 그를 다윗에게 데려왔습니다
  alternatives_korean:
  - 그를 다윗에게 데리고 갔습니다
  - 그를 다윗에게 데려갔습니다
  lexicon: HALOT
  rationale: לָקַח + 인물 + 목적지는 ‘데려오다/데려가다’ 모두 가능하지만, 화자의 초점이 다윗 쪽에 있으므로 ‘데려왔습니다’가 자연스럽습니다.
- source_word: וַיַּשְׁקֻהוּ מָיִם
  english_pob_choice: and they gave him water to drink
  chosen_korean: 그들이 그에게 물을 마시게 했습니다
  alternatives_korean:
  - 그에게 물을 주었습니다
  - 그에게 물을 마시도록 했습니다
  lexicon: HALOT
  rationale: הִשְׁקָה는 단순 제공이 아니라 ‘마시게 하다’는 사역 의미가 있으므로, 그 강제를 직접 드러내는 표현을 택했습니다.
