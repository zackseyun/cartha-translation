id: 1SA.30.12
reference: 1 Samuel 30:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתְּנוּ ל/וֹ֩ פֶ֨לַח דְּבֵלָ֜ה וּ/שְׁנֵ֤י צִמֻּקִים֙ וַ/יֹּ֔אכַל וַ/תָּ֥שָׁב רוּח֖/וֹ אֵלָ֑י/ו כִּ֠י לֹֽא אָ֤כַל לֶ֨חֶם֙ וְ/לֹא שָׁ֣תָה מַ֔יִם שְׁלֹשָׁ֥ה יָמִ֖ים וּ/שְׁלֹשָׁ֥ה לֵילֽוֹת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/012.yaml
  text: They gave him a piece of fig cake and two clusters of raisins[a], and he ate, and his spirit returned to him[c][b], for he had not eaten bread or drunk water for three days and three nights.
  footnotes:
  - marker: a
    text: Or 'his strength returned to him' or 'he revived'; literally, 'his spirit returned to him.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term refers to a pressed cake made from figs.
    reason: cultural_note
  - marker: c
    text: Or possibly 'two cakes of raisins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 무화과 과자 한 조각과 건포도 두 송이를 주니, 그는 그것을 먹고 기운이 그에게 돌아왔습니다. 그는 사흘 낮과 사흘 밤 동안 빵도 먹지 못했고 물도 마시지 못했기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דְּבֵלָה는 무화과를 압착해 만든 식품을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘그의 영이 그에게 돌아왔다’입니다.
    reason: source_note
  - marker: c
    text: 또는 ‘그가 소생했다’, ‘그의 기력이 회복되었다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶלַח דְּבֵלָה
  english_pob_choice: a piece of fig cake
  chosen_korean: 무화과 과자 한 조각
  alternatives_korean:
  - 무화과 압착과자 한 조각
  - 무화과 떡 한 조각
  lexicon: HALOT
  rationale: פֶלַח은 ‘조각/한 덩이’의 뜻이고 דְּבֵלָה는 무화과를 압착한 식품이어서, 한국어에서는 자연스러운 식품명인 ‘무화과 과자’로 옮기되 ‘한 조각’으로 분량을 살렸습니다.
- source_word: שְׁנֵי צִמֻּקִים
  english_pob_choice: two clusters of raisins
  chosen_korean: 건포도 두 송이
  alternatives_korean:
  - 건포도 두 꾸러미
  - 건포도 두 덩이
  lexicon: HALOT
  rationale: צִמֻּקִים는 건포도를 가리키며, כאן의 수량 표현을 한국어의 자연스러운 묶음 단위인 ‘송이’로 옮겨 원문의 두 개라는 감각을 살렸습니다.
- source_word: וַתָּשָׁב רוּחוֹ אֵלָיו
  english_pob_choice: his spirit returned to him
  chosen_korean: 기운이 그에게 돌아왔습니다
  alternatives_korean:
  - 그의 영이 그에게 돌아왔습니다
  - 그가 기력을 회복했습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그의 영이 그에게 돌아왔다’이지만, 이 관용구는 회복/재생을 뜻하므로 한국어에서는 의미를 드러내는 ‘기운이 돌아오다’로 옮겼습니다.
- source_word: לֶחֶם ... מַיִם
  english_pob_choice: bread ... water
  chosen_korean: 빵 ... 물
  alternatives_korean:
  - 음식 ... 물
  - 떡 ... 물
  lexicon: HALOT
  rationale: לֶחֶם과 מַיִם의 대비를 살리기 위해 구체적인 기본식인 ‘빵’과 ‘물’을 유지했습니다.
theological_decisions:
- issue: רוּחַ의 의미를 ‘영’이 아닌 ‘기운’으로 옮길지 여부
  chosen_reading: 이 문맥에서는 생리적 쇠약에서 회복되는 뜻이 강하므로 ‘기운이 돌아왔습니다’로 번역했습니다.
  alternative_readings:
  - 그의 영이 그에게 돌아왔습니다
  - 그가 소생했습니다
  rationale: 히브리어 관용구를 너무 문자적으로 살리면 현대 한국어에서 오해될 수 있어, 본문의 회복 의미를 분명히 전달했습니다.
  doctrine_reference: 문맥상 인체의 활력 회복을 말하는 표현
