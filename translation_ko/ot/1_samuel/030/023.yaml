source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד לֹֽא תַעֲשׂ֥וּ כֵ֖ן אֶחָ֑/י אֵ֠ת אֲשֶׁר נָתַ֨ן יְהוָ֥ה לָ֨/נוּ֙ וַ/יִּשְׁמֹ֣ר אֹתָ֔/נוּ וַ/יִּתֵּ֗ן אֶֽת הַ/גְּד֛וּד הַ/בָּ֥א עָלֵ֖י/נוּ בְּ/יָדֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/023.yaml
  text: But David said[a], “You must not do so, my brothers, with what Yahweh has given us[c][b]. He has preserved us and has given into our hand the raiding band that came against us.”
  footnotes:
  - marker: a
    text: Or 'regarding what the LORD has given us.' The Hebrew construction is somewhat compressed and introduces the matter David is discussing.
    reason: lexical_alternative
  - marker: b
    text: Or 'He has kept us' or 'He protected us.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'into our hand,' an idiom for giving someone into another's power.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 말했습니다. "그렇게 해서는 안 됩니다, 내 형제들이여. 야훼께서 우리에게 주신 것과, 우리를 지켜 주셨고, 우리에게 맞서 온 그 약탈대를 우리 손에 넘겨 주신 것을 두고는 그렇습니다."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "야훼께서 우리에게 주신 것에 관하여". 히브리어 구조는 다윗이 다루는 주제를 압축적으로 도입합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 "우리를 지키셨고" / "우리를 보호하셨고".
    reason: lexical_alternative
  - marker: c
    text: 직역하면 "우리 손에"입니다. 이는 누군가를 다른 이의 권세 아래 넘겨 준다는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ כֵן
  english_pob_choice: You must not do so
  chosen_korean: 그렇게 해서는 안 됩니다
  alternatives_korean:
  - 그렇게 하지 마십시오
  - 그렇게 하면 안 됩니다
  lexicon: HALOT
  rationale: 복수 대상에게 주는 직접 금지를 현대 한국어의 자연스러운 강한 금지로 옮겼습니다. '해야 합니다'류보다 반박과 제지의 뉘앙스를 살립니다.
- source_word: אֶחָי
  english_pob_choice: my brothers
  chosen_korean: 내 형제들이여
  alternatives_korean:
  - 내 형제들이여
  - 내 형제들아
  - 내 형제들이
  lexicon: HALOT
  rationale: 히브리어의 친족적 호칭을 살리되, 합쇼체 서술 속에서 직접 호명되는 말투가 드러나도록 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서 기본값에 따라 신명기를 지칭하는 고유명칭을 '야훼'로 옮겨, 일반 호칭 '주님'과 구별했습니다.
- source_word: וַיִּשְׁמֹר אֹתָנוּ
  english_pob_choice: He has preserved us
  chosen_korean: 우리를 지켜 주셨고
  alternatives_korean:
  - 우리를 보존하셨고
  - 우리를 지키셨고
  - 우리를 보호하셨고
  lexicon: HALOT
  rationale: שׁמר의 보호·보존 의미를 함께 살리면서 한국어에서 전투 상황에 자연스러운 '지켜 주시다'로 옮겼습니다. 앞뒤 병렬을 위해 과거 완료적 뉘앙스는 유지하되 문장은 매끄럽게 했습니다.
- source_word: בְּיָדֵינוּ
  english_pob_choice: into our hand
  chosen_korean: 우리 손에 넘겨 주신
  alternatives_korean:
  - 우리 손에
  - 우리의 손에
  - 우리 권세 아래
  lexicon: HALOT
  rationale: 히브리어 관용구 '손에'를 직역하되, 한국어에서는 단순 위치보다 '넘겨 주다'가 통제권 이양을 더 분명히 드러냅니다. 그래서 문맥상 자연스러운 동사로 풀었습니다.
theological_decisions:
- issue: 야훼의 이름을 일반 호칭으로 순화하지 않기
  chosen_reading: 본문의 יְהוָה는 '야훼'로 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 다윗이 전리품 분배를 두고 하나님의 주권적 은혜를 직접 언급하는 자리이므로, 고유한 언약 নাম을 보존하는 편이 본문 신학을 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
