lexical_decisions:
- source_word: וְ/לַ/אֲשֶׁר
  english_pob_choice: and to those
  chosen_korean: 그리고 …에 있는 사람들에게
  alternatives_korean:
  - 그리고 그들에게
  - 그리고 …에게
  lexicon: HALOT
  rationale: 이 표현은 앞선 수신자 목록을 이어 주는 관용적 결합이므로, 한국어에서는 장소를 수식하는 사람들로 풀어 ‘…에 있는 사람들’로 옮기는 것이 자연스럽습니다.
- source_word: בְּ/חֶבְרוֹן
  english_pob_choice: in Hebron
  chosen_korean: 헤브론에 있는
  alternatives_korean:
  - 헤브론의
  - 헤브론에서의
  lexicon: HALOT
  rationale: 지명과 함께 쓰인 전치사는 한국어에서 보통 위치를 나타내는 ‘-에 있는’으로 옮기는 것이 가장 무리 없습니다.
- source_word: הִתְהַלֶּךְ
  english_pob_choice: had gone about
  chosen_korean: 다녔던
  alternatives_korean:
  - 오가던
  - 두루 다녔던
  - 여기저기 다녔던
  lexicon: HALOT
  rationale: 히트파엘 הלך의 반복적·순환적 이동 의미를 살려, 단순한 ‘걸었다’보다 장소들을 두루 다닌 뉘앙스가 나는 과거 관형형으로 옮겼습니다.
- source_word: וַ/אֲנָשָׁיו
  english_pob_choice: and his men
  chosen_korean: 그의 사람들이
  alternatives_korean:
  - 그의 부하들이
  - 그의 부하 사람들
  - 그의 남자들이
  lexicon: HALOT
  rationale: 문맥상 다윗의 동반자/전투집단을 가리키므로, 보다 자연스러운 한국어로 ‘그의 사람들’이라 하되 군사적 맥락을 해치지 않도록 유지했습니다.
