base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/002.yaml
  text: They took captive the women who were in it[a], from small to great. They did not kill anyone, but led them away and went on their way.
  footnotes:
  - marker: a
    text: Or 'from young to old.' The Hebrew idiom 'from small to great' can denote the whole range without exception.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍에 있던 여자들을, 작은 자부터 큰 자까지 모두 사로잡았습니다. 그들은 누구도 죽이지 않고, 그들을 끌고 가서 자기 길을 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 '작은 자부터 큰 자까지'라는 관용구로, 예외 없는 전체 범위를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  english_pob_choice: They took captive
  chosen_korean: 사로잡았습니다
  alternatives_korean:
  - 포로로 잡았습니다
  - 붙잡았습니다
  lexicon: HALOT
  rationale: 전쟁 상황에서 사람들을 강제로 포로로 삼는 뜻을 살리기 위해, 자연스러운 현대 한국어로 '사로잡다'를 선택했습니다.
- source_word: הַנָּשִׁים
  english_pob_choice: the women
  chosen_korean: 여자들을
  alternatives_korean:
  - 여인들을
  - 여성들을
  - 아내들을
  lexicon: HALOT
  rationale: 히브리어는 여기서 넓게 '여자들'을 뜻하며, 문맥상 아내들도 포함될 수 있지만 단어 자체를 좁혀 옮기지 않았습니다.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  english_pob_choice: from small to great
  chosen_korean: 작은 자부터 큰 자까지
  alternatives_korean:
  - 어린 자부터 늙은 자까지
  - 가장 작은 자부터 가장 큰 자까지
  lexicon: HALOT
  rationale: 이 관용구는 예외 없는 전체 범위를 나타내므로, 영어 POB의 직역성을 유지하면서도 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: לֹא הֵמִיתוּ אִישׁ
  english_pob_choice: They did not kill anyone
  chosen_korean: 누구도 죽이지 않고
  alternatives_korean:
  - 아무도 죽이지 않고
  - 사람 하나도 죽이지 않고
  lexicon: HALOT
  rationale: אִישׁ가 특정한 '남자'가 아니라 불특정 개인을 가리키므로, '누구도'로 옮겨 의미를 분명히 했습니다.
- source_word: וַיִּנְהֲגוּ
  english_pob_choice: led them away
  chosen_korean: 그들을 끌고 가서
  alternatives_korean:
  - 그들을 몰고 가서
  - 그들을 데려가서
  lexicon: HALOT
  rationale: 강제로 이동시키는 뉘앙스를 살리기 위해 '끌고 가다'를 택했고, 포로들을 주체적으로 데려간다는 뜻으로 약화되지 않게 했습니다.
- source_word: וַיֵּלְכוּ לְדַרְכָּם
  english_pob_choice: went on their way
  chosen_korean: 자기 길을 갔습니다
  alternatives_korean:
  - 자기 길로 갔습니다
  - 그 길로 떠났습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 종결 표현으로 옮겨, 단순한 이동이 아니라 그들이 계속 진행했음을 드러냈습니다.
theological_decisions:
- issue: 전투 약탈 서술의 직설성 유지
  chosen_reading: 피해 사실을 완화하지 않고, '사로잡았습니다'와 '누구도 죽이지 않고'를 그대로 살렸습니다.
  alternative_readings:
  - 완곡하게 '데려갔습니다'로 낮추는 번역
  - 해석을 덧붙여 상황을 부드럽게 만드는 번역
  rationale: 본문은 사울 무리의 약탈과 포로화라는 역사적 사실을 서술하므로, 독자의 윤리적 불편을 줄이기 위해 의미를 희석하지 않는 것이 적절합니다.
  doctrine_reference: 성경 서술의 역사성 및 본문 직시 원칙
