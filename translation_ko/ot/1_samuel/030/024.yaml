  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִי֙ יִשְׁמַ֣ע לָ/כֶ֔ם לַ/דָּבָ֖ר הַ/זֶּ֑ה כִּ֞י כְּ/חֵ֣לֶק הַ/יֹּרֵ֣ד בַּ/מִּלְחָמָ֗ה וּֽ/כְ/חֵ֛לֶק הַ/יֹּשֵׁ֥ב עַל הַ/כֵּלִ֖ים יַחְדָּ֥ו יַחֲלֹֽקוּ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/024.yaml
  text: And who will listen to you in this matter? For as is the share of the one who goes down into the battle[a], so is the share of the one who stays by the supplies[b]; together they shall divide.
  footnotes:
  - marker: a
    text: Or 'will heed you'—the Hebrew verb can mean 'listen to,' 'heed,' or 'obey' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the one who stays by the baggage/equipment.' The Hebrew term can refer broadly to articles, gear, or supplies.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 일에 대해 누가 여러분의 말을 들으려 하겠습니까? 전장에 내려가는 사람의 몫이 그러하듯, 보급품 곁에 머무는 사람의 몫도 그러합니다. 함께 나누어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘듣다’는 여기서 ‘귀 기울이다’ 또는 ‘받아들이다’의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘보급품’은 히브리어가 가리킬 수 있는 장비, 물자, 짐의 넓은 범위를 문맥에 맞게 좁혀 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי יִשְׁמַע לָכֶם
  english_pob_choice: And who will listen to you
  chosen_korean: 그리고 이 일에 대해 누가 여러분의 말을 들으려 하겠습니까?
  alternatives_korean:
  - 누가 여러분에게 귀를 기울이겠습니까?
  - 누가 여러분의 말을 듣겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문의 반박성을 살리면서, שׁמע의 ‘듣다/귀 기울이다’ 뉘앙스를 한국어 자연문으로 옮겼습니다. ‘여러분의 말’은 לָכֶם을 대상화하여 단순한 청각이 아니라 수용 여부를 드러냅니다.
- source_word: לַדָּבָר הַזֶּה
  english_pob_choice: in this matter
  chosen_korean: 이 일에 대해
  alternatives_korean:
  - 이 문제에 대해
  - 이 제안에 대해
  lexicon: HALOT
  rationale: דָּבָר는 여기서 단순한 ‘말’보다 논쟁 중인 사안/제안을 가리키므로, 현대 한국어에서 가장 자연스럽게 그 기능을 드러내는 ‘이 일’로 옮겼습니다.
- source_word: הַיֹּרֵד בַּמִּלְחָמָה
  english_pob_choice: the one who goes down into the battle
  chosen_korean: 전장에 내려가는 사람
  alternatives_korean:
  - 전투에 내려가는 사람
  - 전투에 나가는 사람
  lexicon: HALOT
  rationale: יִרַד의 ‘내려가다’라는 동작을 살리면서, מלחמה를 전투/전장으로 이해될 수 있는 문맥에서 ‘전장’으로 옮겨 히브리어의 관용을 보존했습니다.
- source_word: הַיֹּשֵׁב עַל הַכֵּלִים
  english_pob_choice: the one who stays by the supplies
  chosen_korean: 보급품 곁에 머무는 사람
  alternatives_korean:
  - 장비 곁에 머무는 사람
  - 짐 곁에 머무는 사람
  lexicon: HALOT
  rationale: כֵּלִים의 의미 범위가 넓지만, 이 문맥에서는 뒤에 남겨 둔 물자/장비를 가리키므로 ‘보급품’이 기능적으로 가장 분명합니다. ‘머무는’은 יֹשֵׁב의 기본 뜻을 자연스럽게 반영합니다.
- source_word: יַחְדָּו יַחֲלֹקוּ
  english_pob_choice: together they shall divide
  chosen_korean: 함께 나누어야 합니다.
  alternatives_korean:
  - 동등하게 나누어야 합니다.
  - 함께 몫을 나누어야 합니다.
  lexicon: HALOT
  rationale: יַחְדָּו와 יַחֲלֹקוּ의 공동·평등 분배를 한국어의 간결한 명령/당위 표현으로 옮겼습니다. 문맥상 선언이므로 ‘나누어야 합니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 전리품 분배의 공평성
  chosen_reading: 전투에 직접 내려간 사람과 뒤에 남아 보급품을 지킨 사람의 몫을 동일하게 보아야 한다는 원칙을 그대로 드러냈습니다.
  alternative_readings:
  - 참여도에 따른 차등 분배로 완화하는 읽기
  - 단순한 공동 분배 규칙으로 일반화하는 읽기
  rationale: 본문은 다윗이 전리품을 ‘함께’ 나누도록 정당화하는 규범적 발언이므로, 군사적 기여 차이를 근거로 한 차등 논리를 지우지 않고 평등 분배 원칙을 보존해야 합니다.
  doctrine_reference: 1 Samuel 30:24의 서사적·윤리적 맥락
