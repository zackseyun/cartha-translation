lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: WLC narrative waw-consecutive
  rationale: 와우 연속형은 서술의 진행을 표시하므로, 한국어에서는 자연스러운 순차 전개를 살려 ‘그러자’로 옮겼습니다.
- source_word: מַה
  english_pob_choice: What
  chosen_korean: 무엇을
  alternatives_korean:
  - 무슨
  - 어떤
  lexicon: HALOT
  rationale: 이 구문에서는 단순 의문사보다 상대적으로 열려 있는 요청의 뉘앙스가 있어, 질문의 직접성을 살린 ‘무엇을’이 본문 구조에 가장 가깝습니다.
- source_word: תֹּאמַר נַפְשְׁךָ
  english_pob_choice: What does your soul say?
  chosen_korean: 당신의 마음이 무엇을 말합니까?
  alternatives_korean:
  - 당신의 영혼이 무엇을 말합니까?
  - 당신의 소원이 무엇입니까?
  lexicon: HALOT / נפש idiom
  rationale: נפש는 여기서 문자적으로 ‘영혼’이라기보다 내면의 자아·의향을 가리키므로, 한국어 독자가 오해하지 않도록 ‘마음’으로 옮기되, 원문의 ‘말하다’라는 표현은 유지했습니다.
- source_word: וְאֶעֱשֶׂה לָּךְ
  english_pob_choice: I will do it for you.
  chosen_korean: 제가 그것을 당신을 위해 하겠습니다
  alternatives_korean:
  - 제가 당신을 위해 그렇게 하겠습니다
  - 제가 그것을 해 드리겠습니다
  lexicon: HALOT
  rationale: עשה의 기본 의미인 ‘하다’를 유지하고, 목적어는 히브리어의 생략된 대상을 반영하여 ‘그것’으로 보완했습니다. לָּךְ는 단순 방향이 아니라 유익을 위한 약속이므로 ‘당신을 위해’가 적절합니다.
theological_decisions:
- issue: נפש의 인체-내면 표현
  chosen_reading: ‘당신의 마음’으로 옮겨, 내면의 소망·의향을 묻는 말로 이해하게 했습니다.
  alternative_readings:
  - ‘당신의 영혼’으로 직역
  - ‘당신의 소원’으로 의역
  rationale: 이 절은 신학 교리 논쟁보다 히브리어 관용구의 의미 전달이 핵심입니다. 한국어에서 ‘영혼’은 과도하게 형이상학적으로 들릴 수 있어, 본문의 실제 기능인 의향 문의를 드러내는 표현을 택했습니다.
  doctrine_reference: 히브리어 נפש의 관용적 용례
