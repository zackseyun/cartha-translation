source:
  edition: WLC
  text: וַ/יָּ֧קָם יְהוֹנָתָ֛ן מֵ/עִ֥ם הַ/שֻּׁלְחָ֖ן בָּ/חֳרִי אָ֑ף וְ/לֹא אָכַ֞ל בְּ/יוֹם הַ/חֹ֤דֶשׁ הַ/שֵּׁנִי֙ לֶ֔חֶם כִּ֤י נֶעְצַב֙ אֶל דָּוִ֔ד כִּ֥י הִכְלִמ֖/וֹ אָבִֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/034.yaml
  text: Then Jonathan rose from the table in fierce anger[a], and he ate no food on the second day of the month, because he was grieved over David, because his father had humiliated him.
  footnotes:
  - marker: a
    text: Or, 'on the second day of the new moon.' The Hebrew חֹדֶשׁ can mean 'month' or 'new moon'; here the context is the royal new-moon meal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 요나단은 격렬히 분노하여 식탁에서 일어났습니다. 그는 그 달 둘째 날[a]에 아무 음식도 먹지 않았습니다. 다윗을 두고 마음 아파했기 때문입니다. 그의 아버지가 그를 욕되게 했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신월의 둘째 날.’ 히브리어 חֹדֶשׁ은 ‘달’ 또는 ‘신월’을 뜻할 수 있으며, 여기서는 왕실에서 신월에 베푼 식사라는 맥락이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם ... מֵעִם הַשֻּׁלְחָן
  english_pob_choice: rose from the table
  chosen_korean: 식탁에서 일어났습니다
  alternatives_korean:
  - 자리에서 일어났습니다
  - 식사 자리에서 일어났습니다
  lexicon: HALOT
  rationale: קום의 서사적 동작을 자연스러운 한국어로 옮기되, 식사 자리라는 맥락은 ‘식탁’으로 살렸습니다.
- source_word: בָּחֳרִי אָף
  english_pob_choice: in fierce anger
  chosen_korean: 몹시 성난 마음으로
  alternatives_korean:
  - 격렬한 분노로
  - 불타는 분노로
  lexicon: HALOT
  rationale: 직역적 표현보다 감정의 강도와 내적 상태를 함께 드러내는 한국어로 옮겼습니다.
- source_word: וְלֹא אָכַל ... לֶחֶם
  english_pob_choice: he ate no food
  chosen_korean: 빵도 먹지 않았습니다
  alternatives_korean:
  - 음식도 먹지 않았습니다
  - 떡도 먹지 않았습니다
  lexicon: HALOT
  rationale: לֶחֶם을 식사 거절의 관용적 표현으로 보고, 한국어에서는 문맥상 가장 직접적인 ‘빵’으로 옮겼습니다.
- source_word: נֶעְצַב אֶל דָּוִד
  english_pob_choice: he was grieved over David
  chosen_korean: 다윗 때문에 마음이 아팠고
  alternatives_korean:
  - 다윗 때문에 근심했고
  - 다윗을 두고 슬퍼했고
  lexicon: HALOT
  rationale: נֶעְצַב의 고통·상심의 뉘앙스를 살리면서, אֶל דָּוִד를 관계적 대상이 드러나는 한국어로 옮겼습니다.
- source_word: הִכְלִמוֹ
  english_pob_choice: had humiliated him
  chosen_korean: 그를 욕되게 했기 때문입니다
  alternatives_korean:
  - 그를 수치스럽게 했기 때문입니다
  - 그를 모욕했기 때문입니다
  lexicon: HALOT
  rationale: כלם의 ‘수치 주다/망신 주다’ 의미를 공적·관계적 뉘앙스가 있는 ‘욕되게 하다’로 옮겼습니다.
theological_decisions:
- issue: 사울의 행위가 아들의 감정에 미친 결과를 어떻게 드러낼지
  chosen_reading: ‘그를 욕되게 했기 때문입니다’로 옮겨 사울의 행동이 단순한 말다툼이 아니라 수치와 모욕을 준 행위임을 드러냈습니다.
  alternative_readings:
  - ‘그를 모욕했기 때문입니다’
  - ‘그를 수치스럽게 했기 때문입니다’
  rationale: 본문의 히브리어는 공개적 수치 부여의 강한 의미를 가지므로, 서술의 윤리적 무게를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 본문 해석상 인물 관계와 언약적 충성의 긴장
