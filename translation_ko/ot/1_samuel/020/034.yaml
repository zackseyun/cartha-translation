- from: 그러자 요나단은 몹시 성난 마음으로 식탁에서 일어났습니다[a]. 그는 그 달 둘째 날에 빵도 먹지 않았는데, 다윗 때문에 마음이 아팠고, 그의 아버지가 그를 욕되게 했기 때문입니다.
