  - 평화가 있을 것입니다
  - 잘될 것입니다
  lexicon: HALOT
  rationale: 이 문맥의 שָׁלוֹם은 단순한 전쟁 부재보다 다윗의 안전과 안녕을 가리키므로, 예측적 표현으로 옮겼습니다.
- source_word: חָרֹה יֶחֱרֶה
  english_pob_choice: he becomes very angry
  chosen_korean: 몹시 화를 내면
  alternatives_korean:
  - 격노하면
  - 매우 분노하면
  lexicon: HALOT
  rationale: 어근 반복이 나타내는 강한 분노를 현대 한국어의 자연스러운 강조 표현으로 옮겼습니다.
- source_word: כָלְתָה הָרָעָה מֵעִמּוֹ
  english_pob_choice: evil has been determined by him
  chosen_korean: 야훼께서 정하신 것이 악인 줄
  alternatives_korean:
  - 그가 악을 완전히 결심한 줄
  - 악이 그에게서 완전히 결정된 줄
  lexicon: HALOT
  rationale: 본문의 핵심은 사울의 해악을 향한 확정된 의도이므로, POB의 주석적 독해를 반영하되 한국어에서는 판단의 결과를 분명히 드러내는 방식으로 옮겼습니다.
theological_decisions:
- issue: מֵעִמּוֹ와 כָלְתָה의 결합이 뜻하는 최종 의미
  chosen_reading: 사울이 다윗에게 해를 끼치기로 굳게 마음먹은 상태를 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 악이 그에게서 나왔다는 단순 진술
  - 악이 그와 함께 끝났다는 문자적 독해
  rationale: 영문 POB의 주석대로, כאן의 요지는 악의 기원 설명이 아니라 해를 끼치려는 확정된 결심입니다.
  doctrine_reference: 사무엘상 20:7 주석적 문맥
- issue: 야훼의 표기
  chosen_reading: יהוה를 야훼로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 용례에 따라 원어 신명 표기를 학술적으로 반영했습니다.
  doctrine_reference: POB 표기 원칙
