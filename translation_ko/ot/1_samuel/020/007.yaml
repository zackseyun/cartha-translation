base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/007.yaml
  text: If he says[a], ‘Good,’ there will be peace for your servant; but if he becomes very angry, know that evil has been determined by him.
  footnotes:
  - marker: a
    text: Or 'evil is fully determined from him,' that is, Saul has firmly resolved to do harm.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 「좋다」라고 말하면, 당신의 종에게는 평안이 있을 것입니다. 그러나 그가 몹시 화를 내면, 그가 악한 일을 이미 작정한 줄 아십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「악이 그에게서 완전히 결정되었다」. 곧 사울이 해를 끼치기로 굳게 결심했다는 뜻입니다.
    reason: lexical_alternative
