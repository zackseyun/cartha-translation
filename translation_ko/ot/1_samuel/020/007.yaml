base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/007.yaml
  text: If he says[a], ‘Good,’ there will be peace for your servant; but if he becomes very angry, know that evil has been determined by him.
  footnotes:
  - marker: a
    text: Or 'evil is fully determined from him,' that is, Saul has firmly resolved to do harm.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 「좋다」라고 말하면 당신의 종은 평안할 것입니다. 그러나 그가 몹시 화를 내면, 야훼께서 정하신 것이 악인 줄 아십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「악이 그에게서 완전히 결정되었다」, 곧 사울이 해를 끼치기로 굳게 결심했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: Good
  chosen_korean: 좋다
  alternatives_korean:
  - 잘됐다
  - 좋군
  lexicon: HALOT
  rationale: 사울의 짧은 승인 응답으로서, 형용사적 반응을 그대로 살린 간결한 감탄형이 자연스럽습니다.
- source_word: שָׁלוֹם
  english_pob_choice: there will be peace
  chosen_korean: 평안할 것입니다
