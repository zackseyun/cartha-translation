  - 떠남 돌 곁에
  lexicon: HALOT
  rationale: הָאָזֶל을 고유 지명/고정 명칭으로 보는 처리에 따라 음역을 유지했고, אֶבֶן은 이 문맥에서 자연스럽게 ‘돌’로 옮겼습니다.
