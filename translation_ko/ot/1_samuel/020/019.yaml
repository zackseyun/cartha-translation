  - 그 사건의 날에
  lexicon: HALOT
  rationale: 히브리어 표현이 다소 모호하므로, 본문이 가리키는 약속된 사건/일정을 반영하는 의미로 풀어 옮기되 직역의 뉘앙스는 각주로 보완했습니다.
