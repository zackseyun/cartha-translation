  rationale: ירד의 ‘내려가다’와 מְאֹד의 강세를 함께 살리되, 한국어에서는 ‘매우 급히’가 긴박한 행동 지시를 가장 자연스럽게 드러냅니다.
- source_word: בְּיוֹם הַמַּעֲשֶׂה
  english_pob_choice: on the day of the deed
  chosen_korean: 그 일을 위해
  alternatives_korean:
