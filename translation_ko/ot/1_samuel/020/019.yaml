    reason: lexical_alternative
  revision_rationale: 원문의 시간 표현을 회복하고, 숨었던 장소를 수식하는 관계절의 연결을 분명히 했습니다. 또한 잘못된 각주 표지를 바로잡고 난해한 ‘그 일의 날’ 및 에젤의 불확실성을 각주에 보존했습니다. (각주 a는 본문에서 ‘그 일의 날’ 뒤에 붙여야 합니다.)
