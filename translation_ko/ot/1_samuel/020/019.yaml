  text: On the third day[a], go down quickly and come to the place where you hid yourself on the day of the deed[b], and remain beside the stone Ezel.
  footnotes:
  - marker: a
    text: Hebrew 'on the day of the deed'; possibly 'on the day of the matter' or 'on the day of the business.' The phrase likely refers to the previously arranged affair or occasion.
    reason: lexical_alternative
  - marker: b
    text: '''Ezel'' is likely a place-name or fixed designation for the stone; the underlying Hebrew may be related to ''going'' or ''departure,'' but the exact sense is uncertain.'
    reason: lexical_alternative
translation:
  language: ko
  text: 셋째 날에는[ [a] ] 매우 급히 내려가서, 네가 그 일을 위해 숨었던 곳으로 가서, 에젤 돌 곁에 머무르십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그 일의 날’에 가깝고, 문맥상 앞서 약속된 일/사건을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּשְׁתָּ
  english_pob_choice: On the third day
  chosen_korean: 셋째 날에는
  alternatives_korean:
