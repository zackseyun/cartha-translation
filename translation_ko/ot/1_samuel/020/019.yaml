  source_fidelity: ‘그 일을 위해’는 בְּיוֹם הַמַּעֲשֶׂה(‘그 일/사건의 날에’)의 시간 표현을 목적·이유 표현으로 바꾸므로 수정이 필요합니다. 또한 נִסְתַּרְתָּ שָּׁם은 ‘거기 숨어 있던’으로, וְיָשַׁבְתָּ는 이 문맥에서 ‘머무르십시오’로 자연스럽게 옮길 수 있습니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽습니다. ‘에젤이라는 돌’은 에젤이 돌의 고정 명칭 또는 지명일 수 있다는 불확실성을 본문에서 과도하게 단정하지 않으면서도 한국어 문장으로 읽히게 합니다.
  terminology: ‘셋째 날’, ‘내려가’, ‘그 일의 날’, ‘돌 곁’은 원문의 핵심 어휘와 지시 관계를 보존합니다. 에젤은 음역하고 각주로 불확실성을 밝혀야 합니다.
  issues:
  - severity: high
    issue: בְּיוֹם הַמַּעֲשֶׂה의 의미가 ‘그 일을 위해’로 변경됨
    rationale: 원문은 ‘그 일/사건의 날에’라는 시간 부사구이며, 숨었던 때를 수식합니다. 목적을 뜻하는 ‘~을 위해’는 원문의 문법 및 의미를 바꿉니다.
  - severity: medium
    issue: 각주 표지가 ‘[ [a] ]’로 잘못 배치됨
    rationale: 표지 형식이 구조적으로 잘못되었고, 각주는 ‘그 일의 날’이라는 난해한 표현에 직접 붙어야 합니다.
  - severity: medium
    issue: 에젤의 의미 불확실성에 관한 각주가 없음
    rationale: הָאָזֶל은 고유 명칭/고정 명칭으로 보는 것이 안전하지만 정확한 뜻이 불확실하므로, 영어 POB의 어휘 불확실성 정보를 한국어 각주에도 보존해야 합니다.
  revised_text: 셋째 날에는 아주 급히 내려가서, 그 일의 날에 네가 거기 숨어 있던 곳으로 가서, 에젤이라는 돌[b] 곁에 머무르십시오.
  revised_footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그 일의 날에’이며, ‘일’은 행위, 사건, 사안을 뜻할 수 있습니다. 이 표현은 앞서 약속된 일이나 때를 가리키는 듯하지만 정확한 뜻은 분명하지 않습니다.
