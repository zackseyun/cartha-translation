  text: וַ/יֹּ֣אמֶר לְ/נַעֲר֔/וֹ רֻ֗ץ מְצָ֥א נָא֙ אֶת הַ֣/חִצִּ֔ים אֲשֶׁ֥ר אָנֹכִ֖י מוֹרֶ֑ה הַ/נַּ֣עַר רָ֔ץ וְ/הֽוּא יָרָ֥ה הַ/חֵ֖צִי לְ/הַעֲבִרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/036.yaml
  text: He said to his young man[a], “Run, please, find the arrows that I am shooting.” The young man ran, and he shot the arrow beyond him.
  footnotes:
  - marker: a
    text: Or “past him,” that is, beyond the young man.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 자기 시종에게 말했습니다. 「달려가서, 내가 쏘는 화살들을 찾아오너라」. 시종이 달려갔고, 그는 화살을 그 너머로 쏘았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 뒤를 지나서”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ / הַנַּעַר
  english_pob_choice: his young man / the young man
  chosen_korean: 그의 시종 / 시종
  alternatives_korean:
  - 그의 청년 / 청년
  - 그의 종 / 종
  lexicon: HALOT
  rationale: נַעַר는 여기서 연령과 지위가 함께 있는 수행원을 가리키므로, 관계를 분명히 하면서도 ‘종’처럼 지나치게 신분을 고정하지 않는 ‘시종’이 자연스럽습니다.
- source_word: רוּץ
  english_pob_choice: Run
  chosen_korean: 달려가다
  alternatives_korean:
  - 뛰어가다
  - 서둘러 가다
  lexicon: HALOT
  rationale: 명령형 רוּץ의 구체적 동작을 살리되, 한국어에서는 목적지를 동반하는 동사구 ‘달려가다’가 가장 자연스럽습니다.
- source_word: מְצָא נָא
  english_pob_choice: find, please
  chosen_korean: 찾아오너라
  alternatives_korean:
  - 부디 찾아오너라
  - 가서 찾아오너라
  lexicon: HALOT
  rationale: נָא의 공손/완화 기능은 명령을 부드럽게 하는 한국어 종결과 어순으로 반영하고, 동작의 결과를 포함해 ‘찾아오다’로 옮겼습니다.
- source_word: אֲשֶׁר אָנֹכִי מוֹרֶה
  english_pob_choice: that I am shooting
  chosen_korean: 내가 쏘는
  alternatives_korean:
  - 내가 쏘고 있는
  - 내가 쏠
  lexicon: HALOT
  rationale: מוֹרֶה는 활쏘기의 진행 중 동작을 가리키므로, 현재 진행형에 가까운 ‘내가 쏘는’이 원문 긴박감을 잘 전달합니다.
- source_word: לְהַעֲבִירוֹ
  english_pob_choice: beyond him
  chosen_korean: 그 너머로
  alternatives_korean:
  - 그를 지나쳐
  - 그의 뒤로
  lexicon: HALOT
  rationale: 히필 부정사절의 ‘지나가게 하다/넘기다’ 의미를 압축해, 화살이 시종을 지나 더 멀리 가게 함을 드러내는 ‘그 너머로’로 옮겼습니다.
theological_decisions:
- issue: 이 절의 동작 묘사가 암호적 신호로 기능하는지 여부
  chosen_reading: 겉으로는 활쏘기 지시이지만, 본문이 제공하는 직접 의미를 유지해 신호성은 서술의 맥락에서만 드러나게 했습니다.
  alternative_readings:
  - 암호 신호를 번역문 안에 더 분명히 드러내는 해석
  - 단순한 사냥/훈련 지시로 축소하는 해석
  rationale: 원문 자체는 행동을 직접 서술할 뿐이고, 암시적 의도는 문맥에서 읽히므로 번역은 과도한 해석을 피하는 것이 좋습니다.
  doctrine_reference: 서사 본문 해석 원칙; 문맥 우선
- issue: ‘시종’의 사회적 지위 표현
  chosen_reading: 관계와 역할을 드러내는 중립적 수행원 표현을 택해, 본문이 요구하는 수준 이상으로 노예화하지 않았습니다.
  alternative_readings:
  - ‘종’으로 더 일반화하는 해석
  - ‘노예’로 신분을 강하게 고정하는 해석
  rationale: 히브리어 נַעַר는 문맥에 따라 청년, 시동, 수행원, 종 등으로 넓게 쓰이므로, 여기서는 서사 기능에 맞는 중립적 표현이 적절합니다.
  doctrine_reference: 어휘 범위 보존; 사회적 지위 과잉확정 회피
