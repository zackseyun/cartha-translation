  text: וַ/יֹּֽאמֶר ל֥/וֹ יְהוֹנָתָ֖ן מָחָ֣ר חֹ֑דֶשׁ וְ/נִפְקַ֕דְתָּ כִּ֥י יִפָּקֵ֖ד מוֹשָׁבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/018.yaml
  text: Jonathan said to him[a], “Tomorrow is the new moon, and you will be missed, because your seat will be empty.”
  footnotes:
  - marker: a
    text: Or “you will be noticed … because your place will be missing/unoccupied.” The Hebrew repeats the verb פקד in both clauses, creating a wordplay that English cannot preserve neatly.
    reason: lexical_alternative
translation:
  language: ko
  text: 요나단이 그에게 말했습니다. 「내일은 초하루입니다. 당신은 그리울 것이고, 당신의 자리는 비게 될 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 פקד를 두 절에 반복해, “당신은 주목될 것입니다 … 당신의 자리는 비어 있을 것입니다”라는 말장난을 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לּוֹ יְהוֹנָתָן
  english_pob_choice: Jonathan said to him
  chosen_korean: 요나단이 그에게 말했습니다
  alternatives_korean:
  - 요나단이 그에게 말하였습니다
  - 요나단이 그에게 이르렀습니다
  lexicon: HALOT
  rationale: 서술 도입의 פשוט한 אמר 구문이므로 자연스러운 현대 서술체로 옮겼고, 대화 상대를 나타내는 לוֹ는 「그에게」로 분명히 했습니다.
- source_word: מָחָר חֹדֶשׁ
  english_pob_choice: Tomorrow is the new moon
  chosen_korean: 내일은 초하루입니다
  alternatives_korean:
  - 내일은 새 달입니다
  - 내일은 새 달맞이입니다
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘달’이 아니라 왕의 식사와 연결된 초하루 절기이므로, 한국어 성경에서 통용되면서도 제의적 맥락을 드러내는 「초하루」를 택했습니다.
- source_word: וְנִפְקַדְתָּ כִּי יִפָּקֵד מוֹשָׁבֶךָ
  english_pob_choice: you will be missed, because your seat will be empty
  chosen_korean: 당신은 그리울 것이고, 당신의 자리는 비게 될 것입니다
  alternatives_korean:
  - 당신은 빠질 것이고, 당신의 자리는 비게 될 것입니다
  - 당신은 주목될 것이고, 당신의 자리는 비게 될 것입니다
  lexicon: HALOT
  rationale: פקד의 반복은 영어 POB처럼 한 번의 단순 반복으로는 살리기 어려워, 첫 절은 관계적 의미의 「그리울 것이고」로, 둘째 절은 자리의 부재를 직접 드러내는 「비게 될 것입니다」로 옮겨 자연스러움과 의미를 함께 살렸습니다.
theological_decisions:
- issue: פקד 반복의 말장난을 한국어에서 어떻게 처리할지
  chosen_reading: 직역적 중복보다 의미 중심의 대비를 택해, 사람의 부재와 자리에 남는 공백을 분명히 드러냈습니다.
  alternative_readings:
  - 「주목될 것이고 … 당신의 자리는 비어 있을 것입니다」
  - 「기억될 것이고 … 당신의 자리는 없어질 것입니다」
  rationale: 히브리어는 동일 동사를 두 번 써서 말장난을 이루지만, 한국어에서 동일 어근 반복을 억지로 살리면 문장이 부자연스러워집니다. 따라서 본문이 청자에게 전달하려는 결과를 우선하여 읽히게 했습니다.
  doctrine_reference: 번역 원칙상 원문의 수사 효과를 보존하되, 한국어 자연성을 해치지 않는 범위에서 의미를 우선합니다.
