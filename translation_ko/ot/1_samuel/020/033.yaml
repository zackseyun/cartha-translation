base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/033.yaml
  text: Then Saul hurled the spear at him to strike him[a], and Jonathan knew that his father was determined to put David to death.
  footnotes:
  - marker: a
    text: Or, 'his father had resolved' / 'it was settled by his father.' The Hebrew idiom expresses a fixed, completed decision on Saul's part.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울이 그의 창을 다윗에게 던져 그를 치려 하였고, 요나단은 그의 아버지가 다윗을 죽이기로 이미 결정하였음을 알게 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아버지가 이미 결심하였음’ / ‘그의 아버지 쪽에서 이미 확정되었음’. 히브리어 관용구는 사울 쪽의 고정되고 완료된 결정을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּטֶל
  english_pob_choice: hurled
  chosen_korean: 던져
  alternatives_korean:
  - 내던져
  - 집어던져
  lexicon: HALOT
  rationale: 창을 향해 강하게 던지는 공격 행위이므로, 평이하지만 힘을 살린 ‘던져’로 옮겼습니다.
- source_word: הַחֲנִית
  english_pob_choice: the spear
  chosen_korean: 창
  alternatives_korean:
  - 창끝 무기
  - 투창
  lexicon: HALOT
  rationale: 사울의 무기는 한국어에서 자연스럽고 폭넓게 통용되는 ‘창’이 가장 적절합니다.
- source_word: לְהַכֹּתוֹ
  english_pob_choice: to strike him
  chosen_korean: 그를 치려
  alternatives_korean:
  - 그를 때리려
  - 그를 치기 위해
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사 구조를 살리면서, 공격의 의도를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: כָלָה הִיא מֵעִם אָבִיו
  english_pob_choice: his father was determined
  chosen_korean: 그의 아버지가 … 이미 결정하였음을
  alternatives_korean:
  - 그의 아버지가 … 끝내기로 하였음을
  - 그의 아버지 쪽에서 이미 굳어졌음을
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 심리 상태보다 ‘이미 끝난/확정된 결정’을 뜻하므로, 이를 한국어의 완료·확정 표현으로 살렸습니다.
- source_word: לְהָמִית אֶת דָּוִד
  english_pob_choice: to put David to death
  chosen_korean: 다윗을 죽이기로
  alternatives_korean:
  - 다윗을 죽이려
  - 다윗을 죽이도록
  lexicon: HALOT
  rationale: 의도된 처형적 살해를 드러내는 본문의 중한 어감을 유지하되, 한국어 문장 흐름에 맞게 간결하게 처리했습니다.
theological_decisions:
- issue: 사울의 의도 표명과 히브리어 완료 관용구
  chosen_reading: ‘이미 결정하였음’으로 옮겨, 사울의 살해 의도가 순간적 충동이 아니라 확정된 결심임을 드러냈습니다.
  alternative_readings:
  - ‘마음먹었음’
  - ‘굳게 결심하였음’
  rationale: 본문의 כָלָה הִיא מֵעִם אָבִיו는 결정이 이미 완료되어 굳어진 상태를 암시하므로, 이를 약화하지 않는 표현이 필요합니다.
  doctrine_reference: 본문 주해/서술 의미
