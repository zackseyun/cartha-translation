theological_decisions:
- issue: 사울의 의도 표명과 히브리어 완료 관용구
  chosen_reading: ‘이미 결정하였음’으로 옮겨, 사울의 살해 의도가 순간적 충동이 아니라 확정된 결심임을 드러냈습니다.
  alternative_readings:
  - ‘마음먹었음’
  - ‘굳게 결심하였음’
  rationale: 본문의 כָלָה הִיא מֵעִם אָבִיו는 결정이 이미 완료되어 굳어진 상태를 암시하므로, 이를 약화하지 않는 표현이 필요합니다.
  doctrine_reference: 본문 주해/서술 의미
