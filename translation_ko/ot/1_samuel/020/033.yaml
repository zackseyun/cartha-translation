  text: Then Saul hurled the spear at him to strike him[a], and Jonathan knew that his father was determined to put David to death.
  footnotes:
  - marker: a
    text: Or, 'his father had resolved' / 'it was settled by his father.' The Hebrew idiom expresses a fixed, completed decision on Saul's part.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울이 창을 요나단에게 던져 그를 치려 하였고, 요나단은 그의 아버지가 다윗을 죽이기로 이미 결정하였음을 알게 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아버지가 이미 결심하였음’ / ‘그의 아버지 쪽에서 이미 확정되었음’. 히브리어 관용구는 사울 쪽에서 결정이 확정되어 있음을 나타냅니다.
    reason: lexical_alternative
