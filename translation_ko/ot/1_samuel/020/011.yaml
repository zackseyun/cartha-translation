source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהֽוֹנָתָן֙ אֶל דָּוִ֔ד לְכָ֖/ה וְ/נֵצֵ֣א הַ/שָּׂדֶ֑ה וַ/יֵּצְא֥וּ שְׁנֵי/הֶ֖ם הַ/שָּׂדֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/011.yaml
  text: Then Jonathan said to David[a], “Come, and let us go out into the field.” So both of them went out into the field.
  footnotes:
  - marker: a
    text: Or “Go, and let us go out to the field.” The imperative לְכָה can be rendered more literally as “go,” but in this invitational context “come” is more natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요나단이 다윗에게 말했습니다. 「오십시오[a]. 우리가 들로 나갑시다.」 그리고 두 사람은 들로 나갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가십시오.’ 히브리어 לְכָה는 더 문자적으로 ‘가십시오’로 옮길 수 있으나, 함께 움직이자고 권하는 이 문맥에서는 ‘오십시오’가 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그가 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속은 서술의 진행과 결과를 드러내므로, 한국어에서는 자연스러운 순서를 살리는 「그러자」로 옮겼습니다.
- source_word: לְכָה
  english_pob_choice: Come
  chosen_korean: 오십시오
  alternatives_korean:
  - 가십시오
  - 오세요
  lexicon: HALOT
  rationale: 이 표현은 단순 이동 명령보다 함께 움직이자는 초대이므로, 합쇼체의 공손한 초대형인 「오십시오」가 가장 적절합니다.
- source_word: וְנֵצֵא
  english_pob_choice: and let us go out
  chosen_korean: 우리가 들로 나갑시다
  alternatives_korean:
  - 그리고 우리가 나갑시다
  - 그리고 들로 나가자
  lexicon: HALOT
  rationale: 청유형의 제안이므로 「-갑시다」가 자연스럽고, 목적지를 함께 넣어 동작의 방향을 분명히 했습니다.
- source_word: הַשָּׂדֶה
  english_pob_choice: the field
  chosen_korean: 들
  alternatives_korean:
  - 밭
  - 들판
  - 그 들
  lexicon: HALOT
  rationale: 여기서는 좁은 경작지보다 열린 야외를 가리키므로 「들」이 가장 간결하고 문맥에 맞습니다. 뒤의 반복도 같은 표현으로 유지했습니다.
