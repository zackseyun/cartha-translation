id: 1SA.20.9
reference: 1 Samuel 20:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹנָתָ֖ן חָלִ֣ילָ/ה לָּ֑/ךְ כִּ֣י אִם יָדֹ֣עַ אֵדַ֗ע כִּֽי כָלְתָ֨ה הָ/רָעָ֜ה מֵ/עִ֤ם אָבִ/י֙ לָ/ב֣וֹא עָלֶ֔י/ךָ וְ/לֹ֥א אֹתָ֖/הּ אַגִּ֥יד לָֽ/ךְ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/009.yaml
  text: Jonathan said[a], “Far be it from you! If I knew for certain that evil had been determined by my father to come upon you, would I not tell you?”
  footnotes:
  - marker: a
    text: Or 'the harm was fixed' / 'the evil was complete.' The Hebrew expression may denote that Saul's harmful intent had become settled or fully formed.
    reason: lexical_alternative
translation:
  language: ko
  text: 요나단이 말했습니다. 「그런 일이 결코 없을 것입니다! 만일 제 아버지가 당신에게 닥칠 악을 정하셨다는 것을 내가 분명히 알았다면, 내가 당신에게 알리지 않겠습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그런 일이 결코 없을 것입니다!’는 히브리어 관용구 חָלִילָה לָּךְ의 자연스러운 한국어 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לָּךְ
  english_pob_choice: Far be it from you!
  chosen_korean: 그런 일이 결코 없을 것입니다!
  alternatives_korean:
  - 그럴 리가 없습니다!
  - 당신에게서 그런 일은 멀리 있습니다!
  - 그런 일은 있을 수 없습니다!
  lexicon: HALOT
  rationale: 강한 거절과 부인을 나타내는 관용구이므로, 직역보다 자연스러운 강한 부정으로 옮겼습니다. 한국어에서는 원문의 2인칭 방향성을 드러내기보다 거절의 힘을 살리는 표현이 더 자연스럽습니다.
- source_word: יָדֹעַ אֵדַע
  english_pob_choice: I knew for certain
  chosen_korean: 내가 분명히 알았다면
  alternatives_korean:
  - 내가 확실히 알았다면
  - 내가 반드시 알았다면
  - 내가 참으로 알았다면
  lexicon: HALOT
  rationale: 부정사 절대형+동사형의 확언을 한국어의 ‘분명히’로 살렸습니다. 문맥상 가정법이므로 ‘알았다면’으로 처리했습니다.
- source_word: כָלְתָה הָרָעָה
  english_pob_choice: evil had been determined
  chosen_korean: 악을 정하셨다는
  alternatives_korean:
  - 악이 완결되었다는
  - 악이 굳어졌다는
  - 재앙이 확정되었다는
  lexicon: HALOT
  rationale: 문맥상 사울의 해로운 의도가 ‘결정되다/정해지다’는 의미가 핵심이므로, 추상적인 ‘악’이 주체에게서 ‘정해졌다’는 수동적 의미를 살렸습니다. 한국어에서는 ‘악을 정하다’보다 ‘악을 정하셨다’가 자연스럽고, 직전의 ‘제 아버지’와 연결됩니다.
- source_word: לָבוֹא עָלֶיךָ
  english_pob_choice: to come upon you
  chosen_korean: 당신에게 닥칠
  alternatives_korean:
  - 당신에게 임할
  - 당신에게 덮쳐 올
  - 당신 위에 올
  lexicon: HALOT
  rationale: עלה의 위협적 도착 이미지를 한국어의 ‘닥치다’로 옮겨 해악의 임박성과 공격성을 함께 살렸습니다.
theological_decisions:
- issue: יְהוֹנָתָן 화자와 경어 처리
  chosen_reading: 요나단의 직접화법은 서술문은 합쇼체로 유지하되, 인용문 안에서는 상대를 ‘당신’으로 부르는 정중한 반응을 유지했습니다.
  alternative_readings:
  - 인용문 전체를 평서체로 낮추는 방식
  - 인용문 안에서도 더 강한 비격식 표현을 쓰는 방식
  rationale: 본문은 장중한 서술과 긴박한 대화가 함께 있으므로, 현대 표준어 합쇼체를 유지하면서도 인물 간 긴장감이 드러나도록 했습니다.
  doctrine_reference: 문체·화자 재현 원칙
