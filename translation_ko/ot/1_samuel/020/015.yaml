revisions:
- from: 그리고 당신은 내 집에서 당신의 인애를 영원히 끊지 말아야 합니다[a]. 야훼께서 다윗의 원수들을 — 한 사람도 남김없이 — 땅의 표면에서 끊어 버리실 때에도 그러해야 합니다.
  to: 또한 내 집안에 베푸는 당신의 인애를 영원히 끊지 마십시오[a]. 야훼께서 다윗의 원수들을, 한 사람도 남김없이, 땅 위에서 끊으실 때에도 그렇게 하십시오.
  rationale: 직접 청원의 합쇼체를 자연스럽게 다듬고, ‘내 집’과 인애의 관계를 한국어 문법에 맞게 명료화했습니다. ‘끊다’를 두 절에 일관되게 사용하여 כרת의 반복을 보존했으며, 히브리어 관용구는 현대적이면서도 의미 손실이 적은 ‘땅 위에서’로 조정했습니다. 두 번째 절의 ‘때에도’는 원문의 강조와 연결을 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:27:42Z'
