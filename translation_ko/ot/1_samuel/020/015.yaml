  terminology: ‘야훼’, ‘인애’, ‘다윗의 원수들’, ‘영원히’는 적절합니다. ‘한 사람도 남김없이’는 אִישׁ의 분배적·강조적 효과를 자연스럽게 살립니다. 두 כרת는 ‘끊다’로 일관되게 옮기는 편이 원문의 반복을 더 잘 보존합니다.
