  source_fidelity: 핵심 의미와 두 차례의 כרת 반복, 그리고 두 번째 절의 ‘~할 때에도’라는 강조 연결은 대체로 잘 반영되어 있습니다. 다만 ‘내 집에서 당신의 인애를 끊다’는 한국어에서 관계의 대상을 표시하는 방식이 부자연스러워 מֵעִם בֵּיתִי의 뜻을 ‘내 집안에 베푸는’으로 명료하게 해야 합니다. 또한 ‘땅의 표면에서’는 히브리 관용구를 지나치게 직역한 표현입니다.
