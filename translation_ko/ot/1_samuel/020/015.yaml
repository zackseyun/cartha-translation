    rationale: מֵעִם בֵּיתִי는 다윗의 헤세드가 요나단의 집에서/집안으로부터 제거되지 않기를 청하는 말입니다. 한국어에서는 ‘내 집안에 베푸는 당신의 인애를 끊지 마십시오’가 그 관계를 자연스럽고 정확하게 드러냅니다.
