id: 1SA.20.15
reference: 1 Samuel 20:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא תַכְרִ֧ת אֶֽת חַסְדְּ/ךָ֛ מֵ/עִ֥ם בֵּיתִ֖/י עַד עוֹלָ֑ם וְ/לֹ֗א בְּ/הַכְרִ֤ת יְהוָה֙ אֶת אֹיְבֵ֣י דָוִ֔ד אִ֕ישׁ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/015.yaml
  text: And you shall not cut off your steadfast love from my house forever[a], not even when Yahweh cuts off David’s enemies, every one of them, from the face of the earth.
  footnotes:
  - marker: a
    text: Or 'your covenant loyalty' / 'your loyal love.' The Hebrew חֶסֶד often carries the sense of faithful love within a covenant relationship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신은 내 집에서 당신의 인애를 영원히 끊지 말아야 합니다[a]. 야훼께서 다윗의 원수들을 — 한 사람도 남김없이 — 땅의 표면에서 끊어 버리실 때에도 그러해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘언약적 신실함’ / ‘충성스러운 사랑’. 히브리어 חֶסֶד는 언약 관계 안의 신실한 사랑을 자주 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכְרִת / בְּהַכְרִת (כרת)
  english_pob_choice: cut off
  chosen_korean: 끊지 말아야 합니다 / 끊어 버리실 때
  alternatives_korean:
  - 거두지 말아야 합니다
  - 제거하지 말아야 합니다
  - 끊어내지 말아야 합니다
  lexicon: HALOT
  rationale: 같은 어근 כרת의 반복을 살려, 첫 절에서는 언약적 인애를 ‘끊지 말아야’로, 둘째 절에서는 야훼의 심판을 ‘끊어 버리실 때’로 대응시켜 원문의 말놀이와 긴장을 드러냈습니다.
- source_word: חַסְדְּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 인애
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 사랑
  - 충성스러운 사랑
  lexicon: HALOT
  rationale: חסד은 단순한 호의보다 언약 관계 안의 신실한 사랑을 가리키므로, 한국어 성경에서 널리 쓰이는 ‘인애’를 택하되, 문맥상 언약적 뉘앙스가 살아 있도록 했습니다.
- source_word: מֵעִם בֵּיתִי
  english_pob_choice: from my house
  chosen_korean: 내 집에서
  alternatives_korean:
  - 내 가문에서
  - 내 집안에서
  - 내 가족에게서
  lexicon: HALOT
  rationale: בַּיִת의 가문·왕조 의미를 유지하면서도 한국어에서 자연스러운 짧은 표현으로 ‘내 집’이 가장 직접적입니다.
- source_word: עַד עוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝까지
  - 영구히
  - 세세토록
  lexicon: HALOT
  rationale: 언약적 지속성을 나타내는 관용구로, 현대 한국어에서 가장 자연스러운 ‘영원히’를 사용했습니다.
- source_word: אֹיְבֵי דָוִד ... אִישׁ
  english_pob_choice: David’s enemies, every one of them
  chosen_korean: 다윗의 원수들을 — 한 사람도 남김없이
  alternatives_korean:
  - 다윗의 원수들을 — 모두
  - 다윗의 적들을 — 한 사람도 남김없이
  - 다윗의 원수들을 — 사람마다
  lexicon: HALOT
  rationale: אִישׁ의 분배적 용법을 살려 ‘한 사람도 남김없이’로 옮겨, 적들이 개별적으로 제거된다는 강조를 유지했습니다.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  english_pob_choice: from the face of the earth
  chosen_korean: 땅의 표면에서
  alternatives_korean:
  - 땅 위에서
  - 세상에서
  - 온 땅에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 직설성을 살리면서도 한국어에서 과도하게 낯설지 않도록 ‘땅의 표면에서’로 옮겼습니다.
theological_decisions:
- issue: חסד의 언약적 의미를 한국어에서 어떻게 드러낼지
  chosen_reading: 본문에는 ‘인애’를 두고, 언약적 관계의 함의는 문맥이 받쳐 주도록 했습니다.
  alternative_readings:
  - 언약적 사랑
  - 변함없는 사랑
  - 충성스러운 사랑
  rationale: 이 구절은 다윗과 요나단의 언약 맥락에 서 있지만, 본문 자체가 전문 용어식 해설을 요구하지는 않습니다. ‘인애’는 기존 성경어휘를 유지하면서도 언약적 사랑의 무게를 담습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: 두 번째 절의 זמן 절이 첫 청원과 어떻게 연결되는지
  chosen_reading: 야훼께서 다윗의 원수들을 끊어 버리실 때에도, 그때에도 요나단의 가문에 대한 사랑이 끊기지 말아야 한다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 야훼의 심판에 대한 독립적인 부연
  - 단순한 배경 설명
  rationale: 원문의 반복 부정과 분사구조는 단순 배경이 아니라 첫 청원을 강화하는 연결로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §3
