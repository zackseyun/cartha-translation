translation:
  language: ko
  text: 그때 다윗이 요나단에게 말했습니다. 「누가 내게 말해 주겠습니까? 아니면 아버지께서 당신에게 거칠게 대답하신다면 어떻게 하겠습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘누가 내게 말하겠습니까? 아니면 아버지께서 당신에게—거칠게—무엇을 대답하겠습니까?’에 가깝습니다. 원문이 압축되어 있어 한국어에서는 뜻을 분명히 했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 이르렀습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 와우 연속의 흐름을 한국어에서도 자연스럽게 이어 주되, 현대 문체에 맞게 ‘말했습니다’로 옮겼습니다.
- source_word: מִי יַגִּיד לִי
  english_pob_choice: Who will tell me?
  chosen_korean: 누가 내게 말해 주겠습니까?
  alternatives_korean:
  - 누가 내게 알려 주겠습니까?
  - 누가 내게 보고하겠습니까?
  lexicon: HALOT
  rationale: נגד의 ‘말하다/알리다’ 의미를 살리면서, 압축된 질문을 한국어에서 독립된 첫 질문으로 드러냈습니다.
- source_word: אוֹ מַה יַּעַנְךָ אָבִיךָ קָשָׁה
  english_pob_choice: Or what if your father answers you harshly?
  chosen_korean: 아니면 아버지께서 당신에게 거칠게 대답하신다면 어떻게 하겠습니까?
  alternatives_korean:
  - 아니면 아버지께서 당신에게 harshly 대답하신다면 어떻게 하겠습니까?
  - 혹은 아버지께서 당신에게 심하게 대답하신다면 어떻게 하겠습니까?
  lexicon: HALOT
  rationale: ‘ענה’는 ‘대답하다’로 옮기고, ‘קָשָׁה’는 답변의 성격을 나타내는 부사적으로 기능하므로 ‘거칠게’로 표현했습니다.
theological_decisions:
- issue: 히브리어의 압축된 두 절을 한국어에서 어떻게 분리해 재현할지
  chosen_reading: 첫 질문과 두 번째 가정/대안 질문을 분리해, 다윗의 긴장과 미완의 우려를 드러냈습니다.
  alternative_readings:
  - ‘누가 내게 말해 주겠습니까, 아니면 아버지께서 당신에게 거칠게 대답하신다면 어떻게 하겠습니까?’
  - ‘누가 내게 말해 주겠습니까? 혹은 아버지께서 당신에게 거칠게 대답하십니까?’
  rationale: 원문은 매우 압축되어 있어 단순한 직역보다 질문 구조를 풀어 주는 것이 의미를 더 정확히 전달합니다.
  doctrine_reference: 문법·담화 구조 보존
