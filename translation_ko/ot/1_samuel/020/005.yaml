  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל יְהוֹנָתָ֗ן הִֽנֵּה חֹ֨דֶשׁ֙ מָחָ֔ר וְ/אָנֹכִ֛י יָשֹׁב אֵשֵׁ֥ב עִם הַ/מֶּ֖לֶךְ לֶ/אֱכ֑וֹל וְ/שִׁלַּחְתַּ֨/נִי֙ וְ/נִסְתַּרְתִּ֣י בַ/שָּׂדֶ֔ה עַ֖ד הָ/עֶ֥רֶב הַ/שְּׁלִשִֽׁית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/005.yaml
  text: David said to Jonathan[a], “Look, tomorrow is the new moon, and I am supposed to sit with the king to eat. But let me go[b], so that I may hide myself in the field until the third evening.”
  footnotes:
  - marker: a
    text: Or “until the evening of the third day.” The Hebrew phrase is elliptical.
    reason: lexical_alternative
  - marker: b
    text: “New moon” refers to the monthly new moon observance, often marked by a special meal.
    reason: cultural_note
translation:
  language: ko
  text: 다윗이 요나단에게 말했습니다. “보십시오, 내일은 초하루입니다. 나는 왕과 함께 앉아 먹어야 합니다. 그러나 저를 보내주십시오. 그러면 내가 들에 숨어 있으렵니다. 셋째 날 저녁까지.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘초하루’는 여기서 달력상의 첫째 날만이 아니라 새달을 기념하는 절기 맥락을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 ‘앉다’를 두 번 써서 기대되는 공식적 식사 참석을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 여기 보십시오
  - 보라
  lexicon: HALOT
  rationale: 주의를 환기하는 지시어로서 현대 한국어에서 자연스럽고 격식 있는 표현을 택했습니다.
- source_word: חֹדֶשׁ מָחָר
  english_pob_choice: tomorrow is the new moon
  chosen_korean: 내일은 초하루입니다
  alternatives_korean:
  - 내일은 새 달입니다
  - 내일은 새 달맞이 날입니다
  - 내일은 월삭입니다
  lexicon: HALOT
  rationale: חֹדֶשׁ은 여기서 단순한 ‘달/개월’이 아니라 새달 절기 맥락이므로, 한국어에서 가장 자연스러운 ‘초하루’로 옮겼습니다.
- source_word: יָשֹׁב אֵשֵׁב
  english_pob_choice: I am supposed to sit
  chosen_korean: 나는 왕과 함께 앉아 먹어야 합니다
  alternatives_korean:
  - 나는 왕과 함께 앉아야 합니다
  - 나는 왕과 함께 앉아 먹게 되어 있습니다
  - 나는 왕과 함께 앉아서 먹어야 합니다
  lexicon: HALOT
  rationale: 히브리어의 강조된 의무/예정 뉘앙스를 ‘~해야 합니다’로 옮기되, 식사 자리라는 구체적 이미지를 살렸습니다.
- source_word: וְנִסְתַּרְתִּי
  english_pob_choice: so that I may hide myself
  chosen_korean: 그러면 내가 들에 숨어 있으렵니다
  alternatives_korean:
  - 그래서 내가 들에 숨겠습니다
  - 그리하여 내가 들에 숨을 것입니다
  - 그렇게 해서 내가 들에 숨어 있겠습니다
  lexicon: HALOT
  rationale: 결과절의 의미를 자연스럽게 살리면서, 다윗의 의도적 행동을 ‘숨어 있으렵니다’로 표현했습니다.
theological_decisions:
- issue: ‘new moon’의 문화적·절기적 의미를 한국어 본문에서 어떻게 드러낼지
  chosen_reading: ‘초하루’로 번역해 월삭/새달 절기의 달력·예배적 배경을 간결하게 드러냈습니다.
  alternative_readings:
  - 월삭
  - 새 달
  - 새 달 절기
  rationale: 본문은 단순 날짜가 아니라 왕의 식사와 연결된 절기 관습을 전제하므로, 한국어 독자가 곧바로 이해할 수 있는 절기 표현을 택했습니다.
  doctrine_reference: 구약 절기와 왕실 관습의 서술적 맥락
- issue: ‘let me go’의 청유를 어떤 강도로 옮길지
  chosen_reading: ‘저를 보내주십시오’로 요청의 정중함을 유지하되, 뒤의 ‘숨어 있으렵니다’로 결과 의도를 연결했습니다.
  alternative_readings:
  - 가게 해주십시오
  - 보내주십시오
  - 놓아주십시오
  rationale: 다윗의 말은 윤리적 명령이 아니라 요나단에게 하는 간청이므로, 청유형 존대를 유지하는 것이 문맥상 적절합니다.
  doctrine_reference: 서술문/대화문 화행 보존
