  naturalness: 초안의 ‘대답하며 … 말했습니다’는 한국어에서 두 행위가 동시에 이루어지는 듯 들릴 수 있습니다. 히브리어의 연속 서술에 맞게 ‘대답하여 … 말했습니다’로 고치면 더 자연스럽고 정확합니다. ‘아버지 사울’은 ‘자기 아버지 사울’보다 간결하면서 관계를 충분히 드러냅니다.
