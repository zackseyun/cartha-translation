base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/032.yaml
  text: Jonathan answered Saul his father and said to him[a], “Why should he be put to death? What has he done?”
  footnotes:
  - marker: a
    text: Or, “Why must he be killed?” The Hebrew verb specifically carries the sense of being put to death, not merely dying.
    reason: lexical_alternative
translation:
  language: ko
  text: 요나단이 자기 아버지 사울에게 대답하며 그에게 말했습니다. “그가 왜 죽임을 당해야 합니까? 그가 무슨 일을 했습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 단순히 ‘죽다’가 아니라 ‘죽임을 당하다’의 뜻을 분명히 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하며
  alternatives_korean:
  - 응답하며
  - 대답하고
  lexicon: HALOT
  rationale: 서사적 대화 도입 공식에서 ענה는 ‘대답하다/응답하다’의 뜻이므로, 자연스러운 현대 문체로 ‘대답하며’라고 옮겼습니다.
- source_word: אֶת שָׁאוּל אָבִיו
  english_pob_choice: Saul his father
  chosen_korean: 자기 아버지 사울에게
  alternatives_korean:
  - 사울 그의 아버지에게
  - 아버지 사울에게
  lexicon: HALOT
  rationale: 히브리어의 목적격 표지와 동격 표현을 살려, 사울이 요나단의 아버지임을 분명히 하되 한국어 어순은 자연스럽게 조정했습니다.
- source_word: יוּמַת
  english_pob_choice: should he be put to death
  chosen_korean: 죽임을 당해야 합니까
  alternatives_korean:
  - 죽어야 합니까
  - 살해되어야 합니까
  lexicon: HALOT
  rationale: 동사의 피동·사역적 뉘앙스를 살려 단순히 ‘죽다’보다 ‘죽임을 당하다’로 옮겼습니다.
- source_word: מֶה עָשָׂה
  english_pob_choice: What has he done?
  chosen_korean: 무슨 일을 했습니까
  alternatives_korean:
  - 무엇을 했습니까
  - 무슨 죄를 지었습니까
  lexicon: HALOT
  rationale: 히브리어 관용구는 혐의나 잘못의 근거를 묻는 표현이지만, 본문이 직접 제시한 어휘를 따라 ‘무슨 일을 했습니까’로 옮겨 의미를 과하게 해석하지 않았습니다.
theological_decisions:
- issue: 요나단의 발화체 등록
  chosen_reading: 서술문은 합쇼체로 유지하고, 직접 인용문의 수사적 질문도 공손한 합쇼체로 처리했습니다.
  alternative_readings:
  - 직접 인용문을 더 구어적으로 낮춘 표현
  - 더 고어적인 성경체
  rationale: 본문은 요나단이 사울에게 항변하는 장면이므로, 현대 한국어 독자에게 자연스럽고도 존중의 정도를 유지하는 공손한 질문형이 적절합니다.
  doctrine_reference: 서사 대화의 화행과 인물 관계 표현
