  source_fidelity: 히브리어의 ‘아무 말도 하지 않았다’, 시간 표현 ‘그날’, 사울의 내적 판단을 나타내는 אָמַר, 그리고 정결하지 않음의 반복과 강조를 충실히 옮겼습니다. ‘무슨 일이 생겼다’는 מִקְרֶה의 구체적으로 규정되지 않은 사건/사고라는 의미를 과도하게 한정하지 않습니다.
