  text: וְ/לֹֽא דִבֶּ֥ר שָׁא֛וּל מְא֖וּמָה בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֤י אָמַר֙ מִקְרֶ֣ה ה֔וּא בִּלְתִּ֥י טָה֛וֹר ה֖וּא כִּֽי לֹ֥א טָהֽוֹר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/026.yaml
  text: But Saul did not say anything that day[a], for he thought, “Something has happened; he is not clean—surely he is not clean.”
  footnotes:
  - marker: a
    text: Or “he is ceremonially unclean.” The Hebrew speaks of ritual cleanness in the context of the meal.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울은 그날 아무 말도 하지 않았습니다. 그는 속으로 이렇게 생각했습니다. “무슨 일이 생겼다. 그는 정결하지 않다—분명히 정결하지 않다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 의례적으로 정결하지 않다.” 히브리어는 식사 문맥에서 의례적 정결을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹֽא דִבֶּ֥ר ... מְא֖וּמָה
  english_pob_choice: did not say anything
  chosen_korean: 아무 말도 하지 않았습니다
  alternatives_korean:
  - 아무것도 말하지 않았습니다
  - 말한 것이 없었습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘말하다’와 ‘아무것도’의 결합은 사울이 아무 언급도 하지 않았다는 뜻이므로, 한국어에서는 자연스러운 관용 표현인 ‘아무 말도 하지 않다’로 옮겼습니다.
- source_word: בַּ/יּ֣וֹם הַ/ה֑וּא
  english_pob_choice: that day
  chosen_korean: 그날
  alternatives_korean:
  - 그날에
  - 그 날
  lexicon: HALOT
  rationale: 시간을 가리키는 표준 표현으로, 본문의 흐름을 가장 간결하고 자연스럽게 전달합니다.
- source_word: כִּ֤י אָמַר֙ מִקְרֶ֣ה ה֔וּא
  english_pob_choice: for he thought, “Something has happened”
  chosen_korean: 그는 속으로 이렇게 생각했습니다. “무슨 일이 생겼다”
  alternatives_korean:
  - 그는 생각했습니다. “무슨 일이 생겼다”
  - 그는 속으로 말했습니다. “무슨 일이 생겼다”
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그가 말했다’이지만, 뒤의 판단문은 사울의 내적 추론을 나타냅니다. 따라서 ‘속으로 생각했습니다’로 의미를 드러내되, 본문에 없는 ‘to him’ 같은 대상을 덧붙이지 않았습니다.
- source_word: בִּלְתִּ֥י טָה֛וֹר ה֖וּא / כִּי לֹ֥א טָהֽוֹר
  english_pob_choice: he is not clean—surely he is not clean
  chosen_korean: 그는 정결하지 않다—분명히 정결하지 않다
  alternatives_korean:
  - 그는 깨끗하지 않다—분명히 깨끗하지 않다
  - 그는 부정하다—분명히 부정하다
  lexicon: HALOT
  rationale: 문맥상 제의적/의례적 부정을 가리키므로, 본문에는 전통적 교회어인 ‘부정’보다 직역성이 있는 ‘정결하지 않다’를 택했습니다. 반복은 사울의 확신을 강조하므로 그대로 살렸습니다.
theological_decisions:
- issue: טָהוֹר/정결의 의미 범위
  chosen_reading: 새벽식 제의가 아닌, 만찬 참여와 관련된 의례적 정결 상태를 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 도덕적 순결의 결여
  - 일반적인 위생적 깨끗함
  rationale: 본문의 장면은 초하루 식사 자리이며, 사울의 추정은 율례적 식탁 참여 가능성에 관한 것이므로 ‘정결하지 않다’로 두고 의미를 과도하게 도덕화하지 않았습니다.
  doctrine_reference: 제의적 정결/부정의 서술은 윤리적 죄책과 동일하지 않음
- issue: 내적 발화의 표현 방식
  chosen_reading: ‘그는 속으로 이렇게 생각했습니다’로 사울의 내면 판단을 자연스럽게 드러냈습니다.
  alternative_readings:
  - 그는 말했습니다
  - 그는 스스로 말했습니다
  rationale: 히브리어 אָמַר는 외적 발화보다 내적 추론을 포함할 수 있으므로, 한국어 독자가 사울의 추정을 분명히 읽도록 했습니다.
  doctrine_reference: 서술체의 담화 기능
