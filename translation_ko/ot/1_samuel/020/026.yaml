  terminology: ‘정결하지 않다’는 טָהוֹר의 제의적 문맥을 유지하면서 도덕적 비난으로 한정하지 않는 적절한 용어입니다. 각주가 의례적 의미를 분명히 보완하며, ‘분명히’는 마지막 כִּי의 확신·추론적 강조를 무리 없이 반영합니다.
