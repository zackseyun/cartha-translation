  edition: WLC
  text: וַ/יֹּ֨אמֶר ל֣/וֹ חָלִילָ/ה֮ לֹ֣א תָמוּת֒ הִנֵּ֡ה ל/ו עשה אָבִ֜/י דָּבָ֣ר גָּד֗וֹל א֚וֹ דָּבָ֣ר קָטֹ֔ן וְ/לֹ֥א יִגְלֶ֖ה אֶת אָזְנִ֑/י וּ/מַדּוּעַ֩ יַסְתִּ֨יר אָבִ֥/י מִמֶּ֛/נִּי אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה אֵ֥ין זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/002.yaml
  text: He said to him[a], “Far from it! You will not die. Look, my father does nothing, great or small, without revealing it to me. So why would my father hide this matter from me? It is not so.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'does not uncover my ear,' an idiom meaning 'does not reveal it to me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말했습니다. 「그럴 리 없습니다! 당신은 죽지 않을 것입니다. 보십시오, 내 아버지는 크고 작은 일이라도 나에게 알리지 않고는 아무것도 하지 않으십니다. 그런데 내 아버지가 왜 이 일을 나에게 숨기시겠습니까? 그렇지 않습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 귀를 드러내지 않는다’는 관용구로, 뜻은 ‘나에게 알리지 않는다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה
  english_pob_choice: Far from it!
  chosen_korean: 그럴 리 없습니다!
  alternatives_korean:
  - 천만에요!
  - 결코 그렇지 않습니다!
  lexicon: HALOT
  rationale: 강한 부정·배척의 관용구로, 현대 한국어에서 자연스럽고 단호한 반응을 살리는 표현을 택했습니다.
- source_word: לֹא תָמוּת
  english_pob_choice: You will not die
  chosen_korean: 당신은 죽지 않을 것입니다
  alternatives_korean:
  - 당신은 죽지 않으실 것입니다
  - 당신은 죽지 않소
  lexicon: HALOT
  rationale: 직접적인 안심/예고를 합쇼체로 옮겨, 본문의 단정적 선언을 분명하게 유지했습니다.
- source_word: וְלֹא יִגְלֶה אֶת אָזְנִי
  english_pob_choice: without revealing it to me
  chosen_korean: 나에게 알리지 않고는
  alternatives_korean:
  - 내 귀를 열지 않고는
  - 나에게 드러내지 않고는
  lexicon: HALOT
  rationale: 직역의 '귀를 드러내다/열다'는 한국어에서 낯설므로, 본문의 관용적 뜻인 '알리다'로 옮기되 의미의 핵심은 유지했습니다.
- source_word: דָּבָר גָּדוֹל א֚וֹ דָּבָר קָטֹן
  english_pob_choice: nothing, great or small
  chosen_korean: 크고 작은 일이라도
  alternatives_korean:
  - 큰 일이든 작은 일이든
  - 크건 작건 어떤 일이라도
  lexicon: HALOT
  rationale: 히브리어의 전체-부분 강조를 한국어의 관용적 병렬로 살려, '아무 일도 빠짐없이'라는 범위를 드러냈습니다.
- source_word: הַדָּבָר הַזֶּה
  english_pob_choice: this matter
  chosen_korean: 이 일
  alternatives_korean:
  - 이 문제
  - 이 사안
  lexicon: HALOT
  rationale: 여기서 דבר는 구체적 사건/계획을 가리키므로, 문맥상 가장 자연스러운 '일'을 선택했습니다.
theological_decisions:
- issue: 요나단의 강한 부정 어조
  chosen_reading: ‘그럴 리 없습니다!’로 옮겨, 단순 정보 전달이 아니라 다윗의 죽음 가능성을 단호히 배척하는 어조를 살렸습니다.
  alternative_readings:
  - ‘결코 아닙니다!’
  - ‘하나님이 금하십니다!’
  rationale: חָלִילָה는 단순한 부정보다 강한 거부를 뜻합니다. 전통적 번역의 신적 요소를 자동으로 넣기보다, 본문 자체의 부정 강도를 한국어로 직접 드러내는 편이 원문의 힘에 가깝습니다.
  doctrine_reference: 어휘의 관용적 강도와 담화 기능
- issue: ‘내 아버지’의 반복
  chosen_reading: 반복되는 ‘내 아버지’를 그대로 살려 관계적 긴장과 논증의 중심축을 보존했습니다.
  alternative_readings:
  - 대명사로 줄여 ‘그분’으로 처리
  - 문맥상 한 번만 표기
  rationale: 히브리어는 의도적으로 ‘내 아버지’를 반복하여 요나단의 가족 관계와 논증의 실마리를 강조합니다. 이를 줄이면 수사적 압력이 약해집니다.
  doctrine_reference: 서사 수사와 강조
