    reason: source_note
lexical_decisions:
- source_word: וַ/יִּכְרֹ֥ת ... עִם בֵּ֣ית דָּוִ֑ד
  english_pob_choice: made a covenant with the house of David
  chosen_korean: 다윗의 집과 언약을 맺고
  alternatives_korean:
  - 다윗의 집과 계약을 맺고
  - 다윗의 집과 언약을 세우고
  lexicon: כרת + ברית
  rationale: 히브리어 관용구는 단순한 계약보다 언약의 체결을 뜻하므로 ‘언약을 맺다’가 가장 직접적입니다.
- source_word: יְהוָ֔ה
  english_pob_choice: the LORD
  chosen_korean: 야훼께서는
  alternatives_korean:
  - 주님께서는
  - 여호와께서는
  lexicon: יהוה
  rationale: 본문의 신명은 YHWH이므로 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
- source_word: מִ/יַּ֖ד
  english_pob_choice: from the hand of
  chosen_korean: '...의 손에서'
  alternatives_korean:
  - '...의 손에서부터'
  - '...의 권세에서'
  lexicon: יד
  rationale: ‘손’은 히브리어의 지배·관할의 은유를 살리면서도 한국어에서 자연스럽게 읽힙니다.
- source_word: בִּקֵּ֣שׁ
  english_pob_choice: sought it
  chosen_korean: 그것을 찾으셨습니다
  alternatives_korean:
  - 그것을 요구하셨습니다
  - 그것을 구하셨습니다
  lexicon: בקש
  rationale: POB가 ‘sought it’로 유지한 선택을 따라, 여기서는 ‘찾다’를 써서 탐색·추구의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 본문의 목적어가 히브리어에서 명시되지 않고, 영어 POB가 대명사 it을 유지함
  chosen_reading: ‘그것’을 살려 언약 체결의 결과나 책임/대가를 야훼께서 원수들의 손에서 추궁하신다는 긴장을 보존했습니다.
  alternative_readings:
  - 목적어를 생략하여 매끈하게 번역하기
  - ‘그것’을 다른 구체적 명사로 풀어 쓰기
  rationale: 히브리어와 POB의 불명시성을 보존해야 본문의 해석 여지를 과도하게 좁히지 않습니다.
  doctrine_reference: source transparency / lexical restraint
