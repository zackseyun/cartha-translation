  text: 그리하여 요나단은 다윗의 집과 언약을 맺었고, 야훼께서 다윗의 원수들의 손에서 그것을 찾으시기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘찾다’의 목적어를 명시하지 않습니다. 또한 ‘…의 손에서 찾다’는 그들에게 그것을 요구하거나 그 책임을 묻는다는 뜻을 내포할 수 있습니다.
    reason: 원문의 불명시된 목적어와 ‘손’ 관용구를 보존하면서, 후반절의 맹세·저주적 문맥상 뉘앙스를 설명합니다.
