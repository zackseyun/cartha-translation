  text: So Jonathan made a covenant with the house of David, and the LORD sought it from the hand of David’s enemies.
translation:
  language: ko
  text: 그리하여 요나단은 다윗의 집과 언약을 맺고, 야훼께서는 다윗의 원수들의 손에서 그것을 찾으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
