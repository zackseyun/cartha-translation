base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/040.yaml
  text: Then Jonathan gave his weapons to the young man who was with him and said to him[a], “Go[c][b], bring them to the city.”
  footnotes:
  - marker: a
    text: Hebrew 'his weapons' could more broadly mean 'his equipment' or 'his gear'; the context of Jonathan's bow and arrows favors 'weapons.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the boy who was with him' / 'his servant boy.' The Hebrew describes the young attendant as belonging to Jonathan.
    reason: lexical_alternative
  - marker: c
    text: The object of 'bring' is implicit in Hebrew and is supplied in English as 'them,' referring to Jonathan's weapons/equipment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 요나단은 자기와 함께 있던 젊은이에게 자신의 무기들을 주고 그에게 말했습니다. 「가서, 그것들을 성읍으로 가져가라」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 נַעַר אֲשֶׁר לוֹ로, 문자적으로는 ‘그에게 속한 젊은이’입니다. 문맥상 수행원/시종을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사 הָבֵיא는 앞선 무기들을 목적어로 하여 ‘가져가라’의 뜻이 됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן / gave
  english_pob_choice: gave
  chosen_korean: 주고
  alternatives_korean:
  - 건네주고
  - 넘겨주고
  lexicon: HALOT
  rationale: 서술 흐름에 맞는 가장 자연스러운 과거 서술로, 단순한 양도를 나타내는 ‘주고’가 적절합니다.
- source_word: כֵּלָיו / his weapons
  english_pob_choice: his weapons
  chosen_korean: 자신의 무기들
  alternatives_korean:
  - 자신의 장비
  - 자신의 도구들
  - 자신의 기구들
  lexicon: HALOT
  rationale: 활과 화살이 등장하는 문맥이므로, 넓은 뜻의 ‘장비’보다 무기라는 의미를 분명히 드러내는 표현이 더 적절합니다.
- source_word: הַנַּעַר אֲשֶׁר לוֹ / the young man who belonged to him
  english_pob_choice: the young man who was with him
  chosen_korean: 자기와 함께 있던 젊은이
  alternatives_korean:
  - 그의 종인 젊은이
  - 자기에게 속한 젊은이
  - 그와 함께한 소년
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그에게 속한’ 뉘앙스를 가지지만, 본문 맥락상 수행원을 가리키므로 ‘함께 있던’으로 자연스럽게 옮기되 소속 관계를 완전히 지우지는 않았습니다.
- source_word: הָבֵיא / bring
  english_pob_choice: bring them
  chosen_korean: 그것들을 가져가라
  alternatives_korean:
  - 그것들을 데려가라
  - 그것들을 옮겨가라
  lexicon: HALOT
  rationale: 히브리어의 명령형은 ‘가져오다/데려오다’의 방향성을 지니지만, 한국어에서는 수행원에게 목적지로 옮기게 하는 뜻을 ‘가져가라’로 가장 자연스럽게 담을 수 있습니다.
theological_decisions:
- issue: 대화체 명령문의 한국어 어조
  chosen_reading: 직접 명령을 현대 한국어 반말 명령형으로 옮겨 「가서, 그것들을 성읍으로 가져가라」라고 했습니다.
  alternative_readings:
  - 가십시오, 그것들을 성읍으로 가져가십시오
  - 가서, 그것들을 성읍으로 가져오십시오
  rationale: 본문의 인물 간 지시 관계를 살리기 위해 직접 명령은 반말형이 가장 적절하며, 서술문 전체는 합쇼체를 유지했습니다.
  doctrine_reference: n/a
