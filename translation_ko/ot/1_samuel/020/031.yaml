  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י כָל הַ/יָּמִ֗ים אֲשֶׁ֤ר בֶּן יִשַׁי֙ חַ֣י עַל הָ/אֲדָמָ֔ה לֹ֥א תִכּ֖וֹן אַתָּ֣ה וּ/מַלְכוּתֶ֑/ךָ וְ/עַתָּ֗ה שְׁלַ֨ח וְ/קַ֤ח אֹת/וֹ֙ אֵלַ֔/י כִּ֥י בֶן מָ֖וֶת הֽוּא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/031.yaml
  text: For as long as the son of Jesse lives on the earth[a], neither you nor your kingdom will be established. So now, send and bring him to me, for he is a son of death.
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''a son of death,'' that is, one deserving death or doomed to die.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 이새의 아들이 땅 위에 살아 있는 동안에는[a] 당신과 당신의 왕국은 확립되지 않을 것입니다. 그러니 이제 사람을 보내 그를 저에게 데려오십시오. 그는 죽을 자입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘죽음의 아들’은 죽어 마땅한 자, 곧 사형에 해당하는 자를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי / כָל הַיָּמִים אֲשֶׁר
  english_pob_choice: For as long as
  chosen_korean: 이는 … 동안에는
  alternatives_korean:
  - …하는 동안
  - …하는 한
  - 계속해서
  lexicon: HALOT
  rationale: 지속 기간을 나타내는 관용구이므로, 한국어에서는 자연스러운 종속절로 풀어 ‘… 동안에는’으로 옮겼습니다.
- source_word: בֶּן יִשַׁי
  english_pob_choice: the son of Jesse
  chosen_korean: 이새의 아들
  alternatives_korean:
  - 다윗
  - 이새의 아들 다윗
  lexicon: HALOT
  rationale: 사울이 다윗의 이름 대신 부계 호칭을 써서 거리를 두는 뉘앙스를 살리기 위해, 이름보다 ‘이새의 아들’을 유지했습니다.
- source_word: לֹא תִכּוֹן
  english_pob_choice: will be established
  chosen_korean: 확립되지 않을 것입니다
  alternatives_korean:
  - 굳게 서지 않을 것입니다
  - 세워지지 않을 것입니다
  - 안정되지 않을 것입니다
  lexicon: HALOT
  rationale: כּוּן의 수동적·결과적 의미를 살려 ‘확립되다’로 옮겼으며, 왕권의 정당성과 지속성을 함께 드러냅니다.
- source_word: בֶּן מָוֶת הוּא
  english_pob_choice: he is a son of death
  chosen_korean: 그는 죽을 자입니다
  alternatives_korean:
  - 그는 죽어 마땅한 자입니다
  - 그는 죽음의 아들입니다
  - 그는 반드시 죽을 자입니다
  lexicon: HALOT
  rationale: 직역하면 ‘죽음의 아들’이지만, 한국어에서는 관용적 의미를 살려도 원문의 법적·운명적 뉘앙스를 유지할 수 있어 ‘죽을 자’로 옮겼습니다.
theological_decisions:
- issue: 사울의 명령 어조와 인물 지칭의 적대성
  chosen_reading: 직설적 명령과 ‘이새의 아들’ 지칭을 그대로 유지해 사울의 적대와 경멸을 드러냈습니다.
  alternative_readings:
  - 부드럽게 완화된 명령형
  - 이름을 사용한 중립적 지칭
  rationale: 본문의 수사적 긴장과 사울의 증오가 의미상 핵심이므로, 완곡화하지 않고 원문의 적대적 어조를 보존했습니다.
  doctrine_reference: 서사 문맥의 화자 의도 보존
