  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 בֶּן־מָוֶת(‘죽음의 아들’)에 관한 주석 표지가 ‘땅 위에 살아 있는 동안’에 붙어 있어, 주석의 실제 대상과 맞지 않습니다. 또한 ‘확립되지 않다’는 사람과 왕국에 함께 적용될 때 한국어로 다소 부자연스럽습니다.
  naturalness: 합쇼체는 유지되어 있으나, ‘그를 저에게 데려오십시오’의 ‘저에게’는 사울이 자기 아들 요나단에게 명하는 문맥에서 불필요하게 자신을 낮추는 인상을 줍니다. ‘내게로 데려오십시오’가 더 자연스럽고 화자 관계에 맞습니다. ‘굳게 서지 못할 것입니다’는 두 병렬 주어에 자연스럽게 적용됩니다.
  terminology: ‘이새의 아들’은 이름을 피하는 원문의 적대적·거리 두는 지칭을 잘 보존합니다. מַלְכוּת는 여기서 ‘왕국’으로 유지할 수 있습니다. בֶּן־מָוֶת는 본문에서 ‘죽어 마땅한 자’로 뜻을 드러내고, 주석에서 히브리어 관용 표현을 밝혀 주는 방식이 명료합니다.
  issues:
