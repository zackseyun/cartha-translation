source:
  edition: WLC
  text: כֹּֽה יַעֲשֶׂה֩ יְהוָ֨ה לִֽ/יהוֹנָתָ֜ן וְ/כֹ֣ה יֹסִ֗יף כִּֽי יֵיטִ֨ב אֶל אָבִ֤/י אֶת הָֽ/רָעָה֙ עָלֶ֔י/ךָ וְ/גָלִ֨יתִי֙ אֶת אָזְנֶ֔/ךָ וְ/שִׁלַּחְתִּ֖י/ךָ וְ/הָלַכְתָּ֣ לְ/שָׁל֑וֹם וִ/יהִ֤י יְהוָה֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אָבִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/013.yaml
  text: May Yahweh do so to Jonathan[a], and more also, if my father intends evil against you and I do not disclose it to you and send you away, so that you may go in peace. And may Yahweh be with you[c][b], as he has been with my father.
  footnotes:
  - marker: a
    text: Hebrew literally, 'uncover your ear,' an idiom meaning 'inform you' or 'disclose it to you.'
    reason: lexical_alternative
  - marker: b
    text: Or, more literally, 'if it is good to my father [to do] the evil against you,' that is, 'if my father is pleased/intends to harm you.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and I do not disclose it to you and send you away'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼께서 요나단에게 이처럼 하시고 그보다 더하시기를 바랍니다. 만일 내 아버지가 당신에게 해를 끼치려 한다면,[b] 내가 그 사실을 당신에게 알리고[a] 당신을 평안히 가도록 보내지 않는다면,[c] 야훼께서 당신과 함께 계시기를 바랍니다. 내 아버지와 함께 계셨던 것처럼 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하여 ‘당신의 귀를 드러내고’입니다. 이는 ‘알리다, 알려 주다’라는 뜻의 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 아버지에게 당신에 대한 해악이 좋게 여겨진다면’입니다. 이는 내 아버지가 당신을 해치려 하거나 그렇게 할 뜻을 품는다는 의미입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 서원 공식에서는 여기의 부정이 명시되지 않았습니다. 문맥상 요나단은 아버지의 해악을 알게 되면 다윗에게 알리고 그가 평안히 떠나도록 보내겠다고 맹세하며, 그렇게 하지 않을 경우 자기에게 저주가 임하기를 비는 것입니다.
    reason: source_note
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה יְהוָה ... וְכֹה יֹסִיף
  english_pob_choice: May Yahweh do so ... and more also
  chosen_korean: 야훼께서 ... 이렇게 하시고 또 이렇게 더하시기를 원하나이다
  alternatives_korean:
  - 야훼께서 ... 그렇게 하시고 또 더하시기를 원하나이다
  - 야훼께서 ... 이와 같이 하시고 또 더하시기를 원하나이다
  lexicon: HALOT
  rationale: 서원/저주 공식의 관용적 힘을 살리기 위해 '이렇게 하시고 또 이렇게 더하시기를 원하나이다'로 옮겨 반복 구조와 증강의 뉘앙스를 보존했습니다.
- source_word: יֵיטִב אֶל אָבִי אֶת הָרָעָה עָלֶיךָ
  english_pob_choice: if my father intends evil against you
  chosen_korean: 만일 내 아버지가 당신에게 해를 끼치려 하고
  alternatives_korean:
  - 만일 내 아버지에게 당신을 해치려는 것이 좋게 여겨지고
  - 만일 내 아버지가 당신에게 악을 행하려 하고
  lexicon: HALOT
  rationale: 히브리어의 생략적 관용구를 한국어에서 자연스럽게 살리되, 단순한 감정이 아니라 실제 해악의 의도를 분명히 드러내기 위해 '해를 끼치려 하고'로 번역했습니다.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  english_pob_choice: and I do not disclose it to you
  chosen_korean: 내가 그것을 당신에게 알리지 않고
  alternatives_korean:
  - 내가 당신의 귀를 열지 않고
  - 내가 그것을 당신에게 드러내지 않고
  lexicon: HALOT
  rationale: '''귀를 드러내다''라는 직역적 관용구보다 의미 기능을 살린 ''알리지 않고''가 한국어에서 더 분명하며, 문맥상 ''그것''은 앞의 해악을 가리킵니다.'
- source_word: וְשִׁלַּחְתִּיךָ וְהָלַכְתָּ לְשָׁלוֹם
  english_pob_choice: and send you away, so that you may go in peace
  chosen_korean: 당신을 보내어 당신이 평안히 가게 하지 않으면
  alternatives_korean:
  - 당신을 보내어 당신이 평안히 가게 하지 않으면
  - 당신을 떠나보내어 당신이 평안히 가게 하지 않으면
  lexicon: HALOT
  rationale: ‘보내다/떠나보내다’ 가운데, 원문의 사역적 뉘앙스를 살리면서도 흐름을 자연스럽게 하기 위해 '보내어'를 택했습니다.
- source_word: וִיהִי יְהוָה עִמָּךְ
  english_pob_choice: And may Yahweh be with you
  chosen_korean: 야훼께서 당신과 함께 계시기를 원하나이다
  alternatives_korean:
  - 야훼께서 당신과 함께 계시길 원하나이다
  - 야훼께서 당신과 함께 계시기를 바라나이다
  lexicon: HALOT
  rationale: 축복/기원의 jussive를 한국어에서 '…계시기를 원하나이다'로 옮겨 간구형을 유지했습니다.
- source_word: כַּאֲשֶׁר הָיָה עִם אָבִי
  english_pob_choice: as he has been with my father
  chosen_korean: 그분이 내 아버지와 함께 계셨던 것처럼
  alternatives_korean:
  - 그분이 내 아버지와 함께 계셨던 것처럼
  - 내 아버지와 함께 계셨던 것처럼
  lexicon: HALOT
  rationale: 비교 대상의 주어가 야훼임을 분명히 하기 위해 '그분'을 보충했습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: יהוה는 본문에서 '야훼'로 옮겼습니다.
  alternative_readings:
  - '''여호와'''
  - '''주님'''
  rationale: 프로젝트 기본어에 따라 고유신명은 '야훼'로 표기하여 본문의 인격적 이름을 유지했습니다.
  doctrine_reference: project glossary / Tetragrammaton
- issue: 서원 공식의 강한 저주 어감
  chosen_reading: 반복 서원식을 한국어에서도 완화하지 않고 '이렇게 하시고 또 이렇게 더하시기를 원하나이다'로 살렸습니다.
  alternative_readings:
  - 더 부드럽게 '반드시 그렇게 하시기를'로 완화
  - 일반 축복문처럼 평서적으로 처리
  rationale: 본문은 단순한 축원이 아니라 자기저주를 포함한 서원 공식이므로, 그 강도를 유지하는 편이 원문 의도에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
