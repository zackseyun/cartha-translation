review_pass:
  verdict: revise
  source_fidelity: 첫 문두의 ‘그러므로’는 히브리어 접속사 וַ의 단순 서사 진행을 인과관계로 좁혀 원문에 없는 논리적 결론을 부가합니다. 또한 לֶחֶם은 이 문맥에서 식사를 가리키므로 본문에서 ‘빵’으로 번역하면, 각주가 있더라도 왕이 빵 자체를 먹기 위해 앉았다는 부자연스럽고 축소된 의미가 됩니다.
  naturalness: ‘다윗은 들판에 몸을 숨겼습니다’와 ‘왕은 식사하러 자리에 앉았습니다’는 현대 표준 한국어 합쇼체에 자연스럽고, 원문의 동작 순서도 보존합니다.
  terminology: ‘초하루’는 הַחֹדֶשׁ가 가리키는 새달의 때를 자연스럽게 전달합니다. לֶחֶם의 환유적 의미는 ‘식사’로 본문에 번역하는 것이 적절하므로, 직역 가능성을 설명하는 각주는 필요하지 않습니다.
  issues:
  - severity: medium
    issue: ‘그러므로’가 원문에 없는 인과관계를 부가함
    rationale: וַ는 여기서 서사를 이어 주는 접속 표현이며, 앞 절의 내용으로부터 결론을 이끌어 내는 ‘그러므로’로 번역할 근거가 없습니다.
  - severity: medium
    issue: ‘빵을 먹기 위해 앉았습니다’가 לֶחֶם의 문맥상 환유를 본문에서 지나치게 문자화함
    rationale: עַל־הַלֶּחֶם은 식사 자리/식사를 가리키는 표현입니다. ‘빵’이라는 본문 번역은 왕이 특정 빵을 먹으려고 앉았다는 좁고 어색한 뜻을 만들며, 각주만으로 본문상의 부정확성을 충분히 해소하지 못합니다.
