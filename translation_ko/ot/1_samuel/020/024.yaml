  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּסָּתֵ֥ר דָּוִ֖ד בַּ/שָּׂדֶ֑ה וַ/יְהִ֣י הַ/חֹ֔דֶשׁ וַ/יֵּ֧שֶׁב הַ/מֶּ֛לֶךְ על הַ/לֶּ֖חֶם לֶ/אֱכֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/024.yaml
  text: So David hid himself in the field. When the new moon came[a], the king sat down to eat the meal.
  footnotes:
  - marker: a
    text: Literally, 'sat over the bread to eat'; 'bread' here stands for the meal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 다윗은 들판에 숨었습니다. 초하루가 되자 왕은 빵[a]을 먹기 위해 앉았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘빵 위에/빵에 앉아 먹다’에 가깝지만, 여기서 ‘빵’은 식사를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּתֵר
  english_pob_choice: hid himself
  chosen_korean: 숨었습니다
  alternatives_korean:
  - 몸을 숨겼습니다
  - 자신을 숨겼습니다
  lexicon: HALOT
  rationale: 니팔형은 여기서 다윗이 스스로 몸을 숨긴 뜻이므로, 자연스러운 한국어로는 단순히 ‘숨었습니다’가 가장 간결하고 문맥에 맞습니다.
- source_word: בַּשָּׂדֶה
  english_pob_choice: in the field
  chosen_korean: 들판에
  alternatives_korean:
  - 밭에
  - 들에서
  lexicon: HALOT
  rationale: שָׂדֶה의 기본 의미를 살려 ‘들판’으로 옮기되, 서술 흐름에 맞게 처소 조사 ‘-에’를 붙였습니다.
- source_word: וַיְהִי הַחֹדֶשׁ
  english_pob_choice: When the new moon came
  chosen_korean: 초하루가 되자
  alternatives_korean:
  - 새달이 되자
  - 새달 절기가 오자
  lexicon: HALOT
  rationale: 본문의 הַחֹדֶשׁ은 단순한 ‘달’이 아니라 새달/초하루의 절기를 가리키므로, 현대 한국어에서 가장 분명한 ‘초하루가 되자’로 옮겼습니다.
- source_word: עַל הַלֶּחֶם
  english_pob_choice: at the meal
  chosen_korean: 빵
  alternatives_korean:
  - 식사
  - 음식
  lexicon: HALOT
  rationale: 직역하면 ‘빵 위에/빵에’이지만, 이곳의 לֶחֶם은 식사를 뜻하는 환유이므로 본문에는 ‘빵’만 두고 각주로 식사 의미를 밝혔습니다.
theological_decisions:
- issue: 왕의 식사 준비를 나타내는 표현의 직역 정도
  chosen_reading: ‘빵을 먹기 위해 앉았습니다’로 옮겨, ‘앉다’와 ‘먹다’의 동작 순서를 살렸습니다.
  alternative_readings:
  - ‘식사하러 자리에 앉았습니다’
  - ‘먹으려고 자리에 앉았습니다’
  rationale: 히브리어는 ‘앉다’와 ‘먹다’가 분명히 구분되므로, 자연스러움을 확보하되 동작의 배열을 유지하는 번역이 본문의 묘사를 가장 잘 보존합니다.
  doctrine_reference: 서사 본문 번역 원칙
