id: 1SA.20.22
reference: 1 Samuel 20:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם כֹּ֤ה אֹמַר֙ לָ/עֶ֔לֶם הִנֵּ֥ה הַ/חִצִּ֖ים מִמְּ/ךָ֣ וָ/הָ֑לְאָה לֵ֕ךְ כִּ֥י שִֽׁלַּחֲ/ךָ֖ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/022.yaml
  text: But if I say this to the young man[a], ‘Look, the arrows are beyond you,’ then go, for Yahweh has sent you away.
  footnotes:
  - marker: a
    text: Or, 'the arrows are farther than you.' The Hebrew expression means the arrows are past the young man, signaling that David must depart.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 그 젊은이에게 이렇게 말하면, ‘보시오, 화살이 당신보다 저쪽에 있습니다.’ 그러면 가십시오. 야훼께서 당신을 보내셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘화살이 당신보다 더 멀리 있습니다.’ 히브리어 표현은 화살이 젊은이보다 지나가 있다는 뜻으로, 다윗이 떠나야 함을 알립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 ... 하면
  alternatives_korean:
  - 그리고 만약 ... 하면
  - 만약 ... 하면
  lexicon: HALOT
  rationale: 앞 절과의 대비를 드러내는 조건문이므로 ‘그러나’로 역접을 살리고, 한국어 문장 흐름에 맞게 조건 구조를 유지했습니다.
- source_word: לָעֶלֶם
  english_pob_choice: to the young man
  chosen_korean: 그 젊은이에게
  alternatives_korean:
  - 그 소년에게
  - 그 종에게
  lexicon: HALOT
  rationale: עֶלֶם은 기본적으로 젊은 남자를 가리키므로 ‘젊은이’가 가장 직접적입니다. 역할을 덧씌우는 ‘종’은 원문의 명시를 넘습니다.
- source_word: מִמְּךָ וָהָלְאָה
  english_pob_choice: are beyond you
  chosen_korean: 당신보다 저쪽에 있습니다
  alternatives_korean:
  - 당신보다 더 멀리 있습니다
  - 당신을 지나 있습니다
  lexicon: HALOT
  rationale: 표현의 핵심은 화살이 청년을 지나 더 멀리 있다는 신호이므로, 직역을 넘지 않으면서도 한국어로 자연스러운 ‘저쪽에 있습니다’를 택했습니다.
- source_word: שִׁלַּחֲךָ
  english_pob_choice: has sent you away
  chosen_korean: 당신을 보내셨기 때문입니다
  alternatives_korean:
  - 당신을 떠나보내셨기 때문입니다
  - 당신을 보내셨습니다
  lexicon: HALOT
  rationale: 문맥상 다윗이 떠나야 함을 뜻하므로 ‘보내다/떠나보내다’의 의미를 살렸습니다. 영어 POB의 ‘sent you away’가 암시하는 해석을 반영하되, 한국어에서는 중복 어감을 줄였습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 사전 기준에 따라 신성 사명은 ‘야훼’로 옮겼습니다. 전통 교회어인 ‘여호와’는 본문 음가와 편집 원칙에 맞지 않습니다.
theological_decisions:
- issue: 야훼의 직접적 인칭 표기
  chosen_reading: ‘야훼께서 당신을 보내셨기 때문입니다’로 직접 이름을 드러내었습니다.
  alternative_readings:
  - ‘주께서 당신을 보내셨기 때문입니다’
  - ‘주님께서 당신을 보내셨기 때문입니다’
  rationale: 히브리어 본문이 여호와 대체 칭호가 아닌 고유명사 יְהוָה를 사용하므로, 번역에서도 그 신명성을 보존했습니다. 이 절은 단순한 인과 진술이면서 동시에 다윗의 철수에 대한 하나님의 주권적 신호를 담습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
