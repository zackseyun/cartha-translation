  yaml_path: translation/ot/1_samuel/020/042.yaml
  text: Jonathan said to David, “Go in peace, because the two of us have sworn in the name of the LORD, saying, ‘May the LORD be between me and you, and between my offspring and your offspring forever.’”
translation:
  language: ko
  text: 요나단이 다윗에게 말했습니다. 「평안히 가십시오. 우리 둘이 야훼의 이름으로 맹세하며 말하기를, ‘야훼께서 나와 당신 사이에, 또 내 자손과 당신 자손 사이에 영원히 계시기를 바랍니다.’」[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘평안히 가십시오’는 פָּשָׁלוֹם의 관용적 작별 인사를 합쇼체로 옮긴 것입니다.
    reason: korean_style_note
  - marker: b
    text: ‘자손’은 זֶרַע의 문맥상 자연스러운 번역으로, 직역 ‘씨’보다 관계적 후손 의미를 분명히 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... לְדָוִד
  english_pob_choice: Jonathan said to David
  chosen_korean: 요나단이 다윗에게 말했습니다
  alternatives_korean:
  - 요나단이 다윗에게 이르렀습니다
  - 요나단이 다윗에게 말하였습니다
  lexicon: proper noun / speech verb
  rationale: 서술 동사를 자연스러운 현대 한국어로 옮기되, 원문의 단순 발화 동사를 과도하게 해석하지 않고 유지했습니다.
- source_word: לְשָׁלוֹם
  english_pob_choice: Go in peace
  chosen_korean: 평안히 가십시오
  alternatives_korean:
  - 평안히 가세요
  - 평강 가운데 가십시오
  lexicon: שָׁלוֹם
  rationale: 명령형을 살리면서도 한국어 합쇼체로 공손하게 옮겼고, ‘평안히’로 שלום의 상태 의미를 드러냈습니다.
- source_word: נִשְׁבַּעְנוּ ... בְּשֵׁם יְהוָה
  english_pob_choice: have sworn in the name of the LORD
  chosen_korean: 야훼의 이름으로 맹세하며
  alternatives_korean:
  - 주님의 이름으로 맹세하며
  - 여호와의 이름으로 맹세하며
  lexicon: YHWH / oath formula
  rationale: 원문의 언약적 맹세 공식을 그대로 살려 ‘이름으로 맹세하다’를 유지했고, 본문 기준 어휘를 야훼로 렌더링했습니다.
- source_word: יְהוָה ... בֵּין ... וּבֵין ... עַד עוֹלָם
  english_pob_choice: May the LORD be between me and you, and between my offspring and your offspring forever
  chosen_korean: 야훼께서 나와 당신 사이에, 또 내 자손과 당신 자손 사이에 영원히 계시기를 바랍니다
  alternatives_korean:
  - 야훼께서 나와 당신 사이에, 또 내 씨와 당신 씨 사이에 영원히 계시기를 바랍니다
  - 야훼께서 나와 당신 사이와 내 후손과 당신 후손 사이에 영원히 계시기를 바랍니다
  lexicon: interpersonal covenant formula
  rationale: ‘사이에 계시다’는 관계적 중재/증인의 의미를 보존했고, זרע를 문맥상 ‘자손’으로 옮겨 후손 관계를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: YHWH divine name in a covenant oath formula
  chosen_reading: 본문의 주어·맹세 대상인 YHWH를 ‘야훼’로 일관되게 옮겨 언약적 엄숙성을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문 히브리어의 고유한 신명 사용을 가리거나 교회 관습어로 평준화하지 않고, 본문의 직접성을 유지하는 것이 더 적절합니다.
  doctrine_reference: divine name / covenant theology
