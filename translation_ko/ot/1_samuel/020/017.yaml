  yaml_path: translation/ot/1_samuel/020/017.yaml
  text: And Jonathan made David swear again by his love for him[b][a], for he loved him as his own soul.
  footnotes:
  - marker: a
    text: Or, 'Jonathan continued to make David swear' or 'Jonathan put David under oath again.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew, 'for he loved him with the love of his own soul,' an idiom expressing profound personal devotion.
    reason: lexical_alternative
translation:
  language: ko
  text: 요나단은 자기 생명처럼 그를 사랑하였기 때문에, 다윗에게 자기의 사랑으로 다시 맹세하게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 사랑으로’라고 짧게 말하며, 요나단의 사랑이 맹세의 근거가 되었음을 압축적으로 표현합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיּוֹסֶף
  english_pob_choice: made ... again
  chosen_korean: 다시 맹세하게 했습니다
  alternatives_korean:
  - 계속 맹세하게 했습니다
  - 맹세를 더하게 했습니다
  lexicon: HALOT
  rationale: 동사 יסף의 반복/추가 의미를 한국어에서는 부사 ‘다시’와 ‘맹세하게 했습니다’로 자연스럽게 살려, 행위의 재개를 분명히 드러냈습니다.
- source_word: לְהַשְׁבִּיעַ
  english_pob_choice: made David swear
  chosen_korean: 맹세하게 했습니다
  alternatives_korean:
  - 맹세하도록 했습니다
  - 맹세시켰습니다
  - 맹세를 시켰습니다
  lexicon: HALOT
  rationale: 히필형의 사역성을 보존하되, 현대 한국어에서는 ‘맹세하게 하다’가 가장 자연스럽고 문맥상 분명합니다.
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  english_pob_choice: by his love for him
  chosen_korean: 자기의 사랑으로
  alternatives_korean:
  - 그를 향한 자기의 사랑으로
  - 그에 대한 사랑으로
  lexicon: HALOT
  rationale: 전치사 ב의 근거/매개 의미를 살리되, 한국어에서는 ‘사랑으로’가 더 압축적이고 서사 흐름에도 맞습니다. 소유대명사 ‘자기’는 요나단의 사랑임을 분명히 합니다.
- source_word: אַהֲבַת נַפְשׁוֹ אֲהֵבוֹ
  english_pob_choice: for he loved him as his own soul
  chosen_korean: 자기 생명처럼 그를 사랑하였기 때문에
  alternatives_korean:
  - 자기 혼처럼 그를 사랑하였기 때문에
  - 자기 영혼처럼 그를 사랑하였기 때문에
  lexicon: HALOT
  rationale: נפשׁ은 이 관용구에서 ‘영혼’보다 ‘생명/자기 존재’의 뉘앙스가 강하므로, 문어체 한국어에서 ‘자기 생명처럼’이 원문의 강한 친밀성과 동일시를 가장 잘 전달합니다.
theological_decisions:
- issue: 요나단의 사랑의 성격
  chosen_reading: 사랑을 그대로 유지하되, 로맨틱하거나 성적 의미를 덧씌우지 않고 언약적·개인적 헌신으로만 제시했습니다.
  alternative_readings:
  - ‘우정’으로 약화하기
  - 로맨틱 뉘앙스를 암시하기
  rationale: 히브리어 반복 어근 אהב는 강한 사랑을 뜻하므로 약화하지 말아야 하지만, 본문이 직접 말하지 않는 해석은 번역문에 끼워 넣지 않는 것이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it; Never import doctrinal claims the text does not make.'
