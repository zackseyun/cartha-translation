  source_fidelity: 원문의 어순과 논리 관계는 요나단이 다윗에게 다시 맹세하게 한 뒤, 그 이유를 ‘그가 자기 생명처럼 다윗을 사랑했기 때문’이라고 덧붙입니다. 초안은 이 설명을 문두의 이유절로 옮겨도 뜻은 대체로 보존하지만, ‘자기의 사랑으로’는 한국어에서 무엇을 뜻하는지 다소 불분명합니다. ‘그를 향한 자기의 사랑 때문에’로 명시하면 בְּאַהֲבָתוֹ אֹתוֹ의 근거·동기를 자연스럽게 드러냅니다.
  naturalness: ‘자기 생명처럼 그를 사랑하였기 때문에’ 자체는 자연스럽지만, 뒤의 ‘자기의 사랑으로’와 의미가 중복되고 문장 진행이 다소 무겁습니다. 두 절로 나누고 각 대명사의 지시 대상을 ‘다윗’으로 밝혀 현대 문어체 합쇼체에서 더 명료하게 다듬었습니다.
  terminology: ‘사랑’, ‘생명’, ‘맹세하게 했습니다’를 유지했습니다. ‘생명처럼’은 נֶפֶשׁ의 관용적 의미를 무리 없이 전달하며, 사랑의 성격에 관해 본문 밖의 해석을 더하지 않습니다.
