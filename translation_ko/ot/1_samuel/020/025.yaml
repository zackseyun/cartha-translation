  text: וַ/יֵּ֣שֶׁב הַ֠/מֶּלֶךְ עַל מ֨וֹשָׁב֜/וֹ כְּ/פַ֣עַם בְּ/פַ֗עַם אֶל מוֹשַׁב֙ הַ/קִּ֔יר וַ/יָּ֨קָם֙ יְה֣וֹנָתָ֔ן וַ/יֵּ֥שֶׁב אַבְנֵ֖ר מִ/צַּ֣ד שָׁא֑וּל וַ/יִּפָּקֵ֖ד מְק֥וֹם דָּוִֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/025.yaml
  text: The king sat in his seat[a], as at other times, by the wall; and Jonathan rose, and Abner sat beside Saul, but David’s place was empty.
  footnotes:
  - marker: a
    text: Or “David’s place was missing,” that is, his assigned place at the meal was unoccupied.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 늘 하던 대로 자기 자리에 앉아 있었고, 다윗의 자리는 벽 쪽에 있었습니다. 요나단이 일어나고, 아브넬은 사울 곁에 앉았으나, 다윗의 자리는 비어 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “다윗의 자리가 없었습니다”, 곧 식사 자리에서 그에게 배정된 자리가 차지되지 않았다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב הַמֶּלֶךְ עַל מוֹשָׁבוֹ
  english_pob_choice: The king sat in his seat
  chosen_korean: 왕은 자기 자리에 앉아 있었고
  alternatives_korean:
  - 왕은 그의 자리에 앉았고
  - 왕은 자기 좌석에 앉아 있었고
  lexicon: HALOT
  rationale: 열린 식사 자리의 맥락에서 מוֹשָׁב은 ‘자리/좌석’이 자연스럽고, 열왕의 칭호를 살려 ‘왕’으로 옮기면 문맥상 사울을 가리키는 호칭도 보존됩니다.
- source_word: כְּפַעַם בְּפַעַם
  english_pob_choice: as at other times
  chosen_korean: 늘 하던 대로
  alternatives_korean:
  - 전처럼
  - 평소처럼
  lexicon: HALOT
  rationale: 관용구로서 ‘이전의 여러 번과 같이, 늘 하던 대로’의 반복성을 나타내므로 한국어에서는 자연스러운 관용 표현이 더 정확합니다.
- source_word: אֶל מוֹשַׁב הַקִּיר
  english_pob_choice: by the wall
  chosen_korean: 벽 쪽에
  alternatives_korean:
  - 벽 곁에
  - 벽 옆에
  lexicon: HALOT
  rationale: 문자적으로는 ‘벽의 자리’에 해당하지만, 식탁 배치의 위치 관계를 드러내는 표현이므로 ‘벽 쪽에’가 가장 자연스럽게 공간감을 살립니다.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  english_pob_choice: David’s place was empty
  chosen_korean: 다윗의 자리는 비어 있었습니다
  alternatives_korean:
  - 다윗의 자리는 비어 있었습니다
  - 다윗의 자리는 빠져 있었습니다
  lexicon: HALOT
  rationale: פָּקַד의 이 용법은 ‘자리가 비어 있다/예정된 사람이 없다’는 뜻이므로, ‘비어 있었습니다’가 POB의 문맥적 해석을 가장 잘 반영합니다.
theological_decisions:
- issue: 본문은 다윗의 부재를 단순한 빈자리 이상으로 암시하는지
  chosen_reading: 직접적으로는 ‘다윗이 없어서 그의 지정된 자리가 비어 있었다’는 사실을 진술하는 것으로 옮기고, 암시는 본문 밖에서 과도하게 풀지 않았습니다.
  alternative_readings:
  - 다윗의 자리가 빠져 있었습니다
  - 다윗이 사라졌습니다
  rationale: 히브리어는 현재 장면의 관찰을 기록할 뿐이므로, 내러티브 이상의 해석을 본문에 덧붙이지 않는 것이 적절합니다.
  doctrine_reference: 본문관찰 우선 원칙
