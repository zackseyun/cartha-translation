  naturalness: ‘신실함을 내게 보여 주시어’보다 호의나 충성을 ‘베풀다’라고 하는 편이 현대 한국어에서 자연스럽습니다. 또한 ‘내가 죽지 않게 하실 것이 아닙니까?’는 ‘하시어’와 ‘하실’의 주체가 불필요하게 겹치고 다소 완곡합니다. ‘해 주시겠습니까?’가 합쇼체의 간청형 의문으로 명료합니다.
