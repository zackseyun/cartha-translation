source:
  edition: WLC
  text: וְ/לֹ֖א אִם עוֹדֶ֣/נִּי חָ֑י וְ/לֹֽא תַעֲשֶׂ֧ה עִמָּדִ֛/י חֶ֥סֶד יְהוָ֖ה וְ/לֹ֥א אָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/014.yaml
  text: And if I am still alive[a], will you not show me Yahweh’s covenant faithfulness, so that I may not die?
  footnotes:
  - marker: a
    text: Or 'show me the kindness/steadfast love of the LORD.' The Hebrew phrase can also be taken as referring more directly to the LORD’s own loyal love rather than covenant faithfulness shown in the LORD’s name.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 아직 살아 있다면, 야훼의 언약적 신실함을 내게 보여 주시어 내가 죽지 않게 하실 것이 아닙니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘언약적 신실함’은 이 문맥의 חֶסֶד을 언약 관계의 충실성으로 읽은 번역입니다. ‘인자하심’이나 ‘변함없는 사랑’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אִם
  english_pob_choice: And if
  chosen_korean: 내가 아직 살아 있다면
  alternatives_korean:
  - 그리고 만일
  - 내가 아직 살아 있고
  lexicon: HALOT
  rationale: 이 결합은 단순한 부정이 아니라 맹세/간청의 조건문이므로, 자연스러운 한국어 조건 표현으로 옮겼습니다.
- source_word: עוֹדֶנִּי חָי
  english_pob_choice: I am still alive
  chosen_korean: 내가 아직 살아 있다면
  alternatives_korean:
  - 내가 여전히 살아 있다면
  - 내가 아직 생존해 있다면
  lexicon: HALOT
  rationale: עוֹד의 시간적 뉘앙스와 חָי의 상태를 함께 살려, 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: תַעֲשֶׂה עִמָּדִי חֶסֶד
  english_pob_choice: show me Yahweh’s covenant faithfulness
  chosen_korean: 야훼의 언약적 신실함을 내게 보여 주시어
  alternatives_korean:
  - 야훼의 인자하심을 내게 베푸시어
  - 야훼의 변함없는 사랑을 내게 보여 주시어
  lexicon: HALOT
  rationale: עשה עם는 ‘대하다/베풀다’의 관용적 표현이므로 ‘보여 주시어’로 자연스럽게 풀고, חֶסֶד은 이 문맥의 언약 관계를 반영하여 ‘언약적 신실함’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh’s
  chosen_korean: 야훼의
  alternatives_korean:
  - 여호와의
  - 주님의
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기적 이름 יְהוָה는 ‘야훼’로 옮겨, 고유한 신적 이름을 보존했습니다.
theological_decisions:
- issue: חֶסֶד יְהוָה의 의미 범위
  chosen_reading: 야훼의 언약적 신실함
  alternative_readings:
  - 야훼의 인자하심
  - 야훼의 변함없는 사랑
  - 야훼의 신실한 사랑
  rationale: 이 구절은 단순한 친절보다 다윗과 요나단의 언약 관계 안에서 요구되는 충실성을 가리키므로, 그 언약적 성격을 드러내는 표현을 선택했습니다.
  doctrine_reference: 'DOCTRINE.md: covenantal חֶסֶד / loyal commitment in oath contexts'
- issue: 화자의 간청 어조
  chosen_reading: 내가 아직 살아 있다면 … 내가 죽지 않게 하실 것이 아닙니까?
  alternative_readings:
  - 내가 아직 살아 있다면 … 나를 죽이지 마십시오
  - 내가 아직 살아 있다면 … 내가 죽지 않게 해 주십시오
  rationale: 본문은 질문형 요청으로 끝나므로, 한국어에서도 간청의 강도를 살린 반문형으로 처리했습니다.
