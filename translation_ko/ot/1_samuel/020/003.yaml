  text: וַ/יִּשָּׁבַ֨ע ע֜וֹד דָּוִ֗ד וַ/יֹּ֨אמֶר֙ יָדֹ֨עַ יָדַ֜ע אָבִ֗י/ךָ כִּֽי מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ וַ/יֹּ֛אמֶר אַל יֵֽדַע זֹ֥את יְהוֹנָתָ֖ן פֶּן יֵֽעָצֵ֑ב וְ/אוּלָ֗ם חַי יְהוָה֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ כִּ֣י כְ/פֶ֔שַׂע בֵּינִ֖/י וּ/בֵ֥ין הַ/מָּֽוֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/003.yaml
  text: But David swore again and said, “Your father certainly knows that I have found favor in your eyes, and he has said, ‘Jonathan must not know this, lest he be grieved.’ But as the LORD lives, and as your soul lives, there is only a step between me and death.”
translation:
  language: ko
  text: 그러자 다윗이 다시 맹세하며 말했습니다. "당신의 아버지는 내가 당신의 눈에 은총을 입었다는 것을 분명히 알고 있습니다. 그리고 그는 말하기를, ‘이 일을 요나단이 알면 안 된다. 그가 상하지 않도록 하려는 것이다.’ 하지만 야훼께서 살아 계시듯, 그리고 당신의 생명이 살아 있듯, 나와 죽음 사이에는 한 걸음밖에 남지 않았습니다."[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘내가 당신의 눈에서 은총을 찾았다’입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּשָּׁבַע עוֹד דָּוִד
  english_pob_choice: But David swore again and said
  chosen_korean: 다윗이 다시 맹세하며 말했습니다
  alternatives_korean:
  - 다윗이 또 맹세하며 말했습니다
  - 다윗이 다시 맹세하고 말했습니다
  lexicon: שׁבע
  rationale: 원문의 ‘다시’와 서술 동사의 진행을 살리면서, 한국어에서는 자연스럽게 ‘맹세하며 말했습니다’로 옮겨 맹세 행위와 발화를 함께 드러냈습니다.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  english_pob_choice: I have found favor in your eyes
  chosen_korean: 당신의 눈에 은총을 입었다는 것
  alternatives_korean:
  - 당신의 눈에 호의를 얻었다는 것
  - 당신의 눈에 은혜를 입었다는 것
  lexicon: חֵן
  rationale: חֵן은 관용적으로 ‘은총을 입다’로 옮길 수 있어, 단순 호감보다 상대가 베풀어 준 호의/호감을 담는 표현을 택했습니다.
- source_word: אַל יֵדַע זֹאת יְהוֹנָתָן פֶּן יֵעָצֵב
  english_pob_choice: Jonathan must not know this, lest he be grieved
  chosen_korean: 이 일을 요나단이 알면 안 된다. 그가 상하지 않도록 하려는 것이다
  alternatives_korean:
  - 요나단이 이것을 알아서는 안 된다. 그가 근심하지 않도록 하려는 것이다
  - 요나단이 이것을 알지 못하게 하라. 그가 슬퍼하지 않도록 하려는 것이다
  lexicon: ידע / עצב
  rationale: POB의 ‘must not know this’는 명령문보다 금지/필요성 진술에 가깝고, עצב는 단순 감정 명칭보다 ‘상하다’가 문맥상 더 강하게 전달되므로 그렇게 옮겼습니다.
- source_word: חַי יְהוָה
  english_pob_choice: the LORD lives
  chosen_korean: 야훼께서 살아 계시듯
  alternatives_korean:
  - 야훼께서 살아 계십니다
  - 야훼의 삶을 두고
  lexicon: יהוה
  rationale: יהוה는 프로젝트 기본값에 따라 ‘야훼’로 두고, 맹세 공식의 비교 구문을 한국어에서 자연스럽게 살리기 위해 ‘-듯’ 구조를 사용했습니다.
theological_decisions:
- issue: 맹세 공식과 직설 화행의 한국어 높임 유지
  chosen_reading: 서술문은 합쇼체로 두고, 직접 인용된 다윗의 발화 안에서는 맹세와 진술을 그대로 유지했습니다.
  alternative_readings:
  - 전체를 평서체로 단일화
  - 인용문까지 전부 높임말로 평준화
  rationale: 본문은 서술자 말과 인용 발화가 분명히 구분되므로, 바깥 서술은 합쇼체로 유지하고 인용문은 원문의 화행 구조를 보존하는 편이 더 충실합니다.
  doctrine_reference: 서사체/인용문 구분 원칙
- issue: ‘여호와’ 대신 ‘야훼’ 사용
  chosen_reading: הוָה를 ‘야훼’로 옮기고, 맹세문의 신적 증언 기능을 그대로 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값과 원문 일치성을 따랐으며, 맹세 공식에서 신명 자체가 증언의 근거로 기능하므로 이를 명시적으로 보존했습니다.
  doctrine_reference: YHWH 표기 원칙
