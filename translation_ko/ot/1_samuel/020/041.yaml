  source_fidelity: 전반적으로 히브리어의 서술 순서와 몸짓을 충실히 옮겼습니다. 그러나 אִישׁ אֶת־רֵעֵהוּ를 ‘서로를 위해’로 옮기면 ‘상대를 위하여’ 운다는 뜻이 되어 상호 행위의 뜻에서 벗어납니다. 또한 עַד דָּוִד הִגְדִּיל은 ‘~까지’의 진행·한계를 드러내므로 ‘다윗의 울음이 더 심했습니다’보다 ‘다윗이 더 크게 울 때까지’가 더 가깝습니다.
  naturalness: ‘남쪽 곁에서’는 원문의 난해함을 보존하는 번역으로 가능하지만 다소 어색하므로 주석을 바로 붙이는 것이 독자의 이해에 도움이 됩니다. ‘서로 입을 맞추고 함께 울었는데’는 현대 표준 한국어에서 자연스럽고 원문의 상호성을 무리 없이 전달합니다.
  terminology: ‘절했습니다’는 예배로 한정하지 않고 경의의 몸짓을 나타내어 적절합니다. ‘입을 맞추다’도 작별과 애정의 관습적 표현을 불필요하게 완화하지 않습니다. ‘더 크게 울다’는 גדל의 비교적·강조적 용법을 자연스럽게 반영하되, 요나단보다 더 울었다는 해석은 주석에서만 제시합니다.
