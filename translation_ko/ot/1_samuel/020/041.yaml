base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/041.yaml
  text: When the boy had come[a], David rose from beside the south side and fell with his face to the ground and bowed three times. Then they kissed one another and wept with one another[b], until David wept the more.
  footnotes:
  - marker: a
    text: Hebrew 'from beside the Negeb/south'; the phrase is difficult, and many understand it as referring to the mound or stone near David's hiding place in the immediate context.
    reason: alternative_reading
  - marker: b
    text: Or 'until David wept more,' that is, his weeping exceeded Jonathan's or grew more intense.
    reason: lexical_alternative
translation:
  language: ko
  text: 소년이 오자, 다윗은 남쪽 곁에서 일어나 얼굴을 땅에 대고 엎드려 세 번 절했습니다. 그러고 나서 두 사람은 서로 입을 맞추고 서로를 위해 울었는데, 다윗의 울음이 더 심했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘네게브/남쪽 곁에서’는 난해하며, 바로 앞 문맥의 은신처 근처에 있는 바위나 표지물을 가리킨다고 이해하는 견해가 많습니다.
    reason: source_note
  - marker: b
    text: 또는 ‘다윗이 더 많이 울 때까지’라는 뜻일 수 있습니다. 즉, 다윗의 울음이 요나단의 울음을 넘었거나 더 격해졌다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר בָּא
  english_pob_choice: When the boy had come
  chosen_korean: 소년이 오자
  alternatives_korean:
  - 그 소년이 왔을 때
  - 그 젊은이가 오자
  lexicon: HALOT
  rationale: נַעַר는 문맥상 앞선 장면의 종을 가리키므로, 한국어에서는 자연스럽고 구체적인 ‘소년’으로 옮겼습니다.
- source_word: מֵאֵצֶל הַנֶּגֶב
  english_pob_choice: from beside the south side
  chosen_korean: 남쪽 곁에서
  alternatives_korean:
  - 남쪽 편에서
  - 네게브 곁에서
  - 남쪽 면에서
  lexicon: HALOT
  rationale: 이 표현은 원문 자체가 난해하므로, 방향어를 유지하되 지형적 위치를 드러내는 간결한 한국어 ‘남쪽 곁에서’로 처리했습니다.
- source_word: וַיִּפֹּל לְאַפָּיו אַרְצָה וַיִּשְׁתַּחוּ שָׁלֹשׁ פְּעָמִים
  english_pob_choice: fell with his face to the ground and bowed three times
  chosen_korean: 얼굴을 땅에 대고 엎드려 세 번 절했습니다
  alternatives_korean:
  - 얼굴을 땅에 대고 엎드렸고 세 번 절했습니다
  - 얼굴을 땅에 대고 엎드려 세 번 경배했습니다
  lexicon: HALOT
  rationale: ‘엎드리다’와 ‘절하다’로 몸짓의 연속을 살리면서, שׁחה의 예배적 뉘앙스를 지나치게 교회식 용어로 고정하지 않았습니다.
- source_word: וַיִּשְּׁקוּ אִישׁ אֶת רֵעֵהוּ וַיִּבְכּוּ אִישׁ אֶת רֵעֵהוּ
  english_pob_choice: Then they kissed one another and wept with one another
  chosen_korean: 두 사람은 서로 입을 맞추고 서로를 위해 울었는데
  alternatives_korean:
  - 두 사람은 서로 입을 맞추고 함께 울었는데
  - 두 사람은 서로 입을 맞추고 서로 울었는데
  lexicon: HALOT
  rationale: אִישׁ אֶת רֵעֵהוּ의 상호성을 살리되, 한국어에서는 ‘서로를 위해 울다’보다 의미가 분명한 ‘서로 입을 맞추고 서로를 위해 울다’로 정리했습니다.
- source_word: עַד דָּוִד הִגְדִּיל
  english_pob_choice: until David wept the more
  chosen_korean: 다윗의 울음이 더 심했습니다
  alternatives_korean:
  - 다윗이 더 많이 울 때까지
  - 다윗의 울음이 더 컸습니다
  lexicon: HALOT
  rationale: גדל의 비교적·강조적 의미를 한국어에서 자연스럽게 드러내기 위해, 단순 양적 표현보다 강도의 증가를 나타내는 ‘더 심했습니다’를 택했습니다.
theological_decisions:
- issue: 이 본문에서의 bowing/kissing/weeping의 정서적·사회적 의미
  chosen_reading: 다윗과 요나단의 이별 장면으로서, 절함·입맞춤·울음은 우정과 언약 관계의 진지함을 드러내는 몸짓으로 읽었습니다.
  alternative_readings:
  - 단순한 작별 인사
  - 궁정 예절의 표현
  rationale: 본문의 행동들은 감정 표출을 넘어서 관계의 무게를 보여 주므로, 그 긴장을 약화시키지 않는 방향으로 번역했습니다.
  doctrine_reference: 1 Samuel 20장의 언약적 우정 문맥
