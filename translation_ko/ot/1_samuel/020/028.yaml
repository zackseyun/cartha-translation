  source_fidelity: 히브리어의 응답 동사, 다윗이 요나단에게 허락을 요청한 사실, 그리고 베들레헴을 향한 이동은 대체로 정확히 반영합니다. 다만 '베들레헴까지'는 עַד의 문맥상 목적지를 자연스럽게 드러내지만 거리의 한계나 '…까지'라는 뉘앙스를 더할 수 있어, '베들레헴으로'가 더 적절합니다.
  naturalness: '''대답하여 말했습니다''는 한국어에서 다소 중복적으로 들립니다. ''사울에게 대답했습니다''가 현대 표준어 합쇼체 서술에서 더 자연스럽고 간결합니다. ''허락을 구했습니다''는 이 문맥의 שאל을 정확하고 자연스럽게 전달합니다.'
  terminology: 요나단, 사울, 다윗, 베들레헴의 표기는 표준적입니다. 강조를 '간절히'로 옮긴 것은 안전합니다. 현 각주의 '완료형'은 원문의 정형동사 분석과 맞지 않으므로, 시상 범주를 특정하지 않고 '정형 동사'라고 해야 합니다.
