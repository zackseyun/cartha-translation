    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 응답했습니다
  lexicon: HALOT
  rationale: 대화 장면의 wayyiqtol ענה를 자연스럽게 살리면서, 서술체의 흐름을 위해 '대답하여 말했습니다'로 옮겼습니다.
- source_word: נִשְׁאֹל נִשְׁאַל
  english_pob_choice: earnestly asked leave
  chosen_korean: 간절히 요청했습니다
  alternatives_korean:
  - 거듭 허락을 구했습니다
  - 허락해 달라고 거듭 요청했습니다
  - 간청했습니다
  lexicon: HALOT
  rationale: 부정사 절대형과 완료형의 반복으로 생기는 강조를 한국어에서는 부사 '간절히'로 살려, 단순한 요청보다 강한 청원을 드러냈습니다.
- source_word: מֵעִמָּדִי
  english_pob_choice: of me
  chosen_korean: 제게
  alternatives_korean:
  - 제게서
  - 저에게서
  - 저에게
  lexicon: HALOT
  rationale: '''of me''가 의미하는 요청의 출처/상대방을 한국어에서는 ''제게''로 자연스럽게 풀어, 허락을 구한 대상이 요나단임을 분명히 했습니다.'
- source_word: עַד בֵּית לָחֶם
  english_pob_choice: to go to Bethlehem
  chosen_korean: 베들레헴까지 가게 해 달라고
  alternatives_korean:
  - 베들레헴으로 가게 해 달라고
  - 베들레헴에 가도록 허락해 달라고
  lexicon: HALOT
  rationale: 직역의 '베들레헴을 향하여'보다, 문맥상 요구되는 이동 목적을 분명히 드러내는 동태 표현으로 옮겼습니다.
theological_decisions:
- issue: 히브리어의 강조용 부정사 절대형을 어떻게 드러낼지
  chosen_reading: 반복 구조를 한국어 부사 '간절히'로 압축해 강조를 표현했습니다.
  alternative_readings:
  - '''거듭''을 넣어 반복성을 더 직접적으로 표현함'
  - 원문 구조를 따라 '간절히 간절히'처럼 중복 표현을 사용함
  rationale: 한국어에서는 히브리어의 형식적 반복을 그대로 재현하기보다, 의미 기능인 강조를 자연스럽게 전달하는 것이 본문의 힘을 유지합니다.
  doctrine_reference: 번역학적 선택
