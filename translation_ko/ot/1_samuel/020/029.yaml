  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר שַׁלְּחֵ֣/נִי נָ֡א כִּ֣י זֶבַח֩ מִשְׁפָּחָ֨ה לָ֜/נוּ בָּ/עִ֗יר וְ/ה֤וּא צִוָּֽה לִ/י֙ אָחִ֔/י וְ/עַתָּ֗ה אִם מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אִמָּ֥לְטָה נָּ֖א וְ/אֶרְאֶ֣ה אֶת אֶחָ֑/י עַל כֵּ֣ן לֹא בָ֔א אֶל שֻׁלְחַ֖ן הַ/מֶּֽלֶךְ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/029.yaml
  text: He said[a], ‘Please let me go, because we have a family sacrifice in the city, and my brother himself has commanded me. So now, if I have found favor in your eyes[b], please let me escape and see my brothers.’ Therefore he has not come to the king’s table.
  footnotes:
  - marker: a
    text: Or, “please let me escape and see my brothers.” The Hebrew verb can carry the sense of escaping or slipping away discreetly.
    reason: lexical_alternative
  - marker: b
    text: “My brothers” may refer to David’s literal brothers or, more broadly, his male kin within the family group.
    reason: cultural_note
translation:
  language: ko
  text: 그가 말했습니다. 「부디 저를 가게 해주십시오. 우리에게는 성읍에서 가족 제사가 있고, 제 형이 저에게 직접 그렇게 명령했습니다. 그러니 이제, 제가 당신의 눈에 은혜를 입었다면, 부디 제가 도망치듯 빠져나가 형들을 보게 해주십시오.」 그러므로 그는 왕의 식탁에 오지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 '도망치듯 빠져나가다'의 의미도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''형들''은 다윗의 실제 형제들일 수도 있고, 더 넓게는 같은 가족 집단의 남자 친족을 가리킬 수도 있습니다.'
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי נָא
  english_pob_choice: Please let me go
  chosen_korean: 부디 저를 가게 해주십시오
  alternatives_korean:
  - 부디 저를 보내주십시오
  - 부디 저를 놓아주십시오
  lexicon: HALOT
  rationale: שלח의 간청형을 현대 한국어의 정중한 요청으로 옮기되, 떠나게 해달라는 의미를 자연스럽게 살렸습니다.
- source_word: זֶבַח מִשְׁפָּחָה
  english_pob_choice: a family sacrifice
  chosen_korean: 가족 제사
  alternatives_korean:
  - 가문 제사
  - 씨족 제사
  - 가족 희생제사
  lexicon: HALOT
  rationale: זֶבַח의 제의적 성격을 살리면서 מִשְׁפָּחָה를 가족 단위로 옮겼습니다. 한국어에서 '제사'는 본문이 말하는 공동체적 희생 제의의 기능을 가장 압축적으로 전달합니다.
- source_word: וְהוּא צִוָּה לִי אָחִי
  english_pob_choice: and my brother himself has commanded me
  chosen_korean: 제 형이 저에게 직접 그렇게 명령했습니다
  alternatives_korean:
  - 제 형이 저에게 명령했습니다
  - 제 형이 저를 지시했습니다
  lexicon: HALOT
  rationale: 문맥상 강조는 사람 '형'에게 있고, הוּא의 강조를 한국어 부사 '직접'으로 반영했습니다. צוה는 단순한 부탁보다 강한 명령을 뜻하므로 '명령했습니다'가 적절합니다.
- source_word: אִמָּלְטָה נָּא
  english_pob_choice: please let me escape
  chosen_korean: 부디 제가 도망치듯 빠져나가
  alternatives_korean:
  - 부디 제가 도망가게 해주십시오
  - 부디 제가 빠져나가게 해주십시오
  lexicon: HALOT
  rationale: מלט의 '빠져나가다/도망치다' 뉘앙스를 살리되, 이 상황의 은밀한 이탈을 드러내기 위해 '도망치듯'을 넣었습니다.
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그렇기 때문에
  - 그리하여
  lexicon: HALOT
  rationale: 앞선 사정을 근거로 한 결론을 이어 주는 접속을 공식적 문체인 '그러므로'로 옮겼습니다.
