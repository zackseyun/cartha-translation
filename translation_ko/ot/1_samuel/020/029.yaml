  source_fidelity: 히브리어의 단수 אָחִי는 나이 관계를 특정하지 않으므로 ‘제 형’은 ‘형(연상의 남자 형제)’으로 한정하는 문제가 있습니다. 또한 אִמָּלְטָה의 의미를 ‘도망치듯’으로 확대하지 않고 ‘빠져나가’로 옮기는 편이 안전합니다. 강조형 הוּא는 ‘바로’로 반영할 수 있습니다.
  naturalness: 합쇼체 문체는 대체로 자연스럽지만, ‘저를 가게 해주십시오’와 ‘제가 … 보게 해주십시오’의 반복은 다소 무겁습니다. ‘떠나게 해 주십시오’와 ‘만나게 해 주십시오’가 현대 한국어 성경 문체에서 자연스럽습니다.
  terminology: ‘가족 제사’는 זֶבַח מִשְׁפָּחָה의 제의적 의미를 적절히 보존합니다. ‘형’은 ‘형제’로 고쳐야 하며, 끝의 복수 אֶחָי는 ‘내 형제들’로 옮기는 것이 정확합니다. 각주 표지는 해당 어휘 바로 뒤에 두어야 합니다.
