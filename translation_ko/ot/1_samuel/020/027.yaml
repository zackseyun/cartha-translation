  text: And it happened on the next day[a], the second day of the new moon, that David’s place was empty. So Saul said to Jonathan his son, “Why has the son of Jesse not come to the meal either yesterday or today?”
  footnotes:
  - marker: a
    text: Hebrew 'to the bread,' a common way of referring to the meal or table fellowship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 이튿날, 곧 새달의 둘째 날에 다윗의 자리가 비어 있었습니다. 그래서 사울이 자기 아들 요나단에게 말했습니다. “이새의 아들이 어째서 어제도 오늘도 식사[a]에 오지 않았느냐?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘빵에’이며, 여기서는 식사나 식탁 교제를 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרַת
  english_pob_choice: on the next day
  chosen_korean: 그다음 날
  alternatives_korean:
  - 다음 날
  - 이튿날
  lexicon: HALOT
  rationale: 이전 맥락의 다음 날이라는 시간 순서를 자연스러운 현대 한국어로 살리면서 원문의 진행을 유지합니다.
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  english_pob_choice: the second day of the new moon
  chosen_korean: 초하루의 둘째 날
  alternatives_korean:
  - 새 달의 둘째 날
  - 신월의 둘째 날
  lexicon: HALOT
  rationale: 여기서 חֹדֶשׁ은 단순한 ‘달’보다 새 달 의식/행사를 가리키므로, 한국어로는 ‘초하루’가 가장 자연스럽게 해당 관습을 전달합니다.
- source_word: מְקוֹם דָּוִד
  english_pob_choice: David’s place was empty
  chosen_korean: 다윗의 자리가 비어 있었습니다
  alternatives_korean:
  - 다윗의 자리가 없었습니다
  - 다윗의 자리가 결석해 있었습니다
  lexicon: HALOT
  rationale: 연회 자리에서의 부재를 의미하므로, ‘비어 있다’가 문맥상 가장 직관적이며 식사 자리의 공백을 잘 드러냅니다.
- source_word: בֶן יִשַׁי
  english_pob_choice: the son of Jesse
  chosen_korean: 이새의 아들
  alternatives_korean:
  - 다윗
  - 이새의 자손
  lexicon: HALOT
  rationale: 사울이 다윗의 이름 대신 부계 호칭을 사용해 거리감과 비난의 뉘앙스를 드러내므로, 이를 그대로 보존했습니다.
