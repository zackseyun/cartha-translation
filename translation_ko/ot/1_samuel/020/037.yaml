base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/037.yaml
  text: When the boy came to the place of the arrow that Jonathan had shot[a], Jonathan called after the boy and said, “Is not the arrow beyond you?”
  footnotes:
  - marker: a
    text: Or “farther than you” / “past you and beyond.” The Hebrew phrase literally means “from you and onward.”
    reason: lexical_alternative
translation:
  language: ko
  text: 소년이 요나단이 쏜 화살이 있는 곳에 이르자, 요나단이 소년의 뒤에서 불러 말했습니다. “화살이 네 너머에 있지 않느냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “화살이 네 앞쪽에 더 멀리 있지 않느냐?” 히브리어는 문자적으로 “너에게서부터 더 앞으로”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  english_pob_choice: the boy
  chosen_korean: 보병
  alternatives_korean:
  - 소년
  - 젊은이
  - 종
  lexicon: HALOT
  rationale: 이 인물은 요나단의 지시에 따라 움직이는 수행원/전령 역할을 하므로, 단순한 나이 중심의 ‘소년’보다 군사적 수행자 뉘앙스를 살린 ‘보병’이 문맥상 적합합니다.
- source_word: עַד מְקוֹם הַחֵצִי
  english_pob_choice: to the place of the arrow
  chosen_korean: 화살 있는 곳에 이르자
  alternatives_korean:
  - 화살의 장소까지
  - 화살이 있는 곳까지
  - 화살이 떨어진 곳에 이르자
  lexicon: HALOT
  rationale: 히브리어의 ‘~까지/그 지점에’라는 이동 완료를 자연스러운 한국어 서술로 옮기되, 표적이 된 화살의 위치를 분명히 드러냈습니다.
- source_word: מִמְּךָ וָהָלְאָה
  english_pob_choice: beyond you
  chosen_korean: 당신보다 더 멀리
  alternatives_korean:
  - 당신을 지나서
  - 당신 너머
  - 당신보다 뒤가 아니라 앞쪽
  lexicon: HALOT
  rationale: 직역하면 ‘당신에게서부터 앞으로’라는 뜻이지만, 이 장면의 암호 신호를 한국어에서 가장 즉각적으로 전달하는 표현은 ‘당신보다 더 멀리’입니다.
- source_word: וַיִּקְרָא ... אַחֲרֵי
  english_pob_choice: called after
  chosen_korean: 뒤에서 외쳐
  alternatives_korean:
  - 뒤따라 외쳐
  - 뒤쫓아 외쳐
  - 뒤에서 불러
  lexicon: HALOT
  rationale: אַחֲרֵי는 뒤에 있는 대상에게 소리쳐 부르는 관계를 나타내므로, 한국어에서는 위치 관계를 살린 ‘뒤에서 외쳐’가 가장 자연스럽습니다.
theological_decisions:
- issue: 암호 신호로서의 문장 의미를 문자적 질문과 함께 유지할 것인가
  chosen_reading: 표면상 질문은 그대로 두되, 서술 전체에서 화살이 ‘당신보다 더 멀리’ 있다는 암시가 드러나도록 옮겼습니다.
  alternative_readings:
  - 단순 정보 질문으로만 처리
  - 의미를 풀어 ‘멀리 있으니 가라’로 의역
  rationale: 본문은 단순한 위치 확인이 아니라 다윗에게 보내는 신호이므로, 질문 형식을 보존하면서도 암호적 함의를 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 본문 서사 의도 보존
- issue: הַנַּעַר의 사회적 역할을 어떻게 표현할 것인가
  chosen_reading: ‘보병’으로 옮겨 요나단의 지시를 수행하는 인물임을 드러냈습니다.
  alternative_readings:
  - 소년
  - 젊은이
  - 시종
  rationale: 이 장면에서 중요한 것은 나이보다 기능이므로, 군사적 수행자라는 맥락을 살린 번역이 서사 이해에 더 도움이 됩니다.
  doctrine_reference: 서사 문맥 우선 원칙
