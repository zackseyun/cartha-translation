  text: וַ/יִּבְרַ֣ח דָּוִ֔ד מ/נוות בָּ/רָמָ֑ה וַ/יָּבֹ֞א וַ/יֹּ֣אמֶר לִ/פְנֵ֣י יְהוֹנָתָ֗ן מֶ֤ה עָשִׂ֨יתִי֙ מֶֽה עֲוֺנִ֤/י וּ/מֶֽה חַטָּאתִ/י֙ לִ/פְנֵ֣י אָבִ֔י/ךָ כִּ֥י מְבַקֵּ֖שׁ אֶת נַפְשִֽׁ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/001.yaml
  text: Then David fled from Naioth in Ramah and came before Jonathan and said[a], “What have I done? What is my guilt, and what is my sin before your father, that he is seeking my life?”
  footnotes:
  - marker: a
    text: Or “from Naioth at Ramah.” The Hebrew likely refers to the known place-name Naioth associated with Ramah.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 라마의 나욧에서 도망하여 요나단 앞에 이르러 말했습니다. “내가 무엇을 하였습니까? 내 허물이 무엇이며 내 죄가 무엇이기에 당신의 아버지가 내 생명을 찾고 있습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나욧’은 라마와 관련된 지명으로 이해됩니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּבְרַח
  english_pob_choice: fled
  chosen_korean: 도망하여
  alternatives_korean:
  - 달아나
  - 도피하여
  lexicon: HALOT
  rationale: 히브리어 ברח의 긴급한 도주 뉘앙스를 살리면서도 서술문 흐름에 자연스러운 합쇼체 동사구로 옮겼습니다.
- source_word: מִנָּוֹת בָּרָמָה
  english_pob_choice: from Naioth in Ramah
  chosen_korean: 라마의 나욧에서
  alternatives_korean:
  - 라마에 있는 나욧에서
  - 라마의 나욧으로부터
  lexicon: HALOT
  rationale: 나욧을 지명으로 음역하고, מקום 관계를 드러내는 속격 구조를 유지해 본문과 평행하는 지리적 표지를 보존했습니다.
- source_word: לִפְנֵי
  english_pob_choice: before Jonathan
  chosen_korean: 요나단 앞에
  alternatives_korean:
  - 요나단에게
  - 요나단의 앞에
  lexicon: HALOT
  rationale: לִפְנֵי의 문자적 의미인 ‘앞에/면전에서’를 살려, 단순한 이동 목적어보다 면전 도달의 장면성을 유지했습니다.
- source_word: מְבַקֵּשׁ אֶת נַפְשִׁי
  english_pob_choice: he is seeking my life
  chosen_korean: 내 생명을 찾고 있습니까
  alternatives_korean:
  - 내 목숨을 찾고 있습니까
  - 나를 죽이려 합니까
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘생명을 찾다’를 직역하되, 한국어에서 자연스러운 현재진행형으로 다듬어 포상적 의미를 유지했습니다.
theological_decisions:
- issue: 다윗의 세 개의 수사 의문문을 어떻게 살릴지
  chosen_reading: ‘내가 무엇을 하였습니까? 내 허물이 무엇이며 내 죄가 무엇이기에…’로 옮겨, 자기변호와 무죄 호소의 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - ‘내가 무슨 잘못을 했습니까?’로 단순화
  - ‘내 죄과가 무엇입니까?’로 법정 어조 강화
  rationale: 본문은 죄책의 범주를 두 개의 명사(עָוֹן, חַטָּאת)로 병렬해 묻고 있으므로, 이를 하나로 합치지 않고 각각 ‘허물/죄’로 구분해 보존했습니다.
  doctrine_reference: 본문의 문학적·법정적 자기변호 구조
