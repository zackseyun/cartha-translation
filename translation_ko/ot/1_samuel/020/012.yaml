  source_fidelity: 초안은 맹세적 도입, 사울의 다윗에 대한 태도, 그리고 뒤이은 통지 약속이라는 큰 흐름을 반영합니다. 그러나 히브리어의 난해하고 생략적인 신적 호칭을 ‘살아 계심과 같이’로 확정하는 것은 원문에 없는 ‘살아 계심’ 표현을 본문에 추가합니다. 또한 ‘귀를 열다’는 한국어에서 상대의 말을 받아들이거나 마음을 열다는 뜻으로 더 자연스럽게 이해되어, 히브리어 관용구의 뜻인 비밀스러운 알림을 전달하지 못합니다.
  naturalness: ‘이때쯤, 곧 내일이나 셋째 날에’는 시간 부사들이 겹쳐 어색하며, ‘보십시오, 다윗에게 좋다면’도 현대 한국어에서 부자연스럽고 ‘좋다’의 주체가 불명확합니다. ‘내일 이맘때나 셋째 날에’, ‘그가 다윗에게 호의적이라면’이 자연스럽고 의미를 명료하게 합니다.
  terminology: 야훼는 프로젝트의 신명사문자 표기 원칙과 일치합니다. ‘이스라엘의 하나님이신’은 한국어의 자연스러운 동격 구성입니다. ‘알려 주다’는 히브리어의 ‘귀를 드러내다’ 관용구의 의미를 정확히 전달하며, 직역은 각주로 보존합니다.
