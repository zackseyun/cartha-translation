revisions:
- from: 요나단이 다윗에게 말했습니다. “이스라엘의 하나님 야훼께서 살아 계심과 같이, 내가 내 아버지를 이때쯤, 곧 내일이나 셋째 날에 살펴보고, 보십시오, 다윗에게 좋다면, 내가 그때 당신에게 보내어 당신의 귀를 열지 않겠습니까?”[a][b][c]
  to: 요나단이 다윗에게 말했습니다. “이스라엘의 하나님이신 야훼께 맹세합니다.[b] 내가 내일 이맘때나 셋째 날에[c] 아버지의 뜻을 알아보아, 그 결과 그가 다윗에게 호의적이라면, 내가 그때 당신에게 전갈을 보내어 그 일을 알려 주지[a] 않겠습니까?”
  rationale: 원문에 없는 ‘살아 계심’ 표현은 제거하고, 생략된 도입부의 맹세 성격은 제한적으로 보완하되 각주에서 해석적 불확실성을 명시했습니다. 사울의 태도를 가리키는 관계적 의미를 자연스러운 한국어로 드러냈고, 한국어에서 반대 의미로 이해될 수 있는 ‘귀를 열다’는 의미 번역으로 교정했습니다. 각주 표지는 해당 표현 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:28:05Z'
