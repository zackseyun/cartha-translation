base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/012.yaml
  text: And Jonathan said to David[a], “As Yahweh, the God of Israel, lives, when I sound out my father about this time tomorrow, or the third day, and behold, if it is favorable toward David[c][b], shall I not then send to you and uncover your ear?"
  footnotes:
  - marker: a
    text: Hebrew literally, “and uncover your ear,” an idiom meaning “tell you” or “disclose it to you.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew wording is elliptical and difficult; the sense is a solemn oath or pledge invoking the LORD as witness.
    reason: textual_variant
  - marker: c
    text: Or “about this time tomorrow, on the third day”; the Hebrew temporal expression is compressed.
    reason: alternative_reading
translation:
  language: ko
  text: 요나단이 다윗에게 말했습니다. “이스라엘의 하나님 야훼께서 살아 계심과 같이, 내가 내 아버지를 이때쯤, 곧 내일이나 셋째 날에 살펴보고, 보십시오, 다윗에게 좋다면, 내가 그때 당신에게 보내어 당신의 귀를 열지 않겠습니까?”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 “당신의 귀를 열다”로, ‘알려 주다’ 또는 ‘비밀을 전하다’는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 히브리어 표현은 압축되어 있어 해석이 쉽지 않으며, 야훼를 증인으로 모시는 엄숙한 맹세로 이해하는 것이 자연스럽습니다.
    reason: textual_variant
  - marker: c
    text: 시간 표현은 압축되어 있어 “이때쯤 내일, 혹은 셋째 날에”로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: As Yahweh, the God of Israel, lives
  chosen_korean: 이스라엘의 하나님 야훼께서 살아 계심과 같이
  alternatives_korean:
  - 야훼, 이스라엘의 하나님께서 살아 계심과 같이
  - 이스라엘의 하나님 여호와께서 살아 계심과 같이
  lexicon: HALOT
  rationale: 언약적 맹세 공식으로 읽히므로, ‘살아 계심과 같이’로 서두의 oath-like 의미를 살리고, YHWH는 본문 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֶחְקֹר
  english_pob_choice: I sound out
  chosen_korean: 살펴보고
  alternatives_korean:
  - 탐지하고
  - 조사하고
  - 떠보아 보고
  lexicon: HALOT
  rationale: 사울의 반응을 관계적으로 시험해 보는 뜻이므로, 형식적 ‘조사’보다 맥락에 맞는 ‘살펴보고’가 자연스럽습니다.
- source_word: כָּעֵת מָחָר הַשְּׁלִשִׁית
  english_pob_choice: about this time tomorrow, or the third day
  chosen_korean: 이때쯤, 곧 내일이나 셋째 날에
  alternatives_korean:
  - 이때쯤, 곧 내일 또는 셋째 날에
  - 내일 이맘때쯤, 혹은 셋째 날에
  lexicon: HALOT
  rationale: 압축된 시간 표현의 의미를 풀어 주되 과도하게 해석하지 않도록 ‘이때쯤, 곧 …이나 …에’로 처리했습니다.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  english_pob_choice: and uncover your ear
  chosen_korean: 당신의 귀를 열지 않겠습니까
  alternatives_korean:
  - 당신의 귀를 드러내지 않겠습니까
  - 당신에게 알리지 않겠습니까
  - 당신의 귀를 열어 주지 않겠습니까
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 본문 투명성을 살리면서도, 한국어에서는 ‘귀를 열다’가 곧 ‘알려 주다’라는 뜻으로 이해되도록 유지했습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 신명사문자 YHWH는 고유명으로 보존했습니다. 본문의 맹세도 그 이름의 실재성과 인격성을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 히브리어 생략과 서술 흐름
  chosen_reading: 내일이나 셋째 날에 살펴보고, 보십시오, 다윗에게 좋다면
  alternative_readings:
  - 내일이나 셋째 날에 살펴보면, 다윗에게 좋다면
  - 내일이나 셋째 날에 살펴보고, 보십시오, 다윗에게 좋다면
  rationale: 원문의 압축된 조건문과 맹세적 흐름을 살리기 위해, 한국어에서도 문장 연결을 약간 보강하되 의미 범위를 넘지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; original-language primacy'
