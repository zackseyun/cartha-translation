    rationale: 제시된 히브리어에는 ‘살다’에 해당하는 어휘가 없습니다. 이 구절은 맹세 또는 증인 호출로 이해되는 난해한 생략구이므로, ‘야훼께 맹세합니다’와 각주로 처리하여 그 해석적 성격을 밝혀야 합니다.
  - severity: high
    issue: ‘당신의 귀를 열다’는 한국어 관용과 충돌합니다.
    rationale: 한국어 ‘귀를 열다’는 보통 듣고 받아들일 태도를 갖추다는 의미여서, 히브리어 관용구의 ‘알려 주다/밝히다’를 오해하게 합니다. 본문은 의미 번역으로 고치고 직역은 각주에 남겨야 합니다.
