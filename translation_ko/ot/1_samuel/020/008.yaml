language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ חֶ֨סֶד֙ עַל עַבְדֶּ֔/ךָ כִּ֚י בִּ/בְרִ֣ית יְהוָ֔ה הֵבֵ֥אתָ אֶֽת עַבְדְּ/ךָ֖ עִמָּ֑/ךְ וְ/אִם יֶשׁ בִּ֤/י עָוֺן֙ הֲמִיתֵ֣/נִי אַ֔תָּה וְ/עַד אָבִ֖י/ךָ לָ/מָּה זֶּ֥ה תְבִיאֵֽ/נִי־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/008.yaml
  text: So show kindness to your servant[a], for you have brought your servant into the covenant of Yahweh with yourself. But if there is guilt in me, put me to death yourself[b]; why should you bring me to your father?
  footnotes:
  - marker: a
    text: Or 'show covenant loyalty to your servant.' The Hebrew חֶסֶד can carry the sense of loyal, covenantal kindness.
    reason: lexical_alternative
  - marker: b
    text: Or 'you have brought your servant with you into the covenant of the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러니 당신의 종에게 친절을 베풀어 주십시오[a]. 당신이 당신의 종을 당신과 함께 야훼의 언약 안으로 데려오셨기 때문입니다[b]. 그러나 내게 죄가 있다면, 당신이 직접 나를 죽이십시오. 어찌하여 나를 당신의 아버지에게 데려가시겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 종에게 언약적 신의를 보여 주십시오.’ 히브리어 חֶסֶד는 충성스럽고 언약적인 친절의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신이 당신의 종을 야훼의 언약 안으로 당신과 함께 데려오셨기 때문입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָשִׂיתָ חֶסֶד
  english_pob_choice: show kindness
  chosen_korean: 은혜를 베푸십시오
  alternatives_korean:
  - 친절을 베푸십시오
  - 선의를 보이십시오
  - 언약적 신의를 보여 주십시오
  lexicon: HALOT
  rationale: חֶסֶד는 단순한 호의보다 관계적·언약적 선의를 포함할 수 있으나, 여기서는 청원형으로 자연스러운 현대 한국어인 ‘은혜를 베푸십시오’가 직접적이며 위계적 호소의 뉘앙스를 살립니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 종자
  - 당신의 노예
  lexicon: HALOT
  rationale: 이 문맥의 עבד은 궁정적 자기 낮춤 표현이므로 ‘종’이 가장 자연스럽고, ‘노예’는 이 대화의 사회적·화용적 뉘앙스를 지나치게 강하게 만듭니다.
- source_word: בִּבְרִית יְהוָה
  english_pob_choice: into the covenant of Yahweh
  chosen_korean: 여호와의 언약 안으로
  alternatives_korean:
  - 야훼의 언약 안으로
  - 여호와와 맺은 언약 안으로
  - 여호와의 언약으로
  lexicon: HALOT
  rationale: 히브리어 בְּבְרִית는 ‘언약 안에/가운데’의 관계적 진입을 나타내므로 한국어도 ‘안으로’로 살렸고, 본문의 전통적 표기와 대조되는 고유명사는 한국어 독자 친화적으로 ‘여호와’로 옮겼습니다.
- source_word: הֵבֵאתָ אֶת עַבְדְּךָ עִמָּךְ
  english_pob_choice: you have brought your servant into the covenant of Yahweh with yourself
  chosen_korean: 당신이 당신의 종을 여호와의 언약 안으로 당신과 함께 데려오셨기 때문입니다
  alternatives_korean:
  - 당신이 당신의 종을 당신과 함께 여호와의 언약 안으로 데려오셨기 때문입니다
  - 당신이 당신의 종을 여호와의 언약 가운데 당신과 함께 데려오셨기 때문입니다
  lexicon: HALOT
  rationale: ‘데려오셨기 때문입니다’는 히필형 ‘bring’의 직접성을 살리며, ‘with yourself’는 관계적 동반성을 분명히 하기 위해 반복된 ‘당신과 함께’로 옮겼습니다.
- source_word: וְאִם יֶשׁ בִּי עָוֺן
  english_pob_choice: But if there is guilt in me
  chosen_korean: 그러나 내게 죄가 있다면
  alternatives_korean:
  - 그러나 내 안에 죄책이 있다면
  - 그러나 내게 불의가 있다면
  - 그러나 내게 허물이 있다면
  lexicon: HALOT
  rationale: עָוֹן은 죄, 죄책, 불의를 아울러 가리킬 수 있지만, 여기서는 실제 책임 유무를 따지는 조건절이므로 ‘죄가 있다면’이 가장 간결하고 자연스럽습니다.
- source_word: הֲמִיתֵנִי אַתָּה
  english_pob_choice: put me to death yourself
  chosen_korean: 당신이 직접 나를 죽이십시오
  alternatives_korean:
  - 당신이 스스로 나를 죽이십시오
  - 당신이 친히 나를 죽이십시오
  lexicon: HALOT
  rationale: 직접 목적어와 강조된 2인칭을 살려 ‘직접’으로 옮겼고, 죽음의 판결을 남에게 넘기지 말라는 절박한 어조를 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 절은 히브리어 고유명사 יהוה를 포함하지만, 현재 한국어 POB 초안의 공용 표기와 가독성을 고려해 ‘여호와’를 사용했습니다. 본문 의미는 언약의 하나님을 가리키는 고유명으로 유지됩니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
