  naturalness: 합쇼체의 호소문으로 자연스럽습니다. ‘친절을 베풀어 주십시오’는 현대 표준어에서 자연스럽고, ‘당신과 함께 … 데려오셨기’는 원문의 동반 관계를 유지합니다.
  terminology: ‘종’은 궁정적 자기 낮춤에 적절합니다. ‘야훼’는 영어 POB 감사 기록 및 명시된 신명 표기 방침과 일치합니다. ‘친절’에는 각주로 언약적 충성의 가능성을 보완합니다.
  issues:
