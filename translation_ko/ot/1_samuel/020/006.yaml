base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/006.yaml
  text: If your father surely notices me[a], then say, ‘David earnestly asked leave of me to run to Bethlehem, his city[d][c][b], because the yearly sacrifice is there for the whole family.’
  footnotes:
  - marker: a
    text: Or 'If your father surely misses me.' The Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'David urgently asked permission from me.' The Hebrew likewise uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
  - marker: c
    text: Literally 'to run to Bethlehem'; the sense is to go there quickly.
    reason: lexical_alternative
  - marker: d
    text: Or 'the annual sacrifice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 네 아버지께서 제가 없다는 것을 반드시 알아차리시면[a], 이렇게 말씀하십시오. ‘다윗이 저에게 베들레헴, 그의 성읍으로 달려가도록[c] 허락을 간절히 구했습니다[b]. 거기에는 온 가족을 위한 해마다의 제사가[d] 있기 때문입니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 강조를 위해 부정사 절대형과 유한동사형을 함께 사용합니다. 문맥상 사울이 다윗의 결석을 반드시 알아차리거나 찾게 되는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘요청하다’라는 동사에 부정사 절대형과 유한동사형을 함께 사용하여 강조합니다. ‘간절히 허락을 구했습니다’ 또는 ‘급히 허락을 청했습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘달리다/달려가다’입니다. 여기서는 급히 그곳으로 가는 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘연례 제사’로 옮길 수 있습니다.
    reason: lexical_alternative
