    issue: ‘저를 알아차리시면’은 결석을 알아차리는 장면에서 한국어 의미가 부정확하고 어색합니다.
    rationale: 히브리어의 ‘나를 살피다/찾다’는 이 문맥에서 다윗의 부재를 알아차리는 뜻입니다. ‘제가 없다는 것을 알아차리시면’은 문맥적 함의를 명료하게 하되 의미를 확대하지 않습니다.
  - severity: medium
    issue: 질문/허락 요청의 강조(נִשְׁאֹל נִשְׁאַל)에 해당하는 각주가 없고, 기존 c 각주는 ‘그의 성읍’에 붙어 영어 POB 감사 기록의 각주 범위와 맞지 않습니다.
    rationale: 원문과 영어 감사 기록은 요청 동사의 부정사 절대형+유한동사 구조를 별도 어휘 각주로 처리합니다. ‘성읍’은 동격 표현일 뿐 이 단락에서 별도 각주가 요구되는 쟁점이 아닙니다.
  - severity: low
    issue: ‘당신의 아버지’와 ‘달려가게 해 달라고’는 현대 한국어의 대화 문맥에서 다소 경직됩니다.
