source:
  edition: WLC
  text: אִם פָּקֹ֥ד יִפְקְדֵ֖/נִי אָבִ֑י/ךָ וְ/אָמַרְתָּ֗ נִשְׁאֹל֩ נִשְׁאַ֨ל מִמֶּ֤/נִּי דָוִד֙ לָ/רוּץ֙ בֵּֽית לֶ֣חֶם עִיר֔/וֹ כִּ֣י זֶ֧בַח הַ/יָּמִ֛ים שָׁ֖ם לְ/כָל הַ/מִּשְׁפָּחָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/006.yaml
  text: If your father surely notices me[a], then say, ‘David earnestly asked leave of me to run to Bethlehem, his city[d][c][b], because the yearly sacrifice is there for the whole family.’
  footnotes:
  - marker: a
    text: Or 'If your father surely misses me.' The Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'David urgently asked permission from me.' The Hebrew likewise uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
  - marker: c
    text: Literally 'to run to Bethlehem'; the sense is to go there quickly.
    reason: lexical_alternative
  - marker: d
    text: Or 'the annual sacrifice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 당신의 아버지가 반드시 저를 알아차리시면, 당신은 이렇게 말하십시오. ‘다윗이 저에게 베들레헴, 그의 성읍으로 달려가게 해 달라고 간절히 부탁했습니다. 거기에는 온 가족을 위한 해마다의 제사가 있기 때문입니다.’[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 강조를 위해 부정사 절대형과 동사형을 함께 사용합니다. 따라서 ‘기억하다’보다 ‘반드시 알아차리다’의 뉘앙스가 더 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘달리다/달려가다’입니다. 여기서는 급히 그곳으로 가는 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘베들레헴, 그의 성읍’입니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘해마다의 제사’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקֹד יִפְקְדֵנִי
  english_pob_choice: surely notices me
  chosen_korean: 반드시 저를 알아차리시면
  alternatives_korean:
  - 반드시 저를 기억하시면
  - 반드시 저를 찾으시면
  - 반드시 저를 생각나시면
  lexicon: HALOT
  rationale: 인과 동사 פקד의 강조용 절대부정사+미완료형을 살려 ‘반드시’로 강조를 드러내고, 상황상 사울이 식사 자리에서 다윗의 부재를 알아채는 뜻을 ‘알아차리다’로 자연스럽게 옮겼습니다.
- source_word: נִשְׁאֹל נִשְׁאַל מִמֶּנִּי
  english_pob_choice: earnestly asked leave of me
  chosen_korean: 저에게 ... 해 달라고 간절히 부탁했습니다
  alternatives_korean:
  - 저에게 허락을 간절히 구했습니다
  - 저에게 떠나게 해 달라고 간절히 요청했습니다
  - 저에게 허가를 간절히 청했습니다
  lexicon: HALOT
  rationale: 절대부정사+동사로 이루어진 강조를 ‘간절히’로 살리고, 떠나기 위한 요청이라는 점을 ‘~해 달라고 부탁했습니다’로 한국어답게 표현했습니다.
- source_word: לָרוּץ
  english_pob_choice: to run
  chosen_korean: 달려가게
  alternatives_korean:
  - 빨리 가게
  - 서둘러 가게
  - 달려가도록
  lexicon: HALOT
  rationale: 직역 성격을 유지해 ‘달려가다’의 구체적 이미지를 보존하되, 한국어 문맥상 목적형으로 자연스럽게 연결했습니다.
- source_word: בֵּית לֶחֶם עִירוֹ
  english_pob_choice: Bethlehem, his city
  chosen_korean: 베들레헴, 그의 성읍
  alternatives_korean:
  - 베들레헴, 그의 도시
  - 베들레헴, 그의 고향
  - 베들레헴, 그가 사는 성읍
  lexicon: HALOT
  rationale: 지명과 동격 표현을 그대로 살려 ‘그의 성읍’으로 옮겼고, 본문이 지시하는 소유 관계를 유지했습니다.
- source_word: זֶבַח הַיָּמִים
  english_pob_choice: the yearly sacrifice
  chosen_korean: 해마다의 제사
  alternatives_korean:
  - 연례 제사
  - 매년의 제사
  - 한 해의 제사
  lexicon: HALOT
  rationale: 직역인 ‘연례/해마다’ 가능성을 고려하되, 문맥상 반복되는 절기 제사를 자연스럽게 드러내는 ‘해마다의 제사’를 채택했습니다.
- source_word: לְכָל הַמִּשְׁפָּחָה
  english_pob_choice: for the whole family
  chosen_korean: 온 가족을 위한
  alternatives_korean:
  - 온 집안을 위한
  - 온 일가를 위한
  - 온 가족에게
  lexicon: HALOT
  rationale: מִשְׁפָּחָה를 이 문맥에서는 혈연 공동체로 읽어 ‘온 가족’으로 옮겼고, לְ를 목적/수혜의 방향으로 받아 자연스럽게 처리했습니다.
theological_decisions:
- issue: 사울의 인지 동사를 어떻게 옮길지
  chosen_reading: ‘반드시 저를 알아차리시면’로 옮겨, 강조와 상황적 인지를 함께 드러냈습니다.
  alternative_readings:
  - ‘반드시 저를 기억하시면’
  - ‘반드시 저를 찾으시면’
  - ‘반드시 저를 눈여겨보시면’
  rationale: פקיד의 강조 구조는 단순한 ‘기억하다’보다, 잔칫상에서 다윗의 결석을 사울이 눈치채는 맥락을 포함합니다. 따라서 의미를 약화하지 않으면서도 장면에 맞는 인지 표현을 택했습니다.
  doctrine_reference: 본문 해석/어휘 선택
- issue: 문장 내 직접화법의 호칭과 문체
  chosen_reading: 간접 인용과 직접 인용을 구분해, 서술은 합쇼체로 유지하고 인용문 안에서도 원문의 명령형 흐름을 자연스럽게 재현했습니다.
  alternative_readings:
  - 전체를 평서체로 평준화
  - 인용문까지 전면적 존대화
  rationale: 히브리어 원문의 대화 구조를 보존하려면 인용문 내부의 요청 형식을 살리는 것이 중요합니다. 한국어 독자에게는 높임과 명령이 혼재한 대화체가 가장 오해가 적습니다.
  doctrine_reference: 서사 문체/화용
