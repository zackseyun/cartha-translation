  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 פקד의 문맥적 목적어는 다윗 자신이라기보다 그의 결석이므로, ‘저를 알아차리시면’은 한국어에서 다윗이 현장에 있는 듯하게 들려 어색합니다. ‘제가 없다는 것을 알아차리시면’이 식탁에서의 부재를 알아차리는 문맥과 원문의 의미를 더 정확히 전달합니다. נִשְׁאֹל נִשְׁאַל의 강조는 본문에는 반영되어 있으나, 이에 해당하는 각주가 누락되어 있었습니다.
  naturalness: ‘당신의 아버지’는 친밀한 두 인물 사이의 직접 발화에서 다소 부자연스럽고, ‘베들레헴, 그의 성읍으로 달려가게 해 달라고’도 수식 관계가 무겁습니다. ‘네 아버지께서’, ‘베들레헴, 그의 성읍으로 달려가도록 허락을 간절히 구했습니다’로 다듬으면 현대 한국어의 격식 있는 성경 문체로 자연스럽습니다. 직접화법에서 아버지에 대한 존대는 ‘께서’와 ‘말씀하십시오’로 유지했습니다.
  terminology: ‘베들레헴’, ‘성읍’, ‘제사’, ‘온 가족’은 적절합니다. זֶבַח הַיָּמִים는 ‘해마다의 제사’로 유지할 수 있으며, ‘연례 제사’도 가능한 대안입니다. 각주는 영어 POB 감사 기록에 맞게 פקד, שאל의 강조, רוץ, 연례 제사에 각각 연결해야 합니다.
  issues:
