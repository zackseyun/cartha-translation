theological_decisions:
- issue: 사울의 인지 동사를 어떻게 옮길지
  chosen_reading: ‘반드시 저를 알아차리시면’로 옮겨, 강조와 상황적 인지를 함께 드러냈습니다.
  alternative_readings:
  - ‘반드시 저를 기억하시면’
  - ‘반드시 저를 찾으시면’
  - ‘반드시 저를 눈여겨보시면’
  rationale: פקיד의 강조 구조는 단순한 ‘기억하다’보다, 잔칫상에서 다윗의 결석을 사울이 눈치채는 맥락을 포함합니다. 따라서 의미를 약화하지 않으면서도 장면에 맞는 인지 표현을 택했습니다.
  doctrine_reference: 본문 해석/어휘 선택
- issue: 문장 내 직접화법의 호칭과 문체
  chosen_reading: 간접 인용과 직접 인용을 구분해, 서술은 합쇼체로 유지하고 인용문 안에서도 원문의 명령형 흐름을 자연스럽게 재현했습니다.
  alternative_readings:
  - 전체를 평서체로 평준화
  - 인용문까지 전면적 존대화
  rationale: 히브리어 원문의 대화 구조를 보존하려면 인용문 내부의 요청 형식을 살리는 것이 중요합니다. 한국어 독자에게는 높임과 명령이 혼재한 대화체가 가장 오해가 적습니다.
  doctrine_reference: 서사 문체/화용
