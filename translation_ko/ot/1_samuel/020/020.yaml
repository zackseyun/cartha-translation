  text: And I will shoot the three arrows to the side of it[c][b][a], as though I were shooting for myself at a target.
  footnotes:
  - marker: a
    text: Hebrew 'to the side of it'; the suffix likely refers to the stone or marker mentioned in the surrounding context.
