  - 그리고 내가
  lexicon: HALOT
  rationale: 독립 대명사로 화자의 다음 행동을 대비시키는 전환이므로, 한국어에서는 자연스러운 담화 연결어 ‘그리고 나는’으로 옮겼습니다.
- source_word: שְׁלֹשֶׁת הַחִצִּים
  english_pob_choice: the three arrows
  chosen_korean: 화살 셋
