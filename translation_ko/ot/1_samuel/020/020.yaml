  naturalness: ‘화살 셋’보다는 화살의 단위까지 갖춘 ‘화살 세 발’이 자연스럽습니다. ‘마치 … 내쏘는 것처럼’은 어색하므로, 문맥상 가장하는 표적 사격을 자연스럽게 나타내는 표현으로 고치는 것이 좋습니다.
