translation:
  language: ko
  text: 그리고 나는 화살 세 발을 그 곁으로 쏘겠습니다. 마치 과녁을 향해 활쏘기 연습을 하는 것처럼 말입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 곁으로’는 히브리어의 3인칭 여성 단수 접미사를 반영합니다. 이 접미사는 앞 문맥에 언급된 돌 또는 표지물을 가리키는 것으로 보입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘그 옆으로’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘나 자신을 위하여 과녁에 보내다/쏘다’에 가까운 관용적 표현입니다. 여기서는 과녁을 향해 활쏘기 연습을 하는 것처럼 보이게 하는 행동을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: And I
  chosen_korean: 그리고 나는
  alternatives_korean:
