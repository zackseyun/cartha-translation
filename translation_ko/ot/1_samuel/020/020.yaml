base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/020.yaml
  text: And I will shoot the three arrows to the side of it[c][b][a], as though I were shooting for myself at a target.
  footnotes:
  - marker: a
    text: Hebrew 'to the side of it'; the suffix likely refers to the stone or marker mentioned in the surrounding context.
    reason: cross_reference
  - marker: b
    text: Or 'beside it.'
    reason: lexical_alternative
  - marker: c
    text: 'The Hebrew expression is idiomatic: literally, ''to send for myself at a target,'' that is, to act as though practicing archery.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 화살 셋을 그 곁으로 쏘겠습니다 — 마치 내가 과녁을 향해 내쏘는 것처럼 말입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 곁으로’는 앞 문맥의 돌이나 표지물을 가리키는 것으로 보이는 히브리어 3인칭 여성 단수 접미사를 반영합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘그 옆으로’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘나를 위하여 과녁에 보내다/쏘다’에 가까운 관용 표현으로, 활쏘기 연습처럼 가장하는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: And I
  chosen_korean: 그리고 나는
  alternatives_korean:
  - 나는
  - 그리고 내가
  lexicon: HALOT
  rationale: 독립 대명사로 화자의 다음 행동을 대비시키는 전환이므로, 한국어에서는 자연스러운 담화 연결어 ‘그리고 나는’으로 옮겼습니다.
- source_word: שְׁלֹשֶׁת הַחִצִּים
  english_pob_choice: the three arrows
  chosen_korean: 화살 셋
  alternatives_korean:
  - 세 화살
  - 그 화살 셋
  lexicon: HALOT
  rationale: 정관사의 특정 신호용 화살이라는 점은 문맥이 드러내므로, 한국어에서는 수량과 명사를 간결하게 살려 ‘화살 셋’으로 옮겼습니다.
- source_word: צִדָּה
  english_pob_choice: to the side of it
  chosen_korean: 그 곁으로
  alternatives_korean:
  - 그 옆으로
  - 그쪽으로
  lexicon: HALOT
  rationale: 3인칭 여성 단수 접미사는 앞 문맥의 표지물/돌을 가리키는 것으로 보이므로, 본문에서는 지시 대상을 과도하게 특정하지 않으면서 방향성을 살려 ‘그 곁으로’로 옮겼습니다.
- source_word: לְשַׁלַּח לִי לְמַטָּרָה
  english_pob_choice: as though I were shooting for myself at a target
  chosen_korean: 마치 내가 과녁을 향해 내쏘는 것처럼
  alternatives_korean:
  - 마치 내가 과녁을 향해 쏘는 것처럼
  - 내가 과녁을 겨누어 쏘는 것처럼
  lexicon: HALOT
  rationale: שלח와 מטרה의 결합은 활쏘기 연습을 가장한 행동을 뜻하므로, 한국어에서는 ‘과녁을 향해 내쏘다’로 자연스럽게 풀어 의미를 드러냈습니다.
theological_decisions:
- issue: 신호용 활쏘기 표현의 간접화
  chosen_reading: 직접적인 전투 행위가 아니라, 의도적으로 평범한 활쏘기처럼 보이게 하는 신호 행동으로 옮겼습니다.
  alternative_readings:
  - 단순히 과녁을 쏘는 동작
  - 사냥하듯 화살을 쏘는 동작
  rationale: 히브리어는 ‘나를 위하여 과녁에 보내다/쏘다’라는 관용적 표현으로, 문맥상 다윗에게 신호를 보내기 위한 가장 일반적인 활쏘기처럼 보이게 하려는 의도를 드러냅니다.
  doctrine_reference: 본문 해석상의 담화·서사 맥락
