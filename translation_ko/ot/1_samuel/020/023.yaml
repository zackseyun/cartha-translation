  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ֨/דָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְנוּ אֲנִ֣י וָ/אָ֑תָּה הִנֵּ֧ה יְהוָ֛ה בֵּינִ֥/י וּ/בֵינְ/ךָ֖ עַד עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/023.yaml
  text: And as for the matter that you and I have spoken of[a], behold, Yahweh is between me and you forever.
  footnotes:
  - marker: a
    text: Or 'the word that you and I have spoken.' Hebrew דָּבָר can mean 'word,' 'matter,' or 'thing'; here it refers to the agreement just discussed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리가 말한 그 일에 관해서는, 보십시오, 야훼께서 나와 당신 사이에 영원히 계십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리가 말한 그 말’이라는 뜻일 수 있습니다. 히브리어 דָּבָר는 ‘말’, ‘일’, ‘사건’을 뜻할 수 있으며, 여기서는 방금 논의한 합의를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַדָּבָר
  english_pob_choice: And as for the matter
  chosen_korean: 그리고 우리가 말한 그 일에 관해서는
  alternatives_korean:
  - 그리고 그 일은
  - 그리고 그 말은
  - 그리고 그 문제는
  lexicon: HALOT
  rationale: דָּבָר는 여기서 단순한 ‘말’보다 앞서 합의한 내용 전체를 가리키므로, 한국어에서는 ‘그 일’과 ‘관해서는’으로 그 화제 전환과 합의의 대상을 자연스럽게 살렸습니다.
- source_word: הִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게
  - 참으로
  lexicon: HALOT
  rationale: 히브리어 הִנֵּה의 담화 표지를 살리되, 현대 한국어 합쇼체에서는 청자를 직접 환기하는 ‘보십시오’가 문맥의 엄숙함과 자연스러움을 함께 지닙니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명은 관례적 대체어가 아니라 고유명사로 처리해야 하므로, POB 기준에 따라 ‘야훼’를 사용했습니다.
- source_word: בֵּינִי וּבֵינְךָ
  english_pob_choice: between me and you
  chosen_korean: 나와 당신 사이에
  alternatives_korean:
  - 나와 너 사이에
  - 우리 사이에
  - 내가 당신과 사이에
  lexicon: HALOT
  rationale: 히브리어의 ‘사이에’라는 관계 표지를 그대로 살리면서, 한국어에서는 자연스러운 대구를 위해 ‘나와 당신 사이에’로 옮겼습니다.
- source_word: עַד עוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원까지
  - 끝없이
  - 영구히
  lexicon: HALOT
  rationale: ‘עַד עוֹלָם’의 지속성을 간결하고 분명하게 드러내는 현대적 표현으로 ‘영원히’를 택했습니다.
theological_decisions:
- issue: 야훼께서 ‘사이’에 계신다는 표현의 의미
  chosen_reading: 두 사람 사이의 증인·보증자라는 언약적 함의를 살리되, 본문이 말하는 ‘사이’의 표현 자체는 유지했습니다.
  alternative_readings:
  - 단순한 공간적 위치 진술
  - 하나님의 전적인 감찰을 풀어쓴 설명
  rationale: 이 절은 요나단과 다윗의 약속을 다시 확인하는 언약적 맥락이므로, 해석을 과도하게 풀지 않고 본문의 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
