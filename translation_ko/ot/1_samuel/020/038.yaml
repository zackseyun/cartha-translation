base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/038.yaml
  text: And Jonathan called after the boy[b][a], “Hurry! Be quick! Do not stop!” So Jonathan’s boy gathered up the arrows and came to his master.
  footnotes:
  - marker: a
    text: Hebrew literally, “Do not stand.” The sense in context is “Do not stop.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew form for “arrows” is written in a way that can appear singular, but the context clearly refers to the arrows Jonathan had shot.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 요나단이 소년에게 외쳤습니다. “서둘러! 빨리! 멈추지 마라!” 그러자 요나단의 소년이 화살들을 주워서 자기 주인에게 왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 문자적으로는 “서 있지 마라”로 옮길 수 있지만, 문맥상 뜻은 “멈추지 마라”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘화살’ 표기는 단수처럼 보일 수 있으나, 문맥상 요나단이 쏜 여러 화살을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/יִּקְרָ֤א ... אַחֲרֵי הַ/נַּעַר
  english_pob_choice: called after the boy
  chosen_korean: 소년에게 외쳤습니다
