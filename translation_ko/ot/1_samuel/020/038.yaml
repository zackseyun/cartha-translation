  text: וַ/יִּקְרָ֤א יְהֽוֹנָתָן֙ אַחֲרֵ֣י הַ/נַּ֔עַר מְהֵרָ֥ה ח֖וּשָׁ/ה אַֽל תַּעֲמֹ֑ד וַ/יְלַקֵּ֞ט נַ֤עַר יְהֽוֹנָתָן֙ אֶת ה/חצי וַ/יָּבֹ֖א אֶל אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/038.yaml
  text: And Jonathan called after the boy[b][a], “Hurry! Be quick! Do not stop!” So Jonathan’s boy gathered up the arrows and came to his master.
  footnotes:
  - marker: a
    text: Hebrew literally, “Do not stand.” The sense in context is “Do not stop.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew form for “arrows” is written in a way that can appear singular, but the context clearly refers to the arrows Jonathan had shot.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 요나단이 소년에게 외쳤습니다. “서둘러! 빨리! 멈추지 마라!” 그러자 요나단의 소년이 화살들을 주워서 자기 주인에게 왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 문자적으로는 “서 있지 마라”로 옮길 수 있지만, 문맥상 뜻은 “멈추지 마라”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘화살’ 표기는 단수처럼 보일 수 있으나, 문맥상 요나단이 쏜 여러 화살을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/יִּקְרָ֤א ... אַחֲרֵי הַ/נַּעַר
  english_pob_choice: called after the boy
  chosen_korean: 소년에게 외쳤습니다
  alternatives_korean:
  - 소년을 불렀습니다
  - 소년 뒤로 외쳤습니다
  lexicon: HALOT
  rationale: קרא + אחרי의 결합은 누군가를 뒤따라 크게 부르는 장면이므로, 한국어에서는 자연스럽게 ‘소년에게 외쳤습니다’로 옮겨 동작의 긴박함을 살렸습니다.
- source_word: מְהֵרָה חוּשָׁה
  english_pob_choice: Hurry! Be quick!
  chosen_korean: 서둘러! 빨리!
  alternatives_korean:
  - 어서! 빨리!
  - 급히! 속히!
  lexicon: HALOT
  rationale: 두 감탄형 명령이 겹친 강한 촉구이므로, 한국어에서도 짧은 명령 두 개로 중복된 긴박감을 드러냈습니다.
- source_word: אַל תַּעֲמֹד
  english_pob_choice: Do not stop!
  chosen_korean: 멈추지 마라
  alternatives_korean:
  - 서 있지 마라
  - 거기서 멈추지 마라
  lexicon: HALOT
  rationale: 직역하면 ‘서 있지 마라’이지만 문맥상 이동을 계속하라는 뜻이므로, 의미를 살려 ‘멈추지 마라’로 옮겼습니다.
- source_word: נַעַר יְהוֹנָתָן
  english_pob_choice: Jonathan’s boy
  chosen_korean: 요나단의 소년
  alternatives_korean:
  - 요나단의 종
  - 요나단의 하인
  lexicon: HALOT
  rationale: נַעַר는 단순한 나이 표현이 아니라 종/시종의 역할을 가리키므로, 본문의 반복 어감을 살리면서도 관계를 드러내는 ‘소년’과 소유격을 택했습니다.
- source_word: אֶת ה/חצי
  english_pob_choice: the arrows
  chosen_korean: 화살들을
  alternatives_korean:
  - 화살을
  - 화살대들을
  lexicon: HALOT
  rationale: 히브리어 표기는 단수처럼 보일 수 있지만, 문맥상 요나단이 쏜 여러 화살을 가리키므로 한국어에서는 복수 ‘화살들을’로 옮겼습니다.
- source_word: אֶל אֲדֹנָיו
  english_pob_choice: to his master
  chosen_korean: 자기 주인에게
  alternatives_korean:
  - 자기 상전에게
  - 자기 주에게
  lexicon: HALOT
  rationale: אָדוֹן의 관계적 의미를 살려 종속적 인간 상급자를 가리키는 자연스러운 표현인 ‘주인’을 사용했습니다.
theological_decisions:
- issue: 직접화법의 긴박한 명령 어조
  chosen_reading: ‘서둘러! 빨리! 멈추지 마라!’로 한국어에서도 짧고 단호한 명령형을 유지했습니다.
  alternative_readings:
  - ‘급히! 속히! 서 있지 마라!’
  - ‘빨리 가! 멈추지 마!’
  rationale: 이 절은 감정적 설명보다 행동 지시의 긴박성이 핵심이므로, 명령의 반복 효과를 보존하는 쪽이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 서사 본문 해석 원리
