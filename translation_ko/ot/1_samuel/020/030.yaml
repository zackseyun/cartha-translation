  text: וַ/יִּֽחַר אַ֤ף שָׁאוּל֙ בִּ/יה֣וֹנָתָ֔ן וַ/יֹּ֣אמֶר ל֔/וֹ בֶּֽן נַעֲוַ֖ת הַ/מַּרְדּ֑וּת הֲ/ל֣וֹא יָדַ֗עְתִּי כִּֽי בֹחֵ֤ר אַתָּה֙ לְ/בֶן יִשַׁ֔י לְ/בָ֨שְׁתְּ/ךָ֔ וּ/לְ/בֹ֖שֶׁת עֶרְוַ֥ת אִמֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/030.yaml
  text: Then Saul’s anger burned against Jonathan[a], and he said to him, “You son of a perverse, rebellious woman! Do I not know that you have chosen the son of Jesse[c][b], to your own shame and to the shame of your mother’s nakedness?”
  footnotes:
  - marker: a
    text: Or, “You son of perversity and rebellion!” The Hebrew insult is difficult and highly idiomatic.
    reason: lexical_alternative
  - marker: b
    text: Or, “you are siding with the son of Jesse.”
    reason: lexical_alternative
  - marker: c
    text: The phrase “the shame of your mother’s nakedness” is a severe Hebrew expression of familial disgrace.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 사울의 분노가 요나단에게 타올랐습니다. 그가 그에게 말했습니다. 「이 패역하고 반역하는 여자의 아들아! 내가 어찌 네가 이새의 아들을 택하여 네 수치를 자초하고, 네 어머니의 벌거벗음에 대한 수치를 자초하는 것을 알지 못하겠느냐?」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 관용적인 모욕 표현이라, 문자적으로 옮기면 ‘패역과 반역의 아들’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “네가 이새의 편에 서 있는 것을 내가 알지 못하겠느냐?”
    reason: alternative_reading
  - marker: c
    text: “네 어머니의 벌거벗음의 수치”는 가족 전체의 수치를 뜻하는 강한 히브리어 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף
  english_pob_choice: Saul’s anger burned
  chosen_korean: 사울의 분노가 타올랐습니다
  alternatives_korean:
  - 사울이 화를 냈습니다
  - 사울의 노가 불탔습니다
  lexicon: HALOT
  rationale: אַף의 관용적 의미를 살려 감정의 격렬함을 드러내되, 한국어로는 자연스럽게 ‘분노가 타오르다’로 옮겨 문학적 힘을 유지했습니다.
- source_word: בִּיהוֹנָתָן
  english_pob_choice: against Jonathan
  chosen_korean: 요나단에게
  alternatives_korean:
  - 요나단을 향해
  - 요나단에 대하여
  lexicon: HALOT
  rationale: 흐라를 동반한 전치사는 분노의 대상 방향을 가리키므로, 한국어에서는 가장 자연스러운 목적격/부사격인 ‘-에게’로 반영했습니다.
- source_word: בֶּן נַעֲוַת הַמַּרְדּוּת
  english_pob_choice: You son of a perverse, rebellious woman
  chosen_korean: 이 패역하고 반역하는 여자의 아들아
  alternatives_korean:
  - 이 패역과 반역의 아들아
  - 이 비뚤어지고 반역한 여자의 아들아
  lexicon: HALOT
  rationale: 히브리어의 모욕적 관용구를 직접 살리기 위해 ‘여자의 아들’ 구조를 유지했고, נַעֲוַת/הַמַּרְדּוּת를 ‘패역하고 반역하는’으로 옮겨 모욕성과 이중 의미를 보존했습니다.
- source_word: לְבָשְׁתְּךָ וּלְבֹשֶׁת עֶרְוַת אִמֶּךָ
  english_pob_choice: to your own shame and to the shame of your mother’s nakedness
  chosen_korean: 네 수치를 자초하고, 네 어머니의 벌거벗음에 대한 수치를 자초하는
  alternatives_korean:
  - 네 수치가 되며, 네 어머니의 벌거벗음의 수치가 되며
  - 네 수치를 당하고, 네 어머니의 벌거벗음의 수치를 당하고
  lexicon: HALOT
  rationale: לְ 표지를 결과/귀결로 이해해 ‘자초하다’로 옮겼고, עֶרְוָה의 직설성을 살리기 위해 ‘벌거벗음’과 ‘수치’를 함께 유지했습니다.
theological_decisions:
- issue: 사울의 욕설에 대한 직설성 유지
  chosen_reading: 모욕적 히브리어 표현을 완화하지 않고 한국어에서도 강한 직설성으로 재현했습니다.
  alternative_readings:
  - 더 완곡한 가족 비난으로 순화하는 번역
  - 의미만 전달하고 욕설 성격을 약화하는 번역
  rationale: 본문은 단순한 꾸지람이 아니라 공개적 모욕과 수치 부여의 언어이므로, 독자가 원문이 가진 폭력성과 관계 파괴의 강도를 느끼도록 직설적 어휘를 유지하는 것이 필요합니다.
  doctrine_reference: 본문의 서술적·수사적 강도 보존 원칙
- issue: עֶרְוָה의 의미 범위
  chosen_reading: ‘벌거벗음’으로 직역하되 ‘수치’와 결합해 가족적 수치의 함의를 드러냈습니다.
  alternative_readings:
  - ‘노출’로 완화
  - ‘수치스러운 일’로 의역
  rationale: 히브리어에서 עֶרְוָה는 단순 신체 상태를 넘어 성적·가족적 수치의 관용적 뉘앙스를 지니므로, 직설성을 유지하면서도 한국어 독자에게 의미가 전달되도록 구성했습니다.
  doctrine_reference: 히브리어 관용구 및 수치-명예 담론
