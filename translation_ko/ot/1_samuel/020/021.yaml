  edition: WLC
  text: וְ/הִנֵּה֙ אֶשְׁלַ֣ח אֶת הַ/נַּ֔עַר לֵ֖ךְ מְצָ֣א אֶת הַ/חִצִּ֑ים אִם אָמֹר֩ אֹמַ֨ר לַ/נַּ֜עַר הִנֵּ֥ה הַ/חִצִּ֣ים מִמְּ/ךָ֣ וָ/הֵ֗נָּה קָחֶ֧/נּוּ וָ/בֹ֛אָ/ה כִּֽי שָׁל֥וֹם לְ/ךָ֛ וְ/אֵ֥ין דָּבָ֖ר חַי יְהוָֽה־־־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/021.yaml
  text: And look[a], I will send the young man, saying, ‘Go, find the arrows.’ If I plainly say to the young man, ‘Behold, the arrows are on this side of you; take them and come,’ then there is peace for you and no danger[b], as Yahweh lives.
  footnotes:
  - marker: a
    text: Or, ‘the arrows are nearer than you’ or ‘the arrows are on this side of you.’ The Hebrew indicates the arrows have fallen short of the attendant, not beyond him.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ‘as the LORD lives,’ an oath formula affirming the truth of the statement.'
    reason: cultural_note
translation:
  language: ko
  text: 보십시오[a], 내가 그 소년을 보내며, ‘가서 화살들을 찾으라’고 하겠습니다. 내가 그 소년에게 분명히 말하기를, ‘보십시오, 화살들이 당신보다 이쪽에 있습니다. 그것들을 가져오고 오십시오’ 하면, 당신에게는 평강이 있고 아무 일도 없을 것입니다[b]. 야훼께서 살아 계심을 두고 맹세합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘화살들이 당신보다 더 가까이 있습니다’라는 뜻일 수 있습니다. 히브리어는 화살이 수행원보다 멀리 가지 않았음을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어: ‘야훼께서 살아 계십니다.’라는 맹세 공식으로, 말의 진실성을 확증합니다.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And look / And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제 보십시오
  - 보십시오
  lexicon: HALOT
  rationale: 다음 행동을 지시하는 도입어로서 주의를 환기하는 기능을 살리면서, 현대 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: אֶשְׁלַח אֶת הַנַּעַר
  english_pob_choice: I will send the young man
  chosen_korean: 그 소년을 보내며
  alternatives_korean:
  - 그 젊은이를 보내며
  - 그 하인을 보내며
  - 그 소년을 보내며
  lexicon: HALOT
  rationale: נַעַר의 문맥상 지시 대상은 사울 집의 수행원이므로, 나이와 종속성을 함께 떠올리게 하는 ‘소년’이 가장 무난합니다.
- source_word: אִם אָמֹר אֹמַר
  english_pob_choice: If I plainly say
  chosen_korean: 내가 … 분명히 말하기를
  alternatives_korean:
  - 내가 … 분명히 말하면
  - 내가 … 꼭 말하면
  - 내가 … 말한다고 하면
  lexicon: HALOT
  rationale: 동사 절의 강조를 한국어에서 ‘분명히’로 반영해, 단순한 조건이 아니라 확정적인 신호 문구임을 드러냈습니다.
- source_word: הִנֵּה הַחִצִּים מִמְּךָ וָהֵנָּה
  english_pob_choice: Behold, the arrows are on this side of you
  chosen_korean: 보십시오, 화살들이 당신보다 이쪽에 있습니다
  alternatives_korean:
  - 보십시오, 화살들이 당신 가까이에 있습니다
  - 보십시오, 화살들이 당신 앞쪽에 있습니다
  - 보십시오, 화살들이 당신보다 이쪽에 있습니다
  lexicon: HALOT
  rationale: 히브리어는 화살이 화살받이보다 더 멀리 가지 않았다는 방향 신호이므로, POB의 ‘on this side of you’에 맞춰 ‘이쪽에 있습니다’로 옮겼습니다.
- source_word: כִּי שָׁלוֹם לְךָ וְאֵין דָּבָר
  english_pob_choice: then there is peace for you and no danger
  chosen_korean: 당신에게는 평강이 있고 아무 일도 없을 것입니다
  alternatives_korean:
  - 당신은 안전합니다
  - 당신에게는 평강이 있고 위험이 없습니다
  - 당신에게는 평강이 있고 아무 일도 없을 것입니다
  lexicon: HALOT
  rationale: שָׁלוֹם과 דָּבָר의 결합을 단순한 ‘안전’으로 압축하기보다, 신호의 뜻인 ‘평강’과 ‘아무 일도 없음’을 함께 살렸습니다.
- source_word: חַי יְהוָה
  english_pob_choice: as Yahweh lives
  chosen_korean: 야훼께서 살아 계심을 두고 맹세합니다
  alternatives_korean:
  - 야훼께서 살아 계십니다
  - 야훼의 살아 계심을 두고
  - 야훼께서 살아 계심을 두고 맹세합니다
  lexicon: HALOT
  rationale: 히브리어의 표준 맹세 공식이므로, 단순 서술보다 맹세의 기능을 드러내는 한국어로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 본문과 맹세 공식 모두에서 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 프로젝트 기본값에 따라 신명은 전통적 교회어 대신 학술적 음역인 ‘야훼’를 유지해, 원문의 고유한 언약명과 맹세 공식을 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
