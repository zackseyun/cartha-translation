  source_fidelity: 원문의 조건적 신호 구조와 맹세 공식은 대체로 반영되어 있습니다. 다만 ‘보내며 … 하겠습니다’는 히브리어의 미래 동작과 뒤따르는 지시 인용을 한국어에서 부자연스럽게 연결하며, 화살의 위치를 설명하는 각주와 맹세 공식을 설명하는 각주의 표지가 각각 해당하지 않는 본문 요소에 붙어 있습니다.
  naturalness: 현대 한국어 합쇼체 서술로는 ‘보내어 … 하겠습니다’가 자연스럽습니다. 소년에게 실제로 하는 지시는 원문의 단수 명령형을 반영하여 인용문 안에서 ‘-라/-너라’로 처리하고, 다윗에게 말하는 바깥 발화는 합쇼체로 유지하는 것이 자연스럽습니다.
  terminology: נַעַר는 문맥상 수행하는 젊은이를 가리키나 ‘소년’도 가능한 폭을 유지합니다. שָׁלוֹם은 ‘평안’으로, יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 옮겼습니다. ‘아무런 일도 없다’는 וְאֵין דָּבָר의 관용적 의미를 과도하게 특정하지 않습니다.
