revisions:
- from: 보십시오[a], 내가 그 소년을 보내며, ‘가서 화살들을 찾으라’고 하겠습니다. 내가 그 소년에게 분명히 말하기를, ‘보십시오, 화살들이 당신보다 이쪽에 있습니다. 그것들을 가져오고 오십시오’ 하면, 당신에게는 평강이 있고 아무 일도 없을 것입니다[b]. 야훼께서 살아 계심을 두고 맹세합니다.
  to: 보십시오, 내가 그 소년을 보내어 ‘가서 화살들을 찾아라’고 하겠습니다. 내가 그 소년에게 ‘보십시오, 화살들이 네가 있는 곳보다 이쪽에 있다[a]. 그것들을 가져오너라’라고 분명히 말하면, 당신은 평안하고 아무런 일도 없을 것입니다. 야훼께서 살아 계심을 두고 맹세합니다[b].
  rationale: 문법적으로 어색한 동작 연결을 다듬고, 두 각주 표지를 각각 화살의 위치 표현 및 맹세 공식으로 옮겼습니다. 화살이 수행원을 지나 더 멀리 간 것이 아니라 그보다 가까운 쪽에 있다는 방향 신호의 의미를 유지했으며, 원문의 명령형과 맹세의 확증 기능도 보존했습니다.
