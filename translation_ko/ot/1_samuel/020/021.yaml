  lexicon: HALOT
  rationale: 히브리어는 화살이 화살받이보다 더 멀리 가지 않았다는 방향 신호이므로, POB의 ‘on this side of you’에 맞춰 ‘이쪽에 있습니다’로 옮겼습니다.
- source_word: כִּי שָׁלוֹם לְךָ וְאֵין דָּבָר
  english_pob_choice: then there is peace for you and no danger
  chosen_korean: 당신에게는 평강이 있고 아무 일도 없을 것입니다
