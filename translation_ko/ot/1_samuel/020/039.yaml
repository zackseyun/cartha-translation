id: 1SA.20.39
reference: 1 Samuel 20:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/נַּ֖עַר לֹֽא יָדַ֣ע מְא֑וּמָה אַ֤ךְ יְהֽוֹנָתָן֙ וְ/דָוִ֔ד יָדְע֖וּ אֶת הַ/דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/039.yaml
  text: But the boy did not know anything[a]; only Jonathan and David knew the matter.
  footnotes:
  - marker: a
    text: Or 'the thing' or 'the arrangement.' Hebrew דָּבָר is broad and can refer to a matter, affair, or thing under discussion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그 소년은 아무것도 알지 못했습니다. 다만 요나단과 다윗만 그 일을 알고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דָּבָר는 문맥에 따라 ‘일’, ‘사건’, ‘사항’, ‘말’ 등으로 넓게 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר
  english_pob_choice: But the boy
  chosen_korean: 그런데 그 소년은
  alternatives_korean:
  - 그리고 그 소년은
  - 그 젊은이는
  lexicon: HALOT
  rationale: נַעַר는 문맥상 요나단의 시종 겸 동행하는 소년을 가리키므로 ‘소년’이 가장 자연스럽고, וְ는 앞뒤 대조를 살려 ‘그런데’로 옮겼습니다.
- source_word: לֹא יָדַע מְאוּמָה
  english_pob_choice: did not know anything
  chosen_korean: 아무것도 알지 못했습니다
  alternatives_korean:
  - 전혀 알지 못했습니다
  - 무엇도 알지 못했습니다
  lexicon: HALOT
  rationale: 부정문에서 מְאוּמָה는 ‘아무것도/전혀 … 못하다’의 뜻이므로, 직역보다 자연스러운 한국어 부정 표현으로 옮겼습니다.
- source_word: אַךְ
  english_pob_choice: only
  chosen_korean: 다만
  alternatives_korean:
  - 오직
  - 단지
  lexicon: HALOT
  rationale: אַךְ의 제한적·배타적 의미를 살리되, 앞 절과의 대비를 매끄럽게 이어 주는 연결어로 ‘다만’을 선택했습니다.
- source_word: הַדָּבָר
  english_pob_choice: the matter
  chosen_korean: 그 일
  alternatives_korean:
  - 그 일의 정황
  - 그 사항
  - 그 문제
  lexicon: HALOT
  rationale: דָּבָר는 여기서 단순한 ‘사물’이 아니라 두 사람만 아는 사건/정황을 가리키므로, 과도한 해석 없이 ‘그 일’로 옮겼습니다.
