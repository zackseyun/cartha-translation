  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יֵּצֵ֧א יְהוֹנָתָ֛ן הַ/שָּׂדֶ֖ה לְ/מוֹעֵ֣ד דָּוִ֑ד וְ/נַ֥עַר קָטֹ֖ן עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/035.yaml
  text: In the morning[a], Jonathan went out to the field for the appointed meeting with David[b], and a young boy was with him.
  footnotes:
  - marker: a
    text: Or 'at the appointed time with David.' The Hebrew מוֹעֵד can mean either an appointed time or an appointed meeting; the context of their arranged rendezvous supports 'appointed meeting.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a small boy' or 'a young servant.' The Hebrew נַעַר can refer to a boy, youth, or servant depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 아침에 요나단은 다윗과 약속한 때에[a] 들로 나갔습니다. 어린 소년 한 명이[b] 그와 함께 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מוֹעֵד는 ‘정한 때’ 또는 ‘정한 만남/모임’을 뜻할 수 있습니다. 이 문맥에서는 요나단과 다윗 사이에 미리 정해 둔 때를 가리키므로 ‘다윗과 약속한 때’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נַעַר는 문맥에 따라 소년, 청년, 또는 종을 뜻할 수 있습니다. קָטֹן이 함께 쓰여 여기서는 ‘어린 소년’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  english_pob_choice: In the morning
  chosen_korean: 아침에
  alternatives_korean:
  - 아침때에
  - 아침에 일어나
  lexicon: HALOT
  rationale: 시간을 나타내는 ساده한 부사구이므로 한국어에서는 가장 자연스러운 ‘아침에’로 옮겨 원문의 시간 표시를 그대로 살렸습니다.
- source_word: יְהוֹנָתָן
  english_pob_choice: Jonathan
  chosen_korean: 요나단
  alternatives_korean:
  - 요나단왕자
  - 요나단
  lexicon: 현대 한국어 성경 관용 표기
  rationale: 인명은 한국어 성경에서 널리 쓰이는 표기 ‘요나단’을 유지하는 것이 가장 명확합니다.
- source_word: הַשָּׂדֶה
  english_pob_choice: to the field
  chosen_korean: 들로
  alternatives_korean:
  - 밭으로
  - 들판으로
  - 들로
  lexicon: HALOT
  rationale: 문맥상 정해진 만남 장소를 가리키는 פתוח한 ‘field’이므로, 자연스러운 한국어로는 ‘들로’가 가장 무난하며 ‘밭’보다 범위가 넓습니다.
- source_word: לְמוֹעֵד דָּוִד
  english_pob_choice: for the appointed meeting with David
  chosen_korean: 다윗과의 정한 만남을 위해
  alternatives_korean:
  - 다윗과의 appointed meeting을 위해
  - 다윗과의 약속한 시간에
  - 다윗과의 정한 만남을 위해
  lexicon: HALOT
  rationale: מוֹעֵד는 ‘정한 시간’과 ‘정한 만남/모임’ 둘 다 가능하지만, 여기서는 이미 약속된 재회가 문맥상 핵심이므로 ‘정한 만남’으로 살렸습니다.
- source_word: וְנַעַר קָטֹן
  english_pob_choice: a young boy
  chosen_korean: 어린 소년 하나
  alternatives_korean:
  - 젊은 종 하나
  - 어린 아이 하나
  - 어린 소년 하나
  lexicon: HALOT
  rationale: נַעַר는 문맥에 따라 소년/청년/종을 뜻할 수 있으나, כאן은 나이의 어리고 작음을 강조하므로 ‘어린 소년’이 적합합니다.
theological_decisions:
- issue: 문맥상 ‘appointed meeting’의 의미를 시간보다 만남으로 풀 것인지
  chosen_reading: ‘정한 만남’으로 번역해 요나단과 다윗이 미리 정한 재회 장소라는 문맥을 드러냈습니다.
  alternative_readings:
  - ‘정한 시간’
  - ‘약속한 때’
  rationale: 히브리어 מוֹעֵד는 양쪽 의미가 가능하지만, 바로 앞뒤 문맥이 신호를 통한 재회 장면이므로 ‘만남’ 쪽을 택하는 것이 독자 이해에 더 정확합니다.
  doctrine_reference: 서사 문맥 우선 원칙
