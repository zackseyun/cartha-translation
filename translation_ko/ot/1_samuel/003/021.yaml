translation:
  language: ko
  text: 야훼께서 실로에서 다시 나타나셨습니다[a]. 이는 야훼께서 실로에서 야훼의 말씀으로 사무엘에게 자신을 드러내셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 말씀을 통해’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  english_pob_choice: continued
  chosen_korean: 다시 나타나셨습니다
  alternatives_korean:
  - 계속 나타나셨습니다
  - 또 나타나셨습니다
  lexicon: HALOT
  rationale: 히브리어 יָסַף + 부정사는 반복적·지속적 행위를 나타내므로, 문맥상 자연스럽게 ‘다시’로 옮겨 반복성을 살렸습니다.
- source_word: לְהֵרָאֹה
  english_pob_choice: to appear
  chosen_korean: 나타나셨습니다
  alternatives_korean:
  - 보이셨습니다
  - 드러나셨습니다
  lexicon: HALOT
  rationale: 하나님의 현현을 가리키는 표현이므로, 한국어에서는 ‘나타나셨다’가 가장 자연스럽고 직접적입니다.
- source_word: נִגְלָה
  english_pob_choice: revealed himself
  chosen_korean: 자신을 드러내셨습니다
  alternatives_korean:
  - 자신을 나타내셨습니다
  - 계시하셨습니다
  lexicon: HALOT
  rationale: 같은 절 안에서 앞의 ‘나타나셨습니다’와 구별하여, עצמי-계시의 뉘앙스를 살리면서도 한국어로는 ‘자신을 드러내셨습니다’로 옮겼습니다.
- source_word: בִּדְבַר יְהוָה
  english_pob_choice: by the word of Yahweh
  chosen_korean: 야훼의 말씀으로
  alternatives_korean:
  - 야훼의 말씀을 통해
  - 야훼의 말씀 안에서
  lexicon: HALOT
  rationale: בְּ의 도구적 용법을 살려, 계시가 ‘말씀으로’ 이루어졌다는 뜻을 간결하게 드러냈습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 여호와의 이름(יהוה)을 직접 사용하므로, 관습적 대체어보다 고유 이름인 ‘야훼’를 유지해 본문의 명명성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH'
- issue: 현현과 계시의 이중 표현
  chosen_reading: ‘다시 나타나셨습니다’와 ‘자신을 드러내셨습니다’를 함께 유지
  alternative_readings:
  - 한 표현으로 통합
  - ‘보이셨습니다’로 평준화
  rationale: 본문은 ‘나타남’과 ‘드러냄’을 함께 말하므로, 두 표현을 구분해 반복적 현현과 자기계시의 긴장을 그대로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
