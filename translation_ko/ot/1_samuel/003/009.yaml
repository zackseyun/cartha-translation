revisions:
- from: 그러자 엘리가 사무엘에게 말했습니다. “가서 누워라. 그리고 만일 그가 너를 부르거든, ‘말씀하십시오, 야훼여, 주의 종이 듣고 있습니다’라고 하여라.” 그래서 사무엘은 가서 제자리에서 누웠습니다.[a]
  to: 그러자 엘리가 사무엘에게 말했습니다. “가서 누우십시오. 그분이 당신을 부르시면, ‘말씀하십시오, 야훼여[a]. 주의 종이 듣고 있습니다’라고 하십시오.” 그래서 사무엘은 가서 제자리에서 누웠습니다.
  rationale: 합쇼체를 직접 화법까지 일관되게 적용하고, 문맥상 야훼를 가리키는 생략 주어에 적절한 높임을 반영했습니다. ‘야훼’ 및 ‘주의 종’이라는 핵심 표현은 유지했으며, 각주의 용어와 표지 위치를 바로잡아 주석 대상이 분명하도록 했습니다.
