base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/009.yaml
  text: Then Eli said to Samuel[a], “Go, lie down, and if he calls to you, you shall say, ‘Speak, Yahweh, for your servant is listening.’” So Samuel went and lay down in his place.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Speak, the LORD, for your servant is listening.'' Some translations render the divine name here as ''Yahweh'' rather than ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 엘리가 사무엘에게 말했습니다. “가서 누워라. 그리고 만일 그가 너를 부르거든, ‘말씀하십시오, 야훼여, 주의 종이 듣고 있습니다’라고 하여라.” 그래서 사무엘은 가서 제자리에서 누웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘말씀하십시오, 야훼여, 주의 종이 듣고 있습니다’입니다. POB는 여기서 신명기적 이름 יְהוָה를 ‘야훼’로 옮깁니다.
    reason: source_note
lexical_decisions:
- source_word: לֵךְ שְׁכָב
  english_pob_choice: Go, lie down
  chosen_korean: 가서 누워라
  alternatives_korean:
  - 가서 드러누워라
  - 가서 자리에 누워라
  lexicon: WLC; HALOT
  rationale: 두 명령형의 연속을 자연스러운 한국어로 살리되, 본문에 없는 ‘잠’의 의미를 덧붙이지 않기 위해 단순히 ‘누워라’로 옮겼습니다.
- source_word: יִקְרָא אֵלֶיךָ
  english_pob_choice: he calls to you
  chosen_korean: 그가 너를 부르거든
  alternatives_korean:
  - 누군가 너를 부르거든
  - 그가 너에게 부르거든
  lexicon: WLC; HALOT
  rationale: 히브리어는 주어가 생략되어 있으나 문맥상 엘리가 이제 그 부르시는 분을 야훼로 이해하고 있으므로, 그 추론을 반영해 ‘그가’로 옮겼습니다.
- source_word: דַּבֵּר יְהוָה
  english_pob_choice: Speak, Yahweh
  chosen_korean: 말씀하십시오, 야훼여
  alternatives_korean:
  - 말하소서, 야훼여
  - 말씀하소서, 야훼여
  lexicon: WLC; HALOT
  rationale: 직접 호명하는 기도/응답 형식이므로 한국어에서도 공손한 명령형 ‘말씀하십시오’를 유지하고, יְהוָה는 본문 원형에 따라 ‘야훼’로 옮겼습니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 당신의 종
  lexicon: WLC; HALOT
  rationale: 여기서는 하나님 앞의 겸손한 자기호칭으로 기능하므로, 소속 상태를 강조하는 ‘노예’보다 관용적으로 ‘종’을 선택했습니다. 한국어 높임은 ‘주의’로 자연스럽게 처리했습니다.
- source_word: בִּמְקוֹמוֹ
  english_pob_choice: in his place
  chosen_korean: 제자리에서
  alternatives_korean:
  - 자기 자리에
  - 그의 자리에서
  lexicon: WLC; HALOT
  rationale: 장소의 반복을 한국어답게 압축하되, 사무엘이 있던 자리로 돌아갔다는 의미를 살리기 위해 ‘제자리에서’로 번역했습니다.
theological_decisions:
- issue: יהוה를 한국어에서 어떻게 부를 것인가
  chosen_reading: 본문의 직접 음역을 따라 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에는 신명기적 고유명사 יְהוָה가 직접 나오므로, POB의 표준 원칙에 따라 칭호 대신 고유이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 직접 화법의 공손한 종결
  chosen_reading: 하나님께 드리는 응답형 문장으로 ‘말씀하십시오’와 ‘야훼여’의 공손한 높임을 유지했습니다.
  alternative_readings:
  - 말하소서, 야훼여
  - 말씀하소서, 야훼여
  rationale: 엘리의 지시를 따라 사무엘이 야훼께 응답할 내용을 예비하는 장면이므로, 한국어에서도 예배적·기도적 공손함이 드러나도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
