  source_fidelity: 원문의 명령 연속, 조건절, 야훼를 향한 직접 호명, ‘주의 종’, 그리고 사무엘이 자기 자리에서 누운 서술은 대체로 충실합니다. 다만 원문에서 야훼를 가리키는 것으로 문맥상 이해되는 생략 주어를 한국어에서 ‘그가’라고 하면 신적 높임이 충분히 드러나지 않습니다. ‘그분이’와 높임 조건형으로 처리하는 것이 현대 한국어에서 더 적절합니다.
  naturalness: 서술문은 합쇼체이나 엘리의 직접 인용은 ‘누워라/하여라’라는 해라체여서 지정된 현대 formal-polite 합쇼체와 일관되지 않습니다. 직접 화법도 ‘누우십시오/부르시면/하십시오’로 통일하는 편이 자연스럽고 공손한 문체를 유지합니다.
  terminology: ‘야훼’와 ‘주의 종’은 원문 및 POB의 신명 표기 원칙에 부합합니다. 그러나 각주는 יְהוָה를 ‘신명기적 이름’이라고 부르는데, 이는 통상적이고 정확한 한국어 표현이 아닙니다. ‘하나님의 이름’ 또는 ‘테트라그람마톤’으로 바로잡아야 합니다.
