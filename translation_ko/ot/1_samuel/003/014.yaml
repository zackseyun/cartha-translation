  source_fidelity: 핵심 의미와 맹세 공식의 강한 부정, וכן 제의 수단에 의한 속죄의 불가능성은 대체로 충실합니다. 다만 נִשְׁבַּעְתִּי는 완료형으로, 현재형 ‘맹세합니다’보다 ‘맹세하였습니다’가 원문의 완료된 맹세와 영어 POB의 ‘I have sworn’를 더 정확히 반영합니다. זֶבַח는 ‘제물’보다 제사 행위를 가리키는 ‘제사’가 병렬된 ‘예물’과 함께 더 분명합니다.
