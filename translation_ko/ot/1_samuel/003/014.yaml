source:
  edition: WLC
  text: וְ/לָ/כֵ֥ן נִשְׁבַּ֖עְתִּי לְ/בֵ֣ית עֵלִ֑י אִֽם יִתְכַּפֵּ֞ר עֲוֺ֧ן בֵּית עֵלִ֛י בְּ/זֶ֥בַח וּ/בְ/מִנְחָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/014.yaml
  text: 'Therefore I have sworn to the house of Eli: the iniquity of Eli’s house shall never be atoned for by sacrifice or offering[a][b].'
  footnotes:
  - marker: a
    text: Or 'the iniquity of Eli’s house shall surely not be atoned for.' The Hebrew uses an oath formula with 'if' after 'I have sworn' to express strong negation.
    reason: lexical_alternative
  - marker: b
    text: '''Offering'' translates Hebrew minchah, often specifically a ''grain offering.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 엘리의 집에 대하여 맹세합니다. 엘리의 집의 죄악은 제물이나 예물로는 결코 속죄되지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘엘리의 집의 죄악은 반드시 속죄되지 않을 것입니다.’ ‘내가 맹세하다’ 뒤의 ‘만일’은 히브리어 맹세 공식에서 강한 부정을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘예물’은 히브리어 minchah를 옮긴 말로, 문맥에 따라 특히 ‘곡식제물’을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 따라서
  lexicon: HALOT
  rationale: 앞선 심판 선언에 대한 결론 표지를 자연스러운 현대 한국어 인과 접속으로 옮겼습니다.
- source_word: נִשְׁבַּעְתִּי
  english_pob_choice: I have sworn
  chosen_korean: 맹세합니다
  alternatives_korean:
  - 맹세했습니다
  - 내가 맹세하였습니다
  lexicon: HALOT
  rationale: 히브리어 완료형의 단호하고 법정적인 효력을 살리기 위해, 하나님 직접 화법에서는 현재형 감각의 엄숙한 진술로 옮겼습니다.
- source_word: אִם ... עַד עוֹלָם
  english_pob_choice: shall never
  chosen_korean: 결코 ... 않을 것입니다
  alternatives_korean:
  - 영원히 ... 않을 것입니다
  - 절대로 ... 없습니다
  lexicon: HALOT
  rationale: 맹세 공식에서의 부정적 관용구를 직역하면 어색하므로, 의미상 강한 부정을 드러내는 한국어로 옮겼습니다.
- source_word: בְּזֶבַח וּבְמִנְחָה
  english_pob_choice: by sacrifice or offering
  chosen_korean: 제물이나 예물로
  alternatives_korean:
  - 희생제사나 곡식제물로
  - 희생제사나 제물로
  lexicon: HALOT
  rationale: זֶבַח과 מִנְחָה의 제의적 병렬을 살리되, מִנְחָה를 지나치게 특정화하지 않으면서도 문맥상 자연스러운 대칭 표현을 사용했습니다.
theological_decisions:
- issue: מִנְחָה의 범위
  chosen_reading: 예물로
  alternative_readings:
  - 곡식제물로
  - 소제로
  rationale: 본문의 병렬 구조는 제의 전체의 무력함을 강조하지만, מִנְחָה가 문맥에 따라 더 구체적인 곡식제물을 뜻할 수 있으므로 본문에는 넓은 표현을 두고 주석으로 여지를 남겼습니다.
  doctrine_reference: 텍스트가 허용하는 범위 안에서 제의 용어의 폭을 보존합니다.
