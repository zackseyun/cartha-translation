  terminology: ‘속죄되다’는 יִתְכַּפֵּר 및 제의 문맥을 적절히 옮깁니다. מִנְחָה는 본문에서 ‘예물’로 두고 곡식제물 가능성을 주석으로 밝히는 방식이 안전합니다. 주석 a의 표현은 원문의 ‘만일’이 맹세 뒤에서 관용적으로 강한 부정을 형성함을 더 정확히 설명하도록 다듬어야 합니다.
