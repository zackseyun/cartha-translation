  to: 그때 야훼께서 오셔서 그곳에 서신 뒤, 전과 같이[a] 「사무엘아, 사무엘아!」 하고 부르셨습니다. 그러자 사무엘이 「말씀하십시오. 주의 종이 듣고 있습니다」 하고 말했습니다.
