source:
  edition: WLC
  text: וַ/יָּבֹ֤א יְהוָה֙ וַ/יִּתְיַצַּ֔ב וַ/יִּקְרָ֥א כְ/פַֽעַם בְּ/פַ֖עַם שְׁמוּאֵ֣ל שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ דַּבֵּ֔ר כִּ֥י שֹׁמֵ֖עַ עַבְדֶּֽ/ךָ־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/010.yaml
  text: Then Yahweh came and stood there[a], and called as at the other times, “Samuel, Samuel!” And Samuel said, “Speak, for your servant is listening.”
  footnotes:
  - marker: a
    text: Or, “as before.” The Hebrew idiom literally compares this call with the previous times.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 오셔서 그곳에 서신 뒤, 전과 같이[a] 「사무엘아, 사무엘아!」 하고 부르셨습니다. 그러자 사무엘이 「말씀하십시오. 주의 종이 듣고 있습니다」 하고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전과 같이’는 히브리어 관용구가 앞선 반복 호출과의 비교를 뜻한다는 점을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: WLC
  rationale: 프로젝트 기본값에 따라 신적 이름 יְהוָה는 학문적 음역인 ‘야훼’로 옮겨, 본문의 고유한 언약적 지칭을 유지했습니다.
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 오셨습니다
  alternatives_korean:
  - 오셨다
  - 도착하셨습니다
  lexicon: HALOT
  rationale: 서술 동작을 자연스러운 현대 한국어로 옮기되, 주어가 야훼이므로 경어형 ‘오셨습니다’를 사용했습니다.
- source_word: וַיִּתְיַצַּב
  english_pob_choice: stood there
  chosen_korean: 그곳에 서 계시며
  alternatives_korean:
  - 서 계셨습니다
  - 거기에 서셨습니다
  - 서 있었습니다
  lexicon: HALOT
  rationale: 단순한 ‘서다’보다 ‘서 계시다’가 지속적 임재와 장면의 현장감을 더 잘 살리며, ‘there’를 위해 ‘그곳에’를 더했습니다.
- source_word: כְ/פַֽעַם בְּ/פַעַם
  english_pob_choice: as at the other times
  chosen_korean: 전과 같이
  alternatives_korean:
  - 이전처럼
  - 다른 때들처럼
  - 앞서와 같이
  lexicon: HALOT
  rationale: 히브리어 관용구의 비교적 의미를 자연스럽게 드러내는 표현으로, 앞선 반복 호출과의 대비를 간결하게 전달합니다.
- source_word: שֹׁמֵעַ
  english_pob_choice: is listening
  chosen_korean: 듣고 있습니다
  alternatives_korean:
  - 경청하고 있습니다
  - 듣습니다
  - 귀를 기울이고 있습니다
  lexicon: HALOT
  rationale: 현재분사형의 진행·준비 상태를 살려 ‘듣고 있습니다’로 옮겼습니다. ‘경청하다’는 다소 문어적이고, ‘듣습니다’는 상태감이 약합니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 당신의 종
  - 당신의 노예
  lexicon: HALOT
  rationale: 여기서는 하나님께 대한 겸손한 자기호칭으로 기능하므로 ‘종’이 가장 자연스럽습니다. ‘노예’는 본문의 소유·예속 뉘앙스를 과도하게 전면화합니다.
theological_decisions:
- issue: 야훼의 현현을 어떻게 표현할지
  chosen_reading: ‘오셔서 그곳에 서 계시며’로 본문의 구체적 서술을 유지했습니다.
  alternative_readings:
  - ‘나타나셔서’
  - ‘임재하셔서’
  rationale: 히브리어는 추상화된 신학어보다 서사적·인격적 묘사를 사용하므로, 그 구체성을 완화하지 않고 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 사무엘의 응답에서 하나님의 호칭과 존대 수준
  chosen_reading: 하나님께 직접 말하는 부분은 ‘말씀하십시오’와 ‘주의 종’으로 존대형을 유지했습니다.
  alternative_readings:
  - ‘말해 보십시오’
  - ‘당신의 종’
  rationale: 직접적인 하나님 호칭에는 한국어 경어를 사용하되, 종이라는 자기정체성은 원문의 복종 관계를 드러내도록 유지했습니다.
  doctrine_reference: Korean target style guide
