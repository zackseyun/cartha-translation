base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/019.yaml
  text: And Samuel grew[a], and Yahweh was with him and let none of his words fall to the ground.
  footnotes:
  - marker: a
    text: Or, 'did not let any of his words fail.' The Hebrew idiom is literally 'did not let any of his words fall to the ground.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘이 자라자, 야훼께서 그와 함께 계셨고 그의 말 가운데 어떤 것도 땅에 떨어지게 하지 않으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 말 가운데 어떤 것도 땅에 떨어지지 않게 하셨다’입니다. 이 히브리어 관용구는 곧 그의 말이 헛되거나 실패하지 않았다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  english_pob_choice: grew
  chosen_korean: 자라자
  alternatives_korean:
  - 성장하자
  - 커가자
  - 자라났습니다
  lexicon: HALOT
  rationale: 사무엘의 자연스러운 성장과 성숙을 간결하게 살리기 위해, 서사 흐름에 맞는 ‘자라자’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 문맥의 고유한 하나님의 이름을 드러내기 위해 관습적 대체어 대신 ‘야훼’를 유지했습니다.
- source_word: הָיָה עִמּוֹ
  english_pob_choice: was with him
  chosen_korean: 그와 함께 계셨고
  alternatives_korean:
  - 그와 함께 있으셨고
  - 그와 함께 하셨고
  lexicon: HALOT
  rationale: 하나님의 임재와 호의를 나타내는 관용구를 한국어의 자연스러운 존댓말 서술로 옮겼습니다.
- source_word: וְלֹא הִפִּיל מִכָּל דְּבָרָיו אָרְצָה
  english_pob_choice: let none of his words fall to the ground
  chosen_korean: 그의 말 가운데 어떤 것도 땅에 떨어지게 하지 않으셨습니다
  alternatives_korean:
  - 그의 말 가운데 하나도 땅에 떨어지지 않게 하셨습니다
  - 그의 모든 말이 헛되지 않게 하셨습니다
  lexicon: HALOT
  rationale: 히브리어의 생생한 관용구를 직접 살리되, 한국어에서 이해되도록 ‘땅에 떨어지게 하지 않으셨습니다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: ‘야훼’로 표기하여 신적 고유명을 유지함
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 음역
  rationale: 본문이 토라적 언약 이름을 직접 사용하므로, 호칭으로 완화하지 않고 고유명을 보존하는 것이 원문 가시성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘말이 땅에 떨어지다’ 관용구
  chosen_reading: 예언의 성취로 평탄화하지 않고 원문의 관용적 이미지를 유지함
  alternative_readings:
  - ‘그의 말이 다 이루어지게 하셨습니다’
  - ‘그의 말이 하나도 실패하지 않게 하셨습니다’
  rationale: 문맥상 예언자적 신뢰성이 드러나지만, 원문은 ‘떨어지다’라는 시각적 표현을 사용하므로 그 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; original-language primacy'
