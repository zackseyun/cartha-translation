revisions:
- from: 그리고 내가 그에게 말했습니다. 곧 내가 그의 집을 영원히 심판하겠다고 말입니다. 그것은 그가 알면서도 저지른 죄악 때문입니다. 그의 아들들은 하나님을 모독하고 있었는데도 그가 그들을 제지하지 않았습니다.[a]
  to: 그리고 내가 그에게 이미 알려 주었습니다. 내가 그의 집을 영원토록 심판하고 있다는 것을 말입니다. 이는 그가 알고 있던 죄악, 곧 그의 아들들이 자기들에게 저주를 불러오고 있었는데도[a] 그가 그들을 제지하지 않았기 때문입니다.
  rationale: 원어 우선 원칙에 따라 MT의 לָהֶם을 본문에서 보존하고, 널리 알려진 ‘하나님을 저주하다/모독하다’ 대안은 각주로 옮겼습니다. 또한 ‘그가 알고 있던 죄악’으로 고쳐 엘리의 인지와 감독 책임은 유지하되 그가 그 죄악을 직접 범했다는 부당한 함의를 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:16:41Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 마소라 본문은 מְקַלְלִים לָהֶם(직역하면 ‘그들이 자신들에게 저주하고 있었다/자기들에게 저주를 불러오고 있었다’)을 읽으므로, 이를 본문에서 ‘하나님을 모독하고 있었다’로 확정할 수 없습니다. 또한 אֲשֶׁר יָדַע은 엘리가 ‘알고 있던’ 죄악을 가리키며, 그가 그 죄악을 직접 ‘알면서 저질렀다’는 뜻으로 좁히지 않아야 합니다. 영어 POB 본문은 대안 읽기를 본문에 두었으나, 영어의 어휘·신학 결정 기록은 MT 독법을 본문으로 삼도록 되어 있어 상호 불일치합니다. 원어 본문을 우선하여 MT의 난해성을 한국어 본문에 보존하고 대안은 각주로 처리했습니다.
  naturalness: 합쇼체로 자연스럽게 다듬었습니다. ‘말했습니다. 곧 … 말입니다’의 반복과 어색한 분절을 ‘알려 주었습니다. … 것을’으로 정리했습니다. ‘자기들에게 저주를 불러오고 있었다’는 한국어에서 다소 낯설지만, 난해한 MT 표현을 임의로 ‘하나님을 모독하다’로 해소하지 않는 가장 명료한 표현입니다.
  terminology: בֵּיתוֹ는 범위를 한정하지 않고 ‘그의 집’으로, עַד עוֹלָם은 ‘영원토록’으로, כִהָה בָּם은 문맥상 ‘제지하지 않았습니다’로 유지했습니다. מְקַלְלִים לָהֶם의 대안 독법은 본문에 넣지 않고 해당 구절에 각주를 연결했습니다.
  issues:
  - severity: high
    issue: 마소라 본문의 난해한 표현을 본문에서 ‘하나님을 모독하고 있었다’로 확정함
    rationale: WLC의 לָהֶם은 ‘그들에게/자기들에게’를 읽습니다. ‘하나님을 저주하다/모독하다’는 고대 증언 및 전통적 대안 독법으로 각주 처리해야 하며, 본문에 채택하려면 원문보다 특정 전승을 우선하게 됩니다.
  - severity: high
    issue: ‘그가 알면서도 저지른 죄악’이 אֲשֶׁר יָדַע의 의미를 변경함
    rationale: 원문은 엘리가 그 죄악을 알고 있었다는 그의 인지와 책임을 말합니다. 엘리가 그 죄악의 직접 행위자라는 뜻으로 번역해서는 안 됩니다.
  - severity: medium
    issue: 각주 표지가 대안 독법이 걸리는 구절이 아니라 문장 끝에 놓임
    rationale: 각주는 아들들의 저주 행위를 설명하므로 ‘자기들에게 저주를 불러오고 있었다’ 바로 뒤에 두는 것이 앵커 범위를 분명히 합니다.
  - severity: low
    issue: ‘신성을 모독하고 있었다’라는 각주 대안
    rationale: 대안 전승의 통상적 의미는 ‘하나님을 저주하다’ 또는 ‘하나님을 모독하다’입니다. ‘신성’은 비인칭적이고 원문의 인격적 지시를 흐릴 수 있습니다.
  revised_text: 그리고 내가 그에게 이미 알려 주었습니다. 내가 그의 집을 영원토록 심판하고 있다는 것을 말입니다. 이는 그가 알고 있던 죄악, 곧 그의 아들들이 자기들에게 저주를 불러오고 있었는데도[a] 그가 그들을 제지하지 않았기 때문입니다.
