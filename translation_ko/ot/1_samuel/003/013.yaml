  text: וְ/הִגַּ֣דְתִּי ל֔/וֹ כִּֽי שֹׁפֵ֥ט אֲנִ֛י אֶת בֵּית֖/וֹ עַד עוֹלָ֑ם בַּ/עֲוֺ֣ן אֲשֶׁר יָדַ֗ע כִּֽי מְקַֽלְלִ֤ים לָ/הֶם֙ בָּנָ֔י/ו וְ/לֹ֥א כִהָ֖ה בָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/013.yaml
  text: And I have declared to him that I am judging his house forever for the iniquity that he knew[a], because his sons were cursing God, and he did not restrain them.
  footnotes:
  - marker: a
    text: Or, according to an alternative reading reflected in some ancient witnesses and many translations, 'because his sons were cursing God' or 'were blaspheming.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 내가 그에게 말했습니다. 곧 내가 그의 집을 영원히 심판하겠다고 말입니다. 그것은 그가 알면서도 저지른 죄악 때문입니다. 그의 아들들은 하나님을 모독하고 있었는데도 그가 그들을 제지하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 일부 고대 증언과 많은 번역이 반영하는 다른 읽기대로는 ‘그의 아들들은 하나님을 모독하고 있었다’ 또는 ‘신성을 모독하고 있었다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגַּדְתִּי
  english_pob_choice: And I have declared
  chosen_korean: 그리고 내가 그에게 말했습니다
  alternatives_korean:
  - 그리고 내가 그에게 선언했습니다
  - 그리고 내가 그에게 알렸습니다
  lexicon: HALOT
  rationale: 히필 נגד는 단순 통보보다 공식적으로 알리거나 선포하는 뜻이 있어, 문맥상 하나님이 엘리에게 이미 경고하신 사실을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: שֹׁפֵט אֲנִי
  english_pob_choice: I am judging
  chosen_korean: 내가 그의 집을 영원히 심판하겠다고
  alternatives_korean:
  - 내가 그의 집을 영원히 판단하겠다고
  - 내가 그의 집을 영원토록 재판하고 있다고
  lexicon: HALOT
  rationale: 분사형은 진행 중이거나 확정된 심판의 성격을 띠므로, 단순 미래보다 현재 진행형적 뉘앙스를 살려 ‘심판하겠다’로 옮겼습니다.
- source_word: בַּעֲוֺן
  english_pob_choice: for the iniquity
  chosen_korean: 죄악 때문입니다
  alternatives_korean:
  - 불의 때문입니다
  - 죄 때문입니다
  lexicon: HALOT
  rationale: עָוֹן의 도덕적 무게를 살리기 위해 ‘죄’보다 더 무거운 ‘죄악’을 사용했습니다.
- source_word: כִהָה בָּם
  english_pob_choice: did not restrain them
  chosen_korean: 그가 그들을 제지하지 않았습니다
  alternatives_korean:
  - 그가 그들을 꾸짖지 않았습니다
  - 그가 그들을 억제하지 않았습니다
  lexicon: HALOT
  rationale: 문맥상 아들들의 행동을 꺾거나 멈추게 하지 않은 책임을 말하므로, 실제적 뉘앙스를 가장 직접적으로 드러내는 ‘제지하다’를 택했습니다.
theological_decisions:
- issue: 아들들의 죄를 어떻게 옮길 것인가
  chosen_reading: ‘하나님을 모독하고 있었습니다’로 옮겨, 본문 전승상 널리 반영된 불경 표현을 본문에 반영했습니다.
  alternative_readings:
  - ‘스스로를 저주하고 있었습니다’
  - ‘저주를 퍼붓고 있었습니다’
  rationale: 히브리어 자음 본문은 난해하지만, 이 대목의 고대 증언과 다수 번역은 하나님의 이름을 모독하는 뜻으로 이해합니다. 본문을 지나치게 완화하지 않고, 죄의 성격을 분명히 드러내는 쪽이 문맥에 더 부합합니다.
  doctrine_reference: Translation philosophy 1 and 3
- issue: ‘그의 집’의 범위를 어떻게 처리할 것인가
  chosen_reading: ‘그의 집’으로 그대로 두어 가문과 가계 전체를 포괄하게 했습니다.
  alternative_readings:
  - 그의 가문
  - 그의 가족
  rationale: 히브리어 집(בַּיִת)은 단순 거주 공간이 아니라 가문/왕조까지 포함할 수 있으므로, 범위를 좁히지 않는 것이 안전합니다.
  doctrine_reference: Translation philosophy 3
