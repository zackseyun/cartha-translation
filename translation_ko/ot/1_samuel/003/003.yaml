  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נֵ֤ר אֱלֹהִים֙ טֶ֣רֶם יִכְבֶּ֔ה וּ/שְׁמוּאֵ֖ל שֹׁכֵ֑ב בְּ/הֵיכַ֣ל יְהוָ֔ה אֲשֶׁר שָׁ֖ם אֲר֥וֹן אֱלֹהִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/003.yaml
  text: And the lamp of God had not yet gone out[a], and Samuel was lying down in the temple of Yahweh, where the ark of God was.
  footnotes:
  - marker: a
    text: Or 'the sanctuary of the LORD.' Hebrew heikhal can refer to a temple or sanctuary; here it denotes the LORD's dwelling place at Shiloh.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 등불이 아직 꺼지지 않았고, 사무엘은 하나님의 궤가 있는 야훼의 성전[a]에서 누워 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 성소’입니다. 히브리어 헤칼(heikhal)은 성전이나 성소를 가리킬 수 있으며, 여기서는 실로에 있던 야훼의 거처를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵר אֱלֹהִים
  english_pob_choice: the lamp of God
  chosen_korean: 하나님의 등불
  alternatives_korean:
  - 하나님의 등불
  - 하나님의 램프
  lexicon: HALOT
  rationale: נֵר는 일반적인 ‘빛’보다 구체적인 ‘등불’이므로, 예배 공간의 등불이라는 문맥을 살려 ‘하나님의 등불’로 옮겼습니다.
- source_word: טֶרֶם יִכְבֶּה
  english_pob_choice: had not yet gone out
  chosen_korean: 아직 꺼지지 않았고
  alternatives_korean:
  - 아직 꺼지지 않았습니다
  - 아직 꺼지지 않은 상태였고
  lexicon: HALOT
  rationale: טֶרֶם의 ‘아직 ~하지 않다’와 램프의 ‘꺼지다’를 자연스럽게 반영해, 과거 진행의 배경 상황으로 ‘아직 꺼지지 않았고’라고 번역했습니다.
- source_word: הֵיכַל יְהוָה
  english_pob_choice: the temple of Yahweh
  chosen_korean: 야훼의 성전
  alternatives_korean:
  - 야훼의 성소
  - 야훼의 성막
  lexicon: HALOT
  rationale: הֵיכָל은 문맥상 성전/성소/궁전이 가능하지만, 이 구절의 예배 공간을 가리키는 표준 대응으로 ‘성전’을 택했습니다. 본문은 또한 야훼의 고유명사를 보존해 ‘야훼의 성전’으로 옮겼습니다.
- source_word: אֲרוֹן אֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 궤
  alternatives_korean:
  - 하나님의 법궤
  - 하나님의 언약궤
  lexicon: HALOT
  rationale: אֲרוֹן은 단순한 ‘상자’가 아니라 언약 공동체의 거룩한 궤를 가리키므로, 전통적으로 널리 쓰이는 ‘궤’를 유지하되 과도한 신학적 확장을 피하기 위해 ‘하나님의 궤’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 고유 신명은 대체 호칭이 아니라 음역으로 보존하는 방침에 따라 ‘야훼’를 사용했습니다. 이는 독자가 본문의 언약적 이름을 직접 인식하도록 돕습니다.
  doctrine_reference: Contested terms table for יְהוָה
- issue: הֵיכַל יְהוָה의 시대적 배경
  chosen_reading: 야훼의 성전
  alternative_readings:
  - 야훼의 성소
  rationale: 사무엘상의 시기는 솔로몬 성전 이전이지만, כאן הֵיכָל의 어휘적 범위는 ‘성전’까지 포함합니다. 따라서 본문 의미를 해치지 않으면서도 현대 한국어에서 자연스러운 ‘성전’을 본문에 두고, 대안인 ‘성소’는 각주로 남겼습니다.
  doctrine_reference: Translation philosophy §§1, 6; Contested terms table for יְהוָה
