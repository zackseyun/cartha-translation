  yaml_path: translation/ot/1_samuel/003/012.yaml
  text: On that day I will carry out against Eli all that I have spoken concerning his house[b][a], from beginning to end.
  footnotes:
  - marker: a
    text: Or 'I will fulfill for Eli all that I have spoken concerning his house.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his house' can mean his household, family line, or priestly house.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 내가 엘리에게 그 집에 관하여 내가 말한 모든 것을 처음부터 끝까지 실행하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בַּיִת은 여기서 집, 집안, 가문, 제사장 집안을 모두 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘실행하겠습니다’는 본문에서 ‘말한 것’을 실제로 집행한다는 뜻을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: On that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 날에
  - 그때에
  lexicon: HALOT
  rationale: 특정한 미래 시점을 가리키는 표현이므로, 현대 한국어에서 자연스러운 ‘그날에’로 옮겨 시간 지시성을 살렸습니다.
- source_word: אָקִים
  english_pob_choice: I will carry out
  chosen_korean: 실행하겠습니다
  alternatives_korean:
  - 이루겠습니다
  - 행하겠습니다
  - 성취하겠습니다
  lexicon: HALOT
  rationale: 여기서는 ‘말한 것’을 현실에서 집행한다는 뜻이므로, 단순히 세우다보다 ‘실행하다’가 심판의 집행 뉘앙스를 더 직접적으로 드러냅니다.
- source_word: אֶל עֵלִי
  english_pob_choice: against Eli
  chosen_korean: 엘리에게
  alternatives_korean:
  - 엘리를 향하여
  - 엘리에게 대하여
  lexicon: HALOT
  rationale: 히브리어 אֶל은 문맥에 따라 ‘~에게/~에 대해’의 대상 표지가 되며, 심판 선언의 수신자를 자연스럽게 드러내기 위해 본문에는 중립적인 ‘에게’를 두었습니다.
- source_word: אֶל בֵּיתוֹ / בֵּיתוֹ
  english_pob_choice: concerning his house / his house
  chosen_korean: 그 집에 관하여
  alternatives_korean:
  - 그의 집에 대하여
  - 그 가문에 관하여
  - 그 집안에 관하여
  lexicon: HALOT
  rationale: בַּיִת은 집, 집안, 가문, 제사장 가문까지 포괄할 수 있으므로, 의미 범위를 열어 두는 ‘그 집에 관하여’가 가장 안전합니다.
- source_word: הָחֵל וְכַלֵּה
  english_pob_choice: from beginning to end
  chosen_korean: 처음부터 끝까지
  alternatives_korean:
  - 시작부터 끝까지
  - 처음에서 끝까지
  lexicon: HALOT
  rationale: 완전성과 전면성을 나타내는 관용적 병렬을 한국어의 ‘처음부터 끝까지’로 자연스럽게 재현했습니다.
theological_decisions:
- issue: בֵּיתוֹ의 범위
  chosen_reading: ‘그 집’은 엘리의 직계 가정만이 아니라 그의 가문과 제사장 집안까지 포괄하는 열린 표현으로 유지했습니다.
  alternative_readings:
  - ‘그의 가정’으로 한정하기
  - ‘제사장 집안’으로 본문에서 확정하기
  rationale: 히브리어 בַּיִת은 이 본문에서 혈통적 가문과 직분적 집안을 함께 시사하므로, 번역에서 범위를 좁히지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
