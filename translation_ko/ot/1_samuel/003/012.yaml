  source_fidelity: 히브리어의 시간 표현, 발화의 포괄성, 그리고 ‘처음부터 끝까지’라는 완결성은 대체로 잘 반영되었습니다. 다만 בֵּיתוֹ는 엘리를 가리키는 소유 표현이므로 본문에서도 ‘그의 집’으로 밝혀야 하며, 현재의 ‘그 집’은 지시 대상이 불필요하게 불명확합니다. 또한 אֶל עֵלִי의 심판 지향성을 ‘엘리에게’로 유지하되 문장 구조를 다듬어, 그것이 ‘말하다’의 간접 목적어로 오해되지 않게 했습니다.
  naturalness: ‘그날에’와 ‘처음부터 끝까지’는 자연스럽고 합쇼체도 일관됩니다. 그러나 ‘엘리에게 그 집에 관하여 내가 말한’은 두 전치사구의 관계와 ‘그 집’의 소유자가 다소 불분명합니다. 쉼표와 ‘그의’를 사용하면 현대 표준어에서 더 명료합니다.
  terminology: ‘집’은 בַּיִת의 가문·집안·제사장 가문을 아우르는 폭을 본문에서 보존하는 적절한 선택입니다. ‘실행하겠습니다’도 앞서 선포한 심판의 실현이라는 אָקִים의 문맥상 의미를 전달합니다.
