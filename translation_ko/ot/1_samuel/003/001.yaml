  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/נַּ֧עַר שְׁמוּאֵ֛ל מְשָׁרֵ֥ת אֶת יְהוָ֖ה לִ/פְנֵ֣י עֵלִ֑י וּ/דְבַר יְהוָ֗ה הָיָ֤ה יָקָר֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין חָז֖וֹן נִפְרָֽץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/001.yaml
  text: Now the boy Samuel was ministering to Yahweh before Eli[a], and the word of Yahweh was rare in those days; visions were not widespread.
  footnotes:
  - marker: a
    text: Or, 'there was no frequent vision' or 'vision was not breaking forth.' The Hebrew expression is idiomatic and conveys that revelatory visions were uncommon, not openly prevalent.
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘은 아직 어렸을 때 야훼를 섬기며 엘리 앞에서 일하고 있었습니다. 그때는 야훼의 말씀이 드물었고, 환상도 흔하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 ‘드물었고’는 히브리어 표현의 관용적 의미를 풀어 옮긴 것입니다. 직역하면 ‘환상이 자주 있지 않았다’ 또는 ‘환상이 널리 퍼지지 않았다’는 뜻이 됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר
  english_pob_choice: Now the boy
  chosen_korean: 아직 어렸을 때
  alternatives_korean:
  - 그 소년은
  - 어린 사무엘은
  lexicon: HALOT
  rationale: נַעַר는 여기서 사무엘의 연령과 이야기 전개를 가리키므로 ‘소년’보다 자연스럽고 서술적 흐름을 살리는 ‘아직 어렸을 때’로 옮겼습니다.
- source_word: מְשָׁרֵת אֶת יְהוָה
  english_pob_choice: was ministering to Yahweh
  chosen_korean: 야훼를 섬기며
  alternatives_korean:
  - 야훼께 봉사하며
  - 야훼를 시중들며
  lexicon: HALOT
  rationale: 미완료 분사 מְשָׁרֵת의 지속성을 살려 현재 진행적 의미를 담았고, 제의적·신앙적 봉사의 뉘앙스를 고려해 ‘섬기다’로 옮겼습니다.
- source_word: לִפְנֵי עֵלִי
  english_pob_choice: before Eli
  chosen_korean: 엘리 앞에서
  alternatives_korean:
  - 엘리 앞에
  - 엘리의 면전에서
  lexicon: HALOT
  rationale: לִפְנֵי의 기본 의미인 ‘앞에/면전에서’를 살리면서도, 한국어에서는 문맥상 사무엘이 엘리의 감독 아래 있었음을 자연스럽게 드러내는 표현으로 정리했습니다.
- source_word: יָקָר
  english_pob_choice: was rare
  chosen_korean: 드물었고
  alternatives_korean:
  - 귀했으나
  - 희귀했고
  lexicon: HALOT
  rationale: 이 문맥에서 יָקָר는 ‘값지다’보다 계시의 빈도가 낮다는 뜻이 핵심이므로, 말씀의 희소성을 직접 드러내는 ‘드물었고’로 옮겼습니다.
- source_word: אֵין חָזוֹן נִפְרָץ
  english_pob_choice: visions were not widespread
  chosen_korean: 환상도 흔하지 않았습니다
  alternatives_korean:
  - 환상이 널리 퍼져 있지 않았습니다
  - 환상이 자주 있지 않았습니다
  lexicon: HALOT
  rationale: חָזוֹן은 예언적 ‘환상’을 가리키며, נִפְרָץ는 ‘퍼져 나가다/흔해지다’의 뉘앙스를 가지므로 현대 한국어에서 자연스러운 부정 표현으로 정리했습니다.
theological_decisions:
- issue: יהוה를 한국어로 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
