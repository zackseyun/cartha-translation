  - 주님
  rationale: 본문에 יְהוָה가 직접 나오므로 프로젝트 기본값에 따라 고유한 언약 이름을 유지하는 ‘야훼’를 사용했습니다.
  doctrine_reference: 'POB contested term: יהוה / YHWH'
