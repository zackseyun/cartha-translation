source:
  edition: WLC
  text: וַ/יֹּ֨סֶף יְהוָ֥ה קְרֹא שְׁמוּאֵל֮ בַּ/שְּׁלִשִׁית֒ וַ/יָּ֨קָם֙ וַ/יֵּ֣לֶךְ אֶל עֵלִ֔י וַ/יֹּ֣אמֶר הִנְ/נִ֔י כִּ֥י קָרָ֖אתָ לִ֑/י וַ/יָּ֣בֶן עֵלִ֔י כִּ֥י יְהוָ֖ה קֹרֵ֥א לַ/נָּֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/008.yaml
  text: And Yahweh called Samuel again a third time. So he got up and went to Eli and said, “Here I am, for you called me.” Then Eli understood that Yahweh was calling the boy.
translation:
  language: ko
  text: 야훼께서 세 번째로 또 사무엘을 부르셨습니다. 그가 일어나 엘리에게 가서 말했습니다. “제가 여기 있습니다. 당신이 저를 부르셨기 때문입니다.” 그때 엘리는 야훼께서 그 아이를 부르고 계신다는 것을 깨달았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף יְהוָה קְרֹא
  english_pob_choice: called Samuel again a third time
  chosen_korean: 세 번째로 또 사무엘을 부르셨습니다
  alternatives_korean:
  - 사무엘을 다시 세 번째로 부르셨습니다
  - 사무엘을 세 번째로 부르셨습니다
  lexicon: HALOT
  rationale: יָסַף + 부정사 구조의 반복 의미를 한국어에서 자연스럽게 살려, ‘또’와 ‘세 번째로’를 함께 써서 단순한 한 번의 호출이 아니라 재호출임을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 원칙대로 יְהוָה는 칭호가 아니라 고유한 언약 이름이므로, 관습적 대체어 ‘주님’ 대신 ‘야훼’를 유지했습니다.
- source_word: הִנְנִי
  english_pob_choice: Here I am
  chosen_korean: 제가 여기 있습니다
  alternatives_korean:
  - 예, 여기 있습니다
  - 저는 여기 있습니다
  lexicon: HALOT
  rationale: 호응형 응답에서의 준비성과 즉각성을 살리되, 한국어에서는 단순 위치 진술보다 ‘제가 여기 있습니다’가 더 자연스럽고 공손합니다.
- source_word: כִּי קָרָאתָ לִי
  english_pob_choice: for you called me
  chosen_korean: 당신이 저를 부르셨기 때문입니다
  alternatives_korean:
  - 당신이 저를 부르셨으므로
  - 당신이 저를 부르셨기 때문이에요
  lexicon: HALOT
  rationale: כִּי의 이유 용법을 분명하게 살려, 사무엘의 오해를 설명하는 종속절을 한국어에서도 명시적으로 표현했습니다.
- source_word: וַיָּבֶן
  english_pob_choice: understood
  chosen_korean: 깨달았습니다
  alternatives_korean:
  - 이해했습니다
  - 알아차렸습니다
  lexicon: HALOT
  rationale: 엘리의 상황 인식이 단순 지식이 아니라 통찰에 이르는 점을 반영해 ‘깨달았습니다’로 옮겼습니다.
- source_word: קֹרֵא לַנָּעַר
  english_pob_choice: was calling the boy
  chosen_korean: 그 아이를 부르고 계신다는
  alternatives_korean:
  - 그 아이를 부르고 계신 것을
  - 그 소년을 부르고 계신다는
  lexicon: HALOT
  rationale: פעול 중인 분사 קֹרֵא의 진행성을 살려, 한국어 현재진행 구문으로 옮기고 נַעַר는 이 장면의 문맥상 ‘그 아이’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 야훼의 직접 부르심을 서술하는 동사의 시제와 진행성
  chosen_reading: ‘부르고 계신다’로 번역해, 야훼의 현재적이고 계속되는 호출을 드러냈습니다.
  alternative_readings:
  - ‘부르셨다’로 단순 과거 처리
  - ‘부르신다’로 일반 현재 처리
  rationale: 히브리어 분사 קֹרֵא는 그 순간의 진행 중인 행위를 나타내므로, 엘리가 뒤늦게 그 사실을 알아차리는 장면에 맞게 진행형으로 살리는 것이 가장 충실합니다.
  doctrine_reference: Narrative aspect / participial force in Hebrew
- issue: 야훼 이름의 표기
  chosen_reading: 본문에서는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: POB의 신학적·문헌학적 원칙에 따라 טetragrammaton을 대체 칭호로 바꾸지 않고 고유명으로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
