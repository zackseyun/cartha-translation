  - 달려갔습니다
  - 뛰어가서
  lexicon: WLC
  rationale: 동작의 신속함을 살리면서 한국어 서술 흐름에 자연스럽게 맞췄습니다.
- source_word: הִנְנִי / Here I am
  english_pob_choice: Here I am
