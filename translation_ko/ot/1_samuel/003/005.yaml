  text: He ran to Eli and said, “Here I am, because you called me.” But he said, “I did not call. Go back; lie down.” So he went and lay down.
translation:
  language: ko
  text: 그가 엘리에게 달려가서 말했습니다. “제가 여기 있습니다. 당신이 저를 부르셨기 때문입니다.” 그러자 엘리가 말했습니다. “내가 부르지 않았다. 돌아가서 누워라.” 그래서 그는 돌아가서 누웠습니다.
  philosophy: optimal-equivalence
