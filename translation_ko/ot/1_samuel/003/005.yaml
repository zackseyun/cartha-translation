  lexicon: WLC
  rationale: 소환에 응답하는 관용구를 직역하되, 현대 한국어에서 자연스러운 인칭·존대 균형을 유지했습니다.
- source_word: כִּי קָרָאתָ לִּי / because you called me
  english_pob_choice: because you called me
  chosen_korean: 당신이 저를 부르셨기 때문입니다
