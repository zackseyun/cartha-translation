  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁמוּאֵ֕ל טֶ֖רֶם יָדַ֣ע אֶת יְהוָ֑ה וְ/טֶ֛רֶם יִגָּלֶ֥ה אֵלָ֖י/ו דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/007.yaml
  text: Now Samuel did not yet know Yahweh[b][a], and the word of Yahweh had not yet been revealed to him.
  footnotes:
  - marker: a
    text: Or, 'Samuel had not yet recognized the LORD'; the Hebrew 'know' can denote experiential or relational knowledge, especially in connection with divine revelation.
    reason: lexical_alternative
  - marker: b
    text: Hebrew YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 사무엘은 아직 야훼를 알지 못했고, 야훼의 말씀이 아직 그에게 드러나지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יָדַע는 관계적·경험적 앎을 뜻할 수 있으므로, 여기서는 ‘알다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 고유명 יְהוָה는 전통적으로 ‘주’로 대치되지만, 여기서는 하나님의 이름을 드러내기 위해 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמוּאֵל / Now Samuel
  english_pob_choice: Now Samuel
  chosen_korean: 사무엘은
  alternatives_korean:
  - 그리고 사무엘은
  - 그때 사무엘은
  lexicon: WLC / discourse function
  rationale: 서술적 보충 설명을 여는 התחלה의 וּ는 한국어에서 자연스러운 주제 표지로 풀어 사무엘을 제시하는 것이 가장 읽기 좋고, 서술 흐름도 유지합니다.
- source_word: טֶרֶם יָדַע
  english_pob_choice: did not yet know
  chosen_korean: 아직 ... 알지 못했고
  alternatives_korean:
  - 아직 ... 알지 못하였고
  - 아직 ... 알지 못했으며
  lexicon: HALOT
  rationale: טֶרֶם은 ‘아직’으로 풀어 미완료 상태를 드러내고, יָדַע의 관계적·경험적 앎은 단순 인지가 아니라 ‘알다’로 옮겨 자연스럽게 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: Tetragrammaton
  rationale: יהוה는 관례적 대체어가 아니라 고유명으로 처리하는 본 프로젝트 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: יִגָּלֶה אֵלָיו
  english_pob_choice: had not yet been revealed to him
  chosen_korean: 아직 그에게 나타나지 않았습니다
  alternatives_korean:
  - 아직 그에게 드러나지 않았습니다
  - 아직 그에게 계시되지 않았습니다
  lexicon: HALOT
  rationale: נפעל형 גלה는 ‘드러나다/나타나다’의 수동 의미를 가지므로, 종교적 용어로 과도하게 한정하지 않고 ‘나타나지 않았다’로 옮겨 원문의 폭을 보존했습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 여호와의 말씀
  lexicon: Biblical idiom
  rationale: 예언적 관용구인 דְּבַר יְהוָה는 한국어 성경 관용에 맞되, 본문의 인격적·계시적 성격을 살려 ‘말씀’으로 번역했습니다.
theological_decisions:
- issue: ‘알다’의 의미 범위
  chosen_reading: 사무엘이 야훼에 대한 모든 지식을 전혀 몰랐다는 뜻이 아니라, 예언적 계시를 통한 직접적 인지와 만남이 아직 없었다는 뜻으로 읽었습니다.
  alternative_readings:
  - 사무엘이 야훼를 전혀 몰랐다
  - 사무엘이 영적으로 회심하지 않았다
  rationale: 바로 뒤의 병렬구인 ‘야훼의 말씀이 아직 그에게 나타나지 않았다’가 의미를 규정하므로, 본문은 언약 공동체 내의 학습 여부가 아니라 계시적 만남의 부재를 설명합니다.
  doctrine_reference: 본문의 긴장을 보존하고, 회심/구원론적 결론을 본문 밖에서 덧씌우지 않습니다.
