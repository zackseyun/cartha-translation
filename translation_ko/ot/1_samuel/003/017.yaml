    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “그가 당신에게 한 말은 무엇입니까? 제발 그것을 저에게 숨기지 마십시오. 하나님께서 당신에게 이와 같이 하시고 그보다 더하시기를 빕니다. 그가 당신에게 한 그 모든 말 가운데 한 마디라도 저에게 숨긴다면 말입니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는, “그가 당신에게 한 모든 것 가운데 아무것도 저에게 숨기지 마십시오.”라고 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הַדָּבָר
  english_pob_choice: What is the word
