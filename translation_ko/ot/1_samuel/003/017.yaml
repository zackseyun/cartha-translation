  lexicon: HALOT
  rationale: כחד는 ‘숨기다/감추다’의 뜻이므로 직역성을 유지했고, נָא의 간청 뉘앙스를 ‘제발’로 살렸습니다.
- source_word: מִכָּל הַדָּבָר
  english_pob_choice: of all the word
  chosen_korean: 모든 말 중에서
