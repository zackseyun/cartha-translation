  rationale: 이 맹세 공식에서는 이스라엘의 하나님을 가리키므로, 다신교적 오해를 피하고 POB 기본 용례를 따랐습니다.
  doctrine_reference: 구약의 서원/맹세 공식에서의 하나님의 단수 지칭
