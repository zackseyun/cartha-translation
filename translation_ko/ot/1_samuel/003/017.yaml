  naturalness: ‘그가 당신에게 말한 말’, ‘모든 말 중에서 한 말을’은 히브리어의 반복을 반영하지만 한국어로 다소 경직됩니다. ‘그가 당신에게 한 말’ 및 ‘그 모든 말 가운데 한 마디라도’는 반복과 전체성의 강조를 보존하면서 현대 표준어로 더 자연스럽습니다. ‘당신’은 친밀한 대화에서는 다소 부자연스러울 수 있으나, 합쇼체의 명시적 2인칭을 유지하는 범위에서는 사용할 수 있습니다.
