  text: וַ/יֹּ֗אמֶר מָ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֵלֶ֔י/ךָ אַל נָ֥א תְכַחֵ֖ד מִמֶּ֑/נִּי כֹּ֣ה יַעֲשֶׂה לְּ/ךָ֤ אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף אִם תְּכַחֵ֤ד מִמֶּ֨/נִּי֙ דָּבָ֔ר מִ/כָּל הַ/דָּבָ֖ר אֲשֶׁר דִּבֶּ֥ר אֵלֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/017.yaml
  text: And he said[a], “What is the word that he spoke to you? Please do not hide it from me. May God do so to you, and more also, if you hide from me a word of all the word that he spoke to you.”
  footnotes:
  - marker: a
    text: Or, more smoothly, “if you hide from me anything of all that he spoke to you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다[a]. “그가 당신에게 말한 말이 무엇입니까? 제발 그것을 저에게 숨기지 마십시오. 당신이 저에게 그가 당신에게 말한 모든 말 중에서 한 말을 숨긴다면, 하나님이 당신에게 그렇게 하시고 그보다 더하시기를 바랍니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는, “그가 당신에게 말한 것 가운데 아무것도 저에게 숨기지 마십시오.”라고 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הַדָּבָר
  english_pob_choice: What is the word
  chosen_korean: 무슨 말입니까
  alternatives_korean:
  - 무슨 말씀입니까
  - 그 말이 무엇입니까
  - 무슨 내용입니까
  lexicon: HALOT
  rationale: דָּבָר를 ‘말’로 옮겨 앞뒤의 동일 어근 반복을 살리되, 한국어에서는 질문형으로 자연스럽게 처리했습니다.
- source_word: דִּבֶּר אֵלֶיךָ
  english_pob_choice: he spoke to you
  chosen_korean: 당신에게 말한
  alternatives_korean:
  - 당신에게 말씀하신
  - 당신에게 하신
  - 당신에게 전한
  lexicon: HALOT
  rationale: דבר의 기본 의미를 따라 ‘말한’으로 옮겨, 앞의 ‘말’과의 결속을 유지했습니다.
- source_word: אַל נָא תְכַחֵד מִמֶּנִּי
  english_pob_choice: Please do not hide it from me
  chosen_korean: 제발 그것을 저에게 숨기지 마십시오
  alternatives_korean:
  - 부디 그것을 저에게 감추지 마십시오
  - 제발 저에게 숨기지 마십시오
  - 부디 저에게 감추지 마십시오
  lexicon: HALOT
  rationale: כחד는 ‘숨기다/감추다’의 뜻이므로 직역성을 유지했고, נָא의 간청 뉘앙스를 ‘제발’로 살렸습니다.
- source_word: מִכָּל הַדָּבָר
  english_pob_choice: of all the word
  chosen_korean: 모든 말 중에서
  alternatives_korean:
  - 그 말 전체에서
  - 그가 당신에게 말한 모든 말에서
  - 온전히
  lexicon: HALOT
  rationale: 히브리어의 단수 반복을 한국어에서는 부자연스럽지 않게 ‘모든 말 중에서’로 풀어, 누락 없는 전부를 강조하는 힘을 살렸습니다.
theological_decisions:
