id: 1SA.3.2
reference: 1 Samuel 3:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/עֵלִ֖י שֹׁכֵ֣ב בִּ/מְקֹמ֑/וֹ ו/עינ/ו הֵחֵ֣לּוּ כֵה֔וֹת לֹ֥א יוּכַ֖ל לִ/רְאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/002.yaml
  text: Now on that day[a], Eli was lying down in his place, and his eyes had begun to grow dim; he could not see.
  footnotes:
  - marker: a
    text: Or, 'his eye had begun to grow dim.' The Hebrew form may be understood collectively for eyesight, hence 'his eyes' in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날[a] 엘리는 자기 자리에 누워 있었고, 그의 눈은 어두워지기 시작하여 볼 수 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 눈이 어두워지기 시작하여 볼 수 없었습니다.’ 히브리어의 ‘눈’은 단수형으로 읽힐 수 있으나, 여기서는 시력 또는 두 눈을 집합적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי / בַּיּוֹם הַהוּא
  english_pob_choice: Now on that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날 일어난 일이 이러했습니다
  - 그리고 그날에
  lexicon: WLC; HALOT
  rationale: 서사 도입의 시간표현을 자연스러운 현대 한국어로 간결하게 옮기되, 히브리어의 장면 설정 기능을 유지했습니다.
- source_word: שֹׁכֵב בִּמְקֹמוֹ
  english_pob_choice: was lying down in his place
  chosen_korean: 제자리에 누워 있었고
  alternatives_korean:
  - 자기 자리에서 누워 있었고
  - 자신의 자리에 누워 있었고
  lexicon: WLC; HALOT
  rationale: מְקוֹם을 너무 구체화하지 않고 ‘place’의 의미를 살리면서, 누워 있는 지속 상태를 한국어 시상으로 자연스럽게 표현했습니다.
- source_word: וְעֵינוֹ הֵחֵלּוּ כֵהוֹת
  english_pob_choice: his eyes had begun to grow dim
  chosen_korean: 그의 눈은 점점 어두워져
  alternatives_korean:
  - 그의 눈은 희미해지기 시작하여
  - 그의 눈은 서서히 침침해져
  lexicon: WLC; HALOT
  rationale: 히브리어의 ‘begin + become dim’ 구조를 반영하여, 단순 결과보다 진행과 약화를 함께 드러내는 표현을 택했습니다.
- source_word: לֹא יוּכַל לִרְאוֹת
  english_pob_choice: he could not see
  chosen_korean: 보기 어려웠습니다
  alternatives_korean:
  - 볼 수 없었습니다
  - 보지 못했습니다
  lexicon: WLC; HALOT
  rationale: 문맥상 실질적 시력 저하를 말하므로, 너무 절대적인 ‘볼 수 없었습니다’보다 상태를 드러내는 표현을 사용했습니다.
theological_decisions:
- issue: 엘리의 시력 감퇴를 어떻게 전달할 것인가
  chosen_reading: ‘점점 어두워져 보기 어려웠습니다’로 점진적 약화를 살렸습니다.
  alternative_readings:
  - ‘눈이 어두워져 보지 못했습니다’처럼 더 단정적으로 옮길 수 있습니다
  - ‘시력이 약해졌습니다’로 풀어쓸 수 있습니다
  rationale: 본문은 갑작스런 실명보다 점진적 쇠퇴를 말하므로, 서술의 긴장을 유지하면서도 한국어로 과장 없이 표현했습니다.
  doctrine_reference: 본문 서술의 점층적 묘사
- issue: ‘그의 눈’과 단수형 히브리어의 집합적 의미
  chosen_reading: 한국어 본문에는 ‘그의 눈’으로 옮기고, 집합적 이해는 각주로 처리하지 않았습니다.
  alternative_readings:
  - ‘그의 눈(시력)’처럼 설명적으로 옮길 수 있습니다
  - 각주로 ‘눈’이 시력을 가리키는 집합적 표현임을 밝힐 수 있습니다
  rationale: 영어 POB가 이미 집합적 가능성을 각주로 처리하지만, 한국어 문장 자체는 자연스럽고 오해 가능성이 낮아 본문에 반영하되 각주는 두지 않았습니다.
  doctrine_reference: 히브리어 집합적 용법
