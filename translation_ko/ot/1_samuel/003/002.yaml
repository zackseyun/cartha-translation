  naturalness: ‘그날에’도 이해되지만, 현대 서사 한국어에서는 ‘그날’이 더 자연스럽습니다. ‘자기 자리에 누워 있었고’는 장소를 과도하게 특정하지 않으면서 자연스럽습니다.
