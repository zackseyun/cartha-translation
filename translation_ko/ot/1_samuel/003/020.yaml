base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/020.yaml
  text: And all Israel from Dan to Beer-sheba knew that Samuel was established as a prophet of Yahweh[a].
  footnotes:
  - marker: a
    text: Or 'established as a prophet of the LORD.' The Hebrew term can convey being shown reliable, established, or confirmed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 단에서 브엘세바까지 온 이스라엘은 사무엘이 야훼의 예언자로 인정받게 되었다는 것을 알게 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 예언자로 확립되었다.’ 히브리어는 신뢰할 만한 사람으로 드러남, 확립됨, 확증됨을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  english_pob_choice: knew
  chosen_korean: 알게 되었습니다
  alternatives_korean:
  - 알았습니다
  - 인지하게 되었습니다
  lexicon: HALOT
  rationale: ידע의 서술적 결과를 한국어로 자연스럽게 옮기되, 단순한 인지보다 공개적으로 확인된 사실을 알게 된 뉘앙스를 살렸습니다.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  english_pob_choice: from Dan to Beer-sheba
  chosen_korean: 단에서부터 브엘세바까지
  alternatives_korean:
  - 단에서 브엘세바까지
  - 단에서부터 베르세바까지
  lexicon: HALOT
  rationale: 이스라엘 전체를 가리키는 관용적 총칭을 지명 그대로 보존해, 지리적 범위를 지우지 않았습니다.
- source_word: נֶאֱמָן
  english_pob_choice: confirmed
  chosen_korean: 확증되었다
  alternatives_korean:
  - 확인되었다
  - 입증되었다
  - 확립되었다
  lexicon: HALOT
  rationale: נֶאֱמָן의 ‘신뢰할 만함’과 ‘공적으로 입증됨’의 중첩 의미를 반영해, 사무엘의 예언자 직분이 야훼의 말씀 성취로 공적으로 입증되었다는 뜻을 살렸습니다.
- source_word: לְנָבִיא לַיהוָה
  english_pob_choice: as a prophet of Yahweh
  chosen_korean: 야훼의 예언자로
  alternatives_korean:
  - 야훼께 속한 예언자로
  - 야훼의 선지자로
  lexicon: HALOT
  rationale: לְנָבִיא는 직분/지위를 나타내므로 ‘예언자로’로 옮겼고, לַיהוָה는 소속과 위임 관계를 직접 드러내는 ‘야훼의’로 처리했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 나타나는 신명사 טetragrammaton을 보존하기 위해, 본문에서는 전통 교회어인 ‘주님’ 대신 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: נֶאֱמָן의 의미 범위
  chosen_reading: 확증되었다
  alternative_readings:
  - 신실하였다
  - 확립되었다
  - 확인되었다
  rationale: 이 구절은 사무엘의 인격적 신실성보다 그의 예언자적 신분이 앞서 말한 성취를 통해 공적으로 참됨이 드러났다는 점을 강조하므로, ‘확증되었다’가 문맥의 신학적 힘을 가장 잘 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §6
