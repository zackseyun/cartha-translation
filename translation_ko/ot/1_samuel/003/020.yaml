  source_fidelity: 원문의 וַיֵּדַע, ‘온 이스라엘’, ‘단에서 브엘세바까지’, 그리고 사무엘이 야훼의 예언자로 공적으로 인정·확립되었다는 진술을 충실히 반영합니다. נֶאֱמָן은 인격적 ‘신실함’으로 단정하지 않고 예언자적 지위가 확립되었음을 나타내도록 옮기는 것이 문맥에 가장 알맞습니다.
