  source_fidelity: 본문의 ‘모든 말’과 ‘아무것도 숨기지 않음’은 충실히 옮겼습니다. 그러나 יַעֲשֶׂה는 3인칭 형태인데, 초안의 ‘하십시오’는 야훼께 직접 명령하는 2인칭 표현이 되어 문법적 관점이 바뀝니다. 또한 두 각주 표지가 해당 설명 대상과 서로 맞지 않습니다.
  naturalness: ‘야훼이십니다’는 가능하지만, ‘그분은 야훼이십니다’가 히브리어의 강조된 대명사를 드러내면서 현대 한국어 직접 화법으로도 더 자연스럽습니다. ‘그분이 보시기에 좋은 대로 하시기를 바랍니다’는 3인칭의 수용적·기원적 표현으로 자연스럽습니다.
  terminology: 신명은 프로젝트 방침에 따라 ‘야훼’로 유지합니다. ‘보시기에 좋은 대로’는 בְּעֵינָיו의 판단·평가 관용 의미를 자연스럽게 반영합니다.
