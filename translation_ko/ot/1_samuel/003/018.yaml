  text: וַ/יַּגֶּד ל֤/וֹ שְׁמוּאֵל֙ אֶת כָּל הַ/דְּבָרִ֔ים וְ/לֹ֥א כִחֵ֖ד מִמֶּ֑/נּוּ וַ/יֹּאמַ֕ר יְהוָ֣ה ה֔וּא הַ/טּ֥וֹב בְּ/עֵינָ֖/ו יַעֲשֶֽׂה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/018.yaml
  text: So Samuel told him all the words and hid nothing from him[a]. And he said, “He is Yahweh[b]; let him do what is good in his eyes.”
  footnotes:
  - marker: a
    text: Or, 'he will do what is good in his eyes.' The Hebrew imperfect may be understood as either a submissive wish ('let him do') or a simple future.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'in his eyes,' an idiom meaning according to his own judgment or what seems good to him.
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘이 그에게 모든 말을 전하고 한마디도 숨기지 않았습니다[a]. 그러자 그는 말했습니다. 「야훼이십니다[b]. 그분이 보시기에 좋은 대로 하십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 미완료형은 “그분이 보시기에 좋은 일을 하실 것입니다”라는 단순 미래로도, “그분이 보시기에 좋은 대로 하십시오”라는 순종적 허용으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 “그의 눈에”로, 여기서는 ‘판단하기에’ 또는 ‘보시기에’라는 뜻의 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד / אֶת כָּל הַדְּבָרִים
  english_pob_choice: told him all the words
  chosen_korean: 그에게 모든 말을 전하고
  alternatives_korean:
  - 그에게 모든 것을 말하고
  - 그에게 모든 말씀을 전하고
  lexicon: HALOT
  rationale: נגד의 사역형은 ‘전하다/알리다’가 자연스럽고, כָּל־הַדְּבָרִים는 문자적으로 ‘모든 말들’이므로 ‘모든 말’을 살려 전체 내용을 빠짐없이 알렸다는 뜻을 드러냈습니다.
- source_word: וְלֹא כִחֵד מִמֶּנּוּ
  english_pob_choice: hid nothing from him
  chosen_korean: 한마디도 숨기지 않았습니다
  alternatives_korean:
  - 그에게 아무것도 감추지 않았습니다
  - 그에게 전혀 숨긴 것이 없었습니다
  lexicon: HALOT
  rationale: כחד의 ‘감추다/숨기다’ 의미를 그대로 살리되, 한국어에서는 ‘한마디도 숨기지 않았다’가 문맥상 완전한 공개를 가장 자연스럽게 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼이십니다
  alternatives_korean:
  - 야훼입니다
  - 여호와이십니다
  lexicon: HALOT
  rationale: 본문의 신성명은 관례적 대체칭호 대신 ‘야훼’로 옮기며, 직설화법 안에서는 존대 종결을 사용해 화자가 야훼의 주권을 인정하는 태도를 살렸습니다.
- source_word: בְּעֵינָיו
  english_pob_choice: in his eyes
  chosen_korean: 그분이 보시기에 좋은 대로
  alternatives_korean:
  - 그의 눈에 좋은 것을
  - 그가 보시기에 좋은 일을
  lexicon: HALOT
  rationale: ‘그의 눈에’라는 히브리어 관용구를 한국어로는 ‘보시기에’로 풀어, 단순 시각이 아니라 판단과 기호의 의미를 유지했습니다.
theological_decisions:
- issue: יְהוָה의 번역과 직접 화법의 존대
  chosen_reading: 야훼이십니다
  alternative_readings:
  - 야훼입니다
  - 주님이십니다
  rationale: 이 절은 하나님의 이름을 직접 언급하며, 엘리의 응답은 하나님 앞의 수용과 경외를 드러냅니다. 그래서 이름은 ‘야훼’로 유지하고, 직접 화법에서는 존대형을 적용했습니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה/YHWH → 야훼
- issue: יַעֲשֶׂה의 뉘앙스
  chosen_reading: 그분이 보시기에 좋은 대로 하십시오
  alternative_readings:
  - 그분이 보시기에 좋은 일을 하실 것입니다
  - 그분이 보시기에 좋은 대로 하게 하십시오
  rationale: 히브리어 미완료형은 맥락상 순종적 허용/체념의 뜻이 가능하므로, 미래형으로 단정하지 않고 ‘하십시오’로 수용의 태도를 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
