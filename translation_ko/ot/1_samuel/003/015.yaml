id: 1SA.3.15
reference: 1 Samuel 3:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב שְׁמוּאֵל֙ עַד הַ/בֹּ֔קֶר וַ/יִּפְתַּ֖ח אֶת דַּלְת֣וֹת בֵּית יְהוָ֑ה וּ/שְׁמוּאֵ֣ל יָרֵ֔א מֵ/הַגִּ֥יד אֶת הַ/מַּרְאָ֖ה אֶל עֵלִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/015.yaml
  text: Samuel lay down until morning; then he opened the doors of the house of Yahweh[a]. But Samuel was afraid to tell the vision to Eli.
  footnotes:
  - marker: a
    text: Or 'the appearance'; Hebrew mar'ah can denote an appearance or a visionary revelation. Here 'vision' best fits the context of Samuel's nighttime revelation.
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘은 아침까지 누워 있었고, 그다음에 야훼의 집의 문들을 열었습니다. 그러나 사무엘은 그 환상을 엘리에게 말하기를 두려워했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나타남’. 히브리어 mar'ah는 ‘보임/나타남’ 또는 환시적 계시를 뜻할 수 있으나, 여기서는 문맥상 ‘환상’이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עַד הַבֹּקֶר
  english_pob_choice: lay down until morning
  chosen_korean: 아침까지 누워 있었고
  alternatives_korean:
  - 아침까지 잤고
  - 아침까지 누워 있었으며
  lexicon: HALOT
  rationale: 히브리어는 ‘누워 있다’는 동작을 말하며, 본문은 그가 실제로 잤다고까지 말하지 않으므로 ‘누워 있었고’로 옮겨 과도한 해석을 피했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 주님의 집
  - 여호와의 집
  lexicon: HALOT
  rationale: תיקון 없이 고유명사 יְהוָה를 그대로 반영해 프로젝트 기본값인 ‘야훼’를 사용했습니다. ‘집’은 성막/성소 맥락을 일반적으로 살리는 직접 번역입니다.
- source_word: דַּלְתוֹת
  english_pob_choice: the doors
  chosen_korean: 문들을
  alternatives_korean:
  - 문짝들을
  - 출입문들을
  lexicon: HALOT
  rationale: 복수형을 살리되 한국어에서는 자연스럽게 ‘문들’로 옮겼습니다. 문짝이라는 해부학적 표현은 지나치게 세분화되어 본문 흐름을 흐릴 수 있습니다.
- source_word: הַמַּרְאָה
  english_pob_choice: the vision
  chosen_korean: 그 환상
  alternatives_korean:
  - 그 비전
  - 그 나타남
  lexicon: HALOT
  rationale: 이 문맥의 מראה는 단순한 ‘보임’보다 계시적 경험을 가리키므로 ‘환상’이 한국어에서 가장 직접적입니다. 다만 ‘환상’은 실제 계시의 내용을 뜻하는 것으로 이해해야 합니다.
- source_word: מֵהַגִּיד אֶת ...
  english_pob_choice: afraid to tell
  chosen_korean: 말하기를 두려워했습니다
  alternatives_korean:
  - 전하기를 두려워했습니다
  - 알리기를 두려워했습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘~하는 것을 두려워하다’ 구조를 자연스러운 한국어로 재구성했습니다. ‘말하다’는 엘리에게 해당 내용을 전달하는 행위를 직접 드러냅니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 직접 יְהוָה를 사용하므로, 프로젝트 기본 원칙에 따라 ‘야훼’를 유지했습니다. 이는 대체 호칭보다 स्रोत의 고유 신명성을 더 분명히 드러냅니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
