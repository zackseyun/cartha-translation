lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
  - 불렀습니다
  - 소리내어 불렀습니다
  - 불러서
  lexicon: HALOT
  rationale: 서사 문맥에서 קרא는 단순한 호명으로 자연스러우므로, 과도하게 해석하지 않고 ‘불러’로 옮겼습니다.
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이르렀습니다
  - 말하였습니다
  - 이야기했습니다
  lexicon: HALOT
  rationale: 히브리어 אמר의 기본 서사 동사를 현대 한국어의 자연스러운 합쇼체인 ‘말했습니다’로 대응했습니다.
- source_word: שְׁמוּאֵל בְּנִי
  english_pob_choice: Samuel, my son
  chosen_korean: 사무엘아, 내 아들아
  alternatives_korean:
  - 사무엘, 내 아들
  - 사무엘아, 아들아
  - 사무엘, 내 아들아
  lexicon: HALOT
  rationale: 직접 부름의 호격을 살리기 위해 ‘사무엘아’로 처리했고, בְּנִי의 친근한 호칭은 ‘내 아들아’로 옮겼습니다.
- source_word: הִנֵּנִי
  english_pob_choice: Here I am
  chosen_korean: 제가 여기 있습니다
  alternatives_korean:
  - 여기 있습니다
  - 저 여기 있어요
  - 제가 있습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 응답성과 대기 상태를 살리되, 한국어에서 더 자연스럽고 공손한 응답으로 ‘제가 여기 있습니다’로 옮겼습니다.
theological_decisions:
- issue: 대화체의 존대 수준
  chosen_reading: 서술은 합쇼체를 유지하되, 사무엘의 응답도 서사 문맥에 맞는 공손한 일반 높임말로 옮겼습니다.
  alternative_readings:
  - 사무엘의 말을 평서형으로 낮춤
  - ‘예, 여기 있습니다’와 같은 응답으로 축약
  rationale: 이 절은 신학적 긴장보다 인물 간 호명과 응답의 장면성이 핵심이므로, 본문 의미를 해치지 않는 범위에서 한국어 서술 관습에 맞춘 존대체를 택했습니다.
  doctrine_reference: Narrative pragmatics and direct-speech register
