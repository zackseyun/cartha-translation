base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/012.yaml
  text: And the men of the garrison answered Jonathan and his armor-bearer and said[a], “Come up to us, and we will tell you something.” Then Jonathan said to his armor-bearer, “Come up after me[d][c][b], for Yahweh has given them into the hand of Israel.”
  footnotes:
  - marker: a
    text: Or, “the men of the outpost.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew, “we will make known to you a thing.”
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew idiom: “has given them into the hand of Israel,” that is, into Israel’s power.'
    reason: lexical_alternative
  - marker: d
    text: Or 'answered Jonathan and his armor-bearer and said'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리하여 요나단과 그의 무기 든 자에게 주둔지의 사람들이 대답하며 말했습니다[a]. 「우리에게 올라오너라. 그러면 너희에게 한마디 알려 주겠다[b].」 그때 요나단이 그의 무기 든 자에게 말했습니다. 「내 뒤를 따라 올라오너라. 야훼께서 그들을 이스라엘의 손에 넘기셨기 때문이다[c].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주둔지의 사람들”.
    reason: alternative_reading
  - marker: b
    text: '히브리어: “너희에게 한 말을 알게 하겠다”의 뜻입니다.'
    reason: lexical_alternative
  - marker: c
    text: 히브리어 관용구로, “이스라엘의 권세 아래 넘기셨기 때문이다”라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: אַנְשֵׁי הַמַּצָּבָה
  english_pob_choice: the men of the garrison
  chosen_korean: 주둔지의 사람들
  alternatives_korean:
  - 보초소의 사람들
  - 주둔대의 사람들
  lexicon: HALOT
  rationale: 군사적으로 배치된 거점을 가리키므로, 문맥상 '주둔지'가 가장 자연스럽고 '사람들'로 집합적 주체를 살렸습니다.
- source_word: נֹשֵׂא כֵלָיו
  english_pob_choice: his armor-bearer
  chosen_korean: 그의 무기 든 자
  alternatives_korean:
  - 그의 갑옷 든 자
  - 그의 무기 حامل
  lexicon: HALOT
  rationale: 히브리어 직역인 '장비/무기를 드는 자'를 살리면서도 한국어에서 이해되는 군사적 표현으로 옮겼습니다. '갑옷 든 자'는 의미가 좁아집니다.
- source_word: וְנוֹדִיעָה אֶתְכֶם דָּבָר
  english_pob_choice: we will tell you something
  chosen_korean: 너희에게 한마디 알려 주겠다
  alternatives_korean:
  - 너희에게 무엇인가 말해 주겠다
  - 너희에게 한 가지를 알려 주겠다
  lexicon: HALOT
  rationale: ידע의 히필인 '알리다/알게 하다'를 반영했고, דָּבָר의 일부러 모호한 뉘앙스를 '한마디'로 간결하게 살렸습니다.
- source_word: עֲלֵה אַחֲרַי
  english_pob_choice: Come up after me
  chosen_korean: 내 뒤를 따라 올라오너라
  alternatives_korean:
  - 나를 따라 올라오너라
  - 내 뒤에 올라오너라
  lexicon: HALOT
  rationale: 상대가 한 사람임을 드러내는 명령형이고, '뒤를 따라'로 순차적 추종과 상향 이동을 함께 반영했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 표기를 관례적 대체어가 아닌 고유명 '야훼'로 옮겨, 원문이 가진 인칭성과 언약명칭을 보존했습니다.
- source_word: בְּיַד יִשְׂרָאֵל
  english_pob_choice: into the hand of Israel
  chosen_korean: 이스라엘의 손에
  alternatives_korean:
  - 이스라엘의 권세 아래
  - 이스라엘의 힘에
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려, '넘기셨다'와 함께 전쟁 승패의 주권적 이양을 드러냈습니다.
theological_decisions:
