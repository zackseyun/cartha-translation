translation:
  language: ko
  text: 사울의 보초병들이 베냐민의 기브아에서 바라보니, 그런데 그 무리가 녹아 흩어지고 치고 또 치고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘녹아 흩어지고’는 히브리어의 ‘녹다’라는 비유적 표현을 옮긴 것입니다. 마지막 표현은 문자적으로는 ‘가며 치고 있었다’에 가까우며, 동사 ‘치다’를 거듭하여 계속된 혼란과 타격을 나타냅니다.
    reason: lexical_alternative
