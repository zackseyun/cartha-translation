- from: 사울의 보초병들이 베냐민의 기브아에서 바라보니, 보라, 무리가 녹아 없어지고 있었고, 이쪽저쪽으로 흩어지고 있었습니다.[a]
  to: 사울의 보초병들이 베냐민의 기브아에서 바라보니, 그런데 그 무리가 녹아 흩어지고 치고 또 치고 있었습니다.[a]
