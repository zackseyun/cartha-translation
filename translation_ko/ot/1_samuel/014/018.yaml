  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ לַֽ/אֲחִיָּ֔ה הַגִּ֖ישָׁ/ה אֲר֣וֹן הָ/אֱלֹהִ֑ים כִּֽי הָיָ֞ה אֲר֧וֹן הָ/אֱלֹהִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא וּ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/018.yaml
  text: Then Saul said to Ahijah[b][a], “Bring the ark of God here,” for the ark of God was that day with the sons of Israel.
  footnotes:
  - marker: a
    text: Some textual traditions and interpreters read “Bring the ephod” instead of “Bring the ark of God.” The Hebrew text here reads “ark of God.”
    reason: textual_variant
  - marker: b
    text: Or 'was there that day with the sons of Israel'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 사울이 아히야에게 말했습니다. “하나님의 궤를 이리 가져오십시오.” 그날 하나님의 궤가 이스라엘 자손과 함께 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 본문 전승과 해석자들은 여기서 ‘하나님의 궤’ 대신 ‘에봇’으로 읽습니다. 제시된 히브리어 본문은 ‘하나님의 궤’로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그가 ... 말했습니다
  lexicon: WLC narrative waw-consecutive
  rationale: 서술의 진행을 자연스럽게 이어 주되, 원문의 사건 전개를 유지하기 위해 과거 서술로 옮겼습니다.
- source_word: הַגִּישָׁה
  english_pob_choice: Bring ... here
  chosen_korean: 이리 가져오라
  alternatives_korean:
  - 가져오라
  - 가까이 가져오라
  lexicon: HALOT
  rationale: 명령형의 ‘가까이 오게 하다’ 의미를 한국어에서 직접적이고 자연스럽게 드러내기 위해 ‘이리 가져오라’로 옮겼습니다.
- source_word: אֲרוֹן הָאֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 궤
  alternatives_korean:
  - 하나님의 언약궤
  - 하나님의 법궤
  lexicon: HALOT
  rationale: 원문은 단순히 ‘하나님의 궤’라고 하므로, 다른 문맥에서 익숙한 ‘언약궤’나 전통적 ‘법궤’를 덧붙이지 않고 원문 표현을 따랐습니다.
- source_word: וּבְנֵי יִשְׂרָאֵל
  english_pob_choice: with the sons of Israel
  chosen_korean: 이스라엘 자손과 함께
  alternatives_korean:
  - 이스라엘 사람들 가운데
  - 이스라엘 자손 가운데
  lexicon: HALOT
  rationale: 히브리어의 집합명사 표현을 그대로 살리면서, 한국어에서는 ‘과 함께’가 동반 상황을 가장 자연스럽게 나타냅니다.
theological_decisions:
- issue: 본문의 ‘하나님의 궤’와 일부 전승의 ‘에봇’ 이문 처리
  chosen_reading: 본문은 ‘하나님의 궤’로 유지했습니다.
  alternative_readings:
  - ‘에봇’
  rationale: 제시된 히브리어 본문이 두 차례 모두 ‘하나님의 궤’를 읽으므로 본문은 이를 따르고, 다른 전승은 본문 밖 주석으로만 남기는 것이 원문 우선 원칙에 부합합니다.
  doctrine_reference: 본문 우선 원칙; 이문은 주석으로 보존
