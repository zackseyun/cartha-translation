  source_fidelity: 전반적으로 히브리어 본문을 충실히 반영합니다. ‘피째 먹음으로써’는 לֶאֱכֹל עַל־הַדָּם의 관용적 의미를 자연스럽게 드러내며, 각주가 문자적 표현과 그 의미를 보완합니다. בְּגַדְתֶּם은 단순한 개인적 ‘배신’보다 신의·충실성을 저버린 행위를 가리키므로 이를 더 정확히 반영했습니다.
  naturalness: ‘사울에게 알려서 말했습니다’는 ‘알리다’와 ‘말하다’가 중복되어 현대 한국어 서술로 다소 부자연스럽습니다. ‘사울에게 이렇게 알렸습니다’가 보고와 인용을 자연스럽게 연결합니다. 합쇼체도 일관되게 유지됩니다.
  terminology: 야훼 표기는 프로젝트 방침 및 원문의 신명과 일치합니다. ‘백성’, ‘죄를 짓다’, ‘큰 돌을 … 굴려 오십시오’도 적절합니다. בגד의 언약적·윤리적 불성실을 ‘신의를 저버렸습니다’로 옮겨 한국어의 ‘배신’이 불필요하게 개인적 배반으로 좁혀지는 것을 피했습니다.
