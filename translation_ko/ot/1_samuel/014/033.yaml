id: 1SA.14.33
reference: 1 Samuel 14:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּגִּ֤ידוּ לְ/שָׁאוּל֙ לֵ/אמֹ֔ר הִנֵּ֥ה הָ/עָ֛ם חֹטִ֥אים לַֽ/יהוָ֖ה לֶ/אֱכֹ֣ל עַל הַ/דָּ֑ם וַ/יֹּ֣אמֶר בְּגַדְתֶּ֔ם גֹּֽלּוּ אֵלַ֥/י הַ/יּ֖וֹם אֶ֥בֶן גְּדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/033.yaml
  text: Then they told Saul[a], saying, “Look, the people are sinning against Yahweh by eating over the blood.” And he said, “You have acted treacherously. Roll a large stone to me today.”
  footnotes:
  - marker: a
    text: Or, more explicitly, “by eating meat with the blood still in it.” The Hebrew literally says “by eating on/with the blood,” an idiom for consuming meat without properly draining the blood.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 사울에게 알려서 말했습니다. 「보십시오, 백성이 고기를 피째 먹음으로써 야훼께 죄를 짓고 있습니다.」 그러자 그가 말했습니다. 「너희가 배신하였습니다. 오늘 큰 돌을 내게로 굴려 오십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 풀어 쓰면 “피를 제대로 빼지 않은 고기를 먹음으로써”입니다. 히브리어는 문자적으로 “피 위/와 함께 먹다”라고 하며, 고기의 피를 제대로 빼지 않고 먹는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּידוּ
  english_pob_choice: Then they told
  chosen_korean: 그들은 … 알려서 말했습니다
  alternatives_korean:
  - 그들은 … 말했습니다
  - 그들은 … 보고했습니다
  lexicon: HALOT
  rationale: 서술 흐름을 살리면서 גם ‘알리다’의 보고 성격을 담아, 단순한 대화 전달보다 정보 전달의 뉘앙스를 유지했습니다.
- source_word: חֹטִאים לַֽ/יהוָה
  english_pob_choice: are sinning against Yahweh
  chosen_korean: 야훼께 죄를 짓고 있습니다
  alternatives_korean:
  - 야훼를 거슬러 죄를 짓고 있습니다
  - 야훼께 죄를 범하고 있습니다
  lexicon: HALOT
  rationale: ל가 가리키는 향방을 한국어에서는 ‘~께 죄를 짓다’로 자연스럽게 옮겨, 관계적 위반의 뜻을 분명히 했습니다.
- source_word: לֶ/אֱכֹ֣ל עַל הַ/דָּם
  english_pob_choice: by eating over the blood
  chosen_korean: 고기를 피째 먹음으로써
  alternatives_korean:
  - 피 위에서 먹음으로써
  - 피와 함께 먹음으로써
  - 피를 제대로 빼지 않고 먹음으로써
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역만 하면 한국어가 어색해지므로, POB의 주석적 대안에 맞춰 ‘피째 먹다’로 풀어 의미를 드러냈습니다.
- source_word: בְּגַדְתֶּם
  english_pob_choice: You have acted treacherously
  chosen_korean: 너희가 배신하였습니다
  alternatives_korean:
  - 너희가 배신적으로 행동하였습니다
  - 너희가 불성실하였습니다
  - 너희가 불의하게 굴었습니다
  lexicon: HALOT
  rationale: בגד의 강한 언약적 배신/불충성의 의미를 살려, 완곡한 ‘잘못했습니다’보다 ‘배신하였습니다’를 택했습니다.
- source_word: גֹּלּוּ אֵלַי
  english_pob_choice: Roll a large stone to me
  chosen_korean: 큰 돌을 내게로 굴려 오십시오
  alternatives_korean:
  - 큰 돌을 내게 굴리십시오
  - 큰 돌을 내게로 옮겨 오십시오
  lexicon: HALOT
  rationale: 글자대로 ‘굴리다’를 살리되, 목적지 방향을 ‘내게로’로 풀어 명령의 동작과 도착점을 분명히 했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기적 금지 위반을 하나님의 언약 이름과 직접 연결하므로, 프로젝트 기본값대로 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
