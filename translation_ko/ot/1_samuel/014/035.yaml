  text: And Saul built an altar to Yahweh[a]; this was the first altar he built to Yahweh.
  footnotes:
  - marker: a
    text: Or, more literally, 'he began to build it as an altar to the LORD.' The Hebrew idiom is commonly understood to mean that this was Saul's first altar to the LORD.
    reason: alternative_reading
translation:
  language: ko
  text: 사울이 야훼께 제단을 쌓았습니다. 이것은 그가 야훼께 쌓은 첫 번째 제단이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘그것을 제단으로 쌓기 시작했다’에 가깝지만, 문맥상 ‘사울이 야훼께 쌓은 첫 번째 제단’이라는 뜻으로 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: built
  chosen_korean: 쌓았습니다
  alternatives_korean:
  - 지었습니다
  - 만들었습니다
  lexicon: HALOT
  rationale: מִזְבֵּחַ를 한국어로 자연스럽게 옮길 때는 ‘제단을 쌓다’가 가장 관용적이며, 단순한 건축보다 제의적 행위를 잘 드러냅니다.
- source_word: מִזְבֵּחַ
  english_pob_choice: altar
  chosen_korean: 제단
  alternatives_korean:
  - 단
  - 제대
  lexicon: HALOT
  rationale: 히브리어 מזבח의 표준 대응어로 ‘제단’이 가장 정확하며, 제사/예배 맥락도 분명하게 전달합니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼에게
  - 주님께
  lexicon: HALOT
  rationale: יהוה는 본문 기준으로 고유한 신명이며, 한국어에서는 여격 표지 ‘-께’를 붙여 헌정의 방향을 자연스럽게 표현했습니다.
- source_word: אֹתוֹ הֵחֵל לִבְנוֹת
  english_pob_choice: this was the first altar he built
  chosen_korean: 이것은 그가 야훼께 쌓은 첫 번째 제단이었습니다
  alternatives_korean:
  - 그가 야훼께 쌓기 시작한 제단이었습니다
  - 그가 야훼께 처음으로 쌓은 제단이었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순히 ‘쌓기 시작하다’보다 ‘첫 번째 제단’이라는 의미로 이해되는 것이 문맥상 더 자연스럽고, 한국어에서도 그 의미를 명확히 드러냈습니다.
theological_decisions:
