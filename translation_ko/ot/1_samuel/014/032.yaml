id: 1SA.14.32
reference: 1 Samuel 14:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/יעש הָ/עָם֙ אֶל שלל וַ/יִּקְח֨וּ צֹ֧אן וּ/בָקָ֛ר וּ/בְנֵ֥י בָקָ֖ר וַ/יִּשְׁחֲטוּ אָ֑רְצָ/ה וַ/יֹּ֥אכַל הָ/עָ֖ם עַל הַ/דָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/032.yaml
  text: Then the people rushed upon the spoil and took sheep and cattle and calves[a], and they slaughtered them on the ground[b], and the people ate with the blood.
  footnotes:
  - marker: a
    text: Or 'the people fell upon the plunder.'
    reason: lexical_alternative
  - marker: b
    text: That is, they ate the meat with the blood still in it, without properly draining it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 백성이 노략물에 달려가 양과 소와 송아지를 가져다가 땅에서 잡아 죽이고, 피째로 먹었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성이 노략물에 달려들었다’.
    reason: alternative_reading
  - marker: b
    text: 곧 피를 제대로 빼지 않은 채 고기를 먹었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶל שָׁלָל
  english_pob_choice: rushed upon the spoil
  chosen_korean: 노략물에 달려가
  alternatives_korean:
  - 노략물에 몰려가
  - 전리품에 달려들어
  - 노략물로 달려가
  lexicon: HALOT
  rationale: גע하다/향하다의 단순 방향보다, 전투 직후 굶주린 백성이 통제 없이 몰려든 뉘앙스를 살리기 위해 동적 표현인 ‘달려가’를 택했습니다.
- source_word: שָׁלָל
  english_pob_choice: spoil
  chosen_korean: 노략물
  alternatives_korean:
  - 전리품
  - 노획물
  lexicon: HALOT
  rationale: 군사적 맥락에서 ‘spoil’의 의미를 살리면서, 현대 한국어에서 자연스럽고 중립적인 표현으로 ‘노략물’을 사용했습니다.
- source_word: בְּנֵי בָקָר
  english_pob_choice: calves
  chosen_korean: 송아지
  alternatives_korean:
  - 어린 소
  - 새끼 소
  lexicon: HALOT
  rationale: 직역하면 ‘소의 아들들’이지만 한국어에서는 이 관용을 그대로 옮기기보다 동물 목록 속에서 자연스러운 표준어인 ‘송아지’가 가장 적절합니다.
- source_word: עַל־הַדָּם
  english_pob_choice: with the blood
  chosen_korean: 피째로
  alternatives_korean:
  - 피와 함께
  - 피를 뺀 뒤가 아니라
  lexicon: HALOT
  rationale: 히브리어는 짧지만 금지의 핵심은 피를 제대로 빼지 않은 채 먹었다는 점이므로, 본문에는 간결하게 ‘피째로’라고 하고 의미는 주석 없이도 드러나게 했습니다.
theological_decisions:
- issue: 피를 먹는 행위를 어떻게 드러낼지
  chosen_reading: 본문은 ‘피째로 먹었습니다’라고 하여 금기 위반을 분명히 드러내되, 설명을 본문 안에 과도하게 덧붙이지 않았습니다.
  alternative_readings:
  - 피와 함께 먹었습니다
  - 피가 그대로 있는 채로 먹었습니다
  rationale: 히브리어의 긴장과 위반성을 유지해야 하므로, 의미를 완전히 풀어쓴 해설형 표현보다 간결하지만 강한 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
