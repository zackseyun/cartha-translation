revisions:
- from: 그 백성이 노략물에 달려가 양과 소와 송아지를 가져다가 땅에서 잡아 죽이고, 피째로 먹었습니다.[a][b]
  to: 그 백성은 전리품에 달려들어[a] 양과 소와 송아지를 가져다가 땅 위에서 잡아 죽이고, 피와 함께 먹었습니다.[b]
  rationale: 수정문은 전쟁 노획물에 급히 몰려든 상황과 동물 목록을 보존하면서, 도살 장소를 자연스러운 한국어로 명시했습니다. ‘피와 함께’는 원문의 압축된 표현을 유지하고, 구체적인 식사 방식은 각주에서 설명합니다. 각주 a는 해당 동작구 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:17:58Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 동작(전리품에 급히 달려듦), 동물 목록, 땅 위에서의 도살, 그리고 피와 함께 먹은 행위를 대체로 충실히 옮겼습니다. 다만 ‘땅에서 잡아 죽이고’는 אָרְצָה의 장소 의미를 자연스럽게 드러내지 못하므로 ‘땅 위에서’가 더 정확합니다.
  naturalness: ‘노략물’은 현대 표준어 성경 문체에서 다소 어색하고, ‘전리품’이 더 자연스럽습니다. 또한 대안 읽기를 설명하는 주석 표지는 해당 절 앞부분에 직접 붙이는 편이 명확합니다.
  terminology: ‘전리품’은 שָׁלָל의 전쟁 맥락을 자연스럽게 보존합니다. עַל־הַדָּם은 해석을 본문에 과도하게 넣지 않고 ‘피와 함께’로 옮기며, 피를 빼지 않았다는 설명은 주석으로 유지하는 것이 원문의 간결성과 모호성 보존에 더 적절합니다.
  issues:
  - severity: medium
    issue: ‘땅에서 잡아 죽이고’의 장소 표현
    rationale: אָ֑רְצָה는 도살이 이루어진 장소를 가리키므로, 한국어에서는 ‘땅 위에서 잡아 죽이고’가 더 자연스럽고 정확합니다.
  - severity: low
    issue: ‘노략물’의 현대적 자연스러움
    rationale: 의미는 가능하나 현대 한국어에서는 ‘전리품’이 더 일반적이며 군사적 맥락도 명확히 전달합니다.
  - severity: low
    issue: 각주 a의 표지 위치와 대안 표현
    rationale: 대안은 첫 동작구에 관한 것이므로 그 구 뒤에 표지를 두어야 합니다. ‘전리품으로 몰려갔다’는 주동사의 다른 뉘앙스를 무리 없이 제시합니다.
  - severity: low
    issue: ‘피째로’의 의미 범위
    rationale: 자연스러운 표현이지만 피 자체를 음식의 일부로 삼았다는 뜻으로 다소 강하게 들릴 수 있습니다. ‘피와 함께’는 עַל־הַדָּם의 간결한 표현을 더 직접 보존하며 상세한 설명은 각주에 둘 수 있습니다.
