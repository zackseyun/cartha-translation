source:
  edition: WLC
  text: וַ/יִּגָּל֣וּ שְׁנֵי/הֶ֔ם אֶל מַצַּ֖ב פְּלִשְׁתִּ֑ים וַ/יֹּאמְר֣וּ פְלִשְׁתִּ֔ים הִנֵּ֤ה עִבְרִים֙ יֹֽצְאִ֔ים מִן הַ/חֹרִ֖ים אֲשֶׁ֥ר הִתְחַבְּאוּ שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/011.yaml
  text: When the two of them revealed themselves to the Philistine garrison[a], the Philistines said, “Look[b], the Hebrews are coming out of the holes where they had hidden themselves.”
  footnotes:
  - marker: a
    text: Or “showed themselves to the Philistine outpost.”
    reason: lexical_alternative
  - marker: b
    text: “Hebrews” reflects the Philistines’ ethnic label for the Israelites.
    reason: cultural_note
translation:
  language: ko
  text: 그 두 사람이 블레셋 주둔군에게 자신들을 드러내자, 블레셋 사람들이 말했습니다. “보십시오, 히브리인들이 자신들이 숨어 있던 구멍들에서 나오고 있습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주둔군’은 군사적으로 배치된 부대를 뜻하는 말입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘히브리인들’은 블레셋 사람들이 이스라엘 사람들을 가리키는 외부자적 민족 호칭입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגָּלוּ
  english_pob_choice: revealed themselves
  chosen_korean: 자신들을 드러내자
  alternatives_korean:
  - 자신을 드러내자
  - 드러나자
  - 자신들이 모습을 드러내자
  lexicon: HALOT
  rationale: 니팔형의 반사적 의미를 살려, 단순히 ‘보였다’보다 의도적으로 모습을 드러낸 행위를 표현했습니다.
- source_word: מַצַּב פְּלִשְׁתִּים
  english_pob_choice: the Philistine garrison
  chosen_korean: 블레셋 주둔군
  alternatives_korean:
  - 블레셋 초소
  - 블레셋 경비대
  - 블레셋 진영
  lexicon: HALOT
  rationale: 군사적 배치된 부대를 가리키는 말이므로, 한국어에서는 ‘주둔군’이 가장 자연스럽고 정확합니다.
- source_word: עִבְרִים
  english_pob_choice: the Hebrews
  chosen_korean: 히브리인들
  alternatives_korean:
  - 히브리 사람들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 블레셋 사람들의 외부자적 민족 호칭을 그대로 살리기 위해 ‘이스라엘 사람들’로 풀지 않고 ‘히브리인들’로 옮겼습니다.
- source_word: מִן הַחֹרִים
  english_pob_choice: out of the holes
  chosen_korean: 구멍들에서
  alternatives_korean:
  - 동굴들에서
  - 숨은 곳들에서
  - 구덩이들에서
  lexicon: HALOT
  rationale: 직역에 가까운 구체적 표현을 유지해 블레셋 사람들의 비웃는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 블레셋 사람들의 발화에서 민족 호칭을 어떻게 처리할지
  chosen_reading: ‘히브리인들’을 그대로 유지했습니다.
  alternative_readings:
  - ‘이스라엘 사람들’로 의미를 풀어 쓰기
  - ‘히브리 족속’으로 완곡하게 번역하기
  rationale: 이 절은 블레셋 사람들의 조롱 섞인 외부자 호칭을 드러내므로, 그 긴장을 보존하는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 서술의 사회-역사적 맥락 보존
- issue: ‘보십시오’의 문체
  chosen_reading: 문장 내 직접 화법에서 ‘보십시오’로 옮겼습니다.
  alternative_readings:
  - ‘보라’
  - ‘봐요’
  rationale: 직접 인용 안에서도 공적 발화의 강한 주목 유도 기능을 유지하면서 현대 한국어의 격식을 지켰습니다.
  doctrine_reference: 현대 한국어 문체 일관성
