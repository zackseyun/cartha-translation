  text: How much more if the people had eaten today from the spoil of their enemies that they found! For then the slaughter among the Philistines would have been much greater[a].
  footnotes:
  - marker: a
    text: Or, 'Indeed, if only the people had eaten today from the spoil of their enemies that they found, then the blow against the Philistines would have been greater.'
