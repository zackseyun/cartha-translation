theological_decisions:
- issue: 전쟁 결과에 대한 사무엘상 14:30의 반사실 진술을 어떻게 옮길지
  chosen_reading: 가정법과 수사 의문을 사용해, 백성이 먹었더라면 전투 결과가 더 컸을 것이라는 의미를 그대로 살렸습니다.
  alternative_readings:
  - 직설적으로 ‘훨씬 더 컸을 것입니다’만 두는 방식
  - ‘정말로 더 컸을 텐데요’처럼 완화하는 방식
  rationale: 본문은 단순 정보가 아니라 사울의 금식 명령이 전투 성과를 저해했을 가능성을 평가하는 진술이므로, 반사실적 아쉬움의 힘을 약화시키지 않도록 했습니다.
  doctrine_reference: '본문 비평/해석 원칙: 반사실 조건문의 의미 보존'
