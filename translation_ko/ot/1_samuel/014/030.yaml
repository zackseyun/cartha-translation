translation:
  language: ko
  text: 오늘 백성이 자기들이 찾아낸 원수들의 탈취물에서 먹었더라면 얼마나 더 좋았겠습니까! 그랬다면 이제 블레셋 사람들 가운데서의 살육은 훨씬 더 컸을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘정말로 오늘 백성이 자기들이 찾아낸 원수들의 탈취물에서 먹기만 했더라면, 그러면 블레셋 사람들에 대한 살육은 더 컸을 것이다.’
    reason: alternative_reading
lexical_decisions:
