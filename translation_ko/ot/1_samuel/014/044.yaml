theological_decisions:
- issue: 히브리어 맹세 공식의 생략된 대상 처리
  chosen_reading: ‘하나님께서 그렇게 하시고 또 그보다 더하시기를’로 옮겨, 보복의 구체적 대상은 드러내지 않았습니다.
