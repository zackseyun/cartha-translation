    rationale: 이 표현은 무기를 드는 군사 수행자의 직책을 가리킵니다. ‘종’은 본문이 명시하지 않은 일반적 신분 범주를 전면에 내세웁니다.
  - severity: medium
    issue: 각주 위치와 내용이 본문의 분사에 맞지 않음
    rationale: 각주는 마지막의 מְמוֹתֵת(죽이고 있었다/계속 죽였다)에 관한 것이므로 ‘올라갔습니다’가 아니라 죽이는 동사에 붙어야 합니다. 또한 ‘자기 뒤에서’는 요나단을 뒤따른다는 관계를 모호하게 합니다.
