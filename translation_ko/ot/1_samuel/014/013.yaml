  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문의 ‘손과 발로’라는 자세와 무기를 든 자가 요나단의 뒤를 따른다는 관계는 대체로 반영되었으나, ‘기어 올라갔습니다’는 포복의 의미를 다소 강하게 더합니다. 또한 마지막 אַחֲרָיו는 무기를 든 자가 요나단을 뒤따르는 관계이므로 이를 명시하는 편이 안전합니다.
  naturalness: ‘손과 발을 짚어 올라갔고’는 가파른 곳을 오르는 상황에서 자연스러우면서도 원문의 자세를 보존합니다. ‘그의 무기를 든 자’는 현대 표준어 합쇼체 문맥에서 이해 가능하며, ‘종’보다 직책을 더 정확히 나타냅니다.
  terminology: נֹשֵׂא כֵלָיו는 사회적 신분 일반을 뜻하는 ‘종’이라기보다 전투 장비를 드는 수행자/무기 담당 역할입니다. 따라서 ‘그의 무기를 든 자’로 옮깁니다. 분사 מְמוֹתֵת의 진행적 가능성은 각주에서 보존합니다.
