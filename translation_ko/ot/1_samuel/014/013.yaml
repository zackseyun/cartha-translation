- from: 그때 요나단이 자기 손과 발로 기어 올라갔습니다[a]. 그의 무기 든 종이 그 뒤를 따랐습니다. 그들이 요나단 앞에 쓰러졌고, 그의 무기 든 종은 그 뒤를 따라 그들을 죽였습니다.
  to: 그때 요나단은 손과 발을 짚어 올라갔고, 그의 무기를 든 자가 그 뒤를 따랐습니다. 그들이 요나단 앞에 쓰러졌으며, 그의 무기를 든 자가 요나단의 뒤를 따라 그들을 죽였습니다[a].
  rationale: 원문의 신체 자세는 보존하되 ‘기어가다’가 덧붙이는 포복의 뉘앙스를 피했습니다. 무기 든 자의 군사적 역할을 ‘종’보다 정확하게 옮겼고, 두 번째 ‘그의 뒤에’를 요나단을 뒤따르는 관계로 명시했습니다. 분사의 진행적 해석 가능성은 해당 동사에 연결한 각주로 유지했습니다.
