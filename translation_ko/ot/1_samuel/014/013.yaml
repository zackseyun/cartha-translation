base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/013.yaml
  text: Then Jonathan climbed up on his hands and feet[a], with his armor-bearer behind him. They fell before Jonathan, and his armor-bearer killed them after him.
  footnotes:
  - marker: a
    text: Or, 'was killing them behind him.' The Hebrew participle may emphasize ongoing action rather than repeated action.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요나단은 손과 발을 짚어 올라갔고, 그의 무기를 든 자가 그 뒤를 따랐습니다. 그들이 요나단 앞에 쓰러졌으며, 그의 무기를 든 자가 요나단의 뒤를 따라 그들을 죽였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요나단의 뒤를 따라 그들을 죽이고 있었다.’ 히브리어 분사는 반복적 행위보다 진행 중인 동작을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: climbed up
  chosen_korean: 기어 올라갔습니다
  alternatives_korean:
  - 올라갔습니다
  - 올라섰습니다
  lexicon: HALOT
  rationale: 단순한 ‘올라가다’보다, 손과 발을 사용해 가파른 지형을 오르는 장면을 한국어로 더 분명하게 살립니다.
- source_word: עַל יָדָיו וְעַל רַגְלָיו
  english_pob_choice: on his hands and feet
  chosen_korean: 자기 손과 발로
  alternatives_korean:
  - 손과 발로
  - 네 발로
  lexicon: HALOT
  rationale: 원문의 신체적 자세를 그대로 드러내되, 한국어에서 자연스럽게 읽히도록 간결하게 옮겼습니다.
- source_word: נֹשֵׂא כֵלָיו
  english_pob_choice: his armor-bearer
  chosen_korean: 무기 든 종
  alternatives_korean:
  - 무기 حامل자
  - 병기 드는 자
  - 무기 운반자
  lexicon: HALOT
  rationale: 군사적 역할을 나타내는 관용 표현으로 ‘무기 든 종’을 택해, 한국어 독자에게 역할이 바로 드러나게 했습니다.
- source_word: מְמוֹתֵת
  english_pob_choice: killed them after him
  chosen_korean: 그 뒤를 따라 그들을 죽였습니다
  alternatives_korean:
  - 그 뒤에서 계속 죽였습니다
  - 그들 뒤에서 죽였습니다
  lexicon: HALOT
  rationale: 히브리어 분사형의 반복·지속적 뉘앙스를 살리면서도, 본문이 제시하는 위치 관계(‘뒤를 따라’)를 유지했습니다.
theological_decisions:
- issue: 무기 든 종의 신분 표현
  chosen_reading: ‘종’으로 옮기되, 병사 보조 역할이 드러나도록 ‘무기 든 종’으로 구체화했습니다.
  alternative_readings:
  - 부하
  - 병사
  - 시종
  rationale: 본문의 군사적 종속 관계를 흐리지 않기 위해 일반적인 ‘부하’보다 원문 역할에 더 가까운 표현을 택했습니다.
  doctrine_reference: 본문 서술의 사회적/군사적 맥락 유지
