base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/014.yaml
  text: That first slaughter[a], which Jonathan and his armor-bearer made, was about twenty men within about half a furrow in an acre of a field.
  footnotes:
  - marker: a
    text: Hebrew literally, 'about half a furrow of a yoke of a field,' likely referring to the area a yoke of oxen could plow.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 첫 번째 타격은 요나단과 그의 무기 든 자가 한 것이었는데, 약 스무 명, 곧 약 반 이랑의 한 쌍 밭 안에서였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘한 쌍의 밭의 반 이랑쯤’이며, 소 두 마리가 밭갈이할 수 있는 면적을 가리키는 말일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּכָּה
  english_pob_choice: slaughter
  chosen_korean: 타격
  alternatives_korean:
  - 도륙
  - 학살
  - 살육
  lexicon: HALOT
  rationale: 전투 문맥의 결과가 치명적이지만, 한국어의 ‘학살/도륙’은 의미가 지나치게 강하고 평가적일 수 있어, 본문의 사건성을 살리면서도 결과는 문맥이 드러내도록 ‘타격’으로 옮겼습니다.
- source_word: הָרִאשֹׁנָה
  english_pob_choice: first
  chosen_korean: 첫 번째
  alternatives_korean:
  - 첫
  - 처음의
  lexicon: HALOT
  rationale: 히브리어 서수형의 직설적 대응으로, 전투의 첫 교전을 자연스럽게 표시하는 표현입니다.
- source_word: וְנֹשֵׂא כֵלָיו
  english_pob_choice: and his armor-bearer
  chosen_korean: 그의 무기 든 자
  alternatives_korean:
  - 그의 갑옷 든 자
  - 그의 병기 운반자
  lexicon: HALOT
  rationale: 고대 전쟁 보조병의 관용 표현을 한국어로 풀어 옮겼습니다. ‘갑옷 든 자’는 역할을 좁히고, ‘무기 든 자’가 문맥상 더 정확합니다.
- source_word: כְּבַחֲצִי מַעֲנָה צֶמֶד שָׂדֶה
  english_pob_choice: within about half a furrow in an acre of a field
  chosen_korean: 약 반 이랑의 한 쌍 밭 안에서
  alternatives_korean:
  - 약 반 고랑의 밭갈이 범위 안에서
  - 약 반 이랑, 한 쌍이 갈 수 있는 밭에서
  lexicon: HALOT
  rationale: 마지막 구는 직역하면 ‘한 쌍의 밭의 반 이랑’에 가깝고, POB가 주석에서 설명하듯 토지 측정 관용구입니다. 본문에는 측정 이미지를 유지하되, ‘한 쌍 밭’으로 농경 단위를 드러내고 주석 없이도 읽히도록 최소한으로 다듬었습니다.
