theological_decisions:
- issue: 이스라엘과 함께 함의 의미
  chosen_reading: 본문은 단순한 물리적 동거가 아니라 소속과 충성의 이동을 암시합니다.
  alternative_readings:
  - 단순히 이스라엘 진영 안에 머물게 되었다
  - 지리적 위치 변화만을 말한다
  rationale: 문맥상 블레셋 편에 있던 히브리인들이 이스라엘 편으로 돌아서는 전환을 말하므로, 독자가 그 신학적·서사적 이동을 읽을 수 있게 했습니다.
  doctrine_reference: 서사적 충성 전환
- issue: 사울과 요나단과 함께 있던 자들
  chosen_reading: 마지막 절은 새로 이스라엘 쪽으로 돌아선 자들이 사울과 요나단 진영에 합류했음을 설명합니다.
  alternative_readings:
  - 사울과 요나단을 수식하는 동격 표현
  - 이스라엘 전체를 가리키는 집합적 수식
  rationale: 히브리어 상대절의 연결이 다소 압축적이므로, 한국어에서는 의미 관계가 드러나도록 설명적 종결을 취했습니다.
  doctrine_reference: 문법-서사 연결
