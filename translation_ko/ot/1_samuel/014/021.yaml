base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/021.yaml
  text: Now the Hebrews who had previously been with the Philistines[a], who had gone up with them into the camp all around—even they also came to be with Israel[c][b], who were with Saul and Jonathan.
  footnotes:
  - marker: a
    text: Hebrew literally, 'like yesterday, three days ago,' an idiom meaning 'formerly' or 'previously.'
    reason: lexical_alternative
  - marker: b
    text: Or 'came to be with Israel'; the Hebrew says 'to be with Israel,' implying a shift of allegiance.
    reason: alternative_reading
  - marker: c
    text: The phrase 'into the camp all around' is difficult; it likely refers to those Hebrews who had accompanied the Philistines in their encampment in the surrounding area.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 이전에 블레셋 사람들과 함께 있던 히브리 사람들[a], 곧 그들과 함께 사방의 진영으로 올라갔던 그들조차도[b] 이스라엘과 함께 있게 되었는데[c], 곧 사울과 요나단과 함께 있던 자들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로 ‘어제·그저께처럼’에 해당하는 관용구로, ‘이전에는’의 뜻입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 ‘그들과 함께 올라갔다’라고 되어 있으며, 블레셋 사람들과 동행해 진영 안으로 들어간 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 본문의 구문은 난해하며, 블레셋 진영 주변에 있던 히브리 사람들을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעִבְרִים
  english_pob_choice: Now the Hebrews
  chosen_korean: 이제 히브리 사람들
  alternatives_korean:
  - 그리고 히브리 사람들
  - 히브리 사람들
  lexicon: HALOT
  rationale: עִבְרִים은 ‘히브리 사람들’로 옮기되, 서술 전환을 나타내는 וְ는 문맥상 ‘이제’로 자연스럽게 처리했습니다.
- source_word: הָיוּ לַפְּלִשְׁתִּים
  english_pob_choice: had previously been with the Philistines
  chosen_korean: 이전에는 블레셋 사람들과 함께 있던
  alternatives_korean:
  - 블레셋 사람들과 함께 있던
  - 블레셋 사람들에게 속해 있던
  lexicon: HALOT
  rationale: לַפְּלִשְׁתִּים을 단순 소속보다 ‘함께 있던’으로 풀어, 본문이 말하는 관계/동맹의 뉘앙스를 살렸습니다.
- source_word: בַּמַּחֲנֶה סָבִיב
  english_pob_choice: into the camp all around
  chosen_korean: 사방의 진영으로
  alternatives_korean:
  - 진영 둘레로
  - 둘러선 진영 안으로
  - 주위에 펼쳐진 진영으로
  lexicon: HALOT
  rationale: 이 구는 문맥상 난해하므로, 블레셋 진영이 사방에 펼쳐진 상황을 드러내는 범위 안에서 가장 간결한 한국어로 옮겼습니다.
- source_word: לִהְיוֹת עִם יִשְׂרָאֵל
  english_pob_choice: came to be with Israel
  chosen_korean: 이스라엘과 함께 있게 되었는데
  alternatives_korean:
  - 이스라엘과 함께하게 되었는데
  - 이스라엘 편에 서게 되었는데
  - 이스라엘에 속하게 되었는데
  lexicon: HALOT
  rationale: לִהְיוֹת는 단순 존재가 아니라 편이 바뀌는 이동을 암시하므로, ‘함께 있게 되다’로 관계 변화를 드러냈습니다.
theological_decisions:
- issue: 이스라엘과 함께 함의 의미
  chosen_reading: 본문은 단순한 물리적 동거가 아니라 소속과 충성의 이동을 암시합니다.
  alternative_readings:
  - 단순히 이스라엘 진영 안에 머물게 되었다
  - 지리적 위치 변화만을 말한다
  rationale: 문맥상 블레셋 편에 있던 히브리인들이 이스라엘 편으로 돌아서는 전환을 말하므로, 독자가 그 신학적·서사적 이동을 읽을 수 있게 했습니다.
  doctrine_reference: 서사적 충성 전환
- issue: 사울과 요나단과 함께 있던 자들
  chosen_reading: 마지막 절은 새로 이스라엘 쪽으로 돌아선 자들이 사울과 요나단 진영에 합류했음을 설명합니다.
  alternative_readings:
  - 사울과 요나단을 수식하는 동격 표현
  - 이스라엘 전체를 가리키는 집합적 수식
  rationale: 히브리어 상대절의 연결이 다소 압축적이므로, 한국어에서는 의미 관계가 드러나도록 설명적 종결을 취했습니다.
  doctrine_reference: 문법-서사 연결
