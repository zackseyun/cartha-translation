  chosen_reading: 히브리어의 명사구 연쇄를 한국어에서는 완결된 서술문으로 풀되, 계보 관계는 그대로 유지했습니다.
  alternative_readings:
  - 기스, 사울의 아버지; 넬, 아브넬의 아버지; 아브넬, 아비엘의 아들
  - 기스는 사울의 아버지요, 넬은 아브넬의 아버지요, 아브넬은 아비엘의 아들입니다
  rationale: 원문은 생략된 계사를 지닌 족보식 진술이므로, 한국어에서도 정보 손실 없이 읽히는 서술문으로 재구성했습니다.
  doctrine_reference: 본문 의미 보존과 서술 명료성
