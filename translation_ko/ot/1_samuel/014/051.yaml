translation:
  language: ko
  text: 사울의 아버지 기스와 아브넬의 아버지 넬은 아비엘의 아들들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘기스, 사울의 아버지, 그리고 넬, 아브넬의 아버지, 아비엘의 아들’처럼 압축되어 있습니다. 마지막 ‘아들’은 단수형이며 그 수식 범위가 압축되어 있으나, 문맥상 기스와 넬을 아비엘의 아들들로 이해합니다.
    reason: lexical_alternative
