  yaml_path: translation/ot/1_samuel/014/051.yaml
  text: Kish was the father of Saul[a], and Ner was the father of Abner, the son of Abiel.
  footnotes:
  - marker: a
    text: Or, more literally, 'Kish, father of Saul; and Ner, father of Abner, son of Abiel.' English supplies 'was' to make the genealogical statement explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 기스는 사울의 아버지였고, 넬은 아브넬의 아버지였으며, 아브넬은 아비엘의 아들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘기스, 사울의 아버지; 넬, 아브넬의 아버지, 아비엘의 아들’처럼 더 축약적으로도 읽을 수 있습니다. 영어 POB는 이를 풀어 ‘was the father of’를 보충했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִישׁ
  english_pob_choice: Kish
  chosen_korean: 기스
  alternatives_korean:
  - 키쉬
  lexicon: HALOT
  rationale: 고유명사는 한국어에서 통용되는 성서 음역을 따랐습니다.
