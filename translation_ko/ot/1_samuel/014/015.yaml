revisions:
- from: 진영과 들과 모든 백성 가운데에 떨림이 일어났고, 요새와 약탈 부대도 떨었습니다. 땅이 진동하여 하나님께서 주시는 떨림이 되었습니다.[a]
  to: 진영과 들과 온 백성 가운데에 떨림이 일어났습니다. 수비대와 약탈대도 떨었습니다. 땅이 진동하였고, 그 진동은 하나님께로부터 온 떨림이 되었습니다.[a]
  rationale: 사람을 가리키는 군사 용어 הַמַּצָּב를 ‘수비대’로 바로잡고, 병렬 표현과 마지막 결과절을 현대 표준어 합쇼체에 맞게 다듬었습니다. 하나님을 출처로 보는 본문 선택과, 이를 강도 표현으로 이해할 수 있다는 각주의 해석상 긴장은 모두 보존했습니다.
  reviewer_model: gpt-5.6-terra
