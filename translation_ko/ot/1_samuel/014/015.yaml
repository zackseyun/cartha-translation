source:
  edition: WLC
  text: וַ/תְּהִי֩ חֲרָדָ֨ה בַ/מַּחֲנֶ֤ה בַ/שָּׂדֶה֙ וּ/בְ/כָל הָ/עָ֔ם הַ/מַּצָּב֙ וְ/הַ/מַּשְׁחִ֔ית חָרְד֖וּ גַּם הֵ֑מָּה וַ/תִּרְגַּ֣ז הָ/אָ֔רֶץ וַ/תְּהִ֖י לְ/חֶרְדַּ֥ת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/015.yaml
  text: And there was trembling in the camp[a], in the field, and among all the people; the garrison and the raiding party also trembled. And the earth quaked, so that it became a trembling from God.
  footnotes:
  - marker: a
    text: Or, 'a very great trembling' or 'a divine terror.' The Hebrew phrase can express either source ('from God') or intensity.
    reason: alternative_reading
translation:
  language: ko
  text: 진영과 들과 온 백성 가운데에 떨림이 일어났습니다. 수비대와 약탈대도 떨었습니다. 땅이 진동하였고, 그 진동은 하나님께로부터 온 떨림이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “매우 큰 떨림” 또는 “신적 공포”로 옮길 수 있습니다. 히브리어 표현은 하나님께로부터 왔다는 출처 또는 떨림의 강도 모두를 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲרָדָה
  english_pob_choice: trembling
  chosen_korean: 떨림
  alternatives_korean:
  - 전율
  - 공포
  - 두려움
  lexicon: HALOT
  rationale: 히브리어 חֲרָדָה의 구체적 신체 반응을 살려 ‘떨림’으로 옮겼습니다. 앞뒤의 חרד 동사와 반복 대응도 한국어에서 유지됩니다.
- source_word: בַ/מַּחֲנֶה
  english_pob_choice: in the camp
  chosen_korean: 진영 가운데에
  alternatives_korean:
  - 진영 안에
  - 진영에서
  lexicon: HALOT
  rationale: 장소 부사격을 자연스럽게 살리되, 이어지는 병렬 구조와 맞도록 ‘가운데에’로 풀어 군사 진영 전체를 아우르는 느낌을 유지했습니다.
- source_word: הַ/מַּשְׁחִית
  english_pob_choice: the raiding party
  chosen_korean: 약탈 부대
  alternatives_korean:
  - 파괴자
  - 약탈자들
  - 노략대
  lexicon: HALOT
  rationale: 문맥상 단일 인물보다 군사적 기능을 가진 집단을 가리키므로, 기능을 드러내는 ‘부대’를 택했습니다. 영어 POB의 집단성도 반영합니다.
- source_word: וַ/תִּרְגַּ֣ז הָ/אָ֔רֶץ
  english_pob_choice: The earth quaked
  chosen_korean: 땅이 진동하여
  alternatives_korean:
  - 땅이 흔들려
  - 땅이 요동하여
  - 땅이 흔들렸습니다
  lexicon: HALOT
  rationale: רגז의 강한 흔들림을 ‘진동하다’로 옮겨, 인간의 떨림에서 자연계의 반응으로 확장되는 흐름을 살렸습니다.
theological_decisions:
- issue: לְ/חֶרְדַּ֥ת אֱלֹהִֽים의 의미
  chosen_reading: 하나님께서 주시는 떨림
  alternative_readings:
  - 하나님으로부터 온 떨림
  - 매우 큰 떨림
  - 신적 공포
  rationale: 히브리어는 מקור(출처)과 강도(최상급) 두 방향으로 읽힐 수 있습니다. 본문이 전하는 사건의 신적 기원을 드러내면서도, 강도 의미를 완전히 지우지 않기 위해 직역적이되 해석을 과도하게 고정하지 않는 표현을 택했습니다.
  doctrine_reference: 번역 원칙 §3 — 신학적 긴장을 해소하지 않고 보존
