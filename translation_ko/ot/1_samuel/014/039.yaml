translation:
  language: ko
  text: 야훼께서는 살아 계십니다. 이스라엘을 구원하시는 분께서 말씀하십니다. "내 아들 요나단에게서 나온 것이라 해도 그는 반드시 죽을 것입니다." 그러나 온 백성 가운데 아무도 그에게 대답하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그것이 요나단 내 아들 안에 있다’는 식의 축약 표현입니다. 문맥상 문제의 근원이나 죄책을 가리키는 것으로 이해됩니다.
    reason: source_note
