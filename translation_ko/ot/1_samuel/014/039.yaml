translation:
  language: ko
  text: “이스라엘을 구원하시는 야훼께서 살아 계심을 두고 맹세합니다. 설령 그것[a]이 내 아들 요나단에게 있다 해도, 그는 반드시 죽을 것입니다.” 그러나 온 백성 가운데 아무도 그에게 대답하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그것이 내 아들 요나단에게 있다’라고 합니다. ‘그것’이 가리키는 대상은 명시되지 않았으며, 문맥상 조사 중인 죄책이나 잘못을 가리키는 것으로 보입니다.
    reason: source_note
