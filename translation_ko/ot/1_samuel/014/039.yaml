  source_fidelity: 개정이 필요합니다. 초안은 히브리어의 맹세 공식(‘이스라엘을 구원하시는 야훼께서 살아 계심을 두고’)을 두 개의 평서문으로 분리하고 ‘말씀하십니다’를 보태어, 발화의 문법과 의미를 바꾸었습니다. 또한 ‘요나단에게서 나온 것’은 בְּיוֹנָתָן(‘요나단에게/요나단 안에’)보다 원인·출처를 뜻하게 됩니다.
  naturalness: 개정문은 현대 표준어 합쇼체에서 엄숙한 맹세와 선언의 어조를 자연스럽게 유지합니다.
  terminology: ‘야훼’, ‘이스라엘’, ‘구원하시는’, ‘반드시 죽을 것입니다’는 원문 및 프로젝트 용례에 적절합니다. 생략된 대상은 ‘그것’으로 유지하여 죄책 등으로 단정하지 않았습니다.
  issues:
  - severity: high
    issue: 맹세 공식이 평서문 둘과 추가 동사로 바뀜
    rationale: חַי יהוה הַמושיע את־ישראל은 ‘이스라엘을 구원하시는 야훼께서 살아 계심을 두고 [맹세한다]’라는 선서 도입부입니다. ‘야훼께서는 살아 계십니다. … 말씀하십니다’는 원문에 없는 발화 동사를 추가하고 맹세의 기능을 소실합니다.
  - severity: medium
    issue: ‘요나단에게서 나온 것’이 전치사 의미를 과도하게 해석함
    rationale: בְּיוֹנָתָן은 여기서 문제의 대상이 요나단에게 ‘있다/발견된다’는 타원적 표현입니다. ‘에게서 나오다’는 그가 원인 또는 출처라는 뜻을 더합니다.
