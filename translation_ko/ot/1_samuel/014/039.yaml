revisions:
- from: 야훼께서는 살아 계십니다. 이스라엘을 구원하시는 분께서 말씀하십니다. "내 아들 요나단에게서 나온 것이라 해도 그는 반드시 죽을 것입니다." 그러나 온 백성 가운데 아무도 그에게 대답하지 않았습니다.[a]
  to: “이스라엘을 구원하시는 야훼께서 살아 계심을 두고 맹세합니다. 설령 그것[a]이 내 아들 요나단에게 있다 해도, 그는 반드시 죽을 것입니다.” 그러나 온 백성 가운데 아무도 그에게 대답하지 않았습니다.
  rationale: 히브리어의 선서 공식을 한국어의 자연스러운 맹세 표현으로 복원하고, 원문에 없는 ‘말씀하십니다’를 제거했습니다. 또한 생략된 대상을 ‘그것’으로 보존하고 각주에서만 문맥적 이해를 설명하여 본문이 죄책의 내용이나 원인을 확정하지 않게 했습니다.
