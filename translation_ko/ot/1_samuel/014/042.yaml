  source_fidelity: 히브리어의 הַפִּילוּ는 문맥상 제비로 판별하도록 명하는 표현이며, ‘제비를 던지십시오’는 이를 충실하게 옮깁니다. וַיִּלָּכֵד는 제비의 결과로 요나단이 특정된 것을 뜻하므로, 한국어에서는 ‘잡혔습니다’보다 ‘제비에 뽑혔습니다’가 문맥과 동사의 수동성을 더 정확히 전달합니다.
  naturalness: 합쇼체의 문장 흐름은 자연스럽습니다. 다만 ‘요나단이 잡혔습니다’는 현대 한국어에서 체포·포획의 뜻으로 우선 이해되기 쉬워 제비뽑기 문맥에 맞지 않습니다. 기존 각주는 ‘그것을 떨어뜨리십시오’의 지시 대상이 본문에 명시되지 않아 어색하므로 고칠 필요가 있습니다.
  terminology: ‘사울’, ‘요나단’, ‘내 아들’, ‘제비를 던지다’는 표준적인 성경 한국어 및 현대적 사용에 적절합니다. 제비의 결과에는 ‘제비에 뽑히다’를 사용하여 본문의 판별 맥락을 명료하게 하되, 신학적 해석은 덧붙이지 않았습니다.
