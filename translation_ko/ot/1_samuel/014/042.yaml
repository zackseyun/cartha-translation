base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/042.yaml
  text: Then Saul said[a], “Cast lots between me and Jonathan my son.” And Jonathan was taken.
  footnotes:
  - marker: a
    text: Or, more literally, “Cause it to fall between me and Jonathan my son,” with the sense of deciding the matter by lot.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울이 말했습니다. 「나와 내 아들 요나단 사이에 제비를 던지십시오.[a]」 그러자 요나단이 제비에 뽑혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, “나와 내 아들 요나단 사이에 떨어지게 하십시오.” 곧 제비로 판별하라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּילוּ
  english_pob_choice: Cast lots
  chosen_korean: 제비를 던지십시오
  alternatives_korean:
  - 제비를 뽑으십시오
  - 떨어뜨리십시오
  - 결정하십시오
  lexicon: HALOT
  rationale: 히필 명령형의 직역은 ‘떨어뜨리다’이지만, 문맥상 판별 수단은 제비이며 한국어에서도 관용적으로 ‘제비를 던지다/뽑다’가 가장 자연스럽습니다.
- source_word: בֵּינִי וּבֵין
  english_pob_choice: between me and
  chosen_korean: 나와 … 사이에
  alternatives_korean:
  - 내게서 … 사이에
  - 나와 … 사이에서
  lexicon: HALOT
  rationale: 두 대상 사이의 대조를 나타내므로 한국어에서는 ‘사이’ 구문이 가장 직접적입니다.
- source_word: בְּנִי
  english_pob_choice: my son
  chosen_korean: 내 아들
  alternatives_korean:
  - 내 아들아
  - 내 자녀
  lexicon: HALOT
  rationale: בן의 1인칭 단수 접미사는 친자 관계를 분명히 하므로, 인물 호칭을 자연스럽게 살려 ‘내 아들’로 옮겼습니다.
- source_word: וַיִּלָּכֵד
  english_pob_choice: was taken
  chosen_korean: 잡혔습니다
  alternatives_korean:
  - 붙잡혔습니다
  - 선택되었습니다
  - 제비에 걸렸습니다
  lexicon: HALOT
  rationale: 기본 의미는 ‘붙잡히다/사로잡히다’이지만, 제비를 통해 특정인이 지목된 상황에서는 ‘잡혔습니다’가 짧고 본문 의미를 유지합니다.
theological_decisions:
- issue: 제비뽑기 표현의 해석 범위
  chosen_reading: 본문의 ‘제비를 던지다’는 인간의 임의적 선택이 아니라 하나님의 뜻을 가리는 분별 행위로 읽을 수 있으나, 본문 자체는 그 의미를 설명하지 않고 사건만 서술합니다.
  alternative_readings:
  - 단순한 추첨으로만 이해하는 읽기
  - ‘결정하십시오’처럼 제비의 물리성을 약화하는 읽기
  rationale: 히브리어 동사와 문맥이 모두 제비를 통한 판별을 가리키므로, 의미를 지우지 않되 해설은 본문 밖으로 남기는 것이 적절합니다.
  doctrine_reference: 잠 16:33; 잠 18:18
