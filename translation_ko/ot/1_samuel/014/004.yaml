base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/004.yaml
  text: Now between the passes by which Jonathan sought to cross over to the Philistine garrison[a], there was a crag of rock on one side and a crag of rock on the other side; and the name of the one was Bozez, and the name of the other Seneh.
  footnotes:
  - marker: a
    text: Hebrew literally, 'a tooth of rock ... and a tooth of rock,' an idiom for sharp rocky crags or projections.
    reason: lexical_alternative
translation:
  language: ko
  text: 요나단이 블레셋 수비대 쪽으로 건너가려고 하던 통로들 사이에는, 이쪽에 바위의 뾰족한 돌출부[a]가 하나 있고 저쪽에도 바위의 뾰족한 돌출부가 하나 있었습니다. 한쪽의 이름은 보세스였고, 다른 쪽의 이름은 세네였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바위의 이빨 … 바위의 이빨’이며, 날카로운 바위 돌출부를 가리키는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְבְּרוֹת
  english_pob_choice: the passes
  chosen_korean: 통로들
  alternatives_korean:
  - 산길들
  - 넘어가는 길들
  - 협곡 사이 길들
  lexicon: HALOT
  rationale: 이 문맥에서는 지형의 ‘건너는 길/통과 지점’이 핵심이므로, 현대 한국어에서 가장 자연스러우면서도 범위를 과도하게 좁히지 않는 ‘통로들’로 옮겼습니다.
- source_word: מַצַּב פְּלִשְׁתִּים
  english_pob_choice: the Philistine garrison
  chosen_korean: 블레셋 군영
  alternatives_korean:
  - 블레셋 주둔군
  - 블레셋 초소
  - 블레셋 수비대
  lexicon: HALOT
  rationale: 군사적으로 주둔한 부대를 가리키므로, ‘garrison’의 기능을 살리는 ‘군영’으로 옮겼습니다. ‘초소’보다 규모감이 있고, 본문의 긴장된 전투 맥락에 더 잘 맞습니다.
- source_word: שֵׁן הַסֶּלַע
  english_pob_choice: a crag of rock
  chosen_korean: 바위의 뾰족한 돌출부
  alternatives_korean:
  - 바위의 이빨
  - 바위의 절벽 끝
  - 바위의 돌기
  lexicon: HALOT
  rationale: 직역하면 ‘바위의 이빨’이지만, 한국어에서는 자연스럽지 않으므로 바위가 날카롭게 튀어나온 형상을 드러내는 설명적 표현으로 옮겼습니다.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הָאֶחָד
  english_pob_choice: the name of the one ... the name of the other
  chosen_korean: 하나는 … 다른 하나는
  alternatives_korean:
  - 한쪽의 이름은 … 다른 쪽의 이름은
  - 그 하나의 이름은 … 그 다른 하나의 이름은
  lexicon: HALOT
  rationale: 히브리어의 대칭적 명명 구조를 한국어에서도 살리되, 반복을 줄여 읽기 자연성을 확보했습니다.
