  text: וְ/שָׁא֗וּל יוֹשֵׁב֙ בִּ/קְצֵ֣ה הַ/גִּבְעָ֔ה תַּ֥חַת הָ/רִמּ֖וֹן אֲשֶׁ֣ר בְּ/מִגְר֑וֹן וְ/הָ/עָם֙ אֲשֶׁ֣ר עִמּ֔/וֹ כְּ/שֵׁ֥שׁ מֵא֖וֹת אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/002.yaml
  text: Now Saul was staying at the outskirts of Gibeah[a], under the pomegranate tree that is at Migron[b], and the people who were with him were about six hundred men.
  footnotes:
  - marker: a
    text: Or 'was sitting at the edge of Gibeah.' The Hebrew participle can denote sitting or remaining/staying in a place.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'under the pomegranate'; 'tree' is supplied in English for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울은 기브아의 끝부분[a]에 머물고 있었고, 미그론에 있는 석류나무[b] 아래에 있었습니다. 그와 함께 있는 백성은 대략 육백 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기브아의 가장자리에.’ 히브리어 분사는 ‘앉아 있다’와 ‘머물다/남아 있다’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘석류 아래’입니다. ‘나무’는 뜻을 분명히 하기 위해 보충했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  english_pob_choice: was staying
  chosen_korean: 머물고 있었고
  alternatives_korean:
  - 앉아 있었고
  - 거하고 있었고
  - 있었고
  lexicon: HALOT
  rationale: ישב는 ‘앉다’뿐 아니라 ‘머물다/거하다’의 뜻도 지니며, 전투 서술 문맥에서는 지속적인 체류를 나타내는 ‘머물다’가 가장 자연스럽습니다.
- source_word: בִּקְצֵה הַגִּבְעָה
  english_pob_choice: at the outskirts of Gibeah
  chosen_korean: 기브아의 끝부분
  alternatives_korean:
  - 기브아의 변두리
  - 기브아의 가장자리
  - 기브아의 끝자락
  lexicon: HALOT
  rationale: קצה는 ‘끝, 변두리, 경계’의 의미가 있어, 지명 기브아 앞에서는 ‘끝부분’으로 옮겨 공간적 경계를 살렸습니다.
- source_word: תַּחַת הָרִמּוֹן
  english_pob_choice: under the pomegranate tree
  chosen_korean: 석류나무 아래에
  alternatives_korean:
  - 석류 아래에
  - 석류나무 밑에
  - 석류나무 아래쪽에
  lexicon: HALOT
  rationale: רמון은 문자적으로 ‘석류’이지만 이 위치 표현에서는 석류나무를 가리키는 것으로 이해되므로, 문맥을 따라 ‘석류나무’로 구체화했습니다.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  english_pob_choice: about six hundred men
  chosen_korean: 대략 육백 명
  alternatives_korean:
  - 약 육백 명
  - 대충 육백 명
  - 육백 명가량
  lexicon: HALOT
  rationale: כ는 여기서 근사치를 나타내므로 ‘대략’으로 살렸고, אִישׁ은 수사 뒤에서 자연스럽게 ‘명’으로 옮겼습니다.
theological_decisions:
- issue: 지명 표기와 서술의 직설성
  chosen_reading: 지명은 음역을 유지하고, 군사 서술의 사실성을 살려 장면을 평이하게 전달했습니다.
  alternative_readings:
  - 기브아를 뜻하는 ‘산기슭’ 등 일반명사화
  - 보다 성경식으로 ‘기브아의 지경’처럼 의역
  rationale: 본문은 고유 지명과 위치 묘사를 통해 사울의 현재 위치를 제시하므로, 의미를 흐리지 않는 범위에서 직설적으로 옮기는 것이 가장 충실합니다.
  doctrine_reference: 본문의 서술적 맥락에 따른 역사-지리적 정확성
- issue: ‘백성’의 범위 유지
  chosen_reading: עָם을 좁혀 ‘군사들’로 단정하지 않고 ‘백성’으로 유지했습니다.
  alternative_readings:
  - 군사들
  - 부하들
  - 사람들
  rationale: 문맥상 군사 집단이 분명하지만, 히브리어가 실제로는 더 넓은 ‘사람들/백성’을 가리킬 수 있으므로 범위를 과도하게 축소하지 않았습니다.
  doctrine_reference: 본문 의미의 과도한 협소화 방지
