  text: Then Jonathan said[a], “My father has troubled the land. See, please, how my eyes have brightened because I tasted a little of this honey.”
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''my eyes have brightened,'' expressing renewed strength or alertness after eating.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 요나단이 말했습니다[a]. "내 아버지가 땅에 trouble을 일으켰습니다. 보십시오, 제가 이 꿀을 조금 맛본 뒤에 내 눈이 얼마나 밝아졌는지요."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, ‘내 눈이 밝아졌다’는 먹은 뒤 기력이 회복되고 정신이 또렷해졌다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָכַר
  english_pob_choice: has troubled
  chosen_korean: trouble을 일으켰습니다
  alternatives_korean:
  - 땅을 어지럽혔습니다
  - 땅에 화를 가져왔습니다
  - 땅을 괴롭게 했습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 ‘혼란/재앙을 일으키다, 괴롭게 하다’의 뜻이어서, 여기서는 아버지(사울)가 땅에 해를 끼쳤다는 능동적 원인을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 그 땅
  - 나라
  - 이 땅
  lexicon: HALOT
  rationale: 이 문맥의 ‘땅’은 지리적 국가명보다 공동체 전체가 겪는 피해를 가리키므로, 현대 한국어에서도 자연스러운 ‘땅’을 선택했습니다.
- source_word: רְאוּ נָא
  english_pob_choice: See, please
  chosen_korean: 보십시오
  alternatives_korean:
  - 보십시오, 제발
  - 보세요
  - 잘 보십시오
  lexicon: HALOT
  rationale: 명령형과 청유적 완곡함이 함께 있으나, 한국어에서는 공손한 요청을 기본으로 하는 ‘보십시오’가 가장 간결하게 대응합니다.
- source_word: אֹרוּ עֵינַי
  english_pob_choice: my eyes have brightened
  chosen_korean: 내 눈이 얼마나 밝아졌는지요
  alternatives_korean:
  - 내 눈이 밝아졌는지요
  - 내 눈이 환해졌는지요
  - 내 눈에 생기가 돌았는지요
  lexicon: HALOT
  rationale: ‘눈이 밝아지다’는 히브리어 관용구로, 음식 섭취 뒤 회복된 기력과 생기를 나타냅니다. 직역성을 살리면서도 현대 독자가 이해할 수 있게 유지했습니다.
- source_word: טָעַמְתִּי מְעַט דְּבַשׁ
  english_pob_choice: I tasted a little of this honey
  chosen_korean: 제가 이 꿀을 조금 맛본 뒤에
  alternatives_korean:
  - 제가 이 꿀을 조금 맛보았기 때문에
  - 제가 이 꿀을 조금 먹은 뒤에
  - 제가 이 꿀을 조금 맛보았습니다
  lexicon: HALOT
  rationale: ‘맛보다’와 ‘조금’은 원문의 소량 섭취를 정확히 보존합니다. 원인-결과 관계는 한국어에서 자연스럽게 ‘맛본 뒤에’로 풀었습니다.
theological_decisions:
- issue: 왕의 금식 명령이 공동체에 끼친 해악을 요나단이 직접 고발하는 어조
  chosen_reading: 요나단의 발언을 단순한 불평이 아니라 사울의 서약이 공동체를 해롭게 했다는 공개적 평가로 살렸습니다.
  alternative_readings:
  - 내 아버지가 땅을 괴롭게 했습니다
  - 내 아버지가 이 땅에 해를 끼쳤습니다
  rationale: 히브리어 עָכַר는 단순 감정 표현보다 실제적 해악/혼란을 뜻하므로, 문맥상 사울의 경솔한 맹세가 공동체를 곤란하게 만들었다는 평가를 드러내야 합니다.
  doctrine_reference: 1 Samuel 14:24-30 문맥
