  text: וְ/שָׁא֛וּל לָכַ֥ד הַ/מְּלוּכָ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּלָּ֣חֶם סָבִ֣יב בְּֽ/כָל אֹיְבָ֡י/ו בְּ/מוֹאָ֣ב וּ/בִ/בְנֵי עַמּ֨וֹן וּ/בֶ/אֱד֜וֹם וּ/בְ/מַלְכֵ֤י צוֹבָה֙ וּ/בַ/פְּלִשְׁתִּ֔ים וּ/בְ/כֹ֥ל אֲשֶׁר יִפְנֶ֖ה יַרְשִֽׁיעַ־׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/047.yaml
  text: 'Now Saul had secured the kingship over Israel[a], and he fought against all his enemies on every side: against Moab, against the Ammonites, against Edom, against the kings of Zobah, and against the Philistines. Wherever he turned, he inflicted punishment.'
  footnotes:
  - marker: a
    text: Or, more literally, 'he condemned' them; the Hebrew verb can mean to declare guilty, and here likely refers to inflicting punitive defeat on his enemies.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울은 이스라엘 위에서 왕권을 장악했고, 사방의 모든 원수들과 싸웠습니다. 곧 모압과 암몬 자손과 에돔과 소바의 왕들과 블레셋 사람들을 상대로 싸웠습니다. 그가 어디로 돌이키든지 벌을 내렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 그들을 정죄하였다’로 더 직역할 수 있습니다. 히브리어 동사는 ‘유죄로 선언하다’는 뜻도 지니지만, 여기서는 원수들에게 징벌적 패배를 가한 뜻으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד הַמְּלוּכָה
  english_pob_choice: had secured the kingship
  chosen_korean: 왕권을 장악했고
  alternatives_korean:
  - 왕국을 차지했고
  - 통치를 장악했고
  - 왕위권을 확보했고
  lexicon: HALOT
  rationale: לָכַד는 ‘붙잡다/점령하다’의 강한 동사이지만, כאן에서는 사울이 이스라엘 위에서 왕권을 굳힌 상황을 가리키므로 ‘장악하다’가 POB의 ‘secured’와 가장 가깝게 그 의미를 살립니다.
- source_word: הַמְּלוּכָה
  english_pob_choice: the kingship
  chosen_korean: 왕권
  alternatives_korean:
  - 왕위
  - 왕국
  - 통치
  lexicon: HALOT
  rationale: 여기서는 영토인 ‘왕국’보다 왕의 직분·통치권을 뜻하는 추상명사로 읽는 것이 자연스러워 ‘왕권’으로 옮겼습니다.
- source_word: יַרְשִׁיעַ
  english_pob_choice: he inflicted punishment
  chosen_korean: 벌을 내렸습니다
  alternatives_korean:
  - 정죄했습니다
  - 유죄로 선언했습니다
  - 징벌했습니다
  lexicon: HALOT
  rationale: 히필형 רשע는 문맥상 적들을 전투로 벌주고 패배시키는 뜻으로 이해되므로, 법정적 ‘정죄’보다 전투적 결과를 드러내는 ‘벌을 내리다’가 한국어에서 덜 오해를 낳습니다.
theological_decisions:
- issue: יַרְשִׁיעַ의 의미 범위
  chosen_reading: 군사적 승리 자체를 넘어, 원수들에게 징벌적 패배를 가하는 표현으로 읽었습니다.
  alternative_readings:
  - 법정적으로 ‘정죄하다’로 읽기
  - 단순히 ‘악을 행하다’로 읽기
  rationale: 문맥이 국가 간 전쟁 목록과 연결되어 있으므로, משפט용어처럼만 좁히거나 도덕적 악행으로 바꾸면 본문의 군사적/사법적 중첩을 약화시킵니다.
  doctrine_reference: 문맥 우선의 어휘 결정; 전쟁 서술에서의 히브리어 히필 רשע 사용
