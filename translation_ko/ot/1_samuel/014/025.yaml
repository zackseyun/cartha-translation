base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/025.yaml
  text: And all the people of the land entered the forest[b][a], and there was honey on the surface of the ground.
  footnotes:
  - marker: a
    text: Hebrew literally, 'all the land entered the forest'; the translation makes explicit the likely collective sense, 'the people of the land.'
    reason: lexical_alternative
  - marker: b
    text: Or 'on the face of the field.' The Hebrew idiom may refer to honey lying across the visible ground surface.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 땅의 모든 사람이[a] 숲으로 들어갔는데, 땅 위에는 꿀이 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 땅 전체가’입니다. 여기서는 문맥상 그 땅의 사람들을 가리키는 집합적 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘들판 위에는’. 히브리어 ‘들의 표면 위에’라는 표현은 보이는 지면 위에 놓여 있음을 나타내며, 이 문맥에서는 일반적으로 ‘땅 위에’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הָ/אָ֖רֶץ
  english_pob_choice: all the people of the land
  chosen_korean: 그 땅의 모든 사람
  alternatives_korean:
  - 그 땅 전체
  - 온 나라
  - 그 땅의 모든 백성
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그 땅 전체’이지만, 문맥상 실제 대상은 장소가 아니라 그곳의 사람들을 가리키는 집합적 표현으로 읽는 것이 자연스럽습니다. 한국어에서는 이를 ‘그 땅의 모든 사람’으로 옮겨 메톤미를 드러냈습니다.
- source_word: בָּ֣אוּ
  english_pob_choice: entered
  chosen_korean: 들어갔는데
  alternatives_korean:
  - 들어갔습니다
  - 들어갔고
  - 들어왔는데
  lexicon: HALOT
  rationale: בוא는 ‘들어가다/들어오다’의 뜻을 가지며, 뒤의 ‘숲으로’와 함께 단순 이동보다 진입의 동작이 분명합니다. 서술 흐름을 살려 ‘들어갔는데’로 옮겼습니다.
- source_word: בַ/יָּ֑עַר
  english_pob_choice: the forest
  chosen_korean: 숲
  alternatives_korean:
  - 숲속
  - 산림
  - 삼림
  lexicon: HALOT
  rationale: יַעַר는 숲이나 우거진 수목 지대를 가리키므로 현대 한국어의 자연스러운 대응은 ‘숲’입니다.
- source_word: עַל פְּנֵ֥י הַ/שָּׂדֶֽה
  english_pob_choice: on the surface of the ground
  chosen_korean: 들판의 표면 위에는
  alternatives_korean:
  - 들판의 겉면에는
  - 땅 위에는
  - 들판 위에는
  lexicon: HALOT
  rationale: עַל־פְּנֵי의 관용적 의미는 ‘~의 표면 위에’입니다. שָׂדֶה는 여기서 숲과 대비되는 노출된 지면/들판의 이미지로 읽히므로, 직역을 유지하되 한국어 어색함을 줄여 ‘들판의 표면 위에는’으로 옮겼습니다.
