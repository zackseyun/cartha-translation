  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ חַ֔יִל וַ/יַּ֖ךְ אֶת עֲמָלֵ֑ק וַ/יַּצֵּ֥ל אֶת יִשְׂרָאֵ֖ל מִ/יַּ֥ד שֹׁסֵֽ/הוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/048.yaml
  text: He fought valiantly and struck Amalek[c][b][a], and he delivered Israel from the hand of those who plundered it.
  footnotes:
  - marker: a
    text: Hebrew 'did valor/strength,' an idiom meaning he acted bravely or achieved military success.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Amalek,' referring to the Amalekite people.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'from the hand of his plunderer'; the singular is naturally understood collectively with 'Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 용맹스럽게 싸워 아말렉을 쳤고, 이스라엘을 그 약탈자의 손에서 구해 내셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘עשה חיל’은 문자적으로 ‘힘을 행하다’에 가깝지만, 여기서는 용맹하게 싸우거나 군사적 성공을 거두었다는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아말렉’은 여기서 아말렉 사람들 전체를 가리키는 집합적 표기입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그의 약탈자’의 단수형이지만, 문맥상 이스라엘 전체를 노린 집합적 의미로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ חַיִל
  english_pob_choice: fought valiantly
  chosen_korean: 용맹스럽게 싸워
  alternatives_korean:
  - 큰일을 이루어
  - 용기를 내어 싸워
  - 강하게 싸워
  lexicon: HALOT
  rationale: עשה חיל은 문자적으로 ‘힘을 내다’가 아니라 전투 맥락에서 용맹과 군사적 성공을 뜻하므로, 한국어에서는 자연스럽게 ‘용맹스럽게 싸워’로 옮겼습니다.
- source_word: וַיַּךְ אֶת עֲמָלֵק
  english_pob_choice: struck Amalek
  chosen_korean: 아말렉을 쳤고
  alternatives_korean:
  - 아말렉을 쳐부수었고
  - 아말렉을 무찔렀고
  - 아말렉을 쳤으며
  lexicon: HALOT
  rationale: נכה는 ‘치다/쳐부수다/무찌르다’의 폭을 가지며, 여기서는 히브리어의 직접적인 군사적 이미지와 간결함을 살려 ‘쳤고’로 번역했습니다.
- source_word: וַיַּצֵּל אֶת יִשְׂרָאֵל מִיַּד שֹׁסֵהוּ
  english_pob_choice: delivered Israel from the hand of those who plundered it
  chosen_korean: 이스라엘을 그 약탈자의 손에서 구해 내셨습니다
  alternatives_korean:
  - 이스라엘을 그 약탈자들의 손에서 건져 내셨습니다
  - 이스라엘을 약탈하는 자의 손에서 구하셨습니다
  - 이스라엘을 그 빼앗는 자의 손에서 건져 내셨습니다
  lexicon: HALOT
  rationale: נצל은 ‘구출하다/건져내다/구해내다’의 뜻이며, ‘from the hand of’는 권세 아래 있음을 나타내는 관용구입니다. 히브리어의 단수 분사 שֹׁסֵהוּ는 ישראל을 집합적으로 가리키므로 한국어에서는 단수 집합 의미의 ‘약탈자’로 살렸습니다.
theological_decisions:
- issue: 이스라엘을 구해 내신 주체의 시제와 서술 방식
  chosen_reading: 역사 서술의 흐름에 맞추어 인간 주어의 행위를 묘사하되, 마지막 구절은 구원 동사의 직접성을 살려 ‘구해 내셨습니다’로 옮겼습니다.
  alternative_readings:
  - 구해 내었습니다
  - 구원하셨습니다
  - 건져 주셨습니다
  rationale: 본문은 왕의 군사적 성취를 요약하면서 동시에 출애굽-구원 어휘와 유사한 ‘구출’ 이미지를 사용합니다. 한국어에서는 과도한 신학적 확대 없이도 이 구원의 직접성을 보존하는 표현이 적절합니다.
  doctrine_reference: 서사적 구원 언어의 보존
