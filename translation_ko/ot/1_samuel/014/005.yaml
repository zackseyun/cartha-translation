  text: One crag stood on the north[a], opposite Michmash, and the other on the south[b], opposite Geba.
  footnotes:
  - marker: a
    text: Hebrew literally says 'the tooth,' a metaphor for a sharp rocky projection; hence 'crag.'
    reason: lexical_alternative
  - marker: b
    text: Some English translations read 'Gibeah' here, but the Hebrew place name is Geba.
    reason: alternative_reading
translation:
  language: ko
  text: 바위턱 하나는[a] 믹마스 맞은편 북쪽에 있고, 다른 하나는 게바[b] 맞은편 남쪽에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘이빨’이며, 여기서는 날카롭게 돌출한 바위 지형을 비유적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 번역은 이곳을 ‘기브아’로 읽지만, 히브리어 지명은 ‘게바’입니다.
    reason: alternative_reading
