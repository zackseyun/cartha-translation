  - 북으로 / 남으로
  lexicon: HALOT
  rationale: 대조 구조를 그대로 드러내기 위해 방향을 평이한 현대 한국어로 옮겼습니다.
- source_word: גָּבַע
  english_pob_choice: Geba
  chosen_korean: 게바
  alternatives_korean:
  - 기브아
  lexicon: standard transliteration
  rationale: 본문의 מקום명은 게바로 읽는 것이 문맥과 자음 형태에 맞으며, 기브아로 바꾸면 지리적 식별이 흐려집니다.
