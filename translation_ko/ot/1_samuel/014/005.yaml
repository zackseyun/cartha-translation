base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/005.yaml
  text: One crag stood on the north[a], opposite Michmash, and the other on the south[b], opposite Geba.
  footnotes:
  - marker: a
    text: Hebrew literally says 'the tooth,' a metaphor for a sharp rocky projection; hence 'crag.'
    reason: lexical_alternative
  - marker: b
    text: Some English translations read 'Gibeah' here, but the Hebrew place name is Geba.
    reason: alternative_reading
translation:
  language: ko
  text: 한 쪽은 미스마스 맞은편 북쪽에 있는 뾰족한 바위요, 다른 쪽은 게바 맞은편 남쪽에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 원문은 문자적으로는 ‘이빨’이지만, 여기서는 날카롭게 솟은 바위 지형을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 번역은 여기서 ‘기브아’로 읽지만, 히브리어 지명은 ‘게바’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֵּׁן
  english_pob_choice: crag
  chosen_korean: 뾰족한 바위
  alternatives_korean:
  - 바위턱
  - 절벽
  - 바위산
  lexicon: HALOT
  rationale: 직역하면 ‘이빨’이지만, 여기서는 날카롭게 솟은 바위 지형을 가리키므로 한국어 자연성을 살리되 원래의 날카로운 형상을 유지하는 표현을 택했습니다.
- source_word: מָצוּק
  english_pob_choice: stood
  chosen_korean: 있었습니다
  alternatives_korean:
  - 서 있었습니다
  - 자리하고 있었습니다
  - 솟아 있었습니다
  lexicon: HALOT
  rationale: 지형의 존재를 서술하는 구조이므로 과도한 해석 없이 위치를 말하는 한국어로 옮겼습니다.
- source_word: מִצָּפוֹן / מִנֶּגֶב
  english_pob_choice: on the north / on the south
  chosen_korean: 북쪽 / 남쪽
  alternatives_korean:
