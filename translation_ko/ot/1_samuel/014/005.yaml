  rationale: 지형의 존재를 서술하는 구조이므로 과도한 해석 없이 위치를 말하는 한국어로 옮겼습니다.
- source_word: מִצָּפוֹן / מִנֶּגֶב
  english_pob_choice: on the north / on the south
