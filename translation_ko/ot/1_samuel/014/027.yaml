  naturalness: ‘꿀송이’는 현대 표준 한국어에서 꿀벌집 또는 조밀한 꿀의 덩어리를 뜻하는 말로 즉시 이해되기 다소 어렵습니다. ‘꿀 무더기’가 문맥상 자연스럽고, 주석으로 히브리어의 특이한 표현 및 ‘꿀집’ 가능성을 보완할 수 있습니다. 또한 각주 표지는 해당 어구와 관용구 바로 뒤에 두는 편이 명확합니다.
