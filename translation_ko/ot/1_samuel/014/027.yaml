  text: וְ/יוֹנָתָ֣ן לֹֽא שָׁמַ֗ע בְּ/הַשְׁבִּ֣יעַ אָבִי/ו֮ אֶת הָ/עָם֒ וַ/יִּשְׁלַ֗ח אֶת קְצֵ֤ה הַ/מַּטֶּה֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/יִּטְבֹּ֥ל אוֹתָ֖/הּ בְּ/יַעְרַ֣ת הַ/דְּבָ֑שׁ וַ/יָּ֤שֶׁב יָד/וֹ֙ אֶל פִּ֔י/ו ו/תראנה עֵינָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/027.yaml
  text: But Jonathan had not heard when his father put the people under oath[a], so he stretched out the tip of the staff that was in his hand and dipped it into the honeycomb, and he brought his hand to his mouth[b], and his eyes brightened.
  footnotes:
  - marker: a
    text: Or, more literally, 'into the forest/thicket of honey'; the Hebrew expression likely refers to a honeycomb or dense mass of honey.
    reason: lexical_alternative
  - marker: b
    text: '''His eyes brightened'' is a Hebrew idiom indicating renewed strength or alertness after eating.'
    reason: cultural_note
translation:
  language: ko
  text: 요나단은 아버지가 백성에게 맹세하게 했을 때 그 말을 듣지 못했으므로, 손에 든 막대기의 끝을 내밀어 그것을 꿀 무더기[a]에 담갔다가 손을 입으로 가져갔습니다. 그러자 그의 눈이 밝아졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘꿀의 숲/수풀’입니다. 히브리어 표현은 여기서 꿀집 또는 짙게 모인 꿀 무더기를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 눈이 밝아졌다’는 먹은 뒤 기력과 주의가 회복되었음을 나타내는 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא שָׁמַע
  english_pob_choice: had not heard
  chosen_korean: 듣지 못했으므로
  alternatives_korean:
  - 알지 못했으므로
  - 듣지 못하였으므로
  lexicon: HALOT
  rationale: 이 문맥에서는 불순종이 아니라 사울의 맹세 선포를 요나단이 인지하지 못한 상태를 뜻하므로, '듣지 못하다'가 가장 직접적입니다.
- source_word: בְּהַשְׁבִּיעַ אָבִיו אֶת הָעָם
  english_pob_choice: when his father put the people under oath
  chosen_korean: 아버지가 백성에게 맹세를 시켰을 때
  alternatives_korean:
  - 아버지가 백성에게 맹세하게 했을 때
  - 아버지가 백성을 맹세 아래 두었을 때
  lexicon: HALOT
  rationale: 히필 שבע의 의미를 살려 '맹세를 시키다'로 옮기면, 단순한 감정적 당부가 아니라 법적·언약적 강제력을 드러낼 수 있습니다.
- source_word: קְצֵה הַמַּטֶּה
  english_pob_choice: the tip of the staff
  chosen_korean: 막대기의 끝
  alternatives_korean:
  - 지팡이의 끝
  - 막대 끝
  lexicon: HALOT
  rationale: '''tip''의 기능을 자연스럽게 살리되, 전투·이동 맥락의 handheld object로서 ''막대기''가 가장 무난합니다.'
- source_word: בְּיַעְרַת הַדְּבָשׁ
  english_pob_choice: into the honeycomb
  chosen_korean: 꿀송이
  alternatives_korean:
  - 꿀벌집
  - 꿀이 든 숲
  - 꿀집
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지가 있으나, 문맥상 찍어 먹는 대상은 꿀덩이/꿀송이로 이해되는 것이 가장 자연스럽고, POB의 'honeycomb' 판단과도 부합합니다.
- source_word: וַתָּרְאֶנָה עֵינָיו
  english_pob_choice: his eyes brightened
  chosen_korean: 그의 눈이 밝아졌습니다
  alternatives_korean:
  - 그의 눈이 환해졌습니다
  - 그의 눈이 반짝였습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 식후에 기력이 회복되는 상태를 뜻하므로, 시각적 은유를 살리면서도 현대 한국어에서 자연스러운 '눈이 밝아지다'로 옮겼습니다.
theological_decisions:
- issue: 사울의 맹세 선포가 단순한 권유인지, 백성을 구속하는 서약인지
  chosen_reading: 사울이 백성에게 실제로 맹세를 시켰다는 법적·공동체적 구속력으로 옮겼습니다.
  alternative_readings:
  - 사울이 백성에게 엄하게 당부했다
  - 사울이 백성을 저주 아래 놓았다
  rationale: 히필 שבע는 '맹세하게 하다'의 강한 의미를 가지므로, 본문이 보여 주는 구속적 긴장을 약화시키지 않기 위해 서약의 강제를 분명히 했습니다.
  doctrine_reference: OT covenant/oath language
