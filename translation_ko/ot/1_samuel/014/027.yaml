  to: 요나단은 아버지가 백성에게 맹세하게 했을 때 그 말을 듣지 못했으므로, 손에 든 막대기의 끝을 내밀어 그것을 꿀 무더기[a]에 담갔다가 손을 입으로 가져갔습니다. 그러자 그의 눈이 밝아졌습니다.[b]
