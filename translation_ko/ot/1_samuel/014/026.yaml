    rationale: ‘감김’은 הֵלֶךְ의 의미가 아니며 독자에게 잘못된 어휘 정보를 제공합니다. 문자적 설명은 ‘꿀의 흘러감/흐름’으로 제시해야 합니다.
  - severity: low
    issue: 각주 c가 앞절의 저주 조항을 충분히 설명하지 않음
    rationale: 영어 POB 감사 기록은 사울의 맹세가 저녁 전 먹는 자에게 저주를 선언한 맹세였음을 명시합니다. 한국어 각주에도 이 문맥 정보를 간략히 반영하는 편이 앵커의 기능에 맞습니다.
