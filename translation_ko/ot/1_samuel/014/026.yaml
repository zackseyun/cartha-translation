id: 1SA.14.26
reference: 1 Samuel 14:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֤א הָ/עָם֙ אֶל הַ/יַּ֔עַר וְ/הִנֵּ֖ה הֵ֣לֶךְ דְּבָ֑שׁ וְ/אֵין מַשִּׂ֤יג יָד/וֹ֙ אֶל פִּ֔י/ו כִּֽי יָרֵ֥א הָ/עָ֖ם אֶת הַ/שְּׁבֻעָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/026.yaml
  text: When the people came into the forest[a], behold, there was a flow of honey, but no one put his hand to his mouth[c][b], because the people feared the oath.
  footnotes:
  - marker: a
    text: Or, 'honey was flowing' or 'a stream of honey.' The Hebrew expression is literally 'a going/flow of honey.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'no one put his hand to his mouth,' an idiom meaning no one ate any of the honey.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew says 'the oath'; in context this refers to Saul's earlier oath that effectively placed a curse on anyone who ate before evening (see 1 Sam 14:24).
    reason: cross_reference
translation:
  language: ko
  text: 백성이 숲에 이르렀을 때, 보라, 꿀이 흘러내리고 있었습니다[a]. 그러나 백성 중 아무도 자기 손을 입에 대지 않았습니다[b]. 백성이 그 맹세를 두려워했기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘꿀이 흘러나오고 있었다’, ‘꿀의 흐름이 있었다’로도 옮길 수 있습니다. 히브리어 표현은 문자적으로 ‘꿀의 감김/흐름’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘아무도 자기 손을 입에 대지 않았다’입니다. 이는 꿀을 먹지 않았다는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘그 맹세’를 말합니다. 문맥상 이는 14:24에서 사울이 선포한 맹세를 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא הָעָם אֶל הַיַּעַר
  english_pob_choice: When the people came into the forest
  chosen_korean: 백성이 숲에 이르렀을 때
  alternatives_korean:
  - 백성이 숲으로 들어왔을 때
  - 백성이 숲에 들어갔을 때
  lexicon: HALOT
  rationale: 와이익톨의 단순 과거 이동을 자연스러운 한국어로 옮기되, 군사 문맥에서도 원문의 ‘백성’을 유지했습니다.
- source_word: הֵלֶךְ דְּבָשׁ
  english_pob_choice: a flow of honey
  chosen_korean: 꿀이 흘러내리고 있었습니다
  alternatives_korean:
  - 꿀의 흐름이 있었습니다
  - 꿀이 흐르고 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘흐름/움직임’ 이미지를 살리면서도 한국어에서 이해 가능한 서술형으로 풀었습니다.
- source_word: וְאֵין מַשִּׂיג יָדוֹ אֶל פִּיו
  english_pob_choice: but no one put his hand to his mouth
  chosen_korean: 그러나 백성 중 아무도 자기 손을 입에 대지 않았습니다
  alternatives_korean:
  - 그러나 아무도 자기 손을 입에 가져가지 않았습니다
  - 그러나 아무도 손을 입으로 가져오지 않았습니다
  lexicon: HALOT
  rationale: 직역적 몸짓을 유지하되, 한국어에서는 ‘입에 대다’가 가장 자연스럽게 원문의 금식/섭취 금지를 드러냅니다.
- source_word: הַשְּׁבֻעָה
  english_pob_choice: the oath
  chosen_korean: 그 맹세
  alternatives_korean:
  - 그 oath
  - 그 서약
  lexicon: HALOT
  rationale: 본문의 법적·서약적 성격을 살리면서 한국어 성경 문맥에서 가장 자연스러운 ‘맹세’로 옮겼습니다.
theological_decisions:
- issue: 사울의 금식 명령에 대한 공동체의 두려움 표현
  chosen_reading: ‘백성이 그 맹세를 두려워했다’로 옮겨, 단순한 음식 기피가 아니라 위반 시의 금기성과 제재를 의식한 두려움을 드러냈습니다.
  alternative_readings:
  - ‘백성이 그 맹세 때문에 두려워했다’
  - ‘백성이 그 맹세를 무서워했다’
  rationale: 문맥상 두려움은 꿀 자체가 아니라 사울의 선포된 맹세에서 비롯됩니다. 따라서 원인의 중심을 맹세에 두는 번역이 더 정확합니다.
  doctrine_reference: 1 Samuel 14:24-28 문맥
- issue: ‘맹세’와 ‘저주’의 관계
  chosen_reading: 주본문에는 ‘맹세’를 유지하고, 저주 의미는 본절의 문맥 정보로만 암시했습니다.
  alternative_readings:
  - ‘저주’를 본문에 직접 반영
  - ‘선언’을 사용
  rationale: 영어 POB도 ‘the oath’를 유지하고 문맥 주석으로 저주적 효력을 설명하므로, 본문은 어휘를 보존하는 편이 source-grounded합니다.
  doctrine_reference: 본문 어휘 보존 원칙
