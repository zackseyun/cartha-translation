  verdict: revise
  source_fidelity: ‘흘러내리고’는 히브리어 הֵלֶךְ(‘흐름, 흘러감’)에 없는 아래쪽 방향성을 더하므로 ‘흐르고’로 고쳐야 합니다. 또한 각주 a의 ‘감김’은 어휘적으로 부정확합니다. 나머지 핵심 표현인 ‘백성’, ‘그 맹세’, 손을 입으로 가져가는 관용적 묘사는 원문에 충실합니다.
  naturalness: 합쇼체 서술은 대체로 자연스럽지만, ‘보라’는 현대 표준어 합쇼체 문맥에서는 다소 문어적·비격식적으로 들릴 수 있어 ‘보십시오’로 조정했습니다. ‘아무도 손을 입에 가져가지 않았습니다’는 원문의 구체적 몸짓을 보존하면서 자연스럽습니다.
  terminology: ‘맹세’는 הַשְּׁבֻעָה의 적절한 번역입니다. 본문에서는 ‘저주’로 바꾸지 않고, 각주에서 앞절의 저주적 효력을 설명하는 것이 적절합니다.
