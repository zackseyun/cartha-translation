    issue: ‘꿀이 흘러내리고 있었습니다’
    rationale: ‘흘러내리다’는 아래로 떨어지는 방향을 함축하지만, הֵלֶךְ דְּבָשׁ는 꿀의 흐름 또는 흘러감을 말할 뿐 그 방향을 명시하지 않습니다.
  - severity: medium
