  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם אֶל שָׁא֗וּל הֲֽ/יוֹנָתָ֤ן יָמוּת֙ אֲשֶׁ֣ר עָ֠שָׂה הַ/יְשׁוּעָ֨ה הַ/גְּדוֹלָ֣ה הַ/זֹּאת֮ בְּ/יִשְׂרָאֵל֒ חָלִ֗ילָ/ה חַי יְהוָה֙ אִם יִפֹּ֞ל מִ/שַּׂעֲרַ֤ת רֹאשׁ/וֹ֙ אַ֔רְצָ/ה כִּֽי עִם אֱלֹהִ֥ים עָשָׂ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּפְדּ֥וּ הָ/עָ֛ם אֶת יוֹנָתָ֖ן וְ/לֹא מֵֽת־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/045.yaml
  text: But the people said to Saul[a], “Should Jonathan die, who has brought about this great deliverance in Israel? Far from it! As Yahweh lives, not one hair of his head shall fall to the ground, for he has worked with God this day.” So the people redeemed Jonathan[d][c][b], and he did not die.
  footnotes:
  - marker: a
    text: Or 'this great salvation' or 'this great victory.' The Hebrew יְשׁוּעָה can denote deliverance, salvation, or victory depending on context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Far be it!' A strong expression of rejection; traditionally also rendered 'Certainly not' or 'May it never be.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'for with God he has acted/worked today.' The wording emphasizes that Jonathan's action was carried out in concert with divine aid or favor.
    reason: lexical_alternative
  - marker: d
    text: Or 'redeemed Jonathan' or 'rescued Jonathan.' The verb carries the sense of securing release from a claim or sentence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 백성이 사울에게 말했습니다. “요나단이 죽어야 합니까? 그가 이스라엘에서 이 큰 구원을 이루었는데 말입니다. 결코 그럴 수 없습니다! 야훼께서 살아 계심과 같이, 그의 머리카락 한 올도 땅에 떨어지지 않을 것입니다. 그는 오늘 하나님과 함께 일했기 때문입니다.” 그래서 백성은 요나단을 구속하여 살려 냈고, 그는 죽지 않았습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''이 큰 구원''은 문맥상 ''이 큰 구출'' 또는 ''이 큰 승리''로도 옮길 수 있습니다. 히브리어 יְשׁוּעָה는 문맥에 따라 구원, 구출, 승리를 뜻할 수 있습니다.'
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 강한 거부 표현인 '결코 그럴 수 없다'에 해당합니다. 전통적으로는 '정녕 아니할지라' 등으로도 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 '그는 오늘 하나님과 함께/더불어 행했다'입니다. 본문은 하나님의 도움이나 동행을 암시하지만, 그 이상으로 설명하지는 않습니다.
    reason: lexical_alternative
  - marker: d
    text: '''구속하다''는 값을 치르거나 권리를 해제하여 풀어 준다는 뜻을 가집니다. 문맥상 ''구해 내다/구출하다''로도 옮길 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיוֹנָתָן יָמוּת
  english_pob_choice: Should Jonathan die
  chosen_korean: 요나단이 죽어야 합니까?
  alternatives_korean:
  - 요나단이 죽습니까?
  - 요나단이 죽어야 합니까?
  lexicon: HALOT
  rationale: 의문사 הֲ와 미완료 동사가 만드는 격한 반문을 살리기 위해 단순 미래형보다 반문형으로 옮겼습니다.
- source_word: הַיְשׁוּעָה הַגְּדוֹלָה הַזֹּאת
  english_pob_choice: this great deliverance
  chosen_korean: 이 큰 구원
  alternatives_korean:
  - 이 큰 구출
  - 이 큰 승리
  lexicon: HALOT
  rationale: יְשׁוּעָה의 구출·구원·승리 가능성을 열어 두되, 본문이 전쟁 맥락 속에서도 구원의 의미를 띠므로 '구원'을 택했습니다.
- source_word: חָלִילָה
  english_pob_choice: Far from it
  chosen_korean: 결코 그럴 수 없습니다!
  alternatives_korean:
  - 그럴 리 없습니다!
  - 절대로 안 됩니다!
  lexicon: HALOT
  rationale: 강한 거부 표현을 현대 한국어의 자연스러운 반문/부정으로 옮겨, 단순한 예의적 부정보다 격렬한 반대를 드러냈습니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서 살아 계심과 같이
  alternatives_korean:
  - 야훼의 생명을 두고
  - 야훼께서 살아 계십니다
  lexicon: HALOT
  rationale: 맹세 공식이므로 직역에 가까운 한국어 관용을 사용해 엄숙한 맹세의 무게를 유지했습니다.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת רֹאשׁוֹ אַרְצָה
  english_pob_choice: not one hair of his head shall fall to the ground
  chosen_korean: 그의 머리카락 한 올도 땅에 떨어지지 않을 것입니다
  alternatives_korean:
  - 그의 머리카락 한 올도 땅으로 떨어지지 않을 것입니다
  - 머리털 하나도 떨어지지 않을 것입니다
  lexicon: HALOT
  rationale: '''한 올도''로 히브리 관용의 전면적 보호를 자연스럽게 살렸습니다.'
- source_word: כִּי עִם אֱלֹהִים עָשָׂה
  english_pob_choice: for he has worked with God
  chosen_korean: 그는 오늘 하나님과 함께 일했기 때문입니다
  alternatives_korean:
  - 그는 오늘 하나님과 함께 행동했기 때문입니다
  - 그는 오늘 하나님과 더불어 일했기 때문입니다
  lexicon: HALOT
  rationale: עִם의 '함께'를 보존하면서 עשה의 넓은 '행하다/일하다' 의미를 살렸습니다. 영어 POB가 유지한 신학적 긴장도 그대로 반영합니다.
- source_word: וַיִּפְדּוּ הָעָם אֶת יוֹנָתָן
  english_pob_choice: So the people redeemed Jonathan
  chosen_korean: 백성은 요나단을 구속하여 살려 냈고
  alternatives_korean:
  - 백성은 요나단을 구속했고
  - 백성은 요나단을 구해 냈고
  lexicon: HALOT
  rationale: פדה의 '값을 치르고/책임을 지며 풀어 주다'는 뉘앙스를 살리기 위해 '구속하다'를 쓰되, 결과를 분명히 하기 위해 '살려 냈다'를 덧붙였습니다.
- source_word: וְלֹא מֵת
  english_pob_choice: and he did not die
  chosen_korean: 그는 죽지 않았습니다
  alternatives_korean:
  - 그리고 그는 죽지 않았습니다
  - 그리하여 그는 죽지 않았습니다
  lexicon: HALOT
  rationale: 결과 절을 간명하게 옮겨 본문의 종결감을 유지했습니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה를 음역형인 '야훼'로 옮겨 원문 고유명과 언약적 직접성을 보존했습니다.
  doctrine_reference: 'POB terminology: יְהוָה / YHWH → 야훼'
- issue: '''함께 하나님과''라는 표현의 신학적 긴장'
  chosen_reading: 그는 오늘 하나님과 함께 일했기 때문입니다
  alternative_readings:
  - 그는 오늘 하나님의 도움으로 일했기 때문입니다
  - 그는 오늘 하나님을 위해 일했기 때문입니다
  rationale: עִם אֱלֹהִים의 직접적인 '함께'를 유지해, 요나단의 행동을 하나님의 도움이나 목적에만 환원하지 않고 본문이 말하는 협력의 긴장을 남겨 두었습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension'
