    issue: ‘요나단을 구속하여 살려 냈고’
    rationale: ‘구속하다’는 현대어에서 체포·감금의 뜻이 우세하여 반대 의미로 오해될 수 있습니다. 또한 ‘살려 냈고’는 פדה 자체와 뒤따르는 ‘그는 죽지 않았습니다’ 이상의 결과를 중복적으로 서술합니다.
  - severity: low
    issue: 각주 표지가 모두 절 끝에 배치됨
    rationale: 각주가 설명하는 어휘 또는 표현 바로 뒤에 표지를 두어 독자가 각주의 적용 범위를 분명히 알 수 있게 해야 합니다.
  - severity: low
    issue: ‘하나님과 함께 일했기 때문입니다’
    rationale: ‘일하다’는 현대어에서 직업적·일상적 노동의 인상이 강합니다. עָשָׂה의 넓은 행위 의미와 엄숙한 문맥에는 ‘행했다’가 더 적합합니다.
