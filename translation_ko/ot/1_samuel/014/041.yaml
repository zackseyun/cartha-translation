  source_fidelity: 마소라 본문의 짧고 난해한 청원문을 본문에 유지한 점과, 요나단과 사울이 제비로 지목되고 백성이 벗어난 결과를 옮긴 점은 원문에 대체로 충실합니다. 다만 תָמִים 뒤에 ‘제비’라는 명사가 히브리어에 명시되어 있지 않으므로, 각주의 ‘문자적으로’라는 설명은 이를 정확히 밝혀야 합니다.
  naturalness: ‘완전한 제비를 내려 주십시오’는 이해는 가능하지만 현대 표준 한국어에서는 다소 어색합니다. ‘흠 없는 제비를 내려 주십시오’가 제비뽑기 문맥과 합쇼체를 더 자연스럽게 살립니다. 제비뽑기의 결과인 וַיִּלָּכֵד는 체포의 뉘앙스를 낼 수 있는 ‘잡혔고’보다 ‘지목되었고’가 더 명료합니다.
  terminology: ‘야훼’는 영어 POB의 Yahweh 및 제시된 번역 방침과 일치합니다. ‘흠 없는’은 תָמִים의 의미 범위를 자연스럽게 반영하되, 이것이 정확한 판정 또는 결정이라는 문맥상 의미는 각주에서 설명합니다. 긴 독법의 신명은 본문 표기와 일관되게 ‘야훼’로 표기합니다.
