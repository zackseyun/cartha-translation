base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/041.yaml
  text: Then Saul said to Yahweh[a], the God of Israel, “Give a perfect lot.” And Jonathan and Saul were taken, but the people escaped.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Give perfect/blameless.'' The sense is likely a request for an unimpeachable decision by lot; compare the longer ancient reading preserved in the Septuagint: ''Why have you not answered your servant today? If this guilt is in me or in Jonathan my son, O LORD God of Israel, give Urim; but if it is in your people Israel, give Thummim.'''
    reason: textual_variant
translation:
  language: ko
  text: 그러자 사울이 야훼, 곧 이스라엘의 하나님께 말했습니다. “완전한 제비를 내려 주십시오.” 그러자 요나단과 사울이 잡혔고, 백성은 빠져나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘완전한/흠없는(제비)’를 뜻합니다. 문맥상 제비뽑기에서 흠 없는 판정을 구하는 표현으로 보이며, 더 긴 고대 독법은 칠십인역에 보존되어 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명사 표기를 한국어로는 프로젝트 기본값에 따라 야훼로 옮겨, 고유한 이름을 보존했습니다.
- source_word: הָבָה תָמִים
  english_pob_choice: Give a perfect lot
  chosen_korean: 완전한 제비를 내려 주십시오
  alternatives_korean:
  - 흠없는 제비를 내려 주십시오
  - 완전한 결정을 내려 주십시오
  - 옳은 판정을 내려 주십시오
  lexicon: HALOT
  rationale: תָמִים의 ‘완전한/흠없는’ 의미를 살리되, 이 문맥이 제비뽑기 판정임을 반영해 한국어에서는 ‘제비’를 보충했습니다.
- source_word: וַיִּלָּכֵד
  english_pob_choice: were taken
  chosen_korean: 잡혔고
  alternatives_korean:
  - 선택되었고
  - 붙들렸고
  - 걸려들었고
  lexicon: HALOT
  rationale: 제비뽑기 맥락에서 ‘선정되다’보다 더 직접적으로 ‘걸려 잡히다’는 수동적 결과를 살렸습니다.
- source_word: יָצָאוּ
  english_pob_choice: escaped
  chosen_korean: 빠져나갔습니다
  alternatives_korean:
  - 나갔습니다
  - 벗어났습니다
  - 면했습니다
  lexicon: HALOT
  rationale: 앞의 두 인물이 ‘잡혔음’과 대비되므로, 백성은 그 판정에서 빠져나간 것으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 본문의 짧은 마소라 본문과 긴 칠십인역형 독법의 관계
  chosen_reading: 본문은 마소라 본문처럼 짧은 청원문을 유지하고, 긴 고대 독법은 각주로만 제시합니다.
  alternative_readings:
  - '"주님, 오늘 어째서 당신의 종에게 응답하지 않으셨습니까? 만일 이 죄가 제게나 제 아들 요나단에게 있으면, 이스라엘의 하나님 야훼여, 우림을 주십시오. 그러나 이 죄가 당신의 백성 이스라엘에게 있으면, 둠밈을 주십시오."'
  rationale: 원문 근거가 되는 히브리어 본문을 우선하고, 이해를 돕는 오래된 확장 독법은 본문에 흡수하지 않고 주석적 각주로만 남겼습니다.
  doctrine_reference: Translation philosophy §§1, 3
