id: 1SA.14.49
reference: 1 Samuel 14:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּֽהְיוּ֙ בְּנֵ֣י שָׁא֔וּל יוֹנָתָ֥ן וְ/יִשְׁוִ֖י וּ/מַלְכִּי שׁ֑וּעַ וְ/שֵׁם֙ שְׁתֵּ֣י בְנֹתָ֔י/ו שֵׁ֤ם הַ/בְּכִירָה֙ מֵרַ֔ב וְ/שֵׁ֥ם הַ/קְּטַנָּ֖ה מִיכַֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/049.yaml
  text: 'Now Saul’s sons were Jonathan[a], Ishvi, and Malchi-shua; and the names of his two daughters were these: the name of the firstborn was Merab[b], and the name of the younger was Michal.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'the name of his two daughters'; English uses 'the names' because two names are then given.
    reason: lexical_alternative
  - marker: b
    text: Or 'the elder' for 'the firstborn.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 사울의 아들들은 요나단, 이스위, 말기-수아였고, 그의 두 딸의 이름은 이렇습니다. 맏딸의 이름은 메랍이었고, 어린 딸의 이름은 미갈이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 두 딸의 이름’을 말하지만, 뒤에 두 이름이 오므로 한국어에서는 복수적 뜻을 자연스럽게 풀어 썼습니다.
    reason: source_note
  - marker: b
    text: ‘맏딸’은 문자 그대로는 ‘첫 태어난 딸’에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שָׁאוּל
  english_pob_choice: Saul’s sons
  chosen_korean: 사울의 아들들
  alternatives_korean:
  - 사울의 아들들
  - 사울의 자손들
  lexicon: WLC/HALOT
  rationale: 히브리어 소유격 구문을 자연스러운 한국어 속격으로 옮겼고, 문자 그대로의 ‘아들들’을 유지해 이 절이 아들들과 딸들을 구분하는 족보식 진술임을 살렸습니다.
- source_word: מַלְכִּי שׁוּעַ
  english_pob_choice: Malchi-shua
  chosen_korean: 말기-수아
  alternatives_korean:
  - 말기수아
  - 말키-수아
  lexicon: WLC
  rationale: 히브리어의 두 요소를 드러내되 한국어 표기에서는 하이픈으로 묶어 한 인명처럼 읽히게 했습니다.
- source_word: וְשֵׁם שְׁתֵּי בְנֹתָיו
  english_pob_choice: and the names of his two daughters were these
  chosen_korean: 그의 두 딸의 이름은 이렇습니다
  alternatives_korean:
  - 그의 두 딸의 이름은 이렇습니다
  - 그의 두 딸의 이름들은 이렇습니다
  lexicon: WLC/HALOT
  rationale: 히브리어는 단수 ‘이름’이지만 뒤에 두 이름이 이어지므로, 한국어에서는 목록을 여는 자연스러운 표현으로 풀어 옮겼습니다.
- source_word: הַבְּכִירָה
  english_pob_choice: the firstborn
  chosen_korean: 맏딸
  alternatives_korean:
  - 첫째 딸
  - 첫태생 딸
  - 첫딸
  lexicon: HALOT
  rationale: 이 문맥에서는 출생 순서를 가리키는 딸의 호칭이므로 ‘맏딸’이 가장 자연스럽고, POB의 ‘firstborn’이 암시하는 서열을 유지합니다.
- source_word: הַקְּטַנָּה
  english_pob_choice: the younger
  chosen_korean: 어린 딸
  alternatives_korean:
  - 동생 딸
  - 막내딸
  - 어린아이 같은 딸
  lexicon: HALOT
  rationale: 형제자매 관계에서의 상대적 연소함을 가리키므로, 나이의 대조가 드러나는 ‘어린 딸’로 옮겼습니다.
theological_decisions:
- issue: 족보/가족 공지문의 서술 톤
  chosen_reading: 서술문 형태를 유지해 인물 목록과 출생 순서를 객관적으로 전달했습니다.
  alternative_readings:
  - 문장 연결을 더 풀어 설명하는 방식
  - ‘처음 난 딸’처럼 의역을 강하게 하는 방식
  rationale: 본문은 신학적 논증보다 왕가 가족 구성의 기록이므로, 과도한 해설 없이 자료적 성격을 보존하는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 성경 본문 장르와 역사 서술의 평이성
