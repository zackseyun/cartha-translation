translation:
  language: ko
  text: 그날 그들이 믹마스에서 아일론까지 블레셋 사람들을 쳐부수었고, 백성은 매우 지쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 블레셋 사람들은 전투의 대상인 민족 집단을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: וַיַּכּוּ
  english_pob_choice: they struck down
  chosen_korean: 쳐부수었고
  alternatives_korean:
  - 쳤고
  - 무찔렀고
  - 격파했고
  lexicon: HALOT
  rationale: 전투 문맥의 완료된 행위를 나타내므로 단순히 ‘쳤다’보다 결과가 드러나는 표현을 택했습니다. 다만 ‘정복했다’처럼 의미를 넓히지는 않았습니다.
- source_word: מִמִּכְמָשׂ אַיָּלֹנָה
  english_pob_choice: from Mikmash to Aijalon
  chosen_korean: 믹마스에서 아일론까지
  alternatives_korean:
  - 미그마스에서 아일론까지
  - 믹마스에서 아이얄론까지
  lexicon: HALOT
  rationale: 지명은 영어 POB의 음역을 따라 현대 한국어 독자에게 읽히는 형태로 옮겼습니다. 종결 방향을 나타내는 히브리어 형태는 한국어의 ‘까지’로 자연스럽게 반영했습니다.
- source_word: וַיָּעַף ... מְאֹד
  english_pob_choice: were very weary
  chosen_korean: 매우 지쳤습니다
  alternatives_korean:
  - 몹시 피곤했습니다
  - 매우 피곤해졌습니다
  - 몹시 쇠약해졌습니다
  lexicon: HALOT
  rationale: הָעָם의 집단 상태를 한국어 자연문장으로 풀어 ‘백성은’에 맞는 서술어를 택했습니다. ‘지쳤습니다’는 지침/쇠약의 의미를 담되 과도하게 신체적 붕괴로 강하게 만들지 않습니다.
theological_decisions:
- issue: 전투 결과의 강도 표현
  chosen_reading: ‘쳐부수었고’로 군사적 압승을 드러내되, 본문이 말하는 범위를 넘는 전면적 멸절 의미는 부여하지 않았습니다.
  alternative_readings:
  - ‘쳤고’로 더 중립적으로 번역
  - ‘무찔렀고’로 일반화
  rationale: 히브리어 נכה의 전투적 용법을 살리면서도, 본문은 단순 승리 선언이 아니라 실제 타격을 말하므로 그 힘을 한국어에서 약화시키지 않도록 했습니다.
  doctrine_reference: 본문 해석상 어휘 강도 조절
