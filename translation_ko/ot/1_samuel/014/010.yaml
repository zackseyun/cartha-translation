id: 1SA.14.10
reference: 1 Samuel 14:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם כֹּ֨ה יֹאמְר֜וּ עֲל֤וּ עָלֵ֨י/נוּ֙ וְ/עָלִ֔ינוּ כִּֽי נְתָנָ֥/ם יְהוָ֖ה בְּ/יָדֵ֑/נוּ וְ/זֶה לָּ֖/נוּ הָ/אֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/010.yaml
  text: But if they say this[a], ‘Come up to us,’ then we will go up, for Yahweh has given them into our hand[b], and this will be the sign for us.
  footnotes:
  - marker: a
    text: Or, “Come up against us.” The Hebrew may emphasize approach toward the Philistines’ position, with hostile force implied by context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “into our hand,” an idiom meaning into our power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들이 이렇게 말하면[a] ‘우리에게로 올라오너라’ 하리니, 그러면 우리가 올라가겠습니다. 이는 야훼께서 그들을 우리의 손[b]에 넘기셨기 때문입니다. 이것이 우리에게 주는 표징입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리에게 맞서 올라오너라’일 수 있습니다. 히브리어는 적대적 도전이 포함된 접근을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘손에’는 관용구로서, 여기서는 ‘권세 아래에, 지배하에’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 … 하면
  alternatives_korean:
  - 그리고 … 하면
  - 만일 … 하면
  lexicon: HALOT
  rationale: 앞선 조건과 대비되는 분기이므로 ‘그러나’로 역전환을 살리고, 조건문은 자연스러운 합쇼체로 처리했습니다.
- source_word: עֲלוּ עָלֵינוּ
  english_pob_choice: Come up to us
  chosen_korean: 우리에게로 올라오너라
  alternatives_korean:
  - 우리에게 올라오십시오
  - 우리를 치러 올라오너라
  lexicon: HALOT
  rationale: עלה의 ‘올라오다’ 이미지를 보존하면서도, 직접 발화의 도전적 어조를 한국어 명령형으로 자연스럽게 옮겼습니다.
- source_word: נְתָנָם ... בְּיָדֵנוּ
  english_pob_choice: has given them into our hand
  chosen_korean: 그들을 우리의 손에 넘기셨기 때문입니다
  alternatives_korean:
  - 그들을 우리의 손에 주셨기 때문입니다
  - 그들을 우리 손안에 두셨기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘손에’는 단순 소유보다 권세·지배의 의미가 강하므로, 한국어에서는 ‘넘기다’로 그 힘의 뉘앙스를 살렸습니다.
- source_word: הָאוֹת
  english_pob_choice: the sign
  chosen_korean: 표징
  alternatives_korean:
  - 징조
  - 표적
  lexicon: HALOT
  rationale: 문맥상 두 인물에게 주어지는 확인 표시는 일반적 ‘징조’보다 더 명시적인 확인의 의미가 있어 ‘표징’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 행동을 확신하는 표현의 시제와 어조
  chosen_reading: ‘넘기셨기 때문입니다’로 과거 완료의 확정성을 드러내되, 문맥상 믿음의 확신으로 읽힐 수 있게 했습니다.
  alternative_readings:
  - ‘넘기실 것이기 때문입니다’
  - ‘넘겨주셨기 때문입니다’
  rationale: 히브리어 완료형은 예언적 확신을 담을 수 있으므로, 한국어도 이미 이루어진 일처럼 말해 전투 직전의 신뢰를 살렸습니다.
  doctrine_reference: 서사 문맥에서의 예언적 완료 표현
