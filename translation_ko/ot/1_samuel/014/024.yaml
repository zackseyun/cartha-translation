base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/024.yaml
  text: Now the men of Israel were hard-pressed that day[a], and Saul put the people under an oath, saying, “Cursed is the man who eats food before evening, before I have avenged myself on my enemies.” So none of the people tasted food.
  footnotes:
  - marker: a
    text: Hebrew 'bread' in both occurrences; here it likely means food generally, not bread specifically.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 이스라엘 사람들이 크게 압박을 받았습니다[a]. 사울은 백성에게 맹세를 시키며 말했습니다. 「저녁이 되기 전에 음식을 먹는 사람은 저주를 받을 것입니다. 내가 내 원수들에게 복수하기 전에는 말입니다」. 그래서 백성 가운데 아무도 음식을 맛보지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘빵’은 두 번 나오지만, 여기서는 문자 그대로의 빵보다 일반적인 음식 전체를 가리키는 뜻으로 보는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגַּשׂ
  english_pob_choice: were hard-pressed
  chosen_korean: 크게 압박을 받았습니다
  alternatives_korean:
  - 곤경에 처했습니다
  - 몰려들었습니다
  - 다가왔습니다
  lexicon: HALOT
  rationale: 여기서는 단순한 공간적 ‘다가옴’보다 전투 상황에서의 압박·곤란을 가리키는 의미가 자연스럽고, POB의 해석을 한국어로 옮기기 위해 ‘압박을 받다’를 택했습니다.
- source_word: וַיֹּאֶל
  english_pob_choice: put the people under an oath
  chosen_korean: 백성에게 맹세를 시키며
  alternatives_korean:
  - 백성을 맹세 아래 두며
  - 백성에게 맹세를 부과하며
  - 백성을 저주 아래 두며
  lexicon: HALOT
  rationale: 동사는 단순한 의향 표명이 아니라 백성에게 강제적 서약을 걸게 하는 뜻이어서, 현대 한국어에서 자연스럽고 강제성을 드러내는 ‘맹세를 시키다’로 옮겼습니다.
- source_word: יֹאכַל לֶחֶם
  english_pob_choice: eats food
  chosen_korean: 음식을 먹는
  alternatives_korean:
  - 빵을 먹는
  - 양식을 먹는
  lexicon: HALOT
  rationale: לֶחֶם은 문자적으로는 ‘빵’이지만 여기서는 일반 음식 전체를 가리키는 관용으로 보이므로, 의미를 살려 ‘음식’을 택했습니다.
- source_word: וְנִקַּמְתִּי מֵאֹיְבַי
  english_pob_choice: before I have avenged myself on my enemies
  chosen_korean: 내가 내 원수들에게 복수하기 전에는
  alternatives_korean:
  - 내가 내 원수들에게 원수를 갚기 전에는
  - 내가 내 원수들에게 보복하기 전에는
  lexicon: HALOT
  rationale: 사울의 자기중심적 복수 선언을 분명히 드러내기 위해 1인칭을 유지했고, ‘복수하다’는 본문의 보복·응징 뉘앙스를 비교적 직접적으로 전달합니다.
- source_word: לֹא טָעַם ... לָחֶם
  english_pob_choice: none of the people tasted food
  chosen_korean: 백성 가운데 아무도 음식을 맛보지 않았습니다
  alternatives_korean:
  - 백성 가운데 아무도 빵을 맛보지 않았습니다
  - 아무도 음식을 먹지 않았습니다
  lexicon: HALOT
  rationale: ‘맛보다’는 히브리어 표현을 살리면서도 한국어에서 충분히 자연스럽고, 앞의 ‘음식’과도 일관되게 맞춥니다.
theological_decisions:
- issue: 사울의 저주 선언과 그 강제성
  chosen_reading: 사울이 백성에게 단순히 권고한 것이 아니라 맹세를 강제로 걸어 음식 섭취를 금지한 것으로 옮겼습니다.
  alternative_readings:
  - 사울이 금식을 권고한 것으로 완화하는 번역
  - 사울이 그냥 명령한 것으로 평이하게 번역
  rationale: 본문의 אָרוּר(저주) 공식과 동사의 강제성을 함께 드러내야 사울의 성급하고 무거운 조치가 약화되지 않습니다.
  doctrine_reference: 본문 서사 맥락 보존; 맹세/저주 공식
