  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בֵּֽ/אלֹהִ֔ים הַֽ/אֵרֵד֙ אַחֲרֵ֣י פְלִשְׁתִּ֔ים הֲ/תִתְּנֵ֖/ם בְּ/יַ֣ד יִשְׂרָאֵ֑ל וְ/לֹ֥א עָנָ֖/הוּ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/037.yaml
  text: Then Saul inquired of God[a], “Should I go down after the Philistines? Will you give them into the hand of Israel?” But he did not answer him that day.
  footnotes:
  - marker: a
    text: Or 'Will you deliver them into Israel’s hand?'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울이 하나님께 물었습니다. 「내가 블레셋 사람들을 뒤쫓아 내려가야 합니까? 그들을 이스라엘의 손에 넘기시겠습니까?[a]」 그러나 그날에는 그에게 대답하지 않으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들을 이스라엘의 손에 주시겠습니까?'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  english_pob_choice: inquired of God
  chosen_korean: 하나님께 물었습니다
  alternatives_korean:
  - 하나님께 문의했습니다
  - 하나님께 여쭈었습니다
  lexicon: HALOT
  rationale: שׁאל의 여기서는 단순한 질문이 아니라 하나님의 뜻을 구하는 행위이므로, 현대 한국어에서 자연스럽고 격식을 지키는 '하나님께 물었습니다'로 옮겼습니다.
- source_word: הַאֵרֵד אַחֲרֵי פְלִשְׁתִּים
  english_pob_choice: Should I go down after the Philistines?
  chosen_korean: 내가 블레셋 사람들을 따라 내려가야 합니까?
  alternatives_korean:
  - 내가 블레셋 사람들을 뒤쫓아 내려가야 합니까?
  - 내가 블레셋 사람들 뒤로 내려가야 합니까?
  lexicon: HALOT
  rationale: ‘go down’의 하향 이동과 전투 맥락의 추격성을 함께 살리되, 과도한 의역을 피하고 자연스러운 한국어로 '따라 내려가다'를 택했습니다.
- source_word: הֲתִתְּנֵם בְּיַד יִשְׂרָאֵל
  english_pob_choice: Will you give them into the hand of Israel?
  chosen_korean: 그들을 이스라엘의 손에 넘기시겠습니까?
  alternatives_korean:
  - 그들을 이스라엘의 손에 주시겠습니까?
  - 그들을 이스라엘의 권세 아래 두시겠습니까?
  lexicon: HALOT
  rationale: ‘give into the hand of’라는 히브리어 전투 관용구를 한국어 성경 문체에서 이해되는 '손에 넘기다'로 유지했습니다.
- source_word: וְלֹא עָנָהוּ
  english_pob_choice: But he did not answer him
  chosen_korean: 그러나 그 날에는 그에게 대답하지 않으셨습니다
  alternatives_korean:
  - 그러나 그 날에는 응답하지 않으셨습니다
  - 그러나 그 날에는 그에게 아무 대답도 하지 않으셨습니다
  lexicon: HALOT
  rationale: 원문의 주어는 문맥상 하나님이지만 히브리어처럼 직접 명시하지 않고, '대답하지 않으셨습니다'로 응답 부재를 분명히 했습니다.
theological_decisions:
- issue: 하나님의 비응답의 주어를 명시할지 여부
  chosen_reading: 문맥상 하나님이 응답하지 않으신 것으로 읽되, 본문에서는 주어를 반복해 설명하지 않았습니다.
  alternative_readings:
  - '''하나님께서 그에게 대답하지 않으셨습니다''로 주어를 명시할 수 있습니다.'
  rationale: 사울이 바로 앞에서 하나님께 물었으므로 비응답의 주체는 분명하지만, 히브리어 본문의 간결성을 유지하며 독자가 문맥으로 파악하도록 두는 편이 더 원문에 가깝습니다.
  doctrine_reference: 원문 우선 원칙과 문맥상 암시된 주어 보존
