id: 1SA.14.1
reference: 1 Samuel 14:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י הַ/יּ֗וֹם וַ/יֹּ֨אמֶר יוֹנָתָ֤ן בֶּן שָׁאוּל֙ אֶל הַ/נַּ֨עַר֙ נֹשֵׂ֣א כֵלָ֔י/ו לְכָ֗/ה וְ/נַעְבְּרָה֙ אֶל מַצַּ֣ב פְּלִשְׁתִּ֔ים אֲשֶׁ֖ר מֵ/עֵ֣בֶר הַלָּ֑ז וּ/לְ/אָבִ֖י/ו לֹ֥א הִגִּֽיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/001.yaml
  text: Now one day Jonathan son of Saul said to the young man who carried his armor[a], “Come[b], let us cross over to the Philistine garrison that is on the other side.” But he did not tell his father.
  footnotes:
  - marker: a
    text: Or “the Philistine outpost.” The Hebrew term can denote a military post or stationed force.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, “which is from/across the other side of this one,” likely referring to the pass described in the following verses.
    reason: cultural_note
translation:
  language: ko
  text: 어느 날 사울의 아들 요나단이 자기 무기를 나르는 젊은이[a]에게 말했습니다. “자, 우리가 저편[b]에 있는 블레셋 수비대로 건너가자.” 그러나 그는 아버지에게 알리지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 나아르(נַעַר)는 문맥에 따라 소년, 종, 젊은이를 뜻할 수 있습니다. 여기서는 군사 행동에 동행하는 사람이므로 ‘젊은이’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘이쪽의 건너편에 있는’이라는 뜻입니다. ‘이쪽’이 정확히 무엇을 가리키는지는 본문만으로 특정되지 않으며, 이어지는 문맥의 길목을 가리킬 가능성이 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  english_pob_choice: Now one day
  chosen_korean: 이제 어느 날
  alternatives_korean:
  - 어느 날
  - 그날
  lexicon: WLC
  rationale: 히브리어 서술 도입구의 시간 전환과 이야기 흐름을 자연스러운 현대 한국어로 살리되, 장면 전환의 느낌을 유지했습니다.
- source_word: הַנַּעַר
  english_pob_choice: the young man
  chosen_korean: 젊은이
  alternatives_korean:
  - 소년
  - 종
  lexicon: HALOT
  rationale: 문맥상 군사 행동에 동행하는 인물로, 나이 어린 ‘소년’보다 ‘젊은이’가 더 정확하고 한국어에서도 무난합니다.
- source_word: נֹשֵׂא כֵלָיו
  english_pob_choice: who carried his armor
  chosen_korean: 자기 갑옷을 나르는
  alternatives_korean:
  - 그의 무기를 나르는
  - 갑옷 든
  lexicon: HALOT
  rationale: 직역하면 ‘그의 장비/무기를 나르는’이지만, POB의 영어처럼 인물 관계를 분명히 하면서 자연스럽게 ‘갑옷을 나르는’으로 옮겼습니다.
- source_word: מַצַּב פְּלִשְׁתִּים
  english_pob_choice: the Philistine garrison
  chosen_korean: 블레셋 수비대
  alternatives_korean:
  - 블레셋 주둔군
  - 블레셋 주둔지
  lexicon: HALOT
  rationale: 군사적 주둔 세력을 가리키는 말이므로 ‘수비대’가 가장 자연스럽고, 장소보다 병력 집단의 뉘앙스를 살립니다.
- source_word: מֵעֵבֶר הַלָּז
  english_pob_choice: that is on the other side
  chosen_korean: 저편에 있는
  alternatives_korean:
  - 건너편에 있는
  - 저쪽에 있는
  lexicon: HALOT
  rationale: 지시 표현의 거리감과 방향성을 한국어에서 간결하게 살렸습니다. 본문 자체에는 지형 설명이 더 구체화되지 않으므로 과도하게 ‘고개/협곡’ 등을 덧붙이지 않았습니다.
- source_word: לֹא הִגִּיד
  english_pob_choice: But he did not tell his father
  chosen_korean: 그러나 그는 아버지에게 알리지 않았습니다
  alternatives_korean:
  - 그러나 그는 아버지에게 말하지 않았습니다
  - 하지만 아버지에게 숨겼습니다
  lexicon: HALOT
  rationale: הִגִּיד는 ‘알리다/말하다’의 일반적 의미이므로, 단순 부정보다 문맥상 무난한 ‘알리지 않았다’를 택했습니다.
theological_decisions:
- issue: 요나단의 명령형 발화의 문체
  chosen_reading: 직접 화법 안에서는 「오너라, 우리… 건너가자」로 반말형 초청과 공동행동 제안을 살렸습니다.
  alternative_readings:
  - 「와, 우리… 건너갑시다」
  - 「가자, 우리… 건너가자」
  rationale: 이 장면은 동료에게 즉각적이고 친밀하게 제안하는 군사적/서사적 발화이므로, 한국어에서도 과도한 공손형보다 자연스러운 초청형이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 서사 속 직접 화법의 화자-청자 관계 보존
