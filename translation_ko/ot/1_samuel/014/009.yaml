  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם כֹּ֤ה יֹֽאמְרוּ֙ אֵלֵ֔י/נוּ דֹּ֕מּוּ עַד הַגִּיעֵ֖/נוּ אֲלֵי/כֶ֑ם וְ/עָמַ֣דְנוּ תַחְתֵּ֔י/נוּ וְ/לֹ֥א נַעֲלֶ֖ה אֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/009.yaml
  text: If they say to us like this[b][a], ‘Stay there until we come to you,’ then we will stand where we are and will not go up to them.
  footnotes:
  - marker: a
    text: Or 'Be still' or 'Wait' for 'Stay there'; the Hebrew imperative can denote remaining still or silent in place.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'we will stand under ourselves,' an idiom meaning 'we will remain in our place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 우리에게 이렇게 말하면 — ‘우리가 너희에게 갈 때까지 거기에 가만히 있어라’ — 우리는 우리 자리에서 서서 그들에게 올라가지 않겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가만히 있어라’는 히브리어 명령형의 뜻을 옮긴 것으로, 문맥에 따라 ‘잠잠하라’ 또는 ‘기다려라’의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우리 자리에서 서다’는 직역하면 ‘우리 아래에 서다’에 해당하는 관용구로, ‘제자리에 머물다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹּמּוּ
  english_pob_choice: Stay there
  chosen_korean: 거기에 가만히 있어라
  alternatives_korean:
  - 거기서 서 있어라
  - 잠잠하라
  - 기다려라
  lexicon: HALOT
  rationale: 군사적 맥락에서 단순한 침묵보다 제자리 대기를 뜻하므로, 현대 한국어에서 자연스러운 ‘가만히 있어라’로 옮기되 명령의 정지성을 살렸습니다.
- source_word: עַד הַגִּיעֵנוּ אֲלֵיכֶם
  english_pob_choice: until we come to you
  chosen_korean: 우리가 너희에게 갈 때까지
  alternatives_korean:
  - 우리가 너희에게 이를 때까지
  - 우리가 너희에게 도착할 때까지
  lexicon: HALOT
  rationale: 도달의 의미를 유지하되, 현대어에서는 ‘가다’가 가장 자연스러워 조건절 안의 말투를 매끄럽게 살립니다.
- source_word: וְעָמַדְנוּ תַחְתֵּינוּ
  english_pob_choice: then we will stand where we are
  chosen_korean: 우리는 우리 자리에서 서서
  alternatives_korean:
  - 우리는 제자리에 서서
  - 우리는 그 자리에서 머물러
  lexicon: HALOT
  rationale: 직역하면 ‘우리 아래에 서다’라는 관용구지만, 의미는 ‘제자리에 머물다’이므로 ‘우리 자리에서 서서’로 풀어 원의와 자연성을 함께 살렸습니다.
- source_word: וְלֹא נַעֲלֶה אֲלֵיהֶם
  english_pob_choice: and will not go up to them
  chosen_korean: 그들에게 올라가지 않겠습니다
  alternatives_korean:
  - 그들에게 올라가지 않을 것입니다
  - 그들에게 치러 올라가지 않겠습니다
  lexicon: HALOT
  rationale: ‘올라가다’는 지형적 상승과 동시에 적대적 접근의 뉘앙스를 담으므로, POB의 표현을 따라 직역적 힘을 유지했습니다.
theological_decisions:
- issue: 조건부 표지와 화자의 말투 전달
  chosen_reading: 본절은 순수한 전술적 조건문이므로 신학적 해석을 덧붙이지 않고, 직접 인용부 내부의 명령형은 병사들 사이의 실전 발화로 자연스럽게 처리했습니다.
  alternative_readings:
  - 도덕적 교훈 문장처럼 부드럽게 의역
  - 명령을 완곡한 청유로 완화
  rationale: 원문은 신적 말씀이나 예언이 아니라 전투 상황의 가정적 신호이므로, 서술의 긴장과 즉시성을 보존하는 것이 우선입니다.
  doctrine_reference: 본문 맥락 보존 원칙
