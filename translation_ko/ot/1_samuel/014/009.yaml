  text: If they say to us like this[b][a], ‘Stay there until we come to you,’ then we will stand where we are and will not go up to them.
  footnotes:
  - marker: a
    text: Or 'Be still' or 'Wait' for 'Stay there'; the Hebrew imperative can denote remaining still or silent in place.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'we will stand under ourselves,' an idiom meaning 'we will remain in our place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 우리에게 이렇게 말하기를, ‘우리가 너희에게 갈 때까지 거기에 가만히 있어라[a]’ 하면, 우리는 제자리에 서 있고[b] 그들에게 올라가지 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가만히 있어라’는 히브리어 명령형을 옮긴 것으로, 문맥에 따라 ‘잠잠하라’ 또는 ‘기다려라’라는 뜻도 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘제자리에 서 있고’에 해당하는 표현은 직역하면 ‘우리 아래에’라는 뜻의 관용구로, ‘우리 자리에 머물다’를 뜻합니다.
    reason: lexical_alternative
