  source_fidelity: 첫 문장의 ‘거세졌습니다’는 전쟁의 강도가 점차 증가했다는 변화의 의미를 더하지만, 히브리어 חֲזָקָה는 여기서 전쟁이 지속적으로 강하고 격렬했음을 서술합니다. 또한 각주 a가 사울에 붙어 있어 해당 형용사와 연결되지 않습니다. 나머지 문장 구조와 반복적 의미(‘볼 때마다’)는 원문에 부합합니다.
  naturalness: ‘무용 있는 사람’과 ‘그를 자기에게 모았습니다’는 현대 표준어에서 다소 어색합니다. ‘용맹한 사람’, ‘자기 휘하에 거두었습니다’가 합쇼체의 자연스러운 문장으로 의미를 잘 전달합니다.
  terminology: ‘블레셋 사람들’, ‘용사’, ‘용맹한 사람’, ‘자기 휘하’는 군사 문맥과 현대 한국어에 적절합니다. ‘용맹의 아들’은 관용구임을 각주에서 설명할 수 있습니다.
