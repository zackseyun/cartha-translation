id: 1SA.14.52
reference: 1 Samuel 14:52
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תְּהִ֤י הַ/מִּלְחָמָה֙ חֲזָקָ֣ה עַל פְּלִשְׁתִּ֔ים כֹּ֖ל יְמֵ֣י שָׁא֑וּל וְ/רָאָ֨ה שָׁא֜וּל כָּל אִ֤ישׁ גִּבּוֹר֙ וְ/כָל בֶּן חַ֔יִל וַ/יַּאַסְפֵ֖/הוּ אֵלָֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/052.yaml
  text: And the war against the Philistines was severe all the days of Saul[a]. Whenever Saul saw any mighty man or any valiant man[c][b], he gathered him to himself.
  footnotes:
  - marker: a
    text: Or 'fierce' or 'hard' for 'severe.' The Hebrew adjective is literally 'strong.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'any mighty man or any son of valor.'
    reason: lexical_alternative
  - marker: c
    text: That is, Saul recruited such men into his service.
    reason: cultural_note
translation:
  language: ko
  text: 사울의 평생 동안 블레셋 사람들을 상대로 한 전쟁은 격렬했습니다[a]. 사울은 용사나 용맹한 사람을 볼 때마다 그를 자기 휘하에 거두었습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘심했다’, ‘강했다’로도 옮길 수 있습니다. 히브리어 형용사는 문자적으로 ‘강한’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘모든 용사 또는 모든 용맹의 아들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 즉, 사울이 그런 사람들을 자기 군사력에 편입시켰다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַמִּלְחָמָה חֲזָקָה
  english_pob_choice: the war was severe
  chosen_korean: 전쟁은 … 거세졌습니다
  alternatives_korean:
  - 전쟁은 … 심했습니다
  - 전쟁은 … 강했습니다
  - 전쟁은 … 격렬했습니다
  lexicon: HALOT
  rationale: חזק의 기본 뜻은 ‘강하다’이지만, 이 문맥에서는 지속된 전쟁의 압박과 강도를 자연스러운 현대 한국어로 드러내는 ‘거세지다’가 가장 적절합니다.
- source_word: כֹּל יְמֵי שָׁאוּל
  english_pob_choice: all the days of Saul
  chosen_korean: 사울의 평생 동안
  alternatives_korean:
  - 사울의 모든 날 동안
  - 사울이 사는 동안
  - 사울의 모든 생애 동안
  lexicon: HALOT
  rationale: 히브리어 관용구가 사울의 생애/재위 기간 전체를 가리키므로, 현대 한국어에서 자연스럽고 의미가 분명한 ‘평생 동안’으로 옮겼습니다.
- source_word: כָּל אִישׁ גִּבּוֹר וְכָל בֶּן חַיִל
  english_pob_choice: any mighty man or any valiant man
  chosen_korean: 어떤 용사나 어떤 무용 있는 사람
  alternatives_korean:
  - 어떤 용사나 어떤 용맹한 사람
  - 어떤 강한 사람이나 어떤 무용 있는 사람
  - 어떤 장사나 어떤 기개 있는 사람
  lexicon: HALOT
  rationale: גִּבּוֹר는 전투적 ‘용사’, בֶּן חַיִל은 단순한 힘보다 인물의 실력과 군사적 자질을 가리키는 관용구로 보아 ‘무용 있는 사람’으로 살렸습니다.
- source_word: וַיַּאַסְפֵהוּ אֵלָיו
  english_pob_choice: he gathered him to himself
  chosen_korean: 그를 자기에게 모았습니다
  alternatives_korean:
  - 그를 자기에게 불러모았습니다
  - 그를 자기 편으로 거두었습니다
  - 그를 자기 진영으로 모았습니다
  lexicon: HALOT
  rationale: אסף의 기본 의미인 ‘모으다/거두다’를 유지하면서, 사울이 그들을 자기 휘하로 끌어들였다는 의미가 드러나도록 번역했습니다.
theological_decisions:
- issue: 사울이 강한/유력한 사람들을 모은 행위의 뉘앙스
  chosen_reading: 군사적 재능과 힘이 있는 사람들을 사울이 자기 휘하로 모아들인 것으로 읽었습니다.
  alternative_readings:
  - 단순히 개인적 호감을 나타낸다고 읽는 것
  - 일반적 친분 관계로만 읽는 것
  rationale: 문맥상 블레셋과의 전쟁이 계속되는 가운데 나온 진술이므로, 이는 사울의 군사적 징집/편입 행위를 가리킨다고 보는 것이 가장 자연스럽습니다.
  doctrine_reference: 본문 문맥의 역사서적 서술
- issue: 사울의 활동 기간 표현
  chosen_reading: ‘사울의 평생 동안’으로 사울의 생애 전체를 가리키게 했습니다.
  alternative_readings:
  - ‘사울의 모든 날 동안’으로 직역하는 것
  - ‘사울의 통치 기간 내내’로 좁히는 것
  rationale: 히브리어 관용구를 자연스럽게 풀되, 재위와 생애가 겹치는 표현으로 오해되지 않도록 생애 전체의 지속성을 드러냈습니다.
  doctrine_reference: 히브리어 관용구의 서술적 용법
