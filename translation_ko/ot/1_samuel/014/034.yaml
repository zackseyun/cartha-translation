id: 1SA.14.34
reference: 1 Samuel 14:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֣וּל פֻּ֣צוּ בָ/עָ֡ם וַ/אֲמַרְתֶּ֣ם לָ/הֶ֡ם הַגִּ֣ישׁוּ אֵלַ/י֩ אִ֨ישׁ שׁוֹר֜/וֹ וְ/אִ֣ישׁ שְׂיֵ֗/הוּ וּ/שְׁחַטְתֶּ֤ם בָּ/זֶה֙ וַ/אֲכַלְתֶּ֔ם וְ/לֹֽא תֶחֶטְא֥וּ לַֽ/יהוָ֖ה לֶ/אֱכֹ֣ל אֶל הַ/דָּ֑ם וַ/יַּגִּ֨שׁוּ כָל הָ/עָ֜ם אִ֣ישׁ שׁוֹר֧/וֹ בְ/יָד֛/וֹ הַ/לַּ֖יְלָה וַ/יִּשְׁחֲטוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/034.yaml
  text: And Saul said[a], “Spread out among the people and tell them, ‘Each man must bring me his ox and each man his sheep, and you must slaughter them here and eat, so that you may not sin against Yahweh by eating with the blood.’” So all the people brought, each man his ox in his hand that night[b], and they slaughtered them there.
  footnotes:
  - marker: a
    text: Hebrew literally, “by eating with/over the blood,” referring to eating meat before the blood was properly drained.
    reason: lexical_alternative
  - marker: b
    text: Or “each man leading his ox by hand.”
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 말했습니다[a]. 「백성들 가운데로 흩어져 가서 그들에게 말하십시오. ‘각 사람은 자기 소와 각 사람은 자기 양을 내게로 가져오라. 그리고 여기서 잡아 먹으라. 그래야 피째 먹음으로 야훼께 죄를 짓지 않을 것이다.’」 그리하여 온 백성이 각 사람마다 자기 소를 손에 든 채 그 밤에 가져왔고[b], 그들이 거기서 잡았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 “피 위에/피와 함께 먹음”에 가깝습니다. 문맥상 피를 제대로 빼지 않은 고기를 먹는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “각 사람이 자기 소를 손으로 끌고 왔다”는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֻּצוּ בָעָם
  english_pob_choice: Spread out among the people
  chosen_korean: 백성들 가운데로 흩어져 가다
  alternatives_korean:
  - 백성들 가운데로 퍼져 가다
  - 백성들 사이로 흩어지다
  lexicon: HALOT
  rationale: פוץ의 분산·확산 의미를 살리면서, 여러 사람에게 명령하는 상황에 맞게 한국어로는 ‘흩어져 가다’가 가장 자연스럽습니다.
- source_word: הַגִּישׁוּ אֵלַי
  english_pob_choice: bring me
  chosen_korean: 내게로 가져오다
  alternatives_korean:
  - 내게로 가져오게 하다
  - 내게 가져오다
  lexicon: HALOT
  rationale: 히필 נגשׁ는 ‘가까이 가져오다/제시하다’의 뜻이므로, 제물용 동물을 가져오라는 맥락을 반영해 ‘내게로 가져오다’로 옮겼습니다.
- source_word: אִישׁ שׁוֹרוֹ וְאִישׁ שְׂיֵהוּ
  english_pob_choice: Each man his ox and each man his sheep
  chosen_korean: 각 사람은 자기 소와 각 사람은 자기 양
  alternatives_korean:
  - 각 사람은 자기 소와 자기 양
  - 사람마다 자기 소와 자기 양
  lexicon: HALOT
  rationale: 반복되는 אִישׁ의 분배적 의미를 살려 ‘각 사람은 … 각 사람은 …’으로 처리했고, שֶׂה는 여기서 일반적으로 ‘양’으로 옮기는 것이 가장 분명합니다.
- source_word: וּשְׁחַטְתֶּם בָּזֶה
  english_pob_choice: you must slaughter them here
  chosen_korean: 여기서 잡아 먹으라
  alternatives_korean:
  - 여기서 잡으라
  - 여기서 도살하라
  lexicon: HALOT
  rationale: שׁחט는 단순한 살해가 아니라 식용을 위한 도살이므로 ‘잡아 먹다’로 옮겨, 바로 이어지는 식사 행위를 자연스럽게 드러냈습니다.
- source_word: לֶאֱכֹל אֶל הַדָּם
  english_pob_choice: by eating with the blood
  chosen_korean: 피째 먹음으로
  alternatives_korean:
  - 피와 함께 먹음으로
  - 피를 먹음으로
  lexicon: HALOT
  rationale: 히브리어의 관용구가 피가 제대로 빠지기 전에 먹는 행위를 가리키므로, 본문 뜻을 드러내면서도 직역의 낯섦을 지나치게 남기지 않는 표현을 택했습니다.
- source_word: וַיַּגִּשׁוּ כָל־הָעָם אִישׁ שׁוֹרוֹ בְיָדוֹ
  english_pob_choice: So all the people brought, each man his ox in his hand
  chosen_korean: 온 백성이 각 사람마다 자기 소를 손에 든 채 가져왔고
  alternatives_korean:
  - 온 백성이 각 사람마다 자기 소를 손에 들고 가져왔고
  - 온 백성이 각 사람마다 자기 소를 손에 쥔 채 가져왔고
  lexicon: HALOT
  rationale: ‘손에’는 ‘직접 끌고/데리고 왔다’는 생생한 관용을 보존하지만 한국어에서는 ‘손에 든 채’가 가장 자연스럽습니다. 영어 POB의 각주처럼 이 구절은 ‘직접 끌고 온’ 의미도 가능합니다.
theological_decisions:
- issue: 여호와 이름의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 יְהוָה가 직접 나오므로, 프로젝트 기본값에 따라 신명 고유명을 음역해 ‘야훼’로 유지했습니다. 본문은 이 명령이 야훼께 대한 죄를 피하는 것임을 분명히 드러냅니다.
  doctrine_reference: 'POB contested terms: YHWH → 야훼'
- issue: ‘피째 먹음’의 표현 방식
  chosen_reading: 피째 먹음으로
  alternative_readings:
  - 피와 함께 먹음으로
  - 피를 먹음으로
  rationale: 문맥은 고기에서 피를 제대로 빼지 않고 먹는 행위를 금지하는 것이므로, 원문의 윤리·의례적 긴장을 약화하지 않도록 직접적 표현을 유지했습니다.
  doctrine_reference: 레위기 17장과 사무엘상 14장의 혈액 금지 규례
