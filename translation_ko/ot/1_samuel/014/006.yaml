  naturalness: ‘요나단의 무기를 드는 젊은이’, ‘이 할례받지 않은 자들의 진지’, ‘많은 이로든 적은 이로든’이 현대 표준 한국어 합쇼체에서 더 자연스럽고 정확합니다. ‘우리에게 어떤 일을 하실지도 모릅니다’는 עשה의 넓은 의미와 혹시성도 보존합니다.
  terminology: ‘야훼’, ‘할례받지 않은 자들’, ‘구원’은 원문의 고유명·언약적으로 비난하는 표현·구원 어휘를 적절히 보존합니다. ‘진지’는 군사 위치를 뜻하는 מַצָּב에 적합합니다.
  issues:
