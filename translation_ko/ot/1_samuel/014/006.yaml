  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹנָתָ֜ן אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו לְכָ/ה֙ וְ/נַעְבְּרָ֗ה אֶל מַצַּב֙ הָ/עֲרֵלִ֣ים הָ/אֵ֔לֶּה אוּלַ֛י יַעֲשֶׂ֥ה יְהוָ֖ה לָ֑/נוּ כִּ֣י אֵ֤ין לַֽ/יהוָה֙ מַעְצ֔וֹר לְ/הוֹשִׁ֥יעַ בְּ/רַ֖ב א֥וֹ בִ/מְעָֽט־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/006.yaml
  text: Then Jonathan said to the young man who carried his armor[a], “Come, let us cross over to the garrison of these uncircumcised men. Perhaps Yahweh will act for us[c][b], for nothing can hinder Yahweh from saving by many or by few.”
  footnotes:
  - marker: a
    text: Or “outpost” for “garrison.”
    reason: lexical_alternative
  - marker: b
    text: Literally “these uncircumcised”; a covenantally charged term of reproach.
    reason: cultural_note
  - marker: c
    text: Or “there is no restraint for the LORD to save.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요나단이 요나단의 무기를 드는 젊은이[a]에게 말했습니다. “자, 우리가 이 할례받지 않은 자들의[b] 진지로 건너가 봅시다. 아마 야훼께서 우리에게 어떤 일을 하실지도 모릅니다. 야훼께서는 많은 이로든 적은 이로든 구원하시는 데 제한이 없으시기 때문입니다.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 장비/무기를 드는 젊은이’입니다. 관용적으로는 ‘무기 든 자’ 또는 ‘무기 담당자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘이 할례받지 않은 자들’입니다. 이 표현은 단순한 신체 묘사가 아니라 언약적 멸시를 담고 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘야훼께서 구원하시는 데에는 아무런 제약이 없으시기 때문입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  english_pob_choice: who carried his armor
  chosen_korean: 자기 무기 든 소년
  alternatives_korean:
  - 자기 갑옷을 든 자
  - 무기꾼
  lexicon: HALOT
  rationale: 직역하면 ‘그의 장비/무기를 지닌 자’이며, 한국어에서는 관계절을 풀어 ‘무기 든 소년’으로 자연스럽게 옮기되 종속된 군사 보조 인물의 의미를 유지했습니다.
- source_word: לְכָה וְנַעְבְּרָה
  english_pob_choice: Come, let us cross over
  chosen_korean: 자, 우리가 … 건너가 봅시다
  alternatives_korean:
  - 자, 우리가 … 건너갑시다
  - 자, 우리 가서 건너가 봅시다
  lexicon: HALOT
  rationale: 명령형+청유형의 결합을 초대와 결단으로 살리기 위해 ‘자, 우리가’와 ‘-봅시다’를 사용했고, מעבר의 이동 이미지는 ‘건너가다’로 반영했습니다.
- source_word: הָעֲרֵלִים
  english_pob_choice: these uncircumcised men
  chosen_korean: 이 할례받지 않은 자들
  alternatives_korean:
  - 이 할례받지 못한 자들
  - 이 불할례자들
  lexicon: HALOT
  rationale: 언약적 조롱이 담긴 실질형용사이므로 민족명으로 바꾸지 않고, 문자적 의미를 살린 ‘할례받지 않은 자들’로 옮겼습니다.
- source_word: מַעְצוֹר לְהוֹשִׁיעַ
  english_pob_choice: nothing can hinder Yahweh from saving
  chosen_korean: 야훼께는 … 구원하시는 데 아무런 장애가 없습니다
  alternatives_korean:
  - 야훼께서는 … 구원하시는 데 아무런 제약이 없습니다
  - 야훼께는 … 구원하시는 일을 막을 것이 없습니다
  lexicon: HALOT
  rationale: מַעְצוֹר를 추상명사 ‘장애’로 옮겨 ‘막다’보다 더 직접적으로 제약 부재를 드러냈고, לְהוֹשִׁיעַ는 구약적 구원 행위에 맞게 ‘구원하다’로 번역했습니다.
- source_word: בְּרַב אוֹ בִמְעָט
  english_pob_choice: by many or by few
  chosen_korean: 많은 사람으로 말미암아든지 적은 사람으로 말미암아든지
  alternatives_korean:
  - 많은 사람으로든 적은 사람으로든
  - 많은 자로든 적은 자로든
  lexicon: HALOT
  rationale: 수단/매개를 나타내는 בְּ를 한국어 ‘말미암아’로 풀어, ‘많든 적든’의 단순 대조보다 하나님의 구원이 동원 인원에 좌우되지 않음을 더 분명히 했습니다.
theological_decisions:
- issue: 야훼의 구원은 수적 우세에 제한되지 않는다는 진술
  chosen_reading: ‘야훼께는 … 구원하시는 데 아무런 장애가 없습니다’로 옮겨, 수단의 다소와 무관한 하나님의 주권적 구원을 강조했습니다.
  alternative_readings:
  - ‘야훼께는 … 구원하시는 일을 막을 것이 없습니다’
  - ‘야훼는 많은 사람으로든 적은 사람으로든 구원하실 수 있습니다’
  rationale: 본문은 단순한 능력 진술을 넘어, 야훼의 구원이 인간적 수적 조건에 의해 제한되지 않음을 강조합니다. 따라서 ‘장애가 없습니다’로 제약 부재를 살렸습니다.
  doctrine_reference: 1 Samuel 14:6; divine sovereignty in deliverance
- issue: 여호와 대체어를 위한 YHWH 표기
  chosen_reading: יהוה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기적 언약명인 여호와의 고유 이름을 직접 사용하므로, 본 프로젝트 기본어인 ‘야훼’를 유지해 이름과 칭호를 구분했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
