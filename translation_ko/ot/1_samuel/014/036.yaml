  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֡וּל נֵרְדָ֣ה אַחֲרֵי֩ פְלִשְׁתִּ֨ים לַ֜יְלָה וְֽ/נָבֹ֥זָה בָ/הֶ֣ם עַד א֣וֹר הַ/בֹּ֗קֶר וְ/לֹֽא נַשְׁאֵ֤ר בָּ/הֶם֙ אִ֔ישׁ וַ/יֹּ֣אמְר֔וּ כָּל הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עֲשֵׂ֑ה וַ/יֹּ֨אמֶר֙ הַ/כֹּהֵ֔ן נִקְרְבָ֥ה הֲלֹ֖ם אֶל הָ/אֱלֹהִֽים׀׀־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/036.yaml
  text: Then Saul said[a], “Let us go down after the Philistines by night and plunder them until the light of the morning, and let us not leave a man among them.” And they said, “Do whatever seems good in your eyes.” But the priest said, “Let us draw near here to God.”
  footnotes:
  - marker: a
    text: Or “Let us approach God here”; the priest's words likely imply seeking divine guidance before proceeding.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울이 말했습니다. 「우리가 밤에 블레셋 사람들을 뒤쫓아 내려가서 새벽의 빛이 밝아올 때까지 그들 가운데서 노략질하고, 그들 중에 한 사람도 남기지 맙시다.」 그러자 그들이 말했습니다. 「당신께서 좋게 여기시는 것은 무엇이든 하십시오.」 그러자 제사장이 말했습니다. 「여기 하나님께 나아갑시다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵרְדָה
  english_pob_choice: Let us go down
  chosen_korean: 우리가 … 내려가서
  alternatives_korean:
  - 우리가 … 가서
  - 우리가 … 내려가자
  lexicon: HALOT
  rationale: 히브리어 cohortative의 제안 어조를 살리되, ירד의 방향성인 ‘내려가다’를 유지했습니다.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  english_pob_choice: after the Philistines
  chosen_korean: 블레셋 사람들을 뒤쫓아
  alternatives_korean:
  - 블레셋 사람들 뒤로
  - 블레셋 사람들을 따라
  lexicon: HALOT
  rationale: 전투 문맥상 ‘뒤쫓다/추격하다’의 뜻이 분명하므로, 단순한 시간·순서를 뜻하는 ‘뒤에’보다 추격의 함의를 드러냈습니다.
- source_word: וְנָבֹזָה בָהֶם
  english_pob_choice: and plunder among them
  chosen_korean: 그들 가운데서 노략질하고
  alternatives_korean:
  - 그들을 노략질하고
  - 그들 가운데서 약탈하고
  lexicon: HALOT
  rationale: בזז의 ‘노략질하다/약탈하다’를 살리면서, 전치사 בָהֶם의 집합적·내부적 감각을 ‘가운데서’로 반영했습니다.
- source_word: עַד אוֹר הַבֹּקֶר
  english_pob_choice: until the light of the morning
  chosen_korean: 새벽의 빛이 밝아올 때까지
  alternatives_korean:
  - 아침의 빛이 비칠 때까지
  - 동틀 때까지
  lexicon: HALOT
  rationale: 직역을 유지하되 한국어로 자연스럽게 풀어 ‘빛’과 ‘아침/새벽’의 이미지를 함께 보존했습니다.
- source_word: הֲלֹם אֶל הָאֱלֹהִים
  english_pob_choice: Let us draw near here to God
  chosen_korean: 여기 하나님께 나아갑시다
  alternatives_korean:
  - 여기 하나님께 가까이 갑시다
  - 여기 하나님께 나아가 봅시다
  lexicon: HALOT
  rationale: הֲלֹם의 ‘여기’를 살리고, קרב의 예배적·상황적 접근을 한국어 관용에 맞는 ‘나아가다’로 옮겼습니다.
theological_decisions:
- issue: 제사장의 말의 함의
  chosen_reading: ‘하나님께 나아갑시다’로 옮겨, 구체적 의식 행위를 단정하지 않고 하나님께 접근하여 뜻을 묻는 뉘앙스를 열어 두었습니다.
  alternative_readings:
  - ‘여기서 하나님께 묻읍시다’
  - ‘여기서 하나님께 상담합시다’
  rationale: 히브리어는 ‘가까이 나아가다’라고만 말하며, 본문은 구체적 문의 절차를 명시하지 않습니다. 번역은 그 긴장을 그대로 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
