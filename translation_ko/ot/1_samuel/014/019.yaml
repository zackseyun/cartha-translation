base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/019.yaml
  text: And it happened[a], while Saul was speaking to the priest, that the tumult in the camp of the Philistines kept increasing more and more. So Saul said to the priest, “Withdraw your hand.”
  footnotes:
  - marker: a
    text: Literally, “gather your hand.” Saul tells the priest to stop the action he was performing.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 제사장에게 말하는 동안에 블레셋 진영의 소란이 점점 더 커졌습니다. 그래서 사울이 제사장에게 말했습니다. “손을 거두십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘손을 거두다/모으다’에 가깝지만, 여기서는 제사장이 하던 동작을 멈추라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 사울이 제사장에게 말하는 동안에
  alternatives_korean:
  - 그리고 일이 있었습니다
  - 그런 일이 있었습니다
  lexicon: HALOT
  rationale: 히브리어 서술 도입을 한국어에서는 자연스러운 사건 연결로 풀어, 바로 이어지는 동시 진행(‘while’)을 살리기 위해 문두를 시간 부사구로 시작했습니다.
- source_word: הֶהָמוֹן
  english_pob_choice: the tumult
  chosen_korean: 소란
  alternatives_korean:
  - 혼란
  - 소동
  - 요란함
  lexicon: HALOT
  rationale: פְּלִשְׁתִּים 진영에서 커지는 것은 단순한 ‘소리’보다 뒤섞인 혼란과 소동이므로, 현대 한국어에서 자연스럽고 의미를 포괄하는 ‘소란’을 택했습니다.
- source_word: וַיֵּלֶךְ הָלוֹךְ וָרָב
  english_pob_choice: kept increasing more and more
  chosen_korean: 점점 더 커졌습니다
  alternatives_korean:
  - 계속해서 더 커졌습니다
  - 더욱더 증가했습니다
  - 점점 더 심해졌습니다
  lexicon: HALOT
  rationale: 강조적 반복 구조가 누적적 증대를 나타내므로, 한국어에서는 ‘점점 더’로 진행성과 강화를 함께 표현했습니다.
- source_word: אֱסֹף יָדֶךָ
  english_pob_choice: Withdraw your hand
  chosen_korean: 손을 거두십시오
  alternatives_korean:
  - 손을 거두세요
  - 손을 빼십시오
  - 손을 멈추십시오
  lexicon: HALOT
  rationale: 직역하면 ‘손을 모으라’에 가깝지만, 문맥상 제사장이 하던 행위를 중단하라는 뜻이므로 구체적 이미지를 살리면서도 자연스러운 명령인 ‘손을 거두십시오’로 옮겼습니다.
theological_decisions:
- issue: 사울의 명령 대상과 어조
  chosen_reading: 사울이 제사장에게 공손한 명령형으로 중단을 지시하는 장면으로 옮겼습니다.
  alternative_readings:
  - 평서형으로 완만하게 번역
  - 더 거친 명령조로 번역
  rationale: 본문은 긴박한 전투 상황 속에서도 사울이 제사장에게 직접 지시하는 장면이므로, 합쇼체 명령을 사용하되 지나친 격조 상승은 피했습니다.
  doctrine_reference: 서사 문맥의 화행과 인물 관계 반영
- issue: ‘손을 거두다’의 관용성
  chosen_reading: 제사장의 진행 중인 행위를 멈추게 하는 관용적 표현으로 처리했습니다.
  alternative_readings:
  - ‘손을 모으십시오’의 직역 유지
  - ‘중단하십시오’로 완전 의역
  rationale: 히브리어의 구체 이미지를 완전히 지우지 않으면서도, 제사장 행위 중지를 뜻하는 점을 한국어 독자가 즉시 이해하도록 균형을 맞췄습니다.
  doctrine_reference: 서사적 지시문의 행위적 의미 보존
