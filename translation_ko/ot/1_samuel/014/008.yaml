  chosen_korean: 건너가면
  alternatives_korean:
  - 건너가고 있으면
  - 건너가겠습니다
  lexicon: HALOT
  rationale: 임박한 이동을 나타내는 분사적 표현을 한국어에서는 계획적·의도적 상황에 맞게 조건/전망 뉘앙스로 자연화했습니다.
- source_word: וְנִגְלִינוּ
  english_pob_choice: we will show ourselves
  chosen_korean: 우리 모습을 드러낼 것입니다
  alternatives_korean:
  - 우리 자신을 보일 것입니다
  - 우리를 드러낼 것입니다
  lexicon: HALOT
  rationale: 니팔형의 자기-드러냄을 직역하면 부자연스러워서, 의도적으로 자신을 노출한다는 의미를 살려 '우리 모습을 드러내다'로 옮겼습니다.
theological_decisions:
- issue: 대화체에서의 자기 노출 표현
  chosen_reading: 군사적 상황에서 적에게 의도적으로 자신을 드러내는 계획으로 이해하고, 과도하게 해석하지 않고 문자적 행동을 살렸습니다.
  alternative_readings:
  - 자신을 알리다
  - 정체를 드러내다
  rationale: 히브리어 니팔 동사의 기본 의미와 문맥상 긴박한 전술적 행동을 유지하기 위해, 심리적·상징적 의미로 확장하지 않았습니다.
  doctrine_reference: 본문 문맥 우선, 서사적 의미 보존
