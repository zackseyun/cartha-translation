lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 이르렀습니다
  lexicon: HALOT
  rationale: 서술문의 직접 화법 도입으로 자연스러운 현대 한국어 공적 문체를 택했고, 단순 과거 서술로 처리했습니다.
