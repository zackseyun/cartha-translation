  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사이므로 합쇼체에서 가장 자연스럽게 그 힘을 살리는 호명 표현으로 옮겼습니다.
- source_word: עֹבְרִים
