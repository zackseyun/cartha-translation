base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/020.yaml
  text: Then Saul and all the people who were with him were summoned, and they came to the battle[a]. And behold, every man's sword was against his companion[b], with very great confusion.
  footnotes:
  - marker: a
    text: Or 'Then Saul and all the people who were with him cried out' or 'were called together.' The Hebrew verb can be understood in more than one way here.
    reason: lexical_alternative
  - marker: b
    text: Or 'a very great panic' or 'a very great tumult.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울과 그와 함께 있던 모든 백성이 소집되었고, 전투에 이르렀습니다[a]. 그런데 보십시오, 각 사람의 칼이 자기 동료를 향하고 있었으며, 매우 큰 혼란이 있었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외쳐 모였다’ 혹은 ‘함께 불려 모였다’로도 옮길 수 있습니다. 히브리어 동사는 여기서 여러 방식으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘매우 큰 공황’ 혹은 ‘매우 큰 소동’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֵק
  english_pob_choice: were summoned
  chosen_korean: 소집되어
  alternatives_korean:
  - 외쳐 모여
  - 불려 모여
  - 소집되었고
  lexicon: HALOT
  rationale: Niphal의 수동·반사적 뉘앙스를 살려, 활발히 ‘돌격하다’보다 ‘소집되다’가 문맥의 집결 의미를 더 정확히 드러냅니다.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  english_pob_choice: all the people who were with him
  chosen_korean: 그와 함께 있던 모든 백성
  alternatives_korean:
  - 그와 함께 있던 모든 사람들
  - 그와 함께한 모든 군사
  - 그와 함께 있던 모든 백성들
  lexicon: HALOT
  rationale: עָם의 기본어감인 ‘백성’을 살리되, 전투 맥락에서 과도하게 군사로 한정하지 않고 원문 구조를 유지했습니다.
- source_word: וַיָּבֹאוּ עַד הַמִּלְחָמָה
  english_pob_choice: they came to the battle
  chosen_korean: 전투에 이르렀습니다
  alternatives_korean:
  - 전투에 왔습니다
  - 전투 현장에 도착했습니다
  - 전투에 나아갔습니다
  lexicon: HALOT
  rationale: בוא + עד는 ‘어느 지점에 이르다’의 느낌이 있어, ‘이르렀습니다’가 도착·접근을 함께 담아냅니다.
- source_word: חֶרֶב אִישׁ בְּרֵעֵהוּ
  english_pob_choice: every man's sword was against his companion
  chosen_korean: 각 사람의 칼이 자기 동료를 향하고 있었고
  alternatives_korean:
  - 각 사람의 칼이 자기 이웃을 향하고 있었고
  - 각 사람의 칼이 서로에게 향하고 있었고
  - 각 사람의 칼이 자기 동료와 맞서고 있었고
  lexicon: HALOT
  rationale: 직역적 구조를 유지하면서 רֵעַ의 관계성을 ‘동료’로 옮겨, 우호적 뉘앙스를 과도하게 넣지 않았습니다.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  english_pob_choice: with very great confusion
  chosen_korean: 매우 큰 혼란
  alternatives_korean:
  - 매우 큰 공포
  - 매우 큰 소동
  - 극심한 혼란
  lexicon: HALOT
  rationale: מְהוּמָה는 혼란·공포·소동을 아우르지만, 이 문맥에서는 내부 붕괴와 뒤엉킴을 나타내므로 ‘혼란’이 가장 넓고 자연스럽습니다.
theological_decisions:
- issue: וַיִּזָּעֵק의 행위 주체와 의미를 능동적 ‘돌격’으로 풀지 여부
  chosen_reading: 수동·반사적 의미를 따라 ‘소집되어’로 옮겼습니다.
  alternative_readings:
  - ‘외쳐 모여’
  - ‘돌격하여’
  - ‘함께 외쳤다’
  rationale: 원문은 Niphal 형태이며, 영어 POB의 최종 audit도 ‘were summoned’로 이 수동/집결 읽기를 지지합니다. 능동적 전투 행위로 바꾸면 형태론적 긴장이 사라집니다.
  doctrine_reference: 본문 형태론·문맥 일치 원칙
- issue: 마지막 절의 מְהוּמָה를 단순 감정어로 축소할지 여부
  chosen_reading: ‘매우 큰 혼란’으로 유지했습니다.
  alternative_readings:
  - ‘매우 큰 공포’
  - ‘매우 큰 소동’
  rationale: 문맥은 블레셋 진영의 상호 공격을 촉발하는 전면적 붕괴를 말하므로, 공포만으로 좁히지 않고 혼란의 포괄성을 살렸습니다.
  doctrine_reference: 서술 문맥 우선 원칙
