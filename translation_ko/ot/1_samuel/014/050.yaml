  yaml_path: translation/ot/1_samuel/014/050.yaml
  text: The name of Saul’s wife was Ahinoam daughter of Ahimaaz[a], and the name of the commander of his army was Abner son of Ner, Saul’s uncle.
  footnotes:
  - marker: a
    text: Or 'Saul’s kinsman'; the Hebrew word can denote a close male relative more broadly, though 'uncle' best fits the genealogical context.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울의 아내는 아히마아스의 딸 아히노암이었습니다. 사울의 군대 지휘관은 사울의 숙부인 네르의 아들 아브넬이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사울의 친족인 네르의 아들”일 수 있습니다. 히브리어 단어는 더 넓은 남자 친족을 가리킬 수도 있으나, 이어지는 족보 문맥에서는 “숙부”가 가장 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם / אֵשֶׁת
  english_pob_choice: The name ... was / wife
  chosen_korean: “이름은 …이었는데” / “아내”
  alternatives_korean:
  - “이름은 …였습니다” / “부인”
  - “그 이름은 …이었고” / “여자”
  lexicon: HALOT
  rationale: 히브리어의 명시적 소개 공식은 한국어에서 자연스러운 서술형으로 옮기되, אֵשֶׁת은 사울과의 결혼관계를 분명히 드러내는 “아내”가 가장 정확합니다.
- source_word: בַּת
  english_pob_choice: daughter of
  chosen_korean: “~의 딸”
  alternatives_korean:
  - “딸”
  - “~에게서 난 딸”
  lexicon: HALOT
  rationale: 족보 문맥의 표준 관계표현이므로 “아히마아스의 딸”로 간결하게 옮겼습니다.
- source_word: שַׂר צְבָא/וֹ
  english_pob_choice: commander of his army
  chosen_korean: “군대 대장”
  alternatives_korean:
  - “군대의 지휘관”
  - “군대의 장관”
  lexicon: HALOT
  rationale: 군사적 직함을 현대 한국어에서 자연스럽고 정확하게 전달하기 위해 “군대 대장”을 택했습니다. “his army”는 소유관계를 분명히 하기보다 문맥상 사울의 군대임을 드러냅니다.
- source_word: דּוֹד
  english_pob_choice: Saul’s uncle
  chosen_korean: “숙부”
  alternatives_korean:
  - “삼촌”
  - “사촌”
  - “친족”
  lexicon: HALOT
  rationale: 영어 POB가 본문 맥락상 ‘uncle’을 택한 점을 반영하되, 한국어 족보 문맥에서는 보다 문어적이고 친족관계를 분명히 하는 “숙부”가 적절합니다.
theological_decisions:
- issue: 사울과 아브넬의 친족관계 표현
  chosen_reading: “사울의 숙부”로 직역해 친족 관계를 분명히 했습니다.
  alternative_readings:
  - “사울의 친족”
  - “사울의 아저씨”
  rationale: 본문의 דּוֹד는 이 문맥에서 단순한 ‘친족’보다 구체적인 가족관계를 가리키는 것으로 읽는 것이 가장 자연스럽고, 영어 POB의 각주도 이 해석을 지지합니다.
  doctrine_reference: 족보/서술 문맥 해석
