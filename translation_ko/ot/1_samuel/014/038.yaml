source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל גֹּ֣שֽׁוּ הֲלֹ֔ם כֹּ֖ל פִּנּ֣וֹת הָ/עָ֑ם וּ/דְע֣וּ וּ/רְא֔וּ בַּ/מָּ֗ה הָֽיְתָ֛ה הַ/חַטָּ֥את הַ/זֹּ֖את הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/038.yaml
  text: Then Saul said[a], “Come here, all you chiefs of the people, and know and see by what this sin has happened today.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'all the corners of the people,' an idiom for the people's leaders or representatives.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 사울이 말했습니다. 「이리로 오십시오, 백성의 지도자들 모두여.[a] 그리고 오늘 이 죄가 무엇 때문에 생겼는지 알아보고 살펴보십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘백성의 모든 귀퉁이’로, 백성의 지도자나 대표자들을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּשׁוּ הֲלֹם
  english_pob_choice: Come here
  chosen_korean: 이리로 오십시오
  alternatives_korean:
  - 가까이 오십시오
  - 이쪽으로 오십시오
  lexicon: HALOT
  rationale: 지시 부사 הֲלֹם이 붙은 복수 명령은 사울에게 가까이 나오라는 호소이므로, 현대 한국어의 자연스러운 명령형인 ‘이리로 오십시오’로 옮겼습니다.
- source_word: כֹּל פִּנּוֹת הָעָם
  english_pob_choice: all you leaders of the people
  chosen_korean: 백성의 지도자들 모두
  alternatives_korean:
  - 백성의 귀퉁이들 모두
  - 백성의 우두머리들 모두
  - 백성의 대표자들 모두
  lexicon: HALOT
  rationale: 직역하면 ‘백성의 모든 귀퉁이’지만, 문맥상 각 집단을 대표하는 유력자들을 가리키는 관용구이므로 의미를 드러내는 ‘백성의 지도자들’로 옮겼습니다.
- source_word: וּדְעוּ וּרְאוּ
  english_pob_choice: and know and see
  chosen_korean: 알고 살펴보십시오
  alternatives_korean:
  - 알아보고 보십시오
  - 알아내고 확인하십시오
  - 알고 보고 판단하십시오
  lexicon: HALOT
  rationale: 두 명령형의 중첩이 조사와 확인의 강한 촉구를 이루므로, 한국어에서는 의미가 겹치지 않도록 ‘알고 살펴보십시오’로 압축해 살렸습니다.
- source_word: הַחַטָּאת הַזֹּאת
  english_pob_choice: this sin
  chosen_korean: 이 죄
  alternatives_korean:
  - 이 죄과
  - 이 잘못
  - 이 허물
  lexicon: HALOT
  rationale: 이야기 문맥에서 하나님 앞의 범죄를 가리키므로, 신학적 무게를 유지하는 가장 직접적인 대응어인 ‘죄’를 택했습니다.
theological_decisions:
- issue: 히브리 관용구 פִּנּוֹת הָעָם의 처리
  chosen_reading: ‘백성의 지도자들’로 의역해 대표성과 유력함을 드러냈습니다.
  alternative_readings:
  - ‘백성의 모든 귀퉁이’로 직역
  - ‘백성의 우두머리들’로 번역
  rationale: 관용구를 문자적으로 옮기면 한국어 독자가 의미를 놓치기 쉽기 때문에, 본문이 요구하는 기능적 의미를 드러내는 방식이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: חטאת의 신학적 강도
  chosen_reading: ‘죄’로 번역해 사울이 다루는 문제를 단순 실수보다 하나님 앞의 범죄로 보이게 했습니다.
  alternative_readings:
  - ‘잘못’
  - ‘허물’
  - ‘죄과’
  rationale: 본문은 분별이 필요한 죄의 원인을 추적하는 장면이므로, 도덕적 완화가 적은 ‘죄’가 문맥의 긴장을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §5
