  - 벧아웬 너머로 지나갔습니다
  - 벧아웬을 지난 뒤로 전개되었습니다
  lexicon: HALOT
  rationale: עבר의 공간적 이동을 자연스러운 한국어로 옮기되, 전투의 진로가 벧아웬을 지나 확장되었다는 뜻을 과도하게 해석하지 않도록 했습니다.
