lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 원문의 여호와(יהוה)를 고유명으로 드러내기 위해 전통적 대체어가 아니라 학술적 음역인 ‘야훼’를 따랐습니다.
- source_word: וַיּוֹשַׁע
  english_pob_choice: saved
  chosen_korean: 구원하셨고
  alternatives_korean:
  - 구해 주셨고
  - 승리를 주셨고
  - 건져 내셨고
  lexicon: HALOT
  rationale: 히필 형태의 ‘구원하다/구출하다’ 의미를 살려, 야훼가 주체가 되어 이스라엘을 구원하신다는 신학적 무게를 보존했습니다.
- source_word: עָבְרָה אֶת בֵּית אָוֶן
  english_pob_choice: passed beyond Beth-aven
  chosen_korean: 벧아웬을 지나갔습니다
  alternatives_korean:
  - 벧아웬을 넘어서 갔습니다
  - 벧아웬 너머로 지나갔습니다
  - 벧아웬을 지난 뒤로 전개되었습니다
  lexicon: HALOT
  rationale: עבר의 공간적 이동을 자연스러운 한국어로 옮기되, 전투의 진로가 벧아웬을 지나 확장되었다는 뜻을 과도하게 해석하지 않도록 했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 하나님의 언약 이름 יהוה를 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 하나님의 고유한 이름을 사용하므로, 대체 칭호로 바꾸지 않고 그 이름 자체를 드러내는 번역 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
