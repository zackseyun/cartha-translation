  lexicon: HALOT
  rationale: 히필 형태의 ‘구원하다/구출하다’ 의미를 살려, 야훼가 주체가 되어 이스라엘을 구원하신다는 신학적 무게를 보존했습니다.
- source_word: עָבְרָה אֶת בֵּית אָוֶן
