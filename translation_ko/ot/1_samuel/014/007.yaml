  text: His armor-bearer said to him, “Do all that is in your heart. Go on; here I am with you, according to your heart.”
translation:
  language: ko
  text: 그의 무기든 자가 그에게 말했습니다. “마음에 있는 것은 모두 하십시오. 앞으로 나아가십시오. 보십시오, 제가 당신과 함께 있으니, 당신의 마음에 맞습니다.”[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 무기든 자’입니다. 전통적 한국어 성경의 ‘병기 든 자’보다 현대 독자가 이해하기 쉬운 표현을 택했습니다.
    reason: korean_style_note
  - marker: b
    text: 히브리어 נְטֵה לָךְ는 여기서 단순한 방향 전환보다 ‘앞으로 나아가라/계속 가라’는 촉구로 이해될 수 있습니다. 영어 POB도 ‘Go on’으로 정리했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  english_pob_choice: His armor-bearer
  chosen_korean: 그의 무기든 자
  alternatives_korean:
  - 그의 갑옷 든 자
  - 그의 무기 운반자
  lexicon: נֹשֵׂא / כֵּלִים
  rationale: 무기와 장비를 함께 맡아 나르는 수행자를 가리키므로, 전통적 군사 맥락을 살려 ‘무기든 자’로 옮겼습니다.
- source_word: עֲשֵׂה כָּל אֲשֶׁר בִּלְבָבֶךָ
  english_pob_choice: Do all that is in your heart
  chosen_korean: 마음에 있는 것은 모두 하십시오
  alternatives_korean:
  - 마음에 둔 것을 모두 하십시오
  - 마음속에 있는 것을 다 행하십시오
  lexicon: לֵב / לֵבָב
  rationale: 히브리어 ‘마음’은 단순 감정이 아니라 의지와 결정을 포함하므로, ‘마음에 있는 것’을 자연스럽고 직역에 가깝게 표현했습니다.
- source_word: נְטֵה לָךְ
  english_pob_choice: Go on
  chosen_korean: 앞으로 나아가십시오
  alternatives_korean:
  - 가십시오
  - 계속 가십시오
  lexicon: נטה
  rationale: 영어 POB가 ‘Go on’으로 정리한 진행·촉구의 의미를 따라, 단순 이동보다 결단을 재촉하는 뉘앙스를 살렸습니다.
- source_word: הִנְנִי עִמְּךָ
  english_pob_choice: here I am with you
  chosen_korean: 보십시오, 제가 당신과 함께 있으니
  alternatives_korean:
  - 제가 당신과 함께 있습니다
  - 자, 제가 당신과 함께 있습니다
  lexicon: הִנְנִי
  rationale: ‘히넨니’의 주의를 끄는 응답성을 살리기 위해 ‘보십시오’를 보태되, 이어지는 동반 선언은 평이하게 옮겼습니다.
theological_decisions:
- issue: ‘according to your heart’의 해석
  chosen_reading: ‘당신의 마음에 맞습니다’로 옮겨, 동의와 일치의 의미를 분명히 했습니다.
  alternative_readings:
  - ‘당신의 마음대로’
  - ‘당신이 원하는 대로’
  rationale: 본문은 단순 허용이 아니라 조력자의 전적인 동의와 동행을 드러내므로, 마음의 소원과 일치함을 드러내는 표현을 택했습니다.
  doctrine_reference: 사무엘상 14:7 문맥의 서술적 진술
