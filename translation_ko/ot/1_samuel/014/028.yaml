source:
  edition: WLC
  text: וַ/יַּעַן֩ אִ֨ישׁ מֵֽ/הָ/עָ֜ם וַ/יֹּ֗אמֶר הַשְׁבֵּעַ֩ הִשְׁבִּ֨יעַ אָבִ֤י/ךָ אֶת הָ/עָם֙ לֵ/אמֹ֔ר אָר֥וּר הָ/אִ֛ישׁ אֲשֶׁר יֹ֥אכַל לֶ֖חֶם הַ/יּ֑וֹם וַ/יָּ֖עַף הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/028.yaml
  text: Then one of the people answered and said[a], “Your father strictly put the people under oath, saying[b], ‘Cursed is the man who eats food today.’ So the people were faint.”
  footnotes:
  - marker: a
    text: Hebrew 'bread'; here used more broadly for food in general.
    reason: lexical_alternative
  - marker: b
    text: Or 'the people became weary' / 'the people were exhausted.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 백성 가운데 한 사람이 대답하여 말했습니다. “아버지께서 백성에게 엄히 맹세하게 하시며 말씀하시기를, ‘오늘 음식을 먹는 사람은 저주를 받을 것이다’ 하셨습니다.” 그래서 백성은 기진했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘빵’은 여기서 일반적인 음식 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘백성이 지쳤습니다’ / ‘백성이 기진했습니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 응답하여 말했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 서사적 대화에서의 표준 반응 동사로, 히브리어의 응답 동작을 자연스럽게 살립니다.
- source_word: אִישׁ מֵהָעָם
  english_pob_choice: one of the people
  chosen_korean: 백성 가운데 한 사람
  alternatives_korean:
  - 백성 중 한 사람
  - 한 백성의 사람
  lexicon: HALOT
  rationale: 직역하면 ‘백성 가운데 한 사람’이며, 화자가 특정되지 않은 단수 개인임을 그대로 드러냅니다.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  english_pob_choice: strictly put ... under oath
  chosen_korean: 엄히 맹세하게 하시며
  alternatives_korean:
  - 엄중히 맹세시키며
  - 강제로 맹세하게 하시며
  - 맹세를 시키며
  lexicon: HALOT
  rationale: 강조형 구성(부정사 절대형+동사)의 압박감을 살리되, 한국어에서는 ‘엄히’와 ‘맹세하게 하다’로 자연스럽게 옮겼습니다.
- source_word: לֶחֶם
  english_pob_choice: food
  chosen_korean: 음식
  alternatives_korean:
  - 빵
  - 먹을 것
  lexicon: HALOT
  rationale: 문맥상 특정한 빵이 아니라 일반적인 먹을거리를 가리키므로, POB의 넓은 의미를 반영해 ‘음식’으로 옮겼습니다.
- source_word: וַיָּעַף
  english_pob_choice: were faint
  chosen_korean: 기진했습니다
  alternatives_korean:
  - 기운이 빠졌습니다
  - 지쳐 있었습니다
  - 기절할 듯했습니다
  lexicon: HALOT
  rationale: 단순 피로보다 금식으로 인한 쇠약을 나타내므로, 문맥에 맞는 ‘기진했습니다’가 적절합니다.
theological_decisions:
- issue: 금식 서원으로 인한 백성의 쇠약 상태 묘사
  chosen_reading: 본문의 진술을 있는 그대로 ‘기진했습니다’로 옮겨, 서원의 결과로 공동체가 실제로 쇠약해졌음을 드러냈습니다.
  alternative_readings:
  - ‘지쳤습니다’로 완화
  - ‘피곤했습니다’로 일반화
  rationale: 히브리어 동사는 단순 피로보다 탈진에 가까운 상태를 가리키며, 문맥상 서원의 부작용을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 본문 맥락과 서사적 의미 보존
