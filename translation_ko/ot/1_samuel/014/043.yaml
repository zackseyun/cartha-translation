    issue: ‘저는 죽게 되어 있습니다’
    rationale: 원문의 אָמוּת는 능동형 1인칭 미완료형입니다. 문맥상 임박한 결과와 항의의 여지는 있으나, ‘죽게 되어 있다’는 수동적 숙명성을 다소 더합니다. ‘저는 죽겠습니다’가 더 직접적이며, 각주가 수사적 질문 가능성을 보존합니다.
