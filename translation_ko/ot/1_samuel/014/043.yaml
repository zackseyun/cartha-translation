    rationale: ‘곧’은 히브리어 본문에 대응하지 않으며, ‘지팡이 끝에서’는 맛본 행위의 수단 또는 꿀이 있던 위치를 매끄럽게 표현하지 못합니다. בִּקְצֵה הַמַּטֶּה는 ‘손에 든 지팡이 끝으로’가 자연스럽고 충실합니다.
