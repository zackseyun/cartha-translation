  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ אֶל י֣וֹנָתָ֔ן הַגִּ֥ידָ/ה לִּ֖/י מֶ֣ה עָשִׂ֑יתָה וַ/יַּגֶּד ל֣/וֹ יוֹנָתָ֗ן וַ/יֹּאמֶר֩ טָעֹ֨ם טָעַ֜מְתִּי בִּ/קְצֵ֨ה הַ/מַּטֶּ֧ה אֲשֶׁר בְּ/יָדִ֛/י מְעַ֥ט דְּבַ֖שׁ הִנְ/נִ֥י אָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/043.yaml
  text: Then Saul said to Jonathan[a], “Tell me what you have done.” And Jonathan told him and said, “I indeed tasted a little honey on the tip of the staff that was in my hand, and here I am, about to die.”
  footnotes:
  - marker: a
    text: Or, “I did indeed taste a little honey … and now must I die?” The Hebrew intensifies the verb “taste,” and the final clause can be heard as either resigned statement or rhetorical protest.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울이 요나단에게 말했습니다. “네가 한 일을 내게 말해라.” 요나단이 그에게 말했습니다. “제가 손에 든 지팡이 끝으로 꿀을 조금 맛본 것은 분명합니다. 보십시오, 저는 죽겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제가 손에 든 지팡이 끝으로 꿀을 조금 맛본 것은 분명합니다 … 그런데 이제 제가 죽어야 합니까?” 히브리어는 ‘맛보다’를 강하게 강조하며, 마지막 절은 체념적 진술로도 수사적 항의로도 들릴 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידָה לִּי
  english_pob_choice: Tell me
  chosen_korean: 내게 알려라
  alternatives_korean:
  - 말해라
  - 전해라
  lexicon: HALOT נגד
  rationale: 명령형 נגד의 직접적 요구를 살리면서도 현대 한국어에서 자연스럽고 강한 요구로 들리게 했습니다.
- source_word: מֶה עָשִׂיתָה
  english_pob_choice: what you have done
  chosen_korean: 네가 한 일
  alternatives_korean:
  - 네가 무엇을 했는지
  - 네가 한 것
  lexicon: HALOT עשה
  rationale: 완료된 행위에 대한 추궁이라는 뉘앙스를 자연스러운 한국어 명사구로 옮겼습니다.
- source_word: טָעֹם טָעַמְתִּי
  english_pob_choice: I indeed tasted
  chosen_korean: 제가 정말 꿀을 조금 맛보았습니다
  alternatives_korean:
  - 제가 실제로 꿀을 맛보았습니다
  - 제가 꿀을 조금 맛보았습니다
  lexicon: HALOT טעם
  rationale: 어근의 강조를 ‘정말’로 살리되, 문맥상 최소한만 맛본 변명의 톤도 함께 드러내도록 했습니다.
- source_word: בִּקְצֵה הַמַּטֶּה
  english_pob_choice: on the tip of the staff
  chosen_korean: 지팡이 끝에서
  alternatives_korean:
  - 막대기 끝에서
  - 지팡이의 끝에서
  lexicon: HALOT קצה, מטה
  rationale: קצה의 ‘끝’과 막대형 도구를 가리키는 מטה를 현대 한국어의 ‘지팡이’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: Jonathan의 마지막 진술의 어조
  chosen_reading: “보십시오, 저는 죽게 되어 있습니다”로 마무리하여, 단순 미래보다 임박한 판결 앞의 체념과 항의를 함께 드러냈습니다.
  alternative_readings:
  - “저는 죽을 것입니다”
  - “제가 죽어야 합니까?”
  rationale: 히브리어 אָמֽוּת는 맥락상 단순 예고보다 임박한 결과에 대한 말로 들릴 수 있어, POB의 긴장을 살리기 위해 한국어도 열린 어조로 유지했습니다.
  doctrine_reference: 서사 문맥과 히브리어 화용론
