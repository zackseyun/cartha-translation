revisions:
- from: 그때 사울이 요나단에게 말했습니다. “네가 한 일을 내게 알려라.” 요나단이 그에게 알려 주며 말했습니다. “제가 정말 꿀을 조금 맛보았습니다. 곧 제 손에 있던 지팡이 끝에서였는데, 보십시오, 저는 죽게 되어 있습니다.”[a]
  to: 그때 사울이 요나단에게 말했습니다. “네가 한 일을 내게 말해라.” 요나단이 그에게 말했습니다. “제가 손에 든 지팡이 끝으로 꿀을 조금 맛본 것은 분명합니다. 보십시오, 저는 죽겠습니다.”[a]
  rationale: 원문에 없는 연결어를 제거하고 지팡이 끝과 맛본 행위의 관계를 자연스러운 한국어로 바로잡았습니다. 동사의 강조와 꿀의 적은 양을 모두 유지했으며, 마지막 절의 진술/수사 의문 양면성은 본문을 과도하게 해석하지 않고 각주에서 보존했습니다.
