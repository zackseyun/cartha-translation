  text: וְ/כֹל֩ אִ֨ישׁ יִשְׂרָאֵ֜ל הַ/מִּֽתְחַבְּאִ֤ים בְּ/הַר אֶפְרַ֨יִם֙ שָֽׁמְע֔וּ כִּֽי נָ֖סוּ פְּלִשְׁתִּ֑ים וַֽ/יַּדְבְּק֥וּ גַם הֵ֛מָּה אַחֲרֵי/הֶ֖ם בַּ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/022.yaml
  text: And every man of Israel who had hidden themselves in the hill country of Ephraim heard that the Philistines had fled[a], and they too joined the pursuit in the battle.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and they clung after them in the battle,' an idiom meaning they closely pursued the fleeing Philistines.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 에브라임 산지에 숨어 있던 이스라엘 사람 모두가 블레셋 사람들이 도망쳤다는 것을 듣고, 그들도 전투에서 그들을 뒤쫓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들에게서 뒤에 달라붙었다’는 뜻으로, 도망치는 블레셋 사람들을 바짝 추격했다는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אִישׁ יִשְׂרָאֵל
  english_pob_choice: And every man of Israel
  chosen_korean: 이스라엘 사람 모두가
  alternatives_korean:
  - 이스라엘의 모든 남자가
  - 이스라엘의 모든 사람이
  lexicon: WLC; HALOT
  rationale: 히브리어의 분배적 표현을 한국어에서 가장 자연스럽게 풀어, 집합 전체를 가리키되 문맥상 남성 복수라는 점을 무리 없이 담았습니다.
- source_word: הַמִּתְחַבְּאִים
  english_pob_choice: who had hidden themselves
  chosen_korean: 숨어 있던
  alternatives_korean:
  - 자신을 숨겼던
  - 숨어 있었던
  lexicon: HALOT
  rationale: 분사형이 묘사하는 지속 상태를 한국어 관용으로 옮겨, 과거 시점에서 ‘숨어 있던’으로 자연스럽게 표현했습니다.
- source_word: וַיַּדְבְּקוּ גַם הֵמָּה אַחֲרֵיהֶם
  english_pob_choice: they too joined the pursuit
  chosen_korean: 그들도 … 뒤쫓았습니다
  alternatives_korean:
  - 그들도 … 바짝 뒤따랐습니다
  - 그들도 … 쫓아붙었습니다
  lexicon: HALOT
  rationale: דבק + אחרי의 군사적 관용구를 한국어에서 ‘뒤쫓다’로 옮겨, 단순히 ‘합류하다’보다 추격의 동작을 분명히 드러냈습니다.
