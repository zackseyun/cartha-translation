revisions:
- from: 이제 아히훗의 아들 아히야— 이 사람은 이가봇의 형이며, 비느하스의 아들이요 엘리의 손자였습니다— 는 실로에서 야훼의 제사장으로서 에봇을 메고 있었습니다. 그런데 백성은 요나단이 떠난 줄을 알지 못했습니다.[a]
  to: 아히둡의 아들 아히야가 있었습니다. 아히둡은 비느하스의 아들이요 엘리의 손자인 이가봇의 형제였습니다. 아히야는 실로에서 야훼의 제사장으로서 에봇을 지니고 있었습니다[a]. 백성은 요나단이 떠난 줄을 알지 못했습니다.
  rationale: 원문 계보의 수식 관계를 분명하고 자연스러운 한국어 문장으로 재구성했습니다. 아히야가 아히둡의 아들이고, 아히둡이 이가봇의 형제이며, 이가봇이 비느하스의 아들이자 엘리의 손자라는 관계를 보존했습니다. ‘이제’와 ‘형’을 제거하여 각각 불필요한 담화 표지와 원문에 없는 연령 정보를 피했습니다. 에봇에 대해서는 ‘입다’로 단정하지 않고 נשא의 기본 의미 범위에 맞는 ‘지니고 있다’를 사용했으며, 각주는 해당 표현에 직접 연결했습니다.
