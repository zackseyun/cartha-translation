  source_fidelity: 수정이 필요합니다. 히브리어의 계보 연결은 아히야를 아히둡의 아들로, 아히둡을 이가봇의 형제로, 이가봇을 비느하스의 아들 및 엘리의 손자로 연결하는 것이 문맥과 계보에 부합합니다. 초안은 ‘비느하스의 아들이요 엘리의 손자’가 아히야를 수식하는 듯하여 계보 관계를 잘못 전달합니다. 또한 וַ를 ‘이제’로 반드시 번역할 근거는 충분하지 않습니다.
  naturalness: ‘에봇을 메고’는 에봇의 성격상 다소 부자연스러울 수 있으므로, נשא의 넓은 ‘지니다/지다’ 의미를 보존하는 ‘에봇을 지니고 있었습니다’가 현대 한국어에서 더 자연스럽습니다. 각주 표지는 에봇 관련 표현 바로 뒤에 놓아야 합니다.
  terminology: 인명은 아히야, 아히둡, 이가봇, 비느하스, 엘리로 통일하고, יהוה는 프로젝트 방침에 따라 ‘야훼’, כֹּהֵן은 ‘제사장’, אֵפוֹד는 ‘에봇’으로 유지합니다. ‘형’은 출생 순서를 단정하므로, 원문의 אחי에 맞게 ‘형제’로 고칩니다.
