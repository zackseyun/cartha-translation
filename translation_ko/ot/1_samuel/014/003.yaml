  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲחִיָּ֣ה בֶן אֲחִט֡וּב אֲחִ֡י אִיכָב֣וֹד בֶּן פִּינְחָ֨ס בֶּן עֵלִ֜י כֹּהֵ֧ן יְהוָ֛ה בְּ/שִׁל֖וֹ נֹשֵׂ֣א אֵפ֑וֹד וְ/הָ/עָם֙ לֹ֣א יָדַ֔ע כִּ֥י הָלַ֖ךְ יוֹנָתָֽן־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/003.yaml
  text: Now Ahijah son of Ahitub[a], brother of Ichabod, son of Phinehas, son of Eli, priest of Yahweh at Shiloh, was carrying an ephod. And the people did not know that Jonathan had gone.
  footnotes:
  - marker: a
    text: Or 'was wearing an ephod.' The Hebrew literally says 'bearing/carrying an ephod.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 아히훗의 아들 아히야— 이 사람은 이가봇의 형이며, 비느하스의 아들이요 엘리의 손자였습니다— 는 실로에서 야훼의 제사장으로서 에봇을 메고 있었습니다. 그런데 백성은 요나단이 떠난 줄을 알지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에봇을 입고 있었다.’ 히브리어는 문자적으로 ‘에봇을 메고/지고 있었다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחִיָּה
  english_pob_choice: Now Ahijah
  chosen_korean: 이제 아히야
  alternatives_korean:
  - 그리고 아히야
  - 아히야
  lexicon: HALOT
  rationale: 서술 진행을 여는 וַ를 한국어에서는 문맥상 자연스러운 장면 전환 표지인 ‘이제’로 살렸습니다.
- source_word: אֲחִי אִיכָבוֹד
  english_pob_choice: brother of Ichabod
  chosen_korean: 이가봇의 형
  alternatives_korean:
  - 이가봇의 형제
  - 이가봇의 친족
  lexicon: HALOT
  rationale: 직역의 ‘형제’보다 문맥상 자연한 친족 관계를 유지하면서, 영어 POB의 plain sense를 따라 ‘형’으로 옮겼습니다.
- source_word: כֹּהֵן יְהוָה
  english_pob_choice: priest of Yahweh
  chosen_korean: 야훼의 제사장
  alternatives_korean:
  - 야훼의 사제
  - 여호와의 제사장
  lexicon: HALOT
  rationale: כֹּהֵן은 제의적 직분을 가리키므로 한국어 성경 용례에 맞는 ‘제사장’을 썼고, יְהוָה는 본문 원형을 살려 ‘야훼’로 옮겼습니다.
- source_word: נֹשֵׂא אֵפוֹד
  english_pob_choice: was carrying an ephod
  chosen_korean: 에봇을 메고 있었습니다
  alternatives_korean:
  - 에봇을 입고 있었습니다
  - 에봇을 지니고 있었습니다
  lexicon: HALOT
  rationale: נָשָׂא의 기본 의미인 ‘메다/들다’를 반영해 ‘메고’로 옮겼습니다. 영어 POB가 옷으로 단정하지 않고 ‘carrying’에 열어 둔 점을 따라, 의복화보다 원문 어휘를 우선했습니다.
- source_word: לֹא יָדַע כִּי הָלַךְ יוֹנָתָן
  english_pob_choice: did not know that Jonathan had gone
  chosen_korean: 요나단이 떠난 줄을 알지 못했습니다
  alternatives_korean:
  - 요나단이 간 줄을 알지 못했습니다
  - 요나단이 떠났다는 것을 알지 못했습니다
  lexicon: HALOT
  rationale: ידע 뒤의 내용절을 한국어 관용에 맞게 ‘-ㄴ 줄을 알지 못했습니다’로 옮겨, 사실 인식의 부재를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 본문의 יהוה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기준에 따라 신적 이름의 고유성을 보존하기 위해 전통적 대체 호칭 대신 음역형을 채택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
