  - 아히야
  lexicon: HALOT
  rationale: 서술 진행을 여는 וַ를 한국어에서는 문맥상 자연스러운 장면 전환 표지인 ‘이제’로 살렸습니다.
- source_word: אֲחִי אִיכָבוֹד
  english_pob_choice: brother of Ichabod
  chosen_korean: 이가봇의 형
  alternatives_korean:
  - 이가봇의 형제
  - 이가봇의 친족
  lexicon: HALOT
  rationale: 직역의 ‘형제’보다 문맥상 자연한 친족 관계를 유지하면서, 영어 POB의 plain sense를 따라 ‘형’으로 옮겼습니다.
- source_word: כֹּהֵן יְהוָה
  english_pob_choice: priest of Yahweh
  chosen_korean: 야훼의 제사장
  alternatives_korean:
  - 야훼의 사제
  - 여호와의 제사장
  lexicon: HALOT
  rationale: כֹּהֵן은 제의적 직분을 가리키므로 한국어 성경 용례에 맞는 ‘제사장’을 썼고, יְהוָה는 본문 원형을 살려 ‘야훼’로 옮겼습니다.
- source_word: נֹשֵׂא אֵפוֹד
  english_pob_choice: was carrying an ephod
  chosen_korean: 에봇을 메고 있었습니다
  alternatives_korean:
  - 에봇을 입고 있었습니다
  - 에봇을 지니고 있었습니다
  lexicon: HALOT
  rationale: נָשָׂא의 기본 의미인 ‘메다/들다’를 반영해 ‘메고’로 옮겼습니다. 영어 POB가 옷으로 단정하지 않고 ‘carrying’에 열어 둔 점을 따라, 의복화보다 원문 어휘를 우선했습니다.
- source_word: לֹא יָדַע כִּי הָלַךְ יוֹנָתָן
  english_pob_choice: did not know that Jonathan had gone
  chosen_korean: 요나단이 떠난 줄을 알지 못했습니다
  alternatives_korean:
  - 요나단이 간 줄을 알지 못했습니다
  - 요나단이 떠났다는 것을 알지 못했습니다
  lexicon: HALOT
  rationale: ידע 뒤의 내용절을 한국어 관용에 맞게 ‘-ㄴ 줄을 알지 못했습니다’로 옮겨, 사실 인식의 부재를 자연스럽게 드러냈습니다.
