  text: וַ/אֲחִיָּ֣ה בֶן אֲחִט֡וּב אֲחִ֡י אִיכָב֣וֹד בֶּן פִּינְחָ֨ס בֶּן עֵלִ֜י כֹּהֵ֧ן יְהוָ֛ה בְּ/שִׁל֖וֹ נֹשֵׂ֣א אֵפ֑וֹד וְ/הָ/עָם֙ לֹ֣א יָדַ֔ע כִּ֥י הָלַ֖ךְ יוֹנָתָֽן־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/003.yaml
  text: Now Ahijah son of Ahitub[a], brother of Ichabod, son of Phinehas, son of Eli, priest of Yahweh at Shiloh, was carrying an ephod. And the people did not know that Jonathan had gone.
  footnotes:
  - marker: a
    text: Or 'was wearing an ephod.' The Hebrew literally says 'bearing/carrying an ephod.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아히둡의 아들 아히야가 있었습니다. 아히둡은 비느하스의 아들이요 엘리의 손자인 이가봇의 형제였습니다. 아히야는 실로에서 야훼의 제사장으로서 에봇을 지니고 있었습니다[a]. 백성은 요나단이 떠난 줄을 알지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에봇을 입고 있었다.’ 히브리어는 문자적으로 ‘에봇을 지고 있었다’ 또는 ‘에봇을 지니고 있었다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחִיָּה
  english_pob_choice: Now Ahijah
  chosen_korean: 이제 아히야
  alternatives_korean:
