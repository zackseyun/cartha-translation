base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/040.yaml
  text: Then he said to all Israel[a], “You be on one side, and I and Jonathan my son will be on the other side.” And the people said to Saul, “Do what seems good in your eyes.”
  footnotes:
  - marker: a
    text: Or “be on one side … be on the other side.” The Hebrew uses the verb “be” with “to one side,” an idiom for taking one’s position in contrast to another party.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그는 온 이스라엘에게 말했습니다. 「너희는 한쪽에 서고, 나와 내 아들 요나단은 다른 쪽에 서겠습니다.」 그러자 백성이 사울에게 말했습니다. 「왕의 눈에 좋게 보이는 대로 하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘한쪽에 있다/서다’라는 관용구를 써서, 두 편으로 갈라 서는 배치를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵבֶר אֶחָד / תִּהְיוּ
  english_pob_choice: on one side / be
  chosen_korean: 한쪽에 서고
  alternatives_korean:
  - 한쪽에 있고
  - 한편에 서고
  - 한쪽으로 서고
  lexicon: HALOT
  rationale: 히브리어는 ‘~쪽에 있다/되다’의 관용적 용법이지만, 이 대결 구도에서는 자리 배치를 분명히 드러내는 ‘서다’가 자연스럽고 문맥의 대조를 살립니다.
- source_word: נִהְיֶה
  english_pob_choice: will stand / be
  chosen_korean: 다른 쪽에 서겠습니다
  alternatives_korean:
  - 다른 쪽에 있겠습니다
  - 반대편에 서겠습니다
  lexicon: HALOT
  rationale: 사울과 요나단이 백성과 대조되는 위치를 점한다는 점을 살려, 평행 구조를 유지하면서도 현대 한국어에서 읽기 쉬운 표현으로 옮겼습니다.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  english_pob_choice: what seems good in your eyes
  chosen_korean: 왕의 눈에 좋게 보이는 대로
  alternatives_korean:
  - 왕의 보기에 좋은 대로
  - 왕이 좋다고 여기는 대로
  - 왕의 눈에 옳게 보이는 대로
  lexicon: HALOT
  rationale: ‘눈에 좋다’는 히브리어 관용구를 직역에 가깝게 살리되, 한국어 어순에 맞춰 ‘보이는 대로’로 풀어 자연스럽게 했습니다.
- source_word: אַתֶּם / וַ/אֲנִי
  english_pob_choice: You / I
  chosen_korean: 너희는 / 나와
  alternatives_korean:
  - 너희는 / 나는
  - 너희는 / 나와 나는
  lexicon: HALOT
  rationale: 대조 구문을 간결하게 드러내기 위해 주어를 선명히 분리했고, ‘내 아들 요나단’은 원문의 병렬을 따라 붙여 번역했습니다.
theological_decisions:
- issue: 사울의 명령과 백성의 응답을 어떤 높임말 수준으로 옮길지
  chosen_reading: 사울의 명령은 서술체로, 백성의 응답은 사울에게 하는 직접 발화로 살리되 ‘하십시오’체를 사용했습니다.
  alternative_readings:
  - 모두 평서체로 통일
  - 백성의 말을 더 낮은 반말체로 번역
  rationale: 본문은 예의 수준보다 발화 구조가 핵심이므로, 현대 한국어에서 왕/지도자에게 하는 공손한 요청으로 자연스럽게 처리하되 원문의 긴장과 공적 장면을 유지했습니다.
  doctrine_reference: speech register in narrative dialogue
