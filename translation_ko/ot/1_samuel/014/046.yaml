  text: Then Saul went up from pursuing the Philistines[a], and the Philistines went to their own place.
  footnotes:
  - marker: a
    text: Or 'Then Saul withdrew from following after the Philistines.' The Hebrew literally says 'went up from after the Philistines,' an idiom for ending the pursuit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울은 블레셋 사람들을 추격하던 일을 멈추고[a] 올라갔으며, 블레셋 사람들은 자기들의 곳으로 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘블레셋 사람들 뒤를 따르던 데서 올라갔다’입니다. 이 문맥에서는 추격을 그쳤다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라갔고
  alternatives_korean:
  - 올라갔습니다
  - 물러났고
  - 철수했고
  lexicon: HALOT
  rationale: 직역하면 ‘올라가다’이지만, כאן에서는 추격을 끝내고 이동을 마치는 관용적 표현이므로 기본 동사는 살리되 문맥상 자연스럽게 옮겼습니다.
- source_word: מֵאַחֲרֵי
  english_pob_choice: from pursuing
  chosen_korean: 추격하던 일을 멈추고
  alternatives_korean:
  - 블레셋 사람들을 뒤따르던 데서
  - 블레셋 사람들을 추격하던 데서
  - 따라가던 데서
  lexicon: HALOT
  rationale: 히브리어의 문자적 의미는 ‘뒤에서부터’이지만, 군사 문맥에서는 추격을 중단했다는 뜻이므로 이를 한국어 관용으로 풀어 주었습니다.
- source_word: לִמְקוֹמָם
  english_pob_choice: to their own place
  chosen_korean: 자기들의 곳으로
  alternatives_korean:
  - 자기들의 자리로
  - 그들 자신의 곳으로
  - 그들 각자의 곳으로
  lexicon: HALOT
  rationale: מָקוֹם의 기본 의미인 ‘곳/장소’를 유지하되, ‘자기들의’로 소유 관계를 드러내 영어 POB의 ‘own’에 대응했습니다.
