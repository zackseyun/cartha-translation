base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/017.yaml
  text: Then Saul said to the people who were with him[a], “Please take a count and see who has gone from among us.” So they took a count, and behold, Jonathan and his armor-bearer were not there.
  footnotes:
  - marker: a
    text: Or 'muster' / 'number'; the Hebrew verb can mean to review or count those present.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 사울이 자기와 함께 있던 사람들에게 말했습니다. 「부디 인원을 세어 보고 우리 가운데서 누가 떠났는지 알아보시오.」 그들이 인원을 세어 보니, 요나단과 그의 무기를 드는 사람은 그곳에 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인원을 점검하다’ 또는 ‘인원을 파악하다’. 히브리어 동사는 여기서 함께 있는 사람들의 인원을 확인하는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקְדוּ
  english_pob_choice: take a count
  chosen_korean: 수를 세어 보다
  alternatives_korean:
  - 점검하다
  - 소집하다
  - 인원 수를 파악하다
  lexicon: HALOT
  rationale: 문맥상 군사적 임명이나 징벌이 아니라 현재 함께 있는 사람을 확인하는 뜻이므로, 자연스러운 현대 한국어로 ‘수를 세어 보다’라고 옮겼습니다.
- source_word: נָא
  english_pob_choice: Please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 지금
  - 청하건대
  lexicon: HALOT
  rationale: 명령을 누그러뜨리는 요청의 뉘앙스를 살리기 위해, 공손하지만 너무 구어적이지 않은 ‘부디’를 선택했습니다.
- source_word: וּרְאוּ
  english_pob_choice: and see
  chosen_korean: 그리고 확인하시오
  alternatives_korean:
  - 그리고 보시오
  - 그리고 찾아보시오
  - 그리고 알아보시오
  lexicon: HALOT
  rationale: 단순히 보는 것이 아니라 누가 빠졌는지 알아내라는 뜻이므로, 문맥 기능을 드러내는 ‘확인하시오’로 옮겼습니다.
- source_word: נֹשֵׂא כֵלָיו
  english_pob_choice: armor-bearer
  chosen_korean: 그의 무기를 드는 사람
  alternatives_korean:
  - 그의 무기 든 자
  - 무기 운반자
  - 그의 병기 들고 다니는 사람
  lexicon: HALOT
  rationale: 전통 교회 용어보다 히브리어 표현이 가리키는 역할을 직접 드러내기 위해, 표준적이면서도 서술적인 표현으로 옮겼습니다.
