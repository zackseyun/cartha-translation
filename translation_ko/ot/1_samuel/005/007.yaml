base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/007.yaml
  text: When the men of Ashdod saw that it was so[a], they said, “The ark of the God of Israel must not remain with us[b], because his hand is heavy against us and against Dagon our god.”
  footnotes:
  - marker: a
    text: Or 'must not stay with us.' The Hebrew verb can mean 'sit,' 'dwell,' or 'remain.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his hand is heavy against us,' an idiom for severe divine pressure or judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 아스돗 사람들이 그 일이 그러함을 보고 말했습니다. 「이스라엘 하나님의 궤가 우리와 함께 머물러서는 안 됩니다[a]. 그의 손이 우리와 우리 신 다곤에게 무겁게 내리기 때문입니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리와 함께 남아 있어서는 안 됩니다.’ 히브리어 동사는 ‘앉다, 거주하다, 머물다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 손이 우리와 우리 신 다곤 위에 무겁다’는 뜻으로, 심한 압박이나 심판을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ ... כִּי כֵן
  english_pob_choice: saw that it was so
  chosen_korean: 그것이 그렇게 된 것을 보고
  alternatives_korean:
  - 그것이 그렇게 된 것을 보고서
  - 그 일이 그러함을 보고
  lexicon: HALOT
  rationale: 결과를 확인한 뒤 말하는 장면이므로 ‘보고’로 자연스럽게 옮기되, כִּי כֵן의 확인 의미를 ‘그렇게 된 것’으로 드러냈습니다.
- source_word: אַנְשֵׁי אַשְׁדּוֹד
  english_pob_choice: the men of Ashdod
  chosen_korean: 아스돗 사람들이
  alternatives_korean:
  - 아스돗의 남자들이
  - 아스돗 사람들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘아스돗의 남자들’이지만, 한국어에서는 서술 역할을 하는 집단 지칭으로 ‘아스돗 사람들이’가 가장 자연스럽습니다.
- source_word: לֹא יֵשֵׁב
  english_pob_choice: must not remain
  chosen_korean: 머물러서는 안 됩니다
  alternatives_korean:
  - 남아 있어서는 안 됩니다
  - 머물면 안 됩니다
  - 거주해서는 안 됩니다
  lexicon: HALOT
  rationale: יָשַׁב의 기본 뜻을 살리면서도 궤의 지속적 임재를 한국어에서 자연스럽게 표현하기 위해 ‘머물러서는 안 됩니다’를 선택했습니다.
- source_word: קָשְׁתָה יָדוֹ עָלֵינוּ
  english_pob_choice: his hand is heavy against us
  chosen_korean: 그의 손이 우리에게 무겁게 내리기 때문입니다
  alternatives_korean:
  - 그의 손이 우리를 힘겹게 누르기 때문입니다
  - 그의 손이 우리에게 무겁기 때문입니다
  lexicon: HALOT
  rationale: ‘손이 무겁다’는 심판의 관용구를 보존하되, 한국어에서는 ‘무겁게 내리다’로 압박과 해악의 효과를 분명히 했습니다.
- source_word: וְעַל דָּגוֹן אֱלֹהֵינוּ
  english_pob_choice: and against Dagon our god
  chosen_korean: 우리 신 다곤에게
  alternatives_korean:
  - 우리 신 다곤을 향해
  - 우리 신 다곤에게도
  lexicon: HALOT
  rationale: 평행구조상 עָלֵינוּ와 같은 ‘에게’를 유지해 공격 대상성을 살렸고, ‘우리 신’은 블레셋인의 자기-진술을 그대로 반영합니다.
theological_decisions:
- issue: 야훼의 심판을 가리키는 ‘손’의 이미지
  chosen_reading: ‘그의 손이 우리에게 무겁게 내리기’로 심판의 압박 이미지를 유지했습니다.
  alternative_readings:
  - 그가 우리를 심하게 치기
  - 그가 우리를 징계하기
  rationale: 히브리어의 의인화된 심판 이미지를 설명으로 풀어버리기보다, 본문이 말하는 초월적 압박과 판단의 긴장을 유지하는 편이 서사에 더 충실합니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: 다곤을 ‘우리 신’으로 두는 화자의 관점
  chosen_reading: 주석 없이 본문에는 ‘우리 신 다곤’으로 유지했습니다.
  alternative_readings:
  - 우리 우상 다곤
  - 우리 신격 다곤
  rationale: 본문은 블레셋인들의 자기 진술을 그대로 전하므로, 평가어를 덧붙이지 않고 서술자의 관점을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
