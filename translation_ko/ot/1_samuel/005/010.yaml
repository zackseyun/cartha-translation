reference: 1 Samuel 5:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְשַׁלְּח֛וּ אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים עֶקְר֑וֹן וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן הָ/אֱלֹהִים֙ עֶקְר֔וֹן וַ/יִּזְעֲק֨וּ הָֽ/עֶקְרֹנִ֜ים לֵ/אמֹ֗ר הֵסַ֤בּוּ אֵלַ/י֙ אֶת אֲרוֹן֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לַ/הֲמִיתֵ֖/נִי וְ/אֶת עַמִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/010.yaml
  text: So they sent the ark of God to Ekron. But when the ark of God came to Ekron, the Ekronites cried out, saying, “They have brought around to me the ark of the God of Israel, to kill me and my people!”
translation:
  language: ko
  text: 그들은 하나님의 궤를 에그론으로 보냈습니다. 그런데 하나님의 궤가 에그론에 이르자, 에그론 사람들은 소리치며 말했습니다. “그들이 이스라엘의 하나님의 궤를 나에게로 가져와 나와 내 백성을 죽이려 합니다!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “에그론 사람들”은 히브리어 복수형 הָעֶקְרֹנִים을 따른 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: אֲרוֹן הָאֱלֹהִים / אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the ark of God / the ark of the God of Israel
  chosen_korean: 하나님의 궤 / 이스라엘의 하나님의 궤
  alternatives_korean:
  - 하나님의 언약궤
  - 하나님의 궤짝
  lexicon: אֲרוֹן
  rationale: 본문은 단순히 ‘궤’의 이동과 그 궤가 누구의 것인지를 반복해 강조하므로, POB의 직역 흐름을 따라 ‘하나님의 궤’로 두고, 뒤에서는 소유를 더 분명히 한 ‘이스라엘의 하나님의 궤’로 옮겼습니다.
- source_word: הֵסַבּוּ אֵלַי
  english_pob_choice: They have brought around to me
  chosen_korean: 나에게로 가져와서
  alternatives_korean:
  - 나를 둘러오게 해서
  - 내 쪽으로 돌려서
  lexicon: סוב
  rationale: 직역상 ‘돌리다/둘러오다’의 뜻이지만, 한국어에서는 결과 상태보다 행위의 의도를 드러내는 ‘가져와서’가 문맥상 자연스럽고, 원문의 위협적 뉘앙스도 유지합니다.
- source_word: לַהֲמִיתֵנִי
  english_pob_choice: to kill me
  chosen_korean: 나를 죽이려 합니다
  alternatives_korean:
  - 나를 죽이려고 합니다
  - 나를 죽일 것입니다
  lexicon: מות
  rationale: 히브리어 부정사구의 목적 의미를 살려 ‘죽이려 합니다’로 옮겨, 에그론 사람들의 공포와 해석을 직접화했습니다.
- source_word: וְאֶת עַמִּי
  english_pob_choice: and my people
  chosen_korean: 내 백성을
  alternatives_korean:
  - 나의 백성을
  - 우리 백성을
  lexicon: עם
  rationale: 히브리어 단수 화자가 ‘나와 내 백성’을 말하므로, 영어 POB의 주체 일치에 따라 ‘내 백성’을 유지해 개별 화자의 절박함을 살렸습니다.
theological_decisions:
- issue: 하나님의 이름/표현의 반복과 소유 관계
  chosen_reading: 본문의 ‘하나님의 궤’와 ‘이스라엘의 하나님의 궤’를 모두 유지해, 궤의 신적 소유권과 언약 백성 이스라엘과의 연관을 함께 드러냈습니다.
  alternative_readings:
  - ‘언약궤’로 통합하여 반복을 줄이는 방식
  - ‘하나님의 궤’만 반복하는 방식
  rationale: 원문은 같은 대상을 반복하면서도 ‘이스라엘의 하나님’으로 한 번 더 규정해 강조합니다. 한국어에서도 이 구분을 지워 버리면 서술의 압력이 약해집니다.
  doctrine_reference: 언약궤 서술의 반복과 강조는 1사무엘 4–6장의 신학적 긴장—야훼의 임재가 이방 성읍에 심판으로 임함—을 보존합니다.
