  text: Therefore, to this day the priests of Dagon and all who enter Dagon's temple in Ashdod do not step on Dagon's threshold[a][b].
  footnotes:
  - marker: a
    text: Or, more formally, 'do not tread on Dagon’s threshold.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house of Dagon'; rendered 'temple' here because the context is a pagan shrine.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 다곤의 제사장들과 아스돗에 있는 다곤의 집에 들어가는 모든 사람은 오늘날까지 다곤의 문턱을 밟지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 דרך는 여기서 ‘밟다/디디다’라는 뜻입니다. 더 형식적으로는 ‘다곤의 문턱을 디디지 않습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘다곤의 집’이라고 합니다. 문맥상 다곤을 섬기는 제의 장소를 가리키지만, 본문에서는 원문의 표현을 따라 ‘다곤의 집’으로 옮겼습니다.
    reason: lexical_alternative
