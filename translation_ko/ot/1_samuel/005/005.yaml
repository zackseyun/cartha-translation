base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/005.yaml
  text: Therefore, to this day the priests of Dagon and all who enter Dagon's temple in Ashdod do not step on Dagon's threshold[a][b].
  footnotes:
  - marker: a
    text: Or, more formally, 'do not tread on Dagon’s threshold.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house of Dagon'; rendered 'temple' here because the context is a pagan shrine.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 오늘날까지도 다곤의 제사장들과 다곤의 집에 들어가는 모든 사람은 아스돗에서 다곤의 문턱을 밟지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 דרך는 여기서 ‘밟다/디디다’의 뜻이므로, 더 형식적으로는 ‘다곤의 문턱을 디디지 않습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘다곤의 집’이지만, 문맥상 이교 신당을 가리키므로 본문에서는 자연스럽게 ‘다곤의 집’으로 옮겼습니다.
    reason: lexical_alternative
