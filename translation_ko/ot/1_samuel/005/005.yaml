  rationale: 히브리어는 ‘집’이지만 문맥상 Dagon 숭배 공간이므로, 본문 의미를 보존하면서도 과도한 해석어를 피하는 쪽을 택했습니다.
  doctrine_reference: 본문 문맥과 우상 숭배 비판의 서술 기능
