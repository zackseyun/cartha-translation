  yaml_path: translation/ot/1_samuel/005/009.yaml
  text: And after they had moved it around[a], the hand of Yahweh was against the city, causing a very great panic; and he struck the men of the city, from small to great, and tumors broke out on them.
  footnotes:
  - marker: a
    text: Or 'they broke out with tumors.' The Hebrew expression describes the appearance or eruption of bodily swellings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그것을 옮겨 다닌 뒤에, 야훼의 손이 그 성읍을 대적하자 매우 큰 공포가 일어났습니다. 그분이 그 성읍의 사람들을 작은 자부터 큰 자까지 치셨으며, 그들에게 종기들이 생겼습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 종기들이 터져 나왔다.’ 히브리어 표현은 몸에 생긴 부기나 종기가 겉으로 드러나는 모습을 묘사합니다.
    reason: lexical_alternative
