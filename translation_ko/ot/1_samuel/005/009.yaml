- from: 그들이 그것을 옮겨 다닌 뒤에[a], 야훼의 손이 그 성읍을 치셔서 매우 큰 공포가 일어났고, 그분이 그 성읍의 사람들을 작은 자부터 큰 자까지 치셨으며, 그들에게 종기들이 생겼습니다.
  to: 그들이 그것을 옮겨 다닌 뒤에, 야훼의 손이 그 성읍을 대적하자 매우 큰 공포가 일어났습니다. 그분이 그 성읍의 사람들을 작은 자부터 큰 자까지 치셨으며, 그들에게 종기들이 생겼습니다[a].
  rationale: 야훼의 손이 성읍을 대적한 결과로 공포가 일어난다는 절의 관계를 분명히 하고, 이어지는 사람들을 치신 행위와의 불필요한 중복을 피했습니다. 또한 각주의 문법과 의미를 바로잡고, 표지를 해당 히브리어 표현의 번역어에 배치했습니다.
