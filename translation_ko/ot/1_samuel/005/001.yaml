  yaml_path: translation/ot/1_samuel/005/001.yaml
  text: Now the Philistines had taken the ark of God and brought it from Ebenezer to Ashdod[a].
  footnotes:
  - marker: a
    text: Hebrew 'And the Philistines'; 'Now the Philistines' is used to mark the narrative transition in natural English.
