  to: 블레셋 사람들이 하나님의 궤를 에벤에셀에서 아스돗으로 가져갔습니다.
  rationale: 원문의 접속사에 대해 한국어에서 불필요한 담화 표지를 덧붙이지 않고, ‘하나님의 궤’라는 원문 표현을 보존했습니다. 목적지를 향한 이동은 ‘에벤에셀에서 아스돗으로 가져갔습니다’로 자연스럽고 충실하게 옮겼습니다. 부정확하고 구조상 문제가 있는 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
