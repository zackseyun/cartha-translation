translation:
  language: ko
  text: 이제 블레셋 사람들이 하나님의 언약궤를 에벤에셀에서 가져다가 아스돗으로 옮겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 פשוט히 “그리고 블레셋 사람들이”로 시작하지만, 서술 전환을 자연스럽게 드러내기 위해 ‘이제’를 썼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  english_pob_choice: Now the Philistines
  chosen_korean: 이제 블레셋 사람들이
  alternatives_korean:
  - 그리고 블레셋 사람들이
  - 블레셋 사람들이
  lexicon: HALOT
  rationale: ו의 서술 전환을 한국어에서는 ‘이제’로 살려 장면 전환을 자연스럽게 표시했고, 민족명은 통용형인 ‘블레셋 사람들’로 옮겼습니다.
- source_word: אֲרוֹן הָאֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 언약궤를
  alternatives_korean:
  - 하나님의 궤를
  - 하나님의 궤를
  lexicon: HALOT
  rationale: אָרוֹן הָאֱלֹהִים은 성소적 문맥의 ‘궤’이므로 한국어 성경에서 의미가 분명한 ‘언약궤’를 택했고, 소유격보다 원문 구조를 드러내는 표현으로 ‘하나님의’를 유지했습니다.
- source_word: מֵאֶבֶן הָעֵזֶר
  english_pob_choice: from Ebenezer
  chosen_korean: 에벤에셀에서
  alternatives_korean:
  - 에벤에셀로부터
  - 에벤에셀에서부터
  lexicon: HALOT
  rationale: 지명은 음역하되, מקור 의미는 조사 ‘에서’로 자연스럽게 표현했습니다.
- source_word: אַשְׁדּוֹדָה
  english_pob_choice: to Ashdod
  chosen_korean: 아스돗으로
  alternatives_korean:
  - 아스돗까지
  - 아스돗 쪽으로
  lexicon: HALOT
  rationale: 어미 -ָה가 방향성을 나타내므로 목적지 표지 ‘-으로’로 옮겼고, 지명은 현대 음역형 ‘아스돗’을 사용했습니다.
theological_decisions:
- issue: ‘ark of God’의 한국어 전통 번역 선택
  chosen_reading: ‘언약궤’로 옮겨 성소적·서사적 기능을 드러냈습니다.
  alternative_readings:
  - 직역형 ‘하나님의 궤’
  - 전통형 ‘하나님의 법궤’
  rationale: 원문은 단순 소유가 아니라 이스라엘의 거룩한 궤를 가리키므로, 한국어 독자가 즉시 पहचान할 수 있는 성경적 용어를 택했습니다.
  doctrine_reference: 출 25:10-22; 삼상 4-6장
- issue: 서술 시점의 처리
  chosen_reading: 완료된 사건을 배경으로 제시하는 영어 POB의 ‘Now’에 맞춰 ‘이제’로 시작했습니다.
  alternative_readings:
  - 그리고
  - 그때
  rationale: 히브리어 ו- 연속서술을 한국어에서 단순 접속사 ‘그리고’로 두면 전환감이 약해질 수 있어, 문맥의 흐름을 살리는 ‘이제’를 사용했습니다.
  doctrine_reference: 담화 전환의 문체적 처리
