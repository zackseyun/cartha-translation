revisions:
- from: 그들이 사람을 보내어 블레셋 모든 군주들을 자기들에게 모으고 말했습니다. "이스라엘의 하나님의 궤를 어떻게 하겠습니까?" 그러자 그들이 말했습니다. "가드로 이스라엘의 하나님의 궤를 옮기게 합시다." 그래서 그들이 이스라엘의 하나님의 궤를 옮겼습니다.[a]
  to: 그들은 블레셋의 모든 군주를 자기들이 있는 곳으로 모으려고 사람을 보내고 말했습니다. “이스라엘의 하나님의 궤를 어떻게 하겠습니까?” 그러자 그들이 말했습니다. “이스라엘의 하나님의 궤는 가드로 옮기게 합시다.” 그래서 그들은 이스라엘의 하나님의 궤를 옮겼습니다.[a]
  rationale: 소집의 목적을 나타내는 문맥상 보충은 유지하되, 원문의 אֲלֵיהֶם이 나타내는 방향을 자연스러운 한국어로 풀었습니다. 이동 동사의 의미 범위를 보존하기 위해 본문은 ‘옮기다’를 사용하고, 각주에서는 ‘돌다’ 계열의 어휘적 가능성을 귀환 의미 없이 제시했습니다.
