  yaml_path: translation/ot/1_samuel/005/008.yaml
  text: So they sent and gathered all the lords of the Philistines to themselves[a], and said, “What shall we do with the ark of the God of Israel?” And they said, “Let the ark of the God of Israel be brought around to Gath.” So they brought the ark of the God of Israel around.
  footnotes:
  - marker: a
    text: Or “Let the ark of the God of Israel go around to Gath,” with the verb emphasizing movement/transfer rather than specifying the exact manner of transport.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 블레셋의 모든 군주를 자기들이 있는 곳으로 모으려고 사람을 보내고 말했습니다. “이스라엘의 하나님의 궤를 어떻게 하겠습니까?” 그러자 그들이 말했습니다. “이스라엘의 하나님의 궤는 가드로 옮기게 합시다.” 그래서 그들은 이스라엘의 하나님의 궤를 옮겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘의 하나님의 궤를 가드로 돌게 하라.” 이 동사는 운송 방식 자체보다 궤의 이동이나 이전을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי פְלִשְׁתִּים
  english_pob_choice: the lords of the Philistines
  chosen_korean: 블레셋 모든 군주들
  alternatives_korean:
  - 블레셋의 통치자들
  - 블레셋의 영주들
  lexicon: HALOT
  rationale: סַרְנִים은 블레셋 도시국가의 지배자들을 가리키므로, 관습적이면서도 위상을 살리는 ‘군주들’이 적절합니다.
- source_word: אֲלֵיהֶם
  english_pob_choice: to themselves
  chosen_korean: 자기들에게
  alternatives_korean:
  - 그들에게
  - 자기들 쪽으로
  lexicon: HALOT
  rationale: 문맥상 사절을 보내어 지도자들을 자신들의 자리로 불러 모으는 뜻이므로, 단순한 ‘그들에게’보다 ‘자기들에게’가 집합 방향성을 더 잘 드러냅니다.
- source_word: מַה נַּעֲשֶׂה לַאֲרוֹן
  english_pob_choice: What shall we do with the ark
  chosen_korean: '"이스라엘의 하나님의 궤를 어떻게 하겠습니까?"'
  alternatives_korean:
  - '"이스라엘의 하나님의 궤를 어떻게 처리하겠습니까?"'
  - '"이스라엘의 하나님의 궤를 무엇을 하겠습니까?"'
  lexicon: HALOT
  rationale: לַאֲרוֹן은 한국어에서 자연스럽게 ‘~을 어떻게 하다/처리하다’로 옮기는 것이 가장 직역적이면서도 문맥에 맞습니다.
- source_word: יִסֹּב / וַיַּסֵּבּוּ
  english_pob_choice: be brought around / they brought ... around
  chosen_korean: 옮기게 합시다 / 옮겼습니다
  alternatives_korean:
  - 돌려보내게 합시다 / 돌렸습니다
  - 데리고 가게 합시다 / 데리고 갔습니다
  lexicon: HALOT
  rationale: סבב 계열은 ‘돌다/둘러가다’의 뜻이지만, 여기서는 궤를 도시에서 도시로 이동시키는 상황이므로 의미를 과도하게 구체화하지 않으면서도 자연스러운 ‘옮기다’가 적합합니다.
theological_decisions:
- issue: 아르궤가 인간의 소유물이 아니라 야훼의 임재 표지라는 점을 어떻게 드러낼지
  chosen_reading: ‘이스라엘의 하나님의 궤’로 반복해 원문의 존칭적 소유구조를 유지했습니다.
  alternative_readings:
  - ‘하나님의 궤’로 단순화
  - ‘이스라엘 하나님께 속한 궤’로 재구성
  rationale: 반복은 서사적 긴장과 경외감을 강화하며, 본문이 말하는 대상이 단순한 물건이 아니라 이스라엘의 하나님과 연결된 거룩한 표지임을 분명히 합니다.
  doctrine_reference: 언약궤/임재 표지의 성서적 표상
