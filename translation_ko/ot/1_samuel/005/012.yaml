id: 1SA.5.12
reference: 1 Samuel 5:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָֽ/אֲנָשִׁים֙ אֲשֶׁ֣ר לֹא מֵ֔תוּ הֻכּ֖וּ ב/עפלים וַ/תַּ֛עַל שַֽׁוְעַ֥ת הָ/עִ֖יר הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/012.yaml
  text: And the men who did not die were struck with tumors[a], and the cry of the city went up to heaven.
  footnotes:
  - marker: a
    text: Or 'with swellings'; the Hebrew term refers to a bodily swelling or tumor. Traditional renderings sometimes specify 'hemorrhoids.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 죽지 않은 남자들은 종기[a]로 치심을 받았고, 그 성읍의 부르짖음이 하늘에까지 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부기들’로 옮길 수 있습니다. 히브리어는 몸의 부종이나 종기류를 가리키며, 전통적으로는 ‘치질’로 번역되기도 했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  english_pob_choice: And the men
  chosen_korean: 그리고 죽지 않은 남자들은
  alternatives_korean:
  - 그리고 사람들이
  - 그리고 그 성읍의 남자들은
  lexicon: HALOT
  rationale: אֲנָשִׁים의 기본값은 ‘남자들’이므로, 문맥상 생존자 집단을 가리키는 표현을 살려 ‘남자들’로 옮겼습니다.
- source_word: הֻכּוּ
  english_pob_choice: were struck
  chosen_korean: 치심을 받았고
  alternatives_korean:
  - 쳐졌고
  - 때림을 당했고
  - 상함을 입었고
  lexicon: HALOT
  rationale: נכה의 수동형은 단순한 상태 변화보다 ‘치심/쳤음’을 드러내므로, 병리적 결과를 강조하는 문맥에 맞게 수동 표현으로 옮겼습니다.
- source_word: בָּעֳפָלִים
  english_pob_choice: with tumors
  chosen_korean: 종기[a]
  alternatives_korean:
  - 부기
  - 혹
  - 치핵
  lexicon: HALOT
  rationale: עפלים은 신체의 부종·종기류를 가리키므로, 현대 독자가 이해할 수 있으면서도 지나치게 특정 질환으로 좁히지 않는 ‘종기’를 택했습니다.
- source_word: שַׁוְעַת הָעִיר
  english_pob_choice: the cry of the city
  chosen_korean: 그 성읍의 부르짖음
  alternatives_korean:
  - 그 도시의 외침
  - 성읍의 호소
  lexicon: HALOT
  rationale: שַׁוְעָה는 도움을 요청하는 절규이므로, 단순 ‘울부짖음’보다 의미가 드러나는 ‘부르짖음’이 적절합니다.
theological_decisions:
- issue: ‘하늘’ 표현의 방향성
  chosen_reading: ‘하늘에까지 올라갔습니다’로 옮겨, 원문의 상승 이미지를 보존했습니다.
  alternative_readings:
  - ‘하늘로 올라갔습니다’
  - ‘하늘에 닿았습니다’
  rationale: עלה는 실제로 ‘올라가다’라는 동작을 나타내므로, 기도 응답의 관용적 문구로 완화하지 않고 상승 이미지를 그대로 살렸습니다.
  doctrine_reference: 원문 서사 및 히브리어 동사 상
- issue: ‘종기’의 의학적 세부
  chosen_reading: 질환의 정확한 현대 의학명으로 특정하지 않고 ‘종기’로 처리했습니다.
  alternative_readings:
  - ‘치핵’
  - ‘부종’
  rationale: 본문의 히브리어는 광범위한 신체적 부종/종기류를 가리킬 수 있어, 본문 증거 이상으로 질환을 단정하지 않도록 했습니다.
  doctrine_reference: 어휘 불확정성 보존
