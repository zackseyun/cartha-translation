base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/002.yaml
  text: So the Philistines took the ark of God and brought it into the house of Dagon[a], and set it beside Dagon.
  footnotes:
  - marker: a
    text: Or "the temple of Dagon." Literally, "the house of Dagon."
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 블레셋 사람들이 하나님의 궤를 가져다가 다곤의 집으로 들여놓고, 그것을 다곤 곁에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “다곤의 신전.” 문자적으로는 “다곤의 집”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן הָאֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 궤
  alternatives_korean:
  - 하나님의 상자
  - 하나님의 궤함
  lexicon: WLC + POB audit trail
  rationale: 히브리어 אֲרוֹן은 성막/언약궤 맥락에서 한국어 관용어인 '궤'가 가장 자연스럽고, הָאֱלֹהִים은 이 절에서 야훼가 아니라 '하나님'으로 옮기는 것이 원문에 충실합니다.
- source_word: בֵּית דָּגוֹן
  english_pob_choice: the house of Dagon
  chosen_korean: 다곤의 집
  alternatives_korean:
  - 다곤의 신전
  - 다곤의 성전
  lexicon: WLC + POB audit trail
  rationale: בית의 문자적 의미는 '집'이지만, 여기서는 다곤의 신전/제의 공간을 가리키므로 한국어에서도 원문 구조를 살려 '다곤의 집'으로 두었습니다. POB의 'house of Dagon'을 반영했습니다.
- source_word: וַיַּצִּיגוּ אֹתוֹ אֵצֶל דָּגוֹן
  english_pob_choice: and set it beside Dagon
  chosen_korean: 그것을 다곤 곁에 두었습니다
  alternatives_korean:
  - 그것을 다곤 옆에 세웠습니다
  - 그것을 다곤 옆에 놓았습니다
  lexicon: WLC + POB audit trail
  rationale: יצג는 '두다/세우다/배치하다'의 뜻이므로 위치 관계를 분명히 하는 '곁에 두다'가 자연스럽고, אֵצֶל의 근접 의미를 잘 살립니다.
theological_decisions:
- issue: ‘하나님의 궤’의 신명칭 선택
  chosen_reading: ‘주님의 궤’가 아니라 ‘하나님의 궤’로 옮깁니다.
  alternative_readings:
  - 주님의 궤
  - 여호와의 궤
  rationale: 원문은 הָאֱלֹהִים을 사용하므로, 본절에서는 익숙한 관용어보다 실제 표지를 우선해 '하나님의 궤'로 유지합니다.
  doctrine_reference: Translation philosophy §1; contested divine designations
