  text: When they rose early the next morning[a], behold, Dagon had fallen facedown on the ground before the ark of Yahweh, and the head of Dagon and both the palms of his hands were cut off on the threshold; only Dagon was left on him.
  footnotes:
  - marker: a
    text: 'Hebrew: ''only Dagon was left upon him,'' likely meaning only the idol''s body or trunk remained after its head and hands were cut off.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 이튿날 아침 일찍 일어나 보니, 다곤이 야훼의 궤 앞 땅에 얼굴을 대고 쓰러져 있었고, 다곤의 머리와 두 손바닥은 문지방 위에 잘려 떨어져 있었습니다. 오직 다곤만 그 위에 남아 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘오직 다곤만 그 위에 남아 있었다’입니다. 이 난해한 표현은 문맥상 머리와 손이 잘려 나간 뒤 우상의 몸체가 남았다는 뜻으로 이해되기도 합니다.
    reason: lexical_alternative
