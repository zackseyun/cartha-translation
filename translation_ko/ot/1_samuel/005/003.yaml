base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/003.yaml
  text: When the Ashdodites rose early the next day, behold, Dagon had fallen facedown on the ground before the ark of Yahweh. So they took Dagon and put him back in his place.
translation:
  language: ko
  text: 아스돗 사람들이 다음 날 아침 일찍 일어나 보니, 보십시오, 다곤이 여호와의 궤 앞에서 얼굴을 땅에 대고 엎드려 있었습니다. 그래서 그들은 다곤을 들어 자기 자리에 다시 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 직역하면 ‘그의 얼굴을 향해 땅 쪽으로’라는 구조이지만, 한국어에서는 수치의 자세를 드러내는 관용적 표현으로 풀었습니다.
    reason: source_note
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ / אַשְׁדּוֹדִים
  english_pob_choice: rose early / the Ashdodites
  chosen_korean: 아스돗 사람들이 … 일찍 일어나
  alternatives_korean:
  - 아스돗 주민들이 … 일찍 일어나
  - 아스돗 사람들이 … 일찍이 일어나
  lexicon: HALOT
  rationale: אַשְׁדּוֹדִים은 아스돗의 거주자들을 가리키는 집단명사이므로 ‘아스돗 사람들’이 자연스럽고, וַיַּשְׁכִּמוּ는 ‘일찍 일어나다’로 옮겨 시간적 긴박감을 살렸습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이런
  lexicon: HALOT
  rationale: 새로운 장면을 갑작스럽게 제시하는 감탄형이므로, 현대 한국어에서 경계와 놀람을 살리는 ‘보십시오’로 옮겼습니다.
- source_word: נֹפֵל לְפָנָיו אַרְצָה
  english_pob_choice: had fallen facedown on the ground
  chosen_korean: 얼굴을 땅에 대고 엎드려 있었습니다
  alternatives_korean:
  - 얼굴을 땅에 대고 쓰러져 있었습니다
  - 엎드려 땅바닥에 얼굴을 대고 있었습니다
  lexicon: HALOT
  rationale: 직역적 구조보다 히브리어가 의도하는 수치스러운 자세를 한국어로 분명히 드러내기 위해 ‘얼굴을 땅에 대고 엎드리다’로 옮겼습니다.
- source_word: לִפְנֵי אֲרוֹן יְהוָה / יְהוָה
  english_pob_choice: before the ark of Yahweh / Yahweh
  chosen_korean: 여호와의 궤 앞에서
  alternatives_korean:
  - 야훼의 궤 앞에서
  - 주님의 궤 앞에서
  lexicon: HALOT
  rationale: 본문 원어는 יהוה를 사용하지만, 이 절의 영어 POB는 도서 전반의 확정 용례에 따라 ‘Yahweh’ 대신 ‘the LORD’ 계열을 쓰고 있어, 여기서는 한국어 프로젝트 기본어인 ‘여호와’로 대응했습니다.
- source_word: וַיִּקְחוּ אֶת דָּגוֹן / וַיָּשִׁבוּ אֹתוֹ לִמְקוֹמוֹ
  english_pob_choice: they took Dagon / put him back in his place
  chosen_korean: 다곤을 들어 자기 자리에 다시 두었습니다
  alternatives_korean:
  - 다곤을 들어 제자리에 돌려놓았습니다
  - 다곤을 다시 제자리에 놓았습니다
  lexicon: HALOT
  rationale: וַיִּקְחוּ와 וַיָּשִׁבוּ의 연속 동작을 한국어로 간결하게 살리기 위해 ‘들어 … 다시 두다’로 옮겼고, ‘자기 자리’는 우상상의 고정된 원위치를 자연스럽게 나타냅니다.
theological_decisions:
- issue: 신명기/사무엘서 본문 속 יְהוָה 표기
  chosen_reading: ‘여호와’로 옮겨, 언약적 고유명을 한국어 성경 독자에게 즉시 인식되게 했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 프로젝트의 히브리어-기반 한국어 관례와 영어 POB의 주석층을 함께 고려할 때, 본절에서는 고유명 표지보다 독자 친숙성과 본문 연속성이 더 중요하므로 ‘여호와’를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: יְהוָה / YHWH 표기 원칙'
