revisions:
- from: 아스돗 사람들이 다음 날 아침 일찍 일어나 보니, 보십시오, 다곤이 여호와의 궤 앞에서 얼굴을 땅에 대고 엎드려 있었습니다. 그래서 그들은 다곤을 들어 자기 자리에 다시 두었습니다.[a]
  to: 아스돗 사람들이 이튿날 아침 일찍 일어나 보니, 다곤이 야훼의 궤 앞에 얼굴을 땅에 대고 쓰러져 있었습니다. 그래서 그들은 다곤을 가져다가 제자리에 다시 놓았습니다.
  rationale: 원문의 시간 표현, 발견 장면, 다곤의 얼굴을 땅에 댄 채 넘어진 상태, 그리고 다곤을 본래 자리로 되돌려 놓는 동작을 유지했습니다. יהוה는 영어 POB의 확정 용례에 맞춰 ‘야훼’로 바로잡았고, 부정확하며 해석을 과도하게 보태는 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:17:56Z'
review_pass:
  verdict: revise
  source_fidelity: ‘여호와’는 히브리어 יהוה 및 영어 POB의 확정 표기 ‘Yahweh’와 일치하지 않습니다. 또한 נֹפֵל은 다곤이 발견 당시 이미 넘어진 상태였음을 나타내므로 ‘쓰러져 있었습니다’가 자연스럽고 충실합니다. ‘엎드려’는 자발적 경배 행위의 뉘앙스를 낼 수 있습니다.
  naturalness: ‘보십시오’는 현대 한국어 서사 문장 안에서 청자에게 직접 말 거는 듯하여 부자연스럽습니다. ‘일어나 보니’가 וְהִנֵּה의 발견·놀람의 기능을 한국어답게 전달합니다. ‘제자리’는 ‘자기 자리’보다 선행 대상이 분명합니다.
  terminology: YHWH는 영어 POB 감사 기록의 원칙에 따라 ‘야훼’로 옮겼습니다. ‘궤’, ‘다곤’, ‘아스돗’은 통용되는 성서 한국어 표기이며 본문에 적절합니다.
  issues:
  - severity: high
    issue: יהוה를 ‘여호와’로 번역함
    rationale: 영어 POB의 명시적 신학·용어 결정은 יהוה를 ‘Yahweh’로 표기합니다. 한국어에서도 이에 대응하는 ‘야훼’로 일관되게 옮겨야 합니다.
  - severity: medium
    issue: ‘보십시오’가 본문 안에 직접 발화처럼 삽입됨
    rationale: וְהִנֵּה의 주의 환기 기능은 필요하지만, 현대 합쇼체 서사에서는 ‘…보니’가 더 자연스럽고 별도의 청자 호소를 만들지 않습니다.
  - severity: medium
    issue: 각주가 히브리어 구문을 부정확하게 설명하고 ‘수치의 자세’라는 해석을 덧붙임
    rationale: לְפָנָיו는 ‘그의 얼굴/앞에’이며, 각주의 ‘그의 얼굴을 향해’ 설명은 맞지 않습니다. 본문은 자세를 묘사할 뿐 수치라는 해석을 명시하지 않으므로 각주는 삭제하는 것이 안전합니다.
  revised_text: 아스돗 사람들이 이튿날 아침 일찍 일어나 보니, 다곤이 야훼의 궤 앞에 얼굴을 땅에 대고 쓰러져 있었습니다. 그래서 그들은 다곤을 가져다가 제자리에 다시 놓았습니다.
