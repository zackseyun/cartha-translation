revisions:
- from: 그래서 그들이 사람을 보내 블레셋의 모든 통치자들을 모으고 그들에게 말했습니다. "이스라엘의 하나님의 궤를 보내 버려서 그 궤가 자기의 자리로 돌아가게 하십시오. 그러면 그것이 나와 내 백성을 죽이지 않을 것입니다." 온 성읍에 죽음 같은 혼란이 있었기 때문입니다. 하나님의 손이 그곳에서 매우 무거웠습니다.[a][b]
  to: 그래서 그들은 사람을 보내 블레셋의 모든 통치자들을 모으고 말했습니다. “이스라엘의 하나님의 궤를 내보내어 제자리로 돌아가게 하십시오. 그 궤가 나와 내 백성을 죽이지 않게 하십시오.” 온 성읍에 죽음의 공포가 있었기 때문입니다.[a] 하나님의 손이 그곳에 매우 무겁게 내렸습니다.[b]
  rationale: 단수 대명사와 하나님의 ‘손’이라는 은유는 보존했습니다. 명령문의 문법적 관계를 자연스럽게 정리하고, ‘자기의 자리’를 ‘제자리’로 고쳤으며, 각주 표지를 각각의 해당 본문 어구 뒤로 옮겼습니다. ‘죽음의 공포’는 מְהוּמַת מָוֶת의 죽음을 초래하는 공포·소요의 의미를 자연스럽게 전달하고, 대안 번역은 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:21:31Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 히브리어의 순서와 핵심 어휘를 잘 반영했으며, 직접화법의 단수 ‘나와 내 백성’도 보존했습니다. 다만 명령문과 목적절의 연결을 더 정확하고 자연스럽게 다듬고, 각주 표지를 해당 어구에 붙여야 합니다.
  naturalness: ‘보내 버려서’와 ‘자기의 자리’는 이 문맥에서 다소 구어적이거나 어색합니다. ‘내보내어 제자리로 돌아가게 하십시오’가 현대의 격식 있는 성경 한국어로 자연스럽습니다. ‘하나님의 손이 … 무거웠습니다’는 직역으로 다소 부자연스러워, 은유를 유지하는 ‘매우 무겁게 내렸습니다’로 다듬었습니다.
  terminology: ‘블레셋의 모든 통치자들’, ‘이스라엘의 하나님의 궤’, ‘나와 내 백성’은 적절합니다. ‘언약궤’처럼 원문에 없는 수식어는 추가하지 않는 것이 좋습니다.
  issues:
  - severity: medium
    issue: 각주 표지가 모두 문장 끝에 함께 배치되어 있습니다.
    rationale: a는 מְהוּמַת מָוֶת(죽음을 부르는 공포/혼란)에, b는 ‘하나님의 손’ 은유에 각각 연결되어야 합니다. 현재 표지는 해당 어구의 식별과 각주 기능을 흐립니다.
  - severity: low
    issue: ‘보내 버려서 그 궤가 자기의 자리로 돌아가게 하십시오’의 표현이 어색합니다.
    rationale: 히브리어의 ‘보내라, 그리고 그것이 그 자리로 돌아가게 하라’라는 명령-접속 구조는 ‘내보내어 제자리로 돌아가게 하십시오’로 자연스럽게 옮길 수 있습니다. ‘자기의 자리’는 궤를 가리키는 한국어 표현으로 부자연스럽습니다.
