  text: וַ/יִּשְׁלְח֨וּ וַ/יַּאַסְפ֜וּ אֶת כָּל סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּֽאמְרוּ֙ שַׁלְּח֞וּ אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ וְ/יָשֹׁ֣ב לִ/מְקֹמ֔/וֹ וְ/לֹֽא יָמִ֥ית אֹתִ֖/י וְ/אֶת עַמִּ֑/י כִּֽי הָיְתָ֤ה מְהֽוּמַת מָ֨וֶת֙ בְּ/כָל הָ/עִ֔יר כָּבְדָ֥ה מְאֹ֛ד יַ֥ד הָ/אֱלֹהִ֖ים שָֽׁם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/011.yaml
  text: So they sent and gathered all the lords of the Philistines[a], and they said, “Send away the ark of the God of Israel, and let it return to its place, so that it may not kill us and our people.” For there was a deadly panic throughout the whole city[b]; the hand of God was very heavy there.
  footnotes:
  - marker: a
    text: Or 'a panic of death,' 'a deathly confusion,' or 'a deadly tumult.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the hand of God was very heavy there,' a metaphor for intense divine judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그들은 사람을 보내 블레셋의 모든 통치자들을 모으고 말했습니다. “이스라엘의 하나님의 궤를 내보내어 제자리로 돌아가게 하십시오. 그 궤가 나와 내 백성을 죽이지 않게 하십시오.” 온 성읍에 죽음의 공포가 있었기 때문입니다.[a] 하나님의 손이 그곳에 매우 무겁게 내렸습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽음 같은 혼란’, ‘죽음 같은 소란’, ‘치명적인 소동’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘하나님의 손이 그곳에 매우 무겁게 내렸다’라고 말하며, 이는 강한 신적 심판을 나타내는 은유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  english_pob_choice: lords
  chosen_korean: 통치자들
  alternatives_korean:
  - 지도자들
  - 영주들
  lexicon: HALOT
  rationale: 블레셋의 공인된 정치적 지배층을 가리키므로, 한국어에서는 현대 독자가 이해하기 쉬우면서도 직책성을 살릴 수 있는 ‘통치자들’이 가장 적절합니다.
- source_word: שַׁלְּחוּ
  english_pob_choice: Send away
  chosen_korean: 보내 버려서
  alternatives_korean:
  - 보내십시오
  - 내보내십시오
  lexicon: HALOT
  rationale: 단순한 파견이 아니라 궤를 성읍 밖으로 치워 달라는 뉘앙스가 강하므로, ‘보내 버려서’로 추방·제거의 힘을 살렸습니다.
- source_word: מְהוּמַת מָוֶת
  english_pob_choice: a deadly panic
  chosen_korean: 죽음 같은 혼란
  alternatives_korean:
  - 죽음의 공포
  - 치명적인 소란
  - 죽음의 소동
  lexicon: HALOT
  rationale: 이 결합어는 공포와 소동, 그리고 죽음의 위협을 함께 담으므로, 관용적이면서도 의미를 넓게 보존하는 ‘죽음 같은 혼란’으로 옮겼습니다.
- source_word: כָּבְדָה מְאֹד יַד הָאֱלֹהִים
  english_pob_choice: the hand of God was very heavy
  chosen_korean: 하나님의 손이 그곳에서 매우 무거웠습니다
  alternatives_korean:
  - 하나님의 손이 매우 무겁게 내렸습니다
  - 하나님의 권능이 그곳을 매우 무겁게 짓눌렀습니다
  lexicon: HALOT
  rationale: ‘손’은 하나님의 সক동적 심판을 가리키는 핵심 은유이므로 유지했고, ‘매우 무거웠습니다’로 히브리어 표현을 직역에 가깝게 살렸습니다.
theological_decisions:
- issue: 하나님의 심판을 가리키는 ‘손’ 은유를 살릴지, 의미만 풀어 쓸지
  chosen_reading: 은유를 유지하여 ‘하나님의 손이 … 매우 무거웠습니다’로 옮겼습니다.
  alternative_readings:
  - 하나님의 권능이 … 강하게 임했습니다
  - 하나님이 그곳을 혹독하게 치셨습니다
  rationale: 본문은 의도적으로 ‘손’이라는 신체 은유를 사용해 하나님의 능동적 개입과 심판의 무게를 드러내므로, 이를 보존하는 편이 원문 신학과 문체를 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: 직접화법의 ‘me and my people’를 한국어에서 자연스럽게 처리할지
  chosen_reading: ‘나와 내 백성’을 유지했습니다.
  alternative_readings:
  - 우리와 우리의 백성
  - 저와 제 백성
  rationale: 히브리어는 단수 소유·대명사를 사용하며, 이는 대표 화자의 개별적 발화를 드러냅니다. 한국어에서도 이를 보존해 원문의 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
