  edition: WLC
  text: וַ/תִּכְבַּ֧ד יַד יְהוָ֛ה אֶל הָ/אַשְׁדּוֹדִ֖ים וַ/יְשִׁמֵּ֑/ם וַ/יַּ֤ךְ אֹתָ/ם֙ ב/עפלים אֶת אַשְׁדּ֖וֹד וְ/אֶת גְּבוּלֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/006.yaml
  text: And the hand of Yahweh was heavy against the people of Ashdod[a], and he devastated them and struck them with tumors, Ashdod and its territory.
  footnotes:
  - marker: a
    text: Or 'with swellings'; traditionally, some render this more specifically as 'with hemorrhoids.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 손이 아스돗 사람들에게 무겁게 임하여 그들을 황폐하게 하셨고, 종기들로 아스돗과 그 영토를 치셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부어오름들’로도 옮길 수 있습니다. 전통적으로는 더 구체적으로 ‘치질’로 번역하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד יַד יְהוָה
  english_pob_choice: the hand of Yahweh was heavy
  chosen_korean: 야훼의 손이 … 무겁게 임하여
  alternatives_korean:
  - 야훼의 손이 무거웠고
  - 야훼의 손이 무겁게 내리어
  lexicon: HALOT
  rationale: 히브리어 관용구의 구체적 이미지(손)와 압박·심판의 무게감을 살리기 위해 직역적 구성을 유지했습니다.
- source_word: אֶל הָאַשְׁדּוֹדִים
  english_pob_choice: against the people of Ashdod
  chosen_korean: 아스돗 사람들에게
  alternatives_korean:
  - 아스돗 사람들에 대하여
  - 아스돗 사람들을 향하여
  lexicon: HALOT
  rationale: 대상은 지명 자체보다 그 주민들을 가리키므로, 한국어에서는 자연스럽게 ‘사람들’로 옮겼습니다.
- source_word: וַיְשִׁמֵּם
  english_pob_choice: he devastated them
  chosen_korean: 그들을 황폐하게 하셨고
  alternatives_korean:
  - 그들을 파괴하셨고
  - 그들을 황폐시키셨고
  lexicon: HALOT
  rationale: 동사의 파괴·폐허화 의미를 살리면서, 심판 문맥에 맞는 자연스러운 현대어로 옮겼습니다.
- source_word: בַּעֳפָלִים
  english_pob_choice: with tumors
  chosen_korean: 종기들로
  alternatives_korean:
  - 종양들로
  - 부스럼들로
  lexicon: HALOT
  rationale: 히브리어는 신체의 부종/종창을 가리키며, 본문 차원에서는 너무 특정한 의학 용어보다 넓은 범주의 ‘종기들’이 무난합니다.
- source_word: אֶת אַשְׁדּוֹד וְאֶת גְּבוּלֶיהָ
  english_pob_choice: Ashdod and its territory
  chosen_korean: 아스돗과 그 영토를
  alternatives_korean:
  - 아스돗과 그 경계를
  - 아스돗과 그 주변 지역을
  lexicon: HALOT
  rationale: גְּבוּלֶיהָ의 범위를 현대 한국어에서 분명하게 드러내기 위해 ‘영토’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접적 심판 행위의 표현
  chosen_reading: 주어를 ‘야훼의 손’으로 유지하고, 결과 동사를 능동적으로 연결하여 심판의 직접성을 드러냈습니다.
  alternative_readings:
  - ‘야훼께서 그들을 크게 괴롭히셨고’로 완화하는 번역
  - ‘야훼의 능력이 그들에게 무거웠다’로 비인격화하는 번역
  rationale: 본문은 재난의 원인을 하나님의 주권적 개입으로 제시하므로, 그 긴장과 강도를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 사무엘상 5장 문맥의 야훼의 주권적 심판
- issue: בַּעֳפָלִים의 의학적 구체성
  chosen_reading: 본문은 ‘종기들’로 두고, 전통적 구체화는 본문 밖에서만 고려할 수 있게 했습니다.
  alternative_readings:
  - ‘치질’ 또는 ‘치핵’으로 특정하는 번역
  - ‘혹’이나 ‘부어오름’으로 더 일반화하는 번역
  rationale: 히브리어 어휘 자체가 특정 질환으로 확정되지는 않으므로, 본문은 과도한 특정화를 피하는 것이 소스에 더 충실합니다.
  doctrine_reference: 어휘 의미의 불확정성에 대한 번역 원칙
