source:
  edition: WLC
  text: וְ/סַרְנֵ֤י פְלִשְׁתִּים֙ עֹֽבְרִ֔ים לְ/מֵא֖וֹת וְ/לַ/אֲלָפִ֑ים וְ/דָוִ֣ד וַ/אֲנָשָׁ֗י/ו עֹֽבְרִ֛ים בָּ/אַחֲרֹנָ֖ה עִם אָכִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/002.yaml
  text: And the lords of the Philistines were passing by by hundreds and by thousands[a], and David and his men were passing by at the rear with Achish.
  footnotes:
  - marker: a
    text: Or 'by hundreds and by thousands,' referring to military units arranged in groups of hundreds and thousands.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 블레셋 사람의 방백들이 수백과 수천으로[a] 지나가고 있었으며, 다윗과 그의 사람들은 아기스와 함께 맨 뒤에서 지나가고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수백과 수천으로’. 군대가 수백과 수천의 단위로 편성되었음을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  english_pob_choice: lords
  chosen_korean: 방백들
  alternatives_korean:
  - 주들
  - 지도자들
  - 통치자들
  lexicon: HALOT
  rationale: 블레셋 도시국가의 고위 통치자를 가리키므로, 한국어에서는 권위와 지위를 드러내는 ‘방백들’이 가장 자연스럽고, 단순한 ‘지도자들’보다 더 구체적입니다.
- source_word: עֹבְרִים
  english_pob_choice: were passing by
  chosen_korean: 지나가고 있었으며
  alternatives_korean:
  - 행진하고 있었으며
  - 지나갔으며
  lexicon: HALOT
  rationale: 진행 중인 행렬의 모습을 살리기 위해 진행형으로 옮겼습니다. ‘행진하다’도 가능하지만, 히브리어 자체의 동작 묘사를 과도하게 군사화하지 않기 위해 더 중립적인 ‘지나가다’를 택했습니다.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  english_pob_choice: by hundreds and by thousands
  chosen_korean: 수백과 수천으로
  alternatives_korean:
  - 백 명씩과 천 명씩으로
  - 백 단위와 천 단위로
  - 수백 명과 수천 명으로
  lexicon: HALOT
  rationale: 히브리어의 분배적 표현을 한국어 관용에 맞게 압축해, 군사 편제를 가리키는 의미를 살리면서도 문장을 매끄럽게 했습니다.
- source_word: בָּאַחֲרֹנָה
  english_pob_choice: at the rear
  chosen_korean: 맨 뒤에서
  alternatives_korean:
  - 뒤쪽에서
  - 후미에서
  - 뒤에
  lexicon: HALOT
  rationale: 행렬의 후미라는 공간적 위치를 선명하게 드러내는 표현입니다. ‘후미’는 가능하지만 현대 한국어에서는 다소 문어적이어서 ‘맨 뒤에서’가 더 자연스럽습니다.
theological_decisions:
- issue: 다윗의 위치를 블레셋 방백들에 대비해 서술하는 방식
  chosen_reading: 다윗과 그의 사람들은 아기스와 함께 맨 뒤에서 지나가고 있었습니다.
  alternative_readings:
  - 아기스와 함께 뒤쪽에 있었습니다
  - 아기스 편에 서서 뒤를 따랐습니다
  rationale: 본문은 다윗의 편입된 행렬 위치를 묘사할 뿐이므로, ‘함께’와 ‘맨 뒤에서’로 중립적으로 옮겨 불필요한 해석을 덧붙이지 않았습니다.
  doctrine_reference: 서사문맥 보존; 과잉해석 방지
