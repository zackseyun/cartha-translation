  lexicon: HALOT
  rationale: 히필형의 관용적 의미인 ‘일찍 일어나다’를 살리면서, 한국어에서는 자연스럽게 시간 부사구를 붙여 강조를 유지했습니다.
- source_word: הוּא וַאֲנָשָׁיו
  english_pob_choice: he and his men
  chosen_korean: 그와 그의 부하들
