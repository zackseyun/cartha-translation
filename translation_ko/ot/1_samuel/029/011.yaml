  lexicon: HALOT
  rationale: 여기서 אֲנָשָׁיו는 다윗의 동행 무리를 가리키므로, 문맥상 가장 자연스러운 ‘부하들’로 옮겼습니다.
- source_word: לָלֶכֶת בַּבֹּקֶר לָשׁוּב
  english_pob_choice: to leave in the morning and return
  chosen_korean: 아침에 떠나서 … 돌아가려고 했습니다
  alternatives_korean:
  - 아침에 가서 … 돌아가려고 했습니다
  - 아침에 출발하여 … 돌아가려고 했습니다
  lexicon: HALOT
  rationale: 히브리어 부정사 연속은 목적과 진행을 함께 나타내므로, 한국어에서는 ‘떠나서 … 돌아가려고’로 자연스럽게 연결했습니다.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  english_pob_choice: the land of the Philistines
  chosen_korean: 블레셋 사람들의 땅
  alternatives_korean:
