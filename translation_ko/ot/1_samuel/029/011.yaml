base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/011.yaml
  text: So David rose early[a], he and his men, to leave in the morning and return to the land of the Philistines[b]. And the Philistines went up to Jezreel.
  footnotes:
  - marker: a
    text: Or 'to go in the morning and return to the land of the Philistines.' The Hebrew infinitives can be rendered more formally.
    reason: lexical_alternative
  - marker: b
    text: '''Went up'' reflects the Hebrew idiom for movement to a place, often with topographical or military nuance; alternatively, ''marched up to Jezreel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗과 그의 부하들은 블레셋 사람들의 땅으로 돌아가기 위해 아침에 일찍 일어나 떠났습니다.[a] 블레셋 사람들은 이스르엘로 올라갔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 부정사들은 더 직역하면 ‘아침에 가서 블레셋 사람들의 땅으로 돌아가기 위하여’라고도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘올라갔습니다’는 히브리어의 관용적인 이동 표현을 따른 것으로, 상황에 따라 ‘진군했습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  english_pob_choice: rose early
  chosen_korean: 아침에 일찍이 일어나
  alternatives_korean:
