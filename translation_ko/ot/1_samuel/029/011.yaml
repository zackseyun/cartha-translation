  - 블레셋 지역
  lexicon: HALOT
  rationale: ‘땅’의 구체성을 유지하되, 집단명칭을 한국어 성경 관용에 맞게 ‘블레셋 사람들’로 풀어 의미를 분명히 했습니다.
- source_word: עָלוּ
  english_pob_choice: went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 올라왔습니다
  - 진군했습니다
  lexicon: HALOT
  rationale: עלה의 기본적인 방향 동사를 그대로 살려, 지형적·군사적 뉘앙스를 과장하지 않고 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 서술 연결
  chosen_reading: 다윗의 출발 계획과 블레셋 군의 이동을 두 문장으로 분리해, 대비를 분명하게 보이도록 했습니다.
  alternative_readings:
  - 한 문장으로 길게 이어 번역할 수 있습니다.
  - ‘그런데’를 약화해 단순 접속으로 처리할 수 있습니다.
  rationale: 히브리어 원문은 다윗의 의도와 블레셋 사람들의 실제 이동을 대비시키므로, 한국어에서도 전환 표지를 살려 서술의 긴장을 유지했습니다.
  doctrine_reference: 서술 문맥 보존 원칙
- issue: וַיַּשְׁכֵּם의 시간 강조
  chosen_reading: ‘아침에 일찍이 일어나’로 시간의 이른 시작을 드러냈습니다.
  alternative_readings:
  - ‘일찍 일어나’
  - ‘이른 아침에 일어나’
  rationale: 원문의 동사 자체에 시간적 강조가 있으므로, 단순한 ‘일어나다’보다 이른 시각의 뉘앙스를 분명히 하는 것이 적절합니다.
  doctrine_reference: 문맥적 충실성 원칙
