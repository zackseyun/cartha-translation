base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/011.yaml
  text: So David rose early[a], he and his men, to leave in the morning and return to the land of the Philistines[b]. And the Philistines went up to Jezreel.
  footnotes:
  - marker: a
    text: Or 'to go in the morning and return to the land of the Philistines.' The Hebrew infinitives can be rendered more formally.
    reason: lexical_alternative
  - marker: b
    text: '''Went up'' reflects the Hebrew idiom for movement to a place, often with topographical or military nuance; alternatively, ''marched up to Jezreel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 다윗이 아침에 일찍이 일어나, 그와 그의 부하들은 아침에 떠나서 블레셋 사람들의 땅으로 돌아가려고 했습니다. 그런데 블레셋 사람들이 이스르엘로 올라갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 부정사들은 더 직역하면 ‘아침에 가서 블레셋 사람들의 땅으로 돌아가기 위하여’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘올라갔습니다’는 히브리어의 관용적 이동 표현을 따른 것으로, 상황에 따라 ‘진군했습니다’로 옮길 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  english_pob_choice: rose early
  chosen_korean: 아침에 일찍이 일어나
  alternatives_korean:
  - 일찍 일어나
  - 이른 아침에 일어나
  lexicon: HALOT
  rationale: 히필형의 관용적 의미인 ‘일찍 일어나다’를 살리면서, 한국어에서는 자연스럽게 시간 부사구를 붙여 강조를 유지했습니다.
- source_word: הוּא וַאֲנָשָׁיו
  english_pob_choice: he and his men
  chosen_korean: 그와 그의 부하들
  alternatives_korean:
  - 그와 그의 사람들
  - 그와 그의 남자들
  lexicon: HALOT
  rationale: 여기서 אֲנָשָׁיו는 다윗의 동행 무리를 가리키므로, 문맥상 가장 자연스러운 ‘부하들’로 옮겼습니다.
- source_word: לָלֶכֶת בַּבֹּקֶר לָשׁוּב
  english_pob_choice: to leave in the morning and return
  chosen_korean: 아침에 떠나서 … 돌아가려고 했습니다
  alternatives_korean:
  - 아침에 가서 … 돌아가려고 했습니다
  - 아침에 출발하여 … 돌아가려고 했습니다
  lexicon: HALOT
  rationale: 히브리어 부정사 연속은 목적과 진행을 함께 나타내므로, 한국어에서는 ‘떠나서 … 돌아가려고’로 자연스럽게 연결했습니다.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  english_pob_choice: the land of the Philistines
  chosen_korean: 블레셋 사람들의 땅
  alternatives_korean:
  - 블레셋 땅
  - 블레셋 지역
  lexicon: HALOT
  rationale: ‘땅’의 구체성을 유지하되, 집단명칭을 한국어 성경 관용에 맞게 ‘블레셋 사람들’로 풀어 의미를 분명히 했습니다.
- source_word: עָלוּ
  english_pob_choice: went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 올라왔습니다
  - 진군했습니다
  lexicon: HALOT
  rationale: עלה의 기본적인 방향 동사를 그대로 살려, 지형적·군사적 뉘앙스를 과장하지 않고 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 서술 연결
  chosen_reading: 다윗의 출발 계획과 블레셋 군의 이동을 두 문장으로 분리해, 대비를 분명하게 보이도록 했습니다.
  alternative_readings:
  - 한 문장으로 길게 이어 번역할 수 있습니다.
  - ‘그런데’를 약화해 단순 접속으로 처리할 수 있습니다.
  rationale: 히브리어 원문은 다윗의 의도와 블레셋 사람들의 실제 이동을 대비시키므로, 한국어에서도 전환 표지를 살려 서술의 긴장을 유지했습니다.
  doctrine_reference: 서술 문맥 보존 원칙
- issue: וַיַּשְׁכֵּם의 시간 강조
  chosen_reading: ‘아침에 일찍이 일어나’로 시간의 이른 시작을 드러냈습니다.
  alternative_readings:
  - ‘일찍 일어나’
  - ‘이른 아침에 일어나’
  rationale: 원문의 동사 자체에 시간적 강조가 있으므로, 단순한 ‘일어나다’보다 이른 시각의 뉘앙스를 분명히 하는 것이 적절합니다.
  doctrine_reference: 문맥적 충실성 원칙
