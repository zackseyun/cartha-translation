  edition: WLC
  text: וַ/יַּ֣עַן אָכִישׁ֮ וַ/יֹּ֣אמֶר אֶל דָּוִד֒ יָדַ֕עְתִּי כִּ֣י ט֥וֹב אַתָּ֛ה בְּ/עֵינַ֖/י כְּ/מַלְאַ֣ךְ אֱלֹהִ֑ים אַ֣ךְ שָׂרֵ֤י פְלִשְׁתִּים֙ אָֽמְר֔וּ לֹֽא יַעֲלֶ֥ה עִמָּ֖/נוּ בַּ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/009.yaml
  text: Achish answered and said to David[a], “I know that you are good in my eyes, like an angel of God. Yet the commanders of the Philistines have said, ‘He must not go up with us into battle.’”
  footnotes:
  - marker: a
    text: Or 'like a messenger of God.' The Hebrew מַלְאָךְ can mean either 'messenger' or 'angel,' though 'angel of God' is the more natural sense in this expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 아기스가 다윗에게 대답하며 말했습니다. “나는 당신이 내 눈에 하나님의 사자처럼 좋다는 것을 압니다. 그러나 블레셋 군장들이 ‘그는 우리와 함께 전쟁에 올라가서는 안 된다’고 말했습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나님의 사자’는 문자적으로 ‘하나님의 천사’ 또는 ‘하나님의 메신저’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  english_pob_choice: answered ... said
  chosen_korean: 대답하며 말했습니다
  alternatives_korean:
  - 응답하며 말했습니다
  - 대답하고 말했습니다
  lexicon: HALOT
  rationale: 서사에서의 표준 응답 공식을 한국어로 자연스럽게 옮기되, 두 동사의 연속성을 살렸습니다.
- source_word: כְּמַלְאַךְ אֱלֹהִים
  english_pob_choice: like an angel of God
  chosen_korean: 하나님의 사자처럼
  alternatives_korean:
  - 하나님의 천사처럼
  - 하나님의 메신저처럼
  lexicon: HALOT
  rationale: מַלְאָךְ의 의미 범위를 반영하되, 한국어에서는 본문이 전하는 존칭적 비교를 가장 자연스럽게 드러내는 ‘사자’를 택했습니다.
- source_word: שָׂרֵי פְלִשְׁתִּים
  english_pob_choice: the commanders of the Philistines
  chosen_korean: 블레셋 군장들
  alternatives_korean:
  - 블레셋 지휘관들
  - 블레셋 방백들
  lexicon: HALOT
  rationale: 전투 맥락의 통치·지휘 계층을 살려 ‘군장들’로 옮겼습니다. ‘방백들’은 전통적이지만 현대어감이 약합니다.
- source_word: לֹא יַעֲלֶה עִמָּנוּ בַּמִּלְחָמָה
  english_pob_choice: He must not go up with us into battle
  chosen_korean: 그는 우리와 함께 전쟁에 올라가서는 안 된다
  alternatives_korean:
  - 그는 우리와 함께 전쟁에 올라가면 안 된다
  - 그는 우리와 함께 전투에 나가서는 안 된다
  lexicon: HALOT
  rationale: עלה의 군사적 관용구인 ‘올라가다’를 유지하면서, 금지의 강도를 현대 한국어의 ‘-아/어서는 안 된다’로 분명히 했습니다.
theological_decisions:
- issue: מַלְאַךְ אֱלֹהִים의 의미
  chosen_reading: ‘하나님의 사자’로 번역해 비교의 수사성과 존중의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 하나님의 천사
  - 하나님의 메신저
  rationale: 본문은 다윗에 대한 아기스의 평가를 비유적으로 말합니다. 한국어에서는 ‘사자’가 ‘angel/messenger’의 중간 지점을 잘 포착해, 존재론적 단정 없이 높임의 의미를 전달합니다.
  doctrine_reference: 비유적 비교를 존재론으로 확정하지 않고 원문의 수사 효과를 보존합니다.
