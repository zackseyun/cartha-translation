  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אָכִ֗ישׁ כִּ֣י מֶ֤ה עָשִׂ֨יתִי֙ וּ/מַה מָּצָ֣אתָ בְ/עַבְדְּ/ךָ֔ מִ/יּוֹם֙ אֲשֶׁ֣ר הָיִ֣יתִי לְ/פָנֶ֔י/ךָ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י לֹ֤א אָבוֹא֙ וְ/נִלְחַ֔מְתִּי בְּ/אֹיְבֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/008.yaml
  text: David said to Achish[a], “But what have I done? And what have you found against your servant from the day I entered your service until this day[b], that I should not go and fight against the enemies of my lord the king?”
  footnotes:
  - marker: a
    text: Or 'from the day I came before you until this day.' The Hebrew is more literally 'from the day I was before you.'
    reason: lexical_alternative
  - marker: b
    text: '''My lord the king'' is left as spoken. David''s wording may be straightforwardly addressed to Achish, or it may carry deliberate ambiguity in the narrative context.'
    reason: alternative_reading
translation:
  language: ko
  text: 다윗이 아기스에게 말했습니다. “그러나 제가 무슨 잘못을 했습니까? 제가 당신 앞에 있었던 날부터 오늘까지[a], 당신의 종인 제게서 무엇을 찾아내셨기에 제가 가서 내 주 왕[b]의 원수들과 싸우지 못하게 하십니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내가 당신 앞에 있었던 날부터 오늘까지’입니다. 문맥상 다윗이 아기스 곁에 머물며 섬긴 기간을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 주 왕’은 말해진 그대로 옮겼습니다. 이것이 아기스를 향한 직접적인 호칭인지, 이야기 문맥에서 의도적인 모호성을 띠는지는 히브리어 본문이 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד אֶל אָכִישׁ
  english_pob_choice: David said to Achish
  chosen_korean: 다윗이 아기스에게 말했습니다
  alternatives_korean:
  - 다윗이 아기스에게 이르렀습니다
  - 다윗이 아기스에게 말하였습니다
  lexicon: 현대 한국어 인명 표기 관행
  rationale: 서술문의 자연스러운 현대 문체를 따르되, 본문이 단순 발화 서술임을 분명히 하기 위해 평서적 ‘말했습니다’를 택했습니다.
- source_word: כִּי מֶה עָשִׂיתִי
  english_pob_choice: But what have I done?
  chosen_korean: 그러나 제가 무슨 잘못을 했습니까?
  alternatives_korean:
  - 제가 무엇을 했습니까?
  - 그러면 제가 무엇을 했습니까?
  lexicon: HALOT
  rationale: כִּי는 여기서 앞선 발화에 대한 반박/항의의 전환으로 기능하므로 ‘그러나’로 옮겼고, 문맥상 단순 행위가 아니라 책임 부정을 담아 ‘무슨 잘못’으로 자연스럽게 표현했습니다.
- source_word: וּמַה מָּצָאתָ בְעַבְדְּךָ
  english_pob_choice: And what have you found against your servant
  chosen_korean: 그리고 제가 당신의 종에게서 무엇을 찾으셨기에
  alternatives_korean:
  - 그리고 당신의 종 안에서 무엇을 찾으셨기에
  - 그리고 당신의 종에게서 무엇을 발견하셨기에
  lexicon: HALOT
  rationale: מצא with ב는 ‘~에서 발견하다’의 표면 의미를 가지면서도 ‘흠/근거를 찾아내다’의 함축이 있으므로, 한국어에서는 과도하게 해석하지 않으면서도 대조적 항의를 살리는 형태로 옮겼습니다.
- source_word: מִיּוֹם אֲשֶׁר הָיִיתִי לְפָנֶיךָ עַד הַיּוֹם הַזֶּה
  english_pob_choice: from the day I entered your service until this day
  chosen_korean: 제가 당신 앞에 있은 날부터 오늘까지
  alternatives_korean:
  - 제가 당신 앞에 있었던 날부터 오늘까지
  - 제가 당신 앞에 서 있던 날부터 오늘까지
  lexicon: HALOT
  rationale: 직역은 ‘당신 앞에 있은’이지만, 한국어에서 자연스럽고 동시에 원문의 ‘당신 앞에 있던/있었던 상태’를 보존하는 표현으로 정리했습니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: 내 주 왕
  alternatives_korean:
  - 제 주군 왕
  - 내 주 나의 왕
  lexicon: HALOT
  rationale: אֲדֹנִי는 인간 군주에 대한 공손한 호칭으로 보아 ‘내 주’로 두었고, 왕호는 직역해 ‘왕’으로 유지했습니다.
theological_decisions:
- issue: ‘my lord the king’의 지시 대상과 서술상의 긴장
  chosen_reading: ‘내 주 왕’이라는 말을 그대로 살려, 이것이 아기스를 직접 가리키는 공손한 호칭인지, 혹은 내러티브상 의도적 여운을 남기는 표현인지 단정하지 않았습니다.
  alternative_readings:
  - 아기스를 분명한 충성의 주군으로 지칭하는 읽기
  - 문맥상 다른 정치적 충성 대상까지 떠올리게 하는 의도적 모호성
  rationale: 히브리어 본문은 다윗의 의도를 해명하지 않으므로, 번역이 그 긴장을 해소하기보다 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: '번역 원칙: 원문이 남긴 서술적 긴장을 임의로 해소하지 않는다.'
