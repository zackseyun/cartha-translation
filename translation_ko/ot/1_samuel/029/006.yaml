  edition: WLC
  text: וַ/יִּקְרָ֨א אָכִ֜ישׁ אֶל דָּוִ֗ד וַ/יֹּ֣אמֶר אֵ֠לָי/ו חַי יְהוָ֞ה כִּי יָשָׁ֣ר אַתָּ֗ה וְ/ט֣וֹב בְּ֠/עֵינַ/י צֵאתְ/ךָ֨ וּ/בֹאֲ/ךָ֤ אִתִּ/י֙ בַּֽ/מַּחֲנֶ֔ה כִּ֠י לֹֽא מָצָ֤אתִֽי בְ/ךָ֙ רָעָ֔ה מִ/יּ֛וֹם בֹּאֲ/ךָ֥ אֵלַ֖/י עַד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בְ/עֵינֵ֥י הַ/סְּרָנִ֖ים לֹֽא ט֥וֹב אָֽתָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/006.yaml
  text: Then Achish called David and said to him[a], “As Yahweh lives, you are upright, and your going out and your coming in with me in the camp is good in my sight; for I have not found any evil in you from the day of your coming to me to this day. But in the eyes of the lords of the Philistines[c][b], you are not good.”
  footnotes:
  - marker: a
    text: Or, 'your conduct with me in the camp is pleasing in my sight.' The Hebrew literally says, 'your going out and your coming in with me in the camp is good in my sight.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the lords' (סְרָנִים), the title used for the Philistine rulers.
    reason: cultural_note
  - marker: c
    text: Or, 'you are not acceptable' in the eyes of the Philistine rulers.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 아기스가 다윗을 불러 그에게 말했습니다. 「야훼께서 살아 계심을 두고 맹세하건대, 당신은 정직합니다. 당신이 나와 함께 진영에서 드나드는 것이[a] 내 눈에 좋습니다. 당신이 내게 온 날부터 오늘까지 나는 당신에게서 아무 잘못도 발견하지 못했습니다. 그러나 블레셋 방백들[b]의 눈에는 당신이 좋지 않습니다[c].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신의 나감과 들어옴이 나와 함께 진영에서’라고 말합니다. 이는 문맥에 따라 ‘당신의 처신’ 또는 ‘활동’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 סְרָנִים은 블레셋의 통치자들을 가리키는 고유 칭호입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘당신은 받아들여지지 않습니다’라는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서 살아 계심을 두고 맹세합니다
  alternatives_korean:
  - 야훼께서 살아 계십니다
  - 야훼의 삶을 두고
  lexicon: HALOT
  rationale: 히브리어의 전형적인 맹세 공식이므로, 단순 서술보다 맹세 표현으로 옮겨 원문의 화행을 살렸습니다. יְהוָה는 프로젝트 원칙에 따라 야훼로 옮겼습니다.
- source_word: צֵאתְךָ וּבֹאֲךָ
  english_pob_choice: your going out and your coming in
  chosen_korean: 군막에서 나와 들어갈 때의 행실
  alternatives_korean:
  - 당신의 나감과 들어옴
  - 군막에서의 출입
  lexicon: HALOT
  rationale: 문자적으로는 ‘나감과 들어옴’이지만, 본문은 군막/진영 맥락에서 다윗의 처신 전체를 가리키므로 POB의 해설된 의미를 반영해 ‘행실’로 자연스럽게 풀었습니다.
- source_word: טוֹב בְּעֵינַי
  english_pob_choice: good in my sight
  chosen_korean: 내 눈에 좋습니다
  alternatives_korean:
  - 내게 좋습니다
  - 내 눈에 보기에 좋습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘눈’ 이미지를 유지하면서도 한국어로 매끄럽게 옮기기 위해 ‘내 눈에 좋습니다’를 택했습니다.
- source_word: וּבְעֵינֵי הַסְּרָנִים
  english_pob_choice: But in the eyes of the lords of the Philistines
  chosen_korean: 그러나 블레셋 방백들의 눈에는
  alternatives_korean:
  - 그러나 블레셋의 군주들의 눈에는
  - 그러나 블레셋 통치자들의 눈에는
  lexicon: HALOT
  rationale: סְרָנִים은 블레셋 통치 집단의 고유 칭호이므로, 전통적 교회어보다 역사적 지위를 드러내는 ‘방백들’로 옮겼습니다.
- source_word: לֹא טוֹב אָתָּה
  english_pob_choice: you are not good
  chosen_korean: 당신이 좋지 않습니다
  alternatives_korean:
  - 당신은 좋지 않습니다
  - 당신은 받아들여지지 않습니다
  lexicon: HALOT
  rationale: 원문은 간결한 평가이므로 직역의 bluntness를 살리되, 문맥상 ‘받아들여지지 않음’의 뜻이 드러나도록 한국어로는 자연스럽게 풀었습니다.
theological_decisions:
- issue: 여호와/야훼 표기 문제와 필리스티아 왕의 맹세
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 YHWH의 개인명을 직접 사용하므로, 대상 화자가 이방 왕이라도 한국어 본문에서는 신적 칭호가 아닌 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘좋다’의 평가가 도덕적 선함인지 수용 가능성인지
  chosen_reading: 문맥상 둘 다 겹치지만, 본문에서는 먼저 다윗의 행실이 ‘좋다/정직하다’는 칭찬과 마지막에 블레셋 방백들에게는 ‘좋지 않다/받아들여지지 않는다’는 대비를 유지했습니다.
  alternative_readings:
  - 받아들여집니다
  - 호감이 갑니다
  rationale: 히브리어 טוב의 평가적 폭을 지우지 않기 위해 도덕적 칭찬과 사회적 수용성의 긴장을 그대로 남겼습니다.
  doctrine_reference: HALOT semantic range of טוב
