source:
  edition: WLC
  text: הֲ/לוֹא זֶ֣ה דָוִ֔ד אֲשֶׁ֧ר יַעֲנוּ ל֛/וֹ בַּ/מְּחֹל֖וֹת לֵ/אמֹ֑ר הִכָּ֤ה שָׁאוּל֙ בַּֽ/אֲלָפָ֔י/ו וְ/דָוִ֖ד ב/רבבת/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/005.yaml
  text: Is this not David[a], of whom they sang to one another in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
  footnotes:
  - marker: a
    text: Or, more literally, 'they answered concerning him in the dances,' an idiom for responsive or antiphonal singing.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'ten thousands'; the term can also be understood more generally as 'myriads.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 다윗이 아닙니까? 무도회에서 서로 주고받으며 노래할 때 이렇게 말했습니다. ‘사울이 그의 천천을 치고, 다윗은 그의 만만을 쳤다’고 말입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘화답하다/응답하다’의 관용적 용법으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘열만/만만’의 수를 말하지만, 더 넓게는 ‘무리, 무수한 군중’의 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  english_pob_choice: Is this not
  chosen_korean: 이것이 … 아닙니까?
  alternatives_korean:
  - 이것이 … 아니오?
  - 이 사람이 … 아닙니까?
  lexicon: HALOT
  rationale: 반어적 확인 질문의 강한 어조를 살리면서도 현대 한국어에서 자연스럽게 읽히는 형식으로 옮겼습니다.
- source_word: יַעֲנוּ לוֹ
  english_pob_choice: they sang to one another
  chosen_korean: 서로 주고받으며 노래할 때
  alternatives_korean:
  - 서로 화답할 때
  - 그에게 응답하여 노래할 때
  lexicon: HALOT
  rationale: 동사 ענה의 응답/교창 의미를 살리되, 무도회와 결합된 노래의 관용적 장면을 한국어로 자연스럽게 표현했습니다.
- source_word: בַּמְּחֹלוֹת
  english_pob_choice: in the dances
  chosen_korean: 무도회에서
  alternatives_korean:
  - 춤판에서
  - 춤 가운데
  lexicon: HALOT
  rationale: 축제적 집단 춤의 장면을 한국어로 풀어, 단순한 ‘춤’보다 공동체적 행사라는 맥락이 드러나게 했습니다.
- source_word: בַּאֲלָפָיו / בְּרִבְבֹתָיו
  english_pob_choice: his thousands / his ten thousands
  chosen_korean: 그의 천천 / 그의 만만
  alternatives_korean:
  - 그의 수천 / 그의 수만
  - 그의 천 명 / 그의 만 명
  lexicon: HALOT
  rationale: 히브리어의 수사적 대조를 유지하기 위해 전통적 한국어 성경 어법에 익숙한 ‘천천/만만’을 사용했으며, 소유 대명사도 그대로 살렸습니다.
theological_decisions:
- issue: 군사적 과장 수사의 보존
  chosen_reading: ‘천천’과 ‘만만’의 대조를 그대로 살려, 승전가의 과장되고 선명한 칭송을 유지했습니다.
  alternative_readings:
  - ‘수천’과 ‘수만’으로 완화하여 자연스럽게 옮기는 방식
  rationale: 본문은 숫자 정보보다 대조적 찬가의 힘이 핵심이므로, 수사적 대비를 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 시적/서사적 과장 표현의 직역 원칙
