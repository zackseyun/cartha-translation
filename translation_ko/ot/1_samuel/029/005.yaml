  lexicon: HALOT
  rationale: 동사 ענה의 응답/교창 의미를 살리되, 무도회와 결합된 노래의 관용적 장면을 한국어로 자연스럽게 표현했습니다.
- source_word: בַּמְּחֹלוֹת
  english_pob_choice: in the dances
