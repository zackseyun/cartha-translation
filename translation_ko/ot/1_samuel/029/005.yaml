base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/005.yaml
  text: Is this not David[a], of whom they sang to one another in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
  footnotes:
  - marker: a
    text: Or, more literally, 'they answered concerning him in the dances,' an idiom for responsive or antiphonal singing.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'ten thousands'; the term can also be understood more generally as 'myriads.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들이 춤추며 서로 화답하여 ‘사울은 수천 명을 치고, 다윗은 수만 명을 쳤다’고 노래하던 그 다윗이 아닙니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그를 두고 화답하였다’입니다. 여기서는 춤추며 부르는 노래에서 서로 화답하거나 교창하는 것을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘천들’과 ‘만들’을 말합니다. ‘만들’은 ‘만 단위들’ 또는 더 일반적으로 ‘무수한 수’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
