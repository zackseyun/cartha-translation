  lexicon: HALOT
  rationale: 축제적 집단 춤의 장면을 한국어로 풀어, 단순한 ‘춤’보다 공동체적 행사라는 맥락이 드러나게 했습니다.
- source_word: בַּאֲלָפָיו / בְּרִבְבֹתָיו
  english_pob_choice: his thousands / his ten thousands
  chosen_korean: 그의 천천 / 그의 만만
  alternatives_korean:
  - 그의 수천 / 그의 수만
  - 그의 천 명 / 그의 만 명
  lexicon: HALOT
  rationale: 히브리어의 수사적 대조를 유지하기 위해 전통적 한국어 성경 어법에 익숙한 ‘천천/만만’을 사용했으며, 소유 대명사도 그대로 살렸습니다.
theological_decisions:
- issue: 군사적 과장 수사의 보존
  chosen_reading: ‘천천’과 ‘만만’의 대조를 그대로 살려, 승전가의 과장되고 선명한 칭송을 유지했습니다.
  alternative_readings:
  - ‘수천’과 ‘수만’으로 완화하여 자연스럽게 옮기는 방식
  rationale: 본문은 숫자 정보보다 대조적 찬가의 힘이 핵심이므로, 수사적 대비를 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 시적/서사적 과장 표현의 직역 원칙
