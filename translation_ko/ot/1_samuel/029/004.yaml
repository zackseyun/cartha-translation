source:
  edition: WLC
  text: וַ/יִּקְצְפ֨וּ עָלָ֜י/ו שָׂרֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֣אמְרוּ ל/וֹ֩ שָׂרֵ֨י פְלִשְׁתִּ֜ים הָשֵׁ֣ב אֶת הָ/אִ֗ישׁ וְ/יָשֹׁב֙ אֶל מְקוֹמ/וֹ֙ אֲשֶׁ֣ר הִפְקַדְתּ֣/וֹ שָׁ֔ם וְ/לֹֽא יֵרֵ֤ד עִמָּ֨/נוּ֙ בַּ/מִּלְחָמָ֔ה וְ/לֹא יִֽהְיֶה לָּ֥/נוּ לְ/שָׂטָ֖ן בַּ/מִּלְחָמָ֑ה וּ/בַ/מֶּ֗ה יִתְרַצֶּ֥ה זֶה֙ אֶל אֲדֹנָ֔י/ו הֲ/ל֕וֹא בְּ/רָאשֵׁ֖י הָ/אֲנָשִׁ֥ים הָ/הֵֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/004.yaml
  text: But the Philistine commanders were angry with him[a], and the Philistine commanders said to him, “Send the man back, so that he may return to his place where you assigned him, and let him not go down with us into battle, lest he become an adversary to us in the battle[b]. For with what could this man reconcile himself to his lord? Would it not be with the heads of those men?”
  footnotes:
  - marker: a
    text: Hebrew שָׂטָן here means 'adversary' or 'opponent,' not the proper name 'Satan.'
    reason: lexical_alternative
  - marker: b
    text: Or 'regain favor with his lord.' The Hebrew expression refers to making oneself acceptable again to one's superior.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 블레셋 지휘관들은 그에게 화를 내며 블레셋 지휘관들이 그에게 말했습니다. 「그 사람을 돌려보내어 그가 네가 그에게 지정한 곳으로 돌아가게 하십시오. 그가 우리와 함께 전쟁에 내려오지 못하게 하십시오. 전쟁에서 우리에게 적대자가 되지 않게 하십시오[a]. 이 사람이 어떻게 자기 주인에게 다시 호의를 얻겠습니까[b]? 그것이 저 사람들의 우두머리들을 통해서가 아니겠습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שָׂטָן은 여기서 ‘대적’ 또는 ‘적대자’를 뜻하며, 고유명사 ‘사탄’이 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 주인의 호의를 다시 얻겠습니까.’ 히브리어 표현은 윗사람의 환심을 다시 사는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצְפוּ עָלָיו
  english_pob_choice: were angry with him
  chosen_korean: 그에게 화를 내며
  alternatives_korean:
  - 그에게 분노하며
  - 그에게 격분하며
  lexicon: HALOT
  rationale: קצף는 분노/노여움을 뜻하므로, 현대 한국어에서 자연스러운 ‘화를 내다’로 옮기되 과장되지 않게 했습니다.
- source_word: שָׂרֵי פְלִשְׁתִּים
  english_pob_choice: the Philistine commanders
  chosen_korean: 블레셋 지휘관들
  alternatives_korean:
  - 블레셋 군대의 지휘자들
  - 블레셋 지도자들
  lexicon: HALOT
  rationale: 전쟁 맥락의 שָׂרִים는 군사 지휘관을 가리키므로, ‘지휘관들’이 가장 직접적이고 분명합니다.
- source_word: הָשֵׁב אֶת הָאִישׁ / וְיָשֹׁב אֶל מְקוֹמוֹ
  english_pob_choice: Send the man back, so that he may return to his place
  chosen_korean: 그 사람을 돌려보내어 그가 네가 그에게 지정한 곳으로 돌아가게 하십시오
  alternatives_korean:
  - 그 사람을 보내 돌려서 그가 자기 자리로 돌아가게 하십시오
  - 그 사람을 되돌려 보내어 그가 그의 장소로 돌아가게 하십시오
  lexicon: HALOT
  rationale: 히필 명령형과 결과적 뉘앙스를 함께 살리기 위해 ‘돌려보내어 … 돌아가게 하십시오’로 옮겼습니다. ‘지정한 곳’은 포로/배치 문맥의 הפקיד를 반영합니다.
- source_word: וְלֹא יִהְיֶה לָּנוּ לְשָׂטָן
  english_pob_choice: lest he become an adversary to us
  chosen_korean: 전쟁에서 우리에게 적대자가 되지 않게 하십시오
  alternatives_korean:
  - 전쟁에서 우리에게 대적이 되지 않게 하십시오
  - 전쟁에서 우리를 대적하는 자가 되지 않게 하십시오
  lexicon: HALOT
  rationale: שָׂטָן은 고유명사가 아니라 일반명사 ‘대적/적대자’이므로, 한국어에서도 이름화하지 않고 기능적 의미를 살렸습니다.
- source_word: יִתְרַצֶּה זֶה אֶל אֲדֹנָיו
  english_pob_choice: could this man reconcile himself to his lord
  chosen_korean: 이 사람이 어떻게 자기 주인에게 다시 호의를 얻겠습니까
  alternatives_korean:
  - 이 사람이 어떻게 자기 주인과 화해하겠습니까
  - 이 사람이 어떻게 자기 주인에게 다시 받아들여지겠습니까
  lexicon: HALOT
  rationale: 히트파엘 רצה는 ‘호의를 얻다/환심을 사다’의 뜻이 자연스럽고, 여기서는 결과적으로 상전의 호의를 회복하는 의미이므로 그렇게 옮겼습니다.
- source_word: הֲלוֹא בְּרָאשֵׁי הָאֲנָשִׁים הָהֵם
  english_pob_choice: Would it not be with the heads of those men?
  chosen_korean: 그것이 저 사람들의 우두머리들을 통해서가 아니겠습니까
  alternatives_korean:
  - 그것이 저 사람들의 머리들로 말미암는 것이 아니겠습니까
  - 그것이 저 사람들의 머리들과 함께하는 것이 아니겠습니까
  lexicon: HALOT
  rationale: 히브리어의 ‘머리들’은 문자적으로는 우두머리들이지만, 문맥상 사울의 환심을 사려면 적의 머리들을 가져와야 한다는 뉘앙스가 있으므로, 모호성을 남기되 한국어로는 자연스럽게 표현했습니다.
theological_decisions:
- issue: שָׂטָן의 신학적 오독 방지
  chosen_reading: ‘적대자’로 번역하여 인물/개념을 고유명사화하지 않았습니다.
  alternative_readings:
  - 사탄
  - 대적
  rationale: 본문은 역사 서술에서의 일반명사 용례이므로, 후대의 악마론적 명칭을 투사하지 않도록 했습니다.
  doctrine_reference: 본문의 평문 의미 보존; 일반명사와 고유명사의 구별
