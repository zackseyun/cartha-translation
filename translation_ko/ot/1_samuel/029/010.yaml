  text: Now rise early in the morning[a], you and your master's servants who came with you. When you rise early in the morning and it is light for you, go.
  footnotes:
  - marker: a
    text: Or 'when daylight comes for you, go' / 'at daybreak, go.' The Hebrew clause is literally 'and it is light for you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 아침에 일찍 일어나십시오. 당신과 함께 온 당신의 주인의 종들도 그러하십시오. 아침에 일찍 일어나, 날이 밝으면[a] 가십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희에게 빛이 있으면 가십시오’ / ‘동이 트면 가십시오’. 히브리어는 문자적으로 ‘너희에게 빛이 있으면’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
