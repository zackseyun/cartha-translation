source:
  edition: WLC
  text: וְ/עַתָּה֙ הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/עַבְדֵ֥י אֲדֹנֶ֖י/ךָ אֲשֶׁר בָּ֣אוּ אִתָּ֑/ךְ וְ/הִשְׁכַּמְתֶּ֣ם בַּ/בֹּ֔קֶר וְ/א֥וֹר לָ/כֶ֖ם וָ/לֵֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/010.yaml
  text: Now rise early in the morning[a], you and your master's servants who came with you. When you rise early in the morning and it is light for you, go.
  footnotes:
  - marker: a
    text: Or 'when daylight comes for you, go' / 'at daybreak, go.' The Hebrew clause is literally 'and it is light for you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 아침 일찍 일어나십시오[a]. 당신과 함께 온 당신의 주인의 종들도 그러하십시오. 아침 일찍 일어나서, 당신에게 밝아지면 가십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘날이 밝으면 가십시오’ / ‘동이 트면 가십시오’. 히브리어는 문자적으로 ‘당신에게 밝으면’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 담화 전환 표지로서 즉각적인 지시를 시작하므로, 현대 한국어에서 자연스러운 ‘이제’로 옮겼습니다.
- source_word: הַשְׁכֵּם / וְהִשְׁכַּמְתֶּם
  english_pob_choice: rise early
  chosen_korean: 아침 일찍 일어나십시오 / 아침 일찍 일어나서
  alternatives_korean:
  - 일찍 일어나십시오
  - 새벽에 일어나십시오
  lexicon: HALOT
  rationale: 동일 동사의 반복을 살려 첫 절과 다음 절에 모두 ‘아침 일찍 일어나-’를 대응시켜, 원문의 반복 명령과 시간 강조를 보존했습니다.
- source_word: אֲדֹנֶיךָ
  english_pob_choice: your master's servants
  chosen_korean: 당신의 주인의 종들
  alternatives_korean:
  - 당신의 주인의 일꾼들
  - 당신의 주인의 하인들
  lexicon: HALOT
  rationale: 여기서는 신적 호칭이 아닌 인간 주인을 가리키므로, 문맥상 가장 직접적인 ‘주인’으로 옮기고 ‘종들’로 종속 관계를 분명히 했습니다.
- source_word: וְאוֹר לָכֶם
  english_pob_choice: and it is light for you
  chosen_korean: 당신에게 밝아지면
  alternatives_korean:
  - 당신에게 빛이 나면
  - 날이 밝으면
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현인 ‘당신에게 빛이 있다’를 한국어로 자연스럽게 풀되, 출발 시점을 ‘밝아지면’으로 유지해 원문 의미를 보존했습니다.
theological_decisions:
- issue: 명령형과 시간절의 관계
  chosen_reading: 두 번째 절을 단순 반복 명령이 아니라 ‘아침 일찍 일어나서, 당신에게 밝아지면 가십시오’라는 시간 조건/지시의 연속으로 처리했습니다.
  alternative_readings:
  - ‘아침 일찍 일어나십시오… 그러면 가십시오’
  - ‘아침 일찍 일어나십시오… 그리고 밝아지면 가십시오’
  rationale: 히브리어의 וְהִשְׁכַּמְתֶּם와 וְאוֹר לָכֶם는 단순 병렬보다 순차적 출발 조건을 형성하므로, 한국어에서도 그 기능을 드러내는 쪽이 본문 의미를 더 정확히 전달합니다.
  doctrine_reference: 문맥적 서술/지시의 정확한 재현
