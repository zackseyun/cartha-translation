  lexicon: HALOT
  rationale: 담화 전환 표지로서 즉각적인 지시를 시작하므로, 현대 한국어에서 자연스러운 ‘이제’로 옮겼습니다.
- source_word: הַשְׁכֵּם / וְהִשְׁכַּמְתֶּם
