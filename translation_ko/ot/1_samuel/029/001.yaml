base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/001.yaml
  text: Now the Philistines gathered all their camps at Aphek[b][a], while Israel was encamped by the spring that is in Jezreel.
  footnotes:
  - marker: a
    text: Or 'all their forces' or 'all their armies'; the Hebrew more literally says 'all their camps.'
    reason: lexical_alternative
  - marker: b
    text: Or 'by the fountain'; the Hebrew word can refer to a spring or fountain.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 블레셋 사람들이 아벡에 자기들의 모든 진영을 모았고, 이스라엘은 이스르엘에 있는 샘 곁에 진을 치고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들의 모든 군대', '그들의 모든 병력'으로도 옮길 수 있습니다. 히브리어는 더 문자적으로는 '그들의 모든 진영'이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '샘'으로도 옮길 수 있습니다. 히브리어 어휘는 샘물이나 분수 같은 물줄기를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּצוּ
  english_pob_choice: gathered
  chosen_korean: 모았고
  alternatives_korean:
  - 집결했고
  - 소집했고
  lexicon: HALOT
  rationale: קבץ의 기본 의미인 '모으다/집합하다'를 자연스럽게 살려, 군사적 상황을 지나치게 해석하지 않고 현재 문맥에 맞는 동작으로 옮겼습니다.
- source_word: כָּל מַחֲנֵיהֶם
  english_pob_choice: all their camps
  chosen_korean: 자기들의 모든 진영
  alternatives_korean:
  - 그들의 모든 군대
  - 그들의 모든 야영지
  lexicon: HALOT
  rationale: מַחֲנֶה는 '진영/야영지'가 기본값이므로, POB의 'camps'를 따라 '진영'으로 옮겨 군사 집결의 장면을 보존했습니다.
- source_word: בַּעַיִן
  english_pob_choice: by the spring
  chosen_korean: 샘 곁에
  alternatives_korean:
  - 샘물 곁에
  - 우물 곁에
  lexicon: HALOT
  rationale: עַיִן은 지리 문맥에서 샘을 가리킬 수 있으므로, POB의 의미 선택을 반영해 자연스러운 현대 한국어로 '샘'을 택했습니다.
- source_word: וְיִשְׂרָאֵל חֹנִים
  english_pob_choice: while Israel was encamped
  chosen_korean: 이스라엘은 … 진을 치고 있었습니다
  alternatives_korean:
  - 이스라엘은 … 진쳤습니다
  - 이스라엘은 … 진을 치고 있었습니다
  lexicon: HALOT
  rationale: 이스라엘을 집합명사로 보고 단수형 자연문장으로 처리했으며, חנה의 군사적 정착 상태를 '진을 치다'로 옮겼습니다.
theological_decisions:
- issue: 지명 표기와 서술 톤
  chosen_reading: 아벡, 이스르엘은 현대 음역으로 처리하고, 서술은 사건 보고체로 유지했습니다.
  alternative_readings:
