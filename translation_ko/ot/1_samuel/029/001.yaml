  - 그들의 모든 야영지
  lexicon: HALOT
  rationale: מַחֲנֶה는 '진영/야영지'가 기본값이므로, POB의 'camps'를 따라 '진영'으로 옮겨 군사 집결의 장면을 보존했습니다.
- source_word: בַּעַיִן
  english_pob_choice: by the spring
  chosen_korean: 샘 곁에
  alternatives_korean:
  - 샘물 곁에
  - 우물 곁에
  lexicon: HALOT
  rationale: עַיִן은 지리 문맥에서 샘을 가리킬 수 있으므로, POB의 의미 선택을 반영해 자연스러운 현대 한국어로 '샘'을 택했습니다.
- source_word: וְיִשְׂרָאֵל חֹנִים
  english_pob_choice: while Israel was encamped
  chosen_korean: 이스라엘은 … 진을 치고 있었습니다
  alternatives_korean:
  - 이스라엘은 … 진쳤습니다
  - 이스라엘은 … 진을 치고 있었습니다
  lexicon: HALOT
  rationale: 이스라엘을 집합명사로 보고 단수형 자연문장으로 처리했으며, חנה의 군사적 정착 상태를 '진을 치다'로 옮겼습니다.
theological_decisions:
