  yaml_path: translation/ot/1_samuel/029/001.yaml
  text: Now the Philistines gathered all their camps at Aphek[b][a], while Israel was encamped by the spring that is in Jezreel.
  footnotes:
  - marker: a
    text: Or 'all their forces' or 'all their armies'; the Hebrew more literally says 'all their camps.'
    reason: lexical_alternative
  - marker: b
    text: Or 'by the fountain'; the Hebrew word can refer to a spring or fountain.
    reason: lexical_alternative
translation:
  language: ko
  text: 블레셋 사람들은 아벡에 그들의 모든 진영[a]을 모았고, 이스라엘은 이스르엘에 있는 샘[b] 곁에 진을 치고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 모든 군대’ 또는 ‘그들의 모든 병력’. 히브리어는 더 문자적으로 ‘그들의 모든 진영’이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘분수’. 히브리어 단어는 샘이나 분수를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּצוּ
  english_pob_choice: gathered
  chosen_korean: 모았고
  alternatives_korean:
  - 집결했고
