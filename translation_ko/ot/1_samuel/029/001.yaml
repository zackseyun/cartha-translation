  - 벧아웩
  rationale: 본문은 신학적 해석보다 역사 서술이 중심이므로, 익숙한 성서 지명을 현대 표기법에 맞춰 옮기고 사건의 병렬 구도를 유지했습니다.
  doctrine_reference: 본문 서사 문맥
