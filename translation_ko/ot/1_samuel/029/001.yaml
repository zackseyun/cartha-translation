  lexicon: HALOT
  rationale: קבץ의 기본 의미인 '모으다/집합하다'를 자연스럽게 살려, 군사적 상황을 지나치게 해석하지 않고 현재 문맥에 맞는 동작으로 옮겼습니다.
- source_word: כָּל מַחֲנֵיהֶם
  english_pob_choice: all their camps
  chosen_korean: 자기들의 모든 진영
  alternatives_korean:
