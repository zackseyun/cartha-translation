translation:
  language: ko
  text: 그러므로 이제 돌아가서 평안히 가십시오. 블레셋 군주들이 보기에[a] 악한 일을 하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘블레셋 군주들의 눈에 악을 행하지 마십시오.’ 히브리어 표현은 그들이 판단하기에 악하거나 받아들일 수 없는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
