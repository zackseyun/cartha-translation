base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/007.yaml
  text: So now[a], return and go in peace, and do not do evil in the eyes of the Philistine lords.
  footnotes:
  - marker: a
    text: Or, 'do not do wrong in the sight of the Philistine lords.' The Hebrew expression can denote what is judged evil or unacceptable by them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러니 이제 돌아가서 평안히 가십시오. 그리고 블레셋 군주들의 눈에 악한 일을 하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘블레셋 군주들의 보기에는 옳지 않은 일을 하지 마십시오.’ 히브리어 표현은 그들이 판단하기에 악하거나 받아들일 수 없는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
