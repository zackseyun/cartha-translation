  to: 그러자 블레셋의 지휘관들이 말했습니다. “이 히브리인들은 무엇입니까?” 아기스가 블레셋의 지휘관들에게 말했습니다. “이 사람은 이스라엘 왕 사울의 종 다윗이 아니오? 그는 여러 날이든 여러 해이든 나와 함께 있었습니다. 그가 넘어온 날부터[a] 오늘에 이르기까지, 나는 그에게서 아무 잘못도 찾지 못했습니다.”
