base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/003.yaml
  text: Then the Philistine commanders said[a], “What are these Hebrews?” And Achish said to the Philistine commanders, “Is this not David, the servant of Saul king of Israel, who has been with me these days or these years? And I have found nothing against him from the day of his defecting until this very day.”
  footnotes:
  - marker: a
    text: Or, more literally, “From the day he fell to him/me,” that is, from the day he came over or defected.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 블레셋의 지휘관들이 말했습니다. “이 히브리인들은 무엇입니까?” 아기스가 블레셋의 지휘관들에게 말했습니다. “이 사람은 이스라엘 왕 사울의 종 다윗이 아니오? 그는 여러 날이든 여러 해이든 나와 함께 있었습니다. 그가 넘어온 날부터[a] 오늘에 이르기까지, 나는 그에게서 아무 잘못도 찾지 못했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하여, “그가 떨어진 날부터.” 히브리어 관용 표현은 문맥상 그가 아기스에게 넘어오거나 전향한 날을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  english_pob_choice: the Philistine commanders
  chosen_korean: 블레셋의 지휘관들
  alternatives_korean:
  - 블레셋의 군대장관들
  - 블레셋의 지도자들
  - 블레셋의 방백들
  lexicon: HALOT
  rationale: 전쟁 맥락의 שָׂרִים는 단순한 ‘지도자’보다 군사적 지위가 드러나는 ‘지휘관들’이 자연스럽고, ‘방백들’은 한국어에서 지나치게 전통적입니다.
- source_word: הָעִבְרִים הָאֵלֶּה
  english_pob_choice: What are these Hebrews?
  chosen_korean: 이 히브리인들은 무엇입니까?
  alternatives_korean:
  - 이 히브리인들은 무엇입니까?
  - 이 히브리인들은 여기서 무엇합니까?
  - 이 히브리인들은 대체 무엇입니까?
  lexicon: HALOT
  rationale: 원문은 생략된 질문형이므로, POB의 최신 수정처럼 ‘doing here’를 덧붙이지 않고 질문 자체를 직접적으로 살렸습니다.
- source_word: עֶבֶד
  english_pob_choice: the servant
  chosen_korean: 종
  alternatives_korean:
  - 종
  - 시종
  - 종사
  lexicon: HALOT
  rationale: 아기스가 다윗을 사울과의 정치·주종 관계 속에서 부르므로 ‘종’이 source-direct하며, 문맥상 ‘노예’까지는 요구되지 않습니다.
- source_word: זֶה יָמִים אוֹ זֶה שָׁנִים
  english_pob_choice: these days or these years
  chosen_korean: 이 여러 날, 이 여러 해 동안
  alternatives_korean:
  - 이 여러 날, 이 여러 해 동안
  - 이 날들과 이 해들 동안
  - 이제 여러 날 또는 여러 해 동안
  lexicon: HALOT
  rationale: 반복되는 זֶה를 살려 시간의 길이를 강조하는 표현으로 옮겼고, 한국어에서는 ‘이 여러 날, 이 여러 해 동안’이 가장 자연스럽습니다.
- source_word: מִיּוֹם נָפְלֹו
  english_pob_choice: from the day of his defecting
  chosen_korean: 그가 나에게 돌아선 날부터
  alternatives_korean:
  - 그가 나에게 넘어온 날부터
  - 그가 나에게 투항한 날부터
  - 그가 내게 떨어진 날부터
  lexicon: HALOT
  rationale: נפל의 관계적·정치적 의미를 살리면서도 한국어에서 독자가 즉시 이해할 수 있도록 ‘돌아선 날부터’로 옮겼습니다.
- source_word: מְאוּמָה
  english_pob_choice: nothing against him
  chosen_korean: 아무것도 잘못된 것을
  alternatives_korean:
  - 아무것도
  - 그 어떤 잘못도
  - 그에게서 아무것도
  lexicon: HALOT
  rationale: 직역하면 ‘아무것도’지만, 한국어에서는 ‘그에게서 아무것도 잘못된 것을 찾지 못했습니다’가 원문의 무흠 판정을 더 분명히 드러냅니다.
theological_decisions:
- issue: 하나님/주님 용어와 직접 관련 없는 본문의 인물·관계 표현을 얼마나 직역할지
  chosen_reading: 다윗을 사울의 ‘종’으로, 그리고 ‘그가 나에게 돌아선 날부터’로 비교적 직접적으로 옮겼습니다.
  alternative_readings:
  - ‘사울의 시종’
  - ‘그가 나에게 붙은 날부터’
  - ‘그가 내 편이 된 날부터’
  rationale: 이 구절은 다윗의 정치적 전향과 아기스의 무죄 증언을 강조하므로, 완화된 표현보다 원문의 긴장과 관계성을 드러내는 표현이 적절합니다.
  doctrine_reference: 본문 의미 보존과 역사서 서술의 직접성
- issue: 블레셋 사람들의 발화에서 질문형과 진술형의 긴장 유지
  chosen_reading: 첫 문장을 ‘이 히브리인들은 무엇입니까?’로, 아기스의 답변은 반문 뒤 서술로 처리했습니다.
  alternative_readings:
  - ‘이 히브리인들은 무엇을 하러 왔습니까?’
  - ‘이 히브리인들을 보시오’
  rationale: 원문은 응축된 조롱/의심의 질문이므로, 의미를 풀어헤치기보다 질문의 날카로움을 유지하는 것이 본문의 분위기를 더 잘 드러냅니다.
  doctrine_reference: 서사 문맥 보존
