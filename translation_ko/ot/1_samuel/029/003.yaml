  terminology: ‘블레셋의 지휘관들’, ‘히브리인들’, ‘이스라엘 왕 사울의 종 다윗’은 적절합니다. נפל의 정치적 용례는 본문에서 ‘넘어온’으로 자연스럽게 옮기되, 원문의 관용적이고 다소 불확정적인 표현은 각주에서 밝혀야 합니다.
