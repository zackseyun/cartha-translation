source:
  edition: WLC
  text: וַ/יָּק֜וּמוּ כָּל אִ֣ישׁ חַיִל֮ וַ/יֵּלְכ֣וּ כָל הַ/לַּיְלָה֒ וַ/יִּקְח֞וּ אֶת גְּוִיַּ֣ת שָׁא֗וּל וְ/אֵת֙ גְּוִיֹּ֣ת בָּנָ֔י/ו מֵ/חוֹמַ֖ת בֵּ֣ית שָׁ֑ן וַ/יָּבֹ֣אוּ יָבֵ֔שָׁ/ה וַ/יִּשְׂרְפ֥וּ אֹתָ֖/ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/012.yaml
  text: Then all the valiant men arose and went all night[a], and they took the body of Saul and the bodies of his sons from the wall of Beth-shan[b], and they came to Jabesh and burned them there.
  footnotes:
  - marker: a
    text: Or 'corpse' and 'corpses.' The Hebrew term refers specifically to dead bodies.
    reason: lexical_alternative
  - marker: b
    text: Jabesh here refers to Jabesh-gilead in the broader context.
    reason: cross_reference
translation:
  language: ko
  text: 그때 모든 용맹한 사람들이 일어나 밤새 갔고[a], 사울의 시체와 그의 아들들의 시체를 벧산 성벽에서 가져와 야베스로 와서 거기서 불살랐습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밤새 갔고’는 히브리어의 지속적 이동을 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  english_pob_choice: all the valiant men
  chosen_korean: 모든 용맹한 사람들
  alternatives_korean:
  - 모든 용사들
  - 모든 전투원들
  - 모든 용맹한 남자들
  lexicon: HALOT
  rationale: 군사적 구출 장면에서 אִישׁ חַיִל의 남성 집단 의미를 살리면서도, 현대 한국어에서 자연스럽고 문맥에 맞게 ‘용맹한 사람들’로 옮겼습니다.
- source_word: וַיֵּלְכ֣וּ כָל הַ/לַּיְלָה
  english_pob_choice: went all night
  chosen_korean: 밤새 갔고
  alternatives_korean:
  - 밤새 걸었고
  - 밤새 여행했고
  - 밤새 이동했고
  lexicon: HALOT
  rationale: 행동의 지속성을 간결하게 전달하면서도, 영어 POB의 과도한 구체화를 피하고 서사 흐름을 유지하는 표현으로 옮겼습니다.
- source_word: גְּוִיַּת / גְּוִיֹּת
  english_pob_choice: the body / the bodies
  chosen_korean: 시체와 그의 아들들의 시체
  alternatives_korean:
  - 몸과 그의 아들들의 몸
  - 시신과 그의 아들들의 시신
  - 유해와 그의 아들들의 유해
  lexicon: HALOT
  rationale: 히브리어 גְּוִיָּה는 죽은 몸, 곧 시체를 가리키므로, 본문의 직접성과 긴박함을 살려 ‘시체’로 옮겼습니다.
- source_word: מֵ/חוֹמַ֖ת בֵּ֣ית שָׁ֑ן
  english_pob_choice: from the wall of Beth-shan
  chosen_korean: 벧산 성벽에서
  alternatives_korean:
  - 벧산의 성벽에서
  - 벧산 성에서
  - 벧산 성곽에서
  lexicon: HALOT
  rationale: מִן + חוֹמָה는 ‘~에서/로부터’의 뜻이므로, 한국어에서도 자연스럽게 ‘성벽에서’로 옮겨 원문의 장소·이동 관계를 분명히 했습니다.
- source_word: יָבֵשָׁה
  english_pob_choice: to Jabesh
  chosen_korean: 야베스로
  alternatives_korean:
  - 야베시로
  - 야베스길르앗으로
  - 야베스로서
  lexicon: HALOT
  rationale: 지향을 나타내는 어미를 반영해 방향성을 살렸고, 본문 자체는 단순히 ‘야베스’이지만 발음상 자연스러운 표기로 옮겼습니다.
- source_word: וַיִּשְׂרְפוּ אֹתָם
  english_pob_choice: and burned them there
  chosen_korean: 거기서 불살랐습니다
  alternatives_korean:
  - 거기서 태웠습니다
  - 거기서 화장했습니다
  - 거기서 불태웠습니다
  lexicon: HALOT
  rationale: 동사의 직접적 의미를 살리되, 장례 문맥에서 지나친 완곡어법을 피하면서도 현대 한국어에서 읽기 자연스럽게 ‘불살라다’로 옮겼습니다.
