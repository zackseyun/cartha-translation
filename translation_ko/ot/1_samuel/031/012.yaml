review_pass:
  verdict: revise
  source_fidelity: 히브리어의 사건 순서와 핵심 어휘는 대체로 충실합니다. 다만 אִישׁ חַיִל이 군사 장면의 남성 집단을 가리키는데 ‘사람들’은 그 성별 특정성을 충분히 보존하지 못합니다. 또한 וַיָּבֹאוּ יָבֵשָׁה는 야베스에 도착한 것을 뜻하므로 ‘야베스로 와서’보다 ‘야베스에 이르러’가 방향과 도착을 더 정확하고 자연스럽게 나타냅니다.
  naturalness: ‘밤새 갔고’는 이해되지만 ‘밤새도록 길을 가서’가 지속성을 더 자연스럽게 드러냅니다. ‘야베스로 와서’는 한국어 서술 관점상 다소 부자연스러우므로 ‘야베스에 이르러’로 고치는 것이 좋습니다. ‘불태웠습니다’는 현대 표준어 합쇼체에서 ‘불살랐습니다’보다 자연스럽습니다.
  terminology: 벧산, 야베스, 성벽, 시체는 적절합니다. ‘용맹한 남자들’은 원문의 군사적 남성 집단을 보존하면서도 현대 한국어에서 이해 가능합니다.
  issues:
  - severity: medium
    issue: ‘모든 용맹한 사람들’이 원문의 남성 집단 표지를 중립화합니다.
    rationale: כָּל אִישׁ חַיִל은 이 군사적 맥락에서 용맹한 남성들로 이루어진 집단을 가리킵니다. ‘남자들’을 사용하면 원문의 특정성을 보존할 수 있습니다.
  - severity: low
    issue: ‘야베스로 와서’는 도착지와 화자 중심 이동을 어색하게 표현합니다.
    rationale: יָבֵשָׁה는 야베스를 향한 이동과 도착을 나타냅니다. ‘야베스에 이르러’가 히브리어 서사 흐름과 한국어 용법에 더 잘 맞습니다.
  - severity: low
    issue: ‘불살랐습니다’는 현대 표준어 문체에서 다소 고풍스럽습니다.
    rationale: שָׂרַף의 직접적 의미는 ‘불태우다’로 자연스럽게 옮길 수 있으며, 의미를 완곡하게 바꾸지 않습니다.
  revised_text: 그때 모든 용맹한 남자들이 일어나 밤새도록 길을 가서, 사울의 시체와 그의 아들들의 시체를 벧산 성벽에서 가져와 야베스에 이르러 거기서 그것들을 불태웠습니다.
  revised_footnotes:
  - marker: a
    text: ‘밤새도록 길을 가서’는 히브리어가 나타내는 밤 내내 계속된 이동을 옮긴 것입니다.
    reason: source_note
  revision_rationale: 원문의 남성 군사 집단을 ‘용맹한 남자들’로 보존하고, 야베스에 도착했다는 서사적 진행을 자연스럽게 반영했습니다. ‘불태웠습니다’는 원문의 직접성을 유지하면서 현대 합쇼체에 맞춘 표현입니다. 목적어 대명사 ‘그것들을’을 보충하여 불태운 대상이 앞서 언급한 시체들임을 한국어에서 분명히 했습니다.
