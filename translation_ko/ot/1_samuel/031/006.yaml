base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/006.yaml
  text: So Saul died[a], and his three sons, and his armor-bearer, and all his men[b], together on that day.
  footnotes:
  - marker: a
    text: Or 'all his soldiers.' The Hebrew says 'all his men,' which in this battle context likely refers to Saul's fighting force or retainers rather than every person associated with him.
    reason: lexical_alternative
  - marker: b
    text: Some Greek witnesses read 'all his armor' instead of 'all his men.' The Hebrew text supports 'all his men.'
    reason: textual_variant
translation:
  language: ko
  text: 사울과 그의 세 아들과 그의 갑옷을 드는 사람과 그의 모든 사람들[a]이 그날 함께 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 모든 사람들’이지만, 전투 문맥상 그의 전투원이나 수행원을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: So ... died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 죽었습니다, 그래서
  - 그러고 나서 죽었습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스러운 한국어로 옮기되, 결과적 사건 전개는 문장 전체의 연결로 드러내었습니다.
- source_word: וְנֹשֵׂא כֵלָיו
  english_pob_choice: and his armor-bearer
  chosen_korean: 그의 갑옷을 드는 사람
  alternatives_korean:
  - 그의 무기를 드는 사람
  - 그의 무장 시종
  lexicon: HALOT
  rationale: 히브리어는 ‘그의 장비/무기를 드는 자’라는 뜻이므로, 군사적 맥락을 살리면서도 직역에 가까운 표현을 택했습니다.
- source_word: כָּל אֲנָשָׁיו
  english_pob_choice: all his men
  chosen_korean: 그의 모든 사람들
  alternatives_korean:
  - 그의 모든 군사들
  - 그의 모든 부하들
  lexicon: HALOT
  rationale: 본문은 사울과 함께 있던 전투 인력/수행원을 가리키므로, 과도하게 ‘군사들’로 좁히지 않고 문맥을 반영해 옮겼습니다.
- source_word: יַחְדָּו
  english_pob_choice: together
  chosen_korean: 함께
  alternatives_korean:
  - 동시에
  - 한꺼번에
  lexicon: HALOT
  rationale: 같은 날 같은 사건 안에서 함께 죽었다는 사실을 간결하게 전달하는 기본 의미를 유지했습니다.
