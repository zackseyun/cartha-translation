base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/013.yaml
  text: They took their bones and buried them under the tamarisk tree in Jabesh[b][a], and they fasted seven days.
  footnotes:
  - marker: a
    text: Or simply 'the tamarisk'; Hebrew names the species specifically.
    reason: lexical_alternative
  - marker: b
    text: Jabesh here abbreviates Jabesh-gilead from the preceding context.
    reason: cross_reference
translation:
  language: ko
  text: 그들은 그들의 뼈를 가져다가 야베스[b]에 있는 타마리스크 나무[a] 아래에 묻고, 이레 동안 금식했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘타마리스크’. 히브리어는 이 수종을 구체적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 ‘야베스’는 앞 문맥에 나오는 야베스 길르앗을 줄여 부른 것입니다.
    reason: cross_reference
lexical_decisions:
- source_word: עַצְמֹתֵיהֶם
  english_pob_choice: their bones
  chosen_korean: 그들의 뼈
  alternatives_korean:
  - 그들의 유해
  - 그들의 잔해
  lexicon: HALOT
  rationale: 히브리어 עֶצֶם은 문자 그대로 ‘뼈’이므로, 12절의 화장 이후에도 구체적이고 직접적인 표현을 유지하는 것이 원문에 가장 가깝습니다.
- source_word: תַחַת הָאֶשֶׁל
  english_pob_choice: under the tamarisk tree
  chosen_korean: 타마리스크 나무 아래에
  alternatives_korean:
  - 타마리스크 아래에
  - 소금삼나무 아래에
  lexicon: HALOT
  rationale: אֶשֶׁל을 ‘타마리스크’로 옮기고, 한국어에서 참조점을 분명히 하도록 ‘나무’를 덧붙였습니다. 이는 영어 POB의 풀이를 따르되 식물 종의 구체성을 살립니다.
- source_word: בְּיָבֵשָׁה
  english_pob_choice: in Jabesh
  chosen_korean: 야베스의
  alternatives_korean:
  - 야베스에서
  - 야베스 길르앗의
  lexicon: HALOT
  rationale: 문맥상 앞선 내용의 약칭인 장소명으로 이해되므로, 한국어에서는 자연스러운 속격 형태로 ‘야베스의’라고 옮겼습니다.
- source_word: וַיָּצֻמוּ
  english_pob_choice: and they fasted
  chosen_korean: 금식했습니다
  alternatives_korean:
  - 단식했습니다
  - 금식하며 지냈습니다
  lexicon: HALOT
  rationale: צום의 기본 의미는 ‘금식하다’이므로, 서술형으로 간결하게 옮겨 행위의 단순한 사실을 유지했습니다.
theological_decisions:
- issue: 장례 행위와 금식의 병렬 서술
  chosen_reading: 매장과 금식을 같은 서술 흐름으로 평이하게 유지했습니다.
  alternative_readings:
  - ‘그리고’로 연결된 의식적 애도 강조
  - 장례를 묵상적 표현으로 확장
  rationale: 원문은 사건을 과장하지 않고 사실적으로 나열하므로, 장례와 금식을 모두 담담한 서술로 처리하는 것이 적절합니다.
  doctrine_reference: 본문 서사
- issue: ‘뼈’의 직역 유지
  chosen_reading: ‘유해’로 완화하지 않고 ‘뼈’로 구체화했습니다.
  alternative_readings:
  - 유해
  - 잔해
  rationale: 이미 앞절에서 시신이 불살라졌기 때문에, 남은 부분을 구체적으로 가리키는 ‘뼈’가 본문 긴장을 가장 잘 드러냅니다.
  doctrine_reference: 본문 문맥
