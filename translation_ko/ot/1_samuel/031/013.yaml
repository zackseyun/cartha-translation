  source_fidelity: 원문의 순서와 핵심 어휘(‘그들의 뼈’, 매장, 타마리스크 아래, 야베스, 이레 금식)는 대체로 충실합니다. 다만 בְּיָבֵשָׁה는 장소를 나타내므로 ‘야베스의 타마리스크 나무’보다 ‘야베스에 있는 타마리스크 나무’가 장소 관계를 더 직접적이고 분명하게 드러냅니다.
  naturalness: ‘야베스에 있는 타마리스크 나무 아래에’는 현대 표준 한국어에서 자연스럽고, ‘묻고’는 히브리어의 연속 서술을 간결하게 살립니다. ‘이레 동안 금식했습니다’도 합쇼체 서술에 적절합니다.
