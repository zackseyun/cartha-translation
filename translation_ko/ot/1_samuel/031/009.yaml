  text: וַֽ/יִּכְרְתוּ֙ אֶת רֹאשׁ֔/וֹ וַ/יַּפְשִׁ֖יטוּ אֶת כֵּלָ֑י/ו וַ/יְשַׁלְּח֨וּ בְ/אֶֽרֶץ פְּלִשְׁתִּ֜ים סָבִ֗יב לְ/בַשֵּׂ֛ר בֵּ֥ית עֲצַבֵּי/הֶ֖ם וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/009.yaml
  text: They cut off his head and stripped off his armor[a], and sent messengers throughout the land of the Philistines all around[b], to proclaim the good news to the house of their idols and to the people.
  footnotes:
  - marker: a
    text: Or 'in the temple of their idols.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and to the people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그의 머리를 베고 그의 갑옷을 벗겨내었으며, 전령들을 보내 블레셋 사람들의 온 땅에 두루 다니게 하여, 그들의 우상들의 집과 백성에게 기쁜 소식을 전하게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 우상들의 집에서’.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그리고 백성에게’.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרְתוּ אֶת רֹאשׁוֹ
  english_pob_choice: They cut off his head
  chosen_korean: 그의 머리를 베고
  alternatives_korean:
  - 그의 머리를 잘라내고
  - 그의 머리를 끊어내고
  lexicon: HALOT
  rationale: רֹאשׁוֹ는 앞문맥의 사울을 가리키며, 동작은 단순한 절단이 아니라 머리를 잘라내는 처형·전리품 행위를 뜻하므로 ‘베고’가 자연스럽습니다.
- source_word: וַיַּפְשִׁיטוּ אֶת כֵּלָיו
  english_pob_choice: and stripped off his armor
  chosen_korean: 그의 갑옷을 벗겨내었으며
  alternatives_korean:
  - 그의 장비를 벗겼으며
  - 그의 무장을 벗겨내었으며
  lexicon: HALOT
  rationale: כֵּלִים는 넓게 ‘장비/도구’가 될 수 있지만, 전투 맥락에서는 갑옷을 벗겨 전리품으로 취하는 장면이 가장 분명하므로 그렇게 옮겼습니다.
- source_word: וַיְשַׁלְּחוּ בְאֶרֶץ פְּלִשְׁתִּים סָבִיב
  english_pob_choice: sent messengers throughout the land of the Philistines all around
  chosen_korean: 전령들을 보내 블레셋 사람들의 온 땅에 두루 다니게 하여
  alternatives_korean:
  - 사자들을 보내 블레셋 땅 사방에 퍼뜨리게 하여
  - 사람들을 보내 블레셋 지역을 두루 돌게 하여
  lexicon: HALOT
  rationale: שלח는 단순 ‘보내다’이지만, 뒤의 선포 목적상 ‘전령들’을 보충하는 영어 해석을 반영하되, סָבִיב는 ‘두루’로 넓은 순환·확산의 뜻을 살렸습니다.
- source_word: לְבַשֵּׂר בֵּית עֲצַבֵּיהֶם וְאֶת הָעָם
  english_pob_choice: to proclaim the good news to the house of their idols and to the people
  chosen_korean: 그들의 우상들의 집과 백성에게 기쁜 소식을 전하게 하였습니다
  alternatives_korean:
  - 그들의 우상들의 집과 백성에게 소식을 전하게 하였습니다
  - 그들의 우상 신전과 백성에게 기쁜 소식을 전하게 하였습니다
  lexicon: HALOT
  rationale: בֵּית עֲצַבֵּיהֶם은 직역하면 ‘그들의 우상들의 집’이며, לְבַשֵּׂר는 단순 통보보다 ‘좋은/기쁜 소식’을 전하다에 가깝기 때문에 영어 POB의 ‘good news’를 따라 보존했습니다.
theological_decisions:
- issue: 블레셋 선포의 성격
  chosen_reading: ‘기쁜 소식’은 블레셋의 승전 통보를 뜻하며, 본문이 그 내용을 도덕적으로 승인하는 것은 아닙니다.
  alternative_readings:
  - ‘소식’으로 완화하여 중립적으로 번역
  - ‘승전 소식’으로 설명적으로 번역
  rationale: בשר의 기본 뉘앙스가 ‘좋은 소식 전하다’이므로 본문 내부 관점에서는 블레셋 편의 기쁜 소식이지만, 문맥상 사울의 패망을 축하하는 이방의 선포일 뿐입니다.
  doctrine_reference: 원문 우선 번역 원칙; 서술 관점 보존
