  naturalness: ‘그들의 우상들의 집’은 소유 표현이 중첩되어 현대 표준 한국어에서 어색합니다. 또한 ‘보내 … 다니게 하여’는 원문의 단순한 ‘보내다’에 별도의 사역적 이동 표현을 더합니다. 간결한 연결로 고치는 것이 좋습니다.
