  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּדְבְּק֣וּ פְלִשְׁתִּ֔ים אֶת שָׁא֖וּל וְ/אֶת בָּנָ֑י/ו וַ/יַּכּ֣וּ פְלִשְׁתִּ֗ים אֶת יְהוֹנָתָ֧ן וְ/אֶת אֲבִינָדָ֛ב וְ/אֶת מַלְכִּי שׁ֖וּעַ בְּנֵ֥י שָׁאֽוּל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/002.yaml
  text: The Philistines overtook Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua[b], the sons of Saul.
  footnotes:
  - marker: a
    text: Or 'caught up with Saul and his sons' or 'pressed hard after Saul and his sons.' The Hebrew verb conveys close pursuit that reaches its target.
    reason: lexical_alternative
  - marker: b
    text: Or 'killed Jonathan, Abinadab, and Malchi-shua.' The Hebrew verb literally means 'struck,' but in this battle context it likely implies death.
    reason: lexical_alternative
translation:
  language: ko
  text: 블레셋 사람들이 사울과 그의 아들들을 따라잡았고, 블레셋 사람들이 요나단과 아비나답과 말기-수아를 쳐서 넘어뜨렸습니다. 이들은 사울의 아들들이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּדְבְּקוּ
  english_pob_choice: overtook
  chosen_korean: 따라잡았고
  alternatives_korean:
  - 바짝 뒤쫓았고
  - 급히 추격해 미쳤고
  - 붙잡았고
  lexicon: HALOT
  rationale: דבק는 전투 문맥에서 단순한 추종보다 ‘바짝 추격하여 따라잡음’의 뜻이므로, 자연스러운 현대 한국어로 ‘따라잡다’가 가장 가깝습니다.
- source_word: פְלִשְׁתִּים
  english_pob_choice: the Philistines
  chosen_korean: 블레셋 사람들
  alternatives_korean:
  - 블레셋인들
  - 블레셋
  lexicon: HALOT
  rationale: 민족명은 한국어 성경 관용에 따라 ‘블레셋 사람들’로 옮기되, 복수 주어의 전투 행위를 분명히 했습니다.
- source_word: וַיַּכּוּ
  english_pob_choice: struck down
  chosen_korean: 쳐서 넘어뜨렸습니다
  alternatives_korean:
  - 죽였습니다
  - 쳤습니다
  - 쳐서 쓰러뜨렸습니다
  lexicon: HALOT
  rationale: נכה는 문자적으로는 ‘치다’이지만 이 전투 맥락에서는 치명타를 뜻하므로, POB의 ‘struck down’ 취지를 살려 결과를 드러내는 표현을 택했습니다.
- source_word: בְּנֵי שָׁאוּל
  english_pob_choice: the sons of Saul
  chosen_korean: 사울의 아들들이었습니다
  alternatives_korean:
  - 사울의 아들이었습니다
  - 사울의 아들들이었습니다
  lexicon: HALOT
  rationale: 마지막 절은 세 사람의 신원을 설명하는 동격 표현이므로, ‘이들은 사울의 아들들이었습니다’로 관계를 분명히 했습니다.
