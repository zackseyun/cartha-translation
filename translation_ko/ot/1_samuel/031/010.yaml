source:
  edition: WLC
  text: וַ/יָּשִׂ֨מוּ֙ אֶת כֵּלָ֔י/ו בֵּ֖ית עַשְׁתָּר֑וֹת וְ/אֶת גְּוִיָּת/וֹ֙ תָּקְע֔וּ בְּ/חוֹמַ֖ת בֵּ֥ית שָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/010.yaml
  text: They put his armor in the house of the Ashtaroths[c][b][a], and they fastened his body to the wall of Beth-shan.
  footnotes:
  - marker: a
    text: Or 'his weapons' or more generally 'his equipment'; the Hebrew term can refer broadly to military gear.
    reason: lexical_alternative
  - marker: b
    text: Or 'the temple of Ashtaroth.' Literally, 'the house of Ashtaroth.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they impaled his body on the wall of Beth-shan.' The Hebrew verb can mean 'drive in' or 'fasten,' and the exact manner of display is not specified with precision.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그의 갑옷[a]을 아스다롯의 집[b]에 두고, 그의 시신을 벧산 성벽에 고정해 두었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 무기’ 혹은 더 넓게는 ‘그의 장비’. 히브리어는 군사 장비를 폭넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아스다롯의 신전’. 문자적으로는 ‘아스다롯의 집’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 시신을 벧산 성벽에 박아 두었습니다’. 히브리어 동사는 ‘밀어 넣다’나 ‘고정하다’의 뜻을 가질 수 있으며, 정확한 전시 방식은 분명하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּלָיו
  english_pob_choice: his armor
  chosen_korean: 그의 갑옷
  alternatives_korean:
  - 그의 무기
  - 그의 장비
  lexicon: HALOT
  rationale: כְּלִי는 문맥에 따라 무기나 장비를 넓게 가리킬 수 있지만, 전투에서 패한 왕의 무장을 다루는 이 문맥에서는 군사적 의미를 드러내는 '갑옷'이 가장 자연스럽고 응축된 표현입니다.
- source_word: בֵּית עַשְׁתָּרוֹת
  english_pob_choice: the house of Ashtaroth
  chosen_korean: 아스다롯의 집
  alternatives_korean:
  - 아스다롯의 신전
  - 아스다롯들의 집
  lexicon: HALOT
  rationale: בֵּית은 문자적으로 '집'이지만 제의적 맥락에서는 신전/성소를 가리킬 수 있습니다. 본문의 투명성을 살리기 위해 본문에는 직역형인 '아스다롯의 집'을 두었습니다.
- source_word: גְּוִיָּתוֹ
  english_pob_choice: his body
  chosen_korean: 그의 시신
  alternatives_korean:
  - 그의 몸
  - 그의 주검
  lexicon: HALOT
  rationale: 전투 사망 이후의 상태를 가리키므로 단순한 '몸'보다 죽은 몸을 분명히 하는 '시신'이 적절합니다.
- source_word: תָּקְעוּ
  english_pob_choice: they fastened
  chosen_korean: 고정시켰습니다
  alternatives_korean:
  - 박아 두었습니다
  - 꿰찼습니다
  - 매달았습니다
  lexicon: HALOT
  rationale: תקע는 '밀어 넣다, 박다, 고정하다'의 범위를 가지며, 정확한 방식은 본문이 세부적으로 말하지 않습니다. 그래서 과도하게 '못박다/창에 꿰다'를 특정하지 않고 결과를 드러내는 '고정시켰습니다'를 택했습니다.
- source_word: בְּחוֹמַת
  english_pob_choice: to the wall of
  chosen_korean: 벧산 성벽에
  alternatives_korean:
  - 벧산의 성벽에
  - 벧산의 담에
  lexicon: HALOT
  rationale: חוֹמָה는 성벽을 뜻하므로 한국어도 도시 방어 구조를 분명히 하는 '성벽'이 가장 직접적입니다.
theological_decisions:
- issue: 아스다롯의 집의 제의적 의미
  chosen_reading: 본문의 '집'은 단순 주택이 아니라 우상 숭배의 성소/신전을 가리키는 표현으로 이해하되, 본문에는 직역형을 유지했습니다.
  alternative_readings:
  - '''아스다롯의 신전'''
  - '''아스다롯들의 성소'''
  rationale: 원문 בֵּית은 문자적으로 '집'이며, 문맥상 제의 장소를 암시합니다. 그러나 본문 자체의 형태를 보존하는 편이 출처 투명성에 더 유익하므로 본문 번역은 직역형을 유지하고 의미는 주석 수준에서 확보합니다.
  doctrine_reference: 출처 투명성 및 제의적 맥락의 보존
