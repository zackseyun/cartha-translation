source:
  edition: WLC
  text: וַ/יִּרְא֣וּ אַנְשֵֽׁי יִ֠שְׂרָאֵל אֲשֶׁר בְּ/עֵ֨בֶר הָ/עֵ֜מֶק וַ/אֲשֶׁ֣ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן כִּֽי נָ֨סוּ֙ אַנְשֵׁ֣י יִשְׂרָאֵ֔ל וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ אֶת הֶֽ/עָרִים֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּֽשְׁב֖וּ בָּ/הֶֽן־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/007.yaml
  text: When the men of Israel who were on the other side of the valley[a], and those on the other side of the Jordan, saw that the men of Israel had fled and that Saul and his sons were dead, they abandoned the cities and fled[b]; and the Philistines came and lived in them.
  footnotes:
  - marker: a
    text: Or 'settled in them.' The Hebrew verb can denote dwelling or settling.
    reason: lexical_alternative
  - marker: b
    text: Or 'across the valley' / 'across the Jordan.' The Hebrew expression means 'on the far side of.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 사람들 가운데 골짜기 건너편에 있는 자들과 요단 건너편에 있는 자들이 이스라엘 사람들이 도망하고 사울과 그의 아들들이 죽은 것을 보았습니다. 그들은 도시들을 버리고 달아났고, 블레셋 사람들이 와서 그곳에 살게 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도시들에 정착하게 되었습니다.’ 히브리어 동사는 거주와 정착을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  english_pob_choice: the men of Israel
  chosen_korean: 이스라엘 사람들
  alternatives_korean:
  - 이스라엘의 남자들
  - 이스라엘의 사람들
  lexicon: WLC / HALOT
  rationale: 직역하면 ‘이스라엘의 남자들’이지만, 이 문맥에서는 전투와 거주지를 둘러싼 이스라엘 주민들을 가리키므로 한국어에서는 포괄적이고 자연스러운 ‘이스라엘 사람들’로 옮겼습니다.
- source_word: בְּעֵבֶר הָעֵמֶק
  english_pob_choice: on the other side of the valley
  chosen_korean: 골짜기 건너편에 있는
  alternatives_korean:
  - 골짜기 저편에 있는
  - 골짜기를 건너
  - 골짜기 맞은편에 있는
  lexicon: HALOT
  rationale: עֵבֶר는 ‘건너편/저편’의 공간적 관계를 나타내므로, 지형을 따라 읽히는 자연스러운 표현인 ‘골짜기 건너편’으로 옮겼습니다.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  english_pob_choice: on the other side of the Jordan
  chosen_korean: 요단 건너편에 있는
  alternatives_korean:
  - 요단 저편에 있는
  - 요단을 건너
  lexicon: HALOT
  rationale: 앞 절과 같은 공간 표현을 반복해, 지리적 대비를 유지하는 ‘요단 건너편’으로 번역했습니다.
- source_word: וַיַּעַזְבוּ אֶת־הֶעָרִים
  english_pob_choice: they abandoned the cities
  chosen_korean: 그들은 도시들을 버리고
  alternatives_korean:
  - 그들은 도시들을 떠나고
  - 그들은 성읍들을 버리고
  lexicon: HALOT
  rationale: עָזַב은 단순히 떠나다보다 ‘버리다/남겨두다’의 뉘앙스가 있어, 급박한 도주와 상실감을 살리는 ‘버리고’로 옮겼습니다.
- source_word: וַיֵּשְׁבוּ בָּהֶן
  english_pob_choice: and lived in them
  chosen_korean: 그곳에 살게 되었습니다
  alternatives_korean:
  - 그 안에 살았습니다
  - 그곳에 정착했습니다
  - 그 안에 거주했습니다
  lexicon: HALOT
  rationale: יָשַׁב은 ‘살다/거주하다/정착하다’를 모두 포함할 수 있어, 점유의 결과를 드러내면서도 과도하게 해석하지 않는 ‘살게 되었습니다’를 선택했습니다.
theological_decisions:
- issue: 사울과 그의 아들들의 죽음 뒤에 나타나는 땅의 점유
  chosen_reading: 본문은 단순한 군사적 후퇴와 도시 점유를 묘사하며, 곧바로 여호와의 심판 해석을 덧붙이지 않습니다.
  alternative_readings:
  - 암시적으로 하나님의 심판으로 읽기
  - 단순한 전술적 사건으로만 축소하기
  rationale: 히브리어 본문 자체는 관찰된 사실의 연쇄를 서술하므로, 해석을 본문 밖으로 과도하게 확장하지 않고 서술 수준을 유지했습니다.
  doctrine_reference: 서술 본문 해석 원칙
