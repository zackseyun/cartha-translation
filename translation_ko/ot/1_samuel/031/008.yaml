base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/008.yaml
  text: The next day[a], the Philistines came to strip the slain, and they found Saul and his three sons fallen on Mount Gilboa.
  footnotes:
  - marker: a
    text: Or 'to strip the dead' or 'to despoil the slain.' The Hebrew verb refers to removing clothing or armor from battle casualties.
    reason: lexical_alternative
translation:
  language: ko
  text: 이튿날[a] 블레셋 사람들이 전사자들을 벗기러 왔는데, 사울과 그의 세 아들이 길보아 산에 쓰러져 있는 것을 발견했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽은 이들의 옷과 무기를 벗기러’라는 뜻입니다. 여기서 히브리어 동사는 전사자의 의복이나 갑옷을 제거하는 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  english_pob_choice: The next day
  chosen_korean: 이튿날
  alternatives_korean:
  - 그다음 날
  - 다음 날
  - 이튿날에
  lexicon: HALOT
  rationale: 전투 직후의 다음 시점을 나타내는 관용구이므로, 현대 한국어에서 자연스럽고 간결한 ‘이튿날’로 옮겼습니다.
- source_word: לְפַשֵּׁט
  english_pob_choice: to strip
  chosen_korean: 벗기러 왔는데
  alternatives_korean:
  - 벗기러 왔습니다
  - 탈취하려고 왔는데
  - 약탈하러 왔는데
  lexicon: HALOT
  rationale: 문맥상 시체에서 옷이나 갑옷을 벗기는 뜻이 핵심이므로, 동작을 직접 드러내는 ‘벗기러’로 옮기고, 목적을 보완하는 표현은 본문에 과도하게 넣지 않았습니다.
- source_word: הַחֲלָלִים
  english_pob_choice: the slain
  chosen_korean: 죽은 자들
  alternatives_korean:
  - 전사자들
  - 쓰러진 자들
  - 죽임당한 사람들
  lexicon: HALOT
  rationale: 전투에서 죽임당한 사람들을 가리키며, 한국어에서는 ‘죽은 자들’이 가장 직접적이지만, 후속 동사 ‘벗기다’와 함께 읽힐 때 의미가 분명하므로 본문에는 자연스럽게 처리했습니다.
- source_word: נֹפְלִים
  english_pob_choice: fallen
  chosen_korean: 쓰러져 있는
  alternatives_korean:
  - 쓰러진
  - 엎드러져 있는
  - 넘어져 있는
  lexicon: HALOT
  rationale: 전투 맥락의 ‘fallen’은 단순한 사망 사실보다 패전으로 쓰러진 상태를 살리므로, 현재형 상태를 보이는 ‘쓰러져 있는’으로 옮겼습니다.
- source_word: בְּהַר הַגִּלְבֹּעַ
  english_pob_choice: on Mount Gilboa
  chosen_korean: 길보아 산에
  alternatives_korean:
  - 길보아 산에서
  - 길보아산에
  - 길보아 산 위에
  lexicon: HALOT
  rationale: 지명 구문을 표준적인 한국어 지리 표현으로 맞추어 ‘~에’로 처리했습니다.
