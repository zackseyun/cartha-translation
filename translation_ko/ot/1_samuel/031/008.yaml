    rationale: 히브리어는 전사자들을 벗기러 왔다고만 말합니다. 약탈의 결과나 성격은 암시될 수 있으나, ‘전리품을 노리고’라는 명시적 동기 표현은 원문보다 해석을 확장합니다.
  - severity: medium
    issue: 각주에 한국어 문맥과 맞지 않는 ‘כאן’이 들어 있습니다.
    rationale: 구조적 오류는 아니지만 독해를 방해하는 삽입 오류이므로 ‘여기서’로 바로잡아야 합니다.
