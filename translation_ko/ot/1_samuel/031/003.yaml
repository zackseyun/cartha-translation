translation:
  language: ko
  text: 전투가 사울에게 거세졌고, 궁수들이 그를 찾아냈으며,[b] 그는 궁수들로 인해 크게 다쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 궁수들 때문에 큰 고통이나 괴로움을 겪었습니다.’ 히브리어 동사는 난해하며, 심한 통증, 떨림, 또는 괴로움을 뜻할 수 있어 명시적인 신체적 부상만을 가리키지 않을 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘활을 든 사람들인 쏘는 자들’입니다. 히브리어는 동격 표현으로 궁수들을 설명합니다.
    reason: previous_rendering
