  yaml_path: translation/ot/1_samuel/031/003.yaml
  text: And the battle grew heavy against Saul[a], and the archers found him[b], and he was greatly wounded by the archers.
  footnotes:
  - marker: a
    text: Or 'he was in great anguish/distress because of the archers.' The Hebrew verb here is difficult and may denote severe pain, trembling, or anguish rather than explicit physical wounding.
    reason: lexical_alternative
  - marker: b
    text: Or 'the archers found him, men with the bow,'.
    reason: previous_rendering
translation:
  language: ko
  text: 전투가 사울에게 거세졌고, 활 쏘는 자들이 그를 찾아냈으며, 그는 활 쏘는 자들 때문에 크게 상했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 활 쏘는 자들 때문에 큰 고통/괴로움에 빠졌습니다.’ 히브리어 동사는 난해하며, 심한 통증·떨림·고통을 뜻할 수 있어 명시적 부상보다 정서적/신체적 압박을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘활 쏘는 자들, 곧 활을 든 사람들’입니다. 히브리어는 앱osition으로 설명을 덧붙입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַתִּכְבַּד הַמִּלְחָמָה אֶל שָׁאול
  english_pob_choice: And the battle grew heavy against Saul
  chosen_korean: 전투가 사울에게 거세졌고
  alternatives_korean:
  - 전투가 사울을 심하게 압박했고
  - 전투가 사울에게 무거워졌고
  lexicon: HALOT
  rationale: ‘무거워지다’의 직역 이미지는 살리되, 전투 상황에서는 한국어에서 ‘거세지다/거세졌다’가 압박의 강도를 자연스럽게 드러냅니다.
- source_word: הַמּוֹרִים אֲנָשִׁים בַּקָּשֶׁת
  english_pob_choice: the archers
  chosen_korean: 활 쏘는 자들
  alternatives_korean:
  - 활잡이들
  - 궁수들
  lexicon: HALOT
  rationale: 히브리어는 ‘쏘는 자들’과 ‘활을 든 사람들’의 병렬로 활쏘는 자들을 풀어 설명하므로, 한국어에서는 의미를 한 번에 드러내는 표현이 적절합니다.
- source_word: וַיָּחֶל מְאֹד מֵהַמּוֹרִים
  english_pob_choice: and he was greatly wounded by the archers
  chosen_korean: 그는 활 쏘는 자들 때문에 크게 상했습니다
  alternatives_korean:
  - 그는 활 쏘는 자들 때문에 크게 고통받았습니다
  - 그는 활 쏘는 자들에게서 크게 상처를 입었습니다
  lexicon: HALOT
  rationale: וַיָּחֶל의 뜻이 ‘상하다/고통받다/괴로워하다’ 사이에서 어렵기 때문에, 본문과 문맥을 따라 물리적 상처와 극심한 손상을 모두 포괄할 수 있는 ‘크게 상했습니다’를 택했습니다.
theological_decisions:
- issue: וַיָּחֶל의 해석 범위
  chosen_reading: 물리적 부상으로만 단정하지 않고, 전투 중 받은 치명적 손상으로 넓게 읽히게 했습니다.
  alternative_readings:
  - 크게 고통받았습니다
  - 크게 괴로워했습니다
  - 큰 충격을 받았습니다
  rationale: 히브리어 동사는 난해하며, 영어 POB도 명시적 ‘wounded’와 ‘anguish/distress’ 가능성을 모두 남깁니다. 한국어도 같은 긴장을 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 본문 비평/어휘 해석
- issue: 전치사 מֵ־의 처리
  chosen_reading: ‘활 쏘는 자들 때문에’로 원인/가해 주체를 자연스럽게 드러냈습니다.
  alternative_readings:
  - 활 쏘는 자들로부터
  - 활 쏘는 자들에게서
  rationale: 전투 서술에서 한국어는 원인 표지가 가장 자연스럽고, 사울의 상태가 활 쏘는 자들에 의해 발생했음을 분명히 합니다.
  doctrine_reference: 서술 문법
