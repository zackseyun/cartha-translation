    rationale: '''이스라엘 사람들''은 자연스럽지만 원문의 ''이스라엘의 남자들''이라는 남성 복수 표지를 없앱니다. 안전한 범위에서 이를 본문에 보존했습니다.'
  revised_text: 블레셋 사람들이 이스라엘과 싸우고 있었고, 이스라엘의 남자들은 블레셋 사람들을 피해 달아났으며, 길보아 산에서 쓰러져 죽었습니다.[a]
