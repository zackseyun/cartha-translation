translation:
  language: ko
  text: 블레셋 사람들이 이스라엘과 싸우고 있었고, 이스라엘의 남자들은 블레셋 사람들을 피해 달아났으며, 길보아 산에서 쓰러져 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, '블레셋 사람들 앞에서'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים נִלְחָמִים בְּ/יִשְׂרָאֵל
  english_pob_choice: Now the Philistines were fighting against Israel
  chosen_korean: 이제 블레셋 사람들이 이스라엘과 싸우고 있었고
  alternatives_korean:
  - 그리고 블레셋 사람들이 이스라엘과 싸우고 있었고
  - 이제 블레셋 사람들이 이스라엘을 치고 있었고
  lexicon: HALOT
  rationale: 진행 중인 배경 동작을 나타내는 분사형을 한국어 진행형으로 옮겼고, בְּ + לחם의 적대 관계를 자연스럽게 '과/와 싸우다'로 반영했습니다.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  english_pob_choice: the men of Israel
  chosen_korean: 이스라엘 사람들은
  alternatives_korean:
  - 이스라엘의 남자들은
  - 이스라엘 용사들은
  lexicon: HALOT
  rationale: 직역하면 '이스라엘의 남자들'이지만, 전투 장면에서 전체 집단의 도주를 가리키므로 한국어에서는 문맥상 자연한 '이스라엘 사람들'로 옮겼습니다.
- source_word: מִ/פְּנֵי פְלִשְׁתִּים
  english_pob_choice: from before the Philistines
  chosen_korean: 블레셋 사람들 앞에서
  alternatives_korean:
  - 블레셋 사람들 앞을 피해
  - 블레셋 사람들의 면전에서
  lexicon: HALOT
  rationale: 직역의 'from before'는 '앞에서'로 풀어야 한국어에서 도주 상황이 분명해집니다. 전치사적 뉘앙스는 유지하되 지나치게 경직된 표현은 피했습니다.
- source_word: וַ/יִּפְּל֥וּ חֲלָלִ֖ים
  english_pob_choice: fell slain
  chosen_korean: 쓰러져 죽었습니다
  alternatives_korean:
  - 죽임을 당해 쓰러졌습니다
  - 전사했습니다
  lexicon: HALOT
  rationale: חֲלָלִים은 전장에서 '죽은 자들/주검들'이 된 상태를 가리키므로, '전사했습니다'보다 결과를 더 직접적으로 드러내는 '쓰러져 죽었습니다'를 택했습니다.
- source_word: בְּ/הַ֥ר הַ/גִּלְבֹּעַ
  english_pob_choice: on Mount Gilboa
  chosen_korean: 길보아 산에서
  alternatives_korean:
  - 길보아 산 위에서
  - 길보아의 산에서
  lexicon: HALOT
  rationale: 지명 앞의 הַר는 한국어에서 통상 '산'으로 옮기며, 장소 전치사는 한국어 자연어법에 따라 '에서'로 처리했습니다.
theological_decisions:
- issue: 전투 본문에서 האנשים(אַנְשֵׁי)의 성별 표지와 집단 지칭을 어떻게 처리할지
  chosen_reading: 문맥상 전체 이스라엘 진영을 가리키는 집단명으로 읽되, 한국어에서는 성별을 과도하게 드러내지 않는 '이스라엘 사람들'로 번역했습니다.
  alternative_readings:
  - '''이스라엘의 남자들''로 더 문자적으로 옮김'
  - '''이스라엘 용사들''로 군사적 의미를 강화'
  rationale: 히브리어는 문자적으로 남성 명사를 쓰지만, 이 구절의 기능은 전군의 패주를 서술하는 것이어서 한국어에서 불필요한 성별 강조보다 서술의 명료성이 우선됩니다.
  doctrine_reference: translation_principle_gender_accuracy
- issue: חֲלָלִים의 결과 상태를 '전사하다'로 완화할지 '쓰러져 죽다'로 직역할지
  chosen_reading: 전투의 직접적 결과를 살리기 위해 '쓰러져 죽었습니다'로 옮겼습니다.
  alternative_readings:
  - '''전사했습니다'''
  - '''죽었습니다'''
  rationale: 히브리어 표현은 단순 사망보다 전투에서 쓰러져 죽은 상태를 강하게 암시하므로, 전쟁 서사의 충격을 보존하는 쪽이 원문의 힘에 더 가깝습니다.
  doctrine_reference: source_immediacy
