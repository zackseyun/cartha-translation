  yaml_path: translation/ot/1_samuel/031/005.yaml
  text: When his armor-bearer saw that Saul was dead[a], he too fell on his sword and died with him.
  footnotes:
  - marker: a
    text: Or 'had died' for 'was dead.' The Hebrew permits either a stative description or a completed event viewed as the basis for the armor-bearer's action.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울의 무기를 맡은 자가 사울이 죽은 것을[a] 보고, 그도 자기 칼 위에 쓰러져 그와 함께 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사울이 이미 죽었다는 것을’. 히브리어는 사울이 죽어 있는 상태를 가리킬 수도 있고, 이미 일어난 죽음을 그가 본 행동의 배경으로 나타낼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  english_pob_choice: his armor-bearer
  chosen_korean: 그의 무기 든 자
  alternatives_korean:
  - 그의 갑옷받이
  - 그의 병기 담당자
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그의 장비/무기를 나르는 자’이므로, 군사적 직무를 드러내되 현대 한국어에서 자연스러운 표현으로 옮겼습니다. ‘무기 든 자’는 역할을 직역에 가깝게 보존합니다.
- source_word: כִּי מֵת שָׁאוּל
  english_pob_choice: that Saul was dead
  chosen_korean: 사울이 죽은 것을
  alternatives_korean:
  - 사울이 죽었다는 것을
  - 사울이 이미 죽어 있는 것을
  lexicon: HALOT
  rationale: כִּי는 여기서 보았다의 내용절을 이끄므로 ‘~것을’로 처리했습니다. מֵת은 상태를 나타낼 수 있어 ‘죽은 것’/‘죽었다는 것’보다 서술적이고 직접적으로 옮겼습니다.
- source_word: עַל חַרְבּוֹ
  english_pob_choice: on his sword
  chosen_korean: 자기 칼 위에
  alternatives_korean:
  - 자기 칼에
  - 자기 칼 위로
  lexicon: HALOT
  rationale: 히브리어 전치사 עַל의 공간적 이미지를 살려 ‘위에’로 옮기되, 한국어에서도 자해의 장면이 분명히 드러나도록 했습니다. 관용구를 과도하게 풀지 않고 서술의 직접성을 유지합니다.
- source_word: וַיָּמָת עִמּוֹ
  english_pob_choice: and died with him
  chosen_korean: 그와 함께 죽었습니다
  alternatives_korean:
  - 그와 더불어 죽었습니다
  - 그와 함께 생을 마쳤습니다
  lexicon: HALOT
  rationale: עִם은 동반을 뜻하므로 ‘함께’가 가장 პირდაპირ합니다. ‘생을 마쳤습니다’는 완곡하여 원문의 급박한 죽음 서술을 약화시킬 수 있어 배제했습니다.
theological_decisions:
- issue: 자살 장면의 서술 방식
  chosen_reading: 평가를 덧붙이지 않고 사건을 있는 그대로 서술했습니다.
  alternative_readings:
  - 그가 절망하여 죽었습니다
  - 그가 스스로 목숨을 끊었습니다
  rationale: 본문은 행동의 사실을 기록할 뿐 동기나 도덕적 해설을 직접 제공하지 않으므로, 원문의 서술 수준을 유지하는 것이 적절합니다.
  doctrine_reference: 서술 본문의 해석 절제 원칙
