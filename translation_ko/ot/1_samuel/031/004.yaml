    issue: ‘그의 갑옷을 멘 사람’
    rationale: 갑옷을 입은 사람 또는 갑옷을 메고 있는 사람처럼 들리며, 왕의 장비를 드는 보좌인이라는 נֹשֵׂא כֵלָיו의 뜻을 정확히 전달하지 못합니다.
  - severity: medium
    issue: ‘나를 능욕하지 못하게’
    rationale: וְהִתְעַלְּלוּ בִי는 모욕적이고 가혹한 처우를 가리키나 그 형태를 특정하지 않습니다. ‘능욕하다’는 한국어에서 성적 또는 특정한 극심한 모욕의 함의를 강하게 띨 수 있어 범위를 불필요하게 좁힙니다.
