  text: וַ/יֹּ֣אמֶר שָׁאוּל֩ לְ/נֹשֵׂ֨א כֵלָ֜י/ו שְׁלֹ֥ף חַרְבְּ/ךָ֣ וְ/דָקְרֵ֣/נִי בָ֗/הּ פֶּן יָ֠בוֹאוּ הָ/עֲרֵלִ֨ים הָ/אֵ֤לֶּה וּ/דְקָרֻ֨/נִי֙ וְ/הִתְעַלְּלוּ בִ֔/י וְ/לֹ֤א אָבָה֙ נֹשֵׂ֣א כֵלָ֔י/ו כִּ֥י יָרֵ֖א מְאֹ֑ד וַ/יִּקַּ֤ח שָׁאוּל֙ אֶת הַ/חֶ֔רֶב וַ/יִּפֹּ֖ל עָלֶֽי/הָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and thrust me through and mistreat me.” But his armor-bearer was not willing, because he was very afraid. So Saul took the sword and fell on it.
  footnotes:
  - marker: a
    text: Or 'make sport of me,' 'mistreat me,' or 'deal shamefully with me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울이 그의 무기 담당자에게 말했습니다. “네 칼을 뽑아 그 칼로 나를 찔러라. 이 할례받지 않은 자들이 와서 나를 찌르고 나를 함부로 대하지 못하게 하라.[a]” 그러나 그의 무기 담당자는 매우 두려워서 그렇게 하려 하지 않았습니다. 그래서 사울은 그 칼을 들고 그 칼 위에 쓰러졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 조롱하다’, ‘나를 학대하다’, ‘나를 수치스럽게 다루다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  english_pob_choice: his armor-bearer
  chosen_korean: 그의 갑옷을 멘 사람
  alternatives_korean:
  - 그의 무기 حامل
  - 그의 무기 든 사람
  - 그의 무기병
  lexicon: HALOT
  rationale: 히브리어 관용구는 전사의 장비를 들고 따르는 군사 보좌인을 가리키므로, 기능을 드러내되 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: וְדָקְרֵנִי / וּדְקָרֻנִי
  english_pob_choice: thrust me through / thrust me through
  chosen_korean: 나를 찌르다
  alternatives_korean:
  - 나를 꿰뚫다
  - 나를 창으로 찌르다
  - 나를 관통하다
  lexicon: HALOT
  rationale: 같은 동사 반복을 유지해야 하므로 두 곳 모두 동일하게 ‘찌르다’로 옮겨 사울의 절박한 요청과 반복 효과를 살렸습니다.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  english_pob_choice: these uncircumcised men
  chosen_korean: 이 할례받지 않은 자들
  alternatives_korean:
  - 이 할례받지 않은 사람들
  - 이 할례 없는 자들
  - 이 블레셋 사람들
  lexicon: HALOT
  rationale: 문자적으로는 ‘할례받지 않은 자들’이며, 경멸적 언약 표지를 보존하기 위해 민족명으로 풀지 않았습니다.
- source_word: וְהִתְעַלְּלוּ בִי
  english_pob_choice: and mistreat me
  chosen_korean: 나를 능욕하다
  alternatives_korean:
  - 나를 학대하다
  - 나를 조롱하다
  - 나를 함부로 다루다
  lexicon: HALOT
  rationale: POB의 audit trail이 이 동사의 폭넓고 수치스러운 폭행 가능성을 보존하려는 점을 반영하되, 한국어에서는 ‘능욕하다’가 그 모욕성과 가학적 뉘앙스를 압축해 전달합니다.
- source_word: וַיִּפֹּל עָלֶיהָ
  english_pob_choice: and fell on it
  chosen_korean: 그것에 몸을 던졌습니다
  alternatives_korean:
  - 그 위에 쓰러졌습니다
  - 그 위에 넘어졌습니다
  - 그 위에 엎드렸습니다
  lexicon: HALOT
  rationale: 자살의 관용적 표현을 한국어로 자연스럽게 전달하되, 칼 위로 ‘fell on it’의 치명적 행동을 분명히 드러냈습니다.
theological_decisions:
- issue: 사울이 두려워한 ‘해코지/능욕’의 구체성
  chosen_reading: וְהִתְעַלְּלוּ בִי를 ‘나를 능욕하다’로 옮겨, 구체적 행위는 특정하지 않고 수치스러운 폭행과 모욕의 폭을 남겼습니다.
  alternative_readings:
  - 나를 조롱하다
  - 나를 학대하다
  - 나를 함부로 다루다
  rationale: 본문은 적대자들이 사울에게 어떤 식으로 못되게 굴지 말하지만, 정확한 형태를 규정하지 않습니다. 그래서 더 좁은 해석으로 밀어붙이지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
