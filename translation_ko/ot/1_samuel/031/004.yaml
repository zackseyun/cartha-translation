- from: 그때 사울이 그의 갑옷을 멘 사람에게 말했습니다. “네 칼을 뽑아 나를 찔러라. 이 할례받지 않은 자들이 와서 나를 찌르고 나를 능욕하지 못하게 하라.” 그러나 그의 갑옷을 멘 사람은 매우 두려워하여 그러기를 원하지 않았습니다. 그래서 사울은 칼을 취해 그것에 몸을 던졌습니다.[a]
  to: 그때 사울이 그의 무기 담당자에게 말했습니다. “네 칼을 뽑아 그 칼로 나를 찔러라. 이 할례받지 않은 자들이 와서 나를 찌르고 나를 함부로 대하지 못하게 하라.[a]” 그러나 그의 무기 담당자는 매우 두려워서 그렇게 하려 하지 않았습니다. 그래서 사울은 그 칼을 들고 그 칼 위에 쓰러졌습니다.
  rationale: 무기 보좌인을 가리키는 히브리어 관용구를 현대 한국어의 ‘무기 담당자’로 바로잡았습니다. 적대자들이 사울을 대할 방식은 원문이 구체화하지 않으므로 ‘함부로 대하다’로 넓게 보존하고, 관련 각주를 해당 어구에 붙였습니다. 마지막 동작은 원문의 ‘칼 위에 쓰러지다’를 유지하여 해설적 확장을 피했습니다.
