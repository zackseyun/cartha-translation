  yaml_path: translation/ot/1_samuel/008/001.yaml
  text: When Samuel grew old[a], he appointed his sons as judges over Israel.
  footnotes:
  - marker: a
    text: Or 'made his sons judges for Israel.' The Hebrew verb is literally 'set,' and the preposition before 'Israel' can be understood as 'for' or 'over' depending on how the appointment is construed.
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘이 나이가 들자, 그는 자기 아들들을 이스라엘의 재판관으로 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 자기 아들들을 이스라엘을 위해 재판관으로 세웠습니다.’ 히브리어 동사는 문자적으로 ‘두다/세우다’이며, ‘이스라엘’ 앞의 전치사는 문맥에 따라 이스라엘에 대한 권위·관할을 나타내거나 ‘이스라엘을 위해’라는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר זָקֵן
  english_pob_choice: When Samuel grew old
  chosen_korean: 사무엘이 늙자
  alternatives_korean:
  - 사무엘이 나이가 들자
  - 사무엘이 늙었을 때
  lexicon: HALOT
  rationale: 동작의 진행을 나타내는 روایت 문맥에 맞게 ‘늙자’로 옮겨, 상태 진술보다 변화의 국면을 살렸습니다.
- source_word: וַיָּשֶׂם
  english_pob_choice: appointed
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 임명했습니다
  - 지정했습니다
  - 만들었습니다
  lexicon: HALOT
  rationale: 히브리어 기본값은 ‘두다/놓다’이지만, 여기서는 직분 부여의 행위이므로 너무 제도적인 ‘임명하다’보다 본문 이미지가 살아 있는 ‘세우다’를 택했습니다.
- source_word: שֹׁפְטִים
  english_pob_choice: judges
  chosen_korean: 재판관으로
  alternatives_korean:
  - 판사로
  - 판관으로
  - 재판장으로
  lexicon: HALOT
  rationale: 사무엘서의 שֹׁפְטִים는 단순 법정 판사보다 통치·판결 기능을 함께 가진 공적 역할이므로, 현대 한국어에서 가장 무난한 ‘재판관’이 의미를 잘 살립니다.
- source_word: לְיִשְׂרָאֵל
  english_pob_choice: over Israel
  chosen_korean: 이스라엘의
  alternatives_korean:
  - 이스라엘을 위해
  - 이스라엘 위에
  - 이스라엘을 다스리도록
  lexicon: HALOT
  rationale: 전치사 לְ의 기능이 여기서는 관할/적용 범위를 나타내므로, 한국어에서는 소유격처럼 자연스럽게 들리는 ‘이스라엘의’로 처리하되 통치 대상의 범위를 유지했습니다.
theological_decisions:
- issue: שֹׁפְטִים의 직분 성격
  chosen_reading: 아들들이 단순한 민사 담당자가 아니라 이스라엘 위에서 공적 판결과 통치를 맡는 직분자로 제시됩니다.
  alternative_readings:
  - 아들들을 법률 상담자처럼 이해할 수 있음
  - 단지 가족 내 분쟁 조정 정도로 축소할 수 있음
  rationale: 사무엘기의 שֹׁפְטִים는 개인적 조언자보다 공동체적 재판·통치 기능을 가진 인물들이므로, 본문이 암시하는 공적 권위를 유지했습니다.
  doctrine_reference: 사무엘상 8장 문맥의 이스라엘 지도권/사법권
