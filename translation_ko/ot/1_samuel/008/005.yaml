  naturalness: ‘우리를 다스릴 왕을 세워 주십시오’가 ‘왕을 세워 우리를 다스리게 하십시오’보다 현대 표준 한국어에서 더 자연스럽고 직접적으로 요청의 구조를 나타냅니다. ‘당신의 길을 따르지 않았습니다’도 ‘길로 걷지 않았습니다’보다 자연스럽습니다.
