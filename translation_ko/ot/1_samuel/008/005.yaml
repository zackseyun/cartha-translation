  - 우리를 판단하게 하십시오
  - 우리를 심판하게 하십시오
  - 우리를 재판하게 하십시오
  lexicon: HALOT
  rationale: 이 문맥의 שׁפט는 단순 재판이 아니라 통치 기능까지 포함하므로, 본문 의미를 드러내는 방향으로 '다스리다'를 채택했습니다.
theological_decisions:
- issue: 왕 요청의 정치적 의미를 어떻게 드러낼지
  chosen_reading: 다스리게 하십시오
  alternative_readings:
  - 재판하게 하십시오
  - 통치하게 하십시오
  rationale: 이스라엘이 다른 민족들처럼 왕정 체제를 요구하는 장면이므로, משפט의 통치적 범위를 한국어 본문에 분명히 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §6
