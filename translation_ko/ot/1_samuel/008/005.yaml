base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/005.yaml
  text: They said to him[a], “Look, you have grown old, and your sons have not walked in your ways. Now appoint for us a king to judge us, like all the nations.”
  footnotes:
  - marker: a
    text: Or “to govern us” or “to rule us”; the Hebrew verb 'judge' can include broader governing authority in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 말했습니다. 「보십시오, 당신은 늙었고 당신의 아들들은 당신의 길로 걷지 않았습니다. 이제 우리를 위하여 왕을 세워 우리를 다스리게 하십시오. 다른 모든 민족들처럼 말입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다스리게 하십시오’는 히브리어 שׁפט가 이 문맥에서 재판뿐 아니라 통치까지 포함할 수 있음을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  english_pob_choice: They said to him
  chosen_korean: 그들이 그에게 말했습니다
  alternatives_korean:
  - 그들이 그에게 이르렀습니다
  - 그들이 그에게 말하였습니다
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 살리면서도 원문의 단순한 발화 동사를 그대로 반영했습니다.
- source_word: הִנֵּה
