  - 여기 보십시오
  lexicon: HALOT
  rationale: 대면하는 주의를 끄는 담화 표지로서 현대 한국어의 정중한 명령형을 택해 원문의 즉각성을 살렸습니다.
- source_word: זָקַנְתָּ
  english_pob_choice: you have grown old
  chosen_korean: 당신은 늙었고
  alternatives_korean:
  - 당신은 늙었습니다
  - 당신은 나이가 많으시고
  lexicon: HALOT
  rationale: 완료형이 나타내는 현재 상태를 반영하되, 문맥상 이어지는 불만의 진술로 자연스럽게 연결했습니다.
- source_word: לְשָׁפְטֵנוּ
  english_pob_choice: to judge us
  chosen_korean: 우리를 다스리게 하십시오
