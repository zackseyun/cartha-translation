- from: 그들이 그에게 말했습니다. 「보십시오, 당신은 늙었고 당신의 아들들은 당신의 길로 걷지 않았습니다. 이제 우리를 위하여 왕을 세워 우리를 다스리게 하십시오. 다른 모든 민족들처럼 말입니다.」[a]
  to: 그들이 그에게 말했습니다. “보십시오, 당신은 늙으셨고, 당신의 아들들은 당신의 길을 따르지 않았습니다. 이제 모든 민족들처럼 우리를 다스릴 왕을 세워 주십시오.[a]”
  rationale: 원문에 없는 ‘다른’을 삭제하여 כְּכָל הַגּוֹיִם의 포괄적 비교를 보존했습니다. ‘우리를 다스릴 왕’을 사용하여 לְשָׁפְטֵנוּ의 정치·통치적 문맥을 자연스럽게 반영하되, 각주에서 재판적 의미와 넓은 통치적 의미를 함께 제시했습니다. 높임 표현 ‘늙으셨고’는 현대 한국어에서 연장자인 사무엘에게 직접 말하는 장면의 자연스러운 공손성을 반영하며, 원문의 의미를 바꾸지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:16:19Z'
