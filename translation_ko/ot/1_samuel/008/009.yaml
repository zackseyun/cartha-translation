source:
  edition: WLC
  text: וְ/עַתָּ֖ה שְׁמַ֣ע בְּ/קוֹלָ֑/ם אַ֗ךְ כִּֽי הָעֵ֤ד תָּעִיד֙ בָּ/הֶ֔ם וְ/הִגַּדְתָּ֣ לָ/הֶ֔ם מִשְׁפַּ֣ט הַ/מֶּ֔לֶךְ אֲשֶׁ֥ר יִמְלֹ֖ךְ עֲלֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/009.yaml
  text: So now[a], listen to their voice; only, you must solemnly warn them and tell them the justice of the king who will reign over them.
  footnotes:
  - marker: a
    text: Or 'the manner of the king'; the Hebrew מִשְׁפַּט can also mean 'legal right' or 'customary practice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 그들의 말을 들으십시오. 다만 그들에게 엄히 경고하고, 그들을 다스릴 왕의 제도를 그들에게 알려 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕의 방식’이라 할 수 있습니다. 히브리어 מִשְׁפַּט은 ‘법적 권리’나 ‘관습적 관행’의 뜻도 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע בְּקוֹלָם
  english_pob_choice: listen to their voice
  chosen_korean: 그들의 말을 들으십시오
  alternatives_korean:
  - 그들의 음성을 들으십시오
  - 그들에게 귀를 기울이십시오
  - 그들의 소리에 순종하십시오
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 청취보다 그들의 요구를 받아들이는 뉘앙스를 갖지만, 한국어에서는 자연스럽게 ‘말을 들으십시오’로 옮겨 그 요청을 수용하라는 뜻을 살렸습니다.
- source_word: הָעֵד תָּעִיד
  english_pob_choice: you must solemnly warn
  chosen_korean: 엄히 경고하고
  alternatives_korean:
  - 간곡히 경고하고
  - 반드시 경고하고
  - 엄숙히 경고하고
  lexicon: HALOT
  rationale: 히브리어의 강조형은 단순 경고보다 강한 경고를 요구하므로, 법정적·예언적 긴장을 살리는 ‘엄히 경고하고’로 옮겼습니다.
- source_word: מִשְׁפַּט הַמֶּלֶךְ
  english_pob_choice: the justice of the king
  chosen_korean: 왕의 제도
  alternatives_korean:
  - 왕의 정의
  - 왕의 권리
  - 왕의 방식
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 왕이 행사할 통치 관행과 요구 사항을 가리키므로, 문맥상 뒤의 징발·동원의 내용에 맞게 ‘제도’로 옮겨 과도한 정당화나 추상적 ‘정의’ 해석을 피했습니다.
- source_word: אֲשֶׁר יִמְלֹךְ עֲלֵיהֶם
  english_pob_choice: who will reign over them
  chosen_korean: 그들을 다스릴 왕
  alternatives_korean:
  - 그들 위에 군림할 왕
  - 그들 위에 통치할 왕
  - 그들 위에 왕이 될 자
  lexicon: HALOT
  rationale: 왕의 재위와 통치를 함께 드러내는 동사이므로, 한국어에서는 관계절을 풀어 ‘그들을 다스릴 왕’으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: מִשְׁפַּט הַמֶּלֶךְ의 번역이 왕권을 정당화하는 의미로 들릴 가능성
  chosen_reading: ‘왕의 제도’로 번역해, 앞으로 나타날 왕권의 관행과 요구를 설명하는 경고문으로 읽히게 했습니다.
  alternative_readings:
  - 왕의 정의
  - 왕의 권리
  - 왕의 방식
  rationale: 문맥은 왕정의 부담과 수탈을 예고하므로, 본문이 왕권을 승인한다기보다 그 실상을 경고한다는 긴장을 보존하는 번역이 적절합니다.
  doctrine_reference: '번역 원칙: 본문이 드러내는 신학적 긴장을 해소하지 말고 보존한다.'
