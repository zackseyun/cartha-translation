  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת עַבְדֵי/כֶם֩ וְֽ/אֶת שִׁפְח֨וֹתֵי/כֶ֜ם וְ/אֶת בַּחוּרֵי/כֶ֧ם הַ/טּוֹבִ֛ים וְ/אֶת חֲמוֹרֵי/כֶ֖ם יִקָּ֑ח וְ/עָשָׂ֖ה לִ/מְלַאכְתּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/016.yaml
  text: He will take your male slaves[a], your female slaves, your best young men, and your donkeys, and use them for his work.
  footnotes:
  - marker: a
    text: Or, 'your servants ... your maidservants.' The Hebrew terms can denote servants more broadly, but here the coercive royal seizure context favors 'slaves.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 여러분의 남종들과 여종들, 여러분의 가장 좋은 청년들과 나귀들을 빼앗아 자기 일을 시킬 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵיכֶם
  english_pob_choice: your male slaves
  chosen_korean: 남종들
  alternatives_korean:
  - 종들
  - 남자 종들
  - 남자 노예들
  lexicon: HALOT
  rationale: 이 문맥은 왕권의 강제 징발을 경고하므로 단순한 ‘종’보다 소유·강제노동의 뉘앙스를 더 드러내는 ‘남종들’이 적절합니다.
- source_word: שִׁפְחוֹתֵיכֶם
  english_pob_choice: your female slaves
  chosen_korean: 여종들
  alternatives_korean:
  - 여자 종들
  - 여자 노예들
  - 시녀들
  lexicon: HALOT
  rationale: 앞 항목과 평행을 이루며, 히브리어의 성별 대비를 한국어에서도 자연스럽게 살리기 위해 ‘여종들’로 옮겼습니다.
- source_word: בַּחוּרֵיכֶם הַטּוֹבִים
  english_pob_choice: your best young men
  chosen_korean: 여러분의 가장 좋은 청년들
  alternatives_korean:
  - 여러분의 가장 훌륭한 젊은이들
  - 여러분의 가장 좋은 젊은 남자들
  - 여러분의 정예 청년들
  lexicon: HALOT
  rationale: בָּחוּר는 ‘젊은 남자’이지만, 한국어에서는 ‘청년들’이 자연스럽고 הַטּוֹבִים의 ‘최상/가장 좋은’도 잘 반영합니다.
- source_word: יִקָּח / וְעָשָׂה לִמְלַאכְתּוֹ
  english_pob_choice: will take ... and use them for his work
  chosen_korean: 빼앗아 자기 일을 시킬 것입니다
  alternatives_korean:
  - 가져가서 자기 일에 쓸 것입니다
  - 빼앗아 자기 일에 사용하실 것입니다
  - 취하여 자기 일을 하게 할 것입니다
  lexicon: HALOT
  rationale: יִקָּח는 단순한 ‘가짐’보다 이 왕권 문맥에서의 강탈을 드러내는 ‘빼앗다’가 더 적합하고, לִמְלַאכְתּוֹ는 ‘자기 일’로 간결하게 옮기면서 강제 동원을 살렸습니다.
theological_decisions:
- issue: 왕권 경고의 폭력성과 강제성
  chosen_reading: 동사와 어휘를 완화하지 않고, 왕이 사람과 가축을 강제로 징발해 자기 일에 동원하는 뜻을 분명히 했습니다.
  alternative_readings:
  - ‘사용하다’처럼 중립적으로 완화하는 번역
  - ‘일꾼으로 삼다’처럼 고용 관계로 약화하는 번역
  rationale: 사무엘상 8장의 경고는 왕권의 압제적 성격을 보여 주는 본문이므로, 사회적·정치적 강제성을 희석하지 않는 번역이 필요합니다.
  doctrine_reference: 1 Samuel 8:11-18의 왕권 경고 문맥
- issue: ‘노예’ 대신 ‘종’ 계열 선택
  chosen_reading: 문맥의 강제성은 유지하되, 한국어 전통 용례와 가독성을 고려해 ‘남종들/여종들’로 옮겼습니다.
  alternative_readings:
  - ‘남자 노예들/여자 노예들’
  - ‘남종/여종’ 대신 ‘종들’
  rationale: 히브리어는 분명한 종속·소유 관계를 담지만, 이 절의 평행구조와 한국어 수용성을 함께 고려하면 ‘남종들/여종들’이 가장 균형 잡힌 선택입니다.
  doctrine_reference: 사회적 예속 표현의 번역 일관성
