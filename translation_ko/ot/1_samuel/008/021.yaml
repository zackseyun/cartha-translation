  text: Samuel heard all the words of the people[b][a], and he spoke them in the ears of Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in the ears of the LORD,'' an idiom meaning in the LORD''s hearing or before him.'
    reason: lexical_alternative
  - marker: b
    text: The divine name is YHWH, traditionally rendered 'the LORD'; alternatively, 'Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 사무엘이 백성의 모든 말을 듣고, 그것을 야훼의 귀에 전했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야훼의 귀에’는 ‘야훼께서 들으시는 가운데/앞에서’라는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 신명 יְהוָה는 관례적 대치어 ‘주’ 대신 고유명사 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들어 주었습니다
  - 경청했습니다
  lexicon: HALOT
  rationale: 히브리어 שׁמע의 서사적 완료형은 여기서 단순히 ‘듣다’의 의미이므로, 과도한 해석이 없는 ‘들었습니다’가 가장 자연스럽습니다.
- source_word: כָּל דִּבְרֵי הָעָם
  english_pob_choice: all the words of the people
  chosen_korean: 백성의 모든 말
  alternatives_korean:
  - 백성이 한 모든 말
  - 백성의 모든 발언
  lexicon: HALOT
  rationale: ‘말들’에 해당하는 דִּבְרֵי와 총괄 표지 כָּל을 살려, 내용의 전부를 나타내는 표현으로 옮겼습니다.
- source_word: וַיְדַבְּרֵם
  english_pob_choice: he spoke them
  chosen_korean: 그것을 전했습니다
  alternatives_korean:
  - 그것들을 말했습니다
  - 그 말을 되풀이했습니다
  lexicon: HALOT
  rationale: 동사가 목적어 대명사를 받아 앞선 ‘백성의 말’을 다시 전달하는 뜻이므로, 한국어에서는 중립적이면서 전달 행위를 분명히 드러내는 ‘전했습니다’로 옮겼습니다.
- source_word: בְּאָזְנֵי
  english_pob_choice: in the ears of
  chosen_korean: 야훼의 귀에
  alternatives_korean:
  - 야훼 앞에서
  - 야훼께서 들으시는 데서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 원문의 이미지를 유지했습니다. 여기서는 ‘야훼께서 들으시는 데서/앞에서’의 뜻을 담는 말로 이해됩니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥의 신명은 서술적으로 번역하지 않고 고유명사 ‘야훼’로 옮겨, 원문의 직접성을 보존했습니다.
theological_decisions:
- issue: בְּאָזְנֵי יְהוָה의 관용적 의미
  chosen_reading: ‘야훼의 귀에’는 문자적 이미지와 함께 ‘야훼께서 들으시는 가운데/앞에서’라는 관용적 의미를 유지합니다.
  alternative_readings:
  - 야훼 앞에서
  - 야훼께서 들으시는 데서
  rationale: 히브리어 관용구를 평탄화하면 원문이 가진 대면성·증언성의 뉘앙스가 약해집니다. 따라서 직역형을 본문에 두고 의미는 주석적 판단으로 남기는 편이 원문에 충실합니다.
  doctrine_reference: 원문 관용구 보존 원칙
