translation:
  language: ko
  text: 사무엘이 백성의 모든 말을 듣고, 그 모든 말을 야훼의 귀에 전했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야훼의 귀에’는 ‘야훼께서 들으시는 가운데’ 또는 ‘야훼 앞에서’라는 뜻의 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 하나님의 이름 יְהוָה는 전통적으로 ‘여호와’로 옮기기도 하지만, 여기서는 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
