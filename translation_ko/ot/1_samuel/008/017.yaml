source:
  edition: WLC
  text: צֹאנְ/כֶ֖ם יַעְשֹׂ֑ר וְ/אַתֶּ֖ם תִּֽהְיוּ ל֥/וֹ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/017.yaml
  text: He will take a tenth of your flocks[a], and you will become his slaves.
  footnotes:
  - marker: a
    text: Or 'servants' or 'bondservants.' The Hebrew can denote those in service, but here the context of royal exaction and loss of freedom favors 'slaves.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 여러분의 양 떼의 십분의 일을 거두어 갈 것이며, 여러분은 그의 노예가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘종’ 또는 ‘종살이하는 사람’으로 옮길 수 있습니다. 히브리어는 섬기는 사람들을 가리킬 수 있지만, 여기서는 왕의 강제 징수와 자유 상실의 맥락이 ‘노예’라는 번역을 더 잘 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאנְכֶם
  english_pob_choice: your flocks
  chosen_korean: 여러분의 양 떼
  alternatives_korean:
  - 여러분의 양
  - 여러분의 가축 떼
  lexicon: HALOT
  rationale: צֹאן은 양과 염소를 아우르는 작은 가축의 집합을 가리키므로, 집합성을 살린 ‘양 떼’가 자연스럽고 정확합니다.
- source_word: יַעְשֹׂר
  english_pob_choice: will take a tenth
  chosen_korean: 십분의 일을 거두어 갈 것입니다
  alternatives_korean:
  - 십일조를 받을 것입니다
  - 십분의 일을 취할 것입니다
  lexicon: HALOT
  rationale: 이 문맥은 제의적 ‘십일조’가 아니라 왕의 강제 징수를 말하므로, 제도적 용어보다 ‘십분의 일을 거두어 가다’가 원문의 압박감을 더 잘 드러냅니다.
- source_word: לַעֲבָדִים
  english_pob_choice: slaves
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 종들
  lexicon: HALOT
  rationale: 왕권 아래의 강제 예속과 자유 상실이 핵심이므로, 완곡한 ‘종’보다 지배적·강제적 뉘앙스를 지닌 ‘노예’가 영어 POB의 의도를 더 정확히 반영합니다.
theological_decisions:
- issue: 왕의 요구가 가져오는 결과를 어떻게 한국어로 세울 것인가
  chosen_reading: ‘여러분은 그의 노예가 될 것입니다’로 강한 예속 상태를 분명히 표현합니다.
  alternative_readings:
  - ‘그의 종이 될 것입니다’
  - ‘그에게 속하게 될 것입니다’
  rationale: 본문은 단순한 봉사를 넘어서 자유를 빼앗기는 상태를 경고하므로, 약화된 표현보다 강제성을 유지하는 번역이 본문 효과를 살립니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §1; contested servant/slave language principle'
