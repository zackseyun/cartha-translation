  naturalness: ‘거두어 갈 것입니다’와 합쇼체 문장은 자연스럽습니다. 다만 ‘양과 염소 떼’가 원어의 집합적 의미를 정확하고 자연스럽게 드러냅니다. 각주에서 ‘종살이하는 사람’은 현대 한국어에서 다소 어색하므로 더 직접적인 표현으로 다듬는 것이 좋습니다.
