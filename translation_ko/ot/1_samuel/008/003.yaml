base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/003.yaml
  text: But his sons did not walk in his ways[a]; they turned aside after dishonest gain, took bribes[b], and perverted justice.
  footnotes:
  - marker: a
    text: Or 'after unjust gain' or 'after greed.' The Hebrew term denotes profit sought in a wrongful or exploitative way.
    reason: lexical_alternative
  - marker: b
    text: Literally 'turned aside judgment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그의 아들들은 그의 길을 따르지 않았습니다. 그들은 부정한 이익을 좇았고[a], 뇌물을 받았으며, 공의를 굽혔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불의한 이익을 따라’ 또는 ‘탐욕을 따라’. 히브리어는 부정하거나 착취적인 방식으로 이익을 추구하는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘판결을 굽혔다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ בְּדַרְכּוֹ
  english_pob_choice: did not walk in his ways
  chosen_korean: 그의 길로 걷지 않았습니다
  alternatives_korean:
  - 그의 길을 따르지 않았습니다
  - 그의 방식대로 살지 않았습니다
  lexicon: HALOT
  rationale: הלך + דרך의 관용구를 살려 행실과 삶의 방향을 나타내면서도, 현대 한국어에서 자연스럽게 읽히도록 옮겼습니다.
- source_word: הַבָּצַע
  english_pob_choice: after dishonest gain
  chosen_korean: 불의한 이익
  alternatives_korean:
  - 부정한 이익
  - 탐욕스러운 이익
  - 부당한 이익
  lexicon: HALOT
  rationale: 문맥이 재판 부패와 연결되므로, 단순한 '이익'보다 불법적·착취적 성격이 드러나는 표현을 택했습니다.
- source_word: שֹׁחַד
  english_pob_choice: took bribes
  chosen_korean: 뇌물을 받았으며
  alternatives_korean:
  - 뇌물을 취했으며
  - 뇌물을 받아 챙겼으며
  lexicon: HALOT
  rationale: שֹׁחַד는 법정 맥락의 뇌물을 가리키므로, 한국어에서도 관용적이고 법적 뉘앙스가 분명한 '뇌물을 받다'를 사용했습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: perverted justice
  chosen_korean: 정의를 굽혔습니다
  alternatives_korean:
  - 판결을 굽혔습니다
  - 재판을 왜곡했습니다
  - 공의를 굽혔습니다
  lexicon: HALOT
  rationale: 문자적으로는 '판결/재판'의 왜곡이지만, 앞뒤의 법정 부패 맥락을 살려 넓은 의미의 정의를 '굽히다'로 표현했습니다.
theological_decisions:
- issue: 사무엘의 아들들에 대한 평가를 도덕 일반화로 약화할지 여부
  chosen_reading: 법정 부패의 연속된 항목으로 유지해, 불의한 이익 추구·뇌물 수수·정의 왜곡이라는 법적 죄상을 분명히 드러냈습니다.
  alternative_readings:
  - 그들은 탐욕스러웠고 불공정했습니다
  - 그들은 나쁜 길을 갔습니다
  rationale: 히브리어는 단순한 품행 비판이 아니라 재판 기능을 훼손한 구체적 부패를 누적적으로 묘사하므로, 그 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
