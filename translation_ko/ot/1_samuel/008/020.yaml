source:
  edition: WLC
  text: וְ/הָיִ֥ינוּ גַם אֲנַ֖חְנוּ כְּ/כָל הַ/גּוֹיִ֑ם וּ/שְׁפָטָ֤/נוּ מַלְכֵּ֨/נוּ֙ וְ/יָצָ֣א לְ/פָנֵ֔י/נוּ וְ/נִלְחַ֖ם אֶת מִלְחֲמֹתֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/020.yaml
  text: so that we too may be like all the nations[b][a], and our king may judge us and go out before us and fight our battles.
  footnotes:
  - marker: a
    text: Or 'and we will be like all the nations'; the Hebrew form can be rendered more literally as a future sequence, though here it likely expresses the people's purpose in asking for a king.
    reason: lexical_alternative
  - marker: b
    text: '''Judge us'' can also carry the broader sense ''govern us'' or ''rule us.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 우리도 모든 민족처럼 되고, 우리 왕이 우리를 다스리며 우리 앞에 나가 우리의 전쟁을 치르도록 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리를 다스리며’로 옮긴 히브리어 שׁפט는 ‘재판하다’뿐 아니라 ‘통치하다’ 또는 ‘다스리다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִינוּ גַם אֲנַחְנוּ
  english_pob_choice: so that we too may be
  chosen_korean: 우리가 … 되게 하려는 것이며
  alternatives_korean:
  - 우리도 … 될 것입니다
  - 우리도 … 되게 하려는 것입니다
  lexicon: HALOT
  rationale: 여기서는 단순 미래 진술보다 요청의 목적을 나타내는 뜻이 강하므로, 한국어에서는 ‘되게 하려는 것입니다’로 목적·의도 뉘앙스를 살렸습니다.
- source_word: כְּכָל הַגּוֹיִם
  english_pob_choice: like all the nations
  chosen_korean: 다른 모든 민족들처럼
  alternatives_korean:
  - 모든 나라들처럼
  - 열방처럼
  lexicon: HALOT
  rationale: 가나안 주변의 민족들을 가리키는 문맥이므로 ‘민족들’이 자연스럽고, 이스라엘이 그들과 같아지려는 요구의 대비를 분명하게 합니다.
- source_word: וּשְׁפָטָנוּ
  english_pob_choice: may judge us
  chosen_korean: 우리를 다스리고
  alternatives_korean:
  - 우리를 재판하고
  - 우리를 심판하고
  lexicon: HALOT
  rationale: שׁפט는 여기서 단순 법정 판단보다 통치·행정의 의미가 강하므로, POB의 ‘judge us’가 가진 넓은 뜻을 한국어에서는 ‘다스리고’로 옮겼습니다.
- source_word: וְיָצָא לְפָנֵינוּ
  english_pob_choice: go out before us
  chosen_korean: 우리 앞에 나가
  alternatives_korean:
  - 우리보다 앞서 나가
  - 우리 앞장에 서
  lexicon: HALOT
  rationale: 직역하면 ‘앞에 나가다’이지만, 군사적 인도자의 이미지를 살리면서도 한국어로 자연스럽게 표현했습니다.
- source_word: וְנִלְחַם אֶת מִלְחֲמֹתֵינוּ
  english_pob_choice: fight our battles
  chosen_korean: 우리 싸움을 싸우게 하려는 것입니다
  alternatives_korean:
  - 우리 전쟁을 치르게 하려는 것입니다
  - 우리 싸움을 해 주려는 것입니다
  lexicon: HALOT
  rationale: 동사-명사 결합의 반복을 살려 ‘싸움을 싸우다’로 옮겨 전쟁/전투의 강한 군사적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 이스라엘이 다른 민족들과 같아지려는 요청의 뉘앙스
  chosen_reading: 비교적 중립적인 ‘다른 모든 민족들처럼’으로 옮겨, 언약 백성이 열방과 동일시되려는 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - ‘열방처럼’으로 더 성경적 어감을 살리는 읽기
  - ‘이방 민족들처럼’으로 대비를 더 강하게 하는 읽기
  rationale: 원문은 이스라엘의 요청이 신학적으로 문제적임을 설명하지 않고 그대로 제시하므로, 번역도 그 긴장을 완화하지 않도록 해야 합니다.
  doctrine_reference: 'Translation philosophy: preserve source-level tension; avoid domesticating the request for kingship.'
