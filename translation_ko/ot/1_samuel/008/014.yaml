  text: He will take your fields[a], your vineyards, and your best olive groves[b], and give them to his servants.
  footnotes:
  - marker: a
    text: Or 'olive trees' or 'olive orchards'; the Hebrew likely refers to olive plantings as agricultural property.
    reason: lexical_alternative
  - marker: b
    text: Or 'to his slaves'; the Hebrew word can denote either servants or slaves depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 너희의 밭과 너희의 포도원과 너희의 가장 좋은 올리브나무들을 가져가 자기 종들에게 줄 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘올리브나무들’ 또는 올리브 식재지 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 עֶבֶד는 문맥에 따라 ‘종’ 또는 ‘노예’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת שְׂדֹתֵיכֶם
  english_pob_choice: your fields
  chosen_korean: 너희의 밭
  alternatives_korean:
  - 너희의 들판
  - 너희의 농지
  lexicon: HALOT
  rationale: שָׂדֶה는 경작지 한 구획을 가리키며, 이 문맥에서는 재산 목록의 첫 항목으로서 ‘밭’이 가장 직접적이고 자연스럽습니다.
- source_word: וְאֶת כַּרְמֵיכֶם
  english_pob_choice: your vineyards
  chosen_korean: 너희의 포도원
  alternatives_korean:
  - 너희의 포도밭
  lexicon: HALOT
  rationale: כֶּרֶם은 일반적으로 포도원을 뜻하므로, 한국어에서도 표준적이고 정확한 ‘포도원’이 적합합니다.
- source_word: וְזֵיתֵיכֶם הַטּוֹבִים
  english_pob_choice: your best olive groves
  chosen_korean: 너희의 가장 좋은 올리브 나무들
  alternatives_korean:
  - 너희의 가장 좋은 올리브 숲
  - 너희의 가장 좋은 올리브 과수원
  - 너희의 가장 좋은 올리브 재배지
  lexicon: HALOT
  rationale: זַיִת는 올리브나무 또는 그 식재지를 가리킬 수 있는데, 한국어에서는 ‘올리브 나무들’이 원문의 나무/식재 모두를 비교적 직접적으로 반영합니다. ‘가장 좋은’은 הַטּוֹבִים의 선택된, 가장 바람직한 것을 뜻하는 뉘앙스를 살립니다.
- source_word: וְנָתַן לַעֲבָדָיו
  english_pob_choice: and give them to his servants
  chosen_korean: 자기 종들에게 줄 것입니다
  alternatives_korean:
  - 자기 신하들에게 줄 것입니다
  - 자기 노예들에게 줄 것입니다
  lexicon: HALOT
  rationale: עֶבֶד는 문맥에 따라 종/노예를 뜻할 수 있으나, 여기서는 왕의 수행원·관리들에게 재산이 돌아간다는 의미가 중심이므로 ‘종들’이 가장 무난합니다. ‘자기’는 지시대명사의 소유 관계를 자연스럽게 드러냅니다.
theological_decisions:
- issue: 왕정의 강제적 수탈을 나타내는 동사 선택
  chosen_reading: ‘빼앗아’로 번역해, לָקַח의 기본 의미인 ‘가져가다/취하다’를 살리면서도 왕의 제도가 지닌 강압성을 한국어에서 분명히 드러냈습니다.
  alternative_readings:
  - ‘가져갈 것입니다’
  - ‘취할 것입니다’
  rationale: 이 절은 왕이 백성의 재산을 강제로 징발하는 경고문이므로, 단순한 중립어보다 문맥이 요구하는 폭력성과 불의가 드러나야 합니다.
  doctrine_reference: 사무엘상 8장 왕정 경고의 신학적 맥락
