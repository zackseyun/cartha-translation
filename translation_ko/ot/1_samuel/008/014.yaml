  source_fidelity: 히브리어는 왕이 백성의 밭, 포도원, 좋은 올리브 식재/나무를 취하여 그의 עֲבָדִים에게 준다고 말합니다. 초안의 재산 목록과 수여 관계는 대체로 정확하지만, יִקָּח의 평이한 어휘적 의미보다 ‘빼앗아’가 한 단계 더 해석적입니다. 문맥상 강제성은 분명하나, 여기서는 ‘가져가’가 원문의 표현을 더 직접적으로 보존합니다.
  naturalness: ‘너희의’를 항목마다 반복한 표현은 히브리어의 병렬을 자연스럽게 반영합니다. ‘올리브나무들’은 한국어에서 붙여 쓰는 것이 자연스럽고, ‘그의 종들’은 원문의 소유 관계와 עֶבֶד의 폭넓은 의미를 유지합니다.
