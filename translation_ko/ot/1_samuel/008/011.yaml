base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/011.yaml
  text: 'He said[a], “This will be the custom of the king who will reign over you: he will take your sons and assign them to his chariots and among his horsemen[c][b], and they will run before his chariots.”'
  footnotes:
  - marker: a
    text: Or “the legal right of the king.” The Hebrew mishpat can denote a customary practice, a legal claim, or a judicial norm; here it refers to the way a king will typically act toward the people.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “your sons,” specifically male offspring, fitting the context of royal military service.
    reason: cultural_note
  - marker: c
    text: Or “before his chariot.” The Hebrew singular may be understood individually or collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말씀하셨습니다[a]. “이것은 너희를 다스릴 왕의 관례입니다. 그는 너희 아들들을 데려다가 자기 병거들과 자기 기병들 사이에 배치할 것이며[b], 그들이 그의 병거들 앞에서 달릴 것입니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왕의 법적 권리”입니다. 히브리어 mishpat은 관례, 법적 권리, 재판 규범을 가리킬 수 있으며, 여기서는 왕이 백성에게 보통 어떻게 행동할지를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “너희 아들들”입니다. 문맥상 왕실 군사 봉사에 징발되는 남자 자손을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 “그의 병거 앞에서”입니다. 히브리어 단수형은 개인별로도, 집합적으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  english_pob_choice: custom
  chosen_korean: 관례
  alternatives_korean:
  - 관습
  - 권리
  - 판결
  - 법적 권리
  lexicon: HALOT
  rationale: 여기서는 왕이 백성에게 대해 보이게 될 통상적 행위를 가리키므로, 법적 판결보다 ‘관례’가 영어 POB의 custom을 자연스럽게 반영합니다.
- source_word: אֶת־בְּנֵיכֶם יִקָּח
  english_pob_choice: he will take your sons
  chosen_korean: 너희 아들들을 데려다가
  alternatives_korean:
  - 너희 자녀들을 데려다가
  - 너희 아들들을 취할 것이며
  lexicon: HALOT
  rationale: 히브리어는 분명히 ‘아들들’이라고 하므로, 성별을 보존하면서 왕의 징발적 뉘앙스를 살려 ‘데려다가’로 옮겼습니다.
- source_word: וְשָׂם לוֹ
  english_pob_choice: and assign them
  chosen_korean: 자기 병거들과 자기 기병들 사이에 배치할 것이며
  alternatives_korean:
  - 자기 것을 위해 임명할 것이며
  - 자기에게 맡길 것이며
  lexicon: HALOT
  rationale: שׂים은 여기서 단순히 두는 것이 아니라 왕의 군사 봉사에 배정하는 뜻이므로, ‘배치하다’가 문맥상 가장 분명합니다.
- source_word: בְּמֶרְכַּבְתּוֹ וּבְפָרָשָׁיו
  english_pob_choice: to his chariots and among his horsemen
  chosen_korean: 자기 병거들과 자기 기병들 사이에
  alternatives_korean:
  - 자기 병거들과 자기 기병들 가운데
  - 자기 병거와 자기 기병들에
  lexicon: HALOT
  rationale: 전치사 בְּ의 범위와 병렬 구성을 살려, 군사 편제 안으로 편입되는 모습을 드러내는 ‘사이에’로 옮겼습니다. ‘병거’와 ‘기병’은 전통 교회어보다 원문 군사 이미지를 더 직접적으로 전달합니다.
- source_word: וְרָצוּ לִפְנֵי מֶרְכַּבְתּוֹ
  english_pob_choice: and they will run before his chariots
  chosen_korean: 그들이 그의 병거들 앞에서 달릴 것입니다
  alternatives_korean:
  - 그들이 그의 병거 앞에서 달릴 것입니다
  - 그들이 그의 병거를 앞질러 달릴 것입니다
  lexicon: HALOT
  rationale: 왕의 행렬 앞에서 달리는 시종/전령의 이미지를 살리면서, 영어 POB의 복수 처리에 맞추어 ‘병거들’로 유지했습니다.
theological_decisions:
- issue: 왕권 경고의 성격
  chosen_reading: 이 구절을 왕권 자체의 정당화가 아니라, 이스라엘이 요구한 왕이 백성에게 가할 징발적 관례에 대한 경고로 읽었습니다.
  alternative_readings:
  - 왕의 일반적 통치 방식에 대한 중립적 설명
  - 왕의 법적 권리에 대한 진술
  rationale: mishpat의 문맥상 기능은 왕정의 긍정적 권리 선언이 아니라 백성이 감당할 대가를 예고하는 경고입니다.
  doctrine_reference: 사무엘상 8장 문맥
