  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל שְׁמוּאֵל֙ שְׁמַ֣ע בְּ/קוֹלָ֔/ם וְ/הִמְלַכְתָּ֥ לָ/הֶ֖ם מֶ֑לֶךְ וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל אַנְשֵׁ֣י יִשְׂרָאֵ֔ל לְכ֖וּ אִ֥ישׁ לְ/עִירֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/022.yaml
  text: And Yahweh said to Samuel[a], “Listen to their voice and make a king for them.” Then Samuel said to the men of Israel, “Go[b], each man to his city.”
  footnotes:
  - marker: a
    text: Or 'heed them' / 'obey their voice.' The Hebrew idiom 'listen to their voice' can carry the sense of complying with what they ask.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the men of Israel.' The expression may refer representatively to the assembled Israelites.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 사무엘에게 말씀하셨습니다. "그들의 목소리를 들으십시오. 그리고 그들을 위하여 왕을 세우십시오." 그러자 사무엘이 이스라엘 사람들에게 말했습니다. "가십시오. 각자 자기 성읍으로."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 “그들의 목소리를 들으라”이지만, 문맥상 “그들의 말을 따르다/순종하다”의 뜻을 포함할 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC
  rationale: 본문의 여호와 이름 יְהוָה를 대체 칭호가 아니라 고유명으로 드러내기 위해 학술적 음역인 ‘야훼’를 사용했습니다.
- source_word: שְׁמַע בְּקוֹלָם
  english_pob_choice: Listen to their voice
  chosen_korean: 그들의 목소리를 들으십시오
  alternatives_korean:
  - 그들에게 순종하십시오
  - 그들의 말을 들으십시오
  lexicon: HALOT
  rationale: 히브리어 관용구를 너무 해석적으로 풀지 않고, ‘듣다’의 기본 의미를 살리면서도 문맥상 요구되는 수용의 뉘앙스를 보존했습니다.
- source_word: וְהִמְלַכְתָּ לָהֶם מֶלֶךְ
  english_pob_choice: make a king for them
  chosen_korean: 그들을 위하여 왕을 세우십시오
  alternatives_korean:
  - 그들을 위해 왕을 만드십시오
  - 그들을 다스릴 왕을 세우십시오
  lexicon: HALOT
  rationale: 힙힐형의 사역적 의미를 자연스럽게 살리기 위해 ‘세우다’를 택했으며, 단순한 ‘만들다’보다 왕권 부여의 뜻이 분명합니다.
- source_word: אִישׁ לְעִירוֹ
  english_pob_choice: each man to his city
  chosen_korean: 각자 자기 성읍으로
  alternatives_korean:
  - 각 사람은 자기 도시로
  - 각자 자기 고을로
  lexicon: HALOT
  rationale: 분배적 표현의 핵심은 각자가 자기 거처로 돌아가는 것이므로, 현대 한국어에서 가장 자연스러운 퇴장 공식을 사용하되 ‘성읍’으로 원문 이미지를 보존했습니다.
theological_decisions:
- issue: YHWH의 한국어 처리
  chosen_reading: 본문에서 하나님의 이름을 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 יְהוָה를 직접 사용하므로, 전통적 치환칭호보다 고유 이름을 드러내는 번역 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 사무엘의 전달문 register
  chosen_reading: 직접 인용문 안의 명령형을 합쇼체로 유지했습니다.
  alternative_readings:
  - 해라체
  - 하십시오체 혼합
  rationale: 서술문은 합쇼체로, 예언자적 전달은 공적·권위적 어조를 살리기 위해 존대 명령형을 사용했습니다.
  doctrine_reference: Korean target style guidelines
