source:
  edition: WLC
  text: וַ/יְמָאֲנ֣וּ הָ/עָ֔ם לִ/שְׁמֹ֖עַ בְּ/ק֣וֹל שְׁמוּאֵ֑ל וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י אִם מֶ֖לֶךְ יִֽהְיֶ֥ה עָלֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/019.yaml
  text: But the people refused to listen to the voice of Samuel[a], and they said, “No, but there shall be a king over us.”
  footnotes:
  - marker: a
    text: Or 'refused to obey Samuel.' The Hebrew idiom 'listen to the voice of' can carry the sense of heeding or obeying, not merely hearing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 백성은 사무엘의 음성을 듣기를 거부하고 말했습니다. “아니요. 오히려 우리 위에 왕이 있어야 합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘음성에 듣다’는 단순히 듣는 것을 넘어 순종하거나 받아들이는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ
  english_pob_choice: refused
  chosen_korean: 듣기를 거부하고
  alternatives_korean:
  - 거절하고
  - 마음에 없어하고
  lexicon: HALOT
  rationale: מאן은 단순한 비선호보다 분명한 거부를 뜻하므로, 한국어에서는 ‘듣기를 거부하고’로 강한 반대를 자연스럽게 드러냈습니다.
- source_word: לִשְׁמֹעַ בְּקוֹל
  english_pob_choice: to listen to the voice of
  chosen_korean: 사무엘의 음성을 듣기를
  alternatives_korean:
  - 사무엘의 말을 들으려
  - 사무엘에게 순종하기를
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리기 위해 ‘음성’을 유지하되, 한국어에서는 의미가 분명하도록 ‘듣기를’ 구조로 옮겼습니다.
- source_word: מֶלֶךְ יִהְיֶה עָלֵינוּ
  english_pob_choice: there shall be a king over us
  chosen_korean: 우리 위에 왕이 있어야 합니다
  alternatives_korean:
  - 우리 위에 왕이 있을 것입니다
  - 우리 위에 왕이 되게 하십시오
  lexicon: HALOT
  rationale: 이 표현은 단순 존재가 아니라 통치 관계를 말하므로, ‘우리 위에’와 ‘있어야 합니다’로 백성의 요구와 지배 개념을 함께 드러냈습니다.
theological_decisions:
- issue: 백성의 요구를 직접화된 발화로 옮길 때의 어조
  chosen_reading: 백성의 결연한 요구를 살리되, 현대 한국어에서 자연스러운 직접화법으로 옮겼습니다.
  alternative_readings:
  - ‘왕을 우리에게 주십시오’처럼 요청형으로 완화
  - 더 직설적으로 ‘왕이 우리를 다스려야 합니다’로 풀기
  rationale: 본문은 사무엘의 경고를 단호히 거부하는 장면이므로, 청유보다 선언적 요구가 더 가깝습니다. 다만 한국어 문장으로는 과도한 직역보다 자연스러운 직접화법이 적절합니다.
  doctrine_reference: 서술 의도와 담화 기능 보존
- issue: ‘음성’ 표현 유지 여부
  chosen_reading: ‘음성’을 유지해 히브리어 관용구의 원문 이미지를 살렸습니다.
  alternative_readings:
  - ‘말’을 사용해 의미만 전달
  - ‘순종하다’로 해석을 명시
  rationale: 원문은 단순 청취보다 권위 있는 말에 대한 응답을 암시하지만, 여기서는 그 긴장을 지우지 않기 위해 ‘음성’을 남기고 의미는 문맥으로 드러나게 했습니다.
  doctrine_reference: 원문 관용구 보존
