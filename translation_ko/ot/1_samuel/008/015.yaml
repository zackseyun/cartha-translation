  yaml_path: translation/ot/1_samuel/008/015.yaml
  text: He will take a tenth of your seed and your vineyards and give it to his officials and his servants[a].
  footnotes:
  - marker: a
    text: Or 'to his eunuchs'; the Hebrew סָרִיסָיו can refer either to eunuchs or, more broadly, to royal court officials.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 여러분의 곡식과 포도원의 십분의 일을 거두어 그의 관리들과 그의 종들에게 줄 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 환관들’로 옮길 수 있습니다. 히브리어 סָרִיסָיו는 환관을 뜻하기도 하고, 더 넓게는 왕궁의 관리들을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעֵיכֶם
  english_pob_choice: your seed
  chosen_korean: 여러분의 씨
  alternatives_korean:
  - 여러분의 곡식
