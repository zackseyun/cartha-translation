  lexicon: HALOT
  rationale: זֶרַע의 문자적 의미를 살리되, 포도원과 함께 나온 점과 ‘십분의 일’을 거두는 문맥을 반영해 농산물 전반을 가리키는 표현으로 옮겼습니다.
- source_word: כַרְמֵיכֶם
  english_pob_choice: your vineyards
  chosen_korean: 여러분의 포도원
  alternatives_korean:
  - 여러분의 포도밭의 소출
  - 여러분의 포도나무들
  lexicon: HALOT
  rationale: כֶּרֶם의 기본 의미인 ‘포도원’을 직접 살려, 앞의 ‘씨’와 병렬된 농업 자산이라는 점을 분명히 했습니다.
- source_word: יַעְשֹׂר
  english_pob_choice: will take a tenth
  chosen_korean: 십분의 일을 거두어
  alternatives_korean:
  - 십일조를 취하여
  - 십분의 일을 징수하여
  lexicon: HALOT
  rationale: 여기서는 종교적 ‘십일조’보다 왕의 강제 징수를 드러내는 것이 문맥상 적절하므로, ‘거두다’로 옮겨 부담을 나타냈습니다.
- source_word: לְסָרִיסָיו
  english_pob_choice: to his officials
  chosen_korean: 그의 관리들
  alternatives_korean:
  - 그의 환관들
  - 그의 궁정 관리들
  lexicon: HALOT
  rationale: סָרִיס가 ‘환관’일 수도 있지만 궁정 관료를 뜻할 수도 있으므로, 기능을 우선한 ‘관리들’로 옮기고 문자적 가능성은 주석으로 남겼습니다.
- source_word: וְלַעֲבָדָיו
  english_pob_choice: and his servants
  chosen_korean: 그의 종들에게
  alternatives_korean:
  - 그의 노예들에게
  - 그의 종들
  lexicon: HALOT
  rationale: עֶבֶד는 기본적으로 ‘종’이 적절하나, 이 절에서는 왕의 부하/하인들을 포괄하는 표현이므로 ‘종들’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 왕권 경고의 수사
  chosen_reading: 이 절은 왕이 백성의 생산물과 인력을 점점 더 수탈하는 모습을 예고하는 경고문으로 읽었습니다.
  alternative_readings:
  - 단순한 행정적 세금 부과로 완화하는 읽기
  rationale: 동사의 흐름과 문맥상 ‘거두어…줄 것입니다’는 왕권의 착취성을 강조하므로, 이를 약화시키지 않고 드러냈습니다.
  doctrine_reference: 1 Samuel 8장의 왕정 경고 맥락
