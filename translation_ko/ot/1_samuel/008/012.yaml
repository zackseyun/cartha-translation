reference: 1 Samuel 8:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָ/שׂ֣וּם ל֔/וֹ שָׂרֵ֥י אֲלָפִ֖ים וְ/שָׂרֵ֣י חֲמִשִּׁ֑ים וְ/לַ/חֲרֹ֤שׁ חֲרִישׁ/וֹ֙ וְ/לִ/קְצֹ֣ר קְצִיר֔/וֹ וְ/לַ/עֲשׂ֥וֹת כְּלֵֽי מִלְחַמְתּ֖/וֹ וּ/כְלֵ֥י רִכְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/012.yaml
  text: He will appoint for himself commanders of thousands and commanders of fifties[a], and some to plow his ground and reap his harvest[c][b], and to make his weapons of war and the equipment of his chariots.
  footnotes:
  - marker: a
    text: Or 'captains of thousands and captains of fifties.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'to plow his plowing and reap his harvest,' a construction emphasizing labor done for the king.
    reason: lexical_alternative
  - marker: c
    text: Or 'to make his military equipment and the equipment of his chariots.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자신을 위해 천 명의 지휘관들과 오십 명의 지휘관들을 임명하고, 그의 땅을 갈고 그의 추수를 거두게 할 사람들과, 그의 전쟁 무기들과 그의 병거의 장비를 만들 사람들을 둘 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘천들의 지휘관들’과 ‘오십들의 지휘관들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그의 갈기를 갈고 그의 추수를 거두게 할’입니다. 반복어를 살린 표현으로, 왕을 위한 강제노동을 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘병거’는 전쟁용 수레를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָשׂוּם לוֹ / שָׂרֵי אֲלָפִים וְשָׂרֵי חֲמִשִּׁים
  english_pob_choice: He will appoint for himself commanders of thousands and commanders of fifties
  chosen_korean: 자신을 위해 천 명의 지휘관들과 오십 명의 지휘관들을 임명하다
  alternatives_korean:
  - 그를 위해 천 명의 대장들과 오십 명의 대장들을 세우다
  - 자신을 위해 천부장들과 오십부장들을 세우다
  lexicon: HALOT
  rationale: שַׂר는 여기서 군사·행정 지도자를 가리키므로, 현대 독자가 바로 이해할 수 있는 ‘지휘관들’을 택했습니다. ‘천 명/오십 명’은 히브리어의 단위 구분을 그대로 살립니다.
- source_word: וְלַחֲרֹשׁ חֲרִישׁוֹ
  english_pob_choice: and some to plow his ground
  chosen_korean: 그의 땅을 갈 사람들
  alternatives_korean:
  - 그의 밭을 갈 사람들
  - 그의 갈아엎은 땅을 갈 사람들
  lexicon: HALOT
  rationale: 직역하면 ‘그의 갈기’를 갈다이지만, 한국어에서는 같은 어근 반복을 그대로 옮기기보다 강제노동의 의미를 살려 자연스럽게 ‘그의 땅을 갈다’로 옮겼습니다.
- source_word: וְלִקְצֹר קְצִירוֹ
  english_pob_choice: and reap his harvest
  chosen_korean: 그의 추수를 거두다
  alternatives_korean:
  - 그의 수확을 거두다
  - 그의 곡식을 거두다
  lexicon: HALOT
  rationale: ‘קָצִיר’의 기본적 수확 의미를 따라 ‘추수’로 옮겼고, 동사의 종결형을 살려 노동 의무를 나타냈습니다.
- source_word: וְלַעֲשׂוֹת כְּלֵי מִלְחַמְתּוֹ וּכְלֵי רִכְבּוֹ
  english_pob_choice: and to make his weapons of war and the equipment of his chariots
  chosen_korean: 그의 전쟁 무기들과 그의 병거의 장비를 만들다
  alternatives_korean:
  - 그의 전쟁 도구들과 그의 병거의 기구를 만들다
  - 그의 전쟁 기구들과 그의 병거 장비를 만들다
  lexicon: HALOT
  rationale: כְּלִי는 문맥상 넓게 ‘도구/장비/무기’가 될 수 있으므로, 전쟁 맥락에서는 ‘전쟁 무기들’, 병거 문맥에서는 ‘장비’로 옮겨 군사적 준비를 드러냈습니다.
theological_decisions:
- issue: 이 절의 전반적 register는 왕권 강화에 따른 백성의 동원과 강제노동을 경고하는 서술입니다.
  chosen_reading: 명령적·예언적 어조를 유지하되, 한국어에서는 서술체로 ‘그는 … 둘 것입니다’라고 옮겨 경고의 예고성을 살렸습니다.
  alternative_readings:
  - 그는 … 둘 것입니다
  - 그는 … 둘 것이다
  rationale: 히브리어 연속 부정사구는 장차 왕이 할 일을 누적적으로 묘사하므로, 미래 예고형으로 옮기는 것이 문맥상 적절합니다.
  doctrine_reference: 1 Samuel 8:10-18의 왕정 비판 맥락
