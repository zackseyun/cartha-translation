  yaml_path: translation/ot/1_samuel/008/002.yaml
  text: The name of his firstborn was Joel, and the name of his second was Abijah; they were judges in Beersheba.
translation:
  language: ko
  text: 그의 맏아들의 이름은 요엘이었고, 그의 둘째 아들의 이름은 아비야였습니다. 그들은 브엘세바에서 재판관으로 일하고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: was
  chosen_korean: -였습니다
  alternatives_korean:
  - -이 되었습니다
  - -이 있었습니다
  lexicon: HALOT
  rationale: 이 구절은 서술 도입의 고정된 이름 형식이므로, 사건성보다 상태 진술에 맞는 합쇼체 과거로 옮겼습니다.
- source_word: הַבְּכוֹר
  english_pob_choice: firstborn
  chosen_korean: 맏아들
  alternatives_korean:
  - 첫째
  - 장자
  lexicon: HALOT
  rationale: ‘firstborn’의 핵심은 출생 순서와 장자성을 함께 담는 말이므로, 현대 한국어에서 자연스러운 ‘맏아들’을 택했습니다.
- source_word: מִשְׁנֵהוּ
  english_pob_choice: his second
  chosen_korean: 둘째
  alternatives_korean:
  - 두 번째 아들
  - 두째
  lexicon: HALOT
  rationale: 히브리어는 둘째 순서를 말하며, 앞절과의 평행을 살려 ‘그의 둘째의 이름’으로 간결하게 옮겼습니다.
- source_word: שֹׁפְטִים
  english_pob_choice: they were judges
  chosen_korean: 재판관이었습니다
  alternatives_korean:
  - 판관이었습니다
  - 사사들이었습니다
  lexicon: HALOT
  rationale: 여기서는 직함/직분을 나타내므로 ‘판관’과 의미가 가장 가깝지만, 현대 독자가 즉시 이해할 수 있도록 ‘재판관’을 사용했습니다.
theological_decisions:
- issue: שֹׁפְטִים의 직분 번역
  chosen_reading: 사사(판관)가 아니라 ‘재판관’으로 옮겨, 이들이 백성을 다스리는 역사서적 사사라기보다 실제로 재판을 맡은 역할임을 드러냈습니다.
  alternative_readings:
  - 사사였습니다
  - 판관이었습니다
  rationale: 문맥은 사사기적 구원자 직분이 아니라 브엘세바에서의 사법 기능을 말하므로, 의미를 좁혀 오해를 줄였습니다.
  doctrine_reference: 역사서 문맥의 직분 이해
