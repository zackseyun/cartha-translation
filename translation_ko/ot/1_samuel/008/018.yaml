source:
  edition: WLC
  text: וּ/זְעַקְתֶּם֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִ/לִּ/פְנֵ֣י מַלְכְּ/כֶ֔ם אֲשֶׁ֥ר בְּחַרְתֶּ֖ם לָ/כֶ֑ם וְ/לֹֽא יַעֲנֶ֧ה יְהוָ֛ה אֶתְ/כֶ֖ם בַּ/יּ֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/018.yaml
  text: And in that day you will cry out because of your king, whom you have chosen for yourselves, but Yahweh will not answer you in that day.
translation:
  language: ko
  text: 그날에 너희는 너희가 스스로 택한 너희 왕 때문에 부르짖을 것이나, 야훼께서는 그날에 너희에게 응답하지 않으실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부르짖을 것이나’는 원문의 절규를 살린 표현입니다. 직역하면 ‘소리 지르다/외치다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘너희 왕의 앞에서/면전에서’입니다. 문맥상 원인은 왕의 압제적 결과이므로 ‘때문에’로 자연화했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְעַקְתֶּם
  english_pob_choice: you will cry out
  chosen_korean: 부르짖을 것이나
  alternatives_korean:
  - 외칠 것입니다
  - 울부짖을 것입니다
  - 호소할 것입니다
  lexicon: HALOT
  rationale: זעק은 단순한 소리 내기보다 극심한 고통 속의 절규를 뜻하므로, ‘부르짖다’가 강도를 잘 살립니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: in that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그때에
  lexicon: HALOT
  rationale: 예언적 경고문에서 반복되는 정형 표현이므로 ‘그날에’가 가장 자연스럽고 엄숙합니다.
- source_word: מִלִּפְנֵי מַלְכְּכֶם
  english_pob_choice: because of your king
  chosen_korean: 너희 왕 때문에
  alternatives_korean:
  - 너희 왕 앞에서
  - 너희 왕의 존재로 인해
  - 너희 왕 앞에서 말미암아
  lexicon: HALOT
  rationale: 직역하면 ‘앞에서/면전에서’이지만, 문맥상 왕의 압제적 결과로 인한 호소이므로 원인 관계를 드러내는 ‘때문에’가 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 신명기적 맥락의 고유명사 יְהוָה는 본 프로젝트 기본값대로 ‘야훼’로 옮겨, 호칭이 아니라 언약적 이름을 드러냅니다.
theological_decisions:
- issue: 야훼께서 응답하지 않으심의 표현
  chosen_reading: ‘응답하지 않으실 것입니다’로 옮겨, 단순한 무반응이 아니라 심판적 거절의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 답하지 않으실 것입니다
  - 들으시지 않으실 것입니다
  rationale: ענה는 요청에 대한 응답을 뜻하지만, 문맥상 이스라엘의 왕 요구에 대한 야훼의 거절이 강조됩니다. 그래서 ‘응답하지 않다’가 가장 균형 잡힌 표현입니다.
  doctrine_reference: 본문 문맥상 언약적 경고와 심판의 선언
