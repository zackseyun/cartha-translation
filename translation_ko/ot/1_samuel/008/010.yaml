  - severity: medium
    issue: 각주 대안의 ‘그가 왕을 구하였던’은 ‘그가’의 지시 대상이 불명확합니다.
    rationale: 원문의 대안적 상은 요청 행위의 진행/특징성과 관련되며, 요청 상대인 사무엘도 유지되어야 합니다.
