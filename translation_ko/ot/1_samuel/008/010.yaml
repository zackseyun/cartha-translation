  text: So Samuel spoke all the words of Yahweh to the people who were asking him for a king[a].
  footnotes:
  - marker: a
    text: Or, 'who had asked him for a king.' The Hebrew participle can describe either ongoing action or the people as those characterized by this request.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 사무엘이 야훼의 모든 말씀을 사무엘에게 왕을 요구하던 백성에게 전했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사무엘에게 왕을 요구했던 백성에게.’ 히브리어 분사는 진행 중인 행위나 그 요청으로 특징지어진 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: spoke
  chosen_korean: 전했습니다
  alternatives_korean:
  - 말했습니다
  - 이야기했습니다
  lexicon: HALOT
  rationale: 히브리어 서술 동사로서 보고 행위를 자연스럽게 살리되, 뒤의 ‘야훼의 모든 말씀’을 목적어로 받는 문맥에 맞게 ‘전하다’가 가장 적절합니다.
- source_word: אֵת כָּל דִּבְרֵי יְהוָה
  english_pob_choice: all the words of Yahweh
  chosen_korean: 야훼의 모든 말씀
  alternatives_korean:
  - 야훼께서 하신 모든 말씀
  - 주님의 모든 말씀
  lexicon: HALOT
  rationale: ‘모든 말씀’의 총체성을 드러내고, 본문에 있는 신명기적 표현을 그대로 보이기 위해 직역에 가깝게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 원칙에 따라 신명기 이름을 호칭 대체 없이 ‘야훼’로 옮겼습니다.
- source_word: הַשֹּׁאֲלִים מֵאִתּוֹ מֶלֶךְ
  english_pob_choice: who were asking him for a king
  chosen_korean: 왕을 구하던 그 백성에게
  alternatives_korean:
  - 왕을 달라고 하던 그 백성에게
  - 왕을 요청하던 그 백성에게
  lexicon: HALOT
  rationale: 분사형은 지속적·특징적 요청을 나타낼 수 있으므로 ‘구하던’으로 옮겼고, ‘from him’의 방향성을 살려 대상 표지를 유지했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 본문의 신명기 이름을 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 일반 칭호가 아니라 언약적 고유명을 사용하므로, 이를 대체하지 않고 드러내는 것이 원문과 POB의 신학적 의도를 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
