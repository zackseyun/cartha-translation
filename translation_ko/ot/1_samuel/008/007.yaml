  source_fidelity: 히브리어는 ‘백성의 소리를 들으라’와 ‘그들이 네게 말하는 모든 것’으로 이루어진 하나의 명령입니다. 초안은 이를 두 개의 명령으로 반복하여 옮겼습니다. 또한 마지막 구절은 야훼께서 ‘그들의 왕으로 다스리시는 것’을 백성이 거절했다는 뜻을 보존하도록 다듬는 것이 더 정확합니다.
  naturalness: ‘백성의 소리를 들어라. ... 모든 것을 들어라’는 한국어에서 불필요하게 반복됩니다. ‘백성이 네게 말하는 모든 말을 들어라’는 자연스럽고 포괄성을 유지합니다. 인용문 안의 ‘들어라’는 야훼가 사무엘에게 하는 명령으로서 적절합니다.
  terminology: ‘야훼’, ‘사무엘’, ‘왕’, ‘버리다’는 일관되고 문맥상 적절합니다. 다만 ‘내가 그들의 왕이 되지 못하게’는 한국어상 야훼가 왕이 되는 것이 아직 실현되지 않았다는 인상을 줄 수 있으므로, 이미 야훼의 왕권을 거절하는 의미가 드러나게 수정했습니다.
