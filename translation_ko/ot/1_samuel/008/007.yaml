  text: 야훼께서 사무엘에게 말씀하셨습니다. 「백성이 네게 말하는 모든 말을 들어라. 그들이 너를 버린 것이 아니라, 그들의 왕으로 다스리는 나를 버린 것이다.[a]」
  philosophy: optimal-equivalence
  footnotes:
