  text: And Yahweh said to Samuel[a], “Listen to the voice of the people in all that they say to you, for they have not rejected you, but they have rejected me from being king over them.”
  footnotes:
  - marker: a
    text: Or, 'from being king over them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 사무엘에게 말씀하셨습니다. 「백성의 소리를 들어라. 그들이 너에게 말하는 모든 것을 들어라. 그들이 너를 버린 것이 아니라, 내가 그들의 왕이 되지 못하게 나를 버린 것이다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 왕이 되지 못하게’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 테트라그람마톤은 전통적 대체어보다 고유명사로 옮기는 원칙에 따라 야훼로 처리했습니다.
- source_word: שְׁמַע בְּקוֹל
  english_pob_choice: Listen to the voice of
  chosen_korean: 백성의 소리를 들어라
  alternatives_korean:
  - 백성의 목소리에 귀를 기울여라
  - 백성의 소리를 들으십시오
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 옮기되, ‘소리/목소리’의 이미지를 유지했습니다.
- source_word: לְכֹל אֲשֶׁר יֹאמְרוּ אֵלֶיךָ
  english_pob_choice: in all that they say to you
  chosen_korean: 그들이 너에게 말하는 모든 것을
  alternatives_korean:
  - 그들이 너에게 말하는 바를 모두
  - 그들이 너에게 하는 모든 말을
  lexicon: HALOT
  rationale: 포괄적 청취 명령을 살리기 위해 ‘모든 것’을 유지했습니다.
- source_word: מָאַסוּ
  english_pob_choice: rejected
  chosen_korean: 버린
  alternatives_korean:
  - 거절한
  - 거부한
  - 배척한
  lexicon: HALOT
  rationale: 이 절의 정치적·언약적 거절을 한국어로 가장 자연스럽게 드러내는 말로 ‘버리다’를 택했습니다.
- source_word: מִמְּלֹךְ עֲלֵיהֶם
  english_pob_choice: from being king over them
  chosen_korean: 그들의 왕이 되지 못하게
  alternatives_korean:
  - 그들 위에 왕 노릇하지 못하게
  - 그들 위에서 다스리지 못하게
  - 그들 위에 왕으로서 다스리지 못하게
  lexicon: HALOT
  rationale: 히브리어의 ‘~하지 못하게’라는 배제를 살리면서, 왕권의 핵심을 ‘왕이 되다’로 간명하게 옮겼습니다.
theological_decisions:
- issue: 사무엘 거절과 야훼 거절의 대비
  chosen_reading: 백성이 사무엘을 거절한 것이 아니라, 야훼의 왕권 자체를 거절한 것이라는 대비를 분명히 드러냈습니다.
  alternative_readings:
  - 사무엘의 지도력만 거절한 것으로 완화하는 읽기
  - 하나님의 직접적 통치를 희미하게 만드는 읽기
  rationale: 본문은 대조 구조로 더 깊은 거절의 대상이 야훼임을 밝히므로, 그 신학적 긴장을 그대로 보존했습니다.
  doctrine_reference: 'Affirmations; Translation philosophy #3'
