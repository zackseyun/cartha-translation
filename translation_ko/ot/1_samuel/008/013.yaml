  footnotes:
  - marker: a
    text: 히브리어는 향수만이 아니라 향유나 연고를 준비하는 사람도 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  english_pob_choice: '[direct object marker, not translated independently]'
  chosen_korean: 별도 번역 없음
  alternatives_korean:
  - 을/를을 독립적으로 표기
  lexicon: HALOT
  rationale: 히브리어 목적격 표지는 한국어에서 보통 조사로 자연스럽게 흡수되므로 따로 드러내지 않았습니다.
- source_word: בְּנוֹתֵיכֶם
  english_pob_choice: your daughters
  chosen_korean: 여러분의 딸들
  alternatives_korean:
