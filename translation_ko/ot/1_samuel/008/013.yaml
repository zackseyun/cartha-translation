  - 향료를 섞는 여자들
  - 연고를 만드는 여자들
  lexicon: HALOT
  rationale: 이 어근은 향수만이 아니라 향유·연고 같은 방향성 혼합물을 준비하는 뜻까지 포괄하므로, 의미 범위를 보존하는 표현을 택했습니다.
- source_word: וּלְטַבָּחוֹת
  english_pob_choice: cooks
  chosen_korean: 요리하는 여자들
  alternatives_korean:
  - 주방일 하는 여자들
  - 요리사들
  lexicon: HALOT
  rationale: 여성형 직역을 살리면서도 현대 한국어에서 자연스러운 직무 표현으로 옮겼습니다.
- source_word: וּלְאֹפוֹת
  english_pob_choice: bakers
  chosen_korean: 빵 굽는 여자들
