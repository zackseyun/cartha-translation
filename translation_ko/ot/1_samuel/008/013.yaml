  lexicon: HALOT
  rationale: 문맥상 왕의 징발 대상으로 언급된 가족 관계를 그대로 살리는 것이 가장 직접적입니다.
- source_word: לְרַקָּחוֹת
  english_pob_choice: to be perfumers
