  - 빵 만드는 여자들
  lexicon: HALOT
  rationale: 동사적 용법이 드러나도록 직역에 가깝게 옮겨, 직업군의 성격을 분명히 했습니다.
theological_decisions:
- issue: 왕권의 강제 징발을 어떻게 드러낼지
  chosen_reading: '"데려다가 …로 삼을 것입니다"로 옮겨, 단순 고용이 아니라 왕의 강제적 동원이라는 뉘앙스를 살렸습니다.'
  alternative_readings:
  - '"데려갈 것입니다"'
  - '"임명할 것입니다"'
  rationale: 이 절은 이스라엘 왕이 백성을 취하는 방식에 대한 경고이므로, 부드러운 행정적 표현보다 소유·동원 감각이 드러나는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 사무엘상 8:11–18 왕정 경고문맥
- issue: 여성형 직무 명칭을 어떻게 처리할지
  chosen_reading: 한국어에서는 성별 표지가 자연스럽게 드러나도록 "여자들"을 반복해 원문이 가진 여성형 직관을 보존했습니다.
  alternative_readings:
  - 직함만 두고 성별 표지 생략
  - 중성적 직업명 사용
  rationale: 히브리어 복수 여성형이 분명하므로, 한국어에서도 독자가 징발 대상이 여성임을 놓치지 않도록 했습니다.
  doctrine_reference: 원문 문법 관찰
