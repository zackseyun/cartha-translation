  text: Then all the elders of Israel gathered together and came to Samuel at Ramah[a].
  footnotes:
  - marker: a
    text: Hebrew 'to Ramah'; the English 'at Ramah' expresses the destination as Samuel's location in natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘의 모든 장로들이 함께 모여 라마에 있는 사무엘에게 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘사무엘에게, 라마로’입니다. 지명에 붙은 방향격 어미는 라마가 그들이 온 목적지임을 나타내며, 한국어 본문은 사무엘이 라마에 있었음을 밝혀 자연스럽게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  english_pob_choice: gathered together
  chosen_korean: 모여
  alternatives_korean:
  - 함께 모였습니다
  - 집결했습니다
  lexicon: HALOT
  rationale: 반신형 קבץ의 집합·공동 모임의 뉘앙스를 살리면서, 한국어 서술에서는 자연스럽게 ‘모여’로 옮기는 것이 가장 간결합니다.
- source_word: כֹּל זִקְנֵי יִשְׂרָאֵל
  english_pob_choice: all the elders of Israel
  chosen_korean: 이스라엘의 모든 장로
  alternatives_korean:
  - 이스라엘의 장로들 모두
  - 이스라엘의 온 장로들
  lexicon: HALOT
  rationale: ‘장로’는 이스라엘의 대표적 지도층을 가리키므로 그대로 살리고, כֹּל의 포괄성을 ‘모든’으로 분명히 했습니다.
- source_word: וַיָּבֹאוּ אֶל שְׁמוּאֵל
  english_pob_choice: came to Samuel
  chosen_korean: 사무엘에게 왔습니다
  alternatives_korean:
  - 사무엘에게 갔습니다
  - 사무엘 앞으로 왔습니다
  lexicon: HALOT
  rationale: 서술 시점상 ‘came to’의 도착 초점을 살려 ‘-에게 왔습니다’로 옮겼습니다.
- source_word: הָרָמָתָה
  english_pob_choice: at Ramah
  chosen_korean: 라마로
  alternatives_korean:
  - 라마에서
  - 라마에
  lexicon: HALOT
  rationale: 히브리어의 방향격 ה는 목적지의 방향을 나타내므로, 한국어에서는 도착 방향을 드러내는 ‘라마로’가 원문에 가장 가깝습니다.
