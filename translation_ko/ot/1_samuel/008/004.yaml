  source_fidelity: 원문의 순서는 ‘이스라엘의 모든 장로들’이 함께 모인 뒤 사무엘에게 온 것으로, 초안의 의미는 대체로 맞습니다. 그러나 ‘사무엘에게 라마로 왔습니다’는 두 목적어·방향 표현의 결합이 부자연스럽고, 라마가 사무엘의 소재지이자 도착지라는 관계를 한국어에서 명료하게 드러내지 못합니다.
