- from: 그들이 애굽에서 내가 그들을 이끌어 올린 날부터 오늘까지 해 온 모든 일과 같이[a], 나를 버리고 다른 신들을 섬겨 온 것[b]처럼, 지금도 당신에게 그렇게 하고 있습니다.
  to: 내가 그들을 애굽에서 이끌어 올린 날부터 오늘까지 그들이 해 온 모든 일, 곧 나를 버리고 다른 신들을 섬긴 것과 같이, 그들도 이제 당신에게 그렇게 하고 있습니다.[b]
  rationale: The revision makes ‘나를 버리고 다른 신들을 섬긴 것’ appositional to ‘모든 일,’ avoiding the draft’s double comparative construction. It preserves the temporal span, the historical-exodus formula, the covenantal force of ‘버리다,’ the lexical sense of ‘섬기다,’ and the source’s open-ended analogy to Samuel. The unnecessary Korean temporal note is removed; the lexical note on ‘섬기다’ is retained and its anchor is placed at the end of the sentence.
