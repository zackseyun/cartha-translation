reference: 1 Samuel 8:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/כָֽל הַ/מַּעֲשִׂ֣ים אֲשֶׁר עָשׂ֗וּ מִ/יּוֹם֩ הַעֲלֹתִ֨/י אֹתָ֤/ם מִ/מִּצְרַ֨יִם֙ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יַּ֣עַזְבֻ֔/נִי וַ/יַּעַבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים כֵּ֛ן הֵ֥מָּה עֹשִׂ֖ים גַּם לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/008.yaml
  text: According to all the deeds that they have done from the day I brought them up out of Egypt to this day[a], forsaking me and serving other gods[b], so they are also doing to you.
  footnotes:
  - marker: a
    text: Or 'until this day.'
    reason: lexical_alternative
  - marker: b
    text: '''Serving other gods'' can also be expressed ''worshiping other gods''; the Hebrew verb is literally ''serve.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 애굽에서 내가 그들을 이끌어 올린 날부터 오늘까지 해 온 모든 일과 같이[a], 나를 버리고 다른 신들을 섬겨 온 것[b]처럼, 지금도 당신에게 그렇게 하고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오늘까지’.
    reason: alternative_reading
  - marker: b
    text: ‘다른 신들을 섬겨 온 것’은 ‘다른 신들을 예배해 온 것’으로도 옮길 수 있으나, 히브리어 동사는 문자적으로 ‘섬기다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכָל הַמַּעֲשִׂים
  english_pob_choice: According to all the deeds
  chosen_korean: 모든 일과 같이
  alternatives_korean:
  - 행한 모든 일에 따라
  - 그들이 한 모든 행실처럼
  lexicon: HALOT
  rationale: כְּכָל은 단순한 목록이 아니라 비교를 여는 표현이므로, 한국어로는 ‘…과 같이’로 살리되 ‘모든 일’로 행위의 총체성을 유지했습니다.
- source_word: מִיּוֹם הַעֲלֹתִי אֹתָם מִמִּצְרַיִם
  english_pob_choice: from the day I brought them up out of Egypt
  chosen_korean: 애굽에서 내가 그들을 이끌어 올린 날부터
  alternatives_korean:
  - 내가 그들을 애굽에서 이끌어 올린 날부터
  - 내가 그들을 이집트에서 데리고 올라온 날부터
  lexicon: HALOT
  rationale: 출애굽 공식 표현의 동사 ‘עלה(올리다)’를 반영해 ‘이끌어 올린’으로 옮기고, 고유한 성서 지명을 위해 ‘애굽’을 유지했습니다.
- source_word: וַיַּעַזְבֻנִי וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  english_pob_choice: forsaking me and serving other gods
  chosen_korean: 나를 버리고 다른 신들을 섬겨 온 것
  alternatives_korean:
  - 나를 버리고 다른 신들을 섬긴 것
  - 나를 떠나 다른 신들을 섬긴 것
  lexicon: HALOT
  rationale: ‘버리다’는 언약적 배신의 뉘앙스를 살리고, עבד의 기본 의미를 따라 ‘섬기다’로 직역하되 지속성을 드러내기 위해 ‘-어 온 것’을 사용했습니다.
- source_word: הֵמָּה עֹשִׂים גַּם לָךְ
  english_pob_choice: they are also doing to you
  chosen_korean: 지금도 당신에게 그렇게 하고 있습니다
  alternatives_korean:
  - 당신에게도 그렇게 하고 있습니다
  - 당신에게도 같은 일을 하고 있습니다
  lexicon: HALOT
  rationale: 히브리어는 대상에 대한 행위를 열린 방식으로 말하므로, 한국어도 구체화를 피하고 비교의 결과만 자연스럽게 전달했습니다.
theological_decisions:
- issue: 본문의 비교 구조를 한국어에서 어떻게 드러낼지
  chosen_reading: 이스라엘의 과거 행위와 사무엘에 대한 현재 행위를 ‘…과 같이 / 그렇게’로 연결해, 동일한 불신실성의 패턴을 본문 수준에서만 보여 주었습니다.
  alternative_readings:
  - ‘똑같이’처럼 더 강한 동일성 표현
  - ‘반역하고 있다’와 같은 해석적 강화
  rationale: 본문은 해석을 덧붙이기보다 비교를 통해 반복된 언약 불성실을 드러내므로, 과도한 설명 없이 대응 구조를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
