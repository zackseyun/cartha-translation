  rationale: וַיֵּרַע의 강한 평가성을 살려 ‘악하게’로 옮기되, 한국어에서는 ‘사무엘의 눈에’와 자연스럽게 이어지도록 구성했습니다.
- source_word: בְּעֵינֵי שְׁמוּאֵל
  english_pob_choice: in Samuel’s eyes
  chosen_korean: 사무엘의 눈에
  alternatives_korean:
  - 사무엘 보기에
