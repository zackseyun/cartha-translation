source:
  edition: WLC
  text: וַ/יֵּ֤רַע הַ/דָּבָר֙ בְּ/עֵינֵ֣י שְׁמוּאֵ֔ל כַּ/אֲשֶׁ֣ר אָמְר֔וּ תְּנָ/ה לָּ֥/נוּ מֶ֖לֶךְ לְ/שָׁפְטֵ֑/נוּ וַ/יִּתְפַּלֵּ֥ל שְׁמוּאֵ֖ל אֶל יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/006.yaml
  text: But the matter was displeasing in Samuel’s eyes when they said[b][a], “Give us a king to judge us.” And Samuel prayed to Yahweh.
  footnotes:
  - marker: a
    text: Or “was displeasing in Samuel’s eyes.” The Hebrew says literally that the matter “was evil” in Samuel’s eyes, expressing his strong negative judgment.
    reason: lexical_alternative
  - marker: b
    text: “To judge us” can also carry the sense “to govern us” or “to rule us.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 일이 사무엘의 눈에 악하게 보였습니다. 그들이 “우리에게 우리를 다스릴 왕을 주십시오”라고 말했기 때문입니다. 사무엘은 야훼께 기도했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “사무엘의 눈에 그 일이 악했다”입니다. 여기서는 강한 평가를 살려 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 ‘우리를 판단하다’뿐 아니라 ‘우리를 다스리다/통치하다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע הַדָּבָר
  english_pob_choice: was evil / the matter
  chosen_korean: 그 일이 … 악하게 보였습니다
  alternatives_korean:
  - 그 일이 … 불쾌하게 보였습니다
  - 그 일이 … 못마땅하게 보였습니다
  - 그 일이 … 나쁘게 보였습니다
  lexicon: HALOT
  rationale: וַיֵּרַע의 강한 평가성을 살려 ‘악하게’로 옮기되, 한국어에서는 ‘사무엘의 눈에’와 자연스럽게 이어지도록 구성했습니다.
- source_word: בְּעֵינֵי שְׁמוּאֵל
  english_pob_choice: in Samuel’s eyes
  chosen_korean: 사무엘의 눈에
  alternatives_korean:
  - 사무엘 보기에
  - 사무엘의 시각에서
  - 사무엘에게
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려 사무엘의 평가 기준을 드러냈습니다.
- source_word: לְשָׁפְטֵנוּ
  english_pob_choice: to judge us
  chosen_korean: 우리를 다스릴
  alternatives_korean:
  - 우리를 재판할
  - 우리를 심판할
  - 우리를 통치할
  lexicon: HALOT
  rationale: 문맥상 왕의 역할은 단순 판결보다 통치에 가깝지만, 문맥 안의 지배 기능을 살려 ‘다스릴’로 옮겼습니다. 'judge'의 사법적 어감은 과도하게 좁아질 수 있어 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 이 프로젝트의 기본 표기인 ‘야훼’를 따랐습니다.
theological_decisions:
- issue: 사무엘의 부정적 반응을 어떻게 반영할지
  chosen_reading: ‘악하게 보였습니다’로 옮겨, 단순한 감정적 불쾌감보다 평가적·도덕적 무게를 살렸습니다.
  alternative_readings:
  - ‘못마땅하게 보였습니다’
  - ‘불쾌하게 보였습니다’
  rationale: 히브리어는 단순 감정보다 ‘나쁘다/악하다’는 평가를 사용하므로, 그 긴장을 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: 'Translation philosophy: preserve original-language primacy and theological tension'
