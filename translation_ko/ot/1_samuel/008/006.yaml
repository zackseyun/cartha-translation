  - 사무엘에게
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려 사무엘의 평가 기준을 드러냈습니다.
- source_word: לְשָׁפְטֵנוּ
  english_pob_choice: to judge us
  chosen_korean: 우리를 다스릴
  alternatives_korean:
  - 우리를 재판할
  - 우리를 심판할
  - 우리를 통치할
  lexicon: HALOT
  rationale: 문맥상 왕의 역할은 단순 판결보다 통치에 가깝지만, 문맥 안의 지배 기능을 살려 ‘다스릴’로 옮겼습니다. 'judge'의 사법적 어감은 과도하게 좁아질 수 있어 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 이 프로젝트의 기본 표기인 ‘야훼’를 따랐습니다.
theological_decisions:
- issue: 사무엘의 부정적 반응을 어떻게 반영할지
  chosen_reading: ‘악하게 보였습니다’로 옮겨, 단순한 감정적 불쾌감보다 평가적·도덕적 무게를 살렸습니다.
  alternative_readings:
  - ‘못마땅하게 보였습니다’
  - ‘불쾌하게 보였습니다’
  rationale: 히브리어는 단순 감정보다 ‘나쁘다/악하다’는 평가를 사용하므로, 그 긴장을 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: 'Translation philosophy: preserve original-language primacy and theological tension'
