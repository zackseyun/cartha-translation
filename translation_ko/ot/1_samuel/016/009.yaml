    text: גַּם은 앞서 지나간 아들들에 이 사람을 덧붙이는 말입니다. 부정문에서는 ‘이 사람도 …하지 않으셨습니다’가 그 의미를 자연스럽게 나타냅니다.
    reason: lexical_alternative
