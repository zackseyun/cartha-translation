base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/010.yaml
  text: So Jesse had seven of his sons pass before Samuel, and Samuel said to Jesse, “Yahweh has not chosen any of these.”
translation:
  language: ko
  text: 이새가 아들 일곱 명을 사무엘 앞에 지나가게 했습니다. 사무엘이 이새에게 말했습니다. “야훼께서는 이들 중 아무도 선택하지 않으셨습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  english_pob_choice: had ... pass before
  chosen_korean: 지나가게 하자
  alternatives_korean:
  - 지나가게 했습니다
  - 앞에 세웠습니다
  - 사무엘 앞을 지나가게 하자
  lexicon: HALOT
  rationale: 히필형의 사역성을 살려 이새가 아들들을 사무엘 앞에 차례로 나오게 했다는 뜻을 자연스럽게 표현했습니다.
- source_word: שִׁבְעַת בָּנָיו
  english_pob_choice: seven of his sons
  chosen_korean: 자기 아들 일곱 명을
  alternatives_korean:
  - 그의 일곱 아들을
  - 아들 일곱 명을
  lexicon: HALOT
  rationale: 히브리어 구조상 ‘일곱 명의 아들들’이라는 수량 표현을 그대로 반영하되, 문맥상 소유를 분명히 하여 읽기 쉽게 옮겼습니다.
- source_word: לִפְנֵי
  english_pob_choice: before
  chosen_korean: 사무엘 앞에
  alternatives_korean:
  - 사무엘 앞에서
  - 사무엘 면전에
  lexicon: HALOT
  rationale: ‘앞에/앞으로’라는 공간 관계를 한국어로 자연스럽게 살렸습니다.
- source_word: לֹא בָחַר יְהוָה בָּאֵלֶּה
  english_pob_choice: Yahweh has not chosen any of these
  chosen_korean: 야훼께서 이들 가운데서는 선택하지 않으셨습니다
  alternatives_korean:
  - 야훼께서 이들 중 누구도 선택하지 않으셨습니다
  - 야훼께서는 이들 가운데 아무도 택하지 않으셨습니다
  lexicon: HALOT
  rationale: בחר의 기본 의미를 ‘선택하다’로 살렸고, בָּאֵלֶּה는 ‘이들 가운데서는’으로 옮겨 배제의 뜻을 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명기적 고유명사를 직역적으로 드러내기 위해 전통적 대체어보다 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 본문의 יְהוָה를 고유명사 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 음역
  rationale: 이 절은 하나님의 언약 이름을 직접 사용하므로, 이를 호칭으로 바꾸지 않고 고유명사로 보존하는 것이 원문 의미를 더 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
