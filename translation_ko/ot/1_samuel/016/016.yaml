revisions:
- from: “제발 우리 주께서 당신 앞에 있는 당신의 종들에게 말하게 하시어, 수금 연주를 잘하는 사람을 찾아보게 하십시오. 그리고 하나님의 영이 당신 위에 악하게 임할 때, 그가 손으로 연주하면 당신에게 유익할 것입니다.”[a]
  to: “부디 우리 주께서는 주님을 모시고 있는 신하들에게 명령하셔서 수금을 잘 타는 사람을 찾게 하십시오. 하나님에게서 온 해로운 영이 당신에게 임할 때, 그가 손으로 연주하면 당신에게 좋을 것입니다.”[a]
  rationale: 수식 관계를 바로잡아 영의 성격을 명시하고, 하나님과의 관계에 대한 히브리어의 소유격/출처격 가능성을 각주에 보존했습니다. 궁정 장면의 정중한 요청과 왕이 신하들에게 내릴 지시의 구조를 현대 합쇼체로 자연스럽게 다듬었습니다. ‘손으로’와 결과 표현은 원문의 구체성과 넓은 의미를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:20:29Z'
review_pass:
  verdict: revise
  source_fidelity: 현 번역의 ‘하나님의 영이 당신 위에 악하게 임할 때’는 히브리어 רוּחַ אֱלֹהִים רָעָה에서 רָעָה가 ‘영’을 수식하는 구조를 ‘임하다’를 수식하는 부사로 바꾸며, ‘하나님의 영’과 ‘악한/해로운 영’의 구별도 흐립니다. ‘하나님에게서 온 해로운 영’으로 고쳐 출처와 성격을 모두 드러내야 합니다. ‘그가 손으로 연주하면’은 조건절보다, 해당 상황에서 연주할 미래 행동을 잇는 표현이 더 충실합니다.
  naturalness: ‘당신 앞에 있는 당신의 종들’과 ‘당신 위에’는 한국어 궁정 발화로 부자연스럽고 반복적입니다. ‘주님을 모시고 있는 신하들’ 및 ‘당신에게 임할 때’가 현대 표준어 합쇼체에서 자연스럽습니다. ‘수금을 잘 타는’은 수금에 어울리는 자연스러운 동사입니다.
  terminology: כִּנּוֹר는 ‘수금’으로 유지할 수 있습니다. אֲדֹנֵינוּ는 신적 호칭과 구별되는 궁정 존칭으로 ‘우리 주’가 적절합니다. רוּחַ אֱלֹהִים רָעָה는 본문에서 ‘하나님에게서 온 해로운 영’으로 옮기고, 각주에서 ‘하나님의 악한 영’ 및 ‘악한’의 가능성을 밝혀 출처·소유 관계와 רָעָה의 의미 폭을 보존합니다.
  issues:
  - severity: high
    issue: ‘하나님의 영이 당신 위에 악하게 임할 때’가 수식 관계를 바꿉니다.
    rationale: 히브리어 רָעָה는 ‘영’의 여성 단수 형용사이며, ‘임하다’의 방식을 뜻하지 않습니다. 따라서 영 자체가 악하거나 해롭다는 뜻을 명시해야 합니다.
  - severity: medium
    issue: 명령 내용의 연결이 불명확합니다.
    rationale: ‘말하게 하시어’는 왕이 신하들에게 말하여 사람을 찾도록 하라는 제안의 구조를 충분히 드러내지 못합니다. ‘명령하셔서 … 찾게 하십시오’가 원문의 사역적 제안을 자연스럽게 표현합니다.
  - severity: low
    issue: 각주의 대안 제시가 본문과 맞물리지 않습니다.
    rationale: 현 본문은 ‘하나님의 영’이라 하고 각주는 ‘하나님에게서 온 악한 영’을 대안으로 제시하여 핵심 명사의 의미가 뒤바뀝니다. 본문과 각주를 일관되게 정리해야 합니다.
