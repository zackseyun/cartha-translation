  text: יֹאמַר נָ֤א אֲדֹנֵ֨/נוּ֙ עֲבָדֶ֣י/ךָ לְ/פָנֶ֔י/ךָ יְבַקְשׁ֕וּ אִ֕ישׁ יֹדֵ֖עַ מְנַגֵּ֣ן בַּ/כִּנּ֑וֹר וְ/הָיָ֗ה בִּֽ/הְי֨וֹת עָלֶ֤י/ךָ רֽוּחַ אֱלֹהִים֙ רָעָ֔ה וְ/נִגֵּ֥ן בְּ/יָד֖/וֹ וְ/ט֥וֹב לָֽ/ךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/016.yaml
  text: Please let our lord say to your servants before you that they should seek out a man who knows how to play the lyre; and when a harmful spirit from God is upon you[a], he will play with his hand, and it will be well for you.
  footnotes:
  - marker: a
    text: Or 'a harmful spirit from God'; Hebrew 'an evil/harmful spirit of/from God.'
    reason: alternative_reading
translation:
  language: ko
  text: “부디 우리 주께서는 주님을 모시고 있는 신하들에게 명령하셔서 수금을 잘 타는 사람을 찾게 하십시오. 하나님에게서 온 해로운 영이 당신에게 임할 때, 그가 손으로 연주하면 당신에게 좋을 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 악한 영’. 히브리어는 직역하면 ‘하나님의 악한/해로운 영’이며, ‘하나님에게서 온’으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹאמַר נָא אֲדֹנֵנוּ
  english_pob_choice: Please let our lord say
  chosen_korean: 제발 우리 주께서 말씀하게 하십시오
  alternatives_korean:
  - 우리 주께서 말씀하시게 해 주십시오
  - 부디 우리 주께서 말씀하게 하십시오
  lexicon: HALOT
  rationale: נא의 간청 뉘앙스를 살리면서, 왕에게 드리는 정중한 요청을 합쇼체로 자연스럽게 옮겼습니다.
- source_word: עֲבָדֶיךָ לְפָנֶיךָ
  english_pob_choice: your servants before you
  chosen_korean: 당신 앞에 있는 당신의 종들
  alternatives_korean:
  - 당신 앞에서 시중드는 종들
  - 당신을 모시고 있는 종들
  lexicon: HALOT
  rationale: 궁정에서 왕 앞에 서 있는 신하들의 위치를 한국어의 자연스러운 관용으로 옮겼습니다.
- source_word: יֹדֵעַ מְנַגֵּן בַּכִּנּוֹר
  english_pob_choice: who knows how to play the lyre
  chosen_korean: 수금 연주를 잘하는 사람
  alternatives_korean:
  - 수금을 연주할 줄 아는 사람
  - 수금에 능한 사람
  lexicon: HALOT
  rationale: כִּנּוֹר를 전통적이면서도 이해 가능한 ‘수금’으로 옮기고, יודע + מנגן의 숙련 의미를 ‘연주를 잘하는’으로 표현했습니다.
- source_word: רוּחַ אֱלֹהִים רָעָה
  english_pob_choice: a harmful spirit from God
  chosen_korean: 하나님의 영이 당신 위에 악하게 임할 때
  alternatives_korean:
  - 하나님에게서 온 악한 영이 당신 위에 있을 때
  - 하나님께로부터 온 해로운 영이 당신 위에 있을 때
  lexicon: HALOT
  rationale: POB가 보존한 ‘from God’의 긴장을 한국어에서 ‘하나님의 영’으로 직역에 가깝게 유지하되, רָעָה의 성격을 ‘악하게’로 풀어 주어 해석을 과도하게 고정하지 않았습니다.
- source_word: וְנִגֵּן בְּיָדוֹ
  english_pob_choice: he will play with his hand
  chosen_korean: 그가 손으로 연주하면
  alternatives_korean:
  - 그가 손으로 타면
  - 그가 손으로 연주할 때
  lexicon: HALOT
  rationale: ‘손으로’라는 히브리어의 구체적 표현을 살리되, 한국어에서는 악기 연주의 일반적 표현으로 자연스럽게 옮겼습니다.
- source_word: וְטוֹב לָךְ
  english_pob_choice: it will be well for you
  chosen_korean: 당신에게 유익할 것입니다
  alternatives_korean:
  - 당신에게 좋을 것입니다
  - 당신이 편안해질 것입니다
  lexicon: HALOT
  rationale: 결과의 넓은 의미를 살리면서, 단순한 감정적 완화보다 실제적 유익을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: רוּחַ אֱלֹהִים רָעָה를 한국어에서 어떻게 처리해 문맥의 긴장을 유지할 것인가
  chosen_reading: ‘하나님의 영이 당신 위에 악하게 임할 때’로 옮겨, 출처/허용의 긴장을 보존했습니다.
  alternative_readings:
  - ‘하나님에게서 온 악한 영이 당신 위에 있을 때’
  - ‘하나님께로부터 온 해로운 영이 당신 위에 있을 때’
  rationale: 사무엘상 본문은 영의 출처를 하나님께 연결하면서도 그 성격을 רָעָה로 규정합니다. 이를 풀어 해석하지 않고, 출처와 악성의 긴장을 함께 남겨 두는 것이 본문의 의미를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
