  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֵ֣יךְ אֵלֵ֔ךְ וְ/שָׁמַ֥ע שָׁא֖וּל וַ/הֲרָגָ֑/נִי וַ/יֹּ֣אמֶר יְהוָ֗ה עֶגְלַ֤ת בָּקָר֙ תִּקַּ֣ח בְּ/יָדֶ֔/ךָ וְ/אָ֣מַרְתָּ֔ לִ/זְבֹּ֥חַ לַֽ/יהוָ֖ה בָּֽאתִיס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/002.yaml
  text: Samuel said[a], “How can I go? If Saul hears, he will kill me.” And Yahweh said, “Take a heifer with you and say, ‘I have come to sacrifice to Yahweh.’”
  footnotes:
  - marker: a
    text: Or, 'Take a young cow with you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘이 말했습니다[a]. “제가 어떻게 갈 수 있겠습니까? 사울이 들으면 저를 죽일 것입니다.” 야훼께서 말씀하셨습니다. “암송아지 하나를 가지고 가서, ‘제가 야훼께 제사를 드리러 왔습니다’라고 말하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어린 암소 하나를 가지고 가라.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ אֵלֵךְ
  english_pob_choice: How can I go?
  chosen_korean: 제가 어떻게 갈 수 있겠습니까?
  alternatives_korean:
  - 제가 어떻게 가겠습니까?
  - 어떻게 제가 갈 수 있겠습니까?
  lexicon: HALOT
  rationale: 사무엘의 질문은 단순한 이동이 아니라 현실적 가능성에 대한 난관을 드러내므로, 한국어에서도 ‘어떻게 갈 수 있겠습니까?’로 자연스럽게 옮겼습니다.
- source_word: וְשָׁמַע שָׁאוּל וַהֲרָגַנִי
  english_pob_choice: If Saul hears, he will kill me.
  chosen_korean: 사울이 들으면 저를 죽일 것입니다.
  alternatives_korean:
  - 사울이 들으면 저를 죽이겠지요.
  - 사울이 들으면 저를 죽일 터입니다.
  lexicon: HALOT
  rationale: 조건절의 뜻을 살려 ‘들으면’으로 옮기고, 결과 절은 직접적 위협을 유지하도록 ‘죽일 것입니다’로 번역했습니다.
- source_word: עֶגְלַת בָּקָר
  english_pob_choice: a heifer
  chosen_korean: 암송아지 하나
  alternatives_korean:
  - 어린 암소 한 마리
  - 암소 한 마리
  lexicon: HALOT
  rationale: 제물로 드릴 어린 암컷 소를 가리키므로, 영어 POB의 ‘heifer’에 대응하는 말로 ‘암송아지’가 가장 정확합니다.
- source_word: לִזְבֹּחַ לַיהוָה
  english_pob_choice: to sacrifice to Yahweh
  chosen_korean: 야훼께 제사를 드리러
  alternatives_korean:
  - 야훼께 희생제사를 드리러
  - 야훼께 제사하려고
  lexicon: HALOT
  rationale: 동사의 제의적 의미를 살리되 한국어에서는 목적을 밝히는 자연스러운 표현으로 ‘제사를 드리러’라고 옮겼습니다. ‘야훼’는 본문의 신명사 יְהוָה를 반영합니다.
- source_word: בָּאתִי
  english_pob_choice: I have come
  chosen_korean: 제가 … 왔습니다
  alternatives_korean:
  - 제가 … 왔습니다
  - 제가 … 오게 되었습니다
  lexicon: HALOT
  rationale: 완료형 직설 화법을 한국어의 결과 완료 표현 ‘왔습니다’로 옮겨, 도착 후 목적 진술이라는 맥락을 자연스럽게 살렸습니다.
theological_decisions:
- issue: 사무엘과 야훼의 직접 화법에서의 존대 처리
  chosen_reading: 서술과 하나님의 말씀 모두 현대 합쇼체를 유지하되, 하나님의 직접 인용문은 ‘말씀하셨습니다’와 ‘하십시오’로 존대했습니다.
  alternative_readings:
  - 직접 인용문을 반말로 옮기는 방식
  - 본문 전체를 비격식으로 통일하는 방식
  rationale: 이 본문은 예언적 화법이지만, 표준 문어체 합쇼체를 유지하면서도 하나님의 말씀은 존대형으로 처리해 경외성과 가독성을 함께 확보했습니다.
  doctrine_reference: Korean style and reverence in direct divine speech
- issue: 여호와의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 인용하는 본문 자체에 신명사 יְהוָה가 있으므로, 본 프로젝트 기준에 따라 인격적 고유명으로서 ‘야훼’를 유지했습니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → Yahweh
