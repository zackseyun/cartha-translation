base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/020.yaml
  text: So Jesse took a donkey[a], bread, a skin of wine, and one young goat[b], and sent them by the hand of David his son to Saul.
  footnotes:
  - marker: a
    text: Literally, 'a donkey, bread'—that is, a donkey carrying or loaded with bread.
    reason: lexical_alternative
  - marker: b
    text: Or 'through David his son'; Hebrew 'by the hand of David his son' is an idiom for agency or delivery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 이새는 당나귀와 빵, 포도주 가죽부대 하나, 그리고 어린 염소 한 마리를 가져다가, 그의 아들 다윗의 손을 통해 사울에게 보냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘당나귀, 빵’은 당나귀가 빵을 실어 나르는 상황을 가리키는 관용적 결합으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그의 아들 다윗의 손을 통해’는 대행 또는 전달을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹר לֶחֶם
  english_pob_choice: a donkey, bread
  chosen_korean: 당나귀와 빵
  alternatives_korean:
  - 빵을 실은 당나귀
  - 당나귀에 실린 빵
  lexicon: HALOT
  rationale: 히브리어는 당나귀와 빵을 병치하지만 관계를 명시하지 않으므로, 한국어에서는 자연스럽게 나열하되 운반 관계는 과도하게 풀어쓰지 않았습니다.
- source_word: נֹאד יַיִן
  english_pob_choice: a skin of wine
  chosen_korean: 포도주 가죽부대 하나
