  - 포도주 부대 하나
  lexicon: HALOT
  rationale: נֹאד는 가죽 용기를 가리키므로, 현대 한국어에서 의미가 분명하도록 ‘가죽부대’로 옮겼습니다.
- source_word: גְּדִי עִזִּים אֶחָד
  english_pob_choice: one young goat
  chosen_korean: 어린 염소 한 마리
  alternatives_korean:
  - 염소 새끼 한 마리
  - 어린 염소 한 마리
  lexicon: HALOT
  rationale: 표현의 핵심은 ‘어린 염소’라는 나이 정보와 단수성이므로, 한국어의 자연스러운 동물 수량 표현을 택했습니다.
- source_word: בְּיַד דָּוִד בְּנוֹ
  english_pob_choice: by the hand of David his son
  chosen_korean: 그의 아들 다윗의 손을 통해
  alternatives_korean:
  - 그의 아들 다윗을 통해
  - 그의 아들 다윗의 손으로
  lexicon: HALOT
  rationale: 이 관용구는 전달·대행의 의미를 가지므로, ‘손을 통해’로 옮겨 히브리어 색채를 살리면서도 기능을 분명히 했습니다.
theological_decisions:
- issue: 히브리어 관용구 בְּיַד 의 처리
  chosen_reading: 전달의 수단을 드러내는 관용적 표현으로 번역했습니다.
  alternative_readings:
  - 직역하여 ‘다윗의 손으로’
  - 의미역으로 ‘다윗을 통해’
  rationale: 본문은 단순한 신체 부위를 말하는 것이 아니라, 다윗이 물품을 전달하는 대행자임을 보여 주므로 그 기능을 한국어에서 드러내야 합니다.
  doctrine_reference: 본문해석/서술문맥
