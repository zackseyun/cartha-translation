base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/020.yaml
  text: So Jesse took a donkey[a], bread, a skin of wine, and one young goat[b], and sent them by the hand of David his son to Saul.
  footnotes:
  - marker: a
    text: Literally, 'a donkey, bread'—that is, a donkey carrying or loaded with bread.
    reason: lexical_alternative
  - marker: b
    text: Or 'through David his son'; Hebrew 'by the hand of David his son' is an idiom for agency or delivery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 이새는 빵을 실은 당나귀[a] 한 마리와 포도주 가죽부대 하나와 어린 염소 한 마리를 가져다가, 그것들을 그의 아들 다윗을 통해[b] 사울에게 보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘당나귀, 빵’이라고 병치합니다. 문맥상 빵을 실어 나르는 당나귀를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그의 아들 다윗의 손으로’입니다. 여기서는 다윗이 물품을 전달하는 사람이라는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
