    text: 또는 ‘부디 다윗이 내 앞에 머물게 하십시오’로 옮길 수 있습니다. 이는 다윗이 계속 사울을 섬기며 곁에 있게 하라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: Then Saul sent
  chosen_korean: 사울이 사람을 보내어
  alternatives_korean:
  - 사울이 보냈습니다
  - 사울이 사람을 보냈습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 서술의 진행을 나타내므로 ‘사람을 보내어’로 자연스럽게 풀어, 뒤의 직접화법이 이어지는 흐름을 살렸습니다.
- source_word: יַעֲמָד נָא / לְפָנַי
  english_pob_choice: Please let David stand before me
  chosen_korean: 다윗이 내 앞에 서 있게 하십시오
  alternatives_korean:
  - 다윗이 내 앞에 머물게 하십시오
  - 다윗이 내 앞에서 시중들게 하십시오
  lexicon: HALOT
  rationale: 직역하면 ‘서다’이지만 궁정 맥락상 왕 앞에 상시 대기하는 뜻이 있으므로, ‘서 있게 하십시오’로 본문의 이미지와 의미를 함께 살렸습니다.
- source_word: מָצָא חֵן בְּעֵינַי
  english_pob_choice: has found favor in my eyes
  chosen_korean: 내 눈에 호의를 얻었기 때문입니다
  alternatives_korean:
  - 내 눈에 은혜를 얻었기 때문입니다
  - 내가 좋게 보았기 때문입니다
  lexicon: HALOT
  rationale: מָצָא חֵן은 관용적으로 ‘호의를 얻다/은총을 입다’는 뜻이지만, 이 문맥에서는 왕의 평가를 가리키므로 ‘호의’를 택해 신학적 어감 과잉을 피했습니다.
- source_word: יִשַׁי / דָוִד / שָׁאוּל
  english_pob_choice: Jesse / David / Saul
  chosen_korean: 이새 / 다윗 / 사울
  alternatives_korean:
  - 예시 / 다윗 / 사울
  lexicon: standard transliteration conventions
  rationale: 고유명사는 현대 한국어 성경에서 널리 쓰이는 음역을 따랐습니다.
theological_decisions:
- issue: 왕의 요청을 나타내는 공손한 명령 형태
  chosen_reading: “부디 … 하십시오”로 공손한 요청을 나타냈습니다.
  alternative_readings:
