  text: וַ/יִּשְׁלַ֣ח שָׁא֔וּל אֶל יִשַׁ֖י לֵ/אמֹ֑ר יַעֲמָד נָ֤א דָוִד֙ לְ/פָנַ֔/י כִּֽי מָ֥צָא חֵ֖ן בְּ/עֵינָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/022.yaml
  text: Then Saul sent to Jesse[a], saying, “Please let David stand before me, for he has found favor in my eyes.”
  footnotes:
  - marker: a
    text: Or 'Please let David remain before me,' with the sense of continuing in Saul's service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울이 이새에게 사람을 보내어 말했습니다. “부디 다윗이 내 앞에 서 있게 하십시오. 그가 내 눈에 호의를 얻었기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부디 다윗이 내 앞에 머물게 하십시오’로도 옮길 수 있는데, 계속해서 사울의 시중에 있게 하라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: Then Saul sent
  chosen_korean: 사울이 사람을 보내어
  alternatives_korean:
  - 사울이 보냈습니다
  - 사울이 사람을 보냈습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 서술의 진행을 나타내므로 ‘사람을 보내어’로 자연스럽게 풀어, 뒤의 직접화법이 이어지는 흐름을 살렸습니다.
- source_word: יַעֲמָד נָא / לְפָנַי
  english_pob_choice: Please let David stand before me
  chosen_korean: 다윗이 내 앞에 서 있게 하십시오
  alternatives_korean:
  - 다윗이 내 앞에 머물게 하십시오
  - 다윗이 내 앞에서 시중들게 하십시오
  lexicon: HALOT
  rationale: 직역하면 ‘서다’이지만 궁정 맥락상 왕 앞에 상시 대기하는 뜻이 있으므로, ‘서 있게 하십시오’로 본문의 이미지와 의미를 함께 살렸습니다.
- source_word: מָצָא חֵן בְּעֵינַי
  english_pob_choice: has found favor in my eyes
  chosen_korean: 내 눈에 호의를 얻었기 때문입니다
  alternatives_korean:
  - 내 눈에 은혜를 얻었기 때문입니다
  - 내가 좋게 보았기 때문입니다
  lexicon: HALOT
  rationale: מָצָא חֵן은 관용적으로 ‘호의를 얻다/은총을 입다’는 뜻이지만, 이 문맥에서는 왕의 평가를 가리키므로 ‘호의’를 택해 신학적 어감 과잉을 피했습니다.
- source_word: יִשַׁי / דָוִד / שָׁאוּל
  english_pob_choice: Jesse / David / Saul
  chosen_korean: 이새 / 다윗 / 사울
  alternatives_korean:
  - 예시 / 다윗 / 사울
  lexicon: standard transliteration conventions
  rationale: 고유명사는 현대 한국어 성경에서 널리 쓰이는 음역을 따랐습니다.
theological_decisions:
- issue: 왕의 요청을 나타내는 공손한 명령 형태
  chosen_reading: “부디 … 하십시오”로 공손한 요청을 나타냈습니다.
  alternative_readings:
  - “… 해 주십시오”
  - 평서형으로 완화
  rationale: נָא가 덧붙은 요청이므로 한국어에서도 명령이 아니라 예의 있는 청원으로 들리게 했습니다.
  doctrine_reference: 서사체 발화의 화용론
