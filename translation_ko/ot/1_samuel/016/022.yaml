translation:
  language: ko
  text: 그때 사울이 이새에게 사람을 보내어 이렇게 전했습니다. “부디 다윗이 내 앞에 서 있게 하십시오.”[a] “그가 내 눈에 들었기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
