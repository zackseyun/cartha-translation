translation:
  language: ko
  text: 이새를 제사로 부르십시오[a]. 그러면 내가 당신에게 무엇을 해야 할지 알려 주겠습니다[b][c]. 그리고 당신은 내가 당신에게 말하는 이를 나를 위하여 기름부으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제사에 맞추어 이새를 부르십시오.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘무엇을 해야 하는지 내가 당신에게 보여 주겠습니다.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내가 당신에게 말하는 그이를 당신은 기름부으십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרָאתָ
  english_pob_choice: Invite
  chosen_korean: 부르십시오
  alternatives_korean:
  - 초대하십시오
  - 소집하십시오
  lexicon: HALOT
  rationale: 제사 자리로 사람을 오게 하라는 뜻이므로, 자연스러운 현대 한국어로는 ‘부르십시오’가 가장 직접적입니다.
- source_word: בַּזָּבַח
  english_pob_choice: to the sacrifice
  chosen_korean: 제사로
  alternatives_korean:
  - 제사에
  - 희생 제물로
  lexicon: HALOT
  rationale: זבח은 제사 행위/제사 자리의 의미이므로, ‘제사로’가 초청의 목적을 간결하게 드러냅니다.
- source_word: אוֹדִיעֲךָ
  english_pob_choice: will make known to you
  chosen_korean: 알려 주겠습니다
  alternatives_korean:
  - 알게 하겠습니다
  - 보여 드리겠습니다
  - 말해 주겠습니다
  lexicon: HALOT
  rationale: 히필형의 ‘알게 하다/알려 주다’라는 인과적 뉘앙스를 살리면서도 한국어로 자연스럽게 옮겼습니다.
- source_word: וּמָשַׁחְתָּ לִי
  english_pob_choice: you shall anoint for me
  chosen_korean: 나를 위하여 기름부으십시오
  alternatives_korean:
  - 내게 기름부으십시오
  - 나를 위해 기름부으십시오
  lexicon: HALOT
  rationale: ‘לִי’는 단순한 방향보다 하나님을 위한 행위를 나타내므로, ‘나를 위하여’가 목적/대리의 관계를 가장 잘 드러냅니다.
theological_decisions:
- issue: 기름부음의 대상과 직분을 본문에 어디까지 명시할 것인가
  chosen_reading: 본절 자체는 직분을 명시하지 않고 ‘기름부으십시오’로 유지했습니다.
  alternative_readings:
  - ‘왕으로 기름부으십시오’처럼 직분을 명시함
  rationale: 문맥상 왕위 기름부음이 함의되더라도, 본문 자체가 말하지 않는 내용을 번역문에 덧붙이지 않았습니다.
  doctrine_reference: 'translation philosophy: 본문이 말하지 않는 것을 번역이 앞서 규정하지 않음'
