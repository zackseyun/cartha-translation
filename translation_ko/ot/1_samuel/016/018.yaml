base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/018.yaml
  text: Then one of the young men answered and said[a], “Look, I have seen a son of Jesse the Bethlehemite who is skillful in playing, a mighty man of valor, a man of war, prudent in speech, and a handsome man[d][c][b], and Yahweh is with him.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Bethlehemite,'' a gentilic meaning ''from Bethlehem.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'skillful in playing'; the instrument is not named in this verse, though the context concerns playing for Saul.
    reason: lexical_alternative
  - marker: c
    text: '''Mighty man of valor'' can also mean ''valiant warrior'' or more broadly ''capable man.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'who knows how to play, a mighty man of valor, a man of war, prudent in speech, a handsome man'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 젊은 사람들 가운데 한 사람이 대답하여 말했습니다. 「보십시오, 내가 이새의 아들, 곧 베들레헴 사람을 보았습니다. 그는 악기를 잘 타는 사람이고, 용맹한 군인이며, 전사이고, 말을 분별 있게 하는 사람이며, 잘생긴 사람인데, 야훼께서 그와 함께 계십니다.」[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘베들레헴 사람’은 히브리어의 종족형 표현으로, 문자적으로는 ‘베들레헴 출신’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘연주에 능한 사람’ 정도의 뜻이며, 본절 자체에는 악기 이름이 나오지 않습니다.
    reason: source_note
  - marker: c
    text: ‘용맹한 군인’은 ‘용사’ 또는 더 넓게는 ‘유능한 사람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 이 문장은 ‘악기를 잘 타는 사람, 용맹한 군인, 전사, 말을 분별 있게 하는 사람, 잘생긴 사람’으로 나눠 볼 수도 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 대화 도입 관용구를 자연스러운 한국어 서술로 옮기되, ‘대답하여’로 응답의 뉘앙스를 살렸습니다.
- source_word: אֶחָד מֵהַנְּעָרִים
  english_pob_choice: one of the young men
  chosen_korean: 젊은 사람들 가운데 한 사람
  alternatives_korean:
  - 젊은이들 가운데 한 사람
  - 시종들 가운데 한 사람
  - 청년들 가운데 한 사람
  lexicon: HALOT
  rationale: 궁정 시종일 가능성이 있어도 문맥에 과도하게 좁히지 않고, 표면형에 가까운 ‘젊은 사람들 가운데 한 사람’으로 옮겼습니다.
- source_word: בֵּית הַלַּחְמִי
  english_pob_choice: the Bethlehemite
  chosen_korean: 베들레헴 사람
  alternatives_korean:
  - 베들레헴 사람인
  - 베들레헴 출신
  lexicon: HALOT
  rationale: 지명에서 나온 종족형 형용사를 한국어에서는 가장 자연스럽게 ‘~사람’으로 풀어 옮겼습니다.
- source_word: יֹדֵעַ נַגֵּן
  english_pob_choice: who is skillful in playing
  chosen_korean: 악기를 잘 타는 사람
  alternatives_korean:
  - 연주를 잘하는 사람
  - 연주에 능한 사람
  - 악기를 능숙하게 다루는 사람
  lexicon: HALOT
  rationale: 악기명은 본절에 없지만 문맥상 연주를 가리키므로, 의미를 살리되 구체화는 최소화하여 옮겼습니다.
- source_word: נְבוֹן דָּבָר
  english_pob_choice: prudent in speech
  chosen_korean: 말을 분별 있게 하는 사람
  alternatives_korean:
  - 말이 분별 있는 사람
  - 신중하게 말하는 사람
  - 말을 잘 알아듣는 사람
  lexicon: HALOT
  rationale: ‘דָּבָר’가 말/사안을 모두 가리킬 수 있으나, POB의 ‘prudent in speech’에 맞춰 말과 분별의 결합을 살렸습니다.
- source_word: וַיהוָה עִמּוֹ
  english_pob_choice: Yahweh is with him
  chosen_korean: 야훼께서 그와 함께 계십니다
  alternatives_korean:
  - 야훼께서 그와 함께하십니다
  - 주님께서 그와 함께 계십니다
  lexicon: HALOT
  rationale: 본문의 신명 표기 יְהוָה를 프로젝트 기본값대로 ‘야훼’로 옮기고, 현재형 서술로 하나님의 동행을 드러냈습니다.
theological_decisions:
