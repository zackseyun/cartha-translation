base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/021.yaml
  text: So David came to Saul and stood before him[a], and Saul loved him greatly, and he became his armor-bearer.
  footnotes:
  - marker: a
    text: Or 'his weapons-bearer' or 'bearer of arms.' The Hebrew literally refers to one who carries military equipment.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 사울에게 와서 그의 앞에 섰습니다. 사울은 그를 매우 사랑했고, 다윗은 그의 무기 든 사람이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '무기/전쟁 장비를 드는 사람'을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא דָוִד אֶל שָׁאוּל
  english_pob_choice: came to Saul
  chosen_korean: 사울에게 와서
  alternatives_korean:
  - 사울에게 갔습니다
  - 사울에게 들어갔습니다
  lexicon: HALOT
  rationale: וּ/בוא의 서술적 이동을 자연스러운 한국어로 살리되, '사울에게'라는 방향성을 분명히 했습니다.
- source_word: וַיַּעֲמֹד לְפָנָיו
  english_pob_choice: stood before him
  chosen_korean: 그의 앞에 섰습니다
  alternatives_korean:
  - 그 앞에 서서 시중들었습니다
  - 그의 면전에 섰습니다
  lexicon: HALOT
  rationale: 직역적 이미지인 '서다/앞'를 유지해 본문이 가진 궁정 출입·대면의 뉘앙스를 과도하게 풀지 않았습니다.
- source_word: נֹשֵׂא כֵלִים
  english_pob_choice: armor-bearer
  chosen_korean: 무기 든 사람
  alternatives_korean:
  - 무기병
  - 갑옷받이가
  lexicon: HALOT
  rationale: 히브리어가 문자적으로는 전쟁 장비를 나르는 사람을 가리키므로, 전통 교회어보다 의미를 드러내는 '무기 든 사람'을 택했습니다.
