id: 1SA.16.13
reference: 1 Samuel 16:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶת קֶ֣רֶן הַ/שֶּׁ֗מֶן וַ/יִּמְשַׁ֣ח אֹת/וֹ֮ בְּ/קֶ֣רֶב אֶחָי/ו֒ וַ/תִּצְלַ֤ח רֽוּחַ יְהוָה֙ אֶל דָּוִ֔ד מֵ/הַ/יּ֥וֹם הַ/ה֖וּא וָ/מָ֑עְלָ/ה וַ/יָּ֣קָם שְׁמוּאֵ֔ל וַ/יֵּ֖לֶךְ הָ/רָמָֽתָ/ה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/013.yaml
  text: Then Samuel took the horn of oil and anointed him in the midst of his brothers[a]. And the Spirit of Yahweh rushed upon David from that day onward[b]. Then Samuel rose and went to Ramah.
  footnotes:
  - marker: a
    text: Or 'came powerfully upon David.' The Hebrew verb can denote a forceful, empowering coming of the Spirit.
    reason: lexical_alternative
  - marker: b
    text: Or 'the spirit of the LORD rushed upon David.' English capitalization reflects interpretation; Hebrew manuscripts do not mark this distinction.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 사무엘이 기름이 담긴 뿔을 가져다가 그의 형제들 한가운데서 그에게 기름을 부었습니다. 그러자 야훼의 영이 그날부터 이후로 다윗에게 힘 있게 임했습니다. 그 뒤 사무엘은 일어나 라마로 갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 영이 다윗에게 힘차게 임했다’입니다. 히브리어 동사는 영이 강력하게, 능력 주며 임하는 것을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여호와의 영이 다윗에게 임했다’입니다. 영어의 대문자 표기는 해석을 반영한 것이며, 히브리어 사본에는 이런 구분 표지가 없습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרֶן הַשֶּׁמֶן
  english_pob_choice: the horn of oil
  chosen_korean: 기름이 담긴 뿔
  alternatives_korean:
  - 기름 뿔
  - 기름 부음의 뿔
  - 기름 담은 뿔
  lexicon: HALOT
  rationale: קֶרֶן은 문자적으로 '뿔'이며, 용기의 구체성을 살려야 하므로 '뿔'을 유지했습니다. '기름이 담긴'은 속격 관계를 자연스러운 한국어로 풀어낸 것입니다.
- source_word: וַיִּמְשַׁח
  english_pob_choice: anointed
  chosen_korean: 기름을 부었습니다
  alternatives_korean:
  - 기름부었습니다
  - 기름을 발랐습니다
  - 봉헌했습니다
  lexicon: HALOT
  rationale: מָשַׁח는 왕권/성별의식과 연결되는 표준적 '기름 부음'을 가리키므로, 한국어에서도 그 의례적 의미가 드러나도록 옮겼습니다.
- source_word: בְּקֶרֶב אֶחָי/וֹ
  english_pob_choice: in the midst of his brothers
  chosen_korean: 그의 형제들 한가운데서
  alternatives_korean:
  - 그의 형제들 가운데서
  - 형제들 앞에서
  - 형제들 사이에서
  lexicon: HALOT
  rationale: בקרב의 핵심은 '한가운데'라는 공간적 표현이므로 이를 살렸고, 문맥상 דוד의 남자 형제들이므로 '형제들'로 옮겼습니다.
- source_word: וַתִּצְלַח רוּחַ יְהוָה אֶל דָּוִד
  english_pob_choice: the Spirit of Yahweh rushed upon David
  chosen_korean: 야훼의 영이 그날부터 이후로 다윗에게 힘 있게 임했습니다
  alternatives_korean:
  - 야훼의 영이 다윗에게 강하게 임했습니다
  - 야훼의 영이 다윗 위에 급히 임했습니다
  - 야훼의 영이 다윗에게 몰려왔습니다
  lexicon: HALOT
  rationale: צלח는 이 문맥에서 단순한 '오다'보다 강력하고 능력 주시는 임함을 나타내므로, 영어 POB의 'rushed upon'에 대응해 '힘 있게 임했습니다'로 옮겼습니다. '영'을 쓴 것은 히브리어 רוּחַ의 기본값을 따르기 위해서입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여기서는 신명기적 전승의 고유명사 יְהוָה를 직역 관례에 따라 '야훼'로 옮겨, 본문이 가진 고유한 신명성을 유지했습니다.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  english_pob_choice: from that day onward
  chosen_korean: 그날부터 이후로
  alternatives_korean:
  - 그날부터 앞으로
  - 그날 이후 계속해서
  - 그날부터 끝까지
  lexicon: HALOT
  rationale: 해당 표현은 시작점 이후의 지속을 나타내므로, 한국어에서 자연스럽고 지속성을 드러내는 '그날부터 이후로'를 선택했습니다.
- source_word: וַיָּקָם
  english_pob_choice: rose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어나서
  - 자리에서 일어나
  - 몸을 일으켜
  lexicon: HALOT
  rationale: 서사 진행에서 קום은 흔히 '일어나다'로 옮기며, 다음 동작으로 넘어가는 순서를 자연스럽게 연결합니다.
- source_word: הָרָמָתָה
  english_pob_choice: to Ramah
  chosen_korean: 라마로
  alternatives_korean:
  - 라마에
  - 라마까지
  - 라마 향해
  lexicon: HALOT
  rationale: 방향성 접미사를 살려 목적지를 나타내는 '-로'를 사용했고, 지명은 한국어에서 통용되는 '라마'를 택했습니다.
theological_decisions:
- issue: רוּחַ יְהוָה의 번역에서 영의 주체성과 능동성 보존
  chosen_reading: 야훼의 영이 다윗에게 힘 있게 임했습니다
  alternative_readings:
  - 야훼의 영이 다윗에게 임했습니다
  - 야훼의 영이 다윗 위에 임했습니다
  rationale: 사무엘서의 이 동사는 단순한 내적 감흥보다 하나님의 능력 있는 임재를 가리키므로, 그 역동성을 약화시키지 않도록 '힘 있게 임했습니다'를 택했습니다.
  doctrine_reference: 사무엘서의 성령/영 임재 서술은 능력 주심을 포함한다는 점을 반영
- issue: 이 구절의 기름 부음과 영의 임함을 분리하지 않고 함께 보존
  chosen_reading: 사무엘의 기름 부음 뒤에 야훼의 영이 다윗에게 임하는 순서를 그대로 유지했습니다
  alternative_readings:
  - 기름 부음과 영의 임함을 하나의 의식으로 압축
  - 영의 임함을 생략하고 기름 부음만 번역
  rationale: 본문은 왕적 기름 부음과 영의 임함을 연속적으로 제시하므로, 두 사건의 구분과 연결을 모두 드러내야 합니다.
  doctrine_reference: 본문의 서사적 신학 구조를 보존
