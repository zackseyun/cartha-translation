  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל אַל תַּבֵּ֧ט אֶל מַרְאֵ֛/הוּ וְ/אֶל גְּבֹ֥הַּ קוֹמָת֖/וֹ כִּ֣י מְאַסְתִּ֑י/הוּ כִּ֣י לֹ֗א אֲשֶׁ֤ר יִרְאֶה֙ הָ/אָדָ֔ם כִּ֤י הָֽ/אָדָם֙ יִרְאֶ֣ה לַ/עֵינַ֔יִם וַ/יהוָ֖ה יִרְאֶ֥ה לַ/לֵּבָֽב־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/007.yaml
  text: But Yahweh said to Samuel[a], “Do not look at his appearance or at the height of his stature, because I have rejected him. For not as man sees does God see, for man sees what is before the eyes[c][b], but Yahweh sees the heart.”
  footnotes:
  - marker: a
    text: Or, more literally, 'For not what man sees'; the Hebrew is elliptical, and the sense is that the LORD's way of seeing differs from man's.
    reason: lexical_alternative
  - marker: b
    text: '''Man'' here is generic, referring to human beings in general.'
    reason: lexical_alternative
  - marker: c
    text: Or 'For the LORD does not see as man sees, for man sees'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 야훼께서 사무엘에게 말씀하셨습니다. “그의 용모와 키 큰 몸집을 보지 마십시오. 내가 그를 거절하였습니다. 사람은 눈앞에 보이는 것을 보지만, 야훼께서는 마음을 보십니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유한 신명인 יְהוָה를 POB의 원칙에 따라 제목이 아니라 고유명으로 살려서 옮겼습니다.
- source_word: מַרְאֵהוּ
  english_pob_choice: his appearance
  chosen_korean: 그의 용모
  alternatives_korean:
  - 그의 외모
  - 그의 모습
  lexicon: HALOT
  rationale: 외형적 인상을 가리키는 말이므로, 본문의 대비(용모/키)와 잘 맞는 자연스러운 한국어로 옮겼습니다.
- source_word: גְּבֹהַּ קוֹמָתֹו
  english_pob_choice: the height of his stature
  chosen_korean: 키 큰 몸집
  alternatives_korean:
  - 그의 키 큰 체격
  - 그의 장대한 체구
  lexicon: HALOT
  rationale: 문자적으로는 키와 신장을 강조하는 표현이므로, 과장 없이 신체적 크기를 드러내는 표현으로 옮겼습니다.
- source_word: לַעֵינַיִם
  english_pob_choice: what is before the eyes
  chosen_korean: 눈앞에 보이는 것
  alternatives_korean:
  - 겉으로 드러난 것
  - 눈에 보이는 것
  lexicon: HALOT
  rationale: 히브리어의 관용적 이미지를 살리면서도, 한국어에서 자연스럽게 대비가 드러나도록 옮겼습니다.
- source_word: לַלֵּבָב
  english_pob_choice: the heart
  chosen_korean: 마음
  alternatives_korean:
  - 심령
  - 속사람
  lexicon: HALOT
  rationale: 히브리어 לֵבָב의 중심 의미를 살리되, 현대 한국어 독자가 즉시 이해할 수 있는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘사람’의 일반성 표현
  chosen_reading: 사람은 눈앞에 보이는 것을 보지만
  alternative_readings:
  - 인간은 눈앞에 보이는 것만 보지만
  - 사람은 겉모습만 보지만
  rationale: 히브리어 הָאָדָם은 여기서 특정 개인이 아니라 일반적인 인간을 가리키므로, 평이한 ‘사람’으로 보편성을 유지했습니다.
  doctrine_reference: '번역 원칙: אָדָם의 문맥적 일반성'
