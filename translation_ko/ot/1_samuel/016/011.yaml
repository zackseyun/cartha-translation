- from: 그때 사무엘이 이새에게 말했습니다. “이 젊은이들이 다입니까?” 그가 말했습니다. “아직 막내가 남아 있는데, 보십시오, 그는 양 떼를 치고 있습니다.” 그러자 사무엘이 이새에게 말했습니다. “사람을 보내 그를 데려오십시오. 그가 여기 올 때까지 우리는 자리에 앉지 않겠습니다.”[a][b]
  to: 그때 사무엘이 이새에게 말했습니다. “이 젊은이들이 다입니까?” 이새가 말했습니다. “아직 막내가 남아 있는데, 보십시오, 그는 양 떼를 치고 있습니다.”[a] 그러자 사무엘이 이새에게 말했습니다. “사람을 보내 그를 데려오게 하십시오. 그가 여기 올 때까지 우리는 자리에 앉지 않겠습니다.”[b]
