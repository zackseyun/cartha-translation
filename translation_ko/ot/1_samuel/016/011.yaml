  source_fidelity: 전반적으로 히브리어의 화자 전환, ‘아직 남아 있는 막내’, 양 떼를 치는 현재의 상황, 그리고 그가 올 때까지 앉지 않겠다는 선언을 충실히 옮겼습니다. 다만 שִׁלְחָה וְקָחֶנּוּ는 ‘사람을 보내 그를 데려오십시오’로도 뜻이 통하지만, 보낸 사람이 그를 데려오게 한다는 관계를 명시하면 한국어에서 더 정확하고 자연스럽습니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽습니다. ‘그가 말했습니다’는 바로 앞의 사무엘과 잠시 혼동될 수 있으므로 ‘이새가 말했습니다’로 밝혔습니다. 직접 인용 안의 ‘보십시오’는 הִנֵּה의 주의 환기 기능을 보존하면서 문체에도 맞습니다.
  terminology: 사무엘, 이새, 양 떼, 막내 등의 명칭과 표현은 적절합니다. ‘양 떼를 치고 있습니다’는 רֹעֶה בַּצֹּאן의 지속적 목축 행위를 잘 반영합니다.
