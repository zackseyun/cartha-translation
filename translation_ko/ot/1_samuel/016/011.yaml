source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֣ל אֶל יִשַׁי֮ הֲ/תַ֣מּוּ הַ/נְּעָרִים֒ וַ/יֹּ֗אמֶר ע֚וֹד שָׁאַ֣ר הַ/קָּטָ֔ן וְ/הִנֵּ֥ה רֹעֶ֖ה בַּ/צֹּ֑אן וַ/יֹּ֨אמֶר שְׁמוּאֵ֤ל אֶל יִשַׁי֙ שִׁלְחָ֣/ה וְ/קָחֶ֔/נּוּ כִּ֥י לֹא נָסֹ֖ב עַד בֹּא֥/וֹ פֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/011.yaml
  text: Then Samuel said to Jesse[a], “Are these all the young men?” And he said, “The youngest still remains, and behold, he is shepherding the flock.” Then Samuel said to Jesse, “Send and bring him[b], for we will not sit down until he comes here.”
  footnotes:
  - marker: a
    text: Or, “he is tending the sheep.” The Hebrew literally says “shepherding the flock.”
    reason: lexical_alternative
  - marker: b
    text: Or, “we will not sit around / take our place,” likely meaning they would not begin the meal or formal gathering until he arrived.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사무엘이 이새에게 말했습니다. “이 젊은이들이 다입니까?” 이새가 말했습니다. “아직 막내가 남아 있는데, 보십시오, 그는 양 떼를 치고 있습니다.”[a] 그러자 사무엘이 이새에게 말했습니다. “사람을 보내 그를 데려오게 하십시오. 그가 여기 올 때까지 우리는 자리에 앉지 않겠습니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘양 떼를 치고 있다’라고 합니다.
    reason: source_note
  - marker: b
    text: 히브리어 관용구로, 여기서는 ‘자리에 앉다/식사를 시작하다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַמּוּ
  english_pob_choice: Are these all
  chosen_korean: 다입니까?
  alternatives_korean:
  - 이것이 전부입니까?
  - 젊은이들이 다 끝났습니까?
  lexicon: HALOT
  rationale: 문맥상 이새가 내세운 아들들이 전부인지 묻는 말이므로, 자연스러운 한국어 의문문으로 압축해 전달했습니다.
- source_word: הַנְּעָרִים
  english_pob_choice: the young men
  chosen_korean: 이 젊은이들
  alternatives_korean:
  - 이 소년들
  - 이 청년들
  lexicon: HALOT
  rationale: 이새의 아들들을 가리키며 연령상 단순한 ‘소년들’보다 ‘젊은이들’이 자연스럽고, 성인에 가까운 자녀들임을 무리 없이 살립니다.
- source_word: וְהִנֵּה
  english_pob_choice: and look / behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 그리고 보십시오
  - 보라
  lexicon: HALOT
  rationale: 주의를 끄는 지시어로서, 문어체이면서도 현대 한국어에서 자연스러운 감탄/지시 기능을 살렸습니다.
- source_word: רֹעֶה בַּצֹּאן
  english_pob_choice: he is shepherding the flock
  chosen_korean: 양 떼를 치고 있습니다
  alternatives_korean:
  - 양 떼를 돌보고 있습니다
  - 무리를 목양하고 있습니다
  lexicon: HALOT
  rationale: רעה의 진행 중인 동작을 살리면서, ‘shepherding’의 의미를 한국어 동사구로 자연스럽게 옮겼습니다. ‘양 떼’는 צֹאן의 집합적 의미를 반영합니다.
- source_word: שִׁלְחָה וְקָחֶנּוּ
  english_pob_choice: Send and bring him
  chosen_korean: 사람을 보내 그를 데려오십시오
  alternatives_korean:
  - 보내어 그를 데려오십시오
  - 그를 불러오십시오
  lexicon: HALOT
  rationale: 두 동사가 연속된 명령이라는 점을 살리기 위해 ‘보내다’와 ‘데려오다’를 함께 유지했습니다. 한국어로는 대상이 생략되지 않게 ‘사람을’ 보충하는 것이 자연스럽습니다.
- source_word: לֹא נָסֹב
  english_pob_choice: we will not sit down
  chosen_korean: 우리는 자리에 앉지 않겠습니다
  alternatives_korean:
  - 우리는 앉지 않겠습니다
  - 우리는 자리를 잡지 않겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 뜻을 따르되, 식사나 공식 모임을 시작하지 않겠다는 맥락이 드러나도록 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 화자의 태도와 문체
  chosen_reading: 서술문은 합쇼체를 유지하고, 직접 인용문 안에서도 사무엘의 명령은 공손한 명령형으로 옮겼습니다.
  alternative_readings:
  - 인용문을 평서형으로 완화하는 방식
  - 더 고어적인 명령형을 쓰는 방식
  rationale: 이 구절은 예언적 말씀이 아니라 서사적 대화이므로, 현대 문어체의 공손한 대화체가 원문의 공적·서사적 긴장을 잘 보존합니다.
  doctrine_reference: 문체/화행 일관성
