  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל עַד מָתַי֙ אַתָּה֙ מִתְאַבֵּ֣ל אֶל שָׁא֔וּל וַ/אֲנִ֣י מְאַסְתִּ֔י/ו מִ/מְּלֹ֖ךְ עַל יִשְׂרָאֵ֑ל מַלֵּ֨א קַרְנְ/ךָ֜ שֶׁ֗מֶן וְ/לֵ֤ךְ אֶֽשְׁלָחֲ/ךָ֙ אֶל יִשַׁ֣י בֵּֽית הַלַּחְמִ֔י כִּֽי רָאִ֧יתִי בְּ/בָנָ֛י/ו לִ֖/י מֶֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/001.yaml
  text: And Yahweh said to Samuel[a], “How long will you grieve over Saul, since I have rejected him from being king over Israel? Fill your horn with oil and go; I am sending you to Jesse the Bethlehemite, for I have provided for myself a king among his sons.”
  footnotes:
  - marker: a
    text: Or, 'for I have provided for myself a king among his sons.' The Hebrew verb is literally 'seen,' but in context it can imply selection or provision.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 사무엘에게 말씀하셨습니다. “사울 때문에 언제까지 네가 슬퍼하겠느냐? 내가 그를 이스라엘의 왕이 되지 못하게 거절하였으니, 네 뿔에 기름을 채우고 가라. 내가 너를 베들레헴 사람 이새에게 보내겠다. 나는 그의 아들들 가운데서 나를 위해 한 왕을 보았다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 רָאִיתִי는 문자적으로는 ‘보았다’이지만, 문맥상 선택하거나 마련하셨다는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 언약적 고유명사를 제목어로 바꾸지 않고 음역해, 본문이 드러내는 하나님의 개인 이름을 보존했습니다.
- source_word: מִתְאַבֵּל
  english_pob_choice: grieve
  chosen_korean: 슬퍼하겠느냐
  alternatives_korean:
  - 애도하겠느냐
  - 슬퍼하고 있겠느냐
  lexicon: HALOT
  rationale: 장례적 뉘앙스가 강한 ‘애도하다’보다, 사울을 두고 느끼는 지속적 슬픔을 자연스럽게 드러내는 ‘슬퍼하다’가 적절합니다.
- source_word: מְאַסְתִּיו מִמְּלֹךְ עַל יִשְׂרָאֵל
  english_pob_choice: I have rejected him from being king over Israel
  chosen_korean: 내가 그를 이스라엘의 왕이 되지 못하게 거절하였으니
  alternatives_korean:
  - 내가 그를 이스라엘 위에 통치하지 못하게 버렸으니
  - 내가 그를 이스라엘을 다스리는 자리에서 물리쳤으니
  lexicon: HALOT
  rationale: ‘왕이 되지 못하게’는 통치 직무에서의 배제를 분명히 하면서도, מאס의 ‘거절하다/배척하다’ 의미를 유지합니다.
- source_word: מַלֵּא קַרְנְךָ שֶׁמֶן
  english_pob_choice: Fill your horn with oil
  chosen_korean: 네 뿔에 기름을 채우고
  alternatives_korean:
  - 네 뿔잔에 기름을 채우고
  - 네 뿔 용기에 기름을 채우고
  lexicon: HALOT
  rationale: 기름 부음에 쓰이는 ‘뿔’의 이미지를 그대로 살려, 구체적 도구 감각을 보존했습니다.
- source_word: רָאִיתִי בְּבָנָיו לִי מֶלֶךְ
  english_pob_choice: for I have provided for myself a king among his sons
  chosen_korean: 나는 그의 아들들 가운데서 나를 위해 한 왕을 보았다
  alternatives_korean:
  - 나는 그의 아들들 가운데서 나를 위해 한 왕을 마련하였다
  - 나는 그의 아들들 가운데서 나를 위해 한 왕을 선택하였다
  lexicon: HALOT
  rationale: POB의 auditable note처럼 ראה의 기본 뜻 ‘보다’를 살리되, 문맥상 선택/지정의 함의를 한국어에서 ‘보았다’로 유지해 원문 이미지를 과도하게 해석하지 않게 했습니다.
theological_decisions:
- issue: 야훼의 사울 거절과 왕권 박탈의 범위
  chosen_reading: ‘내가 그를 이스라엘의 왕이 되지 못하게 거절하였으니’로 옮겨, 거절의 초점을 왕권에서의 배제에 둡니다.
  alternative_readings:
  - 사울을 완전히 버리셨다는 뉘앙스로 확장
  - 사울의 개인적 구원 상태까지 암시
  rationale: 본문은 사울의 최종적 운명보다 왕직의 철수를 말하므로, 신학적 범위를 넓히지 않고 본문이 말하는 수준을 유지했습니다.
  doctrine_reference: 본문 경계 보존; 해석적 확장 자제
