  text: וְ/הָיָ֗ה בִּֽ/הְי֤וֹת רֽוּחַ אֱלֹהִים֙ אֶל שָׁא֔וּל וְ/לָקַ֥ח דָּוִ֛ד אֶת הַ/כִּנּ֖וֹר וְ/נִגֵּ֣ן בְּ/יָד֑/וֹ וְ/רָוַ֤ח לְ/שָׁאוּל֙ וְ/ט֣וֹב ל֔/וֹ וְ/סָ֥רָה מֵ/עָלָ֖י/ו ר֥וּחַ הָ/רָעָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/023.yaml
  text: And whenever the spirit of God came upon Saul[a], David would take the lyre and play it with his hand; then Saul found relief, and it was well with him[c][b], and the harmful spirit departed from him.
  footnotes:
  - marker: a
    text: Or, 'the harp.' The Hebrew kinnor refers to an ancient stringed instrument, likely more like a lyre than a modern harp.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the evil spirit.' The Hebrew can mean 'evil' or 'harmful'; here the sense may emphasize the spirit's distressing effect on Saul.
    reason: lexical_alternative
  - marker: c
    text: The first clause reads 'the spirit of God,' while the final clause reads 'the harmful spirit.' The translation preserves the wording distinction found in the Hebrew rather than harmonizing the two expressions.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님의 영이 사울에게 임할 때마다 다윗은 수금을 가져다가 손으로 연주하였고, 그러면 사울이 안정을 얻고 마음이 편안해졌으며, 그 해로운 영은 그에게서 떠나갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כִּנּוֹר는 현대 한국어의 ‘하프’보다 고대 현악기인 ‘수금’에 더 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 רָעָה는 문맥에 따라 ‘악한’ 또는 ‘해로운’ 뜻이 될 수 있으며, 여기서는 사울을 괴롭히는 영향이 강조됩니다.
    reason: lexical_alternative
  - marker: c
    text: 첫 절은 ‘하나님의 영’, 마지막 절은 ‘해로운 영’이라고 달리 표현하여, 히브리어의 구별을 그대로 유지했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בִּהְיוֹת
  english_pob_choice: And whenever ... came
  chosen_korean: '...할 때마다'
  alternatives_korean:
  - '...하면'
  - '...할 때'
  lexicon: HALOT
  rationale: 반복적 상황을 나타내는 구문이므로, 한국어에서는 '할 때마다'가 사건의 반복성을 가장 자연스럽고 분명하게 드러냅니다.
- source_word: רוּחַ אֱלֹהִים
  english_pob_choice: the spirit of God
  chosen_korean: 하나님의 영
  alternatives_korean:
  - 하나님의 바람
  - 하나님에게서 온 영
  lexicon: HALOT
  rationale: 히브리어가 여기서는 단순히 '하나님의 영'이라고 말하므로, 뒤의 '해로운 영'과 구별을 유지하면서도 직역에 가깝게 옮겼습니다.
- source_word: הַכִּנּוֹר
  english_pob_choice: the lyre
  chosen_korean: 수금
  alternatives_korean:
  - 리라
  - 하프
  lexicon: HALOT
  rationale: 원어의 고대 현악기를 가리키는 말이지만, 한국어 성경 전통에서 널리 정착한 '수금'을 사용하되, 추가 설명 없이도 본문 흐름이 자연스럽게 읽히도록 했습니다.
- source_word: וְרָוַח לְשָׁאוּל וְטוֹב לוֹ
  english_pob_choice: then Saul found relief, and it was well with him
  chosen_korean: 그러면 사울이 안정을 얻고 마음이 편안해졌으며
  alternatives_korean:
  - 그러면 사울이 राहत을 얻고 그에게 좋았으며
  - 그러면 사울이 시원해졌고 잘되었으며
  lexicon: HALOT
  rationale: 두 표현은 결과 상태를 중첩하여 말하므로, 한국어에서는 '안정을 얻다'와 '마음이 편안해지다'로 나누어 사울의 경험적 회복을 전달했습니다.
- source_word: רוּחַ הָרָעָה
  english_pob_choice: the harmful spirit
  chosen_korean: 그 해로운 영
  alternatives_korean:
  - 그 악한 영
  - 그 나쁜 영
  lexicon: HALOT
  rationale: '''רָעָה''는 문맥상 도덕적 ''악''보다 해를 끼치는 ''해로운'' 뜻이 더 잘 맞으므로, POB의 구분을 따라 ''해로운 영''으로 옮겼습니다.'
- source_word: וְסָרָה מֵעָלָיו
  english_pob_choice: departed from him
  chosen_korean: 그에게서 떠나갔습니다
  alternatives_korean:
  - 그에게서 물러갔습니다
  - 그에게서 떠났습니다
  lexicon: HALOT
  rationale: '''סור''는 여기서 이동·철수를 뜻하므로, 서술체에 어울리는 ''떠나갔습니다''로 자연스럽게 옮겼습니다.'
theological_decisions:
- issue: 첫 번째 '하나님의 영'과 마지막 '해로운 영'의 구별을 어떻게 처리할 것인가
  chosen_reading: 두 표현을 서로 섞지 않고, 본문이 가진 구별을 그대로 살렸습니다.
  alternative_readings:
  - 첫 절을 '하나님께로부터 온 해로운 영'으로 조화시키는 읽기
  - 마지막 절을 '악한 영'으로 강하게 규정하는 읽기
  rationale: 히브리어는 처음에는 '하나님의 영', 끝에서는 '해로운 영'이라고 다르게 표현하므로, 번역에서 이를 평준화하지 않고 긴장을 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: 원문 구별 보존; 번역이 신학적 조화를 미리 만들어내지 않음.
