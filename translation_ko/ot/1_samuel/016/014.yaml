  text: וְ/ר֧וּחַ יְהוָ֛ה סָ֖רָה מֵ/עִ֣ם שָׁא֑וּל וּ/בִֽעֲתַ֥תּ/וּ רֽוּחַ רָעָ֖ה מֵ/אֵ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/014.yaml
  text: Now the Spirit of Yahweh had departed from Saul[a], and an evil spirit from Yahweh terrified him.
  footnotes:
  - marker: a
    text: Or 'a harmful spirit' or 'a distressing spirit.' The Hebrew adjective can denote what is evil, harmful, or calamitous in effect.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 야훼의 영이 사울에게서 떠나고, 야훼에게서 온 악한 영이 그를 두렵게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해로운 영’, ‘괴로운 영’. 히브리어 형용사는 악함뿐 아니라 그 결과가 해롭거나 재앙적이라는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/ר֧וּחַ יְהוָ֛ה
  english_pob_choice: the Spirit of Yahweh
  chosen_korean: 야훼의 영
  alternatives_korean:
  - 야훼의 영이
  - 주님의 영
  lexicon: HALOT
  rationale: רוּחַ는 이 서술 문맥에서 하나님의 임재/역사하심을 가리키므로 ‘영’으로 옮겼고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 음역했습니다.
- source_word: סָ֖רָה מֵ/עִ֣ם שָׁא֑וּל
  english_pob_choice: had departed from Saul
  chosen_korean: 사울에게서 떠나
  alternatives_korean:
  - 사울에게서 물러나
  - 사울 곁을 떠나
  - 사울에게서 떠나 버려
  lexicon: HALOT
  rationale: סוּר의 핵심 의미를 살려, 임재의 상실을 자연스럽게 드러내는 ‘떠나’로 옮겼습니다.
- source_word: רֽוּחַ רָעָ֖ה
  english_pob_choice: an evil spirit
  chosen_korean: 악한 영
  alternatives_korean:
  - 해로운 영
  - 괴로운 영
  - 재앙적인 영
  lexicon: HALOT
  rationale: רָעָה는 도덕적 악뿐 아니라 해악/재앙의 결과도 가질 수 있어, 본문에 가장 직접적이면서도 넓은 여지를 남기는 ‘악한 영’을 택했습니다.
- source_word: מֵ/אֵ֥ת יְהוָֽה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼에게서 온
  alternatives_korean:
  - 야훼에게서 온
  - 야훼로부터 온
  - 야훼가 보낸
  lexicon: HALOT
  rationale: מֵאֵת는 출처를 나타내므로 ‘야훼에게서 온’으로 옮겨, 본문이 말하는 기원 관계를 과도하게 해석하지 않도록 했습니다.
theological_decisions:
- issue: 사울을 두렵게 하는 영의 출처를 본문이 어떻게 진술하는지
  chosen_reading: 본문의 긴장을 유지하여 ‘야훼에게서 온 악한 영’으로 옮겼습니다.
  alternative_readings:
  - ‘야훼가 보낸 악한 영’
  - ‘해로운 영’으로 완화한 번역
  rationale: 히브리어는 그 영의 출처를 야훼와 직접 연결하므로, 이를 완화하거나 원인 설명을 덧붙이지 않고 그대로 드러내는 것이 본문 충실성에 부합합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
