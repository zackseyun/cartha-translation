base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/008.yaml
  text: Then Jesse called Abinadab and made him pass before Samuel. And he said[a], “Yahweh has not chosen this one either.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''also this one''; rendered idiomatically as ''this one either'' in English.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이새가 아비나답을 불러 사무엘 앞으로 지나가게 하자, 그가 말했습니다. “야훼께서 이 사람도 택하지 않으셨습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “또 이 사람”에 가깝습니다. 여기서는 앞선 사람과 마찬가지로 이 사람도 선택되지 않았다는 뜻을 한국어의 ‘도’로 나타냈습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
  - 호출하여
  - 불렀습니다
  lexicon: HALOT
  rationale: 문맥상 이새가 아비나답을 불러오는 동작이므로 자연스럽고 간결한 ‘불러’가 서술 흐름을 잘 살립니다.
- source_word: וַיַּעֲבִרֵהוּ לִפְנֵי שְׁמוּאֵל
  english_pob_choice: made him pass before Samuel
  chosen_korean: 사무엘 앞에 지나가게 하니
  alternatives_korean:
  - 사무엘 앞에 세워 보이니
  - 사무엘 앞을 지나가게 하니
  lexicon: HALOT
  rationale: 히필형 עבר의 사역 의미를 살려 ‘지나가게 하니’로 옮겨, 단순한 ‘보여 주다’보다 원문의 사역성을 더 분명히 반영했습니다.
- source_word: גַּם בָּזֶה
  english_pob_choice: this one either
  chosen_korean: 이 사람도
  alternatives_korean:
  - 이 사람 역시
  - 이것도
  lexicon: HALOT
  rationale: 부정문 뒤의 ‘also/either’의 누적·배제 뉘앙스를 한국어에서는 자연스럽게 ‘도’로 처리하는 것이 가장 간명합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명은 직역어가 아닌 고유명사로 처리해, 전통적 대체 표현보다 원문 고유성을 보존하는 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 히브리어 부정문+첨가부사 גַּם의 한국어 대응
  chosen_reading: “이 사람도 택하지 않으셨습니다”
  alternative_readings:
  - “이것도 택하지 않으셨습니다”
  - “이 사람 역시 택하지 않으셨습니다”
  rationale: 선택 서사에서 반복되는 배제의 판정을 한국어에서 자연스럽고 또렷하게 전달하려면 ‘도’가 가장 적절합니다.
  doctrine_reference: '번역 원리: 원문 서사 논리 보존'
