  source_fidelity: ‘그의 옴을 보고’는 לִקְרָאתוֹ(그를 맞이하러/그를 만나러)의 방향·대면의 뜻을 ‘그의 오는 것을 보고’로 바꾸어 원문의 관계를 약화합니다. 장로들이 사무엘을 맞이하러 나오는 상황을 본문에 반영하는 편이 더 충실합니다.
  naturalness: ‘행하여’와 ‘그의 옴을 보고’는 현대 표준 한국어 서사에서 다소 문어적이거나 부자연스럽습니다. ‘행하고’, ‘그를 맞으러 나와’가 현대 합쇼체 문맥에서 자연스럽습니다.
  terminology: ‘야훼’, ‘사무엘’, ‘베들레헴’, ‘성읍의 장로들’, ‘평안히 오십니까?’는 적절합니다. ‘평안히 오십니까?’는 שָׁלוֹם בּוֹאֶךָ의 관용적 물음을 자연스럽게 보존합니다.
