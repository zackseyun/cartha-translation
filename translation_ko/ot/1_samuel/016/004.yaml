id: 1SA.16.4
reference: 1 Samuel 16:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁמוּאֵ֗ל אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה וַ/יָּבֹ֖א בֵּ֣ית לָ֑חֶם וַ/יֶּחֶרְד֞וּ זִקְנֵ֤י הָ/עִיר֙ לִ/קְרָאת֔/וֹ וַ/יֹּ֖אמֶר שָׁלֹ֥ם בּוֹאֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/004.yaml
  text: So Samuel did what Yahweh had spoken and came to Bethlehem. The elders of the city trembled at his coming and said[a], “Do you come in peace?”
  footnotes:
  - marker: a
    text: Or, 'The elders of the city trembled to meet him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘은 야훼께서 말씀하신 대로 행하고 베들레헴에 이르렀습니다. 성읍의 장로들은 그를 맞으러 나와 떨며[a] 말하였습니다. “평안히 오십니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성읍의 장로들은 그가 올 때 떨었다.’
    reason: לִקְרָאתוֹ는 문맥상 ‘그를 맞으러’로 이해할 수 있으며, ‘그가 올 때/그의 도착에’로 이해하는 번역도 가능합니다.
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 행하여
  alternatives_korean:
  - 하였습니다
  - 실행하였습니다
  lexicon: HALOT
  rationale: 서사적 순행을 살리면서도 한국어에서 단순한 ‘하다’보다 약간 더 분명하게 순종의 수행을 드러냅니다.
- source_word: אֵת אֲשֶׁר דִּבֶּר יְהוָה
  english_pob_choice: what Yahweh had spoken
  chosen_korean: 야훼께서 말씀하신 대로
  alternatives_korean:
  - 야훼께서 말씀하신 것을
  - 야훼께서 명하신 대로
  lexicon: HALOT
  rationale: דִּבֶּר는 ‘말하다’가 기본이므로 ‘말씀하신 대로’가 원문에 충실합니다. ‘명하신’은 없는 명령 뉘앙스를 덧붙일 수 있어 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: YHWH transliteration
  rationale: 지정된 원칙에 따라 신명은 대체 칭호가 아니라 음역형 ‘야훼’로 옮겼습니다.
- source_word: וַיֶּחֶרְדוּ
  english_pob_choice: trembled
  chosen_korean: 떨며
  alternatives_korean:
  - 두려워하며
  - 전율하며
  lexicon: HALOT
  rationale: חרד의 생생한 공포·동요를 한국어의 동사형 ‘떨며’로 간결하게 살렸습니다.
- source_word: לִקְרָאתוֹ
  english_pob_choice: at his coming / to meet him
  chosen_korean: 그의 옴을 보고
  alternatives_korean:
  - 그를 맞으러
  - 그를 만나러
  lexicon: HALOT
  rationale: POB가 반영한 ‘at his coming’의 의미를 한국어에서는 사건의 도착 자체에 초점을 둔 표현으로 풀어, 장로들의 반응이 그의 접근에 대한 두려움임을 드러냈습니다.
- source_word: שָׁלוֹם בּוֹאֶךָ
  english_pob_choice: Do you come in peace?
  chosen_korean: 평안히 오십니까?
  alternatives_korean:
  - 평안으로 오십니까?
  - 평안히 오셨습니까?
  lexicon: HALOT
  rationale: 히브리어의 관용적 안부 질문을 현대 한국어의 직접적이고 자연스러운 질문형으로 옮겼습니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 처리
  chosen_reading: 본문에는 ‘야훼’로 유지합니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 직접 신명을 사용하므로, 대체 칭호보다 고유한 언약명을 보존하는 것이 본문의 식별성과 신학적 무게를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
