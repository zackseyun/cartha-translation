base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/005.yaml
  text: He said[a], “Peace. I have come to sacrifice to Yahweh. Consecrate yourselves, and come with me to the sacrifice.” And he consecrated Jesse and his sons and invited them to the sacrifice.
  footnotes:
  - marker: a
    text: Or 'All is well' / 'In peace.' The Hebrew is simply 'Peace,' an assurance that Samuel's coming is not hostile.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다[a]. “평안합니다. 제가 야훼께 제사를 드리려고 왔습니다. 자신을 성결하게 하시고, 저와 함께 제사에 참석하십시오.” 그리고 그는 이새와 그의 아들들을 성결하게 하고 그들을 제사에 초대했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “평안” / “무사합니다.” 히브리어는 단지 “평안”이라고만 되어 있어, 사무엘이 온 것이 적대적이지 않음을 확인해 줍니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  english_pob_choice: Peace
  chosen_korean: 평안입니다
  alternatives_korean:
  - 평안
  - 무사합니다
  - 평화입니다
  lexicon: HALOT
  rationale: 히브리어의 단독 명사 שָׁלוֹם은 여기서 상대에게 적대 의도가 없음을 알리는 응답이므로, 한국어에서는 대화체로 자연스럽고 담백한 “평안입니다”가 가장 가깝습니다.
- source_word: לִזְבֹּחַ לַיהוָה
  english_pob_choice: to sacrifice to Yahweh
  chosen_korean: 야훼께 제사드리려고
  alternatives_korean:
  - 야훼께 희생제사를 드리려고
  - 야훼께 제사하기 위해
  lexicon: HALOT
  rationale: זבח의 제의적 의미를 살려 “제사드리다”를 택했고, 목적 표현은 히브리어 부정사구의 기능에 맞게 “-려고”로 옮겼습니다.
- source_word: הִתְקַדְּשׁוּ
  english_pob_choice: Consecrate yourselves
  chosen_korean: 스스로를 거룩하게 하고
  alternatives_korean:
  - 스스로를 성별하고
  - 스스로를 정결하게 하고
  lexicon: HALOT
  rationale: 이 동사는 단순한 정결만이 아니라 제사 참여를 위한 예식적 구별을 포함하므로, “거룩하게 하다”를 유지하되 한국어 독해를 위해 목적어를 명시했습니다.
- source_word: וַיְקַדֵּשׁ
  english_pob_choice: he consecrated
  chosen_korean: 거룩하게 하고
  alternatives_korean:
  - 성별하고
  - 성결하게 하고
  lexicon: HALOT
  rationale: 같은 어근 קדשׁ의 사역형도 예식적 구별을 가리키므로, 앞의 명령과 어근 대응을 유지해 “거룩하게 하다”로 일관되게 옮겼습니다.
- source_word: וַיִּקְרָא לָהֶם לַזָּבַח
  english_pob_choice: invited them to the sacrifice
  chosen_korean: 그들을 제사에 초대했습니다
  alternatives_korean:
  - 그들을 제사로 불렀습니다
  - 그들을 제사에 불러들였습니다
  lexicon: HALOT
  rationale: קרא + ל는 문맥상 강제적 소집보다 포함시키는 초청의 뉘앙스가 있어, POB의 판단을 따라 “초대하다”를 사용했습니다.
