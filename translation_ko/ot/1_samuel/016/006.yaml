source:
  edition: WLC
  text: וַ/יְהִ֣י בְּ/בוֹאָ֔/ם וַ/יַּ֖רְא אֶת אֱלִיאָ֑ב וַ/יֹּ֕אמֶר אַ֛ךְ נֶ֥גֶד יְהוָ֖ה מְשִׁיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/006.yaml
  text: When they came in[a], he saw Eliab and said, “Surely Yahweh’s anointed is before Yahweh.”
  footnotes:
  - marker: a
    text: Or, “Surely the LORD’s Messiah is before him.” The Hebrew word is the same one later used for “Messiah,” but here it refers to the one Samuel assumes the LORD has chosen and anointed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 들어올 때, 그가 엘리압을 보고 말했습니다. 「야훼의 기름부음받은 이가 야훼 앞에 있구나」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼의 메시아가 야훼 앞에 있구나.” 히브리어는 뒤에 나오는 “메시아”와 같은 단어를 사용하지만, 여기서는 주님이 택하고 기름부으신 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָם
  english_pob_choice: they came in
  chosen_korean: 그들이 들어올 때
  alternatives_korean:
  - 그들이 들어왔을 때
  - 그들이 들어와
  lexicon: HALOT
  rationale: בְּ plus infinitive construct는 사건의 배경 상황을 여는 시간 표현이므로, 한국어에서는 자연스러운 종속절로 옮겨 서술 흐름을 살렸습니다.
- source_word: וַיַּרְא אֶת אֱלִיאָב
  english_pob_choice: he saw Eliab
  chosen_korean: 그가 엘리압을 보고
  alternatives_korean:
  - 그가 엘리압을 보았고
  - 엘리압을 보고
  lexicon: HALOT
  rationale: ראה는 단순한 시각 인지를 뜻하므로 ‘보고’로 간결하게 옮기고, 목적어 표지를 반영해 엘리압을 앞에 두었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 신명은 학술적 음역인 ‘야훼’로 옮겨, 본문이 지닌 고유명성을 보존했습니다.
- source_word: מְשִׁיחוֹ
  english_pob_choice: Yahweh’s anointed / the LORD’s Messiah
  chosen_korean: 기름부음받은 이
  alternatives_korean:
  - 메시아
  - 기름부음받은 자
  lexicon: HALOT
  rationale: 이 문맥에서는 왕으로 선택된 인물을 가리키는 직설적 의미가 우선이므로 ‘기름부음받은 이’로 옮겨, 후대의 칭호인 ‘메시아’와의 연결은 지나치게 앞세우지 않았습니다.
- source_word: נֶגֶד יְהוָה
  english_pob_choice: before Yahweh / before him
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 그 앞에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: נֶגֶד는 ‘~앞에, ~의 면전에서’의 뜻이므로, 주어의 시선이 아닌 위치 관계를 드러내는 ‘야훼 앞에’로 처리했습니다.
theological_decisions:
- issue: מְשִׁיחוֹ를 후대의 그리스도론 용어로 앞당겨 읽을지 여부
  chosen_reading: ‘기름부음받은 이’로 유지해 즉각적 역사 문맥을 살렸습니다.
  alternative_readings:
  - 메시아
  - 야훼의 메시아
  rationale: 사무엘은 여기서 왕으로 세워질 인물을 추정하고 있으므로, 후대의 메시아 칭호를 직접 투입하기보다 원뜻을 먼저 드러내는 번역이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: Original-language primacy over translation tradition; titles rendered by immediate context.
