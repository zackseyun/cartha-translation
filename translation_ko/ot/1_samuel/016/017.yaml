translation:
  language: ko
  text: 그러자 사울이 자기의 종들에게 말했습니다. "부디 나를 위해 잘 연주할 수 있는 사람을 찾아서 내게 데려오십시오."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '연주를 잘하는 사람'에 가까워, 음악적 기량이 뛰어난 사람을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: BHS/WLC
  rationale: 와ו-연속형의 서사 진행을 한국어에서는 자연스러운 순차 연결인 '그러자'로 살렸습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 자기의 종들
  alternatives_korean:
  - 그의 종들
  - 자기의 시종들
  - 자기의 하인들
  lexicon: HALOT
  rationale: 왕의 궁정 맥락이지만 원문의 עֲבָדָיו를 '종들'로 두어 직역성을 유지했습니다.
- source_word: רְאוּ נָא
  english_pob_choice: Please find
  chosen_korean: 부디 ... 찾아서
  alternatives_korean:
  - 보십시오
  - 부디 찾아보십시오
  - 이제 찾아서
  lexicon: HALOT
  rationale: ראה의 명령형과 נָא의 공손한 청유를 한국어의 '부디'로 반영했고, 문맥상 '찾다'가 자연스럽습니다.
- source_word: מֵיטִיב לְנַגֵּן
  english_pob_choice: who plays well
  chosen_korean: 잘 연주할 수 있는 사람
  alternatives_korean:
  - 연주를 잘하는 사람
  - 솜씨 있게 연주하는 사람
  - 연주에 능한 사람
  lexicon: HALOT
  rationale: 직역의 '잘하는'보다 한국어에서는 능력 가능성을 포함하는 표현이 자연스러워, 연주의 숙련을 드러내는 방향으로 옮겼습니다.
- source_word: וַהֲבִיאוֹתֶם אֵלַי
  english_pob_choice: and bring him to me
  chosen_korean: 내게 데려오십시오
  alternatives_korean:
  - 나에게 데려오십시오
  - 그리고 내게 데려오십시오
  - 내게 데리고 오십시오
  lexicon: HALOT
  rationale: 복수 명령의 뉘앙스를 공손한 청유형으로 옮기되, 단수 목적어 '그 사람'은 한국어에서 생략 가능한 맥락으로 처리했습니다.
