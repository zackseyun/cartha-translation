translation:
  language: ko
  text: 그러자 사울이 이새에게 사자들을 보내어 말했습니다[a]. “당신의 아들 다윗, 곧 양 떼 곁에 있는 그를 내게 보내십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “양 떼 가운데 있는”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 보내어
  alternatives_korean:
  - 보냈습니다
  - 파견하여
  lexicon: HALOT
  rationale: 서술적 wayyiqtol의 단순 과거를 자연스러운 현대 한국어로 옮겼습니다. ‘보내어’는 뒤의 발화와도 매끄럽게 이어집니다.
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들을
  - 메신저들을
  lexicon: HALOT
  rationale: 인간 사절을 가리키는 일반적 용례를 따라 ‘사자들’로 옮겼습니다. 한국어 성경 문맥에서 익숙하면서도 임무 수행자를 분명히 드러냅니다.
- source_word: אֶת דָּוִד בִּנְךָ
  english_pob_choice: your son David
  chosen_korean: 당신의 아들 다윗
  alternatives_korean:
  - 다윗
  - 당신의 아들 다윗
  lexicon: HALOT
  rationale: 히브리어의 동격 구조를 살려 다윗을 이새의 아들로 특정했습니다. 현대 한국어에서는 ‘당신의 아들’이 자연스럽고 직설적입니다.
- source_word: אֲשֶׁר בַּצֹּאן
  english_pob_choice: who is with the flock
  chosen_korean: 양 떼 곁에 있는
  alternatives_korean:
  - 양 떼 가운데 있는
  - 양 떼와 함께 있는
  lexicon: HALOT
  rationale: בַּצֹּאן의 관계적·위치적 뉘앙스를 한국어로는 ‘곁에 있는’이 가장 무리 없이 전달합니다. 영어 POB의 ‘with the flock’ 취지를 반영하되, 본문 상황에 맞는 자연스러운 공간감을 유지했습니다.
