id: 1SA.16.15
reference: 1 Samuel 16:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ עַבְדֵֽי שָׁא֖וּל אֵלָ֑י/ו הִנֵּה נָ֧א רֽוּחַ אֱלֹהִ֛ים רָעָ֖ה מְבַעִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/015.yaml
  text: And Saul’s servants said to him[a], “Look now, an evil spirit from God is terrifying you.”
  footnotes:
  - marker: a
    text: Or “a harmful/distressing spirit from God.” The Hebrew can describe the spirit as evil or as causing harm/distress.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울의 종들이 그에게 말했습니다. 「보십시오, 지금 하나님에게서 나온 악한 영이 당신을 두렵게 하고 있습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님에게서 나온 해로운/괴로운 영.” 히브리어는 이 영을 악하다고도, 해를 끼치거나 괴롭히는 존재라고도 말할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי שָׁאוּל
  english_pob_choice: Saul’s servants
  chosen_korean: 사울의 종들
  alternatives_korean:
  - 사울의 시종들
  - 사울의 신하들
  lexicon: HALOT
  rationale: 궁정 문맥에서 기본 의미인 ‘종’을 살리되, 사울의 궁정에 속한 사람들임을 자연스럽게 나타냅니다.
- source_word: הִנֵּה נָא
  english_pob_choice: Look now
  chosen_korean: 보십시오, 지금
  alternatives_korean:
  - 보십시오
  - 이제 보십시오
  - 보라
  lexicon: HALOT
  rationale: 주의 환기와 긴급성을 함께 드러내는 표현으로, 현대 한국어에서 가장 자연스러운 공손 명령형을 택했습니다.
- source_word: רוּחַ אֱלֹהִים
  english_pob_choice: a spirit from God
  chosen_korean: 하나님에게서 나온 영
  alternatives_korean:
  - 하나님의 영
  - 하나님에게서 온 영
  - 하나님으로부터 온 영
  lexicon: HALOT
  rationale: 이 문맥은 성령 자체가 아니라 하나님과 관련된 출처를 말하므로, 관계를 분명히 하면서도 오해를 피하는 방향으로 옮겼습니다.
- source_word: רָעָה
  english_pob_choice: evil
  chosen_korean: 악한
  alternatives_korean:
  - 해로운
  - 괴로운
  - 고통스러운
  lexicon: HALOT
  rationale: 히브리어의 도덕적/해로운 뉘앙스를 모두 열어 두는 단어로, 본문이 가진 신학적 긴장을 보존합니다.
- source_word: מְבַעִתֶּךָ
  english_pob_choice: is terrifying you
  chosen_korean: 당신을 두렵게 하고 있습니다
  alternatives_korean:
  - 당신을 무섭게 하고 있습니다
  - 당신을 공포에 떨게 하고 있습니다
  - 당신을 괴롭히고 있습니다
  lexicon: HALOT
  rationale: 진행 중인 동작을 살리면서, 강한 두려움의 효과를 현대 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: רוּחַ אֱלֹהִים רָעָה를 ‘하나님의 영’으로 오해시키지 않으면서 어떻게 옮길 것인가
  chosen_reading: ‘하나님에게서 나온 악한 영’으로 옮겨, 출처는 하나님께 있으나 그 영이 하나님의 성령과 동일하다고는 말하지 않도록 했습니다.
  alternative_readings:
  - 하나님의 악한 영
  - 하나님으로부터 온 악한 영
  - 해로운 영
  rationale: 본문의 진술을 약화하지 않으면서도, 독자가 성령과 동일시하지 않도록 관계를 분명히 하는 것이 소스에 더 충실합니다.
  doctrine_reference: 본문의 신학적 긴장을 보존한다.
