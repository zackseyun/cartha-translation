translation:
  language: ko
  text: 사울의 신하들이 그에게 말했습니다. “보십시오, 지금 하나님에게서 온 악한 영이 왕을 두렵게 하고 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님에게서 온 해롭거나 괴롭게 하는 영.” 히브리어는 그 영을 악하다고도, 해롭거나 괴롭게 하는 것으로도 묘사할 수 있습니다.
    reason: lexical_alternative
