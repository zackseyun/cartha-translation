  to: 사울의 신하들이 그에게 말했습니다. “보십시오, 지금 하나님에게서 온 악한 영이 왕을 두렵게 하고 있습니다.”[a]
  rationale: 왕궁 장면에 맞추어 ‘종들’을 ‘신하들’로 다듬고, 왕을 향한 발화의 2인칭을 ‘왕을’로 옮겨 현대 표준 한국어의 존대 및 위계 문맥을 반영했습니다. ‘하나님에게서 온 악한 영’은 원문의 출처 관계와 ‘악한’이라는 표현을 유지하며, 각주는 רָעָה의 해로운/괴롭게 하는 의미 가능성을 보존합니다.
