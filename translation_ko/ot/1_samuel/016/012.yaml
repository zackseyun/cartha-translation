  to: 그가 사람을 보내어 그를 데려오게 하였습니다. 그는 붉은 기운이 도는 사람이었고, 눈이 아름다웠으며, 용모도 좋았습니다. 야훼께서 말씀하셨습니다. “일어나서 그에게 기름을 부으십시오. 이 사람이 바로 그입니다.”
