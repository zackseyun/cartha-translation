base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/012.yaml
  text: So he sent and brought him in. Now he was ruddy[a], with beautiful eyes and a handsome appearance. And Yahweh said, “Rise, anoint him, for this is he.”
  footnotes:
  - marker: a
    text: Or, “for this is the one.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 사람을 보내어 그를 데려오게 하였습니다. 그런데 그는 붉은 기운이 도는 사람이었고, 눈이 아름다웠으며, 용모도 좋았습니다. 그러자 야훼께서 말씀하셨습니다. "일어나 그에게 기름을 부으십시오. 이것이 바로 그입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "이 사람이 바로 그다".
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח וַיְבִיאֵהוּ
  english_pob_choice: So he sent and brought him in
  chosen_korean: 그가 사람을 보내어 그를 데려오게 하였습니다
  alternatives_korean:
  - 그래서 그를 불러들였습니다
  - 그가 그를 들여보냈습니다
  lexicon: HALOT
  rationale: 히필 רצף 동작은 한국어에서 자연스러운 사역 표현으로 풀어야 하므로, '보내어 데려오게 하였습니다'로 연속된 동작과 사역성을 함께 살렸습니다.
- source_word: אַדְמוֹנִי
  english_pob_choice: ruddy
  chosen_korean: 붉은 기운이 도는
  alternatives_korean:
  - 불그스름한
  - 붉은
  lexicon: HALOT
  rationale: אַדְמוֹנִי는 단순한 색명이라기보다 피부빛이나 외형의 붉은 기운을 가리킬 수 있어, 한국어에서 과도하게 특정하지 않는 표현으로 옮겼습니다.
- source_word: יְפֵה עֵינַיִם
  english_pob_choice: with beautiful eyes
  chosen_korean: 눈이 아름다웠으며
  alternatives_korean:
  - 아름다운 눈매를 지녔으며
  - 눈이 곱고
  lexicon: HALOT
  rationale: 히브리어의 직역적 구조를 살리되 한국어 어순에 맞춰 '눈이 아름다웠으며'로 자연스럽게 정리했습니다.
- source_word: וְטוֹב רֹאִי
  english_pob_choice: and a handsome appearance
  chosen_korean: 용모도 좋았습니다
  alternatives_korean:
  - 보기에도 좋았습니다
  - 잘생긴 모습이었습니다
  lexicon: HALOT
  rationale: רֹאִי는 외모 전체에 대한 평가이므로, 지나치게 현대적이거나 세부적인 '잘생긴'보다 '용모도 좋았습니다'가 원문의 외관 평가를 안정적으로 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 공동체 기본 용례에 따라 신명기를 포함한 본문에서 하나님의 고유명은 '야훼'로 옮겨, 호칭이 아닌 고유 이름이라는 점을 드러냈습니다.
theological_decisions:
- issue: 하나님의 명령어 톤의 한국어 재현
  chosen_reading: 직접 명령형을 사용하되, 한국어 공용역에 맞게 정중하게 정리했습니다
  alternative_readings:
  - '"일어나, 그에게 기름을 부으라"로 더 직역'
  - 완곡하게 "그에게 기름을 부으십시오"로 완화
  rationale: 원문은 신적 직령이므로 명령성을 유지해야 합니다. 한국어 합쇼체 안에서 바로 앞선 하나님의 말씀이라는 점이 드러나도록 정중한 명령형으로 처리했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve source force and divine speech register'
- issue: 다윗의 외형 묘사와 선택의 긴장
  chosen_reading: 외형 묘사를 그대로 보존하고 영적 의미를 덧붙이지 않았습니다
  alternative_readings:
  - 외모를 약화하거나 생략
  - 선택받은 자의 내면적 아름다움으로 해석
  rationale: 본문은 다윗의 외모를 실제로 묘사하며, 곧바로 이어지는 선택과의 긴장을 의도적으로 남깁니다. 이를 해소하지 않고 외적 특징을 있는 그대로 유지하는 것이 원문의 의미에 충실합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: Original-language primacy; Preserve theological tension rather than resolve it'
