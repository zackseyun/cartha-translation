  edition: WLC
  text: וְ/אֵ֨לֶּה֙ טְחֹרֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֨ר הֵשִׁ֧יבוּ פְלִשְׁתִּ֛ים אָשָׁ֖ם לַֽ/יהוָ֑ה לְ/אַשְׁדּ֨וֹד אֶחָ֜ד לְ/עַזָּ֤ה אֶחָד֙ לְ/אַשְׁקְל֣וֹן אֶחָ֔ד לְ/גַ֥ת אֶחָ֖ד לְ/עֶקְר֥וֹן אֶחָֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/017.yaml
  text: 'And these are the golden tumors that the Philistines returned as a guilt offering to Yahweh: one for Ashdod[a], one for Gaza, one for Ashkelon, one for Gath, one for Ekron.'
  footnotes:
  - marker: a
    text: Or 'golden swellings'; the Hebrew term refers to the bodily affliction represented by these votive offerings, traditionally rendered more specifically as 'hemorrhoids.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이것들은 야훼께 속죄제물로 돌려보낸 금 종기들입니다. 아스돗에는 하나, 가사에는 하나, 아스글론에는 하나, 가드에는 하나, 에그론에는 하나였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘금 종기들’은 히브리어 טְחֹרִים의 직역에 가깝고, 전통적으로는 더 구체적으로 ‘치핵’으로도 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: And these are
  chosen_korean: 그리고 이것들은
  alternatives_korean:
  - 이것들은
  - 그리고 이것이
  lexicon: HALOT
  rationale: 문맥상 앞선 이야기의 결론을 잇는 설명적 도입이므로, 연결어를 살리되 한국어로 자연스럽게 ‘그리고 이것들은’으로 옮겼습니다.
- source_word: טְחֹרֵי הַזָּהָב
  english_pob_choice: the golden tumors
  chosen_korean: 금 종기들
  alternatives_korean:
  - 황금 종기들
  - 금으로 된 종기들
  - 황금 부종들
  lexicon: HALOT
  rationale: טְחֹרִים는 이 본문에서 봉헌물에 대응하는 병증 표지를 가리키므로, POB의 ‘tumors’ 취지를 따라 ‘종기들’로 옮기고, ‘golden’은 소재를 드러내는 ‘금’으로 간결하게 표현했습니다.
- source_word: אָשָׁם
  english_pob_choice: as a guilt offering
  chosen_korean: 속죄제물로
  alternatives_korean:
  - 속건제로
  - 속죄물로
  - 보상 제물로
  lexicon: HALOT
  rationale: אָשָׁם은 죄책과 배상을 함께 띠는 제의적 제물로, 한국어 교회 용례의 ‘속죄제물’이 본문의 봉헌·배상 맥락을 비교적 직접적으로 드러냅니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: 원문이 신명기적 이름 יְהוָה를 직접 사용하므로, 본 프로젝트 기본어인 ‘야훼’를 유지하고 여격을 ‘-께’로 살렸습니다.
- source_word: לְאַשְׁדּוֹד ... לְעֶקְרוֹן
  english_pob_choice: one for Ashdod ... one for Ekron
  chosen_korean: 아스돗에는 하나, 가사에는 하나, 아스글론에는 하나, 가드에는 하나, 에그론에는 하나
  alternatives_korean:
  - 아스돗에 하나, 가사에 하나, 아스글론에 하나, 가드에 하나, 에그론에 하나
  - 아스돗을 위해 하나 ... 에그론을 위해 하나
  lexicon: HALOT
  rationale: 반복되는 לְ + 도시명과 אֶחָד의 대응을 한국어 어순으로 살려, 각 도시마다 하나씩 대응된다는 의미가 분명히 드러나도록 ‘에는 하나’를 반복했습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 원문 표지 יְהוָה를 따라 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 하나님의 언약 이름을 직접 사용하므로, 프로젝트 기본값에 따라 음역형 ‘야훼’를 유지해 원문의 고유 이름성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
