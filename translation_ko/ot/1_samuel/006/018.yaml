  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַכְבְּרֵ֣י הַ/זָּהָ֗ב מִסְפַּ֞ר כָּל עָרֵ֤י פְלִשְׁתִּים֙ לַ/חֲמֵ֣שֶׁת הַ/סְּרָנִ֔ים מֵ/עִ֣יר מִבְצָ֔ר וְ/עַ֖ד כֹּ֣פֶר הַ/פְּרָזִ֑י וְ/עַ֣ד אָבֵ֣ל הַ/גְּדוֹלָ֗ה אֲשֶׁ֨ר הִנִּ֤יחוּ עָלֶ֨י/הָ֙ אֵ֚ת אֲר֣וֹן יְהוָ֔ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה בִּ/שְׂדֵ֥ה יְהוֹשֻׁ֖עַ בֵּֽית הַשִּׁמְשִֽׁי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/018.yaml
  text: and the golden mice[a], according to the number of all the cities of the Philistines belonging to the five rulers, from fortified city to unwalled village, and as far as the great stone on which they set down the ark of Yahweh, which remains to this day in the field of Joshua the Beth-shemite.
  footnotes:
  - marker: a
    text: Or possibly 'and as far as Great Abel,' taking the Hebrew as a place-name rather than 'the great stone.'
    reason: alternative_reading
translation:
  language: ko
  text: 또 금으로 만든 생쥐들은 블레셋의 다섯 통치자에게 속한 모든 성읍의 수에 따른 것이었으며, 요새 성읍에서 성벽 없는 마을에 이르기까지, 야훼의 궤를 그 위에 내려놓았던 큰 돌에 이르기까지였습니다. 그 돌은 오늘날까지도 벳세메스 사람 요수아의 밭에 남아 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 아벨에 이르기까지’로 번역할 수 있습니다. 히브리어를 ‘큰 아벨’이라는 지명으로 읽는 대안입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַכְבְּרֵי הַזָּהָב
  english_pob_choice: the golden mice
  chosen_korean: 금으로 만든 생쥐
  alternatives_korean:
  - 황금 생쥐
  - 금쥐
  - 금으로 만든 쥐
  lexicon: HALOT
  rationale: עַכְבָּר는 일반적으로 ‘생쥐/쥐’ 계열이며, 본문의 재앙 이미지에는 ‘생쥐’가 한국어로 가장 자연스럽고 구체적입니다. ‘금으로 만든’은 금속/재질의 뜻을 분명히 살립니다.
- source_word: לַחֲמֵשֶׁת הַסְּרָנִים
  english_pob_choice: belonging to the five rulers
  chosen_korean: 블레셋 사람들의 다섯 통치자에게 속한
  alternatives_korean:
  - 블레셋의 다섯 군주에게 속한
  - 다섯 방백에게 속한
  - 다섯 통치자의
  lexicon: HALOT
  rationale: סְרָנִים은 블레셋의 특수한 통치자 호칭이므로, 전통적 ‘방백’보다 현대어 ‘통치자’가 의미를 더 분명히 전달합니다. 관계를 나타내는 ‘에게 속한’은 영어 POB의 해석을 따라 수량 대응을 자연스럽게 풀어 줍니다.
- source_word: מֵעִיר מִבְצָר וְעַד כֹּפֶר הַפְּרָזִי
  english_pob_choice: from fortified city to unwalled village
  chosen_korean: 견고한 성읍에서부터 성벽 없는 마을에 이르기까지
  alternatives_korean:
  - 요새 도시에서부터 성벽 없는 마을에 이르기까지
  - 성벽 있는 성읍에서 시골 마을에 이르기까지
  - 견고한 성읍에서 촌락에 이르기까지
  lexicon: HALOT
  rationale: 본문은 요새화된 곳에서 비요새화된 곳까지의 전체 범위를 가리키므로, 대조를 살리는 표현이 필요합니다. ‘성벽 없는 마을’은 영어 POB의 ‘unwalled village’에 대응하면서 현대 독자가 이해하기 쉽습니다.
- source_word: וְעַד אָבֵל הַגְּדוֹלָה
  english_pob_choice: and as far as the great stone
  chosen_korean: 큰 돌에 이르렀습니다
  alternatives_korean:
  - 아벨 큰 곳에 이르렀습니다
  - 큰 아벨에 이르렀습니다
  lexicon: HALOT
  rationale: 문맥의 ‘그 위에 야훼의 궤를 내려놓았다’가 지리명보다 돌을 가리키는 해석을 강하게 뒷받침하므로, 본문에는 ‘큰 돌’을 두고 대안 해석은 각주로 남기는 것이 적절합니다.
- source_word: בִּשְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  english_pob_choice: in the field of Joshua the Beth-shemite
  chosen_korean: 벳세메스 사람 요수아의 밭
  alternatives_korean:
  - 벳세메스 출신 요수아의 밭
  - 벳세메스 사람 여호수아의 밭
  lexicon: HALOT
  rationale: בֵּית הַשִּׁמְשִׁי는 지명에서 나온 사람 표지이므로 ‘벳세메스 사람’으로 옮기면 히브리어 형태를 보존할 수 있습니다. 인명은 한국어 성서 관용을 따라 ‘요수아’로 적었습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 본문에는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 Tetragrammaton이 직접 나오므로, 프로젝트 기본어인 ‘야훼’를 사용해 본문의 언약명과 고유성을 보존했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 오랜 지속을 나타내는 관용구 עַד הַיּוֹם הַזֶּה
  chosen_reading: ‘오늘까지도’로 처리했습니다.
  alternative_readings:
  - 그날까지
  - 이날까지
  rationale: 히브리어 관용구의 지속성을 현대 한국어에서 가장 자연스럽게 드러내기 위해 ‘남아 있습니다’와 결합해 번역했습니다.
  doctrine_reference: Narrative idiom preservation
