  text: Now then[a], take and make one new cart, and two nursing cows on which no yoke has come, and hitch the cows to the cart[b], but take their calves away from them to the house.
  footnotes:
  - marker: a
    text: Or, more literally, 'two nursing cows' or 'two cows giving milk.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'on which no yoke has come,' that is, cows that have never been used for draft work.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 한 새 수레 하나와, 멍에를 아직 전혀 메어 보지 않은 젖 나는 암소 두 마리를 취하여 만들고, 암소들을 수레에 메우고, 그들의 송아지들을 그들로부터 떼어 집으로 데려가십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘젖 나는 암소들’ 또는 ‘젖을 먹이는 암소들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들 위에 멍에가 한 번도 오르지 않은’이라는 뜻으로, 이전에 작업에 쓰인 적이 없는 짐승이라는 의미입니다.
    reason: lexical_alternative
