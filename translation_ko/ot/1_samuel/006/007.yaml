theological_decisions:
- issue: 작업용 멍에를 한 번도 메지 않은 암소라는 규정
  chosen_reading: 제물/표징의 순수성과 통제 불가능한 자연적 반응보다 하나님의 주권적 인도를 시험하는 설정으로 읽었습니다.
  alternative_readings:
  - 단순한 운송 준비 절차로만 읽기
  - 우연을 이용한 점술적 실험으로 읽기
  rationale: 문맥상 이는 블레셋 사람들이 언약궤를 보내는 방식이 참으로 야훼의 손인지 확인하는 시험이며, 짐승의 미사용 상태는 결과의 비자연성을 강조합니다.
  doctrine_reference: 1 Samuel 6장 전체 문맥; 섭리와 증거의 성격
