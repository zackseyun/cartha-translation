lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... was
  chosen_korean: 있었습니다
  alternatives_korean:
  - 그리고 ... 있었습니다
  - 그때 ... 있었습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 וַיְהִי를 한국어에서는 자연스러운 과거 서술로 옮기되, 불필요한 접속어를 덧붙이지 않아도 앞뒤 문맥의 연속성이 유지됩니다.
- source_word: אֲרוֹן יְהוָה
  english_pob_choice: the ark of Yahweh
  chosen_korean: 야훼의 궤
  alternatives_korean:
  - 주님의 궤
  - 야훼의 언약궤
  lexicon: HALOT
  rationale: אֲרוֹן은 예배 기구를 가리키는 '궤'로 옮기고, יְהוָה는 프로젝트 기본 원칙에 따라 '야훼'로 음역하여 고유한 신적 이름을 보존합니다.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  english_pob_choice: in the field of the Philistines
  chosen_korean: 블레셋 사람들의 들에
  alternatives_korean:
  - 블레셋 사람들의 땅에
  - 블레셋 사람들의 영토에
  lexicon: HALOT
  rationale: שָׂדֶה의 문자적 의미인 '들'을 살리되, 집합적 지리 범위를 가리키는 표현으로 자연스럽게 읽히도록 복수 주체의 소유격 구조를 유지했습니다.
- source_word: שִׁבְעָה חֳדָשִׁים
  english_pob_choice: seven months
  chosen_korean: 칠 개월 동안
  alternatives_korean:
  - 일곱 달 동안
  - 일곱 개월 동안
  lexicon: HALOT
  rationale: 단순한 수량 표현이므로 의미를 바꾸지 않고 현대 한국어에서 읽기 자연스러운 기간 표현으로 옮겼습니다.
