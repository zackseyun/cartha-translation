reference: 1 Samuel 6:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֤וּ הָ/אֲנָשִׁים֙ כֵּ֔ן וַ/יִּקְח֗וּ שְׁתֵּ֤י פָרוֹת֙ עָל֔וֹת וַ/יַּאַסְר֖וּ/ם בָּ/עֲגָלָ֑ה וְ/אֶת בְּנֵי/הֶ֖ם כָּל֥וּ בַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/010.yaml
  text: 'So the men did so: they took two milk cows and harnessed them to the cart[b][a], and shut up their calves in the house.'
  footnotes:
  - marker: a
    text: Or 'two nursing cows.' The Hebrew describes cows that were giving milk and had calves.
    reason: lexical_alternative
  - marker: b
    text: Or 'confined their calves in the house.' The Hebrew literally says 'their sons' for the cows' young, that is, their calves.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그 사람들이 그대로 행하여 젖 먹이는 암소 두 마리를 가져다가 수레에 매고, 그 송아지들을 집에 가두었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... כֵּן
  english_pob_choice: did so
  chosen_korean: 그대로 행하여
  alternatives_korean:
  - 그렇게 했습니다
  - 그와 같이 행했습니다
  lexicon: HALOT
  rationale: 앞선 지시를 그대로 수행했다는 뜻을 자연스러운 서술로 옮겼습니다.
- source_word: הָאֲנָשִׁים
  english_pob_choice: the men
  chosen_korean: 그 사람들이
  alternatives_korean:
  - 그 남자들이
  - 그 남성들이
  lexicon: HALOT
  rationale: 문맥상 특정 행위자들을 가리키므로 자연스러운 한국어 서술을 택하되, 성별 정보는 원문과 크게 어긋나지 않게 유지했습니다.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  english_pob_choice: two milk cows
  chosen_korean: 두 마리의 젖을 먹이는 암소
  alternatives_korean:
  - 두 마리의 젖소
  - 젖 먹이는 암소 두 마리
  lexicon: HALOT
  rationale: עָלוֹת는 젖을 먹이는 상태의 암소를 가리키므로, 신호의 핵심인 새끼를 둔 젖 먹이는 암소라는 점이 드러나도록 옮겼습니다.
- source_word: וַיַּאַסְרוּם בָּעֲגָלָה
  english_pob_choice: harnessed them to the cart
  chosen_korean: 수레에 매고
  alternatives_korean:
  - 수레에 멍에를 메고
  - 수레에 연결하고
  lexicon: HALOT
  rationale: 동사의 핵심은 짐수레에 부착해 끌게 하는 동작이므로, 한국어에서 가장 간결하고 기능적으로 맞는 표현을 사용했습니다.
- source_word: וְאֶת בְּנֵיהֶם
  english_pob_choice: their calves
  chosen_korean: 그 송아지들
  alternatives_korean:
  - 그 새끼들을
  - 그들의 송아지들을
  lexicon: HALOT
  rationale: 문자적으로는 ‘그들의 아들들’이지만 소의 새끼를 뜻하므로, 문맥상 분명한 ‘송아지들’로 옮겼습니다.
- source_word: כָּלוּ בַבָּיִת
  english_pob_choice: shut up their calves in the house
  chosen_korean: 집에 가두었습니다
  alternatives_korean:
  - 집 안에 가두었습니다
  - 집에 가두어 두었습니다
  lexicon: HALOT
  rationale: 원문은 새끼들을 집 안에 넣어 두고 밖으로 나오지 못하게 했다는 뜻이므로, ‘가두다’로 그 제한성을 살렸습니다.
