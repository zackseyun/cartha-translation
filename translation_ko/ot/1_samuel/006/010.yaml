  terminology: ‘수레’, ‘송아지’, ‘가두었습니다’는 문맥과 현대 표준어에 적절합니다. ‘그 사람들이’는 אֲנָשִׁים의 지시 대상을 자연스럽게 옮긴 표현입니다.
