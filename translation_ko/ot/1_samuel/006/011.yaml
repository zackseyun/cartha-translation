base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/011.yaml
  text: Then they put the ark of Yahweh on the cart[a], along with the box and the gold mice and the images of their tumors.
  footnotes:
  - marker: a
    text: Or 'their swellings'; possibly 'their hemorrhoids.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 여호와의 궤와 상자와 금으로 만든 생쥐들과 그들의 종양 형상들을 수레 위에 함께 올려놓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 부기’; 아마도 ‘치질’일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  english_pob_choice: the ark of Yahweh
  chosen_korean: 여호와의 궤
  alternatives_korean:
  - 야훼의 궤
  - 여호와의 상자
  lexicon: HALOT
  rationale: אֲרוֹן은 이 문맥에서 성소의 언약궤를 가리키므로 한국어로는 관용적이면서도 원문 기능을 드러내는 ‘궤’가 적절합니다. יְהוָה는 본문 그대로 신명칭을 살려 ‘여호와’로 옮겼습니다.
- source_word: הָעֲגָלָה
  english_pob_choice: the cart
  chosen_korean: 수레
  alternatives_korean:
  - 카트
  - 달구지
  lexicon: HALOT
  rationale: 일반적인 운반용 바퀴 달린 탈것이므로 현대 한국어에서 자연스러운 ‘수레’가 적합합니다.
- source_word: הָאַרְגַּז
  english_pob_choice: the box
  chosen_korean: 상자
  alternatives_korean:
  - 함
  - 궤짝
  lexicon: HALOT
  rationale: 이 용기는 궤와 구별되는 별도의 담는 그릇이므로, 지나치게 의례적이거나 큰 용기 뉘앙스가 없는 ‘상자’가 가장 무난합니다.
- source_word: עַכְבְּרֵי הַזָּהָב
  english_pob_choice: the gold mice
  chosen_korean: 금으로 만든 생쥐들
  alternatives_korean:
  - 금쥐들
  - 황금 생쥐들
  lexicon: HALOT
  rationale: 직역하면 ‘금의 생쥐들’이지만, 재료를 분명히 하면서도 자연스럽게 읽히도록 ‘금으로 만든 생쥐들’로 옮겼습니다.
- source_word: צַלְמֵי טְחֹרֵיהֶם
  english_pob_choice: the images of their tumors
  chosen_korean: 자기들의 종양 형상들
  alternatives_korean:
  - 자기들의 종기 형상들
  - 자기들의 치질 형상들
  - 자기들의 부어오름 형상들
  lexicon: HALOT
  rationale: צַלְמֵי는 ‘형상들/조각상들’이고, טְחֹרֵיהֶם은 본문 전통상 모호한 질환 표현이므로, 의미를 너무 특정하지 않기 위해 POB의 ‘tumors’에 맞춰 ‘종양 형상들’로 번역했습니다.
theological_decisions:
- issue: 여호와의 이름 표기
  chosen_reading: 본문의 יְהוָה를 인명적 신명칭으로 보고 ‘여호와’로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 절은 서사 속에 직접 등장하는 신명칭을 사용하므로, 대체 칭호보다 고유한 이름을 드러내는 것이 원문 정보 보존에 더 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
