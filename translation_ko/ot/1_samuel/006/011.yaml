  source_fidelity: 핵심 어휘는 대체로 충실합니다. 그러나 히브리어는 ‘궤와 상자와 금 생쥐들과 그들의 종양의 형상들’을 수레에 놓았다고 열거하며, 현 번역의 쉼표 및 ‘함께’ 위치는 병렬 목적어의 구조를 다소 흐리게 합니다.
  naturalness: ‘자기들의 종양 형상들’은 의미는 전달하지만 현대 한국어에서 다소 어색합니다. ‘그들의 종양 형상들을’이 더 자연스럽고, 수레에 물건을 올려놓는 장면에는 ‘실었습니다’보다 ‘올려놓았습니다’가 더 직접적입니다.
  terminology: ‘여호와의 궤’, ‘수레’, ‘상자’, ‘금으로 만든 생쥐들’은 적절합니다. טְחֹרֵיהֶם의 의학적 의미는 논쟁적이므로 본문은 넓은 뜻의 ‘종양’으로 두고 각주에서 ‘부기’ 및 가능성 있는 ‘치질’을 제시하는 방식이 적절합니다.
