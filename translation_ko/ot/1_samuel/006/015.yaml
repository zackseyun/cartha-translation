source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם הוֹרִ֣ידוּ אֶת אֲר֣וֹן יְהוָ֗ה וְ/אֶת הָ/אַרְגַּ֤ז אֲשֶׁר אִתּ/וֹ֙ אֲשֶׁר בּ֣/וֹ כְלֵֽי זָהָ֔ב וַ/יָּשִׂ֖מוּ אֶל הָ/אֶ֣בֶן הַ/גְּדוֹלָ֑ה וְ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ הֶעֱל֨וּ עֹל֜וֹת וַֽ/יִּזְבְּח֧וּ זְבָחִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא לַֽ/יהוָֽה׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/015.yaml
  text: And the Levites took down the ark of Yahweh[a], and the box that was with it, in which were the gold objects, and set them on the great stone[c][b]. And the men of Beth-shemesh offered burnt offerings and sacrificed sacrifices on that day to Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''gold vessels/articles''; the term can refer broadly to implements, articles, or objects made of gold.'
    reason: lexical_alternative
  - marker: b
    text: Or more smoothly, 'and offered sacrifices.' The Hebrew reads literally, 'and sacrificed sacrifices,' using a cognate verb-object construction.
    reason: lexical_alternative
  - marker: c
    text: Hebrew YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 레위인들이 야훼의 궤와 그 궤와 함께 있던 상자, 곧 그 안에 금 물건들이 들어 있는 상자[a]를 내려 큰 돌 위에 놓았습니다. 벧세메스의 남자들[b]은 그날 야훼께 번제물을 드리고 희생제물을 바쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘금 물건들’은 히브리어 כְלֵי זָהָב의 넓은 의미를 따른 것입니다. 특정한 그릇 종류로 좁히지 않았습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘남자들’은 히브리어 אַנְשֵׁי를 반영한 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: וְהַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 지파 사람들
  lexicon: HALOT
  rationale: 레위 지파 소속임을 자연스럽게 드러내는 표현으로, 서술 문맥에서도 읽기 자연스럽습니다.
- source_word: אֲרוֹן יְהוָה
  english_pob_choice: the ark of Yahweh
  chosen_korean: 야훼의 궤
  alternatives_korean:
  - 야훼의 언약궤
  - 주님의 궤
  lexicon: HALOT
  rationale: 아론을 '궤'로 옮기고, 본문에 직접 나온 신명은 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
- source_word: הָאַרְגַּז אֲשֶׁר אִתּוֹ אֲשֶׁר בּוֹ כְלֵי זָהָב
  english_pob_choice: the box that was with it, in which were the gold objects
  chosen_korean: 그와 함께 있던 상자—그 안에는 금 물건들이 들어 있었습니다
  alternatives_korean:
  - 함께 있던 상자—그 안에 금 그릇들이 있었습니다
  - 곁에 있던 상자—그 안에는 금 물품들이 있었습니다
  lexicon: HALOT
  rationale: אַרְגַּז는 별도의 용기를 가리키므로 '상자'로, כְלֵי זָהָב는 특정 형상을 과도하게 좁히지 않고 '금 물건들'로 옮겼습니다.
- source_word: וַיָּשִׂמוּ אֶל הָאֶבֶן הַגְּדוֹלָה
  english_pob_choice: and set them on the great stone
  chosen_korean: 큰 돌 위에 놓았습니다
  alternatives_korean:
  - 큰 돌 위에 두었습니다
  - 큰 돌에 놓았습니다
  lexicon: HALOT
  rationale: 동작의 결과를 한국어에서 자연스럽게 살려 '위에 놓다'로 처리했습니다.
- source_word: הֶעֱלוּ עֹלוֹת וַיִּזְבְּחוּ זְבָחִים
  english_pob_choice: offered burnt offerings and sacrificed sacrifices
  chosen_korean: 번제물을 드리고 제물을 바쳤습니다
  alternatives_korean:
  - 번제물을 올리고 제물을 드렸습니다
  - 번제물을 드리고 제사를 드렸습니다
  lexicon: HALOT
  rationale: עֹלוֹת는 '번제물', זְבָחִים은 반복을 그대로 살리기보다 제의적 의미가 드러나는 '제물'로 옮겨 본문이 말하는 두 행위를 구분했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 히브리어 신명 יהוה가 직접 나오므로, 프로젝트 기본값에 따라 서술 본문에서도 '야훼'를 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: 제의 동사의 한국어 톤
  chosen_reading: 드리고 / 바쳤습니다
  alternative_readings:
  - 바쳤습니다 / 희생제사를 드렸습니다
  - 올렸습니다 / 제사를 드렸습니다
  rationale: 히브리어 제의 문맥을 보존하면서도 현대 한국어 합쇼체에서 자연스럽게 읽히도록, 번제는 '드리고'로, զոհաբերական 행위는 '바쳤습니다'로 처리했습니다.
  doctrine_reference: 'Translation philosophy: formal, source-direct without archaizing'
