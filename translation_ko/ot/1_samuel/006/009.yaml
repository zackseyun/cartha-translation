id: 1SA.6.9
reference: 1 Samuel 6:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/רְאִיתֶ֗ם אִם דֶּ֨רֶךְ גְּבוּל֤/וֹ יַֽעֲלֶה֙ בֵּ֣ית שֶׁ֔מֶשׁ ה֚וּא עָ֣שָׂה לָ֔/נוּ אֶת הָ/רָעָ֥ה הַ/גְּדוֹלָ֖ה הַ/זֹּ֑את וְ/אִם לֹ֗א וְ/יָדַ֨עְנוּ֙ כִּ֣י לֹ֤א יָד/וֹ֙ נָ֣גְעָה בָּ֔/נוּ מִקְרֶ֥ה ה֖וּא הָ֥יָה לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/009.yaml
  text: 'And watch: if it goes up by the way of its territory to Beth-shemesh[a], then he is the one who has done this great harm to us; but if not, then we will know that it was not his hand that struck us[b]; it happened to us by chance.'
  footnotes:
  - marker: a
    text: Or 'this great disaster' or 'this great calamity.' The Hebrew word can denote severe harm or calamity, not necessarily moral evil.
    reason: lexical_alternative
  - marker: b
    text: Or 'it was a chance occurrence for us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 보십시오. 그것이 그 영토[a] 쪽 길을 따라 벧세메스로 올라가면, 그분께서 우리에게 이 큰 재앙을 내리신 것입니다. 그러나 그렇지 않으면, 그분의 손이 우리를 친 것이 아니라는 것을 알게 될 것이며, 그 일은 우리에게 우연히 일어난 일[b]이었던 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그의/그것의 영토(또는 경계)의 길로’입니다. 소유 접미사의 정확한 지시 대상에는 해석의 여지가 있으나, 문맥상 벧세메스 쪽으로 난 영토의 길을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것은 우리에게 우연한 사건이었다.’ 히브리어 מִקְרֶה는 우연한 일이나 뜻밖의 사건을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  english_pob_choice: And watch
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 그리고 보세요
  - 그리고 살펴보십시오
  lexicon: HALOT
  rationale: 테스트를 위해 관찰하라는 문맥의 명령이므로, 단순한 ‘보다’보다 ‘보십시오’가 자연스럽고 직접적입니다.
- source_word: דֶּרֶךְ גְּבוּלוֹ
  english_pob_choice: by the way of its territory
  chosen_korean: 자기 경계의 길을 따라
  alternatives_korean:
  - 그 땅의 길을 따라
  - 자기 영토의 길로
  lexicon: HALOT
  rationale: דֶּרֶךְ와 גְּבוּל의 결합을 ‘길’과 ‘경계/영토’로 옮겨, 표적이 되는 이동 경로라는 뜻을 살렸습니다.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  english_pob_choice: this great harm
  chosen_korean: 이 큰 해
  alternatives_korean:
  - 이 큰 악
  - 이 큰 재앙
  - 이 큰 재난
  lexicon: HALOT
  rationale: 여기서 רָעָה는 도덕적 악보다 심각한 피해/재앙의 뜻이므로, 하나님을 향한 오해를 피하면서도 고통의 강도를 살릴 수 있는 ‘해’를 택했습니다.
- source_word: יָדוֹ נָגְעָה בָּנוּ
  english_pob_choice: his hand struck us
  chosen_korean: 그의 손이 우리를 친 것이 아님
  alternatives_korean:
  - 그의 손이 우리를 건드린 것이 아님
  - 그의 손이 우리를 괴롭게 한 것이 아님
  lexicon: HALOT
  rationale: ‘손’은 행위와 권능을 가리키는 관용구이므로, ‘쳤다’로 옮겨 징벌적 작용을 드러냈습니다.
theological_decisions:
- issue: רָעָה를 하나님의 행위에 적용할 때의 뉘앙스
  chosen_reading: 이 큰 해
  alternative_readings:
  - 이 큰 악
  - 이 큰 재앙
  - 이 큰 재난
  rationale: 본문은 징계의 실재를 말하지만 하나님께 도덕적 악을 돌리는 것은 아니므로, 심각한 피해를 뜻하는 표현으로 번역해 의미와 신학적 긴장을 함께 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: מִקְרֶה의 운명/우연 표현
  chosen_reading: 우연히 일어난 것입니다
  alternative_readings:
  - 우연한 사건이었습니다
  - 우연한 일입니다
  rationale: 결론부의 대비는 표적이 아니라 우연한 사건인지의 판별이므로, 현대 한국어에서 분명한 ‘우연히’로 옮겼습니다.
  doctrine_reference: Translation philosophy §1
