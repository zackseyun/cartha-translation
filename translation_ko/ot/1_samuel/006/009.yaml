    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것은 우리에게 우연한 사건이었다.’ 히브리어 מִקְרֶה는 우연한 일이나 뜻밖의 사건을 뜻합니다.
    reason: lexical_alternative
