  source_fidelity: 핵심 동사 כבד의 관용적 의미를 ‘완악하게 하다’로 옮긴 것은 적절하며, הִתְעַלֵּל의 가혹한 처우와 הֲלוֹא의 반문도 대체로 잘 반영했습니다. 다만 초안의 각 대명사가 가리키는 대상은 문맥상 구별되어야 하는데, 각주 b가 이를 반대로 설명하여 본문의 출애굽 언급을 잘못 안내합니다.
  naturalness: ‘당신들은 … 하십니까’는 현대 표준어 합쇼체에서 다소 부자연스럽고, ‘자기 마음’은 집단 및 역사적 대상에 적용될 때 지시가 흐립니다. ‘여러분’과 ‘여러분의/그들의 마음’으로 고치면 자연스럽고 명확합니다.
  terminology: ‘완악하게 하다’는 이 문맥의 כבד 관용구를 자연스럽게 전달합니다. ‘이집트와 바로’ 및 ‘가혹하게 대하다’도 적절합니다. ‘보내 버리다’의 ‘버리다’는 불필요한 구어적·완결적 뉘앙스를 더하므로 ‘보내다’가 더 충실합니다.
