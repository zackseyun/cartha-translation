source:
  edition: WLC
  text: וְ/לָ֤/מָּה תְכַבְּדוּ֙ אֶת לְבַבְ/כֶ֔ם כַּ/אֲשֶׁ֧ר כִּבְּד֛וּ מִצְרַ֥יִם וּ/פַרְעֹ֖ה אֶת לִבָּ֑/ם הֲ/לוֹא֙ כַּ/אֲשֶׁ֣ר הִתְעַלֵּ֣ל בָּ/הֶ֔ם וַֽ/יְשַׁלְּח֖וּ/ם וַ/יֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/006.yaml
  text: Why then do you harden your hearts[a], as Egypt and Pharaoh hardened their hearts? Was it not when he dealt harshly with them that they sent them away[b], and they went?
  footnotes:
  - marker: a
    text: Or 'make your hearts heavy' / 'made their hearts heavy.' The Hebrew idiom uses 'heavy' for a hardened heart.
    reason: lexical_alternative
  - marker: b
    text: The 'them' in 'he dealt harshly with them' refers to Egypt and Pharaoh; the 'them' in 'they sent them away' refers to Israel.
    reason: cross_reference
translation:
  language: ko
  text: 그러면 왜 당신들은 자기 마음을 완악하게 하십니까? 이집트와 바로가 자기 마음을 완악하게 한 것처럼 말입니다. 그가 그들에게 가혹하게 대했을 때, 그들이 그들을 보내 버렸고, 그들은 떠나갔던 것이 아닙니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘마음을 무겁게 하다’이지만, 여기서는 ‘완악하게 하다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들을’은 문맥상 이집트와 바로를 가리키며, ‘그들이’는 이스라엘을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: תְכַבְּדוּ / כִּבְּדוּ
  english_pob_choice: hardened
  chosen_korean: 완악하게 하십니까 / 완악하게 한
  alternatives_korean:
  - 굳게 하십니까 / 굳게 한
  - 무겁게 하십니까 / 무겁게 한
  lexicon: HALOT
  rationale: ‘마음을 무겁게 하다’라는 히브리어 관용구를 한국어에서 자연스럽고 신학적으로도 분명한 ‘완악하게 하다’로 옮겼습니다.
- source_word: לְבַבְכֶם / לִבָּם
  english_pob_choice: your hearts / their hearts
  chosen_korean: 자기 마음 / 자기 마음
  alternatives_korean:
  - 당신들의 마음 / 그들의 마음
  - 마음
  lexicon: HALOT
  rationale: 히브리어 לֵבָב/לֵב는 단순한 감정이 아니라 의지와 내면 전체를 가리키므로, 복수 대상을 반영해 ‘마음’으로 번역하되 소유를 분명히 했습니다.
- source_word: הִתְעַלֵּל בָּהֶם
  english_pob_choice: dealt harshly with them
  chosen_korean: 그들에게 가혹하게 대했을 때
  alternatives_korean:
  - 그들에게 심하게 대했을 때
  - 그들에게 학대했을 때
  lexicon: HALOT
  rationale: 히트파엘 עלל의 문맥상 뜻을 과도하게 해석하지 않으면서도 심판적·징벌적 뉘앙스를 살려 ‘가혹하게 대하다’로 옮겼습니다.
- source_word: וַיְשַׁלְּחוּם וַיֵּלֵכוּ
  english_pob_choice: they sent them away, and they went
  chosen_korean: 그들이 그들을 보내 버렸고, 그들은 떠나갔던 것이 아닙니까
  alternatives_korean:
  - 그들이 그들을 내보냈고, 그들은 갔던 것이 아닙니까
  - 그들이 그들을 놓아주었고, 그들은 떠나갔던 것이 아닙니까
  lexicon: HALOT
  rationale: 출애굽을 가리키는 동작 순서를 살리기 위해 ‘보내다’와 ‘떠나가다’를 유지했고, 종결은 히브리어의 수사적 질문감을 살려 한국어에서 자연스러운 반문형으로 처리했습니다.
theological_decisions:
- issue: 출애굽 사건을 가리키는 간접적 주어와 결과
  chosen_reading: ‘그가 그들에게 가혹하게 대했을 때’의 ‘그’는 문맥상 출애굽 때 이집트에 심판을 행하신 하나님을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - ‘그것이 그들에게 일어났을 때’처럼 주어를 더 불분명하게 둘 수 있습니다.
  - 주어를 명시적으로 ‘하나님이’로 풀어 쓸 수도 있습니다.
  rationale: 히브리어는 이 절에서 주어를 생략하지만, 본문 전체는 출애굽 전승을 전제합니다. 한국어는 의미를 분명히 하면서도 원문의 간접성을 과도하게 덮지 않기 위해 주어를 암시적으로 유지했습니다.
  doctrine_reference: 출애굽기 전승 및 하나님의 심판적 행위에 대한 문맥적 해석
- issue: 수사적 질문의 톤
  chosen_reading: 마지막 절은 단순 진술보다 반문으로 읽히므로 ‘…아닙니까’로 옮겼습니다.
  alternative_readings:
  - 마침표를 사용해 서술문처럼 옮길 수도 있습니다.
  - ‘아닌가요’로 더 구어적으로 만들 수도 있습니다.
  rationale: 히브리어 הֲלוֹא는 대답을 기대하는 반문으로 기능하므로, 청자에게 논지를 압박하는 수사적 효과를 한국어에서도 살렸습니다.
  doctrine_reference: 수사법에 대한 문맥적 보존
