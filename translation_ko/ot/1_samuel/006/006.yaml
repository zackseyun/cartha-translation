    rationale: ‘그가 그들에게 가혹하게 대하셨을 때’의 ‘그들에게’는 이집트와 바로를, ‘그들이 그들을 보내고’의 주어 ‘그들이’는 이집트와 바로를, 목적어 ‘그들을’ 및 뒤의 ‘그들이 떠나간’ 주어는 이스라엘을 가리킵니다. 초안 각주는 이를 뒤바꾸어 독자를 오도합니다.
