  terminology: ‘암소들’은 문맥과 היט브리어 פָּרוֹת에 알맞습니다. 블레셋의 סַרְנֵי는 현대적이고 비교파적인 표현으로 ‘통치자들’이라 할 수 있습니다. ‘벧세메스’로 지명을 통일하는 것이 바람직합니다.
  issues:
