source:
  edition: WLC
  text: וַ/יִשַּׁ֨רְנָה הַ/פָּר֜וֹת בַּ/דֶּ֗רֶךְ עַל דֶּ֨רֶךְ֙ בֵּ֣ית שֶׁ֔מֶשׁ בִּ/מְסִלָּ֣ה אַחַ֗ת הָלְכ֤וּ הָלֹךְ֙ וְ/גָע֔וֹ וְ/לֹא סָ֖רוּ יָמִ֣ין וּ/שְׂמֹ֑אול וְ/סַרְנֵ֤י פְלִשְׁתִּים֙ הֹלְכִ֣ים אַחֲרֵי/הֶ֔ם עַד גְּב֖וּל בֵּ֥ית שָֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/012.yaml
  text: And the cows went straight on the road toward Beth-shemesh[a], along one highway; they went on, lowing as they went, and did not turn aside to the right or to the left[c][b]. And the lords of the Philistines were walking behind them as far as the border of Beth-shemesh.
  footnotes:
  - marker: a
    text: Or 'along a single road.' The Hebrew emphasizes that the cows kept to one fixed route.
    reason: lexical_alternative
  - marker: b
    text: '''Lowing'' refers to the vocal sound of cattle; the wording suggests they continued making this sound as they traveled.'
    reason: cultural_note
  - marker: c
    text: Or 'the rulers of the Philistines.' The term denotes the recognized Philistine city-lords.
    reason: lexical_alternative
translation:
  language: ko
  text: 암소들은 벧세메스로 가는 한 큰길을 따라 곧장 갔습니다. 그들은 계속 울면서 갔고, 오른쪽으로도 왼쪽으로도 벗어나지 않았습니다. 블레셋의 통치자들은 암소들 뒤를 따라 벧세메스 경계까지 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִשַּׁרְנָה
  english_pob_choice: went straight on
  chosen_korean: 곧장 갔습니다
  alternatives_korean:
  - 바로 갔습니다
  - 곧바로 나아갔습니다
  - 똑바로 갔습니다
  lexicon: HALOT
  rationale: ישר의 진행 방향을 살리면서, 서술 흐름에 자연스럽고 간결한 한국어로 옮겼습니다.
- source_word: הַפָּרוֹת
  english_pob_choice: the cows
  chosen_korean: 암소들
  alternatives_korean:
  - 소들
  - 젖소들
  - 암소들
  lexicon: HALOT
  rationale: 문맥상 수레를 끄는 젖을 먹이는 암소들이므로, 단순한 ‘소들’보다 암컷임을 드러내는 ‘암소들’이 더 정확합니다.
- source_word: בִּמְסִלָּה אַחַת
  english_pob_choice: along one highway
  chosen_korean: 한 큰길을 따라
  alternatives_korean:
  - 한 길을 따라
  - 하나의 큰길을 따라
  - 한 도로를 따라
  lexicon: HALOT
  rationale: מְסִלָּה의 넓은 도로/큰길 의미를 반영하되, 현대 한국어에서는 ‘큰길’이 가장 자연스럽습니다.
- source_word: וְגָעוֹ
  english_pob_choice: lowing as they went
  chosen_korean: 가면서 계속 울었고
  alternatives_korean:
  - 울며 갔고
  - 계속 울며 갔고
  - 가며 울었고
  lexicon: HALOT
  rationale: 소가 내는 울음소리를 자연스럽게 풀어 옮기되, 진행 중 계속된 울음을 드러내기 위해 ‘계속’과 ‘가면서’를 살렸습니다.
- source_word: וְסַרְנֵי פְלִשְׁתִּים
  english_pob_choice: the lords of the Philistines
  chosen_korean: 블레셋의 군주들
  alternatives_korean:
  - 블레셋의 통치자들
  - 블레셋의 방백들
  - 블레셋의 주들
  lexicon: HALOT
  rationale: פְלִשְׁתִּים의 지배자라는 정치적 직함을 살리되, 본문 맥락에 맞는 위엄 있는 표현으로 ‘군주들’을 택했습니다.
theological_decisions:
- issue: 지형/방향 표현의 정확성
  chosen_reading: ‘toward Beth-shemesh’에 맞춰 ‘베이트세메스로 가는 길로’라고 옮겼습니다.
  alternative_readings:
  - 베이트세메스로 가는 쪽으로
  - 베이트세메스로 향하여
  - 베이트세메스로
  rationale: 히브리어는 단순한 근접 방향보다 목적지를 향한 진행을 강조하므로, 종착점을 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: 본문 서술의 지리적 정확성
