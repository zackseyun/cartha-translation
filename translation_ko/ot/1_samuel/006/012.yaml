  source_fidelity: 히브리어의 핵심 요소, 즉 암소들이 벧세메스로 향하는 한 길을 곧장 가고, 울며 계속 가면서 좌우로 벗어나지 않았으며, 블레셋의 통치자들이 그 뒤를 경계까지 따라간 사실은 대체로 반영되었습니다. 다만 마지막 문장의 ‘그 뒤’는 한국어상 암소들을 명시하지 않아 선행사가 다소 흐릴 수 있습니다.
