- from: 암소들은 베이트세메스로 가는 길로, 한 큰길을 따라 곧장 갔습니다. 가면서 계속 울었고, 오른쪽이나 왼쪽으로도 치우치지 않았습니다. 블레셋의 군주들은 그 뒤를 따라가며 베이트세메스의 경계에 이르렀습니다.
  to: 암소들은 벧세메스로 가는 한 큰길을 따라 곧장 갔습니다. 그들은 계속 울면서 갔고, 오른쪽으로도 왼쪽으로도 벗어나지 않았습니다. 블레셋의 통치자들은 암소들 뒤를 따라 벧세메스 경계까지 갔습니다.
  rationale: 문장의 중복되고 어색한 조사 연결을 다듬고, 통용 성서 지명 표기인 ‘벧세메스’를 사용했습니다. 마지막 문장에서는 추적 대상인 암소들을 명시하여 원문의 관계를 분명히 했습니다. ‘계속 울면서 갔습니다’는 동사와 부정사의 반복 및 ‘울며’의 동시성을 자연스럽게 반영합니다.
