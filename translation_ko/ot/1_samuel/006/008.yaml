id: 1SA.6.8
reference: 1 Samuel 6:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֞ם אֶת אֲר֣וֹן יְהוָ֗ה וּ/נְתַתֶּ֤ם אֹת/וֹ֙ אֶל הָ֣/עֲגָלָ֔ה וְ/אֵ֣ת כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר הֲשֵׁבֹתֶ֥ם ל/וֹ֙ אָשָׁ֔ם תָּשִׂ֥ימוּ בָ/אַרְגַּ֖ז מִ/צִּדּ֑/וֹ וְ/שִׁלַּחְתֶּ֥ם אֹת֖/וֹ וְ/הָלָֽךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/008.yaml
  text: Then take the ark of Yahweh and place it on the cart[a], and put the gold objects that you are returning to him as a guilt offering in a box beside it. Then send it away[c][b], and let it go.
  footnotes:
  - marker: a
    text: Or 'the gold articles' or 'the golden objects.' The Hebrew term is broad and can refer to various items or vessels.
    reason: lexical_alternative
  - marker: b
    text: Or 'in a chest' or 'in a coffer beside it.'
    reason: lexical_alternative
  - marker: c
    text: 'Literally ''and it will go''; in context this functions as the final step of the instruction: ''send it off, and let it go.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼의 궤를 가져다가 수레 위에 두고, 야훼께 죄과 제물로 돌려드릴 금 물건들[a]은 그 곁에 있는 상자[b]에 넣으십시오. 그런 다음 그것을 보내어 가게 하십시오.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘금 물건들’ 또는 ‘금 기물들’입니다. 히브리어 כְּלִי는 범위가 넓습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘상자 안에’ 또는 ‘궤짝에’입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그리고 그것이 갈 것이다’입니다. 문맥상 마지막 지시를 자연스럽게 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  english_pob_choice: the ark of Yahweh
  chosen_korean: 야훼의 궤
  alternatives_korean:
  - 야훼의 언약궤
  - 주님의 궤
  lexicon: HALOT
  rationale: אֲרוֹן은 성소의 궤를 가리키므로 ‘궤’로 옮기고, יְהוָה는 이 프로젝트 기본값에 따라 ‘야훼’로 렌더링했습니다.
- source_word: כְּלֵי הַזָּהָב
  english_pob_choice: the gold objects
  chosen_korean: 금 물건들
  alternatives_korean:
  - 금 기물들
  - 금 그릇들
  - 금 장식품들
  lexicon: HALOT
  rationale: כְּלִי는 특정한 그릇에 한정되지 않는 넓은 말이어서, 문맥의 구체 항목을 과도하게 특정하지 않는 ‘금 물건들’이 가장 무난합니다.
- source_word: אָשָׁם
  english_pob_choice: as a guilt offering
  chosen_korean: 죄과 제물로
  alternatives_korean:
  - 속건제물로
  - 속죄 제물로
  - 유죄 제물로
  lexicon: HALOT
  rationale: אָשָׁם은 제의적으로는 ‘guilt offering’이지만, 한국어에서는 그 기능을 드러내는 ‘죄과 제물’이 원문 용례를 비교적 직접적으로 살립니다.
- source_word: וְשִׁלַּחְתֶּם אֹתוֹ וְהָלָךְ
  english_pob_choice: Then send it away, and let it go
  chosen_korean: 그런 다음 그것을 보내고, 가게 하십시오
  alternatives_korean:
  - 그런 다음 그것을 보내고, 놓아주십시오
  - 그런 다음 그것을 보내고, 떠나게 하십시오
  lexicon: HALOT
  rationale: 명령형 연쇄와 뒤따르는 ‘그리고 그것이 가게 된다’는 결과/허용 뉘앙스를 함께 살리기 위해 ‘보내고, 가게 하십시오’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트의 contested terms 기본값을 따르며, 본문에서 יהוה를 고유명으로 보이게 하는 것이 원문 감각에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אָשָׁם의 제의적 의미
  chosen_reading: 죄과 제물
  alternative_readings:
  - 속건제물
  - 보상 제물
  rationale: 블레셋 사람이 말하는 문맥이지만 히브리 서술자는 이 항목을 이스라엘 제의 용어로 설명하므로, 관련 신학적·어휘적 연결을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #5'
