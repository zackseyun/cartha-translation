source:
  edition: WLC
  text: וַ/יַּ֞ךְ בְּ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ כִּ֤י רָאוּ֙ בַּ/אֲר֣וֹן יְהוָ֔ה וַ/יַּ֤ךְ בָּ/עָם֙ שִׁבְעִ֣ים אִ֔ישׁ חֲמִשִּׁ֥ים אֶ֖לֶף אִ֑ישׁ וַ/יִּֽתְאַבְּל֣וּ הָ/עָ֔ם כִּֽי הִכָּ֧ה יְהוָ֛ה בָּ/עָ֖ם מַכָּ֥ה גְדוֹלָֽה־־
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/019.yaml
  text: And he struck down some of the men of Beth-shemesh because they had looked into the ark of Yahweh[a]. He struck down seventy men among the people, fifty thousand men[b], and the people mourned because Yahweh had struck the people with a great blow.
  footnotes:
  - marker: a
    text: Or, 'because they had looked at the ark of the LORD.' The Hebrew preposition can be understood more generally, though 'looked into' likely reflects the offense in context.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew reads, 'seventy men, fifty thousand men,' a difficult wording. It may mean 'seventy men out of fifty thousand men,' 'fifty thousand and seventy men,' or reflect a textual problem; some ancient witnesses support a much smaller number.
    reason: textual_variant
translation:
  language: ko
  text: 그가 베이트세메스의 사람들을 치셨습니다. 그들이 야훼의 궤를 보았기 때문입니다[a]. 그가 백성 가운데서 칠십 명, 오만 명을 치셨고[b], 백성이 애도하였으니 이는 야훼께서 백성을 크게 치셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 궤를 들여다보았기 때문입니다.’ 히브리어 전치사 ב는 더 일반적으로 ‘~을 보다’로도 이해될 수 있으나, 문맥상 범한 잘못을 반영하는 ‘들여다보다’가 더 강하게 느껴집니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘칠십 명, 오만 명’이라고 읽습니다. 이는 ‘오만 명 가운데 칠십 명’ 또는 ‘오만 칠십 명’ 등으로 이해될 수 있는 난해한 표현이며, 일부 고대 사본은 더 작은 수를 지지합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  english_pob_choice: he struck down
  chosen_korean: 치셨습니다
  alternatives_korean:
  - 쳤습니다
  - 내리쳤습니다
  lexicon: HALOT
  rationale: נכה의 심판 맥락에서 단순한 ‘치다’보다 결과를 드러내는 ‘치셨습니다’가 자연스럽고, 본문의 치명적 행위를 과장 없이 반영합니다.
- source_word: בְּאַנְשֵׁי בֵית שֶׁמֶשׁ
  english_pob_choice: the men of Beth-shemesh
  chosen_korean: 베이트세메스의 사람들
  alternatives_korean:
  - 베이트세메스의 남자들
  - 베이트세메스 사람들
  lexicon: HALOT
  rationale: אנשי의 기본값은 ‘사람들/남자들’이지만, 한국어에서는 집합적으로 ‘사람들’이 가장 자연스럽고 본문의 처벌 대상을 분명하게 전달합니다.
- source_word: כִּי רָאוּ בַּאֲרוֹן יְהוָה
  english_pob_choice: because they had looked into the ark of Yahweh
  chosen_korean: 그들이 야훼의 궤를 보았기 때문입니다
  alternatives_korean:
  - 그들이 야훼의 궤를 들여다보았기 때문입니다
  - 그들이 야훼의 궤를 바라보았기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 ב와 함께 쓰인 ראה는 문맥상 ‘보다/들여다보다’의 범위를 가지므로, 본문은 기본 의미를 살려 간결하게 옮기고 더 강한 해석은 주석으로 남겼습니다.
- source_word: שִׁבְעִים אִישׁ חֲמִשִּׁים אֶלֶף אִישׁ
  english_pob_choice: seventy men, fifty thousand men
  chosen_korean: 칠십 명, 오만 명
  alternatives_korean:
  - 칠십 명, 오만 명의 남자들
  - 칠십 명, 오만 명의 사람들
  lexicon: HALOT
  rationale: 히브리어의 난해한 숫자 배열을 본문 그대로 보존해 번역하고, 불필요한 조화나 재구성을 피했습니다.
- source_word: וַ/יִּֽתְאַבְּל֣וּ
  english_pob_choice: mourned
  chosen_korean: 애도하였으니
  alternatives_korean:
  - 슬퍼하였으니
  - 통곡하였으니
  lexicon: HALOT
  rationale: אבל의 집단적 애도 행위를 현대 한국어에서는 ‘애도하다’가 가장 정확하고 격식 있게 전달합니다.
- source_word: מַכָּה גְדוֹלָה
  english_pob_choice: a great blow
  chosen_korean: 크게 치셨기 때문입니다
  alternatives_korean:
  - 큰 타격을 주셨기 때문입니다
  - 큰 재앙을 내리셨기 때문입니다
  lexicon: HALOT
  rationale: 명사형 ‘큰 타격/재앙’으로 풀 수도 있지만, 반복되는 ‘치다’ 어휘를 살려 המקרא의 수사적 연결을 보존했습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 본문과 주석에서 모두 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - the LORD
  - 주님
  rationale: 이 절은 יְהוָה를 직접 사용하므로, 직역 투명성을 위해 전승적 대치어 대신 고유명을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 숫자 난점 처리
  chosen_reading: 마소라 본문의 ‘칠십 명, 오만 명’을 본문에 그대로 두었습니다.
  alternative_readings:
  - 칠십 명이요 오만 명
  - 칠십 명이든 오만 명이든
  rationale: 본문의 난점을 매끈하게 해결하지 않고 보존해야 하므로, 해석적 조정은 하지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
