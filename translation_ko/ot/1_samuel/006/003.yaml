id: 1SA.6.3
reference: 1 Samuel 6:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ אִֽם מְשַׁלְּחִ֞ים אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ אַל תְּשַׁלְּח֤וּ אֹת/וֹ֙ רֵיקָ֔ם כִּֽי הָשֵׁ֥ב תָּשִׁ֛יבוּ ל֖/וֹ אָשָׁ֑ם אָ֤ז תֵּרָֽפְאוּ֙ וְ/נוֹדַ֣ע לָ/כֶ֔ם לָ֛/מָּה לֹא תָס֥וּר יָד֖/וֹ מִ/כֶּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/003.yaml
  text: And they said[a], “If you are sending away the ark of the God of Israel, do not send it away empty, for you must surely return to him a guilt offering. Then you will be healed[b], and it will be made known to you why his hand has not turned away from you.”
  footnotes:
  - marker: a
    text: Or 'a reparation offering' or traditional 'a trespass offering.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his hand,' a common idiom for God's power in judgment.
    reason: cultural_note
translation:
  language: ko
  text: 그들이 말했습니다. 「만일 이스라엘의 하나님의 궤를 보내려거든, 그것을 빈손으로 보내지 마십시오. 오히려 반드시 그에게 속건제물을 되돌려 드려야 합니다. 그러면 여러분은 나음을 얻고, 그의 손이 왜 여러분에게서 떠나지 않았는지 알게 될 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속건제물’은 여기서 전통적 ‘속건제사’보다, 보상과 배상의 뉘앙스를 함께 드러내는 제물 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 손’은 하나님이 내리시는 징벌적 권능을 가리키는 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: מְשַׁלְּחִים / תְּשַׁלְּחוּ
  english_pob_choice: are sending away / do not send ... away
  chosen_korean: 보내려거든 / 보내지 마십시오
  alternatives_korean:
  - 보내려 한다면
  - 떠나보내려거든
  - 그냥 보내지 마십시오
  lexicon: HALOT
  rationale: שלח의 ‘내보내다/떠나보내다’ 의미를 살리되, 궤를 본래 자리로 돌려보내는 맥락을 한국어 자연어로 반영했습니다.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the ark of the God of Israel
  chosen_korean: 이스라엘의 하나님의 궤
  alternatives_korean:
  - 이스라엘의 하나님 궤
  - 이스라엘 하나님의 궤
  lexicon: HALOT
  rationale: ‘하나님의 궤’라는 공식 명칭을 유지하면서, 속격 관계를 한국어에서 자연스럽게 정리했습니다.
- source_word: רֵיקָם
  english_pob_choice: empty
  chosen_korean: 빈손으로
  alternatives_korean:
  - 빈 채로
  - 아무것도 없이
  lexicon: HALOT
  rationale: 문맥상 ‘헛되이, 보상 없이’의 뜻이므로, 사람에게 쓰는 관용적 표현인 ‘빈손으로’를 써서 무상 반환의 뉘앙스를 살렸습니다.
- source_word: אָשָׁם
  english_pob_choice: a guilt offering
  chosen_korean: 속건제물
  alternatives_korean:
  - 속죄제물
  - 배상제물
  - 유죄제물
  lexicon: HALOT
  rationale: 한국 교회 용례와 제의적 구분을 고려해 전통적이면서도 문맥상 배상/보상 의미를 드러내는 ‘속건제물’을 택했습니다.
- source_word: תֵּרָפְאוּ
  english_pob_choice: you will be healed
  chosen_korean: 나음을 얻고
  alternatives_korean:
  - 치유되고
  - 회복되고
  - 낫게 되고
  lexicon: HALOT
  rationale: 하나님이 내리신 재앙에서의 회복이라는 문맥을 살리면서, 한국어에서 자연스럽고 결과 상태를 잘 드러내는 표현으로 옮겼습니다.
- source_word: וְנוֹדַע לָכֶם
  english_pob_choice: it will be made known to you
  chosen_korean: 알게 될 것입니다
  alternatives_korean:
  - 여러분에게 알려질 것입니다
  - 여러분이 알게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어 수동/비인칭적 표현을 지나치게 어색하게 만들지 않으면서, 결과적으로 ‘알게 됨’이 드러나도록 옮겼습니다.
- source_word: יָדוֹ
  english_pob_choice: his hand
  chosen_korean: 그의 손
  alternatives_korean:
  - 그의 권능
  - 그의 손길
  - 그의 심판
  lexicon: HALOT
  rationale: 하나님의 징벌적 능력을 가리키는 관용구를 해석으로 약화하지 않고, 그대로 ‘손’으로 보존했습니다.
theological_decisions:
- issue: לּוֹ의 수신자와 אָשָׁם의 방향
  chosen_reading: ‘그에게’는 이스라엘의 하나님을 가리키므로, 제물을 하나님께 되돌려 드리는 의미로 번역했습니다.
  alternative_readings:
  - ‘그것에게’로 읽어 궤에 돌려보내는 의미로 볼 수 있습니다.
  - 제의적 언어를 약화시켜 단순한 보상 행위로 볼 수 있습니다.
  rationale: 문맥의 ‘이스라엘의 하나님의 궤’와 제물 용어 אָשָׁם이 결합되어, 단순한 동봉물이 아니라 하나님께 대한 배상/속건 행위임이 분명합니다.
  doctrine_reference: 제의 언어와 언약 위반에 대한 배상 개념
- issue: ‘그의 손’의 의미
  chosen_reading: 하나님의 징계적 능력을 가리키는 관용구를 그대로 유지했습니다.
  alternative_readings:
  - ‘그의 벌’ 또는 ‘그의 재앙’으로 해석적으로 풀 수 있습니다.
  rationale: 히브리 성경에서 흔한 신적 ‘손’의 관용을 보존하면, 본문이 말하는 심판의 인격적·능동적 성격이 살아납니다.
  doctrine_reference: 구약의 신적 손/심판 관용구
