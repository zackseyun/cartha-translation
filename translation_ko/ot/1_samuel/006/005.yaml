  text: וַ/עֲשִׂיתֶם֩ צַלְמֵ֨י עפלי/כם וְ/צַלְמֵ֣י עַכְבְּרֵי/כֶ֗ם הַ/מַּשְׁחִיתִם֙ אֶת הָ/אָ֔רֶץ וּ/נְתַתֶּ֛ם לֵ/אלֹהֵ֥י יִשְׂרָאֵ֖ל כָּב֑וֹד אוּלַ֗י יָקֵ֤ל אֶת יָד/וֹ֙ מֵֽ/עֲלֵי/כֶ֔ם וּ/מֵ/עַ֥ל אֱלֹהֵי/כֶ֖ם וּ/מֵ/עַ֥ל אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/005.yaml
  text: So make images of your tumors and images of your mice that are ravaging the land[a], and give glory to the God of Israel. Perhaps he will lighten his hand from upon you, and from upon your gods, and from upon your land.
  footnotes:
  - marker: a
    text: Or 'your hemorrhoids.' The Hebrew term refers to bodily swellings or tumors; the more specific traditional rendering is possible but not certain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희의 종양을 본뜬 형상과 땅을 황폐하게 하는 너희의 쥐를 본뜬 형상을 만들어, 이스라엘의 하나님께 영광을 돌리십시오[a]. 아마도 그가 그의 손의 무게를 너희 위에서, 너희의 신들 위에서, 너희의 땅 위에서 덜어 주실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 치질.’ 히브리어 용어는 신체의 부기 또는 종양을 가리킬 수 있으며, 더 구체적인 전통적 번역도 가능하지만 확실하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַלְמֵי
  english_pob_choice: images of
  chosen_korean: 형상
  alternatives_korean:
  - 이미지
  - 우상 형상
  - 모형
  lexicon: HALOT
  rationale: צבם/צלם은 단순한 그림보다 실제로 만든 대표물·형상을 가리키므로, 한국어로는 성경적이면서도 직역에 가까운 ‘형상’이 가장 적절합니다.
- source_word: עפלי/כם
  english_pob_choice: your tumors
  chosen_korean: 너희의 종양들
  alternatives_korean:
  - 너희의 부스럼들
  - 너희의 치질
  - 너희의 혹들
  lexicon: HALOT
  rationale: 본문의 병변은 특정 질환으로 단정하기보다 광범위한 신체적 종기·부종을 뜻하므로, 영어 POB의 ‘tumors’를 따라 ‘종양들’로 옮겨 과도한 특정화를 피했습니다.
- source_word: המשחיתים את הארץ
  english_pob_choice: that are ravaging the land
  chosen_korean: 땅을 황폐하게 하는
  alternatives_korean:
  - 땅을 파괴하는
  - 땅을 망치는
  - 땅을 황폐시키는
  lexicon: HALOT
  rationale: 분사형의 지속적 파괴를 살리기 위해 ‘황폐하게 하는’으로 옮겨, 단순한 결과보다 진행 중인 해악을 드러냈습니다.
- source_word: כבוד
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 존영
  - 명예
  lexicon: HALOT
  rationale: 여기서 כבוד는 이스라엘의 하나님께 돌려야 할 예배적·신학적 ‘영광’이므로, 한국어 표준 번역어인 ‘영광’을 유지했습니다.
- source_word: יַקֵל אֶת יָדוֹ
  english_pob_choice: he will lighten his hand
  chosen_korean: 그의 손을 … 가볍게 하실 것입니다
  alternatives_korean:
  - 그의 손을 … 덜 무겁게 하실 것입니다
  - 그의 손을 … 거두실 것입니다
  - 그의 손의 압박을 … 덜어 주실 것입니다
  lexicon: HALOT
  rationale: ‘손’의 비유를 보존해야 하나, 한국어에서는 ‘손을 가볍게 하다’가 다소 어색하므로 ‘손을 가볍게 하시다’로 직역성을 유지하면서도 문장을 읽히게 했습니다.
- source_word: מֵעֲלֵיכֶם / מֵעַל אֱלֹהֵיכֶם / מֵעַל אַרְצְכֶם
  english_pob_choice: from upon you / from upon your gods / from upon your land
  chosen_korean: 너희에게서, 너희의 신들에게서, 그리고 너희의 땅에서
  alternatives_korean:
  - 너희 위에서
  - 너희에게서부터
  - 너희 위에 놓인 짐처럼
  lexicon: HALOT
  rationale: 영어 POB의 ‘from upon’은 히브리어의 중첩된 전치사를 보존한 것이지만, 한국어에서는 자연스러운 문장을 위해 ‘~에게서/~에서’로 옮기되 반복 구조를 유지했습니다.
theological_decisions:
- issue: עפלים의 병명 특정화
  chosen_reading: 종양들
  alternative_readings:
  - 치질
  - 부스럼
  - 부종
  rationale: 히브리어는 정확한 병명을 확정하기에 충분히 구체적이지 않으므로, 본문 의미를 넓게 유지하는 번역을 택하고 전통적 세부 해석은 각주로 남기는 것이 좋습니다.
  doctrine_reference: 'Translation philosophy §3: 모호성이 남아 있을 때는 해석을 과잉 확정하지 않고 긴장을 보존합니다.'
