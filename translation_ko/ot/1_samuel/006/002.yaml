source:
  edition: WLC
  text: וַ/יִּקְרְא֣וּ פְלִשְׁתִּ֗ים לַ/כֹּהֲנִ֤ים וְ/לַ/קֹּֽסְמִים֙ לֵ/אמֹ֔ר מַֽה נַּעֲשֶׂ֖ה לַ/אֲר֣וֹן יְהוָ֑ה הוֹדִעֻ֕/נוּ בַּ/מֶּ֖ה נְשַׁלְּחֶ֥/נּוּ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/002.yaml
  text: So the Philistines called for the priests and the diviners[a], saying, “What shall we do with the ark of Yahweh? Tell us with what we should send it to its place.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''by what means we should send it''; that is, how they should send the ark back.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 블레셋 사람들이 제사장들과 점술가들을 불러 말했습니다. "우리가 야훼의 궤를 어떻게 해야 하겠느냐? 우리가 어떤 방법으로 그것을 원래 있던 곳으로 보낼지 알려 주어라."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘무엇으로/어떤 수단으로 보내야 하는지’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  english_pob_choice: called for
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 소집했습니다
  - 불러 모았습니다
  lexicon: HALOT
  rationale: 상황상 전문 인물들을 의견 청취를 위해 불러오는 뜻이므로, 현대 한국어에서 자연스럽고 간결한 ‘불렀습니다’로 옮겼습니다.
- source_word: לַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 사제들
  - 제관들
  lexicon: HALOT
  rationale: 블레셋의 종교적 직무자를 가리키므로 표준적인 성경 한국어인 ‘제사장들’을 사용했습니다.
- source_word: וְלַקֹּסְמִים
  english_pob_choice: the diviners
  chosen_korean: 점술가들
  alternatives_korean:
  - 점쟁이들
  - 무당들
  - 복술가들
  lexicon: HALOT
  rationale: קֹסְמִים는 점술 행위자들을 가리키며, 한국어에서는 ‘점술가들’이 비교적 직역에 가깝고 문어체로도 무난합니다.
- source_word: מַה נַּעֲשֶׂה ... בַּמֶּה
  english_pob_choice: What shall we do ... with what should send it
  chosen_korean: 우리가 야훼의 궤를 어떻게 해야 하겠느냐? 우리가 어떤 방법으로 그것을 ... 보낼지
  alternatives_korean:
  - 우리가 야훼의 궤를 어떻게 하겠느냐? 우리가 무엇으로 그것을 보낼지
  - 우리가 야훼의 궤를 어떻게 처리해야 하겠느냐? 우리가 어떻게 그것을 보낼지
  lexicon: HALOT
  rationale: 첫 번째 질문은 처리 방식을 묻는 مستقیم 질문으로 ‘어떻게 해야 하겠느냐’가 자연스럽고, בַּמֶּה는 단순한 ‘어떻게’보다 수단을 묻는 말이므로 ‘어떤 방법으로’로 구체화했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 표기 יְהוָה를 한국어에서는 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 고유한 언약 이름을 보존했습니다.
theological_decisions:
- issue: 블레셋 종교 지도자들의 역할을 어떻게 번역할지
  chosen_reading: 본문의 사회·종교적 직분을 드러내되, 이들을 이스라엘의 제사장으로 오해하지 않도록 단순히 ‘제사장들’로 유지했습니다.
  alternative_readings:
  - ‘사제들’로 구별하여 옮김
  - ‘블레셋의 제사장들’로 명시함
  rationale: 히브리어는 직분명만 제시하며, 본문 자체가 블레셋 사람들임을 분명히 하고 있으므로 불필요한 수식은 추가하지 않았습니다.
  doctrine_reference: 본문 문맥 기반 직분 번역 원칙
- issue: בַּמֶּה의 수단 질문을 한국어에서 어떻게 살릴지
  chosen_reading: ‘어떤 방법으로’로 옮겨 수단·방식을 묻는 뉘앙스를 보존했습니다.
  alternative_readings:
  - ‘어떻게’
  - ‘무엇으로’
  rationale: 영어 POB가 ‘with what means’로 보정한 것처럼, 히브리어는 단순 방식이 아니라 ‘무엇으로/어떤 수단으로’의 의미를 담고 있으므로 한국어에서도 그 긴장을 유지했습니다.
  doctrine_reference: 원문 수단 질문 보존 원칙
