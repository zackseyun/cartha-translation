id: 1SA.6.21
reference: 1 Samuel 6:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים אֶל יוֹשְׁבֵ֥י קִרְיַת יְעָרִ֖ים לֵ/אמֹ֑ר הֵשִׁ֤בוּ פְלִשְׁתִּים֙ אֶת אֲר֣וֹן יְהוָ֔ה רְד֕וּ הַעֲל֥וּ אֹת֖/וֹ אֲלֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/021.yaml
  text: So they sent messengers to the inhabitants of Kiriath-jearim[a], saying, “The Philistines have returned the ark of Yahweh. Come down; bring it up to yourselves.”
  footnotes:
  - marker: a
    text: Or 'Go down; bring it up to you.' The Hebrew uses topographical verbs ('go/come down' ... 'bring up'), likely reflecting the terrain between Beth-shemesh and Kiriath-jearim.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 사람들을 기럇여아림[a] 주민들에게 보내며 말했습니다. “블레셋 사람들이 야훼의 궤를 돌려보냈습니다. 내려오십시오. 그것을 여러분에게로 올려가십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내려가십시오. 그것을 여러분에게 가져가십시오.’ 히브리어는 지형을 반영한 상하 동사(‘내려가다’…‘올려가다’)를 사용하여, 벧세메스와 기럇여아림 사이의 고저 차이를 반영하는 듯합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사람들
  alternatives_korean:
  - 전령들
  - 사자들
  - 메신저들
  lexicon: HALOT
  rationale: 이 문맥에서는 천사가 아니라 인간 전달자를 가리키므로, 한국어에서는 기능을 드러내는 ‘사람들’로 옮기고 문맥상 파송된 전달자라는 점을 살렸습니다.
- source_word: יוֹשְׁבֵי קִרְיַת יְעָרִים
  english_pob_choice: the inhabitants of Kiriath-jearim
  chosen_korean: 기럇여아림 주민들
  alternatives_korean:
  - 기럇여아림의 주민들
  - 기럇여아림에 사는 사람들
  lexicon: HALOT
  rationale: 거주자라는 집합적 의미를 살려 ‘주민들’로 옮겼고, 지명은 한국어 음역 관행에 맞게 기럇여아림으로 처리했습니다.
- source_word: הֵשִׁבוּ
  english_pob_choice: have returned
  chosen_korean: 돌려보냈습니다
  alternatives_korean:
  - 되돌렸습니다
  - 돌려주었습니다
  - 보냈습니다
  lexicon: HALOT
  rationale: 히필 שוב는 ‘돌아오게 하다/되돌리다’의 뜻이므로, 블레셋이 궤를 원래 있던 쪽으로 되돌려 보낸 행위를 분명하게 드러냈습니다.
- source_word: רְדוּ ... הַעֲלוּ אֹתוֹ אֲלֵיכֶם
  english_pob_choice: Come down; bring it up to yourselves
  chosen_korean: 내려오십시오. 그것을 여러분에게로 올려가십시오
  alternatives_korean:
  - 내려오십시오. 그것을 여러분에게 가져오십시오
  - 내려가십시오. 그것을 여러분에게 올려가십시오
  lexicon: HALOT
  rationale: 지형을 반영한 하강/상승 동사를 유지하되, 한국어에서는 ‘올려가다’로 옮겨 장소 간 고저 대비와 회수 행동을 함께 살렸습니다.
- source_word: אֲרוֹן יְהוָה
  english_pob_choice: the ark of Yahweh
  chosen_korean: 야훼의 궤
  alternatives_korean:
  - 여호와의 궤
  - 주님의 궤
  lexicon: HALOT
  rationale: 고유명사 יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼고, ‘궤’는 성서적 사물명으로 자연스럽게 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 테트라그람마톤 יְהוָה를 직접 사용하므로, 프로젝트 기준에 따라 번역문에서도 언약적 고유명을 보존하는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
