  - 사자들
  - 메신저들
  lexicon: HALOT
  rationale: 이 문맥에서는 천사가 아니라 인간 전달자를 가리키므로, 한국어에서는 기능을 드러내는 ‘사람들’로 옮기고 문맥상 파송된 전달자라는 점을 살렸습니다.
- source_word: יוֹשְׁבֵי קִרְיַת יְעָרִים
