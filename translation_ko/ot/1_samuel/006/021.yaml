  text: וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים אֶל יוֹשְׁבֵ֥י קִרְיַת יְעָרִ֖ים לֵ/אמֹ֑ר הֵשִׁ֤בוּ פְלִשְׁתִּים֙ אֶת אֲר֣וֹן יְהוָ֔ה רְד֕וּ הַעֲל֥וּ אֹת֖/וֹ אֲלֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/021.yaml
  text: So they sent messengers to the inhabitants of Kiriath-jearim[a], saying, “The Philistines have returned the ark of Yahweh. Come down; bring it up to yourselves.”
  footnotes:
  - marker: a
    text: Or 'Go down; bring it up to you.' The Hebrew uses topographical verbs ('go/come down' ... 'bring up'), likely reflecting the terrain between Beth-shemesh and Kiriath-jearim.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 사자들을 기럇여아림[a] 주민들에게 보내어 이렇게 말했습니다. “블레셋 사람들이 야훼의 궤를 돌려보냈습니다. 내려오십시오. 그것을 여러분의 곳으로 가져 올라가십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내려가십시오. 그것을 여러분의 곳으로 가져 올라가십시오.’ 히브리어는 지형을 반영한 상하 동사(‘내려가다/내려오다’와 ‘올려가다’)를 사용하며, 이는 벧세메스와 기럇여아림 사이의 고저 차이를 반영하는 듯합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
