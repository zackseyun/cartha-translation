source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אַנְשֵׁ֣י בֵֽית שֶׁ֔מֶשׁ מִ֚י יוּכַ֣ל לַ/עֲמֹ֔ד לִ/פְנֵ֨י יְהוָ֧ה הָ/אֱלֹהִ֛ים הַ/קָּד֖וֹשׁ הַ/זֶּ֑ה וְ/אֶל מִ֖י יַעֲלֶ֥ה מֵ/עָלֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/020.yaml
  text: Then the men of Beth-shemesh said[a], “Who is able to stand before Yahweh, this holy God? And to whom shall he go up from us?”
  footnotes:
  - marker: a
    text: Or, “to whom shall it go up from us?”—likely referring to the ark of the LORD.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 벧세메스 사람들이 말했습니다. “이 거룩하신 하나님 야훼 앞에 누가 설 수 있겠습니까? 또 우리에게서 누구에게로 올라가겠습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘올라가다’의 주어는 명시되지 않았습니다. 문맥상 아마도 야훼의 궤를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַנְשֵׁי בֵית שֶׁמֶשׁ
  english_pob_choice: the men of Beth-shemesh
  chosen_korean: 벧세메스 사람들
  alternatives_korean:
  - 벧세메스의 남자들
  - 벧세메스의 사람들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘~의 사람들/남자들’이지만, 한국어에서는 성별을 과도하게 부각하지 않고 집단을 자연스럽게 지칭하는 ‘사람들’이 본문 기능을 더 잘 드러냅니다.
- source_word: מִי יוּכַל לַעֲמֹד
  english_pob_choice: Who is able to stand
  chosen_korean: 누가 설 수 있겠습니까
  alternatives_korean:
  - 누가 감히 설 수 있겠습니까
  - 누가 서 있을 수 있겠습니까
  lexicon: HALOT
  rationale: יוּכַל의 능력/가능성 질문과 לַעֲמֹד의 관용적 의미를 살려 ‘설 수 있겠습니까’로 옮겼습니다. 경외와 두려움의 뉘앙스는 문맥상 충분히 전달됩니다.
- source_word: יְהוָה הָאֱלֹהִים הַקָּדוֹשׁ הַזֶּה
  english_pob_choice: Yahweh, this holy God
  chosen_korean: 야훼, 이 거룩하신 하나님
  alternatives_korean:
  - 야훼, 이 거룩한 하나님
  - 야훼, 이 거룩하신 하나님
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값대로 ‘야훼’로 옮기고, הַקָּדוֹשׁ는 하나님께 대한 높임을 반영해 ‘거룩하신’으로 옮겼습니다. הַזֶּה의 지시성은 ‘이’로 살렸습니다.
- source_word: יַעֲלֶה
  english_pob_choice: shall he go up
  chosen_korean: 올라가시겠습니까
  alternatives_korean:
  - 올라가겠습니까
  - 그것이 올라가겠습니까
  lexicon: HALOT
  rationale: 히브리어는 주어를 명시하지 않아 원문상 애매성이 있습니다. 한국어 본문은 자연스러운 존대 표현으로 처리하되, 그 대상이 궤일 가능성은 각주로 남겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 신성 호칭이 아니라 언약 이름인 테트라그람마톤을 직접 사용하므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 불분명한 주어 יַעֲלֶה의 처리
  chosen_reading: ‘올라가시겠습니까’로 본문은 유지하고, 대상의 불확실성은 각주로 표기
  alternative_readings:
  - ‘그것이 올라가겠습니까’로 명시
  - 주어를 생략해 ‘올라가겠습니까’
  rationale: 히브리어는 문법적으로 남성 단수이지만 실제 지시 대상은 문맥상 궤로 보입니다. 본문에서는 원문의 모호성을 과도하게 해소하지 않고, 독자가 참고할 수 있도록 각주로 처리했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
