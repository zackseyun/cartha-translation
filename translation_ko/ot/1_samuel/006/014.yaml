source:
  edition: WLC
  text: וְ/הָ/עֲגָלָ֡ה בָּ֠אָה אֶל שְׂדֵ֨ה יְהוֹשֻׁ֤עַ בֵּֽית הַשִּׁמְשִׁי֙ וַ/תַּעֲמֹ֣ד שָׁ֔ם וְ/שָׁ֖ם אֶ֣בֶן גְּדוֹלָ֑ה וַֽ/יְבַקְּעוּ֙ אֶת עֲצֵ֣י הָ/עֲגָלָ֔ה וְ/אֶת הַ֨/פָּר֔וֹת הֶעֱל֥וּ עֹלָ֖ה לַ/יהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/014.yaml
  text: The cart came into the field of Joshua the Beth-shemite and stopped there[a], where there was a large stone[c][b]. Then they split up the wood of the cart and offered up the cows as a burnt offering to Yahweh.
  footnotes:
  - marker: a
    text: Or 'the field of Joshua of Beth-shemesh.' The Hebrew identifies Joshua by his connection to Beth-shemesh.
    reason: lexical_alternative
  - marker: b
    text: Or 'and stood there.' The Hebrew verb is literally 'stood,' used here of the cart coming to a stop.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'to the LORD'; alternatively, 'to Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 수레가 베트세메스 사람 여호수아의 밭에 이르러 거기서 멈추었습니다.[a][b] 그곳에는 큰 돌이 있었습니다. 그들이 수레의 목재를 쪼개고 암소들을 야훼께[c] 번제로 드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘베트세메스의 여호수아’ 또는 ‘베트세메스 사람 여호수아’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘거기 서 있었다’이지만, 움직이던 수레가 멈춘 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어에는 하나님의 이름이 ‘야훼’로 직접 쓰여 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וְהָעֲגָלָה
  english_pob_choice: the cart
  chosen_korean: 수레
  alternatives_korean:
  - 마차
  - 카트
  lexicon: HALOT
  rationale: עגלה는 문맥상 언약궤를 실어 나른 운반 수레이므로, 현대 한국어에서는 가장 자연스러운 ‘수레’가 적절합니다.
- source_word: שְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  english_pob_choice: the field of Joshua the Beth-shemite
  chosen_korean: 베트세메스 사람 여호수아의 밭
  alternatives_korean:
  - 베트세메스의 여호수아의 밭
  - 베트세메스 출신 여호수아의 밭
  lexicon: HALOT
  rationale: 히브리어의 속격 구문과 gentilicial를 살려, 여호수아를 베트세메스와 관련된 사람으로 나타내는 표현을 유지했습니다.
- source_word: וַתַּעֲמֹד שָׁם
  english_pob_choice: and stopped there
  chosen_korean: 거기서 멈추었습니다
  alternatives_korean:
  - 거기서 섰습니다
  - 거기서 멈춰 섰습니다
  lexicon: HALOT
  rationale: עמד의 문자값은 ‘서다’이지만, 움직이던 수레가 멈추는 상황이므로 한국어에서는 ‘멈추다’가 더 정확한 기능적 대응입니다.
- source_word: וְשָׁם אֶבֶן גְּדוֹלָה
  english_pob_choice: where there was a large stone
  chosen_korean: 그곳에 큰 돌이 있었습니다
  alternatives_korean:
  - 거기에 큰 돌이 있었습니다
  - 그곳에 커다란 돌이 있었습니다
  lexicon: HALOT
  rationale: 반복되는 장소 표지를 자연스럽게 정리하되, 현장에 있던 큰 돌의 존재를 분명히 드러냈습니다.
- source_word: וַיְבַקְּעוּ אֶת עֲצֵי הָעֲגָלָה
  english_pob_choice: they split up the wood of the cart
  chosen_korean: 그들이 수레의 나무를 쪼개고
  alternatives_korean:
  - 그들이 수레의 나무를 나누어
  - 그들이 수레의 목재를 쪼개고
  lexicon: HALOT
  rationale: בקע는 ‘쪼개다/가르다’의 뜻이므로, 연료로 쓰기 위해 나무를 쪼개는 장면에 맞는 ‘쪼개고’를 택했습니다.
- source_word: הֶעֱלוּ עֹלָה
  english_pob_choice: offered up ... as a burnt offering
  chosen_korean: 번제물로 드렸습니다
  alternatives_korean:
  - 번제로 바쳤습니다
  - 번제로 올렸습니다
  lexicon: HALOT
  rationale: ‘번제물’은 עֹלָה의 제의적 명칭을 살리고, ‘드리다’는 제물 봉헌의 한국어 성서문체를 자연스럽게 반영합니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: יהוה는 본문에서 고유한 언약 이름이므로, POB의 표준에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역어 선택
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 제의 행위의 대상이 되는 언약의 이름을 직접 사용하므로, 익명화된 ‘주님’보다 고유 이름 ‘야훼’를 드러내는 번역이 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: POB naming policy for YHWH / divine-name rendering
