source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ מָ֣ה הָ/אָשָׁם֮ אֲשֶׁ֣ר נָשִׁ֣יב ל/וֹ֒ וַ/יֹּאמְר֗וּ מִסְפַּר֙ סַרְנֵ֣י פְלִשְׁתִּ֔ים חֲמִשָּׁה֙ עפלי זָהָ֔ב וַ/חֲמִשָּׁ֖ה עַכְבְּרֵ֣י זָהָ֑ב כִּֽי מַגֵּפָ֥ה אַחַ֛ת לְ/כֻלָּ֖/ם וּ/לְ/סַרְנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/004.yaml
  text: 'And they said[a], “What is the guilt offering that we should return to him?” They said, “According to the number of the Philistine rulers: five golden tumors and five golden mice[c][b], for one plague was on all of them and on your rulers.”'
  footnotes:
  - marker: a
    text: Or 'the compensation offering' or 'the trespass offering.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term likely refers to plague-related swellings; some render it more specifically as 'hemorrhoids.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the Philistine lords.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말했습니다. 「그분께 되돌려 드려야 할 속건제물은 무엇입니까?」 그들이 말했습니다. 「블레셋 통치자들의 수대로, 곧 금으로 된 종기 다섯 개와 금으로 된 쥐 다섯 마리입니다[b][c]. 이는 한 재앙이 그들 모두와 당신들의 통치자들[a]에게 내렸기 때문입니다。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘블레셋 방백들’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 용어는 전염병과 관련된 종기를 가리키는 것으로 보이며, 더 구체적으로는 ‘치질’로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘블레셋 군주들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָשָׁם
  english_pob_choice: the guilt offering
  chosen_korean: 속건제물
  alternatives_korean:
  - 속죄제물
  - 배상제물
  - 죄책제물
  lexicon: HALOT
  rationale: אָשָׁם은 제의적·배상적 맥락에서 속건제/배상 제물을 가리키므로, 한국어 성경 전통과 원문의 제의 의미를 함께 살릴 수 있는 ‘속건제물’을 선택했습니다.
- source_word: סַרְנֵי פְלִשְׁתִּים
  english_pob_choice: the Philistine rulers
  chosen_korean: 블레셋 통치자들
  alternatives_korean:
  - 블레셋 방백들
  - 블레셋 주권자들
  - 블레셋 군주들
  lexicon: HALOT
  rationale: סַרְנֵי는 블레셋의 정치적 지도자들을 가리키므로, 현대 한국어에서 위계와 권한을 자연스럽게 드러내는 ‘통치자들’로 옮겼습니다.
- source_word: עַכְבְּרֵי זָהָב
  english_pob_choice: golden mice
  chosen_korean: 금으로 된 쥐
  alternatives_korean:
  - 황금 쥐
  - 금쥐
  lexicon: HALOT
  rationale: 직역에 가깝게 ‘금으로 된 쥐’라고 하여, 원문의 물질 표현과 상징적 제물을 함께 보존했습니다.
- source_word: מַגֵּפָה אַחַת לְכֻלָּם וּלְסַרְנֵיכֶם
  english_pob_choice: for one plague was on all of them and on your rulers
  chosen_korean: 이는 한 재앙이 그들 모두와 당신들의 통치자들에게 내렸기 때문입니다
  alternatives_korean:
  - 이는 하나의 재앙이 그들 모두와 당신들의 통치자들에게 임했기 때문입니다
  - 이는 같은 재앙이 그들 모두와 당신들의 통치자들에게 내렸기 때문입니다
  lexicon: HALOT
  rationale: מַגֵּפָה는 본문 맥락에서 ‘재앙/역병’의 뜻이지만, 문맥상 피해를 준 사건으로서 넓게 ‘재앙’이라 옮겼습니다.
theological_decisions:
- issue: לוֹ의 지시 대상
  chosen_reading: ‘그분께’로 번역해, 언약궤라는 물건보다 이스라엘의 하나님을 향한 반환 행위임을 드러냈습니다.
  alternative_readings:
  - ‘그것에게’로 번역해 언약궤를 가리킬 수 있습니다
  rationale: 문맥상 배상 행위의 대상은 물건 자체가 아니라 그 뒤에 계신 하나님이므로, 한국어에서도 인격적 지시를 유지하는 편이 원문 의도에 가깝습니다.
  doctrine_reference: 본문의 신학적 초점은 언약궤 점유에 대한 책임과 하나님께 대한 보상적 반환입니다.
