source:
  edition: WLC
  text: וַ/יַּ֗עַל נָחָשׁ֙ הָֽ/עַמּוֹנִ֔י וַ/יִּ֖חַן עַל יָבֵ֣שׁ גִּלְעָ֑ד וַ/יֹּ֨אמְר֜וּ כָּל אַנְשֵׁ֤י יָבֵישׁ֙ אֶל נָחָ֔שׁ כְּרָת לָ֥/נוּ בְרִ֖ית וְ/נַעַבְדֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/001.yaml
  text: Then Nahash the Ammonite went up and encamped against Jabesh-gilead. And all the men of Jabesh said to Nahash[a], “Make a covenant with us, and we will serve you.”
  footnotes:
  - marker: a
    text: Hebrew literally, “cut a covenant with us.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 암몬 사람 나하스가 올라가 야베스 길르앗을 향하여 진을 쳤습니다. 야베스의 모든 남자가 나하스에게 말했습니다. “우리와 언약을 맺으십시오.[a] 그러면 우리가 당신을 섬기겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “우리와 언약을 자르십시오”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라와
  alternatives_korean:
  - 와서
  - 진군하여
  lexicon: HALOT
  rationale: עלה의 서사적 이동을 자연스러운 현대 한국어로 옮기되, 군사적 긴장감을 유지하기 위해 단순한 ‘왔습니다’보다 ‘올라와’로 처리했습니다.
- source_word: וַיִּחַן עַל
  english_pob_choice: encamped against
  chosen_korean: 대치하고 진을 쳤습니다
  alternatives_korean:
  - 맞서 진을 쳤습니다
  - 포위하고 진을 쳤습니다
  lexicon: HALOT
  rationale: חנה + עַל은 상대를 향해 진을 친 군사적 구도를 나타내므로, ‘대치하고 진을 쳤습니다’로 압박과 대립을 함께 드러냈습니다.
- source_word: כְּרָת לָנוּ בְרִית
  english_pob_choice: Make a covenant with us
  chosen_korean: 우리와 언약을 맺으십시오
  alternatives_korean:
  - 우리와 계약을 맺으십시오
  - 우리와 조약을 맺으십시오
  lexicon: HALOT
  rationale: ברית는 단순한 계약보다 언약의 범주가 더 적합하므로, 한국어 성경 용례에 맞는 ‘언약을 맺으십시오’를 선택했습니다.
- source_word: וְנַעַבְדֶךָּ
  english_pob_choice: and we will serve you
  chosen_korean: 우리가 당신을 섬기겠습니다
  alternatives_korean:
  - 우리가 당신의 종이 되겠습니다
  - 우리가 당신께 복종하겠습니다
  lexicon: HALOT
  rationale: עבד의 기본 의미인 ‘섬기다’를 살리되, 왕정 이전의 복속 맥락을 지나치게 확대하지 않도록 ‘종이 되다’보다 덜 해석적인 표현을 택했습니다.
theological_decisions:
- issue: 언약 요청과 복속의 결합
  chosen_reading: 야베스 사람들이 나하스와 언약을 맺는 것을 단순한 외교 절차가 아니라 생존을 위한 복속 요청으로 읽었습니다.
  alternative_readings:
  - 중립적인 휴전 요청으로 약화해 읽을 수 있습니다.
  - 단순한 정치적 조약으로만 읽을 수 있습니다.
  rationale: 본문의 ‘언약’과 ‘섬기다’가 함께 나오므로, 관계가 대등한 협상이라기보다 복속을 포함한 생존 거래임을 한국어에서도 드러내야 합니다.
  doctrine_reference: 1 Samuel 11:1의 서사적·정치적 맥락
- issue: 직접 화법의 공손도
  chosen_reading: 직접 말에서는 고어체가 아니라 현대 공손체 명령/청유형을 사용했습니다.
  alternative_readings:
  - ‘우리와 언약을 맺게 하소서’ 같은 기도체로 옮길 수 있습니다.
  - 반말체 직설로 옮길 수 있습니다.
  rationale: 원문은 사람들 사이의 협상 발화이므로, 합쇼체를 유지하되 구시대적 교회체로 전환하지 않는 것이 대상 독자 이해에 더 적절합니다.
  doctrine_reference: 번역 등록(register) 원칙
