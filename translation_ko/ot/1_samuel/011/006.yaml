base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/006.yaml
  text: And the Spirit of God rushed upon Saul when he heard these words[b][a], and his anger burned greatly.
  footnotes:
  - marker: a
    text: Or 'came powerfully upon Saul.' The Hebrew verb can denote a forceful coming of the Spirit upon someone.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'his nose burned greatly,' a Hebrew idiom meaning intense anger.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 영이 사울에게 힘 있게 임하였는데, 그가 이 말을 들었을 때였습니다. 그의 분노가 크게 타올랐습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘힘 있게 임하였는데’는 מקור לשון의 כוח 있는 도래를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘분노가 크게 타올랐습니다’는 히브리어 직역의 ‘코가 탔다’는 관용을 한국어 자연어로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח / rushed upon
  english_pob_choice: rushed upon
  chosen_korean: 힘 있게 임하였는데
  alternatives_korean:
  - 임하였습니다
  - 강하게 임하였습니다
  - 덮쳤습니다
  lexicon: HALOT
  rationale: צלח가 영의 임재와 함께 쓰일 때는 단순한 ‘오다’보다 강력하고 갑작스러운 임하심을 나타내므로, 자연스러운 합쇼체로 ‘힘 있게 임하다’로 옮겼습니다.
- source_word: רוּחַ אֱלֹהִים / the Spirit of God
  english_pob_choice: the Spirit of God
  chosen_korean: 하나님의 영
  alternatives_korean:
  - 하나님의 성령
  - 하나님의 바람
  lexicon: HALOT
  rationale: 직역상 ‘하나님의 영’이 가장 직접적이며, 본문 맥락에서 신적 능력의 임재를 분명히 드러냅니다. ‘성령’은 신약적 뉘앙스가 강해 여기서는 기본형을 유지했습니다.
- source_word: בְּשָׁמְעוֹ / when he heard
  english_pob_choice: when he heard
  chosen_korean: 그가 이 말을 들었을 때
  alternatives_korean:
  - 들을 때
  - 듣자마자
  - 들을 때에
  lexicon: HALOT
  rationale: ב+부정사구의 시간적 관계를 한국어에서 가장 자연스럽게 드러내기 위해 ‘~했을 때’ 구조를 사용했습니다.
- source_word: וַיִּחַר אַפּוֹ מְאֹד / his anger burned greatly
  english_pob_choice: his anger burned greatly
  chosen_korean: 그의 분노가 크게 타올랐습니다
  alternatives_korean:
  - 그의 코가 크게 탔습니다
  - 그는 매우 분노했습니다
  - 그의 노여움이 몹시 끓어올랐습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리되 한국어에서 이해 가능한 표현으로 옮기기 위해 ‘분노가 타오르다’를 택했고, מְאֹד는 ‘크게’로 자연스럽게 강화했습니다.
theological_decisions:
- issue: ‘하나님의 영’의 의미
  chosen_reading: 사울에게 임한 것은 하나님께로부터 온 영적 능력의 임재로 이해하여, 단순한 감정 고조보다 하나님의 주도적 개입을 드러냈습니다.
  alternative_readings:
  - 하나님이 보내신 어떤 영
  - 단순한 내적 격정
  rationale: 문맥상 사울의 즉각적인 반응을 넘어, 하나님의 영이 지도자에게 임해 행동을 일으키는 서술로 읽는 것이 본문의 흐름에 가장 잘 맞습니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
