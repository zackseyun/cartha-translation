  text: And the Spirit of God rushed upon Saul when he heard these words[b][a], and his anger burned greatly.
  footnotes:
  - marker: a
    text: Or 'came powerfully upon Saul.' The Hebrew verb can denote a forceful coming of the Spirit upon someone.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'his nose burned greatly,' a Hebrew idiom meaning intense anger.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 이 말을 들었을 때, 하나님의 영이 그에게 힘 있게 임하였고,[a] 그의 분노가 몹시 타올랐습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘힘 있게 임하였고’는 하나님의 영이 사울에게 강력하게 임했다는 히브리어 동사의 뜻을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그의 코가 몹시 타올랐다’라고 말합니다. 이는 격렬한 분노를 뜻하는 관용 표현입니다.
    reason: lexical_alternative
