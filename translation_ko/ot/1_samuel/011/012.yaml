id: 1SA.11.12
reference: 1 Samuel 11:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הָ/עָם֙ אֶל שְׁמוּאֵ֔ל מִ֣י הָ/אֹמֵ֔ר שָׁא֖וּל יִמְלֹ֣ךְ עָלֵ֑י/נוּ תְּנ֥וּ הָ/אֲנָשִׁ֖ים וּ/נְמִיתֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/012.yaml
  text: Then the people said to Samuel[a], “Who is it that said, ‘Shall Saul reign over us?’ Hand over the men, and we will put them to death.”
  footnotes:
  - marker: a
    text: 'Or, “Will Saul reign over us?” The Hebrew imperfect can be rendered either as a future-like question or, less likely here, as a statement: “Saul shall reign over us.”'
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 백성이 사무엘에게 말했습니다. "사울이 우리를 다스린다고 한 자가 누구입니까? 그 사람들을 넘겨주십시오. 그러면 우리가 그들을 죽이겠습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사울이 우리를 다스리겠습니까?” 히브리어 미완료형은 미래형 질문으로도, 덜 가능하지만 단정적 진술로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר / הָעָם
  english_pob_choice: Then the people said
  chosen_korean: 그러자 백성이 말했습니다
  alternatives_korean:
  - 그리고 백성이 말했습니다
  - 그때 백성이 말했습니다
  lexicon: WLC, HALOT
  rationale: 와우 연속과 집합명사 עָם의 흐름을 살려 서술의 진행을 자연스럽게 옮겼습니다. ‘백성’은 여기서 집단 전체를 가리키는 표준적 표현입니다.
- source_word: אֶל שְׁמוּאֵל
  english_pob_choice: to Samuel
  chosen_korean: 사무엘에게
  alternatives_korean:
  - 사무엘에게로
  lexicon: WLC, HALOT
  rationale: 전치사 אֶל은 발화의 수신자를 가리키므로 한국어에서는 여격 조사로 옮기는 것이 가장 직접적입니다.
- source_word: מִי הָאֹמֵר
  english_pob_choice: Who is it that said
  chosen_korean: 누구입니까?
  alternatives_korean:
  - 누구가 말했습니까?
  - 누구였습니까?
  lexicon: WLC, HALOT
  rationale: 분사 הָאֹמֵר는 영어 POB의 최종 판단처럼 즉각적인 지시 대상을 찾는 뉘앙스를 가지므로, 한국어에서도 현재형의 추궁형 질문으로 살렸습니다.
- source_word: שָׁאוּל יִמְלֹךְ עָלֵינוּ
  english_pob_choice: Shall Saul reign over us?
  chosen_korean: 사울이 우리를 다스린다고 한
  alternatives_korean:
  - 사울이 우리를 통치한다고 한
  - 사울이 우리 위에 왕으로 군림한다고 한
  lexicon: HALOT
  rationale: מָלַךְ의 왕권적 의미를 담되, 한국어에서는 자연스러운 ‘다스리다’로 옮겼습니다. 질문형 가능성은 본문 전체 문맥에 이미 반영되어 있으므로 여기서는 인용된 발언의 내용만 간결히 반영했습니다.
- source_word: תְּנוּ הָאֲנָשִׁים
  english_pob_choice: Hand over the men
  chosen_korean: 그 사람들을 넘겨주십시오
  alternatives_korean:
  - 그 남자들을 넘기십시오
  - 그 자들을 넘겨주십시오
  lexicon: HALOT
  rationale: תְּנוּ는 단순 ‘주다’보다 인도·인계의 압박을 띠므로 ‘넘겨주십시오’가 문맥상 더 정확합니다. הָאֲנָשִׁים은 특정된 당사자들을 가리켜 ‘그 사람들’로 자연스럽게 옮겼습니다.
- source_word: וּנְמִיתֵם
  english_pob_choice: and we will put them to death
  chosen_korean: 우리가 그들을 죽이겠습니다
  alternatives_korean:
  - 우리가 그들을 사형에 처하겠습니다
  - 우리가 그들을 죽음에 넘기겠습니다
  lexicon: HALOT
  rationale: 힙힐 מות는 원인을 들여 ‘죽게 하다’는 뜻이지만, 한국어에서는 형벌 집행의 법정적 느낌보다 직접적 진술이 본문의 거친 요구를 더 잘 드러냅니다.
theological_decisions:
- issue: 백성의 요구를 직접 처벌 요구로 표현할지 여부
  chosen_reading: 백성이 사무엘에게 반대자들의 인도를 요구하며 즉시 처형을 말하는 장면으로 옮겼습니다.
  alternative_readings:
  - 더 완곡하게 ‘벌하겠습니다’라고 옮길 수 있음
  - 법정 절차를 강조해 ‘사형에 처하겠습니다’로 옮길 수 있음
  rationale: 본문은 공동체가 사울 왕권 반대자를 찾아내어 즉각 죽이려는 분노를 보여 줍니다. 완곡화하면 서술의 긴장과 폭력성이 약해집니다.
  doctrine_reference: 서술 본문 1 Samuel 11:12
