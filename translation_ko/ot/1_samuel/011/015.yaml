source:
  edition: WLC
  text: וַ/יֵּלְכ֨וּ כָל הָ/עָ֜ם הַ/גִּלְגָּ֗ל וַ/יַּמְלִכוּ֩ שָׁ֨ם אֶת שָׁא֜וּל לִ/פְנֵ֤י יְהוָה֙ בַּ/גִּלְגָּ֔ל וַ/יִּזְבְּחוּ שָׁ֛ם זְבָחִ֥ים שְׁלָמִ֖ים לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּשְׂמַ֨ח שָׁ֥ם שָׁא֛וּל וְ/כָל אַנְשֵׁ֥י יִשְׂרָאֵ֖ל עַד מְאֹֽד־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/015.yaml
  text: So all the people went to Gilgal[a], and there they made Saul king before Yahweh at Gilgal. There they sacrificed peace offerings before Yahweh, and there Saul and all the men of Israel rejoiced greatly.
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being.' The Hebrew term refers to a category of communal sacrificial offerings associated with peace, wholeness, and shared celebration.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 모든 백성이 길갈로 가서, 거기서 길갈에서 야훼 앞에 사울을 왕으로 세웠습니다. 거기서 그들은 야훼 앞에서 화목제물을 드렸고, 사울과 이스라엘의 모든 남자들이 매우 기뻐했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교제제물’, ‘평안제물’로 옮길 수 있습니다. 히브리어 용어는 평화, 온전함, 공동의 기쁨과 나눔에 연결된 제물 범주를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ כָל הָעָם
  english_pob_choice: So all the people went
  chosen_korean: 모든 백성이 … 가서
  alternatives_korean:
  - 온 백성이 … 가서
  - 모든 사람이 … 가서
  lexicon: HALOT
  rationale: כָל הָעָם은 집합명사로서 공동체 전체의 이동을 가리키므로, 자연스러운 현대 한국어로 ‘모든 백성’이 적절합니다.
- source_word: וַיַּמְלִכוּ … אֶת שָׁאוּל
  english_pob_choice: they made Saul king
  chosen_korean: 사울을 왕으로 세웠습니다
  alternatives_korean:
  - 사울을 왕으로 삼았습니다
  - 사울을 왕으로 선포했습니다
  lexicon: HALOT
  rationale: מלך의 히필은 ‘왕이 되게 하다/세우다’의 뜻이므로, 본문이 말하지 않는 ‘기름 부음’이나 과도한 선포를 덧붙이지 않으면서 의미를 직접 살렸습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 야훼 면전에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: לִפְנֵי는 ‘~앞에/면전에서’의 전치사로, 제의적·공적 자리의 직접성을 살려 ‘야훼 앞에’로 옮겼습니다.
- source_word: זְבָחִים שְׁלָמִים
  english_pob_choice: peace offerings
  chosen_korean: 화목제물
  alternatives_korean:
  - 평화제물
  - 교제제물
  - 화목 제사
  lexicon: HALOT
  rationale: שְׁלָמִים은 공동체적 화평과 온전함, 함께 나누는 제의 맥락을 가진 용어이므로, POB의 주석 취지를 반영해 ‘화목제물’로 번역했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 여호와 대신 표제어가 아닌 고유명사 יְהוָה를 쓰므로, 프로젝트 기준에 따라 ‘야훼’로 보존해 신적 인격성과 언약 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אַנְשֵׁי יִשְׂרָאֵל의 성별 표지
  chosen_reading: 이스라엘의 모든 남자들
  alternative_readings:
  - 이스라엘의 모든 사람들
  - 모든 이스라엘 사람들
  rationale: אַנְשֵׁי는 문자적으로 ‘남자들’이므로, 성별 표지를 희석하지 않고 원문의 남성형을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #4: Gender-accurate over gender-neutral'
