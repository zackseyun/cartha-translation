  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּ֨שֶׂם שָׁא֣וּל אֶת הָ/עָם֮ שְׁלֹשָׁ֣ה רָאשִׁים֒ וַ/יָּבֹ֤אוּ בְ/תוֹךְ הַֽ/מַּחֲנֶה֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּכּ֥וּ אֶת עַמּ֖וֹן עַד חֹ֣ם הַ/יּ֑וֹם וַ/יְהִ֤י הַ/נִּשְׁאָרִים֙ וַ/יָּפֻ֔צוּ וְ/לֹ֥א נִשְׁאֲרוּ בָ֖/ם שְׁנַ֥יִם יָֽחַד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/011.yaml
  text: And it happened on the next day that Saul set the people in three groups[a], and they came into the midst of the camp during the morning watch and struck Ammon until the heat of the day. And it happened that the survivors were scattered[c][b], so that no two of them were left together.
  footnotes:
  - marker: a
    text: Hebrew 'three heads,' an idiom for three divisions or companies.
    reason: lexical_alternative
  - marker: b
    text: Or 'at the morning watch.' This refers to the early-morning military watch period.
    reason: cultural_note
  - marker: c
    text: Or 'until the day grew hot,' likely meaning toward midday.
    reason: lexical_alternative
translation:
  language: ko
  text: 이튿날 사울은 백성을 세 무리로 나누었습니다[a]. 그들은 새벽 경계 때 진영 한가운데로 들어가 암몬을 쳐서 날이 뜨거워질 때까지 공격하였고, 살아남은 자들은 흩어져서 그들 가운데 함께 둘이 남은 자가 없었습니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘세 머리’는 세 분대 또는 세 부대를 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘새벽 경계’는 이른 아침의 군사 경계 시간을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: ‘날이 뜨거워질 때까지’는 대개 한낮 무렵까지를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  english_pob_choice: on the next day
  chosen_korean: 이튿날
  alternatives_korean:
  - 다음 날
  - 그 이튿날
  lexicon: HALOT
  rationale: 전후 서사 흐름을 자연스럽게 살리면서도 원문의 시간 표지를 간결하게 전달합니다.
- source_word: וַיָּשֶׂם ... שְׁלֹשָׁה רָאשִׁים
  english_pob_choice: set the people in three groups
  chosen_korean: 백성을 세 무리로 나누었습니다
  alternatives_korean:
  - 백성을 세 부대로 나누었습니다
  - 백성을 세 집단으로 편성하였습니다
  lexicon: HALOT
  rationale: 직역하면 ‘세 머리’이지만 한국어에서는 군사적 분할을 드러내는 ‘세 무리로 나누다’가 의미를 가장 분명하게 전달합니다.
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  english_pob_choice: during the morning watch
  chosen_korean: 새벽 경계 때
  alternatives_korean:
  - 아침 경계 때
  - 새벽 순찰 때
  lexicon: HALOT
  rationale: 군사적 ‘watch’ 개념을 살리면서도 현대 한국어에서 자연스러운 시간 표현으로 옮겼습니다.
- source_word: וְלֹא נִשְׁאֲרוּ בָם שְׁנַיִם יָחַד
  english_pob_choice: so that no two of them were left together
  chosen_korean: 그들 가운데 함께 둘이 남은 자가 없었습니다
  alternatives_korean:
  - 그들 가운데 둘이 함께 남지 않았습니다
  - 두 사람씩 남은 자가 없었습니다
  lexicon: HALOT
  rationale: 완전한 와해를 강조하는 히브리어 관용을 유지하되, 한국어에서는 ‘함께 둘이 남은 자가 없다’로 자연스럽게 풀어냈습니다.
theological_decisions:
- issue: 서사 반복 공식 וַיְהִי ... וַיְהִי
  chosen_reading: ‘이튿날’로 앞부분을 자연스럽게 정리하고, 뒤의 사건 전개는 서술형으로 이어가 히브리어 서사 리듬을 과도하게 반복하지 않았습니다.
  alternative_readings:
  - ‘그리고 일이 있었고 … 그리고 일이 있었습니다’ 식의 직역
  - ‘그날 다음 날’처럼 더 문자적인 반복 유지
  rationale: 합쇼체 한국어의 가독성을 우선하되, 시간 전환과 사건 연쇄는 원문의 흐름대로 보존했습니다.
  doctrine_reference: 서사 번역 원칙
