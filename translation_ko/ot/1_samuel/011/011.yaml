- source_word: וְלֹא נִשְׁאֲרוּ בָם שְׁנַיִם יָחַד
  english_pob_choice: so that no two of them were left together
  chosen_korean: 그들 가운데 함께 둘이 남은 자가 없었습니다
  alternatives_korean:
  - 그들 가운데 둘이 함께 남지 않았습니다
  - 두 사람씩 남은 자가 없었습니다
  lexicon: HALOT
  rationale: 완전한 와해를 강조하는 히브리어 관용을 유지하되, 한국어에서는 ‘함께 둘이 남은 자가 없다’로 자연스럽게 풀어냈습니다.
theological_decisions:
- issue: 서사 반복 공식 וַיְהִי ... וַיְהִי
  chosen_reading: ‘이튿날’로 앞부분을 자연스럽게 정리하고, 뒤의 사건 전개는 서술형으로 이어가 히브리어 서사 리듬을 과도하게 반복하지 않았습니다.
  alternative_readings:
  - ‘그리고 일이 있었고 … 그리고 일이 있었습니다’ 식의 직역
  - ‘그날 다음 날’처럼 더 문자적인 반복 유지
  rationale: 합쇼체 한국어의 가독성을 우선하되, 시간 전환과 사건 연쇄는 원문의 흐름대로 보존했습니다.
  doctrine_reference: 서사 번역 원칙
