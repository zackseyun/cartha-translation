source:
  edition: WLC
  text: וְ/הִנֵּ֣ה שָׁא֗וּל בָּ֣א אַחֲרֵ֤י הַ/בָּקָר֙ מִן הַ/שָּׂדֶ֔ה וַ/יֹּ֣אמֶר שָׁא֔וּל מַה לָּ/עָ֖ם כִּ֣י יִבְכּ֑וּ וַ/יְסַ֨פְּרוּ ל֔/וֹ אֶת דִּבְרֵ֖י אַנְשֵׁ֥י יָבֵֽישׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/005.yaml
  text: And behold[a], Saul was coming from the field behind the cattle, and Saul said, “What is wrong with the people[b], that they are weeping?” And they told him the words of the men of Jabesh.
  footnotes:
  - marker: a
    text: Or “following the oxen.” The Hebrew phrase אַחֲרֵי הַבָּקָר can be understood as Saul coming along after the bovines from the field.
    reason: lexical_alternative
  - marker: b
    text: Or “the message of the men of Jabesh.” Literally, “the words of the men of Jabesh.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 사울이 들판에서 소들 뒤를 따라오고 있었습니다.[a] 사울이 말했습니다. “백성에게 무슨 일이 있기에 그들이 울고 있습니까?” 그러자 그들이 야베스 사람들의 말을 그에게 전했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “소들 뒤에서.” 히브리어 אַחֲרֵי הַבָּקָר는 문자적으로 “소들 뒤에/뒤에서”라는 뜻이며, 문맥상 소들을 따라오는 모습으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “야베스 사람들의 전언.” 히브리어는 문자적으로 “야베스 사람들의 말”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보라
  alternatives_korean:
  - 그리고 보니
  - 보십시오
  lexicon: HALOT
  rationale: 서술 전환과 장면 제시의 감탄적 기능을 살려, 현대 한국어에서도 자연스러운 「보라」로 옮겼습니다.
- source_word: בָּא אַחֲרֵי הַבָּקָר מִן הַשָּׂדֶה
  english_pob_choice: was coming from the field behind the cattle
  chosen_korean: 밭에서 소들 뒤를 따라오고 있었습니다
  alternatives_korean:
  - 들판에서 소들 뒤를 따라오고 있었습니다
  - 밭에서 가축 뒤를 따라오고 있었습니다
  lexicon: HALOT
  rationale: אַחֲרֵי의 공간적 의미를 살려 ‘뒤를 따라’로 옮기고, בָּקָר는 여기서 소들로 구체화할 수 있어 문맥상 자연스럽게 처리했습니다.
- source_word: מַה לָּעָם כִּי יִבְכּוּ
  english_pob_choice: What is wrong with the people, that they are weeping?
  chosen_korean: 백성에게 무슨 일이라도 있습니까? 왜 저들이 울고 있습니까?
  alternatives_korean:
  - 백성에게 무슨 일이 있습니까? 왜 저들이 울고 있습니까?
  - 백성에게 무슨 문제가 있습니까? 왜 저들이 울고 있습니까?
  lexicon: HALOT
  rationale: 히브리어 관용구의 질문 압박감을 한국어에서 자연스럽게 드러내기 위해 두 개의 짧은 질문으로 풀었습니다.
- source_word: דִּבְרֵי אַנְשֵׁי יָבֵישׁ
  english_pob_choice: the words of the men of Jabesh
  chosen_korean: 야베스 사람들의 말
  alternatives_korean:
  - 야베스 남자들의 말
  - 야베스 사람들의 이야기
  lexicon: HALOT
  rationale: דִּבְרֵי는 문자적으로 ‘말들/말’이지만, 한국어에서는 보고된 발화를 자연스럽게 보이게 하되 ‘야베스 사람들’로 집단 지시를 유지했습니다.
theological_decisions:
- issue: 사울의 왕적 위상과 서술 시점
  chosen_reading: 사울이 아직도 들판에서 소를 따라오고 있는 장면을 그대로 살려, 왕이지만 농사 현장에 있는 겸손한 일상성을 드러냈습니다.
  alternative_readings:
  - 사울이 들판에서 돌아오고 있었습니다
  - 사울이 소를 몰고 있었습니다
  rationale: 본문은 사울의 즉위 직후 상황을 배경으로 하며, 동작의 진행성과 소 뒤를 따르는 구체적 장면이 대비를 이룹니다.
  doctrine_reference: 서술 맥락과 왕권의 초기 상태에 대한 본문 중심 읽기
- issue: 백성과 야베스 사람들에 대한 보고 방식
  chosen_reading: 직접 인용 대신 ‘말’을 전하는 간접 보고를 유지해, 원문의 정보 전달 구조를 보존했습니다.
  alternative_readings:
  - ‘야베스 사람들의 말을’
  - ‘야베스에서 온 소식을’
  rationale: דִּבְרֵי의 직역 가능성을 유지하되 한국어 가독성을 위해 문맥상 자연스러운 보고문으로 처리했습니다.
  doctrine_reference: 본문의 서술 구조와 보고 체계
