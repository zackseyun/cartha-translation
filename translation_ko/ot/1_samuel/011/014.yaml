lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל
  english_pob_choice: Then Samuel said
  chosen_korean: 그러자 사무엘이 말했습니다
  alternatives_korean:
  - 그리고 사무엘이 말했습니다
  - 그때 사무엘이 말했습니다
  lexicon: WLC narrative waw-consecutive
  rationale: 서술 진행을 자연스럽게 이어 주는 접속으로 ‘그러자’를 택해, 히브리어의 사건 전개와 한국어 문장을 모두 살렸습니다.
- source_word: אֶל הָעָם
  english_pob_choice: to the people
  chosen_korean: 백성에게
  alternatives_korean:
  - 사람들에게
  - 백성들 앞에
  lexicon: HALOT
  rationale: 문맥상 모인 이스라엘 공동체를 가리키므로, 평이하면서도 집합성을 드러내는 ‘백성’이 가장 적절합니다.
- source_word: לְכוּ וְנֵלְכָה
  english_pob_choice: Come, let us go
  chosen_korean: 「길갈로 가서
  alternatives_korean:
  - 「오십시오, 우리 함께 길갈로 갑시다
  - 「가자, 길갈로 가서
  lexicon: HALOT
  rationale: 초청형 명령 ‘לְכוּ’와 공동의 의지 ‘וְנֵלְכָה’를 한국어에서는 한 호흡으로 묶어, 부자연스러운 중복 없이 ‘가서’로 옮겼습니다.
- source_word: הַמְּלוּכָה
  english_pob_choice: the kingship
  chosen_korean: 왕권을
  alternatives_korean:
  - 왕국을
  - 왕정을
  - 통치를
  lexicon: HALOT
  rationale: מְלוּכָה는 여기서 나라 전체보다 왕의 직분과 통치 권한을 가리키므로, ‘왕권’이 ‘왕국’보다 원문의 초점을 더 정확히 반영합니다.
theological_decisions:
- issue: הַמְּלוּכָה의 의미 범위
  chosen_reading: 사울의 왕권을 공적으로 새롭게 확인하는 말로 읽었습니다.
  alternative_readings:
  - 왕국의 제도를 새로 세우는 뜻
  - 즉위식을 다시 여는 뜻
  rationale: 문맥은 사울의 구원 승리 직후 백성의 지지를 재확인하는 흐름이므로, 과도한 의례 해석보다 ‘새롭게 합시다’라는 원문의 개방성을 살리는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3, §5
