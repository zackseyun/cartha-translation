  rationale: 따옴표의 구조 오류를 바로잡고, 길갈로 가자는 권유와 공동 제안의 뉘앙스를 자연스러운 합쇼체로 드러냈습니다. ‘왕권을 새롭게 합시다’는 본문의 표현을 유지하되, 각주에서 ‘재확인하다’ 및 ‘왕국’이라는 가능한 의미 범위를 제시하여 해석을 과도하게 확정하지 않았습니다.
