base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/009.yaml
  text: 'They said to the messengers who were coming[a], “Thus you shall say to the men of Jabesh-gilead: Tomorrow, by the heat of the sun, you will have deliverance.” So the messengers came and told the men of Jabesh[b], and they rejoiced.'
  footnotes:
  - marker: a
    text: Or “to the man of Jabesh-gilead”; the Hebrew singular likely functions collectively for the inhabitants of the city.
    reason: lexical_alternative
  - marker: b
    text: Or “when the sun is hot,” that is, around the hottest part of the day.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 오는 사자들에게 말했습니다. 「너희는 이렇게 말하십시오. ‘야베스 길르앗 사람들에게 내일은 해가 뜨거울 때 너희에게 구원이 있을 것이다.’」 사자들이 와서 야베스 사람들에게 전하자 그들이 기뻐했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들
  - 메신저들
  lexicon: HALOT
  rationale: 문맥상 천사가 아니라 소식을 전하러 온 인간 전달자들이므로, 전통적이면서도 자연스러운 ‘사자들’로 옮겼습니다.
- source_word: הַבָּאִים
  english_pob_choice: who were coming
  chosen_korean: 오는
  alternatives_korean:
  - 와 있는
  - 와서
  lexicon: HALOT
  rationale: 현재분사적 수식을 살려 ‘오는’으로 두어, 도착 직전의 진행 중인 상태를 반영했습니다.
- source_word: כֹּה תֹאמְרוּן
  english_pob_choice: Thus you shall say
  chosen_korean: 이렇게 말하십시오
  alternatives_korean:
  - 그렇게 말하십시오
  - 다음과 같이 말하십시오
  lexicon: HALOT
  rationale: 직접화법을 여는 관용구로서 한국어에서는 가장 자연스럽고 분명한 안내 표현인 ‘이렇게 말하십시오’를 택했습니다.
- source_word: מָחָר תִּהְיֶה לָכֶם תְּשׁוּעָה
  english_pob_choice: Tomorrow, by the heat of the sun, you will have deliverance
  chosen_korean: 내일은 해가 뜨거울 때 너희에게 구원이 있을 것이다
  alternatives_korean:
  - 내일, 해가 뜨거울 때 너희에게 구원이 있을 것이다
  - 내일, 한낮의 열기 속에 너희는 구원을 얻을 것이다
  lexicon: HALOT
  rationale: תשועה는 여기서 전투적 구출을 가리키므로 ‘구원’으로 옮기되, ‘있을 것이다’로 히브리어의 존재문 구조를 살렸습니다.
- source_word: בְּחֹם הַשָּׁמֶשׁ
  english_pob_choice: by the heat of the sun
  chosen_korean: 해가 뜨거울 때
  alternatives_korean:
  - 태양의 열기 속에
  - 한낮의 더위에
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘해가 뜨거울 때’를 유지해, 시간대와 열기의 감각을 함께 전달했습니다.
