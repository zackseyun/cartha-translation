review_pass:
  verdict: revise
  source_fidelity: ‘오는 사자들’은 히브리어 분사의 표면적 진행성을 따르려 한 것이나, 이 문맥에서는 야베스에서 찾아와 도움을 청한 인간 사절들을 가리키므로 ‘찾아온 사자들’이 더 정확하고 자연스럽습니다. תשועה는 군사적 위협으로부터의 구출을 뜻하므로 ‘구출’로 명시했습니다. ‘해가 뜨거울 때’는 בְּחֹם הַשָּׁמֶשׁ의 시간적 표현을 보존합니다.
  naturalness: 본문의 서술과 직접 인용을 현대 표준 한국어 합쇼체로 일관되게 다듬었습니다. ‘사자들이 와서’보다 ‘사자들은 … 전했고’가 앞서 찾아온 사절들이 야베스로 돌아가 소식을 전달한 흐름을 한국어로 더 매끄럽게 나타냅니다.
  terminology: מַלְאָכִים는 문맥상 천사가 아닌 ‘사절들’로, תְּשׁוּעָה는 신학적 의미를 불필요하게 부각하지 않는 ‘구출’로 옮겼습니다. ‘야베스 길르앗’ 및 ‘야베스’의 지명 관계와, 첫 번째 집합적 단수 표현 및 뒤의 복수 표현의 차이는 각주로 처리했습니다.
  issues:
  - severity: medium
    issue: ‘오는 사자들’
    rationale: 한국어에서는 이미 도움을 청하러 도착한 사절을 수식하는 말로 부자연스럽고, 이후 그들이 야베스에 가서 전한다는 서사 흐름도 흐립니다.
  - severity: medium
    issue: ‘너희에게 구원이 있을 것이다’
    rationale: 문법적으로 가능하지만, 이 문맥의 군사적 구출을 ‘구출을 받게 될 것입니다’로 옮기는 편이 현대 한국어에서 더 자연스럽고 의미 범위도 더 구체적입니다.
  - severity: low
    issue: 합쇼체 종결의 불일치
    rationale: 서술문 ‘말했습니다’와 달리 인용문 안의 미래 표현이 ‘것이다’로 되어 있어, 지정된 현대 정중체에 맞춰 ‘것입니다’로 통일하는 것이 적절합니다.
  revised_text: 그들이 찾아온 사절들에게 말했습니다. “너희는 야베스 길르앗 사람들에게 이렇게 말하십시오. ‘내일 해가 뜨거울 때에 너희는 구출을 받게 될 것입니다.’” 사절들은 야베스 사람들에게 가서 이 말을 전했고, 그들은 기뻐했습니다.
  revised_footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘야베스 길르앗의 사람’이라고 단수로 되어 있으나, 여기서는 그 성읍의 주민들을 집합적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘해가 뜨거울 때,’ 곧 하루 중 가장 더운 때를 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 문맥상 도착해 도움을 요청한 사절이라는 의미를 자연스럽게 반영하고, 군사적 구출이라는 תשועה의 의미를 분명히 했습니다. 집합적 단수와 ‘해가 뜨거울 때’라는 시간 표현의 해석 가능성은 해당 어구에 맞는 각주로 보존했습니다.
