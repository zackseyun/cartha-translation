  - severity: high
    issue: 위협 문장의 수식 관계
    rationale: ‘누구든지 … 나오지 않는 자에게는’ 뒤에 ‘그 소들에게 하겠습니다’라고 하면 위협받는 대상과 소유 관계가 불명확합니다. 원문은 불참자의 소에게 소들을 토막 낸 것과 같은 일이 일어날 것이라고 합니다.
