  text: וַ/יִּקַּח֩ צֶ֨מֶד בָּקָ֜ר וַֽ/יְנַתְּחֵ֗/הוּ וַ/יְשַׁלַּ֞ח בְּ/כָל גְּב֣וּל יִשְׂרָאֵל֮ בְּ/יַ֣ד הַ/מַּלְאָכִ֣ים לֵ/אמֹר֒ אֲשֶׁר֩ אֵינֶ֨/נּוּ יֹצֵ֜א אַחֲרֵ֤י שָׁאוּל֙ וְ/אַחַ֣ר שְׁמוּאֵ֔ל כֹּ֥ה יֵעָשֶׂ֖ה לִ/בְקָר֑/וֹ וַ/יִּפֹּ֤ל פַּֽחַד יְהוָה֙ עַל הָ/עָ֔ם וַ/יֵּצְא֖וּ כְּ/אִ֥ישׁ אֶחָֽד־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/007.yaml
  text: Then he took a yoke of oxen and cut them in pieces[a], and sent them throughout all the territory of Israel by the hand of the messengers, saying, “Whoever does not come out after Saul and after Samuel, so shall it be done to his oxen.” Then the dread of Yahweh fell on the people[d][c][b], and they came out as one man.
  footnotes:
  - marker: a
    text: Or “a pair of oxen.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “by the hand of the messengers,” an idiom meaning “by means of the messengers.”
    reason: cultural_note
  - marker: c
    text: Or “the fear of the LORD fell on the people.” Here the sense is likely a divinely sent dread that moved them to act.
    reason: alternative_reading
  - marker: d
    text: Hebrew “as one man,” an idiom for unified action.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 소 한 쌍[a]을 가져다가 그것들을 토막 내고, 전령들을 통해[b] 이스라엘 온 땅에 보내면서 말했습니다. “누구든지 사울과 사무엘을 따라 나오지 않으면, 그의 소도 이와 같이 될 것입니다.” 그러자 야훼에게서 온 두려움[c]이 백성에게 임했고, 그들은 한 사람처럼[d] 나왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צֶמֶד בָּקָר는 직역하면 ‘소 한 멍에’이며, 멍에에 함께 매인 소 한 쌍을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘전령들의 손으로’이며, 전령들을 수단으로 삼았다는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 직역하면 ‘야훼의 두려움’입니다. 문맥상 백성을 행동하게 한, 야훼에게서 비롯된 두려움으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 히브리어 ‘한 사람처럼’은 모두가 일치하여 행동했다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶמֶד בָּקָר
  english_pob_choice: a yoke of oxen
  chosen_korean: 소 한 멍에
  alternatives_korean:
  - 소 두 마리
  - 한 쌍의 소
  lexicon: HALOT
  rationale: צֶמֶד는 한 짝/멍에를 뜻하고 בָּקָר는 소를 가리키므로, ‘한 멍에’로 묶인 소의 짝이라는 이미지를 살렸습니다. 한국어에서는 ‘소 한 멍에’가 짧고 자연스럽습니다.
- source_word: וַיְנַתְּחֵהוּ
  english_pob_choice: cut them in pieces
  chosen_korean: 그것을 조각내어
  alternatives_korean:
  - 그것을 여러 조각으로 잘라
  - 찢어
  lexicon: HALOT
  rationale: נתח의 핵심은 ‘조각내다’이며, 히브리어의 단수 목적어는 집합적으로 한 멍에의 소를 가리킵니다. 한국어에서는 동작의 결과를 분명히 하는 ‘조각내어’가 적절합니다.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  english_pob_choice: throughout all the territory of Israel
  chosen_korean: 이스라엘 온 경계에
  alternatives_korean:
  - 이스라엘 온 땅에
  - 이스라엘의 모든 지역에
  lexicon: HALOT
  rationale: גְּבוּל은 경계/영역/지경을 뜻할 수 있는데, 여기서는 전달 범위를 나타내므로 ‘온 경계에’로 옮겼습니다. POB의 ‘territory’보다 원문의 경계 이미지를 조금 더 살렸습니다.
- source_word: בְּיַד הַמַּלְאָכִים
  english_pob_choice: by the hand of the messengers
  chosen_korean: 사자들을 통해
  alternatives_korean:
  - 사자들의 손으로
  - 전령들을 통하여
  lexicon: HALOT
  rationale: בְּיַד는 직역하면 ‘손에 의해’이지만 실제로는 매개/수단의 관용구입니다. 한국어에서는 의미를 자연스럽게 드러내는 ‘~을 통해’가 가장 분명합니다.
- source_word: פַּחַד יְהוָה
  english_pob_choice: the dread of Yahweh
  chosen_korean: 야훼의 두려움
  alternatives_korean:
  - 야훼의 공포
  - 야훼에 대한 두려움
  lexicon: HALOT
  rationale: פַּחַד는 일반적인 ‘두려움’보다 더 강한 ‘공포/전율’까지 포괄할 수 있지만, 문맥상 백성을 움직이게 한 신적 압도감을 나타냅니다. POB의 ‘dread’를 살려 ‘야훼의 두려움’으로 두었습니다.
- source_word: כְּאִישׁ אֶחָד
  english_pob_choice: as one man
  chosen_korean: 한 사람처럼
  alternatives_korean:
  - 한 사람으로서
  - 한마음으로
  lexicon: HALOT
  rationale: 직역하면 ‘한 사람처럼’이며, 히브리어 관용구의 통일된 행동을 보여 줍니다. 자연스러우면서도 집단의 일치성을 유지하는 표현입니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문 고유명사를 살리기 위해 전통적 대체어 대신 음역형 ‘야훼’를 사용했습니다. 본문이 직접 신적 이름을 말하는 만큼 제목형 대체는 피했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH → Yahweh'
- issue: פַּחַד יְהוָה의 의미
  chosen_reading: 야훼가 백성에게 내리신 압도적 두려움
  alternative_readings:
  - 야훼를 경외하는 마음
  - 단순한 놀라움
  rationale: 문맥은 경건한 경외라기보다 즉각적인 동원을 일으키는 신적 공포를 가리킵니다. 따라서 의미를 약화시키지 않고 서술 흐름에 맞게 옮겼습니다.
  doctrine_reference: Narrative context of divine compulsion
- issue: כְּאִישׁ אֶחָד의 관용구
  chosen_reading: 한 사람처럼
  alternative_readings:
  - 한마음으로
  - 한결같이
  rationale: 히브리어의 남성 단수 형식과 집단적 일치의 이미지를 유지하면서, 한국어에서도 성별 중립화로 흐리지 않는 표현을 택했습니다.
  doctrine_reference: Gender-accurate over gender-neutral
