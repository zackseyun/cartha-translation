id: 1SA.11.13
reference: 1 Samuel 11:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל לֹֽא יוּמַ֥ת אִ֖ישׁ בַּ/יּ֣וֹם הַ/זֶּ֑ה כִּ֥י הַ/יּ֛וֹם עָשָֽׂה יְהוָ֥ה תְּשׁוּעָ֖ה בְּ/יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/013.yaml
  text: But Saul said[a], “Not a man shall be put to death on this day, for today Yahweh has brought salvation in Israel.”
  footnotes:
  - marker: a
    text: Or 'the LORD has accomplished deliverance' or 'the LORD has given victory in Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 사울이 말했습니다. 「이날에는 아무도 죽임을 당하지 않을 것입니다. 오늘 야훼께서 이스라엘 가운데 구원을 이루셨기 때문입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주께서 구원을 이루셨다’, ‘주께서 이스라엘에 승리를 주셨다’로 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יוּמַת אִישׁ
  english_pob_choice: Not a man shall be put to death
  chosen_korean: 아무도 죽임을 당하지 않을 것입니다
  alternatives_korean:
  - 한 사람도 죽지 않을 것입니다
  - 어떤 사람도 처형되지 않을 것입니다
  lexicon: HALOT
  rationale: יוּמַת는 단순한 ‘죽다’보다 법적·타의적 뉘앙스가 있는 피동형이므로, 자연스러운 현대 한국어로 ‘죽임을 당하다’라고 옮겼습니다.
- source_word: בַּיּוֹם הַזֶּה
  english_pob_choice: on this day
  chosen_korean: 이날에는
  alternatives_korean:
  - 오늘은
  - 이날에
  lexicon: HALOT
  rationale: 앞의 시간 표현을 간결하게 살려 문장 흐름을 자연스럽게 하되, 강조된 금지의 시점을 분명히 드러내기 위해 ‘이날에는’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 프로젝트 기본값에 따라 고유명사로서 ‘야훼’로 옮겼습니다.
- source_word: תְּשׁוּעָה
  english_pob_choice: salvation
  chosen_korean: 구원을 이루셨기
  alternatives_korean:
  - 구원을 베푸셨기
  - 구출을 이루셨기
  - 승리를 주셨기
  lexicon: HALOT
  rationale: 군사적 맥락이지만 פּOB의 선택처럼 תְּשׁוּעָה의 더 넓은 신학적 의미를 살려 ‘구원’을 사용했고, 동사 ‘이루셨기’로 하나님의 주도적 행위를 자연스럽게 드러냈습니다.
- source_word: בְּיִשְׂרָאֵל
  english_pob_choice: in Israel
  chosen_korean: 이스라엘 가운데
  alternatives_korean:
  - 이스라엘 안에
  - 이스라엘에서
  - 이스라엘을 위하여
  lexicon: HALOT
  rationale: 전치사 ב는 여기서 장소/범위 의미가 자연스러우므로, 한국어의 범위 표현 ‘가운데’를 써서 하나님의 구원이 이스라엘 공동체 안에서 일어났음을 살렸습니다.
theological_decisions:
- issue: תְּשׁוּעָה의 번역을 군사적 ‘승리’로 좁힐지 여부
  chosen_reading: ‘구원’으로 유지하여 군사적 결과를 넘는 신학적 폭을 보존했습니다.
  alternative_readings:
  - 승리
  - 구출
  - 해방
  rationale: 문맥상 전투의 승리가 분명하지만, 사울의 말은 그 승리를 야훼의 구원 행위로 해석합니다. 따라서 ‘구원’을 택해 본문의 신학적 초점을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
