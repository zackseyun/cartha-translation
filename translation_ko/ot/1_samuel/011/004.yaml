id: 1SA.11.4
reference: 1 Samuel 11:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ הַ/מַּלְאָכִים֙ גִּבְעַ֣ת שָׁא֔וּל וַ/יְדַבְּר֥וּ הַ/דְּבָרִ֖ים בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יִּשְׂא֧וּ כָל הָ/עָ֛ם אֶת קוֹלָ֖/ם וַ/יִּבְכּֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/004.yaml
  text: When the messengers came to Gibeah of Saul and spoke these words in the hearing of the people[a], all the people lifted up their voices and wept.
  footnotes:
  - marker: a
    text: Or 'raised their voices and wept.' The Hebrew idiom is literally 'lifted up their voice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울의 기브아에 사자들이 도착하여 그 말을 백성의 귀에 전하자, 모든 백성이 소리를 높여 울었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלְאָכִים
  english_pob_choice: the messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들
  - 사절들
  lexicon: HALOT
  rationale: 여기서는 천사가 아니라 사람으로 파견된 전달자들이므로, 문맥상 자연스러운 ‘사자들’로 옮겼습니다.
- source_word: גִּבְעַת שָׁאוּל
  english_pob_choice: Gibeah of Saul
  chosen_korean: 사울의 기브아
  alternatives_korean:
  - 사울의 고을 기브아
  - 기브아
  lexicon: HALOT
  rationale: 히브리어의 소유 관계를 살리면서도 한국어에서 더 자연스럽게 들리도록 ‘사울의 기브아’로 옮겼습니다.
- source_word: בְּ/אָזְנֵ֣י הָ/עָ֑ם
  english_pob_choice: in the hearing of the people
  chosen_korean: 백성의 귀에
  alternatives_korean:
  - 백성이 듣는 가운데
  - 백성 앞에서
  lexicon: HALOT
  rationale: 직역에 가까운 관용구를 살려, 공적으로 들리게 전했다는 의미를 ‘백성의 귀에’로 반영했습니다.
- source_word: וַ/יִּשְׂא֧וּ כָל הָ/עָ֛ם אֶת קוֹלָ֖/ם
  english_pob_choice: all the people lifted up their voices
  chosen_korean: 모든 백성이 소리를 높여
  alternatives_korean:
  - 모든 백성이 목소리를 높여
  - 모든 백성이 소리를 높이며
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순히 ‘말하다’가 아니라 큰 소리로 울부짖는 반응을 가리키므로, 자연스러운 한국어 표현인 ‘소리를 높여’로 옮겼습니다.
- source_word: וַ/יִּבְכּֽוּ
  english_pob_choice: and wept
  chosen_korean: 울었습니다
  alternatives_korean:
  - 통곡했습니다
  - 울어 버렸습니다
  lexicon: HALOT
  rationale: 감정적 애도 상황을 드러내되, 과도하게 확대하지 않는 기본 의미로 ‘울었습니다’를 택했습니다.
