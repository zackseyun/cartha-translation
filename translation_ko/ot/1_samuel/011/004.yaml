  naturalness: 문장은 현대 표준 한국어 합쇼체로 자연스럽고 읽기 쉽습니다. ‘백성의 귀에’는 다소 문어적이지만 성경 번역의 격식 안에서 자연스러우며 원문의 관용적 표현을 살립니다.
  terminology: ‘사울의 기브아’, ‘사자들’, ‘백성’은 문맥과 한국어 성경 문체에 적합합니다. ‘울었습니다’는 וַיִּבְכּוּ의 기본 의미를 과장 없이 정확히 전달합니다.
