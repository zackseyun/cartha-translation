  text: So the men of Jabesh said[a], “Tomorrow we will come out to you, and you may do to us whatever seems good in your eyes.”
  footnotes:
  - marker: a
    text: Or 'we will go out to you'; the Hebrew does not explicitly say 'surrender,' though the context implies submission.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 야베스 사람들이 말했습니다. 「내일 우리가 여러분에게 나가겠으니, 여러분 눈에 좋게 여기는 대로 우리에게 하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘항복하다’를 직접 말하지 않고 ‘나가다’라고만 합니다. 문맥상 항복이 암시될 뿐입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: So ... said
  chosen_korean: 그리하여 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그러자 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속으로 이어지는 서술의 흐름을 한국어 자연스러운 인과·전개 표현으로 옮겼습니다.
- source_word: אַנְשֵׁי יָבֵישׁ
  english_pob_choice: the men of Jabesh
  chosen_korean: 야베스 사람들
  alternatives_korean:
  - 야베스의 남자들
  - 야베스 주민들
  lexicon: HALOT
  rationale: אַנְשֵׁי는 문자적으로 ‘사람들/남자들’이지만, 한국어에서는 집단을 자연스럽게 묶어 말하는 표현이 읽기 좋고 본문에 드러난 지명만을 따랐습니다.
- source_word: נֵצֵא אֲלֵיכֶם
  english_pob_choice: we will come out to you
  chosen_korean: 우리가 여러분에게 나가겠으니
  alternatives_korean:
  - 우리가 여러분에게 나가겠습니다
  - 여러분에게 나가겠으니
  lexicon: HALOT
  rationale: יצא의 기본뜻을 따라 ‘나가다’로 옮기되, 상대방 쪽으로 나아가는 방향을 ‘여러분에게’로 분명히 했습니다. 본문에 직접 없는 ‘항복하다’는 넣지 않았습니다.
- source_word: כְּכָל הַטּוֹב בְּעֵינֵיכֶם
  english_pob_choice: whatever seems good in your eyes
  chosen_korean: 여러분 눈에 좋게 여기는 대로
  alternatives_korean:
  - 여러분 보기에 좋은 대로
  - 여러분 눈에 옳은 대로
  lexicon: HALOT
  rationale: ‘눈에 좋다’는 히브리어 관용구를 살려, 판단 기준이 상대방의 시각에 있음을 드러냈습니다.
theological_decisions:
- issue: 후반부의 의미를 항복 선언으로 명시할지 여부
  chosen_reading: 본문에는 단순히 ‘나가겠’다고만 두고, 항복은 암시로만 남겼습니다.
  alternative_readings:
  - ‘항복하겠습니다’처럼 명시적으로 번역하기
  - ‘나가서 항복하겠습니다’로 풀어쓰기
  rationale: 영어 POB가 지적하듯 히브리어는 ‘surrender’라고 직접 말하지 않으므로, 본문이 실제로 말하는 범위를 넘지 않도록 했습니다.
  doctrine_reference: 본문 충실성
