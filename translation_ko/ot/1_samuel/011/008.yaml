translation:
  language: ko
  text: 그들을 베젝에서 소집하였는데, 이스라엘 자손은 삼십만 명이었고 유다 사람은 삼만 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이스라엘 사람들'입니다. 히브리어 원문은 '이스라엘의 아들들'이라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקְדֵם
  english_pob_choice: He mustered them
  chosen_korean: 그들을 소집하였는데
  alternatives_korean:
  - 그들을 계수하였는데
  - 그들을 검열하였는데
  lexicon: HALOT
  rationale: 군사적 문맥에서 פקד는 단순한 수적 계산보다 군대를 불러 모아 점검하는 뜻이므로, 한국어에서는 자연스럽고 군사적 뉘앙스를 살리는 '소집하다'로 옮겼습니다.
- source_word: בְּבָזֶק
  english_pob_choice: at Bezek
  chosen_korean: 베젝에서
  alternatives_korean:
  - 베젝 안에서
  - 베젝에
  lexicon: HALOT
  rationale: 지명은 음역해 보존하고, 모음 앞 ב의 장소 의미는 한국어 조사 '에서'로 자연스럽게 표현했습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘인들
  lexicon: HALOT
  rationale: 히브리어의 친족적·집합적 표현을 그대로 살려, 유다와 구별되는 집합 명칭이라는 점을 드러내기 위해 '이스라엘 자손'을 유지했습니다.
- source_word: וְאִישׁ יְהוּדָה
  english_pob_choice: the men of Judah
  chosen_korean: 유다 사람은
  alternatives_korean:
  - 유다의 남자들은
  - 유다 사람들
  lexicon: HALOT
  rationale: 단수형 איש가 집합적으로 쓰인 표현이므로, 한국어에서는 분배적·집합적 의미를 자연스럽게 나타내는 '유다 사람'으로 옮겼습니다.
theological_decisions:
- issue: 이스라엘 자손과 유다 사람의 병력 수를 병렬로 제시하는 구문
  chosen_reading: 두 집단을 구별해 각각의 병력을 병렬적으로 제시했습니다.
  alternative_readings:
  - 하나의 통합된 이스라엘 군대로 완화해 표현할 수 있음
  rationale: 본문은 이스라엘과 유다를 의도적으로 구분하여 보여 주므로, 그 구조를 보존하는 것이 서사적 의미를 정확히 드러냅니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy
