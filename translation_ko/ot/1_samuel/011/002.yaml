  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם נָחָשׁ֙ הָ/עַמּוֹנִ֔י בְּ/זֹאת֙ אֶכְרֹ֣ת לָ/כֶ֔ם בִּ/נְק֥וֹר לָ/כֶ֖ם כָּל עֵ֣ין יָמִ֑ין וְ/שַׂמְתִּ֥י/הָ חֶרְפָּ֖ה עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/002.yaml
  text: 'Nahash the Ammonite said to them, “On this condition I will make a treaty with you: that every right eye of yours be gouged out, and I will make it a disgrace upon all Israel.”'
translation:
  language: ko
  text: 나하스 암몬 사람이 그들에게 말했습니다. “이 조건으로 내가 너희와 조약을 맺겠습니다. 곧 너희의 오른눈을 모두 도려내고, 그 일을 온 이스라엘의 치욕으로 삼겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּזֹאת אֶכְרֹת לָכֶם
  english_pob_choice: On this condition I will make a treaty with you
  chosen_korean: “이 조건으로 내가 너희와 조약을 맺겠습니다”
  alternatives_korean:
  - “이 일로 내가 너희와 언약을 맺겠습니다”
  - “이 조건 아래 내가 너희와 계약을 맺겠습니다”
  lexicon: אכרת / כרת ברית
  rationale: 히브리어 표현은 문자적으로 ‘조약/언약을 자르다’이지만, 문맥상 협정 체결을 뜻하므로 ‘조약을 맺다’로 자연스럽게 옮겼습니다. POB의 조건부 협상 뉘앙스도 살렸습니다.
- source_word: בִּנְקֹר לָכֶם כָּל עֵין יָמִין
  english_pob_choice: that every right eye of yours be gouged out
  chosen_korean: “곧 너희의 오른눈을 모두 도려내고”
  alternatives_korean:
  - “너희의 오른눈을 하나도 남기지 않고 도려내고”
  - “너희의 모든 오른눈을 빼내고”
  lexicon: נקור / עין ימין
  rationale: 수동적 요구 문맥을 한국어에서는 ‘도려내고’로 옮겨 잔혹성을 직접적으로 드러냈습니다. ‘오른눈’은 원문의 개별 신체 부위를 그대로 보존합니다.
- source_word: וְשַׂמְתִּיהָ חֶרְפָּה
  english_pob_choice: I will make it a disgrace
  chosen_korean: “그 일을 온 이스라엘의 치욕으로 삼겠습니다”
  alternatives_korean:
  - “그것을 온 이스라엘의 수치로 만들겠습니다”
  - “그 일을 온 이스라엘의 모욕으로 삼겠습니다”
  lexicon: שׂים + חֶרְפָּה
  rationale: חֶרְפָּה는 단순한 감정적 수치보다 공적인 ‘치욕/모욕’의 뜻이 강해 ‘치욕’으로 옮겼습니다. 목적어 대명사 ‘-ה’를 한국어에서는 ‘그 일’로 풀어 문맥을 분명히 했습니다.
- source_word: נָחָשׁ הָעַמּוֹנִי
  english_pob_choice: Nahash the Ammonite
  chosen_korean: 나하스 암몬 사람
  alternatives_korean:
  - 나하스 암몬인
  - 나하스 암몬 사람
  lexicon: נָחָשׁ / עמוני
  rationale: 고유명사는 현대 외래어 표기법에 따라 ‘나하스’로 두고, עמוני는 ‘암몬 사람’으로 번역해 출신/소속을 분명히 했습니다.
theological_decisions:
- issue: 대화체의 협박문을 문장 구조상 어떻게 반영할지
  chosen_reading: 직접화법의 공격적 조건 제시를 살려, ‘이 조건으로… 맺겠습니다’와 ‘곧… 도려내고’로 분리해 번역했습니다.
  alternative_readings:
  - 하나의 긴 종속절로 묶는 방식
  - ‘그 조건에서’로 완화하는 방식
  rationale: 본문은 단순 정보 전달이 아니라 폭력적 협박을 극대화하는 발화이므로, 조건 제시와 결과 약속을 분리해 긴장감을 유지했습니다.
  doctrine_reference: Source discourse fidelity
