base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/009.yaml
  text: Be strong and be men[a], O Philistines, lest you become slaves to the Hebrews as they have been to you[b]. Be men and fight!
  footnotes:
  - marker: a
    text: Or, 'as they were slaves to you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'be men' is a gendered idiom of martial courage; alternatively, 'act like men' or 'show yourselves men.'
    reason: lexical_alternative
translation:
  language: ko
  text: 힘을 내고 남자답게 되십시오[a], 블레셋 사람들아. 그들이 너희에게 종이 되었던 것처럼, 너희가 히브리 사람들의 종이 되지 않도록 하십시오[b]. 남자답게 되어[a] 싸우십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하여 ‘남자들이 되십시오’입니다. 전투 상황에서 용맹을 촉구하는 남성적으로 표지된 관용구이며, ‘남자답게 행동하십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘종이 되다’는 여기서 전쟁에서 패한 뒤 상대에게 예속되는 것을 가리킵니다. ‘노예가 되다’로도 옮길 수 있습니다.
    reason: lexical_alternative
