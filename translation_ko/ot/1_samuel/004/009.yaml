base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/009.yaml
  text: Be strong and be men[a], O Philistines, lest you become slaves to the Hebrews as they have been to you[b]. Be men and fight!
  footnotes:
  - marker: a
    text: Or, 'as they were slaves to you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'be men' is a gendered idiom of martial courage; alternatively, 'act like men' or 'show yourselves men.'
    reason: lexical_alternative
translation:
  language: ko
  text: 강하고 용사답게 되십시오, 블레셋 사람들아. 히브리 사람들의 종이 되지 않도록 하십시오. 그들이 너희에게 그러했던 것처럼 말입니다. 용사답게 되고 싸우십시오![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘남자들/용사들’은 전투적 용맹을 촉구하는 관용구입니다. 직역하면 ‘남자답게 되십시오’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘종이 되다’는 여기서 전쟁 패배로 인한 예속을 가리킵니다. 더 노골적으로는 ‘노예가 되다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
