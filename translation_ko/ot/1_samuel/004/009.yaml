  - 노예가 되지 않도록 하십시오
  rationale: 여기서는 자발적 봉사가 아니라 패전으로 인한 종속이 문제이므로, 예속성을 분명히 하는 번역이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy 1
