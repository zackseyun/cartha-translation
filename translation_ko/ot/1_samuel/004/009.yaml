  lexicon: HALOT
  rationale: 직역형 ‘남자들/사내들’보다 한국어에서 martial courage를 더 직접적으로 드러내는 ‘용사답게’로 옮기되, 문장의 남성 대상성과 전투적 뉘앙스는 유지했습니다.
- source_word: תַּעַבְדוּ לָעִבְרִים
  english_pob_choice: you become slaves to the Hebrews
  chosen_korean: 히브리 사람들의 종이 되지 않도록 하십시오
  alternatives_korean:
  - 히브리 사람들에게 종이 되지 않도록 하십시오
  - 히브리 사람들의 노예가 되지 않도록 하십시오
  lexicon: HALOT
  rationale: עבד의 종속·예속 의미를 살리되, 한국어 본문에서는 ‘종’이 자연스러워 기본 채택했습니다. 이 문맥은 전쟁 패배로 인한 굴복을 경고하는 말입니다.
- source_word: כַּאֲשֶׁר עָבְדוּ לָכֶם
  english_pob_choice: as they have been to you
  chosen_korean: 그들이 너희에게 그러했던 것처럼
  alternatives_korean:
  - 그들이 너희에게 종이 되었던 것처럼
  - 그들이 너희를 섬겼던 것처럼
  lexicon: HALOT
  rationale: 앞의 ‘종이 되다’와 같은 어형을 반복하면 한국어가 지나치게 무거워져서, 비교 구문은 더 간결하게 처리했습니다. 원문의 비교 관계는 유지됩니다.
- source_word: וְנִלְחַמְתֶּם
  english_pob_choice: and fight
