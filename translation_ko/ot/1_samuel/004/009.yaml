  rationale: 전투 장면의 종결 명령을 가장 직접적이고 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 히브리어 관용구 לַאֲנָשִׁים의 한국어 처리
  chosen_reading: 용사답게 되십시오
  alternative_readings:
  - 남자답게 되십시오
  - 사내답게 되십시오
  - 장부답게 되십시오
  rationale: 원문은 성별 일반론이 아니라 전투적 용맹을 촉구하는 남성 대상의 관용구입니다. 한국어에서는 현대 독자에게 의미가 분명한 ‘용사답게’로 기능적 대응을 택했습니다.
  doctrine_reference: Translation philosophy 4
- issue: עבד의 의미를 전쟁적 예속으로 드러낼지 여부
  chosen_reading: 종이 되지 않도록 하십시오
  alternative_readings:
  - 섬기는 자가 되지 않도록 하십시오
  - 예속되지 않도록 하십시오
  - 노예가 되지 않도록 하십시오
  rationale: 여기서는 자발적 봉사가 아니라 패전으로 인한 종속이 문제이므로, 예속성을 분명히 하는 번역이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy 1
