revisions:
- from: 그러자 백성이 실로에 사람을 보냈고, 거기에서 여호와 만군의 언약궤를 — 그룹들 위에 좌정하시는 분을 — 메어 왔습니다. 그리고 엘리의 두 아들 홉니와 비느하스도 하나님의 언약궤와 함께 거기 있었습니다.[a][b]
  to: 그러자 백성은 실로로 사람을[a] 보내어, 거기에서 그룹들 위에 좌정하시는[b] 만군의 야훼의 언약궤를 메어 왔습니다. 엘리의 두 아들 홉니와 비느하스는 하나님의 언약궤와 함께 거기에 있었습니다.
  rationale: 원문에 없는 목적어 보충은 최소화하고 각주로 투명하게 처리했습니다. 신명은 POB의 Yahweh 음역 결정을 한국어에 일관되게 적용해 ‘야훼’로 수정했습니다. 또한 신적 좌정 표현의 공간적 모호성은 본문과 각주를 통해 보존했으며, 수식 구조와 각주 앵커를 자연스럽고 정확하게 정리했습니다.
