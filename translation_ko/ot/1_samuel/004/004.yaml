    rationale: ‘사람을’은 히브리어에 명시되지 않은 문맥적 보충이므로, 대안 독해라고 하기보다 보충 사실을 밝혀야 하며 ‘사람을’ 뒤에 표지를 두는 편이 정확합니다.
  - severity: low
