base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/004.yaml
  text: So the people sent to Shiloh[a], and they carried from there the ark of the covenant of Yahweh of hosts, who is enthroned above the cherubim. And the two sons of Eli, Hophni and Phinehas[b], were there with the ark of the covenant of God.
  footnotes:
  - marker: a
    text: Or 'the LORD of armies.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''who sits enthroned between the cherubim'' or ''who is enthroned above the cherubim.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 백성이 실로에 사람을 보냈고, 거기에서 여호와 만군의 언약궤를 — 그룹들 위에 좌정하시는 분을 — 메어 왔습니다. 그리고 엘리의 두 아들 홉니와 비느하스도 하나님의 언약궤와 함께 거기 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘실로로 사람을 보냈다’라는 뜻으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘그룹들 사이에 좌정하시는 분’ 또는 ‘그룹들 위에 좌정하시는 분’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח הָעָם
  english_pob_choice: So the people sent to Shiloh
  chosen_korean: 그러자 백성이 실로에 사람을 보냈고
  alternatives_korean:
  - 그러자 백성이 실로로 보냈고
  - 그리고 백성이 실로에 보냈고
  lexicon: HALOT
  rationale: 히브리어는 집합명사 ‘백성’을 주어로 두고 있으며, 문맥상 암시되는 파견 대상은 본문에 없으므로 ‘사람을’로 보충하되 과도하게 특정하지 않았습니다.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  english_pob_choice: and they carried from there
  chosen_korean: 거기에서 ... 메어 왔습니다
  alternatives_korean:
  - 거기에서 ... 가져왔습니다
  - 거기에서 ... 옮겨왔습니다
  lexicon: HALOT
  rationale: אָרוֹן을 실제로 들고 운반하는 동작을 살리기 위해 ‘메어 오다’를 택했고, 단순한 이동 일반을 뜻하는 ‘가져오다’보다 물리적 부담과 성격이 드러납니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 여호와 만군
  alternatives_korean:
  - 야훼 만군
  - 여호와 군대들의
  lexicon: HALOT
  rationale: 이 절의 대체역에 맞춰 전승된 교회용 표기 ‘여호와’를 유지하되, צְבָאוֹת는 ‘만군’으로 옮겨 신적 칭호의 관용성과 무게를 보존했습니다.
- source_word: יֹשֵׁב הַכְּרֻבִים
  english_pob_choice: who is enthroned above the cherubim
  chosen_korean: 그룹들 위에 좌정하시는 분을
  alternatives_korean:
  - 그룹들 사이에 좌정하시는 분을
  - 그룹들 위에 왕좌에 앉아 계신 분을
  lexicon: HALOT
  rationale: 영어 POB의 ‘enthroned’에 맞춰 단순한 앉음을 넘어 왕적 좌정의 뜻을 살렸고, 장소 표지는 본문이 요구하는 ‘위에’로 두었습니다.
- source_word: חָפְנִי וּפִינְחָס
  english_pob_choice: Hophni and Phinehas
  chosen_korean: 홉니와 비느하스
  alternatives_korean:
  - 호프니와 비느하스
  - 홉니와 핀하스
  lexicon: HALOT
  rationale: 성경에서 널리 통용되는 인명 음역을 따랐습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 절은 기존 교회권 독자에게 즉시 पहचान되는 전승형 표기가 유익하며, 본문 의미를 훼손하지 않는 범위에서 고유명사의 인지 가능성을 우선했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH'
- issue: יֹשֵׁב הַכְּרֻבִים의 번역
  chosen_reading: 그룹들 위에 좌정하시는 분
  alternative_readings:
  - 그룹들 사이에 좌정하시는 분
  - 그룹들 위에 앉아 계신 분
  rationale: 이 표현은 언약궤와 결부된 야훼의 왕권/현존을 가리키므로, 단순한 공간 묘사보다 ‘좌정’이 신학적 무게를 더 잘 드러냅니다.
  doctrine_reference: POB divine enthronement formula
