source:
  edition: WLC
  text: וַ/יְהִ֞י כְּ/הַזְכִּיר֣/וֹ אֶת אֲר֣וֹן הָ/אֱלֹהִ֗ים וַ/יִּפֹּ֣ל מֵֽ/עַל הַ֠/כִּסֵּא אֲחֹ֨רַנִּ֜ית בְּעַ֣ד יַ֣ד הַ/שַּׁ֗עַר וַ/תִּשָּׁבֵ֤ר מַפְרַקְתּ/וֹ֙ וַ/יָּמֹ֔ת כִּֽי זָקֵ֥ן הָ/אִ֖ישׁ וְ/כָבֵ֑ד וְ/ה֛וּא שָׁפַ֥ט אֶת יִשְׂרָאֵ֖ל אַרְבָּעִ֥ים שָׁנָֽה׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/018.yaml
  text: And it happened[a], when he mentioned the ark of God, that Eli fell backward from the seat by the side of the gate, and his neck was broken and he died, for the man was old and heavy[b]. And he had judged Israel forty years.
  footnotes:
  - marker: a
    text: Or 'by the gate' or 'at the side of the gate.' The Hebrew idiom is literally 'at/by the hand of the gate.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'heavy.' The term may imply that Eli's weight, together with his age, contributed to the fatal fall.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 하나님의 궤를 언급하자, 엘리가 문 곁의 의자에서 뒤로 넘어져 목이 부러져 죽었습니다. 그 사람은 늙고 몸이 무거웠습니다[a]. 그는 이스라엘을 사십 년 동안 재판했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘문/성문의 손(곁)’에 해당하며, ‘문 곁’, ‘성문 곁’, ‘성문의 옆’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהַזְכִּירוֹ
  english_pob_choice: when he mentioned
  chosen_korean: 그가 …를 언급하자
  alternatives_korean:
  - 그가 …를 말하자
  - 그가 …를 언급했을 때
  lexicon: HALOT
  rationale: הִזְכִּיר의 문맥상 의미를 ‘언급하다’로 옮기면 시간 절과 원인적 계기를 자연스럽게 살릴 수 있습니다.
- source_word: אֲרוֹן הָאֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 궤
  alternatives_korean:
  - 하나님 궤
  - 하나님의 법궤
  lexicon: HALOT
  rationale: 직역에 가깝게 ‘하나님의 궤’로 두어, 본문이 가리키는 언약궤 전승을 지나치게 교회식으로 고정하지 않으면서도 의미를 분명히 했습니다.
- source_word: בְּעַד יַד הַשַּׁעַר
  english_pob_choice: by the side of the gate
  chosen_korean: 문 곁
  alternatives_korean:
  - 성문 곁
  - 성문의 옆
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 옮기되, 성문 가까이 있었음을 유지하기 위해 ‘문 곁’으로 처리했습니다.
- source_word: וַתִּשָּׁבֵר מַפְרַקְתּוֹ
  english_pob_choice: his neck was broken
  chosen_korean: 목이 부러져
  alternatives_korean:
  - 목뼈가 부러져
  - 목이 꺾여
  lexicon: HALOT
  rationale: 결과를 직접적으로 전달하는 표현으로, 사망 원인을 분명하게 드러내면서도 과도한 해부학적 번역은 피했습니다.
- source_word: וְכָבֵד
  english_pob_choice: heavy
  chosen_korean: 몸이 무거웠습니다
  alternatives_korean:
  - 무거웠습니다
  - 비대했습니다
  lexicon: HALOT
  rationale: כָבֵד의 기본 의미인 ‘무겁다’를 살리되, 한국어에서는 체중과 관련된 상황적 함의를 자연스럽게 드러내기 위해 ‘몸이 무거웠습니다’로 옮겼습니다.
theological_decisions:
- issue: אֲרוֹן הָאֱלֹהִים의 신학적 지시 대상
  chosen_reading: 이스라엘의 하나님을 가리키는 언약궤로 이해해 ‘하나님의 궤’로 번역했습니다.
  alternative_readings:
  - 신들의 궤
  - 하나님들의 궤
  rationale: 이 서사 문맥에서는 복수 신이 아니라 야훼의 궤를 뜻하므로 단수 신적 지시로 읽어야 하며, 본문의 역사적·언약적 의미를 보존합니다.
  doctrine_reference: 출애굽기 25장과 사무엘상 문맥의 언약궤 전승
