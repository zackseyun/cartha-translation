  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֤רָץ אִישׁ בִּנְיָמִן֙ מֵ/הַ/מַּ֣עֲרָכָ֔ה וַ/יָּבֹ֥א שִׁלֹ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וּ/מַדָּ֣י/ו קְרֻעִ֔ים וַ/אֲדָמָ֖ה עַל רֹאשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/012.yaml
  text: Then a man of Benjamin ran from the battle line and came to Shiloh that same day[b][a], with his clothes torn and dirt on his head.
  footnotes:
  - marker: a
    text: Or 'from the battle' or 'from the ranks'; the Hebrew term refers more specifically to the battle array or line of engagement.
    reason: lexical_alternative
  - marker: b
    text: Torn clothes and dirt on the head were customary signs of grief, distress, or disaster.
    reason: cultural_note
translation:
  language: ko
  text: 그때 베냐민 사람 한 명이 전열에서 달려 그날 실로에 이르렀습니다. 그의 옷은 찢어져 있었고, 머리에는 흙을 뒤집어쓰고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전열’은 단순히 ‘전투’보다 더 구체적으로 전투 배열이나 교전선을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 찢어진 옷과 머리의 흙은 슬픔, 비탄, 재앙을 나타내는 관습적 표지였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ בִּנְיָמִן
  english_pob_choice: a man of Benjamin
  chosen_korean: 베냐민 사람 한 명
  alternatives_korean:
  - 베냐민 지파 사람 한 명
  - 베냐민 출신의 한 사람
  lexicon: HALOT
  rationale: 히브리어의 직설적 신분 표지를 자연스럽게 살리면서, 한국어에서 더 익숙한 ‘~사람’ 구성을 택했습니다.
- source_word: מֵהַמַּעֲרָכָה
  english_pob_choice: from the battle line
  chosen_korean: 전열에서
  alternatives_korean:
  - 전투에서
  - 전열에서부터
  - 진영에서
  lexicon: HALOT
  rationale: מַעֲרָכָה는 단순한 ‘전쟁’보다 전투의 배열된 선을 가리키므로, 군사적 배치를 드러내는 ‘전열’이 가장 가깝습니다.
- source_word: וַיָּבֹא שִׁלֹה בַּיּוֹם הַהוּא
  english_pob_choice: came to Shiloh that same day
  chosen_korean: 그날 바로 실로에 이르렀습니다
  alternatives_korean:
  - 그날 실로에 도착했습니다
  - 그날 같은 날 실로에 왔습니다
  lexicon: HALOT
  rationale: ‘그날 바로’는 히브리어의 즉시성과 연속성을 자연스럽게 살리고, ‘이르렀습니다’는 이동의 도착 완료를 격식 있게 표현합니다.
- source_word: וּמַדָּיו קְרֻעִים וַאֲדָמָה עַל רֹאשׁוֹ
  english_pob_choice: with his clothes torn and dirt on his head
  chosen_korean: 그의 옷은 찢어져 있었고 머리에는 흙이 있었습니다
  alternatives_korean:
  - 그의 옷은 찢겨 있었고 머리에는 먼지가 있었습니다
  - 그의 옷은 찢어졌고 머리에는 흙이 묻어 있었습니다
  lexicon: HALOT
  rationale: 찢어진 옷과 머리의 흙은 애도와 재앙의 관습적 표지이므로, 의미를 추가하지 않으면서도 현대 한국어로 분명하게 옮겼습니다.
theological_decisions:
- issue: 애도/재난 표지의 관습적 의미
  chosen_reading: 옷이 찢어지고 머리에 흙이 있는 모습은 슬픔, 비탄, 재앙을 알리는 관습적 표지로 이해하되, 본문에는 그 상징을 풀이하지 않고 서술만 유지했습니다.
  alternative_readings:
  - 단순한 외형 묘사로만 읽기
  - 애도 의미를 본문에 직접 덧붙여 번역하기
  rationale: 히브리어는 행위의 상징성을 암시하지만 여기서는 장면의 관찰을 먼저 전달하므로, 해석을 본문 속에 과도하게 삽입하지 않는 것이 적절합니다.
  doctrine_reference: 본문 주해 원칙
- issue: מֵהַמַּעֲרָכָה의 군사적 구체성
  chosen_reading: ‘전열’로 옮겨 전투의 배열된 선이라는 구체성을 유지했습니다.
  alternative_readings:
  - ‘전쟁’으로 일반화하기
  - ‘진영’으로 완화하기
  rationale: 문맥상 소식 전달자가 전투 현장의 특정 지점에서 왔음을 보여 주므로, 군사적 구체성을 보존하는 번역이 원문 의도에 가깝습니다.
  doctrine_reference: 본문 의미 보존
