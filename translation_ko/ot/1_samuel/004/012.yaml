    rationale: בַּיּוֹם הַהוּא는 기본적으로 ‘그날에/그날’입니다. 문맥상 신속한 소식 전달을 시사할 수 있으나, ‘바로’는 원문이 명시하지 않은 즉시성을 더할 수 있습니다.
  - severity: low
    issue: ‘머리에는 흙이 있었습니다’는 다소 정태적이고 어색하게 들릴 수 있습니다.
    rationale: 히브리어의 명사절은 옷이 찢어지고 머리 위에 흙이 있는 재난·애도의 외양을 묘사합니다. ‘흙을 뒤집어쓰고 있었습니다’는 이를 자연스럽게 드러내되, 본문에 상징 해설을 삽입하지 않습니다.
