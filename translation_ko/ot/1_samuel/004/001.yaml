revisions:
- from: 그리고 사무엘의 말이 온 이스라엘에게 전해졌습니다[a]. 그때 이스라엘은 블레셋 사람들과 전쟁하기 위해 나아가 에벤에셋에 진을 쳤고, 블레셋 사람들은 아벡에 진을 쳤습니다[b].
  to: 사무엘의 말이 온 이스라엘에 전해졌습니다[a]. 이스라엘은 블레셋 사람들을 맞아 싸우려고 나아가 에벤에셀[b]에 진을 쳤고, 블레셋 사람들은 아벡에 진을 쳤습니다.
  rationale: 원문의 핵심 표현과 문장 진행을 보존하면서, 블레셋을 ‘맞아’ 싸우러 나간다는 대면의 뜻을 반영했습니다. 대안 독법 각주는 실제 가능한 의미를 정확히 제시하도록 고쳤고, 지명 각주를 지명에 직접 연결했습니다. 통용 한국어 성서 지명 표기를 적용했습니다.
