  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר שְׁמוּאֵ֖ל לְ/כָל יִשְׂרָאֵ֑ל וַ/יֵּצֵ֣א יִשְׂרָאֵל֩ לִ/קְרַ֨את פְּלִשְׁתִּ֜ים לַ/מִּלְחָמָ֗ה וַֽ/יַּחֲנוּ֙ עַל הָ/אֶ֣בֶן הָעֵ֔זֶר וּ/פְלִשְׁתִּ֖ים חָנ֥וּ בַ/אֲפֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/001.yaml
  text: And the word of Samuel came to all Israel[a]. Then Israel went out to meet the Philistines in battle, and they camped at Ebenezer[b], while the Philistines camped at Aphek.
  footnotes:
  - marker: a
    text: Or 'the report of Samuel came to all Israel.' The Hebrew can be understood as Samuel's word/message, and in context likely refers to his prophetic word.
    reason: alternative_reading
  - marker: b
    text: Ebenezer means 'stone of help.' Here it functions as a place name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 사무엘의 말이 온 이스라엘에게 전해졌습니다[a]. 그때 이스라엘은 블레셋 사람들과 전쟁하기 위해 나아가 에벤에셋에 진을 쳤고, 블레셋 사람들은 아벡에 진을 쳤습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사무엘의 소식이 온 이스라엘에 퍼졌다’로도 볼 수 있습니다. 히브리어는 사무엘의 말/메시지를 뜻할 수 있으며, 문맥상 예언적 말로 이해하는 것이 더 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: ‘에벤에셋’은 ‘도움의 돌’이라는 뜻이지만, 여기서는 지명으로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבַר שְׁמוּאֵל
  english_pob_choice: the word of Samuel
  chosen_korean: 사무엘의 말
  alternatives_korean:
  - 사무엘의 말씀
  - 사무엘의 메시지
  - 사무엘의 말씀이
  lexicon: HALOT
  rationale: 히브리어의 단수형 דְבַר를 살려 ‘말’로 옮기되, 문맥상 예언적 발언이라는 점을 드러내기 위해 사무엘의 말로 자연스럽게 표현했습니다.
- source_word: לְכָל יִשְׂרָאֵל
  english_pob_choice: to all Israel
  chosen_korean: 온 이스라엘에게
  alternatives_korean:
  - 모든 이스라엘에게
  - 이스라엘 전체에게
  lexicon: HALOT
  rationale: לְ + כָל의 도달 대상을 한국어에서 자연스럽게 살리기 위해 ‘에게’를 썼고, ‘온’으로 전체 범위를 압축해 전달했습니다.
- source_word: לִקְרַאת פְּלִשְׁתִּים לַמִּלְחָמָה
  english_pob_choice: to meet the Philistines in battle
  chosen_korean: 블레셋 사람들과 전쟁하기 위해 나아가
  alternatives_korean:
  - 블레셋 사람들을 맞으러 전쟁터로
  - 블레셋 사람들과 맞서 싸우려고
  lexicon: HALOT
  rationale: לקראת의 ‘마주하러/맞으러’ 의미와 לַמִּלְחָמָה의 전쟁 목적을 함께 반영하되, 현대 한국어에서 군사적 이동을 자연스럽게 풀어 ‘전쟁하기 위해 나아가’로 옮겼습니다.
- source_word: הָאֶבֶן הָעֵזֶר
  english_pob_choice: Ebenezer
  chosen_korean: 에벤에셋
  alternatives_korean:
  - 에벤에셀
  - 에벤에저
  lexicon: HALOT
  rationale: 이 표현은 여기서 지명으로 기능하므로 음역을 택했습니다. 한국어 음역 관행과 원어 음가를 고려해 ‘에벤에셋’으로 옮겼습니다.
- source_word: בַאֲפֵק
  english_pob_choice: Aphek
  chosen_korean: 아벡
  alternatives_korean:
  - 아펙
  - 아페크
  lexicon: HALOT
  rationale: 지명은 음역으로 처리했고, 한국어 성서 지명 관행에 맞게 ‘아벡’을 사용했습니다.
theological_decisions:
- issue: דְבַר שְׁמוּאֵל을 단순한 소문/평판이 아니라 예언적 말로 볼 것인지
  chosen_reading: 사무엘의 예언적 말이 온 이스라엘에 전해짐
  alternative_readings:
  - 사무엘에 관한 소식이 온 이스라엘에 퍼짐
  - 사무엘의 평판이 온 이스라엘에 퍼짐
  rationale: 앞 문맥에서 여호와께서 사무엘을 통해 말씀하시고 사무엘의 말이 온 이스라엘에 미쳤다는 흐름을 고려하면, 단순한 소문보다 예언적 발언으로 이해하는 것이 더 자연스럽습니다. 그래서 ‘말’은 유지하되 그 기능이 드러나도록 번역했습니다.
  doctrine_reference: Translation philosophy §1, §5
