  source_fidelity: 첫 절의 דְבַר שְׁמוּאֵל은 ‘사무엘의 말’로 유지한 것이 적절합니다. 다만 각주 a의 ‘사무엘의 소식’은 ‘사무엘에게서 온 소식’으로도 읽혀 원문의 가능한 대안인 ‘사무엘에 관한 소식/평판’과 다릅니다. 또한 לִקְרַאת의 대면·맞섬의 뜻을 본문에서 더 분명히 드러내는 편이 좋습니다.
  naturalness: 합쇼체 문장은 대체로 자연스럽습니다. ‘블레셋 사람들을 맞아 싸우려고 나아가’는 군사적 대면과 전쟁 목적을 자연스럽고 간결하게 나타냅니다. 지명 각주는 해당 지명 바로 뒤에 붙이는 것이 독자에게 명확합니다.
  terminology: 한국어 성서 지명 관행에 맞추어 הָאֶבֶן הָעֵזֶר는 ‘에벤에셀’로 표기했습니다. ‘아벡’은 유지할 수 있습니다. ‘사무엘의 말’은 사무엘에게 신적 존칭으로서의 ‘말씀’을 부여하지 않으면서 원문의 문학적 표현을 보존합니다.
