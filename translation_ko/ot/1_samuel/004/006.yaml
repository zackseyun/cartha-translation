reference: 1 Samuel 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֤וּ פְלִשְׁתִּים֙ אֶת ק֣וֹל הַ/תְּרוּעָ֔ה וַ/יֹּ֣אמְר֔וּ מֶ֠ה ק֣וֹל הַ/תְּרוּעָ֧ה הַ/גְּדוֹלָ֛ה הַ/זֹּ֖את בְּ/מַחֲנֵ֣ה הָ/עִבְרִ֑ים וַ/יֵּ֣דְע֔וּ כִּ֚י אֲר֣וֹן יְהוָ֔ה בָּ֖א אֶל הַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/006.yaml
  text: When the Philistines heard the sound of the shouting[a], they said[b], “What is this great sound of shouting in the camp of the Hebrews?” And they knew that the ark of Yahweh had come into the camp.
  footnotes:
  - marker: a
    text: Or 'the ark of Yahweh.' The main text follows the project's standard rendering of the divine name יְהוָה as 'the LORD.'
    reason: alternative_reading
  - marker: b
    text: '''Shouting'' could also be rendered ''shout'' or, in a military context, ''war cry.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 블레셋 사람들이 그 떠드는 소리의 음성을 듣고 서로 말하였습니다. 「히브리 사람들의 진영에서 나는 이 큰 떠드는 소리가 무엇이냐?」 그들은 야훼의 언약궤가 진영에 들어온 것을 알게 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוֹל
  english_pob_choice: sound
  chosen_korean: 음성
  alternatives_korean:
  - 소리
  - 목소리
  lexicon: HALOT
  rationale: 여기서는 단순한 물리적 음향을 가리키므로 ‘음성’보다 ‘소리’가 자연스럽지만, 본문 안에 다시 나오는 ‘קול’의 반복을 살리기 위해 ‘떠드는 소리의 음성’처럼 중첩을 피하고 의미를 유지했습니다.
- source_word: תְּרוּעָה
  english_pob_choice: shouting
  chosen_korean: 떠드는 소리
  alternatives_korean:
  - 외침
  - 함성
  - 전쟁 함성
  lexicon: HALOT
  rationale: 문맥상 전투 신호로 특정되기보다 5절의 환호성에 가까운 큰 외침이므로, 너무 군사적으로 좁히지 않고 소리의 성격을 드러내는 표현을 택했습니다.
- source_word: הָעִבְרִים
  english_pob_choice: the Hebrews
  chosen_korean: 히브리 사람들의
  alternatives_korean:
  - 이스라엘 사람들의
  lexicon: HALOT
  rationale: 블레셋 사람들의 관점에서 쓰인 민족칭을 그대로 유지하여, 서술자의 입장과 화자의 관점을 섞지 않았습니다.
- source_word: אֲרוֹן יְהוָה
  english_pob_choice: the ark of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 여호와의 궤
  - 주님의 언약궤
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값대로 야훼로 옮기고, אֲרוֹן은 단순한 ‘궤’보다 언약 관계를 드러내는 ‘언약궤’가 본문 의도를 더 분명히 전달합니다.
- source_word: וַיֵּדְעוּ
  english_pob_choice: they knew
  chosen_korean: 알게 되었습니다
  alternatives_korean:
  - 알았습니다
  - 깨달았습니다
  lexicon: HALOT
  rationale: 새 정보를 인지하는 결과를 나타내므로, 단순 상태의 ‘알았습니다’보다 과정의 완료를 드러내는 표현이 더 적절합니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה를 신학적 일반칭 ‘주’로 바꾸지 않고, 프로젝트 표준에 따라 언약명 자체를 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
