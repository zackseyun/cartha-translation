  rationale: 합쇼체 요구에 맞추어 모든 종결을 현대 공식 존댓말로 고쳤습니다. 복수 ‘신들’ 및 ‘광야에서’는 원문의 긴장과 블레셋 화자의 관점을 보존했습니다. ‘모든 재앙’으로 바꾸어 בְּכָל מַכָּה의 포괄성을 더 직접적으로 반영했으며, 각주에는 복수형과 단수 이해 가능성을 함께 밝혔습니다.
