  source_fidelity: ‘신들’과 복수 관계절은 히브리어의 복수형을 충실히 반영하며, ‘광야에서’도 마소라 본문을 그대로 보존합니다. 다만 ‘온갖 재앙’은 בְּכָל מַכָּה의 ‘모든 재앙/각 재앙’보다 다소 관용적·완화된 표현이므로 ‘모든 재앙’으로 조정하는 편이 더 가깝습니다.
  naturalness: 초안의 ‘있도다’와 ‘-겠느냐’는 해라체 문어체이므로, 요구된 현대 공식 존댓말 합쇼체와 일치하지 않습니다. ‘큰일 났습니다’와 ‘-겠습니까’는 절박한 탄식을 자연스럽고 현대적인 합쇼체로 전달합니다.
