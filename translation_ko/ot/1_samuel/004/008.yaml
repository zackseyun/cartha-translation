base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/008.yaml
  text: Woe to us! Who can deliver us from the hand of these mighty gods? These are the gods who struck Egypt with every plague in the wilderness[a][b].
  footnotes:
  - marker: a
    text: Or 'these mighty God(s).' The Philistines speak in plural terms, reflecting their own understanding of Israel's deity.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''in the wilderness.'' The phrase is difficult in context, since the plagues struck Egypt before Israel''s wilderness journey; the translation follows the Masoretic Text as written.'
    reason: textual_variant
translation:
  language: ko
  text: “아, 우리는 큰일 났습니다! 누가 이 위력 있는 신들의 손에서 우리를 건져 내겠습니까? 이들은 광야에서 모든 재앙으로 이집트를 친 그 신들입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘위력 있는 신들’에 복수형을 사용합니다. 이는 블레셋 사람들이 이스라엘의 하나님을 다신론적으로 이해한 것을 반영할 수 있으며, ‘위력 있는 하나님’으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어: ‘광야에서’. 애굽에 내린 재앙은 이스라엘의 광야 여정 이전에 일어났으므로, 이 표현은 문맥상 난점이 있습니다. 번역은 마소라 본문을 그대로 따릅니다.'
    reason: textual_variant
lexical_decisions:
- source_word: א֣וֹי לָ֔נוּ
