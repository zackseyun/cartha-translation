source:
  edition: WLC
  text: א֣וֹי לָ֔/נוּ מִ֣י יַצִּילֵ֔/נוּ מִ/יַּ֛ד הָ/אֱלֹהִ֥ים הָ/אַדִּירִ֖ים הָ/אֵ֑לֶּה אֵ֧לֶּה הֵ֣ם הָ/אֱלֹהִ֗ים הַ/מַּכִּ֧ים אֶת מִצְרַ֛יִם בְּ/כָל מַכָּ֖ה בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/008.yaml
  text: Woe to us! Who can deliver us from the hand of these mighty gods? These are the gods who struck Egypt with every plague in the wilderness[a][b].
  footnotes:
  - marker: a
    text: Or 'these mighty God(s).' The Philistines speak in plural terms, reflecting their own understanding of Israel's deity.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''in the wilderness.'' The phrase is difficult in context, since the plagues struck Egypt before Israel''s wilderness journey; the translation follows the Masoretic Text as written.'
    reason: textual_variant
translation:
  language: ko
  text: “아, 우리에게 화가 있도다! 누가 이 강한 신들의 손에서 우리를 건져 내겠느냐? 이들은 바로 이집트를 광야에서 온갖 재앙으로 친 그 신들이다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강한 신들’은 블레셋 사람들이 이스라엘의 하나님을 자기들의 다신론적 범주로 이해한 표현을 반영합니다.
    reason: theological_note
  - marker: b
    text: ‘광야에서’는 본문 그대로 옮겼습니다. 역사적으로는 애굽의 재앙이 이스라엘의 광야 여정 이전에 일어나므로, 이 구절은 난점이 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: א֣וֹי לָ֔נוּ
  english_pob_choice: Woe to us
  chosen_korean: 아, 우리에게 화가 있도다
  alternatives_korean:
  - 아, 우리는 망했다
  - 화가 있도다, 우리에게
  lexicon: HALOT
  rationale: 탄식과 위기의 절박함을 살리면서도, 현대 한국어에서 너무 구어적으로 흐르지 않게 옮겼습니다.
- source_word: מִי יַצִּילֵנוּ
  english_pob_choice: Who can deliver us
  chosen_korean: 누가 우리를 건져 내겠느냐
  alternatives_korean:
  - 누가 우리를 구해 내겠느냐
  - 누가 우리를 구원하겠느냐
  lexicon: HALOT
  rationale: נצל의 ‘구출하다/건져 내다’ 의미를 살리되, 절망적인 반문 구조를 한국어로 자연스럽게 표현했습니다.
- source_word: הָאֱלֹהִים הָאַדִּירִים הָאֵלֶּה
  english_pob_choice: these mighty gods
  chosen_korean: 이 강한 신들
  alternatives_korean:
  - 이 위대한 신들
  - 이 능하신 신들
  lexicon: HALOT
  rationale: 블레셋 사람들의 다신론적 인식을 그대로 반영해 복수형으로 옮겼고, אַדִּירִים은 문맥상 ‘강한’이 가장 직접적입니다.
- source_word: בְּכָל מַכָּה
  english_pob_choice: with every plague
  chosen_korean: 온갖 재앙으로
  alternatives_korean:
  - 모든 재앙으로
  - 각종 재앙으로
  lexicon: HALOT
  rationale: כָּל의 포괄성을 살려 ‘온갖’으로 옮겼고, מַכָּה의 재앙적 뉘앙스를 한국어 성경 문체에 맞게 전달했습니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 들에서
  - 사막에서
  lexicon: HALOT
  rationale: 마소라 본문의 표현을 그대로 살려 역사적으로 난점이 있어도 매끈하게 조정하지 않고 옮겼습니다.
theological_decisions:
- issue: 블레셋 사람들의 ‘신들’ 표현을 어떻게 처리할지
  chosen_reading: 복수의 ‘신들’로 유지해 그들의 오해를 보존했습니다.
  alternative_readings:
  - 단수 ‘하나님’으로 정리함
  - ‘신들’에 각주를 달아 단수 신앙을 강조함
  rationale: 본문은 이스라엘의 하나님을 블레셋식 다신론 범주로 오해하는 장면이므로, 그 긴장을 평탄화하지 않는 것이 원문의 의도에 더 가깝습니다.
  doctrine_reference: 본문의 화자 관점 보존, 신학적 긴장 유지
- issue: ‘광야에서’라는 역사적으로 거칠게 느껴지는 표현 처리
  chosen_reading: 본문 그대로 ‘광야에서’로 옮겼습니다.
  alternative_readings:
  - 문맥에 맞게 순화하거나 생략함
  - 역사적 조화를 위해 재해석함
  rationale: 마소라 본문이 가진 난점을 번역이 임의로 제거하지 않도록 했습니다. 독자가 본문 자체의 긴장을 보도록 하는 편이 원문 우선 원칙에 부합합니다.
  doctrine_reference: 원문 우선, 텍스트 난점 보존
