translation:
  language: ko
  text: 그 여인이 말했습니다. 「이스라엘에서 영광이 떠났습니다[a]. 이는 하나님의 궤가 빼앗겼기 때문입니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영광이 이스라엘에서 유배되었습니다.’ 히브리어 동사는 ‘유배되다’ 또는 ‘옮겨지다/떠나다’의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이는 하나님의 궤가 빼앗겼기 때문입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: And she said
  chosen_korean: 그 여인이 말했습니다
  alternatives_korean:
  - 그리고 그녀가 말했습니다
  - 그가 말했습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서, 장면의 주체가 아내라는 문맥을 반영해 ‘그 여인’으로 옮겼습니다. 합쇼체 서술로도 직접화법을 유지할 수 있습니다.
- source_word: גָּלָה כָבוֹד מִיִּשְׂרָאֵל
  english_pob_choice: The glory has departed from Israel
  chosen_korean: 이스라엘에서 영광이 떠났습니다
  alternatives_korean:
  - 이스라엘에서 영광이 사라졌습니다
  - 영광이 이스라엘에서 유배되었습니다
  lexicon: HALOT
  rationale: גָּלָה는 ‘떠나다/유배되다’의 폭이 있으나, כָבוֹד와 함께 한국어에서는 ‘영광이 떠났습니다’가 의미를 자연스럽게 전달합니다. ‘유배되다’는 가능하지만 한국어로는 너무 강하게 비유적이라 본문이 주는 긴장만 주석으로 남겼습니다.
- source_word: נִלְקַח אֲרוֹן הָאֱלֹהִים
  english_pob_choice: the ark of God has been taken
  chosen_korean: 하나님의 궤가 빼앗겼기 때문입니다
  alternatives_korean:
  - 하나님의 궤가 잡혀갔기 때문입니다
  - 하나님의 궤가 취해졌기 때문입니다
  lexicon: HALOT
  rationale: נִלְקַח는 수동으로 ‘취해지다/빼앗기다’의 뜻이므로, 전쟁 상황의 상실감을 살려 ‘빼앗겼다’로 옮겼습니다. ‘잡혀갔다’도 가능하지만, 한국어에서 물건이 적에게 넘어간 결과를 더 선명하게 드러내는 말은 ‘빼앗기다’입니다.
theological_decisions:
- issue: ‘영광’의 의미 범위
  chosen_reading: ‘영광’은 이스라엘이 잃은 하나님의 임재와 명예가 함께 함축된 표현으로 두되, 본문이 그 신학을 기술적으로 정의한다고는 하지 않았습니다.
  alternative_readings:
  - 이스라엘의 국가적 명예로만 이해
  - 하나님 자신이 떠나셨다는 식으로 단정
  rationale: 직접 문맥은 언약궤의 빼앗김과 연결되지만, 본문은 그 의미를 체계적으로 풀어 설명하지 않습니다. 번역은 그 긴장을 보존해야 하므로 ‘영광’의 폭을 유지했습니다.
  doctrine_reference: Theological tension should be preserved rather than over-resolved.
