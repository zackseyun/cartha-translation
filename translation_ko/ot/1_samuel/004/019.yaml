  edition: WLC
  text: וְ/כַלָּת֣/וֹ אֵֽשֶׁת פִּינְחָס֮ הָרָ֣ה לָ/לַת֒ וַ/תִּשְׁמַ֣ע אֶת הַ/שְּׁמֻעָ֔ה אֶל הִלָּקַח֙ אֲר֣וֹן הָ/אֱלֹהִ֔ים וּ/מֵ֥ת חָמִ֖י/הָ וְ/אִישָׁ֑/הּ וַ/תִּכְרַ֣ע וַ/תֵּ֔לֶד כִּֽי נֶהֶפְכ֥וּ עָלֶ֖י/הָ צִרֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/019.yaml
  text: Now his daughter-in-law[a], the wife of Phinehas, was pregnant, about to give birth. When she heard the report that the ark of God had been taken, and that her father-in-law and her husband were dead, she bowed down and gave birth[c][b], because her labor pains came upon her.
  footnotes:
  - marker: a
    text: Or, 'about the capture of the ark of God.' The Hebrew construction can be rendered either as the content of the report ('that the ark... had been taken') or more nominally ('about the capture of the ark').
    reason: lexical_alternative
  - marker: b
    text: Or, 'her father-in-law and her husband had died.' The Hebrew form may be represented in English either as a stative result ('were dead') or as a prior event ('had died').
    reason: lexical_alternative
  - marker: c
    text: Literally, 'her pains turned upon her,' an idiom meaning that her labor pains came on suddenly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 며느리, 곧 비느하스의 아내는 임신하여 해산이 가까웠습니다. 그녀가 하나님의 궤가 빼앗겼다는 소식과 시아버지와 남편이 죽었다는 소식을 듣자, 그녀는 몸을 숙여 아이를 낳았습니다. 이는 그녀의 산고가 그녀에게 몰려왔기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '하나님의 궤가 빼앗긴 일에 대해'로도 옮길 수 있습니다. 히브리어 구조는 보고의 내용과 사건 자체에 대한 언급 사이로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '시아버지와 남편이 죽었다'로도 옮길 수 있습니다. 히브리어 동사는 상태 진술처럼도, 이미 일어난 사건처럼도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 '그녀의 산통이 그녀에게 돌아섰다'에 가깝습니다. 관용적으로는 진통이 갑자기 닥친다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַלָּתוֹ / אֵשֶׁת פִּינְחָס
  english_pob_choice: his daughter-in-law, the wife of Phinehas
  chosen_korean: 그의 며느리, 곧 비느하스의 아내
  alternatives_korean:
  - 그의 며느리, 비느하스의 아내
  - 그의 며느리이자 비느하스의 아내
  lexicon: HALOT
  rationale: כַּלָּה는 여기서 '며느리'가 자연스럽고, 뒤의 동격 표현은 '곧'으로 풀어 연결하면 관계를 분명히 하면서도 원문의 설명 구조를 살릴 수 있습니다.
- source_word: הָרָה לָלַת
  english_pob_choice: was pregnant, about to give birth
  chosen_korean: 임신하여 해산이 가까웠습니다
  alternatives_korean:
  - 임신해 있었고 곧 해산할 참이었습니다
  - 임신하여 곧 낳을 상태였습니다
  lexicon: HALOT
  rationale: הָרָה는 '임신하다'이고, לָלַת는 출산의 임박함을 더하므로, 두 요소를 함께 담아 간결하게 옮겼습니다.
- source_word: אֶת הַשְּׁמֻעָה
  english_pob_choice: the report
  chosen_korean: 소식
  alternatives_korean:
  - 보고
  - 전갈
  lexicon: HALOT
  rationale: שְׁמוּעָה는 '소식/보고'의 뜻이지만, 문맥상 공적 보고라기보다 들은 소식을 가리키므로 한국어에서는 자연스러운 '소식'이 적절합니다.
- source_word: וַתִּשְׁמַע ... אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  english_pob_choice: that the ark of God had been taken
  chosen_korean: 하나님의 궤가 빼앗겼다는 소식
  alternatives_korean:
  - 하나님의 궤가 잡혀 갔다는 소식
  - 하나님의 궤가 취해졌다는 소식
  lexicon: HALOT
  rationale: הִלָּקַח은 수동적으로 '붙잡히다/빼앗기다'의 뜻이므로, 전승적 표현을 피하고 사건의 강제성을 드러내는 '빼앗겼다'로 옮겼습니다.
- source_word: וַתִּכְרַע
  english_pob_choice: she bowed down
  chosen_korean: 그녀는 몸을 숙여
  alternatives_korean:
  - 그녀는 굽혀
  - 그녀는 무릎을 꿇고
  lexicon: HALOT
  rationale: כרע는 '굽히다/무릎 꿇다'의 넓은 뜻을 가지지만, 산통 속 동작으로는 과도한 해석을 피하면서도 자연스러운 '몸을 숙여'가 적절합니다.
- source_word: צִרֶיהָ
  english_pob_choice: her labor pains
  chosen_korean: 산고
  alternatives_korean:
  - 해산의 고통
  - 진통
  lexicon: HALOT
  rationale: צִירִים는 출산 통증을 가리키므로, 본문 분위기와 문어체를 살려 '산고'로 옮겼습니다.
theological_decisions:
- issue: 하나님의 궤에 대한 서술 방식
  chosen_reading: '''하나님의 궤가 빼앗겼다''로 옮겨, 단순 이동이 아니라 전쟁 포획의 뉘앙스를 드러냈습니다.'
  alternative_readings:
  - '''하나님의 궤가 취해졌다'''
  - '''하나님의 궤가 잡혀 갔다'''
  rationale: 히브리어 הִלָּקַח은 수동형이지만 문맥상 적대적 탈취를 뜻하므로, 한국어에서도 그 긴장을 보존하는 표현이 필요합니다.
  doctrine_reference: 사무엘상 4장의 언약궤 포획 서술
