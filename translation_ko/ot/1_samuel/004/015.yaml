  - 아흔여덟 해였고
  lexicon: HALOT
  rationale: 히브리어의 ‘X의 아들’ 나이를 나타내는 관용구를 현대 한국어의 자연스러운 연령 표현으로 풀었습니다.
- source_word: וְעֵינָיו קָמָה
  english_pob_choice: his eyes were fixed
  chosen_korean: 그의 눈은 굳어져서
  alternatives_korean:
  - 그의 눈은 고정되어서
  - 그의 눈은 뻣뻣해져서
  - 그의 눈은 흐려져서
  lexicon: HALOT
  rationale: קָמָה는 눈이 ‘굳어/굳어져’ 시력 기능이 상실된 상태를 시사하므로, POB의 ‘fixed’에 대응하면서도 한국어에서 상태를 잘 드러내는 표현을 택했습니다.
- source_word: וְלֹא יָכֹל לִרְאוֹת
  english_pob_choice: so that he could not see
  chosen_korean: 볼 수 없었습니다
  alternatives_korean:
  - 보지 못했습니다
  - 볼 수 없게 되었습니다
  lexicon: HALOT
  rationale: 원문의 결과 절을 한국어에서는 자연스러운 불능 표현으로 압축하되, 이전 절의 상태 설명과 연결되는 의미는 유지했습니다.
theological_decisions:
- issue: 눈의 상태에 대한 묘사
  chosen_reading: 단순한 노화 서술이 아니라 시력 상실을 암시하는 상태 묘사로 읽고, 이를 ‘굳어져서 볼 수 없었습니다’로 반영했습니다.
  alternative_readings:
  - 눈이 흐려졌습니다
  - 눈이 정지되었습니다
  rationale: POB 주석이 지적하듯 히브리어는 ‘눈이 굳었다/고정되었다’는 구체적 이미지를 사용하며, 결과적으로 실명 상태를 암시합니다. 이 긴장을 살려 번역했습니다.
  doctrine_reference: 본문 관찰 및 어휘적 의미
