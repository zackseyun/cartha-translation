  lexicon: WLC; POB English narrative transition
  rationale: 문장 첫머리의 와우 연속은 서사 전환 기능을 하므로, 한국어에서는 자연스러운 시간 전환 표현인 ‘그때’로 옮겼습니다.
- source_word: בֶּן תִּשְׁעִים וּ/שְׁמֹנֶה שָׁנָה
  english_pob_choice: was ninety-eight years old
  chosen_korean: 아흔여덟 살이었고
  alternatives_korean:
