source:
  edition: WLC
  text: וַ/יַּעַרְכ֨וּ פְלִשְׁתִּ֜ים לִ/קְרַ֣את יִשְׂרָאֵ֗ל וַ/תִּטֹּשׁ֙ הַ/מִּלְחָמָ֔ה וַ/יִּנָּ֥גֶף יִשְׂרָאֵ֖ל לִ/פְנֵ֣י פְלִשְׁתִּ֑ים וַ/יַּכּ֤וּ בַ/מַּֽעֲרָכָה֙ בַּ/שָּׂדֶ֔ה כְּ/אַרְבַּ֥עַת אֲלָפִ֖ים אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/002.yaml
  text: The Philistines drew up to meet Israel[a], and the battle spread out, and Israel was defeated before the Philistines; and they struck down about four thousand men in the battle line in the field.
  footnotes:
  - marker: a
    text: Or 'the battle was joined.' The Hebrew verb may describe the battle's beginning or its spreading out into engagement.
    reason: lexical_alternative
translation:
  language: ko
  text: 블레셋 사람들이 이스라엘을 맞서 진을 치고, 싸움이 벌어졌으며, 이스라엘은 블레셋 사람들 앞에서 패하고 말았습니다. 그들은 들판의 전열에서 약 사천 명을 쳐 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַרְכוּ פְלִשְׁתִּים לִקְרַאת יִשְׂרָאֵל
  english_pob_choice: The Philistines drew up to meet Israel
  chosen_korean: 블레셋 사람들이 이스라엘을 맞서 진을 치고
  alternatives_korean:
  - 블레셋 사람들이 이스라엘을 향해 전열을 갖추고
  - 블레셋 사람들이 이스라엘을 맞이하도록 진을 정렬하고
  lexicon: HALOT
  rationale: ערך의 군사적 배열 의미를 살려 ‘진을 치고’로 옮겼습니다. לִקְרַאת는 단순한 방향성이 아니라 적대적 대면을 나타내므로 ‘맞서’로 자연스럽게 반영했습니다.
- source_word: וַתִּטֹּשׁ הַמִּלְחָמָה
  english_pob_choice: the battle spread out
  chosen_korean: 싸움이 벌어졌으며
  alternatives_korean:
  - 전투가 퍼져 나갔으며
  - 전투가 전개되었으며
  lexicon: HALOT
  rationale: נטש의 핵심은 전투가 본격적으로 확장·전개되는 그림이므로, 현대 한국어에서 그 흐름을 가장 자연스럽게 드러내는 ‘싸움이 벌어졌으며’를 택했습니다.
- source_word: וַיִּנָּגֶף יִשְׂרָאֵל לִפְנֵי פְלִשְׁתִּים
  english_pob_choice: Israel was defeated before the Philistines
  chosen_korean: 이스라엘은 블레셋 사람들 앞에서 패하고 말았습니다
  alternatives_korean:
  - 이스라엘은 블레셋 사람들 앞에서 패배했습니다
  - 이스라엘은 블레셋 사람들 앞에서 무찔렸습니다
  lexicon: HALOT
  rationale: נָגַף의 수동형은 전투에서 ‘패하다/무찔리다’의 의미를 띠므로, 결과를 분명히 드러내는 ‘패하고 말았습니다’로 옮겼습니다. לִפְנֵי는 전형적인 군사 관용구로 ‘앞에서’를 유지했습니다.
- source_word: בַמַּעֲרָכָה בַּשָּׂדֶה
  english_pob_choice: in the battle line in the field
  chosen_korean: 들판의 전열에서
  alternatives_korean:
  - 들판의 전투진에서
  - 들에서 벌어진 전열 속에서
  lexicon: HALOT
  rationale: מַעֲרָכָה는 전열·전투배치를 뜻하므로 ‘전열’로 옮겼고, בַּשָּׂדֶה는 문자적으로 ‘들/밭’이지만 전투 문맥상 ‘들판’이 자연스럽습니다.
- source_word: כְּאַרְבַּעַת אֲלָפִים אִישׁ
  english_pob_choice: about four thousand men
  chosen_korean: 약 사천 명
  alternatives_korean:
  - 대략 사천 명의 사람
  - 약 사천의 장정
  lexicon: HALOT
  rationale: כְּ의 근사값을 ‘약’으로 반영했고, אִישׁ는 이 문맥에서 전투원 수를 세는 표현이므로 성별을 덧붙이지 않고 수량 중심으로 간결하게 처리했습니다.
theological_decisions:
- issue: 전투 묘사의 직설성
  chosen_reading: ‘패하고 말았습니다’, ‘쳐 죽였습니다’처럼 결과와 폭력을 완곡하게 약화하지 않고 본문의 전투 패배와 살상 사실을 직접 드러냈습니다.
  alternative_readings:
  - ‘실패했습니다’로 완화
  - ‘쓰러뜨렸습니다’로 완화
  rationale: 본문은 युद्ध 결과와 사망자 수를 함께 제시하는 역사 서술이므로, 서술의 강도를 낮추면 מקור의 긴박함과 패배의 충격이 약해집니다.
  doctrine_reference: 사무엘서 역사 서술의 사실성 및 본문 수사 보존
- issue: ‘진을 치고’의 군사적 번역
  chosen_reading: 블레셋 사람들이 이스라엘을 맞서 ‘진을 치고’로 옮겨, 단순 이동이 아니라 전투 준비 상태를 드러냈습니다.
  alternative_readings:
  - ‘대치했고’로 평이하게 처리
  - ‘전열을 갖추고’로 중립화
  rationale: 히브리어 동사는 전투를 위한 배열을 뜻하므로, 한국어에서도 군사적 준비의 함의를 분명히 해야 합니다.
  doctrine_reference: 원문 이미지와 서술적 긴장 보존
