  lexicon: HALOT
  rationale: 수동 의미를 살리되, 전쟁 맥락에서 궤가 적에게 넘어간 상황이므로 ‘빼앗겼고’가 가장 분명합니다.
- source_word: וְאֶל חָמִיהָ וְאִישָׁהּ
  english_pob_choice: and because of her father-in-law and her husband
  chosen_korean: 또 그의 시아버지와 그의 남편 때문에
  alternatives_korean:
  - 또 그녀의 시아버지와 그녀의 남편 때문에
  - 또 그녀의 시아버지와 남편 때문에
  lexicon: HALOT
  rationale: 원문의 인칭 접미사를 반영해 ‘그의’로 옮겼으며, 문맥상 원인 제시 구조를 유지하기 위해 ‘때문에’로 처리했습니다.
theological_decisions:
- issue: ‘כָבוֹד’의 의미 범위
  chosen_reading: ‘영광’으로 옮기되, 그것이 야훼의 임재와 이스라엘의 영예를 함께 떠올리게 하는 압축적 표현으로 남겨 둡니다.
  alternative_readings:
  - 하나님의 영광이 이스라엘에서 떠났습니다
  - 이스라엘의 영예가 떠났습니다
  rationale: 문맥은 궤의 빼앗김과 엘리 집의 비극을 함께 배경으로 하므로, 의미를 하나로 좁히지 않고 원문의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
