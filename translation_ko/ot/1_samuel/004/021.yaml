theological_decisions:
- issue: ‘כָבוֹד’의 의미 범위
  chosen_reading: ‘영광’으로 옮기되, 그것이 야훼의 임재와 이스라엘의 영예를 함께 떠올리게 하는 압축적 표현으로 남겨 둡니다.
  alternative_readings:
  - 하나님의 영광이 이스라엘에서 떠났습니다
  - 이스라엘의 영예가 떠났습니다
  rationale: 문맥은 궤의 빼앗김과 엘리 집의 비극을 함께 배경으로 하므로, 의미를 하나로 좁히지 않고 원문의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
