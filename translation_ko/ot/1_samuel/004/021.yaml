translation:
  language: ko
  text: 그녀는 그 아이의 이름을 이가봇이라 지었습니다[a]. 그녀가 말하기를 “영광이 이스라엘에서 떠났습니다.” 이는 하나님의 궤가 빼앗겼고, 또 그의 시아버지와 그의 남편 때문에 그랬습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이가봇’은 히브리어 요소로 이루어진 이름으로, ‘영광이 없음’ 또는 ‘영광이 어디 있느냐?’와 같은 뜻의 여운을 가질 수 있습니다.
    reason: lexical_alternative
