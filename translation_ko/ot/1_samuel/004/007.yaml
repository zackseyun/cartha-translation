base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/007.yaml
  text: The Philistines were afraid[a], for they said, “God has come into the camp.” And they said, “Woe to us! For nothing like this has happened before.”
  footnotes:
  - marker: a
    text: Or, 'a god has come into the camp'; the Hebrew noun is morphologically plural, but the accompanying verb is singular, supporting the main-text rendering 'God.'
    reason: alternative_reading
translation:
  language: ko
  text: 블레셋 사람들은 “하나님이 진영으로 들어오셨습니다”라고 말하며 두려워했습니다[a]. 그들은 “우리에게 화가 닥쳤습니다! 이런 일은 전에는 없었습니다”라고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 신이 진영으로 들어왔다’; 히브리어 명사는 형태상 복수형이지만, 함께 쓰인 동사가 단수형이므로 본문은 ‘하나님’으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּֽרְאוּ
  english_pob_choice: were afraid
  chosen_korean: 두려워했습니다
  alternatives_korean:
  - 무서워했습니다
  - 겁에 질렸습니다
  lexicon: HALOT
  rationale: 히브리어 ירא의 서술적 반응을 자연스러운 현대 한국어로 옮겼습니다. '두려워했습니다'는 감정의 강도를 유지하면서도 합쇼체 서술에 잘 맞습니다.
- source_word: הַפְּלִשְׁתִּים
  english_pob_choice: the Philistines
  chosen_korean: 블레셋 사람들이
  alternatives_korean:
  - 블레셋 족속이
  - 블레셋인들이
  lexicon: HALOT
  rationale: 표준적인 민족명으로 옮기되, 한국어 문맥에서는 주어 역할이 분명하도록 '사람들이'를 붙였습니다.
- source_word: בָּא אֱלֹהִים
  english_pob_choice: God has come
  chosen_korean: 하나님이 들어오셨다
  alternatives_korean:
  - 하나님이 오셨다
  - 신이 들어오셨다
  - 어떤 신이 들어오셨다
  lexicon: HALOT
  rationale: 동사 בָּא의 이동 의미를 살려 '들어오셨다'로 옮겼습니다. 문맥상 언약궤의 임재를 두려워하는 블레셋의 발화이지만, 동사의 단순한 도착보다 '진영 안으로 들어옴'이 더 분명하게 드러납니다.
- source_word: אֶל הַמַּחֲנֶה
  english_pob_choice: into the camp
  chosen_korean: 진영으로
  alternatives_korean:
  - 진영 안으로
  - 진으로
  lexicon: HALOT
  rationale: אֶל + 장소는 도착·진입의 방향을 나타내므로 한국어에서는 '진영으로'가 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: אֱלֹהִים의 단수/복수 긴장 보존
  chosen_reading: 하나님
  alternative_readings:
  - 신이
  - 여러 신이
  rationale: 히브리어 형태는 복수형이지만 동사 בָּא가 단수이므로 본문은 단수 주어를 강하게 지지합니다. 다만 블레셋 사람들의 이교적 인식이 반영된 발화라는 점은 유지해야 하므로, 본문은 '하나님'으로 두고 대안은 주석으로 남깁니다.
  doctrine_reference: 'Translation philosophy #3 (preserve theological tension rather than resolve it)'
