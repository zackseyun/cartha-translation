- from: 블레셋 사람들이 두려워했습니다[a]. 그들이 말하기를 “하나님이 진영으로 들어오셨다.” 또 그들이 말하기를 “우리에게 화가 있다! 이런 일은 이전에 없었다.”
  to: 블레셋 사람들은 “하나님이 진영으로 들어오셨습니다”라고 말하며 두려워했습니다[a]. 그들은 “우리에게 화가 닥쳤습니다! 이런 일은 전에는 없었습니다”라고 말했습니다.
  rationale: 본문의 단수 ‘하나님’과 진영 안으로의 이동을 유지했습니다. 발화의 내용과 블레셋 사람들이 두려워한 인과 관계를 자연스러운 합쇼체로 재구성했으며, ‘화’를 재앙의 탄식으로 자연스럽게 표현했습니다. 주석은 형태상 복수 명사와 단수 동사의 문법적 긴장을 보존합니다.
