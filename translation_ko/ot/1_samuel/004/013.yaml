  source_fidelity: 수정이 필요합니다. 초안의 ‘도착하자마자’는 וַיָּבֹא(‘그가 오자/왔을 때’)보다 즉각성을 더하며, ‘성읍 안에서 보고하러 들어오자’의 ‘들어오다’는 원문에 명시되지 않았습니다. 또한 ‘보십시오’는 현대 한국어 서사에서 독자에게 직접 말하는 느낌이 강합니다. הִנֵּה의 장면 환기 기능은 ‘보니’로 자연스럽게 살릴 수 있습니다.
  naturalness: ‘하나님의 궤를 두고 그의 마음이 떨렸기 때문에’는 한국어 어순과 지시 관계가 다소 부자연스럽습니다. ‘하나님의 궤 때문에 마음이 떨리고 있었기 때문입니다’가 현대 표준어 합쇼체 서사에 자연스럽습니다. 각주 표지도 해당 표현 바로 뒤에 두어 참조 대상이 분명하게 해야 합니다.
  terminology: ‘하나님의 궤’는 אֲרוֹן הָאֱלֹהִים에 충실하며 유지할 수 있습니다. כִּסֵּא는 ‘의자’보다 넓은 ‘자리’가 더 중립적이고 자연스럽습니다. מְצַפֶּה는 ‘지켜보고 있었습니다’로 유지할 수 있습니다.
