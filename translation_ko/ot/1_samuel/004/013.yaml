id: 1SA.4.13
reference: 1 Samuel 4:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּב֗וֹא וְ/הִנֵּ֣ה עֵ֠לִי יֹשֵׁ֨ב עַֽל הַ/כִּסֵּ֜א יך דֶּ֨רֶךְ֙ מְצַפֶּ֔ה כִּֽי הָיָ֤ה לִבּ/וֹ֙ חָרֵ֔ד עַ֖ל אֲר֣וֹן הָ/אֱלֹהִ֑ים וְ/הָ/אִ֗ישׁ בָּ֚א לְ/הַגִּ֣יד בָּ/עִ֔יר וַ/תִּזְעַ֖ק כָּל הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/013.yaml
  text: When he came[a], behold, Eli was sitting on the seat by the road, watching, because his heart trembled for the ark of God. And the man came to report it in the city[b], and the whole city cried out.
  footnotes:
  - marker: a
    text: 'Hebrew: ''by the hand/side of the road,'' an idiom meaning beside the road or at the roadside.'
    reason: cultural_note
  - marker: b
    text: Or 'because his heart was anxious for the ark of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 도착하자마자, 보십시오, 엘리는 하나님의 궤를 두고 그의 마음이 떨렸기 때문에 길가의 의자에 앉아 지켜보고 있었습니다. 그 사람이 성읍 안에서 보고하러 들어오자, 온 성읍이 부르짖었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 직역은 '길의 손/옆'으로, 관용적으로 '길가' 또는 '길 옆'을 뜻합니다.
    reason: cultural_note
  - marker: b
    text: 또는 '그의 마음이 하나님의 궤를 두고 불안했기 때문에'.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자, 보십시오
  lexicon: HALOT
  rationale: 서술 전환과 장면의 급작스러움을 드러내는 감탄·지시 담화표지로 살리기 위해, 단순한 접속어보다 주의를 환기하는 표현을 택했습니다.
- source_word: יֹשֵׁב עַל הַכִּסֵּא יך דֶּרֶךְ מְצַפֶּה
  english_pob_choice: was sitting on the seat by the road, watching
  chosen_korean: 길가의 의자에 앉아 지켜보고
  alternatives_korean:
  - 길 옆 의자에 앉아 살피고
  - 길가에 앉아 바라보고
  lexicon: HALOT
  rationale: יַד־דֶּרֶךְ의 관용적 뜻인 '길가/길 옆'을 살려 위치를 자연스럽게 옮겼고, מְצַפֶּה는 단순 시선이 아니라 긴장된 대기이므로 '지켜보고'로 옮겼습니다.
- source_word: לִבּוֹ חָרֵד
  english_pob_choice: his heart trembled
  chosen_korean: 그의 마음이 떨렸기 때문에
  alternatives_korean:
  - 그의 마음이 불안했기 때문에
  - 그의 마음이 두려워 떨고 있었기 때문에
  lexicon: HALOT
  rationale: חָרֵד의 구체적·신체적 떨림을 보존하기 위해 '불안하다'로 평탄화하지 않고 '떨리다'를 사용했습니다.
- source_word: לְהַגִּיד
  english_pob_choice: to report it
  chosen_korean: 보고하러
  alternatives_korean:
  - 알리러
  - 전하러
  lexicon: HALOT
  rationale: 전령 문맥에서 לְהַגִּיד는 단순 '말하다'보다 공식적 전달을 뜻하므로, 사건 보고의 기능이 분명한 '보고하러'를 택했습니다.
- source_word: וַתִּזְעַק כָּל הָעִיר
  english_pob_choice: the whole city cried out
  chosen_korean: 온 성읍이 부르짖었습니다
  alternatives_korean:
  - 온 성읍이 외쳤습니다
  - 성읍 전체가 비명을 질렀습니다
  lexicon: HALOT
  rationale: זעק은 단순 발화가 아니라 공포와 동요의 외침이므로, 공동체적 비탄·경보의 뉘앙스를 살려 '부르짖었습니다'로 옮겼습니다.
theological_decisions:
- issue: 아론의 궤/하나님의 궤의 표기
  chosen_reading: 하나님의 궤
  alternative_readings:
  - 야훼의 궤
  - 언약궤
  rationale: 본문의 מקור은 אֲרוֹן הָאֱלֹהִים이며, 이 장면에서는 전승상 익숙한 '언약궤'보다 원문 표지에 충실한 '하나님의 궤'가 직접적입니다.
  doctrine_reference: 출 25장; 삼상 4장 문맥
- issue: 시점의 긴박감 표현
  chosen_reading: 그가 도착하자마자, 보십시오
  alternative_readings:
  - 그가 오자, 보십시오
  - 그가 들어오자
  rationale: 와우연속 서술의 급박한 진행과 장면 전환을 살려, 독자가 사건의 연쇄를 즉시 따라가도록 했습니다.
  doctrine_reference: 히브리어 서사 담화 관습
