base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/003.yaml
  text: When the people came into the camp[a], the elders of Israel said, “Why has Yahweh struck us down today before the Philistines? Let us bring here from Shiloh the ark of the covenant of Yahweh, so that it may come into our midst and save us from the hand of our enemies.”
  footnotes:
  - marker: a
    text: Or, “that he may come into our midst and save us,” taking the singular verbs as referring more directly to the LORD whose presence is associated with the ark.
    reason: alternative_reading
translation:
  language: ko
  text: 사람들이 진으로 들어오자 이스라엘의 장로들이 말했습니다. “어찌하여 야훼께서 오늘 블레셋 사람들 앞에서 우리를 치셨습니까? 우리가 실로에서 야훼의 언약궤를 이리로 가져오게 하여, 그것이 우리 한가운데 들어와 우리 원수들의 손에서 우리를 구원하게 합시다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진으로’는 군사적 집결지를 자연스럽게 드러내기 위한 번역입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 사람들이
  alternatives_korean:
  - 백성이
  - 그 백성이
  lexicon: HALOT
  rationale: 히브리어의 일반 명사 뜻을 살리되, 군사적 문맥을 한국어에서 자연스럽게 드러내기 위해 ‘사람들이’로 옮겼습니다.
- source_word: הַמַּחֲנֶה
  english_pob_choice: the camp
  chosen_korean: 진으로
  alternatives_korean:
  - 진영으로
  - 캠프로
  lexicon: HALOT
  rationale: 군사적 집결지를 자연스럽게 나타내는 표준어로 ‘진’을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 신명은 대체 титула가 아닌 고유명사 ‘야훼’로 옮겼습니다.
- source_word: אֲרוֹן בְּרִית יְהוָה
  english_pob_choice: the ark of the covenant of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 야훼의 언약의 궤
  - 야훼의 계약궤
  lexicon: HALOT
  rationale: ‘언약궤’는 한국어 성서 용례상 가장 직접적으로 대응하면서도 ‘covenant’와 ‘ark’를 함께 보존합니다.
- source_word: בְּקִרְבֵּנוּ
  english_pob_choice: into our midst
  chosen_korean: 우리 한가운데
  alternatives_korean:
  - 우리 가운데
  - 우리 속으로
  lexicon: HALOT
  rationale: 공간적·공동체적 중심성을 살리기 위해 ‘한가운데’를 사용했습니다.
- source_word: מִכַּף אֹיְבֵינוּ
  english_pob_choice: from the hand of our enemies
  chosen_korean: 우리 원수들의 손에서
  alternatives_korean:
  - 우리 원수들의 손아귀에서
  - 우리 원수들의 권세에서
  lexicon: HALOT
  rationale: ‘손’이라는 히브리어 관용구를 유지해 통제·권세의 이미지를 보존했습니다.
theological_decisions:
- issue: 아론의 이동이 야훼의 임재 자체를 뜻하는지 여부
  chosen_reading: 그것이 우리 한가운데 들어와 우리를 구원하게 합시다
  alternative_readings:
  - 그가 우리 한가운데 들어와 우리를 구원하게 합시다
  - 야훼께서 우리 한가운데 들어와 우리를 구원하게 합시다
  rationale: 히브리어는 궤를 문법적 주어로 두지만, 본문은 장로들의 기대와 오해를 함께 드러냅니다. 따라서 대명사 ‘그것’을 유지해 문법과 신학적 긴장을 모두 보존했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
