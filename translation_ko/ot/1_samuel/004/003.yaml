  source_fidelity: ‘사람들이’는 הָעָם의 집합적 의미와 이스라엘 군대를 가리키는 문맥을 충분히 반영하지 못하므로 ‘백성’이 더 정확합니다. 또한 ‘가져오게 하여’는 히브리어의 1인칭 청유형 제안(‘우리가 가져오자’)을 부자연스럽게 사역적으로 만들 수 있어 바로잡았습니다. 단수 동사는 직전 선행사인 ‘언약궤’에 맞추어 중성 지시 표현을 유지하되, 야훼의 임재를 가리키는 해석 가능성은 각주로 보존했습니다.
  naturalness: 현대 표준어 합쇼체로 ‘백성이 진으로 돌아오자’, ‘가져옵시다’ 및 ‘우리 가운데로 들어와’가 자연스럽습니다. 기존의 문체 설명 각주는 독자의 본문 이해에 필요한 본문비평·번역 정보가 아니므로, 실제 대안 해석을 알리는 각주로 교체했습니다.
  terminology: 야훼, 블레셋 사람들, 실로, 언약궤는 일관되고 통용되는 성서 한국어 용어입니다. ‘원수들의 손에서’는 원문의 관용적 이미지를 보존합니다.
