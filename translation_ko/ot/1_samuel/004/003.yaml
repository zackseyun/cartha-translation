- from: 사람들이 진으로 들어오자 이스라엘의 장로들이 말했습니다. “어찌하여 야훼께서 오늘 블레셋 사람들 앞에서 우리를 치셨습니까? 우리가 실로에서 야훼의 언약궤를 이리로 가져오게 하여, 그것이 우리 한가운데 들어와 우리 원수들의 손에서 우리를 구원하게 합시다.”[a]
