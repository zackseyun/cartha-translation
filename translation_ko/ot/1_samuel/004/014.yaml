source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע עֵלִי֙ אֶת ק֣וֹל הַ/צְּעָקָ֔ה וַ/יֹּ֕אמֶר מֶ֛ה ק֥וֹל הֶ/הָמ֖וֹן הַ/זֶּ֑ה וְ/הָ/אִ֣ישׁ מִהַ֔ר וַ/יָּבֹ֖א וַ/יַּגֵּ֥ד לְ/עֵלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/014.yaml
  text: When Eli heard the sound of the outcry[a], he said, “What is this sound of the uproar?” And the man hurried and came and told Eli.
  footnotes:
  - marker: a
    text: Or “the tumult” or “the commotion.”
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리가 그 외침의 소리를 들었을 때, 그는 말했습니다. “이 소란의 소리는 무슨 일입니까?” 그때 그 사람이 급히 와서 엘리에게 알렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소란’은 여기서 군중의 뒤섞인 소음이나 소동을 가리키며, 영어 POB의 ‘uproar’에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹל הַ/צְּעָקָ֔ה
  english_pob_choice: the sound of the outcry
  chosen_korean: 그 외침의 소리
  alternatives_korean:
  - 그 부르짖음의 소리
  - 그 외침
  - 그 울부짖음의 소리
  lexicon: HALOT
  rationale: קול은 단순한 ‘소리’이고 צעקה는 절박한 ‘외침/부르짖음’이므로, 두 요소를 함께 살린 ‘그 외침의 소리’가 자연스럽습니다.
- source_word: ק֥וֹל הֶ/הָמ֖וֹן הַ/זֶּ֑ה
  english_pob_choice: this sound of the uproar
  chosen_korean: 이 소란의 소리
  alternatives_korean:
  - 이 소동의 소리
  - 이 혼란의 소리
  - 이 떠들썩함의 소리
  lexicon: HALOT
  rationale: הָמוֹן은 단순한 ‘소리’보다 사람들로 인한 소란과 뒤섞인 ‘혼잡한 소음’을 가리키므로, POB의 ‘uproar’를 따라 ‘소란’으로 옮겼습니다.
- source_word: וְ/הָ/אִ֣ישׁ מִהַ֔ר
  english_pob_choice: And the man hurried
  chosen_korean: 그때 그 사람이 급히
  alternatives_korean:
  - 그리고 그 사람이 서둘러
  - 그 사람은 급히
  - 그런데 그 사람이 서둘러
  lexicon: HALOT
  rationale: מִהַר은 빠르게 움직이다는 뜻이어서, 서술 흐름을 살려 ‘급히’로 옮겼습니다.
- source_word: וַ/יַּגֵּ֥ד לְ/עֵלִֽי
  english_pob_choice: and told Eli
  chosen_korean: 엘리에게 알렸습니다
  alternatives_korean:
  - 엘리에게 말했습니다
  - 엘리에게 보고했습니다
  - 엘리에게 전했습니다
  lexicon: HALOT
  rationale: נגד의 히필은 사실을 전해 알리다/보고하다의 뜻이지만, 내러티브에서는 ‘알렸습니다’가 가장 자연스럽고 과도한 해석을 피합니다.
