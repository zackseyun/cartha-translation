  edition: WLC
  text: וַ/יִּלָּחֲמ֣וּ פְלִשְׁתִּ֗ים וַ/יִּנָּ֤גֶף יִשְׂרָאֵל֙ וַ/יָּנֻ֨סוּ֙ אִ֣ישׁ לְ/אֹהָלָ֔י/ו וַ/תְּהִ֥י הַ/מַּכָּ֖ה גְּדוֹלָ֣ה מְאֹ֑ד וַ/יִּפֹּל֙ מִ/יִּשְׂרָאֵ֔ל שְׁלֹשִׁ֥ים אֶ֖לֶף רַגְלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/010.yaml
  text: So the Philistines fought[a], and Israel was defeated, and each man fled to his tent. The slaughter was very great[b], and thirty thousand foot soldiers from Israel fell.
  footnotes:
  - marker: a
    text: Or 'each man fled to his home.' The Hebrew literally says 'to his tent,' an expression that can function idiomatically for one's dwelling place.
    reason: lexical_alternative
  - marker: b
    text: Or 'the defeat was very severe.' The Hebrew says 'the blow/slaughter was very great.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 블레셋 사람들이 싸웠고, 이스라엘은 패주하였으며, 각 사람은 자기 장막으로 도망쳤습니다. 살육이 매우 컸고, 이스라엘에서 보병 삼만 명이 쓰러졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ פְלִשְׁתִּים
  english_pob_choice: the Philistines fought
  chosen_korean: 블레셋 사람들이 싸웠고
  alternatives_korean:
  - 블레셋 사람들이 전투를 벌였고
  - 블레셋이 공격했고
  lexicon: HALOT
  rationale: 전쟁 서술의 기본 의미를 자연스럽게 살리되, 주체가 민족 집단임을 분명히 했습니다.
- source_word: וַיִּנָּגֶף יִשְׂרָאֵל
  english_pob_choice: Israel was defeated
  chosen_korean: 이스라엘은 패주하였으며
  alternatives_korean:
  - 이스라엘은 패배하였으며
  - 이스라엘은 쳐부서졌으며
  lexicon: HALOT
  rationale: נָגַף는 단순 패배보다 전투에서 밀려 무너지는 결과를 가리키므로, 전투 문맥의 강도를 살려 옮겼습니다.
- source_word: וַיָּנֻסוּ אִישׁ לְאֹהָלָיו
  english_pob_choice: each man fled to his tent
  chosen_korean: 각 사람은 자기 장막으로 도망쳤습니다
  alternatives_korean:
  - 각 사람은 자기 집으로 도망쳤습니다
  - 모든 사람은 자기 장막으로 도망쳤습니다
  lexicon: HALOT
  rationale: אֹהֶל의 문자적 의미인 ‘장막’을 유지해 군영 맥락과 히브리어의 구체성을 보존했습니다.
- source_word: וַתְּהִי הַמַּכָּה גְּדוֹלָה מְאֹד
  english_pob_choice: The slaughter was very great
  chosen_korean: 살육이 매우 컸고
  alternatives_korean:
  - 타격이 매우 컸고
  - 패전이 매우 심했고
  lexicon: HALOT
  rationale: מַכָּה를 전투 맥락의 치명적 타격으로 이해하여, POB의 ‘slaughter’에 대응하는 강한 표현을 사용했습니다.
- source_word: רַגְלִי
  english_pob_choice: foot soldiers
  chosen_korean: 보병
  alternatives_korean:
  - 걸어 다니는 병사들
  - 도보 병사들
  lexicon: HALOT
  rationale: ‘발로 걷는 자들’의 대조적 의미를 현대 한국어 군사용어인 ‘보병’으로 간결하게 살렸습니다.
