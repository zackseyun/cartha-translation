base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/005.yaml
  text: When the ark of the covenant of Yahweh came into the camp[a], all Israel shouted with a great shout, and the earth resounded.
  footnotes:
  - marker: a
    text: Or, 'and the earth shook.' The Hebrew verb can denote tumult or trembling; 'resounded' was chosen to avoid implying a definite earthquake where the text may simply describe the force of the shout.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 언약궤가 진영 안으로 들어오자, 온 이스라엘이 큰 함성을 질렀고, 땅이 울렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅이 흔들렸습니다’. 히브리어 동사는 소란이나 떨림을 모두 나타낼 수 있으므로, 여기서는 지진을 단정하지 않기 위해 ‘울렸습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן בְּרִית יְהוָה
  english_pob_choice: the ark of the covenant of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 야훼의 계약궤
  - 야훼의 증거궤
  lexicon: HALOT
  rationale: 문맥상 ‘아론’이 아니라 언약궤를 가리키며, בְּרִית는 관용적으로 ‘언약’이 가장 직접적입니다. ‘궤’는 전통적이지만 원문의 물건 명칭을 분명히 드러냅니다.
- source_word: הַמַּחֲנֶה
  english_pob_choice: the camp
  chosen_korean: 진영
  alternatives_korean:
  - 진 camp
  - 군막
  - 캠프
  lexicon: HALOT
  rationale: 군사적 서사 문맥에서 ‘진영’이 한국어로 자연스럽고, 전투 상황의 집단 배치를 잘 드러냅니다.
- source_word: וַיָּרִיעוּ כָל יִשְׂרָאֵל תְּרוּעָה גְדוֹלָה
  english_pob_choice: all Israel shouted with a great shout
  chosen_korean: 온 이스라엘이 큰 함성을 질렀고
  alternatives_korean:
  - 온 이스라엘이 큰 소리를 질렀고
  - 온 이스라엘이 크게 외쳤고
  - 온 이스라엘이 전쟁 함성을 질렀고
  lexicon: HALOT
  rationale: תְּרוּעָה는 단순한 외침보다 집단적이고 강한 ‘함성’에 가깝습니다. ‘큰 함성’은 원문의 강조를 살리면서도 과도하게 군사적 의미를 고정하지 않습니다.
- source_word: וַתֵּהֹם הָאָרֶץ
  english_pob_choice: the earth resounded
  chosen_korean: 땅이 울려 퍼졌습니다
  alternatives_korean:
  - 땅이 흔들렸습니다
  - 땅이 요동쳤습니다
  - 땅이 소란해졌습니다
  lexicon: HALOT
  rationale: 본문은 지진을 단정하기보다 큰 소리로 인한 진동/요동의 효과를 넓게 가리킬 수 있으므로, ‘울려 퍼지다’로 음향적·현상적 울림을 살렸습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
