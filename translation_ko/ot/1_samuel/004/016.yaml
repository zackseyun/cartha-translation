id: 1SA.4.16
reference: 1 Samuel 4:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/אִ֜ישׁ אֶל עֵלִ֗י אָֽנֹכִי֙ הַ/בָּ֣א מִן הַ/מַּעֲרָכָ֔ה וַ/אֲנִ֕י מִן הַ/מַּעֲרָכָ֖ה נַ֣סְתִּי הַ/יּ֑וֹם וַ/יֹּ֛אמֶר מֶֽה הָיָ֥ה הַ/דָּבָ֖ר בְּנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/016.yaml
  text: The man said to Eli[a], “I am the one who came from the battle line, and I fled from the battle line today.” And he said, “What happened, my son?”
  footnotes:
  - marker: a
    text: Or “from the battle,” “from the ranks,” or “from the camp”; the Hebrew term refers to a military array or battle formation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람이 엘리에게 말했습니다. “저는 전열에서 온 사람입니다. 오늘 전열에서 도망쳐 왔습니다.” 그러자 그가 말했습니다. “무슨 일이 있었느냐, 내 아들아?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전열’은 히브리어 מַעֲרָכָה의 군사적 배열/진형 뉘앙스를 살린 번역입니다. 문맥상 ‘전투’, ‘진열’, ‘진형’도 가능하지만, POB는 특정 전선보다 배열 자체를 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  english_pob_choice: The man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 그 사람은
  lexicon: HALOT
  rationale: 히브리어는 특수한 ‘사자’가 아니라 일반명사 ‘사람/남자’를 쓰므로, 맥락을 과잉 해석하지 않고 자연스럽게 ‘그 사람’으로 옮겼습니다.
- source_word: הַבָּא מִן הַמַּעֲרָכָה
  english_pob_choice: the one who came from the battle line
  chosen_korean: 전열에서 온 사람
  alternatives_korean:
  - 전투 진형에서 온 사람
  - 전선에서 온 사람
  - 진열에서 온 사람
  lexicon: HALOT
  rationale: מַעֲרָכָה는 단순한 ‘전쟁’보다 군사적 배열/진형을 가리키므로, POB의 ‘battle line’을 따라 ‘전열’로 옮겨 군사적 배열의 뉘앙스를 살렸습니다.
- source_word: נַסְתִּי
  english_pob_choice: I fled
  chosen_korean: 도망쳐 왔습니다
  alternatives_korean:
  - 도망했습니다
  - 달아났습니다
  - 도망했습니다
  lexicon: HALOT
  rationale: 동사는 기본적으로 ‘달아나다/도망하다’의 의미이므로, 도착 결과까지 드러나는 문맥에 맞게 ‘도망쳐 왔습니다’로 자연스럽게 표현했습니다.
- source_word: מֶה הָיָה הַדָּבָר
  english_pob_choice: What happened
  chosen_korean: 무슨 일이 있었느냐
  alternatives_korean:
  - 무슨 일이냐
  - 어찌 된 일이냐
  - 무슨 일이 벌어졌느냐
  lexicon: HALOT
  rationale: 직역하면 ‘그 일이 무엇이었느냐’에 가깝지만, 엘리가 전황 보고를 묻는 문맥이므로 한국어에서는 사건 보고의 관용적 표현인 ‘무슨 일이 있었느냐’가 가장 정확합니다.
- source_word: בְּנִי
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아들
  - 아들아
  lexicon: HALOT
  rationale: 소유격이 분명하므로 ‘내’를 살렸고, 히브리어의 친근한 호칭을 한국어 자연어로 옮기기 위해 종결형 호격 ‘-아’를 사용했습니다.
