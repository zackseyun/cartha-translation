reference: 1 Samuel 4:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨עַן הַֽ/מְבַשֵּׂ֜ר וַ/יֹּ֗אמֶר נָ֤ס יִשְׂרָאֵל֙ לִ/פְנֵ֣י פְלִשְׁתִּ֔ים וְ/גַ֛ם מַגֵּפָ֥ה גְדוֹלָ֖ה הָיְתָ֣ה בָ/עָ֑ם וְ/גַם שְׁנֵ֨י בָנֶ֜י/ךָ מֵ֗תוּ חָפְנִי֙ וּ/פִ֣ינְחָ֔ס וַ/אֲר֥וֹן הָ/אֱלֹהִ֖ים נִלְקָֽחָה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/017.yaml
  text: The messenger answered and said[a], “Israel has fled before the Philistines, and there has also been a great slaughter among the people; and your two sons also are dead, Hophni and Phinehas[b]; and the ark of God has been taken.”
  footnotes:
  - marker: a
    text: Or, “there has been a great defeat among the people.” The Hebrew term can denote a severe blow, plague, or slaughter; here the battle context favors “slaughter.”
    reason: lexical_alternative
  - marker: b
    text: Or, “the ark of God was captured.”
    reason: lexical_alternative
translation:
  language: ko
  text: 전령이 대답하여 말했습니다. 「이스라엘이 블레셋 사람들 앞에서 도망했고, 백성 가운데 큰 살육도 있었습니다.[a] 당신의 두 아들인 홉니와 비느하스도 죽었고, 하나님의 궤는 빼앗겼습니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “백성 가운데 큰 패배가 있었습니다.” 히브리어는 심한 타격, 전염병, 살육을 모두 가리킬 수 있으며, 여기서는 전투 문맥상 “살육”이 적절합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “하나님의 궤는 사로잡혔습니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְבַשֵּׂר
  english_pob_choice: the messenger
  chosen_korean: 전령
  alternatives_korean:
  - 사자
  - 소식을 전하는 사람
  lexicon: HALOT
  rationale: 소식을 전하는 자를 가리키는 분사형이므로, 문맥에 맞는 현대적이고 간결한 명사인 ‘전령’으로 옮겼습니다.
- source_word: נָס יִשְׂרָאֵל לִפְנֵי פְלִשְׁתִּים
  english_pob_choice: Israel has fled before the Philistines
  chosen_korean: 이스라엘이 블레셋 사람들 앞에서 도망했고
  alternatives_korean:
  - 이스라엘이 블레셋 사람들 앞에서 패주했고
  - 이스라엘이 블레셋 사람들 앞에서 달아났고
  lexicon: HALOT
  rationale: נָס의 기본 뜻은 ‘도망하다’이므로, 전투 패배를 해석해 넣기보다 행위 자체를 드러내는 표현을 택했습니다.
- source_word: מַגֵּפָה גְדוֹלָה
  english_pob_choice: a great slaughter
  chosen_korean: 큰 살육
  alternatives_korean:
  - 큰 재앙
  - 큰 타격
  - 큰 패배
  lexicon: HALOT
  rationale: 전투 문맥에서 מַגֵּפָה는 질병보다 치명적 유린이나 살육의 의미가 강하므로, POB의 선택을 따라 ‘살육’으로 옮겼습니다.
- source_word: נִלְקָחָה
  english_pob_choice: has been taken
  chosen_korean: 빼앗겼습니다
  alternatives_korean:
  - 가져가졌습니다
  - 포로로 잡혔습니다
  - 붙들렸습니다
  lexicon: HALOT
  rationale: אָרוֹן이 적에게 넘어간 결과를 가장 자연스럽고 직접적으로 드러내는 한국어로, 단순한 ‘옮겨짐’보다 상실과 침탈의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 하나님의 궤의 운명 표현
  chosen_reading: ‘하나님의 궤도 빼앗겼습니다’로 옮겨, 단순 이동이 아니라 전쟁의 결과로서의 상실을 드러냈습니다.
  alternative_readings:
  - ‘하나님의 궤는 빼앗겼습니다’
  - ‘하나님의 궤가 취해졌습니다’
  rationale: 본문의 마지막 절정은 언약 궤가 적의 손에 넘어갔다는 비극이므로, 중립적 이동보다 침탈·상실의 의미를 명확히 해야 합니다.
  doctrine_reference: 사무엘상 4장 언약궤 서술
- issue: 직접화법의 보고체
  chosen_reading: 전령의 보고문을 따옴표 안에서 간결한 평서형으로 유지했습니다.
  alternative_readings:
  - 간접화법으로 풀어 쓰기
  - 더 격식 있는 인용식으로 재구성
  rationale: 원문은 전령의 즉각적 보고를 생생하게 제시하므로, 서술의 긴박감을 살리기 위해 직접화법을 유지했습니다.
  doctrine_reference: 서사 문체 보존 원칙
