  text: And the ark of God was captured, and the two sons of Eli died, Hophni and Phinehas.
translation:
  language: ko
  text: 하나님의 궤가 사로잡혔으며, 엘리의 두 아들 홉니와 비느하스가 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרוֹן אֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 궤
  alternatives_korean:
  - 하나님께 속한 궤
  - 하나님의 법궤
  lexicon: HALOT
  rationale: 소유 관계를 자연스럽게 드러내면서도, 전통적인 교회어인 ‘법궤’로 좁혀 들어가지 않고 히브리어의 פשוט한 구성형을 반영합니다.
- source_word: נִלְקָח
  english_pob_choice: was captured
  chosen_korean: 사로잡혔고
  alternatives_korean:
  - 잡혔고
  - 빼앗겼고
  lexicon: HALOT
  rationale: 전투 맥락에서 단순 수동 ‘잡히다’보다 적에게 넘어간 함의를 살려 ‘사로잡히다’가 원문의 사건성을 더 분명히 드러냅니다.
- source_word: וּשְׁנֵי בְנֵי עֵלִי
  english_pob_choice: and the two sons of Eli
  chosen_korean: 엘리의 두 아들
  alternatives_korean:
  - 엘리의 두 아들들
  - 두 아들 엘리의
  lexicon: HALOT
  rationale: 히브리어의 정황상 특정된 두 아들을 가리키므로 ‘두 아들’로 옮겨 수량과 소유 관계를 간결하게 유지했습니다.
- source_word: חָפְנִי וּפִינְחָס
  english_pob_choice: Hophni and Phinehas
  chosen_korean: 홉니와 비느하스
  alternatives_korean:
  - 호브니와 피느하스
  - 홉니와 피넬하스
  lexicon: standard transliteration / established biblical forms
  rationale: 성경에서 널리 쓰이는 한국어 음역을 따랐고, 현대 외래어 표기보다 고유한 성서 인명을 우선했습니다.
theological_decisions:
- issue: 언약궤의 패배가 단순 물건의 분실이 아니라 야훼의 임재 상징에 대한 중대한 패배로 읽힐 수 있음
  chosen_reading: ‘하나님의 궤’로 직역에 가깝게 두어 사건의 충격을 유지하고, 전통적 완화 표현으로 바꾸지 않았습니다.
  alternative_readings:
  - ‘법궤가 빼앗겼습니다’
  - ‘하나님의 궤가 빼앗겼습니다’
  rationale: 본문은 전쟁 결과를 보고하는 짧은 서술이므로 과도한 해설을 덧붙이지 않되, ‘사로잡혔’라는 표현으로 패전의 의미를 보존합니다.
  doctrine_reference: 언약궤/하나님의 임재 상징
- issue: 엘리의 두 아들의 죽음이 궤의 패배와 병렬로 제시됨
  chosen_reading: 두 사건을 동일 절 안에서 병렬로 유지해, 제사의 실패와 지도자 집안의 심판이 함께 왔음을 드러냈습니다.
  alternative_readings:
  - 문장을 나눠 서술
  - 후반부를 부연 설명
  rationale: 히브리어의 병렬 구조를 살려 서술의 압축성과 비극성을 유지하는 것이 본문의 효과에 부합합니다.
  doctrine_reference: 심판의 병행 서술
