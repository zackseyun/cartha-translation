base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/020.yaml
  text: And about the time of her death[a], the women standing by her said, “Do not fear, for you have borne a son.” But she did not answer, nor did she take it to heart.
  footnotes:
  - marker: a
    text: Or “she did not set her heart on it,” that is, she paid no attention to what they said.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 죽을 때쯤에, 곁에 서 있던 여자들이 말했습니다. 「두려워하지 마십시오. 당신은 아들을 낳았습니다.」 그러나 그녀는 대답하지 않았고, 마음에도 두지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그녀는 그것에 마음을 두지 않았습니다.” 곧, 그들이 한 말에 주의를 기울이지 않았다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעֵת מוּתָהּ
  english_pob_choice: about the time of her death
  chosen_korean: 그녀가 죽을 때쯤에
  alternatives_korean:
  - 그녀의 죽음 무렵에
  - 그녀가 죽어 갈 때에
  lexicon: HALOT
  rationale: 시간을 나타내는 결합형 표현을 자연스러운 현대 한국어로 옮기되, 사건의 시점이 죽음과 겹친다는 의미를 보존했습니다.
- source_word: הַנִּצָּבוֹת עָלֶיהָ
  english_pob_choice: the women standing by her
  chosen_korean: 곁에 서 있던 여자들이
  alternatives_korean:
  - 그녀를 돌보던 여자들이
  - 그녀 곁에 서 있던 여자들이
  lexicon: HALOT
  rationale: נצב의 ‘서다’와 על의 근접/부착 관계를 반영해, 산파나 곁에 있던 여인들의 모습을 한국어로 간결하게 살렸습니다.
- source_word: כִּי בֵן יָלָדְתְּ
  english_pob_choice: for you have borne a son
  chosen_korean: 당신은 아들을 낳았습니다
  alternatives_korean:
  - 당신은 아들을 출산하셨습니다
  - 당신에게 아들이 태어났습니다
  lexicon: HALOT
  rationale: ילד의 기본 의미를 직접적으로 살려 출산 사실을 알리는 문장으로 옮겼습니다. '낳았습니다'가 본문의 위로와 선언성을 가장 분명하게 전달합니다.
- source_word: וְלֹא שָׁתָה לִבָּהּ
  english_pob_choice: she did not take it to heart
  chosen_korean: 마음에도 두지 않았습니다
  alternatives_korean:
  - 마음에 새기지 않았습니다
  - 마음에 두지 않았습니다
  - 유념하지 않았습니다
  lexicon: HALOT
  rationale: ‘마음을 두다/두지 않다’는 히브리어 관용구 שׁית לב의 의미를 자연스럽게 옮기면서, 그녀가 그 말을 받아들이지 않았다는 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 직접화법의 공손한 명령형과 서술체의 균형
  chosen_reading: 위로의 말은 공손한 금지형("두려워하지 마십시오")으로, 서술은 합쇼체로 유지했습니다.
  alternative_readings:
  - '"두려워하지 말아요"'
  - '"두려워하지 마라"'
  rationale: 본문은 산파/여인들의 위로를 전달하는 장면이므로, 현대 표준어의 정중한 직접화법이 장면의 정서를 잘 살립니다.
  doctrine_reference: 문체·화행 선택
