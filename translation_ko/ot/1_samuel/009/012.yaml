source:
  edition: WLC
  text: וַ/תַּעֲנֶ֧ינָה אוֹתָ֛/ם וַ/תֹּאמַ֥רְנָה יֵּ֖שׁ הִנֵּ֣ה לְ/פָנֶ֑י/ךָ מַהֵ֣ר עַתָּ֗ה כִּ֤י הַ/יּוֹם֙ בָּ֣א לָ/עִ֔יר כִּ֣י זֶ֧בַח הַ/יּ֛וֹם לָ/עָ֖ם בַּ/בָּמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/012.yaml
  text: They answered them and said[a], “Yes, look—he is just ahead of you. Hurry now, because he came to the city today[b], because today there is a sacrifice for the people at the high place.”
  footnotes:
  - marker: a
    text: Or, 'There he is before you'; the Hebrew uses an affirmative particle plus a deictic expression.
    reason: lexical_alternative
  - marker: b
    text: '''High place'' refers to an elevated local worship site.'
    reason: cultural_note
translation:
  language: ko
  text: 그 소녀들이 그들에게 대답하여 말했습니다. “예, 보십시오. 그가 바로 앞에 있습니다. 이제 서두르십시오. 그가 오늘 성읍에 왔고, 오늘 산당[a]에서 백성을 위한 제사가 있기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘산당’은 높은 곳에 마련된 지역 제의 장소를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעֲנֶינָה / וַתֹּאמַרְנָה
  english_pob_choice: They answered them and said
  chosen_korean: 그들이 그들에게 대답하며 말했습니다
  alternatives_korean:
  - 그들이 그들에게 대답하고 말했습니다
  - 그들이 그들에게 답하여 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 전형적인 서술 결합을 한국어에서도 자연스럽게 살리되, 답변 동작과 발화 동작을 함께 드러내는 ‘대답하며 말했습니다’를 택했습니다.
- source_word: יֵשׁ / הִנֵּה
  english_pob_choice: Yes, look
  chosen_korean: 예, 보십시오
  alternatives_korean:
  - 있습니다, 보십시오
  - 네, 보십시오
  lexicon: HALOT
  rationale: יֵשׁ의 긍정 응답 기능을 ‘예’로, הִנֵּה의 지시·주의 환기 기능을 ‘보십시오’로 옮겨 현대 한국어에서도 즉시성이 살아나게 했습니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: just ahead of you
  chosen_korean: 당신들 앞에
  alternatives_korean:
  - 바로 앞에
  - 앞에
  lexicon: HALOT
  rationale: 문맥상 공간적 방향을 가리키는 표현이므로 ‘앞에’로 옮겼고, 영어 POB의 ‘just’는 원문에 없는 해석적 강조이므로 본문에는 넣지 않았습니다.
- source_word: מַהֵר עַתָּה
  english_pob_choice: Hurry now
  chosen_korean: 이제 서두르십시오
  alternatives_korean:
  - 지금 서두르십시오
  - 서둘러 가십시오
  lexicon: HALOT
  rationale: 즉각성을 살리는 명령형을 존중해 ‘서두르십시오’로 옮겼고, עַתָּה는 부사적 긴급성을 ‘이제’로 자연스럽게 반영했습니다.
- source_word: זֶבַח הַיּוֹם לָעָם בַּבָּמָה
  english_pob_choice: today there is a sacrifice for the people at the high place
  chosen_korean: 오늘 백성을 위한 제사가 산당에 있기 때문입니다
  alternatives_korean:
  - 오늘 백성을 위한 제사가 높은 곳에 있기 때문입니다
  - 오늘 백성을 위해 산당에서 제사가 있기 때문입니다
  lexicon: HALOT
  rationale: זֶבַח은 단순한 ‘제사’로, בָּמָה는 고유한 제의 장소를 가리키는 ‘산당’으로 옮겨 원문의 문화·종교적 표지를 보존했습니다.
theological_decisions:
- issue: בָּמָה의 번역과 제의적 뉘앙스
  chosen_reading: 산당
  alternative_readings:
  - 높은 곳
  - 산당(주석 없이 일반화)
  rationale: 전승적으로 익숙한 ‘산당’은 단순 지리정보가 아니라 초기 이스라엘의 지역 제의 장소라는 역사·신학적 긴장을 드러내므로, 이를 평준화하지 않고 유지했습니다.
  doctrine_reference: 구약 제의사 및 이스라엘 초기 예배 장소에 대한 역사적 맥락
