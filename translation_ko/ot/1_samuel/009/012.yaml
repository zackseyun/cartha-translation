  source_fidelity: 대체로 원문을 충실히 따르지만, לְפָנֶיךָ는 남성 단수 대상을 가리키는데 초안의 ‘당신들’은 복수로 바뀌었습니다. 또한 בוא לָעִיר는 도착을 나타내므로 ‘성읍에 왔습니다’가 더 적절합니다.
  naturalness: ‘그들이 그들에게 대답하며 말했습니다’는 현대 한국어 서술에서 다소 부자연스럽습니다. ‘그 소녀들이 그들에게 대답하여 말했습니다’가 원문의 여성 복수 주어와 대화 관용구를 자연스럽게 반영합니다. 연속된 ‘때문입니다’도 한 문장 안에서 정리하는 편이 자연스럽습니다.
