base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/003.yaml
  text: Now the donkeys belonging to Kish[a], Saul’s father, were lost. So Kish said to Saul his son, “Please take with you one of the young men, and get up, go[b], seek the donkeys.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''she-donkeys.'' The broader English ''donkeys'' is used because the animals’ sex is not emphasized in this context.'
    reason: lexical_alternative
  - marker: b
    text: Or 'one of the servants' / 'one of the attendants' for 'one of the young men.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울의 아버지 키스의 나귀들[a]이 없어졌습니다. 그래서 키스가 자기 아들 사울에게 말했습니다. 「부디 젊은이들 가운데 한 사람을 데리고 일어나 나귀들을 찾으러 가십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 원문은 ‘암나귀들’입니다. 다만 여기서는 동물의 성별이 강조되지 않으므로 본문에서는 넓은 의미의 ‘나귀들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאבַדְנָה הָאֲתֹנוֹת
  english_pob_choice: were lost / the donkeys
  chosen_korean: 나귀들이 길을 잃었습니다
  alternatives_korean:
  - 나귀들이 없어졌습니다
  - 나귀들이 잃어버려졌습니다
  lexicon: WLC / HALOT
  rationale: אבד의 수동적 의미를 자연스럽게 살려, 단순한 분실 상태를 뜻하는 한국어로 옮겼습니다. '길을 잃었습니다'가 문맥상 가장 자연스럽고, 죽음이나 소멸을 암시하지 않습니다.
- source_word: לְקִישׁ אֲבִי שָׁאוּל
  english_pob_choice: belonging to Kish, Saul’s father
  chosen_korean: 키스의 아들 사울의 아버지 키스의
  alternatives_korean:
  - 사울의 아버지 키스의
  - 사울의 아버지인 키스의
  lexicon: WLC / HALOT
  rationale: 소유·관계 구조를 한국어에서 가장 분명하게 전달하기 위해 '키스의 나귀들'과 '그의 아들 사울'을 분리해 표현했습니다.
- source_word: קַח נָא אִתְּךָ ... וְקוּם לֵךְ
  english_pob_choice: Please take with you ... and get up, go
  chosen_korean: 부디 ... 데리고 가서 일어나 가서
  alternatives_korean:
  - 제발 ... 데리고 가서 일어나 가서
  - 부디 ... 데리고 가서 일어나십시오, 가십시오
  lexicon: WLC / HALOT
  rationale: נָא의 완곡함은 '부디'로, 두 개의 명령형은 '일어나 가서'로 살려 급박한 연속 동작을 유지했습니다.
- source_word: אַחַד מֵהַנְּעָרִים
  english_pob_choice: one of the young men
  chosen_korean: 젊은이들 가운데 한 사람
  alternatives_korean:
  - 수행원들 가운데 한 사람
  - 종들 가운데 한 사람
  lexicon: WLC / HALOT
  rationale: נְעָרִים는 문맥상 함께 다니는 젊은 남자들을 가리키므로, 사회적 역할을 과도하게 특정하지 않는 '젊은이들 가운데 한 사람'을 택했습니다.
- source_word: בַּקֵּשׁ אֶת הָאֲתֹנֹת
  english_pob_choice: seek the donkeys
  chosen_korean: 나귀들을 찾으십시오
  alternatives_korean:
  - 나귀들을 찾으십시오
  - 나귀들을 구하십시오
  lexicon: WLC / HALOT
  rationale: בקש의 의미를 한국어에서 가장 직관적으로 전달하는 '찾다'를 사용해, 목적어를 다시 분명히 했습니다.
