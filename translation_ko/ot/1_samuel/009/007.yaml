  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל לְ/נַעֲר֗/וֹ וְ/הִנֵּ֣ה נֵלֵךְ֮ וּ/מַה נָּבִ֣יא לָ/אִישׁ֒ כִּ֤י הַ/לֶּ֨חֶם֙ אָזַ֣ל מִ/כֵּלֵ֔י/נוּ וּ/תְשׁוּרָ֥ה אֵין לְ/הָבִ֖יא לְ/אִ֣ישׁ הָ/אֱלֹהִ֑ים מָ֖ה אִתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/007.yaml
  text: Then Saul said to his young man[a], “But look, if we go, what will we bring to the man? For the bread is gone from our bags, and there is no gift to bring to the man of God[b]. What do we have?”
  footnotes:
  - marker: a
    text: Or 'the bread is spent from our vessels/containers.' The Hebrew uses 'bread' concretely and 'vessels' for the containers holding their provisions.
    reason: lexical_alternative
  - marker: b
    text: Or 'present' for 'gift.' The Hebrew term refers to something brought to a respected person.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 그의 젊은이에게 말했습니다. 「하지만 보시오, 우리가 가면 그 사람에게 무엇을 가져가겠습니까? 떡은 우리 자루에서 다 떨어졌고, 하나님의 사람에게 가져갈 예물도 없습니다. 우리에게 무엇이 있습니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘떡’은 여기서 구체적인 식량을 가리키며, 히브리어는 ‘빵’을 직접 말합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘예물’은 존경하는 사람에게 가져가는 것을 가리키는 말이며, 제의적 ‘헌물’로 한정하지 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  english_pob_choice: young man
  chosen_korean: 젊은이
  alternatives_korean:
  - 시종
  - 소년
  - 종
  lexicon: HALOT
  rationale: 사울의 수행원을 가리키는 말로서 연령·지위의 뉘앙스를 함께 살리기 위해 ‘젊은이’를 택했습니다. ‘종’은 신분을 과도하게 고정할 수 있습니다.
- source_word: וְהִנֵּה
  english_pob_choice: But look
  chosen_korean: 하지만 보시오
  alternatives_korean:
  - 보십시오
  - 보라
  - 이제
  lexicon: HALOT
  rationale: 장면 전환과 약한 반박의 힘을 함께 담기 위해 ‘하지만’과 주의를 끄는 표현을 결합했습니다. 대화체이지만 서술 문체에 맞게 합쇼체를 유지했습니다.
- source_word: לֶחֶם
  english_pob_choice: bread
  chosen_korean: 떡
  alternatives_korean:
  - 빵
  - 양식
  - 먹을 것
  lexicon: HALOT
  rationale: 히브리어의 구체적 ‘빵/떡’을 살리되, 한국어 성서 문맥에서 자연스럽고 물질적인 식량 항목으로 읽히는 ‘떡’을 선택했습니다.
- source_word: כְּלִי
  english_pob_choice: bags
  chosen_korean: 자루
  alternatives_korean:
  - 주머니
  - 그릇
  - 용기
  lexicon: HALOT
  rationale: 여행 중 양식을 넣어 다니는 담는 물건을 가리키므로, 현대어에서 가장 자연스럽게 보이는 ‘자루’로 옮겼습니다. ‘그릇/용기’는 문맥상 지나치게 일반적입니다.
- source_word: תְּשׁוּרָה
  english_pob_choice: gift
  chosen_korean: 예물
  alternatives_korean:
  - 선물
  - 헌물
  - 증정품
  lexicon: HALOT
  rationale: 이 단어는 존경하는 사람에게 가져가는 예물을 뜻하므로, 단순한 ‘선물’보다 예를 갖춘 ‘예물’이 문맥을 더 잘 드러냅니다. 다만 제의적 ‘헌물’로는 좁히지 않았습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 선지자
  - 하나님의 사람
  lexicon: HALOT
  rationale: 정해진 히브리어 칭호를 직역해, 사무엘을 가리키는 호칭적 의미를 보존했습니다. ‘선지자’는 의미는 맞지만 원문 표현을 대체합니다.
theological_decisions:
- issue: 사울의 질문형 발화의 뉘앙스
  chosen_reading: 공손한 반문과 현실적 난처함을 함께 드러내는 말투로 옮겼습니다.
  alternative_readings:
  - 직설적인 명령형으로 더 강하게
  - 더 중립적인 평서문으로 완화
  rationale: 원문은 단순 정보 전달이 아니라 현실적 난관을 상기시키는 반문이므로, 한국어에서도 질문형과 감탄적 주의를 유지하는 편이 의미를 더 잘 보존합니다.
  doctrine_reference: 서사 본문에서 화자의 태도와 담화 기능을 보존하는 원칙
- issue: ‘하나님의 사람’ 호칭 보존
  chosen_reading: 사무엘에 대한 칭호를 ‘하나님의 사람’으로 유지했습니다.
  alternative_readings:
  - 하나님의 선지자
  - 하나님 사람
  rationale: 이 표현은 단순한 직업명보다 소명과 권위를 나타내는 정식 칭호이므로, 익숙한 교회식 대체어보다 원문 호칭을 그대로 살리는 것이 좋습니다.
  doctrine_reference: 원문 칭호의 역사-문학적 기능 보존
