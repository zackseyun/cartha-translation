source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֗מוּ וַ/יְהִ֞י כַּ/עֲל֤וֹת הַ/שַּׁ֨חַר֙ וַ/יִּקְרָ֨א שְׁמוּאֵ֤ל אֶל שָׁאוּל֙ ה/גג לֵ/אמֹ֔ר ק֖וּמָ/ה וַ/אֲשַׁלְּחֶ֑/ךָּ וַ/יָּ֣קָם שָׁא֗וּל וַ/יֵּצְא֧וּ שְׁנֵי/הֶ֛ם ה֥וּא וּ/שְׁמוּאֵ֖ל הַ/חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/026.yaml
  text: They rose early[a], and when the dawn was breaking, Samuel called to Saul on the roof, saying, “Get up, and I will send you on your way.” So Saul got up, and the two of them, he and Samuel[b], went outside.
  footnotes:
  - marker: a
    text: Or, more formally, 'at the rising of the dawn.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I will send you away.' The Hebrew can mean to dismiss or send someone off.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 일찍 일어났습니다[a]. 동틀 무렵에 사무엘이 지붕에서 사울을 불러 말했습니다. "일어나십시오. 내가 당신을 떠나보내겠습니다[b]." 사울이 일어났고, 둘은 곧장 밖으로 나갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보다 형식적으로는 ‘새벽이 떠오를 무렵에’라는 뜻으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘당신을 보내겠습니다/떠나보내겠습니다’로도 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  english_pob_choice: They rose early
  chosen_korean: 그들이 일찍 일어났습니다
  alternatives_korean:
  - 그들이 새벽 일찍 일어났습니다
  - 그들이 일찍이 일어났습니다
  lexicon: HALOT
  rationale: שׁכם의 관용적 의미인 ‘이른 시각에 일어나다’를 자연스러운 합쇼체로 옮기되, 본문의 시간 강조를 살렸습니다.
- source_word: כַּעֲלוֹת הַשַּׁחַר
  english_pob_choice: when the dawn was breaking
  chosen_korean: 동틀 무렵에
  alternatives_korean:
  - 새벽이 밝아 올 때
  - 여명이 올라올 때
  lexicon: HALOT
  rationale: 직역보다 한국어에서 자연스러운 시간표현으로, ‘새벽이 올라오는’ 이미지를 과도하게 풀지 않고 전달했습니다.
- source_word: הַגָּג
  english_pob_choice: on the roof
  chosen_korean: 지붕에서
  alternatives_korean:
  - 옥상에서
  - 지붕 위에서
  lexicon: HALOT
  rationale: 고대 주거의 평평한 지붕을 가리키므로, 문맥상 가장 직접적인 ‘지붕에서’를 택했습니다.
- source_word: וַאֲשַׁלְּחֶךָּ
  english_pob_choice: I will send you on your way
  chosen_korean: 내가 당신을 떠나보내겠습니다
  alternatives_korean:
  - 내가 당신을 보내겠습니다
  - 내가 당신을 보내드리겠습니다
  lexicon: HALOT
  rationale: שׁלח의 ‘보내다/떠나보내다’ 뉘앙스를 살리면서, 단순 해고처럼 들리지 않도록 ‘떠나보내다’로 옮겼습니다.
- source_word: שְׁנֵיהֶם הוּא וּשְׁמוּאֵל
  english_pob_choice: the two of them, he and Samuel
  chosen_korean: 둘은 곧장 밖으로 나갔습니다
  alternatives_korean:
  - 그 둘, 곧 그와 사무엘이 밖으로 나갔습니다
  - 둘, 곧 그와 사무엘이 밖으로 나갔습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘둘(그와 사무엘)’이라는 중복 강조를 한국어에서는 과도한 어순 흉내 대신 간결하게 풀어, 공동 동작의 사실을 분명히 했습니다.
