  text: וַ/יַּ֨עַן שָׁא֜וּל וַ/יֹּ֗אמֶר הֲ/ל֨וֹא בֶן יְמִינִ֤י אָ֨נֹכִי֙ מִ/קַּטַנֵּי֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וּ/מִשְׁפַּחְתִּ/י֙ הַ/צְּעִרָ֔ה מִ/כָּֽל מִשְׁפְּח֖וֹת שִׁבְטֵ֣י בִנְיָמִ֑ן וְ/לָ֨/מָּה֙ דִּבַּ֣רְתָּ אֵלַ֔/י כַּ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/021.yaml
  text: Saul answered and said[a], “Am I not a Benjaminite, from the smallest of the tribes of Israel? And is not my clan the least of all the clans of the tribe of Benjamin? So why have you spoken to me in this way?”
  footnotes:
  - marker: a
    text: Or, 'Why have you spoken to me such a thing?'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 대답하며 말했습니다. "제가 어찌 베냐민 사람이라, 이스라엘 지파들 중 가장 작은 지파에서 나왔고, 또 제 집안은 베냐민 지파의 모든 집안 가운데서도 가장 작은데, 어찌하여 당신은 저에게 이런 말을 하셨습니까?"[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “어찌하여 당신은 저에게 이런 말을 하셨습니까?”
    reason: alternative_reading
lexical_decisions:
- source_word: בֶן יְמִינִי
  english_pob_choice: a Benjaminite
  chosen_korean: 베냐민 사람
  alternatives_korean:
  - 베냐민인
  - 베냐민 지파 사람
  lexicon: HALOT
  rationale: जात/소속을 나타내는 형태이므로 직역식 ‘베냐민 사람’이 자연스럽고, 지파 소속을 분명히 드러냅니다.
- source_word: מִקַּטַנֵּי שִׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: from the smallest of the tribes of Israel
  chosen_korean: 이스라엘 지파들 중 가장 작은 지파에서 나왔고
  alternatives_korean:
  - 이스라엘 지파들 가운데 가장 작은 데서 나왔고
  - 이스라엘의 지파들 중 가장 작은 지파에서
  lexicon: HALOT
  rationale: 미ִן의 출신/소속 감각을 살려 ‘~에서 나왔고’로 옮기고, קטן의 비교적 의미는 ‘가장 작은’으로 직결했습니다.
- source_word: וּמִשְׁפַּחְתִּי הַצְּעִרָה
  english_pob_choice: my clan ... the least
  chosen_korean: 제 집안은 ... 가장 작은데
  alternatives_korean:
  - 제 씨족은 ... 가장 미약한데
  - 제 가문은 ... 가장 작은데
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 문맥상 단순 가족보다 큰 친족 단위를 가리키므로 ‘집안’으로 옮겼고, ‘least’는 순위·중요도 모두를 포괄하는 ‘가장 작은’으로 처리했습니다.
- source_word: כַּדָּבָר הַזֶּה
  english_pob_choice: in this way
  chosen_korean: 이런 말을 하셨습니까
  alternatives_korean:
  - 이런 일을 하셨습니까
  - 이런 식으로 말씀하셨습니까
  lexicon: HALOT
  rationale: 직전 발화의 내용 전체를 가리키므로 한국어에서는 수단보다 내용 중심의 자연스러운 구문으로 풀어 옮겼습니다.
theological_decisions:
- issue: 사울의 자기비하 표현을 어떻게 재현할지
  chosen_reading: 사회적·가문적 낮은 지위를 드러내는 겸손한 자기평가로 유지했습니다.
  alternative_readings:
  - 단순한 개인 겸손으로 약화
  - 과장된 수사로만 처리
  rationale: 본문은 지파와 친족 단위의 낮음을 연속적으로 강조하므로, 한국어도 그 구조를 유지해 사울의 자의식과 서사의 대비를 보존해야 합니다.
  doctrine_reference: 본문 내 인물 성격 묘사; 사회-서사적 맥락
