  yaml_path: translation/ot/1_samuel/009/021.yaml
  text: Saul answered and said[a], “Am I not a Benjaminite, from the smallest of the tribes of Israel? And is not my clan the least of all the clans of the tribe of Benjamin? So why have you spoken to me in this way?”
  footnotes:
  - marker: a
    text: Or, 'Why have you spoken to me such a thing?'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 대답하여 말했습니다. “제가 이스라엘 지파들 가운데 가장 작은 지파에 속한 베냐민 사람이 아닙니까? 또 제 집안은 베냐민 지파의 모든 집안 가운데 가장 미약한 편이 아닙니까? 그런데 어찌하여 저에게 이런 식으로 말씀하셨습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “어찌하여 저에게 그런 말씀을 하셨습니까?”
    reason: כַּדָּבָר הַזֶּה는 말한 방식(‘이런 식으로’) 또는 그 말의 내용(‘그런 말씀’)을 가리킬 수 있습니다.
lexical_decisions:
- source_word: בֶן יְמִינִי
