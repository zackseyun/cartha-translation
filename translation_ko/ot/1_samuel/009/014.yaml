id: 1SA.9.14
reference: 1 Samuel 9:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יַּעֲל֖וּ הָ/עִ֑יר הֵ֗מָּה בָּאִים֙ בְּ/ת֣וֹךְ הָ/עִ֔יר וְ/הִנֵּ֤ה שְׁמוּאֵל֙ יֹצֵ֣א לִ/קְרָאתָ֔/ם לַ/עֲל֖וֹת הַ/בָּמָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/014.yaml
  text: So they went up to the city. As they were entering the city[a], behold, Samuel was coming out to meet them, to go up to the high place.
  footnotes:
  - marker: a
    text: Or 'inside the city.' The Hebrew literally says 'in the midst of the city.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그들이 그 성읍으로 올라갔습니다. 그들이 성읍 한가운데로 들어가고 있을 때, 보라, 사무엘이 그들을 맞으러 나와 산당으로 올라가려 하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘성읍 한가운데에서/가운데로’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  english_pob_choice: they went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 올랐습니다
  - 위로 올라갔습니다
  lexicon: HALOT
  rationale: עלה의 기본 의미인 ‘올라가다’를 자연스러운 서술체로 옮겼습니다. 성읍이 높은 지형에 있음을 암시하는 방향감도 유지합니다.
- source_word: בְּתוֹךְ הָעִיר
  english_pob_choice: the middle of the city
  chosen_korean: 성읍 한가운데로
  alternatives_korean:
  - 성읍 안으로
  - 성읍 가운데로
  lexicon: HALOT
  rationale: בתוך의 핵심 공간감인 ‘가운데/한가운데’는 유지하되, 한국어에서는 ‘한가운데로 들어가고 있을 때’가 가장 자연스럽습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보라
  alternatives_korean:
  - 주목하십시오
  - 그런데
  lexicon: HALOT
  rationale: 새 장면의 돌발성과 주목을 끄는 담화 표지를 살리기 위해 ‘보라’를 사용했습니다.
- source_word: לִקְרָאתָם
  english_pob_choice: to meet them
  chosen_korean: 그들을 맞으러
  alternatives_korean:
  - 그들을 만나러
  - 그들을 대면하러
  lexicon: HALOT
  rationale: לקראת의 ‘맞으러/만나러’ 의미를 살려 사무엘이 그들에게 다가오는 움직임을 분명하게 했습니다.
- source_word: לַעֲלוֹת הַבָּמָה
  english_pob_choice: to go up to the high place
  chosen_korean: 산당으로 올라가려 하고 있었습니다
  alternatives_korean:
  - 산당으로 올라가려 했습니다
  - 높은 곳으로 올라가려 하고 있었습니다
  lexicon: HALOT
  rationale: במה는 이 절의 제의적 지점이므로 관용적으로 ‘산당’으로 옮겼습니다. 동시에 목적구문 ‘to go up’의 진행성을 반영해 ‘올라가려 하고 있었습니다’로 표현했습니다.
theological_decisions:
- issue: במה의 번역을 제의적 장소로 어떻게 드러낼지
  chosen_reading: 산당
  alternative_readings:
  - 높은 곳
  - 예배처
  rationale: 이 문맥의 במה는 단순 지형이 아니라 예배를 위한 제의 장소를 가리키므로, 한국어 성경에서 익숙한 ‘산당’을 사용해 역사·종교적 의미를 보존했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; cultic-historical specificity'
- issue: 히브리어 이야기체의 연속 동작을 한국어에서 어떻게 살릴지
  chosen_reading: ‘들어가고 있을 때’와 ‘올라가려 하고 있었습니다’로 진행형을 반영
  alternative_readings:
  - 들어가자
  - 들어갔을 때
  rationale: 연속된 장면 전환과 사무엘의 동시적 동작을 보여 주기 위해, 단순 완료보다 진행 표현을 택했습니다.
  doctrine_reference: Narrative aspect preservation
