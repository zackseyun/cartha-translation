revisions:
- from: 그래서 그들이 그 성읍으로 올라갔습니다. 그들이 성읍 한가운데로 들어가고 있을 때, 보라, 사무엘이 그들을 맞으러 나와 산당으로 올라가려 하고 있었습니다.[a]
