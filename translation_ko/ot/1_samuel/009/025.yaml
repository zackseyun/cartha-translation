lexical_decisions:
- source_word: וַיֵּרְדוּ מֵהַבָּמָה
  english_pob_choice: When they came down from the high place
  chosen_korean: 산당에서 내려오자
  alternatives_korean:
  - 높은 곳에서 내려오자
  - 산당에서 내려왔습니다
  lexicon: HALOT
  rationale: בָּמָה는 여기서 제의적 ‘산당’으로 보는 것이 가장 자연스럽고, 동작의 진행을 살려 ‘내려오자’로 옮겼습니다.
- source_word: הָעִיר
  english_pob_choice: into the city
  chosen_korean: 성읍으로
  alternatives_korean:
  - 도성으로
  - 도시로
  lexicon: HALOT
  rationale: 문맥상 산당에서 성읍 내부로 이동하는 방향이므로 현대 한국어에서는 ‘성읍으로’가 가장 간결하고 본문 의미를 유지합니다.
- source_word: וַיְדַבֵּר עִם שָׁאוּל
  english_pob_choice: he spoke with Saul
  chosen_korean: 그는 사울과 말했습니다
  alternatives_korean:
  - 사울에게 말했습니다
  - 사울과 이야기를 나누었습니다
  lexicon: HALOT
  rationale: עִם은 단순히 ‘~와 함께’의 대화적 관계를 나타내므로, 일방적 발화보다 상호 대화 뉘앙스가 살아 있는 ‘사울과 말했습니다’가 적절합니다.
- source_word: עַל הַגָּג
  english_pob_choice: on the roof
  chosen_korean: 지붕 위에서
  alternatives_korean:
  - 옥상에서
  - 지붕 위에
  lexicon: HALOT
  rationale: גָּג은 평평한 지붕을 가리키며, 현대 한국어에서는 ‘지붕 위에서’가 가장 자연스럽고 장소 부사로도 무리 없습니다.
theological_decisions:
- issue: 제의적 장소를 가리키는 בָּמָה의 번역
  chosen_reading: ‘산당’으로 옮겨 제의적 배경을 드러냈습니다.
  alternative_readings:
  - ‘높은 곳’으로 일반화하기
  - ‘언덕’으로 완화하기
  rationale: 본문의 이동 경로는 단순 지형이 아니라 제사 후 하산 장면으로 읽히므로, 의미를 희석하지 않는 표준적 번역을 택했습니다.
  doctrine_reference: 구약 제의/성소 용어의 문맥 유지
- issue: 대화 관계를 나타내는 עִם의 처리
  chosen_reading: ‘사울과 말했습니다’로 대화적 상호성을 살렸습니다.
  alternative_readings:
  - ‘사울에게 말했습니다’로 단방향 발화로 옮기기
  rationale: 히브리어 עִם은 여기서 단순한 동반이 아니라 실제 대화를 암시하므로, 문맥상 양방향 소통을 드러내는 번역이 더 충실합니다.
  doctrine_reference: 서사 문맥의 화행 보존
