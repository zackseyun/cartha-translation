  terminology: ‘산당’, ‘성읍’, ‘사울’은 문맥과 성경 번역 관례에 맞습니다. ‘이야기를 나누었습니다’는 עִם(‘~와 함께’)가 나타내는 대화 관계를 자연스럽게 반영하며, 특정 대화 내용을 덧붙이지 않습니다.
