  text: When Samuel saw Saul[a], Yahweh answered him, “Look, this is the man of whom I spoke to you. This one shall rule over my people.”
  footnotes:
  - marker: a
    text: Or, more literally, “This one shall restrain / govern my people.” The Hebrew verb can carry the sense of holding back, controlling, or governing.
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘이 사울을 보았을 때 야훼께서 그에게 응답하여 말씀하셨습니다. “보십시오, 내가 당신에게 말한 바로 그 사람입니다. 이 사람이 내 백성을 다스릴 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, “이 사람이 내 백성을 억제할 / 다스릴 것입니다.” 히브리어 동사는 붙들어 두다, 제어하다, 다스리다의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
