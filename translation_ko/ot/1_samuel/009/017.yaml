- from: 사무엘이 사울을 보았을 때 야훼께서 그에게 응답하여 말씀하셨습니다. “보십시오, 내가 당신에게 말한 바로 그 사람입니다. 이 사람이 내 백성을 다스릴 것입니다.”[a]
