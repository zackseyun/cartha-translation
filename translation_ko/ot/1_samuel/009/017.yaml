theological_decisions:
- issue: 야훼의 직접 화법 표기
  chosen_reading: 하나님이 사무엘에게 직접 말씀하시는 장면이므로, 한국어 인용부호 안에서는 경어체를 유지했습니다.
  alternative_readings:
  - 평서체로 평이하게 처리
  - 더 고어적인 종교 문체 사용
  rationale: 본문의 신적 발화를 현대 합쇼체로 전달하되, 인용문 안에서도 위엄과 직접성을 보존하기 위한 선택입니다.
  doctrine_reference: Korean style / divine speech register
- issue: יַעְצֹר의 의미 범위
  chosen_reading: 문맥상 통치 기능을 가리키므로 ‘다스리다’로 번역했습니다.
  alternative_readings:
  - ‘억제하다’
  - ‘붙들어 제어하다’
  rationale: 영어 POB의 본문은 왕적 통치 맥락을 우선시하므로, 본문에는 자연스러운 통치어를 두고 더 문자적인 가능성은 주해로 남기는 편이 본문의 의도를 잘 드러냅니다.
  doctrine_reference: 1 Samuel 9:17 royal designation context
