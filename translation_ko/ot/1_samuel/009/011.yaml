  naturalness: ‘젊은 여자들’도 이해되지만 현대 표준어의 서술 문맥에서는 ‘젊은 여인들’이 더 자연스럽고 존중하는 어감입니다. 또한 각주 문장은 ‘뒤이어 … 불리게 될 인물’이라는 표현보다 호칭 자체의 시대적 구별을 직접 설명하는 편이 명료합니다.
