source:
  edition: WLC
  text: הֵ֗מָּה עֹלִים֙ בְּ/מַעֲלֵ֣ה הָ/עִ֔יר וְ/הֵ֨מָּה֙ מָצְא֣וּ נְעָר֔וֹת יֹצְא֖וֹת לִ/שְׁאֹ֣ב מָ֑יִם וַ/יֹּאמְר֣וּ לָ/הֶ֔ן הֲ/יֵ֥שׁ בָּ/זֶ֖ה הָ/רֹאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/011.yaml
  text: As they were going up the ascent to the city[a], they found young women coming out to draw water, and they said to them, “Is the seer here?”
  footnotes:
  - marker: a
    text: Or 'the prophet.' The Hebrew specifically says 'the seer,' an older term for one later called a prophet.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 성읍으로 올라가는 오르막길에 이르렀을 때, 물을 길으러 나오는 젊은 여자들을 만나고 그들에게 말했습니다. “선견자가 여기 있습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘선견자’는 여기서 더 이른 직함이며, 뒤이어 ‘예언자’로 불리게 될 인물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלִים בְּמַעֲלֵה הָעִיר
  english_pob_choice: were going up the ascent to the city
  chosen_korean: 성읍으로 올라가는 오르막길
  alternatives_korean:
  - 성읍으로 올라가는 길
  - 성읍으로 오르는 비탈
  lexicon: HALOT
  rationale: בְּמַעֲלֶה는 단순한 이동이 아니라 실제 ‘오름/오르막’의 지형을 가리키므로, 자연스러운 현대 한국어로 ‘오르막길’이라 옮겨 지형적 뉘앙스를 살렸습니다.
- source_word: נְעָרוֹת
  english_pob_choice: young women
  chosen_korean: 젊은 여자들
  alternatives_korean:
  - 소녀들
  - 처녀들
  lexicon: HALOT
  rationale: 여성 청년층을 가리키는 말로, ‘소녀들’의 어린 느낌과 ‘처녀들’의 전통적·혼인상태 함의를 피하면서도 원뜻을 유지했습니다.
- source_word: לִשְׁאֹב מָיִם
  english_pob_choice: to draw water
  chosen_korean: 물을 길으러
  alternatives_korean:
  - 물을 길어오러
  - 물을 퍼 오러
  lexicon: HALOT
  rationale: שׁאב은 물을 ‘긷다/길어오다’의 뜻이므로, 목적을 나타내는 ‘-러’ 구문으로 자연스럽게 처리했습니다.
- source_word: הָרֹאֶה
  english_pob_choice: the seer
  chosen_korean: 선견자
  alternatives_korean:
  - 예언자
  - 보는 자
  lexicon: HALOT
  rationale: 본문은 후기의 ‘예언자’보다 더 오래된 직함인 ‘the seer’를 쓰므로, 한국어에서도 기능적으로 대응하는 ‘선견자’를 택해 역사적 구별을 살렸습니다.
theological_decisions:
- issue: 고대 직함 ‘the seer’의 번역
  chosen_reading: ‘선견자’로 직역해, 다음 절에서 설명될 더 이른 예언자 호칭과의 긴장을 보존했습니다.
  alternative_readings:
  - ‘예언자’로 일반화
  - ‘선지자’로 교회적 관용어 사용
  rationale: 사무엘기의 이 문맥에서는 단순한 현대적 일반어보다, 본문이 의도하는 고대 직함의 역사성을 드러내는 번역이 더 충실합니다.
  doctrine_reference: 본문의 역사적-서술적 정밀성
- issue: 지시 대명사 ‘בָּזֶה’의 처리
  chosen_reading: ‘여기’로 자연스럽게 옮겨, 장소 존재 여부를 묻는 관용적 질문으로 표현했습니다.
  alternative_readings:
  - ‘이곳에’
  - ‘이 자리에서’
  rationale: 질문의 핵심은 특정 인물의 현존 여부이므로, 한국어 관용법상 ‘여기 있습니까?’가 가장 간결하고 정확합니다.
  doctrine_reference: 서술 문맥의 의미 보존
