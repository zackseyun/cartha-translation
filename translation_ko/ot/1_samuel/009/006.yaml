id: 1SA.9.6
reference: 1 Samuel 9:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ הִנֵּה נָ֤א אִישׁ אֱלֹהִים֙ בָּ/עִ֣יר הַ/זֹּ֔את וְ/הָ/אִ֣ישׁ נִכְבָּ֔ד כֹּ֥ל אֲשֶׁר יְדַבֵּ֖ר בּ֣וֹא יָב֑וֹא עַתָּה֙ נֵ֣לֲכָה שָּׁ֔ם אוּלַי֙ יַגִּ֣יד לָ֔/נוּ אֶת דַּרְכֵּ֖/נוּ אֲשֶׁר הָלַ֥כְנוּ עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/006.yaml
  text: He said to him, “Look now, there is a man of God in this city, and the man is held in honor; everything that he says surely comes to pass. Now let us go there. Perhaps he will tell us the way we should go.”
translation:
  language: ko
  text: 그가 그에게 말했습니다. “보십시오, 이 도시에 하나님의 사람이 한 분 계십니다. 그 사람은 존중을 받습니다. 그가 말하는 것은 무엇이든 반드시 이루어집니다. 이제 그곳으로 갑시다. 그러면 그가 우리가 가야 할 길을 알려 줄지도 모릅니다.”
  philosophy: formal
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  english_pob_choice: a man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 예언자
  lexicon: אִישׁ / אֱלֹהִים
  rationale: 히브리어 관용구를 그대로 살려, 특정 직분을 과도하게 규정하지 않고 하나님께 속한 사람이라는 정체성을 드러냈습니다.
- source_word: נִכְבָּד
  english_pob_choice: is held in honor
  chosen_korean: 존중을 받습니다
  alternatives_korean:
  - 존귀하게 여겨집니다
  - 유명합니다
  lexicon: כבד
  rationale: 단순한 명성보다 사회적 존중과 무게감이 있는 평가를 나타내므로, 수동형으로 ‘존중을 받습니다’라고 옮겼습니다.
- source_word: כֹּל אֲשֶׁר יְדַבֵּר בּוֹא יָבֹא
  english_pob_choice: everything that he says surely comes to pass
  chosen_korean: 그가 말하는 것은 무엇이든 반드시 이루어집니다
  alternatives_korean:
  - 그가 말하는 것은 모두 반드시 일어납니다
  - 그가 말하는 모든 것은 틀림없이 됩니다
  lexicon: דבר / בוא
  rationale: ‘반드시 이루어집니다’는 예언의 실현성을 자연스럽게 살리면서도, 말한 내용의 성취라는 원문 의미를 직접 반영합니다.
- source_word: דַּרְכֵּנוּ אֲשֶׁר הָלַכְנוּ עָלֶיהָ
  english_pob_choice: the way we should go
  chosen_korean: 우리가 가야 할 길
  alternatives_korean:
  - 우리가 걸어온 길
  - 우리가 가야 하는 길
  lexicon: דרך
  rationale: 문맥상 이미 지나온 경로를 묻는 것이 아니라 앞으로의 방향을 묻는 말이므로, POB의 결정과 같이 ‘가야 할 길’로 옮겼습니다.
theological_decisions:
- issue: 예언의 확실성 표현
  chosen_reading: ‘그가 말하는 것은 무엇이든 반드시 이루어집니다’로 예언의 성취를 단정적으로 표현했습니다.
  alternative_readings:
  - ‘그가 말하는 것은 다 맞습니다’
  - ‘그가 말하는 것은 이루어질 것입니다’
  rationale: 히브리어의 단호한 성취 뉘앙스를 약화하지 않기 위해, 가능성 표현보다 확정적 성취 표현을 택했습니다.
  doctrine_reference: 선지자적 발언의 성취성
