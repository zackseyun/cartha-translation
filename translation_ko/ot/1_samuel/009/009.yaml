translation:
  language: ko
  text: 옛날 이스라엘에서는[a] 사람이 하나님께 여쭈러 갈 때, “자, 함께 선견자에게 갑시다”라고 말하곤 했습니다. 오늘날 예언자라고 불리는 이는 옛날에는 선견자라고 불렸기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “옛날 이스라엘에서 어떤 사람이 하나님을 찾으러 갈 때, ‘자, 선견자에게 갑시다’라고 말하곤 했습니다.”
    reason: לְפָנִים בְּיִשְׂרָאֵל 및 לִדְרֹשׁ אֱלֹהִים의 가능한 구문 및 어휘 대안을 반영합니다.
