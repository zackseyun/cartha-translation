base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/009.yaml
  text: Formerly in Israel[a], when a man went to inquire of God, he would say, “Come, and let us go to the seer,” for the prophet of today was formerly called the seer.
  footnotes:
  - marker: a
    text: Or “In former times in Israel, when a man went to seek God, he would say, ‘Come, let us go to the seer.’”
    reason: lexical_alternative
translation:
  language: ko
  text: 옛날 이스라엘에서는 하나님께 묻기 위해 가는 사람이 있으면 “오십시오. 함께 점쟁이에게 갑시다”라고 말하곤 했습니다. 오늘날의 예언자는 옛날에 점쟁이라고 불렸기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “옛날 이스라엘에서는, 어떤 사람이 하나님을 찾으러 가면 ‘오십시오. 점쟁이에게 갑시다’라고 말하곤 했습니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: לְפָנִים / לְפָנִים
  english_pob_choice: Formerly
  chosen_korean: 옛날에는
  alternatives_korean:
  - 예전에는
  - 옛적에는
  lexicon: HALOT
  rationale: 두 번 반복되는 시간 부사를 한국어에서도 자연스럽게 살리되, 현재와의 대비를 분명히 하기 위해 구어체에 가깝지만 공적인 ‘옛날에는’을 택했습니다.
- source_word: לִדְרֹשׁ אֱלֹהִים
  english_pob_choice: to inquire of God
  chosen_korean: 하나님께 묻기 위해
  alternatives_korean:
  - 하나님을 찾기 위해
  - 하나님께 문의하기 위해
  lexicon: HALOT
  rationale: 이 구절은 예언자에게서 하나님의 뜻을 확인하려는 관용 표현이므로, 종교적·실천적 뉘앙스를 살리면서도 현대 한국어로 자연스러운 ‘묻기 위해’로 옮겼습니다.
- source_word: הָרֹאֶה
  english_pob_choice: the seer
  chosen_korean: 점쟁이
  alternatives_korean:
  - 선견자
  - 보는 사람
  lexicon: HALOT
  rationale: 로아에흐는 예언자의 옛 호칭이지만, 문맥상 단순한 직역보다 당시 일반인이 이해하던 구분을 드러내는 표현이 필요하여 ‘점쟁이’로 옮겼습니다. 다만 한국어의 현대적 음가를 고려해 예언자와 대비되는 옛 명칭임을 분명히 했습니다.
- source_word: לַנָּבִיא הַיּוֹם
  english_pob_choice: the prophet of today
  chosen_korean: 오늘날의 예언자
  alternatives_korean:
  - 오늘의 예언자
  - 지금의 예언자
  lexicon: HALOT
  rationale: ‘나비’는 한국어 표준 교회 용어인 ‘예언자’로 옮겨, 바로 앞의 옛 호칭 ‘점쟁이’와 기능적 대비가 드러나게 했습니다. 관형어 ‘오늘날의’는 나레이터의 설명적 시점을 살립니다.
theological_decisions:
- issue: 옛 예언자 호칭인 רֹאֶה를 어떻게 한국어로 드러낼 것인지
  chosen_reading: 점쟁이
  alternative_readings:
  - 선견자
  - 보는 사람
  rationale: 이 절은 예언자 직분의 신학적 정의를 하려는 것이 아니라, 당시 이스라엘에서 사용되던 옛 호칭을 설명합니다. 한국어에서 ‘점쟁이’는 현대 독자에게 다소 거칠지만, 옛 호칭으로서의 구별과 거리감을 가장 분명히 드러냅니다.
  doctrine_reference: Translation philosophy §1
- issue: ‘오늘날의 예언자’와 ‘옛날의 점쟁이’의 대비를 어떻게 처리할지
  chosen_reading: 설명적 대비를 살린 서술
  alternative_readings:
  - 단순 과거형 처리
  - 현대적 직업명으로 중화
  rationale: 히브리어는 편집자의 회고적 설명을 통해 명칭 변화의 사실을 알려 줍니다. 이를 완화하지 않고, 현대 독자가 ‘옛 호칭’과 ‘현재 호칭’의 대비를 바로 읽도록 구성했습니다.
  doctrine_reference: Translation philosophy §4
