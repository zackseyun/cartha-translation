  lexicon: HALOT
  rationale: 문맥상 단순한 잔여물이 아니라 사울을 위해 따로 떼어 둔 몫이므로, ‘남겨 둔 것’이 가장 자연스럽습니다.
- source_word: שִׂים לְפָנֶיךָ
  english_pob_choice: is set before you
