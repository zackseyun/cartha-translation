  source_fidelity: 원문의 הַשּׁוֹק는 동물의 다리 부분을 가리키므로 ‘넓적다리’로 한정하기보다 ‘다리’가 안전합니다. 또한 לַמּוֹעֵד ... לֵאמֹר의 압축된 시간 표현은 현재 번역의 ‘...말한 때부터, 정해진 때를 위해’보다 ‘내가 ... 말한 그 정해진 때를 위하여’로 옮기는 편이 원문의 연결을 충실히 반영합니다. הַנִּשְׁאָר는 문맥상 사울을 위해 보존된 몫이지만 ‘남겨 둔 것’이라는 표현도 유지하여 남은 것/보류된 것의 여지를 보존했습니다.
  naturalness: ‘요리사’, ‘그 위에 얹혀 있던 것’, ‘그 정해진 때를 위하여’는 현대 표준 한국어의 격식 있는 성경 문체에 자연스럽습니다. 직접 인용 안의 불필요한 ‘당신’은 생략하여 호칭의 어색함을 줄였고, 명령 ‘드십시오’는 유지했습니다.
