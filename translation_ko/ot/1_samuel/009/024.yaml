  lexicon: HALOT
  rationale: 원문은 그 부속 부분을 구체적으로 명시하지 않으므로, POB의 취지를 따라 특정하지 않고 넓게 살렸습니다.
- source_word: הַנִּשְׁאָר
  english_pob_choice: what has been kept
  chosen_korean: 남겨 둔 것
  alternatives_korean:
