base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/024.yaml
  text: So the cook took up the leg and what was on it and set it before Saul[a]. And he said, “Look, what has been kept is set before you. Eat, because it was kept for you for the appointed time, from when I said[d][c][b], ‘I have invited the people.’” So Saul ate with Samuel that day.
  footnotes:
  - marker: a
    text: Or 'the thigh'; Hebrew שׁוֹק refers to the leg portion of the animal.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'the leg and what was on it.' The accompanying portion is not explicitly identified in the text.
    reason: lexical_alternative
  - marker: c
    text: Or 'what remains.' The Hebrew can mean either what was left over or what had been reserved; the context favors the sense of a portion specially kept for Saul.
    reason: alternative_reading
  - marker: d
    text: Or 'I have called the people.' In this meal setting, 'invited' brings out the likely sense of the Hebrew verb.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 요리하는 사람이 넓적다리와 그 위에 있는 것을 가져다가 사울 앞에 놓았습니다[a][b]. 그가 말했습니다. “보십시오, 남겨 둔 것이 당신 앞에 놓여 있습니다. 드십시오. 그것은 ‘내가 백성을 초청했다’고 말한 때부터, 정해진 때를 위해 당신을 위하여 보관해 둔 것이기 때문입니다[c][d].” 그러자 사울은 그날 사무엘과 함께 먹었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘넓적다리’는 히브리어 שׁוֹק의 자연스러운 현대어 옮김입니다. 전통적으로는 ‘허벅지/다리’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그 위에 있는 것’을 덧붙이지만, 그 구체적 항목은 본문이 명시하지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘남겨 둔 것’은 단순한 잔여물이 아니라 사울을 위해 따로 보관된 몫이라는 문맥을 반영합니다.
    reason: alternative_reading
  - marker: d
    text: 히브리어 동사는 여기서 ‘부르다’보다 ‘초청하다’의 뜻이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטַּבָּח
  english_pob_choice: the cook
  chosen_korean: 요리하는 사람
  alternatives_korean:
  - 요리사
  - 음식을 준비하는 사람
  - 도축하는 사람
  lexicon: HALOT
  rationale: 연회 자리에서 고기를 준비해 내오는 역할을 자연스럽게 드러내기 위해 ‘요리하는 사람’으로 옮겼습니다. ‘도축하는 사람’은 어감이 지나치게 거칠어 문맥에 덜 맞습니다.
- source_word: הַשּׁוֹק
  english_pob_choice: the leg
  chosen_korean: 넓적다리
  alternatives_korean:
  - 다리
  - 허벅지
  - 정강이
  lexicon: HALOT
  rationale: 히브리어는 동물의 다리 부위를 가리키며, 한국어에서는 식탁 맥락에서 ‘넓적다리’가 가장 자연스럽고 구체적입니다.
- source_word: וְהֶעָלֶיהָ
  english_pob_choice: and what was on it
  chosen_korean: 그 위에 있는 것
  alternatives_korean:
  - 그 위에 얹힌 것
  - 그와 함께 있는 것
  - 그 위의 기름기
  lexicon: HALOT
  rationale: 원문은 그 부속 부분을 구체적으로 명시하지 않으므로, POB의 취지를 따라 특정하지 않고 넓게 살렸습니다.
- source_word: הַנִּשְׁאָר
  english_pob_choice: what has been kept
  chosen_korean: 남겨 둔 것
  alternatives_korean:
  - 남은 것
  - 따로 보관한 것
  - 예비해 둔 것
  lexicon: HALOT
  rationale: 문맥상 단순한 잔여물이 아니라 사울을 위해 따로 떼어 둔 몫이므로, ‘남겨 둔 것’이 가장 자연스럽습니다.
- source_word: שִׂים לְפָנֶיךָ
  english_pob_choice: is set before you
  chosen_korean: 당신 앞에 놓여 있습니다
  alternatives_korean:
  - 당신 앞에 두십시오
  - 당신 앞에 차려졌습니다
  - 당신 앞에 놓았습니다
  lexicon: HALOT
  rationale: 히브리어 명령형은 실제 식사 장면에서 이미 놓여 있는 상태를 가리키는 듯하므로, 한국어에서는 결과 상태를 나타내는 표현이 자연스럽습니다.
- source_word: לַמּוֹעֵד
  english_pob_choice: for the appointed time
  chosen_korean: 정해진 때를 위해
  alternatives_korean:
  - 정해진 때를 위하여
  - 예정된 시각을 위해
  - 정해진 행사 때를 위해
  lexicon: HALOT
  rationale: מוֹעֵד의 핵심인 ‘정해진/약속된 때’를 살리되, 식사 문맥에 맞게 지나치게 제의적으로 좁히지 않았습니다.
theological_decisions:
- issue: שמירה/보관의 뉘앙스
  chosen_reading: ‘보관해 둔 것’으로 옮겨, 단순히 남은 음식이 아니라 미리 따로 떼어 둔 몫임을 드러냈습니다.
  alternative_readings:
  - ‘남은 것’
  - ‘예비된 것’
  rationale: 원문은 사울을 위해 의도적으로 확보된 몫이라는 점을 암시하므로, 그 의미를 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 본문 의미 보존 원칙
- issue: 직접화법의 인용 구조
  chosen_reading: ‘내가 백성을 초청했다’는 말을 직접 인용으로 살렸습니다.
  alternative_readings:
  - ‘내가 백성을 불렀다’
  - 간접화법으로 처리
  rationale: 연회 맥락에서 קרא는 ‘초청하다’의 뜻이 강하므로, 사울을 위한 식사 준비의 성격을 분명히 했습니다.
  doctrine_reference: 본문 맥락 해석
