  naturalness: 현대 표준어 합쇼체에서 ‘그 보는 사람입니다’와 문장 끝에 몰아 둔 각주 표지는 어색합니다. ‘선견자입니다’로 하고, 각주를 해당 낱말과 식사 초대 뒤에 각각 배치하면 자연스럽고 독해가 명료합니다. ‘당신’의 반복도 줄였습니다.
  terminology: הָרֹאֶה는 ‘선견자’, הַבָּמָה는 ‘산당’으로 옮기는 것이 한국어 성서 용어와 원문의 구별된 제의·역사적 어휘를 함께 살립니다. ‘마음에 있는 모든 것’은 לְבָב의 내면적 의미를 과도하게 해석하지 않습니다.
  issues:
