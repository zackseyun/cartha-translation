  text: וַ/יַּ֨עַן שְׁמוּאֵ֜ל אֶת שָׁא֗וּל וַ/יֹּ֨אמֶר֙ אָנֹכִ֣י הָ/רֹאֶ֔ה עֲלֵ֤ה לְ/פָנַ/י֙ הַ/בָּמָ֔ה וַ/אֲכַלְתֶּ֥ם עִמִּ֖/י הַ/יּ֑וֹם וְ/שִׁלַּחְתִּ֣י/ךָ בַ/בֹּ֔קֶר וְ/כֹ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ אַגִּ֥יד לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/019.yaml
  text: Samuel answered Saul and said[a], “I am the seer. Go up before me to the high place, and eat with me today. In the morning I will send you on your way[b], and I will tell you all that is in your heart.”
  footnotes:
  - marker: a
    text: Hebrew 'you shall eat' is plural, likely including Saul's servant as well as Saul himself.
    reason: lexical_alternative
  - marker: b
    text: Or 'the prophet.' The Hebrew uses the older term 'seer,' which 1 Samuel 9:9 explains as an earlier designation for a prophet.
    reason: alternative_reading
translation:
  language: ko
  text: 사무엘이 사울에게 대답하며 말했습니다. "나는 그 보는 사람입니다. 내 앞서 산당으로 올라가서 오늘 나와 함께 먹으십시오. 아침에 내가 당신을 보내드리고, 당신 마음에 있는 모든 것을 당신에게 말해 드리겠습니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 복수형으로 되어 있어, 사울뿐 아니라 그의 종도 함께 포함하는 식사 초대로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘보는 사람’이며, 1사무엘 9:9는 이것이 예언자를 가리키는 더 오래된 호칭임을 설명합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָרֹאֶה
  english_pob_choice: the seer
  chosen_korean: 그 보는 사람
  alternatives_korean:
  - 선견자
  - 선지자
  lexicon: HALOT
  rationale: 히브리어의 직역적 의미인 ‘보는 사람’을 살리면 1사무엘 9:9의 고어적 호칭이라는 역사적 뉘앙스가 유지되며, 이를 곧바로 ‘선지자’로 평평하게 만들지 않습니다.
- source_word: הַבָּמָה
  english_pob_choice: the high place
  chosen_korean: 산당
  alternatives_korean:
  - 높은 곳
  - 제단
  lexicon: HALOT
  rationale: cultic height를 가리키는 보통 명칭이므로 ‘산당’이 가장 자연스럽고 원문 제의 장소의 성격을 직접 드러냅니다.
- source_word: וַאֲכַלְתֶּם עִמִּי הַיּוֹם
  english_pob_choice: and you shall eat with me today
  chosen_korean: 오늘 나와 함께 먹으십시오
  alternatives_korean:
  - 오늘 나와 함께 먹으셔야 합니다
  - 오늘 나와 함께 드십시오
  lexicon: HALOT
  rationale: 히브리어 복수형의 식사 초대를 한국어에서는 예의 있는 초청문으로 옮기되, 대상이 사울과 그의 종까지 포함될 수 있는 복수 뉘앙스는 본문 안에서 과도하게 설명하지 않고 유지합니다.
- source_word: וְשִׁלַּחְתִּיךָ
  english_pob_choice: I will send you on your way
  chosen_korean: 내가 당신을 보내드리고
  alternatives_korean:
  - 내가 당신을 떠나보내고
  - 내가 당신을 보내고
  lexicon: HALOT
  rationale: 단순한 ‘보내다’보다 떠나는 길을 허락하는 초대의 흐름이 분명하므로, 한국어에서는 ‘보내드리다’로 자연스럽게 풀었습니다.
- source_word: וְכֹל אֲשֶׁר בִּלְבָבְךָ
  english_pob_choice: all that is in your heart
  chosen_korean: 당신 마음에 있는 모든 것
  alternatives_korean:
  - 당신의 마음속에 있는 모든 것
  - 당신의 속마음에 있는 모든 것
  lexicon: HALOT
  rationale: לבב의 내면·의도 의미를 살리면서도 현대 한국어에서 지나치게 심리화하지 않도록 ‘마음에 있는 모든 것’으로 옮겼습니다.
theological_decisions:
- issue: 왕래 초청의 화법과 존칭 처리
  chosen_reading: 사무엘의 말은 예언자적 권위가 있으나, 사울에게는 정중한 초청과 안내의 말로 들리므로 한국어에서는 합쇼체를 유지했습니다.
  alternative_readings:
  - 명령문처럼 더 직설적으로 옮기는 방식
  - 전통적 성서체 어미로 높이는 방식
  rationale: 본문의 내용은 계시 선언과 식사 초대가 함께 있는 대화이며, 한국어에서 과도한 고어체를 쓰면 장면의 즉시성이 약해집니다.
  doctrine_reference: narrative discourse register
