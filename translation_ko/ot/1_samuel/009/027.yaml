base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/027.yaml
  text: As they were going down to the edge of the city[a], Samuel said to Saul, “Tell the young man to go on ahead of us.” And he went on ahead. “But you, stand here now[b], and I will let you hear the word of God.”
  footnotes:
  - marker: a
    text: Or 'Tell the servant to go on ahead of us.' The Hebrew נַעַר can refer to a young man, attendant, or servant.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'stand now/as at this time'; the expression is idiomatic, meaning to stop and remain for the moment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 성읍 끝으로 내려갈 때에 사무엘이 사울에게 말했습니다. “그 젊은이[a]에게 우리보다 앞서 가라고 말하십시오.” 그러자 그가 앞서 갔습니다. “그러나 당신은 지금[b] 여기 서 있으십시오. 내가 하나님의 말씀을 당신에게 들려드리겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נַעַר는 문맥에 따라 ‘소년’, ‘젊은이’, ‘시종’, ‘종’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지금’에 해당하는 히브리어 표현은 관용적이어서, 여기서는 ‘잠시 멈추어 서 있으라’는 뜻으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה יֹורְדִים בִּקְצֵה הָעִיר
  english_pob_choice: As they were going down to the edge of the city
  chosen_korean: 그들이 성읍 끝으로 내려갈 때에
  alternatives_korean:
  - 그들이 성읍 가장자리로 내려갈 때에
  - 그들이 도시의 끝으로 내려갈 때에
  lexicon: HALOT
  rationale: 진행 중인 동작을 나타내는 분사와 ‘성읍 끝/가장자리’의 공간적 의미를 자연스럽게 살렸습니다.
- source_word: נַעַר
  english_pob_choice: the young man
  chosen_korean: 그 소년
  alternatives_korean:
  - 그 젊은이
  - 그 종
  - 그 시종
  lexicon: HALOT
  rationale: 문맥상 동행한 하인이지만, 히브리어가 지닌 넓은 의미 범위를 살려 ‘소년’으로 옮겼습니다. POB의 ‘young man’에 해당하는 직역적 선택입니다.
- source_word: עֲמֹד כַּיּוֹם
  english_pob_choice: stand here now
  chosen_korean: 지금 여기 서 있으십시오
  alternatives_korean:
  - 지금 서 있으십시오
  - 지금은 여기서 멈추십시오
  - 당분간 여기 서 있으십시오
  lexicon: HALOT
  rationale: 관용적 표현을 그대로 번역하면 부자연스러워서, 명령의 실제 뜻인 ‘잠시 멈추어 서다’를 현대 한국어로 풀어 옮겼습니다.
- source_word: וְאַשְׁמִיעֲךָ אֶת דְּבַר אֱלֹהִים
  english_pob_choice: I will let you hear the word of God
  chosen_korean: 내가 하나님의 말씀을 당신에게 들려드리겠습니다
  alternatives_korean:
  - 내가 하나님의 말씀을 당신이 듣게 하겠습니다
  - 내가 하나님의 말씀을 당신에게 들려주겠습니다
  lexicon: HALOT
  rationale: 사역형 ‘듣게 하다’를 자연스럽게 살리면서, 예언적 선언의 무게를 ‘하나님의 말씀’으로 유지했습니다.
theological_decisions:
- issue: ‘하나님의 말씀’의 예언적 무게
  chosen_reading: 사무엘이 사울에게 곧 들려줄 것은 단순한 정보가 아니라 하나님의 말씀입니다.
  alternative_readings:
  - 하나님의 말
  - 하나님의 메시지
  rationale: דְּבַר אֱלֹהִים의 예언적·계시적 성격을 약화시키지 않기 위해, 한국어에서도 전통적으로도 널리 쓰이지만 여기서는 정확성을 위해 ‘말씀’을 유지했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological weight without paraphrase.'
