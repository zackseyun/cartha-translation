source:
  edition: WLC
  text: וַ/יִּקַּ֤ח שְׁמוּאֵל֙ אֶת שָׁא֣וּל וְ/אֶֽת נַעֲר֔/וֹ וַ/יְבִיאֵ֖/ם לִשְׁכָּ֑תָ/ה וַ/יִּתֵּ֨ן לָ/הֶ֤ם מָקוֹם֙ בְּ/רֹ֣אשׁ הַ/קְּרוּאִ֔ים וְ/הֵ֖מָּה כִּ/שְׁלֹשִׁ֥ים אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/022.yaml
  text: Then Samuel took Saul and his young man and brought them into the hall[a], and gave them a place at the head of those who had been invited[c][b]; and they were about thirty men.
  footnotes:
  - marker: a
    text: Or 'his servant' or 'his attendant' for 'his young man.'
    reason: lexical_alternative
  - marker: b
    text: Or 'into the chamber.' The Hebrew term can refer to a room or chamber, but here likely denotes a larger banquet space.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'and they were about thirty men,' likely referring to the invited guests present.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사무엘이 사울과 그의 수행원을 그 방으로 데리고 들어가서, 초청받은 이들의 윗자리에 앉혔습니다. 그 초청받은 이들은 남자 약 서른 명이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수행원’은 히브리어 나아르를 옮긴 말입니다. 문맥에 따라 ‘청년’, ‘종’, 또는 ‘시종’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 리슈카는 방, 실, 또는 전당을 가리킬 수 있습니다. 여기서는 더 큰 연회 공간을 뜻할 가능성이 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어로는 ‘그들은 약 서른 명의 남자들이었다’입니다. 문맥상 초청받은 이들의 수를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרוֹ
  english_pob_choice: his young man
  chosen_korean: 그의 청년
  alternatives_korean:
  - 그의 종
  - 그의 시종
  - 그의 하인
  lexicon: HALOT
  rationale: נַעַר는 문맥에 따라 ‘청년’, ‘종’, ‘시종’이 될 수 있는데, 이 장면에서는 사울을 수행하는 젊은 동행자를 가리키므로 ‘청년’이 본문 의미를 가장 무리 없이 살립니다.
- source_word: לִשְׁכָּתָה
  english_pob_choice: into the hall
  chosen_korean: 안으로
  alternatives_korean:
  - 전당으로
  - 방으로
  - 식당으로
  lexicon: HALOT
  rationale: לִשְׁכָּה는 ‘방’이나 ‘방실’이 될 수 있지만, 이 문맥에서는 식사 자리로 들어가는 동선을 강조하므로 ‘안으로 들여가서’로 자연스럽게 옮겼습니다.
- source_word: בְּרֹאשׁ הַקְּרוּאִים
  english_pob_choice: at the head of those who had been invited
  chosen_korean: 초청받은 사람들의 맨 앞자리에
  alternatives_korean:
  - 초청받은 사람들 앞쪽에
  - 초대받은 이들의 윗자리에
  - 초청객들의 으뜸자리에
  lexicon: HALOT
  rationale: ‘머리’라는 히브리어 관용은 명예의 우선 자리를 뜻하므로, 식탁 맥락에서 ‘맨 앞자리’가 가장 자연스럽고 의미를 보존합니다.
- source_word: וְהֵמָּה כִּשְׁלֹשִׁים אִישׁ
  english_pob_choice: and they were about thirty men
  chosen_korean: 그들은 약 서른 명쯤이었습니다
  alternatives_korean:
  - 거기에는 약 서른 명이 있었습니다
  - 그들은 서른 명가량이었습니다
  - 그리고 그들은 대략 서른 명이었습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘그들은’은 앞서 말한 초청받은 무리를 가리키므로, 인원을 자연스럽게 풀어 ‘약 서른 명쯤이었습니다’로 옮겼습니다.
