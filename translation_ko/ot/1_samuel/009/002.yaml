base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/002.yaml
  text: And he had a son whose name was Saul[a], a young man and handsome. There was not a man among the sons of Israel more handsome than he[b]; from his shoulders upward he was taller than all the people.
  footnotes:
  - marker: a
    text: Or 'There was no man among the Israelites more good-looking than he.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'among the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게는 사울이라는 아들이 있었는데, 그는 젊은 남자였고 잘생겼습니다. 이스라엘 자손 가운데 그보다 더 잘생긴 사람은 없었고, 그는 어깨 위부터 모든 백성보다 더 컸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘의 아들들’이라는 집합 표현을 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: בֵן
  english_pob_choice: son
  chosen_korean: 아들
  alternatives_korean:
  - 아들자식
  - 아들아이
  lexicon: HALOT
  rationale: 가족 관계를 가장 직접적으로 나타내는 기본 대응은 ‘아들’입니다.
- source_word: בָּחוּר
  english_pob_choice: young man
  chosen_korean: 젊은 남자
  alternatives_korean:
  - 청년
  - 젊은이
  lexicon: HALOT
  rationale: 문맥상 연령과 성숙도를 함께 보이므로, 단순한 호칭보다 서술형인 ‘젊은 남자’가 더 정확합니다.
- source_word: טוֹב / וָטוֹב
  english_pob_choice: handsome
  chosen_korean: 잘생겼습니다
  alternatives_korean:
  - 보기 좋았습니다
  - 준수했습니다
  - 잘났습니다
  lexicon: HALOT
  rationale: 여기서 טוֹב는 도덕적 ‘선함’이 아니라 외모의 아름다움을 가리키므로, 한국어에서는 외모 묘사로 분명한 ‘잘생겼습니다’를 택했습니다.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  english_pob_choice: among the sons of Israel
  chosen_korean: 이스라엘 자손 가운데
  alternatives_korean:
  - 이스라엘 사람들 가운데
  - 이스라엘의 아들들 가운데
  lexicon: HALOT
  rationale: 히브리어의 집합 표현을 살리기 위해 ‘이스라엘 자손’으로 옮겼고, 영어 주석이 지적한 범위 표지도 반영했습니다.
- source_word: מִשִּׁכְמוֹ וָמַעְלָה
  english_pob_choice: from his shoulders upward
  chosen_korean: 어깨 위부터
  alternatives_korean:
  - 어깨부터 위로
  - 어깨 위쪽부터
  lexicon: HALOT
  rationale: 어깨 높이 이상을 가리키는 관용구이므로, 한국어에서도 자연스러운 신체 기준 표현으로 옮겼습니다.
- source_word: גָּבֹהַּ
  english_pob_choice: taller
  chosen_korean: 더 컸습니다
  alternatives_korean:
  - 더 키가 컸습니다
  - 더 컸습니다만
  lexicon: HALOT
  rationale: 신체 비교의 뜻을 살리되, 한국어에서는 ‘키가 크다’의 함의를 가진 ‘더 컸습니다’가 가장 간결합니다.
theological_decisions:
- issue: 외모 묘사에서 טוֹב의 의미
  chosen_reading: 사울의 탁월함을 외모 중심으로 드러내는 묘사로 이해했습니다.
  alternative_readings:
  - ‘좋았다’로 넓게 번역하여 성품까지 암시하는 읽기
  - ‘아름다웠다’로 문학적 표현을 강화하는 읽기
  rationale: 이어지는 비교문이 외모와 체격을 함께 설명하므로, כאן의 טוֹב는 도덕적 선함보다 신체적 매력을 가리키는 것으로 읽는 것이 문맥에 가장 잘 맞습니다.
  doctrine_reference: 본문 주해/문맥 우선 원칙
- issue: ‘어깨 위부터 모든 백성보다 더 컸습니다’의 비교 방식
  chosen_reading: 직접적인 신체 비교로 유지해, 사울의 왕적 외형을 독자가 바로 이해하도록 했습니다.
  alternative_readings:
  - ‘모든 백성보다 키가 컸습니다’로 명시화하는 읽기
  - ‘모든 사람보다 우뚝했습니다’로 비유화하는 읽기
  rationale: 히브리어 관용구와 뒤이은 비교를 그대로 살리는 편이 사울의 체격 묘사를 가장 선명하게 전달합니다.
  doctrine_reference: 본문 직역-의미 균형 원칙
