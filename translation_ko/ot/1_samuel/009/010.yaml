  rationale: 본문은 기능적 설명보다 칭호 자체를 사용하므로, 독자가 이 인물의 신적 권위를 본문 언어로 인식하도록 직역을 유지했습니다.
  doctrine_reference: 원문 우선 번역 원칙; 예언자 칭호의 서술적 설명을 본문에 과도하게 주입하지 않음.
