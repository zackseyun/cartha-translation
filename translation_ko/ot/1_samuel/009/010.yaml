  yaml_path: translation/ot/1_samuel/009/010.yaml
  text: Then Saul said to his young man[a], “Your word is good. Come[b], let us go.” So they went to the city where the man of God was.
  footnotes:
  - marker: a
    text: Or “Your word is good,” that is, “What you say is good.”
    reason: lexical_alternative
  - marker: b
    text: “Man of God” is a Hebrew title commonly used for a prophet or one who speaks for God.
    reason: cultural_note
translation:
  language: ko
  text: 그때 사울이 자기 종에게 말했습니다. “네 말이 좋구나. 가자, 우리가 가자.” 그래서 그들은 하나님 사람[a]이 있는 그 성읍으로 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나님의 사람’은 히브리어에서 예언자나 하나님을 대신해 말하는 사람에게 흔히 붙는 칭호입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לְנַעֲרוֹ / נַעַר
  english_pob_choice: young man
  chosen_korean: 종
  alternatives_korean:
  - 젊은이
  - 시종
  - 수종
  lexicon: HALOT
  rationale: 이 문맥에서 사울에게 딸린 동행자를 가리키므로, 한국어에서는 단순 연령보다 종속 관계가 드러나는 ‘종’이 가장 자연스럽고 본문 기능도 잘 살립니다.
- source_word: טוֹב דְּבָרְךָ
  english_pob_choice: Your word is good
  chosen_korean: 네 말이 좋구나
  alternatives_korean:
  - 네 말이 좋다
  - 네 제안이 좋구나
  - 네 말이 옳구나
  lexicon: HALOT
  rationale: דָּבָר는 ‘말/일/제안’의 범위를 가지며, 여기서는 앞선 제안을 승인하는 말이므로 ‘네 말’로 옮기되, 승인 어조는 한국어의 자연스러운 감탄형으로 살렸습니다.
- source_word: לְכָה נֵלֵכָה
  english_pob_choice: Come, let us go
  chosen_korean: 가자, 우리가 가자
  alternatives_korean:
  - 오라, 우리가 가자
  - 자, 가자
  - 가자
  lexicon: HALOT
  rationale: 히브리어의 권유·결심 결합 표현을 직역보다 한국어의 호소적 반복으로 살려, 함께 떠나자는 결의와 추진력을 드러냈습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님 사람
  - 하나님의 종
  - 선지자
  lexicon: HALOT
  rationale: 이 표현은 예언자에게 붙는 관용적 칭호이지만, 원문의 호칭을 그대로 살리기 위해 해석어 ‘선지자’ 대신 직역형을 택했습니다.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים의 칭호를 해석할지 직역할지
  chosen_reading: 하나님의 사람
  alternative_readings:
