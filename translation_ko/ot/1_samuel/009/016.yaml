source:
  edition: WLC
  text: כָּ/עֵ֣ת מָחָ֡ר אֶשְׁלַח֩ אֵלֶ֨י/ךָ אִ֜ישׁ מֵ/אֶ֣רֶץ בִּנְיָמִ֗ן וּ/מְשַׁחְתּ֤/וֹ לְ/נָגִיד֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הוֹשִׁ֥יעַ אֶת עַמִּ֖/י מִ/יַּ֣ד פְּלִשְׁתִּ֑ים כִּ֤י רָאִ֨יתִי֙ אֶת עַמִּ֔/י כִּ֛י בָּ֥אָה צַעֲקָת֖/וֹ אֵלָֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/016.yaml
  text: About this time tomorrow I will send to you a man from the land of Benjamin[a], and you shall anoint him as ruler over my people Israel. He will save my people from the hand of the Philistines, for I have seen my people[b], because their cry has come to me.
  footnotes:
  - marker: a
    text: 'Hebrew ''as nagid''; also possible: ''leader'' or traditionally ''prince.'' The term denotes one appointed to govern, not merely a ceremonial figure.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally 'his cry has come to me,' with a singular suffix referring to the collective noun 'my people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내일 이맘때쯤 내가 베냐민 땅에서 한 사람을 당신에게 보내겠습니다[a]. 그리고 그에게 기름을 부어 내 백성 이스라엘의 통치자로 세우십시오. 그가 블레셋 사람들의 손에서 내 백성을 구원할 것입니다. 이는 내가 내 백성을 보았고, 그들의 부르짖음이 내게 이르렀기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘as nagid’에 해당합니다. 여기서는 단순한 의전적 직함이 아니라, 다스리도록 임명된 자라는 뜻이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 부르짖음이 내게 이르렀다’입니다. 단수 접미사는 집합명사 ‘내 백성’을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת מָחָר
  english_pob_choice: About this time tomorrow
  chosen_korean: 내일 이맘때쯤
  alternatives_korean:
  - 내일 이 시간쯤
  - 내일쯤 이맘때
  lexicon: HALOT
  rationale: ‘כ + עֵת + מָחָר’의 시간 표현을 자연스러운 한국어로 옮기되, 약 24시간 뒤의 시점을 드러내는 ‘이맘때쯤’으로 근접성을 살렸습니다.
- source_word: מֵאֶרֶץ בִּנְיָמִן
  english_pob_choice: from the land of Benjamin
  chosen_korean: 베냐민 땅에서
  alternatives_korean:
  - 베냐민 지역에서
  - 베냐민의 영토에서
  lexicon: HALOT
  rationale: אֶרֶץ의 지리적 의미를 살리면서도 한국어에서 가장 자연스러운 지명 표현으로 옮겼습니다.
- source_word: לְנָגִיד
  english_pob_choice: as ruler
  chosen_korean: 통치자로
  alternatives_korean:
  - 지도자로
  - 군주로
  lexicon: HALOT
  rationale: נָגִיד는 단순한 명예직이 아니라 다스리는 자를 가리키므로, ‘통치자’로 옮겨 왕적 권위를 완전히 동일시하지 않으면서도 शासन적 기능을 분명히 했습니다.
- source_word: מִיַּד פְּלִשְׁתִּים
  english_pob_choice: from the hand of the Philistines
  chosen_korean: 블레셋 사람들의 손에서
  alternatives_korean:
  - 블레셋 사람들의 권세에서
  - 블레셋 사람들의 힘에서
  lexicon: HALOT
  rationale: ‘손’의 히브리어 관용구를 보존해 지배·압제의 이미지를 유지했습니다.
- source_word: צַעֲקָתוֹ
  english_pob_choice: their cry has come to me
  chosen_korean: 그들의 부르짖음
  alternatives_korean:
  - 그의 부르짖음
  - 그 백성의 부르짖음
  lexicon: HALOT
  rationale: 히브리어는 단수 접미사를 쓰지만 집합명사 ‘내 백성’을 가리키는 것이므로, 한국어에서는 의미를 분명히 하는 복수적 집합 표현을 택했습니다.
theological_decisions:
- issue: 사울의 직무를 나타내는 נָגִיד의 번역
  chosen_reading: 통치자
  alternative_readings:
  - 지도자
  - 군주
  rationale: 본문은 사울을 이스라엘 위에 세워질 하나님의 지명된 शासन자로 제시하므로, 전통적 ‘왕자’보다 기능이 분명한 ‘통치자’가 본문 의미를 더 직접적으로 드러냅니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 히브리어 단수 접미사의 집합적 지시
  chosen_reading: 그들의 부르짖음
  alternative_readings:
  - 그의 부르짖음
  rationale: 문법상 단수라도 지시 대상은 집합명사 ‘내 백성’이므로, 한국어 독자에게는 공동체의 탄원을 드러내는 복수 표현이 가장 명확합니다.
  doctrine_reference: Translation philosophy §6
