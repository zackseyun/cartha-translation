  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. 다만 לְנָגִיד(‘통치자로’)를 설명하는 각주 a가 ‘보내겠습니다’ 뒤에 붙어 있어 해당 어휘의 위치와 맞지 않습니다. 이를 ‘통치자로 세우십시오’ 뒤로 옮겨야 합니다. 마지막 두 כִּי 절은 하나님의 백성을 보심과 그들의 부르짖음이 하나님께 이른 사실을 이유로 제시하므로, 한국어 문장도 이 인과 관계를 더 분명하고 자연스럽게 나타내는 편이 좋습니다.
  naturalness: ‘당신에게’는 현대 한국어에서 하나님이 사무엘에게 하는 말씀의 호칭으로 다소 부자연스럽거나 불필요하게 대립적인 뉘앙스를 낼 수 있어 ‘그대에게’로 다듬었습니다. 또한 ‘이는 내가 내 백성을 보았고, ... 때문입니다’는 접속과 인과가 매끄럽지 않아 문장을 정리했습니다.
  terminology: ‘베냐민’, ‘기름을 부어’, ‘통치자’, ‘블레셋 사람들의 손에서’, ‘구원’은 원문의 의미와 현대적 정중 문체에 적절합니다. 각주는 영어 음역 ‘as nagid’ 대신 원문 표기 לְנָגִיד 및 한국어 의미를 제시하도록 고쳤습니다.
