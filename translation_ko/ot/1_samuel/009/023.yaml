  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ לַ/טַּבָּ֔ח תְּנָ/ה֙ אֶת הַ/מָּנָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לָ֑/ךְ אֲשֶׁר֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ שִׂ֥ים אֹתָ֖/הּ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/023.yaml
  text: Then Samuel said to the cook[a], “Bring the portion that I gave you, of which I said to you, ‘Set it aside with you.’”
  footnotes:
  - marker: a
    text: Or “Give the portion … keep it with you.” The Hebrew wording is more literally, “Give the portion that I gave you, which I said to you, ‘Put it with you.’”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사무엘이 요리사에게 말했습니다. “내가 네게 준 몫을 가져오십시오. 곧 내가 네게 말한 것, ‘그것을 네 곁에 두십시오’ 하는 그 몫입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 몫을 내십시오 … 가지고 계십시오.” 히브리어는 더 문자적으로 “내가 네게 준 그 몫, 곧 내가 네게 말하기를 ‘그것을 네 곁에 두라’ 한 것”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַ/טַּבָּח
  english_pob_choice: cook
  chosen_korean: 요리사
  alternatives_korean:
  - 주방장
  - 요리하는 사람
  lexicon: HALOT
  rationale: 잔치 자리에서 음식을 준비하는 사람을 가리키므로, 현대 한국어에서는 ‘요리사’가 가장 자연스럽고 기능도 잘 드러냅니다.
- source_word: תְּנָ/ה
  english_pob_choice: Bring
  chosen_korean: 가져오십시오
  alternatives_korean:
  - 내십시오
  - 주십시오
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘주다’이지만, 문맥상 사무엘이 따로 떼어 둔 몫을 가져오라고 지시하는 뜻이므로 ‘가져오십시오’가 자연스럽습니다.
- source_word: הַ/מָּנָ֔ה
  english_pob_choice: portion
  chosen_korean: 몫
  alternatives_korean:
  - 부분
  - 한 접시 몫
  - 배당된 몫
  lexicon: HALOT
  rationale: 식사에서 지정된 분량을 뜻하므로, 단순한 ‘부분’보다 배정된 식사 몫을 잘 살리는 ‘몫’이 적절합니다.
- source_word: שִׂ֥ים אֹתָ֖/הּ עִמָּֽ/ךְ
  english_pob_choice: Set it aside with you
  chosen_korean: 네 곁에 두십시오
  alternatives_korean:
  - 네 곁에 보관하십시오
  - 너와 함께 두십시오
  - 너와 같이 두십시오
  lexicon: HALOT
  rationale: 직역하면 ‘너와 함께 두다’이지만, 여기서는 나중을 위해 따로 보관해 두라는 뜻이므로 ‘네 곁에 두십시오’가 한국어로 더 분명합니다.
