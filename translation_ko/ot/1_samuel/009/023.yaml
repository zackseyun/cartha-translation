  text: Then Samuel said to the cook[a], “Bring the portion that I gave you, of which I said to you, ‘Set it aside with you.’”
  footnotes:
  - marker: a
    text: Or “Give the portion … keep it with you.” The Hebrew wording is more literally, “Give the portion that I gave you, which I said to you, ‘Put it with you.’”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사무엘이 요리사에게 말했습니다. “내가 당신에게 준, 또 당신에게 ‘그것을 곁에 두어 보관하십시오’라고 말한 그 몫을 가져오십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 몫을 내십시오 … 당신 곁에 두어 보관하십시오.” 히브리어는 더 문자적으로 “내가 당신에게 준 그 몫, 곧 내가 당신에게 ‘그것을 당신과 함께 두십시오’라고 말한 것을 주십시오”입니다.
    reason: lexical_alternative
