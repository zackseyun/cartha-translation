  text: וַ/יֹּ֤סֶף הַ/נַּ֨עַר֙ לַ/עֲנ֣וֹת אֶת שָׁא֔וּל וַ/יֹּ֕אמֶר הִנֵּה֙ נִמְצָ֣א בְ/יָדִ֔/י רֶ֖בַע שֶׁ֣קֶל כָּ֑סֶף וְ/נָֽתַתִּי֙ לְ/אִ֣ישׁ הָ/אֱלֹהִ֔ים וְ/הִגִּ֥יד לָ֖/נוּ אֶת דַּרְכֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/008.yaml
  text: The young man answered Saul again and said[a], “Look, I have in my hand a quarter shekel of silver. I will give it to the man of God, and he will tell us our way.”
  footnotes:
  - marker: a
    text: Or “the way we should go.” The Hebrew literally says “our way,” which can refer to the route ahead or the course of action to take.
    reason: lexical_alternative
translation:
  language: ko
  text: 젊은이가 다시 사울에게 대답하여 말했습니다. 「보십시오, 제 손에 은 사분의 일 세겔이 있습니다. 제가 하나님의 사람에게 드리겠습니다. 그러면 그가 우리의 길을 알려 줄 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리가 가야 할 길.” 히브리어는 문자적으로 “우리의 길”이라고 하며, 앞길의 경로나 취해야 할 행동 방향을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף ... לַעֲנוֹת
  english_pob_choice: answered ... again
  chosen_korean: 다시 대답하며
  alternatives_korean:
  - 계속 대답하며
  - 대답을 덧붙이며
  lexicon: HALOT
  rationale: יסף + infinitive는 ‘다시/계속’의 반복 동작을 나타내므로, 문맥상 자연스러운 ‘다시 대답하며’로 옮겨 반복성을 살렸습니다.
- source_word: הַנַּעַר
  english_pob_choice: the young man
  chosen_korean: 젊은이
  alternatives_korean:
  - 소년
  - 시종
  - 청년
  lexicon: HALOT
  rationale: נער는 문맥에 따라 시종도 될 수 있지만, 여기서는 사울에게 조언하고 돈을 지닌 인물로서 연령과 역할을 함께 열어 두는 ‘젊은이’가 가장 무난합니다.
- source_word: רֶבַע שֶׁקֶל כָּסֶף
  english_pob_choice: a quarter shekel of silver
  chosen_korean: 은 1/4세겔
  alternatives_korean:
  - 은 한 사분의 일 세겔
  - 은 사분의 일 세겔
  lexicon: HALOT
  rationale: 측정·화폐 표현을 한국어 독자에게 간결하게 전달하기 위해 ‘은 1/4세겔’로 옮겼습니다. ‘은’은 כסף의 재질과 통화 가치를 함께 드러냅니다.
- source_word: לְאִישׁ הָאֱלֹהִים
  english_pob_choice: to the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님께 속한 사람
  - 하나님의 사람에게
  lexicon: HALOT
  rationale: 이 표현은 예언자적 위임을 가리키는 관용구이므로, 전통적이면서도 직역에 가까운 ‘하나님의 사람’을 유지했습니다.
- source_word: וְהִגִּיד לָנוּ אֶת דַּרְכֵּנוּ
  english_pob_choice: and he will tell us our way
  chosen_korean: 그가 우리의 길을 알려 줄 것입니다
  alternatives_korean:
  - 그가 우리의 길을 말해 줄 것입니다
  - 우리가 가야 할 길을 알려 줄 것입니다
  lexicon: HALOT
  rationale: נגד Hiphil은 ‘알리다/말해 주다’의 뜻이므로 자연스러운 한국어로 풀되, ‘우리의 길’의 직역감을 유지했습니다. 본문이 지시하는 진로와 행동의 방향을 모두 포괄합니다.
