source:
  edition: WLC
  text: וַ/יַּעֲבֹ֧ר בְּ/הַר אֶפְרַ֛יִם וַ/יַּעֲבֹ֥ר בְּ/אֶֽרֶץ שָׁלִ֖שָׁה וְ/לֹ֣א מָצָ֑אוּ וַ/יַּעַבְר֤וּ בְ/אֶֽרֶץ שַׁעֲלִים֙ וָ/אַ֔יִן וַ/יַּעֲבֹ֥ר בְּ/אֶֽרֶץ יְמִינִ֖י וְ/לֹ֥א מָצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/004.yaml
  text: He passed through the hill country of Ephraim and passed through the land of Shalishah[a], but they did not find them. Then they passed through the land of Shaalim, but they were not there. Then he passed through the land of Benjamin[b], but they did not find them.
  footnotes:
  - marker: a
    text: 'Hebrew: ''did not find them''; the object ''them'' refers to the lost donkeys from the preceding context.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''and there was not'' or ''and there was nothing,'' an elliptical expression meaning the donkeys were not there.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 에브라임 산지와 살리사 땅을 지나갔지만 그들을 찾지 못했습니다. 그리고 그들은 사알림 땅을 지나갔지만 거기에는 없었습니다. 그리고 그는 베냐민 땅을 지났지만 그들을 찾지 못했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그들을 찾지 못했다’라고만 말하지만, 문맥상 대상은 앞선 이야기의 잃어버린 암나귀들입니다.
    reason: source_note
  - marker: b
    text: 히브리어의 ‘없었다’는 여기서 생략된 대상이 그곳에 없었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר / וַיַּעַבְרוּ
  english_pob_choice: passed through
  chosen_korean: 지나갔습니다
  alternatives_korean:
  - 통과했습니다
  - 지나쳤습니다
  - 건너갔습니다
  lexicon: HALOT
  rationale: בְ가 붙은 עבר는 지역을 가로질러 이동하는 뜻이므로, 현대 한국어에서는 자연스럽고 간결한 ‘지나가다’가 가장 잘 맞습니다.
- source_word: בְּהַר אֶפְרַיִם
  english_pob_choice: the hill country of Ephraim
  chosen_korean: 에브라임 산지
  alternatives_korean:
  - 에브라임의 구릉지
  - 에브라임의 산지
  - 에브라임 산악지대
  lexicon: HALOT
  rationale: 지역명 표현에서 הַר는 단일 산보다 ‘산지/구릉지’의 의미가 자연스럽기 때문에, 지리적 관용을 살려 ‘에브라임 산지’로 옮겼습니다.
- source_word: אֶרֶץ שָׁלִשָׁה
  english_pob_choice: the land of Shalishah
  chosen_korean: 살리사 땅
  alternatives_korean:
  - 살리사 지역
  - 살리사의 땅
  lexicon: HALOT
  rationale: אֶרֶץ는 כאן 특정 지명에 붙은 영역 표현이므로, 정확한 정치적 범주를 덧붙이지 않고 지명성을 살린 ‘살리사 땅’이 가장 적절합니다.
- source_word: וְלֹא מָצָאוּ
  english_pob_choice: but they did not find them
  chosen_korean: 그들을 찾지 못했습니다
  alternatives_korean:
  - 그것들을 찾지 못했습니다
  - 그들을 발견하지 못했습니다
  lexicon: HALOT
  rationale: 문맥상 대상은 앞선 구절의 잃어버린 암나귀들이므로 한국어에서는 반복되는 대상을 자연스럽게 받는 대명사 ‘그들’로 옮겼습니다.
- source_word: וָאַיִן
  english_pob_choice: but they were not there
  chosen_korean: 거기에는 없었습니다
  alternatives_korean:
  - 없었습니다
  - 거기엔 아무것도 없었습니다
  - 그곳에는 없었습니다
  lexicon: HALOT
  rationale: 히브리어는 축약적으로 ‘없음’을 말하지만, 문맥상 찾는 대상이 그곳에 없다는 뜻이므로 ‘거기에는 없었습니다’로 풀어 자연스럽게 전달했습니다.
- source_word: אֶרֶץ יְמִינִי
  english_pob_choice: the land of Benjamin
  chosen_korean: 베냐민 땅
  alternatives_korean:
  - 베냐민 지역
  - 베냐민의 땅
  lexicon: HALOT
  rationale: יְמִינִי는 베냐민을 가리키는 지명 형용사이므로, 성경 지명 관용을 따라 ‘베냐민 땅’으로 옮겼습니다.
theological_decisions:
- issue: 반복되는 서술 구조와 마지막 열거의 연결
  chosen_reading: 마지막 절도 앞선 절들과 같은 서술 흐름을 유지해 ‘그리고’로 연결했습니다.
  alternative_readings:
  - 마지막 절을 단순히 이어서 번역하기
  - ‘그런데’로 전환하기
  rationale: 히브리어의 연속 동사열은 탐색의 진행을 차례대로 보여 주므로, 반복성을 살려 독자가 이동 경로를 따라가도록 했습니다.
  doctrine_reference: 내러티브 문체와 서술 흐름
