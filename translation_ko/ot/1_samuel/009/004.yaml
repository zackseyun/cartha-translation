base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/004.yaml
  text: He passed through the hill country of Ephraim and passed through the land of Shalishah[a], but they did not find them. Then they passed through the land of Shaalim, but they were not there. Then he passed through the land of Benjamin[b], but they did not find them.
  footnotes:
  - marker: a
    text: 'Hebrew: ''did not find them''; the object ''them'' refers to the lost donkeys from the preceding context.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''and there was not'' or ''and there was nothing,'' an elliptical expression meaning the donkeys were not there.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 에브라임 산지를 지나 살리사 땅을 지나갔으나, 그들은 암나귀들을 찾지 못했습니다.[a] 그들은 사알림 땅을 지나갔으나, 찾던 암나귀들은 그곳에 없었습니다.[b] 그리고 그는 베냐민 땅을 지나갔으나, 그들은 암나귀들을 찾지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그들을 찾지 못했다’라고만 말합니다. 문맥상 생략된 대상은 앞 절의 잃어버린 암나귀들입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 직역하면 ‘없었다’ 또는 ‘아무것도 없었다’라고 말합니다. 문맥상 찾던 암나귀들이 그곳에 없었다는 뜻입니다.
    reason: lexical_alternative
