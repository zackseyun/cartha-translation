  text: כְּ/בֹאֲ/כֶ֣ם הָ/עִ֣יר כֵּ֣ן תִּמְצְא֣וּ/ן אֹת֡/וֹ בְּ/טֶרֶם֩ יַעֲלֶ֨ה הַ/בָּמָ֜תָ/ה לֶ/אֱכֹ֗ל כִּ֠י לֹֽא יֹאכַ֤ל הָ/עָם֙ עַד בֹּא֔/וֹ כִּֽי הוּא֙ יְבָרֵ֣ךְ הַ/זֶּ֔בַח אַחֲרֵי כֵ֖ן יֹאכְל֣וּ הַ/קְּרֻאִ֑ים וְ/עַתָּ֣ה עֲל֔וּ כִּֽי אֹת֥/וֹ כְ/הַ/יּ֖וֹם תִּמְצְא֥וּ/ן אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/013.yaml
  text: As soon as you enter the city[a], you will find him, before he goes up to the high place to eat. For the people will not eat until he comes, because he is the one who blesses the sacrifice; afterward those who are invited eat. So go up now[c][b], for today you will find him.
  footnotes:
  - marker: a
    text: Or 'at this time' for 'today' (Hebrew כְהַיּוֹם), emphasizing immediacy rather than the calendar day as such.
    reason: lexical_alternative
  - marker: b
    text: '''High place'' refers to an elevated worship site where sacrificial meals were held.'
    reason: cultural_note
  - marker: c
    text: '''Blesses the sacrifice'' likely means pronouncing the blessing associated with the sacrificial meal before the invited participants eat.'
    reason: cultural_note
translation:
  language: ko
  text: 성읍에 들어가시면, 그가 먹으려고 높은 곳[b]에 올라가기 전에 곧 그를 찾을 것입니다. 백성은 그가 올 때까지 먹지 않습니다. 그가 제사를 축복하기 때문이며, 그 뒤에야 초대받은 사람들이 먹습니다. 그러니 지금 올라가십시오. 오늘[a] 그를 찾을 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오늘’(히브리어 כְהַיּוֹם)은 달력상의 이날을 뜻할 수도 있고, ‘바로 이때’라는 즉시성을 강조할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘높은 곳’은 제사 식사가 열리던 높은 지대의 예배 장소를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: ‘제사를 축복하다’는 제사 식사 전에 관련 축복을 선언하는 일을 가리킬 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: כְּבֹאֲכֶם הָעִיר
  english_pob_choice: As soon as you enter the city
  chosen_korean: 성에 들어가자마자
  alternatives_korean:
  - 도시에 들어가면
  - 성읍에 들어가면
  lexicon: HALOT
  rationale: כְּ + בוא의 시간적 용법을 즉각성 있게 살려, 단순 조건문보다 ‘-자마자’가 본문의 긴박한 예고를 더 잘 드러냅니다.
- source_word: הַבָּמָתָה
  english_pob_choice: to the high place
  chosen_korean: 높은 곳으로
  alternatives_korean:
  - 산당으로
  - 고지로
  lexicon: HALOT
  rationale: בָּמָה의 기본 뜻인 ‘높은 곳’을 직접 살리되, 한국어에서 종교적 문맥을 과도하게 고정하는 ‘산당’보다 원문에 더 가까운 표현을 택했습니다.
- source_word: יְבָרֵךְ הַזֶּבַח
  english_pob_choice: he is the one who blesses the sacrifice
  chosen_korean: 그는 제사를 축복하는 사람이며
  alternatives_korean:
  - 그는 제사 위에 축복을 선포하는 사람이며
  - 그는 제사를 축복합니다
  lexicon: HALOT
  rationale: ברך는 여기서 제사 음식 자리에서의 축복 선언을 가리키는 것으로 보이므로, ‘축복하는 사람’으로 옮겨 그 기능을 드러냈습니다.
- source_word: הַקְּרֻאִים
  english_pob_choice: those who are invited
  chosen_korean: 초대받은 사람들이
  alternatives_korean:
  - 부름받은 사람들이
  - 초대된 이들이
  lexicon: HALOT
  rationale: 수동 분사 קרא의 의미를 자연스럽게 살려 ‘초대받은 사람들’로 옮겼습니다. 문맥상 손님이지만, 원문이 말하는 ‘초대된 자들’이라는 사실을 유지합니다.
- source_word: וְעַתָּה עֲלוּ
  english_pob_choice: So go up now
  chosen_korean: 그러니 지금 올라가십시오
  alternatives_korean:
  - 이제 올라가십시오
  - 그러므로 올라가십시오
  lexicon: HALOT
  rationale: וְעַתָּה의 권고·전환 기능을 ‘그러니’로 살리고, העלה는 직역에 가깝게 ‘올라가다’를 유지했습니다.
- source_word: כִּי אֹתוֹ כְהַיּוֹם תִּמְצְאוּן אֹתוֹ
  english_pob_choice: for today you will find him
  chosen_korean: 오늘 그를 찾게 될 것입니다
  alternatives_korean:
  - 지금 그를 찾게 될 것입니다
  - 오늘 이 시각 그를 찾게 될 것입니다
  lexicon: HALOT
  rationale: כְהַיּוֹם의 관용적 시간표현을 한국어의 자연스러운 ‘오늘’로 옮기되, 예언적 확실성을 ‘찾게 될 것입니다’로 표현했습니다.
theological_decisions:
- issue: ‘high place’의 종교문화적 지시
  chosen_reading: 본문에는 예배와 제사 식사가 이루어지는 ‘높은 곳’이라는 기능적 표현만 두고, 해설은 본문 바깥으로 두었습니다.
  alternative_readings:
  - 산당으로
  - 제의적 언덕으로
  rationale: 원문 במה는 이 장면에서 특정 제도 용어보다 지리·예배 기능을 함께 가지므로, 본문 번역은 과도한 해석어를 피하는 쪽이 더 안전합니다.
  doctrine_reference: 1 Sam 9:12-14 서술 맥락
- issue: 제사 전 ‘축복’ 행위의 의미
  chosen_reading: ‘제사를 축복하는 사람’으로 두어, 단순 음식 축복이 아니라 제사 식사의 개시를 선포하는 기능을 암시했습니다.
  alternative_readings:
  - 제사 위에 축복을 선언하는 사람
  - 제사에 복을 빕니다
  rationale: POB의 설명처럼 이 동사는 제사 식사 전의 축복 선언을 가리킬 가능성이 크므로, 그 기능을 보이면서도 해석을 과하게 확정하지 않도록 처리했습니다.
  doctrine_reference: 사무엘상 9:13 문맥 주해
