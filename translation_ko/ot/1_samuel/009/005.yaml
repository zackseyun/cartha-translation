  to: 그들이 수프 땅에 이르자, 사울이 자기와 함께 있던 젊은이에게 말했습니다. “자, 돌아가자. 아버지께서 나귀들은 더는 걱정하지 않으시고[a] 우리를 걱정하실까 합니다[b].”
  rationale: 나귀들에 대한 걱정을 그치고 사람들을 걱정하게 될 수 있다는 원문의 대비와 פֶּן의 우려를 유지했습니다. 현대 표준 한국어와 합쇼체에 맞게 표현을 다듬고, 각주를 실제로 설명하는 구절에 연결했습니다.
