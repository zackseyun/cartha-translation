source:
  edition: WLC
  text: הֵ֗מָּה בָּ֚אוּ בְּ/אֶ֣רֶץ צ֔וּף וְ/שָׁא֥וּל אָמַ֛ר לְ/נַעֲר֥/וֹ אֲשֶׁר עִמּ֖/וֹ לְכָ֣/ה וְ/נָשׁ֑וּבָה פֶּן יֶחְדַּ֥ל אָבִ֛/י מִן הָ/אֲתֹנ֖וֹת וְ/דָ֥אַג לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/005.yaml
  text: When they came into the land of Zuph[a], Saul said to his young man who was with him, “Come, let us return[b], lest my father stop caring about the donkeys and become anxious about us.”
  footnotes:
  - marker: a
    text: Or “stop worrying about the donkeys.” The Hebrew says “stop/cease from the donkeys,” an idiom meaning to cease being occupied with them.
    reason: lexical_alternative
  - marker: b
    text: Or “be concerned for us.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 수프 땅에 이르자 사울이 함께 있던 자기의 소년에게 말했습니다. “가자, 우리가 돌아가자[a]. 내 아버지가 나귀들을 더는 걱정하지 않다가 우리를 염려하게 될까 합니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “돌아가자”보다 더 넓게 “되돌아가자”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “우리에게 신경을 쓰게 될까 합니다.” 히브리어는 ‘나귀들에서 그만하다’는 관용구로, 그것들에 대한 관심이 멈추는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ בְּאֶרֶץ צ֔וּף
  english_pob_choice: came into the land of Zuph
  chosen_korean: 수프 땅에 이르자
  alternatives_korean:
  - 수프 땅으로 들어갔습니다
  - 수프 땅에 도착하자
  lexicon: HALOT
  rationale: בוא + ב는 장소에 ‘이르다/들어가다’의 흐름이지만, 서술 문맥에서는 ‘이르자’가 자연스럽고 이동의 완료를 잘 드러냅니다.
- source_word: נַעַר
  english_pob_choice: young man
  chosen_korean: 소년
  alternatives_korean:
  - 젊은이
  - 시종
  - 종
  lexicon: HALOT
  rationale: 여기서는 동행한 젊은 수행자를 가리키므로, ‘소년’이 본문의 관계와 사회적 뉘앙스를 무리 없이 살립니다.
- source_word: לְכָה וְנָשׁוּבָה
  english_pob_choice: Come, let us return
  chosen_korean: 가자, 우리가 돌아가자
  alternatives_korean:
  - 오너라, 우리가 돌아가자
  - 가서 돌아가자
  lexicon: HALOT
  rationale: 명령형과 청유형의 호소력을 살리기 위해 직역에 가깝게 ‘가자, 우리가 돌아가자’로 옮겼습니다.
- source_word: יֶחְדַּל ... וְדָאַג לָנוּ
  english_pob_choice: lest my father stop caring about the donkeys and become anxious about us
  chosen_korean: 내 아버지가 나귀들을 더는 걱정하지 않다가 우리를 염려하게 될까 합니다
  alternatives_korean:
  - 내 아버지가 나귀들을 그만 걱정하고 우리를 걱정하게 될까 합니다
  - 내 아버지가 나귀들을 더는 신경 쓰지 않다가 우리를 걱정하게 될까 합니다
  lexicon: HALOT
  rationale: חדל은 ‘그만하다/더는 …하지 않다’의 흐름으로, דאג는 ‘염려하다’로 옮겨 두 대상에 대한 관심 이동을 드러냈습니다.
theological_decisions:
- issue: פֶּן의 경고 뉘앙스
  chosen_reading: ‘~할까 합니다’로 옮겨, 단순한 미래보다 우려를 동반한 경고의 어조를 살렸습니다.
  alternative_readings:
  - ‘혹시 …할까 하여’
  - ‘그렇지 않도록’
  rationale: פֶּן은 부정 목적/결과를 나타내므로, 사울의 조심스러운 우려를 한국어 경어체 안에서 자연스럽게 표현했습니다.
  doctrine_reference: 문법-화용 선택
