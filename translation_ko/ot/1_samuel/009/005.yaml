  - severity: medium
    issue: 각주 표지가 해당 어휘에 붙어 있지 않음
    rationale: 기존 a는 ‘돌아가자’에 붙었지만 각주 내용은 나귀들에 대한 관심을 그친다는 히브리어 관용구를 설명합니다. b도 문장 끝에 붙어 두 절 중 어느 부분의 대안인지 불명확합니다. 각주 표지를 해당 절에 옮겨야 합니다.
