id: 1SA.9.15
reference: 1 Samuel 9:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יהוָ֔ה גָּלָ֖ה אֶת אֹ֣זֶן שְׁמוּאֵ֑ל י֣וֹם אֶחָ֔ד לִ/פְנֵ֥י בֽוֹא שָׁא֖וּל לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/015.yaml
  text: Now Yahweh had revealed to Samuel one day before Saul came[a], saying,
  footnotes:
  - marker: a
    text: Hebrew literally, “had uncovered Samuel’s ear,” an idiom meaning to reveal or disclose something to him.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 사울이 오기 하루 전에 사무엘에게 미리 알려 주셨습니다. 이렇게 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 “사무엘의 귀를 열어 주셨다/드러내셨다”라는 관용구로, 그에게 어떤 내용을 알리셨다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  english_pob_choice: Now the LORD / Yahweh
  chosen_korean: 야훼께서는
  alternatives_korean:
  - 주께서는
  - 여호와께서는
  lexicon: WLC; project default YHWH
  rationale: 원문의 יהוה는 프로젝트 기본값에 따라 야훼로 옮기며, 서술 시작의 와우는 한국어에서 자연스러운 문맥 연결로 풀어 ‘께서는’으로 처리했습니다.
- source_word: גָּלָה אֶת־אֹזֶן
  english_pob_choice: had revealed to Samuel
  chosen_korean: 사무엘에게 미리 알려 주셨습니다
  alternatives_korean:
  - 사무엘의 귀를 열어 주셨습니다
  - 사무엘에게 드러내 주셨습니다
  lexicon: HALOT
  rationale: ‘귀를 벗기다/열다’의 관용구를 직역하기보다, 영어 POB가 보존한 의미에 따라 ‘알려 주다’로 옮겨 현대 한국어에서 분명하게 의미가 전달되게 했습니다.
- source_word: יוֹם אֶחָד לִפְנֵי בּוֹא שָׁאוּל
  english_pob_choice: one day before Saul came
  chosen_korean: 사울이 오기 하루 전에
  alternatives_korean:
  - 사울이 오기 한 날 전에
  - 사울이 오기 전 하루에
  lexicon: HALOT
  rationale: 시간 표현은 한국어에서 가장 자연스러운 ‘하루 전에’로 풀어, 원문의 ‘one day before’ 관계를 그대로 드러냈습니다.
theological_decisions:
- issue: 여호와/야훼 표기 선택
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 원문이 여호와의 이름 יהוה를 직접 사용하므로, 프로젝트 표준에 따라 인격적 언약 이름을 야훼로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: ‘말하다’보다 ‘알려 주다’ 선택
  chosen_reading: 미리 알려 주셨습니다
  alternative_readings:
  - 말씀하셨습니다
  - 드러내셨습니다
  rationale: 히브리어 관용구 גלה את־אוזן은 단순 발화보다 ‘비밀을 드러내어 알리다’는 뜻이므로, 서술의 핵심 의미를 살려 ‘알려 주다’로 옮겼습니다.
  doctrine_reference: WLC idiom גָּלָה אֶת־אֹזֶן
