    issue: 각주의 직역 표현
    rationale: גָּלָה는 기본적으로 ‘드러내다, 벗기다(uncover)’이며, ‘귀를 열다’는 한국어에서 의미상 이해되지만 원문의 직역으로는 덜 정확합니다. 관용적 의미 설명은 유지하되 직역을 정밀하게 고칩니다.
  revised_text: 야훼께서는 사울이 오기 하루 전에 사무엘에게 알려 주셨습니다. 이렇게 말씀하셨습니다.[a]
