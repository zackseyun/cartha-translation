source:
  edition: WLC
  text: וַ/יִּגַּ֥שׁ שָׁא֛וּל אֶת שְׁמוּאֵ֖ל בְּ/ת֣וֹךְ הַ/שָּׁ֑עַר וַ/יֹּ֨אמֶר֙ הַגִּֽידָ/ה נָּ֣א לִ֔/י אֵי זֶ֖ה בֵּ֥ית הָ/רֹאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/018.yaml
  text: Then Saul approached Samuel in the midst of the gate and said[b][a], “Please tell me where the seer’s house is.”
  footnotes:
  - marker: a
    text: Or, more formally, “the house of the seer.”
    reason: lexical_alternative
  - marker: b
    text: “Seer” is an older term for one later more commonly called a prophet; the narrative itself explains this in 1 Samuel 9:9.
    reason: cross_reference
translation:
  language: ko
  text: 그때 사울이 성문 한가운데에서 사무엘에게 다가가 말했습니다. 「제발 점쟁이의 집이 어디인지 알려 주십시오」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 형식적으로는 ‘점쟁이의 집’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘점쟁이’는 1사무엘 9:9에서 더 흔히 ‘예언자’로 불리게 되는 옛 호칭을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּגַּשׁ
  english_pob_choice: approached
  chosen_korean: 다가가
  alternatives_korean:
  - 다가왔습니다
  - 다가섰습니다
  lexicon: HALOT
  rationale: שׁגשׁ는 사람에게 가까이 다가가는 동작을 뜻하므로, 문맥상 자연스럽고 관계적 뉘앙스를 살리는 ‘다가가’로 옮겼습니다.
- source_word: בְּתוֹךְ הַשָּׁעַר
  english_pob_choice: in the midst of the gate
  chosen_korean: 성문 한가운데에서
  alternatives_korean:
  - 성문 안에서
  - 성문 가운데에서
  lexicon: HALOT
  rationale: 직역적인 ‘성문 한가운데’의 공간감을 살리되, 현대 한국어에서 어색하지 않도록 ‘에서’를 붙여 위치를 분명히 했습니다.
- source_word: הַגִּידָה נָּא לִי
  english_pob_choice: Please tell me
  chosen_korean: 제발 … 알려 주십시오
  alternatives_korean:
  - 부디 … 말씀해 주십시오
  - 제발 … 말해 주십시오
  lexicon: HALOT
  rationale: 명령형과 נָא의 공손한 요청을 함께 반영해, 합쇼체 요청문인 ‘알려 주십시오’로 옮겼습니다.
- source_word: בֵּית הָרֹאֶה
  english_pob_choice: the seer’s house
  chosen_korean: 점쟁이의 집
  alternatives_korean:
  - 선견자의 집
  - 예언자의 집
  lexicon: HALOT
  rationale: 1사무엘 9:9의 설명에 따라 רֹאֶה는 후대의 ‘예언자’보다 오래된 호칭이지만, 한국어에서 ‘seer’의 낯선 직역보다 기능적 의미를 드러내는 ‘점쟁이’가 원문이 가리키는 인물 유형을 더 직접적으로 전달합니다.
theological_decisions:
- issue: רֹאֶה(‘seer’)의 한국어 처리와 1사무엘 9:9의 내적 설명 관계
  chosen_reading: 본 절에서는 ‘점쟁이’로 옮기고, 본문 자체의 고대 호칭 차이를 유지합니다.
  alternative_readings:
  - 선견자
  - 예언자
  rationale: 영어 POB가 ‘seer’를 더 오래된 용어로 보존하되 9:9를 통해 해설하듯, 한국어도 현대 교회어로 평탄화하지 않고 낯선 호칭의 역사적 층위를 드러내는 방향을 택했습니다.
  doctrine_reference: 본문 내 해설(1 Sam 9:9)
