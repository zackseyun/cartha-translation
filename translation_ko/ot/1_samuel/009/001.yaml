  lexicon: HALOT
  rationale: 서사 전환을 나타내는 וַיְהִי는 한국어에서 ‘그때’로 자연스럽게 살리고, אִישׁ은 ‘사람’보다 구체적인 ‘한 명’으로 인물 도입을 분명하게 했습니다.
- source_word: מִבֶּן־יָמִין
  english_pob_choice: of Benjamin
  chosen_korean: 베냐민 사람
  alternatives_korean:
  - 베냐민 지파 사람
  - 베냐민 출신
  lexicon: HALOT
  rationale: 직역형 ‘베냐민에서’보다 출신/소속을 드러내는 ‘베냐민 사람’이 간결하면서도 히브리어의 부족 소속을 잘 반영합니다.
- source_word: וּשְׁמוֹ
  english_pob_choice: and his name was
  chosen_korean: 그의 이름은 …였습니다
  alternatives_korean:
  - 이름은 …였습니다
  - 그 이름은 …였습니다
  lexicon: HALOT
  rationale: 히브리어의 이름 소개 공식구를 유지하기 위해 ‘그의 이름은’ 구문을 사용했습니다.
- source_word: בֶּן ... בֶּן ...
  english_pob_choice: son of
  chosen_korean: …의 아들
  alternatives_korean:
  - …의 자손
  - …의 후손
  lexicon: HALOT
  rationale: 반복되는 족보 형식을 한국어의 표준적 계보 표현인 ‘…의 아들’로 옮겨 원문의 계보 리듬을 보존했습니다.
- source_word: גִּבּוֹר חָיִל
  english_pob_choice: a mighty man of valor
  chosen_korean: 용맹한 사람
  alternatives_korean:
  - 용사
  - 유력한 사람
  - 재산과 영향력이 큰 사람
  lexicon: HALOT
  rationale: 이 표현은 문맥에 따라 군사력, 사회적 위상, 재력까지 아우를 수 있으므로, 특정 의미로 좁히지 않고 한국어에서 가장 넓게 대응하는 ‘용맹한 사람’을 택했습니다.
theological_decisions:
- issue: גִּבּוֹר חָיִל의 의미 범위
  chosen_reading: ‘용맹한 사람’으로 번역해 군사적 용맹에만 한정하지 않으면서도 인물의 두드러진 역량을 드러냈습니다.
  alternative_readings:
  - 용사
  - 유력한 사람
  - 재산과 영향력이 큰 사람
  rationale: 히브리어 관용구는 본문 맥락에 따라 다양한 뉘앙스를 가질 수 있으므로, 뒤의 서술을 과도하게 선결정하지 않는 중립적 표현이 가장 안전합니다.
  doctrine_reference: 본문 의미의 범위 보존
- issue: 계보 소개의 문체
  chosen_reading: 족보 정보를 현대 한국어의 합쇼체로 풀되, 반복 구조를 유지해 출신과 혈통의 공적 성격을 드러냈습니다.
  alternative_readings:
  - 보다 자연스러운 서술형으로 압축
  - 전통 교회체 계보식 표현 사용
  rationale: 이 절은 인물 소개와 가문 식별이 핵심이므로, 과도한 의역보다 구조 보존이 독자 이해에 더 유익합니다.
  doctrine_reference: 서사-계보 구조 보존
