base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/001.yaml
  text: Now there was a man of Benjamin[a], and his name was Kish son of Abiel, son of Zeror, son of Becorath, son of Aphiah, son of a Benjaminite, a mighty man of valor.
  footnotes:
  - marker: a
    text: Or 'a mighty warrior,' 'a prominent man,' or 'a wealthy influential man'; the Hebrew expression can carry military, social, or economic overtones depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 베냐민 지파 출신으로 기스라는 사람이 있었습니다. 기스는 아비엘의 아들이고, 아비엘은 스롤의 아들이며, 스롤은 베고랏의 아들이고, 베고랏은 아비야의 아들이며, 아비야는 베냐민 사람의 아들이었습니다. 기스는 유력한 사람이었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘용사’, ‘용맹한 사람’, ‘재산과 영향력이 큰 사람’. 히브리어 표현은 문맥에 따라 군사적 능력, 사회적 지위, 또는 경제적 역량을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי / אִישׁ
  english_pob_choice: Now there was a man
  chosen_korean: 그때 베냐민 사람 한 명이 있었습니다
  alternatives_korean:
  - 그때 베냐민 지파에 속한 사람이 있었습니다
