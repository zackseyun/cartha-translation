- from: 그리고 사흘 전에 잃어버린 나귀들은 당신의 것입니다[a]. 그것들에 마음을 두지 마십시오. 그것들이 이미 찾아졌기 때문입니다[b]. 그리고 이스라엘의 모든 바람직한 것이 누구에게 있습니까? 당신과 당신 아버지 집에게 있지 않습니까?
