id: 1SA.9.20
reference: 1 Samuel 9:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָ/אֲתֹנ֞וֹת הָ/אֹבְד֣וֹת לְ/ךָ֗ הַ/יּוֹם֙ שְׁלֹ֣שֶׁת הַ/יָּמִ֔ים אַל תָּ֧שֶׂם אֶֽת לִבְּ/ךָ֛ לָ/הֶ֖ם כִּ֣י נִמְצָ֑אוּ וּ/לְ/מִי֙ כָּל חֶמְדַּ֣ת יִשְׂרָאֵ֔ל הֲ/ל֣וֹא לְ/ךָ֔ וּ/לְ/כֹ֖ל בֵּ֥ית אָבִֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/020.yaml
  text: And as for the donkeys that were lost to you three days ago[a], do not set your heart on them, for they have been found[b]. And for whom is all the desire of Israel? Is it not for you and for all your father's house?
  footnotes:
  - marker: a
    text: Or, 'And to whom belongs all that is desirable in Israel?' The Hebrew phrase may refer either to what Israel desires or to what is precious/desirable in Israel.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your father's house,' a household/clan expression broader than the immediate nuclear family.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 사흘 전에 잃어버린 나귀들은 당신의 것입니다[a]. 그것들에 마음을 두지 마십시오. 그것들이 이미 찾아졌기 때문입니다[b]. 그리고 이스라엘의 모든 바람직한 것이 누구에게 있습니까? 당신과 당신 아버지 집에게 있지 않습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘사흘 전’이라는 시간 표현을 사용합니다.
    reason: source_note
  - marker: b
    text: 히브리어 ‘아버지 집’은 가까운 핵가족을 넘어서는 친족·가문 단위를 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֲתֹנוֹת הָאֹבְדוֹת
  english_pob_choice: the donkeys that were lost
  chosen_korean: 잃어버린 나귀들
  alternatives_korean:
  - 잃어버린 암나귀들
  - 길 잃은 나귀들
  lexicon: HALOT
  rationale: 히브리어는 암나귀를 가리키지만, 본문 초점이 성별이 아니라 분실된 가축 자체에 있으므로 한국어에서는 자연스러운 ‘나귀들’로 옮기되 ‘잃어버린’으로 상태를 분명히 했습니다.
- source_word: הַיּוֹם שְׁלֹשֶׁת הַיָּמִים
  english_pob_choice: three days ago
  chosen_korean: 사흘 전에
  alternatives_korean:
  - 사흘 전
  - 지금으로부터 사흘 전에
  lexicon: HALOT
  rationale: 히브리어 관용은 과거의 시점을 가리키므로, 현대 한국어에서 가장 자연스러운 시간 표현인 ‘사흘 전에’로 옮겼습니다.
- source_word: אַל תָּשֶׂם אֶת לִבְּךָ לָהֶם
  english_pob_choice: do not set your heart on them
  chosen_korean: 그것들에 마음을 두지 마십시오
  alternatives_korean:
  - 그것들을 걱정하지 마십시오
  - 그것들에 마음 쓰지 마십시오
  lexicon: HALOT
  rationale: ‘마음을 두다’는 히브리어의 심장 중심 사고·관심이라는 관용을 비교적 직접적으로 살리면서도, 한국어로 자연스럽게 들리는 표현입니다.
- source_word: חֶמְדַּת יִשְׂרָאֵל
  english_pob_choice: the desire of Israel
  chosen_korean: 이스라엘의 모든 바람직한 것
  alternatives_korean:
  - 이스라엘의 모든 소원
  - 이스라엘의 모든 보배로운 것
  lexicon: HALOT
  rationale: חֶמְדַּת는 ‘욕망/소원’일 수도, ‘바람직한 것/귀한 것’일 수도 있어 POB의 중립적 중의성을 살려 ‘바람직한 것’으로 옮겼습니다.
- source_word: בֵּית אָבִיךָ
  english_pob_choice: your father's house
  chosen_korean: 당신 아버지 집
  alternatives_korean:
  - 당신의 아버지 집안
  - 당신의 아버지의 가족
  lexicon: HALOT
  rationale: 히브리어의 사회·친족 단위 표현을 그대로 드러내기 위해 직역에 가까운 ‘아버지 집’을 유지했습니다.
theological_decisions:
- issue: חֶמְדַּת יִשְׂרָאֵל의 의미 범위
  chosen_reading: 본문의 수사적 압축을 유지하여, 사울과 그의 집안을 가리키는 말이면서도 ‘이스라엘의 바람직한 것’이라는 표현 자체의 폭을 열어 두었습니다.
  alternative_readings:
  - 이스라엘이 바라는 왕권에 대한 직접 언급
  - 이스라엘 안의 귀한 것들이 사울 집안에게 속한다는 뜻
  rationale: 이 절은 다음 문맥상 사울의 선출을 예고하지만, 본문 자체는 ‘왕권’이라고 명시하지 않으므로 번역에서 그 결론을 앞당겨 넣지 않았습니다.
  doctrine_reference: 본문의 긴장을 보존하고 해석을 과도하게 확정하지 않음.
