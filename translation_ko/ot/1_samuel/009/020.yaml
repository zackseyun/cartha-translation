  source_fidelity: 첫 문장이 히브리어의 주제 제시(‘사흘 전에 잃어버린 당신의 나귀들은’)를 ‘나귀들은 당신의 것입니다’로 잘못 옮겨 원문의 핵심 정보를 바꾸었습니다. 또한 ‘찾아졌다’는 나귀들을 가리키므로 적절히 유지하되, 각주 표지는 해당 어구에 붙여야 합니다. 후반의 수사 의문문은 ‘누구를 위한 것입니까?’와 ‘당신과 당신 아버지의 온 집안을 위한 것이 아닙니까?’로 옮겨 לְ의 수혜/귀속 범위를 보존했습니다.
  naturalness: ‘나귀들은 당신의 것입니다’는 문맥상 부자연스럽고 원문에도 없습니다. ‘그 나귀들에게 마음을 쓰지 마십시오’와 ‘당신 아버지의 온 집안’은 현대 표준 한국어의 격식 있는 합쇼체에서 자연스럽습니다. ‘이스라엘의 모든 소망’은 압축된 원문의 수사성을 살리면서도 ‘모든 바람직한 것’보다 자연스럽습니다.
  terminology: ‘나귀’는 문맥에 맞으며, 원어의 암나귀라는 성별은 여기서 주된 초점이 아니므로 일반 명사로 처리할 수 있습니다. ‘아버지의 집’은 친족·가문 단위를 나타내므로 본문에서는 자연스러운 ‘아버지의 온 집안’으로, 각주에서 문화적 범위를 설명합니다. חֶמְדַּת의 ‘갈망/소망’ 또는 ‘귀한 것’이라는 중의성은 각주로 보존합니다.
