base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/012.yaml
  text: So David’s young men turned back on their way[a], and they returned and came and told him all these words.
  footnotes:
  - marker: a
    text: Or 'all these things.' The Hebrew word can refer either to spoken words or to matters/events; here 'words' is preferred because the report concerns Nabal’s spoken response.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 젊은이들은 발길을 돌려 되돌아와 그에게 이 모든 말을 전했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּהַפְכוּ
  english_pob_choice: turned back
  chosen_korean: 길을 돌이켜
  alternatives_korean:
  - 돌아서
  - 되돌아가
  lexicon: HALOT
  rationale: 반복된 이동 서술에서 הפך의 방향 전환 의미를 자연스럽게 살리기 위해 ‘길을 돌이켜’로 옮겼습니다.
- source_word: נַעֲרֵי דָוִד
  english_pob_choice: David’s young men
  chosen_korean: 다윗의 젊은이들
  alternatives_korean:
  - 다윗의 종들
  - 다윗의 부하들
  lexicon: HALOT
  rationale: נַעַר의 기본 뉘앙스인 ‘젊은이/수종’을 살리면서도, 여기서는 공식적 하인보다 수행원에 가까우므로 ‘젊은이들’이 가장 무난합니다.
- source_word: כְּכֹל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: all these words
  chosen_korean: 이 모든 말
  alternatives_korean:
  - 이 모든 것
  - 이 모든 일
  lexicon: HALOT
  rationale: 문맥상 나발의 대답을 전하는 장면이므로 דְּבָרִים를 ‘말’로 옮겨 발화 중심을 유지했습니다.
