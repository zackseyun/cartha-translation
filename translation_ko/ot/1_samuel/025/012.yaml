  source_fidelity: 히브리어의 연속된 이동 동사(‘방향을 돌이키다/돌아가다/오다’)는 다윗의 젊은이들이 나발에게서 물러나 다윗에게 되돌아온 흐름을 나타냅니다. 초안의 ‘길을 돌이켜 돌아왔고, 와서’는 의미 자체는 대체로 맞지만, ‘길을 돌이켜’와 ‘와서’의 연결이 한국어에서 부자연스럽습니다.
  naturalness: ‘발길을 돌려 되돌아와’는 방향 전환과 귀환을 현대 표준 한국어로 자연스럽게 표현합니다. 이어지는 ‘그에게’는 문맥상 다윗을 분명히 가리킵니다.
  terminology: ‘다윗의 젊은이들’은 נַעֲרֵי דָוִד의 어휘적 뉘앙스를 보존하며, ‘이 모든 말’도 직전의 나발의 발언을 가리키는 דְּבָרִים에 적절합니다.
