id: 1SA.25.1
reference: 1 Samuel 25:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣מָת שְׁמוּאֵ֔ל וַ/יִּקָּבְצ֤וּ כָל יִשְׂרָאֵל֙ וַ/יִּסְפְּדוּ ל֔/וֹ וַ/יִּקְבְּרֻ֥/הוּ בְּ/בֵית֖/וֹ בָּ/רָמָ֑ה וַ/יָּ֣קָם דָּוִ֔ד וַ/יֵּ֖רֶד אֶל מִדְבַּ֥ר פָּארָֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/001.yaml
  text: Now Samuel died[a], and all Israel gathered and mourned for him, and they buried him at his house in Ramah. Then David arose and went down to the wilderness of Paran.
  footnotes:
  - marker: a
    text: Or 'lamented for him.' The Hebrew verb refers to mourning rites for the dead.
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘이 죽으매 온 이스라엘이 모여 그를 위해 슬퍼하며, 라마에 있는 그의 집에 그를 장사하였습니다. 그때 다윗이 일어나 바란 광야로 내려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 죽은 이를 위한 공식적인 애도 의례를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפְּדוּ לוֹ
  english_pob_choice: mourned for him
  chosen_korean: 그를 위해 슬퍼하며
  alternatives_korean:
  - 그를 애도하며
  - 그를 위해 곡하며
  lexicon: HALOT
  rationale: 히브리어 동사는 죽은 이를 위한 공식적인 애도 행위를 가리키므로, 현대 한국어에서는 ‘슬퍼하며’가 자연스럽고 의미 범위를 무리 없이 드러냅니다.
- source_word: בְּבֵיתוֹ
  english_pob_choice: at his house
  chosen_korean: 그의 집에
  alternatives_korean:
  - 그의 집에서
  - 그의 집 곁에
  lexicon: HALOT
  rationale: 장소 표현을 직역하되, 실제로는 집 안이 아니라 가문/소유지와 관련된 매장 위치일 수 있어 한국어도 과도하게 좁히지 않도록 했습니다.
- source_word: מִדְבַּר פָּארָן
  english_pob_choice: the wilderness of Paran
  chosen_korean: 바란 광야
  alternatives_korean:
  - 바란의 광야
  - 파란 광야
  lexicon: HALOT
  rationale: 지명은 현대 한국어 음역 관례에 따라 ‘바란’으로 옮기고, מִדְבָּר는 본문 맥락상 ‘광야’로 번역했습니다.
- source_word: וַיָּקָם ... וַיֵּרֶד
  english_pob_choice: Then David arose and went down
  chosen_korean: 그때 다윗이 일어나 ... 내려갔습니다
  alternatives_korean:
  - 그러자 다윗이 일어나 ... 내려갔습니다
  - 그리하여 다윗이 일어나 ... 내려갔습니다
  lexicon: HALOT
  rationale: 연속 동사의 서사 진행을 살리기 위해 ‘일어나’와 ‘내려갔습니다’를 연결해 사건 전개를 자연스럽게 반영했습니다.
theological_decisions:
- issue: וַיִּסְפְּדוּ לוֹ의 정서적·의례적 성격
  chosen_reading: 단순한 감정 표현이 아니라 장례 애도의 공식적 행위로 읽고 번역했습니다.
  alternative_readings:
  - 그를 애도했습니다
  - 그를 곡했습니다
  rationale: 히브리어 동사는 죽은 자를 위한 통상적 애도 의례를 포함하므로, 본문이 전달하는 공동체적 장례 반응을 보존하는 쪽을 택했습니다.
  doctrine_reference: 장례/애도 관습에 대한 본문 서술
- issue: בְּבֵיתוֹ의 장지 표현
  chosen_reading: ‘그의 집에’를 유지해 매장 장소를 지나치게 해석하지 않았습니다.
  alternative_readings:
  - 그의 집에서
  - 그의 가문 묘지에
  rationale: 히브리어 표현은 문자적으로는 ‘그의 집에’이나, 실제 의미를 특정 묘지로 단정할 충분한 근거가 본문 안에 없으므로 해석을 절제했습니다.
  doctrine_reference: 본문 의미의 최소 해석 원칙
