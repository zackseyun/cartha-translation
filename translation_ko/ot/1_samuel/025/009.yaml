    rationale: 각주 표지는 설명 대상 어휘 바로 뒤에 배치되어야 독자가 각주의 적용 대상을 혼동하지 않습니다.
  - severity: medium
    issue: 기존 각주는 본문이 이미 ‘쉬었습니다’라고 번역했는데도 ‘또는 ‘쉬었습니다’’라고 제시합니다.
    rationale: 본문과 대안 표기가 중복되어 각주의 기능이 성립하지 않습니다. 본문과 각주를 서로 구별되는, 모두 가능한 번역으로 정리해야 합니다.
  revised_text: 다윗의 젊은이들이 와서 다윗의 이름으로 나발에게 이 모든 말을 전한 뒤 잠시 멈추었습니다[a].
