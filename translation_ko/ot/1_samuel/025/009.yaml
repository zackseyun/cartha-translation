id: 1SA.25.9
reference: 1 Samuel 25:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ נַעֲרֵ֣י דָוִ֔ד וַ/יְדַבְּר֧וּ אֶל נָבָ֛ל כְּ/כָל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/שֵׁ֣ם דָּוִ֑ד וַ/יָּנֽוּחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/009.yaml
  text: When David’s young men came[a], they spoke to Nabal all these words in David’s name, and then they rested.
  footnotes:
  - marker: a
    text: Or 'and they rested' or 'and they paused.' The Hebrew verb can mean 'rested,' but in this context it likely indicates that David’s men finished speaking and waited for Nabal’s response.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 젊은이들이 오자[a], 그들은 다윗의 이름으로 나발에게 이 모든 말을 전하고, 그런 다음 쉬었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쉬었습니다’, ‘멈추었습니다’로도 옮길 수 있습니다. 히브리어 동사는 여기서 ‘쉬다’를 뜻하지만, 이 문맥에서는 다윗의 사람들이 말을 마치고 나발의 응답을 기다렸다는 뜻일 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי
  english_pob_choice: young men
  chosen_korean: 젊은이들
  alternatives_korean:
  - 종들
  - 남자들
  - 청년들
  lexicon: HALOT
  rationale: נַעַר는 문맥에 따라 청년, 종, 수행원을 뜻할 수 있으므로, 다윗의 사절단이라는 맥락을 살려 과도하게 기능화된 ‘종들’보다 자연스러운 ‘젊은이들’로 옮겼습니다.
- source_word: וַיָּבֹאוּ
  english_pob_choice: came
  chosen_korean: 오자
  alternatives_korean:
  - 도착하자
  - 왔다
  lexicon: HALOT
  rationale: 서술의 연속성을 살리면서 다음 동작으로 자연스럽게 이어지도록 ‘오자’로 처리했습니다.
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: all these words
  chosen_korean: 이 모든 말
  alternatives_korean:
  - 이 모든 것
  - 모든 이런 말
  lexicon: HALOT
  rationale: 히브리어의 דְּבָרִים를 ‘말’로 살려, 단순한 내용보다 실제 전달된 발화의 성격을 드러냈습니다.
- source_word: בְּשֵׁם דָּוִד
  english_pob_choice: in David’s name
  chosen_korean: 다윗의 이름으로
  alternatives_korean:
  - 다윗을 대신하여
  - 다윗의 이름 안에서
  lexicon: HALOT
  rationale: 대표권과 위임의 의미를 한국어 관용구인 ‘~의 이름으로’로 가장 직접적으로 반영했습니다.
- source_word: וַיָּנוּחוּ
  english_pob_choice: they rested
  chosen_korean: 쉬었습니다
  alternatives_korean:
  - 머물렀습니다
  - 멈추고 기다렸습니다
  lexicon: HALOT
  rationale: 본문의 기본 의미인 ‘쉬다/정착하다’를 따르되, 이 문맥에서는 말하기를 마친 뒤 잠시 멈춘 상태까지도 자연스럽게 담는 ‘쉬었습니다’를 택했습니다.
theological_decisions:
- issue: וַיָּנוּחוּ의 문맥상 의미를 ‘rested’로 유지할지, 화행적 의미를 보완할지
  chosen_reading: 본문의 기본 동사 의미를 살려 ‘쉬었습니다’로 번역하되, 문맥상 행동의 종료와 잠시 대기하는 뉘앙스를 함께 열어 두었습니다.
  alternative_readings:
  - 말을 마치고 기다렸습니다
  - 멈추고 기다렸습니다
  rationale: 히브리어 동사의 사전적 의미를 지키는 것이 우선이며, POB의 영어도 ‘rested’를 유지합니다. 다만 서사 문맥상 ‘응답을 기다리다’라는 해석 가능성은 남아 있습니다.
  doctrine_reference: 출애굽기/사무엘서 서사 번역의 문맥 우선 원칙
