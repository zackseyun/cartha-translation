  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לַ/אֲבִיגַ֨יִל֙ אֵ֣שֶׁת נָבָ֔ל הִגִּ֧יד נַֽעַר אֶחָ֛ד מֵ/הַ/נְּעָרִ֖ים לֵ/אמֹ֑ר הִנֵּ֣ה שָׁלַח֩ דָּוִ֨ד מַלְאָכִ֧ים מֵֽ/הַ/מִּדְבָּ֛ר לְ/בָרֵ֥ךְ אֶת אֲדֹנֵ֖י/נוּ וַ/יָּ֥עַט בָּ/הֶֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/014.yaml
  text: But one of the young men told Abigail[a], Nabal’s wife, saying, “Look, David sent messengers from the wilderness to greet our master[b], and he shouted at them.”
  footnotes:
  - marker: a
    text: Or 'to bless our master.' The Hebrew verb often means 'bless,' but here likely refers to offering a courteous greeting or blessing.
    reason: lexical_alternative
  - marker: b
    text: Or 'he railed at them' / 'he flew at them.' The Hebrew verb is vivid and can suggest an aggressive outburst.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 젊은이 하나가 나발의 아내 아비가일에게 말했습니다. “보십시오, 다윗이 광야에서 우리 주인을 문안하려고[a] 전령들을 보냈는데, 나발이 그들에게 호통쳤습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 주인을 축복하려고’라고 할 수 있습니다. 히브리어 동사는 흔히 ‘축복하다’를 뜻하지만, 여기서는 정중한 인사나 문안의 의미일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들에게 모욕적인 말을 퍼부었다’ 또는 ‘그들에게 달려들었다’라고 할 수 있습니다. 히브리어 동사는 거칠고 공격적인 반응을 생생하게 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲבִיגַיִל
  english_pob_choice: But ... Abigail
  chosen_korean: 그러자 ... 아비가일에게
  alternatives_korean:
  - 그리고 ... 아비가일에게
  - 하지만 ... 아비가일에게
  lexicon: HALOT
  rationale: 앞 구절의 거절 직후 이어지는 보고이므로 단순 접속보다 전환감을 살리는 ‘그러자’가 자연스럽습니다.
- source_word: הִגִּיד
  english_pob_choice: told
  chosen_korean: 말했습니다
  alternatives_korean:
  - 알렸습니다
  - 보고했습니다
  lexicon: HALOT
  rationale: 하나의 젊은이가 아비가일에게 전하는 직접 보고이므로, 현대 한국어에서 가장 자연스러운 ‘말했습니다’로 옮겼습니다.
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들을
  - 사절들을
  lexicon: HALOT
  rationale: 여기서는 인간 외교 사절을 가리키므로 ‘사자들’이 원문의 의미를 살리되 한국어 성경에서 익숙한 표현입니다.
- source_word: לְבָרֵךְ
  english_pob_choice: to greet
  chosen_korean: 문안하게 했는데
  alternatives_korean:
  - 축복하게 했는데
  - 인사하게 했는데
  lexicon: HALOT
  rationale: ברך는 문자적으로는 ‘축복하다’이지만, 이 문맥에서는 정중한 인사/문안의 뜻이 더 분명하므로 이를 반영했습니다.
- source_word: וַיָּעַט בָּהֶם
  english_pob_choice: and he shouted at them
  chosen_korean: 그가 그들에게 소리를 질렀습니다
  alternatives_korean:
  - 그가 그들에게 호통쳤습니다
  - 그가 그들에게 욕을 퍼부었습니다
  lexicon: HALOT
  rationale: 동사는 급작스럽고 거친 언행을 가리키므로, 과도하게 해석하지 않으면서도 폭력적인 거절감을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 아도니/주인의 지칭
  chosen_reading: 우리 주인
  alternative_readings:
  - 우리 주님
  - 우리 상전
  rationale: 문맥상 신적 호칭이 아니라 종들이 주인을 가리키는 말이므로 사회적 관계를 분명히 하는 표현을 택했습니다.
  doctrine_reference: 사회적 호칭 구분
- issue: לְבָרֵךְ의 의미 긴장
  chosen_reading: 문안하게 했는데
  alternative_readings:
  - 축복하게 했는데
  - 인사하게 했는데
  rationale: ‘축복’의 직역 가능성을 지우지 않되, 본문 상황이 예의 바른 문안이므로 그 기능을 우선 드러냈습니다.
  doctrine_reference: 문맥 우선 번역 원칙
