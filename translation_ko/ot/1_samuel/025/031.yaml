  - 무고하게 피를 흘리신 일
  lexicon: HALOT
  rationale: חִנָּם의 '무상으로'가 아니라 '까닭 없이/부당하게'라는 의미를 살려, 무죄한 피흘림의 도덕적 무게를 분명히 했습니다.
- source_word: לְהוֹשִׁיעַ ... לוֹ
  english_pob_choice: my lord has avenged himself
  chosen_korean: 내 주께서 스스로 원수를 갚으신 일
