  lexicon: HALOT
  rationale: 희귀어의 미래적·도덕적 후유증을 한국어로 자연스럽게 살리기 위해, 단순한 감정보다 내적 걸림과 후회를 함께 암시하는 표현을 택했습니다.
- source_word: מִכְשׁוֹל לֵב
