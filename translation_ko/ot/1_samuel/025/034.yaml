  text: But as Yahweh[a], the God of Israel, lives, who has kept me from harming you, if you had not hurried and come to meet me, surely by the light of morning not one male would have been left to Nabal.
  footnotes:
  - marker: a
    text: 'Hebrew: ''anyone urinating against a wall,'' a coarse idiom meaning ''any male.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이스라엘의 하나님 야훼께서 살아 계심을 두고 맹세합니다. 그분께서 제가 당신에게 해를 끼치지 못하도록 막아 주셨습니다. 당신이 급히 저를 만나러 오지 않았더라면, 새벽이 밝을 때까지 나발에게 속한 남자는 하나도 남지 않았을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘벽에 오줌을 누는 자’라는 거친 관용구이며, 여기서는 모든 남자를 가리킵니다.
    reason: lexical_alternative
