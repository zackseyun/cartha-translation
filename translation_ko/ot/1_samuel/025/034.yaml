  text: But as Yahweh[a], the God of Israel, lives, who has kept me from harming you, if you had not hurried and come to meet me, surely by the light of morning not one male would have been left to Nabal.
  footnotes:
  - marker: a
    text: 'Hebrew: ''anyone urinating against a wall,'' a coarse idiom meaning ''any male.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼, 이스라엘의 하나님께서 살아 계시며, 그분께서 저를 당신을 해치는 일에서 막아 주셨습니다. 당신이 급히 와서 저를 맞으러 오지 않았더라면, 해가 뜰 무렵에는 나발에게 속한 남자들 가운데 하나도 남지 않았을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘벽에 오줌 누는 자’라는 거친 관용구로, 여기서는 ‘남자’ 전체를 가리키는 표현입니다.
    reason: lexical_alternative
