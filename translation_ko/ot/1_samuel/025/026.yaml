revisions:
- from: 이제, 내 주님이여, 야훼께서 살아 계시고 당신의 생명이 살아 있는 것처럼, 야훼께서 당신을 피 흘림과 자기 손으로 스스로 구원하는 일에서 막으셨으니, 이제 당신의 원수들과 내 주님에게 악을 구하는 자들은 나발과 같게 하소서.[a][b]
  to: 그러므로 내 주님, 야훼께서 살아 계심과 당신의 목숨을 두고 맹세합니다. 야훼께서 당신을 피 흘리는 죄와 자기 손으로 스스로 구원하는 일[a]에서 막으셨으니, 이제 당신의 원수들과 내 주님에게 악을 꾀하는 자들이 나발과 같게 되기를 바랍니다.[b]
  rationale: 초두의 וְעַתָּה는 원문에 실제로 있으므로 ‘그러므로’로 반영했고, 두 번째 וְעַתָּה는 ‘이제’로 유지했습니다. 맹세 공식과 혈죄 표현을 현대 표준 한국어에 맞게 다듬었으며, 자기 손으로 행하는 구원/자력 해결이라는 원문의 표현은 보존하되 문맥적 ‘보복’ 해석은 각주로 제한했습니다. 각주 표지도 해당 어구로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:25:39Z'
review_pass:
  verdict: revise
  source_fidelity: 초두 וְעַתָּה와 후반의 וְעַתָּה는 모두 담화 표지이므로 각각 ‘그러므로’와 ‘이제’로 자연스럽게 반영할 수 있습니다. 맹세 공식은 한국어에서 ‘살아 있는 것처럼’보다 ‘…을 두고 맹세합니다’가 충실하면서도 자연스럽습니다. מִבּוֹא בְדָמִים은 단순한 ‘피 흘림’보다 피 흘림으로 말미암는 죄의 의미를 드러내야 합니다.
  naturalness: ‘당신의 생명이 살아 있는 것처럼’과 ‘자기 손으로 스스로 구원하는 일’은 현대 한국어에서 다소 부자연스럽거나 중복적으로 들립니다. 또한 각주 표지는 관련 어구 바로 뒤에 두는 편이 독자에게 명확합니다.
  terminology: יהוה는 프로젝트 방침대로 ‘야훼’로 유지했습니다. אֲדֹנִי는 문맥상 다윗에게 드리는 존칭이므로 ‘내 주님’이 적절합니다. נָבָל은 인명 ‘나발’로 유지하고, ‘어리석은 자’의 어감은 각주에서 설명합니다.
  issues:
  - severity: medium
    issue: ‘피 흘림’이 מִבּוֹא בְדָמִים의 혈죄 의미를 충분히 나타내지 못합니다.
    rationale: 이 문맥은 단순한 유혈 사태가 아니라 다윗이 피를 흘려 죄를 짓는 것을 야훼께서 막으신 일입니다. ‘피 흘리는 죄’가 이 의미를 더 분명히 전달합니다.
  - severity: medium
    issue: 맹세 공식의 한국어 표현이 부자연스럽습니다.
    rationale: ‘야훼께서 살아 계시고 당신의 생명이 살아 있는 것처럼’은 ‘생명이 살아 있다’라는 어색한 중복을 낳습니다. 한국어 맹세 관용구로 옮기면 원문의 맹세 기능을 자연스럽게 보존합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 함께 배치되어 지시 대상이 불명확합니다.
    rationale: a는 자기 손으로 자신을 구원하는 일에, b는 나발이라는 이름에 각각 직접 붙여야 합니다.
