source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֲדֹנִ֗/י חַי יְהוָ֤ה וְ/חֵֽי נַפְשְׁ/ךָ֙ אֲשֶׁ֨ר מְנָעֲ/ךָ֤ יְהוָה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הוֹשֵׁ֥עַ יָדְ/ךָ֖ לָ֑/ךְ וְ/עַתָּ֗ה יִֽהְי֤וּ כְ/נָבָל֙ אֹיְבֶ֔י/ךָ וְ/הַֽ/מְבַקְשִׁ֥ים אֶל אֲדֹנִ֖/י רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/026.yaml
  text: Now[a], my lord, as Yahweh lives and as you yourself live, since Yahweh has kept you from bloodguilt and from saving yourself by your own hand[b], now let your enemies and those who seek evil against my lord be like Nabal.
  footnotes:
  - marker: a
    text: Or, more explicitly in context, 'from avenging yourself with your own hand.'
    reason: lexical_alternative
  - marker: b
    text: '''Be like Nabal'' likely refers to the man Nabal by name, though the name also echoes the Hebrew word for ''fool.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 내 주님이여, 야훼께서 살아 계시고 당신의 생명이 살아 있는 것처럼, 야훼께서 당신을 피 흘림과 자기 손으로 스스로 구원하는 일에서 막으셨으니, 이제 당신의 원수들과 내 주님에게 악을 구하는 자들은 나발과 같게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 더 풀면 ‘자기 손으로 보복하는 일에서’라는 뜻입니다.
    reason: alternative_reading
  - marker: b
    text: ‘나발과 같게 하소서’는 여기서 나발이라는 사람의 이름을 가리키는 말로 보이지만, 히브리어의 ‘어리석은 자’라는 뜻을 함께 울립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주님이여
  alternatives_korean:
  - 내 주인이여
  - 나의 주인님이여
  lexicon: HALOT
  rationale: 다윗에게 드리는 정중한 호칭으로서 존대형을 유지하되, 하나님의 칭호와 구별되도록 ‘내 주님이여’로 옮겼습니다.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  english_pob_choice: as Yahweh lives and as you yourself live
  chosen_korean: 야훼께서 살아 계시고 당신의 생명이 살아 있는 것처럼
  alternatives_korean:
  - 야훼께서 살아 계시고 당신의 목숨이 살아 있는 것처럼
  - 야훼의 삶과 당신의 삶을 두고
  lexicon: HALOT
  rationale: 맹세 공식의 두 요소를 자연스러운 한국어로 살려, 첫 절은 ‘야훼께서 살아 계시고’, 둘째 절은 ‘당신의 생명이 살아 있는 것처럼’으로 대응시켰습니다.
- source_word: מִבּוֹא בְדָמִים
  english_pob_choice: from bloodguilt
  chosen_korean: 피 흘림
  alternatives_korean:
  - 피 흘리는 죄
  - 피 흘림의 죄책
  lexicon: HALOT
  rationale: 문맥상 단순한 유혈이 아니라 피를 흘리게 되는 행위 자체를 가리키므로, 간결하게 ‘피 흘림’으로 옮기되 죄책의 뉘앙스는 다음 절의 전체 문맥이 받쳐 줍니다.
- source_word: וְהוֹשֵׁעַ יָדְךָ לָךְ
  english_pob_choice: from saving yourself by your own hand
  chosen_korean: 자기 손으로 스스로 구원하는 일
  alternatives_korean:
  - 자기 손으로 스스로 구하는 일
  - 자기 손으로 복수하는 일
  lexicon: HALOT
  rationale: 히브리어의 ישׁע(구원하다/구하다)를 반영해 기본 의미를 유지하되, POB의 문맥 판단처럼 자기 손으로 해결하려는 행위를 나타내도록 표현했습니다.
- source_word: נָבָל
  english_pob_choice: Nabal
  chosen_korean: 나발
  alternatives_korean:
  - 어리석은 자
  - 우둔한 자
  lexicon: HALOT
  rationale: 직전 문맥의 인명 ‘나발’을 기본으로 살리고, 동시에 어근이 갖는 ‘어리석은 자’라는 공명을 한국어 본문에서는 이름 형태로 보존했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 신적 고유명을 대체하지 않고 직접 음역해, 본문의 언약적·인격적 뉘앙스를 유지했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
- issue: ‘자기 손으로 스스로 구원하는 일’의 의미
  chosen_reading: 다윗이 직접 보복적 행동으로 자기 문제를 해결하려는 것을 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 단순히 ‘스스로 구원하다’
  - ‘자기 손으로 복수하다’
  rationale: 히브리어 동사 자체는 ‘구원하다/구하다’이지만, 문맥상 피 흘림을 피하려는 하나님의 막으심과 연결되므로, 행위의 성격을 본문이 허용하는 범위 안에서 분명히 드러냈습니다.
  doctrine_reference: 문맥적 해석(혈죄 회피와 개인적 보복 억제)
