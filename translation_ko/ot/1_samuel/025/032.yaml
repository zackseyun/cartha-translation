translation:
  language: ko
  text: 다윗이 아비가일에게 말했습니다. “야훼, 곧 이스라엘의 하나님을 찬양합니다. 그분이 이 날[a] 당신을 보내어 저를 만나게 하셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 “이 날”; “오늘”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... לַאֲבִיגַל
  english_pob_choice: said to Abigail
  chosen_korean: 아비가일에게 말했습니다
  alternatives_korean:
  - 아비가일에게 이르렀습니다
  - 아비가일에게 말하였습니다
  lexicon: HALOT
  rationale: 서술 동사의 순차적 진행을 자연스러운 한국어로 옮기되, 직접화법의 도입을 분명히 하기 위해 ‘말했습니다’를 선택했습니다.
- source_word: בָּרוּךְ יְהוָה
  english_pob_choice: Blessed be Yahweh
  chosen_korean: 야훼를 찬양합니다
  alternatives_korean:
  - 야훼께 복이 있기를 바랍니다
  - 야훼는 복되십니다
  lexicon: HALOT
  rationale: 히브리어 축복 공식의 경배적 성격을 살리되, 한국어에서 가장 자연스럽게 울리는 예배적 표현으로 ‘찬양합니다’를 택했습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 곧 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 하나님
  - 이스라엘 하나님
  lexicon: HALOT
  rationale: 동격적 설명을 살려 야훼를 ‘이스라엘의 하나님’으로 특정하는 구조를 분명히 했습니다.
- source_word: הַיּוֹם הַזֶּה
  english_pob_choice: this day
  chosen_korean: 오늘 이 날
  alternatives_korean:
  - 이 날
  - 오늘
  lexicon: HALOT
  rationale: POB의 각주가 지적하듯 ‘this day’는 문자적으로는 ‘이 날’이지만, 한국어에서는 ‘오늘 이 날’이 의도된 시점의 강조를 가장 잘 드러냅니다.
- source_word: לִקְרָאתִי
  english_pob_choice: to meet me
  chosen_korean: 저를 만나게 하셨습니다
  alternatives_korean:
  - 저를 만나도록 하셨습니다
  - 저를 만나러 오게 하셨습니다
  lexicon: HALOT
  rationale: 목적/결과의 뉘앙스를 살려, 하나님이 아비가일을 보내어 다윗과의 만남이 이루어지게 하셨다는 뜻을 자연스럽게 표현했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 고유명사를 제목어로 대체하지 않고, POB의 원칙에 따라 신적 이름 자체를 드러냈습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: ‘Blessed be’ 축복 공식의 한국어 화용
  chosen_reading: 야훼를 찬양합니다
  alternative_readings:
  - 야훼는 복되십니다
  - 야훼께 복이 있기를 바랍니다
  rationale: 다윗의 발화는 단순 정보가 아니라 하나님께 드리는 축복/찬양 선언이므로, 한국어에서도 예배적 발화로 들리도록 했습니다.
  doctrine_reference: 'Source speech act: doxological blessing'
