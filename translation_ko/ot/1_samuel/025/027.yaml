  text: And now, let this gift that your servant has brought to my lord be given to the young men who follow my lord.
translation:
  language: ko
  text: 이제, 주인의 종이 주인님께 가져온 이 선물을 주인님을 따라다니는 젊은이들에게 주십시오.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 ברכה는 문맥에 따라 ‘복’이나 ‘예물’을 뜻할 수 있으나, 여기서는 가져온 물건을 가리켜 ‘선물’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרָכָה הַזֹּאת
  english_pob_choice: this gift
  chosen_korean: 이 선물
  alternatives_korean:
  - 이 예물
  - 이 축복
  - 이 선사물
  lexicon: ברכה
  rationale: 문맥상 아비가일이 가져온 실물의 증정품을 가리키므로, 축복의 추상적 뜻보다 구체적인 ‘선물’이 영어 POB의 ‘gift’를 가장 직접적으로 반영합니다.
- source_word: שִׁפְחָתְךָ
  english_pob_choice: your servant
  chosen_korean: 주인의 종
  alternatives_korean:
  - 당신의 종
  - 당신의 여종
  - 당신의 시녀
  lexicon: שׁפחה
  rationale: 화자가 자신을 낮추는 종속 표현이므로 ‘종’으로 옮겼고, 성별이 드러나는 어감은 한국어에서 문맥상 자연스럽지 않아 완화했습니다.
- source_word: לַאדֹנִי
  english_pob_choice: to my lord
  chosen_korean: 주인님께
  alternatives_korean:
  - 내 주께
  - 주께
  - 나의 주인께
  lexicon: אדון
  rationale: 아비가일이 다윗에게 정중히 말하는 호칭이므로 ‘주인님’으로 존대했고, 대화체의 예법을 살리기 위해 여격을 ‘-께’로 처리했습니다.
- source_word: הַמִּתְהַלְּכִים בְּרַגְלֵי אֲדֹנִי
  english_pob_choice: the young men who follow my lord
  chosen_korean: 주인님을 따라다니는 젊은이들
  alternatives_korean:
  - 주인님 발뒤를 따르는 젊은이들
  - 주인님 곁을 따르는 젊은이들
  - 주인님의 발자취를 따르는 젊은이들
  lexicon: הלך
  rationale: 직역하면 ‘주인님의 발걸음 안에서 걷는’ 이미지이지만, 한국어에서는 지속적 동행을 나타내는 ‘따라다니는’이 자연스럽고 원문의 뜻을 충분히 보존합니다.
theological_decisions:
- issue: 아비가일의 자기비하적 호칭과 다윗에 대한 존대의 균형
  chosen_reading: ‘주인의 종’과 ‘주인님’의 대비를 유지해 화자의 겸손과 정치적 예우를 드러냈습니다.
  alternative_readings:
  - 더 중립적인 ‘당신의 종/내 주’
  - 현대적 완화 표현으로 평준화
  rationale: 본문은 단순 정보 전달이 아니라 아비가일의 외교적·윤리적 태도를 보여 주므로, 한국어에서도 위계와 예우의 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: 문맥적 화행과 사회적 위계의 보존
