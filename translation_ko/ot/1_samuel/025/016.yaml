  text: They were a wall around us both by night and by day[b][a], all the days we were with them tending the flock.
  footnotes:
  - marker: a
    text: Or 'They were a wall over us,' preserving the more literal force of the preposition; the sense is protective presence surrounding them.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the flock' (צאן), a collective term that can include sheep and goats.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 밤에도 낮에도 우리 둘레에 성벽과 같았습니다. 우리가 그들과 함께 양 떼를 치던 모든 날에 그랬습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עָלֵינוּ는 문자적으로는 ‘우리 위에/우리에게’이지만, 여기서는 보호적으로 ‘우리 둘레에’라는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 צֹאן은 양과 염소를 아우를 수 있는 집합명사입니다.
    reason: lexical_alternative
