revisions:
- from: 그들은 밤에도 낮에도 우리 둘레에 성벽과 같았습니다. 우리가 그들과 함께 양 떼를 치던 모든 날에 그랬습니다.[a][b]
  to: 우리가 그들과 함께 양 떼를 치던 모든 날 동안, 그들은 밤에도 낮에도 우리를 둘러싼 성벽이었습니다.[a][b]
  rationale: 직유를 제거하여 ‘그들은 성벽이었다’라는 원문의 직접적인 은유를 보존하고, 시간 표현을 한 문장 안에 결합하여 ‘그들과 함께 양 떼를 치던 모든 날’이라는 범위를 명료하게 했습니다. 각주 a의 문자적 설명도 히브리어 전치사의 기본 의미에 맞게 바로잡았습니다.
