theological_decisions:
- issue: 보호의 비유를 어떻게 드러낼지
  chosen_reading: ‘성벽’과 ‘우리 둘레에’로 옮겨 보호적 둘러쌈의 이미지를 직접 살렸습니다.
  alternative_readings:
  - ‘보호가 되었습니다’처럼 의미만 풀어 쓰기
  - ‘우리 위에 벽과 같았습니다’처럼 더 직역하기
  rationale: 문맥상 단순한 감정보다 실제적인 보호와 방어의 이미지를 전달하는 것이 원문의 힘을 더 잘 보존합니다.
  doctrine_reference: 서사 본문에서 은유의 구체성 보존 원칙
