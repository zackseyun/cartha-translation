revisions:
- from: 당신의 젊은이들에게 물어보십시오. 그들이 당신에게 알려줄 것입니다. 젊은이들이 당신의 눈에 호의를 얻도록 하십시오. 우리가 좋은 날에 왔기 때문입니다. 부디 당신의 손이 찾아내는 것을 당신의 종들과 당신의 아들 다윗에게 주십시오.[a][b]
  to: 당신의 젊은이들에게 물어보십시오. 그들이 당신에게 알려줄 것입니다. 젊은이들이 당신께 호의를 얻게 해 주십시오. 우리가 좋은 날을 맞아 왔기 때문입니다.[b] 부디 당신의 손에 있는 것은 무엇이든지[a] 당신의 종들에게, 그리고 당신의 아들 다윗에게 주십시오.
  rationale: 본문의 ‘좋은 날’은 יוֹם טוֹב의 직서성을 유지하고, 축제적 사회 배경은 각주에서만 설명했습니다. ‘손에 있는 것은 무엇이든지’는 히브리어 관용의 의미를 자연스러운 현대 한국어로 전달하며, 직역은 각주로 보존했습니다. 청원형 문장을 합쇼체로 매끄럽게 다듬고, 두 각주 표지를 각각의 근거 어구에 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:25:37Z'
