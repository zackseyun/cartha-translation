reference: 1 Samuel 25:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁאַ֨ל אֶת נְעָרֶ֜י/ךָ וְ/יַגִּ֣ידוּ לָ֗/ךְ וְ/יִמְצְא֨וּ הַ/נְּעָרִ֥ים חֵן֙ בְּ/עֵינֶ֔י/ךָ כִּֽי עַל י֥וֹם ט֖וֹב בָּ֑נוּ תְּנָ/ה נָּ֗א אֵת֩ אֲשֶׁ֨ר תִּמְצָ֤א יָֽדְ/ךָ֙ לַ/עֲבָדֶ֔י/ךָ וּ/לְ/בִנְ/ךָ֖ לְ/דָוִֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/008.yaml
  text: Ask your young men[a], and they will tell you. So let the young men find favor in your eyes, for we have come on a festive day[b]. Please give whatever your hand finds to your servants and to your son David.
  footnotes:
  - marker: a
    text: Or 'whatever you can spare'; literally, 'whatever your hand finds.'
    reason: lexical_alternative
  - marker: b
    text: '''Festive day'' reflects the celebratory context of sheep-shearing; literally, ''a good day.'''
    reason: cultural_note
translation:
  language: ko
  text: 당신의 젊은이들에게 물어보십시오. 그들이 당신에게 알려줄 것입니다. 젊은이들이 당신의 눈에 호의를 얻도록 하십시오. 우리가 좋은 날에 왔기 때문입니다. 부디 당신의 손이 찾아내는 것을 당신의 종들과 당신의 아들 다윗에게 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신이 여유 있는 것'; 직역하면 '당신의 손이 찾아내는 것'입니다.
    reason: lexical_alternative
  - marker: b
    text: '''좋은 날''은 양털 깎기 잔치의 경사스러운 분위기를 가리킵니다.'
    reason: cultural_note
lexical_decisions:
- source_word: שְׁאַל
  english_pob_choice: Ask
  chosen_korean: 물어보십시오
  alternatives_korean:
  - 물으십시오
  - 여쭈어보십시오
  lexicon: HALOT
  rationale: 직접 명령형의 요청을 자연스러운 현대 한국어로 살리면서도, 단순한 정보 조회의 강도를 유지합니다.
- source_word: נְעָרֶיךָ / הַנְּעָרִים
  english_pob_choice: your young men / the young men
  chosen_korean: 젊은이들
  alternatives_korean:
  - 청년들
  - 당신의 젊은 종들
  lexicon: HALOT
  rationale: 두 표현의 반복을 한국어에서 일관되게 살리되, 사회적 신분을 지나치게 특정하지 않고 히브리어의 나이/소속 뉘앙스를 함께 담습니다.
- source_word: כִּי עַל יוֹם טוֹב בָּאנוּ
  english_pob_choice: for we have come on a festive day
  chosen_korean: 우리가 좋은 날에 왔기 때문입니다
  alternatives_korean:
  - 우리가 축제의 날에 왔기 때문입니다
  - 우리가 좋은 날, 곧 축제의 날에 왔기 때문입니다
  lexicon: HALOT
  rationale: 본문의 יוֹם טוֹב를 직역하되, 주석 없이도 문맥상 기분 좋은/경사로운 날이라는 의미가 드러나도록 '좋은 날'을 택했습니다. 영어 POB의 'festive day'는 문맥 해석으로 보되 본문은 원어에 더 가깝게 유지합니다.
- source_word: תְּנָה נָּא אֵת אֲשֶׁר תִּמְצָא יָדְךָ
  english_pob_choice: Please give whatever your hand finds
  chosen_korean: 부디 당신의 손이 찾아내는 것을 ... 주십시오
  alternatives_korean:
  - 부디 당신이 여유 있는 것을 ... 주십시오
  - 부디 손에 잡히는 대로 ... 주십시오
  lexicon: HALOT
  rationale: '''손이 찾아내는 것''이라는 히브리어 관용을 살리면서도, 한국어에서 어색하지 않도록 청유적 공손 표현으로 옮겼습니다.'
- source_word: לַעֲבָדֶיךָ
  english_pob_choice: to your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 종들에게
  - 당신의 하인들에게
  lexicon: HALOT
  rationale: עֶבֶד의 기본 의미를 따라 '종'으로 옮겨, 단순한 고용인보다 더 낮은 예속 관계를 드러냅니다.
theological_decisions:
- issue: 다윗의 자기 호칭 '당신의 아들'
  chosen_reading: 다윗이 나발에게 겸손하게 자신을 '당신의 아들'로 부르는 수사로 유지했습니다.
  alternative_readings:
  - '''당신의 아들 다윗''을 완화해 단순히 ''다윗''으로 옮김'
  - '''당신의 종 다윗''으로 의미를 보강함'
  rationale: 원문은 친족 관계의 주장이라기보다 청원적 겸양을 표현하므로, 그 수사적 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: 서사/화법의 수사 보존
- issue: כִּי עַל יוֹם טוֹב בָּאנוּ의 해석
  chosen_reading: 문맥상의 잔치성 해석은 살리되, 본문에는 '좋은 날'을 유지했습니다.
  alternative_readings:
  - '''축제의 날''로 본문에 반영'
  - 주석만으로 문맥 해석 처리
  rationale: 영어 POB는 문화적 배경을 'festive day'로 드러냈지만, 히브리어 직서성은 '좋은 날'이 더 가깝고, 문맥 정보는 과도한 의역 없이도 전달됩니다.
  doctrine_reference: 본문-주석 구분 원칙
