  text: וַ/תֵּ֤רֶא אֲבִיגַ֨יִל֙ אֶת דָּוִ֔ד וַ/תְּמַהֵ֕ר וַ/תֵּ֖רֶד מֵ/עַ֣ל הַ/חֲמ֑וֹר וַ/תִּפֹּ֞ל לְ/אַפֵּ֤י דָוִד֙ עַל פָּנֶ֔י/הָ וַ/תִּשְׁתַּ֖חוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/023.yaml
  text: When Abigail saw David[a], she hurried and got down from the donkey, and fell before David on her face and bowed to the ground.
  footnotes:
  - marker: a
    text: Or 'prostrated herself to the ground.' The Hebrew verb can denote deep bowing or prostration; here it describes Abigail's act of homage before David, not necessarily worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 아비가일이 다윗을 보자, 급히 나귀에서 내려 다윗 앞에 얼굴을 땅에 대고 엎드려 절했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 깊이 절하는 것 또는 몸을 완전히 엎드리는 것을 가리킬 수 있습니다. 여기서는 다윗 앞에서의 경의의 행위를 가리키며, 반드시 예배를 뜻하는 것은 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  english_pob_choice: saw
  chosen_korean: 보자
  alternatives_korean:
  - 보고
  - 눈에 들어오자
  lexicon: HALOT
  rationale: ראה는 이 서술 문맥에서 단순한 ‘보다’의 의미이므로, 자연스러운 서술 연결로 ‘보자’가 가장 간결하고 충실합니다.
- source_word: וַתְּמַהֵר
  english_pob_choice: hurried
  chosen_korean: 급히
  alternatives_korean:
  - 서둘러
  - 재빨리
  lexicon: HALOT
  rationale: מהר의 빠른 행동을 현대 한국어 서술에서 간명하게 살리기 위해 ‘급히’를 택했습니다.
- source_word: וַתֵּרֶד מֵעַל הַחֲמוֹר
  english_pob_choice: got down from the donkey
  chosen_korean: 나귀에서 내려
  alternatives_korean:
  - 나귀에서 내리고
  - 나귀에서 하차해
  lexicon: HALOT
  rationale: ירד는 ‘내려오다/내리다’의 뜻이므로, 탈것에서 몸을 낮추는 장면을 자연스럽게 드러내는 ‘나귀에서 내려’가 적절합니다.
- source_word: וַתִּשְׁתַּחוּ אָרֶץ
  english_pob_choice: bowed to the ground
  chosen_korean: 얼굴을 땅에 대고 엎드려 절했습니다
  alternatives_korean:
  - 땅에 엎드려 절했습니다
  - 땅에 몸을 굽혀 절했습니다
  lexicon: HALOT
  rationale: שׁחה는 여기서 사람에게 드리는 극도의 예절과 복종의 몸짓이므로, 단순한 ‘절하다’보다 바닥에 몸을 낮추는 동작을 분명히 보이도록 옮겼습니다.
theological_decisions:
- issue: 다윗 앞에서의 행위가 예배인지 경의인지
  chosen_reading: 경의와 복종의 몸짓으로 이해해 ‘엎드려 절했습니다’로 옮겼습니다.
  alternative_readings:
  - 예배했습니다
  - 경배했습니다
  - 엎드려 경배했습니다
  rationale: 대상이 하나님이 아니라 다윗이므로, 본문은 신앙적 예배가 아니라 사회적 예우와 복종의 자세를 나타냅니다. 따라서 예배 언어를 피하고, 본문의 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
