  lexicon: HALOT
  rationale: 서사문의 대화 도입 공식으로서 자연스럽고 직접적인 동사인 ‘대답하다’를 택했습니다.
- source_word: עַבְדֵי דָוִד
  english_pob_choice: David’s servants
  chosen_korean: 다윗의 종들
  alternatives_korean:
