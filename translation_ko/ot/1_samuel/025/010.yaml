base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/010.yaml
  text: Nabal answered David’s servants and said[a], “Who is David? And who is the son of Jesse? These days many servants are breaking away, each man from before his master.”
  footnotes:
  - marker: a
    text: Or “Nowadays many servants have multiplied who are breaking away, each one from his master.”
    reason: lexical_alternative
translation:
  language: ko
  text: 나발이 다윗의 종들에게 대답하여 말했습니다[a]. “다윗이 누구냐? 이새의 아들이 누구냐? 오늘날에는 저마다 제 주인에게서 달아나는 종들이 많구나.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “오늘날에는 저마다 제 주인에게서 달아나는 종들이 많아졌다.”
    reason: רַבּוּ는 문맥상 ‘많다’로 자연스럽게 옮길 수 있으며, ‘많아졌다/불어났다’라는 완료적·증가의 뉘앙스로도 이해될 수 있습니다.
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하며
  alternatives_korean:
