  - 다윗의 노예들
  lexicon: HALOT
  rationale: 여기서는 다윗의 부하/하인들을 가리키며, 본문이 노예 신분을 전면화하지 않으므로 기본값인 ‘종들’이 가장 무난합니다.
- source_word: הַיּוֹם
  english_pob_choice: These days
  chosen_korean: 오늘날에는
  alternatives_korean:
  - 오늘은
  - 요즘은
  lexicon: HALOT
  rationale: 문맥상 단순한 시점이 아니라 일반화된 시대적 평가이므로, 한국어에서는 ‘오늘날에는’이 자연스럽고 의미 범위를 잘 보존합니다.
- source_word: מִפְּנֵי אֲדֹנָיו
  english_pob_choice: from before his master
  chosen_korean: 자기 주인 앞에서
  alternatives_korean:
  - 자기 주인에게서
  - 자기 주인으로부터
  lexicon: HALOT
  rationale: מִפְּנֵי의 공간적 이미지와 멸시 섞인 발화를 살리기 위해 직역 성향의 ‘앞에서’를 유지했습니다.
theological_decisions:
- issue: 나발의 조롱조 발화의 한국어 강도
  chosen_reading: 직접 인용 안에서 반문과 경멸이 드러나도록 ‘다윗이 누구냐? 이새의 아들이 누구냐?’로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘다윗이 뭐란 말이냐?’처럼 옮김
  - 이름만 나열하는 식으로 완화
  rationale: 히브리어 반복 의문문은 무지의 질문이 아니라 조롱입니다. 이를 약화시키지 않는 것이 본문의 화행을 보존합니다.
  doctrine_reference: 서사 화행 보존
