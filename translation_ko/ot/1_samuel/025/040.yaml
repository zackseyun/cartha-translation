revisions:
- from: 그렇게 다윗의 종들이 갈멜의 아비가일에게 가서, 「다윗이 우리를 당신에게 보내어 당신을 자기 아내로 삼고자 합니다」라고 말했습니다.[a]
  to: 그리하여 다윗의 종들이 갈멜에 있는 아비가일을 찾아가 말했습니다. “다윗이 당신을 자기 아내로 삼기 위해 우리를 당신에게 보냈습니다.”[a]
  rationale: The revision clarifies Carmel as the setting/destination of the servants’ approach, preserves the narrative sequence, and expresses the Hebrew purpose clause explicitly. It retains the source’s direct, formal marriage terminology without adding doctrinal or social interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:25:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys David’s servants, their speech, David’s sending, and the marriage purpose. However, ‘갈멜의 아비가일’ can naturally be read as a possessive or identifying epithet (‘Abigail of Carmel’), whereas the Hebrew Carmel form marks the destination/location of the servants’ arrival. The revised wording makes the location explicit. The purpose construction is also made explicit: David sent them in order to take Abigail as wife.'
  naturalness: The draft’s formal-polite narration is generally natural. ‘갈멜에 있는 아비가일을 찾아가’ is clearer and more idiomatic than ‘갈멜의 아비가일에게 가서.’ ‘그리하여’ appropriately renders the narrative transition without suggesting manner (‘그렇게’).
  terminology: ‘다윗의 종들’ is suitable for עבדי דוד in this context. ‘아내로 삼다’ is an idiomatic Korean marriage expression that faithfully conveys לקח ... לאשה. The footnote retains the more literal ‘취하다’ wording and now includes the reflexive force of לו.
  issues:
  - severity: medium
    issue: ‘갈멜의 아비가일’ is ambiguous in Korean.
    rationale: It may imply that Carmel identifies Abigail by affiliation or possession, rather than indicating that David’s servants arrived where Abigail was located. The Hebrew הַכַּרְמֶלָה is locative/directional in this clause.
  - severity: low
    issue: ‘그렇게’ can imply manner rather than a sequential narrative transition.
    rationale: The initial waw primarily advances the narrative (‘then/so’); ‘그리하여’ better fits the Korean narrative connection.
  - severity: low
    issue: The purpose relation of David’s sending is only implicit in ‘보내어 ... 삼고자 합니다.’
    rationale: Recasting it as ‘아내로 삼기 위해 ... 보냈습니다’ directly represents the Hebrew infinitive of purpose while remaining natural Korean.
  revised_text: 그리하여 다윗의 종들이 갈멜에 있는 아비가일을 찾아가 말했습니다. “다윗이 당신을 자기 아내로 삼기 위해 우리를 당신에게 보냈습니다.”[a]
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘당신을 자신을 위하여 아내로 취하다’입니다.
    reason: lexical_alternative
  revision_rationale: The revision clarifies Carmel as the setting/destination of the servants’ approach, preserves the narrative sequence, and expresses the Hebrew purpose clause explicitly. It retains the source’s direct, formal marriage terminology without adding doctrinal or social interpretation.
