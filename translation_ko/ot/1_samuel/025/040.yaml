  text: וַ/יָּבֹ֜אוּ עַבְדֵ֥י דָוִ֛ד אֶל אֲבִיגַ֖יִל הַ/כַּרְמֶ֑לָ/ה וַ/יְדַבְּר֤וּ אֵלֶ֨י/הָ֙ לֵ/אמֹ֔ר דָּוִד֙ שְׁלָחָ֣/נוּ אֵלַ֔יִ/ךְ לְ/קַחְתֵּ֥/ךְ ל֖/וֹ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/040.yaml
  text: So David’s servants came to Abigail at Carmel and spoke to her[a], saying, “David has sent us to you to take you for himself as a wife.”
  footnotes:
  - marker: a
    text: Or 'to marry you'; literally, 'to take you ... as a wife.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 다윗의 종들이 갈멜에 있는 아비가일을 찾아가 말했습니다. “다윗이 당신을 자기 아내로 삼기 위해 우리를 당신에게 보냈습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신을 자신을 위하여 아내로 취하다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי דָוִד
  english_pob_choice: David’s servants
  chosen_korean: 다윗의 종들
  alternatives_korean:
  - 다윗의 부하들
  - 다윗의 사람들
  lexicon: HALOT
  rationale: עֶבֶד는 문맥에 따라 ‘종/종사자/신하’가 될 수 있지만, 여기서는 다윗의 사절 역할을 하는 남자들을 가리키므로 ‘종들’이 원문과 가장 가깝습니다.
- source_word: אֶל אֲבִיגַיִל הַכַּרְמֶלָה
  english_pob_choice: to Abigail at Carmel
  chosen_korean: 갈멜의 아비가일에게
  alternatives_korean:
  - 갈멜에 있는 아비가일에게
  - 아비가일에게, 갈멜에서
  lexicon: HALOT
  rationale: 방향 표지 אֶל과 מקום 표지 הַכַּרְמֶלָה를 자연스럽게 살려, 아비가일의 신분이 아니라 장소 표지를 드러내는 ‘갈멜의 아비가일’로 옮겼습니다.
- source_word: שְׁלָחָנוּ אֵלַיִךְ
  english_pob_choice: has sent us to you
  chosen_korean: 우리를 당신에게 보내어
  alternatives_korean:
  - 우리를 당신에게 보냈다고
  - 우리에게 당신께 가라고 하여
  lexicon: HALOT
  rationale: 히브리어는 완료형이지만 사절 발화 안에서 현재적 효력을 가진 파송을 뜻하므로, 한국어에서는 ‘보내어’로 자연스럽게 연결했습니다.
- source_word: לְקַחְתֵּךְ לוֹ לְאִשָּׁה
  english_pob_choice: to take you for himself as a wife
  chosen_korean: 당신을 자기 아내로 삼고자 합니다
  alternatives_korean:
  - 당신을 자기 아내로 맞이하고자 합니다
  - 당신을 아내로 취하고자 합니다
  lexicon: HALOT
  rationale: 결혼 문맥의 לָקַח은 단순한 ‘데려감’보다 ‘아내로 취함’의 의미를 가지므로, 직역을 유지하되 한국어 관용에 맞게 ‘아내로 삼다’로 번역했습니다.
