  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֣ה שָׁמַ֔עְתִּי כִּ֥י גֹזְזִ֖ים לָ֑/ךְ עַתָּ֗ה הָ/רֹעִ֤ים אֲשֶׁר לְ/ךָ֙ הָי֣וּ עִמָּ֔/נוּ לֹ֣א הֶכְלַמְנ֗וּ/ם וְ/לֹֽא נִפְקַ֤ד לָ/הֶם֙ מְא֔וּמָה כָּל יְמֵ֖י הֱיוֹתָ֥/ם בַּ/כַּרְמֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/007.yaml
  text: And now I have heard that you have shearers. Now your shepherds[a], who were with us, we did not mistreat, and nothing of theirs was missing all the days they were in Carmel.
  footnotes:
  - marker: a
    text: Or, more literally, 'we did not shame them.' The Hebrew can denote causing disgrace; in context it refers to not harming or abusing Nabal's shepherds.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내가 들으니 당신에게 털 깎는 사람들이 있다고 합니다. 이제 당신의 목자들[a], 곧 우리와 함께 있던 그 사람들은 우리가 그들을 학대하지 않았고, 그들이 카멜에 머무는 모든 날 동안 그들에게 아무것도 없어지지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리가 그들을 부끄럽게 하지 않았다’입니다. 히브리어는 수치를 주는 행위를 뜻할 수 있으나, 이 문맥에서는 해치거나 학대하지 않았다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה / עַתָּה
  english_pob_choice: And now / Now
  chosen_korean: 이제
  alternatives_korean:
  - 지금
  - 그리고 이제
  lexicon: HALOT
  rationale: 담화 전환과 시간 전환을 함께 살리는 표지로 '이제'가 가장 자연스럽고, 두 번 반복된 말의 긴박감도 유지합니다.
- source_word: שָׁמַעְתִּי כִּי גֹזְזִים לָךְ
  english_pob_choice: I have heard that you have shearers
  chosen_korean: 내가 들으니 당신에게 털 깎는 사람들이 있다고 합니다
  alternatives_korean:
  - 당신에게 털 깎는 사람들이 있다는 말을 들었습니다
  - 당신이 양털 깎는 일꾼들을 두었다고 들었습니다
  lexicon: HALOT
  rationale: ‘털 깎는 사람들’은 shearing season을 드러내면서도 동사의 현재 상황을 살리고, 보고를 전하는 말투에 맞춰 '들으니'로 처리했습니다.
- source_word: הָרֹעִים אֲשֶׁר לְךָ
  english_pob_choice: your shepherds
  chosen_korean: 당신의 목자들
  alternatives_korean:
  - 당신의 목동들
  - 당신에게 속한 목자들
  lexicon: HALOT
  rationale: 문맥상 가축을 치는 종사자들을 가리키므로 전통적 교회어휘보다 기능적으로 '목자들'을 택했습니다.
- source_word: לֹא הֶכְלַמְנוּם
  english_pob_choice: we did not mistreat / we did not dishonor them
  chosen_korean: 우리가 그들을 학대하지 않았고
  alternatives_korean:
  - 우리가 그들을 부끄럽게 하지 않았고
  - 우리가 그들을 욕보이지 않았고
  lexicon: HALOT
  rationale: Hiphil כלם의 수치-가해 의미를 인정하되, 목자 보호 맥락에서는 실제적인 해침을 드러내는 '학대하다'가 가장 오해가 적습니다.
- source_word: וְלֹא נִפְקַד לָהֶם מְאוּמָה
  english_pob_choice: and nothing of theirs was missing / and nothing was missing to them
  chosen_korean: 그들에게 아무것도 없어지지 않았습니다
  alternatives_korean:
  - 그들에게서 아무것도 빠지지 않았습니다
  - 그들의 것은 아무것도 없었습니다
  lexicon: HALOT
  rationale: ‘missing’의 결과 상태를 한국어에서 자연스럽게 표현하면서, 소유 관계와 결핍 상태를 함께 담았습니다.
- source_word: כָּל יְמֵי הֱיוֹתָם בַּכַּרְמֶל
  english_pob_choice: all the days they were in Carmel
  chosen_korean: 그들이 카멜에 머무는 모든 날 동안
  alternatives_korean:
  - 그들이 카멜에 있던 모든 날 동안
  - 그들이 카멜에 있는 동안 내내
  lexicon: HALOT
  rationale: משך הזמן 표현을 한국어 관용으로 풀되, מקום이 아니라 체류 기간임을 분명히 했습니다.
theological_decisions:
- issue: לֹא הֶכְלַמְנוּם의 의미 범위
  chosen_reading: ‘학대하지 않았다’로 옮겨 수치-가해 의미를 실제 보호의 부재 없음으로 풀었습니다.
  alternative_readings:
  - ‘부끄럽게 하지 않았다’
  - ‘욕보이지 않았다’
  - ‘모욕하지 않았다’
  rationale: 본문은 단순한 감정적 모욕보다 양 떼와 목자들을 지켜 준 실제적 안전을 강조하므로, 독자가 맥락적 의도를 바로 이해하도록 했습니다.
  doctrine_reference: 본문-맥락적 어휘 선택
