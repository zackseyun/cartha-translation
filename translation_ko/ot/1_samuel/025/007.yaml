  naturalness: ‘당신에게/당신의’는 이 대화의 현대 한국어 합쇼체에서 다소 부자연스럽고 대면 호칭으로도 거칩니다. 또한 ‘그 사람들은’은 원문의 관계절을 불필요하게 풀어 반복합니다. ‘카멜’은 한국어 성경의 통용 지명 표기인 ‘갈멜’로 고치는 것이 적절합니다.
