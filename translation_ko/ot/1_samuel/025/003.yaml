  chosen_reading: 남편과 아내를 소개하는 서술형 문장으로 자연스럽게 옮겼습니다.
  alternative_readings:
  - 직역에 가깝게 '그 사람/그 여자'를 반복하는 방식
  - 더 강한 대조를 드러내는 문장 배열
  rationale: 원문은 인물 소개의 평서적 구조이므로, 현대 한국어에서 읽히는 자연스러운 소개문으로 재구성하되 내용은 보존했습니다.
  doctrine_reference: 'Translation philosophy #2 (source sense with natural target readability)'
