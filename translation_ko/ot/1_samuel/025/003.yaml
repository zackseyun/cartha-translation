  text: וְ/שֵׁ֤ם הָ/אִישׁ֙ נָבָ֔ל וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ אֲבִגָ֑יִל וְ/הָ/אִשָּׁ֤ה טֽוֹבַת שֶׂ֨כֶל֙ וִ֣/יפַת תֹּ֔אַר וְ/הָ/אִ֥ישׁ קָשֶׁ֛ה וְ/רַ֥ע מַעֲלָלִ֖ים וְ/ה֥וּא כ/לב/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/003.yaml
  text: Now the man's name was Nabal[a], and his wife's name was Abigail. The woman was intelligent and beautiful in appearance, but the man was harsh and evil in his dealings; he was a Calebite.
  footnotes:
  - marker: a
    text: Hebrew probably means 'a Calebite,' that is, a member of Caleb's clan; the written form is unusual, and some note the possibility of reading it differently.
    reason: textual_variant
translation:
  language: ko
  text: 그 사람의 이름은 나발이요, 그의 아내의 이름은 아비가일이었습니다. 그 여자는 총명이 있고 외모도 아름다웠지만, 그 남자는 거칠고 행실이 악하였으니 그는 갈렙 사람이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 보통 '갈렙 사람'으로 이해하지만, 쓰인 형태가 특이하여 다른 읽기 가능성도 제기됩니다.
    reason: textual_variant
lexical_decisions:
- source_word: נָבָל
  english_pob_choice: Nabal
  chosen_korean: 나발
  alternatives_korean:
  - 나발
  lexicon: HALOT
  rationale: 고유명사는 한국어 음역으로 처리하는 것이 가장 자연스럽고, 문맥상 인물 이름을 보존하는 것이 적절합니다.
- source_word: טוֹבַת שֶׂכֶל
  english_pob_choice: intelligent
  chosen_korean: 총명이 있고
  alternatives_korean:
  - 지각이 있고
  - 분별이 있고
  - 총명하고
  lexicon: HALOT
  rationale: 직역형의 '좋은 이해력'보다 인물의 성격을 현대 한국어로 분명히 드러내는 표현이 적절하며, '총명'은 칭찬의 뉘앙스를 유지합니다.
- source_word: וִיפַת תֹּאַר
  english_pob_choice: beautiful in appearance
  chosen_korean: 외모도 아름다웠지만
  alternatives_korean:
  - 아름다웠지만
  - 아름다운 용모였지만
  - 외모가 아름다웠지만
  lexicon: HALOT
  rationale: 문자 그대로의 '형태'보다 외적 아름다움을 드러내는 표현이 원문의 구체적 의미를 자연스럽게 옮깁니다.
- source_word: קָשֶׁה
  english_pob_choice: harsh
  chosen_korean: 거칠고
  alternatives_korean:
  - 완고하고
  - 혹독하고
  - 엄하고
  lexicon: HALOT
  rationale: 대인관계와 성품의 कठ함을 가리키는 문맥이므로, '거칠고'가 현대 한국어에서 가장 자연스럽게 그 뉘앙스를 전달합니다.
- source_word: רַע מַעֲלָלִים
  english_pob_choice: evil in his dealings
  chosen_korean: 행실이 악하였으니
  alternatives_korean:
  - 행동이 악하였으니
  - 악한 일을 하였으니
  - 처신이 악하였으니
  lexicon: HALOT
  rationale: מַעֲלָלִים는 단순한 행위가 아니라 지속적인 행실·처신을 가리키므로, 인격적 평가를 담는 '행실'이 적절합니다.
- source_word: כְּלֵבִי / כלבו
  english_pob_choice: a Calebite
  chosen_korean: 갈렙 사람
  alternatives_korean:
  - 갈렙 족속 사람
  - 갈렙 가문 사람
  - 갈렙 사람
  lexicon: HALOT
  rationale: 영어 POB의 친족/집단 소속 해석을 따라, 전통적 한국어 친숙도와 직역성을 함께 살리는 '갈렙 사람'으로 옮겼습니다.
