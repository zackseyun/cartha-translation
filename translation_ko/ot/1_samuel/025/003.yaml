  text: Now the man's name was Nabal[a], and his wife's name was Abigail. The woman was intelligent and beautiful in appearance, but the man was harsh and evil in his dealings; he was a Calebite.
  footnotes:
  - marker: a
    text: Hebrew probably means 'a Calebite,' that is, a member of Caleb's clan; the written form is unusual, and some note the possibility of reading it differently.
    reason: textual_variant
translation:
  language: ko
  text: 그 사람의 이름은 나발이었고, 그의 아내의 이름은 아비가일이었습니다. 그 여자는 총명하며 용모가 아름다웠습니다. 그러나 그 남자는 거칠고 행실이 악했으며, 그는 갈렙 가문의 사람이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 일반적으로 ‘갈렙 사람’, 곧 갈렙 가문의 사람으로 이해됩니다. 그러나 기록된 히브리어 형태가 특이하여, 다른 읽기 가능성도 논의됩니다.
    reason: textual_variant
