  to: 아비가일이 나발에게 이르렀을 때, 보니 나발은 자기 집에서 왕의 잔치 같은 잔치를 벌이고 있었습니다. 나발의 마음은 즐거웠고, 그는 몹시 술에 취해 있었습니다. 그래서 아비가일은 그에게 작은 일이든 큰 일이든 아무것도[a] 아침 빛이 밝아올 때까지[b] 말하지 않았습니다.
