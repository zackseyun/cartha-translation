source:
  edition: WLC
  text: וַ/תָּבֹ֣א אֲבִיגַ֣יִל אֶל נָבָ֡ל וְ/הִנֵּה ל/וֹ֩ מִשְׁתֶּ֨ה בְּ/בֵית֜/וֹ כְּ/מִשְׁתֵּ֣ה הַ/מֶּ֗לֶךְ וְ/לֵ֤ב נָבָל֙ ט֣וֹב עָלָ֔י/ו וְ/ה֥וּא שִׁכֹּ֖ר עַד מְאֹ֑ד וְ/לֹֽא הִגִּ֣ידָה לּ֗/וֹ דָּבָ֥ר קָטֹ֛ן וְ/גָד֖וֹל עַד א֥וֹר הַ/בֹּֽקֶר׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/036.yaml
  text: When Abigail came to Nabal[a], behold, he was holding a feast in his house like the feast of a king, and Nabal’s heart was merry within him, and he was very drunk. So she told him nothing at all, small or great[b], until the light of morning.
  footnotes:
  - marker: a
    text: 'Hebrew: ''small or great,'' an idiom meaning ''nothing at all.'''
    reason: lexical_alternative
  - marker: b
    text: 'Or ''until daybreak.'' Hebrew: ''until the light of morning.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 아비가일이 나발에게 오니, 보라, 그의 집에 왕의 잔칫상과 같은 잔치가 있었고, 나발의 마음은 그에게 좋았으며 그는 아주 취해 있었습니다. 그래서 그녀는 아침 햇살이 비칠 때까지 그에게 작은 일도 큰 일도 아무것도 말하지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘작은 일도 큰 일도’는 히브리어 관용구로, ‘아무것도’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘아침의 빛이 비칠 때까지’이며, ‘새벽까지’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא אֲבִיגַיִל אֶל נָבָל
  english_pob_choice: When Abigail came to Nabal
  chosen_korean: 아비가일이 나발에게 오니
  alternatives_korean:
  - 아비가일이 나발에게 왔을 때
  - 아비가일이 나발에게 이르렀는데
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리면서, 동작의 도착·진입을 간결하게 전달했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보라
  alternatives_korean:
  - 그런데
  - 여기
  lexicon: HALOT
  rationale: 장면을 갑작스럽게 드러내는 지시적 감탄을 유지하기 위해 직접적인 감탄사형을 택했습니다.
- source_word: מִשְׁתֶּה ... כְּמִשְׁתֵּה הַמֶּלֶךְ
  english_pob_choice: a feast ... like the feast of a king
  chosen_korean: 잔칫상과 같은 잔치
  alternatives_korean:
  - 왕의 잔치 같은 잔치
  - 임금의 잔치 같은 잔치
  lexicon: HALOT
  rationale: מִשְׁתֶּה의 잔치/연회성을 살리되, 비교구문을 유지하여 왕처럼 호화로운 잔치라는 뉘앙스를 전달했습니다.
- source_word: לֵב נָבָל טוֹב עָלָיו
  english_pob_choice: Nabal’s heart was merry within him
  chosen_korean: 나발의 마음은 그에게 좋았으며
  alternatives_korean:
  - 나발의 마음은 그 안에서 즐거웠으며
  - 나발의 마음은 그에게서 흡족했으며
  lexicon: HALOT
  rationale: 직역에 가까운 ‘마음이 좋다’는 한국어로 내부 상태를 유지하면서도, 과도한 의역 없이 한글 문맥에서 자연스럽게 만들었습니다.
- source_word: וְה֥וּא שִׁכֹּ֖ר עַד מְאֹד
  english_pob_choice: he was very drunk
  chosen_korean: 그는 아주 취해 있었습니다
  alternatives_korean:
  - 그는 몹시 취해 있었습니다
  - 그는 매우 술에 취해 있었습니다
  lexicon: HALOT
  rationale: שִׁכֹּר의 의미를 분명히 하되, 현대 한국어에서 지나치게 노골적이거나 구어적인 표현을 피했습니다.
- source_word: דָּבָ֥ר קָטֹ֛ן וְגָד֖וֹל
  english_pob_choice: nothing at all, small or great
  chosen_korean: 작은 일도 큰 일도 아무것도
  alternatives_korean:
  - 크고 작은 일도 아무것도
  - 크든 작든 아무 일도
  lexicon: HALOT
  rationale: ‘작은 일과 큰 일’의 관용적 총칭을 한국어로 살리면서, 부정의 범위를 자연스럽게 드러냈습니다.
- source_word: עַד א֥וֹר הַבֹּקֶר
  english_pob_choice: until the light of morning
  chosen_korean: 아침 햇살이 비칠 때까지
  alternatives_korean:
  - 새벽빛이 비칠 때까지
  - 아침 빛이 비칠 때까지
  lexicon: HALOT
  rationale: ‘아침의 빛’이라는 이미지를 한국어의 자연스러운 시간 표현으로 옮겼습니다.
theological_decisions:
- issue: 서사적 긴장과 절제된 정보 제시
  chosen_reading: 아비가일이 술에 취한 나발에게 즉시 사실을 알리지 않고 다음 날까지 침묵하는 흐름을 그대로 살렸습니다.
  alternative_readings:
  - 그녀는 아무 말도 하지 않았다
  - 그녀는 그에게 끝내 말하지 않았다
  rationale: 본문은 지혜로운 보류를 서술하며, 지연의 목적을 암시적으로 드러냅니다. 그 시간적 절제를 약화시키지 않도록 그대로 반영했습니다.
  doctrine_reference: '본문 주해 원리: 서사 문맥의 암시 유지'
- issue: ‘마음은 그에게 좋았다’의 감정 상태
  chosen_reading: נָבָל의 내적 상태를 도덕적 평가로 바꾸지 않고, 잔치와 취함 속의 기분 상태로 읽었습니다.
  alternative_readings:
  - 마음이 기뻤습니다
  - 마음이 평안했습니다
  rationale: 히브리어 표현은 정서적 상태를 말하며, 여기서는 본문의 술취함과 잔치 분위기를 따라가는 것이 가장 직접적입니다.
  doctrine_reference: '본문 주해 원리: 관용구의 정서적·서사적 맥락 보존'
