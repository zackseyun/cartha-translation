theological_decisions:
- issue: 서사적 긴장과 절제된 정보 제시
  chosen_reading: 아비가일이 술에 취한 나발에게 즉시 사실을 알리지 않고 다음 날까지 침묵하는 흐름을 그대로 살렸습니다.
  alternative_readings:
  - 그녀는 아무 말도 하지 않았다
  - 그녀는 그에게 끝내 말하지 않았다
  rationale: 본문은 지혜로운 보류를 서술하며, 지연의 목적을 암시적으로 드러냅니다. 그 시간적 절제를 약화시키지 않도록 그대로 반영했습니다.
  doctrine_reference: '본문 주해 원리: 서사 문맥의 암시 유지'
- issue: ‘마음은 그에게 좋았다’의 감정 상태
  chosen_reading: נָבָל의 내적 상태를 도덕적 평가로 바꾸지 않고, 잔치와 취함 속의 기분 상태로 읽었습니다.
  alternative_readings:
  - 마음이 기뻤습니다
  - 마음이 평안했습니다
  rationale: 히브리어 표현은 정서적 상태를 말하며, 여기서는 본문의 술취함과 잔치 분위기를 따라가는 것이 가장 직접적입니다.
  doctrine_reference: '본문 주해 원리: 관용구의 정서적·서사적 맥락 보존'
