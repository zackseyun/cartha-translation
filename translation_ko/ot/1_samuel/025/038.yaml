lexical_decisions:
- source_word: וַיְהִי כַּעֲשֶׂרֶת הַיָּמִים
  english_pob_choice: And about ten days later
  chosen_korean: 그리고 약 열흘쯤 후에
  alternatives_korean:
  - 그리고 열흘쯤 뒤에
  - 약 열흘 후에
  lexicon: HALOT
  rationale: 히브리어의 כְּ는 대략성을 나타내므로 ‘약’과 ‘쯤’으로 그 뉘앙스를 살리고, 서사 진행은 ‘후에’로 자연스럽게 옮겼습니다.
- source_word: וַיִּגֹּף
  english_pob_choice: struck
  chosen_korean: 치시니
  alternatives_korean:
  - 치셨습니다
  - 내리치시니
  - 치셨고
  lexicon: HALOT
  rationale: נָגַף는 단순히 ‘치다/때리다’보다 ‘치시다’가 직역에 가깝고, 여기서는 신적 심판의 직접성을 드러내되 기계적으로 ‘쳤다’에만 묶이지 않도록 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default / DOCTRINE.md
  rationale: 본문의 신명은 직함이 아니라 고유명사이므로 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וַיָּמֹת
  english_pob_choice: and he died
  chosen_korean: 그가 죽었습니다
  alternatives_korean:
  - 그가 죽었습니다
  - 그가 죽고 말았습니다
  lexicon: HALOT
  rationale: 히브리어의 단순한 서술형 동사를 과장하지 않고, 사건의 결과를 सीधे하게 ‘죽었습니다’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접적 심판 표현
  chosen_reading: 야훼께서 나발을 치시니, 그가 죽었습니다
  alternative_readings:
  - 야훼께서 나발을 치셔서 그가 죽었습니다
  - 야훼께서 나발을 죽이셨습니다
  rationale: 히브리어는 ‘치다’와 ‘죽다’를 연속된 두 동사로 제시하므로, 심판의 직접성은 살리되 인과를 한 동작으로 합쳐 버리는 해석적 축약은 피했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
