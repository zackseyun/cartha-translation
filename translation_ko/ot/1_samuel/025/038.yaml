translation:
  language: ko
  text: 그리고 약 열흘쯤 후에 야훼께서 나발을 치시니, 그가 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘약 열흘 후에’. 히브리어 표현은 대략적인 열흘의 기간을 가리킵니다.
