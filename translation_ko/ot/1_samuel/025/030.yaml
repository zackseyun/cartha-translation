  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יַעֲשֶׂ֤ה יְהוָה֙ לַֽ/אדֹנִ֔/י כְּ/כֹ֛ל אֲשֶׁר דִּבֶּ֥ר אֶת הַ/טּוֹבָ֖ה עָלֶ֑י/ךָ וְ/צִוְּ/ךָ֥ לְ/נָגִ֖יד עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/030.yaml
  text: And when Yahweh has done for my lord according to all the good that he spoke concerning you[a], and has appointed you ruler over Israel[b],
  footnotes:
  - marker: a
    text: Or 'the good he promised you.' The Hebrew says literally 'the good' that the LORD spoke concerning David.
    reason: lexical_alternative
  - marker: b
    text: Or 'has commanded/charged you to be leader over Israel.' The verb can mean 'command,' but here likely carries the sense of appointing or commissioning to rule.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 내 주님에게 당신에 관하여 말씀하신 모든 좋은 일을 이루시고, 당신을 이스라엘의 지도자로 세우실 때입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신에게 약속하신 좋은 일’입니다. 히브리어는 문자적으로 ‘그 좋은 것’을 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘의 지도자가 되도록 당신을 명령/위임하셨고’입니다. 동사는 ‘명령하다’일 수 있으나, 여기서는 통치 직분에 임명하는 뜻이 더 강합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And when
  chosen_korean: …하실 때입니다
  alternatives_korean:
  - 그리고 ~할 때
  - 그리고 ~하게 되면
  lexicon: HALOT
  rationale: 히브리어 관용의 미래 조건절을 현대 한국어에서는 자연스럽게 ‘~하실 때입니다’로 풀어, 예언적 전망을 살리면서도 문어체의 어색함을 줄였습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기적 고유명사를 제목이나 호칭으로 바꾸지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: לַאדֹנִי
  english_pob_choice: for my lord
  chosen_korean: 내 주님에게
  alternatives_korean:
  - 내 주인에게
  - 내 주께
  lexicon: HALOT
  rationale: 다윗에 대한 아비가일의 공손한 호칭을 살리되, 본문의 관계성을 반영하여 ‘내 주님’으로 옮겼습니다.
- source_word: וְצִוְּךָ לְנָגִיד
  english_pob_choice: and has appointed you ruler
  chosen_korean: 당신을 … 지도자로 세우실
  alternatives_korean:
  - 당신에게 … 명령하시고
  - 당신을 … 다스리는 자로 임명하실
  lexicon: HALOT
  rationale: צוה가 כאן에서는 단순 명령보다 직분 부여·위임의 뉘앙스를 띠므로, POB의 판단을 따라 ‘세우시다’로 표현했습니다. ‘지도자’는 נָגִיד의 통치적 역할을 현대적으로 전달합니다.
theological_decisions:
- issue: 여호와/야훼의 신명기 고유명사 처리
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 직접 신명기를 사용하므로 титул로 바꾸지 않고, POB 기본 방침에 따라 고유명사를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
