    rationale: 현대 한국어에서 ‘당신’은 공손한 호칭으로 안정적이지 않으며, 아비가일의 공손한 발화라는 문맥을 충분히 드러내지 못합니다. ‘주인님’을 사용하면 לַאדֹנִי의 존대와 2인칭 지시를 자연스럽게 유지합니다.
