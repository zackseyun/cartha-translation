  lexicon: HALOT
  rationale: 다윗에 대한 아비가일의 공손한 호칭을 살리되, 본문의 관계성을 반영하여 ‘내 주님’으로 옮겼습니다.
- source_word: וְצִוְּךָ לְנָגִיד
  english_pob_choice: and has appointed you ruler
  chosen_korean: 당신을 … 지도자로 세우실
  alternatives_korean:
  - 당신에게 … 명령하시고
  - 당신을 … 다스리는 자로 임명하실
  lexicon: HALOT
  rationale: צוה가 כאן에서는 단순 명령보다 직분 부여·위임의 뉘앙스를 띠므로, POB의 판단을 따라 ‘세우시다’로 표현했습니다. ‘지도자’는 נָגִיד의 통치적 역할을 현대적으로 전달합니다.
