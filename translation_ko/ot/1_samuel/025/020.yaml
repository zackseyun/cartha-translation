base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/020.yaml
  text: And as she was riding on the donkey and going down under cover of the mountain[a], behold, David and his men were coming down to meet her, and she met them.
  footnotes:
  - marker: a
    text: Or 'on the hidden side of the mountain.' The Hebrew phrase refers to a concealed or sheltered area of the mountain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 나귀를 타고 산의 숨은 쪽 아래로 내려가고 있을 때, 보십시오, 다윗과 그의 사람들이 그녀를 향해 내려오고 있었고, 그녀가 그들을 만났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘산의 숨은 쪽’은 히브리어 בְּסֵתֶר הָהָר의 은폐·가려짐 뉘앙스를 살린 번역입니다. 대안으로는 ‘산의 숨은 편’ 또는 ‘산의 뒤편’이 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה הִיא
  english_pob_choice: And as she was
  chosen_korean: 그녀가 …하고 있을 때
  alternatives_korean:
  - 그리고 그녀는 …했습니다
  - 이때 그녀는 …하고 있었습니다
  lexicon: HALOT
  rationale: 히브리어 היה와 분사 구문은 진행 중인 배경 상황을 여는 역할이므로, 한국어에서는 자연스러운 시간절로 풀어 현재 진행성을 살렸습니다.
- source_word: רֹכֶבֶת עַל הַחֲמוֹר
  english_pob_choice: riding on the donkey
  chosen_korean: 나귀를 타고
  alternatives_korean:
  - 당나귀에 올라타고
  - 나귀 위에 타고
  lexicon: HALOT
  rationale: חמור는 현대 한국어 성경 문맥에서 보통 나귀로 옮기는 것이 자연스럽고, רכב의 ‘타다’ 의미를 간결하게 반영합니다.
- source_word: בְּסֵתֶר הָהָר
  english_pob_choice: under cover of the mountain
  chosen_korean: 산의 숨은 쪽 아래로
  alternatives_korean:
  - 산의 은밀한 쪽으로
  - 산의 가려진 곳으로
  - 산 뒤편으로
  lexicon: HALOT
  rationale: סתר는 단순한 지리적 ‘뒤편’보다 숨김·가려짐의 뉘앙스를 가지므로, POB의 해석을 따라 ‘숨은 쪽’으로 옮겨 은폐 의미를 드러냈습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자, 보십시오
  lexicon: HALOT
  rationale: 화면 전환처럼 주의를 끄는 הנה의 담화 기능을 살리되, 현대 한국어 합쇼체 서술에 맞게 ‘보십시오’로 자연화했습니다.
- source_word: יֹרְדִים לִקְרָאתָהּ
  english_pob_choice: were coming down to meet her
  chosen_korean: 그녀를 향해 내려오고 있었고
  alternatives_korean:
  - 그녀를 만나러 내려오고 있었고
  - 그녀 쪽으로 내려오고 있었고
  lexicon: HALOT
  rationale: לקראת는 단순한 이동 방향을 뜻하므로, 목적을 과도하게 강하게 만들지 않도록 ‘향해’로 옮겼습니다.
