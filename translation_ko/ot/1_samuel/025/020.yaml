    rationale: לִקְרַאת은 누군가를 만나거나 맞이하는 방향으로 나아감을 나타냅니다. 단순 방향 표현보다 ‘그녀를 만나려고’가 문맥과 어휘 의미를 더 정확히 전달합니다.
