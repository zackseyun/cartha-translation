base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/041.yaml
  text: She rose and bowed with her face to the ground and said[a], “Behold[b], your slave is a maidservant to wash the feet of the servants of my lord.”
  footnotes:
  - marker: a
    text: Or “your maidservant is for a maidservant,” preserving the two closely related Hebrew terms for a female servant/slave.
    reason: lexical_alternative
  - marker: b
    text: “Bowed with her face to the ground” refers to a posture of deep obeisance; alternatively, “prostrated herself.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 일어나 얼굴을 땅에 대고 절하며 말했습니다. 「보십시오. 당신의 종은 내 주님의 종들의 발을 씻어 드리는 여종입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘얼굴을 땅에 대고 절하다’는 깊은 경배의 자세를 가리킵니다. 직역하면 ‘엎드리다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  english_pob_choice: She rose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어났습니다
  - 몸을 일으켰습니다
  lexicon: WLC/HALOT
  rationale: 서사적 연속 동작을 자연스럽게 살리면서도 원문의 단순한 기상 동작을 과장하지 않기 위해 ‘일어나’로 옮겼습니다.
- source_word: וַתִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  english_pob_choice: bowed with her face to the ground
  chosen_korean: 얼굴을 땅에 대고 절하며
  alternatives_korean:
  - 얼굴을 땅에 대고 엎드리며
  - 땅에 얼굴을 대고 몸을 굽혀
  lexicon: WLC/HALOT
  rationale: 깊은 경배의 자세를 드러내는 관용구이므로, 단순한 ‘절하다’보다 신체 자세를 함께 보여 주는 표현으로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보소서
  lexicon: HALOT
  rationale: 자기 비하적 진술을 여는 지시어로서 문어적이면서도 현대 한국어에서 자연스러운 호격성을 살리기 위해 ‘보십시오’를 택했습니다.
- source_word: אֲמָתְךָ
  english_pob_choice: your slave
  chosen_korean: 당신의 종은
  alternatives_korean:
  - 당신의 여종은
  - 당신의 여자 종은
  lexicon: HALOT
  rationale: 히브리어 אָמָה의 여성형이고, 본문의 겸손한 자기지칭을 살리면서도 한국어에서 가장 자연스럽게 읽히는 ‘종’으로 옮겼습니다.
- source_word: לְשִׁפְחָה
  english_pob_choice: a maidservant
  chosen_korean: 여종입니다
  alternatives_korean:
  - 여자 종입니다
  - 종입니다
  lexicon: HALOT
  rationale: שִׁפְחָה의 여성 종속성을 드러내기 위해 ‘여종’으로 번역해, 앞의 ‘종’과 구별되는 낮춤의 뉘앙스를 유지했습니다.
- source_word: עַבְדֵי
  english_pob_choice: the servants of
  chosen_korean: 종들의
  alternatives_korean:
  - 하인들의
  - 노예들의
  lexicon: HALOT
  rationale: DAVID의 집안 사람들을 가리키는 일반적 종속 신분 표현이므로, 프로젝트 기본어인 ‘종’으로 일관되게 옮겼습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주님의
  alternatives_korean:
  - 나의 주인의
  - 내 주인의
  lexicon: HALOT
  rationale: 인물에 대한 공손한 호칭을 현대 한국어의 예의체로 자연스럽게 재현하기 위해 ‘내 주님’보다 관계를 분명히 하는 ‘내 주님의’ 구조를 사용했습니다.
theological_decisions:
- issue: 아마(אֲמָתְךָ)와 시프하(לְשִׁפְחָה)의 여성 종속 용어를 어떻게 구별할지
  chosen_reading: ‘당신의 종은 … 여종입니다’로 번역해 두 표현의 차이를 살리되, 한국어 문장은 매끄럽게 유지했습니다.
  alternative_readings:
  - 두 표현을 모두 ‘여종’으로 통일
  - 두 표현을 모두 ‘여자 종’으로 통일
  rationale: 두 용어는 서로 밀접하지만 동일어는 아니므로, 본문이 담은 낮춤의 수사적 강도를 완화하지 않도록 구별을 유지했습니다. 다만 한국어에서는 과도한 직역보다 예의체 문장 흐름이 더 중요하므로, 첫 번째는 일반적 자기지칭인 ‘종’, 두 번째는 성별이 드러나는 ‘여종’으로 조합했습니다.
  doctrine_reference: Translation philosophy §§1, 5
