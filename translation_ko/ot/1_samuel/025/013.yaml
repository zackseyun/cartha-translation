  rationale: 히브리어 명령형의 군사적 긴박함은 유지하되, 서술 전체는 현대 합쇼체로 맞추기 위해 공손한 명령형을 사용했습니다.
  doctrine_reference: 문체 일관성 및 서사체 번역 원칙
