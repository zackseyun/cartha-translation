base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/013.yaml
  text: Then David said to his men[a], “Each man strap on his sword.” So each man strapped on his sword, and David also strapped on his sword. About four hundred men went up after David, while two hundred stayed with the supplies.
  footnotes:
  - marker: a
    text: Or “with the baggage” or “by the equipment.”
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 자기 부하들에게 말했습니다. “각자 칼을 차십시오.” 그러자 그들은 저마다 칼을 찼고, 다윗도 자기 칼을 찼습니다. 약 사백 명이 다윗을 따라 올라갔고, 이백 명은 짐을 지키며 남아 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘짐을 지키며’에 해당하는 말은 문자적으로 ‘장비/물품 곁에’라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: לַאֲנָשָׁיו
  english_pob_choice: to his men
  chosen_korean: 자기 부하들에게
  alternatives_korean:
  - 자기 사람들에게
  - 자기 군사들에게
  lexicon: HALOT
  rationale: 이 문맥의 אֲנָשִׁים은 단순한 ‘사람들’이 아니라 다윗의 무장한 추종자들이므로, 현대 한국어에서 군사적 소속감을 드러내는 ‘부하들’이 가장 자연스럽습니다.
- source_word: חִגְרוּ
  english_pob_choice: strap on
  chosen_korean: 칼을 차십시오
  alternatives_korean:
  - 칼을 매십시오
  - 칼을 띠십시오
  lexicon: HALOT
  rationale: חגר는 무기를 허리에 묶어 착용하는 동작이므로, 한국어에서는 ‘차다’가 가장 직접적이고 자연스럽게 그 동작을 전달합니다.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  english_pob_choice: about four hundred men
  chosen_korean: 약 사백 명
  alternatives_korean:
  - 대략 사백 명
  - 사백 명가량
  lexicon: HALOT
  rationale: 앞의 כ는 대략을 나타내므로, 숫자를 단정하지 않는 ‘약’으로 그 뉘앙스를 살렸습니다.
- source_word: עַל הַכֵּלִים
  english_pob_choice: with the supplies
  chosen_korean: 물품 곁에
  alternatives_korean:
  - 짐 곁에
  - 장비 곁에
  lexicon: HALOT
  rationale: כֵּלִים은 넓게는 장비·물품·짐을 가리킬 수 있으나, 여기서는 이동 중인 일행의 보급품/짐을 뜻하므로 의미를 좁혀 ‘물품 곁에’로 옮겼습니다.
