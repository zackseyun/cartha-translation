theological_decisions:
- issue: 나발의 이름과 ‘어리석음’ 사이의 말장난을 본문에서 어떻게 드러낼지
  chosen_reading: 이름을 음역한 뒤 곧바로 ‘어리석음이 따릅니다’로 대응시켜, 이름-성품의 연결을 본문 안에서 보존했습니다.
  alternative_readings:
