base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/025.yaml
  text: 'Please[a], my lord, do not set your heart on this worthless man, on Nabal, for as his name is, so is he: Nabal is his name, and folly is with him. But I, your servant, did not see the young men of my lord whom you sent.'
  footnotes:
  - marker: a
    text: The name 'Nabal' sounds like the Hebrew word for 'foolish' or 'folly,' and Abigail's statement is a deliberate wordplay.
    reason: lexical_alternative
translation:
  language: ko
  text: “부디, 내 주인님, 이 무가치한 사람, 곧 나발[a]에게 마음을 두지 마십시오. 그의 이름이 그러하듯, 그도 그러합니다. 나발이 그의 이름이며, 어리석음이 그와 함께합니다. 그러나 저는 주인님의 여종으로서, 주인님께서 보내신 젊은이들을 보지 못했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나발’이라는 이름은 히브리어에서 ‘어리석은 자’ 또는 ‘어리석음’을 뜻하는 말과 의도적인 말놀이를 이룹니다.
    reason: lexical_alternative
