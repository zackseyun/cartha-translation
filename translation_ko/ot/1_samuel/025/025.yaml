  - 주석으로만 말장난을 처리하기
  rationale: 본문이 노리는 수사적 효과는 이름 자체의 소리와 의미를 겹쳐 읽게 하는 데 있으므로, 음역을 유지하되 의미를 본문에 함께 드러내는 편이 가장 충실합니다.
