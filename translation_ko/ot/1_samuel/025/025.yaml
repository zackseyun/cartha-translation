base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/025.yaml
  text: 'Please[a], my lord, do not set your heart on this worthless man, on Nabal, for as his name is, so is he: Nabal is his name, and folly is with him. But I, your servant, did not see the young men of my lord whom you sent.'
  footnotes:
  - marker: a
    text: The name 'Nabal' sounds like the Hebrew word for 'foolish' or 'folly,' and Abigail's statement is a deliberate wordplay.
    reason: lexical_alternative
translation:
  language: ko
  text: “부디, 내 주님, 이 무가치한 사람—나발—에게 마음을 두지 마십시오. 그의 이름이 그러하듯 그도 그러합니다. 나발이 그의 이름이고, 그에게는 어리석음이 따릅니다. 그러나 저는 당신의 종으로서, 당신께서 보내신 내 주님의 젊은이들을 보지 못했습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나발’은 히브리어로 ‘어리석음’과 소리가 겹치는 이름으로, 아비가일의 말에는 의도적인 말장난이 들어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא יָשִׂים אֲדֹנִי אֶת לִבּוֹ אֶל
  english_pob_choice: Please, my lord, do not set your heart on
  chosen_korean: 부디, 내 주님, …에게 마음을 두지 마십시오
  alternatives_korean:
  - …에 마음을 두지 마십시오
  - …을 마음에 두지 마십시오
  - …에 관심을 두지 마십시오
  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘마음을 ~에게 두다’를 살리되, 한국어에서는 자연스럽게 ‘마음을 두지 마십시오’로 옮겨 주의·관심을 두는 뜻을 보존했습니다.
- source_word: אִישׁ הַבְּלִיַּעַל הַזֶּה
  english_pob_choice: this worthless man
  chosen_korean: 이 무가치한 사람
  alternatives_korean:
  - 이 악한 사람
  - 이 불량한 사람
  - 이 쓸모없는 사람
  lexicon: HALOT
  rationale: בְּלִיַּעַל은 고유명사가 아니라 도덕적 무가치함을 가리키는 말이므로, POB의 ‘worthless’에 맞춰 ‘무가치한’으로 직역에 가깝게 처리했습니다.
- source_word: כִּי כִשְׁמוֹ כֶּן הוּא ... וּנְבָלָה עִמּוֹ
  english_pob_choice: for as his name is, so is he ... and folly is with him
  chosen_korean: 그의 이름이 그러하듯 그도 그러합니다. 나발이 그의 이름이고, 그에게는 어리석음이 따릅니다
  alternatives_korean:
  - 이름처럼 그도 그렇습니다. 나발이 그의 이름이고, 어리석음이 그와 함께 있습니다
  - 이름이 뜻하듯 그는 그렇습니다. 나발이 그의 이름이고, 어리석음이 그에게 있습니다
  lexicon: HALOT
  rationale: 이 구절의 핵심은 이름과 인물의 성품을 잇는 말장난이므로, 본문 구조를 유지하면서 ‘나발/어리석음’의 연결이 드러나도록 옮겼습니다.
- source_word: אֲמָתְךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종으로서
  alternatives_korean:
  - 당신의 여종으로서
  - 당신의 여종입니다
  - 당신의 종입니다
  lexicon: HALOT
  rationale: 히브리어는 여성 종을 가리키지만, 한국어 본문에서는 고백적 겸손을 우선하여 너무 낡거나 성별 표지가 강한 표현을 피하고 ‘종으로서’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 나발의 이름과 ‘어리석음’ 사이의 말장난을 본문에서 어떻게 드러낼지
  chosen_reading: 이름을 음역한 뒤 곧바로 ‘어리석음이 따릅니다’로 대응시켜, 이름-성품의 연결을 본문 안에서 보존했습니다.
  alternative_readings:
  - ‘나발’ 대신 ‘어리석은 자’로 의미 번역하기
  - 주석으로만 말장난을 처리하기
  rationale: 본문이 노리는 수사적 효과는 이름 자체의 소리와 의미를 겹쳐 읽게 하는 데 있으므로, 음역을 유지하되 의미를 본문에 함께 드러내는 편이 가장 충실합니다.
  doctrine_reference: 본문 수사 보존 원칙
