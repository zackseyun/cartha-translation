  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת אֲחִינֹ֛עַם לָקַ֥ח דָּוִ֖ד מִֽ/יִּזְרְעֶ֑אל וַ/תִּהְיֶ֛יןָ גַּֽם שְׁתֵּי/הֶ֥ן ל֖/וֹ לְ/נָשִֽׁים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/043.yaml
  text: David also took Ahinoam of Jezreel[b][a], and both of them became his wives.
  footnotes:
  - marker: a
    text: Or 'Ahinoam of Jezreel' / 'Ahinoam the Jezreelite.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'and both of them became wives to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 또 이즈르엘 출신 아히노암을 맞아들였고, 두 여인 모두 그의 아내가 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 지명과 결합한 출신 표지이므로, 자연스러운 한국어로는 '이즈르엘 출신' 또는 '이즈르엘 사람'이 가능합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 '그 두 사람 모두 그에게 아내가 되었다'는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת אֲחִינֹעַם
  english_pob_choice: David also took Ahinoam
  chosen_korean: 다윗은 또 아히노암을 맞아들였고
  alternatives_korean:
  - 다윗은 또 아히노암을 데려왔고
  - 다윗은 또 아히노암을 취하였고
  lexicon: HALOT
  rationale: לָקַח는 문자적으로는 '취하다/데려가다'이지만, 결혼 맥락에서는 아내로 맞아들인다는 뜻이므로 한국어에서는 '맞아들이다'로 자연스럽게 옮겼습니다.
- source_word: מִיִּזְרְעֶל
  english_pob_choice: of Jezreel
  chosen_korean: 이즈르엘 출신
  alternatives_korean:
  - 이즈르엘의
  - 이즈르엘 사람
  lexicon: HALOT
  rationale: מִן과 지명 결합은 출신지 표지이므로, 단순 소유보다 사람의 출신을 드러내는 '출신'이 가장 자연스럽고 원문 의미를 잘 반영합니다.
- source_word: וַ/תִּהְיֶ֛יןָ גַּֽם שְׁתֵּי/הֶ֥ן
  english_pob_choice: and both of them became
  chosen_korean: 두 여인 모두 그의 아내가 되었습니다
  alternatives_korean:
  - 그 둘 모두 그의 아내가 되었습니다
  - 두 사람 모두 그에게 아내가 되었습니다
  lexicon: HALOT
  rationale: 복수 주어 '두 여인'과 היה 동사의 결과 상태를 살려, 단순한 보유 관계가 아니라 아내가 '되었다'는 서술을 유지했습니다.
- source_word: לְ/נָשִׁים
  english_pob_choice: his wives
  chosen_korean: 그의 아내가 되었습니다
  alternatives_korean:
  - 그의 아내들이 되었습니다
  - 그에게 아내들이 되었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 '그에게 아내로'라는 뜻이므로, 한국어에서는 관용적이면서도 복수 결혼 관계가 분명한 표현으로 옮겼습니다.
theological_decisions:
- issue: 다윗의 복수 결혼을 직접적으로 제시하는 표현
  chosen_reading: 본문의 서술을 완곡하게 돌리지 않고, 두 여인이 다윗의 아내가 되었음을 그대로 드러냈습니다.
  alternative_readings:
  - 보다 완곡하게 '함께 살게 되었습니다'로 처리하는 번역
  rationale: 히브리어 본문은 결혼 상태를 명시하므로, 도덕적 평가를 덧붙이거나 관계를 흐리지 않고 서술적 의미를 유지하는 것이 적절합니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 바를 보존하고, 본문이 말하지 않는 판단을 덧붙이지 않습니다.'
