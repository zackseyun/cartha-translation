  source_fidelity: וַאֲמַרְתֶּם כֹּה의 명령적 연속과 세 차례 반복되는 שָׁלוֹם의 축복을 유지해야 합니다. לֶחָי는 문법·관용상 난해하나, 이 문맥에서는 상대에게 장수를 비는 인사/축복으로 옮기는 것이 한국어 본문에서 자연스럽고 의미상 안전합니다. ‘산 자에게’는 한국어에서 이 수신자에게 자연스러운 호격이나 인사말로 기능하지 않습니다.
  naturalness: 초안의 ‘산 자에게:’는 현대 표준 한국어에서 부자연스럽고, 뒤의 ‘평강이 있습니다’는 축원이라기보다 사실 진술처럼 들립니다. 축원형 ‘…하시기를 바랍니다’로 옮기면 합쇼체와 담화 기능이 분명해집니다.
  terminology: שָׁלוֹם은 반복을 보존하여 ‘평강’으로 통일할 수 있습니다. ‘집’은 물리적 건물보다 가정·집안을 포함하므로 본문에서는 ‘집안’이 현대 한국어에서 더 정확하고 자연스럽습니다. ‘당신’의 반복은 현대 한국어에서 어색하거나 대립적으로 들릴 수 있으므로 생략합니다.
  issues:
  - severity: medium
    issue: לֶחָי를 ‘산 자에게’로 번역함
    rationale: 히브리어의 난해함을 형식적으로 따라가려 했으나, 한국어에서는 나발에게 전하는 인사·축복으로 이해되지 않고 의미가 불명확합니다. 문맥상 가능한 축복적 의미를 ‘오래 사시기를 바랍니다’로 옮기고, 각주에서 직역 및 해석상의 불확실성을 밝혀야 합니다.
  - severity: medium
    issue: ‘평강이 있습니다’가 축복문을 서술문으로 바꿈
    rationale: 반복된 무동사 שָׁלוֹם절은 이 문맥에서 상대와 그의 집 및 소유에 대한 축원입니다. ‘있기를 바랍니다’가 한국어 축원 기능을 적절히 나타냅니다.
  - severity: low
    issue: ‘당신의 집’ 및 ‘당신에게 속한 모든 것’의 반복
    rationale: 문법적으로 가능하지만 현대 한국어의 대면 발화에서는 ‘당신’이 어색할 수 있습니다. 소유 표지를 생략해도 원문의 지시 대상과 포괄성은 유지됩니다.
  revised_text: 그리고 이렇게 말하십시오. ‘오래 사시기를 바랍니다! 평강이 있기를 바랍니다. 집안에 평강이 있기를 바라며, 소유한 모든 것에 평강이 있기를 바랍니다.’
