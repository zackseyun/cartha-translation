source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֥ם כֹּ֖ה לֶ/חָ֑י וְ/אַתָּ֤ה שָׁלוֹם֙ וּ/בֵיתְ/ךָ֣ שָׁל֔וֹם וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/006.yaml
  text: 'And say this: ‘To the living one: Peace to you[a], peace to your house[b], and peace to all that is yours.’'
  footnotes:
  - marker: a
    text: Hebrew 'to life' is likely an idiomatic greeting or blessing, hence 'Long life to you.' Some translations render it more generally as 'Greetings' or 'To him who lives.'
    reason: alternative_reading
  - marker: b
    text: '''Peace'' translates Hebrew shalom, which can also carry the sense of well-being, wholeness, or prosperity.'
    reason: lexical_alternative
translation:
  language: ko
  text: '그리고 이렇게 말하십시오. ‘산 자에게: 당신에게 평강이 있습니다[a]. 당신의 집에 평강이 있습니다[b]. 그리고 당신에게 속한 모든 것에 평강이 있습니다.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לֶחָי 는 직역이 어렵고, 여기서는 상대를 향한 관용적 인사 또는 축복으로 이해됩니다.
    reason: alternative_reading
  - marker: b
    text: ‘평강’은 히브리어 שָׁלוֹם 의 의미를 옮긴 것으로, 단순한 갈등 부재뿐 아니라 안녕, 온전함, 번영까지 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם כֹּה
  english_pob_choice: And say this
  chosen_korean: 그리고 이렇게 말하십시오
  alternatives_korean:
  - 그리고 이렇게 말하시오
  - 이와 같이 말하십시오
  lexicon: WLC
  rationale: 명령형적 연속을 살리면서 현대 합쇼체로 자연스럽게 옮겼습니다. כֹּה는 지시적 부사로서 ‘이렇게’가 가장 간결합니다.
- source_word: לֶחָי
  english_pob_choice: To the living one
  chosen_korean: 산 자에게
  alternatives_korean:
  - 살아 있는 이에게
  - 한 생명에게
  - 오래 살기를
  lexicon: HALOT
  rationale: 이 표현은 문자적으로 난해한 관용구이므로, 본문이 상대를 향한 축복/인사로 기능한다는 점을 드러내기 위해 ‘산 자에게’로 처리했습니다. 영어 POB의 본문형과도 맞닿되, 과도한 해석인 ‘오래 살기를’은 본문에 직접 넣지 않았습니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 안녕
  - 복
  lexicon: HALOT
  rationale: 반복되는 שָׁלוֹם의 축복적 어감을 살리되, 한국어 성경 전통에서의 의미 폭을 고려해 ‘평강’을 택했습니다. 문맥상 단순한 전쟁 부재보다 안녕과 온전함을 포함합니다.
- source_word: בֵיתְךָ
  english_pob_choice: your house
  chosen_korean: 당신의 집
  alternatives_korean:
  - 당신의 가정
  - 당신의 집안
  lexicon: HALOT
  rationale: 히브리어 ‘집’은 가문/가정을 포함할 수 있지만, 원문 이미지인 ‘집’을 유지하는 편이 더 직접적입니다. 한국어에서는 ‘집’이 다소 협소할 수 있어 문맥상 그 범위가 확장되어 이해되도록 했습니다.
- source_word: וְכֹל אֲשֶׁר לְךָ
  english_pob_choice: all that is yours
  chosen_korean: 당신에게 속한 모든 것
  alternatives_korean:
  - 당신의 모든 소유
  - 당신에게 있는 모든 것
  lexicon: HALOT
  rationale: 소유물과 관련된 포괄적 표현으로 이해하여, 사람과 재산을 모두 포괄할 수 있게 ‘속한 모든 것’으로 옮겼습니다.
theological_decisions:
- issue: 'לֶחָי의 성격: 인사인지 축복인지'
  chosen_reading: 본문은 상대에게 보내는 축복적 인사로 이해하여, 직접적인 축원형 표현으로 옮겼습니다.
  alternative_readings:
  - 단순한 인사말로서 ‘안녕하십니까’
  - 문자적으로 ‘오래 사십시오’
  rationale: 문맥 전체가 나발에게 보내는 예의 있는 축복문이므로, 평면적 인사보다 축복의 성격을 드러내는 것이 원문의 힘을 더 잘 보존합니다.
  doctrine_reference: 본문 해석/담화 기능
