  yaml_path: translation/ot/1_samuel/025/018.yaml
  text: Then Abigail hurried and took two hundred loaves of bread[a], two skins of wine, five sheep already prepared, five seahs of roasted grain, a hundred clusters of raisins, and two hundred cakes of figs, and put them on the donkeys.
  footnotes:
  - marker: a
    text: Or 'five measures of roasted grain'; a seah was an ancient dry measure.
    reason: cultural_note
translation:
  language: ko
  text: 그때 아비가일은 서둘러 빵 이백 개와 포도주 두 가죽부대와 이미 준비한 양 다섯 마리와 볶은 곡식 다섯 세아와 건포도 백 송이와 무화과 과자 이백 개를 가져다가 나귀들 위에 실었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘볶은 곡식 다섯 세아’; 세아는 고대의 마른 곡식 계량 단위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּמַהֵר
  english_pob_choice: Then Abigail hurried
  chosen_korean: 아비가일은 서둘러
  alternatives_korean:
  - 아비가일은 급히
  - 아비가일은 재빨리
  lexicon: HALOT
  rationale: 서두르다는 동작의 긴박함을 자연스럽게 살리면서, 서술 흐름의 즉시성을 과하게 덧붙이지 않습니다.
- source_word: נִבְלֵי יַיִן
  english_pob_choice: two skins of wine
  chosen_korean: 포도주 두 가죽부대
  alternatives_korean:
  - 포도주 두 가죽주머니
  - 포도주 두 물통
  lexicon: HALOT
  rationale: נֵבֶל은 고대의 액체 용기이므로 현대식 병이나 통보다 가죽부대가 स्रोत의 물성을 더 잘 드러냅니다.
- source_word: חָמֵשׁ סְאִים קָלִי
  english_pob_choice: five seahs of roasted grain
  chosen_korean: 볶은 곡식 다섯 세아
  alternatives_korean:
  - 볶은 곡식 다섯 측량
  - 볶은 곡식 다섯 되
  lexicon: HALOT
  rationale: 세아를 음역해 고대 계량단위를 보존했고, '볶은 곡식'으로 קָלִי의 조리 상태를 반영했습니다.
- source_word: מֵאָה צִמֻּקִים
  english_pob_choice: a hundred clusters of raisins
  chosen_korean: 건포도 백 송이
  alternatives_korean:
  - 건포도 백 덩이
  - 건포도 백 다발
  lexicon: HALOT
  rationale: צִמּוּקִים의 묶음/송이 감각을 살려, 단순히 건포도 백 알로 풀지 않고 묶인 단위를 유지했습니다.
- source_word: מָאתַיִם דְּבֵלִים
  english_pob_choice: two hundred cakes of figs
  chosen_korean: 무화과 과자 이백 개
  alternatives_korean:
  - 무화과 떡 이백 개
  - 무화과 말랭이 이백 개
  lexicon: HALOT
  rationale: דְּבֵלָה는 눌러 만든 무화과 덩어리이므로 한국어로는 '과자'보다 '과자/떡' 사이의 식품 덩어리감을 살려 번역했습니다.
- source_word: וַתָּשֶׂם עַל הַחֲמֹרִים
  english_pob_choice: and put them on the donkeys
  chosen_korean: 나귀들 위에 실었습니다
  alternatives_korean:
  - 나귀들 위에 올려놓았습니다
  - 나귀들에 실었습니다
  lexicon: HALOT
  rationale: 물품을 나귀에 싣는 실제 장면을 분명히 하되, 히브리어의 단순한 '두다' 동사를 한국어 자연 표현으로 옮겼습니다.
