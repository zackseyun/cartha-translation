    reason: cultural_note
  revision_rationale: 물품의 수량과 순서는 보존했습니다. 무화과 압착떡의 의미를 ‘무화과 떡’으로 바로잡고, 건포도의 묶음 단위를 자연스럽게 다듬었으며, 중복된 각주를 세아에 대한 문화적 설명으로 교정했습니다. ‘손질해 둔’은 양이 먹을 수 있도록 준비되었다는 뜻을 전달하되 원문이 명시하지 않는 특정 조리법은 단정하지 않습니다.
