  text: שָׂ֥א נָ֖א לְ/פֶ֣שַׁע אֲמָתֶ֑/ךָ כִּ֣י עָשֹֽׂה יַעֲשֶׂה֩ יְהוָ֨ה לַֽ/אדֹנִ֜/י בַּ֣יִת נֶאֱמָ֗ן כִּי מִלְחֲמ֤וֹת יְהוָה֙ אֲדֹנִ֣/י נִלְחָ֔ם וְ/רָעָ֛ה לֹא תִמָּצֵ֥א בְ/ךָ֖ מִ/יָּמֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/028.yaml
  text: Please forgive the transgression of your servant[a], for Yahweh will surely make my lord a lasting house, because my lord fights Yahweh’s battles, and evil will not be found in you all your days.
  footnotes:
  - marker: a
    text: Or 'a sure house' or 'an enduring dynasty.' The Hebrew 'house' here refers to a stable lineage, not merely a physical household.
    reason: lexical_alternative
translation:
  language: ko
  text: 청하오니, 당신의 여종의 범죄를 용서하십시오. 야훼께서 반드시 내 주를 위하여 견고한 집안[a]을 세워 주실 것이니, 내 주께서 야훼의 싸움들을 치르고 계시기 때문입니다. 또한 당신에게서는 평생 악이 발견되지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집안’은 문자적인 가옥이 아니라 다윗에게 이어질 안정된 혈통, 곧 왕조를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא לְפֶשַׁע
  english_pob_choice: Please forgive the transgression of
  chosen_korean: 청하오니, …의 범죄를 용서하십시오
  alternatives_korean:
  - 부디 …의 허물을 용서하십시오
  - 청하오니, …의 죄를 용서하십시오
  lexicon: HALOT
  rationale: שָׂא נָא와 לְפֶשַׁע의 관용적 결합은 ‘용서하다/사면하다’의 간청으로 풀어야 하므로, 직접적이고 공손한 청유형인 ‘청하오니…용서하십시오’로 옮겼습니다.
- source_word: אֲמָתֶךָ
  english_pob_choice: your female servant
  chosen_korean: 당신의 여종
  alternatives_korean:
  - 당신의 여종의
  - 당신의 시녀의
  - 당신의 종의
  lexicon: HALOT
  rationale: אֲמָה는 여성 종을 가리키므로, 성별 정보가 살아 있는 ‘여종’을 택해 사죄하는 자기비하적 어조를 보존했습니다.
- source_word: בַּיִת נֶאֱמָן
  english_pob_choice: a lasting house
  chosen_korean: 견고한 집
  alternatives_korean:
  - 영속하는 집
  - 지속되는 집
  - 견고한 왕조
  lexicon: HALOT
  rationale: ‘집’은 물리적 건물이 아니라 다윗 계열의 안정된 혈통/왕조를 가리키므로, 직역성을 살리면서도 의미를 드러내는 ‘견고한 집’으로 옮겼습니다.
- source_word: מִלְחֲמוֹת יְהוָה
  english_pob_choice: Yahweh’s battles
  chosen_korean: 야훼의 싸움
  alternatives_korean:
  - 야훼의 전쟁
  - 야훼의 전투
  - 야훼를 위한 싸움
  lexicon: HALOT
  rationale: 구문은 야훼의 대의 아래 치르는 싸움을 뜻하므로, 현대 한국어에서 자연스럽고 과도하게 확장되지 않는 ‘싸움’으로 유지했습니다.
- source_word: לֹא תִמָּצֵא בְךָ מִיָּמֶיךָ
  english_pob_choice: will not be found in you all your days
  chosen_korean: 당신에게는 평생 악이 발견되지 않을 것입니다
  alternatives_korean:
  - 당신 안에서 악이 발견되지 않을 것입니다
  - 당신의 평생에 악이 드러나지 않을 것입니다
  - 당신에게는 평생 해악이 없을 것입니다
  lexicon: HALOT
  rationale: נמצא בְּ는 인격 안에/에게서 어떤 것이 발견됨을 뜻하므로, 도덕적 성격을 유지하는 ‘악이 발견되지 않을 것입니다’로 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: ‘야훼의 싸움’의 함의
  chosen_reading: 다윗의 무력행위를 단순한 개인 복수로 축소하지 않고, 야훼의 언약적 대의와 연관된 싸움으로 드러냈습니다.
  alternative_readings:
  - 야훼를 위한 싸움
  - 야훼의 전쟁
  rationale: 히브리어 구문은 야훼의 소유격을 유지하면서도 전쟁보다 좁은 ‘싸움’으로 표현해, 문맥상 정당화된 싸움이라는 긴장을 보존합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; source-text intertextuality with divine-war motifs.'
