revisions:
- from: 사람이 일어나 당신을 추격하여 당신의 생명을 찾으려 해도, 내 주의 생명은 야훼 당신의 하나님과 함께 생명의 꾸러미 속에 묶여 있을 것이며, 당신의 원수들의 생명은 투석기의 오목한 곳에서 내던져질 것입니다.[a][b]
  to: 한 사람이 일어나 당신을 추격하고 당신의 목숨을 노리려고 하더라도, 내 주의 목숨은 당신의 하나님 야훼와 함께 생명의 묶음 안에 묶여 있을 것입니다.[a] 그러나 그분께서는 당신의 원수들의 목숨을 투석기의 주머니에서 내던지실 것입니다.[b]
  rationale: 능동 동사의 주어를 문맥상 야훼로 명시하여 원문의 통사와 신학적 행위 주체를 보존했습니다. 살해 의도를 자연스러운 한국어 관용구로 옮기고, 묶음과 투석기 주머니의 구체적 비유를 유지했습니다. ‘생명의 묶음’을 사후 생명에 관한 교리로 확대하지 않았습니다.
  reviewer_model: gpt-5.6-terra
