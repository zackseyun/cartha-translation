  edition: WLC
  text: וַ/יָּ֤קָם אָדָם֙ לִ/רְדָפְ/ךָ֔ וּ/לְ/בַקֵּ֖שׁ אֶת נַפְשֶׁ֑/ךָ וְֽ/הָיְתָה֩ נֶ֨פֶשׁ אֲדֹנִ֜/י צְרוּרָ֣ה בִּ/צְר֣וֹר הַ/חַיִּ֗ים אֵ֚ת יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/אֵ֨ת נֶ֤פֶשׁ אֹיְבֶ֨י/ךָ֙ יְקַלְּעֶ֔/נָּה בְּ/ת֖וֹךְ כַּ֥ף הַ/קָּֽלַע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/029.yaml
  text: Though a man has risen to pursue you and to seek your life[a], yet the life of my lord shall be bound in the bundle of the living with Yahweh your God[b], and the lives of your enemies he shall sling out from the hollow of the sling.
  footnotes:
  - marker: a
    text: Or 'shall be tied up in the bundle of life.' The Hebrew image is of something securely wrapped or bound for safekeeping.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will hurl away.' The verb specifically evokes the action of a sling, forming a deliberate contrast with 'bound in the bundle of the living.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 일어나 당신을 추격하여 당신의 생명을 찾으려 해도, 내 주의 생명은 야훼 당신의 하나님과 함께 생명의 꾸러미 속에 묶여 있을 것이며, 당신의 원수들의 생명은 투석기의 오목한 곳에서 내던져질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘생명의 꾸러미 속에 매여 있을 것이다.’ 히브리어 이미지는 안전하게 둘러싸여 묶인 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 내던질 것입니다.’ 이 동사는 투석기의 동작을 분명히 떠올리게 하며, ‘생명의 꾸러미’와 의도적 대조를 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם אָדָם
  english_pob_choice: Though a man has risen
  chosen_korean: 사람이 일어나
  alternatives_korean:
  - 한 남자가 일어나
  - 누군가 일어나
  lexicon: HALOT
  rationale: 문맥상 다윗을 추격하는 구체적 남성을 가리키므로, 성중립화보다 단수 주체의 긴급한 상황을 살린 표현을 택했습니다.
- source_word: לִרְדָפְךָ וּלְבַקֵּשׁ אֶת נַפְשֶׁךָ
  english_pob_choice: to pursue you and to seek your life
  chosen_korean: 당신을 추격하여 당신의 생명을 찾으려 해도
  alternatives_korean:
  - 당신을 쫓아 당신의 생명을 구하려 해도
  - 당신을 추적하여 당신의 목숨을 노리려 해도
  lexicon: HALOT
  rationale: רָדַף는 적대적 추격을 뜻하므로 ‘추격하다’로 옮기고, נֶפֶשׁ는 여기서 ‘생명’으로 이해해 치명적 위협을 분명히 했습니다.
- source_word: צְרוּרָה בִּצְרוֹר הַחַיִּים
  english_pob_choice: shall be bound in the bundle of the living
  chosen_korean: 생명의 꾸러미 속에 묶여 있을 것이며
  alternatives_korean:
  - 생명의 묶음 속에 매여 있을 것이며
  - 살아 있는 자들의 보따리 속에 묶여 있을 것이며
  lexicon: HALOT
  rationale: ‘묶이다/꾸러미’ 이미지를 살려 보전의 은유를 유지했고, הַחַיִּים는 ‘살아 있는 자들’보다 간결한 ‘생명’으로 풀어도 문맥의 보호 이미지를 유지할 수 있습니다.
- source_word: יְקַלְּעֶנָּה בְּתוֹךְ כַּף הַקָּלַע
  english_pob_choice: he shall sling out from the hollow of the sling
  chosen_korean: 투석기의 오목한 곳에서 내던져질 것입니다
  alternatives_korean:
  - 투석기의 주머니에서 내던져질 것입니다
  - 투석기의 손바닥 같은 곳에서 내던져질 것입니다
  lexicon: HALOT
  rationale: קלע의 투석기 이미지를 살리기 위해 일반적 ‘버리다’보다 ‘내던지다’를 택했고, כַּף는 투석기의 돌을 담는 오목한 부분으로 이해했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명기 이름 יהוה는 호칭인 ‘주’로 대체하지 않고 ‘야훼’로 음역했습니다.
theological_decisions:
- issue: ‘생명의 꾸러미’와 원수들의 ‘내던짐’의 대비
  chosen_reading: 다윗의 보전과 원수들의 제거를 구체적 비유로 살리고, 이를 사후 세계 교리로 확대하지 않았습니다.
  alternative_readings:
  - 생명의 꾸러미를 영생의 직접 진술로 해석하기
  - 두 이미지를 단순히 ‘보호와 패배’로 평탄화하기
  rationale: 본문은 보전과 심판의 강한 대비를 은유적으로 말하므로, 후대 신학을 덧붙이지 않고 원문의 이미지 자체를 보존하는 것이 적절합니다.
  doctrine_reference: 번역 원칙 1, 3
- issue: ‘당신의 생명’과 ‘원수들의 생명’의 어조
  chosen_reading: 한국어에서는 반복되는 נֶפֶשׁ를 ‘생명’으로 통일해 평행 구조를 선명하게 드러냈습니다.
  alternative_readings:
  - 당신의 목숨 / 원수들의 목숨
  - 당신의 혼 / 원수들의 혼
  rationale: 이 구절에서 נֶפֶשׁ는 존재 전체를 가리키는 ‘생명’의 의미가 가장 자연스럽고, 전반적 평행과 긴장감을 유지합니다.
  doctrine_reference: HALOT 문맥 의미
