  source_fidelity: 초안은 전반적으로 히브리어의 보전과 투석의 대조 이미지를 유지합니다. 그러나 마지막 절의 동사 יְקַלְּעֶנָּה는 앞 절의 야훼를 주어로 하는 능동 표현인데, 초안의 피동형 ‘내던져질 것입니다’는 행위 주체를 지우고 문장 구조를 약화합니다. 또한 ‘생명을 찾으려’는 한국어에서 부자연스럽고, 이 문맥의 살해 의도는 ‘목숨을 노리다’가 정확하고 자연스럽습니다.
  naturalness: ‘생명의 꾸러미’와 ‘투석기의 오목한 곳’은 이해는 가능하지만 현대 표준어 성경 문체에서는 각각 ‘생명의 묶음’과 ‘투석기의 주머니’가 더 자연스럽고 이미지도 분명합니다. 각주 표지도 해당 어구와 동사 바로 뒤에 배치하는 편이 적절합니다.
  terminology: 야훼는 원문 יהוה의 음역으로 적절합니다. אֲדֹנִי는 아비가일의 존칭을 반영하여 ‘내 주’로 유지할 수 있습니다. נֶפֶשׁ는 문맥상 ‘목숨’으로 옮겨 살해 위협과 보전의 대조를 자연스럽게 드러냅니다.
