  text: וְ/אִ֨ישׁ בְּ/מָע֜וֹן וּ/מַעֲשֵׂ֣/הוּ בַ/כַּרְמֶ֗ל וְ/הָ/אִישׁ֙ גָּד֣וֹל מְאֹ֔ד וְ/ל֛/וֹ צֹ֥אן שְׁלֹֽשֶׁת אֲלָפִ֖ים וְ/אֶ֣לֶף עִזִּ֑ים וַ/יְהִ֛י בִּ/גְזֹ֥ז אֶת צֹאנ֖/וֹ בַּ/כַּרְמֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/002.yaml
  text: Now there was a man in Maon whose business was in Carmel[a]. The man was very wealthy, and he had three thousand sheep and a thousand goats[b]. He was shearing his sheep in Carmel.
  footnotes:
  - marker: a
    text: Or 'whose work/property was in Carmel.' The Hebrew term can refer broadly to a person's work, affairs, or holdings.
    reason: lexical_alternative
  - marker: b
    text: Or 'the man was very great,' that is, socially or economically prominent.
    reason: lexical_alternative
translation:
  language: ko
  text: 마온에 사는 한 사람이 있었는데, 그의 일은 갈멜에 있었습니다. 그 사람은 매우 부유했고, 양이 삼천 마리요 염소가 천 마리였습니다. 그는 갈멜에서 자기 양의 털을 깎고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 일/재산이 갈멜에 있었다.’ 히브리어는 한 사람의 일, 일거리, 소유를 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 사람은 매우 큰 사람이었다.’ 곧 사회적·경제적으로 유력한 인물이었다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 한 사람
  alternatives_korean:
  - 어떤 사람
  - 한 남자
  lexicon: HALOT
  rationale: 서사 도입의 불특정 인물을 자연스럽게 살리면서도, 이어지는 경제적 묘사와 어울리게 현대 한국어에서 매끈하게 표현했습니다.
- source_word: מַעֲשֵׂהוּ
  english_pob_choice: whose business was
  chosen_korean: 그의 일은
  alternatives_korean:
  - 그의 사업은
  - 그의 일터는
  - 그의 소유는
  lexicon: HALOT
  rationale: 이 명사는 일, 활동, 일거리, 소유/영업 범위까지 넓게 가리킬 수 있으므로, 본문 문맥상 갈멜과 연결된 경제 활동을 무리 없이 드러내는 ‘그의 일은’을 택했습니다.
- source_word: הָאִישׁ גָּדוֹל מְאֹד
  english_pob_choice: The man was very wealthy
  chosen_korean: 그 사람은 매우 부유했고
  alternatives_korean:
  - 그 사람은 매우 컸고
  - 그 사람은 매우 유명했고
  - 그 사람은 매우 큰 사람이었고
  lexicon: HALOT
  rationale: 히브리어 ‘크다’는 여기서 사회·경제적 지위를 뜻하므로, 뒤따르는 가축 규모와도 맞는 ‘매우 부유했고’가 가장 직접적입니다.
- source_word: בִּגְזֹז אֶת־צֹאנוֹ
  english_pob_choice: He was shearing his sheep in Carmel
  chosen_korean: 그는 갈멜에서 자기 양의 털을 깎고 있었습니다
  alternatives_korean:
  - 그는 갈멜에서 자기 양을 깎고 있었습니다
  - 그는 갈멜에서 자기 양의 털을 자르고 있었습니다
  lexicon: HALOT
  rationale: 동사의 구체적 이미지가 ‘양털을 깎다’이므로 관용적으로도 분명한 표현을 선택했고, 장소를 뒤에 두어 히브리어 사건 진행 순서를 살렸습니다.
theological_decisions:
- issue: הָאִישׁ גָּדוֹל מְאֹד의 의미 범위
  chosen_reading: ‘매우 부유했고’로 옮겨 경제적 번영을 드러냈습니다.
  alternative_readings:
  - ‘매우 큰 사람이었고’
  - ‘매우 유력했고’
  rationale: 본문은 곧바로 삼천 마리 양과 천 마리 염소를 제시하므로, ‘크다’의 추상적 위상보다 구체적 부를 드러내는 번역이 독자 이해에 더 직접적입니다.
  doctrine_reference: 서사적 사실 진술
