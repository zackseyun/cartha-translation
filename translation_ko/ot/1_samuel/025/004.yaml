  lexicon: HALOT
  rationale: מִדְבָּר의 기본 지리적·서사적 배경을 한국어 성경 문체에서 가장 넓고 정확하게 드러내는 표현으로 보았습니다.
- source_word: גֹזֵז
  english_pob_choice: was shearing
  chosen_korean: 양털을 깎고 있다는
  alternatives_korean:
  - 깎고 있었다는
