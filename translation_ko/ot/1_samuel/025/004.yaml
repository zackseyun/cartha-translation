base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/004.yaml
  text: David heard in the wilderness that Nabal was shearing his sheep[a].
  footnotes:
  - marker: a
    text: Or, more broadly, 'his flock.' The Hebrew צֹאן can refer collectively to small livestock, though 'sheep' fits the shearing context best.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 광야에서 나발이 자기 양털을 깎고 있다는 소식을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘양’은 이곳의 shearing 문맥에 맞는 번역입니다. 히브리어 צֹאן은 보다 넓게는 ‘양 떼/가축’ 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 알게 되었습니다
  - 전해 들었습니다
  lexicon: HALOT
  rationale: 서술적 과거를 자연스럽게 살리면서, 단순한 인지보다 ‘소식을 듣다’의 의미를 담아 가장 직접적으로 옮겼습니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
