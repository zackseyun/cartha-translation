  lexicon: HALOT
  rationale: 분사형의 동시·진행 의미를 살리되, 현재 진행형 느낌을 주는 간접화법으로 자연스럽게 옮겼습니다.
- source_word: אֶת צֹאנֽוֹ
  english_pob_choice: his sheep
  chosen_korean: 자기 양
  alternatives_korean:
