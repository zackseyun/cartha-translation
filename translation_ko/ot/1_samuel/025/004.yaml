  - 자기 가축
  lexicon: HALOT
  rationale: צֹאן은 집합명사로 ‘양 떼/가축’이 가능하지만, 전후 문맥의 ‘깎다’에 가장 직접적으로 맞는 한국어로는 ‘양’이 적절합니다.
