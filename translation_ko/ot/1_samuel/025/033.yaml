source:
  edition: WLC
  text: וּ/בָר֥וּךְ טַעְמֵ֖/ךְ וּ/בְרוּכָ֣ה אָ֑תְּ אֲשֶׁ֨ר כְּלִתִ֜/נִי הַ/יּ֤וֹם הַ/זֶּה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הֹשֵׁ֥עַ יָדִ֖/י לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/033.yaml
  text: And blessed be your judgment[a], and blessed be you[c][b], who have kept me this day from coming into bloodshed and from saving myself by my own hand.
  footnotes:
  - marker: a
    text: Or 'your discretion' or 'your discernment.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from coming into bloods'; the phrase can also carry the sense 'from bloodguilt.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from avenging myself with my own hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 분별력[a]에 복이 있고, 당신도 복되십니다. 오늘 당신은 제가 피 흘리는 일을 저지르지 않게[b], 또 제 손으로 제 자신을 구원하지 않게[c] 막아 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘판단’ 또는 ‘식견’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘피들’이며, ‘피 흘림’ 또는 ‘피의 책임’의 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘제 손으로 제 자신을 복수하지 않게’.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַעְמֵךְ
  english_pob_choice: your judgment
  chosen_korean: 분별력
  alternatives_korean:
  - 판단
  - 식견
  - 판별력
  lexicon: HALOT
  rationale: 문맥상 아비가일의 현명한 판단과 절제를 가리키므로, 한국어에서는 자연스럽고 무게감 있는 ‘분별력’이 적절합니다.
- source_word: וּבָרוּךְ ... וּבְרוּכָה אָתְּ
  english_pob_choice: blessed be ... blessed be you
  chosen_korean: 복되며 ... 복됩니다
  alternatives_korean:
  - 복을 받으십시오
  - 복이 있으시며
  - 찬송받으시며
  lexicon: HALOT
  rationale: 히브리어의 축복 선언을 현대 합쇼체로 살리기 위해 서술형 축복 표현을 사용했고, 대상에 대한 직접적 축복의 어조를 유지했습니다.
- source_word: מִבּוֹא בְדָמִים
  english_pob_choice: from coming into bloodshed
  chosen_korean: 피 흘림으로 들어가게
  alternatives_korean:
  - 피 흘림에 이르게
  - 피를 흘리게
  - 피 흘림 속으로 들어가게
  lexicon: HALOT
  rationale: 직역하면 ‘피들로 들어감’이지만, 한국어에서는 ‘피 흘림으로 들어가다’가 폭력 행위를 자연스럽게 드러내면서도 원문의 동사를 살립니다.
- source_word: וְהֹשֵׁעַ יָדִי לִי
  english_pob_choice: and from saving myself by my own hand
  chosen_korean: 제 손으로 스스로를 구원하지 못하게
  alternatives_korean:
  - 제 손으로 스스로를 구하지 못하게
  - 제 손으로 저를 구원하게
  - 제 손으로 복수하지 못하게
  lexicon: HALOT
  rationale: הושיע의 기본 의미인 ‘구원하다’를 살리되, 문맥상 자가 처벌적 복수를 암시하는 긴장을 한국어에서도 유지하기 위해 ‘스스로를 구원하다’로 옮겼습니다.
theological_decisions:
- issue: בְדָמִים의 의미를 피흘림과 피의 책임 중 어디에 둘지
  chosen_reading: 본문에는 ‘피 흘림’으로 두고, 주해적 해석을 강하게 단정하지 않았습니다.
  alternative_readings:
  - 피의 책임
  - 피 흘림과 피의 책임
  - 혈죄
  rationale: 문맥은 나발 집안에 대한 폭력적 보복을 가리키므로 ‘피 흘림’이 가장 직접적입니다. 그러나 히브리어 복수형이 피의 책임까지 함의할 수 있어, 본문에서는 과도하게 풀지 않았습니다.
  doctrine_reference: 해석의 긴장을 유지하고 단정적 도덕화로 환원하지 않음.
