  naturalness: 현 문장의 대시 삽입(‘미갈—곧 다윗의 아내를—’)은 목적격 조사가 삽입구 안에 있어 한국어 문장 구조가 다소 불안정합니다. ‘자기 딸 미갈, 곧 다윗의 아내를’로 고치면 원문의 동격을 보존하면서 자연스럽습니다.
  terminology: ‘라이스’는 적절합니다. ‘갈림’과 ‘팔티’는 히브리어 본문에 더 충실한 표기입니다. 기존 주석은 영어 번역의 철자 선택을 언급할 뿐 한국어 독자에게 실질적 정보를 주지 못하고, 본문 ‘팔디’와도 불일치하므로 교체해야 합니다.
