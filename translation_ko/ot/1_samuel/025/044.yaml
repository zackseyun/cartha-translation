translation:
  language: ko
  text: 사울은 자기 딸 미갈—곧 다윗의 아내를—길름 출신 라이스의 아들 팔디에게 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 이름을 팔티 계열로 전합니다. 영어 POB도 Palti 철자 가능성을 주석으로 밝혔습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁאוּל
  english_pob_choice: Now Saul
  chosen_korean: 사울은
  alternatives_korean:
  - 그리고 사울은
  - 이제 사울은
  lexicon: HALOT
  rationale: 서술 연결 ו는 여기서 새 사건을 자연스럽게 이어 주는 기능이므로, 한국어에서는 군더더기 없는 주어 표지로 처리했습니다.
- source_word: נָתַן
  english_pob_choice: had given
  chosen_korean: 주었습니다
  alternatives_korean:
  - 주었었습니다
  - 주고 있었습니다
  lexicon: HALOT
  rationale: 히브리어 완료형이 앞선 사건을 가리키지만, 한국어 서술에서는 단순 과거가 가장 자연스럽고 본문의 시간 관계도 충분히 보존합니다.
- source_word: מִיכַל בִּתּוֹ אֵשֶׁת דָּוִד
  english_pob_choice: Michal his daughter, David’s wife
  chosen_korean: 자기 딸 미갈—곧 다윗의 아내를—
  alternatives_korean:
  - 자기 딸 미갈, 다윗의 아내를
  - 자기 딸 미갈을, 곧 다윗의 아내를
  lexicon: HALOT
  rationale: ‘딸’과 ‘다윗의 아내’가 미갈을 다시 규정하므로, 한국어에서는 삽입구로 묶어 관계를 분명히 했습니다.
- source_word: לְפַלְטִי בֶן לַיִשׁ
  english_pob_choice: to Palti son of Laish
  chosen_korean: 라이스의 아들 팔디에게
  alternatives_korean:
  - 라이스의 아들 팔티에게
  - 라이스 아들 팔디에게
  lexicon: HALOT
  rationale: 히브리어 형태를 따라 이름을 팔디로 옮겼고, 영어 POB의 주석처럼 철자 변형 가능성은 있으나 본문은 여기서 Palti 계열을 가리킵니다.
- source_word: אֲשֶׁר מִ/גַּלִּים
  english_pob_choice: who was from Gallim
  chosen_korean: 길름 출신
  alternatives_korean:
  - 갈림 출신
  - 길름 사람
  lexicon: HALOT
  rationale: 지명 מִן + 고유명사의 출신 표지를 한국어에서 가장 간결하게 살려 ‘출신’으로 옮겼습니다.
theological_decisions:
- issue: 이 구절의 서술 시점과 관계절 처리
  chosen_reading: 사울의 행위가 이미 완료된 사실로 제시되지만, 한국어에서는 과도한 복합과거를 피하고 단순 과거로 자연스럽게 전달했습니다.
  alternative_readings:
  - 사울이 이미 자기 딸 미갈을 다윗의 아내로 팔디에게 주었었습니다.
  - 사울은 자기 딸 미갈을 다윗의 아내로 팔디에게 이미 주었습니다.
  rationale: 이 절의 핵심은 시간 부사의 추가보다 사울이 미갈을 다른 남자에게 준 사실을 독자가 분명히 이해하는 데 있습니다.
  doctrine_reference: 서사 본문 번역의 시제 등가성
