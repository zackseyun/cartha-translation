id: 1SA.25.35
reference: 1 Samuel 25:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח דָּוִד֙ מִ/יָּדָ֔/הּ אֵ֥ת אֲשֶׁר הֵבִ֖יאָה ל֑/וֹ וְ/לָ֣/הּ אָמַ֗ר עֲלִ֤י לְ/שָׁלוֹם֙ לְ/בֵיתֵ֔/ךְ רְאִי֙ שָׁמַ֣עְתִּי בְ/קוֹלֵ֔/ךְ וָ/אֶשָּׂ֖א פָּנָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/035.yaml
  text: So David took from her hand what she had brought him[a], and he said to her, “Go up in peace to your house. See, I have listened to your voice and accepted you.”
  footnotes:
  - marker: a
    text: Or “shown favor to you” or “accepted you”; Hebrew literally, “lifted up your face.”
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 그 여자의 손에서 그 여자가 그에게 가져온 것을 받고, 그 여자에게 말했습니다. “평안히 당신의 집으로 올라가십시오. 보십시오, 내가 당신의 말을 듣고 당신을 받아들였습니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “당신의 얼굴을 들어 올렸다”는 뜻의 관용구입니다. 여기서는 당신에게 호의를 보이거나 당신의 청을 받아들였다는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 받았고
  alternatives_korean:
  - 가졌고
  - 취했고
  lexicon: HALOT
  rationale: 문맥상 다윗이 아비가일이 가져온 예물을 실제로 받아 취하는 동작이므로, ‘받았고’가 자연스럽고 구체적입니다.
- source_word: מִיָּדָהּ
  english_pob_choice: from her hand
  chosen_korean: 그녀의 손에서
  alternatives_korean:
  - 그녀에게서
  - 그녀의 손으로부터
  lexicon: HALOT
  rationale: 히브리어의 ‘손’ 이미지를 살려 직접 건네받았다는 장면을 유지합니다.
- source_word: עֲלִי לְשָׁלוֹם לְבֵיתֵךְ
  english_pob_choice: Go up in peace to your house
  chosen_korean: 평안히 네 집으로 올라가라
  alternatives_korean:
  - 평안히 네 집으로 가라
  - 평안 가운데 네 집으로 올라가라
  lexicon: HALOT
  rationale: עֲלִי의 기본 동사 의미인 ‘올라가라’를 보존하고, לְשָׁלוֹם은 관용적으로 ‘평안히’로 옮겼습니다.
- source_word: שָׁמַעְתִּי בְקוֹלֵךְ
  english_pob_choice: I have listened to your voice
  chosen_korean: 나는 네 목소리를 듣고
  alternatives_korean:
  - 나는 네 말을 들었고
  - 나는 네 목소리에 귀를 기울였고
  lexicon: HALOT
  rationale: 직역하면 ‘네 목소리를 들었다’이지만, 한국어에서는 이를 자연스럽게 풀어 다윗이 아비가일의 호소를 들었다는 뜻을 드러냅니다.
- source_word: וָאֶשָּׂא פָּנָיִךְ
  english_pob_choice: accepted you
  chosen_korean: 너를 받아들였다
  alternatives_korean:
  - 너에게 호의를 베풀었다
  - 네 얼굴을 들어주었다
  lexicon: HALOT
  rationale: 문자적으로는 ‘네 얼굴을 들어 올렸다’는 관용구로, 여기서는 요청을 받아 주고 호의를 보였다는 의미를 가장 간명하게 전달합니다.
theological_decisions:
- issue: וָאֶשָּׂא פָּנָיִךְ의 관용구 처리
  chosen_reading: ‘받아들였다’로 번역해 요청 수락의 의미를 살렸습니다.
  alternative_readings:
  - ‘호의를 베풀었다’
  - ‘네 얼굴을 들어주었다’
  rationale: 이 구절은 교리 쟁점이 아니라 관용어 처리의 문제입니다. 한국어 독자가 다윗의 수락과 호의를 즉시 이해하도록 하면서도, 원문의 요청 수용 뉘앙스를 보존했습니다.
  doctrine_reference: 번역 원칙 §5 (핵심 표현의 일관성 및 문맥 보존)
