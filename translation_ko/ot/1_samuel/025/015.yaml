  text: וְ/הָ֣/אֲנָשִׁ֔ים טֹבִ֥ים לָ֖/נוּ מְאֹ֑ד וְ/לֹ֤א הָכְלַ֨מְנוּ֙ וְ/לֹֽא פָקַ֣דְנוּ מְא֔וּמָה כָּל יְמֵי֙ הִתְהַלַּ֣כְנוּ אִתָּ֔/ם בִּֽ/הְיוֹתֵ֖/נוּ בַּ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/015.yaml
  text: Yet the men were very good to us[a], and we were not mistreated[b], nor did we miss anything all the days we went about with them while we were in the field.
  footnotes:
  - marker: a
    text: Or 'we were not humiliated' / 'we suffered no insult.'
    reason: lexical_alternative
  - marker: b
    text: Or 'nor did anything go missing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 사람들은 우리에게 매우 잘해 주었습니다. 우리가 들에서 그들과 함께 다니는 동안 내내, 우리는 모욕을 당하지 않았고[a] 아무것도 잃지 않았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리는 수치를 당하지 않았다’ 또는 ‘우리는 모욕을 받지 않았다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아무것도 없어진 것이 없었다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֹבִים לָנוּ מְאֹד
  english_pob_choice: were very good to us
  chosen_korean: 우리에게 매우 선했으며
  alternatives_korean:
  - 우리에게 매우 좋았으며
  - 우리에게 매우 친절했으며
  - 우리에게 매우 호의적이었으며
  lexicon: HALOT
  rationale: טוֹב with לְ는 단순한 상태 진술보다 수혜자에게 베푼 호의를 나타내므로, 한국어에서는 ‘선하다’로 옮겨 benevolent treatment를 자연스럽게 드러냈습니다.
- source_word: הָכְלַמְנוּ
  english_pob_choice: we were not mistreated
  chosen_korean: 우리가 모욕당한 일도 없고
  alternatives_korean:
  - 우리가 학대당한 일도 없고
  - 우리가 수치를 당한 일도 없고
  - 우리가 부당하게 대우받은 일도 없고
  lexicon: HALOT
  rationale: הכלם의 피동은 ‘수치를 당하다/모욕을 당하다’에 가깝기 때문에, POB의 ‘mistreated’보다 원문 긴장을 살리는 방향으로 ‘모욕당한 일’로 번역했습니다.
- source_word: פָקַדְנוּ מְאוּמָה
  english_pob_choice: nor did we miss anything
  chosen_korean: 아무것도 빠진 것이 없었습니다
  alternatives_korean:
  - 아무것도 부족하지 않았습니다
  - 무엇 하나도 잃은 것이 없었습니다
  - 아무것도 없어진 것이 없었습니다
  lexicon: HALOT
  rationale: 부정문과 מְאוּמָה의 결합은 ‘빠진 것/없어진 것’이 없었다는 뜻이므로, 소유물의 누락 여부를 한국어 관용으로 간명하게 표현했습니다.
- source_word: בִּהְיוֹתֵנוּ בַּשָּׂדֶה
  english_pob_choice: while we were in the field
  chosen_korean: 우리가 그들과 함께 들에 있을 동안 내내
  alternatives_korean:
  - 우리가 들에 있을 동안
  - 우리가 그들과 함께 들에 있는 동안
  - 우리가 들판에 있을 동안
  lexicon: HALOT
  rationale: בַּשָּׂדֶה는 목초지/들판의 현장감을 가지므로 ‘들’로 옮기되, 앞의 동행 관계를 살려 문맥상 자연스럽게 연결했습니다.
