base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/024.yaml
  text: She fell at his feet and said[a], “On me, my lord, be the guilt. Please let your servant speak in your hearing[b], and hear the words of your servant.”
  footnotes:
  - marker: a
    text: 'Or, ''The guilt is mine, my lord.'' The Hebrew is a compact idiom of self-assumed blame: literally, ''On me, my lord, the guilt.'''
    reason: lexical_alternative
  - marker: b
    text: '''Your female servant'' translates a specifically feminine term of self-humbling address; traditional English often has ''maidservant.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 그의 발 앞에 엎드려 말했습니다. “내 주님, 죄는 저에게 있습니다. 청하오니 당신의 여종이 당신의 귀에 말하게 해 주십시오. 그리고 당신의 여종의 말을 들으십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “내 위에, 내 주님, 죄”라는 식의 압축된 관용구로, ‘죄는 저에게 있습니다’처럼 자기에게 책임을 돌리는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여종’은 히브리어의 여성형 자기 낮춤 표현을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל עַל רַגְלָיו
  english_pob_choice: She fell at his feet
  chosen_korean: 그의 발 앞에 엎드려
  alternatives_korean:
  - 그의 발치에 떨어져
  - 그의 발 앞에 무릎을 꿇고
  lexicon: HALOT
  rationale: 히브리어 관용구의 낮춤과 간청 자세를 살리면서도, 현대 한국어에서는 자연스럽게 ‘엎드리다’로 옮기는 것이 가장 직접적입니다.
- source_word: הֶעָוֹן
  english_pob_choice: the guilt
  chosen_korean: 죄는 저에게 있습니다
  alternatives_korean:
  - 죄는 제 몫입니다
  - 허물은 저에게 있습니다
  lexicon: HALOT
  rationale: POB의 각주가 보여 주듯 자기에게 책임을 돌리는 압축 표현이므로, 한국어에서는 소유·귀속을 분명히 하되 지나치게 법정문처럼 굳히지 않게 옮겼습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주님
  alternatives_korean:
  - 내 주인님
  - 주인님
  lexicon: HALOT
  rationale: 다윗에게 드리는 사회적 경칭이므로 ‘주님’을 사용하되, 하나님 칭호와의 혼동을 피하기 위해 문맥상 인간 호칭임이 드러나도록 하였습니다.
- source_word: אֲמָתְךָ
  english_pob_choice: your female servant
  chosen_korean: 당신의 여종
  alternatives_korean:
  - 당신의 여종아
  - 당신의 여자 종
  lexicon: HALOT
  rationale: 히브리어의 여성형 자기 비하 표현을 살리기 위해 단순한 ‘종’보다 성별이 드러나는 ‘여종’을 택했습니다. 한국어에서는 ‘여종’이 문맥상 가장 자연스럽고 간명합니다.
- source_word: בְּאָזְנֶיךָ
  english_pob_choice: in your hearing
  chosen_korean: 당신의 귀에
  alternatives_korean:
  - 당신이 들으시는 앞에서
  - 당신의 듣는 데
  lexicon: HALOT
  rationale: 직역하면 ‘당신의 귀 안에’이지만, 한국어에서는 듣게 하는 수단과 방향을 간결하게 드러내는 ‘당신의 귀에’가 관용적으로 적절합니다.
theological_decisions:
- issue: 자기 책임을 인정하는 압축적 고백의 표현 방식
  chosen_reading: ‘죄는 저에게 있습니다’로 옮겨, 단순한 감정적 사과가 아니라 책임의 귀속을 분명히 드러냈습니다.
  alternative_readings:
  - ‘죄는 제 것입니다’
  - ‘허물은 저에게 있습니다’
  rationale: 본문은 죄책을 자기에게 돌리는 짧은 관용구이므로, 한국어에서도 의미를 완화하지 않고 간명하게 전달하는 것이 좋습니다.
  doctrine_reference: 성경의 회개·중보 맥락에서 책임 귀속 표현
