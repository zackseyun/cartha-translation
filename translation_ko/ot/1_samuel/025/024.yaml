  lexicon: HALOT
  rationale: 직역하면 ‘당신의 귀 안에’이지만, 한국어에서는 듣게 하는 수단과 방향을 간결하게 드러내는 ‘당신의 귀에’가 관용적으로 적절합니다.
theological_decisions:
