  - ‘허물은 저에게 있습니다’
  rationale: 본문은 죄책을 자기에게 돌리는 짧은 관용구이므로, 한국어에서도 의미를 완화하지 않고 간명하게 전달하는 것이 좋습니다.
  doctrine_reference: 성경의 회개·중보 맥락에서 책임 귀속 표현
