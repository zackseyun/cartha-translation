  lexicon: HALOT
  rationale: 히브리어의 여성형 자기 비하 표현을 살리기 위해 단순한 ‘종’보다 성별이 드러나는 ‘여종’을 택했습니다. 한국어에서는 ‘여종’이 문맥상 가장 자연스럽고 간명합니다.
