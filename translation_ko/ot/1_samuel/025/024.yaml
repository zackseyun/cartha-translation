  yaml_path: translation/ot/1_samuel/025/024.yaml
  text: She fell at his feet and said[a], “On me, my lord, be the guilt. Please let your servant speak in your hearing[b], and hear the words of your servant.”
  footnotes:
  - marker: a
    text: 'Or, ''The guilt is mine, my lord.'' The Hebrew is a compact idiom of self-assumed blame: literally, ''On me, my lord, the guilt.'''
    reason: lexical_alternative
  - marker: b
    text: '''Your female servant'' translates a specifically feminine term of self-humbling address; traditional English often has ''maidservant.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 그의 발 앞에 엎드려 말했습니다[a]. “내 주인님, 허물은 제게 있습니다. 부디 이 여종[b]이 주인님께 말씀드리게 해 주시고, 이 여종의 말을 들어 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “내게, 내 주인님, 그 허물이”라는 압축된 관용구입니다. 화자가 허물에 대한 책임을 자신에게 돌리는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이 여종’은 히브리어의 여성형 자기낮춤 표현을 옮긴 것입니다. 직역하면 ‘당신의 여종’입니다.
    reason: lexical_alternative
