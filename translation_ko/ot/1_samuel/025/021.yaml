  text: Now David had said, “Surely I have guarded all that belongs to this man in the wilderness for nothing, so that not a thing of all that belonged to him was missing; and he has repaid me evil for good.”
translation:
  language: ko
  text: 다윗이 말했습니다. “내가 이 사람의 소유를 광야에서 다 지켜 주었건만, 아무것도 빠진 것이 없었는데도 그는 내게 선을 악으로 갚았습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “지켜 주었건만”은 히브리어의 ‘지키다’와 결과의 헛됨을 함께 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ לַשֶּׁקֶר
  english_pob_choice: Surely ... for nothing
  chosen_korean: “...하였건만”
  alternatives_korean:
  - “분명히 ... 헛되이”
  - “참으로 ... 아무 보람 없이”
  lexicon: אַךְ, לַשֶּׁקֶר
  rationale: 확신의 뉘앙스와 결과의 헛됨을 함께 살리기 위해, 문맥상 자연스러운 ‘...하였건만’으로 옮겨 앞절의 수고가 헛되었음을 드러냈습니다.
- source_word: שָׁמַרְתִּי
  english_pob_choice: I have guarded
  chosen_korean: 지켜 주었건만
  alternatives_korean:
  - 지켰건만
  - 보호했건만
  lexicon: שׁמר
  rationale: ‘지키다’의 기본 의미를 살리면서, 대상이 보호를 받았다는 문맥을 반영해 ‘지켜 주다’로 풀었습니다.
- source_word: מְאוּמָה
  english_pob_choice: not a thing
  chosen_korean: 아무것도
  alternatives_korean:
  - 한 가지도
  - 조금도
  lexicon: מאומה
  rationale: ‘아무것도 빠진 것이 없었다’는 관용적 한국어로 옮겨, 전부 보존되었음을 명확히 했습니다.
- source_word: וַיָּשֶׁב לִי רָעָה תַּחַת טוֹבָה
  english_pob_choice: and he has repaid me evil for good
  chosen_korean: 그는 내게 선을 악으로 갚았습니다
  alternatives_korean:
  - 그는 내게 좋은 일에 나쁜 일로 갚았습니다
  - 그는 내게 친절을 해악으로 되갚았습니다
  lexicon: שׁוב ... רעה תחת טובה
  rationale: 대응 구조 ‘...에 대하여 ...로 갚다’를 자연스럽게 살리면서, טובָה/רעה의 도덕적 대조를 분명히 했습니다.
theological_decisions:
- issue: 다윗의 진술이 항변인지 서술인지
  chosen_reading: 직접 인용 안에서 다윗의 불평 섞인 항변으로 처리했습니다.
  alternative_readings:
  - 단순한 역사 서술로 완화
  - 감정 표현을 더 강하게 번역
  rationale: 히브리어 직설 진술을 유지해 다윗의 억울함과 도덕적 평가를 함께 드러내되, 한국어에서는 자연스러운 항변체로 정리했습니다.
  doctrine_reference: 서사 본문은 화자의 태도까지 보존해야 한다는 번역 원칙
