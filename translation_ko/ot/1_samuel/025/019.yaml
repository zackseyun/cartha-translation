base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/019.yaml
  text: She said to her young men[a], “Go on ahead of me. Look, I am coming behind you.” But she did not tell her husband Nabal.
  footnotes:
  - marker: a
    text: Or “Behold, I am coming after you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 그녀의 종들에게 말했습니다. “나보다 앞서 가십시오. 보십시오, 내가 여러분 뒤를 따라가겠습니다.[a]” 그러나 그녀는 남편 나발에게 말하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “보십시오, 내가 여러분 뒤에 오고 있습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִנְעָרֶיהָ
  english_pob_choice: to her young men
  chosen_korean: 자기 젊은이들에게
  alternatives_korean:
  - 자기 종들에게
  - 자기 하인들에게
  - 자기 시종들에게
  lexicon: HALOT
  rationale: נַעַר는 문맥에 따라 ‘젊은이’와 ‘종/시종’의 뜻을 가질 수 있는데, 여기서는 음식을 들고 앞서 가는 수행 인원을 가리키므로 ‘젊은이들’이 원어의 인적 뉘앙스를 살리면서도 자연스럽습니다.
- source_word: עִבְרוּ לְפָנָי
  english_pob_choice: Go on ahead of me
  chosen_korean: 앞서 가십시오
  alternatives_korean:
  - 내 앞을 지나가십시오
  - 저보다 먼저 가십시오
  - 건너가십시오
  lexicon: HALOT
  rationale: עָבַר의 명령형은 여기서 ‘앞서 가다/먼저 가다’의 공간적 의미로 쓰였으므로, ‘앞서 가십시오’가 가장 간결하고 문맥에 맞습니다.
- source_word: הִנְנִי אַחֲרֵיכֶם בָּאָה
  english_pob_choice: Look, I am coming behind you
  chosen_korean: 보십시오, 내가 여러분 뒤따라가고 있습니다
  alternatives_korean:
  - 보십시오, 내가 여러분 뒤에 오고 있습니다
  - 보십시오, 내가 여러분 뒤를 따라가고 있습니다
  - 보십시오, 내가 여러분 뒤에 갑니다
  lexicon: HALOT
  rationale: הִנְנִי는 단순한 ‘보라’보다 화자의 행동을 주목시키는 표현이므로 ‘보십시오’로 옮겼고, אַחֲרֵיכֶם는 ‘뒤따라’로 자연스럽게 처리해 공간적 방향을 살렸습니다.
- source_word: וּלְאִישָׁהּ
  english_pob_choice: But she did not tell her husband
  chosen_korean: 그러나 그녀는 남편 나발에게는 말하지 않았습니다
  alternatives_korean:
  - 그러나 그녀는 남편에게는 말하지 않았습니다
  - 그러나 그녀는 자기 남편 나발에게 알리지 않았습니다
  - 그런데 그녀는 남편 나발에게는 말하지 않았습니다
  lexicon: HALOT
  rationale: אִישׁ의 3인칭 여성 단수 접미는 이 문맥에서 ‘남편’이므로 그렇게 옮겼고, 대조를 살리기 위해 ‘그러나’와 ‘-에게는’의 대비를 사용했습니다.
