  lexicon: HALOT
  rationale: 조건절의 ‘if’ 구조를 한국어의 ‘-다면’으로 자연스럽게 재현해, 맹세문의 숨은 부정적 힘을 보존했습니다.
theological_decisions:
- issue: 맹세 공식의 한국어 처리와 주어 보존
  chosen_reading: ‘하나님이 … 그러하시고 또 그보다 더하시기를 바랍니다’로 옮겨, 맹세의 저주적 힘을 분명히 드러냈습니다.
  alternative_readings:
  - ‘하나님이 … 그렇게 하시고’로 약화시켜 번역
  - ‘주님’으로 일반화하여 옮김
  rationale: 본문은 단순한 서술이 아니라 자기저주를 동반한 맹세 공식이므로, 한국어에서도 그 강도를 흐리지 않는 것이 중요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 마소라 본문의 난해한 독법 유지
  chosen_reading: ‘다윗의 원수들’ 표현을 본문대로 유지하고, 통상적 자기저주의 관습과의 긴장은 본문에 남겨 두었습니다.
  alternative_readings:
  - 관습에 따라 ‘다윗에게’ 혹은 ‘내게’로 의미상 보정
  - 문맥에 따라 본문을 암시적으로 수정
  rationale: 원문은 해석상 난점이 있으나, 자료가 제시한 본문 자체를 투명하게 보존하는 것이 POB의 원칙에 더 부합합니다.
  doctrine_reference: Translation philosophy §§1, 5
