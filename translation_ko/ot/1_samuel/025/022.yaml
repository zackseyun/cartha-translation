  - 하나님이 … 이같이 하시고 더욱 더하시기를 바랍니다
  lexicon: HALOT
  rationale: 히브리어의 전형적인 맹세/저주 공식이므로, 한국어에서도 반복을 자연스럽게 풀되 원래의 임재적·임precatory 힘은 유지했습니다.
- source_word: לְאֹיְבֵי דָוִד
  english_pob_choice: to David’s enemies
  chosen_korean: 다윗의 원수들에게
  alternatives_korean:
  - 다윗의 원수들에게
  - 다윗에게
  lexicon: HALOT
  rationale: 본문의 마소라 본문 표현을 따라 ‘다윗의 원수들’로 옮겼고, 맥락상 자기저주의 통상 공식과의 긴장은 그대로 남겨 두었습니다.
- source_word: מַשְׁתִּין בְּקִיר
  english_pob_choice: one male
  chosen_korean: 남자 하나라도
  alternatives_korean:
