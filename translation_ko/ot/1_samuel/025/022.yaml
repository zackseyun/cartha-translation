  yaml_path: translation/ot/1_samuel/025/022.yaml
  text: May God do so to David’s enemies[a], and more also[b], if by morning I leave so much as one male of all who belong to him.
  footnotes:
  - marker: a
    text: 'Hebrew: ''one who urinates against a wall,'' a crude idiom meaning ''male.'''
    reason: lexical_alternative
  - marker: b
    text: Some interpreters understand 'David’s enemies' as a scribal euphemism for 'David' (or 'me'), since the usual oath formula is self-imprecatory.
    reason: textual_variant
translation:
  language: ko
  text: 하나님께서 다윗의 원수들에게[a] 이와 같이 하시고 더욱 더하시기를 바랍니다. 아침까지 내가 그에게 속한 모든 사람 가운데 남자[b] 하나라도 남겨 둔다면 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 해석자들은 통상적인 자기저주 맹세 공식에 비추어, ‘다윗의 원수들’이 ‘다윗’ 또는 ‘나’를 완곡하게 가리키는 서기관적 표현일 수 있다고 이해합니다.
    reason: textual_variant
  - marker: b
    text: 히브리어는 문자적으로 ‘담에 오줌 누는 자’라는 거친 관용구이며, ‘남자’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה ... וְכֹה יֹסִיף
  english_pob_choice: May God do so ... and more also
  chosen_korean: 하나님이 … 그러하시고 또 그보다 더하시기를 바랍니다
  alternatives_korean:
