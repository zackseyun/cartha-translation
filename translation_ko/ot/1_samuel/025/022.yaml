base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/022.yaml
  text: May God do so to David’s enemies[a], and more also[b], if by morning I leave so much as one male of all who belong to him.
  footnotes:
  - marker: a
    text: 'Hebrew: ''one who urinates against a wall,'' a crude idiom meaning ''male.'''
    reason: lexical_alternative
  - marker: b
    text: Some interpreters understand 'David’s enemies' as a scribal euphemism for 'David' (or 'me'), since the usual oath formula is self-imprecatory.
    reason: textual_variant
translation:
  language: ko
  text: 아침까지 내가 다윗에게 속한 자들 가운데서 남자 하나라도 남겨 둔다면, 하나님이 다윗의 원수들에게 그러하시고 또 그보다 더하시기를 바랍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘담에 오줌 누는 자’라는 저속한 관용구로, ‘남자’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 해석자들은 ‘다윗의 원수들’을 서기관이 자기저주형 공식에 맞추어 바꾼 완곡 표현으로 이해합니다.
    reason: textual_variant
lexical_decisions:
- source_word: כֹּה ... וְכֹה יֹסִיף
  english_pob_choice: May God do so ... and more also
  chosen_korean: 하나님이 … 그러하시고 또 그보다 더하시기를 바랍니다
  alternatives_korean:
  - 하나님이 … 그렇게 하시고 또 더하시기를 바랍니다
  - 하나님이 … 이같이 하시고 더욱 더하시기를 바랍니다
  lexicon: HALOT
  rationale: 히브리어의 전형적인 맹세/저주 공식이므로, 한국어에서도 반복을 자연스럽게 풀되 원래의 임재적·임precatory 힘은 유지했습니다.
- source_word: לְאֹיְבֵי דָוִד
  english_pob_choice: to David’s enemies
  chosen_korean: 다윗의 원수들에게
  alternatives_korean:
  - 다윗의 원수들에게
  - 다윗에게
  lexicon: HALOT
  rationale: 본문의 마소라 본문 표현을 따라 ‘다윗의 원수들’로 옮겼고, 맥락상 자기저주의 통상 공식과의 긴장은 그대로 남겨 두었습니다.
- source_word: מַשְׁתִּין בְּקִיר
  english_pob_choice: one male
  chosen_korean: 남자 하나라도
  alternatives_korean:
  - 담에 오줌 누는 자 하나라도
  - 수컷 하나라도
  lexicon: HALOT
  rationale: 직역하면 저속한 관용구이지만, 한국어 본문에서는 문맥상 의미인 ‘남자’를 살리고, 관용구의 거친 뉘앙스는 각주로 처리하는 편이 적절합니다.
- source_word: אִם אַשְׁאִיר
  english_pob_choice: if I leave
  chosen_korean: 내가 … 남겨 둔다면
  alternatives_korean:
  - 내가 … 남긴다면
  - 내가 … 남겨 두지 않는다면
  lexicon: HALOT
  rationale: 조건절의 ‘if’ 구조를 한국어의 ‘-다면’으로 자연스럽게 재현해, 맹세문의 숨은 부정적 힘을 보존했습니다.
theological_decisions:
- issue: 맹세 공식의 한국어 처리와 주어 보존
  chosen_reading: ‘하나님이 … 그러하시고 또 그보다 더하시기를 바랍니다’로 옮겨, 맹세의 저주적 힘을 분명히 드러냈습니다.
  alternative_readings:
  - ‘하나님이 … 그렇게 하시고’로 약화시켜 번역
  - ‘주님’으로 일반화하여 옮김
  rationale: 본문은 단순한 서술이 아니라 자기저주를 동반한 맹세 공식이므로, 한국어에서도 그 강도를 흐리지 않는 것이 중요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 마소라 본문의 난해한 독법 유지
  chosen_reading: ‘다윗의 원수들’ 표현을 본문대로 유지하고, 통상적 자기저주의 관습과의 긴장은 본문에 남겨 두었습니다.
  alternative_readings:
  - 관습에 따라 ‘다윗에게’ 혹은 ‘내게’로 의미상 보정
  - 문맥에 따라 본문을 암시적으로 수정
  rationale: 원문은 해석상 난점이 있으나, 자료가 제시한 본문 자체를 투명하게 보존하는 것이 POB의 원칙에 더 부합합니다.
  doctrine_reference: Translation philosophy §§1, 5
