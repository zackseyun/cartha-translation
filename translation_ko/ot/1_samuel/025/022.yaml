  to: 하나님께서 다윗의 원수들에게[a] 이와 같이 하시고 더욱 더하시기를 바랍니다. 아침까지 내가 그에게 속한 모든 사람 가운데 남자[b] 하나라도 남겨 둔다면 말입니다.
  rationale: 직접 문맥상 나발을 가리키는 ‘그에게 속한’으로 바로잡아 원문의 지시 관계를 회복했습니다. 마소라 본문의 ‘다윗의 원수들’은 유지하고, 그 난점과 가능한 완곡 표현설은 각주로만 제시했습니다. 또한 각주 표지를 해당 어구에 배치하고, 히브리어 관용구의 거친 성격을 보존했습니다.
