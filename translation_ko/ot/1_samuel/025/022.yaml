  lexicon: HALOT
  rationale: 직역하면 저속한 관용구이지만, 한국어 본문에서는 문맥상 의미인 ‘남자’를 살리고, 관용구의 거친 뉘앙스는 각주로 처리하는 편이 적절합니다.
- source_word: אִם אַשְׁאִיר
  english_pob_choice: if I leave
  chosen_korean: 내가 … 남겨 둔다면
  alternatives_korean:
  - 내가 … 남긴다면
