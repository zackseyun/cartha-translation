  source_fidelity: 수정이 필요합니다. לּוֹ(그에게 속한)는 이 절의 직접 문맥에서 나발을 가리키는데, 초안의 ‘다윗에게 속한 자들’은 이를 다윗으로 잘못 특정합니다. 또한 מִכָּל אֲשֶׁר־לוֹ는 ‘그에게 속한 모든 사람/것’이라는 포괄 표현 뒤에 남성 관용구가 이어지므로, ‘그에게 속한 모든 사람 가운데 남자 하나라도’가 문맥상 충실합니다. 마소라 본문의 ‘다윗의 원수들’은 본문에 보존해야 합니다.
  naturalness: 수정문은 현대 표준 한국어의 합쇼체로 자연스럽습니다. 맹세 공식은 ‘…하시고 더욱 더하시기를 바랍니다’로 옮겨 기원·저주의 형식을 유지하되, 한국어 문장으로도 읽히게 했습니다.
  terminology: ‘하나님’, ‘다윗’, ‘원수들’은 적절합니다. מַשְׁתִּין בְּקִיר는 본문에서 ‘남자’로 명료하게 번역하고, 원문의 거친 문자적 관용구는 해당 어구에 연결한 각주에서 밝혔습니다. 본문 난점인 ‘다윗의 원수들’에는 별도 각주를 연결해, 이를 ‘다윗’ 또는 ‘나’로 묵시적으로 고치지 않았습니다.
