reference: 1 Samuel 25:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָקַחְתִּ֤י אֶת לַחְמִ/י֙ וְ/אֶת מֵימַ֔/י וְ/אֵת֙ טִבְחָתִ֔/י אֲשֶׁ֥ר טָבַ֖חְתִּי לְ/גֹֽזְזָ֑/י וְ/נָֽתַתִּי֙ לַֽ/אֲנָשִׁ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתִּי אֵ֥י מִ/זֶּ֖ה הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/011.yaml
  text: Should I take my bread and my water and my meat that I have slaughtered for my shearers[b][a], and give it to men whom I do not know where they are from?
  footnotes:
  - marker: a
    text: Or, more literally, 'and I will take ... and I will give,' with the Hebrew using perfect forms in a rhetorical question.
    reason: lexical_alternative
  - marker: b
    text: '''My shearers'' refers to those doing the sheep-shearing.'
    reason: cultural_note
translation:
  language: ko
  text: 제가 내 빵과 내 물과 내가 내 목자들을 위해 잡아 놓은 내 고기를 가져다가, 내가 어디 출신인지도 모르는 사람들에게 주겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 완료형이 이 수사적 질문 안에서는 ‘제가 ... 가져가겠습니까/주겠습니까’라는 반문으로 기능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 목자들’은 본문의 גֹזְזִים, 곧 양털 깎는 사람들을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתִּי
  english_pob_choice: Should I take
  chosen_korean: 제가 ... 가져다가
  alternatives_korean:
  - 제가 ... 취하겠습니까
  - 제가 ... 가져가겠습니까
  lexicon: HALOT
  rationale: 이 표현은 반문형 의문으로서 단순 미래보다 ‘그걸 내가 가져다가 주겠느냐’는 거절의 뉘앙스를 담아야 하므로, 자연스러운 한국어 반문 구조로 옮겼습니다.
- source_word: לַחְמִי / מֵימַי / טִבְחָתִי
  english_pob_choice: my bread / my water / my meat
  chosen_korean: 내 빵과 내 물과 ... 내 고기
  alternatives_korean:
  - 내 떡과 내 물과 ... 내 고기
  - 내 양식과 내 물과 ... 내 고기
  lexicon: HALOT
  rationale: 세 항목의 구체성을 살리기 위해 먹을거리의 열거를 직역에 가깝게 유지했습니다. ‘빵’은 פה에서의 기본 음식 항목을, ‘물’은 문자적 물을, ‘고기’는 도살된 짐승의 고기라는 구체성을 반영합니다.
- source_word: לְגֹזְזָי
  english_pob_choice: for my shearers
  chosen_korean: 내 목자들을 위해
  alternatives_korean:
  - 내 깎는 사람들을 위해
  - 내 양털 깎는 사람들을 위해
  lexicon: HALOT
  rationale: 문맥상 양털 깎는 일꾼들을 가리키므로, 한국어로는 의미가 즉시 드러나도록 풀어 옮겼습니다. 다만 본문 정보의 정확성을 위해 ‘양털 깎는 사람들’보다 간결한 ‘목자들’은 본래 의미를 충분히 드러내지 못하므로, 최종 본문은 ‘양털 깎는 사람들’ 계열이 더 적합하다는 점을 검토해야 합니다.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  english_pob_choice: whom I do not know
  chosen_korean: 내가 ... 모르는
  alternatives_korean:
  - 내가 ... 알지 못하는
  - 내가 ... 알지 못한
  lexicon: HALOT
  rationale: ידע의 관계적 의미를 살려 단순한 미지보다 ‘알지 못하는 사람들’로 번역했습니다.
- source_word: אֵי מִזֶּה הֵמָּה
  english_pob_choice: where they are from
  chosen_korean: 어디 출신인지도
  alternatives_korean:
  - 어디서 왔는지도
  - 어느 곳 사람인지도
  lexicon: HALOT
  rationale: 출신/기원을 묻는 관용을 자연스러운 한국어로 옮겼습니다. ‘어디서 왔는지’도 가능하지만, 문맥의 출처·소속을 묻는 뉘앙스에는 ‘어디 출신인지’가 더 가깝습니다.
theological_decisions:
- issue: 반문형 문장의 시제/태도
  chosen_reading: ‘제가 ... 주겠습니까?’로 옮겨, 히브리어 완료형이 수사적 질문 안에서 가지는 반문·거절의 힘을 살렸습니다.
  alternative_readings:
  - 제가 ... 줄 것입니다
  - 제가 ... 주어야 합니까
  rationale: 이 절은 단순한 예측이 아니라 분개한 반문이므로, 한국어에서도 의지 표명보다 거절의 수사학이 드러나야 합니다.
  doctrine_reference: 본문 수사학 보존 원칙
- issue: ‘shearers’의 문화적 배경
  chosen_reading: 양털 깎는 일꾼들을 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 목자들
  - 양털 깎는 사람들
  rationale: 문맥은 양털 깎기 연회 상황이므로, 대상의 직무를 분명히 밝혀 문화적 배경을 유지하는 것이 타당합니다.
  doctrine_reference: 본문 문화맥락 보존 원칙
