source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע דָּוִד֮ כִּ֣י מֵ֣ת נָבָל֒ וַ/יֹּ֡אמֶר בָּר֣וּךְ יְהוָ֡ה אֲשֶׁ֣ר רָב֩ אֶת רִ֨יב חֶרְפָּתִ֜/י מִ/יַּ֣ד נָבָ֗ל וְ/אֶת עַבְדּ/וֹ֙ חָשַׂ֣ךְ מֵֽ/רָעָ֔ה וְ/אֵת֙ רָעַ֣ת נָבָ֔ל הֵשִׁ֥יב יְהוָ֖ה בְּ/רֹאשׁ֑/וֹ וַ/יִּשְׁלַ֤ח דָּוִד֙ וַ/יְדַבֵּ֣ר בַּ/אֲבִיגַ֔יִל לְ/קַחְתָּ֥/הּ ל֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/039.yaml
  text: When David heard that Nabal was dead[a], he said, “Blessed be Yahweh, who has pleaded the case of my reproach from the hand of Nabal, and has kept his servant back from evil. Yahweh has returned Nabal’s evil on his own head.” Then David sent and spoke to Abigail[e][d][c][b], to take her as his wife.
  footnotes:
  - marker: a
    text: 'Or “has avenged my insult” or “has contended for the cause of my disgrace.” The Hebrew uses legal-contest language: “has pleaded the case of my reproach.”'
    reason: lexical_alternative
  - marker: b
    text: Or “has restrained his servant from doing harm.”
    reason: lexical_alternative
  - marker: c
    text: Hebrew “has returned Nabal’s evil on his head,” an idiom for recompense falling back on the wrongdoer.
    reason: cultural_note
  - marker: d
    text: Or “to take her for himself as a wife”; that is, to marry her.
    reason: lexical_alternative
  - marker: e
    text: Or 'sent word and spoke to Abigail'.
    reason: previous_rendering
translation:
  language: ko
  text: 다윗은 나발이 죽었다는 소식을 듣고 이렇게 말했습니다. 「야훼를 찬송합니다. 그분이 나발에게서 받은 나의 모욕에 대한 변론을 맡아 주시고, 자기 종을 악에서 지켜 주셨습니다. 야훼께서 나발의 악을 그의 머리 위로 돌려주셨습니다.」 그 뒤 다윗은 아비가일에게 사람을 보내어 그녀를 자기 아내로 삼게 했습니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나의 모욕을 갚아 주셨다”, 혹은 “나의 수치의 원인을 변론해 주셨다.” 히브리어는 법정에서 변론하는 표현을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “자기 종이 해를 끼치지 않도록 제지하셨다.”
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 관용구로, 악한 행위에 대한 보응이 그 행위자에게 되돌아오는 뜻입니다.
    reason: cultural_note
  - marker: d
    text: 또는 “그녀를 아내로 삼기 위해”, 곧 그녀와 결혼하려고.
    reason: lexical_alternative
  - marker: e
    text: 또는 “아비가일에게 사람을 보내어 말했습니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  english_pob_choice: Blessed be Yahweh
  chosen_korean: 야훼를 찬송합니다
  alternatives_korean:
  - 야훼는 복되십니다
  - 야훼를 복되다고 합니다
  lexicon: HALOT
  rationale: 히브리어 축복 선언형을 한국어의 자연스러운 도치 감사·찬양 표현으로 옮겼습니다. 주어 표지가 없는 선언문이므로 ‘찬송합니다’가 합쇼체 본문에서 가장 자연스럽고 수행적인 울림을 살립니다.
- source_word: רָב אֶת רִיב חֶרְפָּתִי
  english_pob_choice: has pleaded the case of my reproach
  chosen_korean: 나발에게서 받은 나의 모욕에 대한 변론을 맡아 주시고
  alternatives_korean:
  - 나의 모욕의 사건을 변론해 주시고
  - 나의 수치를 두고 다투어 주시고
  lexicon: HALOT
  rationale: 법정적 ‘다투다/변론하다’의 이미지를 살리면서, חֶרְפָּה의 의미를 ‘모욕’으로 옮겨 다윗의 명예 훼손 상황을 분명히 했습니다. ‘맡아 주시고’는 히브리어의 변론 수행을 자연스럽게 드러냅니다.
- source_word: חָשַׂךְ מֵרָעָה
  english_pob_choice: has kept his servant back from evil
  chosen_korean: 자기 종을 악에서 지켜 주셨습니다
  alternatives_korean:
  - 자기 종이 악을 행하지 못하게 막아 주셨습니다
  - 자기 종을 해악에서 막아 주셨습니다
  lexicon: HALOT
  rationale: 문맥상 다윗이 보복과 유혈을 하지 않도록 제지하신 것을 가리키지만, 단순한 ‘해악’보다 도덕적 평가가 강한 ‘악’이 원문의 긴장을 더 잘 보존합니다.
- source_word: וְאֵת רָעַת נָבָל הֵשִׁיב יְהוָה בְּרֹאשׁוֹ
  english_pob_choice: The LORD has returned Nabal’s evil on his own head
  chosen_korean: 야훼께서 나발의 악을 그의 머리 위로 돌려주셨습니다
  alternatives_korean:
  - 야훼께서 나발의 악을 그의 머리로 되돌리셨습니다
  - 야훼께서 나발의 악을 그 자신에게 갚으셨습니다
  lexicon: HALOT
  rationale: ‘그의 머리 위로’는 보응의 관용구이므로, 한국어에서도 이미지가 유지되도록 직역에 가까운 표현을 택했습니다. ‘돌려주셨습니다’는 POB의 ‘returned’와 대응하면서도 자연스럽습니다.
- source_word: וַיְדַבֵּר בַּאֲבִיגַיִל
  english_pob_choice: spoke to Abigail
  chosen_korean: 아비가일에게 사람을 보내어
  alternatives_korean:
  - 아비가일에게 말하여
  - 아비가일에게 청혼하러
  lexicon: HALOT
  rationale: 히브리어의 ‘보내다+말하다’ 연속은 실제로는 중개자를 통한 혼인 제안의 표현이므로, 한국어에서 그 함의를 드러내되 과잉 해석을 피했습니다. ‘사람을 보내어’가 문맥상 가장 분명합니다.
- source_word: לְקַחְתָּהּ לוֹ לְאִשָּׁה
  english_pob_choice: to take her as his wife
  chosen_korean: 그녀를 자기 아내로 삼게 했습니다
  alternatives_korean:
  - 그녀를 자기 아내로 데려가게 했습니다
  - 그녀를 아내로 맞이하게 했습니다
  lexicon: HALOT
  rationale: 히브리어의 통상적 혼인 표현을 한국어에서 자연스럽게 옮겼습니다. ‘삼게 했습니다’는 서술의 거리감을 유지하면서도 혼인 의도를 분명히 합니다.
theological_decisions:
- issue: 야훼의 보응과 다윗의 자기 해석
  chosen_reading: 본문의 직접 진술대로, 다윗이 야훼께서 자신을 변론하시고 나발의 악을 그에게 되돌리셨다고 고백하는 구조를 유지했습니다.
  alternative_readings:
  - 야훼께서 직접 나발을 심판하셨다고 더 강하게 풀 수 있습니다
  - 보응 표현을 완화해 단순한 사건 서술처럼 만들 수 있습니다
  rationale: 히브리어는 야훼의 변론과 보응을 분명히 말하지만, 이를 교리적 일반화로 확대하지는 않습니다. 서사 안에서 다윗의 해석을 그대로 살리는 것이 원문 충실도에 맞습니다.
  doctrine_reference: 섭리와 공의에 대한 서사적 진술
- issue: ‘자기 종’을 악에서 지키신 것의 윤리적 무게
  chosen_reading: ‘악’으로 번역해 다윗의 보복 계획이 단순한 피해 방지가 아니라 도덕적 잘못이 될 수 있음을 드러냈습니다.
  alternative_readings:
  - ‘해악’으로 순화할 수 있습니다
  - ‘보복하지 못하게’로 풀어 의미를 특정할 수 있습니다
  rationale: 원문은 다윗의 행위를 도덕적으로 평가하는 어휘를 사용하므로, 이를 약화시키지 않는 것이 필요합니다. 동시에 구체적 상황은 문맥과 서술 흐름이 충분히 설명합니다.
  doctrine_reference: '번역 원리 #1, #3'
