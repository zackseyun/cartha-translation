    rationale: 원문은 다윗이 아비가일을 아내로 맞이하려는 목적으로 사람을 보내어 말한 것을 서술합니다. 현 번역은 아비가일 또는 제삼자가 아내가 되도록 만들었다는 뜻으로 읽힙니다.
  - severity: medium
    issue: 각주 표지가 문장 끝에 한꺼번에 붙어 있어 각주 대상이 불명확합니다.
