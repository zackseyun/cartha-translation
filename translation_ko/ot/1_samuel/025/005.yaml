base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/005.yaml
  text: So David sent ten young men[a], and David said to the young men, “Go up to Carmel, and go to Nabal, and greet him in my name with peace.”
  footnotes:
  - marker: a
    text: Or, 'ask him for peace,' that is, inquire after his welfare with a greeting of peace.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 젊은이 열 명을 보내며, 다윗이 그 젊은이들에게 말했습니다. 「카르멜로 올라가서 나발에게 가서, 내 이름으로 그의 평안을 물으십시오」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 평안을 물으십시오’는 히브리어의 인사 관용구를 따른 것으로, 안부를 묻는 뜻을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשָׂרָה נְעָרִים
  english_pob_choice: ten young men
  chosen_korean: 젊은이 열 명
  alternatives_korean:
  - 청년 열 명
  - 종 열 명
  lexicon: HALOT
  rationale: נְעָרִים는 문맥상 다윗의 심부름꾼들이지만, 기본 의미는 ‘젊은이들’이므로 이를 살리고 사회적 신분은 과도하게 정하지 않았습니다.
- source_word: עֲלוּ כַרְמֶלָה
  english_pob_choice: Go up to Carmel
  chosen_korean: 카르멜로 올라가서
  alternatives_korean:
  - 갈멜로 올라가서
  - 카르멜 산으로 올라가서
  lexicon: HALOT
  rationale: עלה의 이동 관용을 한국어 자연문으로 풀되, 지명 방향성을 유지했습니다.
- source_word: וּבָאתֶם אֶל נָבָל
  english_pob_choice: go to Nabal
  chosen_korean: 나발에게 가서
  alternatives_korean:
  - 나발에게로 가서
  - 나발에게 이르러
  lexicon: HALOT
  rationale: 직접 명령에서 말하는 이들의 시점에 맞춰 ‘가서’로 옮겼습니다.
- source_word: וּשְׁאֶלְתֶּם ל֥וֹ בִשְׁמִי לְשָׁלוֹם
  english_pob_choice: greet him in my name with peace
  chosen_korean: 내 이름으로 그의 평안을 물으십시오
  alternatives_korean:
  - 내 이름으로 문안하십시오
  - 내 이름으로 평안이 있는지 물으십시오
  lexicon: HALOT
  rationale: שׁאל + לְשָׁלוֹם는 단순한 ‘평화’보다 안부/평안을 묻는 인사 표현이므로, POB 주석의 의미를 살려 ‘평안을 물으십시오’로 옮겼습니다.
theological_decisions:
- issue: לְשָׁלוֹם의 의미 범위
  chosen_reading: 인사말로서 상대의 평안을 묻는 표현으로 처리했습니다.
  alternative_readings:
  - ‘평안으로’라는 형식적 번역
  - ‘평화를 전하십시오’라는 재구성
  rationale: 본문은 추상적 평화 선언보다 대면 인사와 안부 확인의 뉘앙스가 강하므로, 문맥에 맞는 한국어 관용을 선택했습니다.
  doctrine_reference: 문맥적 어법/화행
