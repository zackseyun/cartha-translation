  text: וַ/יְהִ֣י בַ/בֹּ֗קֶר בְּ/צֵ֤את הַ/יַּ֨יִן֙ מִ/נָּבָ֔ל וַ/תַּגֶּד ל֣/וֹ אִשְׁתּ֔/וֹ אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יָּ֤מָת לִבּ/וֹ֙ בְּ/קִרְבּ֔/וֹ וְ/ה֖וּא הָיָ֥ה לְ/אָֽבֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/037.yaml
  text: And in the morning[a], when the wine had gone out of Nabal, his wife told him these things, and his heart died within him[b], and he became like a stone.
  footnotes:
  - marker: a
    text: Literally, 'when the wine had gone out of Nabal,' that is, when he had sobered up or the effects of the wine had left him.
    reason: lexical_alternative
  - marker: b
    text: Or 'his heart failed within him.' The Hebrew uses vivid imagery rather than a technical medical description.
    reason: lexical_alternative
translation:
  language: ko
  text: 아침에 나발의 술이 빠졌을 때, 그의 아내가 그에게 이 일들을 말하니, 그의 마음이 속에서 죽고 그는 돌처럼 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘나발에게서 술이 빠졌을 때’입니다. 즉 술기운이 가셨다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직설적 의학 진술이라기보다 생생한 비유를 사용합니다. 그래서 정확한 진단은 단정하지 않았습니다.
    reason: theological_note
lexical_decisions:
- source_word: בַּבֹּקֶר
  english_pob_choice: in the morning
  chosen_korean: 아침에
  alternatives_korean:
  - 아침때에
  - 아침 무렵에
  lexicon: HALOT
  rationale: 일반적인 시간 표현으로 자연스럽고, 원문의 시간 지시를 간결하게 살립니다.
- source_word: בְּצֵאת הַיַּיִן מִנָּבָל
  english_pob_choice: when the wine had gone out of Nabal
  chosen_korean: 나발의 술이 빠졌을 때
  alternatives_korean:
  - 나발이 술기운이 깼을 때
  - 나발에게서 술이 빠져나갔을 때
  lexicon: HALOT
  rationale: 원문의 직역적 이미지를 살리면서도 한국어에서 이해 가능한 표현으로 옮겼습니다. '술이 빠졌다'는 술기운이 가셨다는 뜻을 드러냅니다.
- source_word: וַיָּמָת לִבּוֹ בְּקִרְבּוֹ
  english_pob_choice: his heart died within him
  chosen_korean: 그의 마음이 속에서 죽고
  alternatives_korean:
  - 그의 심장이 속에서 멎고
  - 그의 마음이 속에서 사라지고
  lexicon: HALOT
  rationale: 히브리어의 강한 비유를 그대로 유지해, 기술적 의학 진단으로 바꾸지 않았습니다. '마음'은 본문 이미지에 맞는 자연스러운 대응입니다.
- source_word: וְהוּא הָיָה לְאָבֶן
  english_pob_choice: he became like a stone
  chosen_korean: 그는 돌처럼 되었습니다
  alternatives_korean:
  - 그는 돌같이 되었습니다
  - 그는 돌이 되었습니다
  lexicon: HALOT
  rationale: 비유를 보존하되 한국어에서 매끄럽게 읽히도록 '돌처럼'으로 옮겼습니다. 문자적 동일화인 '돌이 되었습니다'는 비유를 너무 강하게 굳힐 수 있습니다.
theological_decisions:
- issue: 나발의 상태를 의학적으로 특정할지 여부
  chosen_reading: 본문의 비유적 서술을 유지하여, 정확한 의학적 진단은 밝히지 않았습니다.
  alternative_readings:
  - 심장마비를 일으켰다
  - 뇌졸중으로 쓰러졌다
  - 충격으로 정신이 멍해졌다
  rationale: 본문은 사건의 결과를 생생한 서술로 제시할 뿐, 기술적 의학 용어를 사용하지 않습니다. 원문의 의미 범위를 넘는 추정을 피하는 것이 번역상 더 충실합니다.
  doctrine_reference: 'Translation philosophy: source text의 평이한 의미를 유지하고, 본문이 말하지 않는 세부를 덧붙이지 않습니다.'
