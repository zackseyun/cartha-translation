source:
  edition: WLC
  text: וְ/עַתָּ֗ה דְּעִ֤י וּ/רְאִי֙ מַֽה תַּעֲשִׂ֔י כִּֽי כָלְתָ֧ה הָ/רָעָ֛ה אֶל אֲדֹנֵ֖י/נוּ וְ/עַ֣ל כָּל בֵּית֑/וֹ וְ/הוּא֙ בֶּן בְּלִיַּ֔עַל מִ/דַּבֵּ֖ר אֵלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/017.yaml
  text: Now know this and consider what you should do[a], for disaster has been determined against our master and against all his household, and he is such a worthless man that one cannot speak to him.
  footnotes:
  - marker: a
    text: Hebrew 'a son of worthlessness'; traditionally 'a son of Belial.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 이것을 아시고 무엇을 하실지 생각해 보십시오. 우리 주인과 그의 온 집안에 재앙이 내리기로 결정되었습니다. 그는 무가치한 사람이라 그에게는 말을 건넬 수조차 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘무가치함의 아들’이며, 전통적으로 ‘벨리알의 아들’로 옮겨 왔습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 대화의 급박한 전환을 자연스럽게 살리기 위해 합쇼체에서 간결한 전환어인 ‘이제’를 택했습니다.
- source_word: דְּעִי וּרְאִי מַה תַּעֲשִׂי
  english_pob_choice: know this and consider what you should do
  chosen_korean: 이것을 알으십시오. 그리고 무엇을 하셔야 할지 생각해 보십시오.
  alternatives_korean:
  - 알고 보십시오. 무엇을 해야 할지 보십시오.
  - 이것을 아시고 무엇을 하실지 살펴보십시오.
  lexicon: HALOT
  rationale: ידע+ראה의 연속 명령을 단순 정보 습득이 아니라 분별을 요청하는 압박으로 보고, ‘알다/생각해 보다’로 옮겨 Abigail에게 신중한 판단을 촉구하는 뉘앙스를 살렸습니다.
- source_word: כָלְתָה הָרָעָה
  english_pob_choice: disaster has been determined
  chosen_korean: 재앙이 내려오기로 정해졌습니다
  alternatives_korean:
  - 재앙이 이미 결정되었습니다
  - 악이 끝났습니다
  lexicon: HALOT
  rationale: ‘악’보다 문맥상 다가오는 파국에 맞는 ‘재앙’을 택했고, 완료형의 확정성을 ‘…하기로 정해졌습니다’로 표현했습니다.
- source_word: וְהוּא בֶּן בְּלִיַּעַל
  english_pob_choice: he is such a worthless man
  chosen_korean: 그는 몹시 무가치한 사람이라
  alternatives_korean:
  - 그는 벨리알의 아들이라
  - 그는 쓸모없는 사람이라
  - 그는 악한 사람이라
  lexicon: HALOT
  rationale: 히브리어 관용구를 고유명사화하지 않고, 인물의 도덕적·사회적 비하를 드러내는 ‘무가치한 사람’으로 풀어 옮겼습니다.
- source_word: מִדַּבֵּר אֵלָיו
  english_pob_choice: one cannot speak to him
  chosen_korean: 그에게 말을 건넬 수조차 없습니다
  alternatives_korean:
  - 아무도 그에게 말할 수 없습니다
  - 그와는 말이 통하지 않습니다
  lexicon: HALOT
  rationale: 직역보다 관용적인 한국어로 결과 의미를 살리되, 상대와의 대화 불가능성을 유지했습니다.
theological_decisions:
- issue: בְּלִיַּעַל 관용구의 처리
  chosen_reading: ‘벨리알’이라는 고유명사로 보지 않고, 인격적 타락을 가리키는 비하 표현으로 이해해 ‘무가치한 사람’으로 옮겼습니다.
  alternative_readings:
  - 벨리알의 아들
  - 사악한 사람
  rationale: 본문과 POB 주석이 모두 관용어로 읽도록 이끕니다. 한국어에서도 고유명사화를 피해야 본문의 인물 평가 기능이 과장되지 않습니다.
  doctrine_reference: 사무엘상 25:17의 문맥상 인물 평가와 서술 의도
