  rationale: 완료형과 분사의 서사적 구별을 ‘누워 있던’과 ‘누워 있었고’로 반영했습니다. 아브넬은 히브리어의 접속 구조에 따라 사울의 위치와 함께 다윗이 본 별도의 대상으로 유지했습니다. בַּמַּעְגָּל의 공간적 의미는 논쟁의 여지가 있으므로 본문에서 중심부라고 단정하지 않고, 각주에서 문자적 의미와 가능한 문맥적 이해를 밝혔습니다.
