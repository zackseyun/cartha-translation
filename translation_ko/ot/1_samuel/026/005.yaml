base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/005.yaml
  text: Then David arose and came to the place where Saul had camped[a], and David saw the place where Saul lay, and Abner son of Ner, the commander of his army. Saul was lying within the encampment, and the people were camped around him.
  footnotes:
  - marker: a
    text: Hebrew 'within the encampment' is more literally 'in the circle,' likely referring to the inner ring or central area of the camp.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다윗이 일어나 그곳으로 갔습니다. 그곳은 사울이 진을 치고 있던 곳이었고, 다윗은 사울이 누워 있는 곳과 그의 군대장관 넬의 아들 아브넬을 보았습니다. 사울은 진영 한가운데에 누워 있었고, 백성은 그를 둘러싸고 진을 치고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘원 안에’에 가깝지만, 여기서는 진영의 안쪽 중심부를 가리키는 표현으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어나다
  alternatives_korean:
  - 일어나다
  - 몸을 일으키다
  lexicon: HALOT
  rationale: 서사 진행의 첫 동작을 자연스러운 현대 한국어로 옮기되, 원문의 행동 전환을 분명히 드러내기 위해 ‘일어나다’를 택했습니다.
- source_word: וַיָּבֹא אֶל הַמָּקוֹם
  english_pob_choice: came to the place
  chosen_korean: 그곳으로 갔습니다
  alternatives_korean:
  - 그곳에 왔습니다
  - 그 장소에 갔습니다
  lexicon: HALOT
  rationale: אֶל이 가리키는 도달의 방향성을 살리면서도 한국어 서술로는 ‘그곳으로 갔습니다’가 가장 자연스럽습니다.
- source_word: שַׂר צְבָאוֹ
  english_pob_choice: the commander of his army
  chosen_korean: 군대장관
  alternatives_korean:
  - 군대의 지휘관
  - 군대의 사령관
  lexicon: HALOT
  rationale: צָבָא의 군사적 지휘 책임을 드러내기 위해 직역보다 의미를 분명히 하는 ‘군대장관’을 사용했습니다.
- source_word: בַּמַּעְגָּל
  english_pob_choice: within the encampment
  chosen_korean: 진영 한가운데에
  alternatives_korean:
  - 진 안에
  - 진영 안쪽에
  - 원형 진 안에
  lexicon: HALOT
  rationale: POB의 각주가 밝히듯 문자적으로는 ‘원(circle)’ 계열이지만, 문맥상 중앙부를 가리키므로 현대 한국어에서는 ‘진영 한가운데’가 의미를 가장 잘 전달합니다.
theological_decisions:
- issue: 사울과 아브넬의 배치 관계를 어떻게 표현할지
  chosen_reading: 아브넬을 사울과 별도로 ‘보았다’고 하여, 사울의 수면 위치와 아브넬의 위치를 구분해 서술했습니다.
  alternative_readings:
  - 사울이 누워 있는 곳에 아브넬이 함께 있었다고 풀어쓰는 방식
  - 아브넬을 사울의 수식어처럼 붙여 번역하는 방식
  rationale: 히브리어의 병렬 관찰 구조를 보존해야 하므로, 아브넬을 사울의 상태 설명에 흡수하지 않고 별도 관찰 대상으로 드러냈습니다.
  doctrine_reference: 본문 구조 보존 원칙
- issue: בַּמַּעְגָּל의 의미
  chosen_reading: ‘진영 한가운데에’로 옮겨, 방어 배치의 중심부라는 뜻을 전달했습니다.
  alternative_readings:
  - ‘원 안에’처럼 더 문자적으로 옮기는 방식
  - ‘진 가운데’로 일반화하는 방식
  rationale: 문자적 ‘원’은 현대 독자에게 अस्प명할 수 있으므로, 원문이 암시하는 중심부 의미를 살려 과도한 직역을 피했습니다.
  doctrine_reference: 의미 등가 번역 원칙
