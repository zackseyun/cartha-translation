id: 1SA.26.24
reference: 1 Samuel 26:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כַּ/אֲשֶׁ֨ר גָּדְלָ֧ה נַפְשְׁ/ךָ֛ הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/עֵינָ֑/י כֵּ֣ן תִּגְדַּ֤ל נַפְשִׁ/י֙ בְּ/עֵינֵ֣י יְהוָ֔ה וְ/יַצִּלֵ֖/נִי מִ/כָּל צָרָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/024.yaml
  text: And look[a], just as your life was precious in my eyes this day, so may my life be precious in the eyes of Yahweh, and may he deliver me from all distress.
  footnotes:
  - marker: a
    text: Or 'your life was great in my eyes ... so may my life be great in the eyes of the LORD.' The Hebrew idiom uses 'great' to express high value or preciousness.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 오늘 당신의 생명이 내 눈에 귀중하였던 것같이, 내 생명도 야훼의 눈에 귀중하게 되기를, 또 그분께서 나를 모든 환난에서 건져 주시기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 생명이 내 눈에 크게 여겨졌던 것같이… 내 생명도 야훼의 눈에 크게 여겨지기를 바랍니다.’ 히브리어 관용구는 ‘크게 되다’로 가치와 귀중함을 나타냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 감탄/전환 표현으로, 현대 한국어에서 자연스럽고 격식 있는 호응은 ‘보십시오’입니다.
- source_word: גָּדְלָה ... נַפְשְׁךָ ... בְּעֵינַי
  english_pob_choice: your life was precious in my eyes
  chosen_korean: 당신의 생명이 내 눈에 귀중하였던 것
  alternatives_korean:
  - 당신의 생명이 내 눈에 크게 여겨졌던 것
  - 당신의 생명이 내 눈에 소중하였던 것
  lexicon: HALOT
  rationale: 직역하면 ‘크게 되다’이지만 관용적으로 가치 있게 여긴다는 뜻이므로, 문맥상 ‘귀중하다’가 가장 정확합니다.
- source_word: נַפְשִׁי ... בְּעֵינֵי יְהוָה
  english_pob_choice: may my life be precious in the eyes of Yahweh
  chosen_korean: 내 생명도 야훼의 눈에 귀중하게 되기를 바라며
  alternatives_korean:
  - 내 생명도 야훼의 눈에 크게 되기를 바라며
  - 내 생명도 야훼 앞에 소중하게 되기를 바라며
  lexicon: HALOT
  rationale: 첫 절과 같은 관용을 유지해 비교 구조를 살리고, ‘눈에’는 히브리어 관용인 ‘in the eyes of’를 그대로 살린 표현입니다.
- source_word: מִכָּל צָרָה
  english_pob_choice: from all distress
  chosen_korean: 모든 환난에서
  alternatives_korean:
  - 모든 고통에서
  - 모든 곤경에서
  - 모든 재난에서
  lexicon: HALOT
  rationale: צָרָה는 단순한 불편보다 위협적이고 고통스러운 ‘환난/곤경’의 범위가 적절하며, 한국어에서는 ‘환난’이 문맥을 가장 잘 반영합니다.
theological_decisions:
- issue: 야훼라는 신명(神名) 표기
  chosen_reading: יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 프로젝트 기본 원칙에 따라 신명은 전통적 대체어가 아니라 고유 신명 ‘야훼’로 유지해 언약 이름을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 첫 절과 둘째 절의 비교·청원 구조
  chosen_reading: ‘…귀중하였던 것같이… 귀중하게 되기를 바라며’로 대구를 살렸습니다.
  alternative_readings:
  - ‘…소중했듯이… 소중하기를 바라며’
  - ‘…크게 여겨졌던 것같이… 크게 여겨지기를 바라며’
  rationale: 히브리어는 과거 진술과 청원의 평행 구조를 이루므로, 같은 핵심 어휘를 반복해 비교의 대응과 기도의 톤을 분명히 했습니다.
  doctrine_reference: 문맥상의 수사 구조(비교 + 소망/청원)
