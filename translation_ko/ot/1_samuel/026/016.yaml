  text: לֹא ט֞וֹב הַ/דָּבָ֣ר הַ/זֶּה֮ אֲשֶׁ֣ר עָשִׂיתָ֒ חַי יְהוָ֗ה כִּ֤י בְנֵי מָ֨וֶת֙ אַתֶּ֔ם אֲשֶׁ֧ר לֹֽא שְׁמַרְתֶּ֛ם עַל אֲדֹנֵי/כֶ֖ם עַל מְשִׁ֣יחַ יְהוָ֑ה וְ/עַתָּ֣ה רְאֵ֗ה אֵֽי חֲנִ֥ית הַ/מֶּ֛לֶךְ וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם אֲשֶׁ֥ר מראשת/ו־־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/016.yaml
  text: This thing that you have done is not good. As Yahweh lives[a], you are sons of death, because you did not keep watch over your master, over Yahweh’s anointed. And now, look—where are the king’s spear and the water jar that were by his head?
  footnotes:
  - marker: a
    text: Hebrew literally, 'you are sons of death,' an idiom meaning that they are liable to the death penalty or deserve to die.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 한 이 일은 좋지 않습니다. 야훼께서 살아 계심을 두고 맹세하건대, 너희는 죽어 마땅한 자들입니다. 너희가 너희 주인을, 곧 야훼의 기름부음 받은 이를 지키지 않았기 때문입니다. 이제 보십시오. 왕의 창과 그의 머리 곁에 있던 물병이 어디 있습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너희는 죽음의 아들들’이지만, 여기서는 죽음의 형벌에 해당한다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא טוֹב הַדָּבָר הַזֶּה
  english_pob_choice: This thing ... is not good
  chosen_korean: 네가 한 이 일은 좋지 않습니다
  alternatives_korean:
  - 이 일은 좋지 않습니다
  - 이 일이 옳지 않습니다
  - 이 일은 악합니다
  lexicon: HALOT
  rationale: דָּבָר는 여기서 광범위하게 ‘일/행위’를 가리키므로 ‘한 이 일’로 자연스럽게 옮기되, 평가 표현은 원문의 직설성을 살려 ‘좋지 않습니다’로 두었습니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서 살아 계심을 두고 맹세하건대
  alternatives_korean:
  - 야훼께서 살아 계십니다
  - 야훼의 생명을 두고
  lexicon: HALOT
  rationale: 히브리어의 서원 공식이므로 단순 진술이 아니라 맹세의 뉘앙스를 드러내는 한국어 관용 표현으로 옮겼습니다.
- source_word: בְנֵי מָוֶת אַתֶּם
  english_pob_choice: you are sons of death
  chosen_korean: 너희는 죽어 마땅한 자들입니다
  alternatives_korean:
  - 너희는 죽음의 아들들입니다
  - 너희는 사형에 해당합니다
  - 너희는 죽을 자들입니다
  lexicon: HALOT
  rationale: 직역하면 난해한 관용구이므로, POB가 보존한 ‘sons of death’의 사법적 의미를 한국어로 풀어 ‘죽어 마땅한 자들’로 옮겨 형벌 가능성을 드러냈습니다.
- source_word: מְשִׁיחַ יְהוָה
  english_pob_choice: Yahweh’s anointed
  chosen_korean: 야훼의 기름부음 받은 이
  alternatives_korean:
  - 야훼의 메시아
  - 야훼께 기름부음을 받은 자
  - 야훼의 기름부음받은 자
  lexicon: HALOT
  rationale: 사울의 왕권적·성별된 지위를 드러내되, 이 문맥에서 곧바로 종말론적 ‘메시아’로 오해되지 않도록 ‘기름부음 받은 이’로 번역했습니다.
- source_word: מראשתו
  english_pob_choice: that were by his head
  chosen_korean: 그의 머리 곁에 있던
  alternatives_korean:
  - 그의 머리맡에 있던
  - 그의 머리 옆에 있던
  - 그의 머리 곁에 있던 것들
  lexicon: HALOT
  rationale: 두 물건을 함께 수식하는 표현이므로 한국어에서는 위치 관계를 자연스럽게 살린 ‘머리 곁에 있던’으로 처리했습니다.
theological_decisions:
- issue: 여호와/야훼의 고유명사 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 יְהוָה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 언약적 신명은 ‘야훼’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘기름부음 받은 이’의 의미 범위
  chosen_reading: 사울의 왕적 신분을 가리키는 ‘야훼의 기름부음 받은 이’
  alternative_readings:
  - 메시아적 호칭으로 처리
  - 단순히 ‘왕’으로 환원
  rationale: 본문의 초점은 다윗이 사울의 왕권을 침해하지 않았음을 지적하는 데 있으므로, 종말론적 메시아 호칭으로 확장하지 않고 왕적 성별의 의미를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 2, 3
