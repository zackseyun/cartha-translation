  edition: WLC
  text: וַ/יִּקְרָ֨א דָוִ֜ד אֶל הָ/עָ֗ם וְ/אֶל אַבְנֵ֤ר בֶּן נֵר֙ לֵ/אמֹ֔ר הֲ/ל֥וֹא תַעֲנֶ֖ה אַבְנֵ֑ר וַ/יַּ֤עַן אַבְנֵר֙ וַ/יֹּ֔אמֶר מִ֥י אַתָּ֖ה קָרָ֥אתָ אֶל הַ/מֶּֽלֶךְ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/014.yaml
  text: Then David called to the troops and to Abner son of Ner, saying, “Will you not answer, Abner?” Abner answered and said, “Who are you, calling to the king?”
translation:
  language: ko
  text: 그때 다윗이 군사들과 넬의 아들 아브넬에게 불러 말했습니다. "아브넬아, 대답하지 않겠느냐?" 아브넬이 대답하여 말했습니다. "당신은 누구이기에 왕에게 외칩니까?"[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘그 백성’이지만, 문맥상 전투 대열을 가리키므로 ‘군사들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역은 ‘네가 누구냐’에 가깝지만, 한국어에서 공개적 추궁의 뉘앙스를 살려 ‘당신은 누구이기에’로 옮겼습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: הָעָם
  english_pob_choice: the troops
  chosen_korean: 군사들
  alternatives_korean:
  - 백성들
  - 사람들
  - 군중
  lexicon: עָם
  rationale: 본문의 상황은 진영의 병력과 지휘관 아브넬에게 외치는 장면이므로, POB의 ‘the troops’를 따라 ‘군사들’로 옮겨 문맥상 대상 집단을 분명히 했습니다.
- source_word: וַיִּקְרָא ... אֶל
  english_pob_choice: called to
  chosen_korean: 불러 말했습니다
  alternatives_korean:
  - 외쳐 말했습니다
  - 불렀습니다
  - 호명하여 말했습니다
  lexicon: קרא
  rationale: 단순한 부름보다 공개적으로 소리를 내어 호출하는 뉘앙스가 있어, 문맥에 맞게 자연스러운 현대 한국어로 풀어 옮겼습니다.
- source_word: הֲלוֹא תַעֲנֶה
  english_pob_choice: Will you not answer
  chosen_korean: 대답하지 않겠느냐
  alternatives_korean:
  - 대답하지 않겠습니까
  - 왜 대답하지 않느냐
  - 응답하지 않겠느냐
  lexicon: ענה
  rationale: 도전적이고 꾸짖는 뉘앙스를 살리기 위해 반문형으로 처리했으며, 아브넬에게 직접 던지는 말투를 반영했습니다.
- source_word: מִי אַתָּה
  english_pob_choice: Who are you
  chosen_korean: 당신은 누구이기에
  alternatives_korean:
  - 네가 누구냐
  - 누구냐
  - 당신이 누구라고
  lexicon: מי
  rationale: 직설적인 정체성 추궁을 한국어에서 자연스럽게 드러내기 위해 ‘당신은 누구이기에’로 옮겼고, 이어지는 ‘왕에게 외칩니까?’와 연결되도록 했습니다.
theological_decisions:
- issue: 하나님/신적 호칭이 없는 군사적 대화의 직설성 유지
  chosen_reading: 원문의 공개 질책과 도전적 어조를 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 완곡하게 ‘왜 대답하지 않습니까’로 순화
  - 서술형으로 낮춰 ‘대답이 없습니까’로 처리
  rationale: 이 절은 신학 용어보다 장면의 긴장과 공개적 수치를 드러내는 것이 핵심이므로, 원문의 도발적 수사 의도를 보존하는 쪽이 본문 의미에 더 충실합니다.
  doctrine_reference: 서술 문맥의 수사적 보존
