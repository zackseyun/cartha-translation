source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר דָּוִד֙ הָ/עֵ֔בֶר וַ/יַּעֲמֹ֥ד עַל רֹאשׁ הָ/הָ֖ר מֵֽ/רָחֹ֑ק רַ֥ב הַ/מָּק֖וֹם בֵּינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/013.yaml
  text: Then David crossed over to the other side and stood on the top of the mountain at a distance[a]; there was a great space between them.
  footnotes:
  - marker: a
    text: Or 'the distance between them was great.' The Hebrew literally says 'great was the space/place between them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다윗은 건너편으로 가서 멀리 떨어진 산 꼭대기에 섰습니다. 그들 사이에는 큰 거리가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들 사이의 공간/장소가 컸다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  english_pob_choice: crossed over
  chosen_korean: 건너가
  alternatives_korean:
  - 건너갔습니다
  - 지나갔습니다
  lexicon: HALOT
  rationale: עבר의 핵심 의미인 ‘한쪽에서 다른 쪽으로 건넘’을 살려 ‘건너가’로 옮겼습니다.
- source_word: הָעֵבֶר
  english_pob_choice: the other side
  chosen_korean: 건너편
  alternatives_korean:
  - 반대편
  - 다른 쪽
  lexicon: HALOT
  rationale: 정관사와 함께 쓰여 반대편/저편을 가리키므로, 자연스럽고 공간감을 살리는 ‘건너편’이 적절합니다.
- source_word: עַל רֹאשׁ הָהָר
  english_pob_choice: on the top of the mountain
  chosen_korean: 산 꼭대기에
  alternatives_korean:
  - 산 정수리에
  - 산 꼭대기 위에
  lexicon: HALOT
  rationale: רֹאשׁ의 문자적 ‘머리’보다 지형 표현의 ‘꼭대기/정상’이 문맥에 맞으며, 한국어로는 ‘산 꼭대기에’가 가장 자연스럽습니다.
- source_word: רַב הַמָּקוֹם בֵּינֵיהֶם
  english_pob_choice: there was a great space between them
  chosen_korean: 그들 사이에는 큰 거리가 있었습니다
  alternatives_korean:
  - 그들 사이의 거리가 매우 컸습니다
  - 그들 사이에는 넓은 공간이 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 직역적 ‘공간/장소가 크다’는 표현을 문맥상 거리로 풀어, POB의 ‘great space’ 취지를 살렸습니다.
theological_decisions:
- issue: 공간 표현의 해석
  chosen_reading: ‘큰 거리’로 옮겨, 다윗과 상대방 사이의 실제적 분리를 드러냈습니다.
  alternative_readings:
  - ‘큰 공간’
  - ‘넓은 곳’
  rationale: 본문은 단순한 지형 설명이 아니라 두 사람 사이에 충분한 거리감이 있음을 강조하므로, 한국어에서는 ‘거리’가 의미를 가장 분명하게 전달합니다.
  doctrine_reference: 서사 문맥 해석
