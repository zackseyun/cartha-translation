- from: 그러자 다윗이 건너편으로 건너가 산 꼭대기에 서서 멀리서 바라보니, 그들 사이에는 큰 거리가 있었습니다.[a]
  to: 그러자 다윗은 건너편으로 가서 멀리 떨어진 산 꼭대기에 섰습니다. 그들 사이에는 큰 거리가 있었습니다.[a]
  rationale: 원문에 없는 ‘바라보다’를 삭제하고, מֵרָחֹק의 공간적 의미를 ‘멀리 떨어진’으로 반영했습니다. ‘큰 거리’는 문맥상 רַב הַמָּקוֹם בֵּינֵיהֶם를 자연스럽게 옮긴 것이며, 문자적 표현은 각주로 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:26:35Z'
