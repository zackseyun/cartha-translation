  text: וַ/יָּ֣קָם שָׁא֗וּל וַ/יֵּ֨רֶד֙ אֶל מִדְבַּר זִ֔יף וְ/אִתּ֛/וֹ שְׁלֹֽשֶׁת אֲלָפִ֥ים אִ֖ישׁ בְּחוּרֵ֣י יִשְׂרָאֵ֑ל לְ/בַקֵּ֥שׁ אֶת דָּוִ֖ד בְּ/מִדְבַּר זִֽיף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/002.yaml
  text: Then Saul arose and went down to the wilderness of Ziph[a], and with him were three thousand chosen men of Israel, to seek David in the wilderness of Ziph.
  footnotes:
  - marker: a
    text: Or 'with three thousand chosen men of Israel with him'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 사울이 일어나 십 광야로 내려갔는데, 그와 함께 이스라엘의 삼천 명의 뽑힌 사람들이 있었으며, 다윗을 십 광야에서 찾으려 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그와 함께 이스라엘의 삼천 명의 뽑힌 사람들이 있었다’.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어났습니다
  - 몸을 일으켰습니다
  lexicon: HALOT
  rationale: 서사적 전환을 나타내는 קום의 동작을 한국어의 자연스러운 서사 표현인 ‘일어나’로 옮겨, 단순한 이동보다 결단적 행동의 시작을 살렸습니다.
- source_word: וַיֵּרֶד
  english_pob_choice: went down
  chosen_korean: 내려갔는데
  alternatives_korean:
  - 내려갔습니다
  - 내려갔고
  lexicon: HALOT
  rationale: ירד의 방향성을 그대로 반영해 ‘내려갔는데’로 옮겼고, 뒤의 동반 상황을 자연스럽게 잇도록 했습니다.
- source_word: בְּחוּרֵי יִשְׂרָאֵל
  english_pob_choice: chosen men of Israel
  chosen_korean: 이스라엘의 삼천 명의 뽑힌 사람들
  alternatives_korean:
  - 이스라엘의 선택된 사람들
  - 이스라엘의 정예 병사들
  lexicon: HALOT
  rationale: בחר에서 온 ‘뽑힌’이라는 어휘를 살려 선택된 정예를 드러냈고, 본문이 ‘남자들’보다 군사적 집단을 가리키므로 ‘사람들’로 처리했습니다.
- source_word: לְבַקֵּשׁ
  english_pob_choice: to seek
  chosen_korean: 찾으려 했습니다
  alternatives_korean:
  - 찾으려고 했습니다
  - 구하려 했습니다
  lexicon: HALOT
  rationale: 이 문맥의 בקש는 단순 탐색보다 ‘추적하여 찾아내려 함’의 뉘앙스가 강하므로, 한국어에서는 자연스럽게 ‘찾으려 했습니다’로 옮겼습니다.
theological_decisions:
- issue: 사울의 이동과 추적 행위의 서술 톤
  chosen_reading: 사울의 공격적 수색 행동을 완곡하게 줄이지 않고, 서사적으로 직선적인 표현으로 옮겼습니다.
  alternative_readings:
  - 사울이 나아갔습니다
  - 사울이 수색하러 갔습니다
  rationale: 본문은 왕의 군사적 추적을 묘사하므로, 행동의 긴장감을 유지하는 것이 원문의 의도에 더 가깝습니다.
  doctrine_reference: '서사 본문 번역 원칙: 원문의 행위 강도와 사건 전개를 보존'
