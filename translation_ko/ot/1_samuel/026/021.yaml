base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/021.yaml
  text: Then Saul said[a], “I have sinned. Return, my son David, for I will not harm you again, because my life was precious in your eyes this day. Look[b], I have acted foolishly and have gone badly astray.”
  footnotes:
  - marker: a
    text: Or, 'my soul was precious in your eyes.' Here 'soul' (נֶפֶשׁ) refers to Saul's life or person in context.
    reason: lexical_alternative
  - marker: b
    text: Or, 'and erred greatly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 사울이 말했습니다. “내가 죄를 지었습니다. 내 아들 다윗아, 돌아오십시오. 내가 다시는 당신에게 해를 끼치지 않겠습니다. 오늘 내 생명이 당신의 눈에 귀하게 여겨졌기 때문입니다[a]. 보십시오, 내가 어리석게 행동했고 크게 잘못했습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 영혼이 당신의 눈에 귀하게 여겨졌기 때문입니다.’ 여기서 ‘영혼’(נֶפֶשׁ)은 문맥상 사울의 생명 또는 자신을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그리고 매우 크게 빗나갔습니다.’
    reason: lexical_alternative
