source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ שָׁא֨וּל חָטָ֜אתִי שׁ֣וּב בְּנִֽ/י דָוִ֗ד כִּ֠י לֹֽא אָרַ֤ע לְ/ךָ֙ ע֔וֹד תַּ֠חַת אֲשֶׁ֨ר יָקְרָ֥ה נַפְשִׁ֛/י בְּ/עֵינֶ֖י/ךָ הַ/יּ֣וֹם הַ/זֶּ֑ה הִנֵּ֥ה הִסְכַּ֛לְתִּי וָ/אֶשְׁגֶּ֖ה הַרְבֵּ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/021.yaml
  text: Then Saul said[a], “I have sinned. Return, my son David, for I will not harm you again, because my life was precious in your eyes this day. Look[b], I have acted foolishly and have gone badly astray.”
  footnotes:
  - marker: a
    text: Or, 'my soul was precious in your eyes.' Here 'soul' (נֶפֶשׁ) refers to Saul's life or person in context.
    reason: lexical_alternative
  - marker: b
    text: Or, 'and erred greatly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 사울이 말했습니다. “내가 죄를 지었습니다. 내 아들 다윗아, 돌아오너라. 내가 다시는 너를 해치지 않겠습니다. 오늘 내 생명이 네 눈에 귀하게 여겨졌기 때문입니다. 보십시오, 내가 어리석게 행동했고 크게 잘못되었습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 영혼이 네 눈에 귀하게 여겨졌기 때문입니다’. 여기서 ‘영혼’(נֶפֶשׁ)은 문맥상 사울의 생명 또는 인격을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그리고 내가 크게 잘못하였습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  english_pob_choice: I have sinned
  chosen_korean: 내가 죄를 지었습니다
  alternatives_korean:
  - 내가 죄를 범했습니다
  - 내가 죄를 지었나이다
  lexicon: HALOT
  rationale: 사울의 직접적 고백으로서 עבר/죄책을 분명히 드러내는 현대 한국어 표현을 택했습니다.
- source_word: שׁוּב בְּנִי דָוִד
  english_pob_choice: Return, my son David
  chosen_korean: 내 아들 다윗아, 돌아오너라
  alternatives_korean:
  - 내 아들 다윗아, 돌아오십시오
  - 다윗아, 돌아오너라
  lexicon: HALOT
  rationale: 호격과 명령형을 살렸고, 사울이 다윗에게 직접 말하는 관계적 뉘앙스를 반영했습니다.
- source_word: לֹא אָרַע לְךָ עוֹד
  english_pob_choice: I will not harm you again
  chosen_korean: 내가 다시는 너를 해치지 않겠습니다
  alternatives_korean:
  - 내가 다시는 너에게 해를 끼치지 않겠습니다
  - 내가 다시는 너를 해하지 않겠습니다
  lexicon: HALOT
  rationale: 히필의 רעע를 현대어로 자연스럽게 옮기되, 단순한 감정이 아니라 실제적 해악의 금지를 분명히 했습니다.
- source_word: יָקְרָה נַפְשִׁי בְּעֵינֶי/ךָ
  english_pob_choice: my life was precious in your eyes
  chosen_korean: 내 생명이 네 눈에 귀하게 여겨졌기 때문입니다
  alternatives_korean:
  - 내 목숨이 네 눈에 귀했기 때문입니다
  - 내 생명이 네게 소중했기 때문입니다
  lexicon: HALOT
  rationale: נֶפֶשׁ을 이 문맥에 맞게 ‘생명’으로 풀고, יקר의 ‘귀하다/소중하다’ 의미를 자연스럽게 살렸습니다.
- source_word: הִסְכַּלְתִּי וָאֶשְׁגֶּה הַרְבֵּה מְאֹד
  english_pob_choice: I have acted foolishly and have gone badly astray
  chosen_korean: 내가 어리석게 행동했고 크게 잘못되었습니다
  alternatives_korean:
  - 내가 어리석게 행동했고 크게 길을 벗어났습니다
  - 내가 어리석게 행동했고 매우 크게 빗나갔습니다
  lexicon: HALOT
  rationale: 두 동사의 병렬을 살리되, 한국어에서는 ‘크게 잘못되었습니다’가 שגה의 강한 오류성과 결과를 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: נֶפֶשׁ의 의미
  chosen_reading: ‘내 생명’으로 옮겨 사울의 실제 목숨을 가리키게 했습니다.
  alternative_readings:
  - ‘내 영혼’으로 옮길 수 있습니다.
  rationale: 이 장면은 다윗이 사울의 목숨을 살려 준 맥락이므로, כאן의 נֶפֶשׁ을 영혼론적 진술로 확장하지 않고 서사적 의미를 보존했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; avoid importing anthropology not demanded by context.'
