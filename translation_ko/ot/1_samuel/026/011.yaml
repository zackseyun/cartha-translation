id: 1SA.26.11
reference: 1 Samuel 26:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָלִ֤ילָ/ה לִּ/י֙ מֵֽ/יהוָ֔ה מִ/שְּׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֣יחַ יְהוָ֑ה וְ֠/עַתָּה קַח נָ֨א אֶֽת הַ/חֲנִ֜ית אֲשֶׁ֧ר מראשת/ו וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם וְ/נֵ֥לֲכָה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/011.yaml
  text: Far be it from me[a], by Yahweh, to stretch out my hand against Yahweh’s anointed. But now, please take the spear that is at his head, and the jar of water[c][b], and let us go.
  footnotes:
  - marker: a
    text: Or, 'Far be it from me from the LORD,' an idiom meaning strong refusal or abhorrence; 'by the LORD' reflects the oath-like force of the Hebrew.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD’s anointed.' The word is related to 'Messiah,' but here it refers to Saul as the king anointed by the LORD.
    reason: lexical_alternative
  - marker: c
    text: Or 'by the LORD,'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼께서 제가 야훼의 기름부음받은 이에게 손을 대는 일을 결코 허락하지 않으십니다.[a] 이제, 부디 그 머리맡에 있는 창과 물병을 가져가십시오. 그리고 떠납시다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘야훼로 말미암아, 내게는 결코 그럴 수 없다’라는 뜻의 관용구로, 강한 거절과 혐오를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘야훼의 기름부음받은 이’입니다. 여기서는 사울을 가리킵니다.
    reason: theological_note
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיְהוָה
  english_pob_choice: Far be it from me … by Yahweh
  chosen_korean: 저는 야훼 앞에서 … 할 수 없습니다
  alternatives_korean:
  - 저에게는 결코 있을 수 없습니다
  - 야훼로 말미암아 저는 … 못합니다
  - 야훼 앞에서 저는 … 도무지 못합니다
  lexicon: HALOT
  rationale: חָלִילָה לִּי는 강한 거절·혐오를 나타내는 관용구이므로, 한국어에서는 자연스럽고 단호한 부정으로 풀어 ‘도무지 할 수 없습니다’로 옮겼습니다. מֵיְהוָה는 서원/호소가 섞인 전치사 용법으로 보아 ‘야훼 앞에서’로 처리해 어색한 직역을 피했습니다.
- source_word: מִשְּׁלֹחַ יָדִי
  english_pob_choice: to stretch out my hand
  chosen_korean: 손을 뻗는 일
  alternatives_korean:
  - 손을 내미는 일
  - 손을 들어 해치는 일
  - 공격하는 일
  lexicon: HALOT
  rationale: 히브리어 관용구의 뜻은 적대적 행동을 하는 것이므로, 직역의 이미지를 살리되 한국어로는 의미가 드러나게 ‘손을 뻗는 일’로 옮겼습니다.
- source_word: בִּמְשִׁיחַ יְהוָה
  english_pob_choice: against the LORD’s anointed
  chosen_korean: 야훼의 기름부음받은 이
  alternatives_korean:
  - 야훼의 메시아
  - 야훼의 기름부음받은 왕
  - 야훼의 기름부음받은 자
  lexicon: HALOT
  rationale: 여기서는 고유한 종말론적 칭호가 아니라 사울의 왕적 기름부음을 가리키므로, ‘메시아’보다 서술적 표현인 ‘기름부음받은 이’를 택해 역사적 맥락을 보존했습니다.
- source_word: הַחֲנִית אֲשֶׁר מראשתו
  english_pob_choice: the spear that is at his head
  chosen_korean: 그 머리맡에 있는 창
  alternatives_korean:
  - 그 머리 곁에 있는 창
  - 그 머리 위에 있는 창
  - 그 머리맡의 창
  lexicon: HALOT
  rationale: מראשתו는 위치를 나타내는 표현이므로 ‘머리맡’이 가장 자연스럽고, 잠든 사울의 옆에 놓인 창이라는 장면을 분명하게 살립니다.
- source_word: צַפַּחַת הַמַּיִם
  english_pob_choice: the jar of water
  chosen_korean: 물병
  alternatives_korean:
  - 물 항아리
  - 물단지
  - 물독
  lexicon: HALOT
  rationale: 작은 용기라는 의미를 살리면서 현대 한국어에서 바로 이해되는 표현으로 ‘물병’을 택했습니다. 맥락상 단순한 병이 아니라 물을 담는 용기임은 분명합니다.
theological_decisions:
- issue: 야훼의 이름과 맹세적 어조
  chosen_reading: ‘야훼 앞에서’로 옮겨 강한 거절과 경외의 뉘앙스를 함께 살렸습니다.
  alternative_readings:
  - ‘야훼로 말미암아’
  - ‘야훼를 두고’
  - ‘야훼께 맹세코’
  rationale: 히브리어는 단순한 장소 전치사라기보다 하나님을 향한 호소/서원에 가까운 어조를 띠므로, 한국어에서도 서술적 맹세감이 전달되도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: מְשִׁיחַ의 번역
  chosen_reading: ‘기름부음받은 이’로 번역해 사울의 왕적 지위를 드러냈습니다.
  alternative_readings:
  - ‘메시아’
  - ‘기름부음받은 왕’
  rationale: 이 구절의 מְשִׁיחַ는 후대의 구원자 칭호가 아니라 현재 이야기 속 왕에게 붙은 호칭이므로, 과도한 신학적 확장을 피하는 것이 본문 의미에 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2; title-sensitive rendering
