    reason: theological_note
  revision_rationale: The revision renders the opening as an emphatic divine prohibition, which communicates the force of the Hebrew idiom without treating the disputed prepositional nuance as a literal ‘before Yahweh.’ It also makes the singular imperative and plural cohortative natural in modern 합쇼체. Footnote anchors have been relocated and the obsolete note removed.
