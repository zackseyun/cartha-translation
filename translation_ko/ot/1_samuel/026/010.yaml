  text: וַ/יֹּ֤אמֶר דָּוִד֙ חַי יְהוָ֔ה כִּ֥י אִם יְהוָ֖ה יִגָּפֶ֑/נּוּ אֽוֹ יוֹמ֤/וֹ יָבוֹא֙ וָ/מֵ֔ת א֧וֹ בַ/מִּלְחָמָ֛ה יֵרֵ֖ד וְ/נִסְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/010.yaml
  text: And David said[a], “As Yahweh lives, surely Yahweh will strike him, or his day will come to die[c][b], or he will go down into battle and perish.”
  footnotes:
  - marker: a
    text: Or, 'the LORD will strike him down.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'his time will come and he will die.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'he will go down to battle and be swept away.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 말했습니다. 「야훼께서 살아 계심 같이, 야훼께서 반드시 그를 치시거나, 그의 날이 와서 죽거나, 전쟁 속으로 내려가다 멸망할 것입니다」.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그를 치실 것입니다”입니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 “그의 날이 와서 죽다”로, 죽음이 정해진 때를 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “전쟁에 내려가 멸망하다”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서 살아 계심 같이
  alternatives_korean:
  - 야훼께서 살아 계신 것처럼
  - 야훼의 생명을 두고
  lexicon: HALOT
  rationale: 히브리어의 맹세 공식은 한국어에서도 관용적이고 장엄한 맹세 표현으로 옮기는 것이 자연스럽습니다. '살아 계심 같이'가 형식성과 선서의 강도를 함께 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 프로젝트 기본값에 따라 '야훼'로 옮겨야 하며, 일반 호칭인 '주님'으로 바꾸면 고유 이름의 식별성이 약해집니다.
- source_word: יִגָּפֶנּוּ
  english_pob_choice: will strike him
  chosen_korean: 반드시 그를 치시거나
  alternatives_korean:
  - 그를 치실 것이거나
  - 그를 치셔서 쓰러뜨리거나
  lexicon: HALOT
  rationale: נָגַף의 핵심은 निर्ण정적 타격/치심입니다. '치시다'는 직접적이고, 문맥상 다음 절들과 병렬되는 가능성 열거를 살리기 위해 '반드시'를 두었습니다.
- source_word: יוֹמוֹ יָבוֹא וָמֵת
  english_pob_choice: his day will come to die
  chosen_korean: 그의 날이 와서 죽거나
  alternatives_korean:
  - 그의 때가 와서 죽거나
  - 그의 날이 이르러 죽거나
  lexicon: HALOT
  rationale: 히브리어의 '그의 날'은 죽음의 정해진 때를 가리키는 관용구이므로, 이를 자연스럽게 풀되 '죽다'를 유지해 원문의 죽음-때 표현을 보존했습니다.
- source_word: בַמִּלְחָמָה יֵרֵד וְנִסְפָּה
  english_pob_choice: he will go down into battle and perish
  chosen_korean: 전쟁 속으로 내려가다 멸망할 것입니다
  alternatives_korean:
  - 전쟁에 나가 멸망할 것입니다
  - 전투로 내려가 멸망할 것입니다
  - 전쟁으로 내려가 사라질 것입니다
  lexicon: HALOT
  rationale: יָרַד('내려가다')와 נִסְפָּה('멸망하다/소멸하다')의 두 동사를 모두 살리기 위해 직역을 유지했습니다. '전쟁 속으로'는 전투 상황의 함의를 보존하면서 한국어로도 읽히게 합니다.
theological_decisions:
- issue: 여호와/야훼 표기와 맹세 공식의 어조
  chosen_reading: 하나님의 고유 이름은 '야훼'로 두고, 맹세 표현은 한국어의 장중한 선서 어법인 '살아 계심 같이'로 옮겼습니다.
  alternative_readings:
  - '''여호와께서 살아 계심 같이'''
  - '''야훼는 살아 계십니다'''
  rationale: 본문은 단순 진술이 아니라 맹세 선언이므로, 신명 표기를 유지하면서도 한국어에서 그 엄숙한 화행을 자연스럽게 드러내는 방식이 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
