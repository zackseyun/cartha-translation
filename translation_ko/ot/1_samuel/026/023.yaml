- from: 야훼께서 각 사람에게 그의 의와 그의 신실함을 갚아 주시기를 바랍니다[a]. 야훼께서 오늘 당신을 내 손에 넘겨 주셨지만[b], 저는 야훼의 기름부음 받은 이를 향해 손을 내밀려고 하지 않았습니다.
  to: 야훼께서는 각 사람의 의와 신실함에 따라 갚아 주실 것입니다[a]. 오늘 야훼께서 왕을 제 손에 넘겨주셨는데도, 저는 야훼의 기름부음 받은 이를 해하려고 손을 뻗으려 하지 않았습니다[b].
  rationale: 직설적 보응 선언을 기원문으로 바꾼 점을 바로잡고, 한국어의 자연스러운 보응 표현을 사용했습니다. 사울을 가리키는 직접 목적어는 현대 한국어의 ‘당신’이 낳을 수 있는 어색함을 피하여 문맥상 ‘왕’으로 옮겼습니다. 또한 각주 b를 설명 대상인 ‘야훼의 기름부음 받은 이’에 직접 연결했습니다.
