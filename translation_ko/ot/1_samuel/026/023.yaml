source:
  edition: WLC
  text: וַֽ/יהוָה֙ יָשִׁ֣יב לָ/אִ֔ישׁ אֶת צִדְקָת֖/וֹ וְ/אֶת אֱמֻנָת֑/וֹ אֲשֶׁר֩ נְתָנְ/ךָ֨ יְהוָ֤ה הַ/יּוֹם֙ בְּ/יָ֔ד וְ/לֹ֣א אָבִ֔יתִי לִ/שְׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֥יחַ יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/023.yaml
  text: And Yahweh will repay each man for his righteousness and his faithfulness[a], because Yahweh gave you into my hand today[b], but I was not willing to stretch out my hand against Yahweh’s anointed.
  footnotes:
  - marker: a
    text: Or 'the LORD will return to each man his righteousness and his faithfulness.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD’s anointed'; that is, the king anointed by the LORD.
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 각 사람에게 그의 의와 그의 신실함을 갚아 주시기를 바랍니다[a]. 야훼께서 오늘 당신을 내 손에 넘겨 주셨지만[b], 저는 야훼의 기름부음 받은 이를 향해 손을 내밀려고 하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 각 사람에게 그의 의와 그의 신실함을 되돌려 주시기를 바랍니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘야훼의 기름부음 받은 이’; 곧 야훼께서 기름부으신 왕을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיהוָה / יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: 프로젝트 기본 용례
  rationale: 원문의 신명은 프로젝트 기본값에 따라 야훼로 옮기며, 문맥상 고유한 언약명을 보존합니다.
- source_word: יָשִׁיב לָאִישׁ
  english_pob_choice: will repay each man
  chosen_korean: 각 사람에게 … 갚아 주시기를 바랍니다
  alternatives_korean:
  - 각 사람에게 … 되돌려 주시기를 바랍니다
  - 각 사람에게 … 보상해 주시기를 바랍니다
  lexicon: HALOT
  rationale: 히필 שוב의 보응적 의미를 한국어 자연문으로 풀어, ‘되갚음/보응’의 뜻을 살리되 합쇼체 기도적 진술로 매끄럽게 옮겼습니다.
- source_word: צִדְקָתוֹ וְאֶת אֱמֻנָתוֹ
  english_pob_choice: his righteousness and his faithfulness
  chosen_korean: 그의 의와 그의 신실함
  alternatives_korean:
  - 그의 의와 그의 믿음직함
  - 그의 의와 그의 충성
  lexicon: HALOT
  rationale: צדקה는 개인의 도덕적 바름을 가리키므로 ‘의’로, אֱמֻנָה는 관계 속 신뢰성과 충실성을 가리키므로 ‘신실함’으로 옮겼습니다.
- source_word: מְשִׁיחַ יְהוָה
  english_pob_choice: the LORD’s anointed
  chosen_korean: 야훼의 기름부음 받은 이
  alternatives_korean:
  - 야훼의 메시아
  - 야훼께서 기름부으신 자
  lexicon: HALOT
  rationale: 여기서는 후대의 메시아 칭호보다 사울의 왕적 지위를 가리키는 역사적 표현이므로, 문맥을 따라 ‘기름부음 받은 이’로 옮겼습니다.
theological_decisions:
- issue: 주어의 의도 표현(אָבִיתִי)
  chosen_reading: 저는 … 하려고 하지 않았습니다
  alternative_readings:
  - 저는 … 원하지 않았습니다
  - 저는 … 하기를 거부했습니다
  rationale: אָבָה의 핵심은 ‘의지/수락’의 부재이므로, 단순한 거절보다 내적 동의의 부재를 드러내는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
- issue: 문장 첫머리의 축복/선언적 뉘앙스
  chosen_reading: 야훼께서 … 갚아 주시기를 바랍니다
  alternative_readings:
  - 야훼께서 … 갚아 주십니다
  - 야훼께서 … 갚으실 것입니다
  rationale: 히브리어의 직설적 미래형을 한국어에서는 문맥상 선언적 소원/기원으로 읽는 자연스러운 여지가 있어, 다윗의 말의 어조를 살려 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
