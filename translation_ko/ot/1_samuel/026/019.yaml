  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה יִֽשְׁמַֽע נָא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֵ֖ת דִּבְרֵ֣י עַבְדּ֑/וֹ אִם יְהוָ֞ה הֱסִֽיתְ/ךָ֥ בִ/י֙ יָרַ֣ח מִנְחָ֔ה וְ/אִ֣ם בְּנֵ֣י הָ/אָדָ֗ם אֲרוּרִ֥ים הֵם֙ לִ/פְנֵ֣י יְהוָ֔ה כִּֽי גֵרְשׁ֣וּ/נִי הַ/יּ֗וֹם מֵ/הִסְתַּפֵּ֜חַ בְּ/נַחֲלַ֤ת יְהוָה֙ לֵ/אמֹ֔ר לֵ֥ךְ עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/019.yaml
  text: And now[a], please let my lord the king hear the words of his servant. If Yahweh has stirred you up against me, may he accept an offering; but if it is men, they are cursed before Yahweh, because they have driven me out today from having a share in Yahweh’s inheritance, saying, ‘Go[b], serve other gods.’
  footnotes:
  - marker: a
    text: Or, more literally, 'may he smell an offering,' an idiom for accepting a sacrifice or gift offering.
    reason: lexical_alternative
  - marker: b
    text: Or 'from joining myself to the LORD’s inheritance.' The Hebrew expression can emphasize being attached to or included within the LORD’s allotted people/land.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내 주 왕이시여, 종의 말을 부디 들어 주십시오. 야훼께서 왕을 나를 대적하도록 부추기셨다면, 그분께서 제물을 받아 주시기를 바랍니다.[a] 그러나 사람들이 그리한 것이라면, 그들은 야훼 앞에서 저주받은 자들입니다. 그들이 오늘 저를 야훼의 기업에 참여하지 못하도록 내쫓아,[b] ‘가서 다른 신들을 섬기라’고 말했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘제물의 냄새를 맡으시다’로, 제사나 예물을 받아들이신다는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼의 기업에 붙다’ 또는 ‘야훼의 기업에 합류하다’로도 옮길 수 있습니다. 이는 야훼께 속한 언약 백성이나 그들에게 분배된 땅에 결합되거나 포함되는 뉘앙스를 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 장면 전환을 여는 זמן 부사로, 한국어에서는 간결한 ‘이제’가 현재적 호소를 자연스럽게 살립니다.
- source_word: יִשְׁמַע נָא
  english_pob_choice: please let ... hear
  chosen_korean: 부디 들으시기 바랍니다
  alternatives_korean:
  - 들어 주십시오
  - 부디 들어 주시기 바랍니다
  lexicon: HALOT
  rationale: 청유의 נָא가 들어간 공손한 탄원으로 보아, 왕에게 올리는 정중한 호소를 살렸습니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: 내 주 왕
  alternatives_korean:
  - 저의 주 왕
  - 왕이신 내 주
  lexicon: HALOT
  rationale: 궁정 예법의 호칭을 반영하되, 한국어에서 자연스러운 ‘내 주 왕’으로 옮겼습니다.
- source_word: הֱסִיתְךָ בִי
  english_pob_choice: has stirred you up against me
  chosen_korean: 왕을 나를 대적하도록 부추기셨다면
  alternatives_korean:
  - 왕을 나에게 대항하도록 충동하셨다면
  - 왕을 나를 치도록 선동하셨다면
  lexicon: HALOT
  rationale: הסית의 핵심인 외부적 충동/부추김을 살리되, 현대 한국어에서 과도하게 해석되지 않도록 ‘부추기다’로 처리했습니다.
- source_word: יָרַח מִנְחָה
  english_pob_choice: may he accept an offering
  chosen_korean: 그분께서 제물을 받으시기를 바랍니다
  alternatives_korean:
  - 그분께서 제물을 기쁘게 여기시기를 바랍니다
  - 그분께서 제물의 향을 받으시기를 바랍니다
  lexicon: HALOT
  rationale: ‘냄새를 맡다’의 관용적 의미를 직역하기보다, 제사 수납의 뜻을 드러내는 한국어로 옮겼습니다.
- source_word: בְּנֵי הָאָדָם
  english_pob_choice: men
  chosen_korean: 사람들
  alternatives_korean:
  - 인간들
  - 사람의 아들들
  lexicon: HALOT
  rationale: 야훼와 대조되는 인간 행위자를 가리키므로 성별 뉘앙스를 과도하게 고정하지 않는 ‘사람들’이 적절합니다.
- source_word: אֲרוּרִים הֵם לִפְנֵי יְהוָה
  english_pob_choice: they are cursed before the LORD
  chosen_korean: 그들은 야훼 앞에서 저주받은 자들입니다
  alternatives_korean:
  - 그들은 야훼 앞에서 저주를 받은 자들입니다
  - 야훼 앞에서 그들은 저주받았습니다
  lexicon: HALOT
  rationale: 상태 진술을 한국어 명사절로 자연스럽게 살리면서, משפט적·언약적 맥락을 유지했습니다.
- source_word: גֵרְשׁוּנִי
  english_pob_choice: they have driven me out
  chosen_korean: 저를 … 내쫓으면서
  alternatives_korean:
  - 저를 쫓아내며
  - 저를 몰아내며
  lexicon: HALOT
  rationale: 강제 축출의 동사를 한국어의 ‘내쫓다’로 옮겨, 공동체와 땅에서의 배제를 드러냈습니다.
- source_word: מֵהִסְתַּפֵּחַ בְּנַחֲלַת יְהוָה
  english_pob_choice: from having a share in Yahweh’s inheritance
  chosen_korean: 야훼의 기업에 참여하지 못하게
  alternatives_korean:
  - 야훼의 기업에 붙어 있지 못하게
  - 야훼의 몫에 함께하지 못하게
  lexicon: HALOT
  rationale: 히트파엘의 ‘붙다/연결되다’ 뉘앙스를 공동체·토지의 몫을 함께 얻는 뜻으로 풀어, ‘참여하다’로 옮겼습니다.
- source_word: לֵךְ עֲבֹד אֱלֹהִים אֲחֵרִים
  english_pob_choice: Go, serve other gods
  chosen_korean: 가서 다른 신들을 섬기라
  alternatives_korean:
  - 가서 다른 신들을 섬겨라
  - 가서 다른 신들을 섬기십시오
  lexicon: HALOT
  rationale: עבד를 우상숭배 맥락의 ‘섬기다’로 옮겨, 언약적 충성의 반대를 분명히 했습니다.
theological_decisions:
- issue: 야훼가 사울을 ‘부추기셨다’는 조건문의 처리
  chosen_reading: 조건문을 그대로 살려, 신적 원인과 인간 책임의 관계를 해소하지 않았습니다.
  alternative_readings:
  - 직접적 신적 사주로 단정
  - 허용적 섭리로만 한정
  rationale: 히브리어는 다윗의 변론을 통해 가능성을 제시할 뿐이므로, 번역이 신학적 해석을 선취하지 않도록 했습니다.
  doctrine_reference: 신적 주권과 인간 책임의 긴장 보존
- issue: ‘야훼의 기업’의 범위
  chosen_reading: 땅뿐 아니라 야훼께 속한 언약 백성의 몫까지 포괄하는 표현으로 유지했습니다.
  alternative_readings:
  - 토지 상속만 가리킴
  - 성소 접근만 가리킴
  rationale: נחלה의 언약적·공동체적 폭을 좁히지 않기 위해, ‘기업’과 ‘참여’의 결합을 유지했습니다.
  doctrine_reference: 언약 공동체와 기업의 포괄성
