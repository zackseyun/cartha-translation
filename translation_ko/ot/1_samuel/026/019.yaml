    rationale: וְאִם בְּנֵי הָאָדָם은 문맥상 야훼가 아니라 사람들이 다윗을 대적하도록 사주하거나 내쫓은 경우를 대조합니다. ‘사람들이 그리한 것이라면’이 생략된 동작을 자연스럽게 보충합니다.
