id: 1SA.26.3
reference: 1 Samuel 26:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֨חַן שָׁא֜וּל בְּ/גִבְעַ֣ת הַ/חֲכִילָ֗ה אֲשֶׁ֛ר עַל פְּנֵ֥י הַ/יְשִׁימֹ֖ן עַל הַ/דָּ֑רֶךְ וְ/דָוִד֙ יֹשֵׁ֣ב בַּ/מִּדְבָּ֔ר וַ/יַּ֕רְא כִּ֣י בָ֥א שָׁא֛וּל אַחֲרָ֖י/ו הַ/מִּדְבָּֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/003.yaml
  text: And Saul camped on the hill of Hachilah[a], which is opposite Jeshimon, by the road. But David was staying in the wilderness, and he saw that Saul had come after him into the wilderness.
  footnotes:
  - marker: a
    text: Jeshimon may also be understood generically as 'the wasteland' or 'the desert.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울은 길라의 산에 진을 쳤는데, 그 산은 여시몬 맞은편이었으며 길가에 있었습니다. 다윗은 광야에 머물고 있었고, 사울이 그를 뒤쫓아 광야로 들어온 것을 보았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַן
  english_pob_choice: camped
  chosen_korean: 진을 쳤는데
  alternatives_korean:
  - 캠프를 쳤는데
  - 주둔했는데
  lexicon: HALOT
  rationale: 군사적·이동 상황에서 חנה는 ‘진을 치다’가 자연스럽고, 본문의 정착 동작을 분명하게 드러냅니다.
- source_word: בְּגִבְעַת הַחֲכִילָה
  english_pob_choice: on the hill of Hachilah
  chosen_korean: 길라의 산에
  alternatives_korean:
  - 하길라 산에
  - 하길라 언덕에
  lexicon: HALOT
  rationale: גִּבְעָה는 일반명사로 ‘산/언덕’의 뜻이 있어 이를 살리고, חֲכִילָה는 고유지명으로 음역하지 않은 영어 본문의 처리에 맞춰 한국어에서는 지명으로 자연스럽게 옮겼습니다.
- source_word: אֲשֶׁר עַל פְּנֵי הַיְשִׁימֹן
  english_pob_choice: which is opposite Jeshimon
  chosen_korean: 그 산은 여시몬 맞은편이었으며
  alternatives_korean:
  - 여시몬을 마주하고 있었으며
  - 여시몬 앞에 있었으며
  lexicon: HALOT
  rationale: עַל־פְּנֵי의 위치 관계를 ‘맞은편’으로 옮겨 서로 마주 보는 지형 관계를 보존했고, הַיְשִׁימֹן은 고유지명으로 처리했습니다.
- source_word: עַל הַדָּרֶךְ
  english_pob_choice: by the road
  chosen_korean: 길가에 있었습니다
  alternatives_korean:
  - 길 옆에 있었습니다
  - 도로 곁에 있었습니다
  lexicon: HALOT
  rationale: עַל은 여기서 정확히 ‘위에’보다 인접성을 나타내므로, ‘길가에’가 장소 관계를 가장 자연스럽게 전달합니다.
- source_word: יֹשֵׁב
  english_pob_choice: was staying
  chosen_korean: 머물고 있었고
  alternatives_korean:
  - 거하고 있었고
  - 살고 있었고
  - 앉아 있었고
  lexicon: HALOT
  rationale: 분사형의 지속 상태를 살리면서도 서사 문맥에 맞게 ‘머물다’로 옮겼습니다.
- source_word: וַיַּרְא כִּי בָא שָׁאוּל אַחֲרָיו הַמִּדְבָּרָה
  english_pob_choice: and he saw that Saul had come after him into the wilderness
  chosen_korean: 사울이 그를 뒤쫓아 광야로 들어온 것을 보았습니다
  alternatives_korean:
  - 사울이 그 뒤를 따라 광야로 온 것을 보았습니다
  - 사울이 그를 따라 광야에 들어온 것을 보았습니다
  lexicon: HALOT
  rationale: ‘뒤쫓아’는 אַחֲרָיו의 추적 뉘앙스를 살리고, ‘광야로 들어온’은 방향성 있는 הַמִּדְבָּרָה를 반영합니다.
