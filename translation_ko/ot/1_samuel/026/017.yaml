  to: 그때 사울은 다윗의 목소리를 알아보고 말했습니다. “이것이 네 목소리냐, 내 아들 다윗아?” 그러자 다윗이 말했습니다. “제 목소리입니다, 내 주 왕이시여.”
  rationale: 사울이 다윗의 목소리를 ‘인식하다/식별하다’라는 원문의 의미를 한국어에서 더 분명히 드러내도록 동사만 ‘알아보고’로 고쳤습니다. 나머지 표현은 원문의 어휘 반복, 호칭, 존대 관계를 적절히 보존하므로 유지했습니다.
