base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/017.yaml
  text: Then Saul recognized David’s voice and said, “Is this your voice, my son David?” And David said, “It is my voice, my lord the king.”
translation:
  language: ko
  text: 그때 사울은 다윗의 목소리를 알아듣고 말했습니다. “이것이 네 목소리냐, 내 아들 다윗아?” 그러자 다윗이 말했습니다. “제 목소리입니다, 내 주 왕이시여.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּר / recognized
  english_pob_choice: recognized
  chosen_korean: 알아듣고
  alternatives_korean:
  - 알아보고
  - 인식하고
  lexicon: HALOT
  rationale: 사울이 다윗의 ‘목소리’를 식별하는 장면이므로, 단순한 지적 인식보다 청각적 식별을 드러내는 ‘알아듣고’가 자연스럽고 문맥에 맞습니다.
- source_word: קוֹל / voice
  english_pob_choice: voice
  chosen_korean: 목소리
  alternatives_korean:
  - 소리
  lexicon: HALOT
  rationale: 뒤이어 직접화법에서 같은 단어가 반복되므로, 사람의 발화와 연결되는 ‘목소리’가 ‘소리’보다 정확합니다.
- source_word: בְּנִי / my son
  english_pob_choice: my son
  chosen_korean: 내 아들
  alternatives_korean:
  - 내 자녀
  - 내 아들아
  lexicon: HALOT
  rationale: 사울의 호칭은 관계적·왕실적 긴장을 지닌 남성형 가족 호칭이므로, 성별과 친족성을 유지하는 ‘내 아들’이 적절합니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ / my lord the king
  english_pob_choice: my lord the king
  chosen_korean: 내 주 왕이시여
  alternatives_korean:
  - 내 주님 왕이시여
  - 내 주, 왕이시여
  lexicon: HALOT
  rationale: אדני는 여기서 하나님 호칭이 아니라 인간 상관에 대한 존칭이며, 왕을 직접 부르는 종속적 예우를 살리기 위해 ‘내 주 왕이시여’로 옮겼습니다.
theological_decisions:
- issue: 다윗의 응답에서 대등한 자기지시가 아니라 예우를 드러내는 번역
  chosen_reading: “제 목소리입니다”로 시작하고, 끝부분은 “내 주 왕이시여”로 높임을 유지했습니다.
  alternative_readings:
  - “내 목소리입니다, 내 왕이시여”
  - “저입니다, 내 주 왕이시여”
  rationale: 원문은 ‘내 목소리’라는 어휘를 유지한 채 왕에게 극도로 공손하게 말하는 구조이므로, 한국어에서도 1인칭 지시어로만 바꾸지 않고 ‘목소리’와 존칭을 함께 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
