  rationale: נַעַר의 연령·신분 중첩 가능성을 반영해, 본문이 직접 밝히지 않는 종속 신분을 덧씌우지 않고 "젊은이들 가운데 하나"로 두었습니다.
- source_word: וְיַעֲבֹר
  english_pob_choice: come over
  chosen_korean: 건너와서
  alternatives_korean:
  - 와서
  - 넘어와서
  - 건너오십시오
  lexicon: HALOT
  rationale: עבר의 문자적 의미인 "건너다/지나가다"를 살리면서, 문맥상 상대편 진영에서 이쪽으로 이동하는 동작을 자연스럽게 표현했습니다.
- source_word: וְיִקָּחֶהָ
  english_pob_choice: and take it
  chosen_korean: 그것을 가져가십시오
  alternatives_korean:
  - 그것을 취하십시오
  - 그것을 가져가십시오
  lexicon: HALOT
  rationale: לקח의 기본 뜻은 "취하다/가져가다"이지만, 요청의 맥락에서는 한국어에서 더 구체적이고 자연한 "가져가십시오"가 적절합니다.
theological_decisions:
