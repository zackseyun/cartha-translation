  edition: WLC
  text: וַ/יַּ֤עַן דָּוִד֙ וַ/יֹּ֔אמֶר הִנֵּ֖ה ה/חנית הַ/מֶּ֑לֶךְ וְ/יַעֲבֹ֛ר אֶחָ֥ד מֵֽ/הַ/נְּעָרִ֖ים וְ/יִקָּחֶֽ/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/022.yaml
  text: David answered and said[a], “Here is the king’s spear[b]. Let one of the young men come over and take it.”
  footnotes:
  - marker: a
    text: Or “cross over” instead of “come over”; the Hebrew verb literally means “pass/cross over.”
    reason: lexical_alternative
  - marker: b
    text: “Young men” may also be rendered “servants” or “attendants,” since the Hebrew term can refer either to age or to subordinate status depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 대답하여 말했습니다. "여기 왕의 창이 있습니다. 젊은이들 가운데 하나가 건너와서 그것을 가져가십시오."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 עבר는 문자적으로는 “건너다/지나가다”를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נַעַר는 문맥에 따라 “젊은이”, “종”, “수행원”으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן / וַיֹּאמֶר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 응답하여 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 서술적 이중 동사 구조를 살리되, 한국어에서는 자연스럽게 한 덩어리로 풀어 "대답하여 말했습니다"로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Here is
  chosen_korean: 여기 ... 있습니다
  alternatives_korean:
  - 보십시오 ... 있습니다
  - 보라 ... 있습니다
  lexicon: HALOT
  rationale: 지시의 힘을 살리면서도 현대 한국어에서는 "여기"가 가장 자연스럽고 담백하게 대상의 존재를 드러냅니다.
- source_word: הַחֲנִית
  english_pob_choice: the spear
  chosen_korean: 창
  alternatives_korean:
  - 창끝
  - 장창
  lexicon: HALOT
  rationale: 군사적 무기인 חֲנִית는 문맥상 "창"이 가장 표준적이고 이해하기 쉬운 대응어입니다.
- source_word: מֵהַנְּעָרִים
  english_pob_choice: of the young men
  chosen_korean: 젊은이들 가운데 하나
  alternatives_korean:
  - 소년들 가운데 하나
  - 종들 가운데 하나
  - 수행원들 가운데 하나
  lexicon: HALOT
  rationale: נַעַר의 연령·신분 중첩 가능성을 반영해, 본문이 직접 밝히지 않는 종속 신분을 덧씌우지 않고 "젊은이들 가운데 하나"로 두었습니다.
- source_word: וְיַעֲבֹר
  english_pob_choice: come over
  chosen_korean: 건너와서
  alternatives_korean:
  - 와서
  - 넘어와서
  - 건너오십시오
  lexicon: HALOT
  rationale: עבר의 문자적 의미인 "건너다/지나가다"를 살리면서, 문맥상 상대편 진영에서 이쪽으로 이동하는 동작을 자연스럽게 표현했습니다.
- source_word: וְיִקָּחֶהָ
  english_pob_choice: and take it
  chosen_korean: 그것을 가져가십시오
  alternatives_korean:
  - 그것을 취하십시오
  - 그것을 가져가십시오
  lexicon: HALOT
  rationale: לקח의 기본 뜻은 "취하다/가져가다"이지만, 요청의 맥락에서는 한국어에서 더 구체적이고 자연한 "가져가십시오"가 적절합니다.
theological_decisions:
- issue: 사울 진영의 청년/수종자 호칭
  chosen_reading: '"젊은이들"로 유지하여 연령 중심 표현을 기본으로 하되, 종속 신분은 본문이 직접 확정하지 않는 것으로 남겼습니다.'
  alternative_readings:
  - '"종들"'
  - '"수행원들"'
  rationale: 히브리어 נַעַר는 연령과 신분을 모두 가질 수 있으므로, 문맥상 가능한 의미를 열어 두는 번역이 원문 정보량을 더 잘 보존합니다.
  doctrine_reference: 본문 주해/어휘 결정
