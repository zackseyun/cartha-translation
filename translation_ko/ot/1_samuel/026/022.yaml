  text: David answered and said[a], “Here is the king’s spear[b]. Let one of the young men come over and take it.”
  footnotes:
  - marker: a
    text: Or “cross over” instead of “come over”; the Hebrew verb literally means “pass/cross over.”
    reason: lexical_alternative
  - marker: b
    text: “Young men” may also be rendered “servants” or “attendants,” since the Hebrew term can refer either to age or to subordinate status depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 대답하여 말했습니다. “여기 왕의 창이 있습니다. 젊은이들[b] 가운데 한 사람이 건너와서[a] 그것을 가져가게 하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 עבר는 문자적으로 “건너다/지나가다”를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נַעַר는 문맥에 따라 “젊은이”, “종”, “수행원”으로도 옮길 수 있습니다.
    reason: lexical_alternative
