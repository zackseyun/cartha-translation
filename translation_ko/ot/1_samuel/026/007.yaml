base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/007.yaml
  text: So David and Abishai came to the troops by night[a], and behold, Saul was lying asleep within the encampment, with his spear stuck in the ground at his head, and Abner and the troops were lying around him.
  footnotes:
  - marker: a
    text: Or 'in the circle'—the Hebrew likely refers to the circular formation of the camp.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 다윗과 아비새가 밤에 군사들에게로 왔습니다[a]. 보십시오, 사울은 진영 안에서 잠들어 누워 있고, 그의 창은 머리 곁 땅에 꽂혀 있었으며, 아브넬과 군사들은 그 둘레에 누워 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진영’은 히브리어 מַעְגָּל의 문맥적 의미를 따른 번역이며, 영어 POB의 ‘within the encampment’와 같은 취지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  english_pob_choice: the troops
  chosen_korean: 군사들
  alternatives_korean:
  - 백성
  - 군대
  lexicon: HALOT
  rationale: 전쟁 장면이므로 일반적인 ‘백성’보다 군사 집단을 가리키는 ‘군사들’이 문맥에 맞고 자연스럽습니다.
- source_word: לַיְלָה
  english_pob_choice: by night
  chosen_korean: 밤에
  alternatives_korean:
  - 한밤중에
  - 밤사이에
  lexicon: HALOT
  rationale: 시간 부사를 간결하게 살려 ‘밤에’로 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그런데
  lexicon: HALOT
  rationale: 서술의 급전환과 장면의 생생함을 살리되 현대 한국어에 자연스럽게 들리도록 감탄적 주의를 환기하는 표현으로 옮겼습니다.
- source_word: בַּמַּעְגָּל
  english_pob_choice: within the encampment
  chosen_korean: 진영 안에서
  alternatives_korean:
  - 원형 진영 안에서
  - 원 안에서
  lexicon: HALOT
  rationale: 문맥상 단순한 기하학적 ‘원’이 아니라 방어적으로 배치된 진영을 가리키므로, 읽기 쉬운 ‘진영 안에서’로 의미를 풀었습니다.
- source_word: מְרַאֲשֹׁתָיו
  english_pob_choice: at his head
  chosen_korean: 머리 곁
  alternatives_korean:
  - 머리맡
  - 머리 쪽
  lexicon: HALOT
  rationale: ‘머리 곁’이 공간 관계를 자연스럽게 드러내며, 창이 사울의 머리 가까이에 놓인 장면을 정확히 전달합니다.
- source_word: סְבִיבֹתָיו
  english_pob_choice: around him
  chosen_korean: 그 둘레에
  alternatives_korean:
  - 그 주변에
  - 그를 둘러싸고
  lexicon: HALOT
  rationale: 사울을 중심으로 사람들이 둘러 누운 배열을 살리기 위해 다소 문어적인 ‘그 둘레에’를 사용했습니다.
