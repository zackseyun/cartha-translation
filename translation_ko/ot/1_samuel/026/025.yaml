  text: Then Saul said to David[a], “Blessed are you, my son David. You will surely do, and you will surely prevail.” Then David went on his way, and Saul returned to his place.
  footnotes:
  - marker: a
    text: Hebrew literally, 'doing you will do, and being able you will be able'—a pair of infinitive absolute constructions intensifying the certainty of David's future success.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울이 다윗에게 말했습니다. “내 아들 다윗아, 너는 복받은 자다. 너는 반드시 하게 될 것이고, 반드시 이겨낼 것이다.” 그때 다윗은 자기 길을 갔고, 사울은 자기 자리로 돌아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘하되 하게 될 것이고, 할 수 있되 할 수 있을 것이다’라는 식의 부정사 절대형 강조 표현입니다.
    reason: lexical_alternative
