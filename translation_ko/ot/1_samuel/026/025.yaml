  yaml_path: translation/ot/1_samuel/026/025.yaml
  text: Then Saul said to David[a], “Blessed are you, my son David. You will surely do, and you will surely prevail.” Then David went on his way, and Saul returned to his place.
  footnotes:
  - marker: a
    text: Hebrew literally, 'doing you will do, and being able you will be able'—a pair of infinitive absolute constructions intensifying the certainty of David's future success.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 다윗에게 말했습니다. “내 아들 다윗아, 당신은 복을 받았습니다. 당신은 반드시 해낼 것이며, 반드시 이길 것입니다.”[a] 다윗은 자기 길을 떠났고, 사울은 자기 자리로 돌아갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘반드시 하고 또 할 것이며, 능히 하고 또 할 것이다’라고 반복하여 말합니다. 두 부정사 절대형은 다윗의 장차 행할 일과 성공을 강하게 확언합니다.
    reason: lexical_alternative
