theological_decisions:
- issue: 사울의 축복 선언의 어조
  chosen_reading: 사울의 말은 축복이면서도 서술적 확언으로 읽어 ‘복받은 자다’로 옮겼습니다.
  alternative_readings:
  - ‘복을 받으라’처럼 기원형으로 옮김
  - ‘복되도다’ 같은 전통적 축복문으로 옮김
  rationale: 히브리어 바루크는 여기서 다윗에게 직접 선포되는 말이므로, 명령이나 기도문보다 선언적 진술로 처리하는 것이 본문 기능에 더 가깝습니다.
  doctrine_reference: 서술적 축복 선언의 화행 보존
- issue: ‘이겨낼 것이다’의 의미 범위
  chosen_reading: 문맥상 능력 가능성보다 실제적 승리·극복의 확신을 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘능히 할 것이다’로 보다 직역
  - ‘반드시 성공할 것이다’로 해석
  rationale: 이 구절은 단순 가능성보다 다윗의 미래 성취를 강조하므로, 한국어에서 자연스럽게 결과를 드러내는 ‘이겨내다’가 POB의 ‘prevail’과 잘 맞습니다.
  doctrine_reference: 예언적 확언의 결과 중심 번역
