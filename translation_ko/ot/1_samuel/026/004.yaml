base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/004.yaml
  text: So David sent out scouts[a], and he learned that Saul had indeed come.
  footnotes:
  - marker: a
    text: Or 'and he found out for certain that Saul had come.' The final Hebrew term likely adds a nuance of certainty or confirmation.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 정탐꾼들을 보내고, 사울이 정말로 와 있다는 것을 알게 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사울이 확실히 와 있다는 것을 알게 되었습니다”로 옮길 수 있습니다. 마지막 히브리어 단어는 확인·확증의 뉘앙스를 더하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent out
  chosen_korean: 보내고
  alternatives_korean:
  - 내보내고
  - 파견하고
  lexicon: HALOT
  rationale: 정탐 임무의 맥락에서 단순한 ‘보내다’보다 ‘보내고’가 자연스러우며, 원문의 동작 진행을 무리 없이 살립니다.
- source_word: מְרַגְּלִים
  english_pob_choice: scouts
  chosen_korean: 정탐꾼들
  alternatives_korean:
  - 스파이들
  - 정찰병들
  lexicon: HALOT
  rationale: 히브리어 רגל 계열의 의미는 군사적 정찰/탐문에 가깝기 때문에, ‘스파이’보다 맥락을 덜 왜곡하는 ‘정탐꾼들’을 택했습니다.
- source_word: וַיֵּדַע
  english_pob_choice: he learned
  chosen_korean: 알게 되었습니다
  alternatives_korean:
  - 알았습니다
  - 확인했습니다
  lexicon: HALOT
  rationale: 정탐 결과를 통해 알게 된 뜻을 자연스럽게 살리기 위해 ‘알게 되었습니다’로 옮겼습니다.
- source_word: נָכוֹן
  english_pob_choice: indeed
  chosen_korean: 정말로
  alternatives_korean:
  - 확실히
  - 분명히
  lexicon: HALOT
  rationale: 문장 끝의 נָכוֹן은 여기서 확증의 뉘앙스를 더하므로, 단순 정보 전달보다 ‘정말로’로 그 확인의 강도를 반영했습니다.
