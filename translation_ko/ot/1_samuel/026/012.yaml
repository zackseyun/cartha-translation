revisions:
- from: 다윗이 창과 물병을 사울의 머리맡에서 가져갔고, 그들은 떠났습니다. 아무도 보지 못했고, 아무도 알지 못했고, 아무도 깨지 못했으니, 그들이 모두 잠들어 있었기 때문입니다. 야훼께서 깊은 잠을 그들에게 떨어뜨리셨기 때문입니다.[a][b]
  to: 다윗이 창과 물병을 사울의 머리맡에서[a] 가져갔고, 그들은 떠났습니다. 아무도 보지 못했고, 아무도 알지 못했고, 아무도 깨어나지 못했습니다. 그들이 모두 잠들어 있었는데, 야훼께서 내리신 깊은 잠이 그들에게 임해 있었기 때문입니다.[b]
  rationale: 원문의 공간 표현과 야훼의 이름은 유지했습니다. 잠의 신적 기원을 분명히 하면서도, 원문의 ‘야훼의/야훼에게서 온 깊은 잠이 그들에게 임했다’라는 명사구와 서술 이미지를 보존하도록 고쳤습니다. 각주 b의 오자를 바로잡고 두 각주를 해당 본문 표현에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:25:46Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 히브리어는 ‘야훼께서 깊은 잠을 떨어뜨리셨다’라는 직접 능동문이 아니라, ‘야훼에게서 온/야훼의 깊은 잠이 그들에게 임하였다’는 명사구와 ‘임하다’의 표현입니다. 또한 두 개의 כִּי 절은 사람들 모두가 잠든 상태였던 직접 이유와 그 잠의 신적 원인을 연결합니다.
  naturalness: ‘아무도 깨지 못했고’보다 ‘아무도 깨어나지 못했고’가 현대 표준어 서술문에 자연스럽습니다. 원문의 인과 관계는 반복된 ‘때문입니다’ 문장보다 하나의 자연스러운 종속 구조로 연결하는 편이 좋습니다.
  terminology: ‘창’, ‘물병’, ‘사울의 머리맡’, ‘야훼’, ‘깊은 잠’은 적절합니다. 다만 ‘떨어뜨리셨기’는 원문의 명사구를 직접적인 능동 사역문으로 바꾸므로 ‘야훼께서 내리신 깊은 잠이 … 임해 있었기’로 옮겨 원문의 이미지와 신적 기원을 함께 보존합니다.
  issues:
  - severity: medium
    issue: ‘야훼께서 깊은 잠을 그들에게 떨어뜨리셨기 때문입니다’가 히브리어의 명사구를 직접 능동 사역문으로 바꿉니다.
    rationale: תַּרְדֵּמַת יְהוָה נָפְלָה עֲלֵיהֶם은 문자적으로 ‘야훼의/야훼에게서 온 깊은 잠이 그들에게 임했다’입니다. 야훼의 원인됨은 유지하되 명사구 및 ‘임하다’의 표현을 보존하는 것이 더 충실합니다.
