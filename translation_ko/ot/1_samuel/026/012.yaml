  edition: WLC
  text: וַ/יִּקַּח֩ דָּוִ֨ד אֶֽת הַ/חֲנִ֜ית וְ/אֶת צַפַּ֤חַת הַ/מַּ֨יִם֙ מֵרַאֲשֹׁתֵ֣י שָׁא֔וּל וַ/יֵּלְכ֖וּ לָ/הֶ֑ם וְ/אֵ֣ין רֹאֶה֩ וְ/אֵ֨ין יוֹדֵ֜עַ וְ/אֵ֣ין מֵקִ֗יץ כִּ֤י כֻלָּ/ם֙ יְשֵׁנִ֔ים כִּ֚י תַּרְדֵּמַ֣ת יְהוָ֔ה נָפְלָ֖ה עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/012.yaml
  text: So David took the spear and the jar of water from beside Saul’s head[a], and they went away. No one saw it, and no one knew it, and no one awoke, for they were all sleeping[b], because a deep sleep from Yahweh had fallen on them.
  footnotes:
  - marker: a
    text: Or, 'from beside Saul’s head.' The Hebrew expression refers to the area at Saul’s head as he lay sleeping.
    reason: lexical_alternative
  - marker: b
    text: Or, 'a deep sleep of the LORD had fallen on them.' The phrase indicates that the sleep came by the LORD’s action.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗이 창과 물병을 사울의 머리맡에서[a] 가져갔고, 그들은 떠났습니다. 아무도 보지 못했고, 아무도 알지 못했고, 아무도 깨어나지 못했습니다. 그들이 모두 잠들어 있었는데, 야훼께서 내리신 깊은 잠이 그들에게 임해 있었기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘머리맡’은 직역하면 ‘머리에서’이지만, 여기서는 사울이 잠들어 있던 자리의 머리 곁을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼의 깊은 잠이 그들에게 임해 있었기 때문입니다.’라고 옮길 수 있습니다. 이 표현은 그 깊은 잠이 야훼에게서 비롯되었음을 나타냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲנִית
  english_pob_choice: the spear
  chosen_korean: 창
  alternatives_korean:
  - 창끝
  - 창검
  lexicon: HALOT
  rationale: חֲנִית는 무기인 창을 가리키므로, 한국어로도 가장 자연스럽고 직접적인 ‘창’으로 옮겼습니다.
- source_word: צַפַּחַת הַמַּיִם
  english_pob_choice: the jar of water
  chosen_korean: 물병
  alternatives_korean:
  - 물항아리
  - 물주전자
  - 물단지
  lexicon: HALOT
  rationale: צַפַּחַת는 물을 담는 용기를 가리키므로, 현대 한국어에서 즉시 이해되는 ‘물병’을 택했습니다.
- source_word: מֵרַאֲשֹׁתֵי שָׁאוּל
  english_pob_choice: from beside Saul’s head
  chosen_korean: 사울의 머리맡에서
  alternatives_korean:
  - 사울의 머리 곁에서
  - 사울의 머리 옆에서
  lexicon: HALOT
  rationale: 히브리어 관용구는 사울의 머리 가까운 자리, 곧 잠든 자리 옆을 뜻하므로 ‘머리맡에서’가 공간 관계를 자연스럽게 드러냅니다.
- source_word: תַּרְדֵּמַת יְהוָה
  english_pob_choice: a deep sleep from Yahweh
  chosen_korean: 깊은 잠
  alternatives_korean:
  - 깊은 잠
  - 혼미한 잠
  lexicon: HALOT
  rationale: תַּרְדֵּמָה는 단순한 수면보다 더 깊고 무거운 잠을 뜻하므로 ‘깊은 잠’으로 옮겼습니다.
- source_word: נָפְלָה עֲלֵיהֶם
  english_pob_choice: had fallen on them
  chosen_korean: 그들에게 떨어뜨리셨기 때문입니다
  alternatives_korean:
  - 그들에게 내려졌기 때문입니다
  - 그들에게 임했기 때문입니다
  lexicon: HALOT
  rationale: 동사 ‘떨어지다’의 이미지와 하나님의 주도성을 살려, 잠이 그들에게 ‘떨어뜨려졌다’고 능동적 원인까지 함께 드러냈습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 고유명사 יְהוָה를 제목어가 아닌 하나님의 이름으로 드러내기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 잠의 신적 기원
  chosen_reading: 야훼께서 깊은 잠을 그들에게 떨어뜨리셨기 때문입니다
  alternative_readings:
  - 야훼의 깊은 잠이 그들에게 떨어졌기 때문입니다
  - 야훼께서 그들에게 깊은 잠을 주셨기 때문입니다
  rationale: 히브리어는 잠의 상태를 넘어 야훼의 작용을 분명히 하므로, 단순 상태 설명보다 신적 원인을 드러내는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §1, §3
