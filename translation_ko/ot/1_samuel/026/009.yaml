base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/009.yaml
  text: But David said to Abishai[a], “Do not destroy him, for who can stretch out his hand against Yahweh’s anointed and remain guiltless?”
  footnotes:
  - marker: a
    text: Hebrew 'the LORD’s anointed' uses the same word family later associated with 'Messiah.' Here it refers to Saul as the king anointed by the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 아비새에게 말했습니다. "그를 멸하지 마십시오. 여호와의 기름부음을 받은 자에게 손을 뻗은 사람이 누구이겠으며, 죄책 없이 있겠습니까?"[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘기름부음을 받은 자’는 뒤에 ‘메시아’와 연결되는 같은 어근을 사용합니다. 여기서는 여호와께서 기름부어 세우신 사울 왕을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: But David said
  chosen_korean: 다윗이 말했습니다
  alternatives_korean:
  - 그리고 다윗이 말했습니다
  - 그러나 다윗이 말했습니다
  lexicon: HALOT
  rationale: 와우 연속형은 서사를 진전시키며, 여기서는 아비새의 제안을 거절하는 전환이므로 한국어에서는 자연스러운 서술형으로 옮기고 문맥적 대비는 뒤의 내용으로 드러내는 것이 적절합니다.
- source_word: אַל תַּשְׁחִיתֵהוּ
  english_pob_choice: Do not destroy him
  chosen_korean: 그를 멸하지 마십시오
  alternatives_korean:
  - 그를 죽이지 마십시오
  - 그를 파괴하지 마십시오
  lexicon: HALOT
  rationale: שׁחת의 기본 의미를 살리면서도 이 문맥의 살해 시도를 포함하는 더 넓은 파괴 의미를 유지하기 위해 ‘멸하다’를 택했습니다.
- source_word: שָׁלַח יָדוֹ
  english_pob_choice: stretch out his hand
  chosen_korean: 손을 뻗은
  alternatives_korean:
  - 손을 내민
  - 손을 들어올린
  lexicon: HALOT
  rationale: ‘손을 뻗다’는 히브리어 관용구를 비교적 직접적으로 보존하면서, 대상에 대한 공격 행위를 암시하는 표현으로 자연스럽게 읽힙니다.
- source_word: בִּמְשִׁיחַ יְהוָה
  english_pob_choice: Yahweh’s anointed
  chosen_korean: 여호와의 기름부음을 받은 자
  alternatives_korean:
  - 야훼의 메시아
  - 여호와의 기름받은 자
  lexicon: HALOT
  rationale: 여기서는 종말론적 칭호가 아니라 여호와께서 기름부어 세우신 왕을 가리키므로, ‘메시아’ 대신 기능적 표현인 ‘기름부음을 받은 자’를 사용해 역사적 의미를 보존했습니다.
- source_word: וְנִקָּה
  english_pob_choice: remain guiltless
  chosen_korean: 죄책 없이 있겠습니까
  alternatives_korean:
  - 무죄하겠습니까
  - 벌받지 않겠습니까
  lexicon: HALOT
  rationale: נקה는 단순한 형벌 회피보다 ‘죄책이 없음/면책됨’의 뜻을 담으므로, 수사적 질문의 형식을 살려 ‘죄책 없이 있겠습니까’로 옮겼습니다.
theological_decisions:
- issue: מְשִׁיחַ의 한국어 처리와 후대 메시아 용어와의 구분
  chosen_reading: 여호와의 기름부음을 받은 자
  alternative_readings:
  - 여호와의 메시아
  - 여호와의 기름부음받은 왕
  rationale: 본문은 사울의 왕적 지위를 지키는 역사적 맥락이므로, 후대의 기독론적 칭호를 직접 가져오지 않고도 ‘기름부음’을 보존하는 번역이 원문 의도에 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve historical referent while documenting lexical linkage to later Messiah language.'
