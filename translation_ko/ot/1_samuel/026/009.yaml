  naturalness: ‘죄책 없이 있겠습니까’는 현대 한국어에서 다소 어색합니다. ‘죄가 없을 사람이 누구이겠습니까?’가 자연스럽고, 본문의 법적·도덕적 무죄 의미도 유지합니다. 문맥상 대조를 드러내기 위해 ‘그러나’를 보충하는 것도 자연스럽습니다.
