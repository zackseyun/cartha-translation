source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ דָּוִ֨ד אֶל אַבְנֵ֜ר הֲ/לוֹא אִ֣ישׁ אַתָּ֗ה וּ/מִ֤י כָמ֨וֹ/ךָ֙ בְּ/יִשְׂרָאֵ֔ל וְ/לָ֨/מָּה֙ לֹ֣א שָׁמַ֔רְתָּ אֶל אֲדֹנֶ֖י/ךָ הַ/מֶּ֑לֶךְ כִּי בָא֙ אַחַ֣ד הָ/עָ֔ם לְ/הַשְׁחִ֖ית אֶת הַ/מֶּ֥לֶךְ אֲדֹנֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/015.yaml
  text: David said to Abner[b][a], “Are you not a man? And who is like you in Israel? Why then have you not kept watch over your lord the king? For one of the people came to destroy the king your lord.”
  footnotes:
  - marker: a
    text: Or, “And who is your equal in Israel?”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “one of the people,” meaning one person from among the camp.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 아브넬에게 말했습니다. 「당신은 남자가 아닙니까? 이스라엘에서 당신과 같은 사람이 누가 있습니까?[a] 그런데도 왜 당신의 주인 왕을 지키지 않았습니까? 백성 가운데 한 사람이[b] 왕, 곧 당신의 주인을 멸하려고 왔습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘에서 당신과 같은 사람이 누가 있습니까?’는 ‘이스라엘에서 당신과 견줄 자가 누가 있습니까?’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘백성 가운데 한 사람’은 문맥상 진영 안에 있던 특정한 한 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִישׁ אַתָּה
  english_pob_choice: Are you not a man?
  chosen_korean: 당신은 남자가 아니십니까?
  alternatives_korean:
  - 당신은 사내가 아니십니까?
  - 당신은 참 남자 아니십니까?
  lexicon: HALOT
  rationale: אִישׁ의 기본 의미를 살려 직설적 수사 질문으로 옮겼습니다. 여기서는 '용사' 같은 해석어를 덧붙이지 않고, 아브넬의 책임을 꾸짖는 문맥을 한국어 어순으로 드러냅니다.
- source_word: וּמִי כָמוֹךָ בְּיִשְׂרָאֵל
  english_pob_choice: And who is like you in Israel?
  chosen_korean: 그리고 이스라엘에서 당신과 같은 사람이 누가 있습니까?
  alternatives_korean:
  - 그리고 이스라엘에서 당신과 같은 자가 누가 있습니까?
  - 그리고 이스라엘에서 당신과 견줄 자가 누가 있습니까?
  lexicon: HALOT
  rationale: כָמוֹךָ의 비교 의미를 유지하되, 한국어에서는 '누가 있습니까?'로 자연스럽게 수사 효과를 살렸습니다. POB의 대안처럼 'equals' 뉘앙스를 넣을 수 있으나, 본문은 직접적으로 '같은 사람'을 묻는 구조입니다.
- source_word: וְלָמָּה לֹא שָׁמַרְתָּ אֶל
  english_pob_choice: Why then have you not kept watch over
  chosen_korean: 그런데도 왜 당신의 주 왕을 지키지 않으셨습니까?
  alternatives_korean:
  - 그런데도 왜 당신의 주 왕을 지키지 않았습니까?
  - 왜 당신의 주 왕을 감시하지 않으셨습니까?
  lexicon: HALOT
  rationale: שׁמר는 여기서 보호적 감시를 뜻하므로 '지키다'로 옮겼습니다. '그런데도'는 POB의 'Why then'이 드러내는 비난의 연결을 살린 표현입니다.
- source_word: כִּי בָא אַחַד הָעָם
  english_pob_choice: For one of the people came
  chosen_korean: 백성 중 한 사람이 와서
  alternatives_korean:
  - 사람들 가운데 한 사람이 와서
  - 군중 가운데 한 사람이 와서
  lexicon: HALOT
  rationale: אַחַד הָעָם은 문자적으로 '백성 중 한 사람'이므로 그 표현을 살렸습니다. POB 주석처럼 특정 병사 집단이 아니라 '한 사람'이라는 점을 유지했습니다.
- source_word: לְהַשְׁחִית
  english_pob_choice: to destroy
  chosen_korean: 죽이려고 했습니다
  alternatives_korean:
  - 파괴하려고 했습니다
  - 멸하려고 했습니다
  lexicon: HALOT
  rationale: 히필형 שׁחת는 '파괴하다/멸하다'가 기본이지만, 이 문맥에서는 왕의 살해 의도가 분명하므로 한국어에서는 결과를 드러내는 '죽이려고 했습니다'로 옮겼습니다. 의미를 과도하게 약화시키지 않으면서 본문의 실제 위협을 분명히 합니다.
theological_decisions:
- issue: 아브넬과 사울에 대한 호칭의 높임말 처리
  chosen_reading: 서술은 합쇼체를 유지하되, 다윗의 직접 질문은 아브넬을 강하게 책망하는 공적 발화로 처리했습니다.
  alternative_readings:
  - 전 구절을 보다 완곡한 높임말로 통일하기
  - 직접 화법의 책망 어조를 약화시키기
  rationale: 히브리어 원문은 공적 망신주기와 책임 추궁의 수사입니다. 한국어에서도 이를 약화시키지 않기 위해 높임말은 유지하되, 질문 자체의 압박감은 보존했습니다.
  doctrine_reference: 본문의 수사적 책망과 왕권 보호 책임
