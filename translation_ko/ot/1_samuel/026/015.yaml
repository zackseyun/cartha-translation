  to: 다윗이 아브넬에게 말했습니다. 「당신은 남자가 아닙니까? 이스라엘에서 당신과 같은 사람이 누가 있습니까?[a] 그런데도 왜 당신의 주인 왕을 지키지 않았습니까? 백성 가운데 한 사람이[b] 왕, 곧 당신의 주인을 멸하려고 왔습니다.」
  rationale: 핵심 수정은 ‘죽이려고’ 대신 ‘멸하려고’를 사용하여 שׁחת의 어휘적 범위를 보존한 것입니다. 또한 원문의 ‘왕, 당신의 주인’이라는 반복적 호칭을 ‘왕, 곧 당신의 주인’으로 살리고, 각주 표지를 설명 대상 어구 뒤로 옮겼습니다. 그 밖의 수사적 질문과 보호 책임을 묻는 어조는 유지했습니다.
