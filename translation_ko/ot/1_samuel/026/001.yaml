reference: 1 Samuel 26:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ הַ/זִּפִים֙ אֶל שָׁא֔וּל הַ/גִּבְעָ֖תָ/ה לֵ/אמֹ֑ר הֲ/ל֨וֹא דָוִ֤ד מִסְתַּתֵּר֙ בְּ/גִבְעַ֣ת הַ/חֲכִילָ֔ה עַ֖ל פְּנֵ֥י הַ/יְשִׁימֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/001.yaml
  text: Then the Ziphites came to Saul at Gibeah[a], saying, “Is not David hiding on the hill of Hachilah, which is before the wasteland?”
  footnotes:
  - marker: a
    text: Or “before Jeshimon” or “opposite the wasteland.” The Hebrew place expression may be understood either as a common noun (“wasteland/desert”) or as the regional name Jeshimon.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 십 사람들[a]이 “다윗이 하길라 산, 곧 광야 앞에 숨어 있지 않습니까?” 하고 사울에게, 기브아로 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “예시몬 앞”, “광야 맞은편”. 히브리어 위치 표현은 일반명사 ‘광야/사막’ 또는 지역명 ‘예시몬’으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  english_pob_choice: Then ... came
  chosen_korean: “... 왔습니다”
  alternatives_korean:
  - “... 왔습니다”
  - “... 이르렀습니다”
  lexicon: HALOT
  rationale: 서사의 진행을 자연스럽게 잇는 완료형 동사로 옮기되, 원문의 이동 동작을 그대로 살리기 위해 ‘왔습니다’를 선택했습니다.
- source_word: הַזִּפִים
  english_pob_choice: the Ziphites
  chosen_korean: “십 사람들”
  alternatives_korean:
  - “십 주민들”
  - “십 사람들”
  lexicon: HALOT
  rationale: 지명 십의 주민을 가리키는 집합적 표현이므로, 한국어에서는 간결하게 ‘십 사람들’로 옮겨 지리·민족적 식별을 유지했습니다.
- source_word: הַגִּבְעָתָה
  english_pob_choice: at Gibeah
  chosen_korean: “기브아로”
  alternatives_korean:
  - “기브아에서”
  - “기브아에”
  lexicon: HALOT
  rationale: 도착 방향을 드러내는 방향격으로 처리하면 문맥상 자연스럽고, 사울이 그곳에 있었다는 배경도 함께 드러납니다.
- source_word: הֲלוֹא
  english_pob_choice: Is not
  chosen_korean: “... 않습니까?”
  alternatives_korean:
  - “정말 ... 아닙니까?”
  - “... 않습니까?”
  lexicon: HALOT
  rationale: 상대의 확인을 요구하는 수사 의문문이므로, 현대 한국어에서 가장 자연스러운 확인형 질문으로 옮겼습니다.
- source_word: עַל פְּנֵי הַיְשִׁימֹן
  english_pob_choice: which is before the wasteland
  chosen_korean: “광야 앞”
  alternatives_korean:
  - “광야 맞은편”
  - “광야 앞”
  - “예시몬 앞”
  lexicon: HALOT
  rationale: 원문의 전치사구를 과도하게 해석하지 않고, POB의 ‘before the wasteland’에 맞춰 ‘광야 앞’으로 직역성 있게 옮겼습니다.
