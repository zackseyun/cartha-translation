source:
  edition: WLC
  text: וַ/יַּ֨עַן דָּוִ֜ד וַ/יֹּ֣אמֶר אֶל אֲחִימֶ֣לֶךְ הַ/חִתִּ֗י וְ/אֶל אֲבִישַׁ֨י בֶּן צְרוּיָ֜ה אֲחִ֤י יוֹאָב֙ לֵ/אמֹ֔ר מִֽי יֵרֵ֥ד אִתִּ֛/י אֶל שָׁא֖וּל אֶל הַֽ/מַּחֲנֶ֑ה וַ/יֹּ֣אמֶר אֲבִישַׁ֔י אֲנִ֖י אֵרֵ֥ד עִמָּֽ/ךְ׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/006.yaml
  text: Then David answered and said to Ahimelech the Hittite and to Abishai son of Zeruiah[a], Joab’s brother, “Who will go down with me to Saul, to the camp?” And Abishai said, “I will go down with you.”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “Who will go down with me to Saul in the camp?” The Hebrew repeats “to” before both “Saul” and “the camp.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗이 헷 사람 아히멜렉과 스루야의 아들 아비새, 곧 요압의 형제에게 대답하여 말했습니다. “누가 나와 함께 사울에게, 그 진영으로 내려가겠습니까?” 아비새가 말했습니다. “제가 당신과 함께 내려가겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘사울’과 ‘진영’ 앞에 전치사 אֶל을 각각 반복합니다. 이를 직역하면 ‘사울에게, 그 진영으로’입니다. 문맥상 사울이 있는 진영으로 가는 것을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답하고 말했습니다
  - 응답하여 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 서술 관용구인 “answered and said”를 자연스럽게 살리되, 말하기 동작의 이중 구조를 유지하기 위해 ‘대답하여 말했습니다’로 옮겼습니다.
- source_word: אֲחִימֶלֶךְ הַחִתִּי
  english_pob_choice: Ahimelech the Hittite
  chosen_korean: 아히멜렉, 즉 헷 사람
  alternatives_korean:
  - 아히멜렉 헷 사람
  - 아히멜렉 히타이트 사람
  lexicon: HALOT
  rationale: 고유명사는 음역하고, ցեղ족/출신 표지는 ‘헷 사람’으로 옮겨 인물 식별을 유지했습니다. ‘즉’은 동일 인물에 대한 설명적 호칭임을 드러냅니다.
- source_word: אֶל שָׁאוּל אֶל הַמַּחֲנֶה
  english_pob_choice: to Saul, to the camp
  chosen_korean: 사울에게, 진영으로
  alternatives_korean:
  - 사울에게, 진영에
  - 사울에게, 진영 안으로
  lexicon: HALOT
  rationale: 반복된 אֶל을 반영해 ‘사울에게, 진영으로’로 분리해 옮겼습니다. 다윗이 사울이 있는 군대 진영 쪽으로 내려가겠다는 방향성을 보존합니다.
- source_word: יֵרֵד ... אֵרֵד
  english_pob_choice: go down / will go down
  chosen_korean: 내려가겠느냐 / 내려가겠습니다
  alternatives_korean:
  - 함께 가겠느냐 / 함께 가겠습니다
  - 내려가겠습니까 / 내려가겠습니다
  lexicon: HALOT
  rationale: ירד의 기본 방향성인 ‘내려가다’를 두 번 모두 유지해 질문과 응답의 대응을 살렸습니다.
theological_decisions:
- issue: 직접화법 안의 호칭과 존대 수준
  chosen_reading: 다윗의 질문은 평서체가 아니라 직접 대화체로 처리하고, 아비새의 응답은 현재 한국어 독자에게 자연스러운 공손한 합쇼체로 옮겼습니다.
  alternative_readings:
  - 질문과 응답 모두 평서체로 통일
  - 응답을 더 구어적으로 처리
  rationale: 본문은 전쟁 상황의 즉각적 대화를 담고 있으므로, 내용은 직접적이되 한국어 서술은 출판용 문체를 유지하는 것이 적절합니다.
  doctrine_reference: 서사체의 화행 재현과 현대 한국어 문체
