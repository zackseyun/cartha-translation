revisions:
- from: 그때 다윗이 아히멜렉, 즉 헷 사람과 스루야의 아들 아비새, 요압의 형제에게 대답하여 말했습니다. 「누가 나와 함께 사울에게, 진영으로 내려가겠느냐?」 아비새가 말했습니다. 「내가 당신과 함께 내려가겠습니다」.[a]
  to: 그때 다윗이 헷 사람 아히멜렉과 스루야의 아들 아비새, 곧 요압의 형제에게 대답하여 말했습니다. “누가 나와 함께 사울에게, 그 진영으로 내려가겠습니까?” 아비새가 말했습니다. “제가 당신과 함께 내려가겠습니다.”[a]
  rationale: 원문의 반복된 전치사와 ‘내려가다’를 보존하면서, 아히멜렉의 민족 표지를 단순 수식으로 바로잡았습니다. 또한 모든 직접화법을 현대 공식·공손 합쇼체로 통일하고 인용부호 및 각주 위치를 정비했습니다.
