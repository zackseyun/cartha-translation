  text: So now[a], do not let my blood fall to the ground away from the presence of Yahweh, for the king of Israel has come out to seek a single flea[b], as one hunts a partridge in the mountains.
  footnotes:
  - marker: a
    text: Or 'far from the presence of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or 'away from before the LORD'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 제 피가 야훼 앞에서 멀리 떨어진 곳에서 땅에 떨어지지 않게 해 주십시오[a]. 이스라엘 왕께서 산에서 자고새를 사냥하듯이 벼룩 한 마리를 찾으려고 나서셨기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 임재에서 멀리 떨어진 곳에서’.
    reason: alternative_reading
  - marker: b
    text: ‘자고새’로 번역한 히브리어 새 이름의 정확한 식별에는 논의가 있으나, 이 문맥에서는 전통적으로 자고새로 이해됩니다.
    reason: translation_note
