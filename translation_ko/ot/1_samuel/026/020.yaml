  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אַל יִפֹּ֤ל דָּֽמִ/י֙ אַ֔רְצָ/ה מִ/נֶּ֖גֶד פְּנֵ֣י יְהוָ֑ה כִּֽי יָצָ֞א מֶ֣לֶךְ יִשְׂרָאֵ֗ל לְ/בַקֵּשׁ֙ אֶת פַּרְעֹ֣שׁ אֶחָ֔ד כַּ/אֲשֶׁ֛ר יִרְדֹּ֥ף הַ/קֹּרֵ֖א בֶּ/הָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/020.yaml
  text: So now[a], do not let my blood fall to the ground away from the presence of Yahweh, for the king of Israel has come out to seek a single flea[b], as one hunts a partridge in the mountains.
  footnotes:
  - marker: a
    text: Or 'far from the presence of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or 'away from before the LORD'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 내 피가 땅에 떨어져 야훼의 얼굴 앞에서 멀어지지 않게 하십시오[a]. 이스라엘 왕이 한 마리 벼룩을 찾으러 나와서는, 마치 산에서 뇌조를 사냥하듯이 하였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 앞에서 멀리’.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘산에서 뇌조를 사냥하듯이’.
    reason: alternative_reading
lexical_decisions:
- source_word: דָּמִי
  english_pob_choice: my blood
  chosen_korean: 내 피
  alternatives_korean:
  - 내 생명
  lexicon: HALOT
  rationale: 히브리어의 구체적 이미지를 살려 ‘피’로 옮기고, 죽음과 피흘림의 함의를 흐리지 않았습니다.
- source_word: אַל יִפֹּל ... אַרצה
  english_pob_choice: do not let my blood fall to the ground
  chosen_korean: 내 피가 땅에 떨어져
  alternatives_korean:
  - 내 피가 땅에 떨어지지 않게
  lexicon: HALOT
  rationale: ‘떨어지다/떨어지게 하다’의 구체적 동작을 유지하면서 한국어 어순에 맞게 자연스럽게 구성했습니다.
- source_word: מִנֶּגֶד פְּנֵי יְהוָה
  english_pob_choice: away from the presence of Yahweh
  chosen_korean: 야훼의 얼굴 앞에서 멀어지지 않게
  alternatives_korean:
  - 야훼의 임재에서 멀어지지 않게
  - 야훼 앞에서 멀어지지 않게
  lexicon: HALOT
  rationale: ‘얼굴 앞’의 공간적·관계적 긴장을 살리되, 한국어로는 ‘앞에서 멀어지다’로 자연스럽게 풀었습니다. POB의 ‘presence’보다 원문 이미지를 더 직접 반영했습니다.
- source_word: הַקֹּרֵא
  english_pob_choice: a partridge
  chosen_korean: 뇌조
  alternatives_korean:
  - 산뇌조
  - 메추라기
  lexicon: HALOT
  rationale: 비유에 쓰인 새 이름은 한국어 성경에서 통용되는 ‘뇌조’가 가장 적합하여, 사냥 비유의 생동감을 살렸습니다.
theological_decisions:
- issue: 여호와/야훼 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 YHWH(יְהוָה)를 직접 사용하므로, 인격적 고유명을 살리는 ‘야훼’를 택했습니다. 표제어를 칭호로 바꾸지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
