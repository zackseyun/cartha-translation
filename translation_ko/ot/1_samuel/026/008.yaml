  text: וַ/יֹּ֤אמֶר אֲבִישַׁי֙ אֶל דָּוִ֔ד סִגַּ֨ר אֱלֹהִ֥ים הַ/יּ֛וֹם אֶת אוֹיִבְ/ךָ֖ בְּ/יָדֶ֑/ךָ וְ/עַתָּה֩ אַכֶּ֨/נּוּ נָ֜א בַּ/חֲנִ֤ית וּ/בָ/אָ֨רֶץ֙ פַּ֣עַם אַחַ֔ת וְ/לֹ֥א אֶשְׁנֶ֖ה לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/008.yaml
  text: Then Abishai said to David[a], “God has delivered your enemy into your hand today. So now, please let me pin him to the earth with the spear in one blow[c][b], and I will not strike him a second time.”
  footnotes:
  - marker: a
    text: Or “has handed over your enemy into your power today.”
    reason: lexical_alternative
  - marker: b
    text: Literally “with the spear and into the earth, once”; the sense is that Abishai offers to pin him to the ground with a single thrust.
    reason: lexical_alternative
  - marker: c
    text: Or 'strike him with the spear into the ground'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 아비새가 다윗에게 말했습니다. “하나님이 오늘 당신의 원수를 당신의 손에 넘기셨습니다. 그러니 이제 제발 제가 창으로 그를 한 번에 땅에 못 박게 하십시오. 그러면 저는 그에게 두 번 손대지 않겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “오늘 당신의 원수를 당신의 권세 아래 넘기셨습니다.”
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “창으로 그리고 땅에, 한 번”으로, 창으로 한 번에 그를 땅에 고정시키겠다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סִגַּר / אֱלֹהִים
  english_pob_choice: God has delivered
  chosen_korean: 하나님이 … 넘기셨습니다
  alternatives_korean:
  - 하나님이 … 넘겨주셨습니다
  - 하나님이 … 가두셨습니다
  lexicon: HALOT
  rationale: סִגַּר은 여기서 단순한 ‘닫다’보다 상대를 다른 이의 통제 아래로 ‘넘기다’는 뜻이므로, POB의 ‘has delivered’를 따라 자연스럽게 옮겼습니다.
- source_word: בְּיָדֶךָ
  english_pob_choice: into your hand
  chosen_korean: 당신의 손에
  alternatives_korean:
  - 당신의 권세 아래
  - 당신의 힘 안에
  lexicon: HALOT
  rationale: 히브리어 관용구를 살리되 한국어에서도 이해되도록 직역형인 ‘손에’를 유지했습니다.
- source_word: אַכֶּנּוּ נָא
  english_pob_choice: please let me strike him
  chosen_korean: 제발 제가 … 못 박게 하십시오
  alternatives_korean:
  - 제발 제가 … 치게 하십시오
  - 제발 제가 … 찌르게 하십시오
  lexicon: HALOT
  rationale: 동사 נכה의 기본 의미는 ‘치다/때리다’이지만, 뒤의 ‘창으로’와 함께 한 번의 결정적 타격을 가리키므로, 한국어에서는 ‘못 박다’로 옮겨 단회적 관통의 이미지를 드러냈습니다.
- source_word: בַּחֲנִית וּבָאָרֶץ פַּעַם אַחַת
  english_pob_choice: with the spear in one blow
  chosen_korean: 창으로 그를 한 번에 땅에 못 박게
  alternatives_korean:
  - 창으로 그를 한 번에 땅에 꽂게
  - 창으로 그를 한 번에 땅에 고정시키게
  lexicon: HALOT
  rationale: 직역하면 ‘창과 땅에, 한 번’이라는 난해한 표현이므로, POB의 의미 판단을 따라 ‘한 번에 땅에 못 박다’로 풀어 단회적 관통과 고정의 뜻을 살렸습니다.
- source_word: וְלֹא אֶשְׁנֶה לוֹ
  english_pob_choice: and I will not strike him a second time
  chosen_korean: 그러면 저는 그에게 두 번 손대지 않겠습니다
  alternatives_korean:
  - 그러면 저는 그를 두 번 치지 않겠습니다
  - 그러면 저는 그에게 다시는 손대지 않겠습니다
  lexicon: HALOT
  rationale: 문맥상 ‘다시 치다’가 뜻이지만, 한국어에서는 ‘두 번 손대지 않겠습니다’가 한 번이면 충분하다는 뉘앙스를 자연스럽게 전달합니다.
theological_decisions:
- issue: 하나님의 주권과 아비새의 살해 제안
  chosen_reading: 아비새는 이 일을 하나님의 섭리로 해석하지만, 번역은 그 해석을 승인하지 않고 그의 제안만 진술합니다.
  alternative_readings:
  - 아비새의 말 자체를 하나님의 승인처럼 들리게 번역하는 방식
  - 해석적 설명을 덧붙여 살해 제안을 완화하는 방식
  rationale: 본문은 하나님이 사울을 아비새의 손에 ‘넘기셨다’고 말하는 아비새의 발언을 기록할 뿐, 그 즉시 살해하라는 제안을 정당화하지 않습니다. 이 긴장을 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: 섭리의 진술과 인간의 폭력 제안을 구분해 보존
