source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ֥/מָּה זֶּ֛ה אֲדֹנִ֥/י רֹדֵ֖ף אַחֲרֵ֣י עַבְדּ֑/וֹ כִּ֚י מֶ֣ה עָשִׂ֔יתִי וּ/מַה בְּ/יָדִ֖/י רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/018.yaml
  text: And he said[a], “Why is my lord pursuing his servant like this? For what have I done[b], and what evil is in my hand?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''his servant.'' Some translations read ''your servant'' to smooth the direct address, but the Masoretic Text has the third-person form.'
    reason: alternative_reading
  - marker: b
    text: '''In my hand'' is a Hebrew idiom for culpability, intent, or power to do harm.'
    reason: cultural_note
translation:
  language: ko
  text: 그가 말했습니다[a], “어찌하여 내 주께서 이렇게 자기 종을 뒤쫓으십니까? 내가 무엇을 했으며, 내 손에[b] 무슨 악이 있습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘그의 종’(3인칭)을 읽습니다. 직접 호칭에서는 ‘당신의 종’이 자연스럽지만, 마소라 본문 형태를 본문에 보존했습니다.
    reason: alternative_reading
  - marker: b
    text: ‘내 손에’는 히브리어 관용구로, 실제로 해를 끼칠 의도·능력·책임이 있음을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말하였습니다
  lexicon: WLC
  rationale: 히브리어 서술형 wayyiqtol의 자연스러운 서사 진행을 살리면서, 현대 한국어 합쇼체로 간결하게 옮겼습니다.
- source_word: לָמָּה זֶּה
  english_pob_choice: Why is my lord pursuing his servant like this?
  chosen_korean: 어찌하여 ... 이렇게
  alternatives_korean:
  - 왜 ... 이렇게
  - 어찌하여 ... 이렇습니까
  lexicon: HALOT
  rationale: לָמָּה זֶּה의 약간 강조된 ‘왜 이처럼/왜 이렇게’라는 뉘앙스를 살려, 단순한 이유 질문보다 상황 전체를 묻는 표현으로 옮겼습니다.
- source_word: עַבְדּוֹ
  english_pob_choice: his servant
  chosen_korean: 자기 종
  alternatives_korean:
  - 그의 종
  - 당신의 종
  lexicon: HALOT
  rationale: 직접 화법의 맥락상 한국어에서는 ‘자기 종’이 가장 자연스럽고, MT의 3인칭 소유 접미사도 무리 없이 드러낼 수 있습니다.
- source_word: בְּיָדִי רָעָה
  english_pob_choice: what evil is in my hand
  chosen_korean: 내 손에 어떤 악이 있습니까
  alternatives_korean:
  - 내 손에 어떤 악이 있습니까
  - 내 손에 어떤 잘못이 있습니까
  lexicon: HALOT
  rationale: ‘손에’는 책임·능력·가해 가능성을 가리키는 히브리어 관용구이므로 그대로 보존했고, רָעָה는 ‘악’이 본래 강도를 더 잘 드러냅니다.
theological_decisions:
- issue: 다윗의 직접 호칭에서 예의와 거리감의 유지
  chosen_reading: 내 주께서 ... 종을
  alternative_readings:
  - 내 주님께서 ... 하인에게
  - 주인이 ... 종을
  rationale: 사울을 향한 공손한 인간 상하관계 호칭을 유지하되, 한국 교회어의 종교적 ‘주님’으로 오해되지 않도록 ‘내 주’로 처리했습니다.
  doctrine_reference: 사울-다윗 서사에서 인간 군주에 대한 경어 사용
