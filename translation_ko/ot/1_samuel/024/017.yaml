  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת דָּוִ֗ד לְ/דַבֵּ֞ר אֶת הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ אֶל שָׁא֔וּל וַ/יֹּ֣אמֶר שָׁא֔וּל הֲ/קֹלְ/ךָ֥ זֶ֖ה בְּנִ֣/י דָוִ֑ד וַ/יִּשָּׂ֥א שָׁא֛וּל קֹל֖/וֹ וַ/יֵּֽבְךְּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/017.yaml
  text: When David had finished speaking these words to Saul[a], Saul said, “Is this your voice, my son David?” Then Saul lifted up his voice and wept.
  footnotes:
  - marker: a
    text: Or, 'David my son.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 사울에게 이 말들을 다 하고 나자, 사울이 말했습니다. 「이것이 네 목소리냐, 내 아들 다윗아?[a]」 사울은 목소리를 높여 울었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗아, 내 아들.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/יְהִ֣י כְּ/כַלּ֣וֹת ... לְ/דַבֵּ֞ר
  english_pob_choice: When David had finished speaking
  chosen_korean: 다윗이 ... 이 말들을 다 마치자
  alternatives_korean:
  - 다윗이 ... 말하기를 마치자
  - 다윗이 ... 말하는 것을 끝내자
  lexicon: WLC, HALOT
  rationale: כְּכַלּוֹת + לְדַבֵּר는 동작의 완료를 나타내므로, 한국어에서는 ‘... 다 마치자’로 자연스럽게 옮겨 사건의 선후를 분명히 했습니다.
- source_word: אֶת הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙
  english_pob_choice: these words
  chosen_korean: 이 말들을
  alternatives_korean:
  - 이 일들을
  - 이 말씀들을
  lexicon: HALOT
  rationale: 대화 직후의 직접 화법 맥락이므로 דְּבָרִים는 ‘말들’이 가장 직접적입니다. ‘말씀들’은 지나치게 격식 있고, ‘일들’은 화행의 성격을 약화합니다.
- source_word: הֲ/קֹלְ/ךָ֥ זֶ֖ה
  english_pob_choice: Is this your voice
  chosen_korean: 이것이 네 목소리냐
  alternatives_korean:
  - 이 목소리가 네 것이냐
  - 이 소리가 네 목소리냐
  lexicon: HALOT
  rationale: הֲ의 인식 질문과 זֶה의 지시성을 살려, ‘이것이’로 시작하는 직설적 확인 질문으로 옮겼습니다. קוֹל은 여기서 ‘목소리’가 가장 자연스럽습니다.
- source_word: בְּנִ֣/י דָוִ֑ד
  english_pob_choice: my son David
  chosen_korean: 내 아들 다윗아
  alternatives_korean:
  - 내 아들 다윗
  - 다윗아, 내 아들
  lexicon: HALOT
  rationale: 히브리어의 친자 관계 언어를 유지하되 한국어 호격에 맞게 ‘다윗아’로 마무리했습니다. 이는 관계적·수사적 부름이지 교리적 친자 선언이 아닙니다.
- source_word: וַ/יִּשָּׂ֥א שָׁא֛וּל קֹל֖/וֹ
  english_pob_choice: Saul lifted up his voice
  chosen_korean: 사울은 소리를 높여
  alternatives_korean:
  - 사울은 목소리를 높여
  - 사울은 큰소리로
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어 관용으로 풀어, ‘소리를 높여’로 정서와 공적 발화를 함께 살렸습니다.
- source_word: וַ/יֵּֽבְךְּ
  english_pob_choice: wept
  chosen_korean: 울었습니다
  alternatives_korean:
  - 통곡했습니다
  - 흘렸습니다
  lexicon: HALOT
  rationale: 동사의 핵심 의미는 ‘울다/우는 것’이므로, 과장되지 않으면서도 정서적 반응을 분명히 하는 ‘울었습니다’를 선택했습니다.
theological_decisions:
- issue: 사울의 호칭 '내 아들 다윗아'의 의미
  chosen_reading: 혈연 관계의 단정으로 읽지 않고, 사울의 애정·수사적 호칭으로 유지했습니다.
  alternative_readings:
  - 실제 부자 관계를 암시하는 표현
  - 단순한 정치적 예우 표현
  rationale: 히브리어 본문은 분명히 친자 언어를 사용하지만, 문맥상 신학적 주장보다 감정적·관계적 호소가 핵심입니다. 따라서 한국어도 그 긴장을 유지했습니다.
  doctrine_reference: 본문 문맥 우선, 친족 은유 해석
