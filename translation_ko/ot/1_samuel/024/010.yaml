revisions:
- from: 다윗이 사울에게 말했습니다. “왜 한 사람이 말하는 말을 듣고 있습니까? ‘보십시오, 다윗이 당신에게 해를 끼치려고 합니다’라고 말하는데 말입니다.”[a][b]
  to: 다윗이 사울에게 말했습니다. “어찌하여 ‘보십시오, 다윗이 임금님께 해를 끼치려 합니다’[b]라고 하는 사람의 말[a]을 들으십니까?”
  rationale: 인용 내용이 ‘…라고 하는 사람의 말’을 수식하도록 문장을 재구성하여 히브리어의 구문 관계를 명확히 했습니다. אָדָם의 단수성, 직접 인용, 그리고 רָעָה의 문맥적 의미는 보존했습니다. 각주 표지는 해당 어휘 바로 뒤로 옮겼으며, 모든 표현을 현대 표준어 합쇼체에 맞추었습니다.
