source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ לְ/שָׁא֔וּל לָ֧/מָּה תִשְׁמַ֛ע אֶת דִּבְרֵ֥י אָדָ֖ם לֵ/אמֹ֑ר הִנֵּ֣ה דָוִ֔ד מְבַקֵּ֖שׁ רָעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/010.yaml
  text: And David said to Saul[a], “Why do you listen to the words of a man who says, ‘Look[b], David is seeking your harm’?”
  footnotes:
  - marker: a
    text: Or, “the words of man / human words.” The Hebrew singular can sometimes carry a more general human sense, but here it is rendered “a man” to reflect the singular form and the likely reference to an accuser.
    reason: lexical_alternative
  - marker: b
    text: Or, “David seeks evil against you.” The Hebrew phrase can be rendered more literally with “evil,” but “harm” communicates the intended accusation in natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 사울에게 말했습니다. “어찌하여 ‘보십시오, 다윗이 임금님께 해를 끼치려 합니다’[b]라고 하는 사람의 말[a]을 들으십니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사람의 말”로 옮길 수 있습니다. 히브리어 단수는 때때로 일반적인 인간적 의미를 나타낼 수 있지만, 여기서는 단수형과 고발자의 개별성을 살려 “사람의 말”로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “다윗이 임금님께 악을 꾀합니다”로 옮길 수 있습니다. 히브리어 רָעָה는 ‘악’도 뜻하지만, 여기서는 고발의 뜻을 자연스럽게 드러내기 위해 ‘해를 끼치다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשָׁאוּל
  english_pob_choice: to Saul
  chosen_korean: 사울에게
  alternatives_korean:
  - 사울에게
  - 샤울에게
  lexicon: HALOT
  rationale: 히브리어 전치사 לְ는 발화의 대상인 사울을 표시하므로 한국어에서는 여격 조사로 자연스럽게 옮겼습니다.
- source_word: לָמָּה תִשְׁמַע
  english_pob_choice: Why do you listen
  chosen_korean: 왜 ... 듣고 있습니까
  alternatives_korean:
  - 왜 ... 듣습니까
  - 어째서 ... 귀를 기울이십니까
  lexicon: HALOT
  rationale: שׁמע는 단순 청각보다 '귀 기울여 받아들이는 것'을 뜻하므로, 꾸짖는 맥락에 맞게 '듣다'로 옮기되 현재 진행형 느낌을 살렸습니다.
- source_word: אֶת דִּבְרֵי אָדָם
  english_pob_choice: the words of a man
  chosen_korean: 한 사람이 말하는 말을
  alternatives_korean:
  - 한 사람의 말하는 말
  - 사람의 말들을
  - 어떤 사람의 말
  lexicon: HALOT
  rationale: אָדָם의 단수형과 POB의 'a man' 판단을 따라, 일반화하지 않고 특정한 한 사람을 가리키는 표현으로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: who says
  chosen_korean: 라고 말하는데 말입니다
  alternatives_korean:
  - 라고 말하며
  - 라고 하는데
  - 말하기를
  lexicon: HALOT
  rationale: 부정사 לֵאמֹר는 뒤의 직접 화법을 이끄므로, 한국어에서는 인용절을 자연스럽게 열어 주는 연결 표현으로 처리했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  - 보세요
  lexicon: HALOT
  rationale: 화자의 주의를 끌어 상대에게 대상을 지시하는 감탄사이므로, 한국어에서는 자연스러운 호격적 지시 표현을 택했습니다.
- source_word: רָעָתֶךָ
  english_pob_choice: your harm
  chosen_korean: 당신에게 해를 끼치려고 합니다
  alternatives_korean:
  - 당신의 해를 찾고 있습니다
  - 당신에게 악을 꾀합니다
  - 당신을 해치려 합니다
  lexicon: HALOT
  rationale: רָעָה는 문맥상 도덕적 '악'보다 가해 결과를 가리키므로, 한국어에서는 '해를 끼치다/해치다'로 옮겨 자연스러운 비난의 뜻을 드러냈습니다.
theological_decisions:
- issue: אָדָם을 단수 인간으로 볼지 집합적 '사람들'로 볼지
  chosen_reading: 한 사람
  alternative_readings:
  - 사람들
  - 인간들
  - 인류
  rationale: 본문의 אָדָם은 단수형이며, POB도 이를 한 개인의 발화로 읽습니다. 따라서 집합적 표현으로 완화하지 않고 단수성을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; Contested terms table for אָדָם
