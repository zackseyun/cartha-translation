base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/023.yaml
  text: So David swore to Saul. Then Saul went to his house[a], but David and his men went up to the stronghold.
  footnotes:
  - marker: a
    text: Or 'and David and his men went up to the stronghold.' The Hebrew conjunction is simply 'and'; 'but' in the main text makes the narrative contrast explicit in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 다윗은 사울에게 맹세했습니다. 그러자 사울은 자기 집으로 갔고[a], 다윗과 그의 사람들은 요새로 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 다윗과 그의 사람들은 요새로 올라갔습니다.” 히브리어 접속사는 단순히 ‘그리고’이며, 본문은 서사적 대비를 분명히 하기 위해 ‘그러자’를 사용했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  english_pob_choice: swore
  chosen_korean: 맹세했습니다
  alternatives_korean:
  - 맹세를 했습니다
  - 맹세하였습니다
  lexicon: HALOT
  rationale: 히브리어 שׁבע의 서사적 표현을 한국어에서는 자연스럽고 직접적인 ‘맹세하다’로 옮기는 것이 가장 분명합니다.
- source_word: לְשָׁאוּל
  english_pob_choice: to Saul
  chosen_korean: 사울에게
  alternatives_korean:
  - 사울을 향해
  - 사울을 위해
  lexicon: HALOT
  rationale: 전치사 ל는 여기서 맹세의 상대를 가리키므로 ‘사울에게’가 가장 직역적이면서도 자연스럽습니다.
- source_word: בֵּיתוֹ
  english_pob_choice: his house
  chosen_korean: 자기 집
  alternatives_korean:
  - 자기 집으로
  - 자기 가정으로
  lexicon: HALOT
  rationale: בַּיִת은 물리적 ‘집’과 ‘가정/집안’을 모두 가질 수 있지만, 서사 맥락에서는 구체적인 ‘집’이 적합합니다.
- source_word: הַמְּצוּדָה
  english_pob_choice: the stronghold
  chosen_korean: 요새
  alternatives_korean:
  - 산성
  - 피난처
  lexicon: HALOT
  rationale: מְצוּדָה는 방어된 거점이라는 뜻이므로, 한국어에서는 ‘요새’가 ‘stronghold’의 기능적 의미를 가장 잘 전달합니다.
theological_decisions:
- issue: 히브리어 접속사 וְ의 대비 효과
  chosen_reading: 본문의 단순한 ‘그리고’보다 앞절과의 대비를 살려 ‘그러자’로 연결했습니다.
  alternative_readings:
  - 그리고 다윗과 그의 사람들은 올라갔습니다
  - 하지만 다윗과 그의 사람들은 올라갔습니다
  rationale: 영어 POB가 주석에서 밝히듯 Hebrew conjunction 자체는 단순 ‘and’이지만, 한국어 서사에서는 사울의 귀가와 다윗 일행의 이동 사이 대비를 자연스럽게 드러내는 연결이 가능합니다.
  doctrine_reference: 서사 담화의 자연스러운 대비 표지
