  naturalness: 합쇼체 문장은 자연스럽습니다. 그러나 ‘그러자’는 사울이 집으로 간 사건을 앞선 맹세의 결과처럼 연결할 수 있고, 주석이 설명하는 사울과 다윗의 대조는 ‘갔고’로는 드러나지 않습니다. ‘갔지만’으로 대비를 표시하면 현대 한국어 서사에서 더 명확하고 자연스럽습니다.
  terminology: ‘맹세하다’, ‘요새’는 문맥과 원어 의미에 적합합니다. 인명 표기도 표준적입니다.
