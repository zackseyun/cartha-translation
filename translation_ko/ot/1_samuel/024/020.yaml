  rationale: 히브리어의 남성 단수 일반표현이지만 한국어에서는 문맥상 포괄적인 일반 인칭이 자연스러워 '사람이'로 옮겼습니다.
- source_word: וְשִׁלְּחוֹ בְּדֶרֶךְ טוֹבָה
