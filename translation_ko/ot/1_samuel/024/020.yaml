base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/020.yaml
  text: For when a man finds his enemy and lets him go on his way safely[b][a], may Yahweh repay you with good for what you have done to me this day.
  footnotes:
  - marker: a
    text: Or 'and sends him away in peace' / 'and lets him go safely.' The Hebrew literally says 'on a good way.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD will repay you with good.' The Hebrew form may be heard either as a wish/blessing or as a predictive statement.
    reason: alternative_reading
translation:
  language: ko
  text: 사람이 자기 원수를 만나고도 그를 안전하게 보내 준다면, 야훼께서 오늘 나에게 해 준 일에 대한 보답으로 선한 것으로 갚아 주시기를 바랍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘좋은 길로’입니다. 문맥상 ‘안전하게’ 또는 ‘평안히 보내다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 기원이나 축복으로도, ‘야훼께서 갚아 주실 것이다’라는 진술로도 읽을 수 있습니다.
    reason: alternative_reading
