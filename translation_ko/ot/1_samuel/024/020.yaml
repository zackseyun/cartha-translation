  lexicon: HALOT
  rationale: 문맥의 신적 이름은 전통적 대체어가 아니라 고유명사 음역 '야훼'를 사용해 원문의 인식 가능성을 보존했습니다.
- source_word: יְשַׁלֶּמְךָ טוֹבָה
  english_pob_choice: may Yahweh repay you with good
  chosen_korean: 야훼께서 ... 선으로 당신에게 갚아 주시기를 바랍니다
  alternatives_korean:
