  text: 오늘 당신은 내게 행한 선한 일을 말했습니다. 야훼께서 나를 당신의 손에 넘기셨을 때[a], 당신은 나를 죽이지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘야훼께서 나를 당신의 손에 주셨을 때/넘기셨을 때’의 뜻이 될 수 있습니다.
    reason: lexical_alternative
