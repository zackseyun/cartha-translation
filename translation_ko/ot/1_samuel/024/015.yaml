translation:
  language: ko
  text: 이스라엘 왕께서 누구를 뒤따라 나오셨습니까? 누구를 뒤쫓고 계십니까? 죽은 개를, 벼룩 한 마리를 뒤쫓으시는 것입니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘뒤에/따라’를 뜻하는 말을 반복하여, 여기서는 추격의 대상을 묻습니다. 또는 “이스라엘 왕께서 누구를 대적하여 나오셨습니까? 누구를 추격하고 계십니까?”라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי מִי
  english_pob_choice: After whom
  chosen_korean: 누구를 따라
  alternatives_korean:
  - 누구를 향해
  - 누구를 쫓아
  lexicon: HALOT
  rationale: 히브리어 אַחֲרֵי는 문자적으로는 ‘뒤에/따라’이지만, 이 문맥에서는 추격의 대상을 묻는 표현이므로 ‘누구를 따라’로 반복 구조를 살리면서도 자연스럽게 옮겼습니다.
- source_word: יָצָא
