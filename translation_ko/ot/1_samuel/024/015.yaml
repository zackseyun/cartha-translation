  text: After whom has the king of Israel come out? After whom are you pursuing? After a dead dog[a], after a single flea.
  footnotes:
  - marker: a
    text: Or 'Against whom has the king of Israel come out? Whom are you hunting?' The Hebrew repeatedly uses 'after' in the sense of pursuit.
