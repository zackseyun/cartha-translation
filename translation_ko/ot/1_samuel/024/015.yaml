  rationale: אֶחָד의 강조를 한국어에서 가장 자연스럽게 드러내기 위해 ‘한 마리’를 사용해 미미함을 부각했습니다.
theological_decisions:
- issue: 다윗의 자기 비하 표현의 직설성
  chosen_reading: ‘죽은 개’와 ‘한 마리 벼룩’을 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - ‘아무것도 아닌 존재’처럼 의역
  - ‘죽은 개의 사체’처럼 설명적 번역
  rationale: 본문은 사울의 추격이 얼마나 부당한지를 드러내기 위해 강한 자기 비하를 사용하므로, 그 수사적 충격을 유지하는 것이 본문의 의도에 더 충실합니다.
  doctrine_reference: 본문의 수사와 화자 의도를 보존하는 번역 원칙
