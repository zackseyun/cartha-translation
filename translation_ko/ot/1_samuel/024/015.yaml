  - severity: low
    issue: 왕에 대한 높임 표현의 불일치
    rationale: 둘째 물음은 ‘계십니까’로 높였으나 첫째 물음은 ‘왕이 … 나왔습니까’로 되어 있습니다. 직접 호칭 문맥에서는 ‘왕께서 … 나오셨습니까’가 자연스럽고 일관됩니다.
  - severity: low
