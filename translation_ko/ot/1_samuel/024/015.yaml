  - 쫓고 계십니까
  lexicon: HALOT
  rationale: רָדַף는 적대적이고 지속적인 추격을 뜻하므로, ‘뒤쫓다’가 가장 직접적으로 그 뉘앙스를 살립니다.
- source_word: כֶּלֶב מֵת
  english_pob_choice: a dead dog
  chosen_korean: 죽은 개
  alternatives_korean:
  - 죽은 개 한 마리
  - 송장 개
  lexicon: HALOT
  rationale: 다윗의 자기 비하적 비유를 과장 없이 살리기 위해 관용적 표현을 그대로 옮겼습니다.
- source_word: פַּרְעֹשׁ אֶחָד
  english_pob_choice: a single flea
  chosen_korean: 한 마리 벼룩
