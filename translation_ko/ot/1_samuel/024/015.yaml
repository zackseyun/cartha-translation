  - 나갔습니까
  - 출정했습니까
  lexicon: HALOT
  rationale: 동사는 단순한 ‘나감/나옴’이지만, 왕이 추격을 위해 밖으로 나온 상황이므로 직역보다 문맥에 맞는 ‘나왔습니까’를 택했습니다.
