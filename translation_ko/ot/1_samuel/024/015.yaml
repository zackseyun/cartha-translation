lexical_decisions:
- source_word: אַחֲרֵי מִי
  english_pob_choice: After whom
  chosen_korean: 누구를 따라
  alternatives_korean:
  - 누구를 향해
  - 누구를 쫓아
  lexicon: HALOT
  rationale: 히브리어 אַחֲרֵי는 문자적으로는 ‘뒤에/따라’이지만, 이 문맥에서는 추격의 대상을 묻는 표현이므로 ‘누구를 따라’로 반복 구조를 살리면서도 자연스럽게 옮겼습니다.
