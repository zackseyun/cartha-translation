  lexicon: HALOT
  rationale: 다윗의 자기 비하적 비유를 과장 없이 살리기 위해 관용적 표현을 그대로 옮겼습니다.
- source_word: פַּרְעֹשׁ אֶחָד
  english_pob_choice: a single flea
  chosen_korean: 한 마리 벼룩
  alternatives_korean:
