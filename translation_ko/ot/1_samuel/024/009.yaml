- from: 그 후에 다윗이 굴에서 나와 사울 뒤를 따라 외쳤습니다. “내 주 왕이여!” 사울이 뒤를 돌아보자 다윗이 얼굴을 땅에 대고 몸을 굽혀 엎드렸습니다.[a]
  to: 그 후에 다윗이 일어나 굴에서 나와 사울을 뒤에서 불렀습니다. “내 주이신 왕이여!” 사울이 뒤를 돌아보자, 다윗은 얼굴을 땅에 대도록 몸을 굽히고 엎드렸습니다.[a]
