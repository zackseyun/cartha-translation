base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/009.yaml
  text: After that David rose and went out of the cave[a], and called after Saul, saying, “My lord the king!” When Saul looked behind him, David bowed with his face to the ground and prostrated himself.
  footnotes:
  - marker: a
    text: Or “bowed down” for “prostrated himself.” The Hebrew verb can denote deep obeisance or homage; here it refers to David’s posture before Saul, not divine worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후에 다윗이 일어나 굴에서 나와 사울을 뒤에서 불렀습니다. “내 주이신 왕이여!” 사울이 뒤를 돌아보자, 다윗은 얼굴을 땅에 대도록 몸을 굽히고 엎드렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘엎드렸습니다’는 히브리어의 깊은 몸 숙임과 엎드림을 함께 반영한 표현입니다. 여기서는 하나님께 대한 예배가 아니라 사울 앞에서 보인 깊은 경의의 자세를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מִן־הַמְּעָרָה
  english_pob_choice: went out of the cave
  chosen_korean: 굴에서 나와
  alternatives_korean:
  - 동굴에서 나와
  - 굴 밖으로 나와
  lexicon: HALOT
  rationale: יצא의 기본 의미를 따라 단순히 ‘나가다’로 옮기고, מְעָרָה는 문맥상 자연스러운 ‘굴’로 옮겼습니다.
- source_word: וַיִּקְרָא אַחֲרֵי שָׁאוּל
  english_pob_choice: called after Saul
  chosen_korean: 사울 뒤를 따라 외쳤습니다
  alternatives_korean:
  - 사울을 뒤따라 불렀습니다
  - 사울 뒤에서 불렀습니다
  lexicon: HALOT
  rationale: אַחֲרֵי + 인명은 멀어져 가는 사람을 향해 뒤에서 부르는 상황을 나타내므로, 단순 ‘부르다’보다 방향성을 살린 표현을 택했습니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: My lord the king
  chosen_korean: 내 주 왕이여
  alternatives_korean:
  - 내 주님 왕이여
  - 나의 주 왕이여
  lexicon: HALOT
  rationale: 아도니는 존칭 호칭이므로 ‘내 주’로, הַמֶּלֶךְ은 왕에 대한 직접 호칭으로 옮겨 두 칭호를 함께 살렸습니다.
- source_word: וַיִּקֹּד ... וַיִּשְׁתָּחוּ
  english_pob_choice: bowed ... prostrated himself
  chosen_korean: 얼굴을 땅에 대고 몸을 굽혀 엎드렸습니다
  alternatives_korean:
  - 몸을 굽혀 절했습니다
  - 얼굴을 땅에 대고 절했습니다
  lexicon: HALOT
  rationale: 두 동사가 연속해 나오는 만큼 동작을 한 번의 자연스러운 한국어로 묶되, 단순한 예배가 아니라 인간 왕 앞의 깊은 예로 드러나게 했습니다.
theological_decisions:
- issue: 사울 앞에서의 다윗의 몸짓 의미
  chosen_reading: 하나님께 드리는 예배가 아니라, 사울에게 대한 깊은 경의와 복종의 자세로 읽었습니다.
  alternative_readings:
  - 예배했습니다
  - 경배했습니다
  rationale: 원문 동사들은 인간 대상에게도 쓰일 수 있는 몸의 낮춤을 가리키므로, 신앙적 예배 의미를 덧씌우지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3, §6
