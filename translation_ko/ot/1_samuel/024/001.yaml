  - 살았습니다
  - 정착했습니다
  lexicon: HALOT
  rationale: 이동 서술 맥락에서 일시적 체류를 뜻하는 ‘머물다’가 English POB의 ‘stayed’를 가장 잘 반영합니다.
- source_word: בִּמְצָדוֹת
