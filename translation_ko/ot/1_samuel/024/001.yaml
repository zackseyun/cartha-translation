lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라가
  alternatives_korean:
  - 올라왔습니다
  - 올라갔습니다
  lexicon: HALOT
  rationale: עלה의 기본적 상향 이동을 살려 ‘올라가’로 옮겼습니다. 서술 흐름도 자연스럽게 유지됩니다.
- source_word: מִשָּׁם
  english_pob_choice: from there
  chosen_korean: 거기서
  alternatives_korean:
  - 그곳에서
  - 거기에서
  lexicon: HALOT
  rationale: 지시 부사로서 앞선 장소를 가리키는 기능을 자연스러운 현대 한국어로 반영했습니다.
- source_word: וַיֵּשֶׁב
  english_pob_choice: stayed
  chosen_korean: 머물렀습니다
  alternatives_korean:
  - 거주했습니다
  - 살았습니다
  - 정착했습니다
  lexicon: HALOT
  rationale: 이동 서술 맥락에서 일시적 체류를 뜻하는 ‘머물다’가 English POB의 ‘stayed’를 가장 잘 반영합니다.
- source_word: בִּמְצָדוֹת
  english_pob_choice: in the strongholds
  chosen_korean: 요새들에
  alternatives_korean:
  - 산성들에
  - 피난처들에
  - 요새에
  lexicon: HALOT
  rationale: מְצָדוֹת는 방어가 가능한 거처들을 가리키므로 ‘요새들’이 가장 직접적입니다. 복수형도 반영했습니다.
- source_word: עֵין גֶּדִי
  english_pob_choice: En-gedi
  chosen_korean: 엔-게디
  alternatives_korean:
  - 엔게디
  lexicon: HALOT
  rationale: 지명은 음역해 옮겼고, 한국어 표기 관행상 하이픈을 유지했습니다.
