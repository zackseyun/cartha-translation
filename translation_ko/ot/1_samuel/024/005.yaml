base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/005.yaml
  text: Then David’s men said to him[a], “Look, this is the day of which Yahweh said to you, ‘Look, I am giving your enemy into your hand, and you may do to him as seems good in your eyes.’” Then David arose and secretly cut off the corner of Saul’s robe.
  footnotes:
  - marker: a
    text: Or more idiomatically, “as seems good to you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다윗의 부하들이 그에게 말했습니다. 「보십시오, 오늘이야말로 야훼께서 당신에게 말씀하신 그날입니다. ‘보십시오, 내가 당신의 원수를 당신의 손에 넘겨주고 있습니다. 당신은 그에게 당신 눈에 좋은 대로[a] 할 수 있습니다.’」 다윗이 일어나 사울의 겉옷 자락을 몰래 잘라 냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구를 더 자연스럽게 풀면 “당신이 보기에 좋은 대로”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי דָוִד
  english_pob_choice: David’s men
  chosen_korean: 다윗의 부하들
  alternatives_korean:
  - 다윗의 사람들
  - 다윗의 남자들
  - 다윗의 군사들
  lexicon: HALOT
  rationale: 문맥상 다윗을 따르던 무리로, 현대 한국어에서는 ‘부하들’이 자연스럽고 관계를 분명히 드러냅니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
