  - 여기 보십시오
  - 봐
  lexicon: HALOT
  rationale: 직접 화법에서 상대를 가리키는 강조로, 합쇼체 문맥에 맞게 정중하면서도 주의를 환기하는 표현을 택했습니다.
- source_word: איבי/ך
  english_pob_choice: your enemy
  chosen_korean: 당신의 원수
  alternatives_korean:
  - 당신의 적
  - 당신의 적대자
  - 당신의 원수들
  lexicon: HALOT
  rationale: 단수 대상은 사울이며, 히브리어의 ‘원수’는 관계적 적대성을 강하게 드러내므로 그 뉘앙스를 살렸습니다.
- source_word: בְּ/יָדֶ֔/ךָ
  english_pob_choice: into your hand
  chosen_korean: 당신의 손에 넘겨주겠다
  alternatives_korean:
  - 당신의 손에
  - 당신의 권세 아래
  - 당신의 손으로
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서 자연스럽게 풀면 ‘손에 넘겨주다’가 가장 직접적이며, 전달 행위를 분명히 합니다.
- source_word: כַּ/אֲשֶׁ֖ר יִטַ֣ב בְּ/עֵינֶ֑י/ךָ
  english_pob_choice: as seems good in your eyes
  chosen_korean: 당신 눈에 좋은 대로
  alternatives_korean:
  - 당신이 보기에 좋은 대로
  - 당신 마음에 좋은 대로
  - 당신에게 좋게 여겨지는 대로
  lexicon: HALOT
  rationale: ‘눈에 좋다’의 히브리식 표현을 유지하되, 한국어에서 자연스럽게 들리도록 ‘좋은 대로’로 옮겼습니다.
- source_word: כְּנַף הַמְּעִיל
  english_pob_choice: the corner of Saul’s robe
  chosen_korean: 사울의 겉옷 자락
  alternatives_korean:
  - 사울의 옷자락
  - 사울의 겉옷 끝자락
  - 사울의 외투 자락
  lexicon: HALOT
  rationale: כְּנָף는 의복의 끝/자락을 가리키므로 ‘자락’이 가장 자연스럽고, הַמְּעִיל은 외투성 겉옷으로 이해해 옮겼습니다.
- source_word: בַּלָּט
  english_pob_choice: secretly
  chosen_korean: 몰래
  alternatives_korean:
  - 은밀히
  - 숨어서
  - 비밀리에
  lexicon: HALOT
  rationale: 서술 동작의 은밀함을 간결하게 살리는 현대 한국어 표현입니다.
theological_decisions:
- issue: 다윗의 부하들이 전한 ‘야훼께서 말씀하신 날’이 실제 계시인지, 혹은 그들의 해석인지
  chosen_reading: 본문은 그들이 그렇게 말했다고만 옮기고, 그 진술의 신적 확정 여부는 판단하지 않았습니다.
  alternative_readings:
  - ‘야훼께서 약속하신 날’처럼 해석을 약화하는 번역
  - 특정한 기존 예언 성취로 강하게 단정하는 번역
  rationale: 히브리어는 부하들의 발화를 그대로 보고하므로, 본문이 유지하는 긴장을 훼손하지 않도록 화자의 주장 수준을 보존했습니다.
  doctrine_reference: 본문의 서술 긴장 보존
- issue: וְעָשִׂיתָ לּוֹ의 가능/허용 의미
  chosen_reading: ‘당신은 그에게 … 할 수 있다’로 옮겨, 명령이라기보다 허용된 행동의 여지를 살렸습니다.
  alternative_readings:
  - ‘당신은 그에게 … 해야 한다’
  - ‘당신은 그에게 … 할 것이다’
  rationale: 이어지는 문맥에서 행동의 권한이 주어지는 상황이므로, 한국어에서도 가능/허용의 의미가 가장 정확합니다.
  doctrine_reference: 문맥상 허용 표현
