theological_decisions:
- issue: 내면 반응을 나타내는 히브리어 관용구의 번역 강도
  chosen_reading: '''다윗의 마음이 그를 찔렀으니''로 옮겨, 단순한 감정이 아니라 도덕적 자책의 강한 압박을 드러냈습니다.'
  alternative_readings:
  - '''다윗이 양심의 가책을 느꼈습니다'''
  - '''다윗의 마음이 아팠습니다'''
  rationale: 원문은 '마음'이 다윗을 가격하는 강한 관용구이므로, 이를 완화해 심리 묘사로만 바꾸지 않고 본문의 충격을 유지하는 것이 적절합니다.
  doctrine_reference: 양심과 죄책의 내적 책망(잠 20:27; 롬 2:15)
