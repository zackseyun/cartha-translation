  text: Afterward David’s heart struck him because he had cut off the corner of Saul’s robe[a][b].
  footnotes:
  - marker: a
    text: 'Hebrew: ''David’s heart struck him,'' an idiom expressing a troubled conscience.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the edge' or 'the hem' of Saul’s robe; Hebrew 'corner' can refer to an extremity of a garment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후에 다윗의 마음이 그를 찔렀으니, 이는 그가 사울의 겉옷 끝자락을 잘랐기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 '다윗의 마음이 그를 쳤다'는 뜻의 관용구로, 양심의 가책을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: '''칸프(כָּנָף)''는 옷의 ''끝'' 또는 ''자락''을 뜻할 수 있으므로, 여기서는 사울의 옷자락으로 이해할 수 있습니다.'
    reason: lexical_alternative
