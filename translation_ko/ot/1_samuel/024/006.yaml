translation:
  language: ko
  text: 그 후에 다윗은 사울의 겉옷 자락을[b] 잘랐기 때문에 마음에 찔림을 받았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘다윗의 마음이 그를 쳤다’입니다. 이는 양심의 가책이나 내적인 책망을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘카나프(כָּנָף)’는 옷의 끝, 귀퉁이, 가장자리 또는 자락을 가리킬 수 있습니다.
    reason: lexical_alternative
