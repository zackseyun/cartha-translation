translation:
  language: ko
  text: 옛 사람들의 속담이 말하듯이[a] “악한 자에게서 악이 나옵니다.” 그러나 내 손은 당신에게 닿지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “옛 사람들의 속담이 말합니다.” 히브리어 형용사는 '옛' 또는 '옛 사람들의'로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁל הַקַּדְמֹנִי
  english_pob_choice: the ancient proverb
  chosen_korean: 옛 사람들의 속담
  alternatives_korean:
  - 옛 속담
  - 옛 선인들의 격언
  - 고대의 속담
  lexicon: HALOT
  rationale: מְשַׁל은 지혜 문맥의 짧은 격언·속담이고, הַקַּדְמֹנִי는 '옛/고대의' 또는 '옛 사람들의'로 읽을 수 있어 한국어에서는 두 가능성을 함께 살린 표현이 가장 안전합니다.
- source_word: מֵרְשָׁעִים יֵצֵא רֶשַׁע
  english_pob_choice: Wickedness comes out from the wicked
  chosen_korean: 악한 자에게서 악이 나옵니다
  alternatives_korean:
  - 악이 악한 자에게서 나옵니다
  - 악이 악인에게서 나옵니다
  - 악행은 악인에게서 나옵니다
  lexicon: HALOT
  rationale: מִן은 출처를 나타내므로 '에게서'로 살렸고, רֶשַׁע는 문맥상 추상명사 '악'으로 옮겨 속담의 핵심 대구를 자연스럽게 전달했습니다.
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  english_pob_choice: but my hand will not be against you
  chosen_korean: 그러나 내 손은 당신에게 닿지 않을 것입니다
  alternatives_korean:
  - 그러나 내 손은 당신을 해치지 않을 것입니다
  - 그러나 내 손은 당신에게 있지 않을 것입니다
  - 그러나 내 손은 당신을 치지 않을 것입니다
  lexicon: HALOT
  rationale: 직역하면 '내 손이 당신에게 있지 않을 것이다'이므로, 손을 통한 해침의 관용을 현대 한국어에서 가장 분명하게 드러내는 '닿지 않을 것입니다'를 택했습니다.
- source_word: יֹאמַר
  english_pob_choice: says
  chosen_korean: 말하듯이
  alternatives_korean:
  - 말합니다
  - 말하듯
  - 말하는 것처럼
  lexicon: HALOT
  rationale: 여기서는 현재형 인용 도입이므로 한국어에서도 속담 인용을 여는 보조적 표현으로 처리해 시제보다 인용 기능을 살렸습니다.
theological_decisions:
- issue: 다윗이 사울에게 손을 대지 않겠다는 표현의 강도
  chosen_reading: 직접적 폭력뿐 아니라 해침의 의도 자체를 배제하는 뜻으로 읽어 '닿지 않을 것입니다'로 옮겼습니다.
  alternative_readings:
  - 해치지 않을 것입니다
  - 치지 않을 것입니다
  rationale: 문맥상 다윗은 사울을 공격할 기회를 가졌지만 하지 않겠다고 맹세하므로, 손의 이미지와 비적대성을 함께 살리는 번역이 적절합니다.
  doctrine_reference: 본문 맥락의 윤리적 진술
