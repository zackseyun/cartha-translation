  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּה֙ הִנֵּ֣ה יָדַ֔עְתִּי כִּ֥י מָלֹ֖ךְ תִּמְל֑וֹךְ וְ/קָ֨מָה֙ בְּ/יָ֣דְ/ךָ֔ מַמְלֶ֖כֶת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/021.yaml
  text: And now, look, I know that you will surely reign, and the kingdom of Israel will be established in your hand.
translation:
  language: ko
  text: 그리고 이제 보십시오, 내가 당신이 반드시 다스리게 될 것을 압니다. 또한 이스라엘의 왕국이 당신의 손에 굳게 설 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה֙ הִנֵּ֣ה
  english_pob_choice: And now, look
  chosen_korean: 그리고 이제 보십시오
  alternatives_korean:
  - 이제 보십시오
  - 그리고 이제 보라
  lexicon: וְ + עַתָּה + הִנֵּה
  rationale: 시간 전환(이제)과 주의 환기(보십시오)를 함께 살리되, 영어 POB의 'look'을 한국어 합쇼체의 자연스러운 관용으로 옮겼습니다.
- source_word: מָלֹ֖ךְ תִּמְל֑וֹךְ
  english_pob_choice: you will surely reign
  chosen_korean: 당신이 반드시 다스리게 될
  alternatives_korean:
  - 당신이 반드시 왕이 되실
  - 당신이 반드시 통치하실
  lexicon: מָלַךְ
  rationale: 동사 어근의 왕권 행사 의미를 살리면서, 반복형으로 강조된 확실성은 '반드시'로 옮겼습니다.
- source_word: וְקָ֨מָה ... מַמְלֶ֖כֶת יִשְׂרָאֵֽל
  english_pob_choice: the kingdom of Israel will be established
  chosen_korean: 이스라엘의 왕국이 ... 굳게 설 것입니다
  alternatives_korean:
  - 이스라엘 왕국이 세워질 것입니다
  - 이스라엘 나라가 서게 될 것입니다
  lexicon: מַמְלָכָה
  rationale: מַמְלָכָה를 단순히 '나라'보다 왕권을 지닌 '왕국'으로 직역에 가깝게 유지하고, קום의 완료적 의미는 '굳게 서다'로 살렸습니다.
- source_word: בְּיָדְךָ
  english_pob_choice: in your hand
  chosen_korean: 당신의 손에
  alternatives_korean:
  - 당신 손안에
  - 당신의 권세 아래
  lexicon: יָד
  rationale: 히브리어 '손'의 통치·소유 비유를 유지해, 권력의 귀속을 직접적으로 드러냈습니다.
theological_decisions:
- issue: 왕권의 확실성과 수동적 성취
  chosen_reading: 사울의 고백을 따라, 왕권은 다윗의 능력이 아니라 야훼의 섭리 아래 반드시 성립된다는 의미를 살렸습니다.
  alternative_readings:
  - 단순 예언 선언으로만 읽기
  - 정치적 승인 정도로 약화시키기
  rationale: 반복 동사와 '굳게 서다'는 표현이 미래의 확정성과 성취를 강하게 드러내므로, 그 뉘앙스를 약화하지 않았습니다.
  doctrine_reference: 섭리, 왕권의 신적 확증
