base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/002.yaml
  text: When Saul returned from pursuing the Philistines, they told him, saying, “Look, David is in the wilderness of En-gedi.”
translation:
  language: ko
  text: 사울이 블레셋 사람들을 추격하다가 돌아오자, 그들이 그에게 말했습니다. 「보십시오, 다윗이 엔게디 광야에 있습니다.」[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘블레셋 사람들을 추격하다가’는 מֵאַחֲרֵי פְּלִשְׁתִּים의 사건 배경을 풀어 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיַּגִּדוּ לֹו לֵאמֹר
  english_pob_choice: they told him, saying
  chosen_korean: 그들이 그에게 말했습니다
  alternatives_korean:
  - 사람들이 그에게 알려 말했습니다
  - 그에게 보고하며 말했습니다
  lexicon: נגד
  rationale: 히브리어 동사 הִגִּיד 계열은 단순한 정보 전달을 뜻하므로, 과도한 공식성 없이 자연스러운 「말했습니다」로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이봐
  lexicon: הנה
  rationale: 독자에게 시선을 돌리게 하는 감탄사이므로, 현대 한국어에서 정중하면서도 직접적인 「보십시오」가 가장 적절합니다.
- source_word: בְּמִדְבַּר עֵין גֶּדִי
  english_pob_choice: in the wilderness of En-gedi
  chosen_korean: 엔게디 광야에
  alternatives_korean:
  - 엔게디의 광야에
  - 엔게디 사막에
  lexicon: מדבר + toponym
  rationale: בְּמִדְבַּר는 단순한 황무지보다 성경 지리 용례에서의 「광야」가 더 정확하며, 고유지명은 음역해 보존했습니다.
theological_decisions:
- issue: 사울이 무엇을 추격했는지의 서술 방식
  chosen_reading: 「블레셋 사람들을 추격하다가 돌아오자」로, 전쟁 행위의 종료와 귀환을 평이하게 서술했습니다.
  alternative_readings:
  - 「블레셋 사람들 뒤에서 돌아오자」
  - 「블레셋 사람들을 따라 돌아오자」
  rationale: 히브리어 מֵאַחֲרֵי는 추격의 배경을 나타내므로, 원문의 진행 상황을 가장 자연스럽게 드러내는 한국어 표현을 택했습니다.
  doctrine_reference: 서술문 해석
