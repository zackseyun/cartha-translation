  yaml_path: translation/ot/1_samuel/024/008.yaml
  text: David restrained his men with words and did not allow them to rise up against Saul[a]. Then Saul rose from the cave and went on his way.
  footnotes:
  - marker: a
    text: Or 'David rebuked his men sharply with words.' The Hebrew verb is rare and may carry a stronger sense than simple restraint.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 말로 자기 부하들을 제지했습니다[a]. 그리고 그들이 사울에게 맞서 일어서지 못하게 했습니다. 사울은 굴에서 일어나 제 갈 길을 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “말로 자기 부하들을 심하게 꾸짖었습니다.” 이 히브리어 동사는 드물며, 단순한 제지보다 더 강한 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁסַּע
  english_pob_choice: restrained
  chosen_korean: 제지하고
  alternatives_korean:
  - 억세게 꾸짖고
  - 강하게 말려
  lexicon: HALOT
  rationale: 난해한 동사를 문맥상 다윗이 부하들의 공격 행동을 실제로 막은 것으로 보아, 강한 말의 개입을 담되 과도한 해석을 피하는 동사로 옮겼습니다.
- source_word: אֲנָשָׁיו
  english_pob_choice: his men
  chosen_korean: 그의 사람들을
  alternatives_korean:
  - 부하들을
  - 남자들을
  lexicon: HALOT
  rationale: 사울을 해치려는 다윗의 동료 집단을 가리키므로 직역적인 '사람들'을 쓰되, 소속 관계는 '그의'로 분명히 했습니다.
- source_word: לָקוּם אֶל־שָׁאוּל
  english_pob_choice: to rise up against Saul
  chosen_korean: 사울에게 일어나지 못하게
  alternatives_korean:
  - 사울에게 맞서 일어나지 못하게
  - 사울을 치러 일어나지 못하게
  lexicon: HALOT
  rationale: קום + אל이 이 문맥에서는 적대적 행동 개시를 뜻하므로, 한국어에서도 '일어나다'의 이미지를 살리면서 대상은 '-에게'로 표시했습니다.
- source_word: וַיֵּלֶךְ בַּדָּרֶךְ
  english_pob_choice: went on his way
  chosen_korean: 자기 길을 갔습니다
  alternatives_korean:
  - 길을 떠났습니다
  - 길을 가 버렸습니다
  lexicon: HALOT
  rationale: 직역의 '그 길로 갔다'보다 서술 흐름상 사울의 떠남을 자연스럽게 보여 주는 표현으로, 원문의 이동·이탈 의미를 유지했습니다.
theological_decisions:
- issue: 사울을 죽일 기회와 다윗의 절제 사이의 긴장 표현
  chosen_reading: 다윗이 말로 부하들의 행동을 실제로 막았다는 점을 분명히 드러냈습니다.
  alternative_readings:
  - 다윗이 단지 꾸짖기만 했다는 식으로 약화할 수 있음
  - 과장하여 폭력적으로 제압했다고 읽을 수 있음
  rationale: 본문의 핵심은 다윗의 즉각적인 폭력 자제와 사울에 대한 태도이므로, 과장도 약화도 피하고 제지의 실질적 효과를 살렸습니다.
  doctrine_reference: 사울에 대한 다윗의 비보복성과 절제
- issue: 동작의 연속성 표현
  chosen_reading: '''그러자''로 사울의 퇴장을 앞선 제지와 긴밀하게 연결했습니다.'
  alternative_readings:
  - '''그 후'''
  - '''그리고'''
  rationale: 히브리어 서술의 순차성을 보존하여, 다윗의 제지와 사울의 이탈이 한 장면 안에서 이어짐을 드러냈습니다.
  doctrine_reference: 내러티브 연속성
