base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/013.yaml
  text: May Yahweh judge between me and you[a], and may Yahweh avenge me on you[c][b]; but my hand will not be against you.
  footnotes:
  - marker: a
    text: Or, 'and may the LORD take vengeance for me on you.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and my hand shall not be against you,' a Hebrew expression for refraining from hostile action.
    reason: cultural_note
  - marker: c
    text: Or 'avenge me against you'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼께서 나와 당신 사이를 판단하시고, 야훼께서 나를 위하여 당신에게 보복하시기를 바랍니다. 그러나 나는 당신에게 손을 대지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 손이 당신에게 있지 않을 것입니다’입니다. 이는 직접적인 적대 행위나 위해를 가하지 않겠다는 뜻의 히브리어 관용 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׁפֹּט
  english_pob_choice: May ... judge
  chosen_korean: 판단하시기를 바랍니다
  alternatives_korean:
  - 판결하시기를 바랍니다
  - 재판하시기를 바랍니다
  lexicon: BDB / HALOT
  rationale: יִשְׁפֹּט의 청원적 용법을 살려 단순 미래가 아니라 야훼께 판단을 구하는 뜻으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC / 공용 번역 관행
  rationale: 표제어의 본문 관례에 따라 신명기를 고유명사로 직접 옮겨, 호칭 대체가 아닌 이름 자체를 드러냈습니다.
- source_word: וּנְקָמַנִי מִמֶּךָּ
  english_pob_choice: and may Yahweh avenge me on you
  chosen_korean: 야훼께서 당신에게서 나를 위해 원수를 갚으시기를 바랍니다
  alternatives_korean:
  - 야훼께서 당신에게 원수를 갚으시기를 바랍니다
  - 야훼께서 당신에 대해 나를 변호하시기를 바랍니다
  lexicon: HALOT
  rationale: נקם의 핵심은 보복/원수 갚음이므로 이를 약화하지 않고, מִמֶּךָּ의 방향성을 한국어에서 자연스럽게 풀어 옮겼습니다.
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  english_pob_choice: but my hand will not be against you
  chosen_korean: 그러나 내 손은 당신에게 닿지 않을 것입니다
  alternatives_korean:
  - 그러나 내 손은 당신에게 있지 않을 것입니다
  - 그러나 내 손은 당신을 치지 않을 것입니다
  lexicon: HALOT
  rationale: ‘손’의 관용적 폭력을 한국어에서 직설적이되 과도하게 해설하지 않기 위해, 실제 위해를 가하지 않겠다는 뜻을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 야훼의 직접적 심판과 다윗의 비보복 선언의 대비
  chosen_reading: 본문의 긴장을 살려, 야훼의 판단/보복과 다윗 자신의 손이 닿지 않는다는 대조를 그대로 유지했습니다.
  alternative_readings:
  - 야훼께서 나를 변호하시기를 바랍니다
  - 내가 직접 갚지 않겠습니다
  rationale: 이 절은 다윗의 개인적 복수 포기와 야훼의 न्याय 행위를 병치합니다. 이를 하나의 추상적 ‘변호’로 완화하면 מקור의 신학적 대비가 약해집니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
