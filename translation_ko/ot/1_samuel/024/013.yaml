  source_fidelity: 히브리어의 두 청원형 동사(‘판단하시고’, ‘보복하시기를’)와 마지막의 다윗 자신의 비가해 선언은 대체로 반영되었습니다. 다만 ‘당신에게서 나를 위해 원수를 갚으시기를’은 מִמֶּךָּ의 대상 관계를 한국어에서 부자연스럽게 처리하며, ‘원수를 갚다’의 목적 관계도 모호하게 만듭니다.
  naturalness: ‘당신에게서 나를 위해 원수를 갚으시기를 바랍니다’는 현대 표준어에서 어색합니다. ‘나를 위하여 당신에게 보복하시기를 바랍니다’가 원문의 보복 대상을 분명하고 자연스럽게 나타냅니다. 마지막 절은 ‘나는 당신에게 손을 대지 않을 것입니다’가 히브리어의 ‘손’ 관용어를 유지하면서도 자연스럽습니다.
  terminology: ‘야훼’는 제시된 번역 원칙과 일치합니다. נקם은 ‘보복하다’로 옮겨 보복의 강도를 약화하지 않았습니다. ‘판단하다’도 בין...ובין의 재판적 관계에 적절합니다.
