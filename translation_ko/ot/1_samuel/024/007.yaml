  edition: WLC
  text: וַ/יֹּ֨אמֶר לַ/אֲנָשָׁ֜י/ו חָלִ֧ילָ/ה לִּ֣/י מֵֽ/יהוָ֗ה אִם אֶעֱשֶׂה֩ אֶת הַ/דָּבָ֨ר הַ/זֶּ֤ה לַֽ/אדֹנִ/י֙ לִ/מְשִׁ֣יחַ יְהוָ֔ה לִ/שְׁלֹ֥חַ יָדִ֖/י בּ֑/וֹ כִּֽי מְשִׁ֥יחַ יְהוָ֖ה הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/007.yaml
  text: And he said to his men[a], “Far be it from me, because of Yahweh, that I should do this thing to my lord, Yahweh’s anointed, to stretch out my hand against him, for he is Yahweh’s anointed.”
  footnotes:
  - marker: a
    text: Or, more traditionally, “The LORD forbid that I should do this.” The Hebrew idiom literally expresses strong abhorrence at such an act in relation to the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 자기 부하들에게 말했습니다. “야훼로 말미암아, 내가 내 주, 곧 야훼의 기름부음 받은 이에게 이런 일, 곧 그에게 손을 뻗는 일을 하는 것은 결코 있을 수 없습니다[a]. 그는 야훼의 기름부음 받은 이이기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보다 전통적으로는 ‘야훼께서 금하신다’로 옮길 수 있습니다. 히브리어 관용구는 야훼와 관련하여 그러한 행위를 단호히 물리치는 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיְהוָה
  english_pob_choice: Far be it from me, because of Yahweh
  chosen_korean: 야훼로 말미암아 … 결코 있을 수 없습니다
  alternatives_korean:
  - 야훼 때문에는 안 됩니다
  - 야훼 앞에서 감히 그러지 못합니다
  lexicon: HALOT
  rationale: חָלִילָה는 강한 혐오·거부를 나타내는 관용구이므로, 단순 금지보다 거절의 강도를 살린 표현으로 옮겼습니다. מִן + יהוה는 ‘야훼로 말미암아’로 받아, 다윗의 거절이 야훼에 대한 경외에서 나온다는 점을 보존했습니다.
- source_word: הַדָּבָר הַזֶּה
  english_pob_choice: this thing
  chosen_korean: 이것
  alternatives_korean:
  - 이 일
  - 이 행동
  lexicon: HALOT
  rationale: 지시되는 행동을 가리키는 넓은 דבר의 범위를 살리기 위해 너무 특정하지 않은 ‘이것’을 사용했습니다.
- source_word: לַאדֹנִי
  english_pob_choice: to my lord
  chosen_korean: 내 주
  alternatives_korean:
  - 주인님
  - 나의 주인
  lexicon: HALOT
  rationale: 사울에 대한 존칭 표현이므로 관계를 직접 드러내는 ‘내 주’로 옮겼습니다. 한국어에서 자연스러우면서도 원문의 공손함을 유지합니다.
- source_word: לִמְשִׁיחַ יְהוָה
  english_pob_choice: Yahweh’s anointed
  chosen_korean: 야훼의 기름부음 받은 이
  alternatives_korean:
  - 야훼의 메시아
  - 야훼의 기름부음받은 자
  lexicon: HALOT
  rationale: 여기서는 사울의 왕적 성별 상태를 가리키므로, 후대의 그리스도론적 함의를 덜어내는 대신 직역에 가까운 ‘기름부음 받은 이’를 택했습니다. POB의 주해처럼 왕에게 적용된 칭호로 이해되도록 했습니다.
- source_word: לִשְׁלֹחַ יָדִי בּוֹ
  english_pob_choice: to stretch out my hand against him
  chosen_korean: 그에게 손을 대어 해치지 않겠습니다
  alternatives_korean:
  - 그에게 손을 뻗어 대적하지 않겠습니다
  - 그를 치려고 손을 뻗지 않겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 폭력적 함의를 한국어에서 자연스럽게 드러내기 위해 ‘손을 대다’에 ‘해치다’를 결합했습니다. 단순한 접촉이 아니라 해를 끼치는 행동이라는 맥락을 분명히 했습니다.
theological_decisions:
- issue: יְהוָה를 한국어에서 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 고유한 신명(神名)을 가리는 번역어 대신 음역을 유지하여, 원문이 가진 인격적·역사적 호칭을 보존했습니다. POB의 기본 원칙과도 일치합니다.
  doctrine_reference: 'POB glossary: YHWH / יְהוָה'
- issue: מְשִׁיחַ의 왕적 의미를 어떻게 처리할지
  chosen_reading: 야훼의 기름부음 받은 이
  alternative_readings:
  - 야훼의 메시아
  - 야훼의 기름부음받은 자
  rationale: 사울에게는 후대적 메시아 칭호보다 ‘기름부음 받은 이’가 원문의 왕적·성별적 의미를 더 정확히 전달합니다. 다윗이 사울을 해치지 않으려는 이유가 정치적 존중이 아니라 야훼의 성별하심에 근거함을 드러냅니다.
  doctrine_reference: POB contested terms principle; English theological decision on מְשִׁיחַ
- issue: 관용구 חָלִילָה לִּי의 정서적 강도
  chosen_reading: 결코 있을 수 없습니다
  alternative_readings:
  - 절대 그럴 수 없습니다
  - 그럴 리 없습니다
  rationale: 직역보다 한국어에서 자연스러운 강한 거절로 옮겨, 다윗의 도덕적·신학적 반응의 강도를 유지했습니다. 다만 지나치게 회화적으로 흐르지 않도록 공적 문체를 유지했습니다.
  doctrine_reference: Translation philosophy §2
