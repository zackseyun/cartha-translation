  source_fidelity: 히브리어의 맹세 요청(‘야훼를 두고 내게 맹세하십시오’)과 두 개의 병렬적인 부정 서약 내용이 전반적으로 잘 반영되었습니다. 다만 현행 ‘맹세하여, … 말고, …지 마십시오’는 맹세의 내용을 직접 금지 명령으로 바꾸어 놓고 문장 연결도 다소 불안정합니다. 한국어에서는 ‘…않겠다고 맹세하십시오’로 서약 내용을 명시하는 편이 원문의 화행과 구조에 더 충실합니다.
  naturalness: ‘내 뒤에 내 자손을’은 현대 한국어에서 다소 어색하므로 ‘내가 죽은 뒤에’가 자연스럽습니다. 또한 ‘내 아버지의 집’은 직역으로 이해 가능하지만, 이 문맥의 부계 가문·가계를 한국어로 자연스럽게 드러내려면 ‘내 아버지 집안’이 적절합니다.
