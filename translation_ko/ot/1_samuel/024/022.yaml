source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּׁ֤בְעָ/ה לִּ/י֙ בַּֽ/יהוָ֔ה אִם תַּכְרִ֥ית אֶת זַרְעִ֖/י אַֽחֲרָ֑/י וְ/אִם תַּשְׁמִ֥יד אֶת שְׁמִ֖/י מִ/בֵּ֥ית אָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/022.yaml
  text: Now swear to me by Yahweh that you will not cut off my descendants after me[c][b][a], and that you will not wipe out my name from my father's house.
  footnotes:
  - marker: a
    text: Hebrew literally uses 'if' in the oath formula; in context it introduces the content Saul asks David to swear, hence 'that ... not.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my offspring.'
    reason: lexical_alternative
  - marker: c
    text: '''My name'' here refers to Saul''s remembered family line or standing within his clan.'
    reason: cultural_note
translation:
  language: ko
  text: 이제 야훼를 두고 내게 맹세하여, 내 뒤에 내 자손을 끊지 말고, 내 아버지의 집에서 내 이름을 지우지 마십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 맹세 공식에서 ‘만일’(if)을 쓰지만, 여기서는 사울이 다윗에게 맹세시키는 내용이므로 ‘…말고 / …지 마십시오’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: ‘자손’은 여기서 문자 그대로의 씨앗이 아니라 후손, 곧 왕조적 계승을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘이름’은 단순 호칭이 아니라 가문 안에서 기억되고 인정되는 지위와 명성을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 담화 전환을 여는 말로, 현대 한국어에서는 ‘이제’가 가장 자연스럽고 압축적으로 요청의 전환점을 드러냅니다.
- source_word: הִשָּׁבְעָה לִּי בַּיהוָה
  english_pob_choice: swear to me by Yahweh
  chosen_korean: 야훼를 두고 내게 맹세하여
  alternatives_korean:
  - 야훼로 내게 맹세하여
  - 야훼의 이름으로 내게 맹세하여
  lexicon: HALOT
  rationale: 히트파엘/니팔 계열의 맹세 관용구를 한국어에서는 ‘맹세하다’로 옮기되, מקור의 고유명칭을 보존하기 위해 ‘야훼를 두고’라고 직역에 가깝게 처리했습니다.
- source_word: אִם ... וְאִם
  english_pob_choice: that ... and that
  chosen_korean: …말고, …지 마십시오
  alternatives_korean:
  - …하지 않도록
  - …하지 말라고
  lexicon: HALOT
  rationale: 히브리어 맹세문에서의 אִם은 단순 조건이 아니라 서약 내용의 도입이므로, 한국어에서는 요청받는 금지 내용으로 자연스럽게 풀어야 합니다.
- source_word: תַּכְרִית אֶת זַרְעִי אַחֲרַי
  english_pob_choice: you will not cut off my descendants after me
  chosen_korean: 내 뒤에 내 자손을 끊지 말고
  alternatives_korean:
  - 내 뒤에 내 후손을 끊지 말고
  - 내 뒤에 내 씨를 끊지 말고
  lexicon: HALOT
  rationale: כרת의 ‘끊다’ 이미지를 살리면서, זרע는 문맥상 왕조/가계의 후손이므로 ‘자손’이 가장 분명합니다.
- source_word: תַּשְׁמִיד אֶת שְׁמִי מִבֵּית אָבִי
  english_pob_choice: you will not wipe out my name from my father's house
  chosen_korean: 내 아버지의 집에서 내 이름을 지우지 마십시오
  alternatives_korean:
  - 내 아버지의 집에서 내 이름을 없애지 마십시오
  - 내 아버지의 집에서 내 이름을 없애버리지 마십시오
  lexicon: HALOT
  rationale: שמד의 파괴/말살 이미지를 한국어에서는 ‘지우다’로 옮겨, 기억과 가계에서의 삭제라는 뜻을 함께 드러냈습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 여호와 칭호가 아니라 언약명의 직접 사용이므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
