revisions:
- from: “아버님, 보십시오. 제 손에 당신의 겉옷 자락이 있지 않습니까? 제가 당신의 겉옷 자락을 베었어도 당신을 죽이지 않았습니다. 알아보시고 보십시오. 내 손에는 악이나 반역이 없으며, 제가 당신에게 죄를 짓지 않았습니다. 그런데도 당신은 제 생명을 사냥하여 빼앗으려 하고 계십니다.”[a][b]
  to: “아버님, 보십시오. 참으로 보십시오. 제 손에 아버님의 겉옷 자락[a]이 있습니다. 제가 아버님의 겉옷 자락을 잘라 내고도 아버님을 죽이지 않았습니다. 알아보시고 보십시오. 제 손에는 악이나 반역[b]이 없고, 제가 아버님께 죄를 짓지 않았습니다. 그런데도 아버님께서는 제 목숨을 빼앗으려고 사냥하고 계십니다.”
  rationale: 원문의 반복적 촉구와 설명적 논리를 살리고, 직접 호칭의 공손한 일관성과 현대 한국어의 자연스러운 문장을 보완했습니다. 기존 각주의 부정확한 지시 대상을 바로잡고, פֶשַׁע의 문맥상 가능한 의미 범위는 각주로 보존했습니다.
