source:
  edition: WLC
  text: וְ/אָבִ֣/י רְאֵ֔ה גַּ֗ם רְאֵ֛ה אֶת כְּנַ֥ף מְעִילְ/ךָ֖ בְּ/יָדִ֑/י כִּ֡י בְּ/כָרְתִ/י֩ אֶת כְּנַ֨ף מְעִֽילְ/ךָ֜ וְ/לֹ֣א הֲרַגְתִּ֗י/ךָ דַּ֤ע וּ/רְאֵה֙ כִּי֩ אֵ֨ין בְּ/יָדִ֜/י רָעָ֤ה וָ/פֶ֨שַׁע֙ וְ/לֹא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֛ה צֹדֶ֥ה אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/012.yaml
  text: And[a], my father, see—yes, see the corner of your robe in my hand. For when I cut off the corner of your robe[b], I did not kill you. Know and see that there is no evil or transgression in my hand, and I have not sinned against you[c], though you are hunting my life to take it.
  footnotes:
  - marker: a
    text: Or 'the edge of your robe' or 'the skirt of your robe.'
    reason: lexical_alternative
  - marker: b
    text: Or 'there is no evil or transgression in my hand.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'you are hunting my life to take it.'
    reason: lexical_alternative
translation:
  language: ko
  text: “아버님, 보십시오. 참으로 보십시오. 제 손에 아버님의 겉옷 자락[a]이 있습니다. 제가 아버님의 겉옷 자락을 잘라 내고도 아버님을 죽이지 않았습니다. 알아보시고 보십시오. 제 손에는 악이나 반역[b]이 없고, 제가 아버님께 죄를 짓지 않았습니다. 그런데도 아버님께서는 제 목숨을 빼앗으려고 사냥하고 계십니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘자락’은 옷의 ‘가장자리’ 또는 ‘끝자락’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘허물’, ‘범죄’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבִי
  english_pob_choice: And, my father
  chosen_korean: 아버님
  alternatives_korean:
  - 제 아버지여
  - 아버지여
  - 아버님, 그리고
  lexicon: HALOT
  rationale: 사울을 향한 다윗의 호칭은 친밀한 혈연 표현이면서도 왕 앞의 극존대를 겸하므로, 현대 한국어에서는 자연스럽고 공손한 ‘아버님’이 가장 적절합니다.
- source_word: רְאֵה גַּם רְאֵה
  english_pob_choice: see—yes, see
  chosen_korean: 보십시오
  alternatives_korean:
  - 보십시오, 보십시오
  - 보시고 또 보십시오
  - 살펴보십시오
  lexicon: HALOT
  rationale: 반복 강조를 한국어에서 동일어 반복으로만 살리면 어색해질 수 있어, 공손한 명령형 ‘보십시오’ 안에 촉구의 힘을 담고 앞뒤 문맥으로 강조를 보완했습니다.
- source_word: כְּנַף מְעִילְךָ
  english_pob_choice: the corner of your robe
  chosen_korean: 당신의 겉옷 자락
  alternatives_korean:
  - 당신의 옷자락
  - 당신의 겉옷 가장자리
  - 당신의 겉옷 끝자락
  lexicon: HALOT
  rationale: כָּנָף는 옷의 ‘가장자리/자락’이며, מְעִיל은 여기서 겉옷이므로 ‘겉옷 자락’이 물리적 증거를 가장 자연스럽게 전달합니다.
- source_word: אֵין בְּיָדִי רָעָה וָפֶשַׁע
  english_pob_choice: there is no evil or rebellion in my hand
  chosen_korean: 내 손에는 악이나 반역이 없으며
  alternatives_korean:
  - 내 손에는 악이나 죄가 없으며
  - 내 손에는 악이나 범죄가 없으며
  - 내 손에는 악이나 허물이 없으며
  lexicon: HALOT
  rationale: ‘in my hand’의 행위/책임 표현을 살리고, פֶּשַׁע는 여기서 왕에 대한 정치적 충돌 뉘앙스가 있어 ‘반역’이 문맥을 가장 잘 드러냅니다.
- source_word: וְלֹא חָטָאתִי לָךְ
  english_pob_choice: and I have not sinned against you
  chosen_korean: 제가 당신에게 죄를 짓지 않았습니다
  alternatives_korean:
  - 제가 당신에게 죄를 범하지 않았습니다
  - 제가 당신에게 잘못하지 않았습니다
  lexicon: HALOT
  rationale: חטא + ל의 대인(對人) 관계를 ‘죄를 짓다’로 옮겨 도덕적·관계적 무게를 유지했습니다.
- source_word: וְאַתָּה צֹדֶה אֶת נַפְשִׁי לְקַחְתָּהּ
  english_pob_choice: though you are hunting my life to take it
  chosen_korean: 당신은 제 생명을 사냥하여 빼앗으려 하고 계십니다
  alternatives_korean:
  - 당신은 제 생명을 노리고 계십니다
  - 당신은 제 목숨을 사냥하고 계십니다
  - 당신은 제 생명을 노려 빼앗으려 하고 계십니다
  lexicon: HALOT
  rationale: צדה의 사냥 이미지를 살리되 한국어에서 목적을 분명히 하기 위해 ‘사냥하여 빼앗으려’로 풀었습니다. נֶפֶשׁ는 여기서 ‘생명’이 가장 적절합니다.
theological_decisions:
- issue: 다윗의 항변에서 פֶּשַׁע의 성격
  chosen_reading: ‘반역’으로 번역해 사울 왕에 대한 정치적 충돌과 하나님이 세우신 왕권에 대한 침해 가능성을 함께 드러냅니다.
  alternative_readings:
  - 죄
  - 허물
  - 범죄
  rationale: 문맥상 다윗은 단순한 개인적 무죄만이 아니라, 왕을 해치려는 반역의 의도가 없음을 변증하고 있으므로 ‘반역’이 가장 충분합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
