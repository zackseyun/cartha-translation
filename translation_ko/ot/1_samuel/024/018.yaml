  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל דָּוִ֔ד צַדִּ֥יק אַתָּ֖ה מִמֶּ֑/נִּי כִּ֤י אַתָּה֙ גְּמַלְתַּ֣/נִי הַ/טּוֹבָ֔ה וַ/אֲנִ֖י גְּמַלְתִּ֥י/ךָ הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/018.yaml
  text: And he said to David[a], “You are more righteous than I, for you have repaid me with good, while I have repaid you with evil.”
  footnotes:
  - marker: a
    text: Or, “You are more in the right than I.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 다윗에게 말했습니다. “당신은 나보다 더 의롭습니다. 당신은 나에게 선으로 갚았지만, 나는 당신에게 악으로 갚았습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “당신은 나보다 더 옳습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק אַתָּה מִמֶּנִּי
  english_pob_choice: You are more righteous than I
  chosen_korean: 당신은 나보다 더 의롭습니다
  alternatives_korean:
  - 당신은 나보다 더 옳습니다
  - 당신은 나보다 더 의롭습니다 / 당신은 나보다 더 옳습니다
  lexicon: HALOT
  rationale: צַדִּיק의 핵심은 도덕적·관계적 ‘의로움’ 또는 ‘옳음’이므로, 본문 흐름에서 가장 자연스럽고 POB의 ‘more righteous than I’를 잘 옮기는 ‘더 의롭습니다’를 택했습니다.
- source_word: גְּמַלְתַּנִי הַטּוֹבָה
  english_pob_choice: you have repaid me with good
  chosen_korean: 당신은 나에게 선으로 갚았지만
  alternatives_korean:
  - 당신은 나에게 좋은 것으로 갚았지만
  - 당신은 나에게 선을 베풀었지만
  lexicon: HALOT
  rationale: גמל의 반복 구조를 살리기 위해 ‘갚다’를 사용했고, הַטּוֹבָה는 단순히 ‘좋음’보다 행위의 대조가 분명한 ‘선’으로 옮겼습니다.
- source_word: וַאֲנִי גְּמַלְתִּיךָ הָרָעָה
  english_pob_choice: while I have repaid you with evil
  chosen_korean: 나는 당신에게 악으로 갚았습니다
  alternatives_korean:
  - 나는 당신에게 나쁜 것으로 갚았습니다
  - 나는 당신에게 해를 끼쳤습니다
  lexicon: HALOT
  rationale: 앞 절의 ‘선으로 갚다’와 대구를 이루도록 ‘악으로 갚다’를 대응시켰으며, הָרָעָה의 도덕적 대조를 유지했습니다.
- source_word: וַיֹּאמֶר אֶל־דָּוִד
  english_pob_choice: And he said to David
  chosen_korean: 그가 다윗에게 말했습니다
  alternatives_korean:
  - 그가 다윗에게 이르렀습니다
  - 그가 다윗에게 말하였습니다
  lexicon: HALOT
  rationale: 화자 표지가 ‘그’로만 제시되므로 문맥상 사울임을 드러내지 않고, 서사체 wayyiqtol을 현대 합쇼체의 간결한 서술로 옮겼습니다.
theological_decisions:
- issue: צַדִּיק אַתָּה מִמֶּנִּי의 비교 의미
  chosen_reading: ‘나보다 더 의롭습니다’로 옮겨, 단순한 도덕 평가와 관계적 정당성 모두를 열어 두었습니다.
  alternative_readings:
  - ‘나보다 더 옳습니다’로 옮길 수 있음
  - ‘내가 틀렸고 당신이 맞습니다’로 풀 수 있음
  rationale: 사울의 고백은 법정적 판정이라기보다 다윗의 무죄성과 사울 자신의 부당함을 인정하는 말이므로, 어느 한쪽으로 좁히지 않는 번역이 적절합니다.
  doctrine_reference: '주해적 판단: 본문 문맥상 무죄/정당성 인정'
