    rationale: 앞 문장에 동굴이 언급되므로 기존 번역도 이해 가능하지만, ‘그 동굴에 들어갔습니다’라고 하면 두 번째 וַיָּבֹא의 목적지와 사건 전개가 더 분명해집니다.
