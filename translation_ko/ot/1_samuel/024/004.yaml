  source_fidelity: 원문의 장소 이동, 동굴, 용변을 뜻하는 히브리어 관용구, 그리고 다윗과 그의 사람들이 동굴 깊숙한 곳에 앉아 있던 상황을 전반적으로 충실히 옮겼습니다. 그러나 ‘그의 մարդիկ’은 한국어 본문에 남은 비한국어 단어로서 אַנָשָׁיו(그의 사람들/부하들)를 올바르게 번역하지 못했습니다. 또한 사울이 들어간 곳이 동굴임을 명시하면 서술 연결이 더 분명해집니다.
  naturalness: ‘양 우리’, ‘용변을 보려고’, ‘동굴 가장 깊숙한 곳’은 현대 표준 한국어 합쇼체 문맥에서 자연스럽습니다. ‘그의 부하들’은 이 장면에서 다윗과 함께한 אַנָשָׁיו를 자연스럽고 문맥상 적절하게 표현합니다.
  terminology: ‘용변을 보려고’는 לְהָסֵךְ אֶת־רַגְלָיו의 완곡한 의미를 적절히 전달하며, 각주에서 문자적 관용구를 보존했습니다. ‘양 우리들’은 복수형 גִּדְרוֹת를 드러내되 한국어의 자연스러움을 유지합니다.
