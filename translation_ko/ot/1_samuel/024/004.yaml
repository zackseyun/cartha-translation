source:
  edition: WLC
  text: וַ֠/יָּבֹא אֶל גִּדְר֨וֹת הַ/צֹּ֤אן עַל הַ/דֶּ֨רֶךְ֙ וְ/שָׁ֣ם מְעָרָ֔ה וַ/יָּבֹ֥א שָׁא֖וּל לְ/הָסֵ֣ךְ אֶת רַגְלָ֑י/ו וְ/דָוִד֙ וַ/אֲנָשָׁ֔י/ו בְּ/יַרְכְּתֵ֥י הַ/מְּעָרָ֖ה יֹשְׁבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/004.yaml
  text: He came to the sheepfolds by the road[a], where there was a cave, and Saul went in to relieve himself. Now David and his men were sitting in the innermost parts of the cave.
  footnotes:
  - marker: a
    text: Literally, 'to cover his feet,' a Hebrew idiom for relieving oneself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 길가의 양 우리에 이르렀는데, 거기에 동굴이 있었습니다. 사울은 용변을 보러 들어갔고, 다윗과 그의 մարդիկ은 그 동굴의 가장 깊은 곳에 앉아 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 발을 덮으러’로, 배변 또는 배뇨를 뜻하는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּדְר֨וֹת הַ/צֹּאן
  english_pob_choice: the sheepfolds
  chosen_korean: 양 우리
  alternatives_korean:
  - 양의 우리
  - 양우리들
  - 양 치는 우리
  lexicon: HALOT
  rationale: בְּ/גִּדְרוֹת הַצֹּאן는 양을 둘러싼 울타리/우리의 뜻으로, 한국어에서는 자연스럽고 구체적인 「양 우리」가 가장 잘 맞습니다.
- source_word: עַל הַ/דֶּרֶךְ
  english_pob_choice: by the road
  chosen_korean: 길가의
  alternatives_korean:
  - 길 옆의
  - 도로 옆의
  - 길 위의
  lexicon: HALOT
  rationale: 장소를 도로와의 인접 관계로 표시하므로, 간결한 「길가의」가 영어 POB의 의미를 잘 살립니다.
- source_word: לְ/הָסֵךְ אֶת רַגְלָי/ו
  english_pob_choice: to relieve himself
  chosen_korean: 용변을 보러
  alternatives_korean:
  - 발을 가리러
  - 용변을 해결하려고
  - 볼일을 보러
  lexicon: HALOT
  rationale: 히브리어 관용구의 뜻은 배변/배뇨를 가리므로, 현대 한국어에서 의미를 분명히 하는 「용변을 보러」가 적절합니다.
- source_word: בְּ/יַרְכְּתֵ֥י הַ/מְּעָרָ֖ה
  english_pob_choice: in the innermost parts of the cave
  chosen_korean: 그 동굴의 가장 깊은 곳
  alternatives_korean:
  - 그 동굴의 안쪽 깊은 곳
  - 그 동굴의 가장 안쪽
  - 그 동굴의 깊숙한 곳
  lexicon: HALOT
  rationale: יַרְכְּתֵי는 가장 먼/안쪽의 공간을 뜻하므로, 사울의 눈에 띄지 않을 만큼 깊은 위치를 드러내는 「가장 깊은 곳」이 적합합니다.
- source_word: יֹשְׁבִים
  english_pob_choice: were sitting
  chosen_korean: 앉아 있었습니다
  alternatives_korean:
  - 있었습니다
  - 머물고 있었습니다
  - 앉아 있던 상태였습니다
  lexicon: HALOT
  rationale: 현재 그 장소에서의 자세를 묘사하므로, 서술 흐름이 자연스러운 「앉아 있었습니다」가 원문에 가깝습니다.
theological_decisions:
- issue: 히브리어 관용구의 직역 여부
  chosen_reading: 본문에는 의미역인 「용변을 보러」를 두고, 관용구의 문자적 형태는 각주로 밝히지 않았습니다.
  alternative_readings:
  - 발을 덮으러
  - 발을 가리러
  rationale: 현대 독자가 즉시 이해할 수 있는 본뜻이 중요하며, 관용구의 문자적 이미지는 본문보다 각주에서 처리하는 편이 오해를 줄입니다.
  doctrine_reference: '번역 원칙: 원문의 실제 의미를 우선 전달하되, 필요한 경우 관용 표현의 배경을 주석으로 보존'
