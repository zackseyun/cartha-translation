  rationale: 비한국어 단어 ‘մարդիկ’을 원문의 의미와 문맥에 맞는 ‘부하들’로 바로잡았습니다. 또한 사울이 동굴에 들어갔음을 명시하고, 관용구 각주 표지를 해당 표현 바로 뒤로 옮겼습니다. 그 밖의 의미와 서술 시제는 유지했습니다.
