revisions:
- from: 그는 길가의 양 우리에 이르렀는데, 거기에 동굴이 있었습니다. 사울은 용변을 보러 들어갔고, 다윗과 그의 մարդիկ은 그 동굴의 가장 깊은 곳에 앉아 있었습니다.[a]
