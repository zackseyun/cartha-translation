source:
  edition: WLC
  text: הִנֵּה֩ הַ/יּ֨וֹם הַ/זֶּ֜ה רָא֣וּ עֵינֶ֗י/ךָ אֵ֣ת אֲשֶׁר נְתָנְ/ךָ֩ יְהוָ֨ה הַ/יּ֤וֹם בְּ/יָדִ/י֙ בַּ/מְּעָרָ֔ה וְ/אָמַ֥ר לַ/הֲרָגֲ/ךָ֖ וַ/תָּ֣חָס עָלֶ֑י/ךָ וָ/אֹמַ֗ר לֹא אֶשְׁלַ֤ח יָדִ/י֙ בַּֽ/אדֹנִ֔/י כִּי מְשִׁ֥יחַ יְהוָ֖ה הֽוּא־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/011.yaml
  text: Look[a], this day your own eyes have seen that Yahweh gave you today into my hand in the cave, and I said to kill you, but I spared you. I said, ‘I will not stretch out my hand against my lord[b], for he is Yahweh’s anointed.’
  footnotes:
  - marker: a
    text: Or, 'and he said to kill you,' 'and it was said to kill you,' or 'and one said that I should kill you.' The Hebrew has an unspecified singular verb.
    reason: alternative_reading
  - marker: b
    text: Or, 'but I had pity on you.' The Hebrew verb can express sparing out of compassion.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 오늘 당신의 눈으로, 야훼께서 오늘 당신을 내 손에 넘기셨음을 이 동굴에서 보셨습니다. 그리고 사람들이 당신을 죽이라고 말했으나 나는 당신을 살려 두었습니다. 나는 말했습니다. “내가 내 주께 손을 대지 않겠습니다. 그분은 야훼의 메시아이시기 때문입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 주어가 드러나지 않은 단수 동사를 사용하므로, “그리고 그가 당신을 죽이라고 말했다”, “그리고 누군가 당신을 죽이라고 말했다” 등으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 동사는 ‘아끼다/불쌍히 여기다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  lexicon: HALOT
  rationale: 청자에게 주의를 환기하는 감탄사를 현대 한국어의 자연스러운 공손한 명령형으로 옮겨, 강조와 호소의 힘을 살렸습니다.
- source_word: רָאוּ עֵינֶיךָ
  english_pob_choice: your own eyes have seen
  chosen_korean: 당신의 눈으로 … 보셨습니다
  alternatives_korean:
  - 당신이 보셨습니다
  - 당신의 눈이 보았습니다
  lexicon: HALOT
  rationale: ‘눈’이 증인이 되는 히브리어식 강조를 보존하면서도, 한국어에서는 자연스럽게 주어를 풀어 옮겼습니다.
- source_word: וַתָּחָס עָלֶיךָ
  english_pob_choice: but I spared you
  chosen_korean: 나는 당신을 살려 두었습니다
  alternatives_korean:
  - 나는 당신에게 불쌍히 여겼습니다
  - 나는 당신을 아꼈습니다
  lexicon: HALOT
  rationale: 문맥상 다윗이 살해를 거두고 목숨을 보존한 뜻이므로, 단순한 감정보다 ‘살려 두다’가 동작을 더 직접적으로 드러냅니다.
- source_word: מְשִׁיחַ יְהוָה
  english_pob_choice: Yahweh’s anointed
  chosen_korean: 야훼의 메시아
  alternatives_korean:
  - 야훼의 기름부음 받은 자
  - 야훼의 기름부으심을 받은 자
  lexicon: HALOT
  rationale: 이 구절의 왕적 칭호를 프로젝트 기본어인 ‘메시아’로 일관되게 옮기되, ‘야훼’와의 소유 관계를 유지했습니다.
theological_decisions:
- issue: 신적 명칭 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 직접 나온 언약 이름을 프로젝트 기준에 따라 ‘야훼’로 유지해, 고유한 신적 명칭을 가리지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 직접화법에서의 호칭과 존대
  chosen_reading: 내 주께 … 그분은 야훼의 메시아이시기 때문입니다
  alternative_readings:
  - 내 주님께 … 그분은 야훼의 기름부음 받은 자이시기 때문입니다
  - 주께 … 그분은 야훼의 메시아이시기 때문입니다
  rationale: 사울을 향한 인간적 존칭은 한국어 궁정/상하 관계를 반영해 ‘내 주’로 옮기고, 후반의 신적 귀속은 서술 문체상 존대 종결을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
