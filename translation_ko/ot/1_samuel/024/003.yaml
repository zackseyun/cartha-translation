  text: וַ/יִּקַּ֣ח שָׁא֗וּל שְׁלֹ֧שֶׁת אֲלָפִ֛ים אִ֥ישׁ בָּח֖וּר מִ/כָּל יִשְׂרָאֵ֑ל וַ/יֵּ֗לֶךְ לְ/בַקֵּ֤שׁ אֶת דָּוִד֙ וַֽ/אֲנָשָׁ֔י/ו עַל פְּנֵ֖י צוּרֵ֥י הַ/יְּעֵלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/003.yaml
  text: Then Saul took three thousand chosen men from all Israel and went to seek David and his men in front of the rocks of the wild goats[a].
  footnotes:
  - marker: a
    text: Or 'the crags of the wild goats'; the animal may specifically be the ibex.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울은 온 이스라엘에서 삼천 명의 뽑힌 사람을 데리고 다윗과 그의 사람들을 찾아 나섰습니다. 그는 들염소 바위들 앞까지 갔습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘들염소의 바위들’; 이 동물은 특히 아이벡스일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 데리고 나섰습니다
  alternatives_korean:
  - 데려갔습니다
  - 취했습니다
  lexicon: HALOT
  rationale: 사울이 사람들을 단순히 ‘가졌다’기보다 원정에 함께 이끌고 갔다는 서술이므로, 군사적 이동을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ בָּחוּר
  english_pob_choice: three thousand chosen men
  chosen_korean: 삼천 명의 뽑힌 사람
  alternatives_korean:
  - 삼천 명의 선택된 사람
  - 삼천 명의 정예 병사
  lexicon: HALOT
  rationale: ‘chosen’의 선발된 성격을 살리되, 본문 자체가 ‘병사’라는 단어를 쓰지 않으므로 너무 군사 용어로 확정하지 않고 ‘뽑힌 사람’으로 옮겼습니다.
- source_word: מִכָּל יִשְׂרָאֵל
  english_pob_choice: from all Israel
  chosen_korean: 온 이스라엘에서
  alternatives_korean:
  - 온 이스라엘 가운데서
  - 이스라엘 전역에서
  lexicon: HALOT
  rationale: 선발의 범위를 전체 공동체로 분명히 보여 주는 관용적 표현으로 옮겼습니다.
- source_word: עַל פְּנֵי צוּרֵי הַיְּעֵלִים
  english_pob_choice: in front of the rocks of the wild goats
  chosen_korean: 들염소 바위들 앞까지
  alternatives_korean:
  - 들염소 바위들 앞에서
  - 들염소의 바위들 앞까지
  - 산염소 바위들 앞까지
  lexicon: HALOT
  rationale: עַל פְּנֵי를 단순한 위치 표현으로 풀어 ‘앞’으로 옮기되, 지명/지형 표현의 낯섦을 살려 ‘들염소 바위들’로 번역했습니다. ‘wild goats’는 본문이 직접 말하는 동물 이미지를 유지하는 쪽을 택했습니다.
theological_decisions:
- issue: 사울의 군사적 동원과 추적 행위의 뉘앙스
  chosen_reading: 사울은 단순히 길을 간 것이 아니라 다윗을 ‘찾아 나섰습니다’로 옮겨 추적의 목적성을 드러냈습니다.
  alternative_readings:
  - 다윗을 찾으러 갔습니다
  - 다윗을 찾기 위해 갔습니다
  rationale: 히브리어 לְבַקֵּשׁ의 목적 의미를 살려, 서술의 긴장과 의도를 약화시키지 않도록 했습니다.
  doctrine_reference: 본문 해석 원칙과 서사적 정확성
