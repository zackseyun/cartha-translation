translation:
  language: ko
  text: 그때 사울은 온 이스라엘 가운데서 뽑은 사람 삼천 명을 데리고 들염소들의 바위들 앞쪽으로 다윗과 그의 사람들을 찾으러 갔습니다[a].
  philosophy: optimal-equivalence
  footnotes:
