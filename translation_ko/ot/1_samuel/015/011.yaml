id: 1SA.15.11
reference: 1 Samuel 15:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִחַ֗מְתִּי כִּֽי הִמְלַ֤כְתִּי אֶת שָׁאוּל֙ לְ/מֶ֔לֶךְ כִּֽי שָׁב֙ מֵ/אַֽחֲרַ֔/י וְ/אֶת דְּבָרַ֖/י לֹ֣א הֵקִ֑ים וַ/יִּ֨חַר֙ לִ/שְׁמוּאֵ֔ל וַ/יִּזְעַ֥ק אֶל יְהוָ֖ה כָּל הַ/לָּֽיְלָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/011.yaml
  text: I regret that I made Saul king[a], because he has turned back from following me and has not carried out my words. And Samuel burned with anger[d][c][b], and he cried out to Yahweh all night.
  footnotes:
  - marker: a
    text: Or, 'I am sorry' or 'I relent'; Hebrew 'I regret/was moved to regret.' The wording expresses the LORD's grief over Saul's kingship.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'he has turned back from after me,' an idiom for turning away from following the LORD.
    reason: lexical_alternative
  - marker: c
    text: Or, 'has not fulfilled my words' or 'has not obeyed my words.'
    reason: lexical_alternative
  - marker: d
    text: 'Hebrew idiom: ''Samuel burned with anger.'' Some understand the sense here as grief or deep displeasure in context.'
    reason: alternative_reading
translation:
  language: ko
  text: 나는 사울을 왕으로 세운 것을 후회합니다. 이는 그가 나를 따르다가 돌아섰고 내 말을 실행하지 않았기 때문입니다. 사무엘은 분노하여 밤새 야훼께 부르짖었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 유감스럽게 여깁니다’, ‘나는 마음을 돌이킵니다’, ‘나는 철회합니다’. 히브리어는 ‘후회/유감’의 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘나를 따르는 것에서 돌아섰다’로, 야훼를 따르던 충성에서 돌아선다는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내 말을 지키지 않았다’, ‘내 말을 이루지 않았다’.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 관용구로는 ‘사무엘이 분노하였다’입니다. 문맥상 깊은 비탄이나 불쾌의 뜻으로 이해하는 견해도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נִחַמְתִּי
  english_pob_choice: I regret
  chosen_korean: 나는 …을 후회합니다
  alternatives_korean:
  - 나는 …을 유감스럽게 여깁니다
  - 나는 …을 안타깝게 여깁니다
  - 나는 …을 철회하려 합니다
  lexicon: HALOT
  rationale: 하나님의 נשׁם 형태의 רגret/후회 의미를 현대 한국어에서 자연스럽게 전달하되, 단순한 철회나 회개로 오해되지 않도록 ‘후회합니다’를 택했습니다.
- source_word: הִמְלַכְתִּי אֶת־שָׁאוּל לְמֶלֶךְ
  english_pob_choice: I made Saul king
  chosen_korean: 사울을 왕으로 세운 것
  alternatives_korean:
  - 사울을 왕으로 삼은 것
  - 사울을 왕이 되게 한 것
  - 사울을 왕으로 임명한 것
  lexicon: HALOT
  rationale: מלך의 사역형은 왕위에 세우다/임명하다의 뜻이므로, 본문 흐름에 맞는 ‘왕으로 세운 것’으로 옮겼습니다.
- source_word: שָׁב מֵאַחֲרַי
  english_pob_choice: he has turned back from following me
  chosen_korean: 그가 나를 따르다가 돌아섰고
  alternatives_korean:
  - 그가 나를 따라오던 길에서 돌아섰고
  - 그가 내 뒤를 따르다가 돌아섰고
  - 그가 나를 떠나 돌아섰고
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘뒤따름/충성’ 이미지를 살리면서도 한국어에서 자연스럽게 들리도록 ‘나를 따르다가 돌아섰고’로 옮겼습니다.
- source_word: וְאֶת־דְּבָרַי לֹא הֵקִים
  english_pob_choice: and has not carried out my words
  chosen_korean: 내 말을 실행하지 않았기 때문입니다
  alternatives_korean:
  - 내 말을 지키지 않았기 때문입니다
  - 내 말을 이루지 않았기 때문입니다
  - 내 말을 수행하지 않았기 때문입니다
  lexicon: HALOT
  rationale: הקים는 여기서 ‘세우다’보다 명령을 실제로 행하다/이행하다의 뜻이므로, ‘실행하다’가 가장 직접적입니다.
- source_word: וַיִּחַר לִשְׁמוּאֵל
  english_pob_choice: Samuel burned with anger
  chosen_korean: 사무엘은 분노하여
  alternatives_korean:
  - 사무엘은 화가 나
  - 사무엘은 격분하여
  - 사무엘은 슬퍼하여
  lexicon: HALOT
  rationale: 히브리어 관용구의 열감 있는 정서 반응을 살리기 위해 ‘분노하여’로 옮겼습니다. 다만 문맥상의 깊은 비탄 가능성은 본문에 과도하게 덧씌우지 않았습니다.
- source_word: וַיִּזְעַק אֶל־יְהוָה
  english_pob_choice: he cried out to Yahweh
  chosen_korean: 야훼께 부르짖었습니다
  alternatives_korean:
  - 야훼께 외쳤습니다
  - 야훼께 소리쳐 간구했습니다
  - 야훼께 크게 부르짖었습니다
  lexicon: HALOT
  rationale: זעק의 긴급하고 강한 호소를 한국어 성서어감에서 가장 잘 살리는 말은 ‘부르짖다’입니다.
theological_decisions:
- issue: נִחַמְתִּי를 하나님의 감정 언어로 어떻게 살릴지
  chosen_reading: ‘후회합니다’로 번역해 하나님의 진정한 슬픔/유감을 드러내면서도, 하나님의 오류나 도덕적 결함을 뜻하지 않도록 유지했습니다.
  alternative_readings:
  - 유감스럽게 여깁니다
  - 철회합니다
  - 마음이 바뀝니다
  rationale: 본문은 하나님의 역사 속 대응을 말하는 인격적 언어이므로, 이를 매끈하게 제거하기보다 신학적 긴장을 보존하는 쪽이 원문에 충실합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
- issue: וַיִּחַר לִשְׁמוּאֵל의 감정 해석
  chosen_reading: 본문에는 ‘분노하여’라고 두고, 깊은 비탄의 가능성은 본문 밖 해석으로 남겨 두었습니다.
  alternative_readings:
  - 슬퍼하여
  - 몹시 못마땅해하여
  - 격분하여
  rationale: 어휘 차원에서는 분노가 가장 직접적이므로, 문맥적 비애를 본문에서 미리 평탄화하지 않았습니다.
  doctrine_reference: Translation philosophy §1 and §3
