lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Then ... came
  chosen_korean: 그때 ... 임하여
  alternatives_korean:
  - 그리고 ... 되었습니다
  - 그 일이 있었습니다
  lexicon: HALOT
  rationale: 서술 전환을 알리는 완료형 내러티브를 한국어의 자연스러운 사건 전개 표현인 ‘그때 … 임하여’로 옮겨, 단순한 발생보다 이어지는 계시 도착의 흐름을 살렸습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 메시지
  - 주님의 말씀
  lexicon: HALOT
  rationale: 예언 공식인 ‘여호와의 말씀’을 관습적 ‘주님의 말씀’으로 완화하지 않고, POB의 원칙에 따라 신명 ‘야훼’를 유지해 계시의 직접성을 드러냈습니다.
- source_word: אֶל שְׁמוּאֵל
  english_pob_choice: to Samuel
  chosen_korean: 사무엘에게
  alternatives_korean:
  - 사무엘을 향하여
  - 사무엘 앞에
  lexicon: HALOT
  rationale: 전치사 אֶל은 수신 대상을 가리키므로 한국어에서는 조사 ‘-에게’로 자연스럽게 대응했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하여 이르시되
  - 말씀하여
  lexicon: HALOT
  rationale: 히브리어 서술 공식에서 뒤따르는 직접화법을 한국어에서는 반복을 줄이고 자연스럽게 연결하는 종결 표현으로 처리했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
