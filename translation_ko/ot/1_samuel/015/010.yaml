  - 주님
  rationale: 원문에 있는 신명 텍스트를 제목화된 호칭으로 바꾸지 않고, POB 기준에 따라 고유명사 ‘야훼’를 유지해 계시의 언약적 인격성을 보존했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
