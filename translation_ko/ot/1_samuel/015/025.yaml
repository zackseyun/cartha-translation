  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֕ה שָׂ֥א נָ֖א אֶת חַטָּאתִ֑/י וְ/שׁ֣וּב עִמִּ֔/י וְ/אֶֽשְׁתַּחֲוֶ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/025.yaml
  text: Now please forgive my sin[a], and return with me[b], so that I may bow down to Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''lift up my sin,'' an idiom meaning ''forgive my sin.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'that I may worship the LORD'; the Hebrew verb refers literally to bowing down or prostrating oneself.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 부디 내 죄를 용서해 주시고[a], 나와 함께 돌아와 주십시오[b]. 그러면 내가 야훼께 절하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘내 죄를 들어 올리다’라는 관용구로, 여기서는 ‘내 죄를 용서하다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나와 함께 돌아오라’; 히브리어 동사는 문자적으로 몸을 돌이키거나 되돌아오는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא אֶת חַטָּאתִי
  english_pob_choice: please forgive my sin
  chosen_korean: 부디 내 죄를 용서해 주시고
  alternatives_korean:
  - 부디 내 죄를 덮어 주시고
  - 부디 내 죄를 들어 옮겨 주시고
  - 부디 내 죄를 사해 주시고
  lexicon: HALOT
  rationale: ‘죄를 들어 옮기다’라는 직역 배경을 유지하되, 한국어에서는 관용적으로 ‘용서하다’가 이 구문과 죄의 대상에 가장 자연스럽게 대응합니다.
- source_word: וְשׁוּב עִמִּי
  english_pob_choice: and return with me
  chosen_korean: 나와 함께 돌아와 주십시오
  alternatives_korean:
  - 나와 함께 돌아오십시오
  - 나와 함께 되돌아와 주십시오
  - 저와 함께 돌아가 주십시오
  lexicon: HALOT
  rationale: שׁוּב는 ‘돌아오다/되돌아가다’의 기본 의미를 유지하며, 여기서는 사울이 사무엘에게 동행을 요청하는 맥락이므로 공손한 청유형으로 옮겼습니다.
- source_word: וְאֶשְׁתַּחֲוֶה
  english_pob_choice: so that I may bow down
  chosen_korean: 그러면 내가 … 절하겠습니다
  alternatives_korean:
  - 그리하여 내가 … 경배하겠습니다
  - 그러면 내가 … 엎드리겠습니다
  - 그리하여 내가 … 예배하겠습니다
  lexicon: HALOT
  rationale: שׁחה의 핵심은 몸을 굽혀 엎드리는 행위이므로 ‘절하다’로 옮겨 물리적 동작을 보존했습니다. 문맥상 목적/결과 관계를 ‘그러면’으로 자연스럽게 나타냈습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  - 하나님께
  lexicon: HALOT
  rationale: 본문의 신명(יהוה)을 프로젝트 기본값인 ‘야훼’로 직접 반영했습니다.
theological_decisions:
- issue: ‘절하다’와 ‘경배하다/예배하다’ 사이의 의미 범위
  chosen_reading: 사울의 말은 단순한 내적 신앙고백보다 실제 몸의 자세를 포함한 ‘절함’으로 유지했습니다.
  alternative_readings:
  - ‘경배하다’로 해석해 예배적 의미를 전면화
  - ‘예배하다’로 번역해 종교적 의미를 강조
  rationale: 히브리어 동사는 문자적으로 몸을 굽혀 엎드리는 행위를 가리키며, POB의 audit trail도 이 물리적 의미를 보존하도록 안내합니다.
  doctrine_reference: 텍스트-의미 우선 원칙; 신체적 경배 동작의 보존
- issue: 야훼의 이름 표기
  chosen_reading: 본문의 לַיהוָה를 ‘야훼께’로 옮겼습니다.
  alternative_readings:
  - ‘주님께’
  - ‘여호와께’
  rationale: 본문의 Tetragrammaton을 가려 일반 호칭으로 바꾸기보다, 원문이 드러내는 언약 이름을 직접 반영하는 것이 소스-직결성에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
