base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/027.yaml
  text: As Samuel turned to go[a], he seized the edge of his robe, and it tore.
  footnotes:
  - marker: a
    text: Or 'the corner of his robe' or 'the hem of his robe.' The Hebrew word can denote an extremity of a garment.
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘이 가려고 몸을 돌렸는데, 그의 겉옷 자락을 붙잡자 그 옷이 찢어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자락’은 כאןף가 가리킬 수 있는 의복의 끝부분, 가장자리, 또는 옷단을 포괄합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב
  english_pob_choice: turned
  chosen_korean: 몸을 돌렸는데
  alternatives_korean:
  - 돌렸는데
  - 돌아서 가려 했는데
  - 가려고 몸을 돌리는데
  lexicon: HALOT
  rationale: 출발하려는 동작을 자연스럽게 살리기 위해 ‘몸을 돌리다’로 옮겼습니다. 이어지는 ‘가려고’가 이동 의도를 분명히 합니다.
- source_word: לָלֶכֶת
  english_pob_choice: to go
  chosen_korean: 가려고
  alternatives_korean:
  - 떠나려고
  - 가려 하자
  - 떠나려 하자
  lexicon: HALOT
  rationale: 히브리어 부정사구가 사무엘의 떠남 의도를 나타내므로, 가장 직접적인 ‘가려고’를 사용했습니다.
- source_word: בִּכְנַף
  english_pob_choice: the edge of
  chosen_korean: 자락을
  alternatives_korean:
  - 모서리를
  - 끝자락을
  - 옷단을
  lexicon: HALOT
  rationale: כָּנָף의 기본 뜻은 의복의 끝부분이나 가장자리이므로, 현대 한국어에서 자연스럽고 넓게 포괄하는 ‘자락’을 택했습니다.
- source_word: מְעִילוֹ
  english_pob_choice: his robe
  chosen_korean: 그의 겉옷
  alternatives_korean:
  - 그의 옷
  - 그의 로브
  - 그의 망토
  lexicon: HALOT
  rationale: מְעִיל은 겉에 입는 긴 의복을 가리키므로, 너무 의례적이거나 낡은 느낌의 ‘망토’보다 ‘겉옷’이 문맥에 더 정확합니다.
