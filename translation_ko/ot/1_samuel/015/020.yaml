source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל שְׁמוּאֵ֗ל אֲשֶׁ֤ר שָׁמַ֨עְתִּי֙ בְּ/ק֣וֹל יְהוָ֔ה וָ/אֵלֵ֕ךְ בַּ/דֶּ֖רֶךְ אֲשֶׁר שְׁלָחַ֣/נִי יְהוָ֑ה וָ/אָבִ֗יא אֶת אֲגַג֙ מֶ֣לֶךְ עֲמָלֵ֔ק וְ/אֶת עֲמָלֵ֖ק הֶחֱרַֽמְתִּי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/020.yaml
  text: Saul said to Samuel[a], “But I did obey the voice of Yahweh, and I went on the way that Yahweh sent me, and I brought Agag king of Amalek[b], and I devoted Amalek to destruction.”
  footnotes:
  - marker: a
    text: Or, “I utterly destroyed Amalek” or “I put Amalek under the ban.” The Hebrew verb carries the sense of devoting something to destruction.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “I obeyed/listened to the voice of the LORD.”
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 사무엘에게 말했습니다. “그러나 저는 야훼의 음성에 순종했습니다.[a] 야훼께서 저를 보내신 길로 갔으며, 아말렉 왕 아각을 데려왔고, 아말렉을 멸망에 바쳤습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼의 음성에 순종하다’는 히브리어 שׁמע בְּקוֹל의 관용구를 옮긴 것입니다. 이 표현은 단순히 듣는 것뿐 아니라 듣고 따르는 것을 뜻합니다.
    reason: source_note
  - marker: b
    text: ‘멸망에 바치다’는 히브리어 הֶחֱרַמְתִּי를 옮긴 것으로, 어떤 것을 멸망에 이르도록 바치는 뜻입니다. ‘진멸했다’ 또는 ‘파괴에 바쳤다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי בְּקוֹל יְהוָה
  english_pob_choice: I did obey the voice of Yahweh
  chosen_korean: 야훼의 음성에 복종했고
  alternatives_korean:
  - 야훼의 음성을 들었고
  - 야훼의 말씀을 따랐고
  lexicon: HALOT
  rationale: שׁמע with בְּקוֹל는 단순한 ‘듣다’보다 ‘복종하다/들어 따르다’의 뜻이 강하므로, 사울의 방어적 진술을 살려 ‘복종했고’로 옮겼습니다.
- source_word: בַּדֶּרֶךְ אֲשֶׁר שְׁלָחַנִי יְהוָה
  english_pob_choice: I went on the way that Yahweh sent me
  chosen_korean: 야훼께서 저를 보내신 그 길로 갔으며
  alternatives_korean:
  - 야훼께서 저를 보내신 길로 갔으며
  - 야훼께서 저에게 맡기신 길로 갔으며
  lexicon: HALOT
  rationale: בַּדֶּרֶךְ의 ‘길’ 이미지를 유지하면서, 파송·위임의 의미를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: וָאָבִיא אֶת אֲגַג מֶלֶךְ עֲמָלֵק
  english_pob_choice: and I brought Agag king of Amalek
  chosen_korean: 아각 곧 아말렉의 왕을 데려왔고
  alternatives_korean:
  - 아각, 아말렉의 왕을 데려왔고
  - 아각 아말렉 왕을 데려왔고
  lexicon: HALOT
  rationale: אַגַג מֶלֶךְ עֲמָלֵק의 병치 관계를 한국어에서 ‘곧’으로 풀어 apposition을 드러냈습니다.
- source_word: וְאֶת עֲמָלֵק הֶחֱרַמְתִּי
  english_pob_choice: and I devoted Amalek to destruction
  chosen_korean: 아말렉은 멸망에 바쳤습니다
  alternatives_korean:
  - 아말렉을 멸망에 바쳤습니다
  - 아말렉을 진멸했습니다
  - 아말렉을 멸망으로 정했습니다
  lexicon: HALOT
  rationale: חרם의 종교적·법적 힘을 살리기 위해 전통적인 ‘진멸’만으로 약화시키지 않고, POB의 ‘devoted to destruction’에 맞춰 ‘멸망에 바치다’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 고유명사 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 지시어 치환이 아니라 신명 표기이므로, 프로젝트 기본값에 따라 고유명사 ‘야훼’를 유지했습니다.
  doctrine_reference: Glossary — project defaults
- issue: חרם의 신학적 뉘앙스
  chosen_reading: 멸망에 바쳤습니다
  alternative_readings:
  - 진멸했습니다
  - 저주 아래 두었습니다
  rationale: 이 행위는 단순 파괴가 아니라 야훼께 바쳐진 심판 행위라는 점을 보존해야 하므로, ‘멸망에 바치다’로 신학적 긴장을 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
