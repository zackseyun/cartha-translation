  to: 사울이 사무엘에게 말했습니다. “그러나 저는 야훼의 음성에 순종했습니다.[a] 야훼께서 저를 보내신 길로 갔으며, 아말렉 왕 아각을 데려왔고, 아말렉을 멸망에 바쳤습니다.[b]”
