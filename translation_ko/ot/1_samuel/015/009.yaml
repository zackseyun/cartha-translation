base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/009.yaml
  text: But Saul and the people spared Agag and the best of the sheep and cattle[a], and the fattened calves, and the lambs, and all that was good, and they were not willing to devote them to destruction[b]. But every despised and worthless thing they devoted to destruction.
  footnotes:
  - marker: a
    text: Or 'the fatlings.' The Hebrew term מִשְׁנִים is difficult; the traditional rendering is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'devote to destruction,' a technical term for placing something under the ban for destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울과 백성은 아각과 양과 소 가운데 가장 좋은 것과, 둘째 것들과, 숫양들과, 그리고 좋은 것들을 모두 아꼈습니다. 그러나 그들은 그것들을 진멸하도록 바치기를 원하지 않았습니다. 반면에 멸시받고 가치 없는 것은 모두 진멸하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁנִים은 뜻이 어려운 말입니다. 전통적 번역은 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘진멸하도록 바치다’는 파멸을 위해 금지 아래 두는 기술적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹל
  english_pob_choice: spared
  chosen_korean: 아꼈습니다
  alternatives_korean:
  - 살려 두었습니다
  - 불쌍히 여겼습니다
  - 아까워했습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 연민보다 명령된 진멸을 보류한 행위를 가리키므로, 결과를 드러내는 ‘아꼈습니다’가 한국어로 가장 자연스럽고 문맥에 맞습니다.
- source_word: מֵיטַב
  english_pob_choice: the best of
  chosen_korean: 가장 좋은 것
  alternatives_korean:
  - 가장 좋은 것들
  - 최상품
  lexicon: HALOT
  rationale: 가축 가운데 가장 우수한 것들을 가리키는 평가 표현이므로, 직역에 가까우면서도 자연스러운 ‘가장 좋은 것’으로 옮겼습니다.
- source_word: הַצֹּאן / הַבָּקָר / הַכָּרִים
  english_pob_choice: the sheep and cattle / the rams
  chosen_korean: 양과 소 / 숫양들
  alternatives_korean:
  - 양 떼와 소 떼 / 어린양들
  - 가축과 소 / 양들
  lexicon: HALOT
  rationale: 열거된 가축 목록의 구체성을 살리기 위해 ‘양’, ‘소’, ‘숫양들’로 옮겼습니다. 특히 כָּרִים는 전통적이지만 불확실한 ‘양들’보다 수컷 양을 가리키는 ‘숫양들’이 더 직접적입니다.
- source_word: הַמִּשְׁנִים
  english_pob_choice: the second-born
  chosen_korean: 둘째 것들
  alternatives_korean:
  - 둘째로 난 것들
  - 이등급의 것들
  - 살진 짐승들
  lexicon: HALOT
  rationale: 어근상 ‘둘째/두 번째’와 연결되는 난해한 항목이므로, POB의 주해처럼 전통적이지만 불확실한 의미를 피하고 형태를 드러내는 ‘둘째 것들’로 처리했습니다.
- source_word: לֹא אָבוּ הַחֲרִימָם
  english_pob_choice: they were not willing to devote them to destruction
  chosen_korean: 그것들을 진멸하도록 바치기를 원하지 않았습니다
  alternatives_korean:
  - 그것들을 진멸하기를 원하지 않았습니다
  - 그것들을 진멸하겠다고 동의하지 않았습니다
  lexicon: HALOT
  rationale: אָבוּ는 단순한 불가능이 아니라 의지의 부정을 나타내므로 ‘원하지 않았습니다’로 옮겼고, הַחֲרִים은 제의적·법적 성격을 살려 ‘진멸하도록 바치다’로 유지했습니다.
- source_word: נְמִבְזָה / נָמֵס
  english_pob_choice: despised and worthless
  chosen_korean: 멸시받고 가치 없는
  alternatives_korean:
  - 천대받고 쓸모없는
  - 멸시받고 하찮은
  lexicon: HALOT
  rationale: 두 형용사의 대조를 살리기 위해 첫째는 사회적 평가인 ‘멸시받고’, 둘째는 가치 판단인 ‘가치 없는’으로 구분해 옮겼습니다.
theological_decisions:
- issue: חרם(진멸) 명령의 강도
  chosen_reading: ‘진멸하도록 바치다’로 유지하여, 단순한 파괴가 아니라 하나님께 속한 심판적 헌납의 성격을 드러냈습니다.
  alternative_readings:
  - 멸절시키다
  - 완전히 없애다
  - 저주 아래 두다
  rationale: 이 절의 핵심은 사울과 백성이 명령된 חרם을 실행하지 않았다는 데 있으므로, 완곡화하거나 일반적 전쟁 언어로 희석하지 않고 기술적 의미를 유지하는 것이 필요합니다.
  doctrine_reference: Translation philosophy §1, §5
