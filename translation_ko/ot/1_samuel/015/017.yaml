  source_fidelity: 본문은 반문 הֲלוֹא, ‘자기 눈에 작다’는 관용, 이스라엘 지파들의 우두머리라는 표현, 그리고 야훼의 기름부음과 왕으로의 임명을 충실히 반영합니다. 다만 אִם 절의 양보적 뉘앙스와 히브리어 접속을 한국어에서 조금 더 분명하고 자연스럽게 나타낼 수 있습니다.
  naturalness: ‘스스로 보기에는 작았지만’도 이해되지만, 반문과 결합할 때 ‘비록 … 작았을지라도’가 더 자연스럽고 문어적 합쇼체에 잘 맞습니다. 인용문 안의 마침표를 닫는 인용 부호 앞에 두고, 각주 표지는 해당 절에 붙이는 편이 한국어 조판과 각주 범위 면에서 명확합니다.
  terminology: ‘야훼’, ‘기름을 부어’, ‘이스라엘의 왕으로 삼으셨습니다’는 원문의 신명, 왕의 기름부음, 결과 구문을 정확히 보존합니다. ‘우두머리’는 רֹאשׁ의 지도자·수장 의미를 현대 한국어로 자연스럽게 전달합니다.
