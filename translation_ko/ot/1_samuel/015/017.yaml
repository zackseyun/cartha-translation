  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל הֲ/ל֗וֹא אִם קָטֹ֤ן אַתָּה֙ בְּ/עֵינֶ֔י/ךָ רֹ֛אשׁ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אָ֑תָּה וַ/יִּמְשָׁחֲ/ךָ֧ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/017.yaml
  text: And Samuel said[a], “Though you were small in your own eyes, were you not the head of the tribes of Israel? And Yahweh anointed you king over Israel.”
  footnotes:
  - marker: a
    text: Or, 'Even if you were small in your own eyes.' The Hebrew can be taken with slightly different nuance, but the sense is that Saul once regarded himself as insignificant.
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘이 말했습니다. 「당신은 스스로 보기에는 작았지만, 이스라엘 지파들의 우두머리가 아니었습니까? 야훼께서 당신에게 기름을 부어 이스라엘의 왕으로 삼으셨습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스스로 보기에도 작았지만’. 히브리어는 약간 다른 뉘앙스로도 읽을 수 있으나, 뜻은 사울이 한때 자신을 보잘것없는 존재로 여겼다는 데 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  english_pob_choice: were you not
  chosen_korean: 아니었습니까?
  alternatives_korean:
  - 그렇지 않습니까?
  - 정말 아니었습니까?
  lexicon: HALOT
  rationale: 반문으로서 상대의 동의를 기대하는 어조를 한국어 합쇼체 의문문으로 자연스럽게 옮겼습니다.
- source_word: אִם קָטֹן אַתָּה בְּעֵינֶיךָ
  english_pob_choice: Though you were small in your own eyes
  chosen_korean: 스스로 보기에는 작았지만
  alternatives_korean:
  - 당신 눈에는 작았지만
  - 당신 자신에게는 작게 여겨졌지만
  lexicon: HALOT
  rationale: ‘자기 평가’라는 관용을 살리면서, 문맥상의 양보 의미를 ‘-았지만’으로 드러냈습니다.
- source_word: רֹאשׁ שִׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: the head of the tribes of Israel
  chosen_korean: 이스라엘 지파들의 우두머리
  alternatives_korean:
  - 이스라엘 지파들의 머리
  - 이스라엘 지파들의 지도자
  lexicon: HALOT
  rationale: ‘머리’의 직역 가능성을 살리되 현대 한국어에서 자연스럽고 지배적 지위를 분명히 하는 ‘우두머리’를 택했습니다.
- source_word: וַיִּמְשָׁחֲךָ יְהוָה
  english_pob_choice: And Yahweh anointed you
  chosen_korean: 야훼께서 당신에게 기름을 부어
  alternatives_korean:
  - 야훼께서 당신을 기름 부으셨고
  - 야훼께서 당신에게 기름을 부으셨습니다
  lexicon: HALOT
  rationale: משח의 의례적·왕권적 의미를 보존하기 위해 ‘기름을 부어’로 옮겼고, YHWH는 본 프로젝트 기준대로 ‘야훼’로 렌더링했습니다.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  english_pob_choice: king over Israel
  chosen_korean: 이스라엘의 왕으로 삼으셨습니다
  alternatives_korean:
  - 이스라엘 위에 왕으로 삼으셨습니다
  - 이스라엘의 왕으로 세우셨습니다
  lexicon: HALOT
  rationale: 히브리어 목적/결과 구문을 한국어에서 자연스럽게 풀어, 기름부음의 결과가 왕위 부여임을 분명히 했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
