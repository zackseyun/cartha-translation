  - 주님
  rationale: 본문이 Tetragrammaton을 직접 사용하므로, 전통적 대체어 ‘여호와’나 호칭 ‘주님’ 대신 본 프로젝트 기본값인 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
