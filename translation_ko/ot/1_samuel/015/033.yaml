source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל כַּ/אֲשֶׁ֨ר שִׁכְּלָ֤ה נָשִׁים֙ חַרְבֶּ֔/ךָ כֵּן תִּשְׁכַּ֥ל מִ/נָּשִׁ֖ים אִמֶּ֑/ךָ וַ/יְשַׁסֵּ֨ף שְׁמוּאֵ֧ל אֶת אֲגָ֛ג לִ/פְנֵ֥י יְהוָ֖ה בַּ/גִּלְגָּֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/033.yaml
  text: Samuel said[a], “As your sword has made women childless[b], so your mother will be childless among women.” And Samuel hacked Agag to pieces before Yahweh at Gilgal.
  footnotes:
  - marker: a
    text: Or “has bereaved women … your mother will be bereaved among women.” The Hebrew uses the same verb in both clauses, emphasizing measured retribution.
    reason: lexical_alternative
  - marker: b
    text: Or “cut Agag in pieces” or traditionally “hewed Agag in pieces.”
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘이 말했습니다. “네 칼이 여인들에게 자녀를 잃게 한 것처럼, 네 어머니도 여인들 가운데서 자녀를 잃게 될 것이다.”[a] 사무엘은 길갈에서 야훼 앞에 아각을 토막 냈습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 칼이 여인들을 자식 없게 한 것처럼, 네 어머니도 여인들 가운데서 자식 없게 될 것이다.” 히브리어는 두 절에서 같은 동사를 써서 응보의 대응을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “아각을 산산이 베었습니다” 또는 전통적으로 “아각을 찍어 버렸습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכְּלָה / תִּשְׁכַּל
  english_pob_choice: has made women childless / will be childless
  chosen_korean: 자식 없게 한 / 자식 없게 될
  alternatives_korean:
  - 아이를 잃게 한 / 아이를 잃게 될
  - 자녀를 잃은 / 자녀를 잃을
  lexicon: HALOT
  rationale: 이 동사는 여기서 단순한 불임이 아니라 자녀 상실로 인한 ‘자식 없음’을 뜻하므로, 한국어에서도 결과를 직접 드러내는 표현이 원문의 응보적 말놀이를 가장 잘 살립니다.
- source_word: חַרְבֶּךָ
  english_pob_choice: your sword
  chosen_korean: 네 칼
  alternatives_korean:
  - 네 검
  - 네 칼날
  lexicon: HALOT
  rationale: 전쟁/폭력의 도구를 가리키는 직설적 표현으로 ‘칼’이 가장 자연스럽고, 문맥의 유혈성을 약화시키지 않습니다.
- source_word: וַיְשַׁסֵּף
  english_pob_choice: hacked ... to pieces
  chosen_korean: 토막 냈습니다
  alternatives_korean:
  - 잘라 버렸습니다
  - 두 동강 냈습니다
  - 베어 버렸습니다
  lexicon: HALOT
  rationale: 동사의 강한 폭력성과 분해된 절단 이미지를 현대 한국어에서 가장 선명하게 전달하는 말이 ‘토막 내다’입니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 주님 앞에서
  - 여호와 앞에서
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮기고, לִפְנֵי는 의례적·공적 행위의 장소감이 살아 있는 ‘앞에서’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 프로젝트의 기본 원칙에 따라 신명사형을 가리거나 전통 교회어로 대체하지 않고, מקור의 언약 이름을 가시화했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 사무엘의 행위 묘사
  chosen_reading: 사무엘이 직접 아각을 죽이는 폭력 행위를 원문 강도로 유지했습니다.
  alternative_readings:
  - 사무엘이 아각을 죽였습니다
  - 사무엘이 아각을 베었습니다
  rationale: 히브리어의 강한 절단 동사를 완화하지 않아, 본문이 드러내는 심판의 엄중함을 그대로 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
