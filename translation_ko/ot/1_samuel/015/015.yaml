base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/015.yaml
  text: And Saul said[a], “They brought them from the Amalekites, because the people spared the best of the sheep and the cattle, in order to sacrifice them to Yahweh your God; but the rest we devoted to destruction.”
  footnotes:
  - marker: a
    text: Or, “we utterly destroyed”; Hebrew has a form of חָרַם, a technical term for devoting something to destruction under the ban.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 말했습니다. "그것들은 아말렉 사람들에게서 가져온 것입니다. 백성이 양과 소 가운데 가장 좋은 것들을 아끼고 남겨 두어 야훼 당신의 하나님께 제사드리게 하였고, 나머지는 우리가 진멸하였습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리가 완전히 멸하였습니다”; 히브리어는 חרם의 형태를 사용하며, 이는 어떤 것을 금령 아래 두어 멸절에 바치는 기술적 용어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֲמָלֵקִי
  english_pob_choice: from the Amalekites
  chosen_korean: 아말렉 사람들에게서
  alternatives_korean:
  - 아말렉 족속에게서
  - 아말렉에게서
  lexicon: HALOT
  rationale: 히브리어의 민족형 형용사는 사람 집단을 가리키므로, 한국어에서도 집단성을 드러내는 표현이 자연스럽습니다.
- source_word: חָמַל ... עַל
  english_pob_choice: spared
  chosen_korean: 아끼고 남겨 두어
  alternatives_korean:
  - 불쌍히 여겨
  - 아껴
  lexicon: HALOT
  rationale: 군사적·심판적 문맥에서 단순한 감정이 아니라 파괴하지 않고 보존한 행위를 가리키므로, '아끼고 남겨 두어'가 행동을 더 분명히 드러냅니다.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  english_pob_choice: the best of the sheep and the cattle
  chosen_korean: 양과 소 가운데 가장 좋은 것들
  alternatives_korean:
  - 양 떼와 소 떼 가운데 가장 좋은 것들
  - 최상의 양과 소
  lexicon: HALOT
  rationale: 구체적 가축 범주를 살리되, 한국어에서는 '가운데 가장 좋은 것들'이 선별된 최상급을 자연스럽게 전달합니다.
- source_word: לְמַעַן זְבֹחַ
  english_pob_choice: in order to sacrifice them
  chosen_korean: 제사드리게 하였고
  alternatives_korean:
  - 희생제물로 바치게 하였고
  - 희생시키려 하였고
  lexicon: HALOT
  rationale: 목적의 의미를 유지하면서, כאן 문맥상 제사의 행위를 분명히 나타내는 동사를 택했습니다. 대상을 생략하지 않고 앞의 가축들을 이어 받습니다.
- source_word: הֶחֱרַמְנוּ
  english_pob_choice: we devoted to destruction
  chosen_korean: 진멸하였습니다
  alternatives_korean:
  - 완전히 멸했습니다
  - 바친 것입니다
  lexicon: HALOT
  rationale: 히브리어 חרם의 기술적 의미를 한국어에서 가장 직접적으로 옮기는 표현입니다. 전통 교회어보다 심판 아래 둔다는 강도를 보존합니다.
- source_word: אֱלֹהֶיךָ
  english_pob_choice: your God
  chosen_korean: 당신의 하나님
  alternatives_korean:
  - 네 하나님
  - 당신 하나님
  lexicon: HALOT
  rationale: 2인칭 남성 단수의 소유격을 살려 사울이 사무엘에게 거리감을 두는 뉘앙스를 유지합니다.
