    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘이 그에게 말했습니다. “야훼께서 오늘 이스라엘의 왕권을 당신에게서 찢어 내셨고, 그것을 당신보다 더 나은[b] 당신의 이웃[a]에게 주셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘동료’ 또는 ‘벗’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 왕권을 받는 사람을 ‘당신보다 더 나은’ 사람으로 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  english_pob_choice: And Samuel said to him
  chosen_korean: 사무엘이 그에게 말했습니다
  alternatives_korean:
  - 그리고 사무엘이 그에게 말했습니다
  - 사무엘이 그에게 이르러 말했습니다
  lexicon: HALOT
  rationale: 서술 전개는 한국어에서 자연스럽게 이어 주되, 불필요하게 문어체를 과장하지 않기 위해 단순한 과거 서술로 옮겼습니다.
- source_word: קָרַע
  english_pob_choice: has torn ... away
  chosen_korean: 찢어 버리시고
  alternatives_korean:
  - 찢으시고
  - 뜯어 버리시고
  - 찢어내시고
  lexicon: HALOT
  rationale: 왕권을 ‘찢다’는 강한 이미지와 제거의 뉘앙스를 함께 살리기 위해 ‘찢어 버리시고’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 고유신명은 본문 원형을 드러내는 음역인 ‘야훼’를 따랐습니다.
- source_word: מַמְלְכוּת יִשְׂרָאֵל
  english_pob_choice: the kingdom of Israel
  chosen_korean: 이스라엘의 왕권
  alternatives_korean:
  - 이스라엘의 왕국
  - 이스라엘 나라의 왕권
  lexicon: HALOT
  rationale: 여기서는 단순한 영토보다 왕의 통치권이 제거되는 맥락이므로 ‘왕권’이 문맥을 더 정확히 드러냅니다.
- source_word: לְרֵעֲךָ
  english_pob_choice: to your neighbor
  chosen_korean: 당신의 이웃
  alternatives_korean:
  - 당신의 동료
  - 당신의 벗
  lexicon: HALOT
  rationale: רֵעַ는 관계를 나타내는 넓은 말이므로, POB의 ‘neighbor’에 맞춰 가장 중립적인 ‘이웃’을 택했습니다.
- source_word: הַטּוֹב מִמֶּךָּ
  english_pob_choice: who is better than you
  chosen_korean: 당신보다 더 나은
  alternatives_korean:
  - 당신보다 나은
  - 당신보다 뛰어난
  lexicon: HALOT
  rationale: 비교급의 의미를 직접 살리되, 뒤의 ‘당신의 이웃’을 수식하는 형태가 자연스럽도록 옮겼습니다.
theological_decisions:
- issue: 완료형의 예언적/선언적 뉘앙스
  chosen_reading: 이미 단행된 판결로서의 완료감은 살리되, 한국어에서는 시제 과잉을 피하고 현재적 효력으로 들리게 했습니다.
  alternative_readings:
  - ‘찢으셨습니다’처럼 단순 과거로만 처리
  - ‘찢어질 것입니다’처럼 미래로 처리
  rationale: 히브리어 완료형의 선언적 힘을 반영하면서도, 한국어에서는 이미 내려진 불가역적 판결처럼 들리게 하는 것이 문맥에 가장 잘 맞습니다.
  doctrine_reference: Translation philosophy §3 (preserve tension rather than resolve it)
