revisions:
- from: 그러나 백성은 노략물에서 양과 소, 곧 바쳐 멸할 것 가운데 가장 좋은 것들을 가져와서 길갈에서 야훼 당신의 하나님께 제사드리려 하였습니다.[a][b][c]
  to: 그러나 백성이 전리품[a] 가운데서 양과 소, 곧 진멸하도록 바쳐진 것들[b] 가운데 가장 좋은 것들을 가져다가 길갈에서 야훼[c], 당신의 하나님께 제사를 드리려고 하였습니다.
  rationale: 현대 표준어 합쇼체의 자연스러운 문장으로 다듬는 동시에, 백성이 전리품에서 취한 양과 소가 진멸하도록 바쳐진 대상이었다는 본문의 핵심 긴장, ‘당신의 하나님’이라는 2인칭 관계, 길갈에서 제사하려는 목적을 유지했습니다.
