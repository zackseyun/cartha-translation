source:
  edition: WLC
  text: וַ/יִּקַּ֨ח הָ/עָ֧ם מֵ/הַ/שָּׁלָ֛ל צֹ֥אן וּ/בָקָ֖ר רֵאשִׁ֣ית הַ/חֵ֑רֶם לִ/זְבֹּ֛חַ לַֽ/יהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/גִּלְגָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/021.yaml
  text: But the people took from the spoil sheep and cattle[a], the best of what had been devoted to destruction[c][b], to sacrifice to Yahweh your God at Gilgal.
  footnotes:
  - marker: a
    text: Or 'from the plunder.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the best/first of what had been devoted to destruction'; the phrase refers to animals that were under the ban and should not have been kept.
    reason: lexical_alternative
  - marker: c
    text: '''The LORD'' renders the divine name YHWH.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 백성이 전리품[a] 가운데서 양과 소, 곧 진멸하도록 바쳐진 것들[b] 가운데 가장 좋은 것들을 가져다가 길갈에서 야훼[c], 당신의 하나님께 제사를 드리려고 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노획물’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘진멸하도록 바쳐진 것들 가운데 가장 좋은 것들’. ‘진멸하도록 바쳐진 것들’은 하나님께 바쳐져 멸절되어야 했던 것을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘야훼’는 히브리어 하나님의 고유명사 יהוה를 옮긴 것입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח הָעָם
  english_pob_choice: But the people took
  chosen_korean: 그러나 백성은 가져와서
  alternatives_korean:
  - 그러나 백성은 취하였습니다
  - 그런데 백성이 가져갔습니다
  lexicon: HALOT
  rationale: וַיִּקַּח의 기본 의미를 살리되, 앞선 문맥과의 대비를 보여 주기 위해 ‘그러나’로 옮겼습니다. 주어를 집합 명사인 ‘백성’으로 유지했습니다.
- source_word: מֵהַשָּׁלָל
  english_pob_choice: from the spoil
  chosen_korean: 노략물에서
  alternatives_korean:
  - 전리품에서
  - 노획물에서
  lexicon: HALOT
  rationale: שָׁלָל은 전쟁에서 얻은 전리품을 뜻하므로, 현대 한국어에서 자연스럽고 간결한 ‘노략물’을 택했습니다.
- source_word: צֹאן וּבָקָר
  english_pob_choice: sheep and cattle
  chosen_korean: 양과 소
  alternatives_korean:
  - 양 떼와 소 떼
  - 양과 가축
  lexicon: HALOT
  rationale: 두 동물군을 구체적으로 나란히 제시하는 표현을 따라, 더 넓은 ‘가축’보다 ‘양과 소’가 원문에 가깝습니다.
- source_word: רֵאשִׁית הַחֵרֶם
  english_pob_choice: the best of what had been devoted to destruction
  chosen_korean: 바쳐 멸할 것 가운데 가장 좋은 것들
  alternatives_korean:
  - 진멸 대상으로 바쳐진 것 가운데 첫/좋은 것들
  - 멸망에 바쳐진 것의 첫 열매
  lexicon: HALOT
  rationale: רֵאשִׁית는 여기서 단순한 ‘첫 번째’보다 선택된 최상급을 가리키므로 ‘가장 좋은 것들’로 옮겼습니다. חֵרֶם은 완곡하게 흐리지 않고, 바쳐진 뒤 멸해야 하는 것이라는 긴장을 드러내기 위해 ‘바쳐 멸할 것’으로 풀었습니다.
- source_word: לִזְבֹּחַ לַיהוָה אֱלֹהֶיךָ
  english_pob_choice: to sacrifice to Yahweh your God
  chosen_korean: 야훼 당신의 하나님께 제사드리려 하였습니다
  alternatives_korean:
  - 야훼 당신의 하나님께 희생제사드리려 하였습니다
  - 주 당신의 하나님께 제사드리려 하였습니다
  lexicon: HALOT
  rationale: לִזְבֹּחַ는 단순한 일반 제사 동사를 넘어 제물로 드리는 행위를 뜻하므로 ‘제사드리다’로 옮겼습니다. יהוה는 본 항목의 기본어휘에 따라 ‘야훼’로, 2인칭 소유격은 사울이 사무엘에게 말하는 거리감을 살려 ‘당신의 하나님’으로 유지했습니다.
theological_decisions:
- issue: חֵרֶם의 신학적 긴장 보존
  chosen_reading: ‘바쳐 멸할 것’으로 옮겨, 전리품이 아니라 하나님께 전적으로 속해 멸해야 할 대상으로 남겨 두었습니다.
  alternative_readings:
  - ‘진멸 대상’
  - ‘멸망에 바쳐진 것’
  rationale: 이 구절의 문제는 백성이 금지된 것을 합리화했다는 데 있으므로, 의미를 부드럽게 완화하지 않고 금령의 무게를 드러내는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; consistent rendering of חֵרֶם'
