base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/006.yaml
  text: Then Saul said to the Kenite[a], “Go, turn aside, go down from among the Amalekites, lest I sweep you away with them[c][b]. For you showed kindness to all the sons of Israel when they came up from Egypt.” So the Kenite turned aside from among the Amalekites.
  footnotes:
  - marker: a
    text: 'Or ''kindness'' or ''loyalty'' for ''covenant loyalty'' (Hebrew: hesed).'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'all the sons of Israel,' a standard national expression for the people of Israel.
    reason: lexical_alternative
  - marker: c
    text: Or 'lest I destroy you with them'; the Hebrew verb can carry the sense of being removed or swept away together in judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 겐 사람들에게[a] 말했습니다. “가서 물러나 아말렉 사람들 가운데서 내려가십시오. 그렇지 않으면 내가 그들과 함께 당신들까지 쓸어 버릴 것입니다[c]. 이스라엘 자손이 이집트에서 올라올 때, 당신들이 모든 이스라엘 자손에게 인애를 베풀었기 때문입니다[b].” 그러자 겐 사람들은 아말렉 사람들 가운데서 물러났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수 민족명 ‘겐 사람’을 사용하며, 여기서는 겐 사람들의 집단을 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어 ‘이스라엘 자손’은 이스라엘 백성을 가리키는 표준적인 민족 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 문맥상 ‘쓸어 버리다’는 그들과 함께 심판을 받아 제거된다는 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֵּינִי / קֵינִי
  english_pob_choice: the Kenite
  chosen_korean: 겐 사람
  alternatives_korean:
