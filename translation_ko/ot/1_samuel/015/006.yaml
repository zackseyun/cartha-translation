  lexicon: HALOT
  rationale: 히브리어의 단수 민족명 표현을 자연스러운 한국어로 옮기되, 집단을 가리키는 대표적 단수라는 점을 살려 ‘겐 사람’으로 처리했습니다.
- source_word: לְכוּ / סֻּרוּ / רְדוּ
  english_pob_choice: Go, turn aside, go down
  chosen_korean: 가서, 돌아서서, 내려가십시오
  alternatives_korean:
  - 가십시오, 비켜서십시오, 내려가십시오
  - 가서, 물러서서, 내려가십시오
  lexicon: HALOT
  rationale: 연속된 세 명령의 동작성을 살리면서, 한국어로는 군사적 회피 동작을 가장 분명하게 드러내는 표현으로 옮겼습니다.
- source_word: מִתּוֹךְ עֲמָלֵקִי
  english_pob_choice: from among the Amalekites
  chosen_korean: 아말렉 사람들 가운데서
  alternatives_korean:
  - 아말렉 가운데서
  - 아말렉 사람들 한가운데서
  lexicon: HALOT
  rationale: ‘가운데서/from among’의 분리 의미를 살리기 위해 한국어의 공간적 표현을 사용했고, 민족명을 자연스럽게 복수화했습니다.
- source_word: פֶּן אֹסִפְךָ עִמּוֹ
  english_pob_choice: lest I sweep you away with them
  chosen_korean: 그들과 함께 당신을 쓸어버릴까 합니다
  alternatives_korean:
  - 그들과 함께 당신을 멸할까 합니다
  - 그들과 함께 당신을 거두어 갈까 합니다
  lexicon: HALOT
  rationale: אֹסִף의 심판 문맥상 ‘제거하다/쓸어버리다’의 뉘앙스를 살려, 단순한 ‘거두다’보다 경고의 강도를 드러냈습니다.
- source_word: חֶסֶד
  english_pob_choice: covenant loyalty
  chosen_korean: 인애
  alternatives_korean:
  - 자비
  - 친절
  - 언약적 신실함
  lexicon: HALOT
  rationale: 이 문맥에서는 단순 친절보다 이스라엘에게 베푼 충실한 호의를 가리키므로, 한국어 성서어휘로는 ‘인애’가 가장 압축적이고 본문에 가깝습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: all the sons of Israel
  chosen_korean: 모든 이스라엘 자손
  alternatives_korean:
  - 모든 이스라엘 사람들
  - 모든 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 قومی 표현을 유지해, 민족적 공식어법을 살렸습니다.
theological_decisions:
- issue: חֶסֶד의 한국어 신학적 뉘앙스
  chosen_reading: 인애
  alternative_readings:
  - 자비
  - 친절
  - 언약적 신실함
  rationale: 사울이 겐 사람들을 보존하는 근거가 되는 과거의 행위를 설명하므로, 하나님의 속성으로 제한하지 않으면서도 관계적 충실함을 담는 전통적 한국어 성서어휘를 선택했습니다.
  doctrine_reference: 번역 철학 §5, 핵심어 일관성
- issue: 사울의 경고 동사 אֹסִף의 강도
  chosen_reading: 쓸어버리다
  alternative_readings:
  - 멸하다
  - 거두어 가다
  rationale: 문맥은 함께 재앙을 당할 위험을 경고하는 것이므로, 심판적 제거의 의미를 분명히 해야 본문의 긴박감이 살아납니다.
  doctrine_reference: 번역 철학 §6, 가독성과 원문의 강도 보존
