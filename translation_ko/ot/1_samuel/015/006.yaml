source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֣וּל אֶֽל הַ/קֵּינִ֡י לְכוּ֩ סֻּ֨רוּ רְד֜וּ מִ/תּ֣וֹךְ עֲמָלֵקִ֗י פֶּן אֹֽסִפְ/ךָ֙ עִמּ֔/וֹ וְ/אַתָּ֞ה עָשִׂ֤יתָה חֶ֨סֶד֙ עִם כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/עֲלוֹתָ֖/ם מִ/מִּצְרָ֑יִם וַ/יָּ֥סַר קֵינִ֖י מִ/תּ֥וֹךְ עֲמָלֵֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/006.yaml
  text: Then Saul said to the Kenite[a], “Go, turn aside, go down from among the Amalekites, lest I sweep you away with them[c][b]. For you showed kindness to all the sons of Israel when they came up from Egypt.” So the Kenite turned aside from among the Amalekites.
  footnotes:
  - marker: a
    text: 'Or ''kindness'' or ''loyalty'' for ''covenant loyalty'' (Hebrew: hesed).'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'all the sons of Israel,' a standard national expression for the people of Israel.
    reason: lexical_alternative
  - marker: c
    text: Or 'lest I destroy you with them'; the Hebrew verb can carry the sense of being removed or swept away together in judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 겐 사람에게 말했습니다. “가서, 돌아서서, 아말렉 사람들 가운데서 내려가십시오. 그렇지 않으면 내가 그들과 함께 당신을 쓸어버릴까 합니다. 당신이 이집트에서 올라올 때 모든 이스라엘 자손에게 인애를 베풀었기 때문입니다.” 그러자 겐 사람이 아말렉 사람들 가운데서 돌아섰습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘겐 사람’은 히브리어 단수 민족명(‘the Kenite’)을 반영한 표현입니다.
    reason: source_note
  - marker: b
    text: 히브리어 ‘이스라엘 자손’은 이스라엘 백성을 가리키는 표준 قومی 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 문맥상 ‘쓸어버리다’는 함께 심판을 당해 제거된다는 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֵּינִי / קֵינִי
  english_pob_choice: the Kenite
  chosen_korean: 겐 사람
  alternatives_korean:
  - 겐 족속
  - 그 겐 사람
  lexicon: HALOT
  rationale: 히브리어의 단수 민족명 표현을 자연스러운 한국어로 옮기되, 집단을 가리키는 대표적 단수라는 점을 살려 ‘겐 사람’으로 처리했습니다.
- source_word: לְכוּ / סֻּרוּ / רְדוּ
  english_pob_choice: Go, turn aside, go down
  chosen_korean: 가서, 돌아서서, 내려가십시오
  alternatives_korean:
  - 가십시오, 비켜서십시오, 내려가십시오
  - 가서, 물러서서, 내려가십시오
  lexicon: HALOT
  rationale: 연속된 세 명령의 동작성을 살리면서, 한국어로는 군사적 회피 동작을 가장 분명하게 드러내는 표현으로 옮겼습니다.
- source_word: מִתּוֹךְ עֲמָלֵקִי
  english_pob_choice: from among the Amalekites
  chosen_korean: 아말렉 사람들 가운데서
  alternatives_korean:
  - 아말렉 가운데서
  - 아말렉 사람들 한가운데서
  lexicon: HALOT
  rationale: ‘가운데서/from among’의 분리 의미를 살리기 위해 한국어의 공간적 표현을 사용했고, 민족명을 자연스럽게 복수화했습니다.
- source_word: פֶּן אֹסִפְךָ עִמּוֹ
  english_pob_choice: lest I sweep you away with them
  chosen_korean: 그들과 함께 당신을 쓸어버릴까 합니다
  alternatives_korean:
  - 그들과 함께 당신을 멸할까 합니다
  - 그들과 함께 당신을 거두어 갈까 합니다
  lexicon: HALOT
  rationale: אֹסִף의 심판 문맥상 ‘제거하다/쓸어버리다’의 뉘앙스를 살려, 단순한 ‘거두다’보다 경고의 강도를 드러냈습니다.
- source_word: חֶסֶד
  english_pob_choice: covenant loyalty
  chosen_korean: 인애
  alternatives_korean:
  - 자비
  - 친절
  - 언약적 신실함
  lexicon: HALOT
  rationale: 이 문맥에서는 단순 친절보다 이스라엘에게 베푼 충실한 호의를 가리키므로, 한국어 성서어휘로는 ‘인애’가 가장 압축적이고 본문에 가깝습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: all the sons of Israel
  chosen_korean: 모든 이스라엘 자손
  alternatives_korean:
  - 모든 이스라엘 사람들
  - 모든 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 قومی 표현을 유지해, 민족적 공식어법을 살렸습니다.
theological_decisions:
- issue: חֶסֶד의 한국어 신학적 뉘앙스
  chosen_reading: 인애
  alternative_readings:
  - 자비
  - 친절
  - 언약적 신실함
  rationale: 사울이 겐 사람들을 보존하는 근거가 되는 과거의 행위를 설명하므로, 하나님의 속성으로 제한하지 않으면서도 관계적 충실함을 담는 전통적 한국어 성서어휘를 선택했습니다.
  doctrine_reference: 번역 철학 §5, 핵심어 일관성
- issue: 사울의 경고 동사 אֹסִף의 강도
  chosen_reading: 쓸어버리다
  alternative_readings:
  - 멸하다
  - 거두어 가다
  rationale: 문맥은 함께 재앙을 당할 위험을 경고하는 것이므로, 심판적 제거의 의미를 분명히 해야 본문의 긴박감이 살아납니다.
  doctrine_reference: 번역 철학 §6, 가독성과 원문의 강도 보존
