  - 이제 떠나서
  lexicon: HALOT
  rationale: 시작 명령을 한국어로 자연스럽고 직접적으로 옮기되, 시간표지와 이동 명령의 연속성을 유지했습니다.
- source_word: וְהַחֲרַמְתֶּם
  english_pob_choice: devote to destruction
  chosen_korean: 진멸하십시오
  alternatives_korean:
  - 완전히 멸하십시오
  - 저주 아래 두십시오
  lexicon: HALOT
  rationale: ḥerem의 제의적·심판적 뉘앙스를 살리면서도, 현대 한국어에서 문맥상 분명한 공적 명령으로 읽히게 했습니다.
- source_word: מֵאִישׁ עַד אִשָּׁה / מֵעֹלֵל וְעַד יוֹנֵק / מִשּׁוֹר וְעַד שֶׂה / מִגָּמָל וְעַד חֲמוֹר
  english_pob_choice: from man to woman, from child to nursing infant, from ox to sheep, from camel to donkey
  chosen_korean: 사람에서 여자까지, 아이에서 젖먹이까지, 소에서 양까지, 낙타에서 나귀까지
  alternatives_korean:
  - 남자에서 여자까지, 어린아이에서 젖먹이까지, 소에서 양까지, 낙타에서 나귀까지
  - 사람과 여자, 아이와 젖먹이, 소와 양, 낙타와 나귀
  lexicon: HALOT
  rationale: 히브리어의 총체적 대구를 한국어의 '에서 …까지' 구조로 재현해 범위의 완전성을 드러냈습니다. '사람'은 מֵאִישׁ의 분배적 총칭을 자연스럽게 살린 표현입니다.
- source_word: עֲמָלֵק
  english_pob_choice: Amalek
  chosen_korean: 아말렉
  alternatives_korean:
  - 아말렉 족속
  - 아말렉 사람들
  lexicon: HALOT
  rationale: 고유명사의 히브리어 형태를 따라 음역했고, 본문 자체의 단수형을 유지했습니다.
theological_decisions:
- issue: ḥerem 전쟁 언어의 강도
  chosen_reading: 진멸하십시오
  alternative_readings:
  - 완전히 멸하십시오
  - 진멸하라
  rationale: 단순한 군사적 패배가 아니라 여호와의 심판 아래 바쳐지는 파괴 명령이라는 긴장을 본문 수준에서 드러내기 위해, 강한 명령형과 제의적 함의를 함께 살렸습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 단수형 아말렉과 대명사 대응
  chosen_reading: 아말렉 … 그에게 속한 모든 것
  alternative_readings:
  - 아말렉 족속 … 그들에게 속한 모든 것
  rationale: 히브리어가 집단을 단수로 다루는 방식을 보존하여, 본문의 문법적 형식과 청중이 받아들였을 집단적 지시를 함께 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §5
