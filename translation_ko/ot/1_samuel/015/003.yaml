base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/003.yaml
  text: Now go and strike Amalek[a], and devote to destruction all that belongs to him. Do not spare him, but put to death from man to woman, from child to nursing infant, from ox to sheep[b], from camel to donkey.
  footnotes:
  - marker: a
    text: Or 'utterly destroy' or 'put under the ban.' The Hebrew verb carries the sense of devoting something irrevocably to destruction under divine judgment.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Amalek' and throughout this verse 'him'; the singular refers to the Amalekite people as a corporate entity.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 가서 아말렉[b]을 치고, 그에게 속한 모든 것을 진멸하십시오[a]. 그를 아끼지 말고, 남자부터 여자까지, 어린아이부터 젖먹이까지, 소부터 양까지, 낙타부터 나귀까지 죽이십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘완전히 멸하십시오’ 또는 ‘파괴에 바치십시오’로 옮길 수 있습니다. 히브리어 동사는 어떤 것을 신적 심판 아래 돌이킬 수 없도록 파괴에 바치는 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘아말렉’과 이 절 전체에서 단수 대명사를 사용합니다. 이 단수형은 아말렉 족속 전체를 가리키는 집합적 표현입니다.
    reason: lexical_alternative
