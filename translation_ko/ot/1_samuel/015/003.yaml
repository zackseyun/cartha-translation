  source_fidelity: 본문의 명령 구조와 아말렉을 단수 집합명사로 취급한 방식은 대체로 잘 반영되었습니다. 그러나 אִישׁ는 ‘사람’보다 ‘남자’로 옮기는 편이 אִשָּׁה(여자)와의 명시적인 짝을 충실히 보존하며, עֹלֵל은 ‘아이’보다 ‘어린아이’가 더 정확합니다. חרם의 각주는 ‘저주’라는 개념으로 좁히지 않고, 파괴에 바쳐짐이라는 의미를 밝혀야 합니다.
  naturalness: ‘사람에서 여자까지’는 현대 표준 한국어에서 짝이 맞지 않고 부자연스럽습니다. ‘남자부터 여자까지’ 및 반복되는 ‘…부터 …까지’가 자연스러운 공적 문체이면서 원문의 총괄 표현을 잘 드러냅니다.
  terminology: ‘진멸하십시오’는 חרם의 엄중한 심판·봉헌 어휘를 비교적 잘 전달합니다. 다만 해당 설명 각주가 아말렉 표지에, 단수 집합명사 설명 각주가 ‘양’ 표지에 붙어 있어 각주 표지가 설명 대상과 맞지 않습니다. ‘진멸’ 각주는 ‘진멸하십시오’에, 단수형 설명은 ‘아말렉’에 붙여야 합니다.
