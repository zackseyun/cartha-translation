  english_pob_choice: fight against them until they are consumed
  chosen_korean: 그들이 소멸될 때까지 그들과 싸우라
  alternatives_korean:
  - 그들이 다할 때까지 그들과 싸우라
  - 그들을 완전히 멸할 때까지 그들과 싸우라
  lexicon: WLC / HALOT
  rationale: נלחם은 ‘싸우다’이며, כּלה는 ‘끝나다/소멸되다’이므로 결과 상태를 드러내는 수동 표현 ‘소멸될 때까지’로 옮겨 총체적 종결을 보존했습니다.
