  lexicon: WLC / HALOT
  rationale: חרם의 기술적 의미인 ‘저주 아래 바쳐 멸하다’를 살리기 위해, 단순한 ‘죽이다’보다 의례적·신학적 긴장이 남는 ‘멸하기로 바치고’로 옮겼습니다.
- source_word: הַחַטָּאִים אֶת עֲמָלֵק
  english_pob_choice: the sinners, the Amalekites
  chosen_korean: 그 죄인들, 곧 아말렉
  alternatives_korean:
  - 죄인들인 아말렉
