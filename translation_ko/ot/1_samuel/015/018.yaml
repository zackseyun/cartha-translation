base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/018.yaml
  text: And Yahweh sent you on a mission and said[a], ‘Go and devote the sinners, the Amalekites, to destruction[b], and fight against them until they are consumed.’
  footnotes:
  - marker: a
    text: Or 'utterly destroy'; the Hebrew verb refers to devoting something to destruction under the ban.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sinners, Amalek,' with 'Amalek' functioning as an appositional identification of 'the sinners.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 당신을 길로[a] 보내시고 말씀하셨습니다. “가서 그 죄인들인 아말렉[b]을 진멸에 바치고[c], 그들을 다 멸할 때까지 그들과 싸우십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘보내다’ 다음에 ‘길/방식’(בְּדָרֶךְ)을 둡니다. 여기서는 파송받은 길 또는 사명의 과정을 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘그 죄인들, 아말렉’이라는 동격 구조를 사용합니다. ‘아말렉’은 이 문맥에서 아말렉 사람들을 가리키는 집단 명칭입니다.
    reason: alternative_reading
  - marker: c
    text: ‘진멸에 바치다’는 히브리어 חרם의 표현으로, 어떤 것을 멸망에 내어 주도록 구별한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֲךָ
  english_pob_choice: sent you
