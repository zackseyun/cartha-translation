  text: And Yahweh sent you on a mission and said[a], ‘Go and devote the sinners, the Amalekites, to destruction[b], and fight against them until they are consumed.’
  footnotes:
  - marker: a
    text: Or 'utterly destroy'; the Hebrew verb refers to devoting something to destruction under the ban.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sinners, Amalek,' with 'Amalek' functioning as an appositional identification of 'the sinners.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 당신을 길로 보내시며 말씀하셨습니다[a]. ‘가서 그 죄인들, 곧 아말렉을 멸하기로 바치고[b], 그들이 소멸될 때까지 그들과 싸우라.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘보내다’ 다음에 ‘길/방식’(בְּדָרֶךְ)을 둡니다. POB의 ‘on a mission’은 그 뜻을 풀어쓴 것입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘그 죄인들, 아말렉’이라는 동격 구조를 사용합니다. POB처럼 ‘the sinners, the Amalekites’로 풀 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלָחֲךָ
  english_pob_choice: sent you
  chosen_korean: 당신을 보내시며
  alternatives_korean:
  - 당신을 파견하시며
  - 당신을 보내셨고
  lexicon: WLC / HALOT
  rationale: שלח의 기본 뜻은 ‘보내다’이므로, 군더더기 없이 하나님의 파송 행위를 드러내는 ‘보내시며’로 옮겼습니다.
- source_word: בְּדָרֶךְ
  english_pob_choice: on a mission
  chosen_korean: 길로
  alternatives_korean:
  - 임무를 띠고
  - 여정에
  lexicon: WLC / HALOT
  rationale: 문맥상 ‘길/방식/과정’의 관용적 표현이므로, POB의 해석적 ‘on a mission’보다 원문에 더 가까운 ‘길로’를 택해 파송의 방향성을 살렸습니다.
- source_word: וְהַחֲרַמְתָּה
  english_pob_choice: devote ... to destruction
  chosen_korean: 멸하기로 바치고
  alternatives_korean:
  - 진멸하고
  - 진멸하도록 바치고
  - 멸망시키고
  lexicon: WLC / HALOT
  rationale: חרם의 기술적 의미인 ‘저주 아래 바쳐 멸하다’를 살리기 위해, 단순한 ‘죽이다’보다 의례적·신학적 긴장이 남는 ‘멸하기로 바치고’로 옮겼습니다.
- source_word: הַחַטָּאִים אֶת עֲמָלֵק
  english_pob_choice: the sinners, the Amalekites
  chosen_korean: 그 죄인들, 곧 아말렉
  alternatives_korean:
  - 죄인들인 아말렉
  - 그 죄인들, 아말렉
  lexicon: WLC / HALOT
  rationale: 히브리어의 병렬적 동격을 반영해 ‘그 죄인들, 곧 아말렉’으로 옮겼고, 집단명 ‘아말렉’을 보존해 원문의 수사적 낙인을 드러냈습니다.
- source_word: וְנִלְחַמְתָּ בוֹ עַד כַּלּוֹתָם אֹתָם
  english_pob_choice: fight against them until they are consumed
  chosen_korean: 그들이 소멸될 때까지 그들과 싸우라
  alternatives_korean:
  - 그들이 다할 때까지 그들과 싸우라
  - 그들을 완전히 멸할 때까지 그들과 싸우라
  lexicon: WLC / HALOT
  rationale: נלחם은 ‘싸우다’이며, כּלה는 ‘끝나다/소멸되다’이므로 결과 상태를 드러내는 수동 표현 ‘소멸될 때까지’로 옮겨 총체적 종결을 보존했습니다.
theological_decisions:
