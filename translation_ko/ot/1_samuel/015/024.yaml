translation:
  language: ko
  text: 사울이 사무엘에게 말했습니다. “내가 죄를 지었습니다. 내가 야훼의 명령[a]과 당신의 말을 어겼기 때문입니다. 내가 백성을 두려워하여 그들의 말에 귀를 기울였습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 “야훼의 입”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어를 직역하면 “그들의 목소리에 귀를 기울였습니다”입니다. 또는 “그들에게 순종했습니다”로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  english_pob_choice: I have sinned
  chosen_korean: 내가 죄를 지었습니다
  alternatives_korean:
  - 내가 죄를 지었습니다
  - 내가 죄를 지었나이다
  lexicon: HALOT
  rationale: 완료된 잘못에 대한 사울의 직접 고백이므로, 현재완료의 함의는 자연스러운 한국어로 옮기되 합쇼체를 유지했습니다.
- source_word: עָבַרְתִּי
  english_pob_choice: I transgressed
  chosen_korean: 어겼기 때문입니다
  alternatives_korean:
  - 범하였기 때문입니다
  - 위반하였기 때문입니다
  - 어겼기 때문입니다
  lexicon: HALOT
  rationale: 문맥상 단순한 이동이 아니라 신적 지시를 어긴 행위이므로, 법적·도덕적 위반을 드러내는 ‘어기다’로 옮겼습니다.
- source_word: פִּי יְהוָה
  english_pob_choice: the command of Yahweh
  chosen_korean: 야훼의 명령
  alternatives_korean:
  - 야훼의 입
  - 야훼의 말씀
  - 야훼의 명령
  lexicon: HALOT
  rationale: 직역하면 ‘야훼의 입’이지만, 이 관용구는 구체적 지시를 가리키므로 본문 의미를 분명히 하는 ‘명령’으로 옮겼습니다.
- source_word: בְּקוֹלָם
  english_pob_choice: their voice
  chosen_korean: 그들의 소리
  alternatives_korean:
  - 그들의 음성
  - 그들에게 순종했습니다
  - 그들의 소리
  lexicon: HALOT
  rationale: 히브리어의 ‘소리/음성’ 표현을 살려, 앞의 야훼의 ‘명령’과 대조되는 청종 대상을 드러냈습니다.
theological_decisions:
- issue: יהוה의 음역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본 자료의 표준 원칙에 따라 신명기적 고유명사를 제목어로 대체하지 않고 ‘야훼’로 음역해, 언약 이름의 직접성을 보존했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: 직접 화법의 존대
  chosen_reading: 사무엘에게 말했습니다 … 당신의 말
  alternative_readings:
  - 사무엘에게 말하였습니다 … 네 말
  rationale: 서술문은 합쇼체를 유지하고, 인용문 안에서는 상대를 향한 정중한 2인칭 ‘당신’을 사용해 공개 고백의 정중한 어조를 반영했습니다.
  doctrine_reference: Korean target style guidance
