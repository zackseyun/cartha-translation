- from: 사울이 사무엘에게 말했습니다. “내가 죄를 지었습니다. 내가 야훼의 명령과 당신의 말을 어겼기 때문입니다. 내가 백성을 두려워하여 그들의 소리를 들었습니다.”[a][b]
  to: 사울이 사무엘에게 말했습니다. “내가 죄를 지었습니다. 내가 야훼의 명령[a]과 당신의 말을 어겼기 때문입니다. 내가 백성을 두려워하여 그들의 말에 귀를 기울였습니다.[b]”
  rationale: 히브리어 관용구 שׁמע בקול을 현대 한국어에서 자연스럽게 전달하도록 ‘그들의 말에 귀를 기울였습니다’로 수정했습니다. 이는 ‘목소리’를 듣는 원문의 표현을 보존하면서도 그들의 요구를 따랐다는 문맥적 함의를 유지합니다. 각주 표지를 해당 어구에 붙이고, b 각주에서 직역과 가능한 의미역을 구별했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:17:51Z'
