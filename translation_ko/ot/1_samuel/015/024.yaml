  source_fidelity: 전반적으로 히브리어의 고백 구조와 핵심 어휘를 충실히 반영합니다. 다만 בְּקוֹלָם은 단순히 소리를 물리적으로 들었다는 뜻이 아니라 ‘그들의 목소리/말을 듣고 따르다’라는 문맥적 의미를 지니므로, ‘그들의 소리를 들었습니다’는 한국어에서 의미가 약하거나 부자연스럽습니다.
  naturalness: 합쇼체 서술과 직접 화법은 자연스럽습니다. 그러나 ‘그들의 소리를 들었습니다’는 이 문맥에서 자연스럽지 않으므로 ‘그들의 말에 귀를 기울였습니다’로 고치는 것이 적절합니다. 각주 표지도 해당 어구 바로 뒤에 배치해야 합니다.
  terminology: ‘야훼’, ‘명령’, ‘죄를 지었습니다’, ‘어겼습니다’는 적절합니다. ‘당신의 말’은 원문의 2인칭 소유 표현을 유지하며, 본 절의 정중한 직접 화법 안에서 허용됩니다.
