  text: Saul came to the city of Amalek and lay in wait in the wadi[a][b][c].
  footnotes:
  - marker: a
    text: Or 'set an ambush in the wadi'; the Hebrew verb here is difficult and has also been understood as 'contended' or 'strove,' but the context favors an ambush-like sense.
    reason: lexical_alternative
  - marker: b
    text: '''Wadi'' refers to a streambed or ravine that may be dry except in the rainy season.'
    reason: cultural_note
  - marker: c
    text: Or 'the city of the Amalekites.'
    reason: alternative_reading
translation:
  language: ko
  text: 사울은 아말렉의 성읍에 이르러 그 와디에서 매복했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그 와디에서 매복을 준비했다'. 여기의 히브리어 동사의 의미는 불확실하며, '다투다' 또는 '맞서다'로 이해되기도 합니다. 그러나 문맥은 매복과 같은 의미를 뒷받침합니다.
    reason: lexical_alternative
  - marker: b
    text: '''와디''는 비가 오는 계절에만 물이 흐를 수 있는 하천 바닥이나 협곡을 가리킵니다.'
    reason: cultural_note
  - marker: c
    text: 또는 '아말렉 사람들의 성읍'.
    reason: alternative_reading
