  - 아말렉 사람들의 성읍
  lexicon: HALOT
  rationale: 히브리어의 소유/연결 관계를 살리면서도 한국어 서사체에서 자연스럽게 들리는 직역에 가깝게 옮겼습니다.
- source_word: וַיָּרֶב
  english_pob_choice: lay in wait
  chosen_korean: 매복했습니다
  alternatives_korean:
  - 숨어 기다렸습니다
  - 기습하려고 기다렸습니다
  - 다투었습니다
  lexicon: HALOT
  rationale: 문맥상 군사적 기습 대기를 뜻하는 것으로 보이므로, '매복'이 가장 직접적이고 오해가 적습니다.
- source_word: בַּנָּחַל
  english_pob_choice: in the wadi
  chosen_korean: 그 와디에
  alternatives_korean:
  - 그 골짜기에
  - 그 시내바닥에
  - 그 협곡에
  lexicon: HALOT
  rationale: נחל의 지리적 의미를 살려 '와디'를 유지하되, 문맥상 특정 장소를 가리키는 지시를 반영해 '그'를 붙였습니다.
theological_decisions:
- issue: וַיָּרֶב의 의미가 'contended/strove'일 가능성
  chosen_reading: 군사적 매복으로 읽어 본문 흐름을 따랐습니다.
  alternative_readings:
  - 사울이 그곳에서 다투었습니다
  - 사울이 그곳에서 맞섰습니다
  rationale: 바로 앞뒤 문맥과 POB의 주해가 이 동사를 전술적 매복으로 이해하는 쪽이 더 적절하다고 보므로, 한국어 본문도 그 긴장을 드러냈습니다.
  doctrine_reference: 본문 비평/주해상 어휘 결정
