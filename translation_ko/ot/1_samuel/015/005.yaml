base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/005.yaml
  text: Saul came to the city of Amalek and lay in wait in the wadi[a][b][c].
  footnotes:
  - marker: a
    text: Or 'set an ambush in the wadi'; the Hebrew verb here is difficult and has also been understood as 'contended' or 'strove,' but the context favors an ambush-like sense.
    reason: lexical_alternative
  - marker: b
    text: '''Wadi'' refers to a streambed or ravine that may be dry except in the rainy season.'
    reason: cultural_note
  - marker: c
    text: Or 'the city of the Amalekites.'
    reason: alternative_reading
translation:
  language: ko
  text: 사울이 아말렉의 성읍에 이르러 그 와디에 매복했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그 와디에 매복하다'. 여기의 히브리어 동사는 뜻이 어려워 '다투다', '맞서다'로도 이해될 수 있지만, 문맥상 매복의 의미가 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: '''와디''는 비가 오는 계절에만 물이 흐를 수 있는 하천바닥이나 협곡을 가리킵니다.'
    reason: cultural_note
  - marker: c
    text: 또는 '아말렉 사람들의 성읍'.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא ... עַד
  english_pob_choice: came to
  chosen_korean: 이르러
  alternatives_korean:
  - 왔습니다
  - 도착했습니다
  lexicon: HALOT
  rationale: 이동의 종착점을 간결하게 나타내며, 서사 흐름을 자연스러운 현대 한국어로 살립니다.
- source_word: עִיר עֲמָלֵק
  english_pob_choice: the city of Amalek
  chosen_korean: 아말렉의 성읍
  alternatives_korean:
