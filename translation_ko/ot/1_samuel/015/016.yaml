translation:
  language: ko
  text: 그러자 사무엘이 사울에게 말했습니다. “그만하십시오. 야훼께서 지난밤에 저에게 말씀하신 것을 당신에게 알려 드리겠습니다.” 그러자 사울이 그에게 말했습니다[a]. “말하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 자음본문은 “그들이 그에게 말했습니다”라고 읽힙니다. 그러나 문맥상 응답자는 사울 한 사람이므로, 단수로 읽는 전통적 읽기와 문맥을 따라 “사울이 그에게 말했습니다”로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: הֶרֶף
  english_pob_choice: Stop
  chosen_korean: 그만하십시오
  alternatives_korean:
  - 멈추십시오
  - 그만두십시오
  - 그쳐 주십시오
  lexicon: HALOT
  rationale: 상대의 말을 끊고 중지시키는 강한 명령이므로, 부드러운 ‘기다리십시오’보다 직접적인 ‘그만하십시오’가 문맥의 제지 어감을 잘 살립니다.
- source_word: וְאַגִּידָה לְּךָ
  english_pob_choice: and I will tell you
  chosen_korean: 제가 당신에게 들려드리겠습니다
  alternatives_korean:
  - 제가 당신에게 말하겠습니다
  - 제가 당신에게 알려드리겠습니다
  - 제가 당신에게 전하겠습니다
  lexicon: HALOT
  rationale: נגד의 ‘알리다/전하다’ 의미를 살리면서, 대화 속 구두 전달을 자연스럽게 드러내기 위해 ‘들려드리겠습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 이 절의 한국어 본문은 교회권에서 널리 읽히는 고유명사 형태를 따른 본문 가독성을 우선해 ‘여호와’를 사용했습니다. 다만 프로젝트 기본값인 ‘야훼’와의 긴장은 주석으로 남겼습니다.
- source_word: הַלָּיְלָה
  english_pob_choice: last night
  chosen_korean: 지난밤에
  alternatives_korean:
  - 어젯밤에
  - 밤에
  - 그 밤에
  lexicon: HALOT
  rationale: 서사 기준으로 직전 밤을 가리키므로, 현대 한국어에서 가장 자연스러운 ‘지난밤에’가 적절합니다.
- source_word: וַיֹּאמְרוּ לוֹ
  english_pob_choice: And he said to him
  chosen_korean: 그러자 그가 그에게 말했습니다
  alternatives_korean:
  - 그러자 그들이 그에게 말했습니다
  - 그러자 그가 말했습니다
  lexicon: HALOT
  rationale: 히브리어 표면형은 복수이지만, 문맥상 사울의 단수 응답이 요구되므로 의미를 따라 단수로 옮겼습니다.
theological_decisions:
- issue: 여호와(יהוה)의 표기
  chosen_reading: 본문에는 ‘여호와’를 두고, 주석에서 원문 האלוה적 이름의 대응을 드러냅니다.
  alternative_readings:
  - 야훼를 본문에 직접 표기
  - 주(主)로 대치
  rationale: 원문 고유명사를 가리되 한국어 독자에게 즉시 인식되는 표기를 우선하되, 번역 전통과 프로젝트 기본값 사이의 차이는 추적 가능하게 남기는 것이 바람직합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
