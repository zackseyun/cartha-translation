  text: Then Samuel said to Saul[a], “Stop, and I will tell you what Yahweh said to me last night.” And he said to him, “Speak.”
  footnotes:
  - marker: a
    text: 'Hebrew written form has ''and they said to him''; context indicates the speaker is Saul, so the sense is singular: ''and he said to him.'''
