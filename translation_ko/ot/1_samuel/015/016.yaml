  source_fidelity: 대체로 원문에 충실합니다. הֶרֶף의 제지 명령, 지난밤의 시간 지시, 그리고 문맥상 사울의 단수 응답을 잘 반영했습니다. 다만 יהוה는 영어 POB 감사 기록과 프로젝트의 정해진 표기 원칙에 따라 ‘야훼’로 통일하는 것이 필요합니다. 또한 논쟁적인 복수 표면형은 본문에서 문맥상 단수로 옮기되 각주에서 명시하는 방식이 적절합니다.
  naturalness: 합쇼체는 일관되어 있으며 자연스럽습니다. 그러나 ‘그러자 그가 그에게’는 한국어에서 지시 대상이 불필요하게 모호하고 어색하므로 ‘그러자 사울이 그에게’로 명시하는 편이 좋습니다. ‘들려드리겠습니다’도 가능하나, 계시의 내용을 전달한다는 문맥에는 ‘알려 드리겠습니다’가 더 직접적입니다.
  terminology: ‘사무엘’, ‘사울’, ‘야훼’는 적절합니다. 신명 יהוה는 POB의 원어 기반 표기 및 영어 감사 기록의 ‘Yahweh’와 대응하도록 ‘야훼’로 해야 합니다. 하나님을 가리키는 ‘말씀하신’은 한국어 성서 문체에서 자연스럽고, 본문 의미를 과도하게 해석하지 않습니다.
  issues:
