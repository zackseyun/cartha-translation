base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/004.yaml
  text: 'So Saul summoned the people and mustered them at Telaim: two hundred thousand foot soldiers[a], and ten thousand men of Judah.'
  footnotes:
  - marker: a
    text: Or possibly, 'with lambs,' if בַּטְּלָאִים is taken literally rather than as the place name Telaim.
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 사울은 백성을 소집하고, 그들을 테라임에서 계수하였습니다. 이십만 명의 보병과 유다 사람 만 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어린 양들과 함께’로도 읽을 수 있습니다. בַּטְּלָאִים을 장소명 ‘테라임’이 아니라 문자적으로 이해한 경우입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁמַּע
  english_pob_choice: summoned
  chosen_korean: 소집하고
  alternatives_korean:
  - 불러 모으고
  - 소집하였습니다
  lexicon: HALOT
  rationale: 군사적 문맥에서 단순한 ‘듣게 하다’보다 백성을 불러 모으는 의미가 강하므로, 자연스러운 현대 한국어로 ‘소집하다’를 택했습니다.
- source_word: וַיִּפְקְדֵם
  english_pob_choice: mustered them
  chosen_korean: 계수하였습니다
  alternatives_korean:
  - 점검하였습니다
  - 소집 인원을 확인하였습니다
  lexicon: HALOT
  rationale: פקד은 군사적 맥락에서 병력을 점검·집계하는 뜻이므로, 인원 파악을 드러내는 ‘계수하다’로 옮겼습니다.
- source_word: בַּטְּלָאִים
  english_pob_choice: at Telaim
  chosen_korean: 테라임에서
  alternatives_korean:
  - 어린 양들과 함께
  - 테라임 안에서
  lexicon: HALOT
  rationale: 문맥상 장소명으로 읽는 것이 가장 자연스럽기 때문에, 지명으로 처리하여 ‘테라임에서’로 번역했습니다.
- source_word: רַגְלִי
  english_pob_choice: foot soldiers
  chosen_korean: 보병
  alternatives_korean:
  - 보병들
  - 걸어서 싸우는 병사들
  lexicon: HALOT
  rationale: 직역인 ‘발 병사’보다는 군사적 의미가 분명한 현대 한국어 ‘보병’이 자연스럽고, 원문의 대조적 병력 집계를 잘 드러냅니다.
theological_decisions:
- issue: 지명 읽기와 문자적 대안
  chosen_reading: בַּטְּלָאִים은 ‘테라임’이라는 지명으로 읽었습니다.
  alternative_readings:
  - ‘어린 양들과 함께’로 읽는 문자적 해석
  rationale: 본문은 병력 집계와 이동 경로를 서술하므로 장소명으로 읽는 것이 문맥상 가장 일관됩니다. 다만 히브리어 형태상 문자적 대안이 가능하여 주석으로 남깁니다.
  doctrine_reference: 본문비평/주해적 판단
