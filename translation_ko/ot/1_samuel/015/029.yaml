source:
  edition: WLC
  text: וְ/גַם֙ נֵ֣צַח יִשְׂרָאֵ֔ל לֹ֥א יְשַׁקֵּ֖ר וְ/לֹ֣א יִנָּחֵ֑ם כִּ֣י לֹ֥א אָדָ֛ם ה֖וּא לְ/הִנָּחֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/029.yaml
  text: Moreover[a], the Glory of Israel will not lie, nor will he relent, for he is not a man[b], that he should relent.
  footnotes:
  - marker: a
    text: Or 'the Eternal One of Israel,' 'the Strength of Israel,' or 'the Victory of Israel.' The Hebrew title has a broad semantic range.
    reason: lexical_alternative
  - marker: b
    text: Or 'nor will he change his mind' / 'nor will he be sorry.'
    reason: lexical_alternative
translation:
  language: ko
  text: 더욱이 이스라엘의 영광은 거짓말하지 않으시며, 뜻을 돌이키지도 않으십니다. 그는 사람이 아니시니, 뜻을 돌이키실 리가 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이스라엘의 칭호 נֵצַח는 ‘영광’, ‘영원하신 분’, ‘능력’, ‘승리’ 등 넓은 의미 범위를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘뜻을 바꾸지 않으시며’ / ‘후회하지 않으십니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם / moreover
  english_pob_choice: Moreover
  chosen_korean: 더욱이
  alternatives_korean:
  - 또한
  - 더구나
  lexicon: HALOT
  rationale: 추가적이며 강조적인 연결을 자연스러운 현대 한국어로 살리기 위해 '더욱이'를 택했습니다.
- source_word: נֵצַח יִשְׂרָאֵל
  english_pob_choice: the Glory of Israel
  chosen_korean: 이스라엘의 영광
  alternatives_korean:
  - 이스라엘의 영원하신 분
  - 이스라엘의 능력
  - 이스라엘의 승리
  lexicon: HALOT
  rationale: נֵצַח의 의미 범위가 넓으므로, 위엄 있는 칭호로서의 성격을 유지하는 '이스라엘의 영광'을 본문에 두고, 다른 가능성은 열어 두었습니다.
- source_word: יְשַׁקֵּר / וְלֹא יִנָּחֵם / לְהִנָּחֵם
  english_pob_choice: will not lie, nor will he relent / that he should relent
  chosen_korean: 거짓말하지 않으시며, 뜻을 돌이키지도 않으십니다 / 뜻을 돌이키실 리가 없습니다
  alternatives_korean:
  - 속이지 않으시며, 후회하지도 않으십니다
  - 거짓이 없으시며, 마음을 바꾸지도 않으십니다
  lexicon: HALOT
  rationale: 앞의 יְשַׁקֵּר와 뒤의 נָחַם 계열을 각각 구별하면서도, 반복되는 동사를 한국어에서 자연스럽게 '뜻을 돌이키다'로 통일해 본문의 수사와 대조를 살렸습니다.
- source_word: לֹא אָדָם הוּא
  english_pob_choice: for he is not a man
  chosen_korean: 그는 사람이 아니시니
  alternatives_korean:
  - 그분은 인간이 아니시니
  - 그는 사람과 같지 않으시니
  lexicon: HALOT
  rationale: 하나님과 인간의 대조를 직접적으로 드러내기 위해 직역에 가까운 형태를 취했습니다.
theological_decisions:
- issue: 하나님의 변개 불가/신실하심을 한국어에서 어떻게 표현할지
  chosen_reading: '''뜻을 돌이키지 않으십니다''와 ''뜻을 돌이키실 리가 없습니다''로 두 번의 נָחַם을 구별하되, 본문이 말하는 사울 왕권 철회 문맥의 신실함에 초점을 두었습니다.'
  alternative_readings:
  - '''후회하지 않으십니다'''
  - '''마음을 바꾸지 않으십니다'''
  rationale: 본문은 추상적 형이상학보다 하나님의 말씀이 번복되지 않음을 강조하므로, '돌이키다'를 사용해 문맥적 의미를 살리면서도 인간적 변덕으로 오해되지 않게 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: 이스라엘의 칭호 נֵצַח의 모호성 유지
  chosen_reading: 본문에는 '이스라엘의 영광'을 두고, 의미 범위가 넓다는 점은 주석 없이도 과도하게 확정하지 않았습니다.
  alternative_readings:
  - '''이스라엘의 영원하신 분'''
  - '''이스라엘의 능력'''
  - '''이스라엘의 승리'''
  rationale: 히브리어 칭호의 다의성을 단일 교리 표현으로 좁히지 않고, 존엄한 칭호로 번역해 원문의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
