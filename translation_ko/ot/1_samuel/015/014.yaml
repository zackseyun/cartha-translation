source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל וּ/מֶ֛ה קֽוֹל הַ/צֹּ֥אן הַ/זֶּ֖ה בְּ/אָזְנָ֑/י וְ/ק֣וֹל הַ/בָּקָ֔ר אֲשֶׁ֥ר אָנֹכִ֖י שֹׁמֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/014.yaml
  text: But Samuel said[a], “Then what is this sound of sheep in my ears, and the sound of cattle that I hear?”
  footnotes:
  - marker: a
    text: Or “voice” instead of “sound” for both occurrences of Hebrew qol; here it refers to the audible noise made by the animals.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 사무엘이 말했습니다. 「그러면 내 귀에 들리는 이 양의 소리는 무엇이며, 내가 듣는 소 떼의 소리는 무엇입니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 qol은 여기서 동물들이 내는 들리는 소리를 가리키므로 ‘소리’로 옮겼습니다. ‘목소리’도 가능한 직역이지만 문맥상 적절하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל
  english_pob_choice: But Samuel said
  chosen_korean: 그러자 사무엘이 말했습니다
  alternatives_korean:
  - 그리고 사무엘이 말했습니다
  - 사무엘이 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 진행성과 앞선 사울의 주장에 대한 반박성을 살려 ‘그러자’로 옮기고, 표준적 서술 동사 ‘말했습니다’를 사용했습니다.
- source_word: וּמֶה קוֹל
  english_pob_choice: Then what is this sound
  chosen_korean: 그러면 … 소리는 무엇이며
  alternatives_korean:
  - 그런데 … 소리는 무엇이며
  - 무슨 … 소리이며
  lexicon: HALOT
  rationale: 히브리어의 질문 연결과 수사적 반문을 살리기 위해 ‘그러면’을 사용했고, קוֹל은 여기서 동물의 들리는 소리를 가리키므로 ‘소리’로 옮겼습니다.
- source_word: הַצֹּאן / הַבָּקָר
  english_pob_choice: sheep / cattle
  chosen_korean: 양 / 소 떼
  alternatives_korean:
  - 양 떼 / 가축
  - 양 / 가축
  lexicon: HALOT
  rationale: צֹאן은 양과 염소를 포괄하지만 문맥상 ‘양’이 가장 자연스럽고, בָּקָר은 집합적 ‘소 떼’로 옮겨 대조를 분명히 했습니다.
- source_word: בְּאָזְנָי
  english_pob_choice: in my ears
  chosen_korean: 내 귀에
  alternatives_korean:
  - 내 귀 속에
  - 내 귀로
  lexicon: HALOT
  rationale: ‘귀에’는 히브리어의 신체 이미지와 감각적 생생함을 비교적 직접적으로 보존합니다.
theological_decisions:
- issue: 사무엘의 반문 어조
  chosen_reading: 사무엘의 말은 단순 정보 요청이 아니라 사울의 불순종을 드러내는 수사적 반문으로 읽었습니다.
  alternative_readings:
  - 중립적인 확인 질문으로 읽기
  - 강한 꾸짖음으로만 과장하기
  rationale: 앞뒤 문맥에서 제사와 전리품 보존의 모순을 지적하는 자리이므로, 한국어에서도 반문 성격이 드러나도록 했습니다.
  doctrine_reference: 본문 문맥 주해
