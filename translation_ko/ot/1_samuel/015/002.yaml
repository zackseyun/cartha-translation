revisions:
- from: 야훼 만군의 하나님께서 이렇게 말씀하십니다. 「내가 아말렉이 이스라엘에게 한 일을 살펴보았으니, 곧 그가 길에서, 그가 이집트에서 올라올 때 그를 대적한 일입니다.」[a][b][c]
  to: 만군의 야훼께서 이렇게 말씀하십니다. “나는 아말렉이 이스라엘에게 한 일, 곧 이스라엘이 이집트에서 올라올 때 아말렉이 길에서 그를 대적한 일을 살펴보았습니다.[a][b][c]”
  rationale: The revision removes the unsupported addition in the divine title, recasts the relative clauses into idiomatic Korean while retaining the source’s collective-singular reference, and uses consistent 합쇼체 in the direct speech. It also corrects note content and places the note anchors at the relevant lexical points.
  reviewer_model: gpt-5.6-terra
