id: 1SA.15.2
reference: 1 Samuel 15:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת פָּקַ֕דְתִּי אֵ֛ת אֲשֶׁר עָשָׂ֥ה עֲמָלֵ֖ק לְ/יִשְׂרָאֵ֑ל אֲשֶׁר שָׂ֥ם ל/וֹ֙ בַּ/דֶּ֔רֶךְ בַּ/עֲלֹת֖/וֹ מִ/מִּצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/002.yaml
  text: 'Thus says Yahweh of hosts: ‘I have taken note of what Amalek did to Israel[c][b][a], how he opposed him on the way when he came up from Egypt.’'
  footnotes:
  - marker: a
    text: Or, “I have punished for what Amalek did to Israel,” or “I have remembered what Amalek did to Israel.” The Hebrew verb can carry the sense of attending to, remembering, or visiting with judgment.
    reason: lexical_alternative
  - marker: b
    text: Or, “how he opposed him on the way”; possibly, “how he lay in wait for him on the way.” The Hebrew expression refers to Amalek’s hostile action against Israel during the exodus journey.
    reason: lexical_alternative
  - marker: c
    text: “Him” refers to Israel as a collective singular.
    reason: cultural_note
translation:
  language: ko
  text: 만군의 야훼께서 이렇게 말씀하십니다. “나는 아말렉이 이스라엘에게 한 일, 곧 이스라엘이 이집트에서 올라올 때 아말렉이 길에서 그를 대적한 일을 살펴보았습니다.[a][b][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 아말렉이 이스라엘에게 한 일을 기억하였습니다’ 또는 ‘... 심판하였습니다’로 옮길 수 있습니다. 히브리어 동사는 주의를 기울이다, 기억하다, 또는 심판을 위해 개입하다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아말렉이 길에서 그를 기다려 습격한 일’로 옮길 수 있습니다. 히브리어 표현은 출애굽 여정 중 아말렉이 이스라엘에게 보인 적대 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그’는 집합적 단수로 쓰인 이스라엘을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה צְבָאֹות
  english_pob_choice: Yahweh of hosts
  chosen_korean: 야훼 만군의 하나님
  alternatives_korean:
  - 야훼 만군의 주
  - 야훼 군대의 하나님
  lexicon: HALOT
  rationale: יהוה는 본항의 기본 원칙에 따라 야훼로 옮기고, צְבָאוֹת은 ‘만군의’로 처리해 하나님의 호칭으로 자연스럽게 연결했습니다.
- source_word: פָּקַדְתִּי
  english_pob_choice: I have taken note of
  chosen_korean: 내가 ... 살펴보았으니
  alternatives_korean:
  - 내가 ... 기억하였으니
  - 내가 ... 벌하였으니
  - 내가 ... 돌보았으니
  lexicon: HALOT
  rationale: פּקד은 문맥상 단순 기억보다 주의 깊게 살피고 그 행위를 고려하는 뉘앙스를 담으므로, 뒤이어 오는 심판 명령과 구분되도록 ‘살펴보았습니다’로 옮겼습니다.
- source_word: אֲשֶׁר שָׂם לוֹ בַּדֶּרֶךְ
  english_pob_choice: how he opposed him on the way
  chosen_korean: 그가 길에서 ... 그를 대적한 일
  alternatives_korean:
  - 그가 길에서 그를 반대한 일
  - 그가 길에서 그를 매복한 일
  lexicon: HALOT
  rationale: שׂוּם + ל + דרך의 압축된 관용구는 직접적인 적대 행위를 가리키므로, ‘대적하다’로 옮겨 아말렉의 적대성을 분명히 드러냈습니다.
- source_word: בַּעֲלֹתוֹ מִמִּצְרָיִם
  english_pob_choice: when he came up from Egypt
  chosen_korean: 그가 이집트에서 올라올 때
  alternatives_korean:
  - 그가 이집트에서 올라올 무렵
  - 이스라엘이 이집트에서 올라올 때
  lexicon: HALOT
  rationale: ‘올라오다’는 출애굽을 가리키는 표준적 표현이므로 직역을 유지했고, 히브리어의 단수 집합 지시를 한국어에서는 자연스럽게 ‘그가’로 살렸습니다.
theological_decisions:
- issue: פָּקַדְתִּי의 의미를 기억/점검/심판 중 어디에 둘 것인가
  chosen_reading: 하나님이 아말렉의 행위를 ‘살펴보셨다’고 번역해, 기억과 심판의 긴장을 남겼습니다.
  alternative_readings:
  - 내가 아말렉이 이스라엘에게 한 일을 벌하였다
  - 내가 아말렉이 이스라엘에게 한 일을 기억하였다
  rationale: 이 절은 다음 절의 명령을 위한 근거를 제시하므로, 심판을 이 동사에 미리 확정해 넣기보다 하나님이 그 일을 유념하고 계심을 드러내는 표현이 더 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
- issue: ‘이스라엘’에 대한 단수 대명사 처리
  chosen_reading: ‘그를’로 옮겨 집합적 단수의 성격을 보존했습니다.
  alternative_readings:
  - 그들을
  - 이스라엘
  rationale: 히브리어 לוֹ와 뒤따르는 단수 동사는 이스라엘을 집합적 단수로 다루므로, 한국어에서도 단수 대명사로 그 구조를 최대한 반영했습니다.
  doctrine_reference: 문법적 수일치와 집합 명사 처리
