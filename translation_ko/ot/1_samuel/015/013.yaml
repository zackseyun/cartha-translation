  text: וַ/יָּבֹ֥א שְׁמוּאֵ֖ל אֶל שָׁא֑וּל וַ/יֹּ֧אמֶר ל֣/וֹ שָׁא֗וּל בָּר֤וּךְ אַתָּה֙ לַֽ/יהוָ֔ה הֲקִימֹ֖תִי אֶת דְּבַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/013.yaml
  text: Then Samuel came to Saul[a], and Saul said to him, “Blessed are you to Yahweh[b]; I have carried out the word of Yahweh.”
  footnotes:
  - marker: a
    text: Or “Blessed are you of the LORD.” The Hebrew blessing formula can be rendered more literally this way, but “by the LORD” better communicates the sense in contemporary English.
    reason: lexical_alternative
  - marker: b
    text: Or “I have fulfilled” or “I have performed” the word of the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사무엘이 사울에게 왔습니다. 그러자 사울이 그에게 말했습니다. “야훼께 복을 받으신 분이십니다.[a] 저는 야훼의 말씀을 이행했습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 축복 공식 ‘복되다 + 야훼께’는 문자적으로는 “야훼께 복되십니다”로 옮길 수 있습니다. 여기서는 야훼께서 복의 근원이심을 자연스러운 한국어로 나타내어 “야훼께 복을 받으신 분이십니다”로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 הֲקִימֹתִי는 문맥상 “수행했습니다”, “실행했습니다”, 또는 “이루었습니다”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שְׁמוּאֵל אֶל שָׁא֑וּל
  english_pob_choice: Then Samuel came to Saul
  chosen_korean: 그때 사무엘이 사울에게 이르자
  alternatives_korean:
  - 그때 사무엘이 사울에게 왔습니다
  - 그때 사무엘이 사울에게 도착하자
  lexicon: HALOT
  rationale: בוא는 여기서 단순한 도착보다 사울 앞에 이르는 장면이므로, 자연스러운 서술체로 ‘이르자’를 택했습니다.
- source_word: בָּרוּךְ אַתָּה לַֽיהוָה
  english_pob_choice: Blessed are you by Yahweh
  chosen_korean: 야훼께 복되신 분입니다
  alternatives_korean:
  - 야훼께 복을 받으신 분입니다
  - 야훼로 말미암아 복되십니다
  - 야훼께 복되십니다
  lexicon: HALOT
  rationale: 축복 공식의 לַיהוָה를 관계 표지로만 풀기보다, 한국어에서는 ‘~께 복되신’으로 자연스럽게 옮겨 축복 선언의 뜻을 살렸습니다.
- source_word: הֲקִימֹתִי
  english_pob_choice: I have carried out
  chosen_korean: 이행했습니다
  alternatives_korean:
  - 수행했습니다
  - 실행했습니다
  - 이루었습니다
  lexicon: HALOT
  rationale: קום의 히필은 ‘서게 하다/실행되게 하다’의 뜻으로, 여기서는 야훼의 말씀을 실제로 시행했다는 주장이라 ‘이행하다’가 가장 직접적입니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 명령
  - 야훼의 말
  lexicon: HALOT
  rationale: דבר는 여기서 단순한 말보다 이미 주어진 신적 발화를 가리키므로, POB의 ‘word’에 맞춰 ‘말씀’으로 옮겼습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 번역본의 표준 용례를 따라 신적 고유명을 가려 두지 않고 직접 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 축복 공식의 방향
  chosen_reading: ‘야훼께 복되신 분입니다’로, 축복의 수여자와 대상이 모두 보이도록 했습니다.
  alternative_readings:
  - 야훼에 의해 복되신 분입니다
  - 야훼로부터 복을 받으신 분입니다
  rationale: 히브리어 לַיהוָה는 전치사 ל의 축복 공식이라 단순한 소속보다 ‘~께’가 더 적절하며, 사울이 사무엘을 축복하는 발화라는 점을 보존했습니다.
  doctrine_reference: WLC blessing formula ל + divine name
