- from: 그때 사무엘이 사울에게 이르자, 사울이 그에게 말했습니다. “야훼께 복되신 분입니다. 저는 야훼의 말씀을 이행했습니다.”[a][b]
  to: 그때 사무엘이 사울에게 왔습니다. 그러자 사울이 그에게 말했습니다. “야훼께 복을 받으신 분이십니다.[a] 저는 야훼의 말씀을 이행했습니다.[b]”
