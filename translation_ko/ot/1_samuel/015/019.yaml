translation:
  language: ko
  text: 그러면 왜 야훼의 음성에 순종하지 않고 전리품에 덤벼들어, 야훼께서 보시기에 악을 행하였습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전리품에 달려들다’, ‘전리품을 향해 급히 달려가다’로 옮길 수 있습니다. 히브리어 동사는 전리품을 향한 성급하고 탐욕스러운 움직임을 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתָּ בְּקוֹל
  english_pob_choice: obey the voice
  chosen_korean: 음성에 순종하다
  alternatives_korean:
  - 음성을 듣다
  - 음성에 귀를 기울이다
  lexicon: HALOT
  rationale: 명령 맥락에서는 단순 청취보다 순종의 의미가 핵심이므로, ‘순종하다’로 옮겨 순종적 반응을 분명히 했습니다.
- source_word: וַתַּעַט אֶל הַשָּׁלָל
  english_pob_choice: rush upon the spoil
  chosen_korean: 그 전리품에 덤벼들어
  alternatives_korean:
  - 그 전리품에 달려들어
  - 그 약탈물에 들이닥쳐
  lexicon: HALOT
  rationale: 히브리어 동사는 탐욕스럽고 급한 돌진의 뉘앙스를 가지므로, 한국어에서는 ‘덤벼들다’로 그 공격적이고 성급한 움직임을 살렸습니다.
- source_word: הָרַע
  english_pob_choice: what was evil
  chosen_korean: 악한 일
  alternatives_korean:
  - 악을
  - 악한 것
  lexicon: HALOT
  rationale: 문맥상 행위 평가이므로 추상명사 ‘악’보다 행위성을 드러내는 ‘악한 일’이 자연스럽고, 문장의 비난 의도를 잘 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문자적으로 나타난 신명을 한국어 기본값인 ‘야훼’로 옮겨, 전통적 대체표현이 아니라 고유명을 보존했습니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 처리
  chosen_reading: 본문과 절의 반복 모두 ‘야훼’로 유지했습니다.
  alternative_readings:
