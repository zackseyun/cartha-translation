base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/007.yaml
  text: Then Saul struck Amalek[a], from Havilah as you go to Shur[b], which is opposite Egypt.
  footnotes:
  - marker: a
    text: Or 'the Amalekites'; the Hebrew reads 'Amalek,' a collective use of the ancestor-name for the people.
    reason: lexical_alternative
  - marker: b
    text: Or 'which is east of Egypt' or 'which is before Egypt'; the Hebrew expression can denote a location facing or opposite Egypt.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울은 하윌라에서부터 이집트 맞은편에 있는 술[b]로 가는 길까지 아말렉[a]을 쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아말렉 사람들’. 히브리어 ‘아말렉’은 조상 이름을 그 백성 전체를 가리키는 집단명으로 사용한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이집트 동쪽에 있는’ 또는 ‘이집트 앞에 있는’. 히브리어 표현은 이집트를 마주하거나 맞은편에 있는 위치를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  english_pob_choice: struck
  chosen_korean: 쳤습니다
  alternatives_korean:
