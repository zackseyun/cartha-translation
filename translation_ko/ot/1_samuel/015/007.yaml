id: 1SA.15.7
reference: 1 Samuel 15:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֥ךְ שָׁא֖וּל אֶת עֲמָלֵ֑ק מֵֽ/חֲוִילָה֙ בּוֹאֲ/ךָ֣ שׁ֔וּר אֲשֶׁ֖ר עַל פְּנֵ֥י מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/007.yaml
  text: Then Saul struck Amalek[a], from Havilah as you go to Shur[b], which is opposite Egypt.
  footnotes:
  - marker: a
    text: Or 'the Amalekites'; the Hebrew reads 'Amalek,' a collective use of the ancestor-name for the people.
    reason: lexical_alternative
  - marker: b
    text: Or 'which is east of Egypt' or 'which is before Egypt'; the Hebrew expression can denote a location facing or opposite Egypt.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 아말렉을 하윌라에서부터, 곧 당신이 술로 가는 길목, 곧 이집트 앞에 있는 곳까지 쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  english_pob_choice: struck
  chosen_korean: 쳤습니다
  alternatives_korean:
  - 공격했습니다
  - 무찔렀습니다
  - 쳐서 이겼습니다
  lexicon: HALOT
  rationale: נכה는 ‘치다/치다로 무찌르다’의 물리적 동작을 기본으로 하므로, 결과를 과도하게 해석하는 ‘무찔렀습니다’보다 직접적인 ‘쳤습니다’가 원문에 가깝습니다.
- source_word: עֲמָלֵק
  english_pob_choice: Amalek
  chosen_korean: 아말렉
  alternatives_korean:
  - 아말렉 사람들
  - 아말렉 족속
  lexicon: HALOT
  rationale: 히브리어는 집단명으로도 쓰이는 친족명칭을 단수형으로 사용하므로, 본문 밀착성을 살려 고유명 ‘아말렉’으로 옮겼습니다.
- source_word: בּוֹאֲךָ
  english_pob_choice: as you go
  chosen_korean: 당신이 술로 가는 길목
  alternatives_korean:
  - 가는 길에
  - 술로 가는 길에서
  - 술로 가는 도중
  lexicon: HALOT
  rationale: ‘가다’의 관용적 지리 표현을 한국어의 자연스러운 공간 표현으로 풀어, 단순 이동이 아니라 경로를 가리키는 뜻을 드러냈습니다.
- source_word: אֲשֶׁר עַל פְּנֵי מִצְרַיִם
  english_pob_choice: which is opposite Egypt
  chosen_korean: 이집트 앞에 있는 곳
  alternatives_korean:
  - 이집트 맞은편에 있는 곳
  - 이집트 동쪽에 있는 곳
  - 이집트 앞쪽에 있는 곳
  lexicon: HALOT
  rationale: עַל־פְּנֵי는 ‘맞은편/마주한/앞에’의 넓은 의미를 가지므로, 방향을 과도하게 특정하지 않는 ‘앞에 있는 곳’으로 옮겼습니다.
