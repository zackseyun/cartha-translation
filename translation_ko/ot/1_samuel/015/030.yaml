  naturalness: 합쇼체 문장은 자연스럽지만 ‘내 민족의 장로들’은 이 문맥에서 다소 추상적입니다. ‘내 백성의 장로들’과 ‘당신의 하나님이신 야훼께’가 더 자연스럽고 원문의 관계를 분명히 합니다.
