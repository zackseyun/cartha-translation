source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חָטָ֔אתִי עַתָּ֗ה כַּבְּדֵ֥/נִי נָ֛א נֶ֥גֶד זִקְנֵֽי עַמִּ֖/י וְ/נֶ֣גֶד יִשְׂרָאֵ֑ל וְ/שׁ֣וּב עִמִּ֔/י וְ/הִֽשְׁתַּחֲוֵ֖יתִי לַֽ/יהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/030.yaml
  text: And he said[a], “I have sinned. Now please honor me before the elders of my people and before Israel, and return with me, so that I may bow down to Yahweh your God.”
  footnotes:
  - marker: a
    text: Or, 'and I will bow down to the LORD your God.' The Hebrew form can be taken as a simple continuation ('and I will bow down') or as expressing purpose after the preceding request ('so that I may bow down').
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「내가 죄를 지었습니다. 이제 부디 내 민족의 장로들 앞에서, 그리고 이스라엘 앞에서 저를 존중해 주십시오. 그리고 저와 함께 돌아가 주십시오. 그러면 제가 주 당신의 하나님께 절하겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주 당신의 하나님께 제가 절하겠습니다.’ 히브리어 동사는 앞의 요청에 이어 단순한 계속 동작('그리고 제가 절하겠습니다')으로도, 목적을 나타내는 표현('그래서 제가 절하겠습니다')으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָאתִי
  english_pob_choice: I have sinned
  chosen_korean: 내가 죄를 지었습니다
  alternatives_korean:
  - 내가 죄를 범했습니다
  - 제가 죄를 지었습니다
  lexicon: HALOT
  rationale: 완료형 고백을 한국어의 자연스러운 완료 표현으로 옮기되, 단순 사실 진술보다 회개 고백의 성격이 드러나도록 했습니다.
- source_word: כַּבְּדֵנִי נָא
  english_pob_choice: please honor me
  chosen_korean: 부디 … 저를 존중해 주십시오
  alternatives_korean:
  - 부디 … 저를 높여 주십시오
  - 부디 … 저에게 명예를 주십시오
  lexicon: HALOT
  rationale: 공적 장소에서의 체면과 존중을 요구하는 말로서 '존중하다'가 가장 직접적이며, נָא는 '부디'로 반영했습니다.
- source_word: נֶגֶד
  english_pob_choice: before
  chosen_korean: 앞에서
  alternatives_korean:
  - 면전에서
  - 눈앞에서
  lexicon: HALOT
  rationale: 장로들과 이스라엘 앞이라는 공개적 가시성을 자연스러운 현대 한국어로 살렸습니다.
- source_word: וְהִשְׁתַּחֲוֵיתִי
  english_pob_choice: so that I may bow down
  chosen_korean: 제가 … 절하겠습니다
  alternatives_korean:
  - 제가 … 엎드려 경배하겠습니다
  - 제가 … 경배하겠습니다
  lexicon: HALOT
  rationale: 히트파엘형의 몸을 낮추는 행위를 한국어의 '절하다'로 옮겨 물리적 동작을 보존했고, 문맥상 주께 드리는 예배를 암시합니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 주
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절의 본문은 직접적인 신명 표기를 갖지만, 한국어 회중용 본문에서는 보편적 가독성과 기존 문맥 연계를 위해 '주'를 사용했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH'
- issue: אֱלֹהֶיךָ의 인칭 소유격 보존
  chosen_reading: 당신의 하나님
  alternative_readings:
  - 우리의 하나님
  - 하나님
  rationale: 사울이 사무엘에게 '당신의 하나님'이라고 말하는 거리감과 긴장을 유지하여, 화자의 태도와 서사의 뉘앙스를 흐리지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
