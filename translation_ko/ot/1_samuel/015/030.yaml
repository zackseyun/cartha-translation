revisions:
- from: 그가 말했습니다. 「내가 죄를 지었습니다. 이제 부디 내 민족의 장로들 앞에서, 그리고 이스라엘 앞에서 저를 존중해 주십시오. 그리고 저와 함께 돌아가 주십시오. 그러면 제가 주 당신의 하나님께 절하겠습니다.」[a]
  to: 그가 말했습니다. 「제가 죄를 지었습니다. 이제 부디 내 백성의 장로들 앞에서, 또 이스라엘 앞에서 저를 높여 주십시오. 그리고 저와 함께 돌아가 주십시오. 제가 당신의 하나님이신 야훼께 절할 수 있도록 말입니다.[a]」
  rationale: ‘야훼’로 신명을 보존하고, ‘내 백성’으로 원문의 소유 관계를 직접 반영했습니다. 공적 명예를 요청하는 כבד의 뜻은 ‘저를 높여 주십시오’로 옮겼습니다. 마지막 동사는 본문에서 목적 용법으로 자연스럽게 처리하되, 단순 계속 용법의 가능성은 동일한 위치의 각주로 보존했습니다.
