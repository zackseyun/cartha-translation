source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל הַגִּ֤ישׁוּ אֵלַ/י֙ אֶת אֲגַג֙ מֶ֣לֶךְ עֲמָלֵ֔ק וַ/יֵּ֣לֶךְ אֵלָ֔י/ו אֲגַ֖ג מַעֲדַנֹּ֑ת וַ/יֹּ֣אמֶר אֲגָ֔ג אָכֵ֖ן סָ֥ר מַר הַ/מָּֽוֶת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/032.yaml
  text: Then Samuel said[a], “Bring Agag king of Amalek to me.” And Agag came to him trembling, and Agag said, “Surely the bitterness of death has turned aside.”
  footnotes:
  - marker: a
    text: Or “delicately”; the Hebrew word מַעֲדַנֹּת is uncertain. Some understand it to mean Agag came in a pleasant or confident manner; others, following a different interpretation, render “in chains.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 사무엘이 말했습니다. “아말렉 왕 아각을 내게로 데려오십시오.” 아각은 조심스레[a] 그에게 나아왔고, 아각이 말했습니다. “참으로 죽음의 쓴맛이 물러갔습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַעֲדַנֹּת의 뜻은 불확실합니다. ‘우아하게’ 또는 ‘사뿐히’로 이해하기도 하며, 다른 해석에 따라서는 ‘사슬에 매인 채’로 옮기기도 합니다. 문맥에 따라 아각이 두려워하는 태도였다고 이해하는 견해도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּישׁוּ
  english_pob_choice: Bring
  chosen_korean: 데려오십시오
  alternatives_korean:
  - 가져오십시오
  - 이끌어 오십시오
  - 가까이 데려오십시오
  lexicon: WLC + HALOT
  rationale: 왕을 사무엘 앞으로 오게 하라는 명령이므로, 현대 한국어에서는 ‘데려오십시오’가 지시의 힘을 자연스럽게 살리면서도 ‘가까이’의 의미를 과장하지 않습니다.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  english_pob_choice: Agag king of Amalek
  chosen_korean: 아말렉 왕 아각
  alternatives_korean:
  - 아각, 아말렉의 왕
  - 아말렉의 왕 아각
  lexicon: WLC + 고유명사 관행
  rationale: 히브리어의 관형 관계를 한국어에서는 ‘아말렉 왕 아각’으로 압축해, 인명과 왕권 표지를 함께 유지했습니다.
- source_word: מַעֲדַנֹּת
  english_pob_choice: trembling
  chosen_korean: 떨며
  alternatives_korean:
  - 우아하게
  - 조심스레
  - 사뿐히
  lexicon: HALOT
  rationale: 이 어형은 본문상 의미가 불확실하지만, POB의 최신 판단처럼 문맥상 공포/떨림의 태도를 반영하는 해석이 가장 자연스럽습니다. 한국어에서는 부사형 ‘떨며’로 그 상태를 간결하게 살렸습니다.
- source_word: מַר הַמָּוֶת
  english_pob_choice: the bitterness of death
  chosen_korean: 죽음의 쓴맛
  alternatives_korean:
  - 죽음의 쓰라림
  - 죽음의 쓴 고통
  - 죽음의 쓰디쓴 맛
  lexicon: HALOT
  rationale: 직역을 지나치게 경직되게 만들지 않으면서도, ‘쓴맛’ 이미지를 유지해 죽음의 임박한 비참함을 표현했습니다.
theological_decisions:
- issue: 아각의 발화가 보여 주는 죽음의 임박성 표현
  chosen_reading: “참으로 죽음의 쓴맛이 물러갔구나.”로 옮겨, 아각이 위험이 지나갔다고 착각하는 자기확신을 드러냈습니다.
  alternative_readings:
  - “정녕 죽음의 쓰라림이 물러갔습니다.”
  - “참으로 죽음의 쓴 고통은 사라졌습니다.”
  rationale: 히브리어 אָכֵן과 סָר의 결합은 단순 정보 전달보다 안도감 섞인 확언을 나타내므로, 한국어에서도 종결 어조를 통해 아각의 방심을 보이게 했습니다.
  doctrine_reference: 본문 의미와 화용론
- issue: 마지막 절의 인물 발화 등록
  chosen_reading: 사무엘의 명령은 공적 지시체로, 아각의 말은 절망 직전의 독백체로 유지했습니다.
  alternative_readings:
  - 둘 다 동일한 존대체로 평준화
  - 아각의 발화를 중립체로 완화
  rationale: 이 장면은 사무엘의 권위와 아각의 자기평가가 대비되므로, 화법의 대비를 살리는 것이 원문 효과를 더 잘 반영합니다.
  doctrine_reference: 서사 화용론
