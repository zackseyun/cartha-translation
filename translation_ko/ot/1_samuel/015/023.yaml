  source_fidelity: 초안은 두 비교의 기본 뜻과 야훼의 말씀을 거부한 데 따른 왕권 심판을 대체로 전달합니다. 그러나 ‘왕이 되지 못하게 하셨습니다’는 사울이 즉시 왕이 될 수 없게 되었다는 뜻으로 들려, מִמֶּלֶךְ의 ‘왕으로서/왕의 지위에서 거부하다’보다 결과를 과도하게 확정합니다. 히브리어의 반복되는 מָאַס(‘버리다, 거부하다’)도 두 절에서 일관되게 살리는 편이 좋습니다.
  naturalness: ‘점치는 죄’보다 ‘점술의 죄’가 명사구로 더 자연스럽고, 비교문에서는 ‘반역은 …와 같고’처럼 주제를 히브리어의 핵심어에 맞추어 제시하는 것이 현대 한국어에서 명료합니다. 각주 표지는 해당 낱말이나 절에 붙여 독자의 참조 대상을 분명히 했습니다.
  terminology: קֶסֶם은 ‘점술’, מֶרִי는 ‘반역’, הַפְצַר는 ‘완고함’으로 옮겼습니다. תְּרָפִים은 본문에서 이해하기 쉬운 ‘집안 우상들’로 번역하되 각주에서 ‘테라핌’을 제시했습니다. 야훼와 말씀이라는 프로젝트 용어를 유지했습니다.
