source:
  edition: WLC
  text: כִּ֤י חַטַּאת קֶ֨סֶם֙ מֶ֔רִי וְ/אָ֥וֶן וּ/תְרָפִ֖ים הַפְצַ֑ר יַ֗עַן מָאַ֨סְתָּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֖ מִ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/023.yaml
  text: For rebellion is like the sin of divination[a], and stubbornness is like wickedness and household idols. Because you have rejected the word of Yahweh[c][b], he has also rejected you from being king.
  footnotes:
  - marker: a
    text: Or 'the sin of witchcraft.' The Hebrew קֶסֶם refers more broadly to divination or seeking hidden knowledge by forbidden means.
    reason: lexical_alternative
  - marker: b
    text: Hebrew תְּרָפִים (teraphim), household cult images or idols.
    reason: lexical_alternative
  - marker: c
    text: Or 'he has rejected you as king.'
    reason: alternative_reading
translation:
  language: ko
  text: 반역은 점술의 죄[a]와 같고, 완고함은 사악함과 집안 우상들[b]과 같습니다. 당신이 야훼의 말씀을 버렸으므로, 야훼께서도 왕으로서 당신을 버리셨습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마술의 죄’. 히브리어 קֶסֶם은 점술, 곧 금지된 방법으로 숨은 지식을 얻으려 하는 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 תְּרָפִים(테라핌)는 가정 안에 두던 종교적 형상 또는 우상을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그분도 당신을 왕으로부터 버리셨습니다’. 또는 ‘그분도 당신을 왕으로서 거부하셨습니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: חַטַּאת קֶסֶם
  english_pob_choice: the sin of divination
  chosen_korean: 점치는 죄
  alternatives_korean:
  - 점술의 죄
  - 무속의 죄
  - 마술의 죄
  lexicon: HALOT
  rationale: קֶסֶם은 금지된 방식으로 숨은 지식을 구하는 점술을 가리키므로, 현대 한국어에서는 ‘점치는 죄’가 의미를 가장 직접적으로 드러냅니다.
- source_word: מֶרִי
  english_pob_choice: rebellion
  chosen_korean: 반역
  alternatives_korean:
  - 반항
  - 불복종
  - 반역성
  lexicon: HALOT
  rationale: 문맥상 야훼의 명령에 대한 공개적 불순종을 가리키므로, ‘반역’이 강도와 권위 거부의 뉘앙스를 잘 살립니다.
- source_word: וְאָוֶן וּתְרָפִים הַפְצַר
  english_pob_choice: wickedness and household idols / stubbornness
  chosen_korean: 악과 집안 우상들 / 완고함
  alternatives_korean:
  - 죄악과 가정 수호신들 / 고집
  - 불의와 가정 우상들 / 자기 뜻만 고집함
  lexicon: HALOT
  rationale: אָוֶן은 도덕적 악을, תְּרָפִים은 가정 내 우상 숭배 대상을 가리키므로 각각 ‘악’과 ‘집안 우상들’로 옮겼고, הַפְצַר은 완강하게 밀어붙이는 태도이므로 ‘완고함’이 자연스럽습니다.
- source_word: מָאַסְתָּ אֶת דְּבַר יְהוָה
  english_pob_choice: you have rejected the word of Yahweh
  chosen_korean: 당신이 야훼의 말씀을 거부하였으므로
  alternatives_korean:
  - 당신이 야훼의 말씀을 버렸으므로
  - 당신이 야훼의 말씀을 업신여겼으므로
  lexicon: HALOT
  rationale: מָאַס는 단순 무시가 아니라 거절·배척의 뜻이므로 ‘거부하다’가 반복되는 동사 קשר를 살리면서도 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: Project default
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮깁니다.
theological_decisions:
- issue: 두 번째 절반의 종결구가 ‘왕이 되지 못하게 하셨습니다’인지 ‘왕으로서’인지
  chosen_reading: ‘그분도 당신을 왕이 되지 못하게 하셨습니다’로 옮겨, 왕권 박탈의 결과를 분명히 했습니다.
  alternative_readings:
  - 그분도 당신을 왕으로서 거부하셨습니다
  - 그분도 당신을 왕직에서 거부하셨습니다
  rationale: מִמֶּלֶךְ는 ‘왕의 위치에서/왕으로부터’의 제거를 뜻하므로, 현대 한국어에서는 결과를 분명히 드러내는 표현이 의미를 가장 잘 전달합니다.
  doctrine_reference: 역사서 번역에서 דין/판결의 선언을 상태 변화로 명확히 표현하는 원칙
- issue: 비교 구조를 한국어에서 어떻게 살릴지
  chosen_reading: ‘…같습니다’로 두 절반 모두 비교 구문을 유지했습니다.
  alternative_readings:
  - 반역은 점치는 죄이며, 완고함은 악과 집안 우상들입니다
  - 반역은 점치는 죄와 같고, 완고함은 악과 집안 우상들과 같습니다
  rationale: 히브리어는 두 항목을 지혜문학식 대비로 연결하므로, 한국어에서도 비교의 힘을 살리는 것이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; source meaning preserved without flattening the proverb structure'
