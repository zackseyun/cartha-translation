  to: 반역은 점술의 죄[a]와 같고, 완고함은 사악함과 집안 우상들[b]과 같습니다. 당신이 야훼의 말씀을 버렸으므로, 야훼께서도 왕으로서 당신을 버리셨습니다.[c]
