reference: 1 Samuel 15:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹא יָסַ֨ף שְׁמוּאֵ֜ל לִ/רְא֤וֹת אֶת שָׁאוּל֙ עַד י֣וֹם מוֹת֔/וֹ כִּֽי הִתְאַבֵּ֥ל שְׁמוּאֵ֖ל אֶל שָׁא֑וּל וַ/יהוָ֣ה נִחָ֔ם כִּֽי הִמְלִ֥יךְ אֶת שָׁא֖וּל עַל יִשְׂרָאֵֽל־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/035.yaml
  text: And Samuel did not see Saul again until the day of his death[a], for Samuel mourned over Saul. And Yahweh regretted that he had made Saul king over Israel.
  footnotes:
  - marker: a
    text: Or 'was sorry' or 'relented.' The Hebrew verb can carry a range of senses depending on context; here it expresses the LORD's grief/regret over having made Saul king.
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘은 죽는 날까지 사울을 다시 보지 않았습니다[a]. 사무엘이 사울 때문에 슬퍼했기 때문입니다. 그리고 야훼께서는 사울을 이스라엘의 왕으로 세우신 것을 유감스럽게 여기셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마지막까지 보지 않았다’, ‘다시 보지 않았다’로도 옮길 수 있습니다. 히브리어 관용구는 ‘더 이상 ~하지 않다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָסַף ... לִרְאוֹת
  english_pob_choice: did not see ... again
  chosen_korean: 다시 보지 않았습니다
  alternatives_korean:
  - 더 이상 보지 않았습니다
  - 계속 보지 않았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘~을 다시/더 이상 하지 않다’의 자연스러운 대응으로, 반복적 만남의 부재를 분명하게 살립니다.
- source_word: הִתְאַבֵּל
  english_pob_choice: mourned
  chosen_korean: 슬퍼했습니다
  alternatives_korean:
  - 애도했습니다
  - 애통했습니다
  lexicon: HALOT
  rationale: 상실과 비탄을 나타내는 말로, 사무엘의 내적 슬픔을 한국어로 무리 없이 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신적 고유명은 ‘야훼’로 옮겨, 호칭으로 바꾸지 않고 본문의 인칭성을 보존합니다.
- source_word: נִחָם
  english_pob_choice: regretted
  chosen_korean: 유감스럽게 여기셨습니다
  alternatives_korean:
  - 후회하셨습니다
  - 마음 아파하셨습니다
  - 뜻을 돌이키셨습니다
  lexicon: HALOT
  rationale: 이 동사는 문맥에 따라 ‘후회/유감/뜻을 돌이킴’의 폭이 있으므로, 여기서는 사울을 왕으로 세우신 일에 대한 하나님의 감정적 유감을 드러내되, 단순한 정책 변경으로 축소하지 않도록 했습니다.
- source_word: הִמְלִיךְ אֶת שָׁאוּל עַל יִשְׂרָאֵל
  english_pob_choice: had made Saul king over Israel
  chosen_korean: 사울을 이스라엘의 왕으로 세우신 것
  alternatives_korean:
  - 사울을 이스라엘의 왕으로 삼으신 것
  - 사울이 이스라엘을 다스리게 하신 것
  lexicon: HALOT
  rationale: 히필형 ‘왕이 되게 하다’는 한국어에서 ‘왕으로 세우다’가 가장 직접적이며, 통치 범위도 ‘이스라엘의 왕’으로 자연스럽게 드러납니다.
theological_decisions:
- issue: 여호와의 נִחָם을 어떻게 옮길지
  chosen_reading: ‘유감스럽게 여기셨습니다’로 옮겨, 하나님의 애통/유감을 드러내면서도 본문의 긴장을 유지했습니다.
  alternative_readings:
  - 후회하셨습니다
  - 뜻을 돌이키셨습니다
  rationale: 본문은 여호와께 직접 감정적 반응을 귀속하므로, 이를 행정적 변경으로 완화하지 않고 원문의 정서를 살리는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
