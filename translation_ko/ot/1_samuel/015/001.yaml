  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 직역된 경칭이 아니라 고유명사로서 "야훼"를 사용했습니다.
- source_word: לִמְשָׁחֳךָ
  english_pob_choice: to anoint you
  chosen_korean: 당신에게 기름 부어
