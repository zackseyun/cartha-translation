base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/001.yaml
  text: Then Samuel said to Saul[a], “Yahweh sent me to anoint you as king over his people, over Israel. So now, listen to the words of Yahweh.”
  footnotes:
  - marker: a
    text: Or 'hear the voice of the words of the LORD.' The Hebrew expression is more literal than the smoother English rendering and carries an implicit call not only to hear but to heed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사무엘이 사울에게 말했습니다. “야훼께서 나를 보내셔서 당신에게 기름을 부어 그분의 백성, 곧 이스라엘을 다스릴 왕으로 삼으셨습니다. 그러니 이제 야훼의 말씀을[a] 들으십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 “야훼 말씀의 소리”입니다. 이 표현은 듣는 것뿐 아니라 순종하라는 요구를 함축합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그런데 ... 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 드러내는 waw 연속의 값을 한국어로는 시간 전환 표현인 "그때"로 옮겨, 문맥 흐름을 살렸습니다.
