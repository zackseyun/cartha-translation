id: 1SA.15.1
reference: 1 Samuel 15:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל אֹתִ֨/י שָׁלַ֤ח יְהוָה֙ לִ/מְשָׁחֳ/ךָ֣ לְ/מֶ֔לֶךְ עַל עַמּ֖/וֹ עַל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה שְׁמַ֔ע לְ/ק֖וֹל דִּבְרֵ֥י יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/001.yaml
  text: Then Samuel said to Saul[a], “Yahweh sent me to anoint you as king over his people, over Israel. So now, listen to the words of Yahweh.”
  footnotes:
  - marker: a
    text: Or 'hear the voice of the words of the LORD.' The Hebrew expression is more literal than the smoother English rendering and carries an implicit call not only to hear but to heed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사무엘이 사울에게 말했습니다. "야훼께서 나를 당신에게 기름 부어 그분의 백성 이스라엘의 왕이 되게 보내셨습니다. 그러니 이제 야훼의 말씀을 들으십시오."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 "야훼의 말씀의 소리"에 가깝습니다. 여기서는 한국어로 더 자연스럽고도 본문의 청종 요구를 유지하는 "야훼의 말씀"으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그런데 ... 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 드러내는 waw 연속의 값을 한국어로는 시간 전환 표현인 "그때"로 옮겨, 문맥 흐름을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 직역된 경칭이 아니라 고유명사로서 "야훼"를 사용했습니다.
- source_word: לִמְשָׁחֳךָ
  english_pob_choice: to anoint you
  chosen_korean: 당신에게 기름 부어
  alternatives_korean:
  - 당신에게 기름을 부어
  - 당신을 기름 부어
  lexicon: HALOT
  rationale: 왕위 위임의 관용구를 한국어에서도 그대로 보존하기 위해 "기름 부어"로 옮겼습니다.
- source_word: לְמֶלֶךְ
  english_pob_choice: as king
  chosen_korean: 왕이 되게
  alternatives_korean:
  - 왕으로
  - 왕으로서
  lexicon: HALOT
  rationale: לְ의 역할/목적 용법을 한국어의 결과 표현 "-게"로 풀어, 임명 목적이 아니라 임명 결과를 분명히 했습니다.
- source_word: לְקוֹל דִּבְרֵי יְהוָה
  english_pob_choice: the words of Yahweh
  chosen_korean: 야훼의 말씀을
  alternatives_korean:
  - 야훼의 음성을
  - 야훼의 말씀의 소리를
  lexicon: HALOT
  rationale: POB의 최종 반영처럼 더 자연스럽고 충실하게 "말씀"으로 옮기되, 히브리어의 "voice/words" 중첩을 과도하게 직역하지 않았습니다.
theological_decisions:
- issue: 왕권 수여의 주체와 신적 명령의 강조
  chosen_reading: '"야훼께서 나를 ... 보내셨습니다"와 "야훼의 말씀을 들으십시오"를 함께 유지해, 사울의 왕위가 사무엘의 권한이 아니라 야훼의 파송과 명령 아래 있음을 드러냈습니다.'
  alternative_readings:
  - '"주께서"로 일반화하여 번역'
  - 후반 명령을 단순히 "들으십시오"로만 옮김
  rationale: 본문은 파송과 청종을 반복해 사울의 즉각적 순종을 요구합니다. 신명과 명령을 약화시키지 않는 것이 source-direct합니다.
  doctrine_reference: 1 Samuel 15:1의 서술 구조와 명령형 שְׁמַע
