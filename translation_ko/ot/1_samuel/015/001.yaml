  to: 그때 사무엘이 사울에게 말했습니다. “야훼께서 나를 보내셔서 당신에게 기름을 부어 그분의 백성, 곧 이스라엘을 다스릴 왕으로 삼으셨습니다. 그러니 이제 야훼의 말씀을[a] 들으십시오.”
  rationale: 통치 대상과 왕위 수여의 관계를 한국어에서 명확히 하되, 야훼가 사무엘을 보내어 사울에게 기름을 부어 왕으로 세우셨다는 본문의 구조와 의미를 유지했습니다. ‘말씀’이라는 자연스러운 본문 번역은 유지하고, 히브리어의 ‘소리/말씀’ 결합 및 청종의 뉘앙스는 각주에서 밝혔습니다.
