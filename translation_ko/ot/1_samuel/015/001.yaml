- source_word: לְמֶלֶךְ
  english_pob_choice: as king
  chosen_korean: 왕이 되게
  alternatives_korean:
  - 왕으로
  - 왕으로서
  lexicon: HALOT
  rationale: לְ의 역할/목적 용법을 한국어의 결과 표현 "-게"로 풀어, 임명 목적이 아니라 임명 결과를 분명히 했습니다.
- source_word: לְקוֹל דִּבְרֵי יְהוָה
  english_pob_choice: the words of Yahweh
  chosen_korean: 야훼의 말씀을
  alternatives_korean:
  - 야훼의 음성을
  - 야훼의 말씀의 소리를
  lexicon: HALOT
  rationale: POB의 최종 반영처럼 더 자연스럽고 충실하게 "말씀"으로 옮기되, 히브리어의 "voice/words" 중첩을 과도하게 직역하지 않았습니다.
theological_decisions:
- issue: 왕권 수여의 주체와 신적 명령의 강조
  chosen_reading: '"야훼께서 나를 ... 보내셨습니다"와 "야훼의 말씀을 들으십시오"를 함께 유지해, 사울의 왕위가 사무엘의 권한이 아니라 야훼의 파송과 명령 아래 있음을 드러냈습니다.'
  alternative_readings:
  - '"주께서"로 일반화하여 번역'
  - 후반 명령을 단순히 "들으십시오"로만 옮김
  rationale: 본문은 파송과 청종을 반복해 사울의 즉각적 순종을 요구합니다. 신명과 명령을 약화시키지 않는 것이 source-direct합니다.
