  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 “그분의 백성 이스라엘의 왕”은 히브리어의 ‘그의 백성 위에, 이스라엘 위에’를 소유 관계처럼 읽히게 하며, 왕으로서 이스라엘을 다스린다는 관계를 더 분명히 드러낼 필요가 있습니다.
  naturalness: “당신에게 기름 부어”는 현대 표준 한국어에서 다소 미완성적이고 어색합니다. “당신에게 기름을 부어 … 왕으로 삼으시려고”가 자연스럽고, 왕위 임명의 의미도 정확히 전달합니다. 각주 표지는 해당 어구인 ‘말씀’ 바로 뒤에 두는 편이 적절합니다.
  terminology: ‘야훼’, ‘기름을 부어’, ‘말씀’, 그리고 합쇼체 명령형 ‘들으십시오’는 일관되고 적절합니다. ‘당신’은 고대 왕에게 직접 말하는 장면에서 가능한 표현입니다.
