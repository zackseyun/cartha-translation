source:
  edition: WLC
  text: וַ/יִּתְפֹּ֛שׂ אֶת אֲגַ֥ג מֶֽלֶךְ עֲמָלֵ֖ק חָ֑י וְ/אֶת כָּל הָ/עָ֖ם הֶחֱרִ֥ים לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/008.yaml
  text: He captured Agag king of Amalek alive[a], and devoted all the people to destruction with the edge of the sword.
  footnotes:
  - marker: a
    text: Or, 'utterly destroyed all the people'; the Hebrew verb refers to devoting something to destruction under the ban.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아각 곧 아말렉의 왕을 살아 있는 채로 사로잡고, 모든 백성을 칼날로 진멸했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진멸했습니다’는 히브리어 חרם의 의미를 따른 번역으로, ‘완전히 멸하다’보다 언약적 심판의 뉘앙스를 더 잘 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  english_pob_choice: captured
  chosen_korean: 사로잡고
  alternatives_korean:
  - 붙잡고
  - 포로로 잡고
  lexicon: HALOT
  rationale: 군사적 맥락에서 ‘붙잡다/포로로 잡다’의 뜻을 살리되, 한국어에서는 ‘사로잡다’가 자연스럽고 함의를 잘 드러냅니다.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  english_pob_choice: Agag king of Amalek
  chosen_korean: 아각 곧 아말렉의 왕
  alternatives_korean:
  - 아각, 아말렉의 왕
  - 아각, 아말렉 왕
  lexicon: HALOT
  rationale: 히브리어의 명사구를 따라 이름과 칭호를 분리해, 아각이 ‘아말렉의 왕’임을 분명히 했습니다.
- source_word: חָי
  english_pob_choice: alive
  chosen_korean: 살아 있는 채로
  alternatives_korean:
  - 살아 있는
  - 살아서
  lexicon: HALOT
  rationale: 아각이 죽지 않고 생포되었음을 강조하는 보어로 자연스럽게 옮겼습니다.
- source_word: הֶחֱרִים
  english_pob_choice: devoted ... to destruction
  chosen_korean: 진멸했습니다
  alternatives_korean:
  - 멸절했습니다
  - 멸하여 바쳤습니다
  - 진멸하여 바쳤습니다
  lexicon: HALOT
  rationale: 본문의 חרם 전쟁 언어를 한국어 성경에서 익숙하면서도 강한 뜻을 지닌 ‘진멸하다’로 옮기되, 제의적 헌납의 뉘앙스는 과도하게 풀어 쓰지 않았습니다.
- source_word: לְפִי חָרֶב
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼의 날로
  - 칼끝으로
  - 칼로
  lexicon: HALOT
  rationale: 히브리어 관용구의 이미지(칼의 입/날)를 간결하게 살려, 단순한 ‘칼로’보다 더 구체적으로 표현했습니다.
theological_decisions:
- issue: חרם(헤렘) 전쟁 언어의 한국어 처리
  chosen_reading: ‘진멸했습니다’로 직역적 의미를 살리되, 문맥상 하나님의 심판에 속한 전쟁 행위라는 긴장을 유지했습니다.
  alternative_readings:
  - ‘완전히 멸했습니다’
  - ‘전멸시켰습니다’
  - ‘저주받은 것으로 바쳤습니다’
  rationale: English POB가 ‘devoted ... to destruction’을 택해 חרם의 신학적 무게를 보존한 만큼, 한국어도 일반적 군사 소탕보다 언약-심판의 성격을 드러내는 표현을 선택했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
