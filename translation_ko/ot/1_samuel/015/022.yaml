source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל הַ/חֵ֤פֶץ לַֽ/יהוָה֙ בְּ/עֹל֣וֹת וּ/זְבָחִ֔ים כִּ/שְׁמֹ֖עַ בְּ/ק֣וֹל יְהוָ֑ה הִנֵּ֤ה שְׁמֹ֨עַ֙ מִ/זֶּ֣בַח ט֔וֹב לְ/הַקְשִׁ֖יב מֵ/חֵ֥לֶב אֵילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/022.yaml
  text: And Samuel said, “Does the LORD delight in burnt offerings and sacrifices as much as in obeying the voice of the LORD? Look, to obey is better than sacrifice, and to listen than the fat of rams.”
translation:
  language: ko
  text: 사무엘이 말했습니다. “야훼께서 번제와 제물을 야훼의 음성에 순종하는 것만큼 기뻐하시겠습니까? 보십시오, 순종하는 것이 제사보다 낫고, 듣는 것[a]이 숫양의 기름보다 낫습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שׁמע는 ‘듣다’와 ‘순종하다’를 함께 담을 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה / LORD
  english_pob_choice: LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: יהוה
  rationale: 원문 고유명사 יהוה를 POB 기본값대로 음역해 하나님의 이름을 드러냈습니다. 영어본의 LORD는 전통적 대체어이므로 한국어 본문은 원문 기준으로 야훼를 사용합니다.
- source_word: שְׁמֹעַ
  english_pob_choice: to obey / to listen
  chosen_korean: 순종하는 것 / 듣는 것
  alternatives_korean:
  - 들어 순종하는 것
  - 귀 기울이는 것
  lexicon: שׁמע
  rationale: 히브리어 שׁמע의 중의성을 살려 영어본의 obey / listen 대응을 한국어에서도 둘 다 유지했습니다. 단순 청취보다 언약적 응답성을 드러내기 위해 ‘순종하다’를 앞세웠습니다.
- source_word: חֵלֶב אֵילִים
  english_pob_choice: the fat of rams
  chosen_korean: 숫양의 기름
  alternatives_korean:
  - 숫양의 기름기
  - 숫양의 기름진 부분
  lexicon: חֵלֶב
  rationale: חֵלֶב은 제의적으로 구분되는 ‘지방/기름’으로, 음식 일반의 ‘기름기’보다 제의적 뉘앙스가 분명한 ‘기름’이 적절합니다. 영어본의 fat을 직역하되 제사 맥락을 살렸습니다.
theological_decisions:
- issue: ‘순종’과 ‘듣는 것’의 병렬 대조
  chosen_reading: 순종하는 것이 제사보다 낫고, 듣는 것이 숫양의 기름보다 낫습니다
  alternative_readings:
  - 들어 순종하는 것이 제사보다 낫고, 귀 기울이는 것이 숫양의 기름보다 낫습니다
  rationale: 본문은 제의 행위 자체를 무시하는 것이 아니라, 야훼의 음성에 대한 응답이 제사보다 우선한다는 선지자적 우선순위를 말합니다. 따라서 두 동사를 모두 보존해 원문의 수사적 긴장을 유지했습니다.
  doctrine_reference: 사무엘상 15:22의 예언자적 언약 순종 강조
- issue: ‘번제와 제물’의 제의적 표현 유지
  chosen_reading: 번제와 제물
  alternative_readings:
  - 번제와 희생제물
  - 번제와 희생
  rationale: 영어본의 burnt offerings and sacrifices를 직접 반영해 제의 범주를 분명히 했습니다. ‘희생제물’보다 원문의 제사 항목 구분이 더 잘 드러납니다.
  doctrine_reference: 구약 제사 용어의 표준적 제의 구분
