base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/012.yaml
  text: Samuel rose early in the morning to meet Saul[a], and it was reported to Samuel, saying, “Saul came to Carmel, and look, he has set up a monument for himself; then he turned and passed on and went down to Gilgal.”
  footnotes:
  - marker: a
    text: Hebrew literally, “a hand for himself.” Here “hand” is an idiom for a memorial marker or monument.
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘이 아침 일찍 사울을 맞으러 나갔습니다. 그리고 사무엘에게 이렇게 보고되었습니다. “사울이 갈멜에 왔는데, 보십시오, 자신을 위해 기념비를 세웠습니다. 그리고 그는 돌아서서 지나가 길갈로 내려갔습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그를 위한 손’이지만, 여기서는 기념 표지나 기념비를 가리키는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  english_pob_choice: rose early in the morning
  chosen_korean: 아침 일찍 나갔습니다
  alternatives_korean:
  - 일찍 일어났습니다
  - 아침 일찍 일어났습니다
  lexicon: HALOT
  rationale: ‘일찍’이라는 시간 강조를 살리되 한국어 서술에서는 ‘맞으러 나갔습니다’로 이어 주어 자연스럽게 옮겼습니다.
- source_word: לִקְרַאת
  english_pob_choice: to meet
  chosen_korean: 맞으러
  alternatives_korean:
  - 만나러
  - 대면하려고
  lexicon: HALOT
  rationale: 목적을 나타내는 לשקראת의 기능을 반영해 ‘맞으러’로 처리했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그런데
  lexicon: HALOT
  rationale: 주의 환기 기능을 살려 직설적 감탄보다 보고체에 맞는 ‘보십시오’로 옮겼습니다.
- source_word: מַצִּיב לּוֹ יָד
  english_pob_choice: has set up a monument for himself
  chosen_korean: 자신을 위해 기념비를 세웠습니다
  alternatives_korean:
  - 자신을 위해 기념 표지를 세웠습니다
  - 자기 손을 세웠습니다
  lexicon: HALOT
  rationale: 직역하면 ‘손’이지만 여기서는 기념 표지/기념비를 가리키는 관용구이므로 의미를 드러내는 번역을 택했습니다.
theological_decisions:
- issue: 사울의 자기기념 행위와 서술 톤
  chosen_reading: 본문의 비판적 뉘앙스를 약화하지 않기 위해 ‘자신을 위해 기념비를 세웠습니다’라고 직설적으로 옮겼습니다.
  alternative_readings:
  - 자기 이름을 기리려고 표지를 세웠습니다
  - 기념 표지를 세웠습니다
  rationale: 히브리어의 ‘for himself’가 드러내는 자기기념성은 본문의 의미상 중요하므로 완곡하게 흐리지 않았습니다.
  doctrine_reference: 본문 서술의 윤리적 평가를 보존하는 번역 원칙
