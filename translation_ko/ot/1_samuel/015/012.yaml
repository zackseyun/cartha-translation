revisions:
- from: 사무엘이 아침 일찍 사울을 맞으러 나갔습니다. 그리고 사무엘에게 이렇게 보고되었습니다. “사울이 갈멜에 왔는데, 보십시오, 자신을 위해 기념비를 세웠습니다. 그리고 그는 돌아서서 지나가 길갈로 내려갔습니다.”[a]
  to: 사무엘은 아침 일찍 일어나 사울을 만나려고 했습니다. 그런데 사무엘에게 이런 보고가 들어왔습니다. “사울이 갈멜에 왔습니다. 보십시오, 그가 자신을 위해 기념비[a]를 세워 놓았습니다. 그리고 그는 돌아서서 계속 가다가 길갈로 내려갔습니다.”
  rationale: 사무엘이 ‘일찍 일어났다’는 히브리어 동사의 의미를 회복하고, 사울의 이동 연쇄를 현대 한국어로 자연스럽게 다듬었습니다. הִנֵּה+분사의 결과 상태는 ‘세워 놓았습니다’로 표현했으며, 각주 표지를 해당 어휘 바로 뒤로 옮기고 문자적 설명을 정정했습니다.
