  text: Samuel rose early in the morning to meet Saul[a], and it was reported to Samuel, saying, “Saul came to Carmel, and look, he has set up a monument for himself; then he turned and passed on and went down to Gilgal.”
  footnotes:
  - marker: a
    text: Hebrew literally, “a hand for himself.” Here “hand” is an idiom for a memorial marker or monument.
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘은 아침 일찍 일어나 사울을 만나려고 했습니다. 그런데 사무엘에게 이런 보고가 들어왔습니다. “사울이 갈멜에 왔습니다. 보십시오, 그가 자신을 위해 기념비[a]를 세워 놓았습니다. 그리고 그는 돌아서서 계속 가다가 길갈로 내려갔습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘자신을 위한 손’입니다. 여기서 ‘손’은 기념 표지나 기념비를 가리키는 관용 표현입니다.
    reason: lexical_alternative
