source:
  edition: WLC
  text: וַ/יָּ֥שָׁב שְׁמוּאֵ֖ל אַחֲרֵ֣י שָׁא֑וּל וַ/יִּשְׁתַּ֥חוּ שָׁא֖וּל לַֽ/יהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/031.yaml
  text: So Samuel went back after Saul[a], and Saul bowed down to Yahweh.
  footnotes:
  - marker: a
    text: Or 'worshiped the LORD.' The Hebrew verb can denote bowing down or worship, depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 사무엘이 사울 뒤에서 돌아섰고, 사울은 야훼께 엎드렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께 경배했습니다.’ 히브리어 동사는 문맥에 따라 몸을 굽혀 절하는 행위나 예배를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: went back
  chosen_korean: 돌아섰고
  alternatives_korean:
  - 되돌아갔고
  - 돌아갔고
  lexicon: HALOT
  rationale: 문맥상 사무엘이 사울을 따라 다시 움직이는 역전의 동작을 자연스럽게 담되, 단순 이동보다 방향 전환의 뉘앙스를 살리기 위해 ‘돌아섰고’로 옮겼습니다.
- source_word: אַחֲרֵי
  english_pob_choice: after
  chosen_korean: 뒤에서
  alternatives_korean:
  - 뒤를 따라
  - 뒤에
  lexicon: HALOT
  rationale: 히브리어의 ‘뒤/뒤를 따라’라는 공간적 감각을 살려, 사무엘이 사울의 뒤를 따라 움직였음을 한국어로 자연스럽게 표현했습니다.
- source_word: וַיִּשְׁתַּחוּ
  english_pob_choice: bowed down
  chosen_korean: 엎드렸습니다
  alternatives_korean:
  - 절했습니다
  - 경배했습니다
  - 무릎을 꿇었습니다
  lexicon: HALOT
  rationale: 이 동사는 문맥에 따라 ‘절하다/엎드리다/경배하다’를 가질 수 있으므로, 본문이 강조하는 몸의 낮춤을 우선해 ‘엎드렸습니다’로 옮기고, 예배 행위로의 해석은 직접 단정하지 않았습니다.
- source_word: לַֽ/יהוָֽה
  english_pob_choice: to the LORD
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: project default
  rationale: 프로젝트 기본 원칙에 따라 יהוה는 ‘야훼’로 옮기며, 여격 표지는 한국어 조사 ‘께’로 반영했습니다.
theological_decisions:
- issue: וַיִּשְׁתַּחוּ의 의미를 ‘예배하다’로 명시할지, 몸의 자세를 드러내는 표현으로 둘지
  chosen_reading: 본문에서는 ‘엎드렸습니다’로 두어 신체적 낮춤을 전면에 두었습니다.
  alternative_readings:
  - 야훼께 절했습니다
  - 야훼를 경배했습니다
  rationale: 원어 동사 자체는 상황에 따라 예배와 굴복 모두를 가리킬 수 있지만, 이 절에서는 대상이 야훼로 분명하더라도 동작의 구체성인 ‘엎드림’이 먼저 드러나므로, 의미를 과도하게 좁히지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3, §6; WLC שׁחה
