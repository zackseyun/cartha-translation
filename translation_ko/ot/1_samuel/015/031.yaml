  source_fidelity: ‘사울 뒤에서 돌아섰고’는 וַיָּשָׁב אַחֲרֵי שָׁאוּל의 이동 의미를 정확히 전달하지 못합니다. 이는 사울의 뒤쪽에서 방향을 돌린 듯한 뜻이 될 수 있으나, 원문은 사무엘이 사울을 따라 다시 갔음을 말합니다. ‘사울의 뒤를 따라 되돌아갔습니다’는 שוב의 되돌아감과 אַחֲרֵי의 ‘뒤를 따라’를 모두 보존합니다. ‘야훼께 절했습니다’는 שחה의 구체적인 몸짓을 자연스럽게 나타내며, ‘경배했다’라는 해석적 대안은 각주에 유지됩니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 두 연속 사건의 관계도 분명합니다. ‘사울의 뒤를 따라 되돌아갔습니다’는 약간 직역적이지만 원문의 공간적·서사적 표현을 무리 없이 살립니다.
  terminology: 인명 ‘사무엘’, ‘사울’ 및 신명 ‘야훼’는 초안의 프로젝트 용례를 유지합니다. ‘절했습니다’는 야훼를 향한 שחה에 적합하며, 예배라는 의미 가능성은 각주에서 보완합니다.
