reference: 1 Samuel 15:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לֹ֥א אָשׁ֖וּב עִמָּ֑/ךְ כִּ֤י מָאַ֨סְתָּה֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֣ יְהוָ֔ה מִ/הְי֥וֹת מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/026.yaml
  text: And Samuel said to Saul, “I will not return with you, because you have rejected the word of Yahweh, and Yahweh has rejected you from being king over Israel.”
translation:
  language: ko
  text: 사무엘이 사울에게 말했습니다. “나는 당신과 함께 돌아가지 않겠습니다. 당신이 야훼의 말씀을 버렸으므로, 야훼께서도 이스라엘의 왕으로서 당신을 버리셨습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 이르렀습니다
  lexicon: HALOT
  rationale: 서술 전개를 자연스럽게 이어 주면서도, 고어체로 치우치지 않는 합쇼체 서술에 맞게 간결하게 옮겼습니다.
- source_word: לֹא אָשׁוּב עִמָּךְ
  english_pob_choice: I will not return with you
  chosen_korean: 나는 당신과 함께 돌아가지 않겠습니다
  alternatives_korean:
  - 나는 당신과 함께 돌아오지 않겠습니다
  - 나는 당신과 함께 가지 않겠습니다
  lexicon: HALOT
  rationale: שׁוּב의 기본 의미인 ‘돌아가다/돌아오다’를 살리되, 문맥상 사울과 동행을 거절하는 뜻이 분명하므로 ‘함께 돌아가지 않겠습니다’로 자연스럽게 표현했습니다.
- source_word: מָאַסְתָּה אֶת דְּבַר יְהוָה
  english_pob_choice: you have rejected the word of Yahweh
  chosen_korean: 당신이 야훼의 말씀을 버렸기 때문입니다
  alternatives_korean:
  - 당신이 야훼의 말씀을 거절했기 때문입니다
  - 당신이 야훼의 말씀을 멸시했기 때문입니다
  lexicon: HALOT
  rationale: מאס은 단순한 무시보다 강한 거절/배척의 뜻이 있으나, 한국어에서는 대상이 ‘말씀’일 때 ‘버리다’가 그 결단적 거절을 더 자연스럽게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 기준에 따라 신명기적 이름 יְהוָה는 관용적 대체어가 아니라 고유명사 ‘야훼’로 옮겼습니다.
- source_word: וַיִּמְאָסְךָ
  english_pob_choice: and Yahweh has rejected you
  chosen_korean: 야훼께서도 당신을 이스라엘의 왕이 되지 못하게 하셨습니다
  alternatives_korean:
  - 야훼께서도 당신을 버리셨습니다
  - 야훼께서도 당신을 거절하셨습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘reject’ 반복은 유지하되, 왕위 박탈이라는 결과를 분명히 드러내기 위해 ‘왕이 되지 못하게 하셨습니다’로 풀어 옮겼습니다.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  english_pob_choice: king over Israel
  chosen_korean: 이스라엘의 왕
  alternatives_korean:
  - 이스라엘 위의 왕
  - 이스라엘을 다스리는 왕
  lexicon: HALOT
  rationale: עַל의 ‘위에/over’라는 통치 관계는 한국어에서 보통 ‘~의 왕’으로 자연스럽게 표현되므로, 가독성을 위해 관용적 표현을 택했습니다.
theological_decisions:
- issue: 야훼 이름과 왕권 박탈의 표현
  chosen_reading: 신명기적 이름은 ‘야훼’로, 왕권 박탈은 결과를 드러내는 동적 표현으로 옮겼습니다.
  alternative_readings:
  - ‘여호와’로 음역하지 않고 ‘주님’으로 대체
  - 직역하여 ‘왕이 되지 못하게 하셨습니다’ 대신 ‘왕에서 쫓아내셨습니다’
  rationale: 본문의 초점은 사울의 불순종과 그에 대한 야훼의 왕권 박탈 선언에 있으므로, 고유 이름을 보존하면서 판정의 의미가 분명한 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh; Translation philosophy #5 consistency of key terms'
