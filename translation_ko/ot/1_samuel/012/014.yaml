source:
  edition: WLC
  text: אִם תִּֽירְא֣וּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֤ם אֹת/וֹ֙ וּ/שְׁמַעְתֶּ֣ם בְּ/קֹל֔/וֹ וְ/לֹ֥א תַמְר֖וּ אֶת פִּ֣י יְהוָ֑ה וִ/הְיִתֶ֣ם גַּם אַתֶּ֗ם וְ/גַם הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר מָלַ֣ךְ עֲלֵי/כֶ֔ם אַחַ֖ר יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/014.yaml
  text: If you fear Yahweh and serve him and listen to his voice and do not rebel against the command of Yahweh[b][a], then both you and the king who reigns over you will follow Yahweh your God.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and you will be, both you and the king ... after the LORD your God.' The sense is that both the people and their king will continue in allegiance to, or follow, the LORD.
    reason: alternative_reading
  - marker: b
    text: '''Listen to his voice'' can also be understood as ''obey his voice,'' since the Hebrew expression often includes the idea of obedient hearing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 야훼를 두려워하고 그분을 섬기며 그분의 음성에 귀를 기울이고[b] 야훼의 명령을 거역하지 않으면, 너희와 너희를 다스리는 왕이 모두 너희의 하나님 야훼를 따르게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그리고 너희와 너희를 다스리는 왕이 모두 너희의 하나님 야훼 뒤에 있게 될 것이다’에 가깝습니다. 이 구절의 정확한 연결 방식은 논의되지만, 백성과 왕이 야훼를 따르며 그분께 충성을 지킨다는 뜻으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그분의 음성에 귀를 기울이다’는 히브리어 표현으로, 단순히 듣는 것뿐 아니라 순종하여 듣는다는 뜻도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּירְאוּ
  english_pob_choice: you fear
  chosen_korean: 두려워하고
  alternatives_korean:
  - 경외하고
  - 두려워하며
  lexicon: HALOT
  rationale: 야훼를 향한 언약적 경외와 두려움의 강도를 함께 살리기 위해 ‘두려워하고’로 옮겼습니다.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  english_pob_choice: and serve him
  chosen_korean: 그분을 섬기며
  alternatives_korean:
  - 그분을 섬기고
  - 그분께 예배하며
  lexicon: HALOT
  rationale: עבד는 하나님께 대한 섬김을 뜻하므로, 예배로 좁히지 않고 ‘섬기며’로 넓게 유지했습니다.
- source_word: וּשְׁמַעְתֶּם בְּקֹלוֹ
  english_pob_choice: and listen to his voice
  chosen_korean: 그분의 음성에 귀를 기울이고
  alternatives_korean:
  - 그분의 음성을 듣고
  - 그분의 음성에 순종하고
  lexicon: HALOT
  rationale: 직역보다 자연스러운 한국어로 ‘귀를 기울이고’를 택하되, 청종과 순종의 함의를 남겼습니다.
- source_word: וְלֹא תַמְרוּ אֶת פִּי יְהוָה
  english_pob_choice: and do not rebel against the command of Yahweh
  chosen_korean: 야훼의 명령을 거역하지 않으면
  alternatives_korean:
  - 야훼의 말씀을 거역하지 않으면
  - 야훼의 입을 거역하지 않으면
  lexicon: HALOT
  rationale: ‘입’의 직역보다 문맥상 권위 있는 말씀/명령의 뜻이 분명하므로 ‘명령’을 사용했습니다.
- source_word: אַחַר יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: will follow Yahweh your God
  chosen_korean: 너희의 하나님 야훼를 따르게 될 것입니다
  alternatives_korean:
  - 너희의 하나님 야훼를 따를 것입니다
  - 너희의 하나님 야훼 뒤를 따르게 될 것입니다
  lexicon: HALOT
  rationale: אַחַר는 ‘뒤따르다/따르다’의 관용적 의미이므로, 공동체와 왕의 충성 지속을 드러내는 ‘따르게 될 것입니다’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 본문과 맥락에서 하나님의 고유명사이므로 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: POB의 원칙에 따라 신적 이름을 칭호로 대체하지 않고, 원문에 있는 언약적 고유명을 보존했습니다.
  doctrine_reference: 'Translation philosophy #3: 본문이 말하는 고유명사를 유지하고 전통적 대체어를 사용하지 않음.'
- issue: 문장 말미 אַחַר의 의미
  chosen_reading: 왕과 백성이 모두 야훼를 ‘따르게 될 것입니다’라는 긍정적 방향으로 이해했습니다.
  alternative_readings:
  - ‘야훼 뒤에 있게 될 것입니다’처럼 더 직역하는 읽기
  - 완곡하게 ‘야훼께 속하게 될 것입니다’로 보는 읽기
  rationale: 히브리어 관용구가 충성/동행의 의미를 가지므로, 한국어에서는 ‘따르다’가 가장 분명하게 전달합니다.
  doctrine_reference: 문맥 우선의 관용구 처리; 의미를 지나치게 희미하게 만들지 않음.
