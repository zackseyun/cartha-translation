  source_fidelity: 히브리어의 접속된 명령과 뒤따르는 사무엘의 법정적 발화를 한국어 문장 구조에서도 분명히 구분할 필요가 있습니다. וְאִשָּׁפְטָה אִתְּכֶם은 단순한 개인적 다툼보다 공적·법정적 변론의 의미가 강하므로 ‘변론하겠습니다’가 더 적절합니다. ‘너희와 너희 조상들을 위해’는 문맥상 야훼의 행위가 그들을 향해/그들을 위하여 이루어진 뜻을 무리 없이 전달합니다.
  naturalness: 초안의 ‘여기에 서서, … 내가 … 다투겠습니다’는 명령문 ‘서다’가 뒤의 ‘다투다’에 종속되는 듯 들리고, 합쇼체 명령으로도 완결되지 않았습니다. ‘서십시오. 내가 … 변론하겠습니다’로 나누면 현대 표준 한국어와 공적 연설의 격식에 자연스럽습니다.
  terminology: יַהְוֶה는 프로젝트 방침에 맞게 ‘야훼’로 유지했습니다. צִדְקוֹת는 추상 명사가 아니라 역사 속의 구체적 의로운 행위를 가리키므로 ‘의로운 행위들’로 옮겼습니다. ‘변론’은 משפט 어근의 법정적 맥락을 보존하면서 ‘심판’처럼 이미 판결을 내린 의미를 피합니다.
