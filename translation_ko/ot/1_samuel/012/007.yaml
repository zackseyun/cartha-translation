id: 1SA.12.7
reference: 1 Samuel 12:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִֽתְיַצְּב֛וּ וְ/אִשָּׁפְטָ֥ה אִתְּ/כֶ֖ם לִ/פְנֵ֣י יְהוָ֑ה אֵ֚ת כָּל צִדְק֣וֹת יְהוָ֔ה אֲשֶׁר עָשָׂ֥ה אִתְּ/כֶ֖ם וְ/אֶת אֲבוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/007.yaml
  text: Now therefore[a], stand here[b], and I will contend with you before Yahweh concerning all the righteous acts of Yahweh that he did for you and for your fathers.
  footnotes:
  - marker: a
    text: Or 'I will judge you,' 'I will reason with you,' or 'let me plead my case with you.' The Hebrew has a forensic sense of entering into a case before the LORD.
    reason: lexical_alternative
  - marker: b
    text: '''Righteous acts'' refers to the LORD''s just and covenant-faithful deeds on behalf of his people.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 이제[a] 서십시오. 내가 야훼 앞에서, 야훼께서 너희와 너희 조상들을 위해 행하신 모든 의로운 행위들을 두고 너희와 변론하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그러므로 이제’는 단순한 시간 표현만이 아니라, 사무엘의 논지가 다음 단계로 넘어감을 나타내는 전환 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now therefore
  chosen_korean: 그러니 이제
  alternatives_korean:
  - 이제
  - 그러므로 이제
  lexicon: HALOT
  rationale: 전환과 추론의 뉘앙스를 함께 담아, 단순한 시간 표시보다 담화 진행의 압력을 살렸습니다.
- source_word: הִתְיַצְּבוּ
  english_pob_choice: stand here
  chosen_korean: 여기에 서서
  alternatives_korean:
  - 서십시오
  - 자리를 잡으십시오
  - 서 있으십시오
  lexicon: HALOT
  rationale: 공적 심문 장면의 소환을 드러내기 위해 ‘서다’의 명령적 의미를 살렸고, 장소 감각도 함께 담았습니다.
- source_word: וְאִשָּׁפְטָה אִתְּכֶם
  english_pob_choice: and I will contend with you
  chosen_korean: 내가 너희와 다투겠습니다
  alternatives_korean:
  - 너희를 심판하겠습니다
  - 너희와 송사하겠습니다
  - 너희와 변론하겠습니다
  lexicon: HALOT
  rationale: שפט의 법정적 의미를 유지하되, 여기서는 단순 판결 선고보다 상대와의 공적 논쟁·송사를 나타내므로 ‘다투다’가 한국어에서 가장 자연스럽습니다.
- source_word: צִדְקוֹת יְהוָה
  english_pob_choice: the righteous acts of Yahweh
  chosen_korean: 야훼께서 ... 행하신 모든 의로운 일들
  alternatives_korean:
  - 야훼의 모든 의로운 행위들
  - 야훼의 모든 의로운 일
  - 야훼의 모든 공의로운 일들
  lexicon: HALOT
  rationale: צִדְקוֹת는 추상적 ‘의’가 아니라 역사 속에서 드러난 구체적 행위를 가리키므로, ‘의로운 일들’로 옮겨 의인화되지 않은 결과를 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본 표기인 야훼를 그대로 사용하여 고유한 언약 이름을 보존했습니다.
theological_decisions:
- issue: 법정적 언어의 강도
  chosen_reading: ‘다투겠습니다’로 옮겨, 단순한 논박이 아니라 공적·언약적 송사의 긴장을 살렸습니다.
  alternative_readings:
  - 심판하겠습니다
  - 변론하겠습니다
  - 송사하겠습니다
  rationale: 문맥상 사무엘은 백성 앞에서 야훼의 구원사를 근거로 책임을 묻는 장면이므로, 판결 선고보다 논쟁적 심문에 가까운 어감을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5
