  lexicon: HALOT
  rationale: סור는 ‘돌아서다/벗어나다’의 의미가 자연스러워, 언약적 권면의 방향 이탈을 한국어로 간결하게 살렸습니다.
- source_word: אַחֲרֵי הַתֹּהוּ
  english_pob_choice: after worthless things
  chosen_korean: 헛된 것들을 따라
  alternatives_korean:
  - 무가치한 것들을 뒤따라
  - 허무한 것들을 따라
  - 헛것들을 좇아
  lexicon: HALOT
  rationale: אַחֲרֵי는 단순한 ‘뒤에’보다 ‘따라/좇아’가 자연스럽고, תֹהוּ는 여기서 공허하고 무익한 대상을 가리키므로 ‘헛된 것들’로 옮겼습니다.
- source_word: לֹא יוֹעִילוּ וְלֹא יַצִּילוּ
  english_pob_choice: cannot profit or deliver
  chosen_korean: 유익하게도 못 하고 구원하지도 못합니다
  alternatives_korean:
  - 유익하지도 못하고 구해 주지도 못합니다
  - 도움이 되지도 못하고 건져 내지도 못합니다
  - 이익을 주지도 못하고 구원하지도 못합니다
  lexicon: HALOT
  rationale: יועיל은 ‘유익하다/도움이 되다’이고, נצל은 구출·구원을 뜻하므로 두 동사를 병렬로 살리되 현대 한국어에서 자연스러운 부정 표현으로 처리했습니다.
- source_word: כִּי תֹהוּ הֵמָּה
  english_pob_choice: for they are worthless
  chosen_korean: 그것들은 헛된 것들입니다
  alternatives_korean:
  - 그것들은 헛것입니다
  - 그것들은 공허합니다
  - 그것들은 무가치합니다
  lexicon: HALOT
  rationale: 마지막 반복문은 앞의 תֹהוּ를 되풀이해 강조하므로, 앞절과 같은 어휘를 유지해 히브리어의 수사적 반복을 반영했습니다.
theological_decisions:
- issue: תֹהוּ의 범위와 구체성
  chosen_reading: 구체적으로 ‘우상’이라고 단정하지 않고 ‘헛된 것들’로 넓게 유지했습니다.
  alternative_readings:
