id: 1SA.12.21
reference: 1 Samuel 12:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֖א תָּס֑וּרוּ כִּ֣י אַחֲרֵ֣י הַ/תֹּ֗הוּ אֲשֶׁ֧ר לֹֽא יוֹעִ֛ילוּ וְ/לֹ֥א יַצִּ֖ילוּ כִּי תֹ֥הוּ הֵֽמָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/021.yaml
  text: And do not turn aside after worthless things that cannot profit or deliver[b][a], for they are worthless.
  footnotes:
  - marker: a
    text: Or 'empty things,' 'vain things,' or 'idols.' Hebrew tohu denotes what is empty, futile, or insubstantial.
    reason: lexical_alternative
  - marker: b
    text: Or 'save' or 'rescue.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 헛된 것들을 따라 돌아서지 마십시오. 그것들은 유익하게도 못 하고 구원하지도 못합니다[b][a]. 그것들은 헛된 것들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빈 것들’, ‘헛된 것들’, 혹은 ‘우상들’. 히브리어 tohu는 비어 있고, 헛되고, 실체가 없는 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘구원하다’ 혹은 ‘건져내다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּסוּרוּ
  english_pob_choice: turn aside
  chosen_korean: 돌아서지 마십시오
  alternatives_korean:
  - 벗어나지 마십시오
  - 돌아가지 마십시오
  - 떠나지 마십시오
  lexicon: HALOT
  rationale: סור는 ‘돌아서다/벗어나다’의 의미가 자연스러워, 언약적 권면의 방향 이탈을 한국어로 간결하게 살렸습니다.
- source_word: אַחֲרֵי הַתֹּהוּ
  english_pob_choice: after worthless things
  chosen_korean: 헛된 것들을 따라
  alternatives_korean:
  - 무가치한 것들을 뒤따라
  - 허무한 것들을 따라
  - 헛것들을 좇아
  lexicon: HALOT
  rationale: אַחֲרֵי는 단순한 ‘뒤에’보다 ‘따라/좇아’가 자연스럽고, תֹהוּ는 여기서 공허하고 무익한 대상을 가리키므로 ‘헛된 것들’로 옮겼습니다.
- source_word: לֹא יוֹעִילוּ וְלֹא יַצִּילוּ
  english_pob_choice: cannot profit or deliver
  chosen_korean: 유익하게도 못 하고 구원하지도 못합니다
  alternatives_korean:
  - 유익하지도 못하고 구해 주지도 못합니다
  - 도움이 되지도 못하고 건져 내지도 못합니다
  - 이익을 주지도 못하고 구원하지도 못합니다
  lexicon: HALOT
  rationale: יועיל은 ‘유익하다/도움이 되다’이고, נצל은 구출·구원을 뜻하므로 두 동사를 병렬로 살리되 현대 한국어에서 자연스러운 부정 표현으로 처리했습니다.
- source_word: כִּי תֹהוּ הֵמָּה
  english_pob_choice: for they are worthless
  chosen_korean: 그것들은 헛된 것들입니다
  alternatives_korean:
  - 그것들은 헛것입니다
  - 그것들은 공허합니다
  - 그것들은 무가치합니다
  lexicon: HALOT
  rationale: 마지막 반복문은 앞의 תֹהוּ를 되풀이해 강조하므로, 앞절과 같은 어휘를 유지해 히브리어의 수사적 반복을 반영했습니다.
theological_decisions:
- issue: תֹהוּ의 범위와 구체성
  chosen_reading: 구체적으로 ‘우상’이라고 단정하지 않고 ‘헛된 것들’로 넓게 유지했습니다.
  alternative_readings:
  - 우상들
  - 헛것들
  - 공허한 것들
  rationale: 문맥상 우상이나 잘못된 의지처를 가리키지만, 히브리어는 더 넓은 ‘텅 빔/무익함’을 쓰므로 번역도 그 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve the source text''s plain sense without importing more specificity than warranted.'
