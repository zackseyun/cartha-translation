  yaml_path: translation/ot/1_samuel/012/021.yaml
  text: And do not turn aside after worthless things that cannot profit or deliver[b][a], for they are worthless.
  footnotes:
  - marker: a
    text: Or 'empty things,' 'vain things,' or 'idols.' Hebrew tohu denotes what is empty, futile, or insubstantial.
    reason: lexical_alternative
  - marker: b
    text: Or 'save' or 'rescue.'
    reason: lexical_alternative
translation:
  language: ko
  text: 헛된 것들[a]을 따라 돌아서지 마십시오. 그것들은 유익을 주지도 못하고 구해 내지도 못합니다[b]. 그것들은 헛된 것들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빈 것들’, ‘헛된 것들’, 혹은 ‘우상들’. 히브리어 tohu는 비어 있고, 헛되고, 실체가 없는 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘구원하다’ 혹은 ‘건져내다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּסוּרוּ
  english_pob_choice: turn aside
  chosen_korean: 돌아서지 마십시오
  alternatives_korean:
  - 벗어나지 마십시오
  - 돌아가지 마십시오
