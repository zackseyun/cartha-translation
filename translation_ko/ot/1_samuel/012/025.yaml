id: 1SA.12.25
reference: 1 Samuel 12:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם הָרֵ֖עַ תָּרֵ֑עוּ גַּם אַתֶּ֥ם גַּֽם מַלְכְּ/כֶ֖ם תִּסָּפֽוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/025.yaml
  text: But if you persist in doing evil[b][a], both you and your king will be swept away.
  footnotes:
  - marker: a
    text: Or 'if you do evil' or 'if you act wickedly'; the Hebrew intensifies the verb with an infinitive absolute.
    reason: lexical_alternative
  - marker: b
    text: Or 'will perish' or 'will be destroyed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 여러분이 악을 계속 행하면[a], 여러분과 여러분의 왕도[b] 함께 쓸려가 버릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 부정적 동사 어근을 강조형으로 반복해 ‘정녕/계속 악을 행하다’의 뉘앙스를 냅니다.
    reason: alternative_reading
  - marker: b
    text: ‘쓸려가다’는 히브리어 תִּסָּפוּ의 심판적 소멸·제거 이미지를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 직전 문맥의 약속과 대비되는 경고이므로, 단순 조건문보다 역접을 드러내는 ‘그러나 만일’이 히브리어의 담화 기능을 더 잘 반영합니다.
- source_word: הָרֵעַ תָּרֵעוּ
  english_pob_choice: you persist in doing evil
  chosen_korean: 악을 계속 행하면
  alternatives_korean:
  - 악을 행하면
  - 정녕 악을 행하면
  - 악하게 행하면
  lexicon: HALOT
  rationale: 동사의 부정적 의미가 분명하되, 부정 행위의 반복·강조를 살려 ‘계속 행하다’로 옮겼습니다. 한국어에서 어색한 어근 반복은 피하되 강조는 유지합니다.
- source_word: גַּם אַתֶּם גַּם מַלְכְּכֶם
  english_pob_choice: both you and your king
  chosen_korean: 여러분과 여러분의 왕도
  alternatives_korean:
  - 여러분도, 여러분의 왕도
  - 여러분과 왕 모두
  lexicon: HALOT
  rationale: 반복된 גַּם의 포괄성을 살리기 위해 두 주체가 함께 포함된다는 점을 분명히 했습니다. 문맥상 공동 책임과 공동 경고가 드러나야 합니다.
- source_word: תִּסָּפוּ
  english_pob_choice: will be swept away
  chosen_korean: 쓸려가 버릴 것입니다
  alternatives_korean:
  - 멸망할 것입니다
  - 사라질 것입니다
  - 없어질 것입니다
  lexicon: HALOT
  rationale: 니팔형의 수동·심판 의미를 살리면서, 단순 소멸보다 ‘쓸려가다’가 심판 아래에서 제거되는 이미지를 잘 전달합니다.
theological_decisions:
- issue: 왕까지 포함된 공동 심판 경고의 범위
  chosen_reading: 백성과 왕이 함께 하나님의 심판 아래 놓인다는 집단적 경고로 읽었습니다.
  alternative_readings:
  - 정치적 패망만을 가리키는 경고
  - 개인적 도덕 실패만을 가리키는 경고
  rationale: 본문은 왕과 백성을 함께 묶어 경고하므로, 심판의 범위를 좁히지 않고 공동체적·언약적 경고로 보존해야 합니다.
  doctrine_reference: 언약적 책임과 공동 심판의 본문 맥락
- issue: 강조를 위한 히브리어 동사 중복의 처리
  chosen_reading: ‘악을 계속 행하면’으로 옮겨 반복된 동작의 강조를 살렸습니다.
  alternative_readings:
  - ‘악을 행하면’
  - ‘분명히 악을 행하면’
  rationale: 히브리어의 부정적 강조를 평이한 단회 행위로 약화시키지 않기 위해, 행위의 지속성과 강화된 경고를 드러냈습니다.
  doctrine_reference: 본문의 수사적 강조 보존
