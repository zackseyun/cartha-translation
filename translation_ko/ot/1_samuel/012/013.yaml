source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֥ה הַ/מֶּ֛לֶךְ אֲשֶׁ֥ר בְּחַרְתֶּ֖ם אֲשֶׁ֣ר שְׁאֶלְתֶּ֑ם וְ/הִנֵּ֨ה נָתַ֧ן יְהוָ֛ה עֲלֵי/כֶ֖ם מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/013.yaml
  text: And now[a], here is the king whom you have chosen, whom you have asked for; and look, Yahweh has set a king over you.
  footnotes:
  - marker: a
    text: Or, more literally, 'the LORD has given a king over you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 보십시오. 여러분이 선택한 그 왕, 여러분이 요구한 그 왕입니다. 보십시오, 야훼께서 여러분 위에 한 왕을 세우셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 자, 이제
  lexicon: HALOT
  rationale: 시간 전환과 담화 연결을 함께 나타내는 표현으로, 현대 한국어에서 자연스럽고 간결한 ‘이제’를 택했습니다.
- source_word: הִנֵּה
  english_pob_choice: here is / look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 있습니다
  - 자 보십시오
  lexicon: HALOT
  rationale: 청중의 주의를 끄는 감탄·지시 기능을 살려, 합쇼체 담화에 맞는 직접적 주의 환기 표현으로 옮겼습니다.
- source_word: אֲשֶׁר בְּחַרְתֶּם / אֲשֶׁר שְׁאֶלְתֶּם
  english_pob_choice: whom you have chosen, whom you have asked for
  chosen_korean: 여러분이 선택한 그 왕, 여러분이 요구한 그 왕
  alternatives_korean:
  - 여러분이 택한 그 왕, 여러분이 청한 그 왕
  - 여러분이 뽑은 그 왕, 여러분이 구한 그 왕
  lexicon: HALOT
  rationale: בחר와 שאל의 병렬을 각각 ‘선택하다’와 ‘요구하다’로 나누어, 왕을 달라고 요청한 이스라엘의 책임성을 분명히 드러냈습니다.
- source_word: נָתַן יְהוָה עֲלֵיכֶם מֶלֶךְ
  english_pob_choice: Yahweh has set a king over you
  chosen_korean: 야훼께서 여러분 위에 한 왕을 세우셨습니다
  alternatives_korean:
  - 야훼께서 여러분에게 한 왕을 주셨습니다
  - 야훼께서 여러분을 다스릴 왕을 세우셨습니다
  lexicon: HALOT
  rationale: נתן + על의 관용적 의미를 단순한 ‘주다’보다 ‘세우다’로 살려, 왕권 부여와 지배 관계를 함께 표현했습니다.
theological_decisions:
- issue: יהוה(YHWH) 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 고유 신명 יְהוָה를 존칭 대체어가 아니라 음역형 ‘야훼’로 옮겨, 본문이 드러내는 언약적 고유명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
