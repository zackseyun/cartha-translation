revisions:
- from: 그러자 온 백성이 사무엘에게 말했습니다. “야훼 당신의 하나님께 당신의 종들을 위하여 기도해 주십시오. 그리고 우리가 죽지 않게 해 주십시오. 우리가 이미 모든 죄에 더해 이 악, 곧 우리를 위해 왕을 구한 일을 보탰기 때문입니다.”[a]
  to: 그러자 온 백성이 사무엘에게 말했습니다. “야훼, 당신의 하나님께 당신의 종들을 위하여 기도해 주십시오[a]. 그리고 우리가 죽지 않게 해 주십시오. 우리가 우리의 모든 죄에 우리 자신을 위해 왕을 요구한 이 악을 더했기 때문입니다.”
  rationale: ‘왕을 구한’은 요청·요구를 뜻하는 히브리어 동사의 의미를 충분히 드러내지 못하므로 ‘왕을 요구한’으로 고쳤습니다. 원문에 없는 ‘이미’를 삭제하고, 누적 구조를 ‘우리의 모든 죄에 … 이 악을 더했다’로 재구성했습니다. 또한 각주 표지를 해당 기도 요청 뒤로 옮겼습니다.
