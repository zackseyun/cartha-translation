  text: וַ/יֹּאמְר֨וּ כָל הָ/עָ֜ם אֶל שְׁמוּאֵ֗ל הִתְפַּלֵּ֧ל בְּעַד עֲבָדֶ֛י/ךָ אֶל יְהוָ֥ה אֱלֹהֶ֖י/ךָ וְ/אַל נָמ֑וּת כִּֽי יָסַ֤פְנוּ עַל כָּל חַטֹּאתֵ֨י/נוּ֙ רָעָ֔ה לִ/שְׁאֹ֥ל לָ֖/נוּ מֶֽלֶךְ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/019.yaml
  text: 'Then all the people said to Samuel[a], “Pray to Yahweh your God for your servants, and do not let us die, for we have added to all our sins this evil: to ask for a king for ourselves.”'
  footnotes:
  - marker: a
    text: Or 'intercede ... on behalf of your servants.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 온 백성이 사무엘에게 말했습니다. “야훼 당신의 하나님께 당신의 종들을 위하여 기도해 주십시오. 그리고 우리가 죽지 않게 해 주십시오. 우리가 이미 모든 죄에 더해 이 악, 곧 우리를 위해 왕을 구한 일을 보탰기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 종들을 대신하여 중재해 주십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָעָם
  english_pob_choice: all the people
  chosen_korean: 온 백성
  alternatives_korean:
  - 모든 백성
  - 백성 전체
  lexicon: HALOT
  rationale: 집합명사로서의 כָל הָעָם을 자연스러운 현대 한국어로 압축해 옮겼습니다.
- source_word: הִתְפַּלֵּל
  english_pob_choice: Pray
  chosen_korean: 기도해 주십시오
  alternatives_korean:
  - 기도하십시오
  - 중보해 주십시오
  lexicon: HALOT
  rationale: 사무엘에게 향한 요청이므로 합쇼체 청유로 옮기되, 뒤의 בְּעַד가 드러내는 중보성을 살려 ‘기도해 주십시오’로 번역했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서 기준에 따라 신명은 ‘야훼’로 옮겨 하나님의 고유명을 보존했습니다.
- source_word: בְּעַד עֲבָדֶיךָ
  english_pob_choice: for your servants
  chosen_korean: 당신의 종들을 위하여
  alternatives_korean:
  - 당신의 종들을 위해
  - 당신의 종들을 대신하여
  lexicon: HALOT
  rationale: בְּעַד의 ‘위하여/대신하여’ 의미를 살리되, עֲבָדֶיךָ의 종속적 자기호칭을 그대로 유지했습니다.
- source_word: וְאַל נָמוּת
  english_pob_choice: and do not let us die
  chosen_korean: 그리고 우리가 죽지 않게 해 주십시오
  alternatives_korean:
  - 그리고 우리를 죽게 하지 마십시오
  - 우리가 죽지 않도록 해 주십시오
  lexicon: HALOT
  rationale: אַל 부정 요청을 직접적으로 옮겨, 간청의 절박함을 유지했습니다.
- source_word: רָעָה
  english_pob_choice: this evil
  chosen_korean: 이 악
  alternatives_korean:
  - 이 잘못
  - 이 죄악
  lexicon: HALOT
  rationale: 도덕적 악행을 가리키는 רָעָה를 약화시키지 않기 위해 ‘이 악’으로 직역했습니다.
- source_word: לִשְׁאֹל לָנוּ מֶלֶךְ
  english_pob_choice: to ask for a king for ourselves
  chosen_korean: 우리를 위해 왕을 구한 일
  alternatives_korean:
  - 우리에게 왕을 요청한 일
  - 스스로 왕을 구한 일
  lexicon: HALOT
  rationale: לִשְׁאֹל의 요청/구함을 한국어 명사구로 자연화했고, לָנוּ는 문맥상 ‘우리를 위해’로 풀어 자기 지향성을 드러냈습니다.
theological_decisions:
- issue: 사무엘에게 향한 백성의 간청에서 2인칭 소유격을 어떻게 보존할지
  chosen_reading: ‘야훼 당신의 하나님’과 ‘당신의 종들’로 유지해, 백성이 사무엘을 중보자로 부르며 하나님을 ‘당신의 하나님’이라 칭하는 긴장을 그대로 남겼습니다.
  alternative_readings:
  - 야훼 우리의 하나님
  - 야훼 사무엘의 하나님
  rationale: 본문은 회개 후에도 백성이 사무엘을 매개로 호소하는 장면이므로, 관계적 긴장을 완화하지 않는 것이 원문 효과에 더 가깝습니다.
  doctrine_reference: 본문의 수사적 긴장 보존
- issue: ‘우리의 모든 죄에 더해 이 악을 보탰다’의 죄-악 병렬
  chosen_reading: ‘우리가 이미 모든 죄에 더해 이 악…을 보탰기 때문입니다’로, 죄 목록 위에 추가된 구체적 악행이라는 구조를 유지했습니다.
  alternative_readings:
  - 우리의 모든 죄에 더하여 이 악을 더했습니다
  - 모든 죄를 덧붙여 이 악을 저질렀습니다
  rationale: 히브리어의 추가적 누적 구조를 살려, 왕을 구한 행위가 기존 죄들 위에 얹힌 새로운 악이라는 고발을 분명히 했습니다.
  doctrine_reference: 회개 진술의 누적성 보존
