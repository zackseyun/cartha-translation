source:
  edition: WLC
  text: גַּ֣ם אָנֹכִ֗י חָלִ֤ילָ/ה לִּ/י֙ מֵ/חֲטֹ֣א לַֽ/יהוָ֔ה מֵ/חֲדֹ֖ל לְ/הִתְפַּלֵּ֣ל בַּעַדְ/כֶ֑ם וְ/הוֹרֵיתִ֣י אֶתְ/כֶ֔ם בְּ/דֶ֥רֶךְ הַ/טּוֹבָ֖ה וְ/הַ/יְשָׁרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/023.yaml
  text: As for me[a], far be it from me that I should sin against Yahweh by ceasing to pray for you[c][b]; and I will instruct you in the good and upright way.
  footnotes:
  - marker: a
    text: Or 'from ceasing to pray for you.' The Hebrew expresses the sin as stopping intercession on their behalf.
    reason: lexical_alternative
  - marker: b
    text: Or 'teach you' instead of 'instruct you.' The Hebrew verb can include both teaching and directing.
    reason: lexical_alternative
  - marker: c
    text: '''The LORD'' renders the divine name YHWH.'
    reason: alternative_reading
translation:
  language: ko
  text: 저로서는 여러분을 위해 기도하기를 그만두어[a] 야훼께[c] 죄를 짓는 일은 결코 있을 수 없습니다. 그리고 저는 여러분에게 선하고 올바른 길을 가르치겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘여러분을 위해 기도하기를 그만두는 것으로’입니다. 히브리어는 그들을 위한 중보를 중단하는 일을 야훼께 죄를 짓는 일로 말합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가르치겠습니다’는 ‘인도하겠습니다’ 또는 ‘지도하겠습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘야훼’는 히브리어 신명 YHWH를 옮긴 것입니다.
    reason: ot_citation
lexical_decisions:
- source_word: גַּם אָנֹכִי
  english_pob_choice: As for me
  chosen_korean: 저로서는
  alternatives_korean:
  - 그리고 저도
  - 또 저도
  lexicon: HALOT
  rationale: 화자 자신을 대조적으로 강조하는 표현이므로, 담화상 초점을 살리는 ‘저로서는’이 자연스럽습니다.
- source_word: חָלִילָה לִּי מֵחֲטֹא לַיהוָה
  english_pob_choice: far be it from me that I should sin against Yahweh
  chosen_korean: …야훼께 죄를 짓는 일은 결코 없을 것입니다
  alternatives_korean:
  - …야훼께 죄짓는 것은 제게서 멀리할 것입니다
  - …야훼께 죄를 범하는 일은 저에게 있을 수 없습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 강한 부인과 혐오를 나타내므로, 한국어에서도 완곡하게 약화시키지 않고 단호한 부정을 살렸습니다.
- source_word: מֵחֲדֹל לְהִתְפַּלֵּל בַּעַדְכֶם
  english_pob_choice: by ceasing to pray for you
  chosen_korean: 여러분을 위하여 기도하기를 그쳐서
  alternatives_korean:
  - 여러분을 위해 기도하기를 멈추어서
  - 여러분을 위하여 기도하는 일을 중단해서
  lexicon: HALOT
  rationale: 죄의 내용이 ‘중보를 그만두는 것’임을 분명히 드러내기 위해, ‘기도하기를 그쳐서’로 자연스럽게 옮겼습니다.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  english_pob_choice: and I will instruct you
  chosen_korean: 그리고 저는 여러분에게 … 가르치겠습니다
  alternatives_korean:
  - 그리고 저는 여러분을 지도하겠습니다
  - 그리고 저는 여러분에게 … 가르치겠습니다
  lexicon: HALOT
  rationale: הורה는 가르치다/지시하다의 넓은 뜻이 있으나, 이 문맥에서는 백성을 바른 길로 이끄는 교육적 의미가 중심이므로 ‘가르치겠습니다’가 적절합니다.
- source_word: בְּדֶרֶךְ הַטּוֹבָה וְהַיְשָׁרָה
  english_pob_choice: in the good and upright way
  chosen_korean: 선하고 올바른 길
  alternatives_korean:
  - 좋고 바른 길
  - 선하고 곧은 길
  lexicon: HALOT
  rationale: ‘דרך’의 비유적 의미를 살려 ‘길’로 옮기고, اخلاق적 품질을 ‘선하고 올바른’으로 압축해 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 신명기적 고유명을 일반 호칭으로 바꾸지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘sin against Yahweh’의 강도를 약화할지 여부
  chosen_reading: ‘야훼께 죄를 짓는 일’로 직접적으로 표현했습니다.
  alternative_readings:
  - 단순히 ‘여러분을 저버리는 일’로 완화
  - ‘책임을 다하지 않는 일’로 일반화
  rationale: 본문은 중보를 중단하는 행위를 단순한 직무 태만이 아니라 야훼께 대한 죄로 규정하므로, 그 신학적 무게를 그대로 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: 히브리어 ‘가르치다/인도하다’의 범위
  chosen_reading: 교육적 의미가 전면에 드러나는 ‘가르치겠습니다’로 옮겼습니다.
  alternative_readings:
  - ‘인도하겠습니다’
  - ‘지도하겠습니다’
  rationale: 문맥상 사무엘의 역할은 백성을 올바른 삶의 길로 훈련시키는 것이므로, 의미 범위를 지나치게 좁히지 않으면서도 가장 자연스러운 한국어를 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3
