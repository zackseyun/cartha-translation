  source_fidelity: 초안은 폭풍 문맥의 קֹלֹת를 ‘천둥’으로, מָטָר를 ‘비’로 옮기고, ירא가 야훼와 사무엘 모두에 적용되는 구문을 보존하여 대체로 충실합니다. 다만 ‘부르짖자’는 원문의 단순 연속 서술을 인과·즉시 관계로 만들며, ‘부르짖다’는 קרא의 기본 표현보다 다소 강합니다.
