base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/018.yaml
  text: Then Samuel called to Yahweh[a], and Yahweh sent thunder and rain that day; and all the people greatly feared Yahweh and Samuel.
  footnotes:
  - marker: a
    text: Hebrew 'voices'; in this storm context the term refers to thunder.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사무엘이 야훼께 부르짖었습니다. 야훼께서 그날 천둥[a]과 비를 내리셨습니다. 그러자 모든 백성은 야훼와 사무엘을 몹시 두려워했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘소리들’이지만, 이 폭풍 문맥에서는 천둥을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל יְהוָה
  english_pob_choice: called to Yahweh
  chosen_korean: 야훼께 부르짖자
  alternatives_korean:
  - 야훼께 부르자
  - 야훼를 불렀습니다
  - 야훼께 외쳤습니다
  lexicon: HALOT
  rationale: קרא + אל יהוה는 단순한 호출보다 간구하는 부르짖음의 뉘앙스를 가질 수 있어, 상황에 맞게 ‘부르짖자’로 옮겨 기도적 행위를 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문의 신명은 관습적 대체어 대신 프로젝트 기본값인 고유명 ‘야훼’로 일관되게 옮겼습니다.
- source_word: וַיִּתֵּן ... קֹלֹת וּמָטָר
  english_pob_choice: sent thunder and rain
  chosen_korean: 천둥과 비를 내리셨습니다
  alternatives_korean:
  - 천둥과 비를 보내셨습니다
  - 우렛소리와 비를 주셨습니다
  lexicon: HALOT
  rationale: קֹלֹת은 문맥상 ‘우렛소리/천둥’이지만, 한국어에서는 자연스럽고 문맥을 살리는 ‘천둥’이 적절합니다. וַיִּתֵּן은 하나님이 폭풍을 일으키신 결과를 나타내므로 ‘내리셨습니다’로 처리했습니다.
- source_word: וַיִּירָא ... מְאֹד
  english_pob_choice: greatly feared
  chosen_korean: 크게 두려워했습니다
  alternatives_korean:
  - 매우 두려워했습니다
  - 크게 경외했습니다
  - 몹시 두려워했습니다
  lexicon: HALOT
  rationale: ירא의 기본적 감각인 두려움을 보존하되, מְאֹד의 강도를 ‘크게’로 옮겨 본문의 공포 반응을 약화시키지 않았습니다.
theological_decisions:
- issue: 야훼와 사무엘을 함께 두려워한 표현
  chosen_reading: 야훼와 사무엘을 크게 두려워했습니다
  alternative_readings:
  - 야훼를 두려워하고 사무엘을 존중했습니다
  - 야훼를 경외하고 사무엘을 두려워했습니다
  rationale: 히브리어는 같은 동사 ירא를 두 목적어에 함께 적용하므로, 야훼와 사무엘을 나누어 다른 감정으로 정리하지 않고 본문의 긴장을 그대로 유지했습니다. 이는 사무엘을 하나님의 대리자로 인식한 공동체의 반응을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
