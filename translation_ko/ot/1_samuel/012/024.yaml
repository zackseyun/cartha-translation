translation:
  language: ko
  text: 오직 야훼를 두려워하고 온 마음을 다해 충실히 그분을 섬기십시오. 야훼께서 여러분과 함께 얼마나 큰일을 행하셨는지 보십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
