  text: הִנְ/נִ֣י עֲנ֣וּ בִ/י֩ נֶ֨גֶד יְהוָ֜ה וְ/נֶ֣גֶד מְשִׁיח֗/וֹ אֶת שׁוֹר֩ מִ֨י לָקַ֜חְתִּי וַ/חֲמ֧וֹר מִ֣י לָקַ֗חְתִּי וְ/אֶת מִ֤י עָשַׁ֨קְתִּי֙ אֶת מִ֣י רַצּ֔וֹתִי וּ/מִ/יַּד מִי֙ לָקַ֣חְתִּי כֹ֔פֶר וְ/אַעְלִ֥ים עֵינַ֖/י בּ֑/וֹ וְ/אָשִׁ֖יב לָ/כֶֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/003.yaml
  text: 'Here I am[a]; testify against me before Yahweh and before his anointed: whose ox have I taken, or whose donkey have I taken? Whom have I oppressed? Whom have I mistreated? From whose hand have I taken a bribe[b], that I should hide my eyes with it? I will restore it to you.'
  footnotes:
  - marker: a
    text: Or, 'Whom have I wronged?' The Hebrew verb rendered 'have I crushed' is difficult and may broadly denote mistreating or abusing someone.
    reason: lexical_alternative
  - marker: b
    text: '''Bribe'' could also be rendered ''ransom'' or ''payment,'' but the context of ''hiding my eyes'' favors a corrupt payment that perverts justice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 제가 여기 있습니다[a]. 야훼 앞과 그의 기름부음받은 자 앞에서 내게 대답하여 증언하십시오. 내가 누구의 소를 빼앗았습니까, 또는 누구의 나귀를 빼앗았습니까? 내가 누구를 억압했습니까? 내가 누구를 괴롭혔습니까? 누구의 손에서 뇌물[b]을 받았기에, 그것으로 내 눈을 가렸겠습니까? 그러면 내가 그것을 여러분에게 돌려드리겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 הִנְנִי 는 단순한 위치 설명보다 공적 자기 제시와 응답 가능성을 나타내는 관용구입니다.
    reason: source_note
  - marker: b
    text: '''뇌물''은 ''속전''이나 ''대가''로도 옮길 수 있으나, 이어지는 ''내 눈을 가렸겠습니까''라는 문맥이 부패한 지급을 가리킵니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Here I am
  chosen_korean: 보십시오, 제가 여기 있습니다
  alternatives_korean:
  - 여기 있습니다
  - 보라, 제가 여기 있습니다
  lexicon: HALOT
  rationale: 자기 출현과 공적 응답 준비를 나타내는 관용구이므로, 현대 한국어에서 자연스러운 공적 발화로 풀되 즉각적 주목을 요청하는 힘을 살렸습니다.
- source_word: עֲנוּ בִי
  english_pob_choice: testify against me
  chosen_korean: 내게 대답하여 증언하십시오
  alternatives_korean:
  - 나를 대적하여 증언하십시오
  - 내게 대답하십시오
  lexicon: HALOT
  rationale: 법정적·공적 맥락에서 단순한 '대답'보다 증언 행위가 핵심이므로, 한국어에서도 증언의 책임을 분명히 드러냈습니다.
- source_word: מְשִׁיחוֹ
  english_pob_choice: his anointed
  chosen_korean: 그의 기름부음받은 자
  alternatives_korean:
  - 그의 메시아
  - 그가 기름부으신 이
  lexicon: HALOT
  rationale: 본문의 왕정 맥락을 따라 고유명 '메시아'보다 기능적 표현을 택해, 야훼가 세운 왕이라는 의미를 그대로 보존했습니다.
- source_word: רַצּוֹתִי
  english_pob_choice: have I crushed / have I mistreated
  chosen_korean: 괴롭혔습니까
  alternatives_korean:
  - 학대했습니까
  - 짓눌렀습니까
  - 해를 끼쳤습니까
  lexicon: HALOT
  rationale: 앞선 '억압하다'와 같은 뜻으로 평평하게 만들지 않기 위해, 강압적·가혹한 처우의 뉘앙스를 가진 동사로 구분해 옮겼습니다.
- source_word: כֹּפֶר
  english_pob_choice: a bribe
  chosen_korean: 뇌물
  alternatives_korean:
  - 속전
  - 보상금
  - 대가
  lexicon: HALOT
  rationale: 문맥상 눈을 가려 정의를 굽게 만드는 부패한 지급을 가리키므로, 한국어에서도 사법적 부정성을 드러내는 '뇌물'이 가장 적절합니다.
