  text: And they said[a], “You have not oppressed us, and you have not mistreated us, and you have not taken anything from any man's hand.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''from any man''s hand.'' The phrase likely refers to taking any payment, gift, or bribe from anyone.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말하였습니다[a]. “주님께서는 우리를 압박하지도 않으셨고, 우리를 학대하지도 않으셨으며, 어떤 사람의 손에서도 아무것도 빼앗지 않으셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘어떤 사람의 손에서’라고 직역합니다. 이는 보통 금품, 선물, 뇌물의 수수를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And they said
  chosen_korean: 그들이 말하였습니다
  alternatives_korean:
  - 그리고 그들이 말하였습니다
  - 그들이 말하였습니다
  lexicon: WLC; narrative wayyiqtol
  rationale: 서사 진행을 자연스럽게 살리되, 영어의 단순한 접속문 흐름을 그대로 따라가 한국어 문장을 과도하게 늘리지 않았습니다.
- source_word: עֲשַׁקְתָּנוּ
  english_pob_choice: you have not oppressed us
  chosen_korean: 우리를 압박하지도 않으셨고
  alternatives_korean:
  - 우리를 억압하지도 않으셨고
  - 우리를 착취하지도 않으셨고
  lexicon: HALOT
  rationale: עָשַׁק은 힘의 남용, 착취, 압박의 뉘앙스를 가지므로 공적 맥락에서 넓게 포괄하는 ‘압박하다’를 택했습니다.
- source_word: רַצּוֹתָנוּ
  english_pob_choice: you have not mistreated us
  chosen_korean: 우리를 학대하지도 않으셨으며
  alternatives_korean:
  - 우리를 해치지도 않으셨으며
  - 우리를 못살게 굴지도 않으셨으며
  lexicon: HALOT
  rationale: 무례한 대우나 해악을 가하는 뜻을 살리기 위해, 한국어에서 강도가 분명한 ‘학대하다’를 사용했습니다.
- source_word: לָקַחְתָּ מִיַּד אִישׁ מְאוּמָה
  english_pob_choice: you have not taken anything from any man's hand
  chosen_korean: 어떤 사람의 손에서도 아무것도 빼앗지 않으셨습니다
  alternatives_korean:
  - 어떤 사람의 손에서든 아무것도 받지 않으셨습니다
  - 어떤 사람의 손에서 아무것도 취하지 않으셨습니다
  lexicon: HALOT
  rationale: ‘손에서 취하다’는 단순 수취가 아니라 권력이나 부당이득의 맥락을 띠므로, 문맥상 금품·뇌물 수수를 포함해 ‘빼앗다’로 옮겨 의미의 힘을 드러냈습니다.
theological_decisions:
- issue: 이스라엘 지도자의 무죄 변증을 한국어에서 어떻게 강하게 드러낼 것인가
  chosen_reading: 부정의 3중 반복을 유지해, 사무엘이 공적으로 받은 해가 전혀 없음을 분명히 했습니다.
  alternative_readings:
  - 두 번째와 세 번째 부정을 완화해 더 유려하게 만들기
  - ‘학대’와 ‘빼앗다’를 모두 순화하기
  rationale: 히브리어의 세 번 반복된 부정은 단순 정보가 아니라 공적 정당성 선언이므로, 한국어에서도 동일한 수사적 힘을 보존했습니다.
  doctrine_reference: 공적 무결성, 지도자 윤리
