  source_fidelity: 수정이 필요합니다. 히브리어 2인칭 남성 단수는 사무엘을 가리키는데, 초안의 ‘주님께서는’은 화자를 주님으로 바꾸어 본문의 지시 대상을 잘못 전달합니다. 또한 לָקַח מִיַּד … מְאוּמָה는 ‘누구에게서든 아무것도 받다/취하다’라는 뜻이며, ‘빼앗다’는 강제 탈취의 뜻을 불필요하게 더합니다.
  naturalness: ‘당신께서는’은 원문의 직접 호칭을 유지하면서 합쇼체 존대를 자연스럽게 나타냅니다. ‘어떤 사람에게서도 아무것도 받지 않으셨습니다’는 한국어에서 명료하고 자연스럽습니다.
  terminology: עָשַׁק에는 공적 권력을 이용한 억압·착취의 뜻이 있으므로 ‘억압하다’가 적절합니다. רָצַץ는 비유적으로 잔혹하게 다루거나 해치는 뜻을 나타내므로 ‘학대하다’가 문맥에 맞습니다. ‘받다’는 마지막 동사의 수취 의미를 보존하며 뇌물로 단정하지 않습니다.
