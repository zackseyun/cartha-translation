lexical_decisions:
- source_word: גַּם עַתָּה
  english_pob_choice: Now then
  chosen_korean: 지금이니
  alternatives_korean:
  - 이제
  - 그러므로 지금
  lexicon: HALOT
  rationale: 말을 전환하며 엄숙한 주의를 환기하는 담화 표지이므로, 현대 한국어에서 자연스럽고 호소력 있는 「지금이니」로 옮겼습니다.
- source_word: הִתְיַצְּבוּ
  english_pob_choice: stand still
  chosen_korean: 서 있으면서
  alternatives_korean:
  - 가만히 서 있으십시오
  - 서 있으십시오
  lexicon: HALOT
  rationale: 단순한 정지 명령이 아니라, 하나님의 행위를 지켜보도록 자리를 지키라는 뜻이므로 ‘서 있으면서’로 동작 지속과 관찰의 뉘앙스를 함께 살렸습니다.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  english_pob_choice: this great thing
  chosen_korean: 이 큰 일
  alternatives_korean:
  - 이 큰 일들
  - 이 큰 사건
  lexicon: HALOT
  rationale: דָבָר가 여기서는 특정한 말보다 눈앞에 벌어질 놀라운 행위를 가리키므로, 과도하게 해석하지 않는 범위에서 ‘일’이 가장 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: יהוה의 고유명사를 전통적 대체어로 바꾸지 않고, 프로젝트 기본값에 따라 학술 음역인 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 본문의 고유명사를 ‘야훼’로 드러내어 번역합니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 יְהוָה를 직접 사용하므로, 독자가 언약의 고유한 이름을 인지하도록 제목어 대체를 피했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
