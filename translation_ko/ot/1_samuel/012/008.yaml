base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/008.yaml
  text: When Jacob came into Egypt[a], your fathers cried out to Yahweh, and Yahweh sent Moses and Aaron[b], and they brought your fathers out of Egypt and settled them in this place.
  footnotes:
  - marker: a
    text: 'Hebrew: ''your fathers''; alternatively, ''your ancestors.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'settled them here' or 'caused them to dwell in this place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱이 이집트로 왔을 때, 여러분의 조상들[a]이 야훼께 부르짖었고, 야훼께서 모세와 아론을 보내셨으며, 그들이 여러분의 조상들을 이집트에서 이끌어 내고 이곳에 정착시켰습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘여러분의 아버지들’입니다. ‘여러분의 조상들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘정착시키다’ 또는 ‘이곳에 살게 하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
