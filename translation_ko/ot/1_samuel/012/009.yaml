revisions:
- from: 그들이 야훼 그들의 하나님을 잊어버렸습니다. 그래서 그분은 그들을 하솔 군대의 사령관 시스라의 손에, 블레셋 사람들의 손에, 모압 왕의 손에 넘기셨고, 그들이 그들과 싸웠습니다.[a]
  to: 그러나 그들은 야훼, 그들의 하나님을 잊었습니다. 그러자 그분은 그들을 하솔 군대의 사령관 시스라의 손에, 블레셋 사람들의 손에, 모압 왕의 손에 팔아넘기셨습니다.[a] 그들이 이스라엘과 싸웠습니다.
  rationale: ‘팔아넘기셨다’로 מכר의 ‘팔다’ 비유를 본문에 보존하고, 각주는 그 관용적 의미를 설명하도록 다듬었습니다. 마지막 절은 히브리어의 문법적 지시 대상을 한국어에서 명료하게 하였습니다. 본문은 현대 표준어 합쇼체를 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:16:59Z'
