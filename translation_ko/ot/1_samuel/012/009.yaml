  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יִּמְכֹּ֣ר אֹתָ֡/ם בְּ/יַ֣ד סִֽיסְרָא֩ שַׂר צְבָ֨א חָצ֜וֹר וּ/בְ/יַד פְּלִשְׁתִּ֗ים וּ/בְ/יַד֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּֽלָּחֲמ֖וּ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/009.yaml
  text: But they forgot Yahweh their God[a], and he sold them into the hand of Sisera, commander of the army of Hazor, and into the hand of the Philistines, and into the hand of the king of Moab; and they fought against them.
  footnotes:
  - marker: a
    text: Or 'he gave them over.' The Hebrew literally says 'he sold them,' a covenant-judgment idiom for handing a people over to the power of their enemies.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 야훼 그들의 하나님을 잊어버렸습니다. 그래서 그분은 그들을 하솔 군대의 사령관 시스라의 손에, 블레셋 사람들의 손에, 모압 왕의 손에 넘기셨고, 그들이 그들과 싸웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들을 팔았다’입니다. 이는 백성을 적의 권세 아래로 넘기시는 언약적 심판을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  english_pob_choice: they forgot
  chosen_korean: 잊어버렸습니다
  alternatives_korean:
  - 잊었습니다
  - 저버렸습니다
  lexicon: HALOT
  rationale: 히브리어 שׁכח의 기본 의미인 ‘잊다’를 살리되, 한국어에서는 ‘잊어버리다’가 관계적·의지적 소홀함까지 자연스럽게 드러내어 문맥의 언약적 함의를 보존합니다.
- source_word: יְהוָה אֱלֹהֵיהֶם
  english_pob_choice: Yahweh their God
  chosen_korean: 야훼 그들의 하나님
  alternatives_korean:
  - 야훼, 그들의 하나님
  - 주 그들의 하나님
  lexicon: WLC/HALOT
  rationale: 여호와가 아니라 하나님의 고유명으로서 야훼를 유지했고, 소유격 관계는 ‘그들의 하나님’으로 옮겨 언약적 관계를 드러냈습니다.
- source_word: וַיִּמְכֹּר אֹתָם
  english_pob_choice: he sold them
  chosen_korean: 그분은 그들을 … 넘기셨고
  alternatives_korean:
  - 그분은 그들을 팔았고
  - 그분은 그들을 넘겨주셨고
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘팔다’를 살릴 수 있으나, 한국어에서 하나님이 백성을 ‘팔았다’는 표현은 오해를 낳기 쉬워, POB 각주가 밝히는 언약적 징계 관용구를 반영해 ‘넘기셨다’로 옮겼습니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: …의 손에
  alternatives_korean:
  - …의 권세에
  - …의 힘 아래에
  lexicon: HALOT
  rationale: ‘손’ 이미지를 유지해 성서적 관용을 보존했고, 반복되는 ‘손에’는 포로화·지배의 감각을 한국어에서도 분명하게 전달합니다.
theological_decisions:
- issue: וַיִּמְכֹּר의 신학적 함의
  chosen_reading: 주어는 야훼이며, 이는 이스라엘이 언약을 어긴 데 대한 심판으로 그들을 적대 세력의 권세 아래 넘기신 행위입니다.
  alternative_readings:
  - 비인칭적으로 ‘그들이 팔렸다’고 이해하는 읽기
  rationale: 앞절의 주어가 ‘야훼 그들의 하나님’으로 제시되므로, 동사는 그분의 사법적 처분을 계속하는 것으로 읽는 것이 가장 자연스럽습니다. 본문이 말하는 심판의 긴장을 완화하지 않기 위해 그 의미를 본문 안에서 드러냈습니다.
  doctrine_reference: 원문 우선, 언약-심판 문맥 보존
- issue: 시스라의 호칭
  chosen_reading: ‘하솔 군대의 사령관’으로 옮겨 군사 지휘관이라는 지위를 현대 한국어로 분명히 했습니다.
  alternative_readings:
  - ‘하솔 군대의 장관’
  - ‘하솔 군대의 대장’
  rationale: שַׂר צְבָא는 군사 지휘관을 가리키며, ‘사령관’이 현대 독자에게 가장 분명하고 위계적 의미를 과장하지 않습니다.
  doctrine_reference: 역사서의 직설적 서술 유지
