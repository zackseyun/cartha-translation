  source_fidelity: 수정이 필요합니다. וַיִּמְכֹּר의 기본 비유인 ‘팔다’를 본문에서 ‘넘기셨고’로만 옮기면 원문의 어휘적 표현이 약화됩니다. 또한 마지막 복수 주어는 앞서 열거된 적대 세력을 가리키고 목적어는 이스라엘 백성을 가리키므로, 한국어의 반복 대명사로 인한 불필요한 혼동을 피할 수 있습니다.
  naturalness: ‘야훼, 그들의 하나님’은 동격 관계를 자연스럽게 드러냅니다. ‘팔아넘기셨다’는 한국어에서 원문의 ‘팔아 적의 지배 아래 넘기다’라는 비유를 보존하면서도 문맥상 이해 가능합니다. 마지막 절은 ‘그들이 그들과’보다 ‘그들이 이스라엘과’가 자연스럽고 명료합니다.
  terminology: 야훼, 하나님, 하솔, 시스라, 블레셋 사람들, 모압 왕은 적절합니다. שַׂר צְבָא는 ‘하솔 군대의 사령관’으로 적절합니다. בְּיַד의 ‘손에’ 반복도 원문의 표현을 잘 보존합니다.
