    rationale: 히브리어의 복수 주어는 열거된 적대 세력이고 접미 목적어는 이스라엘을 가리킵니다. ‘이스라엘과’를 밝혀 한국어 문장의 혼동을 피하되 의미를 추가하지 않습니다.
