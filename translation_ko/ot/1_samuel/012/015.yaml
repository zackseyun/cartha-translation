  source_fidelity: 히브리어 본문의 조건문, ‘야훼의 음성을 듣다’, 명령을 거역함, 그리고 ‘야훼의 손’이라는 심판 은유는 대체로 충실히 반영했습니다. 다만 ‘여러분과 여러분의 조상들 위에 있을 것입니다’는 בְּ의 심판적 용법(‘~을 대적하여’)을 충분히 드러내지 못합니다.
