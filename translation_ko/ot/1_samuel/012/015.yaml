source:
  edition: WLC
  text: וְ/אִם לֹ֤א תִשְׁמְעוּ֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/מְרִיתֶ֖ם אֶת פִּ֣י יְהוָ֑ה וְ/הָיְתָ֧ה יַד יְהוָ֛ה בָּ/כֶ֖ם וּ/בַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/015.yaml
  text: But if you do not listen to the voice of Yahweh and rebel against the command of Yahweh[a], then the hand of Yahweh will be against you and against your fathers.
  footnotes:
  - marker: a
    text: 'Hebrew: ''your fathers.'' Some ancient versions and many interpreters read ''your king,'' which fits the immediate context of Samuel''s warning about both the people and their king.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 만일 여러분이 야훼의 음성에 듣지 않고 야훼의 명령을 거역하면, 야훼의 손이 여러분과 여러분의 조상들 위에 있을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘여러분의 조상들’이라고 읽습니다. 일부 고대 역본과 많은 해석자는 문맥상 ‘여러분의 왕’으로 읽기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 만일
  - 그리고 만일
  lexicon: HALOT
  rationale: 앞절과의 대조를 살리면서 조건절을 자연스럽게 여는 표현으로 옮겼습니다.
- source_word: לֹא תִשְׁמְעוּ בְּקוֹל יְהוָה
  english_pob_choice: you do not listen to the voice of Yahweh
  chosen_korean: 야훼의 음성에 듣지 않고
  alternatives_korean:
  - 야훼의 음성을 듣지 않고
  - 야훼께 순종하지 않고
  lexicon: HALOT
  rationale: ‘~의 음성에 듣다’라는 히브리어 관용을 살리되, 한국어로는 조사와 어순을 자연스럽게 다듬었습니다.
- source_word: וּמְרִיתֶם אֶת פִּי יְהוָה
  english_pob_choice: and rebel against the command of Yahweh
  chosen_korean: 야훼의 명령을 거역하면
  alternatives_korean:
  - 야훼의 말씀을 거역하면
  - 야훼께 반역하면
  lexicon: HALOT
  rationale: ‘입’의 직역보다 문맥상 ‘명령’이 더 분명하며, ‘거역하다’가 반항/불복종의 강도를 잘 드러냅니다.
- source_word: וְהָיְתָה יַד יְהוָה בָּכֶם
  english_pob_choice: then the hand of Yahweh will be against you
  chosen_korean: 야훼의 손이 여러분과 … 위에 있을 것입니다
  alternatives_korean:
  - 야훼의 손이 여러분에게 임할 것입니다
  - 야훼의 손이 여러분에게 있을 것입니다
  lexicon: HALOT
  rationale: ‘손’의 이미지를 보존하면서, 본문의 심판 뉘앙스가 한국어에서 자연스럽게 드러나도록 ‘위에’로 옮겼습니다.
- source_word: וּבַאֲבֹתֵיכֶם
  english_pob_choice: and against your fathers
  chosen_korean: 여러분의 조상들
  alternatives_korean:
  - 여러분의 아버지들
  - 여러분의 선조들
  lexicon: HALOT
  rationale: MT의 ‘fathers’를 한국어 성경 문맥에 맞게 대표적 집단 의미로 옮겼습니다.
theological_decisions:
- issue: יַד יְהוָה의 심판적 표현
  chosen_reading: ‘야훼의 손’은 सक्रिय한 심판/개입을 가리키는 비유로 유지했습니다.
  alternative_readings:
  - ‘야훼께서 너희를 치실 것입니다’
  - ‘야훼의 권능이 너희에게 임할 것입니다’
  rationale: 직역을 보존해야 본문의 경고가 가진 상징성과 긴박감이 살아납니다.
  doctrine_reference: POB contested-metaphor policy for anthropomorphic idioms
