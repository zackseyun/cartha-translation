id: 1SA.12.2
reference: 1 Samuel 12:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֞ה הִנֵּ֥ה הַ/מֶּ֣לֶךְ מִתְהַלֵּ֣ךְ לִ/פְנֵי/כֶ֗ם וַ/אֲנִי֙ זָקַ֣נְתִּי וָ/שַׂ֔בְתִּי וּ/בָנַ֖/י הִנָּ֣/ם אִתְּ/כֶ֑ם וַ/אֲנִי֙ הִתְהַלַּ֣כְתִּי לִ/פְנֵי/כֶ֔ם מִ/נְּעֻרַ֖/י עַד הַ/יּ֥וֹם הַ/זֶּֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/002.yaml
  text: And now[a], look, the king is walking before you, and I have grown old and gray, and here are my sons with you[c][b]. And I have walked before you from my youth until this day.
  footnotes:
  - marker: a
    text: Or 'the king goes before you' or 'the king leads you.' The Hebrew idiom 'walk before' can denote public leadership.
    reason: lexical_alternative
  - marker: b
    text: Or 'I have grown old and become gray-haired.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I have gone before you' or 'I have led you.' Samuel intentionally parallels his own public role with that of the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제, 보십시오. 왕이 여러분 앞에서 다니고 있습니다[a]. 저는 늙어 머리가 세었습니다[b]. 보십시오, 제 아들들은 여러분과 함께 있습니다. 저는 젊은 시절부터 오늘에 이르기까지 여러분 앞에서 다녔습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕이 여러분 앞에 간다’ 또는 ‘왕이 여러분을 인도한다’. 히브리어 관용구 ‘앞에서 걷다’는 공적 지도 역할을 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘늙어 백발이 되었습니다’.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘내가 여러분 앞에서 갔다’ 또는 ‘내가 여러분을 인도했다’. 사무엘은 자신의 공적 역할을 왕의 역할과 의도적으로 나란히 놓고 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그리고 지금
  lexicon: HALOT
  rationale: 담화 전환을 나타내는 연결사 ו와 시간 부사 עַתָּה를 함께 살려, 문맥의 이어짐과 현재성을 모두 반영했습니다.
- source_word: הִנֵּה
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 주의를 끄는 지시 표현으로서 현대적이면서도 격식 있는 감탄을 살렸습니다.
- source_word: מִתְהַלֵּךְ לִפְנֵיכֶם
  english_pob_choice: is walking before you
  chosen_korean: 여러분 앞에서 다니고 있으며
  alternatives_korean:
  - 여러분 앞에서 가고 있으며
  - 여러분을 이끌고 있으며
  lexicon: HALOT
  rationale: 히트파엘 분사와 '앞에서'라는 관용구를 직역 쪽으로 유지해, 단순한 행보보다 공적 선도 역할의 함의를 남겼습니다.
- source_word: וָשַׂבְתִּי
  english_pob_choice: and gray
  chosen_korean: 머리가 세었습니다
  alternatives_korean:
  - 희어졌습니다
  - 백발이 되었습니다
  lexicon: HALOT
  rationale: 노년의 상태를 한국어 관용으로 자연스럽게 옮기되, 원문이 그리는 '희어짐'의 이미지를 보존했습니다.
- source_word: הִנָּם אִתְּכֶם
  english_pob_choice: here are my sons with you
  chosen_korean: 제 아들들은 여러분과 함께 있습니다
  alternatives_korean:
  - 제 아들들은 여러분 곁에 있습니다
  - 제 아들들은 여러분과 있습니다
  lexicon: HALOT
  rationale: הִנָּם의 제시·현전 강조는 한국어의 존재 진술로 옮겼습니다. '함께 있습니다'는 'with you'를 자연스럽게 살립니다.
- source_word: הִתְהַלַּכְתִּי לִפְנֵיכֶם
  english_pob_choice: I have walked before you
  chosen_korean: 여러분 앞에서 다녔습니다
  alternatives_korean:
  - 여러분 앞에서 걸어왔습니다
  - 여러분 앞을 인도했습니다
  lexicon: HALOT
  rationale: 앞 절과 같은 동사를 반복해 사무엘의 공적 역할과 왕의 역할을 병렬적으로 드러냈습니다. '다녔습니다'는 한국어에서 관용적이면서도 지속적 행위를 나타냅니다.
- source_word: מִנְּעֻרַי
  english_pob_choice: from my youth
  chosen_korean: 젊은 시절부터
  alternatives_korean:
  - 어릴 때부터
  - 청년기부터
  lexicon: HALOT
  rationale: 시간의 출발점을 분명히 하면서, 한국어에서 자연스럽고 넓은 연령대를 가리키는 표현을 선택했습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: until this day
  chosen_korean: 오늘에 이르기까지
  alternatives_korean:
  - 이날까지
  - 오늘날까지
  lexicon: HALOT
  rationale: 히브리어 관용구의 지속성을 살리면서 현대 한국어에서 가장 자연스러운 종결 표현을 사용했습니다.
theological_decisions:
- issue: 두 번 반복되는 הִנֵּה와 הִנָּם의 처리
  chosen_reading: 첫 번째는 '보십시오'로, 두 번째는 '제시된 현전'을 살린 '있습니다'로 옮겼습니다.
  alternative_readings:
  - 둘 다 '보십시오'로 처리
  - 둘 다 '보라'로 처리
  rationale: 원문은 두 개의 서로 다른 주의를 끄는 요소를 둡니다. 둘 다 동일하게 옮기면 문장 리듬과 강조의 차이가 사라지므로, 첫 번째는 청자의 시선을 끌고 두 번째는 아들들의 현재적 동참을 드러내는 방향으로 구분했습니다.
  doctrine_reference: 담화-수사적 구분 보존
- issue: לִפְנֵיכֶם의 반복을 공적 선도/왕권 대비로 유지
  chosen_reading: 두 번 모두 '여러분 앞에서'를 유지해 왕의 행보와 사무엘의 사역을 병렬시켰습니다.
  alternative_readings:
  - 왕을 '여러분을 이끄는'으로 풀고, 사무엘은 '여러분을 다스린'으로 해석
  - 둘 다 단순한 위치 표현으로 약화
  rationale: 영문 POB의 주석처럼 이 반복은 왕과 사무엘의 공적 역할을 평행시키는 장치입니다. 해석을 과도하게 좁히지 않고, 독자가 그 대비를 읽어낼 수 있게 했습니다.
  doctrine_reference: 사무엘상 12장의 수사적 병행
