source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר שְׁמוּאֵ֖ל אֶל הָ/עָ֑ם יְהוָ֗ה אֲשֶׁ֤ר עָשָׂה֙ אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֔ן וַ/אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת אֲבֹתֵי/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/006.yaml
  text: Then Samuel said to the people[b][a], “Yahweh is the one who appointed Moses and Aaron and who brought your fathers up from the land of Egypt.”
  footnotes:
  - marker: a
    text: Or, more literally, 'the LORD who made Moses and Aaron.' The Hebrew verb can be rendered 'made,' but here likely refers to the LORD's appointing or establishing them in their roles.
    reason: lexical_alternative
  - marker: b
    text: '''Your fathers'' may also be understood more broadly as ''your ancestors.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사무엘이 백성에게 말했습니다. "야훼께서는 모세와 아론을 세우셨고, 또 여러분의 조상들을 이집트 땅에서 올라오게 하신 분이십니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עָשָׂה는 문자적으로는 ‘만들다’일 수 있지만, 여기서는 야훼께서 모세와 아론을 그들의 역할에 세우셨다는 뜻으로 읽는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조상들’은 히브리어 ‘너희의 아버지들’을 보다 넓게 이해한 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then Samuel said
  chosen_korean: 그때 사무엘이 말했습니다
  alternatives_korean:
  - 그리고 사무엘이 말했습니다
  - 그러자 사무엘이 말했습니다
  lexicon: HALOT
  rationale: 와ו-연속형의 서사 전진을 자연스러운 현대 한국어로 옮기기 위해 ‘그때’로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유한 언약 이름을 제목어로 바꾸지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֲשֶׁר עָשָׂה אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  english_pob_choice: who appointed Moses and Aaron
  chosen_korean: 모세와 아론을 세우셨고
  alternatives_korean:
  - 모세와 아론을 만드셨고
  - 모세와 아론을 하셨고
  lexicon: HALOT
  rationale: עשה를 문자적으로 ‘만들다’로 옮기면 어색하고 오해를 낳을 수 있어, 문맥상 직분과 사명을 ‘세우다’로 옮겼습니다.
- source_word: הֶעֱלָה אֶת אֲבֹתֵיכֶם מֵאֶרֶץ מִצְרָיִם
  english_pob_choice: brought your fathers up from the land of Egypt
  chosen_korean: 여러분의 조상들을 이집트 땅에서 올라오게 하신
  alternatives_korean:
  - 여러분의 조상들을 이집트 땅에서 끌어올리신
  - 여러분의 조상들을 이집트 땅에서 이끌어내신
  lexicon: HALOT
  rationale: עלה의 사역형과 출애굽 관용구를 살려 ‘올라오게 하다’로 옮겼고, ‘조상들’은 영어 주석의 범위를 반영했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 본문의 신적 고유명사를 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 독자에게 본문의 언약 이름을 직접 드러내는 것이 소스-직결성에 더 부합하며, 전통적 대체어는 본문 의미를 완화할 수 있습니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה YHWH → 야훼
- issue: ‘모세와 아론을 세우셨고’의 의미
  chosen_reading: 하나님이 두 지도자를 직분에 세우신다는 의미로 이해했습니다.
  alternative_readings:
  - 하나님이 그들을 만드셨다는 문자적 이해
  - 하나님이 그들을 다루셨다는 일반적 이해
  rationale: 문맥은 인물의 창조가 아니라 이스라엘 지도자로의 설정을 가리키므로, 그 신학적 초점을 한국어로 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: original-language primacy over translation tradition'
