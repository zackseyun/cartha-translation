source:
  edition: WLC
  text: כִּ֠י לֹֽא יִטֹּ֤שׁ יְהוָה֙ אֶת עַמּ֔/וֹ בַּ/עֲב֖וּר שְׁמ֣/וֹ הַ/גָּד֑וֹל כִּ֚י הוֹאִ֣יל יְהוָ֔ה לַ/עֲשׂ֥וֹת אֶתְ/כֶ֛ם ל֖/וֹ לְ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/022.yaml
  text: For Yahweh will not forsake his people[a], for the sake of his great name[b], because Yahweh has been pleased to make you his people.
  footnotes:
  - marker: a
    text: Or 'will not abandon' or 'will not cast off.'
    reason: lexical_alternative
  - marker: b
    text: Or 'because the LORD has chosen to make you a people for himself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 자신의 크신 이름[b]을 위하여 자기 백성을 버리지 않으실 것입니다[a]. 야훼께서 너희를 자신의 백성으로 삼기를 기뻐하셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘떠나지 않으실 것입니다’ 또는 ‘내치지 않으실 것입니다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼께서 너희를 자신의 백성으로 삼으시기로 선택하셨기 때문입니다’라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִטֹּשׁ
  english_pob_choice: will not forsake
  chosen_korean: 버리지 않으십니다
  alternatives_korean:
  - 떠나지 않으십니다
  - 포기하지 않으십니다
  - 내치지 않으십니다
  lexicon: HALOT
  rationale: נטש의 핵심은 떠남·버려 둠이며, 합쇼체에서 ‘버리다’가 covenantal warning을 자연스럽게 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥의 여호와 이름을 관습적 대체호칭이 아니라 고유명사로 드러내기 위해 ‘야훼’를 사용합니다.
- source_word: שְׁמוֹ הַגָּדוֹל
  english_pob_choice: his great name
  chosen_korean: 그의 크신 이름
  alternatives_korean:
  - 그의 큰 이름
  - 그의 영광스러운 이름
  lexicon: HALOT
  rationale: 히브리어의 ‘이름’이 지닌 명예·평판의 의미를 살리면서, ‘크신’으로 위대함과 존귀함을 함께 반영했습니다.
- source_word: הוֹאִיל
  english_pob_choice: has been pleased
  chosen_korean: 기뻐하셨기 때문입니다
  alternatives_korean:
  - 원하셨기 때문입니다
  - 기꺼이 하셨기 때문입니다
  - 뜻하셨기 때문입니다
  lexicon: HALOT
  rationale: 하나님이 단순히 선택만 하신 것이 아니라 자원하여 은혜롭게 행하신 뉘앙스를 살리기 위해 ‘기뻐하셨다’를 택했습니다.
theological_decisions:
- issue: 하나님의 이름의 보존
  chosen_reading: ‘야훼’로 표기하여 언약적 고유명을 드러냈습니다.
  alternative_readings:
  - ‘주님’으로 완화
  - ‘여호와’로 전통 음역
  rationale: 본문이 יְהוָה를 직접 사용하므로, 제목어로 바꾸지 않고 고유한 언약 이름을 보존하는 것이 본문의 논지를 더 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: הוֹאִיל의 의지성과 은혜성
  chosen_reading: ‘기뻐하셨기 때문입니다’로 하나님의 자원성과 선의를 함께 반영했습니다.
  alternative_readings:
  - ‘선택하셨기 때문입니다’
  - ‘결심하셨기 때문입니다’
  rationale: 본문은 이스라엘의 보존 근거를 하나님의 이름과 은혜로운 의지에 둡니다. ‘기뻐하셨다’는 단정적 선택어보다 그 자발적 호의를 더 잘 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
