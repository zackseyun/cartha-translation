  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל כָּל יִשְׂרָאֵ֔ל הִנֵּה֙ שָׁמַ֣עְתִּי בְ/קֹֽלְ/כֶ֔ם לְ/כֹ֥ל אֲשֶׁר אֲמַרְתֶּ֖ם לִ֑/י וָ/אַמְלִ֥יךְ עֲלֵי/כֶ֖ם מֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/001.yaml
  text: Then Samuel said to all Israel, “Look, I have listened to your voice in all that you have said to me, and I have made a king reign over you.”
translation:
  language: ko
  text: 그때 사무엘이 온 이스라엘에게 말했습니다. “보십시오, 나는 여러분이 내게 한 모든 말을 들었고, 여러분 위에 왕을 왕으로 세웠습니다.”[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘온 이스라엘’은 כָּל יִשְׂרָאֵל의 집합적 표현입니다.
    reason: source_note
  - marker: b
    text: ‘여러분이 한 말’은 בְקֹלְכֶם의 관용적 의미를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֶל כָּל יִשְׂרָאֵל
  english_pob_choice: Then Samuel said to all Israel
  chosen_korean: 그때 사무엘이 온 이스라엘에게 말했습니다
  alternatives_korean:
  - 그리하여 사무엘이 온 이스라엘에게 말했습니다
  - 사무엘이 온 이스라엘에게 말했습니다
  lexicon: 이야기 진행의 וַ-연속형을 자연스러운 서술 연결인 ‘그때’로 옮기고, כָּל יִשְׂרָאֵל은 집합적 대상이므로 ‘온 이스라엘’로 처리했습니다.
  rationale: 원문의 서사적 연결과 전체 공동체를 향한 발화를 드러내는 표현이 필요합니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자, 보십시오
  lexicon: 감탄/주의 환기 표지 הִנֵּה는 문어체 명령형 느낌을 살리되 현대 한국어에서는 공손한 주의 환기 표현인 ‘보십시오’가 적절합니다.
  rationale: POB의 ‘Look’이 가진 청자 주목 효과를 합쇼체로 유지했습니다.
- source_word: בְקֹלְכֶם
  english_pob_choice: I have listened to your voice
  chosen_korean: 나는 여러분이 한 말을 들었고
  alternatives_korean:
  - 나는 여러분의 목소리를 들었고
  - 나는 여러분의 소리를 들었고
  lexicon: ‘voice’의 직역인 ‘목소리’보다, 여기서는 요구·청원을 가리키는 히브리어 관용을 살려 ‘한 말’로 옮겼습니다.
  rationale: 사무엘이 그들의 요청을 받아들였다는 의미가 분명히 드러나야 합니다.
- source_word: וָאַמְלִיךְ ... מֶלֶךְ
  english_pob_choice: I have made a king reign over you
  chosen_korean: 여러분 위에 왕을 왕으로 세웠습니다
  alternatives_korean:
  - 여러분 위에 왕을 세웠습니다
  - 여러분 위에 왕이 다스리게 했습니다
  lexicon: אַמְלִיךְ는 단순히 ‘세우다’가 아니라 왕으로 즉위/통치하게 하다의 의미이므로, ‘왕을 왕으로 세웠습니다’로 왕권 부여를 분명히 했습니다.
  rationale: POB의 ‘made a king reign’이 가진 통치 개시 의미를 한국어에서 과도하게 일반화하지 않기 위함입니다.
theological_decisions:
- issue: 사무엘의 발화가 단순 보고인지, 왕권 인정의 선언인지
  chosen_reading: 사무엘이 이스라엘의 요청을 들은 뒤 실제로 왕을 세워 통치가 시작되었음을 선언하는 말로 옮겼습니다.
  alternative_readings:
  - 단순히 ‘왕을 세웠습니다’로 평면화
  - ‘왕이 되게 했습니다’로만 처리
  rationale: 문맥상 사무엘은 백성의 요구를 수용한 사실과 그 결과로 왕정이 현실화되었음을 함께 말합니다.
  doctrine_reference: 1 Samuel 12:1의 서사적·정치적 맥락
