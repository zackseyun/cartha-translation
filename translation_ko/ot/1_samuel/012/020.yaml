  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֤ל אֶל הָ/עָם֙ אַל תִּירָ֔אוּ אַתֶּ֣ם עֲשִׂיתֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּ֑את אַ֗ךְ אַל תָּס֨וּרוּ֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וַ/עֲבַדְתֶּ֥ם אֶת יְהוָ֖ה בְּ/כָל לְבַבְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/020.yaml
  text: And Samuel said to the people[a], “Do not be afraid. You have done all this evil. Yet do not turn aside from following Yahweh[b], but serve Yahweh with all your heart.”
  footnotes:
  - marker: a
    text: Or 'Do not fear.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'do not turn aside from after the LORD,' an idiom meaning to stop following him.
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘이 백성에게 말했습니다. 「두려워하지 마십시오. 여러분은 이 모든 악을 저질렀습니다. 그러나 야훼를 따르던 데서 돌이키지 말고, 마음을 다해 야훼를 섬기십시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두려워하지 마십시오.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘여호와 뒤에서 돌이키지 말라’는 관용구로, 그분을 따르기를 멈추지 말라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתֶּם עֲשִׂיתֶם
  english_pob_choice: You have done
  chosen_korean: 여러분은 ... 저질렀습니다
  alternatives_korean:
  - 여러분은 ... 했습니다
  - 여러분이 ... 행했습니다
  lexicon: BDB
  rationale: 단순한 ‘했다’보다 ‘저질렀습니다’가 כאן의 도덕적 비난과 죄책을 더 분명히 드러내며, 영어 POB의 ‘evil’과도 맞닿습니다.
- source_word: כָּל הָרָעָה הַזֹּאת
  english_pob_choice: all this evil
  chosen_korean: 이 모든 악
  alternatives_korean:
  - 이 모든 악행
  - 이 모든 잘못
  lexicon: BDB
  rationale: רָעָה의 도덕적 무게를 살려 ‘악’으로 옮겼고, ‘이 모든’으로 지시어와 총괄성을 유지했습니다.
- source_word: מֵאַחֲרֵי יְהוָה
  english_pob_choice: from following Yahweh
  chosen_korean: 야훼를 따르던 데서
  alternatives_korean:
  - 야훼를 따르는 데서
  - 야훼 뒤에서
  lexicon: BDB
  rationale: 직역하면 ‘뒤에서’이지만 한국어에서는 관계적 추종을 드러내는 ‘따르던 데서’가 관용적이며, 영어 POB 각주가 밝힌 관용구 의미를 보존합니다.
- source_word: וַעֲבַדְתֶּם אֶת יְהוָה
  english_pob_choice: serve Yahweh
  chosen_korean: 야훼를 섬기십시오
  alternatives_korean:
  - 야훼를 섬기십시오
  - 야훼를 봉사하십시오
  lexicon: BDB
  rationale: עבד는 문맥상 단순 노동보다 언약적 섬김을 가리키므로 ‘섬기다’가 가장 자연스럽고, 현대 한국어에서 예배적·언약적 뉘앙스를 함께 전달합니다.
- source_word: בְּכָל לְבַבְכֶם
  english_pob_choice: with all your heart
  chosen_korean: 마음을 다해
  alternatives_korean:
  - 온 마음으로
  - 마음 전부로
  lexicon: BDB
  rationale: 히브리어 관용구를 자연스러운 한국어로 옮기되, 전인적 충성을 요구하는 뜻을 유지하기 위해 ‘마음을 다해’로 처리했습니다.
theological_decisions:
- issue: 여호와의 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 고유명사 יְהוָה를 사용하므로 제목어가 아닌 신적 고유명사로서 ‘야훼’를 유지해, 본문의 언약적 호칭을 가리지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: סור + מֵאַחֲרֵי의 관용적 의미
  chosen_reading: 돌이키지 말고 ... 따르던 데서
  alternative_readings:
  - 뒤에서 물러서지 말고
  - 떠나지 말고
  rationale: 영어 POB 각주가 지적하듯 이 표현은 ‘뒤에서 따르다’를 멈추지 말라는 뜻이므로, 단순한 공간적 이동이 아니라 제자도/충성의 중단을 막는 의미로 번역했습니다.
  doctrine_reference: Source idiom and POB footnote b
