id: 1SA.12.12
reference: 1 Samuel 12:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּרְא֗וּ כִּֽי נָחָ֞שׁ מֶ֣לֶךְ בְּנֵֽי עַמּוֹן֮ בָּ֣א עֲלֵי/כֶם֒ וַ/תֹּ֣אמְרוּ לִ֔/י לֹ֕א כִּי מֶ֖לֶךְ יִמְלֹ֣ךְ עָלֵ֑י/נוּ וַ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם מַלְכְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/012.yaml
  text: When you saw that Nahash king of the Ammonites was coming against you[a], you said to me, ‘No, but a king shall reign over us’—though Yahweh your God was your king.
  footnotes:
  - marker: a
    text: Or, “the LORD your God is your king.” The Hebrew clause has no explicit verb, so either past or present may be supplied from context.
    reason: alternative_reading
translation:
  language: ko
  text: 나하스, 암몬 사람들의 왕이 여러분을 치러 오는 것을 보았을 때, 여러분은 내게 “아니요, 왕이 우리를 다스려야 합니다”라고 말했습니다—그러나 야훼 여러분의 하나님께서 여러분의 왕이셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이 절 마지막에 동사가 없으므로, 문맥에 따라 ‘여러분의 왕이셨습니다’ 또는 ‘여러분의 왕입니다’로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ כִּי
  english_pob_choice: When you saw that
  chosen_korean: ~하는 것을 보았을 때
  alternatives_korean:
  - ~한 것을 보고
  - ~인 것을 보았을 때
  lexicon: HALOT
  rationale: ראָה의 직접적 인지와 시간적 배경을 함께 살려, 원문의 상황 제시 기능을 자연스러운 한국어로 옮겼습니다.
- source_word: בָּא עֲלֵיכֶם
  english_pob_choice: was coming against you
  chosen_korean: 쳐들어오는
  alternatives_korean:
  - 다가오는
  - 너희에게로 오는
  lexicon: HALOT
  rationale: 전쟁 맥락의 בוא + עַל은 단순한 이동이 아니라 공격적 접근을 뜻하므로, 그 긴박성과 적대성을 분명히 드러냈습니다.
- source_word: מֶלֶךְ יִמְלֹךְ עָלֵינוּ
  english_pob_choice: a king shall reign over us
  chosen_korean: 왕이 우리를 다스려야 합니다
  alternatives_korean:
  - 왕이 우리 위에 다스릴 것입니다
  - 왕이 우리를 통치할 것입니다
  lexicon: HALOT
  rationale: יִמְלֹךְ의 강한 요구/주장 뉘앙스를 살리기 위해 단순 미래보다 의무·요구를 드러내는 표현을 택했습니다.
- source_word: מַלְכְּכֶם
  english_pob_choice: was your king
  chosen_korean: 당신들의 왕이셨습니다
  alternatives_korean:
  - 당신들의 왕이었습니다
  - 당신들의 왕이십니다
  lexicon: HALOT
  rationale: 히브리어의 무동사 명사절을 한국어에서는 서술형으로 보충해야 하므로, 문맥상 과거 회상에 맞는 ‘-셨습니다’를 사용했습니다.
theological_decisions:
- issue: וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם의 시제/상태
  chosen_reading: ‘야훼 당신들의 하나님은 당신들의 왕이셨습니다’로 옮겨, 사무엘의 책망 속 과거 사실을 우선 반영했습니다.
  alternative_readings:
  - ‘야훼 당신들의 하나님은 당신들의 왕입니다’
  - ‘야훼 당신들의 하나님이 당신들의 왕이었습니다’
  rationale: 히브리어는 명시적 동사가 없는 명사절이어서 현재·과거가 모두 가능하지만, 바로 앞뒤의 책망 문맥에서는 그때 이미 그들이 왕을 거부하고 인간 왕을 요구한 사실을 되짚는 과거 표현이 가장 자연스럽습니다.
  doctrine_reference: 문맥 우선의 시제 선택; 무동사 절의 신학적 긴장 보존
- issue: 야훼 표기
  chosen_reading: יהוה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본어휘에 따라 원문 고유명에 가까운 음역을 유지해, 본문이 가리키는 언약적 이름을 분명히 했습니다.
  doctrine_reference: YHWH 표기 원칙
