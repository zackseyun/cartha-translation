  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם עֵ֧ד יְהוָ֣ה בָּ/כֶ֗ם וְ/עֵ֤ד מְשִׁיח/וֹ֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כִּ֣י לֹ֧א מְצָאתֶ֛ם בְּ/יָדִ֖/י מְא֑וּמָה וַ/יֹּ֖אמֶר עֵֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/005.yaml
  text: And he said to them[a], “Yahweh is witness against you, and his anointed is witness this day, that you have found nothing in my hand.” And they said[c][b], “He is witness.”
  footnotes:
  - marker: a
    text: 'Or, more literally, “The LORD is witness among/with you.” The sense in context is forensic: the LORD stands as witness in the case concerning them.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew “his anointed,” referring here to the king (Saul), not directly to the later messianic title.
    reason: cultural_note
  - marker: c
    text: The final Hebrew verb is singular (“and he said”), but in context it functions as a collective response, hence “they said.”
    reason: textual_variant
translation:
  language: ko
  text: 그가 그들에게 말했습니다. 「야훼께서 오늘 너희에게, 또 그의 기름부음 받은 자에게 증인이 되십니다. 너희가 내 손에서 아무것도 찾지 못했습니다.」 그러자 그들이 말했습니다. 「그가 증인입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “너희 가운데/너희와 함께”에 가깝지만, 법정적 문맥에서는 “너희에게”로 옮기는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: “그의 기름부음 받은 자”는 여기서 장차의 메시아 칭호가 아니라, 즉위한 왕 사울을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 마지막 히브리어 동사는 단수형이지만, 문맥상 집단의 응답이므로 한국어에서는 복수로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: עֵד
  english_pob_choice: witness
  chosen_korean: 증인
  alternatives_korean:
  - 증거
  - 증언
  lexicon: HALOT
  rationale: 법정적·언약적 맥락에서 עֵד은 ‘증인’이 가장 자연스럽고, 추상적인 ‘증언’보다 장면의 공적 선언을 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 어문학적·신학적 원칙에 따라 하나님의 고유명은 대체 호칭이 아니라 음역인 ‘야훼’로 옮겼습니다.
- source_word: מְשִׁיחוֹ
  english_pob_choice: his anointed
  chosen_korean: 그의 기름부음 받은 자
  alternatives_korean:
  - 그의 메시아
  - 그의 왕
  lexicon: HALOT
  rationale: 문맥상 장차의 메시아 칭호가 아니라 현재의 왕(사울)을 가리키므로, ‘기름부음 받은 자’로 옮겨 본래의 의미를 보존했습니다.
- source_word: בָּכֶם
  english_pob_choice: against you
  chosen_korean: 너희에게
  alternatives_korean:
  - 너희 가운데
  - 너희를 향해
  lexicon: HALOT
  rationale: 히브리어 원문은 문자적으로 ‘너희 가운데/너희와 함께’이지만, 법정적 의미를 드러내기 위해 본문에는 ‘너희에게’로 두고, 증인이 되는 관계를 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘his anointed’의 메시아적 오독 방지
  chosen_reading: 현재의 왕을 가리키는 왕정적 표현으로 읽고, 본문에는 ‘그의 기름부음 받은 자’로 유지합니다.
  alternative_readings:
  - ‘그의 메시아’
  - ‘그의 왕’
  rationale: 동일 어근이 후대의 메시아 칭호와 연결되지만, 이 절에서는 사울을 지칭하는 즉시적 왕정 맥락이므로 과도한 기독론적 투사를 피해야 합니다.
  doctrine_reference: 'DOCTRINE.md: preserve source-text sense over tradition'
- issue: 마지막 응답의 단수 동사 처리
  chosen_reading: 문맥상 백성의 집단적 응답이므로 ‘그들이 말했습니다’로 옮겼습니다.
  alternative_readings:
  - 그가 말했습니다
  rationale: 히브리어 동사는 단수형이지만, 장면상 회중 전체의 응답으로 기능하므로 POB의 문맥 보정에 맞춰 집합적 복수로 처리했습니다.
  doctrine_reference: English POB audit note on collective singular
