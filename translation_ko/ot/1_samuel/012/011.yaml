- from: 야훼께서 여룹바알과 베단과 입다와 사무엘을 보내셨습니다[a]. 또 너희를 사방의 원수들의 손에서 건져 내셨고, 너희는 안전하게 살았습니다.
  to: 야훼께서 여룹바알[a]과 베단[b]과 입다와 사무엘을 보내시고, 너희를 사방에 있는 원수들의 손에서 건져 내셨습니다. 그리고 너희는 안전하게 살았습니다.
