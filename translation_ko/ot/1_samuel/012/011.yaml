id: 1SA.12.11
reference: 1 Samuel 12:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ אֶת יְרֻבַּ֣עַל וְ/אֶת בְּדָ֔ן וְ/אֶת יִפְתָּ֖ח וְ/אֶת שְׁמוּאֵ֑ל וַ/יַּצֵּ֨ל אֶתְ/כֶ֜ם מִ/יַּ֤ד אֹֽיְבֵי/כֶם֙ מִ/סָּבִ֔יב וַ/תֵּשְׁב֖וּ בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/011.yaml
  text: And Yahweh sent Jerubbaal and Bedan and Jephthah and Samuel[a], and he delivered you from the hand of your enemies all around[b], and you lived in safety.
  footnotes:
  - marker: a
    text: Jerubbaal is another name for Gideon (see Judges 6:32; 7:1).
    reason: cross_reference
  - marker: b
    text: Hebrew 'Bedan.' The identity is uncertain; some interpreters understand this as Barak or, less commonly, Abdon.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 여룹바알과 베단과 입다와 사무엘을 보내셨습니다[a]. 또 너희를 사방의 원수들의 손에서 건져 내셨고, 너희는 안전하게 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여룹바알은 기드온의 다른 이름입니다(삿 6:32; 7:1).
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: WLC/HALOT
  rationale: POB의 기본 원칙에 따라 하나님의 고유 이름은 학술적 음역인 야훼로 옮겨, 본문이 지시하는 언약적 이름을 분명히 드러냈습니다.
- source_word: יְרֻבַּעַל
  english_pob_choice: Jerubbaal
  chosen_korean: 여룹바알
  alternatives_korean:
  - 기드온
  lexicon: HALOT
  rationale: 히브리어 본문이 실제로 제시하는 이름을 따라 음역했고, 더 익숙한 동일 인물 표지는 주석으로 돌리는 편이 원문 충실도에 맞습니다.
- source_word: בְּדָן
  english_pob_choice: Bedan
  chosen_korean: 베단
  alternatives_korean:
  - 바락
  - 압돈
  lexicon: HALOT
  rationale: 본문 형태를 그대로 보존해 번역했으며, 정체가 불확실한 점은 본문에서 임의로 해결하지 않고 주석으로 남겼습니다.
- source_word: וַיַּצֵּל אֶתְכֶם מִיַּד אֹיְבֵיכֶם מִסָּבִיב
  english_pob_choice: he delivered you from the hand of your enemies all around
  chosen_korean: 너희를 사방의 원수들의 손에서 건져 내셨고
  alternatives_korean:
  - 너희를 원수들의 손에서 구원하셨고
  - 너희를 사방의 적들의 손에서 구해 내셨고
  lexicon: HALOT
  rationale: מִיַּד의 ‘손에서’라는 지배/위협의 비유를 살리면서, נצל의 구출 의미를 한국어의 ‘건져 내다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: בֶּטַח의 결과 진술과 접속사 처리
  chosen_reading: ‘너희는 안전하게 살았습니다’로 결과 상태를 옮기되, 영어 POB의 revised reading처럼 목적어감 ‘so that’를 덧붙이지 않고 단순 접속 ‘또’와 병렬 구조를 유지했습니다.
  alternative_readings:
  - ‘그래서 너희는 안전하게 살았습니다’
  - ‘너희가 안전하게 살게 되었습니다’
  rationale: 히브리어는 원인-결과를 설명하기보다 구출과 평안의 사실을 병렬로 진술하므로, 결과를 지나치게 해석하지 않는 표현이 더 적절합니다.
  doctrine_reference: 'Translation philosophy: preserve source syntax and avoid over-specifying implied relations.'
