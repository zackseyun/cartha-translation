- from: 오늘은 밀 추수철이 아니냐? 내가 야훼께 부르면, 그분이 천둥과 비를 내리셔서, 너희가 너희가 야훼의 눈앞에서 왕을 구해 스스로 행한 너희의 악이 얼마나 큰지 알게 되고 보게 될 것이다.[a]
  to: 오늘은 밀 추수철이 아닙니까? 내가 야훼께 부르짖으면, 그분께서 천둥과 비를 내리실 것입니다. 그러면 너희는 너희가 왕을 달라고 하여 야훼의 눈앞에서 행한 악이 얼마나 큰지 알고 보게 될 것입니다.[a]
