  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/ל֤וֹא קְצִיר חִטִּים֙ הַ/יּ֔וֹם אֶקְרָא֙ אֶל יְהוָ֔ה וְ/יִתֵּ֥ן קֹל֖וֹת וּ/מָטָ֑ר וּ/דְע֣וּ וּ/רְא֗וּ כִּֽי רָעַתְ/כֶ֤ם רַבָּה֙ אֲשֶׁ֤ר עֲשִׂיתֶם֙ בְּ/עֵינֵ֣י יְהוָ֔ה לִ/שְׁא֥וֹל לָ/כֶ֖ם מֶֽלֶךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/017.yaml
  text: Is it not wheat harvest today? I will call to Yahweh[a], and he will send thunder and rain, so that you may know and see that your wickedness is great[b], which you have done in the sight of Yahweh by asking for yourselves a king.
  footnotes:
  - marker: a
    text: Or 'he will give thunder and rain.' The Hebrew verb is literally 'give,' but in English 'send' is the more natural rendering for weather.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'voices and rain'; in this context 'voices' refers to thunder.
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘은 밀 추수철이 아니냐? 내가 야훼께 부르면, 그분이 천둥과 비를 내리셔서, 너희가 너희가 야훼의 눈앞에서 왕을 구해 스스로 행한 너희의 악이 얼마나 큰지 알게 되고 보게 될 것이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘소리들’이지만, 이 문맥에서는 천둥을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Is it not
  chosen_korean: 오늘은 … 아니냐?
  alternatives_korean:
  - 정말 … 아니냐?
  - … 그렇지 않으냐?
  lexicon: HALOT
  rationale: 수사적 질문으로 상대의 동의를 전제하는 표현이어서, 한국어에서는 자연스러운 반문 형태로 옮겼습니다.
- source_word: קְצִיר חִטִּים
  english_pob_choice: wheat harvest
  chosen_korean: 밀 추수철
  alternatives_korean:
  - 밀 수확
  - 밀 추수
  lexicon: HALOT
  rationale: 명사 연결구의 계절적 배경을 살리면서 현대 한국어로 자연스럽게 다듬었습니다.
- source_word: קֹלוֹת
  english_pob_choice: thunder
  chosen_korean: 천둥
  alternatives_korean:
  - 우레
  - 소리
  lexicon: HALOT
  rationale: 본문의 날씨 문맥에서는 '소리'보다 '천둥'이 अर्थ를 분명히 드러냅니다.
- source_word: רָעַתְכֶם רַבָּה
  english_pob_choice: your wickedness is great
  chosen_korean: 너희의 악이 얼마나 큰지
  alternatives_korean:
  - 너희의 악행이 얼마나 큰지
  - 너희의 사악함이 얼마나 큰지
  lexicon: HALOT
  rationale: רָעָה의 도덕적 악을 살리되, 한국어에서 자연스러운 평가 표현으로 옮겼습니다.
- source_word: לִשְׁאֹל לָכֶם מֶלֶךְ
  english_pob_choice: by asking for yourselves a king
  chosen_korean: 왕을 구해 스스로 행한
  alternatives_korean:
  - 왕을 달라고 구한
  - 자기들을 위해 왕을 요구한
  lexicon: HALOT
  rationale: 부정적 행위의 원인/수단을 드러내는 ל + 부정사 구문을 '왕을 구해'로 처리해, 뒤의 '너희의 악'과 직접 연결되게 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본어휘에 따라 신명은 '야훼'로 옮겼습니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 표기
  chosen_reading: 본문과 인용 표현 모두 '야훼'를 유지했습니다.
  alternative_readings:
