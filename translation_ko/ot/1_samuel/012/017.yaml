base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/017.yaml
  text: Is it not wheat harvest today? I will call to Yahweh[a], and he will send thunder and rain, so that you may know and see that your wickedness is great[b], which you have done in the sight of Yahweh by asking for yourselves a king.
  footnotes:
  - marker: a
    text: Or 'he will give thunder and rain.' The Hebrew verb is literally 'give,' but in English 'send' is the more natural rendering for weather.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'voices and rain'; in this context 'voices' refers to thunder.
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘은 밀 추수철이 아닙니까? 내가 야훼께 부르짖으면, 그분께서 천둥과 비를 내리실 것입니다. 그러면 너희는 너희가 왕을 달라고 하여 야훼의 눈앞에서 행한 악이 얼마나 큰지 알고 보게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘소리들’이지만, 이 문맥에서는 천둥을 가리킵니다.
    reason: lexical_alternative
