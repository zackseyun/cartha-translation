  - severity: medium
    issue: ‘왕을 구해 스스로 행한’은 원문의 구문 관계를 불명확하게 합니다.
    rationale: לִשְׁאֹל לָכֶם מֶלֶךְ는 자신들을 위하여 왕을 ‘달라고 한’ 행위를 가리킵니다. ‘스스로 행한’은 원문에 없는 강조이며, ‘구해’는 왕을 찾아 얻는 행위로도 읽힐 수 있습니다.
