source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד לְ/אֶבְיָתָ֗ר יָדַ֜עְתִּי בַּ/יּ֤וֹם הַ/הוּא֙ כִּֽי שָׁם֙ דויג הָ/אֲדֹמִ֔י כִּֽי הַגֵּ֥ד יַגִּ֖יד לְ/שָׁא֑וּל אָנֹכִ֣י סַבֹּ֔תִי בְּ/כָל נֶ֖פֶשׁ בֵּ֥ית אָבִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/022.yaml
  text: David said to Abiathar[a], “I knew on that day, when Doeg the Edomite was there, that he would surely tell Saul[c][b]. I am responsible for all the lives of your father’s house.”
  footnotes:
  - marker: a
    text: Or “that Doeg the Edomite was there.” The Hebrew conjunction can be taken as introducing the content of what David knew rather than a temporal nuance.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew uses an infinitive absolute with the finite verb: “telling, he would tell,” an emphatic form meaning “he would surely tell.”'
    reason: lexical_alternative
  - marker: c
    text: Or “I have caused the death of” or “I am the cause of” every life in your father’s house.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 아비아달에게 말했습니다. “그날, 곧 에돔 사람 도엑이 거기 있었을 때 나는 그가 반드시 사울에게 말할 것을 알았습니다. 저는 당신 아버지의 집안에 속한 모든 생명에 대해 책임이 있습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “에돔 사람 도엑이 거기 있었던 것을.” 히브리어 접속사는 다윗이 알았던 내용 자체를 이끄는 것으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 부정사 절대형과 동사를 함께 써서 “말하고, 반드시 말하다”라는 강조를 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “제가 당신 아버지의 집안에 속한 모든 생명을 죽게 했습니다” 또는 “모든 생명의 원인입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  english_pob_choice: I knew
  chosen_korean: 나는 … 알았습니다
  alternatives_korean:
  - 나는 … 알고 있었습니다
  - 나는 … 깨달았습니다
  lexicon: HALOT
  rationale: 완료형 ידע의 직접적 과거 인지를 가장 자연스럽게 살리기 위해 ‘알았습니다’를 선택했습니다.
- source_word: כִּי שָׁם דויג הָאֲדֹמִי
  english_pob_choice: when Doeg the Edomite was there
  chosen_korean: 곧 에돔 사람 도엑이 거기 있었을 때
  alternatives_korean:
  - 에돔 사람 도엑이 거기 있었다는 것을
  - 에돔 사람 도엑이 그곳에 있었을 때
  lexicon: HALOT
  rationale: כִּי의 시간적/내용적 연결을 한국어에서 ‘곧 … 때’로 풀어, 다윗이 알고 있던 상황적 내용을 자연스럽게 드러냈습니다.
- source_word: הַגֵּד יַגִּיד
  english_pob_choice: would surely tell
  chosen_korean: 반드시 … 말할 것을
  alternatives_korean:
  - 분명히 … 보고할 것을
  - 틀림없이 … 알릴 것을
  lexicon: HALOT
  rationale: 부정사 절대형과 동사형의 강조를 ‘반드시’로 옮겨, 단순 미래가 아니라 확정적·강조적 의미를 살렸습니다.
- source_word: בְּכָל נֶפֶשׁ
  english_pob_choice: all the lives
  chosen_korean: 모든 생명에 대해
  alternatives_korean:
  - 모든 사람에 대해
  - 모든 목숨에 대해
  lexicon: HALOT
  rationale: נֶפֶשׁ를 ‘생명’으로 옮겨 사람의 생명 전체를 가리키는 무게를 살리면서, ‘영혼’처럼 지나치게 종교화되지 않도록 했습니다.
theological_decisions:
- issue: אָנֹכִי סַבֹּתִי의 책임 표명
  chosen_reading: ‘제가 … 책임이 있습니다’로 다윗의 책임 인정과 자책을 드러냈습니다.
  alternative_readings:
  - ‘제가 … 초래했습니다’
  - ‘제가 … 원인입니다’
  rationale: 문맥상 다윗은 사건의 도덕적 책임을 인정하며, 한국어에서는 현대적이고 분명한 자책 표현이 본문의 힘을 가장 잘 전달합니다.
  doctrine_reference: 사건의 도덕적 책임과 회개의 언어
