id: 1SA.22.14
reference: 1 Samuel 22:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֧עַן אֲחִימֶ֛לֶךְ אֶת הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר וּ/מִ֤י בְ/כָל עֲבָדֶ֨י/ךָ֙ כְּ/דָוִ֣ד נֶאֱמָ֔ן וַ/חֲתַ֥ן הַ/מֶּ֛לֶךְ וְ/סָ֥ר אֶל מִשְׁמַעְתֶּ֖/ךָ וְ/נִכְבָּ֥ד בְּ/בֵיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/014.yaml
  text: Ahimelech answered the king and said[a], “And who among all your servants is as faithful as David, the king’s son-in-law, who has access to your council[b], and is honored in your house?”
  footnotes:
  - marker: a
    text: Or “one who obeys you” / “one who is at your bidding” for “one who turns to your command.”
    reason: lexical_alternative
  - marker: b
    text: “In your house” may refer more specifically to the king’s household or court.
    reason: cultural_note
translation:
  language: ko
  text: 아히멜렉이 왕에게 대답하며 말했습니다. “왕의 모든 신하들 가운데 누가 다윗처럼 신실하며, 왕의 사위이고, 왕의 명령에 응하며, 왕의 집에서 존귀한 사람이 있겠습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕의 명령에 응하며’는 ‘왕의 명령을 따르는 사람’이라는 뜻을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  english_pob_choice: answered ... said
  chosen_korean: 대답하며 말했습니다
  alternatives_korean:
  - 응답하며 말했습니다
  - 대답하여 말했습니다
  lexicon: HALOT
  rationale: 히브리어 서술 관용구를 자연스러운 현대 한국어 서사체로 옮기되, 둘 다 유지되는 답변 동작과 발화 동작을 드러냈습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 왕의 모든 신하들
  alternatives_korean:
  - 왕의 모든 종들
  - 왕의 모든 종자들
  lexicon: HALOT
  rationale: 직역하면 ‘종들’이지만, 왕궁 맥락에서 한국어 독자가 이해하기 쉬운 신하로 옮기되, 모두를 뜻하는 בְכָל을 반영해 ‘모든’을 살렸습니다.
- source_word: נֶאֱמָן
  english_pob_choice: faithful
  chosen_korean: 신실하며
  alternatives_korean:
  - 충실하며
  - 믿을 만하며
  lexicon: HALOT
  rationale: 단순한 ‘믿을 만한’보다 인격적·관계적 충성까지 포괄하는 ‘신실하다’가 왕에게 대한 충성과 문맥상 잘 맞습니다.
- source_word: וְסָר אֶל מִשְׁמַעְתֶּךָ
  english_pob_choice: one who turns to your command
  chosen_korean: 왕의 명령에 응하며
  alternatives_korean:
  - 왕의 명령을 따르며
  - 왕의 지시에 순응하며
  - 왕의 명령에 귀 기울이며
  lexicon: HALOT
  rationale: POB의 ‘turns to your command’를 한국어로 너무 풀지 않으면서도, מִשְׁמַעַת의 ‘듣고 따름’ 뉘앙스를 살려 ‘응하다’로 옮겼습니다.
- source_word: וְנִכְבָּד בְּבֵיתֶךָ
  english_pob_choice: is honored in your house
  chosen_korean: 왕의 집에서 존귀한
  alternatives_korean:
  - 왕의 집에서 존경받는
  - 왕의 궁정에서 존귀한
  lexicon: HALOT
  rationale: ‘집’의 직역을 유지하되, 한국어에서는 ‘존귀한’이 인물의 지위와 평가를 함께 드러내어 자연스럽습니다.
theological_decisions:
- issue: 문체와 발화의 공손도
  chosen_reading: 서술문은 합쇼체로, 왕에게 말하는 직접 인용은 공손한 평서형으로 처리했습니다.
  alternative_readings:
  - 직접 인용도 서술체로 통일
  - 더 낮춘 구어체로 처리
  rationale: 히브리어 원문이 궁정 대화의 공적 장면이므로, 현대 한국어에서도 공적인 예의를 유지하는 것이 적절합니다.
  doctrine_reference: 문체 결정
