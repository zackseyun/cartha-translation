  to: 아히멜렉이 왕에게 대답하여 말했습니다. “왕의 모든 신하 가운데 다윗처럼 신실하고, 왕의 사위이며, 왕의 명령을 따르고[a] 왕의 집에서 존귀한 사람이 누가 있겠습니까?”[b]
