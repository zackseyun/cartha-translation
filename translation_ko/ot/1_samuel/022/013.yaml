translation:
  language: ko
  text: 사울이 그에게 말했습니다. “왜 너와 이새의 아들이 나를 거슬러 공모했습니까? 네가 그에게 빵과 칼을 주고, 그를 위하여 하나님께 묻고[a], 그가 오늘처럼 나를 거슬러 일어나 매복하도록 하려고 한 것입니까?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 위하여 하나님께 자문하고.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “그가 오늘처럼 나를 거슬러 일어나 매복하도록.”
    reason: alternative_reading
