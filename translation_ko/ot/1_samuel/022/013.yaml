base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/013.yaml
  text: Saul said to him[a], “Why have you and the son of Jesse conspired against me, by giving him bread and a sword and by inquiring of God for him, so that he has risen against me to lie in wait[b], as on this day?”
  footnotes:
  - marker: a
    text: Or “and by consulting God for him.”
    reason: lexical_alternative
  - marker: b
    text: Or “so that he might rise against me, lying in wait, as at this day.”
    reason: alternative_reading
translation:
  language: ko
  text: 사울이 그에게 말했습니다. “왜 너와 이새의 아들이 나를 거슬러 공모했느냐? 네가 그에게 빵과 칼을 주고, 그를 위해 하나님께 여쭈어, 그가 오늘과 같이 나를 치려고 매복하려고 일어났느냐?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 위해 하나님께 자문하고”.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그가 오늘과 같이 나를 치려고 매복하며 일어났다는 뜻으로.”
    reason: alternative_reading
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  english_pob_choice: have conspired
  chosen_korean: 공모했느냐
  alternatives_korean:
  - 모의했느냐
  - 함께 꾸몄느냐
  lexicon: HALOT
  rationale: 왕을 거슬러 적대적으로 결탁했다는 정치적 함의를 살리기 위해 ‘공모하다’를 선택했습니다.
- source_word: בֶן יִשָׁי
  english_pob_choice: the son of Jesse
  chosen_korean: 이새의 아들
  alternatives_korean:
  - 다윗
  - 이새의 아들 다윗
  lexicon: HALOT
  rationale: 사울이 다윗을 이름 대신 부계 호칭으로 지칭하는 냉랭한 수사를 그대로 살렸습니다.
- source_word: וְשָׁאוֹל לוֹ בֵּאלֹהִים
  english_pob_choice: and by inquiring of God for him
  chosen_korean: 그를 위해 하나님께 여쭈어
  alternatives_korean:
  - 그를 위해 하나님께 물어
  - 그를 위해 하나님께 문의하여
  lexicon: HALOT
  rationale: באלוהים의 실제 어휘를 반영해 ‘하나님께’로 옮기고, 제의적·오라클적 탐문을 자연스럽게 드러내기 위해 ‘여쭈다’를 썼습니다.
- source_word: לְאֹרֵב
  english_pob_choice: to lie in wait
  chosen_korean: 매복하려고
  alternatives_korean:
  - 잠복하려고
  - 숨어 기다리려고
  lexicon: HALOT
  rationale: ארב의 기본 의미인 ‘매복하다/숨어 노리다’를 현대 한국어에서 가장 직접적으로 드러내는 표현입니다.
theological_decisions:
- issue: בֵּאלֹהִים의 신명 처리
  chosen_reading: 하나님
  alternative_readings:
