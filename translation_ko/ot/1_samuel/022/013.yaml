  - severity: medium
    issue: 직접 인용문의 종결 표현 ‘공모했느냐?’가 지정된 합쇼체와 일치하지 않습니다.
    rationale: 현대 공식·정중 문체의 일관성을 위해 ‘공모했습니까?’가 적절합니다.
