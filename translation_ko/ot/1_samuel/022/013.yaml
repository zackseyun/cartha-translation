review_pass:
  verdict: revise
  source_fidelity: ‘나를 치려고’는 히브리어 본문에 없는 공격 행위를 덧붙입니다. לָקוּם אֵלַי는 ‘나를 거슬러 일어나다’이고, לְאֹרֵב은 ‘매복하다/숨어 기다리다’이므로 이를 분리해 옮겨야 합니다. 또한 목적·결과 관계는 한국어에서 ‘…하도록 하려고’로 무리 없이 나타낼 수 있습니다.
  naturalness: 원문의 직접 발화도 현대 표준어 합쇼체에 맞추어 ‘공모했습니까?’로 처리했습니다. ‘그를 위하여 하나님께 묻고’는 제사장에게 제기된 신탁 문의의 뜻을 자연스럽고 절제되게 전달합니다.
  terminology: ‘이새의 아들’은 사울이 다윗의 이름을 피하는 원문의 수사적 표현을 보존합니다. אֱלֹהִים은 본문 어휘에 따라 ‘하나님’으로 유지했습니다. ‘공모하다’와 ‘매복하다’도 각각 קשר 및 ארב의 적대적 문맥을 충실히 반영합니다.
