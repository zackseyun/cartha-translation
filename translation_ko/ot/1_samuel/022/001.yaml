  - 그의 아버지의 온 가족
  lexicon: HALOT
  rationale: ‘집’의 공간적 의미보다 가족/가계 단위를 가리키는 용법을 살려 '집안'으로 옮겼습니다.
- source_word: וַיֵּרְדוּ אֵלָיו שָׁמָּה
  english_pob_choice: they went down there to him
  chosen_korean: 그곳으로 그에게 내려왔습니다
  alternatives_korean:
  - 거기 그에게 내려왔습니다
  - 그에게 그곳으로 내려왔습니다
  lexicon: HALOT
  rationale: ירד의 하향 이동과 יעד(그에게)를 모두 살리면서 현대 한국어 어순에 맞게 정리했습니다.
