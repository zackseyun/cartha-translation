- from: 그리하여 다윗은 거기서 떠나 아둘람 굴로 피했습니다. 그의 형제들과 그의 아버지의 온 집안이 그것을 듣고[a] 그곳으로 그에게 내려왔습니다.
  to: 그리하여 다윗은 거기서 떠나 아둘람 굴로 피했습니다.[a] 그의 형제들과 그의 아버지의 온 집안이 그 소식을 듣고 그가 있는 곳으로 내려갔습니다.
  rationale: 도피 동사에 대한 각주를 해당 번역어 뒤로 옮기고, 마지막 절을 현대 한국어의 자연스러운 목적지 표현으로 고쳤습니다. ‘그 소식’은 목적어 없이 쓰인 히브리어 ‘들었다’를 한국어 문장 안에서 자연스럽게 표현한 것이며, 앞 문장에서 말한 다윗의 도피를 가리킵니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:26:38Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 출발(‘거기서 떠나’), 도피의 결과(‘피했습니다’), 아둘람 굴, 형제들과 부계 집안, 하향 이동을 충실히 반영합니다. 다만 마지막 ‘그곳으로 그에게 내려왔습니다’는 목적지와 수혜/도착 대상을 부자연스럽게 중복하여 히브리어 אֵלָיו שָׁמָּה의 의미를 자연스럽게 전달하지 못합니다.
  naturalness: ‘그에게 내려왔다’와 ‘그곳으로’의 결합은 현대 표준 한국어에서 어색합니다. ‘그가 있는 곳으로 내려갔습니다’가 다윗에게 향함과 그곳이라는 장소성을 모두 자연스럽게 나타냅니다. 또한 각주 표지는 ‘듣고’가 아니라 대안이 제시되는 ‘피했습니다’에 붙어야 합니다.
  terminology: ‘다윗’, ‘아둘람’, ‘굴’, ‘온 집안’은 적절합니다. ‘온 집안’은 בֵּית אָבִיו의 가족·가계 단위를 무리 없이 나타냅니다.
  issues:
