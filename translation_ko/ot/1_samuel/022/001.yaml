    rationale: 각주 앵커는 실제로 설명하거나 대안을 제시하는 번역어에 붙어야 독자가 각주의 적용 대상을 혼동하지 않습니다.
  - severity: medium
    issue: ‘그곳으로 그에게 내려왔습니다’는 목적지 표현이 중첩되어 어색합니다.
    rationale: 히브리어의 ‘그에게, 그곳으로’는 다윗이 있는 장소로 향한 것을 뜻합니다. 한국어에서는 ‘그가 있는 곳으로 내려갔습니다’가 두 요소를 자연스럽게 포괄합니다.
