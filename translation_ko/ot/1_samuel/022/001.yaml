base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/001.yaml
  text: So David went from there and escaped to the cave of Adullam. When his brothers and all his father's household heard[a], they went down there to him.
  footnotes:
  - marker: a
    text: Or, 'fled to the cave of Adullam.' The Hebrew verb can denote escape or flight; 'escaped' was chosen to reflect the result of successful deliverance from danger.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 다윗은 거기서 떠나 아둘람 굴로 피했습니다.[a] 그의 형제들과 그의 아버지의 온 집안이 그 소식을 듣고 그가 있는 곳으로 내려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “도망쳤습니다.” 히브리어 동사는 탈출하거나 도피하는 것을 뜻할 수 있으며, 여기서는 위험에서 벗어난 결과를 나타내기 위해 “피했습니다”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  english_pob_choice: went from there
  chosen_korean: 거기서 떠나
  alternatives_korean:
  - 그곳에서 갔습니다
  - 거기서 갔습니다
  lexicon: HALOT
  rationale: 이동의 시작을 자연스럽게 살리되, 원문의 출발점(거기서)과 전진 동작(떠나)을 함께 드러냈습니다.
- source_word: וַיִּמָּלֵט
  english_pob_choice: escaped
  chosen_korean: 피했습니다
  alternatives_korean:
  - 도망쳤습니다
  - 탈출했습니다
  lexicon: HALOT
  rationale: POB의 'escaped'를 따라 단순 이동보다 위험에서 벗어난 결과를 강조하는 한국어로 옮겼습니다.
- source_word: מְעָרַת עֲדֻלָּם
  english_pob_choice: the cave of Adullam
  chosen_korean: 아둘람 굴
  alternatives_korean:
  - 아둘람의 굴
  - 아둘람 동굴
  lexicon: HALOT
  rationale: 지명구를 직역하되, 성경 문맥에서 통용되는 지형 표현으로 '굴'을 택했습니다.
- source_word: כָּל בֵּית אָבִיו
  english_pob_choice: all his father's household
  chosen_korean: 그의 아버지의 온 집안
  alternatives_korean:
  - 그의 아버지의 모든 집
  - 그의 아버지의 온 가족
  lexicon: HALOT
  rationale: ‘집’의 공간적 의미보다 가족/가계 단위를 가리키는 용법을 살려 '집안'으로 옮겼습니다.
- source_word: וַיֵּרְדוּ אֵלָיו שָׁמָּה
  english_pob_choice: they went down there to him
  chosen_korean: 그곳으로 그에게 내려왔습니다
  alternatives_korean:
  - 거기 그에게 내려왔습니다
  - 그에게 그곳으로 내려왔습니다
  lexicon: HALOT
  rationale: ירד의 하향 이동과 יעד(그에게)를 모두 살리면서 현대 한국어 어순에 맞게 정리했습니다.
