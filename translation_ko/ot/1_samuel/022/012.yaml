  yaml_path: translation/ot/1_samuel/022/012.yaml
  text: Then Saul said, “Listen, please, son of Ahitub.” And he answered, “Here I am, my lord.”
translation:
  language: ko
  text: 그러자 사울이 말했습니다. 「들으십시오, 아히둡의 아들아.」 그러자 그가 대답했습니다. 「제가 여기 있습니다, 내 주님.」[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘들으십시오’는 히브리어 שׁמע־נא의 간청형을 공손한 현대 명령으로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע־נָא
  english_pob_choice: Listen, please
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들어 보십시오
  - 듣고 있으십시오
  lexicon: שׁמע
  rationale: 명령형에 담긴 간청의 뉘앙스를 살리되, 본문의 짧은 직접화를 자연스러운 현대 존대 명령으로 옮겼습니다. 영어의 please는 별도 부사로 덧붙이지 않고 공손한 어미로 반영했습니다.
- source_word: בֶּן אֲחִיטוּב
  english_pob_choice: son of Ahitub
  chosen_korean: 아히둡의 아들
  alternatives_korean:
  - 아히둡의 아들아
  - 아히둡의 아들
  lexicon: בן
  rationale: 호격으로 부를 때 한국어에서는 ‘아들아’가 더 자연스러워, 직접 호명 기능을 분명히 했습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주님
  alternatives_korean:
  - 주군
  - 내 주인님
  - 나의 주인
  lexicon: אדון
  rationale: 화자가 상대를 높여 부르는 예의 표현을 살리되, 한국어에서 가장 자연스러운 존대 호칭인 ‘내 주님’으로 옮겼습니다.
- source_word: הִנְנִי
  english_pob_choice: Here I am
  chosen_korean: 제가 여기 있습니다
  alternatives_korean:
  - 여기 있습니다
  - 제가 있습니다
  lexicon: הנני
  rationale: 단순한 위치 진술을 넘어 즉각적 응답과 가용성을 나타내는 표현이므로, ‘제가 여기 있습니다’로 풀어 자연스럽게 전달했습니다.
theological_decisions:
- issue: 사울의 직접 화법과 응답 화법의 존대 수준
  chosen_reading: 사울의 요청은 공손한 명령형으로, 응답은 상대를 높이는 존대 표현으로 유지했습니다.
  alternative_readings:
  - 모두 평서체로 완화
  - 응답을 더 격식적인 궁중어로 조정
  rationale: 본문은 권위 관계가 분명한 대화이므로, 한국어에서도 그 긴장을 흐리지 않도록 예의 수준을 보존했습니다.
  doctrine_reference: 서사 문맥의 화행 보존
