source:
  edition: WLC
  text: וְ/אֵ֨ת נֹ֤ב עִיר הַ/כֹּֽהֲנִים֙ הִכָּ֣ה לְ/פִי חֶ֔רֶב מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מֵ/עוֹלֵ֖ל וְ/עַד יוֹנֵ֑ק וְ/שׁ֧וֹר וַ/חֲמ֛וֹר וָ/שֶׂ֖ה לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/019.yaml
  text: And Nob[a], the city of the priests, he struck with the edge of the sword, from man to woman, from child to nursing infant, and ox and donkey and sheep, with the edge of the sword.
  footnotes:
  - marker: a
    text: Hebrew literally, 'to the mouth of the sword,' an idiom meaning death by the sword.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제사장들의 성읍 놉[a]을, 남자에서 여자까지, 어린아이에서 젖먹이까지, 또 소와 나귀와 양까지, 칼날로 쳐죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘칼의 입으로’이지만, 관용적으로 ‘칼날로 죽이다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹב
  english_pob_choice: Nob
  chosen_korean: 놉
  alternatives_korean:
  - 노브
  - 놉읍
  lexicon: HALOT
  rationale: 고유 지명은 음역으로 옮기되, 한국어 성경 표기에서 자연스러운 ‘놉’을 채택했습니다.
- source_word: עִיר הַכֹּהֲנִים
  english_pob_choice: the city of the priests
  chosen_korean: 제사장들의 성읍
  alternatives_korean:
  - 제사장들의 도시
  - 제사장들의 성
  lexicon: HALOT
  rationale: ‘성읍’은 히브리어 עִיר의 역사·성서적 행정 단위를 잘 살리며, 소유/특징 관계를 복수 소유격으로 풀어 자연스럽게 옮겼습니다.
- source_word: לְפִי חֶרֶב / לְפִי חָרֶב
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼로
  - 칼의 날로
  - 칼끝으로
  lexicon: HALOT
  rationale: 직역하면 ‘칼의 입’이지만 한국어에서는 관용적으로 통하는 ‘칼날로’가 원문 이미지와 살해 수단을 함께 드러냅니다.
- source_word: מֵאִישׁ וְעַד אִשָּׁה / מֵעוֹלֵל וְעַד יוֹנֵק
  english_pob_choice: from man to woman, from child to nursing infant
  chosen_korean: 남자에서 여자까지, 어린아이에서 젖먹이까지
  alternatives_korean:
  - 사람에서 여자까지, 아이에서 젖먹이까지
  - 남녀를 가리지 않고, 어린아이에서 젖먹이까지
  lexicon: HALOT
  rationale: 히브리어의 ‘...에서 ...까지’ 형식과 전체성을 살리기 위해 범위 표현을 유지했고, ‘젖먹이’는 יוֹנֵק의 수유 중인 영아를 자연스럽게 옮겼습니다.
- source_word: וְשׁוֹר וַחֲמוֹר וָשֶׂה
  english_pob_choice: and ox and donkey and sheep
  chosen_korean: 또 소와 나귀와 양
  alternatives_korean:
  - 또 황소와 나귀와 양
  - 또 소와 나귀와 어린양
  lexicon: HALOT
  rationale: 대표 가축 목록을 한국어에서 가장 넓고 자연스럽게 알아듣는 보통명사로 옮겼습니다. ‘양’은 שֶׂה의 대표 번역으로 무난합니다.
theological_decisions:
- issue: 전멸적 폭력의 총체성 표현
  chosen_reading: 인간과 가축을 모두 포함한 반복 구조를 유지해, 본문의 잔혹성과 전면성을 완화하지 않았습니다.
  alternative_readings:
  - ‘모두 죽였다’로 압축
  - 인명만 옮기고 가축 목록은 생략
  rationale: 본문은 제사장 성읍에 대한 철저한 학살을 강조하므로, 반복되는 칼 문구와 대상을 모두 보존해야 원문의 충격과 경고가 전달됩니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy; optimal equivalence
