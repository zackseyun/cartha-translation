  text: And Nob[a], the city of the priests, he struck with the edge of the sword, from man to woman, from child to nursing infant, and ox and donkey and sheep, with the edge of the sword.
  footnotes:
  - marker: a
    text: Hebrew literally, 'to the mouth of the sword,' an idiom meaning death by the sword.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 제사장들의 성읍 놉을 칼날로[a] 쳐서, 남자에서 여자까지, 어린아이에서 젖먹이까지, 또 소와 나귀와 양까지 칼날로 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 두 곳 모두 직역하여 ‘칼의 입으로’입니다. 이는 칼로 죽인다는 뜻의 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹב
  english_pob_choice: Nob
  chosen_korean: 놉
  alternatives_korean:
  - 노브
  - 놉읍
  lexicon: HALOT
  rationale: 고유 지명은 음역으로 옮기되, 한국어 성경 표기에서 자연스러운 ‘놉’을 채택했습니다.
- source_word: עִיר הַכֹּהֲנִים
  english_pob_choice: the city of the priests
  chosen_korean: 제사장들의 성읍
  alternatives_korean:
