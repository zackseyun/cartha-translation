  text: Then Saul said to his servants who were standing around him, “Listen, please, sons of Benjamin! Will the son of Jesse also give all of you fields and vineyards? Will he make all of you commanders of thousands and commanders of hundreds?”
translation:
  language: ko
  text: 그러자 사울이 자기 주변에 서 있는 그의 종들에게 말했습니다. 「들으십시오, 부탁합니다, 베냐민 사람들아! 이새의 아들이 너희 모두에게도 밭과 포도원을 주겠느냐? 너희 모두를 천부장들과 백부장들로 삼겠느냐?」
  philosophy: formal
lexical_decisions:
- source_word: עֲבָדָיו / servants
  english_pob_choice: his servants
  chosen_korean: 그의 종들
  alternatives_korean:
  - 그의 신하들
  - 그의 종자들
  lexicon: עֶבֶד / δοῦλος
  rationale: 사울의 궁정 소속을 가리키지만, 원어의 기본 의미는 ‘종’이므로 한국어도 이를 유지해 권력관계의 강도를 살렸습니다.
- source_word: בְּנֵי יְמִינִי
  english_pob_choice: sons of Benjamin
  chosen_korean: 베냐민 사람들
  alternatives_korean:
  - 베냐민의 아들들
  - 베냐민 지파 사람들
  lexicon: בֵּן + proper ethnicon
  rationale: 직역은 ‘베냐민의 아들들’이지만, 여기서는 집단 호칭으로 쓰인 부족명 표현이므로 자연스러운 민족·지파 지칭인 ‘베냐민 사람들’로 옮겼습니다.
- source_word: שָׂדוֹת וּכְרָמִים
  english_pob_choice: fields and vineyards
  chosen_korean: 밭과 포도원
  alternatives_korean:
  - 전답과 포도원
  - 밭들과 포도원들
  lexicon: field / vineyard
  rationale: 히브리어 복수형의 구체성은 유지하되, 한국어에서는 관용적인 단수형 짝으로 옮겨 문맥상 재산·특혜를 뜻하는 대비를 살렸습니다.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי מֵאוֹת
  english_pob_choice: commanders of thousands and commanders of hundreds
  chosen_korean: 천부장들과 백부장들
  alternatives_korean:
  - 천 명의 지휘관들과 백 명의 지휘관들
  - 천인대장들과 백인대장들
  lexicon: military office terms
  rationale: 군사 계층을 나타내는 고정 표현이므로, 한국어 성경에서 널리 이해되는 관직어를 사용해 위계 구조를 분명하게 했습니다.
- source_word: שִׁמְעוּ נָא
  english_pob_choice: Listen, please
  chosen_korean: 들으십시오, 부탁합니다
  alternatives_korean:
  - 제발 들으십시오
  - 잠시 들으십시오
  lexicon: imperative + particle
  rationale: 나(נא)의 완곡 요청을 살려 명령을 부드럽게 하면서도, 사울의 조롱 섞인 수사적 어조가 드러나도록 공손한 청유형으로 옮겼습니다.
theological_decisions:
- issue: 사울의 발화에서의 어조 재현
  chosen_reading: 직접 인용 내부는 공손한 청유형을 유지하되, 전체 문맥상 비꼬는 수사 질문으로 읽히도록 번역했습니다.
  alternative_readings:
  - 단순 명령형으로 강하게 옮김
  - 평평한 서술형으로 완화함
  rationale: 원문은 ‘들으라, 이제’의 완곡 요소와 연속되는 수사 의문문을 함께 사용하므로, 한국어에서도 표면 공손함과 실제 조롱의 긴장을 보존하는 것이 본문 의도를 더 잘 반영합니다.
  doctrine_reference: narrative pragmatics
