base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/004.yaml
  text: He brought them before the king of Moab[a], and they stayed with him all the days that David was in the stronghold.
  footnotes:
  - marker: a
    text: Or 'He led them before the king of Moab.' The Hebrew verb can carry the sense of leading or bringing into someone's presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들을 모압 왕 앞에 데려가자,[a] 그들은 다윗이 요새에 있는 모든 날 동안 그와 함께 머물렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 모압 왕 앞에 인도하자.’ 히브리어 동사는 사람을 다른 이의 앞, 곧 면전으로 이끌거나 데려가는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם / אֶת פְּנֵי
  english_pob_choice: He brought them before the king of Moab
  chosen_korean: 그들을 모압 왕 앞에 데려가고
  alternatives_korean:
  - 그들을 모압 왕의 앞에 인도하고
  - 그들을 모압 왕 앞에 이끌고
  lexicon: HALOT
  rationale: 히브리어는 사람을 어떤 이의 면전/앞으로 데려가는 뜻이므로, ‘데려가다’가 한국어에서 가장 자연스럽고 문맥도 살립니다.
- source_word: מֶלֶךְ מוֹאָב
  english_pob_choice: the king of Moab
  chosen_korean: 모압 왕
  alternatives_korean:
  - 모압의 왕
  lexicon: HALOT
  rationale: 히브리어의 소유격 결합을 한국어의 관용적인 명사구로 옮겼습니다.
- source_word: וַיֵּשְׁבוּ עִמּוֹ
  english_pob_choice: they stayed with him
  chosen_korean: 그들은 그와 함께 있었습니다
  alternatives_korean:
  - 그들은 그와 함께 머물렀습니다
  - 그들은 그와 함께 살았습니다
  lexicon: HALOT
  rationale: ישב는 여기서 지속적 동거/체류를 뜻하므로, ‘함께 있었습니다’가 간결하면서도 기간의 지속성을 무리 없이 전달합니다.
- source_word: כָּל יְמֵי הֱיוֹת דָּוִד בַּמְּצוּדָה
  english_pob_choice: all the days that David was in the stronghold
  chosen_korean: 다윗이 요새에 있는 모든 날 동안
  alternatives_korean:
  - 다윗이 요새에 머무는 동안 내내
  - 다윗이 요새에 있던 모든 날 동안
  lexicon: HALOT
  rationale: ‘모든 날 동안’은 כָּל יְמֵי의 전체 기간을, ‘요새’는 מְצוּדָה의 방어적 거처 의미를 반영합니다.
