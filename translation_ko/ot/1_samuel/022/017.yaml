- issue: '레지스터: 왕의 명령과 신하들의 거절'
  chosen_reading: 왕의 폭력적 명령은 직설적으로, 신하들의 응답은 서술로 처리했습니다.
  alternative_readings:
  - 왕의 말을 더 완곡하게 옮김
  - 신하들의 거절을 직접인용으로 강화
  rationale: 히브리어의 잔혹성과 긴장을 약화하지 않기 위해 명령어는 날카롭게, 거절은 담담하게 유지했습니다.
