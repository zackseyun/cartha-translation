base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/017.yaml
  text: Then the king said to the runners who were standing around him[a], “Turn and kill the priests of Yahweh, because their hand also is with David[b], and because they knew that he was fleeing and did not disclose it to me.” But the king’s servants were not willing to put out their hand to strike the priests of Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''their hand also is with David,'' an idiom meaning they support or side with David.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''did not uncover my ear,'' that is, ''did not inform me.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 그의 곁에 서 있던 왕의 수행원들에게 말했습니다. 「돌아서서 야훼의 제사장들을 죽이십시오. 그들도 다윗 편에 있고[a], 그가 도망하고 있다는 것을 알면서도 나에게 알리지 않았기 때문입니다.[b]」 그러나 왕의 신하들은 손을 내밀어 야훼의 제사장들을 해치려 하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다윗 편에 있다’는 히브리어 ‘그들의 손이 다윗과 함께 있다’는 관용구를 뜻풀이한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나에게 알리지 않았다’는 히브리어의 ‘내 귀를 드러내지 않았다’는 관용구를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרָצִים
  english_pob_choice: to the runners
  chosen_korean: 경호병들
  alternatives_korean:
  - 달리는 사람들
  - 전령들
  lexicon: HALOT
  rationale: 왕의 곁에 서 있는 사람들을 가리키는 궁정 문맥이므로, 직역의 ‘달리는 사람들’보다 기능이 드러나는 ‘경호병들’이 한국어 독자에게 더 분명합니다.
- source_word: הַנִּצָּבִים עָלָיו
  english_pob_choice: who were standing around him
  chosen_korean: 자기 곁에 서 있던
  alternatives_korean:
  - 그를 둘러서 있던
  - 그를 보좌하며 서 있던
  lexicon: HALOT
  rationale: נצב + על의 ‘곁에 서다/대기하다’는 뜻을 살리면서, 궁정 현장의 자연스러운 표현으로 옮겼습니다.
- source_word: כִּי גַם יָדָם עִם דָּוִד
  english_pob_choice: because their hand also is with David
  chosen_korean: 그들도 다윗 편에 있고
  alternatives_korean:
  - 그들의 손도 다윗과 함께 있고
  - 그들도 다윗을 지지하고 있고
  lexicon: HALOT
  rationale: ‘손이 …와 함께 있다’는 히브리어 관용구는 지지·동조를 뜻하므로, 한국어에서는 의미를 분명히 하는 ‘다윗 편에 있다’로 옮겼습니다.
- source_word: וְלֹא גָלוּ אֶת אזנ/ו
  english_pob_choice: and did not disclose it to me
  chosen_korean: 나에게 알리지 않았기 때문입니다
  alternatives_korean:
  - 내 귀를 드러내지 않았기 때문입니다
  - 나에게 고하지 않았기 때문입니다
  lexicon: HALOT
  rationale: ‘귀를 드러내다’의 히브리어 관용구를 그대로 두기보다, 왕의 발화 안에서 ‘알리지 않다’로 풀어 의미를 직접 전달했습니다.
- source_word: לִפְגֹעַ בְּכֹהֲנֵי יְהוָה
  english_pob_choice: to strike the priests of Yahweh
  chosen_korean: 야훼의 제사장들을 치려고
  alternatives_korean:
  - 야훼의 제사장들을 공격하려고
  - 야훼의 제사장들을 때리려고
  lexicon: HALOT
  rationale: פגע는 여기서 폭력적 위해를 뜻하므로, 한국어에서 폭행·공격을 아우르며 자연스러운 ‘치다’를 택했습니다.
theological_decisions:
- issue: יהוה / YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 야훼의 이름이 직접 나오므로, 프로젝트 기본값에 따라 언약적 고유명을 ‘야훼’로 유지했습니다.
