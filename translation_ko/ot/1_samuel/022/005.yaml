revisions:
- from: 그때 예언자 갓이 다윗에게 말했습니다. 「그 요새에 머물지 마십시오. 가서 유다 땅으로 들어가십시오.」 그래서 다윗은 떠나 헤렛의 수풀로 들어갔습니다.[a]
  to: 그때 예언자 갓이 다윗에게 말했습니다. 「그 요새에 머물지 마십시오. 가서 유다 땅으로 들어가십시오.[a]」 그래서 다윗은 떠나 헤렛의 숲에 이르렀습니다.
  rationale: 각주를 실제로 בוא를 옮긴 ‘들어가십시오’에 붙이고 그 설명을 바로잡았습니다. 결말은 ‘이르렀습니다’로 옮겨 히브리어의 도착 의미를 보존하면서, 원문이 명시하지 않는 숲 내부로의 진입을 단정하지 않도록 했습니다. ‘숲’은 יַעַר에 대한 자연스럽고 정확한 현대 한국어 표현입니다.
