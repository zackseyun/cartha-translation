id: 1SA.22.5
reference: 1 Samuel 22:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ גָּ֨ד הַ/נָּבִ֜יא אֶל דָּוִ֗ד לֹ֤א תֵשֵׁב֙ בַּ/מְּצוּדָ֔ה לֵ֥ךְ וּ/בָֽאתָ לְּ/ךָ֖ אֶ֣רֶץ יְהוּדָ֑ה וַ/יֵּ֣לֶךְ דָּוִ֔ד וַ/יָּבֹ֖א יַ֥עַר חָֽרֶת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/005.yaml
  text: Then Gad the prophet said to David[a], “Do not stay in the stronghold. Go and come for yourself to the land of Judah.” So David went and came to the forest of Hereth.
  footnotes:
  - marker: a
    text: Or “go to the land of Judah.” The Hebrew verb can be rendered either “come/enter” or more generally “go to,” depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 예언자 갓이 다윗에게 말했습니다. 「그 요새에 머물지 마십시오. 가서 유다 땅으로 들어가십시오.」 그래서 다윗은 떠나 헤렛의 수풀로 들어갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가서’는 히브리어 בוא의 이동/진입 의미를 반영한 것으로, 문맥에 따라 ‘들어가다/오다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 예언자 갓
  lexicon: HALOT
  rationale: נָבִיא는 표준적으로 ‘예언자’로 옮기는 것이 직역성이 높고, 현대 한국어에서도 자연스럽습니다.
- source_word: בַּמְּצוּדָה
  english_pob_choice: the stronghold
  chosen_korean: 그 요새
  alternatives_korean:
  - 그 성채
  - 그 피난처
  lexicon: HALOT
  rationale: 문맥상 다윗이 있는 방어 거점을 가리키므로 ‘요새’가 간결하고 자연스럽습니다.
- source_word: וּבָאתָ לְּךָ אֶרֶץ יְהוּדָה
  english_pob_choice: and enter the land of Judah
  chosen_korean: 가서 유다 땅으로 들어가십시오
  alternatives_korean:
  - 가서 유다 땅으로 가십시오
  - 가서 유다 땅에 들어가십시오
  lexicon: HALOT
  rationale: בוא의 이동·진입 의미를 살려 ‘들어가십시오’로 옮기되, 한국어 어순상 앞의 ‘가서’로 자연스럽게 연결했습니다. לְּךָ는 별도의 의미를 더하기보다 명령의 방향성을 강조하는 요소로 보고 문장 전체에 반영했습니다.
- source_word: יַעַר חָרֶת
  english_pob_choice: the forest of Hereth
  chosen_korean: 헤렛의 수풀
  alternatives_korean:
  - 헤렛의 숲
  - 헤렛 숲
  lexicon: HALOT
  rationale: יַעַר는 ‘숲/수풀’ 범위가 있으나, 지명으로 굳어진 느낌을 살리기 위해 ‘헤렛의 수풀’로 옮겼습니다.
theological_decisions:
- issue: 명령문에서 공손한 호칭과 행위 지시의 어조
  chosen_reading: 갓의 예언자적 경고를 현대 한국어 합쇼체 명령으로 옮겨, 원문의 즉각적이고 실제적인 지시성을 살렸습니다.
  alternative_readings:
  - 머물지 마십시오/머물지 마시오
  - 떠나십시오
  rationale: 히브리어 명령문의 직접성을 유지하면서도 한국어 성경문체로 자연스럽게 읽히도록 했습니다.
  doctrine_reference: 서술/명령 어조의 충실한 재현
- issue: וַיֵּלֶךְ ... וַיָּבֹא의 연속 동작
  chosen_reading: ‘떠나 … 들어갔습니다’로 두 동작을 분리해 연속성과 도착을 함께 드러냈습니다.
  alternative_readings:
  - 가서 … 갔습니다
  - 떠나 … 갔습니다
  rationale: 서술적 순서를 보존하면서도 최종 도착 장면을 분명하게 나타내기 위한 선택입니다.
  doctrine_reference: 내러티브 동작의 순차성
