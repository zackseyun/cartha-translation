  - ‘여호와’
  rationale: 본문이 예언자적/서사적 용례에서 신명사문자 יְהוָה를 직접 사용하므로, 프로젝트 표준에 따라 고유명 ‘야훼’를 유지해 본문의 언약적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
