lexical_decisions:
- source_word: וַיַּגֵּד
  english_pob_choice: told
  chosen_korean: 알렸습니다
  alternatives_korean:
  - 말했습니다
  - 전했습니다
  lexicon: HALOT
  rationale: ‘הגיד’의 사역형은 단순한 발화보다 사실을 전달해 알리는 뜻이 강하므로, 자연스러운 현대 한국어로 ‘알렸습니다’를 택했습니다.
- source_word: לְדָוִד
  english_pob_choice: David
  chosen_korean: 다윗에게
  alternatives_korean:
  - 다윗한테
  lexicon: HALOT
  rationale: 히브리어의 ל-가 수혜·대상(간접목적어)을 나타내므로 한국어에서는 여격 조사 ‘-에게’로 옮겼습니다.
- source_word: כֹּהֲנֵי יְהוָה
  english_pob_choice: the priests of Yahweh
  chosen_korean: 야훼의 제사장들
  alternatives_korean:
  - 야훼께 속한 제사장들
  - 야훼의 사제들
  lexicon: HALOT
  rationale: ‘כֹּהֲנֵי’는 제도적 직분을 가리키는 ‘제사장들’이 가장 직접적이며, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: הָרַג
  english_pob_choice: had killed
  chosen_korean: 죽였다고
  alternatives_korean:
  - 죽였다고 이미
  - 죽여 버렸다고
  lexicon: HALOT
  rationale: 보고 내용 속 선행 사건을 한국어에서도 간접화법으로 자연스럽게 표현하기 위해 과거 완료의 시간 관계를 ‘죽였다고’로 반영했습니다.
theological_decisions:
- issue: יהוה(YHWH)의 표기
  chosen_reading: ‘the LORD’ 대신 ‘야훼’로 직역했습니다.
