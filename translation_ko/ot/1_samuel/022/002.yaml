language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּֽתְקַבְּצ֣וּ אֵ֠לָי/ו כָּל אִ֨ישׁ מָצ֜וֹק וְ/כָל אִ֨ישׁ אֲשֶׁר ל֤/וֹ נֹשֶׁא֙ וְ/כָל אִ֣ישׁ מַר נֶ֔פֶשׁ וַ/יְהִ֥י עֲלֵי/הֶ֖ם לְ/שָׂ֑ר וַ/יִּהְי֣וּ עִמּ֔/וֹ כְּ/אַרְבַּ֥ע מֵא֖וֹת אִֽישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/002.yaml
  text: And everyone in distress[a], everyone who was in debt, and everyone bitter in soul gathered to him, and he became commander over them[b]. About four hundred men were with him.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'everyone who was in debt.' The Hebrew literally says 'everyone who had a creditor/exactor.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'bitter in soul,' an idiom for deep inner bitterness or anguish.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 곤경에 처한 사람, 빚을 진 사람[a], 마음이 쓰라린 사람이[b] 모두 그에게 모여들었습니다. 그는 그들의 지휘관이 되었습니다. 약 사백 명의 사람이 그와 함께 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘빚진 사람’보다 ‘채권자나 독촉하는 자가 있는 사람’에 더 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘마음이 쓰라린’은 깊은 내적 괴로움이나 비탄을 가리키는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ אֵלָיו
  english_pob_choice: gathered to him
  chosen_korean: 그에게 모여들었습니다
  alternatives_korean:
  - 그에게 모였습니다
  - 그에게 집결했습니다
  lexicon: HALOT
  rationale: 모이다보다 모여들다를 써서 단순 집합이 아니라 다윗에게로 향해 오는 군중의 움직임을 살렸습니다.
- source_word: מָצוֹק
  english_pob_choice: in distress
  chosen_korean: 고통 가운데 있는
  alternatives_korean:
  - 곤경에 처한
  - 환난 가운데 있는
  lexicon: HALOT
  rationale: מָצוֹק은 압박과 곤경, 궁핍을 아우르는 말이므로, 한국어로는 넓게 이해되는 고통 가운데 있는으로 옮겼습니다.
- source_word: אֲשֶׁר לוֹ נֹשֶׁא
  english_pob_choice: who had a creditor
  chosen_korean: 빚을 진 사람
  alternatives_korean:
  - 채권자가 있는 사람
  - 빚진 사람
  lexicon: HALOT
  rationale: 영어 POB가 주석에서 염두에 둔 법적 압박의 의미를 따라가되, 한국어에서는 자연스러운 관용인 빚을 진 사람으로 풀어 엘립시스를 전달했습니다.
- source_word: מַר נֶפֶשׁ
  english_pob_choice: bitter in soul
  chosen_korean: 마음이 쓰린
  alternatives_korean:
  - 영혼이 쓰린
  - 속이 쓰린
  lexicon: HALOT
  rationale: 직역형인 영혼이 쓰린도 가능하지만, 현대 한국어에서는 נפש의 내적 상처를 마음이 쓰린으로 옮기는 것이 더 자연스럽고 본문의 정서를 살립니다.
- source_word: לְשָׂר
  english_pob_choice: commander
  chosen_korean: 지휘관
  alternatives_korean:
  - 우두머리
  - 대장
  - 사령관
  lexicon: HALOT
  rationale: שַׂר은 관원·지도자·지휘자를 뜻하지만, 이 무리의 군사적 맥락에서는 지휘관이 가장 정확하고 현대적인 표현입니다.
theological_decisions:
- issue: 다윗이 유랑자들의 리더가 되는 장면의 표현 수위
  chosen_reading: 다윗이 단순한 동행자가 아니라 그들의 지휘관이 되었다고 분명히 밝혔습니다.
  alternative_readings:
  - 그가 그들 위에 있게 되었습니다
  - 그가 그들을 이끌게 되었습니다
  rationale: 본문의 לְשָׂר는 관계적 동행보다 권한을 가진 통솔의 의미가 강하므로, 리더십의 공적 성격을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 본문 주해 수준; 왕권/지도력 서술
