- from: 그리고 고통 가운데 있는 사람, 빚을 진 사람, 그리고 마음이 쓰린 사람이 모두 그에게 모여들었습니다. 그는 그들의 지휘관이 되었습니다. 약 사백 명의 사람이 그와 함께 있었습니다.[a][b]
  to: 그리고 곤경에 처한 사람, 빚을 진 사람[a], 마음이 쓰라린 사람이[b] 모두 그에게 모여들었습니다. 그는 그들의 지휘관이 되었습니다. 약 사백 명의 사람이 그와 함께 있었습니다.
  rationale: מָצוֹק은 넓은 의미의 압박과 곤경을 나타내므로 ‘곤경에 처한’으로 자연스럽게 옮겼습니다. מַר נֶפֶשׁ는 ‘마음이 쓰라린’으로 바로잡아 히브리어의 내적 비통을 자연스럽고 명료하게 전달했습니다. 빚에 관한 히브리어 표현의 어휘적 여지는 각주에서 보존했으며, 각주 표지를 해당 어구에 연결했습니다.
