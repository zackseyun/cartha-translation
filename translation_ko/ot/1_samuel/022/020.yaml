source:
  edition: WLC
  text: וַ/יִּמָּלֵ֣ט בֵּן אֶחָ֗ד לַ/אֲחִימֶ֨לֶךְ֙ בֶּן אֲחִט֔וּב וּ/שְׁמ֖/וֹ אֶבְיָתָ֑ר וַ/יִּבְרַ֖ח אַחֲרֵ֥י דָוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/020.yaml
  text: But one son of Ahimelech son of Ahitub escaped[a], and his name was Abiathar, and he fled after David.
  footnotes:
  - marker: a
    text: Or 'he fled to David.' The Hebrew literally says 'he fled after David,' which can mean going after him in order to join him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 아히둡의 아들 아히멜렉의 아들 한 명이 탈출하였는데, 그의 이름은 아비아달이었습니다. 그는 다윗을 따라 도망하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 다윗에게로 도망하였습니다.’ 히브리어는 문자적으로 ‘그는 다윗 뒤를 따라 도망하였다’고 하며, 이는 그를 따라가 합류했다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵט
  english_pob_choice: escaped
  chosen_korean: 살아남았으니
  alternatives_korean:
  - 도망쳤으니
  - 탈출했으니
  lexicon: HALOT
  rationale: 직전의 학살 문맥에서 단순 생존이 아니라 죽음을 면하고 빠져나온 결과를 나타내므로, ‘살아남았으니’로 자연스럽게 옮기되 뒤의 ‘도망하였습니다’와 구별했습니다.
- source_word: בֵּן אֶחָד
  english_pob_choice: one son
  chosen_korean: 아들 한 명
  alternatives_korean:
  - 한 아들
  - 외아들
  lexicon: HALOT
  rationale: 히브리어의 수량 강조를 살리기 위해 ‘한 명’을 앞세워, 살아남은 남자 후손이 하나뿐이라는 대비를 분명히 했습니다.
- source_word: וַיִּבְרַח אַחֲרֵי דָוִד
  english_pob_choice: he fled after David
  chosen_korean: 다윗을 따라 도망하였습니다
  alternatives_korean:
  - 다윗 뒤를 따라 도망하였습니다
  - 다윗에게로 도망하였습니다
  lexicon: HALOT
  rationale: אַחֲרֵי דָוִד는 문자적으로 ‘다윗 뒤/후에’이지만, 여기서는 그에게 합류하려는 추격·동행의 방향을 나타내므로 한국어에서는 의미를 드러내되, ‘다윗에게로’처럼 목적지만 강조하는 번역은 피했습니다.
theological_decisions:
- issue: 살아남은 자의 서술과 도피의 서술을 어떻게 구분할지
  chosen_reading: ‘살아남았으니 … 도망하였습니다’로 두 동사를 분리해, 한 번은 학살에서 목숨을 건진 사실을, 다음은 그가 다윗 쪽으로 향한 이동을 표현했습니다.
  alternative_readings:
  - ‘도망쳤으며’로 하나로 묶기
  - ‘탈출하였고’로 통합하기
  rationale: 히브리어는 וַיִּמָּלֵט와 וַיִּבְרַח 두 동사를 나란히 사용해 결과와 행위를 구별하므로, 한국어에서도 그 긴장을 유지하는 편이 본문 의미를 더 정확히 드러냅니다.
  doctrine_reference: 서사 본문의 사건 연속성 보존
