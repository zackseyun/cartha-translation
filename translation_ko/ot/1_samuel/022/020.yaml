revisions:
- from: 그러나 아히멜렉의 아들, 아히둡의 아들인 자손 한 명이 살아남았으니 그의 이름은 아비아달이었습니다. 그는 다윗을 따라 도망하였습니다.[a]
  to: 그러나 아히둡의 아들 아히멜렉의 아들 한 명이 탈출하였는데, 그의 이름은 아비아달이었습니다. 그는 다윗을 따라 도망하였습니다.[a]
  rationale: 계보를 원문 순서대로 바로잡고, בן을 ‘아들’로 정확히 옮겼습니다. 첫 동사는 학살에서 빠져나온 행위를 나타내도록 ‘탈출하였습니다’로, 둘째 동사는 ‘도망하였습니다’로 유지하여 두 히브리어 동사의 차이를 보존했습니다. אַחֲרֵי의 ‘따라/뒤를 따라’라는 방향성은 본문과 각주에서 유지하되, ‘다윗에게로’라는 해석 가능성은 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:27:40Z'
