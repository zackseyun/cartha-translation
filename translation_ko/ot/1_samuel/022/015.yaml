  source_fidelity: 수사적 질문과 ‘그를 위하여 하나님께 묻다’의 의미는 대체로 잘 반영했습니다. 그러나 בְעַבְדּוֹ는 왕에게 말하는 아히멜렉의 겸양적 자기 지칭이므로 ‘당신의 종’이 아니라 ‘왕의 종인 저’로 옮겨야 합니다. 또한 יָשֵׂם ... דָבָר의 고발·전가 문맥은 ‘어떤 일도 돌리지’보다 ‘어떤 혐의도 씌우지’가 한국어에서 더 분명합니다.
