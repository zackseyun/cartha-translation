base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/015.yaml
  text: Was today the first time that I inquired of God for him? Far be it from me! Let not the king impute anything to his servant or to all my father’s house[a], for your servant knew nothing of all this, whether small or great.
  footnotes:
  - marker: a
    text: Or, more formally, 'Did I begin today to inquire of God for him?' The Hebrew rhetorical question implies that this was not the first time Ahimelech had done so.
    reason: lexical_alternative
translation:
  language: ko
  text: “오늘 내가 그를 위해 하나님께 묻기 시작한 것이 처음이었습니까? 결코 그렇지 않습니다! 왕께서는 당신의 종에게나 내 아버지의 온 집에 어떤 일도 돌리지 마십시오. 당신의 종은 이 모든 일에 대해, 작은 것이든 큰 것이든 아무것도 알지 못했습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “그를 위해 하나님께 묻기 시작한”은 원문의 ‘하나님께 묻다’라는 관용구를 살린 표현입니다. 더 직역하면 “오늘 내가 그를 위해 하나님께 묻기 시작한 것이 처음이었습니까?”가 됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחִלֹּתִי
  english_pob_choice: was today the first time that I inquired
  chosen_korean: “오늘 내가 … 묻기 시작한 것이 처음이었습니까?”
  alternatives_korean:
  - “오늘 내가 … 묻기 시작했습니까?”
  - “오늘 내가 … 처음으로 묻기 시작했습니까?”
  lexicon: HALOT
  rationale: 히필 형태의 수사적 질문이 ‘오늘 처음이었느냐’는 부정을 담으므로, 한국어도 처음 시작했는지 묻는 반문으로 옮겼습니다.
- source_word: לִשְׁאוֹל לוֹ בֵאלֹהִים
  english_pob_choice: inquired of God for him
  chosen_korean: “그를 위해 하나님께 묻기 시작한”
  alternatives_korean:
  - “그를 위해 하나님께 문의한”
  - “그를 위해 하나님께 알아본”
  lexicon: HALOT
  rationale: שאל + בֵאלֹהִים은 신탁/하나님의 뜻을 묻는 행위이므로, ‘묻다’로 직역하되 ‘그를 위해’로 לוֹ의 수혜 대상을 살렸습니다.
- source_word: אַל יָשֵׂם ... דָבָר
  english_pob_choice: Let not the king impute anything
  chosen_korean: “왕께서는 당신의 종에게나 … 어떤 일도 돌리지 마십시오”
  alternatives_korean:
  - “왕께서는 … 아무것도 죄로 돌리지 마십시오”
  - “왕께서는 … 어떤 일도 씌우지 마십시오”
  lexicon: HALOT
  rationale: יָשֵׂם + דָבָר의 법정적 의미를 살려 ‘돌리다’로 옮겼고, 무슨 일이라도 혐의로 전가하는 뜻을 유지했습니다.
- source_word: דָּבָר קָטֹן ... גָדוֹל
  english_pob_choice: whether small or great
  chosen_korean: “작은 것이든 큰 것이든”
  alternatives_korean:
  - “적은 것이든 많은 것이든”
  - “사소한 것이든 중대한 것이든”
  lexicon: HALOT
  rationale: 히브리어의 총칭적 대비를 한국어 관용으로 자연스럽게 옮기되, 규모의 전면 부정을 유지했습니다.
theological_decisions:
- issue: 아히멜렉의 부인 진술에서 수사적 질문의 기능
  chosen_reading: 첫 질문은 실제 정보 요청이 아니라, 오늘이 처음이 아님을 강하게 부인하는 반문으로 읽었습니다.
  alternative_readings:
  - 단순 과거의 사실 확인 질문
  - 완곡한 자기변호
  rationale: 문맥상 아히멜렉은 새로 시작한 일이 아님을 강조하며 결백을 변호하므로, 반문의 힘을 살려 번역했습니다.
  doctrine_reference: 서사 문맥과 화행(수사적 질문) 해석
