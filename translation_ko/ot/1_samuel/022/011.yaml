  yaml_path: translation/ot/1_samuel/022/011.yaml
  text: Then the king sent to summon Ahimelech son of Ahitub the priest[a], and all his father's house, the priests who were at Nob; and they all came to the king.
  footnotes:
  - marker: a
    text: Hebrew 'all his father's house' refers to his wider paternal household or clan, not merely his immediate family.
    reason: cultural_note
translation:
  language: ko
  text: 그때 왕은 제사장 아히멜렉, 곧 아히둡의 아들과 노브에 있는 그의 아버지 집[a]의 모든 제사장을 불러오라고 사람을 보냈습니다. 그들이 모두 왕에게 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 아버지 집’은 직계 가족만이 아니라 더 넓은 부계 집단이나 씨족을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח ... לִקְרֹא
  english_pob_choice: sent to summon
  chosen_korean: 불러오라고 사람을 보냈습니다
  alternatives_korean:
  - 소환하라고 보냈습니다
  - 부르도록 보냈습니다
  - 불러오게 했습니다
  lexicon: HALOT
  rationale: 왕의 명령이 포함된 파견이므로, 단순히 ‘보냈다’보다 ‘불러오라고 사람을 보냈습니다’가 לִקְרֹא의 공적 소환 뉘앙스를 가장 자연스럽게 드러냅니다.
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 그 제사장
  - 사제
  lexicon: HALOT
  rationale: 아히멜렉의 직분을 가리키는 표지이므로, 한국어 성경 문맥에 맞는 표준 직역으로 ‘제사장’을 사용했습니다.
- source_word: כָּל בֵּית אָבִיו
  english_pob_choice: all his father's house
  chosen_korean: 그의 아버지 집의 모든 제사장
  alternatives_korean:
  - 그의 아버지 집안 전체의 제사장들
  - 그의 아버지 집의 모든 사람
  - 그의 부계 가문의 모든 사람
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 직계가족보다 더 넓은 부계 집단을 가리키므로, 본문 문맥에 맞게 ‘아버지 집’의 범위를 살리되 뒤의 ‘제사장들’과 결합해 의미를 분명히 했습니다.
- source_word: בְּנֹב
  english_pob_choice: at Nob
  chosen_korean: 노브에 있는
  alternatives_korean:
  - 노브에 있던
  - 노브에 사는
  - 노브의
  lexicon: HALOT
  rationale: 지명 부사구를 자연스러운 한국어 위치 표현으로 옮겼습니다.
theological_decisions:
- issue: 왕의 소환 명령의 성격
  chosen_reading: 본문은 단순 방문 요청이 아니라 왕권을 동반한 공식 소환으로 읽었습니다.
  alternative_readings:
  - 정중한 초청으로 약화해 번역
