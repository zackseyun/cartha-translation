source:
  edition: WLC
  text: כִּי֩ קְשַׁרְתֶּ֨ם כֻּלְּ/כֶ֜ם עָלַ֗/י וְ/אֵין גֹּלֶ֤ה אֶת אָזְנִ/י֙ בִּ/כְרָת בְּנִ֣/י עִם בֶּן יִשַׁ֔י וְ/אֵין חֹלֶ֥ה מִ/כֶּ֛ם עָלַ֖/י וְ/גֹלֶ֣ה אֶת אָזְנִ֑/י כִּ֣י הֵקִים֩ בְּנִ֨/י אֶת עַבְדִּ֥/י עָלַ֛/י לְ/אֹרֵ֖ב כַּ/יּ֥וֹם הַ/זֶּֽה־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/008.yaml
  text: For all of you have conspired against me[a], and no one informs me when my son makes a covenant with the son of Jesse, and none of you is grieved for me or informs me that my son has stirred up my servant against me to lie in wait[d][c][b], as at this day.
  footnotes:
  - marker: a
    text: Hebrew literally, 'uncovers my ear,' an idiom meaning 'informs me' or 'reveals it to me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'none of you is sorry for me' / 'none of you cares about me.'
    reason: lexical_alternative
  - marker: c
    text: '''The son of Jesse'' refers to David; Saul uses the patronymic rather than David''s name.'
    reason: cultural_note
  - marker: d
    text: Or 'has raised up my servant against me for an ambush.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 다 나를 거슬러 모의하였고, 내 아들이 이새의 아들과 언약을 맺을 때에 내게 알리는 사람이 없으며, 내 아들이 내 종을 나를 거슬러 매복하게 일으킨 것을 내게 알려 주는 사람도 없으니, 오늘까지 그러합니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 귀를 드러내다’라는 관용구로, ‘내게 알리다/알려 주다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나를 불쌍히 여기다’ 또는 ‘나를 걱정하다’라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘이새의 아들’은 다윗을 가리키며, 사울은 다윗의 이름 대신 아버지 이름으로 부릅니다.
    reason: cultural_note
  - marker: d
    text: ‘매복을 위해 일으키다’ 또는 ‘매복하도록 들추어 세우다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  english_pob_choice: have conspired
  chosen_korean: 모의하였고
  alternatives_korean:
  - 공모하였고
  - 반역을 꾀하였고
  lexicon: HALOT
  rationale: 문맥상 사울에 대한 적대적 공모를 가리키므로, 중립적 결속보다 ‘모의하다’가 음모의 뉘앙스를 잘 드러냅니다.
- source_word: גֹּלֶה אֶת אָזְנִי
  english_pob_choice: informs me
  chosen_korean: 내게 알리는 사람이 없으며
  alternatives_korean:
  - 내 귀를 열어 주는 사람이 없으며
  - 내게 알려 주는 사람이 없으며
  lexicon: HALOT
  rationale: ‘귀를 열다’는 히브리어 관용구를 뜻상 살리되, 한국어 본문에서는 자연스러운 ‘알리다’로 풀었습니다.
- source_word: חֹלֶה ... עָלַי
  english_pob_choice: is grieved for me
  chosen_korean: 나를 불쌍히 여기는 사람도 없으니
  alternatives_korean:
  - 나를 안타까워하는 사람도 없으니
  - 나를 걱정하는 사람도 없으니
  lexicon: HALOT
  rationale: 이 동사는 단순한 후회보다 사울을 향한 깊은 동정과 안타까움을 가리키므로, 감정의 결을 살려 번역했습니다.
- source_word: לְאֹרֵב
  english_pob_choice: to lie in wait
  chosen_korean: 매복하게
  alternatives_korean:
  - 복병하게
  - 숨어 기다리게
  lexicon: HALOT
  rationale: ‘기다리다’보다 적대적 매복의 군사적 이미지를 분명히 하는 ‘매복하다’가 מתאים합니다.
theological_decisions:
- issue: 사울의 자기진술에서 דַּוִד(‘내 종’)의 위상
  chosen_reading: ‘내 종’으로 두어 사울의 왕권 아래 있는 신하라는 정치적 관계를 드러냈습니다.
  alternative_readings:
  - ‘내 노예’로 더 강하게 번역하는 방식
  - ‘내 시종’으로 완화하는 방식
  rationale: 본문은 노예 제도를 강조하기보다 사울이 다윗을 자기 휘하의 종으로 지칭하는 정치적·법적 관계를 보여 주므로, 기존 POB의 구별을 따라 ‘종’을 유지했습니다.
  doctrine_reference: 본문의 왕권/충성 관계에 대한 역사적 이해
