source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ ל/דויג סֹ֣ב אַתָּ֔ה וּ/פְגַ֖ע בַּ/כֹּהֲנִ֑ים וַ/יִּסֹּ֞ב דויג הָ/אֲדֹמִ֗י וַ/יִּפְגַּע הוּא֙ בַּ/כֹּ֣הֲנִ֔ים וַ/יָּ֣מֶת בַּ/יּ֣וֹם הַ/ה֗וּא שְׁמֹנִ֤ים וַ/חֲמִשָּׁה֙ אִ֔ישׁ נֹשֵׂ֖א אֵפ֥וֹד בָּֽד־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/018.yaml
  text: Then the king said to Doeg[a], “Turn and strike down the priests.” So Doeg the Edomite turned and struck down the priests, and on that day he put to death eighty-five men who wore a linen ephod.
  footnotes:
  - marker: a
    text: Or 'attack the priests' / 'fall upon the priests.' The Hebrew verb can denote violent assault more broadly; 'strike down' was chosen to fit the execution context while preserving the action before the summary statement that he 'put to death' eighty-five men.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 도엑에게 말했습니다. “돌아서서 제사장들을 치십시오.” 그래서 에돔 사람 도엑이 돌아서서 제사장들을 쳤고, 그날 그는 베 에봇을 입은 여든다섯 사람을 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제사장들을 공격하라” / “제사장들에게 달려들라”. 히브리어 동사는 더 넓게 폭력적 습격을 뜻할 수 있으므로, 여기서는 처형 장면에 맞게 “치다”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סֹב / וַיִּסֹּב
  english_pob_choice: turn
  chosen_korean: 돌아서다
  alternatives_korean:
  - 돌다
  - 방향을 바꾸다
  lexicon: HALOT
  rationale: 명령형과 서술형 모두에서 갑작스러운 행동 전환을 자연스럽게 드러내면서, 이어지는 공격 명령에 맞게 동작의 방향 전환을 살렸습니다.
- source_word: וּפְגַע / וַיִּפְגַּע
  english_pob_choice: strike down
  chosen_korean: 치다
  alternatives_korean:
  - 공격하다
  - 쓰러뜨리다
  - 쳐서 죽이다
  lexicon: HALOT
  rationale: 여기서는 단순 접촉이 아니라 폭력적 타격을 뜻하므로, 결과 동사인 “죽였습니다”와 구분되도록 간결하게 “치다”로 옮겼습니다.
- source_word: נֹשֵׂא אֵפוֹד בָּד
  english_pob_choice: who wore a linen ephod
  chosen_korean: 베 에봇을 입은
  alternatives_korean:
  - 베 에봇을 두른
  - 베옷 에봇을 입은
  lexicon: HALOT
  rationale: 에봇은 제사장 예복이므로 “입은”이 가장 자연스럽고, בָּד는 문맥상 ‘베/삼베’의 직물성을 살려 “베”로 옮겼습니다.
theological_decisions:
- issue: '행동의 단계적 구분: 공격과 살해의 이중 표현'
  chosen_reading: ‘쳤고’와 ‘죽였습니다’를 구분해, 먼저 가해진 폭력과 그 결과로서의 살해를 따로 드러냈습니다.
  alternative_readings:
  - 모두 ‘죽이다’로 통합
  - 모두 ‘공격하다’로 완화
  rationale: 히브리어는 פגע와 מות의 기능이 다르므로, 서술의 진행과 잔혹성을 함께 보존하는 편이 본문 의미에 더 충실합니다.
  doctrine_reference: 본문 서술의 역사적-서사적 구분
