  text: וַ/יַּ֜עַן דֹּאֵ֣ג הָ/אֲדֹמִ֗י וְ/ה֛וּא נִצָּ֥ב עַל עַבְדֵֽי שָׁא֖וּל וַ/יֹּאמַ֑ר רָאִ֨יתִי֙ אֶת בֶּן יִשַׁ֔י בָּ֣א נֹ֔בֶ/ה אֶל אֲחִימֶ֖לֶךְ בֶּן אֲחִטֽוּב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/009.yaml
  text: Then Doeg the Edomite[a], who was standing among Saul’s servants, answered and said, “I saw the son of Jesse coming to Nob, to Ahimelech son of Ahitub.”
  footnotes:
  - marker: a
    text: Or, “who was stationed over Saul’s servants.” The Hebrew phrase may suggest either Doeg’s position among Saul’s servants or a supervisory role over them.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 도엑은, 사울의 신하들 가운데 서 있던 에돔 사람인데, 대답하여 말했습니다. “이새의 아들이 놉으로, 아히둡의 아들 아히멜렉에게 오는 것을 보았습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사울의 신하들 위에 배치된 사람’일 수 있습니다. 히브리어 구문은 도엑의 신하들 가운데 위치를 가리키거나, 그들 위의 감독 역할을 시사할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 응답했습니다
  lexicon: HALOT
  rationale: 서술문 속 대화 개시 공식으로서 ‘answered and said’의 이중 동사를 한국어에서 자연스럽게 살리되, 지나치게 딱딱한 한자어를 피했습니다.
- source_word: הָאֲדֹמִי
  english_pob_choice: the Edomite
  chosen_korean: 에돔 사람
  alternatives_korean:
  - 에돔인
  - 에돔 사람인
  lexicon: HALOT
  rationale: 정관사 있는 민족적 호칭을 인명 보충구로 자연스럽게 옮기되, 한국어에서 더 읽기 쉬운 ‘사람’ 구성을 택했습니다.
- source_word: וְהוּא נִצָּב עַל עַבְדֵי שָׁאוּל
  english_pob_choice: who was standing among Saul’s servants
  chosen_korean: 사울의 신하들 가운데 서 있던
  alternatives_korean:
  - 사울의 신하들 위에 세워져 있던
  - 사울의 신하들 위에 배치되어 있던
  lexicon: HALOT
  rationale: עַל의 관계를 ‘among/over’ 중 어느 쪽으로도 읽을 수 있는 긴장을 살려, POB의 기본 선택처럼 공식적 지위 과장을 피하면서 현재 위치를 드러냈습니다.
- source_word: בֶּן יִשַׁי
  english_pob_choice: the son of Jesse
  chosen_korean: 이새의 아들
  alternatives_korean:
  - 다윗
  - 이새의 아들 다윗
  lexicon: HALOT
  rationale: 본문이 개인명 ‘다윗’이 아니라 관계적 호칭을 사용하므로, 그 수사적 효과를 보존했습니다.
- source_word: בָּא נֹבֶה אֶל אֲחִימֶלֶךְ בֶּן אֲחִיטוּב
  english_pob_choice: coming to Nob, to Ahimelech son of Ahitub
  chosen_korean: 놉으로, 아히둡의 아들 아히멜렉에게 오는
  alternatives_korean:
  - 놉으로, 아히둡의 아들 아히멜렉에게 가는
  - 놉에 있는 아히둡의 아들 아히멜렉에게 오는
  lexicon: HALOT
  rationale: 방향을 나타내는 מקום/אֶל의 기본 의미를 살려 ‘~에게 오는’으로 옮기고, 지명과 인물 목적지를 병렬로 보존했습니다.
theological_decisions:
- issue: 도엑의 지위 표현인 עַל의 해석
  chosen_reading: ‘사울의 신하들 가운데 서 있던’으로 옮겨, 감독/상관 여부를 단정하지 않았습니다.
  alternative_readings:
  - ‘사울의 신하들 위에 배치된/감독한’
  - ‘사울의 신하들을 다스리던’
  rationale: 영어 POB 주석처럼 히브리어 구문은 단순한 배치 위치와 상관적 역할 둘 다 가능하므로, 본문이 단정하지 않는 범위 안에서 번역했습니다.
  doctrine_reference: 본문 비평/해석학적 절제
