  yaml_path: translation/ot/1_samuel/022/023.yaml
  text: Stay with me[a]; do not be afraid, for he who seeks my life seeks your life also[b], for you are under my protection.
  footnotes:
  - marker: a
    text: Or, more formally, 'for he who seeks my life seeks your life.'
    reason: lexical_alternative
  - marker: b
