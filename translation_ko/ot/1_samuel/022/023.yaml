translation:
  language: ko
  text: 나와 함께 머무십시오[a]. 두려워하지 마십시오. 내 생명을 찾는 자는 당신의 생명도 찾기 때문입니다[b]. 당신은 내 보호 아래 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘나와 함께 머무르십시오’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면, ‘내 생명을 찾는 자는 당신의 생명을 찾습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה אִתִּי
  english_pob_choice: Stay with me
  chosen_korean: 나와 함께 머무십시오
  alternatives_korean:
  - 나와 함께 있으십시오
  - 나와 함께 거하십시오
  lexicon: HALOT
  rationale: שְׁבָה는 단순한 ‘앉다’가 아니라 동행하며 계속 함께 있으라는 요청이므로, 현대 한국어에서는 ‘머무르다/있다’가 가장 자연스럽고 문맥에 맞습니다.
- source_word: אַל תִּירָא
  english_pob_choice: do not be afraid
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 말십시오
  lexicon: HALOT
  rationale: 부정 명령의 직접적 의미를 살리면서도 현대 문체에 맞는 정중한 합쇼체로 옮겼습니다.
- source_word: אֲשֶׁר יְבַקֵּשׁ אֶת נַפְשִׁי
  english_pob_choice: he who seeks my life
  chosen_korean: 내 생명을 찾는 자는
  alternatives_korean:
  - 내 목숨을 찾는 자는
  - 내 생명을 노리는 자는
  lexicon: HALOT
  rationale: נפשׁ는 여기서 ‘생명/목숨’의 관용적 의미이므로 ‘영혼’이 아니라 ‘생명’으로 옮겼고, 상대를 일반화하는 יחס절 기능을 ‘~하는 자’로 반영했습니다.
- source_word: מִשְׁמֶרֶת אַתָּה עִמָּדִי
  english_pob_choice: you are under my protection
  chosen_korean: 당신은 내 보호 아래 있습니다
  alternatives_korean:
  - 당신은 내 보살핌 아래 있습니다
  - 당신은 내 경호 아래 있습니다
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת는 단순 소유가 아니라 보호·감호의 상태를 가리키므로, 직역보다 의미가 드러나는 ‘보호 아래’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 מצב/보호 표현
  chosen_reading: ‘보호 아래 있습니다’로 안전과 책임 있는 보호를 함께 드러냅니다.
  alternative_readings:
  - ‘내가 지키고 있습니다’
  - ‘내게 맡겨져 있습니다’
  rationale: 히브리어 מִשְׁמֶרֶת는 단순한 위치 표현이 아니라 다윗의 책임 아래 있는 안전한 상태를 뜻하므로, 과도한 제도적 뉘앙스 없이 보호의 의미를 살렸습니다.
  doctrine_reference: 본문 의미론/어휘 수준
