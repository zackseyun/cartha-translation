lexical_decisions:
- source_word: וַיִּשְׁאַל לּוֹ בַּיהוָה
  english_pob_choice: he inquired of the LORD for him
  chosen_korean: 그는 그를 위해 야훼께 여쭈었으며
  alternatives_korean:
  - 그는 그를 위해 야훼께 물었으며
  - 그는 그를 위해 야훼께 상의하였으며
  lexicon: HALOT
  rationale: שׁאל은 여기서 신에게 묻고 묵시를 구하는 의미이므로, 직설적이면서도 예배적 뉘앙스를 살리는 ‘여쭈다’를 택했습니다. לּוֹ는 ‘그를 위해/그에게 대신하여’로 이해하는 것이 문맥에 가장 자연스럽습니다.
- source_word: בַּיהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 원문에 여호와의 고유명사 יְהוָה가 직접 나오므로, 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: צֵידָה
  english_pob_choice: provisions
  chosen_korean: 양식
  alternatives_korean:
  - 식량
  - 보급품
  - 먹을 것
  lexicon: HALOT
  rationale: צֵידָה는 여행이나 체류를 위한 먹을거리와 보급을 아우를 수 있어, 한국어로는 짧고 자연스럽게 ‘양식’이 문맥에 맞습니다.
- source_word: וְאֵת חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  english_pob_choice: and the sword of Goliath the Philistine
  chosen_korean: 블레셋 사람 골리앗의 칼도
  alternatives_korean:
  - 블레셋 사람 골리앗의 칼을
  - 골리앗, 그 블레셋 사람의 칼도
  lexicon: HALOT
  rationale: 구문상 소유격을 자연스럽게 풀어 ‘골리앗의 칼’로 옮기되, הַפְּלִשְׁתִּי는 ‘블레셋 사람’으로 설명적으로 보존했습니다. 한국어 관용상 ‘칼’이 가장 직접적입니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 언약적 신명인 יְהוָה를 직접 사용하므로, 본문 가시성을 위해 ‘야훼’로 유지했습니다. 이는 일반적 경어 표현보다 원문 식별성을 우선한 선택입니다.
  doctrine_reference: 'Project default: יהוה / YHWH → 야훼'
