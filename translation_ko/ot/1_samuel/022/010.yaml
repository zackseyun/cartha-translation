translation:
  language: ko
  text: 그는 그를 위하여 야훼께 여쭈었으며, 그에게 양식을 주었고, 블레셋 사람 골리앗의 칼도 그에게 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
