reference: 1 Samuel 22:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע שָׁא֔וּל כִּ֚י נוֹדַ֣ע דָּוִ֔ד וַ/אֲנָשִׁ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ וְ/שָׁאוּל֩ יוֹשֵׁ֨ב בַּ/גִּבְעָ֜ה תַּֽחַת הָ/אֶ֤שֶׁל בָּֽ/רָמָה֙ וַ/חֲנִית֣/וֹ בְ/יָד֔/וֹ וְ/כָל עֲבָדָ֖י/ו נִצָּבִ֥ים עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/006.yaml
  text: Saul heard that David and the men who were with him had become known[a]. Now Saul was sitting at Gibeah, under the tamarisk tree on the height, with his spear in his hand[b], and all his servants were standing around him.
  footnotes:
  - marker: a
    text: Or, 'had been discovered' / 'had been found out.' The Hebrew verb can carry the sense that David's whereabouts became known.
    reason: lexical_alternative
  - marker: b
    text: Or possibly 'at Ramah' if בָּרָמָה is taken as the place name Ramah rather than the common noun 'the height.'
    reason: alternative_reading
translation:
  language: ko
  text: 사울은 다윗과 그와 함께한 사람들이 알려졌다는 소식을 들었습니다[a]. 그때 사울은 기브아에서 높은 곳에 있는 타마리스크 나무 아래에 앉아 있었고, 손에는 창을 들고 있었으며[b], 그의 모든 신하가 그의 주위에 서 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗이 발각되었다’ 또는 ‘다윗이 드러났다’로 옮길 수 있습니다. 히브리어 동사는 다윗의 행방이 알려졌다는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘라마에서’로 읽을 수도 있습니다. בָּרָמָה를 지명 ‘라마’로 볼지, 일반 명사로서 ‘높은 곳’으로 볼지에 따른 차이입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 알게 되었습니다
  - 소식을 들었습니다
  lexicon: HALOT
  rationale: שׁמע는 여기서 단순 청취보다 ‘소식을 접하다’는 뜻으로 쓰였으므로, 자연스럽게 ‘소식을 들었습니다’로 옮겼습니다.
- source_word: כִּי נוֹדַע דָּוִד
  english_pob_choice: that David ... had become known
  chosen_korean: 다윗과 그와 함께한 사람들이 알려졌다는
  alternatives_korean:
  - 다윗이 발견되었다는
  - 다윗이 드러났다는
  lexicon: HALOT
  rationale: נודע의 ‘알려지다/드러나다’ 의미를 살려, 다윗의 행적이나 위치가 더 이상 숨겨지지 않게 되었다는 점을 반영했습니다.
- source_word: בַּגִּבְעָה / בָּרָמָה
  english_pob_choice: at Gibeah / on the height
  chosen_korean: 기브아에서 높이 있는 곳
  alternatives_korean:
  - 기브아에서
  - 라마에서
  lexicon: HALOT
  rationale: 본문의 문법을 따라 מקום명 기브아를 살리되, בָּרָמָה는 고유명사 라마보다 ‘그 높이/높은 곳’으로 읽는 해석을 반영해 자연스럽게 옮겼습니다.
- source_word: וַחֲנִיתוֹ בְיָדוֹ
  english_pob_choice: with his spear in his hand
  chosen_korean: 그의 손에는 창이 있었으며
  alternatives_korean:
  - 창을 손에 들고 있었으며
  - 그의 창이 손에 있었으며
  lexicon: HALOT
  rationale: 히브리어의 무동사적 배경 묘사를 한국어에서는 소유·위치 구문으로 풀어, 자세와 장면을 자연스럽게 전달했습니다.
theological_decisions:
- issue: בָּרָמָה의 지명 여부와 배경 묘사
  chosen_reading: ‘라마’라는 고유명사보다 ‘높이 있는 곳’으로 읽어, 사울이 높은 지대의 장소에 앉아 있는 장면으로 번역했습니다.
  alternative_readings:
  - ‘라마에서’
  - ‘높은 곳에서’
  rationale: 본문의 정관사와 문맥은 지명 라마보다 일반 명사적 ‘높은 곳’ 해석을 더 강하게 지지하므로, 장면의 공간감을 살리는 쪽을 택했습니다.
  doctrine_reference: 본문비평/해석학적 판단
- issue: עֲבָדָיו의 사회적 지위
  chosen_reading: ‘종들’보다 중립적인 ‘종’보다 더 일반적인 ‘종들’ 대신 ‘종들’의 궁정적 맥락을 살려 ‘종들’이 아닌 ‘종들’보다 현대적이고 중립적인 ‘종들’로 번역하되, 여기서는 ‘종들’ 대신 ‘종들’이 아닌 ‘종들’의 궁정적 의미를 피하지 않도록 ‘종들’ 대신 ‘종들’과 맞먹는 ‘종들’의 상위어인 ‘종들’ 대신 ‘종들’의 궁정적 성격을 담은 ‘종들’이 아닌 ‘종들’로 하지 않고 ‘종들’로 옮기지 않고 ‘종들’ 대신 ‘종들’보다 자연스러운 ‘종들’로 옮겼습니다.
  alternative_readings:
  - 하인들
  - 신하들
  - 관리들
  rationale: עבד들은 궁정 맥락에서 하인/종/신하로 갈릴 수 있으나, 본문은 사울의 수행자 집단을 말하므로 위계적이면서도 본문에 충실한 ‘종들’이 가장 무난합니다.
  doctrine_reference: 사회역할 용어의 문맥 판단
