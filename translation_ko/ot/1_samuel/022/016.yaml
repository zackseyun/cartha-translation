base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/016.yaml
  text: But the king said[a], “You shall surely die, Ahimelech[b], you and all your father's house.”
  footnotes:
  - marker: a
    text: Or 'You will certainly die' / 'You must die.' The Hebrew uses an infinitive absolute with a finite verb for strong emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''Your father''s house'' refers to your paternal household or family line.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 왕이 말했습니다. “아히멜렉아, 너와 네 아버지의 온 집안[b]은 반드시[a] 죽을 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 부정사 절대형과 동사의 결합으로 ‘반드시 죽을 것이다’라는 선고를 강하게 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네 아버지의 집안’은 문자적으로는 아버지의 집이지만, 여기서는 부계 가문이나 가족 공동체를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이야기했습니다
  - 말하였습니다
  lexicon: HALOT
  rationale: 서사문의 wayyiqtol אמר는 한국어 역사 서술에서 자연스러운 ‘말했습니다’로 옮기는 것이 가장 직접적입니다.
- source_word: מוֹת תָּמוּת
  english_pob_choice: You shall surely die
  chosen_korean: 반드시 죽을 것이다
  alternatives_korean:
  - 너는 분명 죽을 것이다
  - 반드시 죽어야 한다
  lexicon: HALOT
  rationale: 부정사 절대형과 완료/미완료 동사의 결합이 주는 강한 강조를 한국어의 ‘반드시’로 살렸습니다. 다만 משפט(판결) 맥락이므로 명령형보다 선언형이 더 적절합니다.
- source_word: בֵּית אָבִיךָ
  english_pob_choice: your father's house
  chosen_korean: 네 아버지의 온 집안
  alternatives_korean:
  - 네 아버지의 집
  - 네 조상의 집안
  - 네 온 가족
  lexicon: HALOT
  rationale: 직역하면 ‘아버지의 집’이지만, 히브리어 관용구가 가리키는 부계 가문/가족 공동체를 한국어에서 가장 분명하게 드러내기 위해 ‘온 집안’으로 풀었습니다.
theological_decisions:
- issue: 왕의 사형 선고를 한국어에서 어떻게 문장 종결로 드러낼지
  chosen_reading: 선언형으로 옮겨 사법적 확정성을 유지했습니다.
  alternative_readings:
  - ‘너는 반드시 죽어야 한다’처럼 의무형으로 옮김
  - ‘너는 반드시 죽을 것이다’처럼 미래형으로 옮김
  rationale: 원문은 강한 강조를 가진 죽음 선고이며, 이 구절의 초점은 명령 윤리보다 왕의 확정적 판결입니다. 그래서 법정적 어조를 유지하는 선언형을 택했습니다.
  doctrine_reference: 본문의 서사적-재판적 문맥 보존
