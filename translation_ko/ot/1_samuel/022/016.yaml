  to: 그러나 왕이 말했습니다. “아히멜렉아, 너와 네 아버지의 온 집안[b]은 반드시[a] 죽을 것이다.”
  rationale: 대용 표현인 ‘그러하다’를 제거하고, 아히멜렉과 그의 아버지의 온 집안 모두에게 적용되는 죽음의 선고를 하나의 직접적인 문장으로 옮겼습니다. ‘반드시’는 히브리어의 강조를 보존하고, ‘그러나’는 문맥상 왕의 응답이 앞선 상황과 대조되는 흐름을 자연스럽게 반영합니다. 각 주석 표지는 해당 어구 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:27:41Z'
