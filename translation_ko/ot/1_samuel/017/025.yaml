  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אִ֣ישׁ יִשְׂרָאֵ֗ל הַ/רְּאִיתֶם֙ הָ/אִ֤ישׁ הָֽ/עֹלֶה֙ הַ/זֶּ֔ה כִּ֛י לְ/חָרֵ֥ף אֶת יִשְׂרָאֵ֖ל עֹלֶ֑ה וְֽ֠/הָיָה הָ/אִ֨ישׁ אֲשֶׁר יַכֶּ֜/נּוּ יַעְשְׁרֶ֥/נּוּ הַ/מֶּ֣לֶךְ עֹ֣שֶׁר גָּד֗וֹל וְ/אֶת בִּתּ/וֹ֙ יִתֶּן ל֔/וֹ וְ/אֵת֙ בֵּ֣ית אָבִ֔י/ו יַעֲשֶׂ֥ה חָפְשִׁ֖י בְּ/יִשְׂרָאֵֽל׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/025.yaml
  text: And the men of Israel said[a], “Have you seen this man who is coming up? Surely he is coming up to defy Israel. And it shall be that the man who strikes him down, the king will enrich him with great riches, and will give him his daughter, and will make his father’s house free in Israel.”
  footnotes:
  - marker: a
    text: Or “will exempt his father’s house in Israel,” likely meaning freedom from taxes or other royal service obligations.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 사람들이 말했습니다[a]. 「저 올라오는 사람을 보았습니까? 그는 참으로 이스라엘을 모욕하러 올라옵니다. 그를 쳐서 쓰러뜨리는 사람에게는 왕이 큰 부를 주고, 그의 딸을 주며, 그의 아버지 집을 이스라엘에서 자유롭게 해 주실 것입니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 아버지 집을 이스라엘에서 면제해 주실 것입니다.” 아마 세금이나 다른 왕실 의무에서의 면제를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  english_pob_choice: the men of Israel
  chosen_korean: 이스라엘 사람들이
  alternatives_korean:
  - 이스라엘의 한 사람이
  - 이스라엘 사람 한 명이
  lexicon: HALOT
  rationale: 히브리어는 형태상 단수지만 문맥상 집합적으로 말하는 표현이므로, 한국어에서는 자연스러운 복수 주어로 옮겼습니다.
- source_word: הָאִישׁ הָעֹלֶה הַזֶּה
  english_pob_choice: this man who is coming up
  chosen_korean: 저 올라오는 사람
  alternatives_korean:
  - 이 올라오는 사람
  - 이 올라오는 그 사람
  lexicon: HALOT
  rationale: 진행 중인 올라옴의 분사 의미를 살리면서, 반복을 줄여 구어적 대화체를 자연스럽게 만들었습니다.
- source_word: לְחָרֵף אֶת יִשְׂרָאֵל
  english_pob_choice: to defy Israel
  chosen_korean: 이스라엘을 모욕하러
  alternatives_korean:
  - 이스라엘을 조롱하러
  - 이스라엘을 욕되게 하러
  lexicon: HALOT
  rationale: חרף는 단순한 도발보다 공개적 수치와 조롱의 뉘앙스가 있어, ‘모욕하다’로 옮겨 적대적 공적 조롱을 드러냈습니다.
- source_word: יַעְשְׁרֶנּוּ ... עֹשֶׁר גָּדוֹל
  english_pob_choice: will enrich him with great riches
  chosen_korean: 큰 부를 주고
  alternatives_korean:
  - 많은 재물을 주고
  - 큰 재산으로 부유하게 하고
  lexicon: HALOT
  rationale: 히브리어의 ‘부유하게 하다/부를 주다’와 명사 ‘큰 부’를 함께 살리되, 한국어에서는 중복을 줄여 자연스럽게 표현했습니다.
- source_word: וְאֵת בִּתּוֹ יִתֶּן לוֹ
  english_pob_choice: will give him his daughter
  chosen_korean: 그의 딸을 주며
  alternatives_korean:
  - 그에게 그의 딸을 주며
  - 딸을 그에게 주며
  lexicon: HALOT
  rationale: 보상 목록의 병렬 구조를 살리기 위해 ‘주며’로 연결했고, 소유 관계는 ‘그의 딸’로 분명히 했습니다.
- source_word: וְאֵת בֵּית אָבִיו יַעֲשֶׂה חָפְשִׁי בְּיִשְׂרָאֵל
  english_pob_choice: will make his father’s house free in Israel
  chosen_korean: 그의 아버지 집을 이스라엘에서 자유롭게 해 주실 것입니다
  alternatives_korean:
  - 그의 아버지 집을 이스라엘에서 면제해 주실 것입니다
  - 그의 아버지 집을 이스라엘에서 자유롭게 하실 것입니다
  lexicon: HALOT
  rationale: חָפְשִׁי는 왕에 대한 의무 면제까지 포함할 수 있으나, 본문은 ‘free’의 직접 의미를 유지하므로 본문에는 ‘자유롭게’로 두고 행정적 함의는 각주로 처리했습니다.
theological_decisions:
- issue: 왕의 보상 약속과 ‘자유롭게 함’의 의미
  chosen_reading: 본문은 군공 보상으로서 금전·혼인·가문 면제를 병렬로 제시하며, 마지막 항목은 단순한 개인 자유라기보다 왕의 부담이나 의무에서의 해방을 포함할 수 있습니다.
  alternative_readings:
  - 세금 면제
  - 왕실 복무 면제
  - 가문의 사회적 해방
  rationale: 히브리어 חָפְשִׁי는 문맥상 행정적 면제를 가리킬 가능성이 크지만, 본문 자체의 직접 의미를 보존하기 위해 본문은 중립적으로 두고 각주에서 가능성을 밝혔습니다.
  doctrine_reference: 본문 주해/역사적 문맥
- issue: אִישׁ יִשְׂרָאֵל의 집합적 용법
  chosen_reading: 단수 형태를 한국어 복수로 옮겨 발화 집단을 자연스럽게 드러냈습니다.
  alternative_readings:
  - 직역하여 ‘이스라엘 사람 한 명’
  - 단수 유지
  rationale: 대화 참여자가 여러 명인 문맥에서 히브리어 단수 집합 표현을 한국어 단수로 유지하면 오해를 낳을 수 있어, 청중 이해를 우선했습니다.
  doctrine_reference: 담화/문법
