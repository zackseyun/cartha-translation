source:
  edition: WLC
  text: וְ/יֵֽדְעוּ֙ כָּל הַ/קָּהָ֣ל הַ/זֶּ֔ה כִּֽי לֹ֛א בְּ/חֶ֥רֶב וּ/בַ/חֲנִ֖ית יְהוֹשִׁ֣יעַ יְהוָ֑ה כִּ֤י לַֽ/יהוָה֙ הַ/מִּלְחָמָ֔ה וְ/נָתַ֥ן אֶתְ/כֶ֖ם בְּ/יָדֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/047.yaml
  text: and all this assembly will know that Yahweh does not save by sword or by spear[a]; for the battle belongs to Yahweh[c][b], and he will give you into our hand.
  footnotes:
  - marker: a
    text: Or 'does not deliver by sword and spear.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the battle is the LORD's.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'into our hand'; the idiom means 'into our power' or 'over to us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 회중은 야훼께서 칼과 창으로[a] 구원하지 않으신다는 것을 알게 될 것입니다. 전쟁은 야훼의 것이기 때문입니다.[b] 그분은 여러분을 우리 손에[c] 넘기실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘칼과 창으로 건지지 않으신다’.
    reason: alternative_reading
  - marker: b
    text: '히브리어: ‘전쟁은 야훼의 것이다.’'
    reason: lexical_alternative
  - marker: c
    text: 히브리어 관용구 ‘우리 손에’는 ‘우리의 권세 아래로’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַקָּהָל הַזֶּה
  english_pob_choice: all this assembly
  chosen_korean: 이 온 회중
  alternatives_korean:
  - 이 모든 회중
  - 이 온 집회
  - 이 온 모임
  lexicon: HALOT
  rationale: קהל은 여기서 전투 현장에 모인 공동체를 가리키므로, 교회 제도보다 집합체를 살리는 ‘회중’이 적절합니다. ‘이 온’은 all this의 포괄성을 자연스럽게 담습니다.
- source_word: לֹא בְּחֶרֶב וּבַחֲנִית
  english_pob_choice: does not save by sword or by spear
  chosen_korean: 칼이나 창으로 구원하지 않으신다는 것
  alternatives_korean:
  - 칼과 창으로 구원하지 않으신다는 것
  - 칼이나 창으로 건지지 않으신다는 것
  - 칼과 창으로 구원하지 않으신다는 것
  lexicon: HALOT
  rationale: 부정된 수단 표현은 한국어에서 ‘~으로 …하지 않다’가 자연스럽고, ‘구원하다’가 יושיע의 더 넓은 의미를 살립니다. ‘이나’는 나열된 무기의 두 항을 매끄럽게 묶습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 고유 신명 יהוה는 POB 원칙에 따라 ‘야훼’로 옮겨, 제목 대체어가 아니라 언약적 고유 이름임을 드러냅니다.
- source_word: כִּי לַיְהוָה הַמִּלְחָמָה
  english_pob_choice: for the battle belongs to Yahweh
  chosen_korean: 전쟁은 야훼의 것이기 때문입니다
  alternatives_korean:
  - 전쟁은 야훼께 속해 있기 때문입니다
  - 전투는 야훼의 것이기 때문입니다
  - 전쟁은 야훼께 속한 것이기 때문입니다
  lexicon: HALOT
  rationale: לְ + 소유 표지는 한국어의 ‘~의 것’으로 가장 직역성이 높습니다. 문맥상 단일 결투를 넘어 공동체적 충돌의 성격도 있어 ‘전쟁’이 본문 어감을 잘 살립니다.
- source_word: בְּיָדֵנוּ
  english_pob_choice: into our hand
  chosen_korean: 우리 손에 넘기실 것입니다
  alternatives_korean:
  - 우리 손에 주실 것입니다
  - 우리 손 안에 넘기실 것입니다
  - 우리 권세 아래로 넘기실 것입니다
  lexicon: HALOT
  rationale: ‘손에’는 히브리 관용구를 보존하면서, 한국어에서는 결과를 분명히 하는 ‘넘기다’가 ‘give into the hand of’의 함의를 잘 전달합니다. 단수 ‘손’도 원문 관용을 따라 유지했습니다.
theological_decisions:
- issue: 야훼의 전쟁 주권 선언
  chosen_reading: 전쟁은 야훼의 것이기 때문입니다
  alternative_readings:
  - 전쟁은 야훼께 속해 있기 때문입니다
  - 전쟁은 야훼께 달려 있기 때문입니다
  rationale: 본문의 핵심은 인간 무기보다 야훼의 주권에 있습니다. ‘야훼의 것’은 소유이자 통치의 선언으로, 본문의 신학적 강조를 가장 직접적으로 드러냅니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
