- from: 이 온 회중은 야훼께서 칼이나 창으로 구원하지 않으신다는 것을 알게 될 것입니다. 전쟁은 야훼의 것이기 때문입니다. 그분은 여러분을 우리 손에 넘기실 것입니다.[a][b][c]
  to: 이 모든 회중은 야훼께서 칼과 창으로[a] 구원하지 않으신다는 것을 알게 될 것입니다. 전쟁은 야훼의 것이기 때문입니다.[b] 그분은 여러분을 우리 손에[c] 넘기실 것입니다.
  rationale: 본문 의미는 유지하면서 현대적 표현으로 ‘이 온’을 ‘이 모든’으로 다듬고, 히브리어의 병렬 접속을 ‘칼과 창’으로 반영했습니다. 또한 세 각주를 해당 원어 어구 바로 뒤에 배치하여 각주 연결을 명확히 했습니다.
