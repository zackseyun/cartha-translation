base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/057.yaml
  text: When David returned from striking down the Philistine[a], Abner took him and brought him before Saul, with the Philistine’s head in his hand.
  footnotes:
  - marker: a
    text: Or, more formally, 'and the Philistine’s head was in his hand.' The Hebrew uses a verbless clause that can be rendered either as a circumstantial phrase or as a more literal coordinate clause.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 블레셋 사람을 쳐서 쓰러뜨리고 돌아올 때에, 아브넬은 그를 데리고 사울 앞에 나아갔습니다. 블레셋 사람의 머리는 다윗의 손에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘그리고 블레셋 사람의 머리가 그의 손에 있었습니다’라고 할 수 있습니다. 히브리어는 동사가 없는 절이며, 상황을 나타내는 표현으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְשׁוּב
  english_pob_choice: When David returned
  chosen_korean: 다윗이 ... 돌아올 때에
  alternatives_korean:
  - 그리고 ... 돌아올 때
  - '... 돌아왔을 때'
  lexicon: HALOT
  rationale: ‘וּכְשׁוּב’은 זמן 부사절을 여는 표현이므로, 한국어에서는 자연스러운 ‘... 돌아올 때에’로 옮겨 사건의 시간적 순서를 살렸습니다.
- source_word: מֵהַכּוֹת
  english_pob_choice: from striking down
  chosen_korean: 쳐서 쓰러뜨리고
  alternatives_korean:
  - 죽이고
  - 이기고
  lexicon: HALOT
  rationale: 히브리어 ‘נכה’의 구체적인 타격/치기 뉘앙스를 살리면서, 문맥상 결과인 패배를 드러내기 위해 ‘쳐서 쓰러뜨리고’로 옮겼습니다.
- source_word: וְרֹאשׁ הַפְּלִשְׁתִּי בְּיָדוֹ
  english_pob_choice: with the Philistine’s head in his hand
  chosen_korean: 블레셋 사람의 머리는 그의 손에 있었습니다
  alternatives_korean:
  - 블레셋 사람의 머리를 손에 들고 있었습니다
  - 블레셋 사람의 머리가 그의 손에 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 무동사 절을 한국어에서는 서술형으로 자연스럽게 풀어, 본문이 그리는 생생한 상태를 유지했습니다.
- source_word: הַפְּלִשְׁתִּי
  english_pob_choice: the Philistine
  chosen_korean: 블레셋 사람
  alternatives_korean:
  - 그 블레셋 사람
  - 블레셋 사람(골리앗)
  lexicon: HALOT
  rationale: 원문이 고유명사 대신 관사 있는 명사구를 사용하므로, 문맥상 골리앗이라도 본문 표현을 따라 ‘블레셋 사람’으로 유지했습니다.
