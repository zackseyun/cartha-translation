  naturalness: ‘다윗이 블레셋 사람을 쳐서 쓰러뜨리고 돌아올 때에’와 ‘사울 앞에’는 자연스럽고 현대 한국어 성경 문체에 맞습니다. ‘아브넬은 그를 데리고 사울 앞에 나아갔습니다’는 원문의 두 동사(취하다, 데려오다)를 한국어에서 자연스럽게 연결합니다.
  terminology: ‘블레셋 사람’, ‘아브넬’, ‘사울’, ‘다윗’은 적절합니다. 원문이 고유명사 골리앗 대신 ‘그 블레셋 사람’을 사용한 점도 유지했습니다.
