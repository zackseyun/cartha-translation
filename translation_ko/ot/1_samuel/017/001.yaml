id: 1SA.17.1
reference: 1 Samuel 17:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּאַסְפ֨וּ פְלִשְׁתִּ֤ים אֶת מַֽחֲנֵי/הֶם֙ לַ/מִּלְחָמָ֔ה וַ/יֵּאָ֣סְפ֔וּ שֹׂכֹ֖ה אֲשֶׁ֣ר לִ/יהוּדָ֑ה וַֽ/יַּחֲנ֛וּ בֵּין שׂוֹכֹ֥ה וּ/בֵין עֲזֵקָ֖ה בְּ/אֶ֥פֶס דַּמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/001.yaml
  text: Now the Philistines gathered their armies for battle[a], and they assembled at Socoh, which belongs to Judah, and camped between Socoh and Azekah[b], at Ephes-dammim.
  footnotes:
  - marker: a
    text: Or 'their forces' for 'their camps'; the Hebrew term can refer to military camps or armies.
    reason: lexical_alternative
  - marker: b
    text: Socoh was a town in the territory of Judah.
    reason: cultural_note
translation:
  language: ko
  text: 그때 블레셋 사람들이 전쟁을 위해 자기 진영을 모으고, 유다에 속한 소고에 모여, 소고와 아세가 사이, 에베스-담밈에 진을 쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 소고는 유다 지역에 속한 성읍입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּאַסְפוּ ... אֶת מַחֲנֵיהֶם
  english_pob_choice: gathered their armies / their camps
  chosen_korean: 자기 진영을 모으고
  alternatives_korean:
  - 군대를 모으고
  - 부대를 집결시키고
  lexicon: HALOT
  rationale: מַחֲנֶה는 여기서 군사적 '진영/야영지'의 의미가 살아 있으며, POB의 'their camps'를 따라 한국어도 군사 집결의 이미지를 보존했습니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: for battle
  chosen_korean: 전쟁을 위해
  alternatives_korean:
  - 전투를 위해
  - 싸우기 위해
  lexicon: HALOT
  rationale: מִלְחָמָה는 '전쟁/전투'를 뜻하지만, 문맥상 군대 이동의 목적을 드러내므로 자연스럽게 '전쟁을 위해'로 옮겼습니다.
- source_word: שֹׂכֹה ... עֲזֵקָה ... בְּאֶפֶס דַּמִּים
  english_pob_choice: Socoh ... Azekah ... Ephes-dammim
  chosen_korean: 소고 ... 아세가 ... 에베스-담밈
  alternatives_korean:
  - 소코 ... 아제카 ... 에베스 담밈
  lexicon: HALOT
  rationale: 지명은 현대 한국어 외래어 표기와 국내 성경 관용을 고려해 음역했고, פְּלִשְׁתִּים 관련 지명도 본문 흐름에 맞게 일관되게 처리했습니다.
- source_word: אֲשֶׁר לִיהוּדָה
  english_pob_choice: which belongs to Judah
  chosen_korean: 유다에 속한
  alternatives_korean:
  - 유다에 있는
  - 유다의
  lexicon: HALOT
  rationale: לְ + 민족/지명 구성은 단순한 위치보다 소속·귀속을 나타내므로, POB의 'belongs to Judah'를 따라 '유다에 속한'으로 옮겼습니다.
theological_decisions:
- issue: בין ... וּבֵין의 지리적 대비와 전개
  chosen_reading: 두 지명 사이에 진을 친 군사 배치로 읽고, 서술을 평이하게 유지했습니다.
  alternative_readings:
  - 보다 설명적으로 '맞은편에'로 옮길 수 있음
  - '''사이사이''처럼 풀어 쓸 수 있음'
  rationale: 본문은 신학적 해설보다 전장 배치를 보고하는 역사서 서술이므로, 공간 관계를 과장하지 않고 직역에 가깝게 보존했습니다.
  doctrine_reference: 역사서 본문 번역 원칙
- issue: 지명 주석의 범위
  chosen_reading: 소고를 유다 소속으로 표시하는 정도로만 주석화했습니다.
  alternative_readings:
  - 지명 식별을 더 길게 설명할 수 있음
  - 주석 없이 본문만 둘 수 있음
  rationale: POB의 문화 주석을 한국어에서도 최소한으로 반영해 독자가 본문의 지리 정보를 바로 이해하도록 했습니다.
  doctrine_reference: 본문-주석 분리 원칙
