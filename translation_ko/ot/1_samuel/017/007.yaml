  text: ו/חץ חֲנִית֗/וֹ כִּ/מְנוֹר֙ אֹֽרְגִ֔ים וְ/לַהֶ֣בֶת חֲנִית֔/וֹ שֵׁשׁ מֵא֥וֹת שְׁקָלִ֖ים בַּרְזֶ֑ל וְ/נֹשֵׂ֥א הַ/צִּנָּ֖ה הֹלֵ֥ךְ לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/007.yaml
  text: The shaft of his spear was like a weaver’s beam[a], and the iron head of his spear weighed six hundred shekels; and the bearer of the shield went before him.
  footnotes:
  - marker: a
    text: Or 'the large shield'; the Hebrew term can denote a full-sized body shield rather than a smaller buckler.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 창자루는 베틀채 같았고, 그 창 머리의 철은 육백 세겔이었으며, 방패를 든 자가 그 앞에서 걸어갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘방패’는 큰 몸방패를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חץ / כמנור ארגים
  english_pob_choice: The shaft of his spear was like a weaver’s beam
  chosen_korean: “그 창자루는 베틀채 같았고”
  alternatives_korean:
  - 그 창의 자루는 베틀채 같았고
  - 그 창대는 베틀채 같았고
  lexicon: HALOT
  rationale: English POB의 shaft/beam 이미지를 한국어에서 가장 자연스럽게 살리기 위해 ‘창자루’와 ‘베틀채’를 사용했습니다. ‘자루’는 무기의 긴 몸통을, ‘베틀채’는 직조 도구의 크고 굵은 막대를 전달합니다.
- source_word: להבת חניתו
  english_pob_choice: the iron head of his spear
  chosen_korean: “그 창 머리의 철”
  alternatives_korean:
  - 그 창 끝의 철
  - 그 창날의 철
  lexicon: HALOT
  rationale: להבת는 문자적으로 칼날/날 같은 뜻을 띨 수 있으나, 여기서는 창의 금속 타격부를 가리키므로 ‘창 머리’로 옮겼습니다. ‘철’은 뒤의 ברזל을 반영해 재료를 드러냅니다.
- source_word: שש מאות שקלים ברזל
  english_pob_choice: weighed six hundred shekels
  chosen_korean: “육백 세겔이었으며”
  alternatives_korean:
  - 무게가 육백 세겔이었으며
  - 육백 세겔의 무게였으며
  lexicon: HALOT
  rationale: 히브리어는 ‘육백 세겔의 철’이라는 생략 구조이므로, 한국어에서는 의미를 풀어 ‘무게가/이었으며’로 자연스럽게 표현했습니다. 본문에서 철의 무게를 말하는 것으로 이해되도록 했습니다.
- source_word: נשא הצנה
  english_pob_choice: the bearer of the shield
  chosen_korean: “방패를 든 자가”
  alternatives_korean:
  - 방패를 메는 자가
  - 방패를 지닌 자가
  lexicon: HALOT
  rationale: 직역형 ‘방패 운반자’보다 한국어에서는 전투 상황의 수행자를 자연스럽게 보여 주는 ‘방패를 든 자’가 더 읽히며, POB의 의미도 유지합니다.
