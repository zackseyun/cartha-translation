  text: Now David was the youngest[a], and the three oldest had gone after Saul.
  footnotes:
  - marker: a
    text: Or 'And David was the youngest, and the three oldest followed Saul.' The Hebrew conjunction may be rendered simply 'and,' and the verb may be translated without the English pluperfect.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 다윗은 가장 어렸고, 세 형은 사울을 따라갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그리고 다윗은 가장 어렸고, 세 형은 사울을 따랐습니다.' 히브리어 접속사는 단순히 '그리고'로도 옮길 수 있고, 동사는 영어의 과거완료 없이 번역할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/דָוִד הוּא
  english_pob_choice: Now David was
  chosen_korean: 이제 다윗은
  alternatives_korean:
  - 그리고 다윗은
  - 그때 다윗은
  lexicon: WLC / HALOT
  rationale: 히브리어의 ו는 서술 전환을 알리는 용법이므로, 한국어에서는 문맥 연결을 자연스럽게 드러내는 '이제'로 옮겼습니다. 독립 대명사 הוּא의 강조는 한국어 어순상 주어 표지로 충분히 반영됩니다.
- source_word: הַ/קָּטָן
  english_pob_choice: the youngest
  chosen_korean: 가장 어렸고
  alternatives_korean:
  - 막내였고
  - 가장 작은 사람이었고
  lexicon: HALOT
  rationale: 형제 비교 맥락에서 קָטָן은 연령상 '어린/막내'의 뜻이므로, '가장 어렸고'로 옮겨 자연스럽고 정확한 의미를 살렸습니다.
- source_word: וּ/שְׁלֹשָׁה הַ/גְּדֹלִים
  english_pob_choice: and the three oldest
  chosen_korean: 세 형은
  alternatives_korean:
  - 그리고 세 형은
  - 세 형이
  lexicon: HALOT
  rationale: 문맥상 이미 언급된 다윗의 형제들을 가리키므로 반복을 줄여도 의미가 유지됩니다. '큰 형들'보다 '세 형'이 한국어에서 형제 서열을 가장 자연스럽게 드러냅니다.
- source_word: הָלְכ֖וּ אַחֲרֵ֥י שָׁאֽוּל
  english_pob_choice: had followed Saul
  chosen_korean: 사울을 따라갔습니다
  alternatives_korean:
  - 사울 뒤를 따랐습니다
  - 사울을 따라 나섰습니다
  lexicon: HALOT
  rationale: הלך אחרי는 단순한 위치 이동보다 '누구의 편에 서서 따르다'는 의미를 담으므로, '따라갔습니다'로 옮겼습니다. 영어 POB의 과거완료 뉘앙스는 한국어에서는 자연스럽게 과거 서술로 처리했습니다.
