- from: 사울이 다윗에게 말했습니다. “당신은 이 블레셋 사람에게 맞서 그와 싸우러 갈 수 없습니다. 당신은 아직 젊은 사람이고, 그는 어려서부터 전쟁 사람이었습니다.”[a][b]
  to: 사울이 다윗에게 말했습니다. “당신은 이 블레셋 사람에게 맞서 그와 싸우러 갈 수 없습니다.[a] 당신은 젊은이[b]이고, 그는 어릴 때부터 전사였습니다.”
  rationale: 군사 관용구를 자연스러운 현대 한국어인 ‘전사’로 교정하고, 나아르의 폭넓은 연령 범위를 ‘젊은이’와 주석으로 보존했습니다. 주석 표지를 관련 어휘와 절에 각각 연결했으며, 원문에 없는 ‘아직’은 제거했습니다.
