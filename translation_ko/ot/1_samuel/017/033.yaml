reference: 1 Samuel 17:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל דָּוִ֗ד לֹ֤א תוּכַל֙ לָ/לֶ֨כֶת֙ אֶל הַ/פְּלִשְׁתִּ֣י הַ/זֶּ֔ה לְ/הִלָּחֵ֖ם עִמּ֑/וֹ כִּֽי נַ֣עַר אַ֔תָּה וְ/ה֛וּא אִ֥ישׁ מִלְחָמָ֖ה מִ/נְּעֻרָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/033.yaml
  text: Saul said to David[a], “You are not able to go against this Philistine to fight with him, because you are a youth[b], and he has been a man of war from his youth.”
  footnotes:
  - marker: a
    text: Or 'You cannot go out against this Philistine to fight him.'
    reason: lexical_alternative
  - marker: b
    text: '''Young man'' translates Hebrew naʿar, which can also mean ''youth'' or, in some contexts, ''boy.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 다윗에게 말했습니다. “당신은 이 블레셋 사람에게 맞서 그와 싸우러 갈 수 없습니다. 당신은 아직 젊은 사람이고, 그는 어려서부터 전쟁 사람이었습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신은 이 블레셋 사람에게 나아가 그와 싸울 수 없습니다.”
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘젊은 사람’은 히브리어 naʿar를 옮긴 말로, 문맥에 따라 ‘젊은이’ 또는 ‘소년’을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל
  english_pob_choice: You are not able
  chosen_korean: 갈 수 없습니다
  alternatives_korean:
  - 갈 수 없습니까
  - 갈 수 없어요
  lexicon: HALOT
  rationale: יכל의 불가능 의미를 살려 능력의 부재를 나타냈습니다. 한국어에서는 앞의 목적어 구조와 함께 “갈 수 없습니다”가 가장 자연스럽고 직역에 치우치지 않습니다.
- source_word: לָלֶכֶת אֶל
  english_pob_choice: to go against
  chosen_korean: 맞서 … 가다
  alternatives_korean:
  - 가서
  - 맞서 가다
  lexicon: HALOT
  rationale: 전투 맥락의 אֶל은 단순한 이동이 아니라 적을 향해 대항하는 움직임이므로, “맞서”로 적대적 방향성을 드러냈습니다.
- source_word: נַעַר
  english_pob_choice: a youth
  chosen_korean: 젊은 사람
  alternatives_korean:
  - 젊은이
  - 소년
  - 청년
  lexicon: HALOT
  rationale: נַעַר의 연령 범위가 넓어 문맥상 너무 어린 “소년”보다 덜 협소하고, “청년”보다 다소 중립적인 “젊은 사람”이 더 안전합니다. English POB의 ‘youth’도 같은 폭을 반영합니다.
- source_word: אִישׁ מִלְחָמָה
  english_pob_choice: a man of war
  chosen_korean: 전쟁 사람이었습니다
  alternatives_korean:
  - 전사의 사람이었습니다
  - 전쟁의 사람입니다
  - 용사였습니다
  lexicon: HALOT
  rationale: 관용구의 생경함을 살리기 위해 ‘전쟁 사람’으로 옮겨 “전쟁에 익숙한 사람”이라는 강한 이미지와 대비를 유지했습니다. 다만 한국어 어법을 고려해 서술은 자연스럽게 정리했습니다.
- source_word: מִנְּעֻרָיו
  english_pob_choice: from his youth
  chosen_korean: 어려서부터
  alternatives_korean:
  - 젊었을 때부터
  - 청년기부터
  lexicon: HALOT
  rationale: 지속 기간의 시작을 나타내는 מִן의 의미를 한국어 관용인 “어려서부터”로 풀어, 반복되는 ‘젊음’ 대비를 분명히 했습니다.
theological_decisions:
- issue: 사울의 발화 체계와 직접 인용문 안의 호칭
  chosen_reading: 서술은 평서형으로 “말했습니다”를 쓰고, 직접 인용은 사울의 평가 발언을 그대로 전달했습니다.
  alternative_readings:
  - “말하였습니다”
  - 인용문을 간접화하여 풀어쓰기
  rationale: 원문의 화행을 보존하면서 현대 한국어에서 읽기 자연스럽게 유지했습니다. 인용문 내부는 평가적 진술이므로 별도의 완곡화 없이 직설을 살렸습니다.
  doctrine_reference: 본문 의미 보존과 서술체 일관성
- issue: ‘블레셋 사람’의 민족/정체성 표기
  chosen_reading: 이 블레셋 사람
  alternative_readings:
  - 이 블레셋인
  - 이 블레셋 사람
  rationale: 히브리어의 민족 표지를 한국어로 자연스럽게 옮기되, 경멸이나 일반화가 과도해지지 않도록 중립적 표기를 유지했습니다.
  doctrine_reference: 역사서 서술의 인물 식별
