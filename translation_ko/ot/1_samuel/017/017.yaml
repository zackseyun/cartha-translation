reference: 1 Samuel 17:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִשַׁ֜י לְ/דָוִ֣ד בְּנ֗/וֹ קַח נָ֤א לְ/אַחֶ֨י/ךָ֙ אֵיפַ֤ת הַ/קָּלִיא֙ הַ/זֶּ֔ה וַ/עֲשָׂרָ֥ה לֶ֖חֶם הַ/זֶּ֑ה וְ/הָרֵ֥ץ הַֽ/מַּחֲנֶ֖ה לְ/אַחֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/017.yaml
  text: And Jesse said to David his son[a], “Please take to your brothers this ephah of roasted grain and these ten loaves[b], and run to the camp to your brothers.”
  footnotes:
  - marker: a
    text: An ephah was an ancient dry measure, roughly 22 liters (about 5.8 gallons).
    reason: cultural_note
  - marker: b
    text: Or “parched grain.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이에새가 그의 아들 다윗에게 말했습니다. “청하건대 이 볶은 곡식 한 에바와 이 빵 열 개를 네 형들에게 가지고 가고, 진영으로 달려가 네 형들에게 전해 주십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에바는 고대의 건량 단위로, 대략 22리터(약 5.8갤런)입니다.
    reason: cultural_note
  - marker: b
    text: 또는 “볶은 곡식”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח נָא
  english_pob_choice: Please take
  chosen_korean: 청하건대 … 가지고 가고
  alternatives_korean:
  - 가지고 가십시오
  - 제발 가져가십시오
  lexicon: HALOT
  rationale: נָא가 붙은 명령의 완곡함과 긴급함을 한국어에서 자연스럽게 살리기 위해 직접적 명령보다 청유형에 가까운 표현을 택했습니다.
- source_word: אֵיפַת
  english_pob_choice: this ephah of
  chosen_korean: 볶은 곡식 한 에바
  alternatives_korean:
  - 한 에바의 볶은 곡식
  - 약 한 에바의 볶은 곡식
  lexicon: HALOT
  rationale: 에바는 고대 건량 단위이므로 음역을 유지했고, 수량의 구체성을 보존하기 위해 ‘한 에바’로 옮겼습니다.
- source_word: הַקָּלִיא
  english_pob_choice: roasted grain
  chosen_korean: 볶은 곡식
  alternatives_korean:
  - 볶은 낟알
  - 볶은 곡식(파치드 곡식)
  lexicon: HALOT
  rationale: 곡식을 볶아 준비한 것을 가리키므로 현대 한국어에서 이해하기 쉬운 ‘볶은 곡식’이 원문의 뜻을 가장 분명하게 전달합니다.
- source_word: וַעֲשָׂרָה לֶחֶם
  english_pob_choice: these ten loaves
  chosen_korean: 이 빵 열 개
  alternatives_korean:
  - 이 떡 열 개
  - 빵 열 덩이
  lexicon: HALOT
  rationale: 수량이 붙은 לֶחֶם은 여기서 공급용 빵 조각/덩이를 가리키므로, 현대 독자에게 자연스러운 ‘빵 열 개’로 옮겼습니다.
- source_word: וְהָרֵץ
  english_pob_choice: and run
  chosen_korean: 진영으로 달려가
  alternatives_korean:
  - 달려가고
  - 급히 가고
  lexicon: HALOT
  rationale: 히필 명령형의 급박함을 살려 단순한 ‘가다’보다 ‘달려가다’로 옮겼고, 목적지를 문맥에 맞게 앞에 두었습니다.
