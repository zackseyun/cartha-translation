- from: 이에새가 그의 아들 다윗에게 말했습니다. “청하건대 이 볶은 곡식 한 에바와 이 빵 열 개를 네 형들에게 가지고 가고, 진영으로 달려가 네 형들에게 전해 주십시오.”[a][b]
  to: 이새가 자기 아들 다윗에게 말했습니다. “어서 이 볶은 곡식[b] 한 에바[a]와 이 빵 열 개를 네 형들에게 가져다주려고 진영으로 달려가십시오.”
  rationale: 이새의 이름을 바로잡고, 나(נָא)의 완곡하고 재촉하는 어감을 현대적인 '어서'로 옮겼습니다. 음식물을 형들에게 가져가는 행위와 진영으로 달려가는 명령의 관계를 '가져다주려고'로 자연스럽게 연결했습니다. 각주 표지를 해당 단어에 붙이고, 중복된 각주 b를 실질적인 어휘 대안으로 수정했습니다.
