  terminology: '''에바'', ''볶은 곡식'', ''빵 열 개'', ''진영''은 적절합니다. 각주 b는 본문의 표현과 동일한 대안을 제시하고 있어 실제 어휘 대안으로 고쳐야 하며, 각주 표지도 해당 어휘 바로 뒤에 배치해야 합니다.'
