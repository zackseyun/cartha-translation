source:
  edition: WLC
  text: וַ/יְּשָּֽׁמְעוּ֙ הַ/דְּבָרִ֔ים אֲשֶׁ֖ר דִּבֶּ֣ר דָּוִ֑ד וַ/יַּגִּ֥דוּ לִ/פְנֵֽי שָׁא֖וּל וַ/יִּקָּחֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/031.yaml
  text: When the words that David had spoken were heard[a], they reported them before Saul, and he sent for him.
  footnotes:
  - marker: a
    text: Or, more literally, 'and he took him.' The Hebrew likely means Saul had David brought before him.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 말한 말들이 들리자, 사람들이 그것을 사울의 앞에 알렸고, 그는 그를 데려오게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '그리고 그가 그를 데려갔다'에 가까울 수 있으나, 문맥상 '사울이 다윗을 자기 앞으로 데려오게 했다'는 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְּשָּׁמְעוּ הַדְּבָרִים
  english_pob_choice: the words ... were heard
  chosen_korean: 말들이 들리자
  alternatives_korean:
  - 사람들이 다윗의 말을 들었을 때
  - 다윗이 한 말이 들리자
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '말들이 들렸다'는 수동적 상황을 보이므로, 주어를 불필요하게 보충하지 않으면서 자연스러운 한국어로 옮겼습니다.
- source_word: וַיַּגִּדוּ לִפְנֵי שָׁאוּל
  english_pob_choice: they reported them before Saul
  chosen_korean: 사울의 앞에 알렸고
  alternatives_korean:
  - 사울에게 보고했고
  - 사울 앞에서 전했고
  lexicon: HALOT
  rationale: נגד는 단순한 전달보다 '알리다/보고하다'의 의미가 강하며, לִפְנֵי שָׁאוּל은 직역하면 '사울 앞에'이므로 그 표현을 살리되 한국어 어순은 자연화했습니다.
- source_word: וַיִּקָּחֵהוּ
  english_pob_choice: he had him brought
  chosen_korean: 그를 데려오게 했습니다
  alternatives_korean:
  - 그를 데려왔습니다
  - 그를 잡아왔습니다
  lexicon: HALOT
  rationale: לקח은 문자적으로 '취하다/데려가다'이지만 궁정 문맥에서는 사울이 다윗을 자기 앞으로 오게 한 뜻으로 이해되므로, POB의 해석을 따라 '데려오게 했습니다'로 옮겼습니다.
