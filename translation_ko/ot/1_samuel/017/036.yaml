base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/036.yaml
  text: Your servant struck down both the lion and the bear[a], and this uncircumcised Philistine will be like one of them, because he has defied the battle lines of the living God.
  footnotes:
  - marker: a
    text: Or 'the armies of the living God.' The Hebrew term can mean 'battle lines,' 'ranks,' or by extension 'armies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사자와 곰도 당신의 종이 쳐죽였고, 이 할례받지 않은 블레셋 사람도 그들 중 하나와 같을 것입니다. 그가 살아 계신 하나님의 전열을 모독했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '살아 계신 하나님의 군대들'. 히브리어는 '전열', '진열', 확장적으로는 '군대들'을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  english_pob_choice: struck down
  chosen_korean: 쳐죽였고
  alternatives_korean:
  - 쓰러뜨렸고
  - 쳐서 죽였고
  - 죽였고
  lexicon: HALOT
  rationale: 문맥상 맹수를 무력화해 죽인 뜻이므로, 단순한 '죽였고'보다 원문의 강한 타격감을 살리는 표현을 택했습니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 주인의 종
  - 당신의 하인
  lexicon: HALOT
  rationale: 사울에게 드리는 겸손한 자기 호칭이므로 관료적·궁정적 뉘앙스를 살려 '종'으로 옮겼습니다.
- source_word: הֶעָרֵל
  english_pob_choice: uncircumcised
  chosen_korean: 할례받지 않은
  alternatives_korean:
