translation:
  language: ko
  text: 사자도 곰도 왕의 종인 제가 쳐서 쓰러뜨렸습니다. 이 할례받지 않은 블레셋 사람도 그들 가운데 하나처럼 될 것입니다. 그가 살아 계신 하나님의 전열을 모독했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살아 계신 하나님의 군대’. 히브리어는 ‘전열’, ‘대오’, 또는 문맥상 확장하여 ‘군대’를 뜻할 수 있습니다.
    reason: lexical_alternative
