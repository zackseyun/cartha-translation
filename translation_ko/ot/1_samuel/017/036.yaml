  - 할례 없는
  lexicon: HALOT
  rationale: 신체적·언약적 표지를 그대로 유지해야 다윗의 모욕과 신학적 대비가 약화되지 않습니다.
- source_word: מַעַרְכֹת
  english_pob_choice: battle lines
  chosen_korean: 전열
  alternatives_korean:
  - 진열
  - 군대
  - 대오
  lexicon: HALOT
  rationale: '''battle lines''의 군사적 배열 이미지를 한국어 군사용어인 ''전열''로 간결하게 살렸습니다.'
- source_word: אֱלֹהִים חַיִּים
  english_pob_choice: the living God
  chosen_korean: 살아 계신 하나님
  alternatives_korean:
  - 생존하시는 하나님
  - 살아 있는 하나님
  - 생명하신 하나님
  lexicon: HALOT
  rationale: 하나님의 실재성과 역동성을 나타내는 관용구이므로, 한국어 성경에서 널리 이해되는 '살아 계신 하나님'을 사용했습니다.
theological_decisions:
- issue: מַעַרְכֹת의 의미를 '전열'로 살릴지, '군대'로 평탄화할지
  chosen_reading: '''전열''로 옮겨 전투 배열의 구체성을 유지했습니다.'
  alternative_readings:
  - 군대
  - 진영
  - 부대
  rationale: 본문은 하나님의 소속된 전투 배열을 가리키므로, 추상적 기관명보다 군사적 그림을 보존하는 편이 원문 의미에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy and preservation of source imagery.'
