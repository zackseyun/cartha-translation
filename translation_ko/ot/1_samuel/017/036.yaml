revisions:
- from: 사자와 곰도 당신의 종이 쳐죽였고, 이 할례받지 않은 블레셋 사람도 그들 중 하나와 같을 것입니다. 그가 살아 계신 하나님의 전열을 모독했기 때문입니다.[a]
  to: 사자도 곰도 왕의 종인 제가 쳐서 쓰러뜨렸습니다. 이 할례받지 않은 블레셋 사람도 그들 가운데 하나처럼 될 것입니다. 그가 살아 계신 하나님의 전열을 모독했기 때문입니다.[a]
  rationale: 히브리어 동사 הִכָּה의 의미 범위를 보존하기 위해 ‘쳐죽였고’를 ‘쳐서 쓰러뜨렸습니다’로 조정했습니다. 공손한 자기 지칭은 사울이 왕이라는 문맥에서 자연스러운 현대 한국어로 다듬었고, מַעַרְכֹת 관련 각주에서 부정확한 ‘진열’을 제거하여 군사적 어휘 범위를 정확히 제시했습니다.
