base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/049.yaml
  text: Then David reached his hand into the bag[a], took a stone from there, slung it, and struck the Philistine on his forehead. The stone sank into his forehead[c][b], and he fell on his face to the ground.
  footnotes:
  - marker: a
    text: Or, 'into the pouch.' The Hebrew term for the container is broad and contextually refers to the receptacle holding David's stones.
    reason: lexical_alternative
  - marker: b
    text: Or, 'The stone embedded itself in his forehead.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'he fell on his face to the ground.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗이 손을 주머니[a]에 넣고 거기서 돌 하나를 가져와 그것을 던져, 블레셋 사람의 이마를 쳤습니다. 그 돌이 그의 이마에 박혔고[b], 그는 얼굴을 땅에 대고 쓰러졌습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파우치’. 여기의 히브리어는 돌을 담는 용기를 가리키는 넓은 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 이마 안으로 들어갔다.’
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그는 얼굴을 땅으로 향해 쓰러졌다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל הַכֶּלִי
  english_pob_choice: the bag
  chosen_korean: 주머니
  alternatives_korean:
  - 주머니 속
  - 자루
  - 가방
  lexicon: HALOT
  rationale: כְּלִי는 넓은 말이지만 여기서는 돌을 담은 용기를 가리키므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘주머니’가 가장 적절합니다.
- source_word: וַיְקַלַּע
  english_pob_choice: slung it
  chosen_korean: 그것을 던져
  alternatives_korean:
  - 슬링으로 던져
  - 돌팔매로 날려
  - 팽개쳐
  lexicon: HALOT
  rationale: 동작은 투석기/슬링 사용을 뜻하지만, 한국어 합쇼체 본문에서는 과도한 설명 없이 ‘던져’로 간결하게 살리고, footnote 없이도 행동의 핵심을 전달합니다.
- source_word: וַתִּטְבַּע הָאֶבֶן בְּמִצְחוֹ
  english_pob_choice: The stone sank into his forehead
  chosen_korean: 그 돌이 그의 이마에 박혔고
  alternatives_korean:
  - 그 돌이 그의 이마 속으로 들어갔고
  - 그 돌이 그의 이마에 잠겼고
  - 그 돌이 그의 이마에 박혀 들어갔고
  lexicon: HALOT
  rationale: טבע의 ‘가라앉다/박히다’ 의미를 살리면서 한국어에서는 ‘박혔고’가 가장 자연스럽고 직접적인 표현입니다.
- source_word: וַיִּפֹּל עַל פָּנָיו אָרְצָה
  english_pob_choice: he fell on his face to the ground
  chosen_korean: 얼굴을 땅에 대고 쓰러졌습니다
  alternatives_korean:
  - 얼굴을 땅에 대고 넘어졌습니다
  - 얼굴을 땅에 대고 엎어졌습니다
  - 얼굴로 땅에 넘어졌습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴로 땅쪽으로 쓰러짐’을 현대 한국어에서 자연스럽게 옮기되, 자세와 방향성을 보존하기 위해 ‘얼굴을 땅에 대고 쓰러졌습니다’로 옮겼습니다.
theological_decisions:
- issue: 본문의 전투 장면을 과장 없이 그대로 전달할지 여부
  chosen_reading: 서술을 감각적으로는 살리되, 해설적 확장을 넣지 않고 돌의 타격과 즉각적 전도만을 본문 그대로 제시했습니다.
  alternative_readings:
  - ‘돌이 박혀 머리가 깨졌다’처럼 결과를 추정하는 확장
  - ‘얼굴을 땅으로 향해 쓰러졌다’ 같은 재구성
  rationale: 히브리어는 다윗의 행동, 명중, 낙상을 순차적으로 간명하게 말하므로, 본문이 말하는 범위를 넘지 않는 것이 가장 충실합니다.
  doctrine_reference: source-text fidelity
