  source_fidelity: ‘그것을 던져’는 히브리어 וַיְקַלַּע가 나타내는 물매 사용을 일반적인 투척으로 약화합니다. ‘물매로 던져’로 명시하는 것이 원문의 동작을 충실히 보존합니다. 나머지 서술 순서와 돌이 이마에 박힌 것, 얼굴을 땅에 대고 쓰러진 자세는 원문에 부합합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘돌 하나를 꺼내 물매로 던져’는 반복 대명사를 피하면서도 동작의 도구와 대상을 분명히 합니다.
  terminology: ‘주머니’는 문맥상 כְּלִי의 적절한 번역입니다. ‘물매’는 슬링을 가리키는 성경 문맥의 표준적이고 이해 가능한 용어입니다. ‘블레셋 사람’ 및 ‘이마’도 적절합니다.
  issues:
