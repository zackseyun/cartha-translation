base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/041.yaml
  text: And the Philistine came on[a], coming closer to David[b], with the man carrying the shield before him.
  footnotes:
  - marker: a
    text: Or 'advanced, going and drawing near to David.' The Hebrew uses a finite verb followed by participles to portray continued forward movement.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word for 'shield' (צִנָּה) can refer specifically to a large shield.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 블레셋 사람이 다윗을 향해 계속 다가왔고, 방패를 든 사람이 그의 앞에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 완료형 동사 뒤에 분사들을 이어 써서, 그가 계속 전진하며 다윗에게 가까이 다가가는 모습을 나타냅니다.
    reason: source_note
  - marker: b
    text: 히브리어 צִנָּה는 특히 큰 방패를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הַפְּלִשְׁתִּי
  english_pob_choice: the Philistine came on
  chosen_korean: 그 블레셋 사람이 다윗에게 다가오며
  alternatives_korean:
  - 그 블레셋 사람이 나아오며
  - 그 블레셋 사람이 진군하며
  lexicon: HALOT
  rationale: הלך는 단순히 ‘가다’보다 전투 장면에서 상대를 향한 위협적 접근을 나타내므로, 자연스러운 현대 한국어로 ‘다가오며’라고 옮겼습니다.
- source_word: הֹלֵךְ וְקָרֵב
  english_pob_choice: coming closer
  chosen_korean: 앞으로 오고 있었고
  alternatives_korean:
  - 가며 가까이 오고 있었고
  - 계속 다가오고 있었고
  lexicon: HALOT
  rationale: 분사 연쇄가 지속적인 접근을 강조하므로, 단회 동작이 아니라 진행 중인 움직임을 드러내는 표현으로 옮겼습니다.
- source_word: וְהָאִישׁ נֹשֵׂא הַצִּנָּה
  english_pob_choice: with the man carrying the shield
  chosen_korean: 그 앞에는 방패를 메는 사람이 있었습니다
  alternatives_korean:
  - 그리고 방패를 들고 있는 사람이 있었습니다
  - 그 앞에는 방패를 지닌 사람이 있었습니다
  lexicon: HALOT
  rationale: נשא는 ‘들다/메다/지니다’의 범위가 있지만, 전장 맥락에서는 몸에 걸치고 운반하는 느낌이 살아 있는 ‘메다’가 적절합니다.
- source_word: הַצִּנָּה
  english_pob_choice: the shield
  chosen_korean: 방패
  alternatives_korean:
  - 큰 방패
  - 대형 방패
  lexicon: HALOT
  rationale: צנה는 큰 방패를 가리킬 수 있지만, 본문 자체는 단순히 ‘방패’라고 해도 의미가 충분하므로 주석 정보는 본문에 과도하게 넣지 않았습니다.
- source_word: לְפָנָיו
  english_pob_choice: before him
  chosen_korean: 그 앞에는
  alternatives_korean:
  - 그 앞에
  - 그 앞쪽에
  lexicon: HALOT
  rationale: 전치사구는 블레셋 사람보다 앞선 위치를 나타내므로, 서술 흐름에 맞는 ‘그 앞에는’으로 처리했습니다.
