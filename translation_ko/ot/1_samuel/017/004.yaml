  text: Then a champion came out from the camps of the Philistines[a]; his name was Goliath, from Gath[b]. His height was six cubits and a span.
  footnotes:
  - marker: a
    text: 'Hebrew: ''a man of the between,'' likely referring to a representative fighter who steps out between the battle lines; hence ''champion.'''
    reason: lexical_alternative
  - marker: b
    text: Six cubits and a span is approximately 9 feet 9 inches (about 3.0 meters), depending on the cubit used.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 블레셋 진영들 가운데서 한 대표 전사가 나왔습니다[a]. 그의 이름은 가드 출신 골리앗이었습니다. 그의 키는 여섯 규빗과 한 뼘이었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘사이의 사람’입니다. 문맥상 양 진영 사이로 나가 대표로 싸우는 전사를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여섯 규빗과 한 뼘은 사용한 규빗의 길이에 따라 대략 3미터입니다.
    reason: cultural_note
