  text: 그러자 블레셋 진영들에서 한 용사가 나왔는데[a], 이름은 가드 출신 골리앗이었습니다. 그의 키는 여섯 규빗 한 뼘이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘사이의 사람’에 가깝지만, 여기서는 진영 사이로 나와 대표적으로 싸우는 전사를 가리키므로 ‘용사’로 옮겼습니다.
    reason: lexical_alternative
