base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/043.yaml
  text: And the Philistine said to David[a], “Am I a dog[b], that you come to me with sticks?” And the Philistine cursed David by his gods.
  footnotes:
  - marker: a
    text: Or, “with staffs.” The Hebrew word can refer to rods, staffs, or sticks; here it conveys the Philistine’s contempt.
    reason: lexical_alternative
  - marker: b
    text: Or, “in the name of his gods.”
    reason: alternative_reading
translation:
  language: ko
  text: 블레셋 사람이 다윗에게 말했습니다. 「내가 개냐? 네가 막대기들을 들고 내게 오다니?」 그리고 블레셋 사람은 자기 신들로 다윗을 저주했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘막대기들’은 히브리어 מַקְלוֹת의 가능한 의미들—막대, 지팡이, 몽둥이류—중 여기서의 조롱 섞인 표현을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 신들’은 히브리어 אֱלֹהָיו를 블레셋의 다신교적 맥락에 따라 복수로 읽은 번역입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  english_pob_choice: the Philistine
  chosen_korean: 블레셋 사람
  alternatives_korean:
  - 그 블레셋 사람
  - 블레셋 전사
  lexicon: HALOT
  rationale: 원문은 Goliath를 민족적 표지로 부르며, 영어 POB의 단순한 ‘the Philistine’을 따라 한국어에서도 불필요한 해설을 넣지 않고 ‘블레셋 사람’으로 옮겼습니다.
- source_word: הֲכֶלֶב אָנֹכִי
  english_pob_choice: Am I a dog
  chosen_korean: 내가 개냐?
  alternatives_korean:
  - 내가 개입니까?
  - 내가 한낱 개냐?
  lexicon: HALOT
  rationale: 수사적 모욕을 그대로 살리기 위해 ‘개’ 이미지를 유지했고, 합쇼체 서술 속에서도 직접화법의 거친 뉘앙스를 보존하기 위해 짧고 날카로운 형태로 옮겼습니다.
- source_word: בַּמַּקְלוֹת
  english_pob_choice: with sticks
  chosen_korean: 막대기들을 들고
  alternatives_korean:
  - 막대기들로
  - 지팡이들을 들고
  lexicon: HALOT
  rationale: מַקְלוֹת는 막대기/지팡이/막대류를 가리키며, 영어 POB가 ‘sticks’로 유지한 조롱의 뉘앙스를 따라 ‘막대기들’을 택했습니다. 한국어에서는 전치사적 ‘가지고/들고’가 자연스러워 의미를 드러내기 위해 ‘들고’를 보탰습니다.
- source_word: וַיְקַלֵּל
  english_pob_choice: cursed
  chosen_korean: 저주했습니다
  alternatives_korean:
  - 욕했습니다
  - 저주를 퍼부었습니다
  lexicon: HALOT
  rationale: 단순한 모욕보다 종교적·언약적 무게가 있는 קלל의 용례를 반영해 ‘저주했습니다’로 옮겼습니다.
theological_decisions:
- issue: בֵּאלֹהָיו의 복수적 의미 보존
  chosen_reading: 자기 신들
  alternative_readings:
  - 자기 신
  - 자기들의 신
  rationale: 비이스라엘인 블레셋의 맥락에서 אֱלֹהָיו는 복수적 ‘자기 신들’로 읽는 것이 가장 자연스럽고, 원문의 다신교적 배경을 희석하지 않습니다.
  doctrine_reference: Original-language primacy; preserve theological tension rather than harmonize it
