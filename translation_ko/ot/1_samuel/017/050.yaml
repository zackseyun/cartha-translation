source:
  edition: WLC
  text: וַ/יֶּחֱזַ֨ק דָּוִ֤ד מִן הַ/פְּלִשְׁתִּי֙ בַּ/קֶּ֣לַע וּ/בָ/אֶ֔בֶן וַ/יַּ֥ךְ אֶת הַ/פְּלִשְׁתִּ֖י וַ/יְמִיתֵ֑/הוּ וְ/חֶ֖רֶב אֵ֥ין בְּ/יַד דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/050.yaml
  text: So David prevailed over the Philistine with a sling and with a stone; he struck the Philistine and killed him[a], though there was no sword in David’s hand.
  footnotes:
  - marker: a
    text: Or 'and there was no sword in David’s hand.' The Hebrew conjunction can be read more formally as simple 'and'; the main text uses 'though' to bring out the clause’s concessive sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 물매와 돌로 블레셋 사람을 이겨, 그 블레셋 사람을 쳐서 죽였습니다. 그러나 다윗의 손에는 칼이 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 연결사는 더 형식적으로는 단순한 ‘그리고’로 읽을 수 있습니다. 본문은 문맥상 드러나는 대조를 나타내기 위해 ‘그러나’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק ... מִן הַפְּלִשְׁתִּי
  english_pob_choice: prevailed over the Philistine
  chosen_korean: 블레셋 사람보다 더 강해져서
  alternatives_korean:
  - 블레셋 사람을 이겨서
  - 블레셋 사람보다 우세하여
  lexicon: HALOT
  rationale: חזק עם מִן은 단순히 ‘강해지다’가 아니라 상대보다 우세해져 승리하는 뜻이어서, 전투 문맥에 맞게 ‘~보다 더 강해져서’로 옮겼습니다.
- source_word: בַּקֶּלַע
  english_pob_choice: with a sling
  chosen_korean: 물매와
  alternatives_korean:
  - 물매로
  - 슬링으로
  lexicon: HALOT
  rationale: 수단을 나타내는 ב의 의미를 살리면서 한국어에서 자연스러운 전투 도구 표현인 ‘물매’를 사용했습니다.
- source_word: וּבָאֶבֶן
  english_pob_choice: and with a stone
  chosen_korean: 돌로
  alternatives_korean:
  - 그리고 돌로
  - 한 돌로
  lexicon: HALOT
  rationale: 히브리어 단수 ‘돌’의 구체성을 유지하되, 한국어에서는 도구적 의미를 분명히 하는 ‘돌로’가 가장 자연스럽습니다.
- source_word: וַיַּךְ ... וַיְמִיתֵהוּ
  english_pob_choice: he struck the Philistine and killed him
  chosen_korean: 그 블레셋 사람을 쳐서 죽였으나
  alternatives_korean:
  - 그 블레셋 사람을 쳐서 죽였고
  - 그 블레셋 사람을 치고 죽였습니다
  lexicon: HALOT
  rationale: נכה와 מות의 연속 동사를 한국어의 행위 연쇄로 살려 ‘쳐서 죽였으나’로 옮겼습니다. 뒤의 ‘그러나’와 연결되는 문맥상의 대비도 유지합니다.
- source_word: וְחֶרֶב אֵין בְּיַד דָּוִד
  english_pob_choice: though there was no sword in David’s hand
  chosen_korean: 다윗의 손에는 칼이 없었습니다
  alternatives_korean:
  - 그런데 다윗의 손에는 칼이 없었습니다
  - 하지만 다윗의 손에는 칼이 없었습니다
  lexicon: HALOT
  rationale: 히브리어는 단순한 병렬 접속이지만 문맥상 양상은 대비적이므로, 본문에서는 자연스러운 한국어로 처리하고 수단의 부재를 분명히 했습니다.
theological_decisions:
- issue: 전투 승리의 주체를 어떻게 드러낼지
  chosen_reading: 다윗이 물매와 돌이라는 제한된 수단으로도 블레셋 사람을 제압했다는 점을 전면에 드러냈습니다.
  alternative_readings:
  - ‘다윗이 이겼다’처럼 단순 승리로 축약
  - 도구를 덜 강조하는 표현
  rationale: 본문은 승리 자체보다 ‘칼이 없는데도’라는 역설을 강조하므로, 도구와 부재를 함께 드러내는 번역이 소스의 긴장을 더 잘 보존합니다.
  doctrine_reference: 서사 본문 해석 원리
