translation:
  language: ko
  text: 사울과 온 이스라엘은 그 블레셋 사람의 이 말을 듣고 몹시 낙담하며 매우 두려워했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: heard
  chosen_korean: 들었을 때
  alternatives_korean:
  - 들었습니다
  - 듣고
  lexicon: HALOT
  rationale: 서술의 연속 속에서 שׁמע의 기본 의미인 ‘듣다’를 자연스럽게 살려, 앞절과의 시간 관계를 명확히 했습니다.
- source_word: הַפְּלִשְׁתִּי
  english_pob_choice: the Philistine
  chosen_korean: 그 블레셋 사람
  alternatives_korean:
  - 블레셋 사람
  - 그 블레셋 사람
  lexicon: HALOT
  rationale: 본문의 단수 정관 표현을 살려 대표 전사로서의 특정 인물을 가리키도록 했습니다.
- source_word: וַיֵּחַתּוּ
  english_pob_choice: were dismayed
  chosen_korean: 크게 흔들렸고
  alternatives_korean:
  - 크게 두려워했고
  - 완전히 무너졌고
  - 몹시 당황했고
  lexicon: HALOT
  rationale: חתת의 ‘부서지다/흔들리다/낙담하다’라는 물리적·정서적 뉘앙스를 살려, 뒤의 ‘두려워했습니다’와 중복되지 않게 표현했습니다.
- source_word: וַיִּירְאוּ מְאֹד
  english_pob_choice: greatly afraid
  chosen_korean: 매우 두려워했습니다
  alternatives_korean:
  - 몹시 두려워했습니다
  - 극도로 두려워했습니다
  lexicon: HALOT
  rationale: ירא의 기본 의미를 직접적으로 옮기되, מְאֹד의 강한 강조를 현대 한국어로 자연스럽게 표현했습니다.
