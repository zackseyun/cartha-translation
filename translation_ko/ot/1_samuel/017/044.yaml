  naturalness: ‘내게로 와라’가 현대 한국어의 위협적 직접 발화로 자연스럽습니다. 서술문은 합쇼체로 유지하고, 골리앗의 인용 발화는 인물의 적대적 반말 명령으로 처리하는 것이 문맥과 목표 문체에 부합합니다.
