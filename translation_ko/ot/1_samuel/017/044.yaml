  yaml_path: translation/ot/1_samuel/017/044.yaml
  text: And the Philistine said to David[a], “Come to me[b], and I will give your flesh to the birds of the heavens and to the beasts of the field.”
  footnotes:
  - marker: a
    text: Or “the birds of the sky.”
    reason: lexical_alternative
  - marker: b
    text: Or “the animals of the field.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그 블레셋 사람이 다윗에게 말했습니다. 「내게로 오너라. 그러면 내가 네 살을 하늘의 새들과 들의 짐승들에게 주겠다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “하늘의 새들”입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “들의 짐승들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  english_pob_choice: the Philistine
  chosen_korean: 그 블레셋 사람
  alternatives_korean:
  - 블레셋 사람
  - 그 블레셋 전사
  lexicon: HALOT
  rationale: 기사 본문에서 특정 인물 골리앗을 가리키므로 지시성을 살려 ‘그’와 함께 자연스럽게 옮겼고, 본문에 없는 ‘전사’는 덧붙이지 않았습니다.
- source_word: לְכָה אֵלַי
  english_pob_choice: Come to me
  chosen_korean: 내게로 오너라
  alternatives_korean:
  - 내게로 와라
  - 이리 오너라
  lexicon: HALOT
  rationale: 도전적·위협적 발화의 명령형을 한국어 자연어로 살리되, 구어체로 너무 낮아지지 않도록 ‘오너라’를 택했습니다.
- source_word: בְּשָׂרְךָ
  english_pob_choice: your flesh
  chosen_korean: 네 살
  alternatives_korean:
  - 네 몸
  - 네 시체
  lexicon: HALOT
  rationale: 히브리어의 직설적이고 잔혹한 이미지를 보존하기 위해 ‘살’로 옮겼고, 해석을 더한 ‘시체’는 피했습니다.
- source_word: לְעוֹף הַשָּׁמַיִם וּלְבֶהֱמַת הַשָּׂדֶה
  english_pob_choice: to the birds of the heavens and to the beasts of the field
  chosen_korean: 하늘의 새들과 들의 짐승들에게
  alternatives_korean:
  - 하늘의 새들과 들의 동물들에게
  - 하늘의 새들과 들의 야수들에게
  lexicon: HALOT
  rationale: ‘birds of the heavens’는 한국어에서 자연스러운 ‘하늘의 새들’로, ‘beasts of the field’는 문맥상 사체를 먹는 짐승들을 가리키므로 ‘들의 짐승들’로 옮겼습니다.
theological_decisions:
- issue: 말투가 다윗에게 직접 던지는 조롱성 명령문이라는 점
  chosen_reading: 대화체 명령을 합쇼체가 아닌 반말형 명령으로 처리해 위협과 조롱의 강도를 살렸습니다.
  alternative_readings:
  - 내게로 오십시오
  - 내게로 오라
  rationale: 원문은 적대적 도전 발화이므로 지나치게 공손한 높임말은 장면의 성격을 약화시킵니다. 한국어 독자가 본문의 모욕적 긴장을 즉시 느끼도록 했습니다.
  doctrine_reference: 서사 발화의 화용론과 인물 특성 보존
