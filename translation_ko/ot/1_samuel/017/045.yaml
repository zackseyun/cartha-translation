base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/045.yaml
  text: Then David said to the Philistine[a], “You come to me with a sword, with a spear, and with a javelin, but I come to you in the name of Yahweh of Armies, the God of the armies of Israel[c][b], whom you have defied.”
  footnotes:
  - marker: a
    text: Or “the LORD of hosts.”
    reason: lexical_alternative
  - marker: b
    text: Or “the God of the armies of Israel” or “the God of Israel’s battle lines.”
    reason: lexical_alternative
  - marker: c
    text: “Defied” may also be rendered “reproached” or “taunted,” but here it carries the sense of contemptuous challenge against the God of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 블레셋 사람에게 말했습니다. “너는 칼과 창과 단창을 들고 내게로 오지만, 나는 만군의 야훼, 곧 네가 모욕한 이스라엘 군대의 하나님의 이름으로 네게로 갑니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만군’은 히브리어 צְבָאוֹת의 직역으로, 전통적 교회 용어 ‘만군의 여호와’에 해당합니다.
    reason: source_note
  - marker: b
    text: מַעַרְכוֹת는 전투 대열, 진열, 편성된 군대를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: חרף는 여기서 단순한 말다툼이 아니라 하나님을 향한 공적 모욕과 도전의 뜻을 가집니다.
    reason: theological_note
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  english_pob_choice: the Philistine
  chosen_korean: 블레셋 사람
  alternatives_korean:
  - 블레셋인
  - 블레셋 전사
  lexicon: HALOT
  rationale: 본문은 골리앗을 민족/출신 표지로 부르므로, 자연스럽고 널리 이해되는 ‘블레셋 사람’이 가장 직접적입니다.
- source_word: בְּחֶרֶב וּבַחֲנִית וּבְכִידוֹן
  english_pob_choice: with a sword, with a spear, and with a javelin
  chosen_korean: 칼과 창과 단창을 들고
  alternatives_korean:
  - 검과 창과 투창을 들고
  - 칼과 창과 재블린을 들고
  lexicon: HALOT
  rationale: 세 무기를 한국어에서 구별되면서도 자연스럽게 옮기기 위해 ‘칼/창/단창’을 사용했습니다. ‘단창’은 כִּידוֹן의 투척용 창 성격을 반영합니다.
- source_word: בְּשֵׁם יְהוָה צְבָאוֹת
  english_pob_choice: in the name of Yahweh of Armies
  chosen_korean: 만군의 야훼의 이름으로
  alternatives_korean:
  - 야훼 만군의 이름으로
  - 만군의 주님의 이름으로
  lexicon: HALOT
  rationale: יְהוָה는 프로젝트 기본값대로 ‘야훼’로, צְבָאוֹת는 ‘만군’으로 옮겨 군사적·주권적 뉘앙스를 보존했습니다.
- source_word: אֱלֹהֵי מַעַרְכוֹת יִשְׂרָאֵל
  english_pob_choice: the God of the armies of Israel / the God of Israel’s battle lines
  chosen_korean: 이스라엘 군대의 하나님
  alternatives_korean:
  - 이스라엘의 군대들의 하나님
  - 이스라엘 진열의 하나님
  lexicon: HALOT
  rationale: מַעַרְכוֹת는 전투 대열/배열의 뜻을 가지지만, 문맥상 ‘이스라엘 군대’가 가장 자연스럽고 이해 가능하며, 전투 맥락을 충분히 드러냅니다.
- source_word: אֲשֶׁר חֵרַפְתָּ
  english_pob_choice: whom you have defied
  chosen_korean: 네가 모욕한
  alternatives_korean:
  - 네가 대적한
  - 네가 조롱한
  lexicon: HALOT
  rationale: חרף는 단순한 욕설보다 하나님에 대한 경멸적 도전의 뜻을 띠므로, 한국어로는 ‘모욕하다’가 그 긴장을 가장 직접적으로 전합니다.
theological_decisions:
- issue: יהוה와 צְבָאוֹת의 결합 표기
  chosen_reading: 만군의 야훼
  alternative_readings:
  - 야훼 만군
  - 만군의 주
  rationale: 본문의 신명과 군사적 호칭을 함께 살려, 전승적 ‘여호와’ 대신 번역 정책에 따라 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: חרף의 신학적 강도
  chosen_reading: 네가 모욕한
  alternative_readings:
  - 네가 조롱한
  - 네가 대적한
  - 네가 업신여긴
  rationale: 이 동사는 단순 감정 표현이 아니라 야훼와 이스라엘 군대를 향한 공적 도전이므로, 본문에 과도한 완화 없이 그 경멸성을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
