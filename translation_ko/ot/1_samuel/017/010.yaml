source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הַ/פְּלִשְׁתִּ֔י אֲנִ֗י חֵרַ֛פְתִּי אֶת מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל הַ/יּ֣וֹם הַ/זֶּ֑ה תְּנוּ לִ֣/י אִ֔ישׁ וְ/נִֽלָּחֲמָ֖ה יָֽחַד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/010.yaml
  text: Then the Philistine said[a], “I have defied the ranks of Israel this day. Give me a man[c][b], and let us fight together.”
  footnotes:
  - marker: a
    text: Or “the battle lines of Israel” or, by extension, “the armies of Israel.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb can also be rendered “taunted,” “reproached,” or “mocked”; “defied” best fits the military challenge in context.
    reason: lexical_alternative
  - marker: c
    text: Literally “this day”; many English versions render “today.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 블레셋 사람이 말했습니다. “나는 오늘 이스라엘의 대열에 맞섰습니다. 내게 사람 하나를 내주시오. 그러면 우리가 함께 싸우겠습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘의 전열’ 또는 확장하여 ‘이스라엘의 군대’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 이 문맥에서 ‘도전했다’, ‘조롱했다’, ‘모욕했다’로도 옮길 수 있으나, 군사적 대결의 성격상 ‘맞섰습니다’가 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘사람’을 요구하는 표현입니다. 문맥상 단일 전사, 곧 결투 상대를 요구하는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  english_pob_choice: the Philistine
  chosen_korean: 블레셋 사람
  alternatives_korean:
  - 블레셋인
  - 그 블레셋 사람
  lexicon: BDB
  rationale: 히브리어 관사형 명사는 특정 인물을 가리키므로, 여기서는 민족명인 ‘블레셋 사람’으로 자연스럽게 옮기되 ‘챔피언’ 같은 해석어는 넣지 않았습니다.
- source_word: חֵרַפְתִּי
  english_pob_choice: I have defied
  chosen_korean: 맞섰습니다
  alternatives_korean:
  - 모욕했습니다
  - 조롱했습니다
  - 능욕했습니다
  lexicon: HALOT
  rationale: 전투 도전 문맥에서 חרף는 단순 조롱보다 공개적으로 대항하고 모욕하는 행위를 포함하므로, 현대 한국어로는 군사적 대결감을 살리는 ‘맞섰습니다’가 가장 무난합니다.
- source_word: מַעַרְכ֥וֹת
  english_pob_choice: the ranks
  chosen_korean: 대열
  alternatives_korean:
  - 전열
  - 진열
  - 군대
  lexicon: HALOT
  rationale: ‘마아라코트’는 정렬된 전투 편제를 뜻하므로, 한국어에서는 군사적 배열을 드러내는 ‘대열’이 가장 간결하고 본문 흐름에도 맞습니다.
- source_word: תְּנוּ לִ֣/י אִ֔ישׁ
  english_pob_choice: Give me a man
  chosen_korean: 내게 사람 하나를 내주시오
  alternatives_korean:
  - 내게 한 사람을 주시오
  - 내게 장정 하나를 내주시오
  - 내게 사람 하나를 보내시오
  lexicon: HALOT
  rationale: 직역은 ‘나에게 사람을 주라’이지만, 문맥상 단독 결투 상대를 요구하는 도전이므로 ‘내주시오’로 요청+도전의 뉘앙스를 살렸습니다.
- source_word: וְ/נִֽלָּחֲמָ֖ה יָֽחַד
  english_pob_choice: and let us fight together
  chosen_korean: 그러면 우리가 함께 싸우겠습니다
  alternatives_korean:
  - 그리고 함께 싸우겠습니다
  - 그리하여 맞붙겠습니다
  - 그러면 서로 싸우겠습니다
  lexicon: HALOT
  rationale: 히브리어 cohortative는 제안형 도전이므로 미래형보다 ‘~겠습니다’로 제의적 뉘앙스를 옮겼고, יָחַד는 단순히 ‘함께’로 자연스럽게 처리했습니다.
