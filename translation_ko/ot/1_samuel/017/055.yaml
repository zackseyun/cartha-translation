  text: וְ/כִ/רְא֨וֹת שָׁא֜וּל אֶת דָּוִ֗ד יֹצֵא֙ לִ/קְרַ֣את הַ/פְּלִשְׁתִּ֔י אָמַ֗ר אֶל אַבְנֵר֙ שַׂ֣ר הַ/צָּבָ֔א בֶּן מִי זֶ֥ה הַ/נַּ֖עַר אַבְנֵ֑ר וַ/יֹּ֣אמֶר אַבְנֵ֔ר חֵֽי נַפְשְׁ/ךָ֥ הַ/מֶּ֖לֶךְ אִם יָדָֽעְתִּי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/055.yaml
  text: When Saul saw David going out to meet the Philistine[a], he said to Abner, the commander of the army, “Whose son is this young man, Abner?” And Abner said, “As your soul lives, O king, I do not know.”
  footnotes:
  - marker: a
    text: 'Hebrew oath formula: ''As your soul lives''; more idiomatically, ''As surely as you live.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 다윗이 블레셋 사람을 맞으러 나가는 것을 보고, 군대의 장관 아브넬에게 말하였습니다. “저 젊은이는 누구의 아들입니까, 아브넬?” 아브넬이 대답하였습니다. “왕이여, 왕의 생명이 살아 있듯이, 제가 알지 못합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 서약 공식으로, 문자적으로는 ‘왕의 생명이 살아 있듯이’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹצֵא לִקְרַאת הַפְּלִשְׁתִּי
  english_pob_choice: going out to meet the Philistine
  chosen_korean: 블레셋 사람을 맞으러 나가는 것
  alternatives_korean:
  - 블레셋 사람을 향해 나가는 것
  - 블레셋 사람을 만나러 나가는 것
  lexicon: HALOT
  rationale: יצא와 לקראת의 결합은 단순한 이동이 아니라 전투를 향해 나아가는 모습을 나타내므로, ‘맞으러 나가다’로 자연스럽게 살렸습니다.
- source_word: שַׂר הַצָּבָא
  english_pob_choice: the commander of the army
  chosen_korean: 군대의 장관
  alternatives_korean:
  - 군대의 사령관
  - 군대의 지휘관
  lexicon: HALOT
  rationale: שַׂר는 공식 직책을 가리키므로 ‘장관’보다 직역에 가까운 ‘사령관/지휘관’도 가능하지만, 본문 맥락의 군사 직함을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: בֶּן מִי זֶה הַנַּעַר
  english_pob_choice: Whose son is this young man
  chosen_korean: 저 젊은이는 누구의 아들입니까
  alternatives_korean:
  - 이 젊은이는 누구의 아들입니까
  - 이 소년은 누구의 아들입니까
  lexicon: HALOT
  rationale: נַעַר는 문맥상 어린아이보다 전투에 나선 젊은이를 가리키므로 ‘젊은이’로 옮겼고, 히브리어의 ‘아들’ 질문 구조를 그대로 반영했습니다.
- source_word: חֵי נַפְשְׁךָ
  english_pob_choice: As your soul lives
  chosen_korean: 왕의 생명이 살아 있듯이
  alternatives_korean:
  - 왕의 목숨이 살아 있듯이
  - 왕의 생명으로 맹세하건대
  lexicon: HALOT
  rationale: 히브리어의 서약 공식은 직역하면 ‘왕의 혼이 살아 있듯이’에 가깝지만, 한국어에서는 관용적 맹세 표현보다 원문의 서약성을 유지하면서도 자연스럽게 ‘생명이 살아 있듯이’로 옮겼습니다.
theological_decisions:
- issue: אָמַר ... אִם יָדָעְתִּי의 서약적 부정 응답
  chosen_reading: ‘제가 알지 못합니다’로 자연스러운 부정 진술로 옮겼습니다.
  alternative_readings:
  - ‘알고 있다면’에 가까운 더 직역적인 형태
  - ‘정말 알지 못합니다’처럼 강조를 넣는 번역
  rationale: 서약 문맥에서 אִם은 축약된 부정 맹세로 기능하므로, 한국어 독자가 즉시 이해할 수 있게 부정 답변으로 풀어 주되 맹세의 어조는 앞 절의 서약 표현으로 보존했습니다.
  doctrine_reference: 히브리어 서약 관용구의 문맥적 번역 원칙
