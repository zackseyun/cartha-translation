  yaml_path: translation/ot/1_samuel/017/055.yaml
  text: When Saul saw David going out to meet the Philistine[a], he said to Abner, the commander of the army, “Whose son is this young man, Abner?” And Abner said, “As your soul lives, O king, I do not know.”
  footnotes:
  - marker: a
    text: 'Hebrew oath formula: ''As your soul lives''; more idiomatically, ''As surely as you live.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 다윗이 블레셋 사람을 맞으러 나가는 것을 보고, 군대 사령관 아브넬에게 말하였습니다. “아브넬, 저 젊은이는 누구의 아들입니까?” 아브넬이 대답하였습니다. “왕이여, 왕의 생명을 두고 맹세합니다. 저는 알지 못합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 서약 공식으로, 문자적으로는 ‘왕의 생명이 살아 있듯이’입니다. 관용적으로는 ‘왕께서 살아 계심을 두고 맹세합니다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹצֵא לִקְרַאת הַפְּלִשְׁתִּי
  english_pob_choice: going out to meet the Philistine
  chosen_korean: 블레셋 사람을 맞으러 나가는 것
  alternatives_korean:
