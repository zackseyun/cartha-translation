  rationale: 서약 문맥에서 אִם은 축약된 부정 맹세로 기능하므로, 한국어 독자가 즉시 이해할 수 있게 부정 답변으로 풀어 주되 맹세의 어조는 앞 절의 서약 표현으로 보존했습니다.
  doctrine_reference: 히브리어 서약 관용구의 문맥적 번역 원칙
