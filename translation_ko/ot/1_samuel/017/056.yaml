lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 그리고 ... 말했습니다
  alternatives_korean:
  - 그리하여 ... 말했습니다
  - 그런 다음 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속형의 서술 진행을 한국어 연결어로 살리되, 문어체 합쇼체에서 자연스러운 흐름을 유지했습니다.
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 그 왕
  lexicon: HALOT
  rationale: 히브리어는 이름 대신 직함을 사용하므로, 문맥상 사울을 가리키더라도 ‘왕’으로 직역해 서술의 초점을 보존했습니다.
- source_word: שְׁאַל
  english_pob_choice: inquire
  chosen_korean: 알아보십시오
  alternatives_korean:
  - 물어보십시오
  - 문의하십시오
  lexicon: HALOT
  rationale: 명령형 שׁאל의 의미를 단순한 질문 행위보다 ‘조사하여 알아봄’으로 옮기는 것이 문맥에 더 자연스럽고, 영문 POB의 formal register와도 맞습니다.
- source_word: בֶּן מִי זֶה
  english_pob_choice: whose son this
  chosen_korean: 누구의 아들인지
  alternatives_korean:
  - 어느 집 아들인지
  - 누구 아들인지
  lexicon: HALOT
  rationale: 히브리어 관용구의 가문/부계 소속 질문을 그대로 드러내는 표현으로, 현대 한국어에서 가장 분명하고 자연스럽습니다.
