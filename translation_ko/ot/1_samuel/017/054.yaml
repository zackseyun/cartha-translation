id: 1SA.17.54
reference: 1 Samuel 17:54
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח דָּוִד֙ אֶת רֹ֣אשׁ הַ/פְּלִשְׁתִּ֔י וַ/יְבִאֵ֖/הוּ יְרוּשָׁלִָ֑ם וְ/אֶת כֵּלָ֖י/ו שָׂ֥ם בְּ/אָהֳלֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/054.yaml
  text: David took the head of the Philistine and brought it to Jerusalem[b][a], and he put his weapons in his tent.
  footnotes:
  - marker: a
    text: Or 'his gear' or 'his equipment'; the Hebrew term is broad and can include weapons, armor, or military articles.
    reason: lexical_alternative
  - marker: b
    text: Some readers see a chronological tension in 'brought it to Jerusalem,' since Jerusalem was not yet fully under Israelite control at this point in the broader narrative. The translation preserves the Hebrew wording rather than harmonizing it.
    reason: cultural_note
translation:
  language: ko
  text: 다윗은 그 블레셋 사람의 머리를 가져다가 예루살렘으로 옮겼으며,[b] 그 블레셋 사람의 무기들을 자기 장막에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무기들’로 번역한 히브리어 표현은 넓은 의미를 지니며, 무기, 장비, 갑옷, 또는 군사용 물품을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘예루살렘으로 옮겼다’는 표현은, 더 넓은 서사에서 이 시점에 예루살렘이 아직 완전히 이스라엘의 지배 아래 있지 않았을 수 있다는 점과 관련하여 시간상의 긴장을 보입니다. 번역은 이를 조화시키지 않고 히브리어 본문의 표현을 그대로 보존합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 가져다가
  alternatives_korean:
  - 취했습니다
  - 들고 갔습니다
  lexicon: HALOT
  rationale: 서술형 wayyiqtol의 단순한 진행을 살리면서, 뒤의 목적어인 머리를 ‘가져가다’로 자연스럽게 연결했습니다.
- source_word: רֹאשׁ הַפְּלִשְׁתִּי
  english_pob_choice: the head of the Philistine
  chosen_korean: 그 블레셋 사람의 머리
  alternatives_korean:
  - 블레셋 사람의 머리
  - 블레셋 사람 그 머리
  lexicon: HALOT
  rationale: 문맥상 골리앗의 잘린 머리라는 직설적 의미를 유지하되, 한국어에서는 소유를 풀어 ‘그 블레셋 사람의 머리’가 가장 자연스럽습니다.
- source_word: יְרוּשָׁלִָם
  english_pob_choice: Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 예루살렘 성
  lexicon: HALOT
  rationale: 고유명사는 통용 표기인 ‘예루살렘’을 유지했습니다.
- source_word: כֵּלָיו
  english_pob_choice: his weapons
  chosen_korean: 그의 무기들
  alternatives_korean:
  - 그의 장비
  - 그의 기구들
  - 그의 갑옷
  lexicon: HALOT
  rationale: כְּלִי의 넓은 의미를 살리되, 전투 맥락에서는 무기와 군사 장비가 핵심이므로 ‘무기들’로 옮겼습니다. 영어 주석의 넓은 어휘 범위는 본문 각주로 반영할 수 있습니다.
- source_word: בְּאָהֳלוֹ
  english_pob_choice: in his tent
  chosen_korean: 자기 장막에
  alternatives_korean:
  - 그의 장막에
  - 자기 천막에
  lexicon: HALOT
  rationale: אָהֶל의 기본 의미인 ‘장막/천막’을 살렸고, 소유격은 한국어에서 자연스러운 재귀 표현 ‘자기’로 처리했습니다.
theological_decisions:
- issue: ‘예루살렘으로 가져갔다’의 역사적 긴장 보존
  chosen_reading: 본문의 표현을 그대로 옮겨 ‘예루살렘으로 가져갔고’라고 했습니다.
  alternative_readings:
  - 장차 예루살렘으로 가져갔다
  - 예루살렘 쪽으로 가져갔다
  rationale: 본문은 설명 없이 직접 서술하므로, 넓은 서사적·역사적 긴장을 해소하지 않고 원문 표현을 보존하는 것이 번역 원칙에 맞습니다.
  doctrine_reference: 텍스트가 드러내는 긴장을 평탄화하지 않음
- issue: 장막 소유격의 귀속
  chosen_reading: 마지막 절은 다윗이 자기 장막에 무기를 두었다는 뜻으로 읽었습니다.
  alternative_readings:
  - 블레셋 사람의 장막
  - 공동 군막
  rationale: 가장 가까운 문맥에서 다윗이 전리품을 보관하는 장면으로 읽는 것이 자연스럽고, 영어 POB의 해석도 이를 따릅니다.
  doctrine_reference: 문맥 우선의 지시대상 해석
