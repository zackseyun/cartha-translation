language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּקֻ֣מוּ אַנְשֵׁי֩ יִשְׂרָאֵ֨ל וִ/יהוּדָ֜ה וַ/יָּרִ֗עוּ וַֽ/יִּרְדְּפוּ֙ אֶת הַ/פְּלִשְׁתִּ֔ים עַד בּוֹאֲ/ךָ֣ גַ֔יְא וְ/עַ֖ד שַׁעֲרֵ֣י עֶקְר֑וֹן וַֽ/יִּפְּל֞וּ חַֽלְלֵ֤י פְלִשְׁתִּים֙ בְּ/דֶ֣רֶךְ שַׁעֲרַ֔יִם וְ/עַד גַּ֖ת וְ/עַד עֶקְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/052.yaml
  text: Then the men of Israel and Judah rose up and shouted[a], and they pursued the Philistines as far as Gai and as far as the gates of Ekron. The slain Philistines fell along the road to Shaaraim[b], as far as Gath and as far as Ekron.
  footnotes:
  - marker: a
    text: Hebrew 'as far as the entrance to the valley.' The phrase is textually and syntactically difficult; some understand it as a place name or render it more literally but less clearly.
    reason: textual_variant
  - marker: b
    text: Or 'raised a war cry.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘과 유다의 남자들이 일어나 함성을 지르고, 블레셋 사람들을 뒤쫓아 가이와 에그론의 성문까지 이르렀습니다. 블레셋의 살해된 자들은 샤아라임으로 가는 길에 쓰러졌고, 가드까지, 그리고 에그론까지 이르렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘골짜기의 어귀까지’로도 이해될 수 있는 어려운 구절입니다. 여기서는 고유 지명 ‘가이’로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘전쟁 함성을 지르고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ אַנְשֵׁי יִשְׂרָאֵל וִיהוּדָה
  english_pob_choice: the men of Israel and Judah rose up
  chosen_korean: 이스라엘과 유다의 남자들이 일어나다
  alternatives_korean:
  - 이스라엘과 유다의 사람들이 일어나다
  - 이스라엘과 유다의 용사들이 일어나다
  lexicon: HALOT
  rationale: אַנְשֵׁי는 문자적으로 ‘남자들’이므로 군사적 맥락을 유지하면서도 과도한 해석을 피했습니다.
- source_word: וַיָּרִיעוּ
  english_pob_choice: shouted
  chosen_korean: 함성을 지르다
  alternatives_korean:
  - 외치다
  - 전투 함성을 지르다
  lexicon: HALOT
  rationale: 이 동사는 전투 상황의 큰 외침을 가리키므로, 현대 한국어에서 자연스러우면서도 전투적 뉘앙스를 살리는 표현을 택했습니다.
- source_word: עַד בּוֹאֲךָ גַיְא
  english_pob_choice: as far as Gai
  chosen_korean: 가이까지
  alternatives_korean:
  - 골짜기 어귀까지
  - 가이, 곧 골짜기 어귀까지
  lexicon: HALOT
  rationale: 영어 POB가 이 어려운 구절을 지명 ‘Gai’로 처리한 데 따라, 한국어도 해석을 덧붙이지 않고 음역형 지명을 유지했습니다.
- source_word: וַיִּפְּלוּ חַלְלֵי פְלִשְׁתִּים
  english_pob_choice: The slain Philistines fell
  chosen_korean: 블레셋의 살해된 자들은 쓰러졌고
  alternatives_korean:
  - 블레셋 사람들의 시체가 쓰러졌고
  - 블레셋의 전사자들이 쓰러졌고
  lexicon: HALOT
  rationale: חַלְלֵי는 단순 부상자가 아니라 전사한 자들을 가리키므로, ‘살해된 자들’로 옮겨 전투 결과를 분명히 했습니다.
- source_word: בְּדֶרֶךְ שַׁעֲרַיִם
  english_pob_choice: along the road to Shaaraim
  chosen_korean: 샤아라임으로 가는 길에
  alternatives_korean:
  - 샤아라임 길에서
  - 샤아라임 길을 따라
  lexicon: HALOT
  rationale: בְּדֶרֶךְ는 특정 장소를 향하는 경로를 뜻하므로, 한국어에서는 가장 자연스러운 ‘~으로 가는 길’로 풀었습니다.
theological_decisions:
- issue: 전투 승리의 묘사를 한국어에서 과도하게 미화할지 여부
  chosen_reading: 서술을 간결하게 유지하여, 일어남-함성-추격-전사자 발생의 연쇄를 그대로 드러냈습니다.
  alternative_readings:
  - 승리의 환호가 울려 퍼졌습니다
  - 그들이 대승을 거두었습니다
  rationale: 본문은 신학적 해설보다 사건의 급진적 진행을 보여 주므로, 추가 평가어 없이 서술했습니다.
  doctrine_reference: 성경 서술의 사건 중심성
