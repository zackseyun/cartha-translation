base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/005.yaml
  text: He had a bronze helmet on his head[a], and he was clothed with a coat of scale armor[b]; and the weight of the coat was five thousand shekels of bronze.
  footnotes:
  - marker: a
    text: Or 'a coat of mail.' The Hebrew more specifically describes armor made of overlapping scales.
    reason: lexical_alternative
  - marker: b
    text: Five thousand shekels is approximately 125 pounds, or about 57 kilograms.
    reason: cultural_note
translation:
  language: ko
  text: 청동 투구를 머리에 썼고, 비늘 갑옷을 입고 있었는데[a], 그 갑옷의 무게는 청동 오천 세겔이었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '비늘을 덧댄 갑옷'. 히브리어는 더 구체적으로 겹친 비늘로 만든 갑옷을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 오천 세겔은 대략 57킬로그램, 곧 약 125파운드입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כּוֹבַע / נְחֹשֶׁת
  english_pob_choice: bronze helmet
  chosen_korean: 놋 투구
  alternatives_korean:
  - 청동 투구
  - 구리 투구
  lexicon: HALOT
  rationale: 군사적 맥락에서 ראשׁ 위의 보호구를 자연스럽게 옮기기 위해 '투구'를 택했고, נְחֹשֶׁת은 한국어 성경에서 널리 쓰이는 '놋'으로 옮겨 재료 감각을 살렸습니다.
- source_word: שִׁרְיוֹן קַשְׂקַשִּׂים
  english_pob_choice: coat of scale armor
  chosen_korean: 비늘 갑옷
  alternatives_korean:
  - 비늘 갑옷을 입은 갑옷
  - 비늘 사슬 갑옷
  - 조각 비늘 갑옷
  lexicon: HALOT
  rationale: '''scale armor''의 구조를 직접 드러내기 위해 ''비늘 갑옷''으로 간결하게 옮겼습니다. 영어 POB가 ''coat of mail''과의 혼동을 피하려고 ''scale armor''를 택한 취지를 반영했습니다.'
- source_word: הוּא לָבוּשׁ
  english_pob_choice: he was clothed with
  chosen_korean: 입고 있었는데
  alternatives_korean:
  - 둘러입고 있었는데
  - 옷 입은 상태였는데
  lexicon: HALOT
  rationale: 히브리어의 상태적 표현을 한국어에서 자연스러운 서술로 살리되, 단순 과거보다 당시의 착용 상태를 나타내도록 '입고 있었는데'로 옮겼습니다.
- source_word: חֲמֵשֶׁת אֲלָפִים שְׁקָלִים
  english_pob_choice: five thousand shekels
  chosen_korean: 놋 오천 세겔
  alternatives_korean:
  - 오천 세겔
  - 약 57킬로그램
  lexicon: HALOT
  rationale: 본문의 고대 단위를 그대로 보존해 원문 투명성을 유지했습니다. 재료명도 앞부분과 맞춰 '놋'으로 반복해 히브리어의 질감과 무게감을 살렸습니다.
