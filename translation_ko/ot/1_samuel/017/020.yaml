base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/020.yaml
  text: So David rose early in the morning[a], left the sheep with a keeper, took the supplies, and went, just as Jesse had commanded him[b]. He came to the encampment as the army was going out to the battle line and shouting the war cry.
  footnotes:
  - marker: a
    text: Or 'the camp-circle' or 'the wagon-rampart'; the Hebrew term may refer more specifically to the camp's circular formation or defensive perimeter.
    reason: lexical_alternative
  - marker: b
    text: Literally 'and they shouted in/for the battle.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 다윗은 아침 일찍 일어나 양을 지키는 사람에게 맡겨 두고, 짐을 가지고, 이새가 그에게 명령한 그대로 갔습니다. 그는 군대가 전열로 나아가며 전쟁 함성을 지르는 동안 진영에 도착했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 군영의 원형 배치나 방어용 둘레를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘전쟁에서/전쟁을 향하여 함성을 지르며’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  english_pob_choice: rose early in the morning
  chosen_korean: 아침 일찍 일어나
  alternatives_korean:
  - 이른 아침에 일어나
  - 아침에 일찍 일어나
  lexicon: HALOT
  rationale: 동사의 조기 기상을 자연스러운 합쇼체로 살리되, 한국어에서 가장 유려한 시간 표현을 선택했습니다.
- source_word: וַיִּטֹּשׁ אֶת הַצֹּאן עַל שֹׁמֵר
  english_pob_choice: left the sheep with a keeper
  chosen_korean: 양을 지키는 사람에게 맡겨 두고
  alternatives_korean:
  - 양을 지키는 자에게 남겨 두고
  - 양을 맡아 지키는 이에게 넘겨 두고
  lexicon: HALOT
  rationale: 단순히 두고 간 것이 아니라 돌봄 아래 맡긴 뜻을 드러내기 위해 ‘맡겨 두다’를 택했습니다.
- source_word: וַ/יִּשָּׂא
  english_pob_choice: took the supplies
  chosen_korean: 짐을 가지고
  alternatives_korean:
  - 물품을 가지고
  - 준비물을 가지고
  lexicon: HALOT
  rationale: 히브리어는 앞 문맥의 물품을 지칭하므로, 문맥상 보충되는 대상을 한국어에서는 간결하게 ‘짐’으로 살렸습니다.
- source_word: הַמַּעְגָּלָה
  english_pob_choice: the encampment
  chosen_korean: 진영
  alternatives_korean:
  - 부대 진지
  - 야영지
  lexicon: HALOT
  rationale: 어휘가 가리키는 군사적 주거/배치 공간을 한국어 군사 문맥에 맞는 ‘진영’으로 옮기고, 더 구체적인 뉘앙스는 영문 주해가 보존합니다.
- source_word: וְהֵרֵעוּ בַּמִּלְחָמָה
  english_pob_choice: shouting the war cry
  chosen_korean: 전쟁 함성을 지르는
  alternatives_korean:
  - 전투 함성을 외치는
  - 전쟁 함성을 외치는
  lexicon: HALOT
  rationale: רוע의 전투적 함성 의미를 살려 단순 ‘외치다’보다 군사적 울림이 분명한 표현으로 옮겼습니다.
theological_decisions:
- issue: 군사적 진행 동작의 동시성
  chosen_reading: 다윗이 도착했을 때 군대는 이미 전열로 나아가며 함성을 지르고 있었습니다.
  alternative_readings:
  - 군대가 전열로 나아가고 있었다
  - 군대가 전열로 나아가며 함성을 질렀다
  rationale: 분사 구조를 배경 상황으로 처리하여 서사의 동시성을 보존했습니다.
  doctrine_reference: 서사적 시제와 분사 구문의 문법적 관찰
