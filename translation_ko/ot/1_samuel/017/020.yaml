- from: 그리하여 다윗은 아침 일찍 일어나 양을 지키는 사람에게 맡겨 두고, 짐을 가지고, 이새가 그에게 명령한 그대로 갔습니다. 그는 군대가 전열로 나아가며 전쟁 함성을 지르는 동안 진영에 도착했습니다.[a][b]
  to: 그리하여 다윗은 아침 일찍 일어나 양을 지키는 사람에게 맡겨 두고, 짐을 챙겨 이새가 그에게 명령한 대로 갔습니다. 그가 진영[a]에 이르렀을 때, 군대는 전열로 나아가 전투 함성을 지르고 있었습니다.[b]
