  yaml_path: translation/ot/1_samuel/017/034.yaml
  text: David said to Saul[a], “Your servant was tending his father’s sheep[b], and when a lion or a bear would come and carry off a lamb from the flock,”
  footnotes:
  - marker: a
    text: 'Or, more formally, ''the lion and the bear''; the Hebrew uses ''and,'' but the sense is likely distributive: either predator would come.'
    reason: lexical_alternative
  - marker: b
    text: '''A lamb'' may also be rendered ''a sheep'' or ''one animal of the flock,'' since the Hebrew term can be broader than a young lamb.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 사울에게 말했습니다. “저는 아버지의 양 떼를 돌보는 목자였습니다. 사자나 곰이 와서 양 떼에서 양 한 마리를[a] 낚아채 가곤 했습니다[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘양 한 마리’로 옮긴 히브리어 שֶׂה는 ‘어린 양’으로도 번역될 수 있지만, 반드시 어린 양만을 뜻하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘낚아채 가다’는 히브리어 וְנָשָׂא가 여기서 포식자가 짐승을 붙들어 가져가는 뜻으로 쓰인 것을 반영한 표현입니다.
    reason: source_note
lexical_decisions:
