review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys David's humble self-reference, his pastoral work for his father, the distributive sense of lion or bear, and the likely habitual force of the predator episodes. However, ‘아버지를 위하여 양 떼를 치고’ is less idiomatic and can sound as though David was tending the father himself; ‘아버지의 양 떼를 돌보는 목자’ clearly expresses the Hebrew relationship. The Hebrew שֶׂה is broader than ‘어린 양,’ so ‘양 한 마리’ better preserves the lexical ambiguity.
  naturalness: ‘당신의 종’ and ‘아버지를 위하여 양 떼를 치고 있었는데’ are overly literal and somewhat unnatural in modern Korean dialogue. ‘저는 아버지의 양 떼를 돌보는 목자였습니다’ is natural formal-polite Korean while retaining the deferential first-person force in context. Footnote markers should be placed immediately after the words they explain, not after the closing quotation mark.
  terminology: ‘목자,’ ‘양 떼,’ ‘사자,’ ‘곰,’ and ‘낚아채 가다’ are suitable. Replacing ‘어린 양’ with ‘양 한 마리’ avoids making the young-animal sense more specific than the Hebrew requires.
  issues:
  - severity: medium
    issue: ‘아버지를 위하여 양 떼를 치고’ is syntactically awkward and imprecise.
    rationale: לְאָבִיו indicates David's pastoral service in relation to his father; in Korean, ‘아버지의 양 떼를 돌보다’ communicates this naturally without suggesting that the father is the direct object of service.
  - severity: medium
    issue: ‘어린 양’ narrows שֶׂה unnecessarily.
    rationale: שֶׂה can refer more broadly to an animal of the flock, including a sheep and not necessarily a young lamb. ‘양 한 마리’ is a natural Korean rendering that retains this ambiguity.
  - severity: low
    issue: Footnote markers are not anchored to their referents.
    rationale: The note on שֶׂה should follow ‘양 한 마리,’ and the note on וְנָשָׂא should follow ‘낚아채 가다.’
  revised_text: 다윗이 사울에게 말했습니다. “저는 아버지의 양 떼를 돌보는 목자였습니다. 사자나 곰이 와서 양 떼에서 양 한 마리를[a] 낚아채 가곤 했습니다[b],”
  revised_footnotes:
  - marker: a
    text: ‘양 한 마리’로 옮긴 히브리어 שֶׂה는 ‘어린 양’으로도 번역될 수 있지만, 반드시 어린 양만을 뜻하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘낚아채 가다’는 히브리어 וְנָשָׂא가 여기서 포식자가 짐승을 붙들어 가져가는 뜻으로 쓰인 것을 반영한 표현입니다.
    reason: source_note
  revision_rationale: The revision improves natural Korean expression of David's service as a shepherd, retains the likely repeated-past sense with ‘-곤 했습니다,’ preserves the lexical breadth of שֶׂה, and places both explanatory notes at their proper textual anchors. The final comma is retained because the direct speech continues into the following verse.
