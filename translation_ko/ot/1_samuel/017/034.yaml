id: 1SA.17.34
reference: 1 Samuel 17:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל שָׁא֔וּל רֹעֶ֨ה הָיָ֧ה עַבְדְּ/ךָ֛ לְ/אָבִ֖י/ו בַּ/צֹּ֑אן וּ/בָ֤א הָֽ/אֲרִי֙ וְ/אֶת הַ/דּ֔וֹב וְ/נָשָׂ֥א שֶׂ֖ה מֵ/הָ/עֵֽדֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/034.yaml
  text: David said to Saul[a], “Your servant was tending his father’s sheep[b], and when a lion or a bear would come and carry off a lamb from the flock,”
  footnotes:
  - marker: a
    text: 'Or, more formally, ''the lion and the bear''; the Hebrew uses ''and,'' but the sense is likely distributive: either predator would come.'
    reason: lexical_alternative
  - marker: b
    text: '''A lamb'' may also be rendered ''a sheep'' or ''one animal of the flock,'' since the Hebrew term can be broader than a young lamb.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 사울에게 말했습니다. 「당신의 종은 아버지를 위하여 양 떼를 치고 있었는데, 사자나 곰이 와서 무리에서 어린 양 하나를 낚아채 가곤 했습니다」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘낚아채 가다’는 히브리어 וְנָשָׂא의 포식적 탈취를 한국어로 풀어낸 표현입니다.
    reason: source_note
  - marker: b
    text: ‘어린 양’은 히브리어 שֶׂה의 가능한 의미들 가운데, 이 목양·포식 문맥에서 가장 자연스러운 선택입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה
  english_pob_choice: a shepherd / tending his father’s sheep
  chosen_korean: 양 떼를 치고 있었는데
  alternatives_korean:
  - 목자였는데
  - 아버지의 양을 돌보고 있었는데
  lexicon: HALOT
  rationale: רֹעֶה는 직업명으로도 읽히지만, 이 문맥에서는 다윗의 지속적 목양 행위를 자연스럽게 드러내는 동사구가 한국어에 가장 잘 맞습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 주님의 종
  lexicon: HALOT
  rationale: 사울에게 하는 겸양 표현이므로 기본값인 ‘종’을 따르되, 본문이 지닌 궁정적 공손함을 한국어로 유지했습니다.
- source_word: וּבָא ... וְנָשָׂא
  english_pob_choice: when a lion or a bear would come and carry off
  chosen_korean: 사자나 곰이 와서 ... 낚아채 가곤 했습니다
  alternatives_korean:
  - 사자나 곰이 와서 ... 가져가곤 했습니다
  - 사자나 곰이 와서 ... 빼앗아 가곤 했습니다
  lexicon: HALOT
  rationale: 연이은 서술의 반복적 과거를 한국어의 ‘-곤 했습니다’로 살렸고, נשא는 포식자가 먹잇감을 ‘들고 가다’보다 ‘낚아채 가다’가 더 생생하게 대응합니다.
- source_word: שֶׂה מֵהָעֵדֶר
  english_pob_choice: a lamb from the flock
  chosen_korean: 무리에서 어린 양 하나
  alternatives_korean:
  - 무리에서 양 한 마리
  - 떼에서 새끼 양 하나
  lexicon: HALOT
  rationale: שֶׂה는 넓게는 양 한 마리를 가리킬 수 있으나, 여기서는 어린 동물을 뜻하는 맥락이 강해 ‘어린 양’으로 옮기되, 수량감을 분명히 했습니다.
theological_decisions:
- issue: 회고 서술의 시제와 반복성
  chosen_reading: 과거 한 번의 사건이 아니라, 사자나 곰이 올 때마다 반복되었던 상황으로 읽어 한국어에서 관습적 반복을 나타내는 표현을 사용했습니다.
  alternative_readings:
  - 단순 과거형으로 한 번의 사건처럼 옮김
  - 현재형으로 생생한 서술로 옮김
  rationale: 히브리어 진행/서술 흐름과 POB의 최신 복원 취지(반복적 과거)를 반영해, 사건의 반복성과 기억의 현장감을 함께 유지했습니다.
  doctrine_reference: 서사 문맥의 시간성/상(Aspect)
