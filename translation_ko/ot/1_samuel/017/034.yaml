  lexicon: HALOT
  rationale: שֶׂה는 넓게는 양 한 마리를 가리킬 수 있으나, 여기서는 어린 동물을 뜻하는 맥락이 강해 ‘어린 양’으로 옮기되, 수량감을 분명히 했습니다.
