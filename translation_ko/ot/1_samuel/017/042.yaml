  text: 블레셋 사람이 바라보다가 다윗을 보고 그를 업신여겼습니다. 다윗이 젊은이이고 붉은빛이 돌며[a] 용모가 아름다웠기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
