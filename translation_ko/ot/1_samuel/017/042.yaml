  lexicon: HALOT
  rationale: 히브리어는 여기서 민족명칭을 사용하므로, 인물 식별은 유지하되 원문 수준을 넘는 ‘전사’는 넣지 않았습니다.
- source_word: וַיִּבְזֵהוּ
  english_pob_choice: he despised him
  chosen_korean: 그를 업신여겼습니다
  alternatives_korean:
  - 그를 멸시했습니다
  - 그를 경멸했습니다
  lexicon: HALOT
  rationale: בזה의 핵심은 상대를 낮추어 무시하는 태도이므로, 현대 한국어에서 관계적 경멸감을 잘 드러내는 ‘업신여기다’를 택했습니다.
- source_word: אַדְמֹנִי
  english_pob_choice: ruddy
  chosen_korean: 붉은 기운이 돌며
  alternatives_korean:
  - 불그스름하며
  - 붉은빛이 도는
  lexicon: HALOT
  rationale: 이 형용사는 단순한 머리색보다 붉은 기운이 도는 색조를 가리킬 수 있어, POB의 주석 가능성을 살려 특정 부위로 한정하지 않는 표현을 썼습니다.
theological_decisions:
- issue: 다윗의 외모 묘사 범위
  chosen_reading: ‘붉은 기운이 돌며 외모가 아름다웠다’로 옮겨, אַדְמֹנִי를 머리색으로 단정하지 않았습니다.
  alternative_readings:
  - ‘붉은 머리’
  - ‘붉은빛이 도는’
  rationale: 원문과 POB 주석은 색조의 넓은 범위를 허용하므로, 해석을 좁히는 번역은 피하고 문맥상 가능한 폭을 보존했습니다.
  doctrine_reference: '번역 원칙: 원문의 의미 범위 보존'
- issue: 인물 평가의 정서적 강도
  chosen_reading: ‘업신여겼습니다’로 강한 경멸을 드러냈습니다.
  alternative_readings:
  - ‘무시했습니다’
  - ‘깔보았습니다’
  rationale: 블레셋 사람의 반응은 단순한 무시보다 노골적 경멸에 가깝기 때문에, 원문의 정서를 약화시키지 않는 표현을 선택했습니다.
  doctrine_reference: 서사 정서 보존
