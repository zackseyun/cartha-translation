    text: 히브리어 אַדְמֹנִי는 머리색만이 아니라 붉은빛이 도는 전반적 색조를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  english_pob_choice: looked
  chosen_korean: 보고
  alternatives_korean:
  - 응시하고
  - 쳐다보고
  lexicon: HALOT
  rationale: 첫 동작은 단순히 시선을 두는 의미이므로, 자연스러운 서술인 ‘보고’로 옮겨 과도한 해석을 피했습니다.
- source_word: הַפְּלִשְׁתִּי
  english_pob_choice: the Philistine
  chosen_korean: 블레셋 사람
