  text: And when the Philistine rose and came and drew near to meet David[a], David hurried and ran toward the battle line to meet the Philistine.
  footnotes:
  - marker: a
    text: Or "toward the ranks." The Hebrew noun can refer to a battle line or battle array.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 블레셋 사람이 일어나 다윗을 맞으러 다가오자, 다윗은 서둘러 블레셋 사람을 맞으려고 전열을[a] 향해 달려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “전투 대형”. 히브리어 명사는 전열 또는 전투 대형을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And when
  chosen_korean: 그리고 … 자
  alternatives_korean:
  - 그리고 … 때
  - 그러자
  lexicon: HALOT
  rationale: 서사 도입의 시간 전환을 자연스럽게 살리기 위해 ‘그리고 … 자’ 구조를 택했습니다.
- source_word: הַפְּלִשְׁתִּי
  english_pob_choice: the Philistine
  chosen_korean: 블레셋 사람
  alternatives_korean:
  - 그 블레셋 사람
  - 블레셋인
  lexicon: HALOT
  rationale: 문맥상 특정 인물을 가리키지만, 본문은 단순히 ‘블레셋 사람’이라 하므로 군더더기 없는 직역을 택했습니다.
- source_word: לִקְרַאת
  english_pob_choice: to meet
  chosen_korean: 맞으려고
  alternatives_korean:
  - 맞으러
  - 대적하려고
  - 마주하려고
  lexicon: HALOT
  rationale: 두 번 반복되는 ‘만남/대면’의 움직임을 한국어에서 목적의 표현으로 살려, 단순 이동이 아니라 대결적 조우를 드러냈습니다.
- source_word: הַמַּעֲרָכָה
  english_pob_choice: toward the battle line
  chosen_korean: 전열을 향해
  alternatives_korean:
  - 전열을 향하여
  - 전투 진열을 향해
  - 진을 향해
  lexicon: HALOT
  rationale: 이 명사는 전투 대형을 가리킬 수 있으므로, POB의 ‘battle line’에 맞춰 군사적 배열을 드러내는 ‘전열’을 사용했습니다.
theological_decisions:
- issue: 서술의 속도와 긴장감
  chosen_reading: 다윗이 ‘서둘러 달려’ 블레셋 사람을 맞으러 가는 동작을 앞뒤 동사로 겹쳐 빠른 전개를 살렸습니다.
  alternative_readings:
  - 다윗은 달려갔습니다
  - 다윗은 급히 달렸습니다
  rationale: 히브리어의 연속 동작(‘서둘러’, ‘달려’)이 전투 장면의 긴장감을 형성하므로, 그 힘을 약화시키지 않도록 중첩 표현을 유지했습니다.
  doctrine_reference: 서사적 강조를 보존하는 번역 원칙
