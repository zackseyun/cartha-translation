  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם יוּכַ֞ל לְ/הִלָּחֵ֤ם אִתִּ/י֙ וְ/הִכָּ֔/נִי וְ/הָיִ֥ינוּ לָ/כֶ֖ם לַ/עֲבָדִ֑ים וְ/אִם אֲנִ֤י אֽוּכַל ל/וֹ֙ וְ/הִכִּיתִ֔י/ו וִ/הְיִ֤יתֶם לָ֨/נוּ֙ לַ/עֲבָדִ֔ים וַ/עֲבַדְתֶּ֖ם אֹתָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/009.yaml
  text: If he is able to fight with me and strike me down[a], then we will be your slaves. But if I prevail against him and strike him down[c][b], then you will be our slaves and serve us.
  footnotes:
  - marker: a
    text: Or 'servants' in both occurrences of עֲבָדִים; here 'slaves' is used because the context is national subjugation and bonded service after combat.
    reason: lexical_alternative
  - marker: b
    text: The verb יכל in 'if I prevail against him' can more literally express ability ('if I am able against him'), but in this combat context it carries the sense of overcoming or prevailing.
    reason: lexical_alternative
  - marker: c
    text: The verb נכה in both clauses may also be rendered 'kill' or 'defeat'; 'strike down' preserves the decisive force while leaving the wording closer to the Hebrew.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나와 싸워 나를 쓰러뜨릴 수 있으면, 우리는 당신들의 노예가 될 것입니다. 그러나 내가 그를 이겨 그를 쓰러뜨리면, 당신들은 우리의 노예가 되어 우리를 섬기게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עֲבָדִים은 여기서 전쟁 패배 뒤의 예속 상태를 가리키므로, 문맥의 강도를 살려 '노예'로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּכַל לְהִלָּחֵם אִתִּי
  english_pob_choice: If he is able to fight with me
  chosen_korean: 그가 나와 싸워
  alternatives_korean:
  - 그가 나와 싸울 수 있으면
  - 그가 나와 전투할 수 있으면
  lexicon: HALOT
  rationale: יכל은 단순 가능성을 넘어서 여기서는 도전 상황에서의 성립 여부를 묻는 표현이므로, 자연스러운 조건 구조로 옮겼습니다.
- source_word: וְהִכָּנִי / וְהִכִּיתִיו
  english_pob_choice: strike me down / strike him down
  chosen_korean: 나를 쓰러뜨릴 수 있으면 / 그를 쓰러뜨리면
  alternatives_korean:
  - 나를 치면 / 그를 치면
  - 나를 죽이면 / 그를 죽이면
  lexicon: HALOT
  rationale: נכה는 여기서 결정적인 타격을 뜻하지만, 원문의 직접성을 살리면서도 '죽이다'보다 덜 특정하게 '쓰러뜨리다'로 옮겼습니다.
- source_word: לַעֲבָדִים
  english_pob_choice: slaves
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 하인
  lexicon: HALOT
  rationale: 전투 후 복속과 지배를 말하는 문맥이므로, 단순한 봉사보다 예속 상태를 드러내는 '노예'가 원문의 강도를 더 잘 반영합니다.
- source_word: וַעֲבַדְתֶּם אֹתָנוּ
  english_pob_choice: and serve us
  chosen_korean: 우리를 섬기게 될 것입니다
  alternatives_korean:
  - 우리에게 복무하게 될 것입니다
  - 우리에게 봉사하게 될 것입니다
  lexicon: HALOT
  rationale: 동사 עבד의 결과를 한국어로 자연스럽게 풀어, 앞의 '노예가 되다'와 병렬을 이루도록 했습니다.
theological_decisions:
- issue: 전투 도전 발화의 등록(register)
  chosen_reading: 직접 화법을 현대 한국어 조건문과 결과문으로 옮겨, 공격적 협박의 힘을 약화하지 않았습니다.
  alternative_readings:
  - 더 완곡한 경쟁 구도로 약화
  - 전반을 의역하여 도전 의미만 남김
  rationale: 본문은 개인 결투를 넘어 집단의 예속을 건 공개 도전이므로, 정서적 강도를 보존하는 것이 중요합니다.
  doctrine_reference: 본문 맥락 보존 원칙
