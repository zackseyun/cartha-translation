  text: Also bring these ten cuts of cheese to the commander of the thousand[a], check on your brothers’ welfare, and bring back some token from them.
  footnotes:
  - marker: a
    text: Or “their pledge,” that is, some item or sign brought back as proof of your brothers’ condition.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 이 열 점의 치즈를 천 명의 지휘관에게 가져가고[a], 네 형들의 안부를 살피며, 그들에게서 어떤 보증물도 가져오십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 보증물,” 곧 형들의 상태를 증명하는 물건이나 표식이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרִצֵי הֶחָלָב
  english_pob_choice: cuts of cheese
  chosen_korean: 열 점의 치즈
  alternatives_korean:
  - 치즈들
  - 치즈 조각들
  - 유제품 덩이
  lexicon: HALOT
  rationale: הֶחָלָב와 יחד된 חֲרִצֵי는 잘라 놓은 치즈 조각 같은 구체물을 가리키므로, 현대 한국어에서는 자연스럽게 '치즈'로 옮기되 수량은 본문 그대로 살렸습니다.
- source_word: שַׂר הָאָלֶף
  english_pob_choice: commander of the thousand
  chosen_korean: 천 명의 지휘관
  alternatives_korean:
  - 천 명의 대장
  - 천부장
  - 천 명 위의 장교
  lexicon: HALOT
  rationale: שַׂר는 군사적 지도자이고 הָאָלֶף는 천 단위의 부대를 가리키므로, 관습적이지만 고어적인 '천부장' 대신 현대적이면서 구조를 드러내는 '천 명의 지휘관'을 택했습니다.
- source_word: תִּפְקֹד לְשָׁלוֹם
  english_pob_choice: check on your brothers’ welfare
  chosen_korean: 네 형들의 안부를 살피며
  alternatives_korean:
  - 네 형들의 평안을 확인하며
  - 네 형들이 잘 있는지 살피며
  - 네 형들의 복지를 살피며
  lexicon: HALOT
  rationale: פקד는 '살피다, 안부를 확인하다'의 뜻이 자연스럽고, לְשָׁלוֹם은 안녕/평안을 가리키므로 한국어 관용에 맞게 '안부를 살피다'로 옮겼습니다.
- source_word: עֲרֻבָּתָם
  english_pob_choice: some token from them
  chosen_korean: 어떤 보증물도
  alternatives_korean:
  - 그들의 보증
  - 그들에게서 온 증표
  - 어떤 표식도
  lexicon: HALOT
  rationale: עֲרֻבָּה는 문맥상 형들의 상태를 증명할 수 있는 보증물·증표를 뜻하므로, 너무 해석적인 '표식'보다 의미를 드러내는 '보증물'을 택했습니다.
- source_word: תָּבִיא
  english_pob_choice: bring
  chosen_korean: 가져가고
  alternatives_korean:
  - 가져오고
  - 전하고
  - 가지고 가고
  lexicon: HALOT
  rationale: 발화자 입장에서 목적지로 실어 가는 동작이므로 '가져가고'가 자연스럽습니다. 또한 뒤의 동작들과의 병렬을 살렸습니다.
