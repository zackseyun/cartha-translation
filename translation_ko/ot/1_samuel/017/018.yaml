  rationale: שַׂר는 군사적 지도자이고 הָאָלֶף는 천 단위의 부대를 가리키므로, 관습적이지만 고어적인 '천부장' 대신 현대적이면서 구조를 드러내는 '천 명의 지휘관'을 택했습니다.
- source_word: תִּפְקֹד לְשָׁלוֹם
  english_pob_choice: check on your brothers’ welfare
  chosen_korean: 네 형들의 안부를 살피며
