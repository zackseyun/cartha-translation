  text: Also bring these ten cuts of cheese to the commander of the thousand[a], check on your brothers’ welfare, and bring back some token from them.
  footnotes:
  - marker: a
    text: Or “their pledge,” that is, some item or sign brought back as proof of your brothers’ condition.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 이 치즈 열 조각을 천 명으로 된 부대의 지휘관에게 가져가십시오. 네 형들의 안부를 살피고, 그들에게서 증표를[a] 받아 오십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 보증물.” 문맥상 형들의 상태를 확인할 수 있도록 가져오는 물건이나 표식을 가리킬 수 있습니다.
