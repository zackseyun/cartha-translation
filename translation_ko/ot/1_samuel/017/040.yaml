- from: 그는 손에 든 막대기를 집고, 시내에서 매끄러운 돌 다섯 개를 골라 자기에게 있던 목자의 주머니와 주머니에 넣었습니다. 그리고 손에는 물맷돌이 있었습니다. 그 뒤에 그는 블레셋 사람에게 다가갔습니다.[a][b]
  to: 그는 자기 지팡이를 손에 들고, 시내[a]에서 매끄러운 돌 다섯 개를 골라 그가 가지고 있던 목자의 가방, 곧 주머니[b]에 넣었습니다. 물매는 그의 손에 있었습니다. 그러고서 그는 그 블레셋 사람에게 다가갔습니다.
  rationale: 지팡이를 손에 드는 동작, 돌과 물매의 구별, 그리고 목자의 가방과 주머니의 설명적 관계를 원문에 맞게 바로잡았습니다. 지형어와 가방 명칭의 어휘적 폭은 본문을 과도하게 전문화하지 않고 각주에서 보존했습니다.
