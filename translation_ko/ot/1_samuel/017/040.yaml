  edition: WLC
  text: וַ/יִּקַּ֨ח מַקְל֜/וֹ בְּ/יָד֗/וֹ וַ/יִּבְחַר ל֣/וֹ חֲמִשָּׁ֣ה חַלֻּקֵֽי אֲבָנִ֣ים מִן הַ/נַּ֡חַל וַ/יָּ֣שֶׂם אֹ֠תָ/ם בִּ/כְלִ֨י הָ/רֹעִ֧ים אֲשֶׁר ל֛/וֹ וּ/בַ/יַּלְק֖וּט וְ/קַלְּע֣/וֹ בְ/יָד֑/וֹ וַ/יִּגַּ֖שׁ אֶל הַ/פְּלִשְׁתִּֽי־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/040.yaml
  text: He took his staff in his hand and chose for himself five smooth stones from the wadi[a], and put them in the shepherd’s bag that he had, in the pouch; and his sling was in his hand[b]. Then he approached the Philistine.
  footnotes:
  - marker: a
    text: Or 'brook' or 'streambed' for 'wadi' (Hebrew נַחַל), a term often used for a ravine or seasonal watercourse.
    reason: lexical_alternative
  - marker: b
    text: Or 'wallet' for 'pouch' (Hebrew יַלְקוּט), a small bag or satchel used for carrying items.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 손에 든 막대기를 집고, 시내에서 매끄러운 돌 다섯 개를 골라 자기에게 있던 목자의 주머니와 주머니에 넣었습니다. 그리고 손에는 물맷돌이 있었습니다. 그 뒤에 그는 블레셋 사람에게 다가갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '물길'이나 '개울바닥'으로 옮길 수 있는 히브리어 נַחַל입니다.
    reason: lexical_alternative
  - marker: b
    text: '''주머니'' 대신 ''주머니쌈지''나 ''작은 자루''로도 옮길 수 있는 יַלְקוּט입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלוֹ
  english_pob_choice: his staff
  chosen_korean: 막대기
  alternatives_korean:
  - 지팡이
  - 막대
  lexicon: HALOT
  rationale: 목자 배경의 문맥에서 'staff'의 기본 뜻을 살리되, 한국어에서는 자연스럽고 군더더기 없는 '막대기'로 옮겼습니다.
- source_word: חֲמִשָּׁה חַלֻּקֵי אֲבָנִים
  english_pob_choice: five smooth stones
  chosen_korean: 매끄러운 돌 다섯 개
  alternatives_korean:
  - 다듬어진 돌 다섯 개
  - 부드러운 돌 다섯 개
  lexicon: HALOT
  rationale: 돌의 표면 상태를 가리키는 형용사를 직역하여, 시내에서 고른 돌이라는 구체성을 유지했습니다.
- source_word: מִן הַנַּחַל
  english_pob_choice: from the wadi
  chosen_korean: 시내에서
  alternatives_korean:
  - 와디에서
  - 개울에서
  - 시냇바닥에서
  lexicon: HALOT
  rationale: 본문의 지형어를 한국어로는 독자가 바로 이해할 수 있는 '시내'로 옮기되, 물길/마른 물줄기라는 장소감을 남겼습니다.
- source_word: בִּכְלִי הָרֹעִים אֲשֶׁר לוֹ וּבַיַּלְקוּט
  english_pob_choice: in the shepherd’s bag that he had, in the pouch
  chosen_korean: 자기에게 있던 목자의 주머니와 주머니에
  alternatives_korean:
  - 자기 것인 목자의 자루와 주머니에
  - 자기 목자 주머니와 그 주머니에
  lexicon: HALOT
  rationale: כְּלִי와 יַלְקוּט를 모두 담는 용기 표현으로 처리하되, 한국어에서는 두 항목의 관계가 중복되더라도 원문의 누적 나열을 보존했습니다.
- source_word: וְקַלְּעוֹ בְיָדוֹ
  english_pob_choice: and his sling was in his hand
  chosen_korean: 손에는 물맷돌이 있었습니다
  alternatives_korean:
  - 손에는 물맷돌이 들려 있었습니다
  - 슬링이 손에 있었습니다
  lexicon: HALOT
  rationale: 한국어 독자에게 'sling'보다 '물맷돌'이 기능과 이미지를 더 분명히 전달하므로, 무기 형태를 드러내는 전통적 대응어를 사용했습니다.
theological_decisions:
- issue: 전투 장면의 동작 배열과 긴장감 유지
  chosen_reading: 연속 동작을 한국어에서도 '집고… 골라… 넣었습니다. 그리고… 있었습니다. 그 뒤에… 다가갔습니다'로 나누어, 원문의 단계적 진행을 보존했습니다.
  alternative_readings:
  - 한 문장으로 압축하여 더 매끈하게 옮기는 방식
  - 동작을 재배열해 한국어 서술을 우선하는 방식
  rationale: 히브리어의 와우 연속과 열거 효과를 살려, 다윗이 준비를 마치고 접근하는 긴박한 흐름을 드러내는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: 서사 문맥 보존 원칙
