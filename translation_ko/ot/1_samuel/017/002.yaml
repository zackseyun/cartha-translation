  text: וְ/שָׁא֤וּל וְ/אִֽישׁ יִשְׂרָאֵל֙ נֶאֶסְפ֔וּ וַֽ/יַּחֲנ֖וּ בְּ/עֵ֣מֶק הָאֵלָ֑ה וַ/יַּעַרְכ֥וּ מִלְחָמָ֖ה לִ/קְרַ֥את פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/002.yaml
  text: And Saul and the men of Israel gathered together and camped in the Valley of Elah[a], and they drew up for battle against the Philistines.
  footnotes:
  - marker: a
    text: Or 'to meet the Philistines' / 'facing the Philistines.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울과 이스라엘 사람들이 함께 모여 엘라 골짜기에 진을 치고, 블레셋 사람들을 향해 전열을 갖추었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘블레셋 사람들을 향해’는 문자적으로는 ‘블레셋 사람들과 마주하여/맞서’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאוּל
  english_pob_choice: And Saul
  chosen_korean: 사울과
  alternatives_korean:
  - 그리고 사울은
  - 사울은
  lexicon: HALOT
  rationale: 히브리어 접속사 וְ는 앞선 서술과의 연속을 잇지만 한국어에서는 자연스러운 서사 흐름을 위해 문두의 ‘그리고’보다 단순 병렬 ‘사울과’로 처리했습니다.
- source_word: וְאִישׁ יִשְׂרָאֵל
  english_pob_choice: and the men of Israel
  chosen_korean: 이스라엘 사람들이
  alternatives_korean:
  - 이스라엘의 남자들이
  - 이스라엘 군사들이
  - 이스라엘 백성이
  lexicon: HALOT
  rationale: אִישׁ의 집합적 용법을 살리되 현대 한국어에서는 성별을 과도하게 부각하는 ‘남자들’보다 문맥상 군사 집단을 포괄하는 ‘사람들’이 더 자연스럽고, ‘군사들’은 해석을 더 강하게 넣습니다.
- source_word: עֵמֶק הָאֵלָה
  english_pob_choice: Valley of Elah
  chosen_korean: 엘라 골짜기
  alternatives_korean:
  - 엘라 골짜기
  - 엘라 계곡
  - 엘라의 골짜기
  lexicon: HALOT
  rationale: עֵמֶק은 지명 앞에서도 ‘골짜기/계곡’이 가능한데, 본문은 고유 지명으로 굳어진 표현이므로 ‘엘라 골짜기’로 옮겼습니다.
- source_word: וַיַּעַרְכוּ מִלְחָמָה לִקְרַאת פְּלִשְׁתִּים
  english_pob_choice: they drew up for battle against the Philistines
  chosen_korean: 블레셋 사람들을 향해 전열을 갖추었습니다
  alternatives_korean:
  - 블레셋 사람들을 향해 전투 대형을 갖추었습니다
  - 블레셋 사람들 맞은편에 전열을 갖추었습니다
  - 블레셋 사람들과 싸우려 전열을 갖추었습니다
  lexicon: HALOT
  rationale: וַיַּעַרְכוּ מִלְחָמָה는 단순한 ‘전쟁 준비’가 아니라 전투 대형을 갖추는 군사적 표현이므로, 영어 POB의 ‘drew up for battle’를 따라 ‘전열을 갖추었습니다’로 옮겼습니다.
theological_decisions:
- issue: לִקְרַאת פְּלִשְׁתִּים의 방향성
  chosen_reading: ‘블레셋 사람들을 향해’로 번역해 적대적 대치와 조우의 긴장을 함께 살렸습니다.
  alternative_readings:
  - 블레셋 사람들을 맞이하여
  - 블레셋 사람들과 대면하여
  - 블레셋 사람들을 맞서
  rationale: לִקְרַאת는 문자적으로 ‘마주하여/맞으려고’의 뜻이 있어 단순한 위치 묘사보다 전투를 앞둔 긴장감을 드러내는 표현이 적절합니다.
  doctrine_reference: 서사 문맥 해석
