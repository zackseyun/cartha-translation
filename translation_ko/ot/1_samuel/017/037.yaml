source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָ֗ה אֲשֶׁ֨ר הִצִּלַ֜/נִי מִ/יַּ֤ד הָֽ/אֲרִי֙ וּ/מִ/יַּ֣ד הַ/דֹּ֔ב ה֣וּא יַצִּילֵ֔/נִי מִ/יַּ֥ד הַ/פְּלִשְׁתִּ֖י הַ/זֶּ֑ה וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל דָּוִד֙ לֵ֔ךְ וַֽ/יהוָ֖ה יִהְיֶ֥ה עִמָּֽ/ךְס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/037.yaml
  text: David said[a], “Yahweh, who delivered me from the paw of the lion and from the paw of the bear, he will deliver me from the hand of this Philistine.” Then Saul said to David, “Go, and may Yahweh be with you.”
  footnotes:
  - marker: a
    text: Or, 'and the LORD will be with you.' The Hebrew can be read as either a blessing/wish or a simple future statement.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗이 말했습니다. 「야훼, 곧 사자의 발톱에서, 곰의 발톱에서 나를 건져 내신 분이 이 블레셋 사람의 손에서도 나를 건져 내실 것입니다.」 그러자 사울이 다윗에게 말했습니다. 「가시오. 야훼께서 당신과 함께 계시기를 바랍니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문맥상 축복/기원으로도, 단순한 미래 진술로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문이 여호와 대용어가 아니라 언약적 고유명사를 직접 쓰므로, 한국어도 POB 기본값에 따라 ‘야훼’로 옮겨 하나님의 이름성을 보존했습니다.
- source_word: הִצִּילַנִי / יַצִּילֵנִי
  english_pob_choice: delivered me / will deliver me
  chosen_korean: 건져 내신 / 건져 내실
  alternatives_korean:
  - 구원하신 / 구원하실
  - 구해 내신 / 구해 내실
  lexicon: HALOT
  rationale: 동사는 위험에서 건져 내는 구출을 가리키므로, 과거와 미래를 같은 동사로 연결하면서도 한국어에서 가장 자연스럽고 구체적인 ‘건져 내다’를 택했습니다.
- source_word: מִיַּד הָאֲרִי / מִיַּד הַדֹּב
  english_pob_choice: from the paw of the lion / from the paw of the bear
  chosen_korean: 사자의 발톱에서 / 곰의 발톱에서
  alternatives_korean:
  - 사자의 손에서 / 곰의 손에서
  - 사자의 발에서 / 곰의 발에서
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘손’이지만 짐승에게는 한국어에서 ‘발톱’이 위협의 이미지를 더 정확히 전달하므로, 원문의 구체성을 살리면서 자연스럽게 옮겼습니다.
- source_word: מִיַּד הַפְּלִשְׁתִּי הַזֶּה
  english_pob_choice: from the hand of this Philistine
  chosen_korean: 이 블레셋 사람의 손에서도
  alternatives_korean:
  - 이 블레셋 사람의 손에서
  - 이 블레셋 사람에게서
  lexicon: HALOT
  rationale: 인간 상대에게는 히브리어 관용구 ‘손’의 위협적·권세적 의미를 살려 ‘손에서도’로 옮겼습니다.
- source_word: לֵךְ
  english_pob_choice: Go
  chosen_korean: 가시오
  alternatives_korean:
  - 가세요
  - 가십시오
  lexicon: HALOT
  rationale: 사울의 짧은 명령을 한국어 합쇼체의 간결한 명령형으로 반영했습니다.
theological_decisions:
- issue: 사울의 마지막 말의 문법적 힘
  chosen_reading: 청유/축복의 뜻으로 ‘야훼께서 당신과 함께 계시기를 바랍니다’라고 옮겼습니다.
  alternative_readings:
  - 직설 미래로 ‘야훼께서 당신과 함께 계실 것입니다’
  - 단순 선언으로 ‘야훼가 당신과 함께 있을 것입니다’
  rationale: 히브리어 미완료형은 문맥상 보장된 예언이라기보다 축복 섞인 파송말로 읽을 수 있어, 그 긴장을 유지하는 한국어 청유형이 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
