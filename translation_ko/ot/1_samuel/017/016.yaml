lexical_decisions:
- source_word: וַיִּגַּשׁ
  english_pob_choice: came forward
  chosen_korean: 앞으로 나와서
  alternatives_korean:
  - 다가와서
  - 나아와서
  - 가까이 와서
  lexicon: HALOT
  rationale: 군사적 대치 장면에서 반복적으로 전면에 나서는 동작을 자연스럽게 살리기 위해 ‘앞으로 나오다’를 택했습니다.
- source_word: הַפְּלִשְׁתִּי
  english_pob_choice: The Philistine
  chosen_korean: 블레셋 사람
  alternatives_korean:
  - 그 블레셋 사람
  - 블레셋 전사
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘그 블레셋 사람’이라고만 하므로, 문맥상 골리앗을 가리키더라도 직설적으로 옮겼습니다.
- source_word: וַיִּתְיַצֵּב
  english_pob_choice: and took his stand
  chosen_korean: 자기 자리를 지켰습니다
  alternatives_korean:
  - 자리를 잡았습니다
  - 서 있었습니다
  - 자신의 자리에 섰습니다
  lexicon: HALOT
  rationale: 반복적 도전 자세를 나타내는 ‘자세를 취하다/자리를 지키다’의 의미를 살리되, 한국어에서 자연스럽게 읽히도록 다듬었습니다.
- source_word: אַרְבָּעִים יוֹם
  english_pob_choice: for forty days
  chosen_korean: 사십 일 동안
  alternatives_korean:
  - 마흔 날 동안
  - 사십 일간
  lexicon: HALOT
  rationale: 지속 기간을 나타내는 히브리어 표현을 한국어의 자연스러운 기간 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘the Philistine’의 지칭을 직역할지 문맥 보충할지
  chosen_reading: 문맥상 골리앗을 뜻하지만, 본문 자체의 호칭은 ‘블레셋 사람’으로 유지했습니다.
  alternative_readings:
  - 블레셋 용사
  - 블레셋의 챔피언
  rationale: 이 절만 놓고 보면 히브리어는 신분 설명을 덧붙이지 않으므로, 인물 확인은 독자에게 맡기고 본문 표현을 보존했습니다.
  doctrine_reference: 본문 충실성 및 문맥 보조 원칙
