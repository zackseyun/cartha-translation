- source_word: אַחֲרֵי שָׁאוּל
  english_pob_choice: after Saul
  chosen_korean: 사울을 따라
  alternatives_korean:
  - 사울 뒤에
  - 사울을 뒤따라
  lexicon: HALOT
  rationale: אַחֲרֵי는 문자적으로 ‘뒤에/뒤따라’이지만, 여기서는 전쟁 출정을 함께했다는 뜻이므로 ‘사울을 따라’가 문맥을 가장 자연스럽게 드러냅니다.
- source_word: לַמִּלְחָמָה / בַּמִּלְחָמָה
  english_pob_choice: to the battle / to the battle
  chosen_korean: 전장에
  alternatives_korean:
