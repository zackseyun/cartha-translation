  yaml_path: translation/ot/1_samuel/017/013.yaml
  text: The three oldest sons of Jesse had gone after Saul to the battle. And the names of his three sons who had gone to the battle were Eliab the firstborn[a], his second Abinadab, and the third Shammah.
  footnotes:
  - marker: a
    text: Hebrew 'after Saul' can also be understood as 'following Saul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이새의 큰아들 세 사람은 사울을 따라[a] 전쟁에 나갔습니다. 전쟁에 나간 이새의 세 아들의 이름은 맏아들 엘리압, 둘째 아비나답, 셋째 삼마였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사울을 따라’에 해당하는 히브리어는 문자적으로 ‘사울 뒤에’ 또는 ‘사울을 뒤따라’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשֶׁת בְּנֵי יִשַׁי הַגְּדֹלִים
  english_pob_choice: the three oldest sons of Jesse
  chosen_korean: 이새의 세 큰 아들들
