  - 전투에
  lexicon: HALOT
  rationale: 특정 군사 출정 장면이므로 추상적인 ‘전쟁’보다 장소성을 띤 ‘전장’이 문맥상 더 정확하고 간결합니다.
- source_word: הַבְּכוֹר
  english_pob_choice: the firstborn
  chosen_korean: 맏아들
  alternatives_korean:
  - 장자
  - 첫째
  lexicon: HALOT
  rationale: בְּכוֹר는 단순한 순서뿐 아니라 가족 내 지위를 담으므로, 한국어 성경 문맥에서 자연스럽고 의미가 분명한 ‘맏아들’을 택했습니다.
- source_word: וּמִשְׁנֵהוּ / וְהַשְּׁלִשִׁי
  english_pob_choice: his second / and the third
  chosen_korean: 둘째 … 셋째
  alternatives_korean:
  - 두 번째인 … 세 번째인
  - 그의 둘째 … 그리고 셋째
  lexicon: HALOT
  rationale: 열거 구조를 한국어 ordinal로 간명하게 옮겨, 이름 목록의 평행성과 순서를 자연스럽게 드러냈습니다.
