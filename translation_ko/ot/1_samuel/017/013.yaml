base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/013.yaml
  text: The three oldest sons of Jesse had gone after Saul to the battle. And the names of his three sons who had gone to the battle were Eliab the firstborn[a], his second Abinadab, and the third Shammah.
  footnotes:
  - marker: a
    text: Hebrew 'after Saul' can also be understood as 'following Saul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이새의 세 큰 아들들은 사울을 따라 전장에 나갔습니다. 전장에 나간 그의 세 아들의 이름은 맏아들 엘리압, 둘째 아비나답, 셋째 삼마였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사울을 따라’는 히브리어 אַחֲרֵי의 문자적 의미인 ‘사울 뒤에/뒤따라’도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשֶׁת בְּנֵי יִשַׁי הַגְּדֹלִים
  english_pob_choice: the three oldest sons of Jesse
  chosen_korean: 이새의 세 큰 아들들
  alternatives_korean:
  - 이새의 세 맏아들들
  - 이새의 세 연장된 아들들
  lexicon: HALOT
  rationale: 여기서 הַגְּדֹלִים은 키가 큰다는 뜻이 아니라 연장자라는 뜻이므로, 자연스러운 한국어로 ‘세 큰 아들들’이라 옮겨 연령상 우선순위를 살렸습니다.
- source_word: אַחֲרֵי שָׁאוּל
  english_pob_choice: after Saul
  chosen_korean: 사울을 따라
  alternatives_korean:
  - 사울 뒤에
  - 사울을 뒤따라
  lexicon: HALOT
  rationale: אַחֲרֵי는 문자적으로 ‘뒤에/뒤따라’이지만, 여기서는 전쟁 출정을 함께했다는 뜻이므로 ‘사울을 따라’가 문맥을 가장 자연스럽게 드러냅니다.
- source_word: לַמִּלְחָמָה / בַּמִּלְחָמָה
  english_pob_choice: to the battle / to the battle
  chosen_korean: 전장에
  alternatives_korean:
  - 전쟁에
  - 전투에
  lexicon: HALOT
  rationale: 특정 군사 출정 장면이므로 추상적인 ‘전쟁’보다 장소성을 띤 ‘전장’이 문맥상 더 정확하고 간결합니다.
- source_word: הַבְּכוֹר
  english_pob_choice: the firstborn
  chosen_korean: 맏아들
  alternatives_korean:
  - 장자
  - 첫째
  lexicon: HALOT
  rationale: בְּכוֹר는 단순한 순서뿐 아니라 가족 내 지위를 담으므로, 한국어 성경 문맥에서 자연스럽고 의미가 분명한 ‘맏아들’을 택했습니다.
- source_word: וּמִשְׁנֵהוּ / וְהַשְּׁלִשִׁי
  english_pob_choice: his second / and the third
  chosen_korean: 둘째 … 셋째
  alternatives_korean:
  - 두 번째인 … 세 번째인
  - 그의 둘째 … 그리고 셋째
  lexicon: HALOT
  rationale: 열거 구조를 한국어 ordinal로 간명하게 옮겨, 이름 목록의 평행성과 순서를 자연스럽게 드러냈습니다.
