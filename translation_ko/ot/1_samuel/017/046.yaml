base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/046.yaml
  text: This day Yahweh will deliver you into my hand[a], and I will strike you down and remove your head from you. And this day I will give the corpses of the Philistine camp to the birds of the sky and to the wild animals of the earth, so that all the earth may know that there is a God for Israel.
  footnotes:
  - marker: a
    text: Or, 'that there is a God in Israel.' The Hebrew reads literally 'for Israel,' which may express covenantal relation or advocacy.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 오늘 당신을 내 손에 넘기실 것이며, 나는 당신을 쳐서 당신의 머리를 당신에게서 제거하겠습니다. 또한 오늘 나는 블레셋 진영의 주검들을 하늘의 새들과 땅의 들짐승들에게 줄 것이니, 온 땅이 이스라엘을 위한 하나님이 계심을 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 안에 하나님이 계심’으로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘이스라엘을 위한’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC 직접 대응 / POB 용례
  rationale: 본문의 신명은 제목으로 바꾸지 않고 음역해 하나님의 언약적 고유명을 드러내는 것이 원문과 POB 방침에 가장 부합합니다.
- source_word: יְסַגֶּרְךָ ... בְּיָדִי
  english_pob_choice: will deliver you into my hand
  chosen_korean: 당신을 내 손에 넘기실 것이며
  alternatives_korean:
  - 당신을 내 손에 넘겨주실 것이며
  - 당신을 내 손에 맡기실 것이며
  lexicon: HALOT
  rationale: סגר의 군사적·법정적 뉘앙스를 한국어에서 자연스럽게 살리되, ‘손’의 관용 이미지는 유지했습니다.
- source_word: וַהֲסִרֹתִי אֶת רֹאשְׁךָ מֵעָלֶיךָ
  english_pob_choice: remove your head from you
  chosen_korean: 당신의 머리를 당신에게서 제거하겠습니다
  alternatives_korean:
  - 당신의 머리를 당신에게서 잘라내겠습니다
  - 당신의 머리를 잘라버리겠습니다
  lexicon: HALOT
  rationale: 원문은 ‘자르다’가 아니라 ‘제거하다/치우다’의 동사를 써서, 직설적 의미는 분명히 하되 어휘는 원문에 더 가깝게 유지했습니다.
- source_word: פֶּגֶר מַחֲנֵה פְלִשְׁתִּים
  english_pob_choice: the corpses of the Philistine camp
  chosen_korean: 블레셋 진영의 주검들
  alternatives_korean:
  - 블레셋 진영의 시체들
  - 블레셋 군대의 시신들
  lexicon: HALOT
  rationale: פֶּגֶר은 전투 맥락에서 인간의 죽은 몸을 가리키므로, 문어적이면서도 노골적인 정도가 지나치지 않은 ‘주검들’이 적절합니다.
- source_word: יֵשׁ אֱלֹהִים לְיִשְׂרָאֵל
  english_pob_choice: there is a God for Israel
  chosen_korean: 이스라엘을 위한 하나님이 계심을
  alternatives_korean:
  - 이스라엘 안에 하나님이 계심을
  - 이스라엘에게 하나님이 계심을
  lexicon: HALOT
  rationale: לְיִשְׂרָאֵל의 관계·대상성을 살려 ‘for Israel’의 의미를 반영했습니다. ‘안에’는 자연스럽지만 관계의 강조를 약화시키므로 본문 본의를 우선했습니다.
