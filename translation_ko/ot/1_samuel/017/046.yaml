base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/046.yaml
  text: This day Yahweh will deliver you into my hand[a], and I will strike you down and remove your head from you. And this day I will give the corpses of the Philistine camp to the birds of the sky and to the wild animals of the earth, so that all the earth may know that there is a God for Israel.
  footnotes:
  - marker: a
    text: Or, 'that there is a God in Israel.' The Hebrew reads literally 'for Israel,' which may express covenantal relation or advocacy.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 오늘 당신을 내 손에 넘기실 것이며, 나는 당신을 쳐서 당신의 머리를 당신에게서 떼어 내겠습니다. 또한 오늘 나는 블레셋 진영의 주검들을 하늘의 새들과 땅의 들짐승들에게 줄 것이니, 온 땅이 이스라엘을 위한 하나님이 계심을 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 안에 하나님이 계심’으로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘이스라엘을 위한’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
