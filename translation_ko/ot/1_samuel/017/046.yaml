  - 여호와
  lexicon: WLC 직접 대응 / POB 용례
  rationale: 본문의 신명은 제목으로 바꾸지 않고 음역해 하나님의 언약적 고유명을 드러내는 것이 원문과 POB 방침에 가장 부합합니다.
