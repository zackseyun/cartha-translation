  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּלְבֵּ֨שׁ שָׁא֤וּל אֶת דָּוִד֙ מַדָּ֔י/ו וְ/נָתַ֛ן ק֥וֹבַע נְחֹ֖שֶׁת עַל רֹאשׁ֑/וֹ וַ/יַּלְבֵּ֥שׁ אֹת֖/וֹ שִׁרְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/038.yaml
  text: Then Saul clothed David with his garments[a], put a bronze helmet on his head[b], and clothed him with armor.
  footnotes:
  - marker: a
    text: Or 'his military attire.' The Hebrew term for Saul's clothing can refer to garments associated with rank or battle dress.
    reason: lexical_alternative
  - marker: b
    text: Or 'coat of mail' or 'body armor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 사울이 다윗에게 자기 옷[a]을 입히고, 그의 머리에 청동 투구[b]를 씌우고, 그에게 갑옷을 입혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 군사 복장’. 히브리어는 지위나 전투용 차림에 쓰이는 옷을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘투구받침이 있는 갑옷’이나 ‘몸갑옷’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּלְבֵּשׁ
  english_pob_choice: clothed
  chosen_korean: 입혔습니다
  alternatives_korean:
  - 옷을 입혔습니다
  - 덧입혔습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 ‘입히다’로 옮기면, 사울이 다윗에게 장비를 갖춰 주는 동작을 자연스럽게 드러낼 수 있습니다.
- source_word: מַדָּיו
  english_pob_choice: his garments
  chosen_korean: 자기 옷
  alternatives_korean:
  - 자기 군복
  - 자기 전투복
  - 자기 의복
  lexicon: HALOT
  rationale: 문맥상 전투를 위한 차림이지만, 뒤에 투구와 갑옷이 따로 나오므로 이를 하나의 군사 장비로 좁히기보다 넓게 ‘옷’으로 두는 편이 소스의 구분을 보존합니다.
- source_word: קוֹבַע נְחֹשֶׁת
  english_pob_choice: a bronze helmet
  chosen_korean: 청동 투구
  alternatives_korean:
  - 놋 투구
  - 구리 투구
  - 청동 헬멧
  lexicon: HALOT
  rationale: קוֹבַע는 투구를 뜻하며, נְחֹשֶׁת은 고대 무기류 문맥에서 ‘청동’이 표준적이고 자연스러운 현대 한국어입니다.
- source_word: שִׁרְיוֹן
  english_pob_choice: armor
  chosen_korean: 갑옷
  alternatives_korean:
  - 방어구
  - 군장
  - 철갑
  lexicon: HALOT
  rationale: שִׁרְיוֹן은 몸을 보호하는 갑주를 가리키므로, 현대 한국어 성경 문맥에서는 간결하고 정확한 ‘갑옷’이 적절합니다.
theological_decisions:
- issue: 전쟁 준비 장면의 도상학적 과장 여부
  chosen_reading: 사울이 실제로 다윗에게 자신의 전투 차림을 입혀 전투 준비를 시도한 것으로 직역합니다.
  alternative_readings:
  - 상징적으로 무장시켰다는 식의 완곡화
  - 의장용 복장으로 축소
  rationale: 본문은 장면의 물질성을 강조하므로, 과장이나 상징으로 약화하지 않고 사울의 장비를 실제로 다윗에게 입히는 서술을 유지합니다.
  doctrine_reference: 본문 해석 원칙
