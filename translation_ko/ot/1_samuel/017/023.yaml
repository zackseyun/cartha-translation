  lexicon: HALOT
  rationale: 관용구의 의미인 ‘대표 전사’를 반영하되, 본문 흐름에 맞는 간결한 대응어로 ‘챔피언’을 사용했습니다. 보다 직역적인 뜻은 본문 각주로 보존할 수 있습니다.
- source_word: מִגַּת
  english_pob_choice: from Gath
  chosen_korean: 가드 사람
  alternatives_korean:
  - 가드 출신의
