base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/023.yaml
  text: While he was speaking with them[a], behold, the champion came up—the Philistine named Goliath, from Gath, from the ranks of the Philistines—and he spoke these words[b], and David heard.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the man between [the two sides/lines],' an idiom for a representative warrior in single combat.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression likely refers to the Philistine battle lines or ranks; some render 'from the camps of the Philistines.'
    reason: alternative_reading
translation:
  language: ko
  text: 그가 그들과 이야기하고 있을 때에, 그런데 보십시오, 그 대표 전사[a], 곧 블레셋 사람으로서 이름이 가드 출신 골리앗인 자가 블레셋 사람들의 전열에서[b] 올라오고 있었습니다. 그는 이러한 말들을 하였고, 다윗이 들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 문자적으로 옮기면 ‘두 편 사이의 사람’이며, 일대일 결투를 위해 양 진영 사이에 나서는 대표 전사를 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 히브리어 표현은 블레셋의 전열 또는 부대를 가리키는 것으로 보입니다. ‘블레셋 사람들의 진영에서’로 옮기기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מְדַבֵּר עִמָּם
  english_pob_choice: While he was speaking with them
  chosen_korean: 그가 그들과 말하고 있는데
