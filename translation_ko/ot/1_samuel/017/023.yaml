  text: וְ/ה֣וּא מְדַבֵּ֣ר עִמָּ֗/ם וְ/הִנֵּ֣ה אִ֣ישׁ הַ/בֵּנַ֡יִם עוֹלֶ֞ה גָּלְיָת֩ הַ/פְּלִשְׁתִּ֨י שְׁמ֤/וֹ מִ/גַּת֙ מ/מערות פְּלִשְׁתִּ֔ים וַ/יְדַבֵּ֖ר כַּ/דְּבָרִ֣ים הָ/אֵ֑לֶּה וַ/יִּשְׁמַ֖ע דָּוִֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/023.yaml
  text: While he was speaking with them[a], behold, the champion came up—the Philistine named Goliath, from Gath, from the ranks of the Philistines—and he spoke these words[b], and David heard.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the man between [the two sides/lines],' an idiom for a representative warrior in single combat.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression likely refers to the Philistine battle lines or ranks; some render 'from the camps of the Philistines.'
    reason: alternative_reading
translation:
  language: ko
  text: 그가 그들과 말하고 있는데, 보라, 그 챔피언이 올라왔습니다. 곧 가드 사람 골리앗이었는데, 블레셋 사람들의 대열에서 올라와서는 그 말을 하였고, 다윗이 들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문자적으로는 ‘두 편 사이의 사람’이라는 뜻으로, 일대일 결투를 위한 대표 전사를 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 히브리어 표현은 블레셋의 전열이나 부대를 가리키는 말로 보이며, ‘블레셋 사람들의 진영에서’로 옮길 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מְדַבֵּר עִמָּם
  english_pob_choice: While he was speaking with them
  chosen_korean: 그가 그들과 말하고 있는데
  alternatives_korean:
  - 그가 그들과 이야기하는 동안
  - 그가 그들과 말하고 있었습니다
  lexicon: HALOT
  rationale: 히브리어 분사와 전치사 עִם의 진행·동반 의미를 살려, 현재 진행형에 가까운 한국어로 자연스럽게 옮겼습니다.
- source_word: אִישׁ הַבֵּנַיִם
  english_pob_choice: the champion
  chosen_korean: 그 챔피언
  alternatives_korean:
  - 그 두 진영 사이의 사람
  - 결투 대표 전사
  lexicon: HALOT
  rationale: 관용구의 의미인 ‘대표 전사’를 반영하되, 본문 흐름에 맞는 간결한 대응어로 ‘챔피언’을 사용했습니다. 보다 직역적인 뜻은 본문 각주로 보존할 수 있습니다.
- source_word: מִגַּת
  english_pob_choice: from Gath
  chosen_korean: 가드 사람
  alternatives_korean:
  - 가드 출신의
  - 가드에서 온
  lexicon: HALOT
  rationale: 지명 출신 표지를 한국어 성경 문체에 맞게 ‘~사람’으로 처리해 인물 식별을 분명하게 했습니다.
- source_word: ממערות פְּלִשְׁתִּים
  english_pob_choice: from the ranks of the Philistines
  chosen_korean: 블레셋 사람들의 대열에서
  alternatives_korean:
  - 블레셋 사람들의 진영에서
  - 블레셋 사람들의 전열에서
  lexicon: HALOT
  rationale: 어려운 구문을 문맥상 전열/대열의 의미로 옮겨, 골리앗이 블레셋 전투 편제에서 앞으로 나오는 장면을 드러냈습니다.
- source_word: וַיְדַבֵּר כַּדְּבָרִים הָאֵלֶּה
  english_pob_choice: and he spoke these words
  chosen_korean: 그 말을 하였고
  alternatives_korean:
  - 그 말을 하였으며
  - 그 말들을 하였고
  lexicon: HALOT
  rationale: 앞서 제시된 도전의 말을 가리키는 표현을 한국어에서 자연스럽게 응축했습니다. ‘이 말들을’보다 문맥상 ‘그 말’이 덜 어색합니다.
