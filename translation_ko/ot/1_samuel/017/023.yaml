  source_fidelity: 수정이 필요합니다. 본문의 אִישׁ הַבֵּנַיִם은 단순한 현대 스포츠식 ‘챔피언’보다 양 진영 사이에 나서는 대표 전사를 뜻하므로 본문에서 ‘대표 전사’로 옮기고, 문자적 표현은 각주에 보존하는 편이 정확합니다. עוֹלֶה 분사의 진행성을 ‘올라오고 있었습니다’로 반영했습니다. כַּדְּבָרִים הָאֵלֶּה의 복수 및 지시성을 ‘이러한 말들을’로 보완했습니다.
  naturalness: 초안의 ‘그 챔피언이 올라왔습니다. 곧 … 올라와서는’은 동일 동작을 불필요하게 반복하고, 마침표 때문에 히브리어의 한 장면 묘사가 끊깁니다. ‘그런데 보십시오’와 쉼표를 사용하여 현대 한국어 합쇼체 안에서 서사의 돌발성과 흐름을 살렸습니다.
  terminology: ‘대표 전사’는 문맥상 단독 결투를 위해 나선 אִישׁ הַבֵּנַיִם의 기능을 자연스럽고 비교파적으로 드러냅니다. ‘블레셋 사람’, ‘가드 출신 골리앗’, ‘전열’은 지명·민족명 및 난해한 전투 편제 표현을 무리 없이 반영합니다.
