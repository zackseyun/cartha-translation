  rationale: 지명 출신 표지를 한국어 성경 문체에 맞게 ‘~사람’으로 처리해 인물 식별을 분명하게 했습니다.
- source_word: ממערות פְּלִשְׁתִּים
  english_pob_choice: from the ranks of the Philistines
  chosen_korean: 블레셋 사람들의 대열에서
  alternatives_korean:
  - 블레셋 사람들의 진영에서
  - 블레셋 사람들의 전열에서
  lexicon: HALOT
  rationale: 어려운 구문을 문맥상 전열/대열의 의미로 옮겨, 골리앗이 블레셋 전투 편제에서 앞으로 나오는 장면을 드러냈습니다.
- source_word: וַיְדַבֵּר כַּדְּבָרִים הָאֵלֶּה
  english_pob_choice: and he spoke these words
  chosen_korean: 그 말을 하였고
  alternatives_korean:
  - 그 말을 하였으며
  - 그 말들을 하였고
  lexicon: HALOT
  rationale: 앞서 제시된 도전의 말을 가리키는 표현을 한국어에서 자연스럽게 응축했습니다. ‘이 말들을’보다 문맥상 ‘그 말’이 덜 어색합니다.
