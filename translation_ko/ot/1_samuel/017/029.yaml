  text: וַ/יֹּ֣אמֶר דָּוִ֔ד מֶ֥ה עָשִׂ֖יתִי עָ֑תָּה הֲ/ל֖וֹא דָּבָ֥ר הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/029.yaml
  text: David said[a], “What have I done now? Was it not just a word?”
  footnotes:
  - marker: a
    text: Or, “Was it not just a matter?” The Hebrew word דָּבָר can mean “word,” “matter,” or “thing.”
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 말했습니다. “내가 지금 무엇을 했습니까? 그것이 그저 한마디 말에 불과하지 않습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것이 그저 일/사건에 불과하지 않습니까?’ 히브리어 דָּבָר는 ‘말’, ‘일’, ‘것’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד
  english_pob_choice: David said
  chosen_korean: 다윗이 말했습니다
  alternatives_korean:
  - 다윗이 말했습니다
  - 다윗이 대답했습니다
  - 다윗이 말했습니다
  lexicon: HALOT
  rationale: 서술적 wayyiqtol אמר를 자연스러운 직접화법 도입으로 옮겼습니다. ‘말했습니다’가 합쇼체 서술과 잘 맞고, 반박 응답의 뉘앙스를 과도하게 좁히지 않습니다.
- source_word: מֶה עָשִׂיתִי עָתָּה
  english_pob_choice: What have I done now?
  chosen_korean: 내가 지금 무엇을 했습니까?
  alternatives_korean:
  - 내가 지금 무엇을 했습니까?
  - 내가 지금 무슨 짓을 했습니까?
  - 내가 지금 무엇을 한 겁니까?
  lexicon: HALOT
  rationale: מֶה의 항변적 질문과 עָשִׂיתִי의 1인칭 완료형을 살려, 현재 상황에 대한 즉각적 항변으로 옮겼습니다. ‘무엇을 했습니까’는 원문의 폭을 유지하면서도 과도한 감정 해석을 덜어 줍니다.
- source_word: הֲלוֹא דָּבָר הוּא
  english_pob_choice: Was it not just a word?
  chosen_korean: 그것이 그저 한마디 말에 불과하지 않습니까?
  alternatives_korean:
  - 그것이 그저 말에 불과하지 않습니까?
  - 그것이 단지 한마디 말이 아니었습니까?
  - 그것이 그저 말이 아니었습니까?
  lexicon: HALOT
  rationale: דָּבָר의 의미 범위(‘말, 일, 것’) 가운데 문맥상 ‘말’의 최소화된 뜻을 살리되, 한국어에서 자연스럽게 비하/축소를 나타내는 ‘한마디 말에 불과하다’로 옮겼습니다. ‘그것이’는 הוּא를 반영하며, 의문형 종결로 반문을 유지했습니다.
theological_decisions:
- issue: דָּבָר의 축소 표현을 어떻게 보존할 것인가
  chosen_reading: ‘그저 한마디 말에 불과하지 않습니까?’로 옮겨, 다윗이 자신에 대한 비난을 ‘말 한마디’ 수준으로 축소하는 반문을 살렸습니다.
  alternative_readings:
  - ‘그저 말에 불과하지 않습니까?’
  - ‘그저 한마디에 불과하지 않습니까?’
  rationale: 본문의 수사는 단순한 정보 전달이 아니라 자신의 행위를 사소하게 보는 항변입니다. 한국어에서도 ‘불과하다’ 구문이 그 경중의 반전을 가장 분명하게 전달합니다.
  doctrine_reference: 본문 해석/수사 보존
