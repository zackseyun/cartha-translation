review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘같은 말’과 보상에 관한 미래 진술은 본문의 뜻을 대체로 잘 반영합니다. 그러나 יַכֶּנּוּ는 문자적으로 ‘그를 치는’이며, 본 절 자체에는 ‘쓰러뜨리는’ 뜻이 명시되어 있지 않습니다. 문맥상 골리앗을 제압하는 것을 가리키지만, 그 결과를 본문에 덧붙이지 않는 편이 안전합니다.
  naturalness: ‘같은 말을 하며 말했습니다’는 ‘말’ 동사의 중복으로 현대 한국어에서 부자연스럽습니다. ‘같은 말을 전했습니다’로 고치면 반복 전달이라는 의미와 합쇼체 문체를 자연스럽게 유지합니다.
  terminology: ‘백성들’, ‘같은 말’, 그리고 보상 조치를 나타내는 ‘이렇게 해 줄 것입니다’는 자연스럽고 문맥에 맞습니다. 행위의 주체를 특정하지 않아 원문의 비명시성도 유지합니다.
  issues:
  - severity: medium
    issue: ‘쳐서 쓰러뜨리는’이 원문의 동작을 구체화합니다.
    rationale: נכה는 ‘치다/공격하다’이며, 이 절의 표현만으로 ‘쓰러뜨리다’라는 결과를 확정하지 않습니다. 문맥적 함의를 본문 번역에 추가하지 않도록 ‘그를 치는’으로 옮깁니다.
  - severity: low
    issue: ‘같은 말을 하며 말했습니다’는 동어 반복입니다.
    rationale: וַיֹּאמֶר ... לֵאמֹר의 히브리어 인용 도입 관용구를 한국어에서 그대로 중복 번역할 필요는 없습니다.
  revised_text: 백성들이 그에게 같은 말을 전했습니다. “그를 치는 사람에게는 이렇게 해 줄 것입니다.”
