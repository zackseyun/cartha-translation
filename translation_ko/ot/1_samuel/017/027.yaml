  to: 백성들이 그에게 같은 말을 전했습니다. “그를 치는 사람에게는 이렇게 해 줄 것입니다.”
  rationale: 원문의 반복 전달과 미래의 보상 선언은 유지하되, ‘쓰러뜨리는’이라는 결과적 의미를 제거하여 נכה의 표현 범위를 보존했습니다. 문장도 현대 표준 한국어 합쇼체에 맞게 다듬었습니다.
  reviewer_model: gpt-5.6-terra
