  yaml_path: translation/ot/1_samuel/017/027.yaml
  text: The people told him the same thing, saying, “This is what will be done for the man who strikes him down.”
translation:
  language: ko
  text: 백성들이 그에게 같은 말을 전했습니다. “그를 치는 사람에게는 이렇게 해 줄 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם
  english_pob_choice: The people
  chosen_korean: 백성들
  alternatives_korean:
  - 사람들
  - 무리
  lexicon: הָעָם
  rationale: 전쟁 현장의 집단 발화를 자연스럽게 옮기되, ‘백성들’로 해 공동체 전체의 말이라는 점을 드러냈습니다.
- source_word: כַּדָּבָר הַזֶּה
  english_pob_choice: the same thing
  chosen_korean: 같은 말을
  alternatives_korean:
  - 이 말대로
  - 이런 말
  lexicon: דָּבָר
  rationale: POB의 ‘the same thing’을 따라, 앞서 말한 보상 약속을 되풀이하는 응답임을 자연스럽게 표현했습니다.
- source_word: כֹּה יֵעָשֶׂה
  english_pob_choice: This is what will be done
  chosen_korean: 이렇게 하여질 것입니다
  alternatives_korean:
  - 이렇게 할 것입니다
  - 이렇게 행해질 것입니다
  lexicon: עשה
  rationale: 히브리어 수동형의 결과 진술을 살려 ‘하여질 것입니다’로 옮겨, 단순한 의지 표현보다 정해진 조치의 공표라는 뉘앙스를 보존했습니다.
- source_word: לָאִישׁ אֲשֶׁר יַכֶּנּוּ
  english_pob_choice: for the man who strikes him down
  chosen_korean: 이 사람을 쳐서 쓰러뜨리는 자에게는
  alternatives_korean:
  - 그를 죽이는 사람에게는
  - 그를 쓰러뜨리는 사람에게는
  lexicon: נכה
  rationale: יַכֶּנּוּ는 단순한 ‘치다’보다 강한 타격/제압을 뜻하므로, 문맥상 골리앗을 쓰러뜨리는 행위를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 보상 선언의 수동형과 공적 공표의 어조
  chosen_reading: ‘이렇게 하여질 것입니다’로 수동형을 살려, 개인의 약속이 아니라 공동체가 공적으로 확인한 결정임을 드러냈습니다.
  alternative_readings:
  - 이렇게 할 것입니다
  - 그에게 이렇게 주어질 것입니다
  rationale: 히브리어 원문의 행위 주체가 생략된 수동 구문을 한국어에서도 가능한 한 보존하는 것이 문맥상 더 정확합니다.
  doctrine_reference: 서사 본문에서의 문법적 수동성 보존
