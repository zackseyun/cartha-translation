  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִצְחַ֥ת נְחֹ֖שֶׁת עַל רַגְלָ֑י/ו וְ/כִיד֥וֹן נְחֹ֖שֶׁת בֵּ֥ין כְּתֵפָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/006.yaml
  text: And he had bronze greaves on his legs[a], and a bronze javelin between his shoulders.
  footnotes:
  - marker: a
    text: Or 'a bronze spear'; the Hebrew term may refer to a lighter spear-like weapon. Some have also understood it as another kind of weapon, but 'javelin' best fits the context here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 다리에 놋갑옷을 입었고, 어깨 사이에는 놋창을 메고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘놋창’은 영어 POB의 ‘javelin’을 따른 번역으로, 문맥상 던질 수 있는 가벼운 창을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְחַת נְחֹשֶׁת
  english_pob_choice: bronze greaves
  chosen_korean: 놋갑옷
  alternatives_korean:
  - 놋다리받이
  - 놋정강이받이
  - 정강이 갑옷
  lexicon: HALOT
  rationale: 핵심은 다리를 보호하는 금속 무기 장비라는 점이므로, 한국어에서 자연스럽고 간명한 군사 용어인 ‘놋갑옷’을 택했습니다. ‘놋다리받이/놋정강이받이’는 더 직역적이지만 어색하고, ‘정강이 갑옷’도 다소 설명적입니다.
- source_word: עַל רַגְלָיו
  english_pob_choice: on his legs
  chosen_korean: 다리에
  alternatives_korean:
  - 그의 다리 위에
  - 다리 부분에
  lexicon: HALOT
  rationale: 문맥상 ‘발’이 아니라 정강이 쪽의 보호구를 가리키므로, 한국어에서는 자연스럽게 ‘다리에’로 옮겨 위치를 살렸습니다.
- source_word: כִידוֹן
  english_pob_choice: javelin
  chosen_korean: 놋창
  alternatives_korean:
  - 재블린
  - 창
  - 던지는 창
  lexicon: HALOT
  rationale: 영어 POB의 ‘javelin’을 따라 던질 수 있는 가벼운 창이라는 점을 반영했고, 한국어 독자에게는 ‘놋창’이 가장 직접적이며 본문 병행의 무기 이미지도 유지합니다. ‘창’만 쓰면 종류가 흐려지고, ‘재블린’은 음역으로 어색합니다.
- source_word: בֵּין כְּתֵפָיו
  english_pob_choice: between his shoulders
  chosen_korean: 어깨 사이에는
  alternatives_korean:
  - 어깨 사이에
  - 등에
  - 어깨 위에
  lexicon: HALOT
  rationale: 히브리어의 직역 이미지를 살리면서도 한국어에서 무기가 어깨에 걸려 있는 상태를 자연스럽게 드러내기 위해 ‘어깨 사이에는’으로 옮겼습니다.
