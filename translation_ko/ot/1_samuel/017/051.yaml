    rationale: 각주는 ‘곁에 서다’ 또는 쓰러진 골리앗 ‘위에 서 있는’ 장면을 언급하지만, 본문은 이를 ‘앞에’로 한정합니다. עמד אל의 공간 관계가 확정적이지 않은 만큼 ‘곁에 서서’가 더 안전하게 모호성을 보존합니다.
