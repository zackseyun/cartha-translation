  edition: WLC
  text: וַ/יָּ֣רָץ דָּ֠וִד וַ/יַּעֲמֹ֨ד אֶל הַ/פְּלִשְׁתִּ֜י וַ/יִּקַּ֣ח אֶת חַ֠רְבּ/וֹ וַֽ/יִּשְׁלְפָ֤/הּ מִ/תַּעְרָ/הּ֙ וַ/יְמֹ֣תְתֵ֔/הוּ וַ/יִּכְרָת בָּ֖/הּ אֶת רֹאשׁ֑/וֹ וַ/יִּרְא֧וּ הַ/פְּלִשְׁתִּ֛ים כִּֽי מֵ֥ת גִּבּוֹרָ֖/ם וַ/יָּנֻֽסוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/051.yaml
  text: Then David ran and stood over the Philistine[a], took his sword, drew it from its sheath, and killed him; then he cut off his head with it. When the Philistines saw that their champion was dead[b], they fled.
  footnotes:
  - marker: a
    text: Or 'stood by the Philistine.' The Hebrew expression can denote taking one's position near him; 'stood over' reflects the likely scene of David standing above the fallen Goliath.
    reason: lexical_alternative
  - marker: b
    text: Or 'their mighty man' or 'their warrior.' The translation 'champion' reflects Goliath's role in representative combat earlier in the chapter.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다윗이 달려가 블레셋 사람[a] 곁에 서서 그의 칼을 집어 그 칼집에서 뽑아 그를 죽이고, 그 칼로 그의 머리를 베어 냈습니다. 블레셋 사람들이 자기들의 용사[b]가 죽은 것을 보고 도망쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘블레셋 사람 위에 서서’. 히브리어 표현은 그에게 가까이 서거나 쓰러진 그 위에 서는 모습을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 전사’, ‘그들의 강한 자’. 문맥상 대표 결투의 상대라는 뜻에서 ‘챔피언’으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  english_pob_choice: ran
  chosen_korean: 달려가
  alternatives_korean:
  - 달려서
  - 뛰어가
  lexicon: HALOT
  rationale: סער한 전투 장면의 गतివ를 살리면서도 서술문에 자연스러운 현대 한국어 동사로 옮겼습니다.
- source_word: וַיַּעֲמֹד אֶל הַפְּלִשְׁתִּי
  english_pob_choice: stood over the Philistine
  chosen_korean: 블레셋 사람 앞에 서서
  alternatives_korean:
  - 블레셋 사람 위에 서서
  - 블레셋 사람 곁에 서서
  lexicon: HALOT
  rationale: 문맥상 쓰러진 골리앗에게 접근해 위치를 잡는 장면이지만, 한국어에서는 '앞에 서서'가 과도한 추정을 피하면서도 장면 전개를 자연스럽게 살립니다.
- source_word: וַיִּשְׁלְפָהּ מִתַּעְרָהּ
  english_pob_choice: drew it from its sheath
  chosen_korean: 그 칼집에서 뽑아
  alternatives_korean:
  - 칼집에서 빼어
  - 칼집에서 뽑아내어
  lexicon: HALOT
  rationale: שלף의 핵심은 무기를 빼어 드는 동작이며, '칼집'은 תער의 자연스러운 대응입니다.
- source_word: וַיְמֹתְתֵהוּ
  english_pob_choice: killed him
  chosen_korean: 그를 죽이고
  alternatives_korean:
  - 그를 죽여 버리고
  - 그를 죽여
  lexicon: HALOT
  rationale: 완전한 살해 행위를 간결하게 재현하되, 앞 절의 치명상과 연결되는 서술 흐름을 유지했습니다.
- source_word: גִּבּוֹרָם
  english_pob_choice: their champion
  chosen_korean: 자기들의 용사
  alternatives_korean:
  - 자기들의 챔피언
  - 자기들의 용맹한 전사
  - 자기들의 전사
  lexicon: HALOT
  rationale: '''גִּבּוֹר''의 기본 의미는 용사/전사이며, 이 문맥에서는 대표 결투의 상대라는 뉘앙스가 있어도 한국어 본문에서는 의미를 과도하게 특정하지 않고 ''용사''로 옮겼습니다.'
theological_decisions:
- issue: 골리앗의 신분을 대표 전사로 볼 것인지
  chosen_reading: 본문은 블레셋 사람들의 '용사'가 죽었다고 서술하며, 대표 결투의 배경은 유지하되 번역 본문 자체는 '용사'로 직역에 가깝게 처리했습니다.
  alternative_readings:
  - '''챔피언''으로 옮겨 대표 결투 의미를 전면화'
  - '''전사''로 일반화'
  rationale: 히브리어 גִּבּוֹר는 기본적으로 '용사/강한 전사'를 뜻하므로, POB의 해석적 'champion'을 한국어 본문에 직접 도입하기보다 본문의 직접 의미를 우선했습니다.
  doctrine_reference: 문맥적 의미 범위와 서사 해석의 균형
