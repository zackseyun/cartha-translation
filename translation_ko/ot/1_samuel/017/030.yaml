base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/030.yaml
  text: Then he turned away from him toward another and said the same thing[a], and the people answered him as before.
  footnotes:
  - marker: a
    text: Literally, 'the people answered him a word like the first word,' that is, they gave him the same answer as before.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그는 그에게서 돌아서서 다른 사람을 향해 같은 말을 했습니다. 그러자 백성은 앞서와 같은 대답을 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘백성이 그에게 첫 번째 말과 같은 말로 대답하였다’라고 합니다. 이는 앞서와 같은 대답을 했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב מֵאֶצְלוֹ
  english_pob_choice: turned away from him
  chosen_korean: 그에게서 돌아서서
  alternatives_korean:
  - 그에게서 돌아
  - 그에게서 몸을 돌려
  lexicon: HALOT
  rationale: סבב는 여기서 단순 이동이 아니라 이전 상대에게서 몸을 돌리는 동작을 가리키므로, 한국어로는 관계적 뉘앙스를 살린 ‘그에게서 돌아서서’가 자연스럽습니다.
- source_word: אֶל מוּל אַחֵר
  english_pob_choice: toward another
  chosen_korean: 다른 사람을 향해
  alternatives_korean:
  - 다른 이를 향해
  - 다른 쪽으로
  lexicon: HALOT
  rationale: מוּל은 ‘마주 향함’의 방향성을 가지므로 ‘다른 사람을 향해’가 단순히 이동이 아니라 대면 전환을 드러냅니다.
- source_word: כַּדָּבָר הַזֶּה
  english_pob_choice: said the same thing
  chosen_korean: 같은 말을
  alternatives_korean:
  - 같은 말을 하며
  - 이 말을
  lexicon: HALOT
  rationale: דבר는 여기서 ‘말/발언’의 반복을 뜻하므로, 이전 질문을 되풀이했다는 문맥에 맞게 ‘같은 말을’로 옮겼습니다.
- source_word: וַיְשִׁבֻהוּ הָעָם דָּבָר כַּדָּבָר הָרִאשׁוֹן
  english_pob_choice: the people answered him as before
  chosen_korean: 백성은 앞서와 같은 대답을 했습니다
  alternatives_korean:
  - 백성은 전과 같이 대답했습니다
  - 백성은 처음과 같은 말로 대답했습니다
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘첫 번째 말과 같은 한 말’이지만, 의미상 이전과 동일한 응답이었음을 한국어 자연문으로 압축해 표현했습니다.
