  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל שָׁא֔וּל אַל יִפֹּ֥ל לֵב אָדָ֖ם עָלָ֑י/ו עַבְדְּ/ךָ֣ יֵלֵ֔ךְ וְ/נִלְחַ֖ם עִם הַ/פְּלִשְׁתִּ֥י הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/032.yaml
  text: And David said to Saul[a], “Let no man's heart fail because of him[b]. Your servant will go and fight with this Philistine.”
  footnotes:
  - marker: a
    text: Or more explicitly, 'because of this Philistine.' The Hebrew reads 'because of him,' with the referent supplied by context.
    reason: alternative_reading
  - marker: b
    text: Or 'Let no man lose heart.' The Hebrew idiom is literally 'let not the heart of a man fall.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 사울에게 말했습니다. 「사람의 마음이 그로 말미암아 흔들리지 않게 하십시오. 당신의 종이 가서 이 블레셋 사람과 싸우겠습니다。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 분명하게 ‘이 블레셋 사람 때문에’로 옮길 수 있습니다. 히브리어는 직역하면 ‘그로 말미암아’입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘사람이 낙심하지 않게 하십시오’로 옮길 수 있습니다. 히브리어 관용구는 문자적으로는 ‘사람의 마음이 떨어지지 않게 하십시오’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יִפֹּל לֵב אָדָם
  english_pob_choice: Let no man's heart fail
  chosen_korean: 사람의 마음이 그로 말미암아 흔들리지 않게 하십시오
  alternatives_korean:
  - 사람의 마음이 그 때문에 낙심하지 않게 하십시오
  - 사람의 마음이 그로 인해 무너지지 않게 하십시오
  lexicon: BDB / HALOT
  rationale: 히브리어 관용구인 ‘마음이 떨어지다’를 한국어에서 자연스럽게 풀되, 단순한 감정보다 전투 앞의 동요를 나타내는 ‘흔들리다’로 옮겼습니다.
- source_word: עָלָיו
  english_pob_choice: because of him
  chosen_korean: 그로 말미암아
  alternatives_korean:
  - 그 때문에
  - 그 때문에 말입니다
  lexicon: HALOT
  rationale: 대명사는 문맥상 블레셋 사람을 가리키므로, 본문에서는 원문의 지시관계를 유지하면서도 한국어에서 자연스러운 이유 표현으로 렌더링했습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: Your servant
  chosen_korean: 당신의 종이
  alternatives_korean:
  - 당신의 종
  - 당신의 노예가
  lexicon: HALOT
  rationale: 왕 앞의 자기 호칭으로는 ‘종’이 가장 자연스럽고, 본절에서는 봉신적 겸손을 드러내는 용례이지 노예 신분을 전면화하는 문맥은 아닙니다.
- source_word: וְנִלְחַם עִם הַפְּלִשְׁתִּי הַזֶּה
  english_pob_choice: and fight with this Philistine
  chosen_korean: 이 블레셋 사람과 싸우겠습니다
  alternatives_korean:
  - 이 블레셋 사람과 싸울 것입니다
  - 이 블레셋 사람과 전투하겠습니다
  lexicon: HALOT
  rationale: עִם의 기본값인 ‘with’를 살리면서도 전투 맥락에서는 상대와 맞서는 뜻이므로, 한국어에서는 ‘와/과 싸우다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 다윗의 자기 호칭과 왕 앞 발화의 겸손 표현
  chosen_reading: ‘당신의 종’으로 번역해 다윗의 충성과 예우를 드러냈습니다.
  alternative_readings:
  - ‘당신의 노예’
  - ‘이 종’
  rationale: 본문의 초점은 신분적 억압이 아니라 왕 앞에서의 겸손한 자기표현이므로, 원문의 courtly register를 보존하는 쪽이 더 적절합니다.
  doctrine_reference: 서사 문맥의 화용론적 표현
