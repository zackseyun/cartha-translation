  yaml_path: translation/ot/1_samuel/017/058.yaml
  text: Saul said to him[a], “Whose son are you, young man?” And David said, “I am the son of your servant Jesse the Bethlehemite.”
  footnotes:
  - marker: a
    text: Or, more literally, “The son of your servant Jesse, the Bethlehemite.” The Hebrew reply omits the explicit verb “I am.”
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 그에게 말했습니다. “젊은이, 당신은 누구의 아들입니까?” 다윗이 말했습니다. “저는 왕의 종인 베들레헴 사람 이새의 아들입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “당신의 종인 베들레헴 사람 이새의 아들”이며, ‘저는’에 해당하는 계사가 명시되어 있지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן מִי
  english_pob_choice: Whose son
  chosen_korean: 누구의 아들
  alternatives_korean:
  - 어느 집 아들
  - 누구의 자식
  lexicon: HALOT
  rationale: 히브리어 관용구가 요구하는 것은 부친 계보이므로, 한국어도 자연스럽게 계보 질문인 “누구의 아들”로 옮겨 질문의 초점을 살렸습니다.
- source_word: הַנָּעַר
  english_pob_choice: young man
  chosen_korean: 젊은이
  alternatives_korean:
  - 소년
  - 청년
  lexicon: HALOT
  rationale: 문맥상 아직 나이가 어린 인물이라는 뉘앙스는 유지하되, 군사적 맥락에 맞는 한국어로는 “젊은이”가 가장 무난합니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 종자
  - 당신의 신하
  lexicon: HALOT
  rationale: 한국어에서는 신하보다 “종”이 원문의 자기 낮춤을 더 직접적으로 드러냅니다. 다만 영어 POB처럼 강한 노예성은 여기서 앞세우지 않았습니다.
- source_word: בֵּית הַלַּחְמִי
  english_pob_choice: the Bethlehemite
  chosen_korean: 베들레헴 사람
  alternatives_korean:
  - 베들레헴 사람인
  - 베들레헴 출신
  lexicon: HALOT
  rationale: 히브리어의 지명 형용사를 한국어에서 가장 자연스럽게 풀어 주는 표현으로 “베들레헴 사람”을 택했습니다.
theological_decisions:
- issue: 다윗의 답변에서 히브리어가 생략한 계사 처리
  chosen_reading: “저는 … 아들입니다”로 완전한 한국어 문장으로 보완했습니다.
  alternative_readings:
  - “당신의 종 이새, 베들레헴 사람의 아들”처럼 계사를 드러내지 않는 단문
  - “당신의 종 이새 베들레헴 사람의 아들입니다”처럼 압축된 표현
  rationale: 원문에는 ‘나는 ~이다’에 해당하는 동사가 없지만, 한국어에서는 이를 보충해야 의미가 또렷해집니다. 다만 보충된 내용이 원문의 계보 진술을 넘지 않도록 최소한으로 처리했습니다.
  doctrine_reference: 문법적 생략의 보완
