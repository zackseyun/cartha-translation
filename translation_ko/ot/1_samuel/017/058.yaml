revisions:
- from: 사울이 그에게 말했습니다. “젊은이야, 네가 누구의 아들이냐?” 다윗이 말했습니다. “저는 당신의 종 이새, 곧 베들레헴 사람의 아들입니다.”[a]
  to: 사울이 그에게 말했습니다. “젊은이, 당신은 누구의 아들입니까?” 다윗이 말했습니다. “저는 왕의 종인 베들레헴 사람 이새의 아들입니다.”[a]
  rationale: 이새가 ‘베들레헴 사람’이라는 원문의 문법 관계를 명확히 하고, 다윗의 대답에서 ‘당신의 종’이 이새를 가리킴을 자연스러운 한국어 구조로 보였습니다. 히브리어에 명시되지 않은 ‘저는’은 한국어의 완전한 문장을 위해 최소한으로 보충했으며 각주에서 이를 밝혔습니다. 직접 발화도 지정된 합쇼체로 통일했습니다.
