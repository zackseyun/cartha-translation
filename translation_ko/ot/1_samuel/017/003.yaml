base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/003.yaml
  text: Now the Philistines were standing on the mountain on one side[a], and Israel was standing on the mountain on the other side[b], with the valley between them.
  footnotes:
  - marker: a
    text: Or 'hill' instead of 'mountain' in both occurrences of הָהָר; Hebrew הַר can refer to either depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'ravine' for 'valley'; Hebrew גַּיְא can denote a valley with steep sides.
    reason: lexical_alternative
translation:
  language: ko
  text: 블레셋 사람들은 한쪽 산에 서 있었고, 이스라엘은 다른 쪽 산에 서 있었으며, 그들 사이에는 골짜기가 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  english_pob_choice: Now the Philistines
  chosen_korean: 이제 블레셋 사람들은
  alternatives_korean:
  - 그리고 블레셋 사람들은
  - 블레셋 사람들은
  lexicon: HALOT
  rationale: 서술 장면을 자연스럽게 여는 עכשיו/ו의 뉘앙스를 한국어 서술문에서 ‘이제’로 옮겼고, ժողովուրդ명은 표준 음역인 ‘블레셋 사람들’을 사용했습니다.
- source_word: עֹמְדִים
  english_pob_choice: were standing
  chosen_korean: 서 있고
  alternatives_korean:
  - 서 있었습니다
  - 서 있었습니다
  lexicon: HALOT
  rationale: 진행 중인 배치를 나타내는 분사적 상태를 한국어 연결형으로 살려, 대치 장면의 지속성을 자연스럽게 표현했습니다.
- source_word: אֶל הָהָר מִזֶּה / וְאֶל הָהָר מִזֶּה
  english_pob_choice: on the mountain on one side / on the mountain on the other side
  chosen_korean: 한쪽 산에 / 다른 쪽 산에
  alternatives_korean:
  - 한편의 산에 / 맞은편 산에
  - 이쪽 산에 / 저쪽 산에
  lexicon: HALOT
  rationale: הָר를 이 문맥에서 ‘산’으로 옮기고, מִזֶּה의 대비를 ‘한쪽/다른 쪽’으로 간결하게 처리해 양 진영의 대치 구도를 드러냈습니다.
- source_word: וְהַגַּיְא
  english_pob_choice: with the valley
  chosen_korean: 골짜기가
  alternatives_korean:
  - 계곡이
  - 협곡이
  lexicon: HALOT
  rationale: גַּיְא는 이 전투 지형에서 ‘골짜기’가 가장 무난하고 직관적인 표현이므로 이를 택했습니다.
