id: 1SA.17.35
reference: 1 Samuel 17:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָצָ֧אתִי אַחֲרָ֛י/ו וְ/הִכִּתִ֖י/ו וְ/הִצַּ֣לְתִּי מִ/פִּ֑י/ו וַ/יָּ֣קָם עָלַ֔/י וְ/הֶחֱזַ֨קְתִּי֙ בִּ/זְקָנ֔/וֹ וְ/הִכִּתִ֖י/ו וַ/הֲמִיתִּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/035.yaml
  text: I went out after it and struck it and rescued it from its mouth[a]; and when it rose up against me[b], I seized it by its beard and struck it and killed it.
  footnotes:
  - marker: a
    text: Or 'after him' / 'from his mouth'; the Hebrew uses masculine singular suffixes for the animal.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'by its beard'; some translations render this more interpretively as 'by its mane' or 'by its jaw.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그것을 따라 나가서 쳐서 그 입에서[a] 건져 내었습니다. 그리고 그것이 나를 향해 일어설 때[b], 내가 그 수염을 붙잡고 쳐서 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 입에서’. 히브리어는 짐승을 가리키는 데 남성 단수 접미사를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘나를 향해 일어섰을 때’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָאתִי
  english_pob_choice: I went out
  chosen_korean: 내가 그것을 따라 나가서
  alternatives_korean:
  - 내가 나가서
  - 내가 따라 나갔습니다
  lexicon: HALOT
  rationale: 문맥상 사울에게 전하는 다윗의 연속적 서술이므로 자연스러운 과거 진행으로 옮겼고, 뒤의 목적어를 바로 이어 주어 동작의 방향을 분명히 했습니다.
- source_word: וְהִצַּלְתִּי מִפִּיו
  english_pob_choice: rescued it from its mouth
  chosen_korean: 그 입에서[a] 건져 내었습니다
  alternatives_korean:
  - 그 입에서 구해 냈습니다
  - 그 입에서 건져 올렸습니다
  lexicon: HALOT
  rationale: נצל의 핵심은 ‘구출/건져 냄’이므로 ‘건져 내다’로 옮겨 생생한 구출 이미지를 살렸고, ‘입’ 이미지는 유지했습니다.
- source_word: וַיָּקָם עָלַי
  english_pob_choice: when it rose up against me
  chosen_korean: 그것이 나를 향해 일어설 때[b]
  alternatives_korean:
  - 그것이 나를 향해 일어나자
  - 그것이 나를 대적하여 일어날 때
  lexicon: HALOT
  rationale: קום על의 적대적 상승을 ‘나를 향해 일어설 때’로 옮겨, 공격적 뉘앙스를 살리면서도 현대 한국어에서 자연스럽게 표현했습니다.
- source_word: וְהֶחֱזַקְתִּי בִּזְקָנוֹ
  english_pob_choice: I seized it by its beard
  chosen_korean: 내가 그 수염을 붙잡고
  alternatives_korean:
  - 내가 그 수염을 움켜잡고
  - 내가 그 턱수염을 붙들고
  lexicon: HALOT
  rationale: זקן을 본문대로 ‘수염’으로 직역해 동물의 턱 주변 털을 가리키는 낯선 이미지를 보존했고, חזק은 ‘붙잡다’로 힘있게 옮겼습니다.
- source_word: וַהֲמִיתִּיו
  english_pob_choice: killed it
  chosen_korean: 쳐서 죽였습니다
  alternatives_korean:
  - 죽였습니다
  - 쳐 죽였습니다
  lexicon: HALOT
  rationale: 앞의 ‘쳤다’와 뒤의 ‘죽였다’를 분리하여 히브리어의 단계적 표현을 살렸고, explicit한 살해 동사를 마지막에 두었습니다.
theological_decisions:
- issue: 동물 지시대명사와 남성 단수 접미사의 처리
  chosen_reading: 문맥상 동물을 가리키므로 한국어에서는 자연스럽게 ‘그것’과 ‘입’으로 옮겼습니다.
  alternative_readings:
  - 그를/그의 입
  - 그 녀석을/그의 입
  rationale: 히브리어의 남성 단수 접미사는 문법적 성별을 따르지만, 한국어에서는 인칭화보다 동물 지시가 더 정확하고 오해를 줄입니다.
  doctrine_reference: 본문 문맥의 서술 정확성
