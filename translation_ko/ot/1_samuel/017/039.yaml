  text: וַ/יַּחְגֹּ֣ר דָּוִ֣ד אֶת חַ֠רְבּ/וֹ מֵ/עַ֨ל לְ/מַדָּ֜י/ו וַ/יֹּ֣אֶל לָ/לֶכֶת֮ כִּ֣י לֹֽא נִסָּה֒ וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל שָׁא֗וּל לֹ֥א אוּכַ֛ל לָ/לֶ֥כֶת בָּ/אֵ֖לֶּה כִּ֣י לֹ֣א נִסִּ֑יתִי וַ/יְסִרֵ֥/ם דָּוִ֖ד מֵ/עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/039.yaml
  text: And David strapped his sword over his armor and tried to go[a], for he had not tested them. But David said to Saul, “I cannot go with these[b], for I have not tested them.” So David removed them from himself.
  footnotes:
  - marker: a
    text: Or “for he had not tried them”; the Hebrew verb can denote testing by use or experience.
    reason: lexical_alternative
  - marker: b
    text: “Armor” renders a term that can more broadly mean garments or attire, but here the military context favors armor.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 자기 칼을 갑옷 위에 차고, 아직 그것들을 시험해 보지 않았기에 가 보려고 했습니다[a]. 다윗이 사울에게 말했습니다. “저는 이것들을 가지고는 갈 수 없습니다[b]. 아직 그것들을 시험해 본 적이 없기 때문입니다.” 그래서 다윗은 그것들을 자기 몸에서 벗어 놓았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그것들을 시험해 보지 않았기 때문에.” 히브리어 동사는 사용해 보며 시험하는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘갑옷’은 더 넓게는 옷차림을 뜻할 수 있지만, 여기서는 군사적 문맥이므로 갑옷으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְגֹּר
  english_pob_choice: strapped
  chosen_korean: 차고
  alternatives_korean:
  - 매고
  - 둘러 차고
  - 걸어 차고
  lexicon: HALOT
  rationale: 칼을 몸에 장비하는 동작을 자연스러운 현대 한국어로 살리되, 무기 장착의 구체성을 유지하기 위해 ‘차고’로 옮겼습니다.
- source_word: מֵעַל לְמַדָּיו
  english_pob_choice: over his armor
  chosen_korean: 갑옷 위에
  alternatives_korean:
  - 옷 위에
  - 복장 위에
  - 군복 위에
  lexicon: HALOT
  rationale: 문맥상 단순한 옷이 아니라 전투용 장비를 가리키므로, POB의 해석을 따라 ‘갑옷’으로 구체화했습니다.
- source_word: וַיֹּאֶל לָלֶכֶת
  english_pob_choice: tried to go
  chosen_korean: 걸어가 보려 했습니다
  alternatives_korean:
  - 가려 했습니다
  - 가 보려 했습니다
  - 가려고 했습니다
  lexicon: HALOT
  rationale: يال/ואל의 뉘앙스를 단순한 의지보다 ‘시도’로 드러내기 위해, 무장의 불편함 속에서 실제로 움직여 보려는 의미를 살렸습니다.
- source_word: לֹא נִסָּה / לֹא נִסִּיתִי
  english_pob_choice: had not tested them / have not tested them
  chosen_korean: 시험해 보지 않았기
  alternatives_korean:
  - 익숙하지 않았기
  - 써 보지 않았기
  - 검증해 보지 않았기
  lexicon: HALOT
  rationale: נָסָה의 핵심 의미인 ‘시험하다/시험해 보다’를 반복 구조에 맞춰 일관되게 옮겨, 경험 부족의 이유를 본문대로 유지했습니다.
theological_decisions:
- issue: 다윗이 사울의 무장을 받아들이지 않는 이유
  chosen_reading: 본문은 단순한 편의의 문제가 아니라, 다윗이 아직 그 장비를 자기 방식으로 ‘시험’해 보지 않았다는 점을 강조합니다.
  alternative_readings:
  - 그가 그 장비에 익숙하지 않았다는 뜻으로 완화해 읽을 수 있습니다.
  - 그가 전투 경험이 없어서 신중했다는 일반적 의미로 읽을 수 있습니다.
  rationale: 히브리어 반복어 נָסָה를 ‘시험하다’로 유지하면, 새 장비에 대한 실제 경험 부족이 서술의 핵심으로 드러나고, 문맥상 다윗의 판단이 더 분명해집니다.
  doctrine_reference: 본문 주해/서술 의미
- issue: 대화체의 자연스러운 한국어 재현
  chosen_reading: 사울에게 직접 말하는 부분은 인용문 안에서 평서형을 유지해 보고문체를 살렸습니다.
  alternative_readings:
  - 더 구어적으로 ‘갈 수 없어요’로 옮길 수 있습니다.
  - 더 고전적으로 ‘갈 수 없습니다’만 반복할 수 있습니다.
  rationale: 서술은 합쇼체를 유지하되, 직접화법은 본문의 긴장감을 해치지 않는 범위에서 자연스러운 현대 한국어로 구성했습니다.
  doctrine_reference: 번역 문체/화법
