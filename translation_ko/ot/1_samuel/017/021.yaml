  - 마주하여
  - 맞서
  - 향하여
  lexicon: HALOT
  rationale: 직역의 ‘대항하여’보다, 두 진형이 서로 맞서 대치하는 장면을 한국어로 자연스럽게 드러내는 표현을 택했습니다.
- source_word: יִשְׂרָאֵל / וּפְלִשְׁתִּים
  english_pob_choice: Israel and the Philistines
  chosen_korean: 이스라엘과 블레셋 사람들은
