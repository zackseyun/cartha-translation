lexical_decisions:
- source_word: וַתַּעֲרֹךְ
  english_pob_choice: drew up
  chosen_korean: 전투 진형을 갖추었습니다
  alternatives_korean:
  - 대열을 갖추었습니다
  - 전열을 펼쳤습니다
  - 전투 대형을 갖추었습니다
  lexicon: HALOT
  rationale: 군사적 맥락의 ערך는 병력을 정렬하여 싸울 준비를 하는 뜻이므로, 현대 한국어에서 자연스럽고 군사적 의미가 분명한 표현으로 옮겼습니다.
- source_word: מַעֲרָכָה
  english_pob_choice: battle line
  chosen_korean: 전투 진형
  alternatives_korean:
  - 전투 대열
  - 전열
  - 전투 배열
  lexicon: HALOT
  rationale: 반복되는 מַעֲרָכָה는 정렬된 군사 편제를 가리키므로, ‘전투 진형’으로 옮겨 반복되는 구조를 살리면서도 읽기 쉽게 했습니다.
- source_word: לִקְרַאת
  english_pob_choice: against
  chosen_korean: 서로 마주한
  alternatives_korean:
  - 마주하여
  - 맞서
  - 향하여
  lexicon: HALOT
  rationale: 직역의 ‘대항하여’보다, 두 진형이 서로 맞서 대치하는 장면을 한국어로 자연스럽게 드러내는 표현을 택했습니다.
- source_word: יִשְׂרָאֵל / וּפְלִשְׁתִּים
  english_pob_choice: Israel and the Philistines
  chosen_korean: 이스라엘과 블레셋 사람들은
  alternatives_korean:
  - 이스라엘과 블레셋은
  - 이스라엘과 블레셋인들은
  lexicon: 고유명사 표기
  rationale: 이스라엘은 통용 표기를 따르고, פלשתים은 집단명으로서 ‘블레셋 사람들’이 현대 한국어에서 의미를 분명하게 전달합니다.
