revisions:
- from: 엘리압의 큰형이 그가 사람들에게 말하는 것을 들었고, 엘리압의 분노가 다윗에게 불탔습니다. 그는 말했습니다. "왜 여기로 내려왔느냐? 그리고 누구에게 그 몇 마리 양을 광야에 두고 왔느냐? 나는 네가 가진 그 오만과 네 마음의 악을 알고 있다. 네가 전투를 보려고 내려왔기 때문이다."[a][b]
  to: 그의 맏형 엘리압이 그가 사람들에게 말하는 것을 들었습니다. 엘리압은 다윗에게 분노가 치밀어 올라 말했습니다. “왜 네가 여기로 내려왔느냐? 광야에 있는 그 몇 마리 양은 누구에게 맡겨 두었느냐? 나는 네 오만[a]과 네 마음의 악[b]을 알고 있다. 네가 전투를 보려고 내려왔기 때문이다.”
  rationale: 친족 관계를 원문대로 바로잡고, 한국어 어법에 맞게 분노 관용구와 양을 남긴 상황을 다듬었습니다. 두 어휘 각주를 각각 해당 본문어에 붙여 표지 연결을 바로잡았습니다. ‘맡겨 두었느냐’는 נָטַשׁ의 ‘남겨 두다’가 이 문맥에서 돌봄의 대상을 묻는다는 함의를 자연스럽게 나타내며, 그 범위를 넘는 해석은 추가하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:18:49Z'
