  text: וַ/יִּשְׁמַ֤ע אֱלִיאָב֙ אָחִ֣י/ו הַ/גָּד֔וֹל בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים וַ/יִּֽחַר אַף֩ אֱלִיאָ֨ב בְּ/דָוִ֜ד וַ/יֹּ֣אמֶר לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ וְ/עַל מִ֨י נָטַ֜שְׁתָּ מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙ בַּ/מִּדְבָּ֔ר אֲנִ֧י יָדַ֣עְתִּי אֶת זְדֹנְ/ךָ֗ וְ/אֵת֙ רֹ֣עַ לְבָבֶ֔/ךָ כִּ֗י לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה יָרָֽדְתָּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/028.yaml
  text: Now Eliab his oldest brother heard him speaking to the men[a], and Eliab’s anger burned against David, and he said, “Why have you come down here? And with whom have you left those few sheep in the wilderness? I know your presumption and the evil of your heart[b], for you have come down to see the battle.”
  footnotes:
  - marker: a
    text: Or 'your pride' / 'your insolence' for 'your presumption.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the wickedness of your heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 맏형 엘리압이 그가 사람들에게 말하는 것을 들었습니다. 엘리압은 다윗에게 분노가 치밀어 올라 말했습니다. “왜 네가 여기로 내려왔느냐? 광야에 있는 그 몇 마리 양은 누구에게 맡겨 두었느냐? 나는 네 오만[a]과 네 마음의 악[b]을 알고 있다. 네가 전투를 보려고 내려왔기 때문이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 주제넘음’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 마음의 악독’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/דַבְּר֖/וֹ
  english_pob_choice: him speaking
  chosen_korean: 그가 사람들에게 말하는 것을
  alternatives_korean:
  - 그가 사람들에게 말할 때
  - 그가 사람들에게 말하는 중에
  lexicon: HALOT
  rationale: 진행 중인 발화를 들었다는 시점을 살리기 위해 동명사적 표현을 썼으며, 한국어에서도 자연스럽게 시간적·상황적 배경을 전달합니다.
- source_word: וַ/יִּֽחַר אַף
  english_pob_choice: anger burned
  chosen_korean: 분노가 … 불탔습니다
  alternatives_korean:
  - 분노가 … 끓어올랐습니다
  - 화가 … 났습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 불타는 이미지를 살리기 위해 직유적으로 옮겼고, 엘리압의 격앙된 반응을 유지합니다.
- source_word: זְדֹנְ/ךָ֗
  english_pob_choice: your presumption
  chosen_korean: 네가 가진 그 오만
  alternatives_korean:
  - 네 주제넘음
  - 네 거만함
  - 네 오만함
  lexicon: HALOT
  rationale: זָדוֹן의 핵심인 교만하고 주제넘은 태도를 반영하되, 한국어에서 문맥상 자연스러운 명사구로 처리했습니다.
- source_word: רֹ֣עַ לְבָבֶ֔/ךָ
  english_pob_choice: the evil of your heart
  chosen_korean: 네 마음의 악
  alternatives_korean:
  - 네 마음의 악함
  - 네 마음의 악독
  lexicon: HALOT
  rationale: 내면의 도덕적 악을 직접적으로 드러내는 표현을 택해, 히브리어의 강한 اخلاق적 비난을 약화시키지 않았습니다.
- source_word: לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה
  english_pob_choice: to see the battle
  chosen_korean: 전투를 보려고
  alternatives_korean:
  - 전투를 보기 위해
  - 전투를 보러
  lexicon: HALOT
  rationale: 목적을 나타내는 לְמַעַן을 한국어의 '-려고'로 자연스럽게 옮기면서, 현재 벌어지는 군사 충돌의 구체성을 살렸습니다.
theological_decisions:
- issue: 엘리압의 직설적 비난을 한국어에서 얼마나 강하게 유지할지
  chosen_reading: 엘리압의 말은 꾸밈없이 직설적으로, "오만"과 "마음의 악"이라는 비난이 그대로 드러나게 옮겼습니다.
  alternative_readings:
  - 좀 더 완곡한 비난으로 바꾸기
  - 해설적으로 누그러뜨리기
  rationale: 본문은 다윗을 향한 형의 적대감과 오해를 강조하므로, 정서적 강도를 낮추면 장면의 긴장이 약해집니다.
  doctrine_reference: 본문 서술의 수사와 인물 묘사 보존
- issue: 직접화법의 한국어 문체
  chosen_reading: 직접 인용문 안에서도 엘리압의 거친 질책은 평서형/의문형으로 유지하고, 서술부는 합쇼체로 통일했습니다.
  alternative_readings:
  - 직접화법까지 모두 높임말로 평탄화
  - 대화체를 현대 구어체로 바꾸기
  rationale: 서술과 대화의 층위를 구분해야 화자 간 관계와 장면의 긴박함이 잘 드러납니다.
  doctrine_reference: 서사체의 화자 구분과 담화 등록
