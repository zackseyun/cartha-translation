source:
  edition: WLC
  text: וַ/יִּטֹּשׁ֩ דָּוִ֨ד אֶת הַ/כֵּלִ֜ים מֵ/עָלָ֗י/ו עַל יַד֙ שׁוֹמֵ֣ר הַ/כֵּלִ֔ים וַ/יָּ֖רָץ הַ/מַּעֲרָכָ֑ה וַ/יָּבֹ֕א וַ/יִּשְׁאַ֥ל לְ/אֶחָ֖י/ו לְ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/022.yaml
  text: So David left the supplies with the keeper of the supplies[a], and ran to the battle line[c][b]. When he arrived, he asked his brothers how they were.
  footnotes:
  - marker: a
    text: Or 'the baggage' / 'the equipment' for 'the supplies' (Hebrew כֵּלִים), a broad term for articles or gear. Here it likely refers to the provisions David was carrying.
    reason: lexical_alternative
  - marker: b
    text: Or 'the ranks' for 'the battle line' (Hebrew מַעֲרָכָה), referring to the arranged line or formation of troops.
    reason: lexical_alternative
  - marker: c
    text: Literally 'asked his brothers for peace'; this Hebrew idiom means he inquired about their welfare or well-being.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 물품을 물품 담당자에게 맡기고 전열로 달려가서, 도착하자 형제들의 안부를 물었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כֵּלִים은 넓게는 ‘물품, 기구, 장비’를 뜻합니다. 이 구절에서는 다윗이 가져온 소지품을 가리키는 것으로 보는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 מַעֲרָכָה는 정렬된 전투 대형이나 전선을 가리킵니다. 여기서는 ‘전열’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 관용구 ‘평안을 묻다’는 상대의 안녕이나 무사를 묻는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטֹּשׁ / הַכֵּלִים
  english_pob_choice: left the supplies
  chosen_korean: 물품을 맡기고
  alternatives_korean:
  - 보따리를 내려놓고
  - 장비를 두고
  lexicon: HALOT
  rationale: כֵּלִים은 문맥상 다윗이 들고 온 소지품·물품을 가리키므로, 군사적 장비보다 중립적인 ‘물품’이 더 잘 맞습니다. וַיִּטֹּשׁ은 여기서 ‘버리다’보다 일시적으로 ‘맡기다’로 보는 것이 서사 문맥에 맞습니다.
- source_word: עַל יַד שֹׁמֵר הַכֵּלִים
  english_pob_choice: with the keeper of the supplies
  chosen_korean: 물품 담당자에게
  alternatives_korean:
  - 물품 보관인에게
  - 짐 보관 책임자에게
  lexicon: HALOT
  rationale: ‘손에 맡기다’는 뜻의 관용적 표현을 한국어에서는 자연스럽게 ‘~에게 맡기다’로 옮겼습니다. שֹׁמֵר는 단순한 경비원보다 맡아 관리하는 사람의 뜻이 강해 ‘담당자’가 무난합니다.
- source_word: הַמַּעֲרָכָה
  english_pob_choice: the battle line
  chosen_korean: 전열로
  alternatives_korean:
  - 전투 진형으로
  - 전열선으로
  lexicon: HALOT
  rationale: 이 단어는 정렬된 군대의 선/대형을 가리키므로, 현대 한국어에서는 간결한 군사 용어 ‘전열’이 가장 자연스럽습니다.
- source_word: וַיִּשְׁאַל לְאֶחָיו לְשָׁלוֹם
  english_pob_choice: asked his brothers how they were
  chosen_korean: 형제들의 안부를 물었습니다
  alternatives_korean:
  - 형제들의 평안을 물었습니다
  - 형제들에게 안부를 전했습니다
  lexicon: HALOT
  rationale: שׁאל לְשָׁלוֹם은 단순한 인사가 아니라 상대의 안녕·무사를 묻는 관용구이므로, ‘안부를 묻다’가 의미를 가장 잘 전달합니다.
