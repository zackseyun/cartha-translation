- from: 그가 서서 이스라엘의 전열을 향해 외쳐 그들에게 말했습니다. "왜 싸움을 위해 진영을 갖추려고 나옵니까? 내가 바로 그 블레셋 사람이지 않습니까? 너희는 사울의 노예가 아니냐? 너희를 위해 한 사람을 골라 보내고, 그가 내게로 내려오게 하십시오."[a][b]
  to: 그가 서서 이스라엘의 전열을 향해 외쳐 말했습니다. “왜 전투 대열을 갖추려고 나옵니까?[b] 내가 바로 그 블레셋 사람이 아닙니까? 너희는 사울의 노예들이 아닙니까?[a] 너희를 위해 한 남자를 고르고, 그가 내게로 내려오게 하십시오.”
  rationale: 원문의 전투 대형 의미, 복수형 ‘노예들’, 남성 단수 ‘한 남자’를 보존하고, 모든 발화를 현대 격식체 합쇼체로 통일했습니다. 각주 표지를 각 해당 어구에 직접 배치했습니다.
