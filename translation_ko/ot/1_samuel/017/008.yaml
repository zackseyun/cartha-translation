base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/008.yaml
  text: He stood and called out to the battle lines of Israel and said to them[a], “Why do you come out to array yourselves for battle? Am I not the Philistine, and are you not slaves of Saul? Choose a man for yourselves[b], and let him come down to me.”
  footnotes:
  - marker: a
    text: Or “servants of Saul.” The Hebrew עֲבָדִים can denote either servants or slaves; here “slaves” preserves the insulting force of Goliath’s taunt.
    reason: lexical_alternative
  - marker: b
    text: Or “draw up for battle.” The Hebrew expression literally refers to arranging or lining up for combat.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 서서 이스라엘의 전열을 향해 외쳐 그들에게 말했습니다. "왜 싸움을 위해 진영을 갖추려고 나옵니까? 내가 바로 그 블레셋 사람이지 않습니까? 너희는 사울의 노예가 아니냐? 너희를 위해 한 사람을 골라 보내고, 그가 내게로 내려오게 하십시오."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사울의 종들.” 히브리어 עֲבָדִים은 “종들” 또는 “노예들”을 뜻할 수 있는데, 여기서는 골리앗의 조롱을 살리기 위해 “노예들”을 본문에 반영했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “전열을 갖추려고.” 히브리어 표현은 문자적으로는 전투를 위해 배열하거나 줄지어 서는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  english_pob_choice: He stood
  chosen_korean: 그가 서서
  alternatives_korean:
  - 그가 일어서서
  - 그가 자리를 잡고 서서
  lexicon: HALOT
  rationale: 서 있다는 동작 자체와 도전적 자세를 간결하게 살리기 위해 기본 동사를 택했습니다.
- source_word: מַעַרְכֹ֣ת יִשְׂרָאֵ֔ל
  english_pob_choice: the battle lines of Israel
  chosen_korean: 이스라엘의 전열
  alternatives_korean:
  - 이스라엘의 전투 대열
  - 이스라엘의 진열
  lexicon: HALOT
  rationale: 마아르코트는 정렬된 전투 대형을 가리키므로, 군사적 배열을 압축적으로 드러내는 '전열'이 적절합니다.
- source_word: לַ/עֲרֹ֣ךְ מִלְחָמָ֑ה
  english_pob_choice: to array yourselves for battle
  chosen_korean: 싸움을 위해 진영을 갖추려고
  alternatives_korean:
  - 전투를 위해 진을 치려고
  - 전열을 갖추려고 싸움을 하려고
  lexicon: HALOT
  rationale: ערך + מלחמה의 '전투를 위해 배열하다'는 뜻을 살리면서도 한국어로 자연스럽게 옮기기 위해 '진영을 갖추다'를 사용했습니다.
- source_word: עֲבָדִים לְשָׁאוּל
  english_pob_choice: slaves of Saul
  chosen_korean: 사울의 노예
  alternatives_korean:
  - 사울의 종
  - 사울의 종들
  lexicon: HALOT
  rationale: 이 표현은 골리앗의 조롱 속에서 굴종과 모욕의 뉘앙스를 강하게 드러내므로, POB의 결정에 따라 '노예'로 옮겼습니다.
- source_word: בְּרוּ לָכֶם אִישׁ
  english_pob_choice: Choose a man for yourselves
  chosen_korean: 너희를 위해 한 사람을 골라
  alternatives_korean:
  - 너희를 위해 한 남자를 선택해
  - 너희를 위해 한 전사를 골라
  lexicon: HALOT
  rationale: אישׁ의 남성 단수성을 유지하되, 한국어에서는 대결 맥락상 자연스러운 '한 사람'을 사용해 과도한 해석을 피했습니다.
theological_decisions:
- issue: עֲבָדִים의 사회적·모욕적 강도
  chosen_reading: 사울의 노예
  alternative_readings:
  - 사울의 종
  - 사울의 종들
  rationale: 이 구절은 단순한 소속보다 지배와 굴종을 조롱하는 발화이므로, 본문의 모욕적 힘을 살리는 번역이 더 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1
