  rationale: 이 구절은 단순한 소속보다 지배와 굴종을 조롱하는 발화이므로, 본문의 모욕적 힘을 살리는 번역이 더 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1
