source:
  edition: WLC
  text: וְ/שָׁא֤וּל וְ/הֵ֨מָּה֙ וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל בְּ/עֵ֖מֶק הָֽאֵלָ֑ה נִלְחָמִ֖ים עִם פְּלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/019.yaml
  text: Now Saul and they and all the men of Israel were in the Valley of Elah[a], fighting with the Philistines.
  footnotes:
  - marker: a
    text: Or 'against the Philistines.' The Hebrew preposition is literally 'with,' but in battle contexts it can denote hostile engagement.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울과 그들, 그리고 이스라엘의 모든 사람은 엘라 골짜기에서 블레셋 사람들과 싸우고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/שָׁאוּל
  english_pob_choice: Now Saul
  chosen_korean: 사울과
  alternatives_korean:
  - 그리고 사울은
  - 사울은
  lexicon: WLC
  rationale: וְ는 단순 연결이므로 한국어에서는 서술 흐름을 자연스럽게 잇는 연결로 옮겼습니다. 문맥상 새 사건의 도입보다 연속성을 표시하는 데 초점을 두었습니다.
- source_word: וְ/הֵמָּה
  english_pob_choice: and they
  chosen_korean: 그들과
  alternatives_korean:
  - 그리고 그들은
  - 그들은
  lexicon: WLC
  rationale: 독립대명사의 지시 대상을 살리되, 한국어에서는 목적격이 아닌 병렬적 주어 묶음으로 자연스럽게 처리했습니다.
- source_word: וְ/כָל אִישׁ יִשְׂרָאֵל
  english_pob_choice: and all the men of Israel
  chosen_korean: 이스라엘의 모든 사람은
  alternatives_korean:
  - 이스라엘의 모든 남자는
  - 온 이스라엘 사람들은
  lexicon: WLC
  rationale: 히브리어의 분배적 표현을 살리면서도, 현대 한국어에서 성별 포괄성이 드러나도록 ‘모든 사람’으로 옮겼습니다. 본문의 집단 전체를 가리키는 힘을 유지했습니다.
- source_word: בְּ/עֵמֶק הָאֵלָה
  english_pob_choice: in the Valley of Elah
  chosen_korean: 엘라 골짜기에
  alternatives_korean:
  - 엘라 계곡에
  - 엘라의 골짜기에
  lexicon: WLC
  rationale: עֵמֶק은 ‘골짜기/계곡’의 지형명사이므로 ‘골짜기’로 직역해 장소 감각을 살렸습니다. 고유지명은 음역을 유지했습니다.
- source_word: נִלְחָמִים עִם פְּלִשְׁתִּים
  english_pob_choice: fighting with the Philistines
  chosen_korean: 블레셋 사람들과 싸우고 있었습니다
  alternatives_korean:
  - 블레셋 사람들과 전쟁하고 있었습니다
  - 블레셋 사람들에 맞서 싸우고 있었습니다
  lexicon: WLC
  rationale: נִלְחָמִים는 진행 중인 전투를 나타내므로 진행형으로 옮겼습니다. עִם은 문자적으로 ‘~와 함께’이지만 전투 문맥에서는 적대적 대치를 뜻하므로 한국어에서도 ‘~와 싸우다’로 자연스럽게 반영했습니다.
