  text: וְ/דָוִד֩ בֶּן אִ֨ישׁ אֶפְרָתִ֜י הַ/זֶּ֗ה מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה וּ/שְׁמ֣/וֹ יִשַׁ֔י וְ/ל֖/וֹ שְׁמֹנָ֣ה בָנִ֑ים וְ/הָ/אִישׁ֙ בִּ/ימֵ֣י שָׁא֔וּל זָקֵ֖ן בָּ֥א בַ/אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/012.yaml
  text: Now David was the son of an Ephrathite from Bethlehem of Judah[a], whose name was Jesse, and he had eight sons. In the days of Saul, the man was old, advanced in years.
  footnotes:
  - marker: a
    text: 'Or, more idiomatically, ''the man was old, advanced in years.'' The Hebrew expression is unusual: literally, ''old, come among men.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 유다의 베들레헴 출신 에브랏 사람인 이새의 아들이었는데, 그에게는 아들 여덟이 있었습니다. 사울 시대에 그 사람은 늙어서 연로했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘그 사람은 늙어서 연로했습니다.’ 히브리어 표현은 특이하며, 문자적으로는 ‘늙어 사람들 가운데 들어온’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  english_pob_choice: Ephrathite
  chosen_korean: 에브랏 사람
  alternatives_korean:
  - 에브라임 사람
  - 에브랏 출신 사람
  lexicon: HALOT
  rationale: 문맥상 에브라임 지파가 아니라 베들레헴과 연결된 지리·출신 표지이므로, 지명 에브랏을 보존하는 번역이 적절합니다.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  english_pob_choice: from Bethlehem of Judah
  chosen_korean: 유다의 베들레헴 출신
  alternatives_korean:
  - 유다 땅 베들레헴 출신
  - 유다에 있는 베들레헴 출신
  lexicon: HALOT
  rationale: 히브리어의 지리적 소속 관계를 자연스럽게 풀어, 다른 베들레헴과 구분되는 유다의 베들레헴임을 드러냈습니다.
- source_word: וְלוֹ שְׁמֹנָה בָנִים
  english_pob_choice: and he had eight sons
  chosen_korean: 그에게는 아들 여덟이 있었습니다
  alternatives_korean:
  - 그에게는 여덟 아들이 있었습니다
  - 그에게는 아들 여덟 명이 있었습니다
  lexicon: HALOT
  rationale: 소유 관계를 한국어로 자연스럽게 옮기되, 히브리어의 단순한 수량 진술을 유지했습니다.
- source_word: בָּא בַאֲנָשִׁים
  english_pob_choice: advanced among men
  chosen_korean: 연로했습니다
  alternatives_korean:
  - 사람들 가운데 들어섰습니다
  - 남자들 가운데 들어왔습니다
  - 사람들 가운데 나이 들어 있었습니다
  lexicon: HALOT
  rationale: 직역하면 난해한 관용구이므로, 문맥이 요구하는 연령 의미를 한국어의 자연한 표현으로 옮겼습니다. 다만 아래 각주로 히브리어의 비정상적 표현을 보존했습니다.
theological_decisions:
- issue: 히브리어 관용구 בָּא בַאֲנָשִׁים의 처리
  chosen_reading: 본문은 의미를 분명히 하기 위해 ‘연로했습니다’로 옮기고, 각주에서 직역상 ‘사람들 가운데 들어온/들어선’이라는 낯선 표현을 알려 줍니다.
  alternative_readings:
  - ‘사람들 가운데 들어섰습니다’
  - ‘사람들 사이에 들어왔습니다’
  - ‘나이 들어 있었습니다’
  rationale: 이 표현은 노년을 뜻하는 관용구이지만 문자형식이 매우 특이하므로, 본문 가독성과 원문 흔적을 함께 살리기 위해 의미역과 각주를 병행했습니다.
  doctrine_reference: 해석학적 투명성
