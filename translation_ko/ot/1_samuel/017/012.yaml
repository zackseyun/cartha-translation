base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/012.yaml
  text: Now David was the son of an Ephrathite from Bethlehem of Judah[a], whose name was Jesse, and he had eight sons. In the days of Saul, the man was old, advanced in years.
  footnotes:
  - marker: a
    text: 'Or, more idiomatically, ''the man was old, advanced in years.'' The Hebrew expression is unusual: literally, ''old, come among men.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 유다의 베들레헴 출신 에브랏 사람 이새의 아들이었습니다. 이새에게는 아들 여덟이 있었습니다. 사울 시대에 이새는 늙었고 나이가 많았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 특이합니다. 직역하면 ‘늙었으며 사람들 가운데 들어온’이라는 뜻이며, 노년에 이르렀다는 의미로 이해됩니다.
    reason: lexical_alternative
