lexical_decisions:
- source_word: וְ/דָוִ֛ד הֹלֵ֥ךְ וָ/שָׁ֖ב
  english_pob_choice: went back and forth
  chosen_korean: 왔다 갔다 했습니다
  alternatives_korean:
  - 오가며 지냈습니다
  - 왔다 갔다 하였습니다
  - 가고 돌아오곤 했습니다
  lexicon: HALOT
  rationale: הלך와 שוב의 반복·습관적 동작을 한국어의 자연스러운 반복 표현으로 살렸습니다. 단발적 이동이 아니라 사울과 목양 사이를 계속 오가던 상황을 드러냅니다.
- source_word: מֵ/עַ֣ל שָׁא֑וּל
  english_pob_choice: from Saul
  chosen_korean: 사울에게서
  alternatives_korean:
  - 사울에게서부터
  - 사울의 곁에서
  - 사울의 앞에서
  lexicon: HALOT
  rationale: מֵעַל의 관용적 의미를 따라 ‘사울에게서’로 옮겨, 사울의 존재/근무 자리에서 떨어져 나오는 반복적 이동을 간결하게 표현했습니다.
- source_word: לִ/רְע֛וֹת אֶת צֹ֥אן
  english_pob_choice: to shepherd his father's flock
  chosen_korean: 아버지의 양 떼를 치기 위해
  alternatives_korean:
  - 아버지의 양 떼를 목양하기 위해
  - 아버지의 양 떼를 돌보기 위해
  - 아버지의 양 떼를 치려고
  lexicon: HALOT
  rationale: רעה의 목자적 의미를 ‘치다’로 옮겨, 단순 관리가 아니라 목양의 책임을 나타냈습니다. צֹאן은 집합적 의미를 살려 ‘양 떼’로 번역했습니다.
- source_word: בֵּֽית לָֽחֶם
  english_pob_choice: Bethlehem
  chosen_korean: 베들레헴에서
  alternatives_korean:
