  yaml_path: translation/ot/1_samuel/027/008.yaml
  text: Then David and his men went up and made raids against the Geshurites[a], the Girzites, and the Amalekites, for these were the inhabitants of the land from ancient times, as you go to Shur[b], even to the land of Egypt.
  footnotes:
  - marker: a
    text: Or “the Gezrites.” The Hebrew ethnonym here is textually and translationally uncertain in English tradition; this draft follows the consonantal form represented in the provided text as “Girzites.”
    reason: lexical_alternative
  - marker: b
    text: Or “as far as the land of Egypt.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗과 그의 사람들이 올라가 그술 사람들, 기르스 사람들[a], 그리고 아말렉 사람들을 습격하였습니다. 이들은 옛적부터 수르로 가는 길[b]을 따라 이집트 땅에 이르는 지역에 살던 주민들이었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “게즈르 사람들.” 이 민족명은 히브리어 본문의 형태와 전승상 불확실성이 있어 다른 음역도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “수르로 가는 길에서부터 이집트 땅까지.” 히브리어는 그 지역의 지리적 범위를 나타내는 관용적 표현입니다.
    reason: lexical_alternative
