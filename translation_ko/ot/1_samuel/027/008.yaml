base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/008.yaml
  text: Then David and his men went up and made raids against the Geshurites[a], the Girzites, and the Amalekites, for these were the inhabitants of the land from ancient times, as you go to Shur[b], even to the land of Egypt.
  footnotes:
  - marker: a
    text: Or “the Gezrites.” The Hebrew ethnonym here is textually and translationally uncertain in English tradition; this draft follows the consonantal form represented in the provided text as “Girzites.”
    reason: lexical_alternative
  - marker: b
    text: Or “as far as the land of Egypt.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗과 그의 사람들이 올라가서 그술 사람들[a], 기르스 사람들, 그리고 아말렉 사람들을 쳐서 약탈하였는데, 그들은 옛적부터 그 땅의 주민이었기 때문입니다. 그 땅은 여러분이 수르로 가는 길[b]에서부터 이집트 땅까지 미칩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 제르 사람들.” 여기서는 제공된 히브리어 자음형에 가까운 음역을 따랐습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “이집트 땅까지.” 히브리어는 경계의 종점을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라가서
  alternatives_korean:
  - 갔습니다
  - 진군했습니다
  lexicon: HALOT
  rationale: עלה의 기본 서술 동작을 살리면서, 문맥상 지형적 상승과 이동을 함께 드러내는 표현을 선택했습니다.
- source_word: וַיִּפְשְׁטוּ
  english_pob_choice: made raids
  chosen_korean: 쳐서 약탈하였는데
  alternatives_korean:
  - 습격하였는데
  - 약탈하였는데
  lexicon: HALOT
  rationale: 군사적 פשט의 의미를 살려 단순한 '공격'보다 약탈을 동반한 습격의 뉘앙스를 담았습니다.
- source_word: הַגְּשׁוּרִי / הגרזי
  english_pob_choice: the Geshurites / the Girzites
  chosen_korean: 그술 사람들 / 기르스 사람들
  alternatives_korean:
  - 그슈르 사람들 / 게르즈 사람들
  - 게수르 사람들 / 기르지 사람들
  lexicon: HALOT
  rationale: 민족명은 한국어 성서 전통의 통용형보다 원어 자음군과 POB의 음역 결정을 따라 사람들로 옮겼습니다. גרזי는 영어 주석의 불확정성을 반영해 기르스 사람들로 처리했습니다.
- source_word: כִּי הֵנָּה יֹשְׁבוֹת הָאָרֶץ
  english_pob_choice: for these were the inhabitants of the land
  chosen_korean: 그들은 옛적부터 그 땅의 주민이었기 때문입니다
  alternatives_korean:
  - 그들은 그 땅에 거주하던 자들이었기 때문입니다
  - 그들이 그 땅의 주민이었기 때문입니다
  lexicon: HALOT
  rationale: 지시대명사 הֵנָּה의 ‘이들/그들은’ 감각을 살리고, יֹשְׁבוֹת의 지속적 거주를 한국어의 ‘주민’으로 자연스럽게 옮겼습니다.
- source_word: מֵעוֹלָם
  english_pob_choice: from ancient times
  chosen_korean: 옛적부터
  alternatives_korean:
  - 옛날부터
  - 오래전부터
  lexicon: HALOT
  rationale: עולם은 여기서 영원이 아니라 오랜 과거를 가리키므로, 시간적 장구함을 간결하게 나타냈습니다.
theological_decisions:
- issue: 지명 경계 표현 בּוֹאֲךָ שׁוּרָה וְעַד אֶרֶץ מִצְרַיִם
  chosen_reading: 여러분이 수르로 가는 길에서부터 이집트 땅까지 미칩니다
  alternative_readings:
  - 수르로 가는 길에서부터 이집트 땅까지
  - 수르에 이르는 길에서부터 이집트 땅까지
  rationale: 히브리어의 관용적 경계 표지를 한국어로 풀어, 영역의 끝을 나타내는 지리적 범위를 분명히 했습니다.
  doctrine_reference: 지리·서술 문맥
