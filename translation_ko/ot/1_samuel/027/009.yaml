source:
  edition: WLC
  text: וְ/הִכָּ֤ה דָוִד֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א יְחַיֶּ֖ה אִ֣ישׁ וְ/אִשָּׁ֑ה וְ/לָקַח֩ צֹ֨אן וּ/בָקָ֜ר וַ/חֲמֹרִ֤ים וּ/גְמַלִּים֙ וּ/בְגָדִ֔ים וַ/יָּ֖שָׁב וַ/יָּבֹ֥א אֶל אָכִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/009.yaml
  text: David struck the land and left alive neither man nor woman[a], and he took sheep, cattle, donkeys, camels, and clothing. Then he returned and came to Achish.
  footnotes:
  - marker: a
    text: Or, 'did not let man or woman live.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 그 땅을 쳐서 남자나 여자 한 사람도 살려 두지 않았습니다[a]. 그는 양과 소와 나귀와 낙타와 옷을 가져갔습니다. 그런 다음 돌아와 아기스에게 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남자나 여자를 살려 두지 않았다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכָּה
  english_pob_choice: struck
  chosen_korean: 쳤고
  alternatives_korean:
  - 공격했고
  - 때렸고
  lexicon: HALOT
  rationale: נכה의 전형적 의미를 살리면서도, 군사적 맥락에서 지나치게 해석하지 않기 위해 ‘쳤다’를 택했습니다.
- source_word: וְלֹא יְחַיֶּה אִישׁ וְאִשָּׁה
  english_pob_choice: left alive neither man nor woman
  chosen_korean: 남자나 여자 하나도 살려 두지 않았습니다
  alternatives_korean:
  - 남자나 여자 하나도 살려주지 않았습니다
  - 남자와 여자 중 누구도 살려 두지 않았습니다
  lexicon: HALOT
  rationale: ‘살리다/살려 두다’로 히필 형태의 의미를 반영했고, 남자와 여자를 병렬로 제시한 히브리어의 성 구분을 유지했습니다.
- source_word: צֹאן וּבָקָר וַחֲמֹרִים וּגְמַלִּים וּבְגָדִים
  english_pob_choice: sheep, cattle, donkeys, camels, and clothing
  chosen_korean: 양과 소와 나귀와 낙타와 옷
  alternatives_korean:
  - 양떼와 소떼와 나귀와 낙타와 의복
  - 가축과 소와 나귀와 낙타와 의복
  lexicon: HALOT
  rationale: 열거된 전리품을 구체적으로 살리되, 현대 한국어에서 자연스럽고 읽기 쉬운 보통명사로 옮겼습니다.
- source_word: וַיָּשָׁב וַיָּבֹא אֶל אָכִישׁ
  english_pob_choice: Then he returned and came to Achish
  chosen_korean: 그런 다음 그가 돌아와 아기스에게 왔습니다
  alternatives_korean:
  - 그리고 그는 돌아와 아기스에게 갔습니다
  - 그 후 돌아와 아기스에게 이르렀습니다
  lexicon: HALOT
  rationale: 연속 동사 두 개를 모두 살려 귀환과 도착의 흐름을 유지했고, 고유명사는 통용 표기인 ‘아기스’를 사용했습니다.
theological_decisions:
- issue: 폭력 서술의 직설성 유지
  chosen_reading: 사람을 살려 두지 않았다는 진술을 완화하지 않고 그대로 반영했습니다.
  alternative_readings:
  - ‘죽였다’로 명시적으로 풀어 쓰는 방식
  - ‘해치지 않았다’처럼 완곡하게 바꾸는 방식
  rationale: 히브리어는 생존 여부를 직접 진술하므로, 본문의 거친 사실성을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 원문 우선 번역 원칙
- issue: 성 구분 표현 유지
  chosen_reading: ‘남자나 여자’로 번역했습니다.
  alternative_readings:
  - ‘사람’으로 일반화하는 방식
  rationale: 본문이 성별 쌍을 명시하므로, 일반화하면 원문의 표현력을 잃게 됩니다.
  doctrine_reference: 원문 우선 번역 원칙
