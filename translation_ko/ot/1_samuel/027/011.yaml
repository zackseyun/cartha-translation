- from: 다윗은 가드[a]에 데려갈 사람을 남기지 않으려고 남자나 여자나 하나도 살려 두지 않았습니다. 그는 이렇게 말했습니다. "그렇지 않으면 그들이 우리에 대해 알리고, ‘다윗이 이렇게 했고[b], 그는 블레셋 사람들의 땅에 머무는 모든 날 동안 이렇게 해 왔다’고 말할까 두려웠기 때문입니다."
  to: 다윗은 남자나 여자나 한 사람도 살려 두지 않았습니다. 그들을 가드로 데려가지 않으려고 그렇게 했습니다. 그는 이렇게 말했습니다. “그렇지 않으면 그들이 우리에 대해 알리고, ‘다윗은 이렇게 했고, 그가 블레셋 사람들의 땅[a]에 머무는 모든 날 동안 이것이 그의 관례였다[b]’라고 말할지도 모릅니다.”
  rationale: 각주 표지를 각각 실제 설명 대상인 ‘블레셋 사람들의 땅’과 ‘그의 관례’로 바로잡았습니다. 또한 가드로 데려가지 않으려는 목적을 자연스럽게 드러내고, 원문의 말하기-인용 구조 및 פֶּן의 우려를 ‘말할지도 모릅니다’로 유지했습니다. 본문 의미나 신학적 해석은 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:26:06Z'
