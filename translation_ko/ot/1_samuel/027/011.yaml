source:
  edition: WLC
  text: וְ/אִ֨ישׁ וְ/אִשָּׁ֜ה לֹֽא יְחַיֶּ֣ה דָוִ֗ד לְ/הָבִ֥יא גַת֙ לֵ/אמֹ֔ר פֶּן יַגִּ֥דוּ עָלֵ֖י/נוּ לֵ/אמֹ֑ר כֹּֽה עָשָׂ֤ה דָוִד֙ וְ/כֹ֣ה מִשְׁפָּט֔/וֹ כָּל הַ֨/יָּמִ֔ים אֲשֶׁ֥ר יָשַׁ֖ב בִּ/שְׂדֵ֥ה פְלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/011.yaml
  text: David left alive neither man nor woman to bring to Gath[a], saying, “Otherwise they might report about us, saying, ‘This is what David did[b], and this was his practice all the days that he lived in the country of the Philistines.’”
  footnotes:
  - marker: a
    text: 'Hebrew: ''in the field of the Philistines,'' an idiom for Philistine territory or countryside.'
    reason: cultural_note
  - marker: b
    text: Or 'this was his custom' / 'this was his manner' for 'this has been his practice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 남자나 여자나 한 사람도 살려 두지 않았습니다. 그들을 가드로 데려가지 않으려고 그렇게 했습니다. 그는 이렇게 말했습니다. “그렇지 않으면 그들이 우리에 대해 알리고, ‘다윗은 이렇게 했고, 그가 블레셋 사람들의 땅[a]에 머무는 모든 날 동안 이것이 그의 관례였다[b]’라고 말할지도 모릅니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘블레셋 사람들의 들판’이지만, 여기서는 블레셋 영토를 가리키는 관용 표현입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘이것이 그의 습관이었다’ 또는 ‘이것이 그의 방식이었다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ וְאִשָּׁה
  english_pob_choice: neither man nor woman
  chosen_korean: 남자나 여자나 하나도
  alternatives_korean:
  - 남자도 여자도
  - 남녀를 불문하고 하나도
  lexicon: HALOT
  rationale: 히브리어의 남녀 짝은 분배적으로 쓰여 생존자를 전면적으로 가리키므로, 한국어도 총괄적 의미가 드러나도록 옮겼습니다.
- source_word: לֹא יְחַיֶּה
  english_pob_choice: left alive
  chosen_korean: 살려 두지 않았습니다
  alternatives_korean:
  - 살아 있게 두지 않았습니다
  - 살려 두지 않았습니다
  lexicon: HALOT
  rationale: פִּ엘형 חיה의 의미는 ‘살려 두다/살려 남기다’이므로, 자연스러운 현대 한국어로 사형적 완결성을 드러냈습니다.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  english_pob_choice: in the country of the Philistines
  chosen_korean: 블레셋 사람들의 땅
  alternatives_korean:
  - 블레셋 사람들의 나라
  - 블레셋 땅
  lexicon: HALOT
  rationale: 직역의 ‘들판’보다 관용적 지리 표현인 ‘땅’이 문맥상 영토를 더 정확히 전달합니다.
- source_word: מִשְׁפָּטוֹ
  english_pob_choice: this has been his practice
  chosen_korean: 이렇게 해 왔다
  alternatives_korean:
  - 이것이 그의 관습이었다
  - 이것이 그의 방식이었다
  lexicon: HALOT
  rationale: 여기서 משפט은 판결이 아니라 반복된 행태를 가리키므로, 서술 자연성을 살리되 습관적 지속을 반영하는 표현을 택했습니다.
theological_decisions:
- issue: 가드 지명 표기와 본문 주석 처리
  chosen_reading: 본문에는 가드를 그대로 두고, 각주로 그 배경이 블레셋 영토임을 밝힙니다.
  alternative_readings:
  - 가드 땅
  - 블레셋의 가드
  rationale: 히브리어는 ‘가드로 데려가다’라고 말하므로 지명을 유지하고, ‘블레셋 사람들의 땅’은 별도 문맥 정보로 처리하는 편이 원문 구조를 더 잘 보존합니다.
  doctrine_reference: 본문 지리 정보 처리 원칙
- issue: 직접화법 안의 인용 구조
  chosen_reading: 다윗의 두려움 설명 안에 다시 인용을 중첩해 원문의 말하기 흐름을 보존했습니다.
  alternative_readings:
  - 간접화법으로 단순화
  - 중첩 인용을 풀어 서술
  rationale: 원문은 ‘그들이 말할까 두렵다’와 인용문이 겹치는 구조이므로, 이를 풀어버리면 서술 의도와 증언의 내용이 약해집니다.
  doctrine_reference: 서사 문체 보존 원칙
