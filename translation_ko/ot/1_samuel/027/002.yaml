lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 떨쳐 일어났습니다
  - 일어나
  lexicon: HALOT
  rationale: 결정적인 행동의 시작을 나타내는 서술적 용법을 살려, 단순한 이동보다 행위의 개시를 드러내는 ‘일어났습니다’로 옮겼습니다.
- source_word: וַיַּעֲבֹר
  english_pob_choice: crossed over
  chosen_korean: 건너갔습니다
  alternatives_korean:
  - 지나갔습니다
  - 건너섰습니다
  lexicon: HALOT
  rationale: ישראל 영역에서 블레셋 영역으로의 이동이라는 방향성을 살리기 위해, 일반적인 ‘갔습니다’보다 ‘건너갔습니다’를 선택했습니다.
- source_word: וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר עִמּוֹ
  english_pob_choice: the six hundred men who were with him
  chosen_korean: 그와 함께 있던 육백 명의 사람
  alternatives_korean:
  - 그와 함께한 육백 명의 사람
  - 그와 함께 있던 육백 명의 군사
  lexicon: HALOT
  rationale: 숫자 표현과 동반자 관계를 자연스러운 한국어로 풀되, 본문이 말하는 단순한 ‘사람들’을 유지하기 위해 ‘군사’로 좁히지 않았습니다.
- source_word: אֶל אָכִישׁ בֶּן מָעוֹךְ מֶלֶךְ גַּת
  english_pob_choice: to Achish son of Maoch, king of Gath
  chosen_korean: 가드 왕 마옥의 아들 아기스에게로
  alternatives_korean:
  - 아기스에게로, 가드 왕 마옥의 아들
  - 가드의 왕 마옥의 아들 아기스에게로
  lexicon: HALOT
  rationale: 히브리어의 목적격 표지를 살려 ‘에게로’로 방향을 표시하고, 소유구문을 한국어 친화적으로 재배열하되 왕호와 출신지를 함께 보이도록 했습니다.
theological_decisions:
- issue: 다윗의 이동 동사와 방향성
  chosen_reading: ‘일어났습니다… 건너갔습니다’로 사건의 결단성과 경계 넘어감을 함께 드러냈습니다.
  alternative_readings:
  - ‘떠났습니다’
  - ‘갔습니다’
  rationale: 본문은 단순 이동보다 블레셋 지역으로 넘어가는 전환을 강조하므로, 결단을 나타내는 서술과 공간 이동을 모두 유지했습니다.
  doctrine_reference: 서사 본문의 서술 뉘앙스 보존
