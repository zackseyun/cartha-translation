base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/010.yaml
  text: Then Achish said[a], “Where have you made a raid today?” And David said, “Against the Negev of Judah, against the Negev of the Jerahmeelites[b], and against the Negev of the Kenites.”
  footnotes:
  - marker: a
    text: 'Hebrew text literally reads something like ''Did you not raid today?'' but the sense in context is interrogative: ''Where have you made a raid today?'''
    reason: textual_variant
  - marker: b
    text: Or 'the south of Judah ... the south of the Jerahmeelites ... the south of the Kenites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아기스가 말했습니다. “오늘 어디를 습격했습니까?”[a] 다윗이 말했습니다. “유다의 네겝[b]과 여라므엘 사람들의 네겝과 겐 사람들의 네겝을 습격했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문형은 문자적으로는 ‘오늘 너희가 약탈하지 않았느냐’에 가깝지만, 문맥상 아기스의 의도는 ‘오늘 어디를 습격했느냐’는 질문입니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘유다의 남방 … 여라므엘 사람들의 남방 … 겐 사람들의 남방.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל פְּשַׁטְתֶּם הַיּוֹם
  english_pob_choice: Where have you made a raid today?
  chosen_korean: 오늘 어디를 습격했습니까?
  alternatives_korean:
  - 오늘 공격했습니까?
  - 오늘 어디를 약탈했습니까?
  lexicon: HALOT
  rationale: 문맥상 아기스의 질문은 ‘어디를’ 대상으로 한 군사적 습격을 묻는 것이므로, 단순한 ‘하지 않았습니까’보다 질문의 의도를 드러내는 ‘어디를 습격했습니까’가 원문 의미를 더 정확히 옮깁니다.
- source_word: נֶגֶב
  english_pob_choice: Negev
  chosen_korean: 네겝
  alternatives_korean:
  - 남방
  - 남쪽
  lexicon: HALOT
  rationale: 여기서는 일반 방향어 ‘남쪽’보다 지명적·지리적 성격이 강하므로, 음역형 ‘네겝’을 유지해 반복되는 지명 구조를 살렸습니다.
- source_word: הַיַּרְחְמְאֵלִי
  english_pob_choice: the Jerahmeelites
  chosen_korean: 여라므엘 사람들
  alternatives_korean:
  - 여라므엘 족속
  - 여라므엘인
  lexicon: HALOT
  rationale: 히브리어 속격형 젠틸릭은 특정 조상명에서 나온 집단을 가리키므로, 한국어에서는 자연스러운 집단명인 ‘사람들’로 옮겼습니다.
- source_word: הַקֵּינִי
  english_pob_choice: the Kenites
  chosen_korean: 겐 사람들
  alternatives_korean:
  - 겐 족속
  - 케니 사람들
  lexicon: HALOT
  rationale: ‘Kenites’는 통상 ‘겐 사람들’로 옮기는 것이 한국어 성경 관행과 가독성에 가장 잘 맞고, 원문의 민족 집단 의미도 유지합니다.
