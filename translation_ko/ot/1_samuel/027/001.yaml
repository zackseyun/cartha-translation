  source_fidelity: 전반적인 의미 흐름은 잘 반영했으나, ‘사울의 손에 넘어가 죽을 것입니다’의 ‘넘어가’는 히브리어에 명시되지 않은 요소입니다. 또한 부정사 절대형의 강조에 관한 각주 b는 ‘반드시 피하는’에 붙어야 하며, 현재처럼 ‘포기할 것이며’에 붙으면 원어 근거 및 각주 내용과 맞지 않습니다.
