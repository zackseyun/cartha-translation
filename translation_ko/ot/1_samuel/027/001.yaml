id: 1SA.27.1
reference: 1 Samuel 27:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל לִבּ֔/וֹ עַתָּ֛ה אֶסָּפֶ֥ה יוֹם אֶחָ֖ד בְּ/יַד שָׁא֑וּל אֵֽין לִ֨/י ט֜וֹב כִּ֣י הִמָּלֵ֥ט אִמָּלֵ֣ט אֶל אֶ֣רֶץ פְּלִשְׁתִּ֗ים וְ/נוֹאַ֨שׁ מִמֶּ֤/נִּי שָׁאוּל֙ לְ/בַקְשֵׁ֤/נִי עוֹד֙ בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֔ל וְ/נִמְלַטְתִּ֖י מִ/יָּדֽ/וֹ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/001.yaml
  text: Then David said in his heart[a], “Now I will one day perish by the hand of Saul. There is nothing better for me than that I should surely escape to the land of the Philistines. Then Saul will despair of seeking me any longer in all the territory of Israel[c][b], and I will escape from his hand.”
  footnotes:
  - marker: a
    text: Or 'I will perish one day by the hand of Saul.' The Hebrew verb can be rendered more generally as 'perish' or more vividly as 'be swept away.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'escaping I will escape,' an infinitive absolute with finite verb for emphasis.
    reason: lexical_alternative
  - marker: c
    text: Or 'Then Saul will give up seeking me any longer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다윗이 속으로 말했습니다[a]. “이제 나는 언젠가 사울의 손에 죽게 될 것입니다. 내게는 블레셋 사람들의 땅으로 반드시 피하는 것[b]보다 더 나은 일이 없습니다. 그러면 사울은 이스라엘 온 땅에서 더 이상 나를 찾는 일을 포기할 것이며[c], 나는 그의 손에서 벗어날 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “마음속으로”
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘피하여 피하겠다’라는 식의 표현으로, 반드시 피한다는 뜻을 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “사울은 더 이상 나를 찾는 일을 포기할 것입니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֶל לִבּוֹ
  english_pob_choice: in his heart
  chosen_korean: 속으로
  alternatives_korean:
  - 마음속으로
  - 자기 자신에게
  - 마음에
  lexicon: HALOT
  rationale: 히브리어 관용구는 내적 발화나 숙고를 뜻하므로, 자연스러운 현대 한국어로는 “속으로”가 간결하고 의미를 잘 살립니다.
- source_word: אֶסָּפֶה
  english_pob_choice: perish
  chosen_korean: 죽을 것입니다
  alternatives_korean:
  - 멸망할 것입니다
  - 사라질 것입니다
  - 휩쓸려 갈 것입니다
  lexicon: HALOT
  rationale: 이 동사는 소멸·멸실의 뉘앙스를 가지지만, 문맥상 사울의 손에 죽임을 당할 것을 가리키므로 한국어에서는 직접적인 “죽다”로 옮기는 것이 가장 분명합니다.
- source_word: הִמָּלֵט אִמָּלֵט
  english_pob_choice: I should surely escape
  chosen_korean: 반드시 피하는 것
  alternatives_korean:
  - 반드시 도망치는 것
  - 틀림없이 벗어나는 것
  - 꼭 탈출하는 것
  lexicon: HALOT
  rationale: 부정사 절대형+동사형의 강조를 한국어 부사 “반드시”로 살리고, 반복된 ‘escape’의 의미를 “피하다”로 자연스럽게 전달했습니다.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  english_pob_choice: in all the territory of Israel
  chosen_korean: 이스라엘의 온 경내
  alternatives_korean:
  - 이스라엘의 전 영토
  - 이스라엘의 모든 지역
  - 이스라엘의 온 땅
  lexicon: HALOT
  rationale: גְּבוּל은 단순한 국경선보다 영토적 범위를 가리킬 수 있으므로, 본문에서는 추상적인 “경내”로 넓은 영역의 뜻을 담았습니다.
- source_word: מִיָּדֽוֹ
  english_pob_choice: from his hand
  chosen_korean: 그의 손에서
  alternatives_korean:
  - 그의 손에서부터
  - 그의 권세에서
  - 그의 힘에서
  lexicon: HALOT
  rationale: ‘손’은 행위 주체이자 권세를 뜻하는 히브리어 관용구이므로, 이미지와 의미를 함께 보존했습니다.
theological_decisions:
- issue: 사울의 손에 넘어가 죽을 것이라는 자기 진술의 강도
  chosen_reading: “사울의 손에 넘어가 죽을 것입니다”로 직설적으로 옮겨, 위협의 현실성과 다윗의 절박함을 그대로 드러냈습니다.
  alternative_readings:
  - “사울에게서 멸망할 것입니다”
  - “사울의 손에 붙들려 사라질 것입니다”
  rationale: 본문은 다윗의 내적 독백으로서 사울의 추적이 실제 생명 위협임을 보여 주므로, 완곡화하지 않고 직접적인 표현을 택했습니다.
  doctrine_reference: 본문 서사 이해; 다윗-사울 갈등의 역사적 긴장
