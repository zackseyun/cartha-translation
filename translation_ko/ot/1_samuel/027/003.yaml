  to: 다윗은 가드에서 아기스와 함께 머물렀습니다[a]. 그와 그의 부하들은 각자 자기 집안 식구와 함께 있었습니다[b]. 다윗은 두 아내, 곧 이스르엘 출신 아히노암과 갈멜 출신인 나발의 아내 아비가일과 함께 있었습니다.
