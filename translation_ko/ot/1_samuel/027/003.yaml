  text: וַ/יֵּשֶׁב֩ דָּוִ֨ד עִם אָכִ֥ישׁ בְּ/גַ֛ת ה֥וּא וַ/אֲנָשָׁ֖י/ו אִ֣ישׁ וּ/בֵית֑/וֹ דָּוִד֙ וּ/שְׁתֵּ֣י נָשָׁ֔י/ו אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית וַ/אֲבִיגַ֥יִל אֵֽשֶׁת נָבָ֖ל הַֽ/כַּרְמְלִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/003.yaml
  text: So David stayed with Achish in Gath[a], he and his men, each man with his household—David with his two wives, Ahinoam the Jezreelite and Abigail[b], the wife of Nabal the Carmelite.
  footnotes:
  - marker: a
    text: Or 'lived with Achish in Gath.' The Hebrew verb can denote dwelling or remaining for a time.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'man and his household,' a distributive expression meaning each man together with those of his house.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 가드에서 아기스와 함께 머물렀습니다[a]. 그와 그의 부하들은 각자 자기 집안 식구와 함께 있었습니다[b]. 다윗은 두 아내, 곧 이스르엘 출신 아히노암과 갈멜 출신인 나발의 아내 아비가일과 함께 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘머물다’ 또는 ‘거주하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 분배적 표현으로, 문자적으로는 ‘각 사람과 그의 집안’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: stayed
  chosen_korean: 머물렀습니다
  alternatives_korean:
  - 살았습니다
  - 거주했습니다
  - 지냈습니다
  lexicon: HALOT
  rationale: 이 동사는 문맥상 가드에서 일정 기간 함께 머문다는 뜻이므로, 영구 거주보다 덜 단정적인 ‘머물렀습니다’가 POB의 stayed를 자연스럽게 반영합니다.
- source_word: הוּא וַאֲנָשָׁיו
  english_pob_choice: he and his men
  chosen_korean: 그는 자기 부하들과 함께
  alternatives_korean:
  - 그와 그의 사람들과
  - 그와 그의 군사들과
  lexicon: HALOT
  rationale: ‘אֲנָשָׁיו’는 문자적으로 ‘그의 사람들/부하들’이므로, 군사적 맥락을 살리되 과도한 해석을 피하는 ‘부하들’이 적절합니다.
- source_word: אִישׁ וּבֵיתוֹ
  english_pob_choice: each man with his household
  chosen_korean: 각 사람은 자기 집안 식구를 거느렸습니다
  alternatives_korean:
  - 각 사람은 자기 집과 함께
  - 각 사람은 자기 가족과 함께
  lexicon: HALOT
  rationale: 히브리어의 분배적 표현을 살려 ‘각 사람은’으로 풀고, בֵּיתוֹ는 건물보다 사람들로 이루어진 ‘집안 식구’로 옮기는 것이 뜻을 더 정확히 전달합니다.
- source_word: הַיִּזְרְעֵאלִית
  english_pob_choice: the Jezreelite
  chosen_korean: 이스르엘 사람
  alternatives_korean:
  - 이스르엘 여인
  - 이스르엘 출신
  lexicon: HALOT
  rationale: 여성형 지명형 형용사를 한국어의 출신 표지로 옮겨, 이름의 기능을 유지하면서도 한국어에서 어색한 성별 표지를 피했습니다.
- source_word: הַכַּרְמְלִית
  english_pob_choice: the Carmelite
  chosen_korean: 갈멜 사람
  alternatives_korean:
  - 갈멜 여인
  - 갈멜 출신
  lexicon: HALOT
  rationale: נָבָל의 아내라는 문맥에서 ‘갈멜 사람’은 지리적 출신을 간명하게 드러내며, 오해를 부르는 교단명 연상을 피합니다.
theological_decisions:
- issue: 가드에서의 ‘머묾’이 단순 방문인지 거주인지의 뉘앙스
  chosen_reading: ‘머물렀습니다’로 옮겨, 지속적 체류의 가능성을 열어 두었습니다.
  alternative_readings:
  - ‘살았습니다’로 더 강하게 거주를 표현하는 읽기
  - ‘지냈습니다’로 더 완화하는 읽기
  rationale: 히브리어 יָשַׁב은 거주와 체류를 모두 포함할 수 있어, 본문이 확정하지 않는 기간성을 과도하게 못 박지 않는 번역이 바람직합니다.
  doctrine_reference: 서사 문맥의 의미 범위 보존
- issue: ‘집안’/‘가문’ 표현의 선택
  chosen_reading: ‘집안 식구’로 옮겨, 혈연과 동거 구성원을 함께 드러냈습니다.
  alternative_readings:
  - ‘가족’
  - ‘집안’
  rationale: בֵּיתוֹ는 단순 가족보다 더 넓은 household 개념이어서, 한국어에서도 사람들의 결속을 드러내는 표현이 필요합니다.
  doctrine_reference: 본문의 사회적 단위 보존
