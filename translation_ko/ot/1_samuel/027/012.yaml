id: 1SA.27.12
reference: 1 Samuel 27:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּאֲמֵ֥ן אָכִ֖ישׁ בְּ/דָוִ֣ד לֵ/אמֹ֑ר הַבְאֵ֤שׁ הִבְאִישׁ֙ בְּ/עַמּ֣/וֹ בְ/יִשְׂרָאֵ֔ל וְ/הָ֥יָה לִ֖/י לְ/עֶ֥בֶד עוֹלָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/012.yaml
  text: And Achish trusted David[a], saying, “He has surely made himself stink among his people in Israel[b], so he will be my servant forever.”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “He has made himself utterly odious among his people in Israel.” The Hebrew literally says “made himself stink,” an idiom for becoming detestable.
    reason: lexical_alternative
  - marker: b
    text: “Servant” here may also be rendered “slave,” but the context suggests ongoing vassal-like service to Achish rather than emphasizing chattel status.
    reason: lexical_alternative
translation:
  language: ko
  text: 아기스는 다윗을 믿고 말했습니다. 「그가 분명히 자기 백성 곧 이스라엘 가운데서 스스로를 역겨운 존재로 만들었으니, 그는 영원히 내 종이 될 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “스스로를 냄새나게 만들었다”는 뜻으로, 여기서는 ‘역겨운 존재가 되다’라는 비유적 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘종’은 여기서 노예적 신분을 직접 강조하기보다, 아기스에게 평생 종속되는 정치적·봉신적 관계를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן
  english_pob_choice: trusted
  chosen_korean: 믿고
  alternatives_korean:
  - 신뢰하고
  - 믿었습니다
  lexicon: HALOT
  rationale: אמן의 히필은 사람에게 신뢰를 두는 뜻이므로, 관계적 의미를 살려 「믿고」로 옮겼습니다.
- source_word: הַבְאֵשׁ הִבְאִישׁ
  english_pob_choice: has surely made himself stink
  chosen_korean: 스스로를 역겨운 존재로 만들었으니
  alternatives_korean:
  - 스스로를 지독하게 냄새나게 만들었으니
  - 자기를 완전히 혐오스럽게 만들었으니
  lexicon: HALOT
  rationale: 히브리어의 직역 이미지는 「냄새나게 하다/악취 나다」이지만, 한국어에서는 같은 비하·혐오의 힘을 유지하면서도 자연스럽게 읽히는 표현으로 풀었습니다.
- source_word: בְּעַמּוֹ בְיִשְׂרָאֵל
  english_pob_choice: among his people in Israel
  chosen_korean: 자기 백성 곧 이스라엘 가운데서
  alternatives_korean:
  - 자기 ժողովրդի 이스라엘 가운데서
  - 이스라엘 백성 가운데서
  lexicon: HALOT
  rationale: 중첩된 전치사구는 소속 집단과 그 범위를 함께 보여 주므로, 「자기 백성」과 「이스라엘 가운데서」를 병렬로 살려 문맥을 분명히 했습니다.
- source_word: לְעֶבֶד עוֹלָם
  english_pob_choice: my servant forever
  chosen_korean: 내 종이 될 것입니다
  alternatives_korean:
  - 내 종이 영원히 될 것입니다
  - 내 종으로 영원히 남을 것입니다
  lexicon: HALOT
  rationale: עֶבֶד은 기본적으로 「종」으로 두되, 이 문맥에서는 아기스의 지배 아래 평생 속하는 종속 관계를 자연스럽게 드러내는 데 중점을 두었습니다.
theological_decisions:
- issue: 아기스의 발화 안에서 직설적 비하 은유를 유지할지 여부
  chosen_reading: 은유를 완화하지 않고 「스스로를 역겨운 존재로 만들었으니」로 유지했습니다.
  alternative_readings:
  - 「매우 혐오스러운 사람이 되었으니」
  - 「자기 백성에게서 버림받았으니」
  rationale: 본문의 평가를 도덕적 평판의 결과로만 순화하면 히브리어의 거친 이미지가 사라지므로, 본문의 강한 혐오 표현을 보존했습니다.
  doctrine_reference: 성경 본문 충실성 및 은유 보존
