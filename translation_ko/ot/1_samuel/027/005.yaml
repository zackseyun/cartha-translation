source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אָכִ֗ישׁ אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ יִתְּנוּ לִ֣/י מָק֗וֹם בְּ/אַחַ֛ת עָרֵ֥י הַ/שָּׂדֶ֖ה וְ/אֵ֣שְׁבָה שָּׁ֑ם וְ/לָ֨/מָּה יֵשֵׁ֧ב עַבְדְּ/ךָ֛ בְּ/עִ֥יר הַ/מַּמְלָכָ֖ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/005.yaml
  text: Then David said to Achish[a], “If I have now found favor in your eyes, let them give me a place in one of the towns in the countryside, so that I may live there[c][b]. For why should your servant live with you in the royal city?”
  footnotes:
  - marker: a
    text: Hebrew literally, “in one of the cities of the field,” meaning a town in the countryside as opposed to the royal city.
    reason: lexical_alternative
  - marker: b
    text: Or “and I will dwell there.”
    reason: lexical_alternative
  - marker: c
    text: Hebrew literally, “the city of the kingdom.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗이 아기스에게 말했습니다. 「만일 제가 이제 당신의 눈에 은혜를 입었다면, 사람들로 하여금 저에게 시골의 한 성읍들 가운데 한 곳을 주게 하십시오. 제가 거기에 살겠습니다. 어찌하여 당신의 종이 왕의 도성에서 당신과 함께 살겠습니까?」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘들판의 도시들 가운데 하나’이며, 왕의 도성과 대비되는 시골 마을을 뜻합니다.
    reason: source_note
  - marker: b
    text: 또는 “내가 거기에 살겠습니다.”
    reason: lexical_alternative
  - marker: c
    text: 히브리어로는 문자적으로 ‘왕국의 도시’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  english_pob_choice: I have now found favor in your eyes
  chosen_korean: 제가 이제 당신의 눈에 은혜를 입었다면
  alternatives_korean:
  - 제가 이제 당신의 눈에 호의를 얻었다면
  - 제가 이제 당신의 눈에 은총을 얻었다면
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역적으로 살리되, 한국어에서는 ‘은혜를 입다’가 공손한 호의 요청을 자연스럽게 드러내며 ‘눈에’의 이미지를 보존합니다.
- source_word: יִתְּנוּ לִי מָקוֹם
  english_pob_choice: let them give me a place
  chosen_korean: 사람들로 하여금 저에게 … 한 곳을 주게 하십시오
  alternatives_korean:
  - 저에게 한 곳을 주게 하십시오
  - 한 곳을 저에게 주십시오
  lexicon: HALOT
  rationale: 삼인칭 복수의 요청형을 한국어에서 모호하게 압축하기보다, 아기스의 권한 아래 있는 사람들을 가리키는 요청으로 풀어 자연스럽고 원문에 충실하게 옮겼습니다.
- source_word: בְּאַחַת עָרֵי הַשָּׂדֶה
  english_pob_choice: in one of the country towns
  chosen_korean: 시골의 한 성읍들 가운데 한 곳
  alternatives_korean:
  - 시골의 성읍들 가운데 한 곳
  - 전원 지역의 한 성읍
  lexicon: HALOT
  rationale: 직역하면 ‘들판/시골의 성읍들 가운데 하나’이므로, 왕의 도성과 대비되는 지방 거주지를 드러내도록 ‘시골의 한 성읍들 가운데 한 곳’으로 옮겼습니다.
- source_word: בְּעִיר הַמַּמְלָכָה
  english_pob_choice: in the royal city
  chosen_korean: 왕의 도성
  alternatives_korean:
  - 왕실 도성
  - 왕도
  lexicon: HALOT
  rationale: 문맥상 ‘나라의 도시’가 아니라 왕권의 중심 도시라는 대비가 핵심이어서, 현대 한국어에서 자연스러운 ‘왕의 도성’으로 옮겼습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 시종
  lexicon: HALOT
  rationale: 여기서는 궁정 예절의 자기 낮춤 표현이지만, 원문의 עבד를 무난히 완화하지 않고 ‘종’으로 옮겨 신분적 낮아짐을 유지했습니다.
theological_decisions:
- issue: 다윗의 자기 호칭 עַבְדְּךָ의 사회적 함의
  chosen_reading: ‘당신의 종’으로 번역해, 예절적 겸손과 주종 관계의 낮춤을 함께 드러냈습니다.
  alternative_readings:
  - ‘당신의 종’ 대신 ‘당신의 신하’
  - ‘당신의 노예’로 더 강하게 표시
  rationale: 이 장면은 단순한 예의 표현을 넘어서 아기스 앞에서의 낮은 지위를 전제하므로, 지나치게 관료적으로 중화하지 않고 원문이 가진 위계감을 보존하는 것이 적절합니다.
  doctrine_reference: 사회적 위계와 본문 문맥의 화용론
