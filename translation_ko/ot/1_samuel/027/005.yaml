    rationale: 원문의 3인칭 복수는 부정적 요청이므로 ‘사람들’을 명시할 필요가 없으며, 오히려 불필요하게 행위자를 특정합니다. 또한 וְאֵשְׁבָה는 여기서 단순 미래 진술보다 거주 허가를 구하는 의향·목적을 나타냅니다.
