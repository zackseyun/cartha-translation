base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/006.yaml
  text: So Achish gave him Ziklag that day[b][a]. Therefore Ziklag has belonged to the kings of Judah to this day.
  footnotes:
  - marker: a
    text: Or 'on that day.'
    reason: lexical_alternative
  - marker: b
    text: Or 'has been for the kings of Judah'; the Hebrew expression indicates that Ziklag remained under Judean royal possession up to the narrator's present.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 아기스가 그에게 시글락을 주었습니다[a]. 그러므로 시글락은 오늘까지 유다의 왕들에게 속해 있었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그날에’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘유다의 왕들을 위한 것이었습니다’; 히브리어 표현은 시글락이 서술자의 현재까지 유다 왕실의 소유로 남아 있었음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֶּן
  english_pob_choice: gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 주었다
  - 할당했습니다
  - 하사했습니다
  lexicon: HALOT
  rationale: נתן의 기본 서술적 의미를 가장 자연스럽게 살려, 과도한 격식이나 행정적 뉘앙스 없이 ‘주었습니다’로 옮겼습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그날에 그때
  lexicon: HALOT
  rationale: 히브리어 관용적 시간표현을 현대 한국어의 자연스러운 부사구로 옮겼습니다.
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 따라서
  lexicon: HALOT
  rationale: 앞 절의 행위와 뒤의 역사적 귀결 사이의 인과를 분명히 드러내는 연결어로 ‘그러므로’가 가장 적절합니다.
- source_word: הָיְתָה... לְמַלְכֵי יְהוּדָה
  english_pob_choice: has belonged to the kings of Judah
  chosen_korean: 유다의 왕들에게 속해 있었습니다
  alternatives_korean:
  - 유다의 왕들에게 속해 있었습니다
  - 유다의 왕들을 위한 것이었습니다
  - 유다의 왕들의 것이었습니다
  lexicon: HALOT
  rationale: 동사 היה와 לְ 구문은 단순 존재보다 지속된 소속/귀속 상태를 나타내므로, 현재 완료의 역사적 지속을 담는 ‘속해 있었습니다’로 옮겼습니다.
- source_word: צִקְלָג
  english_pob_choice: Ziklag
  chosen_korean: 시글락
  alternatives_korean:
  - 지글락
  - 시글라그
  lexicon: 현대 외래어 표기 관행
  rationale: 지명은 한국어 성경 관행에 맞게 음역하되, 통용되는 표기를 우선했습니다.
theological_decisions:
- issue: ‘오늘까지’가 지닌 서술자의 회고적 시점
  chosen_reading: 본문의 회고적 관찰을 그대로 살려, 별도의 저작/편집 설명을 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - ‘이때까지’로 완화하여 현재성을 약하게 표현함
  - 주석성 설명을 본문 안에 삽입함
  rationale: 히브리어 עַד הַיּוֹם הַזֶּה는 서술자의 현재까지 지속된 사실을 표시하므로, 본문의 역사적 메모를 보존하는 것이 가장 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
