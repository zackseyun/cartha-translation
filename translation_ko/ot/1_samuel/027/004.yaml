source:
  edition: WLC
  text: וַ/יֻּגַּ֣ד לְ/שָׁא֔וּל כִּֽי בָרַ֥ח דָּוִ֖ד גַּ֑ת וְ/לֹֽא יוסף ע֖וֹד לְ/בַקְשֽׁ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/004.yaml
  text: When it was reported to Saul that David had fled to Gath[b][a], he no longer continued to seek him.
  footnotes:
  - marker: a
    text: Or 'he was told that David had fled to Gath.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''he did not continue any longer to seek him.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 사울에게 다윗이 가드로 도망갔다는 보고가 들어오자, 그는 더 이상 그를 찾지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사울에게 다윗이 가드로 도망갔다는 말을 들려주었다.’
    reason: lexical_alternative
  - marker: b
    text: '히브리어 관용구: ‘그가 더 이상 그를 찾으려 하지 않았다.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לְשָׁאוּל
  english_pob_choice: it was reported to Saul
  chosen_korean: 사울에게 … 보고가 들어오자
  alternatives_korean:
  - 사울에게 전해지자
  - 사울에게 알려지자
  lexicon: HALOT
  rationale: 주체를 드러내지 않는 수동적 보고 구조를 한국어로 자연스럽게 살리기 위해 ‘보고가 들어오자’로 옮겼습니다.
- source_word: בָרַח דָּוִד גַּת
  english_pob_choice: David had fled to Gath
  chosen_korean: 다윗이 가드로 도망갔다는
  alternatives_korean:
  - 다윗이 가드로 피했다는
  - 다윗이 가드로 도주했다는
  lexicon: HALOT
  rationale: בָרַח의 핵심은 ‘도망가다/피하다’이며, 목적지 가드는 한국어에서 전치사 ‘로’를 보태어 목적지를 분명히 했습니다.
- source_word: וְלֹא יֹסֶף עוֹד לְבַקְשׁוֹ
  english_pob_choice: he no longer continued to seek him
  chosen_korean: 더 이상 그를 찾지 않았습니다
  alternatives_korean:
  - 더 이상 그를 계속 찾아다니지 않았습니다
  - 그를 더는 찾으려 하지 않았습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘요세프 … עוד’는 단순 중단보다 ‘계속해서 더 이상’의 뉘앙스를 띠므로, ‘더 이상’으로 중단을 보되 문맥상 자연스러운 한국어로 정리했습니다.
theological_decisions:
- issue: 유다 왕권 경쟁 서사에서 다윗과 사울의 관계를 어떻게 중립적으로 제시할 것인가
  chosen_reading: 본절은 사울의 추적이 일시적으로 멈춘 사실만 진술하고, 다윗의 도피를 통해 갈등의 긴장을 간접적으로 드러내도록 유지했습니다.
  alternative_readings:
  - 사울이 다윗 추격을 포기했다는 해석
  - 사울이 더는 다윗을 해치려 하지 않았다는 해석
  rationale: 원문은 추적의 중단을 말할 뿐 동기의 변화까지 명시하지 않으므로, 서술 범위를 넘는 해석을 덧붙이지 않았습니다.
  doctrine_reference: 본문 서술의 범위 준수
