source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִסְפַּ֣ר הַ/יָּמִ֔ים אֲשֶׁר יָשַׁ֥ב דָּוִ֖ד בִּ/שְׂדֵ֣ה פְלִשְׁתִּ֑ים יָמִ֖ים וְ/אַרְבָּעָ֥ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/007.yaml
  text: The number of days that David lived in the territory of the Philistines was a year and four months[a].
  footnotes:
  - marker: a
    text: Hebrew literally, 'days and four months'; here 'days' is an idiomatic way of expressing 'a year' in a duration formula.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 블레셋 사람들의 땅에 머문 날수는 일 년 사 개월이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘날들과 사 개월’이지만, 여기서 ‘날들’은 기간 공식에서 ‘일 년’을 뜻하는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר הַיָּמִים
  english_pob_choice: The number of days
  chosen_korean: 날수는
  alternatives_korean:
  - 그 날들의 수는
  - 머문 기간은
  lexicon: HALOT
  rationale: 히브리어의 ‘날들의 수’라는 형식을 한국어에서는 자연스럽게 ‘날수’로 옮기되, 계산된 기간임을 드러냈습니다.
- source_word: אֲשֶׁר יָשַׁב
  english_pob_choice: that David lived
  chosen_korean: 머문
  alternatives_korean:
  - 살던
  - 거주한
  - 살아 있던
  lexicon: HALOT
  rationale: יָשַׁב은 여기서 단순 거주를 뜻하므로, 장기간 체류의 의미를 살려 ‘머문’으로 옮겼습니다.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  english_pob_choice: in the territory of the Philistines
  chosen_korean: 블레셋 사람들의 땅에
  alternatives_korean:
  - 블레셋의 영토에
  - 블레셋 지역에
  - 블레셋 사람들의 들판에
  lexicon: HALOT
  rationale: שָׂדֶה를 문자적으로 ‘들’로 옮기면 오해가 생기므로, POB의 ‘territory’에 해당하는 지리적 의미를 살려 ‘땅’으로 번역했습니다.
- source_word: יָמִים וְאַרְבָּעָה חֳדָשִׁים
  english_pob_choice: a year and four months
  chosen_korean: 일 년 사 개월
  alternatives_korean:
  - 날과 사 개월
  - 열두 달과 사 개월
  lexicon: HALOT
  rationale: 히브리어 관용구에서 ‘날들’이 ‘일 년’을 뜻하는 기간 공식이므로, 본문의 의미를 분명히 하여 ‘일 년 사 개월’로 옮겼습니다.
