  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד לַ/אֲחִימֶ֣לֶךְ הַ/כֹּהֵ֗ן הַ/מֶּלֶךְ֮ צִוַּ֣/נִי דָבָר֒ וַ/יֹּ֣אמֶר אֵלַ֗/י אִ֣ישׁ אַל יֵ֧דַע מְא֛וּמָה אֶת הַ/דָּבָ֛ר אֲשֶׁר אָנֹכִ֥י שֹׁלֵֽחֲ/ךָ֖ וַ/אֲשֶׁ֣ר צִוִּיתִ֑/ךָ וְ/אֶת הַ/נְּעָרִ֣ים יוֹדַ֔עְתִּי אֶל מְק֥וֹם פְּלֹנִ֖י אַלְמוֹנִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/003.yaml
  text: David said to Ahimelech the priest[a], “The king has charged me with a matter and said to me[b], ‘Let no man know anything about the matter for which I am sending you and with which I have charged you.’ And I have directed the young men to a certain place.”
  footnotes:
  - marker: a
    text: Hebrew literally, “to such-and-such a place,” an idiom for an unspecified or undisclosed location.
    reason: lexical_alternative
  - marker: b
    text: Or “Let no one know anything.” The Hebrew reads literally “Let no man know anything.”
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 제사장 아히멜렉에게 말했습니다. “왕이 저에게 한 일을 맡기시며 말씀하셨습니다. ‘사람이 내가 너를 보내며 네게 맡긴 이 일에 대하여 아무것도 알지 못하게 하라.’ 그래서 나는 젊은이들에게도 어느 한 곳으로 가라고 지시해 두었습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, ‘어느 한 곳’, 곧 특정되지 않거나 밝히지 않은 장소라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “사람이 아무것도 알지 못하게 하라”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבָר / הַדָּבָר
  english_pob_choice: a matter / the matter
  chosen_korean: 일 / 이 일
  alternatives_korean:
  - 일거리
  - 사안
  - 문제
  lexicon: HALOT
  rationale: דבר는 여기서 왕이 다윗에게 맡긴 임무·사안을 가리키므로, 한국어에서는 과도하게 추상적이지 않은 ‘일’이 가장 자연스럽고, 반복되는 지시 대상은 ‘이 일’로 살렸습니다.
- source_word: צִוַּנִי / צִוִּיתִךָ
  english_pob_choice: has charged me / with which I have charged you
  chosen_korean: 맡기시며 / 맡긴
  alternatives_korean:
  - 명령하시며 / 명령한
  - 분부하시며 / 분부한
  lexicon: HALOT
  rationale: צוה의 ‘명령하다, 맡기다’의 힘을 살리되, 왕실의 공식적 지시라는 뉘앙스를 한국어에서 자연스럽게 드러내기 위해 ‘맡기다’를 사용했습니다.
- source_word: אִישׁ אַל יֵדַע מְאוּמָה
  english_pob_choice: Let no man know anything
  chosen_korean: 사람이 … 아무것도 알지 못하게 하라
  alternatives_korean:
  - 아무도 … 알지 못하게 하라
  - 남자가 … 아무것도 알지 못하게 하라
  lexicon: HALOT
  rationale: 히브리어의 문자적 ‘사람/남자’(אִישׁ)를 살리면서도 현대 한국어의 직접 화법에서는 성별을 굳이 드러내지 않는 ‘사람이’가 더 자연스럽고, ‘아무것도’로 מְאוּמָה의 전면 부정을 반영했습니다.
- source_word: וְאֶת הַנְּעָרִים
  english_pob_choice: And I have directed the young men
  chosen_korean: 젊은이들에게도
  alternatives_korean:
  - 청년들에게도
  - 수종들에게도
  - 부하들에게도
  lexicon: HALOT
  rationale: נְעָרִים는 여기서 동행한 젊은 남자들을 가리키므로, 사회적 지위로 좁히기보다 연령·상태를 드러내는 ‘젊은이들’이 가장 무난합니다.
- source_word: מְקוֹם פְּלֹנִי אַלְמוֹנִי
  english_pob_choice: to a certain place
  chosen_korean: 어느 한 곳
  alternatives_korean:
  - 어느 곳
  - 이름 없는 곳
  - 지정되지 않은 곳
  lexicon: HALOT
  rationale: 관용구의 의미는 ‘특정하지 않은 장소’이므로, 본문에서는 한국어로 자연스러운 ‘어느 한 곳’을 택하고, 그 불특정성을 유지했습니다.
theological_decisions:
- issue: 왕의 명령과 다윗의 진술이 실제로는 기만에 가까운 구조를 이룹니다.
  chosen_reading: 본문의 서술적 사실성을 유지하며, 도덕적 평가를 본문 안에 덧붙이지 않았습니다.
  alternative_readings:
  - 의역하여 ‘거짓말을 했다’고 드러내기
  - 완곡하게 ‘사정을 둘러댔다’고 표현하기
  rationale: 히브리어 본문은 다윗의 발화 내용을 그대로 제시할 뿐이며, 번역이 서술의 긴장을 미리 해소하면 원문의 독자가 판단하도록 남겨 둔 여지를 지우게 됩니다.
  doctrine_reference: 서술 본문 해석 원칙
- issue: 직접화법의 종결을 현대 합쇼체로 유지합니다.
  chosen_reading: 내러티브는 -습니다체, 인용문은 원문의 직접화법을 따라 자연스러운 평서문으로 옮겼습니다.
  alternative_readings:
  - 인용문도 모두 -습니다체로 통일하기
  - 더 고어적인 성경체로 옮기기
  rationale: 원문의 대화체 긴장과 장면성을 살리되, 전체 문체는 현대 표준어 합쇼체로 유지하는 것이 본 프로젝트의 목표에 부합합니다.
  doctrine_reference: 번역 문체 원칙
