lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어나
  alternatives_korean:
  - 기어나
  - 나서
  lexicon: HALOT
  rationale: 히브리어 קום의 서사적 연속성을 살리면서 한국어에서는 자연스러운 동작 표현인 ‘일어나’가 가장 직접적입니다.
- source_word: וַיִּבְרַח
  english_pob_choice: fled
  chosen_korean: 도망하여
  alternatives_korean:
  - 달아나
  - 피하여
  lexicon: HALOT
  rationale: ברח는 단순 이동보다 급박한 도피를 뜻하므로, 서술적 문체에서 ‘도망하여’가 의미를 분명하게 드러냅니다.
- source_word: מִפְּנֵי שָׁאוּל
  english_pob_choice: from Saul
  chosen_korean: 사울 앞에서
  alternatives_korean:
  - 사울로부터
  - 사울을 피해
  lexicon: HALOT
  rationale: 직역하면 ‘사울의 얼굴/앞에서’이므로, 문맥상 ‘사울 앞에서’가 원문의 공간적·관계적 긴장을 살리면서도 한국어로 무리 없이 읽힙니다.
- source_word: מֶלֶךְ גַּת
  english_pob_choice: king of Gath
  chosen_korean: 가드 왕 아기스
  alternatives_korean:
  - 가드의 왕 아기스
  - 가드 왕
  lexicon: HALOT
  rationale: 히브리어는 아기스의 왕직을 부가 설명하므로, 한국어에서는 인명 뒤에 관직을 붙여 ‘가드 왕 아기스’로 옮기면 자연스럽고 정보도 보존됩니다.
