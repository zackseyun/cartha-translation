source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ עַבְדֵ֤י אָכִישׁ֙ אֵלָ֔י/ו הֲ/לוֹא זֶ֥ה דָוִ֖ד מֶ֣לֶךְ הָ/אָ֑רֶץ הֲ/ל֣וֹא לָ/זֶ֗ה יַעֲנ֤וּ בַ/מְּחֹלוֹת֙ לֵ/אמֹ֔ר הִכָּ֤ה שָׁאוּל֙ ב/אלפ/ו וְ/דָוִ֖ד ב/רבבת/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/012.yaml
  text: And the servants of Achish said to him[a], “Is this not David, the king of the land? Is this not the one of whom they sang in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
  footnotes:
  - marker: a
    text: Or “they answered one another in the dances,” that is, they sang responsively during the dancing.
    reason: lexical_alternative
  - marker: b
    text: “Ten thousands” may also be rendered “myriads” or “tens of thousands.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아기스의 종들이 그에게 말했습니다[a]. “이 사람이 다윗, 곧 그 땅의 왕이 아니오? 춤추며 노래한 이가 바로 이 사람이 아니오? ‘사울은 그의 수천을 치고, 다윗은 그의 수만을 쳤다’라고 말한 이가?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들이 춤에서 서로 화답하였다”로도 옮길 수 있습니다. 즉, 그들은 춤추는 동안 응답식으로 노래했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 신하들
  - 종자들
  lexicon: HALOT
  rationale: 아기스의 궁정/가신을 가리키는 व्यापक한 표현이므로, 직역적이면서도 지위가 드러나는 ‘종들’이 가장 무난합니다.
- source_word: הֲלוֹא
  english_pob_choice: Is this not
  chosen_korean: … 아니오?
  alternatives_korean:
  - … 아닙니까?
  - 정말 … 아닙니까?
  lexicon: HALOT
  rationale: 수사 의문문으로서 상대의 동의를 기대하는 뉘앙스를 살리기 위해 한국어도 의문형으로 유지했습니다.
- source_word: לָזֶה / יַעֲנוּ
  english_pob_choice: the one of whom they sang
  chosen_korean: 춤추며 노래한 이
  alternatives_korean:
  - 그들이 춤에서 화답한 이
  - 그들이 노래한 그 사람
  lexicon: HALOT
  rationale: בַּמְּחֹלוֹת와 ענה의 결합은 춤과 함께 이루어진 응답식 노래를 가리킬 수 있으므로, ‘춤추며 노래한’으로 핵심 장면을 압축해 살렸습니다.
- source_word: הִכָּה ... בְּאַלְפָּיו / בְּרִבְבֹתָיו
  english_pob_choice: has struck down his thousands ... his ten thousands
  chosen_korean: 그의 수천을 치고 ... 그의 수만을 쳤다
  alternatives_korean:
  - 그의 천 명들을 ... 그의 만 명들을
  - 그의 수천 명 ... 그의 수만 명
  lexicon: HALOT
  rationale: 히브리어의 수량 병행을 살리되, ‘치다’로 전쟁적 승리와 살상 의미를 함께 드러냈습니다. ‘수천/수만’은 ‘thousands/ten thousands’에 대응하는 자연스러운 한국어입니다.
theological_decisions:
- issue: 다윗을 ‘그 땅의 왕’으로 부르는 표현의 긴장 보존
  chosen_reading: 번역문은 서술을 그대로 두고, 아기스의 종들이 다윗을 실제 왕으로 보든 과장해서 말하든 판단하지 않습니다.
  alternative_readings:
  - ‘그 나라의 왕’으로 해석해 명시적으로 왕호를 부여함
  - ‘당대의 영웅’ 정도로 완화함
  rationale: 히브리어는 화자들의 발화를 그대로 전할 뿐 그 정치적 의미를 해설하지 않으므로, 번역도 그 긴장을 해소하지 않고 유지합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
