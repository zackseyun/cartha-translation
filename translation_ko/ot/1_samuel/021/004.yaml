  text: Now then[a], what do you have on hand? Give me five loaves of bread[c][b], or whatever is available.
  footnotes:
  - marker: a
    text: Literally, 'what is under your hand,' a Hebrew idiom for what is immediately available or in one's possession.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'give into my hand,' meaning 'give me.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'or whatever can be found.'
    reason: alternative_reading
translation:
  language: ko
  text: 이제 손에 있는 것이 무엇입니까?[a] 빵 다섯 개를 제게 주십시오[b]. 아니면 있는 것은 무엇이든지 주십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘당신의 손 아래에 무엇이 있습니까?’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘내 손에 주십시오’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘찾을 수 있는 것은 무엇이든지’입니다.
    reason: alternative_reading
