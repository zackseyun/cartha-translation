id: 1SA.21.4
reference: 1 Samuel 21:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה מַה יֵּ֧שׁ תַּֽחַת יָדְ/ךָ֛ חֲמִשָּׁה לֶ֖חֶם תְּנָ֣/ה בְ/יָדִ֑/י א֖וֹ הַ/נִּמְצָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/004.yaml
  text: Now then[a], what do you have on hand? Give me five loaves of bread[c][b], or whatever is available.
  footnotes:
  - marker: a
    text: Literally, 'what is under your hand,' a Hebrew idiom for what is immediately available or in one's possession.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'give into my hand,' meaning 'give me.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'or whatever can be found.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러니 지금, 당신에게 있는 것이 무엇입니까? 빵 다섯 개를 내게 주십시오[a][b], 아니면 무엇이든 있는 것을 주십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘당신 손 아래에 무엇이 있습니까?’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘내 손에(로) 주십시오’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘찾을 수 있는 것이라면 무엇이든지’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now then
  chosen_korean: 그러니 지금
  alternatives_korean:
  - 이제
  - 자, 지금
  lexicon: HALOT
  rationale: 즉시 이어지는 요청의 전환을 살리기 위해 단순 시간 부사보다 대화 전환의 힘이 있는 표현으로 옮겼습니다.
- source_word: מַה יֵּשׁ תַּחַת יָדְךָ
  english_pob_choice: what do you have on hand
  chosen_korean: 당신에게 있는 것이 무엇입니까
  alternatives_korean:
  - 손에 있는 것이 무엇입니까
  - 지금 가지고 있는 것이 무엇입니까
  lexicon: HALOT
  rationale: ‘손 아래/손에 있다’는 히브리 관용을 한국어에서 자연스럽게 풀어, 즉시 처분할 수 있는 소유·가용성을 드러냈습니다.
- source_word: חֲמִשָּׁה לֶחֶם
  english_pob_choice: five loaves of bread
  chosen_korean: 빵 다섯 개
  alternatives_korean:
  - 떡 다섯 개
  - 빵 다섯 덩이
  lexicon: HALOT
  rationale: 히브리어의 집합적 ‘bread’를 수량이 있는 음식으로 자연스럽게 옮기되, 현대 한국어 독자가 바로 이해할 수 있게 했습니다.
- source_word: תְּנָה בְיָדִי
  english_pob_choice: Give me
  chosen_korean: 내게 주십시오
  alternatives_korean:
  - 제게 주십시오
  - 내 손에 주십시오
  lexicon: HALOT
  rationale: 직역의 ‘내 손에’보다 한국어로는 수여의 의미를 직접 드러내는 말이 더 자연스러워, 다만 강한 요청의 어조는 유지했습니다.
- source_word: הַנִּמְצָא
  english_pob_choice: whatever is available
  chosen_korean: 무엇이든 있는 것을
  alternatives_korean:
  - 무엇이든 찾을 수 있는 것을
  - 무엇이든 구할 수 있는 것을
  lexicon: HALOT
  rationale: ‘מצא’의 수동적 의미를 살려, ‘찾을 수 있는’보다 현재 실제로 존재하는 가용 물품이라는 뜻을 간결하게 반영했습니다.
