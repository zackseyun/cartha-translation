base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/006.yaml
  text: David answered the priest and said to him[a], “Indeed, women have been kept from us as before, when I went out, and the young men’s vessels are holy, though it is an ordinary journey[d][c][b]. How much more today will it be made holy in the vessel.”
  footnotes:
  - marker: a
    text: Or “a woman has been withheld from us,” or “we have kept ourselves from women.” The Hebrew expression refers to sexual abstinence in preparation for handling holy things.
    reason: lexical_alternative
  - marker: b
    text: Literally “as yesterday, three days ago,” a Hebrew idiom referring to prior days; some take it more specifically as “for about three days.”
    reason: lexical_alternative
  - marker: c
    text: “Vessels” may refer to the young men’s equipment; some understand it euphemistically of their bodies/persons.
    reason: lexical_alternative
  - marker: d
    text: The Hebrew of the last clause is difficult. It may also be understood, “although the journey is ordinary, today it will be holy in respect to the vessel/gear,” or similarly.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗이 제사장에게 대답하며 그에게 말했습니다. 「정녕 여자들은 우리가 나간 때부터, 곧 어제와 그저께와 같이 우리에게서 멀리 있었습니다. 젊은이들의 그릇은 거룩합니다. 비록 그것이 보통의 길이라 해도 그렇습니다. 하물며 오늘은 그 그릇으로 말미암아 거룩하게 되지 않겠습니까?」[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 여성과의 성적 절제를 가리킬 수 있습니다.
    reason: source_note
  - marker: b
    text: 직역하면 “어제와 그저께”; 히브리어 관용구로 지난 며칠을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그릇’은 젊은이들의 장비를 가리킬 수 있고, 일부는 몸/사람을 완곡하게 가리키는 말로 이해합니다.
    reason: lexical_alternative
  - marker: d
    text: 마지막 절은 난해하여 “비록 여정은 보통이지만” 또는 비슷하게도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה עֲצֻרָה לָנוּ
  english_pob_choice: women have been kept from us
  chosen_korean: 여자들은 우리가 나간 때부터…우리에게서 멀리 있었습니다
  alternatives_korean:
  - 여자 한 사람이 우리에게서 금지되었습니다
  - 우리는 여자들과의 관계를 끊었습니다
  lexicon: HALOT
  rationale: 문맥상 성적 절제를 뜻하므로 단순 금지보다 ‘멀리 있었습니다’로 관계적·상태적 제약을 살렸습니다. 복수형을 유지해 집단적 맥락도 반영했습니다.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  english_pob_choice: as before
  chosen_korean: 어제와 그저께와 같이
  alternatives_korean:
  - 대체로 예전처럼
  - 이전부터
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 풀어, 지난 며칠간의 지속된 상태라는 시간을 더 분명히 드러냈습니다.
- source_word: כְלֵי הַנְּעָרִים
  english_pob_choice: the young men’s vessels
  chosen_korean: 젊은이들의 그릇
  alternatives_korean:
  - 젊은이들의 기구
  - 젊은이들의 몸
  lexicon: HALOT
  rationale: ‘그릇’이 가장 직접적으로 어휘를 보존하며, 이 난해한 표현의 다의성을 너무 빨리 결정하지 않도록 했습니다.
- source_word: וְהוּא דֶּרֶךְ חֹל
  english_pob_choice: though it is an ordinary journey
  chosen_korean: 비록 그것이 보통의 길이라 해도
  alternatives_korean:
  - 비록 그것이 속된 길이라 해도
  - 그것은 평범한 여정이지만
  lexicon: HALOT
  rationale: חֹל의 대비 의미를 ‘거룩’과의 대조 속에서 ‘보통의’로 옮겼고, דֶּרֶךְ는 문맥상 ‘길/여정’으로 자연스럽게 처리했습니다.
- source_word: הַיּוֹם יִקְדַּשׁ
  english_pob_choice: today will it be made holy
  chosen_korean: 오늘은 거룩하게 되지 않겠습니까?
  alternatives_korean:
  - 오늘은 거룩할 것입니다
  - 오늘은 거룩하게 될 것입니다
  lexicon: HALOT
  rationale: 동사의 결과 상태를 한국어의 수동·추정 표현으로 살리면서, ‘거룩하게 됨’이라는 어휘적 긴장을 유지했습니다.
theological_decisions:
- issue: 거룩/보통의 대비와 성적 절제의 기능
  chosen_reading: 문맥을 도덕적 정결이 아니라 거룩한 떡을 받기 위한 의례적 준비로 번역했습니다.
  alternative_readings:
  - 일반적 도덕 순결로 이해
  - 단순한 위생적 준비로 이해
  rationale: 본문은 거룩한 것과 보통의 것을 대비하며, 제의적 자격 여부를 다룹니다. 따라서 후대적 도덕화보다 성결-속됨의 구도를 보존하는 것이 source-direct합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
