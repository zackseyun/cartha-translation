  yaml_path: translation/ot/1_samuel/021/015.yaml
  text: And Achish said to his servants[a], “Look, you see a man acting like a madman. Why do you bring him to me?”
  footnotes:
  - marker: a
    text: Or, “a man who is insane” / “a madman.” The Hebrew participle can describe either actual madness or behavior presented as madness.
    reason: lexical_alternative
translation:
  language: ko
  text: 아기스가 자기 종들에게 말했습니다. “보십시오, 미친 사람처럼 행동하는 사람[a]이 보입니다. 어찌하여 그를 내게 데려왔습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사는 실제 광기뿐 아니라 광기처럼 보이는 행동도 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - …라고 말했습니다
  lexicon: WLC
  rationale: 서사 진행을 자연스럽게 옮기되, 히브리어 연속 서술의 단순한 말하기를 합쇼체로 간결하게 표현했습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 자기 종들에게
  alternatives_korean:
  - 자기 시종들에게
  - 자기 하인들에게
  lexicon: HALOT
  rationale: 왕실 문맥의 עבדים을 직역에 가깝게 ‘종들’로 옮기되, 한국어에서 자연스럽도록 소유를 분명히 했습니다.
- source_word: מִשְׁתַּגֵּעַ
  english_pob_choice: acting like a madman
  chosen_korean: 미친 사람 같은
  alternatives_korean:
  - 미친 듯한
  - 정신이 나간 듯한
  - 미친 사람처럼 행동하는
  lexicon: HALOT
  rationale: 히트파엘 분사는 실제 광기보다 ‘광기처럼 보이는 행동’까지 포함할 수 있으므로, POB의 해석을 따라 행동 인상을 살렸습니다.
- source_word: תָּבִיאוּ אֹתוֹ אֵלַי
  english_pob_choice: Why do you bring him to me?
  chosen_korean: 어찌하여 그를 내게 데려왔습니까?
  alternatives_korean:
  - 왜 그를 내게 데려오셨습니까?
  - 왜 그를 내게 데려오십니까?
  lexicon: HALOT
  rationale: 복수형 동사의 현재적 질문을 한국어의 현재/과거 경계가 흐린 의문으로 옮기되, 상대를 향한 직접 질책의 뉘앙스를 유지했습니다.
