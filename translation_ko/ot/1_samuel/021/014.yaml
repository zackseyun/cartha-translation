source:
  edition: WLC
  text: וַ/יְשַׁנּ֤/וֹ אֶת טַעְמ/וֹ֙ בְּ/עֵ֣ינֵי/הֶ֔ם וַ/יִּתְהֹלֵ֖ל בְּ/יָדָ֑/ם ו/יתו עַל דַּלְת֣וֹת הַ/שַּׁ֔עַר וַ/יּ֥וֹרֶד רִיר֖/וֹ אֶל זְקָנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/014.yaml
  text: So he changed his behavior before their eyes and acted like a madman in their hands[b][a]; he made marks on the doors of the gate and let his saliva run down onto his beard.
  footnotes:
  - marker: a
    text: Or 'feigned madness' for 'acted like a madman'; the Hebrew verb describes behaving in a crazed way, and the wider context indicates this was deliberate.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'made marks' is difficult and may also be understood as 'scratched' or 'scribbled' on the gate doors.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 그들의 눈앞에서 자기 태도를 바꾸고, 그들의 수중에서 미친 사람처럼 행동했습니다.[a] 그는 성문 문짝들에 표시를 하고,[b] 자기 침이 수염으로 흘러내리게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘미친 사람처럼 굴다’ 또는 ‘미친 체하다’로도 옮길 수 있습니다. 앞뒤 문맥은 이것이 의도된 행동이었음을 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 난해합니다. ‘긁다’ 또는 ‘낙서하다’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁנּוֹ אֶת טַעְמוֹ
  english_pob_choice: he changed his behavior
  chosen_korean: 자신의 태도를 바꾸어
  alternatives_korean:
  - 행동을 바꾸어
  - 태도를 달리하여
  - 분위기를 바꾸어
  lexicon: HALOT
  rationale: טַעַם은 문자적으로는 ‘맛’이지만 여기서는 드러난 처신·태도를 가리키므로, 관찰 가능한 변화라는 점을 살려 ‘태도를 바꾸어’로 옮겼습니다.
- source_word: בְּעֵינֵיהֶם
  english_pob_choice: before their eyes
  chosen_korean: 그들의 눈앞에서
  alternatives_korean:
  - 그들의 눈앞에
  - 그들 앞에서
  - 그들의 보이는 데서
  lexicon: HALOT
  rationale: 히브리어 관용구의 시각적 생생함을 살리면서도 현대 한국어로 자연스럽게 들리도록 했습니다.
- source_word: וַיִּתְהֹלֵל
  english_pob_choice: acted like a madman
  chosen_korean: 미친 사람처럼 행동했고
  alternatives_korean:
  - 미친 사람처럼 굴었고
  - 광인처럼 행동했고
  - 미친 체했고
  lexicon: HALOT
  rationale: 본문의 행동 묘사를 살리되, 이 행위가 의도적 연기라는 뉘앙스를 너무 앞서 단정하지 않도록 했습니다.
- source_word: וַיּוֹרֶד רִירוֹ אֶל זְקָנוֹ
  english_pob_choice: let his saliva run down onto his beard
  chosen_korean: 자기 침을 수염으로 흘러내리게 했습니다
  alternatives_korean:
  - 자기 침이 수염으로 흘러내리게 했습니다
  - 침이 수염으로 흘러내리도록 했습니다
  - 자기 침을 수염에 떨어뜨렸습니다
  lexicon: HALOT
  rationale: ‘살라바’에 해당하는 רִירוֹ를 현대 한국어의 ‘침’으로 옮기고, ירד의 하향 운동을 ‘흘러내리게 했습니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 문지방/문짝에 대한 난해한 동사 ויתו의 처리
  chosen_reading: 본문의 불확실성을 과하게 좁히지 않고 ‘문지방 문짝들에 손을 대고’로 옮겼습니다.
  alternative_readings:
  - 문짝에 표를 그으며
  - 문짝에 낙서를 하며
  - 문에 표시를 하며
  rationale: 히브리어 동사는 난해하고 POB도 ‘made marks’로 신중하게 처리하므로, 의미를 단정하기보다 이상행동의 장면을 보존하는 쪽을 택했습니다.
  doctrine_reference: 본문비평/어휘 난해성
- issue: ‘미친 사람처럼 행동’의 의도성
  chosen_reading: 행동의 외양을 드러내되, 본문이 시사하는 연기성은 주석 수준에 남겼습니다.
  alternative_readings:
  - 미친 체했고
  - 정신 이상을 가장했고
  rationale: 앞 문맥상 의도적 가장임이 보이지만, 이 절 단독으로는 ‘체했다’보다 관찰 가능한 서술을 택하는 것이 더 안정적입니다.
  doctrine_reference: 서사 문맥
