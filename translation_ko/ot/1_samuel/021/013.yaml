translation:
  language: ko
  text: 다윗은 이 말들을 마음에 두었고, 가드 왕 아기스 앞에서 매우 두려워했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이것들을 그의 마음에 두었다’입니다. 이 히브리어 관용구는 보고를 진지하게 받아들이고 마음속으로 숙고했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... בִּלְבָבוֹ
  english_pob_choice: took these words to heart
  chosen_korean: 이 말들을 마음에 두었고
