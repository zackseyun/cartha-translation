id: 1SA.21.7
reference: 1 Samuel 21:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתֶּן ל֥/וֹ הַ/כֹּהֵ֖ן קֹ֑דֶשׁ כִּי֩ לֹא הָ֨יָה שָׁ֜ם לֶ֗חֶם כִּֽי אִם לֶ֤חֶם הַ/פָּנִים֙ הַ/מּֽוּסָרִים֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה לָ/שׂוּם֙ לֶ֣חֶם חֹ֔ם בְּ/י֖וֹם הִלָּקְחֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/007.yaml
  text: So the priest gave him holy bread[a], for there was no bread there except the bread of the Presence, which had been removed from before Yahweh, to put hot bread there on the day it was taken away.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'showbread.' Literally, 'the bread of the Presence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장은 그에게 거룩한 빵을 주었습니다. 그곳에는 빵이 없고, 야훼 앞에서 물러낸 진설빵[a]만 있었기 때문입니다. 이 빵은 그것을 물러낸 날 야훼 앞에 뜨거운 빵을 놓기 위해 물러낸 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘임재의 빵’입니다. 전통적으로 ‘진설병’이라고도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֶשׁ
  english_pob_choice: holy bread
  chosen_korean: 거룩한 빵
  alternatives_korean:
  - 성물
  - 거룩한 떡
  - 성별된 빵
  lexicon: HALOT
  rationale: 문맥상 ‘거룩한 것’은 제사 전용으로 구별된 빵을 가리키므로, 의미를 드러내면서도 원문 범위를 넘지 않는 ‘거룩한 빵’이 적절합니다.
- source_word: לֶחֶם הַפָּנִים
  english_pob_choice: the bread of the Presence
  chosen_korean: 진설빵
  alternatives_korean:
  - 임재의 빵
  - 얼굴의 빵
  - 진설된 빵
  lexicon: HALOT
  rationale: 이 표현은 성소에 진설하는 제의용 빵을 가리키는 고정된 용어이므로, 한국어 성경 전통에서 널리 알려진 ‘진설빵’을 채택했습니다. 다만 본문 이해를 위해 의미상 ‘야훼 앞에서 치워진’이라는 설명을 덧붙였습니다.
- source_word: הַמּוּסָרִים
  english_pob_choice: which had been removed
  chosen_korean: 치워진
  alternatives_korean:
  - 옮겨진
  - 제거된
  - 물러난
  lexicon: HALOT
  rationale: 이 분사형은 규례에 따라 이전 진설빵이 성소 앞에서 내려간 상태를 말하므로, 제의적 맥락이 드러나는 ‘치워진’이 자연스럽습니다.
- source_word: לָשׂוּם לֶחֶם חֹם
  english_pob_choice: to put hot bread
  chosen_korean: 뜨거운 빵을 놓기 위한 것
  alternatives_korean:
  - 뜨거운 빵을 두기 위한 것
  - 따뜻한 빵을 놓기 위한 것
  - 갓 구운 빵을 두기 위한 것
  lexicon: HALOT
  rationale: 히브리어는 새 빵을 그 자리에 두는 목적을 말하며, ‘hot’은 원문 형용사를 그대로 살린 표현입니다. ‘놓기 위한 것’은 영어 POB의 ‘to put … there’를 한국어로 간결하게 옮긴 것입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문자 그대로의 신명 표기를 따르기 위해 ‘야훼’를 사용했습니다. 본문이 제의적 맥락에서 하나님의 이름을 직접 언급하므로, 대체 호칭보다 고유명사 번역이 더 적합합니다.
theological_decisions:
- issue: ‘진설빵’과 ‘거룩한 빵’의 관계
  chosen_reading: ‘거룩한 빵’은 그 빵의 성별된 상태를, ‘진설빵’은 그 제의적 종류를 가리키는 것으로 함께 유지했습니다.
  alternative_readings:
  - 모두 ‘진설빵’으로 통일
  - 모두 ‘거룩한 빵’으로 풀어씀
  rationale: 원문은 일반 명사와 특정 제의 용어를 함께 사용하므로, 둘을 구분해 번역해야 성소 규례의 흐름이 보존됩니다.
  doctrine_reference: 제의 용어의 문맥별 구분
