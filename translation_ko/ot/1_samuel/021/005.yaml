base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/005.yaml
  text: The priest answered David and said[a], “There is no ordinary bread on hand, but there is holy bread—if the young men have kept themselves from women.”
  footnotes:
  - marker: a
    text: Or “from a woman,” that is, abstaining from sexual relations for ritual cleanness.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장이 다윗에게 대답하며 말했습니다[a], "보통 떡은 손에 없고, 거룩한 떡은 있습니다. 다만 젊은이들이 여자에게서 자신을 지켰다면 말입니다."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “한 여자에게서”, 곧 제의적 정결을 위한 성관계의 절제를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם חֹל
  english_pob_choice: ordinary bread
  chosen_korean: 보통 떡
  alternatives_korean:
  - 일반 떡
  - 평범한 떡
  - 속되지 않은 떡
  lexicon: HALOT
  rationale: חֹל이 קֹדֶשׁ과 대조되는 ‘일상적/비성물적’ 의미이므로, 한국어에서는 자연스럽고 대비가 살아나는 ‘보통 떡’이 적절합니다.
- source_word: אֶל תַּחַת יָדִי
  english_pob_choice: on hand
  chosen_korean: 손에 없고
  alternatives_korean:
  - 내 처분에 없고
  - 내게 없고
  - 내 손 아래에 없고
  lexicon: HALOT
  rationale: 관용구의 핵심은 ‘즉시 사용할 수 있는 상태’이므로, 직역보다 현재 가용성의 의미를 살린 표현으로 옮겼습니다.
- source_word: לֶחֶם קֹדֶשׁ
  english_pob_choice: holy bread
  chosen_korean: 거룩한 떡
  alternatives_korean:
  - 성결한 떡
  - 성스러운 떡
  - 거룩한 빵
  lexicon: HALOT
  rationale: 제의적으로 구별된 빵이라는 뜻을 살리되, 한국어 성경 문맥에서 흔한 ‘떡’이 더 자연스러워 이를 택했습니다.
- source_word: מֵאִשָּׁה
  english_pob_choice: from women
  chosen_korean: 여자에게서
  alternatives_korean:
  - 여인에게서
  - 여성에게서
  - 한 여자에게서
  lexicon: HALOT
  rationale: 문맥상 성적 접촉을 포함한 정결 조건이므로, ‘여자에게서 자신을 지켰다면’으로 옮겨 히브리어의 직접성을 유지했습니다.
theological_decisions:
- issue: 거룩한 떡을 먹기 위한 정결 조건
  chosen_reading: 본문의 제의적 조건을 유지하고, 성관계 금지를 일반 윤리 진술로 확대하지 않았습니다.
  alternative_readings:
  - ‘성적인 관계를 삼갔다면’처럼 더 설명적으로 풀 수 있습니다.
  - 정결 규례를 암시하는 주석을 본문 안에 더 길게 넣을 수 있습니다.
  rationale: 이 절은 성별 자체를 말하는 것이 아니라 성소 관련 정결 범주를 다루므로, 원문의 조건을 과장 없이 전달하는 것이 가장 충실합니다.
  doctrine_reference: 레위기적 정결 규례, 본문 문맥의 제의적 거룩성
