id: 1SA.21.2
reference: 1 Samuel 21:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֤א דָוִד֙ נֹ֔בֶ/ה אֶל אֲחִימֶ֖לֶךְ הַ/כֹּהֵ֑ן וַ/יֶּחֱרַ֨ד אֲחִימֶ֜לֶךְ לִ/קְרַ֣את דָּוִ֗ד וַ/יֹּ֤אמֶר ל/וֹ֙ מַדּ֤וּעַ אַתָּה֙ לְ/בַדֶּ֔/ךָ וְ/אִ֖ישׁ אֵ֥ין אִתָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/002.yaml
  text: David came to Nob, to Ahimelech the priest. Ahimelech trembled when he met David and said to him, “Why are you alone, and no man is with you?”
translation:
  language: ko
  text: 다윗이 놉에 가서 제사장 아히멜렉에게 왔습니다. 아히멜렉은 다윗을 만나자 떨며 그에게 말했습니다. “어찌하여 당신은 혼자이며, 당신과 함께 있는 사람이 하나도 없습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... אֶל
  english_pob_choice: David came to Nob, to Ahimelech the priest.
  chosen_korean: “...에게 왔습니다”
  alternatives_korean:
  - '...에 이르렀습니다'
  - '...에 도착했습니다'
  lexicon: בוא
  rationale: 히브리어 동사 בוא는 단순한 이동 완료를 나타내므로, 상황에 맞는 자연스러운 과거형 “왔습니다”로 옮겼습니다.
- source_word: נֹב
  english_pob_choice: Nob
  chosen_korean: 놉
  alternatives_korean:
  - 노브
  lexicon: 고유명사
  rationale: 성경에서 통용되는 한국어 지명형을 따라 놉으로 표기했습니다.
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 사제
  - 성직자
  lexicon: כֹּהֵן
  rationale: כהן은 제의적 직분을 가리키므로 표준 성경어인 “제사장”이 가장 직접적입니다.
- source_word: וַיֶּחֱרַד
  english_pob_choice: Ahimelech trembled
  chosen_korean: 떨며
  alternatives_korean:
  - 두려워하며
  - 전율하며
  lexicon: חרד
  rationale: חרד의 핵심은 두려움으로 인한 떨림이어서, 동작을 살린 부사절 “떨며”로 표현했습니다.
- source_word: לִקְרַאת
  english_pob_choice: when he met David
  chosen_korean: 다윗을 만나고
  alternatives_korean:
  - 다윗을 맞이하고
  - 다윗과 마주하고
  lexicon: קרא
  rationale: 문맥상 단순한 대면이 아니라 다윗을 맞닥뜨린 순간을 가리키므로 “만나고”가 가장 자연스럽습니다.
- source_word: מַדּוּעַ אַתָּה לְבַדֶּךָ וְאִישׁ אֵין אִתָּךְ
  english_pob_choice: Why are you alone, and no man is with you?
  chosen_korean: “어찌하여 당신은 혼자이며, 당신과 함께 있는 사람이 하나도 없습니까?”
  alternatives_korean:
  - 왜 혼자입니까, 함께한 사람이 아무도 없습니까?
  - 어찌하여 혼자이며 사람 하나 없습니까?
  lexicon: לְבַדֶּךָ / אִישׁ אֵין אִתָּךְ
  rationale: ‘홀로 있음’과 ‘동행하는 사람 부재’를 모두 드러내기 위해 “혼자이며 … 사람이 하나도 없습니까?”로 병렬해 옮겼습니다.
theological_decisions:
- issue: 아히멜렉의 반응 표현
  chosen_reading: “떨며”로 옮겨 아히멜렉의 즉각적인 두려움을 드러냈습니다.
  alternative_readings:
  - “놀라며”
  - “당황하며”
  rationale: 히브리어 חרד는 단순한 놀람보다 더 강한 두려움과 동요를 포함하므로, 심리적 강도를 유지하는 번역을 택했습니다.
  doctrine_reference: 본문 서술의 정서 강도 보존
