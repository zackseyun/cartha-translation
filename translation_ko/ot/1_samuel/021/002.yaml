  to: 다윗이 놉에 가서 제사장 아히멜렉에게 왔습니다. 아히멜렉은 다윗을 만나자 떨며 그에게 말했습니다. “어찌하여 당신은 혼자이며, 당신과 함께 있는 사람이 하나도 없습니까?”
