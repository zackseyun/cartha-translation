  text: וַ/יֹּ֣אמֶר הַ/כֹּהֵ֗ן חֶרֶב֩ גָּלְיָ֨ת הַ/פְּלִשְׁתִּ֜י אֲשֶׁר הִכִּ֣יתָ בְּ/עֵ֣מֶק הָאֵלָ֗ה הִנֵּה הִ֞יא לוּטָ֣ה בַ/שִּׂמְלָה֮ אַחֲרֵ֣י הָ/אֵפוֹד֒ אִם אֹתָ֤/הּ תִּֽקַּח לְ/ךָ֙ קָ֔ח כִּ֣י אֵ֥ין אַחֶ֛רֶת זוּלָתָ֖/הּ בָּ/זֶ֑ה וַ/יֹּ֧אמֶר דָּוִ֛ד אֵ֥ין כָּמ֖וֹ/הָ תְּנֶ֥/נָּה לִּֽ/י־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/010.yaml
  text: And the priest said[a], “The sword of Goliath the Philistine, whom you struck down in the Valley of Elah—behold, it is wrapped in a cloth behind the ephod. If you will take that for yourself, take it, for there is no other here except it.” And David said, “There is none like it; give it to me.”
  footnotes:
  - marker: a
    text: Hebrew 'wrapped in the cloak'; the noun can also be rendered 'garment' or 'mantle.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장이 말했습니다. “당신이 엘라 골짜기에서 쳐서 쓰러뜨린 블레셋 사람 골리앗의 칼이 여기 있습니다. 보십시오, 그것은 에봇 뒤에 천[a]에 싸여 있습니다. 그것을 가지려고 하시면, 가지십시오. 이곳에는 그것 외에 다른 것이 없습니다.” 다윗이 말했습니다. “그것과 같은 것은 없습니다. 그것을 내게 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שִׂמְלָה는 ‘겉옷’, ‘옷’, 또는 ‘망토’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  english_pob_choice: the sword of Goliath the Philistine
  chosen_korean: 블레셋 사람 골리앗의 칼
  alternatives_korean:
  - 블레셋 사람 골리앗의 검
  - 골리앗의 블레셋 칼
  lexicon: HALOT
  rationale: 히브리어는 소유 관계와 apposition을 함께 담고 있어 ‘블레셋 사람 골리앗의 칼’이 가장 자연스럽고, 본문이 무기 자체를 가리키므로 ‘검’보다 넓게 ‘칼’을 택했습니다.
- source_word: לוּטָה בַשִּׂמְלָה
  english_pob_choice: wrapped in a cloth
  chosen_korean: 천에 싸여 있습니다
  alternatives_korean:
  - 옷에 싸여 있습니다
  - 겉옷에 싸여 있습니다
  lexicon: HALOT
  rationale: 루트는 ‘덮다/싸다’의 수동 분사로, 문맥상 칼이 천으로 감싸진 상태를 가리키므로 ‘싸여 있습니다’가 직접적입니다. ‘천’은 POB 영어의 cloth를 반영해 과도한 해석을 피합니다.
- source_word: אַחֲרֵי הָאֵפוֹד
  english_pob_choice: behind the ephod
  chosen_korean: 에봇 뒤에
  alternatives_korean:
  - 에봇 뒤편에
  - 에봇 뒤쪽에
  lexicon: HALOT
  rationale: 공간적 위치를 나타내는 표현이므로 ‘뒤에’가 가장 간결하고 분명합니다. 종교복 자체를 설명하기보다 배치 위치를 전달하는 것이 본문 의도에 맞습니다.
- source_word: אֵין כָּמוֹהָ
  english_pob_choice: There is none like it
  chosen_korean: 그것과 같은 것은 없습니다
  alternatives_korean:
  - 그것과 같은 것은 아무것도 없습니다
  - 그와 같은 것은 없습니다
  lexicon: HALOT
  rationale: 문법상 여성형 대명사가 ‘칼’을 가리키므로, 한국어에서는 무정물에 맞게 ‘그것’으로 풀어 주었습니다. 관용적 독특성 표현을 자연스럽게 살리기 위해 ‘같은 것은 없습니다’로 옮겼습니다.
- source_word: תְּנֶנָּה לִּי
  english_pob_choice: give it to me
  chosen_korean: 그것을 내게 주십시오
  alternatives_korean:
  - 그것을 내게 주세요
  - 내게 그것을 주십시오
  lexicon: HALOT
  rationale: 직접 요구의 명령형을 공손한 합쇼체로 옮겼습니다. 여성형 접미사는 한국어에서 드러나지 않으므로 목적어를 ‘그것’으로 처리했습니다.
theological_decisions:
- issue: 제사장의 허락 표현인 אִם אֹתָהּ תִּקַּח לְךָ קָח의 뉘앙스
  chosen_reading: “그것을 당신이 가지려거든 가지십시오”라고 옮겨, 단순 조건문보다 허락/제안의 성격을 드러냈습니다.
  alternative_readings:
  - “만일 그것을 당신이 가져가려면 가져가십시오”
  - “원하시면 그것을 가져가십시오”
  rationale: 히브리어는 딱딱한 조건보다는 상대에게 선택권을 주는 허용적 제안의 성격이 강하므로, 한국어에서도 그 실용적 의미를 살렸습니다.
  doctrine_reference: 담화 문맥의 화행 보존
