source:
  edition: WLC
  text: חֲסַ֤ר מְשֻׁגָּעִים֙ אָ֔נִי כִּי הֲבֵאתֶ֣ם אֶת זֶ֔ה לְ/הִשְׁתַּגֵּ֖עַ עָלָ֑/י הֲ/זֶ֖ה יָב֥וֹא אֶל בֵּיתִֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/016.yaml
  text: Do I lack madmen[a], that you have brought this one to act like a madman before me? Shall this one come into my house?
  footnotes:
  - marker: a
    text: Or 'to behave insanely in my presence.' The Hebrew infinitive can be rendered more generally as acting madly, though the context suggests deliberate feigned madness.
    reason: lexical_alternative
translation:
  language: ko
  text: “내게 미치광이들이 부족하단 말이냐? 너희가 이 자를 내 앞에서 미치광이처럼 행동하게 하려고[a] 데려왔단 말이냐? 이 자가 내 집에 들어오겠느냐?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 부정사는 더 일반적으로 ‘정신 나간 듯 행동하다’로도 옮길 수 있습니다. 문맥상 다윗이 미치광이처럼 행동한 일을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲסַר
  english_pob_choice: lack
  chosen_korean: 부족하단 말이냐
  alternatives_korean:
  - 내가 부족하냐
  - 내게 모자라단 말이냐
  lexicon: HALOT
  rationale: 반문 형태의 빈정거림을 살리기 위해 ‘부족하단 말이냐’로 옮겨, 단순 정보 전달보다 아기스의 날 선 조롱을 드러냈습니다.
- source_word: מְשֻׁגָּעִים
  english_pob_choice: madmen
  chosen_korean: 미치광이
  alternatives_korean:
  - 미친 사람들
  - 광인
  - 미친 사람
  lexicon: HALOT
  rationale: 복수형의 집합적 경멸을 한국어에서 자연스럽게 드러내기 위해 ‘미치광이’로 처리했으며, 욕설성도 어느 정도 보존했습니다.
- source_word: לְהִשְׁתַּגֵּעַ עָלַי
  english_pob_choice: to act like a madman before me
  chosen_korean: 내 앞에서 미친 짓을 하게
  alternatives_korean:
  - 내 앞에서 미친 듯 행동하게
  - 내 앞에서 미치광이처럼 굴게
  lexicon: HALOT
  rationale: 히트파엘 부정사구가 실제 광기라기보다 ‘광인처럼 행동함’을 뜻하므로, 다윗의 가장된 행동을 반영해 ‘미친 짓을 하게’로 옮겼습니다.
- source_word: הֲזֶה יָבֹא אֶל בֵּיתִי
  english_pob_choice: Shall this one come into my house?
  chosen_korean: 이 사람이 내 집에 들어오겠느냐
  alternatives_korean:
  - 이 자가 내 집에 들어오겠느냐
  - 이 사람이 내 집으로 오겠느냐
  lexicon: HALOT
  rationale: 반복되는 지시어의 경멸을 한국어로는 ‘이 사람’으로 담되, 왕의 영역 안으로의 진입을 ‘들어오다’로 표현해 문맥을 분명히 했습니다.
theological_decisions:
- issue: 아기스의 발화의 공격적·경멸적 어조
  chosen_reading: 직설적 반문과 경멸어를 유지해, 다윗의 가장된 광기와 아기스의 모욕이 함께 드러나도록 했습니다.
  alternative_readings:
  - 어조를 완화한 평서형
  - ‘미친 사람’처럼 중립적인 표현
  rationale: 본문의 수사적 질문과 조롱은 서사의 긴장을 형성하므로, 이를 누그러뜨리지 않고 보존하는 것이 원문 의도를 더 잘 반영합니다.
  doctrine_reference: 서사 문맥 보존 및 화행 재현
- issue: ‘before me’의 공간적·관계적 뉘앙스
  chosen_reading: ‘내 앞에서’로 옮겨 왕 앞에서의 공개적 행위를 드러냈습니다.
  alternative_readings:
  - 내 앞에
  - 내 존재 앞에서
  - 내 면전에서
  rationale: 히브리어 עָלַי는 문자적으로 ‘내 위/나에게’이지만 여기서는 왕의 면전에서 벌어진 행동을 가리키므로, 한국어에서는 자연스러운 ‘내 앞에서’가 가장 적절합니다.
  doctrine_reference: 문맥상 용법 재현
