source:
  edition: WLC
  text: וְ/שָׁ֡ם אִישׁ֩ מֵ/עַבְדֵ֨י שָׁא֜וּל בַּ/יּ֣וֹם הַ/ה֗וּא נֶעְצָר֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/שְׁמ֖/וֹ דֹּאֵ֣ג הָ/אֲדֹמִ֑י אַבִּ֥יר הָ/רֹעִ֖ים אֲשֶׁ֥ר לְ/שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/008.yaml
  text: Now a man of Saul’s servants was there that day[a], detained before Yahweh; his name was Doeg the Edomite, the chief of Saul’s shepherds.
  footnotes:
  - marker: a
    text: Or 'restrained before the LORD' or 'kept back before the LORD.' The Hebrew does not specify why Doeg was detained.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날[ [a] ] 사울의 종들 가운데 한 사람이 야훼 앞에 붙들려 있었는데, 그의 이름은 에돔 사람 도엑이었으며 사울의 목자들 가운데 우두머리였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼 앞에서 억류된’ 혹은 ‘야훼 앞에 붙들린’으로도 옮길 수 있습니다. 히브리어는 도엑이 왜 붙들려 있었는지를 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁם אִישׁ
  english_pob_choice: Now a man ... was there
  chosen_korean: 그날 한 사람이
  alternatives_korean:
  - 거기 한 사람이
  - 그리고 거기 한 사람이
  lexicon: HALOT
  rationale: 서술 전환을 자연스럽게 살리면서 גם/וְשָׁם의 위치 표시를 한국어로 과도하게 반복하지 않도록 했습니다.
- source_word: מֵעַבְדֵי שָׁאוּל
  english_pob_choice: of Saul’s servants
  chosen_korean: 사울의 종들 가운데
  alternatives_korean:
  - 사울의 종들 중
  - 사울의 신하들 가운데
  lexicon: HALOT
  rationale: מִן의 부분적 의미를 살려 ‘~가운데’로 옮겼고, עֶבֶד은 이 문맥에서 왕의 봉사자라는 기본값인 ‘종’이 가장 직접적입니다.
- source_word: נֶעְצָר לִפְנֵי יְהוָה
  english_pob_choice: detained before Yahweh
  chosen_korean: 야훼 앞에 붙들려 있었는데
  alternatives_korean:
  - 야훼 앞에서 억류되어 있었는데
  - 야훼 앞에 억제되어 있었는데
  - 야훼 앞에 머물러 있었는데
  lexicon: HALOT
  rationale: 히브리어는 이유를 밝히지 않은 채 ‘붙들려 있음’의 상태를 말하므로, 원문의 모호성을 보존하는 ‘붙들려 있었습니다’ 계열을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 테트라그람마톤은 본 프로젝트 기본 원칙에 따라 번역어 ‘야훼’로 옮겼습니다.
- source_word: דֹּאֵג הָאֲדֹמִי
  english_pob_choice: Doeg the Edomite
  chosen_korean: 에돔 사람 도엑
  alternatives_korean:
  - 도엑 에돔 사람
  - 에돔 사람 도익
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 ‘도엑’으로 옮기고, הָאֲדֹמִי는 민족 표지로서 ‘에돔 사람’으로 처리했습니다.
- source_word: אַבִּיר הָרֹעִים
  english_pob_choice: the chief of Saul’s shepherds
  chosen_korean: 사울의 목자들 가운데 우두머리
  alternatives_korean:
  - 사울의 목자들 중 으뜸
  - 사울의 목자들의 우두머리
  - 사울의 목자들 가운데 장사
  lexicon: HALOT
  rationale: אַבִּיר은 여기서 힘센 존재보다 지위가 두드러진 사람을 가리키므로, ‘우두머리’로 옮겨 지배적 역할을 드러냈습니다.
theological_decisions:
- issue: 야훼 앞에 ‘붙들려 있음’의 의미
  chosen_reading: 원문이 설명하지 않는 억류/유보 상태를 그대로 남겼습니다.
  alternative_readings:
  - 어떤 종교적 의식 때문에 머물러 있었다
  - 우연히 그곳에 있었다
  rationale: 본문은 도엑이 왜 그렇게 되었는지 설명하지 않으므로, 해석을 덧씌우지 않고 서술적 모호성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
