  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ לַ/אֲחִימֶ֔לֶךְ וְ/אִ֛ין יֶשׁ פֹּ֥ה תַֽחַת יָדְ/ךָ֖ חֲנִ֣ית אוֹ חָ֑רֶב כִּ֣י גַם חַרְבִּ֤/י וְ/גַם כֵּלַ/י֙ לֹֽא לָקַ֣חְתִּי בְ/יָדִ֔/י כִּֽי הָיָ֥ה דְבַר הַ/מֶּ֖לֶךְ נָחֽוּץ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/009.yaml
  text: And David said to Ahimelech[a], “Is there not here under your hand a spear or a sword? For I did not take my sword or my weapons in my hand[c][b], because the king’s matter was urgent.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''under your hand,'' an idiom that can mean ''at your disposal'' or ''in your possession.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'my sword and my gear/equipment'; the Hebrew term can refer broadly to implements or equipment, here likely weapons.
    reason: lexical_alternative
  - marker: c
    text: Or 'the king’s business' or 'the king’s command'; Hebrew 'matter/word' is broader than any single English option.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 아히멜렉에게 말했습니다. 「여기 당신 손 아래에 창이나 칼이 없습니까? 내가 내 칼이나 내 무기들을 손에 가지고 오지 않았습니다. 왕의 일이 급했기 때문입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '당신 손 아래에'는 '당신 처분에' 또는 '당신이 가지고 있는'이라는 뜻이 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 כֵּלִים는 '장비'나 '도구'를 넓게 가리킬 수 있으나, 여기서는 무기류를 가리키는 말로 보는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 דָּבָר는 '일', '일거리', '명령', '사건' 등으로 넓게 해석될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... לַאֲחִימֶלֶךְ
  english_pob_choice: And David said to Ahimelech
  chosen_korean: 다윗이 아히멜렉에게 말했습니다
  alternatives_korean:
  - 그리고 다윗이 아히멜렉에게 말했습니다
  - 다윗이 아히멜렉에게 이르렀습니다
  lexicon: WLC; personal name transliteration
  rationale: 서사적 wayyiqtol을 한국어 서술문으로 자연스럽게 옮기되, 인명은 통용 표기인 아히멜렉을 유지했습니다.
- source_word: תַּחַת יָדְךָ
  english_pob_choice: under your hand
  chosen_korean: 당신 손 아래에
  alternatives_korean:
  - 당신 손에
  - 당신 처분에
  - 당신이 가지고 있는
  lexicon: HALOT
  rationale: 직역적 관용구를 살리면서도 현대 한국어에서 이해 가능하게 옮겨, '당신 처분에' 같은 해석적 완곡어를 피했습니다.
- source_word: חֲנִית אוֹ חָרֶב
  english_pob_choice: a spear or a sword
  chosen_korean: 창이나 칼
  alternatives_korean:
  - 창 또는 칼
  - 창 하나나 칼 하나
  lexicon: HALOT
  rationale: 두 무기 명사를 한국어의 자연스러운 병렬로 옮겨, 단수 대조를 유지했습니다.
- source_word: כֵּלַי
  english_pob_choice: my weapons
  chosen_korean: 내 무기들
  alternatives_korean:
  - 내 장비
  - 내 물건들
  - 내 도구들
  lexicon: HALOT
  rationale: 이 문맥에서 כֵּלִים는 단순한 도구보다 무장·장비의 뉘앙스가 강하므로, POB의 'weapons' 선택을 따라 '무기들'로 옮겼습니다.
- source_word: דְבַר הַמֶּלֶךְ
  english_pob_choice: the king’s matter
  chosen_korean: 왕의 일
  alternatives_korean:
  - 왕의 일거리
  - 왕의 명령
  - 왕의 사건
  lexicon: HALOT
  rationale: דבר의 폭넓은 의미를 살려 '일'로 옮겨, 특정한 명령이나 공무로 좁히지 않았습니다.
- source_word: נָחוּץ
  english_pob_choice: urgent
  chosen_korean: 급했기 때문입니다
  alternatives_korean:
  - 긴급했기 때문입니다
  - 절박했기 때문입니다
  - 서둘러야 했기 때문입니다
  lexicon: HALOT
  rationale: '''urgent''를 한국어의 자연스러운 결과절로 풀어, 문맥상 다윗의 사유를 분명히 했습니다.'
