base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/009.yaml
  text: And David said to Ahimelech[a], “Is there not here under your hand a spear or a sword? For I did not take my sword or my weapons in my hand[c][b], because the king’s matter was urgent.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''under your hand,'' an idiom that can mean ''at your disposal'' or ''in your possession.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'my sword and my gear/equipment'; the Hebrew term can refer broadly to implements or equipment, here likely weapons.
    reason: lexical_alternative
  - marker: c
    text: Or 'the king’s business' or 'the king’s command'; Hebrew 'matter/word' is broader than any single English option.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 아히멜렉에게 말했습니다. 「여기에 당신 손에 있는[a] 창이나 칼이 없습니까? 왕의 일이[c] 급했기 때문에 내 칼도 내 무기도[b] 가지고 오지 않았습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘당신 손 아래에’이며, ‘당신이 가지고 있는’ 또는 ‘당신 처분에 있는’이라는 뜻이 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 כֵּלַי는 ‘장비’나 ‘도구’를 넓게 가리킬 수 있으나, 여기서는 무기류를 가리키는 말로 보는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 דָּבָר는 ‘일’, ‘일거리’, ‘명령’, ‘사건’ 등으로 넓게 해석될 수 있습니다.
    reason: lexical_alternative
