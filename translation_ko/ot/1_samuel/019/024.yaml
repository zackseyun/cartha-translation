id: 1SA.19.24
reference: 1 Samuel 19:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּפְשַׁ֨ט גַּם ה֜וּא בְּגָדָ֗י/ו וַ/יִּתְנַבֵּ֤א גַם הוּא֙ לִ/פְנֵ֣י שְׁמוּאֵ֔ל וַ/יִּפֹּ֣ל עָרֹ֔ם כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה עַל כֵּן֙ יֹֽאמְר֔וּ הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִיאִֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/024.yaml
  text: He too stripped off his clothes[a], and he too prophesied before Samuel. He lay naked all that day and all that night. Therefore they say[b], “Is Saul also among the prophets?”
  footnotes:
  - marker: a
    text: Or 'stripped off his garments.'
    reason: lexical_alternative
  - marker: b
    text: '''Naked'' may refer to complete nakedness or to being stripped down from outer garments; the Hebrew does not specify further.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그도 자기 옷을 벗고[a] 사무엘 앞에서 예언했습니다. 그는 그날 온종일과 밤새도록 벌거벗은 채 누워 있었습니다[b]. 그러므로 사람들은 말합니다. “사울도 예언자들 가운데 있습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옷’은 ‘의복’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘벌거벗은’은 완전한 나체를 가리킬 수도 있고, 겉옷을 벗은 상태를 가리킬 수도 있습니다. 히브리어는 더 자세히 말하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁט ... בְּגָדָיו
  english_pob_choice: stripped off his clothes
  chosen_korean: 자기 옷을 벗어 던지고
  alternatives_korean:
  - 자기 옷을 벗고
  - 자기 겉옷을 벗고
  lexicon: HALOT
  rationale: פּשט와 בְּגָדִים의 결합은 옷을 벗는 동작을 가리키므로, 문맥의 급작스러운 동작감을 살려 ‘벗어 던지고’로 옮겼습니다.
- source_word: וַיִּתְנַבֵּא
  english_pob_choice: prophesied
  chosen_korean: 예언했습니다
  alternatives_korean:
  - 예언자처럼 행동했습니다
  - 예언 상태에 있었습니다
  lexicon: HALOT
  rationale: 히트파엘 נבא는 이 문맥에서 예언 행위를 뜻하므로, 해석을 좁히지 않는 표준적인 ‘예언했습니다’를 택했습니다.
- source_word: וַיִּפֹּל עָרֹם
  english_pob_choice: He lay naked
  chosen_korean: 벌거벗은 채 누워 있었습니다
  alternatives_korean:
  - 벌거벗은 채 있었습니다
  - 드러난 채 누워 있었습니다
  lexicon: HALOT
  rationale: עָרוֹם은 직접적으로 ‘벌거벗은’이라는 뜻이므로 약화하지 않았고, נפל은 여기서 지속 상태를 드러내므로 자연스럽게 ‘누워 있었습니다’로 옮겼습니다.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִם
  english_pob_choice: Is Saul also among the prophets?
  chosen_korean: 사울도 예언자들 가운데 있습니까?
  alternatives_korean:
  - 사울도 예언자들 가운데 있습니까?
  - 사울도 예언자들 중 하나입니까?
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 ‘예언자들 가운데’라는 소속/포함 관계이므로, 익숙한 성경적 표현을 유지하면서도 현대 한국어로 풀었습니다.
theological_decisions:
- issue: 사울의 벌거벗은 상태의 의미
  chosen_reading: 본문 그대로 ‘벌거벗은 채’로 옮기고, 완전한 나체인지 겉옷만 벗은 상태인지는 단정하지 않았습니다.
  alternative_readings:
  - 겉옷만 벗은 상태
  - 부분적으로만 옷을 벗은 상태
  rationale: 히브리어 עָרוֹם은 기본적으로 ‘벌거벗은’이지만, 어느 정도까지 벗었는지는 본문이 말하지 않습니다. 문학적 충격을 약화하지 않으면서도 불필요한 해석을 더하지 않기 위해 직역에 가깝게 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 사울의 예언 행위의 성격
  chosen_reading: ‘예언했습니다’로 번역하여, 그것이 정확히 어떤 형태의 예언이었는지는 열어 두었습니다.
  alternative_readings:
  - 황홀경적 상태에 들어갔습니다
  - 예언자처럼 행동했습니다
  rationale: 본문은 사울이 영의 영향 아래 예언적 활동을 했음을 보여 주지만, 그 양상을 세부적으로 규정하지는 않습니다. 따라서 신학적 긴장을 보존하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3
