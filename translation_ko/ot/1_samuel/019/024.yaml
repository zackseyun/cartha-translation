revisions:
- from: 그도 자기 옷을 벗어 던지고 사무엘 앞에서 예언했습니다. 그는 온종일과 온밤 내내 벌거벗은 채 누워 있었습니다. 그러므로 사람들이 말합니다. “사울도 예언자들 가운데 있습니까?”[a][b]
  to: 그도 자기 옷을 벗고[a] 사무엘 앞에서 예언했습니다. 그는 그날 온종일과 밤새도록 벌거벗은 채 누워 있었습니다[b]. 그러므로 사람들은 말합니다. “사울도 예언자들 가운데 있습니까?”
  rationale: 원문이 말하지 않는 ‘던짐’의 동작을 삭제하고, 옷과 벌거벗음에 관한 각주를 각각의 해당 표현에 연결했습니다. ‘그날 온종일과 밤새도록’으로 지속 기간을 자연스럽게 옮겼으며, 사울의 예언 행위와 노출 정도에 관한 본문의 불확정성은 유지했습니다.
  reviewer_model: gpt-5.6-terra
