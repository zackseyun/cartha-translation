  text: So Michal lowered David through the window, and he went and fled and escaped.
translation:
  language: ko
  text: 그러자 미갈이 다윗을 창으로 내려보냈습니다. 그는 가서 도망하고, 빠져나갔습니다.
  philosophy: formal
lexical_decisions:
- source_word: וַתֹּרֶד ... בְּעַד הַחַלּוֹן
  english_pob_choice: lowered ... through the window
  chosen_korean: 창으로 내려보냈습니다
  alternatives_korean:
  - 창을 통해 내려주었습니다
  - 창문으로 내려보냈습니다
  lexicon: הוריד / ירד
  rationale: 동사의 핵심은 ‘아래로 내리다’이므로, 단순한 ‘내보내다’보다 방향성을 살려 ‘내려보냈습니다’로 옮겼습니다. ‘창’은 문맥상 창문을 뜻합니다.
- source_word: וַיֵּלֶךְ
  english_pob_choice: he went
  chosen_korean: 그는 가서
  alternatives_korean:
  - 그가 갔고
  - 그는 떠났고
  lexicon: הלך
  rationale: 이 동사는 단순한 이동을 나타내므로, 뒤의 ‘도망하고, 빠져나갔습니다’와 연결되도록 간결하게 옮겼습니다.
- source_word: וַיִּבְרַח
  english_pob_choice: fled
  chosen_korean: 도망하고
  alternatives_korean:
  - 도망쳤고
  - 달아나고
  lexicon: ברח
  rationale: ‘도망하다/도망치다’ 가운데 문맥상 연속 동작을 살리기 위해 ‘도망하고’로 처리했습니다.
- source_word: וַיִּמָּלֵט
  english_pob_choice: escaped
  chosen_korean: 빠져나갔습니다
  alternatives_korean:
  - 벗어났습니다
  - 탈출했습니다
  lexicon: מלט
  rationale: ‘건져내다, 피하여 벗어나다’의 뜻을 살려, 추격과 위험을 벗어난 결과를 자연스럽게 드러내는 ‘빠져나갔습니다’를 택했습니다.
