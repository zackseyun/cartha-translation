source:
  edition: WLC
  text: וַ/תּ֥וֹסֶף הַ/מִּלְחָמָ֖ה לִֽ/הְי֑וֹת וַ/יֵּצֵ֨א דָוִ֜ד וַ/יִּלָּ֣חֶם בַּ/פְּלִשְׁתִּ֗ים וַ/יַּ֤ךְ בָּ/הֶם֙ מַכָּ֣ה גְדוֹלָ֔ה וַ/יָּנֻ֖סוּ מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/008.yaml
  text: And the war broke out again[a], and David went out and fought against the Philistines and struck them with a great blow, so that they fled before him.
  footnotes:
  - marker: a
    text: Or, 'the war continued' / 'there was war again.' The Hebrew idiom literally says 'the war added to be,' expressing renewed or continued warfare.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 전쟁이 다시 일어났습니다[a]. 다윗이 나가서 블레셋 사람들과 싸워 그들을 크게 쳐부수니, 그들이 그의 앞에서 도망하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전쟁이 계속되었습니다’, ‘전쟁이 다시 있었습니다’. 히브리어 관용구는 문자적으로는 ‘전쟁이 더하여 존재하게 되다’에 가깝고, 재개되거나 반복된 전쟁을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף הַמִּלְחָמָה לִהְיוֹת
  english_pob_choice: the war broke out again
  chosen_korean: 전쟁이 다시 일어났습니다
  alternatives_korean:
  - 전쟁이 계속되었습니다
  - 전쟁이 다시 있었습니다
  lexicon: HALOT
  rationale: יסף + היה 부정사는 단순 지속보다 ‘재개/반복’을 나타내므로, 현대 한국어에서 자연스럽게 ‘다시 일어났습니다’로 옮겨 재발한 전쟁의 뉘앙스를 살렸습니다.
- source_word: וַיֵּצֵא דָוִד
  english_pob_choice: David went out
  chosen_korean: 다윗이 나가서
  alternatives_korean:
  - 다윗이 전쟁하러 나가서
  - 다윗이 밖으로 나가서
  lexicon: HALOT
  rationale: 히브리어는 목적어를 생략한 채 פשוט히 ‘나가다’라고만 말하므로, 군사적 맥락은 유지하되 원문의 간결함을 살려 ‘나가서’로 번역했습니다.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים / וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  english_pob_choice: fought against the Philistines / struck them with a great blow
  chosen_korean: 블레셋 사람들과 싸워 그들을 크게 쳐부수니
  alternatives_korean:
  - 블레셋 사람들과 싸워 그들에게 큰 타격을 주니
  - 블레셋 사람들과 싸워 그들을 크게 무찌르니
  lexicon: HALOT
  rationale: לחם은 ‘싸우다’, נכה + מכה גדולה는 단순 타격보다 강한 패배/타격을 가리키므로, 두 표현을 합쳐 현대 한국어에서 가장 자연스럽게 전쟁 승리를 드러내는 ‘크게 쳐부수니’로 옮겼습니다.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  english_pob_choice: they fled before him
  chosen_korean: 그들이 그의 앞에서 도망하였습니다
  alternatives_korean:
  - 그들이 그의 앞에서 달아났습니다
  - 그들이 그를 피해 달아났습니다
  lexicon: HALOT
  rationale: מפני는 ‘~의 앞에서/얼굴 앞에서’의 관용구이므로, ‘그의 앞에서 도망하였습니다’로 옮겨 관계의 방향을 보존했습니다.
theological_decisions:
- issue: 전쟁의 반복을 나타내는 히브리어 관용구의 처리
  chosen_reading: ‘전쟁이 다시 일어났습니다’로 번역해 사건의 재개성과 긴장감을 드러냈습니다.
  alternative_readings:
  - 전쟁이 계속되었습니다
  - 전쟁이 다시 있었습니다
  rationale: 본문은 단순한 지속이 아니라 전쟁의 재발/재개를 말하므로, 평이하면서도 원문의 동적 뉘앙스를 살리는 표현을 택했습니다.
  doctrine_reference: 서술 본문의 사건성 보존 원칙
- issue: 다윗의 군사 행동 서술의 압축성 보존
  chosen_reading: 동사의 연쇄를 살려 다윗의 공격과 승리를 한 흐름으로 제시했습니다.
  alternative_readings:
  - 문장을 더 풀어 ‘전쟁에 나가서 싸워’로 설명적으로 번역
  rationale: 본문은 짧은 행위 연쇄를 통해 승리의 급박함을 전달하므로, 설명을 덧붙이기보다 원문의 압축을 유지했습니다.
  doctrine_reference: 서사체의 수사적 밀도 보존
