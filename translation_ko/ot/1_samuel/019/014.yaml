base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/014.yaml
  text: Then Saul sent messengers to seize David[a], and she said, “He is sick.”
  footnotes:
  - marker: a
    text: The Hebrew simply says, “and she said”; the feminine subject is understood from the context as Michal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울이 다윗을 잡으려고 사자들을 보냈고, 그녀가 말했습니다. “그는 병이 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단지 “그리고 그녀가 말하였다”라고만 하며, 여성 화자는 문맥상 미갈입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: Then ... sent
  chosen_korean: 그때 ... 보냈고
  alternatives_korean:
  - 그리고 ... 보냈고
  - 그래서 ... 보냈고
  lexicon: WLC; HALOT
  rationale: 와우 연속형은 서사의 진행을 나타내므로, 한국어에서는 자연스러운 순차 표현인 ‘그때’로 옮겼습니다.
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들을
  - 메신저들을
  lexicon: WLC; HALOT
  rationale: 여기서는 천사가 아니라 사람이 보낸 전달자들이므로, ‘사자들’로 옮겨 사울의 파견 행위를 간결하게 드러냈습니다.
- source_word: לָקַחַת אֶת דָּוִד
  english_pob_choice: to seize David
  chosen_korean: 다윗을 잡으려고
  alternatives_korean:
  - 다윗을 붙잡으려고
  - 다윗을 데려가려고
  lexicon: WLC; HALOT
  rationale: 문맥상 단순한 ‘데리다’가 아니라 체포·억류의 의도가 있으므로, 강제성을 살린 ‘잡다’가 적절합니다.
- source_word: וַתֹּאמֶר
  english_pob_choice: and she said
  chosen_korean: 그녀가 말했습니다
  alternatives_korean:
  - 그리고 그녀가 말했습니다
  - 그가 말했습니다
  lexicon: WLC; context
  rationale: 히브리어는 성별만 암시하고 인물명을 직접 말하지 않지만, 문맥상 미갈이므로 여성 대명사를 보충해 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 문맥상 말하는 주체의 식별
  chosen_reading: ‘그녀가’로 옮겨 미갈이 발화 주체임을 드러냈습니다.
  alternative_readings:
  - ‘그리고 말했다’처럼 주어를 생략함
  - ‘미갈이 말했습니다’라고 직접 명시함
  rationale: 히브리어 원문은 단순히 ‘그리고 그녀가 말하였다’로 되어 있어 주어는 문맥으로 보충됩니다. 한국어에서는 오해를 줄이기 위해 최소한의 보충을 했습니다.
  doctrine_reference: 문맥 보충에 따른 서술 명료화
