source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוֹנָתָ֤ן בְּ/דָוִד֙ ט֔וֹב אֶל שָׁא֖וּל אָבִ֑י/ו וַ/יֹּ֣אמֶר אֵ֠לָי/ו אַל יֶחֱטָ֨א הַ/מֶּ֜לֶךְ בְּ/עַבְדּ֣/וֹ בְ/דָוִ֗ד כִּ֣י ל֤וֹא חָטָא֙ לָ֔/ךְ וְ/כִ֥י מַעֲשָׂ֖י/ו טוֹב לְ/ךָ֥ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/004.yaml
  text: Jonathan spoke well of David to Saul his father[a], and said to him, “Let not the king sin against his servant David, because he has not sinned against you[b], and because his deeds have been very good for you.”
  footnotes:
  - marker: a
    text: Or 'spoke favorably about David.' The Hebrew idiom literally says 'spoke good concerning David.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Let not the king sin against his servant, against David' repeats the object for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 요나단이 그의 아버지 사울에게 다윗을 좋게 말하며 그에게 말했습니다. “왕께서는 그의 종 다윗에게 죄를 짓지 마십시오. 그는 왕께 죄를 짓지 않았고, 그의 행실은 왕께 매우 유익했습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로 ‘다윗에 관해 좋은 것을 말하다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그의 종, 곧 다윗에게’처럼 같은 대상을 반복해 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... טוֹב בְּדָוִד
  english_pob_choice: spoke well of David
  chosen_korean: 다윗을 좋게 말하며
  alternatives_korean:
  - 다윗에 관해 좋게 말하며
  - 다윗에 대해 호의적으로 말하며
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순히 ‘좋은 말을 하다’가 아니라 다윗을 변호하고 호의적으로 언급한다는 뜻이므로, 자연스러운 한국어로 옮겼습니다.
- source_word: אֶל שָׁאוּל אָבִיו
  english_pob_choice: to Saul his father
  chosen_korean: 그의 아버지 사울에게
  alternatives_korean:
  - 사울 그의 아버지에게
  - 아버지 사울에게
  lexicon: HALOT
  rationale: 소유 표현을 분명히 하되 한국어 어순으로 자연스럽게 재배열했습니다.
- source_word: אַל יֶחֱטָא הַמֶּלֶךְ
  english_pob_choice: Let not the king sin
  chosen_korean: 왕께서는 ... 죄를 짓지 마십시오
  alternatives_korean:
  - 왕은 ... 죄짓지 마십시오
  - 왕께서 ... 죄를 범하지 마십시오
  lexicon: HALOT
  rationale: אַל + 미완료형의 금지 뉘앙스를 살리기 위해 정중한 금지문으로 옮겼고, ‘죄를 짓다’로 동사 어근을 보존했습니다.
- source_word: בְּעַבְדּוֹ
  english_pob_choice: against his servant
  chosen_korean: 그의 종 다윗에게
  alternatives_korean:
  - 그의 종에게
  - 그의 종 다윗을 향하여
  lexicon: HALOT
  rationale: ‘죄를 짓다’의 대상은 한국어에서도 여격으로 자연스럽게 드러나므로, ‘against’의 관계를 ‘-에게’로 표현했습니다.
- source_word: כִּי לֹא חָטָא לָךְ
  english_pob_choice: because he has not sinned against you
  chosen_korean: 그는 왕께 죄를 짓지 않았고
  alternatives_korean:
  - 그는 왕께 죄를 짓지 않았습니다
  - 그는 왕에게 잘못한 일이 없고
  lexicon: HALOT
  rationale: 앞의 금지문과 같은 ‘죄’ 어근을 유지해 대조를 분명히 했습니다.
- source_word: מַעֲשָׂיו טוֹב לְךָ מְאֹד
  english_pob_choice: his deeds have been very good for you
  chosen_korean: 그의 행실은 왕께 매우 유익했습니다
  alternatives_korean:
  - 그의 행동은 왕께 매우 좋았습니다
  - 그의 행위는 왕께 크게 유익했습니다
  lexicon: HALOT
  rationale: 단순한 도덕 평가보다 실제 유익을 뜻하는 문맥이므로, ‘유익했습니다’로 결과적 가치를 살렸습니다.
theological_decisions:
- issue: 왕에게 말을 전하는 요나단의 공손한 설득 어조
  chosen_reading: 직접 인용 안에서 왕을 높이는 정중한 명령형(‘왕께서는 ... 죄를 짓지 마십시오’)을 유지했습니다.
  alternative_readings:
  - 더 평이한 ‘왕은 ... 죄짓지 마십시오’
  - 더 직설적인 ‘왕께서 ... 하지 마십시오’
  rationale: 사울을 설득하는 궁정 장면이므로, 본문의 예우와 긴장을 살리기 위해 현대 합쇼체의 공손한 금지문으로 처리했습니다.
  doctrine_reference: 서사 본문에서의 화행과 공손성
