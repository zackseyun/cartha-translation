base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/007.yaml
  text: So Jonathan called David and told him all these things. Then Jonathan brought David to Saul[a], and he was in his presence as before.
  footnotes:
  - marker: a
    text: Literally, 'as yesterday, three days ago,' a Hebrew idiom meaning 'as before' or 'as formerly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 요나단이 다윗을 불러 그에게 이 모든 일을 말했습니다. 그런 다음 요나단이 다윗을 사울에게 데려갔고, 그는 전처럼 그의 앞에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘어제, 사흘 전’은 여기서 ‘전처럼’ 또는 ‘이전처럼’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
  - 소집하여
  - 불렀습니다
  lexicon: HALOT
  rationale: לְ + 인물을 동반한 קרא는 자연스럽게 ‘부르다/불러’로 옮길 수 있으며, 상황을 과도하게 공식화하지 않으면서도 서술 흐름을 유지합니다.
- source_word: וַיַּגֶּד
  english_pob_choice: told
  chosen_korean: 말했습니다
  alternatives_korean:
  - 알렸습니다
  - 전했습니다
  lexicon: HALOT
  rationale: נגד의 사역형은 내용을 ‘알게 하다/말하다’의 뜻이므로, 다윗에게 내용을 전달하는 맥락에서 ‘말했습니다’가 가장 자연스럽습니다.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: all these things
  chosen_korean: 이 모든 일
  alternatives_korean:
  - 이 모든 것
  - 이 모든 말
  lexicon: HALOT
  rationale: דְּבָרִים는 ‘말씀들’보다 넓게 ‘일/사건/내용’을 가리킬 수 있어, 여기서는 사울의 말과 의도를 포함한 내용 전체를 담는 ‘일’이 적절합니다.
- source_word: וַיְהִי לְפָנָיו כְּאֶתְמוֹל שִׁלְשׁוֹם
  english_pob_choice: he was in his presence as before
  chosen_korean: 전처럼 그의 앞에 있었습니다
  alternatives_korean:
  - 예전처럼 그의 앞에 있었습니다
  - 옛날처럼 그의 앞에 있었습니다
  lexicon: HALOT
  rationale: לְפָנָיו는 단순한 위치보다 ‘그의 앞/면전’이라는 관계적 상태를 뜻하므로, POB의 ‘in his presence’를 살리면서도 한국어로는 ‘그의 앞에 있었습니다’가 자연스럽습니다.
theological_decisions:
- issue: כְּאֶתְמוֹל שִׁלְשׁוֹם의 관용적 시간표현
  chosen_reading: 직역보다 의미역으로 ‘전처럼’이라고 옮겨, 최근 과거를 가리키는 히브리 관용을 드러냈습니다.
  alternative_readings:
  - ‘어제와 그제처럼’
  - ‘옛날처럼’
  rationale: 문자적으로는 ‘어제, 사흘 전’이지만, 본문 기능은 ‘이전처럼/다시 예전 상태로’라는 회복된 관계를 말하는 데 있으므로 한국어에서는 관용의 의미를 우선했습니다.
  doctrine_reference: 서술적 관용구 번역 원칙
