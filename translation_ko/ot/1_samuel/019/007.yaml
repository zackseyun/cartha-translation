    rationale: ‘그는 … 그의 앞에’는 문법상 다윗과 사울을 가리키지만, 독자가 두 ‘그’의 지시 대상을 추론해야 합니다. 원문은 다윗이 사울 앞에 있게 된 사실을 명확히 하므로 인명을 밝혀 번역하는 편이 안전합니다.
