  to: 그러자 요나단은 다윗을 불러 이 모든 일을 그에게 알려 주었습니다. 그런 다음 요나단은 다윗을 사울에게 데려갔고, 다윗은 전처럼 사울 앞에 있었습니다.[a]
  rationale: 인물 이름을 명시하여 다윗이 사울의 앞, 곧 사울의 임석에 이전처럼 있게 되었다는 원문의 관계를 분명히 했습니다. 시간 관용구는 본문의 자연스러운 의미역인 ‘전처럼’으로 유지하고, 각주에서 문자적 표현을 밝혔습니다.
