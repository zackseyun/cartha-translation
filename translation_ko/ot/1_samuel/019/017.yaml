source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל מִיכַ֗ל לָ֤/מָּה כָּ֨כָה֙ רִמִּיתִ֔/נִי וַ/תְּשַׁלְּחִ֥י אֶת אֹיְבִ֖/י וַ/יִּמָּלֵ֑ט וַ/תֹּ֤אמֶר מִיכַל֙ אֶל שָׁא֔וּל הוּא אָמַ֥ר אֵלַ֛/י שַׁלְּחִ֖/נִי לָ/מָ֥ה אֲמִיתֵֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/017.yaml
  text: Then Saul said to Michal[a], “Why have you deceived me like this and sent away my enemy, so that he escaped?” And Michal said to Saul, “He said to me, ‘Let me go. Why should I kill you?’”
  footnotes:
  - marker: a
    text: Or, more interpretively, “Let me go, or I will kill you.” The Hebrew reads literally, “Send me away. Why should I kill you?”
    reason: alternative_reading
translation:
  language: ko
  text: 그때 사울이 미갈에게 말했습니다. “어찌하여 네가 이렇게 나를 속이고 내 원수를 보내어 달아나게 했느냐?” 미갈이 사울에게 말했습니다. “그가 나에게 ‘나를 보내시오. 내가 어찌 당신을 죽이겠소?’라고 말했습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 더 해석적으로 옮기면, “나를 보내라. 그렇지 않으면 내가 당신을 죽이겠다”가 될 수 있습니다. 그러나 원문에는 ‘그렇지 않으면’에 해당하는 말이 없습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רִמִּיתִנִי
  english_pob_choice: have you deceived me
  chosen_korean: 나를 속이고
  alternatives_korean:
  - 나를 기만하고
  - 나를 속여
  lexicon: HALOT
  rationale: רמה는 여기서 기만적 행동을 가리키며, 현대 한국어에서는 ‘속이다’가 가장 자연스럽고 직접적인 대응입니다.
- source_word: וַתְּשַׁלְּחִי
  english_pob_choice: sent away
  chosen_korean: 보내어
  alternatives_korean:
  - 내보내어
  - 떠나게 하여
  lexicon: HALOT
  rationale: שלח의 기본 의미인 ‘보내다/보내어 떠나게 하다’를 살려, 사울의 원망과 사건의 진행을 함께 드러내는 ‘보내어’로 옮겼습니다.
- source_word: אֹיְבִי
  english_pob_choice: my enemy
  chosen_korean: 내 원수
  alternatives_korean:
  - 내 적
  - 내 원수된 자
  lexicon: HALOT
  rationale: אויב는 단순한 적대 대상이 아니라 강한 적대 관계를 나타내므로, 성서적이고도 직접적인 ‘원수’가 적절합니다.
- source_word: לָמָה אֲמִיתֵךְ
  english_pob_choice: Why should I kill you?
  chosen_korean: 어찌하여 내가 당신을 죽이겠습니까?
  alternatives_korean:
  - 왜 내가 당신을 죽이겠습니까?
  - 어찌 내가 당신을 죽이리이까?
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘어찌하여 내가 당신을 죽이겠습니까?’이며, 한국어에서는 경멸이나 위협을 덜어내지 않으면서도 자연스러운 직접화법으로 옮겼습니다.
- source_word: שַׁלְּחִנִי
  english_pob_choice: Let me go / Send me away
  chosen_korean: 나를 보내십시오
  alternatives_korean:
  - 나를 가게 하십시오
  - 나를 풀어 주십시오
  lexicon: HALOT
  rationale: 같은 어근 שלח의 반복을 살리기 위해 ‘보내다’를 유지했고, 요청의 형식은 한국어 명령문으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 미갈이 전하는 다윗의 말의 뉘앙스
  chosen_reading: 본문의 히브리어를 따라 ‘나를 보내십시오. 어찌하여 내가 당신을 죽이겠습니까?’로 옮겨, 명시적 조건절 없이 직접 인용을 유지했습니다.
  alternative_readings:
  - ‘나를 보내십시오. 그렇지 않으면 내가 당신을 죽이겠습니다.’처럼 위협을 명시적으로 풀어 쓰기
  rationale: 본문은 ‘or else’에 해당하는 표현을 두지 않으므로, 해석을 덧붙이기보다 원문이 드러내는 말의 형태를 보존하는 것이 더 적절합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
