revisions:
- from: 그때 사울이 미갈에게 말했습니다. “어찌하여 너는 이렇게 나를 속이고 내 원수를 보내어 그가 달아나게 했느냐?” 미갈이 사울에게 말했습니다. “그가 나에게 말하기를 ‘나를 보내십시오. 어찌하여 내가 당신을 죽이겠습니까?’”[a]
  to: 그때 사울이 미갈에게 말했습니다. “어찌하여 네가 이렇게 나를 속이고 내 원수를 보내어 달아나게 했느냐?” 미갈이 사울에게 말했습니다. “그가 나에게 ‘나를 보내시오. 내가 어찌 당신을 죽이겠소?’라고 말했습니다.”[a]
  rationale: 사울의 비난은 원문의 ‘속이다—보내다—달아나다’라는 진행을 자연스러운 한국어로 유지하도록 다듬었습니다. 미갈의 인용은 히브리어의 명령과 의문형을 보존하고, 해석적으로 명시된 협박으로 바꾸지 않았습니다. 각주는 본문과 중복되지 않도록 실제 대안을 설명하며 내부 영어 감사 언급을 제거했습니다.
