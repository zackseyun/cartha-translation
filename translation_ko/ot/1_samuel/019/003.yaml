base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/003.yaml
  text: I will go out and stand beside my father in the field where you are[a], and I will speak to my father about you. Then I will see what happens and tell you.
  footnotes:
  - marker: a
    text: Literally, 'I will see what,' an elliptical expression meaning 'I will see what happens' or 'I will see what the situation is.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 나가서 네가 있는 들판에서 내 아버지 곁에 서서, 너에 관하여 내 아버지께 말씀드리겠습니다. 그 뒤에 무슨 일이 일어나는지[a] 보고 너에게 알려 주겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그리고 내가 무엇을 보겠다’라고 하며, ‘무엇’ 뒤의 내용이 생략되어 있습니다. 여기서는 문맥에 따라 ‘무슨 일이 일어나는지’로 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  english_pob_choice: I will go out
  chosen_korean: 내가 나가서
  alternatives_korean:
  - 내가 나갈 것입니다
  - 내가 밖으로 나가겠습니다
  lexicon: HALOT
  rationale: יצא의 미래적 의도를 자연스럽게 살리되, 앞 절과의 연결을 위해 합쇼체의 연결형 ‘나가서’를 택했습니다.
- source_word: לְיַד אָבִי
  english_pob_choice: beside my father
  chosen_korean: 내 아버지 곁에
  alternatives_korean:
  - 내 아버지 옆에
  - 내 아버지 편에
  lexicon: HALOT
  rationale: לְיַד는 직역보다 ‘곁에/옆에’가 관용적이며, 가족 관계를 드러내는 문맥에서 ‘곁에’가 가장 자연스럽습니다.
- source_word: בַּשָּׂדֶה אֲשֶׁר אַתָּה שָׁם
  english_pob_choice: in the field where you are
  chosen_korean: 네가 있는 들판에서
  alternatives_korean:
  - 네가 있는 밭에서
  - 네가 있는 그 들판에서
  lexicon: HALOT
  rationale: שָׂדֶה는 여기서 지형을 가리키는 말로 ‘들판’이 무난하며, 상대 위치를 나타내는 יחס절은 한국어에서 ‘네가 있는’으로 풀어 자연스럽게 옮겼습니다.
- source_word: וְרָאִיתִי מָה
  english_pob_choice: Then I will see what happens
  chosen_korean: 그러면 내가 무슨 일이 있는지 보고
  alternatives_korean:
  - 그러면 내가 어떻게 되는지 보고
  - 그러면 내가 무엇이 일어나는지 보고
  lexicon: HALOT
  rationale: 히브리어는 생략된 목적절이 있는 표현이므로, POB의 의미를 따라 ‘무슨 일이 있는지’로 보완해 엘립시스를 드러냈습니다.
