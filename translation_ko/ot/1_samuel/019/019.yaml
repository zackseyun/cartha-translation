  rationale: 지명 관계를 한국어의 관형격 구조로 옮겨, 나욧이 라마 안/부근의 특정 장소라는 점을 간결하게 드러냈습니다.
theological_decisions:
- issue: 장소 표현의 중첩 관계
  chosen_reading: ‘라마의 나욧’으로 옮겨 나욧과 라마의 지리적 포함 관계를 유지했습니다.
  alternative_readings:
  - ‘나욧이 라마에 있는’으로 풀어쓰기
  - ‘라마 안의 나욧’으로 재구성
  rationale: 히브리어의 두 개의 전치사구가 주는 공간적 관계를 지나치게 평준화하지 않고, 독자가 본문 구조를 파악할 수 있게 했습니다.
  doctrine_reference: 본문 지리 정보의 보존
