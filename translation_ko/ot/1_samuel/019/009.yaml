revisions:
- from: 야훼께로부터 온 악한 영이 사울에게 임하였는데, 그는 집에 앉아 있었고 손에는 창이 들려 있었습니다. 다윗은 손으로 수금[라]을 타고 있었습니다.[a][b]
  to: 야훼께로부터 온 악한 영[a]이 사울에게 임하였는데, 그는 집에 앉아 창을 손에 들고 있었고, 다윗은 손으로 악기[b]를 연주하고 있었습니다.
  rationale: 특정 악기명 ‘수금’과 정의되지 않은 [라] 표지를 제거했습니다. 대신 נגן이 함의하는 악기 연주를 ‘악기를 연주하다’로 옮기고, 악기의 종류가 본문에 명시되지 않았다는 점은 각주 b로 유지했습니다. 나머지 문장은 원문의 배경 묘사와 합쇼체 문체를 살려 다듬었습니다.
  reviewer_model: gpt-5.6-terra
