  source_fidelity: ‘수금’을 본문에 직접 넣은 것은 בְּיָד(‘손으로’)가 악기 이름을 명시하지 않는다는 원문과 감사 기록에 맞지 않습니다. נגן은 악기 연주를 뜻하므로 ‘악기를 연주하다’는 악기의 존재만 드러내면서 특정 악기를 단정하지 않는 안전한 표현입니다. ‘야훼께로부터 온 악한 영’, ‘사울에게 임하다’, 창을 손에 든 상태는 원문의 의미를 충실히 반영합니다.
