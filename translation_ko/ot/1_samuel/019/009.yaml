  text: וַ/תְּהִי֩ ר֨וּחַ יְהוָ֤ה רָעָה֙ אֶל שָׁא֔וּל וְ/הוּא֙ בְּ/בֵית֣/וֹ יוֹשֵׁ֔ב וַ/חֲנִית֖/וֹ בְּ/יָד֑/וֹ וְ/דָוִ֖ד מְנַגֵּ֥ן בְּ/יָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/009.yaml
  text: And an evil spirit from Yahweh came upon Saul while he was sitting in his house with his spear in his hand[b][a], and David was playing the lyre with his hand.
  footnotes:
  - marker: a
    text: Or 'a harmful spirit from the LORD.' The Hebrew adjective can mean 'evil' or 'harmful/distressing.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'with hand.' The verse does not explicitly name the instrument here, though the broader context indicates David was playing music for Saul.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께로부터 온 악한 영이 사울에게 임하였는데, 그는 집에 앉아 있었고 손에는 창이 들려 있었습니다. 다윗은 손으로 수금[라]을 타고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악한’은 여기서 도덕적 악뿐 아니라 ‘해로운, 괴로운’의 뜻도 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 악기의 이름을 직접 밝히지 않지만, 앞뒤 문맥은 다윗이 사울 앞에서 현악기를 연주하는 장면으로 이해하게 합니다.
    reason: source_note
lexical_decisions:
- source_word: רוּחַ יְהוָה רָעָה
  english_pob_choice: an evil spirit from Yahweh
  chosen_korean: 야훼께로부터 온 악한 영
  alternatives_korean:
  - 야훼께서 보내신 해로운 영
  - 야훼의 악한 영
  lexicon: HALOT
  rationale: רוּחַ는 ‘영’으로, רָעָה는 여기서 도덕적 악이라기보다 해롭고 괴로운 작용을 나타낼 수 있어 문맥상 ‘악한 영’으로 옮기되, מקור 관계는 ‘~께로부터 온’으로 드러냈습니다.
- source_word: אֶל שָׁאוּל
  english_pob_choice: upon Saul
  chosen_korean: 사울에게 임하였는데
  alternatives_korean:
  - 사울 위에 임하였는데
  - 사울에게 이르렀는데
  lexicon: HALOT
  rationale: אֶל은 기본적으로 ‘~에게/~을 향해’이지만, 해로운 영이 덮치는 장면이므로 한국어에서는 ‘임하다’가 가장 자연스럽고 원문의 공격적·가해적 뉘앙스를 살립니다.
- source_word: בְּבֵיתוֹ יוֹשֵׁב וַחֲנִיתוֹ בְּיָדוֹ
  english_pob_choice: while he was sitting in his house with his spear in his hand
  chosen_korean: 그는 집에 앉아 있었고 손에는 창이 들려 있었습니다
  alternatives_korean:
  - 그는 집에 앉아 있었고 손에 창을 쥐고 있었습니다
  - 그는 집에 նստ아 있었고 창을 손에 들고 있었습니다
  lexicon: HALOT
  rationale: 배경 설명의 분사·비서술 구조를 한국어 진행형으로 풀되, ‘손에’와 ‘들려 있었습니다’로 상태 묘사를 살려 사울의 긴장된 장면을 자연스럽게 전했습니다.
- source_word: מְנַגֵּן בְּיָד
  english_pob_choice: was playing the lyre with his hand
  chosen_korean: 다윗은 손으로 수금[라]을 타고 있었습니다
  alternatives_korean:
  - 다윗은 손으로 연주하고 있었습니다
  - 다윗은 손으로 악기를 타고 있었습니다
  lexicon: HALOT
  rationale: 본문은 악기를 직접 명시하지 않고 ‘손으로’만 적지만, POB의 감사역처럼 문맥상 수금이 전제되므로 이를 보완하되 괄호 표지 없이 ‘수금’으로 옮기고, ביד의 직역성은 ‘손으로’로 보존했습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 옮길지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 직접 음역해 언약적 고유성을 보존하는 것이 이 번역 프로젝트의 기본 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘악한 영’이 하나님 자신에게 도덕적 악을 돌리는 듯 보일 수 있는 문제
  chosen_reading: 야훼께로부터 온 악한 영
  alternative_readings:
  - 야훼께서 보내신 해로운 영
  - 야훼의 악한 영
  rationale: 원문은 영의 기원과 성격을 함께 말할 뿐 하나님의 본성을 악하다고 진술하지 않으므로, ‘께로부터 온’으로 출처를, ‘악한 영’으로 그 작용을 분리해 표현했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
