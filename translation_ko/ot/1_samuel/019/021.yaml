source:
  edition: WLC
  text: וַ/יַּגִּ֣דוּ לְ/שָׁא֗וּל וַ/יִּשְׁלַח֙ מַלְאָכִ֣ים אֲחֵרִ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵ֑מָּה וַ/יֹּ֣סֶף שָׁא֗וּל וַ/יִּשְׁלַח֙ מַלְאָכִ֣ים שְׁלִשִׁ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/021.yaml
  text: When they told Saul[a], he sent other messengers, and they also prophesied. Then Saul again sent a third group of messengers[b], and they also prophesied.
  footnotes:
  - marker: a
    text: Or 'they too prophesied.' The Hebrew emphasizes that this group, like the earlier ones, was likewise overcome.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'third'; that is, Saul sent messengers a third time.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 사울에게 알리자, 사울은 다른 사자들을 보냈고, 그들도 예언했습니다.[a] 사울은 다시 세 번째로 사자들을 보냈으며,[b] 그들도 예언했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그들도 예언했다’라고 하며, 이 사자들도 앞선 자들처럼 예언하게 되었음을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘셋째’입니다. 곧 사울이 세 번째로 사자들을 보냈다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  english_pob_choice: When they told Saul
  chosen_korean: 그들이 사울에게 알리자
  alternatives_korean:
  - 사울에게 전하자
  - 사울에게 보고하자
  lexicon: HALOT
  rationale: נגד의 히필은 ‘알리다/전하다’의 뜻이므로, 한국어에서는 자연스럽게 사울에게 정보가 전달된 상황을 살려 ‘알리자’로 옮겼습니다.
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들
  - 사신들
  lexicon: HALOT
  rationale: 이 문맥의 מַלְאָךְ은 천사가 아니라 인간 전령이므로, 고전적이지만 널리 이해되는 ‘사자들’로 번역했습니다.
- source_word: וַיִּתְנַבְּאוּ
  english_pob_choice: they also prophesied
  chosen_korean: 예언했습니다
  alternatives_korean:
  - 예언하기도 했습니다
  - 예언 상태에 들어갔습니다
  lexicon: HALOT
  rationale: 히트파엘 נבא는 여기서 예언적 현상에 들어감을 가리키므로, 지나친 해석을 피하면서 표준적인 ‘예언했습니다’로 옮겼습니다.
- source_word: שְׁלִשִׁים
  english_pob_choice: a third group of messengers
  chosen_korean: 셋째 무리의 사자들
  alternatives_korean:
  - 세 번째 무리의 사자들
  - 세 번째 사자들을
  lexicon: HALOT
  rationale: שְׁלִשִׁים은 서수적 용법으로 ‘세 번째’ 파견을 뜻하므로, 반복된 파송이라는 문맥을 드러내는 ‘셋째 무리’로 자연화했습니다.
theological_decisions:
- issue: 사울의 사자들이 다시 예언한 현상
  chosen_reading: 행동의 성격을 좁히지 않고 단순히 ‘예언했습니다’로 유지했습니다.
  alternative_readings:
  - 황홀경에 들어갔습니다
  - 예언자처럼 행동했습니다
  rationale: 본문은 그 현상의 정확한 형태를 규정하지 않으므로, 신학적·현상학적 세부를 덧붙이지 않고 히브리어의 넓은 표현을 보존했습니다.
  doctrine_reference: 본문의 범위를 넘는 해석을 보류하고 긴장을 유지합니다.
