base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/013.yaml
  text: Then Michal took the household idol and laid it on the bed[b][a], and she put a cushion of goats’ hair at its head and covered it with the garment.
  footnotes:
  - marker: a
    text: Or 'the teraphim,' 'the household gods,' or 'the image.' The Hebrew term refers to household cult objects; here it appears to function as a single figure in the bed.
    reason: lexical_alternative
  - marker: b
    text: The exact meaning of the Hebrew expression is uncertain; it may refer to a woven goats’ hair covering, net, pillow, or similar item placed at the head.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 미갈이 집안의 우상을 가져다가 침상 위에 놓고, 염소 털로 만든 물건[a]을 그 머리맡에 놓고 옷으로 덮었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 정확한 뜻은 불확실합니다. 염소 털로 만든 직물, 그물, 베개나 머리받침과 비슷한 물건을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  english_pob_choice: the household idol
  chosen_korean: 집안의 우상
  alternatives_korean:
  - 드라빔
  - 집안의 신상
  - 가정의 우상
  lexicon: HALOT
  rationale: תרפים은 가정용 숭배 물건을 가리키므로, 현대 독자가 바로 이해할 수 있도록 ‘집안의 우상’으로 옮겼습니다. 이 장면에서는 단수적 대상으로 기능하므로 한국어도 단수형으로 처리했습니다.
- source_word: אֶל הַמִּטָּה
  english_pob_choice: on the bed
  chosen_korean: 침상에
  alternatives_korean:
  - 침상으로
  - 침상 안에
  - 침대 위에
  lexicon: HALOT
  rationale: שׂוּם과 함께 쓰인 אֶל은 이 문맥에서 단순한 방향이 아니라 ‘올려 놓다/눕히다’의 결과 상태를 나타내므로, 자연스럽게 ‘침상에 눕히고’로 표현했습니다.
- source_word: כְּבִיר הָעִזִּים
  english_pob_choice: a cushion of goats’ hair
  chosen_korean: 염소 털로 만든 덮개
  alternatives_korean:
  - 염소 털 쿠션
  - 염소 털로 만든 방석
  - 염소 털로 만든 베개
  lexicon: HALOT
  rationale: כְּבִיר은 정확한 물건이 불확실한 난해어이므로, 특정 물품명으로 단정하지 않고 ‘염소 털로 만든 덮개’처럼 형태와 재질만 드러내는 쪽을 택했습니다.
- source_word: מְרַאֲשֹׁתָיו
  english_pob_choice: at its head
  chosen_korean: 그 머리 쪽에
  alternatives_korean:
  - 그 머리맡에
  - 그 머리 부분에
  - 머리쪽에
  lexicon: HALOT
  rationale: 표현은 ‘머리맡/머리 쪽’의 위치를 가리키며, 여기서는 침상에 놓인 대상의 머리 위치를 자연스럽게 드러내기 위해 ‘그 머리 쪽에’로 옮겼습니다.
- source_word: בַּבָּגֶד
  english_pob_choice: with the garment
  chosen_korean: 옷으로
  alternatives_korean:
  - 그 옷으로
  - 겉옷으로
  - 덮개로
  lexicon: HALOT
  rationale: בֶּגֶד은 일반적인 ‘옷/의복’이므로, 문맥상 덮어 감추는 수단을 드러내는 ‘옷으로’가 가장 무난합니다.
