  text: וְ/דָוִ֨ד בָּרַ֜ח וַ/יִּמָּלֵ֗ט וַ/יָּבֹ֤א אֶל שְׁמוּאֵל֙ הָ/רָמָ֔תָ/ה וַ/יַּ֨גֶּד ל֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר עָֽשָׂה ל֖/וֹ שָׁא֑וּל וַ/יֵּ֤לֶךְ הוּא֙ וּ/שְׁמוּאֵ֔ל וַ/יֵּשְׁב֖וּ ב/נוית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/018.yaml
  text: Now David fled and escaped[a], and he came to Samuel at Ramah and told him all that Saul had done to him. Then he and Samuel went and stayed at Naioth.
  footnotes:
  - marker: a
    text: Hebrew Naioth is a place name, likely referring to dwellings or a settlement associated with Ramah.
    reason: cultural_note
translation:
  language: ko
  text: 다윗은 도망하여 피신했고, 라마의 사무엘에게 와서 사울이 자기에게 한 모든 일을 그에게 알렸습니다. 그러고 나서 그와 사무엘은 가서 나욧에 머물렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 나욧은 지명으로, 라마와 관련된 거처 또는 정착지를 가리키는 말일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרַח / וַיִּמָּלֵט
  english_pob_choice: fled / escaped
  chosen_korean: 도망하여 피신했고
  alternatives_korean:
  - 도망했고 살아났고
  - 달아나 벗어났고
  lexicon: HALOT
  rationale: 두 동사는 함께 ‘급히 달아남’과 ‘위기에서 벗어남’을 겹쳐 말하므로, 한국어에서는 중복을 피하면서도 결과를 살려 ‘도망하여 피신했고’로 옮겼습니다.
- source_word: הָרָמָתָה
  english_pob_choice: at Ramah
  chosen_korean: 라마의 사무엘에게
  alternatives_korean:
  - 라마에서 사무엘에게
  - 사무엘이 있는 라마로
  lexicon: HALOT
  rationale: 방향성 있는 목적지이지만, 서술의 중심은 ‘사무엘에게 왔다’는 점이므로 한국어에서는 소유·소속 관계를 드러내는 ‘라마의 사무엘’이 가장 자연스럽습니다.
- source_word: וַיַּגֶּד לוֹ אֵת כָּל אֲשֶׁר עָשָׂה לוֹ שָׁאוּל
  english_pob_choice: told him all that Saul had done to him
  chosen_korean: 사울이 자기에게 한 모든 일을 그에게 알렸습니다
  alternatives_korean:
  - 사울이 자기에게 한 모든 일을 이야기했습니다
  - 사울이 자기에게 한 일을 낱낱이 말했습니다
  lexicon: HALOT
  rationale: נגד의 보고/전달 의미를 살려 ‘알렸습니다’로 옮겼고, כָּל אֲשֶׁר의 포괄성을 ‘모든 일’로 보존했습니다.
- source_word: וַיֵּשְׁבוּ בְנוָיֹות
  english_pob_choice: stayed at Naioth
  chosen_korean: 나욧에 머물렀습니다
  alternatives_korean:
  - 나욧에 거주했습니다
  - 나욧에서 지냈습니다
  lexicon: HALOT
  rationale: 여기서의 ‘앉다/거주하다’는 여행 서술 속 체류를 뜻하므로, 현대 한국어에서는 ‘머물렀습니다’가 가장 정확하고 자연스럽습니다.
