  lexicon: HALOT
  rationale: 히브리어의 맹세 공식은 문자적으로 ‘살아 계시는 한’이라는 생동하는 서원을 담고 있으므로, 한국어에서도 맹세의 공식성을 살려 옮겼습니다.
- source_word: אִם יוּמָת
  english_pob_choice: he shall not be put to death
  chosen_korean: 그는 죽지 않을 것입니다
  alternatives_korean:
