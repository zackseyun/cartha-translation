  - 그가 죽임을 당하지 않을 것입니다
  - 그는 죽임을 당하지 않을 것입니다
  lexicon: HALOT
  rationale: 맹세문에서 ‘if’가 생략적 부정으로 기능한다는 POB의 주석을 반영하여, 조건문이 아니라 강한 부정을 분명히 드러냈습니다.
theological_decisions:
