base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/006.yaml
  text: Saul listened to Jonathan’s voice[a], and Saul swore, “As Yahweh lives, he shall not be put to death.”
  footnotes:
  - marker: a
    text: 'Hebrew oath formula: ''As the LORD lives, if he is put to death ...'' The particle ''if'' here is elliptical and conveys a strong negation: ''he shall certainly not be put to death.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 사울은 요나단의 목소리를 들었고[a], 사울은 맹세하며 말했습니다. "야훼께서 살아 계시는 한, 그는 죽지 않을 것입니다."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 맹세 공식은 문자적으로 ‘야훼께서 살아 계시는 한, 그가 죽임을 당하면…’의 꼴이지만, 여기의 ‘if’는 생략된 강한 부정으로 기능하여 ‘그는 반드시 죽지 않을 것입니다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: listened
  chosen_korean: 들었고
  alternatives_korean:
  - 들었습니다
  - 귀를 기울였습니다
  - 순종했습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 청취보다 요나단의 호소를 받아들이는 반응이므로, ‘들었습니다’보다 약간 더 적극적인 ‘들었고’로 연결했습니다.
- source_word: בְּקוֹל
  english_pob_choice: to Jonathan’s voice
  chosen_korean: 요나단의 목소리를
  alternatives_korean:
  - 요나단에게
  - 요나단의 음성을
  - 요나단의 말에
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘~의 목소리를 듣다’의 표현을 살리면서도 한국어로 자연스럽게 읽히도록 ‘요나단의 목소리를’로 옮겼습니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서 살아 계시는 한
  alternatives_korean:
  - 야훼의 삶을 두고
  - 야훼께서 살아 계심을 두고
  - 야훼께서 살아 계시듯
  lexicon: HALOT
  rationale: 히브리어의 맹세 공식은 문자적으로 ‘살아 계시는 한’이라는 생동하는 서원을 담고 있으므로, 한국어에서도 맹세의 공식성을 살려 옮겼습니다.
- source_word: אִם יוּמָת
  english_pob_choice: he shall not be put to death
  chosen_korean: 그는 죽지 않을 것입니다
  alternatives_korean:
  - 그는 반드시 죽지 않을 것입니다
  - 그가 죽임을 당하지 않을 것입니다
  - 그는 죽임을 당하지 않을 것입니다
  lexicon: HALOT
  rationale: 맹세문에서 ‘if’가 생략적 부정으로 기능한다는 POB의 주석을 반영하여, 조건문이 아니라 강한 부정을 분명히 드러냈습니다.
theological_decisions:
