base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/006.yaml
  text: Saul listened to Jonathan’s voice[a], and Saul swore, “As Yahweh lives, he shall not be put to death.”
  footnotes:
  - marker: a
    text: 'Hebrew oath formula: ''As the LORD lives, if he is put to death ...'' The particle ''if'' here is elliptical and conveys a strong negation: ''he shall certainly not be put to death.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 사울은 요나단의 말을 듣고[a], 맹세했습니다. “야훼께서 살아 계심을 두고 맹세합니다. 그는 결코 죽임을 당하지 않을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 맹세 공식은 직역하면 ‘야훼께서 살아 계심을 두고, 그가 죽임을 당한다면 …’입니다. 여기서 ‘만일’에 해당하는 표현은 맹세문에서 생략된 강한 부정을 나타내므로, ‘그는 결코 죽임을 당하지 않을 것입니다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
