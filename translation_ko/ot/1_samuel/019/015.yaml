  text: וַ/יִּשְׁלַ֤ח שָׁאוּל֙ אֶת הַ/מַּלְאָכִ֔ים לִ/רְא֥וֹת אֶת דָּוִ֖ד לֵ/אמֹ֑ר הַעֲל֨וּ אֹת֧/וֹ בַ/מִּטָּ֛ה אֵלַ֖/י לַ/הֲמִתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/015.yaml
  text: Then Saul sent the messengers to see David[a], saying, “Bring him up to me in the bed, so that I may put him to death.”
  footnotes:
  - marker: a
    text: Or “on the bed” or “with the bed.” The Hebrew preposition can be understood in more than one way; Saul's command likely means that David was to be carried as he lay.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울은 사자들을 보내어 다윗을 살피게 하고 말했습니다. “그를 침상에 있는 채로 내게로 데려오너라. 내가 그를 죽이겠다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “침상에 있는 채로”는 ‘침상 위에’ 또는 ‘침상째로’라고도 이해할 수 있습니다. 히브리어 전치사 ב는 여기서 관계를 하나로 확정하기 어려우며, 다윗이 누워 있던 상태로 옮겨지라는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: Then Saul sent
  chosen_korean: 그때 사울이 ... 보내어
  alternatives_korean:
  - 그리고 사울이 ... 보냈습니다
  - 사울이 ... 보냈습니다
  lexicon: HALOT
  rationale: 와우-연속형의 서사 진행을 한국어에서는 ‘그때’로 자연스럽게 살려 앞선 사건과의 시간적 연결을 드러냈습니다.
- source_word: הַמַּלְאָכִים
  english_pob_choice: the messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들
  - 메신저들
  lexicon: HALOT
  rationale: 궁정 서사에서 파견된 사람들을 가리키므로 ‘사자들’이 문맥상 자연스럽고, 초자연적 천사로 오해되지 않도록 했습니다.
- source_word: לִרְאוֹת
  english_pob_choice: to see
  chosen_korean: 살피게 하고
  alternatives_korean:
  - 보게 하고
  - 확인하게 하고
  lexicon: HALOT
  rationale: 단순한 시각 행위보다 다윗의 상태를 확인하려는 목적이 강하므로, 본문의 의미를 과도하게 확대하지 않는 범위에서 ‘살피게 하고’로 옮겼습니다.
- source_word: בַמִּטָּה
  english_pob_choice: in the bed / on the bed / with the bed
  chosen_korean: 침상에
  alternatives_korean:
  - 침대에
  - 침상 위에
  - 침상째로
  lexicon: HALOT
  rationale: 히브리어 전치사 ב의 의미 범위가 넓어 ‘침상에’로 두어, 다윗이 누운 채로 옮겨지게 하려는 뉘앙스를 문맥에 맞게 살렸습니다.
theological_decisions:
- issue: 왕의 살해 명령의 직설성
  chosen_reading: “내가 그를 죽이겠다”
  alternative_readings:
  - “그를 죽이겠다”
  - “그를 죽여 없애겠다”
  rationale: 사울의 의도를 완곡하게 누그러뜨리지 않고, 왕의 직접 명령이 가진 폭력성과 긴박함을 그대로 드러냈습니다.
  doctrine_reference: 본문 서술의 직설성 유지
