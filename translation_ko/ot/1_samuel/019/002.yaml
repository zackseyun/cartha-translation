  yaml_path: translation/ot/1_samuel/019/002.yaml
  text: Jonathan told David[a], saying, “Saul my father is seeking to kill you. So now, please be on your guard in the morning, and stay in a secret place and hide yourself.”
  footnotes:
  - marker: a
    text: Or 'remain in secret' / 'stay in hiding.' The Hebrew combines 'stay' with a noun meaning 'secret' or 'hiding place,' followed by 'hide yourself' for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 요나단이 다윗에게 이렇게 알렸습니다. 「사울, 내 아버지가 너를 죽이려고 찾고 있습니다. 그러니 이제 아침에 부디 조심하고, 숨은 곳에 머물며 자신을 숨기십시오.[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘숨은 곳에 머무르다’라고 한 뒤, 다시 ‘자신을 숨기다’를 덧붙여 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  english_pob_choice: told
  chosen_korean: 알리며 말했습니다
  alternatives_korean:
  - 말했습니다
  - 전했습니다
  - 일러주었습니다
  lexicon: HALOT
  rationale: נגד의 히필은 단순히 정보를 전달하는 뜻이므로, 다윗에게 긴급한 소식을 전하는 상황을 살려 자연스럽게 표현했습니다.
- source_word: מְבַקֵּשׁ
  english_pob_choice: is seeking
  chosen_korean: 찾고 있습니다
  alternatives_korean:
  - 구하고 있습니다
  - 찾아내려고 하고 있습니다
  lexicon: HALOT
  rationale: 진행 중인 의도를 드러내기 위해 현재 진행형을 살렸고, 위협 상황에서는 '찾다'가 가장 직접적입니다.
- source_word: הִשָּׁמֶר נָא
  english_pob_choice: please be on your guard
  chosen_korean: 부디 조심하고
  alternatives_korean:
  - 부디 경계하고
  - 부디 자신을 지키고
  lexicon: HALOT
  rationale: 반사적 뉘앙스의 שמר을 한국어 관용에 맞게 옮겼으며, נָא는 공손한 요청의 '부디'로 반영했습니다.
- source_word: בַסֵּתֶר
  english_pob_choice: in a secret place
  chosen_korean: 숨은 곳에
  alternatives_korean:
  - 은밀한 곳에
  - 비밀스러운 곳에
  - 숨을 곳에
  lexicon: HALOT
  rationale: סֵתֶר는 단순한 추상적 '비밀'이 아니라 숨어 있는 장소의 뜻이 강하므로, 장소성을 살린 표현을 택했습니다.
- source_word: וְנַחְבֵּאתָ
  english_pob_choice: hide yourself
  chosen_korean: 자신을 숨기십시오
  alternatives_korean:
  - 몸을 숨기십시오
  - 스스로 숨으십시오
  lexicon: HALOT
  rationale: 뒤의 동사가 앞 구절을 강조하므로, 동일한 의미를 반복하되 한국어에서는 명령의 강도를 살려 재표현했습니다.
theological_decisions:
- issue: Direct warning speech within narrative
  chosen_reading: 요나단의 긴급 경고를 그대로 전달하기 위해 대화체 명령형을 유지했습니다.
  alternative_readings:
  - 완곡한 설명문으로 바꾸기
  - 서술형으로 완화하기
  rationale: 본문은 실제로 다윗에게 즉각적인 회피를 촉구하는 말이므로, 명령의 긴박함을 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 본문-의미 보존 원칙
