  - severity: low
    issue: 각주 표지가 해당 어휘에 연결되어 있지 않음
    rationale: 각주는 각각 ‘목숨을 걸고’, ‘큰 구원’, ‘까닭 없이’에 붙여 독자가 각주의 적용 대상을 즉시 알 수 있도록 해야 합니다.
