source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ אֶת נַפְשׁ֨/וֹ בְ/כַפּ֜/וֹ וַ/יַּ֣ךְ אֶת הַ/פְּלִשְׁתִּ֗י וַ/יַּ֨עַשׂ יְהוָ֜ה תְּשׁוּעָ֤ה גְדוֹלָה֙ לְ/כָל יִשְׂרָאֵ֔ל רָאִ֖יתָ וַ/תִּשְׂמָ֑ח וְ/לָ֤/מָּה תֶֽחֱטָא֙ בְּ/דָ֣ם נָקִ֔י לְ/הָמִ֥ית אֶת דָּוִ֖ד חִנָּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/005.yaml
  text: For he put his life in his hand and struck down the Philistine[a], and Yahweh brought about a great salvation for all Israel. You saw it and rejoiced[c][b]. So why should you sin against innocent blood by putting David to death for no reason?
  footnotes:
  - marker: a
    text: Or, “he risked his life,” literally, “he put his life in his hand.”
    reason: lexical_alternative
  - marker: b
    text: “A great salvation” may also be rendered “a great victory” or “great deliverance.”
    reason: lexical_alternative
  - marker: c
    text: Or, “without cause.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 목숨을 걸고[a] 블레셋 사람을 쳐서 쓰러뜨렸으며, 야훼께서 온 이스라엘을 위해 큰 구원[b]을 이루셨습니다. 왕께서는 그것을 보시고 기뻐하셨습니다. 그런데 어찌하여 무고한 피를 흘리는 죄를 지어, 다윗을 까닭 없이[c] 죽이시려 하십니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자기 목숨을 자기 손바닥에 두고’입니다. 이는 목숨을 걸고 위험을 무릅썼다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 구원’은 문맥상 ‘큰 승리’ 또는 ‘큰 구출’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘까닭 없이’는 ‘이유 없이’, ‘무고하게’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֶת־נַפְשׁוֹ בְכַפּוֹ
  english_pob_choice: he put his life in his hand
  chosen_korean: 자기 목숨을 손바닥에 걸고
  alternatives_korean:
  - 목숨을 걸고
  - 자기 생명을 손에 넣고
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하면 ‘자기 생명을 자기 손바닥/손에 두다’이므로, 한국어에서는 위험을 분명히 드러내면서도 이미지를 살리는 표현이 필요합니다.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי
  english_pob_choice: struck down the Philistine
  chosen_korean: 블레셋 사람을 쳤으며
  alternatives_korean:
  - 블레셋 사람을 쓰러뜨렸으며
  - 블레셋 사람을 죽였으며
  lexicon: HALOT
  rationale: נכה는 여기서 다윗이 적을 격파하여 죽음에 이르게 한 행위를 가리키므로, 단순한 ‘죽였다’보다 동작성과 전투 맥락을 살린 ‘쳤으며’가 적절합니다.
- source_word: וַיַּעַשׂ יְהוָה תְּשׁוּעָה גְדוֹלָה
  english_pob_choice: Yahweh brought about a great salvation
  chosen_korean: 야훼께서 … 큰 구원을 이루셨습니다
  alternatives_korean:
  - 야훼께서 … 큰 승리를 이루셨습니다
  - 야훼께서 … 큰 구출을 이루셨습니다
  lexicon: HALOT
  rationale: תְּשׁוּעָה는 전투 맥락의 승리/구출을 포함하면서도 더 넓은 구원 의미를 지니므로, POB의 ‘salvation’에 맞춰 ‘구원’으로 옮겼습니다.
- source_word: בְּדָם נָקִי
  english_pob_choice: against innocent blood
  chosen_korean: 무죄한 피에 대하여
  alternatives_korean:
  - 무죄한 피를 흘리며
  - 무죄한 피의 죄를 지어
  lexicon: HALOT
  rationale: 이 표현은 혈죄 개념을 가리키므로, 한국어에서도 משפט적·윤리적 뉘앙스를 유지하는 ‘무죄한 피에 대하여’로 옮겼습니다.
- source_word: חִנָּם
  english_pob_choice: for no reason
  chosen_korean: 이유 없이
  alternatives_korean:
  - 까닭 없이
  - 무고하게
  lexicon: HALOT
  rationale: חִנָּם은 ‘까닭 없이/값없이’의 뜻이므로, 현대 독자가 바로 이해할 수 있는 ‘이유 없이’를 선택했습니다.
theological_decisions:
- issue: 여호와 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 신명기적 고유명사 יְהוָה가 직접 나오므로, 본 프로젝트 기본 원칙에 따라 칭호 대신 고유명사 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: תְּשׁוּעָה의 의미 범위
  chosen_reading: 큰 구원
  alternative_readings:
  - 큰 승리
  - 큰 구출
  rationale: 문맥은 전투 승리이지만, 히브리어 어휘가 지닌 더 넓은 구원·해방의 의미를 보존하는 것이 더 원문 충실적입니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
