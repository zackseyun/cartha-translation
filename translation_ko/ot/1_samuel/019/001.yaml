id: 1SA.19.1
reference: 1 Samuel 19:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר שָׁא֗וּל אֶל יוֹנָתָ֤ן בְּנ/וֹ֙ וְ/אֶל כָּל עֲבָדָ֔י/ו לְ/הָמִ֖ית אֶת דָּוִ֑ד וִ/יהֽוֹנָתָן֙ בֶּן שָׁא֔וּל חָפֵ֥ץ בְּ/דָוִ֖ד מְאֹֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/001.yaml
  text: Saul spoke to Jonathan his son and to all his servants to put David to death[b][a], but Jonathan son of Saul delighted greatly in David.
  footnotes:
  - marker: a
    text: Or, 'to kill David.' The Hebrew verb is causative ('put to death'), but in context the sense is straightforwardly that Saul was speaking of David's death.
    reason: lexical_alternative
  - marker: b
    text: Or, 'was very fond of David' or 'loved David greatly.' The Hebrew says Jonathan 'took great delight in' David.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 자기 아들 요나단과 자기의 모든 종들에게 다윗을 죽이려고 말했습니다. 그러나 사울의 아들 요나단은 다윗을 매우 기뻐했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이야기했습니다
  - 말하였습니다
  lexicon: HALOT
  rationale: נarrative 동사 דבר의 기본 의미를 자연스러운 현대 한국어 서술로 옮겼습니다. 직접 명령이 아니라 발화 내용 소개이므로 ‘말했습니다’가 가장 무리 없습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 자기의 모든 종들
  alternatives_korean:
  - 그의 신하들
  - 그의 시종들
  lexicon: HALOT
  rationale: 왕궁 맥락의 공적 인물을 가리킬 수 있지만, 원문은 עבד를 사용하므로 기본값인 ‘종들’을 살렸습니다. ‘모든’은 כָּל을 반영합니다.
- source_word: לְהָמִית אֶת דָּוִד
  english_pob_choice: to put David to death
  chosen_korean: 다윗을 죽이려고
  alternatives_korean:
  - 다윗을 죽이도록
  - 다윗을 사형에 처하려고
  lexicon: HALOT
  rationale: המית의 사역적 뉘앙스를 한국어에서 가장 자연스럽게 드러내는 표현으로 옮겼습니다. 절의 흐름상 목적/의도를 나타내는 부사절이 적절합니다.
- source_word: חָפֵץ בְּדָוִד מְאֹד
  english_pob_choice: delighted greatly in David
  chosen_korean: 다윗을 매우 기뻐했습니다
  alternatives_korean:
  - 다윗을 매우 좋아했습니다
  - 다윗을 매우 사랑했습니다
  lexicon: HALOT
  rationale: חפץ는 ‘기뻐하다/즐거워하다/마음에 들어 하다’의 의미가 있어, אהב(사랑하다)보다 약한 호감을 구분하기 위해 ‘기뻐했습니다’를 택했습니다. מְאֹד는 ‘매우’로 반영했습니다.
theological_decisions:
- issue: Jonathan의 다윗에 대한 태도 표현
  chosen_reading: ‘다윗을 매우 기뻐했습니다’로 옮겨, 감정의 강도는 살리되 ‘사랑했습니다’로 확대하지 않았습니다.
  alternative_readings:
  - 다윗을 매우 사랑했습니다
  - 다윗을 매우 좋아했습니다
  rationale: 원문은 חפץ를 사용해 기쁨/호감을 나타내므로, 이후 본문에 나타나는 אהב와 구별되는 어휘적 긴장을 보존하는 것이 좋습니다.
  doctrine_reference: 문맥적 어휘 구별
