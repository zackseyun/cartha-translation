  naturalness: ‘그들이 예언자들의 무리를 보고 있는데’는 현대 표준어 문장으로 다소 어색하며, 무엇을 보았는지가 불완전하게 들립니다. ‘…것을 보았습니다’로 병렬된 관찰 내용을 명시하면 자연스럽습니다.
  terminology: ‘사자들’, ‘붙잡게 하려고’, ‘예언자들의 무리’, ‘하나님의 영’, ‘예언했습니다’는 문맥과 합쇼체에 적절합니다. ‘하나님의 성령’처럼 후대의 더 특정한 교리 용어로 바꿀 필요는 없습니다.
