reference: 1 Samuel 19:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח שָׁא֣וּל מַלְאָכִים֮ לָ/קַ֣חַת אֶת דָּוִד֒ וַ/יַּ֗רְא אֶֽת לַהֲקַ֤ת הַ/נְּבִיאִים֙ נִבְּאִ֔ים וּ/שְׁמוּאֵ֕ל עֹמֵ֥ד נִצָּ֖ב עֲלֵי/הֶ֑ם וַ/תְּהִ֞י עַֽל מַלְאֲכֵ֤י שָׁאוּל֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/020.yaml
  text: Then Saul sent messengers to seize David[a]. When they saw the company of prophets prophesying, with Samuel standing over them, the Spirit of God came upon Saul’s messengers[b], and they also prophesied.
  footnotes:
  - marker: a
    text: Or 'band of prophets.' The Hebrew term refers to a gathered group or company.
    reason: lexical_alternative
  - marker: b
    text: Or 'standing among them'; the Hebrew may also suggest Samuel was positioned over them in a leading or supervisory role.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울이 다윗을 붙잡게 하려고 사자들을 보냈습니다. 그들이 예언자들의 무리를 보고 있는데, 사무엘이 그들 위에 서 있었습니다. 하나님의 영이 사울의 사자들에게 임하니, 그들도 예언하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예언자들의 무리’입니다. 히브리어는 모인 집단을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들 가운데 서 있었습니다’입니다. 히브리어는 사무엘의 위치를 인도적·감독적 위치로도 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים / מַלְאֲכֵי
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들
  - 보냄을 받은 이들
  lexicon: HALOT
  rationale: 여기서는 천사가 아니라 사울이 보낸 인간 심부름꾼이므로, 한국어에서는 기능을 드러내는 ‘사자들’이 자연스럽고 간결합니다.
- source_word: לָקַחַת
  english_pob_choice: to seize
  chosen_korean: 붙잡게 하려고
  alternatives_korean:
  - 잡으려고
  - 체포하려고
  lexicon: HALOT
  rationale: 단순한 ‘가져가다’보다 적대적 의도를 드러내야 하므로, 다윗을 강제로 붙잡으려는 뜻을 살려 번역했습니다.
- source_word: לַהֲקַת הַנְּבִיאִים
  english_pob_choice: the company of prophets
  chosen_korean: 예언자들의 무리
  alternatives_korean:
  - 예언자들의 떼
  - 예언자들의 모임
  lexicon: HALOT
  rationale: 히브리어는 모인 집단을 가리키므로, 지나치게 교회적이지 않게 ‘무리’로 옮겨 군집성과 서술적 성격을 살렸습니다.
- source_word: עֹמֵד נִצָּב עֲלֵיהֶם
  english_pob_choice: standing over them
  chosen_korean: 그들 위에 서 있었습니다
  alternatives_korean:
  - 그들 가운데 서 있었습니다
  - 그들을 감독하듯 서 있었습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 위치보다 위에서 지켜보거나 이끄는 뉘앙스가 있어 ‘위에 서 있다’를 유지했습니다.
- source_word: רוּחַ אֱלֹהִים
  english_pob_choice: the Spirit of God
  chosen_korean: 하나님의 영
  alternatives_korean:
  - 하나님의 성령
  - 하나님에게서 온 영
  lexicon: HALOT
  rationale: 원문은 신적 영의 임재를 말하지만, 여기서는 성령이라는 후대 교리 용어보다 서술에 맞는 ‘하나님의 영’이 더 직접적입니다.
theological_decisions:
- issue: 사울의 사자들에게 임한 רוח אֱלֹהים의 성격
  chosen_reading: 하나님의 영이 그들에게 임해 예언하게 하시는 하나님의 주권적 개입으로 옮겼습니다.
  alternative_readings:
  - 하나님에게서 온 영이 임했다는 더 비인격적 표현
  - 단순한 종교적 황홀경으로 축소하는 읽기
  rationale: 사무엘상 문맥에서 이는 인간 계획을 꺾고 예언을 일으키는 하나님의 직접적 역사로 제시되므로, 그 신적 주도권을 약화시키지 않았습니다.
  doctrine_reference: Translation philosophy §3; 사무엘상 10:10-11의 평행 본문
