source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ שָׁ֔ם אֶל נוית בָּ/רָמָ֑ה וַ/תְּהִי֩ עָלָ֨י/ו גַּם ה֜וּא ר֣וּחַ אֱלֹהִ֗ים וַ/יֵּ֤לֶךְ הָלוֹךְ֙ וַ/יִּתְנַבֵּ֔א עַד בֹּא֖/וֹ ב/נוית בָּ/רָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/023.yaml
  text: So he went there[a], to Naioth in Ramah, and the Spirit of God came upon him also; and he went on, prophesying[b], until he came to Naioth in Ramah.
  footnotes:
  - marker: a
    text: Or “Naioth at Ramah.”
    reason: lexical_alternative
  - marker: b
    text: Or “the spirit of God was upon him.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그곳, 곧 라마에 있는 나욧으로 갔습니다.[a] 하나님의 영이 그에게도 임했습니다.[b] 그는 예언하면서 라마에 있는 나욧에 이를 때까지 계속 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “라마의 나욧”.
    reason: lexical_alternative
  - marker: b
    text: 또는 “하나님의 영이 그에게도 있었다”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/יֵּ֣לֶךְ שָׁ֔ם אֶל נוית בָּ/רָמָ֑ה
  english_pob_choice: So he went there, to Naioth in Ramah
  chosen_korean: 그는 거기, 라마의 나욧으로 갔습니다
  alternatives_korean:
  - 그는 거기, 라마의 나욧에 갔습니다
  - 그는 거기, 라마에 있는 나욧으로 갔습니다
  lexicon: HALOT
  rationale: 지명 נוית בָּרָמָה는 고유명사로 음역하고, ב+지명은 문맥상 출발점/소속보다 목적지 표지로 자연스럽게 옮겼습니다. 영어 POB의 'there'도 반영해 '거기'를 유지했습니다.
- source_word: וַ/תְּהִי֩ עָלָ֨י/ו גַּם ה֜וּא ר֣וּחַ אֱלֹהִ֗ים
  english_pob_choice: and the Spirit of God came upon him also
  chosen_korean: 하나님의 영이 그에게도 임하자
  alternatives_korean:
  - 하나님의 영이 그 위에 있었고
  - 하나님의 영이 그에게도 임하여
  lexicon: HALOT
  rationale: היה על + 인칭대명사는 한국어에서 '임하다'가 가장 자연스럽고, 영어 POB의 'came upon him'과도 잘 대응합니다. '하나님의 영'은 이 서사에서 하나님의 능동적 임재를 가리키는 것으로 읽었습니다.
- source_word: וַ/יִּתְנַבֵּ֔א
  english_pob_choice: prophesying
  chosen_korean: 계속 예언했습니다
  alternatives_korean:
  - 예언하면서 갔습니다
  - 예언하였습니다
  lexicon: HALOT
  rationale: נבא는 여기서 예언 행위를 뜻하므로 '예언하다'를 사용했습니다. 앞의 지속 표현 וַיֵּלֶךְ הָלוֹךְ을 반영해 '계속'을 넣어 진행성을 살렸습니다.
- source_word: עַד בֹּא֖/וֹ ב/נוית בָּ/רָמָֽה
  english_pob_choice: until he came to Naioth in Ramah
  chosen_korean: 라마의 나욧에 이르기까지
  alternatives_korean:
  - 그가 라마의 나욧에 올 때까지
  - 나욧에 도착할 때까지
  lexicon: HALOT
  rationale: עַד + 부정사구는 시간 종결을 나타내므로 '이르기까지'로 옮겼습니다. 같은 지명을 반복해 종착점을 분명히 했습니다.
theological_decisions:
- issue: רוּחַ אֱלֹהִים을 '성령'으로 특정할지, '하나님의 영'으로 옮길지
  chosen_reading: 하나님의 영
  alternative_readings:
  - 성령
  - 하나님의 성령
  rationale: 본문은 사울 서사에서 하나님의 영의 임재를 말하지만, 문맥이 삼위일체적 전문용어를 요구하는 것은 아니므로 원문 표현을 직접 살린 '하나님의 영'을 유지했습니다. 이는 서사적 긴장과 표현의 폭을 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: וַיִּתְנַבֵּא의 의미를 '예언하다'로만 둘지, 광란적/행동적 뉘앙스를 덧붙일지
  chosen_reading: 계속 예언했습니다
  alternative_readings:
  - 예언하며 달려갔습니다
  - 예언자처럼 행동했습니다
  - 예언에 빠졌습니다
  rationale: 본문은 사울이 어떤 양상으로 예언했는지 설명하지 않으므로, 추측적 심리 묘사를 덧붙이지 않고 단순히 '예언했습니다'로 유지했습니다. 이렇게 해야 본문의 모호성과 신학적 긴장을 보존할 수 있습니다.
  doctrine_reference: Translation philosophy §3
