base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/022.yaml
  text: He too went to Ramah[a], and he came as far as the great well that is at Seku. He asked and said, “Where are Samuel and David?” And one said, “Look[b], they are at Naioth in Ramah.”
  footnotes:
  - marker: a
    text: Or 'the large cistern' or 'the great pit' for 'the great well' (בּוֹר הַגָּדוֹל).
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'And he said'; the subject of the reply is unspecified, so the translation supplies 'one' for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그도 라마로 가서, 세쿠에 있는 큰 우물[a]에까지 이르렀습니다. 그는 묻고 말했습니다. 「사무엘과 다윗이 어디 있습니까?」 그러자 한 사람[b]이 말했습니다. 「보십시오, 그들은 라마의 나욧에 있습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘큰 우물’에 해당하는 히브리어 בּוֹר הַגָּדוֹל은 ‘큰 저수조’ 또는 ‘큰 구덩이’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단순히 ‘그가 말했다’로 되어 있으나, 응답 화자가 분명히 드러나지 않으므로 한국어에서는 ‘한 사람이’로 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָמָתָה
  english_pob_choice: to Ramah
  chosen_korean: 라마로
  alternatives_korean:
  - 라마에
  - 라마 쪽으로
  lexicon: HALOT
  rationale: 방향성을 나타내는 המקום 부정관용구이므로, 단순 위치가 아니라 이동 방향을 드러내는 조사 ‘-로’를 택했습니다.
- source_word: בּוֹר הַגָּדוֹל
  english_pob_choice: the great well
  chosen_korean: 큰 우물
  alternatives_korean:
  - 큰 물웅덩이
  - 큰 웅덩이
  - 큰 저수지
  lexicon: HALOT
  rationale: בּוֹר는 문맥에 따라 구덩이·저수조·우물로 갈릴 수 있으나, POB가 지시물적 랜드마크로 읽어 ‘well’을 택한 점을 따라 한국어에서는 자연스러운 ‘우물’로 옮겼습니다.
- source_word: וַיִּשְׁאַל וַיֹּאמֶר
  english_pob_choice: He asked and said
  chosen_korean: 그는 묻고 말했습니다
  alternatives_korean:
  - 그는 묻고 이르렀습니다
  - 그는 물으며 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 동사 연쇄를 살리되, 한국어에서는 ‘묻고 말했습니다’가 질문-직접화법 도입의 순서를 가장 자연스럽게 보존합니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 대답을 지시적으로 이끄는 감탄/지시 표현을 현대 합쇼체의 주의 환기 표현으로 살렸습니다.
- source_word: בנוית בָּרָמָה
  english_pob_choice: at Naioth in Ramah
  chosen_korean: 라마의 나욧에
  alternatives_korean:
  - 라마 안의 나욧에
  - 라마에 있는 나욧에
  lexicon: HALOT
  rationale: 고유명사 나욧을 음역하고, 소속·위치 관계는 한국어의 소유/귀속 표현 ‘라마의’로 자연스럽게 표시했습니다.
