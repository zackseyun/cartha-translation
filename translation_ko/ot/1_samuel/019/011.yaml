source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ שָׁא֨וּל מַלְאָכִ֜ים אֶל בֵּ֤ית דָּוִד֙ לְ/שָׁמְר֔/וֹ וְ/לַ/הֲמִית֖/וֹ בַּ/בֹּ֑קֶר וַ/תַּגֵּ֣ד לְ/דָוִ֗ד מִיכַ֤ל אִשְׁתּ/וֹ֙ לֵ/אמֹ֔ר אִם אֵ֨ינְ/ךָ֜ מְמַלֵּ֤ט אֶֽת נַפְשְׁ/ךָ֙ הַ/לַּ֔יְלָה מָחָ֖ר אַתָּ֥ה מוּמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/011.yaml
  text: Then Saul sent messengers to David’s house to watch him and to kill him in the morning. And Michal his wife told David[a], saying, “If you do not save your life tonight, tomorrow you will be put to death.”
  footnotes:
  - marker: a
    text: Or, “If you do not escape with your life tonight, tomorrow you will be put to death.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울은 사람들을 다윗의 집으로 보내어 그를 감시하게 하고 아침에 그를 죽이게 하였습니다. 다윗의 아내 미갈이 다윗에게 알려 주며 말했습니다. “오늘 밤에 자기 목숨을 구하지 않으면, 내일은 당신이 죽게 됩니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “오늘 밤에 목숨을 건져 내지 않으면, 내일은 당신이 죽게 됩니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사람들을
  alternatives_korean:
  - 사자들을
  - 전령들을
  lexicon: HALOT
  rationale: 사울이 보낸 인간 심부름꾼들을 가리키므로, 자연스러운 현대 한국어로는 중립적인 ‘사람들을’이 가장 직접적입니다.
- source_word: לְשָׁמְרוֹ
  english_pob_choice: to watch him
  chosen_korean: 감시하게 하고
  alternatives_korean:
  - 지키게 하고
  - 살피게 하고
  lexicon: HALOT
  rationale: 문맥이 보호가 아니라 적대적 감시이므로, 보호적 뉘앙스의 ‘지키다’보다 ‘감시하다’가 원문의 의도를 더 분명히 드러냅니다.
- source_word: וְלַהֲמִיתוֹ
  english_pob_choice: to kill him
  chosen_korean: 죽이게 하고
  alternatives_korean:
  - 죽게 하고
  - 목숨을 빼앗게 하고
  lexicon: HALOT
  rationale: 사울의 부하들이 직접 살해하려는 뜻이므로, 현대 한국어에서 직설적이고 분명한 ‘죽이다’가 적절합니다.
- source_word: מְמַלֵּט אֶת נַפְשְׁךָ
  english_pob_choice: save your life
  chosen_korean: 자기 목숨을 구하지 않으면
  alternatives_korean:
  - 당신의 목숨을 구하지 않으면
  - 목숨을 건져 내지 않으면
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘자기 생명/목숨을 건지다’의 뜻이므로, 이를 자연스럽게 풀어 ‘자기 목숨을 구하다’로 옮겼습니다.
theological_decisions:
- issue: 미갈의 경고문에서 직접화법의 긴박한 경고를 어떻게 살릴지
  chosen_reading: ‘오늘 밤… 내일은… 죽게 됩니다’로 시간 대비와 필연성을 분명히 드러냈습니다.
  alternative_readings:
  - ‘오늘 밤… 내일은… 죽임을 당합니다’
  - ‘오늘 밤… 내일은… 죽을 것입니다’
  rationale: 원문은 생명 위협의 즉각성과 확정성을 강조하므로, 예의 있는 합쇼체 안에서도 경고의 압박감을 유지하는 표현이 필요합니다.
  doctrine_reference: 서사 본문의 직접적 위협 진술은 완곡화하지 않고 문맥상 강도를 보존해야 함
