source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל כֹּֽה תֹאמְר֣וּ לְ/דָוִ֗ד אֵֽין חֵ֤פֶץ לַ/מֶּ֨לֶךְ֙ בְּ/מֹ֔הַר כִּ֗י בְּ/מֵאָה֙ עָרְל֣וֹת פְּלִשְׁתִּ֔ים לְ/הִנָּקֵ֖ם בְּ/אֹיְבֵ֣י הַ/מֶּ֑לֶךְ וְ/שָׁא֣וּל חָשַׁ֔ב לְ/הַפִּ֥יל אֶת דָּוִ֖ד בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/025.yaml
  text: Then Saul said[a], “Thus you shall say to David, ‘The king has no desire for a bride-price except a hundred Philistine foreskins[c][b], to take vengeance on the king’s enemies.’” Now Saul intended to make David fall by the hand of the Philistines.
  footnotes:
  - marker: a
    text: Or “but only a hundred foreskins of the Philistines.”
    reason: lexical_alternative
  - marker: b
    text: “Bride-price” renders Hebrew mohar, the payment customarily given in connection with marriage; it is not the same as a dowry in the modern English sense.
    reason: cultural_note
  - marker: c
    text: “To make David fall” likely means to bring about his death, but the Hebrew expression is left less explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 말했습니다. “너희는 다윗에게 이렇게 말하십시오. ‘왕께서는 블레셋 사람들의 양피 백 개[b] 외에는 신부값[a]을 바라지 않으십니다. 이는 왕께서 왕의 원수들에게 원수를 갚으시기 위해서입니다.’” 사울은 블레셋 사람들의 손을 통해 다윗을 쓰러뜨리려 했습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신부값’은 현대 한국어에서 말하는 ‘지참금’과 달리, 혼인과 관련하여 보통 신랑 쪽이 신부 쪽에 지불하는 대가를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘양피’는 남성 성기의 포피를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 직역하면 ‘다윗을 쓰러뜨리다’에 가깝습니다. 문맥상 그를 죽게 하려는 의도를 함축할 수 있으나, 본문은 이를 직접적으로 말하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹאמְרוּ לְדָוִד
  english_pob_choice: Thus you shall say to David
  chosen_korean: “너희는 다윗에게 이렇게 말하십시오”
  alternatives_korean:
  - “다윗에게 이렇게 말해야 합니다”
  - “다윗에게 말하십시오”
  lexicon: WLC / discourse context
  rationale: 명령형 전달 구조를 한국어로 자연스럽게 옮기되, 사울의 지시 발화라는 점을 분명히 하기 위해 ‘이렇게 말하십시오’를 택했습니다.
- source_word: מֹהַר
  english_pob_choice: bride-price
  chosen_korean: 신부값
  alternatives_korean:
  - 결혼대가
  - 혼인 지참금
  lexicon: HALOT
  rationale: מֹהַר는 혼인과 관련해 지불되는 대가이므로 ‘신부값’이 문맥상 가장 직접적이며, 현대 한국어에서도 거래적 뉘앙스를 살립니다.
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  english_pob_choice: a hundred Philistine foreskins
  chosen_korean: 블레셋 사람들의 양피 백 개
  alternatives_korean:
  - 블레셋 사람들의 포피 백 개
  - 블레셋 사람들의 할례 껍질 백 개
  lexicon: HALOT
  rationale: 원문이 충격적인 신체 부위를 구체적으로 말하므로 완곡하게 돌리지 않고 직접적으로 옮기되, ‘양피’로 표준어 문체를 유지했습니다.
- source_word: לְהִנָּקֵם בְּאֹיְבֵי הַמֶּלֶךְ
  english_pob_choice: to take vengeance on the king’s enemies
  chosen_korean: 왕의 원수들에게 복수하려는 것입니다
  alternatives_korean:
  - 왕의 원수들에게 원수를 갚으려는 것입니다
  - 왕의 원수들에게 복수하기 위한 것입니다
  lexicon: HALOT
  rationale: לְהִנָּקֵם는 보복/복수의 목적을 나타내므로 ‘복수하다’로 직역성을 살렸고, 왕의 적이라는 사울의 왕권적 표현도 유지했습니다.
- source_word: וְשָׁאוּל חָשַׁב לְהַפִּיל אֶת דָּוִד בְּיַד פְּלִשְׁתִּים
  english_pob_choice: Now Saul intended to make David fall by the hand of the Philistines
  chosen_korean: 사울은 블레셋 사람들의 손을 통해 다윗을 쓰러뜨리려 했습니다
  alternatives_korean:
  - 사울은 블레셋 사람들의 손으로 다윗이 넘어지게 하려 했습니다
  - 사울은 블레셋 사람들을 통해 다윗을 죽이려 했습니다
  lexicon: HALOT
  rationale: ‘떨어뜨리다/쓰러뜨리다’의 비유를 살리되, 원문이 직접적으로 ‘죽이다’라고 말하지 않으므로 그 해석을 앞서지 않게 했습니다.
theological_decisions:
- issue: 사울의 의도 표현의 강도
  chosen_reading: ‘쓰러뜨리려 했습니다’로 옮겨 원문의 비유적 표현을 유지했습니다.
  alternative_readings:
  - ‘죽이려 했습니다’
  - ‘패망시키려 했습니다’
  rationale: 히브리어 לְהַפִּיל은 문자적으로 ‘넘어뜨리다’이므로, 사울의 의도가 결과적으로 죽음일 수 있어도 본문은 그 점을 직접 단정하지 않습니다.
  doctrine_reference: 본문 주해/서사적 절제
