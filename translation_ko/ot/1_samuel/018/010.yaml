source:
  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/תִּצְלַ֣ח רוּחַ֩ אֱלֹהִ֨ים רָעָ֤ה אֶל שָׁאוּל֙ וַ/יִּתְנַבֵּ֣א בְ/תוֹךְ הַ/בַּ֔יִת וְ/דָוִ֛ד מְנַגֵּ֥ן בְּ/יָד֖/וֹ כְּ/י֣וֹם בְּ/י֑וֹם וְ/הַ/חֲנִ֖ית בְּ/יַד שָׁאֽוּל׀׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/010.yaml
  text: And it happened on the next day that an evil spirit from God rushed upon Saul[a], and he prophesied within the house while David was playing with his hand, as day by day[d][c][b]; and the spear was in Saul’s hand.
  footnotes:
  - marker: a
    text: Or 'a harmful spirit from God'; Hebrew literally, 'an evil spirit of God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he prophesied' or 'he was in a prophetic frenzy'; the verb can denote ecstatic behavior, but here the context suggests deranged ravings rather than true prophecy.
    reason: alternative_reading
  - marker: c
    text: The instrument is not named in this verse, though it is identified elsewhere in the context.
    reason: cross_reference
  - marker: d
    text: Or 'as day by day'.
    reason: previous_rendering
translation:
  language: ko
  text: 이튿날, 하나님에게서 온 악한 영이 사울에게 세차게 임하였고[a], 사울은 집 안에서 예언하고 있었습니다[b]. 다윗은 늘 하던 대로[d] 손으로 연주하고 있었으며[c], 창은 사울의 손에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악한 영’은 히브리어 רָעָה를 직접 옮긴 것입니다. 문맥상 ‘해로운 영’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘예언자처럼 황홀경의 행동을 하고 있었습니다.’ 이 동사는 문맥상 참된 예언보다 격정적이거나 비정상적인 황홀경의 행동을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 악기는 이 절에서 이름이 언급되지 않지만, 앞뒤 문맥에서 확인됩니다.
    reason: cross_reference
  - marker: d
    text: ‘늘 하던 대로’는 히브리어 관용구 כְּיוֹם בְּיוֹם을 풀어 옮긴 것입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: מִמָּחֳרָת
  english_pob_choice: on the next day
  chosen_korean: 이튿날에
  alternatives_korean:
  - 그다음 날에
  - 다음 날에
  lexicon: HALOT
  rationale: 서사의 시간 진행을 자연스러운 현대 한국어로 옮기되, 원문의 직전 사건 다음 날이라는 관계를 분명히 보존합니다.
- source_word: וַתִּצְלַח
  english_pob_choice: rushed upon
  chosen_korean: 급히 임하니
  alternatives_korean:
  - 강하게 임하니
  - 덮치니
  lexicon: HALOT
  rationale: רוּחַ가 사울 위에 갑작스럽고 강하게 미친 동작을 드러내기 위해, ‘임하다’로 관계를 살리면서 ‘급히’로 강도를 보완했습니다.
- source_word: רוּחַ אֱלֹהִים רָעָה
  english_pob_choice: an evil spirit from God
  chosen_korean: 하나님에게서 온 악한 영
  alternatives_korean:
  - 하나님으로부터 온 해로운 영
  - 하나님의 악한 영
  lexicon: HALOT
  rationale: 원문의 소유격/출처 관계를 살려 ‘하나님에게서 온’으로 옮기고, רָעָה는 가장 직접적인 ‘악한’으로 유지하되 신학적 긴장은 별도로 보존했습니다.
- source_word: וַיִּתְנַבֵּא
  english_pob_choice: he raved
  chosen_korean: 예언자처럼 떠들어댔습니다
  alternatives_korean:
  - 예언하듯이 광란했습니다
  - 예언자처럼 환히 떠들었습니다
  lexicon: HALOT
  rationale: 이 동사는 이 문맥에서 참된 예언보다 비정상적 흥분/광란의 뉘앙스를 띠므로, 한국어에서도 ‘예언자처럼’이라는 표면 형식과 ‘떠들어댔다’는 이상행동을 함께 드러냈습니다.
theological_decisions:
- issue: רוּחַ אֱלֹהִים רָעָה를 하나님의 주권과 악의 기원 문제를 어떻게 드러낼지
  chosen_reading: ‘하나님에게서 온 악한 영’으로 옮겨, 출처는 하나님께 두되 하나님 자신이 악하다고 말하지는 않게 했습니다.
  alternative_readings:
  - 하나님에게서 온 해로운 영
  - 하나님의 악한 영
  rationale: 원문이 신적 출처/허용을 분명히 말하므로 그 긴장을 완화하지 않고 살리되, 한국어에서 오해될 수 있는 ‘하나님의 악’이라는 직설은 피했습니다.
  doctrine_reference: 하나님의 주권과 하나님의 도덕적 선하심을 동시에 보존하는 번역 긴장 유지
