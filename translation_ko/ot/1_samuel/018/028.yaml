translation:
  language: ko
  text: 사울은 다윗과 함께 야훼께서 계신 것을 알고, 또 사울의 딸 미갈이 그를 사랑하는 것도 알았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘사울의 딸 미갈’이지만, 한국어에서는 자연스럽게 ‘사울의 딸 미갈’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא / וַיֵּדַע
  english_pob_choice: saw and knew
  chosen_korean: 보고 알았습니다
  alternatives_korean:
  - 보았고 알았습니다
  - 보고 깨달았습니다
  lexicon: HALOT
  rationale: 연속된 동사 두 개를 한국어에서도 ‘보다’와 ‘알다’로 살려, 관찰에서 인지로 나아가는 서술 흐름을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 표기를 전통적 대체어로 바꾸지 않고, 프로젝트 기본값에 따라 고유명사 ‘야훼’로 옮겼습니다.
- source_word: וּמִיכַל בַּת שָׁאוּל
  english_pob_choice: Michal daughter of Saul
  chosen_korean: 사울의 딸 미갈
  alternatives_korean:
  - 미갈, 사울의 딸
  - 미갈 딸 사울
  lexicon: HALOT
  rationale: 히브리어의 종속구문을 자연스러운 현대 한국어로 옮기되, 소유격을 과도하게 풀지 않고 친족관계를 간결하게 드러냈습니다.
- source_word: אֲהֵבַתְהוּ
  english_pob_choice: loved him
  chosen_korean: 그를 사랑하는 것도
  alternatives_korean:
  - 그를 사랑했다는 것도
  - 그를 사랑하고 있다는 것도
  lexicon: HALOT
  rationale: 서술의 결과를 사울이 ‘알게 된’ 내용으로 맞추면서, 동사의 기본 의미 ‘사랑하다’를 유지했습니다.
theological_decisions:
- issue: 야훼의 임재를 나타내는 표현
  chosen_reading: ‘야훼께서 계신 것’으로 옮겨, 단순한 도움 이상의 임재·동행의 의미를 살렸습니다.
  alternative_readings:
  - ‘야훼께서 함께하신 것’
  - ‘야훼께서 편에 서 계신 것’
  rationale: עִם은 단순한 지원보다 실제 동행/함께하심을 드러내므로, 본문의 신학적 핵심인 야훼의 임재를 직접적으로 나타냈습니다.
  doctrine_reference: 'Source-context theology: divine presence implied by עִם + personal name'
- issue: 문장 구조상 두 번째 내용절의 처리
  chosen_reading: ‘또 … 것도’로 두 번째 인지 내용을 별도로 제시했습니다.
  alternative_readings:
  - ‘그리고 …도’
  - ‘또한 …도’
  rationale: 히브리어는 두 번째 כִּי 없이 병렬적으로 이어지지만, 한국어에서는 사울이 인지한 두 사실을 분명히 구분해야 하므로 내용절을 한 번 더 밝혔습니다.
  doctrine_reference: Syntax and discourse coherence
