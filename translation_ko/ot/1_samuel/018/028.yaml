  text: 사울은 야훼께서 다윗과 함께 계시며 사울의 딸 미갈이 그를 사랑하고 있다는 것을 보고 알았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘미갈, 사울의 딸’로도 옮길 수 있습니다.
