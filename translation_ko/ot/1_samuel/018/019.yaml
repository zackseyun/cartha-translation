translation:
  language: ko
  text: 그러나 사울의 딸 메랍을 다윗에게 줄 때가 되었을 때, 그녀는 이미 아드리엘 곧 마헬라 사람에게 아내로 주어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
