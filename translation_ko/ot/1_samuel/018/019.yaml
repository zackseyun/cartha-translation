  rationale: 히브리어의 동격 관계를 자연스러운 한국어 어순으로 풀어, 인물 식별이 즉시 되도록 했습니다.
- source_word: וְהִיא נִתְּנָה
  english_pob_choice: she was given
  chosen_korean: 그녀는 이미 … 주어졌습니다
  alternatives_korean:
