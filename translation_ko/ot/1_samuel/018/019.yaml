translation:
  language: ko
  text: 그런데 사울의 딸 메랍을 다윗에게 줄 때가 되었을 때, 메랍은 므홀랏 사람 아드리엘에게 아내로 주어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
