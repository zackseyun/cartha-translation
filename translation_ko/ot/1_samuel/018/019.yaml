  - 사울의 딸인 메랍
  lexicon: HALOT
  rationale: 히브리어의 동격 관계를 자연스러운 한국어 어순으로 풀어, 인물 식별이 즉시 되도록 했습니다.
- source_word: וְהִיא נִתְּנָה
  english_pob_choice: she was given
  chosen_korean: 그녀는 이미 … 주어졌습니다
  alternatives_korean:
  - 그녀는 주어졌습니다
  - 그녀는 넘겨졌습니다
  lexicon: HALOT
  rationale: 수동형 נתן을 살려 원문의 초점을 유지했고, 앞선 기대와 달리 이미 다른 사람에게 넘겨진 상황을 분명히 하기 위해 ‘이미’를 보탰습니다.
- source_word: הַמְּחֹלָתִי
  english_pob_choice: the Meholathite
  chosen_korean: 마헬라 사람
  alternatives_korean:
  - 메홀랏 사람
  - 마헬라 출신의 사람
  lexicon: HALOT
  rationale: 지명성 형용사를 한국어 관용으로 옮겨, 독자가 인물의 출신 표지를 자연스럽게 이해하도록 했습니다.
- source_word: לְאִשָּׁה
  english_pob_choice: as a wife
  chosen_korean: 아내로
  alternatives_korean:
  - 아내로서
  - 아내가 되도록
  lexicon: HALOT
  rationale: 결혼 배정을 뜻하는 관용구를 간결하게 살려 ‘아내로’로 옮겼습니다.
theological_decisions:
- issue: 예상과 어긋나는 서술의 뉘앙스
  chosen_reading: 사울이 다윗에게 주려 했던 메랍이 실제로는 아드리엘에게 아내로 주어졌다는 반전 자체를 그대로 드러냈습니다.
  alternative_readings:
  - 문맥을 완화해 단순히 ‘주어졌습니다’로만 옮김
  - 반전을 약화시켜 수동 표현을 덜 분명하게 처리함
  rationale: 본문은 독자에게 기대와 현실의 어긋남을 보여 주므로, 이를 완화하지 않고 명시적으로 유지했습니다.
  doctrine_reference: 본문 서술의 문맥 충실성
