lexical_decisions:
- source_word: וַיְהִי בְּעֵת תֵּת
  english_pob_choice: But when the time came to give
  chosen_korean: 그러나 … 줄 때가 되었을 때
  alternatives_korean:
  - 그때 … 주려고 하였을 때
  - 그리고 … 줄 때가 되었을 때
  lexicon: HALOT
  rationale: 서사의 전개와 기대의 전환을 함께 살리기 위해, 단순한 ‘때에’보다 ‘줄 때가 되었을 때’로 옮겼습니다.
- source_word: אֶת מֵרַב בַּת שָׁאוּל
