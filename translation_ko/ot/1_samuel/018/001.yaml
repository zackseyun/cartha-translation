  lexicon: HALOT
  rationale: אהב의 기본 의미를 담되, 한국어 성경체에서 자연스러운 서술인 ‘사랑했습니다’로 옮겼습니다.
theological_decisions:
- issue: 요나단의 사랑을 어떻게 드러낼지
  chosen_reading: 본문의 표현을 그대로 따라 깊은 개인적 결속을 드러내되, 성적·낭만적 의미를 덧붙이지 않았습니다.
  alternative_readings:
  - 우정이나 정치적 동맹으로 약화해 번역하기
  - 로맨틱한 사랑으로 해석해 번역하기
  rationale: 히브리어는 نفש/אהב의 반복으로 강한 애착을 말하지만, 본문 자체는 그 성격을 추가로 규정하지 않습니다. 번역은 그 긴장을 유지해야 합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
