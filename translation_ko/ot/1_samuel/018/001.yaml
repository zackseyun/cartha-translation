base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/001.yaml
  text: And it happened[a], when he had finished speaking to Saul, that Jonathan’s soul was bound to David’s soul[b], and Jonathan loved him as his own soul.
  footnotes:
  - marker: a
    text: Or 'Jonathan’s soul was knit to David’s soul.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew repeatedly uses ''soul'' (nephesh) in this verse: ''Jonathan’s soul ... David’s soul ... his own soul.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 사울에게 말하기를 마쳤을 때, 요나단의 영혼이 다윗의 영혼에 묶였고, 요나단은 그를 자기 영혼처럼 사랑했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘묶이다’(נקשׁר)라는 결속 이미지를 사용하므로, ‘묶였습니다’ 또는 ‘이어졌습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 ‘영혼’(נפשׁ)을 세 번 반복해 요나단, 다윗, 그리고 요나단 자신의 내적 존재를 모두 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고
  alternatives_korean:
  - 그 일이 있었습니다
  - 그때
  lexicon: HALOT
  rationale: 히브리어 서사 도입 공식의 흐름을 살리되, 현대 한국어에서 가장 자연스러운 연결어로 옮겼습니다.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר אֶל שָׁאוּל
  english_pob_choice: when he had finished speaking to Saul
  chosen_korean: 그가 사울에게 말하기를 마쳤을 때
  alternatives_korean:
  - 사울에게 말하기를 끝냈을 때
  - 사울과의 말을 마쳤을 때
  lexicon: HALOT
  rationale: ‘말하기를 마쳤다’로 동작의 완료와 다음 사건의 선행 관계를 분명히 하면서, אֶל שָׁאוּל의 방향성을 자연스럽게 반영했습니다.
- source_word: נֶפֶשׁ / נִקְשְׁרָה / כְּנַפְשׁוֹ
  english_pob_choice: soul / was bound / as his own soul
  chosen_korean: 영혼 / 묶였고 / 자기 영혼처럼
  alternatives_korean:
  - 혼 / 이어졌고 / 자기 혼처럼
  - 생명 / 매여 / 자기 생명처럼
  lexicon: HALOT
  rationale: 본문의 반복되는 נֶפֶשׁ를 한글에서도 반복적으로 드러내기 위해 ‘영혼’을 일관되게 사용했습니다. נִקְשְׁרָה는 ‘묶이다’가 קשר의 결속 이미지를 가장 직접적으로 보여 줍니다.
- source_word: וַיֶּאֱהָבוֹ
  english_pob_choice: Jonathan loved him
  chosen_korean: 요나단은 그를 ... 사랑했습니다
  alternatives_korean:
  - 요나단은 그를 사랑했습니다
  - 요나단이 그를 사랑했습니다
  lexicon: HALOT
  rationale: אהב의 기본 의미를 담되, 한국어 성경체에서 자연스러운 서술인 ‘사랑했습니다’로 옮겼습니다.
theological_decisions:
- issue: 요나단의 사랑을 어떻게 드러낼지
  chosen_reading: 본문의 표현을 그대로 따라 깊은 개인적 결속을 드러내되, 성적·낭만적 의미를 덧붙이지 않았습니다.
  alternative_readings:
  - 우정이나 정치적 동맹으로 약화해 번역하기
  - 로맨틱한 사랑으로 해석해 번역하기
  rationale: 히브리어는 نفש/אהב의 반복으로 강한 애착을 말하지만, 본문 자체는 그 성격을 추가로 규정하지 않습니다. 번역은 그 긴장을 유지해야 합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
