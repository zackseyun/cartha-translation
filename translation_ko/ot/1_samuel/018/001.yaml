base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/001.yaml
  text: And it happened[a], when he had finished speaking to Saul, that Jonathan’s soul was bound to David’s soul[b], and Jonathan loved him as his own soul.
  footnotes:
  - marker: a
    text: Or 'Jonathan’s soul was knit to David’s soul.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew repeatedly uses ''soul'' (nephesh) in this verse: ''Jonathan’s soul ... David’s soul ... his own soul.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 사울에게 말하기를 마쳤을 때, 요나단의 영혼은 다윗의 영혼에 묶였습니다.[a] 요나단은 그를 자기 영혼처럼 사랑했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘묶이다’(נִקְשְׁרָה)라는 결속의 비유를 사용합니다. ‘이어졌습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 ‘영혼’(נֶפֶשׁ)을 세 번 반복합니다. 곧 요나단의 영혼, 다윗의 영혼, 그리고 요나단 자신의 영혼입니다.
    reason: lexical_alternative
