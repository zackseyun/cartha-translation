base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/012.yaml
  text: Saul was afraid of David[a], because Yahweh was with him and had departed from Saul.
  footnotes:
  - marker: a
    text: Or 'Saul feared David.' The Hebrew literally says 'Saul was afraid from before David,' an idiom meaning that David was the object or cause of Saul's fear.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울은 다윗을 두려워했습니다. 야훼께서 다윗과 함께 계셨고 사울에게서는 떠나셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면, ‘사울은 다윗 앞에서 두려워했습니다’입니다. 이는 관용적으로 다윗이 사울의 두려움의 대상 또는 원인이었음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  english_pob_choice: was afraid
  chosen_korean: 두려워했습니다
  alternatives_korean:
  - 무서워했습니다
  - 두려움을 느꼈습니다
  lexicon: HALOT
  rationale: ירא의 기본 의미는 두려움이므로, 현대 한국어에서는 ‘두려워했습니다’가 서술 흐름과 감정 강도를 가장 자연스럽게 살립니다.
- source_word: מִלִּפְנֵי
  english_pob_choice: of
  chosen_korean: 다윗을
  alternatives_korean:
  - 다윗 앞에서
  - 다윗 때문에
  lexicon: HALOT
  rationale: 히브리어 관용구는 두려움의 대상/원인을 가리키므로, 한국어에서는 목적어형으로 처리해 ‘다윗을 두려워했습니다’라고 옮기는 것이 가장 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 POB 기준에 따라 고유명사로서 ‘야훼’로 옮겨, 호칭 대체가 아니라 신적 이름 자체를 드러냅니다.
- source_word: וּמֵעִם שָׁאוּל סָר
  english_pob_choice: and had departed from Saul
  chosen_korean: 사울에게서는 떠나셨기 때문입니다
  alternatives_korean:
  - 사울에게서 물러나셨기 때문입니다
  - 사울에게서 떠나가셨기 때문입니다
  lexicon: HALOT
  rationale: סר은 ‘떠나다/물러가다’의 뜻이지만, 본문은 야훼의 임재가 사울에게서 떠난 상태를 말하므로 한국어에서는 ‘떠나셨다’로 간결하게 살렸습니다.
theological_decisions:
- issue: 야훼의 임재가 다윗과 함께 있고 사울에게서 떠났다는 진술
  chosen_reading: 본문은 다윗에게 야훼께서 함께 계셨고 사울에게서는 떠나셨다고만 말하며, 그 신학적 함의는 확대하지 않습니다.
  alternative_readings:
  - 여호와의 영이 사울에게서 떠났습니다
  - 야훼의 은혜가 사울에게서 떠났습니다
  rationale: 이 절은 인접 본문의 더 자세한 표현을 끌어오지 않고, 본문 자체의 진술과 긴장을 그대로 유지해야 하므로 임재의 이동을 직접적으로 표현하되 원문이 말하지 않는 설명은 덧붙이지 않습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
