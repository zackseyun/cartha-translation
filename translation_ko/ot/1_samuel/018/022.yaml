id: 1SA.18.22
reference: 1 Samuel 18:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְצַ֨ו שָׁא֜וּל אֶת עֲבָדָ֗/ו דַּבְּר֨וּ אֶל דָּוִ֤ד בַּ/לָּט֙ לֵ/אמֹ֔ר הִנֵּ֨ה חָפֵ֤ץ בְּ/ךָ֙ הַ/מֶּ֔לֶךְ וְ/כָל עֲבָדָ֖י/ו אֲהֵב֑וּ/ךָ וְ/עַתָּ֖ה הִתְחַתֵּ֥ן בַּ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/022.yaml
  text: So Saul commanded his servants[a], “Speak to David privately, saying, ‘Look, the king delights in you, and all his servants love you[b]. So now become the king’s son-in-law.’”
  footnotes:
  - marker: a
    text: Or “secretly” or “quietly” for “privately.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “be related by marriage with the king” or “become allied by marriage with the king.”
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 자기 종들에게 명령하여 다윗에게 은밀히 말하게 했습니다. “보십시오, 왕께서 당신을 좋아하시고, 왕의 모든 종도 당신을 사랑합니다. 그러니 이제 왕의 사위가 되십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘은밀히’는 본문의 בַּלָּט가 드러내지 않게 말하라는 뜻을 담은 번역입니다. 영어 POB의 ‘privately’에 해당하는 대안으로 ‘비밀리에’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘왕과 결혼 관계를 맺다’는 뜻이며, 한국어에서는 이를 자연스럽게 ‘왕의 사위가 되다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명령하여
  alternatives_korean:
  - 명하여
  - 지시하여
  lexicon: HALOT
  rationale: צוה의 강한 지시 성격을 살리되, 한국어 문맥에서 자연스러운 서술 연결형으로 옮겼습니다.
- source_word: בַּלָּט
  english_pob_choice: privately
  chosen_korean: 은밀히
  alternatives_korean:
  - 따로
  - 몰래
  lexicon: HALOT
  rationale: 본문의 ‘비공개적/비드러난 방식’이라는 뉘앙스를 살려, 단순히 ‘조용히’보다 숨겨진 전달을 드러내는 표현을 택했습니다.
- source_word: חָפֵץ בְּךָ
  english_pob_choice: delights in you
  chosen_korean: 당신을 좋아하시고
  alternatives_korean:
  - 당신을 기뻐하시고
  - 당신에게 마음을 두시고
  lexicon: HALOT
  rationale: 이 표현은 단순 감정보다 호의와 만족을 나타내므로, 왕의 긍정적 호감을 자연스러운 한국어로 풀었습니다.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  english_pob_choice: become the king’s son-in-law
  chosen_korean: 왕의 사위가 되십시오
  alternatives_korean:
  - 왕과 혼인 관계를 맺으십시오
  - 왕가에 사돈이 되십시오
  lexicon: HALOT
  rationale: 히트파엘 חתן은 혼인 관계 진입을 뜻하므로, 영어 POB의 최적화된 의미를 따라 한국어에서도 결과 관계를 분명히 드러냈습니다.
theological_decisions:
- issue: 왕의 호의와 혼인 동맹의 정치적 의미
  chosen_reading: 사울의 제안은 단순한 사적 칭찬이 아니라 다윗을 왕실 혼인 관계로 끌어들이는 정치적·가문적 제안으로 읽었습니다.
  alternative_readings:
  - 단순한 결혼 권유로만 읽음
  - 궁정 예법상의 친절한 초대로만 읽음
  rationale: 본문의 명령문과 ‘왕의 사위’라는 결과 표현이 결합되어 있어, 관계 형성 이상의 왕실 편입 의도가 분명합니다.
  doctrine_reference: 본문 역사-서사 해석
