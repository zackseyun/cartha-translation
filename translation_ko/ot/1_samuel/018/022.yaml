  rationale: 본문의 ‘비공개적/비드러난 방식’이라는 뉘앙스를 살려, 단순히 ‘조용히’보다 숨겨진 전달을 드러내는 표현을 택했습니다.
- source_word: חָפֵץ בְּךָ
  english_pob_choice: delights in you
  chosen_korean: 당신을 좋아하시고
  alternatives_korean:
  - 당신을 기뻐하시고
  - 당신에게 마음을 두시고
  lexicon: HALOT
  rationale: 이 표현은 단순 감정보다 호의와 만족을 나타내므로, 왕의 긍정적 호감을 자연스러운 한국어로 풀었습니다.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  english_pob_choice: become the king’s son-in-law
  chosen_korean: 왕의 사위가 되십시오
  alternatives_korean:
  - 왕과 혼인 관계를 맺으십시오
  - 왕가에 사돈이 되십시오
  lexicon: HALOT
  rationale: 히트파엘 חתן은 혼인 관계 진입을 뜻하므로, 영어 POB의 최적화된 의미를 따라 한국어에서도 결과 관계를 분명히 드러냈습니다.
theological_decisions:
- issue: 왕의 호의와 혼인 동맹의 정치적 의미
  chosen_reading: 사울의 제안은 단순한 사적 칭찬이 아니라 다윗을 왕실 혼인 관계로 끌어들이는 정치적·가문적 제안으로 읽었습니다.
  alternative_readings:
  - 단순한 결혼 권유로만 읽음
  - 궁정 예법상의 친절한 초대로만 읽음
  rationale: 본문의 명령문과 ‘왕의 사위’라는 결과 표현이 결합되어 있어, 관계 형성 이상의 왕실 편입 의도가 분명합니다.
  doctrine_reference: 본문 역사-서사 해석
