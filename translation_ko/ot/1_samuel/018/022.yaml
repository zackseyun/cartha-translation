source:
  edition: WLC
  text: וַ/יְצַ֨ו שָׁא֜וּל אֶת עֲבָדָ֗/ו דַּבְּר֨וּ אֶל דָּוִ֤ד בַּ/לָּט֙ לֵ/אמֹ֔ר הִנֵּ֨ה חָפֵ֤ץ בְּ/ךָ֙ הַ/מֶּ֔לֶךְ וְ/כָל עֲבָדָ֖י/ו אֲהֵב֑וּ/ךָ וְ/עַתָּ֖ה הִתְחַתֵּ֥ן בַּ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/022.yaml
  text: So Saul commanded his servants[a], “Speak to David privately, saying, ‘Look, the king delights in you, and all his servants love you[b]. So now become the king’s son-in-law.’”
  footnotes:
  - marker: a
    text: Or “secretly” or “quietly” for “privately.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “be related by marriage with the king” or “become allied by marriage with the king.”
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 자기 종들에게 다윗에게 은밀히[a] 이렇게 말하라고 명령했습니다. “보십시오, 왕께서 그대를 좋게 여기시고, 왕의 모든 신하도 그대를 사랑합니다. 그러니 이제 왕의 사위가 되십시오.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בַּלָּט는 ‘은밀히’, ‘비밀리에’, 또는 ‘조용히’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘왕과 혼인 관계를 맺다’라는 뜻입니다. 한국어에서는 문맥에 따라 ‘왕의 사위가 되다’로 자연스럽게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명령하여
  alternatives_korean:
  - 명하여
  - 지시하여
  lexicon: HALOT
  rationale: צוה의 강한 지시 성격을 살리되, 한국어 문맥에서 자연스러운 서술 연결형으로 옮겼습니다.
- source_word: בַּלָּט
  english_pob_choice: privately
  chosen_korean: 은밀히
  alternatives_korean:
