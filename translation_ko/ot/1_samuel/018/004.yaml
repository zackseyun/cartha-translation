translation:
  language: ko
  text: 그때 요나단은 입고 있던 겉옷을 벗어 다윗에게 주고, 자신의 복장과 칼과 활과 띠까지도 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘복장’으로 옮긴 히브리어 מַדִּים은 의복을 뜻하며, 특히 공적 또는 군사적 복장을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּשֵּׁט
  english_pob_choice: stripped off
  chosen_korean: 벗어
  alternatives_korean:
  - 벗어 버리고
  - 벗었습니다
  lexicon: HALOT
  rationale: 히트파엘형의 자기 행위성을 살리되, 현대 한국어에서는 ‘벗어’가 가장 자연스럽고 본문 흐름에 맞습니다.
- source_word: הַמְּעִיל
