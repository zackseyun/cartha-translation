base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/004.yaml
  text: Then Jonathan stripped off the robe that was on him and gave it to David[a], along with his armor, and even his sword, his bow, and his belt.
  footnotes:
  - marker: a
    text: Or 'his garments' or 'his military attire' for 'his armor'; the Hebrew term can denote clothing, often in an official or military sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요나단은 자신에게 있던 겉옷을 벗어 다윗에게 주었는데, 자기의 군복과 칼과 활과 띠까지도 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘군복’은 כאן의 מַדִּים이 가리킬 수 있는 의복/공적 복장의 범위를 한국어로 압축한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּשֵּׁט
  english_pob_choice: stripped off
  chosen_korean: 벗어
  alternatives_korean:
  - 벗어 버리고
  - 벗었습니다
  lexicon: HALOT
  rationale: 히트파엘형의 자기 행위성을 살리되, 현대 한국어에서는 ‘벗어’가 가장 자연스럽고 본문 흐름에 맞습니다.
- source_word: הַמְּעִיל
  english_pob_choice: the robe
  chosen_korean: 겉옷
  alternatives_korean:
  - 로브
  - 망토
  lexicon: HALOT
  rationale: מְעִיל은 바깥에 입는 옷을 가리키므로, 한국어에서는 ‘겉옷’이 가장 직접적이고 오해가 적습니다.
- source_word: וּמַדָּיו
  english_pob_choice: his armor
  chosen_korean: 군복
  alternatives_korean:
  - 갑옷
  - 군장
  - 군복과 장비
  lexicon: HALOT
  rationale: 문맥상 뒤이어 칼, 활, 띠가 이어지므로 단순한 의복보다 전투/공적 복장을 가리키는 뉘앙스가 강해 ‘군복’으로 옮겼습니다.
- source_word: וְעַד
  english_pob_choice: and even
  chosen_korean: 까지도
  alternatives_korean:
  - 그리고
  - 심지어
  lexicon: HALOT
  rationale: 반복되는 עַד의 누적적 효과를 한국어에서는 ‘까지도’가 잘 살려 주며, 준말로 나열의 정점을 표현합니다.
theological_decisions:
- issue: 요나단의 선물이 갖는 상징성
  chosen_reading: 본문의 관찰 가능한 행동만 제시하고, 왕권 양도나 언약적 의미를 본문 안에서 단정하지 않았습니다.
  alternative_readings:
  - 다윗을 후계자로 인정하는 상징으로 명시
  - 우정과 언약의 표지로 명시
  rationale: 히브리어 본문은 요나단이 무엇을 주었는지만 말하며 그 의미를 해설하지 않으므로, 번역문에서도 해석을 앞서지 않게 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
