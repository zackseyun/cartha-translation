  text: Then Jonathan stripped off the robe that was on him and gave it to David[a], along with his armor, and even his sword, his bow, and his belt.
  footnotes:
  - marker: a
    text: Or 'his garments' or 'his military attire' for 'his armor'; the Hebrew term can denote clothing, often in an official or military sense.
