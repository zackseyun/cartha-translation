translation:
  language: ko
  text: 사울의 종들이 그에게 말하여 이르기를, “다윗이 이와 같은 말들을 하였습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵי שָׁאוּל
  english_pob_choice: Saul’s servants
  chosen_korean: 사울의 종들
  alternatives_korean:
  - 사울의 신하들
  - 사울의 시종들
  lexicon: HALOT
  rationale: עבד는 문맥에 따라 ‘종/시종/신하’로 갈 수 있으나, 여기서는 왕궁의 소식을 전달하는 사람들을 가리키므로 source에 가까운 ‘종들’이 무난합니다.
- source_word: וַיַּגִּדוּ ל֖וֹ
  english_pob_choice: told him
  chosen_korean: 그에게 말하여 이르되
  alternatives_korean:
  - 그에게 알리며 이르되
  - 그에게 보고하여 이르되
  lexicon: HALOT
  rationale: נגד의 히필은 ‘알리다, 전하다, 말하다’의 뜻을 가지며, 한국어에서는 앞뒤 직접화법을 살리는 ‘말하여 이르되’가 가장 자연스럽습니다.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  english_pob_choice: words like these
  chosen_korean: 이런 말들을
  alternatives_korean:
  - 이러한 말들을
  - 이 같은 말들을
  lexicon: HALOT
  rationale: 직역하면 ‘이러한 말들대로/같은 말들’이므로, 한국어에서는 반복을 줄이면서도 히브리어의 비교적 표현을 살리는 ‘이런 말들’이 적절합니다.
- source_word: דִּבֶּר
  english_pob_choice: spoke
  chosen_korean: 했다고
  alternatives_korean:
  - 말했다고
  - 이야기했다고
  lexicon: HALOT
  rationale: דבר는 일반적인 ‘말하다’보다 약간 더 형식적인 ‘말하다/발언하다’의 뉘앙스가 있어, 보고문 안에서는 ‘했다고’로 자연스럽게 처리했습니다.
