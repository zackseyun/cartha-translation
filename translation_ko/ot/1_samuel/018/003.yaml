  - marker: b
    text: ‘그에 대한 사랑으로’ 또는 ‘그를 사랑하는 가운데’로도 옮길 수 있습니다. 히브리어의 대명사들은 형식상 지시 대상이 모호하지만, 문맥상 요나단이 다윗을 자기 생명처럼 사랑한 것으로 이해하는 것이 가장 자연스럽습니다.
    reason: alternative_reading
