theological_decisions:
- issue: 대명사 주어의 지시 대상
  chosen_reading: ‘그가’는 문맥상 요나단을 가리키며, 사랑의 주체는 요나단이고 대상은 다윗입니다.
  alternative_readings:
  - 형식상 대명사가 모호하므로 주어를 열어 두는 번역
  - 다윗이 요나단을 사랑했다는 읽기
  rationale: 히브리어 대명사는 형식상 단수 제3인칭으로 보일 수 있으나, 앞뒤 문맥이 요나단을 주어로 강하게 지시하므로 그 문맥적 지시를 따라 번역했습니다.
  doctrine_reference: 문맥 우선 원칙; 형식적 모호성은 주석적 장치로만 남기고 본문은 가장 강한 문맥 읽기를 반영합니다.
