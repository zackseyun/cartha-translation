translation:
  language: ko
  text: 그때 요나단이 다윗과 언약을 맺었습니다. 그가 그를 자기의 생명처럼 사랑했기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘언약을 끊었다(자르다)’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 대명사는 형식상 모호하지만, 문맥상 요나단이 다윗을 사랑한 것으로 읽는 것이 가장 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  english_pob_choice: made
  chosen_korean: 맺었습니다
  alternatives_korean:
  - 맺어 주었습니다
  - 세웠습니다
  - 끊어 맺었습니다
  lexicon: HALOT
  rationale: כרת ברית의 관용 표현을 한국어의 자연스러운 문맥으로 옮기되, 언약 행위의 공식성과 체결성을 살리기 위해 ‘맺다’를 택했습니다.
- source_word: בְּרִית
  english_pob_choice: covenant
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 협약
  - 동맹
  lexicon: HALOT
  rationale: ברית는 단순한 합의보다 더 무거운 결속을 가리키므로, 성경 한국어에서 널리 통용되면서도 의미를 잘 보존하는 ‘언약’이 적절합니다.
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  english_pob_choice: because he loved him
  chosen_korean: 그가 그를 … 사랑했기 때문입니다
  alternatives_korean:
  - 그를 사랑하는 가운데
  - 그를 사랑함으로
  - 그를 사랑한 까닭에
  lexicon: HALOT
  rationale: 전치사 ב의 원인적 뉘앙스를 살려, 언약의 배경이 된 사랑을 분명하게 드러내는 한국어 인과문으로 옮겼습니다.
- source_word: כְּנַפְשׁוֹ
  english_pob_choice: as his own soul
  chosen_korean: 자기의 생명처럼
  alternatives_korean:
  - 자기 영혼처럼
  - 자기 자신처럼
  - 자기 목숨처럼
  lexicon: HALOT
  rationale: נפשׁ는 ‘영혼/생명/자기 자신’의 범위를 가질 수 있는데, 여기서는 깊은 애착과 동일시를 살리면서도 현대 한국어에서 자연스러운 ‘자기의 생명처럼’으로 옮겼습니다.
theological_decisions:
- issue: 대명사 주어의 지시 대상
  chosen_reading: ‘그가’는 문맥상 요나단을 가리키며, 사랑의 주체는 요나단이고 대상은 다윗입니다.
  alternative_readings:
  - 형식상 대명사가 모호하므로 주어를 열어 두는 번역
  - 다윗이 요나단을 사랑했다는 읽기
  rationale: 히브리어 대명사는 형식상 단수 제3인칭으로 보일 수 있으나, 앞뒤 문맥이 요나단을 주어로 강하게 지시하므로 그 문맥적 지시를 따라 번역했습니다.
  doctrine_reference: 문맥 우선 원칙; 형식적 모호성은 주석적 장치로만 남기고 본문은 가장 강한 문맥 읽기를 반영합니다.
