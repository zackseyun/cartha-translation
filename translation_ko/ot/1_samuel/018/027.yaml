base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/027.yaml
  text: So David arose and went[a], he and his men, and struck down two hundred Philistine men. Then David brought their foreskins, and they counted them out in full to the king, so that he might become the king’s son-in-law. And Saul gave him Michal his daughter as a wife.
  footnotes:
  - marker: a
    text: Or, 'they presented the full number to the king.' The Hebrew verb is difficult and may refer either to counting them out or to completing the required tally before the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 일어나 그의 부하들과 함께 가서 블레셋 사람 이백 명을 쳐 죽였습니다. 다윗은 그들의 포피를 가져왔고, 그들은 그것들을 왕에게 수량을 채워 바쳤습니다.[a] 이는 다윗이 왕의 사위가 되기 위해서였습니다. 사울은 자기 딸 미갈을 그의 아내로 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사의 형태와 구문은 난해합니다. 이 표현은 ‘그것들을 왕에게 수를 채워 바쳤다’ 또는 ‘그것들을 왕에게 온전한 수로 제시했다’라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어나다
  alternatives_korean:
  - 일어섰습니다
  - 떠났습니다
  lexicon: HALOT
  rationale: 서사에서 새 행동을 시작하는 כוח(기동) 표현으로, 단순한 ‘갔다’보다 ‘일어나다’가 히브리어의 전환감을 더 잘 살립니다.
- source_word: וַיֵּלֶךְ הוּא וַאֲנָשָׁיו
  english_pob_choice: went, he and his men
  chosen_korean: 자기와 그의 부하들과 함께 가서
  alternatives_korean:
  - 그와 그의 부하들이 갔습니다
  - 그와 그의 사람들과 함께 갔습니다
  lexicon: HALOT
  rationale: הוּא의 강조를 ‘자기와’로 살리고, 전투 맥락의 אֲנָשָׁיו는 자연스러운 한국어로 ‘부하들’이라 옮겼습니다.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים מָאתַיִם אִישׁ
  english_pob_choice: struck down two hundred Philistine men
  chosen_korean: 블레셋 사람 이백 명을 쳐 죽이고
  alternatives_korean:
  - 블레셋 사람 이백 명을 쳐서 쓰러뜨리고
  - 블레셋 사람 이백 명을 죽이고
  lexicon: HALOT
  rationale: נכה는 전투 문맥에서 ‘치다/쳐 죽이다’의 폭을 가지므로, 결과가 분명한 이 문맥에서는 ‘쳐 죽이고’가 가장 직접적입니다.
- source_word: עָרְלֹתֵיהֶם
  english_pob_choice: their foreskins
  chosen_korean: 그들의 포피
  alternatives_korean:
  - 그들의 할례 피막
  - 그들의 포피들
  lexicon: HALOT
  rationale: 히브리어의 노골적인 해부학적 표현을 완화하지 않고, 성경 본문의 직접성을 유지하기 위해 ‘포피’로 옮겼습니다.
- source_word: וַיְמַלְא֣וּ/ם
  english_pob_choice: they counted them out in full
  chosen_korean: 온전한 수대로 내놓았습니다
  alternatives_korean:
  - 수대로 채워 바쳤습니다
  - 전부 갖추어 바쳤습니다
  - 완전한 수로 제시했습니다
  lexicon: HALOT
  rationale: 동사의 정확한 구문은 난해하지만, 문맥상 왕 앞에 요구 수량을 충족시켜 제시한 의미이므로 ‘온전한 수대로’가 계산·제시의 양면을 함께 담습니다.
- source_word: לְ/הִתְחַתֵּ֖ן בַּ/מֶּ֑לֶךְ
  english_pob_choice: so that he might become the king’s son-in-law
  chosen_korean: 왕의 사위가 되게 하려는 것이었습니다
  alternatives_korean:
  - 왕과 혼인 동맹을 맺게 하려는 것이었습니다
  - 왕의 사위가 되려고 한 것이었습니다
  lexicon: HALOT
  rationale: חתן의 히트파엘은 혼인 관계로 들어감을 뜻하므로, 여기서는 결과를 분명히 드러내는 ‘왕의 사위’가 가장 자연스럽습니다.
- source_word: וַיִּתֶּן ל֥וֹ שָׁא֛וּל אֶת מִיכַ֥ל בִּתּ֖וֹ לְאִשָּֽׁה
  english_pob_choice: And Saul gave him Michal his daughter as a wife
  chosen_korean: 사울은 그의 딸 미갈을 아내로 그에게 주었습니다
  alternatives_korean:
  - 사울은 그의 딸 미갈을 그에게 아내로 주었습니다
  - 사울은 그의 딸 미갈을 그의 아내로 주었습니다
  lexicon: HALOT
  rationale: 히브리어의 결혼 제공 관용구를 살리되, 현대 한국어에서 자연스럽게 읽히도록 ‘아내로 그에게 주었습니다’로 정리했습니다.
theological_decisions:
- issue: 본문의 노골적인 포피 언급을 완화할지 여부
  chosen_reading: 원문 그대로 ‘포피’로 옮겨, 사울의 요구와 다윗의 행위가 지닌 폭력성과 조롱성을 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘할례 표지’로 바꾸는 해석
  - 의미를 약화한 ‘살갗’류 표현
  rationale: 이 절은 서사의 충격과 거래적 수치를 의도적으로 드러내므로, 완화 번역은 본문의 힘을 손상합니다.
  doctrine_reference: 본문 충실성 원칙
- issue: ‘왕의 사위’의 관계 표현
  chosen_reading: 혼인 동맹의 결과를 ‘왕의 사위’로 직설적으로 표현했습니다.
  alternative_readings:
  - ‘왕과 혼인 관계를 맺게 하려는’으로만 풀어 쓰는 방법
  rationale: 히브리어 히트파엘 חתן은 단순한 결혼 감정이 아니라 가문 편입을 뜻하므로, 관계적 결과를 분명히 보여 주는 번역이 더 충실합니다.
  doctrine_reference: 서사 문맥의 의미 우선 원칙
