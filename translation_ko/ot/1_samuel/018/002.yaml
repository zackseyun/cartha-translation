source:
  edition: WLC
  text: וַ/יִּקָּחֵ֥/הוּ שָׁא֖וּל בַּ/יּ֣וֹם הַ/ה֑וּא וְ/לֹ֣א נְתָנ֔/וֹ לָ/שׁ֖וּב בֵּ֥ית אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/002.yaml
  text: Saul took him that day and did not allow him to return to his father's house[a].
  footnotes:
  - marker: a
    text: Or 'did not permit him to return.' The Hebrew literally says 'did not give him to return,' using נתן idiomatically for permission.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울은 그날 다윗을 데려갔고, 다윗이 아버지의 집으로 돌아가는 것을 허락하지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  english_pob_choice: took him
  chosen_korean: 데려가고
  alternatives_korean:
  - 붙들고
  - 취하여
  lexicon: HALOT
  rationale: לקח의 기본 의미인 ‘취하다/데려가다’를 살리면서, 이 문맥에서 사울이 다윗을 자기 곁으로 붙잡아 두는 뉘앙스를 자연스럽게 드러냅니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: that day
  chosen_korean: 그날
  alternatives_korean:
  - 그 날에
  - 그때
  lexicon: HALOT
  rationale: 시점을 분명히 표시하는 간결한 현대 한국어 표현으로, 원문의 시간 부사를 직접 반영합니다.
- source_word: וְלֹא נְתָנוֹ
  english_pob_choice: did not allow him
  chosen_korean: 돌아가게 하지 않았습니다
  alternatives_korean:
  - 돌아가도록 허락하지 않았습니다
  - 돌아가게 허락하지 않았습니다
  lexicon: HALOT
  rationale: נתן + infinitive의 허용/허락 관용법을 한국어로 풀어, ‘허락하다’의 의미를 분명히 하되 어색한 직역을 피했습니다.
- source_word: בֵּית אָבִיו
  english_pob_choice: to his father's house
  chosen_korean: 그의 아버지의 집
  alternatives_korean:
  - 아버지의 집
  - 아버지의 집으로
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려 가족적 소속과 거주지를 함께 드러내는 표현으로 옮겼습니다.
