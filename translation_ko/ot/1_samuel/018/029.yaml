  rationale: משך적 지속을 나타내는 관용구로서, 사울의 생애 전체에 걸친 적대라는 뜻을 간결하게 전하는 ‘평생’이 적합합니다.
theological_decisions:
- issue: 사울의 ‘두려움’과 ‘원수 됨’의 강도 표현
  chosen_reading: 심리적 두려움의 지속이 단순 감정이 아니라 적대 관계의 고착으로 이어진다는 흐름을 그대로 드러냈습니다.
  alternative_readings:
  - ‘두려워했습니다’처럼 더 평이하게 처리할 수 있음
  - ‘적대자였습니다’로 완화해 표현할 수 있음
  rationale: 본문은 감정의 반복이 관계적 적대의 상시화로 굳어지는 서술이므로, 두 층위를 모두 살려야 합니다.
  doctrine_reference: 서사 문맥의 인물 심리와 관계 묘사
- issue: כָּל הַיָּמִים의 범위
  chosen_reading: ‘평생’으로 옮겨 사울의 생애 전 기간에 걸친 적대라는 통상적 읽기를 반영했습니다.
  alternative_readings:
  - ‘그의 모든 날 동안’처럼 직역할 수 있음
  - ‘항상’으로 일반화할 수 있음
  rationale: 히브리어 관용구가 문맥상 지속 기간을 요약하므로, 한국어에서도 생애 전체의 지속성을 드러내는 표현이 가장 분명합니다.
  doctrine_reference: 문맥상 시간 범위 표현
