  yaml_path: translation/ot/1_samuel/018/029.yaml
  text: Saul continued to fear David even more[b][a], and Saul was David’s enemy all his days.
  footnotes:
  - marker: a
    text: Or 'Saul continued to fear David still/further.' The Hebrew idiom combines 'added/continued' with 'to fear,' and עוֹד intensifies the sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'Saul was an enemy to David all the days,' that is, continually. The Hebrew phrase may emphasize ongoing duration rather than strictly Saul's lifetime.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울은 다윗을 더욱[a] 두려워했고, 사울은 줄곧[b] 다윗의 원수였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘더하다/계속하다’와 ‘두려워하다’를 결합하여, 사울이 다윗을 계속해서 더 두려워했다는 뜻을 나타냅니다. ‘여전히 두려워했다’ 또는 ‘더 두려워했다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘모든 날 동안’입니다. 사울의 평생을 가리킬 수도 있고, 지속적인 적대 상태를 강조할 수도 있습니다.
    reason: lexical_alternative
