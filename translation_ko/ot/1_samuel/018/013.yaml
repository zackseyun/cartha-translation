  yaml_path: translation/ot/1_samuel/018/013.yaml
  text: So Saul removed him from his presence and appointed him commander of a thousand[a], and he went out and came in before the people.
  footnotes:
  - marker: a
    text: Hebrew 'went out and came in,' an idiom for carrying out public or military activity, possibly with the sense of leading the people.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 그를 자기 곁에서 물러나게 하고, 그를 천 명의 지휘관으로 삼았으며, 그는 백성 앞에서 나가고 들어왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘나가고 들어오다’는 공적·군사적 활동을 수행하는 관용구이며, 백성을 이끄는 뜻을 띨 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסִרֵהוּ
  english_pob_choice: removed him
  chosen_korean: 그를 자기 곁에서 물러나게 하고
  alternatives_korean:
  - 그를 치워 버리고
  - 그를 자기 앞에서 물러나게 하고
  lexicon: HALOT
  rationale: סוּר의 사역적 의미를 살려 물리적으로/관계적으로 ‘떼어 놓는’ 행동을 나타내되, 동기 해석은 덧붙이지 않았습니다.
- source_word: מֵעִמּוֹ
  english_pob_choice: from his presence
  chosen_korean: 자기 곁에서
  alternatives_korean:
  - 자기 앞에서
  - 그에게서
  lexicon: HALOT
  rationale: 직역하면 ‘그와 함께함에서’이지만, 왕의 궁정 상황을 자연스럽게 살리기 위해 관계적 거리감을 드러내는 표현을 택했습니다.
- source_word: שַׂר אָלֶף
  english_pob_choice: commander of a thousand
  chosen_korean: 천 명의 지휘관
  alternatives_korean:
  - 천 명의 사령관
  - 천 명의 대장
  lexicon: HALOT
  rationale: שַׂר의 관직적·군사적 의미를 현대 한국어로 분명하게 전달하면서도, ‘천’이라는 단위를 그대로 보존했습니다.
- source_word: וַיֵּצֵא וַיָּבֹא
  english_pob_choice: went out and came in
  chosen_korean: 나가고 들어왔습니다
  alternatives_korean:
  - 출입했습니다
  - 나갔다 들어왔습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 본문에서 그대로 살려, 단순 이동이 아니라 공적·군사적 활동의 반복을 독자가 읽어 내도록 했습니다.
theological_decisions:
- issue: ‘before the people’의 기능을 어떻게 드러낼지
  chosen_reading: ‘백성 앞에서’로 옮겨 공개적 가시성과 활동의 범위를 열어 두었습니다.
  alternative_readings:
  - ‘백성의 앞장에 서서’
  - ‘백성의 눈앞에서’
  rationale: 본문은 דוד의 역할이 백성 앞에서 수행되었음을 말하지만, 지휘 여부를 너무 좁혀 단정하지 않도록 기본 문구를 유지했습니다.
  doctrine_reference: 본문 해석(문맥 우선)
