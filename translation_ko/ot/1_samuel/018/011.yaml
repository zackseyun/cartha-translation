  text: Saul hurled the spear and said, “I will pin David to the wall.” But David dodged away from him twice.
translation:
  language: ko
  text: 사울이 창을 던지고 말했습니다. “내가 다윗을 벽에 박겠다.” 그러나 다윗은 그에게서 두 번이나 몸을 피했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/יָּ֤טֶל ... אֶת הַ/חֲנִ֔ית
  english_pob_choice: hurled the spear
  chosen_korean: 창을 던지며
  alternatives_korean:
  - 창을 내던지며
  - 창을 던져
  lexicon: חנית
  rationale: חֲנִית은 무기인 ‘창’으로 옮기고, 동작은 영어 POB의 ‘hurled’에 맞춰 순간적이고 공격적인 던짐을 살렸습니다.
- source_word: אַכֶּ֥ה בְ/דָוִ֖ד וּ/בַ/קִּ֑יר
  english_pob_choice: I will pin David to the wall
  chosen_korean: 나는 다윗을 벽에 박아 버리겠다
  alternatives_korean:
  - 나는 다윗을 벽에 꽂아 버리겠다
  - 나는 다윗을 벽에 찔러 붙이겠다
  lexicon: נכה + קיר
  rationale: 히브리어의 직역상 ‘치다’는 영어 POB가 채택한 ‘pin’보다 의미가 넓지만, 문맥상 단순 타격이 아니라 벽에 고정시키려는 의도를 드러내는 표현으로 옮겼습니다.
- source_word: וַ/יִּסֹּ֥ב ... מִ/פָּנָ֖י/ו פַּעֲמָֽיִם־
  english_pob_choice: David dodged away from him twice
  chosen_korean: 다윗은 그의 앞에서 두 번이나 피했습니다
  alternatives_korean:
  - 다윗은 그의 앞을 두 번이나 피했습니다
  - 다윗은 그에게서 두 번이나 몸을 피했습니다
  lexicon: סבב
  rationale: וַיִּסֹּב는 몸을 돌려 피하다/비키다의 뜻이므로, 방향성과 반복을 살려 ‘두 번이나 피했습니다’로 옮겼습니다.
