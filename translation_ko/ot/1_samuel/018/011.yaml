  text: 사울이 창을 던지며 말했습니다. “나는 다윗을 벽에 박아 버리겠다.” 그러나 다윗은 그의 앞에서 두 번이나 피했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
