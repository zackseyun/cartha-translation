    rationale: 히브리어는 문맥상 적의·시기·의심을 함축할 수 있으나, ‘노려보다’처럼 명시적인 험악한 눈초리를 반드시 뜻하지는 않습니다. 보다 포괄적인 ‘주시하다’가 원문의 여지를 보존합니다.
