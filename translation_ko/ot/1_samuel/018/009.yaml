lexical_decisions:
- source_word: וַיְהִי + עון
  english_pob_choice: kept a jealous eye on / eyed
  chosen_korean: 노려보다
  alternatives_korean:
  - 주시하다
  - 눈여겨보다
  - 질투 어린 눈으로 보다
  lexicon: HALOT
  rationale: 문맥상 단순 관찰이 아니라 18:8–9의 분노와 경계가 이어지는 적대적 응시를 가리키므로, 한국어에서는 ‘노려보다’가 그 긴장과 악의적 시선을 가장 자연스럽게 드러냅니다.
- source_word: מֵהַיּוֹם הַהוּא וָהָלְאָה
  english_pob_choice: from that day forward
  chosen_korean: 그날부터 계속
  alternatives_korean:
  - 그날부터 앞으로
  - 그날 이후로
  lexicon: HALOT
  rationale: 시작점과 지속성을 함께 나타내는 시간 표현이므로, 합쇼체 서술에서 ‘그날부터 계속’이 현재까지 이어지는 태도를 간결하게 전달합니다.
- source_word: שָׁאוּל / דָּוִד
  english_pob_choice: Saul / David
  chosen_korean: 사울 / 다윗
  alternatives_korean:
  - 사울 왕 / 다윗
  lexicon: 고유명사 표기
  rationale: 통용되는 성경 인명 표기를 따르되, 본문 자체가 왕호를 추가하지 않으므로 이름만 유지했습니다.
theological_decisions:
- issue: עון의 의미를 중립적 ‘보다’로 완화할지 여부
  chosen_reading: 적대적·질투 섞인 시선이 드러나는 ‘노려보다’로 옮겼습니다.
  alternative_readings:
  - 보다
  - 주시하다
  - 경계하다
  rationale: 앞 절의 여인들 노래와 바로 이어지는 서술 흐름상 사울의 내적 반응은 단순 관찰이 아니라 적대와 질투가 섞인 지속적 응시이므로, 그 긴장을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 본문 문맥 일관성
