  source_fidelity: ‘노려보았습니다’는 적대감을 노골적인 얼굴 표정이나 행동으로 드러내는 ‘쏘아보았다/glared’의 뜻이 강하여, 사울이 다윗을 지속적으로 예의 주시한 히브리어 표현보다 다소 강합니다. 본문은 시기 또는 의심을 품은 경계의 시선을 문맥상 암시하지만, 이를 동사 자체에 확정적으로 넣지는 않습니다.
