base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/008.yaml
  text: Then Saul became very angry[a], and this matter displeased him. He said, “They have given David ten thousands, but to me they have given the thousands[b]; what more can he have but the kingdom?”
  footnotes:
  - marker: a
    text: Or, more formally, “They have ascribed ten thousands to David, but to me they have ascribed the thousands.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew is compressed: “and still to him only the kingdom,” meaning that in Saul’s view the only thing left for David to receive is the kingdom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울은 몹시 화가 났고, 이 일이 그의 눈에 못마땅하였습니다. 그는 말하였습니다. “사람들이 다윗에게는 만만[a]을 주고, 내게는 천천[b]을 주었습니다. 그가 더 받을 것이 무엇이겠습니까? 오직 왕국뿐 아닙니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, “사람들이 다윗에게는 만만을 돌리고, 내게는 천천을 돌렸습니다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 압축된 표현입니다. 사울의 뜻으로는 다윗에게 남은 것은 결국 왕국뿐이라는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר ... מְאֹד
  english_pob_choice: became very angry
  chosen_korean: 몹시 화가 났고
  alternatives_korean:
  - 분노에 타올랐고
  - 매우 화가 났고
  lexicon: HALOT
  rationale: 히브리어 관용구의 강한 분노를 살리되, 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: וַיֵּרַע בְּעֵינָיו הַדָּבָר הַזֶּה
  english_pob_choice: this matter displeased him
  chosen_korean: 이 일이 그의 눈에 못마땅하였습니다
  alternatives_korean:
  - 그의 눈에 이 일이 악하게 보였습니다
  - 이 일이 그에게 나쁘게 보였습니다
  lexicon: HALOT
  rationale: 직역의 ‘눈에 나쁘다/악하다’는 한국어에서 어색하므로, 원문의 평가적 반응을 살려 ‘못마땅하다’로 옮겼습니다.
- source_word: רְבָבוֹת / הָאֲלָפִים
  english_pob_choice: ten thousands / the thousands
  chosen_korean: 만만 / 천천
  alternatives_korean:
  - 만의 만 / 천의 천
  - 만 / 천
  lexicon: HALOT
  rationale: 히브리어의 대조적 수량 표현을 살리기 위해 ‘만만’과 ‘천천’으로 대응시켜, 반복된 병렬과 수치 대비를 한국어에서도 드러냈습니다.
- source_word: הַמְּלוּכָה
  english_pob_choice: the kingdom
  chosen_korean: 왕국
  alternatives_korean:
  - 왕권
  - 왕위
  lexicon: HALOT
  rationale: 문맥상 다윗에게 남는 마지막 대상이 왕권의 획득이라는 점을 담아, 자연스러운 현대어로 ‘왕국’을 택했습니다.
theological_decisions:
- issue: 사울의 분노와 불만을 드러내는 관용구를 어떻게 전달할 것인가
  chosen_reading: 사울은 단순히 감정이 상한 정도가 아니라, 다윗에 대한 공적 평가가 자신을 밀어낸다는 위기의식 속에서 몹시 화가 난 것으로 읽었습니다.
  alternative_readings:
  - 사울은 매우 불쾌해했습니다
  - 사울은 질투로 격분했습니다
  rationale: 본문은 감정 묘사와 정치적 위기감이 함께 있으므로, 해석을 과도하게 심리화하지 않으면서도 서술의 강도를 유지했습니다.
  doctrine_reference: 본문 주해/서사 해석
