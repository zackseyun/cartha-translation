  lexicon: HALOT
  rationale: דֶּרֶךְ의 기본 이미지를 살리되, 현대 한국어에서 문맥상 '길'이 비유적 삶의 방식과 행위를 충분히 전달하므로 직역에 가깝게 유지했습니다.
- source_word: מַשְׂכִּיל
  english_pob_choice: acting wisely
  chosen_korean: 지혜롭게 행하였고
  alternatives_korean:
