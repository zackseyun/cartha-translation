  alternative_readings:
  - 야훼께서 그와 동행하셨습니다.
  - 야훼께서 그와 함께하셨습니다.
  rationale: 단순한 동반 이상으로 하나님의 호의와 임재를 암시하는 서술이므로, 표준적이면서도 관계적 함의를 담는 '함께 계셨습니다'를 택했습니다.
