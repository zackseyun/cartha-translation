  - 형통하였고
  - 성공하였고
  lexicon: HALOT
  rationale: 이 단어는 분별 있게 행함과 그 결과의 형통을 함께 가질 수 있으나, 문맥의 핵심은 다윗의 신중하고 지혜로운 행위이므로 결과어보다 행위 중심으로 옮겼습니다.
- source_word: וַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
