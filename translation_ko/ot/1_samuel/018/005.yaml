  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א דָוִ֜ד בְּ/כֹל֩ אֲשֶׁ֨ר יִשְׁלָחֶ֤/נּוּ שָׁאוּל֙ יַשְׂכִּ֔יל וַ/יְשִׂמֵ֣/הוּ שָׁא֔וּל עַ֖ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֑ה וַ/יִּיטַב֙ בְּ/עֵינֵ֣י כָל הָ/עָ֔ם וְ/גַ֕ם בְּ/עֵינֵ֖י עַבְדֵ֥י שָׁאֽוּל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/005.yaml
  text: David went out wherever Saul sent him[a], and he acted wisely. So Saul appointed him over the men of war[b], and this was good in the eyes of all the people and also in the eyes of Saul’s servants.
  footnotes:
  - marker: a
    text: Or 'he prospered' / 'he had success' for 'he acted wisely' (Hebrew שׂכל in the Hiphil can carry both prudence and resulting success).
    reason: lexical_alternative
  - marker: b
    text: Or 'it pleased all the people and also Saul’s servants.' The Hebrew may refer either to David himself, to his appointment, or to the whole situation just described.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗은 사울이 보내는 곳마다 나아가 지혜롭게 행했습니다. 그래서 사울은 그를 군사들 위에 세웠고, 이것은 온 백성의 눈에도, 사울의 신하들의 눈에도 좋았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나아가
  alternatives_korean:
  - 나갔습니다
  - 밖으로 나갔습니다
  lexicon: WLC / HALOT
  rationale: 출발·파견의 흐름을 살리되, 한국어에서는 반복 임무 수행의 흐름을 자연스럽게 보이도록 ‘나아가’로 옮겼습니다.
- source_word: בְּכֹל אֲשֶׁר יִשְׁלָחֶנּוּ
  english_pob_choice: wherever Saul sent him
  chosen_korean: 사울이 보내는 곳마다
  alternatives_korean:
  - 사울이 그를 보내는 모든 일에서
  - 사울이 보내는 곳에서
  lexicon: WLC / HALOT
  rationale: 분배적 의미를 담아, 사울의 반복적인 파견을 드러내는 자연스러운 한국어 표현으로 옮겼습니다.
- source_word: יַשְׂכִּיל
  english_pob_choice: he acted wisely
  chosen_korean: 지혜롭게 행했습니다
  alternatives_korean:
  - 형통했습니다
  - 성공했습니다
  - 신중하게 행동했습니다
  lexicon: WLC / HALOT
  rationale: 히필형의 ‘지혜롭게 처신하다’와 그 결과로서의 성공 가능성을 함께 살리기 위해, 행위 중심의 표현을 택했습니다.
- source_word: וַיְשִׂמֵהוּ עַל אַנְשֵׁי הַמִּלְחָמָה
  english_pob_choice: appointed him over the men of war
  chosen_korean: 그를 군사들 위에 세웠고
  alternatives_korean:
  - 그를 군사들 위에 임명했고
  - 그를 전사들 위에 두었고
  lexicon: WLC / HALOT
  rationale: שׂים + עַל의 공식적 임명 의미를 살리되, 고정된 직함처럼 들리지 않도록 ‘세웠고’로 번역했습니다.
- source_word: עַבְדֵי שָׁאוּל
  english_pob_choice: Saul’s servants
  chosen_korean: 사울의 신하들의 눈에도
  alternatives_korean:
  - 사울의 종들의 눈에도
  - 사울의 시종들의 눈에도
  lexicon: WLC / HALOT
  rationale: 왕궁 맥락에서 עבדים는 단순한 개인 종보다 신하·궁정 인원을 가리킬 수 있어, 한국어에서는 위계와 궁정성을 함께 드러내는 ‘신하들’로 옮겼습니다.
