source:
  edition: WLC
  text: וַֽ/תַּעֲנֶ֛ינָה הַ/נָּשִׁ֥ים הַֽ/מְשַׂחֲק֖וֹת וַ/תֹּאמַ֑רְןָ הִכָּ֤ה שָׁאוּל֙ ב/אלפ/ו וְ/דָוִ֖ד בְּ/רִבְבֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/007.yaml
  text: And the women who were celebrating sang responsively[a], saying, “Saul has struck down his thousands[c][b], and David his tens of thousands.”
  footnotes:
  - marker: a
    text: Or “answered one another,” with the sense here likely being antiphonal or responsive singing.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew participle can also suggest festive play, dancing, or merrymaking.
    reason: lexical_alternative
  - marker: c
    text: Or “has slain”; the Hebrew verb literally means “has struck,” here in a military sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 노래하며 응답하던 여자들이 말하였습니다[a]. 「사울은 천천을 치고, 다윗은 만만을 쳤다」[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서로 화답하며’로도 옮길 수 있으며, 여기서는 교창(응답)하는 노래의 뉘앙스가 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사울은 천천을 치고, 다윗은 만만을 쳤다’는 승전가의 병렬 수사로, 숫자 자체보다 대조가 강조됩니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 동사는 문자적으로는 ‘쳤다’이지만, 전쟁 문맥에서는 ‘죽였다/무찔렀다’의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַֽתַּעֲנֶ֛ינָה
  english_pob_choice: sang responsively
  chosen_korean: 노래하며 응답하던
  alternatives_korean:
  - 응답하며 노래하던
  - 화답하며 노래하던
  - 노래로 화답하던
  lexicon: HALOT
  rationale: 단순한 ‘대답하다’보다, 노래를 주고받는 반주적·교창적 뉘앙스가 있으므로 ‘노래하며 응답하던’으로 옮겼습니다.
- source_word: הַנָּשִׁים
  english_pob_choice: the women
  chosen_korean: 여자들이
  alternatives_korean:
  - 여인들이
  - 여자들
  lexicon: HALOT
  rationale: 본문의 일반 명사로서 별도의 격식을 덧붙이지 않고 자연스러운 복수 표현을 택했습니다.
- source_word: הַמְשַׂחֲקוֹת
  english_pob_choice: who were celebrating
  chosen_korean: 응답하던
  alternatives_korean:
  - 즐기던
  - 춤추던
  - 희락하던
  lexicon: HALOT
  rationale: 이 어근은 축제적 즐김, 놀이, 흥겨운 행위를 포괄하므로 한국어에서는 본문 흐름을 해치지 않는 범위에서 반주적 응답 행위에 초점을 두었습니다.
- source_word: הִכָּה
  english_pob_choice: has struck down
  chosen_korean: 쳤다
  alternatives_korean:
  - 쳐서 쓰러뜨렸다
  - 죽였다
  - 베어 넘겼다
  lexicon: HALOT
  rationale: 히브리어 נכה의 기본 뜻은 ‘치다/때리다’이며, 전쟁 맥락에서 패배·살상을 포함할 수 있어, 원어의 직설성을 살리되 현대 한국어에서는 ‘쳤다’로 압축했습니다.
- source_word: בְּרִבְבֹתָיו
  english_pob_choice: his tens of thousands
  chosen_korean: 만만을
  alternatives_korean:
  - 수만을
  - 만의 만을
  - 헤아릴 수 없이 많은 수를
  lexicon: HALOT
  rationale: רבבה의 대칭적 과장 표현을 한국어 관용의 수사로 살려 ‘만만’을 택해, 천천과의 병렬 대비를 유지했습니다.
theological_decisions:
- issue: 전투 보고의 과장된 수사와 비교 구조
  chosen_reading: 사울과 다윗의 수를 실제 집계라기보다 승전 노래의 시적 과장으로 읽고, 한국어에서도 그 병렬과 대조를 그대로 드러냈습니다.
  alternative_readings:
  - 직역하여 숫자형 표현만 남기는 읽기
  - 현대화하여 의미만 풀어 쓰는 읽기
  rationale: 문맥상 군사적 환호의 노래이므로 수사적 대비가 핵심이며, 이를 약화시키지 않는 것이 본문의 의도에 부합합니다.
  doctrine_reference: 시적·서사적 수사 보존 원칙
