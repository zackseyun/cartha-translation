  lexicon: HALOT
  rationale: רבבה의 대칭적 과장 표현을 한국어 관용의 수사로 살려 ‘만만’을 택해, 천천과의 병렬 대비를 유지했습니다.
theological_decisions:
- issue: 전투 보고의 과장된 수사와 비교 구조
  chosen_reading: 사울과 다윗의 수를 실제 집계라기보다 승전 노래의 시적 과장으로 읽고, 한국어에서도 그 병렬과 대조를 그대로 드러냈습니다.
  alternative_readings:
  - 직역하여 숫자형 표현만 남기는 읽기
  - 현대화하여 의미만 풀어 쓰는 읽기
  rationale: 문맥상 군사적 환호의 노래이므로 수사적 대비가 핵심이며, 이를 약화시키지 않는 것이 본문의 의도에 부합합니다.
  doctrine_reference: 시적·서사적 수사 보존 원칙
