source:
  edition: WLC
  text: וַֽ/תַּעֲנֶ֛ינָה הַ/נָּשִׁ֥ים הַֽ/מְשַׂחֲק֖וֹת וַ/תֹּאמַ֑רְןָ הִכָּ֤ה שָׁאוּל֙ ב/אלפ/ו וְ/דָוִ֖ד בְּ/רִבְבֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/007.yaml
  text: And the women who were celebrating sang responsively[a], saying, “Saul has struck down his thousands[c][b], and David his tens of thousands.”
  footnotes:
  - marker: a
    text: Or “answered one another,” with the sense here likely being antiphonal or responsive singing.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew participle can also suggest festive play, dancing, or merrymaking.
    reason: lexical_alternative
  - marker: c
    text: Or “has slain”; the Hebrew verb literally means “has struck,” here in a military sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 흥겹게 즐기던[b] 여인들이 화답하며 이렇게 노래했습니다[a]. “사울은 천천을 치고, 다윗은 만만을 쳤다.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서로 응답했다’로 옮길 수 있습니다. 여기서는 노래를 주고받는 교창 또는 화답의 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘즐기다’라는 뜻으로, 축제의 놀이, 춤, 흥겨운 잔치를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사는 문자적으로는 ‘쳤다’이지만, 전쟁 문맥에서는 ‘죽였다’ 또는 ‘무찔렀다’라는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
