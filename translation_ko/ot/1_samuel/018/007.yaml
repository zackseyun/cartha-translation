  lexicon: HALOT
  rationale: 히브리어 נכה의 기본 뜻은 ‘치다/때리다’이며, 전쟁 맥락에서 패배·살상을 포함할 수 있어, 원어의 직설성을 살리되 현대 한국어에서는 ‘쳤다’로 압축했습니다.
