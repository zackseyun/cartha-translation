  source_fidelity: 첫 문장의 לּוֹ는 ‘그를 위해’가 아니라 ‘그에게’입니다. 또한 ‘블레셋 사람들의 손이 그에게 있게 하겠다’는 히브리어의 적대적 관용구를 충분히 전달하지 못합니다. בִּשְׁתַּיִם은 문맥상 둘째 딸을 가리킬 가능성이 크지만 생략적 표현이므로, 본문과 주석에서 그 대안을 보존해야 합니다.
  naturalness: ‘그를 위해 그녀를 주다’와 ‘손이 그에게 있게 하다’는 현대 표준 한국어로 부자연스럽거나 뜻이 불명확합니다. ‘그에게 그 여자를 주어’와 ‘그를 치게 하여’는 자연스러우면서도 원문의 혼인 및 적대 표현을 유지합니다. ‘둘째로’는 한국어에서도 다소 압축적이지만 주석과 함께 원문의 생략을 보존하는 데 적절합니다.
  terminology: מוֹקֵשׁ는 ‘덫’으로 유지할 수 있습니다. ‘블레셋 사람들의 손’은 원문의 비유를 보존하되, ‘그를 치게 하여’로 적대적 작용을 명시합니다. חתן 관계는 ‘내 사위가 되다’가 정확하고 자연스럽습니다.
