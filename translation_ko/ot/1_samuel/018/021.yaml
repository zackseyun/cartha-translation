source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶתְּנֶ֤/נָּה לּ/וֹ֙ וּ/תְהִי ל֣/וֹ לְ/מוֹקֵ֔שׁ וּ/תְהִי ב֖/וֹ יַד פְּלִשְׁתִּ֑ים וַ/יֹּ֤אמֶר שָׁאוּל֙ אֶל דָּוִ֔ד בִּ/שְׁתַּ֛יִם תִּתְחַתֵּ֥ן בִּ֖/י הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/021.yaml
  text: Then Saul said[a], “I will give her to him, so that she may become a snare to him and the hand of the Philistines may be against him.” So Saul said to David, “By the second one you may become my son-in-law today.”
  footnotes:
  - marker: a
    text: Or “For the second time you may become my son-in-law today.” The Hebrew phrase is elliptical and may refer either to Saul’s second daughter or to a second opportunity for David to marry into Saul’s family.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 사울이 말했습니다. “내가 그에게 그 여자를 주어, 그 여자에게 그를 위한 덫이 되게 하고 블레셋 사람들의 손이 그를 치게 하겠다.” 사울이 다윗에게 말했습니다. “둘째로 너는 오늘 내 사위가 될 수 있다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 생략적입니다. 문맥상 ‘둘째 딸을 통해’라는 뜻으로 이해할 수 있으나, ‘두 번째로 내 사위가 될 수 있다’라는 뜻일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְּנֶנָּה לּוֹ
  english_pob_choice: I will give her to him
  chosen_korean: 내가 그를 위해 그녀를 주겠으니
  alternatives_korean:
  - 내가 그녀를 그에게 주겠으니
  - 내가 그에게 그녀를 결혼시키겠으니
  lexicon: HALOT
  rationale: 딸을 주는 결혼 맥락을 자연스럽게 살리되, 히브리어의 짧은 표현을 지나치게 풀어 쓰지 않기 위해 ‘그를 위해 그녀를 주다’로 옮겼습니다.
- source_word: וּתְהִי לוֹ לְמוֹקֵשׁ
  english_pob_choice: so that she may become a snare to him
  chosen_korean: 그녀가 그에게 덫이 되고
  alternatives_korean:
  - 그녀가 그에게 올무가 되고
  - 그녀가 그에게 함정이 되고
  lexicon: HALOT
  rationale: מוֹקֵשׁ의 이미지인 포획 도구를 한국어의 ‘덫’으로 옮겨 비유를 유지했습니다.
- source_word: וּתְהִי בוֹ יַד פְּלִשְׁתׁים
  english_pob_choice: and the hand of the Philistines may be against him
  chosen_korean: 블레셋 사람들의 손이 그에게 있게 하겠다
  alternatives_korean:
  - 블레셋 사람들의 손이 그를 치게 하겠다
  - 블레셋 사람들의 손이 그 위에 있게 하겠다
  lexicon: HALOT
  rationale: ‘손’은 히브리어의 능력/공격의 관용구를 보존해야 하므로, POB의 이미지를 따라 ‘손이 … 있게 하다’로 옮겼습니다.
- source_word: בִּשְׁתַּיִם תִּתְחַתֵּן בִּי
  english_pob_choice: By the second one you may become my son-in-law
  chosen_korean: 둘째 딸로 너는 오늘 내 사위가 되겠다
  alternatives_korean:
  - 둘째로 너는 오늘 내 사위가 되겠다
  - 둘째 딸을 통해 너는 오늘 내 사위가 되겠다
  lexicon: HALOT
  rationale: 문맥상 ‘둘째 딸’이 뜻하는 바를 드러내어, 엘립시스의 의미를 한국어에서 가장 분명하게 재현했습니다.
theological_decisions:
- issue: 사울의 이중적 발언과 의도
  chosen_reading: 사울의 말은 결혼 제안을 가장한 계략으로, 문장 전체의 목적절과 ‘손’ 관용구를 함께 살려 그의 적대 의도를 드러냈습니다.
  alternative_readings:
  - 단순한 혼인 협상으로 완화하는 읽기
  - 덫/손의 표현을 약화시켜 중립적으로 옮기는 읽기
  rationale: 본문은 다윗을 해치려는 사울의 계산을 분명히 보여 주므로, 이를 희석하지 않고 번역해야 합니다.
  doctrine_reference: 본문 내 서사적 의도에 대한 충실한 반영
