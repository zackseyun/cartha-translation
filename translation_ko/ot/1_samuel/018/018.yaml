  source_fidelity: 히브리어 וּמִי חַיַּי는 문자적으로 ‘나의 삶/생명은 무엇인가’에 가까우나, 이 구절에서는 뒤따르는 ‘내 아버지의 집안’과 함께 다윗 자신의 미미한 처지와 신분을 나타내는 난해한 표현입니다. 본문의 ‘제 생명’은 한국어에서 주로 목숨이라는 뜻으로 읽혀 문맥상 부자연스럽고 의미가 좁아질 수 있습니다. ‘제 삶’은 원문의 표현을 유지하면서도 이 수사적 겸손의 문맥에 더 적절합니다.
  naturalness: ‘제 삶은 무엇이며’가 ‘제 생명은 무엇이며’보다 현대 표준 한국어에서 자연스럽습니다. 나머지 문장은 합쇼체에 맞고, ‘이스라엘에서 제 아버지의 집안’과 ‘왕의 사위’도 명료합니다.
  terminology: מִשְׁפַּחַת אָבִי는 ‘제 아버지의 집안’으로 적절하며, חָתָן לַמֶּלֶךְ은 ‘왕의 사위’로 정확합니다. 난해한 חַיַּי의 문자적 가능성은 각주에서 밝혀 본문이 한 해석으로 과도하게 고정되지 않게 해야 합니다.
