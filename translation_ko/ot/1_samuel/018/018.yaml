base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/018.yaml
  text: And David said to Saul[a], “Who am I, and what is my life, or my father’s family in Israel, that I should become the king’s son-in-law?”
  footnotes:
  - marker: a
    text: Or, more literally, 'and what is my life?' The Hebrew expression may emphasize David's insignificance; the main text renders it in light of the following phrase, 'my father's family in Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 사울에게 말했습니다. 「제가 누구입니까? 제 삶은 무엇이며, 이스라엘에서 제 아버지의 집안은 또 무엇이기에 제가 왕의 사위가 되겠습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘제 생명(들)은 무엇이며’입니다. 이 히브리어 표현의 정확한 뉘앙스는 불확실합니다. 뒤의 ‘제 아버지의 집안’과 함께 다윗 자신의 미미한 처지나 신분을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אָנֹכִי
  english_pob_choice: Who am I
  chosen_korean: 제가 누구입니까?
  alternatives_korean:
  - 제가 무엇입니까?
  - 내가 누구입니까?
  lexicon: HALOT
  rationale: 자기 비하와 겸손을 드러내는 수사적 질문을 현대 한국어 자연스러운 표현으로 옮겼습니다.
- source_word: וּמִי חַיַּי
  english_pob_choice: what is my life
  chosen_korean: 제 생명은 무엇이며
  alternatives_korean:
  - 제 삶은 무엇이며
  - 제 인생은 무엇이며
  lexicon: HALOT
  rationale: POB의 본문 선택처럼 직전의 가족/신분 표현과 병렬을 이루는 문맥을 살려, 단순한 '인생'보다 존재의 미미함을 드러내는 '생명'을 택했습니다.
- source_word: מִשְׁפַּחַת אָבִי בְּיִשְׂרָאֵל
  english_pob_choice: my father’s family in Israel
  chosen_korean: 이스라엘에서 제 아버지의 집안은
  alternatives_korean:
  - 이스라엘에서 제 아버지의 가족은
  - 이스라엘에서 제 아버지의 가문은
  lexicon: HALOT
  rationale: מִשְׁפָּחָה의 친족/가문 범위를 살려, 현대 독자가 이해하기 쉬우면서도 혈연 집단의 낮은 지위를 드러내는 '집안'을 사용했습니다.
- source_word: חָתָן לַמֶּלֶךְ
  english_pob_choice: the king’s son-in-law
  chosen_korean: 왕의 사위가 되겠습니까
  alternatives_korean:
  - 왕의 사위가 되겠습니까
  - 왕의 사위가 되어야 하겠습니까
  lexicon: HALOT
  rationale: חָתָן은 이 문맥에서 왕의 딸과 혼인하여 맺는 사위 관계를 가리키므로, 가장 직접적인 대응어인 '사위'를 택했습니다.
theological_decisions:
- issue: 다윗의 겸손 표현이 단순한 정보 질문인지, 자신의 미미함을 강조하는 수사인지
  chosen_reading: 수사적 겸손 표현으로 처리하여 '제가 누구입니까? 제 생명은 무엇이며…'로 옮겼습니다.
  alternative_readings:
  - 직설적 자기소개로 읽기
  - '''제 삶은 무엇입니까''처럼 완곡하게 옮기기'
  rationale: 히브리어의 병렬 구조와 POB의 주석이 모두 다윗의 신분적 미미함을 강조하므로, 이를 한국어에서도 분명히 드러내는 것이 본문 의도에 가깝습니다.
  doctrine_reference: 서사 본문에 나타나는 겸손의 수사
