  rationale: 문맥상 사울의 두려움과 대조되는 연결이므로 ‘그러나’로 역접을 살렸고, ‘온’으로 כָל의 포괄성을 자연스럽게 반영했습니다.
- source_word: אֹהֵב אֶת דָּוִד
