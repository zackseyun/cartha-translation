lexical_decisions:
- source_word: וְ/כָל יִשְׂרָאֵל וִ/יהוּדָה
  english_pob_choice: But all Israel and Judah
  chosen_korean: 그러나 온 이스라엘과 유다는
  alternatives_korean:
