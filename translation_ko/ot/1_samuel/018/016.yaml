theological_decisions:
- issue: יוֹצֵא וָבָא의 관용적 의미를 본문에 얼마나 풀어쓸지
  chosen_reading: 본문은 관용구를 유지해 ‘나가고 들어왔기 때문입니다’로 번역하고, 지도자적 의미는 주석이 아니라 본문 밖에서 추정되도록 남겨 둡니다.
  alternative_readings:
  - 그들을 이끌고 나가며 들어왔기 때문입니다
  - 공적 지도자로서 앞장섰기 때문입니다
  rationale: 히브리어 본문 자체에는 직접목적어가 없으므로, 지도자적 의미를 본문에 넣으면 원문의 범위를 넘어설 수 있습니다. 따라서 핵심 이미지를 보존하고 해석 가능성은 열어 둡니다.
  doctrine_reference: 본문 충실성 및 해석 여지 보존
