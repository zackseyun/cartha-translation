  text: וַ/תֶּאֱהַ֛ב מִיכַ֥ל בַּת שָׁא֖וּל אֶת דָּוִ֑ד וַ/יַּגִּ֣דוּ לְ/שָׁא֔וּל וַ/יִּשַׁ֥ר הַ/דָּבָ֖ר בְּ/עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/020.yaml
  text: Now Michal[a], Saul's daughter, loved David, and they told Saul, and the matter pleased him.
  footnotes:
  - marker: a
    text: Literally, 'the matter was right/pleasing in his eyes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울의 딸 미갈이 다윗을 사랑하였습니다. 사람들이 사울에게 알렸고, 그 일은 사울의 마음에 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 일이 그의 눈에 옳거나 좋았다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֶּאֱהַב
  english_pob_choice: loved
  chosen_korean: 사랑하였습니다
  alternatives_korean:
  - 사랑했습니다
  - 사랑하였고
  lexicon: HALOT
  rationale: אהב의 기본 의미를 가장 직접적으로 옮겼습니다. ‘사랑에 빠지다’처럼 시작 순간을 덧붙이지 않고, 단순한 사랑의 사실을 담았습니다.
- source_word: מִיכַל בַּת שָׁאוּל
  english_pob_choice: Michal, Saul's daughter
  chosen_korean: 사울의 딸 미갈
  alternatives_korean:
  - 미갈, 사울의 딸
  - 사울 딸 미갈
  lexicon: HALOT
  rationale: 히브리어의 친족 관계를 자연스러운 한국어로 옮기되, 미갈의 신분을 분명히 드러내기 위해 ‘사울의 딸’을 유지했습니다.
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  english_pob_choice: they told Saul
  chosen_korean: 사람들이 사울에게 알렸고
  alternatives_korean:
  - 그들이 사울에게 말했고
  - 사울에게 보고되었고
  lexicon: HALOT
  rationale: 주어가 특정되지 않은 복수형 서술을 살리기 위해 ‘사람들이’로 풀었고, נגד의 기본 뜻을 따라 ‘알리다’로 옮겼습니다.
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינָיו
  english_pob_choice: the matter pleased him
  chosen_korean: 그 일은 그의 눈에 좋게 여겨졌습니다
  alternatives_korean:
  - 그 일은 그에게 좋게 보였습니다
  - 그 일은 그의 판단에 옳았습니다
  lexicon: HALOT
  rationale: 직역적 관용구인 ‘눈에’(בְּעֵינָיו)를 보존하면서도, ישר의 평가적 의미를 살려 ‘좋게 여겨지다’로 옮겼습니다.
theological_decisions:
- issue: ‘그의 눈에’라는 히브리 관용구를 본문에 얼마나 드러낼지
  chosen_reading: 본문에는 ‘그의 눈에 좋게 여겨졌습니다’로 관용구를 살렸습니다.
  alternative_readings:
  - ‘그가 좋아했습니다’로 완전 의역
  - ‘그 일은 사울에게 좋았습니다’로 중간적 표현
  rationale: 원문이 단순한 호감 이상으로 ‘사울의 평가/판단’의 관용을 담고 있으므로, 문학적·신학적 투명성을 위해 관용구를 유지했습니다.
  doctrine_reference: 본문 관찰과 번역 투명성
- issue: מִיכַל의 서술 위치
  chosen_reading: ‘그런데’로 시작해 서술의 전환을 분명히 했습니다.
  alternative_readings:
  - ‘그리고’로 연결
  - 직접적으로 ‘미갈은…’로 시작
  rationale: 앞 절과의 서사 전환을 자연스럽게 드러내되, 원문의 사건 진행을 과장하지 않기 위한 선택입니다.
  doctrine_reference: 서사 흐름 보존
