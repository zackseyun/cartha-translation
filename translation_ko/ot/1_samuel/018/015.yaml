  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֣רְא שָׁא֔וּל אֲשֶׁר ה֖וּא מַשְׂכִּ֣יל מְאֹ֑ד וַ/יָּ֖גָר מִ/פָּנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/015.yaml
  text: When Saul saw that he was very successful[b][a], he was afraid of him.
  footnotes:
  - marker: a
    text: Or 'acted very wisely' or 'prospered greatly.' The Hebrew verb can denote prudent conduct and the success that results from it.
    reason: lexical_alternative
  - marker: b
    text: Literally 'was afraid from before him,' a Hebrew idiom meaning he feared him.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울은 그가 크게 성공하는 것을 보고[a] 그를 두려워했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘매우 지혜롭게 처신하는 것을 보고.’ 히브리어 동사는 지혜롭고 신중하게 행동한다는 뜻과, 그 결과로 성공하거나 번영한다는 뜻을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  english_pob_choice: was very successful
  chosen_korean: 매우 크게 성공하는
  alternatives_korean:
  - 매우 지혜롭게 행동하는
  - 매우 번성하는
  - 매우 현명하게 처신하는
  lexicon: HALOT
  rationale: 이 분사형은 지혜로운 처신과 그 결과로서의 성취를 함께 담을 수 있으나, 본 절의 사울이 본 가시적 결과를 살려 ‘성공하는’으로 옮기되 ‘매우’를 유지해 강도를 반영했습니다.
- source_word: וַיָּגָר מִפָּנָיו
  english_pob_choice: he was afraid of him
  chosen_korean: 그를 두려워했습니다
  alternatives_korean:
  - 그의 앞에서 떨었습니다
  - 그를 무서워했습니다
  - 그에게서 두려움을 느꼈습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘그의 앞에서부터’는 대상을 향한 두려움을 뜻하므로, 자연스러운 현대 한국어로는 ‘그를 두려워했습니다’가 가장 직접적입니다.
- source_word: וַיַּרְא
  english_pob_choice: When Saul saw
  chosen_korean: 사울은 … 보고
  alternatives_korean:
  - 사울이 … 보았을 때
  - 사울은 … 보자
  - 사울이 … 보았고
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 한국어에서는 선행 상황을 나타내는 ‘보고’로 풀어, 앞절의 인지와 뒤절의 반응이 자연스럽게 이어지도록 했습니다.
- source_word: מְאֹד
  english_pob_choice: very
  chosen_korean: 매우 크게
  alternatives_korean:
  - 매우
  - 몹시
  - 지극히
  lexicon: HALOT
  rationale: ‘매우’는 강도를 직설적으로 살리고, 뒤의 ‘성공하는’과 결합해 원문의 강조를 충분히 드러냅니다.
