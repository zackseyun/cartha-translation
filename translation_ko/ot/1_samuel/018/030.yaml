id: 1SA.18.30
reference: 1 Samuel 18:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצְא֖וּ שָׂרֵ֣י פְלִשְׁתִּ֑ים וַ/יְהִ֣י מִ/דֵּ֣י צֵאתָ֗/ם שָׂכַ֤ל דָּוִד֙ מִ/כֹּל֙ עַבְדֵ֣י שָׁא֔וּל וַ/יִּיקַ֥ר שְׁמ֖/וֹ מְאֹֽד׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/030.yaml
  text: Then the commanders of the Philistines went out[a], and as often as they went out, David acted more wisely than all the servants of Saul[c][b], so that his name was highly esteemed.
  footnotes:
  - marker: a
    text: Or 'as often as they went out.'
    reason: lexical_alternative
  - marker: b
    text: Or 'David prospered more' or 'David had more success.' The Hebrew verb can denote prudent action that results in success.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'his name was very precious/honored,' that is, his reputation was highly esteemed.
    reason: lexical_alternative
translation:
  language: ko
  text: 블레셋의 지휘관들이 나갔습니다. 그들이 나갈 때마다 다윗은 사울의 모든 신하보다 더 지혜롭게 처신했습니다[b]. 그 결과 그의 이름은 매우 존중받게 되었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘다윗이 더 번영했습니다’ 또는 ‘다윗이 더 성공했습니다.’ 히브리어 동사는 신중하고 지혜롭게 행동하여 그 결과 성공에 이르는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그의 이름이 매우 귀중하거나 존귀하게 되었다’로, 곧 그의 명성이 크게 존중받게 되었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  english_pob_choice: the commanders of the Philistines
  chosen_korean: 블레셋의 지휘관들
  alternatives_korean:
  - 블레셋의 지도자들
  - 블레셋의 방백들
  lexicon: HALOT
  rationale: שָׂרִים은 통치자나 군 지휘관을 가리킬 수 있는데, 이 문맥에서는 군사적 움직임이므로 ‘지휘관들’이 가장 자연스럽고 정확합니다.
- source_word: מִדֵּי צֵאתָם
  english_pob_choice: as often as they went out
  chosen_korean: 그들이 나갈 때마다
  alternatives_korean:
  - 그들이 나갈 때마다
  - 그들이 나갈 때마다 늘
  lexicon: HALOT
  rationale: 반복되는 상황을 나타내는 표현이므로 ‘~할 때마다’로 옮겨 반복성을 간결하게 살렸습니다.
- source_word: שָׂכַל
  english_pob_choice: acted more wisely
  chosen_korean: 더 지혜롭게 행동했습니다
  alternatives_korean:
  - 더 지혜롭게 처신했습니다
  - 더 잘 처신하여 형통했습니다
  - 더 성공했습니다
  lexicon: HALOT
  rationale: 이 동사는 지혜롭게 행함과 그 결과의 성공을 함께 담을 수 있으므로, 본문이 강조하는 비교적 우위를 살려 ‘더 지혜롭게 행동했습니다’로 옮겼습니다.
- source_word: עַבְדֵי שָׁאוּל
  english_pob_choice: the servants of Saul
  chosen_korean: 사울의 모든 종
  alternatives_korean:
  - 사울의 모든 신하
  - 사울의 모든 부하
  lexicon: HALOT
  rationale: עֲבָדִים은 넓게는 왕을 섬기는 종/신하를 가리키지만, 여기서는 일반적 궁정 종속 관계를 드러내는 ‘종’이 원문에 더 가깝습니다.
- source_word: וַיִּיקַר שְׁמֹו מְאֹד
  english_pob_choice: his name was highly esteemed
  chosen_korean: 그의 이름은 매우 귀하게 여겨졌습니다
  alternatives_korean:
  - 그의 이름은 크게 존중받았습니다
  - 그의 명성이 크게 높아졌습니다
  - 그의 이름은 매우 존귀하게 되었습니다
  lexicon: HALOT
  rationale: ‘이름’은 인격과 평판을 가리키므로, ‘귀하게 여겨졌습니다’가 히브리어의 ‘귀중하다/존귀하다’는 뉘앙스를 살리면서 명성의 의미도 자연스럽게 전달합니다.
theological_decisions:
- issue: דavid의 성공/지혜 동사의 중의성
  chosen_reading: ‘더 지혜롭게 행동했습니다’로 두어, 지혜로운 처신과 그로 인한 성공을 함께 암시했습니다.
  alternative_readings:
  - ‘더 성공했습니다’
  - ‘더 형통했습니다’
  - ‘더 신중하게 행동했습니다’
  rationale: 히브리어 שָׂכַל은 단순 지능이 아니라 지혜로운 행위와 그 결과의 번영을 함께 뜻할 수 있으므로, 한쪽으로만 좁히지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: 사무엘상 18:30 문맥의 서술적 평가
- issue: ‘이름’의 의미
  chosen_reading: ‘그의 이름은 매우 귀하게 여겨졌습니다’로, 명성이 존중받는 상태를 표현했습니다.
  alternative_readings:
  - ‘그의 이름은 매우 존귀해졌습니다’
  - ‘그의 명성이 크게 높아졌습니다’
  rationale: 히브리어에서 ‘이름’은 단순 호칭이 아니라 사람의 평판과 인격적 평가를 가리키므로, 번역에서도 그 사회적·서술적 의미를 유지했습니다.
  doctrine_reference: 고대 히브리어의 명성/이름 관용법
