source:
  edition: WLC
  text: וַֽ/יְדַבְּר֞וּ עַבְדֵ֤י שָׁאוּל֙ בְּ/אָזְנֵ֣י דָוִ֔ד אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יֹּ֣אמֶר דָּוִ֗ד הַֽ/נְקַלָּ֤ה בְ/עֵֽינֵי/כֶם֙ הִתְחַתֵּ֣ן בַּ/מֶּ֔לֶךְ וְ/אָנֹכִ֖י אִֽישׁ רָ֥שׁ וְ/נִקְלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/023.yaml
  text: So Saul’s servants spoke these words in David’s hearing[a], and David said, “Does it seem to you a small thing to become the king’s son-in-law, when I am a poor and lightly regarded man?”
  footnotes:
  - marker: a
    text: Or, 'Do you regard it as insignificant to become related by marriage to the king?'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울의 신하들이 이 말을 다윗의 귀에 전하자, 다윗이 말했습니다. “왕의 사위가 되는 일이 여러분의 눈에는 하찮은 일입니까? 나는 가난하고 천하게 여겨지는 사람인데요.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘왕과 혼인 관계를 맺는 일을 하찮게 여기느냐?’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  english_pob_choice: spoke
  chosen_korean: 전하자
  alternatives_korean:
  - 말하자
  - 이야기하자
  lexicon: HALOT
  rationale: 복수 주어가 ‘이 말들’을 다윗에게 전달하는 장면이므로, 단순한 발화보다 내용 전달의 뉘앙스를 살려 ‘전하자’로 옮겼습니다.
- source_word: בְּאָזְנֵי דָוִד
  english_pob_choice: in David’s hearing
  chosen_korean: 다윗의 귀에
  alternatives_korean:
  - 다윗의 들음 속에
  - 다윗이 듣는 데
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로는 직역에 가까운 ‘귀에’로 살려, 말이 다윗이 들을 수 있는 자리에서 전달되었음을 보여 주었습니다.
- source_word: הַנְקַלָּה בְעֵינֵיכֶם
  english_pob_choice: Does it seem to you a small thing
  chosen_korean: 여러분의 눈에는 하찮은 일입니까?
  alternatives_korean:
  - 여러분 보기에 사소한 일입니까?
  - 여러분에게는 가벼운 일입니까?
  lexicon: HALOT
  rationale: ‘눈에는’의 평가 관용을 유지하면서도, 질문의 수사적 강도를 살려 ‘하찮은 일’로 옮겼습니다.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  english_pob_choice: become the king’s son-in-law
  chosen_korean: 왕의 사위가 되는 일
  alternatives_korean:
  - 왕과 혼인 관계를 맺는 일
  - 왕에게 사위가 되는 일
  lexicon: HALOT
  rationale: חתן의 의미가 이 문맥에서는 ‘왕과 혼인 관계에 들어가는 것’, 곧 왕의 사위가 되는 것이므로 관계를 명시적으로 드러냈습니다.
- source_word: רָשׁ
  english_pob_choice: poor
  chosen_korean: 가난하고
  alternatives_korean:
  - 빈한하고
  - 궁핍하고
  lexicon: HALOT
  rationale: 사회적·경제적 낮은 처지를 직접적으로 드러내는 말로서 가장 자연스러운 한국어 표현을 택했습니다.
- source_word: וְנִקְלֶה
  english_pob_choice: lightly regarded
  chosen_korean: 천하게 여겨지는
  alternatives_korean:
  - 경멸받는
  - 하찮게 여겨지는
  - 천대받는
  lexicon: HALOT
  rationale: ‘lightly regarded’의 평가·사회적 경시 의미를 살리면서, ‘가난하고’와 병렬로 자연스럽게 맞물리는 표현으로 옮겼습니다.
theological_decisions:
- issue: 다윗의 자기 규정에 담긴 사회적 낮아짐의 표현
  chosen_reading: ‘가난하고 천하게 여겨지는 사람’으로 옮겨, 경제적 빈곤과 사회적 경시를 함께 드러냈습니다.
  alternative_readings:
  - ‘가난하고 하찮게 여겨지는 사람’
  - ‘빈곤하고 멸시받는 사람’
  rationale: 본문의 רָשׁ와 נִקְלֶה는 단순한 감정 표현이 아니라 실제적 빈곤과 사회적 비천함을 함께 지시하므로 둘 다 보존했습니다.
  doctrine_reference: 본문 해석상 사회적 낮아짐의 진술
- issue: 수사적 질문의 강도 유지
  chosen_reading: ‘하찮은 일입니까?’로 유지하여, 다윗의 놀람과 거절의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘사소한 일입니까?’
  - ‘별일 아닙니까?’
  rationale: 히브리어 שאלות형 수사는 단순 정보 질문이 아니라 가치판단을 겨냥하므로, 강한 평가어를 써서 원문의 긴장을 보존했습니다.
  doctrine_reference: 수사적 문장 보존
