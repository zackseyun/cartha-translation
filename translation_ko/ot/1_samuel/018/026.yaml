reference: 1 Samuel 18:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּגִּ֨דוּ עֲבָדָ֤י/ו לְ/דָוִד֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יִּשַׁ֤ר הַ/דָּבָר֙ בְּ/עֵינֵ֣י דָוִ֔ד לְ/הִתְחַתֵּ֖ן בַּ/מֶּ֑לֶךְ וְ/לֹ֥א מָלְא֖וּ הַ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/026.yaml
  text: So his servants told David these words[a], and the matter seemed right in David’s eyes, to become the king’s son-in-law[c][b]; and the days had not yet been fulfilled.
  footnotes:
  - marker: a
    text: Or, 'the thing pleased David.' The Hebrew idiom literally says 'the matter was right in David’s eyes.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'to marry into the king’s family.' The Hebrew expression is literally 'to become related by marriage with the king.'
    reason: lexical_alternative
  - marker: c
    text: That is, the allotted time had not yet expired.
    reason: cultural_note
translation:
  language: ko
  text: 그의 신하들이 이 말들을 다윗에게 전하자, 그 일이 다윗의 눈에 옳게 보였습니다. 그래서 그는 왕의 사위가 되려 했으나, 아직 날이 차지 않았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로 ‘그 일이 다윗의 눈에 옳았다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 왕가와 혼인 관계를 맺는다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 즉, 정해진 기간이 아직 끝나지 않았다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 신하들
  alternatives_korean:
  - 그의 종들
  - 그의 시종들
  lexicon: HALOT
  rationale: 왕궁 문맥에서 עֲבָדָיו는 단순한 개인 종들보다 왕의 신하나 시종에 가까우므로, 한국어로는 자연스럽고 위계가 보이는 ‘신하들’이 적절합니다.
- source_word: הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: these words
  chosen_korean: 이 말들
  alternatives_korean:
  - 이 일들
  - 이 제안
  lexicon: HALOT
  rationale: 사울의 제안을 간접화법으로 전달하는 장면이므로, ‘이 말들’이 직접적이며 원문의 구체적인 전달성을 살립니다.
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינֵי דָוִד
  english_pob_choice: the matter seemed right in David’s eyes
  chosen_korean: 그 일이 다윗의 눈에 옳게 보였습니다
  alternatives_korean:
  - 그 일이 다윗에게 좋게 보였습니다
  - 그 제안이 다윗에게 받아들일 만했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈에 옳다’를 가능한 한 살리되, 한국어에서도 읽히도록 ‘옳게 보였습니다’로 옮겼습니다.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  english_pob_choice: to become the king’s son-in-law
  chosen_korean: 왕의 사위가 되려 했으나
  alternatives_korean:
  - 왕의 집안과 혼인 관계를 맺으려 했으나
  - 왕과 혼인 동맹을 맺으려 했으나
  lexicon: HALOT
  rationale: 문맥상 사울의 사위가 되는 뜻이 분명하므로, 관계를 분명히 드러내는 ‘왕의 사위’가 가장 자연스럽고 정확합니다.
- source_word: וְלֹא מָלְאוּ הַיָּמִים
  english_pob_choice: and the days had not yet been completed
  chosen_korean: 아직 날이 차지 않았습니다
  alternatives_korean:
  - 아직 정해진 날이 다 차지 않았습니다
  - 아직 기간이 끝나지 않았습니다
  lexicon: HALOT
  rationale: ‘날이 차다’는 히브리어 מלאו הימים의 관용적 종결 의미를 한국어로 압축해 전달하며, 문맥상 정해진 기간이 아직 끝나지 않았음을 보여 줍니다.
theological_decisions:
- issue: 사울의 제안이 다윗에게 받아들여진 방식
  chosen_reading: 다윗이 이 혼인 제안을 긍정적으로 받아들이는 장면으로 번역했습니다.
  alternative_readings:
  - 단순히 중립적으로 ‘괜찮게 보였다’로 옮길 수 있음
  - 강한 열망을 담아 ‘마음에 들었다’로 옮길 수 있음
  rationale: 원문 ישר בעיני는 판단상 옳고 합당하게 여긴다는 뜻이므로, 감정 과잉 없이 다윗의 수용 의사를 드러내는 쪽이 적절합니다.
  doctrine_reference: 서사 문맥의 의미론적 정확성
