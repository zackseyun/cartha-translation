base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/006.yaml
  text: And it happened[a], as they were coming in, when David returned from striking down the Philistine, that the women came out from all the cities of Israel, singing and dancing, to meet King Saul with tambourines, with joy, and with three-stringed instruments.
  footnotes:
  - marker: a
    text: Hebrew שָׁלִשִׁים is uncertain. It may refer to three-stringed instruments, lutes, or another musical accompaniment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 들어올 때, 곧 다윗이 블레셋 사람을 쳐서 물리치고 돌아오자, 이스라엘의 모든 성읍에서 여인들이 나와 노래하고 춤추며 소고를 치고 기뻐하며 세 줄 악기를 연주하면서 사울 왕을 맞이했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שָׁלִשִׁים은 뜻이 분명하지 않습니다. 세 줄 악기, 류트 같은 악기, 또는 다른 음악 반주를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그들이 들어올 때
  alternatives_korean:
  - 그런 일이 있었습니다
  - 그 일이 일어났습니다
  lexicon: HALOT
  rationale: 서사 도입의 wayyiqtol을 한국어로 자연스럽게 풀되, 앞뒤 시간절에 맞춰 장면 전환 기능을 살렸습니다.
- source_word: וַתֵּצֶאנָה הַנָּשִׁים
  english_pob_choice: the women came out
  chosen_korean: 여자들이 나와
  alternatives_korean:
  - 여인들이 나와
  - 여자들이 밖으로 나와
  lexicon: HALOT
  rationale: 도시들에서 나온 주체를 직역에 가깝게 옮기되, 현대 한국어에서 자연스러운 ‘나와’를 썼습니다.
- source_word: בְּתֻפִּים בְּשִׂמְחָה
  english_pob_choice: with tambourines, with joy
  chosen_korean: 소고를 치고 기뻐하며
  alternatives_korean:
  - 탬버린을 치며 기쁨으로
  - 소고와 기쁨으로
  lexicon: HALOT
  rationale: פֹּף 계열 악기는 한국어 성경 전통에서도 통용되는 ‘소고’가 자연스럽고, 병렬된 부사구는 동작 연쇄로 풀어 원문의 리듬을 살렸습니다.
- source_word: וּבְשָׁלִשִׁים
  english_pob_choice: with three-stringed instruments
  chosen_korean: 세 줄 악기를 연주했습니다
  alternatives_korean:
  - 세 줄 현악기를 연주했습니다
  - 삼현금을 연주했습니다
  lexicon: HALOT
  rationale: שָׁלִשִׁים의 뜻이 불확실하므로, POB의 ‘three-stringed instruments’에 맞춰 가능한 범위 안에서 직역적으로 유지했습니다.
theological_decisions:
- issue: וַיְהִי의 서사 도입과 시간절 처리
  chosen_reading: 직역형 ‘그 일이 있었습니다’보다, 이어지는 시간절을 앞세운 ‘그들이 들어올 때’로 장면의 진행을 자연스럽게 드러냈습니다.
  alternative_readings:
  - 그런 일이 있었습니다
  - 그 일이 일어났습니다
  rationale: 본문의 초점은 사건 설명 자체보다 다윗의 귀환과 그에 따른 여성들의 출현이므로, 한국어에서도 서사 흐름이 가장 잘 드러나는 방식으로 옮겼습니다.
  doctrine_reference: 서사체의 담화 기능 보존
