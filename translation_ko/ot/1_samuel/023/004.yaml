  yaml_path: translation/ot/1_samuel/023/004.yaml
  text: David again inquired of the LORD, and the LORD answered him and said, “Rise, go down to Keilah, for I am giving the Philistines into your hand.”
translation:
  language: ko
  text: 다윗이 다시 야훼께 여쭈었고, 야훼께서 그에게 대답하시며 말씀하셨습니다. 「일어나서 그일라로 내려가라. 내가 블레셋 사람들을 네 손에 넘겨주고 있기 때문이다.」
  philosophy: formal
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד דָּוִד לִשְׁאֹל
  english_pob_choice: David again inquired
  chosen_korean: 다윗이 다시 야훼께 여쭈었고
  alternatives_korean:
  - 다윗이 다시 야훼께 물었고
  - 다윗이 또 야훼께 여쭈었고
  lexicon: שׁאל
  rationale: שׁאל은 단순한 질문보다 신적 응답을 구하는 행위이므로, 존대 동사 ‘여쭈다’로 자연스럽게 옮기되 ‘다시’를 살려 반복성을 반영했습니다.
- source_word: בַּיהוָה / יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: יהוה
  rationale: 본문의 신명 표지는 המקרא의 원문 신명으로 보고, POB 기본 원칙에 따라 학술적 표기 ‘야훼’를 사용했습니다.
- source_word: קוּם רֵד
  english_pob_choice: Rise, go down
  chosen_korean: 일어나서 ... 내려가라
  alternatives_korean:
  - 일어나 내려가라
  - 일어나 가라
  lexicon: קום / ירד
  rationale: 두 명령을 모두 살려 이동 방향의 긴박함을 보존했고, ‘내려가다’는 지리적 하강을 반영합니다.
- source_word: פְּלִשְׁתִּים בְּיָדֶךָ
  english_pob_choice: the Philistines into your hand
  chosen_korean: 블레셋 사람들을 네 손에 넘겨주고 있기 때문이다
  alternatives_korean:
  - 블레셋 사람들을 네 손에 주고 있기 때문이다
  - 블레셋 사람들을 네가 차지하게 하기 때문이다
  lexicon: ידי / נתן
  rationale: 히브리어 관용구 ‘손에 넘기다’를 직역해 전투적 통제와 승리를 드러내되, 한국어로는 ‘넘겨주다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 야훼의 직접 음성 명령의 문체
  chosen_reading: 직접 인용문 안에서는 왕/지도자에게 주어지는 명령형을 그대로 살려 「일어나서 그일라로 내려가라」로 옮겼습니다.
  alternative_readings:
  - 「일어나서 그일라로 내려가십시오」
  - 「일어나 그일라로 내려가라」
  rationale: 히브리어 직설 명령의 힘을 유지하면서, 본문이 다윗에게 주는 신적 지시의 권위를 약화시키지 않도록 했습니다.
  doctrine_reference: divine speech register
- issue: ‘네 손에’의 승리 약속
  chosen_reading: ‘손에 넘겨주다’라는 관용을 유지해 전쟁의 승리와 주권적 개입을 함께 드러냈습니다.
  alternative_readings:
  - ‘네가 이기게 하다’
  - ‘네가 차지하게 하다’
  rationale: 본문은 단순한 결과 예고가 아니라 야훼의 주권적 베풂을 말하므로, 승리의 주체가 하나님임을 드러내는 표현을 택했습니다.
  doctrine_reference: divine sovereignty
