  yaml_path: translation/ot/1_samuel/023/015.yaml
  text: David saw that Saul had come out to seek his life[a], while David was in the wilderness of Ziph at Horesh.
  footnotes:
  - marker: a
    text: Or 'in the forest' or 'in the wooded place.' The Hebrew may be understood as a common noun, but here it is likely a place name, Horesh.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 사울이 다윗의 목숨을 노리려고 나왔음을 보았습니다. 다윗은 십 광야 호레사에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호레사’는 ‘숲’ 또는 ‘나무가 우거진 곳’을 뜻하는 일반명사로도 이해될 수 있습니다. 그러나 여기서는 지명일 가능성이 높습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: saw
  chosen_korean: 보았습니다
  alternatives_korean:
  - 알아차렸습니다
  - 깨달았습니다
  lexicon: HALOT
  rationale: ראה는 기본적으로 ‘보다’이므로, 다윗의 인지를 직접적으로 드러내는 ‘보았습니다’가 원문의 감각을 가장 잘 보존합니다.
- source_word: לְבַקֵּשׁ אֶת נַפְשׁוֹ
  english_pob_choice: to seek his life
  chosen_korean: 자기의 생명을 찾으려고
  alternatives_korean:
  - 그를 죽이려고
  - 그의 목숨을 찾으려고
  lexicon: HALOT
  rationale: ‘생명을 찾다’는 히브리어 관용구를 따라가되, 한국어에서도 위협의 의미가 드러나도록 직역에 가깝게 옮겼습니다.
- source_word: בְּמִדְבַּר זִיף
  english_pob_choice: in the wilderness of Ziph
  chosen_korean: 십 광야
  alternatives_korean:
  - 지프 광야
  - 십의 광야
  lexicon: HALOT
  rationale: 지명 זִיף은 성서 인명·지명 관용을 따라 ‘십’으로 옮겼고, מִדְבָּר는 표준적으로 ‘광야’로 번역했습니다.
- source_word: בַּחֹרְשָׁה
  english_pob_choice: at Horesh
  chosen_korean: 호레시
  alternatives_korean:
  - 숲
  - 숲이 우거진 곳
  lexicon: HALOT
  rationale: 영어 POB의 오디트처럼 여기서는 일반 명사보다 지명으로 이해하는 것이 타당하므로, 장소명 ‘호레시’로 처리했습니다.
