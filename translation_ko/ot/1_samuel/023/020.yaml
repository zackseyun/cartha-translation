  text: 이제, 왕이여, 왕께서 내려오시고자 하시는 모든 대로[a] 내려오십시오.[b] 그를 왕의 손에 넘겨드리는 것은 우리의 몫입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘당신의 영혼의 모든 갈망’이라고 하며, 깊은 바람이나 간절한 소원을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘내려오다’를 부정사와 명령형으로 함께 써서 강조합니다. 직역하면 ‘내려오고자, 내려오십시오’입니다.
    reason: lexical_alternative
