  text: וְ֠/עַתָּה לְ/כָל אַוַּ֨ת נַפְשְׁ/ךָ֥ הַ/מֶּ֛לֶךְ לָ/רֶ֖דֶת רֵ֑ד וְ/לָ֥/נוּ הַסְגִּיר֖/וֹ בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/020.yaml
  text: Now then[a], O king, come down according to all the desire of your soul to come down[b], and it is for us to hand him over into the king’s hand.
  footnotes:
  - marker: a
    text: Hebrew 'the desire of your soul,' an idiom meaning deep desire or strong wish; compare 'your heart’s desire.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew repeats the verb ''come down'' (infinitive + imperative) for emphasis: ''to come down, come down.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 왕이여, 당신의 영혼의 모든 바람대로 내려오십시오. 내려오십시오. 그리고 그를 왕의 손에 넘겨줄 것은 우리입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘당신의 영혼의 바람/갈망’이라는 관용구를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘내려오다’를 부정사와 명령형으로 반복해 요청을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now then
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 이제 그러므로
  lexicon: HALOT
  rationale: 즉각적인 전환과 청원을 여는 담화 표지이므로, 간결한 「이제」가 가장 자연스럽고 기능을 잘 살립니다.
- source_word: אַוַּת נַפְשְׁךָ
  english_pob_choice: the desire of your soul
  chosen_korean: 당신의 영혼의 모든 바람
  alternatives_korean:
  - 당신의 마음의 소원
  - 당신의 영혼의 소원
  lexicon: HALOT
  rationale: 히브리어의 내적 갈망 이미지를 살리되 한국어에서 다소 자연스럽게 옮기기 위해 「영혼의 바람」을 택했습니다.
- source_word: לָרֶדֶת רֵד
  english_pob_choice: come down ... to come down
  chosen_korean: 내려오십시오. 내려오십시오.
  alternatives_korean:
  - 내려오십시오
  - 내려오십시오, 곧 내려오십시오
  lexicon: HALOT
  rationale: 부정사+명령형의 반복으로 강조를 이루므로, 같은 동사를 반복해 요청의 강도를 드러냈습니다.
- source_word: הַסְגִּירוֹ
  english_pob_choice: to hand him over
  chosen_korean: 넘겨줄 것은
  alternatives_korean:
  - 내줄 것은
  - 그에게 넘길 것은
  lexicon: HALOT
  rationale: סגר의 사역형은 적대적 ‘인도/양도’의 의미이므로, 현대 한국어의 「넘겨주다」로 옮겨 주었습니다.
theological_decisions:
- issue: 왕에 대한 정중한 직접 호칭과 명령의 혼합
  chosen_reading: 직접 호칭은 「왕이여」로, 명령은 공손한 청유/명령형 「내려오십시오」로 옮겼습니다.
  alternative_readings:
  - 왕이시여 내려오소서
  - 왕님, 내려오십시오
  rationale: 본문은 다윗 일행이 사울에게 하는 정중한 요청이므로, 한국어 합쇼체로 위계를 보존하되 과도하게 종교화된 표현은 피했습니다.
  doctrine_reference: 담화-화용 및 번역 관습
