- from: 그러므로 모든 숨는 곳들에서 그가 숨어 있는 곳을 알아내십시오. 그러면 확실하게 제게 돌아오십시오. 그러면 제가 여러분과 함께 가겠습니다. 그리고 그가 그 땅에 있으면, 제가 유다의 모든 천천 가운데서 그를 찾아내겠습니다.[a]
  to: 그가 숨어 있는 모든 은신처를 살펴보고 알아내십시오. 그리고 확실한 정보를 가지고 제게 돌아오십시오. 그러면 제가 여러분과 함께 가겠습니다. 그가 그 땅에 있으면, 제가 유다의 모든 씨족 가운데서 그를 찾아내겠습니다.[a]
  rationale: 원문의 병렬된 조사 명령을 ‘살펴보고 알아내십시오’로 보존하고, 확실성의 의미를 ‘확실한 정보를 가지고’로 명확히 했습니다. ‘천천’이라는 비표준적이고 모호한 직역은 문맥상 자연스러운 ‘씨족’으로 바꾸되, 히브리어의 문자적 표현과 가능한 사회 단위 의미는 주석에 보존했습니다. 조건절과 ‘찾아내다’의 적극적인 수색 의미는 유지했습니다.
