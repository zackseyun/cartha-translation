  source_fidelity: 첫 두 명령은 각각 ‘살피다/보다’와 ‘알아내다’의 조사 명령이므로, 초안의 ‘알아내십시오’만으로는 첫 동사의 의미가 빠집니다. 또한 אֶל נָכוֹן은 단순히 ‘확실하게’ 돌아오라는 뜻보다 확인된 확실한 정보를 가지고 돌아오라는 뜻으로 옮기는 것이 적절합니다. אַלְפֵי יְהוּדָה는 문자적으로 ‘유다의 모든 천(千)들’이지만 이 문맥에서는 씨족·사회 단위를 가리킬 가능성이 높으므로, 본문에서는 자연스러운 ‘씨족’으로 번역하고 문자적 표현을 주석으로 보존합니다.
  naturalness: ‘모든 숨는 곳들에서 그가 숨어 있는 곳’과 ‘천천’은 현대 표준 한국어에서 부자연스럽거나 의미가 불명확합니다. 특히 ‘천천’은 일반적으로 ‘천천히’의 준말로도 읽힐 수 있습니다. ‘그가 숨어 있는 모든 은신처’ 및 ‘유다의 모든 씨족’이 자연스럽고 명료합니다.
  terminology: ‘은신처’는 מַחֲבֹאִים에 알맞으며, ‘씨족’은 אַלְפֵי의 문맥상 사회 단위 의미를 무리 없이 전달합니다. 주석에서 히브리어의 문자적 ‘천들’을 밝혀 의미 범위와 해석상 여지를 보존합니다.
