  text: See and find out from all the hiding places where he hides there, then return to me with certainty, and I will go with you. And if he is in the land, I will search him out among all the clans of Judah.
  footnotes:
  - marker: a
    text: Hebrew 'all the thousands of Judah,' likely referring to clan or family divisions within Judah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 숨어 있는 모든 은신처를 살펴보고 알아내십시오. 그리고 확실한 정보를 가지고 제게 돌아오십시오. 그러면 제가 여러분과 함께 가겠습니다. 그가 그 땅에 있으면, 제가 유다의 모든 씨족 가운데서 그를 찾아내겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘유다의 모든 천들’이며, 여기서 ‘천들’은 씨족이나 가문 단위와 같은 사회적 집단을 가리킬 수 있습니다.
    reason: lexical_alternative
