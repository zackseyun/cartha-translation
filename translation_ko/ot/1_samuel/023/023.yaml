  text: וּ/רְא֣וּ וּ/דְע֗וּ מִ/כֹּ֤ל הַ/מַּֽחֲבֹאִים֙ אֲשֶׁ֣ר יִתְחַבֵּ֣א שָׁ֔ם וְ/שַׁבְתֶּ֤ם אֵלַ/י֙ אֶל נָכ֔וֹן וְ/הָלַכְתִּ֖י אִתְּ/כֶ֑ם וְ/הָיָה֙ אִם יֶשְׁנ֣/וֹ בָ/אָ֔רֶץ וְ/חִפַּשְׂתִּ֣י אֹת֔/וֹ בְּ/כֹ֖ל אַלְפֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/023.yaml
  text: See and find out from all the hiding places where he hides there, then return to me with certainty, and I will go with you. And if he is in the land, I will search him out among all the clans of Judah.
  footnotes:
  - marker: a
    text: Hebrew 'all the thousands of Judah,' likely referring to clan or family divisions within Judah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 모든 숨는 곳들에서 그가 숨어 있는 곳을 알아내십시오. 그러면 확실하게 제게 돌아오십시오. 그러면 제가 여러분과 함께 가겠습니다. 그리고 그가 그 땅에 있으면, 제가 유다의 모든 천천 가운데서 그를 찾아내겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘유다의 모든 천천’은 종족이나 가문 단위를 가리킬 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאוּ וּדְעוּ
  english_pob_choice: See and find out
  chosen_korean: 알아내십시오
  alternatives_korean:
  - 살펴보십시오
  - 보고 알아보십시오
  - 조사하십시오
  lexicon: HALOT
  rationale: 두 명령형의 조사적 힘을 한국어에서 자연스럽게 묶어, 단순한 시각 확인보다 정보 탐색의 뉘앙스를 살렸습니다.
- source_word: מִכֹּל הַמַּחֲבֹאִים
  english_pob_choice: from all the hiding places
  chosen_korean: 모든 숨는 곳들에서
  alternatives_korean:
  - 모든 은신처에서
  - 모든 숨어 있는 곳에서
  - 모든 피신처에서
  lexicon: HALOT
  rationale: מַחֲבֹא의 ‘숨는 곳/은신처’ 의미를 반영하되, 한국어에서는 복수성과 조사 출발점을 분명히 하도록 풀어 옮겼습니다.
- source_word: אֶל נָכוֹן
  english_pob_choice: with certainty
  chosen_korean: 확실하게
  alternatives_korean:
  - 확실한 정보와 함께
  - 틀림없이
  - 정확하게
  lexicon: HALOT
  rationale: נָכוֹן의 ‘확고함/확실성’ 기능을 한국어 부사로 자연스럽게 재현하여, 확인된 정보에 근거한 귀환을 드러냈습니다.
- source_word: בְּכֹל אַלְפֵי יְהוּדָה
  english_pob_choice: among all the clans of Judah
  chosen_korean: 유다의 모든 천천 가운데서
  alternatives_korean:
  - 유다의 모든 종족 가운데서
  - 유다의 모든 천들 가운데서
  - 유다의 모든 씨족 가운데서
  lexicon: HALOT
  rationale: אַלְפֵי의 문자적 의미인 ‘천천’을 살리되, 주석 없이도 군집 단위를 보존해 원문 표현의 긴장과 잠재적 함의를 유지했습니다.
theological_decisions:
- issue: אַלְפֵי יְהוּדָה의 사회단위 표현을 전통적 ‘종족/씨족’으로 완전히 평탄화할지 여부
  chosen_reading: ‘유다의 모든 천천’으로 직역에 가깝게 유지하고, 원문이 말하는 집단 단위를 한국어에서도 드러냈습니다.
  alternative_readings:
  - 유다의 모든 종족
  - 유다의 모든 씨족
  - 유다의 모든 천 개 집단
  rationale: 이 표현은 단순 수량이 아니라 사회·가문 단위를 가리킬 가능성이 있어, 전통적 완역보다 원문 긴장을 보존하는 쪽이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 민족/가문 구조에 대한 본문 관찰; 사전적·주해적 보존 원칙
