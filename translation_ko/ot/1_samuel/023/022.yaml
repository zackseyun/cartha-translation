  source_fidelity: 현 번역은 정탐 지시의 큰 흐름과 ‘매우 간교하다’라는 강조를 대체로 보존합니다. 그러나 אָמַר אֵלַי의 3인칭 단수 발화자를 ‘그가 말하기를’로 옮기면서, 주어가 본문에서 명시되지 않았다는 각주의 설명과 충돌합니다. 또한 ‘그의 발이 있는 곳’ 관용구에 관한 각주가 ‘더 준비하고’에 붙어 있어 앵커가 잘못되었습니다.
  naturalness: ‘알고 살펴서’와 ‘누가 거기서 그를 보았는지 알아보십시오’는 이해 가능하나, 한국어 명령문에서는 ‘알아보고 살피며’와 ‘누가 그곳에서 그를 보았는지도 알아보십시오’가 더 자연스럽고, 두 탐문 동사의 누적도 유지합니다. ‘그가 말하기를’은 이 문맥에서 부자연스럽고 주어 해석을 고정합니다.
  terminology: ‘간교하다’는 עָרוֹם יַעְרִם의 부정적인 교활함과 강조를 적절히 전달합니다. ‘그가 발을 둘 곳’은 문자적 발의 이미지를 유지하면서 행방·이동의 관용적 의미를 자연스럽게 드러냅니다.
