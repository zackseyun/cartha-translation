id: 1SA.23.22
reference: 1 Samuel 23:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְכוּ נָ֞א הָכִ֣ינוּ ע֗וֹד וּ/דְע֤וּ וּ/רְאוּ֙ אֶת מְקוֹמ/וֹ֙ אֲשֶׁ֣ר תִּֽהְיֶ֣ה רַגְל֔/וֹ מִ֥י רָאָ֖/הוּ שָׁ֑ם כִּ֚י אָמַ֣ר אֵלַ֔/י עָר֥וֹם יַעְרִ֖ם הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/022.yaml
  text: Please go and make further preparations[a], and know and see his place where his foot is, who has seen him there; for I am told[c][b], ‘He is very cunning.’
  footnotes:
  - marker: a
    text: Literally, 'where his foot is,' an idiom for his whereabouts or movements.
    reason: lexical_alternative
  - marker: b
    text: Or, 'for he said to me'; the Hebrew does not explicitly identify the subject of 'said.'
    reason: alternative_reading
  - marker: c
    text: Hebrew uses a cognate expression, literally something like 'cunningly he acts cunning,' for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: “가서 더 준비하고[a], 그의 발이 있는 곳을 알고 살펴서, 누가 거기서 그를 보았는지 알아보십시오. 그가 말하기를, ‘그는 매우 간교하다’고 하였습니다[b][c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 발이 있는 곳’으로, 그의 행방이나 이동을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그가 나에게 말하였다’에 해당하는 표현이지만, 문맥상 발화 주어가 분명히 드러나지 않습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 같은 어근을 겹쳐 써서 ‘매우 간교하다’는 뜻을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכִינוּ עוֹד
  english_pob_choice: make further preparations
  chosen_korean: 더 준비하고
  alternatives_korean:
  - 더 예비하고
  - 계속 준비하고
  lexicon: HALOT
  rationale: הכין의 히필은 ‘준비하다/갖추다’의 뜻이고, עוֹד가 더함을 나타내므로 ‘더 준비하고’가 간결하면서도 추가 준비의 의미를 살립니다.
- source_word: וּדְעוּ וּרְאוּ
  english_pob_choice: know and see
  chosen_korean: 알고 살펴서
  alternatives_korean:
  - 알아보고 살펴서
  - 알고 보십시오
  lexicon: HALOT
  rationale: 두 명령형의 누적된 탐색 의미를 살리되, 한국어에서는 자연스럽게 ‘알고 살펴서’로 옮겨 조사·확인의 강도를 유지했습니다.
- source_word: מְקוֹמוֹ / אֲשֶׁר תִּהְיֶה רַגְלוֹ
  english_pob_choice: his place where his foot is
  chosen_korean: 그의 발이 있는 곳
  alternatives_korean:
  - 그의 발이 닿는 곳
  - 그가 서 있는 곳
  lexicon: HALOT
  rationale: מקום의 3인칭 소유격과 ‘발이 있는 곳’이라는 관용구를 함께 반영해, 위치를 뜻하는 동시에 이동 경로의 뉘앙스를 보존했습니다.
- source_word: עָרוֹם יַעְרִם הוּא
  english_pob_choice: He is very cunning
  chosen_korean: 그는 매우 간교하다
  alternatives_korean:
  - 그는 매우 교활하다
  - 그는 몹시 술수가 많다
  lexicon: HALOT
  rationale: 어근의 반복이 강조하는 부정적 영리함을 한국어에서 가장 직접적으로 드러내는 말로 ‘간교하다’를 택했습니다.
theological_decisions:
- issue: 직접화법 안의 보고 표현과 비판적 평가의 톤
  chosen_reading: 사울의 지시와 인용된 평가를 분리해, 보고 동사 ‘말하기를 … 하였습니다’로 전달하고 ‘매우 간교하다’의 부정적 판단은 그대로 유지했습니다.
  alternative_readings:
  - ‘그는 아주 영리하다’로 완화하기
  - 인용부를 서술문으로 바꾸기
  rationale: 본문은 첩보 지시와 대상에 대한 경계심을 함께 드러내므로, 평가의 날을 무디게 하지 않고 보고 체계도 흐리지 않는 번역이 필요합니다.
  doctrine_reference: 본문의 역사서 서술과 인물 평가의 보존
