base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/001.yaml
  text: Then they told David[a], saying, “Look, the Philistines are fighting against Keilah, and they are plundering the threshing floors.”
  footnotes:
  - marker: a
    text: Or “are fighting in/at Keilah.” The Hebrew preposition is literally “in,” but in this military context it likely means the Philistines are attacking the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사람들이 다윗에게 말했습니다. 「보십시오, 블레셋 사람들이 그일라를 공격하고[a] 있으며, 타작마당들을 약탈하고 있습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사는 문자적으로 ‘그일라에서/그일라에’입니다. 군사 문맥에서는 ‘그일라를 공격하고’로 이해할 수 있지만, ‘그일라에서 싸우고’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  english_pob_choice: Then they told David, saying
  chosen_korean: “사람들이 다윗에게 말했습니다.”
  alternatives_korean:
  - 그들이 다윗에게 알렸습니다
  - 다윗에게 보고했습니다
  lexicon: HALOT
  rationale: 서술 진행을 살리면서 גם ‘알리다/보고하다’의 정보 전달 기능을 반영할 수 있으나, 여기서는 직접화법 도입이 자연스러운 ‘말했습니다’로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기
  lexicon: HALOT
  rationale: 급박한 보고를 여는 지시어로, 현대 한국어에서는 ‘보십시오’가 공손하면서도 주의를 환기하는 효과를 잘 살립니다.
- source_word: נִלְחָמִים בִּקְעִילָה
  english_pob_choice: are fighting against Keilah
  chosen_korean: 그일라를 공격하고 있으며
  alternatives_korean:
  - 그일라에서 싸우고 있으며
  - 그일라와 전쟁하고 있으며
  lexicon: HALOT
  rationale: 전치사 בְּ의 문자값은 ‘안에서/에’이지만, 전쟁 맥락에서는 도시를 향한 공격을 뜻하므로 ‘공격하고 있으며’로 옮겨 문맥적 힘을 드러냈습니다.
- source_word: שֹׁסִים אֶת הַגֳּרָנוֹת
  english_pob_choice: are plundering the threshing floors
  chosen_korean: 타작마당들을 약탈하고 있습니다
  alternatives_korean:
  - 타작마당들을 노략질하고 있습니다
  - 타작마당을 빼앗고 있습니다
  lexicon: HALOT
  rationale: שׁסס/שׁסה의 약탈·노략 의미를 살려 전시 약탈 행위를 분명히 했고, הַגֳּרָנוֹת는 구체적 설치물인 ‘타작마당들’로 옮겼습니다.
theological_decisions:
- issue: 블레셋의 행위를 지리적 ‘그일라 안에서’로 둘지, 공격 대상으로 풀지
  chosen_reading: ‘그일라를 공격하고 있으며’로 옮겨 도시가 공격받는 상황을 분명히 했습니다.
  alternative_readings:
  - ‘그일라에서 싸우고 있으며’
  - ‘그일라 안에서 전쟁하고 있으며’
  rationale: 히브리어 전치사 בְּ는 문자적으로 ‘안에서’이지만, 이 장면에서는 성읍이 침공당하는 군사적 상황을 나타내므로 수신자가 사건의 의미를 즉시 이해하도록 했습니다.
  doctrine_reference: 문맥 우선의 역사서 번역 원칙
