  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֨שֶׁב דָּוִ֤ד בַּ/מִּדְבָּר֙ בַּ/מְּצָד֔וֹת וַ/יֵּ֥שֶׁב בָּ/הָ֖ר בְּ/מִדְבַּר זִ֑יף וַ/יְבַקְשֵׁ֤/הוּ שָׁאוּל֙ כָּל הַ/יָּמִ֔ים וְ/לֹֽא נְתָנ֥/וֹ אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/014.yaml
  text: David stayed in the wilderness strongholds[a], and he stayed in the hill country in the wilderness of Ziph. Saul sought him all the days, but God did not give him into his hand.
  footnotes:
  - marker: a
    text: 'Or ''did not hand him over to Saul.'' Hebrew: ''did not give him into his hand.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 광야의 요새들에 머물렀고, 또 십 광야의 산지에 머물렀습니다. 사울은 그를 모든 날에 찾았지만, 하나님은 그를 그의 손에 넘겨주지 않으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 사울에게 넘겨주지 않으셨습니다.’ 히브리어는 문자적으로 ‘그를 그의 손에 주지 않으셨다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: stayed
  chosen_korean: 머물렀고
  alternatives_korean:
  - 살았고
  - 거하였고
  - 있었고
  lexicon: HALOT
  rationale: ישׁב는 ‘앉다’보다 ‘거주하다/머물다/있다’의 뜻이 자연스러우므로, 서술 흐름에 맞는 ‘머물렀고’로 옮겼습니다.
- source_word: בַּמִּדְבָּר בַּמְּצָדוֹת
  english_pob_choice: in the wilderness strongholds
  chosen_korean: 광야의 요새들에
  alternatives_korean:
  - 광야의 산성들에
  - 광야의 피난처들에
  lexicon: HALOT
  rationale: מְצָדוֹת는 방어가 가능한 요새/성채를 가리키므로, 군사적·방어적 뉘앙스를 살려 ‘요새들’로 옮겼습니다.
- source_word: בָּהָר בְּמִדְבַּר זִיף
  english_pob_choice: in the hill country in the wilderness of Ziph
  chosen_korean: 십 광야의 산지에
  alternatives_korean:
  - 십 광야의 산악 지대에
  - 십 광야의 산중에
  lexicon: HALOT
  rationale: הַר는 이 문맥에서 단일한 ‘산’보다 지역적 지형을 가리키는 ‘산지’가 더 자연스러워, ‘십 광야의 산지’로 정리했습니다.
- source_word: וַיְבַקְשֵׁהוּ
  english_pob_choice: sought him
  chosen_korean: 그를 … 찾았지만
  alternatives_korean:
  - 그를 찾았지만
  - 그를 계속 찾았지만
  lexicon: HALOT
  rationale: בקשׁ는 여기서 지속적 추적의 의미를 가지므로, 앞절의 ‘모든 날에’와 함께 ‘찾다’로 자연스럽게 살렸습니다.
- source_word: וְלֹא נְתָנ֥וֹ אֱלֹהִים בְּיָדוֹ
  english_pob_choice: but God did not give him into his hand
  chosen_korean: 하나님은 그를 그의 손에 넘겨주지 않으셨습니다
  alternatives_korean:
  - 하나님은 그를 그의 손에 주지 않으셨습니다
  - 하나님은 그를 그의 손아귀에 넘기지 않으셨습니다
  lexicon: HALOT
  rationale: ‘into his hand’는 히브리어 관용구이므로, 직역을 유지하되 한국어에서 의미가 분명하도록 ‘넘겨주다’로 풀었습니다.
theological_decisions:
- issue: ‘손에’라는 관용구의 보존
  chosen_reading: 사울의 권세 아래로 넘겨지지 않았다는 뜻을 드러내면서도, 원문의 ‘손’ 이미지는 그대로 살렸습니다.
  alternative_readings:
  - ‘사울에게 넘겨주지 않으셨습니다’로 평면화하는 방식
  - ‘그의 손아귀에 넘기지 않으셨습니다’로 의역하는 방식
  rationale: 본문은 하나님의 섭리적 보호를 관용구로 표현하므로, 한국어에서도 이미지와 의미를 함께 유지하는 편이 원문의 힘을 더 잘 드러냅니다.
  doctrine_reference: 섭리와 보호, 본문 이미지 보존
- issue: הָר / מְצָדוֹת의 지형 표현
  chosen_reading: ‘요새들’과 ‘산지’로 구분해 다윗의 도피처가 지리적·군사적으로 모두 불안정한 공간임을 보이게 했습니다.
  alternative_readings:
  - 둘 다 단순히 ‘산’으로 통일하는 방식
  - 둘 다 ‘피난처’로 완화하는 방식
  rationale: 본문은 단순한 은신이 아니라 위험 속 도피와 추적을 함께 보여 주므로, 지형과 방어시설의 차이를 구별해 옮기는 것이 문맥에 충실합니다.
  doctrine_reference: 서술 문맥 보존
