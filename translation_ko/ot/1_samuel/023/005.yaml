  to: 그리하여 다윗과 그의 부하들은 가일라로 가서 블레셋 사람들과 싸우고, 그들의 가축을 몰아가며 그들에게 큰 타격을 입혔습니다[b]. 이렇게 다윗은 가일라 주민들을 구해 냈습니다[c].
