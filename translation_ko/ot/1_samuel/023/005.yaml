  text: וַ/יֵּ֣לֶךְ דָּוִד֩ ו/אנש/ו קְעִילָ֜ה וַ/יִּלָּ֣חֶם בַּ/פְּלִשְׁתִּ֗ים וַ/יִּנְהַג֙ אֶת מִקְנֵי/הֶ֔ם וַ/יַּ֥ךְ בָּ/הֶ֖ם מַכָּ֣ה גְדוֹלָ֑ה וַ/יֹּ֣שַׁע דָּוִ֔ד אֵ֖ת יֹשְׁבֵ֥י קְעִילָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/005.yaml
  text: So David and his men went to Keilah and fought against the Philistines[a], and he drove off their livestock and struck them with a great blow[c][b]. So David saved the inhabitants of Keilah.
  footnotes:
  - marker: a
    text: Or 'he drove off their cattle'; the Hebrew term refers broadly to livestock.
    reason: lexical_alternative
  - marker: b
    text: Or 'struck them with a severe defeat' or 'dealt them a great slaughter.'
    reason: lexical_alternative
  - marker: c
    text: Or 'delivered' or 'rescued' the inhabitants of Keilah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 다윗과 그의 부하들은 가일라로 가서 블레셋 사람들과 싸우고, 그들의 가축을 몰아가며 그들에게 큰 타격을 입혔습니다[b]. 이렇게 다윗은 가일라 주민들을 구해 냈습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘그들에게 큰 패배를 안겼습니다’. 히브리어는 ‘큰 타격’이라는 표현을 사용하며, 살육의 정도를 명시하지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘구원했습니다’, ‘건져 냈습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנְהַג אֶת־מִקְנֵיהֶם
  english_pob_choice: he drove off their livestock
  chosen_korean: 그들의 가축을 몰아갔으며
  alternatives_korean:
  - 그들의 가축을 몰아냈으며
  - 그들의 가축을 끌고 갔으며
  - 그들의 가축을 몰아갔으며
  lexicon: HALOT
  rationale: מִקְנֶה는 단순한 ‘소’보다 넓은 가축/가축 떼를 가리키며, נהג는 동물을 몰아 이동시키는 뜻이어서 ‘몰아갔으며’가 본문 이미지를 잘 살립니다.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  english_pob_choice: struck them with a great blow
  chosen_korean: 큰 타격을 입혔으며
  alternatives_korean:
  - 큰 일격을 가했으며
  - 큰 패배를 안겼으며
  - 큰 살육을 가했으며
  lexicon: HALOT
  rationale: מַכָּה גְדוֹלָה는 결과적으로 큰 타격/큰 패배를 뜻할 수 있으나, 본문이 살육의 정도를 명시하지 않으므로 ‘큰 타격을 입혔으며’로 과도한 구체화를 피했습니다.
- source_word: וַיֹּשַׁע
  english_pob_choice: saved
  chosen_korean: 구해 냈습니다
  alternatives_korean:
  - 구원하셨습니다
  - 구했습니다
  - 건져 냈습니다
  lexicon: HALOT
  rationale: ישע는 군사적 문맥에서 ‘구하다/구원하다’의 뜻이며, 여기서는 주민들을 위험에서 건져낸 결과를 자연스럽게 드러내는 ‘구해 냈습니다’가 적절합니다.
- source_word: יֹשְׁבֵי קְעִילָה
  english_pob_choice: the inhabitants of Keilah
  chosen_korean: 가일라 주민들
  alternatives_korean:
  - 가일라의 주민들
  - 가일라에 사는 사람들
  - 가일라 거주자들
  lexicon: HALOT
  rationale: 분사구문은 직역하면 ‘가일라에 거주하는 자들’이지만, 한국어에서는 의미를 간결하게 전달하는 ‘가일라 주민들’이 가장 자연스럽습니다.
- source_word: קְעִילָה
  english_pob_choice: Keilah
  chosen_korean: 가일라
  alternatives_korean:
  - 게일라
  - 케일라
  lexicon: 현대 외래어 표기 관행
  rationale: 지명 קְעִילָה는 한국어 성서 표기 관행에 맞춰 ‘가일라’로 옮겼습니다.
theological_decisions:
- issue: וַיֹּשַׁע 다윗 אֵת יֹשְׁבֵי קְעִילָה의 주체와 의미
  chosen_reading: 다윗이 가일라 주민들을 실제로 위험에서 구해 낸 것으로 옮겼습니다.
  alternative_readings:
  - 다윗이 그들을 ‘구원했다’로 더 신학적으로 옮길 수 있음
  - ‘건져 냈습니다’로 더 구어적으로 옮길 수 있음
  rationale: 동사 자체의 기본 의미를 살리되, 본문이 다윗의 구출 행위를 강조하므로 신학적 용어로 과잉 확장하지 않고 군사적 구출의 뉘앙스를 유지했습니다.
  doctrine_reference: 구원/구출 표현의 문맥적 사용
