review_pass:
  verdict: revise
  source_fidelity: ‘포위하게 했습니다’는 사울이 다른 이들에게 포위를 시켰다는 별도의 사역 의미를 두드러지게 합니다. 히브리어는 소집의 목적을 이어 말하므로, 군사 행동의 목적을 직접 나타내는 표현이 더 충실합니다. 또한 지명은 한국어 성경에서 널리 쓰이는 ‘그일라’로 표기하는 것이 적절합니다.
  naturalness: ‘온 백성을 전쟁에 소집하여’도 이해되지만, 현대 표준어에서는 ‘전쟁을 위해 소집하여’가 목적 관계를 더 자연스럽고 분명하게 나타냅니다. 목적을 나타내는 ‘포위하려 하였습니다’는 원문의 연속된 부정사 구조를 자연스럽게 재현합니다.
  terminology: ‘온 백성’은 כָּל־הָעָם의 범위를 보존하며, 이를 ‘군사’로 한정하지 않는 점이 좋습니다. צוּר는 이 문맥에서 ‘포위하다’로 옮기는 것이 적절합니다. ‘그일라’는 통용 성경 지명 표기와 일치합니다.
  issues:
  - severity: medium
    issue: ‘포위하게 했습니다’의 불필요한 사역 뉘앙스
    rationale: לָצוּר는 사울이 소집한 이들이 수행할 군사 행동의 목적을 나타냅니다. ‘-게 했다’는 사울이 별도로 타인에게 포위를 명령·실행시켰다는 구조를 강하게 만들어 원문의 목적 구문보다 한 단계 더 해석적입니다.
  - severity: low
    issue: 지명 표기 ‘케일라’
    rationale: 음역 자체가 원문 의미를 훼손하지는 않지만, 한국어 성경의 정착된 지명 표기인 ‘그일라’를 쓰는 편이 독자성과 명칭 일관성 면에서 낫습니다.
  - severity: low
    issue: 각주에서 히브리어 동사의 기본 사역 의미 설명
    rationale: ‘알리다’는 문맥상 가능한 넓은 설명이지만, 이 동사의 기본 사역 의미는 ‘듣게 하다’입니다. 본문에서는 군사 소집이라는 관용적·문맥적 의미임을 명확히 하는 편이 좋습니다.
  revised_text: 그래서 사울은 온 백성을 전쟁을 위해 소집하여, 그일라로 내려가 다윗과 그의 사람들을 포위하려 하였습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘전쟁을 위해 온 백성을 불러모았다’입니다. 히브리어 동사는 문자적으로 ‘듣게 하다’라는 사역 의미를 지닐 수 있으나, 여기서는 군사 행동을 위해 사람들을 소집하거나 불러모으는 뜻으로 보입니다.
    reason: lexical_alternative
  revision_rationale: 소집의 목적을 나타내는 원문의 부정사 연쇄를 ‘전쟁을 위해 … 내려가 … 포위하려 하였습니다’로 반영하여, ‘포위하게 했다’가 야기하는 추가 사역 뉘앙스를 피했습니다. ‘온 백성’과 ‘포위하다’는 각각 원문의 범위와 군사 전술 의미를 유지합니다. 지명은 표준적인 한국어 성경 표기로 조정했습니다.
