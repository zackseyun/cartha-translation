source:
  edition: WLC
  text: וַ/יְשַׁמַּ֥ע שָׁא֛וּל אֶת כָּל הָ/עָ֖ם לַ/מִּלְחָמָ֑ה לָ/רֶ֣דֶת קְעִילָ֔ה לָ/צ֥וּר אֶל דָּוִ֖ד וְ/אֶל אֲנָשָֽׁי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/008.yaml
  text: So Saul summoned all the people to war[a], to go down to Keilah, to besiege David and his men.
  footnotes:
  - marker: a
    text: Or 'mustered all the people for battle.' The Hebrew verb can mean 'caused to hear,' and in this context likely refers to calling the people together for military action.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 사울이 온 백성을 전쟁에[a] 소집하여, 케일라로 내려가 다윗과 그의 사람들을 포위하게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전투를 위해 온 백성을 소집했다’입니다. 히브리어 동사는 ‘듣게 하다/알리다’의 뜻도 있으나, 여기서는 군사 행동을 위해 사람들을 불러모으는 의미로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁמַּע
  english_pob_choice: summoned
  chosen_korean: 소집하여
  alternatives_korean:
  - 불러모아
  - 소집했습니다
  - 동원하여
  lexicon: HALOT
  rationale: 히필형의 사역적 의미와 군사적 동원 상황을 함께 살려, 단순한 ‘듣다’보다 행정·군사적 호출을 드러내는 ‘소집하다’로 옮겼습니다.
- source_word: כָּל הָעָם
  english_pob_choice: all the people
  chosen_korean: 온 백성을
  alternatives_korean:
  - 모든 백성을
  - 온 군사를
  - 모든 군사
  lexicon: HALOT
  rationale: 히브리어의 직설적인 표현을 살리되, 문맥상 군사 동원을 받는 집단이라는 점을 자연스럽게 드러내기 위해 ‘온 백성’으로 옮겼습니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: to war
  chosen_korean: 전쟁에
  alternatives_korean:
  - 전투에
  - 전쟁을 위해
  - 싸움에
  lexicon: HALOT
  rationale: 목적을 나타내는 ל־를 자연스럽게 살리면서, 군사 행동의 포괄적 목적을 ‘전쟁에’로 간결하게 표현했습니다.
- source_word: לָצוּר אֶל דָּוִד וְאֶל אֲנָשָׁי/ו
  english_pob_choice: to besiege David and his men
  chosen_korean: 다윗과 그의 사람들을 포위하게 했습니다
  alternatives_korean:
  - 다윗과 그의 사람들을 포위하도록 했습니다
  - 다윗과 그의 사람들을 포위하려고 했습니다
  - 다윗과 그의 사람들을 에워싸게 했습니다
  lexicon: HALOT
  rationale: צוּר의 군사적 의미를 살려 ‘포위하다’로 옮겼고, 목적절의 뉘앙스는 ‘-게 했습니다’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 사울의 동원 대상과 군사적 의미
  chosen_reading: ‘온 백성’과 ‘전쟁에 소집하여’로 옮겨, 본문이 직접 말하는 범위를 넘지 않으면서 군사적 맥락을 분명히 했습니다.
  alternative_readings:
  - ‘모든 군사를 전쟁에 동원하여’
  - ‘백성을 싸움에 불러모아’
  rationale: 히브리어는 ‘백성’이라고만 말하지만 문맥상 군사 행동을 가리키므로, 해석을 과도하게 좁히지 않으면서도 전쟁 동원의 성격을 드러내는 것이 적절합니다.
  doctrine_reference: 문맥 주도 번역 원칙
- issue: ‘צוּר’의 처리
  chosen_reading: ‘포위하다’로 번역해 공격 대상에 대한 군사적 압박을 분명히 했습니다.
  alternative_readings:
  - ‘에워싸다’
  - ‘포위 공격하다’
  - ‘공격하다’
  rationale: 이 동사는 단순한 접근이 아니라 포위·봉쇄의 전술을 가리키므로, 서술의 긴장감을 유지하는 ‘포위하다’가 가장 적절합니다.
  doctrine_reference: 전술적 동사 의미 보존
