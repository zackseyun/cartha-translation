  text: וַ/יְשַׁמַּ֥ע שָׁא֛וּל אֶת כָּל הָ/עָ֖ם לַ/מִּלְחָמָ֑ה לָ/רֶ֣דֶת קְעִילָ֔ה לָ/צ֥וּר אֶל דָּוִ֖ד וְ/אֶל אֲנָשָֽׁי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/008.yaml
  text: So Saul summoned all the people to war[a], to go down to Keilah, to besiege David and his men.
  footnotes:
  - marker: a
    text: Or 'mustered all the people for battle.' The Hebrew verb can mean 'caused to hear,' and in this context likely refers to calling the people together for military action.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 사울이 온 백성을 전쟁에[a] 소집하여, 케일라로 내려가 다윗과 그의 사람들을 포위하게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전투를 위해 온 백성을 소집했다’입니다. 히브리어 동사는 ‘듣게 하다/알리다’의 뜻도 있으나, 여기서는 군사 행동을 위해 사람들을 불러모으는 의미로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁמַּע
  english_pob_choice: summoned
  chosen_korean: 소집하여
  alternatives_korean:
  - 불러모아
  - 소집했습니다
  - 동원하여
  lexicon: HALOT
  rationale: 히필형의 사역적 의미와 군사적 동원 상황을 함께 살려, 단순한 ‘듣다’보다 행정·군사적 호출을 드러내는 ‘소집하다’로 옮겼습니다.
- source_word: כָּל הָעָם
  english_pob_choice: all the people
  chosen_korean: 온 백성을
  alternatives_korean:
