  - 온 군사를
  - 모든 군사
  lexicon: HALOT
  rationale: 히브리어의 직설적인 표현을 살리되, 문맥상 군사 동원을 받는 집단이라는 점을 자연스럽게 드러내기 위해 ‘온 백성’으로 옮겼습니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: to war
  chosen_korean: 전쟁에
  alternatives_korean:
  - 전투에
  - 전쟁을 위해
