  lexicon: HALOT
  rationale: 목적을 나타내는 ל־를 자연스럽게 살리면서, 군사 행동의 포괄적 목적을 ‘전쟁에’로 간결하게 표현했습니다.
- source_word: לָצוּר אֶל דָּוִד וְאֶל אֲנָשָׁי/ו
  english_pob_choice: to besiege David and his men
  chosen_korean: 다윗과 그의 사람들을 포위하게 했습니다
  alternatives_korean:
  - 다윗과 그의 사람들을 포위하도록 했습니다
  - 다윗과 그의 사람들을 포위하려고 했습니다
  - 다윗과 그의 사람들을 에워싸게 했습니다
  lexicon: HALOT
  rationale: צוּר의 군사적 의미를 살려 ‘포위하다’로 옮겼고, 목적절의 뉘앙스는 ‘-게 했습니다’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 사울의 동원 대상과 군사적 의미
  chosen_reading: ‘온 백성’과 ‘전쟁에 소집하여’로 옮겨, 본문이 직접 말하는 범위를 넘지 않으면서 군사적 맥락을 분명히 했습니다.
  alternative_readings:
  - ‘모든 군사를 전쟁에 동원하여’
  - ‘백성을 싸움에 불러모아’
  rationale: 히브리어는 ‘백성’이라고만 말하지만 문맥상 군사 행동을 가리키므로, 해석을 과도하게 좁히지 않으면서도 전쟁 동원의 성격을 드러내는 것이 적절합니다.
  doctrine_reference: 문맥 주도 번역 원칙
- issue: ‘צוּר’의 처리
  chosen_reading: ‘포위하다’로 번역해 공격 대상에 대한 군사적 압박을 분명히 했습니다.
  alternative_readings:
  - ‘에워싸다’
  - ‘포위 공격하다’
  - ‘공격하다’
  rationale: 이 동사는 단순한 접근이 아니라 포위·봉쇄의 전술을 가리키므로, 서술의 긴장감을 유지하는 ‘포위하다’가 가장 적절합니다.
  doctrine_reference: 전술적 동사 의미 보존
