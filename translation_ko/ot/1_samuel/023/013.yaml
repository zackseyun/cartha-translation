  naturalness: ‘다윗이 그의 사람들, 곧 약 육백 명과 함께 일어나’는 수식 관계가 다소 무겁고 어색합니다. ‘다윗과 그의 사람들, 곧 약 육백 명이’로 주어를 정리하면 현대 표준어 합쇼체에서 더 자연스럽습니다. ‘나오지 않았다’도 ‘나가지 않았다’로 고치는 것이 자연스럽고 정확합니다.
  terminology: ‘게일라’, ‘다윗’, ‘사울’의 표기는 적절합니다. 전투 집단을 ‘그의 사람들’로 옮긴 것도 원문의 범위를 불필요하게 ‘부하’로 한정하지 않아 적절합니다.
