id: 1SA.23.13
reference: 1 Samuel 23:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּקָם֩ דָּוִ֨ד וַ/אֲנָשָׁ֜י/ו כְּ/שֵׁשׁ מֵא֣וֹת אִ֗ישׁ וַ/יֵּצְאוּ֙ מִ/קְּעִלָ֔ה וַ/יִּֽתְהַלְּכ֖וּ בַּ/אֲשֶׁ֣ר יִתְהַלָּ֑כוּ וּ/לְ/שָׁא֣וּל הֻגַּ֗ד כִּֽי נִמְלַ֤ט דָּוִד֙ מִ/קְּעִילָ֔ה וַ/יֶּחְדַּ֖ל לָ/צֵֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/013.yaml
  text: Then David arose with his men[a], about six hundred men, and they went out from Keilah and went wherever they could go. And it was told to Saul that David had escaped from Keilah[b], so he stopped going out.
  footnotes:
  - marker: a
    text: Or 'and wandered wherever they could wander' / 'and went about wherever they went.' The Hebrew idiom emphasizes continual movement from place to place.
    reason: lexical_alternative
  - marker: b
    text: '''He stopped going out'' likely means Saul stopped going out in pursuit of David after learning David had escaped Keilah.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 다윗이 그의 사람들, 곧 약 육백 명과 함께 일어나 게일라에서 나가, 갈 수 있는 곳마다 다녔습니다. 사울에게는 다윗이 게일라에서 달아났다는 소식이 전해졌고, 그래서 그는 더 이상 나오지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 걸음을 따라’에 가까운 반복 관용구로, 계속해서 이리저리 이동하는 상태를 나타냅니다.
    reason: source_note
  - marker: b
    text: ‘나오는 것’을 추격 출정으로 이해한 풀이입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: Then David arose
  chosen_korean: 다윗이 … 일어나
  alternatives_korean:
  - 다윗이 … 일어났습니다
  - 다윗이 … 일어서
  lexicon: HALOT
  rationale: קום의 서술적 진행을 살리면서, 합쇼체 문맥에서 자연스럽고 간결하게 사건 전환을 드러내는 기본 동사로 옮겼습니다.
- source_word: וַאֲנָשָׁיו
  english_pob_choice: with his men
  chosen_korean: 그의 사람들
  alternatives_korean:
  - 그의 부하들
  - 그의 부하들과
  lexicon: HALOT
  rationale: 다윗의 전투 집단을 가리키는 표현이므로 ‘사람들’이 직역과 자연스러움 사이에서 가장 무난하며, ‘부하들’보다 인물 관계를 덜 현대 군사적으로 규정합니다.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  english_pob_choice: about six hundred men
  chosen_korean: 약 육백 명
  alternatives_korean:
  - 대략 육백 명
  - 거의 육백 명
  lexicon: HALOT
  rationale: כְּ의 근사값을 한국어 ‘약’으로 반영했고, 이 문맥에서는 성별이 아니라 수를 강조하므로 ‘명’이 더 자연합니다.
- source_word: וַיִּתְהַלְּכוּ בַּאֲשֶׁר יִתְהַלָּכוּ
  english_pob_choice: and moved about wherever they could go
  chosen_korean: 갈 수 있는 곳마다 다녔습니다
  alternatives_korean:
  - 갈 수 있는 곳마다 떠돌았습니다
  - 어디든 갈 수 있는 곳으로 다녔습니다
  lexicon: HALOT
  rationale: 히트파엘의 반복·지속적 이동 관용구를 한국어로 과도하게 해석하지 않으면서, ‘갈 수 있는 곳마다’로 불안정한 이동의 범위를 살렸습니다.
- source_word: וַיֶּחְדַּל לָצֵאת
  english_pob_choice: so he stopped going out
  chosen_korean: 그래서 그는 더 이상 나오지 않았습니다
  alternatives_korean:
  - 그래서 그는 나가기를 멈췄습니다
  - 그래서 그는 출정하지 않았습니다
  lexicon: HALOT
  rationale: חדל + infinitive의 ‘그만두다/중단하다’를 자연스러운 서술로 풀어, 사울이 다윗을 추격하러 나가는 일을 중단했다는 문맥적 함의를 과도하게 좁히지 않으면서 반영했습니다.
theological_decisions:
- issue: 사울이 ‘나오는 것’의 의미
  chosen_reading: 문맥상 전투·추격을 위해 밖으로 나가던 행동을 멈춘 것으로 이해하되, 본문 표현 자체는 ‘더 이상 나오지 않았다’로 유지했습니다.
  alternative_readings:
  - ‘추격하러 나가지 않았다’
  - ‘원정을 중단했다’
  rationale: 히브리어는 단순히 ‘나가다’를 쓰지만, 앞뒤 문맥상 다윗 추격의 중단을 가리키는 것으로 읽힐 수 있습니다. 다만 본문이 그 의미를 명시적으로 풀어 쓰지 않으므로, 해석을 본문보다 앞서지 않게 했습니다.
  doctrine_reference: 서술 문맥 우선 원칙
