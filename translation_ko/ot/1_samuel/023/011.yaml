  text: הֲ/יַסְגִּרֻ֣/נִי בַעֲלֵי֩ קְעִילָ֨ה בְ/יָד֜/וֹ הֲ/יֵרֵ֣ד שָׁא֗וּל כַּֽ/אֲשֶׁר֙ שָׁמַ֣ע עַבְדֶּ֔/ךָ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַגֶּד נָ֖א לְ/עַבְדֶּ֑/ךָ וַ/יֹּ֥אמֶר יְהוָ֖ה יֵרֵֽד־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/011.yaml
  text: Will the men of Keilah hand me over into his hand? Will Saul come down[a], as your servant has heard? O Yahweh, God of Israel, please tell your servant.” And Yahweh said, “He will come down.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''into his hand,'' an idiom meaning into Saul''s power.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그일라 사람들이 나를 그의 손에[a] 넘겨주겠습니까? 당신의 종이 들은 대로 사울이 내려오겠습니까? 오 야훼, 이스라엘의 하나님이시여, 부디 당신의 종에게 알려 주십시오. 야훼께서 말씀하셨습니다. “그가 내려올 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 손에’이며, 사울의 권세 아래로 넘겨진다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַעֲלֵי קְעִילָה
  english_pob_choice: the men of Keilah
  chosen_korean: 성읍의 사람들
  alternatives_korean:
  - 길라의 남자들
  - 길라 사람들
  - 길라의 주민들
  lexicon: HALOT
  rationale: בעלי는 이 문맥에서 '소유자'나 직함보다 성읍의 책임 있는 사람들/주민들을 가리키므로, 자연스러운 한국어로는 '성읍의 사람들'이 적절합니다.
- source_word: בְיָדוֹ
  english_pob_choice: into his hand
  chosen_korean: 그의 손에 넘겨주겠습니까
  alternatives_korean:
  - 그의 손으로
  - 그의 권세 아래로 넘겨주겠습니까
  - 그의 손에
  lexicon: HALOT
  rationale: 히브리어 관용구인 '손'은 권세·지배를 뜻하므로, 한국어 본문에서는 의미를 드러내는 '넘겨주다'를 써서 압박과 통제의 뉘앙스를 살렸습니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 신하
  lexicon: HALOT
  rationale: 하나님께 드리는 간구에서의 자기 호칭이므로, 신분적 종속을 드러내되 예배 언어에 맞는 '당신의 종'을 유지했습니다.
- source_word: הַגֶּד נָא
  english_pob_choice: please tell
  chosen_korean: 제발 ... 알려 주십시오
  alternatives_korean:
  - 부디 ... 말씀해 주십시오
  - 알려 주시옵소서
  lexicon: HALOT
  rationale: 요청의 긴급성과 공손함을 함께 살리기 위해 현대 합쇼체의 '제발 ... 알려 주십시오'로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유 신명 יְהוָה는 POB 기준에 따라 '야훼'로 옮겨, 호칭이 아닌 이름이라는 점을 드러냈습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 본문과 응답 모두에서 '야훼'를 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 본문에 직접 나타난 신명을 한국어 본문에서도 보존하여, 대체 호칭으로 가려지지 않도록 했습니다.
  doctrine_reference: 'POB contested terms: YHWH → Yahweh'
