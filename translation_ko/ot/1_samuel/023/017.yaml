reference: 1 Samuel 23:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו אַל תִּירָ֗א כִּ֠י לֹ֤א תִֽמְצָאֲ/ךָ֙ יַ֚ד שָׁא֣וּל אָבִ֔/י וְ/אַתָּה֙ תִּמְלֹ֣ךְ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֖י אֶֽהְיֶה לְּ/ךָ֣ לְ/מִשְׁנֶ֑ה וְ/גַם שָׁא֥וּל אָבִ֖/י יֹדֵ֥עַ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/017.yaml
  text: He said to him[a], “Do not be afraid, for the hand of Saul my father will not find you. You will reign over Israel, and I will be second to you[b]. Even Saul my father knows this.”
  footnotes:
  - marker: a
    text: Or, 'the power of Saul my father will not reach you.' The Hebrew says, 'the hand of Saul my father will not find you,' using 'hand' as a figure for power or grasp.
    reason: lexical_alternative
  - marker: b
    text: Or, 'I will be your second-in-command.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말했습니다. 「두려워하지 마십시오. 사울 제 아버지의 손이 당신을 찾아내지 못할 것입니다. 당신은 이스라엘을 다스릴 것이며, 나는 당신의 다음이 될 것입니다. 사울 제 아버지도 이것을 알고 있습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '사울 제 아버지의 손이 당신을 찾아내지 못할 것이다'라고 하며, '손'은 힘이나 장악을 가리키는 비유입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, '나는 당신의 부관이 될 것입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  english_pob_choice: Do not be afraid
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 두려워하지 말라
  - 무서워하지 마십시오
  lexicon: HALOT
  rationale: 부정 명령의 직설적 금지를 현대 합쇼체로 자연스럽게 옮겼습니다. '두려워하지 마십시오'가 공포의 중단을 가장 직접적으로 전달합니다.
- source_word: לֹא תִמְצָאֲךָ יַד שָׁאוּל אָבִי
  english_pob_choice: the hand of Saul my father will not find you
  chosen_korean: 사울 제 아버지의 손이 당신을 찾아내지 못할 것입니다
  alternatives_korean:
  - 사울 제 아버지의 손이 당신에게 미치지 못할 것입니다
  - 사울 제 아버지의 권세가 당신을 잡지 못할 것입니다
  lexicon: HALOT
  rationale: 히브리어의 '손'을 힘/장악의 표현으로 유지하면서, POB의 'find you'를 따라 '찾아내다'로 옮겨 구체적 이미지와 의미를 함께 살렸습니다.
- source_word: וְאַתָּה תִּמְלֹךְ עַל יִשְׂרָאֵל
  english_pob_choice: You will reign over Israel
  chosen_korean: 당신은 이스라엘을 다스릴 것이며
  alternatives_korean:
  - 당신은 이스라엘 위에 군림할 것이며
  - 당신은 이스라엘의 왕이 될 것이며
  lexicon: HALOT
  rationale: '''מלך''의 동사성을 살리되, 한국어에서는 ''다스리다''가 왕권 행사를 가장 자연스럽게 드러냅니다. ''왕이 되다''보다 원문의 동사를 더 잘 보존합니다.'
- source_word: וְאָנֹכִי אֶהְיֶה לְּךָ לְמִשְׁנֶה
  english_pob_choice: and I will be second to you
  chosen_korean: 나는 당신의 다음이 될 것입니다
  alternatives_korean:
  - 나는 당신에게 둘째가 될 것입니다
  - 나는 당신의 다음 자리일 것입니다
  - 나는 당신의 부관이 될 것입니다
  lexicon: HALOT
  rationale: מִשְׁנֶה의 '둘째/두 번째 지위'를 자연스러운 한국어 관계 표현으로 옮겼습니다. '다음'은 위계 속에서 뒤를 잇는 위치를 간결하게 드러내며, 현대적 행정 직함으로 굳히지 않습니다.
theological_decisions:
- issue: 요나단의 발언을 예언적 확언으로 얼마나 명시할지
  chosen_reading: 문장 자체가 말하는 정치적·섭리적 확신을 그대로 두고, 추가적인 메시야적 해석은 덧붙이지 않았습니다.
  alternative_readings:
  - 여호와의 예언으로 명시하기
  - 다윗 언약의 신학으로 풀어쓰기
  rationale: 본문에는 야훼에 대한 직접 언급이 없으므로, 번역문은 요나단의 진술 수준을 유지하는 것이 가장 충실합니다. 신학적 해석은 본문 너머의 주석 영역에 남겨 두었습니다.
  doctrine_reference: 본문 수준 유지, 과잉 신학화 방지
