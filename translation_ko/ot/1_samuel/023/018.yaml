base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/018.yaml
  text: And the two of them made a covenant before Yahweh[a]. Then David remained in the wooded area[b], and Jonathan went to his house.
  footnotes:
  - marker: a
    text: Hebrew literally, 'cut a covenant.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in Horesh'; the Hebrew may be understood either as a place name or as 'the wooded area/forest.'
    reason: alternative_reading
translation:
  language: ko
  text: 두 사람은 야훼 앞에서 언약[a]을 맺었습니다. 그 뒤 다윗은 그 숲에[b] 머물렀고, 요나단은 자기 집으로 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘언약을 자르다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘호레쉬’라는 지명을 가리킬 수도 있고, ‘숲’ 또는 ‘우거진 곳’을 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרְתוּ ... בְּרִית
  english_pob_choice: made a covenant
  chosen_korean: 언약을 맺었습니다
  alternatives_korean:
  - 언약을 끊었습니다
  - 언약을 세웠습니다
  lexicon: HALOT
  rationale: כרת ברית의 문자적 의미는 '언약을 자르다'이지만, 한국어에서는 관용적으로 '언약을 맺다'가 가장 자연스럽고 본문의 엄숙한 관계 설정을 잘 살립니다.
- source_word: שְׁנֵיהֶם
  english_pob_choice: the two of them
  chosen_korean: 두 사람은
  alternatives_korean:
  - 둘은
  - 두 사람 둘 다
  lexicon: HALOT
  rationale: 두 사람, 곧 다윗과 요나단이 함께 행동했다는 점을 분명히 하면서도 한국어 문장 흐름을 자연스럽게 유지합니다.
- source_word: לִפְנֵי יְהוָה / יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 앞에서
  - 주님 앞에서
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה를 프로젝트 기본값에 따라 '야훼'로 옮기고, לִפְנֵי를 '앞에서'로 처리해 언약 행위의 공개적·예배적 성격을 살렸습니다.
- source_word: בַּחֹרְשָׁה
  english_pob_choice: in the wooded area
  chosen_korean: 그 숲에
  alternatives_korean:
  - 호레셰에
  - 그 나무숲에
  - 그 숲속에
  lexicon: HALOT
  rationale: 이 형태는 장소명으로도, 일반 명사적 의미의 '숲/우거진 곳'으로도 읽을 수 있어 본문이 허용하는 범위 안에서 자연스러운 일반어 번역을 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값과 원어의 고유한 언약명을 보존하는 원칙에 따라 יְהוָה를 '야훼'로 옮겼습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
