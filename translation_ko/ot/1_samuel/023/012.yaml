reference: 1 Samuel 23:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/יַסְגִּ֜רוּ בַּעֲלֵ֧י קְעִילָ֛ה אֹתִ֥/י וְ/אֶת אֲנָשַׁ֖/י בְּ/יַד שָׁא֑וּל וַ/יֹּ֥אמֶר יְהוָ֖ה יַסְגִּֽירוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/012.yaml
  text: Then David said[a], “Will the men of Keilah hand me and my men over into Saul’s hand?” And Yahweh said[c][b], “They will hand you over.”
  footnotes:
  - marker: a
    text: Or “deliver me and my men over” / “surrender me and my men.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “into Saul’s hand,” an idiom meaning into Saul’s power.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew answer says literally, “They will hand you over,” using a singular object; David is addressed as the representative leader, with his men implied.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 말했습니다. “그일라 사람들이 저와 제 부하들을 사울의 손에 넘겨주겠습니까?”[a][b] 야훼께서 말씀하셨습니다. “그들이 그대를 넘겨줄 것입니다.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저와 제 부하들을 내주겠습니까?’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘사울의 손에’는 사울의 권세나 지배 아래로 넘겨진다는 뜻의 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 단수형 ‘너를 넘겨줄 것이다’라고 합니다. 다윗을 대표자로 가리키며, 그의 부하들도 함께 포함됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יַסְגִּרוּ
  english_pob_choice: Will ... hand ... over
  chosen_korean: 넘겨주겠습니까
  alternatives_korean:
  - 인도하겠습니까
  - 내주겠습니까
  - 건네주겠습니까
  lexicon: HALOT
  rationale: 히필 어근 סגר는 여기서 적에게 넘겨 권력 아래 두는 뜻이므로, 현대 한국어의 자연스러운 ‘넘겨주다’로 옮겨 의미와 긴박감을 살렸습니다.
- source_word: בַּעֲלֵי קְעִילָה
  english_pob_choice: the men of Keilah
  chosen_korean: 그일라의 사람들
  alternatives_korean:
  - 그일라의 남자들
  - 그일라의 주민들
  - 그일라의 지도자들
  lexicon: HALOT
  rationale: 문맥상 도시의 소유자라기보다 그 성읍의 주민/주요 인물을 가리키므로, 직역적이면서도 자연스러운 ‘사람들’로 처리했습니다.
- source_word: בְּיַד שָׁאוּל
  english_pob_choice: into Saul’s hand
  chosen_korean: 사울의 손에
  alternatives_korean:
  - 사울의 권력 아래
  - 사울에게
  - 사울의 손 안에
  lexicon: HALOT
  rationale: ‘손’은 히브리어 관용구로 ‘권세/지배’의 의미를 가지므로, 이미지를 보존하는 동시에 한국어에서도 통하는 ‘사울의 손에’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה를 관용적 대체어가 아니라 고유명 ‘야훼’로 옮겨, 본문이 실제로 쓰는 하나님의 이름을 드러냈습니다.
theological_decisions:
- issue: 응답의 단수형 유지
  chosen_reading: “그들이 넘겨줄 것이다”에서 대상은 단수 ‘너’를 유지했습니다.
  alternative_readings:
  - “너와 네 부하들을 넘겨줄 것이다”
  - “너희를 넘겨줄 것이다”
  rationale: 히브리어 대답은 단수 목적어를 사용하며, 다윗이 대표자로 지목되어 그의 부하들이 함축됩니다. 이를 평탄화하지 않고 본문의 대표성 구조를 보존했습니다.
  doctrine_reference: 본문의 서사적 화법과 대표 표상
- issue: 직접화법의 높임말
  chosen_reading: 다윗의 질문은 높임말, 야훼의 응답은 평서형으로 구분했습니다.
  alternative_readings:
  - 모두 같은 높임말로 통일
  - 야훼의 응답도 높임말로 처리
  rationale: 한국어 합쇼체 본문에서는 인간 화자와 신적 응답의 문체를 구분해도 원문 의미를 해치지 않으며, 신적 직접화법은 권위 있는 선언으로 자연스럽게 제시됩니다.
  doctrine_reference: 번역 문체 원칙
