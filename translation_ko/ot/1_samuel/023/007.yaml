id: 1SA.23.7
reference: 1 Samuel 23:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֻּגַּ֣ד לְ/שָׁא֔וּל כִּי בָ֥א דָוִ֖ד קְעִילָ֑ה וַ/יֹּ֣אמֶר שָׁא֗וּל נִכַּ֨ר אֹת֤/וֹ אֱלֹהִים֙ בְּ/יָדִ֔/י כִּ֚י נִסְגַּ֣ר לָ/ב֔וֹא בְּ/עִ֖יר דְּלָתַ֥יִם וּ/בְרִֽיחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/007.yaml
  text: And it was reported to Saul that David had come to Keilah[a]. So Saul said, “God has delivered him into my hand[b], for he has shut himself in by entering a city with doors and bars.”
  footnotes:
  - marker: a
    text: Or, 'God has handed him over into my hand.' Saul interprets David's position as divine delivery into his power.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a city of double doors and bar,' referring to a fortified city secured by paired gate-leaves and a crossbar.
    reason: cultural_note
translation:
  language: ko
  text: 사울에게 다윗이 그일라에 왔다는 소식이 알려졌습니다. 그러자 사울이 말했습니다. “하나님이 그를 내 손에 넘기셨습니다. 그가 문과 빗장이 있는 성읍으로 들어가 스스로를 가두었기 때문입니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 히브리어는 성읍의 방어 구조를 가리키는 표현으로, 문자적으로는 ‘문짝 둘과 빗장’입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֻּגַּד
  english_pob_choice: it was reported
  chosen_korean: 보고가 들어갔습니다
  alternatives_korean:
  - 사울에게 알려졌습니다
  - 사울에게 전해졌습니다
  lexicon: HALOT
  rationale: 히브리어 수동형은 정보가 사울에게 전달되었음을 나타내므로, 현대 한국어에서 자연스러운 ‘보고가 들어갔습니다’로 옮겨 수동 의미를 유지했습니다.
- source_word: בָא דָוִד קְעִילָה
  english_pob_choice: David had come to Keilah
  chosen_korean: 다윗이 그일라에 왔다는
  alternatives_korean:
  - 다윗이 그일라에 들어왔다는
  - 다윗이 그일라에 도착했다는
  lexicon: HALOT
  rationale: בוא는 여기서 목적지에 도달함을 뜻하므로 ‘왔다는’으로 옮겨 보고문의 내용임을 자연스럽게 살렸습니다.
- source_word: נִכַּר אֹתוֹ אֱלֹהִים בְּיָדִי
  english_pob_choice: God has delivered him into my hand
  chosen_korean: 하나님이 그를 내 손에 넘기셨습니다
  alternatives_korean:
  - 하나님이 그를 내 권세에 넘기셨습니다
  - 하나님이 그를 내 손에 맡기셨습니다
  lexicon: HALOT
  rationale: 문맥상 사울의 확신을 직접 인용해야 하므로, ‘넘기셨습니다’로 ‘넘겨 주다/내주다’의 의미를 살리고 관용구 ‘내 손에’도 유지했습니다.
- source_word: בְּעִיר דְּלָתַיִם וּבְרִיחַ
  english_pob_choice: a city with doors and bars
  chosen_korean: 문과 빗장이 있는 성읍
  alternatives_korean:
  - 문과 빗장으로 닫힌 성읍
  - 문들과 빗장이 있는 성읍
  lexicon: HALOT
  rationale: דְּלָתַיִם과 בְּרִיחַ는 성읍의 방어 장치를 가리키므로, 한국어로는 과도한 설명 없이 ‘문과 빗장이 있는 성읍’으로 구체적 이미지를 보존했습니다.
theological_decisions:
- issue: 사울의 발언을 하나님의 실제 의도로 단정할지 여부
  chosen_reading: 사울의 직접 화법을 그대로 살려 ‘하나님이 그를 내 손에 넘기셨습니다’라고 옮기고, 서술자가 그 판단을 승인하는 표현은 넣지 않았습니다.
  alternative_readings:
  - ‘사울은 하나님이 그를 넘기셨다고 생각했습니다’처럼 해석적 거리를 둘 수 있음
  rationale: 히브리어 본문은 사울의 말 자체를 직접 제시하며, 번역은 그 긴장을 해소하지 않고 그대로 보존하는 것이 적절합니다.
  doctrine_reference: 본문의 화자 시점과 서술자 평가를 구분해 신학적 긴장을 유지
