base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/028.yaml
  text: So Saul returned from pursuing David and went to meet the Philistines. Therefore that place was called the Rock of Division[a].
  footnotes:
  - marker: a
    text: Or 'the Rock of Separations' or 'the Rock of Parting.' The place name likely refers to the breaking off of Saul's pursuit of David.
    reason: lexical_alternative
  - marker: b
    text: Or 'Philistines[a]. Therefore that place was called the Rock of Division.'.
    reason: previous_rendering
translation:
  language: ko
  text: 사울은 다윗을 추격하는 일을 그만두고 돌아가 블레셋 사람들을 맞으러 갔습니다. 그러므로 그곳은 ‘분리의 바위’라고 불렸습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분리들의 바위’, ‘갈라짐의 바위’, ‘이별의 바위’. 이 지명은 사울이 다윗 추격을 중단하게 된 데서 유래한 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: returned
  chosen_korean: 돌아가
  alternatives_korean:
  - 되돌아가
  - 돌아왔습니다
  lexicon: HALOT
  rationale: 사울이 진행하던 추격을 접고 방향을 바꾸는 동작을 자연스러운 서술체로 옮기기 위해 ‘돌아가’를 택했습니다.
- source_word: מִרְדֹף אַחֲרֵי
  english_pob_choice: from pursuing
  chosen_korean: 다윗을 추격하는 일을 그만두고
  alternatives_korean:
  - 다윗을 뒤쫓는 일을 그만두고
  - 다윗을 추적하는 일을 멈추고
  lexicon: HALOT
  rationale: מן + مصدر구조가 어떤 행위에서의 이탈·중단을 나타내므로, 단순 이동이 아니라 추격 중단이라는 의미가 드러나도록 옮겼습니다.
- source_word: לִקְרַאת
  english_pob_choice: to meet
  chosen_korean: 맞으러
  alternatives_korean:
  - 만나러
  - 맞닥뜨리러
  lexicon: HALOT
  rationale: 직접 대면 자체보다 다가가 응대하는 폭넓은 의미를 살리되, 군사적 긴장감도 함께 남기기 위해 ‘맞으러’를 사용했습니다.
- source_word: סֶלַע הַמַּחְלְקוֹת
  english_pob_choice: the Rock of Division
  chosen_korean: 분리의 바위
  alternatives_korean:
  - 분열의 바위
  - 갈라짐의 바위
  - 이별의 바위
  lexicon: HALOT
  rationale: 지명 성격의 표현이므로 ‘바위’를 유지했고, מחלוקות의 분리·갈라짐 의미를 반영해 ‘분리의’로 옮겼습니다. 영어 POB의 ‘Division’에 대응하되 한국어에서 더 자연스럽게 읽히도록 조정했습니다.
theological_decisions:
- issue: 지명 해석의 뉘앙스
  chosen_reading: ‘분리의 바위’로 본문에 두고, 대안 번역 가능성을 각주로 남깁니다.
  alternative_readings:
  - ‘분열의 바위’
  - ‘갈라짐의 바위’
  - ‘이별의 바위’
  rationale: 히브리어 מקום명은 정확한 어감이 다소 불확실하므로, 본문에는 가장 مستقیم한 의미를 두되 각주로 대안을 보존해 의미 폭을 지켰습니다.
  doctrine_reference: 지명 번역의 투명성 원칙
