  text: So Saul returned from pursuing David and went to meet the Philistines. Therefore that place was called the Rock of Division[a].
  footnotes:
  - marker: a
    text: Or 'the Rock of Separations' or 'the Rock of Parting.' The place name likely refers to the breaking off of Saul's pursuit of David.
    reason: lexical_alternative
  - marker: b
    text: Or 'Philistines[a]. Therefore that place was called the Rock of Division.'.
    reason: previous_rendering
translation:
  language: ko
  text: 사울은 다윗을 추격하던 데서 돌아서서 블레셋 사람들을 맞으러 갔습니다. 그러므로 그곳은 ‘분리의 바위’라고 불렸습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갈라짐의 바위’ 또는 ‘헤어짐의 바위’. 이 지명은 사울이 다윗 추격을 중단한 일을 가리키는 듯합니다.
    reason: lexical_alternative
