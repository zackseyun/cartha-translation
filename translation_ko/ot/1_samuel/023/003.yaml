base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/003.yaml
  text: But David’s men said to him[a], “Look, we are afraid here in Judah; how much more, then, if we go to Keilah against the battle lines of the Philistines?”
  footnotes:
  - marker: a
    text: Or “let alone if we go to Keilah against the ranks of the Philistines.” The Hebrew idiom expresses an argument from lesser to greater.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 다윗의 사람들이 그에게 말했습니다. 「보십시오, 우리는 여기 유다에서도 두렵습니다. 하물며 가서 블레셋 사람들의 전열을 맞서게 되면 어떻겠습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 ‘기읍라로 가서 블레셋 사람들의 진영을 맞서는 일은 말할 것도 없다’는 식의 소에서 큰 것으로 가는 논증을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: But ... said
  chosen_korean: 그런데 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그래서 ... 말했습니다
  lexicon: WLC/HALOT
  rationale: 와우 연속의 서술 전진을 살리되, 앞선 명령에 대한 망설임과 반응의 대비를 한국어에서도 자연스럽게 드러내기 위해 ‘그런데’를 택했습니다.
- source_word: אַנְשֵׁי דָוִד
  english_pob_choice: David’s men
  chosen_korean: 다윗의 사람들이
  alternatives_korean:
  - 다윗의 남자들이
  - 다윗의 부하들이
  lexicon: WLC/HALOT
  rationale: 소유 관계를 유지하면서도 현대 한국어에서 자연스러운 집단 명칭으로 옮겼습니다.
- source_word: וְאַף כִּי
  english_pob_choice: how much more, then, if
  chosen_korean: 하물며 ... 되면 어떻겠습니까
  alternatives_korean:
  - 그렇다면 더욱이 ...
  - 더군다나 ...
  lexicon: WLC/HALOT
  rationale: ‘적은 것에서 큰 것으로’ 가는 히브리어 관용구의 논리를 한국어의 ‘하물며’로 직접 살렸습니다.
- source_word: מַעַרְכוֹת פְּלִשְׁתִּים
  english_pob_choice: battle lines of the Philistines
  chosen_korean: 블레셋 사람들의 전열
  alternatives_korean:
  - 블레셋 사람들의 진영
  - 블레셋 군대의 전열
  lexicon: WLC/HALOT
  rationale: מַעַרְכוֹת의 군사적 배열·전열 의미를 살려 ‘전열’로 옮기고, פְּלִשְׁתִּים은 관용적 성경 표기인 ‘블레셋 사람들’로 처리했습니다.
theological_decisions:
- issue: 히브리어 수사법을 얼마나 직역할지
  chosen_reading: ‘하물며 ... 되면 어떻겠습니까?’로 옮겨, 두려움이 유다에서도 있다면 기읍라에서 블레셋의 전열을 마주할 때는 더 크다는 논증을 분명히 드러냈습니다.
  alternative_readings:
  - ‘더더욱 ... 아닙니까?’
  - ‘차라리 ... 하지 않겠습니까?’
  rationale: 본문은 단순한 정보 전달이 아니라 소(小)에서 대(大)로 가는 논증이므로, 한국어에서도 그 수사적 압력을 보존하는 것이 중요합니다.
  doctrine_reference: 문맥상 수사법 보존과 서사적 의미 전달
- issue: 직접화법의 종결 어조
  chosen_reading: 대화체를 현대 공식체로 유지해 직접 인용문 안에서도 문장 끝을 ‘-습니까’ 계열로 처리했습니다.
  alternative_readings:
  - 반말체로 단순화
  - 전통적 교회체로 높임
  rationale: 다윗의 사람들은 다윗에게 항의·설득하는 상황이지만, 기록문 전체는 표준어 합쇼체가 적절합니다.
  doctrine_reference: 번역 문체 일관성
