  source_fidelity: 개정이 필요합니다. 초안은 וַיְהִי를 ‘이제’로 옮겼으나, 제공된 영어 감사 기록도 이 담화 표지를 문두의 명시적 시간 부사로 재현하지 않도록 정리했습니다. 또한 ‘도망하여 내려왔을 때’는 בִּבְרֹחַ의 시간 관계와 יָרַד의 주절을 어색하게 겹치게 합니다. 아비아달이 에봇을 지니고 내려왔다는 주 번역은 문맥상 가능하며, 에봇을 주어로 볼 여지는 각주에 보존합니다.
  naturalness: ‘게일라에 있는 다윗에게로 도망할 때’와 ‘에봇을 손에 들고 내려왔습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. 초안의 ‘그의 손에 들고 있었습니다’는 완료된 이동 사건에 진행 상태를 부가하고, ‘다윗에게로, 곧 게일라에’는 부자연스럽습니다.
  terminology: 인명 ‘아히멜렉’, ‘아비아달’, 지명 ‘게일라’, 제의 물품명 ‘에봇’은 적절합니다. ‘에봇’은 해석적으로 ‘제사장 옷’ 등으로 한정하지 않는 것이 원문 충실성에 맞습니다.
