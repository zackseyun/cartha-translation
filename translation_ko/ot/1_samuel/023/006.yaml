  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ֠/בְרֹחַ אֶבְיָתָ֧ר בֶּן אֲחִימֶ֛לֶךְ אֶל דָּוִ֖ד קְעִילָ֑ה אֵפ֖וֹד יָרַ֥ד בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/006.yaml
  text: Now when Abiathar son of Ahimelech fled to David at Keilah[a], he came down with an ephod in his hand.
  footnotes:
  - marker: a
    text: Or 'an ephod came down in his hand,' a more literal rendering of the Hebrew word order.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 아히멜렉의 아들 아비아달이 다윗에게로, 곧 게일라에 도망하여 내려왔을 때, 에봇을 그의 손에 들고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에봇이 그의 손에 내려왔다’로 옮길 수 있는데, 이는 히브리어 어순을 더 문자적으로 따른 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 그때
  - 그리고
  lexicon: HALOT
  rationale: 서술 전환을 자연스럽게 여는 담화 표지로, 현대 한국어에서는 ‘이제’가 간결하고 문맥 흐름을 잘 살립니다.
- source_word: בִּבְרֹחַ
  english_pob_choice: when ... fled
  chosen_korean: 도망하여
  alternatives_korean:
  - 도망할 때
  - 도망하면서
  lexicon: HALOT
  rationale: ב + 부정사구의 시간적 상황을 한국어에서 동사 연결형으로 풀어, ‘…하여’가 원문의 상황 부사 기능을 잘 드러냅니다.
- source_word: קְעִילָה
  english_pob_choice: at Keilah
  chosen_korean: 게일라에
  alternatives_korean:
  - 게일라에서
  - 게일라로
  lexicon: HALOT
  rationale: 아비아달이 다윗에게 도착한 장소를 가리키므로, 위치 표현으로 ‘게일라에’가 가장 자연스럽습니다.
- source_word: בְּיָדוֹ
  english_pob_choice: with an ephod in his hand
  chosen_korean: 그의 손에 들고 있었습니다
  alternatives_korean:
  - 그의 손에 있었습니다
  - 손에 들고 왔습니다
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘손에’와 동반 의미를 살리면서, 한국어에서는 ‘들고 있었습니다’가 가장 분명하게 전달합니다.
theological_decisions:
- issue: אֵפוֹד의 번역
  chosen_reading: ‘에봇’으로 음역하여, 제의적 물건이라는 점만 유지했습니다.
  alternative_readings:
  - 제사장의 옷
  - 성복
  rationale: 본문은 에봇의 기능을 암시하지만 여기서는 구체적 해석을 덧붙이지 않으므로, 음역이 원문의 역사·제의적 특수성을 가장 충실하게 보존합니다.
  doctrine_reference: 원어 우선 원칙; 본문이 말하는 범위를 넘지 않음
