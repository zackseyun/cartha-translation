  text: וַ/יֵּ֣דַע דָּוִ֔ד כִּ֣י עָלָ֔י/ו שָׁא֖וּל מַחֲרִ֣ישׁ הָ/רָעָ֑ה וַ/יֹּ֨אמֶר֙ אֶל אֶבְיָתָ֣ר הַ/כֹּהֵ֔ן הַגִּ֖ישָׁ/ה הָ/אֵפֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/009.yaml
  text: When David learned that Saul was secretly plotting harm against him[a], he said to Abiathar the priest[b], “Bring the ephod here.”
  footnotes:
  - marker: a
    text: Or “was devising evil against him.”
    reason: lexical_alternative
  - marker: b
    text: The ephod was a priestly object associated with seeking guidance from God in this narrative context.
    reason: cultural_note
translation:
  language: ko
  text: 다윗은 사울이 자기에게 해를 끼치려고 은밀히 꾀하고 있음을 알고, 제사장 아비아달에게 말했습니다. "에봇을 이리 가져오십시오."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그에게 해를 끼치려고 은밀히 악을 꾀하고 있음을.”
    reason: lexical_alternative
  - marker: b
    text: 에봇은 이 서사 문맥에서 하나님께 묻는 데 쓰인 제사장용 물건입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּדַע
  english_pob_choice: learned
  chosen_korean: 알았습니다
  alternatives_korean:
  - 알게 되었습니다
  - 알았습니다
  lexicon: HALOT
  rationale: 서술 진행 속에서 새로 알게 된 사실을 나타내므로, 단순한 상태보다 사건성을 살린 ‘알았습니다’가 자연스럽습니다.
- source_word: מַחֲרִישׁ הָרָעָה
  english_pob_choice: was secretly plotting harm
  chosen_korean: 은밀히 꾀하고 있음을
  alternatives_korean:
  - 몰래 악을 꾀하고 있음을
  - 은밀히 해를 도모하고 있음을
  lexicon: HALOT
  rationale: ‘חרש’의 밀의적 뉘앙스를 살려 ‘은밀히 꾀하다’로 옮기고, 결과를 구체화한 영어 해석에 맞춰 ‘해를 끼치려고’로 풀어 자연스럽게 표현했습니다.
- source_word: הַגִּישָׁה הָאֵפוֹד
  english_pob_choice: Bring the ephod here
  chosen_korean: 에봇을 이리 가져오십시오
  alternatives_korean:
  - 에봇을 가져오십시오
  - 에봇을 이쪽으로 가져오십시오
  lexicon: HALOT
  rationale: ‘הגיש’의 ‘가까이 가져오다’는 의미를 현대 한국어 명령형으로 자연스럽게 살려, 의례적 물건 이름인 ‘에봇’은 음역을 유지했습니다.
- source_word: אֶל אֶבְיָתָר הַכֹּהֵן
  english_pob_choice: to Abiathar the priest
  chosen_korean: 제사장 아비아달에게
  alternatives_korean:
  - 아비아달 제사장에게
  - 제사장 아비아달에게
  lexicon: HALOT
  rationale: 히브리어의 직함 구조를 한국어의 자연스러운 호칭 순서로 옮겼습니다.
theological_decisions:
- issue: 사울의 의도인 הָרָעָה의 한국어 처리
  chosen_reading: ‘악’보다 구체적인 ‘해를 끼치다/해’로 옮겼습니다.
  alternative_readings:
  - 사울이 그에게 악을 꾀하고 있음을
  - 사울이 그에게 재앙을 도모하고 있음을
  rationale: 문맥상 다윗에게 가해질 실제적 위해가 초점이므로, 추상적인 ‘악’보다 직접적 피해를 드러내는 표현이 본문 의도를 더 정확히 전달합니다.
  doctrine_reference: 서사 문맥의 행위 의도와 해악의 구체성
