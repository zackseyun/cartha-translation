  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ שָׁא֣וּל וַ/אֲנָשָׁי/ו֮ לְ/בַקֵּשׁ֒ וַ/יַּגִּ֣דוּ לְ/דָוִ֔ד וַ/יֵּ֣רֶד הַ/סֶּ֔לַע וַ/יֵּ֖שֶׁב בְּ/מִדְבַּ֣ר מָע֑וֹן וַ/יִּשְׁמַ֣ע שָׁא֔וּל וַ/יִּרְדֹּ֥ף אַחֲרֵֽי דָוִ֖ד מִדְבַּ֥ר מָעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/025.yaml
  text: So Saul and his men went to seek him. And they told David[a], so he went down to the rock and stayed in the wilderness of Maon. When Saul heard, he pursued David in the wilderness of Maon.
  footnotes:
  - marker: a
    text: Or 'the crag' or 'the cliff' for 'the rock.' The Hebrew likely refers to a notable rocky stronghold or formation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 사울과 그의 사람들이 그를 찾으러 갔습니다. 사람들이 다윗에게 알리자 그는 바위로 내려가 마온 광야에 머물렀습니다. 사울이 그것을 듣고 마온 광야에서 다윗을 뒤쫓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '바위'를 '바위산'이나 '절벽'으로 옮길 수 있습니다. 히브리어는 여기서 두드러진 바위 요새나 바위 지형을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַקֵּשׁ
  english_pob_choice: to seek him
  chosen_korean: 그를 찾으러
  alternatives_korean:
  - 그를 찾기 위해
  - 그를 찾아
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사 구문이므로 한국어에서는 동사 목적형으로 자연스럽게 풀어 옮겼습니다. '찾다'가 'seek'의 기본 의미를 가장 직접적으로 반영합니다.
- source_word: וַיַּגִּדוּ לְדָוִד
  english_pob_choice: And they told David
  chosen_korean: 사람들이 다윗에게 알리자
  alternatives_korean:
  - 그들이 다윗에게 말하자
  - 다윗에게 알려지자
  lexicon: HALOT
  rationale: 히브리어는 복수 능동형이므로 무인칭 수동으로 바꾸지 않고, 문맥상 불특정 주체를 '사람들'로 옮겼습니다. '알리다'는 단순한 말하기보다 위급한 상황의 통보 뉘앙스를 살립니다.
- source_word: הַסֶּלַע
  english_pob_choice: the rock
  chosen_korean: 바위
  alternatives_korean:
  - 바위산
  - 절벽
  lexicon: HALOT
  rationale: 문맥상 지명적·지형적 요소를 담은 특정 바위 형성물을 가리키므로, 너무 해석적인 '절벽'보다 기본 의미를 살린 '바위'를 택했습니다.
- source_word: בְּמִדְבַּר מָעוֹן
  english_pob_choice: in the wilderness of Maon
  chosen_korean: 마온 광야
  alternatives_korean:
  - 마온 광야에서
  - 마온 들판
  lexicon: HALOT
  rationale: מִדְבָּר는 사막보다 광야가 한국어 성경에서 더 정확하고 관용적입니다. 지명은 음역 대신 본문 관습에 맞게 '마온'으로 유지했습니다.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  english_pob_choice: he pursued
  chosen_korean: 뒤쫓았습니다
  alternatives_korean:
  - 추적했습니다
  - 쫓아갔습니다
  lexicon: HALOT
  rationale: אַחֲרֵי를 별도로 풀기보다 하나의 동작으로 자연스럽게 통합해, 사울이 다윗을 뒤따라 추격하는 긴박감을 살렸습니다.
theological_decisions:
- issue: 사울의 추격 서술을 평이하게 유지할지, 전통적·경건한 어휘로 완화할지
  chosen_reading: 서술을 간결하고 직접적으로 유지해, 사울의 추격과 다윗의 이동을 있는 그대로 드러냈습니다.
  alternative_readings:
  - 보다 문어적인 표현으로 완화
  - 전통적 교회어휘로 고정
  rationale: 이 절은 사건 진행을 기록하는 내러티브이므로, 의미를 희석하는 경건체보다 원문이 가진 긴박한 서술성을 보존하는 것이 적절합니다.
  doctrine_reference: 내러티브 충실성
- issue: הַסֶּלַע를 특정 지명화할지 일반 지형명으로 둘지
  chosen_reading: 일반 지형명인 '바위'로 두고, 특정 강력한 바위 지형일 가능성은 본문에 과도하게 반영하지 않았습니다.
  alternative_readings:
  - '''바위산''으로 해석'
  - '''절벽''으로 특정'
  rationale: 히브리어는 구체적 지형을 암시하지만, 본문 자체는 그 형상을 확정하지 않으므로 과잉 해석을 피했습니다.
  doctrine_reference: 본문 충실성
