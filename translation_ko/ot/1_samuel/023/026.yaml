  text: וַ/יֵּ֨לֶךְ שָׁא֜וּל מִ/צַּ֤ד הָ/הָר֙ מִ/זֶּ֔ה וְ/דָוִ֧ד וַ/אֲנָשָׁ֛י/ו מִ/צַּ֥ד הָ/הָ֖ר מִ/זֶּ֑ה וַ/יְהִ֨י דָוִ֜ד נֶחְפָּ֤ז לָ/לֶ֨כֶת֙ מִ/פְּנֵ֣י שָׁא֔וּל וְ/שָׁא֣וּל וַ/אֲנָשָׁ֗י/ו עֹֽטְרִ֛ים אֶל דָּוִ֥ד וְ/אֶל אֲנָשָׁ֖י/ו לְ/תָפְשָֽׂ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/026.yaml
  text: Saul was going on one side of the mountain[a], and David and his men were on the other side of the mountain. David was hurrying to go away from Saul[c][b], while Saul and his men were closing in on David and his men to capture them.
  footnotes:
  - marker: a
    text: Hebrew literally, 'Saul was going on the side of the mountain from this side, and David and his men on the side of the mountain from this side.' The translation expresses the intended contrast as 'one side' and 'the other side.'
    reason: lexical_alternative
  - marker: b
    text: Or 'were surrounding David and his men.'
    reason: alternative_reading
  - marker: c
    text: Or 'to seize them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울은 산 이쪽 편으로 가고 있었고,[a] 다윗과 그의 부하들은 산 저쪽 편에 있었습니다. 다윗은 사울에게서 벗어나려고 서두르고 있었는데, 사울과 그의 부하들은 다윗과 그의 부하들을 붙잡으려고[c] 그들을 에워싸고 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 두 무리의 위치를 각각 ‘산 이쪽에서’라고 반복하여 말합니다. 한국어 본문은 그 대비를 자연스럽게 드러내기 위해 ‘이쪽 편’과 ‘저쪽 편’으로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 또는 ‘다윗과 그의 부하들을 둘러싸고 있었습니다’ 또는 ‘포위하고 있었습니다’.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘사로잡으려고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: was going on
  chosen_korean: 가고 있었고
  alternatives_korean:
