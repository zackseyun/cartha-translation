- from: 사울은 산 이쪽 편으로 가고 있었고, 다윗과 그의 부하들은 산 저쪽 편에 있었습니다. 다윗은 사울에게서 벗어나려고 서둘렀지만, 사울과 그의 부하들은 다윗과 그의 부하들을 붙잡으려고 그를 둘러싸고 있었습니다.[a][b][c]
  to: 사울은 산 이쪽 편으로 가고 있었고,[a] 다윗과 그의 부하들은 산 저쪽 편에 있었습니다. 다윗은 사울에게서 벗어나려고 서두르고 있었는데, 사울과 그의 부하들은 다윗과 그의 부하들을 붙잡으려고[c] 그들을 에워싸고 있었습니다.[b]
