  - 가고 있었으며
  lexicon: HALOT
  rationale: 진행형으로 움직임의 지속성을 살려, 산을 따라 서로 접근하는 장면을 자연스럽게 표현했습니다.
- source_word: מִצַּד הָהָר מִזֶּה / מִצַּד הָהָר מִזֶּה
  english_pob_choice: on one side of the mountain / on the other side of the mountain
  chosen_korean: 산 이쪽 편 / 산 저쪽 편
  alternatives_korean:
  - 산의 한쪽 편 / 산의 다른 쪽 편
  - 산의 이편 / 산의 저편
  lexicon: HALOT
  rationale: 히브리어의 지시적 대비를 한국어의 이쪽/저쪽으로 살려, 두 무리가 산의 서로 반대편에 있음을 분명히 했습니다.
- source_word: נֶחְפָּז
  english_pob_choice: was hurrying
  chosen_korean: 서둘렀지만
  alternatives_korean:
  - 급히 움직였지만
  - 서두르고 있었지만
  lexicon: HALOT
  rationale: 급박한 움직임을 드러내되, 감정 상태를 과도하게 덧붙이지 않도록 ‘서둘렀다’로 옮겼습니다.
- source_word: לָלֶכֶת מִפְּנֵי שָׁאוּל
  english_pob_choice: to go away from Saul
  chosen_korean: 사울에게서 벗어나려고
  alternatives_korean:
  - 사울을 피해 가려고
  - 사울 앞에서 물러나려고
  lexicon: HALOT
  rationale: 직역의 ‘사울 앞에서 가다’보다, 맥락상 압박을 피하며 물러나는 뜻을 현대 한국어로 분명하게 전했습니다.
- source_word: עֹטְרִים
  english_pob_choice: were closing in on
  chosen_korean: 둘러싸고 있었습니다
  alternatives_korean:
  - 점점 에워싸고 있었습니다
  - 포위하고 있었습니다
  lexicon: HALOT
  rationale: 포위·압박의 군사적 상황을 살리면서도, 한국어 본문 흐름에 맞게 자연스럽게 표현했습니다.
theological_decisions:
- issue: '마지막 절의 동작 관계: ‘둘러싸다’ vs ‘에워싸다/포위하다’'
  chosen_reading: 군사적 압박과 포위의 의미를 살려 ‘둘러싸고 있었습니다’로 번역했습니다.
  alternative_readings:
  - 에워싸고 있었습니다
  - 포위하고 있었습니다
  rationale: 본문은 단순한 주변 배치보다 체포를 위한 포위 압박을 보여 주므로, 동적이면서도 과장되지 않은 표현을 택했습니다.
  doctrine_reference: 서사 본문 해석 원칙
