  source_fidelity: 원문의 접속사 וַ는 여기서 단순 서술의 진행을 나타내므로, 앞 문맥에서 인과를 도출하는 듯한 ‘그래서’는 피하는 것이 적절합니다. 또한 לֵאמֹר는 질문 내용을 명시적으로 도입하므로 ‘다음과 같이’로 자연스럽게 보존했습니다. ‘이 블레셋 사람들’, ‘치다’, ‘그일라를 구하다’는 원문의 의미와 지시성을 잘 반영합니다.
  naturalness: ‘야훼께 물으며 말했습니다’는 두 동작의 동시성을 나타내어 다소 어색합니다. 현대 표준어 합쇼체 서술에서는 ‘야훼께 다음과 같이 여쭈었습니다’가 더 자연스럽고, 신에게 말하는 장면에도 알맞습니다. 명령문은 ‘쳐서 … 구하여라’로 다듬어 자연스러운 한국어 연결을 이루게 했습니다.
  terminology: ‘야훼’, ‘블레셋 사람들’, ‘그일라’의 표기는 일관되고 적절합니다. ישׁע는 이 군사적 문맥에서 ‘구하다/구출하다’로 옮기는 것이 적합하며, 신학적 의미로 한정하는 ‘구원하다’는 피하는 것이 좋습니다.
