base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/002.yaml
  text: So David inquired of Yahweh[a], saying, “Shall I go and strike these Philistines?” And Yahweh said to David, “Go and strike the Philistines, and save Keilah.”
  footnotes:
  - marker: a
    text: Or 'deliver Keilah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 다윗은 야훼께 물으며 말했습니다. 「제가 가서 이 블레셋 사람들을 칠까요?」 야훼께서 다윗에게 말씀하셨습니다. 「가서 블레셋 사람들을 치고, 그일라를 구하라.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그일라를 건져내다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  english_pob_choice: inquired of Yahweh
  chosen_korean: 야훼께 물으며
  alternatives_korean:
  - 야훼께 문의하며
  - 야훼께 여쭈며
  lexicon: HALOT
  rationale: שׁאל with the divine name denotes seeking guidance, so ‘물으며’가 단순 질문보다 상담적·신탁적 의미를 살리면서도 자연스럽습니다.
- source_word: הַאֵלֵךְ וְהִכֵּיתִי
  english_pob_choice: Should I go and strike
  chosen_korean: 제가 가서 이 블레셋 사람들을 칠까요?
  alternatives_korean:
  - 제가 가서 이 블레셋 사람들을 치리이까?
  - 제가 가서 이 블레셋 사람들을 공격할까요?
  lexicon: HALOT
  rationale: 의문문과 군사적 동작을 함께 살려 ‘가서 … 칠까요?’로 옮겼고, 영어 POB의 deliberative question에 맞춰 현대적이면서도 형식적인 어조를 유지했습니다.
- source_word: בַּפְּלִשְׁתִּים הָאֵלֶּה
  english_pob_choice: these Philistines
  chosen_korean: 이 블레셋 사람들
  alternatives_korean:
  - 이 블레셋 사람들
  - 저 블레셋 사람들
  lexicon: HALOT
  rationale: הָאֵלֶּה의 지시성을 ‘이’로 살려, 특정 위협 집단을 가리키는 뉘앙스를 보존했습니다.
- source_word: וְהוֹשַׁעְתָּ אֶת קְעִילָה
  english_pob_choice: and save Keilah
  chosen_korean: 그일라를 구하라
  alternatives_korean:
  - 그일라를 구하라
  - 그일라를 구원하라
  lexicon: HALOT
  rationale: ישׁע는 전쟁 맥락에서 ‘위험에서 건져 구하다’의 뜻이므로, ‘구원’보다 직접적이고 자연스러운 ‘구하다’를 택했습니다. 장소명은 그일라로 음역했습니다.
theological_decisions:
- issue: יהוה / YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 신명기적 이름을 사용하므로, 프로젝트 기준에 따라 경칭 대체어 ‘주’ 대신 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
