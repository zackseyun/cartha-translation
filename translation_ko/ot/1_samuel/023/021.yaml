translation:
  language: ko
  text: 사울이 말했습니다. 「여호와께서 당신들에게 복을 주시기를 빕니다[a]. 당신들이 저를 불쌍히 여기셨기 때문입니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “당신들은 여호와께 복을 받은 이들입니다”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “나를 불쌍히 여기셨기 때문입니다”입니다. 이 동사는 문맥에 따라 누군가를 아껴 살려 주는 뜻을 나타낼 수도 있습니다.
    reason: lexical_alternative
