base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/021.yaml
  text: Saul said[a], “May you be blessed by Yahweh[b], because you have had compassion on me.”
  footnotes:
  - marker: a
    text: Or “Blessed are you of the LORD.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “you have had pity/compassion on me”; the verb can also carry the sense of sparing in some contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울이 말했습니다[a]. 「여호와께 복이 있기를 빕니다[b]. 당신들이 저를 불쌍히 여기셨기 때문입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “여호와께 복 있는 자들(복되다)입니다”의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “나를 불쌍히 여기셨기 때문입니다”로, 문맥에 따라 “나를 살려 주셨기 때문입니다”의 뉘앙스를 가질 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר / said
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 이르렀습니다
  lexicon: HALOT
  rationale: 서사 문맥의 wayyiqtol אמר를 한국어 자연문체로 옮기되, 구어적 과장 없이 보고체 합쇼체를 유지했습니다.
- source_word: בְּרוּכִים אַתֶּם לַיהוָה
  english_pob_choice: May you be blessed by Yahweh
  chosen_korean: 여호와께 복이 있기를 빕니다
  alternatives_korean:
  - 여호와께 복을 받으십시오
  - 여호와께 복되시기를 바랍니다
  lexicon: HALOT
  rationale: 축복 선포의 수행성을 살리기 위해 단순 서술이 아니라 소원·축복 형식으로 옮겼고, לַיהוָה는 축복의 출처/관련 대상을 드러내는 표현으로 처리했습니다.
- source_word: חֲמַלְתֶּם עָלַי
  english_pob_choice: have had compassion on me
  chosen_korean: 저를 불쌍히 여기셨기 때문입니다
  alternatives_korean:
  - 저를 가엾게 여기셨기 때문입니다
  - 저를 불쌍히 여겨 주셨기 때문입니다
  - 저를 아껴 주셨기 때문입니다
  lexicon: HALOT
  rationale: חמל의 핵심인 pity/compassion을 한국어의 ‘불쌍히 여기다’로 옮겨 감정적 자비를 살렸습니다. 여기서는 ‘살려 주다/아끼다’보다 원문의 정서가 더 분명합니다.
theological_decisions:
- issue: 여호와(יהוה) 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 프로젝트의 구약 기본 용례와 본문 내 직역성에 따라 YHWH를 고유명사로 드러내는 ‘여호와’를 채택했습니다. 본문은 축복의 원천을 특정 언약명으로 지시합니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH'
- issue: 축복문의 행위 화행
  chosen_reading: ‘여호와께 복이 있기를 빕니다’
  alternative_readings:
  - ‘여호와께서 당신들을 복 주시기를 바랍니다’
  - ‘복되기를 빕니다’
  rationale: 히브리어의 בְּרוּכִים אַתֶּם는 단순 상태 진술보다 축복 선언에 가깝기 때문에, 한국어도 화행성을 유지하는 소망형으로 옮겼습니다.
  doctrine_reference: 'POB translation philosophy: optimal-equivalence'
