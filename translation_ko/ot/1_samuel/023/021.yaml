  rationale: 이 프로젝트의 구약 기본 용례와 본문 내 직역성에 따라 YHWH를 고유명사로 드러내는 ‘여호와’를 채택했습니다. 본문은 축복의 원천을 특정 언약명으로 지시합니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH'
- issue: 축복문의 행위 화행
  chosen_reading: ‘여호와께 복이 있기를 빕니다’
  alternative_readings:
  - ‘여호와께서 당신들을 복 주시기를 바랍니다’
  - ‘복되기를 빕니다’
  rationale: 히브리어의 בְּרוּכִים אַתֶּם는 단순 상태 진술보다 축복 선언에 가깝기 때문에, 한국어도 화행성을 유지하는 소망형으로 옮겼습니다.
  doctrine_reference: 'POB translation philosophy: optimal-equivalence'
