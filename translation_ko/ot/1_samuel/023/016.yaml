  text: וַ/יָּ֨קָם֙ יְהוֹנָתָ֣ן בֶּן שָׁא֔וּל וַ/יֵּ֥לֶךְ אֶל דָּוִ֖ד חֹ֑רְשָׁה וַ/יְחַזֵּ֥ק אֶת יָד֖/וֹ בֵּ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/016.yaml
  text: Then Jonathan son of Saul arose and went to David at Horesh[a], and strengthened his hand in God.
  footnotes:
  - marker: a
    text: Or 'encouraged him in God'; literally, 'strengthened his hand in God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울의 아들 요나단이 일어나 다윗에게 호레스[a]로 가서, 하나님 안에서 그의 손을 강하게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그를 하나님 안에서 격려했다'의 뜻일 수 있습니다. 문자적으로는 '그의 손을 하나님 안에서 강하게 했다'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어나
  alternatives_korean:
  - 떠나
  - 나섰습니다
  lexicon: HALOT
  rationale: בקש된 시작 동작과 서술 흐름을 살리면서, 현대 한국어에서도 자연스럽고 과도하게 풀이하지 않는 표현입니다.
- source_word: יְהוֹנָתָן בֶּן שָׁאוּל
  english_pob_choice: Jonathan son of Saul
  chosen_korean: 사울의 아들 요나단
  alternatives_korean:
  - 사울의 아들 요나단
  - 요나단, 사울의 아들
  lexicon: 고유명사 관례
  rationale: 히브리어의 친족 관계를 자연스럽게 옮기되, 사울과 요나단의 정치적·가족적 긴장을 그대로 드러냅니다.
- source_word: חֹרְשָׁה
  english_pob_choice: Horesh
  chosen_korean: 호레스
  alternatives_korean:
  - 호레쉬
  - 그 숲
  lexicon: HALOT
  rationale: 문맥상 지명으로 보는 것이 타당하여 음역을 유지했습니다. 기존 영어 주석의 발음을 반영하되, 한국어 표기는 현대 외래어 표기 관례에 맞췄습니다.
- source_word: וַיְחַזֵּק אֶת יָדוֹ
  english_pob_choice: strengthened his hand
  chosen_korean: 그의 손을 강하게 했습니다
  alternatives_korean:
  - 그를 격려했습니다
  - 그의 결심을 굳게 했습니다
  lexicon: HALOT
  rationale: 히브리어의 손(יד) 이미지를 보존해 원문 감각을 살렸습니다. '격려하다'는 의미는 담기지만, 본문이 가진 직역적 긴장을 약화시킬 수 있습니다.
- source_word: בֵּאלֹהִים
  english_pob_choice: in God
  chosen_korean: 하나님 안에서
  alternatives_korean:
  - 하나님으로 말미암아
  - 하나님 가운데서
  lexicon: 히브리어 전치사 ב
  rationale: 전치사 ב의 장이나 근거의 의미를 한국어로 가장 자연스럽게 옮겼습니다. '안에서'는 존재 영역/근거를 모두 살릴 수 있습니다.
theological_decisions:
- issue: אֱלֹהִים를 여호와가 아니라 하나님으로 번역하는 문제
  chosen_reading: 본문은 신명기적 표제어인 하나님의 일반명 אֱלֹהִים을 사용하므로 '하나님'으로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 원문에 야훼가 아니라 אֱלֹהִים이 있으므로, 전통적 관용보다 원문 우선 원칙을 따랐습니다.
  doctrine_reference: 원문 우선 원칙; YHWH/אֱלֹהִים 구분
