id: 1SA.23.10
reference: 1 Samuel 23:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שָׁמֹ֤עַ שָׁמַע֙ עַבְדְּ/ךָ֔ כִּֽי מְבַקֵּ֥שׁ שָׁא֖וּל לָ/ב֣וֹא אֶל קְעִילָ֑ה לְ/שַׁחֵ֥ת לָ/עִ֖יר בַּ/עֲבוּרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/010.yaml
  text: Then David said[a], “O Yahweh, God of Israel, your servant has surely heard that Saul is seeking to come to Keilah to destroy the city because of me.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그때 다윗이 말했습니다. 「야훼[a], 이스라엘의 하나님이시여, 주님의 종이 사울이 나 때문에 그 성을 파괴하려고 가일라로 오려 한다는 것을 분명히 들었습니다。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘YHWH’; 전통적으로 ‘주’로 번역합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그리하여 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서사 진행을 자연스러운 한국어로 옮기기 위해 ‘그때’로 연결하면서, 동사의 기본 의미는 ‘말했습니다’로 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 טetragrammaton을 직접 가리키므로, 본 프로젝트 기본값에 따라 고유명사 ‘야훼’로 옮겼습니다.
- source_word: שָׁמֹעַ שָׁמַע
  english_pob_choice: has certainly heard
  chosen_korean: 확실히 들었습니다
  alternatives_korean:
  - 분명히 들었습니다
  - 확실하게 들었습니다
  lexicon: HALOT
  rationale: 부정사 절대형+완전동사의 강조를 한국어의 부사 ‘확실히’로 압축해 중첩된 강조를 살렸습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 종이
  - 당신의 노예
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 호칭의 자기지칭으로서 예의와 관계성을 살리기 위해 ‘종’을 택했고, 영어 POB도 ‘servant’로 유지한 선택을 반영했습니다.
- source_word: מְבַקֵּשׁ לָבוֹא אֶל קְעִילָה לְשַׁחֵת לָעִיר
  english_pob_choice: is seeking to come to Keilah to destroy the city
  chosen_korean: 가일라로 와서 그 성을 멸하려 한다는
  alternatives_korean:
  - 가일라에 와서 그 도시를 파괴하려 한다는
  - 가일라로 들어와 그 성을 파멸시키려 한다는
  lexicon: HALOT
  rationale: ‘seek to come’의 진행성과 목적을 ‘와서 ... 하려 한다’로 자연스럽게 풀고, 전쟁 맥락의 לְשַׁחֵת는 ‘멸하다’로 강하게 옮겼습니다.
theological_decisions:
- issue: 야훼 호칭의 표기
  chosen_reading: 직접 이름을 드러내는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 전통적 대체어 ‘주님’
  - ‘여호와’ 표기
  rationale: 히브리어 본문이 יְהוָה를 직접 사용하므로, 대체 호칭보다 신적 고유명을 드러내는 번역이 स्रोत-직결성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 다윗의 자기지칭 어조
  chosen_reading: 하나님께 드리는 간구체로 존칭을 유지하되, 본문 내부는 현대 서술체로 유지했습니다.
  alternative_readings:
  - 더 경건한 기도문체로 높임
  - 일반 서술체로 평준화
  rationale: 직접 화행은 기도문맥이지만, 현대 합쇼체 안에서 자연스럽게 읽히도록 하되 히브리어의 간구 상황을 흐리지 않도록 했습니다.
  doctrine_reference: Korean register policy for direct address in prayer
