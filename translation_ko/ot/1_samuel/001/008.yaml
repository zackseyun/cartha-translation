- from: 그러자 엘가나가 그의 아내 한나에게 말했습니다. 「한나야, 왜 울고 있느냐? 왜 먹지 않느냐? 왜 네 마음이 상하느냐? 내가 너에게 열 아들보다 낫지 않느냐?」[a]
  to: 그러자 엘가나가 자기 아내 한나에게 말했습니다. “한나, 왜 울고 있습니까? 왜 먹지 않습니까? 왜 당신의 마음이 괴롭습니까?[a] 내가 당신에게 열 아들보다 낫지 않습니까?”
  rationale: 원문의 반복된 의문문, ‘마음’의 비유적 표현, ‘열 아들’이라는 성별 특정 표현, 수사적 반문을 유지했습니다. 한국어에서 오해될 수 있는 ‘마음이 상하다’를 문맥에 맞는 ‘마음이 괴롭다’로 바로잡고, 관련 각주를 해당 절에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:17:59Z'
