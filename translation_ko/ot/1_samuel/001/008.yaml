  source_fidelity: 엘가나를 한나의 남편으로 밝히고, 세 차례의 ‘왜’와 긍정 답변을 기대하는 반문, 그리고 ‘열 아들’을 보존한 점은 원문에 충실합니다. 다만 ‘마음이 상하다’는 한국어에서 흔히 섭섭함이나 불쾌함을 뜻하여 כאן의 내적 슬픔·괴로움보다 의미가 좁고, 각주 표지도 해당 표현에 직접 붙이는 것이 적절합니다.
