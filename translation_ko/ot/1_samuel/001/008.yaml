base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/008.yaml
  text: Then Elkanah her husband said to her[a], “Hannah, why are you weeping? And why do you not eat? And why is your heart troubled? Am I not better to you than ten sons?”
  footnotes:
  - marker: a
    text: Or 'is your heart sad/grieved?' Literally, 'why is your heart bad?'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 엘가나가 자기 아내 한나에게 말했습니다. “한나, 왜 울고 있습니까? 왜 먹지 않습니까? 왜 당신의 마음이 괴롭습니까?[a] 내가 당신에게 열 아들보다 낫지 않습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왜 당신의 마음이 나쁩니까?’입니다. 문맥상 내적 슬픔이나 괴로움을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 연속 동사를 자연스러운 한국어 서술로 옮기되, 앞뒤 사건의 진행을 분명히 드러내기 위해 ‘그러자’를 사용했습니다.
- source_word: אֶלְקָנָה אִישָׁהּ
  english_pob_choice: Elkanah her husband
  chosen_korean: 엘가나가 그의 아내 한나에게
  alternatives_korean:
  - 그의 남편 엘가나가
  - 남편 엘가나가
  lexicon: HALOT
  rationale: 히브리어의 동격 관계를 한국어에서는 ‘그의 아내 한나’로 풀어, 엘가나와 한나의 관계를 자연스럽게 드러냈습니다.
- source_word: יֵרַע לְבָבֵךְ
  english_pob_choice: is your heart troubled
  chosen_korean: 네 마음이 상하느냐
  alternatives_korean:
  - 네 마음이 슬프냐
  - 네 마음이 괴롭냐
  lexicon: HALOT
  rationale: 직역하면 ‘마음이 나쁘다’이지만, 문맥상 내적 고통과 슬픔을 가리키므로 한국어 관용과 원문의 심장-중심 이미지를 함께 살렸습니다.
- source_word: מֵעֲשָׂרָה בָּנִים
  english_pob_choice: than ten sons
  chosen_korean: 열 아들보다
  alternatives_korean:
  - 열 자녀보다
  - 아들 열 명보다
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 ‘아들들’을 보존해 출산/후손에 관한 문화적 뉘앙스를 지켰습니다.
theological_decisions:
- issue: 반문형 기대 응답의 보존
  chosen_reading: ‘내가 너에게 열 아들보다 낫지 않느냐?’로 옮겨, 긍정 대답을 기대하는 반문을 유지했습니다.
  alternative_readings:
  - 내가 너에게 열 아들보다 더 낫지?
  - 내가 너에게 열 아들보다 더 좋지 않으냐?
  rationale: 히브리어 הֲלוֹא는 단순 정보 질문이 아니라 긍정 답변을 유도하는 수사적 반문이므로, 한국어도 그 힘을 유지해야 합니다.
  doctrine_reference: 문맥 수사 보존 원칙
- issue: ‘마음’의 인류학적 이미지
  chosen_reading: ‘네 마음이 상하느냐’로 옮겨, 히브리어 לֵב/לְבָב의 내면 중심 이미지를 유지했습니다.
  alternative_readings:
  - 네 속이 상하느냐
  - 네 마음이 아프냐
  rationale: 원문은 감정의 중심을 ‘마음’으로 표현하므로, 의미는 풀되 심장/마음 이미지를 지우지 않는 번역이 적절합니다.
  doctrine_reference: 성서 인류학 표현 보존
