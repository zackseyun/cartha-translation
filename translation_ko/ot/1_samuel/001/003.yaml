  lexicon: HALOT
  rationale: 정기적으로 반복되는 순례를 간결한 현대 한국어 관용 표현 ‘해마다’로 옮겼습니다.
- source_word: לַיהוָה צְבָא֖וֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 야훼 만군
  alternatives_korean:
  - 만군의 야훼
  - 만군의 주
  - 야훼 만군의 하나님
  lexicon: HALOT
  rationale: יהוה는 기본 원칙대로 ‘야훼’로, צְבָאוֹת는 문자적 의미를 살린 ‘만군’으로 옮겨 원문 호칭의 힘을 보존했습니다.
- source_word: בְּשִׁלֹה
  english_pob_choice: at Shiloh
  chosen_korean: 시골로에서
  alternatives_korean:
  - 실로에서
  - 실로에
  - 실로에서
  lexicon: HALOT
  rationale: 지명은 현대 외래어 표기 관행에 따라 ‘시골로’로 옮겼습니다.
- source_word: כֹּהֲנִים לַיהוָה
  english_pob_choice: as priests of the LORD
  chosen_korean: 야훼의 제사장으로
  alternatives_korean:
