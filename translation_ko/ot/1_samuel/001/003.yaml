  text: That man used to go up from his city year after year to worship and to sacrifice to Yahweh of Armies at Shiloh. And the two sons of Eli[a], Hophni and Phinehas, were there as priests of Yahweh.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the LORD of Hosts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람은 해마다 자기 성읍에서 실로로 올라가 만군의 야훼께 예배드리고 제사를 드리곤 했습니다.[a] 그곳에는 엘리의 두 아들, 홉니와 비느하스가 야훼의 제사장으로 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만군의 야훼’는 히브리어 칭호의 직역입니다. 전통적으로는 ‘만군의 주’라고도 옮깁니다.
    reason: lexical_alternative
