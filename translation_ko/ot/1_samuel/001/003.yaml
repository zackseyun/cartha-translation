  lexicon: HALOT
  rationale: כהנים은 직분 명칭이므로 ‘제사장’으로, 관계 표지는 ‘~의’보다 상태를 나타내는 ‘~로’가 문맥상 자연스럽습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
