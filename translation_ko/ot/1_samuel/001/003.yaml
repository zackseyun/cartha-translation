base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/003.yaml
  text: That man used to go up from his city year after year to worship and to sacrifice to Yahweh of Armies at Shiloh. And the two sons of Eli[a], Hophni and Phinehas, were there as priests of Yahweh.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the LORD of Hosts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람은 해마다 자기 성읍에서 올라가 야훼 만군에게 예배하고 시골로에서 제사를 드렸습니다. 엘리의 두 아들 홉니와 비느하스는 거기에서 야훼의 제사장으로 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만군’은 히브리어 צְבָאוֹת의 직역으로, 전통적 표현인 ‘만군의 주’와 같은 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָלָה
  english_pob_choice: used to go up
  chosen_korean: 올라가
  alternatives_korean:
  - 갔습니다
  - 올라갔습니다
  lexicon: HALOT
  rationale: עלה의 기본 뜻인 ‘올라가다’를 살리되, 반복적 관습은 문맥과 ‘해마다’로 자연스럽게 드러냈습니다.
- source_word: מִיָּמִים יָמִימָה
