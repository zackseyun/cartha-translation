  rationale: 한국어에서 기능하지 않는 문자적 완곡법은 원문의 의미와 문체적 절제를 함께 살리는 자연스러운 문어 표현인 ‘동침하다’로 옮겼습니다. ‘기억하셨습니다’는 원문의 표현과 열려 있는 함의를 보존했으며, 그 의미 확장은 각주에만 두었습니다. 또한 이동 동사의 연속과 각주 표지의 지시 대상을 명확히 했습니다.
