revisions:
- from: 그들은 아침 일찍 일어나 야훼 앞에 엎드려 절한 다음, 돌아서서 라마에 있는 자기 집으로 갔습니다. 그리고 엘가나가 자기 아내 한나를 알았으며, 야훼께서 그녀를 기억하셨습니다.[a][b]
