  source_fidelity: 본문의 이동 동사는 ‘돌아서서 ... 갔습니다’보다 ‘돌아가 ... 이르렀습니다’가 וַיָּשֻׁבוּ וַיָּבֹאוּ의 연속을 더 충실히 반영합니다. ידע는 이 문맥에서 부부의 성관계를 뜻하므로, 한국어의 일반적인 ‘알다’(인지·친분의 뜻)로는 원문의 관용적 의미가 충분히 전달되지 않습니다.
  naturalness: ‘자기 아내 한나를 알았으며’는 현대 한국어에서 성관계의 완곡어법으로 자연스럽게 기능하지 않고 의미가 부자연스럽거나 오해될 수 있습니다. ‘아내 한나와 동침하였고’는 문어적이지만 현대 성경 문체에서 자연스럽고 의미가 명확합니다. 대명사 ‘그녀’ 대신 ‘한나’를 반복하면 한국어 문맥이 더 선명합니다.
  terminology: ‘야훼’, ‘엘가나’, ‘한나’, ‘라마’는 일관되고 적절합니다. זכר는 ‘기억하셨습니다’로 유지하되, 그 함축은 각주에서 설명하는 것이 적절합니다.
