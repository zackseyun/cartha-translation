  edition: WLC
  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֗קֶר וַ/יִּֽשְׁתַּחֲווּ֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יָּשֻׁ֛בוּ וַ/יָּבֹ֥אוּ אֶל בֵּיתָ֖/ם הָ/רָמָ֑תָ/ה וַ/יֵּ֤דַע אֶלְקָנָה֙ אֶת חַנָּ֣ה אִשְׁתּ֔/וֹ וַ/יִּֽזְכְּרֶ֖/הָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/019.yaml
  text: They rose early in the morning and bowed down before Yahweh[a]. Then they returned and came to their house at Ramah, and Elkanah knew Hannah his wife[b], and Yahweh remembered her.
  footnotes:
  - marker: a
    text: Hebrew 'knew,' a customary euphemism for marital sexual relations.
    reason: lexical_alternative
  - marker: b
    text: '''Remembered'' in Hebrew often means more than mental recollection; it can imply that God turned toward someone in faithful, effective regard.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 아침 일찍 일어나 야훼 앞에 엎드려 절한 다음, 돌아서서 라마에 있는 자기 집으로 갔습니다. 그리고 엘가나가 자기 아내 한나를 알았으며, 야훼께서 그녀를 기억하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘알다’는 여기서 혼인 관계를 가리키는 관용적 완곡법입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기억하다’는 히브리어에서 단순한 기억 이상으로, 신실하게 돌보며 행동하시는 뜻을 담을 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁכִּ֣מוּ בַ/בֹּ֗קֶר
  english_pob_choice: They rose early in the morning
  chosen_korean: 아침 일찍 일어나
  alternatives_korean:
  - 이른 아침에 일어나
  - 일찍 일어났습니다
  lexicon: WLC/HALOT
  rationale: שׁכם의 ‘일찍 일어나다’와 בוקר의 ‘아침’ 의미를 자연스러운 현대 한국어로 살렸습니다.
- source_word: וַ/יִּשְׁתַּחֲווּ֙ לִ/פְנֵ֣י יְהוָ֔ה
  english_pob_choice: bowed down before Yahweh
  chosen_korean: 야훼 앞에 엎드려 절한
  alternatives_korean:
  - 야훼 앞에 경배한
  - 야훼 앞에 엎드린
  lexicon: WLC/HALOT
  rationale: השתחוה는 단순한 ‘예배하다’보다 몸을 굽혀 엎드리는 동작을 포함하므로, 그 구체성을 살려 번역했습니다.
- source_word: הָ/רָמָתָ֑ה
  english_pob_choice: Ramah
  chosen_korean: 라마
  alternatives_korean:
  - 라마 지역
  - 라마에서
  lexicon: WLC
  rationale: 고유 지명은 현대 음역 관행에 따라 ‘라마’로 옮기고, מקום/방향성은 문맥상 ‘~에 있는’으로 풀었습니다.
- source_word: וַ/יֵּ֤דַע אֶלְקָנָה֙ אֶת חַנָּ֣ה אִשְׁתּ֔/וֹ
  english_pob_choice: Elkanah knew Hannah his wife
  chosen_korean: 엘가나가 자기 아내 한나를 알았으며
  alternatives_korean:
  - 엘가나가 한나와 관계했으며
  - 엘가나가 자기 아내 한나와 동침했으며
  lexicon: WLC/HALOT
  rationale: ידע의 관용적 완곡법을 본문에 유지해 원문 등록을 보존했습니다. 한국어로는 ‘알다’가 동일한 완곡 기능을 가장 직접적으로 전달합니다.
- source_word: וַ/יִּֽזְכְּרֶ֖/הָ יְהוָֽה־־
  english_pob_choice: Yahweh remembered her
  chosen_korean: 야훼께서 그녀를 기억하셨습니다
  alternatives_korean:
  - 야훼께서 그녀를 생각하셨습니다
  - 야훼께서 그녀를 돌보셨습니다
  lexicon: WLC/HALOT
  rationale: זכר를 ‘기억하다’로 유지해, 단순한 회상이 아니라 유효한 돌봄을 뜻하는 히브리어 관용을 본문 차원에서 보존했습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 히브리어 사성음가 יהוה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 하나님의 이름을 사용하므로, 표제를 가리는 대체어보다 고유 이름을 드러내는 번역이 소스-직역 원칙에 더 부합합니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → Yahweh
- issue: ‘기억하셨습니다’의 의미
  chosen_reading: 단순한 회상보다 유효한 돌봄의 의미를 함축하되, 본문 표현은 그대로 유지했습니다.
  alternative_readings:
  - 그녀를 돌보셨습니다
  - 그녀를 기억하고 행동하셨습니다
  rationale: 본문 자체는 결과를 설명하지 않고 ‘기억’의 진술만 하므로, 해석을 앞서기보다 히브리어 관용을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3
