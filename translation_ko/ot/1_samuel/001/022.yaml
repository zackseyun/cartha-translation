revisions:
- from: 그러나 한나는 올라가지 않았습니다. 그녀가 남편에게 말하기를, “아이가 젖을 뗄 때까지는 제가 그를 데려가지 않겠습니다. 그러면 그가 야훼 앞에 나타나게 하고, 거기서 평생 머물게 하겠습니다.”[a][b]
  to: 그러나 한나는 올라가지 않았습니다. 한나가 남편에게 이렇게 말했기 때문입니다. “아이가 젖을 뗄 때까지는 그를 데려가지 않겠습니다. 그 후에 그를 데려가면, 그가 야훼 앞에 나타나[a] 거기서 평생 머물 것입니다.”[b]
  rationale: 시간 유보 뒤에 이어지는 한나의 긍정적 의도(‘그 후에 그를 데려가면’)를 명시하고, ‘나타나다’와 ‘머물다’의 주어를 아이로 유지했습니다. 대안 독법은 본문에 강제하지 않고, 해당 구절에 닻을 둔 각주로 보존했습니다.
