    rationale: ‘…때까지는 데려가지 않겠습니다’만으로는 그 시점 이후 실제로 데려가겠다는 한나의 진술이 명시되지 않습니다. 히브리어는 ‘아이가 젖을 뗄 때까지 [기다렸다가] 그를 데려가겠습니다’라는 순서를 제시합니다.
