source:
  edition: WLC
  text: וְ/חַנָּ֖ה לֹ֣א עָלָ֑תָה כִּֽי אָמְרָ֣ה לְ/אִישָׁ֗/הּ עַ֣ד יִגָּמֵ֤ל הַ/נַּ֨עַר֙ וַ/הֲבִאֹתִ֗י/ו וְ/נִרְאָה֙ אֶת פְּנֵ֣י יְהוָ֔ה וְ/יָ֥שַׁב שָׁ֖ם עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/022.yaml
  text: But Hannah did not go up[a], for she said to her husband, “Not until the boy is weaned will I bring him[b], so that he may appear before Yahweh and stay there forever.”
  footnotes:
  - marker: a
    text: 'Or, following another construal/textual tradition: “and I will appear before the LORD, and he will stay there forever.”'
    reason: alternative_reading
  - marker: b
    text: “Forever” here refers to Samuel’s permanent dedication to the LORD’s service, that is, for the rest of his life.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 한나는 올라가지 않았습니다. 한나가 남편에게 이렇게 말했기 때문입니다. “아이가 젖을 뗄 때까지는 그를 데려가지 않겠습니다. 그 후에 그를 데려가면, 그가 야훼 앞에 나타나[a] 거기서 평생 머물 것입니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다른 구문 이해 또는 본문 전통을 따르면, “제가 야훼 앞에 나타나고, 그가 거기서 평생 머물 것입니다”로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘평생’은 사무엘이 야훼를 섬기도록 남은 생애 동안 바쳐진다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְחַנָּה לֹא עָלָתָה
  english_pob_choice: But Hannah did not go up
  chosen_korean: 그러나 한나는 올라가지 않았습니다
  alternatives_korean:
  - 그러나 한나는 올라가지 않았습니다
  - 그러나 한나는 올라가지 않았습니다
  lexicon: HALOT
  rationale: עלה의 기본적인 공간적 의미인 ‘올라가다’를 살려, 실로의 성소로 올라가는 언약 공동체적 움직임을 과하게 풀지 않았습니다.
- source_word: עַד יִגָּמֵל הַנַּעַר
  english_pob_choice: Not until the boy is weaned
  chosen_korean: 아이가 젖을 뗄 때까지는
  alternatives_korean:
  - 소년이 젖을 뗄 때까지는
  - 아이가 젖을 뗄 때까지는
  lexicon: HALOT
  rationale: ‘소년’보다 여기서는 어린 자녀를 가리키는 자연스러운 ‘아이’가 문맥에 더 잘 맞고, ‘젖을 떼다’가 히브리어의 수유 종료를 한국어로 직접 드러냅니다.
- source_word: וַהֲבִאֹתִיו
  english_pob_choice: then I will bring him
  chosen_korean: 제가 그를 데려가지 않겠습니다
  alternatives_korean:
  - 제가 그를 데려오겠습니다
  - 제가 그를 데려가겠습니다
  lexicon: HALOT
  rationale: 한나가 성소로 아이를 ‘가져오는’ 방향성을 한국어 자연어에서 ‘데려가다’로 옮겨, 서원 이행의 동작성을 살렸습니다.
- source_word: וְנִרְאָה אֶת פְּנֵי יְהוָה
  english_pob_choice: so that he may appear before Yahweh
  chosen_korean: 그가 야훼 앞에 나타나게 하고
  alternatives_korean:
  - 제가 야훼 앞에 나타나게 하고
  - 그가 야훼 앞에 보이게 하고
  lexicon: HALOT
  rationale: נראה의 수동적 용법을 ‘나타나게 하다’로 살려, 주어를 사무엘로 보는 본문의 주된 독법을 반영했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 언약명 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 신적 고유명을 제목어로 대체하지 않았습니다.
- source_word: וְיָשַׁב שָׁם עַד עוֹלָם
  english_pob_choice: and stay there forever
  chosen_korean: 거기서 평생 머물게 하겠습니다
  alternatives_korean:
  - 거기서 영원히 머물게 하겠습니다
  - 거기서 평생 거하게 하겠습니다
  lexicon: HALOT
  rationale: עַד עוֹלָם은 이 문맥에서 생애 전체의 지속적 헌신을 가리키므로, 한국어에서는 ‘평생’이 의도를 가장 분명하게 전달합니다.
theological_decisions:
- issue: ‘그가…나타나게 하고, 거기서 평생 머물게 하겠습니다’의 주어 해석
  chosen_reading: 주어를 사무엘로 유지해, 한나가 아이를 데려간 뒤 그가 야훼 앞에 나타나고 거기서 머무는 뜻으로 옮겼습니다.
  alternative_readings:
  - 한나가 야훼 앞에 나타난다는 독법
  - ‘제가 야훼 앞에 나타나고, 그가 거기서 평생 머물게 하겠습니다’라는 이문/다른 구문 이해
  rationale: 히브리어 문장 흐름상 ‘그를 데려가지 않겠습니다’ 다음에는 아이가 이어지는 것이 가장 자연스럽고, 사무엘의 성소 봉헌이라는 내러티브 목적과도 맞습니다.
  doctrine_reference: 본문의 문장 주체가 흔들리는 지점을 해소하기보다, 가능한 해석 차이를 주해적으로 보존합니다.
