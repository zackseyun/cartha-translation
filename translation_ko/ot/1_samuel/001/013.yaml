  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘그녀가 취한 것으로 생각했습니다’보다 ‘그녀를 술에 취한 여자로 여겼습니다’가 한국어에서 판단의 대상과 내용을 더 명료하게 나타냅니다.
