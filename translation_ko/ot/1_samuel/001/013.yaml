translation:
  language: ko
  text: 한나는 마음속으로 말하고 있었습니다. 그녀의 입술만 움직이고 있었고[a], 목소리는 들리지 않았습니다. 그래서 엘리는 그녀를 술에 취한 여자로 여겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속으로 말하고 있었다’ 또는 ‘속으로 기도하고 있었다’라고 번역할 수 있습니다. 히브리어 표현은 문자적으로 ‘그녀의 마음을 향하여 말하고 있었다’입니다.
    reason: lexical_alternative
lexical_decisions:
