language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חַנָּ֗ה הִ֚יא מְדַבֶּ֣רֶת עַל לִבָּ֔/הּ רַ֚ק שְׂפָתֶ֣י/הָ נָּע֔וֹת וְ/קוֹלָ֖/הּ לֹ֣א יִשָּׁמֵ֑עַ וַ/יַּחְשְׁבֶ֥/הָ עֵלִ֖י לְ/שִׁכֹּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/013.yaml
  text: Now Hannah was speaking in her heart; only her lips were moving[a], but her voice was not heard. So Eli thought she was drunk.
  footnotes:
  - marker: a
    text: Or 'was speaking to herself' / 'was praying within herself.' The Hebrew literally says 'was speaking in her heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이때 한나는 마음속으로 말하고 있었습니다. 입술만 움직일 뿐[a] 목소리는 들리지 않았습니다. 그래서 엘리는 그녀가 취한 것으로 생각했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 자신에게 말하고 있었다’/‘자기 속으로 기도하고 있었다’라는 뜻일 수 있습니다. 히브리어는 문자적으로 ‘마음속에서 말하고 있었다’라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֶּרֶת עַל לִבָּהּ
  english_pob_choice: was speaking in her heart
  chosen_korean: 마음속으로 말하고 있었습니다
  alternatives_korean:
  - 속으로 말하고 있었습니다
  - 마음에 대고 말하고 있었습니다
  - 속으로 기도하고 있었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 내면적이고 소리 없는 발화를 가리키므로, ‘마음속으로’가 이미지와 의미를 함께 살립니다.
- source_word: רַק שְׂפָתֶיהָ נָּעוֹת
  english_pob_choice: only her lips were moving
  chosen_korean: 입술만 움직일 뿐
  alternatives_korean:
  - 입술만 떨릴 뿐
  - 입술만 움직이고 있었을 뿐
  - 오직 입술만 움직이고
  lexicon: HALOT
  rationale: רַק의 제한성을 ‘만’으로 옮기고, 보이는 동작을 간결하게 살렸습니다.
- source_word: וְקוֹלָהּ לֹא יִשָּׁמֵעַ
  english_pob_choice: but her voice was not heard
  chosen_korean: 목소리는 들리지 않았습니다
  alternatives_korean:
  - 그녀의 목소리는 들리지 않았습니다
  - 그리고 그녀의 목소리는 들리지 않았습니다
  - 목소리조차 들리지 않았습니다
  lexicon: HALOT
  rationale: 히브리어의 수동형 의미를 자연스러운 한국어 피동으로 옮기되, 대조 관계는 문맥상 유지했습니다.
- source_word: וַיַּחְשְׁבֶהָ עֵלִי לְשִׁכֹּרָה
  english_pob_choice: So Eli thought she was drunk
  chosen_korean: 그래서 엘리는 그녀가 취한 것으로 생각했습니다
  alternatives_korean:
  - 그래서 엘리는 그녀를 술취한 사람으로 여겼습니다
  - 그래서 엘리는 그녀가 술에 취했다고 생각했습니다
  - 그래서 엘리는 그녀가 술에 취한 여인이라고 생각했습니다
  lexicon: HALOT
  rationale: חשב는 ‘간주하다/생각하다’의 의미이므로 판단 동사를 살렸고, לְשִׁכֹּרָה는 한국어에서 가장 자연스러운 ‘취한’으로 옮겼습니다.
theological_decisions:
- issue: 한나의 내적 기도/독백 표현
  chosen_reading: ‘마음속으로 말하고 있었습니다’로 옮겨, 소리 없는 기도라는 맥락을 드러내면서도 본문이 직접 말하는 ‘마음’ 이미지를 유지했습니다.
  alternative_readings:
  - ‘속으로 기도하고 있었습니다’
  - ‘마음에 대고 말하고 있었습니다’
  rationale: 본문은 기도라는 말을 명시하지 않지만 문맥상 기도 행위로 이해될 수 있어, 해석을 과도하게 앞세우지 않는 번역을 택했습니다.
  doctrine_reference: 본문 문맥과 서술 관찰
