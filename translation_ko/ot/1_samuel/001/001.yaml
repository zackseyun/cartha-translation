reference: 1 Samuel 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִי֩ אִ֨ישׁ אֶחָ֜ד מִן הָ/רָמָתַ֛יִם צוֹפִ֖ים מֵ/הַ֣ר אֶפְרָ֑יִם וּ/שְׁמ֡/וֹ אֶ֠לְקָנָה בֶּן יְרֹחָ֧ם בֶּן אֱלִיה֛וּא בֶּן תֹּ֥חוּ בֶן צ֖וּף אֶפְרָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/001.yaml
  text: Now there was a certain man from Ramathaim-zophim[a], from the hill country of Ephraim, and his name was Elkanah son of Jeroham, son of Elihu, son of Tohu, son of Zuph, an Ephraimite.
  footnotes:
  - marker: a
    text: Or, possibly, “an Ephraimite.” The Hebrew reads “Ephrathite,” which may function here as a regional designation connected with Ephraim.
    reason: alternative_reading
translation:
  language: ko
  text: 이제 라마다임-초핌[a] 출신의 한 사람이 있었는데, 에브라임 산지에서 살았으며, 그의 이름은 여로함의 아들이요 엘리후의 아들이요 도후의 아들이요 수프의 아들인 엘가나였고, 그는 에브라임 사람이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에브랏 사람’. 히브리어는 ‘에브랏 사람’을 읽지만, 이 문맥에서는 에브라임과 연결된 지역 표지로 기능할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי אִישׁ אֶחָד
  english_pob_choice: Now there was a certain man
  chosen_korean: 이제 ... 한 사람이 있었습니다
  alternatives_korean:
  - 한 사람이 있었습니다
  - 그리고 한 사람이 있었습니다
  lexicon: HALOT
  rationale: 서사 도입의 와우-연속형을 한국어 자연문장으로 풀되, 특정 인물을 새로 소개하는 기능을 살려 ‘한 사람이 있었습니다’로 옮겼습니다.
- source_word: מִן הָרָמָתַיִם צוֹפִים
  english_pob_choice: from Ramathaim-zophim
  chosen_korean: 라마다임-초핌
  alternatives_korean:
  - 라마다임-조핌
  - 라마다임-초핌 지역
  lexicon: HALOT
  rationale: 지명은 음역을 유지해 원문 형태를 드러냈고, 내부 구성요소를 과해석하지 않기 위해 본문에서는 복합 지명처럼 처리했습니다.
- source_word: מֵהַר אֶפְרָיִם
  english_pob_choice: from the hill country of Ephraim
  chosen_korean: 에브라임 산지에서 살았으며
  alternatives_korean:
  - 에브라임의 산지에서
  - 에브라임의 산악지대에서
  lexicon: HALOT
  rationale: territorial expression으로서의 הַר는 단일 산보다 ‘산지’가 자연스럽고 지리적 의미도 더 정확합니다.
- source_word: אֶלְקָנָה ... בֶּן ...
  english_pob_choice: Elkanah son of ... son of ...
  chosen_korean: 여로함의 아들이요 엘리후의 아들이요 도후의 아들이요 수프의 아들인 엘가나
  alternatives_korean:
  - 엘가나 곧 여로함의 아들이요 ...
  - 여로함의 아들 엘리후의 아들 도후의 아들 수프의 아들 엘가나
  lexicon: HALOT
  rationale: 연속된 בן 구조를 한국어의 관형절·연결 조사로 풀어 계보 관계를 분명히 했습니다. 인명은 현대 음역에 따라 옮겼습니다.
- source_word: אֶפְרָתִי
  english_pob_choice: an Ephraimite
  chosen_korean: 에브라임 사람
  alternatives_korean:
  - 에브랏 사람
  - 에브라임 족속
  lexicon: HALOT
  rationale: 문맥상 앞의 ‘에브라임 산지’와 연결되는 지역적 표지로 이해되어, 본문에서는 의미값을 살려 ‘에브라임 사람’으로 옮겼습니다.
theological_decisions:
- issue: אֶפְרָתִי의 지명/소속 해석
  chosen_reading: 본문에서는 ‘에브라임 사람’으로 읽어, 지리적 문맥과 인물의 출신 표지를 함께 드러냈습니다.
  alternative_readings:
  - ‘에브랏 사람’
  - ‘에브라임 사람’과 달리 형태를 보존한 음역
  rationale: 이 구절은 교리 쟁점이 아니라 지명-소속 표지의 해석 문제입니다. 한국어 독자가 바로 이해할 수 있도록 문맥상 기능을 우선했지만, 원형의 모호성은 축소하지 않았습니다.
  doctrine_reference: Translation philosophy §3, §5
