  source_fidelity: 수정이 필요합니다. וַיְהִי에 근거하지 않은 ‘이제’는 삭제해야 하며, מֵהַר אֶפְרָיִם은 그가 그곳에 ‘살았다’는 진술이 아니라 라마다임-소빔의 지리적 위치를 나타냅니다. 또한 אֶפְרָתִי의 형태상 읽기인 ‘에브랏 사람’을 본문에서 ‘에브라임 사람’으로 단정하면 원문의 논쟁적 모호성이 사라집니다. 계보도 현 초안의 병렬 표현은 각 인물 사이의 부자 관계를 불명확하게 합니다.
  naturalness: 현대 표준 한국어 합쇼체에서는 ‘에브라임 산지의 라마다임-소빔 출신’이 자연스럽고 정확합니다. 계보는 문장을 나누어 각 관계를 명시하면 읽기 쉽고 오해가 없습니다.
  terminology: 인명·지명은 한국어 성경 사용례 및 히브리어 음가에 맞추어 엘가나, 여로함, 엘리후, 도후, 숩, 라마다임-소빔으로 정리했습니다. אֶפְרָתִי는 본문에서 ‘에브랏 사람’으로 보존하고, 문맥상 가능한 ‘에브라임 사람’은 각주로 처리했습니다.
  issues:
  - severity: medium
    issue: ‘이제’가 וַיְהִי의 번역으로 첨가됨
    rationale: 와우 연속형의 서사 도입 기능은 ‘한 사람이 있었습니다’로 충분히 나타납니다. 한국어 ‘이제’는 원문에 없는 시간·전환 표지를 더합니다.
  - severity: high
    issue: ‘에브라임 산지에서 살았으며’가 지리 관계를 거주 진술로 바꿈
    rationale: מֵהַר אֶפְרָיִם은 라마다임-소빔이 에브라임 산지에 속함을 나타내며, 별도의 거주 행위를 말하지 않습니다.
  - severity: high
    issue: אֶפְרָתִי를 본문에서 ‘에브라임 사람’으로 확정함
