  source_fidelity: 브닌나의 자녀를 ‘그들의 모든 아들들과 딸들’이라고 한 것은 히브리어의 여성 단수 소유 접미사(‘그녀의’)를 공동 소유로 바꿉니다. 또한 מָנוֹת는 복수형인데 현 각주는 이를 단수형이라고 설명하여 원문 형태와 맞지 않습니다. 문맥은 반복적 제사 식사 관행을 시사하므로 한국어의 습관적 표현은 가능하되, 단순 과거 가능성은 각주로 보존하는 것이 적절합니다.
  naturalness: ‘제사를 드리는 날이 되면’과 ‘몫을 나누어 주곤 했습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 제사 뒤 분배라는 문맥적 연결도 분명합니다. ‘브닌나와 브닌나의 모든 아들들과 딸들’은 이름 반복이 있으나 소유 관계를 오해 없이 전달하기 위해 필요합니다.
  terminology: ‘엘가나’, ‘브닌나’, ‘제사를 드리다’, ‘몫’은 적절합니다. ‘몫을 나누어 주다’는 מָנוֹת의 복수·분배적 뜻을 자연스럽게 나타냅니다.
