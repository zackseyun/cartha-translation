  lexicon: HALOT
  rationale: 히브리어의 시간 설정 관용구를 자연스러운 한국어로 옮기되, 반복되는 제사 장면의 시작을 간결하게 살렸습니다.
- source_word: וַ/יִּזְבַּ֖ח
  english_pob_choice: sacrificed
  chosen_korean: 제사를 드리고
  alternatives_korean:
