  - 아내 브닌나에게
  lexicon: HALOT
  rationale: 히브리어 어순을 너무 어색하게 끌지 않으면서, 인물 표기를 현대 한국어 독자에게 자연스럽게 정리했습니다.
theological_decisions:
- issue: 반복적 제사 식사의 관습적 행위 표현
  chosen_reading: ‘제사를 드리고 … 몫을 주었습니다’로, 이 사건이 단회적 사건이 아니라 반복되는 제의적 관행임을 드러내는 방향을 택했습니다.
  alternative_readings:
  - ‘제사를 드렸고 몫을 주었습니다’
  - ‘제사할 때 몫을 나누어 주었습니다’
  rationale: 문맥상 엘가나의 관행을 나타내는 서술이므로, 한국어에서도 제사와 분배 행위를 연결해 자연스럽게 읽히도록 했습니다.
  doctrine_reference: 서사 문맥과 제의 관행의 반복성
- issue: 브닌나 이름 음역
  chosen_reading: ‘브닌나’로 음역했습니다.
  alternative_readings:
  - ‘페니나’
  - ‘피닌나’
  rationale: 현대 한국어 표기에서 히브리어 בְּנִנָּה의 발음을 반영한 음역을 택해, 인물명을 일관되게 전달했습니다.
  doctrine_reference: 고유명사 표기 일관성
