    text: 또는 ‘몫을 나누어 주었습니다’로 옮길 수 있습니다. 히브리어 동사는 단순 과거로도 옮길 수 있으나, 문맥상 반복되는 제사 식사 때의 관행을 가리킬 수 있습니다.
    reason: lexical_alternative
