  lexicon: HALOT
  rationale: 동사 זבח의 제의적 의미를 살려 단순한 ‘잡다’가 아니라 제사 행위로 분명히 표현했습니다.
- source_word: מָנֽוֹת־
  english_pob_choice: portions
  chosen_korean: 몫을
  alternatives_korean:
  - 분깃을
  - 배분된 몫을
  - 몫들
  lexicon: HALOT
  rationale: 잔치/제사 자리에서 나누어 주는 할당분을 가리키므로, 한국어에서는 짧고 자연스러운 ‘몫’이 본문 의미를 가장 잘 전달합니다.
- source_word: לִ/פְנִנָּ֣ה אִשְׁתּ֗/וֹ
  english_pob_choice: to Peninnah his wife
  chosen_korean: 그의 아내 브닌나에게
  alternatives_korean:
