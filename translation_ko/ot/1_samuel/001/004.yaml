  text: And when the day came[a], Elkanah sacrificed and gave portions to Peninnah his wife and to all her sons and daughters.
  footnotes:
  - marker: a
    text: Or 'and he gave portions'; the Hebrew form can be read as simple past, but the context favors a customary action at the recurring sacrificial meal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날이 이르자 엘가나가 제사를 드리고, 그의 아내 브닌나와 그들의 모든 아들들과 딸들에게 몫을 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몫들을 주었습니다’로도 옮길 수 있습니다. 히브리어는 단수형이지만, 공동체적 제사 식사에서 나누는 분배의 총칭으로 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִ֣י הַ/יּ֔וֹם
  english_pob_choice: when the day came
  chosen_korean: 그 날이 이르자
  alternatives_korean:
