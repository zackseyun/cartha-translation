  rationale: 히브리어 המקרא 본문이 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
