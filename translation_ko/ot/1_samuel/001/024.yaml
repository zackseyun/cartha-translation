base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/024.yaml
  text: When she had weaned him[a], she took him up with her, with three bulls, one ephah of flour, and a skin of wine, and brought him to the house of Yahweh at Shiloh. Now the boy was young.
  footnotes:
  - marker: a
    text: 'Hebrew: ''three bulls''; some ancient witnesses and interpreters read ''a three-year-old bull.'''
    reason: textual_variant
translation:
  language: ko
  text: 그녀가 그에게 젖을 뗀 뒤, 그를 데리고 세 마리의 수소와 가루 한 에바와 포도주 한 가죽 부대를 가지고 올라가, 그를 실로에 있는 야훼의 집으로 데려갔습니다. 그 아이는 아직 어렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 문자적으로 ‘세 마리의 수소’이지만, 일부 고대 사본들과 해석 전통은 ‘세 살 된 수소’로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַתַּעֲלֵהוּ
  english_pob_choice: she took him up
  chosen_korean: 그를 데리고 올라가서
  alternatives_korean:
  - 그를 데리고 갔습니다
  - 그를 올려갔습니다
  lexicon: HALOT
  rationale: עלה의 방향성(위로 올라감)을 살리면서도, 성소로 향하는 문맥에 맞게 자연스러운 한국어로 옮겼습니다.
- source_word: בְּפָרִים שְׁלֹשָׁה
  english_pob_choice: three bulls
  chosen_korean: 세 마리의 수소
  alternatives_korean:
  - 세 수소
  - 한 마리의 세 살 된 수소
  lexicon: HALOT
  rationale: 마소/소를 가리키는 פָּרִים을 한국어에서는 ‘수소’로 옮겨 구체성을 살렸고, 히브리어 본문의 ‘세 마리’를 그대로 반영했습니다.
- source_word: וְאֵיפָה אַחַת קֶמַח
  english_pob_choice: one ephah of flour
  chosen_korean: 가루 한 에바
  alternatives_korean:
  - 밀가루 한 에바
  - 가루 한 되
  lexicon: HALOT
  rationale: אֵיפָה는 고대 부피 단위이므로 ‘에바’를 보존했고, קֶמַח은 곡물가루 전반을 가리켜 ‘가루’로 옮겼습니다.
- source_word: וְנֵבֶל יַיִן
  english_pob_choice: and a skin of wine
  chosen_korean: 포도주 한 가죽부대
  alternatives_korean:
  - 포도주 한 가죽주머니
  - 포도주 한 부대
  lexicon: HALOT
  rationale: נֵבֶל의 용기 의미를 살려, 현대 독자가 이해할 수 있는 ‘가죽부대’로 옮겼습니다.
- source_word: בֵית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: 이곳은 יְהוָה의 고유명을 보존해야 하므로 ‘야훼’로 옮기고, 본문의 성소 표현을 직역했습니다.
- source_word: שִׁלֹה
  english_pob_choice: at Shiloh
  chosen_korean: 실로
  alternatives_korean:
  - 실로에
  - 실로에서
  lexicon: HALOT
  rationale: 지명은 현대 외래어 표기 관행에 따라 음역했습니다.
- source_word: וְהַנַּעַר נָעַר
  english_pob_choice: Now the boy was young
  chosen_korean: 그는 어린아이였으므로
  alternatives_korean:
  - 그 소년은 어렸습니다
  - 그 아이는 아직 어렸습니다
  lexicon: HALOT
  rationale: 히브리어의 반복을 한국어로 직역하면 어색하므로, 반복이 강조하는 ‘아직 매우 어림’을 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 고유명 처리
  chosen_reading: 야훼
  alternative_readings:
