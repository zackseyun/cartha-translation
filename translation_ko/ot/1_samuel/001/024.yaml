  source_fidelity: 주절 끝의 וְהַנַּעַר נָעַר는 앞선 사건의 이유가 아니라 독립된 서술입니다. 초안의 ‘그는 어린아이였으므로’는 이를 인과절로 만들어 본문의 관계를 바꿉니다. 또한 וַתַּעֲלֵהוּ와 וַתְּבִאֵהוּ의 두 동작은 각각 ‘데리고 올라가’와 ‘데려갔습니다’로 구별하는 것이 적절합니다.
  naturalness: 초안은 ‘그녀가’와 ‘그를’의 반복 및 여러 쉼표 연결 때문에 다소 부자연스럽습니다. 문장을 두 문장으로 나누고 마지막 진술을 독립시켜 현대 한국어 합쇼체로 매끄럽게 다듬었습니다.
  terminology: ‘야훼’, ‘실로’, ‘에바’, ‘수소’, ‘가죽 부대’는 적절합니다. קֶמַח의 일반성을 보존하여 ‘가루’를 유지했습니다. 각주에서는 ‘고대 증거’보다 통상적인 본문비평 표현인 ‘고대 사본들’을 사용했습니다.
