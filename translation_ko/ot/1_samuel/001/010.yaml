  rationale: 본문은 하나님의 고유명사 יְהוָה를 사용하므로, 지시 대상의 이름을 보존하는 프로젝트 기본 원칙에 따라 야훼로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
