base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/010.yaml
  text: And she was bitter in soul[b][a], and she prayed to Yahweh and wept bitterly.
  footnotes:
  - marker: a
    text: Hebrew 'bitter in soul,' an idiom for deep inner anguish.
    reason: lexical_alternative
  - marker: b
    text: Or 'wept bitterly' / 'kept on weeping'; Hebrew uses an intensified verbal form, literally 'weeping she wept.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 마음이 몹시 괴로웠고, 야훼께 기도하며 심히 울고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 깊은 내적 고통을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 강조형 구성으로, 문자적으로는 ‘울며 울다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָרַת נָפֶשׁ
  english_pob_choice: bitter in soul
  chosen_korean: 마음이 몹시 괴로웠고
  alternatives_korean:
  - 영혼이 쓰라렸고
  - 속이 깊이 상했고
  - 마음에 쓴맛이 났고
  lexicon: HALOT
  rationale: 히브리어 관용구의 내적 고통을 한국어로 자연스럽게 풀면서도, 단순한 감정 과장이 아니라 깊은 영적·정서적 괴로움임을 살렸습니다.
- source_word: וַתִּתְפַּלֵּל עַל יְהוָה
  english_pob_choice: she prayed to Yahweh
  chosen_korean: 야훼께 기도하며
  alternatives_korean:
  - 야훼 앞에서 기도하며
  - 주께 기도하며
  lexicon: HALOT
  rationale: התפלל의 대상 지시를 한국어에서는 가장 직접적인 여격 표현으로 옮겼고, יְהוָה는 본 프로젝트 기본값에 따라 야훼로 옮겼습니다.
- source_word: וּבָכֹה תִבְכֶּה
  english_pob_choice: wept bitterly
  chosen_korean: 심히 울고 있었습니다
  alternatives_korean:
  - 몹시 울었습니다
  - 계속 울고 있었습니다
  - 눈물을 펑펑 흘리고 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 강조형(‘울며 울다’)을 한국어 진행·강조 표현으로 옮겨 반복의 힘을 살리되, 원문의 정서적 강도를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 야훼
  alternative_readings:
