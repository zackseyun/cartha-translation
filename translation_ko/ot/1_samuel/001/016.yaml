source:
  edition: WLC
  text: אַל תִּתֵּן֙ אֶת אֲמָ֣תְ/ךָ֔ לִ/פְנֵ֖י בַּת בְּלִיָּ֑עַל כִּֽי מֵ/רֹ֥ב שִׂיחִ֛/י וְ/כַעְסִ֖/י דִּבַּ֥רְתִּי עַד הֵֽנָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/016.yaml
  text: Do not regard your servant as a worthless woman[b][a], for out of the abundance of my complaint and my vexation I have spoken until now.
  footnotes:
  - marker: a
    text: Hebrew literally, 'a daughter of worthlessness,' an idiom for a morally contemptible or disreputable woman.
    reason: lexical_alternative
  - marker: b
    text: Or 'out of my great complaint and vexation.'
    reason: lexical_alternative
translation:
  language: ko
  text: “당신의 여종을 행실이 나쁜 여자로[a] 여기지 마십시오. 제가 지금까지 말한 것은 제 많은 하소연과 번민 때문입니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘무가치함의 딸’이라는 뜻의 관용구로, 행실이 나쁘거나 평판이 좋지 않아 경멸받는 여자를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 큰 하소연과 번민 때문에’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן ... לִפְנֵי
  english_pob_choice: Do not regard
  chosen_korean: “... 여기지 마십시오”
  alternatives_korean:
  - '... 보지 마십시오'
  - '... 여기지 말아 주십시오'
  - '... 생각하지 마십시오'
  lexicon: HALOT
  rationale: נתן + לפני의 관용구는 단순한 ‘주다’가 아니라 ‘어떤 것으로 여기다/간주하다’의 뜻이므로, 한국어에서는 자연스럽게 ‘여기다’로 옮기는 것이 가장 가깝습니다.
- source_word: אֲמָתְךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 여종
  alternatives_korean:
  - 당신의 종
  - 당신의 여종이
  - 당신의 여종인 저
  lexicon: HALOT
  rationale: 여성형 자기지칭을 살리기 위해 ‘여종’을 택했습니다. ‘종’보다 성별 표지가 분명하고, 한나의 겸손한 호칭도 드러납니다.
- source_word: בַּת בְּלִיָּעַל
  english_pob_choice: a worthless woman
  chosen_korean: 무가치한 여자
  alternatives_korean:
  - 비천한 여자
  - 불량한 여자
  - 버림받은 여자
  lexicon: HALOT
  rationale: 직역하면 ‘무가치함의 딸’이지만, 한국어에서는 그 관용적 뉘앙스를 살리되 지나치게 도덕판정으로 좁히지 않도록 ‘무가치한 여자’로 옮겼습니다.
- source_word: מֵרֹב שִׂיחִי וְכַעְסִי
  english_pob_choice: out of the abundance of my complaint and my vexation
  chosen_korean: 제 큰 원통함과 번민 때문입니다
  alternatives_korean:
  - 제 많은 하소연과 번민 때문입니다
  - 제 큰 호소와 괴로움 때문입니다
  - 제 깊은 탄식과 분노 때문입니다
  lexicon: HALOT
  rationale: שִׂיחִי와 כַעְסִי는 여기서 내면의 격한 고통을 설명하므로, ‘원통함’과 ‘번민’이 감정의 압박과 호소의 성격을 함께 살립니다. POB의 ‘vexation’도 이 방향과 부합합니다.
theological_decisions:
- issue: 한나의 직접 화법에서 예의를 어떻게 유지할지
  chosen_reading: 직접 화법 안에서도 상소·변명적 상황에 맞게 공손한 명령형 ‘여기지 마십시오’를 사용했습니다.
  alternative_readings:
  - ‘여기지 말아 주십시오’로 완곡하게 처리
  - ‘생각하지 마십시오’로 더 중립적으로 처리
  rationale: 엘리에게 자신을 오해하지 말라고 호소하는 장면이므로, 현대 한국어의 공손한 금지형이 원문의 간절함과 관계적 거리감을 가장 잘 전달합니다.
  doctrine_reference: 서사 화법의 화행 보존
- issue: בַּת בְּלִיָּעַל의 도덕적 뉘앙스
  chosen_reading: ‘무가치한 여자’로 옮겨 도덕적·사회적 경멸을 드러내되, 특정 죄목을 새로 덧붙이지는 않았습니다.
  alternative_readings:
  - ‘사악한 여자’로 강화
  - ‘불량한 여자’로 사회적 낙인을 강조
  rationale: 히브리어 관용구는 경멸적 평가를 담지만, 본문에서 한나가 스스로를 그런 부류로 인정하는 것은 아니므로 과도한 도덕화는 피해야 합니다.
  doctrine_reference: 원문 관용어의 범위 존중
