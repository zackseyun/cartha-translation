  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּ֣קָם חַנָּ֔ה אַחֲרֵ֛י אָכְלָ֥ה בְ/שִׁלֹ֖ה וְ/אַחֲרֵ֣י שָׁתֹ֑ה וְ/עֵלִ֣י הַ/כֹּהֵ֗ן יֹשֵׁב֙ עַל הַ/כִּסֵּ֔א עַל מְזוּזַ֖ת הֵיכַ֥ל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/009.yaml
  text: After they had eaten in Shiloh[a], and after they had drunk, Hannah rose. Now Eli the priest was sitting on the seat by the doorpost of the temple of Yahweh.
  footnotes:
  - marker: a
    text: Or "the sanctuary of the LORD."
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 실로에서 먹고 마신 뒤에 한나가 일어났습니다. 그리고 제사장 엘리는 야훼의 성전 문설주 곁의 자리 위에 앉아 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼의 성소.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי אָכְלָה / וְאַחֲרֵי שָׁתֹה
  english_pob_choice: After they had eaten ... and after they had drunk
  chosen_korean: 실로에서 먹고 마신 뒤에
  alternatives_korean:
  - 먹은 뒤에
  - 먹고 마신 후에
  lexicon: HALOT
  rationale: 연속된 시간 부사구를 한국어의 자연스러운 ‘-고 … 뒤에’ 구조로 묶어, 식사 장면의 흐름을 과도하게 해석하지 않고 간결하게 살렸습니다.
- source_word: וַתָּקָם חַנָּה
  english_pob_choice: Hannah rose
  chosen_korean: 한나가 일어났습니다
  alternatives_korean:
  - 한나가 일어섰습니다
  - 한나가 일어났습니다
  lexicon: HALOT
  rationale: קום의 서술적 전개를 현대 한국어의 ‘일어나다’로 옮겨, 행동 전환의 뉘앙스를 자연스럽게 표현했습니다.
- source_word: עַל הַכִּסֵּא
  english_pob_choice: on the seat
  chosen_korean: 자리 위에
  alternatives_korean:
  - 의자 위에
  - 좌석에
  lexicon: HALOT
  rationale: כִּסֵּא가 여기서는 왕좌가 아니라 제사장이 앉아 있던 일반적인 자리이므로, ‘좌석’보다 덜 현대적이고 ‘의자’보다 덜 구체적인 ‘자리’로 옮겼습니다.
- source_word: הֵיכַל יְהוָה
  english_pob_choice: the temple of Yahweh
  chosen_korean: 야훼의 성전
  alternatives_korean:
  - 야훼의 성소
  - 야훼의 신전
  lexicon: HALOT
  rationale: הֵיכָל은 성전/성소 범주이지만, 이 구절에서는 실로의 성막적 공간을 가리키므로 본문 의미를 드러내는 표준적 한국어 ‘성전’을 택했습니다.
- source_word: מְזוּזַת
  english_pob_choice: by the doorpost
  chosen_korean: 문설주 곁의
  alternatives_korean:
  - 문설주 옆의
  - 문기둥 곁의
  lexicon: HALOT
  rationale: מְזוּזָה는 문설주를 뜻하므로, 장소 관계를 한국어 관용에 맞게 ‘곁의’로 풀어 문 앞 위치를 분명히 했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 고유한 신명은 대체 칭호가 아니라 음역 ‘야훼’로 보존해 본문이 가진 인명성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה/YHWH → 야훼'
- issue: הֵיכַל의 한국어 범주
  chosen_reading: 성전
  alternative_readings:
  - 성소
  - 궁전
  rationale: 실로의 배경상 완전히 솔로몬 성전 개념으로 좁히지 않되, 제의적 거처를 가리키는 기본 의미를 드러내기 위해 ‘성전’을 사용했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
