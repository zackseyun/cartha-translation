revisions:
- from: 그가 서원하고 말했습니다. 「야훼 만군의 하나님이여, 주께서 참으로 이 종의 고난을 살피시고, 저를 기억하시며, 이 종을 잊지 않으시고, 이 종에게 남자 아이를 주신다면, 저는 그의 평생을 야훼께 드리겠습니다. 그리고 그의 머리에는 삭도가 올라오지 않을 것입니다.」[a][b]
  to: 그녀가 서원하며 말했습니다. “만군의 야훼여, 주께서 참으로 주의 여종의 고난을 살피시고 저를 기억하시며 주의 여종을 잊지 않으시고 주의 여종에게 남자 아이를 주신다면[a], 저는 그를 그의 평생 동안 야훼께 드리겠습니다. 그의 머리에는 면도칼을 대지 않겠습니다.”[b]
  rationale: 여성 화자, 여성형 자기 호칭, ‘그를 드린다’는 목적어, 그리고 평생이라는 기간을 원문에 맞게 회복했습니다. 신적 호칭은 ‘만군의 야훼’로 직역적 결속을 살렸고, 면도칼 표현은 의미를 보존하면서 현대 합쇼체 한국어로 자연화했습니다. 각주 표지는 각각 ‘남자 아이’와 면도칼 제한 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:21:18Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘그가’는 여성 화자인 한나를 가리키므로 ‘그녀가’로 고쳐야 합니다. 또한 וּנְתַתִּיו(‘내가 그를 드리겠습니다’)를 ‘저는 그의 평생을 … 드리겠습니다’로 옮긴 것은 목적어를 바꾸므로, ‘그를 야훼께 드리겠습니다’로 바로잡아야 합니다. ‘그의 평생 동안’은 그 헌신의 기간을 수식하도록 배치했습니다.
  naturalness: ‘야훼 만군의 하나님이여’보다 히브리어 호칭의 결속을 자연스럽게 반영하는 ‘만군의 야훼여’가 낫습니다. ‘삭도가 올라오지 않을 것입니다’는 현대 표준 한국어에서 부자연스럽고 삭도도 드문 말이므로, 서원 화자의 능동적 약속으로 ‘그의 머리에는 면도칼을 대지 않겠습니다’라고 옮겼습니다.
  terminology: אֲמָתֶךָ는 여성형이므로 반복되는 자기 호칭을 ‘주의 여종’으로 유지했습니다. 야훼와 만군은 그대로 보존했으며, 본문이 나실인이라는 명칭을 사용하지 않으므로 본문에는 그 명칭을 넣지 않고 각주에서만 관련 언어를 설명했습니다.
  issues:
  - severity: high
    issue: 첫 문장의 주어가 ‘그가’로 되어 있습니다.
    rationale: 문맥 및 여성형 동사 형태상 서원한 이는 한나이므로 ‘그녀가’여야 합니다.
  - severity: high
    issue: ‘저는 그의 평생을 야훼께 드리겠습니다’가 וּנְתַתִּיו의 목적어를 잘못 옮깁니다.
    rationale: 히브리어 접미사 -יו는 남자 아이인 ‘그를’ 가리킵니다. 평생은 ‘드림’의 대상이 아니라 기간입니다.
  - severity: medium
    issue: ‘이 종’은 여성형 אֲמָתֶךָ의 성별 정보를 지웁니다.
    rationale: 본문이 명시하는 여성 종이라는 자기 호칭을 ‘주의 여종’으로 보존하는 편이 충실합니다.
  - severity: medium
    issue: ‘야훼 만군의 하나님이여’는 신명과 ‘만군’의 관계를 불명료하게 하고 ‘하나님’을 덧붙입니다.
    rationale: יְהוָה צְבָאוֹת은 ‘만군의 야훼’로 옮기면 원문의 호칭 구조를 직접 보존합니다.
  - severity: low
    issue: ‘삭도가 올라오지 않을 것입니다’는 현대 한국어에서 어색합니다.
    rationale: 면도칼을 머리에 대지 않는다는 구체적 제한을 자연스럽게 표현하면서 서원의 의미를 유지할 수 있습니다.
