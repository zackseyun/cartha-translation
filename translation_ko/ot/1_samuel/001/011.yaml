  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּדֹּ֨ר נֶ֜דֶר וַ/תֹּאמַ֗ר יְהוָ֨ה צְבָא֜וֹת אִם רָאֹ֥ה תִרְאֶ֣ה בָּ/עֳנִ֣י אֲמָתֶ֗/ךָ וּ/זְכַרְתַּ֨/נִי֙ וְ/לֹֽא תִשְׁכַּ֣ח אֶת אֲמָתֶ֔/ךָ וְ/נָתַתָּ֥ה לַ/אֲמָתְ/ךָ֖ זֶ֣רַע אֲנָשִׁ֑ים וּ/נְתַתִּ֤י/ו לַֽ/יהוָה֙ כָּל יְמֵ֣י חַיָּ֔י/ו וּ/מוֹרָ֖ה לֹא יַעֲלֶ֥ה עַל רֹאשֽׁ/וֹ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/011.yaml
  text: She made a vow and said[a], “O Yahweh of hosts, if you will indeed look on the affliction of your female servant, and remember me, and not forget your female servant, but give your female servant a male child, then I will give him to Yahweh all the days of his life[b], and no razor shall come upon his head.”
  footnotes:
  - marker: a
    text: Hebrew 'seed/offspring of men,' an idiom here meaning a male child.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'no razor shall come upon his head' echoes the language of special consecration associated with a Nazirite vow; the text here states the hair restriction explicitly without using the Nazirite label.
    reason: cultural_note
translation:
  language: ko
  text: 그가 서원하고 말했습니다. 「야훼 만군의 하나님이여, 주께서 참으로 이 종의 고난을 살피시고, 저를 기억하시며, 이 종을 잊지 않으시고, 이 종에게 남자 아이를 주신다면, 저는 그의 평생을 야훼께 드리겠습니다. 그리고 그의 머리에는 삭도가 올라오지 않을 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘남자들의 씨/자손’이라는 표현이지만, 여기서는 문맥상 남자 아이를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 머리에는 삭도가 올라오지 않을 것입니다’는 나실인 서원을 직접 부르지 않지만, 특별한 구별의 서원 언어를 분명하게 드러냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: O Yahweh of hosts
  chosen_korean: 야훼 만군의 하나님이여
  alternatives_korean:
  - 만군의 야훼여
  - 야훼 만군의 주여
  lexicon: HALOT
  rationale: YHWH는 POB 기준을 따라 야훼로 옮기고, צְבָאוֹת은 군사적·우주적 호칭을 살려 만군으로 옮겼습니다. 기도문 호칭이므로 한국어 호격을 붙였습니다.
- source_word: בָּעֳנִי
  english_pob_choice: the affliction
  chosen_korean: 고난
  alternatives_korean:
  - 환난
  - 비참함
  - 고통
  lexicon: HALOT
  rationale: עֳנִי는 단순한 감정이 아니라 처지의 괴로움과 수치를 포함할 수 있어, 한 가지 의미로 좁히지 않는 고난이 문맥상 가장 안정적입니다.
- source_word: אֲמָתֶךָ / לַאֲמָתְךָ
  english_pob_choice: your female servant
  chosen_korean: 이 종
  alternatives_korean:
  - 당신의 여종
  - 당신의 여종인 저
  - 이 여종
  lexicon: HALOT
  rationale: 직역형인 여종도 가능하지만, 반복되는 겸손한 자기호칭을 한국어 기도문으로 자연스럽게 살리면서도 종이라는 종속 신분을 유지하기 위해 이 종을 택했습니다.
- source_word: זֶרַע אֲנָשִׁים
  english_pob_choice: a male child
  chosen_korean: 남자 아이
  alternatives_korean:
  - 남자 자손
  - 남자 자녀
  - 아들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘남자들의 씨/자손’이지만 문맥상 남자 아이를 뜻하므로, POB의 해석을 반영하되 한국어에서는 과도하게 경직된 ‘자손’보다 자연스러운 표현을 선택했습니다.
- source_word: וּנְתַתִּיו לַיהוָה
  english_pob_choice: then I will give him to Yahweh
  chosen_korean: 저는 그의 평생을 야훼께 드리겠습니다
  alternatives_korean:
  - 그를 야훼께 드리겠습니다
  - 그를 야훼께 바치겠습니다
  lexicon: HALOT
  rationale: 동사는 ‘주다’이지만 문맥상 평생을 야훼께 맡기는 서원의 의미가 있으므로, ‘드리겠습니다’로 공손하고 헌신적인 뉘앙스를 살렸습니다.
- source_word: וּמוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  english_pob_choice: and no razor shall come upon his head
  chosen_korean: 그리고 그의 머리에는 삭도가 올라오지 않을 것입니다
  alternatives_korean:
  - 그리고 그의 머리에는 면도칼이 닿지 않을 것입니다
  - 그리고 그의 머리는 깎이지 않을 것입니다
  lexicon: HALOT
  rationale: מוֹרָה는 문맥상 삭도/면도칼로 이해되며, ‘올라오다’라는 히브리어 이미지를 보존하기 위해 직역을 유지했습니다.
theological_decisions:
- issue: 언약적 서원에서의 신적 호칭과 화자 경어
  chosen_reading: 하나님께 직접 말하는 기도체이므로 야훼 만군의 하나님이여, 주께서, 드리겠습니다처럼 존대형을 일관되게 사용했습니다.
  alternative_readings:
  - 평서형으로 통일
  - 보다 전통적인 교회체 표현 사용
  rationale: 본문은 한나의 탄원 기도이므로 한국어에서도 하나님께 드리는 직접 호칭과 청원형 존대를 유지하는 것이 화행을 가장 정확하게 반영합니다.
  doctrine_reference: 'POB Korean style guide: direct address to God uses honorific endings'
