  source_fidelity: ‘그녀를 격분하게 하고’는 히브리어 히필 תַּכְעִסֶנָּה가 나타내는 반복적 괴롭힘·도발보다 강하고, 한국어에서는 상대를 실제로 격분시키는 결과를 단정하는 뉘앙스가 있습니다. 문맥상 한나와 브닌나를 명시하여 여성 대명사들의 지시 대상도 분명히 할 필요가 있습니다. 첫 절의 남성 단수 동사는 엘가나를 가리킬 가능성이 있으나, 요약적 반복 상황으로도 이해되므로 본문에서는 이를 강제하지 않고 각주로 보존했습니다.
  naturalness: ‘이와 같이 해마다 그러했습니다’는 다소 번역투이며, 두 차례의 ‘그녀’는 한국어 독해에서 혼동을 줍니다. ‘해마다 이런 일이 있었습니다’와 인명 반복은 현대 표준어 서술문에서 자연스럽고 명료합니다. ‘울고 먹지 않곤 했습니다’는 연례적 반복의 의미와 합쇼체 문체를 함께 살립니다.
  terminology: יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다. Peninnah는 한국어 성서 전통과 음역 관례에 맞추어 ‘브닌나’로 표기했습니다. ‘괴롭히다’는 이 문맥의 적대적 자극·괴롭힘을 자연스럽게 전달하며 특정 감정의 강도를 과도하게 단정하지 않습니다.
