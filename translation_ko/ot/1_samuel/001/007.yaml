base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/007.yaml
  text: 'And so it happened year after year: whenever she went up to the house of Yahweh[a], Peninnah would provoke her[b], and she would weep and not eat.'
  footnotes:
  - marker: a
    text: Or, 'he would do so year after year.' The Hebrew verb is literally singular masculine ('he would do'), often understood of Elkanah, but the clause can also function idiomatically to summarize the recurring situation.
    reason: alternative_reading
  - marker: b
    text: Or, 'in the house of the LORD.' The Hebrew preposition is literally 'in/at,' though English commonly says 'went up to the house of the LORD' with a verb of motion.
    reason: lexical_alternative
translation:
  language: ko
  text: 이와 같이 해마다 그러했습니다. 그녀가 야훼의 집으로 올라갈 때마다 페니나가 그녀를 격분하게 하고, 그녀는 울며 먹지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘여호와의 집에서’라는 뜻입니다. 히브리어 전치사는 문자적으로는 ‘안/에서’이지만, 동사 ‘올라가다’와 함께 쓰일 때는 한국어에서 도착처를 나타내는 표현이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן / כֵּן
  english_pob_choice: And so / so
  chosen_korean: 이와 같이
  alternatives_korean:
  - 그리하여
  - 그렇게
  lexicon: HALOT
  rationale: 반복되는 상황을 요약하는 연결 표현으로, 히브리어의 연결성과 요약성을 자연스럽게 살렸습니다.
- source_word: שָׁנָה בְשָׁנָה
  english_pob_choice: year after year
  chosen_korean: 해마다
  alternatives_korean:
  - 해마다 해마다
  - 한 해 한 해
  lexicon: HALOT
  rationale: 연례적·반복적 의미를 간결한 현대 한국어로 옮겼습니다.
- source_word: מִדֵּי עֲלֹתָהּ
  english_pob_choice: whenever she went up
  chosen_korean: 그녀가 … 올라갈 때마다
  alternatives_korean:
  - 그녀가 … 올라갈 때마다마다
  - 그녀가 … 올라갈 때마다
  lexicon: HALOT
  rationale: 반복적 발생을 나타내는 מִדֵּי의 의미를 ‘~할 때마다’로 살렸고, 여성 단수 접미사를 반영해 ‘그녀’로 옮겼습니다.
- source_word: בְּבֵית יְהוָה
  english_pob_choice: to the house of Yahweh
  chosen_korean: 야훼의 집으로
  alternatives_korean:
  - 야훼의 집에
  - 야훼의 집에서
  lexicon: HALOT
  rationale: 동사 ‘올라가다’와 결합한 도착 방향을 한국어 조사 ‘-으로’로 자연스럽게 표현했고, יְהוָה는 프로젝트 기본값인 ‘야훼’로 옮겼습니다.
- source_word: תַּכְעִסֶנָּה
  english_pob_choice: would provoke her
  chosen_korean: 그녀를 격분하게 하고
  alternatives_korean:
  - 그녀를 자극하고
  - 그녀를 화나게 하고
  lexicon: HALOT
  rationale: 히필의 도발·격화 의미를 살리되, 관계적 적대성을 드러내는 한국어로 옮겼습니다.
