source:
  edition: WLC
  text: וּ/לְ/חַנָּ֕ה יִתֵּ֛ן מָנָ֥ה אַחַ֖ת אַפָּ֑יִם כִּ֤י אֶת חַנָּה֙ אָהֵ֔ב וַֽ/יהוָ֖ה סָגַ֥ר רַחְמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/005.yaml
  text: But to Hannah he would give a double portion[a], because he loved Hannah, though Yahweh had closed her womb.
  footnotes:
  - marker: a
    text: Hebrew literally, 'one portion of two faces/nostrils'; the phrase is difficult and may mean 'a double portion' or 'a special portion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한나에게는 그가 두 몫을 주곤 했습니다. 그는 한나를 사랑했지만, 야훼께서 한나의 태를 닫으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘두 얼굴/콧구멍의 한 몫’이라고 하며, 뜻이 불확실합니다. 이는 ‘두 몫’ 또는 ‘특별한 몫’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/חַנָּה
  english_pob_choice: But to Hannah
  chosen_korean: 하지만 한나에게는
  alternatives_korean:
  - 그리고 한나에게는
  - 또 한나에게는
  lexicon: HALOT
  rationale: 문맥상 앞절에서 다른 사람들에게 돌아간 몫과 대비되므로, 단순한 접속사보다 역접을 드러내는 ‘하지만’이 원문의 대조를 가장 잘 살립니다.
- source_word: יִתֵּן מָנָה אַחַת אַפָּיִם
  english_pob_choice: he would give a double portion
  chosen_korean: 두 몫을 주었는데
  alternatives_korean:
  - 한 몫을 주었는데
  - 특별한 몫을 주었는데
  - 두 얼굴의 한 몫을 주었는데
  lexicon: HALOT
  rationale: ‘אַחַת אַפָּיִם’은 직역이 난해한 관용구이므로, 본문의 의도에 맞게 널리 이해되는 뜻을 드러내는 ‘두 몫’을 택했습니다. 본문이 허용하는 범위 안에서 의미를 전달하되, 직설적인 이상한 표현은 피했습니다.
- source_word: אֶת חַנָּה אָהֵב
  english_pob_choice: because he loved Hannah
  chosen_korean: 그가 한나를 사랑했기 때문입니다
  alternatives_korean:
  - 그가 한나를 사랑했으므로
  - 한나를 사랑했기 때문입니다
  lexicon: HALOT
  rationale: 이 절은 특별한 몫을 준 이유를 분명히 밝히므로, 한국어에서도 인과 관계를 자연스럽게 드러내는 표현이 적절합니다.
- source_word: וַֽ/יהוָה סָגַ֥ר רַחְמָֽ/הּ
  english_pob_choice: though Yahweh had closed her womb
  chosen_korean: 그러나 야훼께서 그녀의 태를 닫으셨습니다
  alternatives_korean:
  - 그리고 야훼께서 그녀의 태를 닫으셨습니다
  - 야훼께서 그녀의 태를 닫으셨습니다
  lexicon: HALOT
  rationale: 문맥상 한나에 대한 사랑과 그녀의 불임 상태가 함께 제시되므로, 대조를 살리는 ‘그러나’로 옮겼습니다. ‘태를 닫다’는 히브리어 표현을 비교적 직접적으로 반영합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본 규정에 따라 하나님의 이름은 본문에서 ‘야훼’로 옮겨, 히브리어 고유명과 언약적 울림을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 한나의 불임을 둘러싼 서술 관계
  chosen_reading: 그러나 야훼께서 그녀의 태를 닫으셨습니다
  alternative_readings:
  - 그리고 야훼께서 그녀의 태를 닫으셨습니다
  - 야훼께서 그녀의 태를 닫으셨습니다
  rationale: 히브리어는 사랑의 이유와 함께 야훼의 주권적 행위를 병치합니다. 한국어에서 ‘그러나’는 사랑과 불임의 긴장을 더 분명히 드러내면서도, 야훼가 그 상태의 주권적 원인이라는 의미를 유지합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source meaning without importing doctrine'
