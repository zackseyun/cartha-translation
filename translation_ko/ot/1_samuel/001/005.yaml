  source_fidelity: 원문의 미완료형 יִתֵּן은 제사 때 반복된 관행을 가리키므로, 단회 과거인 ‘주었습니다’보다 ‘주곤 했습니다’가 적절합니다. אַחַת אַפָּיִם의 난해성과 ‘두 몫’이라는 유력한 해석은 각주로 보존해야 합니다. 마지막 와우절은 한나를 사랑한 사실과 태가 닫힌 사실을 병치하며, 한국어에서는 ‘하지만’으로 그 문맥적 긴장을 자연스럽게 나타낼 수 있습니다.
  naturalness: 기존의 ‘하지만 … 그러나’는 한 절 안에서 역접이 중복되어 다소 부자연스럽습니다. ‘한나에게는’으로 앞절과의 대조를 유지하고, ‘그는 한나를 사랑했지만’으로 두 후행 절의 관계를 매끄럽게 연결하는 편이 현대 표준어 합쇼체에 자연스럽습니다.
