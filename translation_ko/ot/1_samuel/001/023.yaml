  to: 그녀의 남편 엘가나가 그녀에게 말했습니다. “당신의 눈에 좋게 보이는 대로 하십시오. 당신이 그를 젖 뗄 때까지 머무르십시오. 다만 야훼께서 그의 말씀을 세우시기를 바랍니다[a].” 그래서 그 여인은 머물러 아들에게 젖을 먹였으며, 그를 젖 뗄 때까지 그렇게 했습니다.
  rationale: 문두의 동격 구문을 자연스러운 한국어 어순으로 바로잡고, 수유 동사의 의미를 명시했습니다. ‘그의 말씀’은 야훼의 약속인지 문맥의 사안인지 특정하지 않아 원문의 모호성을 보존했으며, 이에 관한 각주 표지를 해당 어구로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
