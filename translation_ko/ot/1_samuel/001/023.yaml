base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/023.yaml
  text: And Elqanah her husband said to her[a], “Do what seems good in your eyes. Stay until you have weaned him; only may Yahweh establish his word.” So the woman stayed and nursed her son until she had weaned him.
  footnotes:
  - marker: a
    text: Or 'confirm' or 'fulfill his word.' The Hebrew may refer to the LORD's promise or to the matter just spoken of in context.
    reason: alternative_reading
translation:
  language: ko
  text: 그녀의 남편 엘가나가 그녀에게 말했습니다. “당신의 눈에 좋게 보이는 대로 하십시오. 당신이 그를 젖 뗄 때까지 머무르십시오. 다만 야훼께서 그의 말씀을 세우시기를 바랍니다[a].” 그래서 그 여인은 머물러 아들에게 젖을 먹였으며, 그를 젖 뗄 때까지 그렇게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 말씀을 확증하시기를’, ‘그의 말씀을 이루시기를’로 옮길 수 있습니다. 히브리어 ‘그의 말씀’은 야훼의 약속을 가리킬 수도 있고, 문맥상 방금 언급된 일을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישָׁהּ
  english_pob_choice: her husband
  chosen_korean: 그의 남편
  alternatives_korean:
  - 그 여인의 남편
  - 남편
  lexicon: HALOT
  rationale: 관계표지와 인칭대명사를 함께 살려, 엘가나가 한나의 혼인관계상 남편임을 자연스럽게 드러냈습니다.
- source_word: עֲשִׂי הַטּוֹב בְּעֵינַיִךְ
  english_pob_choice: Do what seems good in your eyes
  chosen_korean: 당신의 눈에 좋게 보이는 대로 하십시오
  alternatives_korean:
  - 당신의 눈에 좋은 일을 하십시오
  - 당신이 좋다고 여기는 대로 하십시오
  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘눈에 좋다’를 살리되, 현대 한국어에서 자연스럽고 공손한 명령문으로 옮겼습니다.
- source_word: גָּמְלֵךְ אֹתוֹ / גָּמְלָהּ אֹתוֹ
  english_pob_choice: until you have weaned him / until she had weaned him
  chosen_korean: 그를 젖 뗄 때까지 / 아들을 젖 뗄 때까지
  alternatives_korean:
  - 그를 젖먹이지 않게 될 때까지
  - 그를 젖을 떼기까지
  lexicon: HALOT
  rationale: 이 문맥의 גמל은 유아의 젖떼기를 가리키므로, 의미를 분명히 드러내는 ‘젖 뗄 때까지’로 번역했습니다.
- source_word: יָקֵם יְהוָה אֶת דְּבָרוֹ
  english_pob_choice: may Yahweh establish his word
  chosen_korean: 야훼께서 그의 말씀을 세우시기를 바랍니다
  alternatives_korean:
  - 야훼께서 그의 말씀을 이루시기를 바랍니다
  - 야훼께서 그의 약속을 확증하시기를 바랍니다
  lexicon: HALOT
  rationale: דבר의 의미 범위를 고려해 ‘말씀’을 택해 원문의 직접성을 유지했고, קום의 사역적 뉘앙스를 ‘세우시다’로 살렸습니다.
- source_word: הָאִשָּׁה
  english_pob_choice: the woman
  chosen_korean: 그 여인
  alternatives_korean:
  - 그 여자
  - 한나
  lexicon: HALOT
  rationale: 히브리어는 고유명사 대신 정관사 명사구를 쓰므로, 서술의 표면을 보존하는 ‘그 여인’으로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 본문의 고유명사 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 표준 원칙에 따라 신적 고유명을 제목어 ‘주님’으로 대체하지 않고, 본문의 이름 자체를 드러냈습니다.
  doctrine_reference: 'Project glossary: YHWH → 야훼'
- issue: אַךְ יָקֵם יְהוָה אֶת דְּבָרוֹ의 지시 대상
  chosen_reading: ‘그의 말씀’은 야훼의 약속일 수도, 문맥상 방금 한 말일 수도 있는 여지를 그대로 두었습니다.
  alternative_readings:
  - 야훼의 약속을
  - 그가 방금 말한 일을
  rationale: 히브리어 דְּבָרוֹ는 문맥상 약속/말/사안 모두를 가질 수 있어, 한국어에서도 한 가지로 결정하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve ambiguity where source is not explicit'
