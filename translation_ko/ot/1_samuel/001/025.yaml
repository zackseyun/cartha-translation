id: 1SA.1.25
reference: 1 Samuel 1:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּשְׁחֲט֖וּ אֶת הַ/פָּ֑ר וַ/יָּבִ֥יאוּ אֶת הַ/נַּ֖עַר אֶל עֵלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/025.yaml
  text: Then they slaughtered the bull and brought the boy to Eli[a][b].
  footnotes:
  - marker: a
    text: Or 'killed.' The Hebrew verb can be rendered more generally, but 'slaughtered' better reflects the sacrificial context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the child.' Hebrew naʿar can refer to a boy, child, or young man depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들이 수소를 잡아 죽이고, 그 아이를 엘리에게 데려갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽이고’. 히브리어 동사는 더 일반적으로도 옮길 수 있지만, 제의적 맥락에는 ‘잡아 죽이고’가 더 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘소년’. 히브리어 나아르는 문맥에 따라 아이, 소년, 젊은이를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  english_pob_choice: slaughtered
  chosen_korean: 잡아 죽이고
  alternatives_korean:
  - 도살하고
  - 죽이고
  lexicon: HALOT
  rationale: 제의적 맥락을 살리면서도 현대 한국어에서 자연스럽게 읽히도록, 일반적 ‘죽이다’보다 제물의 희생을 드러내는 표현을 택했습니다.
- source_word: הַפָּר
  english_pob_choice: the bull
  chosen_korean: 수소
  alternatives_korean:
  - 황소
  - 소
  lexicon: HALOT
  rationale: 본문의 제물로 쓰인 가축을 한국어에서 가장 자연스럽게 나타내는 말은 ‘수소’입니다. ‘황소’는 뉘앙스가 더 크고, ‘소’는 너무 포괄적입니다.
- source_word: וַיָּבִיאוּ
  english_pob_choice: brought
  chosen_korean: 데려갔습니다
  alternatives_korean:
  - 가져갔습니다
  - 데리고 갔습니다
  lexicon: HALOT
  rationale: 사람을 목적어로 한 이동 동사로서, 엘리 앞으로 데려가는 장면을 한국어에서 가장 분명하게 전달하는 표현을 선택했습니다.
- source_word: הַנַּעַר
  english_pob_choice: the boy
  chosen_korean: 그 아이
  alternatives_korean:
  - 그 소년
  - 그 어린아이
  lexicon: HALOT
  rationale: 사무엘의 어린 나이를 살리면서도 이 문맥에서 과도하게 연령을 좁히지 않도록, ‘아이’를 사용했습니다.
theological_decisions:
- issue: 제의적 희생의 뉘앙스
  chosen_reading: ‘잡아 죽이고’로 옮겨 희생 제사의 맥락을 드러내되, 본문에 없는 설명은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘죽이고’로만 옮겨 중립적으로 표현함
  - ‘희생시키고’로 해석을 보강함
  rationale: 히브리어 동사는 단순 살해보다 제의적 도살의 뉘앙스를 띠므로, 문맥상 그 의미를 보존하는 번역이 필요합니다. 다만 본문은 서술만 할 뿐 해설은 제시하지 않으므로 추가 설명은 피했습니다.
  doctrine_reference: 제의 문맥과 본문 충실성
- issue: ‘소년/아이’ 범위의 처리
  chosen_reading: ‘그 아이’로 옮겨 나아르의 연령 범위를 넓게 유지했습니다.
  alternative_readings:
  - ‘그 소년’으로 좁힘
  - ‘그 어린아이’로 더 낮춤
  rationale: נַעַר는 문맥에 따라 어린아이부터 청년까지 가리킬 수 있으나, 여기서는 사무엘의 어린 시절을 말하면서도 정확한 연령을 단정하지 않도록 범위를 유지하는 편이 안전합니다.
  doctrine_reference: 본문 의미의 보존
