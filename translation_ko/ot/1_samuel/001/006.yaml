translation:
  language: ko
  text: 그의 대적은 그녀를 몹시 자극하여 그녀를 괴롭게 하였는데, 이는 야훼께서 그녀의 태를 닫으셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘대적’은 이 문맥에서 한 가정 안의 경쟁 관계, 곧 다른 아내를 가리킬 수 있습니다.
    reason: lexical_alternative
