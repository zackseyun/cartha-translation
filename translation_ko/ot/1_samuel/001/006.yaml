  lexicon: HALOT
  rationale: 본문의 여호와/יהוה는 하나님의 고유명으로서 공용 번역 관행보다 음역을 우선하는 POB 기준에 따라 '야훼'로 옮겼습니다.
- source_word: בְּעַד רַחְמָהּ
  english_pob_choice: her womb
  chosen_korean: 그녀의 태를
  alternatives_korean:
