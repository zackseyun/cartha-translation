  terminology: ‘야훼’는 יְהוָה의 음역 원칙에 맞고, ‘태를 닫으셨다’는 히브리어 관용 표현을 직접적이며 자연스럽게 보존합니다. צָרָתָהּ는 단순한 일반적 ‘대적’보다 가정 내 경쟁 관계를 나타내는 ‘경쟁 상대’가 더 정확합니다.
