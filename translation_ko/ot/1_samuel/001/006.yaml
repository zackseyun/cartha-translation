  yaml_path: translation/ot/1_samuel/001/006.yaml
  text: And her rival would provoke her bitterly in order to irritate her[a], because Yahweh had closed her womb.
  footnotes:
  - marker: a
    text: Or 'her co-wife'; the Hebrew term refers to a woman in a rival marital relationship within the household.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀의 경쟁 상대[a]는 그녀를 괴롭히려고 몹시 자극하곤 하였습니다. 이는 야훼께서 그녀의 태를 닫으셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 한 가정 안에서 경쟁 관계에 있는 여성을 가리키며, 여기서는 다른 아내를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרָתָהּ
  english_pob_choice: her rival
  chosen_korean: 그의 대적은
  alternatives_korean:
  - 그녀의 경쟁자는
  - 그녀의 동거처 상대는
  - 그녀의 라이벌은
  lexicon: HALOT
  rationale: 이 단어는 단순한 적대자라기보다 한 가정 안에서의 경쟁 관계를 가리키므로, 본문 흐름을 살려 '대적'으로 옮겼습니다. 주석에서 부부 관계의 경쟁 상대일 수 있음을 보완합니다.
- source_word: וְכִעֲסַתָּה ... גַּם כַּעַס
