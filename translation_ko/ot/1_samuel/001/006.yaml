  lexicon: HALOT
  rationale: 희귀 동사의 핵심은 태도나 정서를 뒤흔들어 고통을 주는 데 있으므로, 목적절을 의역하되 의미를 보존하는 '괴롭게 하였는데'로 옮겼습니다.
- source_word: יְהוָה
