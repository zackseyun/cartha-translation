  source_fidelity: 수정이 필요합니다. 초안의 ‘그의 대적’은 히브리어 여성 3인칭 소유접미사(‘그녀의’)를 ‘그의’로 잘못 옮겼습니다. 또한 반복·습관적 행동을 나타내는 동사와 ‘~하려고’라는 목적 관계가 ‘자극하여 … 하였는데’에서 약화되었습니다.
