  text: 그녀가 말했습니다. 「부디, 내 주인이여, 당신의 생명이 살아 있듯이, 내 주인이여, 저는 여기 당신 곁에 서서 야훼께 기도하던 그 여자입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘당신의 생명으로’, 곧 더 문자적으로는 ‘당신의 혼이 살아 있듯이’라는 맹세 공식입니다.
