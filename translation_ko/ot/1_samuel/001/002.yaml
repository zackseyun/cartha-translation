  text: וְ/ל/וֹ֙ שְׁתֵּ֣י נָשִׁ֔ים שֵׁ֤ם אַחַת֙ חַנָּ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פְּנִנָּ֑ה וַ/יְהִ֤י לִ/פְנִנָּה֙ יְלָדִ֔ים וּ/לְ/חַנָּ֖ה אֵ֥ין יְלָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/002.yaml
  text: He had two wives. The name of one was Hannah[a], and the name of the second was Peninnah. Peninnah had children, but Hannah had no children.
  footnotes:
  - marker: a
    text: Or, more formally, 'And to him were two wives.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게는 두 아내가 있었습니다. 한 아내의 이름은 한나였고, 둘째 아내의 이름은 브닌나였습니다. 브닌나에게는 자녀가 있었으나, 한나에게는 자녀가 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보다 형식적으로는 ‘그에게는 두 아내가 있었다’라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/ל/וֹ
  english_pob_choice: He had
  chosen_korean: 그에게는
  alternatives_korean:
  - 그는 가졌습니다
  - 그리고 그에게는
  lexicon: HALOT
  rationale: 히브리어의 소유·귀속 표현을 한국어에서는 자연스럽게 ‘~에게는’으로 옮겨, 뒤의 두 아내 소개와 대비를 살렸습니다.
- source_word: שְׁתֵּ֣י נָשִׁ֔ים
  english_pob_choice: two wives
  chosen_korean: 두 아내
  alternatives_korean:
  - 두 여자
  - 두 아내들
  lexicon: HALOT
  rationale: 문맥상 נָשִׁים은 단순한 ‘여자들’이 아니라 결혼 관계의 ‘아내들’을 뜻하므로 그 의미를 분명히 했습니다.
- source_word: חַנָּ֔ה / פְּנִנָּ֑ה
  english_pob_choice: Hannah / Peninnah
  chosen_korean: 한나 / 브닌나
  alternatives_korean:
  - 하나 / 페닌나
  - 한나 / 페닌나
  lexicon: modern transliteration
  rationale: 성경 인명은 한국어에서 널리 쓰이는 음역을 따르되, פְּנִנָּה는 표준적 음역 관행에 따라 브닌나로 옮겼습니다.
- source_word: יְלָדִֽים
  english_pob_choice: children
  chosen_korean: 자녀
  alternatives_korean:
  - 아이들
  - 자식들
  lexicon: HALOT
  rationale: 히브리어 יְלָדִים의 넓은 뜻을 살려 성별을 특정하지 않는 ‘자녀’로 옮겼습니다.
theological_decisions:
- issue: 두 아내라는 서술의 직접성
  chosen_reading: 원문이 보여 주는 다중 아내 가정을 완화하지 않고 그대로 ‘두 아내’로 옮겼습니다.
  alternative_readings:
  - 두 부인
  - 아내가 둘 있었다
  rationale: 서사의 사회적·가정적 배경을 흐리지 않기 위해, 원문의 노골적인 혼인 구조를 직접적으로 드러냈습니다.
  doctrine_reference: 서술 본문은 역사적 상황을 기술하므로 정서적 완화보다 원문 충실성을 우선합니다.
