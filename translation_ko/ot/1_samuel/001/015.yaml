  text: But Hannah answered and said[a], “No, my lord. I am a woman troubled in spirit. I have drunk neither wine nor strong drink[b], but I have poured out my soul before Yahweh.”
  footnotes:
  - marker: a
    text: Or “a woman of sorrowful spirit.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “before Yahweh.”
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 한나가 대답하며 말했습니다. “아닙니다, 나의 주인이시여. 저는 마음이 괴로운 여자입니다. 포도주나 독주를 마신 적이 없고, 야훼 앞에 제 영혼을 쏟아 놓았습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “영이 괴로운 여자입니다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “야훼 앞에”입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא אֲדֹנִי
  english_pob_choice: No, my lord
  chosen_korean: 아닙니다, 나의 주인이시여
  alternatives_korean:
  - 아닙니다, 내 주여
  - 아니요, 주인님
  lexicon: HALOT
  rationale: 아ֲדֹנִי는 엘리를 향한 정중한 호칭이므로, 신적 칭호가 아닌 사회적 존대가 드러나도록 ‘나의 주인이시여’로 옮겼습니다.
- source_word: אִשָּׁה קְשַׁת רוּחַ
  english_pob_choice: a woman troubled in spirit
  chosen_korean: 마음이 괴로운 여자
  alternatives_korean:
  - 영이 괴로운 여자
  - 슬픈 마음의 여자
  - 심령이 괴로운 여자
  lexicon: HALOT
  rationale: 문맥상 완고함이 아니라 깊은 내적 고통을 뜻하므로, 현대 한국어에서 자연스럽고 의미를 살리는 ‘마음이 괴로운 여자’로 옮겼습니다.
- source_word: וְיַיִן וְשֵׁכָר
  english_pob_choice: wine nor strong drink
  chosen_korean: 포도주나 독주
  alternatives_korean:
  - 포도주나 강한 술
  - 포도주나 술독한 음료
  lexicon: HALOT
  rationale: שֵׁכָר는 포도주와 구별되는 취하게 하는 술을 가리키므로, 둘의 대비를 살리는 통상적 한국어인 ‘독주’를 택했습니다.
- source_word: וָאֶשְׁפֹּךְ אֶת נַפְשִׁי
  english_pob_choice: I have poured out my soul
  chosen_korean: 제 영혼을 쏟아 놓았습니다
  alternatives_korean:
  - 제 마음을 쏟아 놓았습니다
  - 제 생명을 쏟았습니다
  lexicon: HALOT
  rationale: נֶפֶשׁ의 비유를 살리면서도 한국어 표현으로 자연스럽게 전달하기 위해 ‘영혼을 쏟아 놓았습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 프로젝트 기본어인 ‘야훼’를 유지해 원문 고유명을 드러냈습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 구절은 하나님의 언약 이름을 직접 포함하므로, 예배적 완화보다 원문 식별성을 우선해 고유 신명 표기를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 한나의 자기 진술 register
  chosen_reading: 엘리에게 대한 공손한 항변으로 합쇼체를 유지했습니다.
  alternative_readings:
  - 더 구어적인 평서체
  - 고전적 종결형
  rationale: 대화 상대는 제사장 엘리이므로, 사회적 거리와 공손함을 드러내는 합쇼체가 문맥에 가장 잘 맞습니다.
  doctrine_reference: 'Korean style policy: modern formal-polite register'
