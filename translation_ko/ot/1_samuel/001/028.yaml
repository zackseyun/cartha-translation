source:
  edition: WLC
  text: וְ/גַ֣ם אָנֹכִ֗י הִשְׁאִלְתִּ֨/הוּ֙ לַֽ/יהוָ֔ה כָּל הַ/יָּמִים֙ אֲשֶׁ֣ר הָיָ֔ה ה֥וּא שָׁא֖וּל לַֽ/יהוָ֑ה וַ/יִּשְׁתַּ֥חוּ שָׁ֖ם לַ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/028.yaml
  text: So I also have given him to Yahweh[a]; all the days that he lives[b], he is given to Yahweh.” And he worshiped Yahweh there.
  footnotes:
  - marker: a
    text: Or, 'I have given/dedicated him to the LORD.' The Hebrew uses the same root as 'asked' earlier in the chapter, creating a wordplay that is partly preserved by 'lent.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'they worshiped the LORD there.' The Hebrew form has been understood differently in translation tradition.
    reason: alternative_reading
translation:
  language: ko
  text: “또한 저도 그를 야훼께 드렸습니다[a]. 그가 사는 모든 날 동안 그는 야훼께 드려져 있습니다.” 그리고 그는 그곳에서 야훼께 경배했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저도 그를 야훼께 빌려드렸습니다.’ 히브리어는 이 장 앞부분의 ‘구하다’와 같은 어근을 반복하여 말놀이를 이룹니다. ‘드렸습니다/드려져 있습니다’는 그 반복을 일부 반영하지만, ‘구하다’와의 말놀이는 한국어에서 그대로 드러나지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 그곳에서 야훼께 경배했습니다.’ 히브리어 동사의 형태는 번역 전통에서 다르게 이해되어 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁאִלְתִּהוּ / שָׁאוּל
  english_pob_choice: have given / is given (with wordplay note)
  chosen_korean: 드렸습니다 / 드려진 사람
  alternatives_korean:
  - 바쳤습니다 / 바쳐진 사람
  - 맡겼습니다 / 맡겨진 사람
  - 빌려드렸습니다 / 빌려진 사람
  lexicon: HALOT
  rationale: 동사의 기본 의미는 여호와께 바쳐 돌려드리는 헌납이므로 '드리다'를 택하되, 히브리어 어근 שׁאל의 반복적 말장난은 '드려진 사람'으로 최소한 반영했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주께
  lexicon: 표준 표기 프로젝트 기본값
  rationale: 본문이 여호와의 고유명을 직접 쓰므로 POB 기본 원칙에 따라 '야훼'를 유지했습니다.
- source_word: כָּל הַיָּמִים אֲשֶׁר הָיָה הוּא
  english_pob_choice: all the days that he lives
  chosen_korean: 그가 사는 모든 날 동안
  alternatives_korean:
  - 그가 존재하는 모든 날 동안
  - 평생
  lexicon: HALOT
  rationale: 관용적인 생애 기간 표현을 자연스러운 현대 한국어로 옮기되, 기간의 전면성을 살리기 위해 '모든 날 동안'을 유지했습니다.
- source_word: וַיִּשְׁתַּחוּ
  english_pob_choice: he worshiped
  chosen_korean: 경배했습니다
  alternatives_korean:
  - 절했습니다
  - 엎드려 경배했습니다
  - 예배했습니다
  lexicon: HALOT
  rationale: 단순한 몸짓보다 예배적 행위를 드러내는 동사이므로 '경배하다'를 택했습니다. 현대 한국어에서 가장 직접적이고 과도하게 교회화되지 않은 표현입니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 출애굽기적 언약 이름을 본문이 직접 사용하므로, POB 기본 방침대로 대체 칭호가 아니라 고유명으로 드러냈습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: וַיִּשְׁתַּחוּ의 주어 불명확성
  chosen_reading: 그는 경배했습니다
  alternative_readings:
  - 그들은 경배했습니다
  - 엘가나가 경배했습니다
  - 사무엘이 경배했습니다
  rationale: 마소라 본문의 단수 형태를 우선 살리되, 지시 대상이 문맥상 완전히 명시되지 않는 점은 한국어에서도 그대로 남겨 주었습니다.
  doctrine_reference: 'POB translation philosophy: Preserve theological tension rather than resolve it'
