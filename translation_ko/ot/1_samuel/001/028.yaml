  source_fidelity: 본문 첫머리에는 직접화법을 도입하는 ‘그는 말했습니다’가 없으며, אַנֹכִי(‘나’)로 이어지는 한나의 발화입니다. 또한 וַיִּשְׁתַּחוּ의 주어·수 논점은 마지막 동사에만 관계하므로, 현 초안처럼 생애 기간 표현에 각주를 붙이는 것은 원문 및 영어 감사 기록과 맞지 않습니다. הִשְׁאִלְתִּהוּ와 שָׁאוּל의 반복은 ‘드렸습니다/드려져 있습니다’로 반복을 어느 정도 드러내되, 한국어에서 원어의 ‘구하다’ 어근 말놀이는 그대로 재현되지 않습니다.
  naturalness: ‘드려진 사람입니다’는 한국어에서 다소 부자연스럽고, 헌신의 지속 상태를 나타내는 ‘야훼께 드려져 있습니다’가 현대 정중체에서 더 자연스럽습니다. 인용문을 곧바로 시작하면 앞 문맥에서 이어지는 발화로도 자연스럽습니다.
