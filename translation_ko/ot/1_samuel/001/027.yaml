id: 1SA.1.27
reference: 1 Samuel 1:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶל הַ/נַּ֥עַר הַ/זֶּ֖ה הִתְפַּלָּ֑לְתִּי וַ/יִּתֵּ֨ן יְהוָ֥ה לִ/י֙ אֶת שְׁאֵ֣לָתִ֔/י אֲשֶׁ֥ר שָׁאַ֖לְתִּי מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/027.yaml
  text: For this boy I prayed[b][a], and Yahweh has given me my petition that I asked from him.
  footnotes:
  - marker: a
    text: Or 'About this boy I prayed.' The Hebrew preposition can mark the matter concerning which she prayed.
    reason: lexical_alternative
  - marker: b
    text: Or 'my request' instead of 'my petition.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 아이를 위하여 제가 기도하였고, 야훼께서 제가 그분께 구한 제 청을 제게 주셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 아이에 관하여’로도 옮길 수 있습니다. 히브리어 전치사 אֶל은 기도의 ‘대상/주제’ 관계를 표시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 청원’으로도 옮길 수 있습니다. כאן의 שְׁאֵלָה는 정중한 ‘청/청원’의 뉘앙스를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל הַנַּעַר הַזֶּה
  english_pob_choice: For this boy
  chosen_korean: 이 아이를 위하여
  alternatives_korean:
  - 이 아이에 관하여
  - 이 아이를 두고
  lexicon: HALOT
  rationale: אֶל은 기도의 대상이 아니라 기도의 ‘주제/대상에 관한’ 용법을 가질 수 있어, 한국어에서는 ‘위하여’로 자연스럽게 표현하되, 아동을 가리키는 הַנַּעַר는 ‘아이’로 옮겨 문맥을 살렸습니다.
- source_word: הִתְפַּלָּלְתִּי
  english_pob_choice: I prayed
  chosen_korean: 제가 기도하였고
  alternatives_korean:
  - 제가 기도했으며
  - 제가 기도하였습니다
  lexicon: HALOT
  rationale: 서술적 과거를 살리면서도 한국어 문맥에서 자연스럽게 이어지도록 ‘기도하였고’로 처리했습니다.
- source_word: שְׁאֵלָתִי / אֲשֶׁר שָׁאַלְתִּי
  english_pob_choice: my petition ... that I asked
  chosen_korean: 제 청을 ... 제가 그분께 구한
  alternatives_korean:
  - 제 간구를 ... 제가 그분께 요청한
  - 제가 드린 청원을 ... 제가 그분께 구한
  lexicon: HALOT
  rationale: שְׁאֵלָה의 형식적 의미와 שאל 어근의 반복을 살리기 위해 ‘청’과 ‘구한’을 함께 써서, 같은 어근의 중첩을 한국어에서도 어느 정도 드러냈습니다.
- source_word: מֵעִמּוֹ
  english_pob_choice: from him
  chosen_korean: 그분께
  alternatives_korean:
  - 그에게서
  - 그에게
  lexicon: HALOT
  rationale: מֵ의 출발점/기원 감각은 한국어에서 ‘에게서’로도 가능하지만, 여기서는 기도 응답의 수여 구문이므로 ‘그분께’로 유연하게 처리하되, 문맥상 ‘주셨습니다’와 함께 자연스러운 방향성을 확보했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 야훼의 고유명사를 지칭하므로, 프로젝트 기본값에 따라 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: אלהים의 고유명사와 직접 대면 진술
  chosen_reading: 야훼께서 ... 주셨습니다
  alternative_readings:
  - 주님께서 ... 주셨습니다
  - 여호와께서 ... 주셨습니다
  rationale: 히브리어 본문이 יְהוָה를 직접 사용하므로, 고유명사성을 살리는 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
