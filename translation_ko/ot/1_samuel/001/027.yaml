  naturalness: 본문은 자연스럽고 합쇼체에 맞습니다. ‘제가 그분께 구한 제 청을’은 소유와 관계절이 겹치지만, 원문의 반복과 1인칭 소유를 보존하는 범위에서 자연스럽습니다. 각주 b의 비한국어 단어 ‘כאן’은 한국어 주석으로 부적절합니다.
