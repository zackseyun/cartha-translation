  text: וַ/יְהִי֙ לִ/תְקֻפ֣וֹת הַ/יָּמִ֔ים וַ/תַּ֥הַר חַנָּ֖ה וַ/תֵּ֣לֶד בֵּ֑ן וַ/תִּקְרָ֤א אֶת שְׁמ/וֹ֙ שְׁמוּאֵ֔ל כִּ֥י מֵ/יְהוָ֖ה שְׁאִלְתִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/020.yaml
  text: And in due time Hannah conceived and bore a son[a], and she called his name Samuel, for she said[b], “I asked for him from Yahweh.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''at the turning/cycle of the days,'' an idiom meaning when the proper time had come.'
    reason: lexical_alternative
  - marker: b
    text: 'The name ''Samuel'' is explained here by a wordplay with the Hebrew verb ''asked'' (שׁאל): ''I asked for him from the LORD.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 때가 차자 한나가 임신하여 아들을 낳고, 그의 이름을 사무엘이라 불렀습니다. 이는 그녀가 말하기를 「내가 그를 야훼께 구하였기 때문입니다」라고 했기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘날들의 순환/전환’이라는 관용구이며, 뜻은 ‘때가 차서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 이름 ‘사무엘’은 히브리어 동사 ‘구하다’(שׁאל)와의 말놀이로 설명됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקֻפוֹת הַיָּמִים
  english_pob_choice: in due time
  chosen_korean: 때가 차자
  alternatives_korean:
  - 적절한 때에
  - 날들이 돌 때에
  - 얼마 후
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 ‘날들의 순환/전환’이지만, 의미는 적절한 때의 도래이므로 한국어에서는 자연스럽고 의미를 살리는 ‘때가 차자’로 옮겼습니다.
- source_word: וַתַּהַר
  english_pob_choice: conceived
  chosen_korean: 임신하여
  alternatives_korean:
  - 잉태하여
  - 수태하여
  lexicon: HALOT
  rationale: 출산 서술에서 ‘הרה’는 임신/잉태를 뜻하므로, 현대 표준어로는 가장 직접적인 ‘임신하여’가 자연스럽고 분명합니다.
- source_word: וַתֵּלֶד בֵּן
  english_pob_choice: bore a son
  chosen_korean: 아들을 낳고
  alternatives_korean:
  - 아들을 출산하고
  - 남자아이를 낳고
  lexicon: HALOT
  rationale: 동사의 출산 의미를 그대로 살리되, 한국어 서술에서는 가장 자연스러운 ‘아들을 낳고’로 옮겼습니다.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  english_pob_choice: she called his name
  chosen_korean: 그의 이름을 사무엘이라 불렀습니다
  alternatives_korean:
  - 그에게 사무엘이라는 이름을 지었습니다
  - 그의 이름을 사무엘이라 지었습니다
  lexicon: HALOT
  rationale: 히브리어의 이름 짓기 공식을 보존하면서도 한국어로 자연스럽게 들리도록 ‘이름을 …라 불렀습니다’로 옮겼습니다.
- source_word: מֵיְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼로부터
  - 야훼에게서
  lexicon: project default
  rationale: 프로젝트 기본 원칙에 따라 신명은 ‘야훼’로 옮겼고, 요청의 방향성을 살려 ‘께’로 처리했습니다.
theological_decisions:
- issue: 사무엘 이름 설명의 단어놀이 처리
  chosen_reading: 이름의 설명을 본문 안에서 드러내되, 과도한 어원 단정은 피하고 ‘내가 그를 야훼께 구하였다’는 설명으로 유지했습니다.
  alternative_readings:
  - 이름 자체를 한국어로 설명적으로 풀어 쓰는 방식
  - 어원 설명을 각주로만 처리하는 방식
  rationale: 히브리어는 שׁאל('구하다')와의 말놀이로 이름 설명을 제공하므로, 본문은 읽기 쉽게 유지하면서도 각주 대신 인용문으로 의미를 드러내는 것이 원문 의도를 잘 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
