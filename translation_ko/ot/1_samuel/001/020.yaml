  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문의 시간 관용구에 대한 각주 표지는 해당 표현 바로 뒤에 두는 편이 정확하며, 인용문 뒤의 ‘라고 했기 때문입니다’는 중복적이고 부자연스럽습니다. 원문은 이름을 붙인 이유를 1인칭으로 제시하므로, 한나가 말한 내용으로 자연스럽게 연결할 수 있습니다.
  naturalness: ‘이는 그녀가 말하기를 …라고 했기 때문입니다’는 현대 한국어 합쇼체에서 매우 어색하고 ‘말하기를/라고 했기 때문입니다’가 겹칩니다. ‘이는 한나가 …라고 말했기 때문입니다’로 고치면 명료하고 자연스럽습니다.
