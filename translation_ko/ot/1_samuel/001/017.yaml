base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/017.yaml
  text: Then Eli answered and said[a], “Go in peace, and may the God of Israel grant your petition that you have asked from him.”
  footnotes:
  - marker: a
    text: Or 'your request.' The Hebrew term refers to what was asked for in prayer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 엘리가 대답하여 말했습니다. “평안히 가십시오. 그리고 이스라엘의 하나님께서 당신이 그분께 구한 청원[a]을 들어주시기를 바랍니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘청원’은 ‘요청’으로도 옮길 수 있습니다. 원문은 기도로 구한 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  english_pob_choice: answered and said
  chosen_korean: 대답하며 말했습니다
  alternatives_korean:
  - 대답하고 말했습니다
  - 대답하여 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 대화 응답 공식을 한국어 서술문에서 자연스럽게 살리되, ‘말했습니다’로 직접 발화를 분명히 했습니다.
- source_word: לְשָׁלוֹם
  english_pob_choice: in peace
  chosen_korean: 평안히
  alternatives_korean:
  - 평화롭게
  - 무사히
  lexicon: HALOT
  rationale: ברכה/인사 공식의 뉘앙스를 살리면서 한국어 관용 표현으로는 ‘평안히 가십시오’가 가장 자연스럽습니다.
- source_word: שֵׁלָתֵךְ
  english_pob_choice: your petition
  chosen_korean: 청원
  alternatives_korean:
  - 간구
  - 요청
  - 소원
  lexicon: HALOT
  rationale: שאלה가 단순한 요청보다 예배·기도 맥락의 ‘구함’에 가깝기 때문에, 공식적이고 기도적인 울림이 있는 ‘청원’으로 옮겼습니다.
- source_word: אֲשֶׁר שָׁאַלְתְּ מֵעִמּוֹ
  english_pob_choice: that you have asked from him
  chosen_korean: 당신이 그분께 구한
  alternatives_korean:
  - 당신이 그분께서 구한
  - 당신이 그에게 구한
  lexicon: HALOT
  rationale: מֵעִמּוֹ의 대상을 문맥상 하나님으로 분명히 드러내되, 히브리어의 ‘그에게서/그분께’라는 방향성을 유지했습니다.
theological_decisions:
- issue: מֵעִמּוֹ의 지시 대상
  chosen_reading: ‘그분께’는 이스라엘의 하나님을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - ‘그에게’를 남겨 더 일반적인 대명사로 둘 수 있습니다.
  rationale: 직전 문맥에서 한나의 기도가 여호와 앞에 드려졌으므로, 엘리의 축복은 하나님께 드린 간구를 뜻한다고 보는 것이 자연스럽습니다. 한국어에서는 오해를 줄이기 위해 지시 대상을 명시했습니다.
  doctrine_reference: 문맥이 충분히 분명할 때는 원문의 대명사 지시를 불필요하게 모호하게 두지 않습니다.
