  yaml_path: translation/ot/1_samuel/001/014.yaml
  text: And Eli said to her[b][a], “How long will you be drunk? Put away your wine from you.”
  footnotes:
  - marker: a
    text: Or “How long will you be drunk?” The Hebrew verb can be understood as either becoming drunk or being in a drunken state.
    reason: lexical_alternative
  - marker: b
    text: Literally “remove your wine from upon you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리가 그녀에게 말했습니다. 「언제까지 술에 취해 있겠습니까? 포도주를 당신에게서 치우십시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘술에 취하다’일 수도, ‘술 취한 상태에 있다’일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신에게서/당신 위에서 포도주를 치우십시오’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  english_pob_choice: And Eli said to her
  chosen_korean: 엘리가 그녀에게 말했습니다
  alternatives_korean:
  - 그리고 엘리가 그녀에게 말했습니다
  - 엘리가 그녀에게 이르렀습니다
  lexicon: WLC
  rationale: 히브리어 서술형 진행을 자연스러운 한국어 서술로 옮기되, 대상 지시어 אֵלֶיהָ를 분명하게 유지했습니다.
- source_word: עַד מָתַי
  english_pob_choice: How long
  chosen_korean: 언제까지
  alternatives_korean:
  - 얼마나 더
  - 도대체 언제까지
  lexicon: HALOT
  rationale: 시간 지속을 묻는 관용적 표현으로, 한국어에서도 가장 직접적인 대응입니다.
- source_word: תִּשְׁתַּכָּרִי/ן
  english_pob_choice: will you be drunk
  chosen_korean: 술에 취해 있겠습니까
  alternatives_korean:
  - 술에 취하겠습니까
  - 계속 술에 취해 있겠습니까
  lexicon: HALOT
  rationale: 히브리어 동사의 상태/되어감의 뉘앙스를 살려 단순한 ‘취하다’보다 현재 상태를 묻는 형태로 옮겼습니다.
- source_word: הָסִירִי אֶת יֵינֵךְ מֵעָלָיִךְ
  english_pob_choice: Put away your wine from you
  chosen_korean: 포도주를 당신에게서 치우십시오
  alternatives_korean:
  - 당신의 포도주를 당신에게서 제거하십시오
  - 포도주를 당신에게서 없애십시오
  lexicon: HALOT
  rationale: 직역하면 ‘당신 위에서/당신에게서 포도주를 제거하라’이므로, 한국어에서는 명령의 뜻을 자연스럽게 살려 ‘치우십시오’로 옮겼습니다.
theological_decisions:
- issue: Eli의 말투를 한국어에서 어떻게 재현할지
  chosen_reading: 정중한 명령형(치우십시오)과 비난조 질문(언제까지 술에 취해 있겠습니까)을 유지했습니다.
  alternative_readings:
  - 반말체
  - 더 부드러운 권고형
  rationale: 엘리는 정죄와 질책의 뉘앙스로 말하고 있으므로, 한국어에서도 그 날카로움을 약화시키지 않는 표현이 적절합니다.
  doctrine_reference: 서술 문맥의 담화 기능 보존
