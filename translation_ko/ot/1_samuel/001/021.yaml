  - severity: low
    issue: ‘그 남자 엘가나’
    rationale: הָאִישׁ의 문자적 요소를 그대로 옮긴 표현이지만, 한국어에서는 불필요하게 어색하고 거리감 있는 지시 표현입니다. 엘가나를 곧바로 주어로 제시해도 원문의 인물 지시 기능이 보존됩니다.
  revised_text: 엘가나는 온 집안과 함께 야훼께 해마다 드리는 제사를 드리고 자기가 한 서원을 이행하려고 올라갔습니다.[a]
