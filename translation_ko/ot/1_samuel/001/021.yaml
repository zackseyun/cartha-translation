revisions:
- from: 그 남자 엘가나가 그의 온 집안과 함께 올라가서 야훼께 해마다 드리는 제사와 그의 서원을 드렸습니다.[a]
  to: 엘가나는 온 집안과 함께 야훼께 해마다 드리는 제사를 드리고 자기가 한 서원을 이행하려고 올라갔습니다.[a]
  rationale: 서원을 ‘드린다’는 부정확한 결합을 피하고, 히브리어의 생략된 동사가 문맥상 가리키는 서원 이행을 자연스러운 한국어로 명시했습니다. 각주에서는 원문의 병렬 구조와 생략을 밝혀 해석적 보충임을 드러냈습니다. 또한 ‘그 남자’라는 비자연스러운 직역을 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:24:18Z'
