base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/021.yaml
  text: Then the man Elkanah went up with all his household to sacrifice to Yahweh the yearly sacrifice and his vow[a].
  footnotes:
  - marker: a
    text: Or, 'and his vow,' with the verb 'to sacrifice' understood elliptically; the sense is that he went up also to discharge what he had vowed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 남자 엘가나가 그의 온 집안과 함께 올라가서 야훼께 해마다 드리는 제사와 그의 서원을 드렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘제사하다’에 서원도 함께 묶는 병렬 구조로 읽을 수 있습니다. 따라서 뜻은 ‘그의 서원도 이행하려고’라는 취지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라가서
  alternatives_korean:
  - 갔습니다
  - 올랐습니다
  lexicon: HALOT
  rationale: 산당이 아니라 예배 처소로 ‘올라감’이라는 순례적 뉘앙스를 살리기 위해 ‘올라가서’로 옮겼습니다.
- source_word: הָאִישׁ אֶלְקָנָה
  english_pob_choice: the man Elkanah
  chosen_korean: 그 남자 엘가나
  alternatives_korean:
  - 남편 엘가나
  - 엘가나
  lexicon: HALOT
  rationale: אִישׁ의 기본 의미를 살려 ‘남자’로 두고, 인명은 현대 외래어 표기를 따라 ‘엘가나’로 적었습니다.
- source_word: וְכָל בֵּיתוֹ
  english_pob_choice: with all his household
  chosen_korean: 그의 온 집안과 함께
  alternatives_korean:
  - 온 집과 함께
  - 온 가족과 함께
  lexicon: HALOT
  rationale: בַּיִת의 공동체적 의미를 살려 물리적 건물보다 사람들을 포함하는 ‘집안’으로 옮겼습니다.
- source_word: זֶבַח הַיָּמִים
  english_pob_choice: the yearly sacrifice
  chosen_korean: 해마다 드리는 제사
  alternatives_korean:
  - 연례 제사
  - 해마다의 제사
  lexicon: HALOT
  rationale: 관용적으로 반복되는 연례 제의를 자연스러운 한국어로 풀어 ‘해마다 드리는 제사’로 표현했습니다.
- source_word: וְאֶת נִדְרוֹ
  english_pob_choice: and his vow
  chosen_korean: 그의 서원을 드렸습니다
  alternatives_korean:
  - 그의 서원과 함께
  - 그리고 그의 서원을
  lexicon: HALOT
  rationale: 히브리어는 제사 동사가 생략된 병렬 구조이므로, POB의 문맥 판단에 따라 서원을 ‘드렸다’로 풀어 한국어에서 필요한 동사를 보완했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 여호와 자리의 고유 이름을 직접 사용하므로, 프로젝트 기본값에 따라 음역 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 서원과 제사의 결합
  chosen_reading: ‘해마다 드리는 제사와 그의 서원’으로 병렬 유지
  alternative_readings:
  - ‘해마다 드리는 제사와 서원을 이행함’
  - ‘해마다 드리는 제사와 서원 이행’
  rationale: 히브리어는 목적어를 병렬로 두어 제사 동사 아래에 함께 걸리게 하므로, ‘이행하다’를 명시적으로 추가하기보다 병렬감을 살렸습니다.
  doctrine_reference: 문맥·통사 판단
