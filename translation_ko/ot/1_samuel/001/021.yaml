  text: Then the man Elkanah went up with all his household to sacrifice to Yahweh the yearly sacrifice and his vow[a].
  footnotes:
  - marker: a
    text: Or, 'and his vow,' with the verb 'to sacrifice' understood elliptically; the sense is that he went up also to discharge what he had vowed.
    reason: lexical_alternative
translation:
  language: ko
  text: 엘가나는 온 집안과 함께 야훼께 해마다 드리는 제사를 드리고 자기가 한 서원을 이행하려고 올라갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘해마다 드리는 제사’와 ‘그의 서원’을 병렬로 둡니다. 둘째 표현에는 동사가 생략되어 있으며, 문맥상 그가 한 서원을 이행한다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
