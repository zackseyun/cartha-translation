  - 그녀의 얼굴은 더 이상 슬프지 않았습니다
  - 그녀의 모습은 더 이상 예전 같지 않았습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그녀의 얼굴이 더 이상 그녀에게 있지 않았다’는 관용 표현이므로, 문맥이 요구하는 내적 슬픔의 해소를 ‘침울하지 않았습니다’로 자연스럽게 반영했습니다.
- source_word: וַתֹּאכַל
