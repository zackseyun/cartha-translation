base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/018.yaml
  text: She said[a], “May your servant find favor in your eyes.” Then the woman went on her way and ate[b], and her face was no longer downcast.
  footnotes:
  - marker: a
    text: Literally, 'May your female servant find favor in your eyes.'
    reason: lexical_alternative
  - marker: b
    text: Or, more literally, 'her face was no longer [as it had been before],' meaning her expression no longer showed her grief.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 말했습니다. “당신의 여종이 당신 눈에 은혜를 입게 하십시오.” 그러고 나서 그 여인은 자기 길로 가서 먹었고, 그녀의 얼굴은 더 이상 침울하지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 여자 종/여종이 당신 눈에 은혜를 입게 하십시오’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그녀의 얼굴이 더 이상 [이전처럼] 그녀에게 있지 않았다’는 뜻으로, 슬픔이 겉으로 드러나지 않게 되었음을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחָתְךָ
