  rationale: 이어지는 동작을 단순히 서술하는 wayyiqtol을 살려, 앞뒤 서술과 연결되는 과거 진행을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 한나의 발화체 공손성
  chosen_reading: 하나님께 드리는 기도가 아니라 엘리에게 하는 정중한 요청이므로, 한국어도 직접 청원형 공손체를 유지했습니다.
  alternative_readings:
  - 기도문처럼 ‘은혜를 베푸소서’로 옮기는 읽기
  - 평서형으로 완화하는 읽기
  rationale: 본문은 제의적 기도라기보다 존중의 자기비하적 청원입니다. 따라서 원문의 사회적 관계와 화행을 보존하는 번역이 더 적절합니다.
  doctrine_reference: 삼상 1:17-18 문맥
