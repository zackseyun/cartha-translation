translation:
  language: ko
  text: 그녀가 말했습니다. “당신의 여종[a]이 당신께 은혜를 입기를 바랍니다.” 그러고 나서 그 여인은 자기 길로 가서 먹었고, 그녀의 얼굴빛은 더 이상 침울하지 않았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 여자 종/여종’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그녀의 얼굴이 더 이상 그녀에게 있지 않았다’입니다. 히브리어 관용구로서, 문맥상 그녀의 얼굴에 슬픔이 더 이상 드러나지 않았음을 뜻합니다.
    reason: lexical_alternative
