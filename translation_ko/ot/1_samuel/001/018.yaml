  lexicon: HALOT
  rationale: 히브리어는 여성형 신분을 분명히 하는 말이므로, 문맥상 공손한 자기지칭을 유지하되 여성성을 드러내는 ‘여종’이 원문에 더 가깝습니다.
- source_word: חֵן בְּעֵינֶיךָ
