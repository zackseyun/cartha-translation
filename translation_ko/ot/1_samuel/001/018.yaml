  - 당신께 호의를 얻으십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘눈’ 이미지를 살리면서, 요청/소망의 뉘앙스를 한국어 공손 명령형으로 옮겼습니다.
- source_word: וּפָנֶיהָ לֹא הָיוּ לָהּ עוֹד
  english_pob_choice: her face was no longer downcast
  chosen_korean: 그녀의 얼굴은 더 이상 침울하지 않았습니다
