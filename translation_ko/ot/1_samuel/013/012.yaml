source:
  edition: WLC
  text: וָ/אֹמַ֗ר עַ֠תָּה יֵרְד֨וּ פְלִשְׁתִּ֤ים אֵלַ/י֙ הַ/גִּלְגָּ֔ל וּ/פְנֵ֥י יְהוָ֖ה לֹ֣א חִלִּ֑יתִי וָֽ/אֶתְאַפַּ֔ק וָ/אַעֲלֶ֖ה הָ/עֹלָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/012.yaml
  text: So I said[a], ‘Now the Philistines will come down against me at Gilgal[b], and I have not sought the favor of Yahweh.’ So I forced myself and offered up the burnt offering.
  footnotes:
  - marker: a
    text: 'Hebrew: ''I have not sought the favor of the LORD,'' literally, ''I have not entreated the face of the LORD.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'I restrained myself.' The Hebrew verb can carry the sense of holding oneself in or mastering oneself; here it likely means Saul compelled himself to act.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 제가 말했습니다[a], 「이제 블레셋 사람들이 길갈에서 나를 치러 내려올 것이고, 나는 야훼의 얼굴을 구하지 못했습니다. 그래서 내가 스스로를 억누르고 번제물을 드렸습니다」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘야훼의 얼굴을 화목시키지/간구하지 않았다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘스스로를 억눌렀다.’ 이 동사는 자신을 억제하거나 마음을 다잡는 뜻을 낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: So I said
  chosen_korean: 그래서 제가 말했습니다
  alternatives_korean:
  - 그리고 제가 말했습니다
  - 그때 제가 말했습니다
  lexicon: HALOT
  rationale: 와우-연속형의 서술 진행과 사울의 사후 설명 흐름을 자연스럽게 살려, 합쇼체 서술로 옮겼습니다.
- source_word: פְּלִשְׁתִּים
  english_pob_choice: the Philistines
  chosen_korean: 블레셋 사람들이
  alternatives_korean:
  - 블레셋이
  - 블레셋 군대가
  lexicon: HALOT
  rationale: 고유 민족명은 현대 표기 관례에 따라 블레셋으로 옮겼고, 여기서는 집합적 주어를 자연스럽게 풀어 썼습니다.
- source_word: וּפְנֵי יְהוָה לֹא חִלִּיתִי
  english_pob_choice: I have not sought the favor of Yahweh
  chosen_korean: 야훼의 얼굴을 구하지 못했습니다
  alternatives_korean:
  - 야훼의 은총을 구하지 못했습니다
  - 야훼께 간청하지 못했습니다
  lexicon: HALOT
  rationale: 히브리어 직역상 ‘얼굴’을 유지하되, 문맥상 ‘구하다/간구하다’의 의미를 드러내어 원문 이미지와 관용 의미를 함께 살렸습니다.
- source_word: וָאֶתְאַפַּק
  english_pob_choice: So I forced myself
  chosen_korean: 그래서 내가 스스로를 억누르고
  alternatives_korean:
  - 그래서 내가 나를 강제로 몰아붙이고
  - 그래서 내가 억지로 참고
  lexicon: HALOT
  rationale: 동사의 자기억제/자기강요 뉘앙스를 살리되, 한국어에서 가장 자연스럽게 긴박한 자기통제를 전달하는 표현으로 옮겼습니다.
- source_word: הָעֹלָה
  english_pob_choice: the burnt offering
  chosen_korean: 번제물
  alternatives_korean:
  - 번제
  - 번제 제물
  lexicon: HALOT
  rationale: 제의적 대상 자체를 가리키는 문맥이므로 한국어 성경 문체에 맞게 ‘번제물’로 구체화했습니다.
theological_decisions:
