translation:
  language: ko
  text: 그리하여 온 이스라엘은 각자 자기 삽날과 괭이와 도끼와 낫을 벼리려고 블레셋 사람들에게 내려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 도구 명칭 가운데 첫째와 넷째 항목은 의미가 확실하지 않아, 번역 전통에 따라 ‘삽날’과 ‘낫’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  english_pob_choice: went down
  chosen_korean: 내려갔습니다
  alternatives_korean:
  - 갔습니다
  - 내려갔습니다
  lexicon: HALOT
  rationale: ירד의 기본 방향성인 ‘아래로 내려감’을 살리고, 서술체 합쇼체로 자연스럽게 옮겼습니다.
- source_word: הַפְּלִשְׁתִּים
  english_pob_choice: to the Philistines
  chosen_korean: 블레셋 사람들에게
  alternatives_korean:
  - 블레셋 사람들에게
  - 블레셋으로
  lexicon: HALOT
  rationale: 모션의 대상이 민족 집단이므로 ‘사람들’로 옮겼고, 지명화한 ‘블레셋으로’는 원문의 방향 대상이 약해집니다.
- source_word: לִלְטוֹשׁ
  english_pob_choice: to sharpen
  chosen_korean: 벼리려고
  alternatives_korean:
  - 갈려고
  - 날카롭게 하려고
  - 벼리려고
  lexicon: HALOT
  rationale: 금속 도구를 날카롭게 다듬는 뜻을 살리기 위해 ‘벼리다’를 선택했습니다. ‘벼리려고’는 목적 부정사 기능도 자연스럽게 반영합니다.
- source_word: מַחֲרַשְׁתּוֹ / אֵתוֹ / קַרְדֻּמּוֹ / מַחֲרֵשָׁתוֹ
  english_pob_choice: his plowshare, his mattock, his axe, and his sickle
  chosen_korean: 자기 삽날과 괭이와 도끼와 낫
  alternatives_korean:
  - 자기 보습과 괭이와 도끼와 낫
  - 자기 쟁기날과 괭이와 도끼와 낫
  lexicon: HALOT
  rationale: 첫 번째와 마지막 도구는 용례가 불확실하므로 POB의 장치에 맞춰 기능상 농기구 명칭을 택하되, 첫 항목은 ‘삽날’로 두어 날붙이 도구라는 성격을 드러냈습니다.
