  text: Saul was one year old when he became king[a], and he reigned two years over Israel.
  footnotes:
  - marker: a
    text: The Hebrew text here is difficult and likely textually deficient. Literally, 'Saul was a son of one year in his becoming king, and he reigned two years over Israel.' Some ancient witnesses and later proposals supply larger numbers, such as 'thirty' for Saul's age and 'forty-two' for the length of his reign.
