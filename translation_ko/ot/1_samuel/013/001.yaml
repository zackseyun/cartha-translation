translation:
  language: ko
  text: 사울은 왕이 되었을 때 한 살이었고[a], 이스라엘을 두 해 동안 다스렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 여기서 난해하며, 본문 전승에 결손이 있을 가능성이 큽니다. 직역하면 ‘사울은 왕이 됨에 있어 한 해의 아들이었고, 이스라엘을 두 해 다스렸다’는 뜻입니다. 고대 전승들과 후대의 제안들 가운데에는 사울의 나이를 ‘서른’, 통치 기간을 ‘마흔둘’로 보충하는 경우도 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שָׁנָה
  english_pob_choice: was one year old
  chosen_korean: 한 살이었고
  alternatives_korean:
  - 한 해의 아들이었고
  - 한 살 된 때였고
