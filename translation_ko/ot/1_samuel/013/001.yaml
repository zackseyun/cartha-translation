  text: Saul was one year old when he became king[a], and he reigned two years over Israel.
  footnotes:
  - marker: a
    text: The Hebrew text here is difficult and likely textually deficient. Literally, 'Saul was a son of one year in his becoming king, and he reigned two years over Israel.' Some ancient witnesses and later proposals supply larger numbers, such as 'thirty' for Saul's age and 'forty-two' for the length of his reign.
    reason: textual_variant
translation:
  language: ko
  text: 사울이 왕이 되었을 때는 한 살이었고[a], 이스라엘을 다스린 기간은 두 해였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 여기서 어렵고, 본래 수치가 빠졌을 가능성이 큽니다. 직역하면 ‘사울이 왕이 됨에 있어 한 해의 아들이었고, 이스라엘을 두 해 다스렸다’는 뜻입니다. 고대 사본들과 후대 제안들 가운데는 사울의 나이를 ‘서른’, 통치 기간을 ‘마흔둘’로 보충하는 경우도 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שָׁנָה
  english_pob_choice: was one year old
  chosen_korean: 한 살이었고
  alternatives_korean:
  - 한 해의 아들이었고
  - 한 살 된 때였고
  - 한 살짜리였고
  lexicon: HALOT
  rationale: 히브리어 관용구 בן שנה를 한국어의 자연스러운 연령 표현으로 옮기되, 본문의 난점을 가리지 않도록 너무 매끈한 해석은 피했습니다.
- source_word: בְּמָלְכוֹ
  english_pob_choice: when he became king
  chosen_korean: 왕이 되었을 때는
  alternatives_korean:
  - 즉위할 때는
  - 그가 다스릴 때는
  - 왕위에 오를 때는
  lexicon: HALOT
  rationale: ‘~할 때’의 시간 표지를 살리면서, 왕위 즉위를 뜻하는 문맥을 현대 한국어로 자연스럽게 드러냈습니다.
- source_word: מָלַךְ עַל יִשְׂרָאֵל
  english_pob_choice: he reigned over Israel
  chosen_korean: 이스라엘을 다스린 기간은 두 해였습니다
  alternatives_korean:
  - 이스라엘 위에 통치했습니다
  - 이스라엘을 다스렸습니다
  - 이스라엘 위에서 왕이었습니다
  lexicon: HALOT
  rationale: מָלַךְ의 통치 의미를 ‘다스리다’로 옮기고, 뒤의 기간 표현은 한국어 문장 구조에 맞게 풀어 번역했습니다.
theological_decisions:
- issue: 마소라 본문의 난해한 즉위 연대기 공식
  chosen_reading: 본문의 현존 형태를 유지하고, 숫자 보충이나 조화는 본문에 넣지 않았습니다.
  alternative_readings:
  - 사울이 서른 살에 왕이 되었고, 이스라엘을 42년 다스렸습니다.
  - 본문의 결손을 암시하는 다른 숫자를 괄호로 보충합니다.
  rationale: 히브리어 본문 자체가 텍스트상 어려운 지점을 포함하므로, 정본의 투명성을 위해 본문은 그대로 두고 난점을 각주로 표지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
