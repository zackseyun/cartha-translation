  rationale: הַר בֵּית אֵל은 단일한 산봉우리보다 베델 주변의 지형권을 가리키는 뜻으로 보아, 군사 배치에 자연스러운 ‘산지’로 옮겼습니다.
- source_word: שִׁלַּח
  english_pob_choice: he sent away
  chosen_korean: 보내었습니다
  alternatives_korean:
