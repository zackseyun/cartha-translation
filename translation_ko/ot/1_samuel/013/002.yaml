base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/002.yaml
  text: And Saul chose for himself three thousand men from Israel[a]. Two thousand were with Saul at Michmash and in the hill country of Bethel, and a thousand were with Jonathan at Gibeah of Benjamin. The rest of the people he sent away[b], each man to his tent.
  footnotes:
  - marker: a
    text: Or 'every man to his tent.' The Hebrew uses a common idiom for dismissing people to their own dwellings.
    reason: lexical_alternative
  - marker: b
    text: Or 'and on the hill of Bethel.' The Hebrew phrase may refer either to the hill country around Bethel or to a specific elevated area near Bethel.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울은 이스라엘에서 삼천 명을 자기에게서 골라 냈습니다[a]. 이천 명은 믹마스와 베델 산지에 있는 사울과 함께 있었고, 천 명은 베냐민의 기브아에 있는 요나단과 함께 있었습니다. 나머지 백성은 각 사람을 자기 장막으로 보내었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘각 사람을 자기 장막으로.’ 히브리어는 사람들을 자기 거처로 돌려보낼 때 쓰는 흔한 관용구를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘베델의 산지에.’ 히브리어 구절은 베델 주변의 산지를 가리킬 수도 있고, 베델 근처의 특정한 높은 지대를 가리킬 수도 있습니다.
    reason: lexical_alternative
