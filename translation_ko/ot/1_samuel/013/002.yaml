- source_word: אִישׁ לְאֹהָלָיו
  english_pob_choice: each man to his tent
  chosen_korean: 각 사람을 자기 장막으로
  alternatives_korean:
  - 각 사람을 자기 집으로
  - 사람마다 자기 진영으로
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 유지해, 개인의 거처로 흩어 보냈다는 이미지를 보존했습니다.
theological_decisions:
- issue: 군대 배치와 남은 백성의 해산 표현
  chosen_reading: 사울의 선택적 병력 편성과 나머지 백성의 해산을 역사 서술 그대로 간결하게 제시했습니다.
  alternative_readings:
  - 병력을 조직했습니다
  - 백성을 흩어 보냈습니다
  rationale: 본문은 신학적 해설보다 왕권 아래서의 실제 군사 편성 상황을 기록하므로, 설명을 덧붙이지 않고 서술의 사실성을 유지했습니다.
  doctrine_reference: 1 Samuel의 왕정 서술 맥락
