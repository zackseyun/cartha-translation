  source_fidelity: 사울이 이스라엘에서 3천 명을 선발하고, 2천 명과 1천 명을 각각 사울과 요나단에게 배치한 뒤 나머지를 돌려보냈다는 본문 구조는 대체로 반영했습니다. 그러나 ‘자기에게서 골라 냈습니다’는 לוֹ를 잘못 표현하여 ‘자기 자신에게서’라는 뜻으로 읽히며, 마지막 절은 사울이 나머지 백성을 보냈다는 주어·목적어 관계가 불분명합니다.
  naturalness: ‘믹마스와 베델 산지에 있는 사울’, ‘베냐민의 기브아에 있는 요나단’은 지명구가 인물을 수식하는 듯하여 자연스럽지 않습니다. 병력의 위치를 나타내도록 ‘...에서 사울과 함께’, ‘...에서 요나단과 함께’로 고쳐야 합니다. ‘보내었습니다’보다 현대 표준 합쇼체에서는 ‘돌려보냈습니다’가 자연스럽고 문맥에 알맞습니다.
