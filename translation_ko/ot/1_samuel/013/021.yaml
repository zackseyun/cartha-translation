id: 1SA.13.21
reference: 1 Samuel 13:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ/הָיְתָ֞ה הַ/פְּצִ֣ירָה פִ֗ים לַ/מַּֽחֲרֵשֹׁת֙ וְ/לָ֣/אֵתִ֔ים וְ/לִ/שְׁלֹ֥שׁ קִלְּשׁ֖וֹן וּ/לְ/הַ/קַּרְדֻּמִּ֑ים וּ/לְ/הַצִּ֖יב הַ/דָּרְבָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/021.yaml
  text: And the charge was a pim for the plowshares[a], for the mattocks, for the three-pronged forks, and for the axes[b], and for setting the goads.
  footnotes:
  - marker: a
    text: A pim was likely a small weight or payment, often understood as about two-thirds of a shekel.
    reason: cultural_note
  - marker: b
    text: Or 'the filing/sharpening was a pim'—the Hebrew wording is difficult, and the verse may describe either the fee charged or the sharpening itself.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그 갈고 값은 곡괭이와, 쇠스랑과, 세 갈래 쇠갈퀴와, 도끼와, 그리고 소몰이 막대를 손질하는 데에도 한 핌이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 핌은 아마도 작은 무게 또는 지불 단위로, 흔히 세겔의 약 3분의 2로 이해됩니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘갈고/날을 세우는 데 한 핌이 들었다’는 뜻일 수 있습니다. 히브리어 표현이 어려워, 이 구절은 부과된 요금인지 손질 행위 자체인지가 분명하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּצִירָה
  english_pob_choice: the charge
  chosen_korean: 그 갈고 값
  alternatives_korean:
  - 그 삯
  - 그 수수료
  - 그 손질 비용
  lexicon: HALOT
  rationale: 영문 POB가 이 단어를 도구를 갈아 주는 행위 자체보다 그에 부과된 대가로 이해하므로, 한국어도 문맥상 자연스러운 ‘값’으로 옮겼습니다. ‘갈고’는 바로 뒤의 도구 연관성을 살리되, 본문이 담는 비용 개념을 유지합니다.
- source_word: פִים
  english_pob_choice: a pim
  chosen_korean: 한 핌
  alternatives_korean:
  - 두 세겔의 3분의 2
  - 일정한 화폐 단위인 핌
  lexicon: HALOT
  rationale: 정확한 환산이 전문적이므로 음역을 유지해 본문의 측정/화폐 단위를 보존했습니다. 숫자와 함께 제시해 본문 리듬을 살리면서도 단위를 익숙하게 읽히게 했습니다.
- source_word: מַחֲרֵשֹׁת
  english_pob_choice: plowshares
  chosen_korean: 곡괭이
  alternatives_korean:
  - 쟁기날
  - 보습
  lexicon: HALOT
  rationale: 표준적인 농기구 명칭 중 문맥상 가장 가까운 쇠로 된 작업 도구를 택했으며, 다만 해당 히브리어는 쟁기의 금속 부품을 가리킬 수 있어 한국어에서는 의미를 과도하게 좁히지 않도록 했습니다.
- source_word: אֵתִים
  english_pob_choice: mattocks
  chosen_korean: 쇠스랑
  alternatives_korean:
  - 호미
  - 괭이
  lexicon: HALOT
  rationale: 영문 POB의 ‘mattocks’에 대응하는 한국어 농기구로는 넓게 알려진 작업 도구 명칭이 필요해 ‘쇠스랑’을 택했습니다. 정확한 기구 형태는 불확실하므로 지나치게 특정한 전통 용어는 피했습니다.
- source_word: שְׁלֹשׁ קִלְּשׁוֹן
  english_pob_choice: the three-pronged forks
  chosen_korean: 세 갈래 쇠갈퀴
  alternatives_korean:
  - 세 갈래 창
  - 삼지쇠갈퀴
  lexicon: HALOT
  rationale: 직역의 ‘세 갈래’와 도구 이미지인 ‘forks’를 함께 살려, 현대 독자가 바로 형상을 떠올릴 수 있는 표현으로 옮겼습니다. 단순한 ‘창’으로 만들면 농기구성보다 무기성이 강해질 수 있어 피했습니다.
- source_word: לְהַצִּיב הַדָּרְבָן
  english_pob_choice: for setting the goads
  chosen_korean: 소몰이 막대를 손질하는 데에도
  alternatives_korean:
  - 소몰이 막대를 세우는 데에도
  - 소몰이 막대를 맞추는 데에도
  - 소몰이 막대를 고정하는 데에도
  lexicon: HALOT
  rationale: 영문 POB가 ‘setting’을 손질·정비의 넓은 뜻으로 처리하고 있어, 한국어도 구체적 행위 하나로 고정하지 않고 ‘손질하는 데에도’로 옮겨 본문의 불확실성을 보존했습니다.
