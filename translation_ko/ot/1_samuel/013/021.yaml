revisions:
- from: 그리고 그 갈고 값은 곡괭이와, 쇠스랑과, 세 갈래 쇠갈퀴와, 도끼와, 그리고 소몰이 막대를 손질하는 데에도 한 핌이었습니다.[a][b]
  to: 그 요금은 쟁기날과 괭이와 세 갈래 쇠스랑과 도끼, 그리고 소몰이 막대를 바로잡는 데 한 핌이었습니다.[a][b]
  rationale: 문법적으로 성립하지 않는 표현을 바로잡고, 농기구 명칭을 원문의 순서와 의미에 맞게 수정했습니다. ‘요금’이라는 본문 번역과 손질·연마라는 대안 읽기를 각주로 병치하여 הַפְּצִירָה의 어휘적 불확실성을 보존했습니다.
