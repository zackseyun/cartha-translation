lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나갔습니다
  alternatives_korean:
  - 나왔습니다
  - 진군했습니다
  lexicon: HALOT
  rationale: wayyiqtol יצא의 기본 의미는 바깥으로 나가거나 나아가는 것입니다. 군사적 문맥이지만, 원문의 단순한 동작을 유지하려고 ‘나갔습니다’를 택했습니다.
- source_word: מַצַּב
  english_pob_choice: garrison
  chosen_korean: 수비대
  alternatives_korean:
  - 주둔군
  - 전초대
  lexicon: HALOT
  rationale: 군사적으로 배치된 부대를 가리키므로 ‘수비대’가 자연스럽고, POB의 군사적 의미를 한국어로 무리 없이 옮길 수 있습니다.
- source_word: מַעֲבַר
  english_pob_choice: the pass
  chosen_korean: 통로
  alternatives_korean:
  - 산길
  - 고개
  - 건널목
  lexicon: HALOT
  rationale: 어원상 ‘지나가는 곳/통과 지점’의 뜻이 있으며, 믹마스 지형의 군사적 통행 지점을 일반 독자가 이해하기 쉬운 ‘통로’로 옮겼습니다.
- source_word: מִכְמָשׂ
  english_pob_choice: Michmash
  chosen_korean: 믹마스
  alternatives_korean:
  - 미크마스
  lexicon: HALOT
  rationale: 지명은 현대 한국어 음역 관행에 맞춰 ‘믹마스’로 적었습니다.
