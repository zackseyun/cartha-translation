id: 1SA.13.8
reference: 1 Samuel 13:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/ייחל שִׁבְעַ֣ת יָמִ֗ים לַ/מּוֹעֵד֙ אֲשֶׁ֣ר שְׁמוּאֵ֔ל וְ/לֹא בָ֥א שְׁמוּאֵ֖ל הַ/גִּלְגָּ֑ל וַ/יָּ֥פֶץ הָ/עָ֖ם מֵ/עָלָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/008.yaml
  text: He waited seven days[a], until the appointed time that Samuel had set, but Samuel did not come to Gilgal[b], and the people were scattering from him.
  footnotes:
  - marker: a
    text: Or 'until the appointed time that Samuel had appointed.' The Hebrew relative clause is compressed, and English must supply the implied sense.
    reason: lexical_alternative
  - marker: b
    text: That is, the people were slipping away from Saul.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 정해진 때까지[a] 칠 일을 기다렸습니다. 그런데 사무엘은 길갈로 오지 않았고[b], 백성은 그의 곁에서 흩어지고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사무엘이 정해 둔 때까지’라는 뜻입니다. 히브리어 관계절이 압축되어 있어 한국어에서는 뜻을 풀어 줍니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 백성은 사울에게서 빠져나가고 있었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיחֶל
  english_pob_choice: He waited
  chosen_korean: 기다렸습니다
  alternatives_korean:
  - 머물렀습니다
  - 기다리고 있었습니다
  lexicon: HALOT
  rationale: 기한을 두고 시간을 보내는 뜻이므로, 문맥에 맞게 ‘기다리다’로 옮겼습니다.
- source_word: שִׁבְעַת יָמִים
  english_pob_choice: seven days
  chosen_korean: 칠 일
  alternatives_korean:
  - 일곱 날
  - 7일
  lexicon: HALOT
  rationale: 히브리어의 기간 표현을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: לַ/מּוֹעֵד אֲשֶׁר שְׁמוּאֵל
  english_pob_choice: until the appointed time that Samuel had set
  chosen_korean: 정해진 때까지
  alternatives_korean:
  - 사무엘이 정한 때까지
  - 사무엘이 지정한 때까지
  lexicon: HALOT
  rationale: 문장이 압축되어 있어 ‘사무엘이 정한’이라는 뜻을 풀어 주되, 과도한 설명은 피하고 시간적 의미를 앞세웠습니다.
- source_word: מֵ/עָלָיו
  english_pob_choice: from him
  chosen_korean: 그의 곁에서
  alternatives_korean:
  - 그에게서
  - 그로부터
  lexicon: HALOT
  rationale: 대명사 지시 대상은 사울이지만, 한국어에서는 군중이 ‘곁을 떠나다’로 풀어야 의미가 자연스럽고, POB의 ‘slipping away’ 뉘앙스도 살릴 수 있습니다.
theological_decisions:
- issue: 백성이 ‘흩어지다’의 의미
  chosen_reading: 군대가 단순히 한 번에 도망간 것이 아니라, 압박 속에서 점차 사울에게서 이탈하고 있음을 나타냈습니다.
  alternative_readings:
  - 백성이 흩어졌습니다
  - 백성이 도망갔습니다
  rationale: 히브리어 동사는 분산·이탈의 진행상을 띠므로, 진행형 표현으로 긴장감을 보존했습니다.
  doctrine_reference: 서사 문맥 보존
