source:
  edition: WLC
  text: וְ/חָרָשׁ֙ לֹ֣א יִמָּצֵ֔א בְּ/כֹ֖ל אֶ֣רֶץ יִשְׂרָאֵ֑ל כִּֽי אמר פְלִשְׁתִּ֔ים פֶּ֚ן יַעֲשׂ֣וּ הָ/עִבְרִ֔ים חֶ֖רֶב א֥וֹ חֲנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/019.yaml
  text: Now no blacksmith could be found in all the land of Israel[a], because the Philistines said, “Otherwise the Hebrews will make swords or spears.”
  footnotes:
  - marker: a
    text: Or “lest the Hebrews make a sword or a spear.” The Hebrew uses singular nouns generically, and פֶּן can be rendered more formally as “lest.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 이스라엘 온 땅에서 대장장이를 찾을 수 없었으니[a], 이는 블레셋 사람들이 「그렇지 않으면 히브리 사람들은 칼이나 창을 만들 것이다」라고 말했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “히브리 사람들이 칼 하나나 창 하나를 만들지 못하게 하려고.” 히브리어는 명사를 단수형으로 일반적으로 사용하며, פֶּן은 더 형식적으로는 “~하지 않도록” 또는 “~할까 하여”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרָשׁ
  english_pob_choice: blacksmith
  chosen_korean: 대장장이
  alternatives_korean:
  - 장인
  - 쇠장인
  - 금속세공인
  lexicon: HALOT
  rationale: 군사적 맥락에서 무기 제작과 연장을 다룰 수 있는 금속 기술자를 가리키므로, 일반적인 ‘장인’보다 ‘대장장이’가 문맥을 가장 분명하게 드러냅니다.
- source_word: יִמָּצֵא
  english_pob_choice: could be found
  chosen_korean: 찾을 수 없었으니
  alternatives_korean:
  - 발견될 수 없었으니
  - 있지 않았으니
  lexicon: HALOT
  rationale: 수동적 ‘발견되다/있다’의 부재를 한국어로 자연스럽게 옮기되, 실제로는 그런 사람이 존재하지 않는 상황을 나타내도록 했습니다.
- source_word: הָעִבְרִים
  english_pob_choice: the Hebrews
  chosen_korean: 히브리 사람들
  alternatives_korean:
  - 히브리인들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 원문이 외부자적 호칭인 ‘히브리 사람들’을 사용하므로, 이를 ‘이스라엘 사람들’로 평탄화하지 않고 그대로 살렸습니다.
- source_word: פֶּן
  english_pob_choice: Otherwise
  chosen_korean: 그렇지 않으면
  alternatives_korean:
  - 혹시
  - ~하지 않도록
  lexicon: HALOT
  rationale: 예방적 우려를 나타내는 פֶּן을 현대 한국어에서 자연스럽고 명확한 ‘그렇지 않으면’으로 옮겼습니다.
theological_decisions:
- issue: 블레셋 사람들의 통제 의도와 무기 생산 금지의 강조
  chosen_reading: 이 절은 단순한 기술 부족이 아니라, 블레셋이 이스라엘의 무장 가능성을 의도적으로 차단한 조치로 읽었습니다.
  alternative_readings:
  - 단순한 경제적 통제
  - 일반적 행정 규제
  rationale: 문맥상 이유절이 ‘히브리 사람들이 칼이나 창을 만들지 못하게 하려는’ 군사적 예방책을 분명히 밝히므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 역사서 문맥 이해
