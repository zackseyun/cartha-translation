base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/019.yaml
  text: Now no blacksmith could be found in all the land of Israel[a], because the Philistines said, “Otherwise the Hebrews will make swords or spears.”
  footnotes:
  - marker: a
    text: Or “lest the Hebrews make a sword or a spear.” The Hebrew uses singular nouns generically, and פֶּן can be rendered more formally as “lest.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 온 땅에는 대장장이가 한 사람도 없었습니다.[a] 블레셋 사람들이 “히브리 사람들이 칼이나 창을 만들까 하여”라고 말했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그렇지 않으면 히브리 사람들이 칼이나 창을 만들 것이다.” 히브리어는 ‘칼’과 ‘창’을 단수형으로 일반적으로 사용하며, פֶּן은 더 직역하면 “~할까 하여” 또는 “~하지 않도록”이라는 예방적 우려를 나타냅니다.
    reason: lexical_alternative
