source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/הַעֲל֣וֹת הָ/עֹלָ֔ה וְ/הִנֵּ֥ה שְׁמוּאֵ֖ל בָּ֑א וַ/יֵּצֵ֥א שָׁא֛וּל לִ/קְרָאת֖/וֹ לְ/בָרֲכֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/010.yaml
  text: And it happened[a], as soon as he had finished offering up the burnt offering, that behold, Samuel came. And Saul went out to meet him, to bless him.
  footnotes:
  - marker: a
    text: Or 'to greet him' / 'to salute him.' The Hebrew verb literally means 'to bless,' but in this meeting context it may function as a formal greeting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 번제 드리기를 마치자마자, 보십시오, 사무엘이 왔습니다. 사울은 그를 맞으러 나가 그에게 복을 빌었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘복을 빌었습니다’는 히브리어 동사 ‘축복하다’의 직역이지만, 이 만남의 맥락에서는 공식 인사로 기능할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그가 ... 했습니다
  alternatives_korean:
  - 그리고 일이 있었습니다
  - 그때
  lexicon: WLC/HALOT
  rationale: 히브리어 서술 전환용 wayyiqtol을 한국어에서는 자연스러운 사건 전개로 풀어, 구어적이지만 무난한 합쇼체 서술로 옮겼습니다.
- source_word: כְכַלֹּתוֹ לְהַעֲלוֹת הָעֹלָה
  english_pob_choice: as soon as he had finished offering up the burnt offering
  chosen_korean: 번제 드리기를 마치자마자
  alternatives_korean:
  - 번제를 드리기를 마치자
  - 번제 올리기를 끝내자마자
  lexicon: WLC/HALOT
  rationale: כְּ + 완료 동작은 즉시성을 강하게 나타내므로 ‘마치자마자’로 옮겼고, לְהַעֲלוֹת הָעֹלָה의 제사적 표현은 ‘번제 드리다’로 자연스럽게 살렸습니다.
- source_word: וְהִנֵּה
  english_pob_choice: that behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그런데
  lexicon: WLC/HALOT
  rationale: 서술의 급작스러운 전환과 시각적 강조를 살리기 위해 감탄적 주의 환기 표현을 사용했습니다.
- source_word: לְבָרֲכוֹ
  english_pob_choice: to bless him
  chosen_korean: 그에게 복을 빌었습니다
  alternatives_korean:
  - 그를 축복하려고 했습니다
  - 그에게 복 주기를 바라며
  lexicon: WLC/HALOT
  rationale: ברך의 직역인 ‘복을 빌다’를 택해, 문맥상 공식 인사인지 실제 축복인지를 열어 두면서도 동사의 어휘적 형태를 보존했습니다.
theological_decisions:
- issue: לְבָרֲכוֹ의 의미 범위
  chosen_reading: ‘축복’으로 단정하지 않고, 문맥상 가능한 공식 인사 기능을 열어 둔 ‘복을 빌었습니다’로 번역했습니다.
  alternative_readings:
  - 그에게 복을 주었습니다
  - 그를 축복했습니다
  - 그에게 인사했습니다
  rationale: 히브리어 동사 ברך는 문자적으로는 ‘복 주다/축복하다’이지만, 대면 인사 맥락에서는 정중한 인사 기능으로도 쓰일 수 있어, 본문의 긴장을 지우지 않는 표현이 적절합니다.
  doctrine_reference: 본문의 어휘적 중의성 보존
