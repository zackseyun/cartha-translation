revisions:
- from: 그가 번제 드리기를 마치자마자, 보십시오, 사무엘이 왔습니다. 사울은 그를 맞으러 나가 그에게 복을 빌었습니다.[a]
  to: 사울이 번제를 드리기를 마치자마자, 보십시오, 사무엘이 왔습니다. 사울은 그를 맞아 축복하려고 나갔습니다.[a]
  rationale: The revision explicitly identifies Saul, retains the vivid notice of Samuel’s arrival, and—most importantly—renders the final Hebrew infinitive as Saul’s purpose in going out. ‘축복하다’ preserves the lexical sense of ברך, while the footnote records the contextually plausible greeting nuance.
  reviewer_model: gpt-5.6-terra
