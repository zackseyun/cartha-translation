  text: And raiders came out from the camp of the Philistines in three companies[a]. One company turned toward the road to Ophrah[b], toward the land of Shual.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the destroyer' or 'the destroying force'; here it refers to a raiding party from the Philistine camp.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'three heads' ... 'one head,' an idiom for military divisions or bands.
    reason: lexical_alternative
translation:
  language: ko
  text: 블레셋 사람들의 진영에서 약탈 부대가[a] 세 무리로[b] 나왔습니다. 그중 한 무리는 오브라로 가는 길을 따라 수알 땅 쪽으로 향했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘파괴하는 자’ 또는 ‘파괴하는 힘’입니다. 여기서는 블레셋 진영에서 나온 약탈 부대를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 문자적으로 ‘세 머리’와 ‘한 머리’입니다. 이는 군사적 부대나 무리를 가리키는 관용적 표현입니다.
    reason: lexical_alternative
