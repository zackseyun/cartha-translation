- source_word: פְלִשְׁתִּים / עָפְרָה / שׁוּעָל
  english_pob_choice: the Philistines / Ophrah / the land of Shual
  chosen_korean: 블레셋 사람들 / 오브라 / 수알
  alternatives_korean:
  - 블레셋인들 / 오브라 / 수알
  - 블레셋 사람들 / 오브라 / 수알 땅
  lexicon: HALOT
  rationale: 인명과 지명은 통용되는 음역을 따랐고, ‘아레츠’는 뒤의 ‘땅’으로 처리해 지역 지칭을 살렸습니다.
