  text: וַ/יֵּצֵ֧א הַ/מַּשְׁחִ֛ית מִ/מַּחֲנֵ֥ה פְלִשְׁתִּ֖ים שְׁלֹשָׁ֣ה רָאשִׁ֑ים הָ/רֹ֨אשׁ אֶחָ֥ד יִפְנֶ֛ה אֶל דֶּ֥רֶךְ עָפְרָ֖ה אֶל אֶ֥רֶץ שׁוּעָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/017.yaml
  text: And raiders came out from the camp of the Philistines in three companies[a]. One company turned toward the road to Ophrah[b], toward the land of Shual.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the destroyer' or 'the destroying force'; here it refers to a raiding party from the Philistine camp.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'three heads' ... 'one head,' an idiom for military divisions or bands.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 약탈자들이 블레셋 사람들의 진영에서 세 갈래로 나와 나갔습니다[a]. 그중 한 갈래는 오브라로 가는 길[b]과 수알 땅을 향해 돌았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 원문은 문자적으로는 ‘파괴하는 자/파괴하는 힘’에 가깝지만, 여기서는 블레셋 진영에서 나온 약탈 부대를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘세 머리’와 ‘한 머리’는 군사적 분대나 무리를 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁחִית
  english_pob_choice: raiders
  chosen_korean: 약탈자들
  alternatives_korean:
  - 파괴하는 자들
  - 파괴하는 무리
  - 노략꾼들
  lexicon: HALOT
  rationale: 이 명사는 여기서 블레셋 진영에서 나오는 공격적 침입 집단을 가리키므로, 직역보다 군사적 상황을 살린 ‘약탈자들’이 자연스럽고 의미를 잘 드러냅니다.
- source_word: שְׁלֹשָׁה רָאשִׁים / הָרֹאשׁ אֶחָד
  english_pob_choice: in three companies / one company
  chosen_korean: 세 갈래 / 한 갈래
  alternatives_korean:
  - 세 무리 / 한 무리
  - 세 부대 / 한 부대
  - 세 대열 / 한 대열
  lexicon: HALOT
  rationale: ‘머리’라는 문자적 표현은 군사적 분단을 뜻하는 관용구이므로, 한국어에서는 반복 구조를 살리면서도 자연스러운 ‘갈래’로 옮겼습니다.
- source_word: דֶּרֶךְ עָפְרָה
  english_pob_choice: the road to Ophrah
  chosen_korean: 오브라로 가는 길
  alternatives_korean:
  - 오브라의 길
  - 오브라를 향한 길
  lexicon: HALOT
  rationale: דֶּרֶךְ는 여기서 경로나 길을 뜻하므로, 지명 앞에 ‘가는 길’을 붙여 이동 방향을 분명하게 했습니다.
- source_word: פְלִשְׁתִּים / עָפְרָה / שׁוּעָל
  english_pob_choice: the Philistines / Ophrah / the land of Shual
  chosen_korean: 블레셋 사람들 / 오브라 / 수알
  alternatives_korean:
  - 블레셋인들 / 오브라 / 수알
  - 블레셋 사람들 / 오브라 / 수알 땅
  lexicon: HALOT
  rationale: 인명과 지명은 통용되는 음역을 따랐고, ‘아레츠’는 뒤의 ‘땅’으로 처리해 지역 지칭을 살렸습니다.
