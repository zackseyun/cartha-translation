source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל הַגִּ֣שׁוּ אֵלַ֔/י הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יַּ֖עַל הָ/עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/009.yaml
  text: So Saul said[b][a], “Bring near to me the burnt offering and the peace offerings.” And he offered up the burnt offering.
  footnotes:
  - marker: a
    text: Or “and the fellowship offerings.” The Hebrew term can denote offerings associated with peace, well-being, or shared fellowship.
    reason: lexical_alternative
  - marker: b
    text: The final clause most naturally means that Saul himself offered the burnt offering; some understand it more indirectly as having the offering presented.
    reason: alternative_reading
translation:
  language: ko
  text: 사울이 말했습니다. 「제물과 화목제물을 내게로 가져오십시오.」 그리고 그가 번제물을 드렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화목제물’은 히브리어 שלמים의 일반적 번역입니다. 이 말은 평화, 안녕, 공동의 교제와 관련된 제물을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 사울이 직접 번제물을 드렸다는 뜻으로 가장 자연스럽게 읽힙니다. 다만 더 간접적으로, 그 제물이 드려지게 했다는 뜻으로 이해하는 견해도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַגִּשׁוּ אֵלַי
  english_pob_choice: Bring near to me
  chosen_korean: 내게로 가져오십시오
  alternatives_korean:
  - 내게로 가까이 가져오십시오
  - 내게 바치십시오
  lexicon: HALOT
  rationale: 명령형의 제의적 뉘앙스를 살리면서 자연스러운 현대 한국어로 옮겼습니다. ‘가까이’는 원문의 ‘bring near’ 의미를 반영하지만 한국어에서는 다소 중첩되어, ‘내게로 가져오십시오’가 가장 간결합니다.
- source_word: הָעֹלָה
  english_pob_choice: the burnt offering
  chosen_korean: 번제물
  alternatives_korean:
  - 번제
  - 번제 제물
  lexicon: HALOT
  rationale: עֹלָה는 제의 용어로서 ‘번제’가 핵심 의미이지만, 문맥상 실제로 가져오고 드리는 대상이므로 ‘번제물’이 더 분명합니다.
- source_word: וְהַשְּׁלָמִים
  english_pob_choice: the peace offerings
  chosen_korean: 화목제물
  alternatives_korean:
  - 화목제
  - 평화제물
  - 평화제
  lexicon: HALOT
  rationale: POB의 영어 주석이 ‘peace offerings’와 ‘fellowship offerings’ 가능성을 함께 남겨 두었지만, 한국어에서는 제의 항목을 자연스럽게 가리키는 ‘화목제물’이 가장 적절합니다.
- source_word: וַיַּעַל הָעֹלָה
  english_pob_choice: And he offered up the burnt offering
  chosen_korean: 그리고 그가 번제물을 드렸습니다
  alternatives_korean:
  - 그리고 그가 번제물을 바쳤습니다
  - 그리고 그가 번제를 드렸습니다
  lexicon: HALOT
  rationale: עלה는 제의 문맥에서 ‘드리다/바치다’의 관용적 의미이므로 직역보다 한국어 제의 표현을 살렸습니다. ‘드렸습니다’는 주어의 직접 행위를 자연스럽게 표현합니다.
theological_decisions:
- issue: 사울의 제사 행위의 직접성
  chosen_reading: 사울이 직접 번제물을 드렸다는 뜻으로 번역했습니다.
  alternative_readings:
  - 사울이 번제물이 드려지도록 하게 했다는 뜻으로 완화할 수 있습니다.
  rationale: 영어 POB 주석이 말하듯 간접 사역 해석도 가능하지만, 문맥의 가장 자연스러운 읽기는 사울 자신의 행위입니다. 따라서 본문이 암시하는 책임을 약화하지 않았습니다.
  doctrine_reference: 본문 주해상의 서술적 판단
