source:
  edition: WLC
  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֤ל רָאוּ֙ כִּ֣י צַר ל֔/וֹ כִּ֥י נִגַּ֖שׂ הָ/עָ֑ם וַ/יִּֽתְחַבְּא֣וּ הָ/עָ֗ם בַּ/מְּעָר֤וֹת וּ/בַֽ/חֲוָחִים֙ וּ/בַ/סְּלָעִ֔ים וּ/בַ/צְּרִחִ֖ים וּ/בַ/בֹּרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/006.yaml
  text: When the men of Israel saw that they were in trouble[a], because the people were hard pressed, the people hid themselves in caves, in thickets, among rocks, in strongholds[c][b], and in pits.
  footnotes:
  - marker: a
    text: Or 'among thornbushes' for 'in thickets'; the Hebrew term is rare and may refer specifically to thorny brush.
    reason: lexical_alternative
  - marker: b
    text: Or 'in underground chambers' or 'in holes' for 'in cellars'; the Hebrew term is uncertain and may refer to subterranean hiding places.
    reason: lexical_alternative
  - marker: c
    text: Or 'in cisterns' for 'in pits.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 사람들이 백성이 심한 압박을 받고 있어 자기들이 곤경에 처한 것을 보자, 백성은 굴과 덤불[a]과 바위들 사이와 지하 은신처[b]와 구덩이들 속으로 숨어들었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가시덤불 속에’; 히브리어는 희귀어로, 특히 가시가 많은 덤불을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지하 공간들에’, ‘구멍들에’, 또는 ‘요새들에’; 히브리어 단어의 뜻은 불확실하며 지하의 숨을 곳을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘저수조들에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  english_pob_choice: the men of Israel
  chosen_korean: 이스라엘 사람들이
  alternatives_korean:
  - 이스라엘의 남자들이
  - 이스라엘 각 사람이
  lexicon: HALOT
  rationale: 히브리어 איש은 단수형이지만 집합적으로 쓰였고, 뒤의 복수 동사와 함께 전체 집단을 가리킵니다. 한국어에서는 자연스러운 집합 표현으로 옮기되, 성별·집합성의 흔적을 유지하기 위해 ‘사람들이’를 택했습니다.
- source_word: צַר לוֹ
  english_pob_choice: that they were in trouble
  chosen_korean: 자기들이 곤경에 처한 것을
  alternatives_korean:
  - 그가 곤경에 처한 것을
  - 그들에게 환난이 닥친 것을
  lexicon: HALOT
  rationale: 문맥상 집단이 느낀 위기를 가리키므로 한국어는 복수 감각을 드러내는 것이 자연스럽습니다. POB의 ‘in trouble’은 직역보다 상황의 압박을 드러내는 ‘곤경에 처하다’가 가장 가깝습니다.
- source_word: וַיִּתְחַבְּאוּ
  english_pob_choice: hid themselves
  chosen_korean: 숨어들었습니다
  alternatives_korean:
  - 몸을 숨겼습니다
  - 자신들을 숨겼습니다
  lexicon: HALOT
  rationale: 히트파엘의 반사적 뉘앙스를 살리면서도 한국어에서 자연스럽고 서술적인 표현으로 옮겼습니다. 단순히 ‘숨었습니다’보다 능동적 은폐 행위를 더 잘 드러냅니다.
- source_word: בַּחֲוָחִים
  english_pob_choice: in thickets
  chosen_korean: 덤불
  alternatives_korean:
  - 가시덤불
  - 떨기나무
  lexicon: HALOT
  rationale: 희귀어라서 정확한 식별이 불확실하므로 POB의 ‘thickets’에 맞춰 넓은 범주의 식생 표현을 택했습니다. 더 구체적인 ‘가시덤불’은 주석에서 가능한 대안을 처리하는 편이 적절합니다.
- source_word: וּבַצְּרִחִים
  english_pob_choice: in strongholds
  chosen_korean: 은신처
  alternatives_korean:
  - 지하실
  - 지하 공간
  - 요새
  lexicon: HALOT
  rationale: 이 어형은 의미가 불확실하지만, POB의 개정 반영과 문맥상 숨는 장소라는 기능을 고려하면 ‘은신처’가 가장 안전합니다. 특정 건축물로 한정하는 번역은 본문이 보장하지 않는 정보를 더할 수 있습니다.
- source_word: וּבַבֹּרוֹת
  english_pob_choice: in pits
  chosen_korean: 구덩이들 속으로
  alternatives_korean:
  - 구덩이들에
  - 우물들 속으로
  - 저수조들 속으로
  lexicon: HALOT
  rationale: בּוֹר는 일반적으로 구덩이, 웅덩이, 저수조를 가리킬 수 있지만, 여기서는 숨는 장소의 연속이므로 가장 넓은 ‘구덩이’가 적합합니다. 복수성과 내부성을 살려 ‘들 속으로’라고 옮겼습니다.
theological_decisions:
- issue: 군사적 압박 속에서의 집단적 공포 묘사
  chosen_reading: 본문은 개인적 심리보다 공동체 전체가 압박을 받아 도피하는 상황을 강조하는 것으로 옮겼습니다.
  alternative_readings:
  - 개별 병사들의 공포를 강조하는 읽기
  - 정치적 억압의 뉘앙스를 더 강하게 드러내는 읽기
  rationale: 히브리어의 복수 동사와 반복되는 집단 명사는 이스라엘 진영 전체의 붕괴감을 전달합니다. 따라서 번역도 집단적 위기와 은신을 전면에 두었습니다.
  doctrine_reference: 서사 본문의 문맥적 의미와 집단적 책임/위기 묘사
