  yaml_path: translation/ot/1_samuel/013/013.yaml
  text: And Samuel said to Saul[a], “You have acted foolishly. You have not kept the command of Yahweh your God, which he commanded you; for now Yahweh would have established your kingdom over Israel forever.”
  footnotes:
  - marker: a
    text: Or, “You have done foolishly.”
    reason: lexical_alternative
translation:
  language: ko
  text: 사무엘이 사울에게 말했습니다[a]. “당신은 어리석게 행동했습니다. 당신은 야훼, 네 하나님께서 네게 명령하신 명령을 지키지 않았습니다. 이제 야훼께서는 네가 이스라엘을 다스리는 왕국을 영원히 굳게 세워 주셨을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “당신은 어리석은 짓을 했습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִסְכָּלְתָּ
  english_pob_choice: You have acted foolishly
  chosen_korean: 어리석게 행동했습니다
  alternatives_korean:
  - 어리석은 짓을 했습니다
  - 어리석게 했습니다
  lexicon: HALOT
  rationale: נִסְכָּלְתָּ는 단순한 상태보다 어리석은 행위 자체를 가리키므로, 현대 한국어에서는 ‘어리석게 행동했습니다’가 의미를 가장 자연스럽게 보존합니다.
- source_word: שָׁמַרְתָּ אֶת מִצְוַת
  english_pob_choice: You have not kept the command
  chosen_korean: 명령을 지키지 않았습니다
  alternatives_korean:
  - 계명을 지키지 않았습니다
  - 명령을 준수하지 않았습니다
  lexicon: HALOT
  rationale: שׁמר는 ‘지키다/보존하다/준수하다’의 뜻이며, כאן은 언약적 맥락의 구체적 명령이므로 ‘지키지 않았습니다’가 가장 직접적입니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 여호와 당신의 하나님
  - 주 당신의 하나님
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기준에 따라 ‘야훼’로 옮기고, אֱלֹהֶיךָ는 소유격 관계를 살려 ‘당신의 하나님’으로 번역했습니다.
- source_word: כִּי עַתָּה הֵכִין יְהוָה
  english_pob_choice: for now Yahweh would have established
  chosen_korean: 이제 야훼께서 ... 세우셨을 것입니다
  alternatives_korean:
  - 이제 야훼께서 ... 확고하게 하셨을 것입니다
  - 지금 야훼께서 ... 세우셨을 것입니다
  lexicon: HALOT
  rationale: הֵכִין은 ‘세우다/확립하다’의 뜻으로, 왕국을 확립하는 표현이므로 ‘세우셨을 것입니다’가 문맥상 가장 자연스럽습니다.
- source_word: מַמְלַכְתְּךָ אֶל יִשְׂרָאֵל
  english_pob_choice: your kingdom over Israel
  chosen_korean: 당신의 왕국을 이스라엘 위에
  alternatives_korean:
  - 당신의 나라를 이스라엘 위에
  - 당신의 왕권을 이스라엘 위에
  lexicon: HALOT
  rationale: מַמְלָכָה는 여기서 통치 영역을 가리키므로 ‘왕국’이 적절하며, אֶל과 결합한 지배 관계는 한국어에서 ‘~위에’로 옮기는 것이 자연스럽습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יהוה를 고유명사로 드러내기 위해 ‘야훼’를 유지했습니다. 이는 제목어 ‘주’로 치환해 이름의 식별성을 흐리는 것을 피합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 반사실적 의미의 전달
  chosen_reading: 이제 야훼께서 당신의 왕국을 이스라엘 위에 영원히 세우셨을 것입니다
  alternative_readings:
  - 이제 야훼께서 당신의 왕국을 이스라엘 위에 영원히 세우셨습니다
  - 이제 야훼께서 당신의 왕국을 이스라엘 위에 영원히 세우실 것입니다
  rationale: 문맥상 사울의 불순종으로 인해 상실된 가능성을 말하므로, 실제 완료가 아니라 ‘would have established’의 반사실적 뜻을 한국어 조건/가정의 뉘앙스로 살렸습니다.
  doctrine_reference: English POB theological decision on counterfactual force
