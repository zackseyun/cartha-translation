base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/007.yaml
  text: And Hebrews crossed over the Jordan into the land of Gad and Gilead[a]. But Saul was still at Gilgal[b], and all the people trembled behind him.
  footnotes:
  - marker: a
    text: Or 'Israelites' for 'Hebrews'; the Hebrew text uses 'Hebrews,' which may reflect a more ethnically marked designation in this narrative context.
    reason: lexical_alternative
  - marker: b
    text: Or 'following him' for 'behind him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 히브리인들은 요단을 건너 갓과 길르앗 땅에 이르렀습니다[a]. 그러나 사울은 여전히 길갈에 있었고, 모든 백성은 그의 뒤에서 떨었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이스라엘인들'로도 옮길 수 있습니다. 히브리어 본문은 '히브리인들'을 사용하며, 이 서술에서는 더 민족표지적인 호칭을 반영한 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그를 따라'로도 옮길 수 있습니다. כאן의 אַחֲרָיו는 공간적으로 '뒤에서'를 뜻할 수도 있고, '따라서'의 의미로도 읽을 수 있습니다.
    reason: lexical_alternative
