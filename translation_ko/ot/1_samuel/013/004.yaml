base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/004.yaml
  text: And all Israel heard it said[a], “Saul has struck down the Philistine garrison[c][b], and Israel has also become odious to the Philistines.” Then the people were called out to join Saul at Gilgal.
  footnotes:
  - marker: a
    text: Or “the Philistine prefect/governor” or “the Philistine outpost.” The Hebrew term can refer either to an official or to a stationed garrison; the military context favors “garrison.”
    reason: lexical_alternative
  - marker: b
    text: Literally “Israel had become a stench to the Philistines,” an idiom meaning Israel had become detestable or odious to them.
    reason: lexical_alternative
  - marker: c
    text: Or “the people were called together after Saul at Gilgal.” The Hebrew expression likely refers to mustering the people to follow Saul in battle.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 이스라엘이 전하여 듣고 이르기를 “사울이 블레셋 초소를 쳤고, 이스라엘은 또한 블레셋 사람들에게 미움을 받게 되었다” 하였으며, 백성은 길갈에서 사울을 따라 모여들었습니다.[a][b][c]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘블레셋 초소’는 히브리어가 행정관직이나 주둔 거점을 가리킬 수 있어서, 문맥상 군사 거점을 우선 반영한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 “이스라엘이 블레셋에게 악취가 되었다”는 관용구로, ‘미움을 받게 되었다’는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 “백성이 사울 뒤에 모여들었다” 또는 “길갈에서 사울과 함께 소집되었다”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְצִיב פְּלִשְׁתִּים
  english_pob_choice: Philistine garrison / prefect-governor / outpost
  chosen_korean: 블레셋 초소
  alternatives_korean:
  - 블레셋 수비대
  - 블레셋 총독
  - 블레셋 주둔지
  lexicon: נציב
  rationale: 군사적 문맥상 ‘초소’로 옮기면 주둔한 거점이라는 뜻을 살리면서도, 본문이 꼭 행정관 직함만을 말한다고 단정하지 않게 합니다.
- source_word: נִבְאַשׁ
  english_pob_choice: became odious / became a stench
  chosen_korean: 미움을 받게 되었다
  alternatives_korean:
  - 악취가 나게 되었다
  - 역겨운 존재가 되었다
  - 가증스럽게 되었다
  lexicon: באש
  rationale: 히브리어 관용구의 강한 혐오감을 살리되, 한국어에서 자연스럽고 의미가 분명한 표현으로 옮겼습니다.
- source_word: וַיִּצָּעֲק֥וּ הָעָ֛ם אַחֲרֵ֥י שָׁא֖וּל
  english_pob_choice: Then the people were called out to join Saul / gathered after Saul
  chosen_korean: 백성은 … 사울을 따라 모여들었습니다
  alternatives_korean:
  - 백성이 사울 뒤로 불려 모였습니다
  - 백성이 사울을 따라 전장으로 모였습니다
  lexicon: צעק
  rationale: 동사가 수동적으로 ‘불려 모이다’의 뉘앙스를 가지므로, 사울을 중심으로 집결했다는 의미를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 이스라엘이 블레셋에게 ‘미움을 받게 되었다’는 표현의 수위
  chosen_reading: 직설적인 혐오/적대감을 유지하여, 정치·군사적 갈등이 본문에 분명히 드러나도록 했습니다.
  alternative_readings:
  - 완곡하게 ‘관계가 악화되었다’고 낮추는 번역
  - ‘블레셋에게 역겨운 존재가 되었다’처럼 더 직역하는 번역
  rationale: 본문은 단순한 외교적 긴장보다 더 강한 적대감을 말하므로, 그 긴장을 희석하지 않는 번역이 필요합니다.
  doctrine_reference: 본문-의미 보존 원칙
