id: 1SA.13.18
reference: 1 Samuel 13:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ/רֹ֤אשׁ אֶחָד֙ יִפְנֶ֔ה דֶּ֖רֶךְ בֵּ֣ית חֹר֑וֹן וְ/הָ/רֹ֨אשׁ אֶחָ֤ד יִפְנֶה֙ דֶּ֣רֶךְ הַ/גְּב֔וּל הַ/נִּשְׁקָ֛ף עַל גֵּ֥י הַצְּבֹעִ֖ים הַ/מִּדְבָּֽרָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/018.yaml
  text: and one company turned toward the road to Beth-horon[a], and one company turned toward the road of the border that overlooks the Valley of Zeboim[b], toward the wilderness.
  footnotes:
  - marker: a
    text: Or 'one division' or 'one detachment'; literally 'one head.'
    reason: lexical_alternative
  - marker: b
    text: '''Zeboim'' is likely a place name; the underlying term may be related to ''hyenas.'''
    reason: cultural_note
translation:
  language: ko
  text: 그리고 한 부대[a]는 벧호론으로 가는 길을 향해 방향을 틀었고, 또 한 부대는 스보임 골짜기[b]를 내려다보는 경계의 길을 향해, 광야 쪽으로 방향을 틀었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘한 머리’입니다. 이 군사 문맥에서는 한 무리의 습격대 또는 부대를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘스보임’은 지명으로 보입니다. 이 이름은 ‘하이에나들’과 관련이 있을 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/הָ/רֹ֤אשׁ אֶחָד֙
  english_pob_choice: one company
  chosen_korean: 한 부대
  alternatives_korean:
  - 한 무리
  - 한 분대
  - 한 군단
  lexicon: HALOT
  rationale: 군사적 맥락에서 רֹאשׁ은 문자적으로는 ‘머리’이지만, 여기서는 하나의 이동 부대를 가리키므로 현대 한국어의 자연스러운 군사 단위인 ‘부대’로 옮겼습니다.
- source_word: יִפְנֶ֔ה דֶּ֖רֶךְ
  english_pob_choice: turned toward the road
  chosen_korean: 가는 길로 ... 돌았습니다
  alternatives_korean:
  - 길로 향했습니다
  - 길 쪽으로 돌아갔습니다
  - 길로 방향을 틀었습니다
  lexicon: HALOT
  rationale: פנה의 방향 전환 의미를 살리면서, ‘길로 돌았습니다’로 이동의 방향성을 자연스럽게 표현했습니다.
- source_word: בֵּ֣ית חֹר֑וֹן
  english_pob_choice: Beth-horon
  chosen_korean: 벧호론
  alternatives_korean:
  - 베스호론
  - 벧 호론
  lexicon: 고유명사 표기
  rationale: 성경 지명으로 널리 쓰이는 음역을 따르되, 현대 표기 관행에 맞춰 붙여 썼습니다.
- source_word: הַ/גְּב֔וּל הַ/נִּשְׁקָ֛ף עַל
  english_pob_choice: the border that overlooks
  chosen_korean: 내려다보는 경계의
  alternatives_korean:
  - 내려다보는 경계선의
  - 위에서 굽어보는 경계의
  - 가장자리의
  lexicon: HALOT
  rationale: נשקף의 ‘위에서 내려다보다/굽어보다’ 의미를 보존하기 위해 ‘내려다보는’으로 옮기고, גְּבוּל은 지형적 ‘경계’로 표현했습니다.
- source_word: גֵּ֥י הַצְּבֹעִ֖ים
  english_pob_choice: the Valley of Zeboim
  chosen_korean: 지브임 골짜기
  alternatives_korean:
  - 세보임 골짜기
  - 지브임 계곡
  - 하이에나 골짜기
  lexicon: HALOT
  rationale: 문맥상 지명으로 기능하므로 음역을 유지했고, 일반적인 ‘골짜기’로 지형을 자연스럽게 전달했습니다.
- source_word: הַ/מִּדְבָּרָ/ה
  english_pob_choice: toward the wilderness
  chosen_korean: 광야 쪽으로
  alternatives_korean:
  - 광야로
  - 광야를 향하여
  - 들판 쪽으로
  lexicon: HALOT
  rationale: 방향 접미사의 이동 뉘앙스를 살리면서도 한국어에서 가장 간결한 방향 표현인 ‘쪽으로’를 사용했습니다.
