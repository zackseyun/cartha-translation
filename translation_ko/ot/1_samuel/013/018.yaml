  source_fidelity: 두 차례의 군사 부대가 각각 방향을 튼다는 기본 의미와 지명, 광야를 향하는 방향성은 대체로 반영했습니다. 그러나 현 문장은 두 번째 부대의 ‘광야 쪽으로’가 문장 끝에 느슨하게 놓여 수식 관계가 불분명하고, ‘지브임’은 통용 성경 지명 표기인 ‘스보임’으로 고치는 것이 적절합니다.
