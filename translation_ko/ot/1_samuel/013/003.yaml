source:
  edition: WLC
  text: וַ/יַּ֣ךְ יוֹנָתָ֗ן אֵ֣ת נְצִ֤יב פְּלִשְׁתִּים֙ אֲשֶׁ֣ר בְּ/גֶ֔בַע וַֽ/יִּשְׁמְע֖וּ פְּלִשְׁתִּ֑ים וְ/שָׁאוּל֩ תָּקַ֨ע בַּ/שּׁוֹפָ֤ר בְּ/כָל הָ/אָ֨רֶץ֙ לֵ/אמֹ֔ר יִשְׁמְע֖וּ הָ/עִבְרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/003.yaml
  text: Jonathan struck down the Philistine garrison that was at Geba[a], and the Philistines heard of it. Then Saul blew the ram's horn throughout all the land, saying[b], “Let the Hebrews hear!”
  footnotes:
  - marker: a
    text: Or 'the Philistine prefect/governor'; the Hebrew term can denote either an official or a stationed military post. In this context, 'garrison' best fits the battle setting.
    reason: lexical_alternative
  - marker: b
    text: Or 'blew the trumpet'; Hebrew shofar refers specifically to a horn, traditionally a ram's horn.
    reason: cultural_note
translation:
  language: ko
  text: 요나단이 게바에 있던 블레셋 수비대를 쳐서 무찔렀습니다[a]. 그러자 블레셋 사람들이 그 소식을 듣고, 사울은 온 땅에 나팔을 불며[b] 말했습니다. 「히브리 사람들은 들으십시오!」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘블레셋 지방관/총독’으로도 옮길 수 있습니다. 히브리어는 여기서 관리직이나 주둔 부대를 가리킬 수 있으나, 이 문맥에서는 ‘수비대’가 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘뿔나팔을 불며’로 옮길 수 있습니다. שׁוֹפָר는 전통적으로 양의 뿔나팔을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  english_pob_choice: struck down
  chosen_korean: 쳐서 무찔렀습니다
  alternatives_korean:
  - 공격했습니다
  - 쳤습니다
  - 무찔렀습니다
  lexicon: HALOT
  rationale: נכה는 단순한 타격보다 결정적인 군사적 제압을 가리킬 수 있어, ‘쳐서 무찔렀습니다’로 전투의 결과를 분명히 하되 과도한 세부는 덧붙이지 않았습니다.
- source_word: נְצִיב פְּלִשְׁתִּים
  english_pob_choice: the Philistine garrison
  chosen_korean: 블레셋 수비대
  alternatives_korean:
  - 블레셋 총독
  - 블레셋 지방관
  - 블레셋 주둔지
  lexicon: HALOT
  rationale: 문맥이 군사 충돌이므로 직책 가능성보다 주둔 병력을 뜻하는 의미를 살려 ‘수비대’로 옮겼습니다.
- source_word: תָּקַע בַּשּׁוֹפָר
  english_pob_choice: blew the ram's horn
  chosen_korean: 나팔을 불며
  alternatives_korean:
  - 양의 뿔나팔을 불며
  - 뿔나팔을 불며
  - 트럼펫을 불며
  lexicon: HALOT
  rationale: שׁוֹפָר는 문화적으로는 양의 뿔나팔이지만, 한국어 본문에서는 자연스러운 전달을 위해 ‘나팔’을 사용하고, 구체성은 각주로 보완했습니다.
- source_word: הָעִבְרִים
  english_pob_choice: the Hebrews
  chosen_korean: 히브리 사람들
  alternatives_korean:
  - 히브리인들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 원문이 ‘히브리 사람들’이라고 부르므로, 익숙한 신앙 공동체명으로 바꾸지 않고 직접 대응시켰습니다.
theological_decisions:
- issue: 공식 선포의 명령형 어조
  chosen_reading: 「히브리 사람들은 들으십시오!」
  alternative_readings:
  - 히브리 사람들아, 들으라!
  - 히브리 사람들은 들어라!
  rationale: 사울의 공개 선포로서 한국어 합쇼체 명령을 사용해 공식적이고 군사적인 호소의 성격을 살렸습니다.
  doctrine_reference: 서사체의 담화 화행 보존
