  terminology: ‘블레셋 수비대’, ‘게바’, ‘히브리 사람들’은 적절합니다. שׁוֹפָר의 구체적 뜻은 본문에서는 ‘나팔’로 자연스럽게 옮기고 각주에서 ‘뿔나팔’을 밝혔습니다.
