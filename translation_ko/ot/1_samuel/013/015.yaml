reference: 1 Samuel 13:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣קָם שְׁמוּאֵ֗ל וַ/יַּ֛עַל מִן הַ/גִּלְגָּ֖ל גִּבְעַ֣ת בִּנְיָמִ֑ן וַ/יִּפְקֹ֣ד שָׁא֗וּל אֶת הָ/עָם֙ הַ/נִּמְצְאִ֣ים עִמּ֔/וֹ כְּ/שֵׁ֥שׁ מֵא֖וֹת אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/015.yaml
  text: Then Samuel arose and went up from Gilgal to Gibeah of Benjamin[a], and Saul counted the people who were present with him, about six hundred men.
  footnotes:
  - marker: a
    text: Some witnesses and translations read “to Geba of Benjamin” instead of “to Gibeah of Benjamin.” The Hebrew text here reads “Gibeah of Benjamin.”
    reason: textual_variant
translation:
  language: ko
  text: 사무엘은 일어나 길갈에서 베냐민의 기브아로 올라갔습니다[a]. 사울이 자기와 함께 있는 백성의 수를 세니, 약 육백 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본과 번역본은 “베냐민의 게바”로 읽습니다. 그러나 여기의 히브리어 본문은 “베냐민의 기브아”라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어섰습니다
  - 떠났습니다
  lexicon: HALOT
  rationale: 서사적 동작의 순서를 살리면서 גם 지나친 해석인 ‘떠나다’로 좁히지 않기 위해 ‘일어나’로 옮겼습니다.
- source_word: וַיַּעַל מִן הַגִּלְגָּל גִּבְעַת בִּנְיָמִן
  english_pob_choice: went up from Gilgal to Gibeah of Benjamin
  chosen_korean: 길갈에서 기브아의 베냐민 산지로 올라갔습니다
  alternatives_korean:
  - 길갈에서 베냐민의 기브아로 올라갔습니다
  - 길갈에서 베냐민의 게바로 올라갔습니다
  lexicon: HALOT
  rationale: עלה의 ‘올라가다’라는 방향성을 살리고, MT에 보이는 지명을 본문대로 반영했습니다. ‘베냐민 산지’는 ‘Gibeah of Benjamin’의 지리적 표지를 자연스럽게 드러내면서도 주석의 대안 독법을 본문에 흡수하지 않도록 했습니다.
- source_word: וַיִּפְקֹד
  english_pob_choice: counted
  chosen_korean: 세어 보니
  alternatives_korean:
  - 계수하니
  - 소집하니
  - 점검하니
  lexicon: HALOT
  rationale: 전투 집결 상황에서 פקד의 ‘수를 헤아리다/점검하다’ 의미를 현대 한국어로 자연스럽게 풀어 ‘세어 보니’로 옮겼습니다.
- source_word: הָעָם הַנִּמְצְאִים עִמּוֹ
  english_pob_choice: the people who were present with him
  chosen_korean: 자기와 함께 있는 백성
  alternatives_korean:
  - 자기와 함께 있던 백성
  - 그와 함께 있던 사람들
  lexicon: HALOT
  rationale: ‘present with him’의 상태를 한국어로 간결하게 살리되, 군사적 문맥에서 남아 있는 무리를 뜻하는 자연스러운 표현으로 옮겼습니다.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  english_pob_choice: about six hundred men
  chosen_korean: 약 육백 명
  alternatives_korean:
  - 대략 육백 명
  - 육백 명가량
  lexicon: HALOT
  rationale: כ의 근사값을 ‘약’으로 처리하고, אִישׁ은 한국어 수사 관용에 맞게 ‘명’으로 옮겼습니다.
theological_decisions:
- issue: 지명 본문과 대안 독법 처리
  chosen_reading: 본문에는 ‘기브아의 베냐민’으로 두고, 다른 전통의 ‘게바’ 독법은 본문 주석으로만 처리합니다.
  alternative_readings:
  - ‘베냐민의 게바’로 본문 채택
  - 본문을 평준화하여 장소명을 일반화
  rationale: 제공된 히브리어 본문이 가리키는 지명을 우선하면서, 사본·역본 전승에 따른 다른 독법을 본문에서 임의로 확정하지 않았습니다.
  doctrine_reference: 본문비평 원칙
