id: 1SA.13.14
reference: 1 Samuel 13:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֖ה מַמְלַכְתְּ/ךָ֣ לֹא תָק֑וּם בִּקֵּשׁ֩ יְהוָ֨ה ל֜/וֹ אִ֣ישׁ כִּ/לְבָב֗/וֹ וַ/יְצַוֵּ֨/הוּ יְהוָ֤ה לְ/נָגִיד֙ עַל עַמּ֔/וֹ כִּ֚י לֹ֣א שָׁמַ֔רְתָּ אֵ֥ת אֲשֶֽׁר צִוְּ/ךָ֖ יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/014.yaml
  text: But now your kingdom will not endure[a]. Yahweh has sought for himself a man according to his own heart, and Yahweh has appointed him ruler over his people[c][b], because you have not kept what Yahweh commanded you.
  footnotes:
  - marker: a
    text: Or 'after his own heart.' The Hebrew phrase literally reads 'according to his heart.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will not stand.'
    reason: lexical_alternative
  - marker: c
    text: '''His people'' refers to the LORD''s people.'
    reason: cross_reference
translation:
  language: ko
  text: 그러나 이제 왕국은 서지 못할 것입니다[a]. 야훼께서 자기 마음에 맞는 사람을 찾으셨고, 야훼께서 그를 자기 백성 위의 지도자로 세우셨습니다[c][b]. 이는 당신이 야훼께서 당신에게 명령하신 것을 지키지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서지 못할 것이다.’ 히브리어 동사는 문자적으로 ‘서다’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘견고히 서지 못할 것입니다.’
    reason: lexical_alternative
  - marker: c
    text: ‘그의 백성’은 곧 야훼의 백성을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: But now
  chosen_korean: 그러나 이제
  alternatives_korean:
  - 그리고 이제
  - 이제
  lexicon: HALOT
  rationale: 앞선 상황과 대비되는 전환이므로 단순한 시간 부사보다 역접을 드러내는 ‘그러나 이제’가 문맥의 힘을 잘 살립니다.
- source_word: לֹא תָקוּם
  english_pob_choice: will not endure
  chosen_korean: 서지 못할 것입니다
  alternatives_korean:
  - 지속되지 않을 것입니다
  - 견고히 서지 못할 것입니다
  lexicon: HALOT
  rationale: 직역상 ‘서다’의 뜻을 유지하되, 왕권이 확립된 상태로 남지 못한다는 문맥을 반영해 자연스럽게 옮겼습니다.
- source_word: בִּקֵּשׁ יְהוָה לוֹ
  english_pob_choice: The LORD has sought for himself
  chosen_korean: 야훼께서 자기 마음에 맞는 사람을 찾으셨고
  alternatives_korean:
  - 야훼께서 그를 위하여 찾으셨고
  - 야훼께서 자신을 위해 찾으셨고
  lexicon: HALOT
  rationale: 반복되는 주어를 자연스럽게 풀되, פּעַל의 완료성을 살려 ‘찾으셨고’로 옮겼습니다. ‘자기’는 לּוֹ의 자기지시를 반영합니다.
- source_word: כִּלְבָבוֹ
  english_pob_choice: according to his own heart
  chosen_korean: 자기 마음에 맞는
  alternatives_korean:
  - 자기 마음에 따른
  - 자기 뜻에 맞는
  lexicon: HALOT
  rationale: ‘마음에 따라/맞는’의 문자적 의미를 살리면서 한국어에서 자연스러운 관용으로 표현했습니다. 전통적 신학적 확대를 덧붙이지 않았습니다.
- source_word: לְנָגִיד
  english_pob_choice: ruler
  chosen_korean: 지도자로
  alternatives_korean:
  - 통치자로
  - 군주로
  - 지도자
  lexicon: HALOT
  rationale: נָגִיד는 이 문맥에서 백성 위에 세워진 공적 지도자를 가리키므로, 지나치게 왕조적이거나 후대적 뉘앙스를 덜 가진 ‘지도자’가 적절합니다.
theological_decisions:
- issue: ‘his own heart’의 지시 대상
  chosen_reading: ‘자기 마음’은 바로 앞의 야훼를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 새 왕 자신을 가리키는 것으로 읽기
  - ‘자기 뜻에 맞는’ 정도의 일반적 표현으로 약화하기
  rationale: 문장 구조상 가장 가까운 선행사는 야훼이며, 본문의 핵심은 야훼가 자신의 뜻에 맞는 사람을 선택하신다는 점입니다. 해석을 과도하게 확장하지 않도록 유지했습니다.
  doctrine_reference: 본문의 신학적 긴장을 유지합니다.
- issue: ‘세우셨습니다’의 왕권 위임 뉘앙스
  chosen_reading: ‘명령하다’의 일반 의미보다, 직무에 임명하셨다는 뜻을 살려 ‘세우셨습니다’로 옮겼습니다.
  alternative_readings:
  - 명령하셨습니다
  - 임명하셨습니다
  rationale: לְנָגִיד와 결합할 때 단순한 명령이 아니라 공적 직분 부여의 의미가 분명하므로, 한국어에서도 그 기능을 드러내는 표현이 필요합니다.
  doctrine_reference: 직분 위임의 문맥을 보존합니다.
