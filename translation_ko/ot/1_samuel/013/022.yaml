revisions:
- from: 그 전투의 날에 사울과 요나단과 함께 있던 모든 백성의 손에는 칼이나 창이 하나도 발견되지 않았습니다. 그러나 사울과 그의 아들 요나단에게는 있었습니다.[a]
  to: 전투의 날에 사울과 요나단과 함께 있던 백성 누구의 손에도 칼이나 창이 발견되지 않았습니다. 그러나 사울과 그의 아들 요나단에게는 있었습니다.
  rationale: 원문에 없는 ‘그’를 제거하고, 부정문 아래의 ‘모든 백성’이 뜻하는 전면적 부재를 ‘백성 누구의 손에도’로 명료하게 했습니다. 무기의 소유를 나타내는 후반절의 ‘있었습니다’는 원문의 간결한 대조를 보존합니다. 부정확하고 불필요한 대안 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:17:08Z'
