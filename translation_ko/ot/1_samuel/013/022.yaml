reference: 1 Samuel 13:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֙ בְּ/י֣וֹם מִלְחֶ֔מֶת וְ/לֹ֨א נִמְצָ֜א חֶ֤רֶב וַ/חֲנִית֙ בְּ/יַ֣ד כָּל הָ/עָ֔ם אֲשֶׁ֥ר אֶת שָׁא֖וּל וְ/אֶת יוֹנָתָ֑ן וַ/תִּמָּצֵ֣א לְ/שָׁא֔וּל וּ/לְ/יוֹנָתָ֖ן בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/022.yaml
  text: So on the day of battle[a], not a sword or spear was found in the hand of any of the people who were with Saul and Jonathan; but Saul and his son Jonathan had them.
  footnotes:
  - marker: a
    text: Or, more formally, 'and a sword and a spear was not found in the hand of all the people.' The Hebrew expression is idiomatically rendered here to show that none of the troops had such weapons.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 전투의 날에 사울과 요나단과 함께 있던 모든 백성의 손에는 칼이나 창이 하나도 발견되지 않았습니다. 그러나 사울과 그의 아들 요나단에게는 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘전쟁의 날에’이지만, 문맥상 실제 전투가 벌어진 상황을 가리키므로 ‘전투의 날’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּי֣וֹם מִלְחֶ֔מֶת
  english_pob_choice: on the day of battle
  chosen_korean: 그 전투의 날에
  alternatives_korean:
  - 전투가 벌어지던 날에
  - 전투의 날에
  lexicon: HALOT
  rationale: 시간 부사구를 자연스러운 한국어로 옮기되, 특정한 ‘그 날’이라는 역사적 상황성을 살렸습니다.
- source_word: לֹ֨א נִמְצָ֜א חֶ֤רֶב וַ/חֲנִית֙
  english_pob_choice: not a sword or spear was found
  chosen_korean: 칼이나 창이 하나도 발견되지 않았습니다
  alternatives_korean:
  - 칼과 창이 발견되지 않았습니다
  - 칼이나 창을 찾을 수 없었습니다
  lexicon: HALOT
  rationale: 부정문 아래에서 히브리어의 병렬 무기를 분배적으로 반영해 ‘칼이나 창’으로 옮기고, 수동형 ‘발견되지 않았습니다’로 원문의 מצב을 살렸습니다.
- source_word: בְּיַד כָּל הָעָ֔ם
  english_pob_choice: in the hand of any of the people
  chosen_korean: 모든 백성의 손에는
  alternatives_korean:
  - 백성 누구의 손에도
  - 백성 가운데 아무도
  lexicon: HALOT
  rationale: ‘손’은 소유·보유의 관용구이므로 그대로 살려, 무기의 부재를 구체적으로 드러냈습니다.
- source_word: וַ/תִּמָּצֵ֣א לְ/שָׁא֔וּל וּ/לְ/יוֹנָתָ֖ן בְּנֽ/וֹ
  english_pob_choice: but Saul and his son Jonathan had them
  chosen_korean: 그러나 사울과 그의 아들 요나단에게는 있었습니다
  alternatives_korean:
  - 그러나 사울과 그의 아들 요나단이 그것들을 가지고 있었습니다
  - 그러나 사울과 그의 아들 요나단에게만 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘발견되다’와 ‘사울에게, 그리고 그의 아들 요나단에게’라는 소유 표지를 한국어에서는 자연스럽게 ‘있었습니다’로 풀어, 대조를 분명히 했습니다.
