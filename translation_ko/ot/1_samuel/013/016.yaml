base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/016.yaml
  text: Now Saul and Jonathan his son[a], and the people who were with them, were staying in Geba of Benjamin[b], while the Philistines had encamped at Michmash.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the people who were found with them,'' likely referring to those still remaining with Saul and Jonathan after others had scattered.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew place name is Geba, not Gibeah; the two are related but distinct locations in this narrative context.
    reason: alternative_reading
translation:
  language: ko
  text: 사울과 그의 아들 요나단, 그리고 그들과 함께 있던 백성은 베냐민의 게바에 머물고 있었고, 블레셋 사람들은 믹마스에 진을 치고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들과 함께 있던 백성’은 히브리어의 ‘그들과 함께 발견된 백성’을 자연스럽게 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: 본문의 지명은 기브아가 아니라 게바입니다. 두 지명은 관련은 있지만 이 문맥에서는 서로 다른 장소입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/שָׁא֞וּל וְ/יוֹנָתָ֣ן בְּנ֗/וֹ
  english_pob_choice: Now Saul and Jonathan his son
  chosen_korean: 사울과 그의 아들 요나단
  alternatives_korean:
  - 사울과 아들 요나단
  - 사울과 그의 아들 요나단
  lexicon: WLC
  rationale: 히브리어는 사울과 요나단을 병렬로 제시하며, בְּנוֹ는 ‘그의 아들’이라는 관계를 분명히 합니다. 한국어에서는 자연스럽게 소유격을 살려 옮겼습니다.
- source_word: הָ/עָם֙ הַ/נִּמְצָ֣א עִמָּ֔/ם
  english_pob_choice: the people who were with them
  chosen_korean: 그들과 함께 있던 백성
  alternatives_korean:
  - 그들과 함께 발견된 백성
  - 그들과 함께 있던 사람들
  - 그들과 함께 남아 있던 백성
  lexicon: HALOT
  rationale: נמצא의 직역인 ‘발견된’은 한국어 본문에서 부자연스러우므로, 문맥상 함께 남아 있던 집단을 자연스럽게 드러내는 표현으로 옮겼습니다. 다만 ‘백성’이라는 집단 명사는 유지했습니다.
- source_word: יֹשְׁבִ֖ים
  english_pob_choice: were staying
  chosen_korean: 머물고 있었고
  alternatives_korean:
  - 살고 있었고
  - 앉아 있었고
  - 거주하고 있었고
  lexicon: HALOT
  rationale: ישׁב의 현재분사는 단순한 ‘앉다’보다 장소에 머무르거나 거주하는 뜻이 강하므로, 전개를 자연스럽게 연결하는 ‘머물고 있었다’로 옮겼습니다.
- source_word: בְּ/גֶ֣בַע בִּנְיָמִ֑ן
  english_pob_choice: in Geba of Benjamin
  chosen_korean: 베냐민의 게바
  alternatives_korean:
  - 베냐민의 기브아
  - 베냐민 지방의 게바
  - 베냐민의 게바에
  lexicon: HALOT
  rationale: 원문 자음은 게바를 가리키며, 본문은 기브아가 아니라 게바를 지명으로 제시합니다. 따라서 익숙한 지명으로 조정하지 않고 음역을 따랐습니다.
- source_word: וּ/פְלִשְׁתִּ֖ים חָנ֥וּ בְ/מִכְמָֽשׂ
  english_pob_choice: while the Philistines had encamped at Michmash
  chosen_korean: 블레셋 사람들은 믹마스에 진을 치고 있었습니다
  alternatives_korean:
  - 블레셋 사람들은 믹마스에 진을 쳤습니다
  - 블레셋 사람들은 믹마스에 진을 치고 있었습니다
  - 블레셋은 믹마스에 진을 쳤습니다
  lexicon: HALOT
  rationale: חנה는 군사적 ‘진치다’의 정형 표현이므로 그 의미를 살렸고, 대조 관계를 나타내는 וּ는 한국어에서 병렬적 전환으로 처리했습니다.
