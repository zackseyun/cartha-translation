  edition: WLC
  text: וּ/פְלִשְׁתִּ֞ים נֶאֶסְפ֣וּ לְ/הִלָּחֵ֣ם עִם יִשְׂרָאֵ֗ל שְׁלֹשִׁ֨ים אֶ֤לֶף רֶ֨כֶב֙ וְ/שֵׁ֤שֶׁת אֲלָפִים֙ פָּרָשִׁ֔ים וְ/עָ֕ם כַּ/ח֛וֹל אֲשֶׁ֥ר עַל שְׂפַֽת הַ/יָּ֖ם לָ/רֹ֑ב וַֽ/יַּעֲלוּ֙ וַ/יַּחֲנ֣וּ בְ/מִכְמָ֔שׂ קִדְמַ֖ת בֵּ֥ית אָֽוֶן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/005.yaml
  text: 'And the Philistines gathered to fight against Israel: thirty thousand chariots[a], and six thousand horsemen, and troops as numerous as the sand that is on the seashore. They went up and camped at Mikmash, east of Beth-aven.'
  footnotes:
  - marker: a
    text: Hebrew reads 'thirty thousand chariots.' Some interpreters and ancient witnesses have suggested a smaller number (for example, 'three thousand') because thirty thousand seems unusually large in context, but the main text follows the Masoretic Hebrew.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 블레셋 사람들이 이스라엘과 싸우려고 모였는데, 전차 삼만 대와 기병 육천 명, 그리고 바닷가의 모래처럼 수많은 군대였습니다. 그들은 올라가 믹마스에 진을 쳤으니, 벧아웬의 동쪽이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘전차 삼만 대’로 읽습니다. 일부 해석자와 고대 사본 증거는 문맥상 매우 큰 수이기 때문에 ‘삼천’과 같은 더 작은 수를 제안하지만, 본문은 마소라 히브리어를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: וּפְלִשְׁתִּים נֶאֶסְפוּ
  english_pob_choice: the Philistines gathered
  chosen_korean: 블레셋 사람들이 … 모였는데
  alternatives_korean:
  - 블레셋 사람들이 집결했는데
  - 블레셋 사람들이 모여들었는데
  lexicon: HALOT
  rationale: נאסף의 군사적 의미를 살리되, 한국어에서는 ‘모이다’가 자연스럽고 전투 문맥도 충분히 전달합니다.
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  english_pob_choice: to fight against Israel
  chosen_korean: 이스라엘과 싸우려고
  alternatives_korean:
  - 이스라엘과 싸우기 위해
  - 이스라엘과 전쟁하려고
  lexicon: HALOT
  rationale: לְהִלָּחֵם עִם의 적대적 대결을 간명하게 드러내면서도 한국어 서술에 자연스럽게 맞췄습니다.
- source_word: שְׁלֹשִׁים אֶלֶף רֶכֶב
  english_pob_choice: thirty thousand chariots
  chosen_korean: 전차 삼만 대
  alternatives_korean:
  - 전차 삼만
  - 마차 삼만 대
  lexicon: HALOT
  rationale: רֶכֶב은 전투용 전차를 가리키므로 ‘전차’로 옮겼고, 수량 표현은 현대 한국어에서 자연스럽게 ‘대’를 붙였습니다.
- source_word: שֵׁשֶׁת אֲלָפִים פָּרָשִׁים
  english_pob_choice: six thousand horsemen
  chosen_korean: 기병 육천 명
  alternatives_korean:
  - 말 탄 사람 육천 명
  - 말타는 군사 육천 명
  lexicon: HALOT
  rationale: פָּרָשִׁים는 기병을 뜻하므로 군사 용어로 분명하게 옮겼습니다.
- source_word: וְעָם כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  english_pob_choice: troops as numerous as the sand that is on the seashore
  chosen_korean: 바닷가의 모래처럼 수많은 군대였습니다
  alternatives_korean:
  - 바닷가의 모래처럼 헤아릴 수 없이 많았습니다
  - 바닷가 모래같이 엄청나게 많은 군대였습니다
  lexicon: HALOT
  rationale: 히브리어의 표준적 무수함 비유를 그대로 살리되, 한국어에서는 ‘수많은’이 가장 직접적이고 읽기 좋습니다.
theological_decisions:
- issue: 군사 수량의 과장 가능성과 본문 충실성
  chosen_reading: 본문의 ‘전차 삼만 대’를 그대로 반영했습니다.
  alternative_readings:
  - ‘전차 삼천 대’로 조정
  - ‘전차 삼만 대’에 주석으로 이문 제시
  rationale: 히브리어 마소라 본문을 우선 반영해 본문을 보존하고, 숫자 문제는 본문 밖의 주석 영역에서 다루는 편이 POB의 원칙에 부합합니다.
  doctrine_reference: 본문비평 원칙
