source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר שְׁמוּאֵ֖ל מֶ֣ה עָשִׂ֑יתָ וַ/יֹּ֣אמֶר שָׁא֡וּל כִּֽי רָאִיתִי֩ כִֽי נָפַ֨ץ הָ/עָ֜ם מֵ/עָלַ֗/י וְ/אַתָּה֙ לֹא בָ֨אתָ֙ לְ/מוֹעֵ֣ד הַ/יָּמִ֔ים וּ/פְלִשְׁתִּ֖ים נֶאֱסָפִ֥ים מִכְמָֽשׂ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/011.yaml
  text: Then Samuel said[a], “What have you done?” And Saul said, “Because I saw that the people were scattering from me, and you had not come at the appointed time[b], and the Philistines were gathering at Michmash,”
  footnotes:
  - marker: a
    text: Or “were assembling at Michmash.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “at the appointed time of the days,” likely referring to the previously agreed period.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 사무엘이 말했습니다. “네가 무슨 일을 했느냐?” 사울이 말했습니다. “내가 보니 백성이 나를 떠나 흩어지고 있었고, 당신은 정한 날에 오지 않으셨으며, 블레셋 사람들이 믹마스에 모여 있었습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무슨 일을 했느냐’는 책망하는 질문으로, 단순한 정보 요청이 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘날들의 정한 때’입니다. 앞선 약속된 기간을 가리키는 표현으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  english_pob_choice: What have you done?
  chosen_korean: 네가 무슨 일을 했느냐?
  alternatives_korean:
  - 네가 무엇을 했느냐?
  - 네가 무슨 짓을 했느냐?
  lexicon: HALOT
  rationale: 사무엘의 책망하는 질문을 살리면서도, 문맥상 단순 정보 질문이 아닌 책임 추궁의 뉘앙스를 유지했습니다.
- source_word: נָפַץ הָעָם מֵעָלַי
  english_pob_choice: the people were scattering from me
  chosen_korean: 백성이 나를 떠나 흩어지고 있었고
  alternatives_korean:
  - 백성이 내게서 흩어지고 있었고
  - 백성이 나에게서 흩어지고 있었고
  lexicon: HALOT
  rationale: נָפַץ의 분산·해체 의미를 ‘흩어지다’로 살리고, מֵעָלַי의 방향성을 ‘나를 떠나’로 자연스럽게 옮겼습니다.
- source_word: לְמוֹעֵד הַיָּמִים
  english_pob_choice: at the appointed time
  chosen_korean: 정한 날에
  alternatives_korean:
  - 정해진 때에
  - 약정한 기간에
  lexicon: HALOT
  rationale: 직역하면 ‘날들의 정한 때’이지만, POB 주석처럼 앞선 약속된 기간을 가리키는 관용을 고려해 한국어로는 자연한 ‘정한 날에’로 옮겼습니다.
- source_word: פְּלִשְׁתִּים נֶאֱסָפִים מִכְמָשׂ
  english_pob_choice: the Philistines were gathering at Michmash
  chosen_korean: 블레셋 사람들이 믹마스에 모여 있었습니다
  alternatives_korean:
  - 블레셋 사람들이 믹마스에 집결하고 있었습니다
  - 블레셋 사람들이 믹마스에 모이고 있었습니다
  lexicon: HALOT
  rationale: נֶאֱסָפִים의 진행적 상황을 반영해 ‘모여 있었습니다’로 옮기고, 지명은 현대 음역 ‘믹마스’를 따랐습니다.
theological_decisions:
- issue: 사울의 자기변명 서술을 어떻게 드러낼지
  chosen_reading: 사울의 말을 직접 인용해, 위기 상황에서 자신의 판단과 책임 회피가 함께 드러나도록 두었습니다.
  alternative_readings:
  - 보다 중립적으로 ‘내가 보기에’로 완화
  - 책망의 강도를 높여 의역
  rationale: 원문은 사울의 변명적 설명을 이어 붙이며 자기 중심적 시각을 노출합니다. 이를 과도하게 해석하지 않되, 문맥상의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 서사 문맥과 화자 성격 묘사
