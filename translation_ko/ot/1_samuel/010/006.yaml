  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/צָלְחָ֤ה עָלֶ֨י/ךָ֙ ר֣וּחַ יְהוָ֔ה וְ/הִתְנַבִּ֖יתָ עִמָּ֑/ם וְ/נֶהְפַּכְתָּ֖ לְ/אִ֥ישׁ אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/006.yaml
  text: Then the Spirit of Yahweh will rush upon you[a], and you will prophesy with them[b], and be turned into another man.
  footnotes:
  - marker: a
    text: Or 'will come mightily upon you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you will be turned into a different man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 야훼의 영이 당신에게 강하게 임하시고, 당신은 그들과 함께 예언할 것이며, 다른 사람으로 바뀔 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신에게 크게 임하실 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신이 다른 사람으로 바뀔 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּחַ יְהוָ֔ה
  english_pob_choice: the Spirit of Yahweh
  chosen_korean: 야훼의 영
  alternatives_korean:
  - 여호와의 영
  - 주님의 영
  - 성령
  lexicon: WLC
  rationale: 원문은 야훼의 영을 가리키며, POB의 기본 원칙에 따라 יהוה는 한국어에서 ‘야훼’로 옮겼습니다. 이 본문은 일반적인 ‘바람/호흡’이 아니라 하나님에게서 오는 영의 역사입니다.
- source_word: וְצָלְחָ֤ה עָלֶ֨י/ךָ֙
  english_pob_choice: will rush upon you
  chosen_korean: 당신에게 강하게 임하시고
  alternatives_korean:
  - 당신 위에 돌진하시고
  - 당신에게 강하게 오시고
  - 당신에게 세차게 임하시고
  lexicon: HALOT
  rationale: צלח는 여기서 단순한 ‘성공’이 아니라 야훼의 영이 사람 위에 힘 있게 임하는 역동성을 나타냅니다. 한국어로는 ‘강하게 임하다’가 의미와 자연스러움을 함께 살립니다.
- source_word: וְהִתְנַבִּ֖יתָ
  english_pob_choice: you will prophesy
  chosen_korean: 당신은 그들과 함께 예언할 것이며
  alternatives_korean:
  - 당신은 그들과 함께 예언하게 될 것이며
  - 당신은 그들과 함께 선지자처럼 말할 것이며
  - 당신은 그들과 함께 예언자처럼 행동할 것이며
  lexicon: HALOT
  rationale: 히트파엘 נבא는 이 문맥에서 황홀경적 행동보다 실제 예언 행위를 가리킵니다. ‘예언하다’는 본문이 말하는 행동을 직접적이고 간결하게 드러냅니다.
- source_word: וְ/נֶהְפַּכְתָּ֖ לְ/אִ֥ישׁ אַחֵֽר
  english_pob_choice: be turned into another man
  chosen_korean: 다른 사람으로 바뀔 것입니다
  alternatives_korean:
  - 다른 사람으로 바뀌게 될 것입니다
  - 다른 남자로 바뀔 것입니다
  - 다른 사람으로 변할 것입니다
  lexicon: HALOT
  rationale: נֶהְפַּךְ은 상태의 변화, 즉 ‘바뀌다/뒤바뀌다’의 의미를 담습니다. אִישׁ אַחֵר는 문자적으로 ‘다른 사람/다른 남자’이지만, 한국어에서는 자연스러운 독법을 위해 ‘다른 사람’으로 옮겼습니다.
theological_decisions:
- issue: 사울의 변화의 성격
  chosen_reading: 이 구절은 야훼의 영이 사울에게 임하여 그가 예언하게 되고, 실제로 ‘다른 사람으로 바뀌는’ 변화를 겪는다는 점을 말하지만, 그 변화가 회심·중생·영구적 도덕 변화인지는 단정하지 않습니다.
  alternative_readings:
  - 외적 황홀경만을 가리킨다
  - 완전한 내적 영적 새로움을 뜻한다
  rationale: 히브리어 본문은 변화의 사실을 진술하지만 그 신학적 범위와 지속성은 규정하지 않습니다. 번역은 그 긴장을 풀지 않고 본문 수준에서만 말합니다.
  doctrine_reference: 본문이 말하는 변화는 인정하되, 후대 교리 논쟁은 열어 둡니다.
