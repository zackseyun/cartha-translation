reference: 1 Samuel 10:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּקְרֵ֞ב אֶת שֵׁ֤בֶט בִּנְיָמִן֙ ל/משפחת/ו וַ/תִּלָּכֵ֖ד מִשְׁפַּ֣חַת הַ/מַּטְרִ֑י וַ/יִּלָּכֵד֙ שָׁא֣וּל בֶּן קִ֔ישׁ וַ/יְבַקְשֻׁ֖/הוּ וְ/לֹ֥א נִמְצָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/021.yaml
  text: Then he brought the tribe of Benjamin near by its clans[a], and the clan of the Matrites was taken. Then Saul son of Kish was taken, but when they sought him[b], he could not be found.
  footnotes:
  - marker: a
    text: Or, more formally, 'according to its families.' The Hebrew term can denote extended family groups or clans within a tribe.
    reason: lexical_alternative
  - marker: b
    text: '''Was taken'' refers to being indicated or selected by lot, not to military capture.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 베냐민 지파를 그 씨족들에 따라 앞으로 나오게 하였고, 마트리 씨족이 뽑혔습니다. 그다음에는 기스의 아들 사울이 뽑혔지만, 그를 찾았을 때는 보이지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘씨족’은 히브리어 מִשְׁפָּחָה가 가리킬 수 있는 지파 내 하위 친족 단위를 옮긴 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘뽑혔다’는 군사적 포획이 아니라 제비뽑기로 지목되었다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּקְרֵב
  english_pob_choice: brought ... near
  chosen_korean: 앞으로 나오게 하였고
  alternatives_korean:
  - 가까이 오게 하였고
  - 가져오게 하였고
  lexicon: HALOT
  rationale: 히필 형태의 קרב는 단순한 물리적 이동보다 ‘의식적으로 앞으로 불러 세움/가까이 오게 함’의 절차를 나타내므로, lot 선출 장면의 진행성을 살려 옮겼습니다.
- source_word: לְמִשְׁפְּחֹתָיו / מִשְׁפַּחַת
  english_pob_choice: by its clans / the clan of the Matrites
  chosen_korean: 그 씨족들에 따라 / 마트리 씨족
  alternatives_korean:
  - 그 가족들에 따라 / 마트리 가족
  - 그 족속들에 따라 / 마트리 족속
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 문맥상 지파 아래의 하위 집단이므로 ‘씨족’이 한국어 독자에게 가장 자연스럽고, 양쪽 절에서 같은 대응어를 유지했습니다.
- source_word: וַתִּלָּכֵד / וַיִּלָּכֵד
  english_pob_choice: was taken
  chosen_korean: 뽑혔습니다
  alternatives_korean:
  - 선택되었습니다
  - 잡혔습니다
  lexicon: HALOT
  rationale: 이 동사는 군사적 ‘붙잡힘’이 아니라 제비뽑기에서 ‘지목됨/선정됨’을 뜻하므로, 한국어에서는 절차적 의미가 분명한 ‘뽑혔습니다’가 가장 적절합니다.
- source_word: וַיְבַקְשֻׁהוּ / וְלֹא נִמְצָא
  english_pob_choice: when they sought him ... he could not be found
  chosen_korean: 그를 찾았을 때는 보이지 않았습니다
  alternatives_korean:
  - 그를 찾았지만 찾지 못했습니다
  - 그를 찾았으나 발견되지 않았습니다
  lexicon: HALOT
  rationale: בקשׁ과 מצא의 연속을 자연스러운 한국어로 풀어, ‘찾으나 발견되지 않음’의 실패를 유지하면서도 서사 흐름이 매끄럽게 들리도록 했습니다.
theological_decisions:
- issue: 제비뽑기/선정 동사의 의미
  chosen_reading: 사울이 ‘뽑혔다’고 번역해, 하나님이 지파와 씨족, 개인을 단계적으로 드러내시는 선출 절차를 분명히 했습니다.
  alternative_readings:
  - ‘잡혔다’로 옮겨 원형의 수동성을 더 강하게 드러내는 읽기
  - ‘선택되었다’로 옮겨 의미를 해석적으로 풀어내는 읽기
  rationale: 본문의 לכד는 포획이 아니라 제비뽑기 결과를 가리키므로, 절차의 신적 주도성과 결과의 확정성을 함께 보존하는 번역이 필요합니다.
  doctrine_reference: 섭리와 선택의 서사적 표현
