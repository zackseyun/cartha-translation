    reason: cultural_note
  revision_rationale: 마지막 절을 원문의 ‘찾음’과 ‘발견하지 못함’의 관계가 드러나도록 수정했습니다. 또한 분류·선출 절차를 자연스러운 현대 한국어로 표현하기 위해 ‘그 씨족별로’를 사용했고, b 각주를 설명 대상인 ‘뽑혔습니다’ 바로 뒤에 배치했습니다. a 각주는 본문에서 ‘씨족’ 뒤에 [a]로 배치해야 합니다.
