  source_fidelity: 원문의 הֲרְאִיתֶם은 의문문(문맥상 주의를 환기하는 질문)인데, 초안의 ‘보십시오’는 명령문으로 바뀌어 있습니다. 이를 ‘보십니까?’로 옮기고 완료형 가능성은 각주로 보존하는 것이 원문에 더 충실합니다. וַיָּרִעוּ와 וַיֹּאמְרוּ의 연속은 ‘환호하며 외쳤습니다’로 자연스럽게 반영했습니다.
  naturalness: 수정문은 현대 표준 한국어의 합쇼체를 유지하며, ‘왕 만세!’는 왕에 대한 공적 환호로 자연스럽고 간결합니다. 각주 표지는 해당 표현 바로 뒤에 두어 참조 범위를 분명히 했습니다.
