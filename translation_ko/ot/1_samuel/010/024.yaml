translation:
  language: ko
  text: 그러자 사무엘이 모든 백성에게 말했습니다. "야훼께서 택하신 그를 보십시오. 모든 백성 가운데 그와 같은 사람은 없습니다." 그러자 모든 백성이 환호하며 말했습니다. "임금 만세!"[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼께서 택하신 그를 보셨습니까?”
    reason: alternative_reading
  - marker: b
    text: 히브리어, “임금이 살아 있기를!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속형의 서술 진행을 한국어에서 자연스럽게 이어 주는 표현으로 옮겼습니다.
- source_word: הָרְּאִיתֶם אֲשֶׁר בָּחַר בּוֹ יְהוָה
  english_pob_choice: Do you see the one whom Yahweh has chosen?
  chosen_korean: 야훼께서 택하신 그를 보십시오
  alternatives_korean:
  - 야훼께서 택하신 사람을 보십시오
  - 야훼께서 택하신 그분을 보십시오
  lexicon: HALOT
  rationale: 직접 호명하는 문맥에서 טבע스러운 질문형보다 시선 유도형 명령으로 기능을 살려, 선택된 인물을 가리키는 ‘그를’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 번역 원칙에 따라 여호와가 아니라 신명기의 직접 음역형인 ‘야훼’를 사용했습니다.
- source_word: כִּי אֵין כָּמֹהוּ בְּכָל הָעָם
  english_pob_choice: There is no one like him among all the people.
  chosen_korean: 모든 백성 가운데 그와 같은 사람은 없습니다
  alternatives_korean:
  - 모든 백성 가운데 그와 같은 이가 없습니다
  - 온 백성 가운데 그와 같은 자는 없습니다
  lexicon: HALOT
  rationale: כִּי를 별도의 ‘왜냐하면’으로 풀기보다 앞 문장을 보충하는 설명문으로 자연스럽게 이어, 비교 구문의 핵심을 한국어로 분명히 했습니다.
- source_word: וַיָּרִעוּ כָל הָעָם וַיֹּאמְרוּ
  english_pob_choice: And all the people shouted and said
  chosen_korean: 그러자 모든 백성이 환호하며 말했습니다
  alternatives_korean:
  - 모든 백성이 소리 높여 말했습니다
  - 모든 백성이 외치며 말했습니다
  lexicon: HALOT
  rationale: וַיָּרִעוּ는 단순한 말보다 큰 환호를 가리키므로 ‘환호하며’가 문맥의 강도를 가장 잘 살립니다.
- source_word: יְחִי הַמֶּלֶךְ
  english_pob_choice: Long live the king!
  chosen_korean: 임금 만세!
  alternatives_korean:
  - 왕 만세!
  - 임금님 만세!
  lexicon: HALOT
  rationale: 히브리어의 축원형 감탄을 한국어의 관용적 호응 구호로 옮겼습니다.
