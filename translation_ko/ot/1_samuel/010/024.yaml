translation:
  language: ko
  text: 그러자 사무엘이 모든 백성에게 말했습니다. “야훼께서 택하신 이를 보십니까?[a] 모든 백성 가운데 그와 같은 이는 없습니다.” 그러자 모든 백성이 환호하며 외쳤습니다. “왕 만세!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼께서 택하신 이를 보셨습니까?”
    reason: alternative_reading
  - marker: b
    text: 히브리어, “왕이 살아 있기를!”
    reason: lexical_alternative
