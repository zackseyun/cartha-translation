id: 1SA.10.23
reference: 1 Samuel 10:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּרֻ֨צוּ֙ וַ/יִּקָּחֻ֣/הוּ מִ/שָּׁ֔ם וַ/יִּתְיַצֵּ֖ב בְּ/ת֣וֹךְ הָ/עָ֑ם וַ/יִּגְבַּהּ֙ מִ/כָּל הָ/עָ֔ם מִ/שִּׁכְמ֖/וֹ וָ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/023.yaml
  text: So they ran and took him from there[a], and he stood in the midst of the people. And he was taller than all the people from his shoulders upward.
  footnotes:
  - marker: a
    text: Or 'fetched him from there.' The Hebrew verb commonly means 'took,' but in context it can imply retrieving him from where he had hidden himself (see v. 22).
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들이 달려가 그를 거기서 데려왔습니다[a]. 그는 백성 가운데 섰습니다. 그는 어깨 위로는 모든 백성보다 더 컸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 거기서 데리고 왔다.’ 히브리어 동사는 보통 ‘취하다’ 또는 ‘데려오다’를 뜻하지만, 문맥상 22절에서 숨었던 곳에서 그를 찾아 데리고 오는 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֻצוּ
  english_pob_choice: they ran
  chosen_korean: 달려가
  alternatives_korean:
  - 서둘러 가
  - 급히 달려가
  lexicon: HALOT
  rationale: 히브리어 רוץ의 기본 의미인 ‘달리다/달려가다’를 직접 살려 장면의 급박함을 유지했습니다.
- source_word: וַיִּקָּחֻהוּ מִשָּׁם
  english_pob_choice: took him from there
  chosen_korean: 그를 거기서 데려왔습니다
  alternatives_korean:
  - 그를 거기서 데리고 왔습니다
  - 그를 거기서 데려갔습니다
  lexicon: HALOT
  rationale: לקח는 기본적으로 ‘데려오다/데려가다’보다 넓게 ‘취하다/데려오다’를 뜻하지만, 문맥상 숨어 있던 사울을 찾아 ‘거기서’ 끌어내는 뉘앙스가 있어 자연스러운 한국어로 옮겼습니다.
- source_word: וַיִּתְיַצֵּב בְּתוֹךְ הָעָם
  english_pob_choice: he stood in the midst of the people
  chosen_korean: 백성 가운데 서니
  alternatives_korean:
  - 백성 한가운데 서니
  - 백성 가운데 자리를 잡으니
  lexicon: HALOT
  rationale: בְּתוֹךְ는 ‘가운데/한가운데’를 뜻하므로 ‘백성 가운데’로 살렸고, וַיִּתְיַצֵּב는 단순히 ‘서다’로 옮겨 과도한 의례적 의미를 덧붙이지 않았습니다.
- source_word: וַיִּגְבַּהּ מִכָּל הָעָם מִשִּׁכְמוֹ וָמָעְלָה
  english_pob_choice: he was taller than all the people from his shoulders upward
  chosen_korean: 어깨 위로는 모든 백성보다 키가 컸습니다
  alternatives_korean:
  - 어깨 위까지는 모든 백성보다 컸습니다
  - 어깨부터 위로 모든 백성보다 키가 컸습니다
  lexicon: HALOT
  rationale: 비교 구문과 신체 관용구를 함께 살려, 사울의 압도적인 신장을 한국어로 분명하게 전달했습니다.
theological_decisions:
- issue: 사울의 키 묘사와 서술 기능
  chosen_reading: 이 절은 사울의 외적 우월성을 서술하는 묘사로 보되, 왕권의 정당화보다 ‘백성 가운데서도 두드러지는 키’라는 사실 자체를 드러내는 데 초점을 둡니다.
  alternative_readings:
  - 왕으로서의 위엄을 암시하는 표현
  - 상징적으로 지도자성을 강조하는 표현
  rationale: 히브리어 본문은 단순한 신체 묘사에 머물며, 번역에서도 상징을 과도하게 부여하지 않는 것이 본문 충실성에 부합합니다.
  doctrine_reference: 본문 서술의 직접성 유지
- issue: וַיִּתְיַצֵּב의 의미 범위
  chosen_reading: ‘서니’로 옮겨, ‘자진해 나서다’나 ‘공식적으로 서다’ 같은 해석을 배제했습니다.
  alternative_readings:
  - 자리를 잡으니
  - 자기 모습을 드러내니
  - 공식적으로 섰습니다
  rationale: 문맥상 사울이 인도되어 나온 뒤의 위치 변화를 말할 뿐이므로, 독자에게 과도한 의례적·심리적 해석을 강요하지 않는 번역이 적절합니다.
  doctrine_reference: 본문 문맥 우선 원칙
