id: 1SA.10.25
reference: 1 Samuel 10:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר שְׁמוּאֵ֜ל אֶל הָ/עָ֗ם אֵ֚ת מִשְׁפַּ֣ט הַ/מְּלֻכָ֔ה וַ/יִּכְתֹּ֣ב בַּ/סֵּ֔פֶר וַ/יַּנַּ֖ח לִ/פְנֵ֣י יְהוָ֑ה וַ/יְשַׁלַּ֧ח שְׁמוּאֵ֛ל אֶת כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/025.yaml
  text: Then Samuel told the people the rights and duties of the kingship[a], and he wrote them in the book and laid it before Yahweh. Then Samuel sent all the people away[b], each man to his house.
  footnotes:
  - marker: a
    text: Or “the procedure/custom of the kingship.” The Hebrew phrase can refer to the legal ordinances or established practice of royal rule.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “each man to his house,” a distributive expression meaning the people departed individually to their own households.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사무엘이 백성에게 왕권의 규례[a]를 말해 주고, 그것을 책에 기록하여 야훼 앞에 두었습니다. 그런 다음 사무엘은 온 백성을 각 사람 자기 집으로 돌려보냈습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왕권의 관례”로 옮길 수 있습니다. 히브리어 표현은 왕정의 법적 규정이나 확립된 관행을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “각 사람 자기 집으로”입니다. 사람들을 각자 자기 가정으로 돌아가게 했다는 분배적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט הַמְּלֻכָה
  english_pob_choice: the rights and duties of the kingship
  chosen_korean: 왕권의 규례
  alternatives_korean:
  - 왕권의 관례
  - 왕권의 법도
  - 왕위의 절차
  lexicon: HALOT
  rationale: מִשְׁפַּט은 여기서 법적 권리와 의무를 나열한다기보다 왕권에 관한 규정·관례를 가리킬 수 있어, 한국어로는 포괄적인 ‘규례’가 문맥에 가장 자연스럽고 원문의 제도적 성격도 살립니다.
- source_word: וַיִּכְתֹּב בַּסֵּפֶר
  english_pob_choice: he wrote them in the book
  chosen_korean: 그것을 책에 기록하여
  alternatives_korean:
  - 그것들을 책에 기록하여
  - 그것을 두루마리에 기록하여
  - 그것을 문서에 기록하여
  lexicon: HALOT
  rationale: 히브리어는 앞절의 왕권 규례를 이어받는 단수 지시로 읽히므로 ‘그것을’이 맞고, סֵפֶר은 물질형태를 과도하게 특정하지 않는 ‘책’이 무난합니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 여호와 앞에
  - 주 앞에
  - 야훼 앞에 두고
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본 원칙에 따라 ‘야훼’로 옮기며, ‘앞에 두다’는 제의적 보관/봉헌의 뜻을 한국어로 간결하게 살립니다.
- source_word: אִישׁ לְבֵיתוֹ
  english_pob_choice: each man to his house
  chosen_korean: 각 사람 자기 집으로
  alternatives_korean:
  - 각 사람 자기 집으로
  - 각 남자 자기 집으로
  - 모두 자기 집으로
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 분배 표현을 한국어에서는 과도한 성별 부각 없이 ‘각 사람’으로 자연스럽게 살리되, 분배 의미 ‘자기 집으로’를 유지했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 신명기적 전통의 언약명 יהוה를 직접 사용하므로, 독자에게 인격적 고유명을 드러내는 ‘야훼’가 본문 성격을 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה / YHWH → 야훼'
- issue: 왕권 규례의 성격
  chosen_reading: 제도적·법적 규정으로 읽기
  alternative_readings:
  - 단순한 관습
  - 왕정의 관례
  rationale: 이 절은 사무엘이 왕정 아래의 질서를 문서로 남기는 장면이므로, 본문을 단순 습속보다 통치 규정의 공적 성격으로 읽는 편이 문맥에 더 부합합니다.
  doctrine_reference: 1 Samuel 10:25 문맥상 왕정 도입부의 헌정/행정 기록
