base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/014.yaml
  text: Then Saul’s uncle said to him and to his young man[a], “Where did you go?” And he said, “To seek the donkeys. When we saw that they were nowhere to be found[b], we went to Samuel.”
  footnotes:
  - marker: a
    text: Hebrew 'the donkeys' uses the feminine form, referring specifically to female donkeys.
    reason: lexical_alternative
  - marker: b
    text: Or 'we came to Samuel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울의 숙부가 그와 그의 청년에게 “너희는 어디로 갔느냐?” 하고 말하자, 그가 대답했습니다. “나귀를 찾으러 갔습니다. 그것들이 어디에도 보이지 않는 것을 보고, 우리가 사무엘에게 갔습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֲתֹנוֹת는 문자적으로 ‘암나귀들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “우리가 보니 그것들은 없었다”입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹד שָׁאוּל
  english_pob_choice: Saul’s uncle
  chosen_korean: 사울의 숙부
  alternatives_korean:
  - 사울의 삼촌
  - 사울의 친족
  lexicon: HALOT
  rationale: דּוֹד는 친족 일반보다 구체적으로 ‘삼촌/숙부’로 읽는 것이 자연스럽고, 한국어에서는 성별이 드러나지 않는 ‘숙부’가 문맥상 가장 무난합니다.
- source_word: נַעַר
  english_pob_choice: to his young man
  chosen_korean: 그의 청년
  alternatives_korean:
  - 그의 젊은 사람
  - 그의 종
  lexicon: HALOT
  rationale: נַעַר는 ‘젊은 사람, 시종, 종’까지 넓지만, 여기서는 동행한 보좌자를 가리키므로 과도한 신분 규정 없이 ‘청년’으로 옮겼습니다.
- source_word: לְבַקֵּשׁ אֶת הָאֲתֹנוֹת
  english_pob_choice: To seek the donkeys
  chosen_korean: 나귀를 찾으러
  alternatives_korean:
  - 나귀를 찾아
  - 암나귀들을 찾으러
  lexicon: HALOT
  rationale: בקשׁ의 기본 의미인 ‘찾다/구하다’를 살리되, 한국어 서술에서는 목적을 나타내는 ‘-러’ 구조가 가장 자연스럽습니다. אֲתֹנוֹת는 문자적으로 암나귀이지만, 한국어 본문에서는 통상 ‘나귀’가 더 읽기 자연스럽습니다.
- source_word: וַנִּרְאֶה כִי אַיִן
  english_pob_choice: When we saw that they were nowhere to be found
  chosen_korean: 그것들이 어디에도 보이지 않는 것을 보고
  alternatives_korean:
  - 그것들이 없다는 것을 보고
  - 그것들이 보이지 않는 것을 보고
  lexicon: HALOT
  rationale: 히브리어의 ‘없다/존재하지 않는다’는 뉘앙스를 한국어의 ‘어디에도 보이지 않는다’로 옮기면, 단순한 미발견이 아니라 찾을 수 없음의 상황이 드러납니다.
- source_word: וַנָּבוֹא אֶל שְׁמוּאֵל
  english_pob_choice: we went to Samuel
  chosen_korean: 사무엘에게 갔습니다
  alternatives_korean:
  - 사무엘에게 왔습니다
  - 사무엘에게 나아갔습니다
  lexicon: HALOT
  rationale: אֶל은 대상/방향을 나타내므로 ‘~에게 갔다’가 가장 자연스럽고, 내레이터의 이동 경로를 한국어 서술에 맞게 분명히 합니다.
theological_decisions:
- issue: 직접화법의 존칭 수준
  chosen_reading: 사울의 숙부가 묻는 장면은 일반 대화체로 처리하고, 보고형 서술은 합쇼체로 유지했습니다.
  alternative_readings:
  - 직접화법까지 전부 하십시오체로 올림
  - 전체를 비격식체로 통일
  rationale: 본문은 신적 발화가 아니라 가족 간 대화이므로, 한국어 독자에게 자연스러운 현대 서술을 유지하되 전체 문체는 합쇼체를 지켰습니다.
  doctrine_reference: 문체/담화 관례
