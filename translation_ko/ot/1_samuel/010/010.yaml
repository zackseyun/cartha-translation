id: 1SA.10.10
reference: 1 Samuel 10:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ שָׁם֙ הַ/גִּבְעָ֔תָ/ה וְ/הִנֵּ֥ה חֶֽבֶל נְבִאִ֖ים לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֤ח עָלָי/ו֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּתְנַבֵּ֖א בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/010.yaml
  text: When they came there to the hill[a], behold, a band of prophets came to meet him, and the Spirit of God rushed upon him, and he prophesied among them.
  footnotes:
  - marker: a
    text: Or 'to Gibeah.' The Hebrew form may be read as a place-name or as 'to the hill.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 그곳, 그 언덕에 이르렀는데, 보십시오, 한 무리의 예언자들이 그를 맞으러 왔습니다. 하나님의 영이 그에게 갑자기 임하였고, 그는 그들 가운데에서 예언하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 형태는 ‘기브아로’일 수도 있고 ‘그 언덕으로’일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַגִּבְעָתָה
  english_pob_choice: to the hill
  chosen_korean: 그 언덕에
  alternatives_korean:
  - 기브아에
  - 그 언덕으로
  lexicon: HALOT
  rationale: 형태상 지시성이 있는 지명/보통명사 모두 가능하지만, 이 문맥에서는 앞선 표지된 장소를 가리키는 ‘그 언덕’이 자연스럽고 원문의 일반명사적 뉘앙스를 살립니다.
- source_word: חֶבֶל נְבִאִים
  english_pob_choice: a band of prophets
  chosen_korean: 한 무리의 예언자들
  alternatives_korean:
  - 예언자들의 한 떼
  - 예언자들의 한 무리
  lexicon: HALOT
  rationale: חֶבֶל은 여기서 끈이 아니라 집단을 뜻하므로, 현대 한국어에서 자연스러운 ‘한 무리’로 옮겨 집단성을 살렸습니다.
- source_word: לִקְרָאתוֹ
  english_pob_choice: came to meet him
  chosen_korean: 그를 맞으러
  alternatives_korean:
  - 그에게로
  - 그를 만나러
  lexicon: HALOT
  rationale: ‘그를 맞으러’는 목적적 이동을 드러내며, 단순한 방향 이동보다 ‘마주 나와 만남’의 뜻을 잘 전달합니다.
- source_word: רוּחַ אֱלֹהִים
  english_pob_choice: the Spirit of God
  chosen_korean: 하나님의 영
  alternatives_korean:
  - 하나님의 성령
  - 하나님에게서 온 영
  lexicon: HALOT
  rationale: 본문의 신적 능력 부여 맥락에서는 ‘하나님의 영’이 가장 직접적이며, 성령으로 특정하기보다 히브리어 표현의 폭을 유지합니다.
- source_word: וַתִּצְלַח עָלָיו
  english_pob_choice: rushed upon him
  chosen_korean: 그에게 갑자기 임하였고
  alternatives_korean:
  - 그에게 강하게 임하였고
  - 그에게 덮쳤고
  lexicon: HALOT
  rationale: צָלַח과 רוח의 결합은 급격하고 강력한 임재를 나타내므로, ‘갑자기 임하다’로 번역해 힘과 순간성을 함께 살렸습니다.
theological_decisions:
- issue: רוּחַ אֱלֹהִים의 신학적 범위
  chosen_reading: 하나님의 영이 사울에게 임해 그를 예언하게 하시는 하나님의 주권적 역사로 읽습니다.
  alternative_readings:
  - 단순한 영감적 체험으로만 읽기
  - 후대의 정밀한 성령론으로 곧장 동일시하기
  rationale: 사무엘상의 서술은 사울의 사역 시작을 알리는 표지로서 하나님의 능동적 개입을 강조하지만, 본문 자체는 후대 신학 용어로 과잉 규정하지 않습니다.
  doctrine_reference: 본문 수준의 신적 임재/권능 표현을 유지
