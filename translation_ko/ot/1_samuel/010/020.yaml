    text: Or 'was selected.' The Hebrew literally says 'was taken,' referring here to selection by lot.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사무엘이 이스라엘의 모든 지파를 가까이 나오게 하였더니, 베냐민 지파가 뽑혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘붙잡혔다’ 또는 ‘잡혔다’라는 뜻입니다. 이 문맥에서는 제비뽑기로 뽑힌 것을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּקְרֵב
  english_pob_choice: brought near
  chosen_korean: 가까이 부르니
  alternatives_korean:
  - 가까이 데려오니
  - 앞으로 나오게 하니
  - 가까이 가져오니
  lexicon: HALOT
  rationale: הִפְעִיל형 קרב의 핵심은 ‘가까이 오게 하다/가까이 부르다’이므로, 제사적·공적 소집 뉘앙스를 살려 자연스러운 한국어로 옮겼습니다.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: all the tribes of Israel
  chosen_korean: 이스라엘의 모든 지파
  alternatives_korean:
  - 이스라엘의 온 지파들
  - 이스라엘의 각 지파
  lexicon: HALOT
  rationale: ‘כָּל’과 복수 구성구를 그대로 반영해 집합 전체를 가리키는 표현으로 옮겼습니다.
- source_word: וַיִּלָּכֵד
  english_pob_choice: was taken
  chosen_korean: 뽑혔습니다
  alternatives_korean:
  - 잡혔습니다
  - 선택되었습니다
  - 가려졌습니다
  lexicon: HALOT
  rationale: 문맥상 전투적 ‘붙잡힘’이 아니라 제비뽑기/선정의 결과이므로, 영어 POB의 주해처럼 실제 의미를 드러내는 ‘뽑히다’를 택했습니다.
- source_word: שֵׁבֶט בִּנְיָמִן
  english_pob_choice: the tribe of Benjamin
  chosen_korean: 베냐민 지파
  alternatives_korean:
  - 베냐민의 지파
  - 베냐민 집안
  lexicon: HALOT
  rationale: 단수 ‘지파’ + 고유명사의 표준 한국어 성경 표현을 따라, 선택된 단위를 분명하게 했습니다.
theological_decisions:
- issue: 제비뽑기 결과를 어떻게 표현할지
  chosen_reading: ‘뽑혔습니다’로 옮겨, 선택의 주체가 인간이 아니라 하나님 앞에서의 제비뽑기라는 장면을 드러냈습니다.
  alternative_readings:
  - ‘선택되었습니다’
  - ‘잡혔습니다’
  rationale: 히브리어 원문은 문자적으로 ‘붙잡혔다’이지만, 본문 맥락에서는 제비뽑기 선정을 뜻하므로 의미를 드러내되 과도하게 해설적이지 않게 했습니다.
  doctrine_reference: 섭리와 선택의 서술 방식
