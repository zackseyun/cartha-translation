  to: 사울도 기브아에 있는 자기 집으로 갔습니다. 하나님께서 그들의 마음을 움직이신 용사들도 그와 함께 갔습니다.
  rationale: 원문의 두 동사, 곧 사울이 자기 집으로 간 일과 하나님께서 마음을 움직이신 용사들이 사울과 함께 간 일을 각각 보존했습니다. ‘용사들’은 הַחַיִל의 문맥상 적절한 번역이며, 하나님의 작용은 특정 교리적 기제로 확대하지 않았습니다.
  reviewer_model: gpt-5.6-terra
