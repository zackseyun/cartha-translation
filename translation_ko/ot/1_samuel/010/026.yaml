id: 1SA.10.26
reference: 1 Samuel 10:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַ֨ם שָׁא֔וּל הָלַ֥ךְ לְ/בֵית֖/וֹ גִּבְעָ֑תָ/ה וַ/יֵּלְכ֣וּ עִמּ֔/וֹ הַ/חַ֕יִל אֲשֶׁר נָגַ֥ע אֱלֹהִ֖ים בְּ/לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/026.yaml
  text: Saul also went to his home at Gibeah[b][a], and with him went the valiant men whose hearts God had touched.
  footnotes:
  - marker: a
    text: Or 'the men of valor' or 'the warriors.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'whose hearts God had touched'; the idiom indicates God moved their inner disposition.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울도 기브아에 있는 자기 집으로 갔습니다. 그와 함께한 사람들은 하나님이 그들의 마음을 감동시키신 용사들이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: also
  chosen_korean: 도
  alternatives_korean:
  - 또한
  - 그리고
  lexicon: HALOT
  rationale: 서술을 이어 주는 부가 의미를 한국어 조사 ‘도’로 간결하게 살려, 사울만의 이동이 아니라 그 역시 포함된다는 점을 자연스럽게 드러냅니다.
- source_word: הָלַךְ לְבֵיתוֹ גִּבְעָתָה
  english_pob_choice: went to his home at Gibeah
  chosen_korean: 기브아에 있는 자기 집으로 갔습니다
  alternatives_korean:
  - 기브아에 있는 그의 집으로 갔습니다
  - 기브아로 집에 갔습니다
  lexicon: HALOT
  rationale: ‘집으로 갔다’와 ‘기브아’를 함께 살려 장소와 목적지를 모두 드러내되, 한국어 어순에 맞게 자연스럽게 정리했습니다.
- source_word: הַחַיִל
  english_pob_choice: the valiant men
  chosen_korean: 용사들
  alternatives_korean:
  - 용맹한 사람들
  - 전사들
  - 무사들
  lexicon: HALOT
  rationale: 문맥상 군대 전체가 아니라 사울을 따르는 유능한 전투 집단을 가리키므로, ‘용사들’로 간결하게 옮겼습니다.
- source_word: אֲשֶׁר נָגַע אֱלֹהִים בְּלִבָּם
  english_pob_choice: whose hearts God had touched
  chosen_korean: 하나님이 그들의 마음을 감동시키신
  alternatives_korean:
  - 하나님이 그들의 마음을 만지신
  - 하나님이 그들의 마음을 움직이신
  - 하나님이 그들의 속마음을 감동시키신
  lexicon: HALOT
  rationale: 히브리어 관용구의 내적 변화를 드러내는 ‘touch’는 한국어에서 ‘감동시키다’가 가장 자연스럽고, 지나친 교리적 해석 없이 하나님의 주도적 영향력을 보존합니다.
- source_word: לֵב
  english_pob_choice: hearts
  chosen_korean: 마음
  alternatives_korean:
  - 마음속
  - 심장
  - 심중
  lexicon: HALOT
  rationale: 히브리어 לֵב의 인지·의지·정서가 포함된 내면 전체를 한국어 ‘마음’이 가장 무리 없이 담아냅니다.
theological_decisions:
- issue: 하나님이 사람들의 내면을 ‘touch’ 하신다는 표현의 해석 범위
  chosen_reading: 하나님의 주도적 감화를 말하되, 그 방식은 특정 교리로 좁히지 않았습니다.
  alternative_readings:
  - 회심을 뜻한다
  - 강압적 조종을 뜻한다
  - 단순한 격려를 뜻한다
  rationale: 본문은 하나님이 그들의 내면에 영향을 주셨다고 말할 뿐이므로, 내적 변화의 실제를 유지하면서도 회심·강제·감정 자극 중 어느 하나로 단정하지 않았습니다.
  doctrine_reference: 본문이 허용하는 범위 안에서 신학적 긴장을 보존합니다.
