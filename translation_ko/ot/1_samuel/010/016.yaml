reference: 1 Samuel 10:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ אֶל דּוֹד֔/וֹ הַגֵּ֤ד הִגִּיד֙ לָ֔/נוּ כִּ֥י נִמְצְא֖וּ הָ/אֲתֹנ֑וֹת וְ/אֶת דְּבַ֤ר הַ/מְּלוּכָה֙ לֹֽא הִגִּ֣יד ל֔/וֹ אֲשֶׁ֖ר אָמַ֥ר שְׁמוּאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/016.yaml
  text: Saul said to his uncle[b][a], “He plainly told us that the donkeys had been found.” But he did not tell him about the matter of the kingship that Samuel had spoken of.
  footnotes:
  - marker: a
    text: Hebrew 'the female donkeys'; English 'the donkeys' is used for natural style since the animals' sex is not central here.
    reason: lexical_alternative
  - marker: b
    text: Or 'the matter of the kingdom.' The Hebrew likely refers here to Saul's kingship rather than the kingdom as a realm.
    reason: alternative_reading
translation:
  language: ko
  text: 사울이 그의 숙부에게 말했습니다. “그가 나귀들이 찾아졌다고 분명히 말해 주었습니다.” 그러나 그는 사무엘이 말한 왕권의 일에 대해서는 그에게 말하지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘암나귀들’입니다. 그러나 이 장면에서는 동물의 성별이 핵심이 아니므로 한국어에서는 자연스럽게 ‘나귀들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘왕국의 일’로도 옮길 수 있으나, 여기서는 영토로서의 나라보다 사울의 왕권 자체를 가리키는 것으로 보는 것이 문맥에 더 잘 맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  english_pob_choice: his uncle
  chosen_korean: 그의 숙부
  alternatives_korean:
  - 그의 삼촌
  - 그의 친족
  lexicon: HALOT
  rationale: 이 문맥의 דּוֹד는 혈연 관계를 가리키며, 한국어에서는 자연스럽고 구체적인 친족 호칭인 ‘숙부’가 가장 무난합니다.
- source_word: הַגֵּד הִגִּיד
  english_pob_choice: He plainly told us
  chosen_korean: 분명히 말해 주었습니다
  alternatives_korean:
  - 확실히 말해 주었습니다
  - 명백히 말해 주었습니다
  lexicon: HALOT
  rationale: 부정사 절대형과 동사의 결합이 주는 강조를 한국어의 ‘분명히’로 옮겨, 단순 전달보다 강한 확정성을 살렸습니다.
- source_word: נִמְצְאוּ הָאֲתֹנוֹת
  english_pob_choice: the donkeys had been found
  chosen_korean: 나귀들이 찾아졌다고
  alternatives_korean:
  - 암나귀들이 찾아졌다고
  - 나귀들이 발견되었다고
  lexicon: HALOT
  rationale: 히브리어는 암나귀를 가리키지만, 본문 흐름상 동물의 성별이 핵심이 아니므로 ‘나귀들’로 자연스럽게 옮겼습니다.
- source_word: דְּבַר הַמְּלוּכָה
  english_pob_choice: the matter of the kingship
  chosen_korean: 왕권의 일
  alternatives_korean:
  - 왕국의 일
  - 왕이 되는 일
  - 왕권에 관한 일
  lexicon: HALOT
  rationale: דָּבָר는 ‘일/사안’의 뜻이고, מְלוּכָה는 여기서 영토로서의 나라보다 사울에게 선포된 왕권을 가리키므로 ‘왕권의 일’로 옮겼습니다.
theological_decisions:
- issue: דְּבַר הַמְּלוּכָה의 의미
  chosen_reading: 사무엘이 말한 왕권의 일로 이해했습니다.
  alternative_readings:
  - 왕국의 일로 이해할 수 있습니다.
  - 왕이 될 일로 풀어 옮길 수도 있습니다.
  rationale: 문맥상 사울에게 선포된 통치/왕위 문제를 가리키므로, 추상적인 ‘왕국’보다 사울의 즉위와 관련된 왕권을 드러내는 번역이 더 정확합니다.
  doctrine_reference: 1사무엘 10:1, 10:6-7과의 문맥적 연속성
- issue: 사울이 숙부에게 왕권 계시를 숨긴 점
  chosen_reading: 사울이 가족에게는 말했지만 사무엘의 왕권 언급은 감추었다는 서술로 옮겼습니다.
  alternative_readings:
  - 단순한 정보 누락으로 볼 수도 있습니다.
  - 아직 공개할 때가 아니어서 말하지 않은 것으로 볼 수도 있습니다.
  rationale: 본문은 사울의 선택적 침묵을 서술하므로, 과도한 심리 해석 없이 사실 그대로 반영했습니다.
  doctrine_reference: 본문 서술의 직접 의미
