  source_fidelity: 히브리어의 강조 표현(הַגֵּד הִגִּיד), 암나귀들, 그리고 사울이 왕권에 관한 사무엘의 말을 숙부에게 알리지 않은 대조를 충실히 반영합니다. 다만 초안의 연속된 ‘그가/그는/그에게’는 각각 사무엘·사울·숙부를 가리키지만 한국어에서는 지시 대상이 불필요하게 모호합니다.
  naturalness: ‘왕권의 일’은 뜻은 통하지만 다소 명사 중첩으로 들립니다. ‘왕권에 관한 일’이 현대 표준 한국어에서 더 자연스럽습니다. 인명과 관계 명사를 명시하면 합쇼체 서술의 명료성도 높아집니다.
