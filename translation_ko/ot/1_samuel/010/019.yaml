  text: וְ/אַתֶּ֨ם הַ/יּ֜וֹם מְאַסְתֶּ֣ם אֶת אֱלֹהֵי/כֶ֗ם אֲשֶׁר ה֣וּא מוֹשִׁ֣יעַ לָ/כֶם֮ מִ/כָּל רָעוֹתֵי/כֶ֣ם וְ/צָרֹֽתֵי/כֶם֒ וַ/תֹּ֣אמְרוּ ל֔/וֹ כִּי מֶ֖לֶךְ תָּשִׂ֣ים עָלֵ֑י/נוּ וְ/עַתָּ֗ה הִֽתְיַצְּבוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/שִׁבְטֵי/כֶ֖ם וּ/לְ/אַלְפֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/019.yaml
  text: But today you have rejected your God[a], who himself saves you from all your calamities and distresses, and you have said to him, ‘No[b], but set a king over us.’ So now present yourselves before Yahweh by your tribes and by your thousands.
  footnotes:
  - marker: a
    text: Or 'from all your calamities and distresses.' The Hebrew terms can refer to evils suffered, calamities, troubles, or afflictions.
    reason: lexical_alternative
  - marker: b
    text: Or 'by your clans' or 'by your units of a thousand.' The Hebrew 'thousands' can denote social or military subdivisions, not only a literal number.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 오늘 여러분은 여러분의 하나님을 버렸습니다. 그분은 여러분을 모든 재난과 고통에서 친히 구원하시는 분인데, 여러분은 그분에게 ‘아니요, 우리 위에 왕을 세워 주십시오’라고 말했습니다. 그러므로 이제 여러분의 지파별로, 그리고 천 명 단위별로 야훼 앞에 나오십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재난과 고통’은 히브리어 רָעוֹת와 צָרוֹת의 의미를 살린 번역입니다. 두 말은 재앙, 환난, 곤경, 압박 등을 가리킬 수 있습니다.
    reason: source_note
  - marker: b
    text: ‘천 명 단위’는 히브리어 ‘천들’이 가족·군사·행정 단위를 가리킬 수 있다는 뜻을 반영한 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: מְאַסְתֶּם
  english_pob_choice: have rejected
  chosen_korean: 버렸습니다
  alternatives_korean:
  - 거절했습니다
  - 배척했습니다
  lexicon: HALOT
  rationale: מָאַס는 단순한 거절보다 관계적·언약적 단절의 뉘앙스를 띠므로, 여기서는 자연스러운 한국어로 ‘버리다’가 그 결을 잘 드러냅니다.
- source_word: מִכָּל רָעוֹתֵיכֶם וְצָרֹתֵיכֶם
  english_pob_choice: from all your calamities and distresses
  chosen_korean: 모든 재난과 고통에서
  alternatives_korean:
  - 모든 재앙과 환난에서
  - 모든 악과 곤경에서
  lexicon: HALOT
  rationale: 두 명사는 서로 겹치지만 완전히 같지는 않으므로, 한국어로도 두 항을 유지하면서 자연스럽고 현대적인 표현인 ‘재난과 고통’을 택했습니다.
- source_word: הִתְיַצְּבוּ
  english_pob_choice: present yourselves
  chosen_korean: 나오십시오
  alternatives_korean:
  - 서십시오
  - 자세를 갖추십시오
  lexicon: HALOT
  rationale: 공식적인 소집 장면에서 ‘자신을 드러내어 앞에 서다’는 뜻을 한국어 구어체가 아닌 명령형 공손 표현인 ‘나오십시오’로 간결하게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 신명기적 고유명은 ‘야훼’로 옮겨, 호칭 대체가 아니라 고유한 이름을 보존했습니다.
theological_decisions:
- issue: 사무엘의 인용문에서 כִּי의 반대·대조 뉘앙스
  chosen_reading: ‘아니요, 우리 위에 왕을 세워 주십시오’
  alternative_readings:
  - ‘우리 위에 왕을 세워 주십시오’
  - ‘그렇지 않고 우리 위에 왕을 세워 주십시오’
  rationale: 문맥상 하나님의 구원 행위에 대한 거절과 왕 요구를 강하게 대조하므로, 인용문 앞에 ‘아니요’를 두어 원문의 반박적 힘을 드러냈습니다.
  doctrine_reference: 문맥상 반역적 요청의 강조
- issue: 지파와 אלף의 행정적 분류
  chosen_reading: 여러분의 지파별로, 그리고 천 명 단위별로
  alternative_readings:
  - 여러분의 지파별로, 그리고 여러분의 천인대별로
  - 여러분의 지파와 여러분의 천 명씩으로
  rationale: אלף는 단순 수량이 아니라 행정·군사적 분류를 가리킬 수 있으므로, 본문에서는 문자적 숫자보다 구조적 의미를 살린 ‘천 명 단위’로 옮겼습니다.
  doctrine_reference: 본문의 행정적 소집 절차
