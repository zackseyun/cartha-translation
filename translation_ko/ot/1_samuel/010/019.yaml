    rationale: ‘나오십시오’는 소집의 이동을 나타내지만, 히트파엘 동사는 야훼 앞에 정식으로 서거나 자리 잡는 행위를 가리킵니다. ‘앞에 서십시오’가 더 가깝습니다.
