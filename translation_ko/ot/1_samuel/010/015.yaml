translation:
  language: ko
  text: 그때 사울의 삼촌이 말했습니다. “부디 사무엘이 너희에게 무슨 말을 했는지 내게 알려 주십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 ‘너희에게’는 복수형으로, 사울과 그의 종을 함께 가리키는 말일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그래서 ... 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 와우 연속을 한국어의 자연스러운 시간 전환 표현으로 옮겼습니다.
- source_word: דּוֹד שָׁאוּל
  english_pob_choice: Saul’s uncle
  chosen_korean: 사울의 숙부
  alternatives_korean:
  - 사울의 삼촌
  - 사울의 외삼촌/이모부
  lexicon: HALOT
  rationale: דּוֹד는 이 문맥에서 ‘uncle’이므로, 표준어로 가장 무난한 친족어인 ‘숙부’로 옮겼습니다.
- source_word: הַגִּידָה נָּא לִי
  english_pob_choice: Please tell me
  chosen_korean: 제발 내게 ... 알려 주십시오
  alternatives_korean:
  - 부디 내게 ... 말해 주십시오
  - 제발 내게 ... 말해 주시지요
  lexicon: HALOT
  rationale: 히필 명령형 נגד는 ‘알리다/말해 주다’의 뜻이므로, 청유의 נָא를 살려 공손한 요청으로 옮겼습니다.
- source_word: לָכֶם
  english_pob_choice: to you
  chosen_korean: 너희에게
  alternatives_korean:
  - 여러분에게
  - 당신들에게
  lexicon: HALOT
  rationale: 히브리어 복수형을 살려 사울과 그의 종을 함께 가리키는 뉘앙스를 유지했습니다.
