  text: וְ/חָלַפְתָּ֨ מִ/שָּׁ֜ם וָ/הָ֗לְאָה וּ/בָ֨אתָ֙ עַד אֵל֣וֹן תָּב֔וֹר וּ/מְצָא֤וּ/ךָ שָּׁם֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים עֹלִ֥ים אֶל הָ/אֱלֹהִ֖ים בֵּֽית אֵ֑ל אֶחָ֞ד נֹשֵׂ֣א שְׁלֹשָׁ֣ה גְדָיִ֗ים וְ/אֶחָד֙ נֹשֵׂ֗א שְׁלֹ֨שֶׁת֙ כִּכְּר֣וֹת לֶ֔חֶם וְ/אֶחָ֥ד נֹשֵׂ֖א נֵֽבֶל יָֽיִן־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/003.yaml
  text: 'Then you will pass on from there and go farther[a], and you will come to the oak of Tabor. There three men going up to God at Bethel will meet you: one carrying three young goats, another carrying three loaves of bread[c][b], and another carrying a wineskin.'
  footnotes:
  - marker: a
    text: Or 'the terebinth of Tabor.' The Hebrew word can refer to a large tree such as an oak or terebinth.
    reason: lexical_alternative
  - marker: b
    text: Literally 'going up to God at Bethel'; this likely refers to traveling to a worship site at Bethel.
    reason: cultural_note
  - marker: c
    text: Or 'a wineskin of wine.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 더 나아가면, 다볼의 상수리나무에 이를 것입니다. 거기서 하나님께 올라가는 벧엘의 세 사람이 당신을 만날 터인데, 그들 가운데 하나는 세 어린 염소를, 하나는 떡 세 개를, 또 하나는 가죽부대를 지니고 있을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘상수리나무’는 히브리어 אֵלוֹן이 가리킬 수 있는 큰 나무의 한 유형입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘하나님께 올라가서 벧엘에 있는’이지만, 문맥상 벧엘의 예배 장소로 가는 길을 가리키는 것으로 보입니다.
    reason: cultural_note
  - marker: c
    text: נֵבֶל은 여기서 포도주를 담는 가죽 용기를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָלַפְתָּ וָהָלְאָה
  english_pob_choice: you will pass on / go farther
  chosen_korean: 더 나아가면
  alternatives_korean:
  - 그곳에서 지나가면
  - 그곳에서 계속 가면
  - 그곳에서 더 가면
  lexicon: HALOT
  rationale: 연속적인 이동을 나타내는 שני 동사를 한국어로 자연스럽게 압축하되, 단순한 ‘지나가다’보다 계속 전진하는 느낌을 살렸습니다.
- source_word: אֵלוֹן תָּבוֹר
  english_pob_choice: the oak of Tabor
  chosen_korean: 다볼의 상수리나무
  alternatives_korean:
  - 다볼의 떡갈나무
  - 다볼의 큰 나무
  - 다볼의 떨기나무
  lexicon: HALOT
  rationale: אֵלוֹן은 큰 나무를 가리킬 수 있어 ‘상수리나무’로 옮기면 한국어에서 가장 자연스럽고, 지명 다볼과의 결합도 보존됩니다.
- source_word: וּמְצָאוּךָ
  english_pob_choice: will meet you
  chosen_korean: 당신을 만날 터인데
  alternatives_korean:
  - 당신을 찾을 터인데
  - 당신과 마주칠 터인데
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘찾다’보다 예고된 조우를 나타내는 ‘만나다’가 적절합니다.
- source_word: עֹלִים אֶל הָאֱלֹהִים בֵּית אֵל
  english_pob_choice: going up to God at Bethel
  chosen_korean: 하나님께 올라가는 벧엘의
  alternatives_korean:
  - 벧엘에서 하나님께 올라가는
  - 벧엘로 하나님께 올라가는
  - 벧엘에서 예배하러 올라가는
  lexicon: HALOT
  rationale: 원문의 ‘하나님께 올라가는’과 ‘벧엘’을 함께 살리되, 명시되지 않은 ‘예배하러’는 덧붙이지 않았습니다.
- source_word: גְדָיִים
  english_pob_choice: young goats
  chosen_korean: 세 어린 염소
  alternatives_korean:
  - 세 새끼 염소
  - 세 염소 새끼
  - 세 어린 염소들
  lexicon: HALOT
  rationale: 어린 염소라는 뜻을 분명하게 전달하면서도, 목록 형식에 맞게 간결하게 옮겼습니다.
- source_word: נֵבֶל יָיִן
  english_pob_choice: a wineskin
  chosen_korean: 가죽부대
  alternatives_korean:
  - 포도주 가죽부대
  - 물가죽부대
  - 가죽 물통
  lexicon: HALOT
  rationale: נֵבֶל은 액체를 담는 가죽 용기를 가리킬 수 있으므로, 영어 POB의 ‘wineskin’에 해당하는 핵심 형상을 한국어로 무리 없이 표현했습니다.
theological_decisions:
- issue: 벧엘로 올라간다는 표현의 종교적 함의
  chosen_reading: 명시된 범위 안에서 하나님께 올라가는 순례/상향 동작으로 옮기고, 추가적인 예배 설명은 넣지 않았습니다.
  alternative_readings:
  - 벧엘에서 예배하러 올라가는
  - 하나님의 집 벧엘로 올라가는
  rationale: 히브리어는 신앙적 방향성을 분명히 하지만, 본문 자체가 ‘예배’라는 동사를 쓰지는 않으므로 그 이상의 해석은 절제했습니다.
  doctrine_reference: translation philosophy; source-bound restraint
