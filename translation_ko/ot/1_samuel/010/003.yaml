base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/003.yaml
  text: 'Then you will pass on from there and go farther[a], and you will come to the oak of Tabor. There three men going up to God at Bethel will meet you: one carrying three young goats, another carrying three loaves of bread[c][b], and another carrying a wineskin.'
  footnotes:
  - marker: a
    text: Or 'the terebinth of Tabor.' The Hebrew word can refer to a large tree such as an oak or terebinth.
    reason: lexical_alternative
  - marker: b
    text: Literally 'going up to God at Bethel'; this likely refers to traveling to a worship site at Bethel.
    reason: cultural_note
  - marker: c
    text: Or 'a wineskin of wine.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳을 지나 더 나아가면 다볼의 상수리나무[a]에 이를 것입니다. 거기서 벧엘에서 하나님께 올라가는 세 사람이 당신을 만날 것입니다.[b] 한 사람은 어린 염소 세 마리를, 다른 한 사람은 빵 세 덩이를, 또 다른 한 사람은 포도주가 든 가죽부대를 가지고 있을 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘상수리나무’로 번역한 히브리어 אֵלוֹן은 떡갈나무나 테레빈나무 같은 큰 나무를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘벧엘에서 하나님께 올라가는’입니다. 벧엘과 관련된 예배 장소를 향해 하나님께 나아가는 길을 가리키는 것으로 보이지만, 본문은 의식의 내용을 더 구체적으로 말하지 않습니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 직역하면 ‘포도주의 가죽부대’입니다.
    reason: lexical_alternative
