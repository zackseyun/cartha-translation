lexical_decisions:
- source_word: וַיְכַל מֵהִתְנַבּוֹת
  english_pob_choice: When he had finished prophesying
  chosen_korean: 예언을 마치자
  alternatives_korean:
  - 예언하기를 마치자
  - 예언하는 일을 끝내자
  - 예언을 그치자
  lexicon: HALOT
  rationale: כלה + מן/infinitive는 어떤 행위를 ‘마치다/그치다’의 뜻으로 자연스럽게 나타내며, 문맥상 앞선 예언 행위의 완료를 말하므로 한국어에서도 간결하게 ‘예언을 마치자’로 옮겼습니다.
- source_word: וַיָּבֹא
  english_pob_choice: he came
  chosen_korean: 그가 … 갔습니다
  alternatives_korean:
  - 그가 왔습니다
  - 그가 도착했습니다
  lexicon: HALOT
  rationale: בוא는 서술 관점에 따라 ‘오다/가다’가 가능하지만, 여기서는 이전 행위 이후 산당으로 이동하는 흐름이므로 한국어 서술에서는 ‘갔습니다’가 가장 자연스럽습니다.
- source_word: הַבָּמָה
  english_pob_choice: the high place
  chosen_korean: 산당
  alternatives_korean:
  - 높은 곳
  - 산 위 제사 장소
  - 고지
  lexicon: HALOT
  rationale: במה는 예배·제의 장소인 ‘high place’를 가리키므로, 한국어 성경에서 관용적으로 쓰이는 ‘산당’을 택하되, 본문 의미를 흐리지 않도록 직설적으로 처리했습니다.
theological_decisions:
- issue: הַבָּמָה의 예배 장소 성격을 어떻게 드러낼지
  chosen_reading: 산당으로 옮겨, 본문이 말하는 제의적 고지라는 점을 보존했습니다.
  alternative_readings:
  - 높은 곳으로 순화해 일반 지형처럼 만들기
  - 산당이라고 두되 추가 해설 없이 그대로 유지하기
  rationale: 이 구절은 장소의 성격을 최소한 드러내지만, 여기서 그 장소의 정당성이나 평가를 본문 밖에서 해결할 필요는 없습니다. 따라서 전통적이지만 의미를 전달하는 ‘산당’을 사용했습니다.
  doctrine_reference: '번역 원칙: 본문이 가진 제의적·역사적 긴장을 해소하지 말고, 독자가 문맥에서 판단하도록 둡니다.'
