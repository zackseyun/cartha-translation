  to: 그리고 그가 사무엘에게서 떠나려고 어깨를 돌릴 때에, 하나님께서 그의 마음을 다른 마음으로 바꾸어 주셨습니다[a]. 그리고 이 모든 표징이 바로 그날 일어났습니다.
  rationale: 하나님께서 사울의 내적 상태를 ‘다른 마음’으로 바꾸셨다는 히브리어의 변화 동사를 본문에 반영했습니다. ‘다른 마음’을 유지하여 회심이나 중생 등의 후대 신학 범주를 덧붙이지 않았으며, 표징들의 발생도 본문의 단순 서술에 맞추어 옮겼습니다.
