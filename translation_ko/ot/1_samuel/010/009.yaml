id: 1SA.10.9
reference: 1 Samuel 10:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה כְּ/הַפְנֹת֤/וֹ שִׁכְמ/וֹ֙ לָ/לֶ֨כֶת֙ מֵ/עִ֣ם שְׁמוּאֵ֔ל וַ/יַּהֲפָךְ ל֥/וֹ אֱלֹהִ֖ים לֵ֣ב אַחֵ֑ר וַ/יָּבֹ֛אוּ כָּל הָ/אֹת֥וֹת הָ/אֵ֖לֶּה בַּ/יּ֥וֹם הַ/הֽוּא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/009.yaml
  text: And it happened[a], when he turned his back to go from Samuel, that God gave him another heart[b], and all these signs came to pass on that day.
  footnotes:
  - marker: a
    text: Or 'when he turned his back to leave.' The Hebrew literally says 'turned his shoulder,' an idiom for departing.
    reason: lexical_alternative
  - marker: b
    text: Or 'God gave him a different heart.' The Hebrew is literally 'God changed for him another heart.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그가 사무엘에게서 떠나 가려고 어깨를 돌리는 순간에, 하나님께서 그에게 다른 마음을 주셨고[a], 그날 그 모든 표징이 이루어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘떠나려 할 때’. 히브리어는 문자적으로 ‘어깨를 돌리다’라고 하며, 떠남을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it happened
  chosen_korean: 그리고 … 하셨습니다
  alternatives_korean:
  - 그때 … 일어났습니다
  - 그리고 … 있었습니다
  lexicon: HALOT
  rationale: 서술 전환 공식으로서의 사건 도입을 살리되, 현대 한국어에서 자연스러운 연결어로 옮겼습니다.
- source_word: כְּהַפְנֹתוֹ שִׁכְמוֹ
  english_pob_choice: when he turned his shoulder
  chosen_korean: 어깨를 돌리는 순간에
  alternatives_korean:
  - 어깨를 돌려 떠나려 할 때
  - 등을 돌리는 순간에
  lexicon: HALOT
  rationale: 히브리어의 문자적 ‘어깨’ 이미지를 유지하면서, 떠남을 뜻하는 관용 표현으로 자연스럽게 풀었습니다.
- source_word: וַיַּהֲפָךְ … לֵב אַחֵר
  english_pob_choice: God gave him another heart
  chosen_korean: 하나님께서 그에게 다른 마음을 주셨고
  alternatives_korean:
  - 하나님께서 그에게 새 마음을 주셨고
  - 하나님께서 그를 위해 다른 마음으로 바꾸셨고
  lexicon: HALOT
  rationale: POB의 본문 선택을 따라 ‘new heart’로 단정하지 않고, ‘다른 마음’으로 원문의 ‘another heart’와 내적 변화의 긴장을 보존했습니다.
- source_word: כָּל הָאֹתֹת הָאֵלֶּה
  english_pob_choice: all these signs
  chosen_korean: 그날 그 모든 표징
  alternatives_korean:
  - 이 모든 표징
  - 그 모든 징조
  lexicon: HALOT
  rationale: 표지/예표의 의미를 가진 ‘표징’이 본문의 예언적 징조 성격을 가장 잘 드러냅니다.
theological_decisions:
- issue: 사울의 ‘다른 마음’의 성격
  chosen_reading: 내적 성향의 실제적 변화는 드러내되, 이를 곧바로 회심·중생·단순한 용기로 특정하지 않았습니다.
  alternative_readings:
  - 새 마음을 받았다
  - 담대함을 얻었다
  - 인격이 변했다
  rationale: 본문은 야훼의 주권적 개입으로 인한 내적 변화를 말하지만, 그 범위를 이후 신학 범주로 미리 좁히지 않습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
