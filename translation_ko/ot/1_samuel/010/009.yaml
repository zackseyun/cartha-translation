  naturalness: ‘어깨를 돌리는 순간에’는 한국어에서 다소 부자연스럽습니다. ‘어깨를 돌릴 때에’가 원문의 어깨 관용어를 보존하면서도 더 자연스럽습니다.
  terminology: ‘사무엘’, ‘하나님’, ‘마음’, ‘표징’은 적절합니다. ‘새 마음’으로 바꾸지 않고 ‘다른 마음’을 유지하여 본문의 표현과 신학적 여지를 보존해야 합니다.
