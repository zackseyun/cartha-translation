base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/011.yaml
  text: And it happened that all who had known him formerly saw[a], and behold, he was prophesying with the prophets. So the people said, each man to his neighbor[b], “What has happened to the son of Kish? Is Saul also among the prophets?”
  footnotes:
  - marker: a
    text: Or, “had known him from yesterday and the day before,” a Hebrew idiom meaning “had known him previously.”
    reason: lexical_alternative
  - marker: b
    text: Or, “Is even Saul among the prophets?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이전부터 그를 알던 모든 사람이 그를 보고, 보니 그가 예언자들과 함께 예언하고 있었습니다. 그러자 백성은 서로 말했습니다. 「기스의 아들에게 무슨 일이 생긴 것입니까? 사울도[b] 예언자들 가운데 있습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “어제와 그제부터 그를 알던.” 이는 “이전부터 그를 알던”이라는 뜻의 히브리어 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “사울이 심지어 예언자들 가운데 있단 말인가?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그러자
  alternatives_korean:
  - 그 일이 있었습니다
  - 그리고 일어났습니다
  lexicon: HALOT
  rationale: 서사 전개를 잇는 wayyiqtol의 기능을 살리되, 한국어에서는 자연스러운 전환 표지인 ‘그러자’로 압축해 현대적 문체를 유지했습니다.
- source_word: יֹדְעוֹ מֵאִתְּמוֹל שִׁלְשׁוֹם
  english_pob_choice: had known him previously
  chosen_korean: 어제와 그제까지 그를 알던
  alternatives_korean:
  - 그를 이전부터 알던
  - 그를 옛날부터 알던
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하기보다 ‘이전부터 알던’의 뜻을 살리되, 원문의 ‘어제/그제’ 뉘앙스를 드러내어 과거의 확실한 근접성을 보존했습니다.
- source_word: נִבָּא
  english_pob_choice: was prophesying
  chosen_korean: 예언하고 있었습니다
  alternatives_korean:
  - 예언하였습니다
  - 예언자처럼 행동하고 있었습니다
  lexicon: HALOT
  rationale: 지속 중인 예언 행위를 나타내는 진행형을 살렸고, 단순한 직분 부여나 황홀경으로 축소하지 않도록 ‘예언하고 있었습니다’로 옮겼습니다.
- source_word: בַּנְּבִיאִים
  english_pob_choice: among the prophets
  chosen_korean: 선지자들 가운데서
  alternatives_korean:
  - 선지자들 중에
  - 예언자들 가운데서
  lexicon: HALOT
  rationale: עִם와 구분되는 마지막 구문이므로 ‘among’의 집합적 의미를 살려 ‘가운데서’로 옮겼습니다. 본문 맥락상 ‘선지자들’이 한국어 독자에게 더 익숙한 예언자 집단 명칭입니다.
- source_word: הֲגַם
  english_pob_choice: also
  chosen_korean: 도
  alternatives_korean:
  - 심지어
  - 또한
  lexicon: HALOT
  rationale: 놀라움을 띤 의문을 한국어에서 자연스럽게 표현하려면 ‘사울도’가 가장 간결합니다. 각주에서 ‘심지어’의 강조 가능성도 열어 두었습니다.
theological_decisions:
- issue: 사울의 예언 행위를 어떻게 이해할지
  chosen_reading: 본문은 사울이 다른 선지자들 사이에서 실제로 예언하고 있는 장면을 보고로 제시하며, 그 행위를 일시적 사건으로 남겨 둡니다.
  alternative_readings:
  - 사울이 예언자 직분을 받았다는 뜻으로 확정한다
  - 단순한 종교적 흥분 상태로 축소한다
  rationale: 히브리어 동사는 실제 예언 행위를 가리키지만, 본문은 그것을 사울의 영구적 신분으로 해석하라고 말하지 않습니다. 따라서 사건의 사실성과 해석의 유보를 함께 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
