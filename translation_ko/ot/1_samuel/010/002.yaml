revisions:
- from: 오늘 내게서 떠나가면[a], 당신은 베냐민 지경의 라헬의 무덤 곁, 젤르사에서 두 사람을 만나게 될 것입니다. 그들이 당신에게 말할 것입니다. “찾으러 갔던 나귀들이 발견되었습니다. 보십시오, 당신의 아버지는 나귀들은 더는 걱정하지 않고 당신들을 두고 근심하며[b] 말하고 계십니다. ‘내 아들을 위해 내가 어떻게 해야 하나?’”
  to: 오늘 당신이 나를 떠나갈 때, 당신은 베냐민 지경의 셀사에 있는 라헬의 무덤 곁에서 두 사람을 만나게 될 것입니다.[a] 그들은 당신에게 이렇게 말할 것입니다. “찾으러 갔던 나귀들이 발견되었습니다. 보십시오, 당신의 아버지는 나귀들에 대한 걱정은 접어 두고 당신들을[b] 근심하며 이렇게 말합니다. ‘내 아들을 위해 내가 어떻게 해야 할까?’”
  rationale: 셀사를 통용되는 한국어 성경 지명 표기로 바로잡았습니다. 장소 수식어를 ‘베냐민 지경의 셀사에 있는 라헬의 무덤 곁’으로 결속하여 원문의 위치 정보를 자연스럽게 보존했습니다. 두 사람이 전하는 말 안에 아버지의 발화를 중첩 인용으로 분명히 표시했습니다. ‘나귀들에 대한 걱정은 접어 두고’는 ‘나귀들의 일을 버려두고’라는 히브리어 관용의 문맥상 의미를 자연스럽게 드러내되, 아버지의 염려가 사울 일행으로 옮겨 갔다는 대비를 유지합니다.
