  text: בְּ/לֶכְתְּ/ךָ֤ הַ/יּוֹם֙ מֵ/עִמָּדִ֔/י וּ/מָצָאתָ֩ שְׁנֵ֨י אֲנָשִׁ֜ים עִם קְבֻרַ֥ת רָחֵ֛ל בִּ/גְב֥וּל בִּנְיָמִ֖ן בְּ/צֶלְצַ֑ח וְ/אָמְר֣וּ אֵלֶ֗י/ךָ נִמְצְא֤וּ הָ/אֲתֹנוֹת֙ אֲשֶׁ֣ר הָלַ֣כְתָּ לְ/בַקֵּ֔שׁ וְ/הִנֵּ֨ה נָטַ֤שׁ אָבִ֨י/ךָ֙ אֶת דִּבְרֵ֣י הָ/אֲתֹנ֔וֹת וְ/דָאַ֤ג לָ/כֶם֙ לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לִ/בְנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/002.yaml
  text: When you leave me today[a], you will find two men near Rachel’s tomb in the territory of Benjamin at Zelzah, and they will say to you, ‘The donkeys that you went to look for have been found, and look, your father has stopped caring about the donkeys and is anxious about you, saying[c][b], “What shall I do about my son?”’
  footnotes:
  - marker: a
    text: 'Hebrew ''for you'' is plural, likely referring to Saul and the servant traveling with him: ''is anxious about you both.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'at the border of Benjamin.' The Hebrew word can mean either 'border' or 'territory.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'your father has left the matter of the donkeys.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘 내게서 떠나가면[a], 당신은 베냐민 지경의 라헬의 무덤 곁, 젤르사에서 두 사람을 만나게 될 것입니다. 그들이 당신에게 말할 것입니다. “찾으러 갔던 나귀들이 발견되었습니다. 보십시오, 당신의 아버지는 나귀들은 더는 걱정하지 않고 당신들을 두고 근심하며[b] 말하고 계십니다. ‘내 아들을 위해 내가 어떻게 해야 하나?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘오늘 내게서 떠나갈 때’라는 시간절 구조입니다.
    reason: source_note
  - marker: b
    text: 히브리어의 ‘너희에게/당신들에게’는 복수형으로, 사울과 함께한 종을 함께 가리킬 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתְּךָ הַיּוֹם מֵעִמָּדִי
  english_pob_choice: When you leave me today
  chosen_korean: 오늘 내게서 떠나가면
  alternatives_korean:
  - 오늘 내 곁을 떠나면
  - 오늘 나를 떠나면
  lexicon: HALOT
  rationale: בְּ + 부정사구는 시간절로 처리하는 것이 자연스럽고, מֵעִמָּדִי는 단순한 이동보다 ‘내게서/내 곁에서 떠남’의 뉘앙스를 살립니다.
- source_word: בִּגְבוּל בִּנְיָמִן
  english_pob_choice: in the territory of Benjamin
  chosen_korean: 베냐민 지경의
  alternatives_korean:
  - 베냐민 경계의
  - 베냐민 경내의
  lexicon: HALOT
  rationale: גְּבוּל은 ‘경계’와 ‘지경/영역’ 모두 가능하므로, 장소 진술로서는 ‘지경’이 한국어에서 가장 무리 없이 넓은 의미를 담습니다.
- source_word: נָטַשׁ אָבִיךָ אֶת דִּבְרֵי הָאֲתֹנוֹת
  english_pob_choice: your father has stopped caring about the donkeys
  chosen_korean: 당신의 아버지는 나귀들은 더는 걱정하지 않고
  alternatives_korean:
  - 당신의 아버지는 나귀들 문제를 더는 거두지 않고
  - 당신의 아버지는 나귀들 일을 더는 돌보지 않고
  lexicon: HALOT
  rationale: 직역하면 ‘나귀들의 일/문제’를 버렸다는 뜻이지만, 문맥상 아버지가 나귀보다 사울과 종을 더 염려하는 상황이므로 ‘더는 걱정하지 않고’로 옮겼습니다.
- source_word: וְדָאַג לָכֶם
  english_pob_choice: and is anxious about you
  chosen_korean: 당신들을 두고 근심하며
  alternatives_korean:
  - 당신들 때문에 마음 졸이며
  - 당신들을 염려하며
  lexicon: HALOT
  rationale: לָכֶם은 복수이므로 사울과 동행한 종을 함께 가리키는 점을 살려 ‘당신들을’로 옮겼고, דאג는 단순한 관심보다 긴장된 근심을 나타내므로 ‘근심하며’가 적절합니다.
- source_word: בְּצֶלְצַח
  english_pob_choice: at Zelzah
  chosen_korean: 젤르사
  alternatives_korean:
  - 셀차
  - 젤차
  lexicon: SBL transliteration / modern Korean transliteration
  rationale: 고유명사는 음역하는 것이 원칙이므로, 히브리어 자음군에 맞춘 현대 한국어 표기를 사용했습니다.
theological_decisions:
- issue: 아버지의 관심이 나귀에서 아들 쪽으로 옮겨 가는 대비를 어떻게 드러낼지
  chosen_reading: ‘나귀들은 더는 걱정하지 않고 당신들을 두고 근심하며’로 옮겨, 물건의 분실보다 아들의 안위를 더 크게 여기는 정서를 그대로 드러냈습니다.
  alternative_readings:
  - ‘나귀 문제를 내려놓고 당신들을 걱정하며’
  - ‘나귀는 잊고 당신들에게 마음을 쓰며’
  rationale: 본문의 의도는 단순 정보 전달이 아니라 사울을 향한 아버지의 전환된 염려를 강조하는 데 있으므로, 정서적 대비를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 본문 정서와 서술 의도에 대한 번역 판단
