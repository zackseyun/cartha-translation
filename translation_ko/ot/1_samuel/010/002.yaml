theological_decisions:
- issue: 아버지의 관심이 나귀에서 아들 쪽으로 옮겨 가는 대비를 어떻게 드러낼지
  chosen_reading: ‘나귀들은 더는 걱정하지 않고 당신들을 두고 근심하며’로 옮겨, 물건의 분실보다 아들의 안위를 더 크게 여기는 정서를 그대로 드러냈습니다.
  alternative_readings:
  - ‘나귀 문제를 내려놓고 당신들을 걱정하며’
  - ‘나귀는 잊고 당신들에게 마음을 쓰며’
  rationale: 본문의 의도는 단순 정보 전달이 아니라 사울을 향한 아버지의 전환된 염려를 강조하는 데 있으므로, 정서적 대비를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 본문 정서와 서술 의도에 대한 번역 판단
