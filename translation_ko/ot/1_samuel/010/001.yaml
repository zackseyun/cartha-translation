base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/001.yaml
  text: Then Samuel took the flask of oil and poured it on his head and kissed him[a], and said, “Has not Yahweh anointed you as ruler over his inheritance?”
  footnotes:
  - marker: a
    text: Or “leader” or “prince” for “ruler.” The Hebrew term refers to one appointed to govern and is not identical in nuance to the later title “king.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사무엘이 기름 한 병을 가져다가 그의 머리에 붓고 입을 맞추며 말했습니다. “야훼께서 그의 소유 위에 통치자로 당신에게 기름을 부으신 것이 아닙니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘통치자’는 נָגִיד의 기본 의미를 따른 번역으로, 이 칭호는 후대의 공식 직함인 ‘왕’과는 뉘앙스가 다릅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּךְ הַשֶּׁמֶן
  english_pob_choice: the flask of oil
  chosen_korean: 기름 한 병
  alternatives_korean:
  - 기름 한 플라스크
  - 기름 한 병의 용기
  lexicon: HALOT
  rationale: פַּךְ는 작은 용기라는 구체성을 가지므로, 자연스러운 현대 한국어로는 ‘기름 한 병’이 가장 읽기 좋으면서도 실물 이미지를 유지합니다.
- source_word: וַיִּצֹק עַל רֹאשׁוֹ
  english_pob_choice: poured it on his head
  chosen_korean: 그의 머리에 붓고
  alternatives_korean:
  - 그의 머리 위에 붓고
  - 그의 머리 위로 부어
  lexicon: HALOT
  rationale: יצק의 기본 뜻인 ‘붓다’를 살리고, עַל רֹאשׁוֹ의 직접적 공간 관계를 한국어로 자연스럽게 옮겼습니다.
- source_word: וַיִּשָּׁקֵהוּ
  english_pob_choice: kissed him
  chosen_korean: 입을 맞추며
  alternatives_korean:
  - 그에게 입 맞추며
  - 그를 입맞추며
  lexicon: HALOT
  rationale: 단순한 ‘입맞추다’보다 서술문 안에서 동작의 연속을 살리기 위해 ‘입을 맞추며’로 옮겼습니다.
- source_word: לְנָגִיד
  english_pob_choice: as ruler
  chosen_korean: 통치자로
  alternatives_korean:
  - 지도자로
  - 다스리는 자로
  - 왕으로
  lexicon: HALOT
  rationale: נָגִיד는 왕과 동일하지 않은 임명된 통치 직분을 가리키므로, 왕으로 좁히지 않고 권한을 분명히 드러내는 ‘통치자’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 고유신명 יְהוָה를 제목이나 대체어로 가리지 않고, 프로젝트 기준에 따라 신명 그대로 ‘야훼’로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: לְנָגִיד의 직분 범위
  chosen_reading: 통치자로
  alternative_readings:
  - 왕으로
  - 지도자로
  rationale: 사울이 아직 공개적으로 ‘왕’으로 확정되기 전의 위임 장면이므로, 왕호를 앞당기지 않고 통치 직분의 성격을 유지했습니다.
  doctrine_reference: 1 Samuel 10:1 royal commissioning context
