  - severity: medium
    issue: ‘그의 소유 위에 통치자로’가 부자연스럽고 נַחֲלָתוֹ의 의미를 충분히 전달하지 못합니다.
    rationale: ‘소유 위에’는 한국어에서 통치 대상을 나타내는 자연스러운 표현이 아닙니다. ‘자기 기업을 다스릴 통치자로’는 ‘그의 기업 위에’라는 통치 관계와 נַחֲלָה의 의미를 자연스럽게 살립니다.
