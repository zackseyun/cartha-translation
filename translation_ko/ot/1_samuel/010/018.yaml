  text: וַ/יֹּ֣אמֶר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם וָ/אַצִּ֤יל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּד֙ כָּל הַ/מַּמְלָכ֔וֹת הַ/לֹּחֲצִ֖ים אֶתְ/כֶֽם׀־פ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/018.yaml
  text: 'And he said to the sons of Israel[a], “Thus says Yahweh, the God of Israel: I brought Israel up from Egypt, and I delivered you from the hand of the Egyptians and from the hand of all the kingdoms that were oppressing you.”'
  footnotes:
  - marker: a
    text: Or “the Israelites” or traditionally “the children of Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 이스라엘 자손에게 말했습니다. 「야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 내가 이스라엘을 이집트에서 올라오게 했고, 이집트 사람들의 손에서, 그리고 너희를 압박하던 모든 나라의 손에서 너희를 건져냈습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 직역입니다. 관용적으로는 ‘이스라엘 사람들’ 또는 전통적으로 ‘이스라엘의 자녀들’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 구성형을 직접 반영하면서도 한국어 성경 문맥에서 자연스럽고 공적 호칭으로 읽히는 표현을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 하나님의 고유명사를 제목어로 대체하지 않고, 본 프로젝트 기본값에 따라 음역으로 살렸습니다.
- source_word: הֶעֱלֵיתִי
  english_pob_choice: I brought ... up
  chosen_korean: 올라오게 했고
  alternatives_korean:
  - 이끌어냈고
  - 올려보냈고
  lexicon: HALOT
  rationale: 출애굽 맥락의 ‘올라오게 하다’라는 상승/이동 이미지를 유지하면서 한국어로 자연스럽게 옮겼습니다.
- source_word: וָאַצִּיל
  english_pob_choice: I delivered
  chosen_korean: 건져냈습니다
  alternatives_korean:
  - 구해냈습니다
  - 건졌습니다
  lexicon: HALOT
  rationale: ‘from the hand of’와 결합된 구출 행위를 한국어의 구체적 구원 동사로 옮겨, 단순한 법적 ‘인도’보다 구출의 힘을 살렸습니다.
- source_word: מִיַּד
  english_pob_choice: from the hand of
  chosen_korean: 손에서
  alternatives_korean:
  - 권세에서
  - 힘에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 유지해 통치·지배의 이미지를 드러냈습니다.
- source_word: הַמַּמְלָכוֹת הַלֹּחֲצִים אֶתְכֶם
  english_pob_choice: all the kingdoms that were oppressing you
  chosen_korean: 너희를 압박하던 모든 나라
  alternatives_korean:
  - 너희를 억압하던 모든 왕국
  - 너희를 누르던 모든 나라들
  lexicon: HALOT
  rationale: 분사형의 지속적 압박을 ‘압박하던’으로 살리고, ממלכות를 한국어에서 자연스러운 정치 단위인 ‘나라’로 옮겼습니다.
theological_decisions:
- issue: 노출된 신명사 יְהוָה의 처리
  chosen_reading: ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - ‘주’
  - ‘여호와’
  rationale: 본문이 하나님의 고유명을 직접 사용하므로, 전통적 대체어보다 이름 자체를 드러내는 번역을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘이집트의 손’의 주체성
  chosen_reading: ‘이집트 사람들의 손’으로 옮겼습니다.
  alternative_readings:
  - ‘이집트의 손’
  - ‘이집트의 권세’
  rationale: 개정된 영어 audit가 가리키듯 כאן의 표현은 땅 자체보다 이집트 권력/백성을 가리키므로, 한국어도 사람과 권세의 의미를 함께 드러내도록 했습니다.
  doctrine_reference: WLC/HALOT lexical sense of מִצְרַיִם in hostile-power idiom
