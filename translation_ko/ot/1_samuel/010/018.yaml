theological_decisions:
- issue: 노출된 신명사 יְהוָה의 처리
  chosen_reading: ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - ‘주’
  - ‘여호와’
  rationale: 본문이 하나님의 고유명을 직접 사용하므로, 전통적 대체어보다 이름 자체를 드러내는 번역을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘이집트의 손’의 주체성
  chosen_reading: ‘이집트 사람들의 손’으로 옮겼습니다.
  alternative_readings:
  - ‘이집트의 손’
  - ‘이집트의 권세’
  rationale: 개정된 영어 audit가 가리키듯 כאן의 표현은 땅 자체보다 이집트 권력/백성을 가리키므로, 한국어도 사람과 권세의 의미를 함께 드러내도록 했습니다.
  doctrine_reference: WLC/HALOT lexical sense of מִצְרַיִם in hostile-power idiom
