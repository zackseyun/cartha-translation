  lexicon: HALOT
  rationale: 출애굽 맥락의 ‘올라오게 하다’라는 상승/이동 이미지를 유지하면서 한국어로 자연스럽게 옮겼습니다.
- source_word: וָאַצִּיל
  english_pob_choice: I delivered
  chosen_korean: 건져냈습니다
  alternatives_korean:
