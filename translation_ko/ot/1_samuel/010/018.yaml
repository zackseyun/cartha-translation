  lexicon: HALOT
  rationale: 히브리어 관용구를 유지해 통치·지배의 이미지를 드러냈습니다.
- source_word: הַמַּמְלָכוֹת הַלֹּחֲצִים אֶתְכֶם
  english_pob_choice: all the kingdoms that were oppressing you
  chosen_korean: 너희를 압박하던 모든 나라
