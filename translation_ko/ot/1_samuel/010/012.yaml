id: 1SA.10.12
reference: 1 Samuel 10:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨עַן אִ֥ישׁ מִ/שָּׁ֛ם וַ/יֹּ֖אמֶר וּ/מִ֣י אֲבִי/הֶ֑ם עַל כֵּן֙ הָיְתָ֣ה לְ/מָשָׁ֔ל הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/012.yaml
  text: 'Then a man from there answered and said[a], “And who is their father?” Therefore it became a proverb: “Is Saul also among the prophets?”'
  footnotes:
  - marker: a
    text: Or, “And who is his father?” Some translations take the question as referring specifically to Saul, but the Masoretic Text reads “their father.”
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 거기서 한 사람이 대답하여 말했습니다. 「그들의 아버지가 누구입니까?」 그러므로 이것이 속담이 되었습니다. 「사울도 예언자들 가운데 있느냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 아버지가 누구입니까?”로도 옮길 수 있습니다. 일부 번역은 이 질문을 사울에게 직접 돌리지만, 마소라 본문은 “그들의 아버지”라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하여
  alternatives_korean:
  - 응답하여
  - 말하여
  lexicon: HALOT
  rationale: 히브리어 서사에서 후속 발화를 이끄는 관용적 동사로, 한국어에서는 자연스럽고 문어적인 「대답하여」가 가장 직접적입니다.
- source_word: אִישׁ מִשָּׁם
  english_pob_choice: a man from there
  chosen_korean: 거기서 한 사람
  alternatives_korean:
  - 그곳의 한 사람
  - 거기서 한 남자
  lexicon: HALOT
  rationale: 익명의 발화자를 가리키므로 성별을 굳이 부각하지 않는 「한 사람」이 자연스럽고, מקום을 나타내는 מִשָּׁם은 「거기서」로 간명하게 살렸습니다.
- source_word: וּמִי אֲבִיהֶם
  english_pob_choice: And who is their father?
  chosen_korean: 그들의 아버지가 누구입니까?
  alternatives_korean:
  - 그의 아버지가 누구입니까?
  - 그들의 아버지가 누구냐?
  lexicon: HALOT
  rationale: 본문의 3인칭 복수 접미사에 맞추어 「그들의」를 유지해, 예언 행위가 혈통에서 나온 것이 아니라는 수사적 긴장을 보존했습니다.
- source_word: לְמָשָׁל
  english_pob_choice: it became a proverb
  chosen_korean: 속담이 되었습니다
  alternatives_korean:
  - 말이 되었습니다
  - 비유가 되었습니다
  lexicon: HALOT
  rationale: 여기서는 긴 교훈담이 아니라 널리 회자되는 정형 표현을 가리키므로 「속담」이 가장 알맞습니다.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִים
  english_pob_choice: Is Saul also among the prophets?
  chosen_korean: 사울도 예언자들 가운데 있느냐?
  alternatives_korean:
  - 사울도 예언자들 가운데 있습니까?
  - 사울도 예언자들 가운데 있느냐
  lexicon: HALOT
  rationale: 놀라움을 띤 수사 의문을 살리기 위해 문장 종결을 자연스럽게 처리했습니다. בַּנְּבִאִים은 집단 포함을 나타내므로 「예언자들 가운데」로 옮겼습니다.
theological_decisions:
- issue: '문장의 화용적 톤: 익명 화자의 놀라움과 조롱 섞인 속담 형성'
  chosen_reading: 직역적이되 과도한 설명을 덧붙이지 않고, 수사 의문과 속담화 과정을 그대로 드러냈습니다.
  alternative_readings:
  - 해설형으로 풀어쓴 번역
  - 완화된 평서형 번역
  rationale: 본문은 놀라움을 담은 질문이 공동체 속담으로 굳어지는 과정을 보여 주므로, 의미를 평탄화하지 않는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 서사 본문의 수사와 관용구를 보존하는 원칙
