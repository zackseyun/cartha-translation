reference: 1 Samuel 10:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֣חַר כֵּ֗ן תָּבוֹא֙ גִּבְעַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁר שָׁ֖ם נְצִבֵ֣י פְלִשְׁתִּ֑ים וִ/יהִי֩ כְ/בֹאֲ/ךָ֨ שָׁ֜ם הָ/עִ֗יר וּ/פָגַעְתָּ֞ חֶ֤בֶל נְבִיאִים֙ יֹרְדִ֣ים מֵֽ/הַ/בָּמָ֔ה וְ/לִ/פְנֵי/הֶ֞ם נֵ֤בֶל וְ/תֹף֙ וְ/חָלִ֣יל וְ/כִנּ֔וֹר וְ/הֵ֖מָּה מִֽתְנַבְּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/005.yaml
  text: After that you will come to Gibeath-ha-Elohim[a], where the Philistine garrison is. And when you enter there, into the city, you will meet a band of prophets coming down from the high place, with harp, tambourine, flute, and lyre before them[c][b], and they will be prophesying.
  footnotes:
  - marker: a
    text: Or 'the hill of God' / 'Gibeah of God'; the Hebrew may be understood as a place name or as a descriptive title for the location.
    reason: alternative_reading
  - marker: b
    text: Or 'Philistine outpost' or 'Philistine prefects'; the Hebrew term can refer either to a military station or to officials, though the context favors a garrison.
    reason: alternative_reading
  - marker: c
    text: 'The exact identification of the instruments is uncertain: ''harp'' (נֵבֶל) could also be ''lute,'' and ''flute'' could also be ''pipe.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후에 너는 하나님의 산[a] 기브아로 가게 될 것입니다. 거기에는 블레셋 수비대[b]가 있습니다. 네가 거기에, 곧 그 성읍에 들어갈 때, 너는 높은 곳에서 내려오는 예언자들의 무리를 만나게 될 것입니다. 그들 앞에는 수금과 손북과 피리와 비파[c]가 있고, 그들은 예언하고 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 언덕’ / ‘기브아’; 히브리어는 지명으로도, 장소의 서술적 칭호로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘블레셋 초소’ / ‘블레셋 관리들’; 히브리어는 군사 주둔지나 관리들을 가리킬 수 있으나, 문맥은 수비대를 더 잘 지지합니다.
    reason: alternative_reading
  - marker: c
    text: 정확한 악기 식별은 확실하지 않습니다. ‘수금’(נֵבֶל)은 ‘류트’일 수도 있고, ‘피리’(חָלִיל)는 ‘관악기/퉁소’에 가까울 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבְעַת הָאֱלֹהִים
  english_pob_choice: Gibeath-ha-Elohim
  chosen_korean: 하나님의 산
  alternatives_korean:
  - 기브아
  - 기브아-하나님
  - 하나님의 언덕
  lexicon: HALOT
  rationale: 영문 POB가 지명과 서술적 표현 가능성을 함께 열어 두었으므로, 본문 의미를 살리면서도 한국어 독자가 이해할 수 있게 ‘하나님의 산’으로 옮기고, 지명성은 각주로 보완했습니다.
- source_word: נְצִבֵי פְלִשְׁתִּים
  english_pob_choice: the Philistine garrison
  chosen_korean: 블레셋 수비대
  alternatives_korean:
  - 블레셋 주둔군
  - 블레셋 초소
  - 블레셋 관리들
  lexicon: HALOT
  rationale: 문맥이 군사적 주둔을 가리키므로 ‘수비대’가 가장 자연스럽고, ‘관리들’처럼 행정적 뜻으로 좁히지 않도록 했습니다.
- source_word: חֶבֶל נְבִיאִים
  english_pob_choice: a band of prophets
  chosen_korean: 예언자들의 무리
  alternatives_korean:
  - 예언자들의 떼
  - 예언자들의 한 무리
  - 예언자 집단
  lexicon: HALOT
  rationale: חֶבֶל의 집단성을 살리면서 현대 한국어에서 어색하지 않은 표현으로 ‘무리’를 선택했습니다.
- source_word: נֵבֶל וְתֹף וְחָלִיל וְכִנּוֹר
  english_pob_choice: harp, tambourine, flute, and lyre
  chosen_korean: 수금과 손북과 피리와 비파
  alternatives_korean:
  - 하프와 탬버린과 플루트와 류트
  - 거문고와 소고와 퉁소와 수금
  - 수금과 탬버린과 피리와 수금
  lexicon: HALOT
  rationale: 각 악기의 전통적 한국어 대응을 사용하되, נֵבֶל과 כִּנּוֹר는 구분을 위해 ‘수금’과 ‘비파’로 달리 옮겼습니다. 또한 חָלִיל은 ‘피리’가 가장 무난한 대응입니다.
theological_decisions:
- issue: 예언 활동의 성격(מִתְנַבְּאִים)
  chosen_reading: ‘예언하고 있을 것입니다’로 번역하여, 그 활동을 단정적으로 축소하거나 ecstatic 상태로 규정하지 않았습니다.
  alternative_readings:
  - 황홀경에 들어 있을 것입니다
  - 예언자처럼 말하고 있을 것입니다
  rationale: 히트파엘 동사의 의미는 예언적 활동을 분명히 지시하지만, 본문이 그 정확한 현상까지 설명하지는 않으므로 의미의 개방성을 유지했습니다.
  doctrine_reference: 본문의 현상학적 긴장을 보존
