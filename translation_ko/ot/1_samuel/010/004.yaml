source:
  edition: WLC
  text: וְ/שָׁאֲל֥וּ לְ/ךָ֖ לְ/שָׁל֑וֹם וְ/נָתְנ֤וּ לְ/ךָ֙ שְׁתֵּי לֶ֔חֶם וְ/לָקַחְתָּ֖ מִ/יָּדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/004.yaml
  text: They will ask you about your welfare and give you two loaves of bread[c][b][a], and you shall receive them from their hand.
  footnotes:
  - marker: a
    text: Or, 'They will greet you.' The Hebrew idiom literally involves asking concerning peace/well-being.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'two bread'; idiomatically, 'two loaves of bread.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'you shall take them from their hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 당신에게 평안을 묻고 두 개의 떡을 줄 것이며, 당신은 그것을 그들의 손에서 받게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들이 당신에게 인사할 것입니다.’ 히브리어 관용구는 문자적으로는 평안/안녕을 묻는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘두 떡’이며, 관용적으로는 ‘두 개의 떡’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는, ‘당신은 그것을 그들의 손에서 취할 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלוּ לְךָ לְשָׁלוֹם
  english_pob_choice: They will ask you about your welfare
  chosen_korean: 그들이 당신에게 평안을 묻고
  alternatives_korean:
  - 그들이 당신의 안부를 묻고
  - 그들이 당신에게 평안을 인사하고
  - 그들이 당신에게 평안을 물어보고
  lexicon: HALOT
  rationale: שׁאל + לְשָׁלוֹם은 단순한 질문이 아니라 안부를 묻는 관용구이므로, 한국어에서는 직역의 어색함을 피하면서도 ‘평안’이라는 स्रोत 이미지를 살려 옮겼습니다.
- source_word: שָׁלוֹם
  english_pob_choice: welfare
  chosen_korean: 평안
  alternatives_korean:
  - 안부
  - 안녕
  - 평안함
  lexicon: HALOT
  rationale: 문맥상 개인의 상태와 안부를 가리키므로 ‘평안’이 가장 간결하게 원문의 의미와 POB의 해석을 함께 반영합니다.
- source_word: שְׁתֵּי לֶחֶם
  english_pob_choice: two loaves of bread
  chosen_korean: 두 개의 떡
  alternatives_korean:
  - 두 덩이의 떡
  - 두 개의 빵
  - 두 떡
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘두 빵/떡’에 가깝지만, 한국어에서는 수사와 결합한 자연스러운 단위로 ‘두 개의 떡’이 가장 무리 없이 원문을 드러냅니다.
- source_word: וְלָקַחְתָּ מִיָּדָם
  english_pob_choice: and you shall receive them from their hand
  chosen_korean: 그것을 그들의 손에서 받게 될 것입니다
  alternatives_korean:
  - 그것을 그들의 손에서 취하게 될 것입니다
  - 그것을 그들에게서 받게 될 것입니다
  - 그것을 그들의 손에서 받을 것입니다
  lexicon: HALOT
  rationale: לקח은 본래 ‘취하다’이지만, 주는 행위와 연결될 때는 ‘받다’가 관계적 의미를 더 정확히 전달합니다. ‘그들의 손에서’는 히브리어 관용을 보존합니다.
