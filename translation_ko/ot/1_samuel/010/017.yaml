  yaml_path: translation/ot/1_samuel/010/017.yaml
  text: Then Samuel called the people together to Yahweh at Mizpah[a].
  footnotes:
  - marker: a
    text: Or 'summoned the people to the LORD at Mizpah.' The Hebrew verb can denote calling or summoning an assembly.
