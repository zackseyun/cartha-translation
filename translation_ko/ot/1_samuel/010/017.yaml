translation:
  language: ko
  text: 그때 사무엘이 백성을 야훼께 미스바로 불러 모았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사무엘이 야훼께 백성을 미스바에 소집했습니다.’ 히브리어 동사는 부르다/소집하다의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצְעֵק
  english_pob_choice: called the people together
  chosen_korean: 불러 모았습니다
  alternatives_korean:
  - 소집했습니다
  - 불러 모았습니다
  - 불러서 모았습니다
  lexicon: HALOT
  rationale: 문맥상 단순히 소리치다보다 회중을 집합시키는 뜻이므로, 자연스럽고 집회의 뉘앙스를 살리는 ‘불러 모았습니다’가 적절합니다.
- source_word: אֶת הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 백성
  - 회중
  lexicon: HALOT
  rationale: 여기서 הָעָם은 이스라엘 공동체를 가리키므로, 집합된 공동체를 드러내는 ‘백성’이 가장 무난합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문이 יהוה를 직접 사용하므로, POB의 기준에 따라 하나님의 고유명사를 ‘야훼’로 옮겼습니다.
- source_word: הַמִּצְפָּה
  english_pob_choice: at Mizpah
  chosen_korean: 미스바로
  alternatives_korean:
  - 미스바에서
  - 미스바에
  - 망대에
  lexicon: HALOT
  rationale: 여기서는 지명 מִצְפָּה를 가리키므로 음역을 유지하되, 목적지/집결지를 나타내는 조사 ‘-로’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼로 표기하여 고유한 언약 이름을 보존했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 단순한 칭호가 아니라 야훼의 고유한 신적 이름을 사용하므로, 이를 제목형 번역으로 바꾸지 않고 직접 표기하는 것이 원문 정보에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
