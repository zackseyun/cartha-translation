  to: 그리고 당신은 나보다 앞서 길갈로 내려가야 합니다. 보십시오, 내가 당신에게 내려가서 번제물을 드리고 화목제물[a]을 바치겠습니다. 당신은 내가 당신에게 올 때까지 칠 일 동안 기다려야 합니다. 내가 당신에게 무엇을 해야 하는지 알려 주겠습니다.
