base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/008.yaml
  text: And you shall go down before me to Gilgal. And behold[a], I am coming down to you to offer burnt offerings and to sacrifice peace offerings. You shall wait seven days, until I come to you and make known to you what you shall do.
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being.' The Hebrew term refers to sacrifices associated with peace, wholeness, and shared communion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신은 나보다 앞서 길갈로 내려가야 합니다. 보십시오, 내가 당신에게 내려가서 번제물을 드리고 화목제물[a]을 바치겠습니다. 당신은 내가 당신에게 올 때까지 칠 일 동안 기다려야 합니다. 내가 당신에게 무엇을 해야 하는지 알려 주겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘화목제물’은 ‘교제 제물’이나 ‘평안 제물’로도 옮길 수 있습니다. 히브리어 용어는 평화, 온전함, 함께 나누는 교제를 연상시키는 제사를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתָּ לְפָנַי הַגִּלְגָּל
  english_pob_choice: you shall go down before me to Gilgal
  chosen_korean: 당신은 나보다 앞서 길갈로 내려가야 합니다
  alternatives_korean:
  - 당신은 내 앞에 길갈로 내려가야 합니다
  - 당신은 나보다 먼저 길갈로 내려가야 합니다
  lexicon: HALOT
  rationale: ירד의 공간적 의미를 살려 ‘내려가다’로 옮기고, לְפָנַי는 순서와 위치를 함께 드러내도록 ‘나보다 앞서’로 자연스럽게 표현했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의를 환기하는 감탄사를 현대 한국어에서 너무 고어적으로 만들지 않으면서도 장면 전환의 긴박함을 살리기 위해 ‘보십시오’로 옮겼습니다.
- source_word: לְהַעֲלוֹת עֹל֔וֹת
  english_pob_choice: to offer burnt offerings
  chosen_korean: 번제물을 드리고
  alternatives_korean:
  - 번제물을 바치고
  - 번제사를 드리고
  lexicon: HALOT
  rationale: עלה의 제의적 용법을 ‘드리다’로 자연스럽게 살리고, עֹלוֹת은 표준적인 제사 용어인 ‘번제물’로 옮겼습니다.
- source_word: לִזְבֹּ֖חַ זִבְחֵי שְׁלָמִ֑ים
  english_pob_choice: to sacrifice peace offerings
  chosen_korean: 화목제물을 제사하겠습니다
  alternatives_korean:
  - 평화제물을 제사하겠습니다
  - 화평제물을 제사하겠습니다
  lexicon: HALOT
  rationale: שְׁלָמִים의 관계적·공동체적 뉘앙스를 살리면서도 한국어 성경에서 널리 알려진 제의 용어에 맞추어 ‘화목제물’로 옮겼습니다. ‘제사하다’는 זבח의 제의적 동사를 반영합니다.
- source_word: וְהוֹדַעְתִּי לְךָ אֵת אֲשֶׁר תַּעֲשֶׂה
  english_pob_choice: and make known to you what you shall do
  chosen_korean: 그러면 내가 당신에게 무엇을 해야 하는지 알려 주겠습니다
  alternatives_korean:
  - 그러면 내가 당신이 해야 할 일을 알려 주겠습니다
  - 그러면 내가 당신에게 해야 할 일을 알리겠습니다
  lexicon: HALOT
  rationale: הודיע의 사역적 의미를 ‘알려 주다’로 옮기고, שאלשֶׁר תַּעֲשֶׂה는 지시문맥에 맞게 ‘무엇을 해야 하는지’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: שִׁבְעַת יָמִים의 명령적 대기와 예언적 안내의 어조
  chosen_reading: ‘당신은 내가 당신에게 올 때까지 칠 일 동안 기다려야 합니다’로 명령형-예언형 톤을 유지했습니다.
  alternative_readings:
  - ‘당신은 칠 일 동안 기다리십시오’
  - ‘당신은 칠 일 동안 기다려야 합니다’
  rationale: 이 문장은 단순한 정보 전달이 아니라 사무엘의 권위 있는 지시이므로, 한국어에서도 의무성과 예언적 확실성을 함께 드러내는 형태가 적절합니다.
  doctrine_reference: Translation philosophy §5 (directive/prophetic speech handling)
