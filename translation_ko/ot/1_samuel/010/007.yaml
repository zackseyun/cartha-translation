  chosen_korean: 이러한 표징들
  alternatives_korean:
  - 이러한 표징들
  - 이런 표징들
  lexicon: HALOT
  rationale: אות는 여기서 하나님이 주시는 ‘표징’의 의미이므로, 단순한 ‘징조’보다 맥락이 분명한 ‘표징’으로 옮겼습니다.
- source_word: אֲשֶׁר תִּמְצָא יָדֶךָ
