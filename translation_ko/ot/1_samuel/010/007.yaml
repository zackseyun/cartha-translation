base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/007.yaml
  text: And when these signs come to you[a], do whatever your hand finds to do, for God is with you.
  footnotes:
  - marker: a
    text: Or, 'whatever is in your power to do.' The Hebrew idiom literally says, 'whatever your hand finds.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이러한 표징들이 당신에게 오면, 당신의 손이 찾는 것을 당신을 위해 하십시오. 이는 하나님이 당신과 함께 계시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 손이 찾는 것’입니다. 히브리어 관용구는 ‘당신이 할 수 있는 일’이라는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And when
  chosen_korean: 이러한 표징들이 당신에게 오면
  alternatives_korean:
