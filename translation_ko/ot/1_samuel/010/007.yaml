  - 표징들이 당신에게 오고 나면
  lexicon: HALOT
  rationale: 미래의 조건적 시간을 자연스럽게 살려, 서두의 סיפר적 전환을 현대 한국어로 매끄럽게 옮겼습니다.
- source_word: הָאֹתוֹת הָאֵלֶּה
