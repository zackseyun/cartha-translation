    text: 직역하면 ‘당신의 손이 찾는 것을 하라’입니다. 히브리어 관용구는 손에 닿는 일, 곧 당신이 할 수 있거나 기회가 닿는 일을 하라는 뜻입니다.
    reason: lexical_alternative
