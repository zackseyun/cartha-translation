  lexicon: HALOT
  rationale: 이 문맥에서 הָאֱלֹהִים은 이스라엘의 하나님을 가리키는 확정적 지시이므로, 프로젝트 기본어인 ‘하나님’으로 간결하게 옮겼습니다.
