  naturalness: 서술은 대체로 자연스럽습니다. 그러나 인용문의 ‘구원하겠느냐?’는 해라체로, 지정된 현대 표준어 합쇼체와 일치하지 않습니다. ‘구원하겠습니까?’로 고쳐야 합니다. ‘잠잠한 사람처럼 있었습니다’도 문법상 가능하나 ‘침묵하는 사람처럼 있었습니다’가 더 자연스럽습니다.
  terminology: ‘불량한 자들’은 בְנֵי בְלִיַּעַל에 대한 절제된 현대어 번역으로 가능하며, ‘업신여겼고’도 적절합니다. ‘예물’은 왕에게 드리는 선물이라는 문맥에 맞습니다. 각주에서 ‘문자적으로는 귀먹은 것처럼’이라고 한 것은 정확하지 않습니다. 해당 어형은 문맥상 침묵하는 사람을 뜻할 수 있고, ‘귀먹은 사람처럼’은 가능한 대안적 이해이지 문자적 등가로 단정할 수 없습니다.
