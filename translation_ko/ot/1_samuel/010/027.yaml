  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֧י בְלִיַּ֣עַל אָמְר֗וּ מַה יֹּשִׁעֵ֨/נוּ֙ זֶ֔ה וַ/יִּבְזֻ֕/הוּ וְ/לֹֽא הֵבִ֥יאוּ ל֖/וֹ מִנְחָ֑ה וַ/יְהִ֖י כְּ/מַחֲרִֽישׁ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/027.yaml
  text: But worthless men said[a], “How can this man save us?” And they despised him and did not bring him a gift. But he was like one keeping silent.
  footnotes:
  - marker: a
    text: Or, “as though he were deaf.” The Hebrew expression can describe deliberate silence in the face of provocation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 불량한 자들은 “이 사람이 어떻게 우리를 구원하겠느냐?” 하면서 그를 업신여겼고, 그에게 예물을 가져오지 않았습니다. 그러나 그는 잠잠한 사람처럼 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잠잠한 사람처럼’은 문자적으로는 ‘귀먹은 것처럼’도 가능하지만, 히브리어 표현은 도발 앞에서 의도적으로 침묵하는 태도를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בְלִיַּעַל
  english_pob_choice: worthless men
  chosen_korean: 불량한 자들
  alternatives_korean:
  - 무가치한 자들
  - 불한당들
  - 악한 자들
  lexicon: HALOT
  rationale: 히브리어 관용구의 도덕적 타락과 사회적 무가치함을 살리되, 현대 한국어에서 자연스럽고 문맥상 공격적인 조롱의 뉘앙스를 전달하는 표현을 택했습니다.
- source_word: מַה יֹּשִׁיעֵנוּ זֶה
  english_pob_choice: How can this man save us?
  chosen_korean: 이 사람이 어떻게 우리를 구원하겠느냐?
  alternatives_korean:
  - 이 사람이 어떻게 우리를 구원하겠습니까?
  - 어떻게 이 사람이 우리를 구원하겠느냐?
  lexicon: HALOT
  rationale: 질문 형식과 경멸적 어조를 함께 반영하기 위해 ‘어떻게’와 ‘구원하겠느냐’를 살렸고, זֶה는 자연스러운 ‘이 사람’으로 옮겼습니다.
- source_word: וַיִּבְזֻהוּ
  english_pob_choice: they despised him
  chosen_korean: 그를 업신여겼고
  alternatives_korean:
  - 그를 멸시했고
  - 그를 경멸했고
  - 그를 천대했고
  lexicon: HALOT
  rationale: בזה의 핵심 의미인 ‘경시하다/무시하다’를 한국어에서 간결하고 직접적으로 드러내는 표준어로 옮겼습니다.
- source_word: מִנְחָה
  english_pob_choice: a gift
  chosen_korean: 예물
  alternatives_korean:
  - 선물
  - 공물
  - 헌물
  lexicon: HALOT
  rationale: 이 왕권 맥락에서 단순한 선물보다 예우와 복속의 표시가 있는 바침을 뜻하므로, 너무 예배적이지 않으면서도 격식이 있는 ‘예물’을 택했습니다.
- source_word: כְּמַחֲרִישׁ
  english_pob_choice: like one keeping silent
  chosen_korean: 잠잠한 사람처럼
  alternatives_korean:
  - 말없이 있는 사람처럼
  - 침묵하는 사람처럼
  - 귀먹은 것처럼
  lexicon: HALOT
  rationale: 비교 표지 כ를 살려 ‘〜처럼’ 구조를 유지했고, 본문이 말하는 것은 실제 귀먹음이 아니라 반응하지 않는 침묵이므로 ‘잠잠한 사람’으로 표현했습니다.
theological_decisions:
- issue: 사울의 태도 묘사에서 ‘귀먹은 것처럼’보다 ‘침묵’ 의미를 택할지 여부
  chosen_reading: 본문의 비교 표현을 살리되, 사울은 말대꾸하지 않고 잠잠한 상태로 묘사했습니다.
  alternative_readings:
  - 그가 모욕을 듣고도 귀먹은 체했습니다.
  - 그가 마치 못 들은 사람처럼 있었습니다.
  rationale: 히브리어 כְּמַחֲרִישׁ은 실제 청각 장애보다 의도적 침묵 또는 반응하지 않음을 자연스럽게 가리킬 수 있으므로, 본문이 확실히 요구하는 침묵의 의미를 중심으로 번역했습니다.
  doctrine_reference: Translation philosophy §3
