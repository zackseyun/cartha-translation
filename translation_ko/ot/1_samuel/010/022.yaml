  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 첫 접속사 "그래서"는 히브리어의 단순 서술 접속 와우보다 인과관계를 더 강하게 드러내므로 "그들은"으로 옮기는 편이 안전합니다. כֵּלִים는 이 문맥에서 특정한 군사 장비라기보다 휴대품·짐을 포괄하므로 "장비들"보다 "짐"이 더 적절합니다.
  naturalness: 현대 표준어 합쇼체로 문장을 다듬고, 인용부호와 문장부호를 한국어 관례에 맞추었습니다. "아직 여기 왔습니까?"도 이해되지만 "아직 여기 와 있습니까?"가 도착한 상태를 묻는 원문의 뉘앙스를 더 자연스럽게 드러냅니다.
  terminology: יְהוָה는 프로젝트 방침에 따라 "야훼"로 유지했습니다. הִנֵּה는 현대 합쇼체에 맞추어 "보십시오"로 옮겼습니다. כֵּלִים는 "짐"으로 번역하고, 그 폭넓은 어휘 범위는 해당 위치의 각주에서 밝혔습니다.
