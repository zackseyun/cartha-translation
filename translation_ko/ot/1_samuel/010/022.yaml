  text: 그들은 야훼께 다시 물었습니다. “그 사람이 아직 여기 와 있습니까?” 야훼께서 말씀하셨습니다. “보십시오, 그가 짐 가운데 숨어 있습니다[a].”
  philosophy: optimal-equivalence
  footnotes:
