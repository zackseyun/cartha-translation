    text: 히브리어는 물품, 기구, 장비 등을 넓게 가리킬 수 있습니다. 여기서는 모인 사람들의 휴대품이나 짐을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ ... בַּיהוָה
  english_pob_choice: they inquired of Yahweh
  chosen_korean: 야훼께 다시 물었습니다
  alternatives_korean:
  - 야훼께 다시 물었습니다
  - 야훼께 다시 문의했습니다
  - 야훼께 다시 여쭈었습니다
  lexicon: HALOT
  rationale: שׁאל with בַּיהוָה는 단순한 질문이 아니라 신탁/응답을 구하는 문의이므로, 한국어도 공손한 서술이면서 그 종교적 기능을 드러내는 "물었습니다"로 옮겼습니다.
- source_word: עוֹד ... הֲלֹם
  english_pob_choice: again ... yet here
  chosen_korean: 다시 ... 아직 여기
  alternatives_korean:
  - 다시 ... 아직 여기
  - 거듭 ... 아직 이곳
  - 또 ... 아직 이리
  lexicon: HALOT
  rationale: 첫 번째 עוֹד는 반복을, 두 번째는 도착 여부의 현재 관련성을 나타내므로, 질문 전체의 흐름을 살리는 "다시"와 "아직"을 사용했습니다.
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보라
  alternatives_korean:
  - 보라
  - 보십시오
  - 봐라
  lexicon: HALOT
  rationale: הִנֵּה는 뒤따르는 내용을 강조하며 주의를 환기하므로, 격식을 유지하면서도 힘을 살리는 "보라"가 가장 직접적입니다.
- source_word: אֶל הַכֵּלִים
  english_pob_choice: among the baggage
  chosen_korean: 장비들 가운데
  alternatives_korean:
  - 짐 가운데
  - 보따리들 가운데
  - 장비와 물품 가운데
  lexicon: HALOT
  rationale: כֵּלִים은 문맥상 그저 그릇이 아니라 집회한 무리의 휴대품·장비를 가리킬 수 있으므로, 한국어에서는 상황에 맞는 포괄어인 "장비들"로 옮겨 그 안에 숨었다는 의미를 드러냈습니다.
