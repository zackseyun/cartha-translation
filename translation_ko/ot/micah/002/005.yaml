id: MIC.2.5
reference: Micah 2:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵן֙ לֹֽא יִֽהְיֶ֣ה לְ/ךָ֔ מַשְׁלִ֥יךְ חֶ֖בֶל בְּ/גוֹרָ֑ל בִּ/קְהַ֖ל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/005.yaml
  text: Therefore you will have no one to cast the measuring line by lot in the assembly of Yahweh[a][b].
  footnotes:
  - marker: a
    text: Or 'line,' 'cord,' or 'allotment line.' The Hebrew term refers to the cord used in measuring out inherited land.
    reason: lexical_alternative
  - marker: b
    text: That is, in the gathered covenant community when land is apportioned.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 너에게는 야훼의 회중에서 제비로 분배할 측량줄을 던질 자가 없을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘측량줄’은 ‘줄’, ‘끈’, 또는 ‘분깃줄’로도 옮길 수 있습니다. 이 히브리어는 상속지를 재는 데 쓰는 줄을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 땅이 분배되는 언약 공동체 안에서라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이러므로
  lexicon: HALOT
  rationale: 선행 문맥의 심판 선언으로부터 이어지는 결과를 나타내므로, 예언적 인과를 자연스럽게 살리는 ‘그러므로’가 적절합니다.
- source_word: לֹא יִהְיֶה לְךָ
  english_pob_choice: you will have no one
  chosen_korean: 너에게는 … 없을 것입니다
  alternatives_korean:
  - 너는 … 가지지 못할 것입니다
  - 너를 위하여 … 없을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 직설적 소유 부정 표현을 한국어에서는 존재 부정 구조로 옮겨, 예언적 단죄의 힘을 유지했습니다.
- source_word: מַשְׁלִיךְ חֶבֶל
  english_pob_choice: the measuring line to cast
  chosen_korean: 제비로 분배할 측량줄을 던질 자
  alternatives_korean:
  - 측량줄을 던질 자
  - 분배줄을 던질 자
  lexicon: HALOT
  rationale: חֶבֶל은 상속지 측량에 쓰는 줄이므로 ‘측량줄’로 풀고, מַשְׁלִיךְ의 동작을 살려 ‘던질 자’로 표현했습니다.
- source_word: בְּגוֹרָל
  english_pob_choice: by lot
  chosen_korean: 제비로
  alternatives_korean:
  - 뽑기로
  - 분깃으로
  lexicon: HALOT
  rationale: גורל의 분배·할당 관습을 한국어 관용으로 가장 직접적으로 드러내는 표현은 ‘제비로’입니다.
- source_word: בִּקְהַל יְהוָה
  english_pob_choice: in the assembly of Yahweh
  chosen_korean: 야훼의 회중
  alternatives_korean:
  - 야훼의 모임
  - 야훼의 총회
  lexicon: HALOT
  rationale: קהל은 모인 언약 공동체를 가리키므로, 기관명보다 공동체성을 드러내는 ‘회중’이 적절합니다. יְהוָה는 지침에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘회중’의 공동체적 범위
  chosen_reading: 언약 백성이 함께 모인 공동체 안에서의 토지 분배를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 단순한 종교 집회
  - 이스라엘 전체에 대한 추상적 표현
  rationale: 문맥상 상속지 분배와 결부된 משפט/분깃 상황이므로, 예배 모임이 아니라 언약 공동체의 공적 분배 장면으로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: 언약 공동체와 기업 분배의 문맥(Micah 2:5)
