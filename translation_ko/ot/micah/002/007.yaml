source:
  edition: WLC
  text: הֶ/אָמ֣וּר בֵּֽית יַעֲקֹ֗ב הֲ/קָצַר֙ ר֣וּחַ יְהוָ֔ה אִם אֵ֖לֶּה מַעֲלָלָ֑י/ו הֲ/ל֤וֹא דְבָרַ֨/י יֵיטִ֔יבוּ עִ֖ם הַ/יָּשָׁ֥ר הוֹלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/007.yaml
  text: Should it be said[a], O house of Jacob, “Is the Spirit of Yahweh impatient? Are these his deeds?” Do not my words do good to the one who walks uprightly?
  footnotes:
  - marker: a
    text: Or, 'Is the Spirit of the LORD shortened?' The Hebrew idiom can also suggest, 'Is the LORD's patience short?'
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱의 집아, 이렇게 말해야 하겠습니까? “야훼의 영이 조급합니까?[a] 이런 것들이 그분의 행위입니까?” 내 말들이 올바르게 살아가는 사람에게 유익을 주지 않겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 영이 짧아졌습니까?’ 히브리어 관용 표현은 ‘야훼의 인내가 짧습니까?’라는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאָמ֣וּר
  english_pob_choice: Should it be said
  chosen_korean: 이런 말이 베풀어져야 합니까
  alternatives_korean:
  - 이렇게 말해야 합니까
  - 그런 말이 나와야 합니까
  lexicon: HALOT
  rationale: 수사적 도입문을 한국어에서 자연스럽게 옮기기 위해 수동적·비인칭적 질문으로 처리했습니다. '베풀어지다'는 말이 공적으로 제기되는 느낌을 살려 원문의 도발적 어조를 보존합니다.
- source_word: בֵּית יַעֲקֹב
  english_pob_choice: O house of Jacob
  chosen_korean: 야곱의 집이여
  alternatives_korean:
  - 야곱의 집아
  - 야곱 집안이여
  lexicon: HALOT
  rationale: 예언적 호격을 살려 '이여'로 처리했고, 고유명사는 '야곱'으로 옮겼습니다.
- source_word: הֲקָצַר רוּחַ יְהוָה
  english_pob_choice: Is the Spirit of Yahweh impatient
  chosen_korean: 야훼의 영이 조급합니까
  alternatives_korean:
  - 야훼의 영이 짧아졌습니까
  - 야훼의 영이 인내가 짧습니까
  - 야훼의 영이 답답합니까
  lexicon: HALOT
  rationale: רוּחַ יְהוָה를 본문 흐름상 '영'으로 유지하면서, קצר רוח의 관용적 의미를 한국어에서 가장 자연스럽게 드러내는 '조급하다'로 옮겼습니다. '짧아지다'를 직역하면 한국어 관용이 어색해져 수사적 힘이 약해집니다.
- source_word: אִם אֵלֶּה מַעֲלָלָיו
  english_pob_choice: Are these his deeds
  chosen_korean: 이런 것이 그의 행위입니까
  alternatives_korean:
  - 이런 것이 그의 일입니까
  - 이것들이 그의 소행입니까
  lexicon: HALOT
  rationale: מַעֲלָל은 행위·소행의 뜻이므로 '행위'로 옮겼습니다. 앞절의 반문과 대응되는 구조를 살리기 위해 질문형을 유지했습니다.
- source_word: דְבָרַי
  english_pob_choice: my words
  chosen_korean: 내 말들이
  alternatives_korean:
  - 내 말이
  - 내 말씀들이
  lexicon: HALOT
  rationale: 히브리어 복수를 반영해 '말들'로 옮겼습니다. '말씀'은 한국어 교회어감이 강해 여기서는 일반적 '말들'이 더 직접적입니다.
- source_word: יֵיטִיבוּ
  english_pob_choice: do good
  chosen_korean: 선을 행하지 않습니까
  alternatives_korean:
  - 유익을 주지 않습니까
  - 좋게 하지 않습니까
  lexicon: HALOT
  rationale: היטיב의 결과적 의미를 한국어에서 자연스럽게 풀어 '선을 행하다'로 옮겼습니다. 단순한 기능적 유익보다 도덕적·선의 의미를 함께 살립니다.
theological_decisions:
- issue: יְהוָה의 번역과 구약 예언 본문에서의 신명 사용
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙에 따라 신명은 학술 음역인 '야훼'로 유지해 본문의 언약적 고유성을 드러냈습니다. 신약 인용이 아니므로 κύριος에 대한 야훼 역수용 문제는 여기 해당하지 않습니다.
  doctrine_reference: Translation philosophy §1, §3; contested terms table for יְהוָה
- issue: רוּחַ יְהוָה의 의미를 '영'으로 유지할지 '인내/조급함'으로 의미화할지
  chosen_reading: 야훼의 영이 조급합니까
  alternative_readings:
  - 야훼의 인내가 짧습니까
  - 야훼의 성품이 조급합니까
  rationale: 본문은 문자적으로는 '짧아진 영'이지만, 히브리어 관용구의 핵심은 조급함/참을성의 결여입니다. POB의 영어판이 개인적·인격적 어휘인 'Spirit'을 택한 흐름을 한국어에서도 살리되, 관용적 의미를 이해 가능하게 '조급하다'로 옮겼습니다.
  doctrine_reference: HALOT קצר רוח; English POB lexical decision for רוּחַ יְהוָה
