revisions:
- from: “이런 말이 베풀어져야 합니까, 야곱의 집이여? ‘야훼의 영이 조급합니까? 이런 것이 그의 행위입니까?’라고 말해서는 안 됩니다. 내 말들이 곧바로 걷는 이에게 선을 행하지 않습니까?”[a]
  to: 야곱의 집아, 이렇게 말해야 하겠습니까? “야훼의 영이 조급합니까?[a] 이런 것들이 그분의 행위입니까?” 내 말들이 올바르게 살아가는 사람에게 유익을 주지 않겠습니까?
