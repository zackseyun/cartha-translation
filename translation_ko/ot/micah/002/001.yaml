revisions:
- from: 화가 있을 것입니다. 악을 도모하고 자기 침상에서 해악을 꾀하는 사람들에게 말입니다! 아침빛이 비치면 그것을 행합니다[a]. 왜냐하면 그들의 손에 힘이 있기 때문입니다.
  to: 불의를 꾸미고 침상에서 악을 행하는 자들에게 화가 있습니다! 아침빛이 밝아 오면 그들은 그것을 실행합니다. 그들의 손에 힘이 있기 때문입니다[a].
  rationale: 원문의 두 분사, ‘불의를 꾸미는 자들’과 ‘악을 행하는 자들’을 한국어에서도 구별했습니다. 시간·장소 표현인 ‘침상에서’와 ‘아침빛이 밝아 오면’을 보존하고, 마지막 절은 문맥상 가장 자연스러운 능력의 관용 표현으로 번역했습니다. ‘신’으로 읽는 가능한 대안은 본문에 강제하지 않고 관련 절에 연결된 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:43:01Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘해악을 꾀하는’은 וּפֹעֲלֵי רָע(‘악을 행하는/일하는 자들’)를 다시 계획 행위로 옮기며, 제시된 어휘 해설에서 말한 계획과 실행의 구분도 살리지 못합니다. 또한 ‘자기 침상’의 ‘자기’는 원문에 없는 재귀적 뉘앙스를 더합니다. 마지막 절의 ‘그들의 손에 힘이 있다’는 לְאֵל יָדָם의 관용적 의미를 적절히 보존합니다.
  naturalness: ‘화가 있을 것입니다’보다 ‘화가 있습니다’가 예언적 고발 선언으로 더 직접적이고 자연스럽습니다. ‘아침빛이 밝아 오면’은 בְּאוֹר הַבֹּקֶר의 빛 이미지를 보존하면서 현대 표준어에서 자연스럽습니다. ‘그들은 그것을 실행합니다’는 여성 단수 접미사의 선행사를 불필요하게 특정하지 않으면서 계획한 일을 실제로 행한다는 문맥을 드러냅니다.
  terminology: אָוֶן은 ‘불의’, רָע는 ‘악’으로 구별하여 병행의 어휘적 변화를 유지했습니다. ‘침상’, ‘손’, ‘힘’은 문어적이되 현대 합쇼체 성경 문체에 적합합니다. 대안 독법의 ‘신’은 본문이 아니라 각주에만 두어 논쟁적 의미를 보존합니다.
  issues:
  - severity: medium
    issue: וּפֹעֲלֵי רָע를 ‘해악을 꾀하는’으로 번역함
    rationale: פֹעֲלֵי는 ‘행하는/일하는’이라는 실행적 어휘입니다. ‘꾀하는’은 앞의 חֹשְׁבֵי와 같은 계획 의미로 수렴시켜 원문의 어휘적 대비와 진행을 약화합니다.
  - severity: low
    issue: ‘자기 침상’의 재귀 표현
    rationale: מִשְׁכְּבוֹתָם은 단순히 ‘그들의 침상’입니다. ‘자기’는 한국어에서 불필요한 재귀적 강조를 낳을 수 있습니다.
  - severity: low
    issue: 대안 독법 각주의 표지가 관련 구절에서 떨어져 있음
    rationale: 각주는 마지막 절의 אֵל 해석에 관한 것이므로 ‘힘’에 표지를 붙이는 편이 독자가 해당 대상을 분명히 알 수 있습니다.
  revised_text: 불의를 꾸미고 침상에서 악을 행하는 자들에게 화가 있습니다! 아침빛이 밝아 오면 그들은 그것을 실행합니다. 그들의 손에 힘이 있기 때문입니다[a].
