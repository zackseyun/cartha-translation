id: MIC.2.1
reference: Micah 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֧וֹי חֹֽשְׁבֵי אָ֛וֶן וּ/פֹ֥עֲלֵי רָ֖ע עַל מִשְׁכְּבוֹתָ֑/ם בְּ/א֤וֹר הַ/בֹּ֨קֶר֙ יַעֲשׂ֔וּ/הָ כִּ֥י יֶשׁ לְ/אֵ֖ל יָדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/001.yaml
  text: Woe to those who devise wickedness and work out evil on their beds! At the light of morning they do it[a], because it is in the power of their hand.
  footnotes:
  - marker: a
    text: Or, 'because their hand is their god,' taking 'god' as a figurative description of their self-exalting power.
    reason: alternative_reading
translation:
  language: ko
  text: 불의를 꾸미고 침상에서 악을 행하는 자들에게 화가 있습니다! 아침빛이 밝아 오면 그들은 그것을 실행합니다. 그들의 손에 힘이 있기 때문입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 손이 그들의 신이기 때문입니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: 화가 있을 것입니다
  alternatives_korean:
  - 슬프도다
  - 아아
  - 재앙이 있을 것입니다
  lexicon: HALOT
  rationale: 예언적 경고와 탄식을 여는 감탄사로, 합쇼체 문맥에서 '화가 있을 것입니다'가 원문의 선포성과 경고성을 가장 잘 살립니다.
- source_word: חֹשְׁבֵי אָוֶן
  english_pob_choice: those who devise wickedness
  chosen_korean: 악을 도모하는 사람들
  alternatives_korean:
  - 불의를 꾀하는 사람들
  - 죄악을 계획하는 사람들
  - 해악을 꾸미는 사람들
  lexicon: HALOT
  rationale: חֹשְׁבֵי는 단순한 생각이 아니라 의도적 계획을 뜻하므로 '도모하다'가 자연스럽고, אָוֶן은 문맥상 도덕적 악을 가리켜 '악'으로 옮겼습니다.
- source_word: וּפֹעֲלֵי רָע
  english_pob_choice: and work out evil
  chosen_korean: 해악을 꾀하는
  alternatives_korean:
  - 악을 행하는
  - 악을 실행하는
  - 악을 일삼는
  lexicon: HALOT
  rationale: 병렬 구조에서 계획을 실제 행동으로 옮기는 뉘앙스를 살리기 위해 '꾀하다'와 결합해, 원문의 점층성을 한국어로 재현했습니다.
- source_word: בְּאוֹר הַבֹּקֶר
  english_pob_choice: At the light of morning
  chosen_korean: 아침빛이 비치면
  alternatives_korean:
  - 아침에
  - 새벽빛에
  - 아침 햇살이 비치면
  lexicon: HALOT
  rationale: 단순한 시간표현보다 '빛'의 이미지를 보존해, 밤의 침상에서 낮의 시작으로 넘어가는 장면을 더 선명하게 드러냈습니다.
- source_word: כִּי יֶשׁ לְאֵל יָדָם
  english_pob_choice: because it is in the power of their hand
  chosen_korean: 그들의 손에 힘이 있기 때문입니다
  alternatives_korean:
  - 그들의 손에는 능력이 있기 때문입니다
  - 그들의 손이 힘이기 때문입니다
  - 그들의 손이 곧 신이기 때문입니다
  lexicon: HALOT
  rationale: 본문의 기본 의미는 그들이 실행할 수 있는 능력을 지녔다는 뜻이므로 '힘'으로 옮겼고, '손' 이미지는 그대로 유지해 히브리어 관용을 살렸습니다.
theological_decisions:
- issue: 마지막 절의 לְאֵל 의미
  chosen_reading: 문맥상 '힘/능력'의 관용적 표현으로 읽었습니다.
  alternative_readings:
  - 그들의 손이 곧 신이라고 읽는 해석
  - 그들의 손이 그들의 신이라는 비유적 해석
  rationale: 문맥에서는 왜 그들이 새벽에 악행을 실행하는지 설명하므로, 실행 가능성을 말하는 관용적 의미가 가장 직접적입니다. 신격화 해석은 가능하지만 본문에 덜 직접적이어서 본문 대신 주석적 대안으로 보존했습니다.
  doctrine_reference: 원문의 긴장을 해소하지 말고, 본문과 주석에서 각각 가능한 의미를 분리해 보존합니다.
