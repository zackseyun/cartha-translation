id: MIC.2.10
reference: Micah 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֣וּמוּ וּ/לְכ֔וּ כִּ֥י לֹא זֹ֖את הַ/מְּנוּחָ֑ה בַּ/עֲב֥וּר טָמְאָ֛ה תְּחַבֵּ֖ל וְ/חֶ֥בֶל נִמְרָֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/010.yaml
  text: Rise and go[a], for this is not the resting place; because of uncleanness it brings destruction[b], even grievous destruction.
  footnotes:
  - marker: a
    text: Or 'for this is not the place of rest.' The Hebrew noun can mean 'rest' or 'resting place,' and here likely refers to the land as Israel's place of settled repose.
    reason: lexical_alternative
  - marker: b
    text: Or 'it destroys—yes, a severe destruction.' The Hebrew uses a verb and cognate noun from the same root for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나서 가십시오. 이것은 안식할 곳이 아닙니다. 부정함 때문에 그것이 파괴를 가져오니 — 참으로 심한 파괴입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이곳은 안식의 장소가 아닙니다.’ 히브리어 명사는 ‘안식’이나 ‘안식할 곳’을 뜻할 수 있으며, 여기서는 이스라엘의 정착된 쉼의 자리인 땅을 가리키는 말로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것은 파괴합니다—참으로 심한 파괴를.’ 히브리어는 같은 어근의 동사와 명사를 나란히 써서 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ
  english_pob_choice: Rise
  chosen_korean: 일어나서
  alternatives_korean:
  - 일어나십시오
  - 일어나
  lexicon: HALOT
  rationale: 복수 명령의 촉구를 자연스럽게 살리면서, 현대 한국어에서는 ‘일어나서 가십시오’가 다음 동작과도 잘 이어집니다.
- source_word: וּ/לְכ֔וּ
  english_pob_choice: and go
  chosen_korean: 가십시오
  alternatives_korean:
  - 가십시오, 그리고
  - 떠나십시오
  lexicon: HALOT
  rationale: 문맥상 땅에서의 추방/이탈을 가리키므로 단순한 ‘가다’가 가장 직접적입니다.
- source_word: הַ/מְּנוּחָ֑ה
  english_pob_choice: the resting place
  chosen_korean: 안식할 곳
  alternatives_korean:
  - 휴식의 곳
  - 안식처
  lexicon: HALOT
  rationale: מְנוּחָה는 단순한 휴식보다 ‘정착하여 쉬는 자리’의 뉘앙스가 있어, 장소성을 드러내는 ‘안식할 곳’이 원문의 구체성을 잘 살립니다.
- source_word: בַּ/עֲב֥וּר טָמְאָ֛ה
  english_pob_choice: because of uncleanness
  chosen_korean: 부정함 때문에
  alternatives_korean:
  - 더러움 때문에
  - 부정하기 때문에
  lexicon: HALOT
  rationale: עֲבוּר는 이유를 나타내며, טָמְאָה는 제의적·도덕적 부정 상태를 가리켜 ‘부정함’이 가장 간결하고 소스에 충실합니다.
- source_word: תְּחַבֵּ֖ל וְ/חֶ֥בֶל נִמְרָֽץ
  english_pob_choice: it brings destruction—indeed, grievous destruction
  chosen_korean: 파괴를 가져오니 — 참으로 심한 파괴입니다
  alternatives_korean:
  - 파괴합니다 — 실로 심한 파괴입니다
  - 무너뜨리니 — 심각한 붕괴입니다
  lexicon: HALOT
  rationale: 동사와 같은 어근의 명사를 겹쳐 쓰는 강조를 한국어에서 ‘파괴를 가져오니 — 참으로 심한 파괴입니다’로 재현해, 중복을 통한 수사적 증폭을 살렸습니다.
theological_decisions:
- issue: 부정함의 주체와 대상
  chosen_reading: 주체를 특정하지 않고, ‘안식할 곳’ 자체가 부정함으로 인해 파괴를 초래하는 것으로 옮겼습니다.
  alternative_readings:
  - ‘그것이 부정해졌기 때문에’로 주어를 보충하는 읽기
  - 부정함을 추상적으로만 처리하는 읽기
  rationale: 히브리어는 여성형 표현으로 땅/안식처를 자연스럽게 가리키며, 한국어에서도 불필요한 주어 보충 없이 문맥의 땅-공간 이미지를 유지하는 편이 더 안전합니다.
  doctrine_reference: 문맥적-어휘적 판단
