  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נְשֵׁ֤י עַמִּ/י֙ תְּגָ֣רְשׁ֔וּ/ן מִ/בֵּ֖ית תַּֽעֲנֻגֶ֑י/הָ מֵ/עַל֙ עֹֽלָלֶ֔י/הָ תִּקְח֥וּ הֲדָרִ֖/י לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/009.yaml
  text: You drive the women of my people out from their delightful houses[b][a]; from their children you take away my splendor forever.
  footnotes:
  - marker: a
    text: Or 'the wives of my people.' The Hebrew can refer either to women generally or to wives specifically.
    reason: lexical_alternative
  - marker: b
    text: Or 'my glory' for 'my splendor.' The Hebrew term can denote splendor, glory, majesty, or honor.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 백성의 여자들을[a] 너희가 그들의 안락한 집에서 쫓아내고, 그들의 어린 자녀들에게서 내 영광을 영원히 빼앗습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 백성의 아내들’. 히브리어는 일반 여성들을 가리킬 수도 있고 아내들을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 찬란함’. 히브리어는 찬란함, 영광, 위엄, 존귀를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשֵׁי עַמִּי
  english_pob_choice: the women of my people
  chosen_korean: 내 백성의 여자들
  alternatives_korean:
  - 내 백성의 아내들
  lexicon: HALOT
  rationale: נְשֵׁי는 אִשָּׁה의 복수 연계형으로 ‘여자들/아내들’ 둘 다 가능하므로, 문맥상 특정 혼인 상태보다 사회적으로 짓밟히는 여성 집단을 드러내는 ‘여자들’이 더 넓고 자연스럽습니다.
- source_word: תְּגָרְשׁוּן
  english_pob_choice: you drive out
  chosen_korean: 쫓아내며
  alternatives_korean:
  - 내쫓으며
  - 추방하며
  lexicon: HALOT
  rationale: גרשׁ의 피엘은 강제적인 몰아냄을 뜻하므로, 일상적이면서도 폭력성을 살리는 ‘쫓아내다’가 가장 잘 맞습니다.
- source_word: מִבֵּית תַּעֲנֻגֶיהָ
  english_pob_choice: from their delightful houses
  chosen_korean: 그들의 즐거운 집에서
  alternatives_korean:
  - 그들의 기쁜 집에서
  - 그들의 쾌락의 집에서
  lexicon: HALOT
  rationale: בַּיִת은 집/가옥을, תַּעֲנֻגִים은 즐거움·안락을 뜻하므로, 주거의 안락함을 살리는 ‘즐거운 집’이 직역성과 자연스러움 사이에서 적절합니다.
- source_word: הֲדָרִי
  english_pob_choice: my splendor
  chosen_korean: 내 영광
  alternatives_korean:
  - 내 찬란함
  - 내 존귀
  lexicon: HALOT
  rationale: הָדָר는 splendor, majesty, honor 범위를 가지며, 한국어에서는 ‘영광’이 높임의 광휘를 가장 자연스럽게 전달합니다. 다만 본문이 하나님 자신의 영광을 말하는지, 그분이 주신 백성의 존귀를 가리키는지 긴장을 남겨 두었습니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 항상
  lexicon: HALOT
  rationale: עוֹלָם의 지속성을 현대 한국어로 가장 직접적으로 옮기면 ‘영원히’입니다.
theological_decisions:
- issue: ‘내 영광’의 주어와 의미 범위
  chosen_reading: 문맥상 화자는 야훼이므로, ‘내 영광’은 그대로 유지해 하나님의 영광이자 그분이 자기 백성에게 주신 존귀를 함께 열어 둡니다.
  alternative_readings:
  - ‘백성의 영광’으로 풀어 백성의 존엄을 가리키는 뜻으로 제한
  rationale: 예언적 고발의 날카로움을 유지하려면 소유격을 약화하지 않는 편이 좋으며, 동시에 의미의 긴장을 설명적 주석으로 해결하지 않는 것이 본문에 더 충실합니다.
  doctrine_reference: 본문의 신학적 긴장을 보존한다.
