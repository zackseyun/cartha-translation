id: MIC.2.13
reference: Micah 2:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָלָ֤ה הַ/פֹּרֵץ֙ לִ/פְנֵי/הֶ֔ם פָּֽרְצוּ֙ וַֽ/יַּעֲבֹ֔רוּ שַׁ֖עַר וַ/יֵּ֣צְאוּ ב֑/וֹ וַ/יַּעֲבֹ֤ר מַלְכָּ/ם֙ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה בְּ/רֹאשָֽׁ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/013.yaml
  text: The one who breaks through has gone up before them[a]; they have broken through and passed through the gate, and gone out by it. Their king passes on before them[c][b], and Yahweh is at their head.
  footnotes:
  - marker: a
    text: Or 'the breaker.' The Hebrew participle can function as a title-like designation for one who breaches an obstacle or opens the way.
    reason: lexical_alternative
  - marker: b
    text: 'The identity of ''the one who breaks through'' is debated: some understand a military leader, some the king, and some the LORD himself. The Hebrew leaves the relationship implicit.'
    reason: alternative_reading
  - marker: c
    text: Hebrew 'YHWH'; rendered 'the LORD' in keeping with the translation's standard practice.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 돌파하는 이가 그들보다 앞서 올라가며[a], 그들이 돌파하여 문을 지나 나가고, 그들의 왕이 그들보다 앞서 지나가며[b] 야훼께서 그들 머리에 계십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돌파자’. 히브리어 분사는 장애물을 뚫고 길을 여는 자를 가리키는 제목처럼 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 돌파하는 이’가 누구인지에 대해서는 해석이 갈립니다. 군사 지도자, 왕, 또는 야훼 자신으로 이해할 수 있으나, 히브리어는 그 관계를 분명히 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפֹּרֵץ
  english_pob_choice: the one who breaks through
  chosen_korean: 그 돌파하는 이
  alternatives_korean:
  - 그 돌파자
  - 그 돌파하는 자
  lexicon: HALOT
  rationale: 분사형 명사구를 제목처럼 처리하되, ‘돌파하다’로 원문의 ‘뚫고 나아감’ 이미지를 직접 살렸습니다.
- source_word: עָלָה
  english_pob_choice: has gone up
  chosen_korean: 올라가며
  alternatives_korean:
  - 올라갔으며
  - 올라가
  lexicon: HALOT
  rationale: 히브리어 완료형의 연속 동작을 한국어 서술 흐름에 맞게 연결하면서, 상승/진군의 동작을 보존했습니다.
- source_word: שַׁעַר
  english_pob_choice: the gate
  chosen_korean: 문
  alternatives_korean:
  - 성문
  - 문을
  lexicon: HALOT
  rationale: 여기서는 특정 성문 자체보다 ‘통과 지점’의 기능이 핵심이므로, 한국어에서는 자연스러운 ‘문’으로 옮겼습니다.
- source_word: וַיהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 YHWH를 ‘야훼’로 옮겨, 본문이 지시하는 신명 표지를 직접 드러냈습니다.
- source_word: בְּרֹאשָׁם
  english_pob_choice: at their head
  chosen_korean: 그들 머리에 계십니다
  alternatives_korean:
  - 그들 앞에 계십니다
  - 그들의 머리에서 이끄십니다
  lexicon: HALOT
  rationale: 관용구를 직역해 ‘머리’ 이미지를 살리되, 한국어에서 자연스럽게 읽히도록 존재 서술로 처리했습니다.
theological_decisions:
- issue: ‘그 돌파하는 이’와 ‘그들의 왕’과 ‘야훼’의 관계
  chosen_reading: 본문의 병렬과 긴장을 그대로 두고, 동일 인물로 단정하지 않았습니다.
  alternative_readings:
  - 그 돌파하는 이를 왕 혹은 메시아로 특정하기
  - ‘그들의 왕’과 ‘야훼’를 같은 존재로 합치기
  rationale: 히브리어는 세 표현을 연속해 두지만 그 관계를 명시적으로 풀지 않으므로, 번역도 해석을 앞세워 긴장을 지우지 않도록 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
