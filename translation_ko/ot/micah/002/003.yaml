id: MIC.2.3
reference: Micah 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י חֹשֵׁ֛ב עַל הַ/מִּשְׁפָּחָ֥ה הַ/זֹּ֖את רָעָ֑ה אֲ֠שֶׁר לֹֽא תָמִ֨ישׁוּ מִ/שָּׁ֜ם צַוְּארֹֽתֵי/כֶ֗ם וְ/לֹ֤א תֵֽלְכוּ֙ רוֹמָ֔ה כִּ֛י עֵ֥ת רָעָ֖ה הִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/003.yaml
  text: 'Therefore[a], this is what Yahweh says: Look, I am planning disaster against this family, from which you will not remove your necks, and you will not walk haughtily[d][c][b], for it is an evil time.'
  footnotes:
  - marker: a
    text: Or 'family.' The Hebrew מִשְׁפָּחָה can denote a household, family line, or larger clan-group.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from there you will not remove your necks,' an image of being unable to escape an imposed yoke or burden.
    reason: cultural_note
  - marker: c
    text: Or 'you will not walk proudly' / 'with head held high.'
    reason: lexical_alternative
  - marker: d
    text: The Hebrew repeats the word רָעָה ('evil/disaster') earlier in the verse, creating a wordplay between the announced judgment and the coming time.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로[a] 야훼께서 이렇게 말씀하십니다. "보라, 내가 이 가문에 재앙을 계획하고 있습니다. 너희는 거기서 너희 목을 빼낼 수 없으며, 교만하게 걷지도 못할 것입니다[b][c][d]. 이는 악한 때이기 때문입니다."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가문/씨족.’ 히브리어 מִשְׁפָּחָה는 가족, 가문, 더 넓은 친족 집단을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘거기서 너희 목을 빼내지 못할 것이다’로, 멍에나 짐 아래에서 벗어나지 못하는 이미지를 담고 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘교만하게’ / ‘머리를 높이 들고’.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 앞부분의 רָעָה를 다시 반복하여, 선언된 재앙과 다가올 때 사이의 말놀이를 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 그런즉
  lexicon: HALOT
  rationale: 앞선 문맥에 대한 결론을 여는 인과·추론 접속사로 자연스럽게 옮겼습니다.
- source_word: מִשְׁפָּחָה
  english_pob_choice: against this family / clan
  chosen_korean: 이 가문
  alternatives_korean:
  - 이 가족
  - 이 집안
  - 이 씨족
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 가족보다 넓은 친족·집단을 가리킬 수 있으므로, 개인 가정보다 공동체적 범위를 살릴 수 있는 ‘가문’을 택했습니다.
- source_word: חֹשֵׁב עַל
  english_pob_choice: I am planning
  chosen_korean: 내가 ... 계획하고 있습니다
  alternatives_korean:
  - 내가 ... 도모하고 있습니다
  - 내가 ... 생각하고 있습니다
  lexicon: HALOT
  rationale: 의도적이고 능동적인 심판 결의를 드러내기 위해 ‘계획하다’로 옮겼고, 현재 진행형으로 선언의 긴박감을 살렸습니다.
- source_word: רָעָה
  english_pob_choice: disaster / evil time
  chosen_korean: 재앙 / 악한 때
  alternatives_korean:
  - 재난 / 재앙의 때
  - 화 / 곤란한 때
  lexicon: HALOT
  rationale: 첫 번째는 하나님의 심판이므로 도덕적 악이 아니라 ‘재앙’으로, 끝의 반복은 원문의 어휘 대응을 살리되 한국어에서는 ‘악한 때’로 옮겨 말놀이를 보존했습니다.
- source_word: תָמִישׁוּ מִשָּׁם צַוְּארֹתֵיכֶם
  english_pob_choice: you will not remove your necks
  chosen_korean: 너희는 거기서 너희 목을 빼낼 수 없으며
  alternatives_korean:
  - 너희는 거기서 목을 빼지 못할 것이며
  - 너희는 거기서 목을 벗어날 수 없으며
  lexicon: HALOT
  rationale: 목에 얹힌 멍에나 억압에서 벗어나지 못하는 이미지를 비교적 직역적으로 유지했습니다.
- source_word: רוֹמָה
  english_pob_choice: walk haughtily
  chosen_korean: 교만하게 걷다
  alternatives_korean:
  - 거만하게 걷다
  - 머리를 높이 들고 걷다
  lexicon: HALOT
  rationale: ‘높음/고양됨’의 뉘앙스를 한국어의 태도 표현으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 여호와 신명 칭호의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 히브리어 신명은 학술적 전사인 ‘야훼’를 사용했습니다.
  doctrine_reference: POB glossary default; source-language transparency
- issue: 하나님의 심판을 가리키는 רָעָה의 의미
  chosen_reading: ‘재앙’으로 번역하여 하나님의 도덕적 악으로 읽히지 않도록 했습니다.
  alternative_readings:
  - 악
  - 재난
  rationale: 문맥상 מדובר는 घोषित된 심판의 결과이므로, 하나님께 윤리적 악을 돌리는 오해를 피하면서도 원문 반복을 일부 보존했습니다.
  doctrine_reference: historic orthodoxy; translation philosophy
