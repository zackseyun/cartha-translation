source:
  edition: WLC
  text: וְ/חָמְד֤וּ שָׂדוֹת֙ וְ/גָזָ֔לוּ וּ/בָתִּ֖ים וְ/נָשָׂ֑אוּ וְ/עָֽשְׁקוּ֙ גֶּ֣בֶר וּ/בֵית֔/וֹ וְ/אִ֖ישׁ וְ/נַחֲלָתֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/002.yaml
  text: They covet fields and seize them[a], and houses and take them away; they oppress a man and his house[c][b], a man and his inheritance.
  footnotes:
  - marker: a
    text: Or 'rob' / 'take by force' for 'seize.'
    reason: lexical_alternative
  - marker: b
    text: Or 'carry them off' for 'take them away.'
    reason: lexical_alternative
  - marker: c
    text: '''His inheritance'' can refer especially to inherited land or patrimony, not merely possessions in general.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 밭을 탐내어 빼앗고, 집들을 가져가며, 한 사람과 그의 집을 억압하고, 한 사람과 그의 유산을 억압합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָמְדוּ
  english_pob_choice: covet
  chosen_korean: 탐내어
  alternatives_korean:
  - 원하여
  - 욕하여
  lexicon: HALOT
  rationale: 죄책이 드러나는 wrongful desire를 살리기 위해 단순한 ‘원하다’보다 ‘탐내다’ 계열을 택했습니다.
- source_word: גָזָלוּ
  english_pob_choice: seize
  chosen_korean: 빼앗고
  alternatives_korean:
  - 빼앗아
  - 강탈하고
  - 탈취하고
  lexicon: HALOT
  rationale: 불의한 강제 취득의 폭력을 살리면서도 현대 한국어에서 자연스러운 동사로 옮겼습니다.
- source_word: נָשָׂאוּ
  english_pob_choice: take them away
  chosen_korean: 가져가며
  alternatives_korean:
  - 끌고 가며
  - 옮겨가며
  - 치워버리며
  lexicon: HALOT
  rationale: 이미 빼앗은 집을 ‘가져가다’로 옮겨, 소유의 강제적 이전을 간결하게 드러냈습니다.
- source_word: נַחֲלָתוֹ
  english_pob_choice: his inheritance
  chosen_korean: 유산
  alternatives_korean:
  - 상속 재산
  - 대물림된 땅
  - 기업
  lexicon: HALOT
  rationale: 문맥상 물질적 소유와 상속받은 몫을 함께 가리키므로, ‘유산’이 법적·가문적 함의를 가장 무리 없이 담습니다.
theological_decisions:
- issue: גֶּבֶר / אִישׁ의 대표적 단수 표현
  chosen_reading: 한 사람 ... 한 사람
  alternative_readings:
  - 사람 ... 사람
  - 사람들 ... 그들의
  rationale: 히브리어의 남성 단수 병렬을 그대로 두되, 한국어에서는 성별 강조보다 대표적 인물 하나를 가리키는 기능을 살려 ‘한 사람’으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
