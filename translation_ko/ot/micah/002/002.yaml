  source_fidelity: 첫 두 절은 밭과 집을 각각 탐내고 빼앗거나 가져가는 행위를 충실히 반영합니다. 그러나 בֵיתוֹ는 앞선 재산 박탈의 문맥에서 ‘그의 집’이라는 물적 의미도 보존할 필요가 있는데, 초안의 ‘그의 집안’은 이를 ‘가정/식구’로 한정합니다. ‘그의 집’으로 고쳐 원문의 의미 범위를 보존합니다.
