id: MIC.2.11
reference: Micah 2:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לוּ אִ֞ישׁ הֹלֵ֥ךְ ר֨וּחַ֙ וָ/שֶׁ֣קֶר כִּזֵּ֔ב אַטִּ֣ף לְ/ךָ֔ לַ/יַּ֖יִן וְ/לַ/שֵּׁכָ֑ר וְ/הָיָ֥ה מַטִּ֖יף הָ/עָ֥ם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/011.yaml
  text: If a man should go about with wind and falsehood[a], lying, ‘I will preach to you of wine and strong drink,’ he would be the preacher of this people.
  footnotes:
  - marker: a
    text: Or, more formally, “I will prophesy to you of wine and strong drink … he would be the prophet for this people.” The Hebrew verb is the same in both clauses and is often used for prophetic speech, here with biting irony.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 어떤 사람이 바람과 거짓을 품고 다니며 거짓말을 하여, “내가 너희에게 포도주와 독주에 대하여 예언하겠다”라고 한다면, 그는 이 백성의 예언자가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נטף는 본래 ‘방울져 흐르다’를 뜻하며, 예언적 발화를 가리키는 데에도 쓰입니다. 여기서는 “예언하겠다”와 “예언자”에 해당하는 두 절에 같은 어근이 반복되어, 거짓된 예언자를 비꼬는 반어를 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּ
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 만약
  - ~라면
  lexicon: HALOT
  rationale: 가정적·조건적 상황을 자연스럽게 열어 주는 현대 한국어 표현으로 ‘만일’을 택했습니다.
- source_word: הֹלֵךְ רוּחַ וָשֶׁקֶר
  english_pob_choice: should go about with wind and falsehood
  chosen_korean: 바람과 거짓을 따라 다니며
  alternatives_korean:
  - 바람과 거짓 가운데 다니며
  - 헛된 것과 거짓을 좇으며
  - 바람과 거짓을 지니고 다니며
  lexicon: HALOT
  rationale: ‘바람’의 공허함과 ‘거짓’의 기만성을 살리되, 한국어에서 부자연스러운 직역을 피하기 위해 ‘따라 다니며’로 행위의 지속성을 표현했습니다.
- source_word: כִּזֵּב
  english_pob_choice: lying
  chosen_korean: 속이고
  alternatives_korean:
  - 거짓말하며
  - 거짓되게 말하며
  - 속이며
  lexicon: HALOT
  rationale: 앞절의 ‘거짓’과 의미를 겹치면서도 동작으로 자연스럽게 이어지도록 ‘속이고’로 옮겼습니다.
- source_word: אַטִּף / מַטִּיף
  english_pob_choice: I will preach / he would be the preacher
  chosen_korean: 예언하겠다 / 예언자가 될 것입니다
  alternatives_korean:
  - 전하겠다 / 전하는 사람이 될 것입니다
  - 설교하겠다 / 설교자가 될 것입니다
  - 예언하겠다 / 예언하는 사람이 될 것입니다
  lexicon: HALOT
  rationale: 히브리어 נטף가 예언적 발화를 가리킬 수 있다는 점을 반영해 본문에는 ‘예언하겠다’를 두고, 직능 명사도 ‘예언자’로 맞춰 어휘적 대응을 유지했습니다.
- source_word: לְךָ
  english_pob_choice: to you
  chosen_korean: 너희에게
  alternatives_korean:
  - 너에게
  - 당신에게
  lexicon: HALOT
  rationale: 문맥상 복수 청중에게 하는 말이므로 한국어에서는 자연스럽게 복수 대상인 ‘너희에게’로 옮겼습니다.
- source_word: לַיַּיִן וְלַשֵּׁכָר
  english_pob_choice: of wine and strong drink
  chosen_korean: 포도주와 독주에 대하여
  alternatives_korean:
  - 포도주와 독주에 관하여
  - 포도주와 독주를 두고
  - 술과 독주에 대하여
  lexicon: HALOT
  rationale: 전치사의 내용·주제 기능을 살려 ‘~에 대하여’로 처리했고, ‘strong drink’는 성경적 관용을 살려 ‘독주’로 옮겼습니다.
- source_word: הָעָם הַזֶּה
  english_pob_choice: this people
  chosen_korean: 이 백성
  alternatives_korean:
  - 이 사람들
  - 이 ժողովուրդ
  - 이 민족
  lexicon: HALOT
  rationale: 히브리어 집합 명사로서의 뉘앙스를 살리기 위해 ‘백성’을 택했고, 조소 섞인 예언자적 호칭도 유지했습니다.
theological_decisions:
- issue: נטף의 예언적 용례를 한국어에서 어떻게 드러낼지
  chosen_reading: 본문에는 ‘예언하다’를 사용하고, 동일 동사의 반복을 통해 역설과 비꼼을 유지했습니다.
  alternative_readings:
  - 전하다로 완화
  - 설교하다로 일반화
  - 본문은 직역하고 각주로만 예언적 의미 제시
  rationale: 이 구절은 거짓 예언자를 풍자하는 문맥이므로, 단순한 정보 전달이 아니라 예언 발화라는 점을 본문에서 드러내는 편이 원문의 반어를 더 잘 보존합니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
- issue: ‘this people’의 비판적 지시 대상 표현
  chosen_reading: ‘이 백성’으로 옮겨 예언자적 책망의 거리감을 유지했습니다.
  alternative_readings:
  - ‘이 사람들’로 평이하게 처리
  - ‘이 민족’으로 집단성을 강조
  rationale: 원문은 집합적이면서도 책망의 뉘앙스가 강하므로, 한국어에서도 예언자적 호칭인 ‘백성’을 사용해 어조를 보존했습니다.
  doctrine_reference: 번역 원칙 §§1, 6
