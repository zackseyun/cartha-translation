id: MIC.2.8
reference: Micah 2:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶתְמ֗וּל עַמִּ/י֙ לְ/אוֹיֵ֣ב יְקוֹמֵ֔ם מִ/מּ֣וּל שַׂלְמָ֔ה אֶ֖דֶר תַּפְשִׁט֑וּ/ן מֵ/עֹבְרִ֣ים בֶּ֔טַח שׁוּבֵ֖י מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/008.yaml
  text: But lately my people have risen up as an enemy; from off the garment you strip the robe from those who pass by securely[a], those returning from war.
  footnotes:
  - marker: a
    text: Or, 'those who shrink from war' / 'those turned away from battle.' The Hebrew final phrase is difficult and may describe peaceful noncombatants rather than soldiers returning home.
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 최근에 내 백성이 원수처럼 일어났습니다. 당신들은 안심하고 지나가는 이들, 곧 전쟁에서 돌아오는 자들로부터 겉옷을 벗기고 그 옷을 빼앗습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마지막 구절은 해석이 어렵습니다. ‘전쟁에서 돌아오는 자들’로도 읽을 수 있고, ‘전쟁을 피하는 자들’ 또는 ‘전투에서 물러난 자들’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶתְמוּל
  english_pob_choice: But lately
  chosen_korean: 그런데 최근에
  alternatives_korean:
  - 그런데 어제는
  - 그런데 요즘에
  lexicon: HALOT
  rationale: 문자적으로는 ‘어제/최근’이지만, 예언 문맥의 대조를 살려 ‘최근에’로 옮기는 것이 자연스럽습니다.
- source_word: לְאוֹיֵב יְקוֹמֵם
  english_pob_choice: have risen up as an enemy
  chosen_korean: 원수처럼 일어났습니다
  alternatives_korean:
  - 원수로 일어났습니다
  - 원수로 맞서 일어났습니다
  lexicon: HALOT
  rationale: ל의 비교적 용법을 반영해 존재론적 변화를 단정하지 않고 ‘~처럼’으로 처리했습니다.
- source_word: שַׂלְמָה אֶדֶר
  english_pob_choice: the robe ... the garment
  chosen_korean: 겉옷 ... 옷
  alternatives_korean:
  - 망토 ... 옷
  - 외투 ... 장식
  lexicon: HALOT
  rationale: 두 명사의 정확한 구분을 과도하게 기술화하기보다, 서로 다른 겉옷 이미지를 살려 ‘겉옷’과 ‘옷’으로 옮겼습니다.
- source_word: מֵעֹבְרִים בֶּטַח
  english_pob_choice: those who pass by securely
  chosen_korean: 안심하고 지나가는 이들
  alternatives_korean:
  - 평안히 지나가는 이들
  - 안전하게 지나가는 행인들
  lexicon: HALOT
  rationale: ‘안전/평안’의 의미를 한국어 부사구로 자연스럽게 풀어, 무방비한 행인의 상태를 드러냈습니다.
- source_word: שׁוּבֵי מִלְחָמָה
  english_pob_choice: those returning from war
  chosen_korean: 전쟁에서 돌아오는 자들
  alternatives_korean:
  - 전쟁을 피해 돌아선 자들
  - 전투에서 물러난 자들
  lexicon: HALOT
  rationale: 히브리어 구문이 난해하지만, 가장 პირდაპირ적인 읽음인 ‘전쟁에서 돌아오는 자들’을 본문에 두고 다른 가능성은 주석으로 남기는 편이 적절합니다.
theological_decisions:
- issue: 마지막 구절 שׁוּבֵי מִלְחָמָה의 해석
  chosen_reading: 본문은 ‘전쟁에서 돌아오는 자들’로 옮기고, 의미상의 불확실성은 드러내지 않고 본문 안에서는 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 전쟁을 피하는 자들
  - 전투에서 돌아선 자들
  rationale: 이 구절은 교리적 쟁점은 아니지만 해석상 난점이 있으므로, 본문은 가장 직접적인 의미를 유지하고 대안은 각주에서 보존하는 것이 원문 충실도에 부합합니다.
  doctrine_reference: '번역 원칙 §3: 실제로 존재하는 모호성은 지우지 말고 보존한다'
