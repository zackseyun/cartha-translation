  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘...이들로부터 겉옷을 벗기고 그 옷을 빼앗습니다’는 מִמּוּל שַׂלְמָה אֶדֶר תַּפְשִׁטוּן의 의복 관계를 흐리며, 원문에 없는 ‘빼앗습니다’라는 별도 행위를 보탭니다. ‘옷 위에 걸친 겉옷을 벗겨 내다’로 옮겨 한 의복을 다른 의복 위에서 벗기는 원문의 이미지를 보존하는 것이 안전합니다. 난해한 שׁוּבֵי מִלְחָמָה는 본문과 각주에서 유지합니다.
  naturalness: ‘안심하고 지나가는 이들, 곧 전쟁에서 돌아오는 자들’은 자연스럽지만, 목적어와 의복 구문을 재배열하면 현대 한국어 합쇼체에서 더 분명합니다. ‘원수처럼 맞서 일어났습니다’는 적대적 대항의 문맥을 자연스럽게 드러냅니다.
  terminology: ‘내 백성’, ‘원수’, ‘겉옷’은 적절합니다. שַׂלְמָה와 אֶדֶר의 정확한 물질적 구별은 확정하기 어려우므로 ‘옷’과 ‘겉옷’의 관계로만 표현합니다. 마지막 구절의 대안은 ‘전쟁을 피하는’보다 원문의 논쟁적 가능성을 더 절제되게 반영한 ‘전쟁을 꺼리는’으로 제시합니다.
