  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תַּטִּ֖פוּ יַטִּיפ֑וּ/ן לֹֽא יַטִּ֣פוּ לָ/אֵ֔לֶּה לֹ֥א יִסַּ֖ג כְּלִמּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/006.yaml
  text: “Do not preach,” they preach. “One should not preach about these things; disgrace will not overtake us.”
translation:
  language: ko
  text: 「예언하지 말라」고 그들이 말합니다. 「이런 것들에 대해 예언해서는 안 된다. 치욕이 우리에게 닥치지 않을 것이다」라고 합니다.
  philosophy: formal
lexical_decisions:
- source_word: אַל תַּטִּפּוּ / יַטִּיפּוּ
  english_pob_choice: “Do not preach,” they preach
  chosen_korean: 「예언하지 말라」고 그들이 말합니다
  alternatives_korean:
  - 「설교하지 말라」고 그들이 말합니다
  - 「전하지 말라」고 그들이 말합니다
  lexicon: טפף
  rationale: 히브리어 동사는 원래 ‘방울지다/흘리다’에서 파생된 예언적 발화를 가리키는 관용으로 쓰이므로, 한국어에서는 문맥상 ‘예언하다’로 옮기는 것이 원문 기능을 가장 직접적으로 드러냅니다.
- source_word: לָאֵלֶּה
  english_pob_choice: about these things
  chosen_korean: 이런 것들에 대해
  alternatives_korean:
  - 이 일들에 대해
  - 이것들에 관해
  lexicon: אלה
  rationale: 대상은 추상적 사안들을 가리키므로 ‘about these things’의 의미를 살려 ‘이런 것들에 대해’로 옮겼습니다.
- source_word: לֹא יִסַּג כְּלִמּוֹת
  english_pob_choice: disgrace will not overtake us
  chosen_korean: 치욕이 우리에게 닥치지 않을 것이다
  alternatives_korean:
  - 수치가 우리를 덮치지 않을 것이다
  - 치욕이 우리를 따르지 않을 것이다
  lexicon: סוג / כלמה
  rationale: ‘오다/뒤쫓다’보다 재난이 임하는 이미지를 살려 ‘닥치다’를 선택했고, כְּלִמּוֹת은 공개적 수치를 뜻하는 말이므로 ‘치욕’이 적절합니다.
theological_decisions:
- issue: 예언 행위에 대한 비난을 한국어로 어떻게 재현할 것인가
  chosen_reading: 본문의 풍자를 살려, 사람들이 예언을 막으면서도 동시에 말하고 있는 역설을 그대로 드러냈습니다.
  alternative_readings:
  - ‘설교’로 완곡하게 옮기는 방식
  - ‘전파’로 일반화하는 방식
  rationale: 이 구절은 발화 내용 자체의 모순을 드러내는 풍자적 구조가 핵심이므로, ‘예언하지 말라’와 ‘그들이 말합니다’를 병치해 역설을 보존했습니다.
  doctrine_reference: Micah 2:6의 수사적 풍자 이해
