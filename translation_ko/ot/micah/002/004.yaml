source:
  edition: WLC
  text: בַּ/יּ֨וֹם הַ/ה֜וּא יִשָּׂ֧א עֲלֵי/כֶ֣ם מָשָׁ֗ל וְ/נָהָ֨ה נְהִ֤י נִֽהְיָה֙ אָמַר֙ שָׁד֣וֹד נְשַׁדֻּ֔נוּ חֵ֥לֶק עַמִּ֖/י יָמִ֑יר אֵ֚יךְ יָמִ֣ישׁ לִ֔/י לְ/שׁוֹבֵ֥ב שָׂדֵ֖י/נוּ יְחַלֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/004.yaml
  text: On that day one will take up a taunt against you and lament a lament[a], saying, “We are utterly ruined! He changes the portion of my people[b]. How he removes it from me! To the one who turns away he divides our fields.”
  footnotes:
  - marker: a
    text: Or 'and wail a wailing,' or 'and chant a dirge.' The Hebrew repeats cognate mourning terms for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to the apostate'; the phrase may also be understood as 'to a rebel' or, less likely, 'to the captor/one who turns back.'
    reason: alternative_reading
translation:
  language: ko
  text: 그날에 사람들이 너희를 두고 조롱의 말을 하며, 애가를 부르며 애곡할 것입니다[a]. 이렇게 말할 것입니다. “우리는 철저히 약탈당했습니다! 그가 내 백성의 몫을 바꿉니다. 어찌 그것을 내게서 빼앗아 갑니까! 돌아서는 자에게[b] 그가 우리 밭을 나눕니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 애도와 관련된 동족어를 거듭 써서 슬픔을 강조합니다. ‘애도하며 애도의 노래를 부르다’, ‘통곡하며 통곡의 노래를 부르다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 어려운 표현입니다. ‘배교자’ 또는 ‘반역자’로도 옮길 수 있으며, 더 낮은 가능성으로 ‘사로잡는 자’나 ‘되돌아오는 자’를 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשָּׂא ... מָשָׁל
  english_pob_choice: will take up a taunt
  chosen_korean: 비유를 들어 조롱하며
  alternatives_korean:
  - 우화를 들어
  - 풍자적인 말을 하며
  - 조롱의 말을 꺼내며
  lexicon: HALOT
  rationale: מָשָׁל은 문맥에 따라 비유·격언·조롱의 말을 가리킬 수 있는데, 심판 선언의 맥락에서는 공개적 조롱의 뉘앙스가 강하므로 ‘조롱하며’로 옮기고, 관용구 ‘take up’를 ‘비유를 들어’로 살렸습니다.
- source_word: וְנָהָה נְהִי נִהְיָה
  english_pob_choice: and lament a lament
  chosen_korean: 애가를 지을 것입니다
  alternatives_korean:
  - 통곡하며 통곡할 것입니다
  - 애곡하며 애곡할 것입니다
  - 슬퍼하며 슬퍼할 것입니다
  lexicon: HALOT
  rationale: 히브리어의 반복은 애도의 강도를 강조하므로, 한국어에서는 같은 어근의 반복보다 자연스러운 ‘애가를 짓다’로 옮겨 반복의 기능을 살렸습니다.
- source_word: לְשׁוֹבֵב
  english_pob_choice: to the one who turns away
  chosen_korean: 돌아서는 자에게
  alternatives_korean:
  - 배교한 자에게
  - 반역하는 자에게
  - 돌이키는 자에게
  lexicon: HALOT
  rationale: 이 표현은 어원상 ‘돌아서는/되돌아가는 자’의 뜻이 가능하므로, 영어 POB의 최종 수정처럼 해석을 과하게 좁히지 않고 ‘돌아서는 자’로 투명하게 옮겼습니다.
- source_word: שָׂדֵינוּ יְחַלֵּק
  english_pob_choice: he divides our fields
  chosen_korean: 우리 밭을 나눕니다
  alternatives_korean:
  - 우리 밭을 분배합니다
  - 우리 밭을 배분합니다
  - 우리 밭을 분할합니다
  lexicon: HALOT
  rationale: יְחַלֵּק은 나누다/분배하다의 뜻이므로, 토지 상실의 장면에 자연스러운 ‘나눕니다’를 택해 분배 행위와 소유 이전의 긴장을 함께 드러냈습니다.
theological_decisions:
- issue: לְשׁוֹבֵב의 해석 범위
  chosen_reading: ‘돌아서는 자’처럼 비교적 중립적인 표현을 본문에 두고, 배교·반역의 의미를 확정하지 않았습니다.
  alternative_readings:
  - 배교한 자
  - 반역하는 자
  - 포로로 끌고 간 자
  rationale: 히브리어가 실제로 모호하므로 본문에서 의미를 과도하게 신학화하지 않고, 독자가 문맥 안에서 판단하도록 여지를 남겼습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
