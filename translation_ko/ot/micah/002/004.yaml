revisions:
- from: 그날에 사람들이 너희를 거슬러 비유를 들어 조롱하며 애가를 지을 것입니다. 「우리는 완전히 망했습니다! 내 백성의 몫을 그가 바꿉니다. 어찌 그것을 내게서 빼앗아 갑니까! 돌아서는 자에게 그가 우리 밭을 나눕니다」.[a][b]
  to: 그날에 사람들이 너희를 두고 조롱의 말을 하며, 애가를 부르며 애곡할 것입니다[a]. 이렇게 말할 것입니다. “우리는 철저히 약탈당했습니다! 그가 내 백성의 몫을 바꿉니다. 어찌 그것을 내게서 빼앗아 갑니까! 돌아서는 자에게[b] 그가 우리 밭을 나눕니다.”
  rationale: 조롱과 애도의 병행을 자연스러운 한국어로 정리하고, 약탈을 뜻하는 강조 표현을 보다 직접적으로 반영했습니다. 논쟁적인 לְשׁוֹבֵב는 ‘돌아서는 자’로 유지하되, 해석 대안을 독자용 각주에 제시했습니다. 각주 표지도 각각의 해당 표현에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:43:34Z'
