  source_fidelity: ‘비유를 들어 조롱하며’는 מָשָׁל의 문맥상 기능인 조롱의 발화를 다소 부자연스럽게 결합합니다. 또한 שָׁדוֹד נְשַׁדֻּנוּ의 약탈·탈취 의미는 ‘망했습니다’보다 ‘약탈당했습니다’가 더 직접적으로 반영합니다. 어려운 לְשׁוֹבֵב의 모호성은 본문과 주석에서 유지되어야 합니다.
  naturalness: ‘조롱의 말을 하며’와 ‘애가를 부르며 애곡할 것입니다’는 현대 표준 한국어의 합쇼체에 자연스럽고, 히브리어의 애도 관련 반복도 어느 정도 드러냅니다. 각주 표지는 해당 어구 바로 뒤에 배치하는 편이 명확합니다.
  terminology: מָשָׁל은 여기서 ‘비유’보다 ‘조롱의 말’이 문맥에 맞습니다. נְשַׁדֻּנוּ는 ‘약탈당했습니다’로, לְשׁוֹבֵב는 해석을 확정하지 않는 ‘돌아서는 자’로 옮깁니다. ‘내 백성의 몫’과 ‘우리 밭’은 토지 분배의 어휘를 잘 보존합니다.
