source:
  edition: WLC
  text: אָסֹ֨ף אֶאֱסֹ֜ף יַעֲקֹ֣ב כֻּלָּ֗/ךְ קַבֵּ֤ץ אֲקַבֵּץ֙ שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל יַ֥חַד אֲשִׂימֶ֖/נּוּ כְּ/צֹ֣אן בָּצְרָ֑ה כְּ/עֵ֨דֶר֙ בְּ/ת֣וֹךְ הַ/דָּֽבְר֔/וֹ תְּהִימֶ֖נָה מֵ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/012.yaml
  text: I will surely gather all of you[a], Jacob; I will surely collect the remnant of Israel. Together I will set them like the sheep of Bozrah, like a flock in the midst of its pasture[c][b]; they will be noisy with men.
  footnotes:
  - marker: a
    text: Or 'like sheep in a fold.' The Hebrew בָּצְרָה is traditionally read as the place name 'Bozrah,' but some take it as related to a word for an enclosure or sheepfold.
    reason: lexical_alternative
  - marker: b
    text: Or 'they will be noisy because of people' / 'they will throng with people.' The Hebrew expression is difficult.
    reason: alternative_reading
  - marker: c
    text: Hebrew 'men'; here the sense is human beings generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희를 반드시 다 모으리니, 야곱아, 이스라엘의 남은 자를 반드시 모으리라. 함께 그들을 보스라의 양들처럼[a], 그 목장 한가운데 있는 양 떼처럼 두리니, 사람들로 소란할 것이다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘울타리 안의 양들처럼’. 히브리어 בָּצְרָה는 전통적으로 지명 ‘보스라’로 읽지만, 어떤 해석은 울타리나 양우리와 관련된 말로 봅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사람들 때문에 소란할 것이다’ / ‘사람들로 북적일 것이다’. 히브리어 표현은 어렵습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָסֹף אֶאֱסֹף / קַבֵּץ אֲקַבֵּץ
  english_pob_choice: I will surely gather / I will surely collect
  chosen_korean: 반드시 다 모으리니 / 반드시 모으리라
  alternatives_korean:
  - 반드시 모으리니 / 반드시 모으리라
  - 꼭 거두어 모으리니 / 꼭 모으리라
  lexicon: HALOT
  rationale: 두 겹의 강조형 동사 구조를 한국어에서도 부사 ‘반드시’로 살리고, ‘모으다’로 첫 동사의 모임 이미지를 유지했습니다. 두 번째 동사는 같은 어근의 반복을 자연스럽게 받쳐 주는 ‘모으다’로 옮겼습니다.
- source_word: יַעֲקֹב כֻּלָּךְ / שְׁאֵרִית יִשְׂרָאֵל
  english_pob_choice: all of you, Jacob / the remnant of Israel
  chosen_korean: 너희를 … 야곱아 / 이스라엘의 남은 자
  alternatives_korean:
  - 야곱아, 너희 모두를 / 이스라엘의 남은 자들
  - 야곱의 온 무리를 / 이스라엘의 남은 자
  lexicon: HALOT
  rationale: ‘야곱’은 공동체 전체를 부르는 직접 호칭이므로 호격 ‘야곱아’로 살렸고, ‘남은 자’는 예언서의 정형적 표현을 유지했습니다.
- source_word: כְּצֹאן בָּצְרָה
  english_pob_choice: like the sheep of Bozrah
  chosen_korean: 보스라의 양들처럼
  alternatives_korean:
  - 보스라의 양 떼처럼
  - 양우리의 양들처럼
  lexicon: HALOT
  rationale: 본문의 자음 형태를 따라 지명 ‘보스라’를 본문에 보존했습니다. 영어 POB가 주석으로 열어 둔 ‘양우리/울타리’ 가능성은 본문을 바꾸지 않고 주석 처리하는 편이 원문 우선 원칙에 맞습니다.
- source_word: כְּעֵדֶר בְּתוֹךְ הַדָּבְרוֹ
  english_pob_choice: like a flock in the midst of its pasture
  chosen_korean: 그 목장 한가운데 있는 떼처럼
  alternatives_korean:
  - 그 목초지 한가운데 있는 떼처럼
  - 그 우리 한가운데 있는 떼처럼
  lexicon: HALOT
  rationale: דָּבָר를 이곳에서는 ‘목장/목초지’로 읽는 POB의 판단을 따라, 양 떼의 평행적 이미지가 살아나도록 ‘그 목장 한가운데’로 옮겼습니다.
- source_word: תְּהִימֶנָה מֵאָדָם
  english_pob_choice: they will be noisy with men
  chosen_korean: 사람들이 많아 시끄러울 것이다
  alternatives_korean:
  - 사람들로 인해 소란할 것이다
  - 사람들로 북적일 것이다
  lexicon: HALOT
  rationale: 어려운 표현의 핵심인 ‘소란/북적임’과 인적 충만을 함께 드러내기 위해 자연스러운 한국어로 옮겼습니다. POB의 ‘with men’은 여기서 인간의 다수로 인한 소음이라는 뜻으로 이해했습니다.
theological_decisions:
- issue: 회복 약속의 대상
  chosen_reading: 이 구절은 야곱/이스라엘 전체와 ‘남은 자’의 회복과 재집합을 말하는 언약적 약속으로 보존했습니다.
  alternative_readings:
  - 영적 회복만을 가리키는 표현
  - 특정 종말론 체계에 종속된 예언
  rationale: 히브리어 본문이 직접 야곱과 이스라엘을 지칭하므로, 역사적-공동체적 의미를 축소하지 않고 그대로 반영했습니다.
  doctrine_reference: '번역 원칙 #3'
