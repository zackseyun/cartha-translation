  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: י֖וֹם לִ/בְנ֣וֹת גְּדֵרָ֑יִ/ךְ י֥וֹם הַ/ה֖וּא יִרְחַק חֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/011.yaml
  text: A day for building your walls—on that day the boundary will be far removed[a].
  footnotes:
  - marker: a
    text: Or 'the decree will be far removed.' The Hebrew word can mean 'boundary/limit' or 'decree/statute.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 성벽을 쌓을 날입니다—그날에는 경계가 멀리 옮겨질 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 법령이 멀리 옮겨질 것입니다.’ 히브리어 חֹק은 ‘경계/한계’ 또는 ‘법령/규례’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: י֖וֹם
  english_pob_choice: A day
  chosen_korean: 날입니다
  alternatives_korean:
  - 하루입니다
  - 어느 날입니다
  - 그 날입니다
  lexicon: HALOT
  rationale: 히브리어 יוֹם의 선포적·절제된 어조를 살려, 예언적 선언으로 자연스러운 ‘날입니다’로 옮겼습니다. ‘어느 날입니다’는 어감이 약하고, ‘그 날입니다’는 뒤의 יֹום הַהוּא와 중복될 수 있습니다.
- source_word: לִבְנוֹת
  english_pob_choice: for building
  chosen_korean: 성벽을 쌓을
  alternatives_korean:
  - 짓기 위한
  - 재건하기 위한
  - 세우기 위한
  lexicon: HALOT
  rationale: ל + 부정사구를 목적/용도의 자연스러운 한국어로 풀어, 예언적 압축을 유지하면서도 의미를 분명하게 했습니다. 문맥상 ‘재건’도 가능하지만 원문 동사 자체에 그 뜻을 미리 넣지는 않았습니다.
- source_word: גְּדֵרָיִךְ
  english_pob_choice: your walls
  chosen_korean: 성벽
  alternatives_korean:
  - 담장
  - 울타리
  - 벽
  lexicon: HALOT
  rationale: גדר는 둘러막는 경계나 성벽을 가리킬 수 있으므로, 회복·확장 맥락에 가장 어울리는 ‘성벽’으로 옮겼습니다. ‘울타리’는 너무 약하고, 단순 ‘벽’은 방어·경계의 뉘앙스를 덜 드러냅니다.
- source_word: חֹק
  english_pob_choice: the boundary
  chosen_korean: 경계
  alternatives_korean:
  - 법령
  - 규례
  - 한계
  lexicon: HALOT
  rationale: 본문의 성벽 이미지와 יחד 어울리도록, חֹק을 공간적 ‘경계’로 이해한 POB의 해석을 한국어로 반영했습니다. 법적 의미의 ‘법령/규례’도 가능하지만 이 절에서는 공간적 제한선이 더 자연스럽습니다.
theological_decisions:
- issue: חֹק의 의미를 공간적 경계로 읽을지 법적 규례로 읽을지
  chosen_reading: 공간적 경계/한계가 멀리 옮겨지는 것으로 읽었습니다.
  alternative_readings:
  - 법령이 멀리 옮겨질 것입니다
  - 규례가 멀리 옮겨질 것입니다
  rationale: 직전 절과 이어지는 성벽·회복의 이미지가 이 절의 핵심이므로, 제한선이 멀어진다는 뜻을 살리는 것이 문맥상 가장 강합니다. 이는 교리 문제가 아니라 어휘-문맥 판단입니다.
  doctrine_reference: 문맥적·어휘적 해석
