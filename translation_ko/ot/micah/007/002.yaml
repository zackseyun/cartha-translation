id: MIC.7.2
reference: Micah 7:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָבַ֤ד חָסִיד֙ מִן הָ/אָ֔רֶץ וְ/יָשָׁ֥ר בָּ/אָדָ֖ם אָ֑יִן כֻּלָּ/ם֙ לְ/דָמִ֣ים יֶאֱרֹ֔בוּ אִ֥ישׁ אֶת אָחִ֖י/הוּ יָצ֥וּדוּ חֵֽרֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/002.yaml
  text: The faithful has perished from the land[a], and there is no upright one among mankind. All of them lie in wait for blood[c][b]; each hunts his brother with a net.
  footnotes:
  - marker: a
    text: Or 'from the earth.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his brother'; the term can extend beyond a literal sibling to a fellow member of the community.
    reason: lexical_alternative
  - marker: c
    text: Or 'with a snare.'
    reason: lexical_alternative
translation:
  language: ko
  text: 신실한 자가 땅에서 사라졌고, 사람들 가운데에는 바른 이가 없습니다. 그들 모두가 피를 노리고 매복하며, 각각이 자기 형제를 그물로 사냥합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅으로부터’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그의 형제’는 문자적 형제뿐 아니라 공동체의 다른 구성원까지 넓어질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘덫으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבַד / חָסִיד
  english_pob_choice: The faithful has perished
  chosen_korean: 신실한 자가 사라졌고
  alternatives_korean:
  - 신실한 자가 멸망했고
  - 경건한 자가 사라졌고
  - 충실한 이가 사라졌고
  lexicon: HALOT
  rationale: חָסִיד은 단순한 내면적 경건보다 언약적 신실함을 가리키므로, 한국어로는 교회적 관용보다 의미를 살린 ‘신실한 자’가 적절합니다. אָבַד의 강한 상실·소멸감을 ‘사라졌고’로 옮겨 탄식의 어조를 유지했습니다.
- source_word: מִן הָאָרֶץ
  english_pob_choice: from the land
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅으로부터
  - 그 땅에서
  - 세상에서
  lexicon: HALOT
  rationale: 문맥상 이스라엘 사회를 향한 예언적 비판이므로 ‘땅’이 가장 직접적이며, 영어 POB의 ‘land’를 그대로 살렸습니다.
- source_word: וְיָשָׁר בָּאָדָם אָיִן
  english_pob_choice: there is no upright one among mankind
  chosen_korean: 사람들 가운데에는 바른 이가 없습니다
  alternatives_korean:
  - 인간들 가운데 정직한 이가 없습니다
  - 인류 가운데 바른 사람이 없습니다
  - 사람들 가운데 의로운 이가 없습니다
  lexicon: HALOT
  rationale: יָשָׁר은 도덕적 ‘바름’이 핵심이므로 ‘바른 이’로 옮겼습니다. בָּאָדָם은 남성만이 아니라 인류 전체를 가리키는 일반명사이므로 ‘사람들 가운데’로 자연스럽게 처리했습니다.
- source_word: לְדָמִים יֶאֱרֹבוּ
  english_pob_choice: lie in wait for blood
  chosen_korean: 피를 노리고 매복하며
  alternatives_korean:
  - 피를 위해 숨어 기다리며
  - 살인을 노리고 매복하며
  - 피 흘림을 위해 숨어 기다리며
  lexicon: HALOT
  rationale: לְדָמִים은 ‘피 흘림/유혈’의 함의를 지닌 관용적 표현이지만, 본문의 압축성과 폭력을 살리기 위해 ‘피를 노리고’로 간결하게 옮겼습니다. יֶאֱרֹבוּ는 포식적 매복을 뜻하므로 ‘매복하며’가 적절합니다.
- source_word: חֵרֶם
  english_pob_choice: with a net
  chosen_korean: 그물로 사냥합니다
  alternatives_korean:
  - 덫으로 사냥합니다
  - 올가미로 사냥합니다
  - 그물로 잡습니다
  lexicon: HALOT
  rationale: 이 문맥에서는 חֵרֶם이 사냥 도구/올무의 이미지로 쓰이므로, 영어 POB의 판단을 따라 ‘그물’로 옮겼습니다. ‘사냥합니다’는 יָצ֥וּדוּ의 추적·포획 이미지를 살립니다.
theological_decisions:
- issue: אָדָם의 포괄적 인칭 처리
  chosen_reading: ‘사람들 가운데’로 번역해 남성만을 뜻하지 않는 인류 일반을 드러냈습니다.
  alternative_readings:
  - ‘사람 가운데’
  - ‘인류 가운데’
  - ‘인간들 가운데’
  rationale: 히브리어 אָדָם은 여기서 성별 특정이 아니라 보편적 인간성을 가리키므로, 본문의 예언적 고발 범위를 좁히지 않도록 포괄적으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; contested term אָדָם
- issue: ‘신실한 자’의 언약적 성격
  chosen_reading: חָסִיד을 단순한 도덕적 선인이 아니라 하나님과의 언약에 충실한 자로 이해했습니다.
  alternative_readings:
  - 경건한 자
  - 충실한 자
  - 의로운 자
  rationale: 문맥은 사회적 붕괴 속에서 언약적 충실성이 사라졌다는 탄식을 보여 줍니다. 따라서 교회적 경건보다 관계적·윤리적 신실함을 드러내는 번역이 더 정확합니다.
  doctrine_reference: HALOT חָסִיד; prophetic covenant ethics
