id: MIC.7.6
reference: Micah 7:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי בֵן֙ מְנַבֵּ֣ל אָ֔ב בַּ֚ת קָמָ֣ה בְ/אִמָּ֔/הּ כַּלָּ֖ה בַּ/חֲמֹתָ֑/הּ אֹיְבֵ֥י אִ֖ישׁ אַנְשֵׁ֥י בֵיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/006.yaml
  text: For a son treats his father with contempt[a]; a daughter rises up against her mother; a daughter-in-law against her mother-in-law[b]; a man's enemies are the men of his own house.
  footnotes:
  - marker: a
    text: Or, 'dishonors his father.' The Hebrew verb can denote treating someone shamefully or with contempt.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the men of his house.' The phrase can idiomatically refer to household members more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 아들이 아버지를 멸시하고[a], 딸이 어머니를 거슬러 일어나며, 며느리가 시어머니를 거슬러 일어나고[b], 사람의 원수들이 자기 집의 사람들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아버지를 수치스럽게 대하고’. 히브리어 동사는 사람을 수치와 멸시로 대하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 집의 사람들’입니다. 이 표현은 관용적으로 가정 구성원 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנַבֵּל
  english_pob_choice: treats ... with contempt
  chosen_korean: 멸시하고
  alternatives_korean:
  - 수치스럽게 대하고
  - 업신여기고
  - 수치를 안기고
  lexicon: HALOT
  rationale: נבל의 피엘 분사는 단순한 무례보다 사람을 깎아내리고 수치롭게 대하는 뜻을 담으므로, 한국어에서는 간결하게 ‘멸시하다’로 옮겼습니다.
- source_word: קָמָה בְאִמָּהּ / בַּחֲמֹתָהּ
  english_pob_choice: rises up against / against her mother-in-law
  chosen_korean: 거슬러 일어나며
  alternatives_korean:
  - 대항하여 일어나며
  - 맞서 일어나며
  - 반역하여 일어나며
  lexicon: HALOT
  rationale: קום의 대적 문맥을 자연스럽게 드러내기 위해 ‘거슬러 일어나다’를 택했으며, 이는 관계의 적대성을 분명히 합니다.
- source_word: אַנְשֵׁי בֵיתוֹ
  english_pob_choice: the men of his own house
  chosen_korean: 자기 집의 사람들
  alternatives_korean:
  - 자기 집안의 남자들
  - 그의 집 사람들
  - 가족들
  lexicon: HALOT
  rationale: 직역하면 ‘집의 남자들’이지만, 관용적으로 가정 구성원을 가리키므로 한국어에서는 의미를 살려 ‘자기 집의 사람들’로 옮겼습니다. 성별 표지의 직역은 본문의 자연스러운 이해를 해칠 수 있어 문맥상 확장된 의미를 반영했습니다.
- source_word: בֵן / בַּת / כַּלָּה
  english_pob_choice: a son / a daughter / a daughter-in-law
  chosen_korean: 아들 / 딸 / 며느리
  alternatives_korean:
  - 아들자식 / 딸자식 / 신부
  lexicon: HALOT
  rationale: 가족 관계 항목은 문맥상 가장 직접적인 친족어로 옮겼으며, 특히 כַּלָּה는 ‘신부’보다 관계를 명확히 하는 ‘며느리’가 적절합니다.
theological_decisions:
- issue: 가족 질서의 붕괴를 드러내는 대적 표현
  chosen_reading: ‘거슬러 일어나다’와 ‘멸시하다’로 관계적 적대를 선명하게 유지했습니다.
  alternative_readings:
  - 부모에게 불효하다
  - 반항하다
  rationale: 이 절은 단순한 예의 없음이 아니라 언약 공동체 내부의 깊은 붕괴를 묘사하므로, 도덕적 완곡화보다 원문의 적대성을 드러내는 표현이 필요합니다.
  doctrine_reference: Micah 7:6의 문맥상 애가적 진술
