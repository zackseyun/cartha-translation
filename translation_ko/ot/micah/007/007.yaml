id: MIC.7.7
reference: Micah 7:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִי֙ בַּ/יהוָ֣ה אֲצַפֶּ֔ה אוֹחִ֖ילָה לֵ/אלֹהֵ֣י יִשְׁעִ֑/י יִשְׁמָעֵ֖/נִי אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/007.yaml
  text: But as for me[a], I will watch for Yahweh; I will wait for the God of my salvation. My God will hear me.
  footnotes:
  - marker: a
    text: Or 'I will hope in the God of my salvation.' The Hebrew verb can carry the sense of waiting with hope.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 야훼를 바라보겠습니다. 내 구원의 하나님을 기다리겠습니다.[a] 내 하나님께서 나를 들으실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 구원의 하나님을 소망하며 기다리겠습니다.’ 히브리어 동사는 기다림과 소망의 뜻을 함께 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
  chosen_korean: 그러나 나는
  alternatives_korean:
  - 하지만 나는
  - 내 경우에는
  lexicon: HALOT
  rationale: 앞선 문맥과의 대비를 살리되, 한국어에서는 자연스러운 대조 표현인 ‘그러나 나는’으로 에מ파틱한 전환을 전달했습니다.
- source_word: בַּיהוָה
  english_pob_choice: watch for Yahweh
  chosen_korean: 야훼를 바라보겠습니다
  alternatives_korean:
  - 야훼를 기다리겠습니다
  - 야훼를 주목하겠습니다
  lexicon: HALOT
  rationale: צפה의 ‘바라보다/기다리며 바라보다’라는 기대적 시선을 살려, 단순한 인지보다 지속적 기대를 담는 ‘바라보겠습니다’를 택했습니다.
- source_word: אוֹחִילָה
  english_pob_choice: I will wait
  chosen_korean: 기다리겠습니다
  alternatives_korean:
  - 바라겠습니다
  - 소망하겠습니다
  - 기다리며 소망하겠습니다
  lexicon: HALOT
  rationale: 이어지는 ‘바라보겠습니다’와 중복되지 않도록, יחל의 기다림 의미를 핵심으로 옮기되 희망의 뉘앙스는 본문과 주석에서 보존했습니다.
- source_word: לֵאלֹהֵי יִשְׁעִי
  english_pob_choice: the God of my salvation
  chosen_korean: 내 구원의 하나님
  alternatives_korean:
  - 나를 구원하시는 하나님
  - 내 구원자 하나님
  lexicon: HALOT
  rationale: 소유격 구조를 자연스러운 한국어로 옮기면서도, ‘구원의 하나님’이라는 시적·신학적 결합을 유지했습니다.
- source_word: יִשְׁמָעֵנִי
  english_pob_choice: will hear me
  chosen_korean: 나를 들으실 것입니다
  alternatives_korean:
  - 내 말을 들으실 것입니다
  - 내게 응답하실 것입니다
  lexicon: HALOT
  rationale: שׁמע의 기본 의미인 ‘듣다’를 유지해, 기도 응답을 직접 단정하는 ‘응답하실 것입니다’보다 원문에 더 밀착했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 여호와 이름을 титуляр한 ‘주님’으로 바꾸지 않고, 프로젝트 기본값에 따라 고유명사 ‘야훼’로 옮겨 언약적 인격성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אוֹחִילָה의 희망/기다림 긴장
  chosen_reading: 기다리겠습니다
  alternative_readings:
  - 소망하겠습니다
  - 기다리며 소망하겠습니다
  rationale: ‘기다림’과 ‘소망’이 함께 가능한 동사의 긴장을 해소하지 않고, 본문에서는 기다림을, 주석에서는 희망 뉘앙스를 보존했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
