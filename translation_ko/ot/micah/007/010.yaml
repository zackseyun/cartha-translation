  yaml_path: translation/ot/micah/007/010.yaml
  text: Then my enemy will see[a], and shame will cover her—the one who said to me, “Where is Yahweh your God?” My eyes will look on her[b]; now she will be trampled down like mud in the streets.
  footnotes:
  - marker: a
    text: Or, 'My eyes will see her.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'she will be for trampling, like mire in the streets.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 내 원수는 보고 수치심이 그를 덮을 것입니다. 내게 “네 하나님 야훼가 어디 있느냐?”라고 말하던 그가 말입니다. 내 눈이 그를 바라볼 것이며, 이제 그는 거리의 진흙처럼 짓밟힐 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘내 눈이 그를 볼 것이다.’
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘그는 거리의 진흙처럼 짓밟히는 존재가 될 것이다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיַבְתִּי
  english_pob_choice: my enemy
  chosen_korean: 내 원수
  alternatives_korean:
  - 내 적
  - 내 원수인 여자
  lexicon: HALOT
  rationale: 히브리어는 여성형 단수이지만 한국어에서는 일반적으로 성별을 드러내지 않는 ‘원수’가 자연스럽고, 뒤의 목적어 대명사 없이 문맥으로 충분히 여성성을 드러낼 수 있습니다.
- source_word: וּתְכַסֶּהָ בוּשָׁה
  english_pob_choice: and shame will cover her
  chosen_korean: 수치심이 그를 덮을 것입니다
  alternatives_korean:
  - 수치가 그를 덮을 것입니다
  - 그는 수치로 덮일 것입니다
  lexicon: HALOT
  rationale: ‘수치심/수치가 덮다’는 히브리어 관용을 살리되, 한국어에서는 ‘수치심이 …를 덮다’가 가장 직설적이고 자연스럽습니다.
- source_word: יְהוָה אֱלֹהָיִךְ
  english_pob_choice: Yahweh your God
  chosen_korean: 네 하나님 야훼
  alternatives_korean:
  - 네 하나님 여호와
  - 네 하나님 주님
  lexicon: HALOT
  rationale: 고유명사 יְהוָה는 본 번역 원칙에 따라 ‘야훼’로 옮기고, 소유격 표현은 직접 화법의 조롱을 살려 ‘네 하나님’으로 유지했습니다.
- source_word: עֵינַי תִּרְאֶינָּה בָּהּ
  english_pob_choice: My eyes will look on her
  chosen_korean: 내 눈이 그를 바라볼 것이며
  alternatives_korean:
  - 내 눈이 그를 볼 것이며
  - 내 눈으로 그를 볼 것입니다
  lexicon: HALOT
  rationale: ‘내 눈이 … 보겠다’는 히브리어의 강조를 살리되, 한국어에서는 ‘바라보다’가 감시·응시의 뉘앙스를 잘 전달합니다.
- source_word: תִּהְיֶה לְמִרְמָס כְּטִיט חוּצוֹת
  english_pob_choice: she will be trampled down like mud in the streets
  chosen_korean: 이제 그는 거리의 진흙처럼 짓밟힐 것입니다
  alternatives_korean:
  - 이제 그는 거리의 진흙처럼 밟힐 것입니다
  - 이제 그는 거리의 흙탕물처럼 짓밟힐 것입니다
  lexicon: HALOT
  rationale: לְמִרְמָס의 수동적 의미를 ‘짓밟힐 것이다’로 직접 옮기고, כְּטִיט חוּצוֹת는 ‘거리의 진흙’으로 간결하게 살렸습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה를 고유 이름으로 드러내기 위해 ‘야훼’를 사용하여, 조롱 발화 속 하나님의 이름이 제목이 아니라 이름으로 들리게 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
