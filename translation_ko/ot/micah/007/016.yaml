  lexicon: HALOT
  rationale: חרשׁ의 문자적 이미지인 ‘먹다/귀머거리처럼 되다’를 보존하여, 단순한 ‘듣지 못함’보다 더 강한 감각적 상실을 드러냈습니다.
theological_decisions:
- issue: 마지막 절의 ‘귀가 먹게 됨’의 표현 강도
  chosen_reading: 단순히 듣지 못하는 상태가 아니라, 하나님의 행위를 목격한 뒤 생기는 충격적 무력감과 감각적 마비를 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 그들의 귀는 둔해질 것입니다
  - 그들의 귀는 막힐 것입니다
  rationale: 문맥상 열방의 부끄러움과 침묵이 누적되며, 귀의 마비는 경악과 굴복의 결과로 읽히므로 강한 이미지를 약화하지 않았습니다.
  doctrine_reference: 예언문맥의 심판과 열방의 굴복
