  to: 나라들이 보고 그들의 모든 힘을[a] 부끄러워할 것입니다. 그들은 손을 입에 댈 것이며[b], 그들의 귀는 먹을 것입니다.[c]
  rationale: גְּבוּרָה를 집단의 ‘힘’으로 옮기고, מִן의 논쟁 가능한 원인/관계 뉘앙스는 각주에서 보존했습니다. 손과 입의 몸짓은 원문 어순과 이미지를 더 가깝게 살려 ‘손을 입에 대다’로 다듬었습니다. 각주 표지를 해당 어구에 배치하고, 본문이 명시하지 않는 심리적·신학적 인과 해설은 제거했습니다.
