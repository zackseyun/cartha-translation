id: MIC.7.16
reference: Micah 7:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִרְא֤וּ גוֹיִם֙ וְ/יֵבֹ֔שׁוּ מִ/כֹּ֖ל גְּבֽוּרָתָ֑/ם יָשִׂ֤ימוּ יָד֙ עַל פֶּ֔ה אָזְנֵי/הֶ֖ם תֶּחֱרַֽשְׁנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/016.yaml
  text: Nations will see and be ashamed of all their might[a]; they will put their hand over their mouth[c][b]; their ears will become deaf.
  footnotes:
  - marker: a
    text: Or 'be put to shame because of all their might.' The Hebrew phrase may indicate shame in relation to, or because of, the power they possess.
    reason: lexical_alternative
  - marker: b
    text: The gesture 'put their hand over their mouth' is an idiom for silence, astonishment, or submission.
    reason: cultural_note
  - marker: c
    text: Or 'their ears will be stopped' / 'their ears will grow dull.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나라들이 보고 자기들의 모든 용맹 때문에 부끄러워할 것입니다. 그들은 손으로 입을 가릴 것이며, 그들의 귀는 먹게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기들의 모든 용맹 때문에’는 히브리어가 말하는 힘/위력과 그로 인한 수치의 관계를 드러내기 위한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘손으로 입을 가릴 것’은 침묵, 경악, 굴복을 뜻하는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: ‘그들의 귀는 먹게 될 것’은 ‘그들의 귀가 막히다/둔해지다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גוֹיִם
  english_pob_choice: Nations
  chosen_korean: 나라들이
  alternatives_korean:
  - 민족들이
  - 열국이
  lexicon: HALOT
  rationale: 여기서는 유대-이방 대비보다 열방 전체의 정치적 집단을 가리키므로, 자연스러운 현대 한국어인 ‘나라들’이 ‘Nations’를 가장 잘 살립니다.
- source_word: וְיֵבֹשׁוּ
  english_pob_choice: and be ashamed
  chosen_korean: 부끄러워할 것입니다
  alternatives_korean:
  - 수치를 당할 것입니다
  - 부끄러움을 당할 것입니다
  lexicon: HALOT
  rationale: בוש의 핵심 의미인 수치/부끄러움을 현대 한국어로 직접 전달하되, 예언적 미래 문맥에 맞게 단정적으로 옮겼습니다.
- source_word: מִכֹּל גְּבוּרָתָם
  english_pob_choice: of all their might
  chosen_korean: 자기들의 모든 용맹 때문에
  alternatives_korean:
  - 자기들의 모든 힘 때문에
  - 그들의 모든 능력 때문에
  - 그들의 모든 권세 때문에
  lexicon: HALOT
  rationale: גְּבוּרָה는 단순한 물리적 힘보다 ‘용맹/위력’의 뉘앙스를 가질 수 있어, 자랑거리로서의 힘을 드러내는 ‘용맹’으로 옮겼습니다.
- source_word: יָשִׂימוּ יָד עַל פֶּה
  english_pob_choice: they will put their hand over their mouth
  chosen_korean: 손으로 입을 가릴 것이며
  alternatives_korean:
  - 손을 입에 댈 것이며
  - 입에 손을 얹을 것이며
  - 입을 틀어막을 것이며
  lexicon: HALOT
  rationale: 히브리어 관용구의 침묵·경악·굴복의 몸짓을 한국어로 자연스럽게 살리기 위해 직역보다 관용적 표현을 택했습니다.
- source_word: אָזְנֵיהֶם תֶּחֱרַשְׁנָה
  english_pob_choice: their ears will become deaf
  chosen_korean: 그들의 귀는 먹게 될 것입니다
  alternatives_korean:
  - 그들의 귀는 듣지 못하게 될 것입니다
  - 그들의 귀는 막힐 것입니다
  - 그들의 귀는 둔해질 것입니다
  lexicon: HALOT
  rationale: חרשׁ의 문자적 이미지인 ‘먹다/귀머거리처럼 되다’를 보존하여, 단순한 ‘듣지 못함’보다 더 강한 감각적 상실을 드러냈습니다.
theological_decisions:
- issue: 마지막 절의 ‘귀가 먹게 됨’의 표현 강도
  chosen_reading: 단순히 듣지 못하는 상태가 아니라, 하나님의 행위를 목격한 뒤 생기는 충격적 무력감과 감각적 마비를 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 그들의 귀는 둔해질 것입니다
  - 그들의 귀는 막힐 것입니다
  rationale: 문맥상 열방의 부끄러움과 침묵이 누적되며, 귀의 마비는 경악과 굴복의 결과로 읽히므로 강한 이미지를 약화하지 않았습니다.
  doctrine_reference: 예언문맥의 심판과 열방의 굴복
