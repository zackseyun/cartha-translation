  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַֽל תִּשְׂמְחִ֤י אֹיַ֨בְתִּ/י֙ לִ֔/י כִּ֥י נָפַ֖לְתִּי קָ֑מְתִּי כִּֽי אֵשֵׁ֣ב בַּ/חֹ֔שֶׁךְ יְהוָ֖ה א֥וֹר לִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/008.yaml
  text: Do not rejoice over me[a], my enemy; though I have fallen, I will rise. Though I sit in darkness[b], Yahweh will be a light to me.
  footnotes:
  - marker: a
    text: Or, 'Do not gloat over me, my enemy.' The Hebrew verb means 'rejoice/be glad'; 'gloat' brings out the hostile context but is more interpretive.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew perfect verbs here are used in poetic context for confident reversal: literally, ''I have fallen, I have arisen.'' Many translators render the second verb with future sense: ''I will rise.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내 원수야, 나를 두고 기뻐하지 마십시오. 나는 비록 넘어졌지만 일어날 것입니다. 내가 비록 어둠 속에 앉아 있을지라도 야훼께서 나의 빛이 되실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기뻐하다’는 히브리어의 기본 의미를 살린 번역입니다. 적대적 승리를 더 강하게 드러내려면 ‘나를 두고 흡족해하다/뽐내다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 완료형 두 동사는 시적 문맥에서 확신에 찬 역전을 나타냅니다. 직역하면 ‘나는 넘어졌고, 나는 일어났다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׂמְחִי
  english_pob_choice: Do not rejoice
  chosen_korean: 기뻐하지 마십시오
  alternatives_korean:
  - 기뻐하지 마라
  - 기뻐하지 마세요
  lexicon: HALOT
  rationale: אַל의 금지형을 합쇼체로 자연스럽게 옮겼고, תִּשְׂמְחִי는 단순한 감정의 ‘기쁨’이 아니라 적대적 상황에서의 ‘기뻐함’이므로 직설적으로 표현했습니다.
- source_word: אֹיַבְתִּי
  english_pob_choice: my enemy
  chosen_korean: 내 원수
  alternatives_korean:
  - 나의 적
  - 내 적
  lexicon: HALOT
  rationale: 직접 호칭되는 단수형 적대자를 한국어에서 가장 선명하게 드러내는 표현은 ‘원수’입니다.
- source_word: נָפַלְתִּי קָמְתִּי
  english_pob_choice: I have fallen, I will rise
  chosen_korean: 나는 비록 넘어졌지만 일어날 것입니다
  alternatives_korean:
  - 나는 넘어졌고 일어났습니다
  - 나는 넘어졌으나 일어섭니다
  lexicon: HALOT
  rationale: 두 완료형의 시적 역전 의미를 한국어에서 과거-미래의 대비로 자연스럽게 살렸습니다. ‘넘어졌지만’은 절망의 현실과 회복의 확신을 함께 담습니다.
- source_word: בַּחֹשֶׁךְ
  english_pob_choice: in darkness
  chosen_korean: 어둠 속에
  alternatives_korean:
  - 어둠 가운데
  - 흑암 속에
  lexicon: HALOT
  rationale: 비유적 표현을 유지하면서도 현대 한국어의 자연스러운 장소감으로 옮겼습니다. ‘흑암’은 지나치게 문어적이어서 피했습니다.
- source_word: יְהוָה אוֹר לִי
  english_pob_choice: Yahweh will be a light to me
  chosen_korean: 야훼께서 나의 빛이 되실 것입니다
  alternatives_korean:
  - 야훼께서 내게 빛이 되실 것입니다
  - 야훼는 나의 빛이십니다
  lexicon: HALOT
  rationale: 신명기적 고유명사 יְהוָה는 본 프로젝트 기본어휘에 따라 ‘야훼’로 옮겼고, אוֹר는 단순한 속성보다 구원과 인도를 암시하는 은유이므로 ‘빛이 되시다’로 표현했습니다.
theological_decisions:
- issue: 여호와/주로 대체하지 않고 신명 יְהוָה를 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 신명 יְהוָה를 사용하므로, 본 프로젝트 기본 원칙에 따라 칭호로 대체하지 않고 고유명사로 드러냈습니다. 이는 시편적·예언적 확신의 대상이 누구인지 분명히 합니다.
  doctrine_reference: 'POB terminology policy: יְהוָה / YHWH → 야훼'
