revisions:
- from: 그들의 손은 악을 향해 있으며, 그것을 잘 행합니다. 방백은 요구하고, 재판관은 뇌물을 받고, 큰 자는 자기 마음의 욕망을 말하니, 그리하여 그들이 그것을 엮어 만듭니다.[a][b][c]
  to: 그들은 두 손으로 악을 잘 행합니다[a]. 방백은 요구하고, 재판관은 뇌물을 받고[b], 유력한 자는 자기가 바라는 것을 말합니다. 그리하여 그들은 그것을 함께 얽어 놓습니다[c].
  rationale: 수정문은 난해한 첫 관용구의 쌍수형과 ‘악을 잘 행함’의 강조를 한국어로 자연스럽게 재현했습니다. 재판관의 뇌물 관련 해석은 본문에서 문맥상 표현하되, 원문의 타원성과 대안적 이해를 각주에 보존했습니다. 마지막 동사는 ‘엮다/꼬다’의 비유를 살려 공동의 부패를 암시하되, 특정 해석을 본문에 과도하게 덧붙이지 않았습니다.
