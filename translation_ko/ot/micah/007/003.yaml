  source_fidelity: 초안은 권력층의 부패와 공모라는 본문의 큰 흐름을 잘 담고 있습니다. 그러나 첫 구절의 관용적이고 난해한 표현은 ‘손은 악을 향해 있으며’보다 ‘두 손으로 악을 잘 행합니다’가 כפַּיִם(두 손)과 לְהֵיטִיב(잘/능숙하게 하다)의 결합을 더 충실하고 자연스럽게 드러냅니다. 재판관이 ‘뇌물을 받고’라는 해석은 문맥상 가능하나, 히브리어 자체는 ‘지불/보수를 위하여’라는 타원 표현이므로 각주에서 그 여지를 밝혀야 합니다.
  naturalness: ‘큰 자’, ‘자기 마음의 욕망을 말하니’, ‘엮어 만듭니다’는 현대 표준 한국어로 다소 직역투이거나 중복됩니다. ‘유력한 자’, ‘자기가 바라는 것을 말합니다’, ‘함께 얽어 놓습니다’가 합쇼체의 현대적인 문장 흐름을 유지하면서도 원문의 병렬과 비유를 보존합니다. 각주 표지는 해당 표현 바로 뒤에 배치하는 것이 적절합니다.
