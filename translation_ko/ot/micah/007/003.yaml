id: MIC.7.3
reference: Micah 7:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל הָ/רַ֤ע כַּפַּ֨יִם֙ לְ/הֵיטִ֔יב הַ/שַּׂ֣ר שֹׁאֵ֔ל וְ/הַ/שֹּׁפֵ֖ט בַּ/שִׁלּ֑וּם וְ/הַ/גָּד֗וֹל דֹּבֵ֨ר הַוַּ֥ת נַפְשׁ֛/וֹ ה֖וּא וַֽ/יְעַבְּתֽוּ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/003.yaml
  text: 'Their hands are on evil[a], to do it well: the prince asks, and the judge is for a bribe, and the great man speaks the desire of his soul[c][b]; thus they weave it together.'
  footnotes:
  - marker: a
    text: Or 'Both hands are on evil, to do it well,' emphasizing wholehearted skill in wrongdoing.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew is terse: ''the judge in/for payment.'' This may mean ''the judge asks for a bribe'' or ''the judge judges for a bribe.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'they twist it together.' The image is of coordinated corruption, as if plaiting or intertwining a scheme.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 두 손으로 악을 잘 행합니다[a]. 방백은 요구하고, 재판관은 뇌물을 받고[b], 유력한 자는 자기가 바라는 것을 말합니다. 그리하여 그들은 그것을 함께 얽어 놓습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 두 손은 악 위에 있다/악에 있다’에 가깝습니다. 이는 악을 온 힘을 다해 능숙하게 행한다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 매우 압축되어 직역하면 ‘재판관은 지불/보수를 위하여’에 가깝습니다. 이는 ‘재판관이 뇌물을 요구한다’ 또는 ‘뇌물을 받고 판결한다’는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘함께 얽어 놓습니다’는 꼬거나 엮는 비유입니다. ‘함께 비틀어 만듭니다’로도 옮길 수 있으며, 이들의 부패한 일을 서로 결탁하여 꾸민다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הָרַע כַּפַּיִם
  english_pob_choice: Their hands are on evil
  chosen_korean: 그들의 손은 악을 향해 있으며
  alternatives_korean:
  - 그들의 두 손은 악에 닿아 있으며
  - 그들의 손은 악 위에 있습니다
  lexicon: HALOT
  rationale: ‘손’과 ‘악’의 결합은 단순한 위치가 아니라 악에 적극 가담하는 상태를 뜻하므로, 한국어에서는 자연스럽게 ‘악을 향해’로 옮겨 동작성과 방향성을 함께 살렸습니다.
- source_word: לְהֵיטִיב
  english_pob_choice: to do it well
  chosen_korean: 그것을 잘 행합니다
  alternatives_korean:
  - 능숙하게 행합니다
  - 열심히 행합니다
  lexicon: HALOT
  rationale: 히필 부정사는 ‘잘/능숙하게 하다’의 뜻이므로, 악을 능숙하게 수행한다는 역설을 드러내도록 직역에 가까운 표현을 택했습니다.
- source_word: הַשַּׂר שֹׁאֵל
  english_pob_choice: the prince asks
  chosen_korean: 방백은 요구하고
  alternatives_korean:
  - 지도자는 묻고
  - 통치자는 요구합니다
  lexicon: HALOT
  rationale: שַׂר는 사회적 지위가 있는 통치자/지도자를 가리키므로, 문맥의 부패한 권력자를 드러내는 ‘방백’이 가장 간결합니다. 여기서 ‘묻다’보다 문맥상 강한 수탈의 뉘앙스를 담아 ‘요구하다’로 옮겼습니다.
- source_word: וְהַשֹּׁפֵט בַּשִּׁלּוּם
  english_pob_choice: the judge is for a bribe
  chosen_korean: 재판관은 뇌물을 받고
  alternatives_korean:
  - 재판관은 보수를 위해 움직이고
  - 재판관은 삯을 위해 판결하고
  lexicon: HALOT
  rationale: 히브리어는 매우 압축되어 있어 ‘뇌물/보수’를 둘러싼 관계를 드러내야 합니다. 본문상의 부패를 분명히 보이기 위해 ‘뇌물을 받고’로 자연스럽게 풀었습니다.
- source_word: דֹּבֵר הַוַּת נַפְשׁוֹ
  english_pob_choice: speaks the desire of his soul
  chosen_korean: 큰 자는 자기 마음의 욕망을 말하니
  alternatives_korean:
  - 큰 자는 자기 영혼의 욕망을 말하니
  - 큰 자는 자기 속의 욕망을 말하니
  lexicon: HALOT
  rationale: הַוַּת은 여기서 파괴적 욕망/갈망의 뜻을 띠므로, ‘욕망’으로 옮기되 주어의 내면성을 살리기 위해 ‘자기 마음의’라고 했습니다.
- source_word: וַיְעַבְּתֽוּהָ
  english_pob_choice: thus they weave it together
  chosen_korean: 그리하여 그들이 그것을 엮어 만듭니다
  alternatives_korean:
  - 그리하여 그들이 그것을 비틀어 만듭니다
  - 그리하여 그들이 그것을 서로 얽어 만듭니다
  lexicon: HALOT
  rationale: 어근 עבת는 ‘엮다/꼬다/얽다’의 이미지이므로, 공동으로 꾸며 가는 부패의 구조를 살리면서도 한국어로 자연스러운 ‘엮어 만듭니다’를 택했습니다.
theological_decisions:
- issue: 부패한 권력자들의 연쇄적 공모를 어떻게 드러낼지
  chosen_reading: 각 직분자를 나열하되 동사를 분리해, 방백·재판관·큰 자가 모두 서로 다른 방식으로 악에 가담하는 장면으로 읽히게 했습니다.
  alternative_readings:
  - 한 문장으로 압축해 ‘권력층 전체의 공모’로만 표현하는 방법
  - 직분 명칭을 모두 일반화하는 방법
  rationale: 본문은 사회적 상층부의 연쇄적 부패를 시적으로 나열하므로, 나열 구조를 유지하는 것이 신학적·수사적 무게를 가장 잘 보존합니다.
  doctrine_reference: 예언서의 사회정의 비판, 지도자 책임
