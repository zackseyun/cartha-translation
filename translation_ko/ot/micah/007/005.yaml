id: MIC.7.5
reference: Micah 7:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תַּאֲמִ֣ינוּ בְ/רֵ֔עַ אַֽל תִּבְטְח֖וּ בְּ/אַלּ֑וּף מִ/שֹּׁכֶ֣בֶת חֵיקֶ֔/ךָ שְׁמֹ֖ר פִּתְחֵי פִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/005.yaml
  text: Do not trust in a neighbor[a]; do not put confidence in a close companion. From the woman who lies in your bosom[d][c][b], guard the doors of your mouth.
  footnotes:
  - marker: a
    text: Or 'friend' for 'neighbor' (רֵעַ).
    reason: lexical_alternative
  - marker: b
    text: Or 'intimate friend' for 'close companion' (אַלּוּף).
    reason: lexical_alternative
  - marker: c
    text: Literally 'the woman lying in your bosom'; that is, the most intimate companion, likely one's wife.
    reason: cultural_note
  - marker: d
    text: Or 'embrace' for 'bosom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이웃을 믿지 마십시오[a]. 가까운 동반자도 신뢰하지 마십시오[b]. 당신의 품[d]에 누운 여자[c]에게서도 당신의 입의 문들을 지키십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '친구'로도 옮길 수 있습니다(רֵעַ).
    reason: lexical_alternative
  - marker: b
    text: 또는 '친밀한 친구'로도 옮길 수 있습니다(אַלּוּף).
    reason: lexical_alternative
  - marker: c
    text: 직역하면 '당신의 품에 누운 여자'입니다. 곧 가장 친밀한 동반자, 아마도 아내를 가리킵니다.
    reason: cultural_note
  - marker: d
    text: 또는 '가슴'으로도 옮길 수 있습니다(חֵיק).
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵעַ
  english_pob_choice: neighbor
  chosen_korean: 이웃
  alternatives_korean:
  - 친구
  - 동반자
  lexicon: HALOT
  rationale: רֵעַ는 친족적·사회적 관계의 상대를 넓게 가리키므로, 영어 POB의 'neighbor'에 맞추어 한국어도 관계의 폭을 살린 '이웃'으로 옮겼습니다.
- source_word: אַלּוּף
  english_pob_choice: close companion
  chosen_korean: 가까운 동반자
  alternatives_korean:
  - 친한 친구
  - 친밀한 벗
  - 절친한 동반자
  lexicon: HALOT
  rationale: אַלּוּף는 단순한 친구보다 더 친밀한 신뢰 관계를 가리키므로, '가까운 동반자'로 옮겨 앞 절의 רֵעַ와 구별되는 친밀도를 반영했습니다.
- source_word: מִשֹּׁכֶבֶת חֵיקֶךָ
  english_pob_choice: From the woman who lies in your bosom
  chosen_korean: 당신의 품에 누운 여자에게서도
  alternatives_korean:
  - 당신의 품에 안긴 여자에게서도
  - 당신의 품에 있는 아내에게서도
  lexicon: HALOT
  rationale: 직역에 가까운 '품에 누운 여자'를 유지하되, 한국어에서 자연스럽게 읽히도록 조사와 어순을 조정했습니다. '여자'는 본문이 특정 지칭을 명시하지 않기 때문에 좁은 해석인 '아내'로 미리 한정하지 않았습니다.
- source_word: פִּתְחֵי פִיךָ
  english_pob_choice: the doors of your mouth
  chosen_korean: 당신의 입의 문들
  alternatives_korean:
  - 입의 문
  - 입의 문지방
  - 입에서 나오는 말
  lexicon: HALOT
  rationale: 입을 '문'으로 비유하는 히브리어 이미지를 살리기 위해 '입의 문들'을 택했습니다. 복수형의 형식도 보존해 말의 출입을 경계하라는 은유를 드러냈습니다.
theological_decisions:
- issue: 익숙한 친밀 관계에 대한 경계의 강도
  chosen_reading: 가장 가까운 인간관계라도 말을 조심해야 한다는 경고를 그대로 드러냈습니다.
  alternative_readings:
  - 관계를 부드럽게 만들어 단순한 신중함 권고로 읽는 것
  rationale: 본문은 신뢰의 범위를 의도적으로 좁히며 경계심을 극대화합니다. 이를 약화하지 않도록 명령형과 부정 명령을 직설적으로 유지했습니다.
  doctrine_reference: 지혜문학의 분별과 언어 윤리
