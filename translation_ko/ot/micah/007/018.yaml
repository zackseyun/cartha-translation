id: MIC.7.18
reference: Micah 7:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִי אֵ֣ל כָּמ֗וֹ/ךָ נֹשֵׂ֤א עָוֺן֙ וְ/עֹבֵ֣ר עַל פֶּ֔שַׁע לִ/שְׁאֵרִ֖ית נַחֲלָת֑/וֹ לֹא הֶחֱזִ֤יק לָ/עַד֙ אַפּ֔/וֹ כִּֽי חָפֵ֥ץ חֶ֖סֶד הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/018.yaml
  text: Who is a God like you[a], bearing iniquity and passing over transgression for the remnant of his inheritance? He does not retain his anger forever[b], because he delights in steadfast love.
  footnotes:
  - marker: a
    text: Or 'forgiving iniquity and pardoning transgression.' The Hebrew more literally reads 'bearing iniquity and passing over transgression.'
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew חֶסֶד, a covenantal term that can also be rendered ''mercy'' or ''covenant love.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 주님과 같은 하나님이 어디 계십니까? 주님께서는 죄악을 용서하시며[a], 그분의 유산으로 남은 사람들의 허물을 지나치십니다. 그분은 영원히 분노를 품고 계시지 않습니다. 이는 그분이 변함없는 사랑을 기뻐하시기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 문자적으로 ‘죄악을 짊어지시며 허물을 지나치신다’라고 합니다. 이 문맥에서 ‘죄악을 짊어지다’는 죄를 용서하거나 제거하는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘변함없는 사랑’은 히브리어 חֶסֶד을 옮긴 것입니다. 이 말은 언약적 신실함과 자비를 포함하며, ‘인자’ 또는 ‘긍휼’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אֵל כָּמוֹךָ
  english_pob_choice: Who is a God like you
  chosen_korean: 주님과 같은 하나님이 어디 있습니까?
  alternatives_korean:
  - 주님 같은 하나님이 어디 있습니까?
  - 하나님과 같은 분이 어디 있습니까?
  lexicon: HALOT
  rationale: 수사적 감탄문으로서의 ‘Who is... like you’ 구조를 자연스러운 한국어 질문으로 옮기되, 문맥상 이스라엘의 하나님을 가리키므로 ‘하나님’을 유지했습니다.
- source_word: נֹשֵׂא עָוֹן
  english_pob_choice: bearing iniquity
  chosen_korean: 죄악을 용서하시고
  alternatives_korean:
  - 죄악을 지니시고
  - 죄책을 지니시고
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘지다/짊어지다’의 이미지를 가지지만, POB의 주해상 의미가 죄를 제거하고 용서하는 방향이므로 한국어에서는 그 기능을 분명히 드러냈습니다.
- source_word: וְעֹבֵר עַל פֶּשַׁע
  english_pob_choice: and passing over transgression
  chosen_korean: 허물을 지나치십니다
  alternatives_korean:
  - 반역을 넘어가십니다
  - 허물을 덮어두십니다
  lexicon: HALOT
  rationale: ‘pass over’의 동작 이미지를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 했고, פֶּשַׁע의 defiant nuance는 ‘허물’보다 ‘반역’이 강하지만 문맥의 대구를 고려해 과도한 강화는 피했습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인자
  alternatives_korean:
  - 변함없는 사랑
  - 헤세드
  lexicon: HALOT
  rationale: 이 절의 결론 이유절에서 하나님의 성품을 지칭하는 언약적 용어이므로, 전통적이면서도 본문의 신학적 밀도를 유지하는 ‘인자’를 택했습니다.
theological_decisions:
- issue: 이사야·미가류의 죄 사함 표현을 ‘bearing/passing over’에서 한국어로 어떻게 드러낼지
  chosen_reading: 직역 이미지를 완전히 제거하지 않되, 의미 기능은 ‘용서’로 분명히 드러냈습니다.
  alternative_readings:
  - 죄악을 짊어지시고 허물을 지나치십니다
  - 죄악을 사하시고 허물을 넘어가십니다
  rationale: 히브리어는 ‘짊어지다/지나가다’의 이미지가 중요하지만, 한국어 독자가 문맥의 구속적 의미를 즉시 이해하도록 번역했습니다. 동시에 두 동사의 병렬 구조는 유지했습니다.
  doctrine_reference: Mic 7:18의 용서 묘사; source transparency principle
- issue: חֶסֶד의 번역
  chosen_reading: 인자
  alternative_readings:
  - 변함없는 사랑
  - 긍휼
  rationale: POB 영어는 ‘steadfast love’로 언약적 성실성을 강조합니다. 한국어에서는 문맥상 하나님의 지속적 언약 사랑을 함축하는 ‘인자’가 가장 간결하게 그 신학적 무게를 전달합니다.
  doctrine_reference: POB lexical note on חֶסֶד
