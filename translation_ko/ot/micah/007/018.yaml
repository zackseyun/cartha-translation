  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 לִשְׁאֵרִית נַחֲלָתוֹ는 ‘자기 상속의 남은 자를 위해’보다 하나님의 ‘유산/소유’로 된 남은 백성을 가리키도록 자연스럽게 밝혀야 합니다. נֹשֵׂא עָוֹן의 용서 의미와 עֹבֵר עַל־פֶּשַׁע의 ‘지나가다’ 이미지는 유지할 수 있습니다.
  naturalness: ‘자기 상속의 남은 자’와 ‘분노를 붙들고 계시지 않으십니다’는 현대 표준어 합쇼체에서 어색합니다. ‘그분의 유산으로 남은 사람들’, ‘분노를 품고 계시지 않습니다’가 더 자연스럽습니다. חֶסֶד의 본문 표현은 현대 독자를 위해 ‘변함없는 사랑’으로 옮기는 편이 적절합니다.
  terminology: ‘죄악’과 ‘허물’은 עָוֹן과 פֶּשַׁע의 병렬을 무리 없이 구별합니다. ‘변함없는 사랑’은 חֶסֶד의 지속적·언약적 성격을 현대어로 전달하며, 각주는 ‘인자’와 ‘긍휼’을 가능한 대안으로 설명할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘자기 상속의 남은 자를 위해’라는 표현
