revisions:
- from: 「주님과 같은 하나님이 어디 있습니까?」 주님께서는 죄악을 용서하시고, 자기 상속의 남은 자를 위해 허물을 지나치십니다. 그분은 영원히 분노를 붙들고 계시지 않으십니다. 이는 그분이 인자를 기뻐하시기 때문입니다.[a][b]
  to: 주님과 같은 하나님이 어디 계십니까? 주님께서는 죄악을 용서하시며[a], 그분의 유산으로 남은 사람들의 허물을 지나치십니다. 그분은 영원히 분노를 품고 계시지 않습니다. 이는 그분이 변함없는 사랑을 기뻐하시기 때문입니다.[b]
  rationale: 하나님의 유산으로 남은 백성이라는 소유·언약의 관계를 자연스러운 현대 한국어로 드러냈습니다. 죄 사함을 나타내는 두 히브리어 동사의 의미상 병렬은 ‘용서하시며 ... 지나치십니다’로 보존했습니다. 또한 현대 합쇼체의 자연스러움을 위해 ‘분노를 품고 계시지 않습니다’로 다듬고, חֶסֶד은 본문에서 ‘변함없는 사랑’으로 옮기되 전통적 번역어와 의미 범위는 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:43:20Z'
