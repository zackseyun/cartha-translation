base_translation:
  language: en
  yaml_path: translation/ot/micah/007/020.yaml
  text: You will show faithfulness to Jacob and steadfast love to Abraham, which you swore to our fathers from days of old.
translation:
  language: ko
  text: 주님께서는 야곱에게는 신실하심을, 아브라함에게는 인애를 베푸실 것입니다. 이는 주님께서 옛날부터 우리 조상들에게 맹세하신 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֱמֶת은 여기서 ‘진리’보다 하나님의 언약적 ‘신실하심’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חֶסֶד은 문맥상 ‘변함없는 사랑’ 또는 ‘언약적 사랑’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘우리 조상들’은 히브리어의 ‘아버지들’을 현대 한국어에서 자연스럽게 풀어 옮긴 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתֵּן אֱמֶת
  english_pob_choice: You will show faithfulness
  chosen_korean: 신실하심을 베푸실 것입니다
  alternatives_korean:
  - 진리를 주실 것입니다
  - 진실을 보이실 것입니다
  - 성실하심을 나타내실 것입니다
  lexicon: אֱמֶת
  rationale: 문맥상 추상 명사 ‘אֱמֶת’은 단순한 정보상의 ‘진리’보다 관계적·언약적 신실성을 가리키므로, 한국어에서는 ‘신실하심’으로 옮겨 하나님의 언약적 충실함을 드러냈습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인애
  alternatives_korean:
  - 변함없는 사랑
  - 인자
  - 언약적 사랑
  lexicon: חֶסֶד
  rationale: 문맥이 야곱/아브라함에 대한 언약 성취를 말하므로, חֶסֶד의 핵심인 언약적 자비와 사랑을 살려 한국어 성경 전통과도 연결되는 ‘인애’를 채택했습니다.
- source_word: לְיַעֲקֹב / לְאַבְרָהָם
  english_pob_choice: to Jacob / to Abraham
  chosen_korean: 야곱에게 / 아브라함에게
  alternatives_korean:
  - 야곱을 향하여 / 아브라함을 향하여
  - 야곱에게는 / 아브라함에게는
  lexicon: proper names
  rationale: 목적어 표시는 한국어의 격조사 ‘-에게’로 자연스럽게 살려, 두 조상에게 각각 향하는 언약적 행위를 분명히 했습니다.
- source_word: לַאֲבֹתֵינוּ
  english_pob_choice: our fathers
  chosen_korean: 우리 조상들에게
  alternatives_korean:
  - 우리 아버지들에게
  - 우리 선조들에게
  lexicon: אָבוֹת
  rationale: 히브리어 복수 ‘아버지들’은 이 맥락에서 족장들을 포함한 조상 집단을 가리키므로, 현대 한국어 독자에게 가장 명료한 ‘우리 조상들’로 옮겼습니다.
theological_decisions:
- issue: 언약 성취의 시간성
  chosen_reading: ‘옛날부터’로 옮겨, 본문이 하나님의 오래된 맹세와 그 성취를 연결함을 유지했습니다.
  alternative_readings:
  - 예로부터
  - 태초부터
  rationale: מִימֵי קֶדֶם는 단순한 과거가 아니라 아주 오래전의 언약 기원을 가리키므로, ‘옛날부터’가 문맥상 과도한 추상화 없이 시간적 장구함을 전달합니다.
  doctrine_reference: 언약 신실성
- issue: 주어 호칭
  chosen_reading: 야훼를 직접 표기하지 않고 ‘주님’으로 처리했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절의 현재 한국어 문맥에서는 직접 호칭이 아니므로, 합쇼체 문장 흐름과 한국어 독자 친화성을 위해 ‘주님’을 사용했습니다.
  doctrine_reference: 번역 관례
