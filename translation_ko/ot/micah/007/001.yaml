id: MIC.7.1
reference: Micah 7:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֣לְלַי לִ֗/י כִּ֤י הָיִ֨יתִי֙ כְּ/אָסְפֵּי קַ֔יִץ כְּ/עֹלְלֹ֖ת בָּצִ֑יר אֵין אֶשְׁכּ֣וֹל לֶ/אֱכ֔וֹל בִּכּוּרָ֖ה אִוְּתָ֥ה נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/001.yaml
  text: 'Woe is me! For I have become like the gatherers of summer fruit[a], like the gleanings of the grape harvest: there is no cluster to eat[b], no first-ripe fig that my soul desires.'
  footnotes:
  - marker: a
    text: Or, 'Alas for me!'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'first-ripe'; likely referring to the prized early fig.
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 나여! 나는 여름 과일을 거두는 사람 같고 — 포도 수확의 남은 것 같구나. 먹을 포도 송이가 없고, 내 영혼이 바라는 첫 무화과도 없도다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘아, 나에게 화가 있도다!’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘첫 익은’; 아마도 귀하게 여기는 초기 무화과를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְלַי לִי
  english_pob_choice: Woe is me!
  chosen_korean: 아, 나여!
  alternatives_korean:
  - 슬프도다, 나여!
  - 화가 나도다, 나여!
  lexicon: HALOT
  rationale: 애통의 감탄사로서 직접적인 탄식을 살리되, 현대 한국어 합쇼체에서 자연스러운 감정 표출로 옮겼습니다.
- source_word: כִּי הָיִיתִי
  english_pob_choice: For I have become
  chosen_korean: 나는 … 같고
  alternatives_korean:
  - 내가 …이 되었습니다
  - 나는 …이 되었습니다
  lexicon: HALOT
  rationale: 히브리어 완료형이 드러내는 현재의 परिण적 상태를 한국어에서 ‘…같다’로 자연스럽게 살렸습니다.
- source_word: כְ/אָסְפֵּי קַיִץ
  english_pob_choice: like the gatherers of summer fruit
  chosen_korean: 여름 과일을 거두는 사람
  alternatives_korean:
  - 여름 과일을 거두는 자
  - 여름 과일 수확자
  lexicon: HALOT
  rationale: POB의 검토처럼 명사적 집합 개념보다 ‘거두는 사람’이 히브리어 분사적 뉘앙스와 장면성을 더 잘 드러냅니다.
- source_word: כְ/עֹלְלֹת בָּצִיר
  english_pob_choice: like the gleanings of the grape harvest
  chosen_korean: 포도 수확의 남은 것
  alternatives_korean:
  - 포도 추수의 이삭줍기
  - 포도 수확의 줍게 된 것
  lexicon: HALOT
  rationale: עֹלְלֹת는 수확 후 남은 잔여물을 가리키므로, 한국어에서는 ‘남은 것’으로 의미를 살리고, בָּצִיר의 포도 수확 배경을 분명히 했습니다.
- source_word: בִּכּוּרָה
  english_pob_choice: first-ripe fig
  chosen_korean: 첫 무화과
  alternatives_korean:
  - 초실 무화과
  - 첫 익은 무화과
  lexicon: HALOT
  rationale: 히브리어가 여기서 귀한 초기 무화과를 가리키는 관용적 용법이므로, 한국어에서도 자연스럽고 의미가 분명한 ‘첫 무화과’로 옮겼습니다.
theological_decisions:
- issue: 시적 탄식의 감탄사 강도
  chosen_reading: ‘아, 나여!’로 직접적 탄식을 살려 선지자의 절망과 상실감을 전면에 드러냈습니다.
  alternative_readings:
  - ‘슬프도다, 나여!’처럼 더 전통적인 탄식 표현
  - ‘오호라, 나여!’ 같은 고전적 어투
  rationale: 본문은 단순한 정보 전달이 아니라 절박한 애가이므로, 한국어 독자가 즉각 체감할 수 있는 탄식 어조가 원문의 정서를 더 충실히 전달합니다.
  doctrine_reference: 예언서의 애가/탄식 화법
- issue: ‘내 영혼’의 인류학적 표현 유지
  chosen_reading: ‘내 영혼이 바라는’으로 נֶפֶשׁ의 내적 갈망을 드러냈습니다.
  alternative_readings:
  - ‘내가 바라는’
  - ‘내 속사람이 바라는’
  rationale: נֶפֶשׁ는 단순한 감정이 아니라 존재의 내적 갈망을 가리키므로, 이를 평이하게만 풀지 않고 ‘영혼’으로 남겨 본문의 표현력을 보존했습니다.
  doctrine_reference: 히브리어 인류학/시적 어법
