revisions:
- from: 아, 나여! 나는 여름 과일을 거두는 사람 같고 — 포도 수확의 남은 것 같구나. 먹을 포도 송이가 없고, 내 영혼이 바라는 첫 무화과도 없도다.[a][b]
  to: 아, 나는 참으로 비참합니다![a] 나는 여름 과일을 거두고 난 뒤와 포도를 수확하고 난 뒤와 같게 되었습니다. 먹을 포도송이가 없고, 내 영혼이 바라는 첫 익은 무화과도 없습니다.[b]
  rationale: 탄식의 강도는 현대 한국어 합쇼체로 자연스럽게 유지하되, ‘나여’라는 비현대적이고 부자연스러운 호격을 피했습니다. 두 농경 비유는 원문의 후수확 결핍 이미지를 평행하게 드러내도록 처리했으며, 수확자를 가리킨다는 한 해석을 본문에서 불필요하게 확정하지 않았습니다. ‘첫 익은 무화과’와 각주 표지도 원문의 의미 및 주석 대상에 맞게 정비했습니다.
