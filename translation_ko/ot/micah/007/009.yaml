id: MIC.7.9
reference: Micah 7:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זַ֤עַף יְהוָה֙ אֶשָּׂ֔א כִּ֥י חָטָ֖אתִי ל֑/וֹ עַד֩ אֲשֶׁ֨ר יָרִ֤יב רִיבִ/י֙ וְ/עָשָׂ֣ה מִשְׁפָּטִ֔/י יוֹצִיאֵ֣/נִי לָ/א֔וֹר אֶרְאֶ֖ה בְּ/צִדְקָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/009.yaml
  text: I will bear the indignation of Yahweh[a], because I have sinned against him, until he pleads my case and executes justice for me. He will bring me out to the light; I will look upon his righteousness.
  footnotes:
  - marker: a
    text: Or "his justice." The Hebrew term can denote both righteousness and justice, especially in a legal-vindication context.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그분께 죄를 지었으므로, 그분께서 내 송사를 변호하시고 나를 위하여 정의를 행하실 때까지 나는 야훼의 진노를 감당하겠습니다. 그분께서 나를 빛으로 이끌어 내실 것이며, 나는 그분의 의를 보게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그분의 의’는 문맥에 따라 ‘그분의 정의’로도 옮길 수 있습니다. 히브리어 צִדְקָה는 법정적 변호와 관련하여 의로움과 정의의 뜻을 함께 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַעַף יְהוָה
  english_pob_choice: the indignation of Yahweh
  chosen_korean: 야훼의 격노
  alternatives_korean:
  - 야훼의 분노
  - 야훼의 진노
  lexicon: HALOT
  rationale: זַעַף는 단순한 감정 폭발보다 분개와 심판의 뉘앙스를 지녀, 한국어에서는 문맥상 ‘격노’가 가장 밀도 있게 대응합니다. POB의 Yahweh를 따라 ‘야훼’로 옮겼습니다.
- source_word: אֶשָּׂא
  english_pob_choice: I will bear
  chosen_korean: 감당하겠습니다
  alternatives_korean:
  - 짊어지겠습니다
  - 견디겠습니다
  lexicon: HALOT
  rationale: נשא의 부담을 지고 감내한다는 뜻을 살리되, 현대 한국어에서 징계와 책임의 무게를 자연스럽게 드러내는 동사로 ‘감당하다’를 택했습니다.
- source_word: יָרִיב רִיבִי וְעָשָׂה מִשְׁפָּטִי
  english_pob_choice: he pleads my case and executes justice for me
  chosen_korean: 내 송사를 변호하시고 내게 정의를 세워 주실
  alternatives_korean:
  - 내 변론을 맡으시고 내 판결을 이루실
  - 내 사건을 변호하시고 내 판단을 이루실
  lexicon: HALOT
  rationale: 법정적 관용구를 따라 ריב/משפט의 송사·변론·재판 의미를 살렸습니다. ‘정의를 세워 주실’은 משפט의 유리한 판정, 곧 변호와 vindication을 현대어로 자연스럽게 표현합니다.
- source_word: בְּצִדְקָתוֹ
  english_pob_choice: his righteousness
  chosen_korean: 그분의 의
  alternatives_korean:
  - 그분의 정의
  - 그분의 의로움
  lexicon: HALOT
  rationale: צדקה는 문맥상 여호와의 의로운 변호이자 정당한 행위를 가리키므로, 본문과 신학적 어휘를 살리는 기본 번역인 ‘의’를 택했습니다.
theological_decisions:
- issue: 여호와의 משפט/צדקה를 한국어에서 어떻게 구분할 것인가
  chosen_reading: ‘정의를 세워 주실’과 ‘그분의 의’로 나누어 법정적 변호와 그 결과를 함께 드러냈습니다.
  alternative_readings:
  - ‘판결을 내려 주실’
  - ‘정당성을 세워 주실’
  rationale: 본문은 단순한 형벌 선언이 아니라, 고난받는 화자가 야훼의 법정적 변호를 기다리는 장면입니다. משפט의 법정성은 ‘정의를 세워 주실’로, צדקה의 성격은 ‘그분의 의’로 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3; Contested terms principle analogous to δικαιοσύνη
- issue: יוֹצִיאֵנִי לָאוֹר의 이미지적 의미
  chosen_reading: ‘나를 빛으로 이끌어 내실’
  alternative_readings:
  - ‘나를 빛으로 데려가실’
  - ‘나를 빛 가운데로 내실’
  rationale: 여기서 ‘빛’은 단순한 물리적 밝기보다 고난에서의 구원과 변호를 드러내는 상징입니다. 직역을 유지하면서도 한국어로 자연스러운 동작성을 살리기 위해 ‘이끌어 내실’로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
