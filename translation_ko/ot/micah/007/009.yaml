    issue: ‘그분이 내 송사를 변호하시고 내게 정의를 세워 주실 때까지입니다’가 독립 문장처럼 처리되었습니다.
    rationale: עַד אֲשֶׁר 이하의 시간 절은 ‘나는 야훼의 진노를 감당하겠습니다’의 한계를 나타냅니다. 한국어에서도 해당 주절과 한 문장으로 연결해야 원문의 문법 관계와 자연스러운 문장을 함께 살릴 수 있습니다.
