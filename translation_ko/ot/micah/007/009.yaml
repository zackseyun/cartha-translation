revisions:
- from: 나는 야훼의 격노를 감당하겠습니다. 내가 그분께 죄를 지었기 때문입니다. 그분이 내 송사를 변호하시고 내게 정의를 세워 주실 때까지입니다. 그분이 나를 빛으로 이끌어 내실 것이니, 나는 그분의 의를 보게 될 것입니다.[a][b]
  to: 내가 그분께 죄를 지었으므로, 그분께서 내 송사를 변호하시고 나를 위하여 정의를 행하실 때까지 나는 야훼의 진노를 감당하겠습니다. 그분께서 나를 빛으로 이끌어 내실 것이며, 나는 그분의 의를 보게 될 것입니다.[a]
  rationale: 시간 절을 ‘감당하겠습니다’에 직접 연결하여 원문의 통사 관계를 회복했습니다. משפט의 법정적 의미는 ‘나를 위하여 정의를 행하시고’로 옮겼으며, צִדְקָה의 의미 범위는 본문의 ‘의’와 각주의 ‘정의’로 보존했습니다. ‘빛으로 이끌어 내실’은 יוֹצִיאֵנִי לָאוֹר의 출현·해방 이미지를 유지합니다.
