id: MIC.7.14
reference: Micah 7:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רְעֵ֧ה עַמְּ/ךָ֣ בְ/שִׁבְטֶ֗/ךָ צֹ֚אן נַֽחֲלָתֶ֔/ךָ שֹׁכְנִ֣י לְ/בָדָ֔ד יַ֖עַר בְּ/ת֣וֹךְ כַּרְמֶ֑ל יִרְע֥וּ בָשָׁ֛ן וְ/גִלְעָ֖ד כִּ/ימֵ֥י עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/014.yaml
  text: Shepherd your people with your staff[a], the flock of your inheritance, dwelling alone in a forest in the midst of Carmel; let them graze in Bashan and Gilead as in days of old.
  footnotes:
  - marker: a
    text: Or 'in the midst of pastureland' / 'in fertile land'; Hebrew Carmel can refer either to the region Carmel or to fruitful land.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주님의 지팡이로 주님의 백성, 곧 주님의 기업인 양 떼를 먹이소서. 갈멜[a] 한가운데의 숲에 외따로 사는 그들이 바산과 길르앗에서 옛날처럼 풀을 뜯게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈멜’은 특정 지명일 수도 있고, ‘비옥한 땅’ 또는 ‘기름진 목초지’를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעֵה
  english_pob_choice: Shepherd
  chosen_korean: 먹이소서
  alternatives_korean:
  - 목자처럼 돌보소서
  - 치소서
  lexicon: HALOT
  rationale: 히브리어 רעה의 목양 이미지를 살리되, 한국어에서는 ‘먹이소서’가 양 떼를 돌보고 길러 주는 의미를 자연스럽게 전달합니다. 문맥상 단순한 지배보다 돌봄과 공급이 중심입니다.
- source_word: בְשִׁבְטֶךָ
  english_pob_choice: with your staff
  chosen_korean: 주님의 지팡이로
  alternatives_korean:
  - 주님의 막대기로
  - 주님의 막대
  lexicon: HALOT
  rationale: שֵׁבֶט은 여기서 목자의 지팡이로 이해하는 것이 문맥에 맞습니다. ‘지팡이로’는 목양의 인도와 보호를 자연스럽게 드러내며, 한국어에서 ‘막대기’보다 덜 형벌적입니다.
- source_word: צֹאן נַחֲלָתֶךָ
  english_pob_choice: the flock of your inheritance
  chosen_korean: 주님의 기업의 양 떼
  alternatives_korean:
  - 주님의 유업의 양 떼
  - 주님의 소유된 양 떼
  lexicon: HALOT
  rationale: צֹאן은 집합명사로 ‘양 떼’가 적절하고, נַחֲלָה는 언약적 소유를 나타내므로 ‘기업’이 성경적 어휘를 유지합니다. ‘기업’은 단순 소유보다 하나님께 속한 백성이라는 뉘앙스를 보존합니다.
- source_word: בְּתוֹךְ כַּרְמֶל
  english_pob_choice: in the midst of Carmel
  chosen_korean: 숲 한가운데
  alternatives_korean:
  - 갈멜 한가운데
  - 기름진 땅 한가운데
  lexicon: HALOT
  rationale: כַּרְמֶל은 고유지명 ‘갈멜’일 수도 있고 비옥한 땅/과수원적 땅을 가리킬 수도 있습니다. 본문 흐름상 지리명보다 이미지가 더 두드러지므로, POB의 각주 취지를 반영해 본문은 ‘숲 한가운데’로 옮겨 자연스러운 소나기·외딴 목초지 이미지를 살렸습니다.
- source_word: יִרְעוּ
  english_pob_choice: let them graze
  chosen_korean: 풀을 뜯게 하소서
  alternatives_korean:
  - 먹게 하소서
  - 목초를 뜯게 하소서
  lexicon: HALOT
  rationale: יִרְעוּ는 목축 맥락의 ‘풀을 뜯다/먹다’에 해당하므로 ‘풀을 뜯게 하소서’가 가장 직접적입니다. 간구문의 흐름도 유지됩니다.
- source_word: בָשָׁן וְגִלְעָד
  english_pob_choice: in Bashan and Gilead
  chosen_korean: 바산과 길르앗에서
  alternatives_korean:
  - 바산과 길르앗에서
  - 바산과 길르앗 땅에서
  lexicon: HALOT
  rationale: 지명은 음역을 유지하는 것이 시적 병행과 역사적 지리를 살립니다. 두 지역의 비옥함이 목초지 풍요의 상징으로 기능합니다.
- source_word: כִּימֵי עוֹלָם
  english_pob_choice: as in days of old
  chosen_korean: 옛날과 같이
  alternatives_korean:
  - 옛적과 같이
  - 태고적처럼
  lexicon: HALOT
  rationale: עולם은 여기서 형이상학적 ‘영원’이 아니라 오랜 옛 시기를 뜻하므로, ‘옛날과 같이’가 가장 자연스럽고 역사적입니다.
theological_decisions:
- issue: שֵׁבֶט의 의미를 심판의 ‘막대’가 아니라 목자의 지팡이로 볼 것인지
  chosen_reading: 목양적 보호와 인도의 표지인 ‘지팡이’로 번역합니다.
  alternative_readings:
  - 권위나 징계를 강조하는 ‘막대기/채찍’
  rationale: 본문은 양 떼를 먹이시고 거하게 하시는 간구로 이어지므로, 징계보다 돌봄의 목양 이미지가 중심입니다. 따라서 ‘지팡이’가 화자 의도를 가장 잘 드러냅니다.
  doctrine_reference: 시 23편의 목자 이미지와 미 7:14의 간구적 문맥
