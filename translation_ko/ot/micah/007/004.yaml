source:
  edition: WLC
  text: טוֹבָ֣/ם כְּ/חֵ֔דֶק יָשָׁ֖ר מִ/מְּסוּכָ֑ה י֤וֹם מְצַפֶּ֨י/ךָ֙ פְּקֻדָּתְ/ךָ֣ בָ֔אָה עַתָּ֥ה תִהְיֶ֖ה מְבוּכָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/004.yaml
  text: The best of them is like a brier; the upright is worse than a thorn hedge. The day of your watchmen[a], your punishment, has come; now their confusion will be.
  footnotes:
  - marker: a
    text: Or 'your visitation.' The Hebrew term can denote an act of visitation, oversight, or punishment; here it refers to the day when judgment falls.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 가운데 가장 나은 자도 가시덤불 같고, 정직한 자도 가시 울타리보다 더 나쁩니다. 당신의 파수꾼들의 날, 곧 당신의 징벌[a]이 이르렀습니다. 이제 그들이 혼란에 빠질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신에게 찾아오심(방문)’. 히브리어 פְּקֻדָּה는 방문, 감찰, 징벌을 뜻할 수 있으며, 여기서는 심판이 임하는 날을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבָם
  english_pob_choice: the best of them
  chosen_korean: 그들 가운데 가장 나은 자
  alternatives_korean:
  - 그들의 가장 좋은 사람
  - 그들 중 제일 나은 자
  lexicon: HALOT
  rationale: 3인칭 복수 접미사를 가진 טוֹב은 앞서 언급된 사람들 가운데 상대적으로 가장 나은 이를 가리키므로, 한국어에서는 자연스럽게 ‘그들 가운데 가장 나은 자’로 옮겼습니다.
- source_word: כְּחֵדֶק
  english_pob_choice: like a brier
  chosen_korean: 가시덤불 같고
  alternatives_korean:
  - 찔레 같고
  - 가시나무 같고
  lexicon: HALOT
  rationale: חֵדֶק은 해를 끼치는 가시 식물을 가리키므로, 이미지 전달을 살려 ‘가시덤불’로 옮겼습니다.
- source_word: מִמְּסוּכָה
  english_pob_choice: worse than a thorn hedge
  chosen_korean: 가시 울타리보다 더 나쁩니다
  alternatives_korean:
  - 가시 울타리보다 못합니다
  - 가시 담보다 더 나쁩니다
  lexicon: HALOT
  rationale: מְסוּכָה는 울타리/담의 뜻이므로, 비교 구문을 자연스러운 한국어로 풀어 ‘보다 더 나쁩니다’로 처리했습니다.
- source_word: פְּקֻדָּתְךָ
  english_pob_choice: your punishment
  chosen_korean: 당신의 벌
  alternatives_korean:
  - 당신의 방문
  - 당신의 징벌
  - 당신의 감찰
  lexicon: HALOT
  rationale: 문맥상 심판 선포이므로 ‘벌’이 직접적입니다. 다만 어근의 더 넓은 뜻(방문/감찰/징벌)을 의식해 본문은 간명하게 두었습니다.
theological_decisions:
- issue: פְּקֻדָּה의 심판 문맥 번역
  chosen_reading: ‘벌’로 번역하여 하나님의 심판 도래를 분명히 드러냈습니다.
  alternative_readings:
  - ‘방문’
  - ‘징벌’
  - ‘감찰’
  rationale: 이 절은 사회적 타락에 대한 질책 뒤에 임하는 재앙을 말하므로, 한국어 독자가 판결적 의미를 즉시 파악하도록 했습니다. 원어의 더 넓은 의미는 번역 메모로 보존했습니다.
  doctrine_reference: Translation philosophy §3, §6
