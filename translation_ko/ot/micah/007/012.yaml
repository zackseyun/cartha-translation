id: MIC.7.12
reference: Micah 7:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: י֥וֹם הוּא֙ וְ/עָדֶ֣י/ךָ יָב֔וֹא לְ/מִנִּ֥י אַשּׁ֖וּר וְ/עָרֵ֣י מָצ֑וֹר וּ/לְ/מִנִּ֤י מָצוֹר֙ וְ/עַד נָהָ֔ר וְ/יָ֥ם מִ/יָּ֖ם וְ/הַ֥ר הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/012.yaml
  text: That day—they will come to you from Assyria and the cities of Egypt[a], and from Egypt to the River, from sea to sea[b], and from mountain to mountain.
  footnotes:
  - marker: a
    text: Hebrew מָצוֹר may also be understood as 'fortress,' 'siege,' or 'fortified city/cities' rather than as a name for Egypt.
    reason: lexical_alternative
  - marker: b
    text: '''The River'' likely refers to the Euphrates.'
    reason: cross_reference
translation:
  language: ko
  text: 그 날에 사람들이 아시리아와 애굽의 성읍들에서, 애굽에서부터 강까지, 바다에서 바다까지[b], 그리고 산에서 산까지[a] 당신에게로 올 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מָצוֹר는 여기서 ‘포위’, ‘요새’, ‘요새화된 성읍들’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 ‘강’은 보통 유브라데 강을 가리키는 것으로 이해됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: י֥וֹם הוּא֙
  english_pob_choice: That day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그 날
  - 그 날에는
  - 그 때에
  lexicon: HALOT
  rationale: 예언 문맥의 관용적 시간표현을 자연스러운 현대 한국어로 옮기되, 종말론적·예언적 울림은 유지했습니다.
- source_word: וְעָדֶיךָ יָבֹוא
  english_pob_choice: they will come to you
  chosen_korean: 사람들이 … 당신에게로 올 것입니다
  alternatives_korean:
  - 그들이 … 당신에게로 올 것입니다
  - 사람들이 … 네게로 올 것입니다
  - 그들이 … 네게 올 것입니다
  lexicon: HALOT
  rationale: 히브리어 동사는 단수형이지만, 여러 지역에서 모여 오는 집합적 의미가 분명하므로 한국어에서는 복수 주어를 드러내는 것이 뜻을 더 정확히 전달합니다. 2인칭 접미사는 예언적 대상인 시온/예루살렘의 집합적 ‘당신’으로 살렸습니다.
- source_word: וְ/עָרֵי מָצֹור
  english_pob_choice: and the cities of Egypt
  chosen_korean: 애굽의 성읍들
  alternatives_korean:
  - 포위의 성읍들
  - 요새화된 성읍들
  - 애굽의 도시들
  lexicon: HALOT
  rationale: 문맥상 아시리아와 병렬을 이루는 지리적 명칭으로 읽는 것이 가장 자연스럽기 때문에 ‘애굽의 성읍들’로 옮겼습니다. 다만 히브리어 자음은 ‘포위/요새’ 뜻도 가능하므로 그 대안을 주석에 남깁니다.
- source_word: וְ/עַד נָהָר
  english_pob_choice: to the River
  chosen_korean: 강까지
  alternatives_korean:
  - 그 강까지
  - 유브라데 강까지
  - 강으로부터
  lexicon: HALOT
  rationale: 히브리어의 간결한 지시 표현을 살리면서도, 한국어에서는 ‘강까지’가 가장 간명합니다. 여기의 ‘강’은 관용적으로 유브라데를 가리키므로 본문은 짧게, 의미 단서는 주석으로 처리했습니다.
- source_word: וְ/יָ֥ם מִ/יָּ֖ם
  english_pob_choice: from sea to sea
  chosen_korean: 바다에서 바다까지
  alternatives_korean:
  - 이 바다에서 저 바다까지
  - 바다로부터 바다까지
  lexicon: HALOT
  rationale: 광범위함을 나타내는 관용적 대구를 자연스러운 한국어로 옮겼습니다.
- source_word: וְ/הַ֥ר הָ/הָֽר־
  english_pob_choice: from mountain to mountain
  chosen_korean: 산에서 산까지
  alternatives_korean:
  - 이 산에서 저 산까지
  - 산에서 산으로
  lexicon: HALOT
  rationale: 이 표현도 넓은 범위를 나타내는 평행법이므로, 앞의 ‘바다에서 바다까지’와 같은 구조로 살렸습니다.
theological_decisions:
- issue: 문장 전체의 종말론적·회복 약속 뉘앙스
  chosen_reading: 미래 회복의 도래를 말하는 예언으로 유지
  alternative_readings:
  - 단순한 공간 이동 묘사
  - 포로 귀환의 지리적 요약
  rationale: 미가의 예언 문맥에서 이 절은 여러 민족/지역으로부터의 모임과 회복을 암시하므로, 단순 지리 정보처럼 평탄화하지 않고 미래형으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: וְעָדֶיךָ יָבֹוא의 집합적 주어 처리
  chosen_reading: 사람들이 … 올 것입니다
  alternative_readings:
  - 그가 … 올 것입니다
  - 한 사람이 … 올 것입니다
  rationale: 열거된 여러 지역이 집합적 귀환을 가리키므로, 한국어에서는 단수 직역보다 복수 집합 의미를 드러내는 것이 원문의 의도를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
