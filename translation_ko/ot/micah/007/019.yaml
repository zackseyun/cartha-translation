id: MIC.7.19
reference: Micah 7:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָשׁ֣וּב יְרַֽחֲמֵ֔/נוּ יִכְבֹּ֖שׁ עֲוֺֽנֹתֵ֑י/נוּ וְ/תַשְׁלִ֛יךְ בִּ/מְצֻל֥וֹת יָ֖ם כָּל חַטֹּאותָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/019.yaml
  text: He will again have compassion on us[a]; he will subdue our iniquities[b]. He will cast all their sins into the depths of the sea.
  footnotes:
  - marker: a
    text: Hebrew shifts unexpectedly from 'He will' to direct address, 'You will cast.' Some ancient witnesses and translations smooth this to 'and he will cast.'
    reason: alternative_reading
  - marker: b
    text: Hebrew reads 'their sins'; many translations render 'our sins' to harmonize with the earlier 'our iniquities.'
    reason: textual_variant
translation:
  language: ko
  text: 그분께서는 다시 우리를 긍휼히 여기시고 우리의 죄악을 억누르실 것입니다. 주님, 주님께서 그들의 모든 죄를[a][b] 바다 깊은 곳에 던지실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 앞의 동사들을 3인칭으로 쓰다가 마지막 동사에서 갑자기 2인칭 형태로 바꿉니다. 일부 고대 전승 증거와 번역본은 이를 평준화하여 “그가 던지실 것이다”로 옮깁니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 “우리의 죄악”이 아니라 “그들의 죄들”이라고 읽습니다. 많은 번역은 앞의 “우리의 죄악”에 맞추어 “우리의 죄들”로 옮깁니다.
    reason: textual_variant
lexical_decisions:
- source_word: יָשׁוּב יְרַחֲמֵנוּ
  english_pob_choice: He will again have compassion on us
  chosen_korean: 그는 다시 우리를 불쌍히 여기시고
  alternatives_korean:
  - 그는 다시 우리에게 긍휼을 베푸시고
  - 그는 다시 우리에게 자비를 베푸시고
  lexicon: HALOT
  rationale: יָשׁוּב의 반복 의미를 한국어 부사 '다시'로 자연스럽게 살리고, רחם의 정서적 뉘앙스를 '불쌍히 여기시고'로 옮겼습니다.
- source_word: יִכְבֹּשׁ עֲוֺנֹתֵינוּ
  english_pob_choice: he will subdue our iniquities
  chosen_korean: 우리의 죄악들을 꺾으실 것입니다
  alternatives_korean:
  - 우리의 죄악들을 굴복시키실 것입니다
  - 우리의 죄를 제압하실 것입니다
  lexicon: HALOT
  rationale: כבש는 단순한 제거보다 강한 정복·굴복의 뜻이 있어, 죄악을 힘으로 눌러 제어하시는 이미지를 살려 '꺾다'로 옮겼습니다.
- source_word: וְתַשְׁלִיךְ
  english_pob_choice: You will cast
  chosen_korean: 주님께서는 ... 던지실 것입니다
  alternatives_korean:
  - 주님께서는 ... 버리실 것입니다
  - 주님께서는 ... 쫓아내실 것입니다
  lexicon: HALOT
  rationale: 본문의 2인칭 형태를 반영하는 것이 핵심이지만, 한국어에서는 직접 호칭 없이도 문맥상 주님을 주어로 이어 가는 방식이 자연스러워, 본문은 인칭 긴장을 해치지 않는 범위에서 현재적 선언형으로 옮겼습니다.
- source_word: בִּמְצֻלוֹת יָם
  english_pob_choice: into the depths of the sea
  chosen_korean: 바다 깊은 곳에
  alternatives_korean:
  - 바다의 깊은 곳에
  - 바다의 심연에
  lexicon: HALOT
  rationale: מצולות의 심층 이미지를 한국어로 과장 없이 전달하는 가장 자연한 표현으로 '바다 깊은 곳'을 택했습니다.
theological_decisions:
- issue: 히브리어의 인칭 전환을 한국어에서 어떻게 드러낼지
  chosen_reading: 마지막 절의 2인칭 형태를 완전히 평준화하지 않고, 주어를 주님으로 다시 받되 문장 흐름 안에 긴장을 남겨 두었습니다.
  alternative_readings:
  - 완전히 3인칭으로 통일하여 '그는 ... 던지실 것입니다'로 옮김
  - 직접 2인칭으로 '주님, 주님께서는 ... 던지실 것입니다'로 옮김
  rationale: 본문은 앞부분의 3인칭에서 갑자기 2인칭 형태로 이동합니다. 한국어에서는 이 긴장을 노골적으로 재현하기보다, 문맥상 주님께 향한 선언으로 읽히게 하면서도 급격한 평준화를 피하는 쪽이 합쇼체 본문에 적합합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
