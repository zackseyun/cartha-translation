source:
  edition: WLC
  text: יְלַחֲכ֤וּ עָפָר֙ כַּ/נָּחָ֔שׁ כְּ/זֹחֲלֵ֣י אֶ֔רֶץ יִרְגְּז֖וּ מִ/מִּסְגְּרֹֽתֵי/הֶ֑ם אֶל יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ יִפְחָ֔דוּ וְ/יִֽרְא֖וּ מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/017.yaml
  text: They will lick the dust like a snake[a]; like crawling things of the earth they will come trembling out of their strongholds. To Yahweh our God they will turn in dread[d][c][b], and they will be afraid because of you.
  footnotes:
  - marker: a
    text: Or 'their fortresses,' 'their enclosures,' or 'their hiding places' for 'their strongholds.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they will fear you' / 'they will stand in awe of you.' The Hebrew can express fear before God, with possible overtones of awe.
    reason: lexical_alternative
  - marker: c
    text: '''the LORD'' renders the divine name YHWH.'
    reason: alternative_reading
  - marker: d
    text: Or 'they will come in fear'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 뱀처럼 티끌을 핥고, 땅을 기어 다니는 것들처럼 자기들의 요새에서 떨며 나올 것입니다. 그들은 우리 하나님 야훼께 두려움에 떨며 나아오고, 야훼 때문에 두려워할 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘요새’는 여기서 성채, 울타리, 또는 숨는 곳을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두려워할 것입니다’는 ‘경외할 것입니다’로도 옮길 수 있습니다. 히브리어는 하나님 앞의 두려움과 경외를 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘야훼’는 하나님의 이름 YHWH를 옮긴 것입니다.
    reason: alternative_reading
  - marker: d
    text: ‘두려움에 떨며 나아오고’는 ‘두려움 가운데 나아오고’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: יְלַחֲכוּ עָפָר כַּנָּחָשׁ
  english_pob_choice: they will lick the dust like a snake
  chosen_korean: 뱀처럼 티끌을 핥고
  alternatives_korean:
  - 뱀처럼 먼지를 핥고
  - 뱀처럼 흙을 핥고
  lexicon: HALOT
  rationale: 핥다로 동작의 생생한 이미지를 살리고, עָפָר는 여기서 티끌로 옮겨 낮아짐과 굴욕의 뉘앙스를 자연스럽게 드러냈습니다.
- source_word: כְּזֹחֲלֵי אֶרֶץ
  english_pob_choice: like crawling things of the earth
  chosen_korean: 땅의 기어 다니는 것들처럼
  alternatives_korean:
  - 땅을 기어 다니는 생물처럼
  - 땅의 파충류처럼
  lexicon: HALOT
  rationale: 특정 동물군으로 좁히지 않고 ‘기어 다니는 것들’로 옮겨, 낮고 비천한 이미지와 문맥의 포괄성을 유지했습니다.
- source_word: יִרְגְּזוּ מִמִּסְגְּרֹתֵיהֶם
  english_pob_choice: they will come trembling out of their strongholds
  chosen_korean: 떨며 자기 보루에서 나올 것입니다
  alternatives_korean:
  - 떨며 자기 요새에서 나올 것입니다
  - 떨며 자기 은신처에서 나올 것입니다
  lexicon: HALOT
  rationale: רגז의 ‘떨다’와 출현 동작을 함께 살리되, מִסְגֶּרֶת는 이 문맥에서 보호된 거처의 의미를 살려 보루로 옮겼습니다.
- source_word: אֶל יְהוָה אֱלֹהֵינוּ
  english_pob_choice: To Yahweh our God
  chosen_korean: 우리 하나님 야훼께
  alternatives_korean:
  - 우리 하나님께
  - 우리 하나님 여호와께
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 יְהוָה는 야훼로 옮기고, אֶל은 ‘-께’로 방향성을 드러냈습니다.
- source_word: יִפְחָדוּ וְיִרְאוּ מִמֶּךָּ
  english_pob_choice: they will turn in dread, and they will be afraid because of you
  chosen_korean: 떨며 나아오고, 당신 때문에 두려워할 것입니다
  alternatives_korean:
  - 두려움 가운데 나아오고, 당신을 경외할 것입니다
  - 두려워하며 나아오고, 당신을 두려워할 것입니다
  lexicon: HALOT
  rationale: פחד와 ירא를 각각 두려움의 강도 차이로 살리되, 마지막 מִמֶּךָּ는 원인의 의미를 따라 ‘때문에’로 옮겨 과도한 종교적 완화 없이 두려움의 원인을 분명히 했습니다.
theological_decisions:
- issue: 여호와 이름의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 프로젝트의 기본 규범에 따라 여호와/야훼 논쟁을 반영해 יְהוָה를 야훼로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 두려움 동사의 뉘앙스
  chosen_reading: 종교적 경외보다 적대자들이 느끼는 실제 두려움과 떨림을 우선 반영
  alternative_readings:
  - 경외
  - 공경
  rationale: פחד/ירא의 병렬은 이스라엘의 하나님 앞에서 굴복하는 이방 민족의 두려움을 나타내므로, 경외로 약화시키지 않고 두려움으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: preserve theological tension rather than resolve it'
