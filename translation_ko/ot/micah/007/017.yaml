  source_fidelity: 전반적으로 히브리어의 낮아짐과 공포의 이미지를 잘 보존합니다. 그러나 כְּזֹחֲלֵי אֶרֶץ는 ‘땅의 기어 다니는 것들’보다 ‘땅을 기어 다니는 것들’이 자연스럽고, 마지막 מִמֶּךָּ의 2인칭 지시 대상은 ‘당신’보다 앞선 신명 ‘야훼’로 밝혀 주는 편이 한국어에서 정확하고 오해가 없습니다. פחד와 ירא의 병렬도 모두 두려움의 영역으로 유지했습니다.
  naturalness: ‘땅의 기어 다니는 것들’과 ‘자기 보루’는 현대 표준 한국어에서 다소 어색합니다. ‘땅을 기어 다니는 것들’, ‘자기들의 요새’가 더 자연스럽습니다. 하나님을 가리키는 ‘당신’은 현대 한국어에서 무례하거나 대화 상대가 불분명하게 들릴 수 있으므로 신명을 반복하는 것이 안전합니다.
