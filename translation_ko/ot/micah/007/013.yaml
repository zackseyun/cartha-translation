  lexicon: HALOT
  rationale: 문맥상 심판 대상인 지역을 가리키므로 ‘땅’이 적절하고, 관형사 ‘이’를 붙여 한국어에서의 지시감과 문맥 결속을 살렸습니다.
- source_word: לִשְׁמָמָה
  english_pob_choice: a desolation
  chosen_korean: 황폐하게
  alternatives_korean:
  - 황무지로
  - 폐허가 되어
  lexicon: HALOT
  rationale: 히브리어 명사형의 상태를 한국어에서 자연스럽게 풀어, ‘황폐’라는 심판 언어의 강도를 유지했습니다.
- source_word: עַל יֹשְׁבֶיהָ / מִפְּרִי מַעַלְלֵיהֶם
  english_pob_choice: because of its inhabitants / because of the fruit of their deeds
  chosen_korean: 그 주민들 때문에, 그들의 행위의 열매 때문에
  alternatives_korean:
  - 그 주민들로 말미암아, 그들의 행위의 결과로
  - 그곳에 사는 이들 때문에, 그들의 행위의 소산 때문에
  lexicon: HALOT
  rationale: 두 개의 원인 구문을 모두 보존해야 하므로 ‘때문에’를 반복해 원문의 누적된 인과 구조를 드러냈고, ‘행위의 열매’는 결과를 낳는 행위라는 히브리어 표현을 그대로 살렸습니다.
theological_decisions:
- issue: 심판의 인과 구조
  chosen_reading: 땅의 황폐함은 주민들의 책임과 그 행위가 낳은 결과에 대한 심판으로 제시됩니다.
  alternative_readings:
  - 단순한 상태 진술로 ‘이 땅이 황폐할 것입니다’라고만 옮길 수도 있습니다.
  rationale: 히브리어는 주민들과 그 행위의 열매를 연속적으로 원인으로 제시하므로, 한국어에서도 그 도덕-인과적 구조를 분명히 보존했습니다.
  doctrine_reference: Translation philosophy §3, §6
