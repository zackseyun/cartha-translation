  text: וְ/הָיְתָ֥ה הָ/אָ֛רֶץ לִ/שְׁמָמָ֖ה עַל יֹֽשְׁבֶ֑י/הָ מִ/פְּרִ֖י מַֽעַלְלֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/013.yaml
  text: But the land will become a desolation because of its inhabitants[b][a], because of the fruit of their deeds.
  footnotes:
  - marker: a
    text: Or 'the earth will be a desolation.' The Hebrew אֶרֶץ can mean 'land' or 'earth'; here 'land' best fits the immediate judgment context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from the fruit of their deeds,' a Hebrew expression for the consequences produced by what they have done.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이 땅은 그 주민들 때문에, 그들의 행위의 열매 때문에 황폐하게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘땅/지면’의 뜻을 가질 수 있으나, 여기서는 심판 문맥상 ‘땅’이 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 행위의 열매로부터’로, 행위가 낳는 결과를 가리키는 히브리어식 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  english_pob_choice: will become
  chosen_korean: ~될 것입니다
  alternatives_korean:
  - ~입니다
  - ~되겠습니다
  lexicon: HALOT
  rationale: 예언적 미래를 자연스럽게 살리되, 단순 상태 진술보다 황폐화로 ‘되어 가는’ 결과성을 드러냈습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 이 땅
  alternatives_korean:
  - 그 땅
  - 땅
  lexicon: HALOT
  rationale: 문맥상 심판 대상인 지역을 가리키므로 ‘땅’이 적절하고, 관형사 ‘이’를 붙여 한국어에서의 지시감과 문맥 결속을 살렸습니다.
- source_word: לִשְׁמָמָה
  english_pob_choice: a desolation
  chosen_korean: 황폐하게
  alternatives_korean:
  - 황무지로
  - 폐허가 되어
  lexicon: HALOT
  rationale: 히브리어 명사형의 상태를 한국어에서 자연스럽게 풀어, ‘황폐’라는 심판 언어의 강도를 유지했습니다.
- source_word: עַל יֹשְׁבֶיהָ / מִפְּרִי מַעַלְלֵיהֶם
  english_pob_choice: because of its inhabitants / because of the fruit of their deeds
  chosen_korean: 그 주민들 때문에, 그들의 행위의 열매 때문에
  alternatives_korean:
  - 그 주민들로 말미암아, 그들의 행위의 결과로
  - 그곳에 사는 이들 때문에, 그들의 행위의 소산 때문에
  lexicon: HALOT
  rationale: 두 개의 원인 구문을 모두 보존해야 하므로 ‘때문에’를 반복해 원문의 누적된 인과 구조를 드러냈고, ‘행위의 열매’는 결과를 낳는 행위라는 히브리어 표현을 그대로 살렸습니다.
theological_decisions:
- issue: 심판의 인과 구조
  chosen_reading: 땅의 황폐함은 주민들의 책임과 그 행위가 낳은 결과에 대한 심판으로 제시됩니다.
  alternative_readings:
  - 단순한 상태 진술로 ‘이 땅이 황폐할 것입니다’라고만 옮길 수도 있습니다.
  rationale: 히브리어는 주민들과 그 행위의 열매를 연속적으로 원인으로 제시하므로, 한국어에서도 그 도덕-인과적 구조를 분명히 보존했습니다.
  doctrine_reference: Translation philosophy §3, §6
