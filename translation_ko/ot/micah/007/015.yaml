base_translation:
  language: en
  yaml_path: translation/ot/micah/007/015.yaml
  text: As in the days when you came out from the land of Egypt[a], I will show him wondrous things.
  footnotes:
  - marker: a
    text: Or 'I will show them wondrous things.' The Hebrew suffix is singular ('him'), but it may refer collectively to Israel.
    reason: alternative_reading
translation:
  language: ko
  text: 네가 이집트 땅에서 나오던 날들처럼, 내가 그에게 놀라운 일들을 보여 줄 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그들에게 놀라운 일들을 보여 줄 것입니다.’ 히브리어 접미사는 단수(‘그에게’)이지만, 이스라엘을 집합적으로 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּימֵי
  english_pob_choice: As in the days
  chosen_korean: ~하던 날들과 같이
  alternatives_korean:
  - ~하던 날처럼
  - ~하던 때와 같이
  lexicon: HALOT
  rationale: 비교를 나타내는 כ + ימי를 한국어의 ‘~하던 날들과 같이’로 자연스럽게 옮겨, 과거의 출애굽 시기를 기준점으로 삼는 비교 의미를 살렸습니다.
- source_word: צֵאתְךָ
  english_pob_choice: when you came out
  chosen_korean: 너희가 ... 나오던
  alternatives_korean:
  - 네가 ... 나오던
  - 너의 나옴
  lexicon: HALOT
  rationale: 히브리어는 2인칭 단수 소유 접미사를 가지지만 문맥상 이스라엘 공동체를 가리키는 집합적 단수이므로, 한국어에서는 자연스럽게 ‘너희’로 풀어 공동체적 의미를 드러냈습니다.
- source_word: מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: from the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트에서
  - 이집트 땅으로부터
  lexicon: HALOT
  rationale: 출애굽의 정형 표현을 살리되, ‘땅’까지 포함한 히브리어의 장엄함을 유지하기 위해 ‘이집트 땅에서’로 옮겼습니다.
- source_word: נִפְלָאוֹת
  english_pob_choice: wondrous things
  chosen_korean: 놀라운 일들
  alternatives_korean:
  - 기이한 일들
  - 경이로운 일들
  - 놀라운 일
  lexicon: HALOT
  rationale: נִפְלָאוֹת는 단순한 ‘기적’보다 더 넓게 경탄을 불러일으키는 일들을 뜻하므로, 의미를 과도하게 좁히지 않는 ‘놀라운 일들’을 선택했습니다.
theological_decisions:
- issue: אראנו의 3인칭 단수 목적어
  chosen_reading: 문자형은 단수이므로 본문은 ‘그에게’로 두고, 문맥상 이스라엘을 가리키는 집합적 단수로 이해하게 했습니다.
  alternative_readings:
  - 그들에게로 옮겨 집합성을 직접 반영함
  rationale: 히브리어의 문법적 단수를 평탄화하지 않고 보존해야 본문이 가진 긴장을 유지할 수 있습니다. 문맥상 공동체적 지시를 이해할 여지는 남겨 두었습니다.
  doctrine_reference: '번역 원칙: 해소되지 않은 문법적 긴장을 보존'
