id: MIC.4.3
reference: Micah 4:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁפַ֗ט בֵּ֚ין עַמִּ֣ים רַבִּ֔ים וְ/הוֹכִ֛יחַ לְ/גוֹיִ֥ם עֲצֻמִ֖ים עַד רָח֑וֹק וְ/כִתְּת֨וּ חַרְבֹתֵי/הֶ֜ם לְ/אִתִּ֗ים וַ/חֲנִיתֹֽתֵי/הֶם֙ לְ/מַזְמֵר֔וֹת לֹֽא יִשְׂא֞וּ גּ֤וֹי אֶל גּוֹי֙ חֶ֔רֶב וְ/לֹא יִלְמְד֥וּ/ן ע֖וֹד מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/003.yaml
  text: And he will judge between many peoples[a], and will arbitrate for strong nations far away; and they will beat their swords into plowshares and their spears into pruning hooks. Nation will not lift up sword against nation[c][b], nor will they learn war anymore.
  footnotes:
  - marker: a
    text: Or 'and will reprove' / 'and will arbitrate' for strong nations far away.
    reason: lexical_alternative
  - marker: b
    text: Or 'plow blades' for 'plowshares.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'learn war' may also mean 'train for war.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 많은 민족들 사이에서 심판하시며, 먼 곳의 강한 나라들을 위해 판결하실 것입니다. 그들은 자기들의 칼을 보습으로, 자기들의 창을 전지가위로 쳐 바꿀 것이며, 나라가 나라를 향하여 칼을 들지 않을 것이고, 다시는 전쟁을 배우지 않을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘판단하며’, ‘판결하며’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘보습’은 경우에 따라 ‘쟁기날’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘전지가위’는 포도나무를 치는 도구를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁפַט
  english_pob_choice: and he will judge
  chosen_korean: 심판하시며
  alternatives_korean:
  - 판단하시며
  - 다스리시며
  lexicon: HALOT
  rationale: שׁפט는 법정적 판단과 통치를 함께 가질 수 있으나, 여기서는 국제적 분쟁을 다루는 문맥이므로 ‘심판하다’가 가장 직접적으로 대응합니다.
- source_word: בֵּין עַמִּים רַבִּים
  english_pob_choice: between many peoples
  chosen_korean: 많은 민족들 사이에서
  alternatives_korean:
  - 많은 백성들 사이에서
  - 많은 나라들 사이에서
  lexicon: HALOT
  rationale: עַמִּים은 현대 정치 단위의 ‘나라’보다 집단적 ‘민족들’이 더 가깝고, בֵּין은 ‘사이에서’로 자연스럽게 옮겼습니다.
- source_word: וְהוֹכִיחַ לְגוֹיִם עֲצֻמִים עַד רָחוֹק
  english_pob_choice: and will arbitrate for strong nations far away
  chosen_korean: 먼 곳의 강한 나라들을 위해 판결하실 것입니다
  alternatives_korean:
  - 먼 곳의 강한 나라들을 위해 중재하실 것입니다
  - 먼 곳의 강한 나라들을 위해 논쟁을 판결하실 것입니다
  lexicon: HALOT
  rationale: הוֹכִיחַ는 ‘꾸짖다’보다 여기서는 분쟁을 판정하다/판결하다의 법정적 뉘앙스가 더 강하므로, POB의 ‘arbitrate’ 취지를 살려 ‘판결하다’로 옮겼습니다.
- source_word: וְכִתְּתוּ חַרְבֹתֵיהֶם לְאִתִּים ... לְמַזְמֵרוֹת
  english_pob_choice: they will beat their swords into plowshares and their spears into pruning hooks
  chosen_korean: 자기들의 칼을 보습으로, 자기들의 창을 전지가위로 쳐 바꿀 것이며
  alternatives_korean:
  - 자기들의 칼을 쟁기날로, 자기들의 창을 전정용 낫으로 쳐 바꿀 것이며
  - 자기들의 칼을 쟁기날로, 자기들의 창을 가지치기용 칼로 쳐 바꿀 것이며
  lexicon: HALOT
  rationale: כּתת의 ‘쳐서 부수다/두들겨 펴다’라는 물질적 변형을 살려 ‘쳐 바꾸다’로 옮겼고, לְאִתִּים과 לְמַזְמֵרוֹת는 농기구의 기능을 드러내는 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: 첫 두 절의 주체가 누구인지
  chosen_reading: 본문의 드러나지 않은 단수 주체를 ‘그가’로 유지하고, 주체를 본문 밖에서 특정하지 않았습니다.
  alternative_readings:
  - 여호와
  - 메시아 왕
  - 시온/예루살렘의 의인화
  rationale: 히브리어는 단수 동사로 시작하지만 명시적 명사 주어를 두지 않으므로, 예언적 문맥의 해석을 본문에 과잉 주입하지 않도록 주체를 비특정적으로 남겼습니다.
  doctrine_reference: 본문 내 지시를 보존하고 해석적 확정을 유보합니다.
