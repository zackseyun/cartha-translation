revisions:
- from: 그가 많은 민족들 사이에서 심판하시며, 먼 곳의 강한 나라들을 위해 판결하실 것입니다. 그들은 자기들의 칼을 보습으로, 자기들의 창을 전지가위로 쳐 바꿀 것이며, 나라가 나라를 향하여 칼을 들지 않을 것이고, 다시는 전쟁을 배우지 않을 것입니다.[a][b][c]
  to: 그가 많은 민족들 사이에서 심판하시고, 먼 곳에 있는 강한 나라들의 분쟁을 판정하실 것입니다.[a] 그들은 자기들의 칼을 보습으로[b], 자기들의 창을 전정용 낫으로 쳐서 만들 것이며, 나라가 나라를 향해 칼을 들지 않을 것이고, 다시는 전쟁을 배우지 않을 것입니다.[c]
  rationale: 원문의 병행하는 사법 표현과 평화의 이미지를 유지하되, 한국어에서 부자연스러운 ‘나라들을 위해 판결하다’를 ‘나라들의 분쟁을 판정하다’로 바로잡았습니다. 전정 도구는 원어의 일반성을 보존하도록 ‘전정용 낫’으로 수정했습니다. 각주 표지와 내용도 각각 판정 동사, 보습, 전쟁을 배우다에 정확히 연결했습니다.
