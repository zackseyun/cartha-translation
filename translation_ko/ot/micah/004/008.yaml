id: MIC.4.8
reference: Micah 4:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה מִגְדַּל עֵ֗דֶר עֹ֛פֶל בַּת צִיּ֖וֹן עָדֶ֣י/ךָ תֵּאתֶ֑ה וּ/בָאָ֗ה הַ/מֶּמְשָׁלָה֙ הָ/רִ֣אשֹׁנָ֔ה מַמְלֶ֖כֶת לְ/בַ֥ת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/008.yaml
  text: And you[a], tower of the flock, hill of daughter Zion—to you it will come, yes, the former dominion will come[c][b], the kingdom of the daughter of Jerusalem.
  footnotes:
  - marker: a
    text: Or 'Migdal-eder' (a place name); also possibly 'watchtower of the flock.'
    reason: alternative_reading
  - marker: b
    text: Or 'Ophel of daughter Zion,' taking 'Ophel' as a place name rather than the common noun 'hill.'
    reason: alternative_reading
  - marker: c
    text: '''The former dominion'' likely refers to the restoration of Jerusalem''s earlier royal rule.'
    reason: cross_reference
translation:
  language: ko
  text: 그리고 너, 양 떼의 망대, 시온 딸의 언덕아—네게로 옛 통치권이 올 것이며, 예, 예루살렘 딸의 나라가 올 것이다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미그달에델’(지명)일 수 있으며, ‘양 떼의 망대’로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘오펠’(지명)로 볼 수 있으며, 이 경우 ‘시온 딸의 언덕’은 지명 구문이 됩니다.
    reason: alternative_reading
  - marker: c
    text: ‘옛 통치권’은 예루살렘의 이전 왕적 통치가 회복된다는 뜻일 가능성이 큽니다.
    reason: cross_reference
lexical_decisions:
- source_word: מִגְדַּל עֵדֶר
  english_pob_choice: tower of the flock
  chosen_korean: 양 떼의 망대
  alternatives_korean:
  - 목자의 망대
  - 미그달에델
  lexicon: HALOT
  rationale: 직역하면 ‘떼/양 떼의 망대’이므로, 본문 이미지가 살아 있는 현대 한국어로 ‘양 떼의 망대’라고 옮겼습니다. 지명 가능성은 주석으로 남길 수 있지만, 본문은 공통 명사 의미를 우선했습니다.
- source_word: עֹפֶל
  english_pob_choice: hill
  chosen_korean: 언덕
  alternatives_korean:
  - 오펠
  - 성채 언덕
  - 높은 곳
  lexicon: HALOT
  rationale: 여기서는 시온 딸과의 병렬 구조에서 지형 표현으로 읽히므로, 한국어로 가장 자연스러운 ‘언덕’을 택했습니다. 지명 ‘오펠’ 가능성은 본문에 넣지 않고 주석으로 처리합니다.
- source_word: בַּת צִיּוֹן
  english_pob_choice: daughter Zion
  chosen_korean: 시온 딸
  alternatives_korean:
  - 딸 시온
  - 시온의 딸
  lexicon: HALOT
  rationale: 예언서의 의인화 표현을 보존하기 위해 ‘시온 딸’로 옮겼습니다. ‘시온’만으로 평탄화하지 않아 도시를 딸로 부르는 수사적 긴장을 유지합니다.
- source_word: הַמֶּמְשָׁלָה הָרִאשֹׁנָה
  english_pob_choice: the former dominion
  chosen_korean: 옛 통치권
  alternatives_korean:
  - 이전의 통치
  - 옛 주권
  - 옛 지배권
  lexicon: HALOT
  rationale: ממשלה는 단순한 행정권보다 통치/지배의 뉘앙스가 강하므로 ‘통치권’으로 살렸습니다. הָרִאשֹׁנָה는 순번보다 시간상의 ‘옛/이전’이 자연스러워 ‘옛’으로 옮겼습니다.
- source_word: מַמְלֶכֶת
  english_pob_choice: the kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕국
  - 왕권
  - 통치
  lexicon: HALOT
  rationale: 이 어휘는 왕정적 질서를 가리키지만, ‘옛 통치권’과의 병렬에서 한국어는 ‘나라’가 가장 자연스럽고 압축적입니다. 다만 본문의 정치적 회복 의미는 유지됩니다.
theological_decisions:
- issue: 예루살렘 딸/시온 딸의 회복을 어떻게 드러낼 것인가
  chosen_reading: 도시를 인격화한 표현을 그대로 살려, 회복되는 통치가 ‘예루살렘 딸’에게 돌아오는 것으로 번역했습니다.
  alternative_readings:
  - ‘예루살렘의 딸에게’처럼 문법적으로 평이하게 풀어쓰기
  - 회복의 의미를 더 분명히 하여 ‘다시 주어질 것이다’로 의역
  rationale: 히브리어는 단순한 장소 설명이 아니라 의인화된 시온/예루살렘 이미지를 사용하므로, 이를 유지해야 예언적 정서를 훼손하지 않습니다. 동시에 본문은 다윗 왕조를 명시하지 않으므로 정치적 회복의 암시만 남겼습니다.
  doctrine_reference: Translation philosophy §1, §3
