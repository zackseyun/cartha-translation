  text: And many nations will come and say[a], “Come, let us go up to the mountain of Yahweh, to the house of the God of Jacob, that he may teach us his ways and that we may walk in his paths.” For from Zion Torah will go out, and the word of Yahweh from Jerusalem.
  footnotes:
  - marker: a
    text: Or “law” or “instruction” for “Torah.”
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 나라들이 와서 말합니다. 「오십시오, 우리가 야훼의 산으로, 야곱의 하나님 집으로 올라가자. 그가 우리의 길들을 우리에게 가르치시고 우리가 그의 길들로 걷게 하실 것이다.」 이는 시온에서 율법이 나오고 야훼의 말씀이 예루살렘에서 나올 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 “율법”은 히브리어 תּוֹרָה의 번역으로, “가르침” 또는 “토라”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלְכוּ גּוֹיִם רַבִּים
  english_pob_choice: And many nations will come
  chosen_korean: 많은 나라들이 와서
  alternatives_korean:
  - 많은 민족들이 와서
  - 많은 나라들이 올라와서
  lexicon: HALOT
  rationale: גוֹיִם רַבִּים은 국제적 집단을 가리키는 표현이므로 “많은 나라들”이 직접적입니다. 동사의 이동성은 한국어 “와서”로 자연스럽게 살렸습니다.
- source_word: הַר יְהוָה
  english_pob_choice: the mountain of Yahweh
  chosen_korean: 야훼의 산
  alternatives_korean:
  - 야훼의 산
  - 야훼의 산악
  lexicon: HALOT
  rationale: הַר는 문자적으로 “산”이므로 직역을 유지했습니다. 하나님의 이름 יְהוָה는 프로젝트 기본값에 따라 “야훼”로 옮겼습니다.
- source_word: בֵּית אֱלֹהֵי יַעֲקֹב
  english_pob_choice: the house of the God of Jacob
  chosen_korean: 야곱의 하나님 집
  alternatives_korean:
  - 야곱의 하나님이 계신 집
  - 야곱의 하나님 성전
  lexicon: HALOT
  rationale: “집”이라는 관용을 보존해 원문 이미지를 유지했습니다. “성전”은 해석을 더 앞세우므로 피했습니다.
- source_word: וְיוֹרֵנוּ מִדְּרָכָיו וְנֵלְכָה בְּאֹרְחֹתָיו
  english_pob_choice: that he may teach us his ways and that we may walk in his paths
  chosen_korean: 그가 우리의 길들을 우리에게 가르치시고 우리가 그의 길들로 걷게 하실 것이다
  alternatives_korean:
  - 그가 그의 길들을 우리에게 가르치시고 우리가 그의 오솔길들로 걷게 하실 것이다
  - 그가 우리에게 그의 길을 가르치시고 우리가 그 길로 걸을 것이다
  lexicon: HALOT
  rationale: 동사의 목적/결과 관계를 한국어 종속절로 풀어 “가르치시고 … 걷게 하실 것이다”로 옮겼습니다. מִדְּרָכָיו와 בְּאֹרְחֹתָיו의 병행을 “길들”로 통일해 의미를 유지했습니다.
- source_word: תּוֹרָה
  english_pob_choice: Torah
  chosen_korean: 율법
  alternatives_korean:
  - 토라
  - 가르침
  - 법
  lexicon: HALOT
  rationale: 이 구절에서는 시온에서 나오는 언약적 가르침이지만, 한국어 독자가 즉시 이해할 수 있도록 기본어 “율법”을 택했습니다. 본문은 예언적 권위를 지닌 하나님의 지시를 가리키므로 단순한 규정집보다 넓은 의미로 읽히게 됩니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 יְהוָה가 나오므로, 이름을 칭호로 대체하지 않고 학술적 음역인 “야훼”를 유지했습니다. 이는 POB의 이름-칭호 구분과도 일치합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: תּוֹרָה의 번역
  chosen_reading: 율법
  alternative_readings:
  - 토라
  - 가르침
  rationale: 이 문맥에서 תּוֹרָה는 시온에서 나오는 하나님의 가르침이지만, 한국어 성경 수용층에 가장 즉각적으로 의미가 전달되는 표준어는 “율법”입니다. 다만 주석 없이 법규로만 좁아지지 않도록 문맥상 예언적 가르침으로 이해되게 번역했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
