  source_fidelity: 수정이 필요합니다. 히브리어의 미완료형은 이 환상 문맥에서 미래를 가리키므로 첫 절은 “와서 말할 것입니다”로 옮겨야 합니다. 또한 מִדְּרָכָיו는 ‘그의 길들’인데 초안의 ‘우리의 길들’은 대명사 지시 대상이 바뀌었습니다. וְנֵלְכָה는 화자들(여러 나라)의 청유/의지 표현이므로 하나님이 ‘걷게 하실 것이다’라고 사역시키는 표현보다 ‘걷게 해 주시도록/걷도록’이 적절합니다.
  naturalness: 초안의 “야곱의 하나님 집”은 현대 표준 한국어에서 소유 관계가 불명확하고 다소 비문적입니다. “야곱의 하나님의 집”이 자연스럽습니다. 인용문 안의 공동 초청은 “오십시오”보다 “자, … 올라갑시다”가 자연스럽고, 현대 격식체에도 맞습니다.
