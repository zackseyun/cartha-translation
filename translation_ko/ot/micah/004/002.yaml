revisions:
- from: 많은 나라들이 와서 말합니다. 「오십시오, 우리가 야훼의 산으로, 야곱의 하나님 집으로 올라가자. 그가 우리의 길들을 우리에게 가르치시고 우리가 그의 길들로 걷게 하실 것이다.」 이는 시온에서 율법이 나오고 야훼의 말씀이 예루살렘에서 나올 것이기 때문입니다.[a]
  to: 많은 나라들이 와서 말할 것입니다. “자, 우리가 야훼의 산으로, 야곱의 하나님의 집으로 올라갑시다. 그분께서 우리에게 자신의 길들을 가르쳐 주시고, 우리가 그분의 길로 걷도록 하십시다.” 이는 토라[a]가 시온에서 나오고 야훼의 말씀이 예루살렘에서 나올 것이기 때문입니다.
  rationale: 미래적 환상 문맥의 시제를 회복하고, 하나님의 길이라는 소유 관계를 바로잡았습니다. 또한 청유형의 공동 목적을 한국어 합쇼체로 자연스럽게 옮겼으며, תּוֹרָה의 의미 폭을 보존하기 위해 ‘토라’와 직접 연결된 어휘 각주를 두었습니다.
