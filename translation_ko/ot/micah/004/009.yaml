  yaml_path: translation/ot/micah/004/009.yaml
  text: Now why do you cry out so loudly? Is there no king in you? Has your counselor perished[c][b][a], that labor pains have seized you like a woman giving birth?
  footnotes:
  - marker: a
    text: Or 'raise a loud shout' / 'cry aloud.' The Hebrew verb can denote a loud outcry or shout; here it likely expresses anguished crying.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'Is there no king in you?'
    reason: lexical_alternative
  - marker: c
    text: Or 'have taken hold of you' or 'have gripped you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 왜 그렇게 크게 부르짖습니까? 당신 안에 왕이 없습니까? 당신의 조언자가 사라졌기에, 해산하는 여인처럼 해산의 고통이 당신을 사로잡았습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָרִיעִי רֵעַ
  english_pob_choice: cry out so loudly
  chosen_korean: 크게 부르짖다
  alternatives_korean:
  - 큰 소리로 외치다
  - 통곡하다
  - 부르짖다
  lexicon: HALOT
  rationale: תָרִיעִי의 강한 외침과 רֵעַ의 강도를 합쳐 한국어에서는 자연스럽게 ‘크게 부르짖다’로 옮기는 것이 음량과 절박함을 함께 살립니다.
- source_word: הֲמֶלֶךְ אֵין בָּךְ
  english_pob_choice: Is there no king in you?
  chosen_korean: 당신 안에 왕이 없습니까?
  alternatives_korean:
  - 당신에게 왕이 없습니까?
  - 당신 가운데 왕이 없습니까?
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현과 여성 단수 مخاطَب의 비유를 살리기 위해 ‘안에’를 유지했습니다.
- source_word: יוֹעֲצֵךְ
  english_pob_choice: your counselor
  chosen_korean: 당신의 조언자
  alternatives_korean:
  - 당신의 상담자
  - 당신의 충고자
  lexicon: HALOT
  rationale: 참조 대상의 기능을 가장 직접적으로 드러내는 말은 ‘조언자’이며, 한국어에서도 왕의 곁에서 판단을 돕는 사람을 자연스럽게 가리킵니다.
- source_word: חִיל כַּיּוֹלֵדָה
  english_pob_choice: that labor pains have seized you like a woman giving birth
  chosen_korean: 해산의 고통이 당신을 해산하는 여자처럼 사로잡다
  alternatives_korean:
  - 진통이 당신을 산모처럼 움켜잡다
  - 산고가 당신을 해산하는 여자처럼 붙들다
  lexicon: HALOT
  rationale: חִיל은 여기서 출산 고통을 뜻하므로 ‘해산의 고통’이 적절하고, הֶחֱזִיקֵךְ는 강하게 사로잡는 의미를 살려 ‘사로잡다’로 옮겼습니다.
theological_decisions:
- issue: 예루살렘/시온의 여성화된 2인칭 خطاب을 본문에서 어떻게 처리할지
  chosen_reading: 본문에는 별도의 해설어를 덧붙이지 않고, 여성 단수 상대를 그대로 살린 질문 형식으로 유지했습니다.
  alternative_readings:
  - ‘딸 시온’을 본문에 명시하기
  - 중성적 집단 호칭으로 바꾸기
  rationale: 이 절 자체가 여성 단수 어미와 해산 비유로 대상의 인격화를 드러내므로, 본문 밖 식별어를 추가하지 않는 편이 원문의 수사 효과를 더 정확히 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
