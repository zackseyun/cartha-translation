  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֨וֹם הַ/ה֜וּא נְאֻם יְהוָ֗ה אֹֽסְפָה֙ הַ/צֹּ֣לֵעָ֔ה וְ/הַ/נִּדָּחָ֖ה אֲקַבֵּ֑צָה וַ/אֲשֶׁ֖ר הֲרֵעֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/006.yaml
  text: In that day[a], declares Yahweh, I will gather the lame, and I will assemble the outcast[c][b], even those whom I have afflicted.
  footnotes:
  - marker: a
    text: Or 'the limping' for 'the lame.' The Hebrew uses a feminine singular participle with collective force.
    reason: lexical_alternative
  - marker: b
    text: Or 'the driven away' or 'the banished' for 'the outcast.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and those whom I have brought to grief.' The Hebrew explicitly attributes the prior affliction to the LORD.
    reason: alternative_reading
translation:
  language: ko
  text: 그 날에 야훼께서 말씀하십니다. 나는 저는 자들을 모으고, 쫓겨난 자들을 모으며, 내가 괴롭게 한 자들까지 모으겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사형은 집합적 의미를 띤 단수 형태이므로, 한국어에서는 복수 표현으로 자연스럽게 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘쫓겨난 자들’은 ‘몰아낸 자들’ 또는 ‘추방된 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘내가 괴롭게 한 자들’은 ‘내가 고통을 준 자들’ 또는 ‘내가 해롭게 한 자들’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: In that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그 때에
  - 그 날
  lexicon: HALOT
  rationale: 예언서의 관용적 시간 표현을 자연스러운 현대 한국어로 옮기되, 종말론적·예언적 울림을 유지하기 위해 간결한 「그 날에」를 택했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼께서 말씀하십니다
  alternatives_korean:
  - 야훼께서 선언하십니다
  - 야훼의 말씀이십니다
  lexicon: HALOT
  rationale: נְאֻם은 예언적 발화 공식을 나타내므로, 현대적이면서도 단정한 직접 발화 형식으로 옮겼습니다. 본문 전통에 따라 하나님의 이름은 ‘야훼’로 유지했습니다.
- source_word: אֹסְפָה
  english_pob_choice: I will gather
  chosen_korean: 나는 저는 자들을 모으고
  alternatives_korean:
  - 나는 모으고
  - 나는 불러 모으고
  lexicon: HALOT
  rationale: אָסַף의 기본 의미를 살리되, 뒤의 ‘쫓겨난 자들’과 대구를 이루게 하려면 대상이 집합적으로 드러나야 하므로 ‘저는 자들’을 명시했습니다.
- source_word: הַצֹּלֵעָה
  english_pob_choice: the lame
  chosen_korean: 저는 자들
  alternatives_korean:
  - 절뚝거리는 자들
  - 절름발이
  lexicon: HALOT
  rationale: 히브리어 분사형이 집합적 힘을 가진다는 점을 반영해, 한국어에서는 자연스럽고 덜 신체적 낙인을 주는 ‘저는 자들’로 옮겼습니다.
- source_word: וְהַנִּדָּחָה
  english_pob_choice: the outcast
  chosen_korean: 쫓겨난 자들
  alternatives_korean:
  - 유배된 자들
  - 버려진 자들
  lexicon: HALOT
  rationale: נדח의 ‘내쫓김/추방됨’을 분명히 드러내는 표현을 택해, 회복의 대상이 되는 배제 상태를 직접적으로 보여 주었습니다.
- source_word: וַאֲשֶׁר הֲרֵעֹתִי
  english_pob_choice: even those whom I have afflicted
  chosen_korean: 내가 괴롭게 한 자들까지
  alternatives_korean:
  - 내가 고통을 준 자들까지
  - 내가 해롭게 한 자들까지
  lexicon: HALOT
  rationale: 히브리어는 여호와 자신이 그들의 고통을 초래하셨다고 말하므로, 그 신학적 긴장을 약화시키지 않으면서도 ‘괴롭게 하다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 하나님의 자기-귀속적 고난 초래 표현
  chosen_reading: ‘내가 괴롭게 한 자들까지’로, 고난의 원인을 하나님께 직접 돌리는 표현을 유지했습니다.
  alternative_readings:
  - 내가 허락해 고난을 당한 자들
  - 내가 해치신 자들
  rationale: 히브리어 힐힐(הֲרֵעֹתִי)의 1인칭 능동형이 지시하는 주체성을 흐리면, 심판과 회복이 나란히 놓이는 본문의 긴장이 약화됩니다. 따라서 완화적 해석을 피했습니다.
  doctrine_reference: Translation philosophy §3
