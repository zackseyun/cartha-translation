  - 그런데 그들은
  lexicon: HALOT
  rationale: 문맥상 앞절과의 대조를 살려 역접을 분명히 드러내는 것이 자연스럽습니다.
- source_word: מַחְשְׁבוֹת
  english_pob_choice: thoughts
