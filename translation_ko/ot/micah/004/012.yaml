  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 여호와 대신 신명기적 고유명사인 ‘야훼’를 사용했습니다.
- source_word: עֲצָתוֹ
  english_pob_choice: his plan
  chosen_korean: 그의 계획
  alternatives_korean:
  - 그의 상담
  - 그의 목적
  lexicon: HALOT
  rationale: 현대 한국어에서 자연스럽고, 앞의 ‘생각들’과 구분되는 하나님의 의도성을 잘 드러냅니다.
- source_word: כִּי קִבְּצָם כֶּעָמִיר גֹּרְנָה
  english_pob_choice: for he has gathered them like sheaves to the threshing floor
  chosen_korean: 이는 그가 그들을 타작마당으로 가는 곡식단처럼 모으셨기 때문입니다
  alternatives_korean:
  - 이는 그가 그들을 곡식단처럼 타작마당으로 모으셨기 때문입니다
  - 그가 그들을 이삭단처럼 타작마당에 모으셨기 때문입니다
  lexicon: HALOT
  rationale: ‘곡식단’은 sheaves의 농경 이미지를 살리고, ‘타작마당으로 가는’으로 목적지 방향성을 반영했습니다.
theological_decisions:
- issue: 야훼의 뜻을 알지 못하는 무지와 심판 이미지
  chosen_reading: 열방은 하나님의 생각과 계획을 이해하지 못하며, 수확된 곡식단처럼 모여 심판의 타작을 향합니다.
  alternative_readings:
  - 단순한 군사적 집결로만 읽기
  - 농경 이미지를 약화시키기
  rationale: 문맥과 영어 POB의 주석이 모두 타작과 심판의 이미지를 가리키므로, 이를 약화하지 않고 드러내는 쪽을 택했습니다.
  doctrine_reference: Micah 4:12의 문맥적 심판 이미지
