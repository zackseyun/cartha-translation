source:
  edition: WLC
  text: וְ/הֵ֗מָּה לֹ֤א יָֽדְעוּ֙ מַחְשְׁב֣וֹת יְהוָ֔ה וְ/לֹ֥א הֵבִ֖ינוּ עֲצָת֑/וֹ כִּ֥י קִבְּצָ֖/ם כֶּ/עָמִ֥יר גֹּֽרְנָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/012.yaml
  text: But they do not know the thoughts of Yahweh[a], and they do not understand his plan[b], for he has gathered them like sheaves to the threshing floor.
  footnotes:
  - marker: a
    text: Or 'his counsel' or 'his purpose.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'like sheaves to the threshing floor,' an image of being gathered for threshing and judgment.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 그들은 야훼의 생각을 알지 못하고, 그의 계획을 깨닫지 못합니다. 이는 그가 그들을 곡식단처럼 타작마당으로 모으셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘타작마당’은 수확한 곡식을 두드려 낟알과 겨를 가르는 장소를 가리킵니다. 여기서 곡식단을 타작마당으로 모으는 모습은 심판의 비유입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵמָּה
  english_pob_choice: But they
  chosen_korean: 그러나 그들은
  alternatives_korean:
