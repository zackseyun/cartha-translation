source:
  edition: WLC
  text: וְ/הֵ֗מָּה לֹ֤א יָֽדְעוּ֙ מַחְשְׁב֣וֹת יְהוָ֔ה וְ/לֹ֥א הֵבִ֖ינוּ עֲצָת֑/וֹ כִּ֥י קִבְּצָ֖/ם כֶּ/עָמִ֥יר גֹּֽרְנָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/012.yaml
  text: But they do not know the thoughts of Yahweh[a], and they do not understand his plan[b], for he has gathered them like sheaves to the threshing floor.
  footnotes:
  - marker: a
    text: Or 'his counsel' or 'his purpose.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'like sheaves to the threshing floor,' an image of being gathered for threshing and judgment.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 그들은 야훼의 생각들을 알지 못하고, 그의 계획을 이해하지 못합니다. 이는 그가 그들을 타작마당으로 가는 곡식단처럼 모으셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘타작마당’은 수확한 곡식을 두드려 낟알과 겨를 가르는 장소를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵמָּה
  english_pob_choice: But they
  chosen_korean: 그러나 그들은
  alternatives_korean:
  - 그리고 그들은
  - 그런데 그들은
  lexicon: HALOT
  rationale: 문맥상 앞절과의 대조를 살려 역접을 분명히 드러내는 것이 자연스럽습니다.
- source_word: מַחְשְׁבוֹת
  english_pob_choice: thoughts
  chosen_korean: 생각들
  alternatives_korean:
  - 계획들
  - 의도들
  lexicon: HALOT
  rationale: עֲצָה와 구별되는 어휘 뉘앙스를 살려, 보다 직접적인 ‘생각들’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 여호와 대신 신명기적 고유명사인 ‘야훼’를 사용했습니다.
- source_word: עֲצָתוֹ
  english_pob_choice: his plan
  chosen_korean: 그의 계획
  alternatives_korean:
  - 그의 상담
  - 그의 목적
  lexicon: HALOT
  rationale: 현대 한국어에서 자연스럽고, 앞의 ‘생각들’과 구분되는 하나님의 의도성을 잘 드러냅니다.
- source_word: כִּי קִבְּצָם כֶּעָמִיר גֹּרְנָה
  english_pob_choice: for he has gathered them like sheaves to the threshing floor
  chosen_korean: 이는 그가 그들을 타작마당으로 가는 곡식단처럼 모으셨기 때문입니다
  alternatives_korean:
  - 이는 그가 그들을 곡식단처럼 타작마당으로 모으셨기 때문입니다
  - 그가 그들을 이삭단처럼 타작마당에 모으셨기 때문입니다
  lexicon: HALOT
  rationale: ‘곡식단’은 sheaves의 농경 이미지를 살리고, ‘타작마당으로 가는’으로 목적지 방향성을 반영했습니다.
theological_decisions:
- issue: 야훼의 뜻을 알지 못하는 무지와 심판 이미지
  chosen_reading: 열방은 하나님의 생각과 계획을 이해하지 못하며, 수확된 곡식단처럼 모여 심판의 타작을 향합니다.
  alternative_readings:
  - 단순한 군사적 집결로만 읽기
  - 농경 이미지를 약화시키기
  rationale: 문맥과 영어 POB의 주석이 모두 타작과 심판의 이미지를 가리키므로, 이를 약화하지 않고 드러내는 쪽을 택했습니다.
  doctrine_reference: Micah 4:12의 문맥적 심판 이미지
