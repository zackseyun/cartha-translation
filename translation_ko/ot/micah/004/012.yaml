revisions:
- from: 그러나 그들은 야훼의 생각들을 알지 못하고, 그의 계획을 이해하지 못합니다. 이는 그가 그들을 타작마당으로 가는 곡식단처럼 모으셨기 때문입니다.[a]
  to: 그러나 그들은 야훼의 생각을 알지 못하고, 그의 계획을 깨닫지 못합니다. 이는 그가 그들을 곡식단처럼 타작마당으로 모으셨기 때문입니다.[a]
  rationale: 문장의 방향 표현을 ‘그들을 곡식단처럼 타작마당으로 모으셨다’로 바로잡아 히브리어 비유의 문법 관계와 심판의 농경 이미지를 보존했습니다. 또한 현대 표준 한국어에 맞게 ‘생각들을’을 ‘생각을’로 다듬고, 두 동사의 의미상 차이를 유지했습니다.
