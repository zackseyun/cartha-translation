language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ח֧וּלִי וָ/גֹ֛חִי בַּת צִיּ֖וֹן כַּ/יּֽוֹלֵדָ֑ה כִּֽי עַתָּה֩ תֵצְאִ֨י מִ/קִּרְיָ֜ה וְ/שָׁכַ֣נְתְּ בַּ/שָּׂדֶ֗ה וּ/בָ֤את עַד בָּבֶל֙ שָׁ֣ם תִּנָּצֵ֔לִי שָׁ֚ם יִגְאָלֵ֣/ךְ יְהוָ֔ה מִ/כַּ֖ף אֹיְבָֽיִ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/010.yaml
  text: Writhe and groan[a], daughter Zion, like a woman giving birth; for now you will go out from the city and dwell in the field, and you will go as far as Babylon. There you will be rescued[b]; there Yahweh will redeem you from the hand of your enemies.
  footnotes:
  - marker: a
    text: Or 'cry out' for 'groan.' The Hebrew verb can denote a cry of pain, fitting the childbirth image.
    reason: lexical_alternative
  - marker: b
    text: Or 'There you will be delivered.'
    reason: lexical_alternative
translation:
  language: ko
  text: 딸 시온아, 해산하는 여자처럼 몸부림치며 신음하십시오. 이제 너는 성읍에서 나가 들판에 머물 것이며, 바빌론까지 이르게 될 것입니다. 거기서 너는 구출될 것이며, 거기서 야훼께서 너의 원수들의 손에서 너를 속량하실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신음하십시오’는 이 동사의 고통스러운 외침/신음 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구출될 것입니다’는 ‘거기서 너는 전달될 것이다/건져질 것이다’의 뜻을 따른 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ח֧וּלִי וָ/גֹ֛חִי
  english_pob_choice: Writhe and groan
  chosen_korean: 몸부림치며 신음하십시오
  alternatives_korean:
  - 몸부림치며 부르짖으십시오
  - 해산의 고통으로 몸부림치며 울부짖으십시오
  lexicon: HALOT
  rationale: 두 명령형을 함께 살려 출산 고통의 격렬한 신체적 반응과 통증의 소리를 모두 드러내도록 했습니다.
- source_word: בַּת צִיּוֹן
  english_pob_choice: daughter Zion
  chosen_korean: 딸 시온
  alternatives_korean:
  - 시온의 딸
  - 딸 시온아
  lexicon: HALOT
  rationale: 예언적 호칭의 압축된 인칭화 표현을 살리기 위해 ‘딸 시온’을 직설적으로 옮겼습니다.
- source_word: וְ/שָׁכַ֣נְתְּ בַּ/שָּׂדֶ֗ה
  english_pob_choice: and dwell in the field
  chosen_korean: 들판에 머물 것이며
  alternatives_korean:
  - 들에 거할 것이며
  - 들판에 살 것이며
  lexicon: HALOT
  rationale: שׁכן의 지속적 거주/체류 의미를 살리면서, 보호받지 못한 야외 상태를 ‘들판’으로 자연스럽게 전달했습니다.
- source_word: שָׁ֣ם תִּנָּצֵ֔לִי
  english_pob_choice: There you will be rescued
  chosen_korean: 거기서 너는 구출될 것이며
  alternatives_korean:
  - 거기서 너는 구원받을 것이며
  - 거기서 너는 건져질 것이며
  lexicon: HALOT
  rationale: נצל의 수동적 구출 의미를 한국어에서 가장 직접적으로 드러내기 위해 ‘구출되다’를 선택했습니다.
- source_word: יִגְאָלֵ֣ךְ
  english_pob_choice: will redeem you
  chosen_korean: 속량하실 것입니다
  alternatives_korean:
  - 구속하실 것입니다
  - 되찾으실 것입니다
  lexicon: HALOT
  rationale: גאל의 언약적·친족적 회복 의미를 보존하기 위해 교회 전통어 ‘속량하다’를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: יהוה의 고유 이름을 보존하는 본 프로젝트 기본값을 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 구출(נצל)과 속량(גאל)의 구별
  chosen_reading: ‘구출될 것이며’와 ‘속량하실 것입니다’를 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘구원받을 것이다’로 통일
  - 둘 다 ‘건져질 것이다’로 통일
  rationale: 두 동사가 나란히 있으므로 같은 한국어로 평준화하면 원문의 중첩된 구원 어휘와 뉘앙스 차이가 사라집니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5 (consistency of key terms, or documented exception)
- issue: יהוה의 표기
  chosen_reading: 본문에는 ‘야훼’를 사용했습니다.
  alternative_readings:
  - the LORD에 해당하는 ‘주’
  - 여호와
  rationale: 본문의 신명(神名)을 호칭어로 대체하지 않고 고유명으로 유지해 언약적 인격성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
