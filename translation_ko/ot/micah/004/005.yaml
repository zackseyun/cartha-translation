source:
  edition: WLC
  text: כִּ֚י כָּל הָ֣/עַמִּ֔ים יֵלְכ֕וּ אִ֖ישׁ בְּ/שֵׁ֣ם אֱלֹהָ֑י/ו וַ/אֲנַ֗חְנוּ נֵלֵ֛ךְ בְּ/שֵׁם יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/עוֹלָ֥ם וָ/עֶֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/005.yaml
  text: For all the peoples walk[a], each in the name of his god[c][b], but we will walk in the name of Yahweh our God forever and ever.
  footnotes:
  - marker: a
    text: Or 'all the nations.' The Hebrew עַמִּים can denote peoples or nations; 'peoples' was chosen to preserve the plural ethnic-group sense.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each man in the name of his god.' The translation uses 'each' because אִישׁ functions distributively here with 'all the peoples.'
    reason: lexical_alternative
  - marker: c
    text: '''The LORD'' renders the divine name YHWH. Alternative English forms include ''Yahweh'' and ''Jehovah.'''
    reason: alternative_reading
translation:
  language: ko
  text: 이는 모든 민족이 저마다 자기 신의 이름으로 걸어가겠지만, 우리는 영원토록 야훼 우리 하나님의 이름으로 걸어가겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 민족’은 히브리어 עַמִּים의 복수 집단성을 살린 번역입니다.
    reason: source_note
  - marker: b
    text: ‘자기 신’은 히브리어의 ‘각 사람’(אִישׁ)과 3인칭 단수 소유격을 반영한 분배적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘야훼’는 히브리어 신명 יְהוָה를 옮긴 형태입니다.
    reason: ot_citation
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - for
  lexicon: HALOT
  rationale: 앞 절의 내용을 받는 설명적·근거 제시 기능을 자연스러운 한국어로 살려 ‘이는’으로 옮겼습니다.
- source_word: כָּל הָעַמִּים
  english_pob_choice: all the peoples
  chosen_korean: 모든 민족
  alternatives_korean:
  - 모든 백성들
  - 모든 나라들
  lexicon: HALOT
  rationale: עַמִּים의 복수 집단성을 살리면서도 한국어에서 자연스럽고 문맥상 이스라엘과 대비되는 집단을 드러내기 위해 ‘모든 민족’을 택했습니다.
- source_word: יֵלְכוּ / נֵלֵךְ
  english_pob_choice: walk / will walk
  chosen_korean: 걸어가겠지만 / 걸어가겠습니다
  alternatives_korean:
  - 행하겠지만 / 행하겠습니다
  - 살겠지만 / 살겠습니다
  lexicon: HALOT
  rationale: בְּשֵׁם과 결합한 הָלַךְ의 관용적 의미인 삶의 방식과 충성을 살리기 위해 ‘걸어가다’를 유지했습니다.
- source_word: בְּשֵׁם
  english_pob_choice: in the name of
  chosen_korean: 이름으로
  alternatives_korean:
  - 이름 안에서
  - 이름 아래서
  lexicon: HALOT
  rationale: 명칭 자체보다 소속·충성·권위의 의미를 전하는 관용구로서, 반복 평행을 유지하는 가장 직접적인 한국어 표현을 사용했습니다.
- source_word: אֱלֹהָיו / יְהוָה אֱלֹהֵינוּ
  english_pob_choice: his god / Yahweh our God
  chosen_korean: 자기 신 / 야훼 우리 하나님
  alternatives_korean:
  - 그의 신 / 주 우리 하나님
  - 자기 하나님 / 여호와 우리 하나님
  lexicon: HALOT
  rationale: 첫 절은 각 민족의 고유한 신을 가리키므로 ‘자기 신’으로, 대조되는 후반부는 본문의 신명인 יְהוָה를 ‘야훼’로 옮겨 대비를 분명히 했습니다.
- source_word: לְעוֹלָם וָעֶד
  english_pob_choice: forever and ever
  chosen_korean: 영원토록
  alternatives_korean:
  - 영원히 영원히
  - 세세토록
  lexicon: HALOT
  rationale: 중첩된 영속성을 한국어 관용으로 간결하게 살리면서도, 뒤의 ‘영원토록’에 이미 충분한 강조가 있어 중복을 피했습니다.
theological_decisions:
- issue: YHWH의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 신명기적 고유명사 יְהוָה를 직접 사용하므로, 제목화된 대체어보다 고유명사성을 보존하는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 민족들의 우상 숭배와 여호와 신앙의 대조
  chosen_reading: 모든 민족은 저마다 자기 신의 이름으로 걸어가겠지만, 우리는 … 야훼 우리 하나님의 이름으로 걸어가겠습니다
  alternative_readings:
  - 모든 민족은 저마다 자기 신을 따르겠지만, 우리는 …
  - 모든 민족은 저마다 자기 신의 이름으로 행하겠지만, 우리는 …
  rationale: 히브리어의 대비 구조를 약화시키지 않기 위해 일반적 ‘따르다’보다 반복되는 ‘걸어가다’를 유지하여, 생활 전체의 충성과 예배 방향을 드러냈습니다.
  doctrine_reference: Micah 4:5의 평행법과 언약적 충성 표현
