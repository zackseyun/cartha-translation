id: MIC.4.4
reference: Micah 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָשְׁב֗וּ אִ֣ישׁ תַּ֧חַת גַּפְנ֛/וֹ וְ/תַ֥חַת תְּאֵנָת֖/וֹ וְ/אֵ֣ין מַחֲרִ֑יד כִּי פִ֛י יְהוָ֥ה צְבָא֖וֹת דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/004.yaml
  text: And each will sit under his vine and under his fig tree[a], and there will be no one to make them afraid[b], for the mouth of Yahweh of Armies has spoken.
  footnotes:
  - marker: a
    text: Or, 'each one will sit under his vine and under his fig tree.' The Hebrew has 'each man,' a masculine singular form used distributively.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional rendering: ''the LORD of hosts.'''
    reason: alternative_reading
translation:
  language: ko
  text: 각 사람이 자기 포도나무 아래와 자기 무화과나무 아래에 앉을 것이며, 그들을 두렵게 하는 이가 없을 것입니다. 이는 만군의 야훼의 입이 말씀하셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 분배적 용법의 단수형 ‘각 사람’을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: '전통 번역: ‘만군의 여호와’.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשְׁבוּ
  english_pob_choice: And each will sit
  chosen_korean: 각 사람이 … 앉을 것이며
  alternatives_korean:
  - 각 사람이 … 거할 것이며
  - 각 사람이 … 살 것이며
  lexicon: HALOT
  rationale: ישב의 기본 뜻인 ‘앉다’를 살리되, 예언적 평화의 정착 이미지를 한국어에서 자연스럽게 유지했습니다.
- source_word: אִישׁ
  english_pob_choice: each man / each
  chosen_korean: 각 사람이
  alternatives_korean:
  - 각 남자가
  - 사람마다
  lexicon: HALOT
  rationale: 히브리어 단수형 이시의 분배적 용법을 한국어에서는 ‘각 사람’으로 자연스럽게 옮겨, 영어 역본의 성별 강조를 불필요하게 전면화하지 않으면서도 분배 의미를 보존했습니다.
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  english_pob_choice: under his vine and under his fig tree
  chosen_korean: 자기 포도나무 아래와 자기 무화과나무 아래
  alternatives_korean:
  - 자기 포도나무 아래와 자기 무화과나무 아래에
  - 자기 포도나무와 무화과나무 아래
  lexicon: HALOT
  rationale: ‘포도나무/무화과나무 아래’는 평안과 안전의 관용적 이미지이므로 직역 구조를 유지해 상징성을 보존했습니다.
- source_word: וְאֵין מַחֲרִיד
  english_pob_choice: and there will be no one to make them afraid
  chosen_korean: 그들을 두렵게 하는 이가 없을 것입니다
  alternatives_korean:
  - 그들을 무서워하게 하는 이가 없을 것입니다
  - 그들을 놀라게 하는 이가 없을 것입니다
  lexicon: HALOT
  rationale: מחריד의 ‘떨게 하다/두렵게 하다’라는 능동적 원인을 분명히 드러내면서, 한국어에서 자연스러운 부정 구문으로 옮겼습니다.
- source_word: פִּי יְהוָה צְבָאוֹת
  english_pob_choice: the mouth of Yahweh of Armies
  chosen_korean: 만군의 야훼의 입이
  alternatives_korean:
  - 만군의 야훼의 말씀하심이
  - 야훼 만군의 입이
  lexicon: HALOT
  rationale: ‘입’이라는 히브리어 표현을 살려 하나님의 선언의 확실성을 유지했고, יְהוָה는 이 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: דִּבֵּר
  english_pob_choice: has spoken
  chosen_korean: 말씀하셨기 때문입니다
  alternatives_korean:
  - 말씀하셨습니다
  - 말하셨기 때문입니다
  lexicon: HALOT
  rationale: 완료 동사의 확정성을 살리면서, 예언 선언문에 어울리는 종결형으로 다듬었습니다.
theological_decisions:
- issue: יהוה / YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 YHWH를 사용하므로, 프로젝트 기본값에 따라 언약적 신명인 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה / YHWH → 야훼'
- issue: ‘만군’ 표현의 처리
  chosen_reading: 만군의 야훼
  alternative_readings:
  - 야훼 만군의
  - 만군의 주님
  rationale: צְבָאוֹת의 군사적·우주적 위상을 살리기 위해 전통적 ‘만군’ 표현을 유지하고, 신명은 별도로 드러냈습니다.
  doctrine_reference: 'POB glossary: צְבָאוֹת → Armies / 만군'
