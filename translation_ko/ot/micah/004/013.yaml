id: MIC.4.13
reference: Micah 4:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֧וּמִי וָ/ד֣וֹשִׁי בַת צִיּ֗וֹן כִּֽי קַרְנֵ֞/ךְ אָשִׂ֤ים בַּרְזֶל֙ וּ/פַרְסֹתַ֨יִ/ךְ֙ אָשִׂ֣ים נְחוּשָׁ֔ה וַ/הֲדִקּ֖וֹת עַמִּ֣ים רַבִּ֑ים וְ/הַחֲרַמְתִּ֤י לַֽ/יהוָה֙ בִּצְעָ֔/ם וְ/חֵילָ֖/ם לַ/אֲד֥וֹן כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/013.yaml
  text: Rise and thresh[a], daughter Zion, for I will make your horn iron, and I will make your hooves bronze; you will crush many peoples, and I will devote their gain to Yahweh[b], and their wealth to the Lord of all the earth.
  footnotes:
  - marker: a
    text: Or 'put under the ban'; the Hebrew verb can denote devoting something to God, often with the sense of being placed under a ban for destruction.
    reason: lexical_alternative
  - marker: b
    text: Or 'their gain' or 'their plunder'; the Hebrew term often carries the sense of profit gained by greed or injustice.
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나서 타작하라, 딸 시온이여. 내가 네 뿔을 쇠로, 네 굽들을 놋으로 만들겠고, 네가 많은 민족들을 부수리라. 나는 그들의 이익을 야훼께, 그들의 재물을 온 땅의 주께 바치겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘금령 아래 두다’라는 뜻일 수 있습니다. 히브리어 동사는 무엇인가를 하나님께 바치되, 종종 멸절을 수반하는 금령의 의미를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 이익’ 또는 ‘그들의 전리품’일 수 있습니다. 히브리어는 탐욕이나 불의로 얻은 이익의 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֧וּמִי וָדֹשִׁי
  english_pob_choice: Rise and thresh
  chosen_korean: 일어나서 타작하라
  alternatives_korean:
  - 일어나서 밟아라
  - 일어나서 짓밟아라
  lexicon: HALOT
  rationale: קוּם의 명령은 단순한 기상보다 행동 개시를, דושׁ은 곡식을 밟아 타작하는 농경 이미지를 가리키므로, 두 동사를 함께 살린 ‘일어나서 타작하라’가 비유를 가장 직접적으로 보존합니다.
- source_word: בַת צִיּוֹן
  english_pob_choice: daughter Zion
  chosen_korean: 딸 시온이여
  alternatives_korean:
  - 시온의 딸이여
  - 딸 시온아
  lexicon: HALOT
  rationale: 예언서의 인격화된 호칭과 직접 부름을 살리기 위해 ‘딸 시온이여’로 옮겼습니다.
- source_word: קַרְנֵךְ ... פַרְסֹתַיִךְ
  english_pob_choice: your horn ... your hooves
  chosen_korean: 네 뿔을 쇠로, 네 굽들을 놋으로
  alternatives_korean:
  - 네 뿔을 철로, 네 발굽들을 구리로
  - 네 뿔을 철로, 네 굽들을 청동으로
  lexicon: HALOT
  rationale: 힘과 파괴력을 상징하는 ‘뿔’과 ‘굽’의 은유를 그대로 두고, לב־전투적 이미지에 맞는 ‘쇠/놋’ 계열로 옮겼습니다. ‘놋’은 고전적이지만 현대어에서도 청동/청동합금의 이미지를 전달할 수 있습니다.
- source_word: בִּצְעָם
  english_pob_choice: their gain
  chosen_korean: 그들의 이익
  alternatives_korean:
  - 그들의 벌이
  - 그들의 이득
  - 그들의 재물
  lexicon: HALOT
  rationale: בצע는 중립적 ‘이익’보다 탐욕스러운 이익을 암시할 수 있지만, 본문 자체는 그 수식어를 붙이지 않으므로 한국어도 과도하게 도덕화를 덧붙이지 않도록 ‘이익’으로 두었습니다.
- source_word: לַאֲדוֹן כָּל הָאָרֶץ
  english_pob_choice: to the Lord of all the earth
  chosen_korean: 온 땅의 주께
  alternatives_korean:
  - 온 땅의 주님께
  - 온 땅의 주인께
  lexicon: HALOT
  rationale: אדון은 신적 칭호로 ‘주’가 가장 자연스럽고, ‘온 땅의’는 सार्व적 통치를 분명히 하므로 합쳐서 ‘온 땅의 주께’로 옮겼습니다.
theological_decisions:
- issue: חרם 동사의 처리
  chosen_reading: ‘바치겠습니다’로 옮겨, 전리품/이익을 하나님께 전적으로 돌리는 헌납의 뜻을 살렸습니다.
  alternative_readings:
  - ‘진멸하겠습니다’
  - ‘바친 것으로 삼겠습니다’
  - ‘금령 아래 두겠습니다’
  rationale: 본문의 목적어는 민족 자체가 아니라 ‘그들의 이익/재물’이므로, 대상을 파괴하는 의미로 과장하지 않고 ‘헌납’의 방향을 살리는 번역이 문법과 신학 양쪽에 가장 적합합니다.
  doctrine_reference: Translation philosophy §3, §5
