revisions:
- from: 일어나서 타작하라, 딸 시온이여. 내가 네 뿔을 쇠로, 네 굽들을 놋으로 만들겠고, 네가 많은 민족들을 부수리라. 나는 그들의 이익을 야훼께, 그들의 재물을 온 땅의 주께 바치겠습니다.[a][b]
  to: 시온의 딸아, 일어나 타작하십시오. 내가 네 뿔을 철로, 네 발굽을 청동으로 만들겠습니다. 네가 많은 민족들을 부술 것입니다. 나는 그들의 이익[b]을 야훼께 바치겠습니다[a]. 그들의 재물도 온 땅의 주께 바치겠습니다.
  rationale: 명령과 하나님의 미래 선언을 현대 합쇼체로 통일했습니다. 뿔과 발굽 및 타작의 은유는 직역적으로 유지하되, ‘철’, ‘청동’, ‘발굽’을 사용하여 현대어의 명료성을 높였습니다. ‘이익’에는 원문이 지닌 부정적 뉘앙스를 본문에 단정적으로 추가하지 않고 각주에만 남겼습니다. חרם 관련 각주는 ‘바치겠습니다’에, 이익 관련 각주는 ‘이익’에 각각 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:43:13Z'
