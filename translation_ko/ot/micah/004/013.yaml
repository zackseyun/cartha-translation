  source_fidelity: 본문의 핵심 은유와 어휘 선택은 대체로 충실합니다. 그러나 하나님의 발화가 앞부분에서는 비격식체(‘만들겠고’, ‘부수리라’)이고 끝에서는 합쇼체(‘바치겠습니다’)로 섞여 있어, 지정된 현대 합쇼체 문체에 맞추어 통일해야 합니다. 또한 חרם의 각주와 בצע의 각주가 본문 끝에 함께 달려 있어 각각의 해당 어휘를 가리키지 못합니다.
  naturalness: ‘딸 시온이여’와 ‘쇠/놋’은 이해 가능하나, 현대 표준어의 공식 문체에서는 ‘시온의 딸아’, ‘철’, ‘청동’, ‘발굽’이 더 자연스럽고 명료합니다. ‘일어나서 타작하라’도 명령의 뜻은 보존하지만, 합쇼체에는 ‘일어나 타작하십시오’가 적합합니다.
  terminology: ‘야훼’, ‘온 땅의 주’, ‘뿔’, ‘발굽’은 원문의 신명과 은유를 잘 보존합니다. נְחוּשָׁה는 이 문맥에서 ‘청동’이 가장 적절합니다. חרם은 본문에서 ‘바치겠습니다’로 두되, 멸절을 수반할 수 있는 봉헌/금령의 의미는 해당 동사에 연결한 각주로 남기는 것이 안전합니다.
  issues:
  - severity: medium
