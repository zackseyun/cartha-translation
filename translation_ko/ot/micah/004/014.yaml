  naturalness: 초안의 합쇼체 명령은 '모아라'로 되어 있어 지정된 현대 격식체와 일치하지 않습니다. '포위가 닥쳤습니다'와 '막대기로 … 뺨을 칩니다'는 현대 표준어에서 자연스럽고 문맥에 맞습니다. '군대의 딸아'는 히브리어의 시적 의인화를 보존하는 표현입니다.
  terminology: תִּתְגֹּדְדִי는 군사 문맥상 '무리를 지어 모이다'로 옮기되 자해/자상 의미는 각주로 남깁니다. שֵׁבֶט은 타격 도구라는 문맥에 맞추어 '막대기'로, שֹׁפֵט יִשְׂרָאֵל은 특정 신학적 동일시 없이 '이스라엘의 재판관'으로 유지합니다.
