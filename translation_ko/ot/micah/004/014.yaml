  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַתָּה֙ תִּתְגֹּדְדִ֣י בַת גְּד֔וּד מָצ֖וֹר שָׂ֣ם עָלֵ֑י/נוּ בַּ/שֵּׁ֨בֶט֙ יַכּ֣וּ עַֽל הַ/לְּחִ֔י אֵ֖ת שֹׁפֵ֥ט יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/014.yaml
  text: Now muster yourself in troops[a], daughter of troops; a siege is set against us[c][b]. With a rod they strike the judge of Israel on the cheek.
  footnotes:
  - marker: a
    text: Or 'gash yourself' or 'cut yourself,' if the verb is taken in the sense of self-laceration rather than mustering troops.
    reason: lexical_alternative
  - marker: b
    text: Or 'they will strike'; the Hebrew imperfect may be read with future force in prophetic context.
    reason: lexical_alternative
  - marker: c
    text: '''Judge of Israel'' may refer generally to Israel''s ruler or leader; some interpreters also see a messianic foreshadowing in context.'
    reason: alternative_reading
translation:
  language: ko
  text: 이제 네가 무리들을 모아라[a], 무리들의 딸아. 우리를 치는 포위가 놓였습니다[b]. 그들은 지팡이로 이스라엘의 재판관의 뺨을 칩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '네 몸을 찢어라' 혹은 '네 몸을 베어라'로도 옮길 수 있습니다. 동사 어형은 자해의 의미로도 읽힙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그들이 칠 것이다'로도 읽을 수 있습니다. 예언적 문맥에서는 히브리어 미완료형이 미래 의미를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְגֹּדְדִי
  english_pob_choice: muster yourself in troops
  chosen_korean: 무리들을 모아라
  alternatives_korean:
  - 스스로를 찢어라
  - 무리로 모여라
  - 군대로 집결하라
  lexicon: HALOT
  rationale: 히트폴렐 어형은 자해와 집결의 양쪽 가능성이 있으나, 여기서는 곧바로 전개되는 군사·포위 문맥에 따라 집결/동원 의미를 살려야 하므로, 자해적 뉘앙스는 각주로 보존하고 본문은 군사적 동원으로 옮겼습니다.
- source_word: בַת גְּדוּד
  english_pob_choice: daughter of troops
  chosen_korean: 무리들의 딸
  alternatives_korean:
  - 한 무리의 딸
  - 부대의 딸
  - 군대의 딸
  lexicon: HALOT
  rationale: 히브리어의 '딸 + 명사' 구조는 도시나 공동체를 의인화하는 표현이므로 이를 유지했습니다. גְּדוּד는 군사적 무리/부대를 가리키므로 '무리들'로 옮겨 포위 문맥과 맞췄습니다.
- source_word: מָצוֹר שָׂם עָלֵי/נוּ
  english_pob_choice: a siege is set against us
  chosen_korean: 우리를 치는 포위가 놓였습니다
  alternatives_korean:
  - 포위가 우리에게 놓였습니다
  - 포위가 우리를 향해 설치되었습니다
  - 포위가 우리에게 세워졌습니다
  lexicon: HALOT
  rationale: מָצוֹר는 구체적 공성 장비보다 포위 상태 자체를 가리키므로 '포위'로 자연스럽게 옮겼습니다. 주어가 불특정한 히브리어를 한국어 수동형으로 처리해 본문의 초점을 유지했습니다.
- source_word: בַּשֵּׁבֶט
  english_pob_choice: with a rod
  chosen_korean: 지팡이로
  alternatives_korean:
  - 막대기로
  - 막대로
  - 홀로
  lexicon: HALOT
  rationale: שֵׁבֶט은 지팡이, 막대, 홀까지 가능하지만, 여기서는 타격 도구로서의 구체성이 가장 자연스럽습니다. 왕권적 상징을 앞세우는 '홀'보다 물리적 구타를 드러내는 '지팡이'가 문맥에 더 가깝습니다.
- source_word: שֹׁפֵט יִשְׂרָאֵל
  english_pob_choice: the judge of Israel
  chosen_korean: 이스라엘의 재판관
  alternatives_korean:
  - 이스라엘의 통치자
  - 이스라엘의 지도자
  - 이스라엘의 심판관
  lexicon: HALOT
  rationale: שֹׁפֵט은 직역하면 '재판관/판관'이지만, 문맥상 통치자까지 포함할 수 있어도 본문은 이를 해석하지 않고 가능한 한 가까이 유지했습니다. 한국어에서 '재판관'이 가장 직접적이며, POB의 비해석적 선택을 반영합니다.
theological_decisions:
- issue: '''the judge of Israel''의 해석 가능성'
  chosen_reading: 본문에서는 메시아적 동일시를 하지 않고, 단지 '이스라엘의 재판관'으로 남겼습니다.
  alternative_readings:
  - 이스라엘의 왕이나 통치자
  - 메시아를 예표하는 통치자
  rationale: 바로 앞뒤 문맥은 포위와 수치의 장면을 묘사하며, 이 절 자체는 그 인물을 명시적으로 메시아라고 밝히지 않습니다. 신학적 긴장을 유지하기 위해 본문 번역은 해석을 덧붙이지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
