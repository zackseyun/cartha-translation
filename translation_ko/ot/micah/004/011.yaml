  source_fidelity: 핵심 의미는 대체로 충실합니다. נֶאֶסְפוּ עָלַיִךְ는 ‘당신을 대적하여 모여들었습니다’로, תֶּחֱנָף는 ‘더럽혀지게 하자’로, עֵינֵינוּ를 포함한 관용구는 ‘우리 눈으로 시온을 바라보자’로 옮기는 것이 원문의 적대적 발화와 어순상의 강조를 잘 보존합니다. 다만 인용문에서 ‘그녀’는 한국어에서 선행 지시 대상이 충분히 확정되지 않아, 원문이 가리키는 시온을 직접 밝혀야 합니다.
  naturalness: ‘그들은 말합니다’ 다음을 마침표로 분리하는 것보다 ‘말하며’ 또는 쉼표로 인용문을 잇는 편이 자연스럽습니다. 또한 ‘우리의 눈이 시온을 보게 하자’는 한국어에서 다소 부자연스러운 사역 표현이므로 ‘우리 눈으로 시온을 바라보자’가 현대 표준어 문체에 더 자연스럽습니다.
  terminology: ‘시온’과 ‘많은 나라’는 적절합니다. ‘더럽혀지게’는 의례적·도덕적 오염 및 모독의 폭을 지나치게 한정하지 않는 번역입니다. 각주 표지는 해당 어휘에 정확히 붙여야 합니다.
