id: MIC.4.11
reference: Micah 4:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֛ה נֶאֶסְפ֥וּ עָלַ֖יִ/ךְ גּוֹיִ֣ם רַבִּ֑ים הָ/אֹמְרִ֣ים תֶּחֱנָ֔ף וְ/תַ֥חַז בְּ/צִיּ֖וֹן עֵינֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/011.yaml
  text: And now many nations have gathered against you[a], saying, “Let her be defiled[b], and let our eyes look on Zion.”
  footnotes:
  - marker: a
    text: Or 'Let her be polluted' or 'May she be profaned.' The Hebrew verb can denote becoming morally or ritually defiled.
    reason: lexical_alternative
  - marker: b
    text: Or 'let our eyes look on Zion' / 'may our eyes see Zion.' The expression conveys the nations' hostile desire to watch Zion's humiliation.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 많은 나라가 당신을 대적하여 모여들었습니다. 그들은 말합니다. “그녀가 더럽혀지게 하자[b]. 그리고 우리의 눈이 시온을 보게 하자.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘시온을 보게 하자’ / ‘시온을 바라보게 하자’. 이 표현은 나라들이 시온의 수치를 지켜보려는 적대적 욕망을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 문맥 전환을 여는 부사로서 한국어에서는 간결한 ‘이제’가 자연스럽고, 원문의 시간·담화 전환을 충분히 드러냅니다.
- source_word: נֶאֶסְפוּ עָלַיִךְ גּוֹיִם רַבִּים
  english_pob_choice: many nations have gathered against you
  chosen_korean: 많은 나라가 당신을 대적하여 모여들었습니다
  alternatives_korean:
  - 많은 나라가 당신에게 모여들었습니다
  - 많은 민족이 당신을 향하여 모여들었습니다
  lexicon: HALOT
  rationale: עָלַיִךְ의 적대적 방향성을 ‘대적하여’로 살렸고, גּוֹיִם רַבִּים는 여기서 정치적·집단적 주체를 가리키므로 ‘많은 나라’가 자연스럽습니다.
- source_word: תֶּחֱנָף
  english_pob_choice: Let her be defiled
  chosen_korean: 그녀가 더럽혀지게 하자
  alternatives_korean:
  - 그녀가 부정해지게 하자
  - 그녀가 더럽혀지게 하자
  lexicon: HALOT
  rationale: 이 동사는 의례적·도덕적 오염을 모두 포함할 수 있어, 한국어에서는 의미를 과도하게 좁히지 않는 ‘더럽혀지다’가 가장 무난합니다.
- source_word: וְתַחַז בְּצִיּוֹן עֵינֵינוּ
  english_pob_choice: and let our eyes look on Zion
  chosen_korean: 그리고 우리의 눈이 시온을 보게 하자
  alternatives_korean:
  - 그리고 우리의 눈이 시온을 바라보게 하자
  - 그리고 우리의 눈이 시온을 보게 하자
  lexicon: HALOT
  rationale: 직역상 ‘보게 하자’가 가장 직접적이며, 원문의 적대적 응시·조롱의 뉘앙스는 문맥 전체가 전달하므로 별도의 의역을 과하지 않았습니다.
theological_decisions:
- issue: 히브리어 여성 단수 동사의 지시 대상과 한국어 대명사 처리
  chosen_reading: 인용문 안에서는 시온을 가리키는 여성형을 반영해 ‘그녀’로 옮겼습니다.
  alternative_readings:
  - 인용문 안에서도 계속 ‘당신’으로 통일
  - 중립적으로 ‘그것’으로 처리
  rationale: 본문 서술의 ‘당신’과 달리, 인용된 적대 발화는 시온을 여성 단수로 지시하므로 이를 평준화하지 않고 드러내는 편이 원문 구조를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘보게 하자’의 적대적 의도 표현
  chosen_reading: 시온을 ‘보게 하자’로 옮겨, 조롱 섞인 관찰 의도를 유지했습니다.
  alternative_readings:
  - ‘바라보게 하자’로 더 시각적 뉘앙스 강조
  - ‘쳐다보게 하자’로 비하적 뉘앙스 강조
  rationale: 원문은 단순 시각이 아니라 함락과 수치를 지켜보려는 적대적 욕망을 말하지만, 그 뉘앙스는 문맥과 함께 충분히 전달되므로 과도한 비속어화는 피했습니다.
  doctrine_reference: Translation philosophy §1
