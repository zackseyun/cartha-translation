  naturalness: ‘야훼의 집의 산’은 히브리어 연쇄를 지나치게 직역하여 현대 한국어로 어색합니다. ‘야훼의 집이 있는 산’이 자연스러우면서 산과 야훼의 집의 관계를 충실히 나타냅니다. 각주 표지도 해당 표현 바로 뒤에 배치했습니다.
  terminology: 신명은 프로젝트 방침에 맞추어 ‘야훼’로 유지했습니다. בְּאַחֲרִית הַיָּמִים는 ‘마지막 날들’로 옮겨 미래적·예언적 열린 의미를 보존했습니다. בְּרֹאשׁ הֶהָרִים는 ‘산들 가운데 으뜸으로’로 옮기고 각주에서 공간적 의미 가능성을 밝혀, 물리적 고도와 탁월성 사이의 해석을 단정하지 않았습니다.
