id: MIC.4.1
reference: Micah 4:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/אַחֲרִ֣ית הַ/יָּמִ֗ים יִ֠הְיֶה הַ֣ר בֵּית יְהוָ֤ה נָכוֹן֙ בְּ/רֹ֣אשׁ הֶ/הָרִ֔ים וְ/נִשָּׂ֥א ה֖וּא מִ/גְּבָע֑וֹת וְ/נָהֲר֥וּ עָלָ֖י/ו עַמִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/001.yaml
  text: And it will happen in the latter days that the mountain of the house of Yahweh will be established as the chief of the mountains[a], and it will be lifted up above the hills[c][b], and peoples will stream to it.
  footnotes:
  - marker: a
    text: Or 'in the last days' or 'in days to come.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'at the head of the mountains'; the phrase may denote highest prominence rather than merely physical location.
    reason: lexical_alternative
  - marker: c
    text: The verb pictures peoples 'flowing' like a stream to the mountain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때는 말세에 야훼의 집의 산이 산들 가운데서 굳게 세워지고, 언덕들 위로 높이 들리며, 민족들이 그리로 밀려올 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마지막 날에’ 혹은 ‘장차 오는 날들에’.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘산들의 머리’; 이 표현은 단순한 지리적 위치보다 최고의 두드러짐을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 동사는 민족들이 산을 향해 ‘흘러가듯’ 오는 모습을 그립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַחֲרִית הַיָּמִים
  english_pob_choice: in the latter days
  chosen_korean: 말세에
  alternatives_korean:
  - 마지막 날에
  - 마지막 때에
  - 장차 오는 날들에
  lexicon: HALOT
  rationale: 예언적 종말 표현을 간결하게 살리면서도, 특정 교리 체계를 미리 확정하지 않도록 했습니다.
- source_word: הַר בֵּית יְהוָה
  english_pob_choice: the mountain of the house of Yahweh
  chosen_korean: 야훼의 집의 산
  alternatives_korean:
  - 야훼의 집의 산악
  - 여호와의 집의 산
  - 야훼의 성전 산
  lexicon: HALOT
  rationale: 히브리어 소유 연쇄를 직접 반영해 ‘산’과 ‘집의’의 연결을 보존했습니다. ‘성전’은 해석을 더해버릴 수 있어 피했습니다.
- source_word: נָכוֹן
  english_pob_choice: established
  chosen_korean: 굳게 세워지고
  alternatives_korean:
  - 확립되고
  - 견고히 서고
  - 세워지고
  lexicon: HALOT
  rationale: 견고함과 확정된 상태를 함께 드러내는 표현으로, 산의 높아짐과 연결되는 안정성을 살렸습니다.
- source_word: וְנָהֲרוּ
  english_pob_choice: will stream
  chosen_korean: 밀려올 것입니다
  alternatives_korean:
  - 흘러올 것입니다
  - 물결처럼 올 것입니다
  - 몰려올 것입니다
  lexicon: HALOT
  rationale: 사람들이 물처럼 움직이는 이미지를 살리되, 한국어에서 자연스러운 집합적 이동감을 주도록 했습니다.
theological_decisions:
- issue: ‘말세’의 종말론적 범위
  chosen_reading: ‘말세’로 옮기되, 구체적 연대나 체계를 단정하지 않았습니다.
  alternative_readings:
  - 마지막 날
  - 장차 오는 날들
  - 끝날
  rationale: 본문의 예언적 표현을 유지하면서도, 미래 성취의 범위를 신학적으로 과도하게 좁히지 않기 위함입니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: 시온/산의 높아짐이 지리적 변화인지 상징적 우위인지
  chosen_reading: ‘굳게 세워지고… 높이 들리며’로 두 이미지를 함께 보존했습니다.
  alternative_readings:
  - 물리적으로 높아짐
  - 상징적으로 우위에 섬
  rationale: 본문의 시적 언어를 그대로 살려, 실제 고도 변화와 상징적 գեր월성을 둘 다 열어 두었습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
