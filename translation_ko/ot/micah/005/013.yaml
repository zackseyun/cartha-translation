  yaml_path: translation/ot/micah/005/013.yaml
  text: And I will uproot your Asherah poles from your midst[a], and I will destroy your cities.
  footnotes:
  - marker: a
    text: Or 'your Asherim' or 'your sacred poles.' The Hebrew term can refer to cultic objects associated with the goddess Asherah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 너의 아세라 상들^a을 너의 가운데에서 뽑아내고, 네 성읍들을 멸하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아세라들’ 혹은 ‘거룩한 기둥들’입니다. 히브리어 용어는 아세라 여신과 관련된 제의적 물체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַשְׁתִּי
  english_pob_choice: I will uproot
  chosen_korean: 뽑아내고
  alternatives_korean:
  - 뿌리째 뽑고
  - 끌어내고
  lexicon: HALOT
  rationale: נתשׁ는 심은 것처럼 박힌 것을 뽑아내는 뜻이어서, 한국어에서는 자연스럽고 강한 동작인 ‘뽑아내다’로 옮겼습니다.
- source_word: אֲשֵׁירֶיךָ
  english_pob_choice: your Asherah poles
  chosen_korean: 아세라 상들
  alternatives_korean:
  - 아세라 기둥들
  - 아세라 목상들
  - 아세라 상들
  lexicon: HALOT
  rationale: 이 말은 아세라 여신 자체보다 그 숭배와 연결된 제의적 물체를 가리키는 경우가 많으므로, 구체성을 살리면서도 ‘상’으로 번역해 우상적 물체임을 드러냈습니다.
- source_word: מִקִּרְבֶּךָ
  english_pob_choice: from your midst
  chosen_korean: 너의 가운데에서
  alternatives_korean:
  - 너희 가운데에서
  - 너의 한가운데에서
  lexicon: HALOT
  rationale: 직역에 가까운 ‘가운데에서’를 써서 공동체 내부에서 제거한다는 심판적 뉘앙스를 보존했습니다.
- source_word: וְהִשְׁמַדְתִּי
  english_pob_choice: I will destroy
  chosen_korean: 멸하겠습니다
  alternatives_korean:
  - 파괴하겠습니다
  - 없애겠습니다
  - 진멸하겠습니다
  lexicon: HALOT
  rationale: שׁמד의 강한 파멸 의미를 살리되, 한국어에서 예언적 심판 문맥에 자연스러운 ‘멸하다’를 택했습니다.
- source_word: עָרֶיךָ
  english_pob_choice: your cities
  chosen_korean: 네 성읍들
  alternatives_korean:
  - 네 도시들
  - 네 마을들
  lexicon: HALOT
  rationale: 성경적 지리·공동체 어휘를 유지하면서도 현대 한국어에서 이해되는 ‘성읍’으로 옮겼습니다.
theological_decisions:
- issue: אַשֵׁירָה의 의미를 여신명으로 볼지, 제의물로 볼지
  chosen_reading: 아세라 숭배와 연관된 제의적 상(기둥/목상)에 초점을 둔 번역
  alternative_readings:
  - 아세라 여신 자체로 읽는 번역
  - 더 일반적인 ‘거룩한 기둥’ 번역
  rationale: 문맥이 우상적 물건의 제거를 말하고 있으므로, 여신명 자체로 평평하게 옮기기보다 제의물의 구체성을 살리는 편이 원문의 의도에 가깝습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
