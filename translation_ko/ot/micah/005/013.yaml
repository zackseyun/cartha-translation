  terminology: ‘아세라 기둥’은 아세라와 연관된 제의물을 구체적으로 지칭하면서도, 각주를 통해 여신명 또는 일반적 성스러운 기둥이라는 대안을 보존합니다. ‘성읍’과 ‘멸하겠습니다’는 문맥과 격식에 적절합니다.
  issues:
  - severity: medium
