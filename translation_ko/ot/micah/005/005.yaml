id: MIC.5.5
reference: Micah 5:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָע֞וּ אֶת אֶ֤רֶץ אַשּׁוּר֙ בַּ/חֶ֔רֶב וְ/אֶת אֶ֥רֶץ נִמְרֹ֖ד בִּ/פְתָחֶ֑י/הָ וְ/הִצִּיל֙ מֵֽ/אַשּׁ֔וּר כִּֽי יָב֣וֹא בְ/אַרְצֵ֔/נוּ וְ/כִ֥י יִדְרֹ֖ךְ בִּ/גְבוּלֵֽ/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/005.yaml
  text: They will shepherd the land of Assyria with the sword[a], and the land of Nimrod at its entrances; and he will deliver us from Assyria when he comes into our land[b], and when he treads within our border.
  footnotes:
  - marker: a
    text: Or 'the Assyrian' in the final clause; the Hebrew can personify Assyria as the invading enemy.
    reason: alternative_reading
  - marker: b
    text: Or 'in its gates'; Hebrew 'at its entrances/openings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 칼로 앗수르 땅을, 니므롯 땅을 그 출입구들에서 다스릴 것입니다. 그는 앗수르에서 우리를 건지실 것이니, 곧 그가 우리 땅에 들어오고 우리 경계 안을 밟을 때입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘앗수르 사람’입니다. 히브리어는 마지막 절에서 앗수르를 침략하는 적으로 인격화할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그의 문들에서’입니다. 히브리어는 ‘그 출입구들/열린 곳들에서’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָעוּ
  english_pob_choice: they will shepherd
  chosen_korean: 다스릴 것입니다
  alternatives_korean:
  - 목양할 것입니다
  - 치리할 것입니다
  - 목자로 삼을 것입니다
  lexicon: HALOT
  rationale: 히브리어 רעה의 기본 뜻은 ‘먹이다/목양하다’이지만, 여기서는 ‘칼로’라는 수단과 정복 문맥이 함께 있어 실제로는 지배의 이미지를 전달합니다. 한국어에서는 이 역설을 자연스럽게 살리기 위해 ‘다스리다’를 택했습니다.
- source_word: אֶרֶץ אַשּׁוּר
  english_pob_choice: the land of Assyria
  chosen_korean: 앗수르 땅
  alternatives_korean:
  - 앗수르의 땅
  - 아시리아 땅
  lexicon: HALOT
  rationale: 원문은 ‘땅’(אֶרֶץ)을 유지하는 지역적 표현이므로 이를 살렸고, 성서 한국어에서 널리 알려진 고유명사형인 ‘앗수르’를 사용했습니다.
- source_word: בִּפְתָחֶיהָ
  english_pob_choice: at its entrances
  chosen_korean: 그 출입구들에서
  alternatives_korean:
  - 그 문들에서
  - 그 입구들에서
  - 그 성문들에서
  lexicon: HALOT
  rationale: פתח는 일반적으로 ‘문’보다 넓은 ‘열린 곳/출입구’의 뜻이므로, 본문이 말하는 공간적 진입 지점을 직접적으로 옮겼습니다. ‘성문’은 해석을 덧붙일 수 있어 피했습니다.
- source_word: וְהִצִּיל
  english_pob_choice: and he will deliver us
  chosen_korean: 그는 … 우리를 건지실 것이니
  alternatives_korean:
  - 그는 … 우리를 구원하실 것이니
  - 그는 … 우리를 구해 내실 것이니
  lexicon: HALOT
  rationale: נצל의 기본 의미인 ‘구출하다/건지다’를 살렸습니다. 정복 문맥의 외적 구출을 드러내기 위해 ‘건지다’가 가장 직접적입니다.
theological_decisions:
- issue: 복수 주어에서 단수 주어로 바뀌는 문장 구조
  chosen_reading: 복수의 정복 행위와 단수의 구원자를 그대로 구분해 옮겼습니다.
  alternative_readings:
  - 모두 복수로 평탄화하기
  - 모두 단수 왕적 주어로 통일하기
  rationale: 히브리어는 의도적으로 복수(‘그들이’)에서 단수(‘그는’)로 이동합니다. 이는 앞선 통치자들과 최종 구원자 사이의 긴장을 보존하는 구조이므로, 한국어도 이를 매끈하게 합치지 않았습니다.
  doctrine_reference: Translation philosophy §3
- issue: 앗수르/앗수르 사람의 가능성
  chosen_reading: 본문에는 ‘앗수르’로 두고, 인격화 가능성은 영어 주석과 대응되도록 문맥에 맡겼습니다.
  alternative_readings:
  - ‘앗수르 사람’으로 옮기기
  - ‘앗수르의 침략자’로 풀어쓰기
  rationale: 원문 אַשּׁוּר는 국가명으로도, 침략자를 인격화한 표현으로도 읽힐 수 있습니다. 본문은 지리적 표현을 우선 살리고, 다른 읽기는 과도한 해석 없이 남겨 두는 편이 소스에 충실합니다.
  doctrine_reference: Translation philosophy §3
