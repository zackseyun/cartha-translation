revisions:
- from: 그들이 칼로 앗수르 땅을, 니므롯 땅을 그 출입구들에서 다스릴 것입니다. 그는 앗수르에서 우리를 건지실 것이니, 곧 그가 우리 땅에 들어오고 우리 경계 안을 밟을 때입니다.[a][b]
  to: 그들은 칼로 앗수르 땅을 목양하고, 니므롯 땅을 그 땅의 출입구들에서 목양할 것입니다.[b] 그는 앗수르에게서[a] 우리를 건지실 것입니다. 그가 우리 땅에 들어오고 우리 경계 안을 밟을 때에.
  rationale: 원문의 복수에서 단수로의 주어 전환과 마지막 절의 ‘그’가 지닌 문맥적 긴장을 유지했습니다. רעה의 기본 목양 이미지를 보존하되, ‘칼로’라는 표현이 정복의 맥락을 충분히 드러내도록 했습니다. 각주 내용과 표지를 해당 히브리어 어구에 맞추어 바로잡았습니다.
