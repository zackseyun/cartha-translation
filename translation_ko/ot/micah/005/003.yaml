id: MIC.5.3
reference: Micah 5:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָמַ֗ד וְ/רָעָה֙ בְּ/עֹ֣ז יְהוָ֔ה בִּ/גְא֕וֹן שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑י/ו וְ/יָשָׁ֕בוּ כִּֽי עַתָּ֥ה יִגְדַּ֖ל עַד אַפְסֵי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/003.yaml
  text: And he will stand and shepherd in the strength of Yahweh[a], in the majesty of the name of Yahweh his God. And they will dwell secure[b], for now he will be great to the ends of the earth.
  footnotes:
  - marker: a
    text: Or 'And they will live securely.' The Hebrew verb literally means 'dwell' or 'sit,' with security implied by the context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'for now'; some translations render this 'for then' to smooth the prophetic sequence, but the Hebrew adverb is 'now.'
    reason: alternative_reading
translation:
  language: ko
  text: 그가 서서 야훼의 능력으로, 그의 하나님이신 야훼의 이름의 위엄으로 양 떼를 돌보실 것입니다. 그들은 안전하게 거주할 것입니다[a]. 이는 이제 그가 땅 끝까지 위대해질 것이기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 안전하게 살 것입니다.’ 히브리어 동사는 문자적으로 ‘거주하다’ 또는 ‘앉다’를 뜻하며, 안전은 문맥에서 암시됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘이제’입니다. 일부 번역은 예언의 흐름을 매끄럽게 하려고 ‘그때’로 옮기지만, 원문 부사는 ‘이제’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָמַד
  english_pob_choice: And he will stand
  chosen_korean: 그가 일어나
  alternatives_korean:
  - 그가 서 있을 것입니다
  - 그가 서게 될 것입니다
  lexicon: HALOT
  rationale: עמד의 기본 뜻은 ‘서다’이지만, 왕적·목자적 문맥에서는 자리를 잡아 활동을 시작하는 움직임까지 담을 수 있어 ‘일어나’가 자연스럽습니다. 다만 ‘서다’의 이미지를 완전히 지우지 않도록 과도한 해석은 피했습니다.
- source_word: וְרָעָה
  english_pob_choice: and shepherd
  chosen_korean: 양 떼를 돌볼 것입니다
  alternatives_korean:
  - 목자처럼 이끌 것입니다
  - 먹일 것입니다
  lexicon: HALOT
  rationale: רעה는 ‘먹이다’보다 ‘돌보다/목자처럼 치다’의 의미가 더 넓고, 통치자 이미지와도 잘 맞습니다. 한국어에서는 ‘양 떼를 돌보다’가 목자적 통치의 뉘앙스를 가장 무리 없이 살립니다.
- source_word: בְּגְאוֹן שֵׁם יְהוָה אֱלֹהָיו
  english_pob_choice: in the majesty of the name of Yahweh his God
  chosen_korean: 그의 하나님 야훼의 이름의 위엄 속에서
  alternatives_korean:
  - 그의 하나님 야훼의 이름의 존귀 속에서
  - 그의 하나님 야훼의 이름의 위엄 가운데
  lexicon: HALOT
  rationale: גאון은 ‘위엄, 존귀, 장엄함’의 범위를 가지므로 ‘위엄’이 왕적 문맥에 적합합니다. 또한 소유 관계를 그대로 따라 ‘그의 하나님 야훼’로 옮겨, 본문의 신학적 긴장을 유지했습니다.
- source_word: וְיָשָׁבוּ
  english_pob_choice: And they will dwell secure
  chosen_korean: 그들은 안전히 거주할 것입니다
  alternatives_korean:
  - 그들은 안전하게 살 것입니다
  - 그들은 평안히 살 것입니다
  lexicon: HALOT
  rationale: ישב은 문자적으로 ‘거주하다/앉다’이므로, 보안이 암시된 문맥을 살리되 한국어에서는 ‘안전히 거주하다’가 가장 원문 가까운 표현입니다. POB의 의미 주석처럼 안전은 문맥에서 드러나는 것으로 두었습니다.
- source_word: כִּי עַתָּה
  english_pob_choice: for now
  chosen_korean: 이제
  alternatives_korean:
  - 지금
  - 그때
  lexicon: HALOT
  rationale: עַתָּה는 분명히 ‘지금/이제’이므로, 예언적 흐름을 매끈하게 하려고 ‘그때’로 바꾸지 않았습니다. 앞절의 이유를 받는 연결어로는 ‘이제’가 가장 자연스럽습니다.
theological_decisions:
- issue: 이 구절의 주어를 메시아로 명시할지 여부
  chosen_reading: 문장에는 인칭대명사로만 두고, 별도의 칭호를 덧붙이지 않았습니다.
  alternative_readings:
  - 메시아로 명시
  - 다윗 계열의 통치자로 풀어씀
  rationale: 본문 자체는 3인칭 단수 동사와 대명사만 사용하므로, 번역에서 해석을 앞서 밀어 넣지 않았습니다. 문맥상 메시아적 이해는 가능하지만, 구절의 문자 수준을 유지했습니다.
  doctrine_reference: 원문 우선, 해석은 주석층에 남기기
- issue: אֱלֹהָיו의 소유격을 유지할지 여부
  chosen_reading: ‘그의 하나님’으로 그대로 유지했습니다.
  alternative_readings:
  - 문맥상 자연스럽게 풀어쓰기
  - 신학적 긴장을 완화하는 표현으로 조정
  rationale: 히브리어는 분명히 ‘그의 하나님’을 말하므로, 그 표현이 불편해 보여도 번역에서 해소하지 않았습니다. 이는 원문이 가진 신학적 긴장을 보존하기 위함입니다.
  doctrine_reference: 원어 우선, 번역 전통보다 원문 보존
