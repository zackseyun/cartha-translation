  source_fidelity: ‘일어나’는 וְעָמַד(‘서다’)의 구체적 이미지를 ‘일어나다’로 바꾸므로, 본문에서는 ‘서서’로 옮기는 편이 더 충실합니다. 또한 כִּי עַתָּה의 인과관계는 ‘이는 이제 … 때문입니다’로 분명히 드러내는 것이 좋습니다. 나머지 핵심 요소, 곧 야훼의 능력, ‘그의 하나님’이라는 소유격, 목자적 돌봄, 백성의 안전한 거주, 땅 끝까지 이르는 위대함은 보존되었습니다.
  naturalness: ‘그의 하나님 야훼의 이름의 위엄 속에서’는 직역적이지만 한국어 구성으로 다소 무겁습니다. ‘그의 하나님이신 야훼의 이름의 위엄으로’가 소유 관계를 유지하면서 더 자연스럽습니다. ‘안전하게 거주할 것입니다’는 현대 표준어 합쇼체에 맞고, ‘안전히’보다 일반적입니다.
  terminology: ‘야훼’, ‘하나님’, ‘양 떼를 돌보다’는 일관되고 적절합니다. ‘그의 하나님이신 야훼’는 אֱלֹהָיו를 완화하거나 해석적으로 제거하지 않고 보존합니다.
