id: MIC.5.2
reference: Micah 5:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֣ן יִתְּנֵ֔/ם עַד עֵ֥ת יוֹלֵדָ֖ה יָלָ֑דָה וְ/יֶ֣תֶר אֶחָ֔י/ו יְשׁוּב֖וּ/ן עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/002.yaml
  text: Therefore he will give them up until the time when she who is in labor has given birth[c][b][a]; then the rest of his brothers will return to the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'he will hand them over' or 'he will abandon them.'
    reason: lexical_alternative
  - marker: b
    text: '''She who is in labor'' is not explicitly identified in the Hebrew; interpreters variously understand her as Zion/Judah personified, the mother of the promised ruler, or another figure.'
    reason: alternative_reading
  - marker: c
    text: Or 'the children of Israel.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그가 그들을 내버려 두실 것이니, 해산하는 여인이 출산할 때까지입니다[a][b][c]. 그때 그의 형제들 가운데 남은 자들이 이스라엘의 자손에게로 돌아올 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 넘겨주실 것이다’ 혹은 ‘그들을 버리실 것이다’.
    reason: lexical_alternative
  - marker: b
    text: ‘해산하는 여인’은 히브리어에서 명시적으로 신원이 밝혀지지 않습니다. 해석자들은 이를 시온/유다의 의인화, 약속된 통치자의 어머니, 또는 다른 인물로 다양하게 이해합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘이스라엘의 자녀들’. 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그런 까닭에
  - 따라서
  lexicon: HALOT
  rationale: 앞 문맥의 결론을 잇는 접속 부사로 자연스럽고, 인과 관계를 분명히 드러냅니다.
- source_word: יִתְּנֵם
  english_pob_choice: he will give them up
  chosen_korean: 그들을 내버려 두실 것이니
  alternatives_korean:
  - 그들을 넘겨주실 것이니
  - 그들을 버리실 것이니
  lexicon: HALOT
  rationale: 직역의 ‘내어주다/넘겨주다’보다, 징계의 맥락에서 지속적 방치를 뜻하는 의미를 한국어로 가장 자연스럽게 살렸습니다.
- source_word: יוֹלֵדָה יָלָדָה
  english_pob_choice: she who is in labor has given birth
  chosen_korean: 해산하는 여인이 출산할 때까지
  alternatives_korean:
  - 산고 중인 여인이 아이를 낳을 때까지
  - 해산하는 여인이 낳을 때까지
  lexicon: HALOT
  rationale: 분사와 완료형의 시간적 긴장을 살리면서도, 한국어에서는 ‘~할 때까지’ 구조가 가장 매끄럽습니다.
- source_word: וְיֶתֶר אֶחָיו
  english_pob_choice: then the rest of his brothers
  chosen_korean: 그때 그의 형제들 가운데 남은 자들이
  alternatives_korean:
  - 그리고 그의 형제들의 나머지가
  - 그의 형제들 가운데 남은 이들이
  lexicon: HALOT
  rationale: ‘יתר’의 남은 사람들/나머지라는 뜻을 반영하면서, 문맥상 집단적 회복을 자연스럽게 표현했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 성별 표지를 지나치게 약화시키지 않으면서도, 한국어 성경에서 널리 이해되는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘해산하는 여인’의 정체
  chosen_reading: 본문은 그녀의 정체를 밝히지 않은 채 그대로 두었습니다.
  alternative_readings:
  - 시온/유다의 의인화
  - 약속된 통치자의 어머니
  - 더 즉각적인 역사적 인물
  rationale: 히브리어가 명시하지 않는 대상을 번역문에서 특정하지 않고, 해석의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: ‘his brothers’의 관계 범위
  chosen_reading: ‘그의 형제들’이라는 친족 표현을 유지했습니다.
  alternative_readings:
  - 동족들
  - 분열된 이스라엘의 동족들
  - 메시아와 연결된 이스라엘 사람들
  rationale: 문맥상 확장 해석이 가능하지만, 본문 자체는 관계를 더 구체화하지 않으므로 친족어를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 4.
