id: MIC.5.4
reference: Micah 5:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֥ה זֶ֖ה שָׁל֑וֹם אַשּׁ֣וּר כִּֽי יָב֣וֹא בְ/אַרְצֵ֗/נוּ וְ/כִ֤י יִדְרֹךְ֙ בְּ/אַרְמְנֹתֵ֔י/נוּ וַ/הֲקֵמֹ֤נוּ עָלָי/ו֙ שִׁבְעָ֣ה רֹעִ֔ים וּ/שְׁמֹנָ֖ה נְסִיכֵ֥י אָדָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/004.yaml
  text: And he will be peace[a]. When Assyria comes into our land and treads in our citadels[c][b], then we will raise up against him seven shepherds and eight princes of men.
  footnotes:
  - marker: a
    text: Or 'the Assyrian.' The Hebrew אַשּׁוּר can denote Assyria as a nation or the Assyrian invader personally.
    reason: alternative_reading
  - marker: b
    text: Or 'palaces' for 'citadels'; the Hebrew term can refer to royal palaces or fortified strongholds.
    reason: lexical_alternative
  - marker: c
    text: '''Seven ... and eight'' is a Hebrew numerical expression suggesting an abundant or sufficient number.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 평강이십니다. 앗시리아가 우리 땅에 들어오고 우리 보루들을 짓밟을 때, 우리는 그를 대항하여 일곱 목자와 여덟 사람의 통치자들을 세울 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘앗시리아 사람’. 히브리어 אַשּׁוּר은 나라명으로도, 침략자를 가리키는 인격화된 표현으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘궁궐들’. 히브리어 אַרְמוֹן은 왕궁이나 요새화된 거점을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘일곱 … 여덟’은 히브리어 수 표현으로, 풍부하거나 충분한 수를 시사합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה זֶה
  english_pob_choice: And he will be
  chosen_korean: 그는 …이십니다
  alternatives_korean:
  - 이분은 …이십니다
  - 이 사람은 …이십니다
  lexicon: HALOT
  rationale: 지시대명사 זֶה는 앞 문맥의 오실 통치자를 가리키므로, 한국어 본문에서는 자연스럽게 인칭화해 주어를 살렸습니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 화평
  lexicon: HALOT
  rationale: 단순한 전쟁 부재보다 더 넓은 번영과 안전의 뉘앙스를 담되, 한국어 성경 문체에서 가장 안정적인 대응어인 평강을 택했습니다.
- source_word: בְאַרְמְנֹתֵינוּ
  english_pob_choice: in our citadels
  chosen_korean: 우리 보루들을
  alternatives_korean:
  - 우리 궁궐들을
  - 우리 성채들을
  lexicon: HALOT
  rationale: אַרְמוֹן은 궁궐이나 요새화된 거점 모두를 가리킬 수 있으나, 침공 문맥에서는 ‘보루들’이 방어 거점을 더 잘 드러냅니다.
- source_word: וַהֲקֵמֹנוּ
  english_pob_choice: then we will raise up
  chosen_korean: 우리는 … 세울 것입니다
  alternatives_korean:
  - 우리는 … 일으킬 것입니다
  - 우리는 … 임명할 것입니다
  lexicon: HALOT
  rationale: הֵקִים의 사역적 의미를 살리면서, 지도자들을 세운다는 권위 부여의 뜻을 한국어로 자연스럽게 옮겼습니다.
- source_word: שִׁבְעָה רֹעִים וּשְׁמֹנָה נְסִיכֵי אָדָם
  english_pob_choice: seven shepherds and eight princes of men
  chosen_korean: 일곱 목자와 여덟 사람의 통치자들
  alternatives_korean:
  - 일곱 목자와 여덟 지도자
  - 일곱 목자와 여덟 인생의 방백들
  lexicon: HALOT
  rationale: ‘목자’라는 은유를 유지해 통치자의 돌봄 이미지를 보존했고, נְסִיכֵי אָדָם은 직역적이되 한국어 어순에 맞게 ‘사람의 통치자들’로 처리했습니다.
theological_decisions:
- issue: אַשּׁוּר의 지칭
  chosen_reading: 본문에서는 침략 세력의 지명으로 ‘앗시리아’를 본문에 두고, 인격화된 ‘앗시리아 사람’ 읽기는 주석으로만 열어 두었습니다.
  alternative_readings:
  - 그 앗시리아 사람
  - 앗시리아 왕/침략자
  rationale: 전쟁 상황에서 지리적·정치적 실체로 읽는 것이 한국어 본문에 가장 자연스럽고, POB의 대안 읽기도 보존됩니다.
  doctrine_reference: 'Translation philosophy #3'
- issue: ‘일곱 … 여덟’의 의미
  chosen_reading: 숫자는 문자적으로 유지하되, 충분하고 넉넉한 수의 지도자라는 히브리식 관용은 본문 밖에서만 설명합니다.
  alternative_readings:
  - 정확한 수의 열거
  - 상징적 과잉 수사
  rationale: 본문의 수를 바꾸지 않으면서도, 과장된 충분성을 암시하는 히브리 관용을 훼손하지 않기 위함입니다.
  doctrine_reference: 'Translation philosophy #1 and #5'
