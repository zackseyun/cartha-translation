  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֣ה שְׁאֵרִ֣ית יַעֲקֹ֗ב בְּ/קֶ֨רֶב֙ עַמִּ֣ים רַבִּ֔ים כְּ/טַל֙ מֵ/אֵ֣ת יְהוָ֔ה כִּ/רְבִיבִ֖ים עֲלֵי עֵ֑שֶׂב אֲשֶׁ֤ר לֹֽא יְקַוֶּה֙ לְ/אִ֔ישׁ וְ/לֹ֥א יְיַחֵ֖ל לִ/בְנֵ֥י אָדָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/006.yaml
  text: And the remnant of Jacob will be among many peoples like dew from Yahweh[a], like showers upon the grass[b], which do not wait for a man or delay for the sons of man.
  footnotes:
  - marker: a
    text: Or 'does not hope for a man, nor wait for the sons of man.' The Hebrew verbs can both carry the sense of waiting or hoping; the line emphasizes that the dew and rain come apart from human agency.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of man,' a Hebrew expression for human beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱의 남은 자가 많은 백성들 가운데서 야훼로부터 오는 이슬 같고, 풀 위에 내리는 소낙비 같아서, 사람을 기다리지도 않고 인자들을 기다리지도 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '이상(爾常)'; 사람의 도움이나 개입에 의존하지 않는다는 뜻입니다.
    reason: source_note
  - marker: b
    text: 히브리어 '인자들'은 인간을 가리키는 히브리 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאֵרִית יַעֲקֹב
  english_pob_choice: the remnant of Jacob
  chosen_korean: 야곱의 남은 자
  alternatives_korean:
  - 야곱의 남은 무리
  - 야곱의 남은 자들
  lexicon: HALOT
  rationale: 예언서의 שְׁאֵרִית는 단순한 '일부'가 아니라 살아남은 언약 백성이라는 의미를 담으므로 '남은 자'로 옮기고, 야곱을 언약적 고유명으로 유지했습니다.
- source_word: בְּקֶרֶב עַמִּים רַבִּים
  english_pob_choice: among many peoples
  chosen_korean: 많은 백성들 가운데서
  alternatives_korean:
  - 많은 민족들 가운데서
  - 많은 사람들 가운데서
  lexicon: HALOT
  rationale: בְּקֶרֶב은 '가운데서'의 공간적 이미지를 살리고, עַמִּים은 정치체보다 집단·민족을 가리키므로 '백성들'이 자연스럽습니다.
- source_word: כְּטַל מֵאֵת יְהוָה
  english_pob_choice: like dew from Yahweh
  chosen_korean: 야훼로부터 오는 이슬
  alternatives_korean:
  - 야훼에게서 오는 이슬
  - 주님에게서 오는 이슬
  lexicon: HALOT
  rationale: יַהְוֶה는 본문에 직접 있는 하나님의 이름이므로 이 프로젝트 기본값에 따라 '야훼'를 유지했고, מֵאֵת는 단순 출처를 나타내어 '로부터 오는'으로 옮겼습니다.
- source_word: כִּרְבִיבִים עֲלֵי עֵשֶׂב
  english_pob_choice: like showers upon the grass
  chosen_korean: 풀 위에 내리는 소낙비
  alternatives_korean:
  - 풀 위에 내리는 소나기
  - 풀 위에 쏟아지는 비
  lexicon: HALOT
  rationale: רְבִיבִים은 단발성 강우보다 '소낙비/소나기'가 더 잘 살리고, עֵשֶׂב은 광범위한 식생보다 '풀'이 이미지의 구체성을 보존합니다.
- source_word: לֹא יְקַוֶּה לְאִישׁ וְלֹא יְיַחֵל לִבְנֵי אָדָם
  english_pob_choice: which do not wait for a man or delay for the sons of man
  chosen_korean: 사람을 기다리지도 않고 인자들을 기다리지도 않습니다
  alternatives_korean:
  - 사람을 바라지 않고 사람의 아들들을 기다리지도 않습니다
  - 사람에게 기대지 않고 인생들을 기다리지도 않습니다
  lexicon: HALOT
  rationale: 두 동사 קוה/יחל의 중첩을 살리면서도 한국어에서는 같은 '기다리다'로 처리해 병행을 분명히 했고, לְאִישׁ은 보통명사 '사람'으로, בני אדם은 직역을 과도하게 고정하지 않기 위해 '인자들'로 옮겼습니다.
theological_decisions:
- issue: 이슬과 소낙비의 비유가 가리키는 대상
  chosen_reading: 가장 가까운 선행사는 '이슬'과 '소낙비' 이미지이며, 그들이 인간의 개입 없이 하나님에게서 온다는 점을 강조하는 것으로 읽었습니다.
  alternative_readings:
  - 남은 자가 인간 지원 없이 독립적으로 행동한다는 뜻으로 넓게 읽을 수 있습니다.
  rationale: 문법상 비유적 자연현상이 바로 앞에 오므로, 본문이 말하는 핵심은 인간 의존이 아닌 하나님의 공급과 기원입니다.
  doctrine_reference: Preserve theological tension rather than resolve it
- issue: יהוה의 한국어 처리
  chosen_reading: 본문의 야훼를 본문 역문에 직접 반영했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문 고유명은 신학적·문헌학적 가시성을 위해 본문에 드러내는 것이 이 판의 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
