  to: 내가 네 새긴 형상들과 네 기둥들을 네 가운데서 끊어 버리겠습니다.[a] 너는 다시는 네 손으로 만든 것에 절하지 않을 것입니다.[b]
  rationale: 단수 2인칭을 일관되게 유지하고, ‘네 가운데서’를 두 목적어의 제거 범위로 바로잡았습니다. 본문의 종결을 합쇼체로 고쳤으며, פסילים의 조각된 형상이라는 구체성과 שחה의 몸을 굽혀 경배하는 행위를 유지했습니다. 각주 표지는 설명 대상 어구에 직접 연결했습니다.
