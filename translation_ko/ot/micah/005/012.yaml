source:
  edition: WLC
  text: וְ/הִכְרַתִּ֧י פְסִילֶ֛י/ךָ וּ/מַצֵּבוֹתֶ֖י/ךָ מִ/קִּרְבֶּ֑/ךָ וְ/לֹֽא תִשְׁתַּחֲוֶ֥ה ע֖וֹד לְ/מַעֲשֵׂ֥ה יָדֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/012.yaml
  text: And I will cut off your carved images and your pillars from your midst[b][a], and you will no longer bow down to the work of your hands.
  footnotes:
  - marker: a
    text: Or 'your sacred pillars' or 'your standing stones.' The Hebrew term refers to upright cultic stones used in worship contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'you will no longer worship the work of your hands.' The Hebrew more literally speaks of bowing down, preserving the physical act of worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너의 새긴 우상들과 너희 가운데 있는 기둥들을 끊어 버리며, 너는 다시는 네 손의 작품에 절하지 않을 것이다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너의 거룩한 기둥들’ 또는 ‘세운 돌들’입니다. 히브리어 용어는 예배 맥락에서 사용된 세운 돌기둥을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너는 더 이상 네 손의 작품을 예배하지 않을 것이다’입니다. 히브리어는 더 문자적으로 ‘몸을 굽히다’라고 말하여, 예배의 신체적 행위를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  english_pob_choice: And I will cut off
  chosen_korean: 끊어 버리며
  alternatives_korean:
  - 잘라 내며
  - 끊어 버리겠습니다
  lexicon: HALOT
  rationale: כרת의 핵심 이미지는 잘라 제거하는 것으로, 한국어에서는 결과의 단호함을 살리는 ‘끊어 버리다’가 자연스럽고 source-direct합니다.
- source_word: פְסִילֶיךָ
  english_pob_choice: your carved images
  chosen_korean: 너의 새긴 우상들
  alternatives_korean:
  - 너의 조각한 형상들
  - 너의 새긴 형상들
  - 너의 우상들
  lexicon: HALOT
  rationale: פסל은 단순한 ‘우상’보다 새겨 만든 이미지라는 구체성이 있어, 영어 POB의 ‘carved images’를 살려 ‘새긴 우상들’로 옮겼습니다.
- source_word: וּמַצֵּבוֹתֶיךָ
  english_pob_choice: your pillars
  chosen_korean: 기둥들
  alternatives_korean:
  - 거룩한 기둥들
  - 세운 돌기둥들
  - 예배 기둥들
  lexicon: HALOT
  rationale: מַצֵּבָה는 제의적 세움돌/기둥을 가리키지만, 본문 문맥상 이미 우상들과 함께 병렬되므로 간결한 ‘기둥들’을 택하되 제의적 뉘앙스는 유지했습니다.
- source_word: וְלֹא תִשְׁתַּחֲוֶה עוֹד
  english_pob_choice: and you will no longer bow down
  chosen_korean: 다시는 … 절하지 않을 것이다
  alternatives_korean:
  - 더 이상 … 몸을 굽히지 않을 것이다
  - 다시는 … 경배하지 않을 것이다
  - 더 이상 … 엎드려 절하지 않을 것이다
  lexicon: HALOT
  rationale: שׁחה는 몸을 굽혀 예배하는 행위를 뜻하므로, ‘경배’로만 풀기보다 육체적 행위를 드러내는 ‘절하다’를 사용했습니다.
theological_decisions:
- issue: 우상 숭배의 구체성 유지
  chosen_reading: 우상과 기둥을 각각 따로 제시해, 단순한 ‘우상 전반’으로 묶지 않았습니다.
  alternative_readings:
  - 너의 우상들과 네 제의 돌들
  - 너의 우상과 너의 성석들
  rationale: 히브리어는 서로 다른 제의 물체를 병렬로 언급하므로, 구체적 대상을 유지하는 편이 본문의 고발 강도를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 마지막 절의 행위성
  chosen_reading: ‘절하다’로 옮겨, 예배의 추상적 개념보다 신체적 경배 행위를 드러냈습니다.
  alternative_readings:
  - 예배하지 않을 것이다
  - 섬기지 않을 것이다
  rationale: 원문 동사는 몸을 낮추는 행위를 가리키므로, 한국어에서도 행위의 물성과 우상 숭배의 실재성을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3
