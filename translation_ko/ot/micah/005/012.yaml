    rationale: 초안의 ‘끊어 버리며’, ‘않을 것이다’는 요청된 현대 formal-polite 합쇼체와 일치하지 않습니다.
  - severity: low
    issue: 각주 표지의 위치
    rationale: 각주 a는 ‘기둥들’의 어휘 대안을, 각주 b는 ‘절하지 않을 것입니다’의 어휘 대안을 설명하므로 각각 해당 어구 바로 뒤에 두는 것이 명확합니다.
