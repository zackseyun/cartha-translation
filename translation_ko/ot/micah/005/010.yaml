  text: 내가 네 땅의 도시들을 없애고, 네 모든 요새를 허물겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכְרַתִּי
  english_pob_choice: I will cut off
  chosen_korean: 끊어 버리겠습니다
  alternatives_korean:
  - 없애 버리겠습니다
  - 도려내겠습니다
  - 멸하겠습니다
  lexicon: HALOT
  rationale: כרת의 단순한 파괴보다 ‘잘라 내어 제거하다’는 이미지를 살려, 미래형 선언의 예언적 강도를 자연스럽게 드러내는 표현을 택했습니다.
- source_word: עָרֵי אַרְצֶךָ
  english_pob_choice: the cities of your land
  chosen_korean: 네 땅의 도시들
  alternatives_korean:
  - 네 땅의 성읍들
  - 네 나라의 도시들
  lexicon: HALOT
  rationale: עִיר의 기본 의미를 살려 ‘도시들’로 옮기고, אֶרֶץ는 여기서 영토적 의미이므로 ‘땅’으로 간결하게 처리했습니다.
- source_word: הָרַסְתִּי
  english_pob_choice: I will tear down
  chosen_korean: 헐어 버리겠습니다
  alternatives_korean:
  - 무너뜨리겠습니다
  - 허물어 버리겠습니다
  - 파괴하겠습니다
  lexicon: HALOT
  rationale: הרס의 구체적 ‘허물다/무너뜨리다’라는 뜻을 살려, 요새 같은 구조물을 해체하는 이미지를 자연스럽게 반영했습니다.
- source_word: מִבְצָרֶיךָ
  english_pob_choice: your strongholds
  chosen_korean: 네 모든 요새
  alternatives_korean:
  - 네 모든 산성
  - 네 모든 요새들
  - 네 모든 성채
  lexicon: HALOT
  rationale: מִבְצָר의 군사적 방어 거점을 가리키는 뜻을 살려 ‘요새’로 옮겼고, כָּל은 ‘모든’으로 직역해 범위를 분명히 했습니다.
theological_decisions:
- issue: 심판 선언의 어조
  chosen_reading: 직설적인 미래 선언형으로 옮겨, 하나님이 직접 도시와 요새를 제거하겠다고 말씀하시는 예언적 단언을 살렸습니다.
  alternative_readings:
  - 완곡하게 ‘무너뜨릴 것입니다’로 누그러뜨리기
  - 일반 서술형으로 바꾸기
  rationale: 본문은 경고적 심판 예언이므로, 동사의 강한 파괴·제거 이미지를 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 예언 문맥의 하나님의 주권적 심판 선언
