  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תָּרֹ֥ם יָדְ/ךָ֖ עַל צָרֶ֑י/ךָ וְ/כָל אֹיְבֶ֖י/ךָ יִכָּרֵֽתוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/008.yaml
  text: May your hand be lifted up over your adversaries[a], and may all your enemies be cut off.
  footnotes:
  - marker: a
    text: 'Or: ''Your hand will be lifted up over your adversaries, and all your enemies will be cut off.'' The Hebrew imperfects may also be read as future statements.'
    reason: alternative_reading
translation:
  language: ko
  text: 당신의 손이 당신의 대적들 위에 높이 들리고, 당신의 모든 원수들이 끊어지게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: ‘당신의 손이 당신의 대적들 위에 높이 들리고, 당신의 모든 원수들이 끊어질 것입니다.’ 히브리어 미완료형은 미래 진술로도 읽을 수 있습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָּרֹם / יָדְךָ
  english_pob_choice: be lifted up / your hand
  chosen_korean: 당신의 손이 높이 들리고
  alternatives_korean:
  - 당신의 손이 높아지고
  - 당신의 손이 들어 올려지고
  lexicon: HALOT
  rationale: ‘손’의 직유를 유지하면서, 승리와 우세의 이미지를 자연스럽게 살리기 위해 ‘높이 들리다’를 택했습니다. 수동형 느낌도 보존되어 원문의 동사상과 잘 맞습니다.
- source_word: עַל
  english_pob_choice: over
  chosen_korean: 위에
  alternatives_korean:
  - 대하여
  - 맞서
  lexicon: HALOT
  rationale: 단순한 적대 방향보다 위세와 우위를 나타내는 공간적 이미지를 살리기 위해 ‘위에’로 옮겼습니다.
- source_word: צָרֶיךָ
  english_pob_choice: your adversaries
  chosen_korean: 당신의 대적들
  alternatives_korean:
  - 당신의 적대자들
  - 당신을 괴롭히는 자들
  lexicon: HALOT
  rationale: 다음 절의 ‘원수들’과 구별되는 첫 번째 병렬어로서, 히브리어의 적대·압박 뉘앙스를 살리기 위해 ‘대적들’을 택했습니다.
- source_word: יִכָּרֵתוּ
  english_pob_choice: be cut off
  chosen_korean: 끊어지게 하소서
  alternatives_korean:
  - 제거되게 하소서
  - 끊기게 하소서
  lexicon: HALOT
  rationale: כרת의 표준적 의미인 ‘끊다/잘라 내다’를 유지하되, 예언적 소망의 어조를 반영해 간구형으로 옮겼습니다. ‘제거되다’는 의미는 전달하지만 절단의 이미지를 약화시킵니다.
theological_decisions:
- issue: 히브리어 미완료형의 문맥상 화행
  chosen_reading: 예언적 간구/소망의 뉘앙스를 살려 ‘~하소서’로 번역했습니다.
  alternative_readings:
  - '직설적 미래: ‘당신의 손이 높이 들리고… 끊어질 것입니다’'
  rationale: 원문의 미완료형은 문맥상 단순 미래보다 소망·선언적 요청의 힘이 있어, 한국어에서는 기원형이 그 기능을 가장 잘 드러냅니다.
  doctrine_reference: 예언시의 화행과 시적 병행법
