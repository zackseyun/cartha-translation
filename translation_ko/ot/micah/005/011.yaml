translation:
  language: ko
  text: 내가 주술을 네 손에서 끊어 버리며, 네게는 점쟁이들이 더 이상 없을 것이다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주술’은 히브리어 כְשָׁפִים의 넓은 범주를 옮긴 말입니다. 문맥에 따라 ‘마법 행위’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘점쟁이들’은 מְעוֹנְנִים의 기능을 현대 한국어로 풀어 옮긴 말입니다. 직역하면 ‘점치는 자들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  english_pob_choice: And I will cut off
  chosen_korean: 내가 … 끊어 버리며
  alternatives_korean:
  - 내가 … 잘라 내며
  - 내가 … 제거하며
  lexicon: HALOT
  rationale: 히필 כרת의 ‘끊다/제거하다’라는 구체적이고 단호한 의미를 살리면서, 심판 선언의 힘을 자연스러운 한국어로 전달했습니다.
- source_word: כְשָׁפִים
  english_pob_choice: sorceries
  chosen_korean: 주술
  alternatives_korean:
  - 마술
  - 마법 행위
  - 주술 행위
  lexicon: HALOT
  rationale: 예언서 문맥의 금지된 신비술을 현대 한국어로 가장 압축적으로 드러내는 말로 ‘주술’을 택했습니다. ‘마술’은 오락적 뉘앙스가 강하고, ‘마법’은 서구 판타지 연상이 강합니다.
- source_word: מִיָּדֶךָ
  english_pob_choice: from your hand
  chosen_korean: 네 손에서
  alternatives_korean:
  - 네 손으로부터
  - 네 권세에서
  - 네 수중에서
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘손’을 유지해 소유·행사하던 통제권에서 제거된다는 뜻을 살렸습니다.
- source_word: וּמְעוֹנְנִים
  english_pob_choice: diviners / soothsayers
  chosen_korean: 점쟁이들
  alternatives_korean:
  - 점술가들
  - 점치는 자들
  - 길흉을 점치는 자들
  lexicon: HALOT
  rationale: 문맥상 כְשָׁפִים와 구별되는 점술 행위자를 가리키므로, 현대 독자에게 즉시 이해되는 ‘점쟁이들’을 택했습니다.
theological_decisions:
- issue: 주술·점술에 대한 심판 선언의 강도
  chosen_reading: 하나님이 자기 백성 가운데서 주술과 점술의 행위를 완전히 제거하신다는 단호한 심판 선언으로 읽었습니다.
  alternative_readings:
  - 그저 부정적 관습의 정화 정도로 약하게 읽는 해석
  rationale: 히브리어 동사 ‘끊어 버리다’는 단순한 축소가 아니라 제거·단절의 의미를 지니므로, 이를 약화시키지 않았습니다.
  doctrine_reference: 예언서의 언약적 심판 언어
