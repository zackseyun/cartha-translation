  lexicon: HALOT
  rationale: כְּפִיר은 힘이 왕성한 어린 사자를 뜻하므로, 단순한 연령보다 기세를 살리는 ‘젊은 사자’가 문맥에 맞습니다.
- source_word: וְרָמַס וְטָרַף
