  text: וְ/הָיָה֩ שְׁאֵרִ֨ית יַעֲקֹ֜ב בַּ/גּוֹיִ֗ם בְּ/קֶ֨רֶב֙ עַמִּ֣ים רַבִּ֔ים כְּ/אַרְיֵה֙ בְּ/בַהֲמ֣וֹת יַ֔עַר כִּ/כְפִ֖יר בְּ/עֶדְרֵי צֹ֑אן אֲשֶׁ֧ר אִם עָבַ֛ר וְ/רָמַ֥ס וְ/טָרַ֖ף וְ/אֵ֥ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/007.yaml
  text: And the remnant of Jacob will be among the nations[a], in the midst of many peoples, like a lion among the beasts of the forest, like a young lion among flocks of sheep, which, if it passes through, tramples and tears[b], and there is none to rescue.
  footnotes:
  - marker: a
    text: Or 'beasts of the forest.'
    reason: lexical_alternative
  - marker: b
    text: Or 'which, when it passes through, tramples and tears to pieces.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱의 남은 자는 여러 민족들[a] 가운데, 많은 백성들 가운데서, 숲의 짐승들 가운데 있는 사자 같고, 양 떼 가운데 있는 젊은 사자 같을 것입니다. 그것이 지나가면 짓밟고 찢을[b] 것이며, 구해 줄 자가 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숲의 짐승들 가운데’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지나갈 때 짓밟고 찢어 놓을’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאֵרִית יַעֲקֹב
  english_pob_choice: the remnant of Jacob
  chosen_korean: 야곱의 남은 자
  alternatives_korean:
  - 야곱의 남은 무리
  - 야곱의 남은 사람들
  lexicon: HALOT
  rationale: 예언서에서 שְׁאֵרִית는 단순한 잔여물이 아니라 살아남은 언약적 ‘남은 자’를 가리키므로, 한국어도 ‘남은 자’로 소리나게 옮겼습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 여러 민족들 가운데
  alternatives_korean:
  - 민족들 가운데
  - 나라들 가운데
  lexicon: HALOT
  rationale: גוֹיִם은 이 문맥에서 특정 민족 대 이방인의 대비보다 넓은 ‘민족들/나라들’을 뜻하므로, 의미를 덜 좁히는 ‘여러 민족들’이 적절합니다.
- source_word: בְּקֶרֶב עַמִּים רַבִּים
  english_pob_choice: in the midst of many peoples
  chosen_korean: 많은 백성들 가운데서
  alternatives_korean:
  - 많은 백성들 한가운데
  - 많은 민족들 한가운데
  lexicon: HALOT
  rationale: בְּקֶרֶב의 공간적 이미지를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘가운데서’로 옮겼습니다.
- source_word: בְּבַהֲמ֣וֹת יַ֔עַר
  english_pob_choice: among the beasts of the forest
  chosen_korean: 숲의 짐승들 가운데
  alternatives_korean:
  - 숲의 들짐승들 가운데
  - 숲의 짐승들 사이
  lexicon: HALOT
  rationale: 영어 POB의 결정처럼 여기서는 ‘animals’보다 더 격조 있고 성경적인 ‘짐승들’이 야생 포식자 이미지를 더 잘 살립니다.
- source_word: כִּכְפִיר
  english_pob_choice: like a young lion
  chosen_korean: 젊은 사자
  alternatives_korean:
  - 어린 사자
  - 새끼 사자
  lexicon: HALOT
  rationale: כְּפִיר은 힘이 왕성한 어린 사자를 뜻하므로, 단순한 연령보다 기세를 살리는 ‘젊은 사자’가 문맥에 맞습니다.
- source_word: וְרָמַס וְטָרַף
  english_pob_choice: tramples and tears
  chosen_korean: 짓밟고 찢을
  alternatives_korean:
  - 짓밟고 갈기갈기 찢을
  - 밟아 짓이기고 찢을
  lexicon: HALOT
  rationale: 두 동사의 연속된 포악성을 유지하되, 원문에 없는 과장된 보충은 피하고 동사형으로 긴박감을 살렸습니다.
theological_decisions:
- issue: 사자의 비유를 어떻게 전달할지
  chosen_reading: 남은 자의 압도적 우세와 침해 불가능성을 드러내는 비유로 유지하고, 군사적·정치적 성취 방식은 단정하지 않았습니다.
  alternative_readings:
  - 특정한 군사 정복 예언으로 한정
  - 상징적 영향력만으로 축소
  rationale: 히브리어는 포식적 지배의 생생한 비유를 주지만, 성취의 방식까지 규정하지는 않으므로 해석적 범위를 보존하는 것이 본문에 충실합니다.
  doctrine_reference: 해석적 긴장 보존
