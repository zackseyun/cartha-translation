theological_decisions:
- issue: 사자의 비유를 어떻게 전달할지
  chosen_reading: 남은 자의 압도적 우세와 침해 불가능성을 드러내는 비유로 유지하고, 군사적·정치적 성취 방식은 단정하지 않았습니다.
  alternative_readings:
  - 특정한 군사 정복 예언으로 한정
  - 상징적 영향력만으로 축소
  rationale: 히브리어는 포식적 지배의 생생한 비유를 주지만, 성취의 방식까지 규정하지는 않으므로 해석적 범위를 보존하는 것이 본문에 충실합니다.
  doctrine_reference: 해석적 긴장 보존
