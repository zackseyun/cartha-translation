  - 많은 민족들 한가운데
  lexicon: HALOT
  rationale: בְּקֶרֶב의 공간적 이미지를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘가운데서’로 옮겼습니다.
- source_word: בְּבַהֲמ֣וֹת יַ֔עַר
  english_pob_choice: among the beasts of the forest
  chosen_korean: 숲의 짐승들 가운데
  alternatives_korean:
