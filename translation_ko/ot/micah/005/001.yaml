reference: Micah 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֞ה בֵּֽית לֶ֣חֶם אֶפְרָ֗תָה צָעִיר֙ לִֽ/הְיוֹת֙ בְּ/אַלְפֵ֣י יְהוּדָ֔ה מִמְּ/ךָ֙ לִ֣/י יֵצֵ֔א לִֽ/הְי֥וֹת מוֹשֵׁ֖ל בְּ/יִשְׂרָאֵ֑ל וּ/מוֹצָאֹתָ֥י/ו מִ/קֶּ֖דֶם מִ/ימֵ֥י עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/001.yaml
  text: But you[a], Bethlehem Ephrathah, too small to be among the clans of Judah, from you one will come out for me to be ruler in Israel, whose goings forth are from of old[b], from the days of eternity.
  footnotes:
  - marker: a
    text: Or, 'too small to be among the clans of Judah'; literally, 'little among the thousands of Judah.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'whose origins are from ancient times, from days of old.' The Hebrew can also be understood more strongly as pointing to existence 'from everlasting.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 당신, 베들레헴 에브라다야, 유다의 수천 가운데 들기에도 너무 작은 곳이지만, 당신에게서 나를 위해 이스라엘의 통치자가 될 이가 나올 것이니, 그의 나아감은 예로부터, 영원의 날들부터입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다의 씨족들 가운데 들기에도 너무 작은 곳’. 문자적으로는 ‘유다의 수천 가운데 작은 곳’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 기원은 옛적부터, 옛날부터’. 히브리어는 더 강하게 ‘영원부터’의 존재를 가리키는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּית לֶחֶם אֶפְרָתָה
  english_pob_choice: Bethlehem Ephrathah
  chosen_korean: 베들레헴 에브라다
  alternatives_korean:
  - 베들레헴 에브랏
  - 베들레헴 에브라다
  lexicon: HALOT
  rationale: 지명은 음역하되, 예언적 구별표지인 אֶפְרָתָה를 함께 살려 다른 베들레헴과 구별되게 했습니다.
- source_word: צָעִיר לִהְיוֹת בְּאַלְפֵי יְהוּדָה
  english_pob_choice: too small to be among the clans of Judah
  chosen_korean: 유다의 수천 가운데 들기에도 너무 작은 곳
  alternatives_korean:
  - 유다의 부족들 가운데 들기에도 너무 작은 곳
  - 유다의 천인 단위들 가운데 들기에도 너무 작은 곳
  lexicon: HALOT
  rationale: אַלְפֵי는 문자적으로는 '수천'이지만 부족/씨족 단위를 가리킬 수 있어, POB의 주석 취지를 살리며 '유다의 수천'으로 직역에 가깝게 두었습니다.
- source_word: מִמְּךָ לִי יֵצֵא
  english_pob_choice: from you one will come out for me
  chosen_korean: 당신에게서 나를 위해 ... 나올 것이니
  alternatives_korean:
  - 당신에게서 나를 위하여 ... 나올 것이니
  - 당신에게서 ... 나오리라
  lexicon: HALOT
  rationale: יֵצֵא를 '나오다'로 살리고, לִי를 '나를 위해'로 옮겨 하나님의 위임/관계를 자연스럽게 드러냈습니다.
- source_word: מוֹצָאֹתָיו
  english_pob_choice: whose goings forth
  chosen_korean: 그의 나아감
  alternatives_korean:
  - 그의 나감
  - 그의 기원
  - 그의 나오심
  lexicon: HALOT
  rationale: 문자적인 '나아감/나감'을 택해 מוֹצָאֹתָיו의 동작적 뉘앙스를 유지했고, '기원'처럼 의미를 한쪽으로 고정하지 않았습니다.
- source_word: מִקֶּדֶם מִימֵי עוֹלָם
  english_pob_choice: from of old, from the days of eternity
  chosen_korean: 예로부터, 영원의 날들부터
  alternatives_korean:
  - 옛적부터, 영원의 날들부터
  - 태초부터, 영원부터
  lexicon: HALOT
  rationale: קֶדֶם의 '예로부터'와 עוֹלָם의 시간적·존재론적 긴장을 함께 살리기 위해 '영원의 날들'이라는 직역적 표현을 유지했습니다.
theological_decisions:
- issue: 마지막 절의 시간 표현이 단순한 고대성인지, 더 강한 선재성까지 열어 두는지
  chosen_reading: ‘그의 나아감은 예로부터, 영원의 날들부터’라고 두어 고대 기원과 영원한 선재 가능성을 모두 열어 둡니다.
  alternative_readings:
  - 그의 기원은 옛적부터, 옛날부터
  - 그의 나아감은 옛적부터, 영원부터
  rationale: 히브리어는 역사적 기원 언어와 더 강한 존재론적 언어를 모두 허용하므로, 한쪽으로 단정하지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
