lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: in that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그 날에
  lexicon: HALOT
  rationale: 예언문에서 반복되는 시간 표지이므로, 문장 앞에 두어 자연스러운 현대 한국어로 옮기되 종말론적·예언적 울림을 유지했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 주께서 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 주께서 선포하십니다
  - 주님의 말씀입니다
  lexicon: HALOT
  rationale: 히브리어의 예언적 발화 표지를 한국어에서도 직접적인 신적 발화로 살리되, 문맥상 ‘declares’의 선언성을 반영해 합쇼체로 옮겼습니다.
- source_word: מִקִּרְבֶּךָ
  english_pob_choice: from among you
  chosen_korean: 너희 가운데서
  alternatives_korean:
  - 너희 가운데로부터
  - 너희 속에서
  - 너의 한가운데서
  lexicon: HALOT
  rationale: 직역적 ‘네 가운데에서’보다 공동체 내부에서 제거된다는 뜻이 자연스럽게 드러나는 ‘너희 가운데서’를 택했습니다.
- source_word: סוּסֶיךָ / מַרְכְּבֹתֶיךָ
  english_pob_choice: your horses / your chariots
  chosen_korean: 너의 말들을 / 너의 병거들을
  alternatives_korean:
  - 네 말들을 / 네 병거들을
  - 너의 말과 병거를
  - 너희의 말들을 / 너희의 병거들을
  lexicon: HALOT
  rationale: 전쟁력의 상징인 구체적 군사 자산을 그대로 살려, 추상화하지 않고 ‘말’과 ‘병거’로 번역했습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 주
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절의 핵심은 군사적 의지의 제거라는 예언적 선언이며, 본문 자체가 아니라 호칭의 표시가 중심이 아니므로 합쇼체 본문에서는 ‘주’로 자연스럽게 처리했습니다.
  doctrine_reference: POB source-first rendering principle; divine-name handling in OT quotations
- issue: 군사 자산 제거의 의미
  chosen_reading: 본문의 구체적 제거 진술을 유지함
  alternative_readings:
  - 군사력 의존에 대한 비판을 본문에 명시함
  - 평화주의적 교훈을 본문에 덧붙임
  rationale: 히브리어는 말과 병거를 실제로 끊고 멸하겠다는 직설을 말하므로, 해석을 본문에 덧씌우지 않고 원문의 구체성을 유지했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
