id: MIC.5.14
reference: Micah 5:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשִׂ֜יתִי בְּ/אַ֧ף וּ/בְ/חֵמָ֛ה נָקָ֖ם אֶת הַ/גּוֹיִ֑ם אֲשֶׁ֖ר לֹ֥א שָׁמֵֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/014.yaml
  text: And I will execute vengeance in anger and wrath on the nations that have not listened[a].
  footnotes:
  - marker: a
    text: Or 'did not obey' or 'did not heed.' The Hebrew verb can mean both hearing and responding obediently.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 분노와 진노로 그 민족들에 대한 보복을 집행하겠으니, 그들은 듣지 않았습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '순종하지 않았다', '귀 기울이지 않았다'로도 옮길 수 있습니다. 히브리어 동사는 '듣다'와 '순종하다'의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי
  english_pob_choice: And I will execute
  chosen_korean: 내가 … 집행하겠으니
  alternatives_korean:
  - 내가 … 하겠으니
  - 내가 … 시행하겠으니
  lexicon: HALOT
  rationale: עשה는 일반적으로 '하다/행하다'이지만, 목적어 נָקָם과 결합할 때는 보복을 '집행하다'는 사법적·공적 뉘앙스가 살아납니다.
- source_word: בְּאַף וּבְחֵמָה
  english_pob_choice: in anger and wrath
  chosen_korean: 분노와 진노로
  alternatives_korean:
  - 분노와 격노로
  - 노여움과 진노로
  lexicon: HALOT
  rationale: אַף와 חֵמָה는 의미가 겹치지만 후자가 더 강한 격앙을 더합니다. 한국어에서는 두 감정을 나란히 살리되, '로'를 써서 집행의 방식과 결부시켰습니다.
- source_word: נָקָם
  english_pob_choice: vengeance
  chosen_korean: 보복
  alternatives_korean:
  - 복수
  - 응징
  lexicon: HALOT
  rationale: נָקָם은 신적·재판적 보복을 뜻하지만, 한국어 '복수'는 개인적 감정이 강하므로, 공적 판단의 성격을 드러내는 '보복'을 택했습니다.
- source_word: אֲשֶׁר לֹא שָׁמֵעוּ
  english_pob_choice: that have not listened
  chosen_korean: 그들은 듣지 않았습니다
  alternatives_korean:
  - 그들은 순종하지 않았습니다
  - 그들은 귀 기울이지 않았습니다
  lexicon: HALOT
  rationale: שׁמע는 '듣다'와 '듣고 따르다/순종하다'를 모두 가질 수 있으므로, 본문은 기본 의미인 '듣다'를 살리되, 불순종의 함의를 지나치게 고정하지 않도록 했습니다.
theological_decisions:
- issue: שׁמע의 의미 범위를 어떻게 드러낼지
  chosen_reading: '''듣지 않았습니다''로 두어 청취 거절과 순종 거절의 긴장을 함께 남겼습니다.'
  alternative_readings:
  - '''순종하지 않았습니다'''
  - '''귀 기울이지 않았습니다'''
  rationale: 예언적 문맥에서는 청취 자체의 거부가 곧 응답적 순종의 거부를 내포할 수 있으므로, 본문이 가지는 긴장을 해소하지 않는 쪽이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (Preserve theological tension rather than resolve it)
