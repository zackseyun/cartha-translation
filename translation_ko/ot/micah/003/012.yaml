id: MIC.3.12
reference: Micah 3:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵן֙ בִּ/גְלַלְ/כֶ֔ם צִיּ֖וֹן שָׂדֶ֣ה תֵֽחָרֵ֑שׁ וִ/ירוּשָׁלִַ֨ם֙ עִיִּ֣ין תִּֽהְיֶ֔ה וְ/הַ֥ר הַ/בַּ֖יִת לְ/בָמ֥וֹת יָֽעַר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/012.yaml
  text: Therefore[a], because of you, Zion will be plowed like a field, and Jerusalem will become ruins[b], and the mountain of the house will become wooded heights.
  footnotes:
  - marker: a
    text: 'Or ''the temple mount'' or ''the mountain of the temple.'' Hebrew: ''the mountain of the house.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'high places of a forest' / 'forest heights.' The Hebrew likely depicts the temple mount becoming wild and overgrown.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희 때문에 시온은 밭처럼 갈아엎어지고, 예루살렘은 폐허 더미가 되며, 성전의 산[a]은 숲이 우거진 높은 곳들[b]이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 집의 산’입니다. 여기서 ‘집’은 성전을 가리키므로, ‘성전산’ 또는 ‘성전의 산’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘숲의 높은 곳들’ 또는 ‘숲의 산당들’로도 옮길 수 있습니다. 문맥상 성전산이 황폐하여 숲처럼 우거지는 모습을 나타내는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이러므로
  lexicon: HALOT
  rationale: 앞 문맥의 죄에 대한 심판 결과를 나타내는 연결어이므로, 예언적 결론을 드러내는 ‘그러므로’가 가장 자연스럽고 분명합니다.
- source_word: בִּגְלַלְכֶם
  english_pob_choice: because of you
  chosen_korean: 너희 때문에
  alternatives_korean:
  - 너희 탓에
  - 너희로 말미암아
  lexicon: HALOT
  rationale: 직접적인 책임 귀속을 분명히 하면서도 현대 한국어에서 자연스럽게 들리는 인과 표현입니다.
- source_word: שָׂדֶה תֵחָרֵשׁ
  english_pob_choice: will be plowed like a field
  chosen_korean: 밭처럼 갈려질 것이며
  alternatives_korean:
  - 밭처럼 갈아엎어질 것이며
  - 밭으로 갈려질 것이며
  lexicon: HALOT
  rationale: ‘갈다/갈아엎다’의 농경 이미지를 살리되, 심판으로 도시가 경작지처럼 완전히 뒤바뀌는 모습을 간명하게 전달합니다.
- source_word: הַר הַבַּיִת
  english_pob_choice: the mountain of the house
  chosen_korean: 성전의 산
  alternatives_korean:
  - 집의 산
  - 성전 산
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘집의 산’이지만, 문맥상 성전을 가리키는 표현이므로 한국어에서는 오해를 피하면서도 지시 대상을 드러내는 표현이 적절합니다.
- source_word: לְבָמוֹת יָעַר
  english_pob_choice: will become wooded heights
  chosen_korean: 숲이 우거진 높은 곳이 될 것입니다
  alternatives_korean:
  - 숲의 높은 곳이 될 것입니다
  - 숲 높은 곳이 될 것입니다
  lexicon: HALOT
  rationale: ‘높은 곳’과 ‘숲/나무’가 결합한 파괴의 이미지를 살려, 예배 장소의 퇴락이 아니라 황폐로 인한 자연화된 풍경을 드러냅니다.
theological_decisions:
- issue: ‘하늘의/성전의 산’ 표현을 어떻게 옮길지
  chosen_reading: ‘성전의 산’으로 옮겨 성전 지시를 분명히 했습니다.
  alternative_readings:
  - ‘집의 산’
  - ‘성전 산’
  rationale: 히브리어의 직설적 표현은 보존하되, 이 구절이 예루살렘 성전산을 가리킨다는 점을 현대 독자가 바로 이해하도록 했습니다. 본문이 전하는 심판의 대상이 ‘성전’이라는 역사적·신학적 의미를 흐리지 않기 위한 선택입니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘בָמוֹת’의 의미를 전통적 ‘산당’으로 읽을지, 황폐한 지형 묘사로 읽을지
  chosen_reading: 예언 문맥에 따라 ‘숲이 우거진 높은 곳’으로 옮겼습니다.
  alternative_readings:
  - 산당
  - 높은 곳
  rationale: 뒤따르는 ‘יער(숲)’가 의미를 자연의 무성한 황폐로 이끌기 때문에, 제의 장소를 가리키는 전통 번역보다 지형적·시각적 심판 이미지를 살리는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §5
