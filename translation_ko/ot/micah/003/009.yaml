- source_word: הַמֲתַעֲבִים מִשְׁפָּט וְאֵת כָּל הַיְשָׁרָה יְעַקֵּשׁוּ
  english_pob_choice: who detest justice and make crooked all that is straight
  chosen_korean: 정의를 혐오하고 모든 바른 것을 비뚤게 만드는 자들
  alternatives_korean:
  - 정의를 가증히 여기고 모든 바른 것을 굽게 만드는 자들
