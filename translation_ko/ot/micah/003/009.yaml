  lexicon: HALOT
  rationale: ‘detest’는 강한 혐오를 뜻하므로 ‘혐오하고’로 옮겼고, ‘straight/crooked’의 대조를 살리기 위해 ‘바른 것’과 ‘비뚤게’의 대응을 유지했습니다.
