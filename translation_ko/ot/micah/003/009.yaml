  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁמְעוּ נָ֣א זֹ֗את רָאשֵׁי֙ בֵּ֣ית יַעֲקֹ֔ב וּ/קְצִינֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הַֽ/מֲתַעֲבִ֣ים מִשְׁפָּ֔ט וְ/אֵ֥ת כָּל הַ/יְשָׁרָ֖ה יְעַקֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/009.yaml
  text: 'Hear this[a], please, heads of the house of Jacob and rulers of the house of Israel[b], who detest justice and make crooked all that is straight:'
  footnotes:
  - marker: a
    text: Or 'Listen now' for 'Hear this, please'; the particle נָא can express urgency as well as entreaty.
    reason: lexical_alternative
  - marker: b
    text: Or 'everything that is right.' The Hebrew literally says 'all that is straight,' preserving the contrast with 'make crooked.'
    reason: lexical_alternative
translation:
  language: ko
  text: 들으십시오, 부디, 야곱의 집의 우두머리들과 이스라엘의 집의 통치자들아[a], 너희는 정의를 혐오하고 모든 바른 것을 비뚤게 만드는 자들아[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 집의 통치자들’은 ‘이스라엘의 집의 관리들’로도 옮길 수 있습니다. 영어 POB의 ‘rulers’는 직무상의 통치권을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 것이 바른 것’입니다. 히브리어는 문자적으로 ‘모든 바른 것’을 말하며, 뒤의 ‘비뚤게 만드는’과의 대조를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  english_pob_choice: Hear this, please
  chosen_korean: 들으십시오, 부디
  alternatives_korean:
  - 들으십시오, 지금
  - 들으십시오, 제발
  lexicon: HALOT
  rationale: 예언자적 소환의 명령형을 살리기 위해 ‘들으십시오’를 택하고, נָא의 간청·촉구 기능은 ‘부디’로 옮겨 공손하지만 절박한 어조를 유지했습니다.
- source_word: רָאשֵׁי בֵּית יַעֲקֹב
  english_pob_choice: heads of the house of Jacob
  chosen_korean: 야곱의 집의 우두머리들
  alternatives_korean:
  - 야곱의 집의 지도자들
  - 야곱의 집의 수장들
  lexicon: HALOT
  rationale: ‘heads of’의 비유를 너무 평탄화하지 않도록 직역에 가까운 ‘우두머리들’을 사용해 다음 구절과의 병행을 살렸습니다.
- source_word: וּקְצִינֵי בֵּית יִשְׂרָאֵל
  english_pob_choice: and rulers of the house of Israel
  chosen_korean: 이스라엘의 집의 통치자들
  alternatives_korean:
  - 이스라엘의 집의 관리들
  - 이스라엘의 집의 지도자들
  lexicon: HALOT
  rationale: קָצִין의 통치·재판 권한을 고려해 ‘통치자들’로 옮겨, 직무적 권위를 드러내면서도 ‘우두머리들’과의 병행을 유지했습니다.
- source_word: הַמֲתַעֲבִים מִשְׁפָּט וְאֵת כָּל הַיְשָׁרָה יְעַקֵּשׁוּ
  english_pob_choice: who detest justice and make crooked all that is straight
  chosen_korean: 정의를 혐오하고 모든 바른 것을 비뚤게 만드는 자들
  alternatives_korean:
  - 정의를 가증히 여기고 모든 바른 것을 굽게 만드는 자들
  - 정의를 싫어하고 모든 바른 것을 왜곡하는 자들
  lexicon: HALOT
  rationale: ‘detest’는 강한 혐오를 뜻하므로 ‘혐오하고’로 옮겼고, ‘straight/crooked’의 대조를 살리기 위해 ‘바른 것’과 ‘비뚤게’의 대응을 유지했습니다.
theological_decisions:
- issue: ‘house of Jacob / house of Israel’의 집단-언약적 표현 유지
  chosen_reading: ‘야곱의 집’과 ‘이스라엘의 집’을 그대로 보존했습니다.
  alternative_readings:
  - ‘야곱’과 ‘이스라엘’로 단순화
  - ‘야곱 가문’과 ‘이스라엘 가문’으로 풀어쓰기
  rationale: 히브리어의 בֵּית 반복이 만드는 병행과 공동체적/언약적 뉘앙스를 유지하기 위해 ‘집의’ 구조를 살렸습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy and preservation of source-level parallelism.'
