  lexicon: HALOT
  rationale: 예언자적 소환의 명령형을 살리기 위해 ‘들으십시오’를 택하고, נָא의 간청·촉구 기능은 ‘부디’로 옮겨 공손하지만 절박한 어조를 유지했습니다.
- source_word: רָאשֵׁי בֵּית יַעֲקֹב
