translation:
  language: ko
  text: 부디 이것을 들으십시오[a], 야곱 집의 우두머리들과 이스라엘 집의 통치자들이여, 정의를 혐오하고 모든 바른 것을[b] 비뚤게 만드는 이들이여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이제 이것을 들으십시오.’ 히브리어 נָא는 간청뿐 아니라 촉구를 나타낼 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘올바른 모든 것.’ 히브리어는 문자적으로 ‘모든 바른 것’을 말하며, 뒤의 ‘비뚤게 만드는’과의 대조를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  english_pob_choice: Hear this, please
  chosen_korean: 들으십시오, 부디
  alternatives_korean:
