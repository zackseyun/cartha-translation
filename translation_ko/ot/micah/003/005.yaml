reference: Micah 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל הַ/נְּבִיאִ֖ים הַ/מַּתְעִ֣ים אֶת עַמִּ֑/י הַ/נֹּשְׁכִ֤ים בְּ/שִׁנֵּי/הֶם֙ וְ/קָרְא֣וּ שָׁל֔וֹם וַ/אֲשֶׁר֙ לֹא יִתֵּ֣ן עַל פִּי/הֶ֔ם וְ/קִדְּשׁ֥וּ עָלָ֖י/ו מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/005.yaml
  text: Thus says Yahweh concerning the prophets who lead my people astray[a], who bite with their teeth and cry, “Peace,” but against anyone who does not put something into their mouths[d][c][b], they consecrate war.
  footnotes:
  - marker: a
    text: Literally, “who bite with their teeth.” The image likely depicts predatory prophets who announce well-being when they are fed or paid.
    reason: lexical_alternative
  - marker: b
    text: Literally, “who does not put on their mouth.” The sense is to give them food or payment.
    reason: lexical_alternative
  - marker: c
    text: Or “they declare holy war against him.” The Hebrew says “they consecrate war,” using cultic language for preparing an attack.
    reason: alternative_reading
  - marker: d
    text: Or 'but against anyone who does not put something into their mouths, they consecrate war.'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼께서 내 백성을 그릇된 길로 이끄는 예언자들에 대하여 이렇게 말씀하십니다. “그들은 이로 깨물며 ‘평화’를 외칩니다. 그러나 그들의 입에 무엇인가를 넣어 주지 않는 자에게는 전쟁을 성별합니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “이로 깨무는 자들”입니다. 이는 포식하는 예언자들의 이미지를 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그들의 입에 넣어 주지 않는 자”입니다. 여기서는 먹을 것이나 보수를 주지 않는 경우를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그를 향해 거룩한 전쟁을 선포합니다.” 히브리어는 직역하면 “그를 향해 전쟁을 성별합니다”라고 하며, 제의적 언어로 공격을 준비하는 모습을 나타냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 본문용 기본값에 따라 하나님의 이름을 학술적 음역인 ‘야훼’로 옮겨, מקור 텍스트의 고유한 언약명 성격을 드러냈습니다.
- source_word: הַמַּתְעִים
  english_pob_choice: who lead my people astray
  chosen_korean: 그릇된 길로 이끄는
  alternatives_korean:
  - 미혹하는
  - 잘못된 길로 인도하는
  lexicon: HALOT
  rationale: Hiphil 분사의 인과적 의미를 살려 단순한 ‘속이다’보다 방향성을 가진 ‘그릇된 길로 이끄는’으로 옮겼습니다.
- source_word: הַנֹּשְׁכִים בְּשִׁנֵּיהֶם
  english_pob_choice: who bite with their teeth
  chosen_korean: 이로 깨물고
  alternatives_korean:
  - 이빨로 물고
  - 이로 물고
  lexicon: HALOT
  rationale: ‘이’를 써서 육식성·포식성 이미지를 살리되, 한국어에서 더 자연스러운 동사구로 다듬어 은유의 거칠음을 유지했습니다.
- source_word: וְקָרְאוּ שָׁלוֹם
  english_pob_choice: and cry, “Peace,”
  chosen_korean: 평화를 외치지만
  alternatives_korean:
  - “평화”라고 외치지만
  - 평안을 외치지만
  lexicon: HALOT
  rationale: שָׁלוֹם을 단순 인사보다 예언적 메시지의 내용인 ‘평화’로 옮겼고, ‘외치지만’으로 뒤의 대조를 자연스럽게 연결했습니다.
- source_word: וְקִדְּשׁוּ עָלָיו מִלְחָמָה
  english_pob_choice: they consecrate war against him
  chosen_korean: 전쟁을 성별합니다
  alternatives_korean:
  - 전쟁을 거룩하게 구별합니다
  - 전쟁을 선포합니다
  - 거룩한 전쟁을 선포합니다
  lexicon: HALOT
  rationale: קדש의 제의적·성별 의미를 보존하기 위해 ‘성별하다’를 선택했고, 한국어에서 가장 직접적으로 낯선 긴장감을 드러내는 표현으로 유지했습니다.
theological_decisions:
- issue: ‘전쟁을 성별하다’의 제의적 폭력성 보존
  chosen_reading: 문맥상 단순한 ‘전쟁 선포’로 완화하지 않고 ‘전쟁을 성별합니다’로 직역성을 유지했습니다.
  alternative_readings:
  - 전쟁을 선포합니다
  - 거룩한 전쟁을 준비합니다
  rationale: 예언자들이 금전적/물질적 보상에 따라 메시지를 바꾸는 부패를 고발하는 본문이므로, קדש의 기이한 제의어를 그대로 살려 폭력의 종교화라는 수사적 충격을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
