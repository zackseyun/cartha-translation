translation:
  language: ko
  text: 내 백성의 살을 먹고, 그들의 몸에서 피부를 벗겨 내며,[a] 그들의 뼈를 산산이 부수고, 그들을 솥 안에 든 것처럼, 가마솥 안의 고기처럼 토막 내는 자들입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들 위에서 그들의 피부를 벗겨 내며’입니다. 히브리어 표현은 피부를 몸에서 벗겨 내는 폭력적 이미지를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘솥 안에 있는 것처럼, 가마솥 안의 고기처럼’이라고 병렬합니다. 이는 지도자들의 잔혹한 착취를 그리는 조리 비유입니다.
    reason: lexical_alternative
