  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲשֶׁ֣ר אָכְלוּ֮ שְׁאֵ֣ר עַמִּ/י֒ וְ/עוֹרָ/ם֙ מֵ/עֲלֵי/הֶ֣ם הִפְשִׁ֔יטוּ וְ/אֶת עַצְמֹֽתֵי/הֶ֖ם פִּצֵּ֑חוּ וּ/פָרְשׂוּ֙ כַּ/אֲשֶׁ֣ר בַּ/סִּ֔יר וּ/כְ/בָשָׂ֖ר בְּ/ת֥וֹךְ קַלָּֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/003.yaml
  text: who eat the flesh of my people[a], strip their skin from off them, break their bones in pieces, and chop them up like what is in a pot[b], like meat within a cauldron.
  footnotes:
  - marker: a
    text: Or 'flay their skin from them.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'flesh' earlier in the verse; here 'meat' fits the cooking image.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 백성의 살을 먹고, 그들의 가죽을 벗겨서 그들 위에서 떼어 내며, 그들의 뼈를 부수고, 솥에 있는 것처럼, 가마 속의 고기처럼 잘라 냅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가죽을 벗기다’는 여기서 히브리어의 문자적 표현을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘솥/가마’는 히브리어 조리 비유를 살린 것으로, 앞의 ‘살’과 구별되는 조리용 ‘고기’ 이미지를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאֵר עַמִּי
  english_pob_choice: the flesh of my people
  chosen_korean: 내 백성의 살
  alternatives_korean:
  - 내 백성의 몸
  - 내 백성의 잔존자
  lexicon: HALOT
  rationale: 문맥이 피부, 뼈, 조리 이미지와 함께 인간의 육체를 가리키므로 ‘살’이 가장 직접적입니다.
- source_word: וְעוֹרָם מֵעֲלֵיהֶם הִפְשִׁיטוּ
  english_pob_choice: strip their skin from off them
  chosen_korean: 그들의 가죽을 벗겨서 그들 위에서 떼어 내며
  alternatives_korean:
  - 그들의 피부를 벗겨서 그들에게서 떼어 내며
  - 그들의 가죽을 벗기며
  lexicon: HALOT
  rationale: עוֹר는 사람에게도 ‘피부’가 가능하지만, 학살적·잔혹한 이미지를 살리려면 ‘가죽을 벗기다’가 더 강합니다. ‘from off them’의 공간감을 ‘그들 위에서 떼어 내다’로 반영했습니다.
- source_word: וּפָרְשׂוּ
  english_pob_choice: chop them up
  chosen_korean: 잘라 내며
  alternatives_korean:
  - 토막 내며
  - 절단하여
  lexicon: HALOT
  rationale: 뒤이어 나오는 조리 비유와 연결될 때 단순한 ‘펴다’보다 ‘잘라 내다/토막 내다’가 본문의 폭력을 자연스럽게 드러냅니다.
- source_word: בַּסִּיר / בְּתוֹךְ קַלָּחַת
  english_pob_choice: like what is in a pot ... like meat within a cauldron
  chosen_korean: 솥에 있는 것처럼, 가마 속의 고기처럼
  alternatives_korean:
  - 냄비 속에 있는 것처럼, 가마솥 속의 고기처럼
  - 솥 안의 것처럼, 가마 속 고기처럼
  lexicon: HALOT
  rationale: שר류의 조리 도구 이미지를 한국어로 옮길 때 ‘솥/가마’가 본문의 고대 조리 비유를 가장 잘 보존합니다. ‘고기’는 앞의 ‘살’과 구별되어 조리 재료로 기능합니다.
theological_decisions:
- issue: 예언적 폭력 비유의 강도
  chosen_reading: 실제 식인 행위 주장이라기보다 지도자들의 잔혹한 착취를 고발하는 비유로 보존했습니다.
  alternative_readings:
  - 문자적 식인으로 읽기
  rationale: 본문은 해부학적 표현과 조리 이미지를 결합해 폭력성을 극대화합니다. 한국어에서도 그 충격을 약화시키지 않되, 역사적 사실 주장으로 오독되지 않도록 비유성을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
