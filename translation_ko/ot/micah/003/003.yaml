    rationale: ‘가죽을 벗기다’ 자체가 대상의 몸에서 벗겨 냄을 뜻하므로 ‘그들 위에서 떼어 내다’는 한국어에서 의미상 중첩됩니다. 더구나 사람에게 ‘가죽’은 동물 가죽의 뜻으로도 쉽게 읽힙니다. 원문의 피부 벗김 이미지는 ‘그들의 몸에서 피부를 벗겨 내며’로 정확하고 자연스럽게 표현됩니다.
  - severity: medium
