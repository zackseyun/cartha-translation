  verdict: revise
  source_fidelity: ‘그들의 가죽을 벗겨서 그들 위에서 떼어 내며’는 히브리어 מֵעֲלֵיהֶם(‘그들 위에서/그들에게서’)를 기계적으로 중복 재현하여 한국어 문장 구조상 부자연스럽습니다. ‘몸에서 피부를 벗겨 내며’가 עור와 פשט의 의미 및 폭력적 비유를 정확하고 자연스럽게 옮깁니다. 또한 קַלָּחַת은 조리 용기이므로 ‘가마’보다 ‘가마솥’이 적절합니다. וּפָרְשׂוּ의 목적어를 한국어에서 명시하여 조리 비유의 대상이 사람들임을 분명히 했습니다.
  naturalness: 수정문은 원문의 계속되는 관계절을 한국어의 ‘…하는 자들입니다’로 완결하면서도 미가 3:2의 지도자 고발을 자연스럽게 이어 갑니다. ‘몸 위에서 떼어 내다’와 ‘가마 속’ 같은 어색하거나 오해 가능한 표현을 피하고, ‘솥 안에 든 것’과 ‘가마솥 안의 고기’라는 병렬을 보존했습니다.
  terminology: שְׁאֵר는 문맥상 ‘살’, עור는 사람의 피부를 가리키므로 ‘피부’, עֲצָמוֹת는 ‘뼈’, בָּשָׂר는 조리 비유 안에서 ‘고기’로 옮겼습니다. ‘가마솥’은 칼라하트의 조리 용기 이미지를 보존하며, 실제 식인이라는 역사적 진술로 확대하지 않고 예언적 착취 비유의 잔혹함을 유지합니다.
