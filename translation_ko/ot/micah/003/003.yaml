  rationale: 뒤이어 나오는 조리 비유와 연결될 때 단순한 ‘펴다’보다 ‘잘라 내다/토막 내다’가 본문의 폭력을 자연스럽게 드러냅니다.
- source_word: בַּסִּיר / בְּתוֹךְ קַלָּחַת
  english_pob_choice: like what is in a pot ... like meat within a cauldron
  chosen_korean: 솥에 있는 것처럼, 가마 속의 고기처럼
