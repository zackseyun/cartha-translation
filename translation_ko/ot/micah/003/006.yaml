  rationale: 본문은 거짓 예언 행위를 심판하는 맥락이므로, 한국 교회 전통어인 ‘선지자’보다 중립적이고 원문 중심적인 ‘예언자들’이 더 적합합니다.
  doctrine_reference: 예언의 남용과 하나님의 심판에 대한 문맥적 해석
