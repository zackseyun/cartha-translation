  rationale: מִן의 박탈 의미를 한국어에서는 ‘없으므로’로 풀어 주어, 예언자들이 계시적 환상을 상실한 상태를 분명히 드러냅니다.
- source_word: מִקְּסֹם
  english_pob_choice: without divination
