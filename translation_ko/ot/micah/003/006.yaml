  yaml_path: translation/ot/micah/003/006.yaml
  text: Therefore it will be night for you[a], without vision, and darkness for you, without divination; the sun will go down on the prophets[b], and the day will grow dark over them.
  footnotes:
  - marker: a
    text: 'Or ''from vision'' / ''from divination''; the Hebrew preposition can be rendered more literally, but here likely means deprivation: ''without vision'' and ''without divination.'''
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the sun will come on the prophets'; the idiomatic sense is that it will set or go down on them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희에게는 환상을 보지 못할 밤이 되고[a], 점을 치지 못할 어둠이 될 것입니다. 예언자들 위로 해가 질 것이며[b], 날이 그들 위에서 어두워질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘환상으로부터 / 점치는 일로부터’라고도 할 수 있습니다. 히브리어 전치사 מִן은 여기서 박탈의 뜻으로 이해되어, ‘환상을 보지 못할’과 ‘점을 치지 못할’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘해가 예언자들 위에 올 것이다’이지만, 여기서는 해와 함께 쓰인 관용적 표현으로 ‘해가 지다’라는 뜻입니다.
    reason: lexical_alternative
