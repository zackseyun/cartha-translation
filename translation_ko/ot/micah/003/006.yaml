  lexicon: HALOT
  rationale: קסם은 예언적 대립 구문에서 ‘점복/점술’의 영역을 가리키므로, 비슷한 어감의 ‘점복’으로 옮겨 선명한 대조를 유지했습니다.
- source_word: וּבָאָה הַשֶּׁמֶשׁ עַל הַנְּבִיאִים
