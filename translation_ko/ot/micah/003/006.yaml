  lexicon: HALOT
  rationale: 앞선 책망과 심판 선언의 결과를 나타내는 연결어로, 문맥적 인과를 자연스럽게 살리는 표준적 표현입니다.
- source_word: מֵחָזוֹן
  english_pob_choice: without vision
