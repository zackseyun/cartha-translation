  chosen_korean: 해는 예언자들 위로 지고
  alternatives_korean:
  - 해가 예언자들 위에 지고
  - 해가 예언자들에게 지고
  lexicon: HALOT
  rationale: 동사 בוא의 직역 ‘오다’보다, 해와 함께 쓰일 때의 관용적 의미인 ‘지다’가 심판 이미지와 더 정확히 맞습니다.
theological_decisions:
