lexical_decisions:
- source_word: בֹּנֶה
  english_pob_choice: who builds
  chosen_korean: 세우는 자
  alternatives_korean:
  - 짓는 자
  - 건설하는 자
  lexicon: HALOT
  rationale: 분사형을 한국어에서 자연스러운 현재분사적 표현인 ‘세우는 자’로 옮겨, 앞뒤 문맥의 책망 대상이 되는 성격을 유지했습니다.
- source_word: צִיּוֹן
  english_pob_choice: Zion
  chosen_korean: 시온
  alternatives_korean:
  - 지온
  lexicon: HALOT
  rationale: 지명은 통용되는 음역 ‘시온’을 사용했습니다.
- source_word: בְּדָמִים
  english_pob_choice: with bloodshed
  chosen_korean: 피로
  alternatives_korean:
  - 피흘림으로
  - 피로써
  - 피 흘림으로
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘피들’은 여기서 문자적 재료가 아니라 폭력적 수단을 가리키므로, ‘피로’라고 옮겨 혈살의 뉘앙스를 간결하게 살렸습니다.
- source_word: בְּעַוְלָה
  english_pob_choice: with injustice
  chosen_korean: 불의로
  alternatives_korean:
  - 부정으로
  - 불공정하게
  - 불법으로
  lexicon: HALOT
  rationale: עַוְלָה의 핵심 의미를 한국어로 가장 직접적으로 드러내는 ‘불의’를 택해, 미가 3장의 법정적·윤리적 책망을 살렸습니다.
theological_decisions:
- issue: ‘blood’의 관용적 의미 처리
  chosen_reading: 이 구절은 시온과 예루살렘이 문자 그대로 피로 지어졌다는 뜻이 아니라, 폭력과 살육을 통해 세워졌다는 고발로 읽었습니다.
  alternative_readings:
  - ‘피로’라는 표현을 유지하되 관용적 의미를 각주로만 설명할 수 있습니다.
  rationale: 영어 POB의 주해와 히브리어 복수형 사용을 따라, 오해를 부를 수 있는 문자주의보다 예언적 고발의 실질을 드러내는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: 예언서의 심판 선포와 언약적 사회정의
- issue: 문장 형식
  chosen_reading: 히브리어 분사구를 한국어의 호격이 아닌 ‘…하는 자’ 구조로 옮겨, 책망의 직접성과 서술성을 함께 유지했습니다.
  alternative_readings:
  - ‘…하는 너희’로 보다 직접적으로 옮길 수도 있습니다.
  rationale: 원문의 분사적 표지가 만드는 유형화된 고발을 한국어에서 자연스럽게 재현하기 위한 선택입니다.
  doctrine_reference: 예언 문학의 수사
