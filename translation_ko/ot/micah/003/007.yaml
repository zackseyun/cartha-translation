  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בֹ֣שׁוּ הַ/חֹזִ֗ים וְ/חָֽפְרוּ֙ הַ/קֹּ֣סְמִ֔ים וְ/עָט֥וּ עַל שָׂפָ֖ם כֻּלָּ֑/ם כִּ֛י אֵ֥ין מַעֲנֵ֖ה אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/007.yaml
  text: The seers will be put to shame[a], and the diviners will be disgraced; all of them will cover their lips, because there is no answer from God.
  footnotes:
  - marker: a
    text: Or 'cover the upper lip' or 'cover the mustache,' likely a gesture of shame, mourning, or uncleanness.
    reason: lexical_alternative
translation:
  language: ko
  text: 선견자들은 부끄러움을 당하고, 점치는 자들은 수치를 당할 것입니다. 그들은 모두 입술을 가릴 것입니다[a]. 이는 하나님께로부터 답이 없기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘입술을 가리다’는 직역입니다. 여기에는 윗입술이나 수염을 가리는 몸짓, 곧 수치·애도·부정함을 나타내는 행동일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֹשׁוּ הַחֹזִים
  english_pob_choice: The seers will be put to shame
  chosen_korean: 선견자들은 부끄러움을 당할 것입니다
  alternatives_korean:
  - 보는 자들은 부끄러움을 당할 것입니다
  - 예언자들은 부끄러움을 당할 것입니다
  lexicon: HALOT
  rationale: חֹזִים은 환시를 보는 예언적 인물을 가리키므로, 문맥을 살려 ‘선견자들’로 옮겼습니다. בוש의 결과 상태는 ‘부끄러움을 당하다’가 자연스럽고 수동적 의미를 잘 드러냅니다.
- source_word: וְחָפְרוּ הַקֹּסְמִים
  english_pob_choice: and the diviners will be disgraced
  chosen_korean: 점치는 자들은 수치를 당할 것입니다
  alternatives_korean:
  - 점술가들은 수치를 당할 것입니다
  - 점술하는 자들은 수치를 당할 것입니다
  lexicon: HALOT
  rationale: קסם은 점술/주술적 점침을 뜻하므로 중립화하지 않고 ‘점치는 자들’로 옮겼습니다. חפר는 공적 수치의 뉘앙스가 있어 ‘수치를 당하다’가 문맥에 맞습니다.
- source_word: וְעָטוּ עַל שָׂפָם
  english_pob_choice: they will cover their lips
  chosen_korean: 그들은 모두 입술을 가릴 것입니다[a]
  alternatives_korean:
  - 그들은 모두 윗입술을 가릴 것입니다
  - 그들은 모두 수염 위를 가릴 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 본문에서는 직역에 가깝게 유지하고, 구체적 제스처 가능성은 각주로 처리했습니다. ‘입술을 가리다’는 수치·애도·부정함의 몸짓을 과도한 해석 없이 보존합니다.
- source_word: אֵין מַעֲנֵה אֱלֹהִים
  english_pob_choice: there is no answer from God
  chosen_korean: 하나님께로부터 답이 없기 때문입니다
  alternatives_korean:
  - 하나님께로부터 대답이 없기 때문입니다
  - 하나님에게서 응답이 없기 때문입니다
  lexicon: HALOT
  rationale: מענה는 ‘답/대답/응답’이 가능하지만, 여기서는 예언적 맥락에 맞게 짧고 현대적인 ‘답’으로 옮겼습니다. אֱלֹהִים은 문맥상 참하나님을 가리키므로 ‘하나님께로부터’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 마지막 절의 의미를 ‘하나님의 침묵’으로 유지할지, ‘참된 예언의 부재’로 풀어 쓸지
  chosen_reading: ‘하나님께로부터 답이 없기 때문입니다’로 유지하여, 거짓 선견자와 점술가들의 수치가 하나님의 실제 응답 부재로 폭로된다는 점을 드러냅니다.
  alternative_readings:
  - 참된 신탁이 없기 때문입니다
  - 하나님이 응답하지 않으시기 때문입니다
  rationale: 본문은 그들의 능력 부족보다, 그들이 내세우는 권위가 하나님으로부터 오지 않음이 드러나는 상황을 말합니다. 따라서 신학적 긴장을 줄이지 않으면서도 자연스러운 한국어로 옮겼습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
