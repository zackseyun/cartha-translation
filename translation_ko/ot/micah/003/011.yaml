id: MIC.3.11
reference: Micah 3:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָאשֶׁ֣י/הָ בְּ/שֹׁ֣חַד יִשְׁפֹּ֗טוּ וְ/כֹהֲנֶ֨י/הָ֙ בִּ/מְחִ֣יר יוֹר֔וּ וּ/נְבִיאֶ֖י/הָ בְּ/כֶ֣סֶף יִקְסֹ֑מוּ וְ/עַל יְהוָה֙ יִשָּׁעֵ֣נוּ לֵ/אמֹ֔ר הֲ/ל֤וֹא יְהוָה֙ בְּ/קִרְבֵּ֔/נוּ לֹֽא תָב֥וֹא עָלֵ֖י/נוּ רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/011.yaml
  text: Her leaders judge for a bribe[a], and her priests teach for a price, and her prophets practice divination for silver; yet they lean on Yahweh, saying[b], “Is not Yahweh in our midst? No disaster will come upon us.”
  footnotes:
  - marker: a
    text: Or “rely on the LORD.” The Hebrew verb carries the image of leaning on someone for support.
    reason: lexical_alternative
  - marker: b
    text: Or “No calamity will come upon us.” The Hebrew word can mean evil in a broad sense, but here it refers to coming disaster or judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 지도자들은 뇌물을 받고 재판하고, 그의 제사장들은 값을 받고 가르치며, 그의 예언자들은 은을 받고 점을 칩니다. 그러나 그들은 야훼를 의지하며 말합니다. 「야훼께서 우리 가운데 계시지 않느냐? 재앙이 우리에게 닥치지 않을 것이다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֶׁיהָ / בְּשֹׁחַד יִשְׁפֹּטוּ
  english_pob_choice: Her leaders judge for a bribe
  chosen_korean: 그의 지도자들은 뇌물을 받고 재판하고
  alternatives_korean:
  - 그의 우두머리들은 뇌물을 받고 판결하고
  - 그의 통치자들은 뇌물을 받고 재판하고
  lexicon: HALOT
  rationale: רֹאשׁ의 관용적 의미를 ‘지도자들’로 옮기고, בְּשֹׁחַד의 부패한 동기를 ‘뇌물을 받고’로 자연스럽게 드러냈습니다.
- source_word: כֹהֲנֶיהָ / בִּמְחִיר יוֹרוּ
  english_pob_choice: her priests teach for a price
  chosen_korean: 그의 제사장들은 값을 받고 가르치며
  alternatives_korean:
  - 그의 제사장들은 보수를 받고 가르치며
  - 그의 제사장들은 대가를 받고 율법을 가르치며
  lexicon: HALOT
  rationale: כֹהֲנִים의 직분을 한국어 성경에서 자연스러운 ‘제사장들’로 옮기고, בִּמְחִיר의 상업적 뉘앙스를 ‘값을 받고’로 유지했습니다.
- source_word: וּנְבִיאֶיהָ בְּכֶסֶף יִקְסֹמוּ
  english_pob_choice: her prophets practice divination for silver
  chosen_korean: 그의 예언자들은 은을 받고 점을 칩니다
  alternatives_korean:
  - 그의 예언자들은 돈을 받고 점을 칩니다
  - 그의 예언자들은 은을 받고 점쟁이 노릇을 합니다
  lexicon: HALOT
  rationale: קסם은 단순한 예언이 아니라 금지된 점술이므로 ‘점을 칩니다’로 분명히 했고, כֶּסֶף의 구체성을 살려 ‘은’으로 옮겼습니다.
- source_word: וְעַל יְהוָה יִשָּׁעֵנוּ
  english_pob_choice: yet they lean on Yahweh
  chosen_korean: 그러나 그들은 야훼를 의지하며
  alternatives_korean:
  - 그런데도 그들은 야훼에 기대며
  - 그러나 그들은 야훼를 붙들며
  lexicon: HALOT
  rationale: שׁען의 비유적 의미를 ‘의지하다’로 자연스럽게 살리되, 앞선 부패와의 강한 대비는 ‘그러나’로 드러냈습니다.
- source_word: רָעָה
  english_pob_choice: No disaster will come upon us
  chosen_korean: 재앙이 우리에게 닥치지 않을 것이다
  alternatives_korean:
  - 재난이 우리에게 닥치지 않을 것이다
  - 악이 우리에게 닥치지 않을 것이다
  lexicon: HALOT
  rationale: 문맥상 רָעָה는 도덕적 악이 아니라 임박한 심판/재난을 가리키므로 ‘재앙’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명기적 고유명사를 제목이 아닌 이름으로 보존하기 위해 ‘야훼’를 사용했습니다. 이는 본문이 의도한 언약적 호칭을 직접 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 마지막 절의 רָעָה의 의미
  chosen_reading: 재앙
  alternative_readings:
  - 악
  - 재난
  rationale: 화자들은 임박한 심판을 부정하므로, 여기서 רָעָה는 도덕적 악이 아니라 닥칠 심판의 재앙을 뜻합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
