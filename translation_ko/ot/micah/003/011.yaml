revisions:
- from: 그의 지도자들은 뇌물을 받고 재판하고, 그의 제사장들은 값을 받고 가르치며, 그의 예언자들은 은을 받고 점을 칩니다. 그러나 그들은 야훼를 의지하며 말합니다. 「야훼께서 우리 가운데 계시지 않느냐? 재앙이 우리에게 닥치지 않을 것이다.」
  to: 그 성의 지도자들은 뇌물을 받고 판결을 내리며, 그 성의 제사장들은 값을 받고 가르치고, 그 성의 예언자들은 은을 받고 점을 칩니다. 그런데도 그들은 야훼를 의지하면서 말합니다. “야훼께서 우리 가운데 계시지 않습니까? 재앙이 우리에게 닥치지 않을 것입니다.”
  rationale: 도성을 가리키는 히브리어 여성 단수 소유 접미사를 한국어에서 자연스럽고 명확하게 ‘그 성의’로 반영했습니다. ‘판결을 내리다’는 사법적 שׁפט의 의미를 더 직접적으로 드러냅니다. 나머지 핵심 어휘와 본문의 아이러니는 유지했으며, 인용문을 합쇼체로 조정했습니다. 별도 각주는 본문 의미를 보충하는 데 필수적이지 않으므로 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:43:04Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 세 부류(지도자·제사장·예언자), 각 부류의 부패한 동기, 야훼를 의지한다는 아이러니, 그리고 임박한 재앙을 부정하는 수사 의문문을 대체로 충실히 옮겼습니다. 다만 여성 단수 접미사로 표시되는 예루살렘/도성의 소유 관계를 선행사 없이 남성 인칭으로 읽히기 쉬운 ‘그의’로 반복한 것은 한국어에서 부정확하고 어색합니다.
  naturalness: ‘그의 지도자들’은 현행 한국어에서 남성 소유자를 연상시키며, 본문의 도성 지시와도 잘 맞지 않습니다. ‘그 성의’로 명시하면 문맥상 지시 대상이 분명해집니다. 또한 지정된 합쇼체에 맞추어 인용문 종결을 ‘않습니까/않을 것입니다’로 통일하는 편이 적절합니다.
  terminology: ‘야훼’, ‘제사장’, ‘예언자’, ‘점을 치다’, ‘재앙’은 각각 יהוה, כֹּהֵן, נָבִיא, קסם, רָעָה의 문맥상 의미를 적절히 반영합니다. ‘은’도 כֶּסֶף의 구체적 표현을 보존합니다.
  issues:
  - severity: medium
    issue: ‘그의’의 지시 대상 및 성별 오해 가능성
    rationale: 히브리어의 3인칭 여성 단수 접미사는 문맥상 예루살렘/도성을 가리킵니다. 한국어 ‘그의’는 보통 남성 인칭 소유를 뜻하고 선행사도 없어 자연스럽지 않습니다. ‘그 성의’로 옮겨 소유 관계와 문맥을 분명히 해야 합니다.
  - severity: low
    issue: 인용문의 종결 어미가 합쇼체와 불일치
    rationale: 본문 서술은 ‘말합니다’인데 인용문은 ‘않느냐/것이다’로 끝납니다. 요청된 현대 공식-공손 합쇼체에 맞춰 ‘않습니까/않을 것입니다’로 통일하는 것이 좋습니다.
