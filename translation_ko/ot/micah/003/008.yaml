id: MIC.3.8
reference: Micah 3:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אוּלָ֗ם אָנֹכִ֞י מָלֵ֤אתִי כֹ֨חַ֙ אֶת ר֣וּחַ יְהוָ֔ה וּ/מִשְׁפָּ֖ט וּ/גְבוּרָ֑ה לְ/הַגִּ֤יד לְ/יַֽעֲקֹב֙ פִּשְׁע֔/וֹ וּ/לְ/יִשְׂרָאֵ֖ל חַטָּאתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/008.yaml
  text: But as for me[a], I am filled with power, with the Spirit of Yahweh, and with justice and might[b], to declare to Jacob his transgression and to Israel his sin.
  footnotes:
  - marker: a
    text: Or, 'I am filled with power by the Spirit of the LORD, and with justice and might.' The Hebrew sequence may be understood either as a list of what fills the prophet or as identifying the Spirit of the LORD as the source of that power.
    reason: alternative_reading
  - marker: b
    text: '''Transgression'' can also be rendered ''rebellion,'' highlighting defiance against God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 권능과 야훼의 영과 정의와 능력으로 충만하여,[a] 야곱에게 그의 반역을[b], 이스라엘에게 그의 죄를 선포합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 야훼의 영으로 권능을 입고, 정의와 능력으로 충만하다”로도 이해할 수 있습니다. 히브리어의 연결은 선지자가 무엇으로 충만한지의 목록일 수도 있고, ‘야훼의 영’이 그 권능의 근원임을 나타낼 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘반역’은 ‘반항’ 또는 ‘배반’으로도 옮길 수 있으며, 하나님께 대한 적극적인 저항의 뜻을 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם / אָנֹכִי
  english_pob_choice: But as for me
  chosen_korean: 그렇지만 나는
  alternatives_korean:
  - 그러나 나는
  - 하지만 나는
  - 그런데 나는
  lexicon: HALOT
  rationale: 대조를 분명히 하면서 אָנֹכִי의 강조를 한국어 주어 ‘나는’으로 살렸습니다.
- source_word: מָלֵאתִי כֹחַ אֶת רוּחַ יְהוָה
  english_pob_choice: I am filled with power, with the Spirit of Yahweh
  chosen_korean: 야훼의 영과 권능으로 충만하며
  alternatives_korean:
  - 야훼의 영과 능력으로 가득하며
  - 야훼의 영으로 권능을 입어
  - 야훼의 영과 능력으로 채워져
  lexicon: HALOT
  rationale: ‘충만하다’는 결과 상태를 자연스럽게 살리고, אֶת רוּחַ יְהוָה는 단순한 수단보다 동반/내용의 관계로 읽어 ‘과’로 연결했습니다.
- source_word: וּמִשְׁפָּט וּגְבוּרָה
  english_pob_choice: with justice and might
  chosen_korean: 정의와 용기로 가득합니다
  alternatives_korean:
  - 정의와 능력으로 가득합니다
  - 정의와 힘으로 충만합니다
  - 정의와 권능으로 가득합니다
  lexicon: HALOT
  rationale: מִשְׁפָּט은 여기서 윤리적·재판적 분별을 살려 ‘정의’로, גְבוּרָה는 선지자적 담대함을 드러내는 ‘용기’로 옮겼습니다.
- source_word: לְהַגִּיד לְיַעֲקֹב פִּשְׁעוֹ וּלְיִשְׂרָאֵל חַטָּאתוֹ
  english_pob_choice: to declare to Jacob his transgression and to Israel his sin
  chosen_korean: 그래서 야곱에게 그의 반역을, 이스라엘에게 그의 죄를 선포하려 합니다
  alternatives_korean:
  - 야곱에게 그의 범죄를, 이스라엘에게 그의 죄를 알리려 합니다
  - 야곱에게 그의 반역을, 이스라엘에게 그의 죄를 선언하려 합니다
  - 야곱에게 그의 허물을, 이스라엘에게 그의 죄를 선포하려 합니다
  lexicon: HALOT
  rationale: לְהַגִּיד는 공적 선포의 뉘앙스를 살려 ‘선포하다’로, פִּשְׁעוֹ는 POB의 주석 가능성을 반영해 ‘반역’으로 두었습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 히브리어 신명을 직역 대체하지 않고 고유명사로 드러내는 프로젝트 원칙에 따라 ‘야훼’를 사용했습니다.
  doctrine_reference: 'Translation philosophy #3'
- issue: רוּחַ יְהוָה의 의미
  chosen_reading: 하나님의 영, 곧 야훼의 영으로 읽음
  alternative_readings:
  - 단순한 영감
  - 권능을 주는 어떤 태도
  rationale: 선지자적 권능 부여 문맥이므로 추상적 동기나 태도가 아니라 하나님의 영을 가리키는 것으로 옮겼습니다.
  doctrine_reference: Prophetic empowerment context
