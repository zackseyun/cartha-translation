  naturalness: ‘권능과 야훼의 영과 정의와 능력으로 충만하여’는 현대 한국어의 격식 있는 성경 문체로 자연스럽고, ‘선포합니다’는 합쇼체에 맞습니다. 반복되는 ‘과’는 원문의 나열을 보존하기 위한 것입니다.
  terminology: יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 유지합니다. רוּחַ יְהוָה는 ‘야훼의 영’으로, מִשְׁפָּט은 ‘정의’로, פֶּשַׁע는 문맥상 ‘반역’으로 옮깁니다. כֹחַ와 גְבוּרָה는 각각 ‘권능’과 ‘능력’으로 구별하되, 양자의 의미 범위가 겹칠 수 있음을 인정합니다.
