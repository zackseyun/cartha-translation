  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. 그러나 현재의 ‘너희의 할 일이 아니냐?’는 합쇼체 문장 안에서 종결법이 일관되지 않고, 히브리어의 수사 의문문과 지도자들의 책임이라는 의미를 현대 표준 한국어로 더 자연스럽게 드러낼 수 있습니다.
  naturalness: ‘들으십시오’와 ‘통치자들아/아니냐’의 결합은 현대 formal-polite 합쇼체에서 어조가 섞여 다소 부자연스럽습니다. 호격을 주어형으로 바꾸고 의문 종결을 ‘아니겠습니까?’로 통일하는 것이 자연스럽습니다.
  terminology: ‘야곱’, ‘이스라엘 집’, ‘우두머리들’, ‘통치자들’, ‘정의’는 문맥과 용어상 적절합니다. 각주에서 מִשְׁפָּט의 의미 범위는 ‘옳은 것의 범위’보다 ‘옳은 것’을 병렬적으로 제시하는 편이 정확하고 자연스럽습니다.
