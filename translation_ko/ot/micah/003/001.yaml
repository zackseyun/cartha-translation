source:
  edition: WLC
  text: וָ/אֹמַ֗ר שִׁמְעוּ נָא֙ רָאשֵׁ֣י יַעֲקֹ֔ב וּ/קְצִינֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הֲ/ל֣וֹא לָ/כֶ֔ם לָ/דַ֖עַת אֶת הַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/001.yaml
  text: 'And I said[a], “Hear now, heads of Jacob and rulers of the house of Israel: is it not for you to know justice?”'
  footnotes:
  - marker: a
    text: Or “judgment.” The Hebrew mishpat can denote legal judgment, justice, or what is right.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 말했습니다. “이제 들으십시오, 야곱의 우두머리들과 이스라엘 집의 통치자들아. 정의를 아는 것이 너희의 할 일이 아니냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정의’ 또는 ‘심판’으로도 옮길 수 있습니다. 히브리어 מִשְׁפָּט은 법적 판결, 정의, 옳은 것의 범위를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: And I said
  chosen_korean: 내가 말했습니다
  alternatives_korean:
  - 그리고 내가 말했습니다
  - 그때 내가 말했습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 이어 주면서도 히브리어 וְ + אמר의 단순한 연결감을 살리기 위해 과도한 시간 부사 없이 옮겼습니다.
- source_word: שִׁמְעוּ נָא
  english_pob_choice: Hear now
  chosen_korean: 이제 들으십시오
  alternatives_korean:
  - 들으십시오
  - 부디 들으십시오
  lexicon: HALOT
  rationale: שׁמע의 명령형을 한국어의 직접적인 청유/명령인 ‘들으십시오’로 옮기고, נָא의 긴급한 호소를 ‘이제’로 반영했습니다.
- source_word: רָאשֵׁי יַעֲקֹב וּקְצִינֵי בֵּית יִשְׂרָאֵל
  english_pob_choice: heads of Jacob ... rulers of the house of Israel
  chosen_korean: 야곱의 우두머리들과 이스라엘 집의 통치자들
  alternatives_korean:
  - 야곱의 지도자들과 이스라엘 집의 관리들
  - 야곱의 머리들과 이스라엘 집의 우두머리들
  lexicon: HALOT
  rationale: ‘heads’의 은유를 한국어에서도 이해 가능한 ‘우두머리들’로 살리고, 병행되는 קְצִינֵי는 권한을 가진 통치자라는 뜻을 살려 ‘통치자들’로 옮겼습니다.
- source_word: הַמִּשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 판결
  - 의
  lexicon: HALOT
  rationale: 이 문맥은 지도자들의 공적 책임을 책망하는 자리이므로, 법정적 판결보다 공적·윤리적 책임을 드러내는 ‘정의’가 가장 자연스럽습니다.
theological_decisions:
- issue: מִשְׁפָּט의 범위와 한국어 선택
  chosen_reading: ‘정의’로 옮기되, 재판 행위만이 아니라 통치자들이 알아야 할 올바름과 공적 책임을 함께 드러냅니다.
  alternative_readings:
  - ‘심판’으로 좁혀 이해하기
  - ‘판결’로 법정 의미를 강조하기
  rationale: 본문은 단순한 법적 판결 지식이 아니라 지도층이 마땅히 알아야 할 공적 의무를 묻고 있으므로, 한국어에서도 윤리·사법적 폭을 함께 담는 표현이 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
