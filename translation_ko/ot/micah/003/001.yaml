revisions:
- from: 내가 말했습니다. “이제 들으십시오, 야곱의 우두머리들과 이스라엘 집의 통치자들아. 정의를 아는 것이 너희의 할 일이 아니냐?”[a]
  to: 내가 말했습니다. “야곱의 우두머리들과 이스라엘 집의 통치자들은 이제 들으십시오. 정의를 아는 것은 여러분이 마땅히 해야 할 일이 아니겠습니까?”[a]
  rationale: 히브리어 הֲלוֹא לָכֶם לָדַעַת의 수사 의문과 책임의 뉘앙스를 ‘여러분이 마땅히 해야 할 일이 아니겠습니까?’로 옮겼습니다. 이는 원문의 긍정 답변을 예상하는 책망을 보존하면서 현대 표준어 합쇼체를 일관되게 유지합니다. ‘정의’는 문맥상 적절히 유지하되, 각주에서 מִשְׁפָּט의 법적·윤리적 의미 범위를 자연스럽게 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:43:30Z'
