id: MIC.3.4
reference: Micah 3:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֚ז יִזְעֲק֣וּ אֶל יְהוָ֔ה וְ/לֹ֥א יַעֲנֶ֖ה אוֹתָ֑/ם וְ/יַסְתֵּ֨ר פָּנָ֤י/ו מֵ/הֶם֙ בָּ/עֵ֣ת הַ/הִ֔יא כַּ/אֲשֶׁ֥ר הֵרֵ֖עוּ מַעַלְלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/004.yaml
  text: Then they will cry out to Yahweh[a], but he will not answer them; he will hide his face from them at that time, because they made their deeds evil.
  footnotes:
  - marker: a
    text: Or, 'because they acted wickedly in their deeds.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그들은 야훼께 부르짖겠지만, 그는 그들에게 대답하지 않으실 것입니다. 그 시기에 그는 그들에게서 자기 얼굴을 감추실 것이니, 이는 그들이 자기 행실을 악하게 만들었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그들이 자기 행실을 악하게 만들었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그 후
  - 그때에
  lexicon: HALOT
  rationale: 앞선 경고의 결과를 나타내는 시간 부사이므로, 현대 한국어에서 자연스럽고 결론적 흐름을 살리는 ‘그때’를 택했습니다.
- source_word: יִזְעֲקוּ
  english_pob_choice: they will cry out
  chosen_korean: 부르짖겠지만
  alternatives_korean:
  - 외치겠지만
  - 소리치겠지만
  lexicon: HALOT
  rationale: זקע는 단순한 호출보다 절박한 도움의 외침을 뜻하므로, 예언서 문맥에 맞는 ‘부르짖다’를 사용했습니다.
- source_word: וְיַסְתֵּר פָּנָיו מֵהֶם
  english_pob_choice: he will hide his face from them
  chosen_korean: 자기 얼굴을 감추실 것이니
  alternatives_korean:
  - 그들에게서 얼굴을 숨기실 것이니
  - 그들에게서 자기 얼굴을 가리실 것이니
  lexicon: HALOT
  rationale: ‘얼굴을 감추다’는 언약적 거절을 나타내는 성경적 관용구이므로, 의미를 풀어 쓰기보다 이미지 자체를 유지했습니다.
- source_word: הֵרֵעוּ מַעַלְלֵיהֶם
  english_pob_choice: because they made their deeds evil
  chosen_korean: 그들이 자기 행실을 악하게 만들었기 때문입니다
  alternatives_korean:
  - 그들이 악한 행실을 했기 때문입니다
  - 그들의 행실이 악했기 때문입니다
  lexicon: HALOT
  rationale: הֵרֵעוּ의 사역적 뉘앙스를 살려 ‘악하게 만들다’로 옮겨, 단순한 상태 진술로 평탄화하지 않았습니다.
theological_decisions:
- issue: 하나님의 ‘얼굴을 감추심’이라는 인격적 표현
  chosen_reading: 이미지를 그대로 살려 하나님의 응답 거절과 임재 철회를 함께 드러냈습니다.
  alternative_readings:
  - 그들에게서 등을 돌리실 것입니다
  - 그들에게서 은혜를 거두실 것입니다
  rationale: 이 관용구는 단순한 침묵보다 더 강한 언약적 심판을 가리키므로, 본문이 지닌 신학적 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
- issue: 죄의 원인을 ‘행실을 악하게 만들었다’로 옮긴 처리
  chosen_reading: 행위 자체를 악으로 만드는 책임성을 드러내도록 번역했습니다.
  alternative_readings:
  - 그들이 악하게 행했기 때문입니다
  - 그들의 행실이 악했기 때문입니다
  rationale: 히브리어는 결과 상태보다 행위의 도덕적 구성에 초점을 두므로, 원문의 비난 강도를 약화시키지 않기 위해 사역적 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §1, original-language primacy over translation tradition
