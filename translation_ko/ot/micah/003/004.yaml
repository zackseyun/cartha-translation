  to: 그때 그들은 야훼께 부르짖겠지만, 그분은 그들에게 대답하지 않으실 것입니다. 그때에 그분은 그들에게서 얼굴을 감추실 것입니다. 이는 그들이 그들의 행실을 악하게 하였기 때문입니다.[a]
  rationale: 사역 동사 הֵרֵעוּ와 그 목적어 מַעַלְלֵיהֶם의 관계를 ‘그들의 행실을 악하게 하였다’로 보존하되, 한국어의 자연스러운 표현으로 다듬었습니다. 또한 중복된 시간 표현을 ‘그때/그때에’로 유지하고, 무의미하게 반복된 각주를 실제 어휘적 번역 대안으로 바꾸었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:44:41Z'
