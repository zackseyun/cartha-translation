revisions:
- from: 그의 새긴 우상들은 모두 부서지고[a], 그의 창녀의 삯은 모두 불에 타 버릴 것입니다. 또 그의 우상들은 모두 내가 황폐하게 만들겠습니다. 이는 창녀의 삯으로 그가 그것들을 모았고[b], 창녀의 삯으로 그것들이 다시 돌아갈 것이기 때문입니다[c].
  to: 사마리아의 새긴 형상들은 모두 부서지고[a], 사마리아가 창녀로서 받은 모든 삯은 불에 타 버릴 것입니다. 그 모든 우상을 내가 폐허로 만들겠습니다. 사마리아가 창녀로서 받은 삯으로 그것들을 모았으니[b], 그것들은 다시 창녀의 삯이 될 것입니다[c].
  rationale: 사마리아를 명시하여 히브리어 여성형의 의인화와 성매매 은유를 보존하고, ‘그의 창녀의 삯’이 낳는 한국어의 소유 관계 혼동을 제거했습니다. 마지막 절은 기본 본문에서 ‘다시 창녀의 삯이 될 것입니다’로 옮겨 יָשׁוּבוּ의 회귀 의미를 자연스럽게 드러내고, 직역적 ‘돌아갈 것입니다’는 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:49:13Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안의 ‘그의’는 여성 단수 접미사(사마리아를 여성으로 의인화함)를 남성으로 오해하게 하며, 특히 ‘그의 창녀의 삯’은 ‘그가 소유한 창녀의 삯’처럼 읽힐 수 있습니다. אֶתְנַנֶּיהָ는 사마리아가 창녀로서 얻은 삯이라는 비유를 가리킵니다. 또한 עֲצַבֶּיהָ는 앞의 새긴 형상들과 의도적으로 겹치는 우상들을 가리키므로 ‘우상들’로 유지할 수 있습니다.
  naturalness: ‘사마리아가 창녀로서 받은 삯’은 한국어에서 소유 관계의 모호성을 없애면서도 예언서의 의인화와 비유를 자연스럽게 보존합니다. ‘폐허로 만들겠습니다’는 אָשִׂים שְׁמָמָה의 결과 상태를 현대 격식체로 명료하게 옮깁니다.
  terminology: פְּסִילִים은 ‘새긴 형상들’로, עֲצַבִּים은 ‘우상들’로 구별했습니다. אֶתְנַן/זוֹנָה의 거친 성매매 은유는 ‘창녀로서 받은 삯’으로 완화하지 않고 유지했습니다. 사마리아라는 명시적 주어는 본문 문맥의 지시 대상을 밝혀 주며, 여성 인칭대명사를 부자연스럽게 반복하는 것보다 표준 한국어에 적절합니다.
  issues:
