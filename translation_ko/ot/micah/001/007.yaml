id: MIC.1.7
reference: Micah 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל פְּסִילֶ֣י/הָ יֻכַּ֗תּוּ וְ/כָל אֶתְנַנֶּ֨י/הָ֙ יִשָּׂרְפ֣וּ בָ/אֵ֔שׁ וְ/כָל עֲצַבֶּ֖י/הָ אָשִׂ֣ים שְׁמָמָ֑ה כִּ֠י מֵ/אֶתְנַ֤ן זוֹנָה֙ קִבָּ֔צָה וְ/עַד אֶתְנַ֥ן זוֹנָ֖ה יָשֽׁוּבוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/007.yaml
  text: All her carved images will be smashed[a], and all her prostitute’s wages will be burned with fire; all her idols I will make desolate. For from the wages of a prostitute she gathered them[c][b], and to the wages of a prostitute they will return.
  footnotes:
  - marker: a
    text: Or 'graven images.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'her prostitute’s wages'; the phrase refers metaphorically to wealth gained through idolatrous unfaithfulness.
    reason: cultural_note
  - marker: c
    text: Or 'they will again become a prostitute’s wages.'
    reason: alternative_reading
translation:
  language: ko
  text: 사마리아의 새긴 형상들은 모두 부서지고[a], 사마리아가 창녀로서 받은 모든 삯은 불에 타 버릴 것입니다. 그 모든 우상을 내가 폐허로 만들겠습니다. 사마리아가 창녀로서 받은 삯으로 그것들을 모았으니[b], 그것들은 다시 창녀의 삯이 될 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조각한 우상들’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그녀의 창녀의 삯’이라고 하며, 사마리아를 여성으로 의인화합니다. 이 표현은 우상숭배와 관련하여 얻은 재물을 비유적으로 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘창녀의 삯으로 돌아갈 것입니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: פְּסִילֶיהָ
  english_pob_choice: her carved images
  chosen_korean: 그의 새긴 우상들
  alternatives_korean:
  - 그의 조각한 우상들
  - 그의 새긴 형상들
  lexicon: HALOT
  rationale: פֶּסֶל은 깎거나 새겨 만든 형상을 가리키므로, ‘새긴 우상들’이 구체성을 살리면서도 현대 한국어로 자연스럽습니다.
- source_word: יֻכַּתּוּ
  english_pob_choice: will be smashed
  chosen_korean: 부서지고
  alternatives_korean:
  - 산산이 부서지고
  - 짓밟히고
  lexicon: HALOT
  rationale: 수동형의 폭력적 파괴를 간결하게 살리기 위해 ‘부서지다’를 택했습니다.
- source_word: אֶתְנַנֶּיהָ
  english_pob_choice: her prostitute’s wages
  chosen_korean: 그의 창녀의 삯
  alternatives_korean:
  - 그의 매춘부의 삯
  - 그의 창녀 품삯
  lexicon: HALOT
  rationale: אֶתְנַן은 성매매의 대가를 뜻하므로, 비유의 거침을 약화시키지 않도록 직설적으로 옮겼습니다.
- source_word: אָשִׂים שְׁמָמָה
  english_pob_choice: I will make desolate
  chosen_korean: 내가 황폐하게 만들겠습니다
  alternatives_korean:
  - 내가 황폐로 만들겠습니다
  - 내가 황무지로 만들겠습니다
  lexicon: HALOT
  rationale: וָשִׂים + שְׁמָמָה의 결과 상태를 한국어 동사구로 자연스럽게 풀어, ‘황폐하게 만들다’로 옮겼습니다.
theological_decisions:
- issue: 우상숭배와 성적 타락의 은유를 어떻게 보존할지
  chosen_reading: ‘창녀의 삯’을 본문에 그대로 유지해 예언적 비난의 강도를 살렸습니다.
  alternative_readings:
  - ‘부정한 이익’으로 완화하기
  - ‘우상숭배로 얻은 재물’로 풀이하기
  rationale: 히브리어는 반복적으로 זוֹנָה와 אֶתְנַן을 사용해 idolatry를 성매매 은유로 고발하므로, 이를 완화하면 원문의 충격과 비난의 날이 약해집니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 문법상 여성형 소유격의 처리
  chosen_reading: 히브리어의 여성형을 반영해 ‘그의’로 옮겼습니다.
  alternative_readings:
  - ‘그녀의’로 직역하기
  - ‘그것의’로 중립화하기
  rationale: 문맥에서 대상은 사마리아/도시의 의인화이지만, 한국어에서는 도시를 여성 인칭으로 처리하기보다 문맥상 ‘그’로 자연스럽게 유지하는 것이 가독성에 유리합니다.
  doctrine_reference: Translation philosophy §§1, 4
