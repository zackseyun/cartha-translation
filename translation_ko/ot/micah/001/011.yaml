revisions:
- from: 너희에게로 지나가라, 수치스러운 벌거벗은 자야, 사빌 주민아. 차아난 주민은 나오지 않았습니다. 벧에셀의 애통이 너희에게서 그 의지할 곳을 빼앗을 것입니다.[a][b][c]
  to: 사빌 주민아, 벌거벗은 채 수치를 당하며 지나가십시오.[b] 사아난 주민은 나오지 않았습니다. 벧에셀의 애곡이 너희에게서 그 설 자리를 빼앗을 것입니다.[c][a]
  rationale: ‘너희에게로’를 삭제하여 난해한 לָכֶם에 근거 없는 방향 의미를 부여하지 않았습니다. 노출과 치욕의 표현을 자연스러운 상태 부사구로 고쳤고, 사아난의 표기를 정비했습니다. 마지막 구절은 본문의 난해성을 보존하면서도 한국어 문장으로 읽히도록 최소한으로 다듬었으며, 관련 주석 표지를 해당 어구 가까이에 배치했습니다.
