source:
  edition: WLC
  text: עִבְרִ֥י לָ/כֶ֛ם יוֹשֶׁ֥בֶת שָׁפִ֖יר עֶרְיָה בֹ֑שֶׁת לֹ֤א יָֽצְאָה֙ יוֹשֶׁ֣בֶת צַֽאֲנָ֔ן מִסְפַּד֙ בֵּ֣ית הָאֵ֔צֶל יִקַּ֥ח מִ/כֶּ֖ם עֶמְדָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/011.yaml
  text: Pass on[a], naked and in shame, inhabitant of Shaphir. The inhabitant of Zaanan has not come out[c][b]. The lamentation of Beth-ezel will take away from you its support.
  footnotes:
  - marker: a
    text: 'Shaphir, Zaanan, and Beth-ezel are place names. Micah likely uses wordplay on their sounds or meanings: Shaphir may suggest beauty, Zaanan sounds like ''come out,'' and Beth-ezel may suggest a nearby house or place at one''s side.'
    reason: cultural_note
  - marker: b
    text: Or 'Pass by' instead of 'Pass on.' The command may imply going away into exile.
    reason: lexical_alternative
  - marker: c
    text: Or 'The mourning of Beth-ezel takes away from you its standing place.' The final clause is difficult; the Hebrew may refer to the loss of nearby support or refuge.
    reason: lexical_alternative
translation:
  language: ko
  text: 사빌 주민아, 벌거벗은 채 수치를 당하며 지나가십시오.[b] 사아난 주민은 나오지 않았습니다. 벧에셀의 애곡이 너희에게서 그 설 자리를 빼앗을 것입니다.[c][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 사빌, 사아난, 벧에셀은 지명입니다. 미가는 이 이름들의 소리나 뜻을 이용한 말놀이를 사용한 것으로 보입니다. 사빌은 ‘아름다움’을, 사아난은 ‘나오다’와 비슷한 소리를, 벧에셀은 ‘곁의 집’ 또는 ‘옆에 있는 집’을 떠올리게 합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘지나가라’ 또는 ‘지나쳐 가라’로 옮길 수 있습니다. 이 명령은 포로로 끌려가는 이동을 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘벧에셀의 애곡이 너희에게서 그 서 있는 자리를 빼앗을 것이다’로 옮길 수 있습니다. 마지막 어구는 어렵고, 히브리어는 가까운 지지나 피난처의 상실을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִ֥י לָכֶ֛ם
  english_pob_choice: Pass on
  chosen_korean: 너희에게로 지나가라
  alternatives_korean:
  - 너희에게로 지나가라
  - 지나가라
  - 지나쳐 가라
  lexicon: HALOT
  rationale: עבר의 명령형을 단순 통과가 아니라 강제 이동의 뉘앙스를 살려 ‘지나가라’로 옮겼고, לָכֶם은 자연스러운 한국어를 위해 목적어적 방향성을 암시하는 ‘너희에게로’로 처리했습니다.
- source_word: עֶרְיָה בֹשֶׁת
  english_pob_choice: naked and in shame
  chosen_korean: 수치스러운 벌거벗은 자
  alternatives_korean:
  - 벌거벗고 수치스러운 자
  - 벌거벗어 수치를 당한 자
  - 나체로 수치를 당한 자
  lexicon: HALOT
  rationale: עֶרְיָה와 בֹשֶׁת의 병렬을 그대로 살리되, 한국어에서 자연스럽고 예언적 조롱의 힘이 드러나도록 상태 표현으로 압축했습니다.
- source_word: יוֹשֶׁבֶת שָׁפִיר
  english_pob_choice: inhabitant of Shaphir
  chosen_korean: 사빌 주민아
  alternatives_korean:
  - 사빌의 주민아
  - 사빌에 사는 이여
  - 사빌 거주자여
  lexicon: HALOT
  rationale: 여성 단수 분사로서 도시를 의인화한 호칭을 한국어 호격으로 옮겼고, 기존 정착형 지명 표기를 따라 ‘사빌’을 사용했습니다.
- source_word: לֹא יָצְאָה
  english_pob_choice: has not come out
  chosen_korean: 나오지 않았습니다
  alternatives_korean:
  - 나오지 않았습니다
  - 나오지 않았습니다
  - 나오지 않았소
  lexicon: HALOT
  rationale: 출현/출동/탈출 가능성을 열어 둔 채, 영어 POB가 보존한 모호성을 살려 가장 중립적인 부정 완료형으로 옮겼습니다.
- source_word: מִסְפַּד בֵּית הָאֵצֶל
  english_pob_choice: The lamentation of Beth-ezel
  chosen_korean: 벧에셀의 애통
  alternatives_korean:
  - 벧에셀의 애통
  - 벧에셀의 애곡
  - 벧에셀의 슬픔
  lexicon: HALOT
  rationale: מִסְפַּד는 단순한 슬픔보다 장례적·공적 애곡의 성격이 있어 ‘애통’이 문맥의 강도를 잘 드러냅니다.
- source_word: עֶמְדָּתוֹ
  english_pob_choice: its support
  chosen_korean: 의지할 곳
  alternatives_korean:
  - 지지
  - 버팀목
  - 설 자리
  lexicon: HALOT
  rationale: ‘standing place/support’의 중의성을 한국어에서 지나치게 기술적으로 만들지 않기 위해, 실제 기능을 드러내는 ‘의지할 곳’으로 옮겼습니다.
theological_decisions:
- issue: 예언적 조롱과 도시 의인화의 표현 방식
  chosen_reading: 도시를 여성 주민으로 호칭하는 예언적 경고를 한국어 호격으로 보존했습니다.
  alternative_readings:
  - 직설적인 도시명 나열
  - 설명적 문장으로 풀어쓰기
  rationale: 본문의 수사적 긴장과 조롱의 효과는 의인화된 호칭에서 나오므로, 이를 평이한 설명문으로 완화하지 않았습니다.
  doctrine_reference: 예언서 수사 보존 원칙
- issue: 마지막 절의 난해한 어구 처리
  chosen_reading: ‘의지할 곳’을 택해 지원 상실의 핵심 의미를 살렸습니다.
  alternative_readings:
  - ‘그 자리가 있는 곳’
  - ‘그 서 있는 곳’
  - ‘그 피난처’
  rationale: 히브리어 어근상 ‘서 있는 자리/지지’의 여지를 유지하면서도, 한국어 독자가 문맥상 이해할 수 있는 최소한의 의미를 제공했습니다.
  doctrine_reference: 의미 보존과 모호성 관리
