  text: כִּֽי חָ֥לָֽה לְ/ט֖וֹב יוֹשֶׁ֣בֶת מָר֑וֹת כִּֽי יָ֤רַד רָע֙ מֵ/אֵ֣ת יְהוָ֔ה לְ/שַׁ֖עַר יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/012.yaml
  text: For the inhabitant of Maroth writhes for good, because disaster has come down from the LORD to the gate of Jerusalem.
translation:
  language: ko
  text: 마롯의 주민은 좋은 일을 바라며 몸부림칩니다. 이는 재앙이 야훼에게서 내려와 예루살렘의 문에 이르렀기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלָה לְטוֹב
  english_pob_choice: writhes for good
  chosen_korean: 좋을 것을 두고 몸부림칩니다
  alternatives_korean:
  - 좋은 것을 애타게 기다립니다
  - 좋은 일을 두고 괴로워합니다
  lexicon: חלה
  rationale: 영어 POB의 ‘writhes’를 살려 단순한 기다림보다 고통스러운 몸부림을 드러냈고, לְטוֹב은 ‘좋을 것/좋은 것’으로 목적어를 자연스럽게 풀었습니다.
- source_word: יוֹשֶׁבֶת מָרֹות
  english_pob_choice: the inhabitant of Maroth
  chosen_korean: 마롯의 주민이
  alternatives_korean:
  - 마롯의 거주자가
  - 마롯에 사는 이가
  lexicon: יושב + 고유지명
  rationale: ‘주민’은 정착해 사는 사람을 간결하게 드러내며, 문맥상 단수 집합 주어로 처리했습니다.
- source_word: רָע
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 화
  - 악
  lexicon: רע
  rationale: 문맥상 도덕적 ‘악’보다 심판으로 임한 ‘재앙’이 적절하여, 영어 POB의 ‘disaster’와 맞추어 번역했습니다.
- source_word: יְהוָה
  english_pob_choice: LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: יהוה
  rationale: 원문 고유명 יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮기며, 본문에서는 문맥상 하나님의 직접적 심판 행위와 연결됩니다.
- source_word: לְשַׁעַר יְרוּשָׁלִָם
  english_pob_choice: to the gate of Jerusalem
  chosen_korean: 예루살렘의 문에
  alternatives_korean:
  - 예루살렘 성문에
  - 예루살렘 문 앞에
  lexicon: שער + 예루살렘
  rationale: שער는 도시 접근 지점인 ‘문’으로 직역해 심판이 도성 경계까지 다가왔다는 긴박함을 보존했습니다.
theological_decisions:
- issue: יהוה의 심판 주체성
  chosen_reading: 재앙이 야훼에게서 내려온 것으로 직접 진술해, 재난을 우연한 사건이 아니라 언약적 심판으로 제시합니다.
  alternative_readings:
  - 재앙이 일어났다
  - 재앙이 주에게서 내려왔다
  rationale: 미가서의 예언 문맥은 사건의 배후를 하나님의 주권적 행위로 해석하므로, 원문의 출처 표지를 약화하지 않았습니다.
  doctrine_reference: 하나님의 주권과 예언적 심판
