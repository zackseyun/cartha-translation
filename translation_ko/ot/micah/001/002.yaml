id: MIC.1.2
reference: Micah 1:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁמְעוּ֙ עַמִּ֣ים כֻּלָּ֔/ם הַקְשִׁ֖יבִי אֶ֣רֶץ וּ/מְלֹאָ֑/הּ וִ/יהִי֩ אֲדֹנָ֨/י יְהוִ֤ה בָּ/כֶם֙ לְ/עֵ֔ד אֲדֹנָ֖/י מֵ/הֵיכַ֥ל קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/002.yaml
  text: Hear[a], all you peoples; pay attention, O earth, and all that fills it. And let the Lord GOD be a witness against you[d][c][b], the Lord from his holy temple.
  footnotes:
  - marker: a
    text: Or 'all peoples.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Lord YHWH'; traditionally rendered 'the Lord GOD' in this compound title.
    reason: lexical_alternative
  - marker: c
    text: 'Or ''let the Lord GOD be a witness among you,'' though in context the sense is likely judicial: ''against you.'''
    reason: alternative_reading
  - marker: d
    text: Or 'from his holy palace' or 'from his holy sanctuary.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 민족들아, 들으십시오. 땅과 그 안에 가득한 것들아, 귀를 기울이십시오. 주 야훼께서 여러분 가운데 증인이 되시며, 그의 거룩한 성전에서 주께서 말씀하십니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 민족들.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘주 야훼’에 해당하며, 전통적으로 이 합성 칭호는 ‘주 하나님’으로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: c
    text: 문맥상 ‘여러분 가운데’보다 ‘여러분을 상대로/against you’의 법정적 의미가 더 강할 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘그의 거룩한 궁전에서’ 혹은 ‘그의 거룩한 성소에서.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들어라
  - 들으세요
  lexicon: HALOT
  rationale: 복수형 명령으로 선포되는 예언자적 소환이므로, 현대 공적 문체의 직접 명령형 ‘들으십시오’가 가장 자연스럽고 엄중합니다.
- source_word: עַמִּים כֻּלָּם
  english_pob_choice: all you peoples
  chosen_korean: 모든 민족들
  alternatives_korean:
  - 모든 백성들
  - 모든 나라들
  lexicon: HALOT
  rationale: 복수 ‘peoples’의 직접 호격을 살리되, 한국어에서는 ‘민족들’이 범세계적 복수 집합을 가장 무리 없이 드러냅니다.
- source_word: הַקְשִׁיבִי
  english_pob_choice: pay attention
  chosen_korean: 귀를 기울이십시오
  alternatives_korean:
  - 주의하십시오
  - 잘 들으십시오
  lexicon: HALOT
  rationale: 땅을 향한 여성 단수 명령의 의인화를 살리면서, 예언적 경고의 긴박성을 현대적이고 격식 있게 전달합니다.
- source_word: אֲדֹנָי יְהוִה ... בָּכֶם לְעֵד
  english_pob_choice: the Lord GOD be a witness against you
  chosen_korean: 주 야훼께서 여러분 가운데 증인이 되시며
  alternatives_korean:
  - 주 야훼께서 여러분을 상대로 증인이 되시며
  - 주 야훼께서 여러분에게 증인이 되시며
  lexicon: HALOT
  rationale: עֵד의 법정적 이미지는 살리되, 한국어에서 ‘against you’를 너무 노골적으로 반복하기보다 ‘여러분 가운데’로 옮겨 원문의 보강된 증언/고발 뉘앙스를 보존했습니다.
- source_word: מֵהֵיכַל קָדְשׁוֹ
  english_pob_choice: from his holy temple
  chosen_korean: 그의 거룩한 성전에서
  alternatives_korean:
  - 그의 거룩한 궁전에서
  - 그의 거룩한 성소에서
  lexicon: HALOT
  rationale: הֵיכָל은 ‘성전/궁전’ 모두 가능하지만, 하나님의 거주 장소라는 문맥에서는 ‘성전’이 가장 분명합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본값에 따라 여호와 대신 학술적 음역 ‘야훼’를 사용하여 본문의 고유한 언약명을 드러냈습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: 아ֲדֹנָי יְהוִה의 한국어 처리
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 히브리어의 중첩 칭호를 한국어에서 자연스럽게 보존하면서도, YHWH를 별도 고유명으로 드러내기 위해 ‘주 야훼’로 옮겼습니다.
  doctrine_reference: Project glossary and source distinction בין אֲדֹנָי and יְהוָה
