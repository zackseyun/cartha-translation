  text: Therefore you will give parting gifts for Moresheth-gath[b][a]; the houses of Achzib will prove deceptive to the kings of Israel.
  footnotes:
  - marker: a
    text: Or "farewell gifts"; the Hebrew may also carry the sense of gifts given when sending someone away, possibly with an echo of divorce imagery.
    reason: lexical_alternative
  - marker: b
    text: 'Achzib sounds like the Hebrew word for "deception" or "disappointment," creating a wordplay: the town''s houses will prove deceptive to Israel''s kings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희는 모레셋-갓을 위해 떠나는 선물을 줄 것이며, 악십의 집들은 이스라엘의 왕들에게 속임수가 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘떠나는 선물’은 ‘작별 선물’ 또는 ‘내보내는 선물’의 뜻을 포함할 수 있으며, 경우에 따라 이혼의 뉘앙스를 비출 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 악십은 히브리어 ‘속임수/실망’과 음이 비슷하여, 이 도시의 집들이 이스라엘의 왕들에게 속임수처럼 드러난다는 말장난이 있습니다.
    reason: lexical_alternative
