id: MIC.1.6
reference: Micah 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֥י שֹׁמְר֛וֹן לְ/עִ֥י הַ/שָּׂדֶ֖ה לְ/מַטָּ֣עֵי כָ֑רֶם וְ/הִגַּרְתִּ֤י לַ/גַּי֙ אֲבָנֶ֔י/הָ וִ/יסֹדֶ֖י/הָ אֲגַלֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/006.yaml
  text: So I will make Samaria a heap in the open country[a], a place for planting vineyards[b]; I will pour her stones down into the valley and uncover her foundations.
  footnotes:
  - marker: a
    text: Or 'a ruin heap in the field.' The Hebrew phrase is compact and may be rendered more formally.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will hurl her stones into the ravine.' The verb literally conveys causing them to flow or pour down.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 사마리아를 들판의 폐허 더미와 포도나무를 심을 곳으로 만들고, 그 돌들을 골짜기로 쏟아 내리며[b], 그 기초를 드러내겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘그 돌들을 골짜기로 내던지며’로 옮길 수 있습니다. 히브리어 동사는 문자적으로 돌들이 아래로 흘러가거나 쏟아져 내려가게 한다는 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  english_pob_choice: So I will make
  chosen_korean: 그러므로 내가 … 만들고
  alternatives_korean:
  - 내가 … 만들겠습니다
  - 그래서 내가 … 만들고
  lexicon: WLC/HALOT
  rationale: 예언적 선언의 עתיד적 뉘앙스를 한국어 미래로 옮기되, 접속사 וְ의 담화 연결은 ‘그러므로’로 자연스럽게 살렸습니다.
- source_word: לְעִי הַשָּׂדֶה
  english_pob_choice: a heap in the open country
  chosen_korean: 들판의 더미
  alternatives_korean:
  - 들판의 폐허 더미
  - 들에 놓인 더미
  lexicon: WLC/HALOT
  rationale: עִי는 무너진 더미/잔해 더미를 뜻하고, הַשָּׂדֶה는 여기서 도시가 무너진 뒤의 들판 대비를 이룹니다. 한국어에서는 간결하게 ‘들판의 더미’로 옮겨 잔해가 된 장소감을 살렸습니다.
- source_word: לְמַטָּעֵי כָרֶם
  english_pob_choice: a place for planting vineyards
  chosen_korean: 포도원을 심을 곳
  alternatives_korean:
  - 포도밭을 심을 자리
  - 포도나무를 심는 곳
  lexicon: WLC/HALOT
  rationale: 목적/결과 표현을 살려 폐허가 포도 재배에 적합한 장소가 된다는 뜻을 직접적으로 전달했습니다.
- source_word: וְהִגַּרְתִּי לַגַּי אֲבָנֶיהָ
  english_pob_choice: I will pour her stones down into the valley
  chosen_korean: 그 돌들을 골짜기로 쏟아 내리며
  alternatives_korean:
  - 그 돌들을 골짜기로 쏟아 버리며
  - 그 돌들을 골짜기로 흘려보내며
  lexicon: WLC/HALOT
  rationale: נגר의 사역형은 ‘흘러내리게 하다/쏟아 내리다’의 이미지가 핵심이므로, 돌을 산비탈에서 아래로 쏟는 파괴적 장면을 한국어로 유지했습니다.
- source_word: וִיסֹדֶיהָ אֲגַלֶּה
  english_pob_choice: and uncover her foundations
  chosen_korean: 그 기초를 드러내겠습니다
  alternatives_korean:
  - 그 기초를 파헤치겠습니다
  - 그 터전을 드러내겠습니다
  lexicon: WLC/HALOT
  rationale: גלה의 ‘드러내다/벗기다’ 의미를 살리되, 한국어에서 가장 자연스러운 파괴 이미지로 ‘기초를 드러내다’를 택했습니다.
theological_decisions:
- issue: 사마리아의 여성형 지시대명사 처리
  chosen_reading: ‘그 돌들/그 기초’로 처리하고 전체 문장에서는 인격화된 ‘그녀’ 대신 도시명 사마리아를 중심으로 번역했습니다.
  alternative_readings:
  - ‘그녀의 돌들/그녀의 기초’
  - ‘그것의 돌들/그것의 기초’
  rationale: 히브리어는 사마리아를 여성형으로 지시하지만, 한국어에서 도시를 ‘그녀’로 일관되게 표기하는 것은 부자연스러울 수 있어 문맥상 동일 대상을 유지하는 중립적 표현을 택했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
