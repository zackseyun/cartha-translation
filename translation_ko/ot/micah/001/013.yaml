source:
  edition: WLC
  text: רְתֹ֧ם הַ/מֶּרְכָּבָ֛ה לָ/רֶ֖כֶשׁ יוֹשֶׁ֣בֶת לָכִ֑ישׁ רֵאשִׁ֨ית חַטָּ֥את הִיא֙ לְ/בַת צִיּ֔וֹן כִּי בָ֥/ךְ נִמְצְא֖וּ פִּשְׁעֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/013.yaml
  text: Harness the chariot to the swift horse[a], inhabitant of Lachish; she was the beginning of sin to daughter Zion[d][c][b], for in you were found the transgressions of Israel.
  footnotes:
  - marker: a
    text: Or 'O inhabitress of Lachish' or 'you who dwell in Lachish'; the Hebrew uses a feminine singular form addressing the city as a woman.
    reason: lexical_alternative
  - marker: b
    text: Or 'she was the first cause of sin for daughter Zion.' The phrase may indicate that Lachish was an originating point from which Judah adopted Israel's rebellion.
    reason: alternative_reading
  - marker: c
    text: '''Daughter Zion'' is a Hebrew poetic personification of Zion/Jerusalem.'
    reason: cultural_note
  - marker: d
    text: Or 'the rebellions of Israel'; the Hebrew word can emphasize willful revolt, not merely wrongdoing in general.
    reason: lexical_alternative
translation:
  language: ko
  text: 전차를 빠른 말에 매십시오, 라기스의 주민이여. 그곳은 딸 시온의 죄의 시작이었으니, 이는 너희에게서 이스라엘의 범죄들이 발견되었기 때문입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘라기스에 사는 여자여’, ‘라기스의 주민아’로도 옮길 수 있습니다. 히브리어는 도시를 여성 단수로 부릅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘딸 시온의 죄의 첫 원인’으로도 옮길 수 있습니다. 이 표현은 라기스가 죄의 출발점이었다는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘딸 시온’은 시온/예루살렘을 가리키는 히브리어 시적 의인화입니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘이스라엘의 반역들’로도 옮길 수 있습니다. 히브리어는 단순한 잘못보다 의도적 반역을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְתֹם הַמֶּרְכָּבָה לָרֶכֶשׁ
  english_pob_choice: Harness the chariot to the swift horse
  chosen_korean: 전차를 빠른 말에 매십시오
  alternatives_korean:
  - 수레를 준마에 매십시오
  - 전차를 준마에 메십시오
  lexicon: HALOT
  rationale: 명령형 רְתֹם의 ‘매다/잇다’ 의미를 살리면서, 현대 한국어에서 자연스럽고 전투적 긴박감을 전달하는 ‘매십시오’를 택했습니다.
- source_word: יוֹשֶׁבֶת לָכִישׁ
  english_pob_choice: inhabitant of Lachish
  chosen_korean: 라기스의 주민이여
  alternatives_korean:
  - 라기스에 사는 이여
  - 라기스의 거주자여
  lexicon: HALOT
  rationale: 도시를 여성 단수로 의인화한 호격을 한국어에서는 ‘주민이여’로 간결하게 옮기고, 호격 어감을 살렸습니다.
- source_word: לְבַת צִיּוֹן
  english_pob_choice: daughter Zion
  chosen_korean: 딸 시온
  alternatives_korean:
  - 시온의 딸
  - 시온
  lexicon: HALOT
  rationale: 히브리어의 시적 의인화를 보존하기 위해 전통적 ‘딸 시온’을 직역형으로 유지했습니다.
- source_word: פִּשְׁעֵי יִשְׂרָאֵל
  english_pob_choice: the transgressions of Israel
  chosen_korean: 이스라엘의 범죄들
  alternatives_korean:
  - 이스라엘의 반역들
  - 이스라엘의 범죄
  lexicon: HALOT
  rationale: פֶּשַׁע의 핵심 의미는 단순한 실수보다 언약적 반역에 가까워, 복수형의 무게를 살린 ‘범죄들’을 택했습니다.
theological_decisions:
- issue: 라기스의 죄가 시온의 죄의 ‘시작’이라는 진술
  chosen_reading: 라기스가 딸 시온으로 퍼진 죄의 발단이라는 예언적 고발로 옮겼습니다.
  alternative_readings:
  - 라기스가 먼저 심판받을 도시라는 의미
  - 라기스가 시온의 죄악 전개의 역사적 출발점이라는 의미
  rationale: 본문은 원인-결과의 도덕적 고발을 유지하므로, 역사적 세부를 과도하게 특정하지 않고 ‘죄의 시작’이라는 표현을 그대로 살렸습니다.
  doctrine_reference: 'Translation philosophy §3: 해소되지 않은 예언적 긴장을 보존'
