revisions:
- from: 산들은 그분 앞에서 녹아 내리고, 골짜기들은 갈라집니다. 밀랍이 불 앞에서 녹듯이, 물이 비탈 아래로 쏟아지듯이 말입니다.[a]
  to: 산들은 그분 아래에서 녹고 골짜기들은 갈라질 것입니다. 불 앞에서 녹는 밀랍처럼, 비탈을 따라 쏟아져 내리는 물처럼 될 것입니다.
  rationale: ‘그분 아래에서’로 תַּחְתָּיו의 기본 의미를 회복하고, 예언적 미완료형을 미래형으로 옮겼습니다. 두 개의 비교 표현은 원문의 순서와 물리적 이미지를 따라 자연스러운 한국어 문장으로 재구성했습니다. 불필요한 어휘 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:43:07Z'
