source:
  edition: WLC
  text: וְ/נָמַ֤סּוּ הֶֽ/הָרִים֙ תַּחְתָּ֔י/ו וְ/הָ/עֲמָקִ֖ים יִתְבַּקָּ֑עוּ כַּ/דּוֹנַג֙ מִ/פְּנֵ֣י הָ/אֵ֔שׁ כְּ/מַ֖יִם מֻגָּרִ֥ים בְּ/מוֹרָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/004.yaml
  text: And the mountains will melt beneath him, and the valleys will split open, like wax before the fire, like waters poured down a slope.
translation:
  language: ko
  text: 산들은 그분 아래에서 녹고 골짜기들은 갈라질 것입니다. 불 앞에서 녹는 밀랍처럼, 비탈을 따라 쏟아져 내리는 물처럼 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָמַסּוּ
  english_pob_choice: will melt
  chosen_korean: 녹아 내리고
  alternatives_korean:
  - 녹습니다
  - 녹아 버리고
  - 녹아 없어지고
  lexicon: HALOT
  rationale: נמס는 ‘녹다/녹아 없어지다’의 뜻이므로, 산이 무너져 흐르듯 사라지는 이미지를 살려 ‘녹아 내리고’로 옮겼습니다.
- source_word: הֶהָרִים
  english_pob_choice: the mountains
  chosen_korean: 산들은
  alternatives_korean:
  - 그 산들은
  - 산들이
  - 산
  lexicon: HALOT
  rationale: 히브리어 정관복수는 한국어에서 문맥상 주어 표지를 살린 복수형으로 자연스럽게 처리했습니다.
- source_word: יִתְבַּקָּעוּ
  english_pob_choice: will split open
  chosen_korean: 갈라집니다
  alternatives_korean:
  - 쪼개집니다
  - 터집니다
  - 갈라져 버립니다
  lexicon: HALOT
  rationale: 동사는 단순한 ‘분리’보다 지면이 벌어지는 파괴적 이미지를 담으므로 ‘갈라집니다’가 가장 직관적입니다.
- source_word: כַּדּוֹנַג מִפְּנֵי הָאֵשׁ
  english_pob_choice: like wax before the fire
  chosen_korean: 밀랍이 불 앞에서 녹듯이
  alternatives_korean:
  - 왁스가 불 앞에서 녹듯이
  - 밀랍처럼 불 앞에서 녹듯이
  lexicon: HALOT
  rationale: דּוֹנַג은 보통 ‘밀랍’이 자연스럽고, מִפְּנֵי הָאֵשׁ는 불의 ‘앞/면전에서’라는 감각을 살려 비유를 그대로 유지했습니다.
- source_word: כְּמַיִם מֻגָּרִים בְּמוֹרָד
  english_pob_choice: like waters poured down a slope
  chosen_korean: 물이 비탈 아래로 쏟아지듯이
  alternatives_korean:
  - 내리막으로 쏟아지는 물처럼
  - 비탈길 아래로 부어지듯이
  lexicon: HALOT
  rationale: מֻגָּרִים은 아래로 흘러내리게 된 물의 상태를, בְּמוֹרָד은 경사면의 하강 방향을 가리키므로 ‘비탈 아래로 쏟아지듯이’가 이미지와 방향성을 함께 살립니다.
theological_decisions:
- issue: תַּחְתָּיו의 지시 대상
  chosen_reading: ‘그분 앞에서’로 풀어, 앞절에서 오는 야훼의 임재와 행진이 산과 골짜기를 흔드는 장면임을 드러냈습니다.
  alternative_readings:
  - ‘그의 아래에서’
  - ‘그분 아래로’
  rationale: 히브리어의 3인칭 남성 단수 접미사는 문맥상 앞절의 주님을 가리키므로, 한국어에서는 자연스럽게 지시 대상을 드러내되 원문 관계를 흐리지 않도록 했습니다.
  doctrine_reference: Mic 1:3-4 문맥; 번역 원칙 §1, §3
