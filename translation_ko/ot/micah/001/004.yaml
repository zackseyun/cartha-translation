    rationale: תַּחַת는 ‘아래, 밑’을 뜻하며, 여기서는 앞절의 주님 아래에서 산들이 녹는다는 형상입니다. ‘앞에서’는 מִפְּנֵי에 해당하는 관계를 도입하여 원문의 공간 이미지를 바꿉니다.
  - severity: medium
    issue: 히브리어 미완료형을 현재형 ‘녹아 내리고, 갈라집니다’로 처리함
    rationale: 문맥은 주님의 오심에 따른 예언적 장면이므로 ‘녹고, 갈라질 것입니다’가 시제를 더 분명하고 자연스럽게 전달합니다.
  - severity: low
    issue: 각주가 번역상 필요한 정보를 제공하지 않음
    rationale: ‘דּוֹנַג은 일반적으로 밀랍’이라는 설명은 본문 번역과 동일한 내용을 반복할 뿐 대안 독법이나 해석상 쟁점을 밝히지 않습니다.
  revised_text: 산들은 그분 아래에서 녹고 골짜기들은 갈라질 것입니다. 불 앞에서 녹는 밀랍처럼, 비탈을 따라 쏟아져 내리는 물처럼 될 것입니다.
