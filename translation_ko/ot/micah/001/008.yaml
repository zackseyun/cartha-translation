review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the two initial lament verbs and preserves the public mourning/humiliation imagery. However, ‘승냥이’ is not an accurate modern Korean equivalent for Hebrew תַּנִּים in this context; ‘자칼’ is appropriate. The difficult first adjective in שילל וערום also needs the lexical-alternative footnote retained. The two existing notes are attached at the end of the sentence rather than to the relevant expressions, and the note on ‘자칼’ does not correspond to the principal textual difficulty represented by the English audit trail.
  naturalness: The formal-polite register is consistent. ‘애가를 지을’ can suggest composing a funeral song rather than uttering a lament; ‘애가를 부르다’ is more natural for the prophetic cry in this context. ‘벗겨지고 벌거벗은 채로’ is understandable but stylistically repetitive; ‘벗겨진 채 벌거벗고’ preserves both descriptors more smoothly.
  terminology: Use ‘자칼’ rather than ‘승냥이’ for jackals. Retain the poetic literal expression ‘타조의 딸들,’ with an explanatory note that it denotes ostriches/female ostriches. ‘애곡,’ ‘부르짖다,’ and ‘애통’ suitably maintain the lamentation register without imposing interpretation.
  issues:
  - severity: medium
    issue: ‘승냥이들’ translates the animal inaccurately.
    rationale: Korean ‘승냥이’ normally denotes the dhole, not a jackal. The likely zoological reference of תַּנִּים here is jackals, for which modern standard Korean is ‘자칼.’
  - severity: medium
    issue: The difficult term שילל lacks its required lexical-alternative note, while footnote a instead comments on jackals.
    rationale: The source term is disputed between senses such as ‘stripped’ and ‘barefoot.’ This ambiguity should be preserved in a note anchored to the Korean rendering of that term.
  - severity: low
    issue: Footnote anchors are placed after the entire final sentence rather than at their respective words.
    rationale: Anchoring [a] after ‘벗겨진’ and [b] after ‘타조의 딸들’ makes the notes unambiguous and restores their intended function.
  - severity: low
    issue: ‘애가를 지을’ may imply literary composition.
    rationale: The Hebrew describes making/uttering a lament in parallel with animal cries; ‘애가를 부르다’ more naturally conveys this action in Korean.
  revised_text: 이 일 때문에 나는 애곡하며 부르짖겠습니다. 나는 벗겨진[a] 채 벌거벗고 걸어가겠습니다. 나는 자칼들처럼 애가를 부르고, 타조의 딸들[b]처럼 애통하겠습니다.
  revised_footnotes:
