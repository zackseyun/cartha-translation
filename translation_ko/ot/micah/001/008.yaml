    text: 히브리어 낱말의 뜻은 확실하지 않습니다. ‘맨발로’라고 옮길 수도 있으며, 이는 애도와 수치의 표시를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘타조의 딸들’입니다. 히브리어 시적 표현으로, 타조 또는 암타조를 가리킵니다.
    reason: lexical_alternative
  revision_rationale: The revision corrects the animal name, improves the idiomatic expression for uttering a lament, retains the paired humiliation descriptors, and supplies precisely anchored notes for the disputed ‘stripped/barefoot’ term and the literal poetic phrase ‘daughters of the ostrich.’
