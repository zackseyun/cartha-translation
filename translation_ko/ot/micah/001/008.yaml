id: MIC.1.8
reference: Micah 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל זֹאת֙ אֶסְפְּדָ֣ה וְ/אֵילִ֔ילָה אֵילְכָ֥ה שילל וְ/עָר֑וֹם אֶעֱשֶׂ֤ה מִסְפֵּד֙ כַּ/תַּנִּ֔ים וְ/אֵ֖בֶל כִּ/בְנ֥וֹת יַעֲנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/008.yaml
  text: Because of this I will lament and wail[a]; I will go stripped and naked. I will make a lament like the jackals[b], and mourning like the daughters of the ostrich.
  footnotes:
  - marker: a
    text: Or 'I will go barefoot and naked.' The Hebrew term translated 'stripped' is difficult and may refer to going barefoot as a sign of mourning and humiliation.
    reason: lexical_alternative
  - marker: b
    text: Literally 'like the daughters of the ostrich,' a Hebrew poetic expression for ostriches or female ostriches.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일 때문에 나는 애곡하며 부르짖겠습니다. 나는 벗겨진[a] 채 벌거벗고 걸어가겠습니다. 나는 자칼들처럼 애가를 부르고, 타조의 딸들[b]처럼 애통하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 낱말의 뜻은 확실하지 않습니다. ‘맨발로’라고 옮길 수도 있으며, 이는 애도와 수치의 표시를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘타조의 딸들’입니다. 히브리어 시적 표현으로, 타조 또는 암타조를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶסְפְּדָה
  english_pob_choice: I will lament
  chosen_korean: 애곡하며
  alternatives_korean:
  - 애도하며
  - 슬퍼하며
  lexicon: HALOT
  rationale: ספד는 장례·상례 맥락의 ‘애도/애곡’에 가깝기 때문에, 단순한 슬픔보다 더 의례적이고 강한 비탄을 드러내는 ‘애곡하다’로 옮겼습니다.
- source_word: וְאֵילִילָה
  english_pob_choice: and wail
  chosen_korean: 부르짖겠습니다
  alternatives_korean:
  - 울부짖겠습니다
  - 통곡하겠습니다
  lexicon: HALOT
  rationale: ילל은 앞 동사보다 더 날카로운 외침을 나타내므로, 한국어에서도 음량과 절박함이 더 느껴지는 ‘부르짖다’를 택했습니다.
- source_word: שילל וְעָרוֹם
  english_pob_choice: I will go stripped and naked
  chosen_korean: 벗겨지고 벌거벗은 채로
  alternatives_korean:
  - 맨발과 벌거벗은 채로
  - 벗은 채로
  lexicon: HALOT
  rationale: שילל은 ‘벗겨짐/탈취됨’과 ‘맨발’ 가능성이 모두 있으나, 본문이 공개적 수치와 상실을 함께 드러내므로 ‘벗겨지고’로 넓게 살리고, עָרוֹם는 분명히 ‘벌거벗은’으로 옮겼습니다.
- source_word: כַּתַּנִּים
  english_pob_choice: like the jackals
  chosen_korean: 승냥이들처럼
  alternatives_korean:
  - 자칼들처럼
  - 들개들처럼
  lexicon: HALOT
  rationale: תַּנִּים은 예언서 시어에서 황량한 곳의 울음과 연결되는 짐승을 가리키며, 한국어 성서 용례와 독자 이해를 고려해 ‘승냥이’로 옮겼습니다.
theological_decisions:
- issue: 예언자의 몸짓 언어를 어떻게 나타낼 것인가
  chosen_reading: 본문의 과장된 비탄과 수치 표현을 그대로 살려, 감정 상태뿐 아니라 공개적 애곡 행위를 한국어로 분명히 드러냈습니다.
  alternative_readings:
  - ‘슬퍼하겠습니다’처럼 완화하는 번역
  - ‘울겠습니다’로 단순화하는 번역
  rationale: 문맥상 미가의 탄식은 사적인 감정이 아니라 상징적·공적 행위이므로, 완화하지 않고 육체적 수치를 포함한 표현을 유지하는 것이 본문의 예언적 충격을 보존합니다.
  doctrine_reference: 예언서의 상징 행위와 심판 선포
- issue: ‘타조의 딸들’ 표현의 처리
  chosen_reading: 직역에 가깝게 ‘타조의 딸들처럼’으로 두어 시어의 낯섦을 보존했습니다.
  alternative_readings:
  - ‘타조처럼’으로 평탄화하는 번역
  - 의역하여 동물 울음의 이미지로만 바꾸는 번역
  rationale: 히브리어의 비유적·시적 표현을 지워버리면 원문의 상징적 밀도가 약해지므로, 독자가 본문의 시적 난해함을 그대로 보게 하는 편이 원문 충실성에 부합합니다.
  doctrine_reference: 시적 평행법과 예언적 비유
- issue: כִּבְנוֹת יַעֲנָה의 처리
  chosen_reading: ‘타조의 딸들’이라는 직역을 유지하되, 의미는 짐승 울음의 비유로 이해하도록 했습니다.
  alternative_readings:
  - ‘타조들처럼’
  - ‘암타조들처럼’
  rationale: 영어 POB가 주석으로 설명하듯 이 표현은 히브리어 시구로서 동물의 울음과 연결되므로, 직역과 자연성을 함께 고려해 본문에는 직역을 두고 해석은 독자가 읽도록 남겼습니다.
  doctrine_reference: 히브리어 시어의 보존
