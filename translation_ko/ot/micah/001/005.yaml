  source_fidelity: 본문의 인과 관계, ‘야곱’과 ‘이스라엘 집’의 병행, 사마리아와 예루살렘으로 답하는 수사적 반문을 충실히 보존합니다. 다만 פשע를 설명하는 현 각주가 ‘의도적 위반’이라는 해석을 어휘의 기본 의미로 단정하므로, 더 중립적인 대안 어휘만 제시하는 것이 안전합니다.
  naturalness: 합쇼체 문장은 자연스럽습니다. ‘유다의 산당들은 무엇입니까? 예루살렘이 아니겠습니까?’라는 복수 질문과 단수 답변의 긴장은 히브리어 본문의 형태와 수사적 동일시를 반영하므로 유지할 수 있습니다.
