id: MIC.1.5
reference: Micah 1:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/פֶ֤שַׁע יַֽעֲקֹב֙ כָּל זֹ֔את וּ/בְ/חַטֹּ֖אות בֵּ֣ית יִשְׂרָאֵ֑ל מִֽי פֶ֣שַׁע יַעֲקֹ֗ב הֲ/לוֹא֙ שֹֽׁמְר֔וֹן וּ/מִי֙ בָּמ֣וֹת יְהוּדָ֔ה הֲ/ל֖וֹא יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/005.yaml
  text: All this is because of Jacob’s transgression[a], and because of the sins of the house of Israel[b]. What is Jacob’s transgression? Is it not Samaria? And what are the high places of Judah? Are they not Jerusalem?
  footnotes:
  - marker: a
    text: Or 'rebellion' for 'transgression' in both occurrences of פשע.
    reason: lexical_alternative
  - marker: b
    text: '''High places'' refers to elevated worship sites, often associated with unauthorized or idolatrous worship.'
    reason: cultural_note
translation:
  language: ko
  text: 이 모든 일은 야곱의 허물[a] 때문이며, 이스라엘 집의 죄들 때문입니다. 야곱의 허물이 무엇입니까? 사마리아가 아니겠습니까? 유다의 산당들은 무엇입니까? 예루살렘이 아니겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘반역’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘산당들’은 주로 높은 곳에 세운 예배처를 가리키며, 문맥에 따라 승인되지 않은 예배나 우상숭배와 관련될 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּ/פֶשַׁע
  english_pob_choice: because of ... transgression
  chosen_korean: '...의 허물'
  alternatives_korean:
  - '...의 죄'
  - '...의 반역'
  - '...의 범죄'
  lexicon: HALOT
  rationale: בְּ는 여기서 원인을 나타내므로 한국어도 이유를 드러내는 조사로 살리고, פשע는 언약적 위반의 뉘앙스를 가진 말로서 '허물'이 자연스럽고 직설적입니다.
- source_word: כָּל זֹאת
  english_pob_choice: All this
  chosen_korean: 이 모든 일
  alternatives_korean:
  - 이 모든 것
  - 이 모든 심판
  lexicon: HALOT
  rationale: 앞선 심판 맥락을 가리키지만 본문 자체가 명시적으로 '심판'이라고 말하지 않으므로, 의미를 과도하게 좁히지 않는 '이 모든 일'로 옮겼습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘의 집
  - 이스라엘
  lexicon: HALOT
  rationale: 족장적·언약적 표현을 보존하기 위해 직역에 가깝게 유지했습니다. '이스라엘'로만 줄이면 병행구조의 격식이 약해집니다.
- source_word: בָּמוֹת
  english_pob_choice: the high places
  chosen_korean: 산당들
  alternatives_korean:
  - 높은 곳들
  - 고지의 제단들
  lexicon: HALOT
  rationale: בָּמוֹת은 우상숭배와 연결된 예배 장소를 가리키므로 한국어 성경의 익숙한 용어인 '산당'을 사용하되, 복수형을 살려 문장의 병렬성을 보존했습니다.
- source_word: יְהוּדָה / יְרוּשָׁלִָם
  english_pob_choice: Judah / Jerusalem
  chosen_korean: 유다 / 예루살렘
  alternatives_korean:
  - 유대 / 예루살렘
  lexicon: HALOT
  rationale: 고유명사는 관용적 성경 표기를 따랐습니다. 여기서는 남유다의 대표 중심지로서 예루살렘이 수사적으로 기능합니다.
theological_decisions:
- issue: מִי / הֲלוֹא의 수사적 질문 처리
  chosen_reading: 반문형을 살려 ‘아니겠습니까?’로 옮겼습니다.
  alternative_readings:
  - ‘~입니까?’
  - ‘정말 ~입니까?’
  rationale: 본문은 단순 정보 질문이 아니라 독자가 ‘그렇다’고 답하도록 유도하는 반문이므로, 한국어에서도 그 압력을 유지하는 표현이 가장 적절합니다.
  doctrine_reference: 수사적 반문과 예언 문체 보존
- issue: 사마리아와 예루살렘의 기능
  chosen_reading: 두 도성은 각각 북왕국과 남왕국의 죄와 우상숭배를 대표하는 중심지로 읽었습니다.
  alternative_readings:
  - 두 도성 자체를 곧바로 죄/산당으로 동일시하는 읽기
  rationale: 히브리어의 병행과 영어 POB의 해석을 따라, 본문은 도시 자체를 추상적으로 규정하기보다 그 도시들이 대표하는 فساد의 중심을 지목하는 것으로 보존하는 편이 더 충실합니다.
  doctrine_reference: 예언서의 대표·메타님적 지시
