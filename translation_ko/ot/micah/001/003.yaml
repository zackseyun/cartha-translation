source:
  edition: WLC
  text: כִּֽי הִנֵּ֥ה יְהוָ֖ה יֹצֵ֣א מִ/מְּקוֹמ֑/וֹ וְ/יָרַ֥ד וְ/דָרַ֖ךְ עַל במותי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/003.yaml
  text: For look, the LORD is coming out from his place; he will come down and tread on the high places of the earth.
translation:
  language: ko
  text: 보십시오[a], 야훼께서 그의 처소에서 나오시고 내려오셔서 땅의 높은 곳들을 밟으실 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כִּי הִנֵּה는 강조하며 주의를 환기하는 표현으로, 여기서는 ‘보십시오’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: ‘땅의 높은 곳들’은 지형적 높이를 가리킬 수 있으며, 문맥에 따라 ‘산당들’로 이해될 가능성도 있습니다. 본문은 여기서 그 의미를 확정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּֽי הִנֵּ֥ה
  english_pob_choice: For look
  chosen_korean: 그러므로 보십시오
  alternatives_korean:
  - 보십시오
  - 보라
  - 보십시오, 그러므로
  lexicon: כִּי + הִנֵּה
  rationale: 히브리어의 강조 도입부를 자연스러운 경고/주의 환기 표현으로 옮겼습니다. 문맥상 선지자적 선언의 긴박함을 살려 ‘보십시오’로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: 원어 하나님의 이름을 직접적으로 드러내는 프로젝트 기본값을 따랐습니다. 영어 POB의 LORD는 해당 본문에서 야훼를 가리킵니다.
- source_word: יֹצֵא מִמְּקוֹמוֹ
  english_pob_choice: is coming out from his place
  chosen_korean: 그의 처소에서 나오시며
  alternatives_korean:
  - 자기 자리에서 나오시며
  - 그의 곳에서 나오시며
  lexicon: יצא + מקום
  rationale: ‘나오다’와 ‘처소’로 이동/기원 이미지를 보존했습니다. ‘처소’는 하나님이 머무시는 곳이라는 격식을 살리되 과도하게 신학화하지 않습니다.
- source_word: וְיָרַד וְדָרַךְ עַל
  english_pob_choice: he will come down and tread on
  chosen_korean: 내려오셔서 ... 밟으십니다
  alternatives_korean:
  - 내려오시고 ... 밟으십니다
  - 내려와 ... 밟으십니다
  lexicon: ירד + דרך על
  rationale: 두 동작 동사를 한국어에서 자연스럽게 연결하되, 심판의 위력을 드러내는 ‘밟다’를 유지했습니다. 미래/예정의 진술을 현재적 예언 서술로 옮겼습니다.
- source_word: במותי אָרץ
  english_pob_choice: the high places of the earth
  chosen_korean: 땅의 높은 곳들
  alternatives_korean:
  - 땅의 높은 산당들
  - 땅의 높은 곳
  - 땅의 고지들
  lexicon: במות + ארץ
  rationale: 문맥상 단순 지형일 수도 있으나, 히브리어 ‘높은 곳들’의 다의성을 보존하기 위해 주석 없이 직역에 가깝게 두었습니다. 우상 숭배적 ‘산당’으로 특정하는 것은 본문이 직접 요구하지 않습니다.
theological_decisions:
- issue: 하나님의 강림 이미지의 표현 수위
  chosen_reading: ‘내려오셔서 ... 밟으십니다’로 심판적 임재의 위엄을 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘임하여 ... 지나가십니다’
  - ‘강림하여 ... 밟으십니다’
  rationale: 미가 1:3은 야훼의 심판 행위를 생생한 신현 언어로 묘사하므로, 완곡한 표현보다 원문 이미지가 살아 있는 서술을 택했습니다.
  doctrine_reference: 신현/심판 묘사
- issue: ‘땅의 높은 곳들’의 해석
  chosen_reading: 지형 표현을 우선 살리고, 산당으로의 확정 해석은 본문 자체에 두지 않았습니다.
  alternative_readings:
  - ‘땅의 산당들’
  - ‘땅의 높은 산들’
  rationale: במות는 종종 산당을 뜻하지만 여기서는 ‘땅’과 결합한 광범위한 심판 범위를 나타낼 수 있어, 의미를 좁히지 않는 쪽이 더 충실합니다.
  doctrine_reference: 히브리어 다의성 보존
