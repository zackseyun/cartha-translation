id: MIC.1.15
reference: Micah 1:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֹ֗ד הַ/יֹּרֵשׁ֙ אָ֣בִי לָ֔/ךְ יוֹשֶׁ֖בֶת מָֽרֵשָׁ֑ה עַד עֲדֻּלָּ֥ם יָב֖וֹא כְּב֥וֹד יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/015.yaml
  text: I will yet bring an heir against you[a], inhabitant of Mareshah[b]; the glory of Israel will come as far as Adullam.
  footnotes:
  - marker: a
    text: Or 'an heir,' 'one who takes possession,' or 'a conqueror.' The Hebrew likely plays on the name Mareshah.
    reason: lexical_alternative
  - marker: b
    text: Or 'the nobility of Israel' or 'the wealth/splendor of Israel.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 아직도 너에게 대적하는 상속자를 보낼 것이다[a], 마레사 주민아[b]. 이스라엘의 영광이 아둘람까지 이를 것이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘상속자’, ‘차지하는 자’, ‘정복자’로도 옮길 수 있습니다. 히브리어는 마레사(Mareshah)라는 지명과 말놀이를 이룹니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘의 귀인들’이나 ‘이스라엘의 부요/화려함’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַיֹּרֵשׁ
  english_pob_choice: a possessor / an heir
  chosen_korean: 상속자
  alternatives_korean:
  - 소유자
  - 점유자
  - 정복자
  - 상속받는 자
  lexicon: HALOT
  rationale: ירש의 ‘차지하다/상속하다’ 범위를 살리면서, 마레사와의 말놀이를 한국어에서 가장 자연스럽게 전달할 수 있는 표현으로 보았습니다.
- source_word: לָךְ
  english_pob_choice: against you
  chosen_korean: 너에게 대적하는
  alternatives_korean:
  - 너에게
  - 너를 향해
  - 너에게 오는
  lexicon: HALOT
  rationale: 문맥이 심판 선포이므로 단순한 방향보다 적대적 뉘앙스가 드러나도록 풀어 옮겼습니다.
- source_word: יוֹשֶׁבֶת
  english_pob_choice: inhabitant
  chosen_korean: 주민아
  alternatives_korean:
  - 거주하는 자야
  - 사는 자야
  - 거주민아
  lexicon: HALOT
  rationale: 도시를 의인화하여 부르는 여성 단수 호격을 한국어에서 자연스럽게 살리기 위해 ‘주민아’로 옮겼습니다.
- source_word: כְּבוֹד יִשְׂרָאֵל
  english_pob_choice: the glory of Israel
  chosen_korean: 이스라엘의 영광
  alternatives_korean:
  - 이스라엘의 존귀
  - 이스라엘의 귀인들
  - 이스라엘의 부요
  lexicon: HALOT
  rationale: כבוד의 폭넓은 의미를 좁히지 않고, 본문이 허용하는 긴장을 유지하도록 가장 직접적인 ‘영광’을 택했습니다.
theological_decisions:
- issue: 마레사/상속자 말놀이의 재현
  chosen_reading: ‘상속자’로 옮겨 ירש와 마레사(Mareshah)의 음의 연관과 소유권 전복의 뉘앙스를 함께 살렸습니다.
  alternative_readings:
  - 소유자
  - 정복자
  - 상속받는 자
  rationale: 히브리어의 시적 장치를 한국어에서 완전히 재현할 수는 없지만, 의미 핵심인 ‘차지함/빼앗음’과 심판의 역동성을 보존하는 것이 우선입니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: 이스라엘의 영광의 범위
  chosen_reading: ‘이스라엘의 영광’으로 직역해 귀족, 부, 나라의 화려함 등 가능한 범위를 열어 둡니다.
  alternative_readings:
  - 이스라엘의 귀인들
  - 이스라엘의 부요
  - 이스라엘의 존귀
  rationale: 본문이 의도적으로 남겨 둔 모호성을 해소하지 않고, 독자가 문맥 속에서 해석하도록 두는 편이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
