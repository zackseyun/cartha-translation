id: MIC.1.16
reference: Micah 1:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָרְחִ֣י וָ/גֹ֔זִּי עַל בְּנֵ֖י תַּעֲנוּגָ֑יִ/ךְ הַרְחִ֤בִי קָרְחָתֵ/ךְ֙ כַּ/נֶּ֔שֶׁר כִּ֥י גָל֖וּ מִמֵּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/016.yaml
  text: Make yourself bald and shave your head for the children of your delight; enlarge your baldness like the eagle[a], for they have gone from you into exile.
  footnotes:
  - marker: a
    text: Or 'like the vulture.' The Hebrew נֶשֶׁר may refer to a large carrion bird rather than specifically an eagle; the image in either case is of conspicuous baldness.
    reason: lexical_alternative
translation:
  language: ko
  text: 대머리가 되도록 머리를 밀고 깎으십시오. 네가 기뻐하던 자녀들 때문에 독수리처럼 네 대머리진 곳을 넓히십시오[a]. 그들이 너에게서 포로로 끌려가 유배되었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시체를 먹는 큰 새’. 히브리어 נֶשֶׁר는 반드시 특정한 독수리 종을 가리키지 않고, 독수리류나 큰 시식성 조류를 가리킬 수 있습니다. 어느 경우이든 눈에 띄는 대머리를 비유하는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְחִי
  english_pob_choice: Make yourself bald
  chosen_korean: 머리카락을 깎고
  alternatives_korean:
  - 대머리가 되라
  - 머리를 깎아라
  lexicon: HALOT
  rationale: קרח의 통상적 용법은 애도와 관련된 ‘대머리로 만들다/되다’이므로, 현대 한국어에서는 자연스럽게 ‘머리카락을 깎고’로 옮겨 직접적인 애곡의 명령을 살렸습니다.
- source_word: וָגֹזִּי
  english_pob_choice: and shave your head
  chosen_korean: 머리를 밀어라
  alternatives_korean:
  - 머리를 깎아라
  - 머리카락을 잘라라
  lexicon: HALOT
  rationale: גזז의 ‘깎다/깎아 내다’는 의미를 살리되, 앞 구절과의 병렬에서 행동이 분명하게 드러나도록 ‘머리를 밀어라’로 표현했습니다.
- source_word: בְּנֵי תַּעֲנוּגָיִךְ
  english_pob_choice: the children of your delight
  chosen_korean: 네가 사랑하던 자녀들
  alternatives_korean:
  - 네 기쁨의 자녀들
  - 네가 애지중지하던 자녀들
  lexicon: HALOT
  rationale: 직역하면 ‘네 즐거움들의 자녀들’이지만, 한국어에서는 관계적 관용구를 그대로 옮기기보다 애곡의 대상인 자녀들을 가리키는 뜻을 자연스럽게 드러내는 표현이 더 분명합니다.
- source_word: כַּנֶּשֶׁר
  english_pob_choice: like the eagle
  chosen_korean: 독수리처럼
  alternatives_korean:
  - 수리처럼
  - 매처럼
  lexicon: HALOT
  rationale: נֶשֶׁר는 통상 ‘독수리’로 옮겨지는 표준 대응어이므로 본문에는 이를 유지했습니다. 조류 식별의 불확실성은 각주로 처리하는 것이 적절합니다.
theological_decisions:
- issue: 애곡 명령의 직설성 유지
  chosen_reading: 예언자가 예루살렘/유다를 향해 치욕적인 애곡 행위를 직접 명령하는 어조를 유지했습니다.
  alternative_readings:
  - 부드럽게 ‘슬퍼하라’로 완화
  - 문어적으로 ‘통곡하라’로 일반화
  rationale: 본문은 단순한 감정 표현이 아니라 수치와 상실을 드러내는 상징 행위를 요구하므로, 행동 동사들을 직접적으로 유지해야 예언의 긴장과 심판성을 보존할 수 있습니다.
  doctrine_reference: 예언서의 상징적 행위와 심판 선포
- issue: 포로됨의 원인과 결과를 분명히 함
  chosen_reading: ‘그들이 네게서 포로로 끌려갔기 때문입니다’로 마무리해, 애곡의 이유가 포로로 사로잡혀 감에 있음을 분명히 했습니다.
  alternative_readings:
  - ‘그들이 네게서 떠났기 때문입니다’
  - ‘그들이 네게서 사라졌기 때문입니다’
  rationale: גלה는 단순한 이별이 아니라 포로로 끌려감/유배를 가리키므로, 그 역사적·신학적 무게를 약화시키지 않기 위해 ‘포로로 끌려갔다’고 옮겼습니다.
  doctrine_reference: 포로와 심판의 예언적 어휘
