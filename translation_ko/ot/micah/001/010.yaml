source:
  edition: WLC
  text: בְּ/גַת֙ אַל תַּגִּ֔ידוּ בָּכ֖וֹ אַל תִּבְכּ֑וּ בְּ/בֵ֣ית לְעַפְרָ֔ה עָפָ֖ר התפלשתי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/010.yaml
  text: In Gath[a], do not tell it; in Acco, do not weep.[b] In Beth-leaphrah[c], roll yourself in the dust.
  footnotes:
  - marker: a
    text: Or, more literally, 'Weep not at all' or 'Do not weep.' The Hebrew wording is difficult; the main text follows a common place-name wordplay reading ('Acco').
    reason: alternative_reading
  - marker: b
    text: Beth-leaphrah likely sounds like 'house of dust,' matching the following word 'dust.'
    reason: cultural_note
  - marker: c
    text: The Hebrew form behind 'roll yourself' is written as first person ('I have rolled myself') in the consonantal text; many take it as an imperative here because of the context.
    reason: textual_variant
translation:
  language: ko
  text: 가드에서 그 일을 말하지 마십시오. 벧르아브라에서 먼지 속에 뒹구십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 지명 말장난을 살릴 수 있어 ‘가드’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: ‘벧르아브라’는 ‘먼지의 집’이라는 뜻을 떠올리게 하는 이름으로, 뒤의 ‘먼지’와 말장난을 이룹니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 자음본문은 여기서 ‘내가 뒹굴었다’처럼 1인칭으로 적혀 있으나, 문맥상 명령형으로 이해하는 해석이 널리 받아들여집니다.
    reason: textual_variant
lexical_decisions:
- source_word: בְּ/גַת
  english_pob_choice: In Gath
  chosen_korean: 가드에서
  alternatives_korean:
  - 가드 안에서
  - 가드에서
  lexicon: HALOT
  rationale: 고유 지명은 음역하고, 전치사 ב는 여기서 자연스러운 장소 부사격인 ‘-에서’로 옮겼습니다.
- source_word: אַל תַּגִּידוּ
  english_pob_choice: do not tell it
  chosen_korean: 그 일을 말하지 마십시오
  alternatives_korean:
  - 그것을 말하지 마십시오
  - 알리지 마십시오
  lexicon: HALOT
  rationale: נגד의 히필은 ‘말하다/알리다/전하다’의 의미가 있어, 짧고 직접적인 금지로 옮기되 암시된 대상은 한국어에서 자연스럽게 ‘그 일’로 처리했습니다.
- source_word: בְּ/בֵ֣ית לְעַפְרָ֔ה / עָפָר
  english_pob_choice: In Beth-leaphrah, roll yourself in the dust.
  chosen_korean: 벧르아브라에서 먼지 속에 뒹구십시오
  alternatives_korean:
  - 벧르아브라에서 티끌 속에 뒹구십시오
  - 벧르아브라에서 먼지 속에 굴러들어가십시오
  lexicon: HALOT
  rationale: ‘벧르아브라’는 고유 지명으로 두고, 이어지는 עָפָר는 ‘먼지’보다 더 문학적이고 일상적인 ‘먼지 속’으로 처리해 지명과의 말장난을 살렸습니다.
- source_word: התפלשתי
  english_pob_choice: roll yourself
  chosen_korean: 뒹구십시오
  alternatives_korean:
  - 구르십시오
  - 몸을 구르십시오
  lexicon: HALOT
  rationale: 동작의 수치를 살리는 동사로 ‘뒹구다’가 문맥에 가장 가깝고, 명령형 존대를 붙여 예언적 꾸짖음의 강도를 유지했습니다.
