  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל מִיכָה֙ הַ/מֹּ֣רַשְׁתִּ֔י בִּ/ימֵ֥י יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖ה מַלְכֵ֣י יְהוּדָ֑ה אֲשֶׁר חָזָ֥ה עַל שֹׁמְר֖וֹן וִ/ירֽוּשָׁלִָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/001.yaml
  text: The word of Yahweh that came to Micah the Morashtite in the days of Jotham[a], Ahaz, and Hezekiah, kings of Judah[b], which he saw concerning Samaria and Jerusalem.
  footnotes:
  - marker: a
    text: Hebrew 'the Morashtite,' that is, a man from Moresheth.
    reason: cultural_note
  - marker: b
    text: Or 'which he saw against Samaria and Jerusalem.' The preposition can mark the subject matter or, in context, an adversative sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 말씀 — 곧 유다 왕 요담, 아하스, 히스기야 시대에 모라셋 사람 미가에게 임한 말씀입니다 — 그가 사마리아와 예루살렘에 관해 본 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모라셋 사람’은 곧 모라셋 출신이라는 뜻입니다.
    reason: cultural_note
  - marker: b
    text: ‘에 관해’는 여기서 주제 표지로 이해할 수 있으며, 문맥에 따라 ‘~을 대하여/~을 향해’의 뉘앙스도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה
  english_pob_choice: The word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 메시지
  - 주님의 말씀
  lexicon: HALOT
  rationale: 예언 서문에서 דְּבַר는 단순한 정보가 아니라 선포된 계시를 가리키므로 ‘말씀’이 가장 자연스럽고, יְהוָה는 문서 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: הַמֹּרַשְׁתִּי
  english_pob_choice: the Morashtite
  chosen_korean: 모라셋 사람
  alternatives_korean:
  - 모라셋 출신
  - 모라셋 사람 미가
  lexicon: HALOT
  rationale: 히브리어 형용사형 지명 표지는 출신지를 나타내므로, 한국어에서는 자연스럽고 의미가 분명한 ‘모라셋 사람’으로 풀어 옮겼습니다.
- source_word: בִּימֵי יוֹתָם אָחָז יְחִזְקִיָּה
  english_pob_choice: in the days of Jotham, Ahaz, and Hezekiah
  chosen_korean: 유다 왕 요담, 아하스, 히스기야 시대에
  alternatives_korean:
  - 요담, 아하스, 히스기야 왕들의 시대에
  - 유다 왕들 요담, 아하스, 히스기야 때에
  lexicon: HALOT
  rationale: ‘in the days of’는 연대 표지로서 한국어에서 ‘~시대에’가 가장 자연스럽고, 뒤의 ‘유다 왕’이 세 왕 모두에 걸린다는 점을 분명히 했습니다.
- source_word: אֲשֶׁר חָזָה עַל שֹׁמְרוֹן וִירוּשָׁלִָם
  english_pob_choice: which he saw concerning Samaria and Jerusalem
  chosen_korean: 그가 사마리아와 예루살렘에 관해 본 것입니다
  alternatives_korean:
  - 그가 사마리아와 예루살렘을 대하여 본 것입니다
  - 그가 사마리아와 예루살렘을 향해 본 것입니다
  lexicon: HALOT
  rationale: חָזָה는 예언적 ‘보다’로 유지하고, עַל은 POB의 판단대로 주제 표지로서 ‘~에 관해’로 옮겨 앞선 ‘말씀’과 자연스럽게 연결했습니다.
theological_decisions:
- issue: 여호와/주(主) 대신 야훼 사용
  chosen_reading: 본문의 יהוה는 칭호가 아니라 신명으로 보아 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 서문은 예언의 권위를 부여하는 하나님의 고유명을 직접 사용하므로, 전통적 대체어보다 이름 자체를 드러내는 번역이 원문의 효과를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
