id: MIC.1.9
reference: Micah 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֥י אֲנוּשָׁ֖ה מַכּוֹתֶ֑י/הָ כִּי בָ֨אָה֙ עַד יְהוּדָ֔ה נָגַ֛ע עַד שַׁ֥עַר עַמִּ֖/י עַד יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/009.yaml
  text: For her wound is incurable[a], for it has come as far as Judah; it has reached to the gate of my people[b], to Jerusalem.
  footnotes:
  - marker: a
    text: Or 'her wounds are incurable'; the Hebrew form for 'wounds' is plural, though the sense may be collective.
    reason: lexical_alternative
  - marker: b
    text: Or 'it has touched the gate of my people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 상처는 낫지 못할 것입니다[a]. 그것이 유다까지 왔고, 내 백성의 문까지[b], 예루살렘까지 이르렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 상처들은 낫지 못할 것입니다’. 히브리어 형태는 복수형이지만, 집합적 의미로 단수처럼 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 백성의 문에 닿았습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנוּשָׁה
  english_pob_choice: incurable
  chosen_korean: 낫지 못할 것입니다
  alternatives_korean:
  - 치유할 수 없습니다
  - 절망적입니다
  lexicon: HALOT
  rationale: 예언적 심판 문맥에서 병이 치료 불가능한 상태임을 드러내는 말로 옮겼으며, 단순한 ‘심하다’보다 원문의 강도를 더 분명히 살립니다.
- source_word: מַכּוֹתֶיהָ
  english_pob_choice: her wound
  chosen_korean: 그 상처
  alternatives_korean:
  - 그 상처들
  - 그 타격
  lexicon: HALOT
  rationale: 형태는 복수이지만 집합적 의미로 읽을 수 있으므로, 한국어에서는 단수 ‘상처’로 자연스럽게 옮기되 문맥상 개인이 아닌 도시/공동체의 재앙임을 유지했습니다.
- source_word: עַד יְהוּדָה / עַד שַׁעַר עַמִּי / עַד יְרוּשָׁלִָם
  english_pob_choice: as far as Judah / the gate of my people / Jerusalem
  chosen_korean: 유다까지 / 내 백성의 문까지 / 예루살렘까지
  alternatives_korean:
  - 유다에 이르기까지
  - 내 백성의 성문까지
  - 예루살렘 성문까지
  lexicon: HALOT
  rationale: עַד의 범위 감각을 살려 ‘-까지’로 일관되게 처리했고, ‘문’은 העיר의 문턱 이미지를 직접 유지하여 심판이 도시 경계에 이르렀다는 점을 드러냅니다.
theological_decisions:
- issue: 인칭과 문맥 속 재난의 주체를 한국어로 어떻게 처리할지
  chosen_reading: 원문의 여성형 표지와 인칭성을 ‘그 상처’로 남기되, 진행 동사는 비인칭적으로 ‘왔다/이르렀습니다’로 처리해 재앙의 확산을 자연스럽게 표현했습니다.
  alternative_readings:
  - ‘그녀의 상처는 낫지 못합니다’처럼 여성 인칭을 더 직접적으로 살릴 수 있음
  - ‘재앙이 유다까지 왔습니다’처럼 재앙을 주어로 두는 방식
  rationale: 히브리어는 도시를 의인화하면서도 중간에 비인칭적 재앙의 진행처럼 읽히는 흐름이 있어, 한국어에서는 두 층위를 모두 과도한 해석 없이 유지하는 것이 적절합니다.
  doctrine_reference: 예언서의 의인화와 심판 이미지의 보존
