id: MIC.6.10
reference: Micah 6:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ע֗וֹד הַ/אִשׁ֙ בֵּ֣ית רָשָׁ֔ע אֹצְר֖וֹת רֶ֑שַׁע וְ/אֵיפַ֥ת רָז֖וֹן זְעוּמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/010.yaml
  text: Are there still in the house of the wicked treasures of wickedness[b][a], and a scant measure that is accursed?
  footnotes:
  - marker: a
    text: Hebrew 'ephah,' a standard dry measure; here it refers to a merchant's measuring container.
    reason: lexical_alternative
  - marker: b
    text: Or 'a deficient ephah that is accursed.'
    reason: alternative_reading
translation:
  language: ko
  text: 아직도 악인의 집에 악의 보물과 부족한 되, 곧 저주받은 것이 있습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘에바(ephah)’는 표준 건조량 단위이며, 여기서는 상인의 계량 용기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “저주받은 부족한 에바”로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עוֹד / הַאִשׁ
  english_pob_choice: Are there still
  chosen_korean: 아직도 … 있습니까?
  alternatives_korean:
  - 아직 … 있습니까?
  - 여전히 … 있습니까?
  lexicon: HALOT
  rationale: 어두의 지속성을 나타내는 עוֹד를 '아직도'로 옮기고, 문맥상 수사적 질문으로 처리해 원문의 추궁하는 어조를 살렸습니다.
- source_word: בֵּית רָשָׁע
  english_pob_choice: the house of the wicked
  chosen_korean: 악인의 집
  alternatives_korean:
  - 악한 사람의 집
  - 악한 자의 집
  lexicon: HALOT
  rationale: 구문상 '악인'이 한 사람을 가리키는 집합적 표현으로 자연스럽고, 원문의 소유·소속 관계를 간결하게 반영합니다.
- source_word: אֹצְרוֹת רֶשַׁע
  english_pob_choice: treasures of wickedness
  chosen_korean: 악의 보물
  alternatives_korean:
  - 불의의 보물
  - 악으로 모은 보물
  - 악한 보물
  lexicon: HALOT
  rationale: 직역에 가까운 '악의 보물'로 חומר적 축재와 도덕적 성격을 함께 살렸으며, 'wickedness'의 명사적 힘을 유지했습니다.
- source_word: אֵיפַת רָז֖וֹן זְעוּמָֽה
  english_pob_choice: a scant measure that is accursed
  chosen_korean: 부족한 되, 곧 저주받은 것
  alternatives_korean:
  - 부족한 에바, 곧 저주받은 것
  - 모자란 되, 곧 저주받은 것
  - 불량한 되, 곧 저주받은 것
  lexicon: HALOT
  rationale: אֵיפָה는 곡식 계량 단위이자 용기이므로 본문에는 기능을 살린 '되'를 쓰고, רָזוֹן의 '부족한/모자란' 뜻과 זְעוּמָה의 강한 저주 의미를 연결했습니다.
theological_decisions:
- issue: 수사적 질문의 처리
  chosen_reading: 선지자의 책망을 담은 수사적 질문으로 읽어 '…있습니까?'로 옮겼습니다.
  alternative_readings:
  - 서술문으로 '아직도 … 있습니다'라고 옮기는 방식
  rationale: 앞뒤 문맥이 부정의를 고발하는 연속 질문이므로, 한국어도 질문형으로 유지해야 원문의 논박 효과가 보존됩니다.
  doctrine_reference: 문맥-수사학적 해석
