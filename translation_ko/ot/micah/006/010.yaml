  source_fidelity: 어두의 עוֹד와 문맥상 의문문 처리는 적절하며, ‘악인의 집’도 בֵּית רָשָׁע를 잘 반영합니다. 그러나 ‘부족한 되, 곧 저주받은 것’은 זְעוּמָה가 앞의 계량 단위를 수식하는 원문 구조를 ‘것’으로 분리하여 흐리게 합니다. אֵיפָה는 한국의 고유 단위인 ‘되’와 동일하지 않으므로 음역과 설명을 쓰는 편이 더 정확합니다.
  naturalness: ‘악의 보물’은 뜻은 전달되지만 현대 한국어에서는 다소 부자연스럽습니다. ‘불의한 재물’은 원문의 도덕적 규정을 유지하면서 자연스럽습니다. ‘저주받은 부족한 에바’는 계량 단위 전체가 정죄받는다는 뜻을 명료하게 전달합니다.
