id: MIC.6.8
reference: Micah 6:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִגִּ֥יד לְ/ךָ֛ אָדָ֖ם מַה טּ֑וֹב וּ/מָֽה יְהוָ֞ה דּוֹרֵ֣שׁ מִמְּ/ךָ֗ כִּ֣י אִם עֲשׂ֤וֹת מִשְׁפָּט֙ וְ/אַ֣הֲבַת חֶ֔סֶד וְ/הַצְנֵ֥עַ לֶ֖כֶת עִם אֱלֹהֶֽי/ךָ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/008.yaml
  text: He has told you[a], O man, what is good; and what does Yahweh require of you but to do justice, and to love steadfast love[b], and to walk humbly with your God?
  footnotes:
  - marker: a
    text: Or 'to love mercy,' 'to love kindness,' or 'to love covenant loyalty.' The Hebrew חֶסֶד carries the sense of loyal, steadfast love within covenant relationship.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'O man' uses a singular representative address to a human hearer.
    reason: cultural_note
translation:
  language: ko
  text: 그가 사람에게 네게 무엇이 선한지 알려 주셨습니다. 야훼께서 네게서 요구하시는 것은 오직 정의를 행하고, 인애를 사랑하며, 네 하나님과 함께 겸손히 행하는 것이 아니냐?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָדָם은 단수 대표 호칭으로서, 여기서는 한 사람을 넘어 인간 전체를 대표하여 부르는 표현입니다.
    reason: cultural_note
  - marker: b
    text: חֶסֶד는 ‘자비’, ‘친절’, ‘언약적 충성’ 등으로도 옮길 수 있으나, 여기서는 지속적이고 신실한 사랑의 뉘앙스를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּיד
  english_pob_choice: He has told
  chosen_korean: 알려 주셨습니다
  alternatives_korean:
  - 말해 주셨습니다
  - 선포하셨습니다
  - 알리셨습니다
  lexicon: HALOT
  rationale: 히필 נגד는 단순한 말하기보다 ‘알려 주다/분명히 밝히다’의 의미가 자연스러워, 이미 주어진 계시의 성격을 살려 번역했습니다.
- source_word: אָדָם
  english_pob_choice: O man
  chosen_korean: 사람에게
  alternatives_korean:
  - 인간에게
  - 사람아
  - 인자에게
  lexicon: HALOT
  rationale: 히브리어 단수 호격의 대표적 인간 호소를 한국어에서는 ‘사람’으로 옮겨 남성 지시를 과도하게 풀지 않으면서도, 직설적 호명 대신 문맥상 자연스러운 수혜 대상을 살렸습니다.
- source_word: דּוֹרֵשׁ מִמְּךָ
  english_pob_choice: require of you
  chosen_korean: 네게서 요구하시는 것은
  alternatives_korean:
  - 네게서 구하시는 것은
  - 네게서 바라시는 것은
  - 네게 요구하시는 것은
  lexicon: HALOT
  rationale: דרש עם מן은 단순히 ‘묻다’보다 윤리적·언약적 기대를 포함한 ‘요구하다’가 더 정확하며, ‘네게서’로 מן의 출발점을 보존했습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인애
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 사랑
  - 자애
  lexicon: HALOT
  rationale: POB의 ‘steadfast love’가 담는 חֶסֶד의 언약적 충성·지속적 사랑을 한국어 성경에서 널리 쓰이는 ‘인애’로 간결하게 옮겼습니다.
- source_word: הַצְנֵעַ לֶכֶת
  english_pob_choice: to walk humbly
  chosen_korean: 겸손히 행하는 것
  alternatives_korean:
  - 겸손히 걷는 것
  - 조심스럽게 행하는 것
  - 낮추어 걸어가는 것
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 보행이 아니라 삶의 태도를 가리키므로, 한국어에서는 행위 전체를 포괄하는 ‘겸손히 행하다’가 가장 자연스럽습니다.
theological_decisions:
- issue: חֶסֶד의 핵심 뉘앙스
  chosen_reading: 인애
  alternative_readings:
  - 긍휼
  - 자비
  - 변함없는 사랑
  rationale: 이 절의 윤리 삼중구조에서 חֶסֶד는 단순한 동정심보다 하나님 언약 안에서 지속되는 사랑을 뜻하므로, 한국어 교회어휘 중 그 깊이를 가장 압축적으로 살리는 ‘인애’를 택했습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: אָדָם의 대표성
  chosen_reading: 사람에게
  alternative_readings:
  - 사람아
  - 인간에게
  - 남자에게
  rationale: 히브리어 단수 호격은 특정 개인보다 대표적 인간을 부르므로, 성중립화 없이도 현대 한국어에서 과도한 남성성 표지를 피하는 방향으로 처리했습니다.
  doctrine_reference: Translation philosophy §4
