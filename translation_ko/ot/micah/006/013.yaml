    text: 또는, '너를 치면서 병들게 하였다.' 히브리어 동사는 병들게 하거나 약하게 한다는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  english_pob_choice: Therefore I too
  chosen_korean: 그러므로 나도
  alternatives_korean:
  - 나도 또한
  - 그리고 나도
  lexicon: HALOT
  rationale: 전후 문맥의 심판 선언을 이어 주는 인과·추론 관계를 살려 '그러므로'로 옮기고, 가미의 강조는 '나도'로 자연스럽게 반영했습니다.
- source_word: הֶחֱלֵיתִי הַכּוֹתֶךָ
  english_pob_choice: have begun to strike you
  chosen_korean: 너를 치기 시작하여
  alternatives_korean:
  - 너를 치기 시작했습니다
  - 너를 치며 병들게 했습니다
  - 너를 치며 약하게 했습니다
  lexicon: HALOT
  rationale: Hiphil חלה와 뒤따르는 נכה 부정사 결합을 POB의 판단처럼 개시적 표현으로 받아, 질병보다 심판의 개시를 분명히 하는 한국어로 옮겼습니다.
- source_word: הַשְׁמֵם
  english_pob_choice: making you desolate
  chosen_korean: 너를 황폐하게 하겠습니다
  alternatives_korean:
  - 너를 황폐하게 하며
  - 너를 폐허로 만들겠습니다
  - 너를 황폐케 하겠습니다
  lexicon: HALOT
  rationale: שׁמם의 결과적 파괴·황폐 상태를 현대 한국어에서 선명하게 드러내는 표현으로 옮겼습니다.
- source_word: עַל חַטֹּאתֶךָ
  english_pob_choice: because of your sins
  chosen_korean: 네 죄들 때문에
  alternatives_korean:
  - 네 죄 때문에
  - 네 죄들로 인하여
  lexicon: HALOT
  rationale: עַל의 원인·근거 기능을 자연스럽게 드러내면서, 복수형 חַטֹּאתֶךָ를 따라 '죄들'로 옮겼습니다.
theological_decisions:
- issue: 하나님의 심판 진술에서 Hiphil חלה의 처리
  chosen_reading: 개시적 심판 선언으로 읽어 '치기 시작하여'라고 번역했습니다.
  alternative_readings:
  - '''병들게 하여'''
  - '''약하게 하여'''
  - '''상처 입혀'''
  rationale: 문맥의 초점이 신체적 질병 설명보다 징벌의 점증에 있으므로, POB의 문장 이해를 따르되 한국어에서는 심판의 시작을 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
