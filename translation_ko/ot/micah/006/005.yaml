id: MIC.6.5
reference: Micah 6:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַמִּ֗/י זְכָר נָא֙ מַה יָּעַ֗ץ בָּלָק֙ מֶ֣לֶךְ מוֹאָ֔ב וּ/מֶה עָנָ֥ה אֹת֖/וֹ בִּלְעָ֣ם בֶּן בְּע֑וֹר מִן הַ/שִּׁטִּים֙ עַד הַ/גִּלְגָּ֔ל לְמַ֕עַן דַּ֖עַת צִדְק֥וֹת יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/005.yaml
  text: My people[a], please remember what Balak king of Moab planned[c][b], and what Balaam son of Beor answered him—from Shittim to Gilgal—so that you may know the righteous acts of Yahweh.
  footnotes:
  - marker: a
    text: Or 'what Balak king of Moab counseled/devised.'
    reason: lexical_alternative
  - marker: b
    text: Shittim and Gilgal are place names recalling Israel's journey from the plains of Moab into the land.
    reason: cultural_note
  - marker: c
    text: Or 'the saving acts of the LORD' or 'the acts of righteousness of the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 내 백성아[a], 부디 기억하십시오. 모압 왕 발락이 무엇을 꾀했는지[b], 그리고 브올의 아들 발람이 그에게 어떻게 대답했는지를—싯딤에서 길갈까지—그리하여 당신들이 야훼의 의로운 행위들을 알게 하려는 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모압 왕 발락이 무엇을 조언/꾸몄는지.’
    reason: lexical_alternative
  - marker: b
    text: 싯딤과 길갈은 모압 평지에서 약속의 땅으로 들어가는 여정을 회상시키는 지명입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘야훼의 구원 행위들’ 또는 ‘야훼의 의의 행위들.’
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  english_pob_choice: My people
  chosen_korean: 내 백성아
  alternatives_korean:
  - 내 민족아
  - 나의 백성이여
  lexicon: HALOT
  rationale: 하나님의 언약적 호칭을 자연스럽게 살리기 위해 ‘백성’을 택했고, 직설적 소유격으로 관계성을 보존했습니다.
- source_word: זְכָר נָא
  english_pob_choice: please remember
  chosen_korean: 부디 기억하십시오
  alternatives_korean:
  - 기억하십시오
  - 지금 기억하십시오
  lexicon: HALOT
  rationale: נא의 간청 뉘앙스를 ‘부디’로 살리고, 현대 합쇼체 명령형으로 다듬었습니다.
- source_word: מַה יָּעַץ
  english_pob_choice: what ... planned
  chosen_korean: 무엇을 꾀했는지
  alternatives_korean:
  - 무엇을 계획했는지
  - 무엇을 꾀했는지
  lexicon: HALOT
  rationale: 발락의 적대적 의도와 계략성을 드러내기 위해 ‘꾀하다’를 사용했으며, POB의 ‘planned’가 지닌 음험한 결을 반영했습니다.
- source_word: צִדְקוֹת יְהוָה
  english_pob_choice: the righteous acts of Yahweh
  chosen_korean: 야훼의 의로운 행위들
  alternatives_korean:
  - 야훼의 의로운 일들
  - 야훼의 구원 행위들
  - 야훼의 의의 행위들
  lexicon: HALOT
  rationale: צִדְקוֹת의 다층적 의미를 좁히지 않고, ‘의로운 행위들’로 렌더링해 역사 속 하나님의 의와 신실한 행동을 함께 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 컨테스티드 용어 표
  rationale: 문서화된 기본 원칙에 따라 신성명은 ‘야훼’로 옮겼습니다. ‘주님’으로 대체하면 고유명사성이 약해집니다.
theological_decisions:
- issue: צִדְקוֹת יְהוָה의 의미 범위
  chosen_reading: 야훼의 의로운 행위들
  alternative_readings:
  - 야훼의 구원 행위들
  - 야훼의 의와 신실하신 행동들
  rationale: 문맥은 출애굽과 광야-가나안 여정 속 하나님의 역사적 행동을 가리키므로, ‘의로운 행위들’이 ‘구원’만으로 좁히지 않으면서도 하나님의 공의와 신실함을 함께 담아냅니다.
  doctrine_reference: Translation philosophy §3; Contested terms table on יְהוָה
- issue: 싯딤에서 길갈까지의 구문
  chosen_reading: —싯딤에서 길갈까지—
  alternative_readings:
  - 싯딤에서 길갈까지
  - 싯딤부터 길갈까지
  rationale: 지명 나열을 사건 기억 장치로 보존하기 위해 끼워 넣는 괄호식 설명 없이 본문 리듬을 살렸습니다. 이는 이스라엘의 여정을 환기하는 문맥적 표지입니다.
  doctrine_reference: 문화적 주석
