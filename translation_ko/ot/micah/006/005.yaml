revisions:
- from: 내 백성아[a], 부디 기억하십시오. 모압 왕 발락이 무엇을 꾀했는지[b], 그리고 브올의 아들 발람이 그에게 어떻게 대답했는지를—싯딤에서 길갈까지—그리하여 당신들이 야훼의 의로운 행위들을 알게 하려는 것입니다[c].
  to: 내 백성아, 부디 기억하십시오. 모압 왕 발락이 무엇을 꾀했는지[a], 브올의 아들 발람이 그에게 무엇이라고 대답했는지, 그리고 싯딤에서 길갈까지의 일을 기억하십시오[b]. 그리하면 너희가 야훼의 의로운 행위들을 알게 될 것입니다[c].
  rationale: 원문의 ‘무엇을’이라는 직접 목적어를 보존하고, 목적절을 현대 합쇼체 문장으로 자연스럽게 연결했습니다. 각주 표지를 해당 본문 어구에 바로 붙여 구조 오류를 해소했습니다. ‘싯딤에서 길갈까지의 일’은 원문의 압축된 지명 연쇄를 한국어 문법에 맞게 연결할 뿐, 역사적 사건을 교리적으로 또는 해석적으로 특정하지 않습니다.
  reviewer_model: gpt-5.6-terra
