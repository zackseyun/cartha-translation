  text: כִּ֤י הֶעֱלִתִ֨י/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/מִ/בֵּ֥ית עֲבָדִ֖ים פְּדִיתִ֑י/ךָ וָ/אֶשְׁלַ֣ח לְ/פָנֶ֔י/ךָ אֶת מֹשֶׁ֖ה אַהֲרֹ֥ן וּ/מִרְיָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/004.yaml
  text: For I brought you up from the land of Egypt[a], and from the house of slavery I redeemed you; and I sent before you Moses, Aaron, and Miriam.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'from the house of slavery.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 이집트 땅에서 올라오게 하였고, 노예들의 집에서 너를 속량하였으며, 네 앞에 모세와 아론과 미리암을 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 '노예들의 집'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעֱלִיתִיךָ
  english_pob_choice: I brought you up
  chosen_korean: 내가 너를 이집트 땅에서 올라오게 하였고
  alternatives_korean:
  - 내가 너를 이집트 땅에서 데리고 나왔고
  - 내가 너를 이집트 땅에서 이끌어 올렸고
  lexicon: HALOT
  rationale: עלה의 출애굽 관용구를 살리면서도 한국어로 자연스럽게 옮기기 위해 '올라오게 하다'를 택했습니다.
- source_word: מִבֵּית עֲבָדִים
  english_pob_choice: from the house of slavery
  chosen_korean: 노예들의 집에서
  alternatives_korean:
  - 노예 상태의 집에서
  - 노예 생활의 집에서
  - 종들의 집에서
  lexicon: HALOT
  rationale: 히브리어가 문자적으로는 '노예들의 집'을 뜻하므로, 전통적 완화어보다 bonded-status를 드러내는 표현을 유지했습니다.
- source_word: פְּדִיתִיךָ
  english_pob_choice: I redeemed you
  chosen_korean: 너를 속량하였으며
  alternatives_korean:
  - 너를 구속하였으며
  - 너를 구원하였으며
  - 너를 되찾았으며
  lexicon: HALOT
  rationale: פּדה의 구속/속량 의미를 살려, 단순한 구조보다 값 주고 건져낸 뉘앙스를 반영했습니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: before you
  chosen_korean: 네 앞에
  alternatives_korean:
  - 너보다 앞서
  - 너 앞쪽으로
  - 네 앞에서
  lexicon: HALOT
  rationale: 공간적 의미와 인도적 의미를 함께 살리는 가장 자연스러운 대응으로 보았습니다.
theological_decisions:
- issue: עֲבָדִים의 번역이 지닌 사회적·신학적 긴장
  chosen_reading: '''노예들의 집''으로 옮겨, 이스라엘이 해방된 구체적 피억압 상태를 드러냈습니다.'
  alternative_readings:
  - '''종들의 집'''
  - '''속박의 집'''
  - '''노예 제도의 집'''
  rationale: 본문은 추상적 '속박'보다 실제적 예속 상태를 상기시키므로, 그 긴장을 약화하지 않는 번역을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1
