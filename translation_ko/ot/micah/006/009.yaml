  yaml_path: translation/ot/micah/006/009.yaml
  text: 'The voice of the LORD cries out to the city—and sound wisdom fears your name: hear the rod and him who appointed it.'
translation:
  language: ko
  text: 여호와의 소리가 성읍을 향해 외치십니다. 참된 지혜는 당신의 이름을 봅니다.[a] 매를 들으십시오. 또 그것을 정하신 분을 들으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 직역하면 “참된 지혜가 당신의 이름을 본다”입니다. 이 구절의 문법과 의미는 논쟁적이며, 일부 번역은 이를 “당신의 이름을 두려워함이 지혜이다”와 같이 해석하여 옮깁니다.
    reason: source_note
lexical_decisions:
- source_word: ק֤וֹל יְהוָה֙
  english_pob_choice: The voice of the LORD
  chosen_korean: 여호와의 소리
  alternatives_korean:
  - 주님의 소리
  - 야훼의 소리
  lexicon: קול / יהוה
  rationale: 히브리어 원문의 직접 구조를 살려 ‘소리’로 옮기고, 본문상 YHWH는 원문 음역 대신 통용 번역어 ‘여호와’로 처리했습니다.
- source_word: לָעִיר יִקְרָא
  english_pob_choice: cries out to the city
  chosen_korean: 성읍을 향해 외치십니다
  alternatives_korean:
  - 성읍에게 외치십니다
  - 도성에 외치십니다
  lexicon: קרא + עיר
  rationale: ‘부르다/외치다’의 강한 발화 동사를 살리고, יעד가 아닌 방향 표지를 반영해 ‘향해’를 넣었습니다.
- source_word: תוּשִׁיָּה יִרְאֶה שְׁמֶךָ
  english_pob_choice: and sound wisdom fears your name
  chosen_korean: 지혜가 당신의 이름을 보고 두려워합니다
  alternatives_korean:
  - 견고한 지혜가 당신의 이름을 두려워합니다
  - 지혜가 당신의 이름을 경외합니다
  lexicon: תושיה / ראה / שם
  rationale: POB의 핵심 선택인 ‘fears’를 살리기 위해 ‘두려워합니다’를 유지했고, 동사 ראה는 관계상 ‘보고’로 직역했습니다.
- source_word: מַטֶּה
  english_pob_choice: the rod
  chosen_korean: 매
  alternatives_korean:
  - 지팡이
  - 막대기
  lexicon: מטה
  rationale: 징계와 권위를 함께 드러내는 짧은 한국어 대응으로 ‘매’를 택해, 문맥의 심판 도구 성격을 살렸습니다.
- source_word: וּמִ֥י יְעָדָֽהּ
  english_pob_choice: and him who appointed it
  chosen_korean: 그것을 정하신 분
  alternatives_korean:
  - 그것을 정하신 이
  - 그것을 정하신 분을
  lexicon: יעד
  rationale: 대명사 -הּ가 가리키는 ‘매’(지팡이/징계)를 받아, 심판 도구를 정하신 주체를 명시적으로 옮겼습니다.
theological_decisions:
- issue: 여호와의 소리와 지혜의 인격화
  chosen_reading: ‘지혜’가 여호와의 이름을 보고 두려워하는 표현을 살려, 지혜가 의인화된 시적 진술로 읽었습니다.
  alternative_readings:
  - ‘지혜가 당신의 이름을 경외합니다’처럼 완화된 경외 표현
  - ‘지혜가 당신의 이름을 두려워합니다’를 문자적으로 유지
  rationale: 히브리어 원문은 의인화와 감정 동사를 통해 심판 앞의 반응을 강하게 드러내므로, 이를 약화하지 않고 유지했습니다.
  doctrine_reference: 시적 의인화와 심판 이미지
