id: MIC.6.2
reference: Micah 6:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁמְע֤וּ הָרִים֙ אֶת רִ֣יב יְהוָ֔ה וְ/הָ/אֵתָנִ֖ים מֹ֣סְדֵי אָ֑רֶץ כִּ֣י רִ֤יב לַֽ/יהוָה֙ עִם עַמּ֔/וֹ וְ/עִם יִשְׂרָאֵ֖ל יִתְוַכָּֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/002.yaml
  text: Hear[a], O mountains, the case of Yahweh, and you enduring foundations of the earth; for Yahweh has a case against his people[c][b], and he will contend with Israel.
  footnotes:
  - marker: a
    text: Or 'dispute,' 'lawsuit,' or 'controversy' for 'case' (Hebrew רִיב), a term often used for a covenant-legal accusation.
    reason: lexical_alternative
  - marker: b
    text: Literally 'with his people'; in this legal context, the sense is 'against his people.'
    reason: lexical_alternative
  - marker: c
    text: Or 'strong' or 'ancient' foundations of the earth' for 'enduring foundations of the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 산들아, 야훼의 송사를 들으십시오. 땅의 영속적인 기초들아. 이는 야훼께서 자기 백성에게 송사를 가지시고, 이스라엘과 변론하실 것이기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רִיב는 여기서 ‘송사’, ‘분쟁’, ‘소송’, ‘논쟁’ 등으로 옮길 수 있는 법정·언약 소송 용어입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 백성에게’는 직역상 ‘자기 백성과 함께’에 가깝지만, 이 문맥에서는 야훼께서 자기 백성을 상대로 송사를 가지신다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘영속적인’은 ‘강한’ 또는 ‘오래된’ 기초들로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 들으세요
  lexicon: HALOT
  rationale: 복수 명령형의 호소를 한국어 합쇼체 명령으로 옮겨 예언자적 직접 호명과 공적 선포의 긴장을 살렸습니다.
- source_word: רִיב
  english_pob_choice: case
  chosen_korean: 송사
  alternatives_korean:
  - 사건
  - 분쟁
  - 소송
  lexicon: HALOT
  rationale: 여기서는 언약 법정의 고소/논쟁 의미가 강하므로, 일반적인 '사건'보다 법정적 뉘앙스가 드러나는 '송사'가 적절합니다.
- source_word: הָאֵתָנִים
  english_pob_choice: enduring
  chosen_korean: 영속적인
  alternatives_korean:
  - 견고한
  - 강한
  - 오래된
  lexicon: HALOT
  rationale: 산과 더불어 '땅의 기초'를 수식하는 말로서, 단순 물리적 강함보다 오래 지속되는 견고함을 드러내는 '영속적인'이 문맥에 맞습니다.
- source_word: עִם עַמּוֹ
  english_pob_choice: against his people
  chosen_korean: 자기 백성에게
  alternatives_korean:
  - 자기 백성과 함께
  - 자기 백성에 대하여
  lexicon: HALOT
  rationale: 히브리어의 직역은 'with'지만, רִיב의 법정 문맥에서 상대방을 향한 대립 관계이므로 본문 의미를 살려 '자기 백성에게'로 옮기고, 별도의 각주 대신 문장 전체로 법정성을 반영했습니다.
- source_word: יִתְוַכָּח
  english_pob_choice: he will contend
  chosen_korean: 변론하실 것입니다
  alternatives_korean:
  - 다투실 것입니다
  - 논쟁하실 것입니다
  - 송사하실 것입니다
  lexicon: HALOT
  rationale: 히트파엘형의 법정적 '변론/논박' 의미를 살리면서, 앞의 '송사'와 중복을 피하고 현대 한국어에서 자연스러운 공적 법정 발화를 유지합니다.
theological_decisions:
- issue: 야훼의 이름을 본문에서 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 יְהוָה가 직접 나오므로, 프로젝트 기본값에 따라 하나님의 고유명을 '야훼'로 옮겨 언약적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 법정적 רִיב와 יִתְוַכָּח의 관계
  chosen_reading: 송사 / 변론
  alternative_readings:
  - 분쟁 / 다투다
  - 소송 / 논쟁
  rationale: 이 절은 산과 땅의 기초를 증인으로 세우는 언약 소송 장면이므로, 관계를 약화시키는 일반 대립어보다 법정적 표현을 유지했습니다.
  doctrine_reference: Micah 6 covenant lawsuit context
