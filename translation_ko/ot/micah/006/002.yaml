  english_pob_choice: he will contend
  chosen_korean: 변론하실 것입니다
  alternatives_korean:
  - 다투실 것입니다
  - 논쟁하실 것입니다
  - 송사하실 것입니다
  lexicon: HALOT
  rationale: 히트파엘형의 법정적 '변론/논박' 의미를 살리면서, 앞의 '송사'와 중복을 피하고 현대 한국어에서 자연스러운 공적 법정 발화를 유지합니다.
theological_decisions:
- issue: 야훼의 이름을 본문에서 어떻게 표기할지
