  naturalness: 현 초안의 ‘내가 … 가지고도 무죄로 인정하겠느냐’는 누가 무죄로 인정되는지 목적어가 없어 한국어 문장 구조상 부자연스럽고 의미가 불완전합니다. 수정문은 현대 표준어 합쇼체의 수사의문문으로 자연스럽습니다.
  terminology: ‘부정한 저울’은 רֶשַׁע의 윤리적 비난을 적절히 반영합니다. ‘속이는 추’는 אַבְנֵי מִרְמָה의 거래상 기만을 전달하며, 각주에서 직역과 돌추의 배경을 보완합니다.
