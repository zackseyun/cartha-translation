id: MIC.6.11
reference: Micah 6:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/אֶזְכֶּ֖ה בְּ/מֹ֣אזְנֵי רֶ֑שַׁע וּ/בְ/כִ֖יס אַבְנֵ֥י מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/011.yaml
  text: Shall I acquit one with wicked scales and with a bag of deceptive weights?[a][b]
  footnotes:
  - marker: a
    text: Or, 'Shall I be pure with wicked scales and with a bag of false weights?' The Hebrew verb can be understood as 'be pure' or 'be acquitted/count as innocent'; the context favors the forensic sense.
    reason: alternative_reading
  - marker: b
    text: Literally, 'stones of deceit,' referring to stone weights used in trade.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 부정한 저울과 속이는 추 주머니를 가지고도 무죄로 인정하겠느냐?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘부정한 저울과 거짓 추 주머니를 가지고도 내가 깨끗하다고 하겠느냐?’ 히브리어 동사는 ‘깨끗하다’ 또는 ‘무죄로 인정되다’로도 이해할 수 있으나, 문맥은 법정적 의미를 더 강하게 지지합니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘속임의 돌들’로, 장사할 때 쓰는 돌추를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/אֶזְכֶּה
  english_pob_choice: Shall I acquit
  chosen_korean: 무죄로 인정하겠느냐
  alternatives_korean:
  - 깨끗하다고 하겠느냐
  - 의롭다고 하겠느냐
  - 용납하겠느냐
  lexicon: HALOT
  rationale: זכה는 여기서 법정적 의미로 쓰이므로, ‘무죄로 인정하다’가 문맥의 심판·공소 어조를 가장 잘 살립니다.
- source_word: בְּ/מֹאזְנֵי
  english_pob_choice: with ... scales
  chosen_korean: 저울
  alternatives_korean:
  - 천칭
  - 저울대
  lexicon: HALOT
  rationale: מֹאזְנַיִם은 상거래에서 쓰는 저울이므로, 현대 한국어에서는 자연스러운 ‘저울’이 가장 직접적입니다.
- source_word: אַבְנֵי מִרְמָה
  english_pob_choice: deceptive weights
  chosen_korean: 속이는 추
  alternatives_korean:
  - 거짓 추
  - 사기 저울추
  - 기만의 돌
  lexicon: HALOT
  rationale: 직역하면 ‘속임수의 돌’이지만, 상업적 맥락에서 실제 대상은 저울추이므로 한국어로는 기능을 드러내는 ‘속이는 추’가 적절합니다.
theological_decisions:
- issue: 화자의 법정적 어조
  chosen_reading: 하나님께서 부정한 거래를 하는 자를 무죄로 인정하실 수 있는가라는 심판 질문으로 옮겼습니다.
  alternative_readings:
  - 화자가 자기 자신이 깨끗할 수 있는지를 묻는 것으로 읽을 수 있습니다.
  rationale: 미가 6장은 언약 소송의 맥락이므로, 첫 인칭 질문은 하나님의 공의로운 판결을 묻는 법정적 수사로 이해하는 것이 자연스럽습니다.
  doctrine_reference: 언약 소송, 하나님의 공의
- issue: ‘부정한 저울’의 윤리적 강도
  chosen_reading: ‘부정한’과 ‘속이는’으로 옮겨 상거래 부정의 도덕적 비난을 유지했습니다.
  alternative_readings:
  - ‘불공정한’으로 완화할 수 있습니다.
  rationale: 본문의 רֶשַׁע, מִרְמָה는 단순한 불균형이 아니라 악의적 기만을 가리키므로, 약화하지 않고 윤리적 강도를 보존했습니다.
  doctrine_reference: 정직한 상거래, 사회적 의
- issue: 대명사 처리
  chosen_reading: 첫인칭을 살려 ‘내가’로 번역했습니다.
  alternative_readings:
  - ‘주께서’로 명시할 수 있습니다.
  rationale: 히브리어 동사의 1인칭 형태와 수사적 질문의 흐름을 보존하기 위해, 화자를 드러내는 1인칭을 유지했습니다.
  doctrine_reference: 문맥상 하나님의 발화
