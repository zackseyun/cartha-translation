  text: עַמִּ֛/י מֶה עָשִׂ֥יתִי לְ/ךָ֖ וּ/מָ֣ה הֶלְאֵתִ֑י/ךָ עֲנֵ֥ה בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/003.yaml
  text: My people[b][a], what have I done to you? How have I wearied you? Answer me.
  footnotes:
  - marker: a
    text: Or “How have I burdened you?”
    reason: lexical_alternative
  - marker: b
    text: Or “Answer against me” or “Testify against me,” reflecting the possible courtroom setting of the passage.
    reason: alternative_reading
translation:
  language: ko
  text: 내 백성아, 내가 네게 무엇을 했느냐? 내가 어떻게 너를 지치게 했느냐? 내게 대답하여라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 너에게 짐이 되었느냐?”
    reason: lexical_alternative
  - marker: b
    text: 또는 “나를 거슬러 대답하여라” 혹은 “나를 상대로 증언하여라.” 본문은 법정적 장면을 암시할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  english_pob_choice: My people
  chosen_korean: 내 백성아
  alternatives_korean:
  - 내 백성
  - 오 내 백성
  lexicon: HALOT
  rationale: 1인칭 소유격이 붙은 호격이므로 ‘내 백성아’가 직접적이고 자연스럽습니다. 현대 한국어에서는 ‘오’를 보태지 않아도 호소의 뉘앙스가 유지됩니다.
- source_word: עָשִׂיתִי לְךָ
  english_pob_choice: have I done to you
  chosen_korean: 내가 네게 무엇을 했느냐
  alternatives_korean:
  - 내가 네게 무엇을 하였느냐
  - 내가 네게 무엇을 했습니까
  lexicon: HALOT
  rationale: עשה + ל의 방향성을 살려 ‘네게 … 했느냐’로 옮겼습니다. 첫 질문의 수사적 성격을 유지하기 위해 종결은 반말형 반문으로 처리했습니다.
- source_word: הֶלְאֵתִיךָ
  english_pob_choice: have I wearied you
  chosen_korean: 내가 어떻게 너를 지치게 했느냐
  alternatives_korean:
  - 내가 어떻게 너를 피곤하게 했느냐
  - 내가 어떻게 너에게 짐이 되었느냐
  lexicon: HALOT
  rationale: 히필형 לאה의 사역적 의미를 살려 ‘지치게 하다’로 옮겼습니다. 영어 POB의 ‘wearied’와, 가능한 ‘burdened’의 의미를 함께 포괄할 수 있습니다.
- source_word: עֲנֵה בִּי
  english_pob_choice: Answer me / Answer against me / Testify against me
  chosen_korean: 내게 대답하여라
  alternatives_korean:
  - 나에게 대답하여라
  - 내게 대답하라
  - 내게 대답해 보아라
  lexicon: HALOT
  rationale: 어조는 문맥상 하나님이 백성에게 응답을 요구하는 것으로, 기본 의미는 ‘대답하다’가 가장 적절합니다. ‘against me’의 법정적 뉘앙스는 본문 주해상 가능하지만, 주본문에서는 과도하게 드러내지 않았습니다.
theological_decisions:
- issue: 여호와의 언약 소송적 어조
  chosen_reading: 본문의 직접적 질문과 응답 요구를 유지하되, 본문 안에서 ‘고발’이나 ‘증언’ 같은 법정 용어를 확정적으로 넣지는 않았습니다.
  alternative_readings:
  - 내게 대답하여라
  - 내게 대답하여라 — 혹은 나를 상대로 증언하여라
  rationale: 히브리어는 법정적 상황을 시사할 수 있지만, 필수는 아닙니다. 따라서 POB의 절제된 처리에 맞춰 직접적 호소를 보존했습니다.
  doctrine_reference: 언약 소송(covenant lawsuit) 배경 주해
