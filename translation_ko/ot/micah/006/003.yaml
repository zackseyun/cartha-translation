translation:
  language: ko
  text: 내 백성아, 내가 네게 무엇을 하였습니까? 내가 어떻게 너를 지치게 하였습니까?[a] 내게 대답하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
