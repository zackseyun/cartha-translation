  source_fidelity: 원문의 두 수사 의문문과 제물의 점층적 과장, 곧 ‘수천 마리의 숫양’과 ‘기름의 수만 줄기’, 그리고 맏이와 몸의 열매를 바치겠다는 물음은 유지되어야 합니다. 다만 בְּכוֹרִי는 본문에서 명시적으로 ‘아들’이라고 하지 않으므로 ‘맏이’가 더 절제된 번역입니다. נַחֲלֵי שָׁמֶן은 기름의 풍성함을 비유하는 복수의 물줄기이므로 ‘수만 개의 기름의 시내’보다 ‘기름의 수만 줄기’가 원문에 더 가깝고 한국어로도 자연스럽습니다.
