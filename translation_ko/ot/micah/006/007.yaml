source:
  edition: WLC
  text: הֲ/יִרְצֶ֤ה יְהוָה֙ בְּ/אַלְפֵ֣י אֵילִ֔ים בְּ/רִֽבְב֖וֹת נַֽחֲלֵי שָׁ֑מֶן הַ/אֶתֵּ֤ן בְּכוֹרִ/י֙ פִּשְׁעִ֔/י פְּרִ֥י בִטְנִ֖/י חַטַּ֥את נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/007.yaml
  text: Will Yahweh be pleased with thousands of rams[a], with ten thousands of streams of oil? Shall I give my firstborn for my transgression[c][b], the fruit of my body for the sin of my soul?
  footnotes:
  - marker: a
    text: Or 'with myriads of torrents/rivers of oil.' The Hebrew expression is hyperbolic, describing an immense abundance of oil.
    reason: lexical_alternative
  - marker: b
    text: Or 'the fruit of my womb.' Hebrew 'fruit of my body' is an idiom for one's offspring.
    reason: lexical_alternative
  - marker: c
    text: Or 'for the sin offering of my soul/life,' though 'sin' fits the parallel with 'my transgression' more naturally here.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 수천 마리의 숫양과 기름의 수만 줄기[a]를 기뻐하시겠습니까? 제가 제 허물 때문에 제 맏이를, 제 영혼의 죄 때문에 제 몸의 열매[b]를 드리겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기름의 수만 시내’. 히브리어 표현은 엄청난 양의 기름을 그린 과장법입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 태의 열매’. 히브리어의 ‘몸의 열매’는 자녀를 가리키는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִרְצֶה יְהוָה
  english_pob_choice: Will Yahweh be pleased
  chosen_korean: 야훼께서 …를 기뻐하시겠습니까
  alternatives_korean:
  - 야훼께서 …를 받으시겠습니까
  - 야훼께서 …를 받아들이시겠습니까
  lexicon: HALOT
  rationale: יִרְצֶה의 평가적·관계적 의미를 살려 단순한 ‘받다’보다 ‘기뻐하시다’가 더 자연스럽고, 하나님의 이름은 POB 기준에 따라 야훼로 옮겼습니다.
- source_word: בְּאַלְפֵי אֵילִים
  english_pob_choice: with thousands of rams
  chosen_korean: 수천 마리의 숫양
  alternatives_korean:
  - 수천의 숫양들
  - 숫양 수천 마리
  lexicon: HALOT
  rationale: 제사 맥락의 אֵילִים를 ‘숫양’으로 옮기고, בְּ는 한국어에서 자연스러운 수량 보조 표현으로 처리했습니다.
- source_word: בְּרִבְבֹת נַחֲלֵי שָׁמֶן
  english_pob_choice: with ten thousands of streams of oil
  chosen_korean: 수만 개의 기름의 시내
  alternatives_korean:
  - 기름의 수만 시내
  - 수만의 기름 시내
  lexicon: HALOT
  rationale: 나할의 물줄기 이미지를 살려 ‘시내’로 옮기되, 히브리어의 과장법을 유지하기 위해 ‘수만 개의’로 표현했습니다.
- source_word: בְּכוֹרִי
  english_pob_choice: my firstborn
  chosen_korean: 제 맏아들
  alternatives_korean:
  - 제 첫째 아들
  - 제 장자
  lexicon: HALOT
  rationale: 명시되지 않은 ‘아들’을 문맥상 보완하되, 전통적 교회어법의 ‘장자’보다 희생 제의의 충격을 더 직접적으로 드러내는 ‘맏아들’을 선택했습니다.
- source_word: פִּשְׁעִי
  english_pob_choice: my transgression
  chosen_korean: 제 범죄
  alternatives_korean:
  - 제 허물
  - 제 반역
  lexicon: HALOT
  rationale: פֶּשַׁע의 반역적 위반을 담되, 문맥상 제의적 대가를 묻는 표현과 맞물리도록 ‘범죄’로 옮겼습니다.
- source_word: פְּרִי בִטְנִי
  english_pob_choice: the fruit of my body
  chosen_korean: 제 몸의 열매
  alternatives_korean:
  - 제 태의 열매
  - 제 자식
  lexicon: HALOT
  rationale: 히브리어 관용구를 과도하게 해설하지 않고, POB의 직역감을 살려 ‘몸의 열매’로 옮겼습니다.
- source_word: חַטַּאת נַפְשִׁי
  english_pob_choice: the sin of my soul
  chosen_korean: 제 영혼의 죄
  alternatives_korean:
  - 제 생명의 죄
  - 제 죄
  lexicon: HALOT
  rationale: חַטַּאת을 여기서는 ‘속죄제’가 아니라 앞의 ‘범죄’와 평행을 이루는 일반적 의미의 ‘죄’로 보고, נֶפֶשׁ는 인격적 내면을 드러내는 ‘영혼’으로 옮겼습니다.
theological_decisions:
- issue: 하나님이 어린 제사를 원하시는 것처럼 들릴 수 있는 표현을 어떻게 처리할지
  chosen_reading: 수사 의문문으로 유지하여, 제사가 충분할 수 있다는 제안을 드러내면서도 야훼의 실제 요구로 오해되지 않게 했습니다.
  alternative_readings:
  - 평서문처럼 매끄럽게 풀어 오해 가능성을 줄이기
  - 의미를 완화해 ‘드려도 되겠습니까’로 옮기기
  rationale: 문맥상 이 구절은 제의의 과잉 제안을 극대화해 그 한계를 폭로하는 논법이므로, 충격을 약화시키지 않는 것이 원문 의도에 더 충실합니다.
  doctrine_reference: Micah 6:6-8 문맥의 수사 구조
