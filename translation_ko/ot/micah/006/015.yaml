source:
  edition: WLC
  text: אַתָּ֥ה תִזְרַ֖ע וְ/לֹ֣א תִקְצ֑וֹר אַתָּ֤ה תִדְרֹֽךְ זַ֨יִת֙ וְ/לֹא תָס֣וּךְ שֶׁ֔מֶן וְ/תִיר֖וֹשׁ וְ/לֹ֥א תִשְׁתֶּה יָּֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/015.yaml
  text: You will sow[a], but you will not reap; you will tread olives, but you will not anoint yourself with oil; and you will tread out new wine, but you will not drink wine.
  footnotes:
  - marker: a
    text: Hebrew literally, 'you will tread olives ... and new wine,' with the second clause likely carrying over the verb 'tread/press' from the first.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 씨를 뿌리지만 거두지 못할 것입니다. 당신은 감람을 밟지만 기름을 몸에 바르지 못할 것이며, 포도를 밟아 새 포도주를 내고도 포도주를 마시지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘감람을 밟고 … 새 포도주를 [밟고]’라고 하며, 둘째 절에는 앞의 ‘밟다’가 이어지는 것으로 보입니다. 본문은 한국어의 자연스러운 표현을 위해 ‘포도를 밟아 새 포도주를 내다’로 풀어 옮겼습니다.
    reason: source_note
