  lexicon: WLC/HALOT
  rationale: סוך는 몸에 기름을 바르거나 문지르는 뜻이어서, 결과적으로 그 기름을 개인적으로 누리지 못한다는 의미를 살려 「기름으로 자신을 바르지 못하다」로 옮겼습니다.
- source_word: תִירוֹשׁ
  english_pob_choice: new wine
  chosen_korean: 새 포도
  alternatives_korean:
  - 새 포도주
  - 포도즙
  - 새 포도즙
  lexicon: WLC/HALOT
  rationale: תירוש은 갓 나온 포도 산물을 가리키므로, 앞의 감람과 평행을 이루게 하면서도 아직 빚어지기 전의 생산물을 드러내는 「새 포도」를 택했습니다.
- source_word: וְתִירוֹשׁ
  english_pob_choice: and you will tread out new wine
  chosen_korean: 새 포도를 밟지만
  alternatives_korean:
  - 새 포도를 짜지만
  - 새 포도를 밟아도
  - 새 포도를 밟고
  lexicon: WLC/HALOT
  rationale: 히브리어는 둘째 절에 동사가 생략되어 있어 앞절의 ‘밟다’를 이어받습니다. 한국어에서는 그 생략을 보충해 같은 동작의 반복을 분명히 했습니다.
