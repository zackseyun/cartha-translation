  lexicon: WLC/HALOT
  rationale: דרך는 문자적으로 ‘밟다’이므로, 생산 과정을 구체적으로 드러내는 「감람을 밟다」로 옮겼습니다.
- source_word: תָסוּךְ שֶׁמֶן
  english_pob_choice: you will not anoint yourself with oil
  chosen_korean: 기름으로 자신을 바르지 못하다
  alternatives_korean:
