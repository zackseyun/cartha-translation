id: MIC.6.16
reference: Micah 6:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִשְׁתַּמֵּ֞ר חֻקּ֣וֹת עָמְרִ֗י וְ/כֹל֙ מַעֲשֵׂ֣ה בֵית אַחְאָ֔ב וַ/תֵּלְכ֖וּ בְּ/מֹֽעֲצוֹתָ֑/ם לְמַעַן֩ תִּתִּ֨/י אֹתְ/ךָ֜ לְ/שַׁמָּ֗ה וְ/יֹשְׁבֶ֨י/הָ֙ לִ/שְׁרֵקָ֔ה וְ/חֶרְפַּ֥ת עַמִּ֖/י תִּשָּֽׂאוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/016.yaml
  text: The statutes of Omri are kept[a], and all the works of the house of Ahab; and you walk in their counsels, so that I may make you a desolation, and her inhabitants an object of hissing[c][b], and you will bear the reproach of my people.
  footnotes:
  - marker: a
    text: Or 'the practices of the house of Ahab.'
    reason: lexical_alternative
  - marker: b
    text: Or 'her inhabitants a hissing,' that is, something people hiss at in derision.
    reason: cultural_note
  - marker: c
    text: Or 'the disgrace of my people,' or 'the reproach against my people.' The Hebrew phrase is compact and may be understood in more than one way.
    reason: alternative_reading
translation:
  language: ko
  text: 오므리의 규례들이 지켜지고, 아합 집안의 모든 행위가 따르며, 그들의 계책대로 걸어왔습니다. 그래서 내가 너를 황폐하게 만들고, 그 주민들을 향해 쉿 소리 나는 대상이 되게 하며, 너희가 내 백성의 수치를 짊어지게 하겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아합 집안의 모든 행위’는 ‘아합 집안의 관행’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘쉿 소리 나는 대상’은 폐허를 향해 사람들이 조롱하며 내는 휘파람/쉿 소리를 반영합니다.
    reason: cultural_note
  - marker: c
    text: ‘내 백성의 수치’는 문맥상 ‘내 백성에게 돌아가는 수치’ 또는 ‘내 백성에 대한 수치’로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִשְׁתַּמֵּר / חֻקּוֹת
  english_pob_choice: are kept / statutes
  chosen_korean: 규례들이 지켜지고
  alternatives_korean:
  - 법규들이 지켜지고
  - 규정들이 지켜지고
  - 조례들이 지켜지고
  lexicon: HALOT
  rationale: חֻקּוֹת은 정식으로 제정된 규범을 가리키므로, 한국어에서는 종교적 관용어보다 중립적이고 법령적 뉘앙스가 살아 있는 ‘규례’가 가장 가깝습니다.
- source_word: מַעֲשֵׂה בֵית אַחְאָב
  english_pob_choice: the works of the house of Ahab
  chosen_korean: 아합 집안의 모든 행위가
  alternatives_korean:
  - 아합 집안의 일들이
  - 아합 가문의 행위가
  - 아합 집안의 행적이
  lexicon: HALOT
  rationale: מַעֲשֵׂה는 단순한 ‘일’보다 행위/행적을 포함하므로 ‘행위’로 옮기고, 집단적 범위를 분명히 하려고 ‘집안’을 썼습니다.
- source_word: בְּמֹעֲצוֹתָם
  english_pob_choice: in their counsels
  chosen_korean: 그들의 계책대로
  alternatives_korean:
  - 그들의 의논대로
  - 그들의 계획대로
  - 그들의 권고를 따라
  lexicon: HALOT
  rationale: מוֹעֵצָה는 ‘조언’보다 정치적·실천적 ‘계책/계획’의 뜻이 강해, 왕조의 정책을 따른다는 의미가 드러나도록 ‘계책’으로 옮겼습니다.
- source_word: לְשַׁמָּה / לִשְׁרֵקָה
  english_pob_choice: a desolation / an object of hissing
  chosen_korean: 황폐하게 만들고, 그 주민들을 향해 쉿 소리 나는 대상이 되게 하며
  alternatives_korean:
  - 황폐함이 되게 하고, 사람들이 조롱하며 휘파람 부는 대상이 되게 하며
  - 폐허가 되게 하고, 사람들이 휘파람으로 조롱하는 대상이 되게 하며
  - 황무지가 되게 하고, 사람들이 비웃는 대상이 되게 하며
  lexicon: HALOT
  rationale: שַׁמָּה는 ‘황폐/폐허’의 뜻이지만 심판 문맥의 강도를 살려 동사형으로 풀었고, לִשְׁרֵקָה는 단순한 비웃음보다 폐허를 향한 조롱의 ‘쉿/휘파람’ 이미지를 살렸습니다.
- source_word: וְחֶרְפַּת עַמִּי
  english_pob_choice: the reproach of my people
  chosen_korean: 내 백성의 수치를
  alternatives_korean:
  - 내 백성의 치욕을
  - 내 백성의 모욕을
  - 내 백성에 대한 수치를
  lexicon: HALOT
  rationale: חֶרְפָּה는 ‘수치/치욕/모욕’의 폭이 있으나, 시적 평행에서 짧고 강하게 들리는 ‘수치’가 가장 자연스럽습니다.
theological_decisions:
- issue: ‘당신들’과 ‘너’의 지시 대상이 바뀌는 구조
  chosen_reading: ‘너를 … 만들고’는 공동체/도성을 향한 단수 адрес를 살리고, 마지막은 ‘너희가’로 옮겨 복수 청자를 드러냈습니다.
  alternative_readings:
  - 전부 단수로 통일하기
  - 전부 복수로 풀어쓰기
  rationale: 히브리어는 단수·복수 호칭이 교차하므로, 한국어도 이를 평준화하지 않고 유지해야 경고의 대상과 책임의 범위가 흐려지지 않습니다.
  doctrine_reference: 원문 화행과 호칭의 수를 보존하는 번역 원칙
- issue: ‘내 백성의 수치’의 관계
  chosen_reading: 수치를 ‘너희가 짊어지게’ 하여, 수치가 단순 관찰 대상이 아니라 심판의 짐으로 전가되는 뉘앙스를 살렸습니다.
  alternative_readings:
  - 내 백성에게 돌아간 수치
  - 내 백성에 대한 수치
  - 내 백성의 수치를 듣게 됨
  rationale: 히브리어 נָשָׂא + חֶרְפָּה는 ‘짐을 지다’의 이미지를 강하게 띠므로, 심판의 부담과 굴욕이 실제로 얹힌다는 뜻을 보존하는 것이 좋습니다.
  doctrine_reference: 예언서의 심판 이미지 보존
