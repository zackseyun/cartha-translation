source:
  edition: WLC
  text: בַּ/מָּה֙ אֲקַדֵּ֣ם יְהוָ֔ה אִכַּ֖ף לֵ/אלֹהֵ֣י מָר֑וֹם הַ/אֲקַדְּמֶ֣/נּוּ בְ/עוֹל֔וֹת בַּ/עֲגָלִ֖ים בְּנֵ֥י שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/006.yaml
  text: With what shall I come before Yahweh[a], and bow myself before God on high? Shall I come before him with burnt offerings, with year-old calves?
  footnotes:
  - marker: a
    text: Or 'before God Most High.' The Hebrew says literally 'before God of height/on high.'
    reason: lexical_alternative
translation:
  language: ko
  text: 무엇으로 내가 야훼 앞에 나아가며, 지극히 높은 하나님 앞에 엎드리겠습니까? 내가 번제물과 한 살 된 송아지들로 그분께 나아가겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지극히 높으신 하나님 앞에’. 히브리어는 문자적으로 ‘높이/높은 곳의 하나님 앞에’라고 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּמָּה / אֲקַדֵּם
  english_pob_choice: With what shall I come before
  chosen_korean: 무엇으로 내가 … 앞에 나아가며
  alternatives_korean:
  - 무엇으로 내가 … 앞에 가며
  - 무엇으로 내가 … 앞에 나서며
  lexicon: HALOT
  rationale: 접근 수단을 묻는 수사적 질문이므로 ‘무엇으로’와 ‘나아가다’로 도입해 제의적 접근의 뉘앙스를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 칭호가 아니라 고유명사 יְהוָה이므로 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אִכַּף / לֵאלֹהֵי מָרוֹם
  english_pob_choice: bow myself before God on high
  chosen_korean: 지극히 높은 하나님 앞에 엎드리겠습니까
  alternatives_korean:
  - 높은 곳의 하나님 앞에 엎드리겠습니까
  - 지존하신 하나님 앞에 엎드리겠습니까
  lexicon: HALOT
  rationale: ‘엎드리다’는 경배의 몸짓을 분명히 하고, ‘지극히 높은’은 מָרוֹם의 높이/초월성을 자연스러운 한국어로 드러냅니다.
- source_word: בְּעוֹלוֹת בַּעֲגָלִים בְּנֵי שָׁנָה
  english_pob_choice: with burnt offerings, with year-old calves
  chosen_korean: 번제물과 한 살 된 송아지들로
  alternatives_korean:
  - 번제와 한 살 된 송아지들로
  - 번제물과 일 년 된 송아지들로
  lexicon: HALOT
  rationale: ‘עֹלוֹת’은 표준 제사 용어인 ‘번제물’로, ‘בְּנֵי שָׁנָה’는 제물의 연령을 분명히 하는 말이므로 ‘한 살 된’으로 옮겼습니다.
theological_decisions:
- issue: לֵאלֹהֵי מָרוֹם의 의미를 고정 칭호로 만들지 여부
  chosen_reading: 문맥을 따라 ‘지극히 높은 하나님’으로 옮겨, ‘Most High’라는 고정 칭호를 직접 삽입하지 않았습니다.
  alternative_readings:
  - 지극히 높으신 하나님
  - 하나님 Most High
  - 높은 곳의 하나님
  rationale: 히브리어는 עֶלְיוֹן 같은 정식 칭호보다 ‘높음/초월성’을 묘사하는 표현이어서, 원문의 서술성을 보존하는 번역이 더 정확합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1, #3, #5'
