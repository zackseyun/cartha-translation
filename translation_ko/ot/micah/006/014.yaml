  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַתָּ֤ה תֹאכַל֙ וְ/לֹ֣א תִשְׂבָּ֔ע וְ/יֶשְׁחֲ/ךָ֖ בְּ/קִרְבֶּ֑/ךָ וְ/תַסֵּג֙ וְ/לֹ֣א תַפְלִ֔יט וַ/אֲשֶׁ֥ר תְּפַלֵּ֖ט לַ/חֶ֥רֶב אֶתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/014.yaml
  text: You will eat[a], but you will not be satisfied, and your emptiness will remain within you; you will move away, but you will not rescue anything, and what you do rescue I will give to the sword.
  footnotes:
  - marker: a
    text: The Hebrew clause rendered 'your emptiness will remain within you' is difficult. It may also be understood as 'your humiliation will be in your midst' or 'your sinking will be within you.'
    reason: alternative_reading
translation:
  language: ko
  text: 당신은 먹겠지만 만족하지 못할 것이며, 당신의 속 빈 상태가 당신의 한가운데에 남아 있을 것입니다. 당신은 옮겨 가겠지만 아무것도 구해 내지 못할 것이며, 당신이 구해 내는 것은 내가 칼에 넘길 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 이 난해한 절은 ‘당신의 수치가 당신의 한가운데에 있을 것이다’ 또는 ‘당신의 가라앉음이 당신의 한가운데에 있을 것이다’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תֹאכַל
  english_pob_choice: you will eat
  chosen_korean: 당신은 먹겠지만
  alternatives_korean:
  - 당신은 먹을 것이지만
  - 먹으실 것이지만
  lexicon: HALOT
  rationale: 예언적 미래를 자연스러운 합쇼체로 옮기되, 단순한 섭취 행위를 분명히 살렸습니다.
- source_word: תִשְׂבָּע
  english_pob_choice: you will not be satisfied
  chosen_korean: 만족하지 못할 것이며
  alternatives_korean:
  - 배부르지 못할 것이며
  - 흡족하지 못할 것이며
  lexicon: HALOT
  rationale: 먹어도 채워지지 않는 대비를 살리기 위해 ‘만족하다’를 택했습니다.
- source_word: יֶשְׁחֲךָ בְּקִרְבֶּךָ
  english_pob_choice: your emptiness will remain within you
  chosen_korean: 당신의 속 빈 상태가 당신의 한가운데에 남아 있을 것입니다
  alternatives_korean:
  - 당신의 수치가 당신 가운데에 있을 것입니다
  - 당신의 가라앉음이 당신의 속에 있을 것입니다
  lexicon: HALOT
  rationale: 난해한 구절로서 영어 POB의 ‘emptiness’ 해석을 따르되, ‘한가운데에’로 בְּקִרְבֶּךָ의 내부성을 드러냈습니다.
- source_word: תַסֵּג
  english_pob_choice: you will move away
  chosen_korean: 당신은 옮겨 가겠지만
  alternatives_korean:
  - 당신은 물러가겠지만
  - 당신은 치워 가겠지만
  lexicon: HALOT
  rationale: 구체 대상을 확정하지 않고, 뒤의 ‘구해 내지 못할 것이며’와 연결되는 이동/철수의 뉘앙스를 보존했습니다.
- source_word: תַפְלִיט / תְּפַלֵּט
  english_pob_choice: you will not rescue anything / what you do rescue
  chosen_korean: 아무것도 구해 내지 못할 것이며, 당신이 구해 내는 것은
  alternatives_korean:
  - 아무것도 구하지 못할 것이며, 당신이 구하는 것은
  - 아무것도 살려 내지 못할 것이며, 당신이 살려 내는 것은
  lexicon: HALOT
  rationale: 같은 동사 뿌리의 반복을 살리기 위해 두 곳 모두 ‘구해 내다’로 맞추어, 실패와 남은 것의 대조를 유지했습니다.
- source_word: לַחֶרֶב אֶתֵּן
  english_pob_choice: I will give to the sword
  chosen_korean: 내가 칼에 넘길 것입니다
  alternatives_korean:
  - 내가 칼에 줄 것입니다
  - 내가 칼에 넘겨 줄 것입니다
  lexicon: HALOT
  rationale: 히브리어의 심판적 인도/넘김의 의미를 한국어에서 가장 자연스럽게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: וְיֶשְׁחֲךָ בְּקִרְבֶּךָ의 난해한 의미
  chosen_reading: 내부의 결핍/공허가 남는 심판으로 보존
  alternative_readings:
  - 수치가 한가운데에 있음
  - 신체적 가라앉음/침체
  rationale: 본문은 포식의 실패, 탈출의 실패, 칼에 넘겨짐으로 이어지므로, 의미를 과도하게 특정하지 않고 내부적 공허의 심판으로 남겨 두었습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
