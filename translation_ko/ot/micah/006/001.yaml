source:
  edition: WLC
  text: שִׁמְעוּ נָ֕א אֵ֥ת אֲשֶׁר יְהוָ֖ה אֹמֵ֑ר ק֚וּם רִ֣יב אֶת הֶ/הָרִ֔ים וְ/תִשְׁמַ֥עְנָה הַ/גְּבָע֖וֹת קוֹלֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/001.yaml
  text: 'Hear now what Yahweh says: Arise[a], contend before the mountains, and let the hills hear your voice.'
  footnotes:
  - marker: a
    text: Or 'contend with the mountains' or 'bring a case against the mountains.' The Hebrew verb has legal-dispute overtones; here the mountains are likely summoned as witnesses in the LORD's covenant lawsuit.
    reason: lexical_alternative
translation:
  language: ko
  text: “이제 야훼께서 말씀하시는 것을 들으십시오. 일어나십시오[a], 산들 앞에서 다투고, 언덕들이 당신의 소리를 듣게 하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산들과 다투십시오’ 혹은 ‘산들을 상대로 사건을 제기하십시오’. 히브리어 동사에는 법적 분쟁의 뉘앙스가 있으며, 여기서는 산들이 야훼의 언약 소송에서 증인으로 소환된 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  english_pob_choice: Hear now
  chosen_korean: 이제 …를 들으십시오
  alternatives_korean:
  - 지금 들으십시오
  - 들어 주십시오
  lexicon: HALOT
  rationale: שׁמע의 명령형은 주의를 기울여 들으라는 촉구이고, נָא는 정중한 부탁보다는 긴박성을 더하므로 ‘이제 …를 들으십시오’가 현대적이면서도 무게를 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 언약명은 관용적 호칭으로 바꾸지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 מקור의 고유성을 보존합니다.
- source_word: רִיב
  english_pob_choice: contend
  chosen_korean: 다투고
  alternatives_korean:
  - 변론하고
  - 소송을 제기하고
  - 논박하고
  lexicon: HALOT
  rationale: רִיב은 예언자적 법정 논쟁의 법적 뉘앙스를 가지지만, 한국어에서는 ‘다투다’가 짧고 직접적이며 뒤의 산·언덕 병행과 함께 소송 장면의 긴장을 유지합니다.
- source_word: קוֹלֶךָ
  english_pob_choice: your voice
  chosen_korean: 당신의 소리
  alternatives_korean:
  - 당신의 음성
  - 당신의 목소리
  lexicon: HALOT
  rationale: קוֹל은 직접화법에서 ‘소리/목소리/음성’ 모두 가능하지만, 산과 언덕이 듣는 대상이라는 시적 맥락에서는 ‘소리’가 가장 자연스럽습니다.
theological_decisions:
- issue: 산들과 언덕들의 역할
  chosen_reading: 재판의 상대라기보다 증인으로 소환된 존재들로 이해해, 법정 어휘를 과도하게 풀지 않았습니다.
  alternative_readings:
  - 산들을 직접 고발 대상으로 읽기
  - ‘산들 앞에서’ 대신 ‘산들과 다투고’로 강하게 법정화하기
  rationale: 영어 POB도 산들이 언약 소송의 증인일 가능성을 주석으로 남기며 본문을 과도하게 확정하지 않습니다. 그래서 한국어도 법정 뉘앙스를 살리되, 본문 자체는 열린 상태로 두었습니다.
  doctrine_reference: 'POB audit trail: lexical_alternative note on רִיב and mountains as witnesses'
