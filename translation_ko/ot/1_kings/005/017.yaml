  yaml_path: translation/ot/1_kings/005/017.yaml
  text: You know that David my father could not build a house for the name of Yahweh his God because of the warfare that surrounded him[a], until Yahweh put them under the soles of his feet.
  footnotes:
  - marker: a
    text: Or 'under his feet.' The Hebrew more fully says 'under the soles of his feet,' an image of subjugation.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신도 알다시피, 내 아버지 다윗은 그를 둘러싼 전쟁 때문에 야훼 자기 하나님의 이름을 위한 집을 건축할 수 없었습니다. 야훼께서 그들을 그의 발바닥 아래에 두실 때까지는 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 발 아래에’. 히브리어는 더 충분히 ‘그의 발바닥 아래에’라고 말하며, 굴복의 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה יָדַעְתָּ
