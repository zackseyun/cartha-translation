  - 건물
  lexicon: HALOT
  rationale: 히브리어의 무관사 ‘집’을 그대로 살리되, 문맥상 성전이지만 과도한 해석어인 ‘성전’은 본문 표현을 앞질러서 피했습니다.
- source_word: לְשֵׁם יְהוָה אֱלֹהָיו
  english_pob_choice: for the name of Yahweh his God
  chosen_korean: 야훼 자기 하나님의 이름을 위한
  alternatives_korean:
  - 야훼 그의 하나님의 이름을 위한
  - 야훼 하나님의 명예를 위한
  lexicon: HALOT
  rationale: ‘이름을 위한’이라는 관용구를 유지해, 단순히 ‘명예를 위해’로 풀어버리지 않고 언약적 표지를 보존했습니다.
- source_word: מִפְּנֵי הַמִּלְחָמָה ... עַד תֵּת יְהוָה אֹתָם תַּחַת כַּפּוֹת רַגְלוֹ
  english_pob_choice: because of the warfare ... until Yahweh put them under the soles of his feet
  chosen_korean: 그를 둘러싼 전쟁 때문에 ... 야훼께서 그들을 그의 발바닥 아래에 두실 때까지
  alternatives_korean:
  - 그를 둘러싼 전쟁 때문에 ... 야훼께서 그들을 그의 발 아래에 두실 때까지
  - 그를 둘러싼 전쟁 때문에 ... 야훼께서 그들을 그의 발바닥 밑에 두실 때까지
  lexicon: HALOT
  rationale: ‘전쟁’은 지속된 전쟁 상태를 가리키며, ‘발바닥 아래’는 히브리어의 더 충분한 굴복 이미지를 살립니다.
theological_decisions:
