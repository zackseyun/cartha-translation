  lexicon: HALOT
  rationale: 직접 호소의 현재적 확실성을 살리면서, 히브리어의 강조된 2인칭을 한국어에서 자연스럽게 드러냅니다.
- source_word: בַּיִת
  english_pob_choice: a house
  chosen_korean: 집
