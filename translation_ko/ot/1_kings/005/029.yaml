base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/029.yaml
  text: And Solomon had seventy thousand burden-bearers[a], and eighty thousand stonecutters in the mountains.
  footnotes:
  - marker: a
    text: Or 'hewers in the mountains.' The Hebrew literally says 'cutters/hewers in the mountain,' likely referring to quarry workers in the mountainous region.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬에게는 짐을 나르는 사람이 칠만 명, 산에서 돌을 깎는 사람[a]이 팔만 명 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산에서 돌을 캐는 사람들’입니다. 히브리어는 문자적으로 ‘산에서 깎는 사람들’이라고 하며, 아마도 산지의 채석장 노동자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  english_pob_choice: And Solomon had
  chosen_korean: 솔로몬에게는 … 있었습니다
  alternatives_korean:
  - 솔로몬이 … 가지고 있었습니다
  - 솔로몬에게 … 있었습니다
  lexicon: HALOT
  rationale: 소유·보유를 나타내는 היה + ל 구조를 한국어에서는 ‘…에게는 … 있었습니다’로 자연스럽게 옮겨 소속과 소유의 뉘앙스를 유지했습니다.
- source_word: נֹשֵׂא סַבָּל
  english_pob_choice: burden-bearers
  chosen_korean: 짐을 나르는 사람
  alternatives_korean:
  - 짐꾼
  - 짐 나르미
  lexicon: HALOT
  rationale: 부담 물건을 운반하는 노동자라는 뜻을 분명히 하기 위해 직역적인 ‘짐을 나르는 사람’을 택했으며, 현대 독자에게도 이해가 쉽도록 했습니다.
- source_word: חֹצֵב
  english_pob_choice: stonecutters
  chosen_korean: 돌을 다듬는 사람
  alternatives_korean:
  - 돌을 캐는 사람
  - 석공
  - 채석꾼
  lexicon: HALOT
  rationale: חצב의 기본 뜻은 ‘깎다/다듬다/찍어내다’이므로, 문맥상 산지 채석·가공 노동을 드러내는 ‘돌을 다듬는 사람’이 가장 직접적입니다.
- source_word: בָּהָר
  english_pob_choice: in the mountains
  chosen_korean: 산에서
  alternatives_korean:
  - 산지에서
  - 산들에서
  lexicon: HALOT
  rationale: 단수형 ‘산’이 지형 전체를 가리킬 수 있으므로, 채석이 이루어지는 장소를 간결하게 드러내는 ‘산에서’로 옮겼습니다.
