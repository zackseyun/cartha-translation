base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/019.yaml
  text: And behold[a], I intend to build a house for the name of Yahweh my God, just as Yahweh spoke to David my father, saying, ‘Your son, whom I will set in your place on your throne[c][b], he will build the house for my name.’
  footnotes:
  - marker: a
    text: Or 'to build a temple'; Hebrew literally 'to build a house.'
    reason: lexical_alternative
  - marker: b
    text: '''For the name of the LORD my God'' preserves the Hebrew temple formula, indicating the house dedicated to the LORD''s name and presence.'
    reason: cultural_note
  - marker: c
    text: Or 'whom I will appoint after you'; Hebrew literally 'whom I will set/give in your place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 나는 야훼께서 내 아버지 다윗에게 말씀하신 대로, 나의 하나님이신 야훼의 이름을 위하여 집을 짓고자 합니다. 야훼께서는 이렇게 말씀하셨습니다. ‘내가 네 자리에 네 왕좌 위에 세울 네 아들, 그가 내 이름을 위하여 그 집을 지을 것이다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 히브리어를 따른 표현이며, 문맥상 성전을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네 자리에 네 왕좌 위에 세울’은 히브리어의 왕위 계승 표현을 옮긴 것으로, ‘네 대신 네 왕좌에 세울’이라는 뜻입니다.
    reason: lexical_alternative
