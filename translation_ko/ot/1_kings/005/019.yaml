  - 이제 보십시오
  lexicon: HALOT
  rationale: 주의를 환기하는 담화 표지를 한국어에서 자연스럽고 공적으로 살리는 표현으로 옮겼습니다.
- source_word: לִבְנוֹת בַּיִת
  english_pob_choice: to build a house
  chosen_korean: 집을 짓고자 합니다
  alternatives_korean:
  - 성전을 짓고자 합니다
  - 집을 건축하고자 합니다
  lexicon: HALOT
  rationale: בַּיִת의 직역인 ‘집’을 유지해 히브리어 표현과 성전-신학적 울림을 보존했습니다.
- source_word: לְשֵׁם יְהוָה אֱלֹהָי
  english_pob_choice: for the name of Yahweh my God
  chosen_korean: 야훼 내 하나님의 이름을 위해
  alternatives_korean:
  - 야훼 내 하나님의 이름을 위하여
  - 야훼 내 하나님 이름을 위해
  lexicon: HALOT
  rationale: ‘이름을 위해’라는 성전 공식 표현을 살리되, 한국어 어순은 자연스럽게 다듬었습니다.
- source_word: אֲשֶׁר אֶתֵּן תַּחְתֶּיךָ עַל כִּסְאֶךָ
  english_pob_choice: whom I will set in your place on your throne
  chosen_korean: 내가 네 뒤에 네 왕좌에 앉힐
  alternatives_korean:
  - 내가 네 대신 네 왕좌에 세울
  - 내가 네 자리에 둘
  lexicon: HALOT
  rationale: 수위 계승의 의미를 드러내면서도 ‘네 뒤에’로 히브리어의 대체·승계 뉘앙스를 반영했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기적 성전 공식에서 신명기적 고유명 יְהוָה를 직접 사용하므로, 기본 원칙에 따라 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘이름을 위해’라는 성전 공식
  chosen_reading: 하나님의 이름을 위한 집
  alternative_readings:
  - 하나님께 영광 돌리기 위한 집
  - 하나님 이름에 헌정된 집
  rationale: 성전의 목적을 단순한 명예가 아니라 하나님의 임재와 이름에 연결된 언약적 표현으로 보존했습니다.
  doctrine_reference: Temple formula in 1 Kings 5:19
