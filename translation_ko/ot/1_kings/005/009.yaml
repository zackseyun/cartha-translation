base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/009.yaml
  text: And God gave Solomon wisdom and very great understanding[a], and breadth of heart like the sand that is on the seashore.
  footnotes:
  - marker: a
    text: Literally, 'breadth of heart' or 'largeness of heart.' In Hebrew, 'heart' can refer to the mind or understanding.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 솔로몬에게 지혜와 매우 큰 명철을 주셨으며, 바닷가의 모래처럼 넓은 이해력도 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘마음의 넓음’입니다. 여기서 ‘마음’은 감정뿐 아니라 생각과 이해력을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן / gave
  english_pob_choice: gave
  chosen_korean: 주셨고
  alternatives_korean:
  - 주셨습니다
  - 베푸셨고
  lexicon: HALOT
  rationale: נתן의 기본 의미를 가장 자연스럽게 살려 ‘주다’로 옮겼습니다. 문맥상 하나님의 주심을 나타내므로 존대형 ‘주셨습니다’가 적절합니다.
- source_word: חָכְמָה
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  - 지성
  lexicon: HALOT
  rationale: 솔로몬 전승에서 חכמה의 통상적 대응어인 ‘지혜’가 가장 직접적입니다.
- source_word: וּתְבוּנָה הַרְבֵּה מְאֹד
  english_pob_choice: very great understanding
  chosen_korean: 매우 큰 명철
  alternatives_korean:
  - 매우 큰 이해력
  - 지극히 큰 분별
  lexicon: HALOT
  rationale: תבונה는 단순한 이해보다 분별력 있는 통찰을 포함하므로, ‘명철’이 ‘지혜’와 병렬을 이루면서도 의미를 과도하게 좁히지 않습니다.
- source_word: וְרֹחַב לֵב
  english_pob_choice: breadth of heart
  chosen_korean: 넓은 마음
  alternatives_korean:
  - 마음의 넓음
  - 넓은 심장
  lexicon: HALOT
  rationale: 히브리어 לֵב는 정서뿐 아니라 사고와 이해의 중심을 가리킬 수 있으므로, 현대 한국어에서는 ‘넓은 마음’이 관용적 의미를 살리면서도 어색하지 않습니다. 영어 POB의 각주 취지는 한국어 본문에서는 본문-각주 방식 없이도 충분히 전달됩니다.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  english_pob_choice: like the sand that is on the seashore
  chosen_korean: 바닷가의 모래만큼
  alternatives_korean:
  - 바닷가에 있는 모래처럼
  - 바닷가 모래처럼
  lexicon: HALOT
  rationale: 비유의 핵심은 헤아릴 수 없을 만큼 많고 넓다는 이미지이므로, ‘바닷가의 모래만큼’이 가장 자연스럽고 압축적으로 대응합니다.
theological_decisions:
- issue: לֵב(heart)의 인지적 의미를 한국어로 어떻게 살릴 것인가
  chosen_reading: ‘마음’으로 번역해 히브리어의 사고·이해 중심 의미를 함께 담았습니다.
  alternative_readings:
  - ‘심장’
  - ‘마음의 넓음’의 직역
  rationale: 한국어 ‘마음’은 감정만이 아니라 생각과 판단의 자리도 가리킬 수 있어, 히브리어 לב의 인지적 범위를 비교적 자연스럽게 반영합니다. 솔로몬에게 주어진 총체적 내적 역량이라는 문맥에도 잘 맞습니다.
  doctrine_reference: Translation philosophy §1, §6
