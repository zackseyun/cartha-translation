  source_fidelity: 원문은 솔로몬에게 ‘그의 병거를 위한’ 말 우리/말 먹이칸 사만과 기병 만 이천이 있었다고 말합니다. 초안은 병거와의 용도·귀속 관계(לְמֶרְכָּבוֹ)를 본문에서 빠뜨렸으므로 이를 명시해야 합니다.
  naturalness: ‘말병정’은 현대 표준어에서 다소 구어적·비표준적으로 들릴 수 있습니다. 군사적 말을 자연스럽고 간결하게 나타내는 ‘기병’이 적절합니다. ‘말 우리 사만 칸’은 개별 우리 또는 먹이칸이라는 히브리어 명사의 수량 단위를 드러냅니다.
  terminology: ‘병거’는 מֶרְכָּבָה의 군사적 전차/병거 의미를 적절히 반영하며, ‘기병’은 פָּרָשִׁים의 통상적 의미를 반영합니다. אֻרְוֹת는 더 큰 시설 전체인 ‘마구간’보다 개별 말 우리 또는 먹이칸을 가리킬 가능성이 있어, 본문에서는 ‘말 우리 … 칸’으로 옮기고 각주에서 대안을 제시합니다.
