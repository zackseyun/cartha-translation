translation:
  language: ko
  text: 솔로몬에게는 자신의 병거를 위한 말 우리 사만 칸과 기병 만 이천 명이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֻרְוֹת는 말의 우리 또는 먹이를 주는 칸을 가리킬 수 있습니다. ‘말 우리’는 ‘마구간’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  english_pob_choice: And Solomon had
  chosen_korean: 솔로몬에게는 … 있었습니다
  alternatives_korean:
  - 솔로몬은 … 가지고 있었습니다
  - 솔로몬에게 … 있었습니다
  lexicon: HALOT
  rationale: וַיְהִי לְ는 소유·귀속을 나타내므로 한국어에서는 ‘~에게는 … 있었습니다’로 자연스럽게 옮겨 소유 관계를 분명히 했습니다.
- source_word: אֻרְוֺת סוּסִים
  english_pob_choice: stalls of horses
  chosen_korean: 말 마구간
  alternatives_korean:
  - 말의 우리
  - 말 우리
  - 말 마굿간
  lexicon: HALOT
  rationale: אֻרְוֹת은 말의 먹이·대기 공간인 ‘stall(s)’에 해당하므로, 전통적이지만 더 큰 건물 느낌의 ‘마구간’보다 ‘말 마구간’으로 구체화했습니다.
- source_word: לְמֶרְכָּבוֹ
  english_pob_choice: for his chariots
  chosen_korean: 그의 병거를 위해
  alternatives_korean:
  - 그의 전차를 위해
  - 그의 병거용으로
  - 그의 전차 부대를 위해
  lexicon: HALOT
  rationale: 메시아적 용례가 아닌 여기서는 군사용 ‘병거’를 뜻하므로, 소유격과 용도를 함께 살려 ‘말 마구간’ 뒤에 목적을 드러내는 표현으로 옮길 수 있습니다. 다만 문장 흐름을 위해 본문에서는 ‘말 마구간’에 이미 귀속을 담았습니다.
- source_word: פָּרָשִׁים
  english_pob_choice: horsemen
  chosen_korean: 말병정
  alternatives_korean:
  - 기마병
  - 기병
  - 말탄 병사
  lexicon: HALOT
  rationale: פָּרָשִׁים은 단순 승마인이 아니라 군사적 ‘horsemen’이므로, 현대 독자가 즉시 군사 인력으로 이해하도록 ‘말병정’으로 풀어 썼습니다.
theological_decisions:
- issue: 솔로몬의 군사력 묘사와 평가적 어조
  chosen_reading: 본문은 솔로몬의 부와 군사 조직 규모를 사실적으로 진술하며, 여기에는 직접적인 평가 형용사를 덧붙이지 않았습니다.
  alternative_readings:
  - 부정적 뉘앙스를 강화해 ‘과도한 군비’를 암시하는 표현
  - 전통적 왕의 위용을 강조하는 장엄한 표현
  rationale: 히브리어 원문은 수치와 소유 사실을 제시할 뿐이므로, 본문이 말하는 정도를 넘는 평가를 추가하지 않았습니다.
  doctrine_reference: 본문 직역 원칙과 서술의 절제
