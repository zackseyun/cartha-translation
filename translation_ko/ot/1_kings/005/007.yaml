language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִלְכְּלוּ֩ הַ/נִּצָּבִ֨ים הָ/אֵ֜לֶּה אֶת הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/אֵ֧ת כָּל הַ/קָּרֵ֛ב אֶל שֻׁלְחַ֥ן הַ/מֶּֽלֶךְ שְׁלֹמֹ֖ה אִ֣ישׁ חָדְשׁ֑/וֹ לֹ֥א יְעַדְּר֖וּ דָּבָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/007.yaml
  text: These deputies provided for King Solomon and for all who came near the table of King Solomon[a], each in his month[b]; they lacked nothing.
  footnotes:
  - marker: a
    text: Or 'officials' or 'governors' for 'deputies.' The Hebrew refers to appointed administrators over districts.
    reason: lexical_alternative
  - marker: b
    text: Literally 'all who came near the table of King Solomon,' an expression for those with access to the royal table.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 지방 관리들은 솔로몬 왕과 솔로몬 왕의 식탁에 나아오는 모든 사람에게 각자 맡은 달에 필요한 것을 마련해 주었으며, 부족한 것이 없었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִלְכְּלוּ
  english_pob_choice: provided for
  chosen_korean: 공급하였으며
  alternatives_korean:
  - 부양하였으며
  - 보급하였으며
  - 섬겼으며
  lexicon: HALOT
  rationale: 왕실 행정 맥락에서 필요한 것을 마련해 주는 뜻이므로, 한국어에서는 ‘공급하다’가 가장 직접적으로 대응합니다.
- source_word: הַנִּצָּבִים
  english_pob_choice: deputies
  chosen_korean: 지방관들
  alternatives_korean:
  - 대리관들
  - 관리들
  - 감독관들
  lexicon: HALOT
  rationale: 문맥상 지역별로 임명된 행정 책임자를 가리키므로, 기능을 드러내면서도 현대 독자에게 자연스러운 ‘지방관들’을 택했습니다.
- source_word: וְאֵת כָּל הַקָּרֵב אֶל שֻׁלְחַן הַמֶּלֶךְ שְׁלֹמֹה
  english_pob_choice: and for all who came near the table of King Solomon
  chosen_korean: 솔로몬 왕의 식탁에 나아오는 모든 사람
  alternatives_korean:
  - 솔로몬 왕의 식탁에 가까이 오는 모든 사람
  - 솔로몬 왕의 상에 나아오는 모든 사람
  lexicon: HALOT
  rationale: ‘가까이 오다’의 직역을 살리되, 왕의 식탁에 접근할 권한이 있는 사람들을 뜻하는 관용적 표현으로 자연스럽게 옮겼습니다.
- source_word: אִישׁ חָדְשׁוֹ
  english_pob_choice: each in his month
  chosen_korean: 각기 자기 달에
  alternatives_korean:
  - 각자 자기 달에
  - 한 사람씩 자기 달에
  - 자기 달마다
  lexicon: HALOT
  rationale: 분담의 순환을 나타내는 분배적 표현이므로, 한 사람씩 맡는 월별 순번을 간결하게 드러냈습니다.
- source_word: לֹא יְעַדְּרוּ דָּבָר
  english_pob_choice: they lacked nothing
  chosen_korean: 부족한 것이 없었습니다
  alternatives_korean:
  - 모자라는 것이 없었습니다
  - 빠뜨린 것이 없었습니다
  - 아무것도 부족하지 않았습니다
  lexicon: HALOT
  rationale: 문맥상 필요한 공급이 결핍되지 않았다는 뜻이므로, 결과를 자연스럽게 요약한 한국어 관용 표현을 사용했습니다.
