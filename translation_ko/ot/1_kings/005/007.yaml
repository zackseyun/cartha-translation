  - severity: low
    issue: ‘각기 자기 달에’의 직역투
    rationale: 월별 순번을 뜻하는 분배 표현이지만, ‘자기 달’은 현대 한국어에서 어색합니다. ‘각자 맡은 달에’가 동일한 문맥적 의미를 자연스럽게 표현합니다.
  revised_text: 이 지방 관리들은 솔로몬 왕과 솔로몬 왕의 식탁에 나아오는 모든 사람에게 각자 맡은 달에 필요한 것을 마련해 주었으며, 부족한 것이 없었습니다.
