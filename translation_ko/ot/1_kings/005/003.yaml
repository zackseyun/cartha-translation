translation:
  language: ko
  text: 열 마리의 살진 소와 스무 마리의 초지에서 먹인 소와 백 마리의 양, 그 밖에 사슴과 노루와 노루속의 짐승과 살진 새까지였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יַחְמוּר의 정확한 동물은 확실하지 않으며, ‘노루’ 외에 ‘사슴’이나 ‘Fallow deer’로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 בַרְבֻּרִים의 정확한 종은 확실하지 않으며, ‘새’보다 더 구체적으로는 ‘물새’나 ‘거위’로 볼 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: צֹאן은 양과 염소를 포함하는 더 넓은 집합명사이지만, 여기서는 간단히 ‘양’으로 옮겼습니다.
    reason: lexical_alternative
