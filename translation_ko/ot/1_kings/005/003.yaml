translation:
  language: ko
  text: 열 마리의 비육한 소와 스무 마리의 목초를 먹인 소와 백 마리의 양[c], 그 밖에 사슴과 가젤과 야크무르[a]와 살찌운 새[b]까지였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יַחְמוּר의 정확한 동물 종은 확실하지 않습니다. ‘노루’ 또는 ‘다마사슴’으로 이해하기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 בַרְבֻּרִים이 가리키는 정확한 새의 종은 확실하지 않습니다. ‘살찌운 거위’로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 צֹאן은 양과 염소를 포함하는 더 넓은 집합 명사일 수 있으나, 여기서는 ‘양’으로 옮겼습니다.
    reason: lexical_alternative
