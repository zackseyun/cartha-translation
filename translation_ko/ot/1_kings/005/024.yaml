translation:
  language: ko
  text: 그리고 히람은 솔로몬에게 백향목 재목과 잣나무 재목을 그의 온갖 원하는 대로 주고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְרוֹשִׁים은 정확한 수종이 분명하지 않아, '노간주나무'나 전통적으로 '전나무'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי חִירוֹם נֹתֵן
  english_pob_choice: And Hiram was giving
  chosen_korean: 히람은 … 주고 있었습니다
  alternatives_korean:
  - 히람은 … 주었습니다
  - 히람은 … 제공하고 있었습니다
  lexicon: HALOT
  rationale: וַיְהִי + 분사 נֹתֵן의 진행/지속 뉘앙스를 살리기 위해 단순 과거보다 진행형으로 옮겼습니다. '주다'가 가장 직접적이며, '제공하다'는 다소 해석적입니다.
- source_word: עֲצֵי אֲרָזִים
  english_pob_choice: cedar timber
  chosen_korean: 백향목 재목
  alternatives_korean:
  - 백향목 목재
  - 백향목 나무
  lexicon: HALOT
  rationale: 건축 자재 문맥이므로 살아 있는 나무보다 가공된 재목이 적절합니다. '백향목'은 성경 번역에서 널리 통용되는 한국어 대응입니다.
- source_word: וַעֲצֵי בְרוֹשִׁים
  english_pob_choice: cypress timber
  chosen_korean: 잣나무 재목
  alternatives_korean:
  - 노간주나무 재목
  - 사이프러스 재목
  - 전통적으로는 전나무 재목
  lexicon: HALOT
  rationale: בְרוֹשִׁים의 수종은 확정적이지 않으므로, POB의 각주가 보존한 불확실성을 한국어 본문에서도 무리 없이 반영했습니다. 한국어 독자에게 익숙한 수종명 가운데서는 '잣나무'가 가장 자연스럽습니다.
- source_word: כָּל חֶפְצוֹ
  english_pob_choice: according to all his desire
  chosen_korean: 그의 온갖 원하는 대로
  alternatives_korean:
  - 그가 바라는 모든 대로
  - 그의 모든 소원에 따라
  lexicon: HALOT
  rationale: 단순히 '원하는 모든 것'이 아니라 '그의 온갖 원하는 대로'라는 범위·기준 표현을 살려, חֵפֶץ의 소원/요청의 총량을 자연스럽게 전달했습니다.
