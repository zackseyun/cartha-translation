id: 1KI.5.25
reference: 1 Kings 5:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁלֹמֹה֩ נָתַ֨ן לְ/חִירָ֜ם עֶשְׂרִים֩ אֶ֨לֶף כֹּ֤ר חִטִּים֙ מַכֹּ֣לֶת לְ/בֵית֔/וֹ וְ/עֶשְׂרִ֥ים כֹּ֖ר שֶׁ֣מֶן כָּתִ֑ית כֹּֽה יִתֵּ֧ן שְׁלֹמֹ֛ה לְ/חִירָ֖ם שָׁנָ֥ה בְ/שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/025.yaml
  text: And Solomon gave Hiram twenty thousand cors of wheat as food for his household[a], and twenty cors of beaten oil[b]. Thus Solomon would give to Hiram year by year.
  footnotes:
  - marker: a
    text: Or 'provisions for his house.' The Hebrew likely refers to food supplied for Hiram's royal household.
    reason: lexical_alternative
  - marker: b
    text: '''Beaten oil'' refers to high-quality oil produced from olives by pounding or crushing rather than by a later pressing process.'
    reason: cultural_note
translation:
  language: ko
  text: 솔로몬이 히람에게 그의 집을 위한 식량으로 밀 이만 코르와 찧은 기름 스무 코르를 주었습니다[a][b]. 솔로몬은 이와 같이 해마다 히람에게 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 집을 위한 양식’입니다. 히브리어는 히람의 왕실 집안을 위한 식량 공급을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: ‘찧은 기름’은 올리브를 두드리거나 부수어 얻은 고급 기름을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: נָתַן / יִתֵּן
  english_pob_choice: gave / would give
  chosen_korean: 주었습니다 / 주었습니다
  alternatives_korean:
  - 주었고 / 주겠고
  - 주고 / 주었습니다
  - 주었습니다 / 주곤 했습니다
  lexicon: HALOT
  rationale: 완료형과 반복적 미래형의 대비를 한국어에서는 과거 서술과 해마다의 반복 관습으로 풀어 주는 것이 자연스럽습니다. 마지막 ‘해마다’가 반복성을 충분히 드러내므로 두 번째도 평서 과거로 정리했습니다.
- source_word: כֹּר
  english_pob_choice: cors
  chosen_korean: 코르
  alternatives_korean:
  - 고르
  - 측량 단위
  lexicon: HALOT
  rationale: כֹּר는 고대 부피/곡물 단위이므로 음역을 유지해 단위성을 보존했습니다.
- source_word: מַכֹּלֶת לְבֵיתוֹ
  english_pob_choice: as food for his household
  chosen_korean: 그의 집을 위한 식량으로
  alternatives_korean:
  - 그의 집안의 식량으로
  - 그의 궁정 식량으로
  - 그의 집을 위한 양식으로
  lexicon: HALOT
  rationale: מַכֹּלֶת은 단순한 ‘음식’보다 공급되는 식량/식품을 가리키며, לְבֵיתוֹ는 히람의 집 곧 왕실 가문·궁정을 가리킬 수 있어 문맥을 과장하지 않는 ‘그의 집’으로 옮겼습니다.
- source_word: שֶׁמֶן כָּתִית
  english_pob_choice: beaten oil
  chosen_korean: 찧은 기름
  alternatives_korean:
  - 짜낸 기름
  - 빻은 기름
  - 고운 기름
  lexicon: HALOT
  rationale: כָּתִית는 눌러 짠다는 뜻보다 두드리거나 부수어 얻은 고급 기름의 방식적 뉘앙스를 지니므로, 공정의 느낌을 살려 ‘찧은 기름’으로 옮겼습니다.
theological_decisions:
- issue: 해마다의 반복 지급을 어떻게 표현할지
  chosen_reading: ‘이와 같이 해마다 히람에게 주었습니다’로 규칙적 반복을 드러냈습니다.
  alternative_readings:
  - ‘매년 히람에게 주었습니다’
  - ‘해마다 그렇게 주었습니다’
  rationale: 히브리어의 כֹּה + 불완료형 + שָׁנָה בְשָׁנָה는 단발 사건이 아니라 연례적 관행을 나타내므로, 한국어에서도 반복성과 관습성을 분명히 했습니다.
  doctrine_reference: 서술 문맥의 시제/상(aspect) 보존
