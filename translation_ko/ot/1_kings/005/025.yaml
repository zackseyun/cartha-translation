  lexicon: HALOT
  rationale: כֹּר는 고대 부피/곡물 단위이므로 음역을 유지해 단위성을 보존했습니다.
- source_word: מַכֹּלֶת לְבֵיתוֹ
  english_pob_choice: as food for his household
  chosen_korean: 그의 집을 위한 식량으로
  alternatives_korean:
  - 그의 집안의 식량으로
  - 그의 궁정 식량으로
  - 그의 집을 위한 양식으로
  lexicon: HALOT
  rationale: מַכֹּלֶת은 단순한 ‘음식’보다 공급되는 식량/식품을 가리키며, לְבֵיתוֹ는 히람의 집 곧 왕실 가문·궁정을 가리킬 수 있어 문맥을 과장하지 않는 ‘그의 집’으로 옮겼습니다.
- source_word: שֶׁמֶן כָּתִית
  english_pob_choice: beaten oil
  chosen_korean: 찧은 기름
  alternatives_korean:
  - 짜낸 기름
  - 빻은 기름
  - 고운 기름
  lexicon: HALOT
  rationale: כָּתִית는 눌러 짠다는 뜻보다 두드리거나 부수어 얻은 고급 기름의 방식적 뉘앙스를 지니므로, 공정의 느낌을 살려 ‘찧은 기름’으로 옮겼습니다.
theological_decisions:
- issue: 해마다의 반복 지급을 어떻게 표현할지
  chosen_reading: ‘이와 같이 해마다 히람에게 주었습니다’로 규칙적 반복을 드러냈습니다.
  alternative_readings:
  - ‘매년 히람에게 주었습니다’
  - ‘해마다 그렇게 주었습니다’
  rationale: 히브리어의 כֹּה + 불완료형 + שָׁנָה בְשָׁנָה는 단발 사건이 아니라 연례적 관행을 나타내므로, 한국어에서도 반복성과 관습성을 분명히 했습니다.
  doctrine_reference: 서술 문맥의 시제/상(aspect) 보존
