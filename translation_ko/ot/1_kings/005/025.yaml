  lexicon: HALOT
  rationale: 완료형과 반복적 미래형의 대비를 한국어에서는 과거 서술과 해마다의 반복 관습으로 풀어 주는 것이 자연스럽습니다. 마지막 ‘해마다’가 반복성을 충분히 드러내므로 두 번째도 평서 과거로 정리했습니다.
