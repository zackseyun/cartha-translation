reference: 1 Kings 5:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨עַל הַ/מֶּ֧לֶךְ שְׁלֹמֹ֛ה מַ֖ס מִ/כָּל יִשְׂרָאֵ֑ל וַ/יְהִ֣י הַ/מַּ֔ס שְׁלֹשִׁ֥ים אֶ֖לֶף אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/027.yaml
  text: King Solomon conscripted forced labor from all Israel[b][a], and the forced labor was thirty thousand men.
  footnotes:
  - marker: a
    text: Or 'levied a labor force from all Israel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew מַס refers to compulsory labor service, not primarily to a monetary tax.
    reason: cultural_note
translation:
  language: ko
  text: 솔로몬 왕이 온 이스라엘에서 강제 노역에 동원할 사람들을 징발하였는데, 그 인원은 남자 삼만 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַס는 여기서 금전적 세금이나 공물이 아니라 강제 노동 부역을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: מַס
  english_pob_choice: forced labor
  chosen_korean: 노역
  alternatives_korean:
  - 강제 노역
  - 부역
  - 세금
  lexicon: HALOT
  rationale: 이 단어는 금전적 세금이 아니라 강제 동원된 노동을 가리키므로, 현대 한국어에서 가장 자연스럽고 의미가 분명한 ‘노역’을 택했습니다.
- source_word: וַיַּעַל ... מַס
  english_pob_choice: conscripted forced labor
  chosen_korean: 노역을 징발하였는데
  alternatives_korean:
  - 노역을 징집하였는데
  - 노역을 부과하였는데
  - 노역을 모집하였는데
  lexicon: HALOT
  rationale: 행정적으로 인원을 끌어다 쓰는 뉘앙스를 살리기 위해 ‘징발하다’를 사용했습니다. ‘징집’은 군사적 느낌이 강하고, ‘부과하다’는 대상이 사람보다 의무에 더 가깝습니다.
- source_word: מִכָּל יִשְׂרָאֵל
  english_pob_choice: from all Israel
  chosen_korean: 온 이스라엘에서
  alternatives_korean:
  - 모든 이스라엘에서
  - 이스라엘 온 땅에서
  lexicon: HALOT
  rationale: 동원 대상의 출처가 이스라엘 전역임을 드러내기 위해 ‘온 이스라엘에서’로 옮겼습니다.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  english_pob_choice: thirty thousand men
  chosen_korean: 삼만 명
  alternatives_korean:
  - 삼만 남자
  - 삼만 남성
  - 삼만 사람
  lexicon: HALOT
  rationale: 히브리어 אִישׁ은 여기서 성인 남성 노동자를 가리키지만, 한국어에서는 이미 뒤의 ‘노역 인원’이 그 성격을 충분히 드러내므로 중복을 피해 간결하게 처리했습니다.
theological_decisions:
- issue: 솔로몬의 통치 아래 이스라엘 내부에서 강제 동원이 이루어진다는 서술의 직설성
  chosen_reading: 본문의 행정적 강제성을 완화하지 않고 ‘징발’과 ‘노역’으로 직설적으로 드러냈습니다.
  alternative_readings:
  - 더 완곡하게 ‘동원하였는데’로 처리
  - ‘부역’을 사용해 전통적 행정 용어로 완화
  rationale: 열왕기 본문은 솔로몬 왕권의 동원력을 비판적으로 보여 주므로, 그 긴장을 희석하지 않는 번역이 필요합니다.
  doctrine_reference: 왕권의 책임성과 언약적 평가에 관한 열왕기 서술
- issue: ‘남자/남성’의 명시 여부
  chosen_reading: ‘삼만 명’으로 처리해 성별 정보를 과잉 강조하지 않았습니다.
  alternative_readings:
  - ‘삼만 남자’로 명시
  - ‘삼만 사람’으로 일반화
  rationale: 히브리어는 남성 명사를 쓰지만, 한국어에서는 이미 ‘노역 인원’이 성인 남성 노동력을 충분히 암시하므로 본문의 초점을 숫자에 두는 편이 자연스럽습니다.
  doctrine_reference: 원문 의미의 정확한 전달과 한국어 자연성
