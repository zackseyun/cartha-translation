  source_fidelity: 히브리어 מַס는 이 문맥에서 금전 세금이 아니라 왕이 이스라엘에서 징발한 강제 노동 인력(부역)입니다. 초안의 ‘노역을 징발하였다’는 뜻은 대체로 맞지만, 징발의 직접 대상이 노동 자체라기보다 노동에 동원될 사람들인 점이 한국어에서 다소 불분명합니다. 또한 אִישׁ의 남성 지시를 ‘삼만 명’으로만 옮기면 소실됩니다.
  naturalness: ‘강제 노역에 동원할 사람들을 징발하였습니다’는 현대 표준 한국어의 공식적 합쇼체에서 자연스럽고, 행정적 강제성을 분명히 합니다. ‘그 인원은 남자 삼만 명이었습니다’도 수량 서술로 자연스럽습니다.
  terminology: ‘강제 노역’은 מַס의 문맥상 의미를 명료하게 전달합니다. 각주에서는 이를 금전적 세금과 구별하되, 본문과 중복되는 히브리어 설명 각주는 하나로 통합하는 편이 간결하고 충분합니다.
