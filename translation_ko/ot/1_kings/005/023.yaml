revisions:
- from: 내 종들이 레바논에서 그 물건들을 바다까지 내려보낼 것이며, 나는 그것들을 바다 위에 뗏목들로 만들어, 당신이 나에게 지시하는 곳까지 보내겠습니다. 그러면 내가 거기에서 그것들을 부숴 놓을 것이고, 당신은 그것들을 가져가게 될 것입니다. 그리고 당신은 내 집에 먹을 것을 주어 내가 바라는 일을 해야 합니다.[a][b]
  to: 제 신하들이 레바논에서 그 목재를 바다까지 내려보낼 것이며, 저는 그것들을 바다 위에서 뗏목으로 엮어 왕께서 제게 지시하시는 곳까지 보내겠습니다. 제가 거기서 그것들을 풀어 해체하면, 왕께서 그것들을 가져가실 것입니다. 왕께서는 제 집안에 양식을 주어 제가 바라는 바를 이루실 것입니다.[a][b]
  rationale: 목재라는 문맥상 선행사를 명시하고, 뗏목의 해체를 자연스럽고 정확하게 표현했습니다. 히람이 솔로몬 왕에게 말하는 장면에 맞추어 ‘왕께서/제’와 합쇼체를 일관되게 적용했으며, 원문의 미래적 협약 진술을 조건문이나 과도한 의무 명령으로 바꾸지 않았습니다. 두 주석 표지는 각각 뗏목과 ‘빵’의 환유적 의미에 계속 정확히 연결됩니다.
