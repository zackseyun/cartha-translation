base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/023.yaml
  text: My servants will bring them down from Lebanon to the sea[a], and I will make them into rafts on the sea to the place that you direct me, and I will break them apart there, and you will carry them away[b]. And you shall do what I desire by giving food for my household.
  footnotes:
  - marker: a
    text: Or 'log rafts' for 'rafts.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'bread for my house'; here 'bread' likely means food or provisions for Hiram's royal household.
    reason: lexical_alternative
translation:
  language: ko
  text: 제 신하들이 레바논에서 그 목재를 바다까지 내려보낼 것이며, 저는 그것들을 바다 위에서 뗏목으로 엮어 왕께서 제게 지시하시는 곳까지 보내겠습니다. 제가 거기서 그것들을 풀어 해체하면, 왕께서 그것들을 가져가실 것입니다. 왕께서는 제 집안에 양식을 주어 제가 바라는 바를 이루실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뗏목’은 통나무를 묶어 물에 띄워 운송하는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 집의 빵’입니다. 여기서 ‘빵’은 히람의 왕실 가구를 위한 양식 또는 식량을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדַי
  english_pob_choice: my servants
  chosen_korean: 내 종들
  alternatives_korean:
