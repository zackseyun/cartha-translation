  text: עֲ֠בָדַ/י יֹרִ֨דוּ מִן הַ/לְּבָנ֜וֹן יָ֗מָּ/ה וַ֠/אֲנִי אֲשִׂימֵ֨/ם דֹּבְר֤וֹת בַּ/יָּם֙ עַֽד הַ/מָּק֞וֹם אֲשֶׁר תִּשְׁלַ֥ח אֵלַ֛/י וְ/נִפַּצְתִּ֥י/ם שָׁ֖ם וְ/אַתָּ֣ה תִשָּׂ֑א וְ/אַתָּה֙ תַּעֲשֶׂ֣ה אֶת חֶפְצִ֔/י לָ/תֵ֖ת לֶ֥חֶם בֵּיתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/023.yaml
  text: My servants will bring them down from Lebanon to the sea[a], and I will make them into rafts on the sea to the place that you direct me, and I will break them apart there, and you will carry them away[b]. And you shall do what I desire by giving food for my household.
  footnotes:
  - marker: a
    text: Or 'log rafts' for 'rafts.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'bread for my house'; here 'bread' likely means food or provisions for Hiram's royal household.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 종들이 레바논에서 그 물건들을 바다까지 내려보낼 것이며, 나는 그것들을 바다 위에 뗏목들로 만들어, 당신이 나에게 지시하는 곳까지 보내겠습니다. 그러면 내가 거기에서 그것들을 부숴 놓을 것이고, 당신은 그것들을 가져가게 될 것입니다. 그리고 당신은 내 집에 먹을 것을 주어 내가 바라는 일을 해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘뗏목들’은 통나무를 묶어 만든 운송용 뗏목을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 직역은 ‘내 집의 빵’으로, 여기서는 ‘먹을 것’ 또는 ‘양식’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדַי
  english_pob_choice: my servants
  chosen_korean: 내 종들
  alternatives_korean:
  - 내 일꾼들
  - 내 노예들
  lexicon: HALOT
  rationale: 왕실-행정적 맥락에서 일반적 종속 노동자들을 가리키므로, 본문이 강조하는 바를 살리면서도 한국어에서 자연스러운 ‘종들’로 옮겼습니다.
- source_word: דֹּבְרוֹת
  english_pob_choice: rafts
  chosen_korean: 뗏목들
  alternatives_korean:
  - 뗏목
  - 통나무 뗏목들
  - 뗏목단
  lexicon: HALOT
  rationale: 목재를 묶어 띄워 운송하는 물건을 가리키므로, 현대 한국어에서 가장 분명한 ‘뗏목’이 적절합니다.
- source_word: אֲשֶׁר תִּשְׁלַח אֵלַי
  english_pob_choice: the place you direct me
  chosen_korean: 당신이 나에게 지시하는 곳
  alternatives_korean:
  - 당신이 나에게 보내는 곳
  - 당신이 나에게 지정하는 곳
  lexicon: HALOT
  rationale: שׁלח의 의미가 단순한 ‘보내다’보다 목적지 지시의 뉘앙스를 갖기 때문에, 운송 지시의 실무적 의미를 드러내는 ‘지시하는 곳’으로 옮겼습니다.
- source_word: לֶחֶם בֵּיתִי
  english_pob_choice: food for my household
  chosen_korean: 내 집에 먹을 것을
  alternatives_korean:
  - 내 집에 양식을
  - 내 가문에 식량을
  lexicon: HALOT
  rationale: 직역하면 ‘집의 빵’이지만 여기서는 가정/궁정의 식량·보급을 뜻하므로, 한국어에서는 ‘먹을 것’으로 자연스럽게 전달했습니다.
theological_decisions:
- issue: 하나님의 언약 백성 언어를 위한 경어와 화자 의도 보존
  chosen_reading: 주체가 하람과 솔로몬 사이의 실무적 협상이라는 점을 살려, 인물 간 직접 대화는 현대 공손체로 유지하되 과도한 경어성 신학어휘는 사용하지 않았습니다.
  alternative_readings:
  - 전통 교회체 어휘로 격상
  - 더 평이한 구어체로 단순화
  rationale: 본문의 왕실 협약적 성격을 흐리지 않으면서, 합쇼체의 표준 문어를 유지하는 것이 가장 충실합니다.
  doctrine_reference: 서사·역사 본문 번역 원칙
