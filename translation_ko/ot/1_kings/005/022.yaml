revisions:
- from: 그때 히람이 솔로몬에게 사람을 보내어 말했습니다. “당신이 내게 보낸 것을 들었습니다. 나는 백향목과 잣나무에 관한 당신의 모든 뜻을 이루겠습니다.”[a][b]
  to: 그때 히람이 솔로몬에게 보내어 말했습니다. “당신이 내게 보낸 것[a]을 들었습니다. 백향목 목재와 잣나무 목재[b]에 관하여 당신이 바라는 모든 것을 하겠습니다.”
  rationale: ‘사람’을 삭제하여 원문이 명시하지 않는 전달 수단을 본문에 넣지 않았습니다. ‘목재’를 보충하여 건축 자재 문맥을 분명히 하되 수종의 불확실성은 각주로 보존했습니다. ‘보낸 것’의 각주 표지는 해당 표현 바로 뒤에, 수종 각주 표지는 ‘잣나무 목재’ 바로 뒤에 두었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:45:09Z'
