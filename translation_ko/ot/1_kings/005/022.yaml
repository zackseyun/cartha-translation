    issue: ‘사람을’의 첨가
    rationale: 히브리어는 히람이 솔로몬에게 ‘보냈다’고 할 뿐 사람 또는 사절을 명시하지 않습니다. 문맥상 전갈 전달일 수 있으나, 본문에서 전달 수단을 특정하지 않는 것이 안전합니다.
  - severity: medium
