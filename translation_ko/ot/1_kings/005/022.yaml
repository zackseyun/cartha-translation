  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח חִירָם֙ אֶל שְׁלֹמֹ֣ה לֵ/אמֹ֔ר שָׁמַ֕עְתִּי אֵ֥ת אֲשֶׁר שָׁלַ֖חְתָּ אֵלָ֑/י אֲנִ֤י אֶֽעֱשֶׂה֙ אֶת כָּל חֶפְצְ/ךָ֔ בַּ/עֲצֵ֥י אֲרָזִ֖ים וּ/בַ/עֲצֵ֥י בְרוֹשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/022.yaml
  text: Then Hiram sent to Solomon[a], saying, “I have heard what you sent to me[b]. I will do all your desire concerning cedar timber and cypress timber.”
  footnotes:
  - marker: a
    text: Or 'what you requested of me.' The Hebrew more literally says 'what you sent to me,' which may refer to Solomon's message as a request.
    reason: lexical_alternative
  - marker: b
    text: Hebrew בְּרוֹשִׁים; the species is uncertain. It is also rendered 'juniper' or 'fir.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 히람이 솔로몬에게 보내어 말했습니다. “당신이 내게 보낸 것[a]을 들었습니다. 백향목 목재와 잣나무 목재[b]에 관하여 당신이 바라는 모든 것을 하겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내게 보낸 것’이라고 말합니다. 이는 솔로몬이 보낸 메시지나 요청을 가리킬 수 있습니다.
    reason: source_note
  - marker: b
    text: 히브리어 브로쉼(בְּרוֹשִׁים)의 정확한 수종은 확실하지 않습니다. ‘사이프러스’, ‘노간주나무’, 또는 ‘전나무’로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח חִירָם אֶל שְׁלֹמֹה
  english_pob_choice: Then Hiram sent to Solomon
  chosen_korean: 그때 히람이 솔로몬에게 사람을 보내어
  alternatives_korean:
  - 그리고 히람이 솔로몬에게 보냈습니다
  - 히람이 솔로몬에게 보냈습니다
  lexicon: WLC/문맥
  rationale: וַיִּשְׁלַח는 서사 진행을 표시하는 연속형이므로 '그때'로 자연스럽게 옮기되, 동작의 방향을 살려 '사람을 보내어'로 표현했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하여
  - 이르러
  lexicon: WLC/문맥
  rationale: 직접화법을 여는 관용적 표현이므로 현대 한국어에서 가장 자연스러운 서술 동사로 옮겼습니다.
- source_word: אֵת אֲשֶׁר שָׁלַחְתָּ אֵלַי
  english_pob_choice: what you sent to me
  chosen_korean: 당신이 내게 보낸 것
  alternatives_korean:
  - 당신이 내게 보낸 요청
  - 당신이 내게 보낸 말
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '내게 보낸 것'이라고 말하므로 이를 유지하되, 요청의 함의를 본문에 과도하게 넣지 않았습니다.
- source_word: כָּל חֶפְצְךָ
  english_pob_choice: all your desire
  chosen_korean: 당신의 모든 뜻
  alternatives_korean:
  - 당신의 모든 바람
  - 당신이 원하는 모든 것
  lexicon: HALOT
  rationale: חֵפֶץ는 단순한 욕구보다 의도와 바람을 함께 담을 수 있어, 문맥상 계약적·실천적 뉘앙스를 살려 '뜻'으로 옮겼습니다.
- source_word: בַּעֲצֵי אֲרָזִים וּבַעֲצֵי בְרוֹשִׁים
  english_pob_choice: concerning cedar timber and cypress timber
  chosen_korean: 백향목과 잣나무에 관한
  alternatives_korean:
  - 삼나무와 잣나무에 관한
  - 백향목과 사이프러스 목재에 관한
  lexicon: HALOT
  rationale: אַרָז와 בְרוֹשׁ는 한국 교회 용례와 현대 식물명 사이의 차이가 있어, 통용성과 원문 밀착을 고려해 목재가 아니라 나무 종 자체를 간결히 제시했습니다.
theological_decisions:
- issue: 히람의 응답 내용이 단순한 정보 전달인지 요청 수락인지
  chosen_reading: 문자적으로는 '내게 보낸 것'이지만, 문맥상 솔로몬의 요청을 들었다는 응답으로 읽히므로 본문에서는 과잉 해석 없이 수락 의사를 함께 드러냈습니다.
  alternative_readings:
  - 솔로몬이 보낸 편지/메시지 자체를 들었다
  - 솔로몬의 요청을 들었다
  rationale: 본문의 히브리어 표현을 보존하면서도, 바로 뒤의 '나는 ... 이루겠습니다'가 응답의 성격을 분명히 하므로 두 층위를 함께 살렸습니다.
  doctrine_reference: 문맥-기능 우선 원칙
