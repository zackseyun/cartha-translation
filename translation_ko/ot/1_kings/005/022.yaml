    rationale: עֲצֵי는 여기서 건축 자재로 공급될 나무/목재를 가리킵니다. ‘백향목과 잣나무에 관한’만으로는 목재라는 문맥이 다소 흐려집니다.
  - severity: low
    issue: 각주 b의 범위와 대안
    rationale: 수종 불확실성은 בְּרוֹשִׁים에 관한 것이므로 그 점을 명확히 해야 합니다. 영어 감사 기록의 주요 대안인 ‘사이프러스’, ‘노간주나무’, ‘전나무’를 제시하는 것이 적절합니다.
