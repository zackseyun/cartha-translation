base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/002.yaml
  text: Now Solomon’s provision for one day was thirty cors of fine flour and sixty cors of meal[b][a],
  footnotes:
  - marker: a
    text: Hebrew 'bread'; here used more broadly for Solomon’s daily food provision.
    reason: lexical_alternative
  - marker: b
    text: A cor was a large dry measure. The Hebrew reads 'thirty cors' and 'sixty cors.'
    reason: cultural_note
translation:
  language: ko
  text: 솔로몬의 하루 양식은 고운 밀가루 서른 고르와 거친 밀가루 예순 고르였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לֶחֶם은 문자적으로는 ‘빵’이지만, 여기서는 솔로몬 왕실의 하루 식량 배급을 가리키는 더 넓은 뜻으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 코르(cor)는 큰 건량 단위입니다. 히브리어는 ‘서른 코르’와 ‘예순 코르’라고 읽습니다.
    reason: cultural_note
lexical_decisions:
- source_word: לֶחֶם
  english_pob_choice: provision
  chosen_korean: 양식
  alternatives_korean:
  - 식량
  - 빵
  lexicon: HALOT
  rationale: 문맥상 왕실의 하루 식량 배급을 가리키므로, 문자적 ‘빵’보다 한국어에서 자연스럽고 범위를 유지하는 ‘양식’이 더 잘 맞습니다.
- source_word: לְיוֹם אֶחָד
  english_pob_choice: for one day
  chosen_korean: 하루
  alternatives_korean:
  - 하루 동안
  - 한 날 동안
  lexicon: HALOT
  rationale: ‘for one day’의 시간 범위를 간결하게 살리기 위해 관용적으로 ‘하루’로 옮겼습니다.
- source_word: כֹּר
  english_pob_choice: cors
  chosen_korean: 고르
  alternatives_korean:
  - 코르
  - 고르스
  lexicon: HALOT
  rationale: 히브리어의 부피 단위를 음역하여 원문의 구체성을 보존했습니다. 한국어 표기는 현대 외래어 표기 원칙에 따라 ‘고르’로 두었습니다.
- source_word: סֹלֶת / קָמַח
  english_pob_choice: fine flour / meal
  chosen_korean: 고운 밀가루 / 거친 밀가루
  alternatives_korean:
  - 정제된 밀가루 / 곡분
  - 고운 가루 / 가루
  lexicon: HALOT
  rationale: 두 히브리어 어휘의 차이를 살려, 더 고운 분말과 일반적인 분말을 구별되게 번역했습니다. 두 항목을 모두 ‘밀가루’로 두면 대조가 약해질 수 있습니다.
