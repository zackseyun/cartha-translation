  source_fidelity: ‘거친 밀가루’는 קָמַח에 ‘거칠다’라는 질감을 덧붙입니다. 이 단어는 소לת(고운 밀가루)와 구별되는 일반 밀가루/가루를 가리키지만, 반드시 거친 제분 상태를 뜻하지는 않습니다. ‘밀가루’로 옮겨 대조는 유지하되 부가 의미를 피하는 것이 안전합니다.
  naturalness: ‘솔로몬의 하루 양식은 …였습니다’는 현대 표준 한국어의 격식 있는 문체로 자연스럽습니다. 단위 표기를 본문과 주석에서 일치시키면 독해가 더 명료해집니다.
  terminology: 히브리어 כֹּר의 한국어 음역은 본문에서 ‘고르’로, 주석에서 ‘코르’로 불일치합니다. 한국어 성서 및 학술적 용례에 맞춰 ‘코르’로 통일합니다. ‘양식’은 이 문맥의 לֶחֶם을 넓은 식량 공급 의미로 적절히 전달합니다.
