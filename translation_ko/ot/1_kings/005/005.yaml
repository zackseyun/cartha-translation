base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/005.yaml
  text: And Judah and Israel lived in safety[a], each man under his vine and under his fig tree, from Dan to Beer-sheba[b], all the days of Solomon.
  footnotes:
  - marker: a
    text: Or 'everyone under his vine and under his fig tree.' The Hebrew says 'each man,' using a masculine singular form distributively.
    reason: lexical_alternative
  - marker: b
    text: '''Under his vine and under his fig tree'' is a conventional image of peace, security, and prosperity in the land.'
    reason: cultural_note
translation:
  language: ko
  text: 유다와 이스라엘은 솔로몬의 모든 날 동안 단에서 브엘세바까지, 각 사람이 자기 포도나무 아래와 자기 무화과나무 아래에서 안전하게 살았습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 사람이 자기 포도나무 아래와 자기 무화과나무 아래에서.’ 히브리어는 남성 단수형 ‘사람’을 분배적으로 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 포도나무 아래와 자기 무화과나무 아래’는 그 땅에서 누리는 평화와 안전과 번영을 나타내는 관습적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 거주했습니다
  - 살고 있었습니다
  lexicon: HALOT
  rationale: 문맥상 ‘앉다/거주하다’의 직역보다 안정적으로 정착해 평안히 사는 상태를 드러내는 자연스러운 현대 한국어가 적절합니다.
- source_word: לָבֶטַח
  english_pob_choice: in safety
  chosen_korean: 안전하게
  alternatives_korean:
  - 평안히
  - 안심하고
  lexicon: HALOT
  rationale: 히브리어의 सुरक्षा/안전 의미를 간결하게 살리면서, 왕국의 정치적 안정이라는 문맥도 함께 드러냅니다.
- source_word: אִישׁ
  english_pob_choice: each man
  chosen_korean: 각 사람이
  alternatives_korean:
  - 각 남자가
  - 모든 사람이
  lexicon: HALOT
  rationale: 히브리어 단수형의 분배적 용법을 살리되, 한국어에서는 성별을 불필요하게 두드러지게 하지 않는 ‘각 사람’이 자연스럽습니다.
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  english_pob_choice: under his vine and under his fig tree
  chosen_korean: 자기 포도나무 아래와 자기 무화과나무 아래
  alternatives_korean:
  - 자기 포도나무와 무화과나무 아래에서
  - 자기 포도나무 그늘과 무화과나무 그늘 아래
  lexicon: HALOT
  rationale: 평화와 번영을 나타내는 관용적 이미지를 풀어 쓰지 않고, 원문의 농경적 비유를 그대로 유지했습니다.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  english_pob_choice: from Dan to Beer-sheba
  chosen_korean: 단에서부터 브엘세바까지
  alternatives_korean:
  - 단에서 브엘세바까지
  - 단에서부터 브엘-세바까지
  lexicon: HALOT
  rationale: 이스라엘 전체를 가리키는 지리적 머리슴을 한국어에서도 관용적으로 재현하되, 고유명사는 현대 음역으로 처리했습니다.
theological_decisions:
- issue: ‘자기 포도나무 아래와 자기 무화과나무 아래’라는 평화의 관용구 처리
  chosen_reading: 직역 이미지를 본문에 그대로 유지했습니다.
  alternative_readings:
  - ‘평화롭고 풍요롭게 살다’로 의역
  - ‘안전하고 번영 가운데 살다’로 해석적 번역
  rationale: 이 표현은 단순한 번영 이상의 언약적 평화를 암시하므로, 본문의 상징성과 상호본문적 울림을 보존하는 편이 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, points 1 and 6
