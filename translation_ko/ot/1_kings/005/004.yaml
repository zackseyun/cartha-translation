id: 1KI.5.4
reference: 1 Kings 5:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי ה֞וּא רֹדֶ֣ה בְּ/כָל עֵ֣בֶר הַ/נָּהָ֗ר מִ/תִּפְסַח֙ וְ/עַד עַזָּ֔ה בְּ/כָל מַלְכֵ֖י עֵ֣בֶר הַ/נָּהָ֑ר וְ/שָׁל֗וֹם הָ֥יָה ל֛/וֹ מִ/כָּל עֲבָרָ֖י/ו מִ/סָּבִֽיב־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/004.yaml
  text: For he was ruling over all the region beyond the River[a], from Tiphsah to Gaza, over all the kings beyond the River[b]; and he had peace on all sides around him.
  footnotes:
  - marker: a
    text: That is, the Euphrates River.
    reason: cultural_note
  - marker: b
    text: Tiphsah is also often spelled Tiphsah in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 강 저편의 온 지역, 곧 티프사흐에서 가사까지 이르는 지역과 강 저편의 모든 왕을 다스리고 있었기 때문입니다.[a] 그 주위 사방에는 평화가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강’은 유프라테스강을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: רֹדֶה
  english_pob_choice: was ruling
  chosen_korean: 다스리고 있었기 때문입니다
  alternatives_korean:
  - 통치하고 있었기 때문입니다
  - 지배하고 있었기 때문입니다
  lexicon: HALOT
  rationale: 분사형 רֹדֶה의 진행 중인 통치 상태를 한국어의 과거 진행 표현으로 살려, 단순 완료형보다 서술의 흐름을 유지했습니다.
- source_word: בְּכָל עֵבֶר הַנָּהָר
  english_pob_choice: over all the region beyond the River
  chosen_korean: 강 저편의 온 지역
  alternatives_korean:
  - 강 건너편의 온 지역
  - 강 너머의 온 지역
  lexicon: HALOT
  rationale: 관용구를 직역하기보다 지리적 통치 범위를 자연스러운 한국어로 옮기되, 'all the region'의 전체성을 '온 지역'으로 보존했습니다.
- source_word: הַנָּהָר
  english_pob_choice: the River
  chosen_korean: 강
  alternatives_korean:
  - 그 강
  - 유브라데 강
  lexicon: HALOT
  rationale: 본문은 정관사적 관용구인 'the River'를 사용하지만, 한국어 본문에서는 문맥상 강의 명칭을 바로 밝히지 않고 간결하게 '강'으로 두었습니다. 필요시 주석으로 명시할 수 있습니다.
- source_word: וְשָׁלוֹם הָיָה לוֹ מִכָּל עֲבָרָיו מִסָּבִיב
  english_pob_choice: and he had peace on all sides around him
  chosen_korean: 그에게는 사방에 평강이 있었습니다
  alternatives_korean:
  - 그에게는 주위 모든 편에 평강이 있었습니다
  - 그는 사방에서 평강을 누렸습니다
  lexicon: HALOT
  rationale: שָׁלוֹם를 정치적·국가적 안정의 의미로 이해하여 '평강'으로 옮기고, 관용적 표현 'on all sides around him'은 자연스러운 '사방에'로 압축했습니다.
