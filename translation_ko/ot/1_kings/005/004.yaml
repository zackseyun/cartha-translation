revisions:
- from: 그가 강 저편의 온 지역을, 즉 티프사흐에서 가사까지, 그리고 강 저편의 모든 왕들을 다스리고 있었기 때문입니다. 그에게는 사방에 평강이 있었습니다.
  to: 그가 강 저편의 온 지역, 곧 티프사흐에서 가사까지 이르는 지역과 강 저편의 모든 왕을 다스리고 있었기 때문입니다.[a] 그 주위 사방에는 평화가 있었습니다.
  rationale: 지리적 범위를 나타내는 히브리어 구문을 명료하게 고치고, 정치적 평화라는 문맥에 맞춰 ‘평강’을 ‘평화’로 조정했습니다. 또한 ‘강’의 관용적 지시 대상을 주석으로 보완했습니다.
  reviewer_model: gpt-5.6-terra
