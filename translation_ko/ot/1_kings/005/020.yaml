  lexicon: HALOT
  rationale: שׂכר의 경제적 의미를 분명히 하기 위해 ‘품삯’을 사용해 일의 대가라는 점을 살렸습니다.
- source_word: אֵין בָּנוּ אִישׁ יֹדֵעַ
  english_pob_choice: there is no man who knows
  chosen_korean: 우리 가운데에는 시돈 사람들처럼 나무를 베는 일을 아는 사람이 없기 때문입니다
  alternatives_korean:
  - 우리 가운데는 나무를 베는 일을 아는 사람이 없기 때문입니다
  - 우리 가운데는 시돈 사람들처럼 벌목할 줄 아는 사람이 없기 때문입니다
  lexicon: HALOT
  rationale: Pob 각주가 설명하듯 אִישׁ은 성별 배제가 아니라 숙련자의 부재를 뜻하므로, 한국어는 ‘사람’으로 옮기되 비교 대상 ‘시돈 사람들처럼’을 살렸습니다.
