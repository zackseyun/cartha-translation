  text: וְ/עַתָּ֡ה צַוֵּה֩ וְ/יִכְרְתוּ לִ֨/י אֲרָזִ֜ים מִן הַ/לְּבָנ֗וֹן וַֽ/עֲבָדַ/י֙ יִהְי֣וּ עִם עֲבָדֶ֔י/ךָ וּ/שְׂכַ֤ר עֲבָדֶ֨י/ךָ֙ אֶתֵּ֣ן לְ/ךָ֔ כְּ/כֹ֖ל אֲשֶׁ֣ר תֹּאמֵ֑ר כִּ֣י אַתָּ֣ה יָדַ֗עְתָּ כִּ֣י אֵ֥ין בָּ֛/נוּ אִ֛ישׁ יֹדֵ֥עַ לִ/כְרָת עֵצִ֖ים כַּ/צִּדֹנִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/020.yaml
  text: Now command that cedars from Lebanon be cut for me[a], and let my servants be with your servants, and I will give you the wages of your servants according to all that you say[b]; for you know that among us there is no man who knows how to cut timber like the Sidonians.
  footnotes:
  - marker: a
    text: Hebrew 'no man among us.' The expression refers to the absence of anyone with comparable skill, not necessarily to gender exclusion as a social claim.
    reason: lexical_alternative
  - marker: b
    text: Or 'who knows how to cut trees.' The Hebrew literally says 'to cut woods/trees,' but the context is timber harvesting.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 명령하십시오. 그러면 레바논에서 백향목을 베어 내어 저를 위해 가져올 것이며, 제 종들은 당신의 종들과 함께 있을 것입니다. 또 당신의 종들의 품삯은 당신이 말하는 대로 당신에게 드리겠습니다. 우리 가운데에는 시돈 사람들처럼 나무를 베는 일을 아는 사람이 없기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람’은 원문의 אִישׁ을 반영한 것으로, 여기서는 성별 배제가 아니라 동등한 숙련자를 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나무를 베는 일’은 원문의 ‘나무/목재를 베다’에 해당하며, 문맥상 목재 벌채를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
