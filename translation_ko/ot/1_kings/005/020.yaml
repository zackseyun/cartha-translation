  rationale: 직접적인 왕의 요청을 살리되, 현대 공적 문체에 맞는 정중한 명령형으로 옮겼습니다.
- source_word: אֲרָזִים מִן הַלְּבָנוֹן
  english_pob_choice: cedars from Lebanon
  chosen_korean: 레바논에서 백향목을
  alternatives_korean:
  - 레바논의 백향목을
  - 레바논 백향목을
  lexicon: HALOT
  rationale: 문맥상 목재 조달을 뜻하므로 종교적 전통어인 백향목을 유지하면서 출처를 ‘레바논에서’로 자연스럽게 옮겼습니다.
- source_word: עֲבָדַי / עֲבָדֶיךָ
  english_pob_choice: my servants / your servants
  chosen_korean: 제 종들 / 당신의 종들
  alternatives_korean:
  - 제 일꾼들 / 당신의 일꾼들
  - 제 종사자들 / 당신의 종사자들
  lexicon: HALOT
  rationale: 이 구절에서는 노동 동원과 소속 관계가 핵심이므로 기본어 ‘종’을 유지해 עבד 반복을 드러냈습니다.
- source_word: וּשְׂכַר עֲבָדֶיךָ
  english_pob_choice: the wages of your servants
  chosen_korean: 당신의 종들의 품삯
  alternatives_korean:
  - 당신의 종들에 대한 품삯
