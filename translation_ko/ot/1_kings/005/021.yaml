base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/021.yaml
  text: And when Hiram heard the words of Solomon, he rejoiced greatly and said, “Blessed be the LORD today, who has given David a wise son over this great people.”
translation:
  language: ko
  text: 히람은 솔로몬의 말을 듣고 크게 기뻐했습니다. 그리고 이렇게 말했습니다. “오늘 여호와를 찬송합니다. 그분께서 다윗에게 이 많은 백성을 다스리는 지혜로운 아들을 주셨습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/יֹּאמֶר בָּרוּךְ יְהוָה הַ/יּוֹם
  english_pob_choice: said, “Blessed be the LORD today”
  chosen_korean: “오늘 야훼를 찬송합니다”
  alternatives_korean:
  - “오늘 야훼는 복되십니다”
  - “오늘 야훼를 찬양합니다”
  lexicon: יהוה
  rationale: 축복 선언의 관용적 형식을 한국어로 자연스럽게 옮기되, 본문이 하나님의 이름을 직접 찬송하는 말임을 살려 ‘찬송합니다’를 택했습니다. POB가 LORD로 되돌린 audit trail을 반영해 야훼로 옮겼습니다.
- source_word: בֵּ֣ן חָכָ֔ם
  english_pob_choice: a wise son
  chosen_korean: 지혜로운 아들
  alternatives_korean:
  - 슬기로운 아들
  - 현명한 아들
  lexicon: חכם
  rationale: חָכָם은 단순한 지적 능력보다 통치에 필요한 지혜를 뜻하므로, 문맥상 자연스럽고 왕권 맥락에 맞는 ‘지혜로운’으로 옮겼습니다.
- source_word: עַל הָ/עָ֥ם הָ/רָ֖ב הַ/זֶּה
  english_pob_choice: over this great people
  chosen_korean: 이 많은 백성을 다스릴
  alternatives_korean:
  - 이 큰 백성 위에 있는
  - 이 큰 백성 위에
  lexicon: עַל + עם
  rationale: עַל은 여기서 단순한 ‘위에’보다 통치·관할의 의미가 강하므로 ‘다스릴’로 풀어 자연스러운 한국어를 만들었습니다. הָרָב는 규모를 가리켜 ‘많은’으로 옮겼습니다.
- source_word: דִּבְרֵ֥י שְׁלֹמֹ֖ה
  english_pob_choice: the words of Solomon
  chosen_korean: 솔로몬의 말
  alternatives_korean:
  - 솔로몬의 말씀
  - 솔로몬의 이야기
  lexicon: דבר
  rationale: דִּבְרֵי는 발화 내용 전반을 가리키므로, 과도하게 격식화한 ‘말씀’보다 직접적이고 중립적인 ‘말’이 본문에 더 가깝습니다.
theological_decisions:
- issue: YHWH의 표기와 축복 표현
  chosen_reading: 본문의 יהוה는 POB audit trail에 따라 야훼로 두고, ברוך יהוה는 ‘야훼를 찬송합니다’로 옮겼습니다.
  alternative_readings:
  - ‘여호와를 찬송합니다’
  - ‘야훼는 복되십니다’
  rationale: POB가 LORD로 복원한 결정을 존중하면서도, 한국어에서 하나님께 드리는 찬송 선언을 가장 분명하게 전달하는 표현을 선택했습니다.
  doctrine_reference: 출 20:7; 시 72:19
