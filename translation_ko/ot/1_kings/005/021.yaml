  - severity: low
    issue: ‘다스릴 지혜로운 아들’의 표현
    rationale: 원문은 ‘이 많은 백성 위에 있는/다스리는 지혜로운 아들’을 말합니다. ‘다스릴’은 목적 또는 미래의 뉘앙스를 더할 수 있으므로 ‘다스리는’이 문맥에 더 가깝습니다.
