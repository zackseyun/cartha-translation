revisions:
- from: 그때 두로 왕 히람이 자기 종들을 솔로몬에게 보냈습니다. 그가 솔로몬의 머리에 기름을 부어 그의 아버지 대신 왕이 되게 했다는 소식을 들었기 때문입니다. 히람은 늘 다윗을 사랑했습니다.[a]
  to: 그때 두로 왕 히람은 솔로몬이 아버지를 이어 왕으로 기름 부음을 받았다는 소식을 듣고 자신의 종들을 솔로몬에게 보냈습니다. 히람은 언제나 다윗을 사랑했습니다.[a]
  rationale: 기름 부음의 주체를 원문처럼 특정하지 않는 수동 표현으로 바꾸고, 원문에 없는 신체 부위 언급을 제거했습니다. ‘아버지를 이어’는 תַּחַת אָבִיהוּ의 왕위 계승 의미를 자연스럽게 전달합니다. 마지막 절의 지속적 호의는 ‘언제나 ... 사랑했습니다’와 각주의 관계적 대안으로 보존했습니다.
  reviewer_model: gpt-5.6-terra
