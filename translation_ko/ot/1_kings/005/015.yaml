base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/015.yaml
  text: Then Hiram king of Tyre sent his servants to Solomon[a], because he had heard that they had anointed him king in place of his father, for Hiram had always loved David.
  footnotes:
  - marker: a
    text: Or, 'for Hiram was a friend to David all his days.' The Hebrew literally says 'for Hiram was loving David all the days,' expressing an enduring favorable relationship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 두로 왕 히람이 자기 종들을 솔로몬에게 보냈습니다. 그가 솔로몬의 머리에 기름을 부어 그의 아버지 대신 왕이 되게 했다는 소식을 들었기 때문입니다. 히람은 늘 다윗을 사랑했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘히람은 평생 다윗의 친구였다.’ 히브리어는 문자적으로 ‘히람은 모든 날에 다윗을 사랑하고 있었다’는 뜻으로, 지속적인 호의 관계를 나타냅니다.
    reason: lexical_alternative
