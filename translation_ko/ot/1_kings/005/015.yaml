  source_fidelity: 수정이 필요합니다. 초안의 ‘그가 솔로몬의 머리에 기름을 부어’는 히브리어의 복수 주어(‘그들이’)를 히람으로 오인하게 만들며, 원문에 없는 ‘머리에’를 더합니다. 또한 왕으로 기름 부음을 받은 주체가 솔로몬임을 더 분명히 해야 합니다.
  naturalness: ‘솔로몬이 아버지를 이어 왕으로 기름 부음을 받았다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 왕위 계승 및 기름 부음 표현을 정확히 전달합니다. ‘자기 종들’보다 ‘자신의 종들’이 문어적 성경 문맥에서 지시 대상이 더 명료합니다.
  terminology: ‘두로 왕 히람’, ‘왕으로 기름 부음을 받다’, ‘사랑했습니다’를 유지합니다. עֲבָדָיו는 원문의 폭을 보존하여 ‘종들’로 옮기며, 각주에서 ‘친구’라는 관계적 대안을 제시합니다.
