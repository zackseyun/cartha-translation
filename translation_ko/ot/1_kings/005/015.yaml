theological_decisions:
- issue: 히람의 다윗에 대한 관계를 ‘친구’로 완화할지, ‘사랑’으로 직역할지
  chosen_reading: ‘사랑했습니다’로 유지했습니다.
  alternative_readings:
  - ‘다윗의 친구였습니다’
  - ‘다윗을 늘 좋게 여겼습니다’
  rationale: 히브리어 본문은 단순한 외교적 친선보다 지속적인 호의와 애정을 말하므로, POB의 주석적 긴장을 따라 ‘사랑했습니다’를 유지하는 것이 더 원문 충실적입니다.
  doctrine_reference: 성경 번역의 원문 충실성과 담화 뉘앙스 보존
