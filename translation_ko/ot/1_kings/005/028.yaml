id: 1KI.5.28
reference: 1 Kings 5:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלָחֵ֣/ם לְבָנ֗וֹנָ/ה עֲשֶׂ֨רֶת אֲלָפִ֤ים בַּ/חֹ֨דֶשׁ֙ חֲלִיפ֔וֹת חֹ֚דֶשׁ יִהְי֣וּ בַ/לְּבָנ֔וֹן שְׁנַ֥יִם חֳדָשִׁ֖ים בְּ/בֵית֑/וֹ וַ/אֲדֹנִירָ֖ם עַל הַ/מַּֽס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/028.yaml
  text: He sent them to Lebanon[a], ten thousand a month in shifts; they would be in Lebanon one month and two months at home[c][b], and Adoniram was over the forced labor.
  footnotes:
  - marker: a
    text: Or 'by relays' or 'alternating groups' for 'in shifts.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in his house'; the sense is that each laborer spent two months at home between month-long terms in Lebanon.
    reason: lexical_alternative
  - marker: c
    text: Or 'labor levy'; the Hebrew term refers to compulsory state labor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들을 레바논으로 보냈습니다[a]. 매달 만 명씩 교대로; 그들은 한 달은 레바논에 있고, 두 달은 자기 집에 있었으며[b], 아도니람은 강제 노역을 감독했습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교대로’ ‘번갈아’라는 뜻으로, 노동조의 교대 편성을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘자기 집 안에’입니다. 문맥상 각 노동자가 레바논에서 한 달을 보낸 뒤 집에서 두 달을 지냈다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 מַס는 국가가 부과한 강제 노역, 즉 부역을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  english_pob_choice: He sent them
  chosen_korean: 그들을 ... 보냈습니다
  alternatives_korean:
  - 그들을 파견했습니다
  - 그들을 보냈습니다
  lexicon: HALOT
  rationale: שלח의 기본 서술은 단순히 ‘보내다’이므로, 현대 한국어에서도 가장 직접적이고 자연한 ‘보냈습니다’로 옮겼습니다.
- source_word: לְבָנוֹנָה
  english_pob_choice: to Lebanon
  chosen_korean: 레바논으로
  alternatives_korean:
  - 레바논에
  - 레바논을 향해
  lexicon: HALOT
  rationale: 지향/도착의 방향을 나타내는 לשׁ/לְ 계열 용법이므로 이동 목적지를 드러내는 ‘-으로’를 썼습니다.
- source_word: חֲלִיפוֹת
  english_pob_choice: in shifts
  chosen_korean: 교대로
  alternatives_korean:
  - 순번대로
  - 교대조로
  lexicon: HALOT
  rationale: 이 명사는 교대·순환의 의미이므로, 노동 체제를 간결하게 드러내는 ‘교대로’가 적절합니다.
- source_word: שְׁנַיִם חֳדָשִׁים בְּבֵיתוֹ
  english_pob_choice: two months at home / at his house
  chosen_korean: 두 달은 자기 집에
  alternatives_korean:
  - 두 달은 집에
  - 두 달은 그의 집에
  lexicon: HALOT
  rationale: 직역하면 ‘그의 집 안에서’이지만, 문맥상 각 노동자가 현장 근무 뒤 집으로 돌아가는 뜻이므로 자연스러운 현대어로 ‘자기 집에’로 풀었습니다.
- source_word: עַל הַמַּס
  english_pob_choice: over the forced labor
  chosen_korean: 강제 노역을 감독했습니다
  alternatives_korean:
  - 강제 노역을 맡고 있었습니다
  - 부역을 감독했습니다
  lexicon: HALOT
  rationale: מַס는 자발적 노동이 아니라 국가가 부과한 강제 노역을 가리키므로, 이를 약화하지 않기 위해 ‘강제 노역’으로 옮기고 통솔 관계를 ‘감독했습니다’로 표현했습니다.
