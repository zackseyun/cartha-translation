  source_fidelity: 개정이 필요합니다. וַיַּסִּעוּ는 문맥상 채석과 관련될 수 있으나, 기본적으로 돌을 ‘옮겨 내다/운반해 내다’라는 뜻이며, ‘채석하다’는 채굴 행위로 의미를 불필요하게 좁힙니다. 또한 세 종류의 돌에 대한 병렬 수식과 기초를 놓는 목적은 유지해야 합니다.
  naturalness: ‘왕이 명령하자, 그들이 … 옮겨 냈습니다’는 현대 표준 한국어의 자연스러운 서술이며, 문장 종결도 합쇼체입니다. 반복되는 ‘돌들’은 히브리어의 병렬적 강조를 보존하므로 허용됩니다.
  terminology: ‘집’은 히브리어 הַבָּיִת의 표면 표현을 보존하며, 각주에서 문맥상 성전임을 밝히는 방식이 적절합니다. גָזִית는 ‘다듬은 돌’로 자연스럽게 옮길 수 있습니다.
