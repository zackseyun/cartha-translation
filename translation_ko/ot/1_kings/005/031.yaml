  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ וַ/יַּסִּעוּ֩ אֲבָנִ֨ים גְּדֹל֜וֹת אֲבָנִ֧ים יְקָר֛וֹת לְ/יַסֵּ֥ד הַ/בָּ֖יִת אַבְנֵ֥י גָזִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/031.yaml
  text: Then the king commanded[a], and they quarried great stones, costly stones, cut stones[b], to lay the foundation of the house.
  footnotes:
  - marker: a
    text: Or 'hewn stones' or 'dressed stones' for 'cut stones.'
    reason: lexical_alternative
  - marker: b
    text: That is, the temple; Hebrew reads 'the house.'
    reason: cross_reference
translation:
  language: ko
  text: 그때 왕이 명령하자, 그들은 집의 기초를 놓기 위해 큰 돌들, 값비싼 돌들, 다듬은 돌들을 채석했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘채석했습니다’에 해당하는 동사를 사용하며, 건축용 돌을 준비하는 맥락입니다.
    reason: source_note
  - marker: b
    text: 여기서 ‘집’은 문맥상 성전을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: Then the king commanded
  chosen_korean: 그때 왕이 명령하자
  alternatives_korean:
  - 그리고 왕이 명령했습니다
  - 그때 왕이 명령했습니다
  lexicon: HALOT
  rationale: 서사 진행을 살리면서 וַיְצַו의 명령 행위를 간결하게 반영했습니다. 한국어에서는 종속적으로 자연스러운 ‘-하자’ 구문이 왕의 명령 뒤 이어지는 행동을 매끄럽게 연결합니다.
- source_word: וַיַּסִּעוּ
  english_pob_choice: they quarried
  chosen_korean: 그들은 ... 채석했습니다
  alternatives_korean:
  - 그들은 ... 떼어냈습니다
  - 그들은 ... 끌어냈습니다
  lexicon: HALOT
  rationale: 문맥이 건축용 돌을 준비하는 장면이므로 일반적인 ‘옮기다’보다 돌을 캐내는 뜻이 분명한 ‘채석하다’가 원문의 기능을 가장 잘 드러냅니다.
- source_word: אֲבָנִים גְּדֹלוֹת אֲבָנִים יְקָרוֹת אַבְנֵי גָזִית
  english_pob_choice: great stones, costly stones, cut stones
  chosen_korean: 큰 돌들, 값비싼 돌들, 다듬은 돌들
  alternatives_korean:
  - 큰 돌들, 귀한 돌들, 깎은 돌들
  - 큰 돌들, 귀중한 돌들, 거친 다듬질한 돌들
  lexicon: HALOT
  rationale: 세 개의 수식이 연속된 히브리어 구조를 따라 각각을 독립된 형용사구로 옮겼습니다. ‘다듬은 돌들’은 גָזִית의 절단/가공된 석재를 현대 한국어로 자연스럽게 전합니다.
- source_word: הַבָּיִת
  english_pob_choice: the house
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 그 집
  lexicon: HALOT
  rationale: 히브리어 표면형은 ‘집’이므로 이를 보존했습니다. 문맥상 성전을 가리키지만, 본문 용어를 직접 살리되 필요 이상의 해석어로 바꾸지 않았습니다.
theological_decisions:
- issue: ‘the house’의 번역을 문맥 해석어인 ‘성전’으로 바꿀지 여부
  chosen_reading: 본문 용어를 살려 ‘집’으로 두었습니다.
  alternative_readings:
  - ‘성전’으로 명시하기
  - ‘그 집’으로 풀어쓰기
  rationale: 열왕기 본문은 건축 대상을 문맥상 분명히 알 수 있지만, 히브리어 자체는 ‘집’이라고 말합니다. POB의 소스 직결 원칙에 따라 표면 표현을 유지했습니다.
  doctrine_reference: source transparency
