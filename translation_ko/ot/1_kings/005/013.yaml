base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/013.yaml
  text: He spoke about the trees[a], from the cedar that is in Lebanon to the hyssop that grows out of the wall; he also spoke about the animals and the birds and the creeping things and the fish.
  footnotes:
  - marker: a
    text: Or possibly 'a small aromatic plant'; the exact botanical identification of Hebrew אֵזוֹב is uncertain, though 'hyssop' is the traditional rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 레바논의 백향목에서부터 담에서 돋아나는 우슬초까지 나무들을 말했으며, 동물들과 새들과 기어 다니는 것들과 물고기들에 대해서도 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘작은 향기 식물’일 수도 있습니다. 히브리어 אֵזוֹב의 정확한 식물학적 동일시는 불확실하지만, ‘우슬초’는 전통적인 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל
  english_pob_choice: he spoke about
  chosen_korean: 말했으며 … 에 대해서도 말했습니다
  alternatives_korean:
  - 이야기했으며 … 에 대해서도 이야기했습니다
  - 설명했으며 … 에 대해서도 설명했습니다
  lexicon: HALOT
  rationale: עַל을 동반한 דִּבֵּר는 ‘~에 관하여 말하다’의 뜻이 자연스러우므로, 한국어에서도 ‘말하다/말씀하다’ 구조로 topical sense를 살렸습니다.
- source_word: הָאֶרֶז … בַּלְּבָנוֹן
  english_pob_choice: the cedar … in Lebanon
  chosen_korean: 레바논의 백향목
  alternatives_korean:
  - 레바논에 있는 백향목
  - 레바논의 삼나무
  lexicon: HALOT
  rationale: אֶרֶז는 본문 전승과 한국 교회어에서 익숙한 ‘백향목’으로 옮기되, 위치 관계는 소유격 표현으로 간결하게 처리했습니다.
- source_word: הָאֵזוֹב … יֹצֵא בַּקִּיר
  english_pob_choice: the hyssop that grows out of the wall
  chosen_korean: 담에서 돋아나는 우슬초
  alternatives_korean:
  - 벽에서 자라는 우슬초
  - 담에서 나오는 우슬초
  lexicon: HALOT
  rationale: אֵזוֹב은 식물 식별이 불확실하지만 전통적 대응은 ‘우슬초’이므로 본문에는 유지하고, יֹצֵא בַּקִּיר는 식물 이미지에 맞게 ‘돋아나는’으로 옮겼습니다.
- source_word: הַבְּהֵמָה / הָעוֹף / הָרֶמֶשׂ / הַדָּגִים
  english_pob_choice: the animals and the birds and the creeping things and the fish
  chosen_korean: 동물들과 새들과 기어 다니는 것들과 물고기들
  alternatives_korean:
  - 짐승들과 새들과 기어 다니는 것들과 물고기들
  - 동물들과 날짐승들과 기는 것들과 물고기들
  lexicon: HALOT
  rationale: 열거된 범주는 포괄적 분류이므로 בְּהֵמָה는 ‘동물들’로, עוֹף는 ‘새들’로, רֶמֶשׂ는 축소하지 않고 ‘기어 다니는 것들’로, דָּגִים는 일반 복수인 ‘물고기들’로 옮겼습니다.
theological_decisions:
- issue: 범위 표현 ‘from … to …’의 수사적 의미
  chosen_reading: 레바논의 백향목에서 담에서 돋아나는 우슬초까지라는 표현을, 가장 크고 웅장한 것에서 가장 작고 미미한 것까지를 아우르는 총칭적 범위로 보았습니다.
  alternative_readings:
  - 단순한 식물 목록으로 읽기
  - 실제 분류학적 범주로 읽기
  rationale: מִן … וְעַד의 관용적 병렬은 ‘전부를 포괄하는 범위’를 드러내므로, 수사적 총칭성을 한국어에서도 유지하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 성경의 수사학적 병렬과 총칭 표현
- issue: 우슬초의 식물학적 불확실성
  chosen_reading: 본문의 전통적 명칭 ‘우슬초’를 유지하되, 식별 불확실성은 번역문이 아니라 주석에서 처리합니다.
  alternative_readings:
  - 작은 향기 식물
  - 담장에 나는 풀
  rationale: 원문과 POB 주석이 모두 식별의 불확실성을 인정하므로, 한국어 본문에서는 역사적·전승적 대응어를 보존하는 편이 source-direct 합니다.
  doctrine_reference: 번역의 투명성과 본문 보존 원칙
