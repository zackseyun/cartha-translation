id: 1KI.5.32
reference: 1 Kings 5:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּפְסְל֞וּ בֹּנֵ֧י שְׁלֹמֹ֛ה וּ/בֹנֵ֥י חִיר֖וֹם וְ/הַ/גִּבְלִ֑ים וַ/יָּכִ֛ינוּ הָ/עֵצִ֥ים וְ/הָ/אֲבָנִ֖ים לִ/בְנ֥וֹת הַ/בָּֽיִת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/032.yaml
  text: So Solomon’s builders[a], Hiram’s builders[b], and the men of Gebal cut and prepared the timber and the stones to build the house.
  footnotes:
  - marker: a
    text: Or 'the Gebalites' or 'the Giblites,' that is, workers from Gebal (Byblos).
    reason: lexical_alternative
  - marker: b
    text: That is, the house of the LORD, the temple.
    reason: cross_reference
translation:
  language: ko
  text: 솔로몬의 건축 일꾼들과 히람의 건축 일꾼들, 그리고 게발 사람들[a]은 나무와 돌을 다듬어 집[b]을 짓기 위해 준비했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘게발인들’ 또는 ‘기블 사람들’로도 옮길 수 있습니다. 게발(비블로스) 출신의 일꾼들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 본문의 ‘집’은 여호와의 집, 곧 성전을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּפְסְלוּ
  english_pob_choice: cut
  chosen_korean: 다듬어
  alternatives_korean:
  - 깎아
  - 자르고
  - 쪼아
  lexicon: HALOT
  rationale: פסל은 건축 재료를 잘라 모양을 내는 뜻이므로, 나무와 돌 둘 다에 자연스럽게 적용되는 ‘다듬어’로 옮겼습니다.
- source_word: בֹּנֵי שְׁלֹמֹה / וּבֹנֵי חִירוֹם
  english_pob_choice: Solomon’s builders / Hiram’s builders
  chosen_korean: 솔로몬의 건축자들 / 히람의 건축자들
  alternatives_korean:
  - 솔로몬의 일꾼들 / 히람의 일꾼들
  - 솔로몬의 건축 노동자들 / 히람의 건축 노동자들
  lexicon: HALOT
  rationale: 히브리어의 ‘~의 건축하는 사람들’이라는 평행 구조를 살리면서, 현대 한국어에서 직업성을 분명히 하는 ‘건축자들’을 택했습니다.
- source_word: וְהַגִּבְלִים
  english_pob_choice: the men of Gebal
  chosen_korean: 게발 사람들
  alternatives_korean:
  - 게발인들
  - 게발의 사람들
  - 기블 사람들
  lexicon: HALOT
  rationale: 지명 게발의 주민이라는 뜻을 분명히 하되, 본문 안에서는 낯선 민족명을 풀어 ‘사람들’로 자연스럽게 옮겼습니다.
- source_word: לִבְנוֹת הַבָּיִת
  english_pob_choice: to build the house
  chosen_korean: 집을 짓도록
  alternatives_korean:
  - 집을 짓기 위해
  - 그 집을 세우도록
  - 성전을 짓도록
  lexicon: HALOT
  rationale: 히브리어의 ‘house’는 여기서 성전을 가리키지만, 본문 표현을 보존하기 위해 본문에는 ‘집’을 두고, 의미는 문맥으로 전달했습니다.
theological_decisions:
- issue: הַבָּיִת의 처리
  chosen_reading: 본문에는 ‘집’을 유지해 히브리어의 문자적 표현을 살리고, 성전 의미는 문맥에 맡깁니다.
  alternative_readings:
  - 성전
  - 여호와의 집
  rationale: 원문은 פשוט히 ‘집’이라고 하며, POB도 본문에서는 과도한 해석어를 피합니다. 성전으로 명시하면 의미는 분명해지지만 원문 표면형의 긴장이 줄어듭니다.
  doctrine_reference: 성전/성막 용어의 본문-문맥 구분
- issue: 동사의 연속성
  chosen_reading: ‘다듬어 … 준비했습니다’로 두 동작을 순차적으로 옮겼습니다.
  alternative_readings:
  - 자르고 준비했습니다
  - 깎아 준비했습니다
  rationale: 원문은 ‘자르다/다듬다’와 ‘준비하다’를 연속 동작으로 제시하므로, 한국어에서도 공정의 흐름이 드러나도록 분리했습니다.
  doctrine_reference: 서술의 순차성 보존
