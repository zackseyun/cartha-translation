base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/030.yaml
  text: besides Solomon’s chief deputies who were over the work[a], three thousand three hundred[c][b], who ruled over the people doing the work.
  footnotes:
  - marker: a
    text: Or 'chief officers' or 'chief overseers.' The Hebrew administrative terms combine ideas of rank and supervision.
    reason: lexical_alternative
  - marker: b
    text: '''Ruled over'' translates a verb that can denote exercising authority; in context it refers to oversight of laborers.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the people,' referring here to the labor force engaged in the project.
    reason: lexical_alternative
translation:
  language: ko
  text: 공사를 맡은 솔로몬의 수석 관리들[a] 외에, 삼천삼백 명이 있었는데, 이들은 공사하는 백성[c]을 다스렸습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수석 감독들’, ‘고위 관리들’. 히브리어 행정 용어가 위계와 감독의 뜻을 함께 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다스렸습니다’는 통치·지배를 뜻하는 동사를 옮긴 것으로, 여기서는 노동자들에 대한 감독적 권위를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘백성’은 여기서 공사에 동원된 노동 집단을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  english_pob_choice: besides
  chosen_korean: 외에
  alternatives_korean:
  - 뿐 아니라
  - 말고
  - 더하여
  lexicon: HALOT
  rationale: 앞선 집계에 더해지는 예외적 추가를 자연스럽게 드러내므로 ‘외에’가 가장 간결하고 정확합니다.
- source_word: שָּׂרֵי הַנִּצָּבִים
  english_pob_choice: chief deputies
  chosen_korean: 수석 관리들
  alternatives_korean:
  - 수석 감독들
  - 주요 대리자들
  - 고위 관리들
  lexicon: HALOT
  rationale: 두 행정 용어가 합쳐져 상급 감독직을 가리키므로, 직역보다 한국어 행정문맥에 자연스러운 ‘수석 관리들’로 옮기되 위계성을 유지했습니다.
- source_word: אֲשֶׁר עַל הַמְּלָאכָה
  english_pob_choice: who were over the work
  chosen_korean: 공사를 맡은
  alternatives_korean:
  - 공사 위에 있던
  - 공사를 감독하던
  - 공사의 책임을 진
  lexicon: HALOT
  rationale: ‘일/공사 위에 있다’는 관용을 한국어에서 책임·감독의 의미가 살아 있는 ‘맡다’로 풀었습니다.
- source_word: הָרֹדִים בָּעָם
  english_pob_choice: who ruled over the people
  chosen_korean: 백성을 다스렸습니다
  alternatives_korean:
  - 백성을 감독했습니다
  - 백성을 통제했습니다
  - 백성 위에 군림했습니다
  lexicon: HALOT
  rationale: רדה는 단순 감독보다 더 강한 통치·지배의 뉘앙스를 가지므로, 본문이 노동자 집단에 대한 권위 행사를 말한다는 점을 살려 ‘다스렸습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘the people’가 실제로는 공사 노동자 집단을 가리키지만 히브리어 표현은 그대로 유지해야 하는지
  chosen_reading: 본문의 ‘백성’을 유지하되 문맥상 공사하는 사람들임을 앞뒤로 분명히 했습니다.
  alternative_readings:
  - 노동자들
  - 일하는 사람들
  - 인부들
  rationale: 원문은 ‘백성’이라 하여 집단의 사회적 범주를 유지하면서도, 문맥상 건축 노동 집단을 가리킵니다. 이를 현대어로 과도하게 축소하지 않기 위해 본문에서는 ‘백성’을 살리고 설명적 수식을 더했습니다.
  doctrine_reference: source-language fidelity / contextual specificity
