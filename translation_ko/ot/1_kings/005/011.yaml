  text: וַ/יֶּחְכַּם֮ מִ/כָּל הָֽ/אָדָם֒ מֵ/אֵיתָ֣ן הָ/אֶזְרָחִ֗י וְ/הֵימָ֧ן וְ/כַלְכֹּ֛ל וְ/דַרְדַּ֖ע בְּנֵ֣י מָח֑וֹל וַ/יְהִֽי שְׁמ֥/וֹ בְ/כָֽל הַ/גּוֹיִ֖ם סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/011.yaml
  text: He was wiser than every man—than Ethan the Ezrahite[a], and Heman, Kalkol, and Darda[c][b], the sons of Mahol—and his name was in all the surrounding nations.
  footnotes:
  - marker: a
    text: Or 'than all humankind.' Hebrew 'adam' can refer either to 'man' or to humanity more broadly; here the context of named male sages favors 'every man.'
    reason: lexical_alternative
  - marker: b
    text: '''Ezrahite'' may reflect an ethnic or family designation; some connect it with ''Zerahite.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'his fame was among all the surrounding nations.' Literally, 'his name was in all the surrounding nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 모든 사람보다, 곧 에스라인 에단과 헤만과 갈골과 다르다, 마홀의 아들들보다 지혜로웠습니다.[a][b] 그의 이름은 사방의 모든 나라에 퍼져 있었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 인류보다’. 여기서 אָדָם은 ‘사람’ 또는 더 넓게 ‘인류’를 가리킬 수 있으나, 여기서는 이름이 제시된 남성 지혜자들과의 비교가 문맥상 더 분명합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘에스라인’은 족속명 또는 가문 표지일 수 있으며, 일부는 이를 ‘세라 사람’과 연결합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 명성은 사방의 모든 나라에 퍼져 있었습니다’. 문자적으로는 ‘그의 이름이 사방의 모든 나라에 있었습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחְכַּם
  english_pob_choice: He was wiser
  chosen_korean: 더 지혜로웠습니다
  alternatives_korean:
  - 지혜로워졌습니다
  - 지혜에서 뛰어났습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 비교구문에서 단순한 상태 변화보다 우월한 지혜를 나타내므로, 한국어에서도 비교 의미를 직접 드러내는 표현이 가장 자연스럽습니다.
- source_word: מִכָּל הָאָדָם
  english_pob_choice: than every man
  chosen_korean: 모든 사람보다
  alternatives_korean:
  - 모든 인류보다
  - 모든 사람들보다
  lexicon: HALOT
  rationale: 여기서는 이름이 제시된 남성 지혜자들과의 비교이므로, 성중립화보다 원문의 비교 대상을 넓게 살리면서도 자연스러운 한국어인 ‘모든 사람’이 적절합니다.
- source_word: מֵאֵיתָן הָאֶזְרָחִי
  english_pob_choice: than Ethan the Ezrahite
  chosen_korean: 에스라 사람 에단보다
  alternatives_korean:
  - 에즈라 사람 에단보다
  - 에단 에스라인보다
  lexicon: HALOT
  rationale: ‘Ezrahite’는 불확실한 족속/출신 표지이므로, 기존 음역을 따르되 과도한 해석을 피하는 방식으로 옮겼습니다.
- source_word: וְכַלְכֹּל וְדַרְדַּע
  english_pob_choice: and Heman, Kalkol, and Darda
  chosen_korean: 그리고 헤만과 갈골과 다르다
  alternatives_korean:
  - 그리고 헤만과 칼골과 다르다
  - 그리고 헤만, 칼콜, 다르다
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했고, 히브리어 자음형에 더 가까운 ‘갈골’을 채택했습니다.
- source_word: בְּכָל הַגּוֹיִם סָבִיב
  english_pob_choice: in all the surrounding nations
  chosen_korean: 사방의 모든 나라에
  alternatives_korean:
  - 주변의 모든 나라에
  - 둘러싼 모든 나라에
  lexicon: HALOT
  rationale: ‘사방’은 סָבִיב의 공간적 둘러섬을 한국어로 자연스럽게 살리며, גּוֹיִם은 이 문맥에서 이방인 일반이 아니라 주변 국가들이므로 ‘나라’가 적절합니다.
theological_decisions:
- issue: אָדָם의 번역 범위
  chosen_reading: ‘모든 사람’으로 옮겨 남성 지혜자들과의 비교라는 문맥을 반영했습니다.
  alternative_readings:
  - ‘모든 인류’
  - ‘모든 사람들’
  rationale: 원문은 일반적 인간성을 말할 수 있지만, 바로 뒤에 특정 남성 현자들의 이름이 나오므로 문맥상 비교 대상으로서의 남성형 일반 표현을 유지하는 것이 가장 정확합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §4; Contested terms table for אָדָם'
- issue: שְׁמוֹ의 의미
  chosen_reading: ‘그의 이름은’으로 직역해 명성의 함의를 본문 안에서 드러내게 했습니다.
  alternative_readings:
  - ‘그의 명성은’
  - ‘그는 널리 알려졌습니다’
  rationale: 히브리어 관용구를 과도하게 해석하지 않고 보존하되, 문맥상 명성이 퍼졌다는 뜻은 독자가 자연히 파악할 수 있게 했습니다.
  doctrine_reference: 히브리어 관용구 처리 원칙
