source:
  edition: WLC
  text: וְ/עַתָּ֕ה הֵנִ֨יחַ יְהוָ֧ה אֱלֹהַ֛/י לִ֖/י מִ/סָּבִ֑יב אֵ֣ין שָׂטָ֔ן וְ/אֵ֖ין פֶּ֥גַע רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/018.yaml
  text: But now Yahweh my God has given me rest on every side[b][a]; there is neither adversary nor evil occurrence.
  footnotes:
  - marker: a
    text: Or 'opponent' for 'adversary'; the Hebrew שָׂטָן here is a common noun, not necessarily the proper name Satan.
    reason: lexical_alternative
  - marker: b
    text: Or 'misfortune,' 'calamity,' or 'disaster' for 'evil occurrence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이제 야훼 내 하나님께서 내게 사방으로 안식을 주셔서, 대적도 없고 악한 일도 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘대적’은 여기서 고유명사 ‘사탄’이 아니라 일반 명사 שָׂטָן의 의미를 따른 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘악한 일’은 פֶּגַע רָע의 의미 범위를 넓게 살린 번역으로, 재앙·불행·재난까지 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: But now
  chosen_korean: 그러나 이제
  alternatives_korean:
  - 이제
  - 그리고 이제
  lexicon: HALOT
  rationale: 앞선 상황과의 전환 및 대조를 살려, 단순한 시간 부사보다 ‘그러나 이제’가 문맥상 자연스럽고 원문의 역전 효과를 잘 드러냅니다.
- source_word: הֵנִיחַ ... לִי מִסָּבִיב
  english_pob_choice: has given me rest on every side
  chosen_korean: 내게 사방으로 안식을 주셔서
  alternatives_korean:
  - 내게 사방으로 쉼을 주셔서
  - 내가 사방에서 쉬게 하셔서
  lexicon: HALOT
  rationale: 히필의 ‘쉬게 하다/안식을 주다’라는 사역 의미를 살리면서, 한국어에서는 ‘안식을 주셔서’가 가장 자연스럽고 본문 흐름에도 잘 맞습니다.
- source_word: שָׂטָן
  english_pob_choice: adversary
  chosen_korean: 대적
  alternatives_korean:
  - 적
  - 반대자
  - 사탄
  lexicon: HALOT
  rationale: 이곳의 שָׂטָן은 고유명사 ‘사탄’이 아니라 정치·군사적 맥락의 일반 명사이므로, 교회 전통어를 자동 적용하지 않고 ‘대적’으로 옮겼습니다.
- source_word: פֶּגַע רָע
  english_pob_choice: evil occurrence
  chosen_korean: 악한 일
  alternatives_korean:
  - 재앙
  - 불행한 일
  - 해로운 일
  lexicon: HALOT
  rationale: פֶּגַע은 ‘닥침/사고/타격’의 느낌이 있고 רָע이 결합해 해로운 사건을 가리키므로, 과도하게 좁히지 않는 ‘악한 일’이 원문의 폭을 비교적 잘 보존합니다.
theological_decisions:
- issue: שָׂטָן을 고유명사로 읽을지 일반 명사로 읽을지
  chosen_reading: 일반 명사 ‘대적’으로 번역
  alternative_readings:
  - 사탄
  - 원수
  rationale: 문맥은 여호와께서 솔로몬에게 주신 외적 평안과 주변의 위협 부재를 말하며, 여기서의 שָׂטָן은 인격적 악령 이름보다 ‘대항하는 자/적대자’를 뜻하는 일반 명사로 이해하는 것이 본문 의도에 맞습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
