  source_fidelity: 현 초안의 둘째 문장(“땅의 모든 왕들 가운데서도 … 이들이 있었습니다”)은 히브리어 מֵאֵת כָּל־מַלְכֵי הָאָרֶץ를 별도의 존재 진술로 바꾸어, 실제로 온 사람들이 왕들과 관련된 출처에서 왔다는 원문의 수식 관계를 잃습니다. 또한 ‘있었습니다’는 וַיָּבֹאוּ(‘왔습니다’)를 충실히 반영하지 못합니다.
  naturalness: ‘모든 백성 가운데서 사람들이’보다 복수 집단을 자연스럽게 나타내는 ‘모든 민족에서 사람들이’가 현대 표준 한국어에 더 적절합니다. 왕들에게서 사람들이 왔다는 압축된 원문은 한국어에서도 다소 낯설지만, ‘왕들에게서 온 사람들’로 옮기고 각주에서 출처/파견이라는 가능한 관계를 설명하면 자연스러움과 절제된 해석을 함께 확보할 수 있습니다.
  terminology: עַמִּים은 복수 집단을 뜻하므로 ‘민족들’ 또는 ‘민족’이 적절합니다. ‘지혜에 대하여 들은’은 평판을 들었다는 의미를 자연스럽게 전달합니다. 솔로몬은 통용 표기이며, 신학 용어상의 문제는 없습니다.
