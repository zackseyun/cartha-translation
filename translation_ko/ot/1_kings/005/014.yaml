base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/014.yaml
  text: And people from all the peoples came to hear the wisdom of Solomon[b][a], from all the kings of the earth who had heard of his wisdom.
  footnotes:
  - marker: a
    text: Or 'from all the nations.' The Hebrew עַמִּים is plural and can denote peoples or nations.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''from all the kings of the earth''; this likely means that such visitors came from, or were sent by, kings throughout the world who had heard of Solomon''s wisdom.'
    reason: cultural_note
translation:
  language: ko
  text: 모든 백성 가운데서 사람들이 솔로몬의 지혜를 들으려고 왔습니다. 땅의 모든 왕들 가운데서도 그의 지혜에 대해 들은 이들이 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘백성’은 히브리어 복수형 עַמִּים의 집합적 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅의 모든 왕들 가운데서’는 히브리어의 압축된 표현을 한국어로 풀어 옮긴 것으로, 방문자들의 출처 또는 파견 배경을 암시할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִכָּל הָעַמִּים
  english_pob_choice: from all the peoples
  chosen_korean: 모든 백성 가운데서
  alternatives_korean:
  - 모든 민족 가운데서
  - 모든 나라 가운데서
  lexicon: HALOT
  rationale: עַמִּים의 복수성과 집합적 의미를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘백성’을 택했습니다.
- source_word: לִשְׁמֹעַ
  english_pob_choice: to hear
  chosen_korean: 들으려고
  alternatives_korean:
  - 듣기 위해
  - 들으러
  lexicon: HALOT
  rationale: 동사의 목적을 분명히 드러내기 위해 ‘~려고’로 옮겼습니다.
- source_word: חָכְמַת שְׁלֹמֹה
  english_pob_choice: the wisdom of Solomon
  chosen_korean: 솔로몬의 지혜
  alternatives_korean:
  - 솔로몬의 지혜로운 말
  - 솔로몬의 지혜로움
  lexicon: HALOT
  rationale: 지혜를 추상명사로 직접 옮겨 히브리어 소유격 구성을 보존했습니다.
- source_word: מֵאֵת כָּל מַלְכֵי הָאָרֶץ
  english_pob_choice: from all the kings of the earth
  chosen_korean: 땅의 모든 왕들 가운데서
  alternatives_korean:
  - 온 땅의 모든 왕들로부터
  - 땅의 모든 왕들에게서
  lexicon: HALOT
  rationale: מֵאֵת의 출처/기원을 한국어로 자연스럽게 풀되, 영어 POB가 지적한 ‘from or at the instance of’의 압축성을 과도하게 해석하지 않도록 했습니다.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת חָכְמָתוֹ
  english_pob_choice: who had heard of his wisdom
  chosen_korean: 그의 지혜에 대해 들은 이들이 있었습니다
  alternatives_korean:
  - 그의 지혜를 들은 이들이 있었습니다
  - 그의 지혜에 관해 들은 이들이 있었습니다
  lexicon: HALOT
  rationale: 직접 청취가 아니라 소문/평판을 들은 의미이므로 한국어 관용 표현인 ‘~에 대해 듣다’로 반영했습니다.
theological_decisions:
- issue: מִכָּל הָעַמִּים의 범위
  chosen_reading: ‘백성’으로 옮기되, 문맥상 여러 집단이 솔로몬의 지혜를 찾아오는 보편적 확산을 드러냈습니다.
  alternative_readings:
  - ‘민족’으로 옮겨 국제적 범위를 더 분명히 할 수 있습니다.
  - ‘나라들’로 옮겨 정치적 단위를 강조할 수 있습니다.
  rationale: 본문은 단순한 이스라엘 내부 소식이 아니라 솔로몬의 지혜가 여러 집단과 통치자들에게 알려졌음을 보여 주므로, 집합적이면서도 넓은 범위를 지닌 표현을 택했습니다.
  doctrine_reference: 열왕기상 5:14 문맥의 솔로몬 지혜와 열방 인식
