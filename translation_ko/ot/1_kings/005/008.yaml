  text: 보리와 짚을 말들과 승용 짐승들[a]을 위해 각 사람이[b] 있는 곳으로, 각자가 맡은 바에 따라 가져왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רָכֶשׁ은 선별된 승용 동물을 가리킬 수 있으며, 말이나 노새류를 포함할 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘사람’은 여기서 책임자 한 사람씩을 가리키는 분배적 용법입니다.
    reason: lexical_alternative
