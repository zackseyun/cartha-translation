  lexicon: HALOT
  rationale: רָכֶשׁ은 전용 승용·귀중한 짐승류를 가리킬 수 있어, 특정 종으로 단정하지 않고 기능적 의미를 살린 표현을 택했습니다.
- source_word: כְּמִשְׁפָּטוֹ
  english_pob_choice: according to his duty
  chosen_korean: 각 사람이 맡은 대로
