  text: And the barley and the straw for the horses and the steeds were brought to the place where each man was[b][a], according to his duty.
  footnotes:
  - marker: a
    text: Or 'and the steeds'; the Hebrew term may refer more specifically to select riding animals, possibly including mules or chariot horses.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each man,' used distributively for each responsible person.
    reason: lexical_alternative
translation:
  language: ko
  text: 보리와 짚은 말들과 빠른 짐승들을 위해, 각 사람이 맡은 대로 있는 곳으로 가져갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רָכֶשׁ은 승용용의 귀중한 짐승을 가리킬 수 있으며, 말이나 노새류를 포함할 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘사람’은 여기서 분배상 책임자 한 사람씩을 가리키는 분배적 용법입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׂעֹרִים
  english_pob_choice: the barley
  chosen_korean: 보리
  alternatives_korean:
  - 그 보리
  - 보리 곡식
  lexicon: HALOT
  rationale: 사료로 쓰이는 보리를 가리키므로, 관사까지 살리지 않고 자연스러운 명사형 ‘보리’로 옮겼습니다.
- source_word: וְהַתֶּבֶן
  english_pob_choice: the straw
  chosen_korean: 짚
  alternatives_korean:
