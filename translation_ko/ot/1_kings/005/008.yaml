  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 법정 판결이 아니라 배정된 의무·규정된 몫의 뜻이므로, 행정 문맥에 맞게 ‘맡은 대로’로 옮겼습니다.
theological_decisions:
- issue: 분배 대상의 행정적·지속적 의미
  chosen_reading: 이 구절은 왕실 공급품이 각 담당자에게 정해진 배분에 따라 전달되는 행정 절차를 묘사합니다.
  alternative_readings:
  - 일회성 운반 묘사로만 읽기
  - ‘각 사람’의 의미를 일반 개인으로 좁혀 읽기
  rationale: 히브리어 분배 표현과 문맥상, 단순 운송이 아니라 정해진 책임 단위에 따른 공급 체계를 드러냅니다.
  doctrine_reference: 본문 해석/문맥
