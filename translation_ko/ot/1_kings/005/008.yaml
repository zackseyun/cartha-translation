  - 짚더미
  lexicon: HALOT
  rationale: 동물 사료와 병렬되는 재료이므로 일반어 ‘짚’이 가장 간명하고 정확합니다.
- source_word: וְלָרָכֶשׁ
  english_pob_choice: the swift steeds
  chosen_korean: 빠른 짐승들
  alternatives_korean:
  - 준마들
  - 군마들
