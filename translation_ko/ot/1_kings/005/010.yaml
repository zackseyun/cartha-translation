  rationale: 히브리어를 직역하면 ‘동방의 아들들’이지만, 한국어에서는 관용적 지역 표지인 ‘동방 사람들’이 의미를 덜 어색하게 전달합니다.
- source_word: מִצְרָיִם
  english_pob_choice: Egypt
  chosen_korean: 이집트
  alternatives_korean:
  - 애굽
  - 에집트
  - 이집트 나라
  lexicon: HALOT
  rationale: 현대 표준어 외래어 표기법에 따라 고유명사를 옮겼습니다.
theological_decisions:
- issue: 비교문의 힘을 한국어에서 어떻게 보존할지
  chosen_reading: ‘뛰어났습니다’와 ‘보다’ 구문으로 솔로몬의 지혜가 단순히 많아진 것이 아니라 다른 어떤 지혜보다 우월하다는 뜻을 살렸습니다.
  alternative_readings:
  - ‘더 많아졌습니다’
  - ‘커졌습니다’
  rationale: 히브리어 רבה + מן 비교는 양적 증가보다 질적 우위를 가리키므로, 문맥상 탁월성과 우월성을 분명히 하는 번역이 더 충실합니다.
  doctrine_reference: 지혜 문학의 평가어법
- issue: ‘sons of the east’의 문화적 표지 유지 여부
  chosen_reading: 의미를 살리면서도 자연스러운 한국어인 ‘동방 사람들’로 옮겼습니다.
  alternative_readings:
  - ‘동방의 아들들’
  - ‘동방인들’
  rationale: 이 표현은 특정 민족명이라기보다 지역적·관용적 범주이므로, 지나치게 직역하면 독자 이해를 해칠 수 있습니다.
  doctrine_reference: 고대 근동의 관용적 지리 표현
