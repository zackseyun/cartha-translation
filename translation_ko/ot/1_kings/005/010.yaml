translation:
  language: ko
  text: 솔로몬의 지혜가 동방의 모든 사람의 지혜와 이집트의 모든 지혜보다 뛰어났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘동방의 아들들’입니다. 이는 관용적인 지역 지칭입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶב
  english_pob_choice: surpassed
