source:
  edition: WLC
  text: וַ/יהוָ֗ה נָתַ֤ן חָכְמָה֙ לִ/שְׁלֹמֹ֔ה כַּ/אֲשֶׁ֖ר דִּבֶּר ל֑/וֹ וַ/יְהִ֣י שָׁלֹ֗ם בֵּ֤ין חִירָם֙ וּ/בֵ֣ין שְׁלֹמֹ֔ה וַ/יִּכְרְת֥וּ בְרִ֖ית שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/026.yaml
  text: And Yahweh gave wisdom to Solomon[a], just as he had spoken to him. And there was peace between Hiram and Solomon[b], and the two of them made a covenant.
  footnotes:
  - marker: a
    text: 'Hebrew: ''cut a covenant,'' an idiom meaning to make a covenant.'
    reason: lexical_alternative
  - marker: b
    text: Or 'as he had promised him.' The Hebrew verb is literally 'spoke,' but in context it refers to the LORD's prior word to Solomon.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 솔로몬에게 지혜를 주셨습니다[a]. 이는 그분께서 이미 그에게 말씀하신 그대로였습니다. 히람과 솔로몬 사이에는 평강이 있었습니다. 그리고 두 사람은 언약을 맺었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘언약을 끊다’이지만 ‘언약을 맺다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신적 고유명사 יהוה는 제목이 아닌 고유명사로서 ‘야훼’로 옮겨야 하며, 한국어 관용어인 ‘여호와’는 사용하지 않았습니다.
- source_word: חָכְמָה
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  - 지식
  lexicon: HALOT
  rationale: 문맥상 솔로몬에게 주어진 왕적·실천적 지혜를 가리키므로 표준적인 ‘지혜’가 가장 직접적입니다.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  english_pob_choice: just as he had spoken to him
  chosen_korean: 이는 그분께서 이미 그에게 말씀하신 그대로였습니다
  alternatives_korean:
  - 그에게 약속하신 그대로였습니다
  - 그에게 말씀하신 대로였습니다
  lexicon: HALOT
  rationale: דִּבֶּר의 기본값인 ‘말씀하다’를 살리되, 앞선 신적 말씀의 성취라는 문맥을 드러내기 위해 ‘이미’와 ‘그대로’로 자연스럽게 옮겼습니다.
- source_word: וַיְהִי שָׁלוֹם
  english_pob_choice: there was peace
  chosen_korean: 평강이 있었습니다
  alternatives_korean:
  - 평화가 있었습니다
  - 화평이 있었습니다
  lexicon: HALOT
  rationale: שָׁלוֹם은 단순한 전쟁 부재를 넘어 관계의 안정과 온전함을 포함하므로, 한국어 성경 어휘로는 ‘평강’이 가장 적절합니다.
- source_word: וַיִּכְרְתוּ בְרִית
  english_pob_choice: made a covenant
  chosen_korean: 언약을 맺었습니다
  alternatives_korean:
  - 언약을 세웠습니다
  - 언약을 체결했습니다
  - 동맹을 맺었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자적 이미지는 ‘cut a covenant’이지만, 한국어에서는 의미를 분명히 하는 ‘언약을 맺다’가 가장 자연스럽고 원문의 ברית를 보존합니다.
theological_decisions:
- issue: הוָה의 한국어 처리
  chosen_reading: 고유명사 ‘야훼’로 본문에 표기했습니다.
  alternative_readings:
  - ‘주님’으로 완곡하게 처리
  - ‘여호와’ 사용
  rationale: 본문은 신적 칭호가 아니라 언약의 하나님 이름을 직접 제시하므로, 프로젝트 기준에 따라 고유명사 표기를 유지하는 것이 स्रोत에 가장 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: בְרִית의 번역
  chosen_reading: 관계적·정치적 맥락이지만 ‘언약’으로 유지했습니다.
  alternative_readings:
  - ‘동맹’으로 번역
  - ‘조약’으로 번역
  rationale: 문맥상 국제 관계를 가리키더라도 히브리어는 표준적인 ברית를 사용하므로, 독자가 성경 내부의 용례 일관성을 볼 수 있도록 ‘언약’을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #5 (consistency of key terms, or documented exception)'
