base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/001.yaml
  text: And Solomon was ruling over all the kingdoms from the River to the land of the Philistines and as far as the border of Egypt[b][a]. They were bringing tribute and serving Solomon all the days of his life.
  footnotes:
  - marker: a
    text: That is, the Euphrates River.
    reason: cross_reference
  - marker: b
    text: Or 'bringing gifts.' The Hebrew minḥah can denote a gift, offering, or tribute; here the political context favors 'tribute.'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 강에서부터 블레셋 사람의 땅에 이르기까지, 그리고 이집트 국경에 이르기까지 모든 왕국을 다스리고 있었습니다. 그들은 조공을 바치고 솔로몬을 섬겼으며, 그의 생애 동안 그렇게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 유프라테스 강입니다.
    reason: cross_reference
  - marker: b
    text: 히브리어 minḥah는 선물, 예물, 조공을 뜻할 수 있습니다. 여기서는 정치적 문맥상 ‘조공’이 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  english_pob_choice: was ruling
  chosen_korean: 다스리고 있었습니다
  alternatives_korean:
  - 통치하고 있었습니다
  - 다스렸습니다
  - 주권을 행사하고 있었습니다
  lexicon: HALOT
  rationale: 히브리어 분사와 היה의 결합이 나타내는 지속적 상태를 살려, 과거 진행의 느낌이 있는 ‘다스리고 있었습니다’로 옮겼습니다.
- source_word: מִן הַנָּהָר
  english_pob_choice: from the River
  chosen_korean: 강에서부터
  alternatives_korean:
  - 유프라테스 강에서
  - 그 강에서부터
  lexicon: HALOT
  rationale: 본문의 지시를 그대로 살려 ‘강’으로 두되, 지리적 범위를 나타내는 출발점 표현은 ‘-에서부터’로 자연스럽게 반영했습니다.
- source_word: מִנְחָה
  english_pob_choice: bringing tribute
  chosen_korean: 조공을 바치고
  alternatives_korean:
  - 예물을 바치고
  - 선물을 바치고
  - 공물을 바치고
  lexicon: HALOT
  rationale: 정치적 종속 관계가 분명하므로, 제의적 ‘예물’보다 속국이 상납하는 의미를 드러내는 ‘조공’을 택했습니다.
- source_word: וְעֹבְדִים אֶת שְׁלֹמֹה
  english_pob_choice: serving Solomon
  chosen_korean: 솔로몬을 섬겼으며
  alternatives_korean:
  - 솔로몬에게 복무했으며
  - 솔로몬에게 종속되어 있었으며
  lexicon: HALOT
  rationale: עבד + 인칭목적어의 기본 의미인 상위자에 대한 봉사를 살리되, 한국어에서 자연스러운 정치적·봉신적 관계 표현으로 ‘섬겼으며’로 옮겼습니다.
theological_decisions:
- issue: 지리 범위의 표현과 ‘강’의 식별
  chosen_reading: 본문에는 ‘강에서부터’로 두고, 식별은 본문 밖에서 처리합니다.
  alternative_readings:
  - ‘유프라테스 강에서’로 본문에 명시
  - ‘그 강에서부터’로 번역
  rationale: 히브리어 원문은 מִן הַנָּהָר를 관용적으로 사용하며, 본문 자체는 일반명사형 표현을 유지합니다. 따라서 본문에서는 과잉 해석을 피하고, 독자가 주석 없이도 읽을 수 있는 형태로 남겼습니다.
  doctrine_reference: 지리·역사 주석 원칙
- issue: ‘מִנְחָה’의 의미 범주
  chosen_reading: 여기서는 제의적 ‘예물’보다 정치적 ‘조공’으로 읽습니다.
  alternative_readings:
  - ‘예물’
  - ‘선물’
  rationale: 문맥이 왕국 간의 지배 관계를 말하므로, 동일 어휘의 일반적 의미보다 속국의 공납이라는 역사적 문맥이 우선합니다.
  doctrine_reference: 본문 문맥 우선 원칙
