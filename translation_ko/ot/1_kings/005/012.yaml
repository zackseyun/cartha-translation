translation:
  language: ko
  text: 그는 삼천 편의 잠언을 말하였고, 그의 노래는 천오편이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잠언’에 해당하는 히브리어 מָשָׁל은 ‘속담’이나 ‘비유’까지 포함하는 더 넓은 의미를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: He spoke
  chosen_korean: 그는 … 말하였고
  alternatives_korean:
  - 그는 … 이야기하였고
  - 그는 … 전하였고
  lexicon: HALOT
  rationale: 동사 דִּבֵּר의 기본 의미를 따라 ‘말하다’로 옮겼고, 여기서는 지혜의 내용을 산출한 행위로 자연스럽게 연결되도록 과거 연결형을 사용했습니다.
- source_word: שְׁלֹשֶׁת אֲלָפִים מָשָׁל
  english_pob_choice: three thousand proverbs
  chosen_korean: 삼천 편의 잠언
  alternatives_korean:
  - 삼천 개의 잠언
  - 삼천 잠언
  - 삼천의 잠언들
  lexicon: HALOT
  rationale: מָשָׁל은 문맥상 ‘잠언/속담/비유’ 범위를 가지므로, 솔로몬의 지혜 전통에 맞는 표준적 표현인 ‘잠언’을 택했습니다. 수사 뒤 단수형 명사를 한국어에서는 관용적으로 묶어 ‘편’으로 셌습니다.
- source_word: וַיְהִי שִׁירוֹ חֲמִשָּׁה וָאָלֶף
  english_pob_choice: his songs were one thousand and five
  chosen_korean: 그의 노래는 천오편이었습니다
  alternatives_korean:
  - 그의 노래는 천오 곡이었습니다
  - 그의 노래는 천오 개였습니다
  lexicon: HALOT
  rationale: שִׁיר는 수사 뒤 집합적으로 쓰였으므로 영어의 복수 ‘songs’에 맞춰 한국어에서도 복수 의미를 드러냈습니다. ‘편’은 문학·노래 목록을 세는 자연스러운 한국어 분류사입니다.
- source_word: חֲמִשָּׁה וָאָלֶף
  english_pob_choice: one thousand and five
  chosen_korean: 천오
  alternatives_korean:
  - 일천오
  - 천과 다섯
  lexicon: HALOT
  rationale: 히브리어의 ‘다섯과 천’은 총수 1005를 뜻하므로, 한국어에서는 자연스러운 수사 ‘천오’로 바로 옮겼습니다.
theological_decisions:
- issue: 지혜 전승의 ‘מָשָׁל’ 범위
  chosen_reading: ‘잠언’으로 번역하되, 비유·격언의 넓은 의미를 과도하게 좁히지 않도록 했습니다.
  alternative_readings:
  - 비유
  - 속담
  - 말씀
  rationale: 본문은 솔로몬의 지혜를 요약하는 수치 진술이므로, 한국어 독자에게 가장 직접적으로 연결되는 ‘잠언’이 적절하지만, 단일 장르로만 환원하지 않도록 했습니다.
  doctrine_reference: 잠언/지혜문학의 장르 범주
