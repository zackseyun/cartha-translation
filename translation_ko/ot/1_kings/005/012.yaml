  yaml_path: translation/ot/1_kings/005/012.yaml
  text: He spoke three thousand proverbs[a], and his songs were one thousand and five.
  footnotes:
  - marker: a
    text: Or 'three thousand sayings' or 'three thousand parables'; the Hebrew מָשָׁל has a broader range than English 'proverb.'
