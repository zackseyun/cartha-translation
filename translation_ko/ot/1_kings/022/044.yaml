  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֥ךְ הַ/בָּמ֖וֹת לֹֽא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/044.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
  footnotes:
  - marker: a
    text: Or 'the shrines.' The Hebrew term refers to local elevated cult sites, traditionally rendered 'high places.'
    reason: lexical_alternative
  - marker: b
    text: The verse does not specify whether these sacrifices were offered to the LORD at unauthorized sites or as part of broader idolatrous practice.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 산당들은 제거되지 않았습니다. 백성은 여전히 산당에서 제사를 드리고 향을 피우고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘산당’은 본래 높은 곳에 세운 지역 제의 장소를 가리키며, 전통적으로 이렇게 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 그 제사가 야훼께 드린 것이었는지, 아니면 더 넓은 우상숭배의 일부였는지 구체적으로 밝히지 않습니다.
    reason: theological_note
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: However
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: HALOT
  rationale: 앞절의 긍정적 평가와 대비되는 접속을 자연스러운 현대 한국어로 살리기 위해 역접 접속사 ‘그러나’를 사용했습니다.
- source_word: הַבָּמוֹת
  english_pob_choice: the high places
  chosen_korean: 산당들
  alternatives_korean:
  - 산당
  - 높은 곳들
  lexicon: HALOT
  rationale: בָּמוֹת은 이스라엘 종교사에서 고정된 문화적·역사적 용어이므로, 본문 주석의 ‘high places’에 해당하는 관용 번역으로 ‘산당들’을 택했습니다.
- source_word: לֹא סָרוּ
  english_pob_choice: were not removed
  chosen_korean: 제거되지 않았습니다
  alternatives_korean:
  - 없애지 않았습니다
  - 옮겨지지 않았습니다
  lexicon: HALOT
  rationale: 대상이 산당이므로 물리적으로 ‘떠나다’보다 제거·철거되지 않았다는 뜻을 한국어 수동형으로 옮기는 것이 더 정확합니다.
- source_word: מְזַבְּחִים וּמְקַטְּרִים
  english_pob_choice: were sacrificing and burning incense
  chosen_korean: 제사를 드리고 향을 피우고 있었습니다
  alternatives_korean:
  - 제사하며 향을 피우고 있었습니다
  - 제물을 바치고 향을 피우고 있었습니다
  lexicon: HALOT
  rationale: משך적·상습적 행위를 드러내는 현재분사적 의미를 살려 ‘-고 있었습니다’로 옮겼습니다. קטר는 제의적 ‘연기 올림’도 가능하지만, 한국어에서는 문맥상 ‘향을 피우다’가 가장 자연스럽고 예배적 행위를 잘 드러냅니다.
theological_decisions:
- issue: 산당에서의 제의가 누구에게 드려졌는지
  chosen_reading: 본문이 말하는 범위까지만 따라가고, 대상이 야훼인지 다른 신들인지 본문에서 단정하지 않았습니다.
  alternative_readings:
  - 불법적으로 야훼께 드린 제사
  - 혼합주의적 또는 우상숭배적 제의
  rationale: 히브리어는 산당에서 제사하고 향을 피웠다고만 말하며, 예배 대상은 명시하지 않습니다. 따라서 본문이 유지하는 긴장을 번역문에서도 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
