  to: 그때 그 영[a]이 나아와 야훼 앞에 서서 말했습니다. “제가 그를 유혹하겠습니다[b].” 야훼께서 그에게 “어떤 방법으로 하겠습니까?” 하고 말씀하셨습니다.
