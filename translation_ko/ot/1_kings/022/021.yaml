id: 1KI.22.21
reference: 1 Kings 22:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/ר֗וּחַ וַֽ/יַּעֲמֹד֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יֹּ֖אמֶר אֲנִ֣י אֲפַתֶּ֑/נּוּ וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו בַּ/מָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/021.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him[b], ‘By what means?’
  footnotes:
  - marker: a
    text: Or 'a spirit.' The Hebrew has 'the spirit,' likely referring to a specific spirit-being in the heavenly council, not necessarily the Holy Spirit.
    reason: alternative_reading
  - marker: b
    text: Or 'I will persuade him' or 'I will deceive him.' The verb can denote enticement or persuasion; the exact method is clarified in the following verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그 영[a]이 나아와 야훼 앞에 서서 말했습니다. “제가 그를 유혹하겠습니다[b].” 야훼께서 그에게 “어떤 방법으로 하겠습니까?” 하고 말씀하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 영’. 히브리어에는 정관사가 붙은 ‘그 영’으로 되어 있으며, 하늘의 회의에 있는 특정한 영적 존재를 가리킬 가능성이 큽니다. 이를 성령으로 단정할 필요는 없습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘제가 그를 설득하겠습니다’ 또는 ‘제가 그를 속이겠습니다’. 이 동사는 유혹하거나 꾀거나 설득한다는 뜻을 가질 수 있으며, 구체적인 방식은 다음 절에서 밝혀집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  english_pob_choice: the spirit
  chosen_korean: 그 영
  alternatives_korean:
  - 그 영
  - 한 영
  - 성령
  lexicon: HALOT
  rationale: 문맥상 하늘 회의에서 나아와 서는 특정한 영적 존재를 가리키므로, 영어 POB의 ‘the spirit’에 맞춰 특정성을 살리되 성령으로 오해될 표현은 피했습니다.
- source_word: וַיֵּצֵא
  english_pob_choice: came forward
  chosen_korean: 나아가
  alternatives_korean:
  - 나갔습니다
  - 나와서
  - 앞으로 나와
  lexicon: HALOT
  rationale: 단순한 이동보다 회의 장면에서 발언을 위해 앞으로 나서는 뉘앙스를 살려 ‘나아가’로 옮겼습니다.
- source_word: אֲפַתֶּנּוּ
  english_pob_choice: I will entice him
  chosen_korean: 제가 그를 유혹하겠습니다
  alternatives_korean:
  - 제가 그를 꾀하겠습니다
  - 제가 그를 설득하겠습니다
  - 제가 그를 속이겠습니다
  lexicon: HALOT
  rationale: פתה의 유도·꾐의 의미를 살리면서, 다음 절에서 구체화되는 속임수를 미리 확정하지 않기 위해 ‘유혹하다’를 택했습니다.
- source_word: בַּמָּה
  english_pob_choice: By what means?
  chosen_korean: 어떤 방법이냐?
  alternatives_korean:
  - 어떻게 하겠느냐?
  - 무슨 방법이냐?
  - 어떤 방식이냐?
  lexicon: HALOT
  rationale: 하늘 회의의 심문/논의적 분위기에 맞게 수단과 방법을 묻는 표현으로 옮겼습니다.
theological_decisions:
- issue: 하늘 회의의 ‘그 영’이 누구인지
  chosen_reading: 성령으로 특정하지 않고, 문맥이 지시하는 특정한 영적 존재로 남겨 두었습니다.
  alternative_readings:
  - 성령
  - 한 영
  rationale: 히브리어 정관사와 장면의 구체성은 특정 영적 존재를 가리키지만, 본문이 성령이라고 단정할 근거는 없습니다. 번역은 신학적 결론을 앞서지 않고 텍스트가 드러내는 긴장을 보존해야 합니다.
  doctrine_reference: 원문 우선 원칙; 본문 내 신학적 긴장 보존
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명사 표기는 대체어 ‘주’보다 고유명사 ‘야훼’로 드러내는 것이 원문 가시성을 높이며, POB 기본 용례와도 일치합니다.
  doctrine_reference: Tetragrammaton transliteration policy
