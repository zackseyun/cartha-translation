  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ אִם שׁ֤וֹב תָּשׁוּב֙ בְּ/שָׁל֔וֹם לֹֽא דִבֶּ֥ר יְהוָ֖ה בִּ֑/י וַ/יֹּ֕אמֶר שִׁמְע֖וּ עַמִּ֥ים כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/028.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” And he said, “Hear[b], all you peoples!”
  footnotes:
  - marker: a
    text: Or, “the LORD has not spoken through me.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “all you peoples,” using the plural form, a public summons addressed broadly rather than to one group alone.
    reason: cultural_note
translation:
  language: ko
  text: 미가야가 말했습니다. 「만일 네가 참으로 평안히 돌아온다면, 야훼께서 내 입을 통해 말씀하신 것이 아닙니다.」 그리고 그가 말했습니다. 「들으십시오, 모든 백성들아!」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “야훼께서 내를 통해 말씀하신 것이 아닙니다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘모든 백성들’로 되어 있어, 한 집단만이 아니라 넓은 공개 청중을 향한 부름입니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִיכָיְהוּ
  english_pob_choice: Micaiah
  chosen_korean: 미가야
  alternatives_korean:
  - 미카야
  lexicon: 외래어 표기 관행
  rationale: 예언자 이름은 널리 통용되는 성경식 표기인 ‘미가야’를 따랐습니다.
- source_word: אִם שׁוֹב תָּשׁוּב
  english_pob_choice: If you indeed return
  chosen_korean: 만일 네가 참으로 돌아온다면
  alternatives_korean:
  - 만일 네가 반드시 돌아온다면
  - 만일 네가 돌아오기라도 한다면
  lexicon: HALOT
  rationale: אִם + 부정사절 + 동사의 강조를 ‘참으로’로 자연스럽게 살려, 조건의 확실성 강조를 유지했습니다.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  english_pob_choice: Yahweh has not spoken by me
  chosen_korean: 야훼께서 내 입을 통해 말씀하신 것이 아닙니다
  alternatives_korean:
  - 야훼께서 나를 통해 말씀하지 않으셨습니다
  - 야훼께서 내게 말씀하신 것이 아닙니다
  lexicon: HALOT
  rationale: 예언자 매개를 뜻하는 בְּ־ 구문을 ‘내 입을 통해’로 옮겨, 단순한 수신이 아니라 대언의 통로라는 점을 드러냈습니다.
- source_word: שִׁמְעוּ עַמִּים כֻּלָּם
  english_pob_choice: Hear, all you peoples!
  chosen_korean: 들으십시오, 모든 백성들아!
  alternatives_korean:
  - 들으십시오, 모든 민족들아!
  - 들으라, 모든 백성들아!
  lexicon: HALOT
  rationale: 복수형 ‘peoples’를 살리되, 한국어에서는 자연스러운 호격으로 ‘모든 백성들아’를 택했습니다.
theological_decisions:
- issue: 야훼의 직접 발화와 예언자 매개 표현
  chosen_reading: ‘야훼께서 내 입을 통해 말씀하신 것이 아닙니다’로 번역해, 예언자가 자기 권위가 아니라 하나님의 발화 매개임을 분명히 했습니다.
  alternative_readings:
  - 야훼께서 내게 말씀하신 것이 아닙니다
  - 야훼께서 나를 통해 말씀하지 않으셨습니다
  rationale: 히브리어 전치사 בִּי/בְּ는 예언자적 ‘통해’의 의미를 가질 수 있으므로, 발화 주체와 매개성을 함께 보존하는 표현이 가장 정확합니다.
  doctrine_reference: 예언자적 대언 이해, 본문 문법(בְּ)
