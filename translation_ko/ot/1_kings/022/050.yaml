source:
  edition: WLC
  text: אָ֠ז אָמַ֞ר אֲחַזְיָ֤הוּ בֶן אַחְאָב֙ אֶל יְה֣וֹשָׁפָ֔ט יֵלְכ֧וּ עֲבָדַ֛/י עִם עֲבָדֶ֖י/ךָ בָּ/אֳנִיּ֑וֹת וְ/לֹ֥א אָבָ֖ה יְהוֹשָׁפָֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/050.yaml
  text: Then Ahaziah son of Ahab said to Jehoshaphat[b][a], “Let my servants go with your servants in the ships,” but Jehoshaphat was not willing.
  footnotes:
  - marker: a
    text: Or, “on the ships.” The Hebrew preposition can be rendered either way in English with seafaring contexts.
    reason: lexical_alternative
  - marker: b
    text: Or, “but Jehoshaphat refused.” The Hebrew more literally says he “was not willing.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아합의 아들 아하시야가 여호사밧에게 말했습니다. 「저의 종들과 당신의 종들이 함께 배를 타고 가게 하십시오.」 그러나 여호사밧은 원하지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사는 해상 문맥에서 ‘배 안에’와 ‘배 위에’로 모두 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אָבָה는 더 직역하면 ‘원하지 않았다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그러자
  alternatives_korean:
  - 그때
  - 그리하여
  lexicon: HALOT
  rationale: 서사 흐름을 이어 주는 시간·결과 연결어로, 현대 한국어에서 자연스럽고 직전 사건에 이어지는 느낌을 살립니다.
- source_word: יֵלְכ֧וּ
  english_pob_choice: Let ... go
  chosen_korean: 가게 하십시오
  alternatives_korean:
  - 가게 하소서
  - 가게 하십시오
  lexicon: HALOT
  rationale: 직접 제안/요청의 뉘앙스를 한국어 명령형보다 공손한 요청형으로 옮겨, 왕들 사이의 대화라는 문맥을 자연스럽게 반영합니다.
- source_word: עֲבָדַי / עֲבָדֶיךָ
  english_pob_choice: my servants / your servants
  chosen_korean: 저의 종들 / 당신의 종들
  alternatives_korean:
  - 제 종들 / 당신의 종들
  - 저의 종들 / 임금님의 종들
  lexicon: HALOT
  rationale: 여기서는 왕의 수행원을 가리키므로 기본값인 ‘종’을 쓰되, 공적 호칭 맥락을 살려 1인칭은 ‘저의’로, 상대는 ‘당신의’로 대응시켜 평행 구조를 유지합니다.
- source_word: בָּאֳנִיּוֹת
  english_pob_choice: in the ships
  chosen_korean: 배를 타고
  alternatives_korean:
  - 배 안에서
  - 배에
  lexicon: HALOT
  rationale: 히브리어 전치사의 장소감은 살리되, 한국어에서는 ‘배를 타고’가 해상 이동의 의도를 가장 자연스럽게 드러냅니다.
- source_word: וְלֹא אָבָה
  english_pob_choice: but ... was not willing
  chosen_korean: 그러나 ... 원하지 않았습니다
  alternatives_korean:
  - 그러나 ... 내키지 않았습니다
  - 그러나 ... 원하지 않았습니다
  lexicon: HALOT
  rationale: אָבָה의 핵심인 ‘마음에 두고 동의하다/원하다’의 의미를 살려, 강한 ‘거절하다’보다 약한 ‘원하지 않았다’로 옮겼습니다.
theological_decisions:
- issue: 여호사밧의 태도 표현
  chosen_reading: ‘원하지 않았습니다’로 옮겨, 본문의 동의 거부가 의지의 문제로 나타나도록 했습니다.
  alternative_readings:
  - ‘거절했습니다’
  - ‘동의하지 않았습니다’
  rationale: 히브리어 אָבָה는 단순한 외적 거절보다 내적 의사 불일치를 뜻하므로, 서사적·심리적 뉘앙스를 보존하는 번역이 더 적합합니다.
  doctrine_reference: 본문의 서술 의도와 인물의 의사 표시에 관한 번역 원칙
- issue: 왕의 직접화법의 공손도
  chosen_reading: 아하시야의 발화를 정중한 요청형으로 처리했습니다.
  alternative_readings:
  - 직설적 명령형
  - 완곡한 제안형
  rationale: 히브리어의 jussive 요청은 상하관계가 있는 대화에서도 단순 명령보다 요청에 가깝게 들리며, 한국어 합쇼체가 이를 가장 잘 전달합니다.
  doctrine_reference: 서사 대화의 화행과 존대법
