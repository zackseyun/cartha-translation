  lexicon: HALOT
  rationale: 즉위 시점을 가리키는 왕실 연대 공식이므로, 자연스러운 현대 한국어로 ‘왕위에 오를 때’라고 옮겼습니다.
- source_word: מָלַךְ
  english_pob_choice: he reigned
  chosen_korean: 통치했습니다
  alternatives_korean:
  - 다스렸습니다
  - 재위했습니다
  lexicon: HALOT
  rationale: 재위 기간을 말하는 공식에서 ‘통치했습니다’가 현대적이면서도 의미를 분명히 드러냅니다.
- source_word: עֲזוּבָה
  english_pob_choice: Azubah
  chosen_korean: 아수바
  alternatives_korean:
  - 아주바
  - 아주바하
  lexicon: HALOT
  rationale: 여기서는 어머니의 이름을 음역해야 하므로, 히브리어 발음을 바탕으로 한국어 음역형을 사용했습니다.
