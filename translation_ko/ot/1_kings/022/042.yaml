  yaml_path: translation/ot/1_kings/022/042.yaml
  text: Jehoshaphat was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: ko
  text: 여호사밧은 왕위에 오를 때 서른다섯 살이었고, 예루살렘에서 스물다섯 해 동안 통치했습니다. 그의 어머니 이름은 아수바였으며, 실히의 딸이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוֹשָׁפָט
  english_pob_choice: Jehoshaphat
  chosen_korean: 여호사밧
  alternatives_korean:
  - 여호샤팟
  - 여호사팟
  lexicon: 표준 성경 인명 관용
  rationale: 히브리어 고유명사를 한국어 성경 관용형으로 옮겼습니다.
- source_word: בְּמָלְכֹו
  english_pob_choice: when he began to reign
  chosen_korean: 왕위에 오를 때
  alternatives_korean:
