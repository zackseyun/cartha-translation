  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִיאִים֮ כְּ/אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הַ/אֵלֵ֞ךְ עַל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן אֲדֹנָ֖/י בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/006.yaml
  text: Then the king of Israel gathered the prophets[a], about four hundred men, and said to them, “Should I go against Ramoth-gilead for battle, or should I refrain?” And they said, “Go up, and the Lord will give it into the hand of the king.”
  footnotes:
  - marker: a
    text: Or, 'Go up, and my lord will give it into the hand of the king.' The Hebrew אֲדֹנָי can in some contexts be read as 'my lord,' though here it is more likely a divine title, 'the Lord.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 이스라엘 왕이 예언자 약 사백 명을 모아 그들에게 말했습니다. “내가 길르앗 라못을 치러 올라가야 하겠습니까, 아니면 그만두어야 하겠습니까?” 그들이 말했습니다. “올라가십시오. 주님[a]께서 왕의 손에 넘겨주실 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘올라가십시오. 내 주인이 왕의 손에 넘겨주실 것입니다.’ 히브리어 אֲדֹנָי는 어떤 문맥에서는 ‘내 주인’으로도 읽을 수 있지만, 여기서는 ‘주님’이라는 신적 호칭으로 보는 편이 더 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  english_pob_choice: gathered
  chosen_korean: 모으니
  alternatives_korean:
  - 모았습니다
  - 소집하니
  - 불러 모으니
  lexicon: HALOT
  rationale: 왕이 예언자들을 불러 한자리에 모으는 동작을 자연스러운 현대 문체로 살리되, 단순한 행정적 ‘소집’보다 덜 강한 ‘모으다’를 택했습니다.
- source_word: הַנְּבִיאִים
  english_pob_choice: the prophets
  chosen_korean: 예언자들
  alternatives_korean:
  - 선지자들
  - 예언자들
  lexicon: HALOT
  rationale: POB의 source-direct 성향에 맞춰 전통교회식 ‘선지자’보다 히브리어 נביאים의 직역에 가까운 ‘예언자들’을 사용했습니다.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  english_pob_choice: about four hundred men
  chosen_korean: 거의 사백 명
  alternatives_korean:
  - 약 사백 명
  - 사백 명 남짓
  lexicon: HALOT
  rationale: 접두 כ의 대략성을 한국어로 간결하게 반영했습니다. 인원수 뒤의 ‘사람/명’은 한국어에서 이미 사람 수를 가리키므로 ‘명’만으로 충분합니다.
- source_word: עֲלֵה
  english_pob_choice: Go up
  chosen_korean: 올라가십시오
  alternatives_korean:
  - 올라가라
  - 올라가십시오
  - 진군하십시오
  lexicon: HALOT
  rationale: 히브리어의 전형적인 군사 관용구를 살리면서, 왕에게 권하는 예언자들의 말투를 합쇼체로 자연스럽게 옮겼습니다.
- source_word: וְיִתֵּן אֲדֹנָי בְּיַד הַמֶּלֶךְ
  english_pob_choice: and the Lord will give it into the hand of the king
  chosen_korean: 주님께서 왕의 손에 넘겨주실 것입니다
  alternatives_korean:
  - 주님께서 왕의 손에 주실 것입니다
  - 주님께서 왕에게 넘겨주실 것입니다
  lexicon: HALOT
  rationale: ‘손에’라는 히브리어 관용구를 ‘손에 넘겨주다’로 풀어 소유/권세의 전달 의미를 보존했습니다. POB의 ‘the Lord’를 따라 ‘주님’으로 옮겼습니다.
theological_decisions:
- issue: אֲדֹנָי의 지시 대상
  chosen_reading: 여기서는 예언자들의 신탁 안에서 ‘주님’으로 읽었습니다.
  alternative_readings:
  - ‘내 주인’으로 읽을 수 있음
  rationale: 문맥상 예언자들의 응답은 신적 확언 형식이며, ‘왕의 손에’라는 구절 때문에 ‘my lord’ 가능성이 남아 있더라도 본문 전체의 가장 가능성 높은 독법은 신적 호칭입니다. 따라서 본문은 ‘주님’으로 두고 대안 독법은 각주로 보존했습니다.
  doctrine_reference: 문맥상 주어 판정과 희미한 이중독법 보존
- issue: 왕에게 하는 응답의 화법
  chosen_reading: 예언자들의 응답은 공적 조언이면서도 왕에게 직접 권하는 말이므로 ‘올라가십시오’로 처리했습니다.
  alternative_readings:
  - 중립적 평서형 ‘올라가라’
  - 더 의례적인 ‘올라가옵소서’
  rationale: 히브리어 명령형의 직접성을 살리되, 현대 한국어 성경 문체의 공적 발화에 맞춰 합쇼체를 선택했습니다. 과도하게 고어체로 만들지 않기 위해 ‘올라가옵소서’는 피했습니다.
  doctrine_reference: 담화 화행의 존중 표현
