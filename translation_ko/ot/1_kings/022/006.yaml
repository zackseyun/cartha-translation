    rationale: ‘예언자들을 모으니, 거의 사백 명이었습니다’는 수량이 예언자들을 수식한다는 관계를 부자연스럽게 끊습니다. ‘예언자 약 사백 명을 모아’가 כְּאַרְבַּע מֵאוֹת אִישׁ를 직접 반영합니다.
