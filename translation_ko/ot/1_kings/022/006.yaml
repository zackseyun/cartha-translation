revisions:
- from: 그때 이스라엘 왕이 예언자들[a]을 모으니, 거의 사백 명이었습니다. 그가 그들에게 말했습니다. “내가 길르앗 라못으로 올라가서 전쟁해야 하겠습니까, 아니면 그만두어야 하겠습니까?” 그들이 말했습니다. “올라가십시오. 주님께서 왕의 손에 넘겨주실 것입니다.”
  to: 그때 이스라엘 왕이 예언자 약 사백 명을 모아 그들에게 말했습니다. “내가 길르앗 라못을 치러 올라가야 하겠습니까, 아니면 그만두어야 하겠습니까?” 그들이 말했습니다. “올라가십시오. 주님[a]께서 왕의 손에 넘겨주실 것입니다.”
  rationale: 수량구를 ‘예언자 약 사백 명’으로 결속하여 원문의 동격 관계와 근사성을 분명히 했습니다. 군사 행동은 ‘길르앗 라못을 치러 올라가다’로 옮겨 원문의 대상과 목적을 살렸습니다. 아도나이의 대안 독법은 본문에서 가장 가능성 높은 ‘주님’을 유지하되 각주로 보존했고, 그 각주 표지를 해당 낱말로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:52:10Z'
