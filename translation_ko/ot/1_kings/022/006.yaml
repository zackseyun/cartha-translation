    rationale: ‘길르앗 라못으로 올라가서 전쟁하다’도 뜻은 통하지만, עַל רָמֹת גִּלְעָד לַמִּלְחָמָה의 공격 대상과 군사 목적을 ‘길르앗 라못을 치러 올라가다’로 옮기는 것이 더 정확하고 자연스럽습니다.
