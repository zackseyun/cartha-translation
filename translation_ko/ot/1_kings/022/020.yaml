  text: And Yahweh said[a], “Who will entice Ahab, so that he may go up and fall at Ramoth-gilead?” And this one said one thing, and that one said another.
  footnotes:
  - marker: a
    text: Or “persuade”; the verb can also carry the sense “deceive,” depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 말씀하셨습니다[a]. "누가 아합을 꾀어 그가 올라가서 길르앗 라못에서 쓰러지게 하겠느냐?" 그러자 이쪽은 이렇게 말하고, 저쪽은 저렇게 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “설득하다”; 이 동사는 문맥에 따라 “속이다”의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유명사 יְהוָה는 전통적 대체칭호보다 음역인 야훼로 옮겨 원문이 드러내는 신적 이름을 보존했습니다.
- source_word: יְפַתֶּה
  english_pob_choice: will entice
  chosen_korean: 꾀어
  alternatives_korean:
  - 설득하여
  - 유혹하여
  - 속여
  lexicon: HALOT
  rationale: 이 동사는 문맥에 따라 설득, 유혹, 속임의 뉘앙스를 가질 수 있으므로, 한국어에서는 그 긴장을 살리는 중립적 동사 꾀어를 택했습니다.
- source_word: וְיִפֹּל
  english_pob_choice: and fall
  chosen_korean: 쓰러지게 하겠느냐
  alternatives_korean:
  - 떨어지게 하겠느냐
  - 죽게 하겠느냐
  - 패배하게 하겠느냐
  lexicon: HALOT
  rationale: 히브리어는 기본동사 נפל(떨어지다/넘어지다)을 쓰므로, 전투적 함의를 직접 해석어로 풀기보다 결과를 드러내는 쓰러지게 하겠느냐로 옮겼습니다.
- source_word: בְּרָמֹת גִּלְעָד
  english_pob_choice: at Ramoth-gilead
  chosen_korean: 길르앗 라못에서
  alternatives_korean:
  - 라못 길르앗에서
  - 길르앗 라못에
  - 길르앗 라못에서
  lexicon: HALOT
  rationale: 지명은 현대 한국어 음역 관습에 따라 길르앗 라못으로 옮기고, 전투 장소를 나타내는 전치사는 에서/에서의 자연스러운 용법으로 처리했습니다.
- source_word: זֶה ... וְזֶה
  english_pob_choice: this one ... and that one
  chosen_korean: 이쪽은 ... 저쪽은 ...
  alternatives_korean:
  - 이 사람은 ... 저 사람은 ...
  - 이 이는 ... 저 이는 ...
  - 이 하나는 ... 저 하나는 ...
  lexicon: HALOT
  rationale: 천상 회의의 발화자들을 가리키는 대조적 지시를 한국어에서 자연스럽게 살리기 위해, 반복된 지시대명사를 이쪽/저쪽으로 옮겼습니다.
theological_decisions:
- issue: 야훼께서 아합의 패망을 묻는 방식과 신적 주도성
  chosen_reading: 직접적인 질문 형식을 유지해, 야훼께서 아합을 꾀어 올라가게 하고 쓰러지게 하려는 천상 회의의 긴장을 완화하지 않았습니다.
  alternative_readings:
  - 누가 아합을 움직이겠느냐처럼 완화하는 번역
  - 아합이 패배하게 될 방법을 묻는 식의 의역
  rationale: 본문은 야훼의 주도적 질문을 분명히 제시하므로, 신적 주권과 심판의 긴장을 해소하지 않고 그대로 드러내는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
