  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל הַ/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/012.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
  footnotes:
  - marker: a
    text: Or “and prosper.”
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 예언자들이 한결같이 예언하며 이렇게 말하고 있었습니다. “라못 길앗으로 올라가 승리하십시오[a]. 야훼께서 왕의 손에 넘기실 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “형통하십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  english_pob_choice: And all
  chosen_korean: 모든
  alternatives_korean:
  - 그리고 모든
  - 온
  lexicon: HALOT
  rationale: 집합 주어를 자연스럽게 살리되, 히브리어의 포괄성을 유지하기 위해 ‘모든’을 택했습니다.
- source_word: הַ/נְּבִאִים
  english_pob_choice: the prophets
  chosen_korean: 예언자들이
  alternatives_korean:
  - 선지자들이
  - 예언자들
  lexicon: HALOT
  rationale: 본문의 נביאים는 표준적으로 예언자를 가리키며, 현대 한국어에서는 ‘예언자’가 직역에 가깝고 중립적입니다.
- source_word: נִבְּאִים כֵּן
  english_pob_choice: were prophesying thus
  chosen_korean: 이처럼 예언하며
  alternatives_korean:
  - 이와 같이 예언하며
  - 그렇게 예언하며
  lexicon: HALOT
  rationale: פּ̄ע 참여형의 진행성을 살리면서 כֵּן의 방식 부사를 ‘이처럼’으로 옮겨, 예언 내용이 모두 같은 방향이었다는 점을 드러냈습니다.
- source_word: עֲלֵה
  english_pob_choice: Go up
  chosen_korean: 올라가
  alternatives_korean:
  - 공격하라
  - 행군하라
  lexicon: HALOT
  rationale: עלה의 기본 의미를 보존해 군사적 맥락을 독자에게 직접 느끼게 하되, 문맥상 명령형으로 자연스럽게 처리했습니다.
- source_word: וְ/הַצְלַח
  english_pob_choice: and succeed
  chosen_korean: 승리하십시오
  alternatives_korean:
  - 성공하십시오
  - 형통하십시오
  lexicon: HALOT
  rationale: 여기서는 단순한 ‘성공’보다 전쟁 맥락의 결과를 가리키는 ‘승리’가 원문의 힘을 더 잘 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와명 יהוה를 관례에 따라 ‘야훼’로 음역해 고유신명성을 보존했습니다.
- source_word: בְּ/יַד הַ/מֶּלֶךְ
  english_pob_choice: into the hand of the king
  chosen_korean: 왕의 손에 넘기실 것입니다
  alternatives_korean:
  - 왕의 손에 주실 것입니다
  - 왕에게 넘겨주실 것입니다
  lexicon: HALOT
  rationale: ‘손’은 히브리어 관용구로 권한·통제권을 뜻하므로, 한국어에서는 의미를 풀어 ‘넘기실 것입니다’로 옮겨 자연스럽게 전달했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기적 고유명사 יהוה를 직접 사용하므로, 주칭으로 치환하지 않고 고유명으로 드러내는 것이 स्रोत의 구분을 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
