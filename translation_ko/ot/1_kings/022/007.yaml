revisions:
- from: 그러나 여호사밧이 말했습니다. 「아직도 여기 야훼께 속한 예언자가 한 사람 더 있지 않습니까? 우리가 그에게 물어보게 하십시오.」[a]
  to: 그러나 여호사밧이 말했습니다. 「아직도 여기 야훼의 예언자가 있지 않습니까?[a] 그에게 물어봅시다.」
  rationale: The revision preserves the Hebrew’s ‘still/yet’ in the main text, places the contextually possible ‘another’ reading in the footnote, uses idiomatic Korean terminology for a prophet of Yahweh, and renders the first-person plural cohortative with a natural inclusive proposal.
