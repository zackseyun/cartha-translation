translation:
  language: ko
  text: 그러나 여호사밧이 말했습니다. 「아직도 여기 야훼께 속한 예언자가 한 사람 더 있지 않습니까? 우리가 그에게 물어보게 하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아직도 여기 야훼의 다른 예언자가 있지 않습니까? 우리가 그에게 물어보게 하십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוֹשָׁפָט
  english_pob_choice: But Jehoshaphat said
  chosen_korean: 그러나 여호사밧이 말했습니다
  alternatives_korean:
  - 그리고 여호사밧이 말했습니다
  - 그때 여호사밧이 말했습니다
  lexicon: HALOT
  rationale: וַיֹּאמֶר의 서술 진행은 살리되, 앞선 거짓 예언자들의 분위기와 대비되는 반응이므로 ‘그러나’로 옮겨 담았습니다.
- source_word: נָבִיא לַיהוָה
  english_pob_choice: a prophet of Yahweh
  chosen_korean: 야훼께 속한 예언자
  alternatives_korean:
  - 야훼의 예언자
  - 여호와의 예언자
  lexicon: HALOT
  rationale: לַיהוָה는 단순 소유보다 소속·관계의 뉘앙스가 강하므로, ‘예언자’와 결합할 때 기능적으로 ‘야훼께 속한’이 가장 잘 드러냅니다.
- source_word: עוֹד
  english_pob_choice: still
  chosen_korean: 아직도
  alternatives_korean:
  - 여전히
  - 또
  lexicon: HALOT
  rationale: 이미 여러 예언자들이 있는 상황에서 ‘아직도’가 남아 있는가를 묻는 뉘앙스를 자연스럽게 살립니다.
- source_word: וְנִדְרְשָׁה מֵאוֹתוֹ
  english_pob_choice: that we may inquire of him
  chosen_korean: 우리가 그에게 물어보게 하십시오
  alternatives_korean:
  - 우리가 그에게 문의하게 하십시오
  - 우리가 그를 통해 묻게 하십시오
  lexicon: HALOT
  rationale: דרשׁ은 단순 정보 확인보다 신적 응답을 구하는 ‘문의하다/물어보다’의 성격이 있으나, 여기서는 예언자에게 직접 묻는 요청으로 자연스럽게 옮겼습니다.
theological_decisions:
