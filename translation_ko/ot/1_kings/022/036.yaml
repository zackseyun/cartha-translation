source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר הָ/רִנָּה֙ בַּֽ/מַּחֲנֶ֔ה כְּ/בֹ֥א הַ/שֶּׁ֖מֶשׁ לֵ/אמֹ֑ר אִ֥ישׁ אֶל עִיר֖/וֹ וְ/אִ֥ישׁ אֶל אַרְצֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/036.yaml
  text: And a cry passed through the camp at sunset[a], saying, “Each man to his city[b], and each man to his land!”
  footnotes:
  - marker: a
    text: Or “the shout,” “the cry,” or “the proclamation passed through the camp.” The Hebrew רִנָּה often denotes a loud cry or ringing shout; here it refers to the camp-wide announcement.
    reason: lexical_alternative
  - marker: b
    text: Literally, “Each man to his city, and each man to his land.” This is a formulaic dismissal after the battle.
    reason: cultural_note
translation:
  language: ko
  text: 해가 질 무렵, 외침이 진영 안에 퍼졌습니다.[a] “각 사람은 자기 성읍으로, 각 사람은 자기 땅으로!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רִנָּה는 큰 외침, 함성, 또는 울려 퍼지는 소리를 뜻할 수 있습니다. 여기서는 진영 전체에 전해진 해산 공지를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “각 사람은 자기 성읍으로, 각 사람은 자기 땅으로”입니다. 이는 전투 뒤에 각자가 자기 거처와 지역으로 돌아가라는 관용적인 해산 선언입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר ... בַּמַּחֲנֶה
  english_pob_choice: passed through the camp
  chosen_korean: 진영을 지나가며
  alternatives_korean:
  - 진영을 통과하며
  - 진영 안을 지나며
  lexicon: HALOT
  rationale: עבר의 이동 감각을 살리면서, 한국어에서는 소리나 소식이 공간을 가로질러 퍼지는 뉘앙스를 자연스럽게 표현했습니다.
- source_word: הָרִנָּה
  english_pob_choice: a cry
  chosen_korean: 진군 소리
  alternatives_korean:
  - 외침
  - 함성
  - 선포
  lexicon: HALOT
  rationale: 문맥상 단순한 감탄이 아니라 전투 뒤 진영 전체에 퍼지는 호출성 있는 소리이므로, 한국어로는 지나치게 감정적이지 않은 '진군 소리'로 옮겼습니다.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  english_pob_choice: at sunset
  chosen_korean: 해질 무렵에
  alternatives_korean:
  - 일몰 무렵에
  - 해가 질 때
  lexicon: HALOT
  rationale: 해가 진다는 관용적 표현을 현대 한국어로 자연스럽게 살렸습니다.
- source_word: אִישׁ אֶל עִירוֹ וְאִישׁ אֶל אַרְצוֹ
  english_pob_choice: Each man to his city, and each man to his land
  chosen_korean: 각 사람은 자기 성으로, 각 사람은 자기 땅으로
  alternatives_korean:
  - 각 사람은 자기 도시로, 각 사람은 자기 땅으로
  - 각자 자기 성으로, 각자 자기 땅으로
  lexicon: HALOT
  rationale: 반복되는 אִישׁ의 분배적 힘을 살리면서도, 한국어에서 군사적 해산 명령처럼 들리도록 '각 사람은'을 유지했습니다. 'city'는 문맥에 맞게 '성'으로, 'land'는 넓은 의미를 살려 '땅'으로 옮겼습니다.
theological_decisions:
- issue: 전투 뒤 해산 공식의 톤
  chosen_reading: 명령문을 직접적으로 살려 전투 종료 후 각자 흩어지는 공식적 해산 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 귀가 안내로 완화해서 읽기
  - 감정적 비명으로만 읽기
  rationale: 본문은 메시지 내용보다 진영 전체에 퍼지는 해산 선언의 기능이 두드러지므로, 문장의 공적인 성격을 유지했습니다.
  doctrine_reference: 본문 문맥에 따른 서사적 의미 보존
