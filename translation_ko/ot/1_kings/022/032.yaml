id: 1KI.22.32
reference: 1 Kings 22:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ אַ֣ךְ מֶֽלֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֻ֥רוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֖ק יְהוֹשָׁפָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/032.yaml
  text: And it happened[a], when the commanders of the chariots saw Jehoshaphat, that they said, “Surely he is the king of Israel.” So they turned aside against him to fight[b], but Jehoshaphat cried out.
  footnotes:
  - marker: a
    text: Or “they turned against him to attack.” The Hebrew verb can denote turning toward or against someone in order to engage in battle.
    reason: lexical_alternative
  - marker: b
    text: Or 'they turned aside against him'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그것은, 전차 대장들이 여호사밧을 보았을 때, 그들이 말했습니다. “확실히 그는 이스라엘의 왕이다.” 그래서 그들은 그를 향해 돌아서서 싸우려 했으나, 여호사밧이 부르짖었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 그것은
  alternatives_korean:
  - 그리고 그 일이 일어났습니다
  - 그때 그런 일이 있었습니다
  lexicon: WLC
  rationale: 서사 도입의 wayyiqtol을 살리되, 한국어에서 지나치게 관용적인 ‘일어났습니다’보다 원문의 진행감을 유지했습니다.
- source_word: שָׂרֵי הָרֶכֶב
  english_pob_choice: the commanders of the chariots
  chosen_korean: 전차 대장들
  alternatives_korean:
  - 전차 지휘관들
  - 전차대의 장군들
  - 전차 군대의 지휘관들
  lexicon: WLC
  rationale: שָׂרֵי는 군사 지휘자를 가리키므로 ‘대장들’이 자연스럽고, הָרֶכֶב은 전차 부대를 뜻해 ‘전차’로 옮겼습니다.
- source_word: אַךְ מֶלֶךְ יִשְׂרָאֵל הוּא
  english_pob_choice: Surely he is the king of Israel
  chosen_korean: 확실히 그는 이스라엘의 왕이다
  alternatives_korean:
  - 분명 이스라엘 왕이다
  - 틀림없이 이스라엘의 왕이다
  lexicon: WLC
  rationale: אַךְ의 확신을 ‘확실히’로 살렸고, 지칭 대상이 여호사밧이라는 오인 상황을 반영해 ‘그는’으로 자연스럽게 옮겼습니다.
- source_word: וַיָּסֻרוּ עָלָיו לְהִלָּחֵם
  english_pob_choice: they turned aside against him to fight
  chosen_korean: 그를 향해 돌아서서 싸우려 했으나
  alternatives_korean:
  - 그를 향해 돌아서서 싸우려고 했으나
  - 그에게로 돌아서서 싸우려 했으나
  - 그를 향해 방향을 틀어 싸우려 했으나
  lexicon: WLC
  rationale: סור עם עַל의 ‘돌아서다/향하다’와 전투 의도를 함께 담기 위해 ‘그를 향해 돌아서서’로 옮기고, לְהִלָּחֵם은 상황상 ‘싸우려 했으나’로 자연화했습니다.
- source_word: וַיִּזְעַק
  english_pob_choice: cried out
  chosen_korean: 부르짖었습니다
  alternatives_korean:
  - 소리쳤습니다
  - 외쳤습니다
  - 큰 소리로 부르짖었습니다
  lexicon: WLC
  rationale: זעק의 긴박한 비명/부르짖음을 살리기 위해 단순한 ‘외치다’보다 강한 ‘부르짖다’를 선택했습니다.
theological_decisions:
- issue: 전차 지휘관들이 여호사밧을 왕으로 오인하는 장면의 표현
  chosen_reading: 본문의 서술을 바꾸지 않고, 그들의 오인을 드러내는 직접화법을 그대로 옮겼습니다.
  alternative_readings:
  - ‘그는 이스라엘 왕이다’처럼 단정형으로 완화하는 번역
  - 오인임을 미리 해설하는 번역
  rationale: 사건의 긴장감은 오인에서 나오므로, 본문이 보여주는 인식 오류를 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 서사 문맥 보존
- issue: 전투 동사의 강도
  chosen_reading: ‘싸우려 했으나’로 옮겨, 단순한 이동이 아니라 교전 의도를 나타냈습니다.
  alternative_readings:
  - ‘공격하려 했다’
  - ‘전투를 벌이려 했다’
  rationale: 히브리어 לְהִלָּחֵם은 실제 교전의 의도를 가리키므로, 맥락상 충분히 강한 한국어로 옮겼습니다.
  doctrine_reference: 어휘-문맥 적합성
