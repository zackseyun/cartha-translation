source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י אַחְאָ֜ב וְ/כָל אֲשֶׁ֣ר עָשָׂ֗ה וּ/בֵ֤ית הַ/שֵּׁן֙ אֲשֶׁ֣ר בָּנָ֔ה וְ/כָל הֶ/עָרִ֖ים אֲשֶׁ֣ר בָּנָ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/039.yaml
  text: Now the rest of the acts of Ahab[a], and all that he did, and the ivory house that he built[b], and all the cities that he built—are they not written in the Book of the Chronicles of the Kings of Israel?
  footnotes:
  - marker: a
    text: Or 'the house of ivory.' The phrase likely refers to a royal building decorated with ivory rather than a structure made entirely of ivory.
    reason: lexical_alternative
  - marker: b
    text: '''The Book of the Chronicles of the Kings of Israel'' refers to a royal record source cited in Kings, not necessarily to the biblical book of Chronicles.'
    reason: cross_reference
translation:
  language: ko
  text: 아합의 남은 행적과 그가 행한 모든 일, 그리고 그가 지은 상아 집[a]과 그가 지은 모든 성읍들—이것들이 이스라엘 왕들의 역대기[b]에 기록되어 있지 않습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘상아 집’은 집 전체가 상아로 만들어졌다는 뜻이라기보다, 상아로 장식된 왕실 건물일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 왕들의 역대기’는 열왕기가 인용하는 왕실 기록원을 가리키며, 성경의 정경인 『역대기』와는 동일하지 않을 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אַחְאָב
  english_pob_choice: Now the rest of the acts of Ahab
  chosen_korean: 아합의 남은 행적
  alternatives_korean:
  - 아합의 나머지 행적
  - 아합의 남은 일들
  - 아합의 나머지 사건들
  lexicon: WLC/HALOT
  rationale: 왕의 결산 공식에서 דִּבְרֵי는 단순한 ‘말’이 아니라 기록된 행적을 가리키므로, 이를 ‘행적’으로 옮겨 역사 기록의 뉘앙스를 살렸습니다.
- source_word: בֵּית הַשֵּׁן
  english_pob_choice: the ivory house
  chosen_korean: 상아 집
  alternatives_korean:
  - 상아로 된 집
  - 상아 궁전
  - 상아 저택
  lexicon: HALOT
  rationale: 직역에 가까운 ‘상아 집’을 택해, 구조물 전체가 상아로 된 것인지 장식된 것인지에 대한 해석적 확정을 피했습니다.
- source_word: וְכָל הֶעָרִים אֲשֶׁר בָּנָה
  english_pob_choice: and all the cities that he built
  chosen_korean: 그가 지은 모든 성읍들
  alternatives_korean:
  - 그가 세운 모든 도시들
  - 그가 건설한 모든 성읍들
  lexicon: HALOT
  rationale: עָרִים은 기본적으로 ‘성읍들’이므로, 현대 한국어에서 자연스러운 동시에 원뜻을 보존하는 표현을 사용했습니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  english_pob_choice: the Book of the Chronicles of the Kings of Israel
  chosen_korean: 이스라엘 왕들의 역대기
  alternatives_korean:
  - 이스라엘 왕들의 연대기
  - 이스라엘 왕들의 기록 책
  - 이스라엘 왕들의 사건록
  lexicon: HALOT
  rationale: 후대 정경의 역대기와 동일시하지 않도록 하면서도, 왕실 기록 문서라는 장르를 살려 ‘역대기’로 옮겼습니다.
theological_decisions:
- issue: 수사적 질문 הֲלוֹא의 처리
  chosen_reading: 문장 끝을 질문형으로 유지해, 독자가 이미 알려진 기록을 상기하도록 하는 수사적 질문의 힘을 보존했습니다.
  alternative_readings:
  - 평서문으로 바꾸어 ‘기록되어 있습니다’로 옮김
  - ‘기록되어 있지 않습니까?’ 대신 ‘기록되어 있지 않느냐?’로 낮춤
  rationale: 히브리어 הֲלוֹא는 긍정 답변을 기대하는 수사적 질문이므로, 한국어에서도 반문형을 유지하는 것이 문맥의 기능을 가장 잘 드러냅니다.
  doctrine_reference: 내러티브 수사 보존
