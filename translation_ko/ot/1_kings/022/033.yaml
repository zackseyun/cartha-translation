source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּֽי לֹא מֶ֥לֶךְ יִשְׂרָאֵ֖ל ה֑וּא וַ/יָּשׁ֖וּבוּ מֵ/אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/033.yaml
  text: And it happened[a], when the commanders of the chariots saw that he was not the king of Israel, they turned back from pursuing him.
  footnotes:
  - marker: a
    text: Literally, 'from after him,' a Hebrew idiom meaning they stopped following or chasing him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 전차 부대 지휘관들은 그가 이스라엘 왕이 아닌 것을 보고, 그를 뒤쫓는 일을 그만두고 돌아섰습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그의 뒤에서’입니다. 여기서는 그를 뒤따르거나 추격하는 일을 그만두었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 그것이 일어났습니다
  alternatives_korean:
  - 그리고 그렇게 되었습니다
  - 그리고 일이 일어났습니다
  lexicon: HALOT
  rationale: 히브리어 서술 전환을 자연스러운 현대 한국어로 살리되, 고어적 표현은 피했습니다.
- source_word: שָׂרֵי הָרֶכֶב
  english_pob_choice: the commanders of the chariots
  chosen_korean: 그들
  alternatives_korean:
  - 마병대 지휘관들
  - 전차 부대 지휘관들
  lexicon: HALOT
  rationale: 앞 절에서 이미 주어가 분명하므로 한국어에서는 대명사로 받는 편이 자연스럽고, 군사적 주체는 문맥상 유지됩니다.
- source_word: מֵאַחֲרָיו
  english_pob_choice: from pursuing him
  chosen_korean: 그를 뒤쫓기를 멈추고
  alternatives_korean:
  - 그를 따라가던 것을 멈추고
  - 그의 뒤를 따르기를 그치고
  lexicon: HALOT
  rationale: 직역하면 '그의 뒤에서'이지만, 문맥상 추격을 중단했다는 관용적 의미가 핵심이므로 그 힘을 드러냈습니다.
theological_decisions:
- issue: 추격 중단의 관용구 처리
  chosen_reading: '''그를 뒤쫓기를 멈추고 돌아섰습니다''로 옮겨, 단순한 위치 이동이 아니라 추격의 종료를 분명히 했습니다.'
  alternative_readings:
  - '''그의 뒤에서 돌아섰습니다'''
  - '''그를 따라가다 돌아섰습니다'''
  rationale: 히브리어 מֵאַחֲרָיו는 문자적으로는 '그의 뒤에서/뒤를 따라'지만, 여기서는 추격 행위를 멈춘 뜻이므로 오해 없이 전달하는 것이 중요합니다.
  doctrine_reference: 서술문 번역 원리 및 관용구 처리
