  text: Now the rest of the acts of Jehoshaphat[a], and his might that he showed, and how he fought—are they not written in the Book of the Chronicles of the Kings of Judah?
  footnotes:
  - marker: a
    text: Or, 'and his mighty deeds that he did.' The Hebrew combines 'his might' with 'that he did,' an idiom for demonstrated prowess or valor.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호사밧의 남은 행적과 그가 보인 용맹[a]과 그가 싸운 일은 유다 왕들의 역대기에 기록되어 있지 않습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 행한 능력” 또는 “그의 무훈.” 히브리어는 직역하면 “그가 행한 그의 힘/용맹”이며, 행동으로 드러난 힘이나 용맹을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
