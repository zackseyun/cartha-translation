  yaml_path: translation/ot/1_kings/022/046.yaml
  text: Now the rest of the acts of Jehoshaphat[a], and his might that he showed, and how he fought—are they not written in the Book of the Chronicles of the Kings of Judah?
  footnotes:
  - marker: a
    text: Or, 'and his mighty deeds that he did.' The Hebrew combines 'his might' with 'that he did,' an idiom for demonstrated prowess or valor.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호사밧의 남은 행적과 그가 행한 그의 능력과 그가 싸운 일은 유다 왕들의 역대기에 기록되어 있지 않습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  english_pob_choice: Now the rest of the acts of
  chosen_korean: 여호사밧의 남은 행적
  alternatives_korean:
  - 여호사밧의 남은 일들
  - 여호사밧의 남은 사건들
  lexicon: HALOT
  rationale: 왕조 연대기 문맥의 관용구이므로 ‘말들’보다 역사적 활동 전체를 가리키는 ‘행적’이 더 자연스럽고, ‘남은’이 יתר의 잔여/나머지 의미를 잘 살립니다.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  english_pob_choice: and his might that he showed
  chosen_korean: 그가 행한 그의 능력
  alternatives_korean:
  - 그가 보인 그의 용맹
  - 그가 드러낸 그의 힘
  - 그의 능력과 그가 행한 일
  lexicon: HALOT
  rationale: גְּבוּרָה는 힘·용맹·무용을 모두 포함할 수 있고, 뒤의 ‘그가 행한’이 그 능력이 실제 행동으로 나타났음을 보완하므로, ‘능력’과 동사구를 함께 두어 원문의 긴장을 살렸습니다.
- source_word: וַאֲשֶׁר נִלְחָם
  english_pob_choice: and how he fought
  chosen_korean: 그가 싸운 일
  alternatives_korean:
  - 그가 싸운 것
  - 그가 전쟁한 일들
  - 그가 전투한 일
  lexicon: HALOT
  rationale: נִלְחָם은 단순한 ‘전투하다’보다 전쟁/싸움에 참여한 행위를 가리키므로, 서술형 연대기 문맥에 맞게 ‘싸운 일’로 옮겼습니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  english_pob_choice: the Book of the Chronicles
  chosen_korean: 역대기
  alternatives_korean:
  - 열왕 연대기
  - 역대 기록
  - 날들의 책
  lexicon: HALOT
  rationale: 해당 공식 명칭은 본문이 가리키는 왕실 기록집을 뜻하므로, 한국어 성경에서 통용되는 ‘역대기’로 옮겨 출처 표지를 자연스럽게 살렸습니다.
