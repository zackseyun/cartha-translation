  source_fidelity: ‘그가 행한 그의 능력’은 히브리어 וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה의 명사와 관계절을 기계적으로 재현하여 한국어로는 부자연스럽습니다. גְּבוּרָה가 문맥상 드러난 힘·용맹·무훈을 가리키는 점을 반영하여 ‘그가 보인 용맹’으로 옮기고, 각주에서 더 넓은 의미 가능성을 보존하는 것이 적절합니다. 나머지 왕조 연대기 공식, 싸움, 수사 의문문, 유다 왕들의 기록이라는 출처 표지는 원문에 충실합니다.
