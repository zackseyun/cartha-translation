  naturalness: 현 문장의 ‘한 궁정 관리에게 불러 말했습니다’는 ‘부르다’의 목적격 지배에 맞지 않아 비문에 가깝습니다. ‘한 궁정 관리를 불러 말했습니다’로 고쳐야 합니다. 또한 명령문의 목적어는 ‘이믈라의 아들 미가야를’로 배열하면 호격으로 오해될 여지 없이 자연스럽습니다.
