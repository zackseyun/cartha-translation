  text: Then the king of Israel called one officer and said[a], “Bring Micaiah son of Imlah quickly.”
  footnotes:
  - marker: a
    text: Hebrew saris can mean 'eunuch' or more generally 'court official/officer.' Here the broader administrative sense is likely.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘 왕이 한 궁정 관리에게 불러 말했습니다. 「미가야, 이믈라의 아들을 속히 데려오십시오。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 saris는 '내시'를 뜻할 수도 있고, 더 넓게는 궁정 관리/관원을 가리킬 수도 있습니다. 여기서는 후자의 행정적 뜻이 더 가능해 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
  - 불렀습니다
  - 소집했습니다
  - 불러들였습니다
  lexicon: HALOT
  rationale: 서사문에서 מֶלֶךְ יִשְׂרָאֵל이 하급 관리에게 명령을 전달하는 흐름이므로, 단순히 '불렀습니다'보다 이어지는 직접 명령을 자연스럽게 받치는 '불러'가 적절합니다.
- source_word: אֶל סָרִיס אֶחָד
  english_pob_choice: one officer
  chosen_korean: 한 궁정 관리
  alternatives_korean:
  - 한 내시
  - 한 관리
  - 한 시종
  lexicon: HALOT
  rationale: saris는 문자적으로 '내시'일 수 있으나, 여기서는 EN POB의 주석처럼 궁정 행정직을 가리키는 넓은 뜻이 문맥상 더 분명하므로 '궁정 관리'로 옮겼습니다.
- source_word: מַהֲרָה
  english_pob_choice: Quickly bring
  chosen_korean: 속히 데려오십시오
  alternatives_korean:
  - 빨리 데려오십시오
  - 어서 데려오십시오
  - 서둘러 데려오십시오
  lexicon: HALOT
  rationale: 히브리어는 긴급한 명령을 나타내며, 목적어 미가야를 생동감 있게 이동시키는 뜻을 한국어에서는 '데려오십시오'로 자연스럽게 풀 수 있습니다.
- source_word: מִיכָיְהוּ בֶן יִמְלָה
  english_pob_choice: Micaiah son of Imlah
  chosen_korean: 미가야, 이믈라의 아들
  alternatives_korean:
  - 미가야, 이믈라 아들
  - 미가야, 이말라의 아들
  lexicon: standard transliteration
  rationale: 고유명사는 통용되는 성서 음역을 따르고, 히브리어 계보 표지는 한국어에서도 'A의 아들' 구조로 분명하게 유지했습니다.
theological_decisions:
- issue: סָרִיס의 의미를 '내시'로 제한할지 여부
  chosen_reading: 문맥상 행정직을 가리키는 '궁정 관리'로 번역했습니다.
  alternative_readings:
  - 내시
  - 왕실 관리
  rationale: 본문의 초점은 인물의 신체 상태가 아니라 왕의 명령을 전달하는 궁정 직무에 있으므로, 독자가 장면을 오해하지 않도록 넓은 행정적 의미를 택했습니다.
  doctrine_reference: 본문 해석의 문맥 우선 원칙
