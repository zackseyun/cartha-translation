  yaml_path: translation/ot/1_kings/022/052.yaml
  text: Ahaziah son of Ahab became king over Israel in Samaria in the seventeenth year of Jehoshaphat king of Judah, and he reigned over Israel two years.
translation:
  language: ko
  text: 아합의 아들 아하시야는 사마리아에서 유다 왕 여호사밧의 제십칠년에 이스라엘의 왕이 되어 이스라엘을 두 해 동안 다스렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  english_pob_choice: Ahaziah son of Ahab
  chosen_korean: 아합의 아들 아하시야
  alternatives_korean:
  - 아하시야, 아합의 아들
  - 아합의 아들 아하시야
  lexicon: 고유명사 / 친족관계 표현
  rationale: 히브리어의 소유-친족 구문을 한국어 자연어로 옮기되, 계보 관계가 분명히 드러나도록 '아합의 아들'을 앞에 두었습니다.
- source_word: מָלַךְ עַל יִשְׂרָאֵל
  english_pob_choice: became king over Israel
  chosen_korean: 이스라엘의 왕이 되어 이스라엘을 다스렸습니다
  alternatives_korean:
  - 이스라엘 위에 왕이 되었습니다
  - 이스라엘을 다스리기 시작했습니다
  lexicon: מלך
  rationale: מלך는 단순한 통치 지속보다 즉위/왕권 취임을 포함하므로 '왕이 되어'로 액세스를 살리고, POB의 'over Israel' 의미를 살려 '이스라엘을 다스렸습니다'로 자연스럽게 풀었습니다.
- source_word: בְּשֹׁמְרוֹן
  english_pob_choice: in Samaria
  chosen_korean: 사마리아에서
  alternatives_korean:
  - 사마리아 안에서
  - 사마리아에
  lexicon: 지명 표기 / 전치사 ב
  rationale: בה 위치 용법은 한국어 장소 부사격 '-에서'가 가장 자연스럽고, 사마리아는 통용 표기를 따랐습니다.
- source_word: בִּשְׁנַת שְׁבַע עֶשְׂרֵה לִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  english_pob_choice: in the seventeenth year of Jehoshaphat king of Judah
  chosen_korean: 유다 왕 여호사밧의 제십칠년에
  alternatives_korean:
  - 유다 왕 여호사밧의 열일곱째 해에
  - 유다 왕 여호사밧의 제17년에
  lexicon: 연대 공식
  rationale: 왕조 연대 공식은 한국어 성경 문체에 맞춰 '제십칠년'으로 옮겨 히브리어의 계산 관용을 보존했습니다.
- source_word: וַיִּמְלֹךְ עַל יִשְׂרָאֵל שְׁנָתָיִם
  english_pob_choice: and he reigned over Israel two years
  chosen_korean: 이스라엘을 두 해 동안 다스렸습니다
  alternatives_korean:
  - 이스라엘을 두 해 동안 통치했습니다
  - 이스라엘 위에 두 해 동안 다스렸습니다
  lexicon: מלך / שְׁנָתָיִם
  rationale: משך 재임 기간은 한국어에서 '두 해 동안'으로 자연스럽고, 연속적 통치 결과를 나타내는 종결 서술로 정리했습니다.
