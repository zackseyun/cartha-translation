translation:
  language: ko
  text: 여호사밧이 이스라엘 왕에게 말했습니다. “부디 오늘 야훼의 말씀을 구해 보십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼의 말씀을 찾으십시오”, 또는 “야훼께 말씀을 구하십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 그가 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리되, 한국어에서는 문두의 접속사를 과도하게 반복하지 않고 평이한 과거 서술로 옮겼습니다.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  english_pob_choice: to the king of Israel
  chosen_korean: 이스라엘 왕에게
  alternatives_korean:
  - 이스라엘의 왕에게
  - 이스라엘 왕에게
  lexicon: HALOT
  rationale: 히브리어의 직선적인 방향어구를 그대로 살려 왕의 칭호를 간명하게 유지했습니다.
- source_word: דְּרָשׁ
  english_pob_choice: inquire
  chosen_korean: 여쭈어 보십시오
  alternatives_korean:
  - 여쭈어 보시기 바랍니다
  - 묻어 보십시오
  - 찾으십시오
  lexicon: HALOT
  rationale: 문맥상 여호와의 말씀을 구하는 행위이므로 단순한 '묻다'보다 공손하고 종교적 뉘앙스를 살리는 '여쭈어 보다'가 적절합니다.
- source_word: נָא
  english_pob_choice: Please
  chosen_korean: 청컨대
  alternatives_korean:
  - 부디
  - 제발
  lexicon: HALOT
  rationale: נא의 간청과 공손을 현대 한국어에서 품격 있게 드러내는 표현으로 옮겼습니다.
- source_word: אֶת דְּבַר יְהוָה
  english_pob_choice: for the word of Yahweh
  chosen_korean: 야훼의 말씀을
  alternatives_korean:
  - 야훼의 말씀을
  - 여호와의 말씀을
  - 야훼의 한 말씀을
  lexicon: HALOT
  rationale: POB의 고유명사 원칙에 따라 יְהוָה는 '야훼'로 옮기고, דְּבַר는 관용적으로 '말씀'으로 처리했습니다.
theological_decisions:
- issue: Tetragrammaton rendering in Korean
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 יְהוָה를 직접 사용하므로, 신학적으로는 직함이 아니라 언약적 고유명으로 드러나야 하여 '야훼'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
