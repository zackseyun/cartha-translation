source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל יְה֣וֹשָׁפָ֔ט הֲ/תֵלֵ֥ךְ אִתִּ֛/י לַ/מִּלְחָמָ֖ה רָמֹ֣ת גִּלְעָ֑ד וַ/יֹּ֤אמֶר יְהֽוֹשָׁפָט֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל כָּמ֧וֹ/נִי כָמ֛וֹ/ךָ כְּ/עַמִּ֥/י כְ/עַמֶּ֖/ךָ כְּ/סוּסַ֥/י כְּ/סוּסֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/004.yaml
  text: And he said to Jehoshaphat[a], “Will you go with me to battle at Ramoth-gilead?” And Jehoshaphat said to the king of Israel, “I am as you are, my people as your people, my horses as your horses.”
  footnotes:
  - marker: a
    text: Or “my people are as your people, and my horses as your horses.” The Hebrew is a terse verbless expression of solidarity and alliance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 여호사밧에게 말했습니다. 「나와 함께 라못길르앗으로 싸우러 가시겠습니까?」 여호사밧이 이스라엘 왕에게 말했습니다. 「나도 당신과 같고, 내 백성도 당신의 백성과 같고, 내 말들도 당신의 말들과 같습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 동사가 생략된 짧은 대구로, ‘내 백성도 당신의 백성과 같고, 내 말들도 당신의 말들과 같습니다’라는 연대·동맹의 뜻을 압축합니다.
    reason: source_note
lexical_decisions:
- source_word: הֲ/תֵלֵךְ
  english_pob_choice: Will you go
  chosen_korean: 가시겠습니까?
  alternatives_korean:
  - 가겠습니까?
  - 가실 겁니까?
  lexicon: HALOT
  rationale: 의문 입자와 2인칭 남성 단수 미완료형의 직접 질문을 한국어 공손형으로 옮겼습니다. 대화 상대가 여호사밧이므로 -시-를 반영했습니다.
- source_word: לַ/מִּלְחָמָה
  english_pob_choice: to battle
  chosen_korean: 싸우러
  alternatives_korean:
  - 전쟁하러
  - 전투하러
  lexicon: HALOT
  rationale: הלך + למלחמה는 단순 이동보다 전투 참여를 뜻하므로, 목적을 드러내는 ‘-러’와 동사 ‘싸우다’로 자연스럽게 옮겼습니다. ‘전쟁’보다 직접적인 충돌 감각을 살렸습니다.
- source_word: כָּמוֹנִי כָמוֹךָ / כְּעַמִּי כְעַמֶּךָ / כְּסוּסַי כְּסוּסֶיךָ
  english_pob_choice: I am as you are, my people as your people, my horses as your horses
  chosen_korean: 나도 당신과 같고, 내 백성도 당신의 백성과 같고, 내 말들도 당신의 말들과 같습니다
  alternatives_korean:
  - 나는 당신과 같고, 내 백성은 당신의 백성과 같고, 내 말들은 당신의 말들과 같습니다
  - 내가 당신과 같듯이 내 백성도 당신의 백성과 같고, 내 말들도 당신의 말들과 같습니다
  lexicon: HALOT
  rationale: 히브리어는 동사가 생략된 짧은 동격·연대 표현이므로, 한국어에서는 자연스러운 서술을 보충하되 대칭 구조를 유지했습니다. ‘백성’과 ‘말들’은 구체 명사를 보존해 동맹과 군사 지원의 의미를 드러냅니다.
theological_decisions:
- issue: 여호사밧의 응답이 단순한 호의인지 동맹의 선언인지
  chosen_reading: 원문의 축약된 대구를 살려, 여호사밧의 말은 ‘나도 당신과 같고…’라는 연대·동맹 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 친선 표현으로 완화해 옮김
  - 설명적으로 ‘당신 편입니다’로 풀어씀
  rationale: 히브리어의 핵심은 ‘같다’는 반복을 통한 연대 표명입니다. 이를 완화하면 본문이 드러내는 정치적·군사적 결속이 약해집니다.
  doctrine_reference: 본문 역사서 맥락의 서술적 의미 보존
