  - severity: low
    issue: 각주 표지가 문장 끝에 놓여 있습니다.
    rationale: 각주는 ‘옷을 입은 채’의 어휘 선택을 설명하므로 해당 어구 바로 뒤에 두어 앵커를 명확히 해야 합니다.
