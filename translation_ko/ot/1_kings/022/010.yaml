  source_fidelity: 개역안의 선행 ‘이제’는 히브리어 접속사 ו의 가능한 담화 기능을 넘어 별도의 시간 표지를 도입합니다. 또한 각주 표지가 문장 끝에 있어 ‘옷을 입은 채’라는 해당 어구에 직접 연결되지 않습니다. 이를 바로잡으면 원문의 왕들, 각자의 왕좌, 의복, 사마리아 성문 어귀의 타작마당, 예언자들의 지속적 예언을 충실히 보존합니다.
  naturalness: ‘각각 자기 왕좌에’보다 ‘각자 자기 왕좌에’가 현대 표준 한국어에서 자연스럽습니다. 의복 상태는 ‘옷을 입은 채’로 유지하고, 장소와 장면의 지속을 매끄럽게 연결했습니다.
  terminology: 여호사밧, 사마리아, 왕좌, 타작마당, 예언자 모두 적절합니다. 히브리어의 단순한 ‘옷/의복’에 ‘왕실’ 또는 ‘왕복’이라는 수식어를 덧붙이지 않았습니다.
