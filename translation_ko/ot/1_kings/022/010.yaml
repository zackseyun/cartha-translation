source:
  edition: WLC
  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָ֨ל הַ/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/010.yaml
  text: Now the king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, at the threshing floor at the entrance of the gate of Samaria, and all the prophets were prophesying before them.
  footnotes:
  - marker: a
    text: Or simply, 'clothed in garments.' The Hebrew does not explicitly say 'royal,' though the royal setting strongly suggests ceremonial attire.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 이스라엘 왕과 유다 왕 여호사밧은 각각 자기 왕좌에 앉아 있었고, 옷을 입은 채 사마리아 성문 어귀의 타작마당에 있었으며, 모든 예언자들은 그들 앞에서 예언하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옷을 입고’라고도 옮길 수 있습니다. 히브리어는 ‘왕실’이나 ‘왕복’을 명시하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבִים
  english_pob_choice: were sitting
  chosen_korean: 앉아 있었고
  alternatives_korean:
  - 앉아 있고
  - 앉아 있었습니다
  lexicon: HALOT
  rationale: 분사형이 장면의 지속 상태를 나타내므로, 단순 과거보다 진행·상태를 살리는 표현을 택했습니다.
- source_word: אִישׁ עַל כִּסְאוֹ
  english_pob_choice: each on his throne
  chosen_korean: 각각 자기 왕좌에
  alternatives_korean:
  - 각자 자기 자리에서
  - 각자 자기 보좌에
  lexicon: HALOT
  rationale: אִישׁ의 분배적 의미를 ‘각각’으로 살리고, 왕실 문맥의 כִּסֵּא는 ‘왕좌’가 가장 자연스럽습니다.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  english_pob_choice: clothed in garments
  chosen_korean: 옷을 입은 채
  alternatives_korean:
  - 옷을 입고
  - 의복을 걸친 채
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘옷/의복’을 말하므로, 영어 주석처럼 ‘왕복’이나 ‘왕실’ 의미를 본문에 덧붙이지 않고 그대로 옮겼습니다.
- source_word: בְּגֹרֶן פֶּתַח שַׁעַר שֹׁמְרוֹן
  english_pob_choice: at the threshing floor at the entrance of the gate of Samaria
  chosen_korean: 사마리아 성문 어귀의 타작마당에
  alternatives_korean:
  - 사마리아 성문 입구의 타작마당에
  - 사마리아 성문 앞 타작마당에
  lexicon: HALOT
  rationale: 지명·장소구를 비교적 직역해, 층위가 있는 구성어를 유지했습니다.
- source_word: מִתְנַבְּאִים
  english_pob_choice: were prophesying
  chosen_korean: 예언하고 있었습니다
  alternatives_korean:
  - 예언하고 있었습니다
  - 예언자 노릇을 하고 있었습니다
  lexicon: HALOT
  rationale: 히트파엘 형태의 נבא는 일반적으로 ‘예언하다’이므로, 동작 진행을 드러내는 표현을 사용했습니다.
theological_decisions:
- issue: 예언자들의 행위를 어떻게 드러낼지
  chosen_reading: 중립적으로 ‘예언하고 있었습니다’로 옮겨, 본문이 말하는 행위 자체만 제시했습니다.
  alternative_readings:
  - 예언자 노릇을 하고 있었습니다
  - 예언을 떠들고 있었습니다
  rationale: 원문은 행위 묘사이지 평가가 아니므로, 조롱이나 해석을 덧붙이지 않았습니다.
  doctrine_reference: 본문 서술의 중립성 유지
