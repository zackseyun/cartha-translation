id: 1KI.22.31
reference: 1 Kings 22:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מֶ֣לֶךְ אֲרָ֡ם צִוָּ֣ה אֶת שָׂרֵי֩ הָ/רֶ֨כֶב אֲשֶׁר ל֜/וֹ שְׁלֹשִׁ֤ים וּ/שְׁנַ֨יִם֙ לֵ/אמֹ֔ר לֹ֚א תִּלָּ֣חֲמ֔וּ אֶת קָטֹ֖ן וְ/אֶת גָּד֑וֹל כִּ֛י אִֽם אֶת מֶ֥לֶךְ יִשְׂרָאֵ֖ל לְ/בַדּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/031.yaml
  text: Now the king of Aram had commanded the thirty-two chariot commanders who belonged to him[a], saying, “Do not fight with either small or great[c][b], but only with the king of Israel alone.”
  footnotes:
  - marker: a
    text: Or “Do not fight with anyone, small or great, except only the king of Israel.” The Hebrew idiom “small or great” means people of any rank or status.
    reason: lexical_alternative
  - marker: b
    text: “Aram” is the Hebrew place-name; traditionally rendered “Syria.”
    reason: alternative_reading
  - marker: c
    text: Or 'with small or great, but only with'.
    reason: previous_rendering
translation:
  language: ko
  text: 아람 왕은 자기 휘하의 병거 지휘관 서른두 명에게 이렇게 명령했습니다. “작은 자나 큰 자[a]와는 싸우지 말고, 오직 이스라엘 왕과만 싸우십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘작은 자나 큰 자’는 신분이나 지위가 낮은 사람이든 높은 사람이든 모두를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  english_pob_choice: Now the king of Aram
  chosen_korean: 아람 왕이
  alternatives_korean:
  - 그리고 아람 왕이
  - 시리아 왕이
  lexicon: HALOT
  rationale: 아람은 원어 지명을 따라 음역하고, 서술 시작의 וְ는 한국어에서 자연스럽게 생략했습니다.
- source_word: שָׂרֵי הָרֶכֶב
  english_pob_choice: chariot commanders
  chosen_korean: 병거 지휘관
  alternatives_korean:
  - 병거 대장들
  - 병거 장교들
  - 병거 지휘자들
  lexicon: HALOT
  rationale: שָׂרֵי는 지휘/통솔의 뜻이 강하므로 군사적 역할을 살려 ‘지휘관’으로 옮겼습니다.
- source_word: אֶת קָטֹן וְאֶת גָּדוֹל
  english_pob_choice: with small or great
  chosen_korean: 작은 자나 큰 자와
  alternatives_korean:
  - 작고 큰 자와
  - 신분이 낮은 자나 높은 자와
  - 누구와도
  lexicon: HALOT
  rationale: 히브리어 관용구로서 ‘작은 자나 큰 자’는 신분이나 지위의 차이를 아우르는 표현이므로, 이를 살리면서도 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: כִּי אִם
  english_pob_choice: but only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 오로지
  - 예외로
  lexicon: HALOT
  rationale: 제외와 제한의 강한 뉘앙스를 간결하게 나타내는 말로 ‘오직’을 택했습니다.
theological_decisions:
- issue: 전투 금지 명령의 대상 표현
  chosen_reading: ‘작은 자나 큰 자와 싸우지 말고’로 옮겨, 특정 계층이 아니라 모든 사람을 배제하는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘누구와도 싸우지 말고’
  - ‘신분이 낮든 높든 아무와도 싸우지 말고’
  rationale: 원문 관용구의 포괄성을 유지하되, 본문이 실제로는 이스라엘 왕만을 겨냥한 선택적 공격 명령임을 분명히 해야 합니다.
  doctrine_reference: 본문 해석의 문맥적 명확성
- issue: 직접 명령문의 높임말
  chosen_reading: 왕의 지시를 직접 인용하는 부분은 공손한 명령형 ‘싸우십시오’를 사용했습니다.
  alternative_readings:
  - ‘싸우지 마라’
  - ‘싸우지 마십시오’
  rationale: 인물 간 대화와 군사 명령의 직접성을 살리면서도 표준 한국어 합쇼체를 유지하기 위한 선택입니다.
  doctrine_reference: 문체 일관성
