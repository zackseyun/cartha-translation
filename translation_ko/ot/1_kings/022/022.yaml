  source_fidelity: 히브리어의 반복된 발화 구조, ‘나가다’, ‘거짓 영’, 예언자들의 ‘입에’, 그리고 פתה의 유인/기만 의미를 대체로 잘 반영했습니다. 다만 תוּכָל을 ‘이길 것입니다’로 옮기면 상대와의 승부에서 이긴다는 뜻으로 좁혀져, 여기서 의도된 유혹의 성공·성취를 충분히 나타내지 못합니다.
  naturalness: 현 초안은 직접 인용문 뒤에 다시 ‘라고 하였습니다’를 붙여 발화가 중복되고 문장 연결이 부자연스럽습니다. 인용문 안의 종결 표현과 명령형은 합쇼체에 맞출 수 있으며, 직접화법은 별도의 ‘라고 하였습니다’ 없이 제시하는 편이 자연스럽습니다.
  terminology: ‘거짓 영’은 רוּחַ שֶׁקֶר의 간결하고 자연스러운 번역이며, ‘유혹할 것입니다’는 פתה의 문맥상 의미를 적절히 보존합니다. תוּכָל은 ‘성공할 것입니다’로 하여 유혹의 목적을 이루는 뜻을 나타내는 것이 적절합니다.
