id: 1KI.22.22
reference: 1 Kings 22:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֵצֵא֙ וְ/הָיִ֨יתִי֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאָ֑י/ו וַ/יֹּ֗אמֶר תְּפַתֶּה֙ וְ/גַם תּוּכָ֔ל צֵ֖א וַ/עֲשֵׂה כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/022.yaml
  text: And he said[a], ‘I will go out and be a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also prevail[b]. Go out and do so.’
  footnotes:
  - marker: a
    text: Or 'a spirit of falsehood.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you will deceive him' or 'you will persuade him.' The Hebrew verb can cover enticement, persuasion, or deception depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “저는 나가서 그의 모든 예언자들의 입에 거짓 영[a]이 되겠습니다.” 그러자 그가 말했습니다. “너는 그를 유혹할 것이며[b], 또한 성공할 것입니다. 나가서 그렇게 하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거짓의 영’으로도 옮길 수 있습니다.
    reason: רוּחַ שֶׁקֶר의 어휘적 대안입니다.
  - marker: b
    text: ‘속일 것이다’ 또는 ‘설득할 것이다’로도 옮길 수 있습니다. 히브리어 동사는 문맥에 따라 유혹, 설득, 기만의 의미를 가질 수 있습니다.
    reason: תְּפַתֶּה의 문맥적 어휘 범위를 제시합니다.
lexical_decisions:
- source_word: רוּחַ שֶׁקֶר
  english_pob_choice: a lying spirit
  chosen_korean: 거짓 영
  alternatives_korean:
  - 거짓말하는 영
  - 거짓의 영
  lexicon: HALOT
  rationale: 어구의 핵심은 ‘거짓을 특징으로 하는 영’이므로, 직역에 가깝되 한국어로 자연스러운 ‘거짓 영’을 택했습니다.
- source_word: בְּפִי כָּל נְבִיאָי/ו
  english_pob_choice: in the mouth of all his prophets
  chosen_korean: 그의 모든 예언자들의 입에
  alternatives_korean:
  - 그의 모든 예언자들의 입속에
  - 그의 모든 예언자들을 통해
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 예언자들을 통한 발화 매개를 드러내기 위해 ‘입에’를 유지했습니다.
- source_word: תְּפַתֶּה
  english_pob_choice: you will entice him
  chosen_korean: 너는 그를 유혹할 것이고
  alternatives_korean:
  - 너는 그를 속일 것이고
  - 너는 그를 꾀어낼 것이고
  lexicon: HALOT
  rationale: 피엘 פתה는 문맥상 유인·유혹·기만의 뉘앙스를 가질 수 있으며, 여기서는 파괴적 유인을 드러내는 ‘유혹하다’가 가장 적절합니다.
- source_word: וְגַם תּוּכָל
  english_pob_choice: and you will also prevail
  chosen_korean: 또한 이길 것입니다
  alternatives_korean:
  - 또한 성공할 것입니다
  - 또한 해낼 것입니다
  lexicon: HALOT
  rationale: יכל은 단순 능력보다 ‘목적을 이루다/통하다’의 뉘앙스가 있어, 상황상 ‘이기다’로 옮겨 결과적 성취를 살렸습니다.
theological_decisions:
- issue: 거짓 영의 파견/작동을 완곡하게 낮출지 여부
  chosen_reading: 본문의 직접적인 대화를 유지하여, 거짓 영이 ‘나가서’ 예언자들의 입에 서겠다는 진술과 그에 대한 승인적 응답을 그대로 옮겼습니다.
  alternative_readings:
  - 하나님의 단순 허용으로 완화하는 해석적 번역
  - 간접적으로 ‘거짓의 영향력’ 정도로 약화하는 번역
  rationale: 히브리어 동사와 대화 구조가 강하게 직접적이므로, 신학적 긴장을 본문보다 먼저 해소하지 않고 보존하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
