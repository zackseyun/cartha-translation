revisions:
- from: 그가 말했습니다. 「나는 나가서 그의 모든 예언자들의 입에 거짓 영이 되겠습니다」라고 하였습니다. 그러자 그가 말했습니다. 「너는 그를 유혹할 것이고, 또한 이길 것입니다. 나가서 그렇게 하십시오」라고 하였습니다.[a][b]
  to: 그가 말했습니다. “저는 나가서 그의 모든 예언자들의 입에 거짓 영[a]이 되겠습니다.” 그러자 그가 말했습니다. “너는 그를 유혹할 것이며[b], 또한 성공할 것입니다. 나가서 그렇게 하십시오.”
  rationale: 직접화법의 중복된 인용 표지를 제거하여 현대 표준 한국어의 자연스러운 문장 구조로 고쳤습니다. 또한 ‘이길 것입니다’를 ‘성공할 것입니다’로 바꾸어, 히브리어 יכל이 이 문맥에서 나타내는 계획의 성공을 보존했습니다. 신적 허용·명령 장면의 긴장은 완화하거나 해석적으로 설명하지 않았습니다.
