id: 1KI.22.37
reference: 1 Kings 22:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣מָת הַ/מֶּ֔לֶךְ וַ/יָּב֖וֹא שֹׁמְר֑וֹן וַ/יִּקְבְּר֥וּ אֶת הַ/מֶּ֖לֶךְ בְּ/שֹׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/037.yaml
  text: So the king died and was brought to Samaria[a], and they buried the king in Samaria.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and the king died, and he came to Samaria.' The sense is that the king's body was brought to Samaria after his death.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 죽고 사마리아로 옮겨졌습니다[a]. 그들은 왕을 사마리아에 장사했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘왕이 죽고, 그가 사마리아로 왔다’입니다. 뜻은 왕의 시신이 죽은 뒤 사마리아로 옮겨졌다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽고
  alternatives_korean:
  - 죽었습니다
  - 숨졌습니다
  lexicon: HALOT
  rationale: 서술 진행형의 wayyiqtol을 한국어 서술 흐름에 맞게 자연스럽게 처리하되, 뒤의 이어지는 동작과 연결되도록 ‘죽고’로 옮겼습니다.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  english_pob_choice: was brought to Samaria
  chosen_korean: 사마리아로 옮겨졌습니다
  alternatives_korean:
  - 사마리아로 갔습니다
  - 사마리아에 이르렀습니다
  lexicon: HALOT
  rationale: 히브리어 표면형은 ‘오다’이지만, 영어 POB가 주석으로 밝히듯 실제 의미는 왕의 시신이 사마리아로 운구된 것입니다. 그 의미를 드러내는 수동 표현을 택했습니다.
- source_word: וַיִּקְבְּרוּ
  english_pob_choice: they buried
  chosen_korean: 그들은 ... 장사했습니다
  alternatives_korean:
  - 그들은 ... 묻었습니다
  - 사람들이 ... 장사했습니다
  lexicon: HALOT
  rationale: 주어가 명시되지 않은 복수 동사를 한국어에서도 자연스럽게 ‘그들은’으로 옮겨, 장례 행위의 수행자를 일반적으로 드러냈습니다.
- source_word: בְּשֹׁמְרוֹן
  english_pob_choice: in Samaria
  chosen_korean: 사마리아에
  alternatives_korean:
  - 사마리아에서
  - 사마리아 안에
  lexicon: HALOT
  rationale: 묻힌 장소를 나타내는 전치사 ב의 기본적인 장소 용법을 살려 ‘사마리아에’로 옮겼습니다.
theological_decisions:
- issue: 왕의 죽음 뒤 ‘오다’ 표현의 처리
  chosen_reading: 본문의 표면상 동사형을 그대로 두기보다, 문맥상 시신의 운구를 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘사마리아로 왔습니다’처럼 더 직역할 수 있습니다.
  rationale: 히브리어 자체는 문자적으로 ‘그리고 그는 사마리아로 왔다’에 가깝지만, 죽은 왕에게는 생물학적 이동이 성립하지 않으므로 독자가 실제 사건을 오해하지 않도록 의미를 명시했습니다.
  doctrine_reference: 본문 의미의 명료화와 서사적 관용 표현 처리
- issue: ‘장사했습니다’의 선택
  chosen_reading: 매장 행위를 단순한 ‘묻다’보다 장례 맥락이 드러나는 ‘장사하다’로 번역했습니다.
  alternative_readings:
  - ‘묻었습니다’
  rationale: 왕의 시신을 다루는 공식적 장례 행위임을 보여 주기 위해, 전통적이지만 의미가 분명한 한국어 동사를 사용했습니다.
  doctrine_reference: 서사 문맥과 장례 관습의 표현
