    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 잠들었고
  alternatives_korean:
  - 누웠고
  - 죽었고
  lexicon: HALOT
  rationale: 히브리어의 왕실 사망 관용구를 그대로 살리되, 한국어에서는 ‘잠들다’가 해당 공식 표현을 가장 자연스럽게 옮기며 문맥상 죽음을 드러냅니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 조상들 곁에
  lexicon: HALOT
  rationale: 직역형 ‘아버지들’은 한국어에서 어색하므로, 왕조적·족속적 뉘앙스를 살릴 수 있는 ‘조상들’로 옮겼습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: became king ... in his place
  chosen_korean: 그의 뒤를 이어 왕이 되었습니다
  alternatives_korean:
  - 그 대신 왕이 되었습니다
  - 그 자리를 이어 왕이 되었습니다
  lexicon: HALOT
  rationale: 접속사+동사+전치사 구문이 나타내는 승계 공식은 한국어에서 ‘뒤를 이어’가 가장 자연스럽고, 왕위 승계를 분명히 드러냅니다.
- source_word: אֲחַזְיָהוּ
  english_pob_choice: Ahaziah
  chosen_korean: 아하시야
  alternatives_korean:
  - 아하시아
  - 아하시야후
  lexicon: 한국어 성경 관용 표기
  rationale: 한국어 성경에서 널리 알려진 인명 형태를 사용해 가독성과 일관성을 확보했습니다.
theological_decisions:
- issue: 왕실 사망 공식의 직역성 유지
  chosen_reading: ‘잠들었고’로 옮겨 사망을 완곡하지만 분명하게 드러냈습니다.
  alternative_readings:
  - ‘죽었고’로 직접 번역
  - ‘묻혔고’로 해석적 번역
  rationale: 본문은 왕실 연대기에서 반복되는 공식어를 사용하므로, 해석을 과도하게 앞세우지 않고 원문의 관용성을 보존하는 쪽이 적절합니다.
  doctrine_reference: 본문-서사 관찰; 왕정 기록의 관용 표현
