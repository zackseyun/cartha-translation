  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
  footnotes:
  - marker: a
    text: Or “but only disaster.” The Hebrew says literally “good ... but only evil,” using a stark contrast that can refer here to an unfavorable or disastrous prophecy.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이스라엘 왕이 여호사밧에게 말했습니다. “내가 당신에게 그가 나에 관하여 좋은 것은 예언하지 않고, 오직 나쁜 것만 예언할 것이라고 말하지 않았습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “재앙만.” 히브리어는 문자적으로 “좋은 것 ... 오직 나쁜 것”이라고 하며, 여기서는 불리하거나 재앙적인 예언을 가리킬 수 있습니다.
    reason: lexical_alternative
