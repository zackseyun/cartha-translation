  rationale: 히브리어의 관형격 구조를 자연스러운 현대 한국어로 옮기되, 본문이 인물명을 덧붙이지 않고 ‘이스라엘 왕’이라고만 말하는 점을 유지했습니다.
- source_word: הֲלוֹא אָמַרְתִּי אֵלֶיךָ
  english_pob_choice: Did I not tell you
  chosen_korean: 내가 당신에게 ... 말하지 않았습니까
  alternatives_korean:
  - 내가 당신에게 ... 말하지 않았느냐
  - 내가 당신에게 ... 말하지 않았습니까?
  lexicon: HALOT
  rationale: 반문형의 책망을 한국어에서 자연스럽게 드러내기 위해 ‘말하지 않았습니까’로 옮겼습니다. 대화 상대가 왕인 상황이지만, 본문은 직접 인용 안에서의 격한 항의이므로 지나치게 완곡하게 만들지 않았습니다.
- source_word: לֹא יִתְנַבֵּא ... טוֹב כִּי אִם רָע
  english_pob_choice: he would not prophesy good ... but only evil
  chosen_korean: 좋은 것은 예언하지 않고, 오직 나쁜 것만 예언할 것
  alternatives_korean:
  - 좋은 것은 예언하지 않고, 오직 악한 것만 예언할 것
  - 좋은 것은 예언하지 않고, 오직 재앙만 예언할 것
  lexicon: HALOT
  rationale: 히브리어의 ‘좋음/나쁨’ 대비를 살리면서, 여기서는 예언의 내용이 왕에게 불리하다는 뜻이므로 ‘나쁜 것’으로 자연스럽게 표현했습니다. ‘악한 것’은 도덕적 악으로 들릴 수 있어 문맥상 덜 적합하고, ‘재앙’은 해석을 조금 더 좁힙니다.
theological_decisions:
- issue: טוֹב / רָע의 대비를 한국어에서 어떻게 보존할지
  chosen_reading: 좋은 것 / 나쁜 것
  alternative_readings:
  - 좋은 것 / 악한 것
  - 좋은 것 / 재앙
  rationale: 본문의 핵심은 왕이 선지자의 예언을 자기에게 유리한지 불리한지로 규정하는 데 있습니다. 한국어에서도 히브리어의 강한 대조를 유지하되, 문맥상 ‘나쁜 것’으로 읽히는 방향을 택해 의미를 과도하게 도덕화하지 않았습니다.
  doctrine_reference: Preserve lexical tension and contextual force without over-resolving רָע.
