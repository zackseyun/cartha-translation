  - 산들에
  lexicon: HALOT
  rationale: 지리적 방향보다 장면 속 위치를 나타내는 표현으로 읽어, 환시의 이미지를 살리는 자연스러운 한국어로 옮겼습니다.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  english_pob_choice: like sheep that have no shepherd
  chosen_korean: 목자가 없는 양들처럼
  alternatives_korean:
  - 목자가 없는 양 떼처럼
  - 목자 없이 있는 양들처럼
  lexicon: HALOT
  rationale: 익숙한 성경적 비유를 유지하되, ‘אין’의 부재감을 한국어에서도 분명히 드러내도록 했습니다.
- source_word: אֲדֹנִים
  english_pob_choice: These have no master
  chosen_korean: 주인이 없으니
  alternatives_korean:
  - 통치자가 없으니
  - 주인들이 없으니
  - 지도자가 없으니
  lexicon: HALOT
  rationale: 히브리어 복수형의 권위 부재를 살리면서도, 이 장면에서는 왕/통치권의 부재를 가리키므로 한국어에서는 단수 집합 의미의 ‘주인’이 가장 직접적입니다.
- source_word: בְּשָׁלוֹם
  english_pob_choice: in peace
  chosen_korean: 평안히
  alternatives_korean:
