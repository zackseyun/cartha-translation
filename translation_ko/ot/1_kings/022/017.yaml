theological_decisions:
- issue: 여호와의 이름 יְהוָה 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명기는 대체 호칭이 아니라 고유명사이므로, 프로젝트 기준에 따라 ‘야훼’로 직접 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 주체를 향한 명령형의 존대
  chosen_reading: 가게 하십시오
  alternative_readings:
  - 돌아가게 하십시오
  - 돌아가게 하소서
  rationale: 직접 화자가 아닌 야훼의 말씀 안에서 왕적 명령이 전달되므로, 현대 공용문체의 공손한 명령형으로 처리했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
