base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/017.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
  footnotes:
  - marker: a
    text: Or, “These have no lords,” with the plural reflecting the Hebrew form; contextually it refers to Israel being without its ruling head.
    reason: lexical_alternative
  - marker: b
    text: Or, “let each one return to his house in peace.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “나는 이스라엘 온 백성이 산들 위에 흩어져 있는 것을 보았습니다. 목자가 없는 양들처럼 말입니다. 야훼께서 말씀하셨습니다. ‘이들은 주인이 없으니, 각 사람은 평안히 자기 집으로 돌아가게 하십시오.’”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 복수형 ‘주인들’의 의미를 반영할 수도 있습니다. 그러나 문맥상 이스라엘의 통치 머리, 곧 왕의 부재를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “각 사람은 자기 집으로 돌아가게 하십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפֹצִים
  english_pob_choice: scattered
  chosen_korean: 흩어져 있는
  alternatives_korean:
