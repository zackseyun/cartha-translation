  naturalness: ‘이스라엘 온 백성’보다 본문의 포괄 표현을 직접 살린 ‘온 이스라엘’이 자연스럽습니다. 또한 ‘목자가 없는 양 떼’는 집합명사 צֹאן의 한국어 관용에 잘 맞습니다. 합쇼체를 유지하여 인용문 안의 귀환 지시도 ‘돌아가십시오’로 처리할 수 있습니다.
