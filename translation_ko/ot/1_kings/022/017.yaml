  - 흩어진
  lexicon: HALOT
  rationale: 분사형의 상태를 자연스럽게 살리면서, 전투 패배 후 여기저기 흩어진 모습을 한국어로 선명하게 드러냅니다.
- source_word: אֶל הֶהָרִים
  english_pob_choice: on the mountains
  chosen_korean: 산들 위에
  alternatives_korean:
