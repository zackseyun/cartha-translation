  source_fidelity: 시드기야가 다가와 미가야의 뺨을 치고, 야훼의 영이 자신에게서 미가야에게로 어떻게 옮겨 갔는지를 빈정대며 묻는 본문의 흐름은 대체로 반영되었습니다. 다만 ‘나에게서 어느 길로 지나가 너에게 말했느냐’는 한국어에서 영이 화자를 통과해 지나간다는 뜻으로도 읽히며, מֵאִתִּי(‘나에게서’)와 ‘너에게 말하려고’의 방향 관계가 불분명합니다.
  naturalness: ‘뺨을 치고’와 합쇼체 서술은 자연스럽습니다. 질문은 ‘나에게서 떠나 어느 길로 너에게 말하러 갔느냐’로 하면 한국어 문장 구조와 조롱하는 어조가 더 명료해집니다.
