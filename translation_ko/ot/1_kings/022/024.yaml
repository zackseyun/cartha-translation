  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek and said[a], “Which way did the Spirit of Yahweh pass from me to speak to you?”
  footnotes:
  - marker: a
    text: Or “By which way did the Spirit of the LORD pass from me to speak to you?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그나아나의 아들 시드기야가 다가와 미가야의 뺨을 치고 말했습니다. 「야훼의 영이 나에게서 떠나 어느 길로 너에게 말하러 갔느냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, 「야훼의 영이 나에게서 어느 길로 지나가 너에게 말했느냐?」
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  english_pob_choice: came near
  chosen_korean: 다가와
  alternatives_korean:
  - 다가왔습니다
  - 나아와
  lexicon: HALOT
  rationale: 접근하여 대면하는 동작을 나타내며, 이어지는 폭력 행위와 맞물려 긴장감을 자연스럽게 살릴 수 있습니다.
- source_word: וַיַּכֶּה אֶת מִיכָיְהוּ עַל הַלֶּחִי
  english_pob_choice: struck Micaiah on the cheek
  chosen_korean: 미가야의 뺨을 치고
  alternatives_korean:
  - 미가야의 뺨을 때리고
  - 미가야의 턱을 치고
  lexicon: HALOT
  rationale: לֶחִי는 일반적으로 ‘뺨’이 가장 자연스럽고, נכה는 문맥상 단순 타격보다 ‘치다’가 한국어에서 더 직접적으로 대응됩니다.
- source_word: אֵי זֶה עָבַר
  english_pob_choice: Which way ... pass
  chosen_korean: 어느 길로 지나가
  alternatives_korean:
  - 어떤 방식으로 지나가
  - 어디로 지나가
  lexicon: HALOT
  rationale: 조롱 섞인 질문의 방향감과 이동 이미지를 살리기 위해 ‘어느 길로’와 ‘지나가’를 함께 사용했습니다.
- source_word: רוּחַ יְהוָה
  english_pob_choice: the Spirit of Yahweh
  chosen_korean: 야훼의 영
  alternatives_korean:
  - 야훼의 성령
  - 여호와의 영
  lexicon: HALOT
  rationale: 이 문맥의 רוּחַ יְהוָה는 거룩한 영이라기보다 예언적 발화를 일으키는 하나님의 영이므로 ‘영’이 기본값이며, יְהוָה는 본 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 예언 충돌 장면에서 רוּחַ יְהוָה를 어떻게 한국어로 드러낼지
  chosen_reading: ‘야훼의 영’으로 옮겨, 시드기야의 비꼬는 주장 속에도 신적 발화의 주체가 분명히 드러나게 했습니다.
  alternative_readings:
  - ‘야훼의 성령’
  - ‘여호와의 영’
  rationale: 본문은 영을 단순한 인간 내면이 아니라 야훼에게서 온 예언적 영으로 다루므로, 한국어에서도 신적 주체성을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
