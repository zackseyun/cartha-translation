  - 너를 맹세케 하며
  lexicon: HALOT
  rationale: הִפעיל형의 ‘맹세하게 하다/맹세시키다’라는 사역 의미를 살렸고, 왕의 짜증 섞인 반복 질문이라는 뉘앙스를 반영했습니다.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  english_pob_choice: that you speak to me nothing but the truth
  chosen_korean: 너는 내게 진실만 말해야 합니까
  alternatives_korean:
  - 너는 내게 오직 진실만 말해야 합니까
  - 너는 내게 거짓 없이 말해야 합니까
  - 너는 내게 진리만 말해야 합니까
  lexicon: HALOT
  rationale: תְדַבֵּר을 ‘말하다’로, רַק אֱמֶת을 ‘진실만’으로 옮겨 제한의 힘을 유지했습니다. 한국어에서는 ‘말해야 합니까’가 전체 구문의 요구/질문 구조를 가장 자연스럽게 드러냅니다.
- source_word: בְּשֵׁם יְהוָה
  english_pob_choice: in the name of Yahweh
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
  - 여호와의 이름으로
  - 주님의 이름으로
  lexicon: HALOT
  rationale: 본문의 여호와/야훼 신명 표지를 그대로 반영하여, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. ‘이름으로’는 맹세의 권위 아래서 말한다는 관용을 살립니다.
