  text: Then the king said to him[a], “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
  footnotes:
  - marker: a
    text: Or, “How often do I have to put you under oath…?” The Hebrew verb means to make someone swear or place him under oath.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 그에게 말했습니다. 「내가 몇 번이나 너에게 맹세하게 해야[a] 네가 야훼의 이름으로 내게 진실만을 말하겠습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘맹세하게 하다’는 히브리어 히필형 동사의 사역적 의미를 나타냅니다. ‘맹세시키다’ 또는 ‘맹세 아래 두다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... הַמֶּלֶךְ
  english_pob_choice: Then the king said
  chosen_korean: 그때 왕이 말했습니다
  alternatives_korean:
