source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/016.yaml
  text: Then the king said to him[a], “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
  footnotes:
  - marker: a
    text: Or, “How often do I have to put you under oath…?” The Hebrew verb means to make someone swear or place him under oath.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 그에게 말했습니다. 「내가 몇 번이나 너를 맹세시키며, 너는 야훼의 이름으로 내게 진실만 말해야 합니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘맹세시키다’는 히브리어 히필형의 사역적 의미를 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... הַמֶּלֶךְ
  english_pob_choice: Then the king said
  chosen_korean: 그때 왕이 말했습니다
  alternatives_korean:
  - 그리고 왕이 말했습니다
  - 왕이 그에게 말했습니다
  lexicon: WLC/HALOT
  rationale: 와우-연속형의 서술 진행을 한국어의 자연스러운 시간 흐름인 ‘그때’로 옮겼고, 목적어는 문맥상 분명하므로 본문에는 반복을 줄였습니다.
- source_word: מַשְׁבִּעֶךָ
  english_pob_choice: must I make you swear
  chosen_korean: 너를 맹세시키며
  alternatives_korean:
  - 너에게 맹세하게 하며
  - 너를 맹세하도록 강요하며
  - 너를 맹세케 하며
  lexicon: HALOT
  rationale: הִפעיל형의 ‘맹세하게 하다/맹세시키다’라는 사역 의미를 살렸고, 왕의 짜증 섞인 반복 질문이라는 뉘앙스를 반영했습니다.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  english_pob_choice: that you speak to me nothing but the truth
  chosen_korean: 너는 내게 진실만 말해야 합니까
  alternatives_korean:
  - 너는 내게 오직 진실만 말해야 합니까
  - 너는 내게 거짓 없이 말해야 합니까
  - 너는 내게 진리만 말해야 합니까
  lexicon: HALOT
  rationale: תְדַבֵּר을 ‘말하다’로, רַק אֱמֶת을 ‘진실만’으로 옮겨 제한의 힘을 유지했습니다. 한국어에서는 ‘말해야 합니까’가 전체 구문의 요구/질문 구조를 가장 자연스럽게 드러냅니다.
- source_word: בְּשֵׁם יְהוָה
  english_pob_choice: in the name of Yahweh
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
  - 여호와의 이름으로
  - 주님의 이름으로
  lexicon: HALOT
  rationale: 본문의 여호와/야훼 신명 표지를 그대로 반영하여, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. ‘이름으로’는 맹세의 권위 아래서 말한다는 관용을 살립니다.
theological_decisions:
- issue: YHWH(יְהוָה) 신명 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 신명 יְהוָה를 사용하므로, 번역문에서도 고유한 언약 이름을 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
