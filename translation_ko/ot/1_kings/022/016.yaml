  - 왕이 그에게 말했습니다
  lexicon: WLC/HALOT
  rationale: 와우-연속형의 서술 진행을 한국어의 자연스러운 시간 흐름인 ‘그때’로 옮겼고, 목적어는 문맥상 분명하므로 본문에는 반복을 줄였습니다.
- source_word: מַשְׁבִּעֶךָ
  english_pob_choice: must I make you swear
  chosen_korean: 너를 맹세시키며
  alternatives_korean:
  - 너에게 맹세하게 하며
