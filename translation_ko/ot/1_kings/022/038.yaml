  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁטֹ֨ף אֶת הָ/רֶ֜כֶב עַ֣ל בְּרֵכַ֣ת שֹׁמְר֗וֹן וַ/יָּלֹ֤קּוּ הַ/כְּלָבִים֙ אֶת דָּמ֔/וֹ וְ/הַ/זֹּנ֖וֹת רָחָ֑צוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֵּֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/038.yaml
  text: And they washed the chariot at the pool of Samaria[a], and the dogs licked up his blood, and the prostitutes washed there, according to the word of Yahweh that he had spoken.
  footnotes:
  - marker: a
    text: Or 'the prostitutes washed themselves' or 'bathed.' The Hebrew verb does not state the object explicitly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 사마리아 못가에서 전차를 씻었고, 개들이 그의 피를 핥았으며, 창녀들이 그곳에서 몸을 씻었습니다. 야훼께서 말씀하신 말씀대로였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 씻은 대상(반사적 목적어)을 분명히 밝히지 않습니다. 따라서 ‘몸을 씻었습니다’ 또는 ‘목욕했습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁטֹף
  english_pob_choice: they washed
  chosen_korean: 그들은 … 씻었고
  alternatives_korean:
  - 사람들이 … 씻었고
  - 그가 … 씻었고
  lexicon: HALOT
  rationale: 히브리어 동사는 3인칭 단수이지만, 문맥상 불특정한 행위자를 한국어에서는 복수 주어로 자연스럽게 풀어 주는 편이 읽기 좋고, 전차가 실제로 씻긴 장면도 선명하게 전달됩니다.
- source_word: בְּרֵכַת שֹׁמְרוֹן
  english_pob_choice: the pool of Samaria
  chosen_korean: 사마리아 못
  alternatives_korean:
  - 사마리아 연못
  - 사마리아 물웅덩이
  lexicon: HALOT
  rationale: בְּרֵכָה는 물 저장소/못을 가리키므로, 한국어에서는 성경적이면서도 현대적인 ‘못’이 가장 무난합니다.
- source_word: וַיָּלֹקּוּ הַכְּלָבִים
  english_pob_choice: the dogs licked up
  chosen_korean: 개들이 … 핥았으며
  alternatives_korean:
  - 개들이 … 핥아 먹었으며
  - 개들이 … 핥았고
  lexicon: HALOT
  rationale: 동사의 핵심은 ‘핥다’이며, 히브리어의 생생함을 살리되 한국어에서는 ‘핥아 먹다’보다 과장되지 않게 ‘핥다’를 택했습니다.
- source_word: וְהַזֹּנוֹת רָחָצוּ
  english_pob_choice: the prostitutes washed there
  chosen_korean: 창녀들이 그곳에서 몸을 씻었습니다
  alternatives_korean:
  - 창녀들이 그곳에서 씻었습니다
  - 창녀들이 그곳에서 목욕했습니다
  lexicon: HALOT
  rationale: 히브리어는 목적어를 명시하지 않아, POB의 주석처럼 ‘몸을 씻다/목욕하다’ 가능성을 열어 두어야 합니다. 본문에는 행동의 결과보다 그곳에서 씻었다는 점만 분명히 드러내는 표현이 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: Project default glossary
  rationale: 본문이 직접 사용하는 이름이므로, 프로젝트 기본 용례에 따라 ‘야훼’로 옮겨 언약적 고유명을 보존했습니다.
theological_decisions:
- issue: וְהַזֹּנוֹת רָחָצוּ의 문법적 모호성
  chosen_reading: 창녀들이 그곳에서 몸을 씻었습니다
  alternative_readings:
  - 창녀들이 그곳에서 씻었습니다
  - 창녀들이 그곳에서 몸을 씻었는지/목욕했는지는 분명하지 않습니다
  rationale: 히브리어는 주어는 분명하지만 씻은 대상은 생략되어 있습니다. 의미를 과도하게 확정하지 않으면서도, 독자가 장면을 이해할 수 있도록 POB의 해석적 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: preserve interpretive tension rather than resolve it'
