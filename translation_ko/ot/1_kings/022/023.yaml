source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/023.yaml
  text: And now[a], behold, Yahweh has put a lying spirit in the mouth of all these prophets of yours[b], and Yahweh has spoken disaster against you.
  footnotes:
  - marker: a
    text: Or 'a spirit of falsehood.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD has spoken calamity against you.' The Hebrew term can denote disaster or calamity in judgment contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제 보십시오. 야훼께서 이 모든 예언자들인 당신의 입에 거짓의 영을 넣으셨고, 야훼께서 당신에게 재앙을 말씀하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “거짓의 영.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “야훼께서 당신에게 재난을 말씀하셨습니다.” 이 히브리어는 심판 문맥에서 재앙이나 재난을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그리고 지금
  lexicon: HALOT
  rationale: 담화 전환의 접속사 וְ와 시간 부사 עַתָּה를 함께 살려, 단순한 시간표시보다 이어지는 선언의 느낌을 유지했습니다.
- source_word: הִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보시오
  lexicon: HALOT
  rationale: 예언적 경고의 주의 환기 기능을 현대 한국어의 공적·격식체로 살렸습니다.
- source_word: רוּחַ שֶׁקֶר
  english_pob_choice: a lying spirit
  chosen_korean: 거짓의 영
  alternatives_korean:
  - 거짓말하는 영
  - 거짓 영
  lexicon: HALOT
  rationale: 직역에 치우치지 않되 '거짓'의 성격을 분명히 하여, 영어 POB가 지적한 'spirit of falsehood'의 의미 범위를 한국어로 반영했습니다.
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  english_pob_choice: has spoken disaster against you
  chosen_korean: 당신에게 재앙을 말씀하셨습니다
  alternatives_korean:
  - 당신에게 재난을 말씀하셨습니다
  - 당신에게 화를 말씀하셨습니다
  lexicon: HALOT
  rationale: רָעָה를 도덕적 '악'이 아니라 심판적 '재앙'으로 옮겨, 본문의 경고 성격을 분명히 했습니다.
theological_decisions:
- issue: 여호와의 직접적 행위와 예언의 거짓 영
  chosen_reading: “야훼께서 … 거짓의 영을 넣으셨고”를 직역하여 신적 주권과 기만의 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 야훼께서 … 거짓의 영을 허락하셨고
  - 야훼께서 … 거짓의 영을 보내셨고
  rationale: 본문은 허용으로 완화하지 않고 직접적 행위를 진술합니다. 번역도 그 긴장을 해소하지 않고 드러내는 것이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
