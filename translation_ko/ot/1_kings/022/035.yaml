  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תַּעֲלֶ֤ה הַ/מִּלְחָמָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/הַ/מֶּ֗לֶךְ הָיָ֧ה מָעֳמָ֛ד בַּ/מֶּרְכָּבָ֖ה נֹ֣כַח אֲרָ֑ם וַ/יָּ֣מָת בָּ/עֶ֔רֶב וַ/יִּ֥צֶק דַּֽם הַ/מַּכָּ֖ה אֶל חֵ֥יק הָ/רָֽכֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/035.yaml
  text: And the battle intensified that day[a], and the king remained standing in the chariot facing Aram, and he died in the evening[c][b]; and the blood from the wound flowed into the bottom of the chariot.
  footnotes:
  - marker: a
    text: Or 'the battle grew' or more literally 'the battle went up' that day.
    reason: lexical_alternative
  - marker: b
    text: Or 'the king stood in the chariot'; the Hebrew form may imply that he was made to remain standing or was kept upright.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'into the bosom/lap of the chariot,' an idiom for the inner or lower part of the chariot.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 전투가 격화되었고, 왕은 아람을 마주한 채 병거에 그대로 서 있었으며, 저녁에 죽었습니다. 그리고 상처에서 나온 피가 병거의 바닥으로 흘러들었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘격화되다’는 히브리어의 문자적 ‘올라가다’를 자연스럽게 옮긴 것으로, 문맥상 전투의 고조를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 형태는 ‘왕이 병거 안에 서 있었다’ 또는 ‘서 있게 되어 있었다’는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘병거의 품/품속’이며, 병거의 내부나 아래쪽을 가리키는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה הַמִּלְחָמָה
  english_pob_choice: And the battle intensified
  chosen_korean: 전투가 격화되었고
  alternatives_korean:
  - 전투가 올라갔고
  - 전투가 커졌고
  - 전투가 치열해졌고
  lexicon: HALOT
  rationale: עלה와 ‘전투’의 결합은 진행/상승이 아니라 전투의 고조를 뜻하므로, 한국어에서는 자연스럽고 의미를 살리는 ‘격화되다’로 옮겼습니다.
- source_word: מָעֳמָד
  english_pob_choice: remained standing
  chosen_korean: 그대로 서 있었으며
  alternatives_korean:
  - 서 있었으며
  - 서 있게 되었으며
  - 버텨 서 있었으며
  lexicon: HALOT
  rationale: 이 표현은 단순히 ‘섰다’보다 유지되거나 강제로 지속된 상태를 시사하므로, 문맥의 긴장을 살리면서도 과도한 해석을 피하는 ‘그대로 서 있었다’로 옮겼습니다.
- source_word: נֹכַח אֲרָם
  english_pob_choice: facing Aram
  chosen_korean: 아람을 마주한 채
  alternatives_korean:
  - 아람을 향하여
  - 아람을 마주 보며
  - 아람 앞에
  lexicon: HALOT
  rationale: נֹכַח는 ‘대면한/마주한’ 방향성을 나타내므로, 전투 장면의 위치 관계를 자연스럽게 드러내는 ‘마주한 채’를 선택했습니다.
- source_word: חֵיק הָרָכֶב
  english_pob_choice: the bottom of the chariot
  chosen_korean: 병거의 바닥
  alternatives_korean:
  - 병거의 품
  - 병거의 안쪽
  - 병거의 바닥 부분
  lexicon: HALOT
  rationale: ‘bosom/lap’의 직역은 한국어에서 부자연스럽기 때문에, 피가 모이는 아래쪽 내부를 가리키는 관용적 의미를 살려 ‘병거의 바닥’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 서술의 상태 지속 뉘앙스
  chosen_reading: 왕은 병거 안에 서 있었으며, 단순한 정지 상태를 넘어서 전투 중 상처 입은 채 자세가 유지된 것으로 읽었습니다.
  alternative_readings:
  - 왕은 단지 병거에 섰습니다.
  - 왕은 병거에 받쳐 세워졌습니다.
  rationale: 문맥이 아합의 치명상 이후를 서술하므로, 히브리어의 상태 지속/유지 뉘앙스를 반영하되, 원문이 명시하지 않은 수단은 덧붙이지 않았습니다.
  doctrine_reference: 본문 서술의 문법·문맥적 뉘앙스
