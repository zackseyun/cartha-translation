  naturalness: 초안의 ‘야훼께서 살아 계심을 두고 말합니다’는 맹세의 수행적 기능이 충분히 드러나지 않고, 뒤의 ‘말씀하시는 것은 무엇이든지’는 다소 부자연스럽습니다. ‘맹세합니다’ 및 ‘무엇을 말씀하시든지, 저는 그것을’이 현대 표준 한국어 합쇼체에 더 자연스럽습니다.
  terminology: 고유한 신명 יְהוָה는 프로젝트 방침과 원문에 따라 ‘야훼’로 유지했습니다. 미가야와 ‘말씀하다’도 적절합니다.
