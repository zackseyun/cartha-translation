id: 1KI.22.14
reference: 1 Kings 22:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֠י אֶת אֲשֶׁ֨ר יֹאמַ֧ר יְהוָ֛ה אֵלַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/014.yaml
  text: And Micaiah said[a], “As Yahweh lives, whatever Yahweh says to me, that I will speak.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''As Yahweh lives.'' The main text follows the project''s standard rendering of the divine name as ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 미가야가 말했습니다. 「야훼께서 살아 계심을 두고 맹세합니다.[a] 야훼께서 제게 무엇을 말씀하시든지, 저는 그것을 말하겠습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야훼께서 살아 계심을 두고’는 엄숙한 맹세 공식입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 그러고는 말했습니다
  lexicon: HALOT
  rationale: 서사적 wayyiqtol을 자연스러운 한국어 과거 서술로 옮기되, 불필요한 접속을 덧붙이지 않아 직접화법 도입 기능을 살렸습니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서 살아 계심을 두고 말합니다
  alternatives_korean:
  - 야훼께서 살아 계십니다
  - 야훼의 삶을 두고 말합니다
  lexicon: HALOT
  rationale: 히브리어의 서약/맹세 공식은 단순 진술이 아니라 엄숙한 선서를 뜻하므로, 한국어에서도 맹세의 힘이 드러나도록 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신적 이름 יְהוָה는 칭호가 아니라 고유명인 ‘야훼’로 옮겼습니다.
- source_word: אֵת אֲשֶׁר ... אֹתוֹ
  english_pob_choice: whatever ... that
  chosen_korean: 말씀하시는 것은 무엇이든지 ... 그대로
  alternatives_korean:
  - 무엇을 말씀하시든지 ... 그것을
  - 말씀하시는 대로
  lexicon: HALOT
  rationale: 목적절-관계절 구조를 한국어의 ‘무엇이든지’로 자연스럽게 풀어, 야훼의 말씀을 그대로 전달하겠다는 의미를 보존했습니다.
- source_word: אֲדַבֵּר
  english_pob_choice: I will speak
  chosen_korean: 내가 그대로 말하겠습니다
  alternatives_korean:
  - 내가 말하겠습니다
  - 내가 전하겠습니다
  lexicon: HALOT
  rationale: דבר의 기본 의미인 ‘말하다/선포하다’를 살리면서, 선지자의 책임 있는 응답이라는 맥락을 반영해 ‘그대로’로 응답의 충실성을 드러냈습니다.
theological_decisions:
- issue: 맹세 공식의 한국어 강도
  chosen_reading: ‘야훼께서 살아 계심을 두고 말합니다’로 번역해 선서의 엄숙함을 유지했습니다.
  alternative_readings:
  - ‘야훼께서 살아 계십니다’
  - ‘야훼를 두고 맹세합니다’
  rationale: 본문은 단순한 사실 진술이 아니라 예언자의 엄숙한 선서이므로, 한국어에서도 맹세적 기능이 분명히 드러나야 합니다.
  doctrine_reference: 히브리어 맹세 공식 חַי יְהוָה
- issue: 직접화법 안의 1인칭 종결
  chosen_reading: 미가야의 응답은 전체를 합쇼체로 유지하되, 서약 인용문 내부는 평서형 1인칭으로 그대로 두었습니다.
  alternative_readings:
  - 인용문 전체를 높임말로 평준화
  - 인용문을 더 구어적으로 완화
  rationale: 원문은 선지자의 직접 발화이므로, 문체는 현대적이되 발화 내부의 긴장감과 확정성을 보존하는 편이 본문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 직접화법의 담화 등록 유지
