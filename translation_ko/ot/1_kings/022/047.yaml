  yaml_path: translation/ot/1_kings/022/047.yaml
  text: And he removed from the land the rest of the cult prostitutes who remained in the days of Asa his father[a].
  footnotes:
  - marker: a
    text: Or 'the male cult prostitutes.' The Hebrew קָדֵשׁ is a masculine term used for persons involved in illicit cultic sexual practice.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 아버지 아사 시대에 남아 있던 제의 남창들을 그 땅에서 제거했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제의 성매매자들.’ 히브리어 קָדֵשׁ는 금지된 제의 성행위에 관여한 사람을 가리키는 남성형 용어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  english_pob_choice: And ... the rest of
  chosen_korean: 그 나머지의
  alternatives_korean:
  - 남아 있던 것들의
  - 남은
  lexicon: HALOT
  rationale: יֶתֶר는 남아 있는 나머지를 가리키므로, 문맥상 사람들을 지칭하는 집합적 표현으로 ‘그 나머지의’라고 옮겨 남은 무리를 드러냈습니다.
- source_word: הַקָּדֵשׁ
  english_pob_choice: the cult prostitutes
  chosen_korean: 제의 창기들
  alternatives_korean:
  - 남자 제의 창기들
  - 성적 제의 종사자들
  - 남창들
  lexicon: HALOT
  rationale: קָדֵשׁ는 이 문맥에서 우상 숭배와 결부된 성적 행위에 가담한 사람을 가리키므로, 단순한 ‘거룩한 사람’이 아니라 그 종교적·성적 성격을 함께 드러내는 ‘제의 창기들’로 옮겼습니다.
- source_word: בִּעֵר
  english_pob_choice: he removed
  chosen_korean: 제거했습니다
  alternatives_korean:
  - 치워 버렸습니다
  - 없앴습니다
  - 정화했습니다
  lexicon: HALOT
  rationale: בִּעֵר는 여기서 사람들을 땅에서 없애는 뜻으로 쓰였으므로, 문자적으로 ‘불태웠다’거나 본문이 말하지 않는 강한 처형 의미를 넣지 않고 ‘제거했습니다’로 옮겼습니다.
theological_decisions:
- issue: קָדֵשׁ의 한국어 표현이 가진 문화적·도덕적 뉘앙스
  chosen_reading: ‘제의 창기들’로 옮겨 우상 숭배와 성적 타락의 결합을 드러냈습니다.
  alternative_readings:
  - 남자 제의 창기들
  - 남창들
  - 의례 종사자들
  rationale: 본문은 단순한 성직자를 말하는 것이 아니라 금지된 제의 성행위와 연결된 집단을 가리키므로, 그 도덕적 긴장을 희석하지 않는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
