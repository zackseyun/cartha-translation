    rationale: ‘알지 못합니까?’는 ‘Do you not know?’에 해당하지만, 히브리어에는 부정사가 없습니다.
  - severity: high
    issue: 무위를 무능으로 바꾼 표현
    rationale: ‘빼앗아 오지 못하고 있습니다’는 하지 못한다는 능력·상황상의 불가능을 함축합니다. מַחְשִׁים은 여기서 빼앗아 오는 일에 대해 잠잠히, 곧 아무 행동도 하지 않는다는 책망입니다.
  - severity: medium
    issue: 각주 표지의 위치와 각주 내용의 불일치
    rationale: 초안에서는 a와 b가 문장 끝에 함께 놓였으나, a는 מַחְשִׁים 관련 표현에, b는 ‘아람’에 붙어야 합니다. 또한 a의 ‘idiom’은 한국어 문장 안에서 불필요한 영어 혼용입니다.
