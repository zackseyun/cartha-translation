base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/003.yaml
  text: And the king of Israel said to his servants[a], “Do you know that Ramoth-gilead belongs to us[b], yet we are doing nothing to take it from the hand of the king of Aram?”
  footnotes:
  - marker: a
    text: Or, more literally, “we are silent from taking it.” The Hebrew idiom conveys culpable inaction.
    reason: lexical_alternative
  - marker: b
    text: Aram is the Hebrew name often rendered “Syria” in older English translations.
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘 왕이 자신의 신하들에게 말했습니다. “길르앗 라못이 우리 것이라는 것을 알고 있습니까? 그런데도 우리는 아람[b] 왕의 손에서 그것을 빼앗아 오려고 아무것도 하지 않고 있습니까?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 더 직역하면 ‘그것을 빼앗아 오는 일에 잠잠하고 있다’입니다. 문맥상 책임 있게 행동하지 않는 무위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아람’은 옛 번역에서 흔히 ‘시리아’로 옮기기도 하는 히브리어 명칭입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 자기 신하들
  alternatives_korean:
  - 자기 종들
  - 자기 시종들
  lexicon: HALOT
  rationale: 왕이 부리는 궁정 인물을 가리키는 문맥이므로, 한국어에서는 단순한 ‘종’보다 관청·궁정의 관계를 드러내는 ‘신하들’이 자연스럽고 문맥에 맞습니다.
- source_word: כִּי לָנוּ רָמֹת גִּלְעָד
  english_pob_choice: that Ramoth-gilead belongs to us
  chosen_korean: 길르앗 라못이 우리 것이란 것을
  alternatives_korean:
  - 길르앗 라못이 우리에게 속한 것을
  - 길르앗 라못이 우리의 것임을
  lexicon: HALOT
  rationale: 소유/권리 주장인 לָנוּ의 힘을 살려, 장소 이름 뒤에 ‘우리 것’이라는 직설적 소유 표현을 두었습니다.
- source_word: מַחְשִׁים
  english_pob_choice: we are doing nothing
  chosen_korean: 우리는 ... 빼앗아 오지 못하고 있습니다
  alternatives_korean:
  - 우리는 아무것도 하지 않고 있습니다
  - 우리는 침묵하고 있습니다
  lexicon: HALOT
  rationale: 이 동사는 문자적으로 ‘잠잠하다/침묵하다’의 뜻이지만, 문맥상 책망받아 마땅한 무위와 미이행을 가리키므로 한국어에서는 결과를 드러내는 ‘빼앗아 오지 못하고 있습니다’로 옮겼습니다.
- source_word: מִיַּד
  english_pob_choice: from the hand of
  chosen_korean: '... 손에서'
  alternatives_korean:
  - '... 권세에서'
  - '... 지배에서'
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 직역에 가까운 ‘손에서’를 유지해, 소유보다 통치·지배의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: ארם의 한국어 표기
  chosen_reading: 아람
  alternative_readings:
