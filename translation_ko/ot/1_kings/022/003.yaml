  rationale: POB의 원칙처럼 히브리어 지명을 후대 지리명으로 바꾸지 않고 원어 지명을 음역해, 이 구절의 역사적·문헌적 배경을 유지했습니다.
  doctrine_reference: source-language fidelity / historical setting
