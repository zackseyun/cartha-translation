revisions:
- from: 이스라엘 왕이 자기 신하들에게 말했습니다. 「길르앗 라못이 우리 것이란 것을 알지 못합니까? 그런데도 우리는 아람 왕의 손에서 그것을 빼앗아 오지 못하고 있습니다」[a][b]
  to: 이스라엘 왕이 자신의 신하들에게 말했습니다. “길르앗 라못이 우리 것이라는 것을 알고 있습니까? 그런데도 우리는 아람[b] 왕의 손에서 그것을 빼앗아 오려고 아무것도 하지 않고 있습니까?[a]”
  rationale: 명시되지 않은 부정을 제거하고, ‘못하다’가 더하는 무능의 뉘앙스를 배제했습니다. ‘아무것도 하지 않고’는 문맥상 מַחְשִׁים의 책망받는 무위를 자연스럽게 드러내며, ‘빼앗아 오려고’는 뒤따르는 부정사 구문의 행동 목표를 반영합니다. 각주 표지는 해당 어휘에 직접 붙이고, 각주 문구를 현대 한국어로 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:51:10Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘알지 못합니까?’는 히브리어 הֲיְדַעְתֶּם(‘알고 있습니까?’)에 없는 부정을 도입합니다. 또한 ‘빼앗아 오지 못하고 있습니다’는 מַחְשִׁים의 자발적·책임 있는 무위를 능력 또는 가능성의 결여로 바꿉니다. 이를 ‘...하려고 아무것도 하지 않고 있습니까?’로 고쳐 원문의 수사적 질문과 무위의 뜻을 보존했습니다.
  naturalness: ‘자신의 신하들’, ‘우리 것이라는 것을 알고 있습니까? 그런데도 ... 아무것도 하지 않고 있습니까?’는 현대 표준 한국어의 격식 있는 문체로 자연스럽습니다. 직접 인용 안의 ‘있습니까?’는 요청된 합쇼체를 유지합니다.
  terminology: ‘길르앗 라못’과 ‘아람’을 유지해 원어 지명·명칭을 반영했습니다. עֲבָדָיו는 왕궁 문맥에서 ‘신하들’로 옮길 수 있습니다. מִיַּד의 관용적 지배·통제 이미지는 ‘아람 왕의 손에서’로 보존했습니다.
