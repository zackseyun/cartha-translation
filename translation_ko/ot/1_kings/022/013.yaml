base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/013.yaml
  text: And the messenger who had gone to summon Micaiah spoke to him[a], saying, “Look now, the words of the prophets are with one mouth favorable to the king. Please let your word be like the word of one of them, and speak favorably.”
  footnotes:
  - marker: a
    text: Hebrew literally, “with one mouth,” an idiom meaning “with one voice” or “unanimously.”
    reason: lexical_alternative
translation:
  language: ko
  text: 미가야를 부르러 간 그 사자가 그에게 말했습니다. “보십시오, 예언자들의 말은 모두 왕에게 유리합니다. 부디 당신의 말도 그들 가운데 한 사람의 말처럼 되게 하시고, 왕에게 유리하게 말씀하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “한 입으로”이며, “한목소리로” 또는 “일치하여”라는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  english_pob_choice: the messenger
  chosen_korean: 그 사자
  alternatives_korean:
  - 그 메신저
  - 그 천사
  lexicon: HALOT
  rationale: 문맥상 하늘 존재가 아니라 미가야를 부르러 간 인간 사자이므로, 한국어도 전통 교회어보다 문맥 직역에 가까운 ‘사자’를 택했습니다.
- source_word: לִקְרֹא
  english_pob_choice: to summon
  chosen_korean: 부르러
  alternatives_korean:
  - 소환하려
  - 청하려
  lexicon: HALOT
  rationale: 왕 앞의 예언자를 데려오게 하는 공식적 요청이지만, 한국어에서는 과도한 법정/행정 어감을 줄인 ‘부르러’가 자연스럽습니다.
- source_word: פֶּה אֶחָד
  english_pob_choice: with one mouth
  chosen_korean: 한 입에서
  alternatives_korean:
  - 한 목소리로
  - 한 입으로
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지를 살려 ‘한 입에서’로 옮기되, 한국어에서 이해 가능한 범위 안에서 원문의 비유성을 유지했습니다.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  english_pob_choice: favorable to the king
  chosen_korean: 왕에게 좋게
  alternatives_korean:
  - 왕에게 유리하게
  - 왕에게 호의적으로
  lexicon: HALOT
  rationale: 직역하면 ‘좋은’의 방향성이 드러나지 않으므로, 원문의 평가적 의미를 살려 ‘왕에게 좋게’라고 옮겼습니다.
- source_word: וְדִבַּרְתָּ טּוֹב
  english_pob_choice: and speak favorably
  chosen_korean: 좋게 말하십시오
  alternatives_korean:
  - 호의적으로 말하십시오
  - 좋은 말을 하십시오
  lexicon: HALOT
  rationale: 동사의 부사적 의미를 한국어로 자연스럽게 풀어 ‘좋게 말하십시오’로 옮기되, 원문의 내용적 요구가 ‘칭찬하라’가 아니라 ‘유리하게 말하라’는 점을 보존했습니다.
theological_decisions:
- issue: 인용문 안의 청유/명령 어조
  chosen_reading: 직접화법 안에서도 공손한 부탁과 명령이 함께 드러나도록 ‘보소서’, ‘부디’, ‘하십시오’를 유지했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 더 강한 명령형으로 일원화
  rationale: 본문은 미가야에게 예언의 방향을 조정해 달라는 정치적 압박을 담고 있으므로, 한국어에서도 부탁과 명령이 섞인 긴장을 드러내는 편이 원문의 효과를 보존합니다.
  doctrine_reference: 서사 내 화행의 보존
