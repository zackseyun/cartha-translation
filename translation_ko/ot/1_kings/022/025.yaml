translation:
  language: ko
  text: 미가야가 말했습니다. 「보십시오. 당신은 그 날에 방에서 방으로 들어가며 숨어야 할 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘방에서 방으로’라는 반복 표현으로, 안쪽으로 물러나 숨는 움직임을 나타냅니다.
    reason: lexical_alternative
