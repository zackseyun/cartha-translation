  text: And Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide.”
  footnotes:
  - marker: a
    text: Or “into an inner room,” or “from chamber to chamber.” The Hebrew expression literally repeats “room” and conveys retreating inward to hide.
    reason: lexical_alternative
translation:
  language: ko
  text: 미가야가 말했습니다. 「보십시오. 당신이 숨으려고 방에서 방으로 들어갈 그날에, 당신은 보게 될 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘방에서 방으로’라고 반복하여, 숨기 위해 더 안쪽으로 물러가는 움직임을 나타냅니다. 또는 ‘안쪽 방으로’라고 옮길 수 있습니다.
    reason: lexical_alternative
