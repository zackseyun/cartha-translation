  source_fidelity: 원문에서 미워하는 주체는 이스라엘 왕(‘나는 그를 미워합니다’)인데, 초안은 이를 ‘그는 나를 미워합니다’로 뒤바꾸었습니다. 또한 מֵאֹתוֹ의 매개/출처 의미가 본문에서는 빠지고 각주에만 남아 있어, 본문에 반영하는 편이 적절합니다.
  naturalness: 합쇼체는 대체로 자연스럽지만, 왕의 발화 주체를 바로잡고 ‘그를 통해 야훼께 여쭐’로 표현하면 의미와 한국어 문장이 모두 더 분명해집니다. ‘좋은 것/나쁜 것’을 예언한다는 표현은 원문의 선악 대조와 대상의 포괄성을 유지합니다.
  terminology: ‘야훼’는 제공된 프로젝트 방침 및 영어 감사 기록과 일치합니다. מִיכָיְהוּ는 표준 한국어 성서식 관례에 따라 ‘미가야’로 통일하는 것이 자연스럽습니다. ‘임라의 아들’이라는 부칭도 보존했습니다.
