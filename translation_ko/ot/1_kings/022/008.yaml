base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/008.yaml
  text: 'And the king of Israel said to Jehoshaphat[a], “There is still one more man through whom to inquire of Yahweh, but I hate him, because he does not prophesy good concerning me, but only evil: Micaiah son of Imlah.” And Jehoshaphat said, “Let not the king say so.”'
  footnotes:
  - marker: a
    text: Or, “to inquire of the LORD through him.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 왕이 여호사밧에게 말했습니다. “그를 통해 야훼께 여쭐 사람이 아직 한 명 더 있습니다. 그러나 나는 그를 미워합니다. 그가 나에 대하여 좋은 것은 예언하지 않고 나쁜 것만 예언하기 때문입니다. 그는 임라의 아들 미가야입니다.” 여호사밧이 말했습니다. “왕께서는 그렇게 말씀하지 마십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그에게서 야훼의 뜻을 물을 사람이.”
    reason: lexical_alternative
lexical_decisions:
