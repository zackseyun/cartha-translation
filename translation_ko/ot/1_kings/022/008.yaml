base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/008.yaml
  text: 'And the king of Israel said to Jehoshaphat[a], “There is still one more man through whom to inquire of Yahweh, but I hate him, because he does not prophesy good concerning me, but only evil: Micaiah son of Imlah.” And Jehoshaphat said, “Let not the king say so.”'
  footnotes:
  - marker: a
    text: Or, “to inquire of the LORD through him.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 왕이 여호사밧에게 말했습니다. “야훼께 물으려고 아직 한 사람이 더 있습니다. 그러나 그는 나를 미워합니다. 그가 내게 대하여 선한 말은 하지 않고 오직 악한 말만 예언하기 때문입니다. 바로 므가야, 임라의 아들입니다.” 여호사밧이 말했습니다. “왕께서는 그렇게 말씀하지 마십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 통해 야훼께 묻으려고.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 프로젝트 기본값에 따라 하나님의 고유 이름은 ‘야훼’로 옮겨, 언약적 고유성을 유지했습니다.
- source_word: לִדְרֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  english_pob_choice: through whom to inquire of the LORD
  chosen_korean: 야훼께 물으려고
  alternatives_korean:
  - 그를 통해 야훼를 찾으려고
  - 그를 통해 야훼께 여쭈려고
  lexicon: HALOT
  rationale: דָּרַשׁ는 예언 문맥에서 ‘찾다’보다 ‘묻다/여쭙다’가 자연스러우며, 매개 의미는 한국어에서 간명하게 처리했습니다.
- source_word: שְׂנֵאתִיו
  english_pob_choice: I hate him
  chosen_korean: 그는 나를 미워합니다
  alternatives_korean:
  - 나는 그를 미워합니다
  - 나는 그를 증오합니다
  lexicon: HALOT
  rationale: 히브리어의 강한 적대 감정을 살리되, 직접 화법 안에서 왕의 발화를 자연스럽게 보이도록 현재형으로 옮겼습니다.
- source_word: לֹא יִתְנַבֵּא עָלַי טוֹב כִּי אִם רָע
  english_pob_choice: he does not prophesy good concerning me, but only evil
  chosen_korean: 내게 대하여 선한 말은 하지 않고 오직 악한 말만 예언하기 때문입니다
  alternatives_korean:
  - 내게 좋은 일은 예언하지 않고 오직 나쁜 일만 예언하기 때문입니다
  - 내게 대하여 선한 것은 예언하지 않고 악한 것만 예언하기 때문입니다
  lexicon: HALOT
  rationale: ‘선/악’의 대조를 유지하면서, 한국어에서 ‘예언하다’의 목적어 결합을 자연스럽게 풀어 주었습니다.
- source_word: מִיכָיְהוּ בֶּן יִמְלָה
  english_pob_choice: Micaiah son of Imlah
  chosen_korean: 므가야, 임라의 아들
  alternatives_korean:
  - 미가야, 임라의 아들
  - 미가야후, 임라의 아들
  lexicon: HALOT
  rationale: 고유명사는 현대 음역 관례를 따르되, 본문에 보이는 이름 형태를 반영해 ‘므가야’로 옮겼습니다.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  english_pob_choice: Let not the king say so
  chosen_korean: 왕께서는 그렇게 말씀하지 마십시오
  alternatives_korean:
  - 왕은 그렇게 말하지 마십시오
  - 왕께서는 그런 말씀을 하지 마십시오
  lexicon: HALOT
  rationale: אַל + 미완료형의 금지 뉘앙스를 존대형 명령으로 살렸고, 여호사밧의 정중한 응답 어조를 반영했습니다.
