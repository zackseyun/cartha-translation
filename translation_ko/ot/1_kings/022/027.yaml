base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/027.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I come in peace.’'
  footnotes:
  - marker: a
    text: Or 'bread of distress' and 'water of distress'; the expression likely refers to harsh or meager prison rations.
    reason: lexical_alternative
translation:
  language: ko
  text: ‘왕께서 이렇게 말씀하십니다. 이 사람을 감옥에 가두고, 내가 평안히 돌아올 때까지 고난의 빵과 고난의 물을 주십시오.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고난의 빵’과 ‘고난의 물’은 직역에 가깝습니다. 이 표현은 가혹하거나 매우 빈약한 감옥의 배급을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  english_pob_choice: Thus says the king
  chosen_korean: ‘왕이 이와 같이 말하십니다’
  alternatives_korean:
  - ‘왕이 이렇게 말씀하십니다’
  - ‘왕이 이같이 말합니다’
  lexicon: WLC
  rationale: 전령식 공식문을 한국어에서 자연스럽게 살리되, 왕의 명령문 맥락에 맞게 공손한 문체로 옮겼습니다. ‘이와 같이’는 כֹּה의 형식성을 유지합니다.
- source_word: בֵּית הַכֶּלֶא
  english_pob_choice: in the prison
  chosen_korean: 감옥에
  alternatives_korean:
  - 감옥 안에
  - 구금소에
  lexicon: WLC
  rationale: 히브리어는 직역하면 ‘감금의 집’이지만, 현대 한국어에서는 ‘감옥’이 가장 직접적이고 읽기 자연스럽습니다.
- source_word: לֶחֶם לַחַץ / וּמַיִם לַחַץ
  english_pob_choice: bread of affliction / water of affliction
  chosen_korean: 고난의 빵과 고난의 물
  alternatives_korean:
  - 고통의 빵과 고통의 물
  - 곤궁의 빵과 곤궁의 물
  lexicon: WLC
  rationale: POB의 ‘affliction’에 해당하는 라합어 לַחַץ는 단순한 양적 부족보다 억압적 고통과 궁핍을 함께 떠올리게 하므로, ‘고난’으로 옮겨 형벌식 배급의 냉혹함을 드러냈습니다.
- source_word: עַד בֹּאִי בְשָׁלוֹם
  english_pob_choice: until I come in peace
  chosen_korean: 내가 평안히 돌아올 때까지
  alternatives_korean:
  - 내가 평안 가운데 올 때까지
  - 내가 안전하게 돌아올 때까지
  lexicon: WLC
  rationale: בְשָׁלוֹם의 관용적 의미를 한국어의 ‘평안히’로 살리되, 문맥상 귀환을 분명히 하기 위해 ‘돌아올’로 옮겼습니다.
theological_decisions:
- issue: 아합의 ‘평안히’라는 자기 선언에 담긴 서술적 긴장
  chosen_reading: ‘평안히 돌아올’로 옮겨, 독자가 문맥의 반어와 긴장을 읽게 했습니다.
  alternative_readings:
  - ‘안전하게 돌아올’
  - ‘무사히 돌아올’
  rationale: 히브리어 שָׁלוֹם는 여기서 ‘안전함’도 뜻할 수 있으나, 본문은 아합의 자신감 있는 발화를 그대로 보여 주므로 의미를 과도하게 확정하지 않았습니다.
  doctrine_reference: 서술적 긴장 보존
