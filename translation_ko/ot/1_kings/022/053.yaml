base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/053.yaml
  text: And he did what was evil in the eyes of Yahweh and walked in the way of his father, and in the way of his mother, and in the way of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: ko
  text: 그는 야훼께서 보시기에 악한 일을 행했고, 자기 아버지의 길과 자기 어머니의 길과 이스라엘을 죄짓게 한 느밧의 아들 여로보암의 길을 걸었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  english_pob_choice: did what was evil
  chosen_korean: 악한 일을 행하고
  alternatives_korean:
  - 악을 행하고
  - 악한 일을 했고
  lexicon: HALOT
  rationale: עשה + הרע의 관용구를 한국어로 자연스럽게 옮기되, 단순히 ‘악하다’고 형용사화하기보다 ‘악한 일을 행하다’로 행위성을 살렸습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 평가를 나타내는 히브리어 관용구를 그대로 살리면서, POB의 ‘Yahweh’에 맞춰 ‘야훼’로 옮겼습니다.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  english_pob_choice: walked in the way of
  chosen_korean: …의 길로 걸었습니다
  alternatives_korean:
  - …의 길을 따랐습니다
  - …의 방식대로 살았습니다
  lexicon: HALOT
  rationale: ‘길’이라는 은유를 보존해 행동 양식을 드러내고, ‘걸었다’로 히브리어의 관용적 표현을 유지했습니다.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  english_pob_choice: caused Israel to sin
  chosen_korean: 이스라엘을 죄짓게 했습니다
  alternatives_korean:
  - 이스라엘로 죄를 짓게 했습니다
  - 이스라엘을 죄에 빠뜨렸습니다
  lexicon: HALOT
  rationale: 히필의 원인적 의미를 살리면서도 한국어에서 자연스러운 ‘죄짓게 하다’로 옮겼습니다. 단순한 유도보다 강한 책임 귀속을 유지합니다.
- source_word: יָרָבְעָם בֶּן נְבָט
  english_pob_choice: Jeroboam son of Nebat
  chosen_korean: 느밧의 아들 여로보암
  alternatives_korean:
  - 느밧의 아들 여로보암
  - 네밧의 아들 예로보암
  lexicon: HALOT
  rationale: 히브리어의 부자 관계를 보존하면서, 한국어 성경에서 널리 알려진 인명 형태를 사용했습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 יְהוָה를 직접 사용하므로, 프로젝트 기준에 따라 신적 고유명사를 제목어가 아닌 이름으로 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
