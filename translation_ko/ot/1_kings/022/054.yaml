  - 그를 경배했습니다
  lexicon: HALOT
  rationale: שׁחה는 ‘몸을 굽혀 절하다/엎드리다’의 구체적 동작을 가리키므로, 앞의 ‘섬기다’와 중복되지 않도록 ‘절했습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 신적 고유명사 יְהוָה는 대체 호칭이 아니라 음역형 ‘야훼’로 옮겨, 바알과의 대조를 분명히 했습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 신
  - 이스라엘 하나님
  lexicon: HALOT
  rationale: 소유격 결합은 한국어에서도 자연스럽게 ‘이스라엘의 하나님’으로 옮길 수 있으며, 언약적 정체성을 분명히 드러냅니다.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה אָבִיו
  english_pob_choice: just as his father had done
  chosen_korean: 그의 아버지가 행한 모든 것과 같았습니다
  alternatives_korean:
  - 그의 아버지가 한 모든 것과 같았습니다
  - 아버지가 행한 대로였습니다
  lexicon: HALOT
  rationale: כְּכֹל אֲשֶׁר는 ‘모든 것과 같이/대로’의 비교 구조이므로, 축약하지 않고 ‘행한 모든 것과 같았습니다’로 옮겨 반복적 우상숭배의 전면성을 살렸습니다.
theological_decisions:
