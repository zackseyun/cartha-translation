translation:
  language: ko
  text: 그는 바알을 섬기고 그에게 절했습니다[a]. 그는 그의 아버지가 한 모든 일을 따라 이스라엘의 하나님 야훼를 격노하게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
