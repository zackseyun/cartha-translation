  yaml_path: translation/ot/1_kings/022/054.yaml
  text: He served Baal and bowed down to him[a], and he provoked Yahweh, the God of Israel, just as his father had done.
  footnotes:
  - marker: a
    text: Or 'worshiped him'; the Hebrew verb literally refers to bowing down or prostrating oneself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 바알을 섬기고 그에게 절했습니다[a]. 또 이스라엘의 하나님이신 야훼를 노하게 하였는데, 그의 아버지가 행한 모든 것과 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 예배했습니다’. 히브리어 동사는 문자적으로는 ‘절하다/몸을 굽히다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  english_pob_choice: served
  chosen_korean: 섬겼습니다
  alternatives_korean:
  - 예배했습니다
  - 봉사했습니다
  lexicon: HALOT
  rationale: עבד는 기본적으로 ‘섬기다’라는 뜻이며, 우상 숭배 문맥에서는 종교적 섬김까지 포함할 수 있으므로 ‘섬겼습니다’가 어간의 의미를 살리고 뒤의 ‘절했습니다’와 구분됩니다.
- source_word: וַיִּשְׁתַּחֲוֶה לוֹ
  english_pob_choice: bowed down to him
  chosen_korean: 그에게 절했습니다
  alternatives_korean:
  - 그에게 엎드렸습니다
  - 그를 경배했습니다
  lexicon: HALOT
  rationale: שׁחה는 ‘몸을 굽혀 절하다/엎드리다’의 구체적 동작을 가리키므로, 앞의 ‘섬기다’와 중복되지 않도록 ‘절했습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 신적 고유명사 יְהוָה는 대체 호칭이 아니라 음역형 ‘야훼’로 옮겨, 바알과의 대조를 분명히 했습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 신
  - 이스라엘 하나님
  lexicon: HALOT
  rationale: 소유격 결합은 한국어에서도 자연스럽게 ‘이스라엘의 하나님’으로 옮길 수 있으며, 언약적 정체성을 분명히 드러냅니다.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה אָבִיו
  english_pob_choice: just as his father had done
  chosen_korean: 그의 아버지가 행한 모든 것과 같았습니다
  alternatives_korean:
  - 그의 아버지가 한 모든 것과 같았습니다
  - 아버지가 행한 대로였습니다
  lexicon: HALOT
  rationale: כְּכֹל אֲשֶׁר는 ‘모든 것과 같이/대로’의 비교 구조이므로, 축약하지 않고 ‘행한 모든 것과 같았습니다’로 옮겨 반복적 우상숭배의 전면성을 살렸습니다.
theological_decisions:
- issue: יהוה를 한국어에서 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 바알과 대비되는 이스라엘의 언약 하나님을 고유명으로 지칭하므로, 프로젝트 기본값에 따라 대체 칭호보다 음역형을 택하는 것이 본문 효과를 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
