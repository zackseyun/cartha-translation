  text: And Jehoshaphat son of Asa became king over Judah in the fourth year of Ahab king of Israel.
translation:
  language: ko
  text: 그리고 아사의 아들 여호사밧이 아합 이스라엘 왕의 사년째에 유다의 왕이 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִ/יהֽוֹשָׁפָט
  english_pob_choice: And Jehoshaphat
  chosen_korean: 그리고 … 여호사밧이
  alternatives_korean:
  - 또 여호사밧이
  - 여호사밧이
  lexicon: HALOT
  rationale: 문두의 접속 ו를 한국어 서술 흐름에 맞게 ‘그리고’로 옮겨 앞 문맥과의 연결을 살렸습니다. 고유명사는 현대 표기법에 따라 ‘여호사밧’으로 옮겼습니다.
- source_word: בֶּן אָסָא
  english_pob_choice: son of Asa
  chosen_korean: 아사의 아들
  alternatives_korean:
  - 아사의 아들
  - 아사의 아들이
  lexicon: HALOT
  rationale: 히브리어 소유·혈통 구문을 자연스러운 한국어 속격으로 옮겨 족보적 식별 기능을 그대로 드러냈습니다.
- source_word: מָלַךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 다스리기 시작했습니다
  - 즉위했습니다
  lexicon: HALOT
  rationale: מלך의 취임/즉위 시작점을 나타내는 용법을 반영해, 지속적 통치보다 시작점이 드러나는 ‘왕이 되었습니다’로 옮겼습니다.
- source_word: בִּ/שְׁנַת אַרְבַּע לְ/אַחְאָב
  english_pob_choice: in the fourth year of Ahab
  chosen_korean: 아합 … 사년째에
  alternatives_korean:
  - 아합의 사년째에
  - 아합의 넷째 해에
  lexicon: HALOT
  rationale: 왕조 연대 공식의 ‘~의 사년’ 구조를 한국어로 자연스럽게 풀어, 아합의 재위 기준 연호임을 유지했습니다.
theological_decisions:
- issue: 왕위 등극 서술의 어조
  chosen_reading: 역사 기록체에 맞게 단정적 서술로 옮기되, 헌정적·설교적 뉘앙스를 덧붙이지 않았습니다.
  alternative_readings:
  - ‘즉위했습니다’로 더 공식화
  - ‘통치하기 시작했습니다’로 더 설명적으로
  rationale: 본문은 단순한 연대기적 등극 진술이므로, 의미를 확대하지 않고 사실 보고형 한국어로 유지하는 것이 가장 충실합니다.
  doctrine_reference: 역사서 본문 번역 원칙
