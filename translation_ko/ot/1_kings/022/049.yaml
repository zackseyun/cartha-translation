  text: Jehoshaphat made ships of Tarshish to go to Ophir for gold[a], but they did not go[b], because the ships were wrecked at Ezion-geber.
  footnotes:
  - marker: a
    text: Or 'Tarshish ships,' possibly meaning a class of large seagoing vessels rather than ships literally from Tarshish.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'was broken' (singular); the sense is collective, referring to the ships/fleet.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호사밧은 금을 얻기 위해 오빌로 갈 다시스의 배들을 만들었으나[a], 그 배들이 에시온게벨에서 부서졌기 때문에 가지 못했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다시스의 배들’은 문자적으로 다시스와 관련된 배들을 뜻할 수 있으며, 다시스에서 온 배들이 아니라 큰 원양선의 한 종류를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘부서졌다’라는 단수형을 사용하지만, 여기서는 배들 또는 선단 전체를 가리키는 집합적 표현입니다.
    reason: lexical_alternative
