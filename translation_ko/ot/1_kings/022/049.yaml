  yaml_path: translation/ot/1_kings/022/049.yaml
  text: Jehoshaphat made ships of Tarshish to go to Ophir for gold[a], but they did not go[b], because the ships were wrecked at Ezion-geber.
  footnotes:
  - marker: a
    text: Or 'Tarshish ships,' possibly meaning a class of large seagoing vessels rather than ships literally from Tarshish.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'was broken' (singular); the sense is collective, referring to the ships/fleet.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호사밧은 금을 구하여 오빌로 갈 다시스 선단을 만들었으나[a], 배들이 에시온게벨에서 부서졌기 때문에[b] 가지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘다시스의 배들’(큰 원양선의 한 종류)을 뜻할 수 있으므로, 지명 유래의 선박명으로도 읽힙니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수형 ‘부서졌다’이지만, 뜻은 함대 전체가 손상된 집합적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עשר
