  source_fidelity: 여호사밧이 오빌에서 금을 얻기 위한 ‘다시스의 배들’을 만들었으나, 그 배들이 에시온게벨에서 부서져 항해하지 못했다는 기본 의미는 반영되어 있습니다. 다만 ‘금을 구하여 오빌로 갈’은 금을 먼저 구한 뒤 오빌로 간다는 순차적 의미로 읽힐 수 있어, 히브리어의 목적 관계를 더 분명히 해야 합니다. 또한 ‘선단’보다 복수형 ‘배들’이 원문의 표현을 직접적으로 보존합니다.
