  rationale: 히브리어의 목적 표현을 그대로 살려 ‘오빌로 갈’로 옮겼고, 고유명사는 현대 음역에 맞춰 오빌로 표기했습니다.
- source_word: נשברה
  english_pob_choice: were wrecked
  chosen_korean: 배들이 … 부서졌기 때문에
  alternatives_korean:
  - 배들이 … 난파되었기 때문에
  - 배들이 … 깨졌기 때문에
  lexicon: HALOT
  rationale: 동사의 기본 뜻은 ‘부서지다’이지만, 선박 문맥에서 ‘난파되다’도 가능하므로 두 의미를 함께 담아 자연스럽게 처리했습니다.
