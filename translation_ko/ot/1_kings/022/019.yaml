id: 1KI.22.19
reference: 1 Kings 22:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שְׁמַ֣ע דְּבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹמֵ֣ד עָלָ֔י/ו מִ/ימִינ֖/וֹ וּ/מִ/שְּׂמֹאלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/019.yaml
  text: 'Then he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing by him[b], on his right and on his left.”'
  footnotes:
  - marker: a
    text: Or “all the heavenly host” or “all the army of heaven.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “standing over him”; in context, this likely means standing beside him in attendance, as clarified by “on his right and on his left.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. "그러므로 야훼의 말씀을 들으십시오. 나는 야훼께서 그의 보좌에 앉아 계신 것을 보았고, 하늘의 모든 군대가 그의 오른쪽과 왼쪽에 그 곁에 서 있는 것을 보았습니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하늘의 모든 군대” 혹은 “하늘의 모든 천군”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “그 위에 서 있는”입니다. 문맥상 여기서는 그의 곁에 시중들며 서 있는 뜻으로 이해하는 것이 자연스럽습니다. 뒤의 “오른쪽과 왼쪽”이 이를 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 따라서
  lexicon: HALOT
  rationale: 앞선 문맥에서 이어지는 결론·귀결을 드러내는 연결어이므로, 예언적 선언의 격식을 살리면서도 자연스러운 ‘그러므로’가 적절합니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 주님의 말씀
  lexicon: HALOT
  rationale: 예언자적 관용구인 ‘말씀’을 유지하고, 문맥상 신적 이름을 직접 드러내기 위해 ‘야훼’로 옮겼습니다.
- source_word: יֹשֵׁב עַל כִּסְאוֹ
  english_pob_choice: sitting on his throne
  chosen_korean: 그의 보좌에 앉아 계신
  alternatives_korean:
  - 그의 왕좌에 앉아 있는
  - 그 보좌에 좌정하신
  lexicon: HALOT
  rationale: 현재 진행적 모습의 분사이므로 ‘앉아 계신’으로 옮겨 하나님을 향한 존칭을 유지했습니다. ‘보좌’는 왕권과 천상 법정을 함께 드러냅니다.
- source_word: כָל צְבָא הַשָּׁמַיִם
  english_pob_choice: all the host of heaven
  chosen_korean: 하늘의 모든 군대
  alternatives_korean:
  - 하늘의 모든 천상군
  - 하늘의 모든 천군
  lexicon: HALOT
  rationale: צְבָא는 기본적으로 ‘군대/군집’을 뜻하므로, 주석적 판단을 과도하게 좁히지 않으면서도 군사적·천상 법정적 이미지를 살려 ‘군대’로 옮겼습니다.
- source_word: עֹמֵד עָלָיו
  english_pob_choice: standing by him
  chosen_korean: 그 곁에 서 있는
  alternatives_korean:
  - 그에게 서 있는
  - 그 주위에 서 있는
  - 그 위에 서 있는
  lexicon: HALOT
  rationale: 문자적으로는 ‘그 위에/그를 향해 서다’이지만, 뒤의 ‘오른쪽과 왼쪽’이 위치를 구체화하므로 POB의 뜻을 따라 ‘그 곁에 서 있는’으로 풀었습니다.
theological_decisions:
- issue: 여호와/야훼의 신명 표기
  chosen_reading: 본문에서는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 히브리어 המקור이 יְהוָה를 직접 사용하므로, 신적 호칭으로 대체하지 않고 고유 이름을 드러내는 쪽이 본문 의미와 감사 가능성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH → Yahweh'
- issue: 천상의 회중/군대 표현
  chosen_reading: ‘하늘의 모든 군대’로 유지해 천상 법정의 다의성을 살렸습니다.
  alternative_readings:
  - 하늘의 모든 천사들
  - 하늘의 모든 천군
  rationale: 이 표현은 천사들로만 축소되기보다, 왕좌 환상 속 천상 회중 전체를 가리키는 여지를 남깁니다. 원문의 긴장을 해소하지 않고 보존하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
