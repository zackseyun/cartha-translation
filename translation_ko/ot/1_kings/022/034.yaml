base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/034.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to his charioteer, “Turn your hand and take me out of the camp[d][c][b], for I am wounded.”
  footnotes:
  - marker: a
    text: Or “in his innocence,” “without aiming,” or “at random” for the Hebrew לְתֻמּוֹ; here it likely means the archer shot without a specific target in mind.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “between the debaqim and the shiryan,” likely referring to a gap between pieces of armor; the exact technical terms are uncertain.
    reason: cultural_note
  - marker: c
    text: Hebrew “Turn your hand,” an idiom for maneuvering the chariot.
    reason: lexical_alternative
  - marker: d
    text: The Hebrew verb can mean “be sick” or “be wounded”; in this context it refers to being wounded.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 한 사람이 특정 대상을 겨냥하지 않고 활을 쏘아 이스라엘 왕을 갑옷의 이음새와 흉갑 사이에 맞혔습니다[a][b]. 이스라엘 왕이 자기 병거를 모는 사람에게 말했습니다. “병거를 돌려 나를 진영 밖으로 데리고 나가십시오[c]. 나는 부상을 입었습니다[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לְתֻמּוֹ는 직역하면 “그의 순전함으로”이며, 여기서는 특정 대상을 겨냥하지 않고 쏜 것을 뜻하는 듯합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “데바킴과 시르얀 사이에”라고 합니다. 이 갑옷 부속품들의 정확한 명칭과 관계는 불확실하지만, 갑옷의 연결부 또는 틈을 가리키는 것으로 보입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 직역하면 “네 손을 돌려”입니다. 병거를 조종하여 방향을 바꾸라는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: d
    text: 이 동사는 “병들다”로도 옮길 수 있으나, 화살에 맞은 이 문맥에서는 부상을 입었다는 뜻입니다.
    reason: lexical_alternative
