  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֗ישׁ מָשַׁ֤ךְ בַּ/קֶּ֨שֶׁת֙ לְ/תֻמּ֔/וֹ וַ/יַּכֶּה֙ אֶת מֶ֣לֶךְ יִשְׂרָאֵ֔ל בֵּ֥ין הַ/דְּבָקִ֖ים וּ/בֵ֣ין הַ/שִּׁרְיָ֑ן וַ/יֹּ֣אמֶר לְ/רַכָּב֗/וֹ הֲפֹ֥ךְ יָדְ/ךָ֛ וְ/הוֹצִיאֵ֥/נִי מִן הַֽ/מַּחֲנֶ֖ה כִּ֥י הָחֳלֵֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/034.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to his charioteer, “Turn your hand and take me out of the camp[d][c][b], for I am wounded.”
  footnotes:
  - marker: a
    text: Or “in his innocence,” “without aiming,” or “at random” for the Hebrew לְתֻמּוֹ; here it likely means the archer shot without a specific target in mind.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “between the debaqim and the shiryan,” likely referring to a gap between pieces of armor; the exact technical terms are uncertain.
    reason: cultural_note
  - marker: c
    text: Hebrew “Turn your hand,” an idiom for maneuvering the chariot.
    reason: lexical_alternative
  - marker: d
    text: The Hebrew verb can mean “be sick” or “be wounded”; in this context it refers to being wounded.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 한 사람이 아무 목표 없이 활을 당겨 이스라엘 왕을 갑옷의 이음새와 흉갑 사이에 맞혔습니다[a]. 그가 자기 병거꾼에게 말했습니다. “손을 돌려 나를 진영 밖으로 데리고 나가십시오[c][b][d]. 나는 부상을 입었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 정확한 갑옷 부속품의 명칭이 불확실하며, 전투 갑옷의 연결부나 틈을 가리키는 것으로 보입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 “진영에서”라고 되어 있으나, 전투 문맥에서는 군대의 진지 밖으로 옮겨 달라는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 “손을 돌려”이지만, 전차를 조종해 방향을 바꾸라는 관용구입니다.
    reason: lexical_alternative
  - marker: d
    text: 이 동사는 “병들다”로도 옮길 수 있으나, 여기서는 화살에 맞아 다친 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  english_pob_choice: But a man
  chosen_korean: 그러나 한 사람이
  alternatives_korean:
  - 그리고 한 사람이
  - 또 한 사람이
  - 어떤 사람이
  lexicon: HALOT
  rationale: 앞선 전투 서술과의 전환을 살리기 위해 역접을 두었고, 익명의 האיש은 자연스러운 ‘한 사람’으로 옮겼습니다.
- source_word: לְתֻמּוֹ
  english_pob_choice: at random
  chosen_korean: 아무 목표 없이
  alternatives_korean:
  - 무심코
  - 무작정
  - 우연히
  lexicon: HALOT
  rationale: 문맥상 도덕적 ‘순전함’이 아니라 특정 대상을 겨냥하지 않은 사격을 뜻하므로, 의미를 분명히 하되 우연성보다는 의도 부재를 드러냈습니다.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  english_pob_choice: between the joints of the armor and the breastplate
  chosen_korean: 갑옷의 이음새와 흉갑 사이에
  alternatives_korean:
  - 갑옷의 관절 부분과 흉갑 사이에
  - 갑옷의 접합부와 흉갑 사이에
  - 갑옷의 이음새와 갑옷 사이에
  lexicon: HALOT
  rationale: 두 기술 용어의 정확한 비례 관계는 불확실하므로, POB의 마찰적 표현을 따라 ‘이음새’와 ‘사이’로 공간적 취약 지점을 드러냈습니다.
- source_word: לְרַכָּבוֹ
  english_pob_choice: to his charioteer
  chosen_korean: 자기 병거꾼에게
  alternatives_korean:
  - 자기 전차꾼에게
  - 병거를 모는 이에게
  - 자기 전차 운전수에게
  lexicon: HALOT
  rationale: 전투 맥락의 רכּב은 병거를 모는 사람을 가리키므로, 현대 한국어에서 가장 자연스러운 ‘병거꾼’을 택했습니다.
- source_word: הֲפֹךְ יָדְךָ
  english_pob_choice: Turn your hand
  chosen_korean: 손을 돌려
  alternatives_korean:
  - 방향을 돌려
  - 말을 돌려
  - 고삐를 돌려
  lexicon: HALOT
  rationale: 히브리어의 직역성을 살리면서도, 병거를 조종하라는 관용구의 기능을 한국어로 이해 가능하게 유지했습니다.
- source_word: הָחֳלֵיתִי
  english_pob_choice: for I am wounded
  chosen_korean: 나는 부상을 입었습니다
  alternatives_korean:
  - 나는 다쳤습니다
  - 나는 상처를 입었습니다
  - 나는 병이 났습니다
  lexicon: HALOT
  rationale: 이 동사는 문맥에 따라 ‘병들다’도 가능하지만, 화살에 맞은 직후이므로 ‘부상을 입었습니다’가 가장 적절합니다.
theological_decisions:
- issue: 애매한 전술 용어의 처리
  chosen_reading: 갑옷의 이음새와 흉갑 사이에
  alternative_readings:
  - 갑옷의 관절 부분과 흉갑 사이에
  - 갑옷의 접합부와 흉갑 사이에
  rationale: 본문은 정확한 갑옷 부위 명칭의 세부 식별보다, 치명적 약점이 된 틈을 강조합니다. 따라서 기술적 불확실성을 숨기지 않으면서도 서술의 긴박감을 보존했습니다.
  doctrine_reference: 본문 비평 및 역사서 서술의 직역-의역 균형
- issue: 손을 돌리다 관용구의 전달
  chosen_reading: 손을 돌려
  alternative_readings:
  - 방향을 돌려
  - 고삐를 돌려
  rationale: 지시 대상이 전차 조종 동작임을 보여 주되, 히브리어 관용구의 형상을 지우지 않기 위해 직역형을 유지했습니다.
  doctrine_reference: 원문 관용구 보존 원칙
