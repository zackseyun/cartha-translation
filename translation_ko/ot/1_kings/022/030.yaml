source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶל יְהוֹשָׁפָ֗ט הִתְחַפֵּשׂ֙ וָ/בֹ֣א בַ/מִּלְחָמָ֔ה וְ/אַתָּ֖ה לְבַ֣שׁ בְּגָדֶ֑י/ךָ וַ/יִּתְחַפֵּשׂ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יָּב֖וֹא בַּ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/030.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself and went into the battle.
  footnotes:
  - marker: a
    text: Hebrew could be taken as an imperative, 'Disguise yourself and go into the battle,' but the following clause, 'So the king of Israel disguised himself,' strongly supports the sense 'I will disguise myself and go into the battle.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 이스라엘 왕이 여호사밧에게 말했습니다. “나는 변장하고 전투에 들어가겠소[a]. 그러나 당신은 옷을 입으시오.” 그러고서 이스라엘 왕은 변장하고 전투에 들어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 형태상 ‘변장하고 전투에 들어가십시오’라는 여호사밧에게 주는 명령으로도 읽힐 수 있습니다. 그러나 이어지는 ‘이스라엘 왕은 변장하고 전투에 들어갔습니다’라는 서술은 이 말을 왕 자신이 밝힌 계획으로 이해하는 것을 강하게 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  english_pob_choice: I will disguise myself
  chosen_korean: 나는 몸을 위장하고
  alternatives_korean:
  - 내가 변장하고
  - 나는 위장하겠소
  lexicon: HALOT
  rationale: 문맥상 아합이 여호사밧에게 자기 계획을 말하는 것이므로, 영어 POB의 첫인칭 해석을 따라 자기 행동으로 옮겼습니다. '몸을 위장하고'는 전장 상황에서의 외적 변장을 자연스럽게 드러냅니다.
- source_word: וָבֹא בַ/מִּלְחָמָה
  english_pob_choice: and go into the battle
  chosen_korean: 전투에 들어가겠소
  alternatives_korean:
  - 전투로 들어가겠소
  - 전투에 나가겠소
  lexicon: HALOT
  rationale: בוא의 이동 감각을 살려 '들어가다'로 옮겼고, '전투'는 현대 한국어에서 자연스러우면서도 본문의 전장 진입 이미지를 보존합니다.
- source_word: וְ/אַתָּה לְבַשׁ בְּגָדֶי/ךָ
  english_pob_choice: but you, put on your robes
  chosen_korean: 그러나 당신은 옷을 입고 있으시오
  alternatives_korean:
  - 그러나 당신은 예복을 입으시오
  - 당신은 당신의 옷을 입고 있으시오
  lexicon: HALOT
  rationale: 대조는 분명하지만, 히브리어 בגדים는 특정한 '예복'보다 일반적인 '옷/의복'에 가깝습니다. 왕의 외형을 유지하라는 대비를 살리되 과도하게 의례화하지 않기 위해 '옷을 입고 있으시오'로 옮겼습니다.
- source_word: וַ/יִּתְחַפֵּשׂ
  english_pob_choice: disguised himself
  chosen_korean: 몸을 위장하고
  alternatives_korean:
  - 변장하고
  - 위장하였습니다
  lexicon: HALOT
  rationale: 서술 동사도 앞선 자기 의도와 같은 행동을 가리키므로, 동일한 핵심 표현을 반복해 연속성을 살렸습니다. '변장'도 가능하지만, 앞의 '몸을 위장하다'와 통일했습니다.
theological_decisions:
- issue: 아합의 발화가 여호사밧에게 주는 지시처럼 보이는지, 아니면 아합 자신의 계획 진술인지
  chosen_reading: 문맥에 따라 아합 자신의 계획 진술로 이해하여 1인칭으로 번역했습니다.
  alternative_readings:
  - 여호사밧에게 내리는 명령으로 읽어 '변장하고 전투에 들어가십시오'로 옮김
  - 히브리어 형태를 기계적으로 따라 2인칭 명령으로 유지함
  rationale: 이어지는 '이스라엘 왕이 몸을 위장하고 들어갔다'는 서술이 아합의 발화를 그의 자기 계획으로 확정해 주므로, 담화 흐름을 보존하는 번역이 가장 타당합니다.
  doctrine_reference: 본문 해석/담화 문맥
