  text: וּ/מֶ֥לֶךְ אֵ֛ין בֶּ/אֱד֖וֹם נִצָּ֥ב מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/048.yaml
  text: And there was no king in Edom[a]; a deputy was king.
  footnotes:
  - marker: a
    text: Or 'a governor was king' or 'an appointed official was king.' The Hebrew נִצָּב literally refers to one who is stationed or appointed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 에돔에는 왕이 없고, 대리자가 왕이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נִצָּב는 문자적으로는 ‘세워진 자, 임명된 자’에 가깝습니다. 따라서 ‘대리자’ 외에 ‘총독’이나 ‘임명된 관리’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֶלֶךְ
  english_pob_choice: And ... king
  chosen_korean: 그리고 ... 왕
  alternatives_korean:
  - 이제 ... 왕
  lexicon: HALOT
  rationale: 문장 시작의 ו는 서술형 연결로 자연스럽게 ‘그리고’로 옮겼고, מֶלֶךְ은 기본 의미를 살려 ‘왕’으로 옮겼습니다.
- source_word: אֵין
  english_pob_choice: there was no
  chosen_korean: 없고
  alternatives_korean:
  - 없었습니다
  - 없다
  lexicon: HALOT
  rationale: אֵין의 부존재를 한국어 서술문에 맞게 간결하게 ‘없고’로 처리해 앞절과 자연스럽게 이어지게 했습니다.
- source_word: בֶּאֱדוֹם
  english_pob_choice: in Edom
  chosen_korean: 에돔에는
  alternatives_korean:
  - 에돔에
  - 에돔 땅에는
  lexicon: HALOT
  rationale: בְּ의 स्थान적 의미를 살려 ‘에돔에는’으로 옮기되, 부정문과 대비되는 주제를 분명하게 했습니다.
- source_word: נִצָּב מֶלֶךְ
  english_pob_choice: a deputy was king
  chosen_korean: 대리자가 왕이었습니다
  alternatives_korean:
  - 총독이 왕이었습니다
  - 임명된 관리가 왕이었습니다
  lexicon: HALOT
  rationale: נִצָּב는 ‘세워진/임명된 자’라는 뜻이므로, 영어 POB의 ‘deputy’에 대응해 공식 직함보다 기능을 드러내는 ‘대리자’로 옮겼습니다. 마지막 명사절은 한국어에서 ‘왕이었습니다’로 처리해 히브리어의 짧은 서술구조를 살렸습니다.
