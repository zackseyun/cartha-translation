reference: 1 Kings 22:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבוֹא֮ אֶל הַ/מֶּלֶךְ֒ וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֵלָ֗י/ו מִיכָ֨יְהוּ֙ הֲ/נֵלֵ֞ךְ אֶל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם נֶחְדָּ֑ל וַ/יֹּ֤אמֶר אֵלָי/ו֙ עֲלֵ֣ה וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/015.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should we refrain?” And he said to him, “Go up and succeed, and Yahweh will give it into the hand of the king.”
  footnotes:
  - marker: a
    text: Micaiah's reply is likely ironic in context; the Hebrew itself does not explicitly mark the sarcasm.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 왕에게 오자 왕이 그에게 말했습니다. “미가야, 우리가 길르앗 라못으로 올라가 싸워야 합니까, 아니면 그만두어야 합니까?” 그가 그에게 말했습니다. “올라가서 성공하십시오. 야훼께서 왕의 손에 넘기실 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 미가야의 대답은 문맥상 반어일 가능성이 크지만, 히브리어 본문 자체는 그 아이러니를 명시적으로 표지하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא
  english_pob_choice: So he came
  chosen_korean: 그가 왕에게 오자
  alternatives_korean:
  - 그가 왕에게 왔습니다
  - 그리고 그가 왕에게 왔습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서술 진행을 한국어에서는 자연스러운 사건 연결로 옮겼습니다. 앞선 동작 뒤에 이어지는 도착을 분명히 하되, 지나치게 반복적인 접속을 피했습니다.
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 임금
  lexicon: HALOT
  rationale: 본문의 지시 대상은 문맥상 아합으로 분명하므로, 자연스러운 서술을 위해 단순히 ‘왕’으로 옮겼습니다. ‘임금’은 현대어 톤에서 다소 고전적으로 느껴질 수 있습니다.
- source_word: הֲנֵלֵךְ ... אִם נֶחְדָּל
  english_pob_choice: should we go ... or should we refrain
  chosen_korean: 우리가 길르앗 라못으로 올라가 싸워야 합니까, 아니면 그만두어야 합니까?
  alternatives_korean:
  - 우리가 길르앗 라못으로 올라가 싸워야 합니까, 아니면 멈추어야 합니까?
  - 우리가 길르앗 라못으로 올라가 전쟁해야 합니까, 아니면 물러나야 합니까?
  lexicon: HALOT
  rationale: 질문은 출전 여부를 묻는 군사적 숙의입니다. ‘그만두다’가 단순 중단이 아니라 원정에 나서지 않는 대안을 자연스럽게 드러냅니다.
- source_word: עֲלֵה וְהַצְלַח
  english_pob_choice: Go up and succeed
  chosen_korean: 올라가십시오. 그리고 성공하십시오.
  alternatives_korean:
  - 올라가십시오. 그리고 승리하십시오.
  - 올라가십시오. 그리고 형통하십시오.
  lexicon: HALOT
  rationale: עלה의 관용적 군사 표현을 ‘올라가십시오’로 살리고, הצלח은 전투 맥락에서 결과의 성공을 뜻하므로 ‘성공하십시오’로 옮겼습니다. ‘승리하십시오’는 전투 결과를 더 구체화하지만 원문의 일반성을 약간 좁힐 수 있습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여기서는 신명기적 언약명 יְהוָה를 본문에서 직접 드러내는 것이 중요하므로, 전통적 대체어 ‘주님’ 대신 ‘야훼’를 사용했습니다.
- source_word: בְּיַד הַמֶּלֶךְ
  english_pob_choice: into the hand of the king
  chosen_korean: 왕의 손에 넘기실 것입니다
  alternatives_korean:
  - 왕의 손에 주실 것입니다
  - 왕에게 넘기실 것입니다
  lexicon: HALOT
  rationale: ‘손에’의 히브리 관용은 권세 아래로 넘김을 뜻하므로, 한국어에서는 ‘넘기시다’로 풀어 권능과 소유의 뉘앙스를 살렸습니다. ‘왕의 손에 주시다’는 어색할 수 있어 피했습니다.
theological_decisions:
- issue: 여호와/야훼의 이름을 어떻게 옮길 것인가
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 하나님의 고유명을 직접 사용하므로, 호칭 대체보다 이름 보존이 원문의 신학적 긴장을 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 미가야의 대답에 담긴 아이러니를 본문에 얼마나 드러낼 것인가
  chosen_reading: 본문은 겉문장 자체를 그대로 옮기고, 반어 가능성은 본문 밖에 두지 않았습니다.
  alternative_readings:
  - ‘올라가십시오!’처럼 감탄을 넣어 반어를 드러내기
  - ‘성공하십시오’ 대신 ‘형통하십시오’를 택해 더 비꼬는 뉘앙스를 살리기
  rationale: 히브리어 자체는 반어 표지를 명시하지 않으므로, 본문은 문면대로 두어 서술의 긴장을 보존하는 편이 더 소스-충실적입니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
