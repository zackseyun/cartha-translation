revisions:
- from: 그가 왕에게 오자 왕이 그에게 말했습니다. “미가야, 우리가 길르앗 라못으로 올라가 싸워야 합니까, 아니면 그만두어야 합니까?” 그가 그에게 말했습니다. “올라가십시오. 그리고 성공하십시오. 야훼께서 그 성읍을 왕의 손에 넘기실 것입니다.”[a]
  to: 그가 왕에게 오자 왕이 그에게 말했습니다. “미가야, 우리가 길르앗 라못으로 올라가 싸워야 합니까, 아니면 그만두어야 합니까?” 그가 그에게 말했습니다. “올라가서 성공하십시오. 야훼께서 왕의 손에 넘기실 것입니다.”[a]
  rationale: The revision removes the unsupported explicit object “그 성읍,” allowing Korean zero anaphora to reflect the Hebrew’s implicit object. It also makes the paired imperative more idiomatic without signaling irony in the main text. The existing footnote appropriately records the contextual likelihood of irony while preserving the unmarked Hebrew wording.
