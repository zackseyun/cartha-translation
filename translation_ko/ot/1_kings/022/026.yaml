  source_fidelity: ‘잡아서’는 קַח(‘데려가다/취하다’) 자체가 명시하지 않는 물리적 강제력을 덧붙일 수 있습니다. 또한 שַׂר הָעִיר는 행정관·지휘관 등 폭넓은 고위 관리를 가리킬 수 있으므로 ‘성읍의 관리’와 각주로 그 범위를 보이는 것이 적절합니다. ‘돌려보내십시오’는 וַהֲשִׁיבֵהוּ의 사역적 ‘되돌려 보내다/데려가 돌려보내다’를 잘 반영합니다.
  naturalness: 합쇼체 서술과 명령형은 자연스럽습니다. 다만 ‘미가야를 데리고 가서 … 돌려보내십시오’가 원문의 연속된 명령을 무리 없이 드러내며, ‘성읍의 관리 아몬’도 한국어에서 자연스러운 동격 명사구입니다.
  terminology: 인명은 통용 표기인 ‘미가야’, ‘아몬’, ‘요아스’를 유지했습니다. ‘왕의 아들’은 בֶּן הַמֶּלֶךְ를 직함 ‘왕자’로 과도하게 바꾸지 않고 충실하게 옮깁니다. 각주는 영어 번역 선택을 언급하지 않고 히브리어 직함의 의미 범위를 직접 설명하도록 고쳤습니다.
