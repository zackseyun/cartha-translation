  yaml_path: translation/ot/1_kings/022/026.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city, and to Joash the king’s son.”
  footnotes:
  - marker: a
    text: Or “the commander of the city” or “the chief official of the city.” The Hebrew title can denote a leading civic or military officer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이스라엘 왕이 말했습니다. “미가야를 데리고 가서 성읍의 관리 아몬과 왕의 아들 요아스에게로 돌려보내십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성읍의 관리’에 해당하는 히브리어 직함은 성읍의 행정 책임자, 지휘관, 또는 고위 관리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ יִשְׂרָאֵל
  english_pob_choice: the king of Israel
  chosen_korean: 이스라엘 왕
  alternatives_korean:
  - 이스라엘의 왕
  lexicon: HALOT
  rationale: 히브리어의 소유격 구조를 한국어에서는 자연스러운 명사구인 ‘이스라엘 왕’으로 옮겨, 호칭의 간결함과 직함성을 유지했습니다.
- source_word: קַח
  english_pob_choice: Take
  chosen_korean: 잡아서
  alternatives_korean:
  - 데려가서
  - 붙들어서
  lexicon: HALOT
  rationale: 문맥상 미가야를 구금 상태로 이동시키는 명령이므로 단순한 ‘데려가다’보다 강한 ‘잡다’가 원문의 강제성을 더 잘 드러냅니다.
- source_word: וַהֲשִׁיבֵהוּ
  english_pob_choice: return him
  chosen_korean: 돌려보내십시오
  alternatives_korean:
  - 보내십시오
  - 되돌려 보내십시오
  lexicon: HALOT
  rationale: 히필 שוב의 사역적 의미를 살려 ‘돌려보내다’로 옮기되, 한국어 명령형으로는 ‘돌려보내십시오’가 가장 자연스럽고 분명합니다.
- source_word: שַׂר הָעִיר
  english_pob_choice: the governor of the city
  chosen_korean: 성읍의 관원
  alternatives_korean:
  - 성읍의 총독
  - 성읍의 지휘관
  - 성읍의 chief official
  lexicon: HALOT
  rationale: שַׂר는 문맥에 따라 행정·군사 지도자를 모두 가리킬 수 있어, 영어 POB의 ‘governor’에 해당하는 지나치게 군사적인 뉘앙스를 피하면서도 직무를 포괄하는 ‘관원’을 택했습니다.
- source_word: בֶּן הַמֶּלֶךְ
  english_pob_choice: the king’s son
  chosen_korean: 왕의 아들
  alternatives_korean:
  - 왕자
  - 왕의 아드님
  lexicon: HALOT
  rationale: 원문은 단순한 친족 관계 표현이므로, 위계가 더 강한 ‘왕자’보다 직역에 가까운 ‘왕의 아들’이 더 정확합니다.
theological_decisions:
