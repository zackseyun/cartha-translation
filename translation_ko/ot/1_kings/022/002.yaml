theological_decisions:
- issue: ירד(내려가다)의 공간적 함의
  chosen_reading: ‘내려갔습니다’로 번역해 예루살렘/유다에서 북쪽 지역으로 이동하는 지리적 하강 뉘앙스를 보존했습니다.
  alternative_readings:
  - 단순히 ‘갔습니다’로 중화하기
  - ‘내려왔습니다’로 바꾸기
  rationale: 본문은 단순 이동이 아니라 히브리어 روایت에서 흔한 지형적 방향감을 담고 있으므로, 이를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 성경 지리와 서술 뉘앙스 보존
