source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יְהֽוֹשָׁפָט֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ עִם אֲבֹתָ֔י/ו בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ יְהוֹרָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/051.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoram his son became king in his place.
  footnotes:
  - marker: a
    text: Hebrew 'slept with his fathers,' a customary expression for dying.
    reason: lexical_alternative
  - marker: b
    text: '''His father'' here uses Hebrew genealogical language that can also mean ''forefather'' or ''ancestor.'''
    reason: cultural_note
translation:
  language: ko
  text: 여호사밧은 그의 조상들과 함께 누워 있었고, 그의 조상들과 함께 다윗 성에 장사되었으며, 그의 아들 여호람이 그를 대신하여 왕이 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '조상들과 함께 누워 있었다'는 죽음을 뜻하는 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: '''다윗 그의 아버지''는 히브리어 족보 ভাষ식으로 ''선조'' 또는 ''조상''을 뜻할 수도 있습니다.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  english_pob_choice: slept with his fathers
  chosen_korean: 그의 조상들과 함께 누워 있었고
  alternatives_korean:
  - 그의 조상들과 함께 잠들었고
  - 그의 조상들과 함께 죽었고
  lexicon: WLC; HALOT
  rationale: 왕실 사망 공식의 관용구를 살리기 위해 직설적 '죽다'보다 '누워 있다'를 택했고, '조상들'로 족보적 표현을 자연스럽게 옮겼습니다.
- source_word: וַיִּקָּבֵר
  english_pob_choice: was buried
  chosen_korean: 장사되었으며
  alternatives_korean:
  - 묻혔으며
  - 매장되었으며
  lexicon: WLC; HALOT
  rationale: 히브리어 수동형의 장례 완료를 자연스럽게 나타내면서도 성경 문체에 맞는 중립적 표현으로 옮겼습니다.
- source_word: בְּעִיר דָּוִד אָבִיו
  english_pob_choice: in the city of David his father
  chosen_korean: 다윗 성에
  alternatives_korean:
  - 다윗의 성에
  - 그의 아버지 다윗의 성에
  lexicon: WLC; HALOT
  rationale: 고유 지명 관용구인 '다윗 성'을 표준적으로 유지하되, 문맥상 다윗이 조상이므로 '그의 아버지'를 본문에 과도하게 풀어 넣지 않았습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: became king in his place
  chosen_korean: 그를 대신하여 왕이 되었습니다
  alternatives_korean:
  - 그 자리에 왕이 되었습니다
  - 그의 뒤를 이어 왕이 되었습니다
  lexicon: WLC; HALOT
  rationale: תחתיו의 계승 의미를 살리기 위해 '대신하여'를 사용했고, accession 동사 וַיִּמְלֹךְ는 '왕이 되었습니다'로 옮겨 즉위 순간을 드러냈습니다.
theological_decisions:
- issue: 왕실 장례 공식의 번역 톤
  chosen_reading: '''누워 있었다''와 ''장사되었다''를 함께 사용해 히브리어 관용구와 서술 기능을 모두 보존했습니다.'
  alternative_readings:
  - '''죽었다''로 단순화'
  - '''잠들었다''로 완곡화'
  rationale: 본문은 단순한 사망 통보가 아니라 왕조 연대기 형식의 공식 보고이므로, 관용적 죽음 표현과 실제 장례를 함께 드러내는 것이 소스에 더 충실합니다.
  doctrine_reference: 서술 장르 보존
