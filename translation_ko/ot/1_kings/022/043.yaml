  - 따랐으며
  lexicon: HALOT
  rationale: הלך의 기본 의미인 ‘가다/걷다’를 살리면서, 왕 평가 문맥의 삶의 행로를 한국어로 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: בְּכָל דֶּרֶךְ
  english_pob_choice: in all the ways
  chosen_korean: 모든 길로
  alternatives_korean:
