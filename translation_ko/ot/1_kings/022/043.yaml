  text: He walked in all the ways of Asa his father[a]; he did not turn aside from them[b], doing what was right in the eyes of Yahweh.
  footnotes:
  - marker: a
    text: Or 'He went in every way of Asa his father' or 'He followed all the way of Asa his father.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the eyes of the LORD,' an idiom meaning 'in the LORD's sight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아버지 아사가 걸었던 길을 온전히 따라 걸었으며[a], 그 길에서 벗어나지 않았고, 야훼께서 보시기에[b] 옳은 일을 행했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘길’은 단순한 이동 경로가 아니라 삶의 방식과 행실을 뜻하는 관용어입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼께서 보시기에’는 히브리어의 관용구로, 직역하면 ‘야훼의 눈에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: He walked
  chosen_korean: 걸어갔으며
  alternatives_korean:
