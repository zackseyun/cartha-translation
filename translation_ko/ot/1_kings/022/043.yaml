  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֛רֶךְ אָסָ֥א אָבִ֖י/ו לֹא סָ֣ר מִמֶּ֑/נּוּ לַ/עֲשׂ֥וֹת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/043.yaml
  text: He walked in all the ways of Asa his father[a]; he did not turn aside from them[b], doing what was right in the eyes of Yahweh.
  footnotes:
  - marker: a
    text: Or 'He went in every way of Asa his father' or 'He followed all the way of Asa his father.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the eyes of the LORD,' an idiom meaning 'in the LORD's sight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아버지 아사의 모든 길로 걸어갔으며, 그 길에서 벗어나지 않았고, 야훼 보시기에 옳은 일을 행했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘길’은 단순한 이동 경로가 아니라 삶의 방식과 행실을 뜻하는 관용어입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼 보시기에’는 히브리어의 관용구로, 직역하면 ‘야훼의 눈에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: He walked
  chosen_korean: 걸어갔으며
  alternatives_korean:
  - 갔으며
  - 따랐으며
  lexicon: HALOT
  rationale: הלך의 기본 의미인 ‘가다/걷다’를 살리면서, 왕 평가 문맥의 삶의 행로를 한국어로 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: בְּכָל דֶּרֶךְ
  english_pob_choice: in all the ways
  chosen_korean: 모든 길로
  alternatives_korean:
  - 모든 방식으로
  - 온갖 길로
  lexicon: HALOT
  rationale: 히브리어의 ‘길’ 이미지를 유지해 행실과 삶의 방식이라는 뜻을 드러내되, 한국어에서는 복수성을 자연스럽게 반영했습니다.
- source_word: לֹא סָר מִמֶּנּוּ
  english_pob_choice: he did not turn aside from them
  chosen_korean: 그 길에서 벗어나지 않았고
  alternatives_korean:
  - 그것에서 떠나지 않았고
  - 그것을 외면하지 않았고
  lexicon: HALOT
  rationale: סור의 ‘돌아서다/벗어나다’ 이미지를 살려 앞의 ‘길’과 연결되게 했습니다. 영어 본문과 달리 한국어에서는 단수로 받는 것이 문맥상 더 자연스럽습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: ‘눈에/보기에’라는 히브리어 관용구를 유지해 하나님의 평가라는 의미를 분명히 했고, 여호와 대신 자료의 원칙에 따라 야훼를 사용했습니다.
theological_decisions:
- issue: 야훼 이름의 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 여호와 대용어를 쓰지 않고, 히브리어 고유 이름의 음역을 유지해 본문이 말하는 언약적 평가 주체를 분명히 했습니다.
  doctrine_reference: Tetragrammaton rendering policy in POB glossary
- issue: 왕 평가 공식의 보존
  chosen_reading: ‘야훼 보시기에 옳은 일’이라는 평가 공식을 그대로 살렸습니다.
  alternative_readings:
  - 하나님께서 기뻐하시는 일
  - 옳은 바를 행했습니다
  rationale: 본문은 데오테로노미적 왕 평가의 정형 표현을 사용하므로, 도덕적 칭찬으로 완화하지 않고 ‘보시기에’라는 관찰·평가의 뉘앙스를 유지했습니다.
  doctrine_reference: Preserve source text's plain sense; do not import doctrinal expansion
