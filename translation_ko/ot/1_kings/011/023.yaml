  text: וַ/יָּ֨קֶם אֱלֹהִ֥ים ל/וֹ֙ שָׂטָ֔ן אֶת רְז֖וֹן בֶּן אֶלְיָדָ֑ע אֲשֶׁ֣ר בָּרַ֗ח מֵ/אֵ֛ת הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָ֖ה אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/023.yaml
  text: And God raised up for him an adversary[a], Rezon son of Eliada, who had fled from Hadadezer king of Zobah, his master.
  footnotes:
  - marker: a
    text: Hebrew satan; here a common noun meaning 'adversary' or 'opponent,' not the proper name Satan.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서는 그에게 대적[a]을 일으키셨습니다. 곧 엘리아다의 아들 르손인데, 그는 소바 왕 하닷에셀에게서 도망해 나온 사람이었습니다. 그의 주인입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שָׂטָן은 여기서 고유명사 ‘사탄’이 아니라 ‘대적’ 또는 ‘반대자’라는 보통명사입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  english_pob_choice: raised up
  chosen_korean: 일으키셨습니다
  alternatives_korean:
  - 세우셨습니다
  - 불러 일으키셨습니다
  lexicon: HALOT
  rationale: 히필형 קום의 의미를 살리면서, 현대 한국어에서 하나님의 주도적 행위를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: שָׂטָן
  english_pob_choice: an adversary
  chosen_korean: 대적
  alternatives_korean:
  - 원수
  - 사탄
  lexicon: HALOT
  rationale: 여기서는 고유명사 ‘사탄’이 아니라 정치적·역사적 문맥의 보통명사로서 ‘대적’이 적절합니다.
- source_word: אֲדֹנָיו
  english_pob_choice: his master
  chosen_korean: 그의 주인
  alternatives_korean:
  - 그의 상전
  - 그의 주
  lexicon: HALOT
  rationale: 종속 관계를 나타내는 문맥이므로 ‘주’보다 관계가 분명한 ‘주인’이 자연스럽고, 신적 호칭과의 혼동도 피할 수 있습니다.
theological_decisions:
- issue: שָׂטָן의 신학적 의미
  chosen_reading: 이 절에서는 초자연적 존재명이 아니라 인간적 ‘대적’으로 읽습니다.
  alternative_readings:
  - ‘사탄’이라는 고유명사로 읽기
  - ‘원수’로 보다 강하게 번역하기
  rationale: 본문은 르손이라는 역사적 인물을 설명하며, 문맥상 하나님이 솔로몬의 정치적 반대자를 일으키신다는 뜻입니다. 따라서 후대의 악령 개념을 끌어오지 않고 본문이 말하는 수준을 유지했습니다.
  doctrine_reference: '번역 원칙: 문맥 우선, 후대 신학적 고정 의미의 투사 금지'
