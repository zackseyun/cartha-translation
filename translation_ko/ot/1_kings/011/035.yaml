  - 그의 아들 손에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려 소유·지배의 상실을 드러내는 표현으로 유지했습니다.
- source_word: הַמְּלוּכָה
  english_pob_choice: the kingdom
  chosen_korean: 왕국
  alternatives_korean:
  - 왕권
  - 왕정
  lexicon: HALOT
  rationale: 이 절에서는 솔로몬 계열에서 떼어낼 통치 영역을 가리키므로 가장 자연스럽고 본문에 맞는 ‘왕국’이 적절합니다.
- source_word: אֵת עֲשֶׂרֶת הַשְּׁבָטִים
  english_pob_choice: the ten tribes
  chosen_korean: 곧 열 지파입니다
  alternatives_korean:
  - 열 지파입니다
  - 즉 열 지파입니다
  lexicon: HALOT
  rationale: 히브리어의 목적격 표지와 동격 구문이 ‘그것은 곧 열 지파’라는 제한 설명이므로, 한국어에서는 ‘곧’으로 풀어 왕국 전체가 아니라 그 구성 범위를 분명히 했습니다.
theological_decisions:
- issue: ‘왕국’을 누구에게서 누구에게로 옮기는가 하는 왕권 상실의 표현
  chosen_reading: 하나님께서 솔로몬의 아들의 손에서 왕국을 빼앗아 르호보암 측이 아니라 여로보암에게 넘기시는 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 정치적 분열 예고로만 읽는 방식
  - ‘왕국’을 추상적 통치권으로만 보는 방식
  rationale: 본문의 관용구는 실제 통치권의 박탈과 이전을 가리키므로, 신학적으로도 하나님의 주권적 판단과 왕조 심판의 선언을 분명히 드러내는 번역이 필요합니다.
  doctrine_reference: 왕권 심판, 언약적 징계
