  - marker: b
    text: Literally, 'and I will give it to you, ten tribes.' The phrase specifies that the kingdom given consists of ten tribes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 그의 아들의 손에서 왕국을 빼앗아 당신에게 열 지파를 주겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 아들의 손에서’는 통치권이나 소유를 그 아들의 지배에서 거두어 내는 것을 뜻하는 히브리어 관용 표현입니다.
    reason: cultural_note
  - marker: b
    text: ‘열 지파’는 당신에게 주어질 왕국의 몫을 구체적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  english_pob_choice: But I will take
  chosen_korean: 그러나 나는 … 빼앗아
  alternatives_korean:
  - 나는 … 취하겠습니다
  - 나는 … 가져가겠습니다
  lexicon: HALOT
  rationale: 문맥상 선포형 미래를 나타내며, 앞선 문맥과의 대비를 살려 ‘그러나’로 시작하고 לקח의 ‘취하다’보다 권한을 제거하는 뉘앙스를 살려 ‘빼앗다’로 옮겼습니다.
- source_word: מִיַּד בְּנוֹ
  english_pob_choice: from the hand of his son
  chosen_korean: 그의 아들의 손에서
  alternatives_korean:
