base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/035.yaml
  text: But I will take the kingdom from the hand of his son and give it to you[b][a], the ten tribes.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from the hand of his son,'' an idiom for removing rule or possession from his son''s control.'
    reason: cultural_note
  - marker: b
    text: Literally, 'and I will give it to you, ten tribes.' The phrase specifies that the kingdom given consists of ten tribes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 그의 아들의 손에서 왕국을 빼앗아 당신에게 주겠습니다. 곧 열 지파입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 아들의 손에서’는 통치나 소유를 그 아들의 지배 아래에서 거두어 내는 히브리어 관용구입니다.
    reason: cultural_note
  - marker: b
    text: ‘열 지파’는 왕국 전체가 아니라, 그에게 주어질 왕국의 구성 범위를 구체적으로 밝힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  english_pob_choice: But I will take
  chosen_korean: 그러나 나는 … 빼앗아
  alternatives_korean:
  - 나는 … 취하겠습니다
  - 나는 … 가져가겠습니다
  lexicon: HALOT
  rationale: 문맥상 선포형 미래를 나타내며, 앞선 문맥과의 대비를 살려 ‘그러나’로 시작하고 לקח의 ‘취하다’보다 권한을 제거하는 뉘앙스를 살려 ‘빼앗다’로 옮겼습니다.
- source_word: מִיַּד בְּנוֹ
  english_pob_choice: from the hand of his son
  chosen_korean: 그의 아들의 손에서
  alternatives_korean:
  - 그 아들의 손에서
  - 그의 아들 손에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려 소유·지배의 상실을 드러내는 표현으로 유지했습니다.
- source_word: הַמְּלוּכָה
  english_pob_choice: the kingdom
  chosen_korean: 왕국
  alternatives_korean:
  - 왕권
  - 왕정
  lexicon: HALOT
  rationale: 이 절에서는 솔로몬 계열에서 떼어낼 통치 영역을 가리키므로 가장 자연스럽고 본문에 맞는 ‘왕국’이 적절합니다.
- source_word: אֵת עֲשֶׂרֶת הַשְּׁבָטִים
  english_pob_choice: the ten tribes
  chosen_korean: 곧 열 지파입니다
  alternatives_korean:
  - 열 지파입니다
  - 즉 열 지파입니다
  lexicon: HALOT
  rationale: 히브리어의 목적격 표지와 동격 구문이 ‘그것은 곧 열 지파’라는 제한 설명이므로, 한국어에서는 ‘곧’으로 풀어 왕국 전체가 아니라 그 구성 범위를 분명히 했습니다.
theological_decisions:
- issue: ‘왕국’을 누구에게서 누구에게로 옮기는가 하는 왕권 상실의 표현
  chosen_reading: 하나님께서 솔로몬의 아들의 손에서 왕국을 빼앗아 르호보암 측이 아니라 여로보암에게 넘기시는 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 정치적 분열 예고로만 읽는 방식
  - ‘왕국’을 추상적 통치권으로만 보는 방식
  rationale: 본문의 관용구는 실제 통치권의 박탈과 이전을 가리키므로, 신학적으로도 하나님의 주권적 판단과 왕조 심판의 선언을 분명히 드러내는 번역이 필요합니다.
  doctrine_reference: 왕권 심판, 언약적 징계
