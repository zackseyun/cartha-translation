  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּמְצָא֙ הֲדַ֥ד חֵ֛ן בְּ/עֵינֵ֥י פַרְעֹ֖ה מְאֹ֑ד וַ/יִּתֶּן ל֤/וֹ אִשָּׁה֙ אֶת אֲח֣וֹת אִשְׁתּ֔/וֹ אֲח֖וֹת תַּחְפְּנֵ֥יס הַ/גְּבִירָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/019.yaml
  text: Hadad found great favor in Pharaoh’s eyes[a], and he gave him as a wife the sister of his own wife[b], the sister of Tahpenes the queen mother.
  footnotes:
  - marker: a
    text: Or, less likely, 'the sister of his wife' could be understood as referring to Hadad’s wife rather than Pharaoh’s wife.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the great lady'; the title likely refers to the queen mother or chief royal lady.
    reason: lexical_alternative
translation:
  language: ko
  text: 하닷은 바로의 눈에 크게 은총을 입었고[a], 바로는 그에게 자기 아내의 누이, 곧 태브네스[b] 왕대비의 누이를 아내로 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 덜 가능성 있게, '그의 아내의 누이'는 하닷의 아내를 가리킨다고 볼 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 '큰 여자'라는 뜻의 칭호입니다. 이 칭호는 왕대비나 최고위 왕실 여성을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינֵי
  english_pob_choice: found great favor in ... eyes
  chosen_korean: 크게 은총을 입었습니다
  alternatives_korean:
  - 큰 호의를 얻었습니다
  - 은혜를 입었습니다
  - 호감을 샀습니다
  lexicon: HALOT
  rationale: 히브리어 관용구인 '눈에 은총을 얻다'를 자연스럽게 풀면서도, מְאֹד의 강도를 '크게'로 살렸습니다.
- source_word: פַרְעֹה
  english_pob_choice: Pharaoh
  chosen_korean: 바로
  alternatives_korean:
  - 파라오
  lexicon: HALOT
  rationale: 성경 한국어에서 확립된 고유명사형을 따랐습니다.
- source_word: וַיִּתֶּן לוֹ אִשָּׁה
  english_pob_choice: he gave him as a wife
  chosen_korean: 그에게 ... 아내로 주었습니다
  alternatives_korean:
  - 그에게 아내를 주었습니다
  - 그와 결혼하게 했습니다
  lexicon: HALOT
  rationale: 단순히 '주다'가 아니라 결혼 관계를 형성하는 행위임을 한국어에서도 분명히 드러냈습니다.
- source_word: אֲחוֹת אִשְׁתּוֹ
  english_pob_choice: the sister of his own wife
  chosen_korean: 자기 아내의 누이
  alternatives_korean:
  - 자기 아내의 여동생
  - 그의 아내의 누이
  lexicon: HALOT
  rationale: 소유격이 바로를 가리킨다는 점을 반영해, 관계가 헷갈리지 않도록 '자기 아내'로 옮겼습니다.
- source_word: הַגְּבִירָה
  english_pob_choice: the queen mother
  chosen_korean: 왕대비
  alternatives_korean:
  - 왕후
  - 큰 주인 부인
  - 왕모
  lexicon: HALOT
  rationale: הַגְּבִירָה는 단순한 '여왕'보다 왕실 내 최고위 여성을 가리키는 칭호이므로, 한국어에서 가장 압축적으로 대응하는 '왕대비'를 선택했습니다.
theological_decisions:
- issue: אֲחוֹת אִשְׁתּוֹ의 소유격 지시 대상
  chosen_reading: 소유격은 바로를 가리키므로, 바로가 하닷에게 바로의 아내의 누이를 준 것으로 읽었습니다.
  alternative_readings:
  - 소유격을 하닷으로 보아, 하닷의 아내의 누이를 준 것으로 읽는 해석
  rationale: 문맥상 바로의 궁정 서술이며, 뒤의 '태브네스의 누이'가 그 여인을 설명하는 apposition이므로 바로를 지시 대상으로 보는 것이 가장 자연스럽습니다.
  doctrine_reference: 문맥 우선의 지시어 해석
- issue: הַגְּבִירָה의 칭호 번역
  chosen_reading: '''왕대비''로 옮겨 왕실 내 최고위 여성이라는 직함 성격을 드러냈습니다.'
  alternative_readings:
  - '''큰 부인'''
  - '''왕후'''
  rationale: 본문의 히브리어는 개인 이름이 아니라 궁정 칭호를 가리키므로, 한국어 독자가 그 위상을 이해할 수 있는 직함 번역이 필요합니다.
  doctrine_reference: 왕실 칭호의 기능적 등가 번역
