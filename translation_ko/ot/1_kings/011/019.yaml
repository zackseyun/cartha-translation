    issue: הַגְּבִירָה를 ‘왕대비’로 단정함
    rationale: 이 칭호는 높은 지위의 왕실 여성을 가리키지만, 이 본문에서 정확히 왕대비라는 직위였는지는 확정할 수 없습니다. 본문에서는 더 포괄적인 칭호를 쓰고 각주에서 가능한 의미를 밝혀야 합니다.
  - severity: low
