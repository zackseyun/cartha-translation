  source_fidelity: 개정이 필요합니다. 본문은 하닷이 바로에게 크게 호의를 얻고, 바로가 그에게 아내를 주었다는 뜻을 잘 전달하지만, הַגְּבִירָה를 단정적으로 ‘왕대비’로 번역하는 것은 히브리어 칭호의 범위를 지나치게 좁힙니다. 또한 각주 b는 칭호에 붙어야 합니다.
  naturalness: ‘바로의 눈에 크게 은총을 입었고’도 이해되지만, 현대 표준어 합쇼체에서는 ‘바로에게서 크게 호의를 얻었습니다’가 더 자연스럽습니다. ‘대부인 태브네스’는 칭호와 이름의 관계를 자연스럽게 나타냅니다.
  terminology: ‘바로’는 한국어 성경에서 통용되는 형태입니다. הַגְּבִירָה는 왕대비로 확정하지 않고 ‘대부인’으로 옮기며, 각주에서 왕대비 또는 왕실의 최고위 여성을 포함하는 칭호임을 설명하는 것이 안전합니다. ‘태브네스’는 초안의 음역을 유지합니다.
  issues:
