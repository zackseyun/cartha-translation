    rationale: 각주 내용은 이름이 아니라 뒤따르는 칭호 הַגְּבִירָה에 관한 것이므로 ‘대부인’ 뒤에 표지를 두어야 합니다.
  - severity: low
    issue: ‘바로의 눈에 크게 은총을 입었고’의 현대적 자연스러움
    rationale: 원문의 관용 표현을 반영하려는 장점은 있으나, ‘바로에게서 크게 호의를 얻었습니다’가 현대 한국어에서 더 자연스럽고 의미도 충실합니다.
  revised_text: 하닷은 바로에게서 크게 호의를 얻었습니다. 바로는 그에게 자기 아내의 누이, 곧 대부인[a] 태브네스의 누이를 아내로 주었습니다.
  revised_footnotes:
