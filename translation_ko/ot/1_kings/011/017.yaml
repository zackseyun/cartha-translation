source:
  edition: WLC
  text: וַ/יִּבְרַ֣ח אֲדַ֡ד הוּא֩ וַ/אֲנָשִׁ֨ים אֲדֹמִיִּ֜ים מֵ/עַבְדֵ֥י אָבִ֛י/ו אִתּ֖/וֹ לָ/ב֣וֹא מִצְרָ֑יִם וַ/הֲדַ֖ד נַ֥עַר קָטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/017.yaml
  text: Hadad fled to Egypt[a], he and some Edomite men from among his father's servants with him[b]; and Hadad was a young boy.
  footnotes:
  - marker: a
    text: Or, more literally, 'to come to Egypt.' Hebrew often uses 'come' where English idiom would say 'go' or simply state the destination.
    reason: lexical_alternative
  - marker: b
    text: Or 'a little boy' or 'a young boy.' The Hebrew phrase emphasizes that Hadad was still very young.
    reason: lexical_alternative
translation:
  language: ko
  text: 하닷은 그의 아버지의 종들 가운데 있던 일부 에돔 사람들과 함께 이집트로 도망쳤습니다[a]. 그리고 하닷은 어린 소년이었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 목적지를 나타내는 ‘오다’의 부정사를 써서 문자적으로는 ‘이집트로 오기 위해’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 단순히 ‘젊다’보다 훨씬 어린 나이를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  english_pob_choice: fled
  chosen_korean: 도망쳤습니다
  alternatives_korean:
  - 달아났습니다
  - 피했습니다
  lexicon: HALOT
  rationale: ברח는 도피·도주를 뜻하므로, 서술체 한국어에서는 ‘도망치다’가 자연스럽고 사건의 긴급성을 잘 살립니다.
- source_word: וַאֲנָשִׁים אֲדֹמִיִּים
  english_pob_choice: some Edomite men
  chosen_korean: 일부 에돔 사람들
  alternatives_korean:
  - 에돔 사람들
  - 에돔 사람 몇 명
  lexicon: HALOT
  rationale: אֲנָשִׁים은 일반적으로 ‘사람들/남자들’이며, 문맥상 불특정 다수를 가리키므로 ‘일부’로 부분성을 살렸습니다.
- source_word: מֵעַבְדֵי אָבִיו
  english_pob_choice: from among his father's servants
  chosen_korean: 그의 아버지의 종들 가운데 있던
  alternatives_korean:
  - 그의 아버지의 종들 가운데서
  - 그의 아버지의 하인들 가운데 있던
  lexicon: HALOT
  rationale: מִן의 부분적 용법을 ‘가운데 있던’으로 풀어, 단순 소속이 아니라 그 무리 중 일부가 함께했음을 드러냈습니다.
- source_word: לָבוֹא מִצְרָיִם
  english_pob_choice: to Egypt
  chosen_korean: 이집트로
  alternatives_korean:
  - 이집트에
  - 이집트로 가려고
  lexicon: HALOT
  rationale: 히브리어는 ‘오다’의 부정사로 목적지를 나타내지만, 한국어에서는 ‘도망쳤습니다’ 뒤에 목적지를 바로 붙이는 것이 가장 자연합니다.
- source_word: נַעַר קָטָן
  english_pob_choice: a young boy
  chosen_korean: 어린 소년
  alternatives_korean:
  - 어린 아이
  - 어린 남자아이
  - 작은 소년
  lexicon: HALOT
  rationale: נַעַר קָטָן은 나이가 아주 어렸음을 강조하므로, ‘어린 소년’이 연령과 성별 뉘앙스를 함께 전달합니다.
