  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔יא וְ/יָֽרָבְעָ֖ם יָצָ֣א מִ/ירוּשָׁלִָ֑ם וַ/יִּמְצָ֣א אֹת֡/וֹ אֲחִיָּה֩ הַ/שִּׁילֹנִ֨י הַ/נָּבִ֜יא בַּ/דֶּ֗רֶךְ וְ/ה֤וּא מִתְכַּסֶּה֙ בְּ/שַׂלְמָ֣ה חֲדָשָׁ֔ה וּ/שְׁנֵי/הֶ֥ם לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/029.yaml
  text: And at that time[a], when Jeroboam went out from Jerusalem, Ahijah the Shilonite, the prophet, found him on the road. Now he had wrapped himself in a new cloak, and the two of them were alone in the open field.
  footnotes:
  - marker: a
    text: Or 'in the field.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 여로보암이 예루살렘에서 나갈 때, 실로 사람 아히야 예언자가 길에서 그를 만났습니다. 그는 새 겉옷을 두르고 있었으며, 두 사람만 들판에 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִיא
  english_pob_choice: And at that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그때
  - 그 무렵
  lexicon: HALOT
  rationale: 히브리어 서사 도입구를 자연스러운 한국어 시간 부사로 옮기되, 사건 전환의 표지를 살렸습니다.
- source_word: אֲחִיָּה הַשִּׁילֹנִי הַנָּבִיא
  english_pob_choice: Ahijah the Shilonite, the prophet
  chosen_korean: 실로 사람 아히야 예언자
  alternatives_korean:
  - 실로 출신 아히야 예언자
  - 실로 사람 아히야, 예언자
  lexicon: HALOT
  rationale: הַשִּׁילֹנִי는 ‘실로 사람’으로 옮겨 지명 출신을 드러냈고, apposition인 הַנָּבִיא는 한국어에서 매끄럽게 ‘예언자’로 붙였습니다.
- source_word: וְהוּא מִתְכַּסֶּה בְּשַׂלְמָה חֲדָשָׁה
  english_pob_choice: Now he had wrapped himself in a new cloak
  chosen_korean: 그때 그는 새 겉옷을 두르고 있었고
  alternatives_korean:
  - 그는 새 옷을 걸치고 있었고
  - 그는 새 외투를 두르고 있었고
  lexicon: HALOT
  rationale: שַׂלְמָה는 바깥에 걸치는 옷이므로 ‘겉옷’이 적절하며, 미완료 분사적 배경 설명은 진행 상태의 ‘두르고 있었고’로 살렸습니다.
- source_word: וּשְׁנֵיהֶם לְבַדָּם בַּשָּׂדֶה
  english_pob_choice: the two of them were alone in the open field
  chosen_korean: 둘만 들판에 있었습니다
  alternatives_korean:
  - 두 사람만 들판에 있었습니다
  - 그 둘만 들판에 있었습니다
  lexicon: HALOT
  rationale: לְבַדָּם의 ‘둘만’과 בַּשָּׂדֶה의 단순한 장소감은 한국어에서 ‘들판에’로 충분히 반영되며, POB의 확장된 ‘open’은 원문보다 앞서지 않도록 피했습니다.
theological_decisions:
- issue: 히브리어 서사 진행형의 시간/상태 표현
  chosen_reading: ‘그때에…’와 ‘두르고 있었고’로 배경 상황을 자연스럽게 제시했습니다.
  alternative_readings:
  - ‘그때에…’와 ‘두르고 있었습니다’
  - ‘그때에…’와 ‘두르고 있던’
  rationale: 원문은 사건 발생 시점과 당시 상태를 함께 배경화하므로, 한국어에서도 과도한 완결형보다 상황 제시형을 택했습니다.
  doctrine_reference: 서사 본문의 문법-의미 보존
- issue: 지명 형용사 הַשִּׁילֹנִי의 처리
  chosen_reading: ‘실로 사람’으로 옮겨 출신/소속을 드러냈습니다.
  alternative_readings:
  - ‘실로 출신’
  - ‘실로 사람 아히야’
  rationale: 본문은 아히야의 예언자 정체성과 함께 지리적 표지를 제시하므로, 익숙한 교회식 칭호보다 출신 표지를 우선했습니다.
  doctrine_reference: 본문의 인물 식별 정보 보존
