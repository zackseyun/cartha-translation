- from: 그때에 여로보암이 예루살렘에서 나가는데, 실로 사람 아히야 예언자가 길에서 그를 만나게 되었습니다. 그때 그는 새 겉옷을 두르고 있었고, 둘만 들판에 있었습니다.[a]
