  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְבֹּ֤ץ עָלָי/ו֙ אֲנָשִׁ֔ים וַ/יְהִ֣י שַׂר גְּד֔וּד בַּ/הֲרֹ֥ג דָּוִ֖ד אֹתָ֑/ם וַ/יֵּלְכ֤וּ דַמֶּ֨שֶׂק֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַֽ/יִּמְלְכ֖וּ בְּ/דַמָּֽשֶׂק־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/024.yaml
  text: He gathered men to himself and became commander of a band when David killed them. They went to Damascus[a], settled there, and reigned in Damascus.
  footnotes:
  - marker: a
    text: 'Hebrew has plural verbs throughout the latter half of the verse: ''they went ... settled ... reigned.'' Some translations smooth this to singular (''he'') because the context centers on Rezon.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 자기에게 사람들을 모으고, 다윗이 그들을 죽였을 때 한 무리의 우두머리가 되었습니다. 그들은 다마스쿠스로 가서 거기에 정착했고, 다마스쿠스에서 다스렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이 절 후반에서 복수 동사를 사용합니다. 일부 번역은 문맥상 레손을 중심으로 단수로 매끈하게 정리합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ עָלָיו אֲנָשִׁים
  english_pob_choice: He gathered men to himself
  chosen_korean: 자기에게 사람들을 모으고
  alternatives_korean:
  - 자기 주위에 사람들을 모으고
  - 사람들을 자기에게 불러모으고
  lexicon: HALOT
  rationale: עַל + 인칭접미사가 ‘자기 쪽으로/자기에게’의 방향성을 가지므로, 자연스러운 현대 한국어로 ‘자기에게 사람들을 모으고’라고 옮겼습니다.
- source_word: אֲנָשִׁים
  english_pob_choice: men
  chosen_korean: 사람들을
  alternatives_korean:
  - 남자들을
  - 사람들
  lexicon: HALOT
  rationale: 여기서는 군사적 집단의 구성원을 가리키지만, 한국어에서는 성별을 과도하게 드러내지 않는 ‘사람들’이 문맥을 해치지 않으면서 자연스럽습니다.
- source_word: שַׂר גְּדוּד
  english_pob_choice: commander of a band
  chosen_korean: 한 무리의 우두머리
  alternatives_korean:
  - 부대의 지휘관
  - 무리의 장관
  lexicon: HALOT
  rationale: שַׂר는 ‘우두머리/지휘관’이고 גְּדוּד는 비교적 작은 무리나 무장 집단을 가리킬 수 있어, 군사적 뉘앙스를 살리되 과도하게 해석하지 않는 표현을 택했습니다.
- source_word: וַיֵּלְכוּ דַמֶּשֶׂק
  english_pob_choice: They went to Damascus
  chosen_korean: 다마스쿠스로 가서
  alternatives_korean:
  - 다마스쿠스로 갔고
  - 다마스쿠스로 떠나
  lexicon: HALOT
  rationale: 지속되는 서술 흐름을 살리면서 이동을 자연스럽게 표현하기 위해 ‘가서’를 사용했습니다.
- source_word: וַיֵּשְׁבוּ בָהּ
  english_pob_choice: settled there
  chosen_korean: 거기에 정착했고
  alternatives_korean:
  - 거기 살았고
  - 거기에 거주했고
  lexicon: HALOT
  rationale: ישב은 단순한 거주보다 정착의 의미를 띨 수 있어, ‘정착했고’가 이동 후 안착의 뉘앙스를 잘 드러냅니다.
theological_decisions:
- issue: 마지막 절의 복수 동사와 주어 처리
  chosen_reading: 주어를 복수로 흐리지 않되, 앞의 ‘그’가 이끈 집단의 서술로 자연스럽게 옮겼습니다.
  alternative_readings:
  - 문맥 중심으로 단수 ‘그가 가서… 다스렸습니다’로 정리하는 방식
  - 히브리어 복수를 그대로 살려 ‘그들은… 다스렸습니다’로 옮기는 방식
  rationale: 히브리어는 마지막 절에서 복수 동사를 사용하지만, 한국어에서는 문맥상 핵심 인물을 중심으로 읽히도록 하면서도 집단의 움직임을 함께 유지하는 절충이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §3, §5
