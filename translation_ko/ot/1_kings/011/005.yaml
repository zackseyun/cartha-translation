  text: Solomon went after Ashtoreth[a], the god of the Sidonians, and after Milcom[c][b], the abomination of the Ammonites.
  footnotes:
  - marker: a
    text: Or 'Astarte,' a more widely recognized form of the deity's name.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the god(s) of the Sidonians'; with the named female deity Ashtoreth, the sense is 'the goddess of the Sidonians.'
    reason: lexical_alternative
  - marker: c
    text: Some associate Milcom with Molech, but the Hebrew text here reads 'Milcom.'
    reason: alternative_reading
translation:
  language: ko
  text: 솔로몬은 시돈 사람들의 신인 아스다롯[a][b]을 따랐고, 암몬 사람들의 가증한 것인 밀곰[c]도 따랐습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아스타르테’—이 신의 이름으로 더 널리 알려진 형태입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 형태상 ‘시돈 사람들의 신들’입니다. 여기서는 아스다롯이라는 한 신격을 가리키므로 문맥상 단수로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 일부는 밀곰을 몰렉과 관련지어 보지만, 이 절의 히브리어 본문은 ‘밀곰’이라고 읽습니다.
    reason: alternative_reading
