reference: 1 Kings 11:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י שֵׁ֧שֶׁת חֳדָשִׁ֛ים יָֽשַׁב שָׁ֥ם יוֹאָ֖ב וְ/כָל יִשְׂרָאֵ֑ל עַד הִכְרִ֥ית כָּל זָכָ֖ר בֶּ/אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/016.yaml
  text: For Joab and all Israel had remained there six months[b][a], until he had cut off every male in Edom.
  footnotes:
  - marker: a
    text: Or 'destroyed' or 'exterminated' every male. The Hebrew verb literally means 'cut off,' an idiom for eliminating a population.
    reason: lexical_alternative
  - marker: b
    text: '''All Israel'' likely refers to the Israelite fighting force with Joab, not necessarily every individual in the nation.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 요압과 온 이스라엘이 거기서 여섯 달 동안 머물렀는데, 에돔의 모든 남자를 끊어 버릴 때까지였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘끊어 버리다’는 히브리어 동사의 직역이지만, 여기서는 한 집단을 제거하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘온 이스라엘’은 나라의 모든 개인이라기보다 요압과 함께한 이스라엘의 전투 집단을 가리킬 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁשֶׁת חֳדָשִׁים
  english_pob_choice: six months
  chosen_korean: 여섯 달 동안
  alternatives_korean:
  - 여섯 달
  - 여섯 개월 동안
  lexicon: HALOT
  rationale: 기간 표현은 한국어에서 자연스러운 ‘여섯 달 동안’으로 옮겨 시간의 지속을 분명히 했습니다.
- source_word: יָשַׁב
  english_pob_choice: had remained
  chosen_korean: 머물렀는데
  alternatives_korean:
  - 살았는데
  - 앉아 있었는데
  - 거주했는데
  lexicon: HALOT
  rationale: 군사적 문맥에서 יָשַׁב의 ‘머물다/남아 있다’ 뉘앙스를 살려 정착보다 지속적 체류를 나타냈습니다.
- source_word: הִכְרִית
  english_pob_choice: he had cut off
  chosen_korean: 끊어 버릴 때까지
  alternatives_korean:
  - 잘라 버릴 때까지
  - 없애 버릴 때까지
  - 멸절시킬 때까지
  lexicon: HALOT
  rationale: 히필 동사의 직역인 ‘끊다’의 이미지를 살리되, 한국어에서 자연스러운 결과 표현으로 ‘끊어 버리다’를 택했습니다. POB의 주석처럼 이는 인구 제거의 관용어입니다.
- source_word: כָּל זָכָר
  english_pob_choice: every male
  chosen_korean: 에돔의 모든 남자
  alternatives_korean:
  - 에돔의 모든 남성
  - 에돔의 모든 남자들
  - 에돔의 모든 수컷
  lexicon: HALOT
  rationale: זָכָר는 성별 표지이므로 ‘남자/남성’으로 옮겼습니다. 문맥상 전면적 제거의 대상이지만, 원문의 성별 표지를 분명히 하기 위해 ‘모든 남자’를 택했습니다.
- source_word: וְכָל יִשְׂרָאֵל
  english_pob_choice: and all Israel
  chosen_korean: 요압과 온 이스라엘
  alternatives_korean:
  - 요압과 모든 이스라엘
  - 요압과 이스라엘 모두
  lexicon: HALOT
  rationale: 히브리어는 요압과 함께한 집단을 가리키는 것으로 보이므로, POB의 주석 취지를 따라 ‘온 이스라엘’로 옮겨 전체 민족이라기보다 동행한 전투 집단의 가능성을 남겼습니다.
theological_decisions:
- issue: 전멸 표현의 강도와 한국어 윤리적 완화 여부
  chosen_reading: 원문의 전투적·파괴적 강도를 약화하지 않고 ‘끊어 버릴 때까지’로 직설적으로 옮겼습니다.
  alternative_readings:
  - 멸망시킬 때까지
  - 전멸시킬 때까지
  - 죽여 없앨 때까지
  rationale: 본문의 히브리어 관용구와 POB의 어감 유지 원칙을 따라, 독자가 본문이 말하는 폭력의 강도를 그대로 인식하도록 했습니다.
  doctrine_reference: 본문-충실 번역 원칙
- issue: ‘온 이스라엘’의 범위
  chosen_reading: 집단 전체를 뜻하는 표현이지만, 실제로는 요압과 함께한 이스라엘 전투 병력을 가리킬 수 있음을 본문 밖 정보로 암시하지 않고 본문 형태를 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들 모두
  - 이스라엘 군대
  rationale: POB의 문화적 주석을 반영하되 본문 자체는 일반적인 집합 명칭을 유지하는 것이 가장 투명합니다.
  doctrine_reference: 역사서의 집합 명사 해석
