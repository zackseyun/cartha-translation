  source_fidelity: 수정이 필요합니다. 초안 첫머리의 ‘그는’은 원문에 없는 별도 주어를 삽입하며, 뒤의 ‘요압과 온 이스라엘’과도 문법적으로 충돌합니다. 또한 히브리어 단수 동사 הִכְרִית의 행위자는 문맥상 요압으로 이해되므로, 한국어에서는 요압을 명시하여 문장 관계를 분명히 하는 것이 적절합니다. בֶאֱדוֹם은 ‘에돔의’보다 행위의 장소를 나타내는 ‘에돔에 있는/에돔에서’가 더 충실합니다.
  naturalness: 초안의 ‘머물렀는데, … 때까지였습니다’는 연결 방식과 서술 종결이 어색합니다. ‘… 때까지 거기에서 여섯 달 동안 머물러 있었습니다’로 정리하면 현대 한국어의 자연스러운 합쇼체 서술이 됩니다.
  terminology: ‘요압’, ‘온 이스라엘’, ‘끊어 버리다’는 적절합니다. 다만 각주에서는 ‘끊어 버리다’ 전체가 히브리어의 직역이라는 표현보다, 기본 뜻인 ‘끊다’가 이 문맥에서 집단을 제거한다는 관용적 의미를 지닌다고 설명하는 편이 정확합니다.
