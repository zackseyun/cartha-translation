source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לִ/שְׁלֹמֹ֗ה יַ֚עַן אֲשֶׁ֣ר הָֽיְתָה זֹּ֣את עִמָּ֔/ךְ וְ/לֹ֤א שָׁמַ֨רְתָּ֙ בְּרִיתִ֣/י וְ/חֻקֹּתַ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי עָלֶ֑י/ךָ קָרֹ֨עַ אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מֵֽ/עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/הָ לְ/עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/011.yaml
  text: So Yahweh said to Solomon[a], “Because this has been with you, and you have not kept my covenant and my statutes that I commanded you, I will surely tear the kingdom away from you and give it to your servant.”
  footnotes:
  - marker: a
    text: Or, more literally, “Because this has been with you.” The Hebrew expression is idiomatic and refers to Solomon’s settled conduct or condition.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 야훼께서 솔로몬에게 말씀하셨습니다. “네게 이런 일이 있었고, 네가 내 언약과 내가 네게 명령한 내 규례들을 지키지 않았으므로, 내가 반드시 왕국을 네게서 찢어 빼앗아 네 종에게 주겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네게 이런 일이 있었고’는 히브리어 관용구를 반영한 것으로, 솔로몬의 지속된 상태나 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: The Tetragrammaton을 고유명사로 살려, 본문이 드러내는 하나님의 언약 이름을 제목어 ‘주’로 바꾸지 않고 음역했습니다.
- source_word: הָיְתָה זֹּאת עִמָּךְ
  english_pob_choice: this has been with you
  chosen_korean: 이 일이 네게 있었고
  alternatives_korean:
  - 이것이 네게 있었고
  - 이 일이 네게 함께 있었고
  - 이것이 네 안에 있었고
  lexicon: HALOT
  rationale: 직역하면 어색하지만, 히브리어의 관용구가 솔로몬의 지속된 상태/행위를 가리키므로 한국어에서는 원문의 함의를 과도하게 풀지 않는 범위에서 자연스럽게 옮겼습니다.
- source_word: בְּרִיתִי / חֻקֹּתַי
  english_pob_choice: my covenant / my statutes
  chosen_korean: 내 언약과 내가 네게 명령한 내 규례들
  alternatives_korean:
  - 내 언약과 내 규례들
  - 내 계약과 내 율례들
  - 내 언약과 내 법도들
  lexicon: HALOT
  rationale: בְּרִית는 ‘언약’으로, חֻקֹּת는 율법 문맥의 정형 표현인 ‘규례’로 옮겨 서로 다른 법적 뉘앙스를 살렸습니다.
- source_word: קָרֹעַ אֶקְרַע
  english_pob_choice: I will surely tear
  chosen_korean: 내가 반드시 왕국을 네게서 찢어 빼앗아
  alternatives_korean:
  - 내가 반드시 왕국을 네게서 찢어
  - 내가 왕국을 너에게서 찢어 빼앗겠습니다
  - 내가 왕국을 네게서 확실히 찢겠습니다
  lexicon: HALOT
  rationale: 부정확한 완곡어법을 피하고, 강조형 표현의 폭력성과 확실성을 한국어에서도 드러내기 위해 ‘반드시’와 ‘찢어 빼앗아’를 결합했습니다.
- source_word: לְעַבְדֶּךָ
  english_pob_choice: to your servant
  chosen_korean: 네 종에게
  alternatives_korean:
  - 네 종에게
  - 네 신하에게
  - 네 종에게 주겠습니다
  lexicon: HALOT
  rationale: עֶבֶד를 단순한 궁정 ‘신하’로 순화하기보다, 본문이 의도하는 종속 관계를 드러내기 위해 기본값인 ‘종’을 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 본문에서 고유명사로 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 열왕기상 11:11은 하나님의 개인 이름을 직접 사용하므로, 제목어로 치환하지 않고 고유명사로 보존하는 것이 원문 감각을 더 정확히 전달합니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
- issue: ‘왕국’을 찢어 옮긴다는 심판 선언의 강도
  chosen_reading: ‘내가 반드시 왕국을 네게서 찢어 빼앗아…’로 심판의 단호함을 유지했습니다.
  alternative_readings:
  - 왕국을 네게서 거두어
  - 나라를 네게서 떼어 내어
  - 왕국을 네게서 빼앗아
  rationale: 히브리어의 강한 절단 이미지를 약화시키지 않기 위해, 한국어에서도 물리적 훼손의 이미지를 살린 동사를 유지했습니다.
  doctrine_reference: 원문 수사와 심판 선언의 강도 보존
