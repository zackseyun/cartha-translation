  text: וַ/תֵּ֨לֶד ל֜/וֹ אֲח֣וֹת תַּחְפְּנֵ֗יס אֵ֚ת גְּנֻבַ֣ת בְּנ֔/וֹ וַ/תִּגְמְלֵ֣/הוּ תַחְפְּנֵ֔ס בְּ/ת֖וֹךְ בֵּ֣ית פַּרְעֹ֑ה וַ/יְהִ֤י גְנֻבַת֙ בֵּ֣ית פַּרְעֹ֔ה בְּ/ת֖וֹךְ בְּנֵ֥י פַרְעֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/020.yaml
  text: And the sister of Tahpenes bore him Genubath his son[a], and Tahpenes weaned him within Pharaoh’s house[b]; and Genubath was in Pharaoh’s house among the sons of Pharaoh.
  footnotes:
  - marker: a
    text: Or, 'Tahpenes’s sister bore him a son, Genubath.' The Hebrew word order can be represented either way in English, but the sense is unchanged.
    reason: lexical_alternative
  - marker: b
    text: '''Weaned him'' refers to the child’s being brought to the stage of no longer nursing, after which he remained in Pharaoh’s household.'
    reason: cultural_note
translation:
  language: ko
  text: 다브네스의 누이가 그에게 아들 그누밧을 낳았고[a], 다브네스가 그 아이를 바로의 집 안에서 젖을 떼게 하였으며[b], 그누밧은 바로의 집 안에서 바로의 아들들 가운데 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 어순은 ‘그에게 그누밧, 그의 아들을 낳았고’에 가깝습니다. 따라서 ‘다브네스의 누이가 그의 아들 그누밧을 낳았다’로도 옮길 수 있으나, 뜻은 같습니다.
    reason: alternative_reading
  - marker: b
    text: ‘젖을 떼게 하였다’는 아이가 더 이상 젖을 먹지 않게 되는 단계에 이르게 했다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶד לּוֹ / bore him
  english_pob_choice: bore him
  chosen_korean: 그에게 … 낳았고
  alternatives_korean:
  - 그를 낳았고
  - 그에게 아들을 낳았고
  lexicon: HALOT
  rationale: לּוֹ의 여격 관계를 살려 ‘그에게’로 옮기고, 본문상 출생 결과를 자연스럽게 드러내기 위해 ‘낳았고’를 택했습니다.
- source_word: אֲחוֹת תַּחְפְּנֵיס / the sister of Tahpenes
  english_pob_choice: the sister of Tahpenes
  chosen_korean: 다카네스의 누이
  alternatives_korean:
  - 다카네스의 자매
  - 다카네스의 언니/동생
  lexicon: HALOT
  rationale: 히브리어의 소유·친족 관계를 간결하게 살려 ‘다카네스의 누이’로 옮겼습니다.
- source_word: וַתִּגְמְלֵהוּ / weaned him
  english_pob_choice: weaned him
  chosen_korean: 젖을 떼게 하였으며
  alternatives_korean:
  - 젖을 떼게 했으며
  - 젖을 먹이지 않게 하였으며
  - 젖을 뗀 뒤 키웠으며
  lexicon: HALOT
  rationale: ‘젖을 떼다’는 유아가 더 이상 젖을 먹지 않는 시점을 직접적으로 표현하므로, 본문의 문화적·발달적 의미를 가장 정확히 전달합니다.
- source_word: בְּתוֹךְ בֵּית פַּרְעֹה / within Pharaoh’s house
  english_pob_choice: within Pharaoh’s house
  chosen_korean: 바로의 집 안에서
  alternatives_korean:
  - 바로의 집 가운데서
  - 바로의 궁 안에서
  - 바로의 집 안
  lexicon: HALOT
  rationale: ‘집’의 공간성을 살리되 한국어로 자연스럽게 읽히도록 ‘집 안에서’로 옮겼습니다. 반복되는 구문이므로 동일한 표현을 유지했습니다.
