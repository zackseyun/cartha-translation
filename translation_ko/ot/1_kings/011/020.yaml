  naturalness: 현 초안의 ‘그에게 게누밧, 곧 그의 아들을 낳았고’는 한국어 어순상 부자연스럽고 ‘곧’이 불필요한 해설처럼 들립니다. 또한 각주 표지가 문장 끝에 한데 붙어 있어 해당 어구와의 연결이 불분명합니다. 수정안은 현대 표준어 합쇼체 문체로 자연스럽게 다듬고 각주를 해당 어구에 배치했습니다.
