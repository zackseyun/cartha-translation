lexical_decisions:
- source_word: אֶקַּח
  english_pob_choice: I will take
  chosen_korean: 내가 너를 택하겠다
  alternatives_korean:
  - 내가 너를 데려가겠다
  - 내가 너를 취하겠다
  lexicon: HALOT
  rationale: 여기서는 단순한 이동보다 신적 선발과 임명에 가까운 문맥이므로, 한국어로는 ‘택하다’가 POB의 ‘take’가 지닌 선택·취임의 힘을 가장 자연스럽게 드러냅니다.
- source_word: וּמָלַכְתָּ
  english_pob_choice: you shall reign
  chosen_korean: 네가 … 다스릴 것이며
  alternatives_korean:
  - 네가 통치할 것이며
  - 네가 왕으로 다스릴 것이며
  lexicon: HALOT
  rationale: מלך는 단순히 왕위에 오르는 것보다 왕으로서 통치하는 행위를 가리키므로, ‘다스리다’로 옮기되 앞뒤 문맥으로 왕권을 분명히 했습니다.
- source_word: תְּאַוֶּה נַפְשֶׁךָ
  english_pob_choice: your soul desires
  chosen_korean: 네 영혼이 원하는
  alternatives_korean:
  - 네 마음이 원하는
  - 네가 원하는
  lexicon: HALOT
  rationale: 영어 POB가 문구의 직역성을 살리기 위해 ‘soul’을 유지한 점을 따라, 한국어에서도 ‘영혼’을 써서 נֶפֶשׁ의 어휘적 표지를 보존했습니다.
- source_word: עַל יִשְׂרָאֵל
  english_pob_choice: over Israel
  chosen_korean: 이스라엘의 왕
  alternatives_korean:
  - 이스라엘 위에
  - 이스라엘을 다스리는 왕
  lexicon: HALOT
  rationale: עַל + 왕권 표현은 한국어에서 ‘~의 왕’이 가장 자연스럽고 권위 관계도 분명히 전달하므로, 본문 전체를 매끈하게 살렸습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역
  chosen_reading: ‘네 영혼이 원하는’으로 직역성을 유지했습니다.
  alternative_readings:
  - ‘네 마음이 원하는’
  - ‘네가 원하는’
  rationale: 이 구절은 영혼의 교리적 진술이 아니라 히브리어 관용구의 표지이므로, 의미를 평준화하지 않고 어휘적 긴장을 보존하는 편이 소스 충실성에 더 부합합니다.
  doctrine_reference: '번역 철학 #1, #5'
