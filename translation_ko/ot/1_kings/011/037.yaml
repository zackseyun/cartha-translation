  naturalness: ‘내가 너를 데려갈 것이며’는 원문의 동사적 표현을 보존하면서도 현대 한국어로 이해할 수 있습니다. 통치 범위는 ‘모든 것을 다스릴 것이다’가 자연스럽습니다. ‘영혼’은 한국어에서 다소 신학적·문어적인 인상을 주므로 본문은 자연스러운 관용 표현으로 옮기고, 각주에서 직역을 밝혀 원문의 어휘를 보존합니다.
