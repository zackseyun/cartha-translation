id: 1KI.11.28
reference: 1 Kings 11:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ/אִ֥ישׁ יָרָבְעָ֖ם גִּבּ֣וֹר חָ֑יִל וַ/יַּ֨רְא שְׁלֹמֹ֜ה אֶת הַ/נַּ֗עַר כִּֽי עֹשֵׂ֤ה מְלָאכָה֙ ה֔וּא וַ/יַּפְקֵ֣ד אֹת֔/וֹ לְ/כָל סֵ֖בֶל בֵּ֥ית יוֹסֵֽף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/028.yaml
  text: Now the man Jeroboam was a mighty man of valor[a], and Solomon saw that the young man was industrious[b], so he appointed him over all the labor force of the house of Joseph.
  footnotes:
  - marker: a
    text: Or 'a capable man' or 'a valiant man.' The Hebrew expression can denote strength, valor, or notable ability.
    reason: lexical_alternative
  - marker: b
    text: '''The house of Joseph'' refers to the tribes descended from Joseph, especially Ephraim and Manasseh.'
    reason: cultural_note
translation:
  language: ko
  text: 여로보암은 뛰어난 능력을 지닌 사람이었고[a], 솔로몬은 그 젊은이가 부지런히 일하는 것을 보고 그를 요셉 집안의 모든 노역[b]의 책임자로 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘용맹한 사람’, ‘유능한 사람’. 히브리어 표현은 힘, 용맹, 두드러진 능력을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘요셉 집안’은 요셉에게서 나온 지파들, 특히 에브라임과 므낫세를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: גִּבּוֹר חָיִל
  english_pob_choice: a mighty man of valor
  chosen_korean: 용맹한 사람
  alternatives_korean:
  - 유능한 사람
  - 용사다운 사람
  - 담대한 사람
  lexicon: HALOT
  rationale: 이 표현은 전투적 무용만이 아니라 능력과 기개를 함께 가리킬 수 있어, 한국어에서는 자연스럽게 포괄하는 ‘용맹한 사람’으로 옮겼습니다.
- source_word: הַנַּעַר
  english_pob_choice: the young man
  chosen_korean: 그 젊은이
  alternatives_korean:
  - 그 청년
  - 그 소년
  - 그 종
  lexicon: HALOT
  rationale: 여기서는 단순한 나이 묘사가 아니라 행정 책임을 맡을 수 있는 젊은 남자를 가리키므로 ‘젊은이’가 가장 무난합니다.
- source_word: עֹשֵׂה מְלָאכָה הוּא
  english_pob_choice: was industrious
  chosen_korean: 부지런히 일하는
  alternatives_korean:
  - 일을 잘하는
  - 일을 하는
  - 성실하게 일하는
  lexicon: HALOT
  rationale: 직역하면 ‘일을 하는 사람’이지만, 솔로몬이 그를 높이 평가한 이유를 드러내는 문맥상 ‘부지런히 일하는’이 의미를 가장 잘 살립니다.
- source_word: לְכָל סֵבֶל
  english_pob_choice: over all the labor force
  chosen_korean: 모든 노역
  alternatives_korean:
  - 모든 노동
  - 모든 부역
  - 모든 강제노동
  lexicon: HALOT
  rationale: סֵבֶל은 짐을 지는 노동, 곧 부역·노역의 성격을 띠므로 ‘노역’이 본문의 사회적 함의를 비교적 직접적으로 전달합니다.
- source_word: בֵּית יוֹסֵף
  english_pob_choice: of the house of Joseph
  chosen_korean: 요셉 집안
  alternatives_korean:
  - 요셉의 집
  - 요셉 가문
  - 요셉 지파
  lexicon: HALOT
  rationale: 히브리어 관용구를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘요셉 집안’으로 옮겼습니다.
theological_decisions:
- issue: 요셉 집안의 범위
  chosen_reading: 본문의 ‘요셉 집안’은 요셉에게서 내려온 지파들, 특히 에브라임과 므낫세를 가리키는 집합적 표현으로 유지했습니다.
  alternative_readings:
  - 에브라임과 므낫세
  - 요셉 지파들
  rationale: 원문 표현을 보존하는 것이 우선이므로 본문에는 직역을 두고, 독자 이해를 위해 문화적 주를 달았습니다.
  doctrine_reference: 족장 지파 전승 / 주해적 명료화
