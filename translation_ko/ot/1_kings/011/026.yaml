source:
  edition: WLC
  text: וְ/יָרָבְעָם֩ בֶּן נְבָ֨ט אֶפְרָתִ֜י מִן הַ/צְּרֵדָ֗ה וְ/שֵׁ֤ם אִמּ/וֹ֙ צְרוּעָה֙ אִשָּׁ֣ה אַלְמָנָ֔ה עֶ֖בֶד לִ/שְׁלֹמֹ֑ה וַ/יָּ֥רֶם יָ֖ד בַּ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/026.yaml
  text: Now Jeroboam son of Nebat[a], an Ephraimite from Zeredah—his mother's name was Zeruah, a widow—was a servant of Solomon[c][b], and he raised his hand against the king.
  footnotes:
  - marker: a
    text: Or 'an Ephrathite,' though here the sense is most likely 'an Ephraimite.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a woman, a widow'; the translation preserves both elements with 'a widow woman.'
    reason: lexical_alternative
  - marker: c
    text: 'Or ''he rebelled against the king.'' Hebrew: ''he raised his hand against the king.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 느밧의 아들 여로보암은 에브라임 사람으로서 세레다에서 왔는데, 그의 어머니는 사망한 여성, 스루아였습니다. 그는 솔로몬의 종이었고, 왕에게 손을 들었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에브라임 사람’은 여기서 지파 소속을 가리키는 것으로 이해하는 것이 가장 자연스럽습니다. ‘에브랏 사람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘여성, 곧 과부’라는 중첩 표현을 사용합니다. 한국어에서는 이를 자연스럽게 풀어 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 히브리어 관용구는 ‘왕에게 반역하다’라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  english_pob_choice: an Ephraimite
  chosen_korean: 에브라임 사람
  alternatives_korean:
  - 에브라임 지파 사람
  - 에브라임인
  - 에브라다 사람
  lexicon: HALOT
  rationale: 문맥상 베들레헴 관련 ‘에브랏 사람’보다 지파 소속을 가리키는 ‘에브라임 사람’이 자연스럽고, 영어 POB의 판단도 이를 따릅니다.
- source_word: צְרוּעָה
  english_pob_choice: Zeruah
  chosen_korean: 스루아
  alternatives_korean:
  - 세루아
  - 제로아
  lexicon: HALOT
  rationale: 고유명사는 음역하는 것이 적절하며, 한국어 성서 관용형에 맞는 형태로 옮겼습니다.
- source_word: אִשָּׁה אַלְמָנָה
  english_pob_choice: a widow woman
  chosen_korean: 사망한 여성
  alternatives_korean:
  - 과부
  - 과부인 여성
  - 과부 여자
  lexicon: HALOT
  rationale: 히브리어가 ‘여성’과 ‘과부’를 나란히 두는 점을 살리려 했습니다. 다만 한국어에서는 ‘과부 여자’가 매우 어색하므로, 서술적으로 풀어 두 요소를 반영했습니다.
- source_word: עֶבֶד
  english_pob_choice: a servant
  chosen_korean: 종
  alternatives_korean:
  - 종복
  - 시종
  - 노예
  lexicon: HALOT
  rationale: 솔로몬 아래의 신분을 나타내므로 ‘종’이 가장 직접적입니다. 여기서는 법적 예속 상태를 전면화하지 않으므로 ‘노예’는 택하지 않았습니다.
- source_word: וַיָּרֶם יָד בַּמֶּלֶךְ
  english_pob_choice: he raised his hand against the king
  chosen_korean: 왕에게 손을 들었습니다
  alternatives_korean:
  - 왕에게 손을 들어 대항했습니다
  - 왕에게 반역했습니다
  - 왕에게 손을 들고 일어났습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 이미지를 보존하면서도 한국어로 자연스럽게 읽히도록 직역에 가깝게 옮겼습니다. ‘반역했습니다’는 의미를 풀어 쓰지만 비유를 일부 지웁니다.
theological_decisions:
- issue: 히브리어 관용구 וַיָּרֶם יָד בַּמֶּלֶךְ의 처리
  chosen_reading: 본문 이미지를 살려 ‘왕에게 손을 들었습니다’로 번역했습니다.
  alternative_readings:
  - 왕에게 반역했습니다
  - 왕에게 손을 들어 대항했습니다
  rationale: 이 표현은 단순한 신체 동작이 아니라 적대적 행동/반역을 암시하지만, 본문 자체의 은유를 보존하는 것이 POB 원칙에 더 부합합니다. 의미는 문맥이 충분히 전달합니다.
  doctrine_reference: 본문-기반 관용구 처리
