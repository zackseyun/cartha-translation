base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/026.yaml
  text: Now Jeroboam son of Nebat[a], an Ephraimite from Zeredah—his mother's name was Zeruah, a widow—was a servant of Solomon[c][b], and he raised his hand against the king.
  footnotes:
  - marker: a
    text: Or 'an Ephrathite,' though here the sense is most likely 'an Ephraimite.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a woman, a widow'; the translation preserves both elements with 'a widow woman.'
    reason: lexical_alternative
  - marker: c
    text: 'Or ''he rebelled against the king.'' Hebrew: ''he raised his hand against the king.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 느밧의 아들 여로보암은 세레다 출신의 에브라임 사람이었으며[a], 그의 어머니의 이름은 과부인 스루아였습니다[b]. 그는 솔로몬의 종이었고, 왕을 거슬러 손을 들었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에브라임 사람’은 여기서 에브라임 지파 소속을 가리키는 것으로 이해하는 것이 가장 자연스럽습니다. ‘에브랏 사람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘여자, 과부’라는 동격 표현을 사용합니다. ‘과부인 스루아’는 이를 자연스러운 한국어로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 관용구는 문자적으로 ‘왕을 거슬러 손을 들다’입니다. ‘왕에게 반역하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
