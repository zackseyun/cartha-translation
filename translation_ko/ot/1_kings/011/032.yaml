id: 1KI.11.32
reference: 1 Kings 11:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/שֵּׁ֥בֶט הָ/אֶחָ֖ד יִֽהְיֶה לּ֑/וֹ לְמַ֣עַן עַבְדִּ֣/י דָוִ֗ד וּ/לְמַ֨עַן֙ יְר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי בָ֔/הּ מִ/כֹּ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/032.yaml
  text: But one tribe will remain his[a], for the sake of my servant David and for the sake of Jerusalem, the city that I have chosen from all the tribes of Israel.
  footnotes:
  - marker: a
    text: 'Hebrew: ''one tribe.'' This is often understood with Benjamin attached to Judah, especially because of Jerusalem''s location, but the text itself reads ''one tribe.'''
    reason: alternative_reading
translation:
  language: ko
  text: 하지만 한 지파는 그에게 남을 것입니다[a]. 이는 내 종 다윗을 위함이며, 내가 이스라엘의 모든 지파 가운데서 택한 그 성읍 예루살렘을 위함입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘한 지파’라고 씁니다. 보통은 베냐민이 예루살렘의 위치 때문에 유다에 붙는 것으로 이해되지만, 본문 자체는 ‘한 지파’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֵּׁבֶט הָאֶחָד
  english_pob_choice: But one tribe
  chosen_korean: 하지만 한 지파
  alternatives_korean:
  - 그리고 한 지파
  - 그러나 한 지파
  lexicon: HALOT
  rationale: שֵׁבֶט은 여기서 막대기나 홀보다 지파 단위를 가리키며, 앞선 분열 선언과의 대조를 살려 ‘하지만’으로 옮겼습니다.
- source_word: יִהְיֶה לּוֹ
  english_pob_choice: will remain his
  chosen_korean: 그에게 남을 것입니다
  alternatives_korean:
  - 그의 것이 될 것입니다
  - 그의 몫으로 남을 것입니다
  lexicon: HALOT
  rationale: ‘그에게 있을 것이다’라는 관용구를 문맥상 남게 된 소유/보존의 뜻으로 풀어, 분열 뒤에도 한 지파가 남는다는 의미를 분명히 했습니다.
- source_word: עַבְדִּי דָוִד
  english_pob_choice: my servant David
  chosen_korean: 내 종 다윗
  alternatives_korean:
  - 나의 종 다윗
  - 종 다윗
  lexicon: HALOT
  rationale: 언약적·왕실적 호칭인 עֶבֶד는 여기서 ‘종’이 자연스럽고, 본문의 존칭적 맥락을 해치지 않도록 평이하게 옮겼습니다.
- source_word: אֲשֶׁר בָּחַרְתִּי בָהּ
  english_pob_choice: that I have chosen
  chosen_korean: 내가 ... 택한
  alternatives_korean:
  - 내가 ... 선택한
  - 내가 ... 골라 세운
  lexicon: HALOT
  rationale: בחר의 선택 의미를 살리되, 완료 시상의 현재적 효력을 드러내기 위해 ‘택한’으로 옮겼습니다.
theological_decisions:
- issue: ‘한 지파’라는 표현과 역사적 계산(유다와 베냐민의 결합 가능성) 사이의 긴장
  chosen_reading: 본문을 그대로 따라 ‘한 지파’로 옮기고, 역사적 조화는 본문 밖에서 다룹니다.
  alternative_readings:
  - ‘한 나라’로 완화해서 번역
  - 유다와 베냐민을 암시하는 해석을 본문에 반영
  rationale: 히브리어 본문이 명시적으로 ‘한 지파’라고 말하므로, 번역은 그 표현을 보존해 해석상의 긴장을 지우지 않아야 합니다.
  doctrine_reference: 본문 우선과 해석상 긴장의 보존
- issue: ‘선택한’의 신학적 뉘앙스
  chosen_reading: 하나님이 예루살렘을 여러 지파 가운데서 주권적으로 택하셨다는 선택 언어를 유지합니다.
  alternative_readings:
  - 단순히 ‘정한’으로 완화
  - ‘사랑한’으로 의역
  rationale: בחר는 단순 지정보다 선택/택함의 의미가 강하므로, 하나님의 주권적 선택을 드러내는 번역이 적절합니다.
  doctrine_reference: 신적 선택
