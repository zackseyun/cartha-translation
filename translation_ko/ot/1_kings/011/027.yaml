    rationale: הֵרִים יָד בַּמֶּלֶךְ의 전치사구는 왕에 대한 적대 행위를 나타냅니다. ‘왕을 거슬러 손을 들다’는 관용의 형상을 유지하면서 이 관계를 자연스럽게 전달합니다.
