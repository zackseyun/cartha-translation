id: 1KI.11.27
reference: 1 Kings 11:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר הֵרִ֥ים יָ֖ד בַּ/מֶּ֑לֶךְ שְׁלֹמֹה֙ בָּנָ֣ה אֶת הַ/מִּלּ֔וֹא סָגַ֕ר אֶת פֶּ֕רֶץ עִ֖יר דָּוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/027.yaml
  text: 'And this was the reason why he raised his hand against the king: Solomon had built the Millo and closed up the breach of the city of David his father[a][b].'
  footnotes:
  - marker: a
    text: Or, more interpretively, 'he rebelled against King Solomon.' The Hebrew idiom is literally 'he raised his hand against the king.'
    reason: alternative_reading
  - marker: b
    text: '''The Millo'' is likely a named fortification or terraced fill structure in Jerusalem.'
    reason: cultural_note
translation:
  language: ko
  text: 그가 왕에게 손을 든 까닭은 이렇습니다. 솔로몬이 밀로를 건축하고 자기 아버지 다윗의 성읍의 틈을 막아 놓았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왕에게 손을 들었다’입니다. 여기서는 왕에 대한 반역 또는 적대 행위를 가리키는 관용구입니다.
    reason: alternative_reading
  - marker: b
    text: ‘밀로’는 예루살렘의 특정한 성곽·채움 구조물 또는 그와 관련된 지칭으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְזֶה הַדָּבָר אֲשֶׁר
  english_pob_choice: And this was the reason why
  chosen_korean: 그가 왕에게 손을 든 까닭은 이렇습니다
  alternatives_korean:
  - 이것이 그가 왕에게 손을 든 이유입니다
  - 이것이 그가 왕에게 반역한 까닭입니다
  lexicon: HALOT
  rationale: 히브리어 관용구 전체가 뒤이어 나오는 반역의 동기를 설명하므로, 한국어에서는 설명적 도입인 ‘까닭은 이렇습니다’로 자연스럽게 풀어 주되, 본문의 원관용은 뒤의 표현에서 살렸습니다.
- source_word: הֵרִים יָד בַּמֶּלֶךְ
  english_pob_choice: raised his hand against the king
  chosen_korean: 왕에게 손을 든
  alternatives_korean:
  - 왕에게 반역한
  - 왕을 대적한
  lexicon: HALOT
  rationale: 직역에 가까운 관용 표현을 유지해, 본문이 말하는 적대 행위를 완곡하게 약화시키지 않았습니다. POB의 본문 선택을 따라 ‘반역한’은 본문 대신 해석적 대안으로 남겼습니다.
- source_word: הַמִּלּוֹא
  english_pob_choice: the Millo
  chosen_korean: 밀로
  alternatives_korean:
  - 밀로 요새
  - 밀로 지역
  lexicon: HALOT
  rationale: מִלּוֹא는 예루살렘의 특정 지명·구조물 용어이므로 음역을 유지하는 것이 가장 안전합니다. 의미는 주석 없이 단정하지 않았습니다.
- source_word: סָגַר אֶת פֶּרֶץ
  english_pob_choice: closed up the breach
  chosen_korean: 틈을 막아 놓았기 때문입니다
  alternatives_korean:
  - 무너진 곳을 막았기 때문입니다
  - 성벽의 틈을 메웠기 때문입니다
  lexicon: HALOT
  rationale: פֶּרֶץ는 성벽/방어 시설의 ‘틈, 허물어진 곳, 파손된 곳’을 뜻하므로, 한국어에서는 ‘틈을 막다’로 간결하고 정확하게 옮겼습니다. ‘막아 놓았기’는 완료 동작을 반영합니다.
- source_word: עִיר דָּוִד אָבִיו
  english_pob_choice: the city of David his father
  chosen_korean: 자기 아버지 다윗의 성읍
  alternatives_korean:
  - 그의 아버지 다윗의 성읍
  - 다윗 자기 아버지의 성읍
  lexicon: HALOT
  rationale: ‘다윗의 성읍’은 예루살렘의 통용되는 지칭을 보존하고, אָבִיו는 솔로몬의 생부를 가리키므로 ‘자기 아버지’로 관계를 분명히 했습니다.
theological_decisions:
- issue: 헤브라이 관용구의 반역성 유지 여부
  chosen_reading: 직역적 관용인 ‘왕에게 손을 든’을 본문에 두고, 해석적 의미는 문맥 전체로 드러나게 했습니다.
  alternative_readings:
  - ‘왕에게 반역한’으로 직접 해석
  - ‘왕을 대적한’으로 완화
  rationale: 본문의 표현은 단순한 감정 표시가 아니라 왕권에 대한 적대 행위를 나타내므로, 관용을 유지해 텍스트의 긴장과 뉘앙스를 보존하는 것이 바람직합니다.
  doctrine_reference: 본문 해석 원리와 문학적 진술 보존
- issue: ‘밀로’의 지시 대상 불확정성
  chosen_reading: ‘밀로’를 음역으로 남겨 특정 구조물/지형을 단정하지 않았습니다.
  alternative_readings:
  - ‘밀로 요새’로 특정화
  - ‘축조된 채움 구조’로 설명화
  rationale: 자료상 밀로는 예루살렘의 특정 건축·지형 용어로 보이지만, 본문 자체는 그 성격을 상세히 규정하지 않습니다. 따라서 번역문에서는 지명성을 우선하고, 의미 확정은 주석 수준에 맡겼습니다.
  doctrine_reference: 본문 외 삽입 최소화 원칙
