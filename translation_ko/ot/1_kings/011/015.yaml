- from: 그 일이 있었습니다. 다윗이 에돔에 있을 때, 군대의 지휘관 요압이 죽은 사람들을 장사하러 올라갔을 때, 그는 에돔의 모든 남자를 쳐 죽였습니다—[a][b]
