    text: 직역하면 ‘다윗이 에돔과 함께 있을 때’에 가깝습니다. 문맥상 다윗이 에돔에서 벌인 원정 또는 그곳에 있었던 일을 가리키는 것으로 이해됩니다.
    reason: alternative_reading
