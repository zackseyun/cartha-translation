  lexicon: WLC/HALOT
  rationale: וַיַּךְ의 폭력성을 약화하지 않기 위해 '쳐 죽였습니다'로 옮겨, 단순한 '죽였다'보다 심각한 군사적 폭력을 반영했습니다.
theological_decisions:
- issue: 전쟁 폭력의 직접성 보존
  chosen_reading: 본문의 잔혹한 진술을 완화하지 않고, 에돔의 모든 남자가 치명적으로 공격받았다는 사실을 그대로 드러냈습니다.
  alternative_readings:
  - '''에돔 사람들을 무찔렀습니다''로 완화'
  - 본문에 없는 해설을 덧붙여 집단학살로 명시
  rationale: 본문은 역사 서술로서 매우 강한 폭력성을 담고 있으므로, 신학적·윤리적 부담을 이유로 완화하거나 확장하지 않고 원문의 충격을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
