  rationale: 서사 도입 공식인 וַיְהִי를 자연스러운 현대 한국어로 옮기되, 단순 접속어보다 사건 서두의 구문임을 드러내기 위해 선택했습니다.
- source_word: בִּהְיוֹת דָּוִד אֶת אֱדוֹם
