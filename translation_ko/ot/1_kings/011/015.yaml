  source_fidelity: 핵심 사건과 시간절은 대체로 충실합니다. 그러나 הַחֲלָלִים는 특히 전쟁·전투에서 죽임을 당한 이들인 ‘전사자들/죽임당한 이들’을 뜻하므로, 일반적인 ‘죽은 사람들’보다 그 뉘앙스를 반영해야 합니다. 또한 וַיַּךְ는 이 문맥에서 치명적 결과를 수반하므로 ‘쳐 죽였습니다’는 적절합니다.
  naturalness: 현대 합쇼체는 대체로 자연스럽지만, ‘그 일이 있었습니다’는 선행 지시 대상이 없어 다소 부자연스럽습니다. ‘다음과 같은 일이 있었습니다’가 서사 도입 공식의 기능을 더 자연스럽게 드러냅니다. 각주 표지도 해당 표현 및 문제의 히브리어 구절 바로 뒤에 놓는 것이 적절합니다.
