  text: 다음과 같은 일이 있었습니다[a]. 다윗이 에돔에 있을 때[b], 군대 지휘관 요압이 전사자들을 묻으러 올라갔을 때, 요압은 에돔의 모든 남자를 쳐 죽였습니다.
