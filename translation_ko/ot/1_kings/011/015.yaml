  lexicon: WLC/HALOT
  rationale: 이 단어는 전투에서 죽은 자들을 가리키지만, 앞의 '장사하러'와 결합된 문맥을 살려 장례 대상임을 먼저 드러내는 표현을 택했습니다.
- source_word: וַיַּךְ כָּל זָכָר בֶּאֱדוֹם
  english_pob_choice: he struck down every male in Edom
  chosen_korean: 그는 에돔의 모든 남자를 쳐 죽였습니다
  alternatives_korean:
