translation:
  language: ko
  text: 그 일이 있었습니다. 다윗이 에돔에 있을 때, 군대의 지휘관 요압이 죽은 사람들을 장사하러 올라갔을 때, 그는 에돔의 모든 남자를 쳐 죽였습니다—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 흔한 서사 도입 공식을 사용합니다.
    reason: source_note
  - marker: b
    text: 직역하면 '다윗이 에돔과 함께 있을 때'에 가깝지만, 문맥상 다윗의 에돔 원정/주둔을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
