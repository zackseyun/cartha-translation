language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב שְׁלֹמֹה֙ עִם אֲבֹתָ֔י/ו וַ/יִּ֨קָּבֵ֔ר בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ רְחַבְעָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/043.yaml
  text: And Solomon slept with his fathers and was buried in the city of David his father[a], and Rehoboam his son reigned in his place.
  footnotes:
  - marker: a
    text: Hebrew 'slept with his fathers,' a customary expression for death and joining one's ancestors.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 그의 조상들과 함께 잠들어 그의 아버지 다윗의 성에 묻혔으며, 그의 아들 르호보암이 그를 이어 왕이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 조상들과 함께 잠들다’라는 관용구를 사용하여 죽음을 완곡하게 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב שְׁלֹמֹה עִם אֲבֹתָיו
  english_pob_choice: slept with his fathers
  chosen_korean: 그의 조상들과 함께 잠들어
  alternatives_korean:
  - 그의 조상들과 함께 잠들고
  - 그의 조상들과 함께 죽고
  lexicon: WLC + HALOT
  rationale: 히브리어 관용구를 그대로 살리면서도 한국어에서 자연스럽고 장례 문맥에 맞는 표현으로 옮겼습니다. 단순히 ‘죽고’로 풀기보다 POB의 ‘slept’가 보존한 완곡법을 유지합니다.
- source_word: וַיִּקָּבֵר בְּעִיר דָּוִד אָבִיו
  english_pob_choice: was buried in the city of David his father
  chosen_korean: 다윗 성에 그 아버지와 함께 묻혔고
  alternatives_korean:
  - 그의 아버지 다윗의 성에 묻혔고
  - 다윗의 성, 곧 그의 아버지의 성에 묻혔고
  lexicon: WLC + HALOT
  rationale: ‘다윗 성’은 지명으로 간결하게 살리고, ‘אָבִיו’의 친족·왕조적 표지를 ‘그 아버지’로 유지했습니다. ‘with his father’ 식의 의미를 넣기보다 본문이 말하는 매장 장소를 중심으로 옮겼습니다.
- source_word: וַיִּמְלֹךְ רְחַבְעָם בְּנ֖וֹ תַּחְתָּיו
  english_pob_choice: Rehoboam his son reigned in his place
  chosen_korean: 그의 아들 르호보암이 그의 자리를 이어 왕이 되었습니다
  alternatives_korean:
  - 그의 아들 르호보암이 그를 대신하여 다스렸습니다
  - 그의 아들 르호보암이 그의 뒤를 이어 다스렸습니다
  lexicon: WLC + HALOT
  rationale: 왕위 승계 공식으로서 ‘그의 자리를 이어’가 ‘in his place’의 대체·승계 의미를 잘 드러냅니다. ‘왕이 되었습니다’는 וַיִּמְלֹךְ의 왕위 즉위를 자연스럽게 반영합니다.
theological_decisions:
- issue: 왕실 부고 공식의 완곡법 처리
  chosen_reading: ‘잠들어’와 ‘묻혔고’로 솔로몬의 죽음을 직접적 서술 대신 관용적 장례 공식으로 옮겼습니다.
  alternative_readings:
  - ‘죽고 묻혔고’처럼 직접 서술로 풀기
  - ‘세상을 떠나’로 완곡하게 바꾸기
  rationale: 본문은 왕의 사망을 전형적인 왕실 부고 공식으로 전달하므로, 히브리어의 관용과 장엄함을 유지하는 것이 의미 전달에 더 충실합니다.
  doctrine_reference: 성경의 서사체와 장례 관용구 번역 원칙
- issue: ‘그의 아버지’의 보존
  chosen_reading: ‘다윗 성에 그 아버지와 함께’로 다윗을 솔로몬의 아버지로 명시했습니다.
  alternative_readings:
  - ‘다윗의 성에’만 두고 아버지 표지를 생략하기
  - ‘그의 아버지 다윗의 성에’로 재배열하기
  rationale: 히브리어의 속격 표지를 보존하면 다윗-솔로몬 왕조 계승의 연결이 분명해집니다. 한국어에서도 관계성을 직접 드러내는 편이 본문 구조에 가깝습니다.
  doctrine_reference: 본문의 왕조 계승 표지 보존
