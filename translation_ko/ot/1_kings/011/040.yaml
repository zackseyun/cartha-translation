  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְבַקֵּ֥שׁ שְׁלֹמֹ֖ה לְ/הָמִ֣ית אֶת יָרָבְעָ֑ם וַ/יָּ֣קָם יָרָבְעָ֗ם וַ/יִּבְרַ֤ח מִצְרַ֨יִם֙ אֶל שִׁישַׁ֣ק מֶֽלֶךְ מִצְרַ֔יִם וַ/יְהִ֥י בְ/מִצְרַ֖יִם עַד מ֥וֹת שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/040.yaml
  text: Then Solomon sought to put Jeroboam to death[a], but Jeroboam arose and fled to Egypt, to Shishak king of Egypt[b], and he was in Egypt until the death of Solomon.
  footnotes:
  - marker: a
    text: Or, 'sought to kill Jeroboam.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'and he remained in Egypt until Solomon died.'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 여로보암을 죽이려 했습니다[a]. 그러나 여로보암은 일어나 이집트로 도망하여, 이집트 왕 시삭에게 갔습니다[b]. 그리고 솔로몬이 죽을 때까지 이집트에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘여로보암을 죽이려 했습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘그는 솔로몬이 죽을 때까지 이집트에 머물렀습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ לְהָמִית
  english_pob_choice: sought to put Jeroboam to death
  chosen_korean: 여로보암을 죽이려 했습니다
  alternatives_korean:
  - 여로보암을 죽이고자 했습니다
  - 여로보암에게 사형을 집행하려 했습니다
  lexicon: HALOT
  rationale: בקשה의 ‘추구/의도’와 מות의 사역적 의미를 함께 살려, 실제 실행보다 살해 의도를 나타내는 표현으로 옮겼습니다.
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어나
  alternatives_korean:
  - 그는 일어나
  - 일어나서
  lexicon: HALOT
  rationale: 서사에서 결단적 전환을 나타내는 קום의 뉘앙스를 반영해, 단순한 기상보다 행동 개시를 드러냈습니다.
- source_word: מִצְרַיִם ... אֶל שִׁישַׁק מֶלֶךְ מִצְרַיִם
  english_pob_choice: to Egypt, to Shishak king of Egypt
  chosen_korean: 이집트로 도망하여, 이집트 왕 시삭에게 갔습니다
  alternatives_korean:
  - 애굽으로 도망하여, 애굽 왕 시삭에게 갔습니다
  - 이집트로 달아나 시삭 이집트 왕에게 갔습니다
  lexicon: HALOT
  rationale: 지명과 왕호의 반복을 살려 원문의 방향 전환과 도피의 종착지를 분명히 했습니다. ‘시삭’은 통용되는 성경 고유명으로 유지했습니다.
- source_word: וַיְהִי בְמִצְרַיִם עַד מוֹת שְׁלֹמֹה
  english_pob_choice: and he was in Egypt until the death of Solomon
  chosen_korean: 그리고 솔로몬이 죽을 때까지 이집트에 있었습니다
  alternatives_korean:
  - 그리고 솔로몬의 죽음까지 이집트에 있었습니다
  - 솔로몬의 죽음까지 이집트에 머물렀습니다
  lexicon: HALOT
  rationale: ‘있었습니다’로 היה+장소의 기본 의미를 보존하되, 결과적으로 지속 거주를 드러내는 시간절을 자연스럽게 연결했습니다.
theological_decisions:
- issue: 본문의 살해 의도 표현
  chosen_reading: 솔로몬의 권력 행사가 여로보암에 대한 실제적 생명 위협으로 제시됩니다.
  alternative_readings:
  - 단순한 정치적 압박으로 약화해 볼 수 있음
  - 체포 시도로 완화해 볼 수 있음
  rationale: 히브리어 לְהָמִית는 ‘죽게 하다/죽이다’의 사역형으로, 본문은 분명한 살해 의도를 말합니다. 이를 약화하면 서사의 긴장과 솔로몬의 책임이 흐려집니다.
  doctrine_reference: 역사서의 서술적 사실성
- issue: 지명 표기 '이집트'
  chosen_reading: 본문의 מִצְרַיִם은 한국어 본문에서 ‘이집트’로 옮기고, 전통 교회어 ‘애굽’은 쓰지 않았습니다.
  alternative_readings:
  - 애굽
  - 이집트와 애굽 병기
  rationale: 프로젝트 기본어휘에 따라 현대 표준어로 통일해 가독성을 높이되, 원문이 같은 지명을 반복하는 구조는 유지했습니다.
  doctrine_reference: '번역 원칙: source-direct, modern formal-polite'
