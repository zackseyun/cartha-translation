id: 1KI.11.12
reference: 1 Kings 11:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַךְ בְּ/יָמֶ֨י/ךָ֙ לֹ֣א אֶעֱשֶׂ֔/נָּה לְמַ֖עַן דָּוִ֣ד אָבִ֑י/ךָ מִ/יַּ֥ד בִּנְ/ךָ֖ אֶקְרָעֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/012.yaml
  text: Nevertheless[a], in your days I will not do it, for the sake of David your father[b]; from the hand of your son I will tear it away.
  footnotes:
  - marker: a
    text: That is, the kingdom announced in the previous verse.
    reason: cross_reference
  - marker: b
    text: Or 'out of your son's hand.' The Hebrew idiom literally says 'from the hand of your son.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신이 살아 있는 동안에는, 다윗 곧 당신의 아버지를 위하여 그렇게 하지 않겠습니다.[a] 당신의 아들의 손에서 그것을 찢어 내겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉 앞 절에서 선포된 나라를 찢어 내는 일입니다.
    reason: cross_reference
  - marker: b
    text: 히브리어는 문자적으로 ‘당신의 아들의 손에서’라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Nevertheless
  chosen_korean: 그러나
  alternatives_korean:
  - 그럼에도
  - 다만
  - 하지만
  lexicon: HALOT
  rationale: 앞선 심판 선언을 제한하는 대조·양보의 기능을 한국어에서 가장 자연스럽게 드러내기 위해 접속부사 ‘그러나’를 택했습니다.
- source_word: בְּיָמֶיךָ
  english_pob_choice: in your days
  chosen_korean: 당신의 날에는
  alternatives_korean:
  - 당신의 생애에는
  - 당신이 사는 동안에는
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리면서도 한국어에서 자연스럽게 읽히도록 ‘날’을 유지했습니다.
- source_word: לְמַעַן דָּוִד אָבִיךָ
  english_pob_choice: for the sake of David your father
  chosen_korean: 다윗 당신의 아버지를 생각하여
  alternatives_korean:
  - 다윗 당신의 아버지 때문에
  - 다윗 당신의 아버지를 위하여
  lexicon: HALOT
  rationale: לְמַעַן의 동기·배려 뉘앙스를 ‘생각하여’로 옮겨, 단순 인과보다 다윗을 향한 유보의 이유를 드러냈습니다.
- source_word: מִיַּד בִּנְךָ
  english_pob_choice: from the hand of your son
  chosen_korean: 당신의 아들의 손에서
  alternatives_korean:
  - 당신의 아들의 손으로부터
  - 당신의 아들에게서
  lexicon: HALOT
  rationale: ‘손’의 관용적 이미지를 보존하여 권한·소유의 이동을 나타내는 히브리어 표현을 그대로 살렸습니다.
theological_decisions:
- issue: 미래 심판의 유예와 대상 생략
  chosen_reading: ‘그것’은 앞선 문맥의 나라/왕권을 가리키며, 그 분리는 솔로몬 생전이 아니라 그의 아들 시대에 이뤄집니다.
  alternative_readings:
  - ‘그것’을 명시적으로 ‘나라를’로 풀어 쓸 수 있습니다.
  - ‘당신의 아들에게서’로만 옮겨 소유 상실의 의미를 덜 강조할 수 있습니다.
  rationale: 히브리어는 목적어를 생략하지만 문맥상 앞절의 왕국 분열을 가리키므로, 한국어도 그 지시를 유지하되 과도한 설명은 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 다윗 언약에 따른 유보
  chosen_reading: ‘다윗 당신의 아버지를 생각하여’는 심판의 취소가 아니라 다윗을 향한 언약적 배려 때문에 집행이 유예됨을 드러냅니다.
  alternative_readings:
  - 단순히 ‘다윗 때문에’로 더 직설적으로 옮길 수 있습니다.
  rationale: 열왕기상 11장의 문맥에서 지연의 근거는 다윗에 대한 하나님의 신실하심이므로, 이를 완곡하게라도 드러내는 표현이 필요합니다.
  doctrine_reference: 2 Sam 7; 1 Kgs 11
