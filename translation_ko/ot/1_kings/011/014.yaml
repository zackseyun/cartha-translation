  source_fidelity: ‘솔로몬에게 대적’은 현대 한국어에서 ‘솔로몬에게’의 문법 관계가 다소 불분명할 수 있습니다. 히브리어 לִשְׁלֹמֹה의 대적 관계를 ‘솔로몬에게 맞설’로 명시하는 것이 정확합니다. 또한 מִזֶּרַע הַמֶּלֶךְ ... בֶּאֱדוֹם은 하닷이 에돔의 왕가 계통임을 가리키므로 ‘에돔 왕가의 후손’이 자연스럽고 충실합니다.
