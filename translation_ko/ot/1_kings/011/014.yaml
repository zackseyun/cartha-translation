  terminology: ‘야훼’, ‘대적’, ‘에돔 사람 하닷’을 유지했습니다. שָׂטָן은 이 문맥에서 고유명사 사탄이 아니라 일반명사이므로 각주를 ‘대적 또는 적대자’로 정비하고 해당 단어 바로 뒤에 앵커를 두었습니다.
