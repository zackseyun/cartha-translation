base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/014.yaml
  text: Then Yahweh raised up an adversary against Solomon[a], Hadad the Edomite; he was of the royal line in Edom.
  footnotes:
  - marker: a
    text: Hebrew satan; here it means 'adversary' or 'opponent,' not the proper name Satan.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 솔로몬에게 대적 하나를 일으키셨는데, 곧 에돔 사람 하닷이었습니다. 그는 에돔에서 왕족 출신이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שָׂטָן은 여기서 고유명사 ‘사탄’이 아니라 ‘대적’ 또는 ‘원수’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: Tetragrammaton
  rationale: 본문의 신명 표기는 서술체에서 인명처럼 고유하게 드러내는 것이 원문과 POB의 원칙에 맞으므로, 전통적 대체어인 ‘여호와’나 호칭 ‘주님’ 대신 ‘야훼’를 사용했습니다.
- source_word: שָׂטָן
  english_pob_choice: an adversary
  chosen_korean: 대적
  alternatives_korean:
  - 적대자
  - 원수
  - 사탄
  lexicon: HALOT
  rationale: 여기서는 고유명사 ‘사탄’이 아니라 솔로몬을 대항하도록 세워진 일반명사이므로, 문맥상 가장 직접적인 ‘대적’으로 옮겼습니다.
- source_word: הֲדַד הָאֲדֹמִי
  english_pob_choice: Hadad the Edomite
  chosen_korean: 에돔 사람 하닷
  alternatives_korean:
  - 하닷 에돔 사람
  - 에돔의 하닷
  lexicon: HALOT
  rationale: 고유명사 하닷을 음역하고, 민족·지리적 표지인 הָאֲדֹמִי는 한국어에서 자연스러운 ‘에돔 사람’으로 풀어 인물 식별을 분명히 했습니다.
- source_word: מִזֶּרַע הַמֶּלֶךְ ... הוּא בֶּאֱדוֹם
  english_pob_choice: of the royal line in Edom
  chosen_korean: 에돔에서 왕족 출신이었습니다
  alternatives_korean:
  - 에돔의 왕족 혈통이었습니다
  - 에돔에서 왕의 혈통이었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘왕의 씨에서’이지만, 여기서는 왕족 계보를 가리키는 관용구이므로 ‘왕족 출신’으로 옮겨 혈통적 배경을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 야훼가 ‘대적’을 일으키셨다는 표현의 신학적 함의
  chosen_reading: 하나님이 솔로몬의 적대 세력을 주권적으로 일으키셨다는 서술로 유지했습니다.
  alternative_readings:
  - 야훼께서 단순히 허용하셨다는 완화된 표현
  - 야훼께서 심판의 도구를 세우셨다는 해석적 표현
  rationale: 본문은 원인 행위를 분명히 야훼께 돌리므로, 완화하거나 해설을 덧붙이지 않고 원문의 긴장을 그대로 살렸습니다.
  doctrine_reference: 섭리와 심판의 주권을 본문 수준에서 보존
