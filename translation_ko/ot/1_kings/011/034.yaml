base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/034.yaml
  text: But I will not take the whole kingdom out of his hand, because I will make him ruler all the days of his life, for the sake of David my servant, whom I chose, who kept my commandments and my statutes.
translation:
  language: ko
  text: 그러나 나는 그의 손에서 왕국 전체를 빼앗지 않겠습니다. 이는 내가 택한 내 종 다윗을 위하여 그의 평생 동안 그를 통치자로 세울 것이기 때문입니다. 다윗은 내 계명과 내 규례를 지켰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶקַּח / take ... out of his hand
  english_pob_choice: not take ... out of his hand
  chosen_korean: 그의 손에서 ... 빼앗지는 않을 것입니다
  alternatives_korean:
  - 그의 손에서 ... 가져가지 않을 것입니다
  - 그의 손에서 ... 거두지는 않을 것입니다
  lexicon: לקח
  rationale: 왕권을 ‘손에서 빼앗다’는 소유·통치권 상실의 이미지를 살리기 위해 직접적인 한국어 관용을 택했습니다.
- source_word: נָשִׂיא
  english_pob_choice: ruler
  chosen_korean: 통치자
  alternatives_korean:
  - 지도자
  - 군주
  - 지배자
  lexicon: נָשִׂיא
  rationale: 문맥상 전체 왕권은 아니지만 실제 통치 권한을 가진 자를 가리키므로, ‘ruler’의 권위와 통치성을 분명히 드러내는 ‘통치자’가 적절합니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 하인
  - 나를 섬기는 자
  lexicon: עבד
  rationale: 하나님 앞에서의 언약적 봉사 관계를 나타내므로, 일반적이고 성경적인 ‘종’을 유지했습니다.
- source_word: מִצְוֺתַי וְחֻקֹּתַי
  english_pob_choice: my commandments and my statutes
  chosen_korean: 내 명령과 내 규례
  alternatives_korean:
  - 내 계명과 내 규례
  - 내 명령들과 내 법도
  lexicon: מצוה / חק
  rationale: 두 용어의 병렬을 살리되, 한국어 성경 전통과 가독성을 고려해 ‘명령과 규례’로 옮겼습니다.
theological_decisions:
- issue: 다윗에 대한 언약적 이유 제시
  chosen_reading: 하나님이 솔로몬의 왕국을 완전히 빼앗지 않으시는 이유를 다윗을 향한 언약적 기억과 신실하심으로 분명히 표현합니다.
  alternative_readings:
  - 정치적 유예로만 읽기
  - 단순한 역사 서술로 완화하기
  rationale: 본문의 ‘내 종 다윗을 위해서’와 이어지는 순종 진술은 단순 행정 조치가 아니라 다윗 언약의 지속을 드러내므로, 그 신학적 동기를 보존해야 합니다.
  doctrine_reference: 2 Samuel 7; 1 Kings 11:12-13
