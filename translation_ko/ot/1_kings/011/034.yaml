  - severity: low
    issue: ‘내 명령’은 מִצְוֺתַי의 통상적 성경 용어와 다소 거리가 있습니다.
    rationale: ‘계명’은 명령의 뜻을 보존하면서 חֻקֹּתַי의 ‘규례’와 이루는 병렬도 자연스럽게 유지합니다.
  - severity: medium
    issue: 각주가 본문 밖의 해석을 단정합니다.
    rationale: נָשִׂיא의 의미 범위와 문맥상 제한된 왕권의 상황은 인정되지만, ‘왕권 일부 보유를 드러내기 위한 번역’은 번역 선택의 해설을 넘어 본문이 명시하지 않은 해석을 제시합니다.
