revisions:
- from: 그러나 나는 그의 손에서 온 나라를 빼앗지는 않을 것입니다. 내가 그의 평생 동안 그를 통치자로 삼을 것이기 때문입니다. 이는 내가 선택한 내 종 다윗을 위해서입니다. 그는 내 명령과 내 규례를 지켰습니다.[a]
  to: 그러나 나는 그의 손에서 왕국 전체를 빼앗지 않겠습니다. 이는 내가 택한 내 종 다윗을 위하여 그의 평생 동안 그를 통치자로 세울 것이기 때문입니다. 다윗은 내 계명과 내 규례를 지켰습니다.
  rationale: 왕국 전체를 빼앗지 않겠다는 선언, 평생 통치자로 세우겠다는 유예, 그리고 다윗을 위한 이유의 연결을 보존했습니다. 불필요하게 해석적인 각주는 제거하고, 핵심 법 용어는 ‘계명과 규례’로 바로잡았습니다.
