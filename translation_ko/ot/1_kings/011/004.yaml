revisions:
- from: 솔로몬이 늙었을 때에 그의 아내들이 그의 마음을 다른 신들을 따르도록 돌이키게 했고, 그의 마음은 그의 하나님 야훼와 온전히 함께하지 않았습니다 — 그의 아버지 다윗의 마음과 같지 않았습니다.[a]
  to: 솔로몬이 늙었을 때, 그의 아내들이 다른 신들을 따르도록 그의 마음을 돌렸고, 그의 마음은 그의 하나님 야훼께 온전히 충성하지 않았습니다[a]. 그의 아버지 다윗의 마음과 같지 않았습니다.
  rationale: 사역 동사의 한국어 표현을 바로잡고, שָׁלֵם עִם의 관계적·언약적 충성 의미를 자연스러운 현대 합쇼체로 옮겼습니다. 각주는 ‘온전하다’라는 히브리어의 어휘적 이미지를 보존하되, 본문은 과도하게 직역하지 않았습니다. 다윗과의 비교는 원문처럼 솔로몬의 ‘마음’을 명시하여 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:46:00Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 절반의 시간 표현과 ‘다른 신들’을 따르게 된 의미는 대체로 충실합니다. 그러나 ‘돌이키게 했고’는 히브리어 사역형을 한국어에서 불필요하게 중첩하여 어색하게 만들며, שָׁלֵם עִם의 언약적 충성 의미를 ‘온전히 함께하지 않았다’로 옮긴 것은 현대 한국어로 부자연스럽습니다.
  naturalness: ‘다른 신들을 따르도록 그의 마음을 돌렸고’가 원문의 마음-방향 전환 이미지를 유지하면서 자연스럽습니다. ‘그의 하나님 야훼께 온전히 충성하지 않았습니다’는 합쇼체 문체에 맞고, ‘온전히 함께하지 않았습니다’보다 명료합니다.
  terminology: ‘야훼’, ‘다른 신들’, ‘마음’은 적절합니다. שָׁלֵם은 본문에서 ‘온전히 충성하다’로 관용적으로 풀고, 각주에서 ‘온전하다’라는 원문의 어휘적 이미지를 보존하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘그의 마음을 다른 신들을 따르도록 돌이키게 했고’의 중첩 사역 표현
    rationale: הִטּוּ는 아내들이 솔로몬의 마음을 돌린다는 사역 의미를 이미 지닙니다. 한국어 ‘돌이키게 했다’는 ‘그들이 또 다른 누군가에게 돌리게 했다’처럼 불필요한 중첩을 낳습니다.
  - severity: medium
    issue: ‘그의 하나님 야훼와 온전히 함께하지 않았습니다’의 비자연스러운 관계 표현
    rationale: שָׁלֵם עִם은 마음의 온전함, 곧 야훼께 대한 전적인 충성을 뜻합니다. ‘함께하지 않다’는 현대 한국어에서 그 충성·헌신의 의미를 충분히 전달하지 못합니다.
  - severity: low
