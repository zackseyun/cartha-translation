id: 1KI.11.4
reference: 1 Kings 11:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֗י לְ/עֵת֙ זִקְנַ֣ת שְׁלֹמֹ֔ה נָשָׁי/ו֙ הִטּ֣וּ אֶת לְבָב֔/וֹ אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא הָיָ֨ה לְבָב֤/וֹ שָׁלֵם֙ עִם יְהוָ֣ה אֱלֹהָ֔י/ו כִּ/לְבַ֖ב דָּוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/004.yaml
  text: And when Solomon was old[a], his wives turned his heart after other gods, and his heart was not fully devoted to Yahweh his God, like the heart of David his father.
  footnotes:
  - marker: a
    text: Or 'fully devoted to the LORD his God.' The Hebrew says literally that his heart was not 'whole' with the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬이 늙었을 때, 그의 아내들이 다른 신들을 따르도록 그의 마음을 돌렸고, 그의 마음은 그의 하나님 야훼께 온전히 충성하지 않았습니다[a]. 그의 아버지 다윗의 마음과 같지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 마음이 야훼 그의 하나님과 온전하지 않았다’라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת זִקְנַת
  english_pob_choice: when Solomon was old
  chosen_korean: 솔로몬이 늙었을 때에
  alternatives_korean:
  - 솔로몬의 노년기에
  - 솔로몬의 늙은 때에
  lexicon: HALOT
  rationale: 시간을 나타내는 관용구로 자연스럽게 옮기되, 노년의 상태를 분명히 드러냈습니다.
- source_word: נָשָׁי/ו
  english_pob_choice: his wives
  chosen_korean: 그의 아내들이
  alternatives_korean:
  - 그의 아내들
  - 그의 부인들이
  lexicon: HALOT
  rationale: 복수 소유격을 그대로 살려 솔로몬의 아내들이 주어임을 분명히 했습니다.
- source_word: הִטּוּ אֶת לְבָב/וֹ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  english_pob_choice: turned his heart after other gods
  chosen_korean: 그의 마음을 다른 신들을 따르도록 돌이키게 했고
  alternatives_korean:
  - 그의 마음을 다른 신들을 향해 기울게 했고
  - 그의 마음을 다른 신들을 따라가게 했고
  lexicon: HALOT
  rationale: נטה의 ‘돌리다/기울이다’ 이미지를 살리면서, אַחֲרֵי의 추종 의미를 한국어 동사구로 풀어 주었습니다.
- source_word: שָׁלֵם עִם יְהוָה אֱלֹהָיו
  english_pob_choice: not fully devoted to Yahweh his God
  chosen_korean: 그의 마음은 그의 하나님 야훼와 온전히 함께하지 않았습니다
  alternatives_korean:
  - 그의 마음은 그의 하나님 야훼와 온전하지 않았습니다
  - 그의 마음은 그의 하나님 야훼께 온전히 속하지 않았습니다
  lexicon: HALOT
  rationale: שָׁלֵם־עִם의 ‘온전한/전적인 결속’ 의미를 살리면서, 관계적 충성의 결여를 한국어로 자연스럽게 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유한 신명(神名)을 제목어로 대체하지 않고 학술적 음역인 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 다른 신들(אֱלֹהִים אֲחֵרִים)의 표현
  chosen_reading: ‘다른 신들’로 직역해 우상숭배의 신학적 긴장을 유지했습니다.
  alternative_readings:
  - ‘외국 신들’
  - ‘이방 신들’
  rationale: 히브리어의 표준 표현을 그대로 반영해, 단지 민족적 범주가 아니라 언약 배반의 문제임을 드러냅니다.
  doctrine_reference: Translation philosophy §1
- issue: שָׁלֵם을 ‘온전히 함께하지 않았다’로 옮김
  chosen_reading: 관계적 충성과 분할되지 않은 마음의 결여를 함께 드러내는 표현을 택했습니다.
  alternative_readings:
  - ‘완전히 헌신하지 않았다’
  - ‘온전하지 않았다’
  rationale: 히브리어의 ‘whole/wholeness’ 이미지를 유지하면서도, 야훼와의 언약적 충실성을 독자가 이해할 수 있게 했습니다.
  doctrine_reference: Translation philosophy §§3, 5
