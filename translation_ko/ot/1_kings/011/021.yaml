  source_fidelity: ‘이제’는 히브리어 본문에 명시된 시간 표지가 아니므로 삭제해야 합니다. 또한 죽음 관용구의 각주는 다윗의 ‘조상들과 함께 누웠다’에만 붙어야 하며, 대화 끝의 중복 [a] 표지는 근거와 연결되지 않습니다. 수정문은 שָׁמַע, שָׁכַב ... עִם־אֲבֹתָיו, מֵת, שַׂר הַצָּבָא, שַׁלְּחֵנִי, וְאֵלֵךְ, אַרְצִי의 의미와 문장 관계를 보존합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘이집트에서 … 소식을 듣고’는 장소 범위를 명확히 하고, ‘저를 보내 주십시오. 제가 제 땅으로 가겠습니다’는 바로를 향한 공손한 요청과 목적/의지의 흐름을 무리 없이 전달합니다.
  terminology: ‘하닷’, ‘다윗’, ‘요압’, ‘바로’는 통용 성경 인명·칭호를 따랐습니다. שַׂר הַצָּבָא는 현대적인 ‘군대의 사령관’으로, אַרְצִי는 원문의 ‘나의 땅’을 보존하는 ‘제 땅’으로 옮겼습니다.
  issues:
