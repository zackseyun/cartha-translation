  - severity: high
    issue: 각주 표지가 중복되고 연결 대상이 불명확합니다.
    rationale: 본문에는 죽음 관용구 뒤의 <a>와 인용문 뒤의 [a]가 모두 있으나, 제공된 각주는 하나뿐이며 내용은 전자의 관용구만 설명합니다. 인용문 뒤의 [a]는 삭제해야 합니다.
  revised_text: 하닷은 이집트에서 다윗이 그의 조상들과 함께 누웠고<a>, 군대의 사령관 요압이 죽었다는 소식을 듣고 바로에게 말했습니다. “저를 보내 주십시오. 제가 제 땅으로 가겠습니다.”
  revised_footnotes:
