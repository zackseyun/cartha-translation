id: 1KI.11.21
reference: 1 Kings 11:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲדַ֞ד שָׁמַ֣ע בְּ/מִצְרַ֗יִם כִּֽי שָׁכַ֤ב דָּוִד֙ עִם אֲבֹתָ֔י/ו וְ/כִי מֵ֖ת יוֹאָ֣ב שַֽׂר הַ/צָּבָ֑א וַ/יֹּ֤אמֶר הֲדַד֙ אֶל פַּרְעֹ֔ה שַׁלְּחֵ֖/נִי וְ/אֵלֵ֥ךְ אֶל אַרְצִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/021.yaml
  text: Now when Hadad heard in Egypt that David had lain down with his fathers and that Joab[a], the commander of the army, was dead, Hadad said to Pharaoh, “Send me away[b], so that I may go to my own land.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''had lain down with his fathers,'' a customary idiom for death.'
    reason: lexical_alternative
  - marker: b
    text: Or 'had died' for 'was dead.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 하닷은 다윗이 그의 조상들과 함께 누웠고<a>, 요압, 곧 군대의 사령관이 죽었다는 소식을 이집트에서 듣고, 바로에게 말했습니다. "저를 보내 주십시오. 그러면 제가 제 땅으로 가겠습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “그의 조상들과 함께 누웠다”라는, 죽음을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 알았습니다
  - 소식을 들었습니다
  lexicon: HALOT
  rationale: 이 동사에는 단순 청각보다 ‘소식을 접하다’는 뜻이 자연스럽게 담기므로, 문맥을 살리면서도 한국어로는 ‘들었습니다’가 가장 간결합니다.
- source_word: שָׁכַב ... עִם אֲבֹתָיו
  english_pob_choice: had lain down with his fathers
  chosen_korean: 그의 조상들과 함께 누웠고
  alternatives_korean:
  - 그의 조상들과 함께 잠들었고
  - 죽었고
  lexicon: HALOT
  rationale: 히브리어의 관용적 죽음 표현을 그대로 살려, 단순한 ‘죽었다’로 평평하게 만들지 않고 원문의 관례적 이미지를 유지했습니다.
- source_word: שַׂר הַצָּבָא
  english_pob_choice: the commander of the army
  chosen_korean: 군대의 사령관
  alternatives_korean:
  - 군대의 지휘관
  - 군대의 대장
  lexicon: HALOT
  rationale: שַׂר는 지위가 있는 통치·지휘자를 가리키므로, 현대 한국어에서 위계를 분명히 드러내는 ‘사령관’이 적절합니다.
- source_word: שַׁלְּחֵנִי
  english_pob_choice: Send me away
  chosen_korean: 저를 보내 주십시오
  alternatives_korean:
  - 저를 놓아 주십시오
  - 저를 떠나게 해 주십시오
  lexicon: HALOT
  rationale: 파라오에게 예의를 갖춰 떠나게 해 달라는 요청이므로, 직역적이면서도 자연스러운 청유형으로 옮겼습니다.
- source_word: אַרְצִי
  english_pob_choice: my own land
  chosen_korean: 제 땅
  alternatives_korean:
  - 제 고향 땅
  - 제 나라
  lexicon: HALOT
  rationale: אֶרֶץ의 기본 의미인 ‘땅’을 유지해 원문의 지정학적 귀속을 살렸고, ‘own’은 소유격으로 충분히 드러납니다.
theological_decisions:
- issue: 죽음 관용구의 보존 여부
  chosen_reading: ‘그의 조상들과 함께 누웠고’로 관용구를 유지해 왕실 연대기식 표현을 살렸습니다.
  alternative_readings:
  - ‘죽었고’로 평이하게 처리
  - ‘잠들었고’로 완화
  rationale: 본문은 단순 정보 전달보다 다윗의 죽음을 전통적 왕조 언어로 진술하므로, 관용구를 보존하는 것이 저자의 표현 의도를 더 잘 드러냅니다.
  doctrine_reference: 성경 히브리어의 মৃত্যু 관용구와 서술체 보존
- issue: 바로에게 하는 요청의 문체
  chosen_reading: 직접화법을 현대 공손체로 옮기되, 요청의 긴박성을 유지했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 더 고어적인 청원체로 변경
  rationale: 원문은 명령형+목적절 구조의 요청이므로, 한국어에서도 공손하지만 분명한 청유 표현으로 긴장감을 유지해야 합니다.
  doctrine_reference: 본문 문체와 화행 보존
