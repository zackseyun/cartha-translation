  source_fidelity: 핵심 의미는 충실합니다. אָז, 산당, 그모스/몰렉, ‘가증한 것’이라는 서술자의 비난적 명칭, 예루살렘과의 공간 관계를 모두 보존했습니다. 다만 ‘그렇게 하였습니다’는 원문의 병렬적 ‘몰렉을 위하여’ 구문을 다소 두루뭉술하게 만들므로, 산당을 짓는 행위를 명시하는 편이 더 정확합니다.
  naturalness: 현 번역은 전반적으로 자연스럽고 합쇼체에도 맞습니다. 그러나 ‘그모스에게 … 산당을 지었고, … 몰렉에게도 그렇게 하였습니다’보다 ‘그모스를 위하여 산당을 지었으며, … 몰렉을 위하여도 산당을 지었습니다’가 봉헌의 의미와 병렬 구조를 더 분명하고 자연스럽게 드러냅니다.
