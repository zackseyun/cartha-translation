source:
  edition: WLC
  text: אָז֩ יִבְנֶ֨ה שְׁלֹמֹ֜ה בָּמָ֗ה לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב בָּ/הָ֕ר אֲשֶׁ֖ר עַל פְּנֵ֣י יְרוּשָׁלִָ֑ם וּ/לְ/מֹ֕לֶךְ שִׁקֻּ֖ץ בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/007.yaml
  text: Then Solomon built a high place for Chemosh[a], the abomination of Moab, on the mountain that is opposite Jerusalem, and for Molech, the abomination of the Ammonites.
  footnotes:
  - marker: a
    text: Or 'Milcom' for 'Molech'; the Hebrew form here is traditionally read as 'Molech,' but some connect it with the Ammonite deity Milcom.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 솔로몬은 모압의 가증한 것인 그모스에게, 예루살렘 맞은편의 산에 산당을 지었고, 암몬 자손의 가증한 것인 몰렉에게도 그렇게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘밀곰’. 히브리어 형태는 전통적으로 ‘몰렉’으로 읽지만, 일부는 암몬의 신 ‘밀곰’과 연결합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּמָה
  english_pob_choice: high place
  chosen_korean: 산당
  alternatives_korean:
  - 높은 곳
  - 산 위 제의처
  lexicon: HALOT
  rationale: ר은 제의적 장소를 가리키는 기술어이므로, 한국어 성경에서 널리 통용되는 '산당'을 사용해 우상 숭배의 장소라는 기능을 분명히 했습니다.
- source_word: שִׁקֻּץ
  english_pob_choice: the abomination of
  chosen_korean: 가증한 것
  alternatives_korean:
  - 가증한 우상
  - 혐오스러운 것
  lexicon: HALOT
  rationale: 원문의 강한 경멸적 평가를 그대로 살리기 위해 '가증한 것'으로 옮겼습니다. 다만 한국어에서는 명사구를 자연스럽게 하기 위해 뒤의 대상을 설명하는 방식으로 배치했습니다.
- source_word: כְמוֹשׁ
  english_pob_choice: Chemosh
  chosen_korean: 그모스
  alternatives_korean:
  - 케모스
  - 그모스
  lexicon: HALOT
  rationale: 고유명사는 한국어 성서에서 널리 쓰이는 음역인 '그모스'를 채택했습니다. 영어식 철자보다 성서 관용 표기를 우선했습니다.
- source_word: מֹלֶךְ
  english_pob_choice: Molech
  chosen_korean: 몰렉
  alternatives_korean:
  - 몰록
  - 밀곰
  lexicon: HALOT
  rationale: 본문의 자음·모음 형태에 따라 '몰렉'을 본문 표기로 두고, 전통적 대안 독법과의 연결은 주석에서 처리하는 편이 원문 긴장을 더 잘 보존합니다.
theological_decisions:
- issue: 이방 신명에 대한 비난적 표현
  chosen_reading: 모압의 가증한 것, 암몬 자손의 가증한 것으로 직역해 서술자의 평가를 보존했습니다.
  alternative_readings:
  - 모압의 혐오스러운 신
  - 암몬 사람들의 역겨운 우상
  rationale: 본문은 단순한 중립적 신명 제시가 아니라 우상숭배에 대한 신학적 규탄을 담고 있으므로, 이를 완화하지 않고 그대로 드러내는 것이 원문 충실성에 부합합니다.
  doctrine_reference: '번역 원칙: 원어의 신학적 판단을 약화시키지 않고 보존합니다.'
