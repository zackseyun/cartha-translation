  text: וַ/יֹּ֨אמֶר֙ לְ/יָֽרָבְעָ֔ם קַח לְ/ךָ֖ עֲשָׂרָ֣ה קְרָעִ֑ים כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֨י קֹרֵ֤עַ אֶת הַ/מַּמְלָכָה֙ מִ/יַּ֣ד שְׁלֹמֹ֔ה וְ/נָתַתִּ֣י לְ/ךָ֔ אֵ֖ת עֲשָׂרָ֥ה הַ/שְּׁבָטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/031.yaml
  text: 'And he said to Jeroboam[a], “Take for yourself ten pieces, for this is what Yahweh, the God of Israel, says: ‘Look, I am tearing the kingdom out of the hand of Solomon, and I will give you ten tribes.’”'
  footnotes:
  - marker: a
    text: Or “ten torn pieces.” The Hebrew noun refers to pieces produced by tearing, matching Ahijah’s symbolic action with the garment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 여로보암에게 말했습니다. 「열 조각을 너를 위해 가져가라. 이는 이스라엘의 하나님 야훼께서 이렇게 말씀하시기 때문이다. ‘보라, 내가 솔로몬의 손에서 왕국을 찢어 내고, 너에게 열 지파를 주겠다.’」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 קְרָעִים은 ‘찢어져 나온 조각들’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  english_pob_choice: Take for yourself
  chosen_korean: 너를 위해 가져가라
  alternatives_korean:
  - 가져가라
  - 너를 위해 가져가라
  lexicon: HALOT
  rationale: 명령형 קַח의 핵심은 ‘가져가라’이고, לְךָ는 단순 목적어보다 ‘너를 위해’라는 개인적·반사적 뉘앙스를 더합니다.
- source_word: קְרָעִים
  english_pob_choice: pieces
  chosen_korean: 조각
  alternatives_korean:
  - 조각
  - 찢긴 조각
  - 기루
  lexicon: HALOT
  rationale: 구체적으로 ‘찢긴 조각’이지만 한국어에서는 열거 가능한 대상로서 ‘조각’이 가장 자연스럽고, 상징 행위와도 잘 맞습니다.
- source_word: כִּי כֹה אָמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: for this is what Yahweh, the God of Israel, says
  chosen_korean: 이는 이스라엘의 하나님 야훼께서 이렇게 말씀하시기 때문이다
  alternatives_korean:
  - 이는 ...께서 말씀하시기 때문이다
  - 이는 이스라엘의 하나님 야훼께서 이렇게 말씀하시기 때문이다
  - 야훼, 이스라엘의 하나님께서 말씀하시기를
  lexicon: HALOT
  rationale: 예언적 공식의 의미를 살리되, 현대 한국어에서 자연스럽게 읽히는 종속절로 옮겼습니다. יְהוָה는 본 프로젝트 기준에 따라 야훼로 옮겼습니다.
- source_word: הִנְנִי קֹרֵעַ
  english_pob_choice: Look, I am tearing
  chosen_korean: 보라, 내가 찢어 내고
  alternatives_korean:
  - 보라, 내가 찢어 내고
  - 보라, 내가 찢습니다
  - 보라, 내가 찢고 있습니다
  lexicon: HALOT
  rationale: הִנְנִי의 주의를 환기하는 힘은 ‘보라’로 살리고, 분사 קֹרֵעַ는 임박하고 생생한 현재적 행위를 드러내는 ‘찢어 내고’로 옮겼습니다.
- source_word: מִיַּד שְׁלֹמֹה
  english_pob_choice: out of the hand of Solomon
  chosen_korean: 솔로몬의 손에서
  alternatives_korean:
  - 솔로몬의 손에서
  - 솔로몬에게서
  - 솔로몬의 권세에서
  lexicon: HALOT
  rationale: ‘손에서’는 단순 소유가 아니라 권세와 통치의 손아귀에서 떼어 내는 이미지를 유지합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 문맥상 아브라함-이스라엘 언약의 고유명으로 쓰였으므로, 제목어 ‘주’로 대체하지 않고 음역 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
