source:
  edition: WLC
  text: וְ/צִוָּ֤ה אֵלָי/ו֙ עַל הַ/דָּבָ֣ר הַ/זֶּ֔ה לְ/בִ֨לְתִּי לֶ֔כֶת אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹ֣א שָׁמַ֔ר אֵ֥ת אֲשֶׁר צִוָּ֖ה יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/010.yaml
  text: and had commanded him concerning this matter[a], not to go after other gods, but he did not keep what Yahweh had commanded.
  footnotes:
  - marker: a
    text: 'Hebrew: ''go after other gods,'' a standard covenantal idiom for turning to and worshiping other deities.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 야훼께서는 그에게 이 일에 관하여 다른 신들을 따라가지 말라고[a] 명령하셨지만, 그는 야훼께서 명령하신 것을 지키지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다른 신들을 따라가다’는 히브리어의 표준적인 언약적 관용구로, 다른 신들에게 돌아서 그들을 숭배하는 것을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה אֵלָיו
  english_pob_choice: and had commanded him
  chosen_korean: 그에게 ... 명령하여
  alternatives_korean:
  - 그에게 ... 명령하셨고
  - 그에게 ... 명령하셨는데
  lexicon: HALOT
  rationale: צוה의 기본 의미를 살려 ‘명령하다’로 옮기고, 서술 흐름에 맞게 연결했습니다.
- source_word: עַל הַדָּבָר הַזֶּה
  english_pob_choice: about this matter
  chosen_korean: 이 일에 관해
  alternatives_korean:
  - 이 일에 대하여
  - 이 문제에 관해
  lexicon: HALOT
  rationale: דבר를 단순한 ‘말’이 아니라 문맥상 앞서 언급된 사안을 가리키는 말로 보아 ‘일/사안’으로 옮겼습니다.
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  english_pob_choice: not to go after other gods
  chosen_korean: 다른 신들을 따라가지 말라고
  alternatives_korean:
  - 다른 신들을 뒤따르지 말라고
  - 다른 신들을 섬기러 가지 말라고
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘뒤를 따라가다’를 한국어 성경식으로도 자연스럽게 살려, 배교와 숭배 전환의 의미가 드러나게 했습니다.
- source_word: וְלֹא שָׁמַר
  english_pob_choice: but he did not keep
  chosen_korean: 지키지 않았습니다
  alternatives_korean:
  - 준수하지 않았습니다
  - 그가 지키지 않았습니다
  lexicon: HALOT
  rationale: שמר는 언약·명령 문맥에서 ‘지키다’가 가장 직접적이며, 여기서는 불순종의 대조를 분명히 합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 신명기적 서술에서 나타나는 하나님의 고유명은 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘다른 신들을 따라가다’라는 언약적 관용구 유지
  chosen_reading: 직역에 가까운 ‘다른 신들을 따라가지 말라고’로 보존했습니다.
  alternative_readings:
  - ‘다른 신들을 섬기지 말라고’
  - ‘다른 신들에게로 가지 말라고’
  rationale: 이 표현은 단순 이동이 아니라 언약적 배교를 뜻하므로, 완화된 표현보다 관용구의 긴장을 살리는 쪽이 본문의 힘을 보존합니다.
  doctrine_reference: 언약 불순종과 우상숭배 경고
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신적 이름을 직접 사용하므로, 제목어가 아닌 고유명으로 드러내는 것이 소스-직접 번역 원칙에 맞습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
