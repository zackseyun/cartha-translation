theological_decisions:
- issue: 심판의 완전성 제한과 언약적 이유의 병렬 보존
  chosen_reading: 본문은 왕국을 ‘온전히’ 빼앗지 않겠다는 하나님의 제한과, 다윗 및 예루살렘을 위한 두 가지 이유를 병렬로 제시하므로 둘을 하나로 환원하지 않고 함께 보존했습니다.
  alternative_readings:
  - 다윗 언약만을 유일한 이유로 읽기
  - 예루살렘 선택만을 중심 이유로 읽기
  rationale: 히브리어는 두 개의 לְמַעַן 절을 나란히 두어 이유를 중첩하지만 구분합니다. 번역도 그 긴장을 유지해야 합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
