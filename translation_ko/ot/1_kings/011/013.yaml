  text: 그러나 나는 온 왕국을 찢어 버리지는 않겠습니다. 당신의 아들에게 한 지파를 주겠습니다. 이는 내 종 다윗을 위함이며, 또한 내가 택한 예루살렘을 위함입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
