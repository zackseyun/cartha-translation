  yaml_path: translation/ot/1_kings/011/013.yaml
  text: Yet I will not tear away the whole kingdom; I will give one tribe to your son[a], for the sake of David my servant and for the sake of Jerusalem, which I have chosen.
  footnotes:
  - marker: a
    text: Or 'Only, I will not tear away all the kingdom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다만[a] 나는 왕국 전체를 찢지는 않겠습니다. 나는 당신의 아들에게 한 지파를 주겠습니다. 내 종 다윗을 위하고, 내가 택한 예루살렘을 위하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그러나 나는 왕국 전체를 찢지는 않겠습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: Yet
  chosen_korean: 그러나
  alternatives_korean:
  - 다만
  - 오직
  - 그렇지만
  lexicon: HALOT
  rationale: 앞선 심판 선언을 제한하는 역접으로서, 현대 한국어에서는 ‘그러나’가 가장 자연스럽게 대조와 유예의 뉘앙스를 살립니다.
- source_word: כָּל הַמַּמְלָכָה
  english_pob_choice: the whole kingdom
  chosen_korean: 온 왕국
  alternatives_korean:
  - 모든 왕국
  - 왕국 전체
  - 전 왕국
  lexicon: HALOT
  rationale: ‘온’은 총량성을 간결하게 드러내며, 여기서 말하는 정치적 통치권 전체를 자연스럽게 표현합니다.
- source_word: אֶקְרָע
  english_pob_choice: I will tear away
  chosen_korean: 찢어 버리지는 않겠습니다
  alternatives_korean:
  - 찢어 버리겠습니다
  - 찢겠습니다
  - 뜯어내겠습니다
  lexicon: HALOT
  rationale: קורע의 강한 파괴 이미지를 살리되, 한국어에서는 ‘찢어 버리다’가 정치적 분열의 비유를 충분히 전달합니다. 부정형으로 제한을 강조했습니다.
- source_word: שֵׁבֶט אֶחָד
  english_pob_choice: one tribe
  chosen_korean: 한 지파
  alternatives_korean:
  - 한 지파 하나
  - 하나의 지파
  - 한 부족
  lexicon: HALOT
  rationale: 이스라엘의 부족 단위를 가리키므로, 교회적 관습어보다 본문 맥락에 맞는 ‘지파’를 유지했습니다.
- source_word: לְמַעַן דָּוִד עַבְדִּי
  english_pob_choice: for the sake of David my servant
  chosen_korean: 내 종 다윗을 위함이며
  alternatives_korean:
  - 내 종 다윗 때문에
  - 내 종 다윗을 위해
  - 내 종 다윗을 생각하여
  lexicon: HALOT
  rationale: לְמַעַן의 동기를 드러내는 표현으로 ‘위함’이 가장 직접적이며, ‘종’은 עֶבֶד의 기본 의미를 살립니다.
- source_word: יְרוּשָׁלַם אֲשֶׁר בָּחָרְתִּי
  english_pob_choice: Jerusalem, which I have chosen
  chosen_korean: 내가 택한 예루살렘
  alternatives_korean:
  - 내가 선택한 예루살렘
  - 내가 선택한 그 예루살렘
  lexicon: HALOT
  rationale: 완료형의 선택 행위를 한국어 현재완료적 표현으로 살려, 선택의 결과가 현재 유효함을 드러냅니다.
theological_decisions:
- issue: 심판의 완전성 제한과 언약적 이유의 병렬 보존
  chosen_reading: 본문은 왕국을 ‘온전히’ 빼앗지 않겠다는 하나님의 제한과, 다윗 및 예루살렘을 위한 두 가지 이유를 병렬로 제시하므로 둘을 하나로 환원하지 않고 함께 보존했습니다.
  alternative_readings:
  - 다윗 언약만을 유일한 이유로 읽기
  - 예루살렘 선택만을 중심 이유로 읽기
  rationale: 히브리어는 두 개의 לְמַעַן 절을 나란히 두어 이유를 중첩하지만 구분합니다. 번역도 그 긴장을 유지해야 합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
