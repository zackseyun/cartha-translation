  - severity: medium
    issue: ‘귀부인’
    rationale: שָׂרוֹת는 단순히 존칭으로 부를 만한 기혼 여성인 ‘귀부인’보다 왕족 또는 고위 신분 여성을 가리킵니다. 영어 POB의 ‘princesses’를 본문에서 반영하고, 어휘적 대안은 주석에 남기는 것이 적절합니다.
  - severity: medium
