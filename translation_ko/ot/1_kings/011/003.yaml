  text: 그에게는 공주인 아내가 칠백 명, 첩이 삼백 명 있었으며, 그의 아내들이 그의 마음을 돌이켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘공주인’으로 번역한 히브리어 שָׂרוֹת는 ‘고위 신분의 여성들’로도 옮길 수 있습니다.
