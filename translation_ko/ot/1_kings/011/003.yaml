  lexicon: HALOT
  rationale: 문맥상 국제적 정치혼인의 고위 신분 여성을 뜻하므로, 직역적이지만 현대 한국어에서 자연스러운 ‘귀부인’으로 옮겼습니다. 영어 주석의 ‘women of rank’도 이 이해를 뒷받침합니다.
- source_word: וּפִלַגְשִׁים
  english_pob_choice: concubines
  chosen_korean: 첩
  alternatives_korean:
  - 후궁
  - 소실
  lexicon: HALOT
  rationale: 법적 지위가 낮은 혼인/성적 동반자를 가리키는 표준 대응어로 ‘첩’을 사용했습니다. 본문 흐름상 왕실의 다처 구조를 유지하는 표현입니다.
- source_word: וַיַּטּוּ נָשָׁיו אֶת לִבּוֹ
  english_pob_choice: his wives turned away his heart
  chosen_korean: 그의 아내들이 그의 마음을 돌려놓았습니다
  alternatives_korean:
  - 그의 아내들이 그의 마음을 돌이켰습니다
  - 그의 아내들이 그의 마음을 기울게 했습니다
  lexicon: HALOT
  rationale: נטה의 방향 전환 이미지를 살리면서, 히브리어 ‘마음’(לב)의 내적 충성·의지의 전환을 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘마음’(לֵב)의 의미 범위
  chosen_reading: 감정만이 아니라 의지와 충성, 곧 야훼께 대한 내적 방향이 돌아선 것으로 읽었습니다.
  alternative_readings:
  - 단순한 애정 변화
  - 심리적 흔들림만을 가리킴
  rationale: 히브리어 인간 이해에서 לב는 감정에 국한되지 않으므로, 번역은 ‘마음’을 유지하되 문맥상 신앙적 충성의 이동을 보존했습니다.
  doctrine_reference: 히브리 성서의 האדם-לב 개념; 언약적 충성의 흐름
