lexical_decisions:
- source_word: נָשִׁים
  english_pob_choice: wives
  chosen_korean: 아내들
  alternatives_korean:
  - 부인들
  - 아내
  lexicon: HALOT
  rationale: 왕의 혼인 관계를 가리키므로 단순한 ‘여인들’보다 ‘아내들’이 source의 의미를 정확히 드러냅니다.
- source_word: שָׂרוֹת
