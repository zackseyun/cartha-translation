revisions:
- from: 그에게는 후궁을 포함해 귀부인 일곱백 명과 첩 삼백 명이 있었고, 그의 아내들이 그의 마음을 돌려놓았습니다.[a]
  to: 그에게는 공주인 아내가 칠백 명, 첩이 삼백 명 있었으며, 그의 아내들이 그의 마음을 돌이켰습니다.[a]
  rationale: 칠백 명의 아내와 삼백 명의 첩을 별개의 집단으로 명료하게 옮겼습니다. שָׂרוֹת의 주된 문맥상 의미는 ‘공주’로 반영하되 논쟁 가능한 어휘적 범위는 주석으로 보존했습니다. 마지막 동사는 마음이 원래 상태로 복귀했다는 인상을 피하고, 본문이 밝히지 않는 방향을 덧붙이지 않도록 ‘돌이켰습니다’로 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:45:25Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 ‘후궁을 포함해’라고 하여 칠백 명의 아내와 삼백 명의 첩이라는 히브리어의 구별된 수량을 흐리며, ‘귀부인’은 שָׂרוֹת의 왕족적 의미를 충분히 드러내지 못합니다. 또한 ‘돌려놓았습니다’는 원래 상태로 되돌린다는 뜻으로 읽힐 수 있어 וַיַּטּוּ의 ‘돌이키다/돌려서 떠나게 하다’와 맞지 않습니다.
  naturalness: ‘공주인 아내가 칠백 명, 첩이 삼백 명’은 현대 표준 한국어로 자연스럽고 두 집단과 수량을 분명히 구별합니다. ‘그의 아내들이 그의 마음을 돌이켰습니다’도 합쇼체 문체에 맞으며, 목적지가 본문에 명시되지 않은 원문의 표현을 보존합니다.
  terminology: נָשִׁים은 ‘아내’, פִלַגְשִׁים은 지위가 낮은 혼인·성 관계를 나타내는 통상적 용어인 ‘첩’으로 옮깁니다. שָׂרוֹת는 문맥상 ‘공주’로 번역하되, ‘고위 신분의 여성들’이라는 어휘적 대안은 주석으로 제시합니다.
  issues:
