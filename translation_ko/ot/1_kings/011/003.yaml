    rationale: ‘돌려놓다’는 원상 복귀의 뉘앙스가 강합니다. נטה는 여기서 그의 마음을 다른 방향으로 돌이키게 했다는 뜻이므로 ‘돌이켰습니다’가 더 정확합니다.
