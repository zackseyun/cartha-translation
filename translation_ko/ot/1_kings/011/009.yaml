id: 1KI.11.9
reference: 1 Kings 11:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתְאַנַּ֥ף יְהוָ֖ה בִּ/שְׁלֹמֹ֑ה כִּֽי נָטָ֣ה לְבָב֗/וֹ מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/נִּרְאָ֥ה אֵלָ֖י/ו פַּעֲמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/009.yaml
  text: And Yahweh became angry with Solomon, because his heart had turned away from Yahweh, the God of Israel, who had appeared to him twice.
translation:
  language: ko
  text: 야훼께서 솔로몬에게 분노하셨습니다. 그의 마음이 이스라엘의 하나님이신 야훼에게서 돌아섰기 때문입니다. 그분은 솔로몬에게 두 번 나타나셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַנַּף
  english_pob_choice: became angry
  chosen_korean: 분노하셨습니다
  alternatives_korean:
  - 성내셨습니다
  - 노하셨습니다
  - 격노하셨습니다
  lexicon: HALOT
  rationale: 히트파엘/와우 연속형은 분노의 발생을 나타내므로, 의미를 약화하지 않으면서도 한국어에서 자연스러운 ‘분노하셨습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 공용 번역 관행의 대체 칭호가 아니라 신명 자체를 드러내는 표기이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: נָטָה לְבָבוֹ מֵעִם
  english_pob_choice: his heart had turned away from
  chosen_korean: 그의 마음이 …에게서 돌아섰기 때문입니다
  alternatives_korean:
  - 그의 마음이 …에서 떠났기 때문입니다
  - 그의 마음이 …에서 기울었기 때문입니다
  lexicon: HALOT
  rationale: ‘마음이 기울다/돌다’의 관용구를 한국어의 ‘돌아서다’로 자연스럽게 살리되, 관계 단절의 방향성을 분명히 했습니다.
- source_word: הַנִּרְאָה אֵלָיו פַּעֲמָיִם
  english_pob_choice: who had appeared to him twice
  chosen_korean: 그분은 솔로몬에게 두 번 나타나셨습니다
  alternatives_korean:
  - 그분은 두 번 솔로몬에게 나타나셨습니다
  - 그분은 그에게 두 차례 나타나셨습니다
  lexicon: HALOT
  rationale: 분사구는 야훼를 수식하는 관계절이므로 ‘그분은’으로 받되, 완료 뉘앙스를 담아 ‘나타나셨습니다’로 옮겼습니다. ‘두 번’은 פַּעֲמָיִם의 자연스러운 대응입니다.
theological_decisions:
- issue: 야훼의 분노를 어떻게 표현할지
  chosen_reading: ‘분노하셨습니다’로 직접적으로 옮겨, 본문의 감정 표지를 약화하지 않았습니다.
  alternative_readings:
  - 마음이 상하셨습니다
  - 크게 노하셨습니다
  rationale: 히브리어는 하나님의 분노를 분명히 진술하므로, 이를 완화한 표현보다 본문 그대로의 강도를 유지하는 것이 더 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
- issue: ‘이스라엘의 하나님’과 ‘야훼’의 관계
  chosen_reading: ‘이스라엘의 하나님이신 야훼’로 연결해, 같은 분을 지칭하는 설명적 동격을 살렸습니다.
  alternative_readings:
  - 야훼, 이스라엘의 하나님
  - 이스라엘의 하나님 야훼
  rationale: 원문은 ידידה? not applicable — the construct identifies YHWH as the God of Israel, so 한국어에서는 설명적 동격으로 두 호칭의 동일성을 분명히 하는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה YHWH → Yahweh
