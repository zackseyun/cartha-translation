translation:
  language: ko
  text: 솔로몬이 예루살렘에서 온 이스라엘을 다스린 햇수는 사십 년이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הַ/יָּמִים
  english_pob_choice: And the days
  chosen_korean: 솔로몬이 예루살렘에서 온 이스라엘을 다스린 햇수는
  alternatives_korean:
  - 그리고 솔로몬이 예루살렘에서 온 이스라엘을 다스린 날들은
  - 솔로몬이 예루살렘에서 온 이스라엘을 다스린 기간은
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘날들’은 한국어에서 왕의 재위 기간을 뜻하는 관용적 표현으로 자연스럽지 않아, 문맥상 기간을 뜻하는 ‘햇수/기간’으로 옮겼습니다.
- source_word: מָלַךְ
  english_pob_choice: reigned
  chosen_korean: 다스린
  alternatives_korean:
  - 통치한
  - 왕으로 군림한
  lexicon: HALOT
  rationale: מלך는 왕의 재위와 통치를 가리키므로, 현대 한국어에서 문어적으로 자연한 ‘다스린’으로 옮겼습니다.
- source_word: בִ/ירוּשָׁלִַם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘 안에서
  - 예루살렘에
  lexicon: HALOT
  rationale: ב의 장소 표지를 한국어 조사 ‘-에서’로 옮겨, 왕이 예루살렘에서 재위했다는 위치 감각을 살렸습니다.
- source_word: עַל כָּל יִשְׂרָאֵל
  english_pob_choice: over all Israel
  chosen_korean: 온 이스라엘을
  alternatives_korean:
  - 온 이스라엘 위에
  - 모든 이스라엘 위에
  lexicon: HALOT
  rationale: ‘over’의 통치 관계를 한국어 동사 ‘다스리다’에 내포시키고, כָּל을 ‘온’으로 옮겨 전체성을 살렸습니다.
- source_word: אַרְבָּעִים שָׁנָה
  english_pob_choice: forty years
  chosen_korean: 사십 년이었습니다
  alternatives_korean:
  - 마흔 해였습니다
  - 사십 년이었습니다
  lexicon: HALOT
  rationale: 연대기적 요약 문맥을 따라 성경적 문체에 익숙한 한자어 수사 ‘사십 년’을 유지했습니다.
