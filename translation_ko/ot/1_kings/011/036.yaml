id: 1KI.11.36
reference: 1 Kings 11:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לִ/בְנ֖/וֹ אֶתֵּ֣ן שֵֽׁבֶט אֶחָ֑ד לְמַ֣עַן הֱיֽוֹת נִ֣יר לְ/דָֽוִיד עַ֠בְדִּ/י כָּֽל הַ/יָּמִ֤ים לְ/פָנַ/י֙ בִּ/יר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי לִ֔/י לָ/שׂ֥וּם שְׁמִ֖/י שָֽׁם־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/036.yaml
  text: But to his son I will give one tribe[a], so that David my servant may always have a lamp before me in Jerusalem, the city that I have chosen for myself to put my name there.
  footnotes:
  - marker: a
    text: Or 'light.' The Hebrew 'lamp' is a metaphor for the continuing Davidic line or enduring royal presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그의 아들에게는 한 지파를 주겠습니다. 그리하여 내 종 다윗이 예루살렘, 곧 내가 나를 위하여 내 이름을 두려고 택한 그 성읍에서 항상 내 앞에 등불이 되게 하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빛’. 히브리어 ‘등불’은 지속되는 다윗 계열이나 왕권의 남아 있는 존재를 가리키는 은유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנוֹ
  english_pob_choice: But to his son
  chosen_korean: 그러나 그의 아들에게는
  alternatives_korean:
  - 그리고 그의 아들에게는
  - 그의 아들에게는
  lexicon: HALOT
  rationale: 문맥상 앞선 왕국 분열 선언과 대조를 이루므로, 단순한 ‘그리고’보다 역접 ‘그러나’가 מקור의 대비를 더 잘 드러냅니다.
- source_word: שֵׁבֶט אֶחָד
  english_pob_choice: one tribe
  chosen_korean: 한 지파
  alternatives_korean:
  - 하나의 지파
  - 한 지파 곧 하나의 지파
  lexicon: HALOT
  rationale: 여기서는 왕권의 홀보다 분열된 이스라엘 안의 정치·지파 단위를 가리키므로, 자연스러운 현대 한국어로 ‘한 지파’가 적절합니다.
- source_word: נִיר
  english_pob_choice: lamp
  chosen_korean: 등불
  alternatives_korean:
  - 등
  - 불빛
  lexicon: HALOT
  rationale: 히브리어의 지속되는 다윗 계열을 가리키는 은유를 살리면서도, 한국어에서 성경적 비유로 자연스럽게 읽히는 ‘등불’을 택했습니다.
- source_word: לָשׂוּם שְׁמִי שָׁם
  english_pob_choice: to put my name there
  chosen_korean: 내 이름을 두려고
  alternatives_korean:
  - 내 이름을 두기 위하여
  - 내 이름이 있게 하려고
  lexicon: HALOT
  rationale: 신명기적 성전 신학의 관용구를 풀어 쓰지 않고, ‘이름을 두다’라는 직설적 표현을 유지해 원문의 신학적 긴장을 보존했습니다.
theological_decisions:
- issue: 다윗 왕조를 가리키는 ‘등불’ 은유
  chosen_reading: ‘등불’로 직역해 다윗 계열의 지속성을 암시하게 했습니다.
  alternative_readings:
  - ‘빛’으로 완화해 번역
  - 의미를 풀어 ‘왕통이 계속되게’로 번역
  rationale: 원문은 단순한 밝음이 아니라 다윗 왕조의 지속을 상징하는 은유를 사용하므로, 본문이 가진 상징성과 여운을 보존하는 쪽이 적절합니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: ‘내 이름을 두다’라는 성전 언어
  chosen_reading: 관용구를 유지해 ‘내 이름을 두다’로 번역했습니다.
  alternative_readings:
  - ‘내 임재를 두다’로 설명적 번역
  - ‘내가 그곳에서 예배받게 하다’로 해설적 번역
  rationale: 이 표현은 여호와의 이름이 예루살렘에 두어진다는 언약-성전 신학을 담고 있으므로, 설명으로 평평하게 만들기보다 원문 표현을 살려야 합니다.
  doctrine_reference: Translation philosophy §1, §3
