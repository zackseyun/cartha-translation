review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the causal phrase, the affliction of David's line, and the nonpermanent limitation. However, ‘다윗의 씨’ is overly literal and is not natural Standard Korean for a dynastic collective in this context.
  naturalness: ‘다윗의 자손’ is the normal modern Korean expression here. Making the second clause explicit as ‘영원히 그러지는 않겠습니다’ naturally supplies the understood action without adding meaning.
  terminology: ‘자손’ appropriately renders the collective זֶרַע in Korean biblical register. ‘괴롭게 하겠습니다’ suitably conveys the Piel of ענה without over-specifying oppression or a beneficial humbling.
  issues:
  - severity: medium
    issue: ‘다윗의 씨’ is unnatural and potentially misleading in contemporary Korean.
    rationale: Although it imitates the Hebrew seed metaphor, Korean normally uses ‘자손’ or ‘후손’ for a person's dynastic descendants. ‘자손’ preserves the collective reference and fits modern formal biblical Korean.
  - severity: low
    issue: The footnote should be anchored directly to the idiomatic duration rendering.
    rationale: The note explains ‘영원히,’ which renders לֹא כָל־הַיָּמִים; placing the marker immediately after that expression makes its referent unambiguous.
  revised_text: 내가 이 일 때문에 다윗의 자손을 괴롭게 하겠습니다. 그러나 영원히[a] 그러지는 않겠습니다.
