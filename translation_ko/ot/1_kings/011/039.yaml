source:
  edition: WLC
  text: וַֽ/אעַנֶּ֛ה אֶת זֶ֥רַע דָּוִ֖ד לְמַ֣עַן זֹ֑את אַ֖ךְ לֹ֥א כָל הַ/יָּמִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/039.yaml
  text: And I will afflict the offspring of David because of this[a], but not forever.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'not forever.' Literally, 'not all the days.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이 일 때문에 다윗의 자손을 괴롭게 하겠습니다. 그러나 영원히[a] 그러지는 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘모든 날 동안은 아니다’라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאעַנֶּה
  english_pob_choice: I will afflict
  chosen_korean: 괴롭게 하겠지만
  alternatives_korean:
  - 고통을 주겠습니다
  - 학대하겠습니다
  - 겸손하게 하겠습니다
  lexicon: HALOT
  rationale: Piel형 ענה는 이 문맥에서 징계로서의 ‘괴롭게 하다/고통을 주다’의 뜻이 적절합니다. ‘괴롭게 하다’는 심판 문맥을 살리면서도 과도하게 사회적 억압으로 좁히지 않습니다.
- source_word: זֶרַע דָּוִד
  english_pob_choice: the offspring of David
  chosen_korean: 다윗의 씨
  alternatives_korean:
  - 다윗의 후손
  - 다윗의 자손들
  - 다윗의 씨앗
  lexicon: HALOT
  rationale: זֶרַע는 집합적 단수이므로 ‘씨’가 원문의 집합성과 직유적 이미지를 가장 직접적으로 보존합니다. 전통적 교회어인 ‘자손’도 가능하지만, 원문 대비 이미지가 조금 약합니다.
- source_word: לְמַעַן זֹאת
  english_pob_choice: because of this
  chosen_korean: 이 일로
  alternatives_korean:
  - 이 때문에
  - 이 일 때문에
  - 이것으로 말미암아
  lexicon: HALOT
  rationale: 앞 문맥의 죄과를 가리키는 원인 표현이므로, 한국어에서는 간결한 원인 부사구 ‘이 일로’가 자연스럽고 충분히 직접적입니다.
- source_word: לֹא כָל הַיָּמִים
  english_pob_choice: not forever
  chosen_korean: 영원히는 아닙니다
  alternatives_korean:
  - 모든 날 동안은 아닙니다
  - 끝없이 그러하지는 않습니다
  - 항상 그런 것은 아닙니다
  lexicon: HALOT
  rationale: 직역하면 ‘모든 날이 아니다’이지만, 한국어에서는 제한된 기간을 뜻하는 관용적 의미를 살려 ‘영원히는 아닙니다’로 옮기는 편이 분명합니다. 이는 POB의 어휘 결정을 따르되 한국어 가독성을 높입니다.
theological_decisions:
- issue: 다윗 왕조에 대한 징계의 범위와 한계
  chosen_reading: 하나님의 징계는 वास्तविक하며, 그러나 끝없는 멸망은 아닙니다.
  alternative_readings:
  - 문자적으로만 ‘모든 날이 아니다’로 두어 더 낯설게 남길 수 있습니다
  - ‘영원히는 아니다’로 해석적 자연화를 더 강하게 할 수 있습니다
  rationale: 히브리어는 심판의 실제성과 동시에 그 기간의 제한을 분명히 합니다. 한국어 본문은 그 긴장을 유지하면서도, 독자가 즉시 이해할 수 있도록 ‘영원히는 아닙니다’로 자연화했습니다.
  doctrine_reference: Translation philosophy §3
