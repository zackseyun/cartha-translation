    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural literalism with standard Korean dynastic terminology, retains the source's causal and adversative structure, and expresses the temporary character of the affliction in clear modern formal-polite Korean. The footnote preserves the Hebrew wording behind the idiomatic duration expression.
