id: 1KI.11.41
reference: 1 Kings 11:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֧י שְׁלֹמֹ֛ה וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וְ/חָכְמָת֑/וֹ הֲ/לֽוֹא הֵ֣ם כְּתֻבִ֔ים עַל סֵ֖פֶר דִּבְרֵ֥י שְׁלֹמֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/041.yaml
  text: Now the rest of the acts of Solomon[a], and all that he did, and his wisdom—are they not written in the Book of the Acts of Solomon?
  footnotes:
  - marker: a
    text: Or 'the Book of the Chronicles of Solomon.' The Hebrew title literally contains 'the words/matters of Solomon,' an idiom for the record of his acts.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬의 나머지 업적과 그가 한 모든 일과 그의 지혜는, 솔로몬의 행적의 책에 기록되어 있지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘솔로몬의 행적의 책’은 히브리어로는 문자적으로 ‘솔로몬의 말/일들’이라는 제목이며, 그의 업적을 기록한 문서라는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שְׁלֹמֹה
  english_pob_choice: Now the rest of the acts of Solomon
  chosen_korean: 솔로몬의 나머지 업적
  alternatives_korean:
  - 솔로몬의 나머지 행적
  - 솔로몬의 남은 일들
  - 솔로몬의 나머지 사건들
  lexicon: HALOT
  rationale: יֶתֶר는 ‘나머지’를, דִּבְרֵי는 이 왕조 결산 문맥에서 단순 ‘말’이 아니라 기록된 업적/행적을 가리키므로, 한국어에서는 자연스럽게 ‘나머지 업적’으로 옮겼습니다.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  english_pob_choice: and all that he did
  chosen_korean: 그가 한 모든 일
  alternatives_korean:
  - 그가 행한 모든 것
  - 그가 이룬 모든 일
  lexicon: HALOT
  rationale: עָשָׂה의 넓은 의미를 살리면서도 과도하게 성취를 강조하지 않도록, 직접적이고 포괄적인 ‘한 모든 일’로 옮겼습니다.
- source_word: וְחָכְמָתוֹ
  english_pob_choice: and his wisdom
  chosen_korean: 그의 지혜
  alternatives_korean:
  - 그가 지닌 지혜
  - 그의 지혜와 총명
  lexicon: HALOT
  rationale: 열거 항목을 유지하기 위해 간결하게 ‘그의 지혜’로 번역했고, 본문의 강조점인 솔로몬의 지혜를 분명히 했습니다.
- source_word: סֵפֶר דִּבְרֵי שְׁלֹמֹה
  english_pob_choice: the Book of the Acts of Solomon
  chosen_korean: 솔로몬의 행적의 책
  alternatives_korean:
  - 솔로몬의 역대기
  - 솔로몬의 사건들의 책
  - 솔로몬의 행적 기록
  lexicon: HALOT
  rationale: דִּבְרֵי를 ‘말씀’으로 좁히지 않고, 문맥상 ‘기록된 행적/업적’의 뜻을 살려 제목을 직역에 가깝게 옮겼습니다. ‘역대기’는 관용적이지만 본문의 투명성을 약화할 수 있어 피했습니다.
theological_decisions:
- issue: 수사적 질문 הֲלוֹא의 처리
  chosen_reading: 기록되어 있지 않습니까?
  alternative_readings:
  - 기록되어 있습니다, 그렇지 않습니까?
  - 기록되어 있지요?
  rationale: הֲלוֹא는 예를 기대하는 수사 의문이므로, 한국어에서도 독자에게 기록 사실을 상기시키는 질문형을 유지했습니다.
  doctrine_reference: 성경 역사서의 종결 공식은 독자의 지식 공유를 전제하는 수사 장치이므로, 서술적 단정으로 평평하게 만들지 않습니다.
