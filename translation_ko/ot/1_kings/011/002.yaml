  - severity: medium
    issue: ‘그들의 신들 뒤로 돌리게 할 것입니다’ is unnatural and semantically unclear.
    rationale: Korean does not normally express religious following by turning a heart ‘behind’ gods. ‘그들의 신들을 따르도록 ... 마음을 돌릴 것입니다’ naturally conveys the Hebrew metaphor without reducing it to a denominational interpretation.
  - severity: low
