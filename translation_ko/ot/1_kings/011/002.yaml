  naturalness: The opening '그 민족들 가운데서였는데' is a dangling, incomplete construction in Korean. Recasting the verse around the relative clause produces a complete, readable sentence while retaining the source's reference to the nations. '사랑으로 매달렸습니다' is understandable but less natural than '사랑하여 그들에게 집착했습니다' for a strong, love-motivated attachment.
  terminology: '''야훼,'' ''이스라엘 자손,'' and ''신들'' are appropriate. The divine warning is rendered in modern formal-polite speech. The literal, contextually opaque entering idiom is retained in the main text, with its intermarriage sense explained in the footnote.'
  issues:
