revisions:
- from: 그 민족들 가운데서였는데, 야훼께서 이스라엘 자손에게 말씀하시기를 “그들 가운데로 들어가서는 안 되고, 그들도 너희 가운데로 들어와서는 안 됩니다. 그들이 반드시 너희 마음을 그들의 신들 뒤로 돌리게 할 것입니다.” 하셨습니다. 그런데 솔로몬은 그들에게 사랑으로 매달렸습니다.[a]
  to: 야훼께서 이스라엘 자손에게 “너희는 그들 가운데에 들어가서는 안 되며, 그들도 너희 가운데에 들어와서는 안 됩니다.[a] 그들이 반드시 너희 마음을 그들의 신들을 따르도록 돌릴 것입니다.”라고 말씀하신 그 민족들에게 솔로몬은 사랑하여 집착했습니다.
