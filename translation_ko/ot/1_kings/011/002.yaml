  text: מִן הַ/גּוֹיִ֗ם אֲשֶׁ֣ר אָֽמַר יְהוָה֩ אֶל בְּנֵ֨י יִשְׂרָאֵ֜ל לֹֽא תָבֹ֣אוּ בָ/הֶ֗ם וְ/הֵם֙ לֹא יָבֹ֣אוּ בָ/כֶ֔ם אָכֵן֙ יַטּ֣וּ אֶת לְבַבְ/כֶ֔ם אַחֲרֵ֖י אֱלֹהֵי/הֶ֑ם בָּ/הֶ֛ם דָּבַ֥ק שְׁלֹמֹ֖ה לְ/אַהֲבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/002.yaml
  text: from the nations about which Yahweh had said to the sons of Israel[a], “You shall not go in among them, and they shall not come in among you; surely they will turn your heart after their gods”—to these Solomon clung in love.
  footnotes:
  - marker: a
    text: Or more explicitly in context, “You shall not intermarry with them, and they with you.” The Hebrew says, more literally, “You shall not go in among them, and they shall not come in among you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그 민족들 가운데서였는데, 야훼께서 이스라엘 자손에게 말씀하시기를 “그들 가운데로 들어가서는 안 되고, 그들도 너희 가운데로 들어와서는 안 됩니다. 그들이 반드시 너희 마음을 그들의 신들 뒤로 돌리게 할 것입니다.” 하셨습니다. 그런데 솔로몬은 그들에게 사랑으로 매달렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 더 직접적으로는 “그들과 혼인해서는 안 되고, 그들도 너희와 혼인해서는 안 됩니다”라는 뜻입니다. 히브리어는 더 문자적으로 “그들 가운데로 들어가서는 안 되고, 그들도 너희 가운데로 들어와서는 안 됩니다”라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַגּוֹיִם
  english_pob_choice: from the nations
  chosen_korean: 그 민족들 가운데서였는데
  alternatives_korean:
  - 그 나라들 가운데서
  - 여러 민족들 가운데서
  lexicon: HALOT
  rationale: גּוֹיִם은 여기서 이방 민족들을 가리키므로 ‘민족들’이 자연스럽고, מן의 출발점/소속 감각은 ‘가운데서’로 살렸습니다.
- source_word: אָמַר יְהוָה
  english_pob_choice: Yahweh had said
  chosen_korean: 야훼께서 … 말씀하시기를
  alternatives_korean:
  - 여호와께서 … 말씀하시기를
  - 야훼께서 … 이르시기를
  lexicon: HALOT
  rationale: 신명 표기는 프로젝트 기본값에 따라 야훼를 사용했고, 문맥상 직접 발화 도입은 ‘말씀하시기를’이 가장 분명합니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 백성
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 관용구를 비교적 투명하게 옮기되, 한국어 성경 문체에서도 익숙한 ‘이스라엘 자손’을 택했습니다.
- source_word: לֹא תָבֹאוּ בָהֶם / וְהֵם לֹא יָבֹאוּ בָכֶם
  english_pob_choice: You shall not go in among them, and they shall not come in among you
  chosen_korean: 그들 가운데로 들어가서는 안 되고, 그들도 너희 가운데로 들어와서는 안 됩니다
  alternatives_korean:
  - 그들과 함께 들어가서는 안 되고, 그들도 너희와 함께 들어와서는 안 됩니다
  - 그들과 혼인해서는 안 되고, 그들도 너희와 혼인해서는 안 됩니다
  lexicon: HALOT
  rationale: 본문의 동사는 문자적으로 ‘들어가다’이므로 주석적 의미를 본문에 덧씌우지 않고, 관계의 금지를 드러내는 한국어로 옮겼습니다.
- source_word: יַטּוּ אֶת לְבַבְכֶם
  english_pob_choice: they will turn your heart
  chosen_korean: 너희 마음을 … 돌리게 할 것입니다
  alternatives_korean:
  - 너희 마음을 기울게 할 것입니다
  - 너희 마음을 돌려놓을 것입니다
  lexicon: HALOT
  rationale: נטה의 ‘기울이다/돌리다’ 의미를 살리되, 한국어에서는 마음의 방향 전환을 나타내는 ‘돌리게 하다’가 가장 자연스럽습니다.
- source_word: אַחֲרֵי אֱלֹהֵיהֶם
  english_pob_choice: after their gods
  chosen_korean: 그들의 신들 뒤로
  alternatives_korean:
  - 그들의 신들을 따라
  - 그들의 신들을 뒤쫓아
  lexicon: HALOT
  rationale: ‘뒤로’는 אַחֲרֵי의 방향 감각을 보존하고, 우상 추종의 종속성을 드러냅니다.
- source_word: דָּבַק
  english_pob_choice: clung
  chosen_korean: 사랑으로 매달렸습니다
  alternatives_korean:
  - 사랑으로 붙었습니다
  - 사랑으로 달라붙었습니다
  lexicon: HALOT
  rationale: דבק의 강한 부착/집착을 한국어에서 생생하게 전달하려고 ‘매달리다’를 선택했고, לְאַהֲבָה의 수단/양태를 ‘사랑으로’로 옮겼습니다.
theological_decisions:
- issue: 명령문의 범위를 혼인 금지로 명시할지 여부
  chosen_reading: 본문의 ‘들어가다/들어오다’ 표현을 유지하고, 의미는 문맥에 맡깁니다.
  alternative_readings:
  - ‘그들과 혼인해서는 안 됩니다’로 직접 풀어 쓰기
  rationale: 이 절 자체는 더 일반적인 동사로 말하지만, 문맥상 혼인 관계를 가리킵니다. 본문 표현을 유지해 원문이 가진 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ‘그들 가운데로’의 대상이 민족인지 사람들인지
  chosen_reading: 민족을 가리키는 문맥을 살리되, 한국어에서는 관계 금지의 함의를 자연스럽게 드러냅니다.
  alternative_readings:
  - 그들 안으로
  - 그들과 섞여서
  rationale: 히브리어는 민족 단위의 금지를 말하지만, 뒤의 ‘마음이 돌려짐’과 연결되어 실제 적용은 관계/혼인 문제입니다. 과도한 해석 없이 양쪽을 모두 보존했습니다.
  doctrine_reference: Translation philosophy §3
