source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ שְׁלֹמֹ֛ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹ֥א מִלֵּ֛א אַחֲרֵ֥י יְהוָ֖ה כְּ/דָוִ֥ד אָבִֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/006.yaml
  text: So Solomon did what was evil in the eyes of Yahweh[a], and he did not fully follow Yahweh, as David his father had done.
  footnotes:
  - marker: a
    text: Or 'did not go fully after the LORD' or 'was not wholly devoted to the LORD.' The Hebrew idiom expresses incomplete loyalty or obedience.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 야훼 보시기에 악을 행했고, 그의 아버지 다윗이 한 것처럼 야훼를 온전히 따르지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼를 완전히 뒤따르지 않았다’, ‘야훼께 온전히 헌신하지 않았다’로 옮길 수 있습니다. 이 히브리어 관용구는 불완전한 충성이나 순종을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 행했고
  alternatives_korean:
  - 했습니다
  - 저질렀습니다
  lexicon: HALOT
  rationale: עשה는 여기서 일반적인 행위를 가리키므로, 문맥상 ‘악을 행하다’로 자연스럽게 옮겼습니다. 앞절의 평가를 이어 주는 동사로서 ‘했습니다’보다 ‘행했고’가 더 직접적입니다.
- source_word: הָרַע
  english_pob_choice: what was evil
  chosen_korean: 악
  alternatives_korean:
  - 나쁜 일
  - 옳지 않은 일
  lexicon: HALOT
  rationale: 정관사형 명사적 용법이므로 도덕적 악을 드러내는 ‘악’이 가장 간결하고 정확합니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈앞에서
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 히브리어의 평가 관용구를 살려 직역에 가깝게 옮겼습니다. ‘보시기에’는 시각 은유를 유지하면서도 현대 한국어에서 자연스럽습니다.
- source_word: מִלֵּא אַחֲרֵי
  english_pob_choice: fully follow
  chosen_korean: 온전히 따르지 않았습니다
  alternatives_korean:
  - 완전히 따르지 않았습니다
  - 전적으로 따르지 않았습니다
  - 온전히 뒤따르지 않았습니다
  lexicon: HALOT
  rationale: 이 관용구는 단순한 내적 헌신보다 ‘충실히 따름’의 의미를 담으므로, 의미를 살려 ‘온전히 따르다’로 옮겼습니다. 부정형과 함께 쓰여 불완전한 충성을 나타냅니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 고유한 언약 이름을 보존하기 위해 직역적 음역인 ‘야훼’를 사용했습니다. 이는 본문이 말하는 인격적 언약 관계를 흐리지 않습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: מִלֵּא אַחֲרֵי יְהוָה의 강도
  chosen_reading: 야훼를 온전히 따르지 않았습니다
  alternative_readings:
  - 야훼를 완전히 따르지 않았습니다
  - 야훼를 온전히 섬기지 않았습니다
  - 야훼를 전적으로 따르지 않았습니다
  rationale: 이 절은 솔로몬의 불완전한 충성을 말할 뿐, 이 구절 하나만으로 완전한 배교를 단정하지는 않습니다. 따라서 ‘온전히 따르지 않았다’로 절의 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
