translation:
  language: ko
  text: 그의 모든 외국 출신 아내들을 위해서도 그와 같이 했습니다.[a] 그들은 그들의 신들에게 분향하고 제사를 바치고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 앞절의 구체적인 내용을 생략하고 ‘그와 같이 했다’고만 말합니다.
    reason: source_note
lexical_decisions:
- source_word: וְכֵן עָשָׂה
  english_pob_choice: And so he did
  chosen_korean: 그와 같이 했습니다
  alternatives_korean:
  - 그리고 그렇게 했습니다
  - 그와 같이 행했습니다
  lexicon: HALOT
  rationale: 히브리어는 앞절의 내용을 이어 받는 축약 표현이므로, 한국어에서도 앞절을 자연스럽게 가리키는 ‘그와 같이’로 간결하게 살렸습니다.
- source_word: לְכָל נָשָׁיו
  english_pob_choice: for all his foreign wives
  chosen_korean: 그의 외국인 아내들 모두에게도
  alternatives_korean:
  - 그의 외국 아내들 모두에게도
  - 모든 외국인 아내들에게
  lexicon: HALOT
  rationale: נָשִׁים은 문맥상 분명히 ‘아내들’이며, לְכָל은 이들에게 두루 적용된다는 뜻이므로 ‘모두에게도’로 옮겼습니다.
- source_word: מַקְטִירוֹת וּמְזַבְּחוֹת
  english_pob_choice: were burning incense and sacrificing
  chosen_korean: 분향하며 제사드리고 있었습니다
  alternatives_korean:
  - 분향하고 제사드리고 있었습니다
  - 향을 피우며 제사를 드리고 있었습니다
  lexicon: HALOT
  rationale: 여성 복수 분사형이 ‘아내들’과 직접 일치하므로, 동작이 진행 중인 상태를 나타내는 ‘-하며 … 하고 있었습니다’로 참여적 뉘앙스를 살렸습니다.
- source_word: לֵאלֹהֵיהֶן
  english_pob_choice: to their gods
  chosen_korean: 자기들의 신들에게
  alternatives_korean:
  - 그들의 신들에게
  - 그들만의 신들에게
  lexicon: HALOT
  rationale: 복수형 ‘אלֹהִים’과 여성 복수 접미사가 가리키는 대상은 이방 신들이므로, 하나님의 단수 개념과 구별되도록 ‘신들’로 옮겼습니다.
theological_decisions:
- issue: 분사형의 지속적 예배 행위 표현
  chosen_reading: 히브리어 분사형을 단순 과거로 평평하게 만들지 않고, 진행 중인 우상숭배 행위로 드러나게 했습니다.
  alternative_readings:
  - 분향하고 제사드렸습니다
  - 분향하며 제사를 드렸습니다
  rationale: 문맥상 솔로몬의 이방 아내들이 계속해서 이 행위를 하고 있다는 점이 중요하므로, 진행성을 드러내는 표현이 원문의 의미를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
