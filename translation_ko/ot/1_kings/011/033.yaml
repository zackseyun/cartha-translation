  edition: WLC
  text: יַ֣עַן אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַ/יִּֽשְׁתַּחֲווּ֮ לְ/עַשְׁתֹּרֶת֮ אֱלֹהֵ֣י צִֽדֹנִין֒ לִ/כְמוֹשׁ֙ אֱלֹהֵ֣י מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם אֱלֹהֵ֣י בְנֵֽי עַמּ֑וֹן וְ/לֹֽא הָלְכ֣וּ בִ/דְרָכַ֗/י לַ/עֲשׂ֨וֹת הַ/יָּשָׁ֧ר בְּ/עֵינַ֛/י וְ/חֻקֹּתַ֥/י וּ/מִשְׁפָּטַ֖/י כְּ/דָוִ֥ד אָבִֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/033.yaml
  text: because they have forsaken me and bowed down to Ashtoreth[a], the god of the Sidonians, to Chemosh, the god of Moab, and to Milcom, the god of the Ammonites, and have not walked in my ways, to do what is right in my eyes and my statutes and my judgments[d][c][b], like David his father.
  footnotes:
  - marker: a
    text: Or 'the goddess of the Sidonians.' The Hebrew phrase reads literally 'the god of the Sidonians' even though Ashtoreth is a female deity.
    reason: lexical_alternative
  - marker: b
    text: Milcom is the reading of the Hebrew text here; some associate this name with Molech.
    reason: alternative_reading
  - marker: c
    text: '''His father'' here refers to David as dynastic forefather, not Solomon''s immediate biological father.'
    reason: cultural_note
  - marker: d
    text: Or 'by doing what is right in my eyes and my statutes and my judgments'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 나를 버리고 시돈 사람들의 신 아스다롯과 모압의 신 그모스와 암몬 자손의 신 밀곰에게 절했으며, 내 눈에 옳은 일을 하고 내 길을 따르지 않았기 때문입니다—내 법도와 내 규례를 지키지 않고, 그의 조상 다윗처럼 하지 않았기 때문입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아스다롯은 여성 신으로 알려져 있지만, 히브리어 본문은 문자적으로 ‘시돈 사람들의 신’이라고 씁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘밀곰’은 마소라 본문의 읽기입니다. 전통적으로는 ‘몰렉’과 관련 짓기도 합니다.
    reason: alternative_reading
  - marker: c
    text: 여기서 ‘그의 조상’은 솔로몬의 직계 아버지가 아니라 다윗 왕조의 선조를 가리킵니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘내 눈에 옳은 일과 내 법도와 내 규례를 행함으로써’.
    reason: previous_rendering
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  english_pob_choice: because
  chosen_korean: …때문입니다
  alternatives_korean:
  - …이므로
  - …여서
  lexicon: HALOT
  rationale: 원문의 인과 관계를 현대 한국어로 자연스럽게 풀어 주면서, 문장 전체의 이유 제시 기능을 유지합니다.
- source_word: עֲזָבוּנִי
  english_pob_choice: they have forsaken me
  chosen_korean: 나를 버리고
  alternatives_korean:
  - 나를 떠나고
  - 나를 저버리고
  lexicon: HALOT
  rationale: 언약적 배반의 무게를 살리기 위해 단순한 ‘떠나다’보다 ‘버리다’를 택했습니다.
- source_word: וַיִּשְׁתַּחֲווּ
  english_pob_choice: and bowed down
  chosen_korean: 절했으며
  alternatives_korean:
  - 엎드려 절했으며
  - 경배했으며
  lexicon: HALOT
  rationale: 우상 숭배의 신체적 행위를 드러내면서도 현대 독자가 이해하기 쉬운 표현으로 옮겼습니다.
- source_word: אֱלֹהֵי צִדֹנִין / אֱלֹהֵי מוֹאָב / אֱלֹהֵי בְנֵי עַמּוֹן
  english_pob_choice: the god of the Sidonians / the god of Moab / the god of the Ammonites
  chosen_korean: 시돈 사람들의 신 / 모압의 신 / 암몬 자손의 신
  alternatives_korean:
  - 시돈 사람들의 하나님
  - 시돈 사람들의 여신
  - 모압 사람들의 신
  lexicon: HALOT
  rationale: 히브리어의 소유격 구조를 따라 각 민족의 신으로 옮겼고, 아스다롯의 여성성 때문에 본문을 바꾸지 않았습니다.
- source_word: הַיָּשָׁר בְּעֵינַי
  english_pob_choice: what is right in my eyes
  chosen_korean: 내 눈에 옳은 일
  alternatives_korean:
  - 내가 보기에 옳은 것
  - 내 눈앞에 옳은 것
  lexicon: HALOT
  rationale: 하나님의 평가 기준을 드러내는 관용구를 직역에 가깝게 살렸습니다.
- source_word: חֻקֹּתַי וּמִשְׁפָּטַי
  english_pob_choice: my statutes and my judgments
  chosen_korean: 내 법도와 내 규례
  alternatives_korean:
  - 내 규례와 내 판단
  - 내 율례와 내 판결
  lexicon: HALOT
  rationale: 정해진 명령과 판례적 규정의 짝을 한국어 성경 문체로 구분하되, 지나치게 교회 전통 용어에만 고정되지 않도록 했습니다.
- source_word: כְּדָוִד אָבִיו
  english_pob_choice: like David his father
  chosen_korean: 그의 조상 다윗처럼
  alternatives_korean:
  - 그의 아버지 다윗처럼
  - 다윗 그의 아버지처럼
  lexicon: HALOT
  rationale: 여기서 ‘아버지’는 솔로몬의 직계 부친이 아니라 왕조적 선조를 가리키므로, 그 의미를 분명히 했습니다.
theological_decisions:
- issue: 아스다롯의 성별과 אֱלֹהֵי의 형식 일치
  chosen_reading: 본문 그대로 ‘시돈 사람들의 신 아스다롯’으로 유지했습니다.
  alternative_readings:
  - 시돈 사람들의 여신 아스다롯
  - 시돈 사람들의 신/여신
  rationale: 히브리어는 문법적으로 ‘신’을 사용하므로, 본문 형태를 보존하고 성별 문제는 본문을 바꾸지 않고 독자가 인지하도록 두었습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘그의 조상 다윗’의 지시 대상
  chosen_reading: 다윗은 다윗 왕조의 선조로 이해해 ‘그의 조상 다윗처럼’으로 옮겼습니다.
  alternative_readings:
  - 그의 아버지 다윗처럼
  - 다윗 그의 아버지처럼
  rationale: 히브리어의 ‘아버지’는 혈연의 직계 부친이 아니라 왕조적 선대를 뜻할 수 있으므로, 문맥상 의미를 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §3
