revisions:
- from: 그들이 나를 버리고 시돈 사람들의 신 아스다롯과 모압의 신 그모스와 암몬 자손의 신 밀곰에게 절했으며, 내 눈에 옳은 일을 하고 내 길을 따르지 않았기 때문입니다—내 법도와 내 규례를 지키지 않고, 그의 조상 다윗처럼 하지 않았기 때문입니다.[a][b][c][d]
  to: 이는 그들이 나를 버리고 시돈 사람들의 신인 아스다롯에게, 모압의 신 그모스에게, 암몬 자손의 신 밀곰에게 절하였으며, 그의 조상 다윗처럼 내 길을 따라 내가 보기에 옳은 일을 하고 내 법도와 내 규례를 지키지 않았기 때문입니다.[a][b][c][d]
  rationale: 원문의 인과절을 하나의 문장으로 회복하고, ‘버리고/절하였으며/따르지 않았기’의 병렬 및 부정 관계를 바로잡았습니다. 한국어의 자연스러움을 위해 ‘법도와 규례를 지키다’를 사용했으며, 이는 히브리어의 단일 동사가 법적 규범에도 미치는 의미를 충실히 전달합니다. 비교구 ‘그의 조상 다윗처럼’은 다윗의 순종을 본보기로 삼는 원문 문맥에 맞도록 순종 행위 앞에 배치했습니다. 각주 표지는 모두 보존하고 본문상의 해당 명칭 및 표현과 연결했습니다.
