  text: וְ/הָיָ֗ה אִם תִּשְׁמַע֮ אֶת כָּל אֲשֶׁ֣ר אֲצַוֶּ/ךָ֒ וְ/הָלַכְתָּ֣ בִ/דְרָכַ֗/י וְ/עָשִׂ֨יתָ הַ/יָּשָׁ֤ר בְּ/עֵינַ/י֙ לִ/שְׁמ֤וֹר חֻקּוֹתַ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר עָשָׂ֖ה דָּוִ֣ד עַבְדִּ֑/י וְ/הָיִ֣יתִי עִמָּ֗/ךְ וּ/בָנִ֨יתִי לְ/ךָ֤ בַֽיִת נֶאֱמָן֙ כַּ/אֲשֶׁ֣ר בָּנִ֣יתִי לְ/דָוִ֔ד וְ/נָתַתִּ֥י לְ/ךָ֖ אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/038.yaml
  text: And it shall be[a], if you listen to all that I command you, and walk in my ways, and do what is right in my eyes by keeping my statutes and my commandments, as David my servant did, then I will be with you and build for you a faithful house, just as I built for David, and I will give Israel to you.
  footnotes:
  - marker: a
    text: Or 'an enduring house,' 'a sure house,' or 'a faithful house'; that is, a lasting dynasty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 네가 내가 네게 명령하는 모든 것을 듣고, 내 길로 걸으며, 내 눈에 옳은 것을 행하고, 내 율례와 내 계명을 지켜, 내 종 다윗이 한 것처럼 한다면, 내가 너와 함께하며, 내가 다윗에게 세운 것처럼 너를 위하여 충실한 집을 세우고, 이스라엘을 네게 주겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '지속되는 집', '견고한 집' 혹은 '충실한 집'을 뜻하며, 곧 오래 지속되는 왕조를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  english_pob_choice: listen
  chosen_korean: 듣고
  alternatives_korean:
  - 들으면
  - 순종하면
  lexicon: HALOT
  rationale: 히브리어 שׁמע는 문맥에 따라 '듣다/듣고 따르다'의 범위를 가지므로, 앞의 조건절 전체가 순종을 요구함을 살리면서도 기본 동사 의미는 '듣고'로 유지했습니다.
- source_word: בַיִת נֶאֱמָן
  english_pob_choice: a faithful house
  chosen_korean: 충실한 집
  alternatives_korean:
  - 지속되는 집
  - 견고한 집
  - 신실한 집
  lexicon: HALOT
  rationale: 여기서 '집'은 건물이 아니라 왕조를 가리키지만, 본문 이미지와의 연결을 위해 '집'을 유지했고 נֶאֱמָן은 '충실한'으로 옮겨 신뢰성과 지속성을 함께 드러냈습니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 종들
  - 내 노예
  lexicon: HALOT
  rationale: 다윗에 대한 존칭적·언약적 표현으로는 '종'이 자연스럽고, 한국어 성서 문맥에서도 가장 직접적으로 대응합니다.
- source_word: וְנָתַתִּי לְךָ אֶת יִשְׂרָאֵל
  english_pob_choice: I will give Israel to you
  chosen_korean: 이스라엘을 네게 주겠습니다
  alternatives_korean:
  - 이스라엘을 너에게 주겠습니다
  - 네게 이스라엘을 주겠습니다
  lexicon: HALOT
  rationale: 직접목적어 '이스라엘'을 앞에 두어 히브리어의 강조점을 살렸고, 왕에게 주어지는 통치권의 뉘앙스를 평이하게 전달했습니다.
theological_decisions:
- issue: 조건절의 성격
  chosen_reading: 여기서는 순종에 달린 실제 조건부 약속으로 번역했습니다.
  alternative_readings:
  - 무조건적 보장
  - 수사적 권면
  rationale: אִם과 이어지는 일련의 조건 동사들이 분명한 언약적 조건을 이루므로, 신학적으로 완화하지 않고 조건성을 그대로 드러내는 것이 본문의 힘에 맞습니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘집’의 의미
  chosen_reading: 왕조를 가리키는 비유적 '집'으로 유지했습니다.
  alternative_readings:
  - 궁전
  - 가문
  rationale: 다윗과의 대비 및 후대 왕조 약속 문맥상 '집'은 건물보다 지속되는 왕실 계열을 뜻하므로, 본문 고유의 표현을 살리기 위해 직역적 비유를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
