  to: 그리고 네가 내가 네게 명령하는 모든 것을 듣고, 내 길을 따라 걸으며, 내 종 다윗이 한 것처럼 내 율례와 내 계명을 지켜 내가 보기에 옳은 일을 행하면, 내가 너와 함께하고, 내가 다윗을 위하여 세운 것처럼 너를 위하여 견고한 집을 세우며, 이스라엘을 네게 주겠습니다.[a]
  rationale: 조건부 약속의 구조와 ‘듣다’라는 שׁמע의 기본 의미를 유지했습니다. 다만 נֶאֱמָן이 왕조 약속에서 나타내는 견고함과 지속성을 한국어로 자연스럽게 전달하도록 ‘견고한 집’으로 고쳤고, 각주에서 대안 및 왕조라는 비유적 의미를 명시했습니다. 모든 종결은 요청된 현대 합쇼체에 맞추었습니다.
