translation:
  language: ko
  text: 파라오가 그에게 말했습니다. 「그런데 나와 함께 있는데 네게 무엇이 부족하기에 네 땅으로 가려고 하느냐?」 그가 말했습니다. 「아무것도 없습니다. 다만 저를 보내 주십시오.[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘보내라, 당신은 나를 보내야 합니다’라는 뜻의 표현으로, 부정사 절대형과 유한동사를 함께 써서 간청을 강조합니다.
    reason: 원문의 שַׁלֵּחַ תְּשַׁלְּחֵנִי에 나타나는 강조 구문을 보존합니다.
