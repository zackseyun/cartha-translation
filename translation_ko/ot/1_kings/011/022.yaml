  text: וַ/יֹּ֧אמֶר ל֣/וֹ פַרְעֹ֗ה כִּ֠י מָה אַתָּ֤ה חָסֵר֙ עִמִּ֔/י וְ/הִנְּ/ךָ֥ מְבַקֵּ֖שׁ לָ/לֶ֣כֶת אֶל אַרְצֶ֑/ךָ וַ/יֹּ֣אמֶר לֹ֔א כִּ֥י שַׁלֵּ֖חַ תְּשַׁלְּחֵֽ/נִי־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/022.yaml
  text: Then Pharaoh said to him[a], “But what do you lack with me, that you are seeking to go to your own land?” And he said, “Nothing, but please let me go.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''send, you must send me away''—an emphatic construction using an infinitive absolute with a finite verb.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바로 그때 파라오가 그에게 말했습니다. 「내게서 무엇이 부족하기에, 네가 네 땅으로 가려고 하느냐?」 그가 말했습니다. 「아무것도 없습니다. 다만 저를 보내 주십시오.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַרְעֹה
  english_pob_choice: Pharaoh
  chosen_korean: 파라오
  alternatives_korean:
  - 바로
  lexicon: WLC
  rationale: 히브리어 고유명사를 현대 표기법에 따라 음역했고, 본문 인물의 역사적 호칭을 그대로 살렸습니다.
- source_word: מָה אַתָּה חָסֵר עִמִּי
  english_pob_choice: what do you lack with me
  chosen_korean: 내게서 무엇이 부족하기에
  alternatives_korean:
  - 내게서 무엇이 모자라기에
  - 내 곁에서 무엇이 부족하기에
  lexicon: HALOT
  rationale: חָסֵר의 핵심 의미인 ‘부족하다/모자라다’를 살리되, עִמִּי의 관계적 뉘앙스는 한국어에서 자연스러운 ‘내게서’로 풀었습니다.
- source_word: וְהִנְּךָ
  english_pob_choice: that now you are
  chosen_korean: 네가
  alternatives_korean:
  - 그리고 네가
  - 보라, 네가
  lexicon: HALOT
  rationale: 여기서는 담화 표지로서 질문의 흐름을 이어 주는 기능이 강하므로, 한국어에서는 별도의 표지를 덧붙이지 않고 자연스럽게 연결했습니다.
- source_word: שַׁלֵּחַ תְּשַׁלְּחֵנִי
  english_pob_choice: please let me go
  chosen_korean: 저를 보내 주십시오
  alternatives_korean:
  - 저를 반드시 보내 주십시오
  - 저를 놓아 주십시오
  lexicon: HALOT
  rationale: 히브리어의 부정사 절대형+미완료형이 주는 강한 요청/강조를 한국어 공손 명령으로 옮겼습니다. ‘보내다’가 출발 허용의 의미를 가장 직접적으로 드러냅니다.
theological_decisions:
- issue: 겸양체 요청의 화행 강도
  chosen_reading: 하반절을 ‘저를 보내 주십시오’로 옮겨, 단순 허락 요청이면서도 강조된 간청이라는 힘을 유지했습니다.
  alternative_readings:
  - 저를 보내십시오
  - 부디 저를 보내 주십시오
  rationale: 원문은 강조형 표현으로 간청의 힘이 있습니다. 한국어에서는 합쇼체 명령을 사용하되, 과도한 장식어 없이 간결하게 유지했습니다.
  doctrine_reference: source discourse force
