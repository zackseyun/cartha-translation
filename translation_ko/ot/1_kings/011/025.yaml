id: 1KI.11.25
reference: 1 Kings 11:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֨י שָׂטָ֤ן לְ/יִשְׂרָאֵל֙ כָּל יְמֵ֣י שְׁלֹמֹ֔ה וְ/אֶת הָ/רָעָ֖ה אֲשֶׁ֣ר הֲדָ֑ד וַ/יָּ֨קָץ֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּמְלֹ֖ךְ עַל אֲרָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/025.yaml
  text: And he was an adversary to Israel all the days of Solomon[a], along with the harm that Hadad caused. And he loathed Israel and reigned over Aram.
  footnotes:
  - marker: a
    text: Or 'besides the evil/trouble that Hadad did.' The Hebrew phrase is elliptical and may mean that this adversary arose in addition to the harm caused by Hadad.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 솔로몬의 온 생애 동안 이스라엘의 대적이었으며, 하닷이 끼친 해악과 함께 이스라엘을 혐오하였고 아람을 다스렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 생략적이어서 ‘하닷이 끼친 해악과 함께’ 또는 ‘하닷이 끼친 해악 외에’처럼 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂטָן
  english_pob_choice: adversary
  chosen_korean: 대적
  alternatives_korean:
  - 적
  - 원수
  - 사탄
  lexicon: HALOT
  rationale: 이 문맥에서는 고유명사 ‘사탄’이 아니라 인간적·정치적 विरोध자를 가리키므로, 의미를 유지하면서도 오해를 피하는 ‘대적’이 적절합니다.
- source_word: וְאֶת הָרָעָה אֲשֶׁר הֲדָד
  english_pob_choice: along with the harm that Hadad caused
  chosen_korean: 하닷이 끼친 해악과 함께
  alternatives_korean:
  - 하닷이 행한 악과 더불어
  - 하닷이 끼친 재앙과 더불어
  - 하닷이 한 해악 외에
  lexicon: HALOT
  rationale: 히브리어 표현은 생략이 있는 난구로, 여기서 רָעָה는 도덕적 ‘악’보다 이스라엘에 가해진 ‘해악/재난’의 뜻이 더 자연스럽습니다. POB의 ‘along with’ 취지를 살려 덧붙음의 관계를 유지했습니다.
- source_word: וַיָּקָץ
  english_pob_choice: loathed
  chosen_korean: 혐오하였고
  alternatives_korean:
  - 몹시 싫어하였고
  - 역겨워하였고
  - 가증히 여겼고
  lexicon: HALOT
  rationale: 동사 קוץ는 단순한 반감보다 강한 혐오·경멸을 나타내므로, 현대 한국어에서 그 강도를 비교적 직접적으로 드러내는 ‘혐오하다’를 택했습니다.
- source_word: וַיִּמְלֹךְ עַל אֲרָם
  english_pob_choice: reigned over Aram
  chosen_korean: 아람을 다스렸고
  alternatives_korean:
  - 아람을 통치하였고
  - 아람의 왕이 되었고
  - 아람을 지배하였고
  lexicon: HALOT
  rationale: 말미의 왕권 서술을 자연스럽게 옮기되, 고유명사 ‘아람’을 유지했습니다. 한국어에서는 ‘reigned over’의 왕정적 의미를 ‘다스리다’로 간명하게 전달할 수 있습니다.
theological_decisions:
- issue: שָׂטָן을 ‘사탄’으로 볼지, 일반 명사로 볼지
  chosen_reading: 일반 명사적 ‘대적’으로 처리했습니다.
  alternative_readings:
  - 사탄
  - 대항자
  rationale: 문맥상 솔로몬 시대에 이스라엘에 맞선 역사적 적대 세력을 가리키므로, 후기 악령적 의미를 불필요하게 주입하지 않기 위해 일반 명사로 옮겼습니다.
  doctrine_reference: Translation philosophy §1 (원어 우선과 문맥 우선)
- issue: רָעָה의 의미를 도덕적 ‘악’이 아니라 피해·재난으로 볼지
  chosen_reading: 이스라엘에 가해진 ‘해악’으로 옮겼습니다.
  alternative_readings:
  - 악
  - 재앙
  - 고통
  rationale: 문맥은 윤리적 악이 아니라 하닷이 야기한 실제적 손해와 압박을 말하므로, 독자가 사건의 역사적 피해를 바로 이해하도록 했습니다.
  doctrine_reference: 원문 어휘의 문맥적 의미 보존
