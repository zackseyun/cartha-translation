id: 1KI.11.1
reference: 1 Kings 11:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה אָהַ֞ב נָשִׁ֧ים נָכְרִיּ֛וֹת רַבּ֖וֹת וְ/אֶת בַּת פַּרְעֹ֑ה מוֹאֲבִיּ֤וֹת עַמֳּנִיּוֹת֙ אֲדֹ֣מִיֹּ֔ת צֵדְנִיֹּ֖ת חִתִּיֹּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/001.yaml
  text: 'Now King Solomon loved many foreign women[a], including Pharaoh’s daughter: Moabite, Ammonite, Edomite, Sidonian, and Hittite women.'
  footnotes:
  - marker: a
    text: Or 'many foreign wives.' The Hebrew says 'many foreign women'; the context indicates these were women Solomon took in marriage or as consorts.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬 왕은 많은 이방 여자들, 곧 모압 여자들, 암몬 여자들, 에돔 여자들, 시돈 여자들, 헷 여자들과 파라오의 딸을 사랑했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 이방 아내들’. 히브리어는 ‘많은 이방 여자들’이라고 말하며, 문맥상 이들은 솔로몬이 아내 또는 후궁으로 맞이한 여자들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  english_pob_choice: Now King
  chosen_korean: 솔로몬 왕은
  alternatives_korean:
  - 그리고 왕은
  - 이제 왕은
  lexicon: HALOT
  rationale: 문맥 전개를 살리면서 히브리어의 접속적 흐름을 자연스러운 한국어 서술로 옮겼습니다.
- source_word: נָשִׁים נָכְרִיּוֹת רַבּוֹת
  english_pob_choice: many foreign women
  chosen_korean: 많은 이방 여자들
  alternatives_korean:
  - 많은 외국 여자들
  - 많은 이방 아내들
  lexicon: HALOT
  rationale: 원문의 핵심은 '여자들'이며, נָכְרִיּוֹת의 타자성은 한국어 성경 문맥에 맞는 '이방'으로 옮겼습니다. '아내들'은 문맥상 가능하지만 원문의 명사를 좁히므로 본문에서는 보류했습니다.
- source_word: וְאֶת בַּת פַּרְעֹה
  english_pob_choice: including Pharaoh’s daughter
  chosen_korean: 파라오의 딸과 더불어
  alternatives_korean:
  - 파라오의 딸을 포함하여
  - 그리고 파라오의 딸을
  lexicon: HALOT
  rationale: 접속 표지는 추가 정보를 덧붙이는 용법으로 보아, 파라오의 딸도 함께 포함됨을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: מוֹאֲבִיּוֹת עַמֳּנִיּוֹת אֲדֹמִיֹּת צֵדְנִיֹּת חִתִּיֹּת
  english_pob_choice: Moabite, Ammonite, Edomite, Sidonian, and Hittite women
  chosen_korean: 모압 여자, 암몬 여자, 에돔 여자, 시돈 여자, 헷 여자들
  alternatives_korean:
  - 모압 여인들, 암몬 여인들, 에돔 여인들, 시돈 여인들, 헷 여인들
  - 모압 사람 여자들, 암몬 사람 여자들, 에돔 사람 여자들, 시돈 사람 여자들, 헷 사람 여자들
  lexicon: HALOT
  rationale: 열거된 قوم칭 형용사를 한국어에서는 반복적인 '여자' 구문으로 옮겨 원문의 직설적 나열을 보존했습니다. '시돈'은 מקור의 구체성을 따라 '시돈 여자'로 유지했습니다.
theological_decisions:
- issue: נָשִׁים를 '아내들'로 좁힐지 여부
  chosen_reading: 본문은 '여자들'로 유지했습니다
  alternative_readings:
  - 아내들
  - 후궁들
  rationale: 히브리어는 실제로 '여자들'이라고 말하며, 문맥상 혼인 관계가 드러나더라도 본문 자체의 어휘를 좁히지 않는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 파라오의 딸이 '이방 여자들'에 포함되는지 여부
  chosen_reading: 포함되는 것으로 번역했습니다
  alternative_readings:
  - 별도의 범주로 분리
  - 단순 병렬
  rationale: 구문상 추가적 포함으로 읽는 것이 가장 자연스럽고, 뒤따르는 민족 목록이 그 이방성의 내용을 구체화합니다.
  doctrine_reference: Translation philosophy §1, §3
