base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/030.yaml
  text: Then Ahijah took hold of the new cloak that was on him and tore it into twelve pieces[a].
  footnotes:
  - marker: a
    text: Or 'which he was wearing.' The Hebrew literally says 'that was on him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아히야가 자기 몸에 걸친 새 겉옷을 잡아 찢어 열두 조각으로 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 입고 있던’. 히브리어는 문자적으로 ‘그 위에 있던’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  english_pob_choice: took hold of
  chosen_korean: 잡아
  alternatives_korean:
  - 붙잡아
  - 손을 대어
  lexicon: HALOT
  rationale: 물건을 손으로 붙드는 동작을 자연스럽게 옮기되, 지나친 폭력성을 띠는 표현은 피했습니다.
- source_word: שַׂלְמָה
  english_pob_choice: cloak
  chosen_korean: 겉옷
  alternatives_korean:
  - 외투
  - 망토
  lexicon: HALOT
  rationale: 이 단어는 바깥에 걸치는 옷을 가리키므로, 현대 한국어에서 읽기 쉬운 ‘겉옷’이 가장 무난합니다.
- source_word: הַחֲדָשָׁה
  english_pob_choice: new
  chosen_korean: 새
  alternatives_korean:
  - 새로운
  - 신선한
  lexicon: HALOT
  rationale: 의복의 상태를 직접적으로 나타내는 ‘새’가 간결하고 자연스럽습니다.
- source_word: אֲשֶׁר עָלָיו
  english_pob_choice: that was on him
  chosen_korean: 자기 몸에 걸친
  alternatives_korean:
  - 그에게 입혀진
  - 그가 입고 있던
  lexicon: HALOT
  rationale: 히브리어의 문자적 뉘앙스인 ‘그 위에 있었다’를 살리면서, 한국어에서는 옷을 입은 상태를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 열두 조각으로 찢는 상징적 행위의 보존
  chosen_reading: 단순한 파손이 아니라, 예언적 표징으로서 의도된 분할 행위를 드러내기 위해 동작과 결과를 함께 옮겼습니다.
  alternative_readings:
  - ‘열두 조각으로 찢었습니다’만 직역하기
  - ‘열두 토막으로 만들었습니다’로 완화하기
  rationale: 본문은 물리적 행위 자체보다 상징적 분열을 드러내므로, 행위와 결과를 모두 분명하게 표현하는 것이 문맥에 충실합니다.
  doctrine_reference: 왕상 11:29-31의 예언적 표징
- issue: ‘잡아 찢어’의 동사 결합
  chosen_reading: ‘잡아 찢어’로 연결해 손으로 붙잡은 뒤 찢는 순서를 보존했습니다.
  alternative_readings:
  - ‘붙잡아 갈기갈기 찢어’
  - ‘잡고 찢었습니다’
  rationale: 히브리어의 연속 동작을 한국어에서도 자연스럽게 재현하여 장면의 긴박함을 유지합니다.
  doctrine_reference: 서사적 동작 연쇄
