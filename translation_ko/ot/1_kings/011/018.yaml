source:
  edition: WLC
  text: וַ/יָּקֻ֨מוּ֙ מִ/מִּדְיָ֔ן וַ/יָּבֹ֖אוּ פָּארָ֑ן וַ/יִּקְחוּ֩ אֲנָשִׁ֨ים עִמָּ֜/ם מִ/פָּארָ֗ן וַ/יָּבֹ֤אוּ מִצְרַ֨יִם֙ אֶל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם וַ/יִּתֶּן ל֣/וֹ בַ֗יִת וְ/לֶ֨חֶם֙ אָ֣מַר ל֔/וֹ וְ/אֶ֖רֶץ נָ֥תַן לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/018.yaml
  text: They arose from Midian and came to Paran[a], and they took men with them from Paran, and they came to Egypt, to Pharaoh king of Egypt, and he gave him a house and assigned him food, and gave him land.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and bread he said to him'; the sense is that Pharaoh ordered or assigned provisions for him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 미디안에서 일어나 바란으로 갔고, 바란에서 사람들을 데리고 와서, 이집트로, 곧 이집트 왕 파라오에게 갔습니다. 파라오는 그에게 집을 주고, 먹을 것을 정해 주고, 땅도 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  english_pob_choice: they arose
  chosen_korean: 일어났고
  alternatives_korean:
  - 떠났고
  - 출발했고
  lexicon: HALOT
  rationale: קום의 기본 의미인 ‘일어나다’를 살리되, 여정 문맥에서 자연스럽게 이어지도록 합쇼체로 풀었습니다.
- source_word: מִדְיָן / פָּארָן / מִצְרַיִם / פַּרְעֹה
  english_pob_choice: Midian / Paran / Egypt / Pharaoh
  chosen_korean: 미디안 / 바란 / 이집트 / 파라오
  alternatives_korean:
  - 미디안 / 바란 / 애굽 / 바로
  lexicon: 고유명사 표기 관행
  rationale: 본문의 지명·인명은 현대 외래어 표기와 POB의 음역 원칙에 따라 옮겼습니다. ‘애굽’과 ‘바로’는 전통 교회 용례가 강하지만, 여기서는 원문에 더 직접적인 표기를 택했습니다.
- source_word: וְלֶחֶם אָמַר לוֹ
  english_pob_choice: assigned him food
  chosen_korean: 먹을 것을 정해 주고
  alternatives_korean:
  - 빵을 주고
  - 양식을 배정하고
  lexicon: HALOT
  rationale: 직역하면 ‘빵을 그에게 말했다’라는 관용구이므로, 파라오가 식량을 공식적으로 배정했다는 뜻을 살려 ‘먹을 것을 정해 주다’로 옮겼습니다.
- source_word: בַּיִת / אֶרֶץ
  english_pob_choice: a house / land
  chosen_korean: 집 / 땅
  alternatives_korean:
  - 거처 / 토지
  - 집 / 토지
  lexicon: HALOT
  rationale: 둘 다 일반적인 명사로서 과도하게 확장하지 않고, 서술의 단순함을 유지하기 위해 각각 ‘집’, ‘땅’으로 옮겼습니다.
theological_decisions:
- issue: 본문의 왕실 후원 행위 표현
  chosen_reading: 파라오가 그에게 집과 식량과 땅을 제공한 물질적 후원으로 읽었습니다.
  alternative_readings:
  - 정치적 망명 보호
  - 종속 관계의 암시
  rationale: 히브리어 동사들의 연쇄는 서술적으로 단순한 공급 행위를 가리키며, 본문만으로 더 강한 해석을 단정하지 않았습니다.
  doctrine_reference: 본문 주해 원칙
