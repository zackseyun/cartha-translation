  to: 그들은 미디안에서 떠나 바란에 이르렀습니다. 그들은 바란에서 사람들을 데리고 이집트로 가서 이집트 왕 파라오에게 이르렀습니다. 파라오는 그에게 집을 주고, 양식[a]을 정해 주고, 땅을 주었습니다.
