  source_fidelity: 전반적으로 이동 경로와 파라오의 지원 행위를 충실히 옮겼습니다. 다만 ‘바란에서 사람들을 데리고 와서’는 ‘와서’의 도착점이 불분명하고, 히브리어의 ‘바란에서 사람들을 데리고’라는 동반·합류의 뜻을 더 명료하게 표현할 필요가 있습니다. וְלֶחֶם אָמַר לוֹ는 직역이 어려운 관용적 행정 표현이므로, ‘양식을 정해 주고’와 주석을 통해 그 의미를 보존하는 것이 적절합니다.
  naturalness: ‘미디안에서 일어나 바란으로 갔고’는 한국어 여행 서술로 다소 부자연스럽습니다. ‘미디안에서 떠나 바란에 이르렀습니다’가 현대 표준어 합쇼체에서 자연스럽고 원문의 여정 기능도 충실히 전달합니다. 문장을 적절히 나누어 긴 이동 서술을 명료하게 했습니다.
  terminology: 미디안, 바란, 이집트, 파라오는 현대 한국어의 통용 표기이며 일관됩니다. בַּיִת와 אֶרֶץ는 각각 ‘집’, ‘땅’으로 유지했습니다. לֶחֶם은 여기서 단순한 빵보다 지급되는 식량·생계를 가리킬 수 있으므로 ‘양식’이 적절합니다.
