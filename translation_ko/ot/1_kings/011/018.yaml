  text: They arose from Midian and came to Paran[a], and they took men with them from Paran, and they came to Egypt, to Pharaoh king of Egypt, and he gave him a house and assigned him food, and gave him land.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and bread he said to him'; the sense is that Pharaoh ordered or assigned provisions for him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 미디안에서 떠나 바란에 이르렀습니다. 그들은 바란에서 사람들을 데리고 이집트로 가서 이집트 왕 파라오에게 이르렀습니다. 파라오는 그에게 집을 주고, 양식[a]을 정해 주고, 땅을 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘빵을 그에게 말했다’입니다. 여기서는 파라오가 그에게 줄 양식 또는 식량을 정해 주었다는 뜻입니다.
    reason: lexical_alternative
