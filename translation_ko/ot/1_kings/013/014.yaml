  to: 그래서 그는 하나님의 사람을 따라가서 그가 테레빈트나무[a] 아래에 앉아 있는 것을 발견하고, 그에게 말했습니다. “당신이 유다에서 온 하나님의 사람이십니까?” 그가 말했습니다. “그렇습니다.”
