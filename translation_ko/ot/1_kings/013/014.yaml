id: 1KI.13.14
reference: 1 Kings 13:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ אַֽחֲרֵי֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים וַ/יִּ֨מְצָאֵ֔/הוּ יֹשֵׁ֖ב תַּ֣חַת הָ/אֵלָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו הַ/אַתָּ֧ה אִישׁ הָ/אֱלֹהִ֛ים אֲשֶׁר בָּ֥אתָ מִֽ/יהוּדָ֖ה וַ/יֹּ֥אמֶר אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/014.yaml
  text: So he went after the man of God and found him sitting under the terebinth[a], and he said to him, “Are you the man of God who came from Judah?” And he said, “I am.”
  footnotes:
  - marker: a
    text: Or “under the oak.” The Hebrew אֵלָה more specifically refers to a terebinth tree.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그는 하나님의 사람을 따라가서 그가 테레빈트나무[a] 아래에 앉아 있는 것을 발견하고, 그에게 말했습니다. “당신이 유다에서 온 하나님의 사람이십니까?” 그가 말했습니다. “그렇습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “떡갈나무 아래.” 히브리어 אֵלָה는 더 구체적으로 테레빈트나무를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אַחֲרֵי
  english_pob_choice: went after
  chosen_korean: 따라가서
  alternatives_korean:
  - 뒤따라가서
  - 쫓아가서
  lexicon: HALOT
  rationale: 문맥상 한 사람을 뒤쫓아 가는 동작이므로 자연스러운 현대 한국어로 ‘따라가서’가 가장 간결하고 직역성을 유지합니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 선지자
  - 하나님의 남자
  lexicon: HALOT
  rationale: 히브리어의 관용적 칭호를 그대로 옮겨야 하므로, POB의 ‘man of God’에 맞춰 ‘하나님의 사람’을 유지합니다.
- source_word: תַּחַת הָאֵלָה
  english_pob_choice: under the terebinth
  chosen_korean: 떡갈나무 아래
  alternatives_korean:
  - 테레빈트나무 아래
  - 상수리나무 아래
  lexicon: HALOT
  rationale: אֵלָה는 엄밀히는 테레빈트 계열 나무를 가리키지만, 한국어 독자에게는 ‘떡갈나무’가 기능적으로 자연스러운 대응어이며 본문의 장면을 무리 없이 전달합니다.
- source_word: אָֽנִי
  english_pob_choice: I am
  chosen_korean: 저입니다
  alternatives_korean:
  - 제가 그렇습니다
  - 저예요
  lexicon: HALOT
  rationale: 히브리어의 간명한 대답을 한국어 대화체로 자연스럽게 옮기되, 고백적 뉘앙스를 살리기 위해 ‘저입니다’로 렌더링합니다.
theological_decisions:
- issue: 유다에서 온 인물의 정체를 묻는 직접화법의 공손도
  chosen_reading: “당신이 … 이십니까?”로 공손한 직접 질문을 유지했습니다.
  alternative_readings:
  - “네가 … 이냐?”
  - “당신은 … 입니까?”
  rationale: 화자가 낯선 상대를 식별하는 장면이므로 현대 한국어에서 자연스러운 존대형 질문을 사용해, 원문의 직접대화를 보존하면서도 문체를 합쇼체로 맞췄습니다.
  doctrine_reference: 문체 일관성 및 직접화법 보존
- issue: 자기응답 ‘I am’의 처리
  chosen_reading: ‘저입니다’로 짧은 자기확인을 살렸습니다.
  alternative_readings:
  - ‘내가 그렇습니다’
  - ‘저는 그 사람입니다’
  rationale: 히브리어의 축약된 응답은 단순한 자기식별이므로, 과잉 해설 없이 간명한 한국어로 옮기는 것이 본문 강도를 가장 잘 보존합니다.
  doctrine_reference: 직역-의미 보존 원칙
