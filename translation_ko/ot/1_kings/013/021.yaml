source:
  edition: WLC
  text: וַ/יִּקְרָ֞א אֶל אִ֣ישׁ הָ/אֱלֹהִ֗ים אֲשֶׁר בָּ֤א מִֽ/יהוּדָה֙ לֵ/אמֹ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה יַ֗עַן כִּ֤י מָרִ֨יתָ֙ פִּ֣י יְהוָ֔ה וְ/לֹ֤א שָׁמַ֨רְתָּ֙ אֶת הַ/מִּצְוָ֔ה אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/021.yaml
  text: 'And he cried out to the man of God who had come from Judah[a], saying, “Thus says Yahweh: Because you have rebelled against the word of Yahweh and have not kept the command that Yahweh your God commanded you,”'
  footnotes:
  - marker: a
    text: Literally, 'you have rebelled against the mouth of the LORD,' an idiom meaning against what the LORD spoke.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 유다에서 온 하나님의 사람에게 소리쳐 말했습니다. 「야훼께서 이렇게 말씀하십니다. 네가 야훼의 말씀을 거역하고, 야훼 너의 하나님의 명령을 지키지 않았으므로」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야훼의 입’을 뜻하는 관용구로, 여기서는 야훼께서 말씀하신 내용을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: he cried out
  chosen_korean: 소리쳐 말했습니다
  alternatives_korean:
  - 불렀습니다
  - 외쳤습니다
  - 소리쳤습니다
  lexicon: HALOT
  rationale: 공개적이고 강한 꾸짖음의 맥락이므로 단순한 ‘말하다’보다 강한 발화를 살리되, 현대 한국어에서 자연스럽게 읽히도록 ‘소리쳐 말했습니다’로 옮겼습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 하나님의 예언자
  lexicon: HALOT
  rationale: 히브리어의 직함을 비교적 직설적으로 보존하되, 한국어 성경에서 널리 이해되는 표현인 ‘하나님의 사람’을 택했습니다.
- source_word: פִּי יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 입
  - 야훼의 말씀하심
  lexicon: HALOT
  rationale: 직역하면 ‘야훼의 입’이지만, 이는 히브리어 관용구이므로 한국어에서는 의미를 살린 관용적 대응인 ‘말씀’으로 옮겼습니다.
- source_word: מִצְוָה / צִוְּךָ
  english_pob_choice: the command ... commanded you
  chosen_korean: 명령을 지키지 않았으므로
  alternatives_korean:
  - 명령을 지키지 않았으므로
  - 명령을 준행하지 않았으므로
  - 명령을 따르지 않았으므로
  lexicon: HALOT
  rationale: 단수형 ‘명령’의 강도와 צוה의 직접성을 살리면서, שׁמר의 의미는 ‘지키다’로 옮겨 언약적 불순종의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 테트라그람마톤을 직접 사용하므로, POB 기준에 따라 고유신명인 ‘야훼’를 유지해 인용 화자의 신적 권위를 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
