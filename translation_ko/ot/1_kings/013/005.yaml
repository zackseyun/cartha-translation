id: 1KI.13.5
reference: 1 Kings 13:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/מִּזְבֵּ֣חַ נִקְרָ֔ע וַ/יִּשָּׁפֵ֥ךְ הַ/דֶּ֖שֶׁן מִן הַ/מִּזְבֵּ֑חַ כַּ/מּוֹפֵ֗ת אֲשֶׁ֥ר נָתַ֛ן אִ֥ישׁ הָ/אֱלֹהִ֖ים בִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/005.yaml
  text: And the altar was torn apart[a], and the ashes were poured out from the altar, according to the sign that the man of God had given by the word of Yahweh.
  footnotes:
  - marker: a
    text: Or 'as the sign' or 'in accordance with the wonder/portent.' The Hebrew מוֹפֵת can denote a sign, wonder, or portent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제단이 갈라지고, 그 제단에서 재가 쏟아져 나왔습니다. 이는 하나님의 사람이 야훼의 말씀으로 제시한 표징[a]대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘표징에 따라’, ‘이적에 따라’, ‘징조에 따라’로도 옮길 수 있습니다. 히브리어 מוֹפֵת는 표징, 이적, 징조를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מִּזְבֵּ֣חַ
  english_pob_choice: the altar
  chosen_korean: 제단
  alternatives_korean:
  - 제단
  - 희생 제단
  lexicon: HALOT
  rationale: מִזְבֵּחַ는 예배·제의 맥락에서 기본적으로 '제단'이 자연스럽고, 여기서도 과도한 설명 없이 충분히 의미가 전달됩니다.
- source_word: נִקְרָע
  english_pob_choice: was torn apart
  chosen_korean: 찢어지고
  alternatives_korean:
  - 갈라지고
  - 찢어졌습니다
  lexicon: HALOT
  rationale: 수동 완료의 결과를 한국어에서 자연스럽게 살리기 위해 '찢어지고'로 옮겼습니다. 단순한 상태 묘사보다 사건성을 살립니다.
- source_word: הַ/דֶּ֖שֶׁן
  english_pob_choice: the ashes
  chosen_korean: 재
  alternatives_korean:
  - 재
  - 재더미
  lexicon: HALOT
  rationale: 제단 문맥의 דֶּשֶׁן은 제물의 잔재로서 '재'가 가장 자연스럽고 명료합니다. '재더미'는 원문의 단수·집합성을 불필요하게 덧붙입니다.
- source_word: כַּ/מּוֹפֵ֗ת
  english_pob_choice: according to the sign
  chosen_korean: 표징대로
  alternatives_korean:
  - 표징에 따라
  - 이적대로
  - 징조대로
  lexicon: HALOT
  rationale: מוֹפֵת는 '표징/이적/징조'의 범위를 가지지만, 여기서는 하나님이 하신 말씀의 성취를 가리키므로 '표징'이 가장 균형 잡힌 선택입니다. '-대로'는 כְּ의 부합·일치 의미를 잘 드러냅니다.
- source_word: בִּ/דְבַ֥ר יְהוָֽה
  english_pob_choice: by the word of Yahweh
  chosen_korean: 야훼의 말씀으로
  alternatives_korean:
  - 야훼의 말씀에 따라
  - 야훼의 말씀으로
  lexicon: HALOT
  rationale: דָּבָר는 여기서 단순한 '말'보다 권위 있는 선언/말씀의 뜻이므로 '말씀'이 적절합니다. יְהוָה는 본 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼로 음역해 하나님의 고유한 언약 სახელ을 보존했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신명기적·예언적 공식으로 여호와/야훼의 고유 이름을 직접 사용하므로, 본 프로젝트 기준에 따라 '야훼'를 유지하는 것이 원문 가시성을 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אִישׁ הָאֱלֹהִים의 칭호
  chosen_reading: 직함성 있는 '하나님의 사람'으로 옮겼습니다.
  alternative_readings:
  - 하나님의 선지자
  - 하나님의 예언자
  rationale: 본문은 예언 기능을 전제하지만 직함 자체는 '하나님의 사람'이라는 전통적 히브리어 표현을 유지하는 것이 더 직접적입니다.
  doctrine_reference: 용어 직역 원칙
