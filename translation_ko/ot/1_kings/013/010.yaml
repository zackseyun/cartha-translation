  text: So he went by another way and did not return by the way he had come to Bethel.
translation:
  language: ko
  text: 그는 다른 길로 가고, 벧엘로 올 때 왔던 그 길로는 돌아오지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: So he went
  chosen_korean: 그는 … 가고
  alternatives_korean:
  - 그리고 그는 갔습니다
  - 그러자 그는 갔습니다
  lexicon: HALOT
  rationale: 서사 진행을 살리면서 한국어에서는 자연스럽게 연결되는 현재형 서술 ‘가고’를 써서 다음 동작과 이어지게 했습니다.
- source_word: בְּדֶרֶךְ אַחֵר
  english_pob_choice: by another way
  chosen_korean: 다른 길로
  alternatives_korean:
  - 다른 경로로
  - 다른 노선으로
  lexicon: HALOT
  rationale: דֶּרֶךְ는 문맥상 ‘길/경로’를 뜻하므로, 여행 대비를 분명히 하는 가장 직접적인 표현으로 옮겼습니다.
- source_word: וְלֹא שָׁב
  english_pob_choice: and did not return
  chosen_korean: 돌아오지 않았습니다
  alternatives_korean:
  - 되돌아가지 않았습니다
  - 다시 오지 않았습니다
  lexicon: HALOT
  rationale: שׁוּב의 핵심 의미인 ‘되돌아오다/돌아가다’를 한국어의 자연스러운 부정 과거로 옮겼습니다.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָהּ
  english_pob_choice: by the way he had come
  chosen_korean: 올 때 왔던 그 길로는
  alternatives_korean:
  - 그가 왔던 길로는
  - 오던 길로는
  lexicon: HALOT
  rationale: 원문의 ‘그가 왔던 길’이라는 대조를 살리되, 이미 지난 이동을 분명히 하기 위해 ‘올 때’와 ‘왔던’의 중첩을 사용했습니다.
