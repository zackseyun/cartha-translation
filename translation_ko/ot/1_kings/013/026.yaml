  source_fidelity: 전반적인 의미는 잘 보존했으나, 첫 수식어 ‘그를 길에서 되돌려 온 예언자’는 예언자 자신이 되돌아왔다는 뜻으로 읽힐 수 있어 히브리어 사역형(그를 돌아오게 한)을 분명히 해야 합니다. 또한 וַיִּשְׁבְּרֵהוּ와 וַיְמִתֵהוּ의 연속 동작을 한국어 본문에서도 가능한 한 드러내는 편이 좋습니다.
  naturalness: ‘그는 하나님의 사람입니다. 곧 … 자입니다’는 다소 부자연스럽고 단절되어 들립니다. ‘그는 야훼의 말씀을 거역한 하나님의 사람입니다’로 한 문장에 묶으면 자연스럽습니다. 각주 표지도 해당 표현 바로 뒤에 두는 것이 독자의 이해에 적절합니다.
  terminology: ‘야훼’, ‘하나님의 사람’, ‘사자’는 일관되고 적절합니다. פִּי יְהוָה는 한국어 관용상 ‘야훼의 말씀’으로 옮길 수 있으나, ‘반역하다’보다 ‘말씀을 거역하다’가 목적어 결합 및 히브리어 의미에 더 자연스럽습니다.
  issues:
