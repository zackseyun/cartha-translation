  to: 그 소식을 들은, 그를 길에서 돌아오게 한 예언자가 말했습니다. “그는 야훼의 말씀[a]을 거역한 하나님의 사람입니다. 그러므로 야훼께서 그를 사자에게 넘기셨고, 사자가 그를 찢고 죽였습니다. 이는 야훼께서 그에게 말씀하신 대로였습니다.”
  rationale: 사역형 ‘그를 돌아오게 한’을 명확히 하고, ‘말씀을 거역한’으로 현대 한국어의 자연스러운 결합을 사용했습니다. 사자의 공격과 죽음이라는 연속 동작을 유지했으며, 관용구 설명 각주를 해당 번역어에 직접 연결했습니다. 야훼라는 신명 표기와 하나님의 사람이라는 서술적 호칭은 유지했습니다.
