  edition: WLC
  text: וַ/יִּשְׁמַ֣ע הַ/נָּבִיא֮ אֲשֶׁ֣ר הֱשִׁיב֣/וֹ מִן הַ/דֶּרֶךְ֒ וַ/יֹּ֨אמֶר֙ אִ֣ישׁ הָ/אֱלֹהִ֣ים ה֔וּא אֲשֶׁ֥ר מָרָ֖ה אֶת פִּ֣י יְהוָ֑ה וַ/יִּתְּנֵ֨/הוּ יְהוָ֜ה לָ/אַרְיֵ֗ה וַֽ/יִּשְׁבְּרֵ֨/הוּ֙ וַ/יְמִתֵ֔/הוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֶּר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/026.yaml
  text: When the prophet who had brought him back from the way heard it[a], he said, “It is the man of God who rebelled against the word of Yahweh; therefore Yahweh gave him to the lion, and it mauled him and killed him, according to the word of Yahweh that he spoke to him.”
  footnotes:
  - marker: a
    text: Or “rebelled against the command of the LORD” or “defied the word of the LORD.” The Hebrew literally says “rebelled against the mouth of the LORD.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그 소식을 들은 그를 길에서 되돌려 온 예언자가 말했습니다. “그는 하나님의 사람입니다. 곧 야훼의 말씀에 반역한 자입니다. 그래서 야훼께서 그를 사자에게 넘기셨고, 그 사자가 그를 찢어 죽였으니, 이는 야훼께서 그에게 말씀하신 그대로입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “야훼의 입”입니다. 여기서는 히브리어 관용구의 의미를 따라 “야훼의 말씀”으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא אֲשֶׁר הֱשִׁיבוֹ מִן הַדֶּרֶךְ
  english_pob_choice: the prophet who had brought him back from the way
  chosen_korean: 그를 길에서 되돌려 온 예언자
  alternatives_korean:
  - 그를 길에서 돌이켜 온 예언자
  - 그를 길에서 돌아오게 한 예언자
  lexicon: HALOT
  rationale: הֱשִׁיבוֹ는 ‘돌이키다/되돌리다’의 사역형으로, 길(דֶּרֶךְ)을 따라가던 사람을 다시 돌아오게 한 뜻을 살렸습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 하나님의 사람
  lexicon: HALOT
  rationale: 이 표현은 예언자적 호칭으로 쓰이므로, 한국어에서도 직함처럼 기능하는 ‘하나님의 사람’을 유지했습니다.
- source_word: מָרָה אֶת פִּי יְהוָה
  english_pob_choice: rebelled against the mouth of Yahweh
  chosen_korean: 야훼의 말씀에 반역한
  alternatives_korean:
  - 야훼의 입에 거역한
  - 야훼의 명령을 거역한
  - 야훼의 말씀을 거스른
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘야훼의 입’이지만, 한국어 본문에서는 의미가 분명한 ‘말씀’으로 풀어 주되 ‘반역한’으로 מרה의 강한 반항성을 보존했습니다.
- source_word: וַיִּתְּנֵהוּ יְהוָה לָאַרְיֵה
  english_pob_choice: Yahweh gave him to the lion
  chosen_korean: 야훼께서 그를 사자에게 넘기셨고
  alternatives_korean:
  - 야훼께서 그를 사자에게 주셨고
  - 야훼께서 그를 사자 손에 넘기셨고
  lexicon: HALOT
  rationale: נתן + ל는 단순히 ‘주다’보다 심판적 ‘넘기다/내주다’가 자연스럽고 문맥에 맞습니다.
- source_word: וַיִּשְׁבְּרֵהוּ
  english_pob_choice: it mauled him
  chosen_korean: 그 사자가 그를 찢어 죽였으니
  alternatives_korean:
  - 그 사자가 그를 상하게 했고
  - 그 사자가 그를 부러뜨렸고
  lexicon: HALOT
  rationale: שבר는 문자적으로 ‘부수다/부러뜨리다’지만, 사자가 주어인 문맥에서는 치명적 공격을 뜻하므로 한국어에서 자연스러운 ‘찢어 죽이다’로 옮겼습니다.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֶּר לוֹ
  english_pob_choice: according to the word of Yahweh that he spoke to him
  chosen_korean: 이는 야훼께서 그에게 말씀하신 그대로입니다
  alternatives_korean:
  - 야훼의 말씀대로입니다
  - 야훼께서 그에게 하신 말씀대로입니다
  lexicon: HALOT
  rationale: 결말의 성취 공식을 한국어에서 간결하게 살리기 위해 ‘말씀하신 그대로’로 번역해, 앞선 경고가 실제로 이행되었음을 분명히 했습니다.
theological_decisions:
- issue: יהוה(YHWH)의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - the LORD(의미역)
  rationale: 본문이 여호와 신앙의 고유명사인 יהוה를 직접 사용하므로, POB 기준에 따라 ‘야훼’로 음역해 언약적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: פִּי יְהוָה의 관용구 처리
  chosen_reading: 야훼의 말씀에
  alternative_readings:
  - 야훼의 입에
  - 야훼의 명령에
  rationale: ‘입’의 직역은 히브리어의 구체성을 드러내지만 한국어에서는 의미가 더 직접적인 ‘말씀’이 전달력을 높이며, 본문의 반역성이 약화되지 않도록 ‘반역한’으로 보완했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §5
