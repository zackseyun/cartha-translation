  source_fidelity: 전반적으로 시체가 길에 던져져 있고 사자가 그 곁에 서 있는 장면과, 사람들이 이를 성에서 알린 뒤 그 성에 늙은 예언자가 거주한다는 내용을 충실히 반영합니다. 다만 וַיָּבֹאוּ וַיְדַבְּרוּ בָעִיר의 순서와 공간 관계는 ‘성으로 가서 … 거기에는’보다 ‘그 성에 와서’로 연결하는 편이 더 직접적입니다.
