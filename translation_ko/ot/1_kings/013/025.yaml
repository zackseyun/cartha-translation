source:
  edition: WLC
  text: וְ/הִנֵּ֧ה אֲנָשִׁ֣ים עֹבְרִ֗ים וַ/יִּרְא֤וּ אֶת הַ/נְּבֵלָה֙ מֻשְׁלֶ֣כֶת בַּ/דֶּ֔רֶךְ וְ/אֶת הָ֣/אַרְיֵ֔ה עֹמֵ֖ד אֵ֣צֶל הַ/נְּבֵלָ֑ה וַ/יָּבֹ֨אוּ֙ וַ/יְדַבְּר֣וּ בָ/עִ֔יר אֲשֶׁ֛ר הַ/נָּבִ֥יא הַ/זָּקֵ֖ן יֹשֵׁ֥ב בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/025.yaml
  text: And behold[a], men were passing by and saw the corpse thrown on the road, and the lion standing beside the corpse; and they came and reported it in the city where the old prophet lived.
  footnotes:
  - marker: a
    text: Or 'spoke of it in the city.' The Hebrew verb is simply 'spoke,' but in context it refers to reporting the incident.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 사람들이 지나가다가 길에 던져진 시체와 그 시체 곁에 서 있는 사자를 보았습니다. 그들은 늙은 예언자가 살고 있는 성에 와서 그 일을 알렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 일을 알렸습니다’는 히브리어의 단순히 ‘말하다’를 문맥에 따라 사건을 보고하거나 전달하는 뜻으로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제 보십시오
  lexicon: HALOT
  rationale: 서사 전환의 주의 환기 표현을 살리되, 한국어에서는 장황한 '그리고 보라'보다 자연스러운 감탄·주의 환기형으로 옮겼습니다.
- source_word: אֲנָשִׁים עֹבְרִים
  english_pob_choice: men were passing by
  chosen_korean: 사람들이 지나가다가
  alternatives_korean:
  - 남자들이 지나가다가
  - 사람들이 지나갔습니다
  lexicon: HALOT
  rationale: 히브리어 복수 명사와 진행 중인 동작을 반영하되, 한국어에서는 성별 표지가 두드러지지 않게 '사람들'로 자연스럽게 처리했습니다.
- source_word: וַיְדַבְּרוּ בָעִיר
  english_pob_choice: and reported it in the city
  chosen_korean: 그 소식을 전했는데
  alternatives_korean:
  - 그 일을 성에서 말했는데
  - 성에서 그 일을 알렸는데
  lexicon: HALOT
  rationale: דבר의 기본값 '말하다'보다 문맥상 사건 전달·보고의 의미가 분명하므로, 한국어에서는 '소식을 전하다'로 옮겨 보고의 뉘앙스를 살렸습니다.
- source_word: הַנָּבִיא הַזָּקֵן יֹשֵׁב בָּהּ
  english_pob_choice: where the old prophet lived
  chosen_korean: 늙은 예언자가 살고 있었습니다
  alternatives_korean:
  - 늙은 예언자가 거주하고 있었습니다
  - 늙은 예언자가 거기 살았습니다
  lexicon: HALOT
  rationale: יֹשֵׁב with בָּהּ의 거주 의미를 한국어의 '살다'로 자연스럽게 반영했고, הַזָּקֵן은 단순한 연령 묘사로 '늙은'을 택했습니다.
theological_decisions:
- issue: 사자와 시체의 병치가 주는 서술 효과
  chosen_reading: 사자는 시체 곁에 서 있는 상태로 유지되며, 이는 야훼의 심판이 사건 현장에서 멈춰 있음을 보여 주는 서사적 표지로 옮겼습니다.
  alternative_readings:
  - 사자가 시체를 지키고 있었습니다
  - 사자가 시체 옆에 있었습니다
  rationale: 히브리어의 단순한 위치 묘사를 과도하게 해석하지 않으면서도, 현장에 남은 사자의 기이함을 한국어에서 분명히 드러내기 위함입니다.
  doctrine_reference: 서사 본문 해석 원칙
