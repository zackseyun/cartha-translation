- from: 보십시오, 사람들이 지나가다가 길에 던져진 시체와 그 시체 곁에 서 있는 사자를 보았습니다. 그들은 성으로 가서 그 소식을 전했는데, 거기에는 늙은 예언자가 살고 있었습니다.[a]
  to: 보십시오, 사람들이 지나가다가 길에 던져진 시체와 그 시체 곁에 서 있는 사자를 보았습니다. 그들은 늙은 예언자가 살고 있는 성에 와서 그 일을 알렸습니다.[a]
  rationale: 원문의 ‘와서 성에서 말하였다’와 ‘늙은 예언자가 그 성에 살고 있었다’의 연결을 한국어 관계절로 명료하게 반영했습니다. ‘그 일’은 원문에 명시되지 않은 목적어를 문맥상 최소한으로 보완하며, 각주는 해당 번역어에 직접 연결했습니다.
