review_pass:
  verdict: revise
  source_fidelity: ‘가져왔습니다’는 וַיְשִׁיבֵהוּ(‘되돌려 오게 하다/데리고 돌아오다’)의 ‘되돌림’ 의미를 충분히 나타내지 못합니다. 또한 לִסְפֹּד וּלְקָבְרוֹ는 실제 행위를 단순히 의도한 것으로 제한하기보다 목적을 나타내므로 ‘하려고 했습니다’보다 ‘하기 위해’가 적절합니다.
  naturalness: ‘나이 든 예언자’는 연령을 가리키는 הַזָּקֵן을 현대 표준어에서 중립적이고 자연스럽게 옮깁니다. 문장을 둘로 나누고 목적구를 앞세워 합쇼체 서술로 자연스럽게 다듬었습니다.
  terminology: ‘하나님의 사람’, ‘예언자’, ‘나귀’, ‘주검’, ‘장사하다’는 본문의 관용적 호칭과 장례 맥락을 적절히 보존합니다. 각주 표지는 애도의 대안 번역이 해당하는 ‘애도’에 붙여야 합니다.
  issues:
  - severity: medium
    issue: ‘가져왔습니다’에 ‘되돌려’의 의미가 없음
    rationale: שוב Hiphil은 여기서 주검을 다시 데리고 돌아온 행위를 뜻하므로, 단순한 운반을 뜻하는 ‘가져왔습니다’보다 ‘되돌아왔습니다’가 원문의 방향성을 보존합니다.
  - severity: medium
    issue: ‘장사하려고 했습니다’가 목적 표현을 의도·미완료로 한정함
    rationale: לִסְפֹּד וּלְקָבְרוֹ는 성읍에 온 목적을 나타냅니다. ‘애도하고 장사하기 위해’가 원문의 용법을 더 직접적으로 반영합니다.
  - severity: medium
    issue: 각주 표지가 무관한 ‘가져왔습니다’에 붙어 있음
    rationale: 각주의 내용은 ספד의 ‘애곡하다’라는 어휘적 대안에 관한 것이므로 ‘애도’에 표지를 붙여야 합니다.
  - severity: low
    issue: ‘늙은 예언자’의 어감
    rationale: 원문은 직분이 아니라 나이를 수식하지만, 현대 한국어에서 ‘늙은’은 불필요하게 거친 어감을 줄 수 있어 ‘나이 든’이 자연스럽고 의미도 정확합니다.
  revised_text: 그러자 그 예언자는 하나님의 사람의 주검을 들어 나귀 위에 싣고 되돌아왔습니다. 그리고 그를 애도[a]하고 장사하기 위해 그 나이 든 예언자의 성읍으로 왔습니다.
  revised_footnotes:
