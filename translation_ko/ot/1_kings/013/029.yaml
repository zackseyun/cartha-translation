revisions:
- from: 그러자 그 예언자가 하나님의 사람의 시체를 들어 나귀 위에 싣고 가져왔습니다[a]. 그리고 그는 그 늙은 예언자의 성읍에 가서 그를 애도하고 장사하려고 했습니다.
  to: 그러자 그 예언자는 하나님의 사람의 주검을 들어 나귀 위에 싣고 되돌아왔습니다. 그리고 그를 애도[a]하고 장사하기 위해 그 나이 든 예언자의 성읍으로 왔습니다.
  rationale: 되돌아옴의 의미와 목적을 나타내는 부정사 용법을 보존하고, 각주 표지를 해당 어휘에 바로 연결했습니다. ‘나이 든 예언자’로 현대적이고 중립적인 문체를 유지했습니다.
  reviewer_model: gpt-5.6-terra
