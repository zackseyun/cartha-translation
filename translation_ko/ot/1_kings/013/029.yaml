id: 1KI.13.29
reference: 1 Kings 13:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א הַ/נָּבִ֜יא אֶת נִבְלַ֧ת אִישׁ הָ/אֱלֹהִ֛ים וַ/יַּנִּחֵ֥/הוּ אֶֽל הַ/חֲמ֖וֹר וַ/יְשִׁיבֵ֑/הוּ וַ/יָּבֹ֗א אֶל עִיר֙ הַ/נָּבִ֣יא הַ/זָּקֵ֔ן לִ/סְפֹּ֖ד וּ/לְ/קָבְרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/029.yaml
  text: Then the prophet lifted up the corpse of the man of God and laid it on the donkey and brought it back[a]. And he came to the city of the old prophet to mourn and to bury him.
  footnotes:
  - marker: a
    text: Or 'to lament and to bury him.' The Hebrew verb for mourning can specifically denote funeral lamentation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그 예언자가 하나님의 사람의 시체를 들어 나귀 위에 싣고 가져왔습니다[a]. 그리고 그는 그 늙은 예언자의 성읍에 가서 그를 애도하고 장사하려고 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘애도하고 그를 장사하려고 했습니다.’ 히브리어 동사는 장례식의 애곡을 특별히 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  english_pob_choice: lifted up
  chosen_korean: 들어
  alternatives_korean:
  - 들고
  - 옮겨
  lexicon: HALOT נשא
  rationale: 시체를 실제로 들어 올리는 구체적 동작을 살리면서, 뒤의 운반 동작들과 자연스럽게 이어지게 했습니다.
- source_word: נִבְלַת
  english_pob_choice: the corpse
  chosen_korean: 시체
  alternatives_korean:
  - 몸
  - 주검
  lexicon: HALOT נבלה
  rationale: 죽은 몸을 가리키는 표현으로서 의미를 분명히 하고, 너무 완곡하지 않게 처리했습니다.
- source_word: וַיַּנִּחֵהוּ אֶל הַחֲמוֹר
  english_pob_choice: laid it on the donkey
  chosen_korean: 나귀 위에 싣고
  alternatives_korean:
  - 나귀 위에 놓고
  - 나귀에 실어
  lexicon: HALOT נוח Hiphil
  rationale: ‘두다/놓다’보다 운반을 위한 배치를 분명히 드러내는 한국어 표현을 택했습니다.
- source_word: וַיְשִׁיבֵהוּ
  english_pob_choice: brought him back
  chosen_korean: 가져왔습니다
  alternatives_korean:
  - 되돌려 왔습니다
  - 돌아오게 했습니다
  lexicon: HALOT שוב Hiphil
  rationale: 앞의 ‘시체’와 호응하도록 자연스러운 서술을 택했으며, ‘되돌려’보다 운반의 결과를 간명하게 드러냅니다.
- source_word: לִסְפֹּד וּלְקָבְרֹו
  english_pob_choice: to mourn and to bury him
  chosen_korean: 애도하고 장사하려고 했습니다
  alternatives_korean:
  - 슬퍼하고 묻으려고 했습니다
  - 애곡하고 장사하려고 했습니다
  lexicon: HALOT ספד, קבר
  rationale: ספד의 장례적 애도 의미를 ‘애도하다’로 살리고, קבר는 성경적·자연스러운 ‘장사하다’로 옮겼습니다.
theological_decisions:
- issue: 성경 내 인물 호칭에서 ‘man of God’의 처리
  chosen_reading: 하나님의 사람
  alternative_readings:
  - 하나님 사람
  - 하나님의 종
  rationale: 예언자적 소명을 가리키는 관용 표현을 유지해 본문의 인물을 분명히 드러냈습니다.
  doctrine_reference: 서술적 호칭의 보존
- issue: ‘old prophet’의 번역
  chosen_reading: 늙은 예언자
  alternative_readings:
  - 늙은 선지자
  - 나이 든 예언자
  rationale: 연령을 나타내는 형용사로 읽히는 문맥을 반영해 직역했고, 직함화하지 않았습니다.
  doctrine_reference: 문맥적 수식어 처리
