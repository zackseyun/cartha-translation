  - 야훼의 말씀을 따라
  lexicon: HALOT
  rationale: בְּדַבַר는 수단/권위의 근거를 나타내므로 '말씀으로'가 간결하게 그 의미를 드러냅니다.
- source_word: עַל הַמִּזְבֵּחַ
  english_pob_choice: by the altar
  chosen_korean: 제단 곁에
  alternatives_korean:
