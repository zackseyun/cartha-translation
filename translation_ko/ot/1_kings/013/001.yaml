  text: וְ/הִנֵּ֣ה אִ֣ישׁ אֱלֹהִ֗ים בָּ֧א מִ/יהוּדָ֛ה בִּ/דְבַ֥ר יְהוָ֖ה אֶל בֵּֽית אֵ֑ל וְ/יָרָבְעָ֛ם עֹמֵ֥ד עַל הַ/מִּזְבֵּ֖חַ לְ/הַקְטִֽיר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/001.yaml
  text: And behold[a], a man of God came from Judah to Bethel by the word of Yahweh[b], while Jeroboam was standing by the altar to burn incense.
  footnotes:
  - marker: a
    text: Or, 'at the word of the LORD' or 'according to the word of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'and Jeroboam was standing at the altar.' The Hebrew conjunction can be read simply as 'and,' and 'by the altar' may also be rendered 'at the altar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 하나님의 사람이 유다에서 야훼의 말씀으로 베델에 왔는데, 여로보암은 제단 곁에 서서 분향하고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼의 말씀에 따라”, “야훼의 말씀을 따라”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “제단에” 또는 “제단 위에”로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 사건의 급작스러운 전환과 주목 환기 기능을 살리면서, 현대 한국어에서 자연스럽게 읽히는 감탄적 지시로 옮겼습니다.
- source_word: אִישׁ אֱלֹהִים
  english_pob_choice: a man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 예언자
  lexicon: HALOT
  rationale: 본문의 직역성은 유지하되 한국어 성경에서 익숙한 관용을 살려 'man of God'의 식별 표지를 전달했습니다.
- source_word: בִּדְבַר יְהוָה
  english_pob_choice: by the word of Yahweh
  chosen_korean: 야훼의 말씀으로
  alternatives_korean:
  - 야훼의 말씀에 따라
  - 야훼의 말씀을 따라
  lexicon: HALOT
  rationale: בְּדַבַר는 수단/권위의 근거를 나타내므로 '말씀으로'가 간결하게 그 의미를 드러냅니다.
- source_word: עַל הַמִּזְבֵּחַ
  english_pob_choice: by the altar
  chosen_korean: 제단 곁에
  alternatives_korean:
  - 제단에
  - 제단 위에
  lexicon: HALOT
  rationale: עַל과 standing의 결합은 반드시 '위에'를 뜻하지 않으므로, 문맥상 위치 관계를 자연스럽게 보이도록 '곁에'로 옮겼습니다.
- source_word: לְהַקְטִיר
  english_pob_choice: to burn incense
  chosen_korean: 분향하고 있었습니다
  alternatives_korean:
  - 향을 피우고 있었습니다
  - 향을 올리고 있었습니다
  lexicon: HALOT
  rationale: 제의적 동작을 한국어에서 가장 분명히 드러내는 표현으로, 제단 앞에서 향을 피우는 행위를 가리킵니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼로 옮겼습니다.
  alternative_readings:
  - 여호와로 옮김
  - 주님으로 옮김
  rationale: 프로젝트 기본값에 따라 본문의 신명 직접 표기를 보존했습니다. 왕상 13:1의 המסגרת에서는 하나님의 파송 권위를 드러내는 핵심 요소이므로 일반 호칭으로 평준화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
