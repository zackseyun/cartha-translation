base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/001.yaml
  text: And behold[a], a man of God came from Judah to Bethel by the word of Yahweh[b], while Jeroboam was standing by the altar to burn incense.
  footnotes:
  - marker: a
    text: Or, 'at the word of the LORD' or 'according to the word of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'and Jeroboam was standing at the altar.' The Hebrew conjunction can be read simply as 'and,' and 'by the altar' may also be rendered 'at the altar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 하나님의 사람이 야훼의 말씀을 따라[a] 유다에서 베델로 왔습니다. 여로보암은 분향하려고 제단 곁에[b] 서 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼의 말씀으로”, “야훼의 말씀에 따라”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “제단에” 또는 “제단 위에”로도 옮길 수 있습니다. 히브리어 접속사는 단순히 “그리고”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
