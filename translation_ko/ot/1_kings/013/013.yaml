  text: 그가 그의 아들들에게[a] 말했습니다. “나를 위해 나귀에 안장을 얹으십시오.” 그래서 그들이 그를 위해 나귀에 안장을 얹었고, 그는 그것을 탔습니다.
  philosophy: optimal-equivalence
  footnotes:
