translation:
  language: ko
  text: 그가 자기 아들들에게 말했습니다. “나귀를 내게 메어 오너라.” 그래서 그들이 나귀를 그에게 메어 주었고, 그가 그것을 타고 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חבש는 여기서 단순히 ‘안장을 얹다’보다 넓게, 짐승을 타기 위해 ‘메다/준비하다’는 뜻으로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 자기 아들들
  alternatives_korean:
  - 그의 아들들
  - 자녀들
  lexicon: HALOT
  rationale: 히브리어 בָּנָיו는 남성 복수로, 문맥상 ‘아들들’이 정확합니다. ‘자녀들’은 성별 정보를 희석하므로 피했습니다.
- source_word: חִבְשׁוּ לִי הַחֲמוֹר
  english_pob_choice: Saddle the donkey for me
  chosen_korean: 나귀를 내게 메어 오너라
  alternatives_korean:
  - 나귀에 안장을 얹어라
  - 나귀를 내게 준비하라
  lexicon: HALOT
  rationale: חבש는 여기서 짐승을 타기 위해 ‘메다/준비하다’의 뜻으로 쓰였으므로, 현대 한국어에서 자연스러우면서도 원뜻을 살리는 ‘메어 오너라’를 택했습니다.
- source_word: הַחֲמוֹר
  english_pob_choice: the donkey
  chosen_korean: 나귀
  alternatives_korean:
  - 당나귀
  - 노새
  lexicon: HALOT
  rationale: 히브리어 חמור의 기본 의미는 나귀이므로 표준적이고 본문 맥락에 맞는 ‘나귀’를 사용했습니다.
- source_word: וַיַּחְבְּשׁוּ לוֹ הַחֲמוֹר
  english_pob_choice: So they saddled the donkey for him
  chosen_korean: 그래서 그들이 나귀를 그에게 메어 주었고
  alternatives_korean:
  - 그래서 그들이 나귀를 그에게 준비해 주었고
  - 그들이 나귀에 안장을 얹어 주었고
  lexicon: HALOT
  rationale: 같은 동사 חבש의 응답 행위를 앞선 명령과 대응시켜, ‘메어 주었다’로 번역해 동작의 연속성과 수혜 방향을 살렸습니다.
- source_word: וַיִּרְכַּב עָלָיו
  english_pob_choice: and he rode on it
  chosen_korean: 그가 그것을 타고 갔습니다
  alternatives_korean:
  - 그가 그것을 탔습니다
  - 그가 그것 위에 올랐습니다
  lexicon: HALOT
  rationale: רכב על은 탈것을 ‘타고 가다’의 뜻이 자연스러우므로, 한국어 서술 관용에 맞게 목적과 진행을 함께 드러냈습니다.
theological_decisions:
- issue: 직접화법의 명령형 톤
  chosen_reading: 아들에게 하는 명령을 한국어에서 자연스러운 하십시오체 명령으로 옮겼습니다.
  alternative_readings:
  - 평서형으로 완화
  - 거친 명령투로 옮김
  rationale: 본문은 아들들에게 즉각적인 지시를 주는 장면이므로, 공손하지만 명령성을 유지하는 ‘메어 오너라’가 서사적 긴장을 잘 보존합니다.
  doctrine_reference: 서사 문맥 보존 원칙
