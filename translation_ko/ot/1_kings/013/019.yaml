  language: ko
  text: 그러자 그가 그와 함께 돌아가 자기 집에서 빵을 먹고 물을 마셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘빵을 먹고’라고 되어 있으며, 이는 식사를 가리키는 관용구일 수 있습니다. 그러나 이 단락에서는 ‘빵’과 ‘물’이라는 구체적 표현이 중요하므로 직역을 유지합니다.
    reason: lexical_alternative
