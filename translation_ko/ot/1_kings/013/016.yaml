  text: וַ/יֹּ֗אמֶר לֹ֥א אוּכַ֛ל לָ/שׁ֥וּב אִתָּ֖/ךְ וְ/לָ/ב֣וֹא אִתָּ֑/ךְ וְ/לֹֽא אֹ֣כַל לֶ֗חֶם וְ/לֹֽא אֶשְׁתֶּ֤ה אִתְּ/ךָ֙ מַ֔יִם בַּ/מָּק֖וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/016.yaml
  text: And he said[a], “I cannot return with you or go with you, and I will not eat bread or drink water with you in this place.”
  footnotes:
  - marker: a
    text: The Hebrew uses a feminine 'with you' in the first two clauses and a masculine 'with you' in the eating and drinking clause. English does not preserve this gender distinction.
    reason: textual_variant
translation:
  language: ko
  text: 그가 말했습니다[a], "나는 당신과 함께 돌아갈 수도 없고, 당신과 함께 갈 수도 없으며, 이곳에서는 당신과 함께 떡을 먹거나 물을 마시지도 않겠습니다."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 앞의 두 절에서는 여성형 ‘당신과 함께’를, 먹고 마시는 절에서는 남성형 ‘당신과 함께’를 사용하지만, 한국어 본문에서는 성 구분을 드러낼 수 없습니다.
    reason: textual_variant
lexical_decisions:
- source_word: לֹא אוּכַל לָשׁוּב
  english_pob_choice: I cannot return
  chosen_korean: 나는 … 돌아갈 수도 없습니다
  alternatives_korean:
  - 나는 … 돌아갈 수 없습니다
  - 나는 … 되돌아갈 수 없습니다
  lexicon: HALOT
  rationale: יָכֹל의 부정은 능력 부재를 나타내므로 ‘못하다’보다 ‘~할 수도 없다’로 옮겨, 단순 의지보다 실제 불가능을 드러냈습니다.
- source_word: אִתָּךְ / אִתְּךָ
  english_pob_choice: with you
  chosen_korean: 당신과 함께
  alternatives_korean:
  - 당신과
  - 당신과 동행하여
  lexicon: HALOT
  rationale: 히브리어의 반복되는 ‘with you’를 한국어에서는 자연스럽게 ‘당신과 함께’로 옮겨 동행 관계를 분명히 했습니다.
- source_word: וְלָבוֹא
  english_pob_choice: or go with you
  chosen_korean: 또는 당신과 함께 갈 수도 없으며
  alternatives_korean:
  - 또는 당신과 함께 들어갈 수도 없으며
  - 또는 당신과 함께 갈 수도 없으며
  lexicon: HALOT
  rationale: בוא는 문맥상 ‘가다/들어가다’ 모두 가능하지만, 여기서는 동행 제안을 거절하는 흐름이므로 ‘가다’로 두어 앞의 ‘돌아가다’와 대구를 살렸습니다.
- source_word: לֶחֶם / מַיִם
  english_pob_choice: bread / water
  chosen_korean: 떡 / 물
  alternatives_korean:
  - 빵 / 물
  - 음식 / 물
  lexicon: HALOT
  rationale: 히브리어의 구체적 표현을 살려 ‘떡’과 ‘물’로 직역했고, 반복되는 금식·거절 문맥의 상징적 울림을 유지했습니다.
