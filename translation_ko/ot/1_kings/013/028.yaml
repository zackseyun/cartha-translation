  to: 그는 가서 길 위에 내던져진 그의 시신[a]을 발견했습니다. 나귀와 사자가 그 시신 곁에 서 있었습니다. 사자는 그 시신을 먹지 않았고, 나귀를 찢지도 않았습니다[b].
