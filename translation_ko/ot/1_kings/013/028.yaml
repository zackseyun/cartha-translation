  verdict: revise
  source_fidelity: 전반적으로 히브리어의 순차적 서술, 시신이 길에 던져진 상태, 나귀와 사자가 시신 곁에 서 있는 장면, 그리고 사자가 시신을 먹지 않고 나귀를 해하지 않은 사실을 충실히 옮겼습니다. 다만 첫 번째 ‘시신’은 히브리어의 소유 접미사(‘그의 시신’)를 명시하는 편이 더 정확합니다. שׁבר의 문맥상 의미를 ‘찢다’로 옮긴 것은 영어 POB의 해석 범위 안에 있으나, 그 설명 각주는 해당 절 뒤에 붙어야 합니다.
  naturalness: 합쇼체는 일관되고 자연스럽습니다. ‘길 위에 던져져 있는’도 이해되지만, ‘길 위에 내던져진’이 더 간결하고 현대 문어체에서 자연스럽습니다. 두 동물의 위치와 그 뒤의 관찰을 문장으로 분리하면 장면의 전개도 더 분명해집니다.
  terminology: ‘시신’은 인간을 가리키는 נְבֵלָה에 적절하며, 본문의 거친 죽음의 현실도 충분히 보존합니다. ‘나귀’와 ‘사자’도 표준적인 성경 용어입니다. ‘찢지도 않았다’는 문맥상 가능한 번역이며, 문자적 ‘부수다’와의 거리를 각주에서 밝혀야 합니다.
