base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/028.yaml
  text: He went and found his corpse thrown on the road[a], with the donkey and the lion standing beside the corpse. The lion had not eaten the corpse[b], nor had it torn apart the donkey.
  footnotes:
  - marker: a
    text: Or 'body' or 'carcass' for 'corpse' (Hebrew נְבֵלָה); the Hebrew term is stark and emphasizes the reality of death.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally 'had not broken the donkey'; the sense in context is that the lion had not torn it apart or mauled it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 가서 그 시신이 길 위에 던져져 있는 것을 발견했습니다[a]. 나귀와 사자가 그 시신 곁에 서 있었는데, 사자는 그 시신을 먹지 않았고[b] 나귀를 찢지도 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몸’이나 ‘사체’로도 옮길 수 있습니다. 히브리어 נְבֵלָה는 죽은 몸을 가리키며, 여기서는 죽음의 현실을 거칠게 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘나귀를 부수지 않았다’입니다. 문맥상 뜻은 사자가 나귀를 찢어 놓거나 심하게 상하게 하지 않았다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ וַיִּמְצָא
  english_pob_choice: He went and found
  chosen_korean: 그는 가서 … 발견했습니다
  alternatives_korean:
  - 그는 가서 … 찾았습니다
  - 그는 가서 … 알아냈습니다
  lexicon: HALOT
  rationale: 연속 동사 흐름을 한국어의 자연스러운 서사로 옮기되, 단순한 ‘찾다’보다 결과 발견의 뉘앙스를 살려 ‘발견했습니다’로 렌더링했습니다.
- source_word: נִבְלָתוֹ / הַנְּבֵלָה
  english_pob_choice: corpse
  chosen_korean: 시신
  alternatives_korean:
  - 몸
  - 사체
  - 송장
  lexicon: HALOT
  rationale: 인간 대상의 נְבֵלָה를 현대 표준어에서 너무 생물학적이거나 구어적인 표현을 피하면서도 죽음의 현실을 분명히 드러내는 ‘시신’으로 옮겼습니다.
- source_word: מֻשְׁלֶכֶת בַּדֶּרֶךְ
  english_pob_choice: thrown on the road
  chosen_korean: 길 위에 던져져 있는
  alternatives_korean:
  - 길에 버려져 있는
  - 길 위에 내던져진
  lexicon: HALOT
  rationale: שלך의 수동형이 나타내는 ‘던져짐’을 살리되, 한국어에서 자연스러운 상태 묘사인 ‘던져져 있는’으로 옮겨 장면성을 유지했습니다.
- source_word: לֹא שָׁבַר אֶת הַחֲמוֹר
  english_pob_choice: nor had it torn apart the donkey
  chosen_korean: 나귀를 찢지도 않았습니다
  alternatives_korean:
  - 나귀를 부수지도 않았습니다
  - 나귀를 해치지도 않았습니다
  - 나귀를 깨뜨리지도 않았습니다
  lexicon: HALOT
  rationale: שׁבר의 직역인 ‘부수다/깨뜨리다’는 한국어에서 나귀에 대한 동작으로 어색하므로, 문맥상 의미를 드러내는 ‘찢다’를 택해 상처 입히거나 갈기갈기 뜯는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 사자의 무해함을 어떻게 드러낼지
  chosen_reading: 사자는 시신과 나귀 곁에 있었고, 먹지 않고 찢지도 않았다는 점을 그대로 드러내어 하나님의 판단이 완전히 집행되었음을 보여 주는 장면으로 읽었습니다.
  alternative_readings:
  - 단순한 동물의 비상한 행동 묘사로만 읽기
  - 사자가 시신을 보호하는 듯한 이미지로 약화하기
  rationale: 본문은 기적적 통제와 심판의 성취를 강조하므로, 이를 완화하지 않고 관찰된 사실대로 옮기는 것이 문맥에 충실합니다.
  doctrine_reference: 신적 심판과 보존의 표지
