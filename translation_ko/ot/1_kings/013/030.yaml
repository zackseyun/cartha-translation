base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/030.yaml
  text: And he laid his corpse in his own tomb[a], and they mourned over him, saying, “Alas[b], my brother!”
  footnotes:
  - marker: a
    text: Or “they lamented over him.” The Hebrew verb refers to mourning for the dead, often in a formal lament.
    reason: lexical_alternative
  - marker: b
    text: “My brother” is likely a lament formula expressing kinship or solidarity, not necessarily a statement of biological relation.
    reason: cultural_note
translation:
  language: ko
  text: 그는 그 사람의 시체를 자기 무덤에 두었고, 그들은 그를 두고 애도했습니다[a]. “아아, 내 형제여!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 두고 곡했습니다.” 히브리어 동사는 죽은 이를 위해 애도하거나 장례 탄식을 하는 일을 가리키며, 공식적인 애도를 뜻하기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 형제’는 실제 혈연 관계를 뜻한다기보다 애도와 연대를 나타내는 탄식 표현일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּנַּח
  english_pob_choice: laid
  chosen_korean: 두었고
  alternatives_korean:
  - 놓았고
  - 안치했고
  lexicon: HALOT
  rationale: 장례 문맥에서 ‘두다’는 원문의 ‘놓다/두다’ 의미를 자연스럽게 살리면서 과도한 장식 없이 전달합니다.
- source_word: נִבְלָתוֹ
  english_pob_choice: his corpse
  chosen_korean: 자기의 시체
  alternatives_korean:
  - 그의 몸
  - 그의 시체
  lexicon: HALOT
  rationale: 히브리어 נִבְלָה는 죽은 몸을 가리키며, ‘시체’가 이보다 더 직접적이고 강한 의미를 보존합니다.
- source_word: בְּקִבְרוֹ
  english_pob_choice: in his own tomb
  chosen_korean: 자기 무덤에
  alternatives_korean:
  - 자기 무덤 속에
  - 자기 묘에
  lexicon: HALOT
  rationale: קֶבֶר는 ‘무덤’으로 옮기는 것이 가장 자연스럽고, 소유격은 ‘자기’로 드러낼 수 있습니다.
- source_word: וַיִּסְפְּדוּ עָלָיו
  english_pob_choice: they mourned over him
  chosen_korean: 그를 두고 애도하며
  alternatives_korean:
  - 그를 두고 슬퍼하며
  - 그를 두고 곡하며
  lexicon: HALOT
  rationale: ספד는 장례식적 애도/곡을 뜻하므로 ‘애도하다’가 원문의 공식적 슬픔을 잘 반영합니다.
- source_word: הוֹי אָחִי
  english_pob_choice: Alas, my brother!
  chosen_korean: 아아, 내 형제여!
  alternatives_korean:
  - 슬프도다, 내 형제여!
  - 아, 내 형제여!
  lexicon: HALOT
  rationale: הוֹי는 통상적인 탄식이므로 ‘아아’가 감탄의 강도를 살리고, אָחִי는 문자적으로 ‘내 형제’로 옮기되 탄식 형식에 맞춰 호격을 반영했습니다.
theological_decisions:
- issue: אָחִי의 관계 표현을 직역할지 탄식 관용구로 처리할지
  chosen_reading: ‘내 형제여’로 옮겨 혈연보다 애도의 연대감을 드러내도록 했습니다.
  alternative_readings:
  - ‘내 형제’
  - ‘내 동료여’
  rationale: 본문의 ‘형제’는 실제 친족 선언이라기보다 장례 탄식의 연대 표현으로 이해하는 것이 문맥에 부합합니다.
  doctrine_reference: 장례 탄식의 수사적 관용구
