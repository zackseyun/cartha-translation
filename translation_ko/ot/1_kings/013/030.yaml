  - 자기 묘에
  lexicon: HALOT
  rationale: קֶבֶר는 ‘무덤’으로 옮기는 것이 가장 자연스럽고, 소유격은 ‘자기’로 드러낼 수 있습니다.
- source_word: וַיִּסְפְּדוּ עָלָיו
  english_pob_choice: they mourned over him
  chosen_korean: 그를 두고 애도하며
  alternatives_korean:
  - 그를 두고 슬퍼하며
  - 그를 두고 곡하며
  lexicon: HALOT
  rationale: ספד는 장례식적 애도/곡을 뜻하므로 ‘애도하다’가 원문의 공식적 슬픔을 잘 반영합니다.
- source_word: הוֹי אָחִי
  english_pob_choice: Alas, my brother!
  chosen_korean: 아아, 내 형제여!
  alternatives_korean:
  - 슬프도다, 내 형제여!
  - 아, 내 형제여!
  lexicon: HALOT
  rationale: הוֹי는 통상적인 탄식이므로 ‘아아’가 감탄의 강도를 살리고, אָחִי는 문자적으로 ‘내 형제’로 옮기되 탄식 형식에 맞춰 호격을 반영했습니다.
theological_decisions:
- issue: אָחִי의 관계 표현을 직역할지 탄식 관용구로 처리할지
  chosen_reading: ‘내 형제여’로 옮겨 혈연보다 애도의 연대감을 드러내도록 했습니다.
  alternative_readings:
  - ‘내 형제’
  - ‘내 동료여’
  rationale: 본문의 ‘형제’는 실제 친족 선언이라기보다 장례 탄식의 연대 표현으로 이해하는 것이 문맥에 부합합니다.
  doctrine_reference: 장례 탄식의 수사적 관용구
