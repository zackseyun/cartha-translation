base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/030.yaml
  text: And he laid his corpse in his own tomb[a], and they mourned over him, saying, “Alas[b], my brother!”
  footnotes:
  - marker: a
    text: Or “they lamented over him.” The Hebrew verb refers to mourning for the dead, often in a formal lament.
    reason: lexical_alternative
  - marker: b
    text: “My brother” is likely a lament formula expressing kinship or solidarity, not necessarily a statement of biological relation.
    reason: cultural_note
translation:
  language: ko
  text: 그는 자기의 시체를 자기 무덤에 두었고, 사람들이 그를 두고 애도하며 말했습니다. 「아아, 내 형제여!」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 위해 애도했습니다.” 히브리어 동사는 죽은 이를 위한 공식적 애도를 가리키기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 형제’는 실제 혈연이라기보다 애도와 연대의 탄식 표현일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּנַּח
  english_pob_choice: laid
  chosen_korean: 두었고
  alternatives_korean:
  - 놓았고
  - 안치했고
  lexicon: HALOT
  rationale: 장례 문맥에서 ‘두다’는 원문의 ‘놓다/두다’ 의미를 자연스럽게 살리면서 과도한 장식 없이 전달합니다.
- source_word: נִבְלָתוֹ
  english_pob_choice: his corpse
  chosen_korean: 자기의 시체
  alternatives_korean:
  - 그의 몸
  - 그의 시체
  lexicon: HALOT
  rationale: 히브리어 נִבְלָה는 죽은 몸을 가리키며, ‘시체’가 이보다 더 직접적이고 강한 의미를 보존합니다.
- source_word: בְּקִבְרוֹ
  english_pob_choice: in his own tomb
  chosen_korean: 자기 무덤에
  alternatives_korean:
