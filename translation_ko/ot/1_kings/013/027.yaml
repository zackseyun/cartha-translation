lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then he spoke
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말했습니다
  - 이야기했습니다
  lexicon: HALOT
  rationale: דבר의 기본 의미를 자연스러운 서술 동사로 옮겼고, 문맥상 이어지는 화법 도입을 반영해 한국어에서도 매끄럽게 처리했습니다.
- source_word: אֶל בָּנָיו
  english_pob_choice: to his sons
  chosen_korean: 자기 아들들에게
  alternatives_korean:
  - 자기 아들들에게
  - 자기 아들들한테
  lexicon: HALOT
  rationale: בָּנִים의 복수를 그대로 살려 ‘아들들’로 옮기되, 문어체에 맞게 ‘자기’로 소유 관계를 분명히 했습니다.
- source_word: חִבְשׁוּ
  english_pob_choice: Saddle ... for me
  chosen_korean: 나귀에 안장을 얹으십시오
  alternatives_korean:
  - 나귀에 안장을 얹으십시오
  - 나귀를 준비해 주십시오
  lexicon: HALOT
  rationale: חבשׁ를 나귀에 대해 쓰일 때의 ‘안장을 얹다’로 옮겨 동작의 구체성을 살렸고, 요청형으로서 존대 명령을 사용했습니다.
- source_word: הַחֲמוֹר
  english_pob_choice: the donkey
  chosen_korean: 나귀
  alternatives_korean:
  - 나귀
  - 당나귀
  lexicon: HALOT
  rationale: 원어의 일반 명사 חמור에 대해 현대 한국어 성경에서 자연스럽고 정확한 ‘나귀’를 사용했습니다.
theological_decisions:
- issue: 직접화법의 명령형 높임
  chosen_reading: “나를 위해 나귀에 안장을 얹으십시오.”
  alternative_readings:
  - “나를 위해 나귀에 안장을 얹으시오.”
  - “나를 위해 나귀를 준비하십시오.”
  rationale: 대상이 예언적 서술 속 인물이라도 한국어 본문은 현대 문어체의 정중한 명령형이 가장 자연스럽고, 원문의 요청 성격을 유지합니다.
  doctrine_reference: 서술 내 직접화법의 화용적 재현
