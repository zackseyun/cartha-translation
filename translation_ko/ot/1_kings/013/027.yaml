  source_fidelity: 히브리어의 연속 서술(וַיְדַבֵּר … וַיַּחֲבֹשׁוּ), 수신자 ‘그의 아들들’, 나귀를 화자 자신을 위해 안장 지우라는 명령, 그리고 아들들이 이를 이행한 내용이 모두 충실히 반영되었습니다. 마지막 동사의 목적어가 히브리어에서는 생략되어 있으므로 본문의 ‘안장을 얹었습니다’와 대안 각주의 명시적 ‘나귀에’도 적절합니다.
  naturalness: ‘그러자’, ‘말했습니다’, ‘나귀에 안장을 얹으십시오’는 현대 표준 한국어의 정중한 서술체 및 직접화법으로 자연스럽습니다. ‘자기 아들들에게’도 이 문맥에서 소유 관계가 분명하며 문법적으로 자연스럽습니다.
  terminology: חֲמוֹר의 ‘나귀’와 חבשׁ의 ‘안장을 얹다’는 정확하고 현대적인 대응입니다. ‘나를 위해’는 לִי의 수익·용도를 무리 없이 보존합니다.
