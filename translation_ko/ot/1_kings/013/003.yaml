base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/003.yaml
  text: 'And on that day he gave a sign[a], saying, “This is the sign that Yahweh has spoken: behold, the altar will be torn apart[b], and the ashes that are on it will be poured out.”'
  footnotes:
  - marker: a
    text: Or “wonder” or “portent” for “sign” (Hebrew מוֹפֵת).
    reason: lexical_alternative
  - marker: b
    text: “Ashes” translates a Hebrew term that can refer more specifically to the fatty ashes/remains from sacrifices.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그날 그는 징표[a]를 주며 이렇게 말했습니다. 「이것이 야훼께서 말씀하신 징표입니다. 보십시오, 제단이 갈라지고 그 위에 있는 재[b]가 쏟아질 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘징표’는 여기서 ‘이적’이나 ‘표징’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘재’는 제의적 맥락에서 희생 제물에서 남은 기름진 재 또는 제의 잔여물을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: מוֹפֵת
  english_pob_choice: sign
  chosen_korean: 징표
  alternatives_korean:
  - 표적
  - 징후
  - 이적
  lexicon: HALOT
  rationale: 여기서는 예언의 참됨을 확인하는 표지이므로, 전통적 교회어인 ‘이적’보다 의미가 좁고 자연스러운 ‘징표’가 본문 기능을 잘 드러냅니다.
- source_word: דִּבֶּר יְהוָה
  english_pob_choice: the LORD has spoken
  chosen_korean: 야훼께서 말씀하신
  alternatives_korean:
  - 주님이 말씀하신
  - 야훼께서 말씀하셨습니다
  lexicon: HALOT
  rationale: 하나님의 이름 יְהוָה는 프로젝트 기본에 따라 ‘야훼’로 옮기고, 예언 선포문답게 완료된 말씀을 가리키는 표현을 살렸습니다.
- source_word: הִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이 보십시오
  - 여기
  lexicon: HALOT
  rationale: 예언적 주의 환기와 직접 청중에게 보여 주는 뉘앙스를 현대 한국어에서 가장 자연스럽게 살리는 호소형 표현입니다.
- source_word: הַדֶּשֶׁן
  english_pob_choice: the ashes
  chosen_korean: 재
  alternatives_korean:
  - 재더미
  - 재물의 재
  - 제단의 재
  lexicon: HALOT
  rationale: 제의적 맥락에서 더 기술적인 뜻이 가능하지만, 본문은 제단 위에 놓인 잔여물을 가리키므로 기본적으로 자연스러운 ‘재’로 옮기고, 필요한 세부는 영어 주석과 함께 추적할 수 있습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 처리할 것인가
  chosen_reading: 본문에 하나님의 고유명사 ‘야훼’를 직접 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 יְהוָה를 직접 쓰므로, 제목어로 치환하지 않고 이름 자체를 드러내는 것이 본문이 지닌 예언적 권위를 더 분명히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
