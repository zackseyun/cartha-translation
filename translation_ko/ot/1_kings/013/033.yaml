id: 1KI.13.33
reference: 1 Kings 13:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַחַר֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹֽא שָׁ֥ב יָרָבְעָ֖ם מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה וַ֠/יָּשָׁב וַ/יַּ֜עַשׂ מִ/קְצ֤וֹת הָ/עָם֙ כֹּהֲנֵ֣י בָמ֔וֹת הֶֽ/חָפֵץ֙ יְמַלֵּ֣א אֶת יָד֔/וֹ וִ/יהִ֖י כֹּהֲנֵ֥י בָמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/033.yaml
  text: After this event[a], Jeroboam did not turn from his evil way, but again made priests of high places from among all the people. Whoever desired it, he ordained him, and he became one of the priests of the high places.
  footnotes:
  - marker: a
    text: Literally, 'he filled his hand,' a Hebrew idiom for installing or consecrating someone to priestly service.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일 후에 여로보암은 자기의 악한 길에서 돌이키지 않았고, 다시 온 백성 가운데서 산당의 제사장들을 세웠습니다. 누구든지 원하면, 여로보암은 그를 임직하였고[a], 그는 산당의 제사장들 가운데 하나가 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 손을 채웠다’는 뜻으로, 제사장 직무에 세우거나 임직시키는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדָּבָר הַזֶּה
  english_pob_choice: After this event
  chosen_korean: 이 일 후에
  alternatives_korean:
  - 이 사건 후에
  - 이 일 뒤에
  lexicon: WLC/문맥
  rationale: דָּבָר는 여기서 구체적 사건을 가리키는 서술 연결어이므로, 한국어에서는 간결하게 ‘이 일 후에’로 옮기면 자연스럽고 과도한 해석을 피할 수 있습니다.
- source_word: לֹא שָׁב מִדַּרְכּוֹ הָרָעָה
  english_pob_choice: did not turn from his evil way
  chosen_korean: 자기의 악한 길에서 돌이키지 않았고
  alternatives_korean:
  - 자기의 악한 길에서 돌아서지 않았고
  - 자기의 악한 길에서 회개하지 않았고
  lexicon: HALOT
  rationale: שׁוּב의 기본 이미지는 ‘돌이키다/돌아오다’이므로, ‘회개하다’보다 원문 이미지를 살리는 ‘돌이키지 않았다’를 택했습니다.
- source_word: מִקְצוֹת הָעָם כֹּהֲנֵי בָמוֹת
  english_pob_choice: made priests of the high places from among all the people
  chosen_korean: 온 백성 가운데서 산당의 제사장들을 세웠습니다
  alternatives_korean:
  - 온 백성 가운데서 산당의 제사장들을 만들었습니다
  - 백성 중에서 산당의 제사장들을 세웠습니다
  lexicon: HALOT
  rationale: מִקְצוֹת הָעָם은 분별 없이 백성 가운데서 취했다는 뜻으로 이해되므로, 한국어에서는 ‘온 백성 가운데서’로 그 무차별성을 살렸습니다. בָמוֹת은 이 문맥에서 불법적 산당을 가리키므로 ‘산당’으로 옮겼습니다.
- source_word: יְמַלֵּא אֶת יָדוֹ
  english_pob_choice: he ordained him
  chosen_korean: 그를 임직하였고
  alternatives_korean:
  - 그의 손을 채웠고
  - 그를 제사장으로 세웠고
  - 그를 성별하였고
  lexicon: HALOT
  rationale: ‘손을 채우다’는 제사장 임직을 뜻하는 히브리어 관용구이므로, 본문에서는 기능을 드러내는 ‘임직하다’를 택하고, 직역은 본문 밖에서 주석으로 보완하는 것이 적절합니다.
- source_word: וִיהִי כֹּהֲנֵי בָמוֹת
  english_pob_choice: and he became one of the priests of the high places
  chosen_korean: 그는 산당의 제사장들 가운데 하나가 되었습니다
  alternatives_korean:
  - 그는 산당의 제사장들 가운데 한 사람이 되었습니다
  - 그는 산당의 제사장 무리에 속하게 되었습니다
  lexicon: HALOT
  rationale: 히브리어는 단수 동사 뒤에 복수 술어를 두는 관용적 표현이므로, 한국어에서는 ‘그들 가운데 하나가 되었다’는 의미가 드러나도록 자연스럽게 다듬었습니다.
theological_decisions:
- issue: שׁוּב의 도덕적/종교적 뉘앙스를 어떻게 처리할지
  chosen_reading: ‘회개하지 않았다’보다 ‘돌이키지 않았다’로 유지했습니다.
  alternative_readings:
  - 회개하지 않았고
  - 악한 길을 버리지 않았고
  rationale: 본문은 도덕적 반전을 말하지만, 동사 자체는 ‘돌아가다/돌이키다’이므로, 원문이 직접 말하는 수준을 넘는 신학 용어를 본문에 넣지 않았습니다.
  doctrine_reference: 번역 원칙 §1, §3
- issue: בָמוֹת를 어떻게 한국어 교회 용어로 옮길지
  chosen_reading: ‘산당’으로 옮겼습니다.
  alternative_readings:
  - 높은 곳
  - 산당들
  rationale: 이 문맥의 בָמוֹת는 정당한 성소가 아니라 우상 숭배와 연결된 지역 제단이므로, 한국어 성경에서 널리 쓰이는 ‘산당’이 원문 의미를 가장 직접적으로 전달합니다.
  doctrine_reference: 구약 제의 용어 일관성
