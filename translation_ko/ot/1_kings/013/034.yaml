  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/דָּבָ֣ר הַ/זֶּ֔ה לְ/חַטַּ֖את בֵּ֣ית יָרָבְעָ֑ם וּ/לְ/הַכְחִיד֙ וּ/לְ/הַשְׁמִ֔יד מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/034.yaml
  text: And this matter became sin for the house of Yarovam[b][a], to cut it off and to destroy it from the face of the ground.
  footnotes:
  - marker: a
    text: Or 'this thing.' The Hebrew דָּבָר can refer broadly to a matter, affair, or thing.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the face of the ground'; an idiom meaning complete removal from the earth/land.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일은 여로보암의 집에 죄가 되어, 그 집을 끊어 없애고 땅 위에서 멸망시키는 데 이르게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘땅의 얼굴 위에서’입니다. 이는 땅에서 완전히 제거됨을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדָּבָר הַזֶּה
  english_pob_choice: this matter
  chosen_korean: 이 일
  alternatives_korean:
  - 이 사건
  - 이 문제
  lexicon: HALOT
  rationale: דָּבָר는 여기서 단순한 ‘말’이 아니라 앞서 서술된 전체 상황이나 일의 경과를 가리키므로, 한국어로는 자연스럽고 포괄적인 ‘이 일’이 적절합니다.
- source_word: לְחַטַּאת
  english_pob_choice: sin
  chosen_korean: 죄
  alternatives_korean:
  - 죄가 됨
  - 죄책
  lexicon: HALOT
  rationale: ‘되다’와 결합해 결과·판정의 의미를 살리기 위해 ‘죄가 되다’로 옮겼습니다. 이는 원문의 결과적 용법을 비교적 직접적으로 드러냅니다.
- source_word: בֵּית יָרָבְעָם
  english_pob_choice: the house of Yarovam
  chosen_korean: 여로보암의 집
  alternatives_korean:
  - 여로보암 가문
  - 여로보암의 왕조
  lexicon: HALOT
  rationale: 히브리어의 ‘집’은 가족선이나 왕조를 뜻할 수 있으므로, 문맥상 자연스러운 한국어 관용으로 옮기되 고유한 왕조적 의미는 유지했습니다.
- source_word: וּלְהַכְחִיד וּלְהַשְׁמִיד
  english_pob_choice: to cut it off and to destroy it
  chosen_korean: 그것을 끊어 버리고 … 멸하려는
  alternatives_korean:
  - 끊어 없애고 … 파멸시키려는
  - 끊어 버리고 … 파괴하려는
  lexicon: HALOT
  rationale: 두 히필 동사를 서로 다른 한국어 동사군으로 나누어 중복을 피했습니다. ‘끊어 버리다’는 제거/절단의 뉘앙스를, ‘멸하다’는 강한 심판과 파괴를 드러냅니다.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  english_pob_choice: from the face of the ground
  chosen_korean: 땅의 표면에서
  alternatives_korean:
  - 땅 위에서
  - 지면에서
  lexicon: HALOT
  rationale: ‘표면’은 פני의 면/겉면 이미지를 살리면서도 한국어에서 어색하지 않게 풀어 주며, ‘아다마’를 ‘땅’으로 옮겨 원문의 물질적·심판적 이미지를 유지합니다.
theological_decisions:
- issue: ‘죄가 되다’의 의미
  chosen_reading: 이 사건은 여로보암 집안에 단순한 도덕적 흠이 아니라, 그 가문 전체를 향한 심판의 죄/죄책으로 작용합니다.
  alternative_readings:
  - 이 일이 여로보암 집의 ‘죄를 짓게 한 사건’이라는 뜻일 수 있습니다.
  rationale: 히브리어 היה לְחַטָּאת는 결과적으로 ‘죄가 되다/죄책이 되다’는 심판적 표현으로 읽는 것이 문맥에 가장 잘 맞습니다. 뒤의 ‘끊어 버리고 멸하려는’과도 긴밀히 연결됩니다.
  doctrine_reference: 문맥상 왕조 심판
