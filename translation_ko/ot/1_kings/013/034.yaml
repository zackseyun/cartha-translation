  naturalness: ‘땅의 표면에서’는 문법적으로 가능하지만 성경 문맥의 관용구로서는 다소 기술적입니다. ‘땅 위에서’가 현대 표준어로 더 자연스럽고, 각주에서 직역과 관용적 의미를 보완할 수 있습니다. ‘그것을’ 대신 ‘그 집을’으로 받으면 지시 대상도 분명해집니다.
