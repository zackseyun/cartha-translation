source:
  edition: WLC
  text: כִּֽי דָבָ֤ר אֵלַ/י֙ בִּ/דְבַ֣ר יְהוָ֔ה לֹֽא תֹאכַ֣ל לֶ֔חֶם וְ/לֹֽא תִשְׁתֶּ֥ה שָׁ֖ם מָ֑יִם לֹא תָשׁ֣וּב לָ/לֶ֔כֶת בַּ/דֶּ֖רֶךְ אֲשֶׁר הָלַ֥כְתָּ בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/017.yaml
  text: 'For a word came to me by the word of the LORD: ‘You shall not eat bread, and you shall not drink water there; you shall not return by going on the way by which you went.’'
translation:
  language: ko
  text: “야훼의 말씀으로 내게 말씀이 임하여, ‘너는 그곳에서 떡을 먹지도 말고 물도 마시지 말라. 또 네가 갔던 길로 다시 돌아오지 말라’ 하였습니다.”
  philosophy: formal
lexical_decisions:
- source_word: דָבָר ... בִּדְבַר יְהוָה
  english_pob_choice: a word came to me by the word of the LORD
  chosen_korean: “야훼의 말씀으로 내게 말씀이 임하여”
  alternatives_korean:
  - “야훼의 말씀으로 내게 한 말씀이 있었고”
  - “야훼의 말씀으로 내게 말씀이 있었으니”
  lexicon: דבר / דבר־יהוה
  rationale: 히브리어의 ‘말씀’ 반복을 살려, 단순한 정보 전달이 아니라 신적 발화가 선지자에게 ‘임함’이라는 뉘앙스를 드러냈습니다.
- source_word: לֹא תֹאכַל לֶחֶם
  english_pob_choice: You shall not eat bread
  chosen_korean: “너는 그곳에서 떡을 먹지도 말고”
  alternatives_korean:
  - “너는 그곳에서 빵을 먹지도 말고”
  - “너는 그곳에서 음식을 먹지도 말고”
  lexicon: לחם
  rationale: לחם은 문자적으로 ‘빵/떡’이지만, 이 본문에서는 금지된 식사 행위를 직접적으로 가리키므로 ‘떡’이 보다 원문에 가깝고 문맥상 적절합니다.
- source_word: לֹא תִשְׁתֶּה שָׁם מָיִם
  english_pob_choice: you shall not drink water there
  chosen_korean: “물도 마시지 말라”
  alternatives_korean:
  - “그곳에서 물도 마시지 말라”
  - “그곳에서 물을 마시지도 말라”
  lexicon: מים
  rationale: 앞 절의 ‘그곳에서’와 병렬을 이루므로 한국어에서는 중복을 줄여 자연스럽게 옮겼지만, 금지의 장소성이 본문에 내포되어 있습니다.
- source_word: לֹא תָשׁוּב ... בַּדֶּרֶךְ אֲשֶׁר הָלַכְתָּ בָּהּ
  english_pob_choice: you shall not return by going on the way by which you went
  chosen_korean: “또 네가 갔던 길로 다시 돌아오지 말라”
  alternatives_korean:
  - “또 네가 왔던 길로 다시 돌아오지 말라”
  - “또 네가 지나간 그 길로 돌아오지 말라”
  lexicon: שוב / דרך / הלך
  rationale: POB의 ‘by going on the way by which you went’에 담긴 중복 구조를 한국어에서는 과도한 직역 없이 보존하되, ‘네가 갔던 길’로 원래의 이동 경로를 분명히 했습니다.
theological_decisions:
- issue: YHWH divine name rendering
  chosen_reading: 본문의 יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 이 프로젝트의 기본어휘를 따라 원문 고유명사를 보존하고, 이어지는 ‘말씀’ 반복과도 결합되는 직접성을 살렸습니다.
  doctrine_reference: POB glossary default; source-language transparency
