  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 서술 전개 기능을 살려, 한국어에서는 자연스러운 사건 진행 표현으로 옮겼습니다.
- source_word: הֵם יֹשְׁבִים אֶל הַשֻּׁלְחָן
  english_pob_choice: as they were sitting at the table
  chosen_korean: 그들이 상에 앉아 있을 때
