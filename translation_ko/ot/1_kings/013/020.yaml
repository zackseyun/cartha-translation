  text: And it happened, as they were sitting at the table, that the word of Yahweh came to the prophet who had brought him back.
translation:
  language: ko
  text: 그들이 상에 앉아 있을 때, 야훼의 말씀이 그를 데려오게 한 예언자에게 임하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘상에’이지만, 식사 자리의 관용적 표현으로는 한국어 ‘상에 앉아’가 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: ~하였습니다
  alternatives_korean:
  - 그리고 ~였습니다
  - 그때 ~되었습니다
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 서술 전개 기능을 살려, 한국어에서는 자연스러운 사건 진행 표현으로 옮겼습니다.
- source_word: הֵם יֹשְׁבִים אֶל הַשֻּׁלְחָן
  english_pob_choice: as they were sitting at the table
  chosen_korean: 그들이 상에 앉아 있을 때
  alternatives_korean:
  - 그들이 식탁에 앉아 있을 때
  - 그들이 상 앞에 앉아 있을 때
  lexicon: HALOT
  rationale: 지속 동작을 나타내는 분사구문을 ‘~하고 있을 때’로 옮겼고, 식사 자리의 자연스러운 한국어인 ‘상’으로 렌더링했습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 주님의 말씀
  lexicon: HALOT
  rationale: 예언 공식의 관용구를 직역에 가깝게 살리면서, 프로젝트 기본값에 따라 신명은 ‘야훼’로 유지했습니다.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  english_pob_choice: who had brought him back
  chosen_korean: 그를 데려오게 한
  alternatives_korean:
  - 그를 돌려보내게 한
  - 그를 다시 데려온
  lexicon: HALOT
  rationale: הֵשִׁיב의 사역적 의미를 살려 ‘돌아오게 하다/데려오게 하다’의 뉘앙스를 반영했습니다. 문맥상 단순한 이동이 아니라 이전으로 되돌려 온 행위를 나타냅니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 방침에 따라 언약적 신명은 ‘야훼’로 옮겨 원문 고유성을 보존했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
