  - 주님의 말씀
  lexicon: HALOT
  rationale: 예언 공식의 관용구를 직역에 가깝게 살리면서, 프로젝트 기본값에 따라 신명은 ‘야훼’로 유지했습니다.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  english_pob_choice: who had brought him back
  chosen_korean: 그를 데려오게 한
  alternatives_korean:
