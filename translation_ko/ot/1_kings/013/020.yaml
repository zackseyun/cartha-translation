  - 그들이 상 앞에 앉아 있을 때
  lexicon: HALOT
  rationale: 지속 동작을 나타내는 분사구문을 ‘~하고 있을 때’로 옮겼고, 식사 자리의 자연스러운 한국어인 ‘상’으로 렌더링했습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
