  lexicon: HALOT
  rationale: הֵשִׁיב의 사역적 의미를 살려 ‘돌아오게 하다/데려오게 하다’의 뉘앙스를 반영했습니다. 문맥상 단순한 이동이 아니라 이전으로 되돌려 온 행위를 나타냅니다.
