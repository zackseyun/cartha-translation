  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ גַּם אֲנִ֣י נָבִיא֮ כָּמוֹ/ךָ֒ וּ/מַלְאָ֡ךְ דִּבֶּ֣ר אֵלַ/י֩ בִּ/דְבַ֨ר יְהוָ֜ה לֵ/אמֹ֗ר הֲשִׁבֵ֤/הוּ אִתְּ/ךָ֙ אֶל בֵּיתֶ֔/ךָ וְ/יֹ֥אכַל לֶ֖חֶם וְ/יֵ֣שְׁתְּ מָ֑יִם כִּחֵ֖שׁ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/018.yaml
  text: And he said to him[a], “I also am a prophet like you, and an angel spoke to me by the word of Yahweh, saying, ‘Bring him back with you to your house, that he may eat bread and drink water.’” But he lied to him.
  footnotes:
  - marker: a
    text: Or 'a messenger spoke to me by the word of the LORD.' The Hebrew word can mean either 'angel' or 'messenger.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말했습니다. “나도 너와 같은 예언자입니다. 야훼의 말씀으로 한 천사가 내게 말하여 이르기를, ‘그를 너와 함께 네 집으로 데려오라. 그러면 그가 떡을 먹고 물을 마실 것이다’ 하였습니다.” 그러나 그는 그에게 거짓말을 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전령이 야훼의 말씀으로 내게 말했습니다.’ 히브리어 מַלְאָךְ는 ‘천사’와 ‘사자/전령’ 모두를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבִיא
  english_pob_choice: prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  lexicon: HALOT
  rationale: 예언 직무를 가리키는 기본 의미를 살리되, 현대 한국어에서 가장 직접적인 대응어인 ‘예언자’를 택했습니다.
- source_word: מַלְאָךְ
  english_pob_choice: angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 전령
  lexicon: HALOT
  rationale: 문맥상 ‘야훼의 말씀으로’ 말하는 존재이므로, 본문이 허용하는 초월적 존재를 자연스럽게 반영하는 ‘천사’를 사용했습니다. 다만 히브리어 자체의 넓은 의미는 footnote로 남깁니다.
- source_word: בִּדְבַר יְהוָה
  english_pob_choice: by the word of Yahweh
  chosen_korean: 야훼의 말씀으로
  alternatives_korean:
  - 야훼의 말씀에 따라
  - 야훼의 말씀을 통해
  lexicon: HALOT
  rationale: 예언 공식의 도구/매개 의미를 살리면서, YHWH를 프로젝트 기본값인 ‘야훼’로 옮겼습니다.
- source_word: הֲשִׁבֵהוּ
  english_pob_choice: Bring him back
  chosen_korean: 그를 … 데려오라
  alternatives_korean:
  - 그를 돌려보내라
  - 그를 데리고 돌아오라
  lexicon: HALOT
  rationale: 하필의 사역적 의미인 ‘돌아오게 하다’를 한국어 명령형으로 자연스럽게 풀어 ‘데려오라’로 옮겼습니다.
- source_word: כִּחֵשׁ לוֹ
  english_pob_choice: But he lied to him
  chosen_korean: 그는 그에게 거짓말을 했습니다
  alternatives_korean:
  - 그는 그를 속였습니다
  - 그는 그에게 거짓을 말했습니다
  lexicon: HALOT
  rationale: 서술자가 뒤늦게 그 발언의 허위를 폭로하는 표현이므로, 직접적이고 명료한 ‘거짓말을 했습니다’를 택했습니다.
theological_decisions:
- issue: 예언자와 천사의 결합 발화의 신뢰성
  chosen_reading: 천사가 ‘야훼의 말씀으로’ 말했다는 주장 뒤에 서술자가 곧바로 ‘거짓말을 했습니다’라고 판정하는 구조를 그대로 살렸습니다.
  alternative_readings:
  - 전령이 말했다
  - 천사가 말했다
  rationale: 본문은 발화 내용 자체보다, 뒤따르는 서술자의 평가를 통해 그 주장이 거짓임을 드러냅니다. 따라서 논점을 약화시키지 않도록 반전 구조를 유지했습니다.
  doctrine_reference: Narrative irony in 1 Kings 13:18
