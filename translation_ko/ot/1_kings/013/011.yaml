base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/011.yaml
  text: Now an old prophet was living in Bethel[a], and his sons came and told him all the deed that the man of God had done that day in Bethel, and the words that he had spoken to the king[b]; they told them to their father.
  footnotes:
  - marker: a
    text: Hebrew shifts from singular ('his son came and told him') to plural ('they told them to their father'). This may imply more than one son or reflect a textual/narrative irregularity; the translation preserves the shift rather than harmonizing it.
    reason: textual_variant
  - marker: b
    text: Or 'a certain old prophet.'
    reason: lexical_alternative
translation:
  language: ko
  text: 벧엘에 한 늙은 예언자가 살고 있었습니다. 그의 아들이 와서 하나님의 사람이 그날 벧엘에서 행한 모든 일과 그가 왕에게 한 말들을 그에게 전했습니다. 그들은 그것들을 자기 아버지에게 전했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 앞부분에서 ‘그의 아들’이라고 단수로 말하지만, 마지막에서는 ‘그들은’과 ‘그것들을’이라고 복수로 말합니다. 번역은 이 단수와 복수의 긴장을 그대로 보존합니다.
    reason: textual_variant
lexical_decisions:
- source_word: נָבִיא אֶחָד זָקֵן
  english_pob_choice: an old prophet
  chosen_korean: 늙은 예언자 하나
  alternatives_korean:
  - 한 늙은 예언자
  - 어느 늙은 예언자
  lexicon: HALOT
  rationale: אֶחָד가 부정 관사적 기능을 하므로 인물의 불특정성을 살리되, 한국어에서는 ‘하나’로 단정한 수량감보다 서술적 불특정성을 유지했습니다.
- source_word: יֹשֵׁב בְּבֵית־אֵל
  english_pob_choice: was living in Bethel
  chosen_korean: 벧엘에 살고 있는
  alternatives_korean:
  - 벧엘에 거하고 있는
  - 벧엘에 머물고 있는
  lexicon: HALOT
  rationale: יֹשֵׁב는 문자적으로는 ‘앉아/거주하다’이지만, 서사 맥락에서는 거주를 뜻하므로 자연스러운 현재분사형으로 옮겼습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님 사람
  alternatives_korean:
  - 하나님의 사람
  - 하나님의 사람
  lexicon: HALOT
  rationale: 예언자적 호칭을 직역하면서도 한국어에서 관용화된 문맥적 표현을 유지하려고 했습니다. 다만 전통적 종교어 ‘하나님의 사람’도 가능한 대안이므로 각주로 제시했습니다.
- source_word: אֶת כָּל הַמַּעֲשֶׂה
  english_pob_choice: all the deed
  chosen_korean: 그날 벧엘에서 행한 모든 일
  alternatives_korean:
  - 그날 벧엘에서 한 모든 행동
  - 그날 벧엘에서 일어난 모든 일
  lexicon: HALOT
  rationale: מַעֲשֶׂה의 단수성을 한국어에서 자연스럽게 살리기 위해 ‘행한 모든 일’로 풀었고, 사건 전체를 가리키는 서사적 뉘앙스를 보존했습니다.
- source_word: וַיְסַפְּרוּם לַאֲבִיהֶם
  english_pob_choice: they told them to their father
  chosen_korean: 모두 자기 아버지에게 전했습니다
  alternatives_korean:
  - 그것들을 아버지에게 전했습니다
  - 그들을 아버지에게 전했습니다
  lexicon: HALOT
  rationale: 히브리어는 복수 동사와 목적어 대명사로 끝나므로, 앞선 단수/복수 긴장을 무리 없이 드러내기 위해 ‘모두’로 집합성을 살리고 ‘전했습니다’로 마무리했습니다.
theological_decisions:
- issue: 예언자 호칭의 번역과 인물 정체성의 불특정성
  chosen_reading: ‘늙은 예언자 하나’로 옮겨 인물의 불특정성과 서사적 긴장을 유지했습니다.
  alternative_readings:
  - ‘한 늙은 예언자’
  - ‘어느 늙은 예언자’
  rationale: 본문은 특정 인물 소개라기보다 벧엘에 거주하는 늙은 예언자의 등장 자체를 강조하므로, 과도한 설명 없이 불특정성을 유지하는 것이 서술 효과를 더 잘 보존합니다.
  doctrine_reference: 서사 본문 해석 원칙
- issue: ‘하나님 사람’ vs ‘하나님의 사람’
  chosen_reading: 본문에는 ‘하나님 사람’을 두고, 대안 표현을 각주로 제시했습니다.
  alternative_readings:
  - 하나님의 사람
  - 하나님의 사람
  rationale: 히브리어 직역을 우선하되 한국어 관용과 문법적 매끄러움 사이의 긴장을 숨기지 않고, 번역 대안을 공개해 검토 가능성을 남겼습니다.
  doctrine_reference: 직역 충실성 및 용어 투명성
