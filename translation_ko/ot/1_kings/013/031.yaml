  to: 그 후 그가 그를 장사한 뒤에 자기 아들들에게 말했습니다. “내가 죽으면 하나님의 사람이 묻힌 무덤에 나를 장사하십시오. 그의 뼈 곁에 내 뼈를 두십시오.”
