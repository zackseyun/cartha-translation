base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/031.yaml
  text: And it happened, after he had buried him, that he said to his sons, “When I die, bury me in the tomb where the man of God is buried; lay my bones beside his bones.”
translation:
  language: ko
  text: 그가 그를 장사한 뒤에, 자기 아들들에게 말하여 이르되, “내가 죽으면, 하나님의 사람이 묻힌 무덤에 나를 장사하라. 그의 뼈 곁에 내 뼈를 두십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그 일이 일어났습니다
  alternatives_korean:
  - 그리고 마침내
  - 그 후에
  lexicon: HALOT
  rationale: 히브리 서사 도입어의 진행감을 살리되, 한국어에서는 지나치게 기계적인 ‘그리고 일이 일어났습니다’보다 자연스러운 서술로 옮겼습니다.
- source_word: אַחֲרֵי קָבְרוֹ אֹתוֹ
  english_pob_choice: after he had buried him
  chosen_korean: 그를 장사한 뒤에
  alternatives_korean:
  - 그를 매장한 뒤에
  - 그를 묻은 뒤에
  lexicon: HALOT
  rationale: 선행 완료를 나타내는 시간 표현이므로 ‘뒤에’로 자연스럽게 처리했고, 장례 맥락을 드러내기 위해 ‘장사하다’를 선택했습니다.
- source_word: בַּקֶּבֶר
  english_pob_choice: in the tomb
  chosen_korean: 무덤에
  alternatives_korean:
  - 묘실에
  - 묘에
  lexicon: HALOT
  rationale: 이 구절은 여러 뼈를 함께 둘 수 있는 특정 매장지를 가리키므로, 한국어에서도 구체적 매장지인 ‘무덤’이 가장 적절합니다.
- source_word: הַנִּיחוּ אֶת עַצְמֹתָי
  english_pob_choice: lay my bones
  chosen_korean: 내 뼈를 두십시오
  alternatives_korean:
  - 내 뼈를 놓으십시오
  - 내 뼈를 두십시오
  lexicon: HALOT
  rationale: 히브리어 명령형의 직접성을 살리면서도, 뼈를 ‘곁에’ 두는 장례 문맥에 맞게 간결하게 옮겼습니다.
theological_decisions:
- issue: 직접 화법 안의 청유/명령 체계
  chosen_reading: 아들에게 하는 지시이므로 본문 전체는 평서형 서술, 직접 인용 안에서는 정중한 명령형(‘두십시오’)을 사용했습니다.
  alternative_readings:
  - ‘두어라’처럼 반말형으로 옮길 수 있음
  - ‘두라’처럼 전통적 명령형으로 옮길 수 있음
  rationale: 히브리어는 아들에게 내리는 실제 유언이지만, 현대 한국어 성경의 합쇼체 기준을 유지하되 직접 인용의 명령성을 보존했습니다.
  doctrine_reference: 문체/화행 일관성
- issue: ‘장사하다’의 선택
  chosen_reading: 단순한 ‘묻다’보다 장례·매장 행위를 분명히 하는 ‘장사하다’를 사용했습니다.
  alternative_readings:
  - 묻다
  - 매장하다
  rationale: 문맥이 일상적 묻기가 아니라 뼈를 함께 두는 무덤 매장으로 이어지므로, 장례 의미를 분명히 드러내는 어휘가 적절합니다.
  doctrine_reference: 본문 문맥 충실성
