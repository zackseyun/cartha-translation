  language: ko
  text: 그가 그에게 말했습니다. "나와 함께 집으로 가서 빵을 먹으십시오."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘빵’은 더 넓게 ‘음식’이나 ‘식사’의 뜻으로도 쓰일 수 있습니다. 여기서는 원문의 기본어를 살려 ‘빵’으로 옮겼습니다.
    reason: lexical_alternative
