  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ הָיֹ֨ה יִהְיֶ֜ה הַ/דָּבָ֗ר אֲשֶׁ֤ר קָרָא֙ בִּ/דְבַ֣ר יְהוָ֔ה עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֑ל וְ/עַל֙ כָּל בָּתֵּ֣י הַ/בָּמ֔וֹת אֲשֶׁ֖ר בְּ/עָרֵ֥י שֹׁמְרֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/032.yaml
  text: For the word that he cried out by the word of Yahweh against the altar that is in Bethel[a], and against all the houses of the high places that are in the cities of Samaria[b], will surely come to pass.
  footnotes:
  - marker: a
    text: Or 'will certainly come to pass.' The Hebrew uses an infinitive absolute with an imperfect verb to intensify certainty.
    reason: lexical_alternative
  - marker: b
    text: Or 'all the shrines of the high places.' Literally, 'all the houses of the high places.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 야훼의 말씀으로 외친 그 말은 — 벧엘에 있는 그 제단과 사마리아의 여러 도시들에 있는 모든 산당들의 집들에 대하여 말한 그 말은 — 반드시 이루어질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘산당들의 집들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그는
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 앞절의 장례 요청에 대한 이유를 이어 주는 접속이지만, 한국어에서는 자연스럽게 앞말을 받아 설명하는 구조로 풀어 썼습니다.
- source_word: הָיֹה יִהְיֶה
  english_pob_choice: will surely come to pass
  chosen_korean: 반드시 이루어질 것입니다
  alternatives_korean:
  - 반드시 일어날 것입니다
  - 틀림없이 이루어질 것입니다
  lexicon: HALOT
  rationale: 히브리어의 강조형(부정확이 아닌 확실성)을 한국어의 ‘반드시’로 살리고, 예언 성취의 뉘앙스를 ‘이루어지다’로 자연스럽게 옮겼습니다.
- source_word: דָּבָר
  english_pob_choice: the word
  chosen_korean: 그 말
  alternatives_korean:
  - 그 말씀
  - 그 말씀의 내용
  lexicon: HALOT
  rationale: 예언적 선언의 내용이라는 점을 살리되, 반복되는 ‘말씀’을 남용하지 않기 위해 첫 번째는 ‘그 말’로 옮기고 뒤에서 다시 ‘말한 그 말’로 보강했습니다.
- source_word: בִּדְבַר יְהוָה
  english_pob_choice: by the word of Yahweh
  chosen_korean: 야훼의 말씀으로
  alternatives_korean:
  - 야훼의 말씀에 따라
  - 야훼의 말씀에 의하여
  lexicon: HALOT
  rationale: 원문의 도구·근거 관계를 한국어 조사 ‘-으로’로 표현했습니다. 신명기적 예언 공식의 직접성을 유지했습니다.
- source_word: בְּבֵית אֵל
  english_pob_choice: in Bethel
  chosen_korean: 벧엘에 있는
  alternatives_korean:
  - 벧엘에
  - 벧엘의
  lexicon: HALOT
  rationale: 장소를 자연스럽게 수식하도록 ‘있는’을 넣어 한국어 문장 흐름을 정리했습니다.
- source_word: כָּל בָּתֵּי הַבָּמוֹת
  english_pob_choice: all the houses of the high places
  chosen_korean: 모든 산당들의 집들
  alternatives_korean:
  - 모든 산당들의 집
  - 모든 산당 예배소들
  lexicon: HALOT
  rationale: 직역에 가까운 구조를 유지해 ‘집들’과 ‘산당들’의 중첩을 보존했습니다. 전통적 평탄화인 ‘산당 예배소’는 원문 구조를 약화시킬 수 있어 피했습니다.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  english_pob_choice: in the cities of Samaria
  chosen_korean: 사마리아의 여러 도시들에 있는
  alternatives_korean:
  - 사마리아 성읍들에 있는
  - 사마리아의 도시들에 있는
  lexicon: HALOT
  rationale: 열왕기의 지역 표기를 그대로 살리되, 복수성을 분명히 하기 위해 ‘여러 도시들’로 옮겼습니다.
theological_decisions:
- issue: 예언 성취의 확실성 표현
  chosen_reading: 반드시 이루어질 것입니다
  alternative_readings:
  - 반드시 일어날 것입니다
  - 틀림없이 이루어질 것입니다
  rationale: 히브리어의 강조형은 단순 미래보다 확정된 성취를 뜻하므로, 문학적 과장을 더하지 않으면서도 예언의 필연성을 분명히 드러냈습니다.
  doctrine_reference: 'Translation philosophy: optimal-equivalence; preserve source plain sense'
- issue: 야훼의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 여호와 대체어가 아니라 신명기적 고유 이름 יְהוָה를 사용하므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
