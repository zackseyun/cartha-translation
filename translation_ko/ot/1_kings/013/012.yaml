  text: And their father said to them, “Which way did he go?” For his sons had seen the way that the man of God, who came from Judah, had gone.
translation:
  language: ko
  text: 그들의 아버지가 그들에게 말했습니다. “그가 어느 길로 갔습니까?” 그의 아들들이 유다에서 온 하나님의 사람이 간 길을 보았기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말했습니다
  - 이야기했습니다
  lexicon: HALOT
  rationale: 대화 도입의 서술 동사로는 한국어에서 자연스러운 ‘말했습니다’가 원문의 서술 기능을 잘 살립니다.
- source_word: אֵי זֶה הַדֶּרֶךְ
  english_pob_choice: Which way
  chosen_korean: 어느 길
  alternatives_korean:
  - 어떤 길
  - 어느 쪽 길
  lexicon: HALOT
  rationale: 위치가 아니라 경로를 묻는 표현이므로 ‘어느 길’이 원문의 질문 의도를 가장 직접적으로 옮깁니다.
- source_word: בָנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들이
  alternatives_korean:
  - 아들들이
  - 그 아들들이
  lexicon: HALOT
  rationale: 접미사의 소유 관계를 분명히 드러내기 위해 ‘그의 아들들’로 옮겼습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 선지자
  - 하나님의 종
  lexicon: HALOT
  rationale: 이 표현은 히브리어 관용구로서 ‘하나님의 사람’이 가장 직접적이며, 보다 해석적인 ‘선지자’는 좁혀 번역하는 것입니다.
- source_word: מִיהוּדָה
  english_pob_choice: from Judah
  chosen_korean: 유다에서 와서
  alternatives_korean:
  - 유다에서
  - 유다로부터
  lexicon: HALOT
  rationale: ‘와서’는 바로 앞의 ‘간’과 짝을 이루어 출발지와 이동 방향을 자연스럽게 드러내며, 원문의 이동 서술을 살립니다.
