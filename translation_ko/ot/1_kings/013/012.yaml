  terminology: אִישׁ הָאֱלֹהִים는 해석적으로 ‘선지자’로 좁히지 않고 ‘하나님의 사람’으로 유지했습니다. יהודה는 ‘유다’, דֶּרֶךְ는 문맥상 ‘길’로 적절합니다.
