  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בִּ/דְבַ֣ר יְהוָ֔ה וַ/יֹּ֨אמֶר֙ מִזְבֵּ֣חַ מִזְבֵּ֔חַ כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנֵּֽה בֵ֞ן נוֹלָ֤ד לְ/בֵית דָּוִד֙ יֹאשִׁיָּ֣הוּ שְׁמ֔/וֹ וְ/זָבַ֣ח עָלֶ֗י/ךָ אֶת כֹּהֲנֵ֤י הַ/בָּמוֹת֙ הַ/מַּקְטִרִ֣ים עָלֶ֔י/ךָ וְ/עַצְמ֥וֹת אָדָ֖ם יִשְׂרְפ֥וּ עָלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/002.yaml
  text: 'And he cried out against the altar by the word of Yahweh and said[a], “Altar, altar, thus says Yahweh: Behold, a son will be born to the house of David, Josiah by name, and he will sacrifice on you the priests of the high places who burn incense on you[c][b], and human bones will be burned on you.”'
  footnotes:
  - marker: a
    text: Or, 'at the word of the LORD' or 'according to the word of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'he will slaughter on you.' The Hebrew verb is sacrificial in tone, which may intentionally underscore the desecration of the altar.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'bones of אדם'; here אדם is used generically, hence 'human bones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 야훼의 말씀으로 제단을 향해 외치며 말했습니다. 「제단아, 제단아, 야훼께서 이렇게 말씀하십니다. 보십시오, 다윗의 집에 요시야라는 이름의 아들이 태어날 것이며, 그가 네 위에서 네 위에서 분향하는 산당 제사장들을 제물로 바치고, 사람의 뼈를 네 위에서 태울 것입니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제물로 바치고’는 히브리어 זבח의 제의적 뉘앙스를 살린 번역입니다. 문맥상 ‘죽이다’나 ‘잡아 죽이다’도 가능하지만, 제단을 향한 모독과 심판의 역설을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘사람의 뼈’는 일반적인 인간을 가리키므로, 성별을 특정하지 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא עַל
  english_pob_choice: cried out against
  chosen_korean: 향해 외치다
  alternatives_korean:
  - 외쳐 말하다
  - 선포하다
  - 대항하여 외치다
  lexicon: HALOT
  rationale: עַל이 붙은 קרא는 단순한 발화보다 대상에 향한 강한 공적 외침을 나타내므로, 제단을 향한 예언적 외침이라는 힘을 살려 번역했습니다.
- source_word: בִּדְבַר יְהוָה
  english_pob_choice: by the word of Yahweh
  chosen_korean: 야훼의 말씀으로
  alternatives_korean:
  - 야훼의 말씀에 따라
  - 야훼의 말씀에 의하여
  lexicon: HALOT
  rationale: 예언적 권위를 나타내는 표지이므로, 행위의 출처와 수단을 함께 드러내는 자연스러운 표현으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유한 신명 טעטר그래마톤을 제목으로 바꾸지 않고, 프로젝트 기본값에 따라 야훼로 음역했습니다.
- source_word: וְזָבַח עָלֶיךָ
  english_pob_choice: he will sacrifice on you
  chosen_korean: 그가 네 위에서 ... 제물로 바치고
  alternatives_korean:
  - 그가 네 위에서 ... 제사하고
  - 그가 네 위에서 ... 희생제물로 바치고
  - 그가 네 위에서 ... 죽일 것이고
  lexicon: HALOT
  rationale: זבח의 제의적 뉘앙스와 제단에 대한 조롱·모독의 뜻을 함께 살리기 위해, 단순한 '죽이다'보다 '제물로 바치다'를 택했습니다.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  english_pob_choice: the priests of the high places
  chosen_korean: 산당 제사장들
  alternatives_korean:
  - 산당의 제사장들
  - 높은 곳의 제사장들
  lexicon: HALOT
  rationale: בָּמוֹת는 왕국기 문맥의 제의 장소인 산당을 가리키므로, 관용적으로 이해되는 '산당'을 사용했습니다.
- source_word: הַמַּקְטִרִים עָלֶיךָ
  english_pob_choice: who burn incense on you
  chosen_korean: 분향하는
  alternatives_korean:
  - 향을 피우는
  - 분향하여 섬기는
  - 제사 연기를 올리는
  lexicon: HALOT
  rationale: קטר는 제의적 향불 올림을 가리키므로, 한국어 성경에서 널리 쓰이는 '분향하다'를 사용해 제의 행위를 분명히 했습니다.
- source_word: וְעַצְמוֹת אָדָם
  english_pob_choice: human bones
  chosen_korean: 사람의 뼈
  alternatives_korean:
  - 인간의 뼈
  - 사람 뼈
  - 인류의 뼈
  lexicon: HALOT
  rationale: אדם이 여기서는 남성 특정이 아니라 일반 인간을 가리키므로, 자연스럽고 포괄적인 '사람의 뼈'로 옮겼습니다.
theological_decisions:
- issue: 예언된 제단 모독의 제의적 표현
  chosen_reading: 제물로 바치고
  alternative_readings:
  - 죽이고
  - 죽일 것이고
  - 희생제물로 바치고
  rationale: 본문은 단순 살해보다 제의적 희생 언어를 통해 제단과 산당 체제를 역전시키는 심판을 드러내므로, 그 긴장을 유지했습니다.
  doctrine_reference: 'POB translation principle: preserve sacrificial register where the Hebrew verb is intentionally cultic'
- issue: 사람의 뼈의 보편적 의미
  chosen_reading: 사람의 뼈
  alternative_readings:
  - 남자의 뼈
  - 인간의 뼈
  rationale: אָדָם의 일반적 의미를 유지하여 성별을 불필요하게 한정하지 않았습니다.
  doctrine_reference: 'Contested terms: אָדָם adam → man / humankind (context)'
