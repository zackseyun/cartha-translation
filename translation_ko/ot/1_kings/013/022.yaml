  text: וַ/תָּ֗שָׁב וַ/תֹּ֤אכַל לֶ֨חֶם֙ וַ/תֵּ֣שְׁתְּ מַ֔יִם בַּ/מָּקוֹם֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֵלֶ֔י/ךָ אַל תֹּ֥אכַל לֶ֖חֶם וְ/אַל תֵּ֣שְׁתְּ מָ֑יִם לֹֽא תָב֥וֹא נִבְלָתְ/ךָ֖ אֶל קֶ֥בֶר אֲבֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/022.yaml
  text: but you came back and ate bread and drank water in the place about which he said to you[a], ‘Do not eat bread, and do not drink water’—your corpse shall not come to the tomb of your fathers.
  footnotes:
  - marker: a
    text: Or, 'your corpse shall not enter the grave of your fathers.' The Hebrew literally says 'shall not come to the tomb of your fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신은 돌아와서 그곳에서 빵을 먹고 물을 마셨습니다. 그분이 당신에게 「빵을 먹지 말고, 물을 마시지 말라」고 말씀하신 그곳에서 말입니다 — 당신의 시체는 당신의 조상들의 무덤에 들어가지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘당신의 시체는 당신의 조상들의 무덤에 들어가지 못할 것입니다.’ 히브리어는 문자적으로 ‘당신의 시체는 당신의 조상들의 무덤에 오지 못할 것이다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשָׁב
  english_pob_choice: you came back
  chosen_korean: 돌아와서
  alternatives_korean:
  - 되돌아와서
  - 다시 돌아와서
  lexicon: HALOT
  rationale: 회상형 서술의 흐름을 살리면서 현대 한국어로 자연스럽게 반영했습니다.
- source_word: וַתֹּאכַל לֶחֶם / וַתֵּשְׁתְּ מַיִם
  english_pob_choice: ate bread / drank water
  chosen_korean: 빵을 먹고 물을 마셨습니다
  alternatives_korean:
  - 떡을 먹고 물을 마셨습니다
  - 빵을 먹고 물을 마셨습니다
  lexicon: HALOT
  rationale: הֶלֶם/לֶחֶם의 기본 표지인 ‘빵’을 유지해 금지 명령과의 반복 효과를 살렸습니다.
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אֵלֶי/ךָ
  english_pob_choice: in the place about which he said to you
  chosen_korean: 그분이 당신에게 말씀하신 그곳에서
  alternatives_korean:
  - 그분이 당신에게 말씀하신 곳에서
  - 당신에게 말씀하신 그 장소에서
  lexicon: HALOT
  rationale: ‘장소에 관해 말하다’라는 히브리어 관계절을 한국어에서 자연스러운 지시구문으로 풀어, 장소와 명령의 연결을 유지했습니다.
- source_word: נִבְלָתְ/ךָ
  english_pob_choice: your corpse
  chosen_korean: 당신의 시체
  alternatives_korean:
  - 당신의 시신
  - 당신의 주검
  lexicon: HALOT
  rationale: נבלה의 강한 사후 육체 표지를 분명히 드러내면서도 현대 독자가 바로 이해할 수 있는 표현으로 옮겼습니다.
- source_word: אֶל קֶבֶר אֲבֹתֶי/ךָ
  english_pob_choice: to the tomb of your fathers
  chosen_korean: 당신의 조상들의 무덤에
  alternatives_korean:
  - 당신의 조상들의 묘에
  - 당신의 조상들의 무덤으로
  lexicon: HALOT
  rationale: קבר를 가족 매장지를 뜻하는 ‘무덤’으로 옮겨, POB의 ‘tomb of your fathers’가 지닌 세대적·가문적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 금지명령 위반과 장례 거부의 관계
  chosen_reading: 본문은 죽음 이후의 일반적 불명예가 아니라, 조상들의 무덤에 안치되지 못하는 구체적 심판을 말합니다.
  alternative_readings:
  - 단순한 상징적 수치의 표현
  - 일반적인 사후 불명예 선언
  rationale: 히브리어는 ‘그의 시체가 아버지들의 무덤에 오지 못한다’고 직설적으로 말하므로, 그 구체성을 약화하지 않았습니다.
  doctrine_reference: 본문의 물리적·사회적 심판 진술을 보존
