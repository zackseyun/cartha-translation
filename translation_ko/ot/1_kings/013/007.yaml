base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/007.yaml
  text: Then the king said to the man of God[a], “Come home with me and eat, and I will give you a gift.”
  footnotes:
  - marker: a
    text: Or “and eat” / “and take food”; the Hebrew verb can mean to strengthen or sustain oneself, often by a meal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 하나님의 사람에게 말했습니다. 「나와 함께 집으로 와서 먹고, 내가 너에게 선물을 주겠습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “먹고”; 히브리어 동사는 자신을 강하게 하거나 유지한다는 뜻으로, 흔히 식사를 통해 그렇게 한다는 의미가 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 임금
  lexicon: HALOT
  rationale: 본문의 특정 왕을 가리키는 פשוט한 정관 표현이므로 표준적인 ‘왕’으로 옮겼습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 하나님의 선지자
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 인물의 호칭을 보존했습니다. ‘선지자’로 풀어 쓰면 원문 표현이 약화됩니다.
- source_word: בֹּאָה אִתִּי הַבַּיְתָה
  english_pob_choice: Come home with me
  chosen_korean: 나와 함께 집으로 와서
  alternatives_korean:
  - 나와 함께 집에 들어와서
  - 나와 집으로 와서
  lexicon: HALOT
  rationale: 초대의 방향성을 살려 ‘집으로’와 동행 표현 ‘나와 함께’를 함께 반영했습니다.
- source_word: וּסְעָדָה
  english_pob_choice: and eat
  chosen_korean: 먹고
  alternatives_korean:
  - 식사하고
  - 기운을 차리고
  - 먹어서 힘을 내고
  lexicon: HALOT
  rationale: 이 동사는 여기서 식사로 자신을 보강하는 뜻이므로, 본문과 주석의 의미를 반영해 간명하게 ‘먹고’로 옮겼습니다.
- source_word: מַתָּת
  english_pob_choice: a gift
  chosen_korean: 선물
  alternatives_korean:
  - 예물
  - 증정품
  - 보상
  lexicon: HALOT
  rationale: 왕이 제안하는 자발적 증여의 뉘앙스를 살려 가장 중립적인 ‘선물’을 선택했습니다.
