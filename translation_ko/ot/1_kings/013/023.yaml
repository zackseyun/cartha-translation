review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘나귀를 안장에 얹어 주었는데’는 안장을 나귀 위에 얹는다는 히브리어 동작 관계를 거꾸로 표현합니다. 또한 ‘그러했습니다’는 히브리어에 없는 대용 동사를 덧붙여 문장을 부자연스럽고 불명확하게 만듭니다. הֱשִׁיבוֹ의 사역 의미는 ‘되돌아오게 한’으로 보존해야 합니다.
  naturalness: ‘나귀에 안장을 얹었습니다’와 ‘예언자를 위해’가 현대 표준 한국어 합쇼체에서 자연스럽고 정확합니다. 반복되는 대명사 ‘그’는 원문의 지시 관계를 무리하게 특정하지 않으면서 문맥상 기능합니다.
  terminology: לֶחֶם은 ‘빵’, חֲמוֹר는 ‘나귀’, נָבִיא는 ‘예언자’로 옮기는 것이 적절합니다. ‘되돌아오게 한’은 הֱשִׁיבוֹ의 사역형 의미를 직접적으로 반영합니다.
  issues:
  - severity: high
    issue: ‘나귀를 안장에 얹어 주었는데’
    rationale: וַיַּחֲבָשׁ לוֹ הַחֲמוֹר는 나귀에 안장을 얹어 타도록 준비했다는 뜻입니다. 초안은 나귀를 안장 위에 올려놓는 것으로 동작의 대상과 위치를 역전합니다.
  - severity: high
    issue: ‘곧 그가 되돌려 온 예언자에게 그러했습니다’
    rationale: 본문은 예언자를 위하여 나귀에 안장을 얹었다는 뜻이지, 별도의 ‘그러했습니다’라는 행위를 말하지 않습니다. ‘곧’과 대용 표현은 구문 관계를 흐립니다.
  - severity: medium
    issue: ‘되돌려 온’
    rationale: 가능한 번역이지만 현대 한국어에서는 화자가 예언자를 물리적으로 데리고 왔다는 뜻으로 들릴 수 있습니다. 히브리어 사역형의 ‘돌아오게 하다’를 더 직접적으로 나타내는 표현이 안전합니다.
  revised_text: 그리하여 그가 빵을 먹고 마신 뒤에, 그는 자기가 되돌아오게 한 예언자를 위해 나귀에 안장을 얹었습니다.[a]
