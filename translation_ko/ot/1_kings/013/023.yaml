  text: וַ/יְהִ֗י אַחֲרֵ֛י אָכְל֥/וֹ לֶ֖חֶם וְ/אַחֲרֵ֣י שְׁתוֹת֑/וֹ וַ/יַּחֲבָשׁ ל֣/וֹ הַ/חֲמ֔וֹר לַ/נָּבִ֖יא אֲשֶׁ֥ר הֱשִׁיבֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/023.yaml
  text: And it happened[a], after he had eaten bread and after he had drunk, that he saddled the donkey for him, for the prophet whom he had brought back.
  footnotes:
  - marker: a
    text: Or, 'whom he had caused to return.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 빵을 먹고 또 마신 뒤에, 그가 그에게 나귀를 안장에 얹어 주었는데, 곧 그가 되돌려 온 예언자에게 그러했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הֱשִׁיבוֹ는 문맥에 따라 ‘돌아오게 한’, ‘되돌려 온’의 뜻이 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고
  alternatives_korean:
  - 그 일이 있었습니다
  - 그리하여
  lexicon: HALOT
  rationale: 히브리어 서술 전환 표지로서 다음 사건을 이어 주는 기능이므로, 현대 한국어에서는 과도하게 서사적이지 않은 연결어로 처리했습니다.
- source_word: אַחֲרֵי אָכְלוֹ לֶחֶם וְאַחֲרֵי שְׁתוֹתוֹ
  english_pob_choice: after he had eaten bread and after he had drunk
  chosen_korean: 빵을 먹고 또 마신 뒤에
  alternatives_korean:
  - 먹은 뒤에 마신 뒤에
  - 빵을 먹은 뒤 또 마신 뒤에
  lexicon: HALOT
  rationale: 두 시간 부사절의 병렬을 한국어에서는 자연스럽게 압축하되, לֶחֶם의 ‘빵/음식’ 의미와 ‘마시다’의 대비를 살렸습니다.
- source_word: וַיַּחֲבָשׁ
  english_pob_choice: he saddled
  chosen_korean: 나귀를 안장에 얹어 주었는데
  alternatives_korean:
  - 나귀에 안장을 얹어 주었는데
  - 나귀에 안장 얹기를 했는데
  lexicon: HALOT
  rationale: חבש의 이 문맥상 의미는 단순히 ‘묶다’가 아니라 짐승을 타게 준비하는 행위이므로, 현대 독자가 이해할 수 있는 동작 묘사로 옮겼습니다.
- source_word: לַנָּבִיא אֲשֶׁר הֱשִׁיבוֹ
  english_pob_choice: for the prophet whom he had brought back
  chosen_korean: 곧 그가 되돌려 온 예언자에게 그러했습니다
  alternatives_korean:
  - 곧 그가 데려다 되돌린 예언자에게 그러했습니다
  - 곧 그가 돌아오게 한 예언자에게 그러했습니다
  lexicon: HALOT
  rationale: הֱשִׁיבוֹ의 인과적 ‘돌아오게 하다/되돌리다’ 의미를 반영하면서, ל의 수혜 대상 관계를 한국어 ‘~에게’로 자연스럽게 나타냈습니다.
theological_decisions:
- issue: לַנָּבִיא와 הֱשִׁיבוֹ의 관계를 어떻게 드러낼지
  chosen_reading: ‘그가 되돌려 온 예언자’로 옮겨, 단순한 이동이 아니라 이전 맥락에서 돌아오게 만든 행위를 드러냈습니다.
  alternative_readings:
  - ‘그가 데려온 예언자’
  - ‘그가 돌아오게 한 예언자’
  rationale: 본문은 예언자가 자발적으로 온 것이 아니라 앞선 설득/회귀 유도 맥락을 전제하므로, 원인적 뉘앙스를 유지하는 번역이 더 정확합니다.
  doctrine_reference: 서사 맥락 보존
