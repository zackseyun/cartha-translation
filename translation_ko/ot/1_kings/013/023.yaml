  - 곧 그가 데려다 되돌린 예언자에게 그러했습니다
  - 곧 그가 돌아오게 한 예언자에게 그러했습니다
  lexicon: HALOT
  rationale: הֱשִׁיבוֹ의 인과적 ‘돌아오게 하다/되돌리다’ 의미를 반영하면서, ל의 수혜 대상 관계를 한국어 ‘~에게’로 자연스럽게 나타냈습니다.
theological_decisions:
- issue: לַנָּבִיא와 הֱשִׁיבוֹ의 관계를 어떻게 드러낼지
  chosen_reading: ‘그가 되돌려 온 예언자’로 옮겨, 단순한 이동이 아니라 이전 맥락에서 돌아오게 만든 행위를 드러냈습니다.
  alternative_readings:
  - ‘그가 데려온 예언자’
  - ‘그가 돌아오게 한 예언자’
  rationale: 본문은 예언자가 자발적으로 온 것이 아니라 앞선 설득/회귀 유도 맥락을 전제하므로, 원인적 뉘앙스를 유지하는 번역이 더 정확합니다.
  doctrine_reference: 서사 맥락 보존
