base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/008.yaml
  text: But the man of God said to the king[a], “If you were to give me half your house, I would not go with you, nor would I eat bread or drink water in this place.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''half your house.'' The phrase may idiomatically imply a very large reward or estate, but the translation keeps the literal wording.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 하나님의 사람이 왕에게 말했습니다. 「설령 당신이 내게 당신의 집 반을 준다고 해도, 나는 당신과 함께 가지 않을 것이고, 이곳에서 빵도 먹지 않고 물도 마시지 않을 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘당신의 집 반’이라고 말합니다. 여기서는 과장된 보상 제안을 가리키는 관용적 표현일 수 있으나, 번역은 문자적 이미지를 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 선지자
  - 하나님 사람
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현을 그대로 살려, 직분을 해석적으로 좁히지 않고 ‘하나님의 사람’으로 옮겼습니다.
- source_word: אִם תִּתֶּן לִי אֶת חֲצִי בֵיתֶךָ
  english_pob_choice: If you were to give me half your house
  chosen_korean: 설령 당신이 내게 당신의 집 반을 준다고 해도
  alternatives_korean:
  - 당신이 내게 당신의 집 반을 준다면
  - 당신의 재산 절반을 내게 준다면
  lexicon: HALOT
  rationale: ‘집 반’이라는 히브리어 이미지를 보존하되, 한국어에서는 조건의 양보를 자연스럽게 드러내기 위해 ‘설령 … 준다고 해도’로 옮겼습니다.
- source_word: לֶחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 음식
  lexicon: HALOT
  rationale: 문자적으로는 ‘빵’이지만, 현대 한국어에서 자연스럽고 본문의 먹지 않겠다는 금지 의미를 선명하게 전달합니다.
- source_word: מַּיִם
  english_pob_choice: water
  chosen_korean: 물
  alternatives_korean:
  - 샘물
  - 식수
  lexicon: HALOT
  rationale: 평이하고 პირდაპირ적인 대응어인 ‘물’을 사용해 대구를 유지했습니다.
theological_decisions:
- issue: 왕의 호의보다 하나님의 명령에 대한 절대적 순종을 강조하는 어조
  chosen_reading: 거절을 단호하게 드러내되, 예의상 완곡하게 흐리지 않고 ‘나는 … 않을 것입니다’로 옮겼습니다.
  alternative_readings:
  - ‘가지 않겠습니다’처럼 더 부드럽게 표현
  - ‘절대 가지 않겠습니다’처럼 강조
  rationale: 문맥상 선지자는 왕의 제안을 정중히 거절하지만, 본문의 핵심은 타협하지 않는 순종입니다. 그래서 단호함은 살리되 과장은 피했습니다.
  doctrine_reference: 예언자적 순종과 왕권보다 하나님의 말씀의 우위
