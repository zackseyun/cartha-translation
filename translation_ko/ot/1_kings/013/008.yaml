  text: But the man of God said to the king[a], “If you were to give me half your house, I would not go with you, nor would I eat bread or drink water in this place.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''half your house.'' The phrase may idiomatically imply a very large reward or estate, but the translation keeps the literal wording.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 하나님의 사람이 왕에게 말했습니다. “왕께서 저에게 왕의 집 절반을 주신다 해도[a], 저는 왕과 함께 가지 않겠습니다. 또 이곳에서는 빵을 먹지도 물을 마시지도 않겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘왕의 집 절반’. 이 표현은 매우 큰 보상이나 영지를 가리키는 관용적 표현일 수 있으나, 번역은 문자적 표현을 유지합니다.'
    reason: lexical_alternative
