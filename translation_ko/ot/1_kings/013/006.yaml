base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/006.yaml
  text: Then the king answered and said to the man of God[a], “Please entreat the favor of Yahweh your God, and pray for me, that my hand may be restored to me.” So the man of God entreated the favor of Yahweh, and the king’s hand was restored to him and became as it was before.
  footnotes:
  - marker: a
    text: Or 'seek the favor of the LORD.' The Hebrew idiom is literally 'entreat the face of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 하나님의 사람에게 대답하여 말했습니다. 「부디 야훼 당신의 하나님께 은혜를 구하고, 나를 위해 기도해 주십시오. 내 손이 내게 회복되게 해주십시오」. 그러자 하나님의 사람이 야훼의 은혜를 구했고, 왕의 손이 그에게 회복되어 이전과 같아졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구인 ‘여호와의 얼굴을 구하다’는 ‘은혜를 구하다/간구하다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 말했습니다
  - 응답하여 말했습니다
  lexicon: WLC / narrative formula
  rationale: 히브리어의 관용적 서술쌍을 살리면서도 한국어에서 자연스럽고 문어체다운 표현으로 옮겼습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 선지자
  lexicon: HALOT
  rationale: 본문의 직함을 그대로 보존해 예언자적 호칭을 유지했고, 해석을 더한 '선지자'로 바꾸지 않았습니다.
- source_word: חַל ... אֶת פְּנֵי יְהוָה
  english_pob_choice: entreat the favor of Yahweh
  chosen_korean: 야훼 당신의 하나님께 은혜를 구하고
  alternatives_korean:
  - 야훼의 얼굴을 간구하고
  - 야훼의 은혜를 구하고
  - 야훼께 은총을 간구하고
  lexicon: HALOT
  rationale: ‘얼굴을 구하다’라는 히브리어 관용을 한국어로는 ‘은혜를 구하다’로 자연스럽게 풀되, 청유의 간청이라는 의미를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: project default
  rationale: 공개 프로젝트 기본 원칙에 따라 신명사철을 '야훼'로 옮겨 고유 이름성을 유지했습니다.
- source_word: וְהִתְפַּלֵּל בַּעֲדִי
  english_pob_choice: and pray for me
  chosen_korean: 나를 위해 기도해 주십시오
  alternatives_korean:
  - 나를 위해 간구해 주십시오
  - 나를 대신하여 기도해 주십시오
  lexicon: HALOT
  rationale: 중보적 기도를 현대 한국어로 직접적이고 분명하게 옮겼습니다.
- source_word: וְתָשֹׁב יָדִי אֵלָי
  english_pob_choice: that my hand may be restored to me
  chosen_korean: 내 손이 내게 회복되게 해주십시오
  alternatives_korean:
  - 내 손이 내게 돌아오게 해주십시오
  - 내 손이 다시 내게 오게 해주십시오
  lexicon: HALOT
  rationale: ‘돌아오다’의 직역보다 손의 상태가 회복되는 의미를 더 분명하게 드러내기 위해 ‘회복되다’를 선택했습니다.
- source_word: וַתָּשָׁב יַד הַמֶּלֶךְ אֵלָיו וַתְּהִי כְּבָרִאשֹׁנָה
  english_pob_choice: the king’s hand was restored to him and became as it was before
  chosen_korean: 왕의 손이 그에게 회복되어 이전과 같아졌습니다
  alternatives_korean:
  - 왕의 손이 그에게 돌아와 처음과 같아졌습니다
  - 왕의 손이 회복되어 전과 같아졌습니다
  lexicon: HALOT
  rationale: 회복과 상태 복원을 함께 담되, 한국어에서 중복을 줄여 간결하게 정리했습니다.
theological_decisions:
- issue: 왕이 야훼를 '당신의 하나님'이라고 부르는 표현
  chosen_reading: 그대로 '야훼 당신의 하나님'으로 유지했습니다.
  alternative_readings:
  - 우리 하나님
  - 야훼 나의 하나님
  rationale: 왕이 선지자와 하나님 사이의 관계를 인정하면서도 자신을 그 범주와 동일시하지 않는 긴장을 보존해야 하므로, 화자를 더 포섭하는 표현으로 바꾸지 않았습니다.
  doctrine_reference: 본문의 화자 의도와 신학적 긴장을 보존
- issue: 직접화법의 공손체
  chosen_reading: 왕의 청원은 공손한 명령형/청유형으로, 하나님의 사람의 응답 서술은 평서체로 유지했습니다.
  alternative_readings:
  - 전면 평서체
  - 더 경어적인 기도체
  rationale: 본문은 왕의 간청과 서술자의 객관적 진술을 구분하므로, 한국어에서도 직접화법의 예절과 서술의 중립성을 구별해 전달했습니다.
  doctrine_reference: 담화 등록 유지
