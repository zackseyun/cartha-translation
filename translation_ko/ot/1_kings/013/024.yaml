  source_fidelity: 히브리어의 연속 서술(그가 감–사자가 길에서 그를 발견함–죽임)과 수동 분사가 나타내는 시체의 ‘던져진 상태’, 그리고 나귀와 사자가 서 있는 장면을 대체로 충실히 옮겼습니다. 다만 각주 표지가 본문의 해당 표현에 붙어 있지 않아, 수동 분사에 관한 주석의 연결이 불명확합니다.
  naturalness: 본문은 현대 표준 한국어의 격식 있는 서술로 자연스럽습니다. ‘그가 가니’는 히브리어 서사의 순차적 진행을 간결하게 살린 표현이며, ‘서 있었으며/서 있었습니다’도 장면 묘사에 적절합니다.
  terminology: ‘사자’, ‘나귀’, ‘시체’는 문맥과 원어 의미에 맞습니다. ‘던져져 있었다’는 מֻשְׁלֶכֶת의 수동성과 결과 상태를 잘 반영합니다.
