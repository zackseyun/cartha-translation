source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ וַ/יִּמְצָאֵ֧/הוּ אַרְיֵ֛ה בַּ/דֶּ֖רֶךְ וַ/יְמִיתֵ֑/הוּ וַ/תְּהִ֤י נִבְלָת/וֹ֙ מֻשְׁלֶ֣כֶת בַּ/דֶּ֔רֶךְ וְ/הַ/חֲמוֹר֙ עֹמֵ֣ד אֶצְלָ֔/הּ וְ/הָ֣/אַרְיֵ֔ה עֹמֵ֖ד אֵ֥צֶל הַ/נְּבֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/024.yaml
  text: And he went[a], and a lion found him on the road and killed him. And his corpse was cast on the road, and the donkey was standing beside it, and the lion was standing beside the corpse.
  footnotes:
  - marker: a
    text: Or 'his dead body was lying thrown on the road'; the Hebrew passive participle emphasizes that the body had been cast down there rather than merely lying there.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 가니, 길에서 사자가 그를 만나 죽였습니다. 그리고 그의 시체는 길에 던져져 있었고, 나귀는 그 곁에 서 있었으며, 사자도 시체 곁에 서 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 시체가 길에 던져져 있었다’로 옮길 수 있습니다. 히브리어 수동 분사는 시체가 단지 놓여 있던 것이 아니라 ‘던져진 상태’였음을 강조합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: And he went
  chosen_korean: 그가 가니
  alternatives_korean:
  - 그가 갔습니다
  - 그리고 그가 갔습니다
  lexicon: WLC
  rationale: 서술 진행을 살리되, 한국어에서는 서사체의 자연스러운 연결을 위해 간결한 과거 진행형으로 옮겼습니다.
- source_word: וַיִּמְצָאֵהוּ אַרְיֵה בַּדֶּרֶךְ
  english_pob_choice: a lion found him on the road
  chosen_korean: 길에서 사자가 그를 만나
  alternatives_korean:
  - 길에서 사자가 그를 발견하고
  - 길에서 사자가 그를 찾아
  lexicon: WLC
  rationale: מָצָא의 기본값인 ‘찾다/만나다’ 중, 돌발적 조우의 장면을 살려 ‘만나다’로 옮겼습니다.
- source_word: נִבְלָתוֹ מֻשְׁלֶכֶת בַּדֶּרֶךְ
  english_pob_choice: his corpse was cast on the road
  chosen_korean: 그의 시체는 길에 던져져 있었고
  alternatives_korean:
  - 그의 시체는 길에 던져졌고
  - 그의 시체는 길에 버려져 있었고
  lexicon: WLC
  rationale: 수동 분사와 결과 상태를 함께 보이기 위해 ‘던져져 있었고’로 옮겨, 단순한 사건보다 그 상태의 지속을 드러냈습니다.
- source_word: וְהַחֲמוֹר עֹמֵד אֶצְלָהּ וְהָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  english_pob_choice: and the donkey was standing beside it, and the lion was standing beside the corpse
  chosen_korean: 나귀는 그 곁에 서 있었으며, 사자도 시체 곁에 서 있었습니다
  alternatives_korean:
  - 나귀는 그 옆에 서 있었으며, 사자도 시체 옆에 서 있었습니다
  - 나귀는 그 곁에 있었고, 사자도 시체 곁에 있었습니다
  lexicon: WLC
  rationale: עֹמֵד는 단순 존재보다 ‘서 있는’ 상태를 분명히 하므로 이를 유지했고, 반복되는 대구도 살렸습니다.
theological_decisions:
- issue: 잔혹한 사건 묘사의 직설성
  chosen_reading: 사자가 그를 만나 죽였고, 시체가 길에 던져져 있으며, 나귀와 사자가 함께 서 있는 장면을 그대로 유지했습니다.
  alternative_readings:
  - 완곡하게 죽임을 완화하는 표현
  - ‘사라졌다’처럼 상태를 흐리는 표현
  rationale: 본문은 경고의 성격을 지닌 서술로, 사건의 충격과 하나님의 경고 맥락을 희석하지 않는 직설적 묘사가 필요합니다.
  doctrine_reference: 서술의 사실성 보존
