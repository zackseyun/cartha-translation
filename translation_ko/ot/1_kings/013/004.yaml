  text: And when the king heard the word of the man of God[a], who cried out against the altar at Bethel, Jeroboam stretched out his hand from the altar, saying, “Seize him!” But his hand, which he stretched out against him, dried up, and he could not draw it back to himself.
  footnotes:
  - marker: a
    text: 'Or “withered.” Hebrew: “dried up.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 벧엘의 제단을 향하여 외친 하나님의 사람의 말을 듣자, 여로보암은 제단 위에서 자기 손을 내밀며 말했습니다. “그를 잡아라!” 그러나 그가 그에게 내민 손이 마르고 말아서, 그는 그것을 자기에게로 다시 거두어들일 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “시들다.” 히브리어는 “마르다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 선지자
  - 하나님의 종
  lexicon: HALOT
  rationale: 히브리어 직역에 가까운 표준적 호칭을 살려, 해설을 덧붙이는 ‘선지자’보다 원문 표현인 ‘하나님의 사람’을 유지했습니다.
- source_word: קָרָא עַל
  english_pob_choice: cried out against
  chosen_korean: 향하여 외친
  alternatives_korean:
  - 대하여 외친
  - 반대하여 외친
  lexicon: HALOT
  rationale: 문맥상 제단을 향한 예언적 외침이 핵심이므로, 한국어에서는 자연스럽게 ‘향하여 외친’으로 옮기되 적대적 방향성을 과도하게 해설하지 않았습니다.
- source_word: וַ/יִּשְׁלַ֨ח ... אֶת יָד֛/וֹ מֵ/עַ֥ל הַ/מִּזְבֵּ֖חַ
  english_pob_choice: stretched out his hand from the altar
  chosen_korean: 제단 위에서 자기 손을 내밀며
  alternatives_korean:
  - 제단에서 손을 뻗으며
  - 제단 위에서 손을 뻗으며
  lexicon: HALOT
  rationale: ‘손을 내밀다/뻗다’가 히브리어 관용구를 가장 자연스럽게 전달하므로, 제단 위에 있던 위치감을 함께 살렸습니다.
- source_word: וַ/תִּיבַ֤שׁ יָד/וֹ
  english_pob_choice: his hand ... dried up
  chosen_korean: 그가 그에게 내민 손이 마르고 말해서
  alternatives_korean:
  - 그가 내민 손이 말라버려서
  - 그의 손이 마르고 말해서
  lexicon: HALOT
  rationale: 히브리어의 ‘마르다’ 이미지를 그대로 살려, 전통적 ‘시들다’보다 원문의 물리적 정지를 드러내는 ‘마르고 말하다’를 택했습니다.
- source_word: לַ/הֲשִׁיבָ֥/הּ אֵלָֽי/ו
  english_pob_choice: draw it back to himself
  chosen_korean: 자기에게로 다시 거두어들일 수 없었습니다
  alternatives_korean:
  - 자기에게로 다시 돌릴 수 없었습니다
  - 자기에게로 다시 가져올 수 없었습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘되돌리다’ 의미를 반영하되, 굳어 움직이지 않는 손의 상태를 한국어로 가장 분명하게 나타내기 위해 ‘거두어들이다’를 사용했습니다.
theological_decisions:
- issue: 왕의 손에 대한 심판의 성격
  chosen_reading: 손이 실제로 즉시 마르는 신적 심판으로 직역해, 의학적 설명이나 비유적 완화 없이 사건의 충격을 그대로 드러냈습니다.
  alternative_readings:
  - ‘오그라들다’처럼 전통적 표현으로 옮겨 완화하기
  - 의학적 손상처럼 설명을 덧붙이기
  rationale: 본문은 제단을 향한 적대적 행위에 대한 즉각적 응답으로 손의 기능 상실을 제시하므로, 번역도 그 초자연적 심판의 힘을 약화시키지 않아야 합니다.
  doctrine_reference: 번역 철학 §§1, 3, 6
