revisions:
- from: 왕이 벧엘의 제단을 향하여 외친 하나님의 사람의 말을 듣자, 여로보암은 제단 위에서 자기 손을 내밀며 말했습니다. “그를 잡아라!” 그러나 그가 그에게 내민 손이 마르고 말아서, 그는 그것을 자기에게로 다시 거두어들일 수 없었습니다.[a]
  to: 왕이 벧엘에 있는 제단을 거슬러 외친 하나님의 사람의 말을 듣자, 여로보암은 제단에서 손을 뻗으며 말했습니다. “그를 잡아라!” 그러나 그가 그를 향해 뻗었던 손이 말라 버려[a], 그는 그 손을 자기에게로 도로 거둘 수 없었습니다.
  rationale: 원문의 적대적 외침(קָרָא עַל)과 손을 뻗은 행위 및 그 손의 불능 상태를 유지하되, 왕이 제단 위에 있었다는 함의를 피했습니다. 각주도 해당 어휘에 직접 연결하고 한국어 문장 형태를 정리했습니다.
  reviewer_model: gpt-5.6-terra
