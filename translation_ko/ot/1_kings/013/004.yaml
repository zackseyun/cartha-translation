    rationale: 문맥은 제단을 대상으로 한 심판 선언입니다. ‘제단을 거슬러 외친’은 ‘against’를 보존하면서도 한국어로 자연스럽습니다.
  - severity: low
    issue: 각주가 절 끝에 붙어 있어 ‘말라 버리다’라는 어휘 대안의 연결 지점이 불명확합니다.
