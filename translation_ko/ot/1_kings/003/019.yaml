id: 1KI.3.19
reference: 1 Kings 3:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֛מָת בֶּן הָ/אִשָּׁ֥ה הַ/זֹּ֖את לָ֑יְלָה אֲשֶׁ֥ר שָׁכְבָ֖ה עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/019.yaml
  text: And this woman's son died in the night[b][a], because she lay on him.
  footnotes:
  - marker: a
    text: Or 'at night.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'which/when she lay on him'; the clause is rendered causally here because the context indicates that her lying on him caused his death.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 여자의 아들은 밤에 죽었습니다. 그 여인이 그 위에 누웠기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘밤에’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그녀가 그 위에 누웠을 때/누워 있었던’. 문맥상 사망의 원인을 드러내기 위해 원인절로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: And ... died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 죽었습니다만
  - 죽어 있었습니다
  lexicon: WLC
  rationale: 서술형 완료 과거로 옮겨 사건의 발생을 자연스럽게 전달했습니다.
- source_word: בֶּן הָאִשָּׁה הַזֹּאת
  english_pob_choice: this woman's son
  chosen_korean: 이 여자의 아들
  alternatives_korean:
  - 이 여인의 아들
  - 이 여자의 아들아이
  lexicon: WLC
  rationale: 히브리어의 ‘아들’을 그대로 살리되, 한국어에서는 소유 표현으로 자연스럽게 옮겼습니다.
- source_word: לָיְלָה
  english_pob_choice: in the night
  chosen_korean: 밤에
  alternatives_korean:
  - 한밤중에
  - 밤중에
  lexicon: WLC
  rationale: 시간 부사구로서 사건이 일어난 때를 간결하고 표준적인 한국어로 표현했습니다.
- source_word: שָׁכְבָה עָלָיו
  english_pob_choice: because she lay on him
  chosen_korean: 그 위에 누웠기 때문입니다
  alternatives_korean:
  - 그 위에 엎드렸기 때문입니다
  - 그 위에 누워 있었기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘누워/눕다’와 전치사 ‘~위에’를 반영하되, 문맥상 사망 원인을 분명히 드러내는 한국어 원인 표현으로 옮겼습니다.
theological_decisions:
- issue: 아이가 죽은 원인을 본문이 어떻게 제시하는가
  chosen_reading: 본문은 단순한 시점 설명이 아니라, 여인이 그 위에 누운 행위가 사망의 원인임을 드러냅니다.
  alternative_readings:
  - 그녀가 그 위에 누운 시간에 죽었다는 단순 시점 이해
  - 원인을 약화한 중립적 병렬 해석
  rationale: 히브리어 관계절과 문맥을 따라 인과를 분명히 하여, POB의 영어 처리와 일치하게 원인성을 보존했습니다.
  doctrine_reference: 본문 해석상 문맥적 인과성
