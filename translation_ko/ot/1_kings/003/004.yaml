base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/004.yaml
  text: And the king went to Gibeon to sacrifice there[a], for that was the great high place. Solomon offered a thousand burnt offerings on that altar.
  footnotes:
  - marker: a
    text: Or 'the principal high place.' The Hebrew adjective can denote greatness in size or prominence.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 기브온으로 가서 거기서 제사드렸습니다. 그것은 그 큰 산당이었기 때문입니다. 솔로몬은 그 제단 위에 번제 천 마리를 드렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 주요한 산당’. 히브리어 형용사는 규모의 큼이나 중요성의 큼을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 갔습니다
  - 올라가서
  lexicon: HALOT
  rationale: 서사적 동작을 자연스러운 현대 한국어로 옮기되, 이어지는 목적절과 잘 이어지도록 ‘가서’로 처리했습니다.
- source_word: לִזְבֹּחַ
  english_pob_choice: to sacrifice
  chosen_korean: 제사드렸습니다
  alternatives_korean:
  - 제사했습니다
  - 희생제물을 바쳤습니다
  lexicon: HALOT
  rationale: זבח의 제의적 행위를 한국어 성경체에 맞게 ‘제사드리다’로 옮겨, 단순한 일반 희생이 아니라 제의 행위임을 드러냈습니다.
- source_word: הַבָּמָה הַגְּדוֹלָה
  english_pob_choice: the great high place
  chosen_korean: 그 큰 산당
  alternatives_korean:
  - 그 큰 높은 곳
  - 그 큰 제의처
  lexicon: HALOT
  rationale: בָּמָה의 기본 의미를 ‘산당’으로 유지하여 고대 이스라엘의 제의 장소라는 역사적·신학적 긴장을 보존했습니다.
- source_word: אֶלֶף עֹלוֹת
  english_pob_choice: a thousand burnt offerings
  chosen_korean: 번제 천 마리
  alternatives_korean:
  - 번제 천 제물
  - 번제 천 번
  lexicon: HALOT
  rationale: עֹלוֹת는 ‘번제’로 특정하고, 수량은 본문 그대로 ‘천 마리’로 옮겨 제물의 다수를 구체적으로 드러냈습니다.
- source_word: עַל הַמִּזְבֵּחַ הַהוּא
  english_pob_choice: on that altar
  chosen_korean: 그 제단 위에
  alternatives_korean:
  - 그 제단에서
  - 그 제단에
  lexicon: HALOT
  rationale: 전치사 עַל의 공간적 감각을 살려 ‘위에’로 옮겼고, 한국어에서 자연스럽게 ‘드렸습니다’와 결합되도록 했습니다.
theological_decisions:
- issue: בָּמָה를 현대 독자에게 어떻게 제시할지
  chosen_reading: ‘산당’으로 직역해, 예루살렘 성전 이전의 공인된 제의 장소라는 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - ‘제단’
  - ‘제의처’
  - ‘높은 곳’
  rationale: 본문은 단순한 지리적 높은 곳이 아니라 예배/제사의 장소를 말하므로, 전통적으로도 널리 쓰이는 ‘산당’을 유지하는 것이 본문의 역사·신학적 무게를 보존합니다.
  doctrine_reference: Translation philosophy §3, §5
