revisions:
- from: 왕이 기브온으로 가서 거기서 제사드렸습니다. 그것은 그 큰 산당이었기 때문입니다. 솔로몬은 그 제단 위에 번제 천 마리를 드렸습니다.[a]
  to: 왕이 그곳에서 제사를 드리려고 기브온으로 갔습니다. 그곳이 큰 산당이었기 때문입니다.[a] 솔로몬은 그 제단 위에 천 개의 번제를 드렸습니다.
  rationale: 목적을 나타내는 לִזְבֹּחַ를 ‘제사를 드리려고’로 명확히 옮기고, 기브온을 가리키는 표현을 자연스러운 한국어로 다듬었습니다. ‘번제 천 마리’의 비명시적 동물 단위를 제거하여 עֹלוֹת의 의미를 보존했으며, 각주 표지를 해당 어휘에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:44:59Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어 본문은 왕이 기브온으로 가서 그곳에서 제사를 드린 목적을 말하고, 기브온이 ‘그 큰 산당’이었음을 이유로 듭니다. 또한 עֹלוֹת는 구체적으로 번제물들을 뜻하므로 ‘번제 천 마리’처럼 본문에 없는 동물 단위를 명시하지 않는 편이 안전합니다.
  naturalness: ‘그것은 그 큰 산당이었기 때문입니다’는 지시 대상이 다소 불분명하고 문장이 어색합니다. ‘그곳이 큰 산당이었기 때문입니다’가 현대 한국어에서 더 자연스럽습니다. ‘제사드렸습니다’는 띄어쓰기를 하여 ‘제사를 드렸습니다’로 쓰는 것이 표준적입니다.
  terminology: ‘산당’과 ‘번제’는 각각 בָּמָה와 עֹלוֹת에 대한 적절한 전통적·전문적 대응어입니다. ‘큰’은 규모와 중요성 양쪽의 여지를 보존하며, 각주는 ‘주요한’이라는 대안을 적절히 제시합니다.
  issues:
  - severity: medium
    issue: ‘번제 천 마리’가 원문에 명시되지 않은 동물 단위를 첨가합니다.
    rationale: עֹלוֹת는 번제물/번제들을 가리키지만, 이 구절은 ‘마리’라는 단위를 직접 말하지 않습니다. ‘천 개의 번제’가 수량과 제의 용어를 보존하면서 불필요한 명시화를 피합니다.
  - severity: low
    issue: 각주 표지가 ‘큰 산당’이 아니라 문장 끝의 ‘번제’에 붙어 있습니다.
    rationale: 각주는 הַגְּדוֹלָה(‘큰/주요한’)의 의미 범위에 관한 것이므로 해당 표현 바로 뒤에 두어야 합니다.
  - severity: low
    issue: ‘그것은 그 큰 산당’은 지시와 서술이 부자연스럽습니다.
    rationale: 원문의 여성 단수 대명사는 기브온을 가리킵니다. 한국어에서는 ‘그곳이 큰 산당’이라고 표현하는 것이 자연스럽고 의미도 분명합니다.
