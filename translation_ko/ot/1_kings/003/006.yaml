  source_fidelity: 대체로 충실합니다. חֶסֶד를 ‘언약적 신실하심’으로 일관되게 옮기고, 다윗의 행실을 이루는 세 항목과 현재 왕위 계승의 사실을 잘 반영했습니다. 다만 ‘그를 위해 … 지키시고’는 לו와 ‘이 큰 חֶסֶד’의 관계가 한국어에서 다소 불분명하며, ‘아들을 주셨습니다’의 수여 대상인 다윗을 밝혀 주는 편이 원문에 더 가깝습니다.
