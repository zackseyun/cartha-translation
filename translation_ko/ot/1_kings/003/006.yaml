base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/006.yaml
  text: And Solomon said[a], “You have shown great covenant faithfulness to your servant David my father, because he walked before you in faithfulness, in righteousness, and in uprightness of heart with you; and you have kept for him this great covenant faithfulness and have given him a son sitting on his throne[c][b], as it is this day.”
  footnotes:
  - marker: a
    text: Or “steadfast love” or “loyal love” for “covenant faithfulness.”
    reason: lexical_alternative
  - marker: b
    text: “In truth” may also be understood as “faithfully” or “with integrity.”
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew idiom: “as this day,” meaning the present situation visibly confirms it.'
    reason: cultural_note
translation:
  language: ko
  text: 솔로몬이 말했습니다. “주님께서는 주님의 종, 제 아버지 다윗에게 큰 언약적 신실하심을 베푸셨습니다. 그가 주님 앞에서 신실함과 의와 마음의 정직함으로 주님과 함께 걸었기 때문입니다. 주님께서는 그를 위하여 이 큰 언약적 신실하심을 지켜 주셨고, 오늘과 같이[a] 그의 왕좌에 앉아 있는 아들을 그에게 주셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로 “오늘과 같이”이며, 현재 보이는 상황이 그 약속의 성취를 확인해 준다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: חֶסֶד
  english_pob_choice: covenant faithfulness
  chosen_korean: 언약적 신실하심
  alternatives_korean:
  - 언약적 사랑
  - 인애
  - 변함없는 사랑
  lexicon: HALOT, BDB
  rationale: 이 문맥의 חֶסֶד는 다윗 언약과 왕조 약속의 지속을 가리키므로, 단순한 호의보다 관계와 언약의 충실성을 드러내는 ‘언약적 신실하심’이 가장 가깝습니다.
- source_word: עָשִׂיתָ עִם
  english_pob_choice: have shown
  chosen_korean: 베푸셨습니다
  alternatives_korean:
  - 행하셨습니다
  - 하여 주셨습니다
  lexicon: HALOT, BDB
  rationale: ‘하다’ 계열을 직역하기보다, 하나님이 은혜와 충성을 능동적으로 나타내 보이셨다는 의미를 살려 공손한 서술인 ‘베푸셨습니다’로 옮겼습니다.
- source_word: בֶּאֱמֶת
  english_pob_choice: in truth
  chosen_korean: 신실함
  alternatives_korean:
  - 진리
  - 진실로
  - 충실함
  lexicon: HALOT, BDB
  rationale: 이 항목은 POB가 ‘faithfully/in truth’의 긴장을 보존한 대목이므로, 다윗의 삶의 성격을 의지적·관계적으로 드러내는 ‘신실함’으로 처리했습니다.
- source_word: וּבְיִשְׁרַת לֵבָב
  english_pob_choice: in uprightness of heart
  chosen_korean: 마음의 정직함
  alternatives_korean:
  - 마음의 올곧음
  - 마음의 바름
  - 마음의 성실함
  lexicon: HALOT, BDB
  rationale: 히브리어의 ‘곧음/바름’ 이미지를 자연스럽게 살리면서도 한국어에서 내적 성품을 분명히 드러내기 위해 ‘마음의 정직함’으로 옮겼습니다.
- source_word: כַּיּוֹם הַזֶּה
  english_pob_choice: as it is this day
  chosen_korean: 오늘과 같이
  alternatives_korean:
  - 이날과 같이
  - 오늘날 눈에 보이듯
  lexicon: HALOT, BDB
  rationale: 히브리어 관용구의 ‘현시적 확인’ 의미를 살리되 문장 흐름을 자연스럽게 하기 위해 ‘오늘과 같이’로 간결하게 번역했습니다.
theological_decisions:
- issue: חֶסֶד의 번역을 ‘사랑’보다 언약적 성격이 드러나는 표현으로 옮길지 여부
  chosen_reading: ‘언약적 신실하심’으로 옮겨, 다윗 언약과 왕위 계승의 지속성을 전면에 드러냈습니다.
  alternative_readings:
  - 인애
  - 변함없는 사랑
  - 언약적 사랑
  rationale: 이 절은 단순한 정서적 사랑이 아니라, 하나님이 다윗에게 하신 약속을 기억하고 유지하시는 행위를 말하므로, 언약적·서약적 차원을 보존하는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §5 (핵심어 일관성 및 문맥상 예외 허용)
- issue: ‘주님’ 대 ‘야훼’ 표기 선택
  chosen_reading: 본문 서술과 직접 화법 모두에서 ‘주님’을 사용했습니다.
  alternative_readings:
  - 야훼
  rationale: 이 절은 솔로몬의 기도적 회상이며, 한국어 합쇼체의 독자성 유지와 직접 호칭의 자연스러움을 위해 본문에서는 ‘주님’을 택했습니다.
  doctrine_reference: POB 용어 지침의 κύριος/하나님 호칭 관례
