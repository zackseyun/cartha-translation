revisions:
- from: 솔로몬은 야훼를 사랑하여, 그의 아버지 다윗의 규례들을 따라 걸었습니다. 다만 그는 산당들에서 제사를 드리고 분향하고 있었습니다.[a]
  to: 솔로몬은 야훼를 사랑했고, 아버지 다윗의 규례를 따라 행했습니다. 다만 그는 산당에서 제사를 드리며 향을 피우고 있었습니다.[a]
  rationale: 개정문은 ‘사랑했다’와 ‘규례를 따라 행했다’를 원문의 평가와 그 표현으로 자연스럽게 연결하면서도, 이를 과도한 인과 관계로 만들지 않았습니다. ‘다만’은 רַק의 제한적 기능을 보존하며, 진행 표현은 두 분사의 관습적·지속적 뉘앙스를 반영합니다. 산당에 관한 각주는 해당 표현에 정확히 연결되며, 영어 감사 기록의 불일치한 대안 독법 각주는 한국어 본문의 번역상 필요하지 않아 추가하지 않았습니다.
