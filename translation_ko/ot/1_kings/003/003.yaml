  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֶּאֱהַ֤ב שְׁלֹמֹה֙ אֶת יְהוָ֔ה לָ/לֶ֕כֶת בְּ/חֻקּ֖וֹת דָּוִ֣ד אָבִ֑י/ו רַ֚ק בַּ/בָּמ֔וֹת ה֥וּא מְזַבֵּ֖חַ וּ/מַקְטִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/003.yaml
  text: Solomon loved Yahweh[a], walking in the statutes of David his father; only[b], he was sacrificing and burning incense at the high places.
  footnotes:
  - marker: a
    text: Or, 'except that he was sacrificing and burning incense at the high places.'
    reason: alternative_reading
  - marker: b
    text: '''High places'' refers to local elevated worship sites.'
    reason: cultural_note
translation:
  language: ko
  text: 솔로몬은 야훼를 사랑하여, 그의 아버지 다윗의 규례들을 따라 걸었습니다. 다만 그는 산당들에서 제사를 드리고 분향하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘산당’은 지역의 높은 예배처를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱהַב
  english_pob_choice: loved
  chosen_korean: 사랑하여
  alternatives_korean:
  - 사랑했습니다
  - 사랑하였고
  lexicon: HALOT
  rationale: 서술자의 평가를 자연스럽게 살리면서, 뒤의 '걸었습니다'와 연결되는 원인·방식의 뉘앙스를 담기 위해 '사랑하여'로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 고유 신명 מט역이므로, 프로젝트 기본값에 따라 '야훼'로 표기해 인격적 이름을 보존했습니다.
- source_word: בְּ/חֻקּוֹת
  english_pob_choice: in the statutes
  chosen_korean: 규례들을 따라
  alternatives_korean:
  - 율법들 안에서
  - 규례 안에서
  lexicon: HALOT
  rationale: חֻקּוֹת의 법적·언약적 뉘앙스를 한국어의 '규례'로 살리고, 행위 기준을 나타내는 표현으로 '따라'를 사용했습니다.
- source_word: רַק
  english_pob_choice: only
  chosen_korean: 다만
  alternatives_korean:
  - 오직
  - 단지
  lexicon: HALOT
  rationale: 앞선 긍정 평가를 제한하는 역접적 완화 표시로 '다만'이 가장 자연스럽고, 완전한 반전으로 과장하지 않습니다.
- source_word: בַּ/בָּמֹות
  english_pob_choice: at the high places
  chosen_korean: 산당들에서
  alternatives_korean:
  - 높은 곳에서
  - 산당에서
  lexicon: HALOT
  rationale: בָּמוֹת는 고지형 예배처를 가리키므로, 한국어 성서 관용에 널리 알려진 '산당'을 쓰되 복수성을 반영해 '산당들'로 옮겼습니다.
- source_word: מְזַבֵּחַ וּ/מַקְטִיר
  english_pob_choice: was sacrificing and burning incense
  chosen_korean: 제사를 드리고 분향하고 있었습니다
  alternatives_korean:
  - 제사하며 향을 피우고 있었습니다
  - 희생제물을 드리고 향을 피우고 있었습니다
  lexicon: HALOT
  rationale: 두 동작을 분리해 번역해 제사와 분향의 병렬성을 보존했고, 진행형 뉘앙스를 '하고 있었습니다'로 살렸습니다.
theological_decisions:
- issue: 솔로몬의 예배 평가와 산당 언급의 긴장
  chosen_reading: 솔로몬에 대한 기본 평가는 긍정적으로 유지하되, '다만'으로 산당 예배의 제한점을 분명히 드러냈습니다.
  alternative_readings:
  - 앞부분을 아이러니로 읽어 전반을 비판적으로 옮김
  - 산당 예배를 당시 허용된 것으로 완화해 번역함
  rationale: 원문은 먼저 야훼 사랑을 진술한 뒤 רק로 제한을 덧붙이므로, 칭찬과 경고의 긴장을 함께 보존하는 것이 가장 충실합니다.
  doctrine_reference: 서술의 긍정과 제한을 동시에 유지
