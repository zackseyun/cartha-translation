language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַ֨בְדְּ/ךָ֔ בְּ/ת֥וֹךְ עַמְּ/ךָ֖ אֲשֶׁ֣ר בָּחָ֑רְתָּ עַם רָ֕ב אֲשֶׁ֧ר לֹֽא יִמָּנֶ֛ה וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/008.yaml
  text: And your servant is in the midst of your people whom you have chosen[a], a great people[b], too numerous to be counted or numbered.
  footnotes:
  - marker: a
    text: Or 'a numerous people.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'which cannot be counted and cannot be numbered because of multitude.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신의 종은 당신께서 택하신 당신의 백성 가운데 있습니다. 그들은 셀 수 없고 헤아릴 수도 없는 큰 백성입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수많은 백성’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘많음 때문에 셀 수도 없고 헤아릴 수도 없는’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַבְדְּךָ
  english_pob_choice: and your servant
  chosen_korean: 그리고 당신의 종
  alternatives_korean:
  - 그리고 당신의 노예
  - 그리고 당신의 종은
  lexicon: HALOT
  rationale: 솔로몬의 하나님께 드리는 겸손한 자기표현이므로, 관계를 유지하면서도 한국어에서 가장 자연스러운 ‘종’으로 옮겼습니다.
- source_word: בְּתוֹךְ
  english_pob_choice: in the midst of
  chosen_korean: 가운데
  alternatives_korean:
  - 한복판에
  - 한가운데
  lexicon: HALOT
  rationale: ‘~의 가운데’는 사람들 속에 위치해 있다는 뜻을 자연스럽게 살리며, 의례적이지만 과장되지 않은 표현입니다.
- source_word: אֲשֶׁר בָּחָרְתָּ
  english_pob_choice: whom you have chosen
  chosen_korean: 당신께서 택하신
  alternatives_korean:
  - 당신이 선택하신
  - 당신께서 선택하신
  lexicon: HALOT
  rationale: בחר의 선택/택함을 한국어 성경 문체에서 널리 통용되는 ‘택하다’로 옮겨, 언약적 선택의 뉘앙스를 살렸습니다.
- source_word: לֹא יִמָּנֶה וְלֹא יִסָּפֵר מֵרֹב
  english_pob_choice: too numerous to be counted or numbered
  chosen_korean: 셀 수 없고 헤아릴 수도 없는
  alternatives_korean:
  - 헤아릴 수 없고 셀 수도 없는
  - 계수할 수 없고 번호를 매길 수도 없는
  lexicon: HALOT
  rationale: מנה와 ספר의 평행은 ‘계수/산정 불가’를 뜻하므로, 한국어에서는 두 동사의 의미를 나누어 ‘셀 수 없고 헤아릴 수도 없는’으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 이스라엘을 하나님의 선택된 백성으로 묘사하는 언약적 표현
  chosen_reading: ‘당신께서 택하신 당신의 백성’으로 직역에 가깝게 보존했습니다.
  alternative_readings:
  - ‘당신이 선택하신 백성’
  - ‘당신의 백성’
  rationale: 본문은 선택 사상을 분명히 드러내므로, 이를 완화하지 않고 그대로 드러내는 것이 source-direct 원칙에 부합합니다.
  doctrine_reference: 언약과 선택에 대한 본문 수준의 진술
