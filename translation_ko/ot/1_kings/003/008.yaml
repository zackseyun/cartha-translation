  to: 그리고 당신의 종은 당신께서 택하신 당신의 백성 가운데 있습니다. 그들은 큰 백성, 곧 너무 많아 셀 수도 헤아릴 수도 없는 백성입니다.[a][b]
  rationale: 원문의 ‘백성—큰 백성’ 동격 관계를 ‘그들은 큰 백성’으로 더 직접적으로 나타내고, מֵרֹב의 인과적 의미를 ‘너무 많아’로 본문에 반영했습니다. ‘종’, ‘택하신’, ‘백성’은 유지했습니다. 각주는 해당 표현 뒤에 함께 배치하여 표지의 지시 대상을 명료하게 했습니다.
