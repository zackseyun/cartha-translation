  edition: WLC
  text: וַ/תֹּ֣אמֶר הָ/אִשָּׁה֩ אֲשֶׁר בְּנָ֨/הּ הַ/חַ֜י אֶל הַ/מֶּ֗לֶךְ כִּֽי נִכְמְר֣וּ רַחֲמֶי/הָ֮ עַל בְּנָ/הּ֒ וַ/תֹּ֣אמֶר בִּ֣י אֲדֹנִ֗/י תְּנוּ לָ/הּ֙ אֶת הַ/יָּל֣וּד הַ/חַ֔י וְ/הָמֵ֖ת אַל תְּמִיתֻ֑/הוּ וְ/זֹ֣את אֹמֶ֗רֶת גַּם לִ֥/י גַם לָ֛/ךְ לֹ֥א יִהְיֶ֖ה גְּזֹֽרוּ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/026.yaml
  text: Then the woman whose son was alive said to the king[a], because her compassion was stirred for her son, and she said, "Please, my lord, give her the living child, and do not put him to death." But the other said, "It shall be neither mine nor yours[b]; cut him in two."
  footnotes:
  - marker: a
    text: 'Hebrew: ''for her compassion was stirred for her son,'' an idiom expressing intense maternal pity.'
    reason: cultural_note
  - marker: b
    text: 'Or ''do not kill him''; the Hebrew form is emphatic: ''do not, indeed do not, put him to death.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 살아 있는 아이의 어머니가 왕에게 말했습니다. 그녀의 마음이 자기 아들을 두고 끓어올랐기 때문입니다. 그녀가 말했습니다. “주님, 제발 저 여자에게 살아 있는 아이를 주십시오. 그리고 그를 죽이지 마십시오.” 그러자 다른 여자가 말했습니다. “그는 내 것도 아니고 당신 것도 아닙니다. 둘로 나누십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 자녀를 향한 강한 모성적 연민이 ‘마음이 끓어오르다’로 표현됩니다.
    reason: cultural_note
  - marker: b
    text: 히브리어의 금지형은 강한 강조를 포함합니다. 직역하면 ‘그를 죽음에 이르게 하지 마십시오’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְמְרוּ רַחֲמֶיהָ
  english_pob_choice: her compassion was stirred
  chosen_korean: 그녀의 마음이 … 끓어올랐기 때문입니다
  alternatives_korean:
  - 그녀의 불쌍히 여기는 마음이 움직였기 때문입니다
  - 그녀의 긍휼이 뜨거워졌기 때문입니다
  - 그녀의 애정이 북받쳤기 때문입니다
  lexicon: HALOT
  rationale: 직역하면 현대 한국어에서 어색하므로, 자녀를 향한 강한 자애와 연민이 솟구친다는 이미지를 살려 ‘마음이 끓어올랐다’로 옮겼습니다.
- source_word: בִּי אֲדֹנִי
  english_pob_choice: Please, my lord
  chosen_korean: 주님, 제발
  alternatives_korean:
  - 부디, 주인님
  - 청컨대, 제 주인님
  - 아, 주님
  lexicon: HALOT
  rationale: 간청의 감탄사로서의 בִּי를 자연스러운 청유 표현 ‘제발’로 풀었고, אֲדֹנִי는 문맥상 ‘주님’에 해당하는 존칭으로 처리했습니다.
- source_word: וְהָמֵת אַל תְּמִיתֻהוּ
  english_pob_choice: and by no means put him to death
  chosen_korean: 그리고 그를 죽이지 마십시오
  alternatives_korean:
  - 그리고 그를 절대로 죽이지 마십시오
  - 그리고 반드시 그를 죽이지 마십시오 않게 하십시오
  - 그리고 그를 죽음에 이르게 하지 마십시오
  lexicon: HALOT
  rationale: 히브리어의 강한 금지 강조는 유지하되, 한국어에서는 반복 강조를 과도하게 늘리기보다 간결하게 ‘죽이지 마십시오’로 자연스럽게 전달했습니다.
- source_word: גְּזֹרוּ
  english_pob_choice: cut him in two
  chosen_korean: 둘로 나누십시오
  alternatives_korean:
  - 둘로 자르십시오
  - 둘로 가르십시오
  - 반으로 쪼개십시오
  lexicon: HALOT
  rationale: 앞선 문맥에서 이미 아이를 둘로 가르려는 잔혹한 명령임이 분명하므로, 의미를 정확히 드러내는 ‘둘로 나누십시오’를 택했습니다.
theological_decisions:
- issue: 왕에게 직접 호소하는 여성의 존대 표현
  chosen_reading: 합쇼체를 유지하되, 긴급한 간청은 ‘주님, 제발’로 압축했습니다.
  alternative_readings:
  - 더 장중한 문어체로 ‘청컨대’ 사용
  - 더 완곡하게 ‘부디’ 사용
  rationale: 본문의 절박함과 궁중 대화의 긴장을 살리면서도 현대 한국어의 읽기 자연성을 유지하기 위한 선택입니다.
  doctrine_reference: 서사 본문의 화용론과 경어 체계
