  source_fidelity: 수정이 필요합니다. נִכְמְרוּ רַחֲמֶיהָ는 분노처럼도 들릴 수 있는 ‘마음이 끓어올랐다’보다 아들을 향한 강한 연민이 북받친다는 뜻으로 옮기는 것이 정확합니다. אֲדֹנִי는 왕에게 드리는 호칭이므로 문맥상 ‘왕이시여’가 자연스럽습니다. וְהָמֵת אַל־תְּמִיתֻהוּ의 강조는 ‘결코 죽이지 마십시오’로 반영했습니다. 마지막 명령 גְּזֹרוּ는 단순히 나누는 것이 아니라 자르는 행위를 뜻하므로 ‘둘로 자르십시오’가 더 충실합니다.
  naturalness: 현대 표준어 합쇼체로 다듬었습니다. ‘그녀의 마음이 자기 아들을 두고 끓어올랐기 때문입니다’는 한국어에서 다소 부자연스럽고 분노의 뉘앙스를 낼 수 있어, ‘자기 아들을 향한 연민이 북받쳤기 때문에’로 고쳤습니다. 인용문 안의 호칭과 명령도 궁정 장면에 맞게 자연스럽게 정리했습니다.
  terminology: ‘연민’은 רחמים의 문맥상 의미를 보존하며 특정 교파적 용어를 강요하지 않습니다. ‘왕이시여’는 אֲדֹנִי의 존칭적 호소를 이 장면의 실제 청자인 왕에 맞추어 명확히 합니다. ‘아이’는 יָלוּד의 연령을 과도하게 특정하지 않습니다.
