revisions:
- from: 그때 살아 있는 아이의 어머니가 왕에게 말했습니다. 그녀의 마음이 자기 아들을 두고 끓어올랐기 때문입니다. 그녀가 말했습니다. “주님, 제발 저 여자에게 살아 있는 아이를 주십시오. 그리고 그를 죽이지 마십시오.” 그러자 다른 여자가 말했습니다. “그는 내 것도 아니고 당신 것도 아닙니다. 둘로 나누십시오.”[a][b]
  to: 그때 살아 있는 아이의 어머니가 자기 아들을 향한 연민이 북받쳤기 때문에 왕에게 말했습니다. “왕이시여, 부디 살아 있는 아이를 저 여자에게 주십시오. 결코 그를 죽이지 마십시오.”[a][b] 그러자 다른 여자가 말했습니다. “그 아이는 내 것도 당신 것도 되지 못합니다. 둘로 자르십시오.”
  rationale: 원문의 인과 관계와 반복된 발화를 자연스러운 한국어 문장으로 유지하되, 모성적 연민의 의미, 왕에게 드리는 호칭, 강한 금지, 그리고 아이를 자르라는 명령을 더 정확하게 반영했습니다. 각주 b의 표지도 실제로 설명하는 금지 표현 바로 뒤로 옮겼습니다.
