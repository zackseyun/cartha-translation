id: 1KI.3.7
reference: 1 Kings 3:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהָ֔/י אַתָּה֙ הִמְלַ֣כְתָּ אֶֽת עַבְדְּ/ךָ֔ תַּ֖חַת דָּוִ֣ד אָבִ֑/י וְ/אָֽנֹכִי֙ נַ֣עַר קָטֹ֔ן לֹ֥א אֵדַ֖ע צֵ֥את וָ/בֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/007.yaml
  text: And now[a], O Yahweh my God, you have made your servant king in place of David my father, though I am a little child[b]; I do not know how to go out or come in.
  footnotes:
  - marker: a
    text: Or 'a young man'; the Hebrew expression is a humble self-description emphasizing youth and inexperience.
    reason: lexical_alternative
  - marker: b
    text: '''Go out or come in'' is a Hebrew idiom for carrying out one''s duties, especially in public leadership.'
    reason: cultural_note
translation:
  language: ko
  text: 이제, 야훼 내 하나님, 주께서 주의 종을 제 아버지 다윗의 뒤를 이어 왕이 되게 하셨습니다. 그러나 저는 어린아이라서 나가고 들어오는 것을 알지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 나이뿐 아니라 경험 부족을 강조하는 겸손한 자기표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나가고 들어오다’는 히브리어 관용구로, 특히 공적 지도와 직무 수행을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 프로젝트 기본값에 따라 음역하여, 언약적 고유성을 드러내면서도 전통적 대체어 ‘주’로 평탄화하지 않았습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 당신의 종
  - 주의 노예
  lexicon: HALOT
  rationale: 왕의 기도 문맥에서 겸손과 봉사 관계를 나타내므로 ‘종’이 가장 자연스럽고, 여기서는 하나님의 직접 호칭에 맞춰 ‘주의 종’으로 옮겼습니다.
- source_word: נַעַר קָטֹן
  english_pob_choice: a little child
  chosen_korean: 어린아이
  alternatives_korean:
  - 어린 소년
  - 어린 청년
  - 아주 어린 아이
  lexicon: HALOT
  rationale: 히브리어의 자기비하적 표현을 한국어로 자연스럽게 살리되, 정확한 연령을 단정하지 않기 위해 ‘어린아이’로 옮겼습니다.
- source_word: צֵאת וָבֹא
  english_pob_choice: to go out or come in
  chosen_korean: 나가고 들어오는 것
  alternatives_korean:
  - 출입하는 것
  - 나가고 들어오는 일
  - 공적 업무를 수행하는 것
  lexicon: HALOT
  rationale: 직역성을 유지하면서도 한국어에서 자연스러운 관용적 표현으로 옮겼습니다. 이 구절의 통치·책무 수행의 뉘앙스는 본문 의미에 대한 해설로 남기는 편이 낫습니다.
theological_decisions:
- issue: 하나님 이름 YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명은 고유 이름으로 보존하는 것이 원문 가시성과 언약적 정체성을 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 솔로몬의 자기 진술과 무능 표현
  chosen_reading: ‘어린아이’와 ‘나가고 들어오는 것’의 직역을 유지합니다.
  alternative_readings:
  - ‘어려서 아직 지도할 줄 모릅니다’로 의역
  - ‘젊은 사람입니다’로 완화
  rationale: 본문은 통치 경험의 부족을 드러내지만, ‘인도하다’ 같은 해석어를 본문에 직접 넣지 않고 원문의 자기비하와 관용구를 보존하는 편이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; original-language primacy'
