  source_fidelity: 전반적으로 히브리어의 호칭, 왕위 계승, 겸손한 자기 묘사, 그리고 ‘나가고 들어오다’라는 관용적 표현을 충실히 반영합니다. 다만 לֹא אֵדַע צֵאת וָבֹא는 한국어에서 ‘나가고 들어오는 것을 알지 못합니다’보다 ‘나가고 들어올 줄을 알지 못합니다’가 원문의 ‘할 줄 모르다’라는 뜻을 더 자연스럽고 정확하게 전달합니다.
  naturalness: ‘야훼, 나의 하나님’은 기도문의 부름말로 자연스럽고 격식 있는 합쇼체 표현입니다. 또한 각주 표지를 해당 어구 바로 뒤에 배치하면 각주가 가리키는 대상을 분명히 할 수 있습니다.
