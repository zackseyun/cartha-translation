id: 1KI.3.21
reference: 1 Kings 3:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אָקֻ֥ם בַּ/בֹּ֛קֶר לְ/הֵינִ֥יק אֶת בְּנִ֖/י וְ/הִנֵּה מֵ֑ת וָ/אֶתְבּוֹנֵ֤ן אֵלָי/ו֙ בַּ/בֹּ֔קֶר וְ/הִנֵּ֛ה לֹֽא הָיָ֥ה בְנִ֖/י אֲשֶׁ֥ר יָלָֽדְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/021.yaml
  text: When I got up in the morning to nurse my son[a], behold, he was dead. But when I looked closely at him in the morning, behold, he was not my son[b], whom I had borne.
  footnotes:
  - marker: a
    text: Or 'I examined him carefully.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'whom I bore.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 아침에 내 아들을 젖 먹이려고 일어났더니[a], 보십시오, 그가 죽어 있었습니다. 그런데 아침에 그를 자세히 살펴보니, 보십시오, 그 아이는 내가 낳은 내 아들이 아니었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 자세히 살펴보니.’
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘내가 낳은’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָקֻם
  english_pob_choice: When I got up
  chosen_korean: 내가 … 일어났더니
  alternatives_korean:
  - 내가 일어났습니다
  - 내가 일어나자
  lexicon: HALOT
  rationale: 서술적 과거의 자연스러운 한국어 흐름을 살리면서, 뒤따르는 상황 발견과의 시간 관계를 ‘-더니’로 드러냈습니다.
- source_word: לְהֵינִיק
  english_pob_choice: to nurse
  chosen_korean: 젖 먹이려고
  alternatives_korean:
  - 젖을 먹이기 위해
  - 수유하려고
  lexicon: HALOT
  rationale: 영아에게 젖을 먹이는 동작을 현대 한국어로 직접적이면서도 자연스럽게 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보니
  lexicon: HALOT
  rationale: 돌연한 깨달음과 충격을 독자에게 즉시 전달하는 감탄형으로, 원문의 극적 표지를 유지했습니다.
- source_word: וָאֶתְבּוֹנֵן אֵלָיו
  english_pob_choice: I looked closely at him
  chosen_korean: 그를 자세히 살펴보니
  alternatives_korean:
  - 그를 유심히 보니
  - 그에게 자세히 주의를 기울여 보니
  lexicon: HALOT
  rationale: 히트폴엘의 ‘면밀히 살피다’는 뉘앙스를 한국어 동사구로 간결하게 반영했습니다.
- source_word: אֲשֶׁר יָלָדְתִּי
  english_pob_choice: whom I had borne
  chosen_korean: 내가 낳은
  alternatives_korean:
  - 내가 출산한
  - 내가 낳아 준
  lexicon: HALOT
  rationale: 출산 행위를 분명히 하되, 한국어에서 가장 자연스럽고 직접적인 표현을 택했습니다.
theological_decisions:
- issue: 죽은 아기를 가리키는 대명사와 소유 관계의 보존
  chosen_reading: “그가 죽어 있었습니다… 그 아이는 내가 낳은 내 아들이 아니었습니다”로, 아이를 단순 물건이 아니라 인격적 존재로 지칭하는 구조를 유지했습니다.
  alternative_readings:
  - 그것이 죽어 있었습니다… 그것은 내 아들이 아니었습니다
  - 그는 죽어 있었습니다… 그는 내 아들이 아니었습니다
  rationale: 히브리어의 남성형 지시와 모성의 인지 과정을 살리기 위해 인격 지시를 유지했습니다. 동시에 ‘내가 낳은’으로 출생 관계를 분명히 했습니다.
  doctrine_reference: 본문 서술의 인격성 및 출생-소속 관계
- issue: 감탄 표지 וְהִנֵּה의 반복
  chosen_reading: 두 번 모두 ‘보십시오’로 옮겨 서사의 충격과 확인의 순간을 유지했습니다.
  alternative_readings:
  - 그리고 보니
  - 그런데
  rationale: 원문의 반복된 순간 포착을 약화시키지 않기 위해, 같은 기능의 감탄형을 반복 사용했습니다.
  doctrine_reference: 서사적 강조와 화자 인식의 전개
