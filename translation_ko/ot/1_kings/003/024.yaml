  text: Then the king said, “Bring me a sword.” So they brought the sword before the king.
translation:
  language: ko
  text: 그때 왕이 말했습니다. "나에게 칼 한 자루를 가져오십시오." 그래서 그들이 칼을 왕 앞에 가져왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 진행·전환 감각을 살리면서 현대 한국어 서술로 자연스럽게 옮겼습니다.
- source_word: קְחוּ לִי
  english_pob_choice: Bring me
  chosen_korean: 나에게 ... 가져오십시오
  alternatives_korean:
  - 저를 위해 가져오십시오
  - 나를 위해 가져오십시오
  lexicon: HALOT
  rationale: 문맥상 단순히 ‘take’가 아니라 물건을 가져오라는 요청이므로, 명령의 기능을 살려 ‘가져오십시오’로 옮겼습니다.
- source_word: חָרֶב
  english_pob_choice: a sword
  chosen_korean: 칼 한 자루
  alternatives_korean:
  - 한 칼
  - 검 한 자루
  lexicon: HALOT
  rationale: 첫 번째 용례의 부정관사를 살리되, 한국어에서는 도구 단위를 붙여 자연스럽게 했습니다.
- source_word: לִפְנֵי הַמֶּלֶךְ
  english_pob_choice: before the king
  chosen_korean: 왕 앞에
  alternatives_korean:
  - 왕의 면전으로
  - 왕의 앞에
  lexicon: HALOT
  rationale: 궁정 서술에서 ‘before’의 장소·존전 의미를 간결하게 드러내는 표현으로 옮겼습니다.
