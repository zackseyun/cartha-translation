  - 주님 ... 하나님
  lexicon: HALOT
  rationale: POB 기본어휘에 따라 יהוה는 ‘야훼’로, 이어지는 אֱלֹהִים은 ‘하나님’으로 옮겨 원문의 호칭 전환을 보존했습니다.
- source_word: מָה אֶתֶּן לָךְ
  english_pob_choice: what I should give you
  chosen_korean: 내가 네게 무엇을 주어야 할지
  alternatives_korean:
  - 내가 네게 무엇을 주겠는지
  - 네게 무엇을 주면 좋겠는지
  - 내가 네게 무엇을 줄지
  lexicon: HALOT
  rationale: 직설적인 질문을 한국어 간접의문형으로 풀어, 명령 ‘구하여 보아라’와 이어질 때 자연스럽고 원문의 의미를 정확히 전달합니다.
