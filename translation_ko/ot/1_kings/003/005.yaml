  text: 기브온에서 야훼께서 솔로몬에게 밤에 꿈을 꾸는 가운데 나타나셨습니다[a]. 그리고 하나님께서 말씀하셨습니다. “내가 네게 무엇을 주어야 할지 구하십시오.”
  philosophy: optimal-equivalence
  footnotes:
