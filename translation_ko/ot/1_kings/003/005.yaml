translation:
  language: ko
  text: 기브온에서 야훼께서 솔로몬에게 밤의 꿈에서 나타나셨습니다[a]. 그리고 하나님께서 말씀하셨습니다. “내가 네게 무엇을 주어야 할지 구하여 보아라.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘밤의 꿈에서’입니다. 즉, 밤에 꾸는 꿈 가운데 나타나셨다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגִבְעוֹן
  english_pob_choice: At Gibeon
  chosen_korean: 기브온에서
  alternatives_korean:
  - 기브온 안에서
  - 기브온에
  lexicon: HALOT
  rationale: 전치사 ב의 위치 의미를 한국어 조사로 자연스럽게 살려, 지명 앞에서는 ‘기브온에서’가 가장 투명합니다.
- source_word: בַּחֲלֹם הַלָּיְלָה
  english_pob_choice: in a dream at night
  chosen_korean: 밤의 꿈에서
  alternatives_korean:
  - 밤에 꾸는 꿈에서
  - 밤중의 꿈에서
  - 꿈 가운데 밤에
  lexicon: HALOT
  rationale: 히브리어의 직역적 색채인 ‘밤의 꿈’ 구조를 유지해, 단순히 ‘밤에’로 평탄화하지 않고 야간 꿈의 뉘앙스를 드러냈습니다.
- source_word: יְהֹוָה / אֱלֹהִים
  english_pob_choice: Yahweh ... God
  chosen_korean: 야훼 ... 하나님
  alternatives_korean:
