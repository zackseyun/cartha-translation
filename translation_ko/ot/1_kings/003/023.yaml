source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ זֹ֣את אֹמֶ֔רֶת זֶה בְּנִ֥/י הַ/חַ֖י וּ/בְנֵ֣/ךְ הַ/מֵּ֑ת וְ/זֹ֤את אֹמֶ֨רֶת֙ לֹ֣א כִ֔י בְּנֵ֥/ךְ הַ/מֵּ֖ת וּ/בְנִ֥/י הֶ/חָֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/023.yaml
  text: Then the king said[a], “This one says, ‘This is my son, the living one, and your son is the dead one,’ and this one says, ‘No, for your son is the dead one, and my son is the living one.’”
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'This woman says ... and that woman says ...' The Hebrew uses feminine demonstratives, literally 'this one ... and this one,' referring to the two women.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 말했습니다[a]. “이 여자는 ‘이 아이는 살아 있는 제 아들이고, 당신의 아들은 죽은 아이입니다’라고 말하고, 또 이 여자는 ‘아니오, 당신의 아들이 죽은 아이이고, 제 아들이 살아 있는 아이입니다’라고 말합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 두 여인을 가리켜 여성형 지시사, 곧 직역하면 ‘이 여자 … 또 이 여자’를 사용합니다. 문맥에 맞춰 더 자연스럽게는 ‘이 여자 … 저 여자’ 또는 ‘한 여자 … 다른 여자’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그러자 ... 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리면서 히브리어의 연속 동작을 반영합니다.
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 임금
  lexicon: HALOT
  rationale: 본문의 직함을 그대로 옮기되, 현대 표준어로 간결하게 표현했습니다.
- source_word: זֹאת ... וְזֹאת
  english_pob_choice: This one ... and this one
  chosen_korean: 이 사람은 ... 또 저 사람은
  alternatives_korean:
  - 이 여자는 ... 저 여자는
  - 이 하나는 ... 또 저 하나는
  lexicon: HALOT
  rationale: 히브리어의 여성 지시대명사가 두 여인을 가리키는 점을 살리면서, 한국어에서는 반복되는 지시어보다 문맥상 자연한 인칭 지시로 옮겼습니다.
- source_word: בְּנִי הַחַי / בְּנֵךְ הַמֵּת
  english_pob_choice: my son / your son; the living one / the dead one
  chosen_korean: 살아 있는 내 아들 / 네 죽은 아들
  alternatives_korean:
  - 내 살아 있는 아들 / 네 죽은 아들
  - 내 아들, 살아 있는 아들 / 네 아들, 죽은 아들
  lexicon: HALOT
  rationale: הַחַי와 הַמֵּת의 대조를 한국어의 관형절로 풀어, 단순히 ‘살아 있다/죽었다’가 아니라 아들의 상태를 분명히 드러냈습니다.
- source_word: לֹא כִי
  english_pob_choice: No, for
  chosen_korean: 아니오
  alternatives_korean:
  - 아니요, 왜냐하면
  - 아니라
  lexicon: HALOT
  rationale: 여기서는 반박과 정정을 포함한 말투가 핵심이므로, 대화체의 강한 부정으로 처리했습니다.
theological_decisions:
- issue: 두 여성의 발화 인용 방식과 지시어의 성별 표지
  chosen_reading: 히브리어의 여성형 지시대명사 ‘이것/저것’을 직역하지 않고, 한국어에서는 문맥상 드러나는 두 여인을 ‘이 사람/저 사람’으로 자연스럽게 지시했습니다.
  alternative_readings:
  - ‘이 여자... 저 여자...’로 더 직접적으로 옮김
  - ‘이 사람... 또 이 사람...’으로 지시 대비를 유지함
  rationale: 본문의 핵심은 성별 자체가 아니라 서로 다른 두 화자의 상충 진술이므로, 한국어에서는 오해 없이 지시 관계를 드러내는 번역이 적절합니다.
  doctrine_reference: 내러티브 본문 해석 원칙
- issue: ‘살아 있는/죽은’의 상태 표현
  chosen_reading: ‘살아 있는’과 ‘죽은’을 관형절로 처리해 아이의 생사 상태를 강조했습니다.
  alternative_readings:
  - ‘살아 있는 자/죽은 자’
  - ‘살아 있다/죽었다’
  rationale: 문맥상 대상은 한 아이이므로, 한국어에서도 대상과 상태를 함께 붙여 읽히게 하는 것이 원문의 대조를 가장 잘 살립니다.
  doctrine_reference: 문맥 충실성
