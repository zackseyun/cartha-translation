  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֵלָ֗י/ו יַעַן֩ אֲשֶׁ֨ר שָׁאַ֜לְתָּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה וְ/לֹֽא שָׁאַ֨לְתָּ לְּ/ךָ֜ יָמִ֣ים רַבִּ֗ים וְ/לֹֽא שָׁאַ֤לְתָּ לְּ/ךָ֙ עֹ֔שֶׁר וְ/לֹ֥א שָׁאַ֖לְתָּ נֶ֣פֶשׁ אֹיְבֶ֑י/ךָ וְ/שָׁאַ֧לְתָּ לְּ/ךָ֛ הָבִ֖ין לִ/שְׁמֹ֥עַ מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/011.yaml
  text: And God said to him, “Because you have asked for this thing, and have not asked for yourself many days, nor have asked for yourself riches, nor have asked for the life of your enemies, but have asked for yourself understanding to hear justice,”
translation:
  language: ko
  text: 하나님께서 그에게 말씀하셨습니다. 「네가 이것을 구하였고, 스스로를 위해 많은 날도 구하지 않았으며, 스스로를 위해 재물도 구하지 않았고, 네 원수들의 생명도 구하지 않았으며, 오직 듣고 분별할 수 있도록 이해력을 구하였으므로」
  philosophy: formal
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: God
  rationale: 히브리어 אֱלֹהִים은 여기서 이스라엘의 하나님을 가리키므로, 프로젝트 기본값에 따라 ‘하나님’으로 옮겼습니다.
- source_word: שָׁאַ֜לְתָּ אֶת הַדָּבָר הַזֶּה
  english_pob_choice: you have asked for this thing
  chosen_korean: 이것을 구하였고
  alternatives_korean:
  - 이 일을 구하였고
  - 이것을 요청하였고
  lexicon: ask / request
  rationale: 구하다가 히브리어 שׁאל의 표준적 의미를 잘 담고, 왕이 하나님께 드린 청을 자연스럽게 전달합니다.
- source_word: יָמִים רַבִּים / עֹשֶׁר / נֶפֶשׁ אֹיְבֶי/ךָ
  english_pob_choice: many days / riches / the life of your enemies
  chosen_korean: 많은 날 / 재물 / 네 원수들의 생명
  alternatives_korean:
  - 장수 / 부 / 원수들의 목숨
  - 오래 사는 것 / 부귀 / 원수들의 생명
  lexicon: days, riches, life
  rationale: 문맥상 각각 장수, 부, 원수의 생명을 뜻하지만, 원문의 병렬 구조를 살리기 위해 비교적 직접적으로 옮겼습니다.
- source_word: הָבִין לִשְׁמֹעַ מִשְׁפָּט
  english_pob_choice: understanding to hear justice
  chosen_korean: 듣고 분별할 수 있도록 이해력을
  alternatives_korean:
  - 판결을 듣고 분별할 수 있도록 지혜를
  - 재판을 이해하여 들을 수 있는 분별력을
  lexicon: understanding / hear / justice
  rationale: english_pob_translation의 ‘understanding to hear justice’를 따라, ‘듣고 분별할 수 있도록’으로 풀어 משפט의 사법적 성격을 살렸습니다.
theological_decisions:
- issue: מִשְׁפָּט의 번역
  chosen_reading: ‘justice’에 해당하는 재판적·분별적 의미를 살려 ‘듣고 분별할 수 있도록 이해력’으로 옮겼습니다.
  alternative_readings:
  - ‘판결’
  - ‘재판’
  rationale: 영문 POB가 ‘judgment’에서 ‘justice’로 조정한 흐름을 반영하여, 단순한 법정 용어보다 공의롭게 판별하는 능력에 초점을 맞췄습니다.
  doctrine_reference: 왕의 통치와 재판의 공의(열왕기상 3장 문맥)
