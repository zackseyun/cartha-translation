  yaml_path: translation/ot/1_kings/003/027.yaml
  text: Then the king answered and said[a], “Give her the living child, and by no means put him to death; she is his mother.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''dying you shall not cause him to die,'' an emphatic prohibition meaning ''you must certainly not kill him'' or ''by no means put him to death.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 대답하여 말했습니다. 「그 산 아이를 그 여자에게 주고, 그를 절대로 죽이지 마십시오.[a] 그 여자가 그 아이의 어머니입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘죽다/죽이다’라는 뜻의 동사를 거듭 사용하여 금지를 강하게 강조합니다. 곧 ‘결코 죽이지 마십시오’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  english_pob_choice: answered and said
  chosen_korean: 대답하며 말했습니다
  alternatives_korean:
  - 대답하고 말했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 서술 공식인 ‘대답하다 + 말하다’를 자연스러운 현대 한국어로 옮기되, 재판/공적 대화의 문체를 유지했습니다.
- source_word: הַיָּלוּד הַחַי
  english_pob_choice: the living child
  chosen_korean: 그 산 아이
  alternatives_korean:
  - 그 살아 있는 아이
  - 그 생존한 아이
  lexicon: HALOT
  rationale: יָלוּד는 ‘태어난 아이’이고 הַחַי는 ‘살아 있는’이므로, 문맥상 이미 분쟁의 대상이 된 유아를 가리키는 자연스러운 한국어로 ‘산 아이’를 택했습니다.
- source_word: וְהָמֵת לֹא תְמִיתֻהוּ
  english_pob_choice: by no means put him to death
  chosen_korean: 그를 절대로 죽이지 마십시오
  alternatives_korean:
  - 그를 결코 죽이지 마십시오
  - 그를 반드시 죽이지 마십시오
  lexicon: HALOT
  rationale: 히브리어의 부정 강화 구조(‘죽이게 하지 말라’의 강한 금지)를 한국어의 ‘절대로’로 살려, 단순한 금지보다 더 강한 명령을 드러냈습니다.
- source_word: הִיא אִמּוֹ
  english_pob_choice: she is his mother
  chosen_korean: 그 여자가 그의 어머니입니다
  alternatives_korean:
  - 그 여자가 아이의 어머니입니다
  - 그 여인이 그의 어머니입니다
  lexicon: HALOT
  rationale: 직접적인 신원 판정 문장으로서 관계를 분명히 드러내는 현대적 표현을 사용했고, 소유 접미사의 남성형은 한국어의 자연스러운 ‘그의’로 반영했습니다.
theological_decisions:
- issue: 왕의 명령문에서 직접 화법의 격식
  chosen_reading: 직접 인용 안에서는 공적 명령의 격식을 유지하되, 현대 한국어 독자가 바로 이해할 수 있도록 ‘-십시오’ 체를 사용했습니다.
  alternative_readings:
  - ‘죽이지 말라’식의 평서형 금지
  - 더 고풍스러운 명령형
  rationale: 히브리어 원문의 왕의 판결은 단순한 권고가 아니라 공적 명령이므로, 합쇼체 명령으로 그 권위를 보존했습니다.
  doctrine_reference: 서사 본문의 화법과 명령의 공적 성격
- issue: ‘그 산 아이’의 생명 대조
  chosen_reading: ‘산’으로 번역해 살아 있는 아이와 죽은 아이의 대조를 분명히 했습니다.
  alternative_readings:
  - ‘살아 있는’
  - ‘생존한’
  rationale: 본문의 대비는 생명/죽음의 판별에 있으므로, 가장 간결하고 자연스러운 대조 표현을 택했습니다.
  doctrine_reference: 본문 문맥의 생사 판정
