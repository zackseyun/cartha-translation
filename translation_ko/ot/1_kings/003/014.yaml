  text: וְ/אִ֣ם תֵּלֵ֣ךְ בִּ/דְרָכַ֗/י לִ/שְׁמֹ֤ר חֻקַּ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖ךְ דָּוִ֣יד אָבִ֑י/ךָ וְ/הַאַרַכְתִּ֖י אֶת יָמֶֽי/ךָ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/014.yaml
  text: And if you walk in my ways[a], keeping my statutes and my commandments, as David your father walked, then I will lengthen your days.
  footnotes:
  - marker: a
    text: Or 'I will prolong your life' / 'I will prolong your days.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 당신이 내 길로 걸으며 내 규례와 내 명령을 지켜, 당신의 아버지 다윗이 걸었던 것처럼 행하면, 내가 당신의 날들을 길게 하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘날들을 길게 하다’는 히브리어 관용구로, 곧 오래 살게 하다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם / And if
  english_pob_choice: And if
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 만일
  - 그리고 만약
  lexicon: HALOT
  rationale: 조건문 앞의 연결어 וְ를 살려 앞 문맥과 이어 주되, 현대 한국어에서는 ‘그리고 만일’이 가장 자연스럽게 조건의 연속성을 드러냅니다.
- source_word: תֵּלֵךְ בִּדְרָכַי
  english_pob_choice: you walk in my ways
  chosen_korean: 내 길로 걸으며
  alternatives_korean:
  - 내 길 안에서 걸으며
  - 내 길을 따라 걸으며
  lexicon: HALOT
  rationale: הלך의 언약적 비유를 ‘걷다’로 살리고, בִּדְרָכַי를 ‘내 길로’로 옮겨 방식/삶의 방향을 드러냈습니다.
- source_word: חֻקַּי וּמִצְוֺתַי
  english_pob_choice: my statutes and my commandments
  chosen_korean: 내 규례와 내 명령
  alternatives_korean:
  - 내 법도와 내 계명
  - 내 규정과 내 명령들
  lexicon: HALOT
  rationale: חֻקִּים과 מִצְוֹת의 구별을 유지하면서도, 한국어에서 익숙한 전통어를 무비판적으로 고정하지 않고 각각 ‘규례’와 ‘명령’으로 간결하게 살렸습니다.
- source_word: וְהַאַרַכְתִּי אֶת יָמֶיךָ
  english_pob_choice: then I will lengthen your days
  chosen_korean: 내가 당신의 날들을 길게 하겠습니다
  alternatives_korean:
  - 내가 당신의 생애를 길게 하겠습니다
  - 내가 당신의 날수를 늘리겠습니다
  lexicon: HALOT
  rationale: ‘날들’을 직역하되 한국어에서는 자연스럽게 ‘날들을 길게 하다’로 옮겨, 장수의 관용적 의미를 과도하게 풀지 않으면서도 문맥을 분명히 했습니다.
theological_decisions:
- issue: 조건적 순종과 생명 연장의 약속
  chosen_reading: 솔로몬의 순종에 대한 조건과 그 결과로 주어지는 ‘날들’의 연장을 그대로 보존했습니다.
  alternative_readings:
  - 무조건적인 왕조 보존 약속으로 완화
  - 일반적인 복으로 의역
  rationale: 본문은 순종의 조건을 분명히 제시하며, 구체적 결과도 ‘날들을 길게 하다’로 말합니다. 이를 일반화하거나 약화하지 않는 것이 원문 의미에 가장 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
