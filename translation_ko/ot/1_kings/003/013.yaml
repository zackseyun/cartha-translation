translation:
  language: ko
  text: 그리고 내가 네가 구하지 않은 것, 곧 부와 명예도 네게 주었습니다. 그래서 네 평생 동안 왕들 가운데 너와 같은 사람은 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그래서 네 평생 동안 왕들 가운데 너와 같은 사람이 없었습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: And I have also
  chosen_korean: 그리고 …까지도
  alternatives_korean:
  - 또
  - 뿐만 아니라
  lexicon: HALOT
  rationale: 추가되는 선물을 이어 주는 접속과 첨가의 힘을 살리기 위해 앞의 흐름을 잇는 ‘그리고’와 확대를 나타내는 ‘까지도’를 함께 썼습니다.
- source_word: אֲשֶׁר לֹא שָׁאַלְתָּ
  english_pob_choice: what you did not ask for
  chosen_korean: 네가 구하지 않은 것
  alternatives_korean:
  - 네가 요청하지 않은 것
  - 네가 구하지 않았던 바
  lexicon: HALOT
  rationale: דיון은 ‘ask’의 일반적 의미를 넘지 않으면서 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다. ‘구하다’는 청원적 맥락을 잘 드러냅니다.
- source_word: גַּם עֹשֶׁר גַּם כָּבוֹד
  english_pob_choice: both riches and honor
  chosen_korean: 부와 명예
  alternatives_korean:
  - 재물과 영예
  - 부유함과 존귀
  lexicon: HALOT
  rationale: ‘עֹשֶׁר’는 재물/부의 물질적 풍성함을 가리키므로 ‘부’로, ‘כָּבוֹד’는 왕 앞의 사회적 지위와 존중을 가리켜 ‘명예’로 옮겼습니다. 영어 POB의 ‘honor’에 맞춰 교회적 어휘인 ‘영광’은 피했습니다.
- source_word: כָּל יָמֶיךָ
  english_pob_choice: all your days
  chosen_korean: 네 평생
  alternatives_korean:
  - 네 모든 날 동안
  - 평생 동안
  lexicon: HALOT
  rationale: 히브리어 관용구를 현대 한국어에서 자연스러운 지속 범위로 풀어 옮겼습니다. 원문의 기간 전체를 뜻하는 힘은 유지했습니다.
theological_decisions:
- issue: ‘왕들 가운데는 없었습니다’의 비교 구조
  chosen_reading: 솔로몬이 왕들 가운데 유례가 없는 존재라는 뜻을 살려 ‘네와 같은 사람이 왕들 가운데는 없었습니다’로 옮겼습니다.
  alternative_readings:
  - 왕들 가운데 네 같은 왕은 없었습니다
  - 왕들 중에 네와 같은 이가 없었습니다
  rationale: 히브리어는 사람(אִישׁ)과 왕들(בַמְּלָכִים)을 함께 써서 비교의 폭을 넓힙니다. 따라서 ‘왕’으로만 좁히기보다 ‘사람’과 ‘왕들’의 대비를 함께 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
