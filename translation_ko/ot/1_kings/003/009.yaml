  source_fidelity: 히브리어의 핵심 구조와 청원 어조는 대체로 잘 반영했습니다. 그러나 הַכָּבֵד는 하나의 형용사인데 본문이 ‘크고도 무거운’으로 두 의미를 병렬 추가하여 원문의 표현을 확대합니다. 이를 한 표현으로 옮기고 문자적 의미는 주석으로 보완하는 편이 안전합니다.
  naturalness: ‘듣는 마음’과 합쇼체 청원은 자연스럽습니다. 다만 ‘이 크고도 무거운 이 백성’은 ‘이’가 중복되고, 사람들을 수식하는 ‘무거운’은 한국어에서 다소 부자연스럽습니다. ‘이처럼 중대한 주의 백성’은 문맥상 자연스럽고 원문의 무게·중요성의 함의를 전달합니다.
  terminology: ‘주의 종’, ‘듣는 마음’, ‘선과 악’, ‘분별하다’는 적절합니다. שׁפט는 재판만이 아니라 백성을 판단하고 통치하는 기능을 포괄하므로, 여기서는 ‘판단하다’가 ‘재판하다’보다 불필요하게 법정 절차로 좁히지 않습니다.
  issues:
