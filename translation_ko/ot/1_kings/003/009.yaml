  text: וְ/נָתַתָּ֨ לְ/עַבְדְּ/ךָ֜ לֵ֤ב שֹׁמֵ֨עַ֙ לִ/שְׁפֹּ֣ט אֶֽת עַמְּ/ךָ֔ לְ/הָבִ֖ין בֵּֽין ט֣וֹב לְ/רָ֑ע כִּ֣י מִ֤י יוּכַל֙ לִ/שְׁפֹּ֔ט אֶת עַמְּ/ךָ֥ הַ/כָּבֵ֖ד הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/009.yaml
  text: So give your servant a listening heart to judge your people[a], to discern between good and evil[b], for who is able to judge this great people of yours?
  footnotes:
  - marker: a
    text: Or 'an understanding heart'; literally 'a hearing/listening heart.'
    reason: lexical_alternative
  - marker: b
    text: '''Great'' renders a Hebrew word literally meaning ''heavy'' or ''weighty,'' here expressing the people''s significance or the burden of governing them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주의 종에게 듣는 마음[a]을 주시어 주의 백성을 판단하고 선과 악을 분별하게 하소서. 이처럼 중대한[b] 주의 백성을 누가 판단할 수 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이해하는 마음’. 문자적으로는 ‘듣는/경청하는 마음’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘무거운’ 또는 ‘무게 있는’이라는 뜻이며, 여기서는 백성의 중대함 또는 그들을 다스리는 일의 부담을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  english_pob_choice: So give
  chosen_korean: 그러므로 … 주셔서
  alternatives_korean:
  - 그리고 … 주셔서
  - 또 … 주셔서
  lexicon: WLC
  rationale: 앞선 문맥에서 이어지는 청원의 흐름을 한국어에서 자연스럽게 살리기 위해 결과·귀결의 연결어로 옮겼습니다.
- source_word: לְעַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 당신의 종
  lexicon: HALOT
  rationale: 왕이 하나님께 드리는 겸손한 자기 호칭으로서 ‘종’이 가장 자연스럽고, 여기서는 종속 상태를 드러내는 ‘노예’보다 관용적 표현이 더 적절합니다.
- source_word: לֵב שֹׁמֵעַ
  english_pob_choice: a listening heart
  chosen_korean: 듣는 마음
  alternatives_korean:
  - 이해하는 마음
  - 경청하는 마음
  lexicon: HALOT
  rationale: 히브리어의 직역적 이미지를 살려 ‘마음’과 ‘듣는’의 결합을 유지했습니다. ‘이해하는 마음’은 해석을 더 강하게 넣는 표현입니다.
- source_word: לִשְׁפֹּט
  english_pob_choice: to judge
  chosen_korean: 재판하게 하시고
  alternatives_korean:
  - 판단하게 하시고
  - 다스리게 하시고
  lexicon: HALOT
  rationale: 이 동사는 통치적 의미도 포함하지만, 문맥상 백성을 가르고 판결하는 왕의 기능이 두드러지므로 ‘재판하다’가 핵심을 가장 잘 반영합니다.
- source_word: לְהָבִין בֵּין טוֹב לְרָע
  english_pob_choice: to discern between good and evil
  chosen_korean: 선과 악을 분별하게 하소서
  alternatives_korean:
  - 좋음과 악함을 분별하게 하소서
  - 옳고 그름을 분별하게 하소서
  lexicon: HALOT
  rationale: 히브리어의 도덕적 대비를 직접 살리면서, 한국어에서는 대구가 자연스러운 ‘선과 악’을 택했습니다. ‘옳고 그름’은 의미를 다소 일반화합니다.
- source_word: הַכָּבֵד
  english_pob_choice: great
  chosen_korean: 무거운
  alternatives_korean:
  - 큰
  - 중한
  - 크고 무거운
  lexicon: HALOT
  rationale: 히브리어의 문자적 뜻인 ‘무거운/무게 있는’을 보존해 통치의 부담과 백성의 중대함을 함께 드러냈습니다. 앞의 ‘크고도’는 문맥상 자연스러운 보강입니다.
theological_decisions:
- issue: 솔로몬의 청원에서 ‘마음’ 이미지 유지
  chosen_reading: 듣는 마음
  alternative_readings:
  - 이해하는 마음
  - 지혜로운 마음
  rationale: 히브리어의 ‘마음’은 인지와 의지의 중심을 가리키므로, 이를 유지해야 솔로몬의 요구가 단순 지적 능력이 아니라 하나님 앞에서의 분별력을 뜻한다는 점이 보존됩니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
