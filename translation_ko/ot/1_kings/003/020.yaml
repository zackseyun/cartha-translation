id: 1KI.3.20
reference: 1 Kings 3:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּקָם֩ בְּ/ת֨וֹךְ הַ/לַּ֜יְלָה וַ/תִּקַּ֧ח אֶת בְּנִ֣/י מֵֽ/אֶצְלִ֗/י וַ/אֲמָֽתְ/ךָ֙ יְשֵׁנָ֔ה וַ/תַּשְׁכִּיבֵ֖/הוּ בְּ/חֵיקָ֑/הּ וְ/אֶת בְּנָ֥/הּ הַ/מֵּ֖ת הִשְׁכִּ֥יבָה בְ/חֵיקִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/020.yaml
  text: She got up in the middle of the night and took my son from beside me while your servant was sleeping[a], and she laid him in her bosom, and laid her dead son in my bosom.
  footnotes:
  - marker: a
    text: Or 'in her lap ... in my lap.' The Hebrew חֵיק can refer to the bosom or lap; 'bosom' was chosen to preserve the intimate maternal setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여자가 밤 한가운데에 일어나, 이 여종이 자고 있는 동안 제 곁에서 제 아들을 데려다가 자기 품[a]에 눕히고, 자기의 죽은 아들은 제 품에 눕혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘헤이크’는 ‘품’ 외에 ‘가슴’이나 ‘무릎’을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ הַלַּיְלָה
  english_pob_choice: in the middle of the night
  chosen_korean: 밤 한가운데
  alternatives_korean:
  - 한밤중에
  - 밤중에
  lexicon: HALOT
  rationale: בְּתוֹךְ는 단순한 ‘밤에’가 아니라 밤의 한가운데라는 강한 시간 표시이므로, 자연스러운 현대 한국어로 그 힘을 살렸습니다.
- source_word: מֵאֶצְלִי
  english_pob_choice: from beside me
  chosen_korean: 내 아들 곁에서
  alternatives_korean:
  - 내 곁에서
  - 내 옆에서
  lexicon: HALOT
  rationale: 문맥상 아이가 잠든 자리의 바로 옆을 뜻하므로 ‘곁에서’가 가장 자연스럽고, POB의 proximity 뉘앙스를 잘 반영합니다.
- source_word: וַאֲמָתְךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 여종
  - 이 종
  lexicon: HALOT
  rationale: 왕에게 자신을 낮추는 관용적 표현이므로, 성별을 과도하게 드러내는 ‘여종’보다 courtly한 ‘당신의 종’이 본문의 격식을 더 잘 살립니다.
- source_word: חֵיק
  english_pob_choice: bosom
  chosen_korean: 품
  alternatives_korean:
  - 가슴
  - 무릎
  - 팔
  lexicon: HALOT
  rationale: חֵיק은 신체적으로 꼭 ‘가슴’만이 아니라 가까이 품는 공간을 가리키므로, 현대 한국어에서는 친밀한 모성적 포용을 살리는 ‘품’이 가장 무리 없습니다.
theological_decisions:
- issue: 밤중에 아기를 바꿔치기하는 장면의 서술 강도
  chosen_reading: 서사적 충격을 약화하지 않고, 행위의 연속성과 의도성을 그대로 드러내는 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 더 완곡하게 풀어 쓰는 번역
  - 행위를 압축해 서술하는 번역
  rationale: 이 구절은 감정적 긴장과 도덕적 충격이 핵심이므로, 사건의 순서를 선명하게 보존하는 것이 독자 이해에 중요합니다.
  doctrine_reference: 서사 본문의 의미 보존 원칙
- issue: חֵיק의 번역
  chosen_reading: ‘품’으로 옮겨, 육체적 거리감과 친밀한 관계의 긴장을 동시에 살렸습니다.
  alternative_readings:
  - ‘가슴’으로 옮김
  - ‘무릎’으로 옮김
  rationale: ‘가슴’은 다소 해부학적이고, ‘무릎’은 이 문맥의 수면 장면과 맞지 않으므로 ‘품’이 본문의 모성적·가정적 분위기를 가장 잘 전달합니다.
  doctrine_reference: 어휘 의미와 서사 맥락의 균형
