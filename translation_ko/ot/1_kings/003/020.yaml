review_pass:
  verdict: revise
  source_fidelity: 원문의 מֵאֶצְלִי는 ‘내 곁에서’라는 뜻인데, 초안의 ‘내 아들 곁에서’는 대상을 바꾸며 ‘내 아들’이 불필요하게 반복됩니다. 또한 여성 화자를 가리키는 주어를 ‘그는’으로 둔 것은 부정확합니다. 수정문은 밤중에 일어남, 화자가 자는 동안의 행위, 아이들의 교체 순서, חֵיק의 가까운 신체적 위치를 보존합니다.
  naturalness: ‘그 여자가’, ‘이 여종’, ‘제 곁에서 제 아들을 데려다가’는 왕 앞에서 한 여성이 진술하는 장면에 자연스럽고 현대 표준어 합쇼체에 맞습니다. ‘품’은 수면·양육 장면에서 자연스럽습니다.
  terminology: אֲמָתְךָ는 여성 화자의 겸양 표현이므로 ‘이 여종’으로 옮겼습니다. חֵיק은 ‘품’으로 번역하되, ‘가슴/무릎’ 범위의 어휘적 가능성은 각주로 밝혔습니다.
  issues:
