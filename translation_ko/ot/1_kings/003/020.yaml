    issue: ‘내 아들 곁에서 내 아들을’
    rationale: מֵאֶצְלִי는 ‘내 곁에서’이며, 초안은 소유·위치의 기준을 화자에서 아들로 바꾸고 목적어를 중복합니다.
  - severity: medium
    issue: 여성 인물을 ‘그는’으로 지칭
    rationale: 본문의 행위자는 두 산모 중 한 여성입니다. 한국어의 남성 지시어 ‘그는’은 성별 정보를 잘못 전달합니다.
  - severity: low
    issue: חֵיק의 어휘 범위에 대한 각주 부재
    rationale: 영어 POB 감사 기록이 ‘bosom/lap’의 대안을 각주로 유지하므로, 한국어에서도 ‘품’의 번역 선택과 범위를 짧게 표시하는 것이 적절합니다.
  revised_text: 그 여자가 밤 한가운데에 일어나, 이 여종이 자고 있는 동안 제 곁에서 제 아들을 데려다가 자기 품[a]에 눕히고, 자기의 죽은 아들은 제 품에 눕혔습니다.
