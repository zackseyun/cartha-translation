- from: 그는 밤 한가운데 일어나서, 당신의 종이 자고 있을 때 내 아들 곁에서 내 아들을 빼앗아 갔습니다. 그리고 그를 자기 품에 눕히고, 죽은 자기 아들을 내 품에 눕혔습니다.
  to: 그 여자가 밤 한가운데에 일어나, 이 여종이 자고 있는 동안 제 곁에서 제 아들을 데려다가 자기 품[a]에 눕히고, 자기의 죽은 아들은 제 품에 눕혔습니다.
  rationale: 위치 표현을 ‘제 곁에서’로 바로잡고, 여성 행위자를 정확히 지시했습니다. 왕에게 드리는 진술의 겸양을 ‘이 여종’으로 자연스럽게 살렸으며, חֵיק은 두 번 모두 ‘품’으로 일관되게 번역하고 그 어휘적 범위를 각주로 보존했습니다.
