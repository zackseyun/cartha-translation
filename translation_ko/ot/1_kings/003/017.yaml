  text: 그때 한 여자가 말했습니다. “제발, 나리. 저와 이 여자는 한 집에 살고 있었는데, 그 여자가 저와 함께 그 집에 있을 때 제가 아이를 낳았습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  english_pob_choice: Please, my lord
  chosen_korean: 제발, 내 주님
  alternatives_korean:
  - 부디, 제 주인님
  - 청컨대, 내 주님
  lexicon: בִּי; אֲדֹנִי
  rationale: 호소하는 완곡 표현 בִּי는 한국어의 자연스러운 간청인 ‘제발’로, אֲדֹנִי는 문맥상 공적 호칭을 살려 ‘내 주님’으로 옮겼습니다.
- source_word: יֹשְׁבֹת
  english_pob_choice: live
  chosen_korean: 살고 있었고
  alternatives_korean:
  - 살고 있고
  - 거주하고 있었고
  lexicon: יָשַׁב
  rationale: 히브리어 분사형은 진행·상태를 나타내므로, 단순 현재보다 서술 흐름에 맞는 ‘살고 있었고’가 가장 자연스럽습니다.
- source_word: בַּֽיִת
  english_pob_choice: house
  chosen_korean: 한 집
  alternatives_korean:
  - 한 집안
  - 한 가옥
  lexicon: בַּיִת
  rationale: 반복되는 공간 배경을 한국어에서 간결하게 살리기 위해 ‘한 집’으로 옮겼습니다.
- source_word: וָאֵלֵד
  english_pob_choice: I gave birth
  chosen_korean: 아이를 낳았습니다
  alternatives_korean:
  - 출산했습니다
  - 낳았습니다
  lexicon: יָלַד
  rationale: 출산 행위를 직접적으로 드러내되 현대 한국어에서 가장 자연스러운 표현인 ‘아이를 낳았습니다’를 선택했습니다.
theological_decisions:
- issue: 화자에게 쓰인 אֲדֹנִי의 호칭 강도
  chosen_reading: 민원적·예의적 호칭으로 처리해 ‘내 주님’으로 번역했습니다.
  alternative_readings:
