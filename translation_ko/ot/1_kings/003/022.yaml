  to: 그러나 다른 여자가 말했습니다[a]. 「아니오! 내 아들이 살아 있는 아이이고, 당신 아들이 죽은 아이입니다.」 그러자 이 여자가 말했습니다. 「아니오! 당신 아들이 죽은 아이이고, 내 아들이 살아 있는 아이입니다.」 그래서 그들은 왕 앞에서 말했습니다.
