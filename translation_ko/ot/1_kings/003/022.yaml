  edition: WLC
  text: וַ/תֹּאמֶר֩ הָ/אִשָּׁ֨ה הָ/אַחֶ֜רֶת לֹ֣א כִ֗י בְּנִ֤/י הַ/חַי֙ וּ/בְנֵ֣/ךְ הַ/מֵּ֔ת וְ/זֹ֤את אֹמֶ֨רֶת֙ לֹ֣א כִ֔י בְּנֵ֥/ךְ הַ/מֵּ֖ת וּ/בְנִ֣/י הֶ/חָ֑י וַ/תְּדַבֵּ֖רְנָה לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/022.yaml
  text: But the other woman said[a], “No! My son is the living one, and your son is the dead one.” And this one said, “No! Your son is the dead one, and my son is the living one.” So they spoke before the king.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'My son is alive, and your son is dead ... your son is dead, and my son is alive.' The main text preserves the Hebrew contrast 'the living one / the dead one.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 다른 여자가 말했습니다[a]. 「아니오! 살아 있는 아이는 내 아들이고, 죽은 아이는 당신 아들입니다.」 그러자 이 여자가 말했습니다. 「아니오! 당신 아들이 죽은 아이이고, 내 아들이 살아 있는 아이입니다.」 그래서 그들이 왕 앞에서 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 아들은 살아 있는 자이고, 당신 아들은 죽은 자입니다…’라는 구조입니다. 본문은 히브리어의 ‘살아 있는 자 / 죽은 자’ 대조를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הָאַחֶרֶת
  english_pob_choice: the other woman
  chosen_korean: 다른 여자
  alternatives_korean:
  - 다른 여인
  - 다른 여자
  lexicon: HALOT
  rationale: 두 여인의 분쟁이라는 문맥에서 일반적이고 자연스러운 표현을 택했으며, 영어 POB처럼 혼인 관계를 뜻하는 ‘아내’로 좁히지 않았습니다.
- source_word: לֹא כִי
  english_pob_choice: No!
  chosen_korean: 아니오!
  alternatives_korean:
  - 아니요!
  - 아니!
  lexicon: HALOT
  rationale: 강한 부정과 즉각적 반박을 살리기 위해 짧고 단호한 감탄형으로 옮겼습니다.
- source_word: בְּנִי הַחַי / בְּנֵךְ הַמֵּת
  english_pob_choice: my son is the living one / your son is the dead one
  chosen_korean: 살아 있는 아이 / 죽은 아이
  alternatives_korean:
  - 살아 있는 아들 / 죽은 아들
  - 살아 있는 자 / 죽은 자
  lexicon: HALOT
  rationale: 히브리어의 대조 구조는 ‘살아 있는 것/죽은 것’이라는 식별 표현이지만, 한국어에서는 바로 앞뒤 문맥의 법정식 다툼에 맞게 ‘아이’로 풀어 주어 의미를 자연스럽게 전달했습니다.
- source_word: וְזֹאת אֹמֶרֶת
  english_pob_choice: And this one said
  chosen_korean: 그러자 이 여자가 말했습니다
  alternatives_korean:
  - 그리고 이 사람이 말했습니다
  - 이 여자가 말했습니다
  lexicon: HALOT
  rationale: זֹאת의 지시적 뉘앙스를 살리되 한국어에서는 ‘이 여자’가 가장 분명하게 대조를 드러내므로 그렇게 옮겼습니다.
- source_word: לִפְנֵי הַמֶּלֶךְ
  english_pob_choice: before the king
  chosen_korean: 왕 앞에서
  alternatives_korean:
  - 왕의 앞에서
  - 왕 앞에
  lexicon: HALOT
  rationale: 히브리어 전치사구를 자연스러운 현대 한국어로 옮기되, 공식적 진술 장면의 분위기를 유지했습니다.
