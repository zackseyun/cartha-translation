base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/022.yaml
  text: But the other woman said[a], “No! My son is the living one, and your son is the dead one.” And this one said, “No! Your son is the dead one, and my son is the living one.” So they spoke before the king.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'My son is alive, and your son is dead ... your son is dead, and my son is alive.' The main text preserves the Hebrew contrast 'the living one / the dead one.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 다른 여자가 말했습니다[a]. 「아니오! 내 아들이 살아 있는 아이이고, 당신 아들이 죽은 아이입니다.」 그러자 이 여자가 말했습니다. 「아니오! 당신 아들이 죽은 아이이고, 내 아들이 살아 있는 아이입니다.」 그래서 그들은 왕 앞에서 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 아들이 그 살아 있는 아이이고, 당신 아들이 그 죽은 아이이다 … 당신 아들이 그 죽은 아이이고, 내 아들이 그 살아 있는 아이이다’라는 뜻입니다. 본문은 히브리어의 ‘살아 있는 아이 / 죽은 아이’라는 대조를 자연스럽게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הָאַחֶרֶת
  english_pob_choice: the other woman
  chosen_korean: 다른 여자
  alternatives_korean:
  - 다른 여인
