base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/018.yaml
  text: And on the third day after I gave birth[a], this woman also gave birth. And we were together; there was no stranger with us in the house, only the two of us were in the house.
  footnotes:
  - marker: a
    text: Or 'there was no outsider with us in the house.' The Hebrew word can denote someone not belonging to the group or household.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제가 해산한 지 사흘째 되는 날, 이 여자도 해산했습니다. 우리는 함께 있었고, 집 안에는 우리와 함께 있던 외부인이 없었습니다[a]. 집 안에는 우리 둘만 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낯선 사람’. 히브리어 זָר는 집단이나 가정에 속하지 않은 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ...
  chosen_korean: 그리고
  alternatives_korean:
  - 그때
  - 그러고 나서
  lexicon: HALOT
  rationale: 서사 진행을 여는 וַיְהִי를 한국어에서는 과도하게 해석하지 않고 단순한 연결어로 살렸습니다.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי לְלִדְתִּי
  english_pob_choice: on the third day after I gave birth
  chosen_korean: 제 셋째 날에 내가 해산했습니다
  alternatives_korean:
  - 내가 해산한 지 사흘째 되는 날에
  - 제가 아이를 낳은 지 사흘째에
  lexicon: HALOT
  rationale: 시간표현은 원문의 관계를 자연스럽게 드러내기 위해 ‘사흘째’와 해산을 결합해 옮겼습니다.
- source_word: זָר
  english_pob_choice: stranger / outsider
  chosen_korean: 낯선 사람
  alternatives_korean:
  - 외인
  - 아무도
  lexicon: HALOT
  rationale: זָר의 핵심 의미는 공동체/가정에 속하지 않은 사람으로, 문맥상 ‘낯선 사람’이 가장 무리 없이 그 긴장을 살립니다.
theological_decisions:
- issue: 화자 진술의 법정적 강조를 한국어에서 어떻게 유지할지
  chosen_reading: 증언성 있는 직설적 서술을 유지했습니다.
  alternative_readings:
  - 더 부드럽게 풀어쓴 설명문체
  - 법정적 뉘앙스를 약화한 일반 서술
  rationale: 이 구절은 분쟁 상황의 진술이므로, 원문의 단정적이고 배타적인 진술 구조를 그대로 드러내는 것이 중요합니다.
  doctrine_reference: 본문 장르 보존
- issue: “우리와 함께 낯선 사람이 없었으며”의 배타성 처리
  chosen_reading: ‘우리 둘만 집 안에 있었습니다’로 배타성을 명시했습니다.
  alternative_readings:
  - ‘아무도 없었습니다’
  - ‘우리만 있었습니다’
  rationale: 히브리어의 זוּלָתִי + שְׁתַּיִם 구조는 단순 부재가 아니라 둘만의 존재를 강조하므로, 그 배타성을 한국어에서도 분명히 했습니다.
  doctrine_reference: 문맥적 충실성
