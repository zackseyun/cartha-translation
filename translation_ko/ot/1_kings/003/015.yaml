reference: 1 Kings 3:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַ֥ץ שְׁלֹמֹ֖ה וְ/הִנֵּ֣ה חֲל֑וֹם וַ/יָּב֨וֹא יְרוּשָׁלִַ֜ם וַֽ/יַּעֲמֹ֣ד לִ/פְנֵ֣י אֲר֣וֹן בְּרִית אֲדֹנָ֗/י וַ/יַּ֤עַל עֹלוֹת֙ וַ/יַּ֣עַשׂ שְׁלָמִ֔ים וַ/יַּ֥עַשׂ מִשְׁתֶּ֖ה לְ/כָל עֲבָדָֽי/ו׀׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/015.yaml
  text: Then Solomon awoke[a], and behold, it was a dream. And he came to Jerusalem and stood before the ark of the covenant of the LORD, and offered up burnt offerings and made peace offerings, and made a feast for all his servants.
  footnotes:
  - marker: a
    text: Or 'peace offerings,' possibly emphasizing shared fellowship in the sacrificial meal; some translations render שְׁלָמִים as 'fellowship offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬이 깨어 보니, 꿈이었습니다. 그는 예루살렘에 와서 주님의 언약궤 앞에 서서 번제와 화목제[a]를 드리고, 모든 신하들을 위하여 잔치를 베풀었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화목제’는 히브리어 셸라밈(שְׁלָמִים)을 옮긴 말입니다. 이 제사는 제물 식사를 함께 나누는 교제를 포함할 수 있어 ‘친교제’로 번역되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַץ
  english_pob_choice: awoke
  chosen_korean: 깨어 보니
  alternatives_korean:
  - 깨어났습니다
  - 잠에서 깼습니다
  lexicon: HALOT
  rationale: 꿈에서 깨어남과 그 직후의 인식 전환을 자연스러운 한국어로 살리기 위해 ‘깨어 보니’로 옮겼습니다.
- source_word: אֲרוֹן בְּרִית אֲדֹנָי
  english_pob_choice: the ark of the covenant of the LORD
  chosen_korean: 주님의 언약궤
  alternatives_korean:
  - 주님의 언약의 궤
  - 주님의 계약궤
  lexicon: HALOT
  rationale: 언약궤라는 통용되는 성경 용어를 유지하되, POB의 YHWH/주님 관례에 따라 ‘주님의’로 옮겨 소유 관계를 분명히 했습니다.
- source_word: שְׁלָמִים
  english_pob_choice: peace offerings
  chosen_korean: 화목제물
  alternatives_korean:
  - 화목제
  - 평화제물
  lexicon: HALOT
  rationale: POB의 영어 선택은 제의적 범주를 가리키므로, 한국어 성경에서 널리 쓰이면서도 제물의 성격을 드러내는 ‘화목제물’로 옮겼습니다.
- source_word: מִשְׁתֶּה
  english_pob_choice: a feast
  chosen_korean: 잔치
  alternatives_korean:
  - 연회
  - 축연
  lexicon: HALOT
  rationale: 의례적 제사 뒤의 공동 식사/기쁨의 자리를 자연스럽게 드러내는 한국어로 ‘잔치’가 가장 적절합니다.
theological_decisions:
- issue: אֲדֹנָי 표기와 야훼/주님의 번역 관례
  chosen_reading: 본문의 ‘אֲדֹנָי’는 한국어 본문에서 ‘주님’으로 번역했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 제공된 원문은 אֲדֹנָי이지만, POB의 확정된 경건 언어 관례와 한국어 성경독자 가독성을 고려해 ‘주님’을 택했습니다. 이 구절은 서술문 안의 소유격 표현이므로 ‘주님의 언약궤’가 가장 자연스럽고도 원문 의미를 보존합니다.
  doctrine_reference: 'POB contested terms: YHWH/related covenantal divine-name language → 주님'
- issue: וַיִּקַץ의 서술 효과
  chosen_reading: ‘깨어 보니, 꿈이었습니다’로 꿈의 해소와 놀라움을 함께 살렸습니다.
  alternative_readings:
  - 꿈에서 깼습니다
  - 그때 그가 깨어났고, 보니 꿈이었습니다
  rationale: 히브리어의 돌발적 전환을 단순 과거보다 더 생생하게 드러내기 위해, 그러나 과장 없이, ‘깨어 보니’ 구문을 사용했습니다.
  doctrine_reference: Narrative discourse clarity
