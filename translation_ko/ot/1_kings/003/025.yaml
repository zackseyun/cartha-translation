  text: 그러자 왕이 말했습니다. 「살아 있는 아이를 둘로 잘라라. 그리고 반은 한쪽에게, 반은 다른 쪽에게 주어라」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘한 여자에게 ... 한 여자에게’에 해당하는 여성형 단수를 사용하며, 앞서 나온 두 여성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 완결된 이전 사건에서 이어지는 서술이므로, 전후 맥락의 진행을 자연스럽게 살리는 연결어로 옮겼습니다.
- source_word: הַמֶּלֶךְ
