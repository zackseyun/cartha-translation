translation:
  language: ko
  text: 그러자 왕이 말했습니다. 「살아 있는 아이를 둘로 나누어라. 그리고 반은 한쪽에게, 반은 다른 쪽에게 주어라」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여성형 단수 '한 사람에게 ... 한 사람에게'를 사용하여, 앞서 나온 두 여성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 완결된 이전 사건에서 이어지는 서술이므로, 전후 맥락의 진행을 자연스럽게 살리는 연결어로 옮겼습니다.
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 임금
  lexicon: HALOT
  rationale: 정관사는 한국어에서 보통 따로 드러내지 않으므로, 문맥상 분명한 인물을 간결하게 옮겼습니다.
- source_word: גִּזְרוּ
  english_pob_choice: Cut
  chosen_korean: 나누어라
  alternatives_korean:
  - 베어라
  - 자르라
  lexicon: HALOT
  rationale: 명령의 핵심은 실제로 아이를 둘로 가르는 행위이지만, 한국어에서는 살해 뉘앙스를 직설적으로 과장하기보다 문맥이 이미 드러내는 폭력성을 유지하는 동사로 옮겼습니다.
- source_word: לִשְׁנָיִם
  english_pob_choice: in two
  chosen_korean: 둘로
  alternatives_korean:
  - 두 조각으로
  - 둘로 나누어
  lexicon: HALOT
  rationale: 히브리어의 분할 결과를 한국어에서도 직접적으로 드러내기 위해 수량 부사형으로 옮겼습니다.
- source_word: הַחֲצִי ... לְאַחַת ... לְאֶחָת
  english_pob_choice: half ... to the one ... half ... to the other
  chosen_korean: 반은 한쪽에게, 반은 다른 쪽에게
  alternatives_korean:
  - 한 반은 한 사람에게, 다른 반은 다른 사람에게
  - 절반은 이쪽에게, 절반은 저쪽에게
  lexicon: HALOT
  rationale: 원문은 두 여성에게 각각 절반씩 주라는 뜻이므로, 영어 POB처럼 'one woman'을 덧붙이지 않고 분배 대상을 문맥상 분명한 '한쪽/다른 쪽'으로 처리했습니다.
theological_decisions:
- issue: 왕의 명령의 폭력성과 서술 톤
  chosen_reading: 본문의 충격적·폭력적 명령을 완화하지 않고 직설적으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 해석하여 '가르다' 정도로 약화
  - 살해 의도를 드러내기 위해 더 노골적인 표현 사용
  rationale: 이 장면의 긴장과 지혜 시험의 극적 효과는 명령의 잔혹성이 드러날 때 유지되므로, 의미를 희석하지 않는 번역을 택했습니다.
  doctrine_reference: 성경 서술의 현실 묘사와 문학적 긴장 보존
