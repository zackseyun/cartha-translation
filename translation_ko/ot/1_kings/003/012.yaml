id: 1KI.3.12
reference: 1 Kings 3:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֥ה עָשִׂ֖יתִי כִּ/דְבָרֶ֑י/ךָ הִנֵּ֣ה נָתַ֣תִּי לְ/ךָ֗ לֵ֚ב חָכָ֣ם וְ/נָב֔וֹן אֲשֶׁ֤ר כָּמ֨וֹ/ךָ֙ לֹא הָיָ֣ה לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹא יָק֥וּם כָּמֽוֹ/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/012.yaml
  text: Behold[a], I have done according to your words. Behold, I have given you a wise and discerning heart, such that no one like you has been before you, and no one like you shall arise after you.
  footnotes:
  - marker: a
    text: Or 'understanding heart.' Hebrew 'heart' includes the inner faculty of thought, judgment, and discernment, not merely emotion.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 당신의 말대로 하였습니다. 보십시오, 내가 당신에게 지혜롭고 분별력 있는 마음[a]을 주었습니다. 당신 이전에는 당신과 같은 이가 없었고, 당신 이후에도 당신과 같은 이가 일어나지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜롭고 이해력 있는 마음’. 히브리어 ‘마음’은 단순한 감정이 아니라 사고, 판단, 분별의 중심을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의를 환기하는 담화 표지로 살려, 하나님의 선언적 어조를 현대 한국어의 공손한 명령형으로 자연스럽게 옮겼습니다.
- source_word: כִּדְבָרֶיךָ
  english_pob_choice: according to your words
  chosen_korean: 당신의 말대로
  alternatives_korean:
  - 당신의 요청대로
  - 당신이 말한 대로
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘당신의 말’의 의미를 살리되, 한국어에서는 ‘말대로’가 가장 자연스럽고 문맥상 요청의 응답이라는 뜻도 함께 드러냅니다.
- source_word: לֵב חָכָם וְנָבוֹן
  english_pob_choice: a wise and discerning heart
  chosen_korean: 지혜롭고 분별하는 마음
  alternatives_korean:
  - 지혜롭고 이해하는 마음
  - 현명하고 통찰력 있는 마음
  - 지혜와 분별의 마음
  lexicon: HALOT
  rationale: ‘마음’은 히브리어 לֵב의 사고·판단의 중심을 보존하고, ‘분별하는’은 נָבוֹן의 통찰/판단 뉘앙스를 살립니다. 영어 주석의 ‘heart’ 의미 범위를 반영했습니다.
- source_word: לֹא הָיָה לְפָנֶיךָ ... לֹא יָקוּם כָּמוֹךָ
  english_pob_choice: no one like you has been before you ... no one like you shall arise after you
  chosen_korean: 당신과 같은 사람은 당신 이전에도 없었고, 당신 이후에도 일어나지 않을 것입니다
  alternatives_korean:
  - 당신 같은 이는 이전에도 없었고 이후에도 일어나지 않을 것입니다
  - 당신과 같은 자는 당신 앞에도 없었고 뒤에도 일어나지 않을 것입니다
  lexicon: HALOT
  rationale: 비교의 범위를 지혜의 부여와 연결된 인물상에 유지하면서, 히브리어의 ‘일어나다’(יקום)를 미래적 출현의 이미지로 살렸습니다.
theological_decisions:
- issue: 솔로몬의 탁월함의 범위
  chosen_reading: 이 절은 솔로몬에게 주어진 지혜롭고 분별하는 마음의 유일무이함을 말하며, 모든 면에서의 절대적 우월성을 선언하지는 않습니다.
  alternative_readings:
  - 인물 전체의 절대적 탁월성에 대한 진술
  rationale: 문맥이 선물된 지혜와 분별에 집중하므로, 본문이 말하는 범위를 넘는 포괄적 주장으로 확장하지 않았습니다.
  doctrine_reference: 문맥 우선 원칙; 본문이 명시하지 않는 신학적 확대를 보류함
