base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/001.yaml
  text: Solomon formed a marriage alliance with Pharaoh king of Egypt[a], and he took Pharaoh’s daughter and brought her into the city of David until he had finished building his own house, and the house of Yahweh[b], and the wall around Jerusalem.
  footnotes:
  - marker: a
    text: Or, 'became related by marriage to Pharaoh.' The Hebrew verb can emphasize entering a marriage relationship, here likely with political alliance overtones.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the temple of the LORD' for 'the house of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 이집트 왕 바로와 혼인 동맹을 맺었고, 바로의 딸을 맞아 다윗 성으로 데려갔습니다. 그는 자기 집과 야훼의 집과 예루살렘 사방의 성벽 건축을 마칠 때까지 그렇게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바로와 혼인 관계가 되었다.’ 히브리어 동사는 혼인 관계에 들어감을 뜻할 수 있으며, 여기서는 정치적 동맹의 뉘앙스가 함께 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼의 성전’이라 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַתֵּן
  english_pob_choice: formed a marriage alliance with
  chosen_korean: 혼인 동맹을 맺었고
  alternatives_korean:
  - 혼인 관계를 맺었고
  - 사돈 관계가 되었고
  lexicon: HALOT
  rationale: 히트파엘 형태는 단순히 결혼했다는 뜻보다 왕실의 정치적 혼인 관계를 포함하므로, ‘혼인 동맹’이 문맥의 외교적 뉘앙스를 가장 잘 살립니다.
- source_word: וַיִּקַּח אֶת בַּת פַּרְעֹה
  english_pob_choice: and he took Pharaoh’s daughter
  chosen_korean: 바로의 딸을 맞아
  alternatives_korean:
  - 바로의 딸을 데려왔고
  - 바로의 딸과 결혼했고
  lexicon: HALOT
  rationale: ‘취하다/데려오다’의 직역을 피하면서도 히브리어 관용구의 혼인 의미를 자연스럽게 드러내기 위해 ‘맞아’로 옮겼습니다.
- source_word: אֶל עִיר דָּוִד
  english_pob_choice: into the city of David
  chosen_korean: 다윗 성으로 데려갔습니다
  alternatives_korean:
  - 다윗 성 안으로 데려갔습니다
  - 다윗 성에 데려갔습니다
  lexicon: HALOT
  rationale: 동작의 도착점을 살리면서 한국어에서 더 자연스러운 목적지 표현을 택했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 성전
  lexicon: HALOT
  rationale: 원문 직역인 ‘집’을 유지하고, 프로젝트 기본값에 따라 יְהוָה는 ‘야훼’로 옮겼습니다. ‘성전’은 후대적 해석을 덧붙일 수 있어 보류했습니다.
- source_word: חוֹמַת יְרוּשָׁלִַם סָבִיב
  english_pob_choice: the wall around Jerusalem
  chosen_korean: 예루살렘 사방의 성벽
  alternatives_korean:
  - 예루살렘을 둘러싼 성벽
  - 예루살렘 주위의 성벽
  lexicon: HALOT
  rationale: סָבִיב의 둘러싸는 범위를 한국어 관용 표현인 ‘사방의’로 자연스럽게 살렸습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 신명기를 직접 인용하는 것이 아니라 역사 서술 속에서 하나님의 고유명을 사용하므로, 프로젝트 기본값대로 고유명 ‘야훼’를 유지했습니다.
