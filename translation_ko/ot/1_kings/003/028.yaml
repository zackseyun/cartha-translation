  yaml_path: translation/ot/1_kings/003/028.yaml
  text: And all Israel heard of the judgment that the king had rendered[a], and they feared the king[b], because they saw that the wisdom of God was within him to administer justice.
  footnotes:
  - marker: a
    text: Or, 'they feared the king' or 'they revered the king.' The Hebrew can express fear, reverence, or awe in response to recognized authority.
    reason: lexical_alternative
  - marker: b
    text: Or, 'to do justice' or 'to render judgment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 온 이스라엘은 왕이 판결한 판결을 듣고, 왕 앞에서 두려워하였습니다. 그들은 하나님의 지혜가 그 안에 있어 판결을 내리게 하심을 보았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 '두려워하다/경외하다'의 폭넓은 의미를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '판결을 행하다'에 가깝지만, 문맥상 '판결을 내리다/정의를 집행하다'의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל יִשְׂרָאֵל
  english_pob_choice: all Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 이스라엘 온 백성
  - 모든 이스라엘 사람들
  lexicon: HALOT
  rationale: 집합명사 표현을 살려 민족 전체가 사건을 들은 뉘앙스를 간결하게 전달합니다.
- source_word: הַמִּשְׁפָּט אֲשֶׁר שָׁפַט הַמֶּלֶךְ
  english_pob_choice: the judgment that the king had rendered
  chosen_korean: 왕이 판결한 판결
  alternatives_korean:
  - 왕이 내린 판결
  - 왕이 판단한 판결
  lexicon: HALOT
  rationale: מִשְׁפָּט와 שָׁפַט의 법정적 대응을 살리되, 한국어에서 '판결'로 법적 결론을 분명히 했습니다.
- source_word: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  english_pob_choice: they feared the king
  chosen_korean: 왕 앞에서 두려워하였습니다
  alternatives_korean:
  - 왕을 두려워하였습니다
  - 왕을 경외하였습니다
  lexicon: HALOT
  rationale: מִפְּנֵי는 단순 목적어보다 '앞에서/면전에서'의 반응을 드러내므로, 두려움과 경외가 함께 담길 수 있는 표현으로 옮겼습니다.
- source_word: חָכְמַת אֱלֹהִים
  english_pob_choice: the wisdom of God
  chosen_korean: 하나님의 지혜
  alternatives_korean:
  - 하나님에게서 온 지혜
  - 신적인 지혜
  lexicon: HALOT
  rationale: 원문이 명시적으로 אֱלֹהִים을 말하므로, 형용사화하지 않고 소유격 구조로 직접 옮겼습니다.
- source_word: לַעֲשׂוֹת מִשְׁפָּט
  english_pob_choice: to administer justice
  chosen_korean: 판결을 내리게 하심
  alternatives_korean:
  - 정의를 행하게 하심
  - 판결을 집행하게 하심
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사 구문을 한국어 자연문으로 풀어, 지혜가 재판 행위로 드러난다는 점을 살렸습니다.
theological_decisions:
- issue: 여호와/야훼 전승과 달리 본문에 אֱלֹהִים이 직접 나타나는 표현
  chosen_reading: 하나님
  alternative_readings:
