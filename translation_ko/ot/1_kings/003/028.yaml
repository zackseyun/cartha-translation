  - 무서워하였습니다
  rationale: 이 반응은 단순 공포보다 권위 인식에서 오는 두려움과 경외를 함께 포함할 수 있으므로, 과도하게 축소하지 않는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3
