  - 신
  rationale: 본문은 야훼가 아니라 אֱלֹהִים을 명시하므로, 하나님의 지혜라는 직설적 신학 진술을 유지합니다.
  doctrine_reference: 원문 직접성 원칙
- issue: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ의 정서 범위
