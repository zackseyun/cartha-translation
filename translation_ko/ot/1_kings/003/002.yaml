base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/002.yaml
  text: Only the people were sacrificing at the high places[a], because no house had yet been built for the name of Yahweh in those days.
  footnotes:
  - marker: a
    text: Or 'temple'; Hebrew 'house.' The phrase 'for the name of the LORD' refers to the temple to be built in Jerusalem.
    reason: lexical_alternative
translation:
  language: ko
  text: 다만 백성은 산당에서[a] 제사를 드리고 있었습니다. 이는 그때까지 야훼의 이름을 위한 집이 아직 세워지지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '성전'. 히브리어는 '집'입니다. '야훼의 이름을 위한 집'은 예루살렘에 세워질 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 다만
  alternatives_korean:
  - 오직
  - 그러나
  lexicon: HALOT
  rationale: 앞선 솔로몬 평가에 대한 제한·예외를 한국어에서 자연스럽게 표시하기 위해 '다만'을 택했습니다.
- source_word: מְזַבְּחִים
  english_pob_choice: were sacrificing
  chosen_korean: 제사를 드리고 있었습니다
  alternatives_korean:
  - 제사하고 있었습니다
  - 희생 제물을 바치고 있었습니다
  lexicon: HALOT
  rationale: 지속·관습적 행위를 드러내면서도 한국어 성경체에서 자연스러운 서술로 옮기기 위해 진행형 표현을 사용했습니다.
- source_word: בַּבָּמוֹת
  english_pob_choice: at the high places
  chosen_korean: 산당에서
  alternatives_korean:
  - 높은 곳에서
  - 고지의 제사처에서
  lexicon: HALOT
  rationale: במות의 통상적인 제의 장소 의미를 반영해, 한국어 성경에서 널리 쓰이지만 본문 의미를 그대로 보존하는 '산당'을 선택했습니다.
- source_word: לְשֵׁם יְהוָה
  english_pob_choice: for the name of Yahweh
  chosen_korean: 야훼의 이름을 위한
  alternatives_korean:
  - 야훼의 이름을 위한
  - 야훼의 이름을 위하여
  lexicon: HALOT
  rationale: '''이름''을 단순 장식어로 풀지 않고, 성전의 목적을 가리키는 관용구를 살리기 위해 직역에 가깝게 옮겼습니다.'
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 히브리어 고유명 יְהוָה를 한국어 본문에서도 직접 음역해 언약적 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: בַיִת의 의미
  chosen_reading: 집
  alternative_readings:
  - 성전
  - 성전 건물
  rationale: 히브리어 어휘 자체는 '집'이며, '야훼의 이름을 위한'이라는 구문이 그 집이 성전임을 문맥상 밝혀 주므로 본문에서는 원어 의미를 우선했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition'
