lexical_decisions:
- source_word: וַיִּיטַב
  english_pob_choice: was good
  chosen_korean: 좋았습니다
  alternatives_korean:
  - 기뻐하셨습니다
  - 마음에 드셨습니다
  lexicon: HALOT
  rationale: 히브리어 יטב의 평가적 의미를 살려, 단순히 ‘좋다’로 옮기되 문맥상 과거 서술형으로 자연스럽게 표현했습니다.
- source_word: הַדָּבָר
  english_pob_choice: the matter
  chosen_korean: 그 일
  alternatives_korean:
  - 그 일들
  - 그 요청
  - 그 말씀
  lexicon: HALOT
  rationale: דבר의 넓은 의미를 유지하면서도 여기서는 솔로몬의 요청을 가리키므로, 한국어에서는 지나치게 추상적이지 않은 ‘그 일’이 적절합니다.
- source_word: בְּעֵינֵי
  english_pob_choice: in the eyes of
  chosen_korean: 주님의 눈에
  alternatives_korean:
  - 주님 보시기에
  - 주님의 보시기에
  lexicon: HALOT
  rationale: 평가의 관용구를 직역에 가깝게 살리면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: אֲדֹנָי
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: HALOT
  rationale: 본문이 יהוה가 아니라 אֲדֹנָי를 사용하므로, POB 영어의 ‘the Lord’에 맞춰 ‘주님’으로 옮겼습니다.
- source_word: אֶת הַדָּבָר הַזֶּה
  english_pob_choice: this thing
  chosen_korean: 이 일
  alternatives_korean:
  - 이것
  - 이 요청
  - 이 문제
  lexicon: HALOT
  rationale: 지시대상은 바로 앞의 솔로몬의 구함이므로, 한국어에서는 ‘이 일’이 자연스럽고 직접 객체 관계도 분명합니다.
theological_decisions:
- issue: 아도나이의 번역과 야훼 표기 구분
  chosen_reading: 여기서는 ‘주님’을 사용하고, 야훼 표기는 쓰지 않았습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 원문이 יהוה가 아니라 אֲדֹנָי이므로, 신명기적 전통 표기인 야훼로 바꾸지 않고 ‘주님’으로 옮겨 원문 구분을 유지했습니다.
