  - 내 주 임금님
  lexicon: HALOT
  rationale: 왕에게 드리는 정중한 호칭을 유지하되, 현대 합쇼체에서 자연스러운 직접 호칭으로 옮겼습니다.
- source_word: אַתָּה אָמַרְתָּ
  english_pob_choice: have you said
  chosen_korean: 말씀하셨습니까
  alternatives_korean:
  - 말하셨습니까
  - 말씀하신 것입니까
  lexicon: HALOT
  rationale: 질문문의 완결된 발화를 묻는 용법이므로, 한국어에서는 존대 동사 ‘말씀하시다’로 옮겨 직접성과 공손함을 함께 살렸습니다.
- source_word: יִמְלֹךְ / יֵשֵׁב עַל כִּסְאִי
  english_pob_choice: will reign / he will sit on my throne
  chosen_korean: 왕이 될 것이며, 그는 내 왕좌에 앉을 것이다
  alternatives_korean:
  - 다스릴 것이며, 그는 내 왕좌에 앉을 것이다
  - 통치할 것이며, 그는 내 왕좌에 앉을 것이다
  lexicon: HALOT
  rationale: 히브리어의 왕위 계승 표현을 한국어의 ‘왕이 되다’와 ‘왕좌에 앉다’로 재현해 정치적·상징적 의미를 모두 드러냈습니다.
theological_decisions:
- issue: 다윗에게 묻는 나단의 반문 형식
  chosen_reading: 직설문을 따옴표 안에 유지해, 나단이 다윗의 실제 발언 여부를 정중히 추궁하는 뉘앙스를 살렸습니다.
  alternative_readings:
  - 간접화법으로 완화하여 옮김
  - 서술문으로 바꾸어 재구성함
  rationale: 본문은 단순 정보 전달이 아니라 왕명 유무를 따지는 질문이므로, 질문 형식을 보존하는 것이 문맥의 긴장을 유지합니다.
  doctrine_reference: 본문 문맥상의 서술/화법 문제
