  text: Then Nathan said[a], “My lord the king, have you said, ‘Adonijah will reign after me, and he will sit on my throne’?”
  footnotes:
  - marker: a
    text: Or, “did you say.” The Hebrew perfect in this question can be represented in English either as present perfect or simple past.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 나단이 말했습니다. 「내 주 왕이시여, ‘아도니야가 내 뒤를 이어 왕이 될 것이며, 그는 내 왕좌에 앉을 것이다’라고 말씀하셨습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말씀하신 적이 있으십니까?’ 히브리어 완료형은 이 질문에서 이미 그러한 말씀을 하셨는지를 묻는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 이어 주는 와우 연속의 기능을 한국어에서 ‘그러자’로 살렸습니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: My lord the king
  chosen_korean: 내 주 왕이시여
  alternatives_korean:
