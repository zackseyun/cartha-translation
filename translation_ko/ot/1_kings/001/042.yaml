  rationale: 갑작스러운 등장에 주의를 끄는 담화 표지이므로, 현대 한국어에서는 생동감을 유지하면서도 읽기 자연스러운 ‘보십시오’로 옮겼습니다.
- source_word: בֶּן אֶבְיָתָר הַכֹּהֵן
  english_pob_choice: son of Abiathar the priest
  chosen_korean: 제사장 아비아달의 아들
  alternatives_korean:
  - 아비아달 제사장의 아들
  - 제사장인 아비아달의 아들
  lexicon: WLC; HALOT
  rationale: ‘제사장’은 아비아달을 수식하는 것으로 읽는 것이 문법상 자연스럽고, 한국어에서도 소속 관계를 분명히 드러내는 형태가 가장 정확합니다.
- source_word: אִישׁ חַיִל
  english_pob_choice: a worthy man
  chosen_korean: 훌륭한 사람
  alternatives_korean:
  - 용감한 사람
  - 유능한 사람
  - 믿음직한 사람
  lexicon: HALOT; English POB lexical note
  rationale: 이 표현은 문맥에 따라 용맹, 역량, 사회적 위상을 뜻할 수 있지만, 여기서는 아도니야가 정중하게 맞이하는 맥락이므로 군사적 ‘용감함’보다 인물의 품위와 신뢰성을 드러내는 표현을 택했습니다.
- source_word: וְטוֹב תְּבַשֵּׂר
  english_pob_choice: and bring good news
  chosen_korean: 좋은 소식을 가져오는군요
  alternatives_korean:
  - 좋은 소식을 전하는군요
  - 좋은 소식을 가져오겠군요
  lexicon: HALOT; English POB lexical note
  rationale: ‘좋은 소식’은 בָּשַׂר의 기본 의미를 살리고, 문맥상 기대와 환영을 드러내는 현재적 판단을 한국어 자연문으로 옮겼습니다.
