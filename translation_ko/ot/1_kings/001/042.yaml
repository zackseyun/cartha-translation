  text: While he was still speaking[a], behold, Jonathan son of Abiathar the priest came. And Adonijah said, “Come in, for you are a worthy man and bring good news.”
  footnotes:
  - marker: a
    text: 'Or ''a valiant man'' / ''a capable man'' for ''a worthy man'' (Hebrew: אִישׁ חַיִל). The phrase can denote valor, competence, or social standing depending on context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 아직 말하고 있을 때에, 보십시오, 제사장 아비아달의 아들 요나단이 왔습니다. 이에 아도니야가 말했습니다. “들어오십시오. 당신은 훌륭한 사람이니 좋은 소식을 가져오는군요.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘훌륭한 사람’은 히브리어 אִישׁ חַיִל의 가능한 의미들 가운데 문맥에 맞춘 번역입니다. 이 표현은 용맹, 유능함, 또는 사회적 위상을 가리킬 수 있습니다.
    reason: lexical_alternative
