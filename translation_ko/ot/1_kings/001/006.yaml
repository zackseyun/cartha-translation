language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא עֲצָב֨/וֹ אָבִ֤י/ו מִ/יָּמָי/ו֙ לֵ/אמֹ֔ר מַדּ֖וּעַ כָּ֣כָה עָשִׂ֑יתָ וְ/גַם ה֤וּא טֽוֹב תֹּ֨אַר֙ מְאֹ֔ד וְ/אֹת֥/וֹ יָלְדָ֖ה אַחֲרֵ֥י אַבְשָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/006.yaml
  text: His father had never displeased him at any time by saying[a], “Why have you done thus?” He was also very handsome[b], and his mother had borne him after Absalom.
  footnotes:
  - marker: a
    text: Or “had never grieved him” or “had never rebuked him.” The Hebrew verb can denote causing pain or vexation; in context it refers to David’s failure to check or confront Adonijah.
    reason: lexical_alternative
  - marker: b
    text: Literally “from his days,” an idiom meaning “at any time in his life.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아버지는 그의 평생[b] 한 번도 “네가 어찌하여 이렇게 하였느냐?”라고 말하여 그를 언짢게 한 적이 없었습니다[a]. 그는 또한 매우 잘생겼으며, 그의 어머니는 그를 압살롬 다음에 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘슬프게 하다’, ‘괴롭게 하다’, 또는 ‘꾸짖다’로도 옮길 수 있습니다. 여기서는 이어지는 문책의 말과 함께, 다윗이 아도니야를 제지하거나 책망하여 불쾌하게 한 적이 없었다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 날들로부터’이며, 여기서는 ‘그의 평생에 한 번도’라는 뜻의 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָבוֹ
  english_pob_choice: had never displeased him
  chosen_korean: 그를 언짢게 하지 않았습니다
  alternatives_korean:
  - 그를 슬프게 하지 않았습니다
  - 그를 꾸짖지 않았습니다
  - 그를 괴롭게 하지 않았습니다
  lexicon: HALOT
  rationale: 문맥상 다윗이 아도니야를 교정하거나 제지하지 않은 부모적 방임을 가리키므로, 감정적으로 과장되지 않으면서도 ‘displeased’의 의미를 살리는 ‘언짢게 하다’를 택했습니다.
- source_word: מִיָּמָיו
  english_pob_choice: at any time
  chosen_korean: 평생 한 번도
  alternatives_korean:
  - 언제나
  - 그의 날들 동안
  - 일생 동안
  lexicon: HALOT
  rationale: 직역하면 ‘그의 날들로부터’이지만, 한국어 관용으로는 부정과 함께 ‘평생 한 번도’가 의미를 가장 분명하게 전달합니다.
- source_word: טוֹב תֹּאַר מְאֹד
  english_pob_choice: very handsome
  chosen_korean: 매우 준수한 외모
  alternatives_korean:
  - 매우 잘생긴
  - 아주 훌륭한 용모
  - 아주 아름다운 용모
  lexicon: HALOT
  rationale: 남성 인물의 외모를 나타내는 표현으로서, ‘handsome’의 자연스러운 한국어 대응은 ‘준수한 외모’이며, ‘매우’로 강도를 살렸습니다.
- source_word: אַחֲרֵי אַבְשָׁלוֹם
  english_pob_choice: after Absalom
  chosen_korean: 압살롬 다음에
  alternatives_korean:
  - 압살롬 뒤에
  - 압살롬 이후에
  - 압살롬 다음으로
  lexicon: HALOT
  rationale: 여기서는 출생 순서를 뜻하므로, 단순한 시간적 ‘이후’보다 ‘다음에’가 더 직접적으로 아도니야의 출생 순서를 드러냅니다.
theological_decisions:
- issue: 다윗의 부정 행위의 성격
  chosen_reading: 본문은 단순한 감정 상함이 아니라, 아도니야를 제어하거나 책망하지 않은 부친의 무대응을 암시합니다.
  alternative_readings:
  - 아도니야가 단지 서운함을 느끼지 않았다는 의미
  - 다윗이 육체적 고통만 주지 않았다는 의미
  rationale: 뒤이어 이어지는 아도니야의 자기 고양 서사와 함께 읽을 때, עצב는 관계적 불쾌감보다 ‘제지하지 않음/책망하지 않음’의 함의를 갖습니다. 따라서 주된 의미를 흐리지 않는 범위에서 이를 반영했습니다.
  doctrine_reference: 잠언 13:24; 23:13-14
- issue: 외모 묘사의 한국어 톤
  chosen_reading: ‘준수한 외모’는 미화하지 않으면서도 성인 남성의 품위 있는 용모를 자연스럽게 나타냅니다.
  alternative_readings:
  - 잘생긴
  - 아름다운
  - 훤칠한
  rationale: 히브리어는 실제 신체적 아름다움을 말하므로, 지나치게 현대적이거나 가벼운 뉘앙스보다 서술체에 어울리는 표현을 선택했습니다.
  doctrine_reference: 사무엘상 16:7의 외모/중심 대비
