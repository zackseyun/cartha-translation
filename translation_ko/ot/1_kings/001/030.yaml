base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/030.yaml
  text: As I swore to you by Yahweh[a], the God of Israel, saying, ‘Surely Solomon your son will reign after me[b], and he will sit on my throne in my place,’ so I will do this today.
  footnotes:
  - marker: a
    text: 'Hebrew: ''by Yahweh''; rendered ''the LORD'' in keeping with the project’s standard for the divine name.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and he will sit on my throne instead of me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너에게 여호와, 이스라엘의 하나님을 두고 맹세하여 말하기를, ‘솔로몬 네 아들이 반드시 내 뒤를 이어 왕이 되고, 그는 내 왕좌에 내 자리에 앉을 것이다’라고 했으니, 내가 오늘 이 일을 행하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘여호와’를 사용합니다. 본문에서는 한국어 관행을 따라 ‘여호와’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘내 왕좌에 내 대신 앉을 것이다’라는 뜻도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  english_pob_choice: by Yahweh
  chosen_korean: 여호와를 두고
  alternatives_korean:
  - 야훼를 두고
  - 주님을 두고
  lexicon: 표준 번역 관행 / 사전적 맹세 용법
  rationale: 맹세의 대상이 되는 신적 이름을 한국어 독자에게는 통상적인 서술 맥락으로 풀지 않고, 맹세 관용구인 ‘~를 두고 맹세하다’로 옮겨 원문의 서약 행위를 분명히 했습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 하나님이신 분
  - 이스라엘 하나님
  lexicon: HALOT
  rationale: 히브리어 소유격 구문을 자연스러운 현대 한국어로 옮겨, 여호와를 이스라엘과 언약적으로 관련된 하나님으로 규정하는 의미를 보존했습니다.
- source_word: יִמְלֹךְ אַחֲרַי
  english_pob_choice: will reign after me
  chosen_korean: 내 뒤를 이어 왕이 되고
  alternatives_korean:
  - 내 뒤를 이어 다스리고
  - 나를 이어 통치하고
  lexicon: HALOT
  rationale: יָמְלֹךְ는 단순한 ‘왕이 되다’보다 통치/즉위의 의미가 있어, 왕위 승계의 뜻이 드러나도록 풀어 옮겼습니다.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי תַּחְתָּי
  english_pob_choice: and he will sit on my throne in my place
  chosen_korean: 그는 내 왕좌에 내 자리에 앉을 것이다
  alternatives_korean:
  - 그는 내 왕좌에 나 대신 앉을 것이다
  - 그는 내 왕좌에 내 자리를 대신할 것이다
  lexicon: HALOT
  rationale: ‘내 자리에’는 תַּחְתָּי의 대체/승계 의미를 살리면서, 한국어에서 자연스러운 왕위 계승 표현으로 구성했습니다.
- source_word: הַיּוֹם הַזֶּה
  english_pob_choice: today
  chosen_korean: 오늘
  alternatives_korean:
  - 이날
  lexicon: HALOT
  rationale: 지시 표현을 현대 한국어의 간결한 시간 부사로 옮겨, 서약 실행의 즉시성을 살렸습니다.
theological_decisions:
- issue: 히브리어 신명 יהוה의 한국어 처리
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 본문은 서약의 대상인 신적 이름을 포함하므로, 한국어 POB 표준 용례에 따라 본문에서는 ‘여호와’로 옮기고, 학술적 음역은 본문 밖의 대안으로만 남겼습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼 (Korean draft policy note)'
- issue: 왕위 계승 맹세문의 직접 인용 어조
  chosen_reading: 직접 인용부를 유지하고, ‘반드시’로 약속의 확실성을 보강함
  alternative_readings:
  - 단순 서술형으로 완화
  - ‘틀림없이’로 재구성
  rationale: 원문의 כִּי와 oath formula가 지닌 확언성을 약화하지 않도록, 직접화법과 ‘반드시’를 사용해 맹세의 강도를 드러냈습니다.
  doctrine_reference: 서사 본문 어조 보존 원칙
