base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/040.yaml
  text: And all the people went up after him[a], and the people were playing flutes and rejoicing with great joy[b], and the earth split apart at their sound.
  footnotes:
  - marker: a
    text: Or 'playing pipes'; the Hebrew term can refer broadly to flute-like wind instruments.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the earth split apart' is likely hyperbolic, describing the overwhelming volume of the celebration.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 모든 백성이 그의 뒤를 따라 올라갔고, 백성은 피리를 불며[a] 큰 기쁨으로 기뻐하였으며, 그들의 소리에 땅이 갈라졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘피리를 불며’는 히브리어 חלילים이 넓게는 피리류의 관악기를 가리킬 수 있음을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅이 갈라졌습니다’는 문자적 지각 변동을 단정하기보다, 문맥상 소리의 압도적 크기를 강조하는 과장법으로 이해될 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלוּ
