source:
  edition: WLC
  text: וַ/יַּעֲל֤וּ כָל הָ/עָם֙ אַֽחֲרָ֔י/ו וְ/הָ/עָם֙ מְחַלְּלִ֣ים בַּ/חֲלִלִ֔ים וּ/שְׂמֵחִ֖ים שִׂמְחָ֣ה גְדוֹלָ֑ה וַ/תִּבָּקַ֥ע הָ/אָ֖רֶץ בְּ/קוֹלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/040.yaml
  text: And all the people went up after him[a], and the people were playing flutes and rejoicing with great joy[b], and the earth split apart at their sound.
  footnotes:
  - marker: a
    text: Or 'playing pipes'; the Hebrew term can refer broadly to flute-like wind instruments.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the earth split apart' is likely hyperbolic, describing the overwhelming volume of the celebration.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 모든 백성이 그의 뒤를 따라 올라갔고, 백성은 피리를 불며 큰 기쁨으로 기뻐하였으며, 그들의 소리에 땅이 갈라졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘피리를 불며’는 히브리어 חלילים이 넓게는 피리류의 관악기를 가리킬 수 있음을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅이 갈라졌습니다’는 문자적 지각 변동을 단정하기보다, 소리의 압도적 크기를 강조하는 과장법으로 이해한 번역입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלוּ
  english_pob_choice: went up
  chosen_korean: 올라갔고
  alternatives_korean:
  - 올라왔고
  - 따라 올라갔고
  lexicon: HALOT
  rationale: עלה의 기본 의미인 ‘올라가다’를 살리되, 행렬을 이끄는 동작을 자연스럽게 드러내기 위해 서술형으로 옮겼습니다.
- source_word: כָל הָעָם
  english_pob_choice: all the people
  chosen_korean: 모든 백성이
  alternatives_korean:
  - 모든 사람들이
  - 온 백성이
  lexicon: HALOT
  rationale: 공적 환호 장면의 집합적 표현으로 ‘백성’이 가장 सीधे적이며, כָל의 포괄성을 살렸습니다.
- source_word: מְחַלְּלִים בַּחֲלִלִים
  english_pob_choice: playing flutes
  chosen_korean: 피리를 불며
  alternatives_korean:
  - 플루트를 불며
  - 피리 연주를 하며
  lexicon: HALOT
  rationale: חליל/חלילים을 한국어 성경에서 자연스러운 관악기인 ‘피리’로 옮기고, 동사형으로 연주 행위를 간결하게 표현했습니다.
- source_word: וּשְׂמֵחִים שִׂמְחָה גְדוֹלָה
  english_pob_choice: rejoicing with great joy
  chosen_korean: 큰 기쁨으로 기뻐하였으며
  alternatives_korean:
  - 매우 크게 기뻐하였으며
  - 큰 즐거움으로 기뻐하였으며
  lexicon: HALOT
  rationale: 히브리어의 반복 강조를 한국어에서 ‘큰 기쁨으로 기뻐하다’로 되살려, 단순한 ‘즐거워하다’보다 강도를 유지했습니다.
- source_word: וַתִּבָּקַע הָאָרֶץ בְּקוֹלָם
  english_pob_choice: the earth split apart at/by their sound
  chosen_korean: 그들의 소리에 땅이 갈라졌습니다
  alternatives_korean:
  - 그들의 소리에 세상이 갈라졌습니다
  - 그들의 소리로 땅이 갈라졌습니다
  lexicon: HALOT
  rationale: בקע의 비유적·과장적 이미지와 קוֹל의 ‘소리’를 살리되, 한국어에서는 ‘땅이 갈라지다’가 가장 직관적이어서 선택했습니다.
theological_decisions:
- issue: וַתִּבָּקַע הָאָרֶץ의 과장적 이미지 처리
  chosen_reading: 실제 지질학적 사건이라기보다, 환호와 연주의 압도적 소리를 생생하게 묘사한 과장법으로 옮겼습니다.
  alternative_readings:
  - 직역하여 ‘땅이 갈라졌다’로만 읽는 방식
  - ‘세상이 흔들렸다’처럼 의미를 완화하는 방식
  rationale: 영어 POB의 주석처럼 문맥상 청각적 과장을 드러내는 표현이므로, 수사적 힘을 유지하면서도 자연스러운 한국어로 전달했습니다.
  doctrine_reference: 서사시적 과장법과 문맥적 수사 이해
- issue: 백성의 집단적 움직임과 환호의 병렬 구조
  chosen_reading: ‘그리고 ... 했고, ... 하였으며’로 원문의 병렬을 최대한 유지했습니다.
  alternative_readings:
  - 한 문장으로 압축해 의미를 정리하는 방식
  - 결과 구문으로 재구성하는 방식
  rationale: 히브리어의 waw 연쇄와 평행 구조를 보존해야 장면의 리듬과 집단적 흥분이 살아나므로, 한국어에서도 병렬을 유지했습니다.
  doctrine_reference: 원문 구조 보존 원칙
