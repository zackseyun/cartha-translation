base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/015.yaml
  text: So Bathsheba went in to the king in the chamber[a]. Now the king was very old[b], and Abishag the Shunammite was attending the king.
  footnotes:
  - marker: a
    text: Or 'entered the room where the king was.'
    reason: lexical_alternative
  - marker: b
    text: Or 'was serving the king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 밧세바가 방 안에 있는 왕에게 들어갔습니다[a]. 왕은 매우 늙어 있었고[b], 수넴 사람 아비삭은 왕을 시중들고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕이 있는 방으로 들어갔습니다.’
    reason: alternative_reading
  - marker: b
    text: 또는 ‘왕을 시중들고 있었습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: בַת שֶׁבֶע / בַת־שֶׁבַע
  english_pob_choice: Bathsheba
  chosen_korean: 밧세바
  alternatives_korean:
  - 바르세바
  - 밧세바
  lexicon: 표준 한국어 성경 인명 표기
  rationale: 한국어 성경에서 널리 정착된 인명 형태를 따랐습니다.
- source_word: הַחַדְרָה
  english_pob_choice: in the chamber
  chosen_korean: 방 안에
  alternatives_korean:
  - 침실에
  - 내실에
  - 방에
  lexicon: HALOT
  rationale: חֶדֶר는 방/내실/침실의 범위를 가질 수 있으나, 왕이 머무는 사적 공간이라는 점을 살리면서도 과도하게 특정하지 않기 위해 ‘방 안에’로 옮겼습니다.
- source_word: זָקֵן מְאֹד
  english_pob_choice: was very old
  chosen_korean: 매우 늙어 있었고
  alternatives_korean:
  - 몹시 늙어 있었고
  - 아주 늙어 있었고
  - 대단히 나이가 많았고
  lexicon: HALOT
  rationale: 상태를 나타내는 서술을 자연스러운 한국어로 옮기되, 단순히 ‘나이가 많다’보다 육체적 노쇠를 더 분명하게 드러내는 ‘늙어 있었다’를 선택했습니다.
- source_word: מְשָׁרַת
  english_pob_choice: was attending
  chosen_korean: 시중들고 있었습니다
  alternatives_korean:
  - 섬기고 있었습니다
  - 시중하고 있었습니다
  - 돌보고 있었습니다
  lexicon: HALOT
  rationale: 아비삭의 왕에 대한 지속적 돌봄과 봉사를 한국어로 가장 자연스럽게 나타내는 표현으로 ‘시중들다’를 택했습니다.
