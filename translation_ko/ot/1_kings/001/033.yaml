  yaml_path: translation/ot/1_kings/001/033.yaml
  text: And the king said to them[a], “Take with you the servants of your lord, and have my son Solomon ride on the mule that is mine, and bring him down to Gihon.”
  footnotes:
  - marker: a
    text: 'Or “mount Solomon, my son, on my own mule.” The Hebrew verb is causative: the attendants are to cause Solomon to ride.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 그들에게 말했습니다. 「너희는 너희 주의 종들을 데리고 가서, 내 아들 솔로몬을 내 노새에 태운 뒤 그를 기혼으로 데리고 내려가십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “내 아들 솔로몬을 내 노새에 태우십시오” 또는 “내 아들 솔로몬을 내 노새에 태우게 하십시오”입니다. 히브리어 동사는 사역형이어서 수행자들이 솔로몬이 타게 해야 한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אֲדֹנֵיכֶם
  english_pob_choice: the servants of your lord
  chosen_korean: 너희 주의 종들
  alternatives_korean:
  - 너희 주인의 종들
  - 너희 주의 신하들
  lexicon: HALOT
  rationale: 궁정 맥락에서 עַבְדֵי는 단순한 ‘노예’보다 왕을 섬기는 ‘종들/신하들’이 자연스럽고, אֲדֹנֵיכֶם의 위계적 호칭은 ‘너희 주’로 옮기는 것이 원문과 맞습니다.
- source_word: וְהִרְכַּבְתֶּם
  english_pob_choice: have my son Solomon ride
  chosen_korean: 솔로몬을 ... 태운 뒤
  alternatives_korean:
  - 솔로몬을 타게 하십시오
  - 솔로몬을 태우십시오
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 ‘태우다’로 옮기되, 한국어 문장에서는 목적어를 먼저 두어 자연스럽게 표현했습니다.
- source_word: הַפִּרְדָּה אֲשֶׁר לִי
  english_pob_choice: the mule that is mine
  chosen_korean: 내 노새에
  alternatives_korean:
  - 내 노새에
  - 내 것인 노새에
  - 내 소유의 노새에
  lexicon: HALOT
  rationale: 문맥상 왕의 소유를 드러내는 יחס절은 한국어에서 ‘내 노새’로 간명하게 보존할 수 있으며, POB의 ‘that is mine’이 강조하는 소유권을 살립니다.
- source_word: וְהוֹרַדְתֶּם אֹת֖וֹ אֶל גִּחוֹן
  english_pob_choice: and bring him down to Gihon
  chosen_korean: 그를 기혼으로 데리고 내려가십시오
  alternatives_korean:
  - 그를 기혼으로 내려가십시오
  - 그를 기혼까지 데리고 가십시오
  lexicon: HALOT
  rationale: הוריד의 사역적 방향성을 ‘데리고 내려가다’로 옮겨 지리적 하강을 유지했고, גִּחוֹן은 고유명사이므로 ‘기혼’으로 음역했습니다.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  english_pob_choice: And the king said
  chosen_korean: 그러자 왕이 말했습니다
  alternatives_korean:
  - 그리고 왕이 말했습니다
  - 왕이 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서사 진행을 한국어에서 자연스럽게 드러내는 연결어로 ‘그러자’를 택했습니다.
theological_decisions:
- issue: 왕의 자기 지시와 소유 강조
  chosen_reading: ‘내 아들 솔로몬’과 ‘내 노새’는 왕권 승계의 정당성과 공개적 승인 행위를 드러내므로, 한국어에서도 두 번의 ‘내’를 유지했습니다.
  alternative_readings:
  - ‘솔로몬, 내 아들’처럼 어순을 바꾸는 방식
  - 소유를 약화한 ‘왕의 노새’
  rationale: 본문의 초점은 단순 이동이 아니라 왕이 자신의 권위를 통해 솔로몬을 공식적으로 지명하는 데 있으므로, 소유 표현을 약화하지 않는 것이 중요합니다.
  doctrine_reference: 왕권/메시아적 계승의 서사적 정당화
- issue: 직접화법의 공손한 명령형
  chosen_reading: 왕의 명령을 현대 공손체 명령으로 옮겨, 직접화법 내부는 ‘하십시오’ 체를 사용했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 더 고전적인 청유형 사용
  rationale: 화자-청자 관계가 위계적인 궁정 장면이므로, 현대 한국어에서는 정중한 명령형이 가장 자연스럽고 원문의 권위도 살립니다.
  doctrine_reference: 서사체의 화행 보존
