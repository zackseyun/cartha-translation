  lexicon: HALOT
  rationale: 이 단어는 단순한 도덕적 ‘죄인’보다 정치·법적 맥락에서 ‘죄 있는 자로 취급됨’의 의미가 강하므로, POB의 ‘counted as offenders’에 맞춰 ‘여겨질 것입니다’로 옮겼습니다.
