  rationale: ‘잠들다/누우다’가 죽음을 가리키는 관용을 보존하면서, 바로 뒤의 ‘조상들과 함께’와 함께 죽음을 뜻함을 드러냅니다.
- source_word: עִם אֲבֹתָיו
