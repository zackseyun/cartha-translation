  lexicon: HALOT
  rationale: 히브리어 관용을 한국어에서 가장 자연스럽게 풀어, 죽은 조상들과 합류한다는 뜻을 살렸습니다.
- source_word: חַטָּאִים
  english_pob_choice: counted as offenders
  chosen_korean: 죄인들로 여겨질 것입니다
  alternatives_korean:
  - 범죄자로 여겨질 것입니다
