  yaml_path: translation/ot/1_kings/001/021.yaml
  text: And when my lord the king lies down with his fathers[a], I and my son Solomon will be counted as offenders.
  footnotes:
  - marker: a
    text: Or "sinners." The Hebrew term can denote those regarded as guilty or culpable; here the context suggests a legal-political status rather than a general moral description.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 주 왕께서 그의 조상들과 함께 누우시면, 저와 제 아들 솔로몬은 죄인으로 여겨질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유죄인 자들’. 히브리어는 일반적인 도덕적 의미의 ‘죄인’뿐 아니라 유죄나 책임이 있는 자로 여겨지는 사람을 가리킬 수 있습니다. 여기서는 왕위 계승의 상황상 법적·정치적으로 불리한 처지에 놓이는 뜻이 두드러집니다.
    reason: lexical_alternative
