base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/021.yaml
  text: And when my lord the king lies down with his fathers[a], I and my son Solomon will be counted as offenders.
  footnotes:
  - marker: a
    text: Or "sinners." The Hebrew term can denote those regarded as guilty or culpable; here the context suggests a legal-political status rather than a general moral description.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내 주 왕께서 그의 조상들과 함께 누우시면, 저와 제 아들 솔로몬은 죄인들로 여겨질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘범죄자들’. 히브리어는 일반적인 도덕적 ‘죄인’뿐 아니라 유죄로 간주되는 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And ... will
  chosen_korean: 그리고 ... 될 것입니다
  alternatives_korean:
  - 그리되
  - 그러면 ... 되겠습니다
  lexicon: HALOT
  rationale: 결과를 여는 העתיד/서술 전개를 한국어의 자연스러운 미래 표현으로 옮겼습니다.
- source_word: כִּשְׁכַב אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: when my lord the king lies down
  chosen_korean: 내 주 왕께서 ... 누우시면
  alternatives_korean:
  - 내 주 왕께서 ... 잠드시면
  - 내 주 왕께서 ... 세상을 떠나시면
  lexicon: HALOT
  rationale: ‘잠들다/누우다’가 죽음을 가리키는 관용을 보존하면서, 바로 뒤의 ‘조상들과 함께’와 함께 죽음을 뜻함을 드러냅니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 히브리어 관용을 한국어에서 가장 자연스럽게 풀어, 죽은 조상들과 합류한다는 뜻을 살렸습니다.
- source_word: חַטָּאִים
  english_pob_choice: counted as offenders
  chosen_korean: 죄인들로 여겨질 것입니다
  alternatives_korean:
  - 범죄자로 여겨질 것입니다
  - 유죄자로 여겨질 것입니다
  - 죄인으로 간주될 것입니다
  lexicon: HALOT
  rationale: 이 단어는 단순한 도덕적 ‘죄인’보다 정치·법적 맥락에서 ‘죄 있는 자로 취급됨’의 의미가 강하므로, POB의 ‘counted as offenders’에 맞춰 ‘여겨질 것입니다’로 옮겼습니다.
theological_decisions:
- issue: חַטָּאִים의 의미 범위
  chosen_reading: 도덕적 낙인보다, 왕위 계승 상황에서 책임을 뒤집어쓸 ‘유죄 취급’의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘죄인들’로 직역해 일반적 도덕 의미를 강하게 드러내기
  - ‘범인들’로 옮겨 형사적 뉘앙스를 더하기
  rationale: 문맥상 바르실바의 발언은 단순한 종교적 자기고백이 아니라 왕위 쟁탈 속에서 처벌 대상이 될 수 있다는 정치적 우려를 표현합니다.
  doctrine_reference: 본문 문맥에 따른 어휘 선택; 계승 서사 해석
