  chosen_reading: 도덕적 낙인보다, 왕위 계승 상황에서 책임을 뒤집어쓸 ‘유죄 취급’의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘죄인들’로 직역해 일반적 도덕 의미를 강하게 드러내기
  - ‘범인들’로 옮겨 형사적 뉘앙스를 더하기
  rationale: 문맥상 바르실바의 발언은 단순한 종교적 자기고백이 아니라 왕위 쟁탈 속에서 처벌 대상이 될 수 있다는 정치적 우려를 표현합니다.
  doctrine_reference: 본문 문맥에 따른 어휘 선택; 계승 서사 해석
