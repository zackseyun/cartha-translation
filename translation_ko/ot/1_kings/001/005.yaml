review_pass:
  verdict: revise
  source_fidelity: 선행 접속사 וַ는 한국어에서 별도의 ‘이제’로 반드시 옮길 필요가 없으며, ‘이제’는 원문에 없는 시간 표지를 더합니다. מִתְנַשֵּׂא는 ‘스스로 높아지며’보다 사역적·재귀적 의미가 분명한 ‘스스로를 높여’가 적절합니다. רָצִים는 미래의 ‘달려갈’이 아니라 수행 기능을 나타내므로 ‘달리는’으로 옮겼습니다.
  naturalness: ‘하깃의 아들 아도니야가’와 ‘그 앞에서 달리는 오십 명’은 현대 표준 한국어의 정중한 문체에서 자연스럽습니다. 병거·기병·호위 인원을 ‘갖추었습니다’라고 하는 것은 이 문맥에서 왕권 과시를 위한 준비를 자연스럽게 나타냅니다.
  terminology: 인명 ‘아도니야’, ‘하깃’, 왕권 표현 ‘왕이 되겠다’, 군사·왕실 행렬 어휘 ‘병거’, ‘기병’을 유지했습니다. 각주 b는 인용문의 대안 번역이므로 기병이 아니라 해당 인용문에 붙여야 합니다.
  issues:
  - severity: medium
    issue: ‘이제’가 원문에 명시되지 않은 시간 표지를 추가합니다.
    rationale: 히브리어 첫 וַ는 서사 진행을 나타내지만, 이 절에서 ‘이제’라는 시간 부사를 요구하지 않습니다.
  - severity: medium
    issue: 각주 b의 앵커가 ‘기병’에 붙어 있으나 각주 내용은 왕권 선언의 대안 번역입니다.
    rationale: 각주 내용과 앵커 대상이 일치해야 하므로 인용문 뒤로 옮겨야 합니다.
  - severity: low
    issue: ‘스스로 높아지며’는 재귀·사역 의미를 다소 흐리며, ‘달려갈’은 분사의 기능적 현재성을 미래로 바꿉니다.
    rationale: ‘스스로를 높여’와 ‘달리는’이 원문의 의미와 한국어 문장 연결을 더 정확히 보존합니다.
  revised_text: 하깃의 아들 아도니야가 스스로를 높여 이렇게 말했습니다. “내가 왕이 되겠다.”[b] 그래서 그는 자기를 위해 병거와 기병과 그 앞에서 달리는 오십 명을 갖추었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 “스스로를 세웠다”, “자기를 높였다”, “자기를 크게 하였다”. 히브리어 동사는 자기 고양의 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “내가 왕으로 통치하겠다.”
    reason: alternative_reading
  revision_rationale: 명시되지 않은 ‘이제’를 삭제하고, 자기 고양의 재귀성을 더 분명히 하며, 수행원들의 기능을 나타내는 분사를 자연스럽게 조정했습니다. 또한 인용문 대안인 각주 b를 올바른 인용문 앵커로 옮겼습니다.
