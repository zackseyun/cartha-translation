source:
  edition: WLC
  text: וַ/אֲדֹנִיָּ֧ה בֶן חַגִּ֛ית מִתְנַשֵּׂ֥א לֵ/אמֹ֖ר אֲנִ֣י אֶמְלֹ֑ךְ וַ/יַּ֣עַשׂ ל֗/וֹ רֶ֚כֶב וּ/פָ֣רָשִׁ֔ים וַ/חֲמִשִּׁ֥ים אִ֖ישׁ רָצִ֥ים לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/005.yaml
  text: Now Adonijah the son of Haggith exalted himself[a], saying, “I will reign.” So he made for himself a chariot, horsemen[b], and fifty men running before him.
  footnotes:
  - marker: a
    text: Or “set himself up,” or “made himself great.” The Hebrew verb carries the sense of self-exaltation.
    reason: lexical_alternative
  - marker: b
    text: Or “I will be king.”
    reason: alternative_reading
translation:
  language: ko
  text: 이제 아도니야는 하깃의 아들로서 스스로 높아지며[a] 이렇게 말했습니다. “내가 왕이 되겠다.” 그래서 그는 자기를 위해 병거와 기병[b]과 자기 앞에서 달려갈 오십 명을 마련했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “스스로를 세웠다”, “자기를 높였다”, “자기를 크게 하였다”. 히브리어 동사는 자기고양의 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “내가 왕이 되겠다.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִתְנַשֵּׂא
  english_pob_choice: exalted himself
  chosen_korean: 스스로 높아지며
  alternatives_korean:
  - 스스로 높이며
  - 자기를 높이며
  - 자기 스스로를 높이며
  lexicon: HALOT
  rationale: 히트파엘의 자기-고양/자기-우쭐함을 한국어로 자연스럽게 살리면서, 원문의 비판적 뉘앙스를 과하게 해설하지 않도록 했습니다.
- source_word: לֵאמֹר אֲנִי אֶמְלֹךְ
  english_pob_choice: saying, “I will reign.”
  chosen_korean: 이렇게 말했습니다. “내가 왕이 되겠다.”
  alternatives_korean:
  - 이렇게 말했습니다. “내가 통치하겠다.”
  - 이렇게 말했습니다. “내가 다스리겠다.”
  - 이렇게 말했습니다. “내가 군림하겠다.”
  lexicon: HALOT
  rationale: 말하기 절을 살리되, מלך의 왕권 맥락을 한국어에서 가장 직접적으로 드러내는 ‘왕이 되다’를 택했습니다.
- source_word: רֶכֶב וּפָרָשִׁים
  english_pob_choice: a chariot, horsemen
  chosen_korean: 병거와 기병
  alternatives_korean:
  - 전차와 기병
  - 수레와 기병
  - 병거와 말 탄 자들
  lexicon: HALOT
  rationale: רֶכֶב은 전쟁/왕실 맥락의 병거로, פָרָשִׁים은 기병으로 옮겨 한국어 성경 어휘와 원문의 군왕적 과시를 함께 반영했습니다.
- source_word: חֲמִשִּׁים אִישׁ רָצִים לְפָנָיו
  english_pob_choice: fifty men running before him
  chosen_korean: 자기 앞에서 달려갈 오십 명
  alternatives_korean:
  - 자기 앞에서 달리는 오십 명
  - 그 앞에서 달려갈 오십 명
  - 그 앞에서 달리는 오십 명
  lexicon: HALOT
  rationale: 진행적 동작을 나타내는 분사를 한국어 미래 관형형으로 풀어, 왕 앞에서 달리는 수행원들의 기능을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 아도니야의 자기고양 표현의 평가 강도
  chosen_reading: ‘스스로 높아지며’로 옮겨, 본문이 암시하는 자기과시와 권력 야심을 보이되 번역자가 별도의 도덕적 판결문을 덧붙이지는 않았습니다.
  alternative_readings:
  - 자기를 세우며
  - 스스로를 높여
  - 자기를 높이며
  rationale: 히브리어 히트파엘은 자기 승격의 의미를 내포하므로, 그 긴장을 보존하는 것이 본문의 서술 의도를 가장 잘 따릅니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
