  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יִּזְבַּח שׁ֥וֹר וּֽ/מְרִיא וְ/צֹאן֮ לָ/רֹב֒ וַ/יִּקְרָא֙ לְ/כָל בְּנֵ֣י הַ/מֶּ֔לֶךְ וּ/לְ/אֶבְיָתָר֙ הַ/כֹּהֵ֔ן וּ/לְ/יֹאָ֖ב שַׂ֣ר הַ/צָּבָ֑א וְ/לִ/שְׁלֹמֹ֥ה עַבְדְּ/ךָ֖ לֹ֥א קָרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/019.yaml
  text: And he sacrificed oxen[a], fattened cattle, and sheep in abundance, and he invited all the king’s sons, Abiathar the priest, and Joab the commander of the army[b]; but he did not invite Solomon your servant.
  footnotes:
  - marker: a
    text: Or 'he called' / 'he summoned' in both occurrences of the verb; the translation uses 'invited' because the context is attendance at a sacrificial feast.
    reason: lexical_alternative
  - marker: b
    text: '''Sheep'' translates a Hebrew term that can more broadly refer to flock animals, including goats.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 수소와 살진 가축과 양을 많이 잡아 제물로 바쳤고, 왕의 모든 아들과 제사장 아비아달과 군대장관 요압을 모두 초청했으나, 당신의 종 솔로몬은 초청하지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘초청하다’는 כאן의 קרא를 문맥상 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘양’은 כאן의 צֹאן이 더 넓게는 염소까지 포함할 수 있는 집합명사라는 점을 반영한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  english_pob_choice: he sacrificed
  chosen_korean: 잡아 제물로 바쳤고
  alternatives_korean:
  - 희생제물을 드렸고
  - 희생으로 잡았고
  lexicon: HALOT
  rationale: זבח는 단순 도살이 아니라 제의적 희생을 뜻하므로, 한국어에서도 제의성을 분명히 드러내는 표현이 필요합니다.
- source_word: שׁוֹר
  english_pob_choice: oxen
  chosen_korean: 수소
  alternatives_korean:
  - 황소
  - 소
  lexicon: HALOT
  rationale: 제물 목록에서 שׁוֹר의 가축성을 살리면서도 너무 일반적인 ‘소’보다 제의 맥락에 맞는 구체성을 유지했습니다.
- source_word: וּמְרִיא
  english_pob_choice: fattened cattle
  chosen_korean: 살진 가축
  alternatives_korean:
  - 살진 소
  - 살찐 가축
  lexicon: HALOT
  rationale: 살찌운 가축이라는 뜻을 자연스럽게 옮기되, 단수형의 뉘앙스보다 목록 속 범주성을 살려 ‘가축’으로 넓게 잡았습니다.
- source_word: וַיִּקְרָא
  english_pob_choice: he invited
  chosen_korean: 초청했으나
  alternatives_korean:
  - 불렀으나
  - 소집했으나
  lexicon: HALOT
  rationale: 문맥이 제사 잔치에 사람들을 불러 모으는 상황이므로, 직역의 ‘불렀다’보다 기능을 드러내는 ‘초청하다’를 택했습니다.
- source_word: לְשְׁלֹמֹה עַבְדְּךָ
  english_pob_choice: Solomon your servant
  chosen_korean: 당신의 종 솔로몬
  alternatives_korean:
  - 솔로몬 당신의 종
  - 솔로몬, 당신의 종
  lexicon: HALOT
  rationale: 히브리어의 소유 관계를 살려 ‘당신의 종’으로 옮기되, 한국어 어순에 맞게 인명 앞에 배치했습니다.
theological_decisions:
- issue: סעודת-제사 맥락에서의 동사 처리
  chosen_reading: ‘잡아 제물로 바쳤다’와 ‘초청했다’를 함께 써서 제의 행위와 사회적 초대의 이중 의미를 살렸습니다.
  alternative_readings:
  - 모두 ‘제사드렸다/불렀다’로 단순화
  - ‘희생하다’와 ‘초대하다’로 분리
  rationale: 본문은 제사와 연회가 결합된 장면이므로, 두 동사의 기능 차이를 구분해 독자가 사건의 성격을 바로 파악하도록 했습니다.
  doctrine_reference: 서사문맥의 제의-연회 결합에 대한 서술 보존
