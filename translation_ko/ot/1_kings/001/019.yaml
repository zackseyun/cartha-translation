  naturalness: ‘군대 사령관’은 현대 한국어에서 자연스럽고, ‘왕의 모든 아들, 제사장 아비아달과 군대 사령관 요압’을 병렬로 처리하면 수식 범위도 명료합니다. 각주 안의 ‘כאן’은 한국어 문장에 부자연스러우므로 ‘여기서’ 또는 히브리어 어휘를 직접 제시하는 방식으로 고쳐야 합니다.
  terminology: 아비아달, 솔로몬, 제사장, 군대 사령관은 적절합니다. ‘소’는 שׁוֹר의 성별 비특정성을 보존하며, ‘양’은 צֹאן의 통상적 번역으로 유지하되 작은 가축 전반을 가리킬 수 있다는 각주를 붙입니다.
