  to: 그가 소와 살진 가축과 양[a]을 많이 잡아 제물로 바치고, 왕의 모든 아들과 제사장 아비아달과 군대 사령관 요압을 초청했으나, 당신의 종 솔로몬은 초청하지 않았습니다.[b]
