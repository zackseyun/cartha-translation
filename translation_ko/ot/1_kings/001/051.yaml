base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/051.yaml
  text: And it was reported to Solomon, saying, “Look, Adonijah fears King Solomon, and look, he has taken hold of the horns of the altar, saying, ‘Let King Solomon swear to me today that he will not put his servant to death with the sword.’”
translation:
  language: ko
  text: 솔로몬에게 보고되어 말했습니다. “보십시오, 아도니야가 솔로몬 왕을 두려워하고 있습니다. 보십시오, 그는 제단의 뿔들을 붙잡고 말하기를, ‘솔로몬 왕께서 오늘 저를 칼로 죽이지 않겠다고 맹세해 주십시오.’”[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘보고되어’는 수동형 히브리어 동사의 보고 전달 뉘앙스를 반영합니다.
    reason: source_note
  - marker: b
    text: ‘보십시오’는 히브리어 הִנֵּה의 반복적 주목 환기를 살린 번역입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וַיֻּגַּד לִשְׁלֹמֹה לֵאמֹר
  english_pob_choice: And it was reported to Solomon, saying
  chosen_korean: 솔로몬에게 보고되어 말했습니다
  alternatives_korean:
  - 솔로몬에게 전해져 말했습니다
  - 솔로몬에게 알려져 말했습니다
  lexicon: הגיד / passive report formula
  rationale: 수동 보고 सूत्र를 자연스럽게 살리되, 원문의 정보 전달 초점을 유지하기 위해 ‘보고되어’로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: deictic particle
  rationale: 반복되는 감탄/지시 표지를 구어체에 가깝지만 공적 문체에 맞게 ‘보십시오’로 일관되게 옮겼습니다.
- source_word: עַבְדּוֹ
  english_pob_choice: his servant
  chosen_korean: 저를
  alternatives_korean:
  - 그의 종을
  - 그의 종을 저를
  lexicon: עבד
  rationale: 아도니야의 자기지칭으로서 한국어에서는 1인칭 목적어 ‘저를’이 가장 자연스럽고, ‘종’의 지위를 본문 안에서 유지하기 위해 ‘당신의 종’이 아니라 상대에게 말하는 1인칭으로 처리했습니다.
- source_word: בֶּחָרֶב
  english_pob_choice: with the sword
  chosen_korean: 칼로
  alternatives_korean:
  - 칼로써
  - 검으로
  lexicon: חרב
  rationale: 히브리어 חרב의 일반적 무기를 표준어로 자연스럽게 옮겼습니다. ‘검’보다 현대 한국어 가독성이 높은 ‘칼’을 택했습니다.
theological_decisions:
- issue: עבד의 자기호칭과 왕 앞의 간청 어조
  chosen_reading: 아도니야의 발화는 예의 바른 간청이지만, 자기 자신을 왕의 처분 아래 있는 사람으로 낮추는 내용은 그대로 드러내고 있습니다.
  alternative_readings:
  - ‘종’으로 직역해 사회적 종속성을 더 강하게 드러내는 방식
  - ‘신하’로 완화해 궁정적 관계로만 읽는 방식
  rationale: 본문의 정치적·법적 긴장을 약화시키지 않기 위해, 아도니야가 왕의 살해 권한을 염두에 두고 맹세를 요구하는 구조를 그대로 유지했습니다.
  doctrine_reference: 본문 의미 보존 및 인물 발화의 담화 기능
- issue: 반복되는 הִנֵּה의 처리
  chosen_reading: 두 번의 ‘보십시오’로 반복을 살려 경고적·주목 환기 효과를 유지했습니다.
  alternative_readings:
  - 두 번째를 생략하거나 ‘자, 보십시오’로 변형하는 방식
  rationale: 히브리어의 반복이 장면의 긴박함을 구성하므로, 한국어에서도 반복을 보존하는 편이 원문 효과에 충실합니다.
  doctrine_reference: 담화 강조 보존
