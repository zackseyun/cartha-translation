source:
  edition: WLC
  text: וַ/אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א מִ/פְּנֵ֣י שְׁלֹמֹ֑ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/050.yaml
  text: And Adonijah was afraid because of Solomon[a], so he arose and went and took hold of the horns of the altar.
  footnotes:
  - marker: a
    text: Taking hold of the horns of the altar was a gesture of seeking sanctuary or mercy at the sanctuary.
    reason: cultural_note
translation:
  language: ko
  text: 아도니야는 솔로몬 때문에 두려워하여 일어나 가서 제단의 뿔을 잡았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제단의 뿔을 잡는 것은 성소에서 보호나 자비를 구하는 몸짓을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: יָרֵא
  english_pob_choice: was afraid
  chosen_korean: 두려워하여
  alternatives_korean:
  - 무서워하여
  - 두려워했습니다
  lexicon: WLC/HALOT
  rationale: 상태를 나타내는 יָרֵא를 자연스럽게 옮기되, 원문의 두려움 감정을 약화시키지 않도록 ‘두려워하여’로 연결했습니다.
- source_word: מִפְּנֵי
  english_pob_choice: because of
  chosen_korean: 솔로몬 때문에
  alternatives_korean:
  - 솔로몬 앞에서
  - 솔로몬의 임재로부터
  - 솔로몬을 두려워하여
  lexicon: WLC/HALOT
  rationale: 이 구는 여기서 공간적 ‘앞에서’보다 두려움의 원인/대상을 나타내므로, 원문의 인과를 드러내는 ‘때문에’를 택했습니다.
- source_word: וַיַּחֲזֵק בְּקַרְנוֹת הַמִּזְבֵּחַ
  english_pob_choice: took hold of the horns of the altar
  chosen_korean: 제단의 뿔을 잡았습니다
  alternatives_korean:
  - 제단의 뿔을 붙잡았습니다
  - 제단의 뿔을 움켜잡았습니다
  lexicon: WLC/HALOT
  rationale: 제의적 피신 행위를 암시하더라도 본문은 물리적 동작을 말하므로, 의미를 확장하지 않고 직설적으로 옮겼습니다.
theological_decisions:
- issue: 제단의 뿔을 잡는 행위의 의미
  chosen_reading: 본문에는 그 행위가 무엇을 요청하는지 설명하지 않고, 단순히 제단의 뿔을 잡는 행동 자체만 제시했습니다.
  alternative_readings:
  - ‘도피처를 구해 제단으로 달려갔다’처럼 의미를 풀어쓴 번역
  rationale: 히브리어는 행위만 서술하므로, 피난·자비 요청의 함의를 본문에 덧붙이지 않고 주석적 정보로 남기는 편이 원문에 충실합니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 범위를 넘겨 해석을 본문에 흡수하지 않는다.'
