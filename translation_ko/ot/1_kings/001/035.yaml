source:
  edition: WLC
  text: וַ/עֲלִיתֶ֣ם אַחֲרָ֗י/ו וּ/בָא֙ וְ/יָשַׁ֣ב עַל כִּסְאִ֔/י וְ/ה֥וּא יִמְלֹ֖ךְ תַּחְתָּ֑/י וְ/אֹת֤/וֹ צִוִּ֨יתִי֙ לִֽ/הְי֣וֹת נָגִ֔יד עַל יִשְׂרָאֵ֖ל וְ/עַל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/035.yaml
  text: Then you shall go up after him[a], and he shall come and sit on my throne, and he shall reign in my place; and I have appointed him to be ruler over Israel and over Judah.
  footnotes:
  - marker: a
    text: Or, 'I have commanded him to be prince/leader over Israel and over Judah.' The Hebrew verb often means 'command,' and נָגִיד can also be rendered 'prince' or 'leader.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 뒤를 따라 올라가서 그가 내 왕좌에 앉게 하고, 그가 내 자리에 통치하게 하십시오. 나는 그를 이스라엘과 유다의 지도자로 임명했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 이스라엘과 유다의 지도자/통치자로 삼도록 명령했습니다.’ 히브리어 동사 צוה는 흔히 ‘명령하다’를 뜻하며, נָגִיד는 ‘통치자’나 ‘지도자’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלִיתֶם אַחֲרָיו
  english_pob_choice: you shall go up after him
  chosen_korean: 그의 뒤를 따라 올라가서
  alternatives_korean:
  - 그 뒤를 따라 올라가서
  - 그의 뒤를 따라 올라가십시오
  lexicon: HALOT
  rationale: עלה의 기본 뜻인 ‘올라가다’를 살리고, אַחֲרָיו는 행렬의 순서를 보여 주므로 ‘그의 뒤를 따라’로 자연스럽게 옮겼습니다.
- source_word: וְיָשַׁב עַל כִּסְאִי
  english_pob_choice: sit on my throne
  chosen_korean: 그가 내 왕좌에 앉게 하고
  alternatives_korean:
  - 그가 내 왕좌에 앉도록 하고
  - 그가 내 왕좌에 앉게 하며
  lexicon: HALOT
  rationale: 왕위 계승의 관용구를 살리면서도 현대 한국어에서 바로 이해되도록 ‘왕좌에 앉게 하다’로 옮겼습니다.
- source_word: וְהוּא יִמְלֹךְ תַּחְתָּי
  english_pob_choice: he shall reign in my place
  chosen_korean: 그가 내 자리에 통치하게 하십시오
  alternatives_korean:
  - 그가 내 대신 통치하게 하십시오
  - 그가 내 자리에서 다스리게 하십시오
  lexicon: HALOT
  rationale: תחתי의 대체/승계 의미를 ‘내 자리에’로 살리고, מלך는 단순한 자리 교체보다 왕권 행사를 드러내는 ‘통치하다’로 옮겼습니다.
- source_word: צִוִּיתִי לִהְיוֹת נָגִיד
  english_pob_choice: I have appointed him to be ruler
  chosen_korean: 나는 그를 … 지도자로 임명했습니다
  alternatives_korean:
  - 나는 그를 … 통치자로 세웠습니다
  - 나는 그를 … 지도자로 명했습니다
  lexicon: HALOT
  rationale: צוה는 ‘명령하다’가 기본이지만, 이 문맥에서는 직분 부여의 선언이므로 ‘임명했습니다’가 더 정확합니다. נָגִיד는 왕과 구별되는 공식적 지도자/지배자를 가리키므로 ‘지도자’로 옮겼습니다.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  english_pob_choice: over Israel and over Judah
  chosen_korean: 이스라엘과 유다의
  alternatives_korean:
  - 이스라엘과 유다 위의
  - 이스라엘과 유다를 다스리는
  lexicon: HALOT
  rationale: 반복되는 עַל의 지배 관계를 한국어에서 자연스럽게 이어 주기 위해 앞선 ‘지도자’와 결합하여 ‘이스라엘과 유다의 지도자’로 구성했습니다.
theological_decisions:
- issue: מלך와 נָגִיד의 구별 유지
  chosen_reading: מלך는 ‘통치하다’, נָגִיד는 ‘지도자’로 구별해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘왕’으로 번역
  - 둘 다 ‘다스리다/다스리는 자’로 번역
  rationale: 본문은 단순히 한 표현을 반복하지 않고 왕권 행사(מלך)와 지정된 통치 직분(נָגִיד)을 함께 제시하므로, 한국어에서도 같은 말로 평준화하지 않고 구별을 살렸습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
