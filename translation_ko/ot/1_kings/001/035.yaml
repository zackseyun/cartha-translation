  naturalness: ‘내 자리에 통치하게 하십시오’는 현대 표준 한국어에서 부자연스럽고, 주어 및 문장 기능도 원문과 다릅니다. 미래의 왕위 계승을 ‘나를 대신하여 왕으로 다스릴 것입니다’로 옮기면 자연스럽고 원문의 대체·승계 의미를 보존합니다.
  terminology: ‘왕좌’, ‘왕으로 다스리다’(מלך), ‘지도자’(נָגִיד)의 구별은 적절합니다. צִוִּיתִי는 기본적으로 ‘명령했다’이지만 이 문맥의 직분 지정 기능을 반영한 ‘세웠습니다’는 안전합니다. 각주에서 ‘명령했다’라는 어휘적 대안을 유지합니다.
