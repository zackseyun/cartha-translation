  edition: WLC
  text: לְכִ֞י וּ/בֹ֣אִי אֶל הַ/מֶּ֣לֶךְ דָּוִ֗ד וְ/אָמַ֤רְתְּ אֵלָי/ו֙ הֲ/לֹֽא אַתָּ֞ה אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ נִשְׁבַּ֤עְתָּ לַ/אֲמָֽתְ/ךָ֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֖וּא יֵשֵׁ֣ב עַל כִּסְאִ֑/י וּ/מַדּ֖וּעַ מָלַ֥ךְ אֲדֹנִיָֽהוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/013.yaml
  text: Please go in to King David and say to him[a], ‘My lord the king, did you not swear to your servant, saying, “Solomon your son shall reign after me, and he shall sit on my throne”? Why then has Adonijah become king?’
  footnotes:
  - marker: a
    text: Or “to your maidservant.” The Hebrew term is specifically feminine and is Bathsheba’s deferential self-reference before the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 가서 다윗 왕께 들어가서 이렇게 말씀하십시오. ‘내 주 왕이시여, 왕께서 이 종에게 “네 아들 솔로몬이 나보다 뒤이어 왕이 될 것이며, 그가 내 왕좌에 앉을 것이다”라고 맹세하지 않으셨습니까? 그런데 어찌하여 아도니야가 왕이 되었습니까?’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여성형으로, 바세바의 겸손한 자기 호칭입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִ֞י וּ/בֹ֣אִי
  english_pob_choice: Please go in
  chosen_korean: 가서 … 들어가서
  alternatives_korean:
  - 들어가십시오
  - 가서 들어가십시오
  lexicon: HALOT
  rationale: 여성 단수 명령 두 개가 이어져 있는 촉구를 한국어에서는 ‘가서 … 들어가서’로 자연스럽게 살렸습니다. 공손한 부탁의 뉘앙스는 뒤의 명령형으로 충분히 드러납니다.
- source_word: אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ
  english_pob_choice: My lord the king
  chosen_korean: 내 주 왕이시여
  alternatives_korean:
  - 내 주여, 왕이시여
  - 나의 주권자 왕이시여
  lexicon: HALOT
  rationale: 인간 왕에 대한 궁정 호칭으로서 ‘주’의 존칭성을 살리되, 현대 한국어에서 자연스러운 직접 호칭으로 옮겼습니다.
- source_word: לַ/אֲמָֽתְ/ךָ֙
  english_pob_choice: to your servant
  chosen_korean: 이 종에게
  alternatives_korean:
  - 이 여종에게
  - 당신의 여종에게
  lexicon: HALOT
  rationale: 히브리어는 여성형 ‘여종’을 가리키지만, 궁정 장면에서의 자기 낮춤 표현을 한국어에서는 ‘이 종’으로 옮겨도 충분히 기능이 보존됩니다. 다만 여성형 뉘앙스는 footnote로 남겼습니다.
- source_word: כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י
  english_pob_choice: Solomon your son shall reign after me
  chosen_korean: 네 아들 솔로몬이 나보다 뒤이어 왕이 될 것이며
  alternatives_korean:
  - 네 아들 솔로몬이 나를 이어 다스릴 것이며
  - 네 아들 솔로몬이 내 뒤를 이어 통치할 것이며
  lexicon: HALOT
  rationale: יִמְלֹךְ는 단순히 ‘통치하다’보다 ‘왕이 되다/왕 노릇하다’에 가깝기 때문에, 왕위 계승을 분명히 드러내는 표현을 택했습니다.
- source_word: וְ/ה֖וּא יֵשֵׁ֣ב עַל כִּסְאִ֑/י
  english_pob_choice: and he shall sit on my throne
  chosen_korean: 그가 내 왕좌에 앉을 것이다
  alternatives_korean:
  - 그가 내 보좌에 앉을 것이다
  - 그가 내 왕좌에 앉으리라
  lexicon: HALOT
  rationale: 즉위·계승의 상징어인 ‘왕좌’를 사용해 본문의 왕권 언어를 유지했습니다. 한국어 ‘앉다’는 즉위 은유를 자연스럽게 전달합니다.
- source_word: מָלַ֥ךְ אֲדֹנִיָֽהוּ
  english_pob_choice: has Adonijah become king
  chosen_korean: 아도니야가 왕이 되었습니까
  alternatives_korean:
  - 아도니야가 왕이 되었습니까?
  - 아도니야가 왕으로 즉위했습니까?
  lexicon: HALOT
  rationale: 히브리어 완료형이 이미 벌어진 사실을 문제 삼는 문맥이므로, 한국어도 ‘되었습니까’로 현재에 나타난 결과를 묻는 방식으로 옮겼습니다.
theological_decisions:
- issue: 왕에게 대한 직접 호칭의 존칭 처리
  chosen_reading: ‘내 주 왕이시여’로 번역해 인간 왕에 대한 예우를 분명히 하되, 주(主)를 곧바로 하나님 호칭으로 오해하지 않게 했습니다.
  alternative_readings:
  - ‘내 주여, 왕이시여’
  - ‘내 주 왕이시여’ 대신 ‘나의 주인이신 왕이여’
  rationale: 본문은 예배적 호칭이 아니라 궁정 예절 속의 정중한 호칭입니다. 따라서 한국어에서도 위계와 공손함을 분명히 하면서도 신학적 과잉을 피했습니다.
  doctrine_reference: 궁정 예절과 신적 칭호의 구별
- issue: 본문의 ‘왕이 되다’와 ‘다스리다’의 의미 범위
  chosen_reading: ‘왕이 되었다’와 ‘왕좌’로 옮겨 즉위와 찬탈의 사실성을 드러냈습니다.
  alternative_readings:
  - ‘통치하다’
  - ‘다스리다’
  rationale: 이 구절은 단순한 일반 통치가 아니라 다윗의 약속에 대한 배반적 상황을 따지는 문맥이므로, 즉위 사실을 드러내는 표현이 더 적절합니다.
  doctrine_reference: 서술 문맥의 왕권/계승 표현
