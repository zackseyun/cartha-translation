    text: 또는 “내 영혼.” 히브리어 네페쉬는 영혼, 자기 자신, 생명을 뜻할 수 있으며, 여기서는 위험에서 보존된 생명을 가장 자연스럽게 가리킵니다.
    reason: lexical_alternative
