  text: And the king swore and said[a], “As Yahweh lives, who has redeemed my life from every distress,”
  footnotes:
  - marker: a
    text: Or “my soul.” Hebrew nephesh can mean soul, self, or life; here it most naturally refers to David’s life preserved from danger.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 맹세하며 말했습니다. 「야훼께서 살아 계십니다. 그분은 내 생명을 모든 환난에서 건져 내셨습니다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 영혼.” 히브리어 nephesh는 영혼, 자기 자신, 생명을 뜻할 수 있으며, 여기서는 위험에서 보존된 생명을 가장 자연스럽게 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  english_pob_choice: swore
  chosen_korean: 맹세하며
  alternatives_korean:
  - 맹세하고
  - 맹세하였고
  lexicon: HALOT
  rationale: 서사 문맥에서 שׁבע의 핵심 의미를 자연스럽게 살리면서, 이어지는 직접 인용을 매끄럽게 여는 표현으로 옮겼습니다.
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕이
  alternatives_korean:
  - 그 왕이
  - 임금이
  lexicon: HALOT
  rationale: 히브리어는 인물 이름보다 직함을 쓰므로 그 형식을 유지했고, 현대 표준어에서는 '왕'이 가장 직접적입니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서 살아 계십니다
  alternatives_korean:
