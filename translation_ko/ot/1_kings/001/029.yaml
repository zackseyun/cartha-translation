  - 나 자신
  lexicon: HALOT
  rationale: 이 문맥의 נֶפֶשׁ은 추상적 '영혼'보다 위험에서 보존된 삶 자체를 가리키므로, POB의 해석을 따라 '생명'으로 옮겼습니다.
