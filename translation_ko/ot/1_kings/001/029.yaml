  rationale: 맹세 공식의 생동감을 살리기 위해 직역적이면서도 한국어로 자연스러운 서약 표현으로 옮겼습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my life
  chosen_korean: 내 생명
  alternatives_korean:
