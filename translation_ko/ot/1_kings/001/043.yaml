  - marker: a
    text: Or simply, “But our lord King David has made Solomon king.” The Hebrew adversative אֲבָל can be rendered more minimally as “but,” though here it carries a corrective force.
    reason: lexical_alternative
translation:
  language: ko
  text: 요나단이 아도니야에게 대답하여 말했습니다. “오히려 우리 주이신 다윗 왕께서 솔로몬을 왕으로 세우셨습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그러나 우리 주이신 다윗 왕께서 솔로몬을 왕으로 세우셨습니다.” 히브리어 אֲבָל은 단순히 ‘그러나’로 옮길 수도 있으나, 여기서는 상대의 전제를 바로잡는 대조의 뜻을 나타냅니다.
    reason: lexical_alternative
