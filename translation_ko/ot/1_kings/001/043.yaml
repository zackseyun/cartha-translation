  text: Jonathan answered and said to Adonijah[a], “On the contrary, our lord King David has made Solomon king.”
  footnotes:
  - marker: a
    text: Or simply, “But our lord King David has made Solomon king.” The Hebrew adversative אֲבָל can be rendered more minimally as “but,” though here it carries a corrective force.
    reason: lexical_alternative
translation:
  language: ko
  text: 요나단이 아도니야에게 대답하여 말했습니다. 「그렇지 않습니다. 우리 주 왕 다윗이 솔로몬을 왕으로 삼으셨습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그렇지 않습니다. 우리 주 왕 다윗이 솔로몬을 왕으로 삼으셨습니다.”처럼 옮길 수도 있습니다. 히브리어 אֲבָל은 단순한 ‘그러나’보다 교정하는 힘이 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן / וַיֹּאמֶר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답하며 말했습니다
  - 답하여 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 두 동사 연속을 자연스럽게 살리되, 한국어에서는 군더더기 없이 ‘대답하여 말했습니다’로 옮겨 응답의 흐름을 보존했습니다.
- source_word: אֲבָל
  english_pob_choice: On the contrary
  chosen_korean: 그렇지 않습니다
  alternatives_korean:
  - 그러나
  - 반대로
  lexicon: HALOT
  rationale: 여기서는 단순한 접속이 아니라 상대의 전제를 바로잡는 반박이므로, 교정적 힘을 드러내는 표현을 택했습니다.
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  english_pob_choice: our lord King David
  chosen_korean: 우리 주 왕 다윗
  alternatives_korean:
  - 우리의 주이신 다윗 왕
  - 우리 임금 다윗
  lexicon: HALOT
  rationale: 아도니누는 왕에 대한 궁정식 호칭이므로 ‘우리 주’로 살리고, 이어지는 왕호와 인명을 한국어 어순에 맞게 배열했습니다.
- source_word: הִמְלִיךְ
  english_pob_choice: has made Solomon king
  chosen_korean: 솔로몬을 왕으로 삼으셨습니다
  alternatives_korean:
  - 솔로몬을 왕으로 세우셨습니다
  - 솔로몬을 왕이 되게 하셨습니다
  lexicon: HALOT
  rationale: הִמְלִיךְ의 핵심은 ‘왕이 되게 하다/왕으로 세우다’이므로, 본문이 말하는 임명·설정의 의미를 살려 옮겼습니다.
