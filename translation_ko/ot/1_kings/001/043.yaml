  - 다윗이 솔로몬을 왕이 되게 하셨습니다
  rationale: 본문은 단순한 선언이 아니라 다윗의 권위로 솔로몬 왕권이 실제로 확정되었음을 말하므로, 완료된 사실을 분명히 드러냈습니다.
  doctrine_reference: 왕권/섭리
