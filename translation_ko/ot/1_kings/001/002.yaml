source:
  edition: WLC
  text: וַ/יֹּ֧אמְרוּ ל֣/וֹ עֲבָדָ֗י/ו יְבַקְשׁ֞וּ לַ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ נַעֲרָ֣ה בְתוּלָ֔ה וְ/עָֽמְדָה֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וּ/תְהִי ל֖/וֹ סֹכֶ֑נֶת וְ/שָׁכְבָ֣ה בְ/חֵיקֶ֔/ךָ וְ/חַ֖ם לַ/אדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/002.yaml
  text: So his servants said to him[a], “Let them seek for my lord the king a young virgin woman, and let her attend the king and be his caregiver, and let her lie in your bosom[c][b], so that my lord the king may be warm.”
  footnotes:
  - marker: a
    text: Or 'let her stand before the king'; the Hebrew idiom can mean to attend or wait on someone in service.
    reason: lexical_alternative
  - marker: b
    text: Or 'attendant' or 'nurse' for 'caregiver'; the Hebrew term is rare and denotes one who ministers to or cares for another.
    reason: lexical_alternative
  - marker: c
    text: Literally 'in your bosom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 신하들이 그에게 말했습니다. “우리 주인 왕을 위하여 젊은 처녀를 찾게 하시고, 그 여자가 왕 앞에서 왕을 모시고[a] 왕을 돌보게 하시며[b], 왕의 품에 누워[c] 우리 주인 왕께서 따뜻해지시게 하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왕 앞에 서게 하십시오’입니다. 히브리어 관용구는 누군가를 모시거나 시중드는 뜻으로도 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘돌보는 이’나 ‘간호인’으로도 옮길 수 있습니다. 히브리어의 이 말은 희귀어로, 누군가를 보살피고 돌보는 사람을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘왕의 품 안에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 신하들
  alternatives_korean:
  - 그의 종들
  - 그의 시종들
  lexicon: HALOT
  rationale: 궁중 문맥에서 עבד는 단순 노예보다 왕실 신하·시종의 기능을 가리키므로, 한국어에서도 관청·궁정 맥락이 드러나는 ‘신하들’이 가장 자연스럽습니다.
- source_word: נַעֲרָה בְתוּלָה
  english_pob_choice: a young virgin woman
  chosen_korean: 젊은 처녀
  alternatives_korean:
  - 젊은 동정녀
  - 젊은 처녀 여자
  lexicon: HALOT
  rationale: 히브리어의 두 명사(젊은 여자/처녀성)를 모두 살리되, 한국어에서는 중복이 어색하므로 ‘젊은 처녀’로 압축해 의미를 보존했습니다.
- source_word: וְעָמְדָה לִפְנֵי הַמֶּלֶךְ
  english_pob_choice: let her stand before the king
  chosen_korean: 왕 앞에 서서
  alternatives_korean:
  - 왕을 모시게 하고
  - 왕 곁에 있게 하고
  lexicon: HALOT
  rationale: ‘서다/앞에 서다’의 직역적 이미지를 살리면서도 궁정에서의 대기·봉사 뉘앙스를 자연스럽게 드러내기 위해 ‘왕 앞에 서서’로 옮겼습니다.
- source_word: סֹכֶנֶת
  english_pob_choice: caregiver
  chosen_korean: 모시고
  alternatives_korean:
  - 돌보는 이가 되어
  - 시중들고
  lexicon: HALOT
  rationale: 희귀어로서 돌봄·시중의 의미가 핵심이므로, 직함처럼 굳은 명사보다 행위 중심 표현 ‘모시고’가 문맥상 적절합니다.
- source_word: וְשָׁכְבָה בְחֵיקֶךָ
  english_pob_choice: let her lie in your bosom
  chosen_korean: 당신의 품에 누워
  alternatives_korean:
  - 당신의 품속에 누워
  - 당신의 젖가슴에 누워
  lexicon: HALOT
  rationale: חֵיק의 구체적 신체 이미지를 살리되 한국어에서 덜 노골적인 ‘품’으로 옮겨, 근접성과 온기 목적을 유지했습니다.
theological_decisions:
- issue: 왕의 ‘따뜻해짐’이 단순한 체온 회복을 넘는지 여부
  chosen_reading: 문맥상 노쇠한 왕의 체온을 위한 실제적 목적 표현으로 유지했습니다.
  alternative_readings:
  - 상징적 위로로 완화하여 읽기
  - 간접적으로 표현하기
  rationale: 본문은 노쇠한 다윗의 신체적 추위를 전제하는 서술이므로, 의미를 도덕화하거나 완화하지 않고 목적절을 그대로 살렸습니다.
  doctrine_reference: 본문 문맥 우선 해석 원칙
