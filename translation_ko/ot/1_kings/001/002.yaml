  naturalness: ‘주인 나리 왕’은 현대 표준어 합쇼체에서 부자연스럽고, 인용문 안에서 왕에게 직접 말하면서 ‘그를’과 ‘당신’을 병용한 것은 지시 대상과 높임의 일관성을 해칩니다. ‘우리 주인 왕’과 ‘왕’을 일관되게 쓰면 자연스럽고 원문의 궁정 경어도 보존됩니다.
  terminology: ‘신하들’, ‘젊은 처녀’, ‘품’은 적절합니다. סֹכֶנֶת은 ‘모시고’만으로 처리하지 말고 ‘돌보다’의 의미를 명시하는 것이 안전합니다. ‘왕 앞에서 모시다’는 עָמְדָה לִפְנֵי의 관용적 봉사 의미로, 직역 가능성은 각주로 보존합니다.
