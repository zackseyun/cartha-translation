  source_fidelity: 수정이 필요합니다. 초안의 ‘그들은 … 알려 달라고 기다리고 있습니다’는 원문의 ‘알려 주기 위하여/알려 주도록’에 없는 ‘기다리다’와 직접 청원을 덧붙입니다. 또한 אַחֲרָיו의 3인칭 남성 단수 접미사가 가리키는 다윗 왕을 한국어 본문에서도 분명히 보존하는 편이 좋습니다.
  naturalness: ‘내 주 왕이시여’와 ‘왕께 쏠려 있습니다’는 현대 표준 한국어의 격식 있는 성경 문체에 자연스럽습니다. 후반부는 ‘바라고 있습니다’를 사용하여 온 이스라엘이 왕의 선언을 기대한다는 원문의 기능을 자연스럽게 연결했습니다.
  terminology: אֲדֹנִי הַמֶּלֶךְ은 ‘내 주 왕’으로 일관되게 옮겼고, כִּסֵּא는 ‘왕좌’, 왕위 계승의 ישב는 ‘왕좌에 누가 앉을지’로 보존했습니다. ‘왕께’는 궁정 호칭에 맞는 합쇼체 높임입니다.
