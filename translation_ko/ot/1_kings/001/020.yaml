source:
  edition: WLC
  text: וְ/אַתָּה֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ עֵינֵ֥י כָל יִשְׂרָאֵ֖ל עָלֶ֑י/ךָ לְ/הַגִּ֣יד לָ/הֶ֔ם מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/020.yaml
  text: And you[a], my lord the king, the eyes of all Israel are on you[b], to tell them who will sit on the throne of my lord the king after him.
  footnotes:
  - marker: a
    text: Or, more formally, 'all Israel's eyes are upon you.'
    reason: lexical_alternative
  - marker: b
    text: That is, after King David.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 당신[a], 내 주 왕이시여, 온 이스라엘의 눈이 당신을 향하고 있습니다[b]. 그들은 내 주 왕의 뒤를 이어 왕좌에 누가 앉을지 알려 달라고 기다리고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면 ‘온 이스라엘의 눈이 당신 위에 있습니다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 다윗 왕을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: 내 주 왕이시여
  alternatives_korean:
  - 내 주 왕이여
  - 나의 주 왕이시여
  - 왕이시여
  lexicon: HALOT
  rationale: 아ֲדֹנִי의 공손한 호칭과 הַמֶּלֶךְ의 왕호를 함께 살리기 위해, 존칭을 유지하면서도 한국어 궁정식 호칭으로 자연스럽게 옮겼습니다.
- source_word: עֵינֵי כָל יִשְׂרָאֵל עָלֶיךָ
  english_pob_choice: the eyes of all Israel are on you
  chosen_korean: 온 이스라엘의 눈이 당신을 향하고 있습니다
  alternatives_korean:
  - 온 이스라엘의 눈이 당신 위에 있습니다
  - 온 이스라엘이 당신을 바라보고 있습니다
  - 온 이스라엘의 눈이 당신께 쏠려 있습니다
  lexicon: HALOT
  rationale: ‘눈이 … 위에 있다’는 관용을 한국어로는 ‘향하고 있습니다’로 옮겨, 기대와 주목이 걸려 있는 이미지를 자연스럽게 살렸습니다.
- source_word: לְהַגִּיד לָהֶם
  english_pob_choice: to tell them
  chosen_korean: 그들은 … 알려 달라고 기다리고 있습니다
  alternatives_korean:
  - 그들에게 말해 달라고 합니다
  - 그들에게 알려 주라고 요청합니다
  - 그들에게 밝히라고 합니다
  lexicon: HALOT
  rationale: 히필 동사의 ‘알게 하다/알리다’ 의미를 살리되, 문맥상 왕에게 후계자를 지명해 달라는 간청이므로 한국어에서는 청유적 뉘앙스를 반영했습니다.
- source_word: אַחֲרָיו
  english_pob_choice: after him
  chosen_korean: 뒤를 이어
  alternatives_korean:
  - 그 뒤에
  - 그 후에
  - 그의 뒤를 이어
  lexicon: HALOT
  rationale: 3인칭 남성 단수 대명사로서 다윗을 가리키는 수순 계승의 의미를 한국어에서 ‘뒤를 이어’로 분명히 하면서도 과잉 설명은 피했습니다.
theological_decisions:
- issue: 왕위 계승의 대상과 시점
  chosen_reading: ‘내 주 왕의 뒤를 이어’는 지금 말해지는 왕위 승계를 뜻하며, 직접적으로 다윗 이후의 왕을 묻는 말로 읽었습니다.
  alternative_readings:
  - 단순히 ‘그 뒤에’라는 시간적 표현
  - 문맥상 특정 인물 지목을 본문에 더 노출하는 번역
  rationale: 히브리어 אַחֲרָיו의 인칭 접미사는 직전의 왕을 가리키며, 본문 전체는 다윗의 후계 문제를 다루므로 의미를 흐리지 않도록 승계 맥락을 유지했습니다.
  doctrine_reference: 성경 본문의 역사적-문맥적 의미를 우선 보존합니다.
