revisions:
- from: 그리고 당신[a], 내 주 왕이시여, 온 이스라엘의 눈이 당신을 향하고 있습니다[b]. 그들은 내 주 왕의 뒤를 이어 왕좌에 누가 앉을지 알려 달라고 기다리고 있습니다.
  to: 그러나 내 주 왕이시여, 온 이스라엘의 눈이 왕께[a] 쏠려 있습니다. 왕께서 내 주 왕의 뒤를 이어[b] 그 왕좌에 누가 앉을지를 그들에게 알려 주시기를 바라고 있습니다.
  rationale: 원문의 두 핵심 요소, 곧 온 이스라엘이 왕에게 주목한다는 관용적 이미지와 왕이 후계자를 알려야 한다는 기대를 유지했습니다. ‘기다리다’와 직접 청원이라는 추가 의미는 제거했으며, ‘내 주 왕의 뒤를 이어’로 אַחֲרָיו의 인칭 지시와 계승 맥락을 보존했습니다. 각주 a는 실제 관용구에 다시 연결하고, 각주 b는 본문 문맥상 분명한 다윗 왕 지시를 설명합니다.
