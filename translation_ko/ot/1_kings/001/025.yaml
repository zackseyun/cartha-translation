base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/025.yaml
  text: For he has gone down today and sacrificed oxen[a], fattened calves, and sheep in abundance, and he has invited all the king’s sons, the commanders of the army, and Abiathar the priest. And look, they are eating and drinking before him, and they are saying[b], ‘Long live King Adonijah!’
  footnotes:
  - marker: a
    text: Or, more formally, 'he went down today.' The Hebrew verb preserves the directional idea 'went/came down.'
    reason: lexical_alternative
  - marker: b
    text: '''Long live King Adonijah!'' is the idiomatic rendering of the Hebrew acclamation ''May the king live, Adonijah.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 오늘 내려가서[a] 소와 살진 가축과 양을 많이 제물로 바치고, 왕의 모든 아들들과 군대의 지휘관들과 제사장 아비아달을 초대했습니다. 보십시오, 그들이 그의 앞에서 먹고 마시며, ‘아도니야 왕 만세!’[b]라고 외치고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 형식적으로는 ‘그가 오늘 내려갔습니다’로 옮길 수 있습니다. 히브리어 동사는 ‘내려가다’라는 방향성을 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아도니야 왕 만세!’는 히브리어의 관용적 환호를 옮긴 것입니다. 직역하면 ‘아도니야 왕이 오래 살기를!’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַד הַיּוֹם
  english_pob_choice: he has gone down today
  chosen_korean: 오늘 내려가서
  alternatives_korean:
  - 오늘 갔습니다
  - 오늘 내려왔습니다
  lexicon: HALOT
  rationale: 히브리어 יָרַד의 방향성인 ‘내려가다’를 살리되, 한국어에서는 서술 흐름상 동작 연결형으로 자연스럽게 옮겼습니다.
- source_word: וַיִּזְבַּח שׁוֹר וּמְרִיא וְצֹאן לָרֹב
  english_pob_choice: sacrificed oxen, fattened calves, and sheep in abundance
  chosen_korean: 소와 살진 송아지들과 양을 많이 잡고
  alternatives_korean:
  - 소와 살진 송아지들과 양을 풍성하게 제사하고
  - 소와 살진 가축들과 양을 많이 희생제물로 드리고
  lexicon: HALOT
  rationale: זבח는 제의적 ‘잡다/제사하다’의 뜻이지만, 이 문맥의 잔치-희생 결합을 현대 한국어에서 과도하게 설명하지 않도록 ‘잡고’로 간결하게 옮겼습니다. מְרִיא는 문맥상 ‘살진 송아지들’이 가장 자연스럽고 구체적입니다.
- source_word: וַיִּקְרָא לְכָל בְּנֵי הַמֶּלֶךְ וּלְשָׂרֵי הַצָּבָא וּלְאֶבְיָתָר הַכֹּהֵן
  english_pob_choice: he has invited all the king’s sons, the commanders of the army, and Abiathar the priest
  chosen_korean: 왕의 모든 아들들과 군대의 지휘관들과 제사장 아비아달을 초대했습니다.
  alternatives_korean:
  - 왕의 모든 아들들과 군대의 지휘관들과 제사장 아비아달을 불렀습니다.
  - 왕의 모든 아들들과 군대의 지휘관들과 아비아달 제사장을 불렀습니다.
  lexicon: HALOT
  rationale: קרא לְ는 여기서 초대/소집의 의미이므로 ‘초대했습니다’가 가장 자연스럽습니다. כֹּהֵן은 직분을 드러내기 위해 ‘제사장’으로 옮겼고, 고유명사는 한국어 성경에서 익숙한 ‘아비아달’을 썼습니다.
- source_word: וְהִנָּם אֹכְלִים וְשֹׁתִים לְפָנָיו
  english_pob_choice: And look, they are eating and drinking before him
  chosen_korean: 보십시오, 그들이 그의 앞에서 먹고 마시며
  alternatives_korean:
  - 보십시오, 그들이 그의 앞에서 먹고 마시고 있으며
  - 보십시오, 그들이 그의 면전에서 먹고 마시며
  lexicon: HALOT
  rationale: הִנָּם의 주의를 끄는 기능은 ‘보십시오’로 살렸고, 현재 진행 중인 동작은 진행형 어미보다 한국어의 서술 연결로 자연스럽게 표현했습니다.
- source_word: יְחִי הַמֶּלֶךְ אֲדֹנִיָּהוּ
  english_pob_choice: Long live King Adonijah!
  chosen_korean: ‘아도니야 왕 만세!’
  alternatives_korean:
  - ‘왕 아도니야 만세!’
  - ‘아도니야 왕이여, 오래 사십시오!’
  lexicon: HALOT
  rationale: 히브리어의 관용적 축원/환호를 한국어의 공적 경축 구호인 ‘만세’로 옮겨, 원문의 짧고 강한 아성(阿聲)을 살렸습니다.
theological_decisions:
- issue: 왕위 찬탈을 암시하는 공개 환호의 뉘앙스
  chosen_reading: ‘아도니야 왕 만세!’라는 직역보다 관용적인 환호로 처리하되, 본문이 실제로 왕위 주장에 대한 지지를 드러낸다는 긴장감은 유지했습니다.
  alternative_readings:
  - ‘아도니야 왕이 오래 살기를!’
  - ‘왕 아도니야 만세!’
  rationale: 히브리어 יְחִי הַמֶּלֶךְ는 단순 축원이 아니라 즉위 지지의 공적 선언이므로, 한국어에서도 정치적·공적 함의를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 본문 맥락 주해
