    issue: כִּי를 ‘분명히’로 확정하고 이를 뒷받침하는 각주를 둠
    rationale: 이 문맥의 כִּי는 맹세의 인용 내용을 이끄는 표지로도 자연스럽습니다. 확언 부사를 본문에 추가하면 원문이 남긴 기능상의 여지를 좁히며, ‘내 뒤를 이어’는 원문에 명시되어 있어 별도 각주가 불필요합니다.
  - severity: low
    issue: 호칭과 2인칭 표현이 현대 한국어 왕실 발화에서 다소 부자연스러움
    rationale: ‘내 주님, 당신은 … 당신의 여종에게’보다 ‘나의 주인이시여, 왕께서는 … 여종인 저에게’가 높임과 자기 낮춤을 더 자연스럽게 구현합니다.
