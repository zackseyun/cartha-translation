  text: She said to him, “My lord, you swore by the LORD your God to your female servant, ‘Surely Solomon your son will reign after me, and he will sit on my throne.’”
translation:
  language: ko
  text: 그녀가 그에게 말했습니다. “내 주님, 당신은 야훼 당신의 하나님을 두고 당신의 여종에게 맹세하여, ‘분명히 솔로몬, 당신의 아들이 내 뒤를 이어 왕이 될 것이며, 그가 내 왕좌에 앉을 것이다’라고 하셨습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 솔로몬이 ‘내 뒤를 이어’ 왕이 된다는 뜻을 분명히 합니다.
    reason: source_note
lexical_decisions:
- source_word: אֲדֹנִי / my lord
  english_pob_choice: My lord
  chosen_korean: 내 주님
  alternatives_korean:
  - 내 주인님
  - 내 상전
  lexicon: אדון
  rationale: 솔로몬어머니가 왕에게 정중히 호칭하는 표현으로, 현대 한국어에서는 관계와 존칭을 함께 살리는 ‘내 주님’이 가장 자연스럽고 본문의 예를 유지합니다.
- source_word: וַתֹּאמֶר... לָאֲמָתֶךָ / she said... to your female servant
  english_pob_choice: to your female servant
  chosen_korean: 당신의 여종에게
  alternatives_korean:
  - 당신의 여자 종에게
  - 당신의 시녀에게
  lexicon: אמה
  rationale: ‘여종’이 히브리어의 종속 신분을 직접 드러내며, 이 본문에서 필요한 낮은 사회적 지위를 잘 보존합니다.
- source_word: בַּיהוָה אֱלֹהֶיךָ / by the LORD your God
  english_pob_choice: by the LORD your God
  chosen_korean: 야훼 당신의 하나님을 두고
  alternatives_korean:
  - 주 당신의 하나님을 두고
  - 여호와 당신의 하나님을 두고
  lexicon: יהוה
  rationale: 프로젝트 기본값에 따라 YHWH는 ‘야훼’로 옮기고, ‘두고 맹세하다’는 서약의 매개를 한국어 관용에 맞게 살렸습니다.
- source_word: כִּי / Surely
  english_pob_choice: Surely
  chosen_korean: 분명히
  alternatives_korean:
  - 정녕
  - 반드시
  lexicon: כי
  rationale: 영어 POB가 유지한 확언의 뉘앙스를 반영해, 약속의 확실성을 드러내는 ‘분명히’를 선택했습니다.
- source_word: יִמְלֹךְ ... וְהוּא יֵשֵׁב עַל כִּסְאִי / will reign ... and he will sit on my throne
  english_pob_choice: will reign ... and he will sit on my throne
  chosen_korean: 왕이 될 것이며, 그가 내 왕좌에 앉을 것이다
  alternatives_korean:
  - 다스릴 것이며, 그가 내 왕좌에 앉을 것이다
  - 통치할 것이며, 그가 내 보좌에 앉을 것이다
  lexicon: מלך
  rationale: ‘왕이 될 것이다’는 왕위 계승의 결과를 분명히 하고, ‘왕좌’는 본문의 왕권 상징을 현대 독자에게 직관적으로 전달합니다.
theological_decisions:
- issue: YHWH의 음역과 언약적 맹세 표현
  chosen_reading: ‘야훼 당신의 하나님을 두고’로 옮겨, 단순한 언급이 아니라 언약적 맹세의 대상임을 드러냈습니다.
  alternative_readings:
  - ‘주 당신의 하나님을 두고’
  - ‘여호와 당신의 하나님을 두고’
  rationale: 이 절은 왕위 계승 약속이 신적 보증 위에 있음을 강조하므로, 본문이 가진 맹세의 무게를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: YHWH as covenant God; oath language in OT narrative
