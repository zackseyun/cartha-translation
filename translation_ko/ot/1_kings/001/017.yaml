revisions:
- from: 그녀가 그에게 말했습니다. “내 주님, 당신은 야훼 당신의 하나님을 두고 당신의 여종에게 맹세하여, ‘분명히 솔로몬, 당신의 아들이 내 뒤를 이어 왕이 될 것이며, 그가 내 왕좌에 앉을 것이다’라고 하셨습니다.”[a]
  to: 그녀가 그에게 말했습니다. “나의 주인이시여, 왕께서는 야훼, 왕의 하나님을 두고 여종인 저에게 맹세하시기를, ‘솔로몬, 왕의 아들이 내 뒤를 이어 왕이 되고, 그가 내 왕좌에 앉을 것이다’라고 하셨습니다.”
  rationale: 불필요하게 확정적인 ‘분명히’와 원문상 중복되는 각주를 제거했습니다. 맹세의 인용 구조와 왕위 계승의 두 요소를 보존하면서, 왕에게 말하는 화자의 격식 있는 높임말과 자기 낮춤을 자연스러운 현대 한국어로 다듬었습니다.
