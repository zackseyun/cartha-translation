base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/008.yaml
  text: But Zadok the priest[a], Benaiah son of Jehoiada, Nathan the prophet, Shimei, Rei, and the mighty men who belonged to David were not with Adonijah.
  footnotes:
  - marker: a
    text: Or 'David’s mighty men.' The Hebrew reads literally, 'the mighty men who were/belonged to David.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 제사장 사독, 여호야다의 아들 브나야, 예언자 나단, 시므이와 레이, 그리고 다윗에게 속한 용사들은[a] 아도니야와 함께 있지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗의 용사들’. 히브리어는 문자적으로 ‘다윗에게 속한 용사들’이라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/צָדוֹק הַכֹּהֵן
  english_pob_choice: But Zadok the priest
  chosen_korean: 그러나 사독 제사장
  alternatives_korean:
  - 그리고 사독 제사장
  - 또 사독 제사장
  lexicon: HALOT
  rationale: 앞선 맥락과의 대비를 드러내기 위해 וְ를 ‘그러나’로 옮겼고, הַכֹּהֵן은 사독의 직분을 분명히 하는 ‘제사장’으로 옮겼습니다.
- source_word: וּ/בְנָיָהוּ בֶן יְהוֹיָדָע
  english_pob_choice: Benaiah son of Jehoiada
  chosen_korean: 여호야다의 아들 브나야
  alternatives_korean:
  - 브나야, 여호야다의 아들
  - 브나야, 여호야다의 아들로서
  lexicon: HALOT
  rationale: 히브리어의 부자 관계를 자연스러운 현대 한국어 소유격으로 풀어, 인물 식별 기능을 살렸습니다.
- source_word: וְ/נָתָן הַ/נָּבִיא
  english_pob_choice: Nathan the prophet
  chosen_korean: 예언자 나단
  alternatives_korean:
  - 나단 예언자
  - 나단 선지자
  lexicon: HALOT
  rationale: הַנָּבִיא는 전통적 교회어 ‘선지자’보다 원문의 직분 의미를 더 직접적으로 드러내는 ‘예언자’로 옮겼습니다.
- source_word: וְ/הַ/גִּבּוֹרִים אֲשֶׁר לְ/דָוִד
  english_pob_choice: and the mighty men who belonged to David
  chosen_korean: 다윗에게 속한 용사들
  alternatives_korean:
  - 다윗의 용사들
  - 다윗에게 속한 장사들
  lexicon: HALOT
  rationale: גִּבּוֹרִים의 군사적 뉘앙스를 ‘용사들’로 살렸고, אֲשֶׁר לְדָוִד은 관계를 압축하지 않고 ‘다윗에게 속한’으로 반영했습니다.
- source_word: לֹא הָיוּ עִם אֲדֹנִיָּהוּ
  english_pob_choice: were not with Adonijah
  chosen_korean: 아도니야와 함께 있지 않았습니다
  alternatives_korean:
  - 아도니야 편에 서 있지 않았습니다
  - 아도니야와 함께하지 않았습니다
  lexicon: HALOT
  rationale: 직역의 절제감을 유지하면서도 문맥상 정치적 지지 부재가 자연스럽게 드러나도록 ‘함께 있지 않았다’로 옮겼습니다.
theological_decisions:
- issue: וְ의 문맥상 기능
  chosen_reading: 단순 연결이 아니라 앞 문맥의 아도니야 지지자 목록에 대한 대비를 드러내는 전환으로 보았습니다.
  alternative_readings:
  - 그리고
  - 또
  rationale: 서술 흐름상 본절은 누구가 아도니야 편에 서 있지 않았는지를 나열하므로, 한국어에서는 대비 표지가 의미를 가장 잘 보존합니다.
  doctrine_reference: 본문 문맥 해석
