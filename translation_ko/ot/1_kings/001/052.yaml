id: 1KI.1.52
reference: 1 Kings 1:52
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֔ה אִ֚ם יִהְיֶ֣ה לְ/בֶן חַ֔יִל לֹֽא יִפֹּ֥ל מִ/שַּׂעֲרָת֖/וֹ אָ֑רְצָ/ה וְ/אִם רָעָ֥ה תִמָּצֵא ב֖/וֹ וָ/מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/052.yaml
  text: And Solomon said[a], “If he proves to be a worthy man, not one of his hairs will fall to the ground; but if evil is found in him[b], he shall die.”
  footnotes:
  - marker: a
    text: Literally, 'a son of valor/strength.' The Hebrew idiom can mean a man of worth, capability, or valor depending on context.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''not one hair of him will fall to the ground,'' an idiom meaning he will come to no harm.'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬이 말했습니다. “그가 훌륭한 사람[a]이라면, 그의 머리카락 하나도 땅에 떨어지지 않을 것입니다[b]. 그러나 그에게서 악이 발견되면, 그는 죽을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로 ‘힘의 아들’이며, 문맥에 따라 용맹하고 유능한 사람, 또는 훌륭하고 가치 있는 사람을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 머리카락 하나도 땅에 떨어지지 않을 것이다’라고 하며, 아무 해도 입지 않는다는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן־חַיִל
  english_pob_choice: a worthy man
  chosen_korean: 용기 있고 유능한 사람
  alternatives_korean:
  - 용맹한 사람
  - 훌륭한 사람
  - 가치 있는 사람
  lexicon: HALOT
  rationale: 직역하면 ‘힘의 아들’이지만, 여기서는 전투적 용맹만이 아니라 인물의 자격과 능력을 평가하는 관용구이므로 두 요소를 함께 살린 표현이 적절합니다.
- source_word: מִשַּׂעֲרָתוֹ / לֹא יִפֹּל ... אָרְצָה
  english_pob_choice: not one of his hairs will fall to the ground
  chosen_korean: 그의 머리카락 하나도 땅에 떨어지지 않을 것입니다
  alternatives_korean:
  - 그의 머리털 하나도 땅에 떨어지지 않을 것입니다
  - 한 올도 땅에 떨어지지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 보존·무해함을 뜻하는 관용구를 한국어의 자연스러운 표현으로 옮기되, ‘하나도’와 ‘땅에 떨어지지 않을 것입니다’로 완전한 보호의 의미를 보존했습니다.
- source_word: רָעָה
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 악행
  - 죄악
  - 해
  lexicon: HALOT
  rationale: 이 문맥은 법정적·도덕적 판정의 성격이 강하므로, 특정 행위로 좁히지 않는 ‘악’이 원문 범위를 가장 잘 유지합니다.
- source_word: תִמָּצֵא ב֖וֹ
  english_pob_choice: is found in him
  chosen_korean: 그에게서 드러나면
  alternatives_korean:
  - 그 안에 발견되면
  - 그에게서 발견되면
  lexicon: HALOT
  rationale: 수동형의 ‘발견됨’은 한국어에서는 ‘드러나면’이 더 자연스럽고, 책임이 그에게 속함을 분명히 전달합니다.
theological_decisions:
- issue: 아도니야에 대한 조건적 판결의 법정적 뉘앙스
  chosen_reading: ‘그는 죽을 것입니다’로 결과를 단정적으로 옮겨, 왕의 선언이 단순 예측이 아니라 판결 선고임을 드러냈습니다.
  alternative_readings:
  - ‘그는 죽게 될 것입니다’
  - ‘그는 죽을 것입니다’
  rationale: 히브리어 וָמֵת는 조건 충족 시 뒤따를 사법적 결과를 말하므로, 한국어에서도 법정적 확정성을 살리는 편이 원문의 힘을 보존합니다.
  doctrine_reference: 왕권과 사법권의 결합, 잠언적/사법적 선언의 문맥
