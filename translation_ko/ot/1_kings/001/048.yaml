source:
  edition: WLC
  text: וְ/גַם כָּ֖כָה אָמַ֣ר הַ/מֶּ֑לֶךְ בָּר֨וּךְ יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נָתַ֥ן הַ/יּ֛וֹם יֹשֵׁ֥ב עַל כִּסְאִ֖/י וְ/עֵינַ֥/י רֹאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/048.yaml
  text: 'And the king also said thus: ‘Blessed be Yahweh[a], the God of Israel, who today has given one to sit on my throne, and my eyes see it.’'
  footnotes:
  - marker: a
    text: Or, 'who today has given one sitting on my throne, and my eyes are seeing.' The Hebrew leaves the object of 'see' unstated; English supplies 'it' from context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕도 이렇게 말했습니다. 「야훼, 이스라엘의 하나님은 찬송받으소서. 오늘 내 왕좌에 앉을 이를 주셨고, 내 눈이 그것을 봅니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘오늘 내 왕좌에 앉을 이를 주셨고, 내 눈이 보고 있습니다.’ 히브리어는 ‘보다’의 목적어를 생략합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּכָה
  english_pob_choice: And ... also ... thus
  chosen_korean: 그리고 ...도 ... 이렇게
  alternatives_korean:
  - 그리고 또한 이렇게
  - 또 왕이 이렇게도
  lexicon: HALOT
  rationale: 추가 보고를 여는 וְגַם의 누적 의미와 כָּכָה의 지시적 기능을 함께 살리기 위해, 한국어에서는 자연스러운 서술 연결인 ‘그리고’와 인용 도입부의 ‘이렇게’를 사용했습니다.
- source_word: בָּרוּךְ
  english_pob_choice: Blessed be
  chosen_korean: 찬송받으소서
  alternatives_korean:
  - 복되시기를
  - 복을 받으소서
  lexicon: HALOT
  rationale: 왕의 축복 선언은 단순 상태 진술보다 선포형 축복문이므로, 한국어에서도 하나님께 드리는 찬양·축복 어조를 살리는 ‘찬송받으소서’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문이 여호와 대체 титул이 아니라 신명기적 고유명 יְהוָה를 직접 사용하므로, 프로젝트 기본어인 ‘야훼’를 유지했습니다.
- source_word: יֹשֵׁב
  english_pob_choice: one to sit
  chosen_korean: 앉을 이
  alternatives_korean:
  - 앉는 사람
  - 앉게 된 사람
  lexicon: HALOT
  rationale: 분사 יֹשֵׁב는 특정 인물을 지시하기보다 왕좌에 앉도록 주어진 사람을 가리키므로, 자연스럽되 의미를 덜 덧붙이는 ‘앉을 이’로 처리했습니다.
- source_word: וְעֵינַי רֹאוֹת
  english_pob_choice: and my eyes see it
  chosen_korean: 내 눈이 그것을 봅니다
  alternatives_korean:
  - 내 눈으로 보고 있습니다
  - 내 눈이 보고 있습니다
  lexicon: HALOT
  rationale: 히브리어는 목적어를 생략하지만 문맥상 왕좌에 앉은 이를 가리키므로, 한국어에서는 이해를 돕기 위해 ‘그것을’ 보충하되 원문의 직접 목격 강조는 유지했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본절의 축복문은 하나님의 개인 이름을 직접 부르므로, 전통적 대체어보다 원문 고유명을 드러내는 표기를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
