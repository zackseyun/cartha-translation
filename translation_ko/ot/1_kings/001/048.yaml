  lexicon: HALOT
  rationale: 왕의 축복 선언은 단순 상태 진술보다 선포형 축복문이므로, 한국어에서도 하나님께 드리는 찬양·축복 어조를 살리는 ‘찬송받으소서’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
