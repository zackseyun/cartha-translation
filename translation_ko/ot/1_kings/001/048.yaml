  to: 그리고 왕도 이렇게 말했습니다. 「야훼[a], 이스라엘의 하나님께서는 찬송받으소서. 오늘 내 왕좌에 앉아 있는 이를 주셨고, 내 눈으로 보고 있습니다.」
