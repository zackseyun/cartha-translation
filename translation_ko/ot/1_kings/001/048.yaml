  verdict: revise
  source_fidelity: ‘앉을 이’는 히브리어 분사 יֹשֵׁב의 현재적·결과적 의미를 미래형으로 다소 좁힙니다. ‘앉아 있는 이’가 왕좌에 이미 앉게 된 인물을 더 충실히 나타냅니다. 또한 רֹאוֹת는 목적어를 명시하지 않으므로 한국어 본문에서도 목적어를 생략하는 편이 원문의 여백을 보존합니다.
  naturalness: ‘내 눈이 그것을 봅니다’는 직역투이고 ‘그것’의 지시 대상도 한국어에서 부자연스럽습니다. ‘내 눈으로 보고 있습니다’는 개인적 목격의 강조를 자연스럽게 전달합니다. 인용문 밖의 마침표도 제거하는 것이 한국어 인용부호 문장부호 관례에 맞습니다.
