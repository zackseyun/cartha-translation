base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/001.yaml
  text: Now King David was old[a], advanced in days; and they covered him with garments, but he could not get warm.
  footnotes:
  - marker: a
    text: Hebrew 'advanced in days,' an idiom meaning very old or well along in years.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗 왕은 늙어 나이가 매우 많았고, 사람들이 옷으로 그를 덮었지만 그는 따뜻해지지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  english_pob_choice: Now King David
  chosen_korean: 이제 다윗 왕
  alternatives_korean:
  - 그리고 다윗 왕
  - 다윗 왕
  lexicon: HALOT
  rationale: 문장 첫머리의 וְ는 단순 접속보다 장면 전환을 여는 표현이므로 ‘이제’로 옮기고, 왕호는 인명 뒤에 자연스럽게 배치했습니다.
- source_word: זָקֵן
  english_pob_choice: was old
  chosen_korean: 늙고
  alternatives_korean:
  - 나이가 많고
  - 연로하고
  lexicon: HALOT
  rationale: 노년을 직접적으로 말하는 동사적 형용사로, 한국어에서는 상태를 자연스럽게 드러내는 ‘늙고’가 가장 직역에 가깝습니다.
- source_word: בָּא בַּיָּמִים
  english_pob_choice: advanced in days
  chosen_korean: 나이가 많았는데
  alternatives_korean:
  - 연세가 많았는데
  - 세월이 많이 흘렀는데
  lexicon: HALOT
  rationale: ‘들어간 날들’이라는 관용구는 단순한 노쇠를 넘어 매우 고령임을 강조하므로, 현대 한국어에서 이해되는 관용적 표현으로 풀었습니다.
- source_word: וַיְכַסֻּהוּ בַּבְּגָדִים
  english_pob_choice: and they covered him with garments
  chosen_korean: 사람들이 그를 옷으로 덮어 주었으나
  alternatives_korean:
  - 그를 옷으로 덮었으나
  - 그를 옷으로 덮어 주었고
  lexicon: HALOT
  rationale: 주어가 분명하지 않은 복수형이므로 ‘사람들이’로 자연스럽게 처리했고, ‘옷’은 בְּגָדִים의 가장 პირდაპირ적인 대응입니다.
- source_word: וְלֹא יִחַם לוֹ
  english_pob_choice: he could not get warm
  chosen_korean: 그는 따뜻해지지 않았습니다
  alternatives_korean:
  - 그는 따뜻해질 수 없었습니다
  - 그에게 따뜻함이 오지 않았습니다
  lexicon: HALOT
  rationale: ‘불다/따뜻해지다’의 결과 상태를 한국어 현재완료식으로 자연스럽게 옮겨, 의복을 덮었음에도 온기가 오지 않았다는 뜻을 살렸습니다.
