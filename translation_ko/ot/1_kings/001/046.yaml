  yaml_path: translation/ot/1_kings/001/046.yaml
  text: And Solomon has also sat on the royal throne.
translation:
  language: ko
  text: 그리고 솔로몬도 왕의 보좌에 앉았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/גַם
  english_pob_choice: also
  chosen_korean: 그리고 …도
  alternatives_korean:
  - 또
  - 또한
  lexicon: וְ + גַם
  rationale: 접속과 첨가의 뉘앙스를 함께 살리기 위해 ‘그리고 …도’로 옮겨, 솔로몬이 다른 왕권 사실들과 더불어 언급된다는 점을 자연스럽게 드러냈습니다.
- source_word: יָשַׁב
  english_pob_choice: has sat
  chosen_korean: 앉았습니다
  alternatives_korean:
  - 앉아 있습니다
  - 앉았습니다
  lexicon: ישב
  rationale: 왕위 즉위의 완료된 결과를 한국어에서 자연스럽게 나타내기 위해 완료 시상으로 옮겼습니다.
- source_word: כִּסֵּא הַמְּלוּכָה
  english_pob_choice: the royal throne
  chosen_korean: 왕의 보좌
  alternatives_korean:
  - 왕좌
  - 왕의 왕좌
  - 왕의 왕위
  lexicon: כסא + מלוכה
  rationale: ‘royal throne’의 직역성을 유지하되, 한국어에서 ‘보좌’가 고정된 통치좌를 자연스럽게 가리키므로 채택했습니다.
theological_decisions:
- issue: 왕권의 성격을 어떻게 드러낼 것인가
  chosen_reading: 솔로몬이 단순히 어떤 자리보다 왕권의 정당한 통치좌에 앉았다는 의미를 분명히 했습니다.
  alternative_readings:
  - 솔로몬이 왕위에 올랐습니다
  - 솔로몬이 왕좌에 앉았습니다
  rationale: 히브리어 본문은 통치의 완료와 합법적 왕권의 확립을 말하므로, ‘보좌’로 번역해 왕권의 공식성을 보존했습니다.
  doctrine_reference: 열왕기상 1장 문맥의 왕위 계승 서술
