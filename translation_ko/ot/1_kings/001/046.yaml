  source_fidelity: 히브리어 וְגַם의 접속·첨가 의미를 ‘그리고 …도’로, יָשַׁב의 완료형을 ‘앉았습니다’로 충실히 반영했습니다. עַל כִּסֵּא הַמְּלוּכָה는 ‘왕의 보좌에’로 자연스럽게 옮겨져 왕권의 보좌라는 뜻을 전달합니다.
  naturalness: ‘그리고 솔로몬도 왕의 보좌에 앉았습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 앞 문맥에 이어지는 보고 문체에도 적절합니다.
  terminology: ‘솔로몬’과 ‘보좌’는 성경 번역 관행 및 본문의 왕위 계승 문맥에 알맞습니다. ‘왕의 보좌’는 영어 POB의 ‘royal throne’ 및 히브리어 ‘왕국의 보좌’가 가리키는 왕권의 보좌를 무리 없이 표현합니다.
