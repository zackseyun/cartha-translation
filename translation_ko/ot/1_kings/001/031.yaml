  source_fidelity: 히브리어의 두 동작(땅에 얼굴을 대고 몸을 굽힘, 왕 앞에 엎드려 절함)과 왕을 향한 축원은 대체로 반영되어 있습니다. 다만 ‘왕에게 엎드려 절하며’보다 ‘왕 앞에’가 경배 동작의 공간적·관계적 방향을 더 자연스럽고 정확하게 나타냅니다.
