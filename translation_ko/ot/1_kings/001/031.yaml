lexical_decisions:
- source_word: וַתִּקֹּד ... אַפַּיִם אֶרֶץ
  english_pob_choice: bowed with her face to the ground
  chosen_korean: 얼굴을 땅에 대고 몸을 굽혀
  alternatives_korean:
  - 땅에 이마를 대고
  - 얼굴을 땅에 대고
  lexicon: HALOT
  rationale: קָדַד와 ‘face/nostrils + earth’의 결합은 단순한 인사가 아니라 깊은 경배 동작을 가리키므로, 한국어에서는 ‘얼굴을 땅에 대고 몸을 굽혀’로 자세와 강도를 함께 살렸습니다.
- source_word: וַתִּשְׁתַּחוּ
  english_pob_choice: prostrated herself
  chosen_korean: 엎드려 절하며
  alternatives_korean:
  - 경배하며
  - 엎드렸습니다
  lexicon: HALOT
  rationale: שׁחה는 앞의 ‘몸을 굽혀’와 구별되는 더 강한 몸짓이므로, 단순한 ‘절하다’보다 ‘엎드려 절하다’가 문맥의 낮춤과 경배성을 더 분명히 드러냅니다.
- source_word: לַמֶּלֶךְ
  english_pob_choice: before the king
  chosen_korean: 왕에게
  alternatives_korean:
  - 왕 앞에
  - 왕에게 나아가
  lexicon: HALOT
  rationale: 절하는 동작의 도착 대상이므로 한국어에서는 자연스럽게 ‘왕에게’로 옮기되, 문장 전체가 이미 경배 장면임을 통해 ‘앞에’의 의미가 전달되도록 했습니다.
- source_word: יְחִי ... לְעֹלָם
  english_pob_choice: May ... live forever
  chosen_korean: 영원히 사십시오
  alternatives_korean:
  - 영원히 사시기를 바랍니다
  - 오래 사십시오
  lexicon: HALOT
  rationale: 히브리어 jussive의 축원/환호를 한국어에서는 존대 명령형 축원으로 옮기는 것이 가장 자연스러워 ‘영원히 사십시오’로 번역했습니다.
theological_decisions:
- issue: 왕에 대한 축원의 존대 표현
  chosen_reading: 밧세바의 발언은 다윗을 향한 궁정적 충성의 축원으로 보고, 한국어에서는 직접 존대형 ‘사십시오’를 사용했습니다.
  alternative_readings:
  - ‘살게 하소서’처럼 기원문으로 바꾸는 읽기
  - ‘오래 사시옵소서’ 같은 전통적 예식문체
  rationale: 본문은 예식적 환호에 가까운 왕실 언어이며, 현대 한국어 합쇼체로도 그 존중과 공적 분위기를 충분히 전달할 수 있습니다.
  doctrine_reference: 왕권/궁정 문맥의 화행 재현
