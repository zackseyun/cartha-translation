  yaml_path: translation/ot/1_kings/001/026.yaml
  text: But me—your servant—and Zadok the priest[a], and Benaiah son of Jehoiada, and Solomon your servant, he did not call.
  footnotes:
  - marker: a
    text: Or 'he did not call' or 'he has not summoned.' The Hebrew verb can denote calling, summoning, or inviting; 'invite' fits the immediate context of Adonijah's sacrificial feast.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 왕의 종인 저와 제사장 사독[a], 여호야다의 아들 브나야와 왕의 종 솔로몬은 부르지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 부르지 않았다’, ‘그가 아직 소집하지 않았다’. 히브리어 동사 קרא는 부르다, 소집하다, 초대하다를 뜻할 수 있으며, 바로 앞의 잔치 문맥에서는 ‘초대하다’가 의미상 잘 맞습니다.
    reason: lexical_alternative
