  text: וְ/לִ֣/י אֲנִֽי עַ֠בְדֶּ/ךָ וּ/לְ/צָדֹ֨ק הַ/כֹּהֵ֜ן וְ/לִ/בְנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע וְ/לִ/שְׁלֹמֹ֥ה עַבְדְּ/ךָ֖ לֹ֥א קָרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/026.yaml
  text: But me—your servant—and Zadok the priest[a], and Benaiah son of Jehoiada, and Solomon your servant, he did not call.
  footnotes:
  - marker: a
    text: Or 'he did not call' or 'he has not summoned.' The Hebrew verb can denote calling, summoning, or inviting; 'invite' fits the immediate context of Adonijah's sacrificial feast.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 저와 제사장 사독[a], 그리고 여호야다의 아들 브나야와 당신의 종 솔로몬은 부르지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 부르지 않았다’, ‘그가 아직 소집하지 않았다’. 히브리어 동사 קרא는 부르다, 소집하다, 초대하다를 뜻할 수 있으며, 바로 앞의 잔치 문맥에서는 ‘초대하다’가 의미상 잘 맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלִי אֲנִי עַבְדֶּךָ
  english_pob_choice: But me—your servant
  chosen_korean: 그런데 저와 … 당신의 종
  alternatives_korean:
  - 그리고 저와 … 당신의 종
  - 하지만 저는 … 당신의 종
  lexicon: HALOT
  rationale: וְלִי의 대비를 한국어의 반전 접속으로 살리고, אֲנִי עַבְדֶּךָ는 왕 앞의 겸양 표현으로 자연스럽게 옮겼습니다.
- source_word: צָדֹק הַכֹּהֵן
  english_pob_choice: Zadok the priest
  chosen_korean: 제사장 사독
  alternatives_korean:
  - 사독 제사장
  - 사독 그 제사장
  lexicon: HALOT
  rationale: 고유명사와 직함의 순서를 한국어 관용에 맞게 두되, 직분인 הַכֹּהֵן은 ‘제사장’으로 직접 드러냈습니다.
- source_word: בְנָיָהוּ בֶן יְהוֹיָדָע
  english_pob_choice: Benaiah son of Jehoiada
  chosen_korean: 여호야다의 아들 브나야
  alternatives_korean:
  - 브나야, 여호야다의 아들
  - 여호야다의 아들인 브나야
  lexicon: HALOT
  rationale: 히브리어 족보식 표현을 한국어의 소유격 구조로 옮겨 관계를 분명히 했습니다.
- source_word: לֹא קָרָא
  english_pob_choice: he did not call
  chosen_korean: 부르지 않았습니다
  alternatives_korean:
  - 초대하지 않았습니다
  - 호출하지 않았습니다
  - 부르지 않았습니다
  lexicon: HALOT
  rationale: 이 장면은 잔치 초청 문맥이어서 ‘부르다’가 가장 자연스럽고, ‘초대하다’보다 원어의 ‘부르다/소집하다’ 범위를 더 직접적으로 반영합니다.
