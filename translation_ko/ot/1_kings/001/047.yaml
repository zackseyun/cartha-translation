source:
  edition: WLC
  text: וְ/גַם בָּ֜אוּ עַבְדֵ֣י הַ/מֶּ֗לֶךְ לְ֠/בָרֵךְ אֶת אֲדֹנֵ֜י/נוּ הַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ יֵיטֵ֨ב אלהי/ך אֶת שֵׁ֤ם שְׁלֹמֹה֙ מִ/שְּׁמֶ֔/ךָ וִֽ/יגַדֵּ֥ל אֶת כִּסְא֖/וֹ מִ/כִּסְאֶ֑/ךָ וַ/יִּשְׁתַּ֥חוּ הַ/מֶּ֖לֶךְ עַל הַ/מִּשְׁכָּֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/047.yaml
  text: And the king’s servants also came to bless our lord King David[a], saying, ‘May your God make Solomon’s name better than your name[b], and may he make his throne greater than your throne.’ And the king bowed himself on the bed.
  footnotes:
  - marker: a
    text: Or, 'the king worshiped on the bed.' The Hebrew verb can mean either 'bowed himself' or 'worshiped,' depending on context.
    reason: alternative_reading
  - marker: b
    text: '''Name'' here carries the sense of reputation or renown.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 신하들도 와서 우리 주 다윗 왕을 축복하며 이렇게 말했습니다. “당신의 하나님께서 솔로몬의 이름[b]을 당신의 이름보다 더 낫게 하시고, 그의 왕좌를 당신의 왕좌보다 더 크게 하시기를 바랍니다.” 왕은 침상 위에서 몸을 굽혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문맥에 따라 ‘몸을 굽히다’ 또는 ‘경배하다’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘이름’은 여기서 평판이나 명성을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם / And ... also
  english_pob_choice: And ... also
  chosen_korean: -도 ... 와서
  alternatives_korean:
  - 또
  - 그리고 ... 또한
  lexicon: HALOT
  rationale: 추가 연결을 자연스럽게 살리면서도 앞선 사건과의 연속성을 유지하기 위해 ‘-도’와 ‘와서’를 함께 사용했습니다.
- source_word: עַבְדֵי הַמֶּלֶךְ
  english_pob_choice: the king’s servants
  chosen_korean: 왕의 신하들
  alternatives_korean:
  - 왕의 종들
  - 왕의 시종들
  lexicon: HALOT
  rationale: 궁정 맥락에서 עבד는 단순한 하인보다 왕을 보좌하는 궁정 인원을 가리킬 수 있어, 한국어로는 ‘신하들’이 더 자연스럽습니다.
- source_word: יֵיטֵב אֱלֹהֶיךָ / וִיגַדֵּל
  english_pob_choice: May your God make ... better ... and may he make ... greater
  chosen_korean: 당신의 하나님께서 ... 더 좋게 하시고 ... 더 크게 하시기를 바랍니다
  alternatives_korean:
  - 당신의 하나님께서 ... 좋게 하시고 ... 크게 하시기를 바랍니다
  - 당신의 하나님께서 ... 번성하게 하시고 ... 크게 하시기를 바랍니다
  lexicon: HALOT
  rationale: 히브리어의 사역적 축복 표현을 살리기 위해 ‘더 좋게 하시고 / 더 크게 하시기를 바랍니다’로 옮겼습니다.
- source_word: שֵׁם / name
  english_pob_choice: name
  chosen_korean: 이름
  alternatives_korean:
  - 명성
  - 평판
  lexicon: HALOT
  rationale: ‘이름’이 히브리어의 기본 이미지를 보존하지만, 문맥상 명예·평판의 뜻이 함께 있으므로 본문은 ‘이름’으로 두고 그 함의를 유지했습니다.
- source_word: וַיִּשְׁתַּחוּ
  english_pob_choice: the king bowed himself
  chosen_korean: 왕은 침상 위에서 몸을 굽혔습니다
  alternatives_korean:
  - 왕은 침상 위에서 경배했습니다
  - 왕은 침상 위에서 엎드렸습니다
  lexicon: HALOT
  rationale: 이 동사는 경배와 절하기를 모두 가질 수 있으나, 목적어가 명시되지 않으므로 몸의 동작을 드러내는 ‘몸을 굽혔습니다’로 번역했습니다.
theological_decisions:
- issue: וַיִּשְׁתַּחוּ의 의미를 경배로 명시할지 여부
  chosen_reading: 본문의 문법적 여지를 따라 ‘몸을 굽혔습니다’로 두었습니다.
  alternative_readings:
  - 경배했습니다
  - 엎드려 예배했습니다
  rationale: 이 장면은 다윗의 신체적 반응을 말하지만, 대상이 본문 안에서 분명히 지정되지는 않습니다. 따라서 예배로 단정하기보다 원문의 긴장을 유지했습니다.
  doctrine_reference: 본문이 허용하는 범위 내에서 의미를 과잉결정하지 않음.
