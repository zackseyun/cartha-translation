id: 1KI.1.45
reference: 1 Kings 1:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּמְשְׁח֣וּ אֹת֡/וֹ צָד֣וֹק הַ/כֹּהֵ֣ן וְ/נָתָן֩ הַ/נָּבִ֨יא לְ/מֶ֜לֶךְ בְּ/גִח֗וֹן וַ/יַּעֲל֤וּ מִ/שָּׁם֙ שְׂמֵחִ֔ים וַ/תֵּהֹ֖ם הַ/קִּרְיָ֑ה ה֥וּא הַ/קּ֖וֹל אֲשֶׁ֥ר שְׁמַעְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/045.yaml
  text: And Zadok the priest and Nathan the prophet have anointed him king at Gihon[a], and they have come up from there rejoicing, and the city is in an uproar. That is the sound that you heard.
  footnotes:
  - marker: a
    text: Or, 'the city resounded' or 'the city was stirred'; the Hebrew verb conveys noisy commotion.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장 사독과 예언자 나단이 기혼에서 그를 왕으로 기름부었습니다. 그들은 거기에서 기뻐하며 올라왔고, 성읍은 소란해졌습니다.[a] 그것이 여러분이 들은 소리입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성읍이 떠들썩해졌습니다’, ‘성읍이 동요했습니다’. 히브리어 동사는 시끄러운 소동이나 동요를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוֹק הַכֹּהֵן
  english_pob_choice: Zadok the priest
  chosen_korean: 사독 제사장
  alternatives_korean:
  - 사독 사제
  - 사독의 제사장
  lexicon: HALOT
  rationale: 고유명사는 음역하고, כהן은 문맥상 제사장으로 옮겼습니다. 한국 교회어의 친숙함보다 본문의 직함을 직접 드러내는 쪽을 택했습니다.
- source_word: וְנָתָן הַנָּבִיא
  english_pob_choice: Nathan the prophet
  chosen_korean: 나단 예언자
  alternatives_korean:
  - 나단 선지자
  - 예언자 나단
  lexicon: HALOT
  rationale: נביא는 ‘예언자’가 직역에 가깝고 현대 한국어에서도 이해가 자연스럽습니다. 전통적 ‘선지자’보다 중립적·서술적입니다.
- source_word: וַיִּמְשְׁחוּ אֹתוֹ לְמֶלֶךְ
  english_pob_choice: have anointed him king
  chosen_korean: 그를 왕으로 기름부었고
  alternatives_korean:
  - 그에게 왕으로 기름을 부었고
  - 그를 왕으로 성별했고
  lexicon: HALOT
  rationale: משח은 왕권 수여의 기름부음을 뜻하므로 ‘기름부다’를 유지했습니다. לְמֶלֶךְ는 결과 직분을 나타내므로 ‘왕으로’가 가장 직설적입니다.
- source_word: וַתֵּהֹם הַקִּרְיָה
  english_pob_choice: the city is in an uproar
  chosen_korean: 성읍이 소동에 휩싸였습니다
  alternatives_korean:
  - 성읍이 소란스러워졌습니다
  - 성읍이 떠들썩해졌습니다
  - 성읍이 소동을 일으켰습니다
  lexicon: HALOT
  rationale: הום은 단순한 ‘울림’보다 소란과 동요를 포함한 소요를 가리킵니다. ‘휩싸였습니다’는 그 혼란이 성읍 전체를 덮은 뉘앙스를 살립니다.
- source_word: הוּא הַקּוֹל אֲשֶׁר שְׁמַעְתֶּם
  english_pob_choice: That is the sound you heard
  chosen_korean: 그것이 당신들이 들은 소리입니다
  alternatives_korean:
  - 그 소리가 당신들이 들은 것입니다
  - 그것이 당신들이 들은 소음입니다
  lexicon: HALOT
  rationale: קוֹל은 ‘소리/음성/음향’ 범위가 넓지만 여기서는 설명적 재지시이므로 ‘소리’가 가장 중립적입니다. 영어 POB의 ‘that’에 맞춰 지시성을 살렸습니다.
theological_decisions:
- issue: 사독과 나단의 기름부음이 왕권의 정당성을 드러내는 방식
  chosen_reading: 제사장과 예언자가 함께 그를 왕으로 기름부었다는 점을 직설적으로 살려, 왕위 선포의 공적·예언적 정당성을 드러냈습니다.
  alternative_readings:
  - 의례적으로 왕위에 세웠다고 완화할 수 있음
  - ‘성별했다’로 더 일반화할 수 있음
  rationale: 본문은 단순한 관직 임명이 아니라 기름부음 행위를 통해 솔로몬의 왕권을 공적으로 승인하는 장면입니다. 따라서 의례성을 약화하지 않고 유지했습니다.
  doctrine_reference: 왕권/기름부음의 성경신학
