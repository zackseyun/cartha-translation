  source_fidelity: 원문의 접속사 וַ는 단순한 사건의 연속을 나타내는데, 초안의 ‘그러므로’는 앞 사건에서 성읍의 소동이 논리적으로 필연 발생했다는 인과를 추가합니다. 또한 וַתֵּהֹם הַקִּרְיָה는 성읍의 소음·동요를 말하며, 이를 ‘소란해졌습니다’로 옮기면 다음 절의 ‘소리’와도 자연스럽게 연결됩니다.
  naturalness: ‘제사장 사독과 예언자 나단’은 현대 표준 한국어에서 직함과 인명을 자연스럽게 결합합니다. ‘기뻐하며 올라왔습니다’와 ‘그것이 여러분이 들은 소리입니다’는 합쇼체의 격식 있고 자연스러운 표현입니다.
  terminology: ‘제사장’, ‘예언자’, ‘왕으로 기름부었습니다’, ‘기혼’은 원문의 직함·의례 행위·지명을 충실히 반영합니다. ‘여러분’은 복수 2인칭 שְׁמַעְתֶּם을 한국어에서 자연스럽게 드러냅니다.
