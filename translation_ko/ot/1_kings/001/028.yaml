translation:
  language: ko
  text: 그때 다윗 왕이 대답하여[a] 말했습니다. 「밧세바를 내게 불러오십시오.」 그러자 그녀가 왕 앞에 나아와 왕 앞에 섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 서술 관용구 ענה는 여기서 ‘대답하다’로 옮길 수 있으며, 직접 질문이 없더라도 발화 도입 공식으로 자주 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하여
  alternatives_korean:
  - 응답하여
  - 대답하고
  lexicon: HALOT
  rationale: 히브리어의 서술 관용구로서의 ענה를 살려, 단순한 발화 도입을 넘어 ‘대답하다’의 서술성을 유지했습니다.
- source_word: הַמֶּלֶךְ דָּוִד
  english_pob_choice: King David
  chosen_korean: 다윗 왕
  alternatives_korean:
