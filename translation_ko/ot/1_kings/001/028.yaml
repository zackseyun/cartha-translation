translation:
  language: ko
  text: 그때 다윗 왕이 대답하여 말했습니다. 「밧세바를 내게 불러오십시오.」 그러자 그녀가 왕 앞에 나아와 왕 앞에 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 서술 관용구 ענה는 여기서 ‘대답하다’로 옮길 수 있으며, 직접 질문이 없더라도 발화 도입 공식으로 자주 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하여
  alternatives_korean:
  - 응답하여
  - 대답하고
  lexicon: HALOT
  rationale: 히브리어의 서술 관용구로서의 ענה를 살려, 단순한 발화 도입을 넘어 ‘대답하다’의 서술성을 유지했습니다.
- source_word: הַמֶּלֶךְ דָּוִד
  english_pob_choice: King David
  chosen_korean: 다윗 왕
  alternatives_korean:
  - 다윗 왕이
  - 왕 다윗
  lexicon: HALOT
  rationale: 히브리어의 직함+고유명사 결합을 자연스러운 한국어로 옮겨, 인물 호칭을 앞세운 공적 문체를 유지했습니다.
- source_word: קִרְאוּ לִי
  english_pob_choice: Call ... to me
  chosen_korean: 밧세바를 내게 불러오십시오
  alternatives_korean:
  - 밧세바를 내게 부르십시오
  - 밧세바를 나에게 부르십시오
  lexicon: HALOT
  rationale: קרא + ל의 요청/소환 의미를 왕의 명령으로 자연스럽게 풀어, 단순 ‘부르다’보다 명령성을 분명히 했습니다.
- source_word: וַתָּבֹא לִפְנֵי הַמֶּלֶךְ וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  english_pob_choice: she came before the king and stood before the king
  chosen_korean: 그녀가 왕 앞에 나아와 왕 앞에 섰습니다
  alternatives_korean:
  - 그녀가 왕 앞에 와서 왕 앞에 섰습니다
  - 그녀가 왕 앞에 나아와 섰습니다
  lexicon: HALOT
  rationale: ‘앞에 나아오다/서다’의 이중 동작과 반복된 לפני를 살려, 궁정 장면의 공식성과 서술 리듬을 보존했습니다.
theological_decisions:
- issue: 왕의 명령 장면에서 직접화법의 문체 수준
  chosen_reading: 다윗의 말은 현대 한국어 공손 명령형으로 옮기되, 본문 내부의 왕권적 위계를 약화시키지 않았습니다.
  alternative_readings:
  - 평서형으로 완화
  - 더 고전적인 명령형으로 격상
  rationale: 히브리어 궁정 서술의 긴장감을 유지하면서도, 합쇼체 문체에서 자연스럽고 출판 가능한 직접화법을 확보했습니다.
  doctrine_reference: 서사 본문 번역의 문체 일관성과 원문 장면성 보존
