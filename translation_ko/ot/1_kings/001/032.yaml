language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֣לֶךְ דָּוִ֗ד קִרְאוּ לִ֞/י לְ/צָד֤וֹק הַ/כֹּהֵן֙ וּ/לְ/נָתָ֣ן הַ/נָּבִ֔יא וְ/לִ/בְנָיָ֖הוּ בֶּן יְהוֹיָדָ֑ע וַ/יָּבֹ֖אוּ לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/032.yaml
  text: Then King David said, “Call Zadok the priest, Nathan the prophet, and Benaiah son of Jehoiada to me.” And they came before the king.
translation:
  language: ko
  text: 그때 다윗 왕이 말했습니다. 「사독 제사장과 나단 예언자와 여호야다의 아들 브나야를 나에게 불러오십시오」라고 하였습니다. 그러자 그들이 왕 앞에 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ דָּוִד
  english_pob_choice: Then King David said
  chosen_korean: 그때 다윗 왕이 말했습니다
  alternatives_korean:
  - 그리고 다윗 왕이 말했습니다
  - 그러자 다윗 왕이 말했습니다
  lexicon: HALOT
  rationale: 와ו-연속의 서술 진행을 한국어에서는 자연스러운 시간 부사구로 옮기되, 왕의 신분을 유지하여 본문의 서사 흐름을 살렸습니다.
- source_word: קִרְאוּ לִי
  english_pob_choice: Call ... to me
  chosen_korean: 나에게 불러오십시오
  alternatives_korean:
  - 나에게 부르십시오
  - 나를 불러오십시오
  lexicon: HALOT
  rationale: 단순히 '부르다'보다, 이 문맥의 명령은 사람들을 왕 앞에 오게 하는 뜻이므로 도착 방향을 드러내는 '불러오십시오'로 옮겼습니다.
- source_word: הַכֹּהֵן / הַנָּבִיא
  english_pob_choice: the priest / the prophet
  chosen_korean: 제사장 / 예언자
  alternatives_korean:
  - 사제 / 선지자
  - 제사장 / 선지자
  lexicon: HALOT
  rationale: הַכֹּהֵן은 제사장으로, הַנָּבִיא는 예언자로 옮겨 각각의 직분을 표준적이면서도 본문에 충실하게 드러냈습니다.
- source_word: וְלִבְנָיָהוּ בֶּן יְהוֹיָדָע
  english_pob_choice: and Benaiah son of Jehoiada
  chosen_korean: 여호야다의 아들 브나야
  alternatives_korean:
  - 브나야, 여호야다의 아들
  - 여호야다의 아들 베나야
  lexicon: HALOT
  rationale: בן은 친족 관계를 나타내는 표준적 구성으로 '의 아들'을 택했고, 인명은 한국어 성경에서 통용되는 형태를 사용했습니다.
- source_word: לִפְנֵי הַמֶּלֶךְ
  english_pob_choice: before the king
  chosen_korean: 왕 앞에
  alternatives_korean:
  - 왕의 앞에
  - 왕의 면전에서
  lexicon: HALOT
  rationale: לִפְנֵי의 공간적·관계적 의미를 한국어 관용인 '앞에'로 간결하게 살려, 왕의 면전으로 나아온 장면을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 직분 명칭의 현대 한국어 선택
  chosen_reading: כֹּהֵן과 נָבִיא를 각각 제사장과 예언자로 옮겼습니다.
  alternative_readings:
  - 사제와 선지자
  - 제사장과 선지자
  rationale: 본문의 직분 구분을 유지하면서도, 현대 한국어에서 널리 이해되며 번역 전통상 과도하게 교회화되지 않는 표현을 선택했습니다.
  doctrine_reference: 본문 서술의 직분 명시
- issue: 왕의 명령형을 한국어 높임말로 처리
  chosen_reading: 공적 명령 상황에 맞추어 '-십시오'를 사용했습니다.
  alternative_readings:
  - -오십시오
  - -하시오
  rationale: 다윗이 신하들에게 내리는 왕의 명령이므로, 현대 합쇼체의 공적 명령으로 자연스럽게 전달했습니다.
  doctrine_reference: 서사체의 화자-청자 관계
