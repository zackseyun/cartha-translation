base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/038.yaml
  text: So Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites went down and had Solomon ride on King David’s mule[c][b], and they brought him to Gihon.
  footnotes:
  - marker: a
    text: Or possibly 'the royal guard' for 'the Cherethites and the Pelethites'; the Hebrew uses the group names themselves.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the mule of King David.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew noun for 'mule' is grammatically feminine and may denote a female mule.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장 사독, 예언자 나단, 여호야다의 아들 브나야, 그렛 사람들과 블렛 사람들[a]이 내려가 솔로몬을 다윗 왕의 노새[c][b]에 태우고 그를 기혼으로 데려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그렛 사람들과 블렛 사람들’은 히브리어의 집단명 자체를 옮긴 것입니다. 이들이 기능상 왕실 경호대였을 가능성도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘다윗 왕의 노새’를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 ‘노새’는 문법상 여성형이며 암노새를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  english_pob_choice: went down
  chosen_korean: 내려가서
  alternatives_korean:
