  text: וַ/יֵּ֣רֶד צָד֣וֹק הַ֠/כֹּהֵן וְ/נָתָ֨ן הַ/נָּבִ֜יא וּ/בְנָיָ֣הוּ בֶן יְהוֹיָדָ֗ע וְ/הַ/כְּרֵתִי֙ וְ/הַ/פְּלֵתִ֔י וַ/יַּרְכִּ֨בוּ֙ אֶת שְׁלֹמֹ֔ה עַל פִּרְדַּ֖ת הַ/מֶּ֣לֶךְ דָּוִ֑ד וַ/יֹּלִ֥כוּ אֹת֖/וֹ עַל גִּחֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/038.yaml
  text: So Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites went down and had Solomon ride on King David’s mule[c][b], and they brought him to Gihon.
  footnotes:
  - marker: a
    text: Or possibly 'the royal guard' for 'the Cherethites and the Pelethites'; the Hebrew uses the group names themselves.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the mule of King David.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew noun for 'mule' is grammatically feminine and may denote a female mule.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 제사장 사독과 예언자 나단과 여호야다의 아들 브나야와 크레 사람들과 블레셋 사람들[a]은 내려가서 솔로몬을 다윗 왕의 노새[c][b]에 태우고, 그를 기혼으로 데려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘크레 사람들과 블레셋 사람들’은 히브리어의 집단명 자체를 옮긴 것으로, 기능상 왕실 경호대일 가능성도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘다윗 왕의 노새’를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 ‘노새’는 문법상 여성형이며 암노새를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  english_pob_choice: went down
  chosen_korean: 내려가서
  alternatives_korean:
  - 갔습니다
  - 내려왔습니다
  lexicon: HALOT
  rationale: ירד의 기본 의미인 ‘내려가다’를 살려 행렬이 높은 곳에서 낮은 곳으로 이동하는 장면을 자연스럽게 드러냅니다.
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 사제
  - 성직자
  lexicon: HALOT
  rationale: כֹּהֵן의 표준 대응으로, 사독의 직분을 간결하게 밝힙니다.
- source_word: הַנָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 예언자 나단
  lexicon: HALOT
  rationale: נָבִיא는 현대 한국어에서 ‘예언자’가 직접적이며, 본문상 나단의 직분을 분명히 합니다.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  english_pob_choice: the Cherethites and the Pelethites
  chosen_korean: 크레 사람들과 블레셋 사람들
  alternatives_korean:
  - 케렛 사람들과 펠렛 사람들
  - 왕실 경호대
  lexicon: HALOT
  rationale: 이 명칭들은 인명/집단명으로 남기기보다 한국어 음역을 택하는 것이 일반적이지만, 본문은 POB의 주석처럼 정확한 신원보다 집단명을 전면에 둡니다. ‘왕실 경호대’는 기능 해석이어서 본문에서 피했습니다.
- source_word: פִּרְדַּת הַמֶּלֶךְ דָּוִד
  english_pob_choice: King David’s mule
  chosen_korean: 다윗 왕의 노새
  alternatives_korean:
  - 다윗 왕의 암노새
  - 다윗 왕의 노새
  lexicon: HALOT
  rationale: פִּרְדָּה는 문법상 여성형으로 ‘암노새’가 가능하지만, 한국어 본문에서는 POB처럼 성별보다 왕의 의례용 탈것이라는 점을 살려 ‘노새’로 옮겼습니다.
theological_decisions:
- issue: 왕위 계승 의례에서 솔로몬을 다윗의 짐승에 태우는 장면의 표현
  chosen_reading: ‘태우고, 그를 기혼으로 데려갔습니다’로 의례적 승격과 이동을 함께 드러냈습니다.
  alternative_readings:
  - ‘태워서 기혼으로 보냈습니다’
  - ‘기혼으로 인도했습니다’
  rationale: 히브리어의 사역형과 행렬 맥락을 함께 반영해, 단순 이동이 아니라 공적 승인 행위임을 드러냅니다.
  doctrine_reference: 왕권 서사와 기름부음 전 단계의 공적 절차
