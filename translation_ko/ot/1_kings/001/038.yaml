  rationale: כֹּהֵן의 표준 대응으로, 사독의 직분을 간결하게 밝힙니다.
- source_word: הַנָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 예언자 나단
  lexicon: HALOT
  rationale: נָבִיא는 현대 한국어에서 ‘예언자’가 직접적이며, 본문상 나단의 직분을 분명히 합니다.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  english_pob_choice: the Cherethites and the Pelethites
  chosen_korean: 크레 사람들과 블레셋 사람들
  alternatives_korean:
  - 케렛 사람들과 펠렛 사람들
  - 왕실 경호대
  lexicon: HALOT
  rationale: 이 명칭들은 인명/집단명으로 남기기보다 한국어 음역을 택하는 것이 일반적이지만, 본문은 POB의 주석처럼 정확한 신원보다 집단명을 전면에 둡니다. ‘왕실 경호대’는 기능 해석이어서 본문에서 피했습니다.
- source_word: פִּרְדַּת הַמֶּלֶךְ דָּוִד
  english_pob_choice: King David’s mule
  chosen_korean: 다윗 왕의 노새
  alternatives_korean:
  - 다윗 왕의 암노새
  - 다윗 왕의 노새
  lexicon: HALOT
  rationale: פִּרְדָּה는 문법상 여성형으로 ‘암노새’가 가능하지만, 한국어 본문에서는 POB처럼 성별보다 왕의 의례용 탈것이라는 점을 살려 ‘노새’로 옮겼습니다.
theological_decisions:
- issue: 왕위 계승 의례에서 솔로몬을 다윗의 짐승에 태우는 장면의 표현
  chosen_reading: ‘태우고, 그를 기혼으로 데려갔습니다’로 의례적 승격과 이동을 함께 드러냈습니다.
  alternative_readings:
  - ‘태워서 기혼으로 보냈습니다’
  - ‘기혼으로 인도했습니다’
  rationale: 히브리어의 사역형과 행렬 맥락을 함께 반영해, 단순 이동이 아니라 공적 승인 행위임을 드러냅니다.
  doctrine_reference: 왕권 서사와 기름부음 전 단계의 공적 절차
