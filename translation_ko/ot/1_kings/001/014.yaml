source:
  edition: WLC
  text: הִנֵּ֗ה עוֹדָ֛/ךְ מְדַבֶּ֥רֶת שָׁ֖ם עִם הַ/מֶּ֑לֶךְ וַ/אֲנִי֙ אָב֣וֹא אַחֲרַ֔יִ/ךְ וּ/מִלֵּאתִ֖י אֶת דְּבָרָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/014.yaml
  text: Look[a], while you are still speaking there with the king, I will come in after you and confirm your words.
  footnotes:
  - marker: a
    text: Or 'complete your words' or 'fill out what you say'; the Hebrew idiom can mean to add confirming detail to another's statement.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 당신이 아직 그곳에서 왕과 이야기하고 있는 동안에 나는 당신 뒤에 들어가서 당신의 말을 확증하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘확증하겠습니다’는 히브리어 관용구 ‘당신의 말을 채우다’의 의미를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 지시어로, 현대 한국어에서 자연스럽고 즉각적인 호응을 주는 형식으로 옮겼습니다.
- source_word: עוֹדָךְ מְדַבֶּרֶת
  english_pob_choice: while you are still speaking
  chosen_korean: 당신이 아직 그곳에서 왕과 이야기하고 있는 동안에
  alternatives_korean:
  - 당신이 아직 왕에게 말하고 있는 동안에
  - 당신이 아직 왕과 말하는 동안에
  lexicon: HALOT
  rationale: 진행 중인 여성 단수 현재분사의 시간적 중첩을 살리면서, 한국어에서는 ‘~하고 있는 동안에’로 자연스럽게 풀었습니다.
- source_word: וַאֲנִי אָבוֹא אַחֲרַיִךְ
  english_pob_choice: I will come in after you
  chosen_korean: 나는 당신 뒤에 들어가서
  alternatives_korean:
  - 나는 당신 뒤에 가서
  - 나는 당신 뒤에 들어가겠습니다
  lexicon: HALOT
  rationale: 궁정 맥락의 ‘오다’는 왕의 앞자리에 들어가는 동작을 포함하므로, 단순한 이동보다 ‘들어가다’가 원문에 더 가깝습니다.
- source_word: וּמִלֵּאתִי אֶת דְּבָרָיִךְ
  english_pob_choice: confirm your words
  chosen_korean: 당신의 말을 확증하겠습니다
  alternatives_korean:
  - 당신의 말을 채우겠습니다
  - 당신이 한 말을 완성하겠습니다
  - 당신의 말을 보충하겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 다른 사람의 말을 보완해 사실성을 더하는 뜻이므로, ‘확증하다’가 기능적 의미를 가장 잘 드러냅니다.
theological_decisions:
- issue: 예언적 도움의 성격
  chosen_reading: 나단이 밧세바의 진술에 뒤이어 들어가 왕 앞에서 그 말을 확증하는 장면으로 읽었습니다.
  alternative_readings:
  - 단순히 같은 내용을 반복하는 장면으로 읽기
  - 법정적 증언처럼 형식적인 진술로만 읽기
  rationale: 문맥상 핵심은 말의 반복이 아니라 왕 앞에서 앞선 진술을 뒷받침하는 보강 행위입니다.
  doctrine_reference: 서사 문맥 해석
- issue: 직접화법의 존칭
  chosen_reading: 밧세바에게 하는 말로 보고 현대 합쇼체를 유지했습니다.
  alternative_readings:
  - 명령조로 낮추어 번역하기
  - 성경식 고어체로 옮기기
  rationale: 서사의 전달력을 유지하면서도 원문의 긴박한 지시성을 살리기 위해 합쇼체를 적용했습니다.
  doctrine_reference: 번역 문체 원칙
