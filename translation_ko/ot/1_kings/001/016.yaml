base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/016.yaml
  text: Bathsheba bowed down and prostrated herself before the king[a], and the king said, “What do you want?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''What is it to you?'' An idiom meaning ''What do you want?'' or ''What troubles you?'''
    reason: lexical_alternative
translation:
  language: ko
  text: 밧세바가 왕 앞에 몸을 굽혀 엎드리자, 왕이 말했습니다. “무엇을 원하십니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘무엇이 당신에게 있습니까?’이며, 문맥상 ‘무엇을 원하십니까?’ 또는 ‘무엇이 문제입니까?’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקֹּד
  english_pob_choice: bowed down
  chosen_korean: 몸을 굽혀
  alternatives_korean:
  - 몸을 숙여
  - 절하며
  lexicon: HALOT
  rationale: קָדַד의 기본 동작은 깊이 몸을 굽히는 것이므로, 과도하게 특정화하지 않고 자연스러운 한국어로 옮겼습니다.
- source_word: וַתִּשְׁתַּחוּ
  english_pob_choice: prostrated herself
  chosen_korean: 엎드리자
  alternatives_korean:
  - 절하자
  - 몸을 낮추자
  lexicon: HALOT
  rationale: 뒤의 동사는 앞의 ‘몸을 굽히다’보다 강한 경배·복종의 동작을 나타내므로, 그 차이를 살려 ‘엎드리다’로 옮겼습니다.
- source_word: לַמֶּלֶךְ
  english_pob_choice: before the king
  chosen_korean: 왕 앞에
  alternatives_korean:
  - 왕에게
  - 왕에게로
  lexicon: HALOT
  rationale: 몸짓의 방향을 말하는 전치사 ל를 한국어에서는 경배의 장면에 자연스러운 ‘왕 앞에’로 풀어, 단순한 목적어 관계로 약화하지 않았습니다.
- source_word: מַה לָּךְ
  english_pob_choice: What do you want?
  chosen_korean: 무엇을 원하십니까?
  alternatives_korean:
  - 무슨 일입니까?
  - 무엇이 문제입니까?
  - 무엇이 필요하십니까?
  lexicon: HALOT
  rationale: 직역하면 ‘무엇이 당신에게 있습니까?’라는 관용구이므로, 왕의 공손한 질문으로서 한국어에서는 ‘무엇을 원하십니까?’가 가장 자연스럽습니다.
