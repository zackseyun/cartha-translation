id: 1KI.1.12
reference: 1 Kings 1:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֕ה לְכִ֛י אִיעָצֵ֥/ךְ נָ֖א עֵצָ֑ה וּ/מַלְּטִי֙ אֶת נַפְשֵׁ֔/ךְ וְ/אֶת נֶ֥פֶשׁ בְּנֵ֖/ךְ שְׁלֹמֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/012.yaml
  text: Now come[a], please let me advise you[c][b], and save your life and the life of your son Solomon.
  footnotes:
  - marker: a
    text: Hebrew 'go'; rendered 'come' because the expression functions idiomatically here as an urgent summons in direct speech.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'advise you counsel,' a cognate construction meaning 'give you advice' or 'counsel you.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'save your נפשׁ'; here נפשׁ means 'life' rather than 'soul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 오십시오[a]. 제가 당신에게[b] 한 가지 조언을 드리겠습니다. 당신의 목숨과 당신의 아들 솔로몬의 목숨을 구하십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 뜻은 본래 ‘가다’이지만, 여기서는 다급한 직접화법의 관용적 요청이므로 한국어로는 ‘오십시오’가 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘권하다/조언하다’와 관련 명사 ‘조언’을 함께 쓰는 강조적 구성입니다. 한국어는 이를 그대로 중복하기보다 ‘조언을 드리겠습니다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 נֶפֶשׁ는 여기서 ‘영혼’이 아니라 ‘목숨, 생명’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 급한 전환을 알리는 담화 표지로서 자연스러운 한국어는 ‘이제’입니다.
- source_word: לְכִי
  english_pob_choice: come
  chosen_korean: 오십시오
  alternatives_korean:
  - 가십시오
  - 와 보십시오
  lexicon: HALOT
  rationale: 직접 호소에서 문맥상 단순 이동 명령보다 긴급한 초청/재촉의 힘이 강하므로, 한국어에서는 ‘오십시오’가 가장 자연스럽습니다.
- source_word: אִיעָצֵךְ נָא עֵצָה
  english_pob_choice: please let me advise you
  chosen_korean: 제가 당신에게 한 가지 조언을 드리겠습니다
  alternatives_korean:
  - 제가 당신에게 조언하겠습니다
  - 제가 당신에게 충고해 드리겠습니다
  lexicon: HALOT
  rationale: 동사-명사 어근 반복이 있는 강조 표현이지만 한국어는 이를 그대로 반복하기보다 ‘조언을 드리겠습니다’로 힘을 살리는 편이 자연스럽습니다.
- source_word: נַפְשֵׁךְ / נֶפֶשׁ
  english_pob_choice: your life / the life of your son Solomon
  chosen_korean: 당신의 목숨 / 당신의 아들 솔로몬의 목숨
  alternatives_korean:
  - 당신의 생명 / 당신의 아들 솔로몬의 생명
  - 당신의 삶 / 당신의 아들 솔로몬의 삶
  lexicon: HALOT
  rationale: 여기서 נֶפֶשׁ는 추상적 ‘영혼’이 아니라 위협받는 생존을 가리키므로, 문맥상 가장 직접적인 ‘목숨’이 적절합니다.
