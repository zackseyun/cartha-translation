revisions:
- from: 여호와께서 내 주 왕과 함께하신 것 같이, 솔로몬과도 함께하시고, 그의 왕좌를 내 주 다윗 왕의 왕좌보다 더 크게 하시기를 바랍니다.[a]
  to: 야훼께서 내 주이신 왕과 함께 계셨던 것처럼, 야훼께서 솔로몬과도 함께 계시고 그의 왕좌를 내 주이신 다윗 왕의 왕좌보다 더 크게 하시기를 빕니다.[a]
  rationale: 하나님의 이름을 POB의 ‘Yahweh’ 선택에 상응하는 ‘야훼’로 통일했습니다. 생략된 주어를 두 번째 절에서 명시하여 한국어 문장의 자연스러움과 원문의 지시 관계를 함께 보존했으며, 비교와 소망의 의미는 변경하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:45:00Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 비교구문(‘…하셨던 것처럼 …하시기를’), 두 소망형 동사, 왕좌의 비교를 모두 보존했습니다. 뒤 절의 생략된 주어는 앞 절의 יהוה를 가리키므로 한국어 본문에서 ‘야훼께서’를 보충한 것은 의미를 명료하게 하면서 원문의 지시를 충실히 반영합니다.
  naturalness: 초안의 ‘내 주 왕’은 현대 표준 한국어에서 다소 부자연스럽고, ‘함께하시고’도 신적 임재를 표현할 때 ‘함께 계시고’보다 덜 자연스럽습니다. ‘내 주이신 왕’, ‘함께 계시고’, ‘하시기를 빕니다’로 다듬으면 현대적 합쇼체와 궁정 발화의 경건한 소망 표현이 자연스럽습니다.
  terminology: POB 원문-영어 감사 기록이 יהוה를 ‘Yahweh’로 일관되게 전사하므로, 한국어도 ‘야훼’로 옮기는 것이 명칭 정책 및 원어 충실성에 맞습니다. ‘왕좌’는 כִּסֵּא의 구체적 비유를 유지하며, ‘더 크게’는 히필 גדל과 מן 비교를 적절히 반영합니다.
  issues:
