base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/037.yaml
  text: Just as Yahweh has been with my lord the king[a], so may he be with Solomon and make his throne greater than the throne of my lord King David.
  footnotes:
  - marker: a
    text: Or 'so may the LORD be with Solomon.' The Hebrew jussive 'may he be' leaves the subject implicit, referring back to the LORD in the previous clause.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 내 주 왕과 함께하신 것 같이, 솔로몬과도 함께하시고, 그의 왕좌를 내 주 다윗 왕의 왕좌보다 더 크게 하시기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘יהי’는 주어를 생략한 소망형으로, 앞절의 ‘여호와’를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: 표준 한국어 성경 용례
  rationale: 이 구절은 하나님의 이름을 가리키지만, 한국어 본문에서는 독자가 즉시 인식하는 ‘여호와’를 사용했습니다. 다만 POB의 원칙상 학술 전사인 ‘야훼’가 원칙임을 감안해 대안으로 남깁니다.
- source_word: כַּאֲשֶׁר ... כֵּן
  english_pob_choice: Just as ... so
  chosen_korean: '...것 같이, ...'
  alternatives_korean:
  - '...한 것처럼, ...'
  - '...같이, ...'
  lexicon: HALOT
  rationale: 비교·대응 구조를 한국어에서 자연스러운 상관 표현으로 옮겨, 앞절의 여호와의 임재와 뒤절의 소망이 서로 대응됨을 살렸습니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: 내 주 왕
  alternatives_korean:
  - 내 주님 왕
  - 내 주, 왕
  lexicon: HALOT
  rationale: 궁정식 호칭의 공손함을 유지하되 한국어에서는 ‘내 주 왕’이 가장 간결하고 자연스럽습니다.
- source_word: וִיגַדֵּל אֶת כִּסְאֹו
  english_pob_choice: and make his throne greater
  chosen_korean: 그의 왕좌를 ... 더 크게 하시고
  alternatives_korean:
  - 그의 왕좌를 ... 더 크시게 하시고
  - 그의 왕좌를 ... 높이시고
  lexicon: HALOT
  rationale: 동사 גדל의 사역적 의미를 살려 ‘더 크게 하시다’로 옮겼고, 구체적 이미지인 ‘왕좌’를 유지했습니다.
- source_word: מִכִּסֵּא אֲדֹנִי הַמֶּלֶךְ דָּוִד
  english_pob_choice: than the throne of my lord King David
  chosen_korean: 내 주 다윗 왕의 왕좌보다
  alternatives_korean:
  - 내 주 다윗 왕의 왕좌보다도
  - 내 주 왕 다윗의 왕좌보다
  lexicon: HALOT
  rationale: 비교격 מן의 의미를 한국어 비교 조사 ‘-보다’로 정확히 반영했고, 관용적 호칭인 ‘다윗 왕’을 유지했습니다.
theological_decisions:
- issue: 야훼의 임재를 청원하는 종속절의 주어 처리
  chosen_reading: ‘여호와께서 ... 함께하신 것 같이’와 ‘... 함께하시고’로 앞절의 주어를 유지해 읽습니다.
  alternative_readings:
  - ‘여호와께서 ... 함께하신 것처럼, 주께서 솔로몬과 함께하시고’
  - ‘... 여호와께서 솔로몬과 함께하시기를’
  rationale: 히브리어는 뒤의 יהי에서 주어가 생략되어 앞절의 여호와를 가리키므로, 한국어에서도 같은 주어를 이어 주어 문맥의 연결을 분명히 했습니다.
  doctrine_reference: 문맥상 지시어 해석(ellipsis)
