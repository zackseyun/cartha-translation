  - severity: low
    issue: 궁정 호칭 및 임재 표현의 자연스러움
    rationale: ‘내 주 왕’보다 ‘내 주이신 왕’이 현대 표준어 문장 안에서 자연스럽습니다. 또한 ‘함께 계시다’는 하나님이 누구와 함께하심을 표현하는 통상적이고 자연스러운 표현입니다.
  revised_text: 야훼께서 내 주이신 왕과 함께 계셨던 것처럼, 야훼께서 솔로몬과도 함께 계시고 그의 왕좌를 내 주이신 다윗 왕의 왕좌보다 더 크게 하시기를 빕니다.[a]
