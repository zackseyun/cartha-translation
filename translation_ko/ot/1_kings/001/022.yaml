  source_fidelity: 히브리어의 וְהִנֵּה, 여성 단수 주어가 շարունակ해서 말하고 있음을 나타내는 עוֹדֶנָּה מְדַבֶּרֶת, 왕과의 대화 상대, 그리고 나단의 도착은 모두 반영되어 있습니다. 다만 ‘이야기하다’는 왕 앞의 장면에 다소 일상적이며, 보다 격식 있는 표현이 적절합니다.
  naturalness: ‘보십시오’는 현대 합쇼체 안에서 주의 환기 표지로 사용할 수 있습니다. 그러나 ‘그녀가 … 이야기하고 있을 때에’는 성경 서사 문체와 궁정 장면에 비해 다소 번역투·구어적입니다. ‘왕과 말씀을 나누고 있을 때’가 더 자연스럽고 격식에 맞습니다.
