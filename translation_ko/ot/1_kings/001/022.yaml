  rationale: 새 장면의 급작스러운 전환을 알리는 담화 표지로 보아, 문어체이면서도 주의를 환기하는 ‘보십시오’로 옮겼습니다.
- source_word: עוֹדֶנָּה מְדַבֶּרֶת
  english_pob_choice: while she was still speaking
  chosen_korean: 아직 … 이야기하고 있을 때에
