  - 단순 연결어 ‘그리고’
  - 약하게 ‘자, 보라’로 처리
  rationale: 이 표현은 사건의 급작스러운 전개를 독자에게 강조하는 기능이므로, 이야기 흐름을 살리면서도 긴박감을 유지하는 번역이 적절합니다.
  doctrine_reference: 서사 담화 표지의 기능 보존
