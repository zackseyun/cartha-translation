  - 여전히 … 이야기하는 동안
  - 계속 … 말하는 중에
  lexicon: HALOT
  rationale: 여성 주어가 발화를 지속 중임을 드러내기 위해 ‘아직 … 하고 있을 때에’ 구조를 사용해 시간의 중첩을 분명히 했습니다.
- source_word: בָּא
