- from: 아도니야와 그와 함께한 모든 초대받은 사람들이 식사를 마칠 때 그 소식을 들었습니다[a]. 요압이 나팔 소리를 듣고는 말했습니다. “어찌하여 성읍의 소리가 소동을 일으킵니까?”
