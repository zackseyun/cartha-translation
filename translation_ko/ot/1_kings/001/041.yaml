source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע אֲדֹנִיָּ֗הוּ וְ/כָל הַ/קְּרֻאִים֙ אֲשֶׁ֣ר אִתּ֔/וֹ וְ/הֵ֖ם כִּלּ֣וּ לֶ/אֱכֹ֑ל וַ/יִּשְׁמַ֤ע יוֹאָב֙ אֶת ק֣וֹל הַ/שּׁוֹפָ֔ר וַ/יֹּ֕אמֶר מַדּ֥וּעַ קֽוֹל הַ/קִּרְיָ֖ה הוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/041.yaml
  text: Adonijah and all the invited guests who were with him heard it as they finished eating[a]. And when Joab heard the sound of the trumpet, he said[b], “Why is the sound of the city in an uproar?”
  footnotes:
  - marker: a
    text: Or “as soon as they had finished eating.” The Hebrew clause may be understood as marking either the completion of the meal or the moment they were just finishing it.
    reason: lexical_alternative
  - marker: b
    text: Hebrew shofar, a horn trumpet used for public signaling.
    reason: cultural_note
translation:
  language: ko
  text: 아도니야와 그와 함께한 모든 초대받은 사람들이 식사를 마칠 때 그 소식을 들었습니다[a]. 요압이 나팔 소리를 듣고는 말했습니다. “어찌하여 성읍의 소리가 소동을 일으킵니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “식사를 막 끝냈을 때.” 히브리어 절은 식사가 막 끝난 순간일 수도, 끝마치던 바로 그때일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַקְּרֻאִים
  english_pob_choice: the invited guests
  chosen_korean: 초대받은 사람들
  alternatives_korean:
  - 초대된 손님들
  - 초대받은 손님들
  lexicon: HALOT
  rationale: 수동분사로서 ‘부름/초대받음’의 뜻을 살려 자연스러운 현대 한국어로 옮겼습니다. ‘손님들’도 가능하지만, 원문의 초점은 신분보다 초대받은 상태에 있습니다.
- source_word: וְהֵם כִּלּוּ לֶאֱכֹל
  english_pob_choice: as they finished eating
  chosen_korean: 식사를 마칠 때
  alternatives_korean:
  - 식사를 마쳤을 때
  - 식사를 거의 마칠 무렵
  lexicon: HALOT
  rationale: 문맥상 듣는 시점과 식사 종료가 겹치는 시간 표현이므로, ‘마칠 때’로 완료 직전의 순간을 살렸습니다.
- source_word: קוֹל הַשּׁוֹפָר
  english_pob_choice: the sound of the trumpet
  chosen_korean: 나팔 소리
  alternatives_korean:
  - 뿔나팔 소리
  - 쇼파르 소리
  lexicon: HALOT
  rationale: שׁוֹפָר는 공적 신호용 나팔/뿔나팔을 가리키므로, 현대 독자에게 즉시 이해되는 ‘나팔 소리’로 옮겼습니다. 용어를 음역하기보다 기능을 드러냈습니다.
- source_word: קוֹל הַקִּרְיָה הוֹמָה
  english_pob_choice: the sound of the city in an uproar
  chosen_korean: 성읍의 소리가 소동을 일으킵니까
  alternatives_korean:
  - 성읍의 소리가 떠들썩합니까
  - 성읍이 소란스럽습니까
  lexicon: HALOT
  rationale: 원문은 ‘성읍의 소리’와 ‘요란하게 울림/소란함’을 병치하므로, ‘소동을 일으키다’로 공적 소란의 뉘앙스를 살렸습니다. ‘성읍이…’로 주어를 바꾸면 히브리어 구조가 약해집니다.
