  verdict: revise
  source_fidelity: ‘그 소식’은 히브리어에 없는 내용을 ‘소식’으로 특정하므로, 앞 문맥의 들리는 축하 소리를 가리키는 ‘그 소리’로 고쳐야 합니다. 마지막 의문문도 원문의 ‘성읍의 소리’가 요란한 상태를 묻는 표현이지, 그 소리가 별개의 소동을 유발한다는 뜻은 아닙니다.
  naturalness: ‘모든 초대받은 사람들’보다 연회의 문맥에서는 ‘모든 초대받은 손님들’이 자연스럽습니다. ‘성읍에서 나는 소리가 이렇게 떠들썩합니까?’는 현대 표준 한국어 합쇼체로 자연스러우면서도 원문의 소리와 소란의 관계를 보존합니다.
  terminology: 인명 ‘아도니야’, ‘요압’과 ‘나팔 소리’는 적절합니다. 쇼파르의 공적 신호용 뿔나팔이라는 문화적 의미를 영어 POB 감사 기록에 맞추어 각주로 보완합니다.
