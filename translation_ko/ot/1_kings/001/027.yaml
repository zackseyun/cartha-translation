translation:
  language: ko
  text: 만일 이 일이 내 주 왕에게서 나온 것이라면, 내 주 왕의 뒤를 이어 누가 왕좌에 앉을 것인지 내 주 왕의 종들에게 알려 주지 않으셨습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 일’은 문맥에 따라 ‘이 문제’ 또는 ‘이 사건’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 만약
  - 혹시
  lexicon: HALOT
  rationale: 조건문이자 수사적 질문의 시작이므로, 단순하고 격식 있는 ‘만일’로 원문의 조건 형식을 살렸습니다.
- source_word: מֵאֵת
  english_pob_choice: has come from
  chosen_korean: …에게서 나온
  alternatives_korean:
  - …로부터 온
  - …에서 비롯된
  lexicon: HALOT
  rationale: ‘나오다’는 מקור/기원과 허가의 뉘앙스를 자연스럽게 담으면서, 왕의 결정에서 비롯되었다는 의미를 유지합니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 하인들
  - 당신의 노예들
  lexicon: HALOT
  rationale: 궁정에서의 겸손한 자기 호칭으로서의 עבד를 반영해 ‘종들’로 옮겼고, 본문은 신분제의 ‘노예’보다 예우적 종속 관계가 핵심이므로 이를 택했습니다.
- source_word: כִּסֵּא
  english_pob_choice: throne
  chosen_korean: 왕좌
  alternatives_korean:
  - 보좌
  - 옥좌
  lexicon: HALOT
  rationale: 왕위 계승 문맥에서 throne 이미지를 분명히 드러내는 표현으로 ‘왕좌’가 가장 직관적입니다.
- source_word: הוֹדַעְתָּ
  english_pob_choice: have you not made known
  chosen_korean: 알려 주지 않으셨습니까
  alternatives_korean:
  - 알리지 않으셨습니까
  - 말해 주지 않으셨습니까
  lexicon: HALOT
  rationale: 히필의 ‘알게 하다’라는 뜻을 살리면서, 왕에게 드리는 공손한 반문으로 한국어에서 자연스러운 ‘알려 주지 않으셨습니까’로 옮겼습니다.
theological_decisions:
- issue: 궁정 화법의 존대 수준
  chosen_reading: 왕에게 드리는 직접 발화로서 높임말을 유지하되, 질문의 긴박함은 반문형으로 드러냈습니다.
  alternative_readings:
  - 더 완곡한 서술형
  - 더 직설적인 평서형
  rationale: 원문은 사역형 질문으로 왕의 결정 여부를 캐묻는 장면이므로, 과도한 완곡화 없이 합쇼체 반문으로 긴장감을 보존하는 것이 적절합니다.
  doctrine_reference: 'POB translation philosophy §1: source-directed, auditable rendering'
- issue: ‘노예’ 대신 ‘종’ 선택
  chosen_reading: עבדיך는 이 문맥에서 왕 앞의 궁정적 자기표현이므로 ‘종들’로 번역했습니다.
  alternative_readings:
  - 노예들
  - 하인들
  rationale: 본문은 법적 소유 관계보다 신하의 예우와 복종을 나타내므로, POB의 문맥적 용례 원칙에 따라 ‘종들’을 택했습니다.
  doctrine_reference: 'Contested terms policy: context-dependent rendering of servant/slave language'
