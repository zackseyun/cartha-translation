  naturalness: ‘내 주 왕’과 합쇼체는 궁정 발화에 잘 맞습니다. 그러나 왕에게 직접 하는 말에서 ‘당신의 종들’은 현대 한국어에서 다소 어색하거나 무례하게 들릴 수 있습니다. 문맥상 지시 대상이 분명한 ‘내 주 왕의 종들’이 자연스럽고 격식에도 맞습니다.
