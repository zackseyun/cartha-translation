base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/053.yaml
  text: Then King Solomon sent[a], and they brought him down from the altar. And he came and bowed down to King Solomon, and Solomon said to him, “Go to your house.”
  footnotes:
  - marker: a
    text: Or “they led him down from upon the altar.” The Hebrew more literally reads “they caused him to come down from upon the altar.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 솔로몬 왕이 사람을 보내어 그를 제단에서 내려오게 했습니다.[a] 그가 와서 솔로몬 왕에게 절했습니다. 솔로몬이 그에게 말했습니다. “네 집으로 가십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들이 그를 제단 위에서 내려오게 했습니다.” 히브리어는 더 문자적으로 “그들이 그를 제단 위에서 내려오게 했다”라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 사람을 보내자
  alternatives_korean:
  - 보내셨습니다
  - 보냈습니다
  lexicon: HALOT
  rationale: 히브리어 동사의 단순한 ‘보내다’ 의미를 자연스러운 서술로 옮기되, 뒤따르는 문맥상 보낸 대상이 사람임을 문맥으로 보완했습니다.
- source_word: וַיֹּרִדֻהוּ מֵעַל הַמִּזְבֵּחַ
  english_pob_choice: they brought him down from the altar
  chosen_korean: 그들이 그를 제단에서 내려오게 했습니다
  alternatives_korean:
  - 그들이 그를 제단에서 끌어내렸습니다
  - 그를 제단 위에서 내려오게 했습니다
  lexicon: HALOT
  rationale: 힐/홉할 계열의 사역적 뉘앙스를 살려, 단순 이동보다 ‘내려오게 했다’로 번역해 원문의 사역성을 드러냈습니다.
- source_word: וַיִּשְׁתַּחוּ לַמֶּלֶךְ שְׁלֹמֹה
  english_pob_choice: bowed down to King Solomon
  chosen_korean: 솔로몬 왕에게 절하니
  alternatives_korean:
  - 솔로몬 왕 앞에 엎드리니
  - 솔로몬 왕께 경배하니
  lexicon: HALOT
  rationale: שׁחה의 예배적/경배적 몸짓을 한국어 ‘절하다’로 옮겨, 왕에게 드리는 공식적 경의를 자연스럽게 나타냈습니다.
- source_word: לֵךְ לְבֵיתֶךָ
  english_pob_choice: Go to your house
  chosen_korean: 네 집으로 가십시오
  alternatives_korean:
  - 집으로 가십시오
  - 네 집으로 돌아가십시오
  lexicon: HALOT
  rationale: 왕의 지시를 현대 한국어의 정중한 명령으로 살리면서도, 직역적 ‘네 집’ 표현을 유지해 원문의 간결한 퇴장을 보존했습니다.
theological_decisions:
- issue: 왕에게 드리는 몸짓의 성격
  chosen_reading: ‘절하다’로 옮겨, 단순 인사보다 공식적 굴복/경의를 나타내는 동작으로 읽히게 했습니다.
  alternative_readings:
  - ‘경배하다’로 옮겨 종교적 뉘앙스를 강하게 할 수 있음
  - ‘엎드리다’로 옮겨 더 물리적인 자세를 강조할 수 있음
  rationale: 문맥상 아도니야의 정치적 항복과 예를 갖춘 경의가 함께 드러나므로, 종교적 예배로 과도하게 한정하지 않되 강한 복종의 제스처를 살리는 표현이 적절합니다.
  doctrine_reference: 왕권과 복종의 서사적 표현
