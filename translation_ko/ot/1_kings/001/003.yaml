  - 이스라엘의 모든 경계 안에서
  lexicon: HALOT
  rationale: גְּבוּל은 여기서 단순한 경계선보다 나라의 범위 전체를 뜻하므로, 검색 범위를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: אֶת אֲבִישַׁג הַשּׁוּנַמִּית
  english_pob_choice: Abishag the Shunammite
  chosen_korean: 아비삭, 수넴 사람
  alternatives_korean:
  - 아비삭, 수넴 여자
  - 아비삭 수넴 사람
  - 아비삭, 수넴 출신
  lexicon: HALOT
  rationale: 지명형 형용사 הַשּׁוּנַמִּית를 한국어 관용에 맞게 '수넴 사람'으로 옮겨 출신 배경을 보존했습니다.
