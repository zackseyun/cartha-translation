base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/003.yaml
  text: So they searched throughout all the territory of Israel for a beautiful young woman[b][a], and they found Abishag the Shunammite and brought her to the king.
  footnotes:
  - marker: a
    text: Or 'sought a beautiful young woman in all the land of Israel.'
    reason: lexical_alternative
  - marker: b
    text: '''The Shunammite'' means she was a woman from Shunem.'
    reason: cultural_note
translation:
  language: ko
  text: 그래서 그들은 이스라엘 온 땅에서 아름다운 젊은 여자를 찾아다녔고[a], 마침내 아비삭, 수넴 사람을 찾아서 왕에게 데려왔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘 온 땅에서 아름다운 젊은 여자를 찾았다.”
    reason: alternative_reading
  - marker: b
    text: ‘수넴 사람’은 그 여자가 수넴 출신임을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבַקְשׁוּ
  english_pob_choice: they searched
  chosen_korean: 찾아다녔고
  alternatives_korean:
  - 찾았습니다
  - 찾아보았습니다
  - 찾으려고 했습니다
  lexicon: HALOT
  rationale: בקשׁ의 적극적 탐색 뉘앙스를 살리면서, 진행된 수색 행동을 한국어로 자연스럽게 드러냅니다.
- source_word: נַעֲרָה יָפָה
  english_pob_choice: a beautiful young woman
  chosen_korean: 아름다운 젊은 여자
  alternatives_korean:
  - 아름다운 처녀
  - 예쁜 젊은 여자
  - 아름다운 소녀
  lexicon: HALOT
  rationale: נַעֲרָה는 연령감이 있는 젊은 여성을 가리키므로, 현대 한국어에서 자연스럽고 과도하게 어린 뉘앙스를 피하는 표현을 택했습니다.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  english_pob_choice: throughout all the territory of Israel
  chosen_korean: 이스라엘 온 땅에서
  alternatives_korean:
