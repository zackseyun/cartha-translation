source:
  edition: WLC
  text: וְֽ/אֶת נָתָן֩ הַ/נָּבִ֨יא וּ/בְנָיָ֜הוּ וְ/אֶת הַ/גִּבּוֹרִ֛ים וְ/אֶת שְׁלֹמֹ֥ה אָחִ֖י/ו לֹ֥א קָרָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/010.yaml
  text: But he did not invite Nathan the prophet[a], Benaiah, the mighty men, or Solomon his brother.
  footnotes:
  - marker: a
    text: Or 'And he did not call Nathan the prophet, Benaiah, the mighty men, or Solomon his brother.' The Hebrew verb literally means 'call,' here in the sense of inviting or summoning to Adonijah's feast.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 나단 예언자와 브나야와 용사들과 그의 형제인 솔로몬을 초대하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나단 예언자와 브나야와 용사들과 그의 형제인 솔로몬을 부르지 않았다’로도 옮길 수 있습니다. 히브리어 동사는 문자적으로는 ‘부르다’이지만, 여기서는 아도니야의 잔치에 초대하는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתָן הַנָּבִיא
  english_pob_choice: Nathan the prophet
  chosen_korean: 나단 예언자
  alternatives_korean:
  - 예언자 나단
  - 나단, 예언자
  lexicon: WLC; HALOT
  rationale: 고유명사 나단을 음역하고, נָבִיא는 직역해 직함을 살렸습니다. 한국어에서는 ‘나단 예언자’가 가장 자연스럽고 간결합니다.
- source_word: וּבְנָיָהוּ
  english_pob_choice: Benaiah
  chosen_korean: 브나야
  alternatives_korean:
  - 베나야
  - 브나야후
  lexicon: WLC; standard transliteration
  rationale: 히브리어 인명은 현대 외래어 표기 취지에 맞게 음역했습니다. 한국 성경에서 상대적으로 익숙한 ‘브나야’를 택했습니다.
- source_word: הַגִּבּוֹרִים
  english_pob_choice: the mighty men
  chosen_korean: 용사들
  alternatives_korean:
  - 용맹한 사람들
  - 강한 사람들
  - 용맹한 용사들
  lexicon: HALOT
  rationale: 전쟁·궁정 문맥에서 גִּבּוֹרִים는 다윗의 정예 무리를 가리키므로, 한국어로는 관용적이면서도 군사적 뉘앙스를 유지하는 ‘용사들’이 적절합니다.
- source_word: לֹא קָרָא
  english_pob_choice: did not invite
  chosen_korean: 초대하지 않았습니다
  alternatives_korean:
  - 부르지 않았습니다
  - 소집하지 않았습니다
  - 초청하지 않았습니다
  lexicon: HALOT
  rationale: קרא의 기본뜻은 ‘부르다’이지만, 잔치 문맥에서는 영어 POB처럼 ‘invite’가 실제 의미를 더 정확히 전달합니다. 한국어에서는 사회적 의미가 분명한 ‘초대하다’가 가장 자연스럽습니다.
