base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/044.yaml
  text: And the king sent with him Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites; and they mounted him on the king’s mule.
  footnotes:
  - marker: a
    text: Or, more specifically, 'on the king’s she-mule.' The Hebrew noun can denote a female mule.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 그와 함께 사독 제사장과 예언자 나단과 여호야다의 아들 브나야와 그렛 사람들과 블렛 사람들을 보냈으며, 그들이 그를 왕의 노새에 태웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פִּרְדָּה는 문자적으로 암노새를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 보냈으며
  alternatives_korean:
  - 파견했으며
  - 내보냈으며
  lexicon: HALOT
  rationale: 서사적 wayyiqtol 동사로서 단순 과거의 진행을 자연스럽게 살려야 하므로, 과도하게 격식적이거나 행정적인 뉘앙스의 표현보다 ‘보냈다’가 가장 직접적입니다.
- source_word: צָדוֹק הַכֹּהֵן / נָתָן הַנָּבִיא
  english_pob_choice: Zadok the priest / Nathan the prophet
  chosen_korean: 사독 제사장과 예언자 나단
  alternatives_korean:
  - 사독 제사장과 나단 예언자
  - 사독 제사장과 선지자 나단
  lexicon: HALOT
  rationale: 히브리어의 명사-직함 결합을 한국어로는 보통 ‘이름 + 직함’ 또는 ‘직함 + 이름’으로 옮길 수 있으나, 여기서는 병렬성과 자연스러움을 위해 이름과 직함을 분명히 나누었습니다. ‘예언자’는 본문의 נביא에 직접 대응하는 중립적 표현입니다.
- source_word: וְהַכְּרֵתִי וְהַפְּלֵתִי
  english_pob_choice: the Cherethites and the Pelethites
  chosen_korean: 그렛 사람들과 블렛 사람들
  alternatives_korean:
  - 그렛 족속들과 블렛 족속들
  - 그렛인들과 블렛인들
  lexicon: HALOT
  rationale: 이 둘은 집단명으로 기능하므로 해석어보다 음역을 우선해 고유 집단성을 보존했습니다. 한국어 성경 전통에서 통용되는 형태를 따라 ‘사람들’로 옮겼습니다.
- source_word: פִּרְדַּת הַמֶּלֶךְ
  english_pob_choice: the king’s mule
  chosen_korean: 왕의 노새
  alternatives_korean:
  - 왕의 암노새
  - 왕의 노새(암컷)
  lexicon: HALOT
  rationale: פִּרְדָּה는 노새를 뜻하며 성별상 암컷일 수 있지만, 한국어 본문에서는 문맥상 필요한 최소한의 의미만 드러내는 ‘노새’를 택했습니다. POB의 주석이 지적한 성별 가능성은 본문보다 각주에서 처리하는 편이 적절합니다.
theological_decisions:
- issue: 왕의 공식 행렬과 정당성의 표지
  chosen_reading: 사독, 나단, 브나야와 왕당파 인물들이 왕의 노새에 태워지는 장면으로, 새 왕의 공적 승인과 즉위를 암시하는 서술로 읽었습니다.
  alternative_readings:
  - 단순한 이동 준비 묘사
  - 의례적이지만 정치적 함의가 약한 장면
  rationale: 본문은 인물들의 동행과 ‘왕의 노새’라는 상징적 요소를 함께 제시하여, 단순한 이동보다 왕권 이양의 공적 성격을 강하게 드러냅니다.
  doctrine_reference: 열왕기상 1장의 왕위 계승 서사
