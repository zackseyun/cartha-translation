  text: וּ/מָשַׁ֣ח אֹת֣/וֹ שָׁ֠ם צָד֨וֹק הַ/כֹּהֵ֜ן וְ/נָתָ֧ן הַ/נָּבִ֛יא לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וּ/תְקַעְתֶּם֙ בַּ/שּׁוֹפָ֔ר וַ/אֲמַרְתֶּ֕ם יְחִ֖י הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/034.yaml
  text: There Zadok the priest and Nathan the prophet shall anoint him king over Israel[a], and you shall blow the trumpet and say, ‘Long live King Solomon!’
  footnotes:
  - marker: a
    text: Hebrew shofar, a horn used for public signal or proclamation; traditionally rendered 'trumpet.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 제사장 사독과 예언자 나단이 그를 이스라엘의 왕으로 기름 부을 것이며, 너희는 나팔을 불고 이렇게 말해야 합니다. ‘솔로몬 왕 만세!’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שׁוֹפָר는 의식과 공적 선포에 쓰는 뿔나팔입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁח
  english_pob_choice: shall anoint
  chosen_korean: 기름 부을 것이며
  alternatives_korean:
  - 기름 부어야 하며
  - 기름 부으리니
  lexicon: HALOT
  rationale: 명령/예고가 섞인 문맥이므로 단순 과거형이 아니라, 한국어에서는 미래-의무의 연결형으로 풀어 자연스럽게 지시를 전달했습니다.
- source_word: צָדוֹק הַכֹּהֵן / וְנָתָן הַנָּבִיא
  english_pob_choice: Zadok the priest / and Nathan the prophet
  chosen_korean: 제사장 사독과 예언자 나단
  alternatives_korean:
  - 사독 제사장과 나단 예언자
  - 사독, 제사장, 그리고 나단, 예언자
  lexicon: HALOT
  rationale: 직분을 앞세워 인물의 공적 역할을 분명히 했고, נָבִיא는 한국어 성경 전통의 ‘예언자’로 옮겼습니다.
- source_word: שׁוֹפָר
  english_pob_choice: trumpet
  chosen_korean: 나팔
  alternatives_korean:
  - 뿔나팔
  - 트럼펫
  lexicon: HALOT
  rationale: 본문의 שׁוֹפָר는 의식적 선포에 쓰는 뿔나팔이지만, 한국어에서는 ‘나팔’이 가장 자연스럽고 널리 이해되는 대응어입니다.
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  english_pob_choice: Long live King Solomon!
  chosen_korean: 솔로몬 왕 만세!
  alternatives_korean:
  - 왕 솔로몬 만세!
  - 솔로몬 왕이여 오래 사십시오!
  lexicon: HALOT
  rationale: 히브리어 축호문을 한국어 관용 표현으로 재현해, 왕의 장수를 기원하는 즉시성과 공적 함성을 살렸습니다.
theological_decisions:
- issue: 왕위 선포의 축호문을 어떻게 옮길지
  chosen_reading: ‘솔로몬 왕 만세!’로 옮겨 공적 선포의 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘솔로몬 왕이여 오래 사십시오!’
  - ‘솔로몬 왕이 오래 살기를!’
  rationale: 원문의 יְחִי는 단순 정보가 아니라 군중의 즉각적 환호이므로, 한국어에서도 선포적·공적 성격이 살아 있는 표현이 적절합니다.
  doctrine_reference: 왕정 서술의 문체적 재현
- issue: 직접 명령형 대신 미래-의무형을 사용한 이유
  chosen_reading: ‘기름 부을 것이며… 나팔을 불고… 말해야 합니다’로 연결했습니다.
  alternative_readings:
  - ‘기름 부으십시오’
  - ‘기름 부어라’
  rationale: 이 문장은 전달된 지시의 연쇄이므로, 현대 한국어에서는 직설적 명령보다 지시 보고체가 본문의 기능을 더 잘 반영합니다.
  doctrine_reference: 서사/훈계 문체
