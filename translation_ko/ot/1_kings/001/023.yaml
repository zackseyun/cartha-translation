  text: וַ/יַּגִּ֤ידוּ לַ/מֶּ֨לֶךְ֙ לֵ/אמֹ֔ר הִנֵּ֖ה נָתָ֣ן הַ/נָּבִ֑יא וַ/יָּבֹא֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וַ/יִּשְׁתַּ֧חוּ לַ/מֶּ֛לֶךְ עַל אַפָּ֖י/ו אָֽרְצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/023.yaml
  text: And they told the king, saying, “Look, Nathan the prophet is here.” And he came before the king and bowed down to the king with his face to the ground.
translation:
  language: ko
  text: 그들이 왕에게 “보십시오, 예언자 나단이 여기 있습니다”라고 말했습니다. 그는 왕 앞에 나아가 얼굴을 땅에 대고 왕에게 절했습니다.
  philosophy: formal
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 있습니다
  lexicon: interjection
  rationale: 감탄사/지시 표현으로서 화자의 주의를 끄는 기능을 살려, 현대 한국어에서 자연스럽고 공손한 ‘보십시오’를 택했습니다.
- source_word: נָתָן הַנָּבִיא
  english_pob_choice: Nathan the prophet
  chosen_korean: 예언자 나단
  alternatives_korean:
  - 나단 선지자
  - 나단 예언자
  lexicon: proper noun + prophetic title
  rationale: פְּרוֹפֵט/נָבִיא는 본문 맥락상 신탁 전달자의 직함이므로, 교회 관용어보다 원뜻이 분명한 ‘예언자’를 사용했습니다.
- source_word: וַיִּשְׁתַּחֲוּ לַמֶּלֶךְ
  english_pob_choice: bowed down to the king
  chosen_korean: 왕에게 절했습니다
  alternatives_korean:
  - 왕 앞에 엎드렸습니다
  - 왕께 몸을 굽혔습니다
  lexicon: gesture/action
  rationale: 히브리어 동사는 단순한 예의 인사보다 더 강한 경배·굴복의 몸짓을 가리킬 수 있어, 그 강도를 살려 ‘절했습니다’로 옮겼습니다.
theological_decisions:
- issue: 왕권 앞에서의 신체적 예를 어떻게 전달할지
  chosen_reading: ‘얼굴을 땅에 대고 왕에게 절했습니다’로 번역해, 단순한 인사보다 더 깊은 복종과 경외를 드러냈습니다.
  alternative_readings:
  - ‘왕에게 인사했습니다’
  - ‘왕 앞에 엎드렸습니다’
  rationale: 본문은 예언자 나단이 왕 앞에서 매우 낮아지는 자세를 묘사하므로, 예의 수준으로 약화하지 않고 본문의 위계적 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 본문 서술의 위계와 존중 표현
