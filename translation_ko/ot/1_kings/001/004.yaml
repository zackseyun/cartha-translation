id: 1KI.1.4
reference: 1 Kings 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַֽ/נַּעֲרָ֖ה יָפָ֣ה עַד מְאֹ֑ד וַ/תְּהִ֨י לַ/מֶּ֤לֶךְ סֹכֶ֨נֶת֙ וַ/תְּשָׁ֣רְתֵ֔/הוּ וְ/הַ/מֶּ֖לֶךְ לֹ֥א יְדָעָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/004.yaml
  text: The young woman was very beautiful[a], and she became the king’s attendant and served him, but the king did not know her.
  footnotes:
  - marker: a
    text: Or, 'did not have sexual relations with her.' The Hebrew 'know' here is a euphemism for sexual intercourse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 젊은 여인은 매우 아름다웠습니다[a]. 그 여인은 왕의 시종이 되어 그를 섬겼지만, 왕은 그 여인을 알지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그 여인과 성관계를 맺지 않았다.' 히브리어 '알다'는 여기서 성적 관계를 가리키는 완곡어법입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  english_pob_choice: the young woman
  chosen_korean: 그 젊은 여인
  alternatives_korean:
  - 그 소녀
  - 그 처녀
  lexicon: HALOT
  rationale: נַעֲרָה는 나이 어린 여성 일반을 가리키므로, 현대 한국어에서는 '젊은 여인'이 가장 자연스럽고 '소녀'의 미성숙한 뉘앙스와 '처녀'의 불필요한 성적·종교적 뉘앙스를 피합니다.
- source_word: יָפָה עַד מְאֹד
  english_pob_choice: was very beautiful
  chosen_korean: 매우 아름다웠습니다
  alternatives_korean:
  - 지극히 아름다웠습니다
  - 대단히 아름다웠습니다
  lexicon: HALOT
  rationale: 아주 강한 강조를 담되, 문어체에서 과도하게 장식적이지 않은 표현으로 원문의 강세를 자연스럽게 살렸습니다.
- source_word: סֹכֶנֶת
  english_pob_choice: attendant
  chosen_korean: 시종
  alternatives_korean:
  - 시녀
  - 보좌인
  - 수종
  lexicon: HALOT
  rationale: 왕에게 붙어 보조하고 섬기는 역할을 드러내면서도, 현대 한국어에서 이해하기 쉬운 궁정 관련 표현으로 옮겼습니다. '시녀'는 성별을 고정하고, '보좌인'은 지나치게 추상적입니다.
- source_word: וַתְּשָׁרְתֵהוּ
  english_pob_choice: and served him
  chosen_korean: 그를 섬겼지만
  alternatives_korean:
  - 그를 시중들었지만
  - 그를 수종들었지만
  lexicon: HALOT
  rationale: שׁרת의 기본 의미인 '섬기다/시중들다'를 살리되, 앞절과의 연결을 자연스럽게 하기 위해 '하지만'으로 문맥을 매끈하게 처리했습니다.
- source_word: יְדָעָהּ
  english_pob_choice: did not know her
  chosen_korean: 그 여인을 알지 못했습니다
  alternatives_korean:
  - 그 여인과 성관계를 맺지 않았습니다
  - 그 여인과 동침하지 않았습니다
  lexicon: HALOT
  rationale: 히브리어 '알다'의 성관계 완곡어법을 본문에서는 그대로 유지하고, 독자가 오해하지 않도록 각주로 의미를 밝혔습니다.
theological_decisions:
- issue: '''알다''의 성적 완곡어법을 본문에서 어떻게 처리할지'
  chosen_reading: 본문은 '알지 못했습니다'로 직역적 완곡어법을 유지하고, 각주에서 성관계 의미를 설명합니다.
  alternative_readings:
  - 그 여인과 성관계를 맺지 않았습니다
  - 그 여인과 동침하지 않았습니다
  rationale: 원문 수사와 서술의 절제를 보존하면서도, 실제 의미는 투명하게 드러나도록 하는 편이 본문과 주해의 균형에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
