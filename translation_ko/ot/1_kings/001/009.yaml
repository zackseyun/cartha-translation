source:
  edition: WLC
  text: וַ/יִּזְבַּ֣ח אֲדֹנִיָּ֗הוּ צֹ֤אן וּ/בָקָר֙ וּ/מְרִ֔יא עִ֚ם אֶ֣בֶן הַזֹּחֶ֔לֶת אֲשֶׁר אֵ֖צֶל עֵ֣ין רֹגֵ֑ל וַ/יִּקְרָ֗א אֶת כָּל אֶחָי/ו֙ בְּנֵ֣י הַ/מֶּ֔לֶךְ וּ/לְ/כָל אַנְשֵׁ֥י יְהוּדָ֖ה עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/009.yaml
  text: Adonijah sacrificed sheep[a], cattle, and fattened animals by the stone of Zoheleth, which is beside En-rogel, and he invited all his brothers, the king’s sons, and all the men of Judah[e][d][c][b], the king’s servants.
  footnotes:
  - marker: a
    text: Or 'fatted cattle' or 'stall-fed cattle' for 'fattened calves.'
    reason: lexical_alternative
  - marker: b
    text: Zoheleth is a place-name; its exact meaning is uncertain.
    reason: cultural_note
  - marker: c
    text: Or 'called' or 'summoned' instead of 'invited.'
    reason: lexical_alternative
  - marker: d
    text: Or 'the people of Judah,' though the Hebrew says 'the men of Judah.'
    reason: lexical_alternative
  - marker: e
    text: '''The king’s servants'' may refer to royal attendants or officials.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아도니야는 엔로겔 곁에 있는 조헬렛[a] 돌 곁에서 양과 소와 살진 가축을 제물로 바치고, 자기 형제들 곧 왕의 아들들과 유다의 모든 남자들[c], 곧 왕의 신하들을 초청했습니다.[b][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조헬렛’은 지명으로 보이며, 정확한 뜻은 확실하지 않습니다.
    reason: cultural_note
  - marker: b
    text: ‘초청했습니다’는 단순히 부른 것이 아니라 잔치 자리에 오도록 초대한 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘유다의 남자들’입니다. 문맥상 유다의 참석자들을 가리키는 집합적 표현으로 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘왕의 신하들’은 왕실 시종이나 관리들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  english_pob_choice: sacrificed
  chosen_korean: 제사로 드리고
  alternatives_korean:
  - 제사했습니다
  - 희생제물을 바쳤습니다
  lexicon: HALOT
  rationale: זבח는 단순 도살이 아니라 제의적 성격의 희생을 가리키므로, 한국어에서는 ‘제사로 드리다’가 행위의 종교·정치적 의미를 가장 잘 보존합니다.
- source_word: צֹאן וּבָקָר וּמְרִיא
  english_pob_choice: sheep, cattle, and fattened animals
  chosen_korean: 양과 소와 살진 가축
  alternatives_korean:
  - 양 떼와 소 떼와 살진 짐승
  - 양과 소와 살진 송아지
  lexicon: HALOT
  rationale: צֹאן/בָקָר는 각각 작은 가축과 소를 가리키는 집합명사이므로, 자연스러운 목록 형태로 ‘양과 소’로 옮기고, מְרִיא는 특정 종보다 살진 가축 일반을 가리켜 ‘살진 가축’으로 넓게 번역했습니다.
- source_word: אֶבֶן הַזֹּחֶלֶת / עֵין רֹגֵל
  english_pob_choice: the stone of Zoheleth / En-rogel
  chosen_korean: 돌인 ‘조헬렛’ 곁, 곧 엔-로겔 옆
  alternatives_korean:
  - ‘조헬렛’ 돌 곁, 곧 엔-로겔 옆
  - 조헬렛 바위 곁, 곧 엔-로겔 옆
  lexicon: HALOT
  rationale: 두 표현은 지명으로 보이므로 음역을 유지했습니다. ‘אֶבֶן’은 일반 명사이지만 고유 지명 앞에서 의미가 불확실하므로 ‘돌인’으로 남겨, 장소명임과 본문의 직설성을 함께 살렸습니다.
- source_word: וַיִּקְרָא
  english_pob_choice: invited
  chosen_korean: 초청했습니다
  alternatives_korean:
  - 불렀습니다
  - 소집했습니다
  lexicon: HALOT
  rationale: 잔치/제사 자리로 사람들을 부르는 문맥이므로 단순 호출보다 사회적 초대를 드러내는 ‘초청하다’가 적합합니다.
- source_word: אַנְשֵׁי יְהוּדָה
  english_pob_choice: the men of Judah
  chosen_korean: 유다의 모든 사람들
  alternatives_korean:
  - 유다의 모든 남자들
  - 유다 사람들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘유다의 사람들/남자들’이지만, 한국어에서는 남성성을 과도하게 부각하기보다 집합적 참석자를 자연스럽게 드러내는 표현이 필요해 ‘유다의 모든 사람들’로 옮겼습니다.
theological_decisions:
- issue: 아도니야의 행위가 단순한 잔치인지, 제의적·정치적 선전인지
  chosen_reading: ‘제사로 드리고’와 ‘초청했습니다’를 함께 유지해, 종교적 제의와 정치적 결집이 겹친 장면으로 읽히도록 했습니다.
  alternative_readings:
  - ‘잔치를 차리고’로 완화하는 읽기
  - ‘희생을 드리고’로 제의성만 강조하는 읽기
  rationale: 본문은 զոհ/זבח와 초청 행위를 나란히 배치하여 행위의 종교적 외피와 정치적 의도를 모두 보여 줍니다. 둘 중 하나로 줄이면 본문이 의도한 긴장이 약화됩니다.
  doctrine_reference: 왕권 서사 해석 원리
