revisions:
- from: 그때 나단이 솔로몬의 어머니 밧세바에게 말했습니다. 「아도니야가 왕이 된 것과 우리 주 다윗이 그것을 모르고 있다는 말을 듣지 못하셨습니까?」[a]
  to: 그때 나단이 솔로몬의 어머니 밧세바에게 말했습니다. “아도니야가 왕이 되었고[a], 우리 주 다윗께서는 그것을 모르고 계신다는 소식을 듣지 못하셨습니까?”
  rationale: 두 히브리어 절을 한국어에서 자연스러운 병렬 진술로 재구성하고, 다윗을 가리키는 ‘우리 주’에 적합한 높임법을 적용했습니다. מָלַךְ의 기본 의미인 ‘왕이 되었다’는 본문에 유지했으며, 자의적 왕위 선언이라는 문맥적 가능성은 원문보다 강하게 단정하지 않도록 각주에서만 제시했습니다. 각주 표지는 해당 어휘 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:45:00Z'
review_pass:
  verdict: revise
  source_fidelity: 본문은 전반적으로 히브리어의 순서와 의미를 충실히 옮깁니다. 다만 ‘아도니야가 왕이 된 것과 … 모르고 있다는 말을’은 두 절을 하나의 ‘말’로 묶어 다소 부자연스럽고, 원문의 두 독립된 진술의 연결을 충분히 드러내지 못합니다. ‘우리 주 다윗’에는 높임 주격과 서술을 적용하는 것이 원문의 궁정 존칭에 더 알맞습니다.
  naturalness: ‘아도니야가 왕이 되었고, 우리 주 다윗께서는 그것을 모르고 계신다는 소식’이 현대 표준어 합쇼체에서 자연스럽고 명료합니다. 각주도 ‘자기찬탈’보다 원문의 비명시성을 더 정확히 보존하는 표현으로 다듬어야 합니다.
  terminology: ‘나단’, ‘밧세바’, ‘솔로몬’, ‘아도니야’, ‘다윗’의 표기는 적절합니다. אֲדֹנֵינוּ는 신적 칭호가 아니라 왕에 대한 인간 존칭이므로 ‘우리 주 다윗께서’로 옮기는 것이 적절합니다. מָלַךְ는 본문에서 ‘왕이 되었다’로 유지하고, ‘스스로’라는 해석은 각주에서만 대안으로 제시합니다.
  issues:
