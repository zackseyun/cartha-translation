id: 1KI.1.11
reference: 1 Kings 1:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר נָתָ֗ן אֶל בַּת שֶׁ֤בַע אֵם שְׁלֹמֹה֙ לֵ/אמֹ֔ר הֲ/ל֣וֹא שָׁמַ֔עַתְּ כִּ֥י מָלַ֖ךְ אֲדֹנִיָּ֣הוּ בֶן חַגִּ֑ית וַ/אֲדֹנֵ֥י/נוּ דָוִ֖ד לֹ֥א יָדָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/011.yaml
  text: Then Nathan said to Bathsheba[a], Solomon’s mother, “Have you not heard that Adonijah son of Haggith has become king, and our lord David does not know it?”
  footnotes:
  - marker: a
    text: Or “has made himself king.” The Hebrew says literally “has become king/reigned”; the context may imply self-exaltation, but the wording here does not explicitly state it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나단이 솔로몬의 어머니 밧세바에게 말했습니다. “아도니야가 왕이 되었고[a], 우리 주 다윗께서는 그것을 모르고 계신다는 소식을 듣지 못하셨습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “스스로 왕이 되었다.” 히브리어는 문자적으로 “왕이 되다/통치하다”를 뜻합니다. 문맥은 그가 스스로 왕이 되려 했음을 암시할 수 있으나, 여기의 표현 자체가 그것을 명시하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그러고는 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 한국어에서 자연스럽게 드러내면서, 앞 사건에서 다음 발화로 넘어가는 흐름을 살렸습니다.
- source_word: בַּת שֶׁבַע אֵם שְׁלֹמֹה
  english_pob_choice: Bathsheba, Solomon’s mother
  chosen_korean: 솔로몬의 어머니 밧세바에게
  alternatives_korean:
  - 밧세바에게, 솔로몬의 어머니에게
  - 솔로몬의 어머니 밧세바에게
  lexicon: HALOT
  rationale: בהת사는 고유명과 관계절을 함께 두어 인물을 식별하는 구조를 따라가되, 한국어에서는 소유격으로 자연스럽게 정리했습니다.
- source_word: הֲלֹא שָׁמַעַתְּ
  english_pob_choice: Have you not heard
  chosen_korean: 듣지 못하셨습니까
  alternatives_korean:
  - 들으신 적 없습니까
  - 아직 못 들으셨습니까
  lexicon: HALOT
  rationale: רֶטוֹרִי 질문의 압박감을 살리기 위해 정중한 반문형으로 옮겼고, ‘heard’는 소문·보고를 들은 의미까지 담는 한국어 표현으로 처리했습니다.
- source_word: מָלַךְ
  english_pob_choice: has become king
  chosen_korean: 왕이 된 것
  alternatives_korean:
  - 왕이 되었다는 것
  - 왕위에 오른 것
  - 스스로 왕이 되었다는 것
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘통치하다’보다 ‘왕이 되다/왕이 되다 상태에 들어가다’에 가깝기 때문에, 본문이 명시하지 않는 자기찬탈 뉘앙스는 보류하고 사건 자체를 반영했습니다.
- source_word: לֹא יָדָע
  english_pob_choice: does not know it
  chosen_korean: 그것을 모르고 있다는
  alternatives_korean:
  - 그 사실을 모르고 있다는
  - 알지 못하고 있다는
  lexicon: HALOT
  rationale: 목적어가 히브리어에서 암시적이므로 한국어에서는 지시어 ‘그것’을 넣어 참조 대상을 분명히 했습니다.
theological_decisions:
- issue: 아도니야의 왕 됨을 ‘스스로 왕이 되다’로 단정할지 여부
  chosen_reading: 본문은 ‘왕이 된 것’으로 두고, 자기찬탈은 암시로만 남깁니다.
  alternative_readings:
  - 스스로 왕이 되었다
  - 왕위에 올랐다
  rationale: 히브리어 מָלַךְ 자체는 본문 수준에서 단순한 왕 됨을 말하며, 자기 고양의 도덕적 평가는 문맥상 가능하더라도 여기서는 직접 진술이 아니므로 번역에 삽입하지 않았습니다.
  doctrine_reference: 문맥 추론과 본문 명시성의 구별
