  - severity: low
    issue: 각주의 표현
    rationale: ‘자기찬탈을 시사’ 및 ‘자기찬탈’은 원문의 מָלַךְ가 직접 말하지 않는 판단을 지나치게 강하게 암시하고 한국어 표현도 매끄럽지 않습니다. 문맥이 자의적 왕위 선언을 암시할 수 있다는 정도로 한정하는 편이 안전합니다.
