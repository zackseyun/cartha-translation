reference: 1 Kings 1:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּח֩ צָד֨וֹק הַ/כֹּהֵ֜ן אֶת קֶ֤רֶן הַ/שֶּׁ֨מֶן֙ מִן הָ/אֹ֔הֶל וַ/יִּמְשַׁ֖ח אֶת שְׁלֹמֹ֑ה וַֽ/יִּתְקְעוּ֙ בַּ/שּׁוֹפָ֔ר וַ/יֹּֽאמְרוּ֙ כָּל הָ/עָ֔ם יְחִ֖י הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/039.yaml
  text: Then Zadok the priest took the horn of oil from the tent and anointed Solomon[a]. Then they blew the ram’s horn, and all the people said[b], “Long live King Solomon!”
  footnotes:
  - marker: a
    text: Or “they blew the trumpet”; Hebrew shofar, a horn trumpet, often a ram’s horn.
    reason: lexical_alternative
  - marker: b
    text: Or “from the tabernacle”; Hebrew simply “from the tent.”
    reason: alternative_reading
translation:
  language: ko
  text: 그때 사독 제사장이 성막에서 기름 뿔을 가져다가 솔로몬에게 기름을 부었습니다. 그러자 그들이 뿔나팔을 불었고, 온 백성이 말했습니다. “솔로몬 왕 만세!”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뿔나팔’은 히브리어 שׁוֹפָר의 구체적 형상(대개 숫양뿔)을 풀어 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 פשוט히 ‘백성’(all the people)이라고 하며, 공개적 환호를 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: צָדוֹק הַכֹּהֵן
  english_pob_choice: Zadok the priest
  chosen_korean: 사독 제사장
  alternatives_korean:
  - 사독, 제사장
  lexicon: HALOT
  rationale: 인명은 통용 표기인 ‘사독’을 따르고, הַכֹּהֵן은 문맥상 직함이므로 ‘제사장’으로 풀었습니다.
- source_word: קֶרֶן הַשֶּׁמֶן
  english_pob_choice: the horn of oil
  chosen_korean: 기름 뿔
  alternatives_korean:
  - 기름이 든 뿔
  - 기름 담은 뿔
  lexicon: HALOT
  rationale: 히브리어의 구체적 의례 이미지를 살리기 위해 ‘뿔’의 물성을 유지하고, 기름의 용기를 분명히 하기 위해 ‘기름 뿔’로 옮겼습니다.
- source_word: מִן הָאֹהֶל
  english_pob_choice: from the tent
  chosen_korean: 성막에서
  alternatives_korean:
  - 장막에서
  - 텐트에서
  lexicon: HALOT
  rationale: 원어는 단순히 ‘tent’이지만, 이 장면의 예배적 배경을 고려하면 한국어에서는 ‘성막’이 본문의 의도를 가장 자연스럽게 드러냅니다.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  english_pob_choice: they blew the ram’s horn
  chosen_korean: 뿔나팔을 불었고
  alternatives_korean:
  - 숫양뿔 나팔을 불었고
  - 쇼파르를 불었고
  lexicon: HALOT
  rationale: שׁוֹפָר는 일반 독자에게는 ‘뿔나팔’이 가장 이해하기 쉬우면서도, 단순한 ‘나팔’보다 원어의 구체성을 더 잘 보존합니다.
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  english_pob_choice: Long live King Solomon!
  chosen_korean: “솔로몬 왕 만세!”
  alternatives_korean:
  - “솔로몬 왕이 오래 살기를!”
  - “솔로몬 왕이여, 만세!”
  lexicon: HALOT
  rationale: 히브리어의 환호/기원문은 한국어에서 관용적으로 ‘만세’가 가장 자연스럽고 강한 대응입니다.
theological_decisions:
- issue: הָאֹהֶל의 구체화 수준
  chosen_reading: 예배용 ‘성막’으로 옮겨, 왕의 기름부음이 단순한 천막이 아니라 거룩한 제의 공간에서 이루어진 사실을 드러냈습니다.
  alternative_readings:
  - 그냥 ‘텐트’로 두기
  - ‘장막’으로 번역하기
  rationale: 사실상 성소를 가리키는 문맥이므로, 한국어 독자는 예배적 배경을 즉시 이해할 수 있도록 성막을 채택했습니다. 이는 원문의 기능적 의미를 보존하는 선택입니다.
  doctrine_reference: Translation philosophy §1, §6
