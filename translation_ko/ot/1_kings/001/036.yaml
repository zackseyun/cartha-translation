base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/036.yaml
  text: Benaiah son of Jehoiada answered the king and said[a], “Amen! May Yahweh, the God of my lord the king, say so.”
  footnotes:
  - marker: a
    text: Or, 'Amen! So may the LORD, the God of my lord the king, say.' The Hebrew verb can be rendered more literally as 'say,' with the sense of confirming or ordaining the king's wish.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호야다의 아들 베나야가 왕에게 대답하여 말했습니다. “아멘! 내 주 왕의 하나님이신 야훼께서 그렇게 말씀하시기를 바랍니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “아멘! 내 주 왕의 하나님이신 야훼께서 그렇게 말씀하실 것입니다.” 히브리어 동사는 문자적으로 ‘말하다’이며, 여기서는 왕의 뜻을 확증하거나 이루어 주시기를 바라는 기원의 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  english_pob_choice: answered ... and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 응답하며 말했습니다
  - 대답하고 말했습니다
  lexicon: HALOT
  rationale: 히브리어 서술 연속을 한국어에서 자연스럽게 압축하되, 회답의 동작과 발화 동사를 모두 드러내기 위해 ‘대답하여 말했습니다’로 옮겼습니다.
- source_word: אָמֵן
  english_pob_choice: Amen!
  chosen_korean: 아멘!
  alternatives_korean:
  - 그렇게 되기를!
  - 진실로!
  lexicon: HALOT
  rationale: 여기서는 동의와 기원의 울림을 지닌 응답어이므로, 교회적 전통어 ‘아멘’을 그대로 살리는 것이 원문의 힘을 가장 잘 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 문맥상 하나님의 고유명사를 가리키므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 하나님의 이름과 호칭을 구별했습니다.
- source_word: אֱלֹהֵי אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: the God of my lord the king
  chosen_korean: 나의 주 왕의 하나님
  alternatives_korean:
  - 내 주 왕의 하나님
  - 나의 주인 왕의 하나님
  lexicon: HALOT
  rationale: ‘אֱלֹהֵי’의 소유 관계를 한국어의 관형격으로 살리고, 궁정적 존칭인 ‘my lord the king’을 ‘나의 주 왕’으로 옮겨 원문의 경어층위를 유지했습니다.
theological_decisions:
- issue: 왕에 대한 궁정적 경어와 하나님 이름의 병렬
  chosen_reading: ‘야훼, 곧 나의 주 왕의 하나님’으로 처리해, 하나님 고유명사와 왕에 대한 존칭을 함께 보이게 했습니다.
  alternative_readings:
  - ‘야훼, 나의 주 왕의 하나님’
  - ‘주님, 나의 주 왕의 하나님’
  rationale: 히브리어는 야훼와 ‘my lord the king’의 관계를 직접 연결합니다. 한국어에서도 문법적 자연스러움보다 경어 관계와 호칭의 층위를 분명히 드러내는 편이 원문 이해에 더 충실합니다.
  doctrine_reference: YHWH 고유명사 번역 지침
