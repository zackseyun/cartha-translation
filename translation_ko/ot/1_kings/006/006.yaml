base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/006.yaml
  text: The lowest story was five cubits wide[a], the middle one six cubits wide, and the third seven cubits wide; for he made offsets around the outside of the temple[b], so that the beams would not be inserted into the walls of the temple.
  footnotes:
  - marker: a
    text: Or 'ledges' or 'recesses' for the architectural feature in the wall.
    reason: lexical_alternative
  - marker: b
    text: Literally 'so as not to take hold in the walls of the house'; the sense is that the supporting beams of the side structure were not fastened into the temple walls.
    reason: lexical_alternative
translation:
  language: ko
  text: 아래층은 다섯 규빗 너비였고[a], 중간층은 여섯 규빗 너비였으며, 셋째 층은 일곱 규빗 너비였습니다. 이는 그가 집 둘레 바깥쪽에 단차를 두어[b], 들보가 성전의 벽에 박히지 않게 하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘층’이지만, 건축 맥락의 구조물 배열을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘집 둘레 바깥쪽에 오목한 부분을 두어’이며, 성전 벽에 들보를 직접 고정하지 않도록 만든 구조를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: היצוע / התחתנה / התיכנה / השלישית
  english_pob_choice: the lowest story / the middle one / the third
  chosen_korean: 아래층 / 중간층 / 셋째 층
  alternatives_korean:
  - 낮은 층 / 가운데층 / 세 번째 층
  - 아래 이야기층 / 중간 이야기층 / 셋째 이야기층
  lexicon: HALOT
  rationale: 건축 맥락에서 층의 단계적 배열을 자연스럽게 드러내면서, 원문의 반복되는 구조와 위계(아래-중간-셋째)를 보존했습니다.
- source_word: באמה
