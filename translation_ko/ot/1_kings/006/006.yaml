  chosen_korean: 규빗
  alternatives_korean:
  - 큐빗
  - 자
  lexicon: HALOT
  rationale: 고대 չափ단위를 그대로 유지해 원문과의 대응성을 살렸습니다.
- source_word: מגרעות
  english_pob_choice: offsets
  chosen_korean: 단차
  alternatives_korean:
  - 들여판 부분
  - 오목하게 판 홈
  - 턱
  lexicon: HALOT
  rationale: 벽체가 안쪽으로 물러나는 건축적 형상을 간결하게 나타내면서, 보가 성전 벽에 직접 걸리지 않게 하는 기능을 드러내는 표현으로 선택했습니다.
- source_word: לבלתי אחז בקירות הבית
  english_pob_choice: so that the beams would not be inserted into the walls of the temple
  chosen_korean: 들보가 성전의 벽에 박히지 않게 하였다
  alternatives_korean:
  - 들보가 성전 벽에 고정되지 않게 하였다
  - 성전의 벽에 들보를 끼워 넣지 않게 하였다
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도, 원문의 목적절이 말하는 '벽에 직접 결속되지 않음'을 자연스럽게 전달했습니다.
theological_decisions:
- issue: בית의 지시 대상
  chosen_reading: ‘집’은 문맥상 솔로몬 성전 건물을 가리키므로 ‘성전’으로 옮겼습니다.
  alternative_readings:
  - 집
  - 집(성전)
  rationale: 건축 설명의 대상이 분명히 성전이므로, 독자가 오해하지 않도록 문맥적 지시 대상을 드러냈습니다.
  doctrine_reference: 문맥적 지시어 해석
- issue: architectural purpose clause
  chosen_reading: 보가 벽에 박히지 않게 하였다는 목적을 분명히 살렸습니다.
  alternative_readings:
  - 보가 벽에 닿지 않게 하였다
  - 보가 벽에 끼이지 않게 하였다
  rationale: 본문은 건축 구조의 독립성을 설명하므로, 의미를 약화하지 않는 선에서 기능을 명시했습니다.
  doctrine_reference: 본문 주해 원칙
