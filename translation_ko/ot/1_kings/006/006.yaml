theological_decisions:
- issue: בית의 지시 대상
  chosen_reading: ‘집’은 문맥상 솔로몬 성전 건물을 가리키므로 ‘성전’으로 옮겼습니다.
  alternative_readings:
  - 집
  - 집(성전)
  rationale: 건축 설명의 대상이 분명히 성전이므로, 독자가 오해하지 않도록 문맥적 지시 대상을 드러냈습니다.
  doctrine_reference: 문맥적 지시어 해석
- issue: architectural purpose clause
  chosen_reading: 보가 벽에 박히지 않게 하였다는 목적을 분명히 살렸습니다.
  alternative_readings:
  - 보가 벽에 닿지 않게 하였다
  - 보가 벽에 끼이지 않게 하였다
  rationale: 본문은 건축 구조의 독립성을 설명하므로, 의미를 약화하지 않는 선에서 기능을 명시했습니다.
  doctrine_reference: 본문 주해 원칙
