  naturalness: ‘지성소 앞은 …이었으며’는 현대 한국어에서 공간 관계와 치수의 대상이 불명확합니다. ‘지성소는 길이 …’가 자연스럽고, ‘그것을 순금으로 입혔습니다’는 대명사의 지시 대상도 분명합니다. 두 번째 ‘입혔습니다’는 앞의 금을 보충하지 않고도 한국어에서 문맥상 이해됩니다.
