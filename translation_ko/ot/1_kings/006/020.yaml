  lexicon: HALOT
  rationale: 히브리어의 도량형 진술을 그대로 살리기 위해 규빗을 유지했고, 문장 구조는 한국어에서 자연스러운 명사구 나열로 정리했습니다.
- source_word: וַיְצַפֵּהוּ זָהָב סָגוּר
  english_pob_choice: He overlaid it with pure gold
  chosen_korean: 그 위를 순금으로 입혔습니다
  alternatives_korean:
  - 그것을 순금으로 입혔습니다
  - 그 위를 정금으로 입혔습니다
  - 그 위를 순수한 금으로 입혔습니다
  lexicon: HALOT
  rationale: צפה는 표면을 입히다/덮다의 뜻이므로 ‘입혔습니다’가 가장 자연스럽고, זָהָב סָגוּר는 품질이 높은 정련 금이어서 ‘순금’으로 옮겼습니다.
- source_word: וַיְצַף מִזְבֵּחַ אָרֶז
  english_pob_choice: and he overlaid the cedar altar
  chosen_korean: 백향목 제단을 입혔습니다
  alternatives_korean:
  - 백향목 제단을 덮었습니다
  - 백향목으로 된 제단을 입혔습니다
  - 백향목 제단에 입혔습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘백향목 제단’을 입혔다고 가장 자연스럽게 읽히므로 직역을 유지했고, 문맥상 제단 자체를 가리키는 표현으로 처리했습니다.
theological_decisions:
- issue: 지성소(내부 성소) 용어 선택
  chosen_reading: ‘지성소’로 옮겨 성전 구조의 가장 안쪽, 가장 거룩한 공간이라는 기능적 의미를 드러냈습니다.
  alternative_readings:
  - 내부 성소
  - 가장 거룩한 곳
  - 안쪽 방
  rationale: 본문의 דְּבִיר는 성전 용어로서 단순한 ‘안방’보다 신학적으로 더 분명한 공간을 지시하므로, 한국어 교회 독자에게도 즉시 이해되는 표준어를 택했습니다.
  doctrine_reference: 성전/성소 용어의 문맥적 기능
