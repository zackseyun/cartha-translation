base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/020.yaml
  text: In front of the inner sanctuary was twenty cubits in length[a], twenty cubits in width, and twenty cubits in its height. He overlaid it with pure gold[b], and he overlaid the cedar altar.
  footnotes:
  - marker: a
    text: Or 'fine gold.' The Hebrew phrase זָהָב סָגוּר denotes high-quality refined gold.
    reason: lexical_alternative
  - marker: b
    text: Or 'an altar of cedar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지성소 앞은 길이 이십 규빗, 너비 이십 규빗, 높이 이십 규빗이었으며, 그 위를 순금으로 입혔습니다[a]. 또 백향목 제단을 입혔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정금’. 히브리어 זָהָב סָגוּר는 고급으로 정련된 금을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘백향목으로 된 제단’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי הַדְּבִיר / הַדְּבִיר
  english_pob_choice: In front of the inner sanctuary
  chosen_korean: 지성소 앞
  alternatives_korean:
  - 내부 성소 앞
  - 안쪽 성소 앞
  - 지성소 앞에
  lexicon: HALOT
  rationale: דְּבִיר는 성전의 가장 안쪽 공간을 가리키므로 한국어에서는 독자가 바로 알아볼 수 있는 ‘지성소’로 옮기되, לִפְנֵי의 공간 관계를 ‘앞’으로 살렸습니다.
- source_word: עֶשְׂרִים אַמָּה ... אֹרֶךְ / רֹחַב / קוֹמָתוֹ
  english_pob_choice: twenty cubits in length, twenty cubits in width, and twenty cubits in its height
  chosen_korean: 길이 이십 규빗, 너비 이십 규빗, 높이 이십 규빗
  alternatives_korean:
  - 이십 규빗 길이, 이십 규빗 너비, 이십 규빗 높이
  - 길이 이십 규빗, 폭 이십 규빗, 높이 이십 규빗
  lexicon: HALOT
  rationale: 히브리어의 도량형 진술을 그대로 살리기 위해 규빗을 유지했고, 문장 구조는 한국어에서 자연스러운 명사구 나열로 정리했습니다.
- source_word: וַיְצַפֵּהוּ זָהָב סָגוּר
  english_pob_choice: He overlaid it with pure gold
  chosen_korean: 그 위를 순금으로 입혔습니다
  alternatives_korean:
  - 그것을 순금으로 입혔습니다
  - 그 위를 정금으로 입혔습니다
  - 그 위를 순수한 금으로 입혔습니다
  lexicon: HALOT
  rationale: צפה는 표면을 입히다/덮다의 뜻이므로 ‘입혔습니다’가 가장 자연스럽고, זָהָב סָגוּר는 품질이 높은 정련 금이어서 ‘순금’으로 옮겼습니다.
- source_word: וַיְצַף מִזְבֵּחַ אָרֶז
  english_pob_choice: and he overlaid the cedar altar
  chosen_korean: 백향목 제단을 입혔습니다
  alternatives_korean:
  - 백향목 제단을 덮었습니다
  - 백향목으로 된 제단을 입혔습니다
  - 백향목 제단에 입혔습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘백향목 제단’을 입혔다고 가장 자연스럽게 읽히므로 직역을 유지했고, 문맥상 제단 자체를 가리키는 표현으로 처리했습니다.
theological_decisions:
- issue: 지성소(내부 성소) 용어 선택
  chosen_reading: ‘지성소’로 옮겨 성전 구조의 가장 안쪽, 가장 거룩한 공간이라는 기능적 의미를 드러냈습니다.
  alternative_readings:
  - 내부 성소
  - 가장 거룩한 곳
  - 안쪽 방
  rationale: 본문의 דְּבִיר는 성전 용어로서 단순한 ‘안방’보다 신학적으로 더 분명한 공간을 지시하므로, 한국어 교회 독자에게도 즉시 이해되는 표준어를 택했습니다.
  doctrine_reference: 성전/성소 용어의 문맥적 기능
