base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/022.yaml
  text: He overlaid the whole house with gold[a], until the whole house was finished[b]; and he overlaid with gold the whole altar that belonged to the inner sanctuary.
  footnotes:
  - marker: a
    text: Or 'the whole altar of the inner sanctuary'; the Hebrew phrase may denote the altar's association with, or location relative to, the inner sanctuary.
    reason: lexical_alternative
  - marker: b
    text: Hebrew debir, the inner sanctuary, traditionally 'the Most Holy Place' or, in older English, 'the oracle.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 집 전체가 완공될 때까지 집 전체를 금으로 입혔습니다. 또 지성소[b]에 속한 제단 전체[a]를 금으로 입혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지성소의 제단 전체’. 히브리어 구문은 제단이 지성소와 관련됨을, 또는 지성소와의 위치 관계를 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 debir는 성전의 내소, 곧 지성소를 가리킵니다. 전통적으로는 ‘지성소’로, 옛 영어 성경에서는 ‘오라클’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִפָּה
  english_pob_choice: overlaid
  chosen_korean: 금으로 입혔습니다
  alternatives_korean:
