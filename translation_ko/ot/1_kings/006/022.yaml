- source_word: עַד תֹּם כָּל הַבָּיִת
  english_pob_choice: until the whole house was finished
  chosen_korean: 온 집이 완공될 때까지
  alternatives_korean:
  - 온 집이 끝날 때까지
  - 온 집이 완성될 때까지
  - 온 집이 완공될 때까지
  lexicon: HALOT
  rationale: 완성된 건축 상태를 분명히 드러내는 표현으로 옮겼고, 동사형으로 자연스럽게 재구성했습니다.
- source_word: לַדְּבִיר
  english_pob_choice: the inner sanctuary
  chosen_korean: 지성소에 속한
  alternatives_korean:
  - 지성소의
  - 내실에 속한
  - 지성소 안의
  lexicon: HALOT
  rationale: dĕbîr는 전통적으로 지성소를 가리키므로, 제단의 소속/관련을 나타내는 ל의 뉘앙스를 살려 ‘지성소에 속한’으로 옮겼습니다.
theological_decisions:
- issue: dĕbîr의 명칭을 어떻게 처리할 것인가
  chosen_reading: ‘지성소’로 옮겨 독자가 성소 구조를 즉시 이해하도록 했습니다.
  alternative_readings:
  - ‘내전’
  - ‘오라클’
  - ‘가장 거룩한 곳’
  rationale: 본문의 역사·성전 맥락에서 한국어 성경 독자에게 가장 분명한 대응어는 ‘지성소’입니다. 다만 원문의 관계구문은 소속을 강조하므로 ‘지성소에 속한’으로 표현했습니다.
  doctrine_reference: 성전 공간 용어의 문맥적 등가성
