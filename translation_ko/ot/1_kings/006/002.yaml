base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/002.yaml
  text: Now the house that King Solomon built for Yahweh was sixty cubits long[a], twenty cubits wide[c][b], and thirty cubits high.
  footnotes:
  - marker: a
    text: 'Hebrew: ''And the house ...''; the opening conjunction can also be rendered ''And'' rather than ''Now.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'its width was twenty cubits'; the Hebrew does not repeat 'cubits' in this phrase, but the unit is understood from the context.
    reason: lexical_alternative
  - marker: c
    text: '''the LORD'' renders the divine name YHWH; alternatively, ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그 집은 솔로몬 왕이 야훼를 위해 지은 집으로, 길이가 육십 규빗, 너비가 스물 규빗, 높이가 삼십 규빗이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַבַּיִת
  english_pob_choice: Now the house
  chosen_korean: 그 집은
  alternatives_korean:
  - 그리고 그 집은
  - 그 성전은
  lexicon: HALOT
  rationale: 히브리어 בַּיִת의 기본 뜻인 ‘집’을 살리되, 문맥상 성전이란 의미가 분명하므로 한국어에서는 자연스럽게 ‘그 집은’으로 시작해 원문 이미지와 서술 흐름을 함께 보존했습니다.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  english_pob_choice: King Solomon
  chosen_korean: 솔로몬 왕이
  alternatives_korean:
  - 왕 솔로몬이
  - 솔로몬 왕께서
  lexicon: HALOT
  rationale: 왕호와 인명의 결합을 현대 한국어 어순에 맞게 옮겼습니다. 서술문이므로 ‘께서’보다 ‘이’가 더 중립적입니다.
- source_word: לַיהוָה
  english_pob_choice: for the LORD / Yahweh
  chosen_korean: 야훼를 위해
  alternatives_korean:
  - 여호와를 위해
  - 주를 위해
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. ל는 목적·헌납의 의미를 띠므로 ‘~을 위해’가 가장 직접적입니다.
- source_word: שִׁשִּׁים אַמָּה ... וְעֶשְׂרִים ... וּשְׁלֹשִׁים אַמָּה
  english_pob_choice: sixty cubits long, twenty cubits wide, and thirty cubits high
  chosen_korean: 길이가 육십 규빗, 너비가 스물 규빗, 높이가 삼십 규빗
  alternatives_korean:
  - 육십 규빗 길이, 스물 규빗 너비, 삼십 규빗 높이
  - 길이는 육십 규빗, 너비는 스물 규빗, 높이는 삼십 규빗
  lexicon: HALOT
  rationale: 히브리어의 측정 표현을 한국어 수사구조로 자연스럽게 풀되, 세 치수를 모두 명시해 본문 정보를 정확히 보존했습니다. 두 번째 항목의 암시된 단위도 문맥에 따라 보충했습니다.
theological_decisions:
- issue: 신명사 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: POB의 기본 원칙에 따라 본문에 나타난 여호와/주 관습 번역보다 원어 기반의 고유명사 표기를 택했습니다. 이는 성전이 누구를 위해 지어졌는지를 분명히 드러냅니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → 야훼
