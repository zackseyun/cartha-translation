  text: וְ/הַ/בַּ֨יִת֙ בְּ/הִבָּ֣נֹת֔/וֹ אֶֽבֶן שְׁלֵמָ֥ה מַסָּ֖ע נִבְנָ֑ה וּ/מַקָּב֤וֹת וְ/הַ/גַּרְזֶן֙ כָּל כְּלִ֣י בַרְזֶ֔ל לֹֽא נִשְׁמַ֥ע בַּ/בַּ֖יִת בְּ/הִבָּנֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/007.yaml
  text: The house[a], when it was built, was built of finished stone quarried in advance; and no hammer or axe or any iron tool was heard in the house while it was being built.
  footnotes:
  - marker: a
    text: Or 'prepared at the quarry.' The Hebrew term מַסָּע is specialized and may point either to quarrying or to the stones' being brought already prepared from the quarry.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 집을 지을 때에는 미리 준비한 다듬은 돌[a]로 지었으며, 그 집을 짓는 동안에는 망치나 도끼나 어떤 철 연장 소리도 들리지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 מַסָּע는 채석장에서 돌을 다듬어 미리 준비했다는 뜻일 수도 있고, 채석장에서 이미 준비된 돌을 가져왔다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  english_pob_choice: the house
  chosen_korean: 그 집
  alternatives_korean:
  - 성전
  - 집
  lexicon: HALOT
  rationale: 히브리어 본문은 문자 그대로 '집'이므로 이를 살리되, 문맥상 솔로몬 성전임을 암시하는 자연스러운 한국어로 옮겼습니다.
- source_word: בְּהִבָּנֹתוֹ
  english_pob_choice: when it was built / while it was being built
  chosen_korean: 지어질 때에
  alternatives_korean:
  - 지어지는 동안
  - 건축되는 동안
  lexicon: HALOT
  rationale: 분사적 시간 부사구의 의미를 자연스러운 시점 표현으로 옮겨, 두 번 반복되는 시간 관계를 무리 없이 드러냈습니다.
- source_word: אֶבֶן שְׁלֵמָה מַסָּע
  english_pob_choice: finished stone quarried in advance
  chosen_korean: 미리 다듬은 돌
  alternatives_korean:
  - 채석장에서 미리 준비한 돌
  - 완전히 다듬은 돌
  lexicon: HALOT
  rationale: 완성된 돌이라는 뜻과 '미리 준비됨'이라는 POB의 해석을 함께 반영해, 현장 가공이 아니라 사전 준비된 석재라는 점을 간결하게 살렸습니다.
- source_word: מַקָּבוֹת וְהַגַּרְזֶן כָּל כְּלִי בַרְזֶל
  english_pob_choice: no hammer or axe or any iron tool
  chosen_korean: 망치나 도끼나 어떤 철 연장
  alternatives_korean:
  - 망치나 도끼나 어떤 철 공구
  - 망치나 도끼나 어떤 쇠 연장
  lexicon: HALOT
  rationale: 열거된 공구들을 한국어에서 자연스럽게 '연장'으로 묶되, '철'을 붙여 금속 재질을 분명히 했습니다.
theological_decisions:
- issue: 성전 건축의 비가공성/침묵 이미지
  chosen_reading: 현장에서는 돌을 다듬거나 철 연장을 쓰는 소리가 전혀 나지 않았다는 점을 직접적으로 드러냈습니다.
  alternative_readings:
  - 건축 현장의 정숙함을 완곡하게 표현하는 방식
  - 상징성을 부각해 의역하는 방식
  rationale: 본문의 핵심은 건축 과정에서의 철저한 준비와 현장 무소음이므로, 상징화보다 서술적 직역에 가깝게 유지했습니다.
  doctrine_reference: 1 Kings 6:7 문맥상의 성전 건축 질서와 거룩성
- issue: ‘집’과 성전의 관계
  chosen_reading: 본문의 어휘는 '집'이지만, 문맥상 야훼의 성전을 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 처음부터 '성전'으로 명시
  - 문맥 설명 없이 단순히 '집'만 유지
  rationale: 원문 어휘를 보존하되 독자가 문맥을 오해하지 않도록 최소한의 자연스러운 보완을 택했습니다.
  doctrine_reference: 문맥적 지시 대상(솔로몬 성전)
