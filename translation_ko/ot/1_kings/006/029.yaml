reference: 1 Kings 6:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵת֩ כָּל קִיר֨וֹת הַ/בַּ֜יִת מֵסַ֣ב קָלַ֗ע פִּתּוּחֵי֙ מִקְלְעוֹת֙ כְּרוּבִ֣ים וְ/תִֽמֹרֹ֔ת וּ/פְטוּרֵ֖י צִצִּ֑ים מִ/לִּ/פְנִ֖ים וְ/לַ/חִיצֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/029.yaml
  text: He carved all the walls of the house all around with engraved figures of cherubim[a], palm trees, and open flowers[c][b], on the inner and outer walls.
  footnotes:
  - marker: a
    text: Or 'flower blossoms' or 'unfolding flowers'; the Hebrew expression refers to floral decorative motifs, but the exact artistic form is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house,' a common designation here for the temple structure.
    reason: cultural_note
  - marker: c
    text: The final phrase may also be understood more generally as 'inside and outside,' though in this context it likely refers to the inner and outer sections of the sanctuary.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 집의 모든 벽에 사방으로 그룹, 종려나무, 그리고 활짝 핀 꽃의 새긴 형상들을 새겼습니다. 안쪽과 바깥쪽 모두에 그렇게 했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 장식 표현은 정확한 조형 형태가 분명하지 않으므로, ‘새긴 형상들’은 포괄적 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘집’은 일반 주택이 아니라 성전 건물을 가리키는 관용적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 마지막 구절은 보다 일반적으로 ‘안과 밖에서’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵת כָּל קִירוֹת הַבַּיִת
  english_pob_choice: all the walls of the house
  chosen_korean: 집의 모든 벽
  alternatives_korean:
  - 성전의 모든 벽
  - 그 집의 모든 벽
  lexicon: HALOT
  rationale: בַּיִת는 문자적으로 ‘집’이지만 이 문맥에서는 성전 건물을 가리키므로, 원문의 표현을 살리면서도 한국어에서 자연스럽게 ‘집’으로 옮겼습니다.
- source_word: מֵסַב
  english_pob_choice: all around
  chosen_korean: 사방으로
  alternatives_korean:
  - 둘레에
  - 온통
  lexicon: HALOT
  rationale: 벽 전체를 둘러 장식했다는 뜻이므로, 현대 한국어에서 간결하고 공간적 범위를 분명히 하는 ‘사방으로’를 선택했습니다.
- source_word: פִּתּוּחֵי מִקְלְעוֹת
  english_pob_choice: engraved figures
  chosen_korean: 새긴 형상들
  alternatives_korean:
  - 새긴 무늬들
  - 조각된 형상들
  - 새겨 넣은 장식들
  lexicon: HALOT
  rationale: 장식 조각의 결과물을 가리키므로 ‘형상들’로 대표성을 드러내고, 앞의 ‘새긴’으로 조각/각인을 반영했습니다.
- source_word: פְטוּרֵי צִצִּים
  english_pob_choice: open flowers
  chosen_korean: 활짝 핀 꽃
  alternatives_korean:
  - 꽃봉오리가 터진 꽃
  - 피어나는 꽃
  - 꽃무늬
  lexicon: HALOT
  rationale: 정확한 식물학적 형상은 불확실하지만, 장식적 꽃 모티프라는 점을 살려 시각적으로 가장 자연스러운 ‘활짝 핀 꽃’으로 옮겼습니다.
theological_decisions:
- issue: 성전 내부 장식의 공간 표현
  chosen_reading: ‘안쪽과 바깥쪽 모두에’로 옮겨, 원문이 성전의 내부·외부면 전체를 가리킨다는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘안과 밖에’
  - ‘내실과 외실에’
  rationale: 히브리어의 대비는 건물의 양면/영역 전체를 포괄하는 표현이므로, 한국어에서 오해 없이 읽히도록 공간적 범위를 유지했습니다.
  doctrine_reference: 성전 묘사 문맥의 정확한 표상
