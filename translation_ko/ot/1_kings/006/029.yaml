  source_fidelity: 히브리어는 성전인 ‘집’의 모든 벽을 둘러 그룹, 종려나무, 꽃 장식을 조각한 것을 말하며, 끝의 표현은 ‘안쪽과 바깥쪽’이라는 공간적 대조를 보존해야 합니다. 초안의 ‘활짝 핀’은 פְּטוּרֵי צִצִּים의 불확실한 조형적 뉘앙스를 다소 지나치게 확정하며, ‘새긴 형상들을 새겼습니다’는 한국어에서 중복됩니다.
