base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/017.yaml
  text: And the house[a], that is, the nave before the inner sanctuary, was forty cubits long.
  footnotes:
  - marker: a
    text: Or 'the main hall in front of it.' The Hebrew identifies 'the house' more specifically as the הֵיכָל, the main room before the inner sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 집, 곧 앞쪽 내실 앞의 주랑은 길이가 사십 규빗이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 앞의 주된 방’. 히브리어는 ‘집’을 더 구체적으로 הֵיכָל, 곧 앞쪽의 주된 방으로 설명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּיִת
  english_pob_choice: the house
  chosen_korean: 그 집
  alternatives_korean:
  - 그 성전
  - 그 건물
  lexicon: HALOT
  rationale: 히브리어 בַּיִת의 기본 의미를 살리되, 문맥상 성전 건물을 가리키므로 ‘집’으로 옮기고 지시어를 붙여 앞뒤 관계를 자연스럽게 했습니다.
- source_word: הַהֵיכָל
  english_pob_choice: the nave
  chosen_korean: 주랑
  alternatives_korean:
  - 내진
  - 큰 방
  - 성소
  lexicon: HALOT
  rationale: הֵיכָל은 여기서 내실 앞의 मुख्य 공간을 가리키므로, 교회 전통 용어인 ‘성소’보다 건축적 의미를 드러내는 ‘주랑’을 택했습니다.
- source_word: לִפְנָי
  english_pob_choice: before the inner sanctuary
  chosen_korean: 앞쪽 내실 앞의
  alternatives_korean:
  - 내실 앞에 있는
  - 내실 앞
  - 그 앞에
  lexicon: HALOT
  rationale: לִפְנֵי의 ‘~앞에’라는 관계를 살리면서, 앞선 절의 내실을 가리키는 연결을 분명히 하기 위해 ‘앞쪽 내실 앞의’로 표현했습니다.
- source_word: אַרְבָּעִים בָּאַמָּה
  english_pob_choice: forty cubits long
  chosen_korean: 길이가 사십 규빗이었습니다
  alternatives_korean:
  - 사십 규빗이었습니다
  - 사십 규빗 길이였습니다
  lexicon: HALOT
  rationale: אַמָּה는 ‘규빗’으로 옮기고, 히브리어의 치수 서술을 한국어 문장으로 자연스럽게 풀어 ‘길이가 …였습니다’로 처리했습니다.
theological_decisions:
- issue: 성전 구조를 설명하는 절에서 번역어의 전문성과 가독성의 균형
  chosen_reading: 건축적 용어를 유지하되, 문맥상 성전 내부 공간임이 드러나도록 번역했습니다.
  alternative_readings:
  - 전통적 교회 용어를 따라 ‘성소’로 옮기는 읽기
  - 더 일반적으로 ‘큰 방’으로 옮기는 읽기
  rationale: 이 절은 예배 신학보다 건물의 치수를 설명하는 문맥이므로, מקור의 구조적 구분을 흐리지 않도록 건축적 표현을 우선했습니다.
  doctrine_reference: 1 Kings 6장의 성전 건축 서술
