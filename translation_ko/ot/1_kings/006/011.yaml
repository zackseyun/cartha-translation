lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 임하여
  alternatives_korean:
  - 있었습니다
  - 이르렀습니다
  - 임했습니다
  lexicon: HALOT
  rationale: 히브리어 서술 진행 공식인 וַיְהִי를 한국어에서는 ‘말씀이 … 임하여’로 옮기면, 영어 POB의 자연스러운 진행감과 예언적 공식성을 함께 살릴 수 있습니다.
- source_word: דְּבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: דְּבַר יְהוָה의 고정된 신적 계시 공식을 살려 ‘말씀’으로 번역했습니다. ‘메시지’보다 성서적 반복 표현과의 연결이 분명합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 원문 고유명사인 יהוה를 POB 기본 원칙에 따라 ‘야훼’로 옮겼습니다. ‘주님’은 호칭으로 바뀌어 이름의 직접성이 약해지고, ‘여호와’는 전통적 음역이지만 본 프로젝트 기본값에 맞지 않습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하여
  - 이르시되
  lexicon: HALOT
  rationale: לֵאמֹר는 뒤따르는 직접 화법을 여는 표지이므로, 한국어에서는 반복을 피하면서도 계시의 인용 기능을 살려 종결 동사로 자연스럽게 정리했습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 신적 발화의 직설성
  chosen_reading: 하나님의 고유명사를 ‘야훼’로 유지하고, 직접 발화를 평서문 형태로 옮겼습니다.
  alternative_readings:
  - ‘주께서’로 완곡화
  - ‘여호와’ 전통 표기
  rationale: 이 구절은 왕에게 임한 야훼의 말씀이라는 점이 핵심이므로, 제목어로 순화하지 않고 고유명을 드러내는 편이 원문과 POB의 의도를 더 정확히 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
