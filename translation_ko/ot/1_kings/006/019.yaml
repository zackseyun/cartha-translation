base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/019.yaml
  text: And he prepared the inner sanctuary within the house[a], to place there the ark of the covenant of Yahweh.
  footnotes:
  - marker: a
    text: Hebrew debir, traditionally 'oracle'; here it refers to the inner sanctuary, the innermost room of the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼의 언약궤를 그곳에 두기 위하여 집 안쪽에 내전[a]을 마련했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דְבִיר는 전통적으로 ‘신탁소’로 옮기기도 합니다. 여기서는 성전의 가장 안쪽 방, 곧 내전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבִיר
  english_pob_choice: inner sanctuary
  chosen_korean: 내전
  alternatives_korean:
  - 안방
  - 내실
  - 지성소
  lexicon: HALOT
  rationale: 성전 문맥에서 דְבִיר는 가장 안쪽 방, 곧 거룩한 공간을 가리키므로, 기능과 위치를 드러내는 ‘내전’으로 옮겼습니다. 전통적 표현인 ‘지성소’는 의미는 가깝지만 원문의 공간 지시를 직접 보여 주지 않아 본문 설명이 따로 없는 경우에는 덜 직관적입니다.
- source_word: בְּתוֹךְ הַבַּיִת מִפְּנִימָה
  english_pob_choice: within the house
  chosen_korean: 집 안의 안쪽에
  alternatives_korean:
  - 집 안에
  - 집 내부에
  - 집 한가운데에
  lexicon: HALOT
  rationale: ‘house’를 직역해 ‘집’으로 두되, 본문이 강조하는 내부성을 한국어에서 자연스럽게 살리기 위해 ‘안쪽에’로 표현했습니다. ‘성전’은 문맥상 분명하지만 원문의 בַּיִת를 직접 살리기 위해 선택하지 않았습니다.
- source_word: הֵכִין
  english_pob_choice: prepared
  chosen_korean: 마련하여
  alternatives_korean:
  - 준비하여
  - 설비하여
  - 갖추어
  lexicon: HALOT
  rationale: 히브리어는 무엇인가를 목적에 맞게 마련해 두는 뜻이므로, 건축 맥락에서 자연스럽고 완결성 있는 ‘마련하여’로 옮겼습니다.
- source_word: לְתִתֵּן שָׁם
  english_pob_choice: to place there
  chosen_korean: 거기에 두게 했습니다
  alternatives_korean:
  - 거기에 놓게 했습니다
  - 거기에 두었습니다
  - 거기에 배치하게 했습니다
  lexicon: HALOT
  rationale: 목적의 부정사 구조를 한국어에서 자연스럽게 풀어, 앞선 동작의 목적 결과를 드러내는 ‘두게 했습니다’로 옮겼습니다.
- source_word: אֲרוֹן בְּרִית יְהוָה
  english_pob_choice: the ark of the covenant of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 야훼의 계약궤
  - 야훼와의 언약궤
  - 야훼의 언약 상자
  lexicon: HALOT
  rationale: 보관 대상이 분명한 고정 표현이므로 ‘언약궤’로 옮겼고, יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 표기했습니다. ‘계약’은 한국어 의미가 다소 협소하므로 피했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 본문의 여호와/주 대신 고유명사 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 원문은 יְהוָה를 직접 사용하므로, 신적 호칭으로 대체하지 않고 고유명을 드러내는 것이 소스-직역 원리에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
