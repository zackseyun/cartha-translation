  rationale: אוּלָם은 성전 앞의 출입 구조를 가리키므로, 한국어에서는 건축적 의미를 살리는 ‘주랑’이 가장 자연스럽고 격식도 맞습니다.
- source_word: הֵיכַל הַבַּיִת
  english_pob_choice: the nave of the house
  chosen_korean: 성전 본전
  alternatives_korean:
