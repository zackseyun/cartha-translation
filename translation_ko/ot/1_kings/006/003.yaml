id: 1KI.6.3
reference: 1 Kings 6:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ/אוּלָ֗ם עַל פְּנֵי֙ הֵיכַ֣ל הַ/בַּ֔יִת עֶשְׂרִ֣ים אַמָּה֙ אָרְכּ֔/וֹ עַל פְּנֵ֖י רֹ֣חַב הַ/בָּ֑יִת עֶ֧שֶׂר בָּ/אַמָּ֛ה רָחְבּ֖/וֹ עַל פְּנֵ֥י הַ/בָּֽיִת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/003.yaml
  text: The portico in front of the nave of the house was twenty cubits long[a], across the width of the house[c][b], and ten cubits deep in front of the house.
  footnotes:
  - marker: a
    text: Or 'porch' or 'vestibule' for 'portico.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the nave of the house'; that is, the main hall of the temple building.
    reason: lexical_alternative
  - marker: c
    text: Literally 'its width'; the sense here is the portico's depth extending outward in front of the house.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 집의 주랑은 집의 전면에 있는 성전 본전의 넓이와 맞먹는 이십 규빗 길이였고, 십 규빗 너비로 집 앞에 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주랑’은 성전 앞의 출입 구조를 가리키는 말로, 영어 POB의 ‘portico’에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘성전 본전’은 성전 건물의 중심 큰방, 곧 main hall을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그 너비’이지만, 문맥상 주랑의 앞뒤 길이를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאוּלָם
  english_pob_choice: the portico
  chosen_korean: 주랑
  alternatives_korean:
  - 현관
  - 현관채
  - 포르티코
  lexicon: HALOT
  rationale: אוּלָם은 성전 앞의 출입 구조를 가리키므로, 한국어에서는 건축적 의미를 살리는 ‘주랑’이 가장 자연스럽고 격식도 맞습니다.
- source_word: הֵיכַל הַבַּיִת
  english_pob_choice: the nave of the house
  chosen_korean: 성전 본전
  alternatives_korean:
  - 집의 내전
  - 성전의 큰방
  - 성전 본당
  lexicon: HALOT
  rationale: הֵיכַל은 이 문맥에서 앞뜰이나 지성소가 아닌 중심 건물을 가리키므로, ‘본전’으로 옮겨 구조적 대비를 살렸습니다.
- source_word: עַל־פְּנֵי רֹחַב הַבָּיִת
  english_pob_choice: across the width of the house
  chosen_korean: 집의 전면에 있는 성전 본전의 넓이와 맞먹는
  alternatives_korean:
  - 집의 너비를 따라
  - 집의 너비에 맞게
  - 집의 폭에 걸쳐
  lexicon: HALOT
  rationale: 히브리어는 주랑의 길이가 집의 너비와 대응함을 설명하므로, 단순히 ‘가로로’가 아니라 대응 관계가 드러나도록 풀어 옮겼습니다.
- source_word: רָחְבּוֹ
  english_pob_choice: deep
  chosen_korean: 너비
  alternatives_korean:
  - 깊이
  - 폭
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그 너비’이지만, POB 주석처럼 주랑의 앞뒤 치수를 말하는 맥락이므로 본문에서는 ‘너비’로 두고, 전체 문장으로 방향 관계를 드러냈습니다.
theological_decisions:
- issue: 성전 건축 묘사의 기술적·측정적 성격
  chosen_reading: 본문을 상징화하지 않고, 히브리어 건축 용어와 치수 관계를 그대로 전달했습니다.
  alternative_readings:
  - 상징적으로 재해석하기
  - 의미를 단순화해 ‘예배당’처럼 번역하기
  rationale: 이 절은 신학적 설명보다 성전 구조의 배치를 기록하는 본문이므로, 원문의 공간 관계와 치수 정보를 보존하는 것이 우선입니다.
  doctrine_reference: 성경 본문의 역사-문법적 의미 보존
- issue: ‘집’(בַּיִת)과 ‘성전’의 병치
  chosen_reading: ‘집’은 필요할 때 ‘성전’으로 풀이하되, 구조 설명의 반복은 한국어 문장 안에서 자연스럽게 처리했습니다.
  alternative_readings:
  - 모든 곳에서 일괄적으로 ‘성전’으로 바꾸기
  - 모든 곳에서 일괄적으로 ‘집’으로만 유지하기
  rationale: 히브리어의 직역성과 독자의 이해 사이를 조정하되, 성전 문맥이라는 점은 분명히 드러내도록 했습니다.
  doctrine_reference: 원문 어휘의 문맥적 의미 존중
