source:
  edition: WLC
  text: וְ/הָ/אוּלָ֗ם עַל פְּנֵי֙ הֵיכַ֣ל הַ/בַּ֔יִת עֶשְׂרִ֣ים אַמָּה֙ אָרְכּ֔/וֹ עַל פְּנֵ֖י רֹ֣חַב הַ/בָּ֑יִת עֶ֧שֶׂר בָּ/אַמָּ֛ה רָחְבּ֖/וֹ עַל פְּנֵ֥י הַ/בָּֽיִת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/003.yaml
  text: The portico in front of the nave of the house was twenty cubits long[a], across the width of the house[c][b], and ten cubits deep in front of the house.
  footnotes:
  - marker: a
    text: Or 'porch' or 'vestibule' for 'portico.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the nave of the house'; that is, the main hall of the temple building.
    reason: lexical_alternative
  - marker: c
    text: Literally 'its width'; the sense here is the portico's depth extending outward in front of the house.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 집의 본전 앞에 있는 주랑[a]은 그 집의 너비를 따라 길이가 이십 규빗이었고, 그 집 앞쪽으로 너비[c]가 십 규빗이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주랑’은 성전 본전 앞에 있는 출입·전면 구조를 가리킵니다. ‘현관’ 또는 ‘전실’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그 집의 본전’은 성전 건물의 주된 전당, 곧 큰방을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그 너비’입니다. 이 문맥에서는 주랑이 집 앞쪽으로 뻗어 나간 앞뒤 치수를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאוּלָם
  english_pob_choice: the portico
  chosen_korean: 주랑
  alternatives_korean:
