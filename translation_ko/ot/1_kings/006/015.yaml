  edition: WLC
  text: וַ/יִּבֶן֩ אֶת קִיר֨וֹת הַ/בַּ֤יִת מִ/בַּ֨יְתָ/ה֙ בְּ/צַלְע֣וֹת אֲרָזִ֔ים מִ/קַּרְקַ֤ע הַ/בַּ֨יִת֙ עַד קִיר֣וֹת הַ/סִּפֻּ֔ן צִפָּ֥ה עֵ֖ץ מִ/בָּ֑יִת וַ/יְצַ֛ף אֶת קַרְקַ֥ע הַ/בַּ֖יִת בְּ/צַלְע֥וֹת בְּרוֹשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/015.yaml
  text: He built the walls of the house on the inside with cedar boards[a]; from the floor of the house to the walls of the ceiling he covered them with wood on the inside[b], and he overlaid the floor of the house with boards of cypress.
  footnotes:
  - marker: a
    text: Or 'with cypress planks'; traditionally, 'with fir boards.' The Hebrew tree name may refer to a conifer such as cypress or juniper.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'to the walls of the ceiling' likely means up to the interior ceiling or roof lining.
    reason: cultural_note
translation:
  language: ko
  text: 그는 집의 벽들을 안쪽에서 백향목 판자로 만들었습니다. 집 바닥에서 천장의 벽들까지 안쪽을 나무로 입혔고,[a] 집 바닥은 노송나무 판자로 덮었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천장의 벽들’은 히브리어의 다소 특이한 표현입니다. 내부 천장이나 지붕 마감에 이르는 상단 경계를 가리키는 것으로 이해할 수 있습니다.
    reason: source_note
  - marker: b
    text: ‘노송나무’로 옮긴 히브리어 수종명은 정확한 식별이 확실하지 않습니다. 사이프러스 또는 향나무류를 가리킬 수 있으며, 전통적으로는 ‘전나무’로 번역하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: He built
  chosen_korean: 지었습니다
  alternatives_korean:
