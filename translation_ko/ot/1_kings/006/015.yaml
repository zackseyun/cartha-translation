base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/015.yaml
  text: He built the walls of the house on the inside with cedar boards[a]; from the floor of the house to the walls of the ceiling he covered them with wood on the inside[b], and he overlaid the floor of the house with boards of cypress.
  footnotes:
  - marker: a
    text: Or 'with cypress planks'; traditionally, 'with fir boards.' The Hebrew tree name may refer to a conifer such as cypress or juniper.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'to the walls of the ceiling' likely means up to the interior ceiling or roof lining.
    reason: cultural_note
translation:
  language: ko
  text: 그는 백향목 널빤지로 집의 벽들을 집 안쪽에 지었으며, 집 바닥에서 천장 벽들까지 그것들을 집 안쪽에 나무로 입혔고, 집의 바닥에는 잣나무 널빤지로 덧댔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천장 벽들’은 히브리어의 다소 특이한 표현을 따라간 것으로, 내부의 상단 마감 경계를 가리키는 말로 이해할 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: He built
  chosen_korean: 지었습니다
  alternatives_korean:
  - 지어졌습니다
  - 세웠습니다
  lexicon: HALOT
  rationale: 서술형 wayyiqtol의 연속 동작을 자연스럽게 옮기되, 건축 행위를 분명히 드러내기 위해 ‘지었습니다’를 택했습니다.
- source_word: צַלְעוֹת אֲרָזִים
  english_pob_choice: cedar boards
  chosen_korean: 백향목 널빤지
  alternatives_korean:
  - 백향목 판자
  - 백향목 판
  - 백향목 보드
  lexicon: HALOT
  rationale: 이 건축 문맥의 צַלְעוֹת는 측면 ‘갈빗대’보다 표면을 대는 목재 널빤지로 이해하는 것이 자연스러워, 성경 한국어에서 무난한 ‘널빤지’를 사용했습니다.
- source_word: מִבַּיְתָה / מִבָּיִת
  english_pob_choice: on the inside / on the inside
  chosen_korean: 집 안쪽에
  alternatives_korean:
  - 집 내부에
  - 안쪽에서
  - 안에
  lexicon: HALOT
  rationale: 반복되는 내부 방향 표현을 한국어로는 한결같이 ‘집 안쪽에’로 옮겨, 외부가 아니라 내부 면을 덧댄다는 점을 분명히 했습니다.
- source_word: עַד קִירוֹת הַסִּפֻּן
  english_pob_choice: to the walls of the ceiling
  chosen_korean: 천장 벽들까지
  alternatives_korean:
  - 천장까지
  - 지붕 안쪽 벽들까지
  - 천장 막벽들까지
  lexicon: HALOT
  rationale: 히브리어의 다소 낯선 ‘천장의 벽들’ 표현을 그대로 살리되, 한국어에서는 건축 내부의 상단 경계로 이해되도록 ‘천장 벽들까지’로 옮겼습니다.
- source_word: בְּרוֹשִׁים
  english_pob_choice: cypress
  chosen_korean: 잣나무
  alternatives_korean:
  - 노송나무
  - 편백나무
  - 사이프러스
  lexicon: HALOT
  rationale: 이 수종명은 전통적으로도, 현대적으로도 확정이 쉽지 않으므로 POB의 본문 선택 ‘cypress’에 맞추되 한국어에서는 널리 이해되는 침엽수명인 ‘잣나무’로 처리했습니다.
theological_decisions:
- issue: 성전 내부 목재 마감의 묘사
  chosen_reading: 히브리어의 반복과 병렬을 살려, 성전의 벽과 바닥을 나무로 내부 마감한 공정 자체를 그대로 드러냈습니다.
  alternative_readings:
  - ‘널빤지로 장식했습니다’처럼 미화된 표현
  - ‘판벽을 둘렀습니다’ 같은 전통적 교회식 표현
  rationale: 본문은 상징 해석보다 실제 건축 재료와 작업 순서를 전달하므로, 과장 없이 물질적 공정을 직설적으로 나타내는 것이 문맥에 충실합니다.
  doctrine_reference: 성전 건축 서술의 역사적-기술적 의미
