  source_fidelity: 히브리어는 집의 내부 벽을 백향목 판자로 만들고, 바닥에서 ‘천장의 벽들’까지 내부를 나무로 입히며, 바닥을 בְּרוֹשִׁים 판자로 덮었다고 서술합니다. 초안의 ‘잣나무’는 בְּרוֹשִׁים의 가능한 현대적 식별 및 영어 POB의 ‘cypress’와 맞지 않으므로 수정이 필요합니다.
