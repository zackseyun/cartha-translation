  text: וּ/שְׁתֵּ֥י דַלְת֖וֹת עֲצֵ֣י בְרוֹשִׁ֑ים שְׁנֵ֨י צְלָעִ֜ים הַ/דֶּ֤לֶת הָֽ/אַחַת֙ גְּלִילִ֔ים וּ/שְׁנֵ֧י קְלָעִ֛ים הַ/דֶּ֥לֶת הַ/שֵּׁנִ֖ית גְּלִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/034.yaml
  text: and two doors of cypress wood[a]; the one door had two folding leaves[b], and the second door had two folding leaves.
  footnotes:
  - marker: a
    text: Or 'two side pieces ... revolving'; the Hebrew architectural terms are rare, and the sense is commonly understood as folding door leaves.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'fir wood'; the Hebrew בְּרוֹשׁ likely refers to cypress or a similar conifer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 잣나무로 만든 두 문의[a] — 첫째 문의는 두 개의 접는 짝문[b]이 있고, 둘째 문에도 두 개의 접는 짝문이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּרוֹשׁ은 전통적으로 ‘전나무’로 옮겨졌지만, 여기서는 현대 학계에서 흔한 ‘잣나무/측백류’ 계열 이해를 반영했습니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀한 건축 용어라서, 문짝이 접히며 열리는 구조라는 기능적 의미를 드러내어 옮겼습니다.
    reason: lexical_alternative
