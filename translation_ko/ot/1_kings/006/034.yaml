base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/034.yaml
  text: and two doors of cypress wood[a]; the one door had two folding leaves[b], and the second door had two folding leaves.
  footnotes:
  - marker: a
    text: Or 'two side pieces ... revolving'; the Hebrew architectural terms are rare, and the sense is commonly understood as folding door leaves.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'fir wood'; the Hebrew בְּרוֹשׁ likely refers to cypress or a similar conifer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 사이프러스 나무로 만든 두 문이 있었습니다[a]. 첫째 문은 두 짝으로 접히는 문이었고[b], 둘째 문도 두 짝으로 접히는 문이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּרוֹשׁ은 전통적으로 ‘전나무’로 옮겨졌습니다. 현대 학계에서는 흔히 사이프러스나 그와 비슷한 침엽수로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 건축 용어들은 드물게 쓰여 정확한 구조가 확실하지 않습니다. 흔히 각 문이 두 짝으로 접히거나 움직이는 구조였다는 뜻으로 이해합니다.
    reason: lexical_alternative
