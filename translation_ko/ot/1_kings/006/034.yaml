  lexicon: HALOT
  rationale: 복수형이지만 한국어에서는 자연스럽게 ‘두 문’으로 옮겨 전체 구조를 살렸습니다. 직역적인 ‘문짝’보다 본문의 건축 묘사에 더 자연스럽습니다.
- source_word: עֲצֵי בְרוֹשִׁים
