  english_pob_choice: the house
  chosen_korean: 그 집
  alternatives_korean:
  - 성전
  - 그 성전
  lexicon: HALOT
  rationale: 히브리어가 문자적으로는 ‘집’이므로 이를 살리되, 문맥상 성전을 가리키는 표현임을 반영하기 위해 관형사 ‘그’를 붙였습니다.
- source_word: וַיְכַלֵּהוּ
