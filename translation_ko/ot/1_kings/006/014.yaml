lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: built
  chosen_korean: 건축하고
  alternatives_korean:
  - 지어
  - 세우고
  lexicon: HALOT
  rationale: 완료된 서술 진행을 살리면서도, 성전 문맥의 대규모 공사 성격을 드러내는 동사로 ‘건축하다’를 택했습니다.
- source_word: שְׁלֹמֹה
  english_pob_choice: Solomon
  chosen_korean: 솔로몬
  alternatives_korean: []
  lexicon: 고유명사
  rationale: 통용되는 현대 한국어 음역을 따랐습니다.
- source_word: הַבַּיִת
  english_pob_choice: the house
  chosen_korean: 그 집
  alternatives_korean:
  - 성전
  - 그 성전
  lexicon: HALOT
  rationale: 히브리어가 문자적으로는 ‘집’이므로 이를 살리되, 문맥상 성전을 가리키는 표현임을 반영하기 위해 관형사 ‘그’를 붙였습니다.
- source_word: וַיְכַלֵּהוּ
  english_pob_choice: finished it
  chosen_korean: 그것을 마무리했습니다
  alternatives_korean:
  - 그것을 완성했습니다
  - 그것을 끝냈습니다
  lexicon: HALOT
  rationale: 직접목적어 대명사 ‘그것’을 분명히 하고, כלה의 완료·마침 의미를 자연스러운 현대 문체로 옮겼습니다.
theological_decisions:
- issue: הַבַּיִת의 번역에서 ‘성전’으로 의역할지 여부
  chosen_reading: 본문 표면어를 살려 ‘그 집’으로 옮기되, 문맥상 성전 건축을 가리킨다는 점은 독자가 자연스럽게 파악하도록 했습니다.
  alternative_readings:
  - 성전
  - 그 성전
  rationale: 이 절의 히브리어는 관용적으로 성전을 뜻하지만, POB 원문 방침에 따라 문자적 표현을 유지하는 쪽이 स्रोत-가깝고 주석적 구분도 보존합니다.
  doctrine_reference: 본문-우선 번역 원칙
