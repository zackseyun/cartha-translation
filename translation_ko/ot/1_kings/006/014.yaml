  rationale: 직접목적어 대명사 ‘그것’을 분명히 하고, כלה의 완료·마침 의미를 자연스러운 현대 문체로 옮겼습니다.
theological_decisions:
- issue: הַבַּיִת의 번역에서 ‘성전’으로 의역할지 여부
  chosen_reading: 본문 표면어를 살려 ‘그 집’으로 옮기되, 문맥상 성전 건축을 가리킨다는 점은 독자가 자연스럽게 파악하도록 했습니다.
  alternative_readings:
  - 성전
  - 그 성전
  rationale: 이 절의 히브리어는 관용적으로 성전을 뜻하지만, POB 원문 방침에 따라 문자적 표현을 유지하는 쪽이 स्रोत-가깝고 주석적 구분도 보존합니다.
  doctrine_reference: 본문-우선 번역 원칙
