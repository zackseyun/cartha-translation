id: 1KI.6.21
reference: 1 Kings 6:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְצַ֨ף שְׁלֹמֹ֧ה אֶת הַ/בַּ֛יִת מִ/פְּנִ֖ימָה זָהָ֣ב סָג֑וּר וַ/יְעַבֵּ֞ר ב/רתיקות זָהָב֙ לִ/פְנֵ֣י הַ/דְּבִ֔יר וַ/יְצַפֵּ֖/הוּ זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/021.yaml
  text: Solomon overlaid the inside of the house with pure gold[a], and he drew gold chains across the front of the inner sanctuary[c][b], and overlaid it with gold.
  footnotes:
  - marker: a
    text: Or 'refined gold.' The Hebrew phrase literally reads 'gold, closed/shut,' an idiom for high-quality gold.
    reason: lexical_alternative
  - marker: b
    text: Or 'before the inner sanctuary.' The Hebrew may describe gold chains placed in front of the inner sanctuary; 'across the front of' reflects the likely sense with the verb 'caused to pass.'
    reason: alternative_reading
  - marker: c
    text: '''Inner sanctuary'' refers to the debir, the innermost room of the temple, later called the Most Holy Place.'
    reason: cultural_note
translation:
  language: ko
  text: 솔로몬은 집 안쪽을 순금으로 입혔으며, 금 사슬을 내실 앞에 드리우고 그 위를 금으로 입혔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘순금’은 히브리어의 문자적 표현(‘닫힌/정제된 금’)을 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내실’은 성전의 가장 안쪽 방을 가리키며, 후대에는 보통 ‘지성소’로 불립니다.
    reason: cultural_note
  - marker: c
    text: ‘드리우고’는 금 사슬을 단순히 두는 것이 아니라 앞쪽에 걸쳐 놓는 동작을 반영합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַף
  english_pob_choice: overlaid
  chosen_korean: 입혔으며
  alternatives_korean:
  - 덮었으며
  - 씌웠으며
  - 입혔고
  lexicon: HALOT
  rationale: 성전 내부를 금속 층으로 덮는 맥락이므로, 현대 한국어에서는 ‘입히다’가 구조물 표면을 금으로 처리하는 뜻을 가장 자연스럽게 전달합니다.
- source_word: זָהָב סָגוּר
  english_pob_choice: pure gold
  chosen_korean: 순금
  alternatives_korean:
  - 정련된 금
  - 정금
  - 고운 금
  lexicon: HALOT
  rationale: 히브리어는 고급의 정제된 금을 가리키며, ‘순금’이 그 품질과 장식적 맥락을 가장 간결하게 드러냅니다.
- source_word: בְּרַתּוּקוֹת
  english_pob_choice: chains
  chosen_korean: 금 사슬
  alternatives_korean:
  - 사슬
  - 사슬줄
  - 연쇄
  lexicon: HALOT
  rationale: 문맥상 금으로 된 장식성 구조물이므로, 단순 ‘사슬’보다 재료를 밝힌 ‘금 사슬’이 본문의 시각적 의미를 더 분명하게 살립니다.
- source_word: לִפְנֵי הַדְּבִיר
  english_pob_choice: across the front of the inner sanctuary
  chosen_korean: 내실 앞에
  alternatives_korean:
  - 지성소 앞에
  - 내실 앞쪽에
  - 성소 앞에
  lexicon: HALOT
  rationale: 본문의 debir는 성전의 가장 안쪽 방이므로 ‘내실’로 옮기되, 영어 POB의 절제된 처리에 따라 본문에는 간명하게 두고 footnote로 의미를 보완합니다.
- source_word: הַדְּבִיר
  english_pob_choice: the inner sanctuary
  chosen_korean: 내실
  alternatives_korean:
  - 내성소
  - 지성소
  - 가장 안쪽 방
  lexicon: HALOT
  rationale: ‘내실’은 왕상 문맥에서 성전의 가장 안쪽 공간을 자연스럽고 과도한 교단 용어 없이 전달할 수 있는 표현입니다.
theological_decisions:
- issue: debir의 한국어 용어 선택과 전통 교회 용어 사용 여부
  chosen_reading: 본문에는 ‘내실’을 사용하고, 주석으로 그것이 성전의 가장 안쪽 방, 곧 후대에 ‘지성소’로 불리는 공간임을 밝힙니다.
  alternative_readings:
  - 지성소를 본문에 직접 사용
  - 내성소를 본문에 직접 사용
  rationale: 히브리어 원문의 공간적 표현을 우선 살리되, 후대의 제도적·전통적 용어를 본문에 선행 적용하지 않기 위해서입니다.
  doctrine_reference: 성전 용어의 역사적-문맥적 번역 원칙
- issue: וַיְעַבֵּר의 동작과 금 사슬의 배치
  chosen_reading: ‘금 사슬을 내실 앞에 드리우고’로 옮겨, 단순한 위치 지정이 아니라 앞쪽에 걸쳐 놓는 동작을 드러냅니다.
  alternative_readings:
  - 금 사슬을 내실 앞에 두고
  - 금 사슬을 내실 앞을 지나가게 하고
  rationale: 영어 POB가 ‘across the front of’로 의미를 밝혔듯이, 히브리어의 ‘지나가게 하다’는 감각을 한국어에서 자연스럽게 재현해야 합니다.
  doctrine_reference: 성전 장식 묘사의 서술 충실성
- issue: סָגוּר의 의미 전달
  chosen_reading: ‘순금’으로 옮겨 금의 질을 분명히 하되, 본문에는 과도한 해설을 넣지 않습니다.
  alternative_readings:
  - 정련된 금
  - 고운 금
  - 닫힌 금
  rationale: 히브리어 어형의 문자적 뉘앙스보다 문맥상 품질 의미가 핵심이므로, 독자가 즉시 이해할 수 있는 표현을 택했습니다.
  doctrine_reference: 어휘 의미의 문맥 우선 원칙
