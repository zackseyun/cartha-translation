  text: וּ/בַ/שָּׁנָה֩ הָ/אַחַ֨ת עֶשְׂרֵ֜ה בְּ/יֶ֣רַח בּ֗וּל ה֚וּא הַ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֔י כָּלָ֣ה הַ/בַּ֔יִת לְ/כָל דְּבָרָ֖י/ו וּ/לְ/כָל משפט/ו וַ/יִּבְנֵ֖/הוּ שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/038.yaml
  text: And in the eleventh year[a], in the month of Bul (that is, the eighth month), the house was finished in all its parts and according to all its specifications[b]. So he built it in seven years.
  footnotes:
  - marker: a
    text: Bul was the older name for the eighth month in the Israelite calendar.
    reason: cultural_note
  - marker: b
    text: Or “according to all its details and all its prescribed plan.”
    reason: lexical_alternative
translation:
  language: ko
  text: 열한째 해[a], 곧 불월(즉, 여덟째 달)에 집이 그 모든 부분과 그 모든 규정에 따라 완성되었습니다[b]. 그래서 그는 그것을 칠 년 만에 지었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 불은 이스라엘 달력의 여덟째 달을 가리키는 옛 달명입니다.
    reason: cultural_note
  - marker: b
    text: 또는 “그 모든 세부와 그 모든 정해진 계획에 따라.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׁנָה הָאַחַת עֶשְׂרֵה
  english_pob_choice: in the eleventh year
  chosen_korean: 열한째 해
  alternatives_korean:
  - 일레븐 해
  - 열한 해
  lexicon: HALOT
  rationale: 히브리어의 서수 표현을 자연스러운 현대 한국어 서수로 옮겨 연대기 정보를 간결하게 전달했습니다.
- source_word: בְּיֶרַח בּוּל
  english_pob_choice: in the month of Bul
  chosen_korean: 불월
  alternatives_korean:
  - 불 달
  - 불월(월명 음역 유지)
  lexicon: HALOT
  rationale: בּוּל은 고대 이스라엘의 월명으로 음역을 유지하고, 한국어에서는 월명임을 드러내기 위해 ‘불월’로 처리했습니다.
- source_word: לְכָל דְּבָרָיו וּלְכָל מִשְׁפָּטוֹ
  english_pob_choice: in all its parts and according to all its specifications
  chosen_korean: 그 모든 부분과 그 모든 규정에 따라
  alternatives_korean:
  - 그 모든 세부와 그 모든 정해진 계획에 따라
  - 그 모든 항목과 그 모든 시방에 따라
  lexicon: HALOT
  rationale: דְּבָרָיו와 מִשְׁפָּטוֹ는 건축 맥락에서 단순한 ‘말’이나 법정 판결이 아니라 구성 요소와 정해진 기준을 가리키므로, ‘부분’과 ‘규정’으로 자연스럽게 살렸습니다.
- source_word: שֶׁבַע שָׁנִים
  english_pob_choice: in seven years
  chosen_korean: 칠 년 만에
  alternatives_korean:
  - 일곱 해 동안
  - 칠 년 동안
  lexicon: HALOT
  rationale: 완료된 건축 기간을 한국어 자연어로 요약하는 표현으로 ‘만에’를 사용해 총 소요 기간을 분명히 했습니다.
theological_decisions:
- issue: 성전 건축의 완성 표현
  chosen_reading: ‘집이 … 완성되었습니다’로, 성전 건축의 종료를 단순 사실 진술로 옮겼습니다.
  alternative_readings:
  - ‘집이 … 끝났습니다’
  - ‘집이 … 세워졌습니다’
  rationale: 히브리어 כָּלָה는 이 문맥에서 건축의 완결을 뜻하므로, 과장 없이 완성 상태를 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: 1 Kings 6장의 성전 건축 서술 문맥
- issue: ‘불’의 설명 절 처리
  chosen_reading: ‘곧 불월(즉, 여덟째 달)’로 풀어, 고대 월명과 달력상 대응을 함께 제시했습니다.
  alternative_readings:
  - ‘즉, 여덟째 달’만 제시
  - 주석 없이 ‘불월’만 표기
  rationale: 본문의 설명적 동격구는 독자가 고대 월명을 이해하도록 돕는 기능이 있으므로, 본문 안에서 최소한의 설명을 살렸습니다.
  doctrine_reference: 본문 주석/문화 설명 원칙
