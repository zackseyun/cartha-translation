id: 1KI.6.30
reference: 1 Kings 6:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת קַרְקַ֥ע הַ/בַּ֖יִת צִפָּ֣ה זָהָ֑ב לִ/פְנִ֖ימָה וְ/לַ/חִיצֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/030.yaml
  text: He overlaid the floor of the house with gold[b][a], on the inside and on the outside.
  footnotes:
  - marker: a
    text: Or 'the floor of the temple.' Hebrew literally, 'the floor of the house.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'on the inside and on the outside' likely describes the floor as gold-covered throughout, from the inner part to the outer part.
    reason: cultural_note
translation:
  language: ko
  text: 그는 집의 바닥을 안쪽과 바깥쪽에 걸쳐 금으로 입혔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전의 바닥’. 히브리어는 문자적으로 ‘집의 바닥’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘안쪽과 바깥쪽에’라는 말은 바닥 전체가 안에서 밖까지 금으로 입혀졌음을 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: קַרְקַ֥ע
  english_pob_choice: floor
  chosen_korean: 바닥
  alternatives_korean:
  - 마루
  - 바닥면
  - 땅
  lexicon: HALOT
  rationale: 성전 건축 문맥에서 건물의 표면을 가리키므로, 현대 한국어에서는 자연스럽고 구조를 잘 드러내는 ‘바닥’이 가장 적절합니다.
- source_word: הַ/בַּ֖יִת
  english_pob_choice: the house
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 전각
  lexicon: HALOT
  rationale: 원문은 해석어보다 직역어 ‘집’을 쓰므로 이를 유지하되, 문맥상 성전 건축임은 앞뒤로 충분히 드러납니다.
- source_word: צִפָּ֣ה
  english_pob_choice: overlaid
  chosen_korean: 금으로 입혔습니다
  alternatives_korean:
  - 금으로 덮었습니다
  - 금으로 입혔습니다
  - 도금했습니다
  lexicon: HALOT
  rationale: 표면을 재료로 씌우거나 입히는 의미를 살리면서, 건축 묘사에 자연스러운 ‘입혔습니다’로 옮겼습니다.
- source_word: לִ/פְנִימָה ... וְ/לַ/חִיצוֹן
  english_pob_choice: on the inside and on the outside
  chosen_korean: 안쪽과 바깥쪽에 걸쳐
  alternatives_korean:
  - 안쪽과 바깥쪽에서
  - 안과 밖에
  - 내부와 외부에
  lexicon: HALOT
  rationale: 원문은 안쪽/바깥쪽의 대구로 금 입힘의 범위를 나타내므로, 의미를 보존하면서도 한국어 문장으로는 ‘걸쳐’가 가장 자연스럽습니다.
theological_decisions:
- issue: 성전 바닥의 금 입힘 범위 표현
  chosen_reading: ‘안쪽과 바깥쪽에 걸쳐’로 옮겨, 금이 부분적으로가 아니라 전반에 걸쳐 입혀졌다는 암시를 살렸습니다.
  alternative_readings:
  - ‘안과 밖에’
  - ‘내부와 외부에’
  rationale: 영어 POB의 주석처럼 이 구절은 바닥 전체를 덮은 상태를 시사하므로, 범위성을 흐리지 않도록 한국어에서도 전체적 덮임을 드러냈습니다.
  doctrine_reference: 성전 묘사의 세부는 상징을 과장하지 않고 본문이 말하는 범위를 그대로 전달하는 것이 우선입니다.
