  lexicon: ספן + גבים + שדרות
  rationale: POB의 'rows'를 따라 '줄'을 살렸고, 'boards'보다 원문 이미지에 가까운 '들보'를 택해 목재 배열을 간결하게 표현했습니다.
theological_decisions:
- issue: 성전 건축 서술의 직설적 묘사 유지
  chosen_reading: 원문의 공정 서술을 그대로 살려 상징적 확장 없이 건축 진행을 묘사했습니다.
  alternative_readings:
  - 성전을 완성하셨습니다 같은 신학적 요약
  - 예배 처소를 마련하셨습니다 같은 해석적 확장
  rationale: 이 절은 신학적 해설보다 건축 행위의 연속을 보여 주므로, 원문이 말하는 범위를 넘지 않도록 했습니다.
  doctrine_reference: 본문-우선 원칙
- issue: 백향목 구조 표현의 보존
  chosen_reading: 목재 배열을 '백향목 줄'로 남겨 원문의 반복적 구조감을 보존했습니다.
  alternative_readings:
  - 백향목 널판
  - 백향목 판자
  rationale: 영어 POB의 'rows' 선택을 반영해 단순한 판재보다 배열된 층/줄의 이미지를 유지했습니다.
  doctrine_reference: 어휘-구조 대응
