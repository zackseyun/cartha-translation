  text: 그는 그 집을 짓고 완공하였으며, 백향목 들보와 줄지은 백향목으로 그 집을 덮었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘줄지은 백향목’에 해당하는 말은 건축 부재의 정확한 형태가 불확실합니다. ‘백향목 널판’ 또는 ‘백향목 줄’로도 이해할 수 있습니다.
    reason: שְׂדֵרֹת의 불확실한 건축적 지시물을 보존하면서, 본문의 번역이 임의로 특정 구조재를 확정하지 않도록 합니다.
lexical_decisions:
- source_word: וַיִּבֶן אֶת הַבַּיִת
  english_pob_choice: he built the house
  chosen_korean: 그가 집을 건축하였으며
