  lexicon: HALOT
  rationale: 문맥상 성전 본체에 붙어 이어지는 건축 요소를 가리키므로, 개별 방으로 좁히지 않고 구조 전체를 포괄하는 ‘옆구조’로 옮겼습니다.
- source_word: עַל כָּל הַבַּיִת
