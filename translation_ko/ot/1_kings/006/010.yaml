- source_word: חָמֵשׁ אַמּוֹת קוֹמָתוֹ
  english_pob_choice: five cubits high
  chosen_korean: 높이는 다섯 규빗이었으며
  alternatives_korean:
  - 그 높이는 다섯 규빗이었으며
  - 다섯 규빗 높이였으며
  lexicon: HALOT
  rationale: 측량 표현을 한국어 자연문으로 풀어, 수치와 높이 정보를 분명히 전달했습니다.
- source_word: בַּעֲצֵי אֲרָזִים
  english_pob_choice: with cedar timbers
  chosen_korean: 백향목 들보로
  alternatives_korean:
  - 백향목 재목으로
  - 백향목 목재로
  - 백향목 보로
  lexicon: HALOT
  rationale: 건축 자재로서의 עֲצֵי אֲרָזִים를 ‘들보’로 구체화하되, POB의 구조적 의미를 유지했습니다.
theological_decisions:
- issue: 건축 동사의 수동/완료 표현
  chosen_reading: ‘붙였습니다’로 마무리해 건축 행위의 결과를 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘붙어 있었습니다’
  - ‘연결되었습니다’
  rationale: 본문은 건축된 구조가 집에 견고히 결합된 상태를 말하므로, 단순한 정적 진술보다 완료된 행위를 보여 주는 표현이 적절합니다.
  doctrine_reference: 본문의 건축 묘사
