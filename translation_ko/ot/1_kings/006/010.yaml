    reason: lexical_alternative
translation:
  language: ko
  text: 그는 온 성전 건물에 붙여 측면 구조물[a]을 지었습니다. 그 높이는 다섯 규빗이었습니다. 또 백향목 재목으로 그것을 성전 건물에 연결했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “측면 방들”. 이 히브리어는 성전 건물 옆을 따라 이어진 부속 구조 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “백향목 들보로 성전 건물에 붙어 있었습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּצוּע / היצוע
  english_pob_choice: the side structure
  chosen_korean: 옆구조
  alternatives_korean:
  - 옆칸들
  - 옆방들
  - 부속 구조물
  - 측면 구조
  lexicon: HALOT
  rationale: 문맥상 성전 본체에 붙어 이어지는 건축 요소를 가리키므로, 개별 방으로 좁히지 않고 구조 전체를 포괄하는 ‘옆구조’로 옮겼습니다.
- source_word: עַל כָּל הַבַּיִת
  english_pob_choice: against the whole house
  chosen_korean: 집 전체를 따라 붙은
  alternatives_korean:
