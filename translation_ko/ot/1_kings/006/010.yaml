  text: He built the side structure against the whole house[a], five cubits high[b], and it was fastened to the house with cedar timbers.
  footnotes:
  - marker: a
    text: Or “the side chambers”; the Hebrew term likely refers to the attached side construction running along the temple.
    reason: lexical_alternative
  - marker: b
    text: Or “was joined to the house with cedar beams.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 집 전체를 따라 붙은 옆구조를 지었는데, 높이는 다섯 규빗이었으며, 백향목 들보로 그 집에 붙였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “옆방들”; 그러나 이 히브리어는 성전 옆을 따라 이어진 부속 구조 전체를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “백향목 들보로 그 집에 붙어 있었습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּצוּע / היצוע
  english_pob_choice: the side structure
  chosen_korean: 옆구조
  alternatives_korean:
