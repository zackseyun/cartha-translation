  text: וּ/שְׁתֵּי֮ דַּלְת֣וֹת עֲצֵי שֶׁמֶן֒ וְ/קָלַ֣ע עֲ֠לֵי/הֶם מִקְלְע֨וֹת כְּרוּבִ֧ים וְ/תִמֹר֛וֹת וּ/פְטוּרֵ֥י צִצִּ֖ים וְ/צִפָּ֣ה זָהָ֑ב וַ/יָּ֛רֶד עַל הַ/כְּרוּבִ֥ים וְ/עַל הַ/תִּֽמֹר֖וֹת אֶת הַ/זָּהָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/032.yaml
  text: Also[a], the two doors were of olivewood, and he carved on them engravings of cherubim and palm trees and open flowers, and overlaid them with gold[b]; and he spread the gold over the cherubim and over the palm trees.
  footnotes:
  - marker: a
    text: Or 'carvings of cherubim and palm trees and flower blossoms.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb in the final clause is literally 'caused to go down' or 'spread down,' describing the application of gold over the carved figures.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 두 문짝은 올리브나무로 만들었으며, 그 위에 그룹들과 종려나무들과 활짝 핀 꽃들의 조각무늬를 새기고 금으로 입혔습니다. 그리고 그 금을 그룹들과 종려나무들 위에 펼쳐 입혔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 마지막 절의 히브리어 동사는 문자적으로 ‘내리다’ 또는 ‘아래로 펼치다’에 가깝지만, 여기서는 조각된 형상들 위에 금을 펼쳐 입히는 과정을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי דַּלְתֹוֹת עֲצֵי שֶׁמֶן
  english_pob_choice: the two doors were of olivewood
  chosen_korean: 그 두 문은 올리브나무로 만들었는데
  alternatives_korean:
  - 그 두 문은 올리브나무 문이었는데
  - 두 문은 올리브나무로 된 것이었는데
  lexicon: WLC; HALOT
  rationale: דַּלְתּוֹת는 문짝/문을 가리키므로 ‘문’으로 옮기고, עֲצֵי שֶׁמֶן은 자연스러운 한국어로 ‘올리브나무’로 처리했습니다.
- source_word: וְקָלַע עֲלֵיהֶם מִקְלְעוֹת
  english_pob_choice: he carved on them engravings of
  chosen_korean: 그 위에는 … 새김무늬를 새기고
  alternatives_korean:
  - 그 위에 … 조각을 새기고
  - 그 위에 … 각인 무늬를 새기고
  lexicon: HALOT
  rationale: 동사 קלע와 명사 מִקְלְעוֹת은 장식용 새김/조각을 뜻하므로, 반복을 살려 ‘새김무늬를 새기다’로 옮겼습니다.
- source_word: כְּרוּבִים וְתִמֹרוֹת וּפְטוּרֵי צִצִּים
  english_pob_choice: cherubim and palm trees and open flowers
  chosen_korean: 그룹들과 종려나무들과 열린 꽃들
  alternatives_korean:
  - 그룹들과 야자나무들과 피어난 꽃들
  - 그룹들과 종려나무 무늬들과 꽃무늬들
  lexicon: HALOT
  rationale: כְּרוּבִים는 성전 문맥의 천상 존재로 ‘그룹들’, תִמֹרוֹת는 장식 도상으로 ‘종려나무들’, פְּטוּרֵי צִצִּים는 ‘열린 꽃들’로 옮겨 시각적 형상을 유지했습니다.
- source_word: וְצִפָּה זָהָב
  english_pob_choice: overlaid them with gold
  chosen_korean: 금으로 입혔습니다
  alternatives_korean:
  - 금판을 입혔습니다
  - 금을 덧입혔습니다
  lexicon: HALOT
  rationale: צפה는 금속을 덮어 입히는 뜻이므로, 건축 장식 문맥에 자연스러운 ‘금으로 입히다’로 옮겼습니다.
- source_word: וַיָּרֶד ... אֶת הַזָּהָב
  english_pob_choice: he spread the gold over
  chosen_korean: 그리고 그 금을 … 위에 입혔습니다
  alternatives_korean:
  - 그리고 그 금을 … 위로 펼쳤습니다
  - 그리고 그 금을 … 위에 덧입혔습니다
  lexicon: HALOT
  rationale: ‘내리다/퍼뜨리다’의 문자적 의미보다, 금을 조각 위에 덮어 씌우는 결과를 한국어로 자연스럽게 드러내기 위해 ‘입혔습니다’로 처리했습니다.
theological_decisions:
- issue: 성전 장식의 표현을 문자적으로 유지할지, 상징성을 풀어 쓸지
  chosen_reading: 장식 요소를 ‘그룹들, 종려나무들, 열린 꽃들’로 직접 열거해 성전 문장식의 상징 구조를 보존했습니다.
  alternative_readings:
  - 상징적 의미를 풀어 ‘천사들’ 등으로 의역
  - ‘꽃봉오리’처럼 세부 형태를 더 특정
  rationale: 본문은 상징 해석보다 실제 조각 장식을 묘사하므로, 원문 열거를 그대로 살리는 편이 저자의 의도를 더 정확히 전달합니다.
  doctrine_reference: 성전 문맥의 상징 도상 보존
