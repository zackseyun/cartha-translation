source:
  edition: WLC
  text: פֶּ֗תַח הַ/צֵּלָע֙ הַ/תִּ֣יכֹנָ֔ה אֶל כֶּ֥תֶף הַ/בַּ֖יִת הַ/יְמָנִ֑ית וּ/בְ/לוּלִּ֗ים יַֽעֲלוּ֙ עַל הַ/תִּ֣יכֹנָ֔ה וּ/מִן הַ/תִּֽיכֹנָ֖ה אֶל הַ/שְּׁלִשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/008.yaml
  text: The entrance to the middle side chamber was on the right side of the house[a], and by winding stairs they went up to the middle story[b], and from the middle to the third.
  footnotes:
  - marker: a
    text: Or 'by spiral stairs.' The Hebrew term likely refers to winding or spiral stairways.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from the middle to the third,' that is, from the middle story to the third story.
    reason: lexical_alternative
translation:
  language: ko
  text: 중간 옆방의 입구는 집의 오른쪽에 있었고, 나선 계단으로 중간 층에 올라갔으며, 중간에서 셋째 층으로 올라갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 직역하면 ‘나선/구불구불한 계단으로’입니다. 건축 맥락에서 계단의 형태를 가리키는 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘중간에서 셋째’는 건축 문맥상 ‘중간 층에서 셋째 층으로’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּתַח
  english_pob_choice: entrance
  chosen_korean: 입구
  alternatives_korean:
  - 출입구
  - 문
  lexicon: HALOT
  rationale: פתח는 건축 문맥에서 ‘들어가는 자리’를 가리키므로, 자연스러운 현대 한국어인 ‘입구’가 가장 직접적입니다.
- source_word: הַצֵּלָע הַתִּיכֹנָה
  english_pob_choice: the middle side chamber
  chosen_korean: 중간 옆방
  alternatives_korean:
  - 중간 옆칸
  - 가운데 옆방
  - 중간 측실
  lexicon: HALOT
  rationale: 성전 건축 맥락의 צֵלָע는 ‘옆방/측실’로 옮기는 것이 적절하고, תִּיכֹנָה는 ‘중간’을 그대로 살리는 것이 원문 구조를 드러냅니다.
- source_word: וּבְלוּלִּים
  english_pob_choice: by winding stairs
  chosen_korean: 나선 계단
  alternatives_korean:
  - 구불구불한 계단
  - 나선형 계단
  - 회전 계단
  lexicon: HALOT
  rationale: 문맥상 위층으로 오르는 구조를 말하므로, ‘나선 계단’이 가장 간결하게 원문의 의미를 전달합니다.
- source_word: הַתִּיכֹנָה / הַשְּׁלִשִׁים
  english_pob_choice: the middle story / the third
  chosen_korean: 중간 층 / 셋째 층
  alternatives_korean:
  - 중간 이야기 / 셋째
  - 중간 이야기층 / 셋째 층
  - 중층 / 삼층
  lexicon: HALOT
  rationale: 히브리어는 층을 뜻하는 건축 용례이므로 ‘층’으로 풀어야 하며, 뒤의 ‘셋째’도 문맥상 ‘층’을 보충해 이해시키는 것이 자연스럽습니다.
