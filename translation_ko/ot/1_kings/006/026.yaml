base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/026.yaml
  text: The height of the one cherub was ten cubits[a], and so it was with the second cherub.
  footnotes:
  - marker: a
    text: A cubit was an ancient unit of length, roughly the distance from the elbow to the fingertips.
    reason: cultural_note
translation:
  language: ko
  text: 한 그룹의 그룹 높이는 십 규빗이었고, 둘째 그룹도 그와 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 규빗은 고대의 길이 단위로, 대략 팔꿈치에서 손끝까지의 길이입니다.
    reason: cultural_note
lexical_decisions:
- source_word: קוֹמַת
  english_pob_choice: The height of
  chosen_korean: 높이는
  alternatives_korean:
  - 키는
  - 크기는
  lexicon: HALOT
  rationale: 코마트는 여기서 물리적 높이를 가리키므로, 성구의 측정 문맥에 맞게 ‘높이’로 옮겼습니다.
- source_word: הַכְּרוּב
  english_pob_choice: the cherub
  chosen_korean: 그룹
  alternatives_korean:
  - 케루빔
  - 그룹 형상
  lexicon: HALOT
  rationale: 히브리어 כְּרוּב의 표준 음역을 따르되, 한국어 성경에서 통용되는 ‘그룹’을 사용했습니다.
- source_word: עֶשֶׂר בָּאַמָּה
  english_pob_choice: ten cubits
  chosen_korean: 십 규빗
  alternatives_korean:
  - 열 규빗
  - 열 규빗 높이
  lexicon: HALOT
  rationale: 측정 단위를 직역해 수치와 단위를 그대로 보존했습니다. ‘규빗’은 길이 단위로, 본문에 설명을 덧붙이지 않았습니다.
- source_word: וְכֵן הַכְּרוּב הַשֵּׁנִי
  english_pob_choice: and so it was with the second cherub
  chosen_korean: 둘째 그룹도 그와 같았습니다
  alternatives_korean:
  - 두 번째 그룹도 그러했습니다
  - 다른 그룹도 그랬습니다
  lexicon: HALOT
  rationale: ‘둘째’로 히브리어의 서수 표현을 살리고, ‘그와 같았습니다’로 동일성을 자연스럽게 표현했습니다.
