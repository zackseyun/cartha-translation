  rationale: 말하는 대상이 성전의 내벽/내장판이므로 위치를 ‘안쪽’으로 옮겨, 단순한 실내 존재가 아니라 안쪽 표면을 가리킨다는 점을 살렸습니다.
- source_word: מִקְלַעַת פְּקָעִים וּפְטוּרֵי צִצִּים
  english_pob_choice: carved with gourds and open flowers
  chosen_korean: 호리병박과 피어 있는 꽃들을 새겨 놓았습니다
  alternatives_korean:
  - 박들과 꽃봉오리들을 새겨 놓았습니다
  - 박 장식과 꽃무늬를 새겨 놓았습니다
  - 호리병박 모양 장식과 꽃을 새겨 놓았습니다
  lexicon: HALOT
  rationale: פְּקָעִים을 POB의 주석처럼 성전 장식 문맥의 ‘gourds’에 대응시키되 한국어로는 ‘호리병박’이 형태를 더 분명히 전달합니다. וּפְטוּרֵי צִצִּים은 ‘open flowers’에 맞춰 ‘피어 있는 꽃들’로 옮겨, 봉오리보다 개화한 꽃의 형상을 살렸습니다.
- source_word: אֵין אֶבֶן נִרְאָה
  english_pob_choice: no stone was visible
  chosen_korean: 돌은 하나도 보이지 않았습니다
  alternatives_korean:
  - 돌이 보이지 않았습니다
  - 돌 한 개도 보이지 않았습니다
  - 어느 돌도 보이지 않았습니다
  lexicon: HALOT
  rationale: 문장의 요지는 석재 구조가 백향목 판장으로 완전히 가려졌다는 뜻이므로, 자연스러운 한국어로 ‘하나도 보이지 않았다’라고 옮겼습니다.
