  text: The cedar on the inside of the house was carved with gourds and open flowers[a]. Everything was cedar[b]; no stone was visible.
  footnotes:
  - marker: a
    text: Or 'buds' for 'gourds'; the Hebrew term refers to rounded ornamental forms and may denote gourd-shaped carvings in this temple context.
    reason: lexical_alternative
  - marker: b
    text: Or 'flower blossoms' for 'open flowers.' The Hebrew likely describes carved floral blooms.
    reason: lexical_alternative
translation:
  language: ko
  text: 성전 안쪽의 백향목 판에는 박 모양 장식과 활짝 핀 꽃들을 새겨 놓았습니다[a][b]. 모두 백향목으로 되어 있었으며, 돌은 하나도 보이지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘봉오리들’. 히브리어 פְּקָעִים은 둥근 장식 형상을 가리키며, 이 성전 문맥에서는 박 모양의 조각을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘꽃송이들’ 또는 ‘꽃 장식들’. 히브리어는 새겨진 꽃이 피어 있는 모습을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶז
  english_pob_choice: cedar
  chosen_korean: 백향목
  alternatives_korean:
