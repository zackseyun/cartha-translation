  text: וְ/אֶ֤רֶז אֶל הַ/בַּ֨יִת֙ פְּנִ֔ימָה מִקְלַ֣עַת פְּקָעִ֔ים וּ/פְטוּרֵ֖י צִצִּ֑ים הַ/כֹּ֣ל אֶ֔רֶז אֵ֥ין אֶ֖בֶן נִרְאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/018.yaml
  text: The cedar on the inside of the house was carved with gourds and open flowers[a]. Everything was cedar[b]; no stone was visible.
  footnotes:
  - marker: a
    text: Or 'buds' for 'gourds'; the Hebrew term refers to rounded ornamental forms and may denote gourd-shaped carvings in this temple context.
    reason: lexical_alternative
  - marker: b
    text: Or 'flower blossoms' for 'open flowers.' The Hebrew likely describes carved floral blooms.
    reason: lexical_alternative
translation:
  language: ko
  text: 집 안쪽의 백향목에는 호리병박과 피어 있는 꽃들을 새겨 놓았습니다[a]. 전체가 백향목이어서 돌은 하나도 보이지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘봉오리들’로도 볼 수 있습니다. 히브리어 פְּקָעִים은 둥근 장식 형상을 가리키며, 이 성전 문맥에서는 호리병박 모양의 조각일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶז
  english_pob_choice: cedar
  chosen_korean: 백향목
  alternatives_korean:
  - 삼나무
  - 향나무
  lexicon: HALOT
  rationale: 성전 내부의 목재 판장 문맥이므로 한국어 성경에서 익숙한 ‘백향목’이 가장 자연스럽고, 단순한 일반 목재보다 재료와 위계를 더 분명히 드러냅니다.
- source_word: אֶל הַבַּיִת פְּנִימָה
  english_pob_choice: on the inside of the house
  chosen_korean: 집 안쪽의
  alternatives_korean:
  - 집 안에 있는
  - 집 내부의
  - 집 안쪽에
  lexicon: HALOT
  rationale: 말하는 대상이 성전의 내벽/내장판이므로 위치를 ‘안쪽’으로 옮겨, 단순한 실내 존재가 아니라 안쪽 표면을 가리킨다는 점을 살렸습니다.
- source_word: מִקְלַעַת פְּקָעִים וּפְטוּרֵי צִצִּים
  english_pob_choice: carved with gourds and open flowers
  chosen_korean: 호리병박과 피어 있는 꽃들을 새겨 놓았습니다
  alternatives_korean:
  - 박들과 꽃봉오리들을 새겨 놓았습니다
  - 박 장식과 꽃무늬를 새겨 놓았습니다
  - 호리병박 모양 장식과 꽃을 새겨 놓았습니다
  lexicon: HALOT
  rationale: פְּקָעִים을 POB의 주석처럼 성전 장식 문맥의 ‘gourds’에 대응시키되 한국어로는 ‘호리병박’이 형태를 더 분명히 전달합니다. וּפְטוּרֵי צִצִּים은 ‘open flowers’에 맞춰 ‘피어 있는 꽃들’로 옮겨, 봉오리보다 개화한 꽃의 형상을 살렸습니다.
- source_word: אֵין אֶבֶן נִרְאָה
  english_pob_choice: no stone was visible
  chosen_korean: 돌은 하나도 보이지 않았습니다
  alternatives_korean:
  - 돌이 보이지 않았습니다
  - 돌 한 개도 보이지 않았습니다
  - 어느 돌도 보이지 않았습니다
  lexicon: HALOT
  rationale: 문장의 요지는 석재 구조가 백향목 판장으로 완전히 가려졌다는 뜻이므로, 자연스러운 한국어로 ‘하나도 보이지 않았다’라고 옮겼습니다.
