  naturalness: ‘입구를 위해’는 현대 한국어 건축 서술에서 다소 직역투이므로 ‘입구에는’으로 고쳤습니다. ‘올리브나무 문들’은 나무 종류와 재료의 관계가 불분명할 수 있어 ‘올리브나무로 만든 문들’로 다듬었습니다. ‘다섯 면으로 되어 있었습니다’는 ‘오각형이었습니다’보다 구조물에 적용하기 자연스럽습니다.
