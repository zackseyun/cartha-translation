translation:
  language: ko
  text: 내부 성소의 입구를 위해 그는 올리브나무 문들을 만들었고[a], 문설주와 문틀은 오각형이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘문틀과 문설주는 다섯째 부분이었다’로도 옮길 수 있으나, 이는 전통적이지만 건축적으로는 모호한 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  english_pob_choice: entrance
  chosen_korean: 입구
  alternatives_korean:
  - 출입구
  - 문턱
  lexicon: HALOT
  rationale: פֶּתַח은 문짝 자체보다 들어가는 자리나 개구부를 가리키므로, 앞의 דַּלְתּוֹת와 구별되도록 ‘입구’로 옮겼습니다.
- source_word: הַדְּבִיר
  english_pob_choice: the inner sanctuary
  chosen_korean: 내부 성소
  alternatives_korean:
  - 내실
  - 지성소
  lexicon: HALOT
  rationale: 성전의 가장 안쪽 공간이라는 뜻을 살리면서도, 후대의 전통 용어를 과도하게 불러오지 않도록 ‘내부 성소’로 옮겼습니다.
- source_word: עֲצֵי שָׁמֶן
  english_pob_choice: olivewood
  chosen_korean: 올리브나무
  alternatives_korean:
  - 올리브나무 재목
  - 올리브나무 목재
  lexicon: HALOT
  rationale: 직역하면 ‘기름의 나무들’이지만 관용적으로 올리브나무를 가리키므로, 재료를 자연스럽게 드러내는 ‘올리브나무’로 옮겼습니다.
- source_word: חֲמִשִׁית
  english_pob_choice: were five-sided
  chosen_korean: 오각형이었습니다
  alternatives_korean:
  - 다섯 면이었습니다
  - 다섯 부분이었습니다
  lexicon: HALOT
  rationale: 문맥상 구조물의 형태를 묘사하는 압축된 표현으로 보이므로, 전통적이지만 모호한 ‘다섯 부분’보다 읽기 쉬운 ‘오각형’으로 처리했습니다.
theological_decisions:
- issue: הַדְּבִיר의 성전 내 공간 범위
  chosen_reading: ‘내부 성소’로 번역해 가장 안쪽의 거룩한 공간이라는 점을 드러냈습니다.
  alternative_readings:
  - 지성소
  - 내실
  rationale: 본문은 성전 내부의 특정 공간을 기술하는 건축 문맥이므로, 예배 전통 용어를 단정적으로 고정하기보다 원문의 공간 감각을 우선했습니다.
  doctrine_reference: 성전 구조의 서술은 신학적 해석보다 본문 묘사를 우선함
