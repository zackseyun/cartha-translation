  text: For the entrance of the inner sanctuary he made doors of olivewood[a]; the doorposts and jambs were five-sided.
  footnotes:
  - marker: a
    text: Or 'the frame and the doorposts were a fifth part,' a traditional but architecturally obscure rendering of the final phrase.
