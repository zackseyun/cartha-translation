translation:
  language: ko
  text: 내부 성소의 입구에는 그가 올리브나무로 만든 문들을 달았습니다. 상인방과 문설주는 다섯 면으로 되어 있었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘상인방과 문설주는 다섯째 부분이었다.’ 히브리어 표현은 전통적으로 이렇게도 이해되지만, 건축적 의미는 불분명합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  english_pob_choice: entrance
  chosen_korean: 입구
  alternatives_korean:
  - 출입구
  - 문턱
  lexicon: HALOT
  rationale: פֶּתַח은 문짝 자체보다 들어가는 자리나 개구부를 가리키므로, 앞의 דַּלְתּוֹת와 구별되도록 ‘입구’로 옮겼습니다.
- source_word: הַדְּבִיר
  english_pob_choice: the inner sanctuary
  chosen_korean: 내부 성소
  alternatives_korean:
