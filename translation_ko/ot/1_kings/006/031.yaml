  - 지성소
  lexicon: HALOT
  rationale: 성전의 가장 안쪽 공간이라는 뜻을 살리면서도, 후대의 전통 용어를 과도하게 불러오지 않도록 ‘내부 성소’로 옮겼습니다.
- source_word: עֲצֵי שָׁמֶן
  english_pob_choice: olivewood
  chosen_korean: 올리브나무
  alternatives_korean:
