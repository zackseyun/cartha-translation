  chosen_reading: הֵיכָל과 דְּבִיר의 구분을 ‘내전과 외소’로 보여, 본문이 강조하는 성전 구조의 단계적 구분을 유지했습니다.
  alternative_readings:
  - ‘본당과 지성소’
  - ‘성전과 지성소’
  rationale: 이 절은 건축 묘사이므로, 예배적 전통어보다 공간 대비를 선명하게 드러내는 표현이 원문의 기능에 더 가깝습니다.
  doctrine_reference: 성전 구조 묘사
