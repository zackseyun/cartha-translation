source:
  edition: WLC
  text: וַ/יִּבֶן֩ עַל קִ֨יר הַ/בַּ֤יִת יצוע סָבִ֔יב אֶת קִיר֤וֹת הַ/בַּ֨יִת֙ סָבִ֔יב לַֽ/הֵיכָ֖ל וְ/לַ/דְּבִ֑יר וַ/יַּ֥עַשׂ צְלָע֖וֹת סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/005.yaml
  text: He built against the wall of the house a structure all around[a], against the walls of the house all around, around both the nave and the inner sanctuary[c][b]; and he made side rooms all around.
  footnotes:
  - marker: a
    text: Or “a surrounding annex” for the rare Hebrew word יצוע, referring to the structure built around the temple walls.
    reason: lexical_alternative
  - marker: b
    text: Hebrew הֵיכָל refers to the main hall of the temple, distinct from the inner sanctuary (דְּבִיר).
    reason: cultural_note
  - marker: c
    text: Or “Most Holy Place” for “inner sanctuary.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 성전의 벽에 붙여 그 주위로 건물을 하나 지었고[a], 성전의 벽들 주위로, 곧 내전과 외소[a][b] 주위로 지었으며, 또 둘레에 옆방들을 만들었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘둘러싼 증축물’로 옮길 수 있는 드문 히브리어 יצוע입니다. 성전 벽 둘레에 덧붙인 구조를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 הֵיכָל은 성전의 주된 방을 가리키며, 여기서는 내실(דְּבִיר)과 구별됩니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘지성소’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: He built
  chosen_korean: 지었습니다
  alternatives_korean:
  - 세웠습니다
  - 건축했습니다
  lexicon: HALOT
  rationale: 서사 문맥의 완료형 동사를 현대 한국어 자연스러운 과거 서술로 옮겼습니다.
- source_word: עַל קִיר הַבַּיִת
  english_pob_choice: against the wall of the house
  chosen_korean: 성전의 벽에 붙여
  alternatives_korean:
  - 성전의 벽 위에
  - 성전의 벽을 따라
  lexicon: HALOT
  rationale: עַל은 여기서 ‘위에’보다 ‘붙여/맞붙여’의 건축적 관계를 나타내므로, 인접해 세운 의미를 살렸습니다.
- source_word: יְצוּעַ
  english_pob_choice: a structure all around
  chosen_korean: 건물을 하나 … 그 주위로
  alternatives_korean:
  - 주변 증축물
  - 둘레 구조물
  - 둘러싼 증축
  lexicon: HALOT
  rationale: 희귀어라서 지나치게 기술적으로 특정하기보다, 본문이 말하는 둘레를 감싼 부속 건축이라는 최소 의미를 살렸습니다.
- source_word: הֵיכָל / דְּבִיר
  english_pob_choice: the nave / the inner sanctuary
  chosen_korean: 내전과 외소
  alternatives_korean:
  - 본당과 지성소
  - 성전 본당과 내실
  lexicon: HALOT
  rationale: 두 공간의 구분을 유지하되, 한국어 성경에서 널리 통용되는 ‘지성소’보다 본문의 대비를 더 직접적으로 드러내기 위해 ‘내전/외소’의 설명적 표현을 택했습니다.
- source_word: צְלָעוֹת
  english_pob_choice: side rooms
  chosen_korean: 옆방들
  alternatives_korean:
  - 곁방들
  - 측실들
  - 옆칸들
  lexicon: HALOT
  rationale: 건축 맥락의 צְלָעוֹת를 ‘ribs’로 직역하지 않고, 부속 공간을 가리키는 의미를 살려 자연스러운 현대어로 옮겼습니다.
theological_decisions:
- issue: 성전 내부 공간 명칭의 전달
  chosen_reading: הֵיכָל과 דְּבִיר의 구분을 ‘내전과 외소’로 보여, 본문이 강조하는 성전 구조의 단계적 구분을 유지했습니다.
  alternative_readings:
  - ‘본당과 지성소’
  - ‘성전과 지성소’
  rationale: 이 절은 건축 묘사이므로, 예배적 전통어보다 공간 대비를 선명하게 드러내는 표현이 원문의 기능에 더 가깝습니다.
  doctrine_reference: 성전 구조 묘사
