  text: 그는 내실에 올리브나무로 된 두 그룹을 만들었습니다. 각 그룹의 높이는 열 규빗이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 높이는 열 규빗이었다’라고 하며, 두 그룹 각각을 가리키는 분배적 의미로 이해됩니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘가장 거룩한 곳에’.
    reason: alternative_reading
