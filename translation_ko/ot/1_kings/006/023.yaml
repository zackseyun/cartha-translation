    text: Hebrew literally, 'its height was ten cubits'; the singular is understood distributively, referring to each of the two cherubim.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the Most Holy Place.'
    reason: lexical_alternative
translation:
