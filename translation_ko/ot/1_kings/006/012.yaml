source:
  edition: WLC
  text: הַ/בַּ֨יִת הַ/זֶּ֜ה אֲשֶׁר אַתָּ֣ה בֹנֶ֗ה אִם תֵּלֵ֤ךְ בְּ/חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֣/י תַּֽעֲשֶׂ֔ה וְ/שָׁמַרְתָּ֥ אֶת כָּל מִצְוֺתַ֖/י לָ/לֶ֣כֶת בָּ/הֶ֑ם וַ/הֲקִמֹתִ֤י אֶת דְּבָרִ/י֙ אִתָּ֔/ךְ אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל דָּוִ֥ד אָבִֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/012.yaml
  text: As for this house that you are building[a], if you walk in my statutes, carry out my judgments, and keep all my commandments by walking in them, then I will establish my word with you, which I spoke to David your father.
  footnotes:
  - marker: a
    text: Or 'confirm my word with you' or 'fulfill my promise with you.' The Hebrew idiom 'establish my word' refers to confirming what was previously spoken.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 집은 당신이 짓고 있는 집입니다. 당신이 내 규례들 가운데 걸으며 내 법규들을 행하고 내 모든 명령을 지켜 그것들 안에서 걸으면, 내가 당신과 함께 내 말을 세울 것입니다. 나는 그것을 당신의 아버지 다윗에게 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “내 말을 세울 것입니다”는 히브리어 관용구로, 앞서 하신 말씀이나 약속을 확정·성취한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת הַזֶּה
  english_pob_choice: this house
  chosen_korean: 이 집
  alternatives_korean:
  - 이 성전
  - 이 건물
  lexicon: HALOT
  rationale: בַּיִת의 기본 의미를 살려 ‘집’으로 옮기되, 문맥상 성전 건물을 가리키는 점은 본문 전체에서 드러나게 했습니다.
- source_word: אֲשֶׁר אַתָּה בֹנֶה
  english_pob_choice: that you are building
  chosen_korean: 당신이 짓고 있는
  alternatives_korean:
  - 당신이 건축하는
  - 당신이 세우는
  lexicon: HALOT
  rationale: 진행 중인 동작을 한국어의 현재 진행형으로 자연스럽게 살리기 위해 ‘짓고 있는’으로 옮겼습니다.
- source_word: חֻקֹּתַי
  english_pob_choice: my statutes
  chosen_korean: 내 규례들
  alternatives_korean:
  - 내 율례들
  - 내 규정들
  lexicon: HALOT
  rationale: חֻקִּים의 관습적·언약적 법령성을 살리면서도, 한국어에서 가장 자연스럽고 보편적인 대응인 ‘규례들’을 택했습니다.
- source_word: מִשְׁפָּטַי
  english_pob_choice: my judgments
  chosen_korean: 내 법규들
  alternatives_korean:
  - 내 판단들
  - 내 판결들
  - 내 규례들
  lexicon: HALOT
  rationale: 법정적·규범적 뉘앙스를 보존하면서 한국어에서 지나치게 사법적이지 않게 하려고 ‘법규들’로 옮겼습니다.
- source_word: וְשָׁמַרְתָּ אֶת כָּל מִצְוֺתַי לָלֶכֶת בָּהֶם
  english_pob_choice: and keep all my commandments by walking in them
  chosen_korean: 내 모든 명령을 지켜 그것들 안에서 걸으면
  alternatives_korean:
  - 내 모든 명령을 지켜 그것들을 따라 살면
  - 내 모든 명령을 지켜 그것들 안에서 행하면
  lexicon: HALOT
  rationale: ‘지키다’와 ‘걷다’의 반복된 언약 순종 이미지를 살리되, 한국어에서는 ‘그것들 안에서 걸으면’이 가장 직접적으로 원문의 비유를 보존합니다.
- source_word: וַהֲקִמֹתִי אֶת דְּבָרִי אִתָּךְ
  english_pob_choice: then I will establish my word with you
  chosen_korean: 내가 당신과 함께 내 말을 세울 것입니다
  alternatives_korean:
  - 내가 당신과 함께 내 말을 확립할 것입니다
  - 내가 당신에게 한 내 말을 이루겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘말/말씀을 세우다’를 직역에 가깝게 살리면서, 약속의 확정 의미도 드러나게 했습니다.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל דָּוִד אָבִיךָ
  english_pob_choice: which I spoke to David your father
  chosen_korean: 나는 그것을 당신의 아버지 다윗에게 말했습니다
  alternatives_korean:
  - 내가 당신의 아버지 다윗에게 말씀한 것입니다
  - 내가 당신의 아버지 다윗에게 약속한 것입니다
  lexicon: HALOT
  rationale: דִּבַּרְתִּי의 기본 의미를 따라 ‘말했습니다’로 옮기되, 앞절의 ‘내 말’과 연결되도록 했습니다.
theological_decisions:
- issue: 조건절과 다윗 언약의 관계
  chosen_reading: 이 구절은 솔로몬의 순종을 조건으로 ‘내 말’을 세우겠다고 하며, 더 넓은 언약의 조건성과 무조건성의 긴장은 본문 안에서 해소하지 않습니다.
  alternative_readings:
  - 이 약속은 단순히 무조건적 언약의 재확인이다
  - 이 약속은 전적으로 조건적이며 앞선 약속을 대체한다
  rationale: 히브리어 문장 구조 자체가 분명한 if-then 관계를 제시하므로, 번역문도 그 긴장을 그대로 유지해야 합니다.
  doctrine_reference: 본문의 신학적 긴장을 보존하고 체계적으로 해소하지 않음.
