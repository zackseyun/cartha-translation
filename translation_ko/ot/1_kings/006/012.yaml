revisions:
- from: 이 집은 당신이 짓고 있는 집입니다. 당신이 내 규례들 가운데 걸으며 내 법규들을 행하고 내 모든 명령을 지켜 그것들 안에서 걸으면, 내가 당신과 함께 내 말을 세울 것입니다. 나는 그것을 당신의 아버지 다윗에게 말했습니다.[a]
  to: 네가 짓고 있는 이 집에 관하여 말하자면, 네가 내 규례를 따라 행하고 내 법도를 행하며 내 모든 계명을 지켜 그것들을 따라 행하면, 내가 네 아버지 다윗에게 말한 내 말을 너에게 이루겠다.[a]
  rationale: 원문의 화제 제시, 조건절, 귀결절, 그리고 ‘다윗에게 말한 내 말’을 수식하는 관계절을 한 문장 안에 유지했습니다. 법 관련 용어를 구별하고, 직역이 지나치게 어색한 곳은 자연스러운 한국어로 옮기되 히브리어 관용구의 표현 가능성은 각주에 보존했습니다. 조건성과 다윗 언약의 관계에 관한 해석적 결론은 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
