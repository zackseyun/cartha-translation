base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/016.yaml
  text: He built twenty cubits at the rear of the house with cedar boards[a], from the floor to the walls, and he built it within as an inner sanctuary[c][b], as the Most Holy Place.
  footnotes:
  - marker: a
    text: Or 'from the floor to the beams/rafters'; the Hebrew text reads 'to the walls,' which is retained here.
    reason: alternative_reading
  - marker: b
    text: Hebrew debir, the inner sanctuary of the temple.
    reason: cultural_note
  - marker: c
    text: 'Traditional rendering: ''the Holy of Holies.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 집의 뒤쪽 스무 규빗을 백향목 널판으로 지어, 바닥에서부터 벽까지 만들었으며, 그 안에 내실을 지어 지성소로 삼았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 문자적으로 ‘벽까지’라고 읽히며, 일부는 이를 ‘들보/서까래까지’로 이해합니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 debir는 성전의 안쪽 가장 깊은 방을 가리키는 말입니다.
    reason: cultural_note
  - marker: c
    text: '전통적 번역: ‘지성소’입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִירְכְּתֵי הַבַּיִת
  english_pob_choice: at the rear of the house
  chosen_korean: 집의 뒤쪽
  alternatives_korean:
