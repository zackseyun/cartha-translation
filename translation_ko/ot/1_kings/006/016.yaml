  lexicon: HALOT
  rationale: יַרְכְּתֵי는 건축물의 먼쪽/뒤쪽을 가리키므로, 한국어로는 자연스럽고 공간 관계가 분명한 ‘집의 뒤쪽’이 가장 적절합니다.
- source_word: בְּצַלְעוֹת אֲרָזִים
  english_pob_choice: with cedar boards
  chosen_korean: 백향목 널판으로
  alternatives_korean:
  - 백향목 판자로
  - 백향목 측판으로
  - 백향목 널조각으로
  lexicon: HALOT
  rationale: צַלְעוֹת는 여기서 내부 칸막이 역할을 하는 목재 구조를 가리키므로, 기능과 재료를 함께 드러내는 ‘백향목 널판’이 가장 자연스럽습니다.
- source_word: מִן הַקַּרְקַע עַד הַקִּירוֹת
  english_pob_choice: from the floor to the walls
  chosen_korean: 바닥에서부터 벽까지
  alternatives_korean:
  - 바닥에서부터 기둥까지
  - 바닥에서부터 들보까지
  lexicon: HALOT
  rationale: 본문은 문자적으로 ‘벽까지’이므로 이를 본문 그대로 유지하되, 한국어에서는 ‘바닥에서부터 벽까지’로 매끄럽게 옮겼습니다.
- source_word: לִדְבִיר
  english_pob_choice: as an inner sanctuary
  chosen_korean: 내실
  alternatives_korean:
  - 내성소
  - 안쪽 성소
  - 내전
  lexicon: HALOT
  rationale: דְבִיר는 성전의 가장 안쪽 방을 가리키는 전문어이므로, 본문에서는 기능을 살린 ‘내실’로 두고 문맥상 성소 내부 공간임을 드러냈습니다.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  english_pob_choice: as the Most Holy Place
  chosen_korean: 지성소
  alternatives_korean:
  - 가장 거룩한 곳
  - 지극히 거룩한 곳
  lexicon: HALOT
  rationale: 전통적으로 굳어진 성전 용어인 ‘지성소’가 이 가장 거룩한 공간을 가장 정확하고 간결하게 전달합니다.
theological_decisions:
- issue: 성전의 가장 안쪽 공간 명칭
  chosen_reading: ‘내실…지성소’로 옮겨, 건축적 의미와 예배적 위계를 함께 드러냈습니다.
  alternative_readings:
  - ‘내부 성소’로만 옮기기
  - ‘지성소’만 반복하기
  rationale: 본문은 단순한 구조 설명이면서 동시에 성전의 최성소를 가리키므로, 두 표현을 함께 써서 공간성과 신학적 중요성을 모두 보존했습니다.
  doctrine_reference: 성전/성소 언어의 점진적 구분
- issue: 문자 본문 보존
  chosen_reading: ‘바닥에서부터 벽까지’로 MT의 표현을 유지했습니다.
  alternative_readings:
  - ‘바닥에서부터 들보까지’로 해석하기
  rationale: 히브리어 본문은 문자적으로 ‘벽들’이라 읽히므로, 건축적으로 난해하더라도 본문을 따라 번역해 해석의 여지를 남겼습니다.
  doctrine_reference: 본문비평 및 본문 우선 원칙
