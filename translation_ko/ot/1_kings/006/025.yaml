  - 두 번째 그룹 천사
  - 두 번째 그룹 천사상
  - 둘째 그룹 천사
  lexicon: HALOT
  rationale: כְּרוּב은 문맥상 성소의 그룹 천사를 가리키므로 ‘그룹 천사’로 옮겼고, 서술의 자연스러움을 위해 ‘두 번째’로 정리했습니다.
- source_word: מִדָּה אַחַת וְקֶצֶב אֶחָד
  english_pob_choice: one measure and one form
  chosen_korean: 크기와 모양이 같았습니다
  alternatives_korean:
  - 한 치수와 한 모양이었습니다
  - 한 크기와 한 형태였습니다
  - 같은 치수와 같은 모양이었습니다
  lexicon: HALOT
  rationale: מִדָּה와 קֶצֶב의 중첩은 단순한 수치보다 두 천사의 동일한 치수와 형태를 강조하므로, 반복을 살려 ‘크기와 모양이 같았습니다’로 자연스럽게 풀었습니다.
- source_word: לִשְׁנֵי הַכְּרֻבִים
  english_pob_choice: both cherubim had
  chosen_korean: 두 그룹 천사는
  alternatives_korean:
  - 두 그룹 천사는
  - 두 천사 모두는
  - 두 그룹 천사 모두
  lexicon: HALOT
  rationale: 히브리어의 ‘두 그룹 천사에게/두 그룹 천사를 위해’라는 관계를 한국어에서는 주어화하여, 동일한 치수가 두 존재 모두에게 적용된다는 뜻을 분명히 했습니다.
theological_decisions:
- issue: 성소의 존재를 가리키는 כְּרוּב의 번역
  chosen_reading: ‘그룹 천사’로 옮겨 성전 장식/성소적 존재라는 문맥을 드러냈습니다.
  alternative_readings:
  - ‘그룹’
  - ‘케루빔’
  - ‘천사’
  rationale: 한국어 교회 전통어인 ‘그룹’만 쓰면 현대 독자가 뜻을 놓치기 쉬워, 그러나 단순히 ‘천사’로만 옮기면 성소적 상징성이 약해집니다. 그래서 문맥 설명력을 살린 절충형 표현을 택했습니다.
  doctrine_reference: 성전 묘사 본문, 출 25장/왕상 6장
