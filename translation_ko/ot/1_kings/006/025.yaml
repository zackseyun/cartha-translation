  lexicon: HALOT
  rationale: 히브리어의 ‘두 그룹 천사에게/두 그룹 천사를 위해’라는 관계를 한국어에서는 주어화하여, 동일한 치수가 두 존재 모두에게 적용된다는 뜻을 분명히 했습니다.
theological_decisions:
- issue: 성소의 존재를 가리키는 כְּרוּב의 번역
  chosen_reading: ‘그룹 천사’로 옮겨 성전 장식/성소적 존재라는 문맥을 드러냈습니다.
  alternative_readings:
  - ‘그룹’
  - ‘케루빔’
  - ‘천사’
  rationale: 한국어 교회 전통어인 ‘그룹’만 쓰면 현대 독자가 뜻을 놓치기 쉬워, 그러나 단순히 ‘천사’로만 옮기면 성소적 상징성이 약해집니다. 그래서 문맥 설명력을 살린 절충형 표현을 택했습니다.
  doctrine_reference: 성전 묘사 본문, 출 25장/왕상 6장
