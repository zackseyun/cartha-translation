lexical_decisions:
- source_word: וְעֶשֶׂר בָּאַמָּה
  english_pob_choice: was ten cubits
  chosen_korean: 열 규빗이었습니다
  alternatives_korean:
  - 열 규빗이었습니다
  - 열 규빗 높이였습니다
