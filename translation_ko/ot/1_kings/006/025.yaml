  lexicon: HALOT
  rationale: 히브리어는 단순히 치수를 제시하므로, 높이를 덧붙이지 않고 한국어에서는 자연스럽게 ‘열 규빗이었습니다’로 옮겨 측정 진술을 보존했습니다.
- source_word: הַכְּרוּב הַשֵּׁנִי
  english_pob_choice: the second cherub
  chosen_korean: 두 번째 그룹 천사
