  lexicon: HALOT
  rationale: מִדָּה와 קֶצֶב의 중첩은 단순한 수치보다 두 천사의 동일한 치수와 형태를 강조하므로, 반복을 살려 ‘크기와 모양이 같았습니다’로 자연스럽게 풀었습니다.
- source_word: לִשְׁנֵי הַכְּרֻבִים
  english_pob_choice: both cherubim had
  chosen_korean: 두 그룹 천사는
