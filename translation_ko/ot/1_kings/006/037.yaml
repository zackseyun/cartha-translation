  - 세워졌습니다
  lexicon: HALOT
  rationale: יסד의 수동형은 건물의 성립/기초 놓음을 가리키므로, 한국어에서는 건축 완료를 드러내는 ‘지어졌습니다’로 옮겨 본문의 건축 맥락을 살렸습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 집
  lexicon: HALOT
  rationale: בַּיִת의 직역인 ‘집’을 유지해 히브리어 이미지와 구조를 살렸습니다. 본 절의 표제적 표현을 ‘성전’으로 풀어 의미를 좁히기보다, 원문 형식을 보존했습니다.
- source_word: בְּיֶרַח זִו
  english_pob_choice: in the month of Ziv
  chosen_korean: 지브 월에
  alternatives_korean:
  - 지브 달에
  - 지브의 달에
  lexicon: HALOT
  rationale: יֶרַח은 달력상의 ‘월’을 뜻하므로 한국어에서는 ‘월’이 가장 직접적입니다. זִו는 고유 월명이어서 음역해 남겼습니다.
