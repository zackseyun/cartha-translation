  lexicon: HALOT
  rationale: 성전 기물로서의 케루빔을 가리키므로 전통적으로 통용되는 음역형 ‘그룹들’을 택해 신학적·의례적 함의를 보존했습니다.
- source_word: בְּתוֹךְ הַבַּיִת הַפְּנִימִי / inside the inner house
