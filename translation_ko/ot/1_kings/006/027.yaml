  lexicon: HALOT
  rationale: 펴다/펼치다의 동작성을 살려, 조형물의 배치 장면에 맞는 자연스러운 한국어로 표현했습니다.
- source_word: וְכַנְפֵיהֶם אֶל תּוֹךְ הַבַּיִת נֹגְעֹת כָּנָף אֶל כָּנָף / their wings toward the middle of the house were touching wing to wing
  english_pob_choice: their wings toward the middle of the house were touching wing to wing
  chosen_korean: 그들의 날개는 집 한가운데를 향하여 날개와 날개가 맞닿아 있었습니다
