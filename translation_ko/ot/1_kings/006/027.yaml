- source_word: וַיִּפְרְשׂוּ אֶת כַּנְפֵי הַכְּרֻבִים / and the cherubim spread out their wings
  english_pob_choice: and the cherubim spread out their wings
  chosen_korean: 날개를 펼쳐서
  alternatives_korean:
  - 날개를 펴서
  - 날개를 펼쳤고
  - 날개를 벌려
  lexicon: HALOT
  rationale: 펴다/펼치다의 동작성을 살려, 조형물의 배치 장면에 맞는 자연스러운 한국어로 표현했습니다.
- source_word: וְכַנְפֵיהֶם אֶל תּוֹךְ הַבַּיִת נֹגְעֹת כָּנָף אֶל כָּנָף / their wings toward the middle of the house were touching wing to wing
  english_pob_choice: their wings toward the middle of the house were touching wing to wing
  chosen_korean: 그들의 날개는 집 한가운데를 향하여 날개와 날개가 맞닿아 있었습니다
  alternatives_korean:
  - 그들의 날개는 집 가운데에서 날개와 날개가 닿아 있었습니다
  - 그들의 날개는 집 중앙을 향해 날개끼리 닿아 있었습니다
  lexicon: HALOT
  rationale: ‘toward the middle’와 ‘wing to wing’의 두 정보를 모두 유지하기 위해 ‘한가운데를 향하여’와 ‘날개와 날개가 맞닿아’의 병렬 구조를 사용했습니다.
theological_decisions:
- issue: 성전 내부 공간을 지칭하는 בַּיִת의 처리
  chosen_reading: ‘내실’로 옮겨, 물리적 구조를 유지하면서도 예배 공간의 가장 안쪽이라는 기능을 드러냈습니다.
  alternative_readings:
  - ‘지성소’로 번역
  - ‘내부 성소’로 번역
  - ‘안쪽 방’으로 번역
  rationale: 원문은 문자적으로 ‘내부의 집’이지만, 본절은 건축적 묘사에 초점이 있으므로 해석어를 앞세우기보다 공간의 깊이를 살린 중립적 표현이 더 적절합니다.
  doctrine_reference: 성전 본문의 묘사와 용어의 절제된 처리
