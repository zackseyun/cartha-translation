base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/027.yaml
  text: He placed the cherubim inside the inner house[a], and the cherubim spread out their wings, so that the wing of the one touched the wall, and the wing of the second cherub touched the other wall; and their wings toward the middle of the house were touching wing to wing.
  footnotes:
  - marker: a
    text: Or 'in the inner sanctuary' for 'inside the inner house.' The Hebrew is literally 'inside the inner house,' referring to the innermost part of the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그룹들을 내실[a] 안에 두었습니다. 그룹들은 날개를 펼쳤습니다. 한 그룹의 날개는 벽에 닿았고, 두 번째 그룹의 날개는 다른 벽에 닿았습니다. 집 한가운데를 향한 그들의 날개들은 서로 맞닿아 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘안쪽 집 안에’이며, 성전의 가장 안쪽 공간을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּתֵּן / He placed
  english_pob_choice: He placed
  chosen_korean: 두었습니다
  alternatives_korean:
  - 놓았습니다
  - 두어 놓았습니다
  - 배치했습니다
  lexicon: HALOT
  rationale: נתן의 ‘두다/놓다/배치하다’ 의미를 따라, 성전 내부의 구조적 배치라는 문맥에 맞게 자연스럽게 옮겼습니다.
- source_word: הַכְּרוּבִים / the cherubim
