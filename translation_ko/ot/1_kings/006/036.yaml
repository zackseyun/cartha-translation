lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: And he built
  chosen_korean: 지었습니다
  alternatives_korean:
  - 건축했습니다
  - 세웠습니다
  lexicon: HALOT
  rationale: וַיִּבֶן은 건축 행위를 가리키므로, 현대 한국어에서 자연스럽고 문맥에 맞는 ‘지었습니다’로 옮겼습니다.
- source_word: הֶחָצֵר הַפְּנִימִית
  english_pob_choice: the inner court
  chosen_korean: 안쪽 뜰
  alternatives_korean:
  - 내부 뜰
  - 내뜰
  lexicon: HALOT
  rationale: חָצֵר는 성전 맥락에서 뜰을 뜻하므로, פְּנִימִית를 반영해 ‘안쪽 뜰’로 옮겼습니다.
- source_word: שְׁלֹשָׁה טוּרֵי גָזִית
  english_pob_choice: three rows of cut stone
  chosen_korean: 다듬은 돌 세 줄
  alternatives_korean:
  - 네모지게 깎은 돌 세 줄
  - 깎아 다듬은 돌 세 줄
  lexicon: HALOT
  rationale: טוּר는 건축 배열의 ‘줄’이고, גָזִית는 가공된 석재이므로 ‘다듬은 돌 세 줄’로 간결하게 살렸습니다.
- source_word: וְ/ט֖וּר כְּרֻתֹ֥ת אֲרָזִים
  english_pob_choice: and a row of cedar beams
  chosen_korean: 백향목 들보 한 줄
  alternatives_korean:
  - 백향목 들보 한 줄
  - 백향목 빔 한 줄
  - 깎은 백향목 들보 한 줄
  lexicon: HALOT
  rationale: כְּרֻתֹת אֲרָזִים는 다듬어진 백향목 재목을 가리키므로, 건축 재료의 기능을 드러내는 ‘백향목 들보’로 옮겼습니다.
theological_decisions:
- issue: 성전 건축 묘사의 기술어를 얼마나 직역할지
  chosen_reading: 서술의 구조를 유지하되, 한국어에서 자연스럽게 읽히는 건축 용어로 옮겼습니다.
  alternative_readings:
  - 더 문자적으로 ‘세 줄의 깎은 돌과 한 줄의 백향목’으로 옮김
  - 전통적 성구체로 다듬음
  rationale: 이 구절은 신학적 해석보다 건축 묘사의 정확성이 중요하므로, 원문의 병렬 구조와 재료 대비를 유지하는 쪽을 택했습니다.
  doctrine_reference: 본문 기술 묘사
