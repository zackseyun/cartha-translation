  rationale: 본문은 성전 내부의 조각상 치수를 기술하는 것이므로, 의미를 확장해 ‘천사’로 해석하기보다 원문 명칭을 보존하는 편이 더 정확합니다.
  doctrine_reference: 성전 기물 묘사의 문맥적 정확성
