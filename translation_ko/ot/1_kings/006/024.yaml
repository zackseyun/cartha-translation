base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/024.yaml
  text: And five cubits was the one wing of the cherub[a], and five cubits the second wing of the cherub; ten cubits from the end of its wings to the end of its wings.
  footnotes:
  - marker: a
    text: Or 'from the tip of its wings to the tip of its wings,' that is, the full span from one wingtip to the other.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 한 그룹별 날개는 다섯 규빗이었고, 다른 그룹별 날개도 다섯 규빗이었습니다. 날개 끝에서 날개 끝까지는 열 규빗이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘날개 끝에서 날개 끝까지’라는 뜻으로, 한쪽 날개 끝에서 다른 쪽 날개 끝까지의 전체 폭을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמֵשׁ אַמּוֹת
  english_pob_choice: five cubits
  chosen_korean: 다섯 규빗
  alternatives_korean:
  - 다섯 암마
  - 다섯 큐빗
  lexicon: HALOT
  rationale: 성전 측량 문맥의 אַמָּה는 한국어 성경에서 통상 ‘규빗’으로 옮기는 것이 가장 분명하고 자연스럽습니다.
- source_word: כְּנַף
  english_pob_choice: wing
  chosen_korean: 날개
  alternatives_korean:
  - 익장
  - 날개깃
  lexicon: HALOT
  rationale: 그룹 형상과 성전 장식 문맥에서는 כָּנָף가 문자 그대로 ‘날개’를 가리키므로 이를 직접 반영했습니다.
- source_word: הַכְּרוּב
  english_pob_choice: the cherub
  chosen_korean: 그룹
  alternatives_korean:
  - 그룹상
  - 그룹 형상
  lexicon: HALOT
  rationale: 히브리어 כְּרוּב의 한국어 성경 관용형은 ‘그룹’이므로 이를 따르되, 반복되는 두 존재를 ‘한 그룹/다른 그룹’으로 구분해 문맥을 살렸습니다.
- source_word: מִקְצוֹת ... וְעַד קְצוֹת
  english_pob_choice: from the end of ... to the end of
  chosen_korean: 날개 끝에서 날개 끝까지
  alternatives_korean:
  - 날개의 끝에서 날개의 끝까지
  - 끝에서 끝까지
  lexicon: HALOT
  rationale: 공간적 범위를 나타내는 구문이므로 ‘끝’으로 옮겨, POB의 ‘end’ 선택과 같은 방향으로 양쪽 끝의 전체 폭을 드러냈습니다.
theological_decisions:
- issue: 천사적 존재의 명칭을 한국 교회식으로 풀어 쓸지 여부
  chosen_reading: ‘그룹’이라는 원문형 용어를 유지했습니다.
  alternative_readings:
  - 천사
  - 천상 존재
  - 그룹상
  rationale: 본문은 성전 내부의 조각상 치수를 기술하는 것이므로, 의미를 확장해 ‘천사’로 해석하기보다 원문 명칭을 보존하는 편이 더 정확합니다.
  doctrine_reference: 성전 기물 묘사의 문맥적 정확성
