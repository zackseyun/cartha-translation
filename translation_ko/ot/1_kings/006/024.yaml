revisions:
- from: 그리고 한 그룹별 날개는 다섯 규빗이었고, 다른 그룹별 날개도 다섯 규빗이었습니다. 날개 끝에서 날개 끝까지는 열 규빗이었습니다.[a]
  to: 그룹의 한쪽 날개는 다섯 규빗이었고, 그 다른 쪽 날개도 다섯 규빗이었습니다. 날개의 한 끝에서 다른 끝까지는 열 규빗이었습니다.[a]
  rationale: ‘그룹별’을 제거하여 한 그룹의 두 날개라는 히브리어의 단수 지시와 소유 관계를 보존했습니다. ‘한쪽/다른 쪽’은 ‘하나/둘째’의 날개 대조를 한국어답게 드러냅니다. 본문은 ‘한 끝에서 다른 끝까지’로, 각주는 ‘날개 끝에서 날개 끝까지’로 표현하여 원문의 양 끝 사이의 범위와 대안적 표현을 모두 유지했습니다.
