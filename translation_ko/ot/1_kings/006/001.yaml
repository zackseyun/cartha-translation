  text: וַ/יְהִ֣י בִ/שְׁמוֹנִ֣ים שָׁנָ֣ה וְ/אַרְבַּ֣ע מֵא֣וֹת שָׁנָ֡ה לְ/צֵ֣את בְּנֵֽי יִשְׂרָאֵ֣ל מֵ/אֶֽרֶץ מִצְרַיִם֩ בַּ/שָּׁנָ֨ה הָ/רְבִיעִ֜ית בְּ/חֹ֣דֶשׁ זִ֗ו ה֚וּא הַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לִ/מְלֹ֥ךְ שְׁלֹמֹ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּ֥בֶן הַ/בַּ֖יִת לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/001.yaml
  text: And it came about in the four hundred eightieth year after the sons of Israel came out from the land of Egypt[a], in the fourth year, in the month of Ziv (that is, the second month), of Solomon’s reign over Israel[c][b], that he built the house for Yahweh.
  footnotes:
  - marker: a
    text: Hebrew 'the sons of Israel'; many English versions render 'the Israelites' or 'the people of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Ziv was the old name of the second month in the Hebrew calendar.
    reason: cultural_note
  - marker: c
    text: Or 'he built the house for the LORD.' The Hebrew verb itself is simply 'built'; 'began to build' makes explicit the commencement sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 이집트 땅에서 나온 지 사백팔십 년째 되는 해, 곧 솔로몬이 이스라엘을 다스린 지 네 번째 해, 지브 월 곧 둘째 달에, 그가 야훼의 집을 지었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘의 아들들’이라는 혈연적 표현을 씁니다. 한국어 본문에는 관용적으로 ‘이스라엘 자손’을 사용했습니다.
    reason: lexical_alternative
  - marker: b
    text: 지브는 히브리 달력의 옛 달 이름으로, 둘째 달을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 혈연·언약적 표현을 살리면서도 한국어에서는 자연스럽고 관용적인 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: from the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트 땅으로부터
  - 이집트에서
  lexicon: HALOT
  rationale: 원문에 있는 ‘땅’을 보존하되, 한국어 역사 서술로는 ‘이집트 땅에서’가 가장 자연스럽습니다.
- source_word: בְּחֹדֶשׁ זִו / הוּא הַחֹדֶשׁ הַשֵּׁנִי
  english_pob_choice: in the month of Ziv (that is, the second month)
  chosen_korean: 지브 월 곧 둘째 달
  alternatives_korean:
  - 지브 달, 곧 둘째 달
  - 지브 월, 즉 둘째 달
  lexicon: HALOT
  rationale: 고유한 달 이름 ‘지브’를 유지하고, 뒤의 동격 설명은 ‘곧’으로 간결하게 처리해 본문의 역사적 표지를 살렸습니다.
- source_word: וַיִּבֶן
  english_pob_choice: he built
  chosen_korean: 그가 … 지었습니다
  alternatives_korean:
  - 그가 … 세웠습니다
  - 그가 … 건축했습니다
  lexicon: HALOT
  rationale: 히브리어 동사 자체는 단순히 ‘세우다/짓다’의 완료 서술이므로, ‘지었습니다’가 가장 सीधे합니다. 문맥상 ‘시작했다’를 덧붙이지 않았습니다.
- source_word: לַיהוָה
  english_pob_choice: for Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 주님의 집
  lexicon: HALOT
  rationale: 이 본문은 성전의 소속을 나타내는 표현이므로 ‘야훼의 집’으로 옮겨 원문과 프로젝트 용어를 함께 유지했습니다.
theological_decisions:
- issue: 여호와/야훼 표기 문제
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본어에 따라 יהוה는 ‘야훼’로 옮겨 언약 სახელ을 직접 드러냈습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: וַיִּבֶן의 시상 이해
  chosen_reading: 지었습니다
  alternative_readings:
  - 짓기 시작했습니다
  - 건축했습니다
  rationale: 본문은 성전 건축의 개시 시점을 연대기로 표시하지만, 히브리어 동사 자체는 단순 완료 서술이므로 한국어 본문에는 시작을 덧붙이지 않았습니다.
  doctrine_reference: Source-first rendering of verbal aspect
