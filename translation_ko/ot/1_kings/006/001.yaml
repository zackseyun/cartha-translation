  source_fidelity: 개정이 필요합니다. 초안은 주요 연대 표지와 지브 월의 설명, 야훼라는 신명 표기를 대체로 충실히 반영합니다. 그러나 ‘곧 솔로몬이 이스라엘을 다스린 지 네 번째 해’의 ‘곧’은 히브리어에서 지브 월과 둘째 달 사이에 있는 동격 설명을 솔로몬의 재위 연대에도 걸리는 듯하게 만듭니다. 또한 לַיהוָה는 소유를 직접 나타내기보다 ‘야훼를 위하여’라는 목적·헌정 관계를 나타냅니다.
  naturalness: ‘사백팔십 년째 되는 해’와 ‘재위 넷째 해’는 현대 한국어의 역사·연대 서술에 자연스럽습니다. ‘재위 넷째 해인 지브 월, 곧 둘째 달에’로 묶으면 원문의 연대 구조와 동격 관계가 명료해집니다.
  terminology: ‘이스라엘 자손’, ‘이집트 땅’, ‘지브 월’, ‘야훼’는 적절합니다. ‘야훼의 집’도 성전의 관용적 호칭으로 이해될 수 있으나, 이 절의 לַיהוָה를 더 직접적으로 반영하여 ‘야훼를 위하여 집을’로 옮기는 것이 안전합니다. 각주 a의 ‘혈연적’이라는 설명은 공동체를 가리키는 히브리 관용구의 용법을 지나치게 협소하게 규정하므로 완화해야 합니다.
