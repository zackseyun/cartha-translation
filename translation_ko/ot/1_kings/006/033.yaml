  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֵ֥ן עָשָׂ֛ה לְ/פֶ֥תַח הַֽ/הֵיכָ֖ל מְזוּז֣וֹת עֲצֵי שָׁ֑מֶן מֵ/אֵ֖ת רְבִעִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/033.yaml
  text: And so he made for the entrance of the nave doorposts of olivewood[a], four-sided.
  footnotes:
  - marker: a
    text: Or possibly, 'with four-sided framing' or 'square.' The Hebrew phrase 'from a fourth part' is architecturally difficult and may describe the shape of the doorway.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그는 성전 현관의 문설주를 올리브나무로 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구문은 문자적으로는 ‘네째 부분으로부터/네 번째 부분에서’와 비슷하여 건축적으로 난해합니다. ‘네모난’ 또는 ‘네 면이 있는’ 문설주를 가리킬 가능성이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  english_pob_choice: And so
  chosen_korean: 그리고
  alternatives_korean:
  - 그리하여
  - 그와 같이
  lexicon: HALOT
  rationale: 앞선 성전 공사 서술을 이어 주는 연결어이므로, 한국어에서는 자연스럽게 이어 주는 ‘그리고’로 옮겼습니다.
- source_word: לְפֶתַח הַהֵיכָל
  english_pob_choice: for the entrance of the nave
  chosen_korean: 성전 현관
  alternatives_korean:
  - 성전의 입구
  - 성전 본당의 입구
  lexicon: HALOT
  rationale: הֵיכָל은 문맥상 성전의 주요 공간을 가리키므로, 지나치게 기술적인 ‘nave’보다 성전 건축 맥락에 맞는 ‘현관’으로 자연스럽게 옮겼습니다.
- source_word: מְזוּזוֹת
  english_pob_choice: doorposts
  chosen_korean: 문설주
  alternatives_korean:
  - 문기둥
  - 문틀의 기둥
  lexicon: HALOT
  rationale: 문턱과 짝을 이루는 출입구의 세로 기둥을 뜻하므로, 한국어 성경에서 통용되는 ‘문설주’가 가장 정확합니다.
- source_word: עֲצֵי שָׁמֶן
  english_pob_choice: olivewood
  chosen_korean: 올리브나무로
  alternatives_korean:
  - 올리브나무 재질로
  - 감람나무로
  lexicon: HALOT
  rationale: 직역하면 ‘기름 나무의 나무’로, 문맥상 올리브 목재를 가리키므로 재료를 분명히 드러내는 ‘올리브나무로’가 적절합니다.
- source_word: מֵאֵת רְבִעִית
  english_pob_choice: from a fourth part
  chosen_korean: a
  alternatives_korean: []
  lexicon: HALOT
  rationale: 히브리어 구문은 건축적으로 난해하여 본문 본문에 과도한 해석을 넣지 않고, 주석에서 ‘네모난/네 면이 있는’ 가능성을 별도 처리하도록 했습니다.
theological_decisions:
- issue: 건축 용어의 난해한 구절 처리
  chosen_reading: 본문은 최소한의 설명만 두고, 모호한 형상/비례 표현은 각주로 남겼습니다.
  alternative_readings:
  - 네모난
  - 네 면이 있는 구조로
  - 네모진 틀로
  rationale: 히브리어 מֵאֵת רְבִעִית는 본문 자체가 불분명하므로, 단정적 번역보다 해석 가능성을 보존하는 편이 원문 충실에 부합합니다.
  doctrine_reference: 원문 의미 보존과 주해적 겸손
- issue: ‘성전’ 관련 공간 용어
  chosen_reading: הֵיכָל을 한국어 본문에서는 ‘성전 현관’으로 풀어 자연스럽게 읽히게 했습니다.
  alternative_readings:
  - 본당
  - 나오스
  - 성전 홀
  rationale: 한국어 독자에게 ‘nave’는 낯설 수 있어, 성전 건축 서술의 흐름을 해치지 않는 범위에서 기능적으로 옮겼습니다.
  doctrine_reference: 성전 건축 서술의 문맥적 명료성
