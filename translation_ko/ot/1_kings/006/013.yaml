  text: וְ/שָׁ֣כַנְתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֥א אֶעֱזֹ֖ב אֶת עַמִּ֥/י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/013.yaml
  text: And I will dwell among the children of Israel[a], and I will not forsake my people Israel.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew is literally 'the children of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이스라엘 자손[a] 가운데에 거하며, 내 백성 이스라엘을 버리지 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’입니다. 히브리어는 문자적으로 ‘이스라엘의 자손’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  english_pob_choice: And I will dwell
  chosen_korean: 내가 … 거하며
  alternatives_korean:
  - 내가 … 살며
  - 내가 … 머무르며
  lexicon: HALOT
  rationale: שׁכן은 하나님의 임재가 백성 가운데 ‘거하다’는 언약적 의미를 지니므로, 현대 한국어에서도 그 뜻이 살아 있는 ‘거하다’를 택했습니다.
- source_word: בְּתוֹךְ
  english_pob_choice: among
  chosen_korean: … 가운데에
  alternatives_korean:
  - … 한가운데에
  - … 속에
  lexicon: HALOT
  rationale: 복수 집단인 이스라엘 자손과 함께 쓰일 때 בְּתוֹךְ는 공동체 한가운데/가운데에라는 뜻이 자연스러워 ‘가운데에’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the children of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 히브리어의 직역에 가깝게 ‘자손’을 유지해 언약 백성 호칭의 무게를 살렸고, 영어 POB의 각주처럼 ‘이스라엘 사람들’로 풀어 단순화하지 않았습니다.
- source_word: וְלֹא אֶעֱזֹב
  english_pob_choice: and I will not forsake
  chosen_korean: 버리지 않겠습니다
  alternatives_korean:
  - 떠나지 않겠습니다
  - 저버리지 않겠습니다
  lexicon: HALOT
  rationale: עזב는 언약 문맥에서 관계를 끊고 떠나는 ‘버리다/저버리다’의 뜻이 강하므로, 한국어에서는 자연스럽고 관계적 긴장을 살리는 ‘버리지 않겠습니다’를 택했습니다.
theological_decisions:
- issue: 하나님의 임재를 어떻게 표현할 것인가
  chosen_reading: ‘거하며’와 ‘가운데에’를 유지해, 성전 맥락의 임재를 말하되 하나님을 공간적으로 단순 고정시키지 않도록 했습니다.
  alternative_readings:
  - ‘성전 안에 살며’
  - ‘이스라엘 가운데 머무르며’
  rationale: 본문은 성전 신학을 암시하지만 직접적으로 형이상학적 위치를 규정하지 않으므로, 언약적 임재의 표현을 보존하는 쪽이 원문 긴장에 더 가깝습니다.
  doctrine_reference: 본문의 긴장을 보존하고 후대 교리 표현을 앞세우지 않기
