base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/021.yaml
  text: Then the king of Israel went out and struck the horses and the chariots[a], and inflicted a great blow on Aram.
  footnotes:
  - marker: a
    text: Or 'on the Arameans'; Hebrew 'Aram' may refer to the kingdom or its forces. Traditional English versions often have 'Syria,' but the Hebrew proper name is Aram.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이스라엘 왕이 나가서 말과 병거를 치고 아람[a]에 큰 타격을 입혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아람’은 아람 왕국 자체를 가리킬 수도 있고 그 군대를 가리킬 수도 있습니다. 전통 번역에서 쓰는 ‘시리아’ 대신 히브리어 고유명사 ‘아람’을 그대로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나가서
  alternatives_korean:
  - 나와서
  - 출정하여
  lexicon: HALOT
  rationale: 군사적 문맥이지만 히브리어의 기본 동작은 단순한 ‘나가다’이므로, 과도한 해석을 피하고 자연스러운 서술형으로 옮겼습니다.
- source_word: וַיַּךְ אֶת הַסּוּס וְאֶת הָרָכֶב
  english_pob_choice: struck the horses and the chariots
  chosen_korean: 말들과 병거를 치고
  alternatives_korean:
  - 말들과 전차를 치고
  - 기병과 병거를 치고
  lexicon: HALOT
  rationale: הַסּוּס와 הָרָכֶב는 군사 집합체를 가리키므로, 직역의 낯섦을 줄이면서도 원문의 병행 구조를 살려 ‘말들과 병거’로 옮겼습니다.
- source_word: בַאֲרָם
  english_pob_choice: on Aram
  chosen_korean: 아람에
  alternatives_korean:
  - 아람 위에
  - 아람에게
  lexicon: HALOT
  rationale: 히브리어 지명이 ‘아람’이므로 이를 그대로 유지했고, 한국어 전치사는 결과적 타격의 대상을 자연스럽게 나타내는 ‘-에’로 처리했습니다.
- source_word: מַכָּה גְדוֹלָה
  english_pob_choice: a great blow
  chosen_korean: 큰 타격을 입혔습니다
  alternatives_korean:
  - 큰 일격을 가했습니다
  - 큰 타격을 주었습니다
  lexicon: HALOT
  rationale: 직역의 ‘큰 일격’도 가능하지만, 한국어에서 전쟁 결과를 말할 때 ‘타격을 입히다’가 원문의 강한 군사적 패배감을 비교적 정확하게 전달합니다.
theological_decisions:
- issue: אַרָם을 전통적 '시리아'로 바꾸지 않음
  chosen_reading: 지명/정치체를 원문대로 ‘아람’으로 유지했습니다.
  alternative_readings:
  - 시리아
  - 아람 사람들
  rationale: POB의 원문 지향 원칙에 따라, 히브리어 고유명사 אֲרָם을 전통적 교회어인 ‘시리아’로 치환하지 않고 원형을 보존했습니다.
  doctrine_reference: 본문 지리·역사 지시의 투명성
