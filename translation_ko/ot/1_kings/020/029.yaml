  source_fidelity: ‘쳐죽였습니다’는 נכה(치다, 쓰러뜨리다)의 의미를 ‘죽이다’로 확정하여 원문의 표현 범위를 좁힙니다. 또한 וַתִּקְרַב הַמִּלְחָמָה는 문맥상 전투가 실제로 맞붙은 것을 가리키므로 ‘전투가 벌어졌고’가 현대 한국어에서 자연스럽습니다. 아람은 고유명사로 유지하고, רַגְלִי는 ‘보병’으로 적절히 옮겼습니다.
