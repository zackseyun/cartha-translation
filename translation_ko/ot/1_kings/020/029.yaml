language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יַּחֲנ֧וּ אֵ֦לֶּה נֹ֥כַח אֵ֖לֶּה שִׁבְעַ֣ת יָמִ֑ים וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/תִּקְרַב֙ הַ/מִּלְחָמָ֔ה וַ/יַּכּ֨וּ בְנֵֽי יִשְׂרָאֵ֧ל אֶת אֲרָ֛ם מֵאָה אֶ֥לֶף רַגְלִ֖י בְּ/י֥וֹם אֶחָֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/029.yaml
  text: And these camped opposite those for seven days[a]. Then on the seventh day the battle drew near[c][b], and the sons of Israel struck down Aram—one hundred thousand foot soldiers in one day.
  footnotes:
  - marker: a
    text: Or “the Israelites.” The Hebrew is literally “the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Or “the Arameans.” Hebrew “Aram” can denote the Aramean kingdom/people.
    reason: lexical_alternative
  - marker: c
    text: Or “infantry.” Hebrew literally refers to troops “on foot.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 서로 마주 보고 칠 일 동안 진을 쳤습니다. 그리고 일곱째 날에 전투가 가까워졌고, 이스라엘 자손은 하루에 아람의 보병 십만 명을 쳐죽였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ‘이스라엘 자손’은 문자적으로는 ‘이스라엘의 아들들’입니다.
    reason: source_note
  - marker: b
    text: ‘아람’은 여기서 아람 왕국/백성을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘보병’은 문자적으로는 ‘걸어서 싸우는 병사들’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַֽיַּחֲנוּ ... נֹכַח ...
  english_pob_choice: camped opposite those
  chosen_korean: 서로 마주 보고 진을 쳤습니다
  alternatives_korean:
  - 서로 대치하며 진을 쳤습니다
  - 저쪽을 마주하여 진을 쳤습니다
  lexicon: WLC + HALOT
  rationale: חנה의 군사적 의미는 ‘진을 치다’가 자연스럽고, נֹכַח는 두 진영의 맞은편 배치를 ‘서로 마주 보고’로 간결하게 살렸습니다.
- source_word: שִׁבְעַת יָמִים
  english_pob_choice: for seven days
  chosen_korean: 칠 일 동안
  alternatives_korean:
  - 일곱 날 동안
  - 7일 동안
  lexicon: HALOT
  rationale: 지속 기간을 나타내는 표현으로 한국어에서는 ‘동안’을 붙이는 것이 자연스럽습니다.
- source_word: וַתִּקְרַב הַמִּלְחָמָה
  english_pob_choice: the battle drew near
  chosen_korean: 전투가 가까워졌고
  alternatives_korean:
  - 전투가 다가왔고
  - 전투가 붙었고
  lexicon: HALOT
  rationale: קרב의 기본 이미지를 살려 ‘가까워지다’로 옮겨, 단순히 ‘시작되다’로 풀어버리지 않았습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 직역에 가까운 관용 표현을 유지해 집합적 주어임을 드러냈습니다.
- source_word: אֲרָם
  english_pob_choice: Aram
  chosen_korean: 아람
  alternatives_korean:
  - 아람 사람들
  - 시리아
  lexicon: HALOT
  rationale: 고유명사 אֲרָם을 지명 그대로 옮겨, 후대 지리명인 ‘시리아’로 바꾸지 않았습니다.
- source_word: רַגְלִי
  english_pob_choice: foot soldiers
  chosen_korean: 보병
  alternatives_korean:
  - 보행 병사
  - 도보 병사
  lexicon: HALOT
  rationale: 군사 문맥에서 ‘on foot’의 의미를 한국어 군사 용어인 ‘보병’으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 전쟁 서술에서 동사 선택의 강도
  chosen_reading: ‘쳐죽였습니다’로 옮겨 군사적 결과의 강도를 분명히 했습니다.
  alternative_readings:
  - ‘죽였습니다’
  - ‘격파했습니다’
  rationale: נכה는 단순한 타격이 아니라 전투에서의 치명적 타격을 포함할 수 있어, 문맥의 대량 살상 결과를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 'Translation principle: preserve the source’s force and specificity'
