  rationale: 원문에 있는 ‘갔다’라는 동작을 복원했습니다. 아페르(אֲפֵר)의 일반적 의미인 ‘재’와 문맥상 가능한 ‘눈가를 가리는 덮개’라는 이해를 함께 보존하기 위해, 본문은 영어 POB의 문맥적 선택을 따라 ‘붕대 같은 것’으로 번역하고 각주에서 문자적 의미와 대안을 명시했습니다.
