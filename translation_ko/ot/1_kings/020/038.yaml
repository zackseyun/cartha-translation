  source_fidelity: 원문의 첫 동사 וַיֵּלֶךְ(‘그가 갔다’)가 초안에서 빠져 있습니다. 또한 לַמֶּלֶךְ는 문맥상 왕을 기다리거나 맞이하려는 목적을 나타내므로 ‘왕을 기다리려고’는 적절합니다. אֲפֵר는 통상 ‘재’이지만 이 문맥에서는 눈가를 가리는 덮개를 뜻할 가능성이 있어, 본문에서는 신중히 ‘붕대 같은 것’으로 처리하고 각주에서 문자적 의미를 밝혀야 합니다.
  naturalness: ‘가서 왕을 기다리려고 길가에 섰고’는 현대 표준 한국어의 자연스러운 서사 흐름을 유지하며, 합쇼체 서술에도 맞습니다. ‘눈 위에 붕대를 감고’보다 ‘눈 위에 붕대 같은 것을 두르고’가 눈을 가리는 물건이라는 문맥에 더 자연스럽고 덜 단정적입니다.
  terminology: ‘예언자’는 נָבִיא의 자연스러운 현대어 번역입니다. ‘변장했습니다’는 히트파엘 동사의 자기 위장 의미를 잘 전달합니다. ‘붕대 같은 것’은 본문의 어휘적 불확실성을 과도하게 해소하지 않으며 영어 POB의 해석 및 각주와도 조응합니다.
