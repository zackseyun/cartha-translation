source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ֙ הַ/נָּבִ֔יא וַ/יַּעֲמֹ֥ד לַ/מֶּ֖לֶךְ עַל הַ/דָּ֑רֶךְ וַ/יִּתְחַפֵּ֥שׂ בָּ/אֲפֵ֖ר עַל עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/038.yaml
  text: So the prophet went and stood by the road for the king[a], and disguised himself with a bandage over his eyes.
  footnotes:
  - marker: a
    text: Hebrew 'with ashes over his eyes.' The phrase may refer either to literal ashes or, in context, to a covering or bandage used as a disguise.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 예언자는 가서 왕을 기다리려고 길가에 섰고, 눈 위에 붕대 같은 것을 두르고 변장했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 눈 위에 재를 얹고’입니다. 이 표현은 실제 재를 가리킬 수도 있고, 문맥상 변장을 위해 눈을 가리는 덮개나 붕대를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הַנָּבִיא
  english_pob_choice: So the prophet went
  chosen_korean: 예언자는 … 기다렸고
  alternatives_korean:
  - 예언자가 갔고
  - 그 예언자는 갔고
  lexicon: HALOT
  rationale: 서술 진행은 자연스럽게 옮기되, 한국어에서는 뒤의 행동인 ‘서서 왕을 기다림’을 앞세워 장면 흐름을 살렸습니다.
- source_word: וַיַּעֲמֹד לַמֶּלֶךְ עַל הַדָּרֶךְ
  english_pob_choice: stood by the road for the king
  chosen_korean: 길가에 서서 왕을 기다렸고
  alternatives_korean:
  - 왕을 위해 길에 섰고
  - 왕을 맞으려고 길가에 섰고
  lexicon: HALOT
  rationale: לַמֶּלֶךְ는 단순히 ‘왕에게’가 아니라 왕의 지나감을 겨냥한 위치 설정이므로, 한국어에서는 의도를 드러내어 ‘왕을 기다렸고’로 풀었습니다.
- source_word: וַיִּתְחַפֵּשׂ
  english_pob_choice: disguised himself
  chosen_korean: 자신을 변장했습니다
  alternatives_korean:
  - 스스로를 숨겼습니다
  - 자신을 알아볼 수 없게 했습니다
  lexicon: HALOT
  rationale: 히트파엘형의 자기 은폐 동작을 자연스러운 현대어 ‘변장하다’로 옮겼습니다.
- source_word: בָּאֲפֵר עַל עֵינָיו
  english_pob_choice: with a bandage over his eyes
  chosen_korean: 눈 위에는 붕대를 감고
  alternatives_korean:
  - 눈 위에는 천을 두르고
  - 눈 위에는 가리개를 하고
  lexicon: HALOT
  rationale: אֲפֵר는 문맥상 단순 ‘재’보다 눈을 가리는 덮개/붕대의 의미가 더 잘 맞으므로, POB의 해석을 따라 한국어로는 ‘붕대’로 옮겼습니다.
theological_decisions:
- issue: ‘재’냐 ‘가림용 붕대’냐의 해석 선택
  chosen_reading: 문맥상 변장 도구로서의 눈가 가림을 본문 의미로 채택했습니다.
  alternative_readings:
  - ‘눈 위에 재를 하고’
  - ‘눈 위에 재를 덮고’
  rationale: 왕이 알아보지 못하게 하는 장면이라는 서술 맥락에 비추어, 단순 물질보다 위장 장치를 뜻하는 읽기가 더 설득력 있습니다.
  doctrine_reference: 본문의 서사적 의도와 문맥적 의미 우선 원칙
- issue: 역할어 ‘예언자’ 사용
  chosen_reading: הַנָּבִיא를 ‘예언자’로 옮겼습니다.
  alternative_readings:
  - 선지자
  - prophet를 음역하지 않음
  rationale: 한국어 성경 전통의 ‘선지자’도 가능하지만, 현대 표준어의 직접성 측면에서 ‘예언자’가 더 투명합니다.
  doctrine_reference: 번역 투명성 원칙
