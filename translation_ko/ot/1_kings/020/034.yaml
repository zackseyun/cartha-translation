base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/034.yaml
  text: Then he said to him[a], “The cities that my father took from your father I will restore, and you may establish streets for yourself in Damascus, as my father established them in Samaria.” And I, in the treaty[c][b], will let you go.” So he made a treaty with him and let him go.
  footnotes:
  - marker: a
    text: Or 'marketplaces' or 'quarters'; the Hebrew word literally means 'streets/open places' and may refer here to commercial districts granted by treaty.
    reason: lexical_alternative
  - marker: b
    text: Or 'with this covenant I will let you go.' The Hebrew word can also be rendered 'covenant,' but here it refers to a political treaty.
    reason: alternative_reading
  - marker: c
    text: Literally 'cut a covenant/treaty with him,' a standard Hebrew idiom for formally making a binding agreement.
    reason: cultural_note
translation:
  language: ko
  text: 그가 그에게 말했습니다[a]. 「내 아버지가 당신의 아버지에게서 빼앗은 성읍들을 내가 돌려주겠습니다. 당신은 다마스쿠스에서 자신을 위해 거리들을 두어도 됩니다. 내 아버지가 사마리아에 그리한 것처럼 말입니다. 그리고 나는 이 조약 안에서 당신을 놓아주겠습니다[b][c].」 그래서 그가 그와 조약을 맺고 그를 놓아주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그가 그에게 말했다’입니다.
    reason: source_note
  - marker: b
    text: 히브리어 בְּבְרִית는 문맥상 ‘조약 안에서/조약으로’라는 정치적 합의를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘그와 조약을 끊었다’로, 히브리어의 관용구를 반영한 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: הֶעָרִים
  english_pob_choice: the cities
  chosen_korean: 성읍들을
  alternatives_korean:
  - 도시들을
  - 읍성들을
  lexicon: HALOT
  rationale: 전쟁과 영토 반환의 맥락에서 일반적인 ‘도시’보다 다소 고전적이지만 공적·행정적 뉘앙스를 살리는 ‘성읍’이 적절합니다.
- source_word: לָקַח ... אָשִׁיב
  english_pob_choice: took ... I will restore
  chosen_korean: 빼앗은 ... 돌려주겠습니다
  alternatives_korean:
  - 취한 ... 반환하겠습니다
  - 가져간 ... 돌려주겠습니다
  lexicon: HALOT
  rationale: 단순히 ‘가졌다’보다 무력으로 취득한 의미가 분명한 ‘빼앗다’가 문맥에 맞고, ‘돌려주다’가 되찾아 준다는 대칭을 잘 드러냅니다.
- source_word: וְחוּצוֹת ... תָּשִׂים
  english_pob_choice: you may establish streets for yourself in Damascus
  chosen_korean: 다마스쿠스에서 자신을 위해 거리들을 두어도 됩니다
  alternatives_korean:
  - 다마스쿠스에서 자신을 위해 거리를 만들 수도 있습니다
  - 다마스쿠스에서 자신을 위해 상업 구역을 둘 수도 있습니다
  lexicon: HALOT
  rationale: חוּצוֹת의 기본값인 ‘거리들/열린 곳들’을 살리되, 허용·설정의 뜻을 가진 동사를 유지했습니다. 상업 구역의 함의는 본문에 직접 넣지 않고 표현만 열어 두었습니다.
- source_word: בְּרִית
  english_pob_choice: in the treaty
  chosen_korean: 이 조약 안에서
  alternatives_korean:
  - 이 언약 안에서
  - 이 협약 안에서
  lexicon: HALOT
  rationale: 열왕기상 20장의 왕들 사이 정치적 합의를 가리키므로, 신학적으로 무거운 ‘언약’보다 ‘조약’이 source-direct합니다.
theological_decisions:
- issue: בְּרִית를 ‘언약’이 아니라 ‘조약’으로 옮김
  chosen_reading: 정치적·외교적 합의라는 역사적 맥락을 살려 ‘조약’으로 번역했습니다.
  alternative_readings:
  - 언약
  - 협약
  rationale: 본문은 하나님-인간 관계가 아니라 두 왕 사이의 협상 결과이므로, 전통적 교회 용어를 그대로 쓰면 독자가 오해할 수 있습니다. 다만 헤브라이어 ברית의 넓은 어감은 번역 선택의 배경으로 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 5
