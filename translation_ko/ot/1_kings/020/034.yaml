- from: 그가 그에게 말했습니다[a]. 「내 아버지가 당신의 아버지에게서 빼앗은 성읍들을 내가 돌려주겠습니다. 당신은 다마스쿠스에서 자신을 위해 거리들을 두어도 됩니다. 내 아버지가 사마리아에 그리한 것처럼 말입니다. 그리고 나는 이 조약 안에서 당신을 놓아주겠습니다[b][c].」 그래서 그가 그와 조약을 맺고 그를 놓아주었습니다.
  to: 그가 그에게 말했습니다. “내 아버지가 당신의 아버지에게서 빼앗은 성읍들을 내가 돌려주겠습니다. 또 당신은 다마스쿠스에 당신을 위한 거리들[a]을 마련할 수 있습니다. 내 아버지가 사마리아에 그렇게 마련했던 것처럼 말입니다. 나는 이 조약을 맺는 조건으로 당신을 놓아주겠습니다[b].” 그러자 그가 그와 조약을 맺고[c] 그를 놓아주었습니다.
  rationale: 주석 표지를 실제 해당 어휘와 관용구로 옮기고, 어색한 직역투를 현대 공적 한국어로 다듬었습니다. ‘거리들’은 원문의 기본 의미를 본문에 남기되, 시장·상업 구역일 수 있는 역사적 의미 범위는 주석에서만 제시했습니다. ‘조약’은 본문의 국가 간 정치적 합의에 적합하며, ‘이 조약을 맺는 조건으로’는 בַּבְּרִית의 문맥적 기능을 자연스럽게 반영합니다.
