id: 1KI.20.15
reference: 1 Kings 20:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּפְקֹ֗ד אֶֽת נַעֲרֵי֙ שָׂרֵ֣י הַ/מְּדִינ֔וֹת וַ/יִּהְי֕וּ מָאתַ֖יִם שְׁנַ֣יִם וּ/שְׁלֹשִׁ֑ים וְ/אַחֲרֵי/הֶ֗ם פָּקַ֧ד אֶת כָּל הָ/עָ֛ם כָּל בְּנֵ֥י יִשְׂרָאֵ֖ל שִׁבְעַ֥ת אֲלָפִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/015.yaml
  text: So he mustered the young men of the provincial commanders[a], and they were two hundred and thirty-two; and after them he mustered all the people, all the sons of Israel, seven thousand.
  footnotes:
  - marker: a
    text: Or 'all the Israelites.' The Hebrew reads 'all the sons of Israel,' a masculine familial expression used for the people of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그는 지방 관원들의 젊은이들을 징집하였는데, 그 수는 이백삼십이 명이었고, 그 뒤에 그는 모든 백성, 곧 이스라엘의 모든 아들들을 징집하였는데 칠천 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들 모두’. 히브리어는 ‘이스라엘의 모든 아들들’이라고 되어 있으며, 이는 백성을 가리키는 남성적 가족 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד / פָּקַד
  english_pob_choice: mustered
  chosen_korean: 징집하였는데
  alternatives_korean:
  - 소집하였는데
  - 점검하였는데
  - 계수하였는데
  lexicon: HALOT
  rationale: 군사적 맥락에서 פָּקַד는 단순한 계산보다 병력을 모아 편성하는 의미가 강하므로, 한국어에서도 군사 행위가 드러나는 ‘징집하다’가 가장 가깝습니다.
- source_word: נַעֲרֵי שָׂרֵי הַמְּדִינֹת
  english_pob_choice: young men of the provincial commanders
  chosen_korean: 지방 관원들의 젊은이들
  alternatives_korean:
  - 지방 총독들의 젊은이들
  - 지방 통치자들의 젊은이들
  - 지방 관원들의 종들
  lexicon: HALOT
  rationale: 나아르(young men/servants)는 문맥상 신분을 단정하기 어려우므로, 영어 POB의 ‘young men’을 따라 ‘젊은이들’로 두고, מְדִינָה는 행정 구역의 ‘지방’으로 옮겼습니다.
- source_word: מָאתַיִם שְׁנַיִם וּשְׁלֹשִׁים
  english_pob_choice: two hundred and thirty-two
  chosen_korean: 이백삼십이 명
  alternatives_korean:
  - 이백삼십이
  - 232명
  - 이백 서른둘
  lexicon: HALOT
  rationale: 히브리어 수사는 단순한 인원 집계를 가리키므로, 자연스러운 현대 한국어의 인원 표현인 ‘이백삼십이 명’으로 옮겼습니다.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  english_pob_choice: all the sons of Israel
  chosen_korean: 이스라엘의 모든 아들들
  alternatives_korean:
  - 이스라엘 사람들 모두
  - 이스라엘의 모든 이들
  - 모든 이스라엘 백성
  lexicon: HALOT
  rationale: 문자적으로는 ‘이스라엘의 아들들’이지만, POB가 남성적 가족 표현을 유지하므로 그 긴장을 살려 직역하되 한국어에서 자연스럽게 배열했습니다.
theological_decisions:
- issue: 남성적 가족 표현의 보존 여부
  chosen_reading: 이스라엘의 모든 아들들
  alternative_readings:
  - 이스라엘 사람들 모두
  - 모든 이스라엘 백성
  rationale: 히브리어는 כלל בני ישראל라는 남성적 가족 표현을 사용하므로, 이를 평탄화하지 않고 보존해 원문이 청자에게 주는 포괄적이면서도 남성형인 뉘앙스를 드러냈습니다.
  doctrine_reference: 성경 본문의 형식과 의미를 함께 보존하는 번역 원칙
