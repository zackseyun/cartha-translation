  text: וְ/הָ/אֲנָשִׁים֩ יְנַחֲשׁ֨וּ וַֽ/יְמַהֲר֜וּ וַ/יַּחְלְט֣וּ הֲ/מִמֶּ֗/נּוּ וַ/יֹּֽאמְרוּ֙ אָחִ֣י/ךָ בֶן הֲדַ֔ד וַ/יֹּ֖אמֶר בֹּ֣אוּ קָחֻ֑/הוּ וַ/יֵּצֵ֤א אֵלָי/ו֙ בֶּן הֲדַ֔ד וַֽ/יַּעֲלֵ֖/הוּ עַל הַ/מֶּרְכָּבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/033.yaml
  text: Now the men were watching for an omen[a], and they quickly seized on it from him and said, “Ben-hadad is your brother.” And he said, “Come, take him.” Then Ben-hadad came out to him[c][b], and he had him come up into the chariot.
  footnotes:
  - marker: a
    text: Or “were divining” / “were taking it as an omen.” The Hebrew verb can refer to omen-seeking; here it likely means they were alert for a favorable sign in Ahab’s words.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression rendered “seized on it from him” is difficult; the sense is that they quickly latched onto Ahab’s wording as a favorable concession.
    reason: lexical_alternative
  - marker: c
    text: 'Or “he brought him up into the chariot.” The Hebrew verb is causative: Ahab caused Ben-hadad to come up into the chariot.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람들은 징조를 살피다가[a] 그가 한 말에서 그 표현을 재빨리 붙잡고[b] 말했습니다. “벤하닷은 당신의 형제입니다.” 그러자 그가 말했습니다. “와서 그를 데려오시오.” 그때 벤하닷이 그에게로 나왔고, 그가 벤하닷을 병거에 오르게 했습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 נחשׁ는 ‘점을 치다’, ‘징조를 살피다’, 또는 ‘징조로 받아들이다’라는 뜻을 가질 수 있습니다. 여기서는 그들이 아합의 말에서 자신들에게 유리한 신호를 찾고 있던 상황을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 난해합니다. 직역하면 그들이 ‘그에게서 그것을 재빨리 붙잡았다’는 말입니다. 여기서는 그들이 아합의 발언 속 표현을 유리한 양보로 즉시 받아들였다는 뜻으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사는 사역형입니다. 따라서 아합이 벤하닷을 병거에 오르게 했다는 뜻이며, 직접 들어 올렸다는 의미로만 한정되지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַחֲשׁוּ
  english_pob_choice: were watching for an omen
  chosen_korean: 징조를 살피고 있다가
  alternatives_korean:
  - 점을 치고 있다가
  - 조짐을 살피고 있다가
  - 징조를 보고 있다가
  lexicon: HALOT
  rationale: Piel נחשׁ의 ‘점치다/징조를 살피다’ 범위를 살리되, 이 장면이 실제 주술 행위라기보다 아합의 말에서 유리한 신호를 읽는 상황이므로 ‘징조를 살피고’로 옮겼습니다.
- source_word: וַיַּחְלְטוּ הֲמִמֶּנּוּ
  english_pob_choice: seized on it from him
  chosen_korean: 그에게서 재빨리 그것을 받아 내며
  alternatives_korean:
  - 그에게서 재빨리 그것을 붙잡으며
  - 그의 말에서 그것을 낚아채며
  - 그에게서 그것을 재빨리 취하며
  lexicon: HALOT
  rationale: 난해한 חלט의 ‘붙들어 취하다/재빠르게 낚아채다’ 뉘앙스를 살려, 아합의 말을 유리한 확정으로 재빨리 받아낸다는 뜻이 드러나도록 했습니다.
- source_word: אָחִיךָ
  english_pob_choice: your brother
  chosen_korean: 당신의 형제
  alternatives_korean:
  - 당신의 брат?
  - 당신의 친족
  - 당신의 형
  lexicon: HALOT
  rationale: 문맥상 외교적 호칭으로 쓰인 직역형 표현을 유지했습니다. 한국어에서는 자연스럽게 공손한 대화체에 맞춰 ‘당신의 형제’로 옮겼습니다.
- source_word: וַיַּעֲלֵהוּ עַל הַמֶּרְכָּבָה
  english_pob_choice: he had him come up into the chariot
  chosen_korean: 그가 그를 병거에 오르게 했습니다
  alternatives_korean:
  - 그가 그를 병거로 데려올라 하였습니다
  - 그가 그를 병거에 데려올렸습니다
  - 그가 그를 병거에 올라오게 했습니다
  lexicon: HALOT
  rationale: עלה의 사역형을 반영해 단순히 ‘올렸다’보다 ‘오르게 했다’로 옮겨, 강제적 물리행위보다는 이동을 허용/지시한 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 직접 화법의 명령형과 서술체의 높임
  chosen_reading: 아합의 발화는 본문 흐름에 맞춰 평서체 내부의 직접 명령으로 처리하되, 전체 서술은 현대 합쇼체로 유지했습니다.
  alternative_readings:
  - 명령을 더 완곡하게 옮겨 ‘오십시오, 그를 데려가십시오’로 처리
  - 서술 전체를 구어체로 낮춤
  rationale: 히브리어 원문의 급박한 명령 흐름을 보존해야 하므로, 왕의 발화는 직접성 있게 살리고 내러티브만 합쇼체로 정리했습니다.
  doctrine_reference: 서사체 화법 재현 원칙
