  to: 이 종이 이리저리 일을 보는 동안[a], 그가 없어졌습니다.[b] 그러자 이스라엘 왕이 그에게 말했습니다. “당신의 판결대로입니다.[c] 당신이 스스로 판결하셨습니다.”
  rationale: 원문의 관용적 활동 표현을 물리적 이동으로 한정하지 않고, 왕 앞에서의 한국어 겸양 표현을 자연화했습니다. 또한 왕의 선언을 화자가 스스로 제시한 기준에 따른 판결로 명료하게 옮겼습니다. 각주 표지는 각 해당 표현에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:51:18Z'
review_pass:
  verdict: revise
  source_fidelity: ‘여기저기 바쁘게 움직이는’은 히브리어 관용구의 분주함을 대체로 전달하지만, 원문의 עֹשֵׂה는 특정한 ‘움직임’보다 이리저리 일을 처리하거나 활동하는 모습을 가리킵니다. 또한 왕 앞에서 말하는 עַבְדְּךָ는 한국어에서는 ‘당신의 종’보다 ‘이 종’이 자연스럽고 적절한 겸양 표현입니다. 마지막 משפטך는 화자가 스스로 제시한 기준에 따른 판결이라는 뜻이므로 ‘당신의 판결은 이렇습니다’보다 ‘당신의 판결대로입니다’가 원문의 자기판결 구조를 더 직접적으로 보존합니다.
  naturalness: 합쇼체의 서술과 인용 형식은 적절합니다. 다만 직접 발화 안의 ‘당신의 종’은 현대 한국어 왕실 알현 상황에서 다소 번역투이므로 ‘이 종’으로 고치는 편이 자연스럽습니다. 각주 표지도 해당 어구 바로 뒤에 배치하는 것이 독해와 주석 연결에 더 적절합니다.
  terminology: ‘종’은 왕에 대한 겸손한 자기 호칭으로 적절하며, ‘판결’은 מִשְׁפָּט의 법정적 의미를 잘 살립니다. חָרָצְתָּ는 이 문맥에서 법적 결정을 내리거나 판결한다는 뜻이므로 ‘스스로 판결하셨습니다’로 옮겨 משפט과의 연결 및 강조된 ‘당신이’를 보존합니다.
