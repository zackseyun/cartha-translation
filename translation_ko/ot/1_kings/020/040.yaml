reference: 1 Kings 20:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י עַבְדְּ/ךָ֗ עֹשֵׂ֥ה הֵ֛נָּה וָ/הֵ֖נָּה וְ/ה֣וּא אֵינֶ֑/נּוּ וַ/יֹּ֨אמֶר אֵלָ֧י/ו מֶֽלֶךְ יִשְׂרָאֵ֛ל כֵּ֥ן מִשְׁפָּטֶ֖/ךָ אַתָּ֥ה חָרָֽצְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/040.yaml
  text: And as your servant was busy here and there[a], he was gone. Then the king of Israel said to him, “So shall your judgment be[c][b]; you yourself have decided it.”
  footnotes:
  - marker: a
    text: Or “was doing this and that.” The Hebrew idiom means being occupied in various directions or tasks.
    reason: lexical_alternative
  - marker: b
    text: Literally, “and he was not,” meaning the man under guard was no longer present.
    reason: lexical_alternative
  - marker: c
    text: Or “your sentence” / “your verdict”; the line means the king accepts the speaker’s own stated standard of judgment against him.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 종이 이리저리 일을 보는 동안[a], 그가 없어졌습니다.[b] 그러자 이스라엘 왕이 그에게 말했습니다. “당신의 판결대로입니다.[c] 당신이 스스로 판결하셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이것저것 하느라 바쁜 동안.” 히브리어 표현은 이리저리 분주하게 활동하거나 일을 처리함을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그가 있지 않습니다.” 문맥상 감시하던 사람이 더 이상 그 자리에 없음을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “당신의 판결은 그러합니다.” ‘판결’은 여기서 משפט의 법정적 결론을 가리키며, 이어지는 말은 그가 자기 말로 스스로 판결했음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 종복
  - 당신의 노예
  lexicon: HALOT
  rationale: 왕 앞에서의 겸손한 자기호칭으로 기능하므로 관계적 뉘앙스를 살려 ‘종’으로 옮겼습니다. ‘노예’는 본문의 왕실 예우를 지나치게 약화시킬 수 있어 여기서는 피했습니다.
- source_word: עֹשֵׂה הֵנָּה וָהֵנָּה
  english_pob_choice: was busy here and there
  chosen_korean: 여기저기 바쁘게 움직이는 사이에
  alternatives_korean:
  - 이리저리 일하고 있는 사이에
  - 이것저것 하느라 바쁜 사이에
  lexicon: HALOT
  rationale: 관용적으로 ‘이리저리/여기저기’의 분산된 움직임과 분주함을 나타내므로, 상황적 핑계의 뉘앙스를 살려 자연스러운 현대어로 표현했습니다.
- source_word: וְהוּא אֵינֶנּוּ
  english_pob_choice: he was gone
  chosen_korean: 그는 사라졌습니다
  alternatives_korean:
  - 그는 없었습니다
  - 그는 더 이상 없었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그가 있지 않다’이지만 문맥상 감시 중인 사람이 도주하여 자리를 비운 상황이므로, 지나친 해석 없이 결과를 드러내는 ‘사라졌습니다’로 옮겼습니다.
- source_word: מִשְׁפָּטֶךָ
  english_pob_choice: your judgment
  chosen_korean: 당신의 판결
  alternatives_korean:
  - 당신의 심판
  - 당신의 재판
  lexicon: HALOT
  rationale: 법정적 결론을 가리키는 말이므로 ‘판결’이 가장 직접적입니다. ‘심판’은 신적 심판의 뉘앙스가 강하고, ‘재판’은 절차를 더 강하게 드러냅니다.
- source_word: חָרָצְתָּ
  english_pob_choice: you yourself have decided it
  chosen_korean: 당신이 직접 그것을 정했습니다
  alternatives_korean:
  - 당신이 스스로 그것을 판결했습니다
  - 당신이 그것을 스스로 결정했습니다
  lexicon: HALOT
  rationale: ‘결정하다/판정하다’의 의미를 살리되, 앞의 판결 선언과 연결되도록 ‘직접’으로 강조를 나타냈습니다. 영어 POB의 자기판결 취지를 한국어로 자연스럽게 전달합니다.
theological_decisions:
- issue: 왕이 피고의 진술을 자기 자신에게 적용하는 법정적 반전
  chosen_reading: 왕이 상대의 기준을 그대로 받아 그 사람의 말로 그 사람을 판결하는 장면으로 읽었습니다.
  alternative_readings:
  - 단순한 꾸지람으로 읽을 수 있음
  - 도덕적 교훈 일반으로 완화해 읽을 수 있음
  rationale: 문맥상 핵심은 수사적 풍자보다 법정적 자기판결입니다. 따라서 ‘판결’과 ‘직접 그것을 정했습니다’로 자백한 기준이 곧 유죄의 근거가 됨을 분명히 했습니다.
  doctrine_reference: 성경의 공의와 자기 증언의 효력에 관한 일반적 법정 원리
