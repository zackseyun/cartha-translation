  naturalness: 초안의 ‘아벡으로, 곧 그 성읍으로’는 원문의 연속 동작을 동격처럼 처리하여 다소 부자연스럽고, ‘성읍에 들어가, 안쪽 방으로 들어갔습니다’는 쉼표 때문에 반복이 더 두드러집니다. 수정안은 한국어 문장 흐름을 자연스럽게 다듬습니다.
  terminology: ‘아벡’, ‘벤하닷’, ‘성읍’, ‘성벽’은 적절합니다. חֶדֶר בְּחָדֶר는 확정적으로 ‘은밀한 공간’이라고 풀이하기보다 문자적 표현과 가능한 뜻을 열어 둔 각주가 더 적절합니다.
