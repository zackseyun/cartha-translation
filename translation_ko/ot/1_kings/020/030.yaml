  yaml_path: translation/ot/1_kings/020/030.yaml
  text: The survivors fled to Aphek[a], into the city, and the wall fell on twenty-seven thousand of the remaining men. Ben-hadad also fled and entered the city, into an inner room.
  footnotes:
  - marker: a
    text: 'Hebrew: ''a room within a room,'' an idiom for an inner or innermost chamber.'
    reason: lexical_alternative
translation:
  language: ko
  text: 남은 자들이 아벡[a]으로, 곧 그 성읍으로 도망하였고, 성벽이 남은 이만칠천 명 위에 무너졌습니다. 또한 벤하닷도 도망하여 성읍에 들어가, 안쪽 방으로 들어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로 ‘방 안의 방’이며, 안쪽의 은밀한 공간을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָרִים
  english_pob_choice: the survivors / the remaining
  chosen_korean: 남은 자들
  alternatives_korean:
  - 생존자들
  - 남아 있던 사람들
  lexicon: HALOT
  rationale: 전투 문맥에서 ‘survivors’의 의미를 살리되, 뒤의 ‘남은 이만칠천 명’과 자연스럽게 맞도록 ‘남은 자들’로 옮겼습니다.
- source_word: אֲפֵקָה
  english_pob_choice: to Aphek
  chosen_korean: 아벡으로
  alternatives_korean:
  - 아벡에
  - 아벡 쪽으로
  lexicon: 고유명사 표기
  rationale: 지명은 현대 외래어 표기 방식에 따라 음역하고, 방향성을 나타내는 도착격 조사 ‘-으로’로 원문의 이동을 반영했습니다.
- source_word: חֶדֶר בְּחָדֶר
  english_pob_choice: an inner room
  chosen_korean: 안쪽 방
  alternatives_korean:
  - 내실
  - 방 안의 방
  - 가장 안쪽 방
  lexicon: HALOT
  rationale: 직역하면 ‘방 안의 방’이지만, 문맥상 숨거나 피신한 내부 공간을 뜻하므로 현대 한국어로는 ‘안쪽 방’이 가장 자연스럽습니다.
theological_decisions:
- issue: בן הדד의 도주 묘사의 어조
  chosen_reading: 벤하닷도 도망하여 성읍에 들어가, 안쪽 방으로 들어갔습니다.
  alternative_readings:
  - 벤하닷도 피하여
  - 벤하닷도 도망쳐
  rationale: 원문은 전장의 패주와 궁지에 몰린 상황을 서술하므로, 완곡한 표현보다 ‘도망하다’를 유지해 서사의 긴박함을 보존했습니다.
