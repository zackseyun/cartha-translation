  text: וַ/יִּמְצָא֙ אִ֣ישׁ אַחֵ֔ר וַ/יֹּ֖אמֶר הַכֵּ֣י/נִי נָ֑א וַ/יַּכֵּ֥/הוּ הָ/אִ֖ישׁ הַכֵּ֥ה וּ/פָצֹֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/037.yaml
  text: Then he found another man and said[a], “Please strike me.” So the man struck him and wounded him.
  footnotes:
  - marker: a
    text: 'Hebrew repeats the verb ''strike'' for emphasis: literally, ''the man struck him, striking and wounding.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그가 또 다른 사람을 찾아 말했습니다. “부디 나를 치십시오.” 그래서 그 사람이 그를 쳤습니다 — 치고 상하게 하면서.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어는 ‘치다’ 동사를 반복하여 강조합니다. 직역하면 “그 사람이 그를 쳤는데, 치고 상하게 하였다”에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא אִישׁ אַחֵר
  english_pob_choice: Then he found another man
  chosen_korean: 그러자 그가 또 다른 사람을 찾아
  alternatives_korean:
  - 그러자 그가 또 다른 남자를 찾아
  - 그리고 그가 다른 사람을 찾아
  lexicon: HALOT
  rationale: וַיִּמְצָא의 서술 진행을 ‘그러자’로 자연스럽게 잇고, אִישׁ אַחֵר은 성별이 드러나는 ‘사람/남자’ 중 문맥상 가장 무난한 ‘사람’으로 옮겼습니다.
- source_word: הַכֵּי/נִי נָא
  english_pob_choice: Please strike me
  chosen_korean: 부디 나를 치십시오
  alternatives_korean:
  - 제발 나를 치십시오
  - 나를 치십시오, 부디
  lexicon: HALOT
  rationale: נכה의 명령형은 약한 ‘때리다’보다 강한 ‘치다’가 מתאים하며, נָא는 공손한 간청으로서 ‘부디’가 잘 드러냅니다.
- source_word: וַיַּכֵּהוּ הָאִישׁ
  english_pob_choice: So the man struck him
  chosen_korean: 그래서 그 사람이 그를 쳤습니다
  alternatives_korean:
  - 그러자 그 사람이 그를 쳤습니다
  - 그래서 그 남자가 그를 쳤습니다
  lexicon: HALOT
  rationale: 연속 서술을 한국어의 결과 연결인 ‘그래서’로 옮기고, 뒤의 정관사적 הָאִישׁ은 앞선 두 번째 인물을 분명히 가리키므로 ‘그 사람’으로 처리했습니다.
- source_word: הַכֵּה וּפָצֹעַ
  english_pob_choice: striking and wounding him
  chosen_korean: 치고 상하게 하면서
  alternatives_korean:
  - 치며 상하게 하면서
  - 치고 상처를 내면서
  lexicon: HALOT
  rationale: 히브리어의 동사 반복과 강조를 살리되 한국어에서는 어색한 직역을 피하고, 타격과 부상을 함께 나타내는 결과적 표현으로 압축했습니다.
