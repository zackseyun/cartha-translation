  text: So the king of Israel went to his house sullen and angry[a], and he came to Samaria.
  footnotes:
  - marker: a
    text: Or 'resentful and angry.' The Hebrew pair סַר וְזָעֵף combines terms of inward displeasure and visible vexation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이스라엘의 왕은 자기 집으로 가서 심기가 상하고 분개한 채로, 사마리아로 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 זוג형(‘סַר וְזָעֵף’)은 속으로 못마땅해하는 태도와 밖으로 드러난 격분을 함께 나타내므로, 문맥상 ‘심기가 상하고 분개한’으로 옮겼습니다.
    reason: lexical_alternative
