    text: 히브리어의 한 쌍의 표현(‘סַר וְזָעֵף’)은 속으로 못마땅해하거나 침울한 상태와 겉으로 드러난 분노를 함께 나타냅니다. 또는 ‘시무룩하고 화가 난 채’.
    reason: lexical_alternative
