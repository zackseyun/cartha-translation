  lexicon: HALOT
  rationale: 인간 왕에게 대한 궁정식 호칭이므로 ‘주/왕이여’로 존대하되, 신적 호칭과 섞이지 않도록 문맥을 분명히 했습니다.
- source_word: לְךָ אֲנִי וְכָל אֲשֶׁר לִי
  english_pob_choice: I am yours, and all that is mine
  chosen_korean: 저는 왕의 것이며, 제게 있는 모든 것도 왕의 것입니다
  alternatives_korean:
  - 저는 왕의 것이며, 제게 있는 모든 것은 왕의 것입니다
