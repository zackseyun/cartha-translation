  rationale: 소속·충성을 나타내는 말로서 ‘~의 것입니다’가 가장 직접적이며, 뒤의 포괄구도 같은 구조로 대응시켰습니다.
theological_decisions:
- issue: 인간 왕에게 대한 호칭의 존대 수준
  chosen_reading: ‘내 주 왕이여’로 높임을 유지하되, 신적 의미 없이 궁정적 복종의 표현으로 읽었습니다.
  alternative_readings:
  - ‘내 주인 왕이여’
  - ‘왕이여’
  rationale: 본문의 화자는 아합에게 굴복하는 벤하닷의 정치적 항복을 말하므로, 과도한 신학화 없이 사회적 위계를 드러내는 존대가 적절합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; translate titles according to context.'
