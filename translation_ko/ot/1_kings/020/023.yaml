  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַבְדֵ֨י מֶֽלֶךְ אֲרָ֜ם אָמְר֣וּ אֵלָ֗י/ו אֱלֹהֵ֤י הָרִים֙ אֱלֹ֣הֵי/הֶ֔ם עַל כֵּ֖ן חָזְק֣וּ מִמֶּ֑/נּוּ וְ/אוּלָ֗ם נִלָּחֵ֤ם אִתָּ/ם֙ בַּ/מִּישׁ֔וֹר אִם לֹ֥א נֶחֱזַ֖ק מֵ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/023.yaml
  text: And the servants of the king of Aram said to him[a], “Their gods are gods of the hills; therefore they were stronger than we were. But if we fight against them on the plain, surely we will be stronger than they are.”
  footnotes:
  - marker: a
    text: Or, “Their God is a god of the hills …” The Hebrew uses plural forms (“gods”), reflecting the Arameans’ pagan way of speaking about Israel’s God.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 아람 왕의 신하들이 그에게 말했습니다[a]. “그들의 신들은 산의 신들입니다. 그러므로 그들이 우리보다 강했습니다. 그러나 우리가 그들과 평지에서 싸운다면, 우리는 틀림없이 그들보다 강할 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 하나님은 산의 하나님입니다’라고도 옮길 수 있습니다. 히브리어는 복수형 표현을 써서, 아람 사람들의 다신교적 방식으로 이스라엘의 하나님을 말하고 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַבְדֵי מֶלֶךְ אֲרָם
  english_pob_choice: And the servants of the king of Aram
  chosen_korean: 아람 왕의 신하들
  alternatives_korean:
  - 아람 왕의 종들
  - 아람 왕의 관리들
  lexicon: HALOT
  rationale: 왕실 문맥의 עבד는 ‘종’이나 ‘신하/신복’로 모두 가능하지만, 여기서는 왕에게 속한 궁정 인물을 가리키므로 자연스럽고 격식 있는 ‘신하들’이 적절합니다.
- source_word: אֱלֹהֵי הָרִים / אֱלֹהֵיהֶם
  english_pob_choice: their gods are gods of the hills
  chosen_korean: 그들의 신들은 산의 신들입니다
  alternatives_korean:
  - 그들의 하나님은 산의 하나님입니다
  - 그들의 신은 산의 신입니다
  lexicon: HALOT
  rationale: 히브리어는 복수형 표현을 사용하며, 이는 아람 사람들의 다신교적 이해를 그대로 반영합니다. 따라서 단수로 ‘하나님’이라고 정리하지 않고 복수 ‘신들’을 유지했습니다.
- source_word: עַל כֵּן
  english_pob_choice: therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그렇기 때문에
  - 그래서
  lexicon: HALOT
  rationale: 원인-결과를 잇는 표준적 접속 표현으로, 문어체 합쇼체에 맞으면서 גם 원문의 논리 연결을 분명히 드러냅니다.
- source_word: מִישׁוֹר
  english_pob_choice: on the plain
  chosen_korean: 평지에서
  alternatives_korean:
  - 평원에서
  - 넓은 들판에서
  lexicon: HALOT
  rationale: מִישׁוֹר는 평탄한 땅/평지를 가리키므로, 산과 대비되는 전장 지형을 한국어로 직접 드러내는 ‘평지’가 가장 적절합니다.
- source_word: אִם לֹא נֶחֱזַק
  english_pob_choice: surely we will be stronger than they are
  chosen_korean: 우리는 틀림없이 그들보다 강할 것입니다
  alternatives_korean:
  - 우리가 그들보다 더 강해질 것입니다
  - 반드시 그들보다 강할 것입니다
  lexicon: HALOT
  rationale: אִם לֹא는 여기서 단순 조건문이 아니라 강한 확신을 나타내므로 ‘틀림없이’로 옮겨 아람 사람들의 자신만만한 어조를 살렸습니다.
theological_decisions:
- issue: 아람 사람들이 야훼를 다신교적으로 오해하는 표현을 어떻게 보존할 것인가
  chosen_reading: ‘그들의 신들은 산의 신들입니다’라고 옮겨, 화자의 오해를 본문 그대로 드러냈습니다.
  alternative_readings:
  - ‘그들의 하나님은 산의 하나님입니다’
  - ‘그들의 신은 산의 신입니다’
  rationale: 이 구절은 서술자의 신학적 진술이 아니라 적대자들의 왜곡된 발화이므로, 원문의 복수형과 오해를 평탄화하지 않고 유지해야 내러티브의 아이러니가 보존됩니다.
  doctrine_reference: 원문 발화의 화자-관점 보존; 번역이 신학적 긴장을 미리 해소하지 않음.
