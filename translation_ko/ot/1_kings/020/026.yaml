base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/026.yaml
  text: At the turn of the year[c][b][a], Ben-hadad mustered Aram and went up to Aphek for battle with Israel.
  footnotes:
  - marker: a
    text: Hebrew literally, 'at the return of the year,' an idiom for when the annual cycle came around again; some render it 'in the spring.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Arameans.' Hebrew 'Aram' can refer to the kingdom or its people/army.
    reason: lexical_alternative
  - marker: c
    text: Or 'against Israel.' The Hebrew preposition is literally 'with,' used here in a battle context.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 해가 다시 돌아올 때에 벤하닷이 아람 군대를 소집하여 이스라엘과 싸우려고 아벡으로 올라갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘해가 돌아올 때’라는 관용구로, 한 해의 주기가 다시 도래하는 때를 뜻합니다. 일부는 ‘봄에’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘아람’이라고 합니다. 이는 아람 왕국을 가리킬 수도 있고, 여기서는 아람 사람들 또는 아람 군대를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 전치사는 문자적으로 ‘와/과’이지만, 여기서는 전투의 상대를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  english_pob_choice: At the turn of the year
  chosen_korean: 해가 바뀌는 때에
  alternatives_korean:
  - 연말연초에
  - 해의 회기가 돌아올 때에
  - 봄에
  lexicon: HALOT
  rationale: 직역인 ‘해의 돌아옴’의 의미를 살리면서도 한국어로 자연스럽게 시간 관용구를 옮겼습니다. ‘봄에’는 군사적 맥락에서 가능한 추론이지만 본문이 명시하지는 않으므로 본문에는 넣지 않았습니다.
- source_word: וַיִּפְקֹד
  english_pob_choice: mustered
  chosen_korean: 소집하고
  alternatives_korean:
  - 소집했습니다
  - 점검하고
  - 동원하고
  lexicon: HALOT
  rationale: 군사 문맥에서 פקד는 병력을 모아 동원·점검하는 뜻이므로, ‘소집하다’가 가장 자연스럽고 기능적으로도 맞습니다.
- source_word: אֶת אֲרָם
  english_pob_choice: Aram
  chosen_korean: 아람을
  alternatives_korean:
  - 아람 사람들을
  - 시리아를
  lexicon: HALOT
  rationale: 본문의 고유명사를 그대로 음역해 ‘아람’으로 두었습니다. 여기서는 나라/군대 전체를 가리킬 수 있으나, 본문 자체의 표기를 유지하는 쪽이 더 직접적입니다.
- source_word: עִם יִשְׂרָאֵל
  english_pob_choice: with Israel
  chosen_korean: 이스라엘과 싸우려고
  alternatives_korean:
  - 이스라엘과 함께
  - 이스라엘을 대적하여
  lexicon: HALOT
  rationale: 히브리어 전치사는 문자적으로 ‘~와’이지만, 전투 문맥에서는 실제 의미가 적대 관계를 나타냅니다. 한국어에서는 이 의미를 드러내어 ‘싸우려고’로 풀었습니다.
