source:
  edition: WLC
  text: וַ/יַּחְגְּרוּ֩ שַׂקִּ֨ים בְּ/מָתְנֵי/הֶ֜ם וַ/חֲבָלִ֣ים בְּ/רָאשֵׁי/הֶ֗ם וַ/יָּבֹ֨אוּ֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יֹּ֣אמְר֔וּ עַבְדְּ/ךָ֧ בֶן הֲדַ֛ד אָמַ֖ר תְּחִֽי נָ֣א נַפְשִׁ֑/י וַ/יֹּ֛אמֶר הַ/עוֹדֶ֥/נּוּ חַ֖י אָחִ֥/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/032.yaml
  text: So they tied sackcloth around their waists and ropes on their heads[a], and they came to the king of Israel and said, “Your servant Ben-hadad says, ‘Please let me live.’” And he said[b], “Is he still alive? He is my brother.”
  footnotes:
  - marker: a
    text: Or, 'Spare my life, please.' Literally, 'May my life live, please.'
    reason: lexical_alternative
  - marker: b
    text: '''He is my brother'' likely expresses political or covenantal fraternity, not literal family relation.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 굵은 베를 허리에 두르고 머리에 밧줄을 두른 채 이스라엘 왕에게 와서 말했습니다. “왕의 종 벤하닷이 말합니다. ‘제발 내 생명을 살려 주십시오.’[a]” 그러자 그가 말했습니다. “그가 아직 살아 있습니까? 그는 내 형제입니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제발 저를 살려 주십시오.” 히브리어를 직역하면 “제발 내 생명이 살게 하십시오”에 가깝습니다.
    reason: alternative_reading
  - marker: b
    text: “그는 내 형제입니다”는 문자적 형제 관계가 아니라 정치적 또는 언약적 우호를 뜻할 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּחְגְּרוּ
  english_pob_choice: they tied around
  chosen_korean: 허리에 두르고
  alternatives_korean:
  - 허리에 매고
  - 둘러맸습니다
  lexicon: HALOT
  rationale: חגר는 몸에 둘러 매는 동작을 가리키므로, 현대 한국어에서는 자연스럽게 "두르다"로 옮기되 구체적인 신체 부위를 살려 표현했습니다.
- source_word: שַׂקִּים
  english_pob_choice: sackcloth
  chosen_korean: 굵은 베
  alternatives_korean:
  - 삼베
  - 베옷
  lexicon: HALOT
  rationale: 통곡과 굴욕의 상징인 שַׂקִּים은 한국어 성경 전통에서도 물질감을 살린 "굵은 베"가 자연스럽고, '옷'을 덧붙여 의미를 좁히지 않았습니다.
- source_word: וַחֲבָלִים בְּרָאשֵׁיהֶם
  english_pob_choice: ropes on their heads
  chosen_korean: 머리에는 줄을 두른 채
  alternatives_korean:
  - 머리에 줄을 얹은 채
  - 머리 위에 밧줄을 두른 채
  lexicon: HALOT
  rationale: חֲבָלִים은 일반적으로 줄/밧줄을 뜻하므로 '줄'로 옮기고, בְּרָאשֵׁיהֶם은 정확한 배치를 단정하기보다 표시적 행위를 드러내는 '머리에는 ... 두른 채'로 처리했습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: Your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 종복
  - 당신의 노예
  lexicon: HALOT
  rationale: 왕에게 낮추어 말하는 예절적 자기호칭이지만, עבד의 기본 의미를 살려 '종'으로 옮겨 원문의 신분적 낮춤을 유지했습니다.
- source_word: תְּחִי נָא נַפְשִׁי
  english_pob_choice: Please let me live
  chosen_korean: 제발 내 생명을 살려 주십시오
  alternatives_korean:
  - 제발 저를 살려 주십시오
  - 제발 제 목숨을 살려 주십시오
  lexicon: HALOT
  rationale: 직역하면 '내 생명이 살게 해 주십시오'에 가까우므로, 한국어에서 자연스러우면서도 생명 보존의 간청을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: הַעוֹדֶנּוּ חַי
  english_pob_choice: Is he still alive?
  chosen_korean: 아직도 살아 있습니까?
  alternatives_korean:
  - 아직 살아 있습니까?
  - 그가 아직 살아 있습니까?
  lexicon: HALOT
  rationale: עוֹד + חַי의 상태 질문을 현대 한국어의 간결한 의문문으로 옮겼습니다.
theological_decisions:
- issue: אָחִי הוּא의 의미 보존
  chosen_reading: '"그는 내 형제입니다"로 직역해, 혈연인지 정치적/동맹적 호칭인지 열어 둡니다.'
  alternative_readings:
  - 그는 내 동맹입니다
  - 그는 내 형제 같은 사람입니다
  rationale: 히브리어는 일반적인 친족 용어 אָח를 사용하며, 문맥상 정치적 우호를 뜻할 가능성이 크지만 원문 자체가 그 긴장을 해소하지 않으므로 그대로 유지하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: source의 의미 긴장을 해소하지 않고 보존한다.'
