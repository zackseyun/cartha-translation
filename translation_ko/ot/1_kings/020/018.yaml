base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/018.yaml
  text: And he said[a], “If they have come out for peace, seize them alive; and if they have come out for battle, seize them alive.”
  footnotes:
  - marker: a
    text: Or, “If they have come out peacefully … if they have come out for war.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「만일 그들이 평화를 위해 나왔다면, 살아 있는 채로 붙잡으십시오. 만일 그들이 전투를 위해 나왔다면, 살아 있는 채로 붙잡으십시오」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들이 평화롭게 나왔다면 … 그들이 전쟁을 위해 나왔다면.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그가 말하였습니다
  - 그리고 그가 말했습니다
  lexicon: HALOT
  rationale: 서사적 wayyiqtol의 단순 발화를 자연스러운 합쇼체로 옮겼습니다. 앞의 연결감은 한국어 문장 흐름으로 충분히 드러나므로 과잉 접속사는 피했습니다.
- source_word: לְשָׁלוֹם
  english_pob_choice: for peace
  chosen_korean: 평화를 위해
  alternatives_korean:
  - 평화롭게
  - 평화의 뜻으로
  lexicon: HALOT
  rationale: לְ + 명사의 목적/지향을 살려 단순한 상태묘사보다 ‘~을 위해’로 옮겼습니다. 이는 전투 대조 구조에서도 의미를 분명히 드러냅니다.
- source_word: תִּפְשׂוּם
  english_pob_choice: seize them
  chosen_korean: 붙잡으십시오
  alternatives_korean:
  - 사로잡으십시오
  - 잡으십시오
  lexicon: HALOT
  rationale: 군사적 명령의 강도를 살리면서도 한국어에서 자연스러운 명령형으로 옮겼습니다. ‘사로잡다’보다 직접적이고, ‘잡다’보다 상황의 긴박함이 더 잘 드러납니다.
- source_word: חַיִּים
  english_pob_choice: alive
  chosen_korean: 살아 있는 채로
  alternatives_korean:
  - 살아서
  - 생포하여
  lexicon: HALOT
  rationale: 부사적 목적격의 상태를 분명히 드러내기 위해 ‘살아 있는 채로’로 옮겼습니다. ‘생포하여’는 결과를 덧붙여 원문보다 해석적입니다.
theological_decisions:
- issue: 두 조건절에서 동일한 명령이 반복되는 수사 효과
  chosen_reading: 두 경우 모두 명령을 같은 형태로 반복하여, 조건의 차이와 무관하게 포획 명령이 동일하게 주어진 점을 드러냈습니다.
  alternative_readings:
  - 첫 절만 옮기고 둘째 절은 축약
  - 둘째 절을 ‘그렇더라도’로 약화
  rationale: 히브리어는 반복을 통해 긴박하고 단호한 어조를 강조합니다. 이를 평탄화하면 문장의 군사적 압력이 약해집니다.
  doctrine_reference: 본문의 수사적 강조 보존 원칙
