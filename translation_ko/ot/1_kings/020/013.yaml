  text: וְ/הִנֵּ֣ה נָבִ֣יא אֶחָ֗ד נִגַּשׁ֮ אֶל אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֗אמֶר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הְֽ/רָאִ֔יתָ אֵ֛ת כָּל הֶ/הָמ֥וֹן הַ/גָּד֖וֹל הַ/זֶּ֑ה הִנְ/נִ֨י נֹתְנ֤/וֹ בְ/יָֽדְ/ךָ֙ הַ/יּ֔וֹם וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/013.yaml
  text: 'And behold[a], a certain prophet came near to Ahab king of Israel and said, “Thus says Yahweh: Have you seen all this great multitude? Behold, I am giving it into your hand today, and you shall know that I am Yahweh.”'
  footnotes:
  - marker: a
    text: Or “all this vast army” or “all this great horde”; the Hebrew word can denote a large throng or host, here referring to the enemy forces.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 보십시오, 어떤 예언자 한 사람이 아합, 곧 이스라엘 왕에게 다가와 말했습니다. “야훼께서 이렇게 말씀하십니다. 네가 이 큰 무리를 보았느냐? 보아라, 내가 오늘 그것을 네 손에 넘기겠다. 그러면 네가 내가 야훼인 줄 알게 될 것이다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무리’는 여기서 적군의 대규모 집합을 가리키며, 영어 POB의 ‘great multitude / vast army / great horde’에 해당할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 보십시오
  - 그리고 보라
  lexicon: HALOT
  rationale: 서술 전환과 갑작스러운 주목을 불러오는 감탄사의 힘을 살리되, 현대 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: נָבִיא אֶחָד
  english_pob_choice: a certain prophet
  chosen_korean: 어떤 예언자 한 사람
  alternatives_korean:
  - 한 예언자
  - 어떤 예언자
  lexicon: HALOT
  rationale: 정체를 특정하지 않는 불특정성을 유지하려고 ‘어떤 … 한 사람’으로 옮겼습니다.
- source_word: הֶהָמוֹן הַגָּדוֹל הַזֶּה
  english_pob_choice: all this great multitude
  chosen_korean: 이 큰 무리
  alternatives_korean:
  - 이 큰 군중
  - 이 큰 군세
  lexicon: HALOT
  rationale: 히브리어 הָמוֹן의 넓은 뜻을 살리되, 문맥상 적군을 가리키는 집합 표현으로 ‘무리’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 신명은 ‘야훼’로 일관되게 옮겼습니다.
- source_word: בְיָדְךָ
  english_pob_choice: into your hand
  chosen_korean: 네 손에
  alternatives_korean:
  - 네 권력 아래
  - 네 힘에
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 전달하되, 한국어에서는 ‘넘기다’와 함께 써서 의미를 분명히 했습니다.
theological_decisions:
- issue: 하나님이 전쟁의 승패를 주권적으로 տնօր리하신다는 선언
  chosen_reading: 야훼께서 적군을 아합의 손에 넘기심으로 자신을 야훼로 알게 하시는 말씀으로 읽었습니다.
  alternative_readings:
  - 단순한 전술적 승리 예고
  - 이스라엘의 정치적 우위 선언
  rationale: 마지막 인식 공식(‘내가 야훼인 줄’)은 단순 승전 예고를 넘어, 야훼의 자기 계시와 주권을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
