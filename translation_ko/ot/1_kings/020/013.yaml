- from: 그리고 보십시오, 어떤 예언자 한 사람이 아합, 곧 이스라엘 왕에게 다가와 말했습니다. “야훼께서 이렇게 말씀하십니다. 네가 이 큰 무리를 보았느냐? 보아라, 내가 오늘 그것을 네 손에 넘기겠다. 그러면 네가 내가 야훼인 줄 알게 될 것이다.”[a]
  to: 보십시오, 어떤 예언자가 이스라엘 왕 아합에게 다가와 말했습니다. “야훼께서 이렇게 말씀하십니다. ‘왕께서는 이 거대한 무리[a] 전체를 보셨습니까? 보십시오, 내가 오늘 그들을 왕의 손에 넘기겠습니다. 그러면 왕께서는 내가 야훼인 줄 아시게 될 것입니다.’”
  rationale: 원문의 담화 표지(‘보십시오’), 불특정 예언자, 이스라엘 왕 아합, ‘이 거대한 무리 전체’, 오늘의 인도, 그리고 야훼를 알게 되는 인식 공식을 모두 보존했습니다. 동시에 왕에게 하는 예언자 발화를 현대 합쇼체로 통일하고, 한국어에서 자연스럽도록 대상을 ‘그들을’로 받았습니다. 각주는 ‘무리’에 직접 연결하여 군사 문맥의 가능한 어휘 대안을 제시했습니다.
