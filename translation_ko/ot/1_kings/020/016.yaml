base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/016.yaml
  text: They went out at noon[a], while Ben-hadad was drinking himself drunk in the booths, he and the thirty-two kings who were helping him.
  footnotes:
  - marker: a
    text: Or 'in the shelters' or 'in the pavilions.' The Hebrew literally says 'in the booths.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 한낮에 나갔는데, 벤하닷은 초막들 안에서 술에 취해 마시고 있었고, 그와 그를 돕는 서른두 왕이 함께 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘초막들 안에서’라고 합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  english_pob_choice: They went out
  chosen_korean: 나갔는데
  alternatives_korean:
  - 나갔습니다
  - 출진했는데
  lexicon: HALOT
  rationale: נָגַע/יצא의 기본 의미는 단순한 ‘나감’이므로, 군사적 맥락을 유지하되 과장하지 않는 ‘나갔는데’로 옮겼습니다.
- source_word: בַּצָּהֳרָיִם
  english_pob_choice: at noon
  chosen_korean: 한낮에
  alternatives_korean:
  - 정오에
  - 낮중에
  lexicon: HALOT
  rationale: 히브리어의 시간 표현은 하루의 한가운데를 가리키므로, 현대 한국어에서 자연스러운 ‘한낮에’로 옮겼습니다.
- source_word: בַּסֻּכּוֹת
  english_pob_choice: in the booths
  chosen_korean: 초막들 안에서
  alternatives_korean:
  - 부스들 안에서
  - 천막들 안에서
  - 초막에서
  lexicon: HALOT
  rationale: 소스가 문자적으로 ‘booths’라고 밝히므로, 의미를 평평하게 만들지 않고 구체적인 초막 이미지를 살렸습니다.
- source_word: שִׁכּוֹר
  english_pob_choice: drunk / drinking himself drunk
  chosen_korean: 술에 취해 마시고 있었고
  alternatives_korean:
  - 술에 취해 있었고
  - 취하도록 마시고 있었고
  lexicon: HALOT
  rationale: 분사 שֹׁתֶה와 형용사 שִׁכּוֹר의 결합이 진행 중인 음주와 그 결과 상태를 함께 나타내므로, 두 요소를 모두 드러내는 표현을 택했습니다.
- source_word: עֹזֵר אֹתוֹ
  english_pob_choice: who were helping him
  chosen_korean: 그를 돕는
  alternatives_korean:
  - 그를 돕고 있는
  - 그를 지원하는
  lexicon: HALOT
  rationale: עזר의 핵심은 실제적인 도움/원조이므로, 관계절을 간결하게 살려 ‘그를 돕는’으로 옮겼습니다.
theological_decisions:
- issue: 벤하닷의 상태 묘사
  chosen_reading: ‘술에 취해 마시고 있었고’로, 단순한 취함이 아니라 만취와 음주 행위를 함께 드러냈습니다.
  alternative_readings:
  - ‘술에 취해 있었습니다’
  - ‘술에 취하도록 마시고 있었습니다’
  rationale: 본문은 분사 ‘마시다’와 형용사 ‘취한’이 결합되어 있어, 둘 중 하나만 살리면 의미가 약해집니다. 군사적 패배 직전의 무절제함을 본문 수준에서 분명히 보여 주는 것이 적절합니다.
  doctrine_reference: 본문 해석상의 서술 강조; 교리적 쟁점 없음
