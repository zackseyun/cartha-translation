base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/008.yaml
  text: Then all the elders and all the people said to him[a], “Do not listen, and do not consent.”
  footnotes:
  - marker: a
    text: Or 'Do not obey, and do not agree.' The Hebrew verbs can carry the senses of listening/obeying (שׁמע) and being willing/consenting (אבה).
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모든 장로와 모든 백성이 그에게 말했습니다. “듣지 말고, 동의하지 마십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘듣다’는 여기서 ‘순종하다’ 또는 ‘따르다’의 뜻을 지닐 수 있고, ‘동의하다’는 ‘기꺼이 응하다’의 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 이어 주는 방식으로 완료형 서술을 사용해, 사건의 다음 진행을 드러냈습니다.
- source_word: כָּל הַזְּקֵנִים
  english_pob_choice: all the elders
  chosen_korean: 모든 장로
  alternatives_korean:
  - 모든 늙은이
  lexicon: HALOT
  rationale: 여기서 זקנים은 연령보다 공동체 지도층을 가리키므로, 한국어에서도 ‘장로’가 문맥에 가장 정확합니다.
- source_word: אַל תִּשְׁמַע
  english_pob_choice: Do not listen
  chosen_korean: 듣지 마십시오
  alternatives_korean:
  - 귀 기울이지 마십시오
  - 순종하지 마십시오
  lexicon: HALOT
  rationale: שׁמע는 문맥상 ‘듣다/경청하다’와 ‘순종하다’의 범위를 가질 수 있으나, 여기서는 먼저 청을 받아들이지 말라는 권고이므로 ‘듣지 마십시오’가 가장 직접적입니다.
- source_word: וְלֹא תֹאבֶה
  english_pob_choice: and do not consent
  chosen_korean: 동의하지 마십시오
  alternatives_korean:
  - 응하지 마십시오
  - 원하지 마십시오
  lexicon: HALOT
  rationale: אבה는 ‘기꺼이 하다/동의하다’의 뜻이므로, 협상 상황에 맞는 ‘동의하지 마십시오’로 옮겼습니다.
