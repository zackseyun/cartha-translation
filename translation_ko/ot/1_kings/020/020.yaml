base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/020.yaml
  text: And each man struck down his man[a], and Aram fled, and Israel pursued them[b]. But Ben-hadad king of Aram escaped on a horse with horsemen.
  footnotes:
  - marker: a
    text: Hebrew literally, 'each man struck his man,' that is, each struck the man facing him.
    reason: lexical_alternative
  - marker: b
    text: Or 'escaped on horseback and with horsemen'; the Hebrew may describe Ben-hadad fleeing mounted and accompanied by riders.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 각 사람이 자기의 사람을 쳤고, 아람은 달아났으며, 이스라엘은 그들을 추격했습니다. 그러나 아람의 왕 벤하닷은 말과 기병을 거느리고 도망쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘각 사람이 자기 사람을 쳤다’이며, 대치한 상대를 가리키는 표현입니다.
    reason: source_note
  - marker: b
    text: 히브리어의 ‘말과 기병’은 벤하닷이 말을 타고 기병을 거느린 채 달아난 장면일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ אִישׁ אִישׁוֹ
  english_pob_choice: each man struck down his man
  chosen_korean: 각 사람이 자기의 사람을 쳤고
  alternatives_korean:
  - 각 사람이 자기 상대를 쳤고
  - 각 사람이 자기 맞은편 사람을 쳤고
  lexicon: HALOT
  rationale: 히브리어의 직역 감각인 ‘사람이 자기 사람’ 구조를 살리되, 한국어에서는 자연스럽게 ‘자기의 사람’으로 옮겨 전투 대치 상황을 드러냈습니다.
- source_word: וַיָּנֻסוּ אֲרָם
  english_pob_choice: Aram fled
  chosen_korean: 아람은 달아났으며
  alternatives_korean:
  - 아람이 도망했으며
  - 아람이 물러갔으며
  lexicon: HALOT
  rationale: 군사적 패주를 나타내는 동사로서 ‘달아나다’가 가장 직접적이며, 본문의 급박한 흐름도 잘 드러냅니다.
- source_word: וַיִּרְדְּפֵם יִשְׂרָאֵל
  english_pob_choice: Israel pursued them
  chosen_korean: 이스라엘은 그들을 추격했습니다
  alternatives_korean:
  - 이스라엘은 그들을 पीछ겼습니다
  - 이스라엘은 그들을 쫓았습니다
  lexicon: HALOT
  rationale: רדף의 표준적인 전투 문맥 의미를 따라 ‘추격하다’를 택해, 단순한 뒤쫓기보다 군사적 추적을 분명히 했습니다.
- source_word: עַל סוּס וּפָרָשִׁים
  english_pob_choice: on a horse with horsemen
  chosen_korean: 말과 기병을 거느리고 도망쳤습니다
  alternatives_korean:
  - 말을 타고 기병과 함께 도망쳤습니다
  - 말 위에서 기병과 함께 도망쳤습니다
  lexicon: HALOT
  rationale: 히브리어는 베ן하닷이 말에 올라 기병들과 함께 달아난 모습을 간명하게 묘사하므로, ‘거느리고’로 동반·수행의 뉘앙스를 살렸습니다. 싱글 말과 복수 기병을 모두 자연스럽게 반영했습니다.
theological_decisions:
- issue: 전투 패배와 생존 묘사의 번역 강도
  chosen_reading: ‘쳤고 / 달아났으며 / 추격했습니다 / 도망쳤습니다’로 압축된 군사 서술을 유지했습니다.
  alternative_readings:
  - 더 완곡하게 ‘맞섰고 / 물러났으며 / 뒤쫓았습니다 / 빠져나갔습니다’로 조정
  rationale: 본문은 승패가 분명한 전투 장면을 빠르게 나열하므로, 서사적 긴장과 패배의 현실을 약화시키지 않는 직설적 표현을 택했습니다.
  doctrine_reference: 서사 본문 번역 원칙
