- from: 그리고 각 사람이 자기의 사람을 쳤고, 아람은 달아났으며, 이스라엘은 그들을 추격했습니다. 그러나 아람의 왕 벤하닷은 말과 기병을 거느리고 도망쳤습니다.[a][b]
