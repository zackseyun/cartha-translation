  source_fidelity: 문두 접속사 ו는 시간 부사 ‘이제’가 아니라 기본적으로 접속사이므로, ‘이제’는 원문의 명시적 의미를 덧붙입니다. 또한 בָּהּ는 사마리아를 가리키므로 ‘그것’보다 ‘그곳’ 또는 ‘사마리아’를 받는 표현이 자연스럽습니다.
