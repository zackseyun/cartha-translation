source:
  edition: WLC
  text: וּ/בֶן הֲדַ֣ד מֶֽלֶךְ אֲרָ֗ם קָבַץ֙ אֶת כָּל חֵיל֔/וֹ וּ/שְׁלֹשִׁ֨ים וּ/שְׁנַ֥יִם מֶ֛לֶךְ אִתּ֖/וֹ וְ/ס֣וּס וָ/רָ֑כֶב וַ/יַּ֗עַל וַ/יָּ֨צַר֙ עַל שֹׁ֣מְר֔וֹן וַ/יִּלָּ֖חֶם בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/001.yaml
  text: Now Ben-hadad king of Aram gathered all his army[a], and thirty-two kings with him, and horses and chariots[b]; then he went up and besieged Samaria and fought against it.
  footnotes:
  - marker: a
    text: Or 'And Ben-hadad king of Aram gathered...' The opening conjunction can be rendered more formally as 'and.'
    reason: lexical_alternative
  - marker: b
    text: '''Aram'' is the Hebrew place-name; traditionally, ''Syria.'''
    reason: alternative_reading
translation:
  language: ko
  text: 이제 아람 왕 벤하닷이 자기의 모든 군대를 모으고, 함께한 서른두 왕들과 말들과 병거들을 거느리고 올라와 사마리아를 포위하고 그것과 싸웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이제’는 서사의 시작을 자연스럽게 풀어낸 것이며, 원문의 단순 접속사 ו를 더 직설적으로 옮기면 ‘그리고’가 됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아람’은 히브리어 지명을 직접 반영한 번역입니다. 전통적 번역인 ‘시리아’도 가능하지만, 본문 출처를 더 가깝게 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֶן הֲדַד
  english_pob_choice: Now Ben-hadad
  chosen_korean: 이제 벤하닷이
  alternatives_korean:
  - 그리고 벤하닷이
  - 그때 벤하닷이
  lexicon: HALOT
  rationale: 서술의 전환을 자연스럽게 드러내되, 고유명사는 히브리어 음을 살려 옮겼습니다.
- source_word: מֶלֶךְ אֲרָם
  english_pob_choice: king of Aram
  chosen_korean: 아람 왕
  alternatives_korean:
  - 시리아 왕
  - 아람의 왕
  lexicon: HALOT
  rationale: 아람을 히브리어 지명 그대로 반영해 번역했으며, 전통적 ‘시리아’는 피했습니다.
- source_word: קָבַץ אֶת כָּל חֵילוֹ
  english_pob_choice: gathered all his army
  chosen_korean: 자기의 모든 군대를 모으고
  alternatives_korean:
  - 자기의 모든 군사를 모으고
  - 자기의 모든 군대를 집결시키고
  lexicon: HALOT
  rationale: חֵיל은 여기서 군사력/군대를 가리키므로, 한국어로는 자연스러운 집합 명사인 ‘군대’를 썼습니다.
- source_word: וּשְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ אִתּוֹ
  english_pob_choice: with thirty-two kings with him
  chosen_korean: 함께한 서른두 왕들
  alternatives_korean:
  - 그와 함께한 서른두 왕들
  - 서른두 왕들이 그와 함께
  lexicon: HALOT
  rationale: 동반 관계를 유지하면서 한국어 어순에 맞게 정리했습니다. 원문의 동반 의미를 드러내기 위해 ‘함께한’을 사용했습니다.
- source_word: וְסוּס וָרָכֶב
  english_pob_choice: and horses and chariots
  chosen_korean: 말들과 병거들
  alternatives_korean:
  - 말과 병거
  - 기병과 병거
  lexicon: HALOT
  rationale: 히브리어의 집합적 단수 표현을 한국어에서는 복수감이 자연스럽도록 ‘말들’, ‘병거들’로 옮겼습니다.
- source_word: וַיָּצַר עַל שֹׁמְרוֹן
  english_pob_choice: and besieged Samaria
  chosen_korean: 사마리아를 포위하고
  alternatives_korean:
  - 사마리아를 에워싸고
  - 사마리아에 진을 치고
  lexicon: HALOT
  rationale: 군사적 ‘포위’의 의미를 직접 반영했습니다.
- source_word: וַיִּלָּחֶם בָּהּ
  english_pob_choice: and fought against it
  chosen_korean: 그것과 싸웠습니다
  alternatives_korean:
  - 그 성과 싸웠습니다
  - 그곳과 전쟁을 벌였습니다
  lexicon: HALOT
  rationale: לחם + ב는 대상을 향해 전투를 벌이는 뜻이므로, 과장하지 않고 ‘싸웠습니다’로 옮겼습니다.
