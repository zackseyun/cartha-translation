  text: 이들은 성에서 나왔습니다. 이들은 곧 지방 지휘관들의 청년들[a]과 그들 뒤에 있던 군대였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지방 지휘관들의 수행원들’ 또는 ‘시종들’. 히브리어 나아레(נַעֲרֵי)는 청년들뿐 아니라 개인 수행원이나 시종들을 가리킬 수도 있습니다.
    reason: נַעֲרֵי의 연령 의미와 수행원/시종 의미 사이의 어휘적 모호성을 본문에서 강제하지 않고 보존합니다.
