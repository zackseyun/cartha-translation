id: 1KI.20.19
reference: 1 Kings 20:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ יָצְא֣וּ מִן הָ/עִ֔יר נַעֲרֵ֖י שָׂרֵ֣י הַ/מְּדִינ֑וֹת וְ/הַ/חַ֖יִל אֲשֶׁ֥ר אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/019.yaml
  text: 'These went out from the city: the young men of the commanders of the provinces[a], and the army that was behind them.'
  footnotes:
  - marker: a
    text: Or 'the servants/attendants of the provincial commanders.' The Hebrew נַעֲרֵי can refer either to young men or to personal attendants, and the context may include both ideas.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 성에서 나왔습니다. 곧 지방 총독들의 부하 청년들과, 그 뒤를 따르던 군대입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה / These
  english_pob_choice: These
  chosen_korean: 이들은
  alternatives_korean:
  - 그리고 이들은
  - 이 사람들은
  lexicon: HALOT
  rationale: 지시 대명사의 집합적 지시를 자연스럽게 살리되, 서술 흐름을 해치지 않도록 ‘그리고’를 덧붙이지 않았습니다.
- source_word: מִן הָעִיר / from the city
  english_pob_choice: from the city
  chosen_korean: 성에서
  alternatives_korean:
  - 그 성에서
  - 도시에서
  lexicon: HALOT
  rationale: 출발점을 간결하게 표시하는 표현으로 옮겼습니다.
- source_word: נַעֲרֵי
  english_pob_choice: the young men
  chosen_korean: 부하 청년들
  alternatives_korean:
  - 젊은이들
  - 시종들
  - 수종들
  lexicon: HALOT
  rationale: 문맥상 지방 통치자들의 수행원/시종 성격과 연령감이 함께 있으므로, ‘청년들’과 ‘부하’를 함께 써서 두 뉘앙스를 모두 드러냈습니다.
- source_word: שָׂרֵי הַמְּדִינוֹת
  english_pob_choice: the commanders of the provinces
  chosen_korean: 지방 총독들
  alternatives_korean:
  - 지방의 지휘관들
  - 각 도의 관원들
  - 지방 영주들
  lexicon: HALOT
  rationale: שַׂר는 지배자·우두머리·지휘관의 폭이 있지만, 여기서는 행정 구역을 맡은 책임자들이므로 한국어에서 가장 자연스러운 관직어인 ‘총독들’을 택했습니다.
- source_word: וְהַחַיִל
  english_pob_choice: and the army
  chosen_korean: 군대
  alternatives_korean:
  - 그리고 군대
  - 병력
  - 무리
  lexicon: HALOT
  rationale: 뒤따르던 무장 집단을 가리키므로 군사 집합 명사로 옮겼습니다.
- source_word: אֲשֶׁר אַחֲרֵיהֶם / that was behind them
  english_pob_choice: that was behind them
  chosen_korean: 그 뒤를 따르던
  alternatives_korean:
  - 그들 뒤에 있던
  - 그 뒤에 있던
  - 그 뒤를 따르는
  lexicon: HALOT
  rationale: 히브리어 관계절의 위치 관계를 한국어에서 자연스럽게 풀어, 군대가 선발대의 뒤에 배치된 상태를 드러냈습니다.
