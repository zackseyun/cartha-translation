  text: וַ/יִּשְׁלַ֤ח אֵלָי/ו֙ בֶּן הֲדַ֔ד וַ/יֹּ֕אמֶר כֹּֽה יַעֲשׂ֥וּ/ן לִ֛/י אֱלֹהִ֖ים וְ/כֹ֣ה יוֹסִ֑פוּ אִם יִשְׂפֹּק֙ עֲפַ֣ר שֹׁמְר֔וֹן לִ/שְׁעָלִ֕ים לְ/כָל הָ/עָ֖ם אֲשֶׁ֥ר בְּ/רַגְלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/010.yaml
  text: Ben-hadad sent to him and said[a], “May the gods do so to me, and more also, if the dust of Samaria will be enough for handfuls for all the people who are at my feet.”
  footnotes:
  - marker: a
    text: Hebrew literally, “if the dust of Samaria will suffice for hollows/handfuls for all the people at my feet.” The idiom means Ben-hadad boasts that Samaria is so small its dust would not provide even a handful for each of his followers.
    reason: lexical_alternative
translation:
  language: ko
  text: 벤하닷이 그에게 사람을 보내어 말했습니다. 「신들이 내게 이와 같이 하고도, 또 그보다 더하게 할지라도, 사마리아의 먼지가 내 발밑에 있는 모든 백성을 위하여 한 줌씩도 되지 못할 것이다」[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 “사마리아의 먼지가 내 발밑에 있는 모든 사람에게 한 줌씩 충분할지라도”입니다. 이 관용구는 사마리아가 너무 작아 그의 추종자들에게 한 줌씩 나눠 줄 먼지도 없다는 자랑을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  english_pob_choice: sent to him
  chosen_korean: 그에게 사람을 보내어
  alternatives_korean:
  - 그에게 보냈습니다
  - 그에게 전갈을 보냈습니다
  lexicon: HALOT
  rationale: 외교적 전달 상황에서 동사 ‘보내다’의 의미를 살리되, 영어 POB의 간결한 처리에 맞춰 메시지 전달을 자연스럽게 드러냈습니다.
- source_word: בֶּן הֲדַד
  english_pob_choice: Ben-hadad
  chosen_korean: 벤하닷
  alternatives_korean:
  - 벤-하닷
  - 벤하닷
  lexicon: 표준 외래어 표기 관행
  rationale: 고유명사는 한국어 음역 관행에 따라 표기했습니다.
- source_word: כֹּה יַעֲשׂוּן לִי אֱלֹהִים וְכֹה יוֹסִפוּ
  english_pob_choice: May the gods do so to me, and more also
  chosen_korean: 신들이 내게 이와 같이 하고도, 또 그보다 더하게 할지라도
  alternatives_korean:
  - 신들이 내게 이같이 하시고 또 더하시기를
  - 신들이 내게 그렇게 하고 또 더하게 할지라도
  lexicon: HALOT
  rationale: 이것은 고정된 맹세/저주 공식이므로, 위협의 힘을 살리면서도 한국어에서 자연스러운 조건적 맹세 표현으로 옮겼습니다.
- source_word: אִם יִשְׂפֹּק ...
  english_pob_choice: if ... will be enough
  chosen_korean: …되지는 못할 것이다
  alternatives_korean:
  - …충분하지 못할 것이다
  - …한 줌도 되지 못할 것이다
  lexicon: HALOT
  rationale: 히브리어의 조건절은 실제로는 과장된 불능 선포이므로, 한국어에서도 단순 조건문보다 결과적 부정 진술로 처리해 조롱의 뉘앙스를 살렸습니다.
- source_word: לִשְׁעָלִים
  english_pob_choice: for handfuls
  chosen_korean: 한 줌씩도
  alternatives_korean:
  - 한 줌으로
  - 손바닥 한 움큼씩도
  lexicon: HALOT
  rationale: POB의 ‘for handfuls’와 주석의 관용적 의미를 반영해, 사마리아의 먼지가 병력에게 나눠 줄 만큼도 되지 못한다는 뜻을 한국어 관용으로 살렸습니다.
- source_word: לְכָל הָעָם אֲשֶׁר בְּרַגְלָי
  english_pob_choice: for all the people who are at my feet
  chosen_korean: 내 발밑에 있는 모든 백성을 위하여
  alternatives_korean:
  - 내 발밑에 있는 모든 사람을 위하여
  - 내게 딸린 모든 백성을 위하여
  lexicon: HALOT
  rationale: ‘발밑에 있다’는 지휘권 아래 있음을 나타내는 히브리어 관용구를 그대로 살리면서, 한국어 독자가 이해할 수 있게 자연스럽게 옮겼습니다.
theological_decisions:
