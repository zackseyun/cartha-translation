  rationale: 벤하닷의 발화이므로 이 복수형은 야훼가 아니라 그가 섬기는 신들을 가리키는 것으로 이해하는 것이 서사와 가장 잘 맞습니다.
  doctrine_reference: 문맥 기반 고유용례
