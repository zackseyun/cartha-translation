  edition: WLC
  text: וַ/יֹּ֤אמֶר אַחְאָב֙ בְּ/מִ֔י וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/נַעֲרֵ֖י שָׂרֵ֣י הַ/מְּדִינ֑וֹת וַ/יֹּ֛אמֶר מִֽי יֶאְסֹ֥ר הַ/מִּלְחָמָ֖ה וַ/יֹּ֥אמֶר אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/014.yaml
  text: 'And Ahab said[a], “By whom?” And he said, “Thus says Yahweh: By the young men of the provincial officials.” Then he said, “Who will begin the battle?” And he said, “You.”'
  footnotes:
  - marker: a
    text: Or “By the attendants/servants of the provincial officials.” The Hebrew term for “young men” can also refer to retainers or aides in service to officials.
    reason: lexical_alternative
translation:
  language: ko
  text: 아합이 말했습니다. 「누구를 통해서입니까?」 그러자 그가 말했습니다. 「야훼께서 이렇게 말씀하십니다. 곧 지방 관리들의 부하 청년들을 통해서입니다.」 그러자 그가 말했습니다. 「누가 전투를 시작하겠습니까?」 그러자 그가 말했습니다. 「당신입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “지방 관리들의 시종/수행원들 가운데 있는 젊은이들”. 히브리어 ‘젊은이들’은 관리들에게 딸린 수행원이나 보좌 인력을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִי
  english_pob_choice: By whom?
  chosen_korean: 누구를 통해서입니까?
  alternatives_korean:
  - 누구입니까?
  - 누구에 의해서입니까?
  lexicon: HALOT
  rationale: ב + מי의 도구/행위자 질문을 한국어에서 자연스럽게 드러내기 위해 ‘누구를 통해서’로 옮겼습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하시기를
  - 야훼께서 이같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전언 공식의 형식을 살리되, 현대 한국어 합쇼체에 맞게 ‘이렇게 말씀하십니다’로 옮겼습니다.
- source_word: בְּנַעֲרֵי שָׂרֵי הַמְּדִינוֹת
  english_pob_choice: By the young men of the provincial officials
  chosen_korean: 지방 관리들의 부하 청년들
  alternatives_korean:
  - 지방 관리들의 젊은이들
  - 지방 총독들의 시종들
  lexicon: HALOT
  rationale: נַעַר의 ‘젊은이/수행원’ 가능성을 살리면서, 문맥상 관리들에 딸린 보좌 인력을 드러내기 위해 ‘부하 청년들’로 처리했습니다.
- source_word: מִי יֶאְסֹר הַמִּלְחָמָה
  english_pob_choice: Who will begin the battle?
  chosen_korean: 누가 전투를 시작하겠습니까?
  alternatives_korean:
  - 누가 싸움을 묶겠습니까?
  - 누가 전투를 개시하겠습니까?
  lexicon: HALOT
  rationale: אָסַר의 문자적 ‘묶다’보다 전쟁 관용구의 기능적 의미인 ‘시작하다/개시하다’를 한국어로 분명하게 살렸습니다.
- source_word: אָתָּה
  english_pob_choice: You
  chosen_korean: 당신입니다
  alternatives_korean:
  - 바로 당신입니다
  - 당신이오
  lexicon: HALOT
  rationale: 강조된 2인칭 단수 응답의 단호함을 보존하면서도 한국어 대화문으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 고유명사 ‘야훼’를 본문에 직접 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 감사 추적과 도서관 표준에 따라, 본문 속 신명은 칭호 대체 없이 고유명사로 드러내는 편이 원문 효과를 더 정확히 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
