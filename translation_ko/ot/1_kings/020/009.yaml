  text: וַ/יֹּ֜אמֶר לְ/מַלְאֲכֵ֣י בֶן הֲדַ֗ד אִמְר֞וּ לַֽ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ כֹּל֩ אֲשֶׁר שָׁלַ֨חְתָּ אֶל עַבְדְּ/ךָ֤ בָ/רִֽאשֹׁנָה֙ אֶעֱשֶׂ֔ה וְ/הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹ֥א אוּכַ֖ל לַ/עֲשׂ֑וֹת וַ/יֵּֽלְכוּ֙ הַ/מַּלְאָכִ֔ים וַ/יְשִׁבֻ֖/הוּ דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/009.yaml
  text: So he said to the messengers of Ben-hadad[a], “Say to my lord the king, ‘All that you sent to your servant the first time, I will do; but this thing I cannot do.’” And the messengers went and brought back word to him.
  footnotes:
  - marker: a
    text: Or “this matter”; Hebrew דָּבָר can mean “thing,” “matter,” or “word/message” depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 벤하닷의 사자들에게 말했습니다. “내 주 왕이시여, 왕께서 처음에 왕의 종에게 보내신 모든 것은 내가 하겠습니다. 그러나 이 일은[a] 내가 할 수 없습니다.” 그러자 사자들은 가서 그에게 답변을 전했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דָּבָר는 문맥에 따라 ‘일’, ‘사안’, ‘말’ 또는 ‘소식’을 뜻할 수 있습니다. 여기서는 새로 제시된 요구를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאֲכֵי
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들
  - 사신들
  lexicon: HALOT
  rationale: 정치적 문맥에서 בן-הדד의 공식 전달자들을 가리키므로, ‘전령들’보다 일반적이고 자연스러운 ‘사자들’로 옮겼습니다.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  english_pob_choice: to my lord the king
  chosen_korean: 내 주 왕께
  alternatives_korean:
  - 내 주인 왕께
  - 내 군주 왕께
  lexicon: HALOT
  rationale: אדֹן의 궁정적 존칭을 살리면서도 신적 호칭으로 오해되지 않도록, 왕에게 드리는 정중한 표현인 ‘내 주 왕께’를 택했습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 종복
  - 당신의 노예
  lexicon: HALOT
  rationale: 이 왕실 자기호칭은 굴종과 겸손을 나타내는 관용구이므로, 신분을 과도하게 확대하지 않는 ‘종’이 적절합니다.
- source_word: וְהַדָּבָר הַזֶּה
  english_pob_choice: but this thing
  chosen_korean: 그러나 이 일은
  alternatives_korean:
  - 그러나 이 일은
  - 그러나 이 사안은
  - 그러나 이 말은
  lexicon: HALOT
  rationale: דבר의 의미 범위가 넓지만 여기서는 새로 추가된 요구를 가리키므로, 한국어에서 자연스러운 ‘이 일’로 옮겼습니다.
- source_word: וַיְשִׁבֻהוּ דָּבָר
  english_pob_choice: brought back word to him
  chosen_korean: 그에게 말을 전해 주었습니다
  alternatives_korean:
  - 그에게 대답을 가져다주었습니다
  - 그에게 답변을 전했습니다
  lexicon: HALOT
  rationale: ‘돌려주다/전하다’의 관용적 결합을 살려, 단순한 보고가 아니라 되돌려 전한 응답이라는 점을 드러냈습니다.
theological_decisions:
- issue: 왕에게 드리는 공식적 복종 표현의 존칭 처리
  chosen_reading: 직접적인 신적 의미를 부여하지 않고, 궁정 예절에 맞는 존칭으로 ‘내 주 왕께’를 사용했습니다.
  alternative_readings:
  - 내 주인 왕께
  - 주군 왕께
  rationale: 본문의 אדֹן은 정치적·외교적 예우 표현이므로, 예배 언어로 오해되지 않게 하면서도 원문의 높임을 보존해야 합니다.
  doctrine_reference: 문맥 우선의 호칭 분별
