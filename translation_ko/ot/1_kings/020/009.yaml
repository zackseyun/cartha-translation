revisions:
- from: 그가 벤하닷의 사자들에게 말했습니다. “내 주 왕께 이렇게 말하시오. ‘당신이 처음에 당신의 종에게 보낸 것은 무엇이든지 내가 하겠습니다. 그러나 이 일은 내가 할 수 없습니다.’” 그러자 사자들이 가서 그에게 말을 전해 주었습니다.[a]
  to: 그가 벤하닷의 사자들에게 말했습니다. “내 주 왕이시여, 왕께서 처음에 왕의 종에게 보내신 모든 것은 내가 하겠습니다. 그러나 이 일은[a] 내가 할 수 없습니다.” 그러자 사자들은 가서 그에게 답변을 전했습니다.
