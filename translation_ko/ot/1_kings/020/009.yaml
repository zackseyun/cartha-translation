  source_fidelity: 대체로 원문을 충실히 반영합니다. 다만 마지막 동사구는 사자들이 벤하닷에게 ‘답변을 되돌려 전했다’는 뜻이므로, ‘전해 주었습니다’의 수혜 뉘앙스보다 ‘답변을 전했습니다’가 더 정확합니다. 또한 כֹּל אֲשֶׁר는 ‘무엇이든지’보다 앞서 전달된 요구 전체를 가리키는 ‘모든 것’이 더 직접적입니다.
  naturalness: 현대 표준어 합쇼체에 맞추어 서술은 ‘말했습니다/전했습니다’, 직접 명령은 ‘말하십시오’로 통일하는 것이 자연스럽습니다. 왕에게 하는 외교적 발화에서는 반복되는 ‘당신’보다 ‘왕께서/왕의’가 더 자연스럽고 격식에 맞습니다.
  terminology: ‘벤하닷’, ‘사자들’, ‘내 주 왕이시여’, ‘왕의 종’은 정치·외교 문맥과 원문의 겸양적 궁정 표현을 적절히 살립니다. דָּבָר는 새 요구를 가리키므로 본문에서는 ‘일’이 적절하며, 각주도 이 용례를 정확히 설명하도록 고쳤습니다.
