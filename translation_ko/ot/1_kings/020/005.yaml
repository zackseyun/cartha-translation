  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים וַ/יֹּ֣אמְר֔וּ כֹּֽה אָמַ֥ר בֶּן הֲדַ֖ד לֵ/אמֹ֑ר כִּֽי שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר כַּסְפְּ/ךָ֧ וּ/זְהָבְ/ךָ֛ וְ/נָשֶׁ֥י/ךָ וּ/בָנֶ֖י/ךָ לִ֥/י תִתֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/005.yaml
  text: 'The messengers returned and said[a], “Thus says Ben-hadad: ‘Though I sent to you, saying, “You shall give me your silver and your gold and your wives and your sons,”’”'
  footnotes:
  - marker: a
    text: Or “For I sent to you, saying …” The Hebrew particle כי can be rendered in several ways; here it is taken concessively in light of the escalation completed in the following verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 사자들이 돌아와서 말했습니다. “벤하닷이 이렇게 말합니다. ‘비록 내가 네게 보내어 이르기를, “너는 네 은과 금과 네 아내들과 네 아들들을 나에게 주어야 한다”라고 하였지만,’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כִּי는 ‘왜냐하면/참으로’ 등으로도 옮길 수 있습니다. 여기서는 다음 절에서 요구가 더 확대되는 흐름에 따라 양보적으로, 곧 ‘비록’으로 옮겼습니다. 양보절은 다음 절에서 이어져 완결됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  english_pob_choice: returned
  chosen_korean: 돌아와서
  alternatives_korean:
  - 되돌아와서
  - 다시 돌아와서
  lexicon: HALOT
  rationale: 연속 서술의 다음 동작을 자연스럽게 이어 주면서, 방향 이동의 완료를 간결하게 드러냅니다.
- source_word: הַמַּלְאָכִים
  english_pob_choice: the messengers
  chosen_korean: 사자들이
  alternatives_korean:
  - 전령들이
  - 사절들이
  lexicon: HALOT
  rationale: 정치·군사적 문맥의 인간 전령을 가리키므로 천사적 의미를 피해야 하며, 한국어에서는 ‘사자들’이 공문·전달자 뉘앙스를 담기 좋습니다.
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말합니다
  alternatives_korean:
  - 이같이 말합니다
  - 주께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 전형적 전령 공식이지만 한국어에서는 현재형 직설을 써서 직접 화법의 선포성을 살렸습니다.
- source_word: כִּי שָׁלַחְתִּי אֵלֶיךָ לֵאמֹר
  english_pob_choice: Though I sent to you, saying
  chosen_korean: 내가 당신에게 사람을 보내어 말하기를
  alternatives_korean:
  - 내가 당신에게 보내어 말하기를
  - 내가 당신에게 사람을 보내 말하기를
  lexicon: HALOT
  rationale: 히브리어 כי의 의미를 문맥상 양보적으로 살리되, 한국어에서는 ‘사람을 보내어’로 전령 파견의 사실을 분명히 드러내어 다음 절의 확대 요구와 이어지게 했습니다.
- source_word: לִי תִתֵּן
  english_pob_choice: You shall give me
  chosen_korean: 나에게 넘겨야 한다
  alternatives_korean:
  - 나에게 주어야 한다
  - 나에게 바쳐야 한다
  lexicon: HALOT
  rationale: 의무적 명령의 강압성을 살리면서, 단순 전달보다 소유권 포기를 요구하는 문맥을 드러내기 위해 ‘넘겨야 한다’를 택했습니다.
theological_decisions:
- issue: 벤하닷의 요구를 둘러싼 강압적 통치 언어의 톤
  chosen_reading: 직접 명령형의 위압과 소유 포기의 강제를 그대로 살렸습니다.
  alternative_readings:
  - 완곡한 요청처럼 보이게 만드는 번역
  - ‘내게 주어야 한다’처럼 중립화한 번역
  rationale: 본문은 협상 제안이 아니라 복속 요구이므로, 한국어도 압박과 침탈의 성격을 약화하지 않도록 해야 합니다.
  doctrine_reference: 본문 서술의 역사-문법적 의미 보존
- issue: 인용부 안의 직접 화법 레지스터
  chosen_reading: 겹인용을 유지하고, 바깥 서술은 합쇼체로, 인용문은 직접발화의 긴박성을 살렸습니다.
  alternative_readings:
  - 인용을 하나로 풀어 쓰는 방식
  - 모든 층위를 평서문으로 통일하는 방식
  rationale: 메신저 공식과 내부 인용의 층위를 보존해야 발화 주체가 분명해집니다.
  doctrine_reference: 서술 층위와 화자 구분의 보존
