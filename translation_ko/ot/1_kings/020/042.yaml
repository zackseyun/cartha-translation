  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה יַ֛עַן שִׁלַּ֥חְתָּ אֶת אִישׁ חֶרְמִ֖/י מִ/יָּ֑ד וְ/הָיְתָ֤ה נַפְשְׁ/ךָ֙ תַּ֣חַת נַפְשׁ֔/וֹ וְ/עַמְּ/ךָ֖ תַּ֥חַת עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/042.yaml
  text: 'And he said to him[a], “Thus says Yahweh: Because you have let go from your hand the man I had devoted to destruction, your life shall be for his life, and your people for his people.”'
  footnotes:
  - marker: a
    text: Or, “the man under my ban.” The Hebrew uses חֵרֶם language for someone devoted to destruction under divine judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 그에게 말했습니다. 「야훼께서 이렇게 말씀하십니다. 네가 내 손에서 멸망에 바쳐진 그 사람을 놓아주었으므로, 네 생명은 그의 생명을 대신하고 네 백성은 그의 백성을 대신할 것입니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “멸망에 바쳐진 그 사람.” 히브리어는 חֵרֶם 언어를 사용하며, 신적 심판 아래 진멸되도록 바쳐진 대상을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주님께서 이렇게 말씀하십니다
  - 야훼께서 말씀하시기를
  lexicon: HALOT
  rationale: 예언자적 전언 공식과 하나님의 이름을 프로젝트 기본값인 야훼로 살렸고, 현대 한국어에서 자연스러운 직접 인용 형식으로 옮겼습니다.
- source_word: שִׁלַּחְתָּ
  english_pob_choice: you have let go
  chosen_korean: 놓아주었으므로
  alternatives_korean:
  - 풀어주었으므로
  - 보내었으므로
  lexicon: HALOT
  rationale: 구금된 대상에 대한 석방/해제를 뜻하는 동사를 한국어 관용으로 자연스럽게 살렸으며, POB의 수정 판단처럼 ‘도망치게 하다’는 의미는 넣지 않았습니다.
- source_word: אִישׁ חֶרְמִי
  english_pob_choice: the man I had devoted to destruction
  chosen_korean: 멸망에 바쳐진 그 사람
  alternatives_korean:
  - 저주 아래 놓인 그 사람
  - 파멸되도록 바쳐진 그 사람
  lexicon: HALOT
  rationale: חֵרֶם의 언약적 심판 의미를 ‘멸망에 바치다’로 드러내어, 단순한 개인적 적대가 아니라 신적 심판 아래 둔 사람임을 보존했습니다.
- source_word: נַפְשְׁךָ / נַפְשׁוֹ
  english_pob_choice: your life shall be for his life
  chosen_korean: 네 생명은 그의 생명을 대신하고
  alternatives_korean:
  - 네 목숨은 그의 목숨을 대신하고
  - 네 생명은 그의 생명과 맞바뀌고
  lexicon: HALOT
  rationale: נֶפֶשׁ를 ‘생명’으로 옮겨 문맥의 생명 대 생명 대체 형식을 살렸고, תַּחַת의 대치 의미를 ‘대신하고’로 자연스럽게 표현했습니다.
- source_word: עַמְּךָ תַּחַת עַמּוֹ
  english_pob_choice: and your people for his people
  chosen_korean: 네 백성은 그의 백성을 대신할 것입니다
  alternatives_korean:
  - 네 백성은 그의 백성 대신이 될 것입니다
  - 네 백성은 그의 백성과 바뀔 것입니다
  lexicon: HALOT
  rationale: 앞 절과 평행을 이루도록 ‘대신하다’ 구문을 유지해, 개인의 생명뿐 아니라 공동체 전체에 미치는 심판의 대칭 구조를 드러냈습니다.
theological_decisions:
- issue: חֵרֶם 용어의 심판 강도 유지
  chosen_reading: ‘멸망에 바쳐진’으로 옮겨 언약적 심판과 전적 파멸의 의미를 드러냈습니다.
  alternative_readings:
  - ‘저주 아래 둔’
  - ‘진멸에 바친’
  rationale: 이 구절은 단순한 전쟁 포로나 개인적 복수가 아니라 야훼의 심판 선언이므로, חֵרֶם의 신학적 무게를 약화시키지 않도록 했습니다.
  doctrine_reference: 구약의 헤렘(진멸/바침) 심판 전통
- issue: 직접 인용 안의 보고체
  chosen_reading: 예언자적 전언 공식은 합쇼체로, 신적 발화는 합쇼체를 유지했습니다.
  alternative_readings:
  - 보다 구어적인 평서형
  - 더 전통적인 종결형
  rationale: 현대 표준어 성경 문체를 따르면서도, 하나님의 직접 발화가 가진 권위를 보존하기 위해 ‘말씀하십니다’ 형식을 선택했습니다.
  doctrine_reference: 성경 번역의 화행/화자 구분
