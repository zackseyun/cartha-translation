  yaml_path: translation/ot/1_kings/020/017.yaml
  text: Then the young men of the commanders of the provinces went out first[a], and Ben-hadad sent, and they reported to him, saying, “Men have come out from Samaria.”
  footnotes:
  - marker: a
    text: Hebrew simply says 'Ben-hadad sent'; 'sent out scouts' makes explicit the implied object from the context of the ensuing report.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 수비대장들의 젊은이들이 먼저 나왔고, 벤하닷이 사람을 보내자 그들이 그에게 보고하여 말했습니다. "사람들이 사마리아에서 나왔습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단순히 ‘보내다’라고만 말하며, 구체적으로 ‘정탐꾼’을 말하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי
  english_pob_choice: the young men of
  chosen_korean: 젊은이들
  alternatives_korean:
  - 종들
  - 시종들
  - 젊은 종들
  lexicon: HALOT
  rationale: נַעַר는 문맥에 따라 청년, 종, 시종, 수행원을 뜻할 수 있는데, 여기서는 전투 서사에서 지휘관들에게 딸린 젊은 수행원들을 가리키므로 ‘젊은이들’이 기본 의미를 살리면서도 자연스럽습니다.
- source_word: שָׂרֵי הַמְּדִינוֹת
  english_pob_choice: the commanders of the provinces
  chosen_korean: 수비대장들
  alternatives_korean:
  - 지방 총독들
  - 도(道)들의 지휘관들
  - 지방의 지휘관들
  lexicon: HALOT
  rationale: שָׂרִים는 통치자, 관리, 지휘관을 뜻하고, מְדִינוֹת는 행정 구역을 가리키는데, 이 절의 군사적 문맥에서는 ‘장군’보다 ‘수비대장들’이 기능을 더 분명히 드러냅니다.
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 사람을 보내자
  alternatives_korean:
  - 보냈고
  - 정탐꾼을 보내자
  - 군사를 보내자
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘보내다’라고만 말하지만, 이어지는 보고 장면상 파견된 대상이 사람임이 드러나므로 한국어에서는 그 함의를 풀어 ‘사람을 보내자’로 옮겼습니다.
- source_word: וַיַּגִּידוּ לוֹ לֵאמֹר
  english_pob_choice: and they reported to him, saying
  chosen_korean: 그들이 그에게 보고하여 말했습니다
  alternatives_korean:
  - 그에게 알리며 말했습니다
  - 그에게 전하여 말했습니다
  lexicon: HALOT
  rationale: נגד의 히필은 ‘알리다, 보고하다’의 뜻이므로, 군사 정황에 맞게 ‘보고하다’로 옮기고 뒤의 ‘말하다’로 직접 화법 도입을 살렸습니다.
- source_word: מִשֹּׁמְרוֹן
  english_pob_choice: from Samaria
  chosen_korean: 사마리아에서
  alternatives_korean:
  - 사마리아로부터
  - 사마리아 밖에서
  lexicon: 표준 외래어 표기
  rationale: שֹׁמְרוֹן은 표준적으로 ‘사마리아’로 옮기며, 출발점을 나타내는 전치사는 한국어 조사 ‘-에서’가 가장 자연스럽습니다.
