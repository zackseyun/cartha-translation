  text: וַ/יִּקְרָ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ לְ/כָל זִקְנֵ֣י הָ/אָ֔רֶץ וַ/יֹּ֨אמֶר֙ דְּעֽוּ נָ֣א וּ/רְא֔וּ כִּ֥י רָעָ֖ה זֶ֣ה מְבַקֵּ֑שׁ כִּֽי שָׁלַ֨ח אֵלַ֜/י לְ/נָשַׁ֤/י וּ/לְ/בָנַ/י֙ וּ/לְ/כַסְפִּ֣/י וְ/לִ/זְהָבִ֔/י וְ/לֹ֥א מָנַ֖עְתִּי מִמֶּֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/007.yaml
  text: Then the king of Israel called all the elders of the land and said, “Please know and see that this man is seeking trouble, for he sent to me for my wives, my sons, my silver, and my gold, and I did not withhold them from him.”
translation:
  language: ko
  text: 그러자 이스라엘 왕이 그 땅의 모든 장로를 불러 말했습니다. “부디 이 사람은 화를 꾀하고 있는 줄 알고 보십시오. 그가 내게 내 아내들과 내 아들들과 내 은과 내 금을 요구했는데, 내가 그것을 그에게서 거절하지 않았습니다.”
  philosophy: formal
lexical_decisions:
- source_word: רָעָה
  english_pob_choice: seeking trouble
  chosen_korean: 화를 꾀하고 있는
  alternatives_korean:
  - 악을 구하는
  - 해를 꾀하는
  - 문제를 일으키려 하는
  lexicon: רעע / רעה
  rationale: 영문 POB의 'trouble'을 따라, 단순한 도덕적 '악'보다 상황을 깨뜨리는 해악·분쟁의 의도를 드러내는 표현으로 옮겼습니다.
- source_word: דְּעוּ נָא וּרְאוּ
  english_pob_choice: Please know and see
  chosen_korean: 부디 … 알고 보십시오
  alternatives_korean:
  - 부디 알아보고 보십시오
  - 알고 보십시오
  - 부디 알아차리고 보십시오
  lexicon: ידע / ראה
  rationale: 두 명령형의 병렬성을 살리되, 한국어에서는 자연스러운 호응으로 '알다'와 '보다/확인하다'를 함께 살렸습니다.
- source_word: זִקְנֵי הָאָרֶץ
  english_pob_choice: all the elders of the land
  chosen_korean: 그 땅의 모든 장로
  alternatives_korean:
  - 온 땅의 모든 장로
  - 나라의 모든 장로
  - 그 지역의 모든 장로
  lexicon: זקן
  rationale: זִקְנֵי는 연장자이자 대표자 집단을 가리키므로, 관습적 교회 용어보다 서사적 맥락이 살아나는 '장로'를 유지했습니다.
- source_word: מָנַעְתִּי
  english_pob_choice: I did not withhold them from him
  chosen_korean: 내가 그것을 그에게서 거절하지 않았습니다
  alternatives_korean:
  - 내가 그것을 그에게서 아끼지 않았습니다
  - 내가 그것을 그에게서 막지 않았습니다
  - 내가 그것을 그에게서 숨기지 않았습니다
  lexicon: מנע
  rationale: 동사는 '막다/거절하다/아끼다'의 뉘앙스를 가지며, 여기서는 요구를 실제로 거부하지 않았다는 의미가 중심이어서 '거절하지 않았다'로 옮겼습니다.
theological_decisions:
- issue: 요구한 대상 목록의 소유격 반복
  chosen_reading: 내 아내들과 내 아들들과 내 은과 내 금
  alternative_readings:
  - 아내들과 아들들과 은과 금
  - 나의 아내들과 나의 아들들과 나의 은과 나의 금
  rationale: 히브리어의 반복된 1인칭 소유격을 살려 압박감과 상실 위협을 강화했습니다.
  doctrine_reference: 서사적 강조
