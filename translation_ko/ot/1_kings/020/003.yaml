  yaml_path: translation/ot/1_kings/020/003.yaml
  text: 'And he said to him[a], “Thus says Ben-hadad: Your silver and your gold are mine; your wives and your sons, the best, are mine.”'
  footnotes:
  - marker: a
    text: Or “your wives and your finest sons are mine.” The Hebrew adjective can mean “good,” “best,” or “choicest” in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말했습니다[a]. "벤하닷이 이렇게 말합니다. 네 은과 네 금은 내 것이다. 네 아내들과 네 아들들, 곧 가장 좋은 자들은 내 것이다."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 아내들과 네 가장 좋은 아들들은 내 것이다.” 히브리어 형용사는 이 문맥에서 “좋은”, “가장 좋은”, “가려 뽑힌” 뜻이 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לּוֹ
  english_pob_choice: And he said to him
  chosen_korean: 그가 그에게 말했습니다
  alternatives_korean:
  - 그가 그에게 말했다
  - 그리고 그가 그에게 말했습니다
  lexicon: HALOT
  rationale: 서사체의 단순한 אמר는 한국어에서 가장 투명하게 “말했습니다”로 옮기는 것이 자연스럽고, לּוֹ의 대상도 그대로 드러납니다.
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말합니다
  alternatives_korean:
  - 이같이 말씀하십니다
  - 이렇게 말씀합니다
  lexicon: HALOT
  rationale: 사자/선언 공식을 한국어에서 과장 없이 옮기되, 현재형의 선포적 뉘앙스를 유지했습니다.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  english_pob_choice: Your silver and your gold
  chosen_korean: 네 은과 네 금
  alternatives_korean:
  - 네 돈과 네 금
  - 네 은돈과 네 금
  lexicon: HALOT
  rationale: 구체적 재산 항목을 일반화하지 않고, 히브리어의 은/금을 그대로 살려 압박적 요구를 보존했습니다.
- source_word: וְנָשֶׁיךָ וּבָנֶיךָ הַטּוֹבִים
  english_pob_choice: your wives and your sons, the best
  chosen_korean: 네 아내들과 네 아들들, 곧 가장 좋은 자들
  alternatives_korean:
  - 네 아내들과 네 가장 좋은 아들들
  - 네 아내들과 네 아들들, 곧 네가 가장 좋게 여기는 자들
  lexicon: HALOT
  rationale: 하반의 הטּוֹבִים를 단순히 “좋은”이 아니라 문맥상 ‘가장 좋은/가려 뽑힌’ 의미로 보아, 영어 주석의 apposition을 반영해 ‘곧 가장 좋은 자들’로 처리했습니다.
theological_decisions:
- issue: בן־הדד의 직접 발화 등록과 인용부 처리
  chosen_reading: 벤하닷의 선언을 인용부 안에서 현재형 선포로 옮겼습니다.
  alternative_readings:
  - 모든 문장을 과거형 서술로 통일하기
  - 직접화법의 긴박감을 약화한 평서형으로 바꾸기
  rationale: 히브리어의 messenger formula는 단순 보고가 아니라 권위를 띤 요구를 전달하므로, 한국어에서도 인용부 내부의 현재형이 원문의 압박감을 잘 드러냅니다.
  doctrine_reference: 서사/담화 기능 보존
- issue: הַטּוֹבִים의 범위
  chosen_reading: ‘네 아들들, 곧 가장 좋은 자들’로 보아 전체 아들 집단에 대한 수식으로 옮겼습니다.
  alternative_readings:
  - ‘네 가장 좋은 아들들’로 일부만 지칭하기
  - ‘네 아들들 중 좋은 자들’로 분절하기
  rationale: 영어 POB의 수정 내역이 지적하듯, 히브리어 어순은 일부 선별이 아니라 ‘아들들’ 전체를 먼저 말한 뒤 그 성격을 덧붙이는 방식이므로 apposition을 살렸습니다.
  doctrine_reference: 문법-의미 일치
