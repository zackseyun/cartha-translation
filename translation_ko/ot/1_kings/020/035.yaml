source:
  edition: WLC
  text: וְ/אִ֨ישׁ אֶחָ֜ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֗ים אָמַ֧ר אֶל רֵעֵ֛/הוּ בִּ/דְבַ֥ר יְהוָ֖ה הַכֵּ֣י/נִי נָ֑א וַ/יְמָאֵ֥ן הָ/אִ֖ישׁ לְ/הַכֹּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/035.yaml
  text: Now a certain man from the sons of the prophets said to his companion by the word of Yahweh[b][a], “Please strike me.” But the man refused to strike him.
  footnotes:
  - marker: a
    text: Or “from the company of the prophets” or “from the disciples of the prophets.” The Hebrew reads “from the sons of the prophets,” a common expression for a prophetic group.
    reason: lexical_alternative
  - marker: b
    text: Or “at the word of the LORD” or “by the command of the LORD.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예언자들의 아들들 중 한 사람이[a] 야훼의 말씀에 따라[b] 자기 동료에게 말했습니다. “제발 나를 치십시오.” 그러나 그 사람은 그를 치기를 거절했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예언자들의 아들들’은 예언자 집단 또는 예언자들의 제자들을 가리키는 관용구일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼의 말씀으로’, ‘야훼의 명령으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֶחָד
  english_pob_choice: Now a certain man
  chosen_korean: 이제 한 사람이
  alternatives_korean:
  - 그리고 한 사람이
  - 어떤 사람이
  lexicon: HALOT
  rationale: 서사 도입의 וְ를 한국어로 자연스럽게 풀어 ‘이제’로 옮기고, אִישׁ אֶחָד의 관용적 지시를 ‘한 사람’으로 간결하게 반영했습니다.
- source_word: מִבְּנֵי הַנְּבִיאִים
  english_pob_choice: from the sons of the prophets
  chosen_korean: 예언자들의 아들들 가운데서
  alternatives_korean:
  - 예언자들의 무리 가운데서
  - 예언자들의 제자들 가운데서
  lexicon: HALOT
  rationale: 히브리어의 직역성을 살리되, ‘sons of the prophets’라는 특유의 표현을 그대로 드러내기 위해 ‘예언자들의 아들들’로 옮겼습니다.
- source_word: בִּדְבַר יְהוָה
  english_pob_choice: by the word of Yahweh
  chosen_korean: 야훼의 말씀으로
  alternatives_korean:
  - 야훼의 말씀에 따라
  - 야훼의 명령으로
  lexicon: HALOT
  rationale: ‘word of Yahweh’는 예언적 권위의 근거를 가리키므로, 한국어에서는 자연스럽게 ‘말씀으로’라고 옮겨 원문의 관용을 유지했습니다.
- source_word: הַכֵּינִי נָא
  english_pob_choice: Please strike me
  chosen_korean: 제발 나를 치시오
  alternatives_korean:
  - 부디 나를 치시오
  - 나를 쳐 주십시오
  lexicon: HALOT
  rationale: נכה의 핵심 의미를 ‘치다’로 유지하고, נָא는 요청의 뉘앙스를 살려 ‘제발’로 반영했습니다. 대화체 요청이므로 직접화법 안에서 공손한 명령형을 썼습니다.
- source_word: וַיְמָאֵן
  english_pob_choice: refused
  chosen_korean: 거절했습니다
  alternatives_korean:
  - 거부했습니다
  - 마다했습니다
  lexicon: HALOT
  rationale: 행동을 단호히 거절하는 뜻을 한국어 서술체로 자연스럽게 전달하기 위해 ‘거절했습니다’를 선택했습니다.
theological_decisions:
- issue: יהוה(YHWH)의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙에 따라 신명은 대체 호칭이 아닌 음역형 ‘야훼’로 유지해, 본문이 지닌 고유명사성과 소명 근거를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 직접화법에서의 높임말
  chosen_reading: 「제발 나를 치시오」
  alternative_readings:
  - 「제발 나를 치세요」
  - 「나를 쳐 주십시오」
  rationale: 요청하는 인물의 발화를 한국어 합쇼체로 옮기되, 대화 상대에게 직접 명령하는 문맥이므로 화용론상 가능한 공손 명령형을 사용했습니다.
  doctrine_reference: Korean target style guidance
