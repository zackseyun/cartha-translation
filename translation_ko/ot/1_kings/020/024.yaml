translation:
  language: ko
  text: '이 일을 하십시오: 왕들을 각기 자기 자리에서 물러나게 하고, 그들 대신 총독들을 세우십시오.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 대신 지방 총독들을 임명하십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הַדָּבָר הַזֶּה עֲשֵׂה
  english_pob_choice: And do this thing
  chosen_korean: 이 일을 하십시오
  alternatives_korean:
  - 이 일을 행하십시오
  - 이것을 하십시오
  lexicon: HALOT
  rationale: 앞에 나온 목적어와 명령형을 한국어에서는 자연스럽게 앞세워, broad한 דָּבָר를 ‘일’로 살리면서도 간결한 명령문으로 옮겼습니다.
- source_word: הָסֵר הַמְּלָכִים אִישׁ מִמְּקֹמוֹ
  english_pob_choice: remove the kings, each from his place
  chosen_korean: 왕들을 각기 자기 자리에서 물러나게 하고
  alternatives_korean:
  - 왕들을 각자 자리에서 제거하고
  - 왕들을 각기 자기 위치에서 옮기고
  lexicon: HALOT
  rationale: הסיר의 ‘제거/물러나게 하다’ 의미를 반영하되, כאן은 왕의 전면 폐위보다 지휘 자리에서의 축출이 핵심이므로 ‘물러나게 하다’가 문맥상 더 정확합니다. ‘각기’는 distributive한 אִישׁ를 살립니다.
- source_word: וְשִׂים פַּחוֹת תַּחְתֵּיהֶם
  english_pob_choice: and put governors in their place
  chosen_korean: 그들 대신 총독들을 세우십시오
  alternatives_korean:
  - 그 자리에 지방관들을 두십시오
  - 그들 대신 지방 총독들을 임명하십시오
  lexicon: HALOT
  rationale: פַּחוֹת는 행정 관직을 가리키므로 ‘총독들’이 가장 직접적입니다. שִׂים은 문자적으로 ‘두다/세우다’이므로, 임명의 함의를 과잉 설명하지 않는 ‘세우다’를 택했습니다.
theological_decisions:
- issue: 정치·행정 명령의 뉘앙스
  chosen_reading: 왕들을 자리에서 물러나게 하고 총독들을 세우라는 군사·행정적 지시로 읽었습니다.
  alternative_readings:
  - 왕들을 완전히 폐위하라는 명령
  - 단순히 직책만 재편하라는 명령
  rationale: 본문은 전면적 왕권 폐지보다 기존 왕들을 교체하고 새 행정관을 설치하는 전쟁 전략을 말하므로, 과도한 신학화 없이 역사적·문맥적 의미를 유지했습니다.
  doctrine_reference: 본문 문맥 해석
