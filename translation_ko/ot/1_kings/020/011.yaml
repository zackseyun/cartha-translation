  text: And the king of Israel answered and said[a], “Tell him, ‘Let not the one who girds on his armor boast like the one who takes it off.’”
  footnotes:
  - marker: a
    text: Hebrew literally, “Let not the one girding boast like the one unfastening.” The proverb contrasts preparing for battle with finishing it victoriously.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 왕이 대답하며 말했습니다. 「그에게 이렇게 말하십시오. ‘갑옷을 입는 자가 갑옷을 벗는 자처럼 자랑해서는 안 됩니다.’」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 “갑옷을 입는 자가 갑옷을 벗는 자처럼”입니다. 전투 준비와 승리 후의 상태를 대조하는 속담입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  english_pob_choice: answered and said
  chosen_korean: 대답하며 말했습니다
  alternatives_korean:
  - 대답하고 말했습니다
  - 응답하며 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 서술 연쇄를 자연스러운 한국어 서술로 살리되, 단순한 ‘말하다’로 평평해지지 않도록 ‘대답하다’를 유지했습니다.
- source_word: דַּבְּרוּ
  english_pob_choice: Tell him
  chosen_korean: 그에게 이렇게 말하십시오
  alternatives_korean:
  - 그에게 말하십시오
  - 그에게 전하십시오
  lexicon: HALOT
  rationale: 복수 명령형이지만 보고된 메시지의 전달 행위이므로 한국어에서는 간명하게 ‘그에게’의 간접목적을 드러내는 표현이 가장 자연스럽습니다.
- source_word: חֹגֵר
  english_pob_choice: the one who straps on his armor
  chosen_korean: 갑옷을 입는 자
  alternatives_korean:
  - 무장을 갖추는 자
  - 갑옷을 차는 자
  lexicon: HALOT
  rationale: 직역형의 ‘girding’보다 전투 준비의 뜻이 드러나는 한국어 관용을 택하되, 군사적 준비라는 소스를 유지하기 위해 ‘갑옷’을 명시했습니다.
- source_word: כִּמְפַתֵּחַ
  english_pob_choice: like the one who takes it off
  chosen_korean: 갑옷을 벗는 자처럼
  alternatives_korean:
  - 무장을 푸는 자처럼
  - 갑옷을 풀어 놓는 자처럼
  lexicon: HALOT
  rationale: 대구를 살리기 위해 ‘벗는’으로 대응시켜, 전투를 마치고 무장을 해제한 상태라는 대비를 분명히 했습니다.
theological_decisions:
- issue: 용사의 자랑을 금하는 속담의 뉘앙스
  chosen_reading: 전투 준비한 자가 승리 후 무장 해제한 자처럼 미리 자랑할 수 없다는 경고로 옮겼습니다.
  alternative_readings:
  - 단순한 겸손 권면
  - 일반적 자만 금지
  rationale: 본문은 일반론이 아니라 전쟁 문맥의 비유적 경고이므로, 승패가 아직 결정되지 않은 상황에서의 성급한 자랑을 드러내는 방향이 원문에 더 가깝습니다.
  doctrine_reference: 문맥 우선 해석; 사무엘상/열왕기 전쟁 서사 속 속담 이해
