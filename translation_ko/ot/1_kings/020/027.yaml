source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל הָתְפָּקְדוּ֙ וְ/כָלְכְּל֔וּ וַ/יֵּלְכ֖וּ לִ/קְרָאתָ֑/ם וַ/יַּחֲנ֨וּ בְנֵֽי יִשְׂרָאֵ֜ל נֶגְדָּ֗/ם כִּ/שְׁנֵי֙ חֲשִׂפֵ֣י עִזִּ֔ים וַ/אֲרָ֖ם מִלְא֥וּ אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/027.yaml
  text: And the sons of Israel were mustered and supplied[a], and they went to meet them. The sons of Israel camped opposite them like two little flocks of goats[c][b], but Aram filled the land.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads 'the sons of Israel,' a traditional covenantal designation for the people.
    reason: lexical_alternative
  - marker: b
    text: Or 'were provisioned' or 'were sustained.' The verb likely refers to being supplied for the campaign.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew simile is literally 'like two חֲשִׂפֵי of goats,' an unusual expression conveying very small groups in contrast to the vast Aramean army.
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘 자손이 소집되어 보급을 받고, 그들이 그들을 맞으러 나갔습니다. 이스라엘 자손은 그들 맞은편에 진을 쳤는데, 염소의 작은 떼 두 무리 같았습니다.[a] 반면 아람 군대는 그 땅을 가득 메웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘염소의 두 하시핌’(חֲשִׂפֵי)입니다. 드문 표현으로, 아람 군대의 압도적인 규모와 대조되는 매우 작은 두 무리를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어 관용구를 비교적 직접적으로 살리되, 한국어 성경 문맥에서 자연스럽고 공동체적 함의를 유지하는 표현으로 옮겼습니다.
- source_word: הָתְפָּקְדוּ
  english_pob_choice: were mustered
  chosen_korean: 동원되고
  alternatives_korean:
  - 소집되고
  - 계수되고
  lexicon: HALOT
  rationale: 전투 준비 문맥에서 단순한 ‘계수’보다 군사적으로 모아 세운다는 뜻을 살리기 위해 ‘동원’으로 옮겼습니다.
- source_word: וְכָלְכְּלוּ
  english_pob_choice: supplied
  chosen_korean: 보급을 받았으며
  alternatives_korean:
  - 공급을 받았으며
  - 양식을 공급받았으며
  lexicon: HALOT
  rationale: 군사 작전의 맥락에서 전투 물자를 제공받는 의미를 분명히 하기 위해 ‘보급’을 사용했습니다.
- source_word: כִּשְׁנֵי חֲשִׂפֵי עִזִּים
  english_pob_choice: like two little flocks of goats
  chosen_korean: 염소의 작은 떼 두 무리 같았으나
  alternatives_korean:
  - 염소의 작은 무리 두 떼 같았으나
  - 염소 새끼의 작은 떼 두 무리 같았으나
  lexicon: HALOT
  rationale: 비유의 핵심은 이스라엘 군대의 극도로 적은 수이므로, ‘작은 떼 두 무리’로 자연스럽게 옮기되 염소 이미지를 유지했습니다.
- source_word: וַאֲרָם מִלְאוּ אֶת הָאָרֶץ
  english_pob_choice: but Aram filled the land
  chosen_korean: 아람은 그 땅에 가득 찼습니다
  alternatives_korean:
  - 아람은 그 땅을 가득 채웠습니다
  - 그러나 아람이 그 땅을 가득 채웠습니다
  lexicon: HALOT
  rationale: ‘땅을 채우다’의 공간적 과잉을 살리면서도 한국어에서 더 자연스러운 결과 상태 표현으로 정리했습니다.
theological_decisions:
- issue: 이스라엘의 열세를 드러내는 비교 구문
  chosen_reading: ‘염소의 작은 떼 두 무리 같았으나’로 옮겨, 숫자의 열세와 비유의 경멸적/압도적 대비를 유지했습니다.
  alternative_readings:
  - 단순히 ‘아주 적었습니다’로 완화
  - ‘두 작은 염소 떼처럼’으로 평탄화
  rationale: 본문은 단순 정보가 아니라 전쟁의 극단적 불균형을 시각적으로 제시하므로, 비유를 약화하지 않고 보존하는 것이 의미 전달에 중요합니다.
  doctrine_reference: 본문 서사와 수사적 대비
- issue: waw 접속사의 대비성
  chosen_reading: 마지막 절은 ‘그러나’로 과도하게 해석하지 않고, 앞뒤 대비가 드러나는 ‘…같았으나, 아람은…’ 구조로 처리했습니다.
  alternative_readings:
  - ‘그리고’로 직역
  - ‘그러나’로 강하게 대조
  rationale: 히브리어 접속사는 단순 연결이지만 문맥상 대조가 분명하므로, 한국어에서는 본문이 주는 대비를 살리되 의미를 과장하지 않는 방식이 적절합니다.
  doctrine_reference: 히브리어 접속사 waw의 담화 기능
