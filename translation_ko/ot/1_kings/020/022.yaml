  rationale: 재귀적 뉘앙스를 살려 단순한 감정 고조가 아니라 대비를 위한 내적 단단함을 드러냈습니다.
- source_word: וְדַע וּרְאֵה
  english_pob_choice: know and see
  chosen_korean: 알고 살피십시오
  alternatives_korean:
