  - 알아차리고 보십시오
  lexicon: HALOT
  rationale: 히브리어의 병렬 명령을 유지하되, 한국어에서는 ‘알고 살피다’가 더 자연스럽게 경계와 분별의 뜻을 전달합니다.
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  english_pob_choice: at the turn of the year
  chosen_korean: 해가 바뀌는 때에
  alternatives_korean:
  - 연말에
  - 연초에
  - 해가 돌아오는 때에
  lexicon: HALOT
  rationale: 연례 군사 원정이 재개되는 관용구를 직역에 가깝게 옮기되, 한국어에서 이해 가능한 시간 표현으로 다듬었습니다.
- source_word: מֶלֶךְ אֲרָם
  english_pob_choice: the king of Aram
  chosen_korean: 아람 왕
  alternatives_korean:
  - 아람의 왕
  - 시리아 왕
  lexicon: HALOT
  rationale: 본문의 히브리어 지시를 따라 ‘아람’을 유지했습니다. 전통적 ‘시리아’는 여기서는 사용하지 않았습니다.
theological_decisions:
- issue: 전쟁 경고의 명령형 뉘앙스
  chosen_reading: 예언자의 세 개 명령은 단순 정보 전달이 아니라 임박한 공격에 대비하라는 실제적 권면으로 옮겼습니다.
  alternative_readings:
  - 중립적 예고문으로만 옮김
  - ‘무슨 일을 해야 할지’의 조언성을 약화시킴
  rationale: 문맥상 왕에게 주어진 준비 명령이므로, 예언적 경고의 촉박함과 행동 촉구를 살렸습니다.
  doctrine_reference: 예언/권면의 기능에 대한 서술적 번역 원칙
