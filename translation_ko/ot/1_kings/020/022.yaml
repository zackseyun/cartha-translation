base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/022.yaml
  text: Then the prophet came near to the king of Israel and said to him[a], “Go, strengthen yourself, and know and see what you should do[c][b], because at the turn of the year the king of Aram will come up against you.”
  footnotes:
  - marker: a
    text: Hebrew 'at the turn/return of the year,' an idiom often referring to the season when military campaigns resumed; some translations render this more interpretively as 'next spring.'
    reason: cultural_note
  - marker: b
    text: Or 'what you will do.' The Hebrew form is literally future, but here likely carries the practical sense of what the king ought to do in preparation.
    reason: lexical_alternative
  - marker: c
    text: Traditionally 'the king of Syria'; Hebrew has 'Aram.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 예언자가 이스라엘 왕에게 가까이 다가가 말했습니다. “가서 스스로를 굳세게 하십시오. 그리고 무엇을 해야 할지 알고 살피십시오. 왜냐하면 해가 바뀌는 때에 아람 왕이 당신을 치러 올라올 것이기 때문입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘해가 돌아오는 때’이며 보통 전쟁이 재개되는 계절을 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로는 ‘네가 할 것’을 뜻하지만, 여기서는 실제로는 ‘무엇을 해야 하는지’의 뜻으로 읽힙니다.
    reason: lexical_alternative
  - marker: c
    text: 전통적으로는 ‘시리아’라고 옮기기도 하나, 히브리어 본문은 ‘아람’이라고 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּגַּשׁ
  english_pob_choice: came near
  chosen_korean: 가까이 다가가
  alternatives_korean:
  - 다가가
  - 나아가
  lexicon: HALOT
  rationale: 접근 동작을 구체적으로 살리면서도 현대 한국어 서술에 자연스럽게 맞췄습니다.
- source_word: הִתְחַזַּק
  english_pob_choice: strengthen yourself
  chosen_korean: 스스로를 굳세게 하십시오
  alternatives_korean:
  - 스스로를 강하게 하십시오
  - 힘을 내십시오
  lexicon: HALOT
  rationale: 재귀적 뉘앙스를 살려 단순한 감정 고조가 아니라 대비를 위한 내적 단단함을 드러냈습니다.
- source_word: וְדַע וּרְאֵה
  english_pob_choice: know and see
  chosen_korean: 알고 살피십시오
  alternatives_korean:
  - 알고 보십시오
  - 알아차리고 보십시오
  lexicon: HALOT
  rationale: 히브리어의 병렬 명령을 유지하되, 한국어에서는 ‘알고 살피다’가 더 자연스럽게 경계와 분별의 뜻을 전달합니다.
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  english_pob_choice: at the turn of the year
  chosen_korean: 해가 바뀌는 때에
  alternatives_korean:
  - 연말에
  - 연초에
  - 해가 돌아오는 때에
  lexicon: HALOT
  rationale: 연례 군사 원정이 재개되는 관용구를 직역에 가깝게 옮기되, 한국어에서 이해 가능한 시간 표현으로 다듬었습니다.
- source_word: מֶלֶךְ אֲרָם
  english_pob_choice: the king of Aram
  chosen_korean: 아람 왕
  alternatives_korean:
  - 아람의 왕
  - 시리아 왕
  lexicon: HALOT
  rationale: 본문의 히브리어 지시를 따라 ‘아람’을 유지했습니다. 전통적 ‘시리아’는 여기서는 사용하지 않았습니다.
theological_decisions:
- issue: 전쟁 경고의 명령형 뉘앙스
  chosen_reading: 예언자의 세 개 명령은 단순 정보 전달이 아니라 임박한 공격에 대비하라는 실제적 권면으로 옮겼습니다.
  alternative_readings:
  - 중립적 예고문으로만 옮김
  - ‘무슨 일을 해야 할지’의 조언성을 약화시킴
  rationale: 문맥상 왕에게 주어진 준비 명령이므로, 예언적 경고의 촉박함과 행동 촉구를 살렸습니다.
  doctrine_reference: 예언/권면의 기능에 대한 서술적 번역 원칙
