revisions:
- from: 아니요, 내일 이맘때쯤이면 내가 내 종들을 당신에게 보내겠습니다. 그들이 당신의 집과 당신의 종들의 집을 수색하고, 당신의 눈에 좋은 것이라면 무엇이든 그들의 손에 넣어 가져갈 것입니다.[a][b]
  to: 아닙니다. 내일 이맘때쯤 내가 내 신하들을 당신에게 보내겠습니다. 그들이 당신의 집과 당신의 신하들의 집을 수색하고, 당신이 귀히 여기는 모든 것[a]을 그들의 손에 넣어 가져갈 것입니다.[b]
  rationale: 의미가 모호한 ‘눈에 좋은 것’을 원문의 관용적 의미가 드러나는 ‘당신이 귀히 여기는 모든 것’으로 수정했습니다. 왕실·외교 문맥의 עֲבָדִים은 ‘신하들’로 일관되게 옮겼으며, 각주 표지를 해당 표현 바로 뒤에 배치했습니다. 시간, 수색, 압류와 반출이라는 위협의 범위와 강도는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:51:01Z'
