  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י אִם כָּ/עֵ֣ת מָחָ֗ר אֶשְׁלַ֤ח אֶת עֲבָדַ/י֙ אֵלֶ֔י/ךָ וְ/חִפְּשׂוּ֙ אֶת בֵּ֣יתְ/ךָ֔ וְ/אֵ֖ת בָּתֵּ֣י עֲבָדֶ֑י/ךָ וְ/הָיָה֙ כָּל מַחְמַ֣ד עֵינֶ֔י/ךָ יָשִׂ֥ימוּ בְ/יָדָ֖/ם וְ/לָקָֽחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/006.yaml
  text: No[a], but about this time tomorrow I will send my servants to you, and they will search your house and the houses of your servants; and whatever is desirable in your eyes[b], they will put into their hands and take away.
  footnotes:
  - marker: a
    text: Or 'everything precious to your eyes,' that is, everything you value highly.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'put into their hands and take'; the expression means to seize and carry off.
    reason: lexical_alternative
translation:
  language: ko
  text: 아니요, 내일 이맘때쯤이면 내가 내 종들을 당신에게 보내겠습니다. 그들이 당신의 집과 당신의 종들의 집을 수색하고, 당신의 눈에 좋은 것이라면 무엇이든 그들의 손에 넣어 가져갈 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, ‘눈에 좋은 것’은 곧 그가 크게 귀히 여기고 바라는 모든 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그들의 손에 넣고 가져가다’입니다. 곧 강제로 빼앗아 가는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: No, but
  chosen_korean: 아니요,
  alternatives_korean:
  - 아니라
  - 그렇지 않고
  lexicon: HALOT
  rationale: 앞선 제한을 거절하고 곧바로 위협을 강화하는 반전 표현이므로, 한국어에서는 간결한 부정 응답으로 그 반전성을 살렸습니다.
- source_word: כָּעֵת מָחָר
  english_pob_choice: about this time tomorrow
  chosen_korean: 내일 이맘때쯤
  alternatives_korean:
  - 내일 이 시간쯤
  - 내일 같은 시각에
  lexicon: HALOT
  rationale: ‘이맘때쯤’이 다음 날의 대략 같은 시각을 자연스럽게 전하며, 예언적 경고의 구어적 긴박감도 유지합니다.
- source_word: עֲבָדַי
  english_pob_choice: my servants
  chosen_korean: 내 종들
  alternatives_korean:
  - 내 신하들
  - 내 노예들
  lexicon: HALOT
  rationale: 여기서는 왕의 심부름꾼이 아니라 공식 수행자이므로 ‘종들’이 적절하며, 본문의 굴욕적 위협을 살리기 위해 ‘신하들’보다 직역성이 높습니다.
- source_word: יָשִׂימוּ בְיָדָם וְלָקָחוּ
  english_pob_choice: they will put into their hands and take away
  chosen_korean: 그들의 손에 넣어 가져갈 것입니다
  alternatives_korean:
  - 그들의 손에 얹고 빼앗을 것입니다
  - 손에 쥐게 한 뒤 가져갈 것입니다
  lexicon: HALOT
  rationale: 히브리어의 관용구가 ‘붙잡아 몰수하다’는 뜻이므로, ‘손에 넣어 가져가다’로 한국어에서 자연스럽게 압축하되 강제적 수탈의 의미를 유지했습니다.
theological_decisions:
- issue: ‘집’(בַּיִת)의 번역과 위협의 범위
  chosen_reading: ‘당신의 집과 당신의 종들의 집’으로 옮겨, 본문의 사적 공간과 종들의 거처를 모두 포함하는 침탈 위협을 드러냈습니다.
  alternative_readings:
  - ‘궁전과 당신의 종들의 집’
  - ‘당신의 저택과 종들의 집’
  rationale: בַּיִת는 문맥에 따라 궁전일 수도 있으나, 여기서는 원문 이미지인 ‘집’을 유지하는 편이 대칭 구조와 수색의 범위를 더 분명하게 보여 줍니다.
  doctrine_reference: 본문 문맥 이해 / 서사적 의미 유지
