  source_fidelity: 히브리어의 대조·강화 표현(כִּי אִם), 시간 표현, 수색의 대상, 그리고 귀중품을 취해 가겠다는 위협은 대체로 충실히 옮겼습니다. 다만 ‘눈에 좋은 것’은 현대 한국어에서 윤리적 ‘좋음’으로도 들릴 수 있어 מַחְמַד עֵינֶיךָ의 ‘귀히 여기고 탐내는 것’이라는 의미를 더 분명히 하는 것이 좋습니다.
  naturalness: 합쇼체는 일관되지만, ‘아니요’는 앞 절을 직접 부정하는 답변처럼 다소 독립적으로 들립니다. ‘아닙니다. …하겠습니다’가 서신의 위협을 전달하는 문맥에서 더 자연스럽습니다. 또한 왕의 공식 파견 인력과 그에 상응하는 상대 왕의 인력을 ‘신하들’로 옮기면 현대 독자가 ‘종’을 가사 노동자나 노예로 한정해 이해할 가능성을 줄일 수 있습니다.
  terminology: עֲבָדִים은 이 왕실·외교 문맥에서 공식 수행원 또는 신하를 가리킬 수 있으므로 ‘신하들’이 적절합니다. מַחְמַד עֵינֶיךָ는 ‘당신이 귀히 여기는 모든 것’으로 번역하고, 문자적 관용구는 각주로 보존합니다. ‘그들의 손에 넣어 가져가다’는 히브리어 표현의 순서와 압류·반출의 의미를 무리 없이 전달합니다.
