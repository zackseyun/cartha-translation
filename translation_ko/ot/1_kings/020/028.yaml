source:
  edition: WLC
  text: וַ/יִּגַּ֞שׁ אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּאמֶר֮ אֶל מֶ֣לֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֠עַן אֲשֶׁ֨ר אָמְר֤וּ אֲרָם֙ אֱלֹהֵ֤י הָרִים֙ יְהוָ֔ה וְ/לֹֽא אֱלֹהֵ֥י עֲמָקִ֖ים ה֑וּא וְ֠/נָתַתִּי אֶת כָּל הֶ/הָמ֨וֹן הַ/גָּ֤דוֹל הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/028.yaml
  text: 'Then the man of God came near and said to the king of Israel[a], “Thus says Yahweh: Because Aram has said, ‘Yahweh is a god of the mountains, but he is not a god of the valleys,’ I will give all this great multitude into your hand[c][b], and you shall know that I am Yahweh.”'
  footnotes:
  - marker: a
    text: Hebrew 'Aram'; traditionally 'Syria' in some English versions.
    reason: alternative_reading
  - marker: b
    text: Or 'God of the hills ... God of the plains.' The Hebrew contrasts elevated terrain with lowlands/valleys.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew verb 'you shall know' is plural, extending the statement beyond the king to Israel collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 하나님의 사람이 이스라엘 왕에게 가까이 가서 말했습니다. “야훼께서 이렇게 말씀하십니다. 아람이 ‘야훼는 산의 하나님이지, 골짜기의 하나님은 아니다’라고 말하였으므로, 내가 이 큰 무리를 모두 당신의 손에 넘겨주겠습니다. 그러면 너희는 내가 야훼임을 알게 될 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희는’은 히브리어 복수형을 반영합니다. 왕 한 사람뿐 아니라 이스라엘 공동체 전체를 향한 말입니다.
    reason: source_note
  - marker: b
    text: ‘산의 하나님 / 골짜기의 하나님’은 아람 사람들의 잘못된 지역신 이해를 그대로 옮긴 표현입니다.
    reason: theological_note
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님 사람
  - 신인
  lexicon: HALOT
  rationale: 예언자적 호칭으로 굳어진 표현이므로 ‘하나님의 사람’이 가장 자연스럽고, 문맥의 특정 인물을 가리키는 정관적 뉘앙스를 살립니다.
- source_word: וַיִּגַּשׁ
  english_pob_choice: came near
  chosen_korean: 가까이 가서
  alternatives_korean:
  - 다가가서
  - 나아가서
  lexicon: HALOT
  rationale: 단순한 이동 동사를 살려 물리적으로 접근하는 장면을 드러내되, 한국어에서 과도하게 문어적인 ‘다가서서’보다 자연스럽게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문서의 표준 용례에 따라 신명은 ‘야훼’로 옮겨, 언약적 고유명을 직역어가 아닌 음역으로 보존했습니다.
- source_word: אֱלֹהֵי הָרִים ... וְלֹא אֱלֹהֵי עֲמָקִים
  english_pob_choice: a god of the mountains, but he is not a god of the valleys
  chosen_korean: 산의 하나님이지, 골짜기의 하나님은 아니다
  alternatives_korean:
  - 산의 신이지, 골짜기의 신은 아니다
  - 산지의 하나님이지, 평지의 하나님은 아니다
  lexicon: HALOT
  rationale: 아람 사람들의 잘못된 지역신 개념을 살리기 위해 ‘하나님’과 ‘신’ 중에서도 본문에 나온 야훼를 지칭하는 빈칸을 ‘하나님’으로 두되, 상대의 주장 내용은 그대로 재현했습니다.
- source_word: וִידַעְתֶּם
  english_pob_choice: you shall know
  chosen_korean: 너희는 ... 알게 될 것입니다
  alternatives_korean:
  - 당신은 ... 알게 될 것입니다
  - 너희가 ... 알 것입니다
  lexicon: HALOT
  rationale: 동사가 복수형이므로 왕 개인만이 아니라 이스라엘 전체를 향한 결과를 살려 ‘너희는’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 이름과 왕에게 직접 하는 말의 호칭을 어떻게 처리할지
  chosen_reading: 본문 인용은 ‘야훼’로 유지하고, 수신자는 왕에게는 ‘당신’, 공동체에게는 ‘너희’로 구분했습니다.
  alternative_readings:
  - 전체를 ‘주님’으로 완화
  - 왕과 백성을 모두 ‘당신들’로 통일
  rationale: 신적 고유명과 청자 범위를 구분해야 본문의 신학적 강조(야훼의 자기 계시와 공동체적 인식)가 흐려지지 않습니다.
  doctrine_reference: 'Translation philosophy §5: consistency/documented exception'
