  source_fidelity: 히브리어의 핵심 구조와 의미는 대체로 충실합니다. 다만 בְּיָדֶךָ는 왕을 향한 단수 ‘네 손에’이므로, 현대 한국어의 자연스러운 존대 표현에서는 ‘왕의 손에’로 명시하는 것이 ‘당신의 손에’보다 정확하고 자연스럽습니다. וִידַעְתֶּם의 복수는 본문과 각주에서 유지되어야 합니다.
  naturalness: ‘당신의 손에’는 현대 표준 한국어에서 신적 발화의 왕에 대한 호칭으로 다소 어색하거나 대립적인 뉘앙스를 낼 수 있습니다. ‘왕의 손에’로 바꾸면 합쇼체 문맥을 유지하면서도 단수 수신자를 분명히 할 수 있습니다. 나머지 문장은 현대적이고 자연스럽습니다.
  terminology: ‘하나님의 사람’, ‘야훼’, ‘아람’, ‘골짜기’, ‘큰 무리’는 적절합니다. 아람의 발언에서 ‘하나님’은 야훼를 가리키는 그들의 잘못된 주장으로서 문맥상 가능하며, 별도의 교리적 해석을 본문에 덧붙이지 않았습니다.
