base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/039.yaml
  text: As the king was passing by[a], he cried out to the king and said, “Your servant went out into the midst of the battle, and behold, a man turned aside and brought a man to me and said, ‘Guard this man. If he is ever missing, then your life shall be for his life[b], or you shall weigh out a talent of silver.’”
  footnotes:
  - marker: a
    text: Or, 'If he should be missing' / 'If he is in any way unaccounted for.' The Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'your life under/in place of his life,' a legal formula of substitution.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 지나가고 있을 때, 그가 왕에게 외쳐 말했습니다. “왕의 종인 제가 전투 한가운데로 나갔는데, 그런데 한 사람이 곁으로 비켜 나와 한 사람을 제게 데려오고는 말했습니다. ‘이 사람을 지켜라. 만일 그가 없어지기라도 하면[a], 네 목숨이 그의 목숨을 대신하게 될 것이며[b], 그렇지 않으면 너는 은 한 달란트를 달아 내야 한다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 없어졌다면’ / ‘그가 어떤 식으로든 행방불명이거나 확인되지 않는다면’. 히브리어는 강조를 위해 니팔 부정사절대와 미완료형을 함께 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 목숨 아래/대신 네 목숨’이며, 법적 대체를 나타내는 공식입니다.
    reason: lexical_alternative
