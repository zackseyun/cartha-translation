- from: 그 왕이 지나가고 있을 때, 그가 왕에게 외쳐 말했습니다. “당신의 종이 전투 한가운데로 나갔는데, 보십시오, 한 사람이 비켜서서 또 한 사람을 내게 데려오며 말하기를 ‘이 사람을 지키라. 만일 그가 반드시 없어지게 되면, 당신의 생명은 그의 생명 대신이 되거나, 아니면 당신은 은 한 달란트를 달아 내야 한다’고 했습니다.”[a][b]
  to: 왕이 지나가고 있을 때, 그가 왕에게 외쳐 말했습니다. “왕의 종인 제가 전투 한가운데로 나갔는데, 그런데 한 사람이 곁으로 비켜 나와 한 사람을 제게 데려오고는 말했습니다. ‘이 사람을 지켜라. 만일 그가 없어지기라도 하면[a], 네 목숨이 그의 목숨을 대신하게 될 것이며[b], 그렇지 않으면 너는 은 한 달란트를 달아 내야 한다.’”
  rationale: 수정문은 히브리어의 진행 중인 배경 상황, 긴급한 호소, 전투 중 맡겨진 사람, 그리고 두 가지 법적 결과를 보존합니다. 실종·행방불명이라는 조건을 죽음과 혼동하지 않도록 다듬고, 중첩된 발화를 명료하게 표시했으며, 각 주석을 설명 대상 바로 뒤에 배치했습니다.
