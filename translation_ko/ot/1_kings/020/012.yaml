  source_fidelity: 히브리어의 시간 배경, 벤하닷과 왕들이 술을 마시는 상황, 짧은 군사 명령, 그리고 성을 향한 적대적 배치를 대체로 충실히 반영합니다. 다만 ‘부스들’은 한국어에서 부자연스럽고, 명령 및 후속 행동은 군사적 배치라는 함의를 더 명확하고 자연스럽게 드러낼 필요가 있습니다.
  naturalness: ‘부스들 안에서’는 현대 표준 한국어 성경 문체로 자연스럽지 않습니다. 또한 ‘그가 그의 종들에게 말했습니다’와 ‘성을 향해 자리를 잡았습니다’는 각각 대명사 반복과 결합 관계 때문에 다소 번역투입니다. ‘초막들’, ‘자기 신하들에게 … 하고 말했습니다’, ‘성을 향해 전열을 갖추었습니다’가 더 자연스럽습니다.
  terminology: סֻכּוֹת는 여기서 임시 쉼터·초막을 가리키므로 외래어 ‘부스’보다 ‘초막’이 적절합니다. ‘신하들’은 왕의 עֲבָדִים를 한국어 왕정 서사에서 자연스럽게 옮깁니다. שִׂימוּ의 타원적인 군사 명령은 구체적 무기나 공성 행위를 덧붙이지 않는 ‘전열을 갖추십시오’로 처리했습니다.
