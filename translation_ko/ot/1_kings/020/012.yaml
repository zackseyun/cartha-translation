revisions:
- from: 그가 이 말을 들었을 때, 그와 왕들은 부스들 안에서 술을 마시고 있었습니다. 그가 그의 종들에게 말했습니다. “자리를 잡으십시오.” 그러자 그들이 성을 향해 자리를 잡았습니다.[a][b][c]
  to: 그가 이 말[a]을 들었을 때, 그는 왕들과 함께 초막들[b] 안에서 술을 마시고 있었습니다. 그는 자기 신하들에게 “전열을 갖추십시오.”[c] 하고 말했습니다. 그러자 그들은 그 성을 향해 전열을 갖추었습니다.
