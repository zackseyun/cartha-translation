source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/ה֥וּא שֹׁתֶ֛ה ה֥וּא וְ/הַ/מְּלָכִ֖ים בַּ/סֻּכּ֑וֹת וַ/יֹּ֤אמֶר אֶל עֲבָדָי/ו֙ שִׂ֔ימוּ וַ/יָּשִׂ֖ימוּ עַל הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/012.yaml
  text: And when he heard this word[a], while he and the kings were drinking in the booths, he said to his servants[c][b], “Take your positions.” So they took their positions against the city.
  footnotes:
  - marker: a
    text: Or “this word” or “this matter.”
    reason: lexical_alternative
  - marker: b
    text: Or “in the shelters” or, traditionally, “in the pavilions.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew command is literally “Set!”—a brief military order, likely meaning to take up positions against the city.
    reason: cultural_note
translation:
  language: ko
  text: 그가 이 말을 들었을 때, 그와 왕들은 부스들 안에서 술을 마시고 있었습니다. 그가 그의 종들에게 말했습니다. “자리를 잡으십시오.” 그러자 그들이 성을 향해 자리를 잡았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 말”을 “이 일”, “이 사건”으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘부스들’에 해당하는 임시 거처를 가리키며, 전통적으로는 ‘초막들’로도 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 짧은 명령은 문자적으로는 “두라/놓아라”에 가깝지만, 문맥상 성을 향해 전열을 갖추라는 군사 명령입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר הַזֶּה
  english_pob_choice: this word
  chosen_korean: 이 말
  alternatives_korean:
  - 이 말씀
  - 이 일
  - 이 사연
  lexicon: HALOT
  rationale: דָּבָר는 문맥에 따라 ‘말, 일, 사건’까지 아우르지만, 여기서는 아합의 응답을 들은 뒤 바로 반응하는 장면이므로 ‘이 말’이 가장 직접적이고 자연스럽습니다.
- source_word: שֹׁתֶה
  english_pob_choice: were drinking
  chosen_korean: 술을 마시고 있었습니다
  alternatives_korean:
  - 마시고 있었습니다
  - 술을 마셨습니다
  - 마시던 중이었습니다
  lexicon: HALOT
  rationale: 분사형의 지속 상태를 살려 ‘...하고 있었습니다’로 옮겼고, 문맥상 잔치를 드러내기 위해 ‘술을’을 보탰습니다.
- source_word: בַּסֻּכּוֹת
  english_pob_choice: in the booths
  chosen_korean: 부스들 안에서
  alternatives_korean:
  - 초막들 안에서
  - 쉼터들 안에서
  - 파빌리온들 안에서
  lexicon: HALOT
  rationale: סֻכּוֹת의 기본 뜻을 살려 직역에 가까운 ‘부스들’로 두었고, 현대 독자가 이해할 수 있도록 공간 의미를 유지했습니다.
- source_word: שִׂימוּ / וַיָּשִׂימוּ עַל הָעִיר
  english_pob_choice: Take your positions / they took their positions against the city
  chosen_korean: 자리를 잡으십시오 / 성을 향해 자리를 잡았습니다
  alternatives_korean:
  - 배치하십시오 / 성에 대항해 배치되었습니다
  - 진을 치십시오 / 성을 향해 진을 쳤습니다
  - 대기하십시오 / 성을 향해 대기했습니다
  lexicon: HALOT
  rationale: שׂים의 짧은 군사 명령을 한국어의 간결한 군사적 표현으로 살리되, 본문이 구체적 전술을 설명하지 않으므로 ‘자리를 잡다’로 절제해 옮겼습니다.
theological_decisions:
- issue: 왕과 군사 집결 장면의 서술 어조
  chosen_reading: 직접 인용문 안의 명령은 상급자에게 하는 군사적 지시로 보아, 한국어에서는 존대 명령형 ‘자리를 잡으십시오’로 옮겼습니다.
  alternative_readings:
  - ‘자리를 잡아라’처럼 하대형으로 옮기는 방식
  - ‘진을 치십시오’처럼 더 구체적인 군사 용어를 쓰는 방식
  rationale: 히브리어는 매우 짧은 명령이지만, 한국어 서술에서 누가 누구에게 말하는지와 공적 상황의 위계를 분명히 드러내는 편이 자연스럽습니다.
  doctrine_reference: 서사체의 담화 화용과 화자-청자 관계
