base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/041.yaml
  text: Then he quickly removed the bandage from over his eyes[a], and the king of Israel recognized him, that he was one of the prophets.
  footnotes:
  - marker: a
    text: Hebrew הָאֲפֵר is traditionally understood by some as 'the ashes,' but in this context it likely refers to a covering or bandage used as a disguise over the eyes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 서둘러 눈 위를 덮고 있던 천을 벗겼습니다[a]. 그러자 이스라엘 왕이 그를 알아보고, 그가 예언자들 가운데 한 사람인 줄 알았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הָאֲפֵר는 전통적으로 ‘재들’로 이해되기도 하지만, 이 문맥에서는 눈을 가리는 위장용 덮개나 천을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  english_pob_choice: Then he quickly
  chosen_korean: 서둘러
  alternatives_korean:
  - 그리고 그는 빨리
  - 그는 급히
  lexicon: HALOT
  rationale: מיהר의 속도감과 이어지는 행동의 즉시성을 한국어 부사 하나로 자연스럽게 살렸습니다.
- source_word: הָאֲפֵר
  english_pob_choice: the bandage
  chosen_korean: 눈 위를 덮고 있던 천
  alternatives_korean:
  - 붕대
  - 가린 천
  - 덮개
  lexicon: HALOT
  rationale: 본문의 물건은 실제로 ‘눈 위에 씌운 위장용 덮개’로 기능하므로, 문자적 ‘재’보다 용도를 드러내는 표현이 본문 문맥에 더 충실합니다.
- source_word: מֵעַל עֵינָיו
  english_pob_choice: from over his eyes
  chosen_korean: 눈 위를 덮고 있던
  alternatives_korean:
  - 눈에서
  - 눈 위에서
  lexicon: HALOT
  rationale: מן + על의 공간적 관계를 살려 ‘위에 덮여 있던’ 상태가 드러나도록 옮겼습니다.
- source_word: מֵהַנְּבִאִים הוּא
  english_pob_choice: one of the prophets
  chosen_korean: 예언자들 가운데 한 사람인 줄
  alternatives_korean:
  - 예언자들 중 한 사람인 줄
  - 예언자들 가운데 속한 사람인 줄
  lexicon: HALOT
  rationale: מן의 부분적 의미를 한국어 관용에 맞게 ‘가운데 한 사람’으로 풀어, 단순한 출신 표시가 아니라 집단 소속을 드러냈습니다.
