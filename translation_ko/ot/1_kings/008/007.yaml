source:
  edition: WLC
  text: כִּ֤י הַ/כְּרוּבִים֙ פֹּרְשִׂ֣ים כְּנָפַ֔יִם אֶל מְק֖וֹם הָֽ/אָר֑וֹן וַ/יָּסֹ֧כּוּ הַ/כְּרֻבִ֛ים עַל הָ/אָר֥וֹן וְ/עַל בַּדָּ֖י/ו מִ/לְ/מָֽעְלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/007.yaml
  text: For the cherubim spread out their wings over the place of the ark[a], and the cherubim overshadowed the ark and its poles from above.
  footnotes:
  - marker: a
    text: Or 'toward the place of the ark.' The Hebrew preposition can be read more literally as directional, though the context favors the sense that the wings extended over the ark's location.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그룹들이 날개를 언약궤의 자리 위로 펼치고 있었으며,[a] 그룹들이 위에서 언약궤와 그 채를 덮었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘언약궤의 자리를 향해’. 히브리어 전치사는 방향을 더 직접적으로 나타낼 수도 있지만, 문맥상 날개가 언약궤가 놓인 위치 위로 펼쳐졌다는 뜻이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּרוּבִים
  english_pob_choice: the cherubim
  chosen_korean: 그룹들
  alternatives_korean:
  - 케루빔
  - 천사들
  lexicon: HALOT
  rationale: 성소 맥락의 כְּרוּבִים을 한국어 성경에서 널리 쓰이는 ‘그룹들’로 옮겨, 전통적 표현과 본문 맥락을 함께 살렸습니다.
- source_word: פֹּרְשִׂים כְּנָפַיִם
  english_pob_choice: were spreading out their wings
  chosen_korean: 날개를 펼쳐
  alternatives_korean:
  - 날개를 펴고
  - 날개를 펴면서
  lexicon: HALOT
  rationale: 분사형의 지속적 자세를 한국어에서는 자연스럽게 ‘날개를 펼쳐’로 풀어, 동작의 상태를 살렸습니다.
- source_word: מְקוֹם הָאָרוֹן
  english_pob_choice: the place of the ark
  chosen_korean: 언약궤의 자리
  alternatives_korean:
  - 언약궤가 있는 곳
  - 궤의 자리
  lexicon: HALOT
  rationale: אֶל과 결합한 공간 표현을 직역하기보다, 여기서는 덮고 있는 위치를 드러내는 ‘언약궤의 자리’가 가장 자연스럽습니다.
- source_word: וַיָּסֹכּוּ
  english_pob_choice: overshadowed
  chosen_korean: 덮고 있었고
  alternatives_korean:
  - 그늘지게 했고
  - 가리었고
  lexicon: HALOT
  rationale: סכך의 기본적 의미는 ‘덮다/가리다’이므로, 본문 이미지에 충실하면서도 현대 한국어에서 자연스러운 ‘덮고 있었고’로 옮겼습니다.
- source_word: בַּדָּיו
  english_pob_choice: its poles
  chosen_korean: 그 채
  alternatives_korean:
  - 그 막대기
  - 그 운반채
  lexicon: HALOT
  rationale: 언약궤를 운반하는 막대기를 가리키는 표준 성경어를 살려 ‘그 채’로 옮겼습니다.
