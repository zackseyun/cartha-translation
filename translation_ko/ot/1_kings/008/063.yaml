base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/063.yaml
  text: 'And Solomon sacrificed the sacrifice of peace offerings that he sacrificed to Yahweh: twenty-two thousand cattle and one hundred twenty thousand sheep[b][a]. So the king and all the sons of Israel dedicated the house of Yahweh.'
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Israel'; that is, the Israelites.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 야훼께 화목제물[a]을 바쳤습니다. 곧 소 2만 2천 마리와 양 12만 마리였습니다. 그래서 왕과 이스라엘의 모든 자손[b]이 야훼의 집을 봉헌했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화목제’는 ‘교제제’ 또는 ‘평안제’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘의 모든 자손’은 히브리어 직역으로, 관용적으로는 ‘이스라엘 사람들’로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח הַשְּׁלָמִים
  english_pob_choice: the sacrifice of peace offerings
  chosen_korean: 화목제의 제물
  alternatives_korean:
  - 평안제의 제물
  - 교제제의 제물
  - 화해제의 제물
  lexicon: HALOT
  rationale: שְׁלָמִים은 제의적 관용구로서 한국어 성경에서 가장 자연스럽고 의미를 잘 드러내는 표현은 화목제입니다. ‘제물’은 זֶבַח의 희생 제사성을 살립니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주께
  lexicon: HALOT
  rationale: 이 본문은 Tetragrammaton יְהוָה를 직접 가리키므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. 이는 본문의 고유한 언약 নাম을 유지합니다.
- source_word: בָּקָר
  english_pob_choice: cattle
  chosen_korean: 소
  alternatives_korean:
  - 가축
  - 황소
  - 외양
  lexicon: HALOT
  rationale: בָּקָר은 집합적 큰가축을 가리키지만, 대량의 제사 맥락에서 한국어로는 ‘소’가 가장 자연스럽고 명확합니다.
- source_word: וְצֹאן
  english_pob_choice: sheep
  chosen_korean: 양
  alternatives_korean:
  - 양떼
  - 작은 가축
  - 양과 염소
  lexicon: HALOT
  rationale: צֹאן은 넓게는 양과 염소를 포함할 수 있으나, 이 병렬구에서는 전통적이며 간결한 ‘양’이 제사 규모를 가장 분명하게 전달합니다.
- source_word: וַיַּחְנְכוּ
  english_pob_choice: dedicated
  chosen_korean: 봉헌했습니다
  alternatives_korean:
  - 헌당했습니다
  - 헌정했습니다
  - 전용했습니다
  lexicon: HALOT
  rationale: חנך은 성소를 거룩한 용도로 바치는 뜻이므로, 한국어에서는 ‘봉헌하다’가 가장 적절합니다. ‘헌당하다’보다 제의적·성경적 뉘앙스를 더 잘 살립니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 전
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현인 ‘야훼의 집’을 유지해 מקור의 형식을 보존했습니다. ‘성전’은 의미는 맞지만 해석이 더 들어갑니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 모든 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 자손들
  lexicon: HALOT
  rationale: ‘sons of Israel’의 직설적 구조를 살리되 한국어에서는 관용적으로 이해되도록 ‘모든 자손’으로 옮겼습니다. 이는 POB의 형태 보존과 자연스러움 사이의 균형입니다.
theological_decisions:
- issue: 제사 용어의 한국어 선택
  chosen_reading: ‘화목제’와 ‘봉헌하다’를 사용해 제의적 의미를 분명히 했습니다.
  alternative_readings:
  - ‘평안제’로 옮길 수 있음
  - ‘헌당했다’로 옮길 수 있음
  rationale: 본문은 솔로몬의 성전 봉헌을 위한 대규모 제사와 그 결과의 봉헌을 함께 말하므로, 제의적·성별(聖別) 의미를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 성전 봉헌과 제사 어휘의 본문 충실성
