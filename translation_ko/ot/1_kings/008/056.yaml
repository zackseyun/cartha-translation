  text: בָּר֣וּךְ יְהוָ֗ה אֲשֶׁ֨ר נָתַ֤ן מְנוּחָה֙ לְ/עַמּ֣/וֹ יִשְׂרָאֵ֔ל כְּ/כֹ֖ל אֲשֶׁ֣ר דִּבֵּ֑ר לֹֽא נָפַ֞ל דָּבָ֣ר אֶחָ֗ד מִ/כֹּל֙ דְּבָר֣/וֹ הַ/טּ֔וֹב אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/056.yaml
  text: Blessed be Yahweh[a], who has given rest to his people Israel, according to all that he spoke. Not one word has failed of all his good words that he spoke by the hand of Moses his servant.
  footnotes:
  - marker: a
    text: Or 'Not one promise has failed of all his good promise,' since 'word' here carries the sense of a spoken promise.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 자기 백성 이스라엘에게 안식을 주신 분이시니, 그분께서는 말씀하신 모든 것대로 하셨습니다. 그분의 좋은 말씀들 가운데 하나도 — 야훼께서 모세의 손을 통해 말씀하신 것들 가운데 — 하나도 어그러지지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 좋은 약속들 가운데 하나도 실패하지 않았다’로도 옮길 수 있습니다. 여기서 ‘말씀’은 말해진 약속의 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  english_pob_choice: Blessed be Yahweh
  chosen_korean: 야훼는 자기 백성 이스라엘에게 안식을 주신 분이시니
  alternatives_korean:
  - 야훼를 찬양합니다
  - 복되신 야훼
  lexicon: WLC; POB audit trail
  rationale: 히브리어의 축복 선언을 한국어에서는 단순 서술보다 경배적 선언으로 살리되, 성경 본문 흐름에 맞게 문장 첫머리를 자연스럽게 열었습니다.
- source_word: נָתַן מְנוּחָה
  english_pob_choice: has given rest
  chosen_korean: 안식을 주신 분이시니
  alternatives_korean:
  - 평안을 주신 분이시니
  - 쉼을 주신 분이시니
  lexicon: HALOT
  rationale: 이 어구는 내적 평안보다 적대와 불안정에서의 정착된 안식을 뜻하므로, ‘안식’을 써서 의미를 직접 반영했습니다.
- source_word: דָּבָר / דְּבָרוֹ
  english_pob_choice: word / his good words
  chosen_korean: 말씀하신 모든 것대로
  alternatives_korean:
  - 말씀하신 모든 말씀대로
  - 약속하신 모든 것대로
  lexicon: HALOT
  rationale: 히브리어가 반복해서 ‘말씀/말들’을 사용하므로, 한국어도 ‘말씀하신’으로 반복 구조를 유지하되 자연스러운 결과 절로 정리했습니다.
- source_word: הַטּוֹב
  english_pob_choice: good
  chosen_korean: 좋은 말씀들
  alternatives_korean:
  - 선한 말씀들
  - 좋으신 약속들
  lexicon: HALOT
  rationale: ‘좋은’은 본문이 말하는 야훼의 말씀의 신실하고 선한 성격을 담되, ‘약속’으로 바꿔 해석을 앞당기지 않도록 했습니다.
- source_word: בְּיַד מֹשֶׁה עַבְדּוֹ
  english_pob_choice: by the hand of Moses his servant
  chosen_korean: 야훼께서 모세의 손을 통해 말씀하신 것들 가운데
  alternatives_korean:
  - 야훼께서 그의 종 모세를 통해
  - 모세의 손으로
  lexicon: HALOT
  rationale: ‘손을 통해’는 히브리어의 매개 수단 관용구를 살린 표현이며, ‘모세의 종’보다 ‘모세의 손’이 원문의 형식을 더 잘 보존합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 야훼의 고유명을 직접 사용하므로, 한국어 본문도 대체 칭호 대신 ‘야훼’를 유지해 언약 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: דָּבָר의 ‘말씀/약속’ 긴장
  chosen_reading: 말씀
  alternative_readings:
  - 약속
  rationale: 문맥상 성취된 약속을 가리키지만, 히브리어는 끝까지 ‘말씀’ 어휘를 쓰므로 본문에는 ‘말씀’을 두고, 약속 뉘앙스는 영어 POB의 주석 취지에 따라 암시적으로 유지했습니다.
  doctrine_reference: POB translation philosophy; source wording preservation
