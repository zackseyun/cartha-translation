base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/054.yaml
  text: And when Solomon had finished praying to Yahweh with all this prayer and plea for favor[a], he rose from before the altar of Yahweh[b], from kneeling on his knees with his palms spread out toward heaven.
  footnotes:
  - marker: a
    text: Or 'supplication' for 'plea for favor.' The Hebrew term denotes an earnest plea for mercy or favor.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'with his palms spread out toward heaven'; many translations render more generally, 'with his hands spread out to heaven.'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬이 야훼께 이 모든 기도와 간구[a]를 드리기를 마치자, 그는 야훼의 제단 앞에서, 무릎을 꿇고 손바닥을 하늘을 향해 펴고 있던 자리에서 일어났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תְּחִנָּה는 단순한 ‘기도’보다 은혜나 자비를 구하는 절박한 간구를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/כַלּוֹת שְׁלֹמֹה לְ/הִתְפַּלֵּל
  english_pob_choice: And when Solomon had finished praying
  chosen_korean: 솔로몬이 이 모든 기도와 간구를 마치고 야훼께 기도하기를 끝내자
  alternatives_korean:
  - 솔로몬이 기도하기를 마쳤을 때
  - 솔로몬이 이 기도를 마치고
  lexicon: HALOT
  rationale: כְּכַלּוֹת는 ‘마치다/끝내다’의 시간적 완료를 나타내므로, 한국어에서는 문장 흐름이 자연스러운 ‘마치고…끝내자’로 옮겼습니다.
- source_word: אֵת כָּל הַ/תְּפִלָּה וְ/הַ/תְּחִנָּה הַ/זֹּאת
  english_pob_choice: with all this prayer and plea for favor
  chosen_korean: 이 모든 기도와 간구
  alternatives_korean:
  - 이 모든 기도와 탄원
  - 이 기도와 간구
  lexicon: HALOT
  rationale: תְּפִלָּה는 일반적인 ‘기도’, תְּחִנָּה는 은혜를 구하는 절박한 요청이므로, 전통적 용례를 살리되 의미를 드러내는 ‘간구’를 택했습니다.
- source_word: מִ/כְּרֹ֣עַ עַל בִּרְכָּ֔י/ו
  english_pob_choice: from kneeling on his knees
  chosen_korean: 무릎을 꿇고
  alternatives_korean:
  - 무릎 위에 꿇고
  - 무릎을 꿇은 자리에서
  lexicon: HALOT
  rationale: 히브리어는 ‘무릎 위에 무릎을 꿇다’는 식으로 매우 직접적이지만, 한국어에서는 중복을 줄인 ‘무릎을 꿇고’가 본문의 자세를 충분히 살립니다.
- source_word: וְ/כַפָּ֖י/ו פְּרֻשׂ֥וֹת הַ/שָּׁמָֽיִם
  english_pob_choice: with his palms spread out toward heaven
  chosen_korean: 손바닥을 하늘을 향해 펴 든 채
  alternatives_korean:
  - 두 손을 하늘을 향해 편 채
  - 손을 하늘로 펴 든 채
  lexicon: HALOT
  rationale: כַּף는 일반적인 ‘손’보다 구체적으로 ‘손바닥’을 가리키므로, POB의 ‘palms’를 반영해 손의 자세를 더 정확히 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명사표기는 관례적 대체어가 아니라 고유명사로서 ‘야훼’로 옮겨, 언약 이름의 직접성을 보존했습니다.
theological_decisions:
- issue: 기도의 두 명사 נְפִלָּה/תְּחִנָּה의 뉘앙스
  chosen_reading: ‘기도와 간구’로 번역해 일반적 기도(תְּפִלָּה)와 절박한 호소(תְּחִנָּה)를 함께 드러냈습니다.
  alternative_readings:
  - ‘기도와 탄원’
  - ‘기도와 애원’
  rationale: 한국어 교회어의 ‘간구’는 절박한 은혜 요청을 비교적 정확히 반영하면서도 본문의 정서적 강도를 유지합니다.
  doctrine_reference: '번역 원칙: source-direct lexical distinction preservation'
- issue: 하늘을 향한 자세의 묘사
  chosen_reading: ‘손바닥을 하늘을 향해 펴 든 채’로 구체적 신체 자세를 유지했습니다.
  alternative_readings:
  - ‘두 손을 하늘을 향해 편 채’
  - ‘하늘을 향해 손을 펴 들고’
  rationale: 본문은 단순히 ‘손’이 아니라 ‘손바닥’과 펴진 자세를 강조하므로, 기도 행위의 구체성을 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: source fidelity / bodily-posture emphasis
