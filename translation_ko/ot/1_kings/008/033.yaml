translation:
  language: ko
  text: 주님의 백성 이스라엘이 원수 앞에서 쓰러져, 그들이 주님께 죄를 지었기 때문에 주님께 돌아와 주님의 이름을 인정하고 기도하며 이 집에서 주님께 간구할 때[a]
  philosophy: optimal-equivalence
  footnotes:
