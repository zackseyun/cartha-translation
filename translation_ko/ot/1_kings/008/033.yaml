  text: 주님의 백성 이스라엘이 주님께 죄를 지은 탓에 원수 앞에서 쓰러질 때에, 그들이 주님께 돌아와 주님의 이름을 고백하고[a] 이 집에서 주님께 기도하며 간구할 때에,
