  rationale: 문맥상 단순 감사보다 죄를 인정하고 하나님 앞에 자신을 바로 세우는 응답이 두드러지므로, 하나의 의미로 고정하기보다 ‘인정하다’로 포괄적으로 옮겼습니다.
