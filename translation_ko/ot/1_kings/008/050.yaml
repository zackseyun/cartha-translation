id: 1KI.8.50
reference: 1 Kings 8:50
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/סָלַחְתָּ֤ לְ/עַמְּ/ךָ֙ אֲשֶׁ֣ר חָֽטְאוּ לָ֔/ךְ וּ/לְ/כָל פִּשְׁעֵי/הֶ֖ם אֲשֶׁ֣ר פָּשְׁעוּ בָ֑/ךְ וּ/נְתַתָּ֧/ם לְ/רַחֲמִ֛ים לִ/פְנֵ֥י שֹׁבֵי/הֶ֖ם וְ/רִֽחֲמֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/050.yaml
  text: and forgive your people who have sinned against you[a], and all their transgressions that they have committed against you, and grant them compassion before those who took them captive[b], so that they may have compassion on them.
  footnotes:
  - marker: a
    text: Or 'and they will have compassion on them.' The final clause may be read as result as well as purpose.
    reason: alternative_reading
  - marker: b
    text: '''Transgressions'' could also be rendered ''rebellions,'' highlighting covenant breach against God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 주의 백성이 주께 범죄한 것과 그들이 주께 지은 모든 허물도 용서하시고, 그들을 사로잡아 간 자들 앞에서 그들이 긍휼을 입게 하셔서, 그들을 사로잡아 간 자들이 그들을 불쌍히 여기게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 절은 ‘그들을 사로잡아 간 자들이 그들을 불쌍히 여길 것입니다’로도 옮길 수 있습니다. 이 절은 목적뿐 아니라 결과를 나타내는 것으로도 읽힐 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘허물’은 פֶּשַׁע의 번역으로, 문맥에 따라 ‘반역’이라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָלַחְתָּ
  english_pob_choice: and forgive
  chosen_korean: 용서하시고
  alternatives_korean:
  - 용서하여 주시고
  - 사하여 주시고
  lexicon: HALOT
  rationale: 기도문 맥락의 청원형을 자연스러운 한국어로 살려, ‘용서하다’로 옮겼습니다. ‘사하다’도 가능하지만 현대어에서는 덜 직접적입니다.
- source_word: לְעַמְּךָ
  english_pob_choice: your people
  chosen_korean: 주의 백성이
  alternatives_korean:
  - 주님의 백성이
  - 주의 사람들
  lexicon: HALOT
  rationale: 2인칭 소유의 ‘백성’을 한국어 성경 문맥에 맞게 ‘주의 백성’으로 옮겼습니다. ‘백성’이 언약적 집단을 가장 정확히 드러냅니다.
- source_word: פִּשְׁעֵיהֶם
  english_pob_choice: transgressions
  chosen_korean: 허물
  alternatives_korean:
  - 범죄
  - 반역
  - 죄과
  lexicon: HALOT
  rationale: פֶּשַׁע 계열은 단순한 실수보다 언약을 어긴 ‘허물/범죄’의 무게가 있어 ‘허물’로 옮겼습니다. 본문의 반복을 한국어에서 너무 딱딱하게 만들지 않으면서도 죄책의 무게를 유지합니다.
- source_word: לִפְנֵי שֹׁבֵיהֶם
  english_pob_choice: before those who took them captive
  chosen_korean: 그들을 사로잡아 간 자들 앞에서
  alternatives_korean:
  - 그들의 포로를 잡은 자들 앞에서
  - 그들의 포로잡이들 앞에서
  lexicon: HALOT
  rationale: שֹׁבִים은 ‘포로로 잡은 자들’이므로 관계를 분명히 하도록 설명적으로 옮겼습니다. ‘앞에서’는 ‘면전에서/처지 속에서’의 의미를 살렸습니다.
- source_word: וְרִחֲמֽוּם
  english_pob_choice: so that they may have compassion on them
  chosen_korean: 그들이 그들을 불쌍히 여기게 하소서
  alternatives_korean:
  - 그들이 그들에게 긍휼을 베풀게 하소서
  - 그들이 그들을 가엾이 여기게 하소서
  lexicon: HALOT
  rationale: רחם의 동사형과 앞의 רחמים를 연결해 ‘불쌍히 여기다’로 살렸습니다. 결과/목적 양쪽 가능성을 한국어 청원문에서는 ‘-게 하소서’로 열어 두었습니다.
theological_decisions:
- issue: 하나님이 포로로 잡아간 자들의 마음을 바꾸어 동정하게 하신다는 구조
  chosen_reading: 본문은 하나님께서 이스라엘을 용서하시고, 그 결과 포로로 잡아간 자들 앞에서 그들이 은총을 입어 그들로부터 자비를 받게 해 달라는 기도입니다.
  alternative_readings:
  - 마지막 절을 단순한 미래 결과로 읽어 ‘그들이 그들을 불쌍히 여기게 하소서’에만 초점을 둘 수 있음
  rationale: 히브리어의 동사열은 하나님의 용서와 포로들 앞에서의 은총, 그리고 그 결과로 생기는 동정심을 함께 엮습니다. 본문이 가진 인과·결과의 긴장을 풀지 않고 기도문의 흐름을 그대로 살렸습니다.
  doctrine_reference: 번역 철학 §3 — 긴장을 해소하지 말고 보존하기
