    reason: lexical_alternative
  revision_rationale: ‘긍휼’을 사용하여 רחמים/רחם의 어휘적 연결을 보존했고, 마지막 절의 주어를 ‘그들을 사로잡아 간 자들’로 밝혀 한국어의 대명사 모호성을 해소했습니다. 이는 본문이 말하는 대상과 행위자를 명료하게 할 뿐 의미를 추가하지 않습니다. 각주 a는 목적 및 결과 양쪽 읽기를 정확하고 자연스럽게 제시하도록 고쳤습니다.
