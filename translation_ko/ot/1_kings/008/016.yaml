source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֜אתִי אֶת עַמִּ֣/י אֶת יִשְׂרָאֵל֮ מִ/מִּצְרַיִם֒ לֹֽא בָחַ֣רְתִּי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔ד לִֽ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/016.yaml
  text: From the day that I brought my people Israel out of Egypt[a], I have not chosen a city from all the tribes of Israel to build a house for my name to be there[b], but I chose David to be over my people Israel.
  footnotes:
  - marker: a
    text: 'Or, ''and I chose David.'' The Hebrew conjunction can be read coordinately, but the context favors a contrast: no city had been chosen, whereas David had been chosen.'
    reason: lexical_alternative
  - marker: b
    text: '''A house for my name'' is a Hebrew idiom for a sanctuary associated with the LORD''s name and presence; that is, the temple.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 내 백성 이스라엘을 이집트에서 이끌어 낸 날부터, 나는 내 이름이 그곳에 있을 집[a]을 짓기 위하여 이스라엘의 모든 지파 가운데서 어느 도시도 택하지 않았습니다. 그러나 나는 내 백성 이스라엘을 다스리도록 다윗을 택했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 이름이 그곳에 있을 집’은 히브리어 관용구를 따른 표현으로, 여기서는 야훼의 이름과 임재가 관련된 성소, 곧 성전을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵאתִי
  english_pob_choice: I brought ... out
  chosen_korean: 데리고 나온
  alternatives_korean:
  - 끌어낸
  - 이끌어 낸
  lexicon: HALOT
  rationale: 출애굽의 인도·해방 의미를 자연스럽게 살리면서, 히필의 사역적 뉘앙스를 한국어로 과도하게 기계화하지 않았습니다.
- source_word: עַמִּי אֶת יִשְׂרָאֵל
  english_pob_choice: my people Israel
  chosen_korean: 내 백성 이스라엘
  alternatives_korean:
  - 나의 백성 이스라엘
  - 이스라엘, 내 백성
  lexicon: HALOT
  rationale: ‘내 백성’과 ‘이스라엘’의 동격 관계를 한국어에서도 간결하게 유지했습니다.
- source_word: בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: no city from all the tribes of Israel
  chosen_korean: 이스라엘 모든 지파 가운데서 내 이름이 거기에 있을 집을 지을 도시를 하나도 택하지 않았습니다
  alternatives_korean:
  - 이스라엘 모든 지파 중 한 도시를
  - 이스라엘 모든 지파에서 나온 도시를
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 따라 ‘어느 지파에도 속한 도시를 택하지 않음’이라는 뜻을 드러내기 위해 서술 전체를 풀어 옮겼습니다.
- source_word: לִבְנוֹת בַּיִת לִהְיוֹת שְׁמִי שָׁם
  english_pob_choice: to build a house for my name to be there
  chosen_korean: 내 이름이 거기에 있을 집을 지을
  alternatives_korean:
  - 내 이름을 두는 집을 지을
  - 내 이름이 거기에 머무를 성전을 지을
  lexicon: HALOT
  rationale: ‘house for my name’라는 히브리어 관용구를 그대로 살리기 위해 ‘성전’으로 바로 바꾸지 않고 ‘집’을 유지했습니다.
- source_word: וָאֶבְחַר בְּדָוִד
  english_pob_choice: but I chose David
  chosen_korean: 그러나 나는 ... 다윗을 택했습니다
  alternatives_korean:
  - 그리고 나는 다윗을 택했습니다
  - 하지만 나는 다윗을 선택했습니다
  lexicon: HALOT
  rationale: 앞선 ‘도시를 택하지 않았다’와의 대비를 한국어에서 분명히 드러내기 위해 역접을 사용했고, בחר의 기본 의미는 ‘택하다’로 옮겼습니다.
- source_word: לִהְיוֹת עַל עַמִּי יִשְׂרָאֵל
  english_pob_choice: to be over my people Israel
  chosen_korean: 내 백성 이스라엘 위에 있을
  alternatives_korean:
  - 내 백성 이스라엘을 다스릴
  - 내 백성 이스라엘의 위에 서 있을
  lexicon: HALOT
  rationale: 히브리어의 직역적 구조 ‘~위에 있다’를 살려, 다윗의 권위를 말하되 통치 방식을 해석적으로 좁히지 않았습니다.
theological_decisions:
- issue: ‘house for my name’ 관용구 처리
  chosen_reading: ‘내 이름이 거기에 있을 집’으로 옮겨, 성전이라는 해석어를 본문에 먼저 넣지 않았습니다.
  alternative_readings:
  - 성전
  - 내 이름이 거할 집
  rationale: 본문은 이름-임재의 관용구를 사용하므로, 의미는 드러내되 용어 자체는 원문 구조를 보존하는 편이 더 투명합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 선택의 대비 구조
  chosen_reading: 도시를 택하지 않음과 다윗을 택함의 대비를 ‘그러나’로 살렸습니다.
  alternative_readings:
  - 그리고
  - 또
  rationale: 문맥상 두 번의 선택 행위가 병렬이 아니라 대비이므로, 다윗 언약과 성전 장소 선택의 순서를 드러내는 것이 본문의 신학적 초점을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
