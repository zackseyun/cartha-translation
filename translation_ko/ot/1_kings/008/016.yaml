review_pass:
  verdict: revise
  source_fidelity: 도시를 택한 목적과 다윗을 택한 목적을 표현한 두 부정사구의 관계를 더 분명히 해야 합니다. 초안의 ‘집을 지을 도시’는 도시가 집을 짓는 주체인 듯한 수식 구조가 되어, 하나님께서 도시를 택하여 집을 지으신다는 원문의 뜻을 흐립니다. 또한 עַל־עַמִּי의 통치·지도자 문맥은 한국어에서 ‘위에 있을’보다 ‘다스리도록’이 자연스럽고 정확하게 전달합니다.
  naturalness: ‘내 이름이 거기에 있을 집을 지을 도시’는 한국어 문장 구조상 부자연스럽고 의미가 잘못 연결됩니다. 목적을 나타내는 ‘집을 짓기 위하여’로 고치고, 각 목적어와 수식 관계를 분명히 하면 현대 표준 한국어 합쇼체로 자연스럽습니다.
  terminology: ‘내 백성 이스라엘’, ‘택하다’, ‘집’, ‘내 이름이 그곳에 있다’는 원문의 핵심 용어와 관용적 표현을 적절히 보존합니다. ‘성전’은 본문이 아니라 각주에서 설명하는 것이 적절합니다. ‘다스리도록’은 עַל의 왕적 권위 문맥을 자연스럽게 나타내며 특정 교리적 해석을 더하지 않습니다.
