  to: 내가 내 백성 이스라엘을 이집트에서 이끌어 낸 날부터, 나는 내 이름이 그곳에 있을 집[a]을 짓기 위하여 이스라엘의 모든 지파 가운데서 어느 도시도 택하지 않았습니다. 그러나 나는 내 백성 이스라엘을 다스리도록 다윗을 택했습니다.
  rationale: 도시가 집을 짓는 것처럼 읽히는 한국어 수식 구조를 바로잡아, 집을 짓기 위한 도시 선택이라는 원문의 관계를 보존했습니다. ‘집’과 ‘내 이름이 그곳에 있다’라는 관용구는 유지하고 각주를 해당 표현에 붙였습니다. 다윗에 대해서는 원문의 왕적 ‘~ 위에 있다’가 한국어에서 자연스럽게 전달되도록 ‘다스리도록’으로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
