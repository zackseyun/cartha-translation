translation:
  language: ko
  text: 그리고 왕과 그와 함께한 온 이스라엘이 야훼 앞에서 제사를 드리고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 동일한 어근의 동사와 명사를 결합한 표현을 사용하여 제사 행위를 강조합니다. 한국어에서는 그 반복을 그대로 옮기지 않고 ‘제사를 드리다’로 자연스럽게 번역했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  english_pob_choice: And the king
  chosen_korean: 그리고 왕
  alternatives_korean:
  - 이제 왕
  - 그리고 그 왕
  lexicon: HALOT
  rationale: 문맥상 솔로몬을 가리키는 निश्चित한 표현이므로, 서술을 자연스럽게 이어 주는 ‘그리고’와 함께 ‘왕’으로 옮겼습니다.
- source_word: וְכָל יִשְׂרָאֵל
  english_pob_choice: and all Israel
  chosen_korean: 그와 함께한 온 이스라엘
  alternatives_korean:
  - 그리고 온 이스라엘
  - 그리고 모든 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현을 살려 ‘온 이스라엘’로 옮기되, 이어지는 עִמּוֹ를 자연스럽게 통합해 관계를 분명히 했습니다.
- source_word: זֹבְחִים זֶבַח
  english_pob_choice: were sacrificing sacrifices
  chosen_korean: 제사를 드리고 있었습니다
  alternatives_korean:
  - 희생제물을 바치고 있었습니다
  - 제물을 드리고 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 제의적 표현은 한국어에서 같은 어근 반복을 그대로 살리기보다, ‘제사를 드리다’가 의미를 더 정확하고 자연스럽게 전달합니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼 앞에
  - 야훼 면전에서
  lexicon: HALOT
  rationale: 신적 임재 앞이라는 공간적·예전적 의미를 유지하면서, 하나님의 이름은 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
