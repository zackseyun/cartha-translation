id: 1KI.8.35
reference: 1 Kings 8:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/הֵעָצֵ֥ר שָׁמַ֛יִם וְ/לֹא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּֽלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וּ/מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/035.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and give thanks to your name and turn from their sin because you afflict them[b],
  footnotes:
  - marker: a
    text: Or 'praise your name' or 'confess your name'; the Hebrew verb can carry senses of thankful praise or open acknowledgment/confession depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'because you humble them.' The Hebrew verb may denote afflicting or humbling; some take it differently as 'answer them,' but the context of drought as discipline favors 'afflict/humble.'
    reason: alternative_reading
translation:
  language: ko
  text: 하늘이 닫혀, 그들이 주님께 죄를 지었기 때문에 비가 내리지 않을 때에, 그들이 이곳을 향해 기도하고 주님의 이름을 찬양하며[a], 주님께서 그들을 괴롭게 하시므로[b] 자기 죄에서 돌이킬 때에는,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘찬양하며’는 הוֹדוּ의 가능한 의미들 가운데 이 문맥에서 자연스러운 선택입니다. 히브리어는 ‘감사하다’, ‘찬양하다’, ‘고백하다’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들을 괴롭게 하시므로’는 תַעֲנֵם을 가뭄을 통한 징계로 이해한 번역입니다. ‘그들에게 응답하시므로’로도 볼 수 있으나, 앞뒤 문맥상 징계와 회개의 흐름이 더 강합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהֵעָצֵר שָׁמַיִם
  english_pob_choice: When the heavens are shut up
  chosen_korean: 하늘이 닫혀
  alternatives_korean:
  - 하늘이 막혀
  - 하늘이 닫히고
  lexicon: HALOT
  rationale: בְּ + 부정사구가 가리키는 상황을 한국어 조건절로 옮겼고, שָׁמַיִם의 복수적 표지를 살려 ‘하늘’로 자연스럽게 표현했습니다.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  english_pob_choice: and give thanks to your name
  chosen_korean: 주님의 이름을 찬송하며
  alternatives_korean:
  - 주님의 이름에 감사하며
  - 주님의 이름을 고백하며
  lexicon: HALOT
  rationale: הוֹדוּ는 문맥상 감사, 찬양, 고백의 뜻을 가질 수 있으므로, 회개와 기도의 장면에는 ‘찬송하며’가 가장 넓고 자연스럽게 대응합니다.
- source_word: וּמֵחַטָּאתָם יְשׁוּבוּן
  english_pob_choice: and turn from their sin
  chosen_korean: 자기 죄에서 돌아서게 하시되
  alternatives_korean:
  - 자기 죄에서 돌이키게 하시되
  - 죄를 떠나게 하시되
  lexicon: HALOT
  rationale: מִן과 결합한 שׁוּב의 방향성을 살려 ‘죄에서 돌아서다’로 옮겼고, 청원문 구조에 맞게 수동 가능 표현으로 정리했습니다.
- source_word: כִּי תַעֲנֵם
  english_pob_choice: because you afflict them
  chosen_korean: 주님께서 그들을 괴롭게 하실 때에는
  alternatives_korean:
  - 주님께서 그들을 낮추실 때에는
  - 주님께서 그들에게 응답하실 때에는
  lexicon: HALOT
  rationale: 문맥상 가뭄이 죄에 대한 징계로 작동하므로 ענה의 ‘괴롭게 하다/낮추다’ 의미를 따랐고, 시간절로 자연스럽게 마무리했습니다.
theological_decisions:
- issue: 하늘을 향해 드리는 기도
  chosen_reading: 이곳을 향해 기도하고
  alternative_readings:
  - 이곳에 기도하고
  - 이곳을 향하여 기도하고
  rationale: אֶל הַמָּקוֹם הַזֶּה는 장소에 대한 기도 대상이 아니라 성전 방향성을 가리키므로, ‘향해’로 번역해 우상화 오해를 피했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 성전 기도 문맥에서의 הוֹדוּ와 ענה
  chosen_reading: 찬송하며 … 그들을 괴롭게 하실 때에는
  alternative_readings:
  - 고백하며 … 응답하실 때에는
  - 감사하며 … 낮추실 때에는
  rationale: 회개·징계 문맥에서는 הוֹדוּ를 단순 감사보다 하나님 이름을 높이는 찬송으로, תַעֲנֵם은 ‘응답’보다 징계/겸손케 하심의 흐름으로 이해하는 편이 본문 논리를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3, §5
