  source_fidelity: 핵심 어휘 선택인 ‘찬양하며’와 ‘괴롭게 하시므로’는 문맥상 가능한 번역입니다. 그러나 초안의 ‘자기 죄에서 돌아서게 하시되’는 능동형인 יְשׁוּבוּן(그들이 돌아서다)을 하나님이 그들을 돌이키게 하신다는 사역 표현으로 바꾸어 놓았습니다. 또한 כִּי תַעֲנֵם은 여기서 회개의 이유를 나타내므로 ‘괴롭게 하실 때에는’보다 인과 관계를 드러내야 합니다.
  naturalness: 수정문은 한국어 조건절 안에서 사건의 순서와 인과 관계를 자연스럽게 연결합니다. 본 절은 다음 절의 청원으로 이어지는 문장이므로 끝의 쉼표를 유지했습니다.
  terminology: ‘이곳을 향해 기도하고’는 성전을 향한 방향성을 적절히 보존합니다. הוֹדוּ는 ‘찬양하며’로 번역할 수 있으며, 감사·고백의 다른 가능성은 각주에 남깁니다. תַעֲנֵם은 가뭄의 징계 문맥에 따라 ‘괴롭게 하시므로’로 옮기되 대안 독법을 각주에 제시합니다.
