reference: 1 Kings 8:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/סָ֨לַחְתָּ֜ לְ/חַטַּ֤את עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל כִּ֥י תוֹרֵ֛/ם אֶת הַ/דֶּ֥רֶךְ הַ/טּוֹבָ֖ה אֲשֶׁ֣ר יֵֽלְכוּ בָ֑/הּ וְ/נָתַתָּ֤ה מָטָר֙ עַל אַרְצְ/ךָ֔ אֲשֶׁר נָתַ֥תָּה לְ/עַמְּ/ךָ֖ לְ/נַחֲלָֽה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/036.yaml
  text: then may you hear in heaven and forgive the sin of your servants[a], your people Israel, when you teach them the good way in which they should walk. And may you give rain on your land[b], which you have given to your people as an inheritance.
  footnotes:
  - marker: a
    text: Or 'hear from heaven.' The Hebrew idiom is literally 'hear heaven/the heavens,' and English commonly supplies either 'in' or 'from.'
    reason: lexical_alternative
  - marker: b
    text: Or 'when you instruct them in the good way they should walk in.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러니 주님께서 하늘에서 들으시고 주의 종들, 곧 주의 백성 이스라엘의 죄를 용서해 주십시오. 그들이 마땅히 걸어가야 할 좋은 길을 주님께서 그들에게 가르쳐 주실 때, 땅에 비를 내려 주십시오. 주님께서 주의 백성에게 유업으로 주신 주의 땅에 비를 내려 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  english_pob_choice: hear in heaven
  chosen_korean: 하늘에서 들으시고
  alternatives_korean:
  - 하늘에서 들으십시오
  - 하늘로부터 들으시고
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 옮기되, 기도체의 청원적 뉘앙스를 살리기 위해 ‘들으시고’로 처리했습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 주의 종들
  alternatives_korean:
  - 주의 노예들
  - 주의 하인들
  lexicon: HALOT
  rationale: 여기서는 하나님께 드리는 언약적 호칭으로, 본문의 관계성을 살리기 위해 ‘종들’이 가장 적절합니다.
- source_word: כִּי תוֹרֵם
  english_pob_choice: when you teach them
  chosen_korean: 그들이 마땅히 걸어가야 할 좋은 길을 주님께서 그들에게 가르쳐 주실 때
  alternatives_korean:
  - 주님께서 그들에게 좋은 길을 가르치실 때
  - 주님께서 그들에게 바른 길을 가르치실 때
  lexicon: HALOT
  rationale: הורה의 히필은 ‘가르치다/지시하다’이므로, 행위의 규범성과 인도성을 함께 드러내기 위해 길의 내용까지 포함해 풀어 옮겼습니다.
- source_word: הַדֶּרֶךְ הַטּוֹבָה
  english_pob_choice: the good way
  chosen_korean: 좋은 길
  alternatives_korean:
  - 선한 길
  - 바른 길
  lexicon: HALOT
  rationale: ‘דרך’의 비유적 의미를 한국어의 ‘길’로 유지하고, ‘טובה’를 ‘좋은’으로 옮겨 직접성을 보존했습니다.
- source_word: עַל אַרְצְךָ ... אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  english_pob_choice: on your land ... which you have given to your people as an inheritance
  chosen_korean: 주님께서 주의 백성에게 유업으로 주신 주의 땅에 비를 내려 주십시오
  alternatives_korean:
  - 주님의 땅에 비를 내려 주십시오
  - 주님께서 주의 백성에게 상속으로 주신 땅에 비를 내려 주십시오
  lexicon: HALOT
  rationale: ‘땅’에 대한 하나님의 소유권을 살리기 위해 ‘주의 땅’으로 옮기고, ‘נחלה’는 언약적 토지 분배를 드러내는 ‘유업’으로 처리했습니다.
theological_decisions:
- issue: 하나님의 땅에 대한 소유권과 이스라엘의 유업이라는 긴장
  chosen_reading: 주의 땅 ... 주의 백성에게 유업으로 주신
  alternative_readings:
  - 주님께서 주의 백성에게 주신 땅
  - 이스라엘의 땅
  rationale: 본문은 그 땅이 여전히 하나님의 땅임을 유지하면서도 이스라엘에게 유업으로 주어졌음을 함께 말하므로, 두 요소를 모두 드러내는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: 청원문에서의 합쇼체 유지
  chosen_reading: ~해 주십시오
  alternative_readings:
  - ~하소서
  - ~해 주세요
  rationale: 왕의 성전 봉헌 기도라는 정중한 간청의 장르를 따라, 현대 공적 문체의 합쇼체를 일관되게 유지했습니다.
  doctrine_reference: Korean target style
