  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לְבָבָ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ אֹיְבֵי/הֶ֖ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/הַ/בַּ֖יִת אֲשֶׁר בנית לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/048.yaml
  text: and they return to you with all their heart and with all their soul in the land of their enemies who took them captive[a], and pray to you toward their land that you gave to their fathers, the city that you chose, and the house that I have built for your name[c][b],
  footnotes:
  - marker: a
    text: Or 'turn back to you'; in this context the phrase can also carry the sense of repentance.
    reason: lexical_alternative
  - marker: b
    text: Or 'facing their land.' The Hebrew expression denotes praying in the direction of their land.
    reason: lexical_alternative
  - marker: c
    text: That is, the house/temple dedicated to your name.
    reason: cultural_note
translation:
  language: ko
  text: 그들이 포로로 잡혀 간 원수의 땅에서 온 마음과 온 영혼으로 주께 돌아오고, 당신께 기도하면서 자기들의 땅을 향하고 — 당신이 그 조상들에게 주신 땅, 당신이 택하신 성읍, 그리고 당신의 이름을 위해 내가 지은 집을 향할 때[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주께 돌아서다’로도 옮길 수 있습니다. 이 문맥에서는 회개의 의미를 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 자기들의 땅을 향하여 기도한다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 당신의 이름에 바쳐진 집, 즉 성전입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  english_pob_choice: and they return to you
  chosen_korean: 주께 돌아오고
  alternatives_korean:
  - 주께 되돌아오고
  - 주께 회개하고
  lexicon: HALOT
  rationale: שׁוּב는 기본적으로 ‘돌아오다/되돌아가다’이므로, 본문이 요구하는 관계적 귀환을 살리면서도 명시적 교리어인 ‘회개하다’로 좁히지 않았습니다.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  english_pob_choice: with all their heart and with all their soul
  chosen_korean: 온 마음과 온 영혼으로
  alternatives_korean:
  - 전심전력으로
  - 마음과 생명 전체로
  lexicon: HALOT
  rationale: 히브리어의 전인적 헌신 표현을 한국어에서도 이미지가 보존되도록 ‘마음’과 ‘영혼’으로 옮겼습니다.
- source_word: בְּאֶרֶץ אֹיְבֵיהֶם אֲשֶׁר שָׁבוּ אֹתָם
  english_pob_choice: in the land of their enemies who took them captive
  chosen_korean: 포로로 잡혀 간 원수의 땅에서
  alternatives_korean:
  - 그들을 사로잡은 원수들의 땅에서
  - 그들을 포로로 끌고 간 원수의 땅에서
  lexicon: HALOT
  rationale: שׁבה의 강제적 포로화 의미를 살려 ‘포로로 잡혀 간’으로 옮기고, ‘땅’은 본문의 ארץ 대비를 유지했습니다.
- source_word: דֶּרֶךְ אַרְצָם
  english_pob_choice: toward their land
  chosen_korean: 자기들의 땅을 향하고
  alternatives_korean:
  - 자기들의 땅 쪽으로
  - 자기들의 땅을 향하여
  lexicon: HALOT
  rationale: דֶּרֶךְ의 방향성은 ‘향하고’로 자연스럽게 풀어, 기도할 때의 지리적 방향을 드러냈습니다.
- source_word: וְהַבַּיִת אֲשֶׁר בנית לִשְׁמֶךָ
  english_pob_choice: and the house that I have built for your name
  chosen_korean: 그리고 당신의 이름을 위해 내가 지은 집
  alternatives_korean:
  - 그리고 당신의 이름을 위해 내가 세운 집
  - 그리고 당신의 이름에 속한 집
  lexicon: HALOT
  rationale: בַּיִת은 성전의 기능을 지닌 ‘집’으로 두어 히브리어의 직설성을 보존했고, לִשְׁמֶךָ는 관용구적으로 ‘당신의 이름을 위해’로 옮겼습니다.
theological_decisions:
- issue: שׁוּב의 회개 뉘앙스
  chosen_reading: 본문에는 ‘회개하다’를 직접 넣지 않고 ‘주께 돌아오다’로 유지했습니다.
  alternative_readings:
  - 주께 회개하고
  - 주께 돌아서고
  rationale: 본문의 핵심은 언약적 회복을 향한 귀환이며, 회개의 내적 의미는 문맥에서 읽히게 두는 편이 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: 'Translation philosophy #3'
- issue: ‘집’과 성전의 관계
  chosen_reading: ‘집’으로 번역하고 성전이라는 해석어는 본문에 삽입하지 않았습니다.
  alternative_readings:
  - 성전
  - 당신의 성전
  rationale: 히브리어 בַּיִת의 문자적 의미를 유지해, 이 건물이 하나님의 이름을 위한 집이라는 솔로몬의 표현을 그대로 드러내었습니다.
  doctrine_reference: 'Translation philosophy #1, #5'
