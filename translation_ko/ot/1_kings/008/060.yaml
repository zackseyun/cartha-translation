  text: so that all the peoples of the earth may know that the LORD, he is God; there is no other.
translation:
  language: ko
  text: 그리하여 세상의 모든 민족이 야훼께서 하나님이심을 알게 하시고, 다른 이가 없음을 알게 하소서.
  philosophy: formal
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: יהוה
  rationale: 본문의 신명은 영어 POB의 LORD에 해당하는 야훼로 옮겨, 원문 표기를 드러내면서도 프로젝트 기본 용례를 따랐습니다.
- source_word: הוּא
  english_pob_choice: he is
  chosen_korean: -이심을
  alternatives_korean:
  - 그분이시라고
  - 그분이심을
  lexicon: הוא
  rationale: ‘그가 ~이다’의 동일시를 한국어 관형화 구조로 자연스럽게 반영해, ‘야훼께서 하나님이심’으로 직역적 의미를 살렸습니다.
- source_word: כָּל עַמֵּי הָאָרֶץ
  english_pob_choice: all the peoples of the earth
  chosen_korean: 세상의 모든 민족
  alternatives_korean:
  - 땅의 모든 백성
  - 온 땅의 모든 민족
  lexicon: עם / ארץ
  rationale: ‘땅/세상’과 ‘민족들’의 포괄성을 함께 살려, 단순한 지리적 ‘땅’보다 수용 가능한 현대 한국어로 옮겼습니다.
- source_word: אֵין עוֹד
  english_pob_choice: there is no other
  chosen_korean: 다른 이가 없음을
  alternatives_korean:
  - 다른 분이 없음을
  - 다른 존재가 없음을
  lexicon: אין עוד
  rationale: 문맥상 하나님 외의 다른 신적 존재가 없다는 배타적 진술이므로, 자연스러운 한국어로 ‘다른 이가 없음’이라고 했습니다.
theological_decisions:
- issue: 신명 표현과 본문 신학의 직접성
  chosen_reading: ‘야훼께서 하나님이심’으로 직설적으로 번역해, 본문이 선포하는 언약적 유일신 신앙을 분명히 드러냈습니다.
  alternative_readings:
  - ‘주님이 하나님이심’
  - ‘여호와께서 하나님이심’
  rationale: 본문의 핵심은 특정 호칭의 완곡화가 아니라 야훼의 유일성과 절대성을 선언하는 데 있으므로, 원문-직결성을 우선했습니다.
  doctrine_reference: 신 6:4; 사 45:5
