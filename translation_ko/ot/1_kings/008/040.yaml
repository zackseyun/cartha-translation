  text: לְמַ֨עַן֙ יִֽרָא֔וּ/ךָ כָּל הַ֨/יָּמִ֔ים אֲשֶׁר הֵ֥ם חַיִּ֖ים עַל פְּנֵ֣י הָ/אֲדָמָ֑ה אֲשֶׁ֥ר נָתַ֖תָּה לַ/אֲבֹתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/040.yaml
  text: so that they may fear you all the days that they live on the face of the land that you gave to our fathers[a][b][c].
  footnotes:
  - marker: a
    text: Or 'on the face of the earth.' The Hebrew idiom can be rendered more broadly, but here 'land' fits the reference to what God gave to Israel's fathers.
    reason: lexical_alternative
  - marker: b
    text: Or 'as long as they live.'
    reason: lexical_alternative
  - marker: c
    text: 'Or ''to our ancestors.'' Hebrew: ''to our fathers.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 주님께서 우리 조상들에게 주신 그 땅에서 사는 모든 날 동안 주님을 두려워하도록 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅/지면 위에서’. 히브리어 관용구는 더 넓게 ‘땅 위에서’ 또는 ‘지면 위에서’로도 옮길 수 있지만, 여기서는 조상들에게 주신 땅을 가리키므로 ‘그 땅에서’가 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 사는 동안 내내’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘우리의 조상들에게’. 히브리어는 문자적으로 ‘우리의 아버지들에게’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: so that
  chosen_korean: …하게 하시되
  alternatives_korean:
  - …하도록
  - …하기 위하여
  lexicon: HALOT
  rationale: 목적/결과를 나타내는 לְמַעַן의 힘을 한국어로 자연스럽게 살리되, 기도문 문맥에 맞게 청원형으로 표현했습니다.
- source_word: יִרָאוּךָ
  english_pob_choice: they may fear you
  chosen_korean: 주님을 두려워하게
  alternatives_korean:
  - 주님을 경외하게
  - 주님을 우러러 두려워하게
  lexicon: HALOT
  rationale: 하나님 앞의 언약적 경외를 나타내는 ירא를 약화시키지 않기 위해 ‘두려워하다’를 유지했습니다.
- source_word: עַל פְּנֵי הָאֲדָמָה
  english_pob_choice: on the face of the land
  chosen_korean: 그 땅 위에서
  alternatives_korean:
  - 그 땅 위에
  - 땅의 표면에서
  - 온 땅에서
  lexicon: HALOT
  rationale: ‘face of the land’라는 히브리 관용을 보존하면서도, 한국어에서 더 자연스러운 ‘그 땅 위에서’로 옮겼습니다.
- source_word: לַאֲבֹתֵינוּ
  english_pob_choice: to our fathers
  chosen_korean: 우리 조상들에게
  alternatives_korean:
  - 우리 아버지들에게
  - 우리 선조들에게
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘우리의 아버지들’이지만, 문맥상 언약적 조상들을 가리키므로 한국어에서는 의미를 분명히 하는 ‘조상들’로 옮겼습니다.
theological_decisions:
- issue: ‘fear you’의 신학적 강도 유지
  chosen_reading: 주님을 두려워하게
  alternative_readings:
  - 주님을 경외하게
  - 주님을 존중하게
  rationale: 이 본문은 단순한 예의가 아니라 하나님께 대한 언약적 두려움/경외를 말하므로, 더 약한 ‘존중하다’는 피했습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: ‘our fathers’의 번역 범위
  chosen_reading: 우리 조상들에게
  alternative_readings:
  - 우리 아버지들에게
  - 우리 선조들에게
  rationale: 여기서는 특정 생물학적 아버지보다 이스라엘의 언약 공동체 기원을 가리키므로, 한국어로도 그 범위를 드러내는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §1
