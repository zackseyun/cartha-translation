  rationale: 본문은 성호를 제목으로 대체하지 않고 직접 부르므로, POB 원칙에 따라 이름 자체를 드러내는 번역이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
