base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/015.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it with his hand, saying,”
  footnotes:
  - marker: a
    text: Or 'Praised be the LORD.' The Hebrew blessing formula is traditionally rendered 'Blessed be.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 말했습니다. “이스라엘의 하나님 야훼는 복되십니다. 그분은 내 아버지 다윗에게 친히 말씀하시고, 친히 손으로 그 일을 이루셨으니, 말씀하시기를”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘찬양받으십니다.’ 히브리어 축복 공식은 전통적으로 ‘복되다’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  english_pob_choice: Blessed be
  chosen_korean: 복되십니다
  alternatives_korean:
  - 복되소서
  - 찬양받으십니다
  lexicon: HALOT
  rationale: 히브리어 축복 공식의 수동 분사형을 한국어에서는 하나님께 드리는 경배적 선언으로 옮기되, 합쇼체에서 자연스러운 ‘복되십니다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유명사 יהוה를 기존 교회용 대체어가 아니라 स्रोत 기반의 전통적 음역 ‘야훼’로 옮겨, 하나님의 언약 이름을 유지했습니다.
- source_word: אֲשֶׁר דִּבֶּר בְּפִיו
  english_pob_choice: who spoke with his mouth
  chosen_korean: 친히 말씀하시고
  alternatives_korean:
  - 그의 입으로 말씀하시고
  - 입으로 말씀하시고
  lexicon: HALOT
  rationale: 히브리어의 ‘입으로’라는 신체적 관용구를 한국어에서는 부자연스럽지 않게 풀되, 단순한 ‘말하다’보다 직접성과 대응성을 드러내기 위해 ‘친히 말씀하시고’로 옮겼습니다.
- source_word: וּבְיָדוֹ מִלֵּא
  english_pob_choice: and has fulfilled it with his hand
  chosen_korean: 친히 손으로 그 일을 이루셨으니
  alternatives_korean:
  - 손으로 그것을 성취하셨으니
  - 그의 손으로 이루셨으니
  lexicon: HALOT
  rationale: ‘손’의 몸-행위 대응을 유지하면서도 한국어에서는 ‘이루다’가 성취·완결의 뜻을 자연스럽게 전달하므로, 문맥상 보충되는 목적어를 살려 옮겼습니다.
