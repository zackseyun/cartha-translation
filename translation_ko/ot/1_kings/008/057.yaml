reference: 1 Kings 8:57
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ עִמָּ֔/נוּ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אֲבֹתֵ֑י/נוּ אַל יַעַזְבֵ֖/נוּ וְ/אַֽל יִטְּשֵֽׁ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/057.yaml
  text: May Yahweh our God be with us[a], as he was with our fathers. May he not forsake us or abandon us.
  footnotes:
  - marker: a
    text: Or 'our ancestors.' The Hebrew says 'our fathers,' referring to Israel's forefathers.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 우리 하나님이 우리와 함께 계시기를 원합니다[a] — 우리 조상들과 함께 계셨던 것처럼 말입니다. 그가 우리를 버리지도, 저버리지도 않으시기를 원합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 조상들’. 히브리어는 ‘우리의 아버지들’이라고 하며, 이스라엘의 선조들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  english_pob_choice: May ... be
  chosen_korean: …계시기를 원합니다
  alternatives_korean:
  - …있기를 원합니다
  - …계시게 하소서
  lexicon: HALOT
  rationale: 주격 jussive의 소망/간구를 현대 한국어 기도문에 자연스럽게 옮기되, 직설적 명령보다 간구형 표현을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명사 יהוה를 관용적 대체어로 바꾸지 않고, 프로젝트 기본값에 따라 음역형 ‘야훼’를 사용했습니다.
- source_word: אֲבֹתֵינוּ
  english_pob_choice: our fathers
  chosen_korean: 우리 조상들과
  alternatives_korean:
  - 우리 아버지들과
  - 우리 선조들과
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘우리의 아버지들’이지만 한국어에서는 혈통적 선조를 자연스럽게 가리키는 ‘조상들’이 의미를 가장 잘 보존합니다.
- source_word: אַל יַעַזְבֵנוּ / וְאַל יִטְּשֵׁנוּ
  english_pob_choice: May he not forsake us or abandon us
  chosen_korean: 우리를 버리지도, 저버리지도 않으시기를 원합니다
  alternatives_korean:
  - 우리를 떠나지도, 버리지도 않으시기를 원합니다
  - 우리를 forsake하지도, abandon하지도 않으시기를 원합니다
  lexicon: HALOT
  rationale: 두 동사는 의미가 겹치지만 동일하지 않으므로 한국어도 ‘버리다 / 저버리다’로 평행성을 살려 중복을 단순 반복으로 평탄화하지 않았습니다.
theological_decisions:
- issue: 야훼의 임재를 기원하는 간구의 어조
  chosen_reading: ‘…계시기를 원합니다’로 번역해 공동체적 기도/축복의 간구를 살렸습니다.
  alternative_readings:
  - ‘…계시게 하소서’
  - ‘…계십소서’
  rationale: 문장은 왕 솔로몬의 기도 결론부로, 단순 서술이 아니라 하나님의 지속적 임재를 요청하는 간구입니다. 현대 합쇼체로 자연스럽게 옮기되 기도성은 유지했습니다.
  doctrine_reference: '본문 문맥: 열왕기상 8장 성전 봉헌 기도'
