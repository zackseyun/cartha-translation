id: 1KI.8.44
reference: 1 Kings 8:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל אֹ֣יְב֔/וֹ בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֶל יְהוָ֗ה דֶּ֤רֶךְ הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥תִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/044.yaml
  text: When your people go out to battle against their enemy by the way you send them[a], and they pray to Yahweh toward the city that you have chosen and the house that I have built for your name[b],
  footnotes:
  - marker: a
    text: Or 'facing the city.' The Hebrew says 'the way/direction of the city,' expressing orientation in prayer.
    reason: lexical_alternative
  - marker: b
    text: That is, the temple; Hebrew 'the house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 백성이 그들의 원수와 싸우기 위해 당신이 그들을 보내시는 길로 나가, 당신께서 선택하신 성읍을 향하여 그리고 당신의 이름을 위하여 내가 지은 집을 향하여 야훼께 기도하면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성읍을 향하여’는 히브리어의 ‘성읍의 길/방향’이라는 뜻을 반영한 것으로, 기도 방향을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘집’이며, 문맥상 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי / When
  english_pob_choice: When your people go out
  chosen_korean: 당신의 백성이 … 나가
  alternatives_korean:
  - 만일 당신의 백성이 … 나가
  - 당신의 백성이 … 나갈 때
  lexicon: HALOT
  rationale: 문맥상 솔로몬의 간구가 가정적 상황을 제시하므로, ‘~할 때’보다 예전적이면서도 자연스러운 ‘…나가’로 조건 상황을 열어 두었습니다.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  english_pob_choice: by the way you send them
  chosen_korean: 당신이 그들을 보내시는 길로
  alternatives_korean:
  - 당신이 그들을 보내시는 방식으로
  - 당신이 그들을 보내시는 방향으로
  lexicon: HALOT
  rationale: דֶּרֶךְ의 ‘길/경로’ 이미지를 살리면서, 하나님이 전쟁의 경로를 정해 보내신다는 의미를 한국어로 자연스럽게 드러냈습니다.
- source_word: דֶּרֶךְ הָעִיר
  english_pob_choice: toward the city
  chosen_korean: 그들의 원수와 싸우기 위해 … 그리고 … 성읍을 향하여
  alternatives_korean:
  - 성읍 쪽으로
  - 성읍을 향해
  lexicon: HALOT
  rationale: הָעִיר 앞의 דֶּרֶךְ는 기도 방향을 나타내는 표현이므로, ‘향하여’로 방향성을 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본어를 따라 여호와 대신 음역형 ‘야훼’를 사용해 고유한 언약 이름을 보존했습니다.
- source_word: הַבַּיִת
  english_pob_choice: the house
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 전
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘집’을 유지해 ‘당신의 이름을 위하여’라는 고정된 성경적 관용을 그대로 드러냈습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘주’ 또는 ‘주님’으로 대체
  - ‘여호와’로 표기
  rationale: 본문이 직접 신명기적 언약 이름을 사용하므로, 호칭으로 대체하지 않고 고유 이름을 보존했습니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה YHWH → 야훼
