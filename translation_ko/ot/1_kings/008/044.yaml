  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 히브리어의 두 방향 표현은 성읍과 집 모두를 향한 기도를 수식하므로, 이를 한 묶음으로 명확히 표현하고 각주 앵커도 해당 표현과 ‘집’에 각각 붙이는 것이 좋습니다. כִּי의 조건적 용법, 전쟁에 나감, 하나님께서 보내시는 길, 야훼께 기도함, ‘내가 지은 집’은 보존했습니다.
  naturalness: 초안의 ‘성읍을 향하여 그리고 … 집을 향하여’는 병렬이 다소 어색하고, ‘당신’의 반복은 현대 표준 한국어의 예배·기도 문맥에서 자연스럽지 않을 수 있습니다. ‘주님’으로 대명사를 처리하고, ‘성읍과 … 집을 향하여’로 묶으면 현대적이고 격식 있는 문장이 됩니다.
  terminology: יְהוָה가 실제로 나타나는 곳은 프로젝트 방침에 따라 ‘야훼’로 유지했습니다. הַבַּיִת은 ‘집’으로 보존하고, 성전을 가리킨다는 점은 각주로 설명합니다. ‘주의/주님’은 본문의 2인칭 대명사를 자연스럽게 옮긴 것이며, 신명(야훼) 자체를 대체하지 않습니다.
