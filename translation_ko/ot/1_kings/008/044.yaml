  lexicon: HALOT
  rationale: דֶּרֶךְ의 ‘길/경로’ 이미지를 살리면서, 하나님이 전쟁의 경로를 정해 보내신다는 의미를 한국어로 자연스럽게 드러냈습니다.
- source_word: דֶּרֶךְ הָעִיר
  english_pob_choice: toward the city
  chosen_korean: 그들의 원수와 싸우기 위해 … 그리고 … 성읍을 향하여
  alternatives_korean:
  - 성읍 쪽으로
  - 성읍을 향해
  lexicon: HALOT
  rationale: הָעִיר 앞의 דֶּרֶךְ는 기도 방향을 나타내는 표현이므로, ‘향하여’로 방향성을 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본어를 따라 여호와 대신 음역형 ‘야훼’를 사용해 고유한 언약 이름을 보존했습니다.
- source_word: הַבַּיִת
  english_pob_choice: the house
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 전
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘집’을 유지해 ‘당신의 이름을 위하여’라는 고정된 성경적 관용을 그대로 드러냈습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
