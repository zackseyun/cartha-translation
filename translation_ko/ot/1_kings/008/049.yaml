  rationale: 청원문 맥락에서 2인칭 남성 단수 완료형은 하나님께 드리는 요청으로 옮기는 것이 자연스럽고, 앞의 조건절 흐름도 한국어의 연결어미 '-시고'로 살릴 수 있습니다.
