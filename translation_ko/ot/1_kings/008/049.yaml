  text: וְ/שָׁמַעְתָּ֤ הַ/שָּׁמַ֨יִם֙ מְכ֣וֹן שִׁבְתְּ/ךָ֔ אֶת תְּפִלָּתָ֖/ם וְ/אֶת תְּחִנָּתָ֑/ם וְ/עָשִׂ֖יתָ מִשְׁפָּטָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/049.yaml
  text: then hear in heaven[a], the place of your dwelling, their prayer and their plea, and uphold their cause[b],
  footnotes:
  - marker: a
    text: Or 'your dwelling place.' The Hebrew expression emphasizes an established or fixed dwelling.
    reason: lexical_alternative
  - marker: b
    text: Or 'grant them justice' or 'vindicate them.' The Hebrew literally says 'do their justice/judgment,' an idiom for acting on behalf of their legal cause.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 주님께서 거하시는 처소[a]인 하늘에서 그들의 기도와 간구를 들으시고, 그들의 권리를 옹호하여 주십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 거처.’ 히브리어 표현은 확고히 정해진 거처를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들에게 정의를 행하여 주십시오’ 또는 ‘그들을 변호하여 주십시오.’ 히브리어는 문자적으로 ‘그들의 정의/판결을 행하다’이며, 그들의 법적 권리나 송사를 위해 개입한다는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
