  lexicon: HALOT
  rationale: מְכוֹן은 단순한 장소보다 정착된 거처의 뉘앙스를 가지므로, 직역적인 '거하시는 곳'으로 옮겨 고정된 거주처의 느낌을 살렸습니다.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  english_pob_choice: and uphold their cause
  chosen_korean: 그들의 사정을 바로잡아 주십시오
  alternatives_korean:
  - 그들의 권리를 바로 세워 주십시오
  - 그들의 송사를 판결해 주십시오
  - 그들의 정의를 행해 주십시오
  lexicon: HALOT
  rationale: '''do their justice/judgment''라는 관용구는 법정적 맥락에서 그들의 소송과 권리를 바로잡는 뜻이므로, 한국어로는 ''사정을 바로잡아 주십시오''가 의미를 자연스럽게 담습니다.'
theological_decisions:
- issue: 신적 거처 표현의 공간성
  chosen_reading: 하나님이 하늘에 계신다는 성경적 이미지를 유지하되, 하나님이 공간에 갇히신다는 식으로는 만들지 않았습니다.
  alternative_readings:
