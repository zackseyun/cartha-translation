  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁמַעְתָּ֤ הַ/שָּׁמַ֨יִם֙ מְכ֣וֹן שִׁבְתְּ/ךָ֔ אֶת תְּפִלָּתָ֖/ם וְ/אֶת תְּחִנָּתָ֑/ם וְ/עָשִׂ֖יתָ מִשְׁפָּטָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/049.yaml
  text: then hear in heaven[a], the place of your dwelling, their prayer and their plea, and uphold their cause[b],
  footnotes:
  - marker: a
    text: Or 'your dwelling place.' The Hebrew expression emphasizes an established or fixed dwelling.
    reason: lexical_alternative
  - marker: b
    text: Or 'grant them justice' or 'vindicate them.' The Hebrew literally says 'do their justice/judgment,' an idiom for acting on behalf of their legal cause.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 하늘[a], 곧 주님의 거하시는 곳에서 그들의 기도와 그들의 간구를 들으시고, 그들의 사정을 바로잡아 주십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '주님의 거하시는 곳.' 히브리어 표현은 정착된 거처를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그들에게 정의를 행해 주십시오' 또는 '그들의 권리를 변호해 주십시오.' 히브리어는 문자적으로 '그들의 정의/판결을 행하다'이며, 법적 사정을 위해 개입하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  english_pob_choice: then hear
  chosen_korean: 들으시고
  alternatives_korean:
  - 들으십시오
  - 들어 주십시오
  lexicon: HALOT
  rationale: 청원문 맥락에서 2인칭 남성 단수 완료형은 하나님께 드리는 요청으로 옮기는 것이 자연스럽고, 앞의 조건절 흐름도 한국어의 연결어미 '-시고'로 살릴 수 있습니다.
- source_word: הַשָּׁמַיִם
  english_pob_choice: in heaven
  chosen_korean: 하늘
  alternatives_korean:
  - 하늘에서
  - 하늘에
  lexicon: HALOT
  rationale: 히브리어 정관사형은 하나님의 하늘 영역을 가리키므로, 본문 구조를 해치지 않으면서도 간결한 '하늘'로 옮겼습니다.
- source_word: מְכוֹן שִׁבְתְּךָ
  english_pob_choice: the place of your dwelling
  chosen_korean: 주님의 거하시는 곳
  alternatives_korean:
  - 주님의 거처
  - 주님의 거하심의 자리
  - 주님의 거하시는 처소
  lexicon: HALOT
  rationale: מְכוֹן은 단순한 장소보다 정착된 거처의 뉘앙스를 가지므로, 직역적인 '거하시는 곳'으로 옮겨 고정된 거주처의 느낌을 살렸습니다.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  english_pob_choice: and uphold their cause
  chosen_korean: 그들의 사정을 바로잡아 주십시오
  alternatives_korean:
  - 그들의 권리를 바로 세워 주십시오
  - 그들의 송사를 판결해 주십시오
  - 그들의 정의를 행해 주십시오
  lexicon: HALOT
  rationale: '''do their justice/judgment''라는 관용구는 법정적 맥락에서 그들의 소송과 권리를 바로잡는 뜻이므로, 한국어로는 ''사정을 바로잡아 주십시오''가 의미를 자연스럽게 담습니다.'
theological_decisions:
- issue: 신적 거처 표현의 공간성
  chosen_reading: 하나님이 하늘에 계신다는 성경적 이미지를 유지하되, 하나님이 공간에 갇히신다는 식으로는 만들지 않았습니다.
  alternative_readings:
  - 하늘에서 들으시고
  - 하늘에 계신 주님의 거처에서 들으시고
  rationale: 본문은 성전 기도문 특유의 언어로 하나님의 하늘 거처를 말하므로, 이미지를 보존하면서도 신학적으로 과도한 공간 제한 해석을 피했습니다.
  doctrine_reference: 성전 봉헌 기도 문맥에서의 신적 임재 표현
