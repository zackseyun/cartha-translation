  source_fidelity: ‘그들의 사정을 바로잡아 주십시오’는 משפטם을 넓고 다소 모호한 ‘사정’으로 옮겨 법적 권리·송사의 의미를 약화합니다. ‘그들의 권리를 옹호하여 주십시오’는 ‘그들의 정의/판결을 행하다’라는 히브리어 관용구 및 영어 감사본의 ‘uphold their cause’를 더 정확히 반영합니다. 하늘과 하나님의 거처의 관계도 한국어 문장 안에서 더 자연스럽게 밝혔습니다.
  naturalness: 원문의 ‘하늘, 곧 …에서’는 쉼표와 조사 결합이 다소 어색하고, 각주 a가 ‘하늘’에 붙어 있으면서 실제로는 ‘거처’ 표현을 설명해 앵커가 부정확합니다. ‘주님께서 거하시는 처소인 하늘에서’는 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘처소’는 성경 문맥에서 하나님의 dwelling을 자연스럽고 격식 있게 나타냅니다. ‘기도와 간구’는 תפלה와 תחנה의 구별을 보존합니다. ‘권리를 옹호하다’는 משפט의 법적·변호적 의미를 유지하며 특정 교리 해석을 덧붙이지 않습니다.
