  yaml_path: translation/ot/1_kings/008/018.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name, you did well that it was in your heart.’
  footnotes:
  - marker: a
    text: Or 'to build a temple for my name.' The Hebrew literally says 'to build a house for my name.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼께서 내 아버지 다윗에게 말씀하셨습니다. 「내 이름을 위해 집을 짓고자 한 것이 네 마음에 있었으니, 네가 잘하였도다. 그것이 네 마음에 있었기 때문이다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 문자적으로 ‘내 이름을 위해 집을 짓다’라고 말합니다. 여기서는 원문 표현을 살려 ‘집’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md Contested terms
  rationale: 하나님의 고유명을 본문에서 드러내기 위해 프로젝트 기본값대로 ‘야훼’를 사용했습니다.
- source_word: אָבִי
  english_pob_choice: my father
  chosen_korean: 내 아버지
  alternatives_korean:
  - 나의 아버지
  - 우리 아버지
  lexicon: HALOT
  rationale: 1인칭 소유 접미사가 붙은 다윗 지칭을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: לִבְנוֹת בַּיִת
  english_pob_choice: to build a house
  chosen_korean: 집을 짓고자 한
  alternatives_korean:
  - 성전을 짓고자 한
  - 집을 건축하고자 한
  lexicon: HALOT
  rationale: בַּיִת의 직역인 ‘집’을 유지해 원문 표현을 살렸고, 문맥상 성전임은 독자가 알 수 있습니다.
- source_word: לִשְׁמִי
  english_pob_choice: for my name
  chosen_korean: 내 이름을 위해
  alternatives_korean:
  - 내 이름을 위하여
  - 내 이름을 위한
  lexicon: HALOT
  rationale: 이름-임재의 성경적 관용구를 살리되 현대 한국어에서 자연스럽게 들리도록 옮겼습니다.
- source_word: הֱטִיבֹתָ
  english_pob_choice: you did well
  chosen_korean: 네가 잘하였도다
  alternatives_korean:
  - 네가 옳게 하였도다
  - 네가 잘했다
  lexicon: HALOT
  rationale: 승인의 뜻을 분명히 전달하기 위해 ‘잘하였도다’를 택했으며, 인용문 안에서는 구약적 직접화법의 힘을 살렸습니다.
theological_decisions:
- issue: ‘집’과 ‘성전’ 사이의 번역 선택
  chosen_reading: 직역을 따라 ‘집’으로 두되, 문맥상 성전을 가리키는 것으로 읽게 합니다.
  alternative_readings:
  - 의역하여 ‘성전’으로 번역
  - ‘성전 집’처럼 보충
  rationale: 히브리어 본문이 실제로 ‘집’(בַּיִת)을 사용하므로 원문 우선 원칙을 따랐습니다. 문맥상 의미는 충분히 분명합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition'
- issue: 직접화법 안의 종결 표현
  chosen_reading: 야훼의 말씀을 직접 인용할 때 한국어에서 자연스러운 선언형 어조를 사용했습니다.
  alternative_readings:
  - 완전히 중립적인 서술형으로 평탄화
  - 더 강한 성경체 종결로 고어화
  rationale: 본문의 승인과 선언의 어조를 살리되, 합쇼체 본문 안에서 과도하게 고어화하지 않도록 조정했습니다.
  doctrine_reference: 'Target style: modern formal-polite Korean'
