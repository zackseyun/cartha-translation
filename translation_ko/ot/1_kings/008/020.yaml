  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָקֻ֡ם תַּחַת֩ דָּוִ֨ד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/020.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, just as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
  footnotes:
  - marker: a
    text: Or 'has established his word' or 'has carried out his word.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house'; that is, the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 자신이 말씀하신 그 말씀을 이루셨습니다[a]. 나는 내 아버지 다윗의 자리에 이어서 일어나 이스라엘의 왕좌에 앉았으며, 야훼께서 말씀하신 대로 야훼 이스라엘의 하나님을 위하여 그 집을 지었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 말씀을 세우셨다’, ‘그분의 말씀을 실행하셨다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그 집’입니다. 곧 성전입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם יְהוָה אֶת דְּבָרוֹ
  english_pob_choice: And Yahweh has fulfilled his word
  chosen_korean: 야훼께서 자신이 말씀하신 그 말씀을 이루셨습니다
  alternatives_korean:
  - 야훼께서 그분의 말씀을 세우셨습니다
  - 야훼께서 그분의 말씀을 성취하셨습니다
  - 야훼께서 그분의 말씀을 실행하셨습니다
  lexicon: HALOT
  rationale: קום의 히필이 말씀과 함께 쓰일 때는 단순히 ‘세우다’보다 ‘이루다/성취하다’가 문맥상 더 자연스럽고, ‘말씀하신 그 말씀’으로 히브리어의 반복을 살렸습니다.
- source_word: וָאָקֻם תַּחַת דָּוִד אָבִי
  english_pob_choice: I have arisen in the place of David my father
  chosen_korean: 나는 내 아버지 다윗의 자리에 이어서 일어나
  alternatives_korean:
  - 나는 내 아버지 다윗의 자리에 대신하여 일어나
  - 나는 내 아버지 다윗을 이어 일어나
  - 나는 내 아버지 다윗의 뒤를 이어 일어나
  lexicon: HALOT
  rationale: תחת는 왕위 계승의 ‘대신/자리에 이어’라는 뜻을 가지므로, 왕위 계승과 동작의 연계를 드러내는 ‘자리에 이어서’로 옮겼습니다.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  english_pob_choice: and sit on the throne of Israel
  chosen_korean: 이스라엘의 왕좌에 앉았으며
  alternatives_korean:
  - 이스라엘의 왕좌에 앉아 있으며
  - 이스라엘의 보좌에 앉았으며
  - 이스라엘의 왕위에 앉았으며
  lexicon: HALOT
  rationale: כִּסֵּא는 문자적으로 ‘왕좌/보좌’이므로 ‘왕좌’로 옮겨 왕권의 이미지를 분명히 했고, 서술 흐름상 ‘앉았으며’로 이어지게 했습니다.
- source_word: לְשֵׁם יְהוָה
  english_pob_choice: for the name of Yahweh
  chosen_korean: 야훼 이스라엘의 하나님을 위하여
  alternatives_korean:
  - 야훼의 이름을 위하여
  - 야훼의 이름을 위해
  - 야훼 이름을 위해
  lexicon: HALOT
  rationale: 히브리어의 ‘이름을 위하여’는 성전의 봉헌 목적을 가리키므로, 자연스러운 한국어 속에서도 목적성을 유지하도록 ‘위하여’로 처리했습니다.
theological_decisions:
- issue: 야훼의 이름과 ‘이름을 위하여’ 표현을 한국어에서 어떻게 보존할지
  chosen_reading: ‘야훼께서… 그 집을 지었습니다’와 ‘야훼 이스라엘의 하나님을 위하여’로 옮겨, 본문이 말하는 성전의 목적을 유지했습니다.
  alternative_readings:
  - ‘주님의 이름을 위하여’
  - ‘야훼의 이름을 위해’
  rationale: 본문은 단순한 명예 언어가 아니라 성전이 야훼의 이름에 속한 공간임을 말하므로, 관용적 종교어보다 स्रोत의 목적어 구조를 드러내는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
- issue: ‘그 집’의 번역
  chosen_reading: 그 집
  alternative_readings:
  - 성전
  - 집
  rationale: 히브리어 הַבַּיִת를 그대로 살리면 ‘그 집’이지만, 문맥상 성전을 가리키므로 본문은 직역의 틀을 유지하면서도 의미가 드러나게 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
