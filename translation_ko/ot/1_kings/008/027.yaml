  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֚י הַֽ/אֻמְנָ֔ם יֵשֵׁ֥ב אֱלֹהִ֖ים עַל הָ/אָ֑רֶץ הִ֠נֵּה הַ/שָּׁמַ֜יִם וּ/שְׁמֵ֤י הַ/שָּׁמַ֨יִם֙ לֹ֣א יְכַלְכְּל֔וּ/ךָ אַ֕ף כִּֽי הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/027.yaml
  text: For will God indeed dwell on the earth? Behold[a], the heavens, even the highest heavens, cannot contain you[c][b]; how much less this house that I have built!
  footnotes:
  - marker: a
    text: 'Hebrew: ''the heavens and the heaven of heavens,'' an idiom meaning the highest heavens.'
    reason: lexical_alternative
  - marker: b
    text: Or 'cannot hold you.'
    reason: lexical_alternative
  - marker: c
    text: '''This house'' refers to the temple Solomon built.'
    reason: cultural_note
translation:
  language: ko
  text: 하나님께서 과연 땅에 거하실 수 있겠습니까? 보십시오[a], 하늘과 하늘들의 하늘도 주를 담아 두지 못하니[c][b], 내가 지은 이 집이야 얼마나 더 그러하겠습니까!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '하늘들과 하늘들의 하늘'이라는 관용구로, 가장 높은 하늘을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '주를 담을 수 없으니'.
    reason: lexical_alternative
  - marker: c
    text: '''이 집''은 솔로몬이 지은 성전입니다.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי הַאֻמְנָם
  english_pob_choice: For will God indeed
  chosen_korean: 하나님께서 과연
  alternatives_korean:
  - 정말 하나님께서
  - 참으로 하나님께서
  lexicon: HALOT
  rationale: 의문문 속 강한 놀라움과 확신의 어감을 한국어에서는 '과연'으로 살려, 단순한 질문이 아니라 경탄 섞인 수사적 물음을 드러냈습니다.
- source_word: יֵשֵׁב אֱלֹהִים עַל הָאָרֶץ
  english_pob_choice: dwell on the earth
  chosen_korean: 땅에 거하실 수 있겠습니까
  alternatives_korean:
  - 땅에 사시겠습니까
  - 땅 위에 머무르시겠습니까
  lexicon: HALOT
  rationale: 하나님의 임재를 가리키는 문맥이므로 '거하다'를 사용하되, 실제 거처 가능성을 묻는 수사적 뉘앙스를 살려 합쇼체 의문형으로 옮겼습니다.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  english_pob_choice: the heavens, even the highest heavens
  chosen_korean: 하늘과 하늘들의 하늘
  alternatives_korean:
  - 하늘과 가장 높은 하늘
  - 하늘과 하늘의 하늘
  lexicon: HALOT
  rationale: 히브리어의 초월적 최상급 관용구를 직역에 가깝게 살려, 본문의 과장적·시적 강조를 유지했습니다.
- source_word: לֹא יְכַלְכְּלוּךָ
  english_pob_choice: cannot contain you
  chosen_korean: 주를 담아 두지 못하니
  alternatives_korean:
  - 주를 담을 수 없으니
  - 주를 감당하지 못하니
  lexicon: HALOT
  rationale: '''contain''의 핵심인 ''넓이/용량상 담아 두다''는 뜻을 한국어로 자연스럽게 옮기되, 하나님을 공간 안에 가둘 수 없다는 의미를 분명히 했습니다.'
- source_word: הַבַּיִת הַזֶּה אֲשֶׁר בָּנִיתִי
  english_pob_choice: this house that I have built
  chosen_korean: 내가 지은 이 집
  alternatives_korean:
  - 내가 세운 이 집
  - 내가 건축한 이 집
  lexicon: HALOT
  rationale: 성전 문맥의 '집'을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 '지은'을 택했습니다. POB의 문화주석처럼 이는 솔로몬이 지은 성전을 가리킵니다.
theological_decisions:
- issue: 하나님의 초월성과 성전 임재의 긴장
  chosen_reading: 하나님은 땅에 거하실 수 있겠는지 묻되, 동시에 가장 높은 하늘조차 하나님을 담지 못한다고 진술하여 초월성을 보존했습니다.
  alternative_readings:
  - 성전 안에 하나님이 실제로 머무르신다는 뜻으로 완화하는 번역
  - 반대로 단순히 땅에 계시지 않는다는 뜻만 강조하는 번역
  rationale: 본문은 성전의 의미를 부정하지 않으면서도 하나님이 어떤 공간에도 갇히지 않음을 함께 말합니다. 이 긴장을 해소하지 않고 그대로 남겨 두었습니다.
  doctrine_reference: '번역 원칙 §3: 신학적 긴장을 해소하지 말고 보존할 것'
- issue: 직접 호칭의 존칭 처리
  chosen_reading: '''주를''을 사용해 본문 안의 하나님 직접 호칭을 한국어 존칭 체계로 반영했습니다.'
  alternative_readings:
  - 하나님을
  - 주님을
  rationale: 히브리어 2인칭 직접 호칭을 한국어에서 가장 자연스럽고 경건하게 반영하기 위해 '주' 존칭형을 택했습니다.
  doctrine_reference: '한국어 경어 체계: 하나님 직접 호칭은 존칭 동사와 목적격을 함께 사용'
