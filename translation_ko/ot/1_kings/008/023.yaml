source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/023.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven above or on earth beneath[b], keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
  footnotes:
  - marker: a
    text: Or 'in the heavens above and on the earth below.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew hesed, often denoting covenant loyalty, faithful love, or steadfast love.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “야훼, 이스라엘의 하나님이시여, 위 하늘에도 아래 땅에도[a] 주와 같은 하나님은 없습니다. 주께서는 온 마음으로 주 앞에서 걷는 주의 종들을 위하여 언약과 인애를[b] 지키시는 분이십니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘위의 하늘과 아래의 땅에’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 헷세드(hesed)는 흔히 언약적 충성, 신실한 사랑, 변함없는 사랑을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  english_pob_choice: and he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말하였습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 이어 주는 기본 서술형으로, 영어 POB의 ‘and he said’를 한국어 합쇼체로 간결하게 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh, God of Israel
  chosen_korean: 야훼, 이스라엘의 하나님
  alternatives_korean:
  - 여호와, 이스라엘의 하나님
  - 야훼 하나님, 이스라엘의 하나님
  lexicon: HALOT
  rationale: יהוה는 이 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 호칭구는 ‘이스라엘의 하나님’으로 자연스럽게 처리했습니다.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  english_pob_choice: there is no God like you
  chosen_korean: 주와 같은 하나님이 없습니다
  alternatives_korean:
  - 주와 같은 신은 없습니다
  - 주와 같은 하나님이 없으십니다
  lexicon: HALOT
  rationale: 직접 호칭이므로 2인칭 존대 표현을 유지했고, 문맥상 유일성과 비교불가성을 가장 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: שֹׁמֵר הַבְּרִית וְהַחֶסֶד
  english_pob_choice: keeping the covenant and the steadfast love
  chosen_korean: 언약과 인애를 지키시며
  alternatives_korean:
  - 언약과 변함없는 사랑을 지키시며
  - 언약과 신실한 사랑을 지키시며
  lexicon: HALOT
  rationale: חֶסֶד는 영어 POB의 ‘steadfast love’에 맞춰 한국어에서 ‘인애’로 옮겨, 언약적 충성과 자비를 함께 담는 전통적이면서도 문맥에 맞는 표현을 택했습니다.
- source_word: לַעֲבָדֶיךָ
  english_pob_choice: for your servants
  chosen_korean: 주의 종들에게 그러하십니다
  alternatives_korean:
  - 주의 종들을 위하여 그러하십니다
  - 주의 종들에게 베푸십니다
  lexicon: HALOT
  rationale: ‘종’은 bonded status를 전면화하지 않는 이 문맥의 기본값에 맞고, 앞절의 ‘지키시며’와 연결해 은혜의 대상을 분명히 했습니다.
- source_word: הַהֹלְכִים לְפָנֶיךָ בְּכָל לִבָּם
  english_pob_choice: who walk before you with all their heart
  chosen_korean: 온 마음으로 주 앞에서 걷는
  alternatives_korean:
  - 마음을 다해 주 앞에서 걷는
  - 온 마음을 다하여 주 앞에서 행하는
  lexicon: HALOT
  rationale: ‘walk before you’의 성경적 관용구를 살리되, 현대 한국어에서 자연스러운 ‘주 앞에서 걷는’으로 옮겼고, ‘with all their heart’는 ‘온 마음으로’로 응축했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본 프로젝트의 원칙에 따라 신적 고유명은 대체 칭호로 흡수하지 않고 ‘야훼’로 보존하여, 이스라엘 언약 하나님이 직접 호명되고 있음을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: חֶסֶד의 번역
  chosen_reading: 인애
  alternative_readings:
  - 변함없는 사랑
  - 신실한 사랑
  - 자비
  rationale: 언약과 함께 병렬된 חֶסֶד는 단순 감정보다 언약적 충성과 사랑을 함께 포함하므로, 한국어에서 그 긴장을 비교적 잘 보존하는 ‘인애’를 선택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5 (key term consistency with documented exceptions)
