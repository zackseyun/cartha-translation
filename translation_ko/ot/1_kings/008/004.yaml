source:
  edition: WLC
  text: וַֽ/יַּעֲל֞וּ אֶת אֲר֤וֹן יְהוָה֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד וְ/אֶֽת כָּל כְּלֵ֥י הַ/קֹּ֖דֶשׁ אֲשֶׁ֣ר בָּ/אֹ֑הֶל וַ/יַּעֲל֣וּ אֹתָ֔/ם הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/004.yaml
  text: They brought up the ark of Yahweh[a], the tent of meeting, and all the holy vessels that were in the tent[b]; the priests and the Levites brought them up.
  footnotes:
  - marker: a
    text: Or 'carried them up.' The Hebrew verb can denote bringing or carrying upward in procession.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the priests and the Levites.' Some understand this more specifically as the Levitical priesthood, but the Hebrew wording names both groups.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 야훼의 궤와 회막과 회막 안에 있던 모든 거룩한 기구를 올려 옮겼습니다.[a] 제사장들과 레위인들이 그것들을 올려 옮겼습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘올려 운반했습니다’. 히브리어 동사는 행렬 중에 위로 가져가거나 운반하는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘제사장들과 레위인들’이라고 되어 있습니다. 일부는 이를 더 구체적으로 레위계 제사장직으로 이해하지만, 본문은 두 집단을 함께 언급합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  english_pob_choice: They brought up
  chosen_korean: 올려왔습니다
  alternatives_korean:
  - 가져왔습니다
  - 옮겨왔습니다
  - 들어올렸습니다
  lexicon: HALOT
  rationale: עלה의 사역형이 행렬 속에서 ‘위로 올려 옮기다’는 뜻을 가지므로, 산등성이의 예루살렘 성전 맥락을 살린 ‘올려오다’가 가장 자연스럽고 원문 방향성을 잘 드러냅니다.
- source_word: אֲרוֹן יְהוָה
  english_pob_choice: the ark of Yahweh
  chosen_korean: 야훼의 궤
  alternatives_korean:
  - 주님의 궤
  - 야훼의 언약궤
  - 여호와의 궤
  lexicon: HALOT
  rationale: 여기서는 יְהוָה의 고유명을 보존해야 하므로 ‘야훼’를 쓰고, אֲרוֹן은 성전 문맥의 표준어인 ‘궤’로 옮겼습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 만남의 천막
  - 회중의 장막
  lexicon: HALOT
  rationale: 이 결합어는 한국어 성경에서 정착된 성막 명칭인 ‘회막’이 가장 간결하고 식별력이 높으며, 제의 용어로서의 기능도 유지합니다.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  english_pob_choice: all the holy vessels
  chosen_korean: 모든 거룩한 기구
  alternatives_korean:
  - 모든 성물
  - 모든 성스러운 물건
  - 모든 거룩한 그릇
  lexicon: HALOT
  rationale: כְּלִים은 그릇에 한정되지 않는 제의용 ‘기구, 도구, 용품’의 범위를 가지므로, ‘기구’가 의미 범위를 지나치게 좁히지 않습니다.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  english_pob_choice: the priests and the Levites
  chosen_korean: 제사장들과 레위인들
  alternatives_korean:
  - 제사장들과 레위 지파 사람들
  - 제사장들과 레위 사람들
  lexicon: HALOT
  rationale: 히브리어가 두 집단을 병렬로 적시하므로 둘 다 살렸습니다. 한국어에서는 ‘레위인들’이 자연스럽고, 제의 직무 집단을 분명히 드러냅니다.
theological_decisions:
- issue: 여호와/주 번역 여부
  chosen_reading: 이 절의 יְהוָה는 고유명사로 보존하여 ‘야훼’로 번역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 언약 하나님의 이름을 직접 사용하므로 호칭으로 바꾸지 않고, 프로젝트 기본 원칙에 따라 고유명을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘제사장들과 레위인들’의 이중 표기 보존
  chosen_reading: 두 집단을 합치지 않고 본문 표현대로 병렬로 유지했습니다.
  alternative_readings:
  - 레위계 제사장들
  - 레위인 제사장들
  rationale: 원문은 제사장과 레위인을 함께 언급하므로, 다른 본문과의 조화를 위해 이를 하나로 정리하지 않고 긴장을 그대로 보존했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
