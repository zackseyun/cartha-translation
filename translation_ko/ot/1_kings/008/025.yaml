- from: 이제, 야훼, 이스라엘의 하나님이여, 주의 종 다윗, 곧 내 아버지를 위하여 그에게 말씀하신 것을 지켜 주십시오. 이르시기를, ‘이스라엘의 왕좌에 앉을 사람이 내 앞에서 끊어지지 않을 것이다. 다만 네 아들들이 자기 길을 지켜, 내 앞에서 네가 걸은 것처럼 걸어가기만 하면 된다.’ 하셨습니다.[a]
