base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/025.yaml
  text: And now[a], Yahweh, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man shall not be cut off from before me for you, one sitting on the throne of Israel, if only your sons keep their way, by walking before me as you have walked before me.’
  footnotes:
  - marker: a
    text: Or, more idiomatically, “You shall not lack a man before me to sit on the throne of Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 야훼, 이스라엘의 하나님이여, 주의 종 다윗, 곧 제 아버지를 위하여 그에게 말씀하신 것을 지켜 주십시오. 이르시기를, ‘내 앞에서 이스라엘의 왕좌에 앉을 사람이 네게서 끊어지지 않을 것입니다.[a] 오직 네 아들들이 자기들의 길을 지켜, 네가 내 앞에서 걸었던 것처럼 내 앞에서 걸을 때에만 그러할 것입니다.’ 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 관용적으로는 “네게는 내 앞에서 이스라엘의 왕좌에 앉을 사람이 부족하지 않을 것입니다”입니다.
    reason: 히브리어 ‘사람이 네게서 내 앞에서 끊어지지 않을 것이다’는 다윗 계통에서 이스라엘 왕좌에 앉을 이가 계속 있을 것이라는 관용적 표현입니다.
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 공동체적 호칭인 ‘주님’으로 대체하지 않고, 원문 고유명사 יְהוָה를 한국어 음역 ‘야훼’로 옮겨 신적 이름 자체를 보존했습니다.
- source_word: שְׁמֹר
  english_pob_choice: keep
  chosen_korean: 지켜 주십시오
  alternatives_korean:
  - 지키십시오
  - 보존해 주십시오
  - 이행해 주십시오
  lexicon: HALOT
  rationale: 기도문에서 ‘keep’은 약속을 지켜 이루어 달라는 청원의 뜻이므로, 한국어에서도 관계적·간구적 뉘앙스가 살아 있는 ‘지켜 주십시오’로 옮겼습니다.
- source_word: לְעַבְדְּךָ
  english_pob_choice: for your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 당신의 종
  lexicon: HALOT
  rationale: 여기서는 왕의 겸손한 기도 표현으로서 ‘종’이 자연스럽고, 본문이 신분적 노예성을 강조하지 않으므로 ‘노예’는 피했습니다.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מִלְּפָנַי יֹשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  english_pob_choice: A man shall not be cut off from before me for you, one sitting on the throne of Israel
  chosen_korean: 이스라엘의 왕좌에 앉을 사람이 내 앞에서 끊어지지 않을 것이다
  alternatives_korean:
  - 이스라엘의 왕좌에 앉을 사람이 내 앞에서 끊겨 없어지지 않을 것이다
  - 내 앞에서 이스라엘의 왕좌에 앉을 사람이 끊어지지 않을 것이다
  lexicon: HALOT
  rationale: כרת의 핵심 이미지를 살려 ‘끊어지다’로 옮겼고, 이어지는 분사구는 한국어에서 자연스럽게 ‘왕좌에 앉을 사람’으로 정리해 왕조 계승의 의미를 드러냈습니다.
- source_word: לָלֶכֶת לְפָנַי כַּאֲשֶׁר הָלַכְתָּ לְפָנָי
  english_pob_choice: by walking before me as you have walked before me
  chosen_korean: 내 앞에서 네가 걸은 것처럼 걸어가기만 하면 된다
  alternatives_korean:
  - 내 앞에서 걸어가기만 하면 된다, 네가 걸은 것처럼
  - 내 앞에서 네가 걸은 것처럼 걸어가면 된다
  lexicon: HALOT
  rationale: 인칭과 비교 구조를 살리되 한국어 문맥에서는 ‘walking before me’의 반복을 매끄럽게 풀어, 과거의 다윗 행위를 기준으로 한 행위 요구가 분명히 드러나도록 했습니다.
theological_decisions:
- issue: 다윗 언약의 조건성 표현
  chosen_reading: 왕조 지속의 약속을 유지하되, 아들들의 순종에 대한 명시적 조건을 함께 보존했습니다.
  alternative_readings:
  - 조건을 약화시켜 절대적 약속처럼 표현하기
  - 조건절을 별도 주석으로만 처리하기
  rationale: 히브리어 본문은 ‘다만 … 하면’이라는 조건을 분명히 제시하므로, 신학적 긴장을 해소하지 않고 본문이 말하는 범위 안에서 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 본문의 조건과 약속의 긴장을 보존한다.
