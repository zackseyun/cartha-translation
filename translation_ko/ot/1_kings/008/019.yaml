revisions:
- from: 그러나 당신은 그 집을 건축하지 못합니다. 오직 당신의 몸에서 나온 당신의 아들이 그 집을 내 이름을 위하여 건축할 것입니다.[a]
  to: 그러나 당신은 그 집을 건축하지 않을 것입니다. 오히려 당신의 몸에서 나올[a] 아들이 그 집을 내 이름을 위하여 건축할 것입니다.
  rationale: 부정 미래 선언을 ‘건축하지 않을 것입니다’로 바로잡고, 장차 태어날 아들을 가리키는 혈통 표현을 자연스러운 현대 한국어로 다듬었습니다. ‘집’과 ‘내 이름을 위하여’는 원문의 표현을 유지했으며, 각주 표지를 설명 대상 어구에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:45:13Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 대조(רַק/כִּי אִם), ‘집’의 반복, 아들의 혈통적 출처, 그리고 ‘내 이름을 위하여’라는 목적 표현은 초안에서 대체로 잘 보존되었습니다. 다만 לֹא תִבְנֶה는 신적 선언으로서 ‘건축하지 못합니다’보다 ‘건축하지 않을 것입니다’가 더 직접적이며, ‘못하다’가 불필요하게 능력·불가능의 뉘앙스를 더합니다. הוּא의 강조는 아들을 명시적 주어로 둠으로써 한국어에서 충분히 전달됩니다.
  naturalness: ‘당신의 몸에서 나온 당신의 아들’은 ‘당신의’가 중복되고, 이미 태어난 아들을 가리키는 듯한 어감을 줄 수 있습니다. 문맥상 미래의 아들을 가리키므로 ‘당신의 몸에서 나올 아들’이 자연스럽고 정확합니다. 또한 각주 표지는 해당 관용구 바로 뒤에 두어야 합니다.
  terminology: ‘그 집’은 בַּיִת의 반복을 충실히 보존하며 ‘성전’으로 해석하지 않은 점이 적절합니다. ‘내 이름을 위하여’도 לִשְׁמִי를 충실히 반영합니다. כִּי אִם의 대조는 ‘오히려’로 명료하게 옮길 수 있습니다.
  issues:
  - severity: medium
    issue: ‘건축하지 못합니다’가 부정 선언에 능력·불가능의 뉘앙스를 더합니다.
    rationale: לֹא תִבְנֶה는 문맥상 다윗이 건축자가 되지 않을 것이라는 신적 선언입니다. ‘건축하지 않을 것입니다’는 원문의 미래적 선언성과 해석상 열려 있는 결을 더 잘 유지합니다.
  - severity: medium
    issue: ‘당신의 몸에서 나온 당신의 아들’은 중복적이고 시제·상 면에서 부자연스럽습니다.
    rationale: הַיֹּצֵא מֵחֲלָצֶיךָ는 문맥상 장차 다윗에게서 나올 아들을 특정합니다. ‘당신의 몸에서 나올 아들’이 현대 한국어로 자연스럽고 원문의 혈통 표현을 보존합니다.
  - severity: low
