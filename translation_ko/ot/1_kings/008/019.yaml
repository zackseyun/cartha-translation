translation:
  language: ko
  text: 그러나 당신은 그 집을 건축하지 않을 것입니다. 오히려 당신의 몸에서 나올[a] 아들이 그 집을 내 이름을 위하여 건축할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 허리에서 나오는 자’로, 당신의 친생 자녀를 뜻하는 관용구입니다.
    reason: lexical_alternative
