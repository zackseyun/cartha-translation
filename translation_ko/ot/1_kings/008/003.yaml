base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/003.yaml
  text: And all the elders of Israel came[b][a], and the priests carried the ark.
  footnotes:
  - marker: a
    text: Or, more literally, 'lifted up' or 'bore' the ark.
    reason: lexical_alternative
  - marker: b
    text: That is, the ark of the covenant; the fuller title is not stated in this verse but is clear from the surrounding context.
