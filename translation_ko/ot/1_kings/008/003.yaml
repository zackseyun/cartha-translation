translation:
  language: ko
  text: 그때 이스라엘의 모든 장로가 왔고, 제사장들은 언약궤를 메었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 기본 뜻은 ‘들다, 메다, 운반하다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 궤는 문맥상 언약궤를 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹאוּ
  english_pob_choice: came
  chosen_korean: 왔고
  alternatives_korean:
  - 도착했고
  - 들어왔고
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 פשוט한 완료형 동사로, 한국어에서는 자연스럽게 ‘왔고’가 가장 간결하고 무리 없습니다.
- source_word: כֹּל זִקְנֵי יִשְׂרָאֵל
  english_pob_choice: the elders of Israel
  chosen_korean: 이스라엘의 모든 장로
  alternatives_korean:
  - 이스라엘의 모든 원로
  - 이스라엘의 모든 장로들
  lexicon: HALOT
  rationale: ‘장로’가 공동체 지도층을 가리키는 기본 대응어이며, כֹּל의 전체성을 살리기 위해 ‘모든’을 붙였습니다.
- source_word: וַיִּשְׂאוּ
  english_pob_choice: carried
  chosen_korean: 메었습니다
  alternatives_korean:
  - 들었습니다
  - 운반했습니다
  - 짊어졌습니다
  lexicon: HALOT
  rationale: 언약궤를 어깨에 메어 옮기는 구체적 행위를 드러내면서도, ‘들다’보다 운송 행위가 분명해지도록 ‘메다’를 택했습니다.
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들은
  alternatives_korean:
  - 사제들은
  - 그 제사장들은
  lexicon: HALOT
  rationale: 구약 제의 맥락에서 표준적인 한국어 대응은 ‘제사장’이며, 주어 표지를 자연스럽게 위해 조사 ‘-들은’을 붙였습니다.
- source_word: הָאָרוֹן
  english_pob_choice: the ark
  chosen_korean: 언약궤
  alternatives_korean:
  - 궤
  - 궤짝
  lexicon: HALOT
  rationale: 본문에는 단순히 ‘궤’라 되어 있지만, 문맥상 성막/성전의 언약궤를 가리키므로 한국어 독자의 이해를 위해 전통적이지만 본문 일치하는 ‘언약궤’를 사용했습니다.
theological_decisions:
- issue: ‘ark’의 구체적 지시 대상
  chosen_reading: 본문의 ‘궤’는 문맥상 언약궤를 가리키므로 한국어 본문에서는 ‘언약궤’로 풀어 썼습니다.
  alternative_readings:
  - ‘궤’로 직역해 문맥에서만 식별하게 함
  - ‘법궤’로 옮김
  rationale: 열왕기상 8장의 문맥은 성전 안으로 옮겨지는 야훼의 언약궤를 전제로 하므로, 한국어 독자에게 지시 대상을 즉시 분명하게 하는 것이 적절합니다.
  doctrine_reference: 출애굽기 25장; 열왕기상 8장 문맥
