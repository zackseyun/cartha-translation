  text: for they will hear of your great name[a], and of your mighty hand and your outstretched arm, and he will come and pray toward this house—
  footnotes:
  - marker: a
    text: Hebrew shifts from plural ('they will hear') to singular ('he will come and pray'), likely moving from foreigners in general to the representative individual foreigner.
