translation:
  language: ko
  text: 이는 그들이 주의 크신 이름과 강한 손과 펼쳐진 팔에 대하여 듣게 될 것이고, 그가 와서 이 집을 향하여 기도할 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그들이 들을 것’에서 ‘그가 와서 기도할 것’으로 복수에서 단수로 전환합니다. 일반적인 이방인들을 말하다가 대표적인 한 이방인에게 초점을 옮기는 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: for
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …이므로
  lexicon: HALOT
  rationale: 앞 문장의 이유를 제시하는 קשר사를 한국어 원인·설명 표현으로 자연스럽게 옮기되, 문맥상 설명적 연결을 분명히 했습니다.
- source_word: אֶת שִׁמְךָ הַגָּדוֹל
  english_pob_choice: of your great name
  chosen_korean: 주의 위대한 이름
  alternatives_korean:
  - 주의 큰 이름
  - 주의 크신 이름
  lexicon: HALOT
  rationale: ‘이름’은 단순 호칭이 아니라 명성/계시된 위엄을 포함하므로, 이를 유지하면서 ‘great’를 ‘위대한’으로 옮겨 원문의 위엄을 살렸습니다.
- source_word: יָדְךָ הַחֲזָקָה וּזְרֹעֲךָ הַנְּטוּיָה
  english_pob_choice: your mighty hand ... your outstretched arm
  chosen_korean: 주의 강한 손과 주의 뻗으신 팔
  alternatives_korean:
  - 주의 능한 손과 주의 펼치신 팔
  - 주의 힘 있는 손과 주의 뻗어진 팔
  lexicon: HALOT
  rationale: 하나님의 능력을 가리키는 구체적 신체 은유를 추상화하지 않고 유지했습니다. ‘강한 손’과 ‘뻗으신 팔’이 한국어에서도 관용성과 직설성을 함께 확보합니다.
- source_word: וּבָא וְהִתְפַּלֵּל
  english_pob_choice: and he will come and pray
  chosen_korean: 그가 와서 … 기도할 것이며
  alternatives_korean:
  - 그가 와서 … 기도하며
  - 그가 와서 … 기도할 것입니다
  lexicon: HALOT
  rationale: 히브리어의 단수 전환을 보존하기 위해 ‘그가’로 표기했고, ‘기도하다’는 예배·성전 맥락에서 자연스럽지만 원문의 동사를 직접적으로 반영합니다.
theological_decisions:
- issue: 인격적 신체 은유를 추상명사로 바꾸지 않을지
  chosen_reading: ‘손’과 ‘팔’을 문자적으로 유지했습니다.
  alternative_readings:
  - 권능
  - 능력
  - 힘
  rationale: 본문은 하나님의 역사와 구원을 가리키는 전형적 OT 이미지이므로, 이를 추상화하면 수사적·신학적 힘이 약해집니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 복수에서 단수로의 전환
  chosen_reading: ‘그들이 들을 것이며… 그가 와서’라는 히브리어 전환을 유지했습니다.
  alternative_readings:
  - ‘그들이 듣고 와서 기도할 것이며’로 평준화
  rationale: 열방 일반을 말하다가 대표적 이방인의 기도로 좁혀지는 긴장을 보존하는 편이 원문에 더 투명합니다.
  doctrine_reference: Translation philosophy §3
