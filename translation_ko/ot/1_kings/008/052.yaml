source:
  edition: WLC
  text: לִ/הְי֨וֹת עֵינֶ֤י/ךָ פְתֻחוֹת֙ אֶל תְּחִנַּ֣ת עַבְדְּ/ךָ֔ וְ/אֶל תְּחִנַּ֖ת עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל לִ/שְׁמֹ֣עַ אֲלֵי/הֶ֔ם בְּ/כֹ֖ל קָרְאָ֥/ם אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/052.yaml
  text: that your eyes may be open to the plea of your servant and to the plea of your people Israel[b][a], to listen to them whenever they call to you.
  footnotes:
  - marker: a
    text: Or 'supplication' for 'plea.' The Hebrew term denotes an earnest request for favor or mercy.
    reason: lexical_alternative
  - marker: b
    text: Or 'to hear them.' The Hebrew verb can mean 'hear,' 'listen to,' or 'heed,' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 눈이 주님의 종과 주님의 백성 이스라엘의 간구[a]를 향해 열려 있어, 그들이 주님께 부를 때마다 그들의 말을 들어 주시기를[b] 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תְּחִנָּה는 단순한 ‘기도’보다 은혜와 자비를 구하는 간절한 요청을 뜻하므로, 여기서는 ‘간구’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 שׁמע는 문맥에 따라 ‘듣다’, ‘주의 깊게 듣다’, ‘들어 주다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֶיךָ פְתֻחוֹת
  english_pob_choice: your eyes may be open
  chosen_korean: 주님의 눈이 … 열려 있게 하셔서
  alternatives_korean:
  - 주님의 눈이 열려 있으셔서
  - 주님의 눈이 열려 있게 되어서
  lexicon: HALOT
  rationale: 하나님의 응답적 주의를 가리키는 신체 비유를 한국어에서도 그대로 살리되, 현대 합쇼체 문장에 맞게 목적/바람의 뉘앙스를 자연스럽게 옮겼습니다.
- source_word: תְּחִנַּת
  english_pob_choice: plea
  chosen_korean: 간구
  alternatives_korean:
  - 애원
  - 부르짖음
  - 간청
  lexicon: HALOT
  rationale: תְּחִנָּה는 은혜와 자비를 구하는 간절한 요청이므로, 교회적 상투어보다도 청원성·긴급성을 유지하는 ‘간구’가 가장 적절합니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 주의 섬기는 자
  lexicon: HALOT
  rationale: 여기서는 솔로몬의 왕실-기도적 자기 호칭이므로 ‘종’이 자연스럽고, 본문이 노예 신분을 강조하는 맥락은 아닙니다.
- source_word: לִשְׁמֹעַ אֲלֵיהֶם
  english_pob_choice: to listen to them
  chosen_korean: 그들의 말을 들어 주시기를
  alternatives_korean:
  - 그들을 들어 주시기를
  - 그들에게 귀 기울이시기를
  lexicon: HALOT
  rationale: שׁמע의 ‘듣다/주의 깊게 듣다’ 의미를 살리면서, 한국어에서 청원의 응답을 분명히 하는 ‘~의 말을 들어 주시다’로 옮겼습니다.
- source_word: בְּכֹל קָרְאָם אֵלֶיךָ
  english_pob_choice: whenever they call to you
  chosen_korean: 그들이 주님께 부를 때마다
  alternatives_korean:
  - 그들이 주님을 부를 때마다
  - 그들이 주님께 부르짖을 때마다
  lexicon: HALOT
  rationale: בְּכֹל은 반복적 시간 의미를 띠므로 ‘~할 때마다’로 옮겼고, קרא의 기도적 용법은 ‘부르다’로 충분히 전달됩니다.
theological_decisions:
- issue: 하나님의 ‘눈’에 대한 인격적·비유적 표현
  chosen_reading: 본래의 인체 비유를 유지해, 하나님의 attentive presence를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘주의 주의가 그들에게 미치게 하셔서’처럼 비유를 완화함
  rationale: 히브리어 본문은 하나님의 몸을 말하려는 것이 아니라 기도의 응답과 관심을 생생하게 묘사하므로, 은유를 보존하는 편이 원문 의도를 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
