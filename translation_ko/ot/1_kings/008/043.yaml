reference: 1 Kings 8:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַתָּ֞ה תִּשְׁמַ֤ע הַ/שָּׁמַ֨יִם֙ מְכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ/ן֩ כָּל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/043.yaml
  text: may you hear in heaven[a], the place where you dwell, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name, to fear you as your people Israel do[b], and to know that your name is called on this house that I have built.
  footnotes:
  - marker: a
    text: Or 'calls on you for' or 'cries out to you for.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'your name is called upon this house,' an idiom meaning the house belongs to you or bears your name.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 하늘, 곧 주께서 거하시는 곳에서 들으시고, 나그네가 주께 부르짖는 모든 것에 따라 행하여 주십시오. 그리하여 땅의 모든 민족이 주의 이름을 알게 하시고, 주의 백성 이스라엘이 하듯이 주를 경외하게 하시며, 또 주의 이름이 제가 세운 이 집 위에 불려 있음을 알게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나그네’는 כאן의 נכרי를 자연스럽게 풀어 옮긴 것으로, 단순한 ‘낯선 사람’보다 이방 출신 방문자를 더 잘 드러냅니다.
    reason: cultural_note
  - marker: b
    text: ‘주의 이름이 … 위에 불려 있음을’은 히브리어 관용구로, 이 집이 주께 속하고 주의 이름과 연결되어 있음을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ
  english_pob_choice: in heaven, the place where you dwell
  chosen_korean: 하늘, 곧 주께서 거하시는 곳에서
  alternatives_korean:
  - 하늘, 곧 주의 거처에서
  - 하늘, 주께서 사시는 곳에서
  lexicon: HALOT
  rationale: ‘하늘’과 ‘주께서 거하시는 곳’의 병렬을 살려 하나님의 초월적 거처를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: יִקְרָא אֵלֶיךָ הַנָּכְרִי
  english_pob_choice: the foreigner calls to you for
  chosen_korean: 나그네가 주께 부르짖는 모든 것에 따라
  alternatives_korean:
  - 외국인이 주께 호소하는 모든 것에 따라
  - 낯선 사람이 주께 부르짖는 모든 것에 따라
  lexicon: HALOT
  rationale: נכרי는 단순한 ‘낯선 사람’보다 이방 출신의 ‘외국인/나그네’에 가깝고, קרא אל은 간구의 뉘앙스를 살려 ‘부르짖다’로 옮겼습니다.
- source_word: כִּי שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  english_pob_choice: that your name is called on this house
  chosen_korean: 주의 이름이 제가 세운 이 집 위에 불려 있음을
  alternatives_korean:
  - 주의 이름이 이 집에 불려 있음을
  - 이 집이 주의 이름으로 불림을
  lexicon: HALOT
  rationale: נקרא על의 관용구를 보존하면서, 성전이 주께 속하고 주의 이름과 연결된다는 뜻을 한국어에서 드러내기 위해 ‘위에 불려 있음을’으로 옮겼습니다.
- source_word: יִרְאָה אֹתְךָ
  english_pob_choice: to fear you
  chosen_korean: 주를 경외하게 하시며
  alternatives_korean:
  - 주를 두려워하게 하시며
  - 주를 경외하도록 하시며
  lexicon: HALOT
  rationale: 여기서는 언약적 응답으로서의 두려움과 경외를 함께 담아야 하므로, 지나치게 약화된 ‘존경’보다 ‘경외’가 적절합니다.
theological_decisions:
- issue: ‘주의 이름이 불려 있다’는 성전 소유/귀속의 관용구
  chosen_reading: 이 집 위에 불려 있음을
  alternative_readings:
  - 이 집이 주의 이름을 지닌 것을
  - 이 집이 주의 이름으로 불리는 것을
  rationale: 히브리어 관용구를 풀어 쓰기보다 보존함으로써, 성전이 주의 소유이며 주의 이름과 연결된다는 신학적 긴장을 유지했습니다.
  doctrine_reference: 성전 귀속과 하나님의 이름의 임재 표지
- issue: ‘주를 경외하다’의 번역
  chosen_reading: 주를 경외하게 하시며
  alternative_readings:
  - 주를 두려워하게 하시며
  - 주를 공경하게 하시며
  rationale: 본문은 이방 민족이 이스라엘의 언약적 반응과 같은 방식으로 하나님을 알게 되는 것을 말하므로, ‘경외’가 두려움과 예배적 존중을 함께 살립니다.
  doctrine_reference: 하나님을 향한 언약적 경외
