  naturalness: 초안의 ‘주의 이름이 제가 세운 이 집 위에 불려 있음을’은 수식 범위와 어순이 다소 무겁고, 두 각주 표지가 문장 끝에 함께 놓여 각각의 선행 표현이 불명확합니다. 본문 내 해당 어구 뒤에 각주를 배치하고 문장 흐름을 다듬었습니다. 기도문의 합쇼체와 청원법은 유지했습니다.
