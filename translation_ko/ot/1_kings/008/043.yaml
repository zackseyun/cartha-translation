- from: 주께서는 하늘, 곧 주께서 거하시는 곳에서 들으시고, 나그네가 주께 부르짖는 모든 것에 따라 행하여 주십시오. 그리하여 땅의 모든 민족이 주의 이름을 알게 하시고, 주의 백성 이스라엘이 하듯이 주를 경외하게 하시며, 또 주의 이름이 제가 세운 이 집 위에 불려 있음을 알게 하십시오.[a][b]
  to: 주께서는 하늘, 곧 주께서 거하시는 곳에서 들으시고, 그 이방인[a]이 주께 부르짖어 구하는 모든 것대로 행하여 주십시오. 그리하여 땅의 모든 민족이 주의 이름을 알고, 주의 백성 이스라엘처럼 주를 경외하며, 이 집 위에 주의 이름이 불려 있음을[b] 알게 하십시오. 이 집은 제가 세웠습니다.
  rationale: 원문의 청원 구조와 목적 절을 보존하면서, הַנָּכְרִי의 의미를 더 정확히 반영하고, 간구의 대상(‘구하는 모든 것’)을 자연스럽게 드러냈습니다. 성전 위에 하나님의 이름이 ‘불린다’는 관용구는 본문에서 유지하되, 어순과 각주 위치를 바로잡아 현대 표준 한국어의 명료성을 높였습니다. 마지막 ‘이 집은 제가 세웠습니다’는 אֲשֶׁר בָּנִיתִי의 관계절을 독립 문장으로 풀어, ‘이 집 위에’가 ‘세웠다’에 걸리는 오독을 피하면서 원문의 정보를 빠뜨리지 않았습니다.
