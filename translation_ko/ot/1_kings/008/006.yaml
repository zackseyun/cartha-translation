source:
  edition: WLC
  text: וַ/יָּבִ֣אוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/006.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place[b], under the wings of the cherubim.
  footnotes:
  - marker: a
    text: Or 'the Holy of Holies.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house'; here referring to the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 제사장들이 여호와의 언약궤를 그 자리에, 곧 집의 안쪽 성소인 지성소, 그룹들의 날개 아래로 가져왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지성소’는 문자적으로는 ‘가장 거룩한 곳’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘집’이지만, 여기서는 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  english_pob_choice: Then ... brought
  chosen_korean: 가져왔습니다
  alternatives_korean:
  - 들여왔습니다
  - 옮겨왔습니다
  lexicon: HALOT
  rationale: 서사적 wayyiqtol의 진행을 자연스럽게 살리되, 언약궤를 성소 안으로 이동시키는 문맥에 맞게 ‘가져왔습니다’로 옮겼습니다.
- source_word: אֲרוֹן בְּרִית יְהוָה
  english_pob_choice: the ark of the covenant of Yahweh
  chosen_korean: 여호와의 언약궤
  alternatives_korean:
  - 여호와의 언약 궤
  - 여호와와 맺은 언약의 궤
  lexicon: HALOT
  rationale: ‘언약궤’는 한국어 성경에서 정착된 복합 명사이며, 소유 관계는 속격으로 간결하게 반영했습니다.
- source_word: דְּבִיר הַבַּיִת
  english_pob_choice: the inner sanctuary of the house
  chosen_korean: 집의 안쪽 성소
  alternatives_korean:
  - 집의 내실
  - 성전의 안쪽 성소
  lexicon: HALOT
  rationale: דְּבִיר는 성전의 가장 안쪽 공간이므로 ‘안쪽 성소’로 풀어, POB의 ‘inner sanctuary’ 의미를 한국어로 투명하게 전달했습니다.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  english_pob_choice: the Most Holy Place
  chosen_korean: 지성소
  alternatives_korean:
  - 가장 거룩한 곳
  - 지극히 거룩한 곳
  lexicon: HALOT
  rationale: 이 관용구는 한국어 성경에서 널리 쓰이는 ‘지성소’로 옮기되, 앞의 ‘안쪽 성소’와 함께 의미를 분명히 했습니다.
- source_word: כַּנְפֵי הַכְּרוּבִים
  english_pob_choice: the wings of the cherubim
  chosen_korean: 그룹들의 날개
  alternatives_korean:
  - 그룹의 날개
  - 천사들의 날개
  lexicon: HALOT
  rationale: כְּרוּבִים는 성전 문맥의 고유한 천상 존재를 가리키므로 관습적 음역 ‘그룹들’을 유지하고, 문자적 의미인 ‘날개’를 살렸습니다.
theological_decisions:
- issue: יהוה(YHWH)의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 제공된 영어 POB가 Yahweh를 따르지만, 본문 전체의 한국어 독자성과 일관성을 고려해 한국 교회에서 널리 인식되는 고유명 ‘여호와’를 사용했습니다.
  doctrine_reference: POB YHWH rendering policy
