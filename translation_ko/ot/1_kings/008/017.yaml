base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/017.yaml
  text: Now it was in the heart of David my father to build a house for the name of Yahweh[a], the God of Israel.
  footnotes:
  - marker: a
    text: Or 'to build a temple for the name of the LORD.' The Hebrew literally says 'to build a house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제 아버지 다윗은 이스라엘의 하나님 야훼의 이름을 위하여 집[a]을 짓고자 하는 뜻을 마음에 품고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전’. 히브리어는 문자적으로 ‘집’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Now it was
  chosen_korean: 이제 … 있었습니다
  alternatives_korean:
  - 그리고 … 있었습니다
  - 그때 … 있었습니다
  lexicon: HALOT
  rationale: wayyiqtol היה는 단순 사건 진행보다 상태 진술의 도입으로 기능하므로, 한국어에서는 자연스러운 서술 전환인 "이제"와 과거형으로 옮겼습니다.
- source_word: עִם לְבַב
  english_pob_choice: in the heart of
  chosen_korean: 마음에
  alternatives_korean:
  - 마음속에
  - 뜻으로
  - 마음에 품고
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순 의도보다 마음 안에 자리한 계획을 가리키므로, 본문의 심상은 살리되 한국어에서는 "마음에"로 간결하게 옮겼습니다.
- source_word: בַּיִת
  english_pob_choice: a house
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 건물
  lexicon: HALOT
  rationale: 본문은 해석어인 "성전"이 아니라 문자적으로 "집"을 사용하므로, 성전 의미를 이해하되 원문 이미지를 보존하는 쪽을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 하나님의 고유명사 יְהוָה는 번역어 대치보다 음역이 원문 식별성을 더 잘 보존하므로, 프로젝트 기본값에 따라 "야훼"로 옮겼습니다.
theological_decisions:
- issue: '''집''과 ''성전'' 중 어느 의미를 본문에서 전면화할지'
  chosen_reading: 본문의 표면 의미를 따라 '집'을 유지했습니다.
  alternative_readings:
  - 성전
  - 전
  rationale: 열왕기상 8:17은 성전 건축을 가리키지만, 히브리어는 의도적으로 "집"을 사용합니다. 이 표현을 유지해야 성전이 '야훼의 집'이라는 신학적 이미지를 드러낼 수 있습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 5
- issue: 야훼와 이스라엘의 하나님을 병렬로 제시하는 방식
  chosen_reading: '"야훼, 곧 이스라엘의 하나님"으로 옮겼습니다.'
  alternative_readings:
  - 야훼, 이스라엘의 하나님
  - 이스라엘의 하나님 야훼
  rationale: 원문의 병치 관계를 한국어에서 자연스럽게 드러내기 위해 동격 설명구로 처리했습니다. 이는 고유명사와 언약적 칭호를 함께 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
