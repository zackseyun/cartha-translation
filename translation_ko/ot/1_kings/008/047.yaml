base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/047.yaml
  text: and if they come to their senses in the land where they were taken captive, and return and plead with you in the land of those who took them captive, saying, ‘We have sinned and acted perversely; we have acted wickedly,’
translation:
  language: ko
  text: 또 그들이 포로로 끌려간 땅에서 정신을 차리고[a], 돌아와 그들을 사로잡아 간 자들의 땅에서 당신께 간구하며, ‘우리가 죄를 지었고 패역하게 행했으며, 악을 행했습니다’[b]라고 말한다면,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정신을 차리고’는 문자적으로 ‘마음에 되돌려 놓고’라는 뜻의 관용구이며, 자신의 처지와 잘못을 깊이 생각한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘죄를 짓다, 그릇되게 행하다, 악하게 행하다’라는 세 동사를 나열하여 고백을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל לִבָּם
  english_pob_choice: come to their senses
  chosen_korean: 정신을 차리고
  alternatives_korean:
  - 마음을 돌이키고
  - 제정신을 차리고
  lexicon: שׁוּב / לֵב
  rationale: 문맥상 단순한 인지 회복이 아니라 포로 상태에서 자신들의 처지를 깨닫는 내적 각성을 가리키므로, POB의 의미를 살려 자연스러운 한국어로 옮겼습니다.
- source_word: וְשָׁבוּ
  english_pob_choice: return
  chosen_korean: 돌아와
  alternatives_korean:
  - 되돌아가
  - 회개하고
  lexicon: שׁוּב
  rationale: 동사가 앞 절의 ‘정신을 차리고’와 구별되어 실제적인 복귀 동작을 가리키므로, ‘회개하고’로 의미를 덧씌우지 않고 기본적인 ‘돌아오다’로 번역했습니다.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  english_pob_choice: plead with you
  chosen_korean: 당신께 간구하며
  alternatives_korean:
  - 당신께 애원하며
  - 당신께 부르짖으며
  lexicon: חנן
  rationale: 하나님께 드리는 간청의 뉘앙스를 살리되, 과도하게 감정적이거나 반복적인 표현은 피해서 본문의 정중한 탄원을 전달했습니다.
- source_word: חָטָאנוּ וְהֶעֱוִינוּ רָשָׁעְנוּ
  english_pob_choice: We have sinned and acted perversely; we have acted wickedly
  chosen_korean: 우리가 죄를 지었고 패역하게 행했으며, 악을 행했습니다
  alternatives_korean:
  - 우리가 죄를 범했고 굽게 행했으며, 사악하게 행했습니다
  - 우리가 죄를 지었고 비뚤어졌으며, 악하게 행했습니다
  lexicon: חטא / עוה / רשע
  rationale: 세 개의 동사적 고백을 한국어에서 서로 겹치지 않게 살려, 죄책의 고백이 점층적으로 진행되는 구조를 유지했습니다.
theological_decisions:
- issue: 포로지에서의 회복이 단순한 감정 변화가 아니라 하나님께 향하는 실제적 전환을 포함하는지
  chosen_reading: ‘정신을 차리고’와 ‘돌아와’의 이중 구조로, 내적 각성과 실제 귀환을 함께 드러냈습니다.
  alternative_readings:
  - ‘회개하고 돌아와’로 도덕적 전환을 전면화하는 읽기
  - ‘자각하고’로 인지적 측면만 강조하는 읽기
  rationale: 히브리어는 마음의 깨달음과 행동의 복귀를 나란히 놓으므로, 둘 중 하나로 축소하지 않고 두 요소를 모두 보존했습니다.
  doctrine_reference: 신 30:1-3; 왕상 8:33-34
