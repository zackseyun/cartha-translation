  text: and if they come to their senses in the land where they were taken captive, and return and plead with you in the land of those who took them captive, saying, ‘We have sinned and acted perversely; we have acted wickedly,’
translation:
  language: ko
  text: 그리고 그들이 포로로 끌려간 땅에서 정신을 차리고, 그들을 사로잡아 간 자들의 땅에서 돌아와 당신께 간구하며, ‘우리가 죄를 지었고 패역하게 행했으며, 악을 행했습니다’라고 말한다면[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정신을 차리고’는 문자적으로는 ‘마음에 돌이키고/마음을 돌이켜’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 동사는 같은 뿌리의 표현으로, ‘죄를 지었고 … 악을 행했습니다’라는 고백을 단계적으로 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל לִבָּם
  english_pob_choice: come to their senses
  chosen_korean: 정신을 차리고
  alternatives_korean:
