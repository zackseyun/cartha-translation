source:
  edition: WLC
  text: וַ/יַּסֵּ֤ב הַ/מֶּ֨לֶךְ֙ אֶת פָּנָ֔י/ו וַ/יְבָ֕רֶךְ אֵ֖ת כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וְ/כָל קְהַ֥ל יִשְׂרָאֵ֖ל עֹמֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/014.yaml
  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
  footnotes:
  - marker: a
    text: Or 'turned' or 'turned about.' The Hebrew literally says 'turned his face.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all the congregation of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 돌아서서 이스라엘의 온 회중을 축복하였는데, 이스라엘의 온 회중은 서 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 얼굴을 돌렸다’는 식입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘이스라엘의 온 집회’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  english_pob_choice: turned around
  chosen_korean: 돌아서서
  alternatives_korean:
  - 돌아섰습니다
  - 몸을 돌렸습니다
  - 얼굴을 돌렸습니다
  lexicon: HALOT
  rationale: 왕의 방향 전환을 자연스럽게 살리되, 히브리어의 물리적 ‘돌림’ 동작을 유지하기 위해 ‘돌아서서’로 옮겼습니다.
- source_word: וַיְבָרֶךְ
  english_pob_choice: blessed
  chosen_korean: 축복하였는데
  alternatives_korean:
  - 복을 빌었는데
  - 축복하셨는데
  - 축복하고
  lexicon: HALOT
  rationale: 이 문맥의 ברך는 공적 자리에서의 축복 선언이므로, 동사의 직접 의미를 살려 ‘축복하다’로 옮겼습니다.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  english_pob_choice: all the assembly of Israel
  chosen_korean: 이스라엘의 온 회중
  alternatives_korean:
  - 이스라엘의 온 집회
  - 이스라엘의 모든 모임
  - 이스라엘의 온 회중
  lexicon: HALOT
  rationale: קהל은 모인 공동체를 가리키므로, 본문이 제도적 ‘교회’가 아니라 모여 있는 백성을 말한다는 점을 살려 ‘회중’으로 옮겼습니다.
- source_word: עֹמֵד
  english_pob_choice: was standing
  chosen_korean: 서 있었습니다
  alternatives_korean:
  - 서 있었습니다
  - 서 있던 상태였습니다
  - 서 있었습니다만
  lexicon: HALOT
  rationale: 분사 עֹמֵד의 지속적 배경 상태를 한국어에서 자연스럽게 드러내기 위해 진행적 의미의 ‘서 있었습니다’를 사용했습니다.
theological_decisions:
- issue: 공적 축복 행위의 표현
  chosen_reading: 왕이 백성 위에 선포하는 공적 축복을 그대로 ‘축복하였는데’로 옮겼습니다.
  alternative_readings:
  - 복을 빌었는데
  - 축복을 선언하였는데
  rationale: 본문은 단순한 인사보다 공적·의례적 축복 행위를 묘사하므로, 의미를 약화하지 않는 직접 번역이 적절합니다.
  doctrine_reference: 왕정 서사에서의 공적 축복 언어
- issue: ‘회중’의 선택
  chosen_reading: קהל을 전통 교회 용어인 ‘교회’가 아니라 ‘회중’으로 번역했습니다.
  alternative_readings:
  - 교회
  - 모인 무리
  rationale: 문맥은 성전 봉헌 자리의 이스라엘 공동체를 가리키며, 후대 교회 제도를 암시하지 않도록 ‘회중’이 가장 정확합니다.
  doctrine_reference: 구약 ישראל 공동체의 집합성
