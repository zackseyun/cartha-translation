  source_fidelity: 핵심 의미는 충실합니다. בְּצֵאת의 시간 관계, 제사장들, 성소에서 나옴, 구름이 야훼의 집을 가득 채움이 모두 정확히 반영되었습니다. 다만 한국어에서는 ‘그리고 … 때에’가 함께 쓰이면 와우-연속법의 서사 연결을 다소 기계적으로 중복 표기하여 문장이 부자연스러워집니다.
