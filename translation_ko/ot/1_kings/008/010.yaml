lexical_decisions:
- source_word: בְּצֵאת הַכֹּהֲנִים
  english_pob_choice: when the priests came out
  chosen_korean: 제사장들이 성소에서 나올 때에
  alternatives_korean:
  - 제사장들이 나오자
  - 제사장들이 성소에서 나왔을 때에
  lexicon: HALOT
  rationale: בְּ + יצא의 시간적 용법을 한국어의 ‘-을 때에’로 자연스럽게 살리고, הַכֹּהֲנִים은 문맥상 ‘제사장들’이 가장 직접적인 대응입니다.
- source_word: מִן הַקֹּדֶשׁ
  english_pob_choice: from the holy place
  chosen_korean: 성소에서
  alternatives_korean:
  - 거룩한 곳에서
  - 성전에서
  lexicon: HALOT
  rationale: קֹדֶשׁ는 단순한 ‘거룩함’보다 제사장들이 나온 제의적 공간을 가리키므로, 문맥상 ‘성소’가 가장 정확합니다.
- source_word: וְהֶעָנָן
  english_pob_choice: the cloud
  chosen_korean: 구름이
  alternatives_korean:
  - 그 구름이
  lexicon: HALOT
  rationale: 정관사 기능은 한국어에서 보통 따로 드러내지 않으며, 본문 흐름상 주어를 간결하게 ‘구름’으로 옮기는 것이 자연스럽습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: בית יהוה의 직역을 따라 ‘집’을 살리고, המקרא의 고유명 יְהוָה는 프로젝트 기본에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
