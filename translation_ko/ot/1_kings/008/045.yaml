source:
  edition: WLC
  text: וְ/שָׁמַעְתָּ֙ הַ/שָּׁמַ֔יִם אֶת תְּפִלָּתָ֖/ם וְ/אֶת תְּחִנָּתָ֑/ם וְ/עָשִׂ֖יתָ מִשְׁפָּטָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/045.yaml
  text: then hear in heaven their prayer and their plea[b][a], and uphold their cause.
  footnotes:
  - marker: a
    text: Or 'and execute justice for them' or 'and maintain their right.' The Hebrew literally says 'and do their justice/judgment.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the heavens'; rendered 'in heaven' for natural English in this prayer formula.
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇다면 주께서는 하늘에서[b] 그들의 기도와 간구를 들으시고, 그들의 권리를 옹호해 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 정의/판결’이라고 합니다. 이 표현은 그들을 위하여 정의를 행하고 그들의 권리를 세운다는 뜻으로도 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘하늘들’이라고 합니다. 이 기도문의 표현에서는 한국어로 자연스럽게 ‘하늘에서’라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ הַשָּׁמַיִם
  english_pob_choice: then hear in heaven
  chosen_korean: 하늘에서 … 들으시고
  alternatives_korean:
  - 하늘에서 들으시고
  - 하늘에서 들어 주시고
  lexicon: HALOT
  rationale: 히브리어는 ‘하늘들/하늘에서’라는 형식을 쓰지만, 이 기도문에서는 한국어로 자연스럽게 ‘하늘에서 들으시고’라고 옮기면 형식과 뜻을 함께 살릴 수 있습니다.
- source_word: תְּפִלָּתָם
  english_pob_choice: their prayer
  chosen_korean: 그들의 기도
  alternatives_korean:
  - 그들의 기도문
  - 그들의 기원
  lexicon: HALOT
  rationale: תְּפִלָּה는 일반적인 ‘기도’이므로, 과도한 종교어보다 표준적인 ‘기도’가 원뜻을 가장 분명하게 드러냅니다.
- source_word: תְּחִנָּתָם
  english_pob_choice: their plea
  chosen_korean: 그들의 간구
  alternatives_korean:
  - 그들의 애원
  - 그들의 탄원
  lexicon: HALOT
  rationale: תְּחִנָּה는 단순한 기도보다 더 간절한 청원을 가리키므로, 한국어에서는 ‘간구’가 그 뉘앙스를 잘 보존합니다.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  english_pob_choice: and uphold their cause
  chosen_korean: 그들의 사정을 변호해 주십시오
  alternatives_korean:
  - 그들에게 공의를 행해 주십시오
  - 그들의 권리를 세워 주십시오
  - 그들의 판단을 행해 주십시오
  lexicon: HALOT
  rationale: ‘עשה משפט’는 문자적으로는 ‘그들의 משפט을 행하다’이지만, 실제로는 억울함을 풀어 주고 옹호해 주는 사법적 관용구이므로, 현대 한국어로는 ‘사정을 변호하다’가 의미를 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: 청원문에서의 직접 간구 어조
  chosen_reading: 문장 전체를 하나님께 드리는 간청으로 이해하여 ‘주께서는 … 들으시고 … 해 주십시오’라는 공손한 청원형으로 옮겼습니다.
  alternative_readings:
  - 명령형을 약하게 처리한 서술형
  - 더 전통적인 ‘들으시며 … 하시옵소서’형
  rationale: 본문은 성전 봉헌 기도 안의 청원문이므로, 한국어에서도 하나님께 직접 드리는 공손한 요청 어조를 유지하는 것이 문맥에 가장 적합합니다.
  doctrine_reference: 기도문 번역 관례; 합쇼체 청원문 원칙
