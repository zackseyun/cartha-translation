source:
  edition: WLC
  text: וְ/הָיָ֤ה לְבַבְ/כֶם֙ שָׁלֵ֔ם עִ֖ם יְהוָ֣ה אֱלֹהֵ֑י/נוּ לָ/לֶ֧כֶת בְּ/חֻקָּ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו כַּ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/061.yaml
  text: Let your heart therefore be wholly with Yahweh our God[a], to walk in his statutes and to keep his commandments[b], as at this day.
  footnotes:
  - marker: a
    text: 'Or ''undivided'': ''Let your heart therefore be undivided with the LORD our God.'''
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''as on this day,'' referring to the present day as the pattern or witness of such devotion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희 마음이 야훼 우리 하나님께 온전하고, 그분의 규례를 따라 걸으며 그분의 계명을 지키십시오. 오늘과 같이 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로서 ‘오늘과 같이’는 현재의 이 날을 그러한 헌신의 본보기 또는 증거로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: Let ... be
  chosen_korean: '...하십시오'
  alternatives_korean:
  - '...이 되게 하십시오'
  - '...이 되십시오'
  lexicon: HALOT
  rationale: 문맥상 솔로몬의 축복/권면이므로 단순 미래가 아니라 권고·권면의 뉘앙스를 살려 한국어 명령형으로 옮겼습니다.
- source_word: לְבַבְכֶם שָׁלֵם עִם
  english_pob_choice: your heart ... wholly ... with
  chosen_korean: 너희 마음이 ... 온전하여
  alternatives_korean:
  - 너희 마음이 ... 완전하여
  - 너희 마음이 ... 나뉘지 않아
  lexicon: HALOT
  rationale: לֵבָב의 내적 중심과 שָׁלֵם의 언약적 ‘온전함/분절되지 않음’을 함께 살리기 위해 ‘마음이 온전하여’로 옮겼습니다.
- source_word: בְּחֻקָּיו ... מִצְוֺתָיו
  english_pob_choice: in his statutes ... his commandments
  chosen_korean: 그분의 규례 안에서 ... 그분의 명령을
  alternatives_korean:
  - 그분의 율례 안에서 ... 그분의 계명을
  - 그분의 규례를 따라 ... 그분의 명령들을
  lexicon: HALOT
  rationale: חֻקִּים은 관례적 ‘규례/율례’ 가운데 ‘규례’를 택했고, מִצְוֹת는 단일한 ‘명령’으로도 자연스러워 복수 감각은 문맥에 맡겼습니다.
- source_word: כַּיּוֹם הַזֶּה
  english_pob_choice: as at this day
  chosen_korean: 오늘과 같이
  alternatives_korean:
  - 이 날과 같이
  - 오늘날과 같이
  lexicon: HALOT
  rationale: 히브리어 관용구의 현재-증언적 의미를 살리면서, 한국어에서는 지나치게 문자적인 ‘이 날’보다 자연스럽게 ‘오늘과 같이’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 고유명사 יְהוָה를 제목어 ‘주’로 대체하지 않고, 프로젝트 기본 원칙에 따라 신적 고유명칭 ‘야훼’로 옮겨 언약적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: שָׁלֵם의 언약적 완전성
  chosen_reading: 온전하여
  alternative_readings:
  - 온전히
  - 나뉘지 않아
  - 완전하여
  rationale: 도덕적 무결성이나 철학적 완전성으로 과장하지 않고, 야훼께 대한 전인적·분절되지 않은 충성을 드러내도록 ‘온전하여’를 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve theological tension rather than resolve it'
