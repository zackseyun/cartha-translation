  rationale: ‘야훼 우리 하나님과 온전하여’를 ‘야훼 우리 하나님께 온전하고’로 다듬어 שָׁלֵם의 온전하고 나뉘지 않은 헌신이라는 뜻을 자연스럽게 드러냈습니다. 이어지는 ‘걸으며’와 ‘지키십시오’는 원문의 행위 권면을 보존합니다. ‘규례를 따라’와 ‘계명’은 각각 히브리어 표현의 의미와 복수성을 한국어 문체에 맞게 반영합니다. ‘오늘과 같이’의 다소 불확정적인 지시 기능은 각주에서 제한적으로 설명했습니다.
