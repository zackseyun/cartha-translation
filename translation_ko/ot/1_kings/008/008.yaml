  edition: WLC
  text: וַֽ/יַּאֲרִכוּ֮ הַ/בַּדִּים֒ וַ/יֵּרָאוּ֩ רָאשֵׁ֨י הַ/בַּדִּ֤ים מִן הַ/קֹּ֨דֶשׁ֙ עַל פְּנֵ֣י הַ/דְּבִ֔יר וְ/לֹ֥א יֵרָא֖וּ הַ/ח֑וּצָ/ה וַ/יִּ֣הְיוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/008.yaml
  text: And the poles were so long that the ends of the poles were seen from the Holy Place before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
  footnotes:
  - marker: a
    text: Or 'before the Most Holy Place.' The Hebrew term refers to the inner sanctuary of the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 채들은 너무 길어서 지성소 앞 거룩한 곳에서 그 채들의 끝이 보였으나, 바깥에서는 보이지 않았으며, 그것들은 오늘날까지 거기에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지성소 앞의’입니다. 히브리어 용어는 성전의 내실을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִכוּ / הַבַּדִּים
  english_pob_choice: were so long / the poles
  chosen_korean: 너무 길어서 / 그 채들
  alternatives_korean:
  - 길어져서 / 그 막대들
  - 늘어나서 / 그 운반채들
  lexicon: HALOT
  rationale: בַּדִּים은 언약궤를 멜 때 쓰는 채들이므로 ‘채들’이 기능을 가장 직접적으로 살립니다. וַיַּאֲרִכוּ는 단순한 길이의 상태를 나타내므로, 결과를 자연스럽게 드러내는 ‘너무 길어서’로 옮겼습니다.
- source_word: מִן הַקֹּדֶשׁ
  english_pob_choice: from the Holy Place
  chosen_korean: 거룩한 곳에서
  alternatives_korean:
  - 성소에서
  - 거룩소에서
  lexicon: HALOT
  rationale: 여기서 הַקֹּדֶשׁ은 성전의 바깥 칸을 가리키는 기술적 표현이지만, 한국어 본문에서는 문맥상 자연스러운 ‘거룩한 곳’으로 옮겨 내부 공간과의 대조를 유지했습니다.
- source_word: עַל פְּנֵי הַדְּבִיר
  english_pob_choice: before the inner sanctuary
  chosen_korean: 지성소 앞
  alternatives_korean:
  - 안쪽 성소 앞
  - 지성소 앞쪽에
  lexicon: HALOT
  rationale: דְּבִיר은 성전의 내실, 곧 지성소를 가리키므로 한국어 성서용어로 널리 알려진 ‘지성소’를 사용했습니다. עַל פְּנֵי의 방향감은 ‘앞’으로 간결하게 살렸습니다.
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  english_pob_choice: but they could not be seen from outside
  chosen_korean: 바깥에서는 보이지 않았으며
  alternatives_korean:
  - 밖에서는 보이지 않았으며
  - 바깥쪽에서는 볼 수 없었으며
  lexicon: HALOT
  rationale: 대조 구조를 살리면서 한국어에서는 수동적 종결보다 자연스러운 ‘보이지 않았다’로 옮겼습니다. הַחוּצָה는 장소 부사로서 ‘바깥’으로 처리했습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘날까지
  alternatives_korean:
  - 이 날까지
  - 오늘까지
  lexicon: HALOT
  rationale: 히브리어의 현재까지 지속되는 관용구를 한국어의 ‘오늘날까지’로 옮겨 서술자의 현재 시점을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 성전 공간 명칭의 번역 강도
  chosen_reading: ‘거룩한 곳’과 ‘지성소’의 대조를 유지하되, 본문은 과도하게 의역하지 않고 공간적 관계를 그대로 보여 줍니다.
  alternative_readings:
  - ‘성소’와 ‘지성소’의 정형화된 교회 용어 사용
  - ‘거룩소’ 같은 직역 어휘 사용
  rationale: 본문은 언약궤와 관련된 성전 내부 구조를 설명하는 문맥이므로, 전통 용어를 완전히 버리거나 지나치게 낯선 조어를 쓰기보다, 문맥상 이해 가능한 수준에서 원문의 공간 대비를 보존했습니다.
  doctrine_reference: 성막/성전의 성소·지성소 구조(출 26–27; 왕상 6–8)
