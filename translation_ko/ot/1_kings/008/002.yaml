  text: And all the men of Israel assembled before King Solomon at the festival, in the month of Ethanim, which is the seventh month.
translation:
  language: ko
  text: 이스라엘의 모든 사람이 에다님 월, 곧 일곱째 달의 절기에 솔로몬 왕 앞에 모였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  english_pob_choice: assembled
  chosen_korean: 모였는데
  alternatives_korean:
  - 집결했는데
  - 모여들었는데
  lexicon: קהל / assemble
  rationale: 대규모 공동 집합의 의미를 자연스러운 현대 한국어로 살리면서도, 사건 서술의 흐름을 유지하기 위해 ‘모였는데’로 옮겼습니다.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  english_pob_choice: before King Solomon
  chosen_korean: 솔로몬 왕 앞에
  alternatives_korean:
  - 솔로몬 왕에게
  - 솔로몬 왕에게로
  lexicon: preposition + royal title
  rationale: 히브리어 אֶל을 이 절의 문맥상 단순한 방향보다 ‘왕 앞에’로 옮기는 것이, 청중이 왕 앞에 모인 장면을 분명하게 드러냅니다.
- source_word: בְּיֶרַח הָאֵתָנִים
  english_pob_choice: in the month of Ethanim
  chosen_korean: 에다님 월
  alternatives_korean:
  - 에다님 달
  - 에타님 월
  lexicon: proper noun transliteration
  rationale: 달 이름은 음역을 유지해 고유명사성을 살렸고, 한국어 관용에 맞게 ‘월’을 붙였습니다.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  english_pob_choice: the seventh month
  chosen_korean: 일곱째 달
  alternatives_korean:
  - 일곱 번째 달
  - 제칠월
  lexicon: calendar expression
  rationale: 달력 표시는 현대 독자가 즉시 이해할 수 있는 ‘일곱째 달’이 자연스럽고, 앞의 ‘에다님 월’과도 병기 관계를 분명히 합니다.
theological_decisions:
- issue: אֶל הַמֶּלֶךְ의 방향성
  chosen_reading: ‘솔로몬 왕 앞에’로 번역해 왕 앞에 모인 공적 집회를 드러냈습니다.
  alternative_readings:
  - 솔로몬 왕에게
  - 솔로몬 왕 주변에
  rationale: 이 장면은 단순한 이동이 아니라 왕 앞에서의 국가적 집합이므로, 한국어에서도 관계와 장면성을 살리는 것이 원문 효과에 더 가깝습니다.
  doctrine_reference: 왕정 서사 문맥의 장면 묘사
