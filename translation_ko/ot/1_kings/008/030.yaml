- from: 그리고 주의 종과 주의 백성 이스라엘이 이곳을 향해 기도할 때 그 간구를 들으십시오. 그리고 하늘, 곧 주께서 거하시는 곳에서 들으시고, 들으시고 용서하십시오.[a][b]
  to: 주의 종과 주의 백성 이스라엘이 이곳을 향하여[a] 기도할 때에 그 간구를 들어 주십시오. 하늘에 있는 주의 거처에서[b] 들으시고 또 들으셔서 용서해 주십시오.
  rationale: ‘하늘에 있는 주의 거처’로 하늘과 하나님의 거처를 연결하되, 성전을 향한 기도와 하늘의 거처라는 본문의 긴장은 유지했습니다. 각주 b에서 원문에 없는 ‘두신’을 삭제했습니다. 반복되는 ‘들으시고’는 ‘들으시고 또 들으셔서’로 번역하여 의미를 보존하면서 현대 한국어 합쇼체의 자연스러움을 높였습니다. 각주 표지는 각각 해당 표현 뒤에 배치했습니다.
