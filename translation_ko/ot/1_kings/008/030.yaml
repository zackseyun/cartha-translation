id: 1KI.8.30
reference: 1 Kings 8:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תְּחִנַּ֤ת עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע אֶל מְק֤וֹם שִׁבְתְּ/ךָ֙ אֶל הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/030.yaml
  text: And hear the plea of your servant and of your people Israel when they pray toward this place[a]. And hear in heaven, the place of your dwelling[b]; hear and forgive.
  footnotes:
  - marker: a
    text: Or 'to this place.' The Hebrew expression can be rendered more literally this way, but 'toward this place' better conveys prayer directed toward the temple.
    reason: lexical_alternative
  - marker: b
    text: Or 'your dwelling place in heaven.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 주의 종과 주의 백성 이스라엘이 이곳을 향해 기도할 때 그 간구를 들으십시오. 그리고 하늘, 곧 주께서 거하시는 곳에서 들으시고, 들으시고 용서하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이곳에’. 히브리어 표현은 문자적으로 이렇게도 옮길 수 있지만, 기도의 방향성을 살리기 위해 ‘향해’가 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주께서 하늘에 두신 거처’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִנַּת
  english_pob_choice: plea
  chosen_korean: 간구
  alternatives_korean:
  - 부탁
  - 호소
  - 청원
  lexicon: HALOT
  rationale: תְּחִנָּה는 은혜와 자비를 구하는 간절한 요청이므로, 현대 한국어에서는 격식과 긴박감을 함께 살리는 ‘간구’가 가장 자연스럽습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 주의 하인
  lexicon: HALOT
  rationale: 기도문에서의 עֶבֶד은 하나님 앞의 겸손한 자기 호칭이므로, ‘노예’보다 ‘종’이 문맥에 맞습니다. 관계의 소유격을 분명히 하기 위해 ‘주의 종’으로 옮겼습니다.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  english_pob_choice: toward this place
  chosen_korean: 이곳을 향해
  alternatives_korean:
  - 이곳으로
  - 이곳에
  lexicon: HALOT
  rationale: 예배당/성전을 향해 기도하는 방향성을 살리기 위해 단순한 도착 의미의 ‘-으로’보다 ‘향해’가 더 정확합니다.
- source_word: מְקוֹם שִׁבְתְּךָ
  english_pob_choice: the place of your dwelling
  chosen_korean: 주께서 거하시는 곳
  alternatives_korean:
  - 주의 거처
  - 주님의 거하시는 곳
  - 주의 머무시는 곳
  lexicon: HALOT
  rationale: 히브리어의 ‘거함/거처’ 개념을 살리되 한국어에서는 ‘거하시는 곳’이 가장 자연스럽고, 문장 안에서 뒤의 ‘하늘’과 병렬되도록 했습니다.
theological_decisions:
- issue: 성전 방향 기도와 하늘의 वास्तविक 거처 사이의 긴장
  chosen_reading: ‘이곳을 향해’와 ‘하늘, 곧 주께서 거하시는 곳’ 둘 다 유지해, 성전이 기도의 초점이면서도 하나님의 실제 거처는 하늘이라는 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - ‘이 성전에서’로 평탄화하기
  - ‘하늘에서’만 두드러지게 하기
  rationale: 본문은 지상 성전의 방향성과 하나님의 하늘 거처를 함께 붙들고 있으므로, 둘 중 하나로 흡수하지 않고 병렬로 번역하는 것이 소스에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
