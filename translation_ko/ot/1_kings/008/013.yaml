    text: 또는 ‘높은 거처인 집’. 히브리어 זְבֻל은 높고 숭고한 거처를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘확고히 세워진 거처’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֹה בָנִיתִי
  english_pob_choice: I have indeed built
  chosen_korean: 내가 참으로 … 지었고
  alternatives_korean:
