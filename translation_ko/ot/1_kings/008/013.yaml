source:
  edition: WLC
  text: בָּנֹ֥ה בָנִ֛יתִי בֵּ֥ית זְבֻ֖ל לָ֑/ךְ מָכ֥וֹן לְ/שִׁבְתְּ/ךָ֖ עוֹלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/013.yaml
  text: I have indeed built you an exalted house[b][a], a settled place for you to dwell forever.
  footnotes:
  - marker: a
    text: Or 'a lofty/majestic dwelling.' The Hebrew זְבֻל refers to an exalted abode.
    reason: lexical_alternative
  - marker: b
    text: Or 'a fixed place for your dwelling.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 참으로 주님을 위하여 높은 집을 지었고, 주님께서 영원히 거하실 정착한 자리를 마련하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘높은/숭고한 거처’라는 뜻으로도 이해할 수 있습니다. 히브리어 זְבֻל은 높은 거처를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘확정된 거처’라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֹה בָנִיתִי
  english_pob_choice: I have indeed built
  chosen_korean: 내가 참으로 … 지었고
  alternatives_korean:
  - 내가 정말 … 지었고
  - 내가 확실히 … 지었고
  lexicon: HALOT
  rationale: 부정사 절대형+완전동사의 강조를 한국어의 ‘참으로’로 살려, 단순한 완료가 아니라 강조된 진술임을 드러냈습니다.
- source_word: בֵּית זְבֻל
  english_pob_choice: an exalted house
  chosen_korean: 높은 집
  alternatives_korean:
  - 존귀한 집
  - 고귀한 집
  - 높이 들린 집
  lexicon: HALOT
  rationale: בֵּית의 ‘집’과 זְבֻל의 ‘높은/숭고한 거처’라는 감각을 함께 살리기 위해 ‘높은 집’으로 옮겼습니다. ‘성전’으로 좁히지 않고 본문 표현을 보존했습니다.
- source_word: מָכוֹן לְשִׁבְתְּךָ
  english_pob_choice: a settled place for you to dwell
  chosen_korean: 정착한 자리를 마련하였습니다
  alternatives_korean:
  - 확정된 거처를 마련하였습니다
  - 굳게 정한 거처를 마련하였습니다
  - 거주할 고정된 자리를 마련하였습니다
  lexicon: HALOT
  rationale: מָכוֹן의 ‘세워진/확정된 자리’와 לְשִׁבְתְּךָ의 ‘거하실 곳’을 합쳐, 한국어에서 자연스럽고 स्थिर성을 드러내는 ‘정착한 자리’로 처리했습니다.
- source_word: עוֹלָמִים
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영세토록
  - 끝없이
  - 오래도록
  lexicon: HALOT
  rationale: 복수형이 강화하는 지속성을 현대 한국어의 표준적인 종결 부사 ‘영원히’로 간결하게 반영했습니다.
theological_decisions:
- issue: 야훼의 거처를 성전 신학을 훼손하지 않으면서 어떻게 표현할지
  chosen_reading: 본문의 ‘집/자리/거하심’ 언어를 그대로 살려, 주님께서 실제로 거하실 장소라는 진술을 유지했습니다.
  alternative_readings:
  - ‘주님의 이름이 거하실 곳’으로 완화
  - ‘예배드릴 곳’으로 의역
  rationale: 히브리어는 하나님의 임재를 가리키는 예배 장소의 언어를 직접 사용하므로, 후대적 완화 없이 본문이 말하는 언약적 성전 언어를 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
