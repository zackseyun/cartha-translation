  - 솔로몬 왕에게로
  rationale: 소집된 인물들이 왕에게로 모여드는 장면을 그대로 반영하는 방향 표현으로, 과도한 해석 없이 히브리어 전치사의 기본값을 따랐습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy
