  rationale: 본문이 신명기적 언약명인 사두문자 이름을 직접 사용하므로, POB 원칙에 따라 제목 대체어보다 고유명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 왕에게 'אֶל'의 방향성
  chosen_reading: ‘솔로몬 왕에게’로 옮겼습니다.
  alternative_readings:
