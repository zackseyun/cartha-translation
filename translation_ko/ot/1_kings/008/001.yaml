  text: אָ֣ז יַקְהֵ֣ל שְׁלֹמֹ֣ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֡ל אֶת כָּל רָאשֵׁ֣י הַ/מַּטּוֹת֩ נְשִׂיאֵ֨י הָ/אָב֜וֹת לִ/בְנֵ֧י יִשְׂרָאֵ֛ל אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖ד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/001.yaml
  text: Then Solomon assembled the elders of Israel[a], all the heads of the tribes, the leaders of the fathers’ houses of the sons of Israel, to King Solomon in Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David, that is, Zion.
  footnotes:
  - marker: a
    text: Hebrew 'sons of Israel,' a familial-national expression often rendered 'children of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 솔로몬이 이스라엘의 장로들[a]과 모든 지파의 우두머리들, 곧 이스라엘 자손의 조상 가문들의 지도자들을 예루살렘의 솔로몬 왕에게 소집하여, 야훼의 언약궤를 다윗의 도시, 곧 시온에서 가져오게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’이지만, 문맥상 민족-가족 집단을 가리키는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그 후
  - 그런 다음
  lexicon: HALOT
  rationale: 이야기의 시간적 진행을 자연스럽게 잇는 접속어로, 단순한 순서를 드러내는 'Then'의 기능을 살렸습니다.
- source_word: יַקְהֵל
  english_pob_choice: assembled
  chosen_korean: 소집하여
  alternatives_korean:
  - 모아
  - 모여
  - 집합시켜
  lexicon: HALOT
  rationale: 왕이 주도해 공적 인원을 불러모으는 뉘앙스가 있어, 단순한 '모이다'보다 행정적·공적 성격을 드러내는 '소집하다'가 적절합니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: of the sons of Israel
  chosen_korean: 이스라엘 자손의
  alternatives_korean:
  - 이스라엘의 자녀들의
  - 이스라엘 백성의
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 가족-민족 표현을 유지하되, 한국어에서는 관용적으로 자연스러운 '이스라엘 자손'을 사용했습니다.
- source_word: אֲרוֹן בְּרִית יְהוָה
  english_pob_choice: the ark of the covenant of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 야훼의 언약의 궤
  - 야훼 언약궤
  lexicon: HALOT
  rationale: 문맥상 이미 잘 알려진 고정 표현이므로, '언약궤'를 유지해 번역의 응집성을 살리면서 소유격으로 야훼를 분명히 했습니다.
- source_word: הִיא צִיּוֹן
  english_pob_choice: that is, Zion
  chosen_korean: 곧 시온
  alternatives_korean:
  - 즉 시온
  - 시온이라는 곳
  lexicon: HALOT
  rationale: 동격 설명을 자연스럽게 표시하는 한국어 표현으로, 다윗의 도시와 시온의 동일시를 명료하게 드러냅니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼로 직접 음역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신명기적 언약명인 사두문자 이름을 직접 사용하므로, POB 원칙에 따라 제목 대체어보다 고유명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 왕에게 'אֶל'의 방향성
  chosen_reading: ‘솔로몬 왕에게’로 옮겼습니다.
  alternative_readings:
  - 솔로몬 왕 앞에
  - 솔로몬 왕에게로
  rationale: 소집된 인물들이 왕에게로 모여드는 장면을 그대로 반영하는 방향 표현으로, 과도한 해석 없이 히브리어 전치사의 기본값을 따랐습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy
