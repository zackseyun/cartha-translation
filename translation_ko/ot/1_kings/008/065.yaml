  terminology: ‘절기를 지켰습니다’, ‘큰 회중’, ‘레보하맛’, ‘야훼 우리 하나님’은 본문 및 프로젝트 용어 선택과 양립합니다. 지명 경계인 נחל מִצְרַיִם은 ‘이집트 시내’로 옮기고 와디라는 대안을 주석에 보존합니다.
