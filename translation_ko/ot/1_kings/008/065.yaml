lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת הֶחָג
  english_pob_choice: held the feast
  chosen_korean: 그 절기를 지켰고
  alternatives_korean:
  - 그 절기를 열었고
  - 그 절기를 거행했고
  - 그 절기를 지켰습니다
  lexicon: HALOT
  rationale: עשה + חג는 절기를 ‘하다’는 관용법으로, 현대 한국어에서는 ‘지키다’가 예배·절기 준수의 의미를 자연스럽게 살립니다.
- source_word: קָהָל גָּדוֹל
  english_pob_choice: a great assembly
  chosen_korean: 큰 회중
  alternatives_korean:
  - 큰 모임
  - 큰 집회
  - 큰 총회
  lexicon: HALOT
  rationale: קָהָל은 단순한 모임보다 공적으로 모인 공동체를 가리키므로, 교회 제도어인 ‘교회’보다 중립적인 ‘회중’이 적절합니다.
- source_word: מִלְּבוֹא חֲמָת
  english_pob_choice: from Lebo-hamath
  chosen_korean: 레보하맛에서부터
  alternatives_korean:
  - 하맛의 입구에서부터
  - 레보-하맛에서부터
  lexicon: HALOT
  rationale: 지리 경계표현으로 굳어진 고유명사 용법을 따라 음역을 본문에 두고, 분해 번역은 본문보다 덜 선호되는 대안으로만 남깁니다.
- source_word: נַחַל מִצְרַיִם
  english_pob_choice: the Brook of Egypt
  chosen_korean: 이집트 강까지
  alternatives_korean:
  - 이집트 개울까지
  - 이집트 와디까지
  - 이집트 내천까지
  lexicon: HALOT
  rationale: נחל의 핵심은 하천/와디이지만, 한국어에서는 지명 경계로 기능하는 표현을 자연스럽게 옮기기 위해 ‘강’보다 ‘이집트 강’처럼 유지할 수 있는 지리 표지성을 살렸습니다.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת יָמִים אַרְבָּעָה עָשָׂר יוֹם
  english_pob_choice: seven days and seven days, fourteen days
  chosen_korean: 칠 일과 또 칠 일, 모두 열사흗날이 아니라 열사흘, 곧 열사흘입니다
  alternatives_korean:
  - 칠 일과 또 칠 일, 모두 열사흘입니다
  - 칠 일과 또 칠 일, 합하여 열사흘입니다
  lexicon: HALOT
  rationale: 반복된 7일을 그대로 살리되, 마지막 총계는 히브리어의 명시적 합산을 반영하여 한국어로는 ‘모두 열사흘’이 아니라 ‘열사흘’로 정리합니다.
theological_decisions:
- issue: יְהוָה אֱלֹהֵינוּ의 호칭
  chosen_reading: 야훼 우리 하나님
  alternative_readings:
  - 여호와 우리 하나님
  - 주 우리 하나님
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮기고, 언약적 관계를 드러내는 ‘우리 하나님’을 병기해 원문의 직접성을 유지합니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
