  rationale: נחל의 핵심은 하천/와디이지만, 한국어에서는 지명 경계로 기능하는 표현을 자연스럽게 옮기기 위해 ‘강’보다 ‘이집트 강’처럼 유지할 수 있는 지리 표지성을 살렸습니다.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת יָמִים אַרְבָּעָה עָשָׂר יוֹם
  english_pob_choice: seven days and seven days, fourteen days
  chosen_korean: 칠 일과 또 칠 일, 모두 열사흗날이 아니라 열사흘, 곧 열사흘입니다
  alternatives_korean:
  - 칠 일과 또 칠 일, 모두 열사흘입니다
