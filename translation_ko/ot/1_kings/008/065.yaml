base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/065.yaml
  text: At that time Solomon held the feast[a], and all Israel with him, a great assembly from Lebo-hamath to the Brook of Egypt, before Yahweh our God, seven days and seven days[b], fourteen days.
  footnotes:
  - marker: a
    text: Or 'from the entrance of Hamath.' The Hebrew may be read as a descriptive border expression or as the place-name Lebo-hamath.
    reason: alternative_reading
  - marker: b
    text: Or 'the Wadi of Egypt.' The Hebrew term often refers to a seasonal watercourse rather than a major river.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 솔로몬은 그와 함께한 온 이스라엘, 곧 레보하맛[a]에서 이집트 시내[b]까지 이르는 큰 회중과 함께 야훼 우리 하나님 앞에서 그 절기를 칠 일과 또 칠 일, 모두 열나흘 동안 지켰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘레보하맛’은 ‘하맛의 입구’로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘이집트 시내’는 ‘이집트 와디’로도 옮길 수 있습니다. 히브리어 נחל은 흔히 계절성 물길을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת הֶחָג
  english_pob_choice: held the feast
  chosen_korean: 그 절기를 지켰고
  alternatives_korean:
