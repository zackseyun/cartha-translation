  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי עַמְּ/ךָ֥ וְ/נַחֲלָתְ/ךָ֖ הֵ֑ם אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מִ/מִּצְרַ֔יִם מִ/תּ֖וֹךְ כּ֥וּר הַ/בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/051.yaml
  text: For they are your people and your inheritance[a], whom you brought out of Egypt[b], out of the midst of the iron furnace.
  footnotes:
  - marker: a
    text: Or 'your possession' or 'your heritage' for 'your inheritance.'
    reason: lexical_alternative
  - marker: b
    text: '''The iron furnace'' is a metaphor for Egypt as a place of intense oppression and affliction; compare Deuteronomy 4:20.'
    reason: cross_reference
translation:
  language: ko
  text: 그들은 주님의 백성이며 주님의 기업입니다[a]. 주님께서 그들을 이집트[b] 곧 철 용광로 한가운데에서 인도하여 내셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 소유’, ‘주님의 유산’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘철 용광로’는 이집트를 극심한 압제와 고난의 장소로 비유한 표현입니다. 신명기 4:20과 비교해 보십시오.
    reason: cross_reference
lexical_decisions:
- source_word: עַמְּךָ
  english_pob_choice: your people
  chosen_korean: 주님의 백성
  alternatives_korean:
  - 주님의 사람들
  - 주님의 백성들
  lexicon: HALOT
  rationale: 언약적 소속을 드러내는 가장 자연스러운 한국어 표현으로, ‘백성’이 집단 정체성과 관계적 소속을 함께 살립니다.
- source_word: וְנַחֲלָתְךָ
  english_pob_choice: your inheritance
  chosen_korean: 주님의 기업
  alternatives_korean:
  - 주님의 유업
  - 주님의 소유
  - 주님의 유산
  lexicon: HALOT
  rationale: נַחֲלָה의 언약적 ‘상속/할당된 몫’ 의미를 한국어 성서 용례에 맞게 ‘기업’으로 옮겨, 단순한 소유보다 하나님께 속한 몫이라는 뉘앙스를 살렸습니다.
- source_word: מִמִּצְרַיִם
  english_pob_choice: out of Egypt
  chosen_korean: 이집트
  alternatives_korean:
  - 애굽
  - 이집트 땅
  lexicon: HALOT
  rationale: 지명은 현대 표준 표기법을 따라 ‘이집트’로 옮겼고, 출애굽 공식의 흐름을 위해 동사와 함께 자연스럽게 읽히도록 했습니다.
- source_word: כּוּר הַבַּרְזֶל
  english_pob_choice: the iron furnace
  chosen_korean: 철 용광로
  alternatives_korean:
  - 철로 된 용광로
  - 쇠 용광로
  - 철로 된 아궁이
  lexicon: HALOT
  rationale: 비유적 표현을 직역하되 현대 한국어에서 강한 압박과 제련 이미지를 동시에 전달하는 ‘철 용광로’로 옮겼습니다.
theological_decisions:
- issue: ‘inheritance’의 언약적 함의 보존
  chosen_reading: ‘주님의 기업’으로 옮겨, 이스라엘이 하나님의 소유일 뿐 아니라 하나님이 정하여 맡으신 몫이라는 뜻을 유지했습니다.
  alternative_readings:
  - 주님의 소유
  - 주님의 유산
  rationale: 본문은 단순 소유보다 언약적 배분과 소속을 강조하므로, 전통적 교회어를 무조건 따르기보다 원문의 신학적 무게를 살리는 표현을 택했습니다.
  doctrine_reference: 언약 신학 / 출애굽-소유 표상
- issue: ‘iron furnace’의 은유 유지
  chosen_reading: ‘철 용광로 한가운데에서’로 직설적 은유를 유지했습니다.
  alternative_readings:
  - 극심한 고통 속에서
  - 불같은 압제 속에서
  rationale: 본문은 이집트를 압제와 고난의 장소로 비유하므로, 의미를 풀어쓰기보다 은유를 보존해 독자가 본문의 상징성을 직접 보게 했습니다.
  doctrine_reference: 출애굽기/신명기의 압제 은유
