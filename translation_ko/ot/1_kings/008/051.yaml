  source_fidelity: 수정안은 כִּי의 근거 제시 기능과 אֲשֶׁר הוֹצֵאתָ의 관계절을 한 문장 안에서 분명히 재현합니다. הוֹצֵאתָ는 ‘데리고 나오신’으로 옮겨 단순히 ‘인도하다’보다 ‘밖으로 나오게 하다’라는 출애굽의 사역 의미를 더 직접적으로 반영했습니다. ‘이집트, 곧 철 용광로 한가운데’는 두 출처 전치사구의 병렬과 은유적 동일시를 유지합니다.
  naturalness: ‘그들은 주님께서 … 데리고 나오신 주님의 백성이며 주님의 기업이기 때문입니다’는 현대 표준어 합쇼체에서 자연스럽고, 원문의 관계절과 이유절의 연결을 명료하게 드러냅니다. ‘기업’은 이 문맥에서 통용되는 성서적·격식적 어휘입니다.
  terminology: ‘주님의 백성’, ‘주님의 기업’, ‘이집트’, ‘철 용광로’는 각각 עַמְּךָ, נַחֲלָתְךָ, מִמִּצְרַיִם, כּוּר הַבַּרְזֶל을 충실히 반영합니다. 각주 a는 נַחֲלָה의 대안 의미를, 각주 b는 ‘철 용광로’ 은유와 신명기 4:20의 관련을 적절히 안내합니다.
