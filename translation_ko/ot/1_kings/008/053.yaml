  chosen_korean: 주 여호와여
  alternatives_korean:
  - 주 야훼여
  - 주 하나님이여
  lexicon: HALOT
  rationale: 본문의 אֲדֹנָי יְהוִה는 두 칭호가 겹치는 호칭이므로, 기도문 맥락을 살려 ‘주 여호와여’로 옮겼습니다.
theological_decisions:
- issue: 아도나이-여호와 결합 호칭의 한국어 처리
  chosen_reading: ‘주 여호와여’로 두 요소를 함께 보존했습니다.
  alternative_readings:
  - ‘주 야훼여’
  - ‘주 하나님이여’
  rationale: 본문은 지칭 호칭(아도나이)과 언약 이름(YHWH)을 함께 쓰므로, 하나를 지워버리지 않고 기도체 호칭으로 자연스럽게 유지하는 것이 원문의 신학적 중층성을 더 잘 드러냅니다.
  doctrine_reference: YHWH/아도나이 결합 호칭 보존 원칙
