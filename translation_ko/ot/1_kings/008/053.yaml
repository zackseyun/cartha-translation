base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/053.yaml
  text: For you set them apart for yourself as an inheritance from all the peoples of the earth[a], just as you spoke by the hand of Moses your servant when you brought our fathers out from Egypt[c][b], Lord GOD.
  footnotes:
  - marker: a
    text: Or 'through Moses your servant' for 'by the hand of Moses your servant.'
    reason: lexical_alternative
  - marker: b
    text: Or 'our ancestors' for 'our fathers.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'Lord YHWH'; English commonly renders this combination as 'Lord GOD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주께서 그들을 땅의 모든 백성 가운데서 주께 속한 기업으로 구별하셨습니다[a]. 주께서 주의 종 모세의 손을 통해 말씀하신 그대로, 곧 주께서 우리의 조상들을 이집트에서 이끌어 내실 때 하신 말씀대로입니다[b]. 주 여호와여[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모세의 손을 통해’로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘우리의 아버지들’로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 ‘주 여호와’(아도나이 + YHWH)라는 결합 호칭입니다.
    reason: ot_citation
lexical_decisions:
- source_word: הִבְדַּלְתָּם
  english_pob_choice: set them apart
  chosen_korean: 구별하셨습니다
  alternatives_korean:
  - 따로 떼어 두셨습니다
  - 분리하셨습니다
  lexicon: HALOT
  rationale: בדל의 핵심 의미는 구별/분리이며, 언약적 소속을 살리면서도 현대 한국어로 자연스럽게 옮기기 위해 ‘구별하셨습니다’를 택했습니다.
- source_word: לְךָ לְנַחֲלָה
  english_pob_choice: for yourself as an inheritance
  chosen_korean: 주께 속한 기업으로
  alternatives_korean:
  - 주님을 위한 기업으로
  - 주님의 소유로
  lexicon: HALOT
  rationale: לְךָ와 לְנַחֲלָה는 소유와 상속의 관계를 함께 나타내므로, 개인적 소유보다 언약적 상속 뉘앙스를 살리는 ‘주께 속한 기업’이 적절합니다.
- source_word: בְּיַד מֹשֶׁה
  english_pob_choice: by the hand of Moses
  chosen_korean: 모세의 손을 통해
  alternatives_korean:
  - 모세를 통해
  - 모세의 손으로
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어에서 이해 가능한 중간 표현으로 옮겨, 매개자 모세를 통한 전달성을 드러냈습니다.
- source_word: אֲבֹתֵינוּ
  english_pob_choice: our fathers
  chosen_korean: 우리의 조상들
  alternatives_korean:
  - 우리의 아버지들
  - 우리의 선조들
  lexicon: HALOT
  rationale: 문맥상 족장들만이 아니라 출애굽 세대를 포함한 이전 세대를 가리키므로, 성별 특정성을 불필요하게 만들지 않는 ‘조상들’이 자연스럽습니다.
- source_word: יְהוִה
  english_pob_choice: Lord GOD
  chosen_korean: 주 여호와여
  alternatives_korean:
  - 주 야훼여
  - 주 하나님이여
  lexicon: HALOT
  rationale: 본문의 אֲדֹנָי יְהוִה는 두 칭호가 겹치는 호칭이므로, 기도문 맥락을 살려 ‘주 여호와여’로 옮겼습니다.
theological_decisions:
- issue: 아도나이-여호와 결합 호칭의 한국어 처리
  chosen_reading: ‘주 여호와여’로 두 요소를 함께 보존했습니다.
  alternative_readings:
  - ‘주 야훼여’
  - ‘주 하나님이여’
  rationale: 본문은 지칭 호칭(아도나이)과 언약 이름(YHWH)을 함께 쓰므로, 하나를 지워버리지 않고 기도체 호칭으로 자연스럽게 유지하는 것이 원문의 신학적 중층성을 더 잘 드러냅니다.
  doctrine_reference: YHWH/아도나이 결합 호칭 보존 원칙
