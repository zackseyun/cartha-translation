    reason: lexical_alternative
  - marker: c
    text: Hebrew 'Lord YHWH'; English commonly renders this combination as 'Lord GOD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 그들을 땅의 모든 백성 가운데서 주께 속한 기업으로 구별하셨기 때문입니다. 주께서 우리의 조상들을 이집트에서 이끌어 내실 때, 주의 종 모세의 손을 통해 말씀하신 그대로입니다[a][b]. 주 야훼여[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모세를 통해’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리의 아버지들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘주 야훼’(아도나이 + YHWH)라는 결합 호칭입니다.
    reason: lexical_alternative
lexical_decisions:
