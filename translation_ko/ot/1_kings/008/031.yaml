  text: אֵת֩ אֲשֶׁ֨ר יֶחֱטָ֥א אִישׁ֙ לְ/רֵעֵ֔/הוּ וְ/נָֽשָׁא ב֥/וֹ אָלָ֖ה לְ/הַֽאֲלֹת֑/וֹ וּ/בָ֗א אָלָ֛ה לִ/פְנֵ֥י מִֽזְבַּחֲ/ךָ֖ בַּ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/031.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and the oath comes before your altar in this house,
  footnotes:
  - marker: a
    text: Or 'a curse'; the Hebrew term can refer to the oath itself or to the curse invoked if the oath is broken.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 어떤 사람이 자기 이웃에게 죄를 짓고, 그에게 맹세하게 하려고 맹세가 부과되고, 그 맹세가 이 집 안에 있는 주의 제단 앞에 이르게 되면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저주’; 히브리어 용어는 맹세 그 자체를 가리키기도 하고, 그 맹세를 어길 때 불러오는 저주를 가리키기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  english_pob_choice: sins
  chosen_korean: 죄를 짓고
  alternatives_korean:
  - 잘못을 저지르고
  - 해를 끼치고
  lexicon: HALOT
  rationale: 히브리어 חטא의 도덕적·종교적 강도를 살려 ‘죄를 짓다’로 옮기되, 법정 맥락이 드러나도록 자연스러운 연결형으로 처리했습니다.
- source_word: לְרֵעֵהוּ
  english_pob_choice: against his neighbor
  chosen_korean: 자기 이웃에게
  alternatives_korean:
  - 자기 동료에게
  - 다른 사람에게
  lexicon: HALOT
  rationale: רֵעַ의 관계적 의미를 살려 ‘이웃’으로 옮겼고, 전치사 관계는 한국어에서 자연스럽게 ‘-에게’로 풀었습니다.
- source_word: וְנָשָׁא ב֥וֹ אָלָה
  english_pob_choice: an oath is laid on him
  chosen_korean: 맹세가 그에게 부과되어
  alternatives_korean:
  - 그에게 맹세가 놓여져
  - 그에게 맹세가 얹혀
  lexicon: HALOT
  rationale: אָלה를 단순히 ‘저주’로 고정하지 않고, POB가 유지한 ‘oath/curse’의 긴장을 살려 법정적 의미의 ‘맹세’로 두었습니다. 또한 수동적 뉘앙스를 살려 ‘부과되어’로 옮겼습니다.
- source_word: לְהַאֲלֹתוֹ
  english_pob_choice: to make him swear
  chosen_korean: 그에게 맹세하게 하려고
  alternatives_korean:
  - 그를 맹세시키려고
  - 그에게 선서하게 하려고
  lexicon: HALOT
  rationale: 히필 원인의 힘을 살려 ‘-하게 하다’ 구조로 옮겨, 단순한 행위가 아니라 맹세를 강제하는 뜻을 분명히 했습니다.
- source_word: בַּבַּיִת הַזֶּה
  english_pob_choice: in this house
  chosen_korean: 이 집 안에서
  alternatives_korean:
  - 이 집에서
  - 이 성전 안에서
  lexicon: HALOT
  rationale: בַּיִת의 직역을 따라 ‘집’을 유지해 히브리어의 표현과 신학적 울림을 보존했습니다. 한국어에서는 제단과의 공간 관계를 분명히 하려고 ‘안에서’를 덧붙였습니다.
theological_decisions:
- issue: אָלָה를 ‘맹세’로 두고 ‘저주’ 의미를 전면화하지 않음
  chosen_reading: 본문의 절차적 의미는 ‘맹세’로 제시하고, ‘저주’ 가능성은 본문 밖의 해석 여지로 남깁니다.
  alternative_readings:
  - 저주
  - 맹세와 저주
  rationale: 이 절은 성전 앞에서의 사법적 맹세 절차를 말하므로, 주된 읽기는 ‘맹세’가 가장 적절합니다. 다만 히브리어 אָלָה가 위반 시 저주를 포함할 수 있는 긴장은 해소하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it'
