  source_fidelity: 히브리어의 조건절 구조와 법정 맹세의 수동적 부과(וְנָשָׂא בוֹ אָלָה), 맹세하게 하는 목적(לְהַאֲלֹתוֹ), 그리고 맹세가 제단 앞으로 나아오는 표현을 대체로 충실히 반영합니다. 다만 현행 문장은 ‘맹세하게 하려고 맹세가 그에게 부과되어’가 어색하게 중복되고, 뒤의 ‘이 집 안에서’가 ‘이르게 되면’에 붙어 공간 관계가 다소 불분명합니다.
  naturalness: ‘그에게 맹세하게 하려고 맹세가 그에게 부과되어’는 현대 한국어에서 반복적이고 무겁습니다. ‘그에게 맹세하게 하려고 맹세가 부과되고’로 고치고, 제단이 이 집 안에 있음을 ‘이 집 안에 있는 주의 제단 앞에’로 명시하면 자연스럽고 정확합니다. 절이 다음 절로 이어지는 조건절이므로 ‘되면’으로 끝나는 것은 적절합니다.
  terminology: ‘죄를 짓고’, ‘이웃’, ‘맹세’, ‘주의 제단’, ‘이 집’은 적절합니다. אָלָה의 저주 가능성을 각주에서 보존한 것도 타당합니다. 다만 각주의 ‘불려지는 저주’는 다소 부자연스러워 ‘불러오는 저주’로 다듬는 편이 좋습니다.
