base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/012.yaml
  text: Then Solomon said[a], “Yahweh said that he would dwell in the thick darkness.”
  footnotes:
  - marker: a
    text: Or “in the dark cloud.” The Hebrew עֲרָפֶל can denote dense darkness or dark cloud, especially in descriptions of the LORD’s manifest presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 솔로몬이 말했습니다. 「야훼께서 짙은 어둠 가운데에 거하시겠다고 말씀하셨습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘짙은 구름 가운데에’. 히브리어 עֲרָפֶל은 짙은 어둠이나 어두운 구름을 가리킬 수 있으며, 특히 야훼의 나타나심을 묘사할 때 쓰입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그 후에
  lexicon: HALOT
  rationale: 서술의 시간 진행을 나타내는 담화 표지로, 한국어에서는 자연스럽고 간결한 ‘그때’가 문맥의 순서를 잘 살립니다.
- source_word: אָמַר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 서술 도입으로서의 אָמַר을 현대 합쇼체로 옮기되, 뒤의 인용문이 야훼의 직접 발화를 포함하므로 전체 문장 흐름을 자연스럽게 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 전통 치환어가 아니라 직접 음역인 ‘야훼’를 사용하여 원문의 고유명을 보존했습니다.
- source_word: בָּעֲרָפֶל
  english_pob_choice: in the thick darkness
  chosen_korean: 짙은 어둠 가운데에
  alternatives_korean:
  - 짙은 어둠 속에
  - 짙은 구름 속에
  - 어두운 구름 가운데에
  lexicon: HALOT
  rationale: עֲרָפֶל의 핵심은 단순한 날씨 구름이 아니라 두터운 어둠이므로, 하나님의 임재와 연결되는 신학적 긴장을 살려 ‘짙은 어둠’으로 옮겼습니다.
theological_decisions:
- issue: '하나님의 거하심의 표상: 어둠/구름의 이중 의미'
  chosen_reading: ‘짙은 어둠 가운데에 거하시겠다고’로 옮겨, 본문의 신현적 역설을 유지했습니다.
  alternative_readings:
  - ‘짙은 구름 속에 거하시겠다고’
  - ‘어두운 구름 가운데에 거하시겠다고’
  rationale: עֲרָפֶל은 어둠과 구름의 의미를 모두 가질 수 있지만, 본문은 하나님의 임재를 너무 설명적으로 풀지 않고 오히려 감추어진 임재의 긴장을 드러냅니다.
  doctrine_reference: 신현 본문의 긴장 보존
