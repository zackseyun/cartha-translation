revisions:
- from: 주께서는 주의 종 내 아버지 다윗에게 말씀하신 것을 지키셨습니다[a]. 주께서는 입으로 말씀하시고, 손으로 그것을 이루셨으니[b], 오늘과 같습니다.
  to: 주께서는 주의 종인 제 아버지 다윗에게 하신 말씀을 지키셨습니다[a]. 주께서는 입으로 말씀하시고 손으로 그것을 이루셔서, 오늘 이와 같이 이루어졌습니다[b].
  rationale: 마지막 절을 ‘오늘 이와 같이 이루어졌습니다’로 고쳐 현재 확인되는 성취라는 히브리어 관용 표현의 뜻을 살렸습니다. 본문의 ‘입’과 ‘손’의 대구, 그리고 ‘지키다’와 ‘이루다’의 어휘적 구별은 유지했습니다. 각주 a는 다윗과 ‘제 아버지’의 동격 및 לְ의 가능한 ‘위하여’ 뉘앙스를 자연스러운 한국어로 제시하도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:45:30Z'
