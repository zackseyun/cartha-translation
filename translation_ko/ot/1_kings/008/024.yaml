source:
  edition: WLC
  text: אֲשֶׁ֣ר שָׁמַ֗רְתָּ לְ/עַבְדְּ/ךָ֙ דָּוִ֣ד אָבִ֔/י אֵ֥ת אֲשֶׁר דִּבַּ֖רְתָּ ל֑/וֹ וַ/תְּדַבֵּ֥ר בְּ/פִ֛י/ךָ וּ/בְ/יָדְ/ךָ֥ מִלֵּ֖אתָ כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/024.yaml
  text: who have kept for your servant David my father what you spoke to him[a]; you spoke with your mouth, and with your hand you have fulfilled it[b], as it is this day.
  footnotes:
  - marker: a
    text: Or 'to your servant David my father.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'you spoke with your mouth, and with your hand you fulfilled it'—a vivid way of saying that what God said, he also accomplished.
    reason: cultural_note
translation:
  language: ko
  text: 주께서는 주의 종 내 아버지 다윗에게 말씀하신 것을 지키셨습니다[a]. 주께서는 입으로 말씀하시고, 손으로 그것을 이루셨으니[b], 오늘과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 종 다윗 내 아버지에게’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘입으로 말씀하시고 손으로 이루셨다’고 하여, 하나님이 말씀하신 것을 실제로 실행하셨다는 뜻을 생생하게 드러냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  english_pob_choice: have kept
  chosen_korean: 지키셨습니다
  alternatives_korean:
  - 이루셨습니다
  - 보존하셨습니다
  lexicon: HALOT
  rationale: שׁמר는 여기서 약속을 ‘지키다, 보존하다’는 뜻으로 쓰였으므로, 앞의 ‘말씀하신 것’과 자연스럽게 결합하는 ‘지키셨습니다’가 가장 직접적입니다. 뒤의 מִלֵּאתָ는 별도로 ‘이루다’로 살려 구분했습니다.
- source_word: לְעַבְדְּךָ
  english_pob_choice: for your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 종에게
  - 주의 종을 위하여
  lexicon: HALOT
  rationale: ל+עבד는 헌신적 관계를 나타내는 관용구이므로, 한국어에서는 자연스럽게 ‘주의 종’으로 옮기되 문맥상 대상이 다윗임을 앞뒤 구조로 분명히 했습니다.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  english_pob_choice: and with your hand you have fulfilled it
  chosen_korean: 손으로 그것을 이루셨습니다
  alternatives_korean:
  - 손으로 그것을 성취하셨습니다
  - 손으로 그것을 완성하셨습니다
  lexicon: HALOT
  rationale: מלא는 말씀이나 약속을 실제로 ‘채워 이루다/성취하다’는 뜻이므로 ‘이루셨습니다’가 자연스럽습니다. ‘손’은 의도된 인격적 은유이므로 그대로 보존했습니다.
- source_word: בְּפִיךָ
  english_pob_choice: you spoke with your mouth
  chosen_korean: 입으로 말씀하시고
  alternatives_korean:
  - 입으로 말씀하셨고
  - 입으로 말씀하시며
  lexicon: HALOT
  rationale: 히브리어의 ‘입’과 ‘손’의 대구를 살리되, 한국어에서는 ‘말씀하시고’가 하나님의 발화를 더 분명하게 전달합니다. 단순한 ‘말하다’보다 문맥상 격이 맞습니다.
theological_decisions:
- issue: 하나님의 신체적 은유(입, 손)를 유지할지 여부
  chosen_reading: 입과 손의 구체적 이미지를 본문에 그대로 보존했습니다.
  alternative_readings:
  - ‘말씀하시고 이루셨습니다’처럼 은유를 평탄하게 풀어쓰기
  rationale: 본문은 하나님이 말씀하신 것과 행하신 것을 대조적으로 병렬시키므로, 이를 완화하면 수사적 힘과 본문의 의미 연결이 약해집니다. 따라서 인격적 은유를 유지하되 한국어 문장으로 자연스럽게 처리했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
