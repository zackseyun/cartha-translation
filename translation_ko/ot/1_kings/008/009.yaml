id: 1KI.8.9
reference: 1 Kings 8:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֗ק שְׁנֵי֙ לֻח֣וֹת הָ/אֲבָנִ֔ים אֲשֶׁ֨ר הִנִּ֥חַ שָׁ֛ם מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/009.yaml
  text: There was nothing in the ark except the two stone tablets that Moses had placed there at Horeb[c][b][a], where Yahweh made a covenant with the sons of Israel when they came out from the land of Egypt.
  footnotes:
  - marker: a
    text: Or 'the two tablets of stone.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'cut' a covenant; the idiom means 'made a covenant.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the Israelites' or 'the children of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 언약궤 안에는 모세가 호렙에서 두었던 두 돌판[a] 외에는 아무것도 없었습니다. 호렙은 야훼께서 이스라엘 자손[c]이 이집트 땅에서 나올 때 그들과 언약을 맺으신[b] 곳이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두 석판’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 문자적으로 ‘자르다’이며, ‘언약을 맺다’라는 관용적 뜻으로 쓰입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이스라엘 사람들’ 또는 ‘이스라엘의 자녀들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... רַק
  english_pob_choice: There was nothing ... except
  chosen_korean: 아무것도 없었습니다 ... 외에는
  alternatives_korean:
  - 없었습니다 ... 말고는
  - 아무것도 없었습니다 ... except
  lexicon: HALOT
  rationale: 부정 존재문 뒤의 예외 표현을 한국어 자연문으로 옮기되, 궤 안에 들어 있는 것의 유일성을 분명히 살렸습니다.
- source_word: בָּאָרוֹן
  english_pob_choice: in the ark
  chosen_korean: 언약궤 안에는
  alternatives_korean:
  - 궤 안에는
  - 언약궤 속에는
  lexicon: HALOT
  rationale: אָרוֹן을 성막 맥락의 고유한 물건으로 드러내기 위해 ‘언약궤’로 옮겼고, 위치 표현은 문장 흐름에 맞게 ‘안에는’로 처리했습니다.
- source_word: שְׁנֵי לֻחוֹת הָאֲבָנִים
  english_pob_choice: the two stone tablets
  chosen_korean: 두 돌판
  alternatives_korean:
  - 두 석판
  - 두 돌로 된 판
  lexicon: HALOT
  rationale: ‘stone tablets’의 핵심은 재질을 나타내는 중복 없는 한국어 표현이므로, 간결하게 ‘돌판’으로 옮겼습니다. ‘두’는 수량을 앞에 두어 자연스럽게 했습니다.
- source_word: אֲשֶׁר הִנִּחַ שָׁם מֹשֶׁה בְּחֹרֵב
  english_pob_choice: that Moses had placed there at Horeb
  chosen_korean: 모세가 호렙에서 거기 두었던
  alternatives_korean:
  - 모세가 호렙에서 거기 놓아 둔
  - 모세가 호렙에 거기 두었던
  lexicon: HALOT
  rationale: הִנִּיחַ는 ‘두다/놓다/두어 두다’의 의미이므로 ‘두었던’으로 옮겨, 이미 거기에 있었던 상태를 회고적으로 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유한 신적 이름 יְהוָה는 본 프로젝트 기본값대로 ‘야훼’로 옮겨, 호칭어로 대체하지 않았습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역 가능하면서도 한국어 성경에서 통용되는 형태로 살렸습니다. ‘자손’이 계보적 공동체를 드러냅니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 문맥상 언약 체결의 주체가 되는 신적 이름을 제목어로 바꾸지 않고 보존해야 하므로, 공공 번역 원칙에 따라 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: כָּרַת ... בְּרִית의 관용구 처리
  chosen_reading: 언약을 맺으신
  alternative_readings:
  - 언약을 끊으신
  - 언약을 자르신
  rationale: 히브리어의 문자적 ‘자르다’는 한국어에서 관용적으로는 의미 전달이 약하므로, 독자가 사건의 신학적 의미를 바로 이해하도록 ‘언약을 맺으신’으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
