revisions:
- from: 언약궤 안에는 모세가 호렙에서 거기 두었던 두 돌판 외에는 아무것도 없었습니다. 그곳은 야훼께서 이스라엘 자손과 언약을 맺으신 자리로, 그들이 이집트 땅에서 나왔을 때였습니다.[a][b][c]
  to: 언약궤 안에는 모세가 호렙에서 두었던 두 돌판[a] 외에는 아무것도 없었습니다. 호렙은 야훼께서 이스라엘 자손[c]이 이집트 땅에서 나올 때 그들과 언약을 맺으신[b] 곳이었습니다.
  rationale: 'The revision preserves the Hebrew sequence and reference: only the two tablets were in the ark; Moses had placed them at Horeb; and Horeb is identified as the place where Yahweh made the covenant with the Israelites at the exodus. It removes redundant wording, repairs the Korean syntax, retains established key terms, and relocates each footnote anchor to its relevant expression.'
  reviewer_model: gpt-5.6-terra
