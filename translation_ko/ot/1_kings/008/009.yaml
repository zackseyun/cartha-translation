    text: 또는 ‘이스라엘 사람들’ 또는 ‘이스라엘의 자녀들’.
    reason: lexical_alternative
  revision_rationale: 'The revision preserves the Hebrew sequence and reference: only the two tablets were in the ark; Moses had placed them at Horeb; and Horeb is identified as the place where Yahweh made the covenant with the Israelites at the exodus. It removes redundant wording, repairs the Korean syntax, retains established key terms, and relocates each footnote anchor to its relevant expression.'
