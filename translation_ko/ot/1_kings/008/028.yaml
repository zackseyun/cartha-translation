  to: 그러나 주의 종의 기도와 그가 은혜를 구하는 간구[a]를 돌아보셔서, 야훼, 나의 하나님이시여, 오늘 주의 종이 주 앞에서 드리는 부르짖음[b]과 기도를 들으소서.
