  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָֽ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֧ר עַבְדְּ/ךָ֛ מִתְפַּלֵּ֥ל לְ/פָנֶ֖י/ךָ הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/028.yaml
  text: Yet turn toward the prayer of your servant and to his plea for favor[a], O Yahweh my God[b], to hear the cry and the prayer that your servant is praying before you today.
  footnotes:
  - marker: a
    text: Or 'his supplication.' The Hebrew term denotes an earnest plea for mercy or favor.
    reason: lexical_alternative
  - marker: b
    text: Or 'the ringing cry.' The Hebrew word can refer to a loud cry or shout; here it is best understood as a cry to God in prayer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주의 종의 기도와 그의 은혜를 구하는 간구에 돌이키셔서, 야훼 내 하나님이시여, 오늘 주의 종이 주 앞에서 드리는 부르짖음과 기도를 들으소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 간구’. 히브리어 תְּחִנָּה는 자비나 호의를 구하는 간절한 청원을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘부르짖음’. 히브리어 רִנָּה는 여기서 기도와 병행되는 큰 소리의 외침을 가리키는 것으로 이해하는 것이 가장 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  english_pob_choice: Yet turn toward
  chosen_korean: 돌이키셔서
  alternatives_korean:
  - 돌아보셔서
  - 향하여 주셔서
  - 돌이셔서
  lexicon: HALOT
  rationale: פּנה의 기본 의미인 ‘돌다/돌이키다’를 살리면서, 기도 청원에서 하나님이 주의를 기울이시는 뉘앙스를 자연스럽게 표현했습니다.
- source_word: תְּחִנָּתוֹ
  english_pob_choice: his plea for favor
  chosen_korean: 은혜를 구하는 간구
  alternatives_korean:
  - 간구
  - 호소
  - 긍휼을 구하는 간청
  lexicon: HALOT
  rationale: תְּחִנָּה는 단순한 부탁보다 자비와 호의를 구하는 애절한 청원을 뜻하므로, POB의 의미를 따라 ‘은혜를 구하는 간구’로 풀었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥상 신명사직을 지닌 고유명사이므로, 관용적 대체어인 ‘주’ 대신 프로젝트 기본값인 ‘야훼’를 사용했습니다.
- source_word: הָרִנָּה
  english_pob_choice: the cry
  chosen_korean: 부르짖음
  alternatives_korean:
  - 외침
  - 울부짖음
  - 환호
  lexicon: HALOT
  rationale: רִנָּה는 기쁨의 외침도 가능하지만 여기서는 기도와 평행을 이루는 간절한 소리이므로, 문맥에 맞게 ‘부르짖음’으로 옮겼습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 당신의 종
  - 주의 노예
  lexicon: HALOT
  rationale: 왕의 겸손한 자기호칭과 하나님께 드리는 경어적 표현이므로, 예배 문맥의 표준적이면서도 직역에 가까운 ‘주의 종’을 택했습니다.
theological_decisions:
- issue: יהוה를 어떻게 표기할지
  chosen_reading: ‘야훼’로 본문에 직접 표기했습니다.
  alternative_readings:
  - ‘주’로 치환
  - ‘여호와’ 사용
  rationale: 원문이 신명사를 직접 사용하므로, 대체 칭호로 가리기보다 고유한 언약 이름을 드러내는 것이 본문의 신학적 무게를 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
