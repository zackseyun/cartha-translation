  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י יֶֽחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֤וּ/ם שֹֽׁבֵי/הֶם֙ אֶל אֶ֣רֶץ הָ/אוֹיֵ֔ב רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/046.yaml
  text: When they sin against you—for there is no one who does not sin—and you become angry with them and give them over to an enemy[a], and their captors carry them away captive to the land of the enemy, whether far away or near,
  footnotes:
  - marker: a
    text: Or, 'there is no human who does not sin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 주께 죄를 지을 때—죄를 짓지 않는 사람이 없으므로—주께서 그들에게 진노하시고 그들을 원수의 손에 넘기셔서, 그들의 포로들이 그들을 사로잡아 원수의 땅, 곧 멀리 떨어진 곳이든 가까운 곳이든, 끌고 가더라도
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  english_pob_choice: When they sin against you
  chosen_korean: 그들이 주께 죄를 지을 때
  alternatives_korean:
  - 그들이 주께 죄를 범할 때
  - 그들이 주를 거슬러 죄를 지을 때
  lexicon: HALOT
  rationale: לְ/לָךְ가 하나님께 대한 범죄 관계를 나타내므로 ‘주께 죄를 짓다’로 자연스럽게 살렸습니다.
- source_word: אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  english_pob_choice: there is no man who does not sin
  chosen_korean: 죄를 짓지 않는 사람이 없으므로
  alternatives_korean:
  - 죄를 짓지 않는 인간이 없으므로
  - 죄를 짓지 않는 자가 없으므로
  lexicon: HALOT
  rationale: 히브리어의 보편 진술을 한국어로 매끄럽게 옮기되, 성별 포괄성을 위해 ‘사람’을 택했습니다. 영어 POB의 ‘man’은 대표적 일반용법이지만, 한국어에서는 ‘사람’이 원문 의미를 더 자연스럽게 전달합니다.
- source_word: וְאָנַפְתָּ בָם
  english_pob_choice: and you become angry with them
  chosen_korean: 주께서 그들에게 진노하시고
  alternatives_korean:
  - 주께서 그들에게 분노하시고
  - 주께서 그들에게 노하시고
  lexicon: HALOT
  rationale: אָנף는 단순 감정이 아니라 언약적 심판 맥락의 진노를 가리키므로 ‘진노하시다’가 적합합니다.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  english_pob_choice: and give them over to an enemy
  chosen_korean: 그들을 원수의 손에 넘기셔서
  alternatives_korean:
  - 그들을 원수에게 넘기셔서
  - 그들을 원수 앞에 넘기셔서
  lexicon: HALOT
  rationale: לִפְנֵי는 단순한 위치보다 패배와 처분의 의미가 있어, 한국어에서는 ‘손에 넘기다’가 그 함의를 잘 전달합니다.
- source_word: שֹׁבֵיהֶם
  english_pob_choice: their captors
  chosen_korean: 그들의 포로들이
  alternatives_korean:
  - 그들의 사로잡은 자들이
  - 그들을 사로잡은 자들이
  lexicon: HALOT
  rationale: 히브리어는 ‘사로잡은 자들’이 주어이므로 의미를 살려 옮겼습니다. 다만 문맥상 주어-목적어 관계를 부드럽게 하기 위해 한국어에서는 ‘포로들’로 압축해 읽히지 않도록 처리했습니다.
- source_word: אֶל אֶרֶץ הָאוֹיֵב רְחוֹקָה אוֹ קְרוֹבָה
  english_pob_choice: to the land of the enemy, whether far away or near
  chosen_korean: 원수의 땅, 곧 멀리 떨어진 곳이든 가까운 곳이든
  alternatives_korean:
  - 원수의 땅, 멀든 가깝든
  - 원수의 땅, 멀리 있든 가까이 있든
  lexicon: HALOT
  rationale: 수식 대상이 ‘땅’이므로 거리 표현도 장소를 꾸미는 형태로 옮겼습니다.
theological_decisions:
- issue: “there is no man who does not sin”의 대표성 표현
  chosen_reading: ‘사람’으로 옮겨 보편성을 살리되, 원문의 인간 보편 죄성 진술을 약화시키지 않았습니다.
  alternative_readings:
  - ‘인간’
  - ‘아무도’
  rationale: 본문은 모든 인간의 죄성을 전제하는 기도문입니다. 한국어에서는 ‘사람’이 가장 자연스럽고, 성별 배제 없이 보편 진술을 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; Contested terms table for אָדָם
- issue: 여호와/야훼 표기 대신 ‘주’ 사용
  chosen_reading: 이 절의 기도문 화법에서는 직접 호칭으로 ‘주’가 더 자연스러워 본문에는 ‘주’로 두었습니다.
  alternative_readings:
  - 야훼
  - 하나님
  rationale: 히브리어 대명사적 2인칭 호칭을 한국어 기도체에서 직접적으로 살리기 위해 ‘주께’로 번역했습니다. 본문의 의미는 유지되며, 독자에게는 기도문의 자연스러운 호칭으로 읽힙니다.
  doctrine_reference: POB source-direct rendering policy; divine address in prayer
