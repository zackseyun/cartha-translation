source:
  edition: WLC
  text: וָ/אָשִׂ֨ם שָׁ֤ם מָקוֹם֙ לָֽ/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֤ר כָּרַת֙ עִם אֲבֹתֵ֔י/נוּ בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/021.yaml
  text: And there I have set a place for the ark[b][a], in which is the covenant of Yahweh that he made with our fathers when he brought them out of the land of Egypt.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the covenant of the LORD that he cut with our fathers.'
    reason: lexical_alternative
  - marker: b
    text: 'Or ''with our ancestors.'' Hebrew: ''with our fathers.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 거기에는 야훼의 언약이 있는 궤를 위한 자리를 마련했습니다. 그 언약은 야훼께서 우리 조상들과 이집트 땅에서 그들을 이끌어 내실 때 맺으신 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘우리 조상들과 맺은 야훼의 언약’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂם
  english_pob_choice: I have set
  chosen_korean: 마련했습니다
  alternatives_korean:
  - 두었습니다
  - 세웠습니다
  - 놓았습니다
  lexicon: HALOT
  rationale: שׂוּם의 기본 뜻인 ‘두다/놓다/설정하다’를 자연스러운 한국어로 옮기되, 성전 안에 ‘자리를 마련하다’는 맥락을 살려 어색한 직역을 피했습니다.
- source_word: מָקוֹם לָאָרוֹן
  english_pob_choice: a place for the ark
  chosen_korean: 궤를 위한 자리
  alternatives_korean:
  - 궤를 위한 장소
  - 궤를 위한 자리를
  - 궤를 위한 터
  lexicon: HALOT
  rationale: מָקוֹם은 일반적인 ‘장소’보다 문맥상 기능적 의미가 강하므로, 성전 배치에 맞는 ‘자리’로 옮겼습니다.
- source_word: בְּרִית יְהוָה
  english_pob_choice: the covenant of Yahweh
  chosen_korean: 야훼의 언약
  alternatives_korean:
  - 야훼와의 언약
  - 야훼의 계약
  lexicon: HALOT
  rationale: בְּרִית는 성경적 맥락에서 ‘언약’이 가장 직접적이며, יְהוָה는 본 프로젝트의 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: עִם אֲבֹתֵינוּ
  english_pob_choice: with our fathers
  chosen_korean: 우리 조상들과
  alternatives_korean:
  - 우리 조상들과
  - 우리 아버지들과
  lexicon: HALOT
  rationale: 히브리어는 남성 복수이지만 한국어에서 ‘우리 조상들’이 혈통 공동체를 자연스럽게 드러내며, 남성성을 과도하게 전면화하지 않으면서도 의미를 보존합니다.
- source_word: בְּהוֹצִיאוֹ אֹתָם
  english_pob_choice: when he brought them out
  chosen_korean: 그들을 이끌어 내실 때
  alternatives_korean:
  - 그들을 인도해 내실 때
  - 그들을 이집트에서 데리고 나오실 때
  lexicon: HALOT
  rationale: 출애굽 공식에서 הוֹצִיא는 단순한 ‘꺼내다’보다 구출·인도의 뉘앙스를 갖기 때문에, ‘이끌어 내다’로 옮겨 동작의 방향성과 주권적 행위를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문서 기준에 따라 여호와가 아닌 ‘야훼’를 사용해 고유 이름을 보존했습니다.
theological_decisions:
- issue: 언약궤와 언약의 위치 관계
  chosen_reading: ‘궤를 위한 자리’와 ‘그 언약이 있는’ 구조를 유지해, 궤 자체와 그 안에 있는 언약의 관계를 분리해 드러냈습니다.
  alternative_readings:
  - ‘언약궤’를 한 번에 묶어 번역
  - ‘상자’로 일반화
  rationale: 히브리어는 궤(אָרוֹן)와 그 안의 언약(בְּרִית)을 구분합니다. 한국어도 이 구분을 유지하는 편이 원문 의미를 더 분명히 드러냅니다.
  doctrine_reference: '번역 원칙: 원문 구조 보존 및 용어 일관성'
- issue: YHWH의 표기
  chosen_reading: ‘야훼’
  alternative_readings:
  - ‘주’
  - ‘여호와’
  rationale: 본문이 여호와 대신 대체어를 요구하지 않으며, 프로젝트 기준은 신명기적 고유성을 살리는 ‘야훼’를 채택합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
