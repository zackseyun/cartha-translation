  rationale: 출애굽 공식에서 הוֹצִיא는 단순한 ‘꺼내다’보다 구출·인도의 뉘앙스를 갖기 때문에, ‘이끌어 내다’로 옮겨 동작의 방향성과 주권적 행위를 살렸습니다.
