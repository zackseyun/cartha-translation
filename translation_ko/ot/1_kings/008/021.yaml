  rationale: 문서 기준에 따라 여호와가 아닌 ‘야훼’를 사용해 고유 이름을 보존했습니다.
theological_decisions:
- issue: 언약궤와 언약의 위치 관계
  chosen_reading: ‘궤를 위한 자리’와 ‘그 언약이 있는’ 구조를 유지해, 궤 자체와 그 안에 있는 언약의 관계를 분리해 드러냈습니다.
  alternative_readings:
  - ‘언약궤’를 한 번에 묶어 번역
  - ‘상자’로 일반화
  rationale: 히브리어는 궤(אָרוֹן)와 그 안의 언약(בְּרִית)을 구분합니다. 한국어도 이 구분을 유지하는 편이 원문 의미를 더 분명히 드러냅니다.
  doctrine_reference: '번역 원칙: 원문 구조 보존 및 용어 일관성'
- issue: YHWH의 표기
  chosen_reading: ‘야훼’
  alternative_readings:
  - ‘주’
  - ‘여호와’
  rationale: 본문이 여호와 대신 대체어를 요구하지 않으며, 프로젝트 기준은 신명기적 고유성을 살리는 ‘야훼’를 채택합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
