  text: 그리고 나는 그곳에 야훼께서 우리 조상들과 이집트 땅에서 그들을 이끌어 내실 때 맺으신 언약이 들어 있는 궤를 둘 자리를 마련했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
