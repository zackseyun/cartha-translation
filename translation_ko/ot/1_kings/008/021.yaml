  to: 그리고 나는 그곳에 야훼께서 우리 조상들과 이집트 땅에서 그들을 이끌어 내실 때 맺으신 언약이 들어 있는 궤를 둘 자리를 마련했습니다.[a]
  rationale: 수정문은 ‘궤를 둘 자리’를 마련한 행위와 ‘그 궤 안에 있는 야훼의 언약’이라는 원문의 수식 관계를 한 문장 안에서 분명히 연결했습니다. 시간 절은 야훼께서 이집트에서 이끌어 내신 때에 조상들과 언약을 맺으셨다는 원문 의미를 유지했습니다. 각주는 히브리어의 ‘언약을 자르다’ 관용구를 정확히 반영하도록 고쳤습니다.
