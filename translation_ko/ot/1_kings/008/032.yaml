id: 1KI.8.32
reference: 1 Kings 8:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/עָשִׂ֨יתָ֙ וְ/שָׁפַטְתָּ֣ אֶת עֲבָדֶ֔י/ךָ לְ/הַרְשִׁ֣יעַ רָשָׁ֔ע לָ/תֵ֥ת דַּרְכּ֖/וֹ בְּ/רֹאשׁ֑/וֹ וּ/לְ/הַצְדִּ֣יק צַדִּ֔יק לָ֥/תֶת ל֖/וֹ כְּ/צִדְקָתֽ/וֹ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/032.yaml
  text: then hear in heaven and act[a], and judge your servants, condemning the wicked by bringing his way upon his own head[c][b], and justifying the righteous by giving to him according to his righteousness.
  footnotes:
  - marker: a
    text: Or 'hear from heaven.' The Hebrew literally says 'hear the heavens/heaven,' a prayer formula that can be expressed in English either as God's hearing in heaven or from heaven.
    reason: lexical_alternative
  - marker: b
    text: '''Bringing his way upon his own head'' is a Hebrew idiom meaning to repay a person according to his conduct.'
    reason: cultural_note
  - marker: c
    text: Or 'declaring the righteous innocent' / 'vindicating the righteous.'
    reason: alternative_reading
translation:
  language: ko
  text: 주님, 하늘에서 들으시고 행하셔서 주님의 종들을 심판해 주십시오. 악한 자를 정죄하시고 그의 행실을 그의 머리 위에 돌려주시며[a], 의로운 자를 의롭다고 선언하시고 그의 의에 따라 그에게 갚아 주십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 길을 그의 머리 위에 두다’입니다. 여기서는 사람의 행실에 따라 그에게 되갚는다는 히브리어 관용구입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘의로운 자를 무죄하다고 선언하시고’ / ‘의로운 자를 변호해 주시고’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  english_pob_choice: hear in heaven
  chosen_korean: 하늘에서 들으시고
  alternatives_korean:
  - 하늘에서 들으소서
  - 하늘을 들으시고
  lexicon: HALOT
  rationale: 기도 공식에서 ‘하늘’은 장소를 나타내는 부사적 표현이므로, 한국어도 자연스럽게 ‘하늘에서 들으시고’로 옮겨 원문의 공간적 뉘앙스를 살렸습니다.
- source_word: וְעָשִׂיתָ
  english_pob_choice: and act
  chosen_korean: 행하사
  alternatives_korean:
  - 행하시고
  - 하시고
  lexicon: HALOT
  rationale: עשה는 일반적인 ‘하다’보다 응답적 개입의 의미가 강하므로, 하나님께 대한 기도문 흐름에 맞게 ‘행하사’로 옮겼습니다.
- source_word: לְהַרְשִׁיעַ רָשָׁע
  english_pob_choice: condemning the wicked
  chosen_korean: 악한 자는
  alternatives_korean:
  - 악인을 정죄하며
  - 악인을 죄 있다 하시며
  lexicon: HALOT
  rationale: 히필 형태는 법정적 ‘유죄 판결/정죄’의 뜻이므로, 본문 구조를 살리되 한국어 문장에서는 결과를 앞세운 ‘악한 자는’으로 풀어 ‘정죄’ 의미가 드러나게 했습니다.
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  english_pob_choice: by bringing his way upon his own head
  chosen_korean: 그의 행위대로 그의 머리 위에 돌려주시고
  alternatives_korean:
  - 그의 길을 그의 머리 위에 두시고
  - 그의 행실을 그의 머리로 돌리시고
  lexicon: HALOT
  rationale: ‘way’는 행위/삶의 방향을 뜻하는 관용구이므로 ‘행위대로’로 풀고, ‘머리 위에’는 보복적 되갚음을 나타내는 히브리어 이미지를 그대로 살렸습니다.
- source_word: וּלְהַצְדִּיק צַדִּיק
  english_pob_choice: and justifying the righteous
  chosen_korean: 의로운 자는
  alternatives_korean:
  - 의인을 의롭다 하시고
  - 의로운 자를 의롭게 하시고
  lexicon: HALOT
  rationale: 히필 צדק은 법정적 ‘의롭다 하다’이므로, 앞의 ‘정죄’와 평행을 이루도록 한국어 본문에서는 대상인 ‘의로운 자는’으로 시작해 뒤의 ‘의롭게 해 주십시오’로 뜻을 드러냈습니다.
theological_decisions:
- issue: 법정적 어휘를 한국어에서 어떻게 유지할지
  chosen_reading: ‘정죄’와 ‘의롭게 해 주십시오’의 법정적 대응을 살리되, 문장은 기도체로 자연스럽게 다듬었습니다.
  alternative_readings:
  - ‘벌하시고’와 ‘칭찬하시고’처럼 일반적 표현으로 완화
  - ‘무죄로 선언해 주십시오’와 같이 더 직설적인 법정어 사용
  rationale: 본문은 왕의 기도 속 중재적 심판을 말하므로, 도덕적 일반화보다 재판적 선고의 긴장을 유지하는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 원문 우선, 법정적 칭의/정죄의 대조 보존
- issue: ‘머리 위에’ 보복 이미지의 직역 수준
  chosen_reading: 히브리어 관용구를 살려 ‘그의 머리 위에 돌려주시고’로 표현했습니다.
  alternative_readings:
  - ‘그의 대가를 그에게 되돌려주시고’
  - ‘그가 한 대로 갚아주시고’
  rationale: 관용구를 완전히 풀어쓰면 원문의 생생한 상징성이 약해지므로, 의미는 분명하게 하되 이미지는 유지했습니다.
  doctrine_reference: 원문 이미지 보존과 의미 명료성의 균형
