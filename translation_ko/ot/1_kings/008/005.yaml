    rationale: 원문은 너무 많아서 셀 수 없는 양과 소를 희생시켰다는 뜻이지, 셀 수 없을 ‘만큼’ 바쳤다는 양태를 말하는 것이 아닙니다.
  - severity: low
    issue: 각주가 본문과 동일한 ‘그 앞에 모인’을 대안으로 제시하고 문장 끝에 표지되어 있습니다.
