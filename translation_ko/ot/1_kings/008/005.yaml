base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/005.yaml
  text: And King Solomon[a], and all the assembly of Israel who had assembled before him, were with him before the ark, sacrificing sheep and cattle that could not be counted or numbered because of their great number.
  footnotes:
  - marker: a
    text: Or "who had assembled before him." The Hebrew expression may emphasize the people convened in relation to Solomon.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬 왕과, 그 앞에 모인 이스라엘의 온 회중은 모두 그와 함께 궤 앞에 있으면서 양과 소를, 그 많음 때문에 셀 수도 헤아릴 수도 없는 만큼 바치고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 앞에 모인.” 히브리어 표현은 솔로몬과의 관련 속에서 백성이 소집되었음을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  english_pob_choice: assembly of Israel
  chosen_korean: 이스라엘의 온 회중
  alternatives_korean:
  - 이스라엘의 회중
  - 이스라엘의 집회
  - 이스라엘의 공동체
  lexicon: HALOT
  rationale: 공적 예식 장면의 모인 무리를 자연스럽게 살리면서, 이후 교회적 뉘앙스를 과도하게 불러오지 않도록 했습니다.
- source_word: הַנּוֹעָדִים עָלָיו
  english_pob_choice: who had assembled before him
  chosen_korean: 그 앞에 모인
  alternatives_korean:
  - 그에게 모여든
  - 그와 함께 모인
  - 그에게로 집결한
  lexicon: HALOT
  rationale: עָלָיו의 방향성을 살려 솔로몬을 향해/앞에 모인다는 의미를 간결하게 반영했습니다.
- source_word: לִפְנֵי הָאָרוֹן
  english_pob_choice: before the ark
  chosen_korean: 궤 앞에
  alternatives_korean:
  - 언약궤 앞에
  - 궤 앞에서
  - 법궤 앞에
  lexicon: HALOT
  rationale: 본문에는 단순히 ‘궤’만 있으므로, 영어 POB처럼 본문에 없는 보충어를 덧붙이지 않았습니다.
- source_word: מְזַבְּחִים צֹאן וּבָקָר
  english_pob_choice: sacrificing sheep and cattle
  chosen_korean: 양과 소를… 바치고 있었습니다
  alternatives_korean:
  - 양과 소를 제사드리고 있었습니다
  - 양과 소를 희생제로 드리고 있었습니다
  - 양과 소를 희생하고 있었습니다
  lexicon: HALOT
  rationale: מְזַבְּחִים의 제의적 행위를 살리되, 한국어에서는 ‘바치다’가 자연스럽고 문맥상 제물 봉헌을 충분히 드러냅니다.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ מֵרֹב
  english_pob_choice: that could not be counted or numbered because of their great number
  chosen_korean: 그 많음 때문에 셀 수도 헤아릴 수도 없는
  alternatives_korean:
  - 그 수가 너무 많아 셀 수도 헤아릴 수도 없는
  - 헤아릴 수도 없고 셀 수도 없는
  - 그 많음 때문에 셀 수도 없고 헤아릴 수도 없는
  lexicon: HALOT
  rationale: 두 동사의 병렬을 보존해 ‘counted or numbered’의 중복 강조를 살렸고, מֵרֹב은 원인절로 옮겼습니다.
theological_decisions:
- issue: ‘궤’의 구체화 여부
  chosen_reading: 본문 표현을 따라 단순히 ‘궤’로 옮기고, ‘언약궤/법궤’로 확장하지 않았습니다.
  alternative_readings:
  - 언약궤
  - 법궤
  - 하나님의 궤
  rationale: 히브리어 본문은 이 절에서 פשוט히 הָאָרוֹן만 말하므로, 전통적 확장은 다른 문맥의 정보를 덧입히는 것이 될 수 있습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition.'
