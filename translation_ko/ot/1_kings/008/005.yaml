- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ מֵרֹב
  english_pob_choice: that could not be counted or numbered because of their great number
  chosen_korean: 그 많음 때문에 셀 수도 헤아릴 수도 없는
  alternatives_korean:
  - 그 수가 너무 많아 셀 수도 헤아릴 수도 없는
  - 헤아릴 수도 없고 셀 수도 없는
  - 그 많음 때문에 셀 수도 없고 헤아릴 수도 없는
  lexicon: HALOT
  rationale: 두 동사의 병렬을 보존해 ‘counted or numbered’의 중복 강조를 살렸고, מֵרֹב은 원인절로 옮겼습니다.
theological_decisions:
- issue: ‘궤’의 구체화 여부
  chosen_reading: 본문 표현을 따라 단순히 ‘궤’로 옮기고, ‘언약궤/법궤’로 확장하지 않았습니다.
  alternative_readings:
  - 언약궤
  - 법궤
  - 하나님의 궤
  rationale: 히브리어 본문은 이 절에서 פשוט히 הָאָרוֹן만 말하므로, 전통적 확장은 다른 문맥의 정보를 덧입히는 것이 될 수 있습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition.'
