  text: וְ/גַם֙ אֶל הַ/נָּכְרִ֔י אֲשֶׁ֛ר לֹא מֵ/עַמְּ/ךָ֥ יִשְׂרָאֵ֖ל ה֑וּא וּ/בָ֛א מֵ/אֶ֥רֶץ רְחוֹקָ֖ה לְמַ֥עַן שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/041.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land for the sake of your name—
  footnotes:
  - marker: a
    text: Or 'the stranger' or 'the outsider.' The Hebrew refers to a non-Israelite, not merely a traveler.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 외국인, 곧 당신의 백성 이스라엘에 속하지 않은 사람이 먼 나라에서 와서 당신의 이름을 위하여 기도할 때도 —[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나그네’, ‘외지 사람’. 히브리어는 단순한 여행자가 아니라 비이스라엘 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: And also
  chosen_korean: 또
  alternatives_korean:
  - 그리고 또한
  - 또한
  lexicon: HALOT
  rationale: 앞 절의 간구에 항목을 덧붙이는 연결어로, 간결한 ‘또’가 누적·첨가의 힘을 자연스럽게 살립니다.
- source_word: הַנָּכְרִי
  english_pob_choice: the foreigner
  chosen_korean: 외국인
  alternatives_korean:
  - 나그네
  - 이방인
  - 외지 사람
  lexicon: HALOT
  rationale: נָכְרִי는 이스라엘 바깥의 비이스라엘 사람을 가리키므로, 현대 한국어에서 가장 분명한 ‘외국인’을 선택했습니다. 전통 교회어 ‘이방인’은 문맥상 의미는 가질 수 있으나 현대 독자에게 종교적·민족적 뉘앙스가 과도하게 달라질 수 있습니다.
- source_word: מֵעַמְּךָ יִשְׂרָאֵל
  english_pob_choice: not from your people Israel
  chosen_korean: 당신의 백성 이스라엘에 속하지 않은
  alternatives_korean:
  - 당신의 백성 이스라엘에게서 난 것이 아닌
  - 당신의 백성 이스라엘에 속한 사람이 아닌
  lexicon: HALOT
  rationale: 직역보다 관계적 소속을 드러내는 표현이 히브리어의 언약적 구분을 더 분명히 살립니다.
- source_word: לְמַעַן שְׁמֶךָ
  english_pob_choice: for the sake of your name
  chosen_korean: 당신의 이름을 위하여
  alternatives_korean:
  - 당신의 이름 때문에
  - 당신의 이름의 खातिर
  lexicon: HALOT
  rationale: ‘이름’은 단순 호칭이 아니라 하나님 자신의 명성과 드러난 존재를 가리키므로, 목적을 나타내는 ‘위하여’로 보존했습니다. 한국어에서 자연성을 해치지 않으면서도 신학적 무게를 유지합니다.
theological_decisions:
- issue: 비이스라엘인을 가리키는 용어의 뉘앙스
  chosen_reading: ‘외국인’으로 옮겨 비이스라엘인의 정체성을 분명히 했습니다.
  alternative_readings:
  - ‘나그네’로 완화하여 옮김
  - ‘이방인’으로 교회 전통어를 사용함
  rationale: 본문의 초점은 단순 여행자가 아니라 이스라엘 공동체 밖의 사람입니다. 따라서 사회적 체류자를 뜻하기 쉬운 ‘나그네’보다, 언약 공동체 밖의 사람이라는 대비를 드러내는 번역이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 6
