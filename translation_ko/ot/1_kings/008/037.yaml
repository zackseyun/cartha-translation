  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִ֠הְיֶה שִׁדָּפ֨וֹן יֵרָק֜וֹן אַרְבֶּ֤ה חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אֹיְב֖/וֹ בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע כָּֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/037.yaml
  text: If there is famine in the land[a], if there is pestilence, blight, mildew, locust, or caterpillar; if his enemy besieges him in the land of his gates; whatever plague[b], whatever sickness—
  footnotes:
  - marker: a
    text: Or 'caterpillar'; the Hebrew term may refer more broadly to a devouring locust or a particular stage/kind of locust.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in the land of his gates,' with 'gates' standing for the cities or towns of the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅에 기근이 있거나, 전염병이 있거나, 곡식이 타들어 가거나 누렇게 시들거나, 메뚜기나 애벌레[a]가 있거나, 그의 원수가 그의 성읍들에서 그를 포위하거나[b], 어떤 재앙이든지 어떤 질병이든지 있을 때에—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘메뚜기 종류’ 또는 메뚜기의 특정 발육 단계. 히브리어 낱말이 가리키는 정확한 종류는 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 성문들의 땅에서’입니다. 여기서 ‘성문’은 성읍 또는 도시를 가리킵니다.
    reason: lexical_alternative
