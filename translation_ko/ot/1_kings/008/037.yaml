language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִ֠הְיֶה שִׁדָּפ֨וֹן יֵרָק֜וֹן אַרְבֶּ֤ה חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אֹיְב֖/וֹ בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע כָּֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/037.yaml
  text: If there is famine in the land[a], if there is pestilence, blight, mildew, locust, or caterpillar; if his enemy besieges him in the land of his gates; whatever plague[b], whatever sickness—
  footnotes:
  - marker: a
    text: Or 'caterpillar'; the Hebrew term may refer more broadly to a devouring locust or a particular stage/kind of locust.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in the land of his gates,' with 'gates' standing for the cities or towns of the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅에 기근이 있거나[a], 전염병이나, 곰팡이 병, 깜부기병, 메뚜기, 혹은 애벌레가 있거나, 그의 원수가 자기 성읍들의 땅에서 그를 에워싸거나[b], 어떤 재앙이든지, 어떤 질병이든지 있을 때에—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘메뚜기류로 더 넓게 이해할 수 있는 애벌레’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 성문들의 땅에서’이며, ‘성문’은 도시를 가리키는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  english_pob_choice: famine
  chosen_korean: 기근
  alternatives_korean:
  - 굶주림
  lexicon: HALOT
  rationale: 재난 목록에서는 일반적 배고픔보다 국가적·사회적 재난인 ‘기근’이 מתאים하며, 본문의 심판 맥락도 이를 요구합니다.
- source_word: דֶּבֶר
  english_pob_choice: pestilence
  chosen_korean: 전염병
  alternatives_korean:
  - 역병
  - 전염성 질병
  lexicon: HALOT
  rationale: 가축이나 사람에게 퍼지는 전염성 재앙을 가리키므로, ‘전염병’이 ‘기근’과 구별되는 질병성 재앙을 가장 자연스럽게 드러냅니다.
- source_word: שִׁדָּפ֨וֹן יֵרָק֜וֹן
  english_pob_choice: blight, mildew
  chosen_korean: 곰팡이 병, 깜부기병
  alternatives_korean:
  - 흉작을 일으키는 병해
  - 마름병, 황화병
  lexicon: HALOT
  rationale: 두 농작물 재앙을 서로 구별해 옮기되, 모두 곡식에 생기는 병해라는 점을 살리기 위해 농업적 질병 용어로 표현했습니다.
- source_word: אַרְבֶּה חָסִיל
  english_pob_choice: locust, caterpillar
  chosen_korean: 메뚜기, 혹은 애벌레
  alternatives_korean:
  - 메뚜기, 혹은 식해충
  - 메뚜기, 혹은 좀먹는 벌레
  lexicon: HALOT
  rationale: 앞항은 메뚜기로 직역하고, 후항 חָסִיל은 정확한 종이 불확실하므로 본문에는 넓게 ‘애벌레’로 두어 식해충의 이미지와 POB의 대안 주해를 반영했습니다.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  english_pob_choice: in the land of his gates
  chosen_korean: 자기 성읍들의 땅에서
  alternatives_korean:
  - 그의 성문들의 땅에서
  - 그의 도시들의 땅에서
  lexicon: HALOT
  rationale: ‘성문’은 도시를 가리키는 환유이므로, 한국어에서는 의미를 살려 ‘성읍들’로 옮기되, 도시 복수의 뉘앙스를 유지했습니다.
- source_word: כָּל נֶגַע כָּל מַחֲלָה
  english_pob_choice: whatever plague, whatever sickness
  chosen_korean: 어떤 재앙이든지, 어떤 질병이든지
  alternatives_korean:
  - 어떤 재앙이든지, 어떤 병이든지
  - 모든 재앙, 모든 질병
  lexicon: HALOT
  rationale: נֶגַע의 넓은 뜻을 ‘재앙’으로, מַחֲלָה를 ‘질병’으로 구분해 반복되는 ‘어떤 …이든지’의 포괄성을 살렸습니다.
theological_decisions:
- issue: 재앙 목록의 표현 수준
  chosen_reading: 본문의 재난 항목들을 농업 재앙, 질병, 군사적 포위로 나누어 구체적으로 옮겼습니다.
  alternative_readings:
  - 더 포괄적으로 ‘재난’으로 묶어 번역
  - 전통 교회어휘로 ‘재앙/환난’ 위주로 평준화
  rationale: 히브리어의 항목별 대비를 흐리지 않도록, 각 원어가 지닌 재난의 성격을 가능한 한 구별해 드러냈습니다.
  doctrine_reference: source transparency / lexical distinctiveness
