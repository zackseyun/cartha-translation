  naturalness: 현 초안의 ‘말씀하신 그 곳을 향하여’와 ‘내 이름이 거기 있을 곳’의 결합은 현대 한국어에서 부자연스럽고 문법적으로도 불완전합니다. 인용문을 완결된 직접 인용으로 고치고, 두 차례의 방향 표현을 자연스러운 동격 구조로 연결했습니다.
  terminology: ‘이 집’, ‘내 이름’, ‘이 종’, ‘기도’를 유지했습니다. ‘내 이름’을 ‘임재’나 ‘거처’로 본문에서 바꾸지 않았으며, 그 함축은 주석에서 제한적으로 설명했습니다.
