base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/029.yaml
  text: that your eyes may be open toward this house night and day[a], toward the place of which you said, ‘My name will be there,’ to hear the prayer that your servant prays toward this place.
  footnotes:
  - marker: a
    text: '''My name will be there'' is temple-language for God''s chosen association with this place, implying his covenantal presence without reducing the phrase to that single gloss.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 이 집을 향하여 밤낮으로 눈을 뜨고 계시어, 「내 이름이 거기 있을 곳」이라고 말씀하신 그 곳을 향하여, 이 종이 이 곳을 향해 드리는 기도를 들으시기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 이름이 거기 있을 곳’은 성전이 하나님 이름의 거처라는 뜻을 담은 언어로, 하나님의 언약적 임재를 함축하지만 단일한 해석으로 축소하지 않습니다.
    reason: theological_note
lexical_decisions:
- source_word: עֵינֶךָ פְתֻחוֹת
  english_pob_choice: your eyes may be open
  chosen_korean: 눈을 뜨고 계시어
  alternatives_korean:
  - 눈이 열려 있게
  - 눈이 열려 있으시어
  - 지켜보고 계시어
  lexicon: HALOT
  rationale: 하나님의 몸짓적 표현을 그대로 살리되 한국어에서는 ‘눈을 뜨다’가 가장 자연스럽고 생생하게 ‘열린 시선’을 전달합니다.
- source_word: אֶל הַבַּיִת הַזֶּה
  english_pob_choice: toward this house
  chosen_korean: 이 집을 향하여
  alternatives_korean:
  - 이 집에
  - 이 집 쪽으로
  - 이 성전을 향하여
  lexicon: HALOT
  rationale: אֶל의 방향성을 살려 ‘향하여’로 옮겼고, 성전 문맥의 ‘house’를 ‘집’으로 유지해 원문 표현을 보존했습니다.
- source_word: לַיְלָה וָיוֹם
  english_pob_choice: night and day
  chosen_korean: 밤낮으로
  alternatives_korean:
  - 밤과 낮으로
  - 밤낮
  - 밤낮으로 계속
  lexicon: HALOT
  rationale: 히브리어의 관용적 연속성을 한국어의 자연스러운 관용구 ‘밤낮으로’로 옮겼습니다.
- source_word: שְׁמִי שָׁם
  english_pob_choice: My name will be there
  chosen_korean: 내 이름이 거기 있을 곳
  alternatives_korean:
  - 내 이름이 거기 있을 것
  - 내 이름이 거기 있을 곳입니다
  - 내 이름이 거기 있을 것입니다
  lexicon: HALOT
  rationale: 원문은 ‘내 이름이 거기 있을 것이다’라는 진술이지만, 한국어에서는 인용절 내부의 장소성을 살려 자연스럽게 ‘거기 있을 곳’으로 표현해 문맥의 성전 신학을 보존했습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 이 종이
  alternatives_korean:
  - 주의 종이
  - 당신의 종이
  - 이 종
  lexicon: HALOT
  rationale: 기도자의 자기호칭을 한국어로는 격식을 유지한 ‘이 종’으로 옮겨, 신 앞에서의 겸손한 자기표현을 살렸습니다.
theological_decisions:
- issue: 하나님의 눈이 ‘열려 있다’는 신체적 표현
  chosen_reading: 직역적 이미지를 유지해 ‘눈을 뜨고 계시어’로 옮겼습니다.
  alternative_readings:
  - 주의하셔서
  - 살피셔서
  - 감찰하셔서
  rationale: 본문의 의인화는 단순한 ‘관심’보다 더 강한 시적·신학적 표현이므로, 추상화하지 않고 유지하는 것이 원문에 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘내 이름이 거기 있을’의 성전 언어
  chosen_reading: 메마른 설명으로 풀지 않고, 하나님의 이름의 거처라는 원문 표현을 그대로 살렸습니다.
  alternative_readings:
  - 내 임재가 거기 있을
  - 내가 거기 거하겠다
  rationale: 이 표현은 하나님의 언약적 임재를 가리키지만 곧바로 ‘임재’로 환원하면 원문의 신학적 긴장을 잃게 되므로, 본문 표현과 함께 읽히도록 두었습니다.
  doctrine_reference: Translation philosophy §3
