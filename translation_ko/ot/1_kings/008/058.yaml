  text: לְ/הַטּ֥וֹת לְבָבֵ֖/נוּ אֵלָ֑י/ו לָ/לֶ֣כֶת בְּ/כָל דְּרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֤י/ו וְ/חֻקָּי/ו֙ וּ/מִשְׁפָּטָ֔י/ו אֲשֶׁ֥ר צִוָּ֖ה אֶת אֲבֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/058.yaml
  text: that he may incline our hearts to himself[a], to walk in all his ways and to keep his commandments, his statutes, and his judgments, which he commanded our fathers.
  footnotes:
  - marker: a
    text: Or 'our ancestors.' The Hebrew reads 'our fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 우리의 마음을 자기에게로 기울이셔서, 그의 모든 길로 걸어가며 그의 명령들과 그의 규례들과 그의 법도들을 지키게 하시기를 바라옵나이다. 그것들은 주께서 우리의 조상들에게 명하신 것들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַטּוֹת לְבָבֵנוּ אֵלָיו
  english_pob_choice: that he may incline our hearts to himself
  chosen_korean: 우리의 마음을 자기에게로 기울이셔서
  alternatives_korean:
  - 우리의 마음을 자기에게로 돌이켜서
  - 우리의 마음을 자기 쪽으로 향하게 하셔서
  lexicon: HALOT
  rationale: הטה의 사역형은 ‘기울이다/돌리다’의 의미가 있으므로, 마음의 방향을 하나님께로 돌리는 이미지를 살리기 위해 ‘기울이셔서’로 옮겼습니다.
- source_word: לְבָבֵנוּ
  english_pob_choice: our hearts
  chosen_korean: 우리의 마음
  alternatives_korean:
  - 우리의 심장
  - 우리의 속사람
  lexicon: HALOT
  rationale: לֵבָב은 의지와 사고를 포함한 내면 전체를 가리키므로, 한국어 성경에서 자연스럽고 넓은 의미를 보존하는 ‘마음’을 선택했습니다.
- source_word: מִצְוֺתָיו וְחֻקָּיו וּמִשְׁפָּטָיו
  english_pob_choice: his commandments, his statutes, and his judgments
  chosen_korean: 그의 명령들과 그의 규례들과 그의 법도들
  alternatives_korean:
  - 그의 계명들과 그의 규정들과 그의 판단들
  - 그의 명령과 그의 법령과 그의 판결
  lexicon: HALOT
  rationale: 세 법률 용어의 구별을 살리되, 한국어에서 ‘judgments’의 직역인 ‘심판들’보다 언약 문맥에 맞는 전통적 대응어 ‘법도들’을 택해 의미를 보존했습니다.
- source_word: אֶת אֲבֹתֵינוּ
  english_pob_choice: our fathers
  chosen_korean: 우리의 조상들에게
  alternatives_korean:
  - 우리의 아버지들에게
  - 우리의 선조들에게
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘우리의 아버지들’이지만, 한국어에서는 집단적 조상 지시를 자연스럽게 드러내는 ‘조상들’이 더 분명하여 본문 의미를 살렸습니다.
theological_decisions:
- issue: 여호와께 대한 간구형 종결의 문체
  chosen_reading: 바라옵나이다
  alternative_readings:
  - 바랍니다
  - 간구합니다
  rationale: 이 절은 솔로몬의 축복/간구 문맥이므로, 한국어 기도체를 사용해 청원적 성격을 드러냈습니다. 합쇼체 안에서 경건한 청유를 유지하기 위해 ‘바라옵나이다’를 택했습니다.
  doctrine_reference: Translation philosophy §3 (Register-sensitive rendering in prayer and direct address)
- issue: 언약적 법 조항의 삼중 표현 보존
  chosen_reading: 명령들과 규례들과 법도들
  alternative_readings:
  - 명령과 법과 규칙
  - 계명과 규례와 율례
  rationale: 히브리어의 세 항목을 평탄화하지 않고 구별해 옮겨, 언약 순종의 총체성을 드러냈습니다. ‘율례’도 가능하지만, 동일 절 안에서의 어휘 균형을 위해 ‘법도’로 처리했습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
