base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/064.yaml
  text: On that day the king consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offering and the grain offering and the fat portions of the peace offerings[c][b], because the bronze altar that was before Yahweh was too small to contain the burnt offering and the grain offering and the fat portions of the peace offerings.
  footnotes:
  - marker: a
    text: Or 'the midst of the court.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house of the LORD,' that is, the temple.
    reason: lexical_alternative
  - marker: c
    text: Or 'the fat of the peace offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 왕은 야훼의 집[b] 앞 뜰 한가운데를 거룩하게 구별하였습니다[a]. 그가 그곳에서 번제와 곡식 제물과 화목제물의 기름 부분을 드렸기 때문입니다[c]. 야훼 앞에 있는 놋 제단이 번제와 곡식 제물과 화목제물의 기름 부분을 받기에는 너무 작았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뜰의 가운데’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘야훼의 집’; 곧 성전을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘화목제물의 기름진 부분’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִדַּשׁ
  english_pob_choice: consecrated
  chosen_korean: 거룩하게 구별하였습니다
  alternatives_korean:
  - 봉헌하였습니다
  - 성별하였습니다
