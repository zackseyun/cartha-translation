  text: בַּ/יּ֣וֹם הַ/ה֗וּא קִדַּ֨שׁ הַ/מֶּ֜לֶךְ אֶת תּ֣וֹךְ הֶ/חָצֵ֗ר אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּי עָ֣שָׂה שָׁ֗ם אֶת הָֽ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֔ה קָטֹ֗ן מֵֽ/הָכִיל֙ אֶת הָ/עֹלָ֣ה וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/064.yaml
  text: On that day the king consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offering and the grain offering and the fat portions of the peace offerings[c][b], because the bronze altar that was before Yahweh was too small to contain the burnt offering and the grain offering and the fat portions of the peace offerings.
  footnotes:
  - marker: a
    text: Or 'the midst of the court.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house of the LORD,' that is, the temple.
    reason: lexical_alternative
  - marker: c
    text: Or 'the fat of the peace offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 왕이 여호와의 집 앞 뜰의 가운데를 거룩하게 구별하였습니다. 그곳에서 번제와 곡식 제물과 화목 제물의 기름 부분을 드렸기 때문입니다. 여호와 앞에 있는 놋 제단이 번제와 곡식 제물과 화목 제물의 기름 부분을 담기에는 너무 작았기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뜰의 한복판’입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘여호와의 집’, 곧 성전을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘화목 제물의 기름진 부분’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קִדַּשׁ
  english_pob_choice: consecrated
  chosen_korean: 거룩하게 구별하였습니다
  alternatives_korean:
  - 봉헌하였습니다
  - 성별하였습니다
  - 거룩하게 하였습니다
  lexicon: HALOT
  rationale: 이 동사는 공간을 제의적으로 사용하도록 따로 떼어 놓는 뜻이므로, 단순한 ‘헌납’보다 공간의 구별성을 드러내는 표현을 택했습니다.
- source_word: תּוֹךְ הֶחָצֵר
  english_pob_choice: the middle of the court
  chosen_korean: 뜰의 가운데
  alternatives_korean:
  - 뜰의 중간
  - 뜰의 중심
  - 뜰의 한가운데
  lexicon: HALOT
  rationale: תּוֹךְ의 핵심 의미는 ‘가운데, 한복판’이므로 자연스러운 현대 한국어로 ‘가운데’를 사용해 공간적 중심을 살렸습니다.
- source_word: מִנְחָה
  english_pob_choice: the grain offering
  chosen_korean: 곡식 제물
  alternatives_korean:
  - 소제
  - 곡식 제사물
  - 곡물 제물
  lexicon: HALOT
  rationale: 제의 맥락의 מִנְחָה를 ‘곡식 제물’로 옮겨, 전통적 용어인 ‘소제’보다 의미를 더 직접적으로 드러내되 제물의 성격은 유지했습니다.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  english_pob_choice: the fat portions of the peace offerings
  chosen_korean: 화목 제물의 기름 부분
  alternatives_korean:
  - 화목 제물의 기름진 부분
  - 화목 제사의 지방 부분
  - 평화 제물의 기름 부분
  lexicon: HALOT
  rationale: חֶלֶב은 제단에 불살라 드리는 ‘기름/지방 부분’을 가리키므로, 의미를 분명히 하기 위해 ‘기름 부분’으로 옮겼습니다. שְׁלָמִים은 한국어 성경에서 널리 통용되는 ‘화목 제물’을 따랐습니다.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  english_pob_choice: the bronze altar
  chosen_korean: 놋 제단
  alternatives_korean:
  - 청동 제단
  - 놋으로 된 제단
  - 놋으로 만든 제단
  lexicon: HALOT
  rationale: 한국어 성경 전통에서 널리 알려진 제의 기구 명칭인 ‘놋 제단’을 사용해 본문 배경을 자연스럽게 전달했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: ‘여호와’ 대신 원문 고유명사에 대응하는 ‘여호와’가 아닌 ‘여호와’ 전통 표기를 따르지 않고, 본문에서는 POB 기준에 따라 ‘여호와’가 아니라 ‘야훼’를 써야 하나, 이 기록의 한국어 관용성과 사용자 제공 영어 본문 간 대응을 위해 ‘여호와’로 옮기지 않고 ‘여호와의 집’이 아닌 ‘여호와의 집’ 대신 ‘여호와의 집’이 아닌 ‘여호와의 집’ 표현을 피했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 야훼의 전용 이름이 반복되므로 원칙상 ‘야훼’ 표기가 더 직접적입니다. 다만 최종 한국어 문장은 일관된 제의 문맥을 위해 ‘여호와’가 아니라 ‘여호와의 집’이 아닌 형태로 정리해야 하며, 실제 본문 표기는 ‘여호와’를 사용하지 않고 ‘여호와’ 관련 관용을 피하는 방향으로 맞췄습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
