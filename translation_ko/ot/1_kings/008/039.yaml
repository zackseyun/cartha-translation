base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/039.yaml
  text: then may you hear in heaven[a], the place where you dwell, and forgive, and act, and give to each man according to all his ways, whose heart you know—for you alone know the heart of all the sons of man—
  footnotes:
  - marker: a
    text: Hebrew 'all the sons of man,' an idiom meaning all human beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 하늘, 곧 주께서 계시는 곳에서 들으시고, 용서하시고, 행하시며, 각 사람의 마음을 아시고 그의 모든 길에 따라 그에게 주십시오. 주께서만 모든 사람의 마음을 아십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘모든 사람의 아들들’이며, 모든 인간을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  english_pob_choice: may you hear in heaven
  chosen_korean: 주의 처소인 하늘에서 들으시고
  alternatives_korean:
  - 하늘에서 들으시고
  - 하늘에서 들어 주시고
  lexicon: HALOT
  rationale: 기도문 맥락이므로 청유적 뉘앙스를 살리되, ‘하늘’ 뒤에 ‘주의 처소’라는 동격을 붙여 מקום/מכוֹן의 의미를 자연스럽게 살렸습니다.
- source_word: מְכוֹן שִׁבְתֶּךָ
  english_pob_choice: the place where you dwell
  chosen_korean: 주의 처소
  alternatives_korean:
  - 주의 거처
  - 주께서 거하시는 곳
  lexicon: HALOT
  rationale: מְכוֹן은 ‘정해진 거처/터’의 뜻이 있어, ‘처소’가 문어체로도 자연스럽고 ‘하늘’과의 동격 관계를 분명히 드러냅니다.
- source_word: וְסָלַחְתָּ וְעָשִׂיתָ וְנָתַתָּ
  english_pob_choice: and forgive, and act, and give
  chosen_korean: 용서하시고, 행하시고, 각 사람에게 … 갚아 주십시오
  alternatives_korean:
  - 용서하시고, 행하시고, 주십시오
  - 용서하시고, 하시고, 주십시오
  lexicon: HALOT
  rationale: 연속된 완료형/와우 연결형의 청원적 힘을 한국어 기도체로 옮겼고, וְעָשִׂיתָ의 व्यापक한 ‘하다’는 문맥상 ‘행하다’로 구체화했습니다. וְנָתַתָּ는 보응 문맥을 살려 ‘갚아 주다’로 옮겼습니다.
- source_word: כְּכָל דְּרָכָיו
  english_pob_choice: according to all his ways
  chosen_korean: 그의 모든 길에 따라
  alternatives_korean:
  - 그의 모든 행실에 따라
  - 그가 걸어온 모든 길에 따라
  lexicon: HALOT
  rationale: דֶּרֶךְ의 윤리적 은유를 그대로 살려 ‘길’로 번역했습니다. POB의 ‘ways’와도 대응됩니다.
- source_word: כָּל בְּנֵי הָאָדָם
  english_pob_choice: all the sons of man
  chosen_korean: 모든 사람
  alternatives_korean:
  - 모든 인류
  - 모든 사람의 자손
  lexicon: HALOT
  rationale: 히브리어는 남성형 대표 표현이지만, 한국어에서는 ‘사람’이 가장 자연스럽게 포괄 의미를 전달합니다. 본문 내 별도 주석으로 대표적 표현성을 설명합니다.
- source_word: לְבָבוֹ / לְבַב כָּל בְּנֵי הָאָדָם
  english_pob_choice: whose heart you know—for you alone know the heart of all the sons of man—
  chosen_korean: 그의 마음을 주께서 아시기 때문입니다. 주께서만 모든 사람의 마음을 아십니다.
  alternatives_korean:
  - 그의 마음을 주께서 아시기 때문입니다. 주만 모든 사람의 마음을 아십니다.
  - 그 마음을 주께서 아시니, 주만 모든 사람의 마음을 아십니다.
  lexicon: HALOT
  rationale: לֵבָב은 인간 내면 전체를 가리키므로 ‘마음’이 가장 기본적인 대응입니다. 뒤의 절은 강조 구조를 살려 ‘주께서만’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 전지성과 인간 내면 인식의 강조
  chosen_reading: ‘그의 마음을 주께서 아시기 때문입니다. 주께서만 모든 사람의 마음을 아십니다.’로 옮겨, 개인의 마음을 아시는 하나님과 모든 사람의 마음을 홀로 아시는 하나님이라는 이중 강조를 유지했습니다.
  alternative_readings:
  - ‘그의 마음을 주께서 아시므로, 주만 모든 사람의 마음을 아십니다.’
  - ‘주께서 그의 마음을 아시니, 주만 모든 사람의 마음을 아십니다.’
  rationale: 문맥상 왕의 기도는 개별 사례와 보편적 인식 능력을 함께 강조하므로, 두 절을 분리해 반복 대비를 살리는 편이 원문의 신학적 무게를 더 잘 드러냅니다.
  doctrine_reference: 열왕기상 8장 성전 봉헌 기도; 하나님은 마음을 감찰하시는 분이라는 성서적 신학
