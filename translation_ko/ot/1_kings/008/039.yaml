- from: 그때 주께서 주의 처소인 하늘에서 들으시고, 용서하시고, 행하시고, 각 사람에게 그의 모든 길에 따라 갚아 주십시오. 그의 마음을 주께서 아시기 때문입니다. 주께서만 모든 사람의 마음을 아십니다.[a]
  to: 주께서는 하늘, 곧 주께서 계시는 곳에서 들으시고, 용서하시고, 행하시며, 각 사람의 마음을 아시고 그의 모든 길에 따라 그에게 주십시오. 주께서만 모든 사람의 마음을 아십니다.[a]
  rationale: 청원문으로서의 동사 연결을 유지하면서, ‘주다’라는 원문의 의미 범위를 보존하도록 ‘갚아 주십시오’를 ‘그에게 주십시오’로 고쳤습니다. 개인의 마음을 아신다는 관계절을 ‘각 사람’에 명확히 연결했고, 하늘과 하나님의 거처의 동격 관계도 자연스럽게 다듬었습니다. 마지막 절의 하나님의 배타적 마음 인식 강조와 주석의 관용구 설명은 유지했습니다.
