  source_fidelity: 초안은 기도문의 청원적 흐름, 하늘의 처소, 용서와 하나님의 전지에 대한 강조를 대체로 충실히 반영합니다. 그러나 וְנָתַתָּ의 기본 의미는 ‘주다’이며, 문맥상 보응의 함의가 있을 수 있어도 ‘갚아 주십시오’는 처벌 또는 보복으로 의미를 불필요하게 좁힐 수 있습니다. 또한 אֲשֶׁר תֵּדַע אֶת־לְבָבוֹ는 각 사람을 수식하므로 한국어 문장에서도 그 연결을 더 직접적으로 드러내는 것이 좋습니다.
