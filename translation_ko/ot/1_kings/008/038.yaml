revisions:
- from: 어떤 기도[a]나 어떤 간구든지, 어떤 사람이든지 또는 당신의 온 백성 이스라엘이 드리는 것이면, 각기 자기 마음의 고통[b]을 알고 이 집[c]을 향하여 손을 펴는 경우입니다.
  to: 어떤 사람이든 당신의 온 백성 이스라엘이든, 각 사람이 자기 마음의 고통[b]을 알고 이 집[c]을 향해 손을 펴며 드리는 모든 기도[a]와 간구는
  rationale: 개인과 공동체의 기도를 ‘어떤 사람이든 당신의 온 백성 이스라엘이든’으로 병렬 처리하고, ‘각 사람’이 뒤의 마음과 손의 행위에 걸리도록 재구성했습니다. 원문이 39절의 응답 절로 이어지므로 종결 서술을 덧붙이지 않고 한국어에서도 연결형 구문을 유지했습니다. ‘이 집’과 ‘마음의 고통’은 본문에 보존하고, 전치사 ל의 가능한 대안은 각주에서 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:45:22Z'
