  source_fidelity: 기도·간구의 포괄성, 개인과 이스라엘 온 백성의 병렬, 마음의 고통을 아는 일, 이 집을 향해 손을 펴는 기도 자세는 대체로 잘 반영되었습니다. 다만 현행문은 ‘어떤 사람이든지 또는 … 드리는 것이면’의 문법적 결속이 불안정하며, 히브리어의 수식 관계를 자연스럽게 전달하지 못합니다.
  naturalness: ‘어떤 기도나 어떤 간구든지’와 ‘…드리는 것이면’의 결합, 그리고 절 끝의 ‘경우입니다’는 현대 한국어 성경 문체로 부자연스럽습니다. 원문이 다음 절로 이어지는 문장이므로, 한국어도 ‘…기도와 간구는’으로 열어 둔 문장으로 옮기는 것이 자연스럽습니다.
