id: 1KI.8.38
reference: 1 Kings 8:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל תְּפִלָּ֣ה כָל תְּחִנָּ֗ה אֲשֶׁ֤ר תִֽהְיֶה֙ לְ/כָל הָ֣/אָדָ֔ם לְ/כֹ֖ל עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל אֲשֶׁ֣ר יֵדְע֗וּ/ן אִ֚ישׁ נֶ֣גַע לְבָב֔/וֹ וּ/פָרַ֥שׂ כַּפָּ֖י/ו אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/038.yaml
  text: whatever prayer[a], whatever plea, may be made by any man or by all your people Israel, each knowing the affliction of his own heart and spreading out his hands toward this house[c][b],
  footnotes:
  - marker: a
    text: Or 'by any person' / 'for any man'; the Hebrew construction with 'to/for' can be understood in more than one way here.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the plague of his heart.'
    reason: lexical_alternative
  - marker: c
    text: That is, the temple, here called 'this house.'
    reason: cultural_note
translation:
  language: ko
  text: 어떤 기도[a]나 어떤 간구든지, 어떤 사람이든지 또는 당신의 온 백성 이스라엘이 드리는 것이면, 각기 자기 마음의 고통[b]을 알고 이 집[c]을 향하여 손을 펴는 경우입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떤 사람이 드리는 기도’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘마음의 재앙’입니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 성전을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל תְּפִלָּה
  english_pob_choice: whatever prayer
  chosen_korean: 어떤 기도
  alternatives_korean:
  - 모든 기도
  - 무슨 기도든지
  lexicon: HALOT
  rationale: כָּל의 포괄성을 한국어에서 자연스럽게 살리기 위해 ‘어떤 …든지’ 구성을 택했습니다.
- source_word: כָל תְּחִנָּה
  english_pob_choice: whatever plea
  chosen_korean: 어떤 간구
  alternatives_korean:
  - 어떤 탄원
  - 어떤 청원
  lexicon: HALOT
  rationale: תְּחִנָּה는 간절한 청원을 가리키므로, 격식을 유지하면서도 현대 한국어에서 자연스러운 ‘간구’가 적절합니다.
- source_word: נֶגַע לְבָבוֹ
  english_pob_choice: the affliction of his own heart
  chosen_korean: 자기 마음의 고통
  alternatives_korean:
  - 마음의 재앙
  - 마음의 질병
  - 마음의 상처
  lexicon: HALOT
  rationale: 직역하면 ‘마음의 재앙/재난’에 가깝지만, 내면의 괴로움이라는 문맥을 살려 ‘고통’으로 옮겼습니다. ‘자기’는 באנ용되는 소유격·반사 의미를 드러냅니다.
- source_word: וּפָרַשׂ כַּפָּיו
  english_pob_choice: and spreading out his hands
  chosen_korean: 손을 펴는
  alternatives_korean:
  - 손바닥을 펴는
  - 두 손을 펴는
  lexicon: HALOT
  rationale: 기도 자세를 나타내는 관용 표현으로, 한국어에서도 간결하게 이해되는 ‘손을 펴다’를 사용했습니다.
- source_word: אֶל הַבַּיִת הַזֶּה
  english_pob_choice: toward this house
  chosen_korean: 이 집을 향하여
  alternatives_korean:
  - 이 성전을 향하여
  - 이 집 쪽으로
  lexicon: HALOT
  rationale: 히브리어의 ‘집’을 그대로 살려, 성전이라는 의미는 문맥에서 드러나도록 했습니다. 방향성은 ‘향하여’로 보존했습니다.
theological_decisions:
- issue: לְכָל הָאָדָם / לְכֹל עַמְּךָ יִשְׂרָאֵל의 범위와 대표성
  chosen_reading: ‘어떤 사람이든지 또는 당신의 온 백성 이스라엘’로 옮겨 개인과 공동체를 병렬로 드러냈습니다.
  alternative_readings:
  - ‘모든 사람’
  - ‘각 사람’
  - ‘온 백성 이스라엘의 모든 사람’
  rationale: 히브리어는 개인적 기도와 언약 공동체의 기도를 병렬로 제시합니다. 한국어에서도 둘 다 보이도록 해, 대표적 단수와 집합적 범위를 함께 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
