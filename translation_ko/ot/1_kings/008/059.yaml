  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִֽהְי֨וּ דְבָרַ֜/י אֵ֗לֶּה אֲשֶׁ֤ר הִתְחַנַּ֨נְתִּי֙ לִ/פְנֵ֣י יְהוָ֔ה קְרֹבִ֛ים אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ יוֹמָ֣ם וָ/לָ֑יְלָה לַ/עֲשׂ֣וֹת מִשְׁפַּ֣ט עַבְדּ֗/וֹ וּ/מִשְׁפַּ֛ט עַמּ֥/וֹ יִשְׂרָאֵ֖ל דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/059.yaml
  text: And may these words of mine[a], with which I have pleaded before Yahweh, be near Yahweh our God day and night, that he may uphold the cause of his servant and the cause of his people Israel, as each day requires[c][b],
  footnotes:
  - marker: a
    text: Or 'be close to the LORD our God'—the Hebrew speaks of these prayer-words remaining near God continually.
    reason: lexical_alternative
  - marker: b
    text: Or 'do justice for' / 'maintain the right of'; the Hebrew idiom refers to upholding a person's legal cause.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''the matter of a day in its day,'' that is, what each day requires.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 내 말들이, 곧 내가 야훼 앞에서 간구한 것들이, 우리 하나님 야훼 앞에 밤낮으로 가까이 있어, 그의 종의 일과 그의 백성 이스라엘의 일을 각 날의 필요에 따라 이루게 하옵소서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 하나님 야훼께 가까이 있게 하옵소서’로도 옮길 수 있습니다. 히브리어는 이 기도 말씀이 하나님 곁에 계속 머무는 것을 말합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그의 종의 권리를 변호하고’ / ‘그의 종의 정당한 청을 지키고’로 옮길 수 있습니다. 히브리어 משפט는 법적 권리와 사정을 옹호하는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 직역은 ‘날의 일을 그 날에’라는 뜻으로, 곧 그날그날 필요한 바를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  english_pob_choice: And may ... be
  chosen_korean: 가까이 있어
  alternatives_korean:
  - 있게 하옵소서
  - 머물게 하옵소서
  lexicon: WLC
  rationale: 히브리어 jussive는 간구의 뉘앙스를 가지므로, 한국어에서는 청유적 기도문으로 풀어 ‘가까이 있어’로 이어지는 구조를 택했습니다.
- source_word: דְבָרַי אֵלֶּה
  english_pob_choice: these words of mine
  chosen_korean: 이 내 말들이
  alternatives_korean:
  - 이 나의 말들이
  - 이 말들이
  lexicon: WLC
  rationale: ‘말들’로 복수감을 살리고, ‘내’로 소유를 자연스럽게 드러내어 솔로몬 자신의 간구를 분명히 했습니다.
- source_word: לִפְנֵי יְהוָה / יְהוָה אֱלֹהֵינוּ
  english_pob_choice: before Yahweh / Yahweh our God
  chosen_korean: 야훼 앞에서 / 우리 하나님 야훼 앞에
  alternatives_korean:
  - 여호와 앞에서 / 우리 하나님 여호와 앞에
  - 주님 앞에서 / 우리 하나님 앞에
  lexicon: 'DOCTRINE.md contested term: יְהוָה YHWH'
  rationale: 이 본문은 하나님의 고유명 יְהוָה를 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 인격적 이름을 보존했습니다.
- source_word: לַעֲשׂוֹת מִשְׁפַּט עַבְדּוֹ וּמִשְׁפַּט עַמּוֹ
  english_pob_choice: that he may uphold the cause of his servant and the cause of his people Israel
  chosen_korean: 그의 종의 일과 그의 백성 이스라엘의 일을
  alternatives_korean:
  - 그의 종의 권리와 그의 백성 이스라엘의 권리를
  - 그의 종의 사안과 그의 백성 이스라엘의 사안을
  lexicon: HALOT
  rationale: משפט의 법정적·권리적 관용구를 한국어 ‘일’로 단순화하지 않고, 뒤의 ‘이루게 하옵소서’와 결합해 ‘일/사안’의 공적 청원으로 읽히도록 했습니다. 전통적 교회어 ‘원(願)/권리’보다 본문의 법적 청원성을 덜 굳지 않게 살렸습니다.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  english_pob_choice: as each day requires
  chosen_korean: 각 날의 필요에 따라
  alternatives_korean:
  - 그날그날 필요한 대로
  - 각 날에 맞게
  lexicon: HALOT
  rationale: 직역보다 매일의 요구·필요를 뜻하는 관용을 드러내기 위해 ‘각 날의 필요’로 옮겼습니다.
theological_decisions:
- issue: 야훼 이름을 예배문에서 어떻게 재현할지
  chosen_reading: 본문의 고유명사를 ‘야훼’로 유지했습니다.
  alternative_readings:
  - ‘주님’으로 완화하여 번역
  - 전통적 관행대로 ‘여호와’ 사용
  rationale: 솔로몬의 간구는 일반 호칭이 아니라 언약의 이름을 직접 부르는 기도이므로, 독자가 본문의 신학적 밀도를 그대로 인식하도록 했습니다.
  doctrine_reference: 'DOCTRINE.md contested term: יְהוָה YHWH'
