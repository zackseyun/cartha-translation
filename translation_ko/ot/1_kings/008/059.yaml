  lexicon: WLC
  rationale: ‘말들’로 복수감을 살리고, ‘내’로 소유를 자연스럽게 드러내어 솔로몬 자신의 간구를 분명히 했습니다.
- source_word: לִפְנֵי יְהוָה / יְהוָה אֱלֹהֵינוּ
  english_pob_choice: before Yahweh / Yahweh our God
  chosen_korean: 야훼 앞에서 / 우리 하나님 야훼 앞에
  alternatives_korean:
  - 여호와 앞에서 / 우리 하나님 여호와 앞에
  - 주님 앞에서 / 우리 하나님 앞에
  lexicon: 'DOCTRINE.md contested term: יְהוָה YHWH'
  rationale: 이 본문은 하나님의 고유명 יְהוָה를 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 인격적 이름을 보존했습니다.
- source_word: לַעֲשׂוֹת מִשְׁפַּט עַבְדּוֹ וּמִשְׁפַּט עַמּוֹ
  english_pob_choice: that he may uphold the cause of his servant and the cause of his people Israel
  chosen_korean: 그의 종의 일과 그의 백성 이스라엘의 일을
  alternatives_korean:
  - 그의 종의 권리와 그의 백성 이스라엘의 권리를
  - 그의 종의 사안과 그의 백성 이스라엘의 사안을
  lexicon: HALOT
  rationale: משפט의 법정적·권리적 관용구를 한국어 ‘일’로 단순화하지 않고, 뒤의 ‘이루게 하옵소서’와 결합해 ‘일/사안’의 공적 청원으로 읽히도록 했습니다. 전통적 교회어 ‘원(願)/권리’보다 본문의 법적 청원성을 덜 굳지 않게 살렸습니다.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  english_pob_choice: as each day requires
  chosen_korean: 각 날의 필요에 따라
  alternatives_korean:
  - 그날그날 필요한 대로
  - 각 날에 맞게
  lexicon: HALOT
  rationale: 직역보다 매일의 요구·필요를 뜻하는 관용을 드러내기 위해 ‘각 날의 필요’로 옮겼습니다.
