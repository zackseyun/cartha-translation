  to: 그러면 주께서는 하늘에서 들으시고, 주의 백성 이스라엘의 죄를 용서하시며, 그들의 조상들에게 주신 그 땅으로 그들을 돌아오게 하소서.[a][b][c]
  rationale: 원문의 접속과 2인칭 청원 형식을 보존하도록 ‘그러므로 주님께서는’를 ‘그러면 주께서는’으로 고쳤습니다. 또한 귀환의 목적지인 ‘그 땅’을 사역 동사와 결합해 הֲשֵׁבֹתָם אֶל־הָאֲדָמָה를 명확히 반영했습니다. 각주 a는 히브리어의 전치사 없는 ‘하늘’ 구문에 대한 대안적 이해를 정확히 설명하도록 수정했습니다.
