id: 1KI.8.34
reference: 1 Kings 8:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּשְׁמַ֣ע הַ/שָּׁמַ֔יִם וְ/סָ֣לַחְתָּ֔ לְ/חַטַּ֖את עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַ/הֲשֵֽׁבֹתָ/ם֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תָּ לַ/אֲבוֹתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/034.yaml
  text: then may you hear in heaven and forgive the sin of your people Israel[c][b][a], and bring them back to the land that you gave to their fathers.
  footnotes:
  - marker: a
    text: Or “hear from heaven.”
    reason: lexical_alternative
  - marker: b
    text: Or “restore them to the land.”
    reason: lexical_alternative
  - marker: c
    text: Lit. “their fathers”; that is, the forefathers to whom God gave the land.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 주님께서는 하늘에서 들으시고, 주의 백성 이스라엘의 죄를 용서하시며, 그들의 조상들에게 주신 땅으로 그들을 돌아오게 하소서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로는 ‘하늘에서’이지만, 기도 관용구로서 ‘하늘에서 들으시고’가 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘돌아오게 하소서’는 ‘그들을 그 땅으로 되돌리소서/회복시키소서’의 간결한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘조상들’은 문맥상 그 땅을 약속받은 족장들과 언약적 선조들을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  english_pob_choice: hear in heaven
  chosen_korean: 하늘에서 들으시고
  alternatives_korean:
  - 하늘에서 들으십시오
  - 하늘에서 들어 주십시오
  - 하늘에서 들으시며
  lexicon: WLC
  rationale: שמַע은 여기서 기도의 응답으로 ‘듣다’의 의미이며, הַשָּׁמַיִם은 하나님의 거처를 가리키는 관용구이므로 ‘하늘에서’로 옮겼습니다. 문맥상 요청을 잇는 연결이 필요해 어미는 ‘들으시고’로 처리했습니다.
- source_word: וְסָלַחְתָּ
  english_pob_choice: and forgive
  chosen_korean: 용서하시며
  alternatives_korean:
  - 용서하시고
  - 사하시며
  - 사하시고
  lexicon: HALOT
  rationale: סלח는 하나님의 죄 사함을 뜻하므로 ‘용서하시다’를 기본으로 잡았습니다. 앞뒤 동작을 나란히 이어 주는 합쇼체 문맥에서 ‘용서하시며’가 가장 자연스럽습니다.
- source_word: לְחַטַּאת עַמְּךָ יִשְׂרָאֵל
  english_pob_choice: the sin of your people Israel
  chosen_korean: 주의 백성 이스라엘의 죄를
  alternatives_korean:
  - 주의 백성 이스라엘의 죄과를
  - 주님의 백성 이스라엘의 죄를
  - 이스라엘 백성의 죄를
  lexicon: HALOT
  rationale: חטאת은 여기서 속죄제물이 아니라 죄/허물을 뜻하므로 ‘죄’를 유지했습니다. עַמְּךָ יִשְׂרָאֵל은 언약적 소속을 분명히 하므로 ‘주의 백성 이스라엘’로 직역에 가깝게 살렸습니다.
- source_word: וַהֲשֵׁבֹתָם אֶל הָאֲדָמָה
  english_pob_choice: and bring them back to the land
  chosen_korean: 그들을 돌아오게 하소서
  alternatives_korean:
  - 그들을 땅으로 되돌리소서
  - 그들을 그 땅으로 돌아오게 하소서
  - 그들을 그 땅으로 회복시키소서
  lexicon: HALOT
  rationale: הֵשִׁיב의 사역형은 ‘돌아오게 하다/되돌리다’이며, 문맥상 포로 귀환과 언약 땅을 가리킵니다. 한국어에서는 이미 앞에서 언급된 ‘땅’을 이어받을 수 있어 간결하게 ‘돌아오게 하소서’로 옮겼습니다.
- source_word: אֲשֶׁר נָתַתָּ לַאֲבוֹתָם
  english_pob_choice: that you gave to their fathers
  chosen_korean: 그들의 조상들에게 주신
  alternatives_korean:
  - 그들의 아버지들에게 주신
  - 그들의 선조들에게 주신
  lexicon: HALOT
  rationale: 아בותם은 문맥상 족장들을 가리키는 언약적 표현이지만, 한국어에서는 성별을 드러내는 ‘아버지들’보다 의미를 분명히 하는 ‘조상들’이 더 자연스럽습니다. 다만 영어 POB의 ‘fathers’ 주석을 고려해 단순한 일반 조상보다 언약 역사적 선조의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 기도문에서 하나님의 응답을 청하는 존대 종결
  chosen_reading: ‘하소서’로 마감하여 직접적 청원 형식을 유지했습니다.
  alternative_readings:
  - ‘하십시오’로 평서형 기원문 처리
  - ‘들으시고… 돌아오게 하십시오’로 통일
  rationale: 히브리어는 솔로몬의 기도 문맥에서 간청형을 이어가므로, 한국어도 하나님께 드리는 기원문에 맞게 ‘하소서’를 사용했습니다. 이는 현대 문어체이면서도 예배적 청원성을 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 2
- issue: ‘땅’의 범위를 토지 일반이 아니라 언약적 약속의 땅으로 읽는 문제
  chosen_reading: ‘그들의 조상들에게 주신’이라는 문맥으로 약속의 땅을 드러냈습니다.
  alternative_readings:
  - ‘땅’만 유지해 일반 토지로 읽히게 함
  - ‘그 땅’으로만 처리
  rationale: 본문의 אֲדָמָה는 단순한 흙/땅이 아니라 야훼께서 조상들에게 주신 언약 땅을 가리킵니다. 따라서 한국어에서도 회복의 공간적·언약적 의미가 드러나도록 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
