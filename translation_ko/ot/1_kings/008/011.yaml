source:
  edition: WLC
  text: וְ/לֹֽא יָכְל֧וּ הַ/כֹּהֲנִ֛ים לַ/עֲמֹ֥ד לְ/שָׁרֵ֖ת מִ/פְּנֵ֥י הֶֽ/עָנָ֑ן כִּי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/011.yaml
  text: and the priests were not able to stand to minister because of the cloud[b][a], for the glory of Yahweh filled the house of Yahweh.
  footnotes:
  - marker: a
    text: Or, 'could not stand to serve.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house of the LORD'; that is, the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장들은 구름 때문에 서서 섬길 수 없었습니다. 야훼의 영광이 야훼의 집을 가득 채웠기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘서서 섬기다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘야훼의 집’은 곧 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  english_pob_choice: were not able
  chosen_korean: 서서 섬길 수 없었습니다
  alternatives_korean:
  - 서 있을 수 없었습니다
  - 능히 서서 섬기지 못했습니다
  lexicon: HALOT
  rationale: 능력의 부재를 자연스러운 한국어로 옮기되, 문맥상 제사장들의 예배 직무를 드러내기 위해 ‘섬기다’를 살렸습니다.
- source_word: לַעֲמֹד לְשָׁרֵת
  english_pob_choice: to stand to minister
  chosen_korean: 서서 섬길
  alternatives_korean:
  - 서서 봉사할
  - 서서 직무를 수행할
  lexicon: HALOT
  rationale: 직역하면 ‘서다’와 ‘섬기다’의 결합이므로, 두 동사를 함께 살려 제사장적 직무 수행의 중단을 표현했습니다.
- source_word: מִפְּנֵי הֶעָנָן
  english_pob_choice: because of the cloud
  chosen_korean: 구름 때문에
  alternatives_korean:
  - 구름 앞에서
  - 구름 앞에
  lexicon: HALOT
  rationale: ‘얼굴/앞’ 관용구가 원인·방해를 나타내므로, 한국어에서는 인과를 직접 드러내는 표현이 가장 자연스럽습니다.
- source_word: כְבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 광채
  - 야훼의 영예
  lexicon: HALOT
  rationale: כבוד는 여기서 하나님의 현현적 영광을 가리키므로, 해석어를 줄인 ‘영광’으로 옮기고 소유격을 유지했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 전
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 보존해 ‘집’으로 옮겼습니다. 이 구절은 건축물 자체를 가리키지만, ‘성전’은 해석을 한 단계 더 보탭니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 여호와 대신 학술적 음역인 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 하나님의 영광과 성전 충만의 표현
  chosen_reading: ‘야훼의 영광이 야훼의 집을 가득 채웠습니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘야훼가 임재하셨기 때문입니다’
  - ‘야훼의 임재가 가득했습니다’
  rationale: 본문은 추상적 ‘임재’보다 ‘영광’과 ‘가득 채움’의 구체적 이미지를 통해 성전 봉사의 중단을 설명하므로, 그 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §6
