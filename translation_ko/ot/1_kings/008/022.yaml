  to: 그때 솔로몬은 야훼의 제단 앞에서 온 이스라엘 회중을 마주하여 서서, 손을 하늘을 향해 펴 들었습니다.[a]
  rationale: 제단과 회중에 대한 서로 다른 공간 관계를 한국어 문장 안에서 명확히 구별하고, 서술 접속을 현대적이고 격식 있는 성경 문체로 다듬었습니다. 하나님의 이름, 회중의 전체성, 손을 하늘 쪽으로 펴는 동작, 그리고 ‘하늘들’에 관한 각주는 유지했습니다.
