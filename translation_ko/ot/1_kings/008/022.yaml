translation:
  language: ko
  text: 그러고 나서 솔로몬이 야훼의 제단 앞, 이스라엘의 온 회중 앞에 서서 손을 하늘로 펴 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
