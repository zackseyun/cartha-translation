    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  english_pob_choice: stood
  chosen_korean: 서서
  alternatives_korean:
  - 섰습니다
  - 자리를 잡고 섰습니다
  lexicon: HALOT
  rationale: 연속 서술의 פשוט한 과거 동작이므로, 과장 없이 자연스러운 ‘서서’로 옮겼습니다.
- source_word: לִפְנֵי / נֶגֶד
  english_pob_choice: before / in front of
  chosen_korean: 앞
  alternatives_korean:
  - 전에
  - 면전에
  lexicon: HALOT
  rationale: 두 전치사의 공간적 관계를 한국어에서는 중복 없이 ‘앞’으로 압축해, 제단과 회중 앞에 선 공개적 상황을 드러냈습니다.
- source_word: מִזְבַּח יְהוָה
  english_pob_choice: the altar of Yahweh
  chosen_korean: 야훼의 제단
  alternatives_korean:
  - 여호와의 제단
  - 주님의 제단
  lexicon: HALOT
  rationale: 본문의 하나님의 이름 יְהוָה를 프로젝트 기준에 따라 ‘야훼’로 옮기고, 소유격 구조는 자연스럽게 ‘야훼의 제단’으로 렌더링했습니다.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  english_pob_choice: all the assembly of Israel
  chosen_korean: 이스라엘의 온 회중
  alternatives_korean:
  - 이스라엘의 온 회중들
  - 이스라엘의 모든 모임
  lexicon: HALOT
  rationale: קָהָל의 공적 집회 의미를 살려 ‘회중’으로 옮겼고, כָּל은 관용적으로 ‘온’으로 표현해 전체성을 드러냈습니다.
- source_word: כַּפָּיו
  english_pob_choice: his hands
  chosen_korean: 손을
  alternatives_korean:
  - 두 손을
  - 손바닥을
  lexicon: HALOT
  rationale: 기도 동작 관용구에서는 כף를 한국어로 보통 ‘손’으로 옮기면 가장 자연스럽고, 손바닥으로 좁히면 의미가 지나치게 축소됩니다.
- source_word: הַשָּׁמָיִם
  english_pob_choice: heaven
  chosen_korean: 하늘로
  alternatives_korean:
  - 하늘을 향하여
  - 하늘을
  lexicon: HALOT
  rationale: 방향성을 분명히 하면서도 한국어 기도 문맥에서 자연스러운 ‘하늘로’를 택했습니다. 본문은 복수형 ‘하늘들/하늘들’의 직역보다 행위의 방향을 강조합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 히브리어 원문이 여호와 대체어가 아닌 고유명 יְהוָה를 사용하므로, 프로젝트 기준에 따라 ‘야훼’로 보존했습니다. 이는 제의적 호칭이 아니라 언약 이름을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
