  source_fidelity: 히브리어의 동작 순서와 공간 관계는 대체로 잘 반영되었습니다. 다만 원문은 솔로몬이 ‘야훼의 제단 앞에’ 서 있고 동시에 ‘온 이스라엘 회중을 마주한’ 위치에 있음을 구별합니다. 초안의 쉼표로 병렬 처리한 ‘제단 앞, ... 회중 앞에’는 두 관계를 다소 어색하고 모호하게 만듭니다.
  naturalness: ‘그러고 나서’와 쉼표 뒤의 병렬 장소구는 현대 한국어 성경 문체로는 다소 구어적·불균형적입니다. ‘그때’, ‘제단 앞에서 … 회중을 마주하여’로 다듬으면 합쇼체의 격식 있는 서술과 공간 관계가 자연스러워집니다.
  terminology: ‘야훼’, ‘제단’, ‘회중’, ‘하늘’은 적절합니다. ‘손을 하늘을 향해 펴 들었습니다’는 기도 자세를 나타내는 프라스(펴다)의 문맥적 의미를 자연스럽게 전달하며, 원문의 방향성을 보존합니다.
  issues:
