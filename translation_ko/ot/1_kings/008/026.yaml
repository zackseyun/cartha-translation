id: 1KI.8.26
reference: 1 Kings 8:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל יֵאָ֤מֶן נָא֙ דברי/ך אֲשֶׁ֣ר דִּבַּ֔רְתָּ לְ/עַבְדְּ/ךָ֖ דָּוִ֥ד אָבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/026.yaml
  text: And now[a], God of Israel[b], please let your word that you spoke to your servant David my father be confirmed.
  footnotes:
  - marker: a
    text: Or "be established," "prove true," or more dynamically, "come to pass."
    reason: lexical_alternative
  - marker: b
    text: Hebrew "your words"; English "your word" renders the collective sense naturally here.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 이스라엘의 하나님이여[a], 부디 당신이 당신의 종 다윗—제 아버지에게 말씀하신 당신의 말씀이 이루어지게 하십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이제”만으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로는 “당신의 말씀들”이지만, 여기서는 하나님의 선언 전체를 가리키는 집합적 표현으로 읽어 한국어에서는 “당신의 말씀”으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 지금
  lexicon: HALOT
  rationale: 이어지는 기도문의 전환을 자연스럽게 살리되, 합쇼체 문맥에서 불필요하게 장황하지 않게 옮겼습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 오 이스라엘의 하나님
  lexicon: HALOT
  rationale: 히브리어 호격을 한국어 기도문으로 자연스럽게 옮기며, 현대적인 예배체 문맥에서 “오”는 생략했습니다.
- source_word: יֵאָמֶן
  english_pob_choice: be confirmed
  chosen_korean: 이루어지게 하십시오
  alternatives_korean:
  - 확증되게 하십시오
  - 확립되게 하십시오
  - 참되게 드러나게 하십시오
  lexicon: HALOT
  rationale: 동사의 ‘견고해지다/확인되다’는 뉘앙스를 기도 청원으로 풀어, 하나님의 이전 말씀의 성취를 자연스럽고 직접적으로 드러냈습니다.
- source_word: דבריך
  english_pob_choice: your word
  chosen_korean: 당신의 말씀
  alternatives_korean:
  - 당신의 말
  - 당신의 말씀들
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 여기서는 하나님의 선언 전체를 가리키므로 한국어에서는 통상적인 단수 존칭 “말씀”이 가장 적절합니다.
- source_word: לְעַבְדְּךָ
  english_pob_choice: to your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  lexicon: HALOT
  rationale: 다윗의 하나님 앞 자기호칭은 계약적·신하적 관계를 나타내므로 “종”이 문맥상 가장 자연스럽습니다.
theological_decisions:
- issue: יֵאָמֶן의 청원적 의미를 어떻게 드러낼 것인가
  chosen_reading: 하나님의 말씀이 ‘이루어지게 하십시오’라는 기도 청원으로 옮겼습니다.
  alternative_readings:
  - ‘확증되게 하십시오’로 옮길 수 있습니다.
  - ‘참되게 드러나게 하십시오’로도 옮길 수 있습니다.
  rationale: 본문은 단순한 정보 진술이 아니라, 야훼의 이전 약속이 실제로 성취되도록 구하는 기도이므로 한국어에서도 청원형을 분명히 했습니다.
  doctrine_reference: 열왕기상 8장의 성전 봉헌 기도 문맥
- issue: 호격 표현의 기도체 톤
  chosen_reading: “이스라엘의 하나님이여”로 직접 부르는 기도체를 유지했습니다.
  alternative_readings:
  - 평서형으로 풀어 ‘이스라엘의 하나님께서’라고 할 수도 있습니다.
  rationale: 솔로몬의 기도문이라는 장르를 살리기 위해 하나님을 직접 부르는 호격을 보존했습니다.
  doctrine_reference: 예배/기도문 문체
