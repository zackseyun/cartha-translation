translation:
  language: ko
  text: 이제[a], 이스라엘의 하나님이여, 부디 당신의 종인 제 아버지 다윗에게 말씀하신 당신의 말씀[b]이 이루어지게 하십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 이제”.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “당신의 말씀들”이지만, 여기서는 하나님의 선언 전체를 가리키는 집합적 표현으로 읽어 한국어에서는 “당신의 말씀”으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “확증되게 하십시오”, “확립되게 하십시오”, 또는 문맥상 “참되게 드러나게 하십시오”.
    reason: lexical_alternative
