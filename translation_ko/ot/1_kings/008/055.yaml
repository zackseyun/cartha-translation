base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/055.yaml
  text: 'And he stood and blessed all the assembly of Israel with a loud voice[b][a], saying:'
  footnotes:
  - marker: a
    text: Or 'all the congregation of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'with a great voice,' that is, 'with a loud voice.'
    reason: lexical_alternative
translation:
  language: ko
  text: '그가 서서 이스라엘의 온 회중을[a] 큰 소리로[b] 축복하며 말했습니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 모든 회중’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘큰 음성으로’이며, 곧 ‘큰 소리로’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעְמֹד
  english_pob_choice: And he stood
  chosen_korean: 그가 서서
  alternatives_korean:
  - 그가 일어나서
  - 그리고 그는 서서
  lexicon: HALOT
  rationale: 문맥상 다음 동작으로 이어지는 서술이므로, 자연스럽게 ‘서서’로 옮기되 동작의 연속성을 살렸습니다.
- source_word: וַיְבָרֶךְ
  english_pob_choice: blessed
  chosen_korean: 축복하며
  alternatives_korean:
  - 복을 빌며
  - 축복하셨습니다
  lexicon: HALOT
  rationale: הברך는 여기서 백성 위에 공적으로 축복을 선포하는 뜻이므로, 현대 한국어에서 가장 직접적인 ‘축복하다’ 계열로 옮겼습니다.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  english_pob_choice: all the assembly of Israel
  chosen_korean: 이스라엘의 온 회중
  alternatives_korean:
  - 이스라엘의 모든 회중
  - 이스라엘의 온 총회
  lexicon: HALOT
  rationale: קהל은 모인 공동체를 가리키므로, 교회적 뉘앙스가 강한 ‘교회’나 전통적 ‘성회’보다 중립적인 ‘회중’이 원문을 더 잘 반영합니다.
- source_word: קוֹל גָּדוֹל
  english_pob_choice: with a loud voice
  chosen_korean: 큰 소리로
  alternatives_korean:
  - 높은 소리로
  - 큰 목소리로
  lexicon: HALOT
  rationale: 직역하면 ‘큰 음성’이지만 한국어에서는 관용적으로 ‘큰 소리로’가 가장 자연스럽고, 공개적인 발화를 잘 드러냅니다.
theological_decisions:
- issue: 축복의 의미
  chosen_reading: 솔로몬이 백성에게 공적으로 축복을 선포한 것으로 읽고, 그가 독자적으로 은혜를 부여한 것으로는 읽지 않았습니다.
  alternative_readings:
  - 성례적이거나 효력을 발생시키는 축복 행위
  rationale: 히브리어 ברך는 공식 자리에서 축복을 말로 선포하는 뜻을 가질 수 있으므로, 본문이 말하는 범위를 넘겨 신학적 효력을 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
