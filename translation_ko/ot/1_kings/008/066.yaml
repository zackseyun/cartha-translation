  lexicon: HALOT
  rationale: 피엘 שלח의 해산·귀가 허락 의미를 살려, 단순 파견보다 ‘떠나보내다’로 자연스럽게 표현했습니다.
- source_word: וַיְבָרֲכוּ אֶת הַמֶּלֶךְ
