  text: On the eighth day he sent the people away[a], and they blessed the king and went to their tents, rejoicing and glad of heart because of all the good that Yahweh had done for David his servant and for Israel his people.
  footnotes:
  - marker: a
    text: Or 'to their homes'; literally 'to their tents.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여덟째 날에 그는 백성을 떠나보냈습니다. 그러자 그들은 왕에게 복을 빌고 각자의 장막으로[a] 갔습니다. 그들은 야훼께서 그의 종 다윗과 그의 백성 이스라엘에게 베푸신 모든 좋은 일 때문에 기뻐하며 마음이 즐거웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘각자의 장막으로’는 문자적 표현이며, 관용적으로는 ‘각자의 집으로’라는 뜻일 수 있습니다.
    reason: lexical_alternative
