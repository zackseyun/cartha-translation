  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지를 보존해 ‘장막들’로 옮겼고, POB의 투명성 원칙에 따라 집으로의 관용적 의미는 본문에 넣지 않았습니다.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
