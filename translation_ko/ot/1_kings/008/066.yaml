base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/066.yaml
  text: On the eighth day he sent the people away[a], and they blessed the king and went to their tents, rejoicing and glad of heart because of all the good that Yahweh had done for David his servant and for Israel his people.
  footnotes:
  - marker: a
    text: Or 'to their homes'; literally 'to their tents.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여덟째 날에 그는 백성을 떠나보냈습니다. 그러자 그들은 왕에게 복을 빌고 자기 장막들로 갔습니다. 그들은 야훼께서 그의 종 다윗과 그의 백성 이스라엘을 위해 행하신 모든 선한 일 때문에 기뻐하며 마음이 즐거웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 장막들로’는 문자적 표현이며, 관용적으로는 ‘자기 집으로’의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
