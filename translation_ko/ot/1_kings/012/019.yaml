  - 배반하여
  - 거역하여
  lexicon: HALOT
  rationale: 정치적 맥락의 פשע는 단순한 일반적 죄가 아니라 권위에 대한 반역·반란을 뜻하므로, 문맥상 가장 직접적인 ‘반역하다’ 계열을 택했습니다.
- source_word: יִשְׂרָאֵל
