    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  english_pob_choice: has been in rebellion / rebelled
  chosen_korean: 반역하여
  alternatives_korean:
  - 반란하여
  - 배반하여
  - 거역하여
  lexicon: HALOT
  rationale: 정치적 맥락의 פשע는 단순한 일반적 죄가 아니라 권위에 대한 반역·반란을 뜻하므로, 문맥상 가장 직접적인 ‘반역하다’ 계열을 택했습니다.
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 이스라엘 백성
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어 고유명사를 그대로 살려, 북쪽 지파 연합체를 가리키는 집단명 자체를 유지했습니다.
- source_word: בְּבֵית דָּוִד
  english_pob_choice: against the house of David
  chosen_korean: 다윗의 집에 대하여
  alternatives_korean:
  - 다윗의 집을 향하여
  - 다윗 집을 대하여
  - 다윗 왕조에 대하여
  lexicon: HALOT
  rationale: ב가 반역의 대상/상대를 표시하므로 ‘~에 대하여’로 옮겨 적대 방향을 드러내되, dynastic 의미를 유지했습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘까지
  alternatives_korean:
  - 이 날까지
  - 지금까지
  lexicon: HALOT
  rationale: 히브리어 관용구가 사건 이후 현재까지의 지속을 가리키므로, 한국어의 자연스러운 관용 표현인 ‘오늘까지’를 사용했습니다.
theological_decisions:
- issue: 이스라엘의 분열을 단순한 행정 분리보다 언약적 왕권에 대한 반역으로 표현할지 여부
  chosen_reading: 본문의 정치·언약적 긴장을 살려 ‘반역’으로 옮겼습니다.
  alternative_readings:
  - 분리되었다
  - 떨어져 나갔다
  - 거슬렀다
  rationale: חית열왕기 문맥에서 이는 단순한 독립 선언이 아니라 다윗 집에 대한 거부와 대항을 포함하므로, 완화된 표현보다 원문의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 삼하 7장 다윗 언약, 왕정 분열 서술 문맥
- issue: ‘오늘까지’의 시점이 서술자의 현재를 가리키는 역사 서술 관용인지 여부
  chosen_reading: 역사서의 관용적 지속 표현으로 처리했습니다.
  alternative_readings:
  - 그때까지
  - 그 날 이후로
  rationale: 표현은 현재 시점까지 이어지는 상태를 말하는 서술 관용이므로, 추가 해석 없이 그대로 옮기는 것이 가장 투명합니다.
  doctrine_reference: 히브리 역사서의 서술 관용
