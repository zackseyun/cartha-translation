  source_fidelity: 수정이 필요합니다. מַס는 이 문맥에서 국가가 부과한 강제 부역이며, ‘조공’은 금전·물품 공납의 뜻을 불필요하게 더합니다. 또한 ‘돌로 쳐서 죽였습니다’는 히브리어의 연속 서술(그를 돌로 쳤고, 그가 죽었다)을 하나의 직접 사살 표현으로 합칩니다. ‘그를 돌로 쳤고, 그는 죽었습니다’가 원문의 구조를 더 충실히 보존합니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽습니다. ‘병거에 오르려고 서둘렀습니다’는 긴급하게 자신을 다잡아 병거에 오르려 한 הִתְאַמֵּץ의 문맥상 의미를 무리 없이 전달합니다.
  terminology: ‘강제 부역’은 מַס의 문맥상 의미를 정확히 나타냅니다. ‘아도람’, ‘온 이스라엘’, ‘병거’, ‘예루살렘’은 적절합니다.
  issues:
