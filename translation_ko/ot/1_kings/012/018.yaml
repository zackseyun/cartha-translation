source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת אֲדֹרָם֙ אֲשֶׁ֣ר עַל הַ/מַּ֔ס וַ/יִּרְגְּמ֨וּ כָל יִשְׂרָאֵ֥ל בּ֛/וֹ אֶ֖בֶן וַ/יָּמֹ֑ת וְ/הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם הִתְאַמֵּץ֙ לַ/עֲל֣וֹת בַּ/מֶּרְכָּבָ֔ה לָ/נ֖וּס יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/018.yaml
  text: Then King Rehoboam sent Adoram[a], who was over the forced labor, and all Israel stoned him with stones, and he died[c][b]. And King Rehoboam made haste to get up into the chariot to flee to Jerusalem.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Adoram''; some related passages use the name form ''Adoniram.'''
    reason: alternative_reading
  - marker: b
    text: Or simply, 'stoned him'; the Hebrew explicitly says, 'stoned him with stones.'
    reason: lexical_alternative
  - marker: c
    text: Or, in smoother English, 'hurried to get into the chariot.' The Hebrew more literally says, 'strengthened himself to get up into the chariot.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 르호보암 왕이 강제 부역을 감독하던 아도람[a]을 보냈습니다. 그러나 온 이스라엘이 그를 돌로 쳤고[b], 그는 죽었습니다. 르호보암 왕은 예루살렘으로 도망하려고 병거에 오르려고 서둘렀습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 이름을 ‘아도람’으로 기록합니다. 관련 본문의 일부에는 ‘아도니람’이라는 이름형이 나옵니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 ‘그를 돌로 쳤다’라고 합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사는 문자적으로 자신을 강하게 하거나 힘을 내는 것을 뜻하며, 여기서는 급히 병거에 오르려 한 상황을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹרָם
  english_pob_choice: Adoram
  chosen_korean: 아도람
  alternatives_korean:
  - 아도니람
  lexicon: HALOT
  rationale: MT의 이름형을 따라 아도람으로 옮기되, 관련 본문의 다른 이름형 가능성은 영어 POB의 각주에 맞춰 반영했습니다.
- source_word: עַל הַמַּס
  english_pob_choice: who was over the forced labor
  chosen_korean: 조공·부역을 감독하던
  alternatives_korean:
  - 강제노동을 감독하던
  - 부역을 맡고 있던
  lexicon: HALOT
  rationale: מַס는 여기서 금전적 조공보다 강제 동원된 노동을 가리키므로, 현대 독자가 의미를 바로 이해하도록 ‘부역’ 중심으로 풀고, 조공의 뉘앙스도 함께 살렸습니다.
- source_word: וַיִּרְגְּמוּ ... אֶבֶן
  english_pob_choice: stoned him with stones
  chosen_korean: 돌로 쳐서 죽였습니다
  alternatives_korean:
  - 돌로 돌을 던져 쳤습니다
  - 돌로 쳤습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘돌로 침’의 관용구를 그대로 지니지만, 한국어에서는 ‘돌로 쳐서 죽이다’가 자연스럽고 결과까지 분명히 드러냅니다.
- source_word: הִתְאַמֵּץ
  english_pob_choice: made haste
  chosen_korean: 급히
  alternatives_korean:
  - 힘을 내어
  - 자신을 굳게 하고
  lexicon: HALOT
  rationale: 동사는 문자적으로 ‘자신을 강하게 하다’이지만, 문맥상 왕이 급히 도망치려는 행동을 가리키므로 결과 동작을 살려 ‘급히’로 옮겼습니다.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  english_pob_choice: to get up into the chariot
  chosen_korean: 병거에 올라
  alternatives_korean:
  - 병거에 올라타
  - 병거로 올라
  lexicon: HALOT
  rationale: עלה는 병거에 ‘오르다/올라타다’의 뜻이므로, 한국어에서 가장 자연스러운 ‘병거에 올라’로 옮겼습니다.
theological_decisions:
- issue: 왕권의 긴급한 도주를 나타내는 동작 묘사
  chosen_reading: ‘급히 병거에 올라 … 도망하려고 했습니다’로, 단순 이동이 아니라 위기 속의 도주라는 서술 효과를 살렸습니다.
  alternative_readings:
  - ‘병거에 올라 예루살렘으로 도망했습니다’
  - ‘병거에 올라 도망쳤습니다’
  rationale: 히브리어의 연속 동작은 왕의 급박한 패퇴를 강조하므로, 이를 완만한 이동으로 누그러뜨리지 않았습니다.
  doctrine_reference: 서사 본문 해석 원칙
- issue: ‘온 이스라엘’의 집단성 유지
  chosen_reading: ‘온 이스라엘’로 유지해 북왕국 전체의 집단적 행위를 드러냈습니다.
  alternative_readings:
  - ‘모든 이스라엘 사람들’
  - ‘이스라엘 백성 전체’
  rationale: 본문의 정치·공동체적 책임성을 약화시키지 않기 위해 집합명사를 유지했습니다.
  doctrine_reference: 본문 서술의 집단 주체성
