  rationale: 강제 부역이라는 행정 용어를 정확히 반영하고, 투석 행위와 그 죽음의 결과를 원문의 연속 서술대로 분리했습니다. 아도람의 이름형 각주는 유지하되, 돌로 친 표현과 긴급히 병거에 오르려 한 동작을 정확히 설명하도록 각주를 바로잡았습니다.
