  source_fidelity: 원문의 בֵּית בָּמוֹת는 직역하면 ‘산당들의 집’에 가까운 관용적 제의 표현입니다. 초안의 ‘산당의 집들’은 형태를 기계적으로 옮긴 탓에 한국어 의미가 불분명합니다. ‘산당을 만들고’는 이 표현의 실제 지시 대상인 산당 제의 시설을 자연스럽게 전달하며, 각주에서 직역적 표현을 보존합니다. מִקְצוֹת הָעָם는 백성 일반 가운데서 뽑았다는 뜻으로 ‘온 백성 가운데서’가 적절하고, 관계절은 제사장들이 레위 자손이 아니었음을 나타냅니다.
