id: 1KI.12.31
reference: 1 Kings 12:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ אֶת בֵּ֣ית בָּמ֑וֹת וַ/יַּ֤עַשׂ כֹּֽהֲנִים֙ מִ/קְצ֣וֹת הָ/עָ֔ם אֲשֶׁ֥ר לֹֽא הָי֖וּ מִ/בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/031.yaml
  text: He made houses of high places[a], and he appointed priests from among all the people[b], who were not from the sons of Levi.
  footnotes:
  - marker: a
    text: Hebrew literally, 'a house of high places,' an idiom for shrines or sanctuaries associated with high places.
    reason: lexical_alternative
  - marker: b
    text: Or, 'who were not Levites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 산당의 집들을 만들고, 온 백성 가운데서 제사장들을 세웠으니, 그들은 레위의 아들들이 아니었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘고지의 집/산당의 집’이라는 뜻으로, 산당과 관련된 예배 장소를 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘레위인들이 아니었습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He made
  chosen_korean: 만들고
  alternatives_korean:
  - 지었고
  - 세웠고
  - 만들었습니다
  lexicon: HALOT
  rationale: עשה는 넓게 ‘만들다/행하다’의 뜻이므로, 여기서는 첫 절과 둘째 절을 모두 포괄하는 중립적 동사로 ‘만들다’를 택했습니다.
- source_word: בֵּית בָּמֹות
  english_pob_choice: He made houses of high places
  chosen_korean: 산당의 집들
  alternatives_korean:
  - 고지의 집들
  - 산당의 집
  - 높은 곳의 집들
  lexicon: HALOT
  rationale: 직역하면 ‘고지의 집/산당의 집’이지만, 한국어에서는 ‘산당’이 우상 숭배의 예배 장소를 드러내는 가장 직접적인 대응어입니다. 복수형도 반영해 ‘집들’로 옮겼습니다.
- source_word: כֹּהֲנִים מִקְצוֹת הָעָם
  english_pob_choice: he appointed priests from among all the people
  chosen_korean: 온 백성 가운데서 제사장들을 세웠으니
  alternatives_korean:
  - 백성 중에서 제사장들을 세웠으니
  - 모든 백성 가운데서 제사장들을 세웠으니
  - 백성에서 제사장들을 임명했으니
  lexicon: HALOT
  rationale: מִקְצוֹת הָעָם는 특정 혈통이 아니라 백성 일반에서 뽑았다는 뜻이므로 ‘온 백성 가운데서’로 자연스럽게 옮겼습니다. כֹּהֲנִים은 제의적 문맥에서 ‘제사장들’이 적절합니다.
- source_word: אֲשֶׁר לֹא הָיוּ מִבְּנֵי לֵוִי
  english_pob_choice: who were not from the sons of Levi
  chosen_korean: 그들은 레위의 아들들이 아니었습니다
  alternatives_korean:
  - 레위 자손이 아니었습니다
  - 레위 사람들은 아니었습니다
  - 레위 지파 출신이 아니었습니다
  lexicon: HALOT
  rationale: 히브리어의 친족·지파 표현을 살려 ‘레위의 아들들’로 직역하되, 한국어 문장에서는 자연스럽게 ‘아니었습니다’로 마무리했습니다. POB의 문구를 따라 ‘레위 사람들’로 일반화하지 않았습니다.
theological_decisions:
- issue: 여로보암이 세운 예배 구조의 성격
  chosen_reading: ‘산당의 집들’로 옮겨, 합법적 성전이 아닌 우상 숭배 관련 제의 공간임을 본문 수준에서 드러냈습니다.
  alternative_readings:
  - ‘고지의 집들’로 더 직역하기
  - ‘산당’ 대신 ‘성소’로 완화하기
  rationale: 본문은 단순한 건축이 아니라 산당과 연결된 비정상적 제의 체계를 말하므로, 독자가 그 종교적 성격을 바로 파악할 수 있게 해야 합니다.
  doctrine_reference: 원문 우선 원칙; 열왕기상 12장의 여로보암 제의 비판 맥락
- issue: 비레위계 제사장 임명
  chosen_reading: ‘레위의 아들들이 아니었습니다’로 유지해 혈통적·제의적 경계를 분명히 했습니다.
  alternative_readings:
  - ‘레위 사람들이 아니었습니다’로 풀기
  - ‘레위인이 아니었습니다’로 의역하기
  rationale: 히브리어는 레위 지파에 속하지 않았음을 명시하므로, ‘레위 사람들’처럼 너무 일반화하지 않고 계보적 표현을 살렸습니다.
  doctrine_reference: 본문의 역사·제의적 구분 보존
