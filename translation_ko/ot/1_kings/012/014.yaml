  text: וַ/יְדַבֵּ֣ר אֲלֵי/הֶ֗ם כַּ/עֲצַ֤ת הַ/יְלָדִים֙ לֵ/אמֹ֔ר אָבִ/י֙ הִכְבִּ֣יד אֶֽת עֻלְּ/כֶ֔ם וַ/אֲנִ֖י אֹסִ֣יף עַֽל עֻלְּ/כֶ֑ם אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֕י אֲיַסֵּ֥ר אֶתְ/כֶ֖ם בָּ/עַקְרַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “My father made your yoke heavy, and I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.”
  footnotes:
  - marker: a
    text: Or possibly 'with scorpion-whips,' that is, whips with sharp points or barbs; the Hebrew literally reads 'with scorpions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 젊은이들의 조언대로 그들에게 말했습니다. 「내 아버지는 너희의 멍에를 무겁게 했고, 나는 너희의 멍에를 더하겠습니다. 내 아버지는 너희를 채찍으로 징계했으나, 나는 너희를 전갈로 징계하겠습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전갈채찍들’, 곧 뾰족한 끝이나 가시가 달린 채찍들일 수 있습니다. 히브리어는 문자적으로 ‘전갈들’이라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: He spoke
  chosen_korean: 그는 ... 말했습니다
  alternatives_korean:
  - 그는 ... 이야기했습니다
  - 그는 ... 대답했습니다
  lexicon: HALOT
  rationale: דבר의 기본 의미를 살려 ‘말했습니다’로 옮기고, 문맥상의 응답 성격은 번역어가 아니라 서술 흐름으로 드러내었습니다.
- source_word: כַּעֲצַת הַיְלָדִים
  english_pob_choice: according to the advice of the young men
  chosen_korean: 젊은이들의 조언대로
  alternatives_korean:
  - 젊은 남자들의 조언대로
  - 소년들의 조언대로
  lexicon: HALOT
  rationale: 문맥상 어린아이보다 ‘젊은이들’이 자연스럽고, עֵצָה는 권고/조언의 뜻이므로 ‘조언’이 적절합니다.
- source_word: הִכְבִּיד אֶת עֻלְּכֶם
  english_pob_choice: made your yoke heavy
  chosen_korean: 너희의 멍에를 무겁게 했고
  alternatives_korean:
  - 너희의 멍에를 짐스럽게 했고
  - 너희의 멍에를 가중시켰고
  lexicon: HALOT
  rationale: ‘멍에’ 이미지를 유지하면서 הִכְבִּיד의 직역인 ‘무겁게 했고’를 사용해 통치의 압박을 선명하게 살렸습니다.
- source_word: אֹסִיף עַל עֻלְּכֶם
  english_pob_choice: I will add to your yoke
  chosen_korean: 너희의 멍에를 더하겠습니다
  alternatives_korean:
  - 너희의 멍에를 더 얹겠습니다
  - 너희의 멍에를 증가시키겠습니다
  lexicon: HALOT
  rationale: עַל에 따른 ‘더하다’의 관용을 한국어로 자연스럽게 옮겨, 뒤의 ‘멍에’가 계속 중심 이미지를 이루도록 했습니다.
- source_word: בַּשּׁוֹטִים / בָּעַקְרַבִּים
  english_pob_choice: with whips / with scorpions
  chosen_korean: 채찍으로 / 전갈로
  alternatives_korean:
  - 매로 / 전갈로
  - 채찍으로 / 전갈채찍으로
  lexicon: HALOT
  rationale: שׁוֹט은 통상 ‘채찍’이 가장 분명하고, עקרבים는 본문 그대로 ‘전갈’로 유지해 원문의 충격적 이미지를 보존했습니다.
theological_decisions:
- issue: ‘전갈’의 문자적 이미지와 가능한 비유적 의미
  chosen_reading: 주본문에는 ‘전갈’의 문자적 이미지를 유지했습니다.
  alternative_readings:
  - ‘가시 달린 채찍들’ 또는 ‘전갈채찍’으로 의역
  rationale: 히브리어가 문자적으로 ‘전갈들’을 말하므로 본문에서는 그 이미지를 보존하고, 가능성 있는 도구적 의미는 번역이 아니라 주석에서 다루는 편이 원문 투명성에 더 부합합니다.
  doctrine_reference: 'translation philosophy: original-language primacy; preserve source tension where the Hebrew is concrete and potentially idiomatic'
