  source_fidelity: 원문은 ‘느밧의 아들 여로보암’이 문맥상 암시된 일을 들었을 때, 그가 솔로몬 왕에게서 도피해 간 이집트에 아직 있었으며, 이집트에 거주하고 있었다고 말합니다. 초안의 ‘그 소식’은 문맥상 보충으로 가능하나 각주 표지는 해당 보충어에 붙어야 합니다. 또한 מִפְּנֵי를 ‘왕의 얼굴을 피하여’로 옮기면 한국어에서 부자연스럽고 원문의 관용적 ‘~에게서/앞을 피하여 도망하다’보다 지나치게 문자적입니다.
  naturalness: 초안은 첫 문장에서 ‘여로보암은 … 아들이었는데’라고 서술하여 원문의 인명·부칭 명사구를 배경 설명으로 바꾸고, ‘얼굴을 피하여’는 현대 표준어 성경 문체에서도 어색합니다. 삽입절과 반복된 이름을 유지하면서도 문장을 대시로 정리하면 자연스럽습니다.
  terminology: 여로보암, 느밧, 솔로몬, 이집트는 적절합니다. ‘솔로몬 왕에게서 도망하여 간’은 도피의 방향과 왕권으로부터의 회피를 자연스럽고 충실하게 나타냅니다. וַיֵּשֶׁב에는 단순 체류보다 거주 의미가 있으므로 ‘살고 있었습니다’를 사용했습니다.
