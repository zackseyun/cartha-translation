revisions:
- from: 여로보암은 느밧의 아들이었는데, 그 소식을 들었을 때는 아직 이집트에 있었습니다. 그는 솔로몬 왕의 얼굴을 피하여 그곳으로 도망한 사람이었으며, 여로보암은 계속 이집트에 머물러 있었습니다.[a]
  to: 느밧의 아들 여로보암이 그 소식[a]을 들었을 때—그는 솔로몬 왕에게서 도망하여 간 이집트에 아직 있었습니다—여로보암은 이집트에 살고 있었습니다.
  rationale: 문맥상 암시된 목적어 ‘그 소식’은 유지하되, 각주 표지를 그 보충어에 연결했습니다. 원문의 삽입적 상황절과 여로보암의 이름 반복을 보존했으며, 도피 표현은 자연스러운 한국어 관용으로 바로잡았습니다. ‘살고 있었습니다’는 וַיֵּשֶׁב의 지속적 거주 의미를 반영합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:45:56Z'
