theological_decisions:
- issue: 본문의 도피 동기와 왕권 긴장 표현
  chosen_reading: ‘솔로몬 왕의 얼굴을 피하여’로 옮겨, 단순한 지리 이동이 아니라 왕의 권세와 위협에서 벗어난 도피였음을 드러냈습니다.
  alternative_readings:
  - 솔로몬 왕에게서 도망하여
  - 솔로몬 왕 앞에서 달아나
  rationale: 히브리어 מִפְּנֵי는 단순한 출발점보다 ‘면전/얼굴에서 벗어남’의 뉘앙스를 갖기 때문에, 서사적 긴장과 정치적 위협을 보존하는 번역이 더 적절합니다.
  doctrine_reference: 본문의 역사서술적 긴장 보존
