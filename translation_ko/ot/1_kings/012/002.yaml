  text: Now when Jeroboam son of Nebat heard of it—while he was still in Egypt[a], where he had fled from King Solomon—Jeroboam was still living in Egypt.
  footnotes:
  - marker: a
    text: Hebrew simply says 'when Jeroboam ... heard'; the object is implied from context, likely the news just mentioned in the surrounding narrative.
    reason: lexical_alternative
translation:
  language: ko
  text: 여로보암은 느밧의 아들이었는데, 그 소식을 들었을 때는 아직 이집트에 있었습니다. 그는 솔로몬 왕의 얼굴을 피하여 그곳으로 도망한 사람이었으며, 여로보암은 계속 이집트에 머물러 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단지 ‘여로보암이 들었을 때’라고만 하며, 대상은 앞뒤 문맥에서 암시됩니다.
    reason: source_note
