source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֤עַ כָּל יִשְׂרָאֵל֙ כִּֽי שָׁ֣ב יָרָבְעָ֔ם וַֽ/יִּשְׁלְח֗וּ וַ/יִּקְרְא֤וּ אֹת/וֹ֙ אֶל הָ֣/עֵדָ֔ה וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ עַל כָּל יִשְׂרָאֵ֑ל לֹ֤א הָיָה֙ אַחֲרֵ֣י בֵית דָּוִ֔ד זוּלָתִ֥י שֵֽׁבֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/020.yaml
  text: And when all Israel heard that Jeroboam had returned[a], they sent and called him to the assembly and made him king over all Israel. None followed the house of David except the tribe of Judah alone.
  footnotes:
  - marker: a
    text: Or, 'No one remained with the house of David except the tribe of Judah alone.' The Hebrew idiom literally says 'was after the house of David,' expressing allegiance or alignment.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 이스라엘이 여로보암이 돌아왔다는 말을 듣고는, 사람을 보내어 그를 회중으로 불러다가 그를 온 이스라엘의 왕으로 세웠습니다. 다윗의 집을 따른 이는 유다 지파 외에는 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다윗의 집을 따른’은 히브리어 관용구를 옮긴 것으로, 문자적으로는 ‘다윗의 집 뒤에 있었다’는 뜻입니다. 여기서는 충성하거나 편을 들었다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  english_pob_choice: they sent
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 그를 보냈습니다
  - 사자들을 보냈습니다
  lexicon: HALOT
  rationale: 히브리어는 단지 ‘보내다’라고만 하고 대상이 드러나지 않으므로, 문맥상 자연스러운 한국어로만 최소한의 보충을 했습니다.
- source_word: אֶל הָעֵדָה
  english_pob_choice: to the assembly
  chosen_korean: 회중으로
  alternatives_korean:
  - 모임으로
  - 집회로
  - 총회로
  lexicon: HALOT
  rationale: עֵדָה는 여기서 정치적·공적 집합체를 가리키므로, 교회적 뉘앙스가 강한 번역을 피하고 중립적인 ‘회중’으로 옮겼습니다.
- source_word: וַיַּמְלִיכוּ אֹת֖וֹ
  english_pob_choice: and made him king
  chosen_korean: 그를 ... 왕으로 세웠습니다
  alternatives_korean:
  - 그를 왕으로 삼았습니다
  - 그를 왕으로 세워 다스리게 했습니다
  lexicon: HALOT
  rationale: מלך 히필은 ‘왕이 되게 하다/세우다’의 뜻이므로, 왕권 부여의 행위를 드러내는 ‘왕으로 세웠습니다’가 가장 근접합니다.
- source_word: לֹא הָיָה אַחֲרֵי בֵית דָּוִד
  english_pob_choice: None followed the house of David
  chosen_korean: 다윗의 집을 따른 이는 ... 없었습니다
  alternatives_korean:
  - 다윗의 집 편에 선 이는 ... 없었습니다
  - 다윗의 집에 속한 이는 ... 없었습니다
  lexicon: HALOT
  rationale: אַחֲרֵי는 단순한 시간적 ‘뒤’가 아니라 충성/편승의 관용구이므로, POB의 해석을 따라 ‘따른 이’로 옮겨 정치적 충성의 의미를 살렸습니다.
- source_word: שֵׁבֶט יְהוּדָה לְבַדּוֹ
  english_pob_choice: except the tribe of Judah alone
  chosen_korean: 유다 지파 외에는
  alternatives_korean:
  - 유다 지파뿐이었습니다
  - 유다 지파만 남았습니다
  lexicon: HALOT
  rationale: זוּלָתִי와 לְבַדּוֹ의 중복적 배제를 한국어에서는 ‘외에는’으로 간결하게 처리해, 유다 지파만 예외라는 점을 분명히 했습니다.
theological_decisions:
- issue: 다윗 왕조에 대한 충성의 관용구 처리
  chosen_reading: ‘따르다’로 번역해 정치적 충성/편을 나타내는 의미를 살렸습니다.
  alternative_readings:
  - ‘남다’로 처리해 소속의 의미를 강조하는 방법
  - ‘편에 서다’로 풀어 쓰는 방법
  rationale: 본문은 구원론적 진술이 아니라 왕조 분열 이후의 역사적·정치적 진술이므로, 히브리어 관용구의 방향성(אל/אחרי)을 살리는 번역이 필요합니다.
  doctrine_reference: 원문 관용구의 정치적 의미를 보존하고, 전통적 신학적 해석을 번역에 과도하게 주입하지 않음
