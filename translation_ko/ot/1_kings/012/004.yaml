source:
  edition: WLC
  text: אָבִ֖י/ךָ הִקְשָׁ֣ה אֶת עֻלֵּ֑/נוּ וְ/אַתָּ֡ה עַתָּ֣ה הָקֵל֩ מֵ/עֲבֹדַ֨ת אָבִ֜י/ךָ הַ/קָּשָׁ֗ה וּ/מֵ/עֻלּ֧/וֹ הַ/כָּבֵ֛ד אֲשֶׁר נָתַ֥ן עָלֵ֖י/נוּ וְ/נַעַבְדֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/004.yaml
  text: Your father made our yoke heavy[a]. So now, lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
  footnotes:
  - marker: a
    text: Or 'made our yoke hard.' The Hebrew uses the imagery of a yoke for oppressive obligations.
    reason: lexical_alternative
  - marker: b
    text: '''Hard labor'' may also be rendered ''hard service'' or ''harsh service.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 아버지께서 우리에게 가혹한 멍에를 지우셨습니다[a]. 그러니 이제 아버지의 가혹한 노역[b]과 그가 우리에게 지운 무거운 멍에를 가볍게 해 주십시오. 그러면 우리가 당신을 섬기겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리의 멍에를 가혹하게 하셨다’입니다. 히브리어는 멍에의 이미지를 통해 압박적인 의무를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가혹한 노역’은 ‘고된 봉사’ 또는 ‘가혹한 섬김’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשָׁה
  english_pob_choice: made our yoke heavy
  chosen_korean: 우리의 멍에를 무겁게 하셨습니다
  alternatives_korean:
  - 우리의 멍에를 سخت하게 하셨습니다
  - 우리의 멍에를 가혹하게 하셨습니다
  lexicon: HALOT
  rationale: 히필형 קשׁה의 핵심은 ‘무겁고 कठ한 상태로 만들다’이므로, 멍에의 비유를 살려 ‘무겁게 하다’로 옮겼습니다.
- source_word: עֻלֵּנוּ
  english_pob_choice: our yoke
  chosen_korean: 우리의 멍에
  alternatives_korean:
  - 우리의 짐
  - 우리의 속박
  lexicon: HALOT
  rationale: 본문의 억압적 통치/노역 비유를 보존하려면 일반적 ‘짐’보다 ‘멍에’가 더 직접적입니다.
- source_word: מֵעֲבֹדַת ... הַקָּשָׁה
  english_pob_choice: the hard service of your father
  chosen_korean: 아버지의 무거운 일
  alternatives_korean:
  - 아버지의 कठ한 섬김
  - 아버지의 힘든 노역
  lexicon: HALOT
  rationale: עֲבֹדָה는 여기서 강제된 노동/봉사를 가리키므로, 현대 한국어에서 자연스럽고 본문 맥락에 맞는 ‘일’로 풀되, 부담의 성격을 ‘무거운’으로 반영했습니다.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  english_pob_choice: and his heavy yoke
  chosen_korean: 그가 우리에게 얹은 무거운 멍에
  alternatives_korean:
  - 그의 무거운 멍에
  - 그가 우리에게 진 무거운 멍에
  lexicon: HALOT
  rationale: נתן עלינו의 ‘우리 위에 얹다’라는 강제성을 살리기 위해 소유격만 두지 않고 ‘우리에게 얹은’으로 옮겼습니다.
- source_word: וְנַעַבְדֶךָּ
  english_pob_choice: and we will serve you
  chosen_korean: 우리가 당신을 섬기겠습니다
  alternatives_korean:
  - 우리가 당신에게 복종하겠습니다
  - 우리가 당신을 섬길 것입니다
  lexicon: HALOT
  rationale: cohortative적 약속을 한국어 미래 의지 표현으로 자연스럽게 옮겼고, ‘섬기다’가 이 대목의 충성/봉사 뉘앙스를 가장 잘 전달합니다.
theological_decisions:
- issue: 왕권에 대한 백성의 항의가 단순한 서비스 불만인지, 억압적 노역 요구에 대한 고발인지
  chosen_reading: 백성의 요구를 단순한 행정 편의가 아니라 ‘멍에’와 ‘무거운 일’로 묘사된 억압적 강제노동에 대한 항의로 드러나게 했습니다.
  alternative_readings:
  - 아버지의 힘든 봉사 요구에 대한 일반적 불평으로 완화하는 해석
  rationale: 히브리어의 멍에 이미지와 ‘무거운 일’의 병렬은 솔로몬 통치의 압박을 강조하므로, 이를 약화하지 않고 드러내는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: 왕권/압제 본문 해석
- issue: ‘섬기다’의 의미를 완곡한 예의 표현으로 바꿀지 여부
  chosen_reading: 백성의 마지막 약속은 정치적 충성 서약이므로, 예의 중심의 표현보다 ‘섬기겠습니다’로 직접 옮겼습니다.
  alternative_readings:
  - 당신께 예를 갖추겠습니다
  - 당신을 따르겠습니다
  rationale: עוֹבֵד/עָבַד 계열은 단순 친절이 아니라 종속·봉사의 관계를 뜻하므로, 본문의 조건부 충성을 희석하지 않는 번역이 필요합니다.
  doctrine_reference: 언약/왕권 관계
