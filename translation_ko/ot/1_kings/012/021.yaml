  to: 르호보암이 예루살렘으로 오자, 그는 유다의 온 집과 베냐민 지파, 곧 전쟁을 위해 선발된 전사 십팔만 명을 모아 이스라엘의 집과 싸워 왕권을 솔로몬의 아들 르호보암에게 되돌려 주려고 하였습니다.[a]
  rationale: 목적을 나타내는 히브리어 부정사 לְהִלָּחֵם을 ‘싸워’로 옮겨 불필요한 사역 의미를 제거했습니다. מְלוּכָה는 분열된 통치의 회복이라는 문맥에 맞추어 ‘왕권’으로, לִרְחַבְעָם은 ‘르호보암에게 되돌려 주다’로 반영했습니다. ‘집’의 정치적-집단적 관용구는 유다와 이스라엘에 일관되게 유지했습니다.
