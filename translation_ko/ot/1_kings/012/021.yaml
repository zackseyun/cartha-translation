translation:
  language: ko
  text: 르호보암이 예루살렘으로 오자, 그는 유다의 온 집과 베냐민 지파, 곧 전쟁을 위해 선발된 전사 십팔만 명을 모아 이스라엘의 집과 싸워 왕권을 솔로몬의 아들 르호보암에게 되돌려 주려고 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בָּחוּר עֹשֵׂה מִלְחָמָה는 직역하면 ‘전쟁을 하는 선발된 사람들’입니다.
    reason: lexical_alternative
