  - ‘왕국을 되찾으려 했습니다’
  rationale: 본문은 정치적 분열 이후의 통치 복원을 말하므로, ‘나라’만으로 약해질 수 있는 왕권 의미를 동사구로 보완했습니다.
  doctrine_reference: 왕조적/정치적 맥락의 מְלוּכָה
