  text: When Rehoboam came to Jerusalem[a], he assembled all the house of Judah and the tribe of Benjamin, one hundred eighty thousand chosen warriors, to fight against the house of Israel, to restore the kingdom to Rehoboam son of Solomon.
  footnotes:
  - marker: a
    text: Or 'one hundred and eighty thousand select fighting men.'
    reason: lexical_alternative
translation:
  language: ko
  text: 르호보암이 예루살렘으로 오자, 그는 유다 온 집과 베냐민 지파를—전쟁을 하는 선택된 용사 십팔만 명을—모아 이스라엘 집과 싸우게 하여, 나라를 솔로몬의 아들 르호보암에게 되돌리려 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בָּחוּר עֹשֵׂה מִלְחָמָה는 직역하면 ‘전쟁을 하는 선택된 사람들’입니다.
    reason: lexical_alternative
