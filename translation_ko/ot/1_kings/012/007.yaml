id: 1KI.12.7
reference: 1 Kings 12:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/ידבר אֵלָ֜י/ו לֵ/אמֹ֗ר אִם הַ֠/יּוֹם תִּֽהְיֶה עֶ֜בֶד לָ/עָ֤ם הַ/זֶּה֙ וַֽ/עֲבַדְתָּ֔/ם וַ/עֲנִיתָ֕/ם וְ/דִבַּרְתָּ֥ אֲלֵי/הֶ֖ם דְּבָרִ֣ים טוֹבִ֑ים וְ/הָי֥וּ לְ/ךָ֛ עֲבָדִ֖ים כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/007.yaml
  text: And he spoke to him[a], saying, “If today you will be a servant to this people, and serve them, and answer them, and speak good words to them[b], then they will be your servants all your days.”
  footnotes:
  - marker: a
    text: Or “kind words.”
    reason: lexical_alternative
  - marker: b
    text: Or “they will serve you always.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 이렇게 말했습니다. “오늘 이 백성의 종이 되어 그들을 섬기고, 그들에게 대답하며, 그들에게 좋은 말[a]을 한다면, 그들은 언제까지나 왕의 종이 될 것입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “친절한 말”.
    reason: ‘좋은 말’(דְּבָרִים טוֹבִים)의 가능한 어휘적 대안입니다.
  - marker: b
    text: 또는 “그들은 언제까지나 왕을 섬길 것입니다.”
    reason: ‘그들은 왕의 종이 될 것입니다’(וְהָיוּ לְךָ עֲבָדִים)의 동사형 대안이며, 지속 표현 כָּל־הַיָּמִים를 함께 반영합니다.
lexical_decisions:
- source_word: עֶבֶד
  english_pob_choice: servant
  chosen_korean: 종
  alternatives_korean:
  - 종복
  - 섬기는 사람
  lexicon: HALOT
  rationale: 이곳의 ‘종’은 왕이 백성에게 취해야 할 복종적·봉사적 태도를 나타내며, 본문 안의 상호적 ‘섬김’ 대비를 살리기에 가장 직접적입니다.
- source_word: וַעֲבַדְתָּם
  english_pob_choice: serve them
  chosen_korean: 그들을 섬기고
  alternatives_korean:
  - 그들을 위해 일하고
  - 그들을 섬겨
  lexicon: HALOT
  rationale: 동사 עבד의 반복을 살려 앞의 ‘종이 되어’와 같은 어근의 대응을 유지했고, 정치적 권면의 의미도 자연스럽게 드러냈습니다.
- source_word: וַעֲנִיתָם
  english_pob_choice: answer them
  chosen_korean: 그들에게 응답하며
  alternatives_korean:
  - 그들에게 대답하며
  - 그들에게 응하며
  lexicon: HALOT
  rationale: 문맥상 ‘괴롭히다’가 아니라 청원에 대한 응답이므로, 한국어에서는 공식적이고 문맥에 맞는 ‘응답하다’를 택했습니다.
- source_word: דְּבָרִים טוֹבִים
  english_pob_choice: good words
  chosen_korean: 좋은 말을
  alternatives_korean:
  - 친절한 말을
  - 호의적인 말을
  lexicon: HALOT
  rationale: 히브리어의 직역성을 유지하면서도 한국어로 자연스럽게 읽히도록 ‘좋은 말’을 선택했습니다.
- source_word: כָּל הַיָּמִים
  english_pob_choice: all your days
  chosen_korean: 평생
  alternatives_korean:
  - 모든 날 동안
  - 당신의 모든 날 동안
  lexicon: HALOT
  rationale: 직역 가능한 표현이지만, 문맥상 계속성과 결과를 자연스럽게 드러내는 한국어 관용 표현 ‘평생’으로 옮겼습니다.
theological_decisions:
- issue: 왕의 태도를 ‘섬김’으로 제시하는 정치적 역설
  chosen_reading: 본문의 역설을 약화하지 않고, 왕이 백성의 ‘종’이 되어 섬기라는 직설을 그대로 살렸습니다.
  alternative_readings:
  - ‘백성에게 복종하다’처럼 더 완곡하게 옮김
  - ‘백성의 일꾼이 되다’로 완화함
  rationale: 이 조언의 긴장감은 본문의 핵심이므로, 전통적 왕권 어휘로 중화하지 않고 원문이 요구하는 관계 역전을 드러내는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
