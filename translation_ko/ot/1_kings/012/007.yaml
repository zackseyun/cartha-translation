revisions:
- from: 그가 그에게 말하여 이르기를, "오늘 이 백성에게 종이 되어 그들을 섬기고, 그들에게 응답하며, 그들에게 좋은 말을 하면, 그들은 평생 당신의 종이 될 것입니다" 하였습니다.[a][b]
  to: 그가 그에게 이렇게 말했습니다. “오늘 이 백성의 종이 되어 그들을 섬기고, 그들에게 대답하며, 그들에게 좋은 말[a]을 한다면, 그들은 언제까지나 왕의 종이 될 것입니다.[b]”
  rationale: 제공된 원문의 단수 발화 도입은 보존했습니다. 조건절의 네 동작과 결과절의 ‘종’이라는 명사 대비를 유지하면서, 현대 한국어 문장 구조와 각주 표지의 지시 대상을 바로잡았습니다. ‘왕’은 이 절의 대화 상대가 왕이라는 직접 문맥을 한국어에서 자연스럽게 드러내기 위한 지시어 명료화이며, 의미를 추가하지 않습니다.
