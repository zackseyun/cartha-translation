- source_word: וּבִנְיָמִין
  english_pob_choice: and Benjamin
  chosen_korean: 베냐민
  alternatives_korean:
  - 베냐민 지파
  - 베냐민의 집안
  lexicon: HALOT
  rationale: 본문은 독립된 집단명으로 베냐민을 병렬하므로, 자연스러운 한국어로 단순히 ‘베냐민’이라 옮겼습니다.
- source_word: וְיֶתֶר הָעָם
  english_pob_choice: and the rest of the people
  chosen_korean: 백성의 남은 자
  alternatives_korean:
  - 남은 백성
  - 나머지 백성
  - 백성의 나머지
  lexicon: HALOT
  rationale: יֶתֶר의 ‘남은/나머지’와 הָעָם의 ‘백성’을 살리되, 이 문맥이 군대라고 명시하지 않으므로 ‘백성’으로 유지했습니다.
theological_decisions:
- issue: 사역 명령의 화자 표지
  chosen_reading: 본문의 전달 동사를 그대로 살려, 왕에게 전할 신탁/지시의 형식을 드러내는 데 초점을 두었습니다.
  alternative_readings:
