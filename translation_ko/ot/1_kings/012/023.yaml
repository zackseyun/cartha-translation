  - ‘선포하라’로 신탁성을 강조
  rationale: 히브리어는 전달 명령을 제시할 뿐, 여기서 추가적인 예언적 용어를 요구하지 않으므로 과도한 신학적 확장을 피했습니다.
  doctrine_reference: 본문 문맥 주해 원칙
