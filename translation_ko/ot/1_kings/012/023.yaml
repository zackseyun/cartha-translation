  text: אֱמֹ֗ר אֶל רְחַבְעָ֤ם בֶּן שְׁלֹמֹה֙ מֶ֣לֶךְ יְהוּדָ֔ה וְ/אֶל כָּל בֵּ֥ית יְהוּדָ֖ה וּ/בִנְיָמִ֑ין וְ/יֶ֥תֶר הָ/עָ֖ם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/023.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all the house of Judah and Benjamin, and the rest of the people, saying[c][b],
  footnotes:
  - marker: a
    text: Or 'Say to Rehoboam ...'
    reason: lexical_alternative
  - marker: b
    text: '''The house of Judah'' preserves the Hebrew idiom for the Judahite community or polity; alternatively, ''all Judah.'''
    reason: lexical_alternative
  - marker: c
    text: '''The people'' may in context refer to those gathered for war, but the Hebrew here does not explicitly say ''army.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬의 아들 르호보암 곧 유다 왕과, 유다와 베냐민의 온 집안과, 그리고 백성의 남은 자에게 말하여 이르되[a][b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘르호보암에게 … 말하라’
    reason: lexical_alternative
  - marker: b
    text: ‘유다의 온 집안’은 히브리어 관용구를 살린 표현으로, 문맥상 유다 공동체/정치를 가리킬 수 있습니다. 다른 번역으로는 ‘온 유다’가 가능합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘백성’은 문맥상 전쟁을 위해 모인 사람들을 가리킬 수 있지만, 히브리어 본문은 여기서 직접 ‘군대’라고 말하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  english_pob_choice: Speak
  chosen_korean: 말하여 이르되
  alternatives_korean:
  - 말하라
  - 이르되
  - 말하십시오
  lexicon: HALOT
  rationale: 히브리어 명령형으로 이어지는 전달 명령이므로, 한국어에서는 직설적이면서도 문맥에 맞는 관용 표현인 ‘말하여 이르되’를 택했습니다.
- source_word: בֵּית יְהוּדָה
  english_pob_choice: the house of Judah
  chosen_korean: 유다의 온 집안
  alternatives_korean:
  - 유다 집안
  - 유다의 집
  - 온 유다
  lexicon: HALOT
  rationale: 영어 POB가 보존한 관용구를 따라, 단순한 지리명보다 공동체·가문적 집합을 드러내는 ‘집안’을 사용했습니다.
- source_word: וּבִנְיָמִין
  english_pob_choice: and Benjamin
  chosen_korean: 베냐민
  alternatives_korean:
  - 베냐민 지파
  - 베냐민의 집안
  lexicon: HALOT
  rationale: 본문은 독립된 집단명으로 베냐민을 병렬하므로, 자연스러운 한국어로 단순히 ‘베냐민’이라 옮겼습니다.
- source_word: וְיֶתֶר הָעָם
  english_pob_choice: and the rest of the people
  chosen_korean: 백성의 남은 자
  alternatives_korean:
  - 남은 백성
  - 나머지 백성
  - 백성의 나머지
  lexicon: HALOT
  rationale: יֶתֶר의 ‘남은/나머지’와 הָעָם의 ‘백성’을 살리되, 이 문맥이 군대라고 명시하지 않으므로 ‘백성’으로 유지했습니다.
theological_decisions:
- issue: 사역 명령의 화자 표지
  chosen_reading: 본문의 전달 동사를 그대로 살려, 왕에게 전할 신탁/지시의 형식을 드러내는 데 초점을 두었습니다.
  alternative_readings:
  - 단순히 ‘말하라’로 축약
  - ‘선포하라’로 신탁성을 강조
  rationale: 히브리어는 전달 명령을 제시할 뿐, 여기서 추가적인 예언적 용어를 요구하지 않으므로 과도한 신학적 확장을 피했습니다.
  doctrine_reference: 본문 문맥 주해 원칙
