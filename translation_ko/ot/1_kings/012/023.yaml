source:
  edition: WLC
  text: אֱמֹ֗ר אֶל רְחַבְעָ֤ם בֶּן שְׁלֹמֹה֙ מֶ֣לֶךְ יְהוּדָ֔ה וְ/אֶל כָּל בֵּ֥ית יְהוּדָ֖ה וּ/בִנְיָמִ֑ין וְ/יֶ֥תֶר הָ/עָ֖ם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/023.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all the house of Judah and Benjamin, and the rest of the people, saying[c][b],
  footnotes:
  - marker: a
    text: Or 'Say to Rehoboam ...'
    reason: lexical_alternative
  - marker: b
    text: '''The house of Judah'' preserves the Hebrew idiom for the Judahite community or polity; alternatively, ''all Judah.'''
    reason: lexical_alternative
  - marker: c
    text: '''The people'' may in context refer to those gathered for war, but the Hebrew here does not explicitly say ''army.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬의 아들 르호보암, 곧 유다 왕과 유다의 온 집안과 베냐민과 나머지 백성에게[b][c] 이렇게 말하십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘르호보암에게 … 말하라’.
    reason: lexical_alternative
  - marker: b
    text: ‘유다의 온 집안’은 히브리어 관용구를 살린 표현으로, 문맥상 유다 공동체 또는 정치적 집단을 가리킬 수 있습니다. 달리 ‘온 유다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘백성’은 문맥상 전쟁을 위해 모인 사람들을 가리킬 수 있지만, 히브리어 본문은 여기서 직접 ‘군대’라고 말하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  english_pob_choice: Speak
  chosen_korean: 말하여 이르되
