id: 1KI.12.32
reference: 1 Kings 12:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ יָרָבְעָ֣ם חָ֡ג בַּ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֣י בַּ/חֲמִשָּֽׁה עָשָׂר֩ י֨וֹם לַ/חֹ֜דֶשׁ כֶּ/חָ֣ג אֲשֶׁ֣ר בִּ/יהוּדָ֗ה וַ/יַּ֨עַל֙ עַל הַ/מִּזְבֵּ֔חַ כֵּ֤ן עָשָׂה֙ בְּ/בֵֽית אֵ֔ל לְ/זַבֵּ֖חַ לָ/עֲגָלִ֣ים אֲשֶׁר עָשָׂ֑ה וְ/הֶעֱמִיד֙ בְּ/בֵ֣ית אֵ֔ל אֶת כֹּהֲנֵ֥י הַ/בָּמ֖וֹת אֲשֶׁ֥ר עָשָֽׂה׀־׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/032.yaml
  text: Jeroboam made a feast in the eighth month[a], on the fifteenth day of the month, like the feast that was in Judah, and he went up to the altar. So he did in Bethel, sacrificing to the calves that he had made[b]; and he installed in Bethel the priests of the high places that he had made.
  footnotes:
  - marker: a
    text: The feast in Judah likely refers to the Feast of Booths (Tabernacles), held on the fifteenth day of the seventh month; Jeroboam set his rival feast one month later.
    reason: cross_reference
  - marker: b
    text: Or 'he went up on the altar.' The Hebrew expression can be rendered more literally, but in context it refers to approaching/ascending the altar to officiate.
    reason: lexical_alternative
translation:
  language: ko
  text: 여로보암은 여덟째 달, 곧 그달 십오일에 유다에 있는 절기와 같은 절기를 지켰습니다.[a] 그리고 그는 제단으로 올라갔습니다.[b] 그는 벧엘에서도 그렇게 하여, 자기가 만든 송아지들에게 제사를 드리고, 자기가 만든 산당들의 제사장들을 벧엘에 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘유다에 있는 절기’는 아마도 칠월 십오일에 지키는 초막절을 가리킵니다. 여로보암은 이에 맞서는 절기를 한 달 뒤에 정했습니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그는 제단 위에 올라갔습니다.’ 히브리어 표현은 더 문자적으로 이렇게 옮길 수 있으나, 문맥에서는 제단에 나아가 제의 직무를 수행하는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... חָג
  english_pob_choice: made a feast
  chosen_korean: 절기를 지켰습니다
  alternatives_korean:
  - 잔치를 베풀었습니다
  - 절기를 만들었습니다
  - 절기를 지켰습니다
  lexicon: HALOT
  rationale: חָג는 단순한 연회보다 지정된 종교 절기 행위를 가리키므로, 한국어에서는 ‘절기를 지키다’가 의미를 가장 자연스럽게 드러냅니다.
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי ... בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  english_pob_choice: in the eighth month, on the fifteenth day of the month
  chosen_korean: 여덟째 달, 곧 그달 십오일에
  alternatives_korean:
  - 여덟째 달에, 그달 열다섯째 날에
  - 여덟째 달 십오일에
  lexicon: HALOT
  rationale: 히브리어 날짜 형식을 한국어 달력 표현으로 옮기되, ‘곧’으로 뒤의 날짜 구문을 자연스럽게 연결했습니다.
- source_word: כֶּחָג אֲשֶׁר בִּיהוּדָה
  english_pob_choice: like the feast that was in Judah
  chosen_korean: 유다에 있는 절기와 같은
  alternatives_korean:
  - 유다에 있던 절기와 같은
  - 유다에서 지키던 절기와 같은
  lexicon: HALOT
  rationale: 본문이 특정 절기 이름을 직접 밝히지 않으므로, 영어 POB처럼 유다의 절기라는 비교만 살렸습니다.
- source_word: וַיַּעַל עַל הַמִּזְבֵּחַ
  english_pob_choice: he went up to the altar
  chosen_korean: 제단 위로 올라갔습니다
  alternatives_korean:
  - 제단에 올라갔습니다
  - 제단으로 올라갔습니다
  lexicon: HALOT
  rationale: עָלָה עַל הַמִּזְבֵּחַ는 제단에 접근해 제의 행위를 시작하는 뜻을 담으므로, ‘제단 위로 올라가다’가 문맥을 가장 잘 반영합니다.
- source_word: וְהֶעֱמִיד
  english_pob_choice: he installed
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 임명했습니다
  - 배치했습니다
  - 세웠습니다
  lexicon: HALOT
  rationale: 제의 직분자를 공식적으로 설치하는 뜻을 살리되, 제단과 산당 문맥에서 한국어로는 ‘세우다’가 가장 무난합니다.
theological_decisions:
- issue: 유다의 절기 식별 여부
  chosen_reading: 본문은 절기 이름을 직접 밝히지 않고 비교만 하므로, 본문에는 ‘유다에 있는 절기’로 두었습니다.
  alternative_readings:
  - 초막절로 직접 명시하기
  - 장막절로 직접 명시하기
  rationale: 본문 자체보다 더 많은 정보를 넣지 않기 위해 이름을 본문에 삽입하지 않았습니다. 다만 비교 대상이 유다의 절기라는 점은 분명히 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 말하지 않는 세부를 번역문에 추가하지 않음
