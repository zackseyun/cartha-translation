source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה לֹֽא תַעֲלוּ֩ וְ/לֹא תִלָּ֨חֲמ֜וּ/ן עִם אֲחֵי/כֶ֣ם בְּנֵֽי יִשְׂרָאֵ֗ל שׁ֚וּבוּ אִ֣ישׁ לְ/בֵית֔/וֹ כִּ֧י מֵ/אִתִּ֛/י נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יִּשְׁמְעוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יָּשֻׁ֥בוּ לָ/לֶ֖כֶת כִּ/דְבַ֥ר יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/024.yaml
  text: 'Thus says Yahweh: ‘Do not go up or fight against your brothers[a], the sons of Israel. Return, each man to his house[c][b], for this thing is from me.’ So they listened to the word of Yahweh and turned back to go according to the word of Yahweh.'
  footnotes:
  - marker: a
    text: Or 'against your brothers, the Israelites.' The Hebrew reads literally 'with your brothers, the sons of Israel,' but with 'fight' the preposition means fighting against them.
    reason: lexical_alternative
  - marker: b
    text: Or 'for this matter is from me.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'your brothers.' The kinship language underscores that this would be war against fellow covenant people.
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “올라가지 말고, 너희 형제들인 이스라엘 자손과 싸우지도 마십시오. 각자 자기 집으로 돌아가십시오. 이 일은 나에게서 나온 것입니다.” 그들은 야훼의 말씀을 듣고, 야훼의 말씀대로 돌아가 가려고 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희 형제들인 이스라엘 자손’은 히브리어의 직역감을 살린 표현이며, 전쟁 상대가 언약 공동체 내부임을 강조합니다.
    reason: cultural_note
  - marker: b
    text: ‘이 일은 나에게서 나온 것입니다’는 히브리어의 ‘내게서/나로부터’라는 기원을 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼께서 이렇게 말씀하시니
  lexicon: HALOT
  rationale: 예언자적 전달 공식의 격식을 살리면서, 본문 주어 יְהוָה는 프로젝트 기본값대로 ‘야훼’로 옮겼습니다.
- source_word: עִם אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  english_pob_choice: against your brothers, the sons of Israel
  chosen_korean: 너희 형제들인 이스라엘 자손과
  alternatives_korean:
  - 너희 형제들, 이스라엘 사람들과
  - 너희 형제들인 이스라엘 민족과
  lexicon: HALOT
  rationale: לָחַם과 결합한 עִם은 대항/상대의 뜻이므로 ‘과’로 풀어 싸움의 방향을 드러냈고, ‘형제들’과 ‘이스라엘 자손’의 친족·공동체 긴장을 유지했습니다.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  english_pob_choice: Return, each man to his house
  chosen_korean: 각자 자기 집으로 돌아가십시오
  alternatives_korean:
  - 각 사람은 자기 집으로 돌아가십시오
  - 각기 집으로 돌아가십시오
  lexicon: HALOT
  rationale: 명령형과 분배적 표현 אִישׁ를 자연스러운 현대 한국어로 옮기되, 집(בַּיִת)의 구체성을 유지했습니다.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  english_pob_choice: for this thing is from me
  chosen_korean: 이 일은 나에게서 나온 것입니다
  alternatives_korean:
  - 이 일은 나에게서 비롯된 것입니다
  - 이 일은 내게서 난 것입니다
  lexicon: HALOT
  rationale: 하나님께서 이 사건의 근원이라는 뜻을 문맥에 맞게 드러내면서도, 원인의 범위를 과도하게 해석하지 않도록 ‘나에게서 나온’으로 옮겼습니다.
- source_word: וַיִּשְׁמְעוּ אֶת דְּבַר יְהוָה
  english_pob_choice: So they listened to the word of Yahweh
  chosen_korean: 그들은 야훼의 말씀을 듣고
  alternatives_korean:
  - 그들은 야훼의 말씀을 들었고
  - 그들은 야훼의 말씀에 순종하고
  lexicon: HALOT
  rationale: שׁמע는 ‘듣다’와 ‘순종하다’의 중간 의미를 가질 수 있어, 먼저 ‘듣고’로 옮겨 뒤의 실제 행동으로 응답이 드러나게 했습니다.
theological_decisions:
- issue: 여호와/야훼의 표기 선택
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 프로젝트의 기본 용례를 따르고, 본문의 언약명 사용을 가려지지 않게 하기 위해 전통적 대체어를 쓰지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 형제들 표현의 공동체적 긴장
  chosen_reading: ‘너희 형제들’로 유지해 같은 민족에게 맞서는 내전 금지의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 너희 동족
  - 이스라엘 사람들
  rationale: 출애굽-언약 공동체 내부의 전쟁 금지를 드러내는 핵심 표현이므로 친족 언어를 약화시키지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
