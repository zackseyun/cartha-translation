base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/033.yaml
  text: And he went up to the altar that he had made in Bethel on the fifteenth day in the eighth month[a], in the month that he had devised from his own heart, and he made a feast for the sons of Israel[b]; and he went up to the altar to burn incense.
  footnotes:
  - marker: a
    text: Or, 'in the month that he had devised on his own' or 'of his own choosing.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of Israel,' a standard national designation for the people of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 벧엘에 자기가 만든 제단으로 올라갔습니다. 이는 여덟째 달 열다섯째 날, 곧 그가 자기 마음에서 꾸며 낸 달이었습니다.[a] 그는 이스라엘 자손을[b] 위하여 절기를 열고, 향을 피우기 위해 제단으로 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 마음에서 꾸며 낸 달’은 ‘스스로 정한 달’ 또는 ‘자기 뜻대로 정한 달’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 자손’은 히브리어의 표준적인 민족 명칭으로, 이스라엘 백성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל ... עַל הַמִּזְבֵּחַ
  english_pob_choice: he went up to the altar
  chosen_korean: 제단 위로 올라갔습니다
  alternatives_korean:
  - 제단으로 올라갔습니다
  - 제단에 올라갔습니다
  lexicon: WLC/HALOT עלה
  rationale: עלה의 반복 동작을 자연스러운 한국어로 살리되, 제단에 ‘올라가다’는 제의적 이동을 분명히 드러내기 위해 ‘위로 올라가다’로 옮겼습니다.
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי ... בַּחֹדֶשׁ אֲשֶׁר בָּדָא מִלְּבַד
  english_pob_choice: in the eighth month, in the month that he had devised from his own heart
  chosen_korean: 제팔월 ... 곧 자기가 자기 마음대로 정해 놓은 달
  alternatives_korean:
  - 팔월에 ... 곧 자기가 스스로 만든 달
  - 제팔월 ... 곧 자기 뜻대로 꾸며 낸 달
  lexicon: WLC/HALOT חדש / בדא / מִלְּבַד
  rationale: ‘제팔월’은 חודש השמיני의 달 표기를 자연스럽게 반영하고, 뒤의 절은 절기의 근거가 하나님의 명령이 아니라 인간적 자의였음을 드러내기 위해 ‘자기 마음대로 정해 놓은 달’로 옮겼습니다.
- source_word: וַיַּעַשׂ חָג לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: and he made a feast for the sons of Israel
  chosen_korean: 그는 이스라엘 자손을 위해 절기를 지켰고
  alternatives_korean:
  - 그는 이스라엘 자손을 위해 잔치를 베풀었고
  - 그는 이스라엘 자손을 위해 절기를 만들었고
  lexicon: WLC/HALOT חג
  rationale: חג는 단순한 식사보다 절기/축제를 가리키므로 ‘절기’를 선택했고, 문맥상 왕이 임의로 제정한 종교 축제의 성격을 유지하기 위해 ‘지켰고’로 자연스럽게 표현했습니다.
- source_word: לְהַקְטִיר
  english_pob_choice: to burn incense
  chosen_korean: 향을 피우려 했습니다
  alternatives_korean:
  - 분향하려 했습니다
  - 향을 사르려 했습니다
  lexicon: WLC/HALOT הקטיר
  rationale: הקטיר는 제의적 연기를 올리는 행위로서, 한국어 성서문맥에서 가장 이해되기 쉬운 ‘향을 피우다’를 택하되, 단순 과거보다 목적을 드러내는 부정형으로 마무리했습니다.
theological_decisions:
- issue: 여로보암의 임의적 절기 제정이 지닌 비판적 뉘앙스
  chosen_reading: ‘자기 마음대로 정해 놓은 달’로 옮겨, 절기가 하나님의 계시가 아니라 인간 자의로 만들어졌음을 드러냈습니다.
  alternative_readings:
  - ‘자기 뜻대로 만든 달’
  - ‘스스로 정한 달’
  rationale: 본문의 비판은 달력 정보가 아니라 예배의 정당성에 있습니다. 한국어에서도 ‘마음대로’라는 표현이 자의성과 불순종의 뉘앙스를 유지합니다.
  doctrine_reference: 본문의 우상숭배/자의예배 비판
- issue: לְהַקְטִיר의 목적절 표현
  chosen_reading: ‘향을 피우려 했습니다’로 목적을 드러내어 제단 행위가 단순 이동이 아니라 제의 행위였음을 보였습니다.
  alternative_readings:
  - ‘향을 피우기 위해 올라갔습니다’
  - ‘분향하려고 올라갔습니다’
  rationale: 이 동사는 제사적 행위를 나타내므로, 독자가 제단 행위의 목적을 바로 이해하도록 목적형으로 처리했습니다.
  doctrine_reference: 제의 문맥 보존
