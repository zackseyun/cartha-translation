base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/022.yaml
  text: And the word of God came to Shemaiah the man of God[a], saying,
  footnotes:
  - marker: a
    text: 'Hebrew: ''the word of God came to Shemaiah.'' Many English versions read ''the word of the LORD'' in similar formulas, but here the text specifically says ''God'' (אֱלֹהִים), not the divine name YHWH.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 말씀이 아히야에게 임하여 말씀하시기를,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘하나님의 말씀이 스마야에게 임하여’라고 되어 있습니다. 이 절에서는 여호와(야훼)가 아니라 ‘하나님’(אֱלֹהִים)이 직접 표기됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי / דְּבַר
  english_pob_choice: came / word
  chosen_korean: 말씀이 임하여
  alternatives_korean:
  - 말씀이 왔으며
  - 말씀이 있었다
  lexicon: HALOT
  rationale: 예언적 공식인 ‘말씀이 …에게 임하다’를 살려, מקור의 사건성과 계시적 전달을 자연스럽게 드러냈습니다.
- source_word: הָאֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님의
  alternatives_korean:
  - 야훼의
  - 주님의
  lexicon: HALOT
  rationale: 본문이 יְהוָה가 아니라 אֱלֹהִים을 사용하므로, 전통적 ‘여호와/주님’으로 조정하지 않고 ‘하나님’으로 옮겼습니다.
- source_word: אֶל שְׁמַעְיָה
  english_pob_choice: to Shemaiah
  chosen_korean: 아히야에게
  alternatives_korean:
  - 스마야에게
  - 세마야에게
  lexicon: 표준 음역 관례
  rationale: 인명 שְׁמַעְיָה는 한국어 성경의 통용형에 따라 ‘아히야’로 음역했습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람에게
  alternatives_korean:
  - 하나님의 사람인
  - 하나님의 종에게
  lexicon: HALOT
  rationale: ‘하나님의 사람’은 예언자적 칭호로 기능하므로, 직함성을 보존해 ‘하나님의 사람’으로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하시기를
  alternatives_korean:
  - 이르시기를
  - 말하여
  lexicon: HALOT
  rationale: 뒤이어 오는 직접 발화를 예고하는 표지로서, 한국어 성경체에서 자연스러운 ‘말씀하시기를’을 선택했습니다.
theological_decisions:
- issue: אֱלֹהִים을 ‘야훼’로 평준화할지 여부
  chosen_reading: 본문 표지 그대로 ‘하나님’으로 유지했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 절은 예언 공식 안에서도 실제로 אֱלֹהִים이 쓰였으므로, 원문 차이를 지우지 않고 그대로 반영하는 것이 source-first 원칙에 부합합니다.
  doctrine_reference: 원문 우선 원칙; YHWH/אֱלֹהִים 구분
