    text: 히브리어 본문은 ‘하나님의 말씀이 스마야에게 임하여’라고 되어 있습니다. 이 절에서는 여호와(야훼)가 아니라 ‘하나님’(אֱלֹהִים)이 직접 표기됩니다.
