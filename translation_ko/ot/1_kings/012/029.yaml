    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשֶׂם
  english_pob_choice: He set
  chosen_korean: 두었습니다
  alternatives_korean:
  - 세웠습니다
  - 놓았습니다
  - 두었습니다
  lexicon: HALOT
  rationale: 문맥상 위치를 정해 놓는 동작이므로 자연스럽게 ‘두다’로 옮겼습니다. ‘세우다’는 우상이나 기둥을 세우는 뉘앙스가 강해 여기서는 덜 적합합니다.
- source_word: אֶת הָאֶחָד
  english_pob_choice: one
  chosen_korean: 그 하나는
  alternatives_korean:
  - 하나는
  - 그 한 개는
  - 그 한 마리는
  lexicon: HALOT
  rationale: 히브리어는 앞 절의 두 대상 중 하나를 가리키지만 명사를 반복하지 않습니다. 한국어에서는 지시성을 살려 ‘그 하나는’으로 옮겨 자연스러운 대조를 유지했습니다.
- source_word: בְּבֵית אֵל
  english_pob_choice: in Bethel
  chosen_korean: 베델에
  alternatives_korean:
  - 베델 안에
  - 베델에서
  - 베델에
  lexicon: HALOT
  rationale: בְּ는 장소 표지로서 이 문맥에서는 한국어의 여격 ‘-에’가 가장 자연스럽습니다. 고유명사는 통용 표기인 ‘베델’을 사용했습니다.
- source_word: בְּדָן
  english_pob_choice: in Dan
  chosen_korean: 단에
  alternatives_korean:
  - 단에서
  - 단 안에
  - 단에
  lexicon: HALOT
  rationale: 앞 절과 같은 방식으로 장소 표지 ‘-에’를 유지해 평행 구조를 살렸습니다. 고유명사 ‘단’은 성경 지명으로 널리 쓰이는 형태를 따랐습니다.
theological_decisions:
- issue: 본문의 생략된 대상
  chosen_reading: 본문은 ‘두 송아지’라는 앞 절의 대상을 다시 반복하지 않고 ‘하나/다른 하나’만으로 가리킵니다.
  alternative_readings:
  - ‘그 송아지 하나는 베델에, 다른 하나는 단에’
  rationale: 히브리어의 생략을 본문대로 보존해, 독자가 앞 문맥과 연결해 읽도록 했습니다. 이는 본문의 압축성과 서술 리듬을 유지합니다.
  doctrine_reference: 원문 우선 원칙; 본문이 말하지 않는 명사 보충을 최소화함.
