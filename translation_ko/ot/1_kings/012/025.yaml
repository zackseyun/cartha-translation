source:
  edition: WLC
  text: וַ/יִּ֨בֶן יָרָבְעָ֧ם אֶת שְׁכֶ֛ם בְּ/הַ֥ר אֶפְרַ֖יִם וַ/יֵּ֣שֶׁב בָּ֑/הּ וַ/יֵּצֵ֣א מִ/שָּׁ֔ם וַ/יִּ֖בֶן אֶת פְּנוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/025.yaml
  text: Then Jeroboam built Shechem in the hill country of Ephraim and lived there[a]; and he went out from there and built Penuel.
  footnotes:
  - marker: a
    text: Penuel is also spelled Peniel in some English renderings and related biblical passages.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 여로보암이 에브라임 산지에 있는 세겜을 세우고 거기 살았으며, 거기서 나가서 브누엘을 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 브누엘은 일부 번역과 관련 본문에서 ‘페니엘’로도 표기됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: built
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 건축했습니다
  - 지었습니다
  - 재건했습니다
  - 요새화했습니다
  lexicon: HALOT
  rationale: בנה는 기본적으로 ‘짓다/세우다’의 뜻이므로, 성읍 문맥에서 과도하게 ‘재건’이나 ‘요새화’로 좁히지 않고 자연스러운 현대 한국어인 ‘세우다’로 옮겼습니다.
- source_word: בְּהַר אֶפְרַיִם
  english_pob_choice: in the hill country of Ephraim
  chosen_korean: 에브라임 산지에 있는
  alternatives_korean:
  - 에브라임의 산지에 있는
  - 에브라임 산지에
  - 에브라임 산악 지대에 있는
  lexicon: HALOT
  rationale: הַר는 여기서 단일 ‘산’보다 ‘산지/산악 지대’를 가리키므로, 지리적 범위를 살린 ‘에브라임 산지’로 옮겼습니다.
- source_word: וַיֵּשֶׁב בָּהּ
  english_pob_choice: and lived there
  chosen_korean: 거기 살았으며
  alternatives_korean:
  - 거기 거주했으며
  - 그 안에 살았으며
  - 거기서 살았으며
  lexicon: HALOT
  rationale: ישב는 ‘살다, 거주하다’의 뜻이 자연스러우므로 현대 한국어 표현인 ‘살다’를 택했고, העיר를 여성형 대명사로 받는 점은 한국어에서 ‘거기’로 처리했습니다.
- source_word: פְּנוּאֵל
  english_pob_choice: Penuel
  chosen_korean: 브누엘
  alternatives_korean:
  - 페누엘
  - 파누엘
  lexicon: standard transliteration
  rationale: 히브리어 자음 배열에 더 가까운 현대 한국어 음역으로 ‘브누엘’을 채택했습니다. 영어 POB의 ‘Penuel’은 음역 관행상의 변이로 이해했습니다.
