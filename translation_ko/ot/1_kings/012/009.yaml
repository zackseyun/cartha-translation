- from: 그가 그들에게 말하였습니다[a]. “무슨 조언을 하겠습니까? 우리가 이 백성에게 대답해야 하겠습니다. 그들은 내게 ‘당신의 아버지가 우리에게 지운 멍에를 가볍게 해 주십시오’라고 말하였습니다[b].”
