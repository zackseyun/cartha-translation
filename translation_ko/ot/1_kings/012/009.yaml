id: 1KI.12.9
reference: 1 Kings 12:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם מָ֚ה אַתֶּ֣ם נֽוֹעָצִ֔ים וְ/נָשִׁ֥יב דָּבָ֖ר אֶת הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁ֨ר דִּבְּר֤וּ אֵלַ/י֙ לֵ/אמֹ֔ר הָקֵל֙ מִן הָ/עֹ֔ל אֲשֶׁר נָתַ֥ן אָבִ֖י/ךָ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/009.yaml
  text: And he said to them[a], “What do you advise, that we may answer this people who have spoken to me, saying[b], ‘Lighten the yoke that your father put on us’?”
  footnotes:
  - marker: a
    text: Or, 'return an answer' for the idiom 'answer a word.'
    reason: lexical_alternative
  - marker: b
    text: '''Yoke'' is a metaphor for the heavy labor and obligations imposed by the king.'
    reason: cultural_note
translation:
  language: ko
  text: 그가 그들에게 말하였습니다[a]. “무슨 조언을 하겠습니까? 우리가 이 백성에게 대답해야 하겠습니다. 그들은 내게 ‘당신의 아버지가 우리에게 지운 멍에를 가볍게 해 주십시오’라고 말하였습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말을 돌려 응답하다’라는 관용구로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘멍에’는 왕이 백성에게 지운 무거운 노역과 의무를 비유합니다.
    reason: cultural_note
lexical_decisions:
- source_word: מָה אַתֶּם נוֹעָצִים
  english_pob_choice: What do you advise
  chosen_korean: 무슨 조언을 하겠습니까?
  alternatives_korean:
  - 어떤 조언을 하시겠습니까?
  - 무엇을 조언하십니까?
  lexicon: HALOT
  rationale: 상담을 구하는 질문으로서의 용법을 살려 자연스러운 현대 한국어로 옮기되, 단순 사실 질문이 아니라 조언 요청임을 분명히 했습니다.
- source_word: וְנָשִׁיב דָּבָר
  english_pob_choice: that we may answer
  chosen_korean: 우리가 대답해야 하겠습니다
  alternatives_korean:
  - 우리가 응답해야 하겠습니다
  - 우리가 한 마디를 돌려야 하겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 ‘말을 되돌려 답하다’이지만, 한국어에서는 ‘대답하다’가 가장 자연스럽고 의미를 보존합니다.
- source_word: הָעָם הַזֶּה
  english_pob_choice: this people
  chosen_korean: 이 백성
  alternatives_korean:
  - 이 사람들
  - 이 민족
  lexicon: HALOT
  rationale: 집합명사 עָם의 집단성과 왕 앞의 거리감을 살리기 위해 ‘이 백성’으로 옮겼습니다.
- source_word: הָקֵל מִן הָעֹל
  english_pob_choice: Lighten the yoke
  chosen_korean: 멍에를 가볍게 해 주십시오
  alternatives_korean:
  - 멍에를 덜어 주십시오
  - 짐을 가볍게 해 주십시오
  lexicon: HALOT
  rationale: ‘멍에’는 문자적 이미지이면서 압제와 노역의 은유를 함께 담으므로 유지했고, 동사도 한국어 명령 요청 형식에 맞게 풀었습니다.
- source_word: נָתַן עָלֵינוּ
  english_pob_choice: put on us
  chosen_korean: 우리에게 지운
  alternatives_korean:
  - 우리에게 얹은
  - 우리에게 부과한
  - 우리 위에 놓은
  lexicon: HALOT
  rationale: ‘지우다’는 멍에를 얹어 부담시키는 동작을 한국어로 가장 자연스럽게 재현합니다.
theological_decisions:
- issue: 문장 안의 요청 체와 인용문 안의 직접 발화 체
  chosen_reading: 바깥 서술은 합쇼체로 유지하고, 인용문은 백성의 직접 발화를 그대로 옮겼습니다.
  alternative_readings:
  - 인용문까지 서술체로 평준화
  - 직접화법을 간접화법으로 전환
  rationale: 원문의 대화 구조를 보존해야 하므로, 인용문 내부의 요청과 거리감을 유지하는 것이 중요합니다.
  doctrine_reference: 서사문 직역 원칙
