  to: 그래서 왕은 백성의 말을 듣지 않았습니다. 이는 야훼에게서 비롯된 일이었으니, 야훼께서 실로 사람 아히야를 통하여[b] 느밧의 아들 여로보암에게 하신 말씀을 이루려 하신 것이었습니다.[a]
  rationale: ‘야훼에게서 비롯된 일’로 סִבָּה מֵעִם יְהוָה의 출처 및 사건 전개 의미를 자연스럽게 보존하고, ‘실로 사람 아히야’로 히브리어 지명형 수식을 한국어 어순에 맞추었습니다. 목적절은 야훼가 아히야를 통하여 여로보암에게 앞서 하신 말씀을 이루려 하셨다는 원문의 관계를 유지합니다. 신적 주권과 왕의 책임 사이의 긴장은 해설적으로 강화하거나 약화하지 않았습니다.
