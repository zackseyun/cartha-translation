id: 1KI.12.15
reference: 1 Kings 12:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה סִבָּה֙ מֵ/עִ֣ם יְהוָ֔ה לְמַ֜עַן הָקִ֣ים אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ בְּ/יַד֙ אֲחִיָּ֣ה הַ/שִּׁילֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/015.yaml
  text: So the king did not listen to the people[a], for it was a turn of events from Yahweh[b], in order to establish his word that Yahweh had spoken by the hand of Ahijah the Shilonite to Jeroboam son of Nebat.
  footnotes:
  - marker: a
    text: Or 'for the cause was from the LORD.' The Hebrew סִבָּה can mean 'cause,' 'reason,' or a turn in circumstances.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'by the hand of Ahijah the Shilonite,' an idiom meaning 'through Ahijah the Shilonite.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 왕은 백성의 말을 듣지 않았습니다. 이는 야훼에게서 비롯된 일이었으니, 야훼께서 실로 사람 아히야를 통하여[b] 느밧의 아들 여로보암에게 하신 말씀을 이루려 하신 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 סִבָּה는 ‘원인’, ‘이유’, 또는 ‘상황의 전환’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 ‘실로 사람 아히야의 손으로’라고 하며, 아히야가 전달의 매개자였음을 나타내는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע / אֶל הָעָם
  english_pob_choice: did not listen to the people
  chosen_korean: 백성의 말을 듣지 않았습니다
  alternatives_korean:
  - 백성에게 귀를 기울이지 않았습니다
  - 백성을 듣지 않았습니다
  lexicon: HALOT
  rationale: שׁמע와 목적어 אֶל은 단순한 청취가 아니라 요청을 받아들이지 않는 뜻이므로, 한국어에서는 자연스럽게 ‘말을 듣지 않다’로 옮겼습니다.
- source_word: סִבָּה מֵעִם יְהוָה
  english_pob_choice: it was a turn of events from Yahweh
  chosen_korean: 그것은 야훼에게서 나온 일이었습니다
  alternatives_korean:
  - 그 일의 원인은 야훼께 있었습니다
  - 그것은 야훼로부터의 사정이었습니다
  lexicon: HALOT
  rationale: סִבָּה는 ‘원인’과 ‘사정/전환’의 뉘앙스를 함께 가질 수 있어, 단순한 추상명사보다 사건의 전개를 살리는 ‘나온 일’로 옮겼습니다.
- source_word: לְמַעַן הָקִים אֶת דְּבָרוֹ
  english_pob_choice: in order to establish his word
  chosen_korean: 자기의 말씀을 이루려 하심이었습니다
  alternatives_korean:
  - 자기의 말씀을 확증하려 하심이었습니다
  - 자기의 말씀을 세우려 하심이었습니다
  lexicon: HALOT
  rationale: הקים와 ‘말씀’의 결합은 예언의 성취를 가리키므로, 한국어에서는 ‘이루다’로 자연스럽고도 목적절의 의미를 분명하게 살렸습니다.
- source_word: בְּיַד אֲחִיָּה הַשִּׁילֹנִי
  english_pob_choice: by the hand of Ahijah the Shilonite
  chosen_korean: 아히야 곧 실로 사람을 통해
  alternatives_korean:
  - 실로 사람 아히야를 통해
  - 아히야 실로 사람의 손으로
  lexicon: HALOT
  rationale: ביד은 예언자적 매개를 나타내는 관용구이므로, 직역투를 피하면서도 ‘통해’로 전달했습니다. 하이픈식 지명 형용사는 ‘실로 사람’으로 풀었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명사형은 번역 전통어가 아니라 학술 음역 ‘야훼’를 따랐습니다. 본절은 동일한 이름이 반복되므로 일관되게 유지했습니다.
theological_decisions:
- issue: 여호와/야훼의 사건 주도와 인간 행위의 긴장
  chosen_reading: 왕의 거절은 백성의 청을 무시한 인간 행위이면서도, 그 배후에 야훼에게서 나온 일이 있었다는 진술을 함께 살렸습니다.
  alternative_readings:
  - 야훼께서 단순히 허용하셨다는 약한 섭리 표현
  - 왕의 거절을 야훼가 직접 강제하셨다는 과도한 결정론적 표현
  rationale: 히브리어는 결과의 출처를 야훼께 돌리면서도 목적절로 예언 성취를 설명합니다. 번역은 이 긴장을 풀지 않고 그대로 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
