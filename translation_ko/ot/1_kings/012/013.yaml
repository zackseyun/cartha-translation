base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/013.yaml
  text: And the king answered the people harshly, and he abandoned the counsel of the elders who had advised him.
translation:
  language: ko
  text: 왕은 백성에게 거칠게 대답하고, 자신에게 조언해 준 원로들의 조언을 버렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하고
  alternatives_korean:
  - 응답하고
  - 대답했습니다
  lexicon: HALOT
  rationale: נענה/ענה의 서사적 용법을 따라 ‘대답하다’로 옮기되, 문맥의 연속 동작을 살려 연결형으로 처리했습니다.
- source_word: קָשָׁה
  english_pob_choice: harshly
  chosen_korean: 거칠게
  alternatives_korean:
  - 가혹하게
  - 심하게
  lexicon: HALOT
  rationale: 왕의 응답 태도의 강경함을 자연스럽게 드러내는 현대 한국어로 ‘거칠게’를 택했습니다.
- source_word: וַיַּעֲזֹב
  english_pob_choice: abandoned
  chosen_korean: 버렸습니다
  alternatives_korean:
  - 내버렸습니다
  - 저버렸습니다
  - 떠났습니다
  lexicon: HALOT
  rationale: 조언을 의도적으로 거절하고 제쳐두는 결단을 나타내므로, 단순한 ‘떠나다’보다 ‘버리다’가 원문의 강한 단절감을 더 잘 반영합니다.
- source_word: עֲצַת הַזְּקֵנִים
  english_pob_choice: the counsel of the elders
  chosen_korean: 장로들의 조언
  alternatives_korean:
  - 원로들의 조언
  - 장로들의 충고
  - 장로들의 의견
  lexicon: HALOT
  rationale: זְּקֵנִים은 단순한 연장자가 아니라 조언하는 지위의 원로들을 가리키므로, 교회 용어보다 중립적인 ‘장로들’과 ‘조언’을 유지했습니다.
theological_decisions:
- issue: 왕의 반응을 얼마나 직접적으로 드러낼지
  chosen_reading: 본문의 부정적 평가를 약화하지 않고, ‘거칠게’와 ‘버렸습니다’로 왕의 불순종과 전환을 분명히 드러냈습니다.
  alternative_readings:
  - 부드럽게 완화한 표현
  - ‘무시했습니다’처럼 덜 강한 표현
  rationale: 이 절은 뒤이어 분열로 이어지는 왕의 결정적 전환점이므로, 원문의 강한 서술을 유지하는 것이 해석상 중요합니다.
  doctrine_reference: 열왕기상 12장 문맥상 왕권의 실패와 인간 지혜의 거절
