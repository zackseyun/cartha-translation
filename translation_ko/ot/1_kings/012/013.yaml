  terminology: עֲצַת는 ‘조언’, זְקֵנִים은 왕의 연장자 조언자라는 문맥상 ‘원로들’로 옮겼습니다. ‘버렸습니다’는 עזב의 의도적인 배척을 무리 없이 나타냅니다.
