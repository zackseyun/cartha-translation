source:
  edition: WLC
  text: אִֽם יַעֲלֶ֣ה הָ/עָ֣ם הַ/זֶּ֗ה לַ/עֲשׂ֨וֹת זְבָחִ֤ים בְּ/בֵית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ֠/שָׁב לֵ֣ב הָ/עָ֤ם הַ/זֶּה֙ אֶל אֲדֹ֣נֵי/הֶ֔ם אֶל רְחַבְעָ֖ם מֶ֣לֶךְ יְהוּדָ֑ה וַ/הֲרָגֻ֕/נִי וְ/שָׁ֖בוּ אֶל רְחַבְעָ֥ם מֶֽלֶךְ יְהוּדָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/027.yaml
  text: If this people goes up to offer sacrifices in the house of Yahweh in Jerusalem[a], then the heart of this people will return to their lord, to Rehoboam king of Judah[c][b], and they will kill me and return to Rehoboam king of Judah.
  footnotes:
  - marker: a
    text: Or 'When this people goes up…' The Hebrew conditional particle can in some contexts approach a temporal sense, but here it is best taken as Jeroboam's feared condition.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house of the LORD'; that is, the temple in Jerusalem.
    reason: cultural_note
  - marker: c
    text: Or 'to their master.' The Hebrew term can denote a lord or master; here it refers to Rehoboam, as the following apposition makes clear.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 이 백성이 예루살렘에서 야훼의 집에서 제사를 드리려고 올라가면, 이 백성의 마음이 그들의 주, 곧 유다 왕 르호보암에게로 돌아가고, 그들이 나를 죽일 것이며 유다 왕 르호보암에게로 돌아갈 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉 ‘이 백성이… 올라가면’이라는 시간적 뉘앙스보다, 여로보암이 두려워하는 조건을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘여호와의 집’입니다. 곧 예루살렘의 성전을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그들의 주인’. 그러나 뒤의 ‘유다 왕 르호보암’이 이를 분명히 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 만약
  - '...하면'
  lexicon: HALOT
  rationale: 불안 섞인 조건문을 분명히 드러내는 표준적 표현으로, 영어 POB의 가정적 조건을 자연스럽게 옮겼습니다.
- source_word: יַעֲלֶה
  english_pob_choice: goes up
  chosen_korean: 올라가면
  alternatives_korean:
  - 가면
  - 올라가서
  lexicon: HALOT
  rationale: 예루살렘으로의 순례·상경 관용구를 살리기 위해 ‘올라가다’를 유지했습니다.
- source_word: בְּבֵית יְהוָה
  english_pob_choice: in the house of Yahweh
  chosen_korean: 야훼의 집에서
  alternatives_korean:
  - 야훼의 성전에서
  - 야훼의 집 안에서
  lexicon: HALOT
  rationale: בַּיִת + YHWH의 성소 표현을 직역에 가깝게 살리되, 한국어에서는 ‘~에서’가 가장 자연스럽습니다.
- source_word: וְשָׁב לֵב הָעָם הַזֶּה
  english_pob_choice: then the heart of this people will return
  chosen_korean: 이 백성의 마음이 … 돌아가고
  alternatives_korean:
  - 이 백성의 마음이 … 되돌아가고
  - 이 백성의 마음이 … 돌아설 것이며
  lexicon: HALOT
  rationale: ‘마음’이 충성의 방향을 되돌리는 의미를 살려 ‘돌아가다’로 옮겼고, 뒤의 반복과 연결되도록 했습니다.
- source_word: אֶל אֲדֹנֵיהֶם
  english_pob_choice: to their lord
  chosen_korean: 그들의 주
  alternatives_korean:
  - 그들의 주인
  - 그들의 주님
  lexicon: HALOT
  rationale: 문맥상 르호보암을 가리키므로 ‘주’로 옮겨 왕에게 대한 종속 관계를 드러냈습니다. '주인'은 한국어에서 더 강한 소유·지배 뉘앙스가 있어 피했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 신명기적 고유명사인 יְהוָה를 ‘야훼’로 옮겨, 본문이 말하는 언약명 자체를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
- issue: ‘여호와의 집’ 관용구의 처리
  chosen_reading: 야훼의 집
  alternative_readings:
  - 여호와의 집
  - 야훼의 성전
  rationale: 히브리어 המקביל 표현을 본문 안에서 직접 보이게 하여, 단순한 교회식 정형어로 환원하지 않았습니다.
  doctrine_reference: POB source-note on בֵּית יְהוָה
