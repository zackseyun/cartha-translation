  lexicon: HALOT
  rationale: ‘마음’이 충성의 방향을 되돌리는 의미를 살려 ‘돌아가다’로 옮겼고, 뒤의 반복과 연결되도록 했습니다.
- source_word: אֶל אֲדֹנֵיהֶם
  english_pob_choice: to their lord
  chosen_korean: 그들의 주
  alternatives_korean:
  - 그들의 주인
  - 그들의 주님
  lexicon: HALOT
  rationale: 문맥상 르호보암을 가리키므로 ‘주’로 옮겨 왕에게 대한 종속 관계를 드러냈습니다. '주인'은 한국어에서 더 강한 소유·지배 뉘앙스가 있어 피했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 신명기적 고유명사인 יְהוָה를 ‘야훼’로 옮겨, 본문이 말하는 언약명 자체를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
- issue: ‘여호와의 집’ 관용구의 처리
  chosen_reading: 야훼의 집
  alternative_readings:
