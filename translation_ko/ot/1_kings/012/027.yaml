  - 올라가서
  lexicon: HALOT
  rationale: 예루살렘으로의 순례·상경 관용구를 살리기 위해 ‘올라가다’를 유지했습니다.
- source_word: בְּבֵית יְהוָה
  english_pob_choice: in the house of Yahweh
  chosen_korean: 야훼의 집에서
  alternatives_korean:
  - 야훼의 성전에서
  - 야훼의 집 안에서
  lexicon: HALOT
  rationale: בַּיִת + YHWH의 성소 표현을 직역에 가깝게 살리되, 한국어에서는 ‘~에서’가 가장 자연스럽습니다.
- source_word: וְשָׁב לֵב הָעָם הַזֶּה
  english_pob_choice: then the heart of this people will return
  chosen_korean: 이 백성의 마음이 … 돌아가고
  alternatives_korean:
  - 이 백성의 마음이 … 되돌아가고
