  text: 그러나 유다의 성읍들에 살던 이스라엘 자손들을 르호보암이 다스렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  english_pob_choice: the Israelites
  chosen_korean: 이스라엘 자손들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 직역상 ‘이스라엘의 아들들’이지만, 한국어 성경 문맥에서는 민족·언약 공동체를 가리키는 관용적 표현인 ‘이스라엘 자손들’이 가장 자연스럽고 원문의 집단성을 잘 드러냅니다.
- source_word: הַ/יֹּשְׁבִים
  english_pob_choice: who lived
  chosen_korean: 살고 있던
  alternatives_korean:
  - 거주하던
  - 살아 있던
  lexicon: HALOT
  rationale: 분사 ישב는 여기서 지속적 거주를 뜻하므로, 현대 한국어에서 자연스러운 진행·상태 표현인 ‘살고 있던’으로 옮겼습니다.
- source_word: בְּ/עָרֵי יְהוּדָה
  english_pob_choice: in the cities of Judah
  chosen_korean: 유다의 성읍들에
  alternatives_korean:
  - 유다의 도시들에
  - 유다 성읍들에
  lexicon: HALOT
  rationale: עָרִים은 여기서 행정적·지리적 ‘성읍들’이 적절하며, ‘유다의’는 지역 소속을 분명히 합니다.
- source_word: וַ/יִּמְלֹךְ עֲלֵי/הֶם
  english_pob_choice: reigned over
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 그들 위에 통치했습니다
  - 그들 위에서 왕이 되었습니다
  lexicon: HALOT
  rationale: מלך는 문맥상 왕권 행사를 뜻하므로 ‘다스렸습니다’가 간결하면서도 통치 관계를 자연스럽게 전달합니다.
- source_word: רְחַבְעָם
  english_pob_choice: Rehoboam
  chosen_korean: 르호보암
  alternatives_korean:
  - 르하브암
  - 레호보암
  lexicon: standard Korean biblical proper name
  rationale: 한국어에서 널리 통용되는 표기 ‘르호보암’을 따랐습니다.
theological_decisions:
- issue: 북이스라엘의 반역 이후에도 유다 지역의 이스라엘 자손들이 르호보암의 통치 아래 있었다는 점의 표현
  chosen_reading: 본문의 대조를 살려 ‘그러나’로 시작해, 앞선 분열 서술과 달리 유다 성읍들에 거주하던 이스라엘 자손들이 르호보암의 통치를 받았음을 분명히 했습니다.
  alternative_readings:
  - 그리고 르호보암이 유다의 성읍들에 살던 이스라엘 자손들을 다스렸습니다.
  - 그런데 르호보암이 유다의 성읍들에 있던 이스라엘 자손들 위에 임금이 되었습니다.
  rationale: 히브리어 접속사 וּ는 이 문맥에서 단순 연결보다 앞선 반역 기사와의 대비를 띠므로, 한국어에서도 대비를 분명히 하는 것이 서술 흐름을 더 잘 반영합니다.
  doctrine_reference: 문맥 대비와 역사 서술의 정확성
