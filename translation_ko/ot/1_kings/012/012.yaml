  text: ו/יבו יָרָבְעָ֧ם וְ/כָל הָ/עָ֛ם אֶל רְחַבְעָ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר הַ/מֶּ֨לֶךְ֙ לֵ/אמֹ֔ר שׁ֥וּבוּ אֵלַ֖/י בַּ/יּ֥וֹם הַ/שְּׁלִישִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had spoken, saying, “Return to me on the third day.”
  footnotes:
  - marker: a
    text: Or “Return to me on the third day.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 여로보암과 모든 백성이 셋째 날에 르호보암에게 왔습니다[a]. 그것은 왕이 말한 대로였습니다. “셋째 날에 내게 돌아오십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “셋째 날에 내게 돌아오십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ ... אֶל רְחַבְעָם
  english_pob_choice: came to Rehoboam
  chosen_korean: 르호보암에게 왔습니다
  alternatives_korean:
  - 르호보암에게 돌아왔습니다
  - 르호보암 앞에 왔습니다
  lexicon: WLC/HALOT
  rationale: בוא 뒤의 אֶל은 방향을 나타내며, 서술자의 시점에서는 ‘오다’가 자연스럽고 직접적입니다.
- source_word: וְכָל הָעָם
  english_pob_choice: and all the people
  chosen_korean: 모든 백성이
  alternatives_korean:
  - 온 백성이
  - 모든 사람들이
  lexicon: WLC/HALOT
  rationale: עָם은 여기서 집합적 ‘백성’을 가리키므로, 문맥상 가장 자연스러운 공적 표현으로 옮겼습니다.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  english_pob_choice: on the third day
  chosen_korean: 셋째 날에
  alternatives_korean:
  - 세 번째 날에
  - 사흘째 되는 날에
  lexicon: WLC/HALOT
  rationale: 히브리어의 관용적 날짜 표현을 한국어로도 간결하고 표준적으로 살렸습니다.
- source_word: שׁוּבוּ אֵלַי
  english_pob_choice: Return to me
  chosen_korean: 내게 돌아오십시오
  alternatives_korean:
  - 내게 돌아오라
  - 내게 돌아와 주십시오
  lexicon: HALOT
  rationale: שׁוּב는 ‘돌아오다/되돌아가다’의 기본 뜻이므로, 왕의 명령형을 현대 공문체에 맞는 공손한 명령으로 옮겼습니다.
theological_decisions:
- issue: 왕의 직접 명령의 화법
  chosen_reading: “내게 돌아오십시오”로 공손한 명령형을 유지했습니다.
  alternative_readings:
  - 직설적 명령인 ‘내게 돌아오라’
  - 완곡한 요청형 ‘내게 돌아와 주십시오’
  rationale: 본문의 왕명은 명령의 성격이 분명하므로, 한국어에서는 공적·형식적 호칭을 유지하면서도 명령성을 희석하지 않는 표현이 적절합니다.
  doctrine_reference: 서술체의 권위적 발화와 직접화법의 화행 보존
