base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/030.yaml
  text: And this thing became a sin[a], and the people went before the one as far as Dan.
  footnotes:
  - marker: a
    text: 'Hebrew: ''before the one.'' The phrase likely means ''before the one calf,'' referring to one of the two calves Jeroboam set up, especially the one at Dan.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일은 죄가 되었고, 백성은 단에 이르기까지 그 하나 앞에 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 「그 하나 앞에」라고 합니다. 문맥상 앞서 세운 두 송아지 가운데 하나를 가리키며, 특히 단에 있는 송아지를 뜻하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַדָּבָר הַזֶּה לְחַטָּאת
  english_pob_choice: And this thing became a sin
  chosen_korean: 이 일은 죄가 되었고
  alternatives_korean:
  - 이 일은 죄가 되었습니다
  - 이 일이 죄가 되었고
  - 이 일은 죄가 되었으니
  lexicon: HALOT
  rationale: דָּבָר הַזֶּה는 구체적 사건/일을 가리키므로 「이 일」로 옮기고, היה + לְחַטָּאת의 결과적 의미를 살려 「죄가 되다」로 번역했습니다.
- source_word: וַיֵּלְכ֥וּ הָעָ֛ם
  english_pob_choice: and the people went
  chosen_korean: 백성은
  alternatives_korean:
  - 사람들은
  - 백성들이
  lexicon: HALOT
  rationale: הלך는 본문상 단순 이동 동사이지만, 한국어에서는 뒤의 장소 표현과 자연스럽게 연결되도록 주어를 앞에 두었습니다.
- source_word: לִפְנֵ֥י הָאֶחָ֖ד
  english_pob_choice: before the one
  chosen_korean: 그 하나 앞에서
  alternatives_korean:
  - 그 하나 앞에
  - 그 한 마리 앞에서
  - 그 하나의 앞에서
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 「그 하나」라고만 하여 칼 하나를 생략합니다. 본문은 그 생략을 살리되, 한국어에서 어색하지 않도록 「앞에서」로 옮겼습니다.
- source_word: עַד דָּן
  english_pob_choice: as far as Dan
  chosen_korean: 단까지
  alternatives_korean:
  - 단에 이르기까지
  - 단까지 가서
  - 단에 이르기까지
  lexicon: HALOT
  rationale: עַד는 도달 범위를 나타내므로 간결한 지리적 종착점 표현인 「단까지」가 가장 직접적입니다.
theological_decisions:
- issue: 죄로 규정되는 사건의 성격
  chosen_reading: 본문은 여로보암의 제의적 배열이 죄가 되었다고 말할 뿐, 그 죄를 설명적으로 풀어주지는 않습니다.
  alternative_readings:
  - 이 일은 죄의 원인이 되었다
  - 이 일은 죄를 낳았다
  rationale: חַטָּאת의 의미를 도덕적/예배적 죄로 유지하되, 본문이 제공하지 않는 추가 해설은 덧붙이지 않았습니다.
  doctrine_reference: 본문의 단정적 평가를 보존하고, 신학적 해설은 최소화합니다.
- issue: 「그 하나」의 지시 대상
  chosen_reading: 「그 하나」는 앞서 언급된 두 송아지 가운데 하나를 가리키며, 문맥상 특히 단의 송아지를 가리키는 것으로 보입니다.
  alternative_readings:
  - 본문에 ‘송아지’를 보충해 ‘그 한 송아지’로 번역
  - 문맥을 따라 ‘그 송아지’로 평탄화
  rationale: 히브리어의 압축된 표현을 본문에서 유지하고, 지시 대상을 본문 밖 해설로 처리해 원문의 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 문맥적 지시 대상은 주석에서 밝힙니다.
