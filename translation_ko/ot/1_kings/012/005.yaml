  source_fidelity: ‘사흘을 더 가 있다가’는 히브리어의 떠나라는 명령과 사흘의 유예 기간을 함께 전달하려는 의도는 있으나, 현대 한국어에서는 ‘가 있다’가 다소 어색하고 목적지가 있는 이동·체류로 읽힐 수 있습니다. ‘사흘 동안 더 물러가 있다가’는 לְכוּ와 עוֹד שְׁלֹשָׁה יָמִים의 일시적 퇴거 및 추가 기간을 더 분명하고 자연스럽게 보존합니다. ‘내게로 돌아오십시오’는 וְשׁוּבוּ אֵלַי에 충실합니다.
  naturalness: 합쇼체 서술과 명령의 높임이 일관됩니다. ‘그러자’는 백성이 명령에 따라 떠난 서사적 진행을 자연스럽게 나타내며, 원문의 단순 접속을 과도한 인과로 만들지 않습니다.
  terminology: ‘백성’은 집합명사 הָעָם에 적절합니다. 이 절에는 별도의 신학 전문 용어 또는 인명 표기 문제가 없습니다.
