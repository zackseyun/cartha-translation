translation:
  language: ko
  text: 그가 그들에게 말하였습니다. “사흘을 더 가 있다가 내게 돌아오십시오.” 그래서 백성은 떠났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: He said
  chosen_korean: 그가 … 말하였습니다
  alternatives_korean:
  - 그가 … 말했습니다
  - 그리고 그가 … 말하였습니다
  lexicon: HALOT
  rationale: 서술형 wayyiqtol의 담담한 말하기 동사를 현대 합쇼체로 자연스럽게 옮겼습니다.
- source_word: לְכוּ עוֹד שְׁלֹשָׁה יָמִים
  english_pob_choice: Go away for three more days
  chosen_korean: 사흘을 더 가 있다가
  alternatives_korean:
  - 사흘을 더 가십시오
  - 사흘 동안 더 떠나 있다가
  lexicon: HALOT
  rationale: לְכוּ의 이동 명령과 עוֹד + 시간표현의 추가 기간 의미를 함께 살려, 임시로 자리를 비우라는 뉘앙스를 한국어로 자연스럽게 표현했습니다.
- source_word: וְשׁוּבוּ אֵלַי
  english_pob_choice: then return to me
  chosen_korean: 내게 돌아오십시오
  alternatives_korean:
  - 그리고 내게 돌아오십시오
  - 그다음 내게 돌아오십시오
  lexicon: HALOT
  rationale: שׁוּב의 핵심 의미를 ‘돌아오다’로 살리고, 목적지를 ‘내게’로 분명히 했습니다. 순차성은 문맥상 자연히 드러난다고 보았습니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 그 백성
  - 사람들
  lexicon: HALOT
  rationale: 히브리어 집합명사 הָעָם을 집합적 의미의 ‘백성’으로 옮겨, 왕에게 나아온 대표단을 포함한 공동체 전체를 가리키는 느낌을 유지했습니다.
