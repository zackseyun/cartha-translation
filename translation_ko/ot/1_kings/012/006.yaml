base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''How do you advise to answer this people a word?'' The expression means to give them a reply.'
    reason: lexical_alternative
  - marker: b
    text: Or 'who had served in Solomon's presence.' Literally, 'who had stood before Solomon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 르호보암 왕은 살아 있는 동안 자기 아버지 솔로몬 앞에 서 있던 장로들에게 조언을 구하며 말했습니다[a], “이 백성에게 어떻게 대답하라고 하십니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이 백성에게 한 말을 어떻게 대답하라고 하십니까?’에 가깝지만, 관용적으로 ‘대답’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  english_pob_choice: consulted
  chosen_korean: 조언을 구하며
  alternatives_korean:
  - 상담하며
  - 자문하며
  - 의논하며
  lexicon: HALOT
  rationale: 이 동사는 단순히 마음속으로 숙고한 것이 아니라 다른 사람들의 의견을 구하는 뜻이므로, 자연스러운 한국어로는 ‘조언을 구하다’가 가장 잘 맞습니다.
- source_word: הַזְּקֵנִים
  english_pob_choice: the elders
  chosen_korean: 장로들
  alternatives_korean:
  - 원로들
  - 노인들
  - 연장자들
  lexicon: HALOT
  rationale: 궁정 자문역으로서의 זקנים은 연세만을 가리키지 않고 원로 조언자들을 뜻하므로, 교회 직분어가 아닌 일반적·문맥적 의미를 살린 ‘장로들’이 적절합니다.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים אֶת פְּנֵי שְׁלֹמֹה
  english_pob_choice: who had stood before Solomon
  chosen_korean: 솔로몬 앞에 서 있던
  alternatives_korean:
  - 솔로몬을 모시던
  - 솔로몬 앞에서 시중들던
  - 솔로몬 앞에 출입하던
  lexicon: HALOT
  rationale: ‘서 있다’는 왕 앞에서 봉사·출입하는 궁정 관용구를 보존하면서도, 한국어에서 자연스럽게 읽히도록 옮겼습니다.
- source_word: לְהָשִׁיב אֶת הָעָם הַזֶּה דָּבָר
  english_pob_choice: to answer this people
  chosen_korean: 이 백성에게 어떻게 대답하라고
  alternatives_korean:
  - 이 백성에게 어떻게 답하라고
  - 이 백성에게 어떤 말을 하라고
  - 이 백성에게 무슨 답변을 하라고
  lexicon: HALOT
  rationale: 직역하면 ‘말 한 마디를 돌려주다’에 가까우나, 문맥상 요구되는 것은 회답이므로 ‘대답하다’로 옮기되, שאל문의 대상이 되는 백성을 ‘이 백성에게’로 드러냈습니다.
theological_decisions:
- issue: 왕이 장로들에게 묻는 질문의 형식
  chosen_reading: 본문을 질문형 직접화법으로 유지해, 르호보암이 실제로 백성에 대한 답변 전략을 묻고 있음을 드러냈습니다.
  alternative_readings:
  - 서술형으로 완화하여 의중을 설명하는 방식
  - ‘어떻게 응대하면 되겠느냐’처럼 일반화하는 방식
  rationale: 히브리어의 직접 질문은 정치적·서사적 긴장을 형성하므로, 이를 평이한 설명문으로 바꾸지 않고 그대로 살리는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 서사 해석 원칙
