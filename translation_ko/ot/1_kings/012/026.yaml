  rationale: 히브리어의 신체 은유(마음)를 유지하면서도 현대 한국어 독자가 즉시 이해할 수 있게 했습니다. 인물의 속셈을 설명적으로 확대하지는 않았습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source imagery without over-paraphrase.'
