  text: And Jeroboam said in his heart[a], “Now the kingdom will return to the house of David.”
  footnotes:
  - marker: a
    text: Or “to himself.” The Hebrew literally says “in his heart.”
    reason: lexical_alternative
translation:
  language: ko
  text: 여로보암은 마음속으로 말했습니다. “이제 왕국이 다윗의 집으로 돌아가겠구나.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “그의 마음 안에서”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 이에 말했습니다
  lexicon: WLC
  rationale: 서술 진행을 자연스럽게 살리되, 한국어에서는 ‘그리고’보다 간결한 동사 직설로 내면 독백의 시작을 매끈하게 전달했습니다.
- source_word: בְּלִבּוֹ
  english_pob_choice: in his heart
  chosen_korean: 마음속으로
  alternatives_korean:
  - 마음에
  - 자기 자신에게
  lexicon: HALOT
  rationale: 히브리어 관용구의 내적 사고를 한국어에서 가장 자연스럽게 드러내는 표현으로 옮겼고, ‘to himself’의 해석을 과도하게 풀지 않았습니다.
- source_word: הַמַּמְלָכָה
  english_pob_choice: the kingdom
  chosen_korean: 왕국
  alternatives_korean:
  - 나라
  - 왕권
  lexicon: HALOT
  rationale: 정치적 통치 영역을 가리키는 문맥이므로 ‘왕국’이 가장 직접적이고, 다윗 집안과 대비되는 왕조적 긴장을 잘 보존합니다.
- source_word: לְבֵית דָּוִד
  english_pob_choice: to the house of David
  chosen_korean: 다윗의 집으로
  alternatives_korean:
  - 다윗 가문으로
  - 다윗의 왕조로
  lexicon: HALOT
  rationale: 성경의 정형적 표현인 ‘다윗의 집’을 살리되, 한국어에서는 방향격을 붙여 귀속/회귀의 의미를 분명하게 했습니다.
theological_decisions:
- issue: 내면 독백을 나타내는 표현 방식
  chosen_reading: “마음속으로 말했습니다”
  alternative_readings:
  - “자기 자신에게 말했습니다”
  - “속으로 말했습니다”
  rationale: 히브리어의 신체 은유(마음)를 유지하면서도 현대 한국어 독자가 즉시 이해할 수 있게 했습니다. 인물의 속셈을 설명적으로 확대하지는 않았습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source imagery without over-paraphrase.'
