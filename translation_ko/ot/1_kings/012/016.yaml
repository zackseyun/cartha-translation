  text: וַ/יַּ֣רְא כָּל יִשְׂרָאֵ֗ל כִּ֠י לֹֽא שָׁמַ֣ע הַ/מֶּלֶךְ֮ אֲלֵי/הֶם֒ וַ/יָּשִׁ֣בוּ הָ/עָ֣ם אֶת הַ/מֶּ֣לֶךְ דָּבָ֣ר לֵ/אמֹ֡ר מַה לָּ/נוּ֩ חֵ֨לֶק בְּ/דָוִ֜ד וְ/לֹֽא נַחֲלָ֣ה בְּ/בֶן יִשַׁ֗י לְ/אֹהָלֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְ/ךָ֖ דָּוִ֑ד וַ/יֵּ֥לֶךְ יִשְׂרָאֵ֖ל לְ/אֹהָלָֽי/ו־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/016.yaml
  text: When all Israel saw that the king had not listened to them[a], the people answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. To your tents, O Israel! Now see to your own house[b], David.” So Israel went to their tents.
  footnotes:
  - marker: a
    text: Or 'To your homes, Israel!' The Hebrew literally says 'to your tents,' an idiom for dispersing and withdrawing allegiance.
    reason: lexical_alternative
  - marker: b
    text: '''House'' may also carry the sense of ''dynasty'' here: ''See to your own dynasty, David.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 온 이스라엘은 왕이 자기들에게 귀를 기울이지 않았음을 보고, 백성이 왕에게 대답하여 말했습니다. “우리에게 다윗과 무슨 몫이 있습니까? 이새의 아들에게서도 우리가 받을 기업이 없습니다. 이스라엘아, 너희 천막으로 돌아가십시오! 이제 너는 네 집을 보라, 다윗이여.” 그래서 이스라엘은 자기 천막으로 돌아갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너희 천막으로’입니다. 이는 흩어져 각자 물러서겠다는 관용구로, ‘집으로’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 여기서 ‘왕조’의 뜻을 가질 수도 있습니다. 따라서 ‘다윗이여, 네 왕조를 살피라’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא כָּל יִשְׂרָאֵל
  english_pob_choice: When all Israel saw
  chosen_korean: 온 이스라엘은 … 보고
  alternatives_korean:
  - 온 이스라엘이 … 보았을 때
  - 온 이스라엘이 … 알게 되었을 때
  lexicon: WLC
  rationale: ראה를 단순한 시각 행위로 두기보다, 왕이 듣지 않았다는 사실을 인지한 상황으로 자연스럽게 옮기되 집합명사 ‘온 이스라엘’을 유지했습니다.
- source_word: לֹא שָׁמַע הַמֶּלֶךְ אֲלֵיהֶם
  english_pob_choice: the king had not listened to them
  chosen_korean: 왕이 자기들에게 귀를 기울이지 않았음을
  alternatives_korean:
  - 왕이 자기들의 말을 듣지 않았음을
  - 왕이 자기들에게 응답하지 않았음을
  lexicon: HALOT
  rationale: שׁמע + אֶל의 ‘듣고 따르다/귀 기울이다’라는 뜻을 살려, 단순 청각이 아니라 그들의 청원을 거절한 의미를 반영했습니다.
- source_word: מַה לָּנוּ חֵלֶק בְּדָוִד … וְלֹא נַחֲלָה בְּבֶן יִשַׁי
  english_pob_choice: What share do we have in David? We have no inheritance in the son of Jesse.
  chosen_korean: 우리에게 다윗과 무슨 몫이 있습니까? 이새의 아들에게서도 우리가 받을 기업이 없습니다.
  alternatives_korean:
  - 우리가 다윗과 무슨 몫을 가집니까?
  - 우리는 이새의 아들에게서 어떤 몫도 없습니다.
  lexicon: HALOT
  rationale: חלק을 ‘몫’으로, נחלה를 ‘기업’으로 옮겨 정치적 결별과 분배/상속의 뉘앙스를 함께 살렸습니다.
- source_word: לְאֹהָלֶיךָ יִשְׂרָאֵל
  english_pob_choice: To your tents, O Israel!
  chosen_korean: 이스라엘아, 너희 천막으로 돌아가십시오!
  alternatives_korean:
  - 이스라엘아, 너희 천막으로!
  - 이스라엘아, 너희 집으로 돌아가십시오!
  lexicon: HALOT
  rationale: ‘천막’의 직역을 살리되, 한국어 독자가 이해하도록 분산과 철수의 관용적 명령으로 풀어 옮겼습니다. 본문의 고대 관용구를 과도하게 현대화하지 않으려는 선택입니다.
- source_word: בֵיתְךָ
  english_pob_choice: your own house
  chosen_korean: 네 집을
  alternatives_korean:
  - 네 왕조를
  - 네 집안일을
  lexicon: HALOT
  rationale: בַּיִת의 ‘집/집안/왕조’ 중 기본 의미를 본문에 남기고, 다윗 왕가를 가리키는 함의는 본문 맥락이 드러내도록 두었습니다.
theological_decisions:
- issue: 다윗 왕조에 대한 거부의 톤
  chosen_reading: 정치적 반란의 발화로 सीधे 읽히도록 두되, 후대 신학적 평가를 본문에 덧씌우지 않았습니다.
  alternative_readings:
  - 메시아적 거부로 강화하기
  - 가정불화 수준으로 약화하기
  rationale: 이 구절은 르호보암과 다윗 왕조를 향한 공개적 결별 선언입니다. 번역은 그 긴장을 유지하면서 본문이 넘어서지 않는 신학적 판단은 보류했습니다.
  doctrine_reference: '번역 원칙: 본문이 지닌 역사적·신학적 긴장을 해소하지 않고 보존한다.'
