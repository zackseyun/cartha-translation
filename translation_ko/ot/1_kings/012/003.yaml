  source_fidelity: 초안은 파견하여 부르고, 여로보암과 이스라엘의 집합체가 와서 르호보암에게 말한 사건 순서를 대체로 보존합니다. 그러나 ‘르호보암에게 와서’는 히브리어의 ‘그들이 왔다’가 르호보암에게 왔다는 뜻으로 다소 과도하게 특정하며, לֵאמֹר의 다음 절 인용 도입 기능도 문장 종결로 약화됩니다.
  naturalness: ‘그를 부르고’ 뒤에 주어가 바뀌는 현행 문장은 다소 느슨하며, 다음 절의 직접 발화로 이어지기 위해 ‘이렇게 말하였습니다:’가 자연스럽습니다. ‘온 이스라엘의 회중’보다 ‘이스라엘의 온 회중’이 전체 집합체를 뜻하는 구조를 더 분명히 드러냅니다.
