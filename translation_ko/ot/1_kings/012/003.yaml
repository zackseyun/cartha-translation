id: 1KI.12.3
reference: 1 Kings 12:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּשְׁלְחוּ֙ וַ/יִּקְרְאוּ ל֔/וֹ ו/יבאו יָרָבְעָ֖ם וְ/כָל קְהַ֣ל יִשְׂרָאֵ֑ל וַֽ/יְדַבְּר֔וּ אֶל רְחַבְעָ֖ם לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all the assembly of Israel came and spoke to Rehoboam, saying[b],
  footnotes:
  - marker: a
    text: Or 'summoned him.' The Hebrew idiom 'called for him' conveys that they sent for Jeroboam to come.
    reason: lexical_alternative
  - marker: b
    text: '''Assembly'' could also be rendered ''congregation,'' but here it refers to the gathered body of Israel in a public-political sense.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 사람을 보내어 그를 부르고, 여로보암과 온 이스라엘의 회중이 르호보암에게 와서 말하였습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보내어 그를 불렀다’는 히브리어 관용구로, 여로보암을 오게 하도록 사람을 보낸 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘회중’은 여기서 예배 공동체라기보다 이스라엘의 공적·정치적 집합을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ ל֔וֹ
  english_pob_choice: they sent ... called for him
  chosen_korean: 사람을 보내어 그를 부르고
  alternatives_korean:
  - 사람을 보내어 그를 소집하고
  - 사람을 보내어 그를 불러오고
  lexicon: HALOT
  rationale: שלח와 קרא+ל의 결합은 ‘보내어 불러오다/소집하다’의 뜻이므로, 단순히 ‘부르다’보다 두 동작이 이어지는 공적 소환의 뉘앙스를 살렸습니다.
- source_word: וְכָל קְהַל יִשְׂרָאֵל
  english_pob_choice: all the assembly of Israel
  chosen_korean: 온 이스라엘의 회중
  alternatives_korean:
  - 이스라엘의 모든 회집
  - 이스라엘의 모든 총회
  lexicon: HALOT
  rationale: קהל은 모인 공동체를 가리키므로 ‘회중’이 무난하지만, 여기서는 정치적·공적 집합이어서 ‘온’으로 전체성을 강조했습니다.
- source_word: וַיְדַבְּרוּ אֶל רְחַבְעָם
  english_pob_choice: spoke to Rehoboam
  chosen_korean: 르호보암에게 와서 말하였습니다
  alternatives_korean:
  - 르호보암에게 말하였습니다
  - 르호보암을 향하여 말하였습니다
  lexicon: HALOT
  rationale: דבר אל은 단순한 발화보다 상대를 향해 말하는 행위를 나타내므로, 앞의 ‘와서’로 대면 장면을 살리고 뒤의 직접 발화를 예고했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말하였습니다
  alternatives_korean:
  - 이르되
  - 말하여
  lexicon: HALOT
  rationale: 히브리어의 서술형 도입어로서 바로 이어질 인용문을 여는 기능이므로, 한국어에서는 종결형 대신 연결을 자연스럽게 처리했습니다.
theological_decisions:
- issue: 공적 집합체를 나타내는 קהל의 번역
  chosen_reading: ‘회중’으로 옮기되, 교회 제도 용어로 고정하지 않고 이스라엘의 공적 집합이라는 역사적 의미를 유지했습니다.
  alternative_readings:
  - ‘총회’로 번역
  - ‘회집’으로 번역
  rationale: 본문은 종교 공동체가 아니라 왕권 협상에 나선 정치적 집단을 가리키므로, 교회적 뉘앙스를 피하면서도 모인 공동체라는 핵심을 보존해야 합니다.
  doctrine_reference: 역사서 문맥에서의 집합체 용례
