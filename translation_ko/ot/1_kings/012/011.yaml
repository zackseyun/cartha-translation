id: 1KI.12.11
reference: 1 Kings 12:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אָבִ/י֙ הֶעְמִ֤יס עֲלֵי/כֶם֙ עֹ֣ל כָּבֵ֔ד וַ/אֲנִ֖י אוֹסִ֣יף עַֽל עֻלְּ/כֶ֑ם אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֕י אֲיַסֵּ֥ר אֶתְ/כֶ֖ם בָּ/עַקְרַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.
  footnotes:
  - marker: a
    text: Or possibly 'with scorpion-whips,' that is, whips or lashes designed to be more painful; the Hebrew literally reads 'with scorpions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내 아버지가 너희에게 무거운 멍에를 지웠으나, 나는 너희의 멍에를 더하겠습니다. 내 아버지는 너희를 채찍으로 징계했으나, 나는 너희를 전갈로 징계하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '전갈채찍으로', 곧 더 고통스럽게 만들도록 고안된 채찍이나 채찍질을 가리킬 수 있습니다. 히브리어는 문자적으로 '전갈들'이라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס / עֹל כָּבֵד
  english_pob_choice: made your yoke heavy
  chosen_korean: 무거운 멍에를 지웠으나
  alternatives_korean:
  - 무거운 멍에를 얹었으나
  - 너희에게 무거운 멍에를 실었으나
  lexicon: HALOT
  rationale: עֹל은 문자적으로 '멍에'이므로 이를 유지했고, הֶעְמִיס의 부담 부과 이미지는 한국어 '지우다'가 자연스럽게 살려 줍니다.
- source_word: אוֹסִיף עַל עֻלְּכֶם
  english_pob_choice: I will add to your yoke
  chosen_korean: 너희의 멍에를 더하겠습니다
  alternatives_korean:
  - 너희의 멍에에 더하겠습니다
  - 너희 멍에를 늘리겠습니다
  lexicon: HALOT
  rationale: '''add to''의 구조를 한국어에서 가장 직접적으로 살리되, 문맥상 멍에의 부담이 커진다는 뜻이 분명하도록 ''더하다''를 택했습니다.'
- source_word: יִסַּר / אֲיַסֵּר
  english_pob_choice: disciplined / will discipline
  chosen_korean: 징계했으나 / 징계하겠습니다
  alternatives_korean:
  - 채찍질했으나 / 채찍질하겠습니다
  - 벌했으나 / 벌하겠습니다
  lexicon: HALOT
  rationale: יסר는 훈육·징계를 뜻할 수 있으므로, 정치적 위협의 맥락에서 '징계하다'가 의미를 넓게 포착하면서도 과도한 해석을 피합니다.
- source_word: בַּשּׁוֹטִים / בָּעַקְרַבִּים
  english_pob_choice: with whips / with scorpions
  chosen_korean: 채찍으로 / 전갈로
  alternatives_korean:
  - 채찍으로 / 전갈채찍으로
  - 채찍으로 / 전갈 채찍으로
  lexicon: HALOT
  rationale: שׁוֹט은 '채찍'으로, עַקְרַבִּים은 본문의 문자적 이미지를 살려 '전갈'로 옮겼습니다. 영어 주석의 'scorpion-whips' 가능성은 본문이 아니라 각주로 처리하는 편이 source-direct합니다.
theological_decisions:
- issue: 폭압적 왕권의 위협 수사와 동사 선택
  chosen_reading: 본문은 르호보암의 가혹한 통치 의지를 직접 드러내므로, 완화하지 않고 '징계하겠습니다'와 '전갈' 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 의미를 순화해 '벌하겠습니다'로 옮기기
  - '''전갈채찍''으로 본문을 해석하기'
  rationale: 원문은 백성의 멍에를 더 무겁게 하겠다는 정치적 협박을 강하게 제시하므로, 수사를 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 본문 해석 및 왕권 비판의 문맥
