review_pass:
  verdict: revise
  source_fidelity: 전반적으로 히브리어의 반복되는 ‘멍에’, 채찍과 전갈의 대조, 그리고 위협의 강도를 충실히 보존합니다. 다만 אוֹסִיף עַל עֻלְּכֶם은 멍에에 무언가를 ‘더한다’는 뜻으로 멍에의 무게·부담을 증가시키겠다는 의미이며, 현행 ‘너희의 멍에를 더하겠습니다’는 한국어에서 목적어가 불분명하고 멍에 자체를 추가한다는 뜻으로도 읽힐 수 있습니다.
  naturalness: ‘무거운 멍에를 지웠으나’, ‘채찍으로 징계했으나’는 현대 표준 한국어의 합쇼체 문맥에서 자연스럽습니다. ‘너희의 멍에를 더하겠습니다’만 어법과 의미 전달 면에서 다듬는 것이 안전합니다.
  terminology: ‘멍에’는 עֹל의 정치적 억압 비유를 잘 유지하며, ‘채찍’도 שׁוֹט에 적절합니다. עַקְרַבִּים은 본문에서 문자적으로 ‘전갈’로 유지하고, 전갈 채찍이라는 가능한 관용적 이해는 각주로 제시한 방식이 적절합니다. ‘징계’는 יסר의 의미 범위 안에 있으며 본문의 위협적 문맥을 약화하지 않습니다.
  issues:
  - severity: medium
    issue: ‘나는 너희의 멍에를 더하겠습니다’의 목적어 및 관용 표현
    rationale: 히브리어 ‘내가 너희의 멍에 위에 더하겠다’는 멍에의 부담을 늘리겠다는 뜻입니다. 한국어 ‘멍에를 더하다’는 자연스럽지 않고 멍에 하나를 추가한다는 뜻으로 오해될 수 있으므로, ‘멍에를 더 무겁게 하겠습니다’로 명시하는 것이 의미와 한국어 관용을 모두 살립니다.
