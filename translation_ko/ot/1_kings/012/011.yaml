- from: 이제 내 아버지가 너희에게 무거운 멍에를 지웠으나, 나는 너희의 멍에를 더하겠습니다. 내 아버지는 너희를 채찍으로 징계했으나, 나는 너희를 전갈로 징계하겠습니다.[a]
  to: 이제 내 아버지가 너희에게 무거운 멍에를 지웠으나, 나는 너희의 멍에를 더 무겁게 하겠습니다. 내 아버지는 너희를 채찍으로 징계했으나, 나는 너희를 전갈로 징계하겠습니다.[a]
