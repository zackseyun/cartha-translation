revisions:
- from: 그러므로 왕이 상의하고 금송아지 둘을 만들어, 그들에게 말했습니다. 「예루살렘으로 올라가는 것이 여러분에게는 너무 과합니다. 보십시오, 이스라엘아, 이것이 바로 너를 이집트 땅에서 올라오게 한 너의 신들입니다.」[a][b]
  to: 그러자 왕은 의논한 뒤 금송아지 둘을 만들고 그들에게 말했습니다. 「여러분이 예루살렘으로 올라가는 일은 너무 벅찹니다.[a] 보십시오, 이스라엘아, 이들이 바로 너를 이집트 땅에서 이끌어 낸 너의 신들입니다.[b]」
  rationale: 접속사는 앞 문맥에 자연스럽게 이어지는 ‘그러자’로 다듬고, 숙의와 그 결과를 ‘의논한 뒤 … 만들고’로 명료하게 표현했습니다. 부담을 뜻하는 구절은 자연스러운 현대 합쇼체로 수정했습니다. 두 송아지를 가리키는 지시 표현을 복수화하고, 출애굽 동사를 ‘이끌어 낸’으로 바꾸어 원문의 관용적 표현을 살렸습니다. 각주의 실제 대안을 제시하고 각 앵커를 해당 본문 표현에 배치했습니다.
  reviewer_model: gpt-5.6-terra
