    rationale: 앞서 만든 두 송아지를 가리키므로 한국어에서는 ‘이들이 바로’가 자연스럽습니다.
  - severity: medium
    issue: 출애굽 동사의 표현
    rationale: ‘이집트 땅에서 올라오게 한’은 장소 관계가 어색하고, 히브리어 히필 ‘이끌어 올리다’ 및 정형적인 출애굽 표현을 충분히 살리지 못합니다.
