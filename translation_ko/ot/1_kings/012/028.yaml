  yaml_path: translation/ot/1_kings/012/028.yaml
  text: So the king took counsel and made two calves of gold[a], and he said to them, “It is too much for you to go up to Jerusalem. Behold your gods, O Israel[b], who brought you up from the land of Egypt.”
  footnotes:
  - marker: a
    text: Or, “It is too much for you to go up to Jerusalem.”
    reason: lexical_alternative
  - marker: b
    text: Or, “your God, O Israel.” The Hebrew form can sometimes function as a singular title, and the wording echoes Exodus 32:4; here, however, the two calves and the plural verb favor “your gods.”
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 왕이 상의하고 금송아지 둘을 만들어, 그들에게 말했습니다. 「예루살렘으로 올라가는 것이 여러분에게는 너무 과합니다. 보십시오, 이스라엘아, 이것이 바로 너를 이집트 땅에서 올라오게 한 너의 신들입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “예루살렘으로 올라가는 것이 여러분에게는 너무 과합니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는, “이스라엘아, 너의 하나님.” 히브리어 형태는 때때로 단수 칭호처럼 기능할 수 있으며, 출애굽기 32:4를 반향합니다. 그러나 여기서는 두 송아지와 복수 동사가 ‘너의 신들’ 번역을 더 잘 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּעַץ
  english_pob_choice: took counsel
  chosen_korean: 상의하고
  alternatives_korean:
  - 의논하고
  - 자문을 구하고
  - 숙고하고
  lexicon: HALOT
  rationale: 왕이 단순히 행동한 것이 아니라 먼저 숙의와 논의를 거쳤다는 점을 자연스럽게 살리기 위해 ‘상의하고’로 옮겼습니다.
- source_word: עֶגְלֵי זָהָב
  english_pob_choice: calves of gold
  chosen_korean: 금송아지 둘
  alternatives_korean:
  - 금으로 된 송아지 둘
  - 황금 송아지 둘
  - 금송아지 두 마리
  lexicon: HALOT
  rationale: 히브리어의 ‘송아지’와 ‘금’의 결합을 그대로 살리되, 한국어에서는 자연스럽게 ‘금송아지 둘’로 압축했습니다.
- source_word: רַב לָכֶם מֵעֲלוֹת יְרוּשָׁלִַם
  english_pob_choice: It is too much for you to go up to Jerusalem
  chosen_korean: 예루살렘으로 올라가는 것이 여러분에게는 너무 과합니다
  alternatives_korean:
  - 예루살렘으로 올라가는 것은 여러분에게 너무 많습니다
  - 예루살렘으로 올라가는 일이 여러분에게는 지나칩니다
  - 예루살렘으로 올라가는 것이 여러분에게는 충분합니다
  lexicon: HALOT
  rationale: 문법적으로는 ‘너무 많다/과하다’의 뜻이므로, 한국어에서는 의미를 분명히 드러내는 ‘너무 과합니다’로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보시오
  - 여기 보십시오
  lexicon: HALOT
  rationale: 왕의 선포문에서 청중을 향한 직접 호소를 현대 한국어에서 자연스럽고 격조 있게 나타내기 위해 ‘보십시오’를 사용했습니다.
- source_word: אֱלֹהֶיךָ יִשְׂרָאֵל / הֶעֱלוּךָ
  english_pob_choice: your gods, O Israel / who brought you up
  chosen_korean: 이스라엘아, 이것이 바로 너를 이집트 땅에서 올라오게 한 너의 신들입니다
  alternatives_korean:
  - 이스라엘아, 이것이 바로 너를 이집트 땅에서 올라오게 한 너의 하나님입니다
  - 이스라엘아, 이것이 너를 이집트 땅에서 인도하여 올린 너의 신들입니다
  lexicon: HALOT
  rationale: 두 송아지와 복수 동사가 주는 복수성을 살려 ‘너의 신들’로 옮겼고, 출애굽 공식을 반영해 ‘이집트 땅에서 올라오게 한’으로 표현했습니다.
theological_decisions:
- issue: אֱלֹהֶיךָ의 단수/복수 해석
  chosen_reading: 복수로 처리하여 ‘너의 신들’로 번역했습니다.
  alternative_readings:
  - 단수로 처리하여 ‘너의 하나님’으로 번역
  - 모호성을 남겨 ‘너의 신/하나님’으로 번역
  rationale: 직전의 두 송아지와 뒤따르는 복수 동사 때문에, 본문이 의도하는 우상숭배의 복수성을 약화하지 않는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
