base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/010.yaml
  text: 'The young men who had grown up with him spoke to him, saying, “This is what you shall say to this people who spoke to you, saying, ‘Your father made our yoke heavy, but you, make it lighter for us’: this is what you shall say to them, ‘My little finger is thicker than my father’s waist.’”'
translation:
  language: ko
  text: 그와 함께 자라난 젊은이들이 그에게 말했습니다. “이 백성에게 이렇게 말하십시오. ‘당신의 아버지는 우리의 멍에를 무겁게 했지만, 당신은 우리에게서 그것을 더 가볍게 하십시오.’ 이렇게 그들에게 말하십시오. ‘내 새끼손가락이 내 아버지의 허리보다 더 굵습니다.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיְלָדִים ... אֲשֶׁר גָּדְלוּ אִתּוֹ
  english_pob_choice: The young men who had grown up with him
  chosen_korean: 그와 함께 자라난 젊은이들
  alternatives_korean:
  - 그와 함께 자란 청년들
  - 그와 더불어 성장한 젊은이들
  lexicon: יֶלֶד/יַלְדִים
  rationale: 성장 단계와 동행 관계를 함께 드러내기 위해 ‘자라난 젊은이들’로 옮겼습니다.
- source_word: הִכְבִּיד אֶת עֻלֵּנוּ
  english_pob_choice: made our yoke heavy
  chosen_korean: 우리의 멍에를 무겁게 했지만
  alternatives_korean:
  - 우리의 멍에를 무겁게 했지만
  - 우리의 멍에를 짓눌렀지만
  lexicon: עֹל
  rationale: POB의 직유를 따라 ‘멍에’를 유지하고, 동사의 무게감을 자연스러운 한국어로 표현했습니다.
- source_word: הָקֵל מֵעָלֵינוּ
  english_pob_choice: make it lighter for us
  chosen_korean: 우리에게서 그것을 더 가볍게 하십시오
  alternatives_korean:
  - 우리에게서 그것을 더 가볍게 하십시오
  - 우리의 짐을 덜어 주십시오
  lexicon: קלל/הקל
  rationale: ‘가볍게 하다’라는 직접 대응을 살리되, 청자에게 하는 요청형을 합쇼체로 정리했습니다.
- source_word: קָטָנִּי עָבָה מִמָּתְנֵי אָבִי
  english_pob_choice: My little finger is thicker than my father’s waist
  chosen_korean: 내 새끼손가락이 내 아버지의 허리보다 더 굵습니다
  alternatives_korean:
  - 내 작은손가락이 아버지의 허리보다 더 굵습니다
  - 내 새끼손가락은 아버지의 허리보다 더 굵습니다
  lexicon: קָטָן / מָתְנַיִם
  rationale: 과장된 비유를 보존하기 위해 문자적 이미지를 유지했고, ‘굵습니다’로 비교의 강도를 살렸습니다.
theological_decisions:
- issue: 직접 인용 속 명령형의 문체
  chosen_reading: 왕의 조언을 전달하는 인용문 안에서는 한국어 명령/청유를 합쇼체로 유지했습니다.
  alternative_readings:
  - 인용문 안을 비격식으로 낮추는 방식
  - 전체를 평서형으로 평준화하는 방식
  rationale: 본문이 반복 명령문 구조를 가지므로, 원문의 권고·지시 기능을 살리면서도 한국어 성경 문체에 맞게 정리했습니다.
  doctrine_reference: 서사체 대화의 화행 보존
- issue: ‘멍에’ 이미지의 보존
  chosen_reading: ‘멍에’를 유지해 압제와 부담의 상징을 드러냈습니다.
  alternative_readings:
  - ‘짐’으로 완화하는 방식
  - ‘노역’으로 해석하는 방식
  rationale: 문맥상 통치 부담의 비유를 지칭하므로, 익숙한 농경 이미지인 ‘멍에’를 보존하는 것이 원문 효과를 가장 잘 전달합니다.
  doctrine_reference: 문자적 비유 보존
