base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
  footnotes:
  - marker: a
    text: Or 'who attended him' / 'who served him'; the Hebrew idiom 'stood before him' can denote court service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 자기에게 충고한 장로들의 조언을 버리고, 자기와 함께 자라났으며 자기 앞에 서 있던 젊은이들과 상의했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘그 앞에 서다’는 궁정에서 시중들거나 섬기는 뜻으로도 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב / abandoned
  english_pob_choice: abandoned
  chosen_korean: 버리고
  alternatives_korean:
  - 떠나고
  - 버렸습니다
  - 내려놓고
  lexicon: HALOT
  rationale: 장로들의 조언을 의도적으로 받아들이지 않기로 한 동작이므로, 단순한 ‘떠나다’보다 관계적·의지적 거절을 드러내는 ‘버리고’가 적절합니다.
- source_word: עֲצַת הַזְּקֵנִים / advice of the elders
  english_pob_choice: advice
  chosen_korean: 장로들의 조언
  alternatives_korean:
  - 장로들의 충고
  - 원로들의 조언
  - 장로들의 의견
  lexicon: HALOT
  rationale: עֵצָה는 이 문맥에서 왕에게 주어진 실질적 조언을 가리키므로, 현대 한국어에서 자연스러운 ‘조언’이 가장 직접적입니다.
- source_word: וַיִּוָּעַץ / consulted with
  english_pob_choice: consulted with
  chosen_korean: 상의했습니다
  alternatives_korean:
  - 의논했습니다
  - 상담했습니다
  - 자문했습니다
  lexicon: HALOT
  rationale: Niphal יעץ의 상호적 의미를 살리면서도 왕이 사람들과 의견을 맞추는 장면을 자연스럽게 드러내기 위해 ‘상의했습니다’를 선택했습니다.
- source_word: הָעֹמְדִים לְפָנָיו / who stood before him
  english_pob_choice: who stood before him
  chosen_korean: 자기 앞에 서 있던
  alternatives_korean:
  - 그를 시중들던
  - 그를 섬기던
  - 그 앞에 서 있던
  lexicon: HALOT
  rationale: 히브리어 관용구를 너무 풀지 않고 기본 이미지를 보존하기 위해 직역에 가깝게 옮겼습니다. 본문의 궁정 시종 의미는 직역만으로도 충분히 추론됩니다.
theological_decisions:
- issue: ‘서 있던’의 궁정 봉사 관용구 처리
  chosen_reading: 본문에는 직역적 표현을 유지하고, 의미 확장은 본문 밖 해설로 남깁니다.
  alternative_readings:
  - ‘시중들던’으로 기능을 명시
  - ‘섬기던’으로 해석을 드러냄
  rationale: 히브리어의 ‘왕 앞에 서다’는 궁정 봉사를 뜻할 수 있지만, 본문 자체는 그 이미지를 보존하는 것이 더 원문 충실적입니다.
  doctrine_reference: 원문 관용구의 보존과 문맥적 해석의 분리
