  source_fidelity: 조건절의 기본 의미와 법률 용어의 구별은 대체로 잘 반영했습니다. 다만 직접 호칭으로 반복되는 ‘당신’은 히브리어의 2인칭 단수 خطاب을 한국어 성경 문체에서 부자연스럽게 만들며, 각주 표지도 해당 어구에 직접 붙이는 편이 정확합니다.
  naturalness: ‘당신도’와 ‘다윗 당신의 아버지’는 현대 표준 한국어의 신적 직접 발화 및 성경 문맥에서 어색합니다. ‘네가’, ‘네 아버지 다윗’으로 고치고, ‘마음의 온전함’은 ‘온전한 마음’으로 다듬으면 자연스럽습니다. 이 절은 다음 절로 이어지는 조건절이므로 종결 부호 없이 둘 수 있습니다.
  terminology: תָם לֵבָב의 ‘온전한 마음’은 절대적 무죄를 단정하지 않으면서 충절과 온전성을 보존합니다. ‘올곧음’, ‘규례’, ‘법도’는 각각 יֹשֶׁר, חֻקִּים, מִשְׁפָּטִים을 무리 없이 구별합니다.
