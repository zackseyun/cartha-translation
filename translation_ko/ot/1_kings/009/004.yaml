id: 1KI.9.4
reference: 1 Kings 9:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֨ר הָלַ֜ךְ דָּוִ֤ד אָבִ֨י/ךָ֙ בְּ/תָם לֵבָ֣ב וּ/בְ/יֹ֔שֶׁר לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/004.yaml
  text: And as for you[a], if you walk before me as David your father walked, with integrity of heart and with uprightness, doing according to all that I have commanded you, and if you keep my statutes and my judgments[b],
  footnotes:
  - marker: a
    text: Or 'with blamelessness of heart.' The Hebrew term emphasizes wholeness or integrity, not necessarily absolute sinlessness.
    reason: lexical_alternative
  - marker: b
    text: Or 'my statutes and my ordinances.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신도, 만일 내 앞에서 다윗 당신의 아버지가 걸었던 것처럼 마음의 온전함과 올곧음으로 걸으며, 내가 당신에게 명령한 모든 것을 행하고 나의 규례들과 나의 법도들을 지키면[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '마음의 흠없음으로'. 이 히브리어는 반드시 절대적 죄없음이 아니라 온전함이나 통전성을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '나의 규례들과 나의 법령들'.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: And as for you
  chosen_korean: 그리고 당신도
  alternatives_korean:
  - 그리고 너도
  - 당신은 또한
  lexicon: HALOT
  rationale: 대조와 직접 호소를 살리되, 현대 합쇼체에서 자연스럽게 들리도록 했습니다. 'as for you'의 강조를 '당신도'로 간결하게 반영합니다.
- source_word: בְּתָם לֵבָב
  english_pob_choice: with integrity of heart
  chosen_korean: 마음의 온전함으로
  alternatives_korean:
  - 마음의 완전함으로
  - 마음의 흠없음으로
  - 마음의 성실함으로
  lexicon: HALOT
  rationale: תָּם은 완전무결한 무흠이라기보다 전인적 온전함과 성실함을 가리키므로, '마음의 온전함'이 신학적 긴장을 보존합니다.
- source_word: וּבְיֹשֶׁר
  english_pob_choice: and with uprightness
  chosen_korean: 올곧음으로
  alternatives_korean:
  - 정직함으로
  - 정도(正道)로
  - 바름으로
  lexicon: HALOT
  rationale: 히브리어의 '곧음/바름' 이미지를 살리면서도 문맥상 도덕적 품격을 자연스럽게 전달하는 표현입니다.
- source_word: חֻקַּי וּמִשְׁפָּטַי
  english_pob_choice: my statutes and my judgments
  chosen_korean: 나의 규례들과 나의 법도들
  alternatives_korean:
  - 나의 율례들과 나의 규례들
  - 나의 규정들과 나의 판단들
  lexicon: HALOT
  rationale: 두 법률 용어의 구별을 유지하면서, 한국어 성경어휘에서 널리 이해되는 '규례/법도' 조합을 사용했습니다. 'judgments'를 '법도'로 옮겨 법적·언약적 권위를 살렸습니다.
theological_decisions:
- issue: 다윗의 모범을 죄 없는 완전성으로 읽을지 여부
  chosen_reading: 다윗을 언약적 충성의 모범으로 제시하되, 무죄무흠의 절대적 완전성으로는 읽지 않습니다.
  alternative_readings:
  - 다윗을 '마음이 흠없는' 사람으로 강하게 표현함
  rationale: 원문과 POB의 주석은 전인적 온전함과 성실함을 말하며, 다윗의 실제 죄성을 지우지 않습니다. 따라서 '온전함'으로 번역해 칭찬의 강도와 신학적 긴장을 함께 보존했습니다.
  doctrine_reference: 언약적 평가와 인간의 도덕적 결함은 구별되어야 합니다.
