  text: 솔로몬이 야훼의 집과 왕의 집과, 솔로몬이 만들기를 원한 모든 것을 다 짓기를 마쳤을 때, 일이 이렇게 되었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘솔로몬의 모든 소원’ 혹은 ‘솔로몬이 하기를 원하는 모든 일’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 일이 이렇게 되었습니다
  alternatives_korean:
  - 그때 이런 일이 있었습니다
  - 그렇게 되었습니다
  lexicon: HALOT
  rationale: 서사 도입을 자연스러운 현대 한국어로 옮기면서도, 단순한 시간부사보다 사건 전개를 여는 기능을 살렸습니다.
- source_word: כְכַלּוֹת
  english_pob_choice: when ... had finished
  chosen_korean: 다 짓기를 마쳤을 때
  alternatives_korean:
  - 짓기를 끝냈을 때
  - 완공했을 때
  lexicon: HALOT
  rationale: 완료 시점을 분명히 하면서도, ‘짓다’의 구체성을 유지해 히브리어의 서술 흐름을 드러냈습니다.
- source_word: בֵּית יְהוָה / בֵּית הַמֶּלֶךְ
  english_pob_choice: the house of Yahweh / the king’s house
  chosen_korean: 야훼의 집 / 왕의 집
  alternatives_korean:
  - 야훼의 성전 / 왕궁
  - 야훼의 집 / 왕궁
  lexicon: HALOT
  rationale: 히브리어의 직설적 병행 구조를 살리기 위해 ‘집’을 유지했고, יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָפֵץ לַעֲשׂוֹת
  english_pob_choice: all that Solomon desired to make
  chosen_korean: 솔로몬이 만들기를 원한 모든 것
  alternatives_korean:
  - 솔로몬의 모든 სურვ망
  - 솔로몬이 하고자 한 모든 일
  lexicon: HALOT
  rationale: חֵשֶׁק과 חָפֵץ의 ‘원하다/바라다’ 의미를 함께 반영하면서, חָפֵץ 뒤의 목적어 구조를 한국어 자연문으로 정리했습니다.
theological_decisions:
- issue: 성전과 왕궁의 병렬 표현
  chosen_reading: ‘야훼의 집’과 ‘왕의 집’을 그대로 병렬로 두어, 왕의 건축 사업이 야훼의 집과 동등한 문법 구조로 제시된 히브리어의 대비를 보존했습니다.
  alternative_readings:
  - ‘야훼 성전’과 ‘왕궁’으로 의미를 풀어 쓰기
  - ‘야훼의 집’과 ‘왕궁’으로 현대화하기
  rationale: 본문은 의도적으로 동일한 ‘집’ 표현을 반복해 대칭을 형성하므로, 이를 해석적으로 평탄화하지 않는 것이 원문 의미를 더 잘 전달합니다.
  doctrine_reference: 1 Kings 9:1의 서사적 대비 구조
