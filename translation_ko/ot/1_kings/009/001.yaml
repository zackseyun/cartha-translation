revisions:
- from: 솔로몬이 야훼의 집과 왕의 집과, 솔로몬이 만들기를 원한 모든 것을 다 짓기를 마쳤을 때, 일이 이렇게 되었습니다[a].
  to: 솔로몬이 야훼의 집과 왕의 집을 짓고, 또 솔로몬이 하기를 바랐던 모든 일을 마쳤을 때, 이런 일이 있었습니다[a].
  rationale: 건축 행위는 ‘야훼의 집’과 ‘왕의 집’에 연결하고, חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָפֵץ לַעֲשׂוֹת는 ‘솔로몬이 하기를 바랐던 모든 일’로 별도 처리했습니다. 이로써 원문의 병렬과 ‘원함/실행함’의 의미를 유지하면서, 모든 대상이 건축물이라는 오해를 피했습니다. 와예히는 자연스러운 한국어 서사 도입으로 옮겼습니다.
