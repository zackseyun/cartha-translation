theological_decisions:
- issue: 성전과 왕궁의 병렬 표현
  chosen_reading: ‘야훼의 집’과 ‘왕의 집’을 그대로 병렬로 두어, 왕의 건축 사업이 야훼의 집과 동등한 문법 구조로 제시된 히브리어의 대비를 보존했습니다.
  alternative_readings:
  - ‘야훼 성전’과 ‘왕궁’으로 의미를 풀어 쓰기
  - ‘야훼의 집’과 ‘왕궁’으로 현대화하기
  rationale: 본문은 의도적으로 동일한 ‘집’ 표현을 반복해 대칭을 형성하므로, 이를 해석적으로 평탄화하지 않는 것이 원문 의미를 더 잘 전달합니다.
  doctrine_reference: 1 Kings 9:1의 서사적 대비 구조
