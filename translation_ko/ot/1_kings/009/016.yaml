source:
  edition: WLC
  text: פַּרְעֹ֨ה מֶֽלֶךְ מִצְרַ֜יִם עָלָ֗ה וַ/יִּלְכֹּ֤ד אֶת גֶּ֨זֶר֙ וַ/יִּשְׂרְפָ֣/הּ בָּ/אֵ֔שׁ וְ/אֶת הַֽ/כְּנַעֲנִ֛י הַ/יֹּשֵׁ֥ב בָּ/עִ֖יר הָרָ֑ג וַֽ/יִּתְּנָ/הּ֙ שִׁלֻּחִ֔ים לְ/בִתּ֖/וֹ אֵ֥שֶׁת שְׁלֹמֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/016.yaml
  text: Pharaoh king of Egypt had gone up and captured Gezer and burned it with fire[a], and he killed the Canaanites who lived in the city, and gave it as a dowry to his daughter, Solomon’s wife.
  footnotes:
  - marker: a
    text: Or “as a dowry.” The Hebrew term refers to a marriage-related gift; the exact social nuance may overlap with what English calls a dowry.
    reason: lexical_alternative
translation:
  language: ko
  text: 이집트 왕 파라오가 올라와 게셀을 점령하고 불로 불태웠습니다. 또 그 성에 살던 가나안 사람들을 죽이고, 그 성을 자기 딸, 곧 솔로몬의 아내에게 혼인 선물로[a] 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지참금으로’. 히브리어 용어는 혼인과 관련된 증여를 가리키며, 정확한 사회적 뉘앙스는 한국어의 ‘지참금’과 일부 겹칩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  english_pob_choice: Pharaoh king of Egypt
  chosen_korean: 이집트의 파라오 왕
  alternatives_korean:
  - 이집트 왕 파라오
  - 파라오 곧 이집트 왕
  lexicon: HALOT
  rationale: 고유명과 칭호를 자연스럽게 살리되, מקור의 직함 결합을 보존하기 위해 ‘파라오 왕’ 구조를 유지했습니다.
- source_word: וַיִּלְכֹּד / וַיִּשְׂרְפָהּ בָּאֵשׁ
  english_pob_choice: captured ... and burned it with fire
  chosen_korean: 점령하고 불로 태워 버렸습니다
  alternatives_korean:
  - 사로잡고 불로 태웠습니다
  - 점령하여 불에 태웠습니다
  lexicon: HALOT
  rationale: 군사적 정복 동사 לכד는 문맥상 ‘점령하다’가 가장 자연스럽고, בָּאֵשׁ는 ‘불로’로 직접 드러내어 원문의 강도를 살렸습니다.
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב בָּעִיר
  english_pob_choice: the Canaanites who lived in the city
  chosen_korean: 그 성읍에 살던 가나안 사람들을
  alternatives_korean:
  - 그 도성에 거주하던 가나안 사람들을
  - 성읍에 사는 가나안 사람들을
  lexicon: HALOT
  rationale: 가나안 민족집단을 자연스럽게 복수 집합으로 풀어 ‘가나안 사람들’로 옮기고, 분사구는 거주 사실을 분명히 했습니다.
- source_word: שִׁלֻּחִים
  english_pob_choice: as a dowry
  chosen_korean: 혼인 선물로
  alternatives_korean:
  - 지참금으로
  - 혼례 선물로
  lexicon: HALOT
  rationale: 히브리어는 혼인 관련 증여를 가리키며, 한국어 ‘지참금’은 현대 독자에게 사회적 방향이 어긋나 보일 수 있어 보다 중립적인 ‘혼인 선물’로 옮겼습니다.
theological_decisions:
- issue: 혼인 관련 증여의 사회적 뉘앙스
  chosen_reading: ‘혼인 선물’로 번역해 혼인과 연관된 증여임을 드러내되, 특정 현대 제도 개념으로 좁히지 않았습니다.
  alternative_readings:
  - ‘지참금’으로 고정
  - ‘혼례 선물’로 번역
  rationale: שִׁלֻּחִים는 혼인 관련 선물을 뜻하지만 정확한 사회적 범주는 문맥에서 완전히 고정되지 않으므로, 원문의 폭을 보존하는 표현이 적절합니다.
  doctrine_reference: 번역학적 절제 원칙
