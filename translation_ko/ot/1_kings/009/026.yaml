lexical_decisions:
- source_word: וָאֳנִי
  english_pob_choice: a fleet of ships
  chosen_korean: 배
  alternatives_korean:
  - 선단
  - 함대
  - 배들
  lexicon: HALOT
  rationale: 문맥상 해양 사업 전체를 가리키지만, 한국어에서는 자연스럽게 단수 총칭으로 ‘배를 만들었습니다’라고 옮겨도 의미가 유지됩니다. ‘선단’은 군사적 뉘앙스가 강해 피했습니다.
- source_word: עָשָׂה
  english_pob_choice: built
  chosen_korean: 만들었는데
  alternatives_korean:
  - 지었는데
  - 건조했는데
  - 만들었습니다
  lexicon: HALOT
  rationale: 히브리어 עָשָׂה는 문자적으로 ‘하다/만들다’이므로, 선박 제작을 뜻하는 여기서는 ‘만들다’가 원문 동사를 가장 직접적으로 살립니다.
- source_word: בְּעֶצְיוֹן גֶּבֶר
  english_pob_choice: at Ezion-geber
  chosen_korean: 에츠욘게벨에
  alternatives_korean:
  - 에츠욘게벨에서
  - 에츠욘게벨에 있는
  lexicon: HALOT
  rationale: 지명은 음역으로 처리하고, בְּ는 특정 장소의 위치를 나타내므로 ‘-에’로 옮겼습니다.
- source_word: יָם סוּף
  english_pob_choice: Red Sea
  chosen_korean: 홍해
  alternatives_korean:
  - 갈대 바다
  - 갈대의 바다
  lexicon: HALOT
  rationale: POB의 본문은 전통적 지리명인 ‘Red Sea’를 채택하므로, 한국어 본문도 통용 지명인 ‘홍해’를 사용하고, 원문의 직역 가능성은 각주로 남겼습니다.
