language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵ֤א חִירָם֙ מִ/צֹּ֔ר לִ/רְאוֹת֙ אֶת הֶ֣/עָרִ֔ים אֲשֶׁ֥ר נָתַן ל֖/וֹ שְׁלֹמֹ֑ה וְ/לֹ֥א יָשְׁר֖וּ בְּ/עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/012.yaml
  text: So Hiram went out from Tyre to see the cities that Solomon had given him[a], but they were not pleasing in his eyes.
  footnotes:
  - marker: a
    text: Or, 'but they did not please him.' The Hebrew idiom is literally 'they were not pleasing/right in his eyes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 히람이 두로에서 나와 솔로몬이 그에게 준 도시들을 보았는데, 그것들은 그의 눈에 들지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 눈에 옳지/좋지 않았다’는 뜻의 히브리어 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나와
  alternatives_korean:
  - 나갔습니다
  - 떠났습니다
  lexicon: HALOT
  rationale: 이야기 진행형 동사로서 מקור에서의 출발 동작을 자연스럽게 드러내기 위해 ‘나와’로 옮겼습니다.
- source_word: מִצֹּר
  english_pob_choice: from Tyre
  chosen_korean: 두로에서
  alternatives_korean:
  - 두로로부터
  - 두로에서부터
  lexicon: HALOT
  rationale: מן의 출발 지점을 한국어의 자연스러운 조사 표현으로 처리하되, 지명 두로를 표준 음역으로 유지했습니다.
- source_word: לִרְאוֹת
  english_pob_choice: to see
  chosen_korean: 보았는데
  alternatives_korean:
  - 살펴보러
  - 검토하러
  lexicon: HALOT
  rationale: POB가 ‘see’를 채택한 것은 단순한 관찰을 넘는 점검 뉘앙스를 암시하지만, 본문이 해석을 더하지 않도록 평이하게 ‘보았는데’로 옮겼습니다.
- source_word: וְלֹא יָשְׁרוּ בְּעֵינָיו
  english_pob_choice: but they were not pleasing in his eyes
  chosen_korean: 그의 눈에 들지 않았습니다
  alternatives_korean:
  - 그의 눈에 좋지 않았습니다
  - 그의 눈에 마땅하지 않았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ישר בעיני를 한국어의 자연스러운 수용 표현으로 풀되, ‘마음에 들다’보다 판단의 기준이 ‘눈’에 있음을 살리기 위해 ‘눈에 들다’를 택했습니다.
theological_decisions:
- issue: 히브리어 관용구 ישר בעיני의 의미 범위
  chosen_reading: 도덕적 판정보다 수용/만족의 판단을 나타내는 표현으로 이해했습니다.
  alternative_readings:
  - ‘옳지 않았다’로 도덕적 평가를 강조하는 읽기
  - ‘마음에 들지 않았다’로 감정적 불만족을 강조하는 읽기
  rationale: 문맥은 히람이 받은 도시들을 평가하는 장면이므로, ‘right in his eyes’의 형식적 직역이 주는 도덕성보다 실제 수용 여부를 드러내는 쪽이 소스와 더 잘 맞습니다.
  doctrine_reference: 본문 문맥에 따른 관용구 해석
