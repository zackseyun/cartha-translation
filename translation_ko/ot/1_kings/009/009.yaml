  rationale: 인용문의 인과적 답변 구조를 한국어 합쇼체로 분명히 하고, 연속된 ‘그들’의 지시 혼동을 줄였습니다. ‘매달려’는 חזק ב의 결속 의미를 자연스럽게 반영하며, ‘내리셨기 때문입니다’는 재앙을 심판으로 가져오셨다는 הֵבִיא의 의미와 עַל כֵּן의 결과 관계를 보존합니다.
