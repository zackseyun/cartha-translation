- from: 그들이 말할 것입니다. “그들이 자기 조상들을 이집트 땅에서 이끌어 내신 자기 하나님 야훼를 버리고, 다른 신들을 굳게 붙들어 그것들에게 절하고 그것들을 섬겼으므로, 야훼께서 이 모든 재앙을 그들에게 가져오셨습니다.”
