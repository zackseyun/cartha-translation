  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֗ם אֲשֶׁ֨ר הוֹצִ֣יא אֶת אֲבֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨קוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים ו/ישתחו לָ/הֶ֖ם וַ/יַּעַבְדֻ֑/ם עַל כֵּ֗ן הֵבִ֤יא יְהוָה֙ עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/009.yaml
  text: And they will say[a], ‘Because they abandoned Yahweh their God, who brought their fathers out of the land of Egypt, and they held fast to other gods and bowed down to them and served them[c][b], therefore Yahweh brought all this disaster on them.’
  footnotes:
  - marker: a
    text: Or “their ancestors.” The Hebrew reads “their fathers.”
    reason: lexical_alternative
  - marker: b
    text: Or “held fast to other gods.”
    reason: lexical_alternative
  - marker: c
    text: Hebrew “all this evil”; here the word refers to calamity or disaster brought in judgment, not moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말할 것입니다. “그들이 자기 조상들을 이집트 땅에서 이끌어 내신 자기 하나님 야훼를 버리고, 다른 신들을 굳게 붙들어 그것들에게 절하고 그것들을 섬겼으므로, 야훼께서 이 모든 재앙을 그들에게 가져오셨습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ
  english_pob_choice: And they will say
  chosen_korean: 그들이 말할 것입니다
  alternatives_korean:
  - 사람들이 말할 것입니다
  - 그때 그들이 말할 것입니다
  lexicon: HALOT
  rationale: 미래형 보고 발화로 처리해, 앞뒤 문맥에서 예측된 설명 문장이라는 기능을 자연스럽게 살렸습니다.
- source_word: אֲבֹתָם
  english_pob_choice: their fathers
  chosen_korean: 자기 조상들
  alternatives_korean:
  - 그들의 아버지들
  - 그들의 선조들
  lexicon: HALOT
  rationale: 히브리어의 직역성은 유지하되, 한국어에서는 출애굽 세대를 가리키는 대표적 조상 의미가 더 분명하도록 ‘조상들’로 옮겼습니다.
- source_word: וַיַּחֲזִקוּ בֵּאלֹהִים אֲחֵרִים
  english_pob_choice: they held fast to other gods
  chosen_korean: 다른 신들을 굳게 붙들어
  alternatives_korean:
  - 다른 신들에게 매달려
  - 다른 신들을 붙들어
  lexicon: HALOT
  rationale: חזק ב의 ‘붙잡다/매달리다’ 의미를 살리면서, 언약적 배신의 지속성을 한국어에서 자연스럽게 드러내기 위해 ‘굳게 붙들다’로 번역했습니다.
- source_word: וַיַּעַבְדֻם
  english_pob_choice: served them
  chosen_korean: 그것들을 섬겼으므로
  alternatives_korean:
  - 그것들에게 봉사했으므로
  - 그것들을 예배했으므로
  lexicon: HALOT
  rationale: 우상숭배 문맥에서의 cultic service를 유지하되, 앞선 ‘절하다’와 구분되도록 ‘섬기다’를 택했습니다.
- source_word: הֵבִיא יְהוָה ... אֵת כָּל הָרָעָה הַזֹּאת
  english_pob_choice: Yahweh brought all this disaster on them
  chosen_korean: 야훼께서 이 모든 재앙을 그들에게 가져오셨습니다
  alternatives_korean:
  - 야훼께서 이 모든 화를 그들에게 가져오셨습니다
  - 야훼께서 이 모든 재난을 그들에게 가져오셨습니다
  lexicon: HALOT
  rationale: רָעָה가 여기서는 도덕적 악이 아니라 심판으로 인한 재앙을 뜻하므로, 현대 한국어에서 가장 분명한 ‘재앙’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명기 전통 대체어 대신 고유신명 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 신명기 표기를 사용하므로, 호칭으로 대체하지 않고 고유 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘다른 신들’과 ‘절하다/섬기다’의 연속 표현
  chosen_reading: 다른 신들을 굳게 붙들어 그것들에게 절하고 그것들을 섬겼으므로
  alternative_readings:
  - 다른 신들을 붙들고 그것들에게 예배하고 섬겼으므로
  - 다른 신들에게 매달려 그것들을 경배하고 섬겼으므로
  rationale: 히브리어는 소유·결속(붙들다)→몸의 경배(절하다)→종교적 봉사(섬기다)의 단계적 악화를 보여 주므로, 그 구분을 한국어에서도 유지했습니다.
  doctrine_reference: Translation philosophy §1; lexical distinction in the source
