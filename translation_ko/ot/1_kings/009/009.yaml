    rationale: 히브리어는 ‘그들이 말할 것이다’ 뒤에 עַל אֲשֶׁר로 시작하여 심판의 이유를 답합니다. 한국어에서는 ‘으므로’ 뒤에 평서문을 종결하기보다 ‘...때문입니다’로 끝내야 그 답변 구조와 인과 관계가 명료합니다.
  - severity: low
    issue: ‘그들이 말할 것입니다’와 인용문 첫 ‘그들이’의 지시 대상이 한국어에서 혼동될 수 있음
    rationale: 원문의 대명사 자체는 문맥상 구별되지만, 한국어에서는 인용문 밖의 관찰자와 인용문 안의 심판받는 백성을 구분해 ‘사람들이’와 ‘그들이’로 표현하는 편이 자연스럽습니다. 이는 본문 문맥상 암시된 발화자를 명료화할 뿐 의미를 추가하지 않습니다.
