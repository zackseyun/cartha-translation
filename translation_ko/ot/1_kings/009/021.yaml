  text: בְּנֵי/הֶ֗ם אֲשֶׁ֨ר נֹתְר֤וּ אַחֲרֵי/הֶם֙ בָּ/אָ֔רֶץ אֲשֶׁ֧ר לֹֽא יָכְל֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/הַֽחֲרִימָ֑/ם וַ/יַּעֲלֵ֤/ם שְׁלֹמֹה֙ לְ/מַס עֹבֵ֔ד עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/021.yaml
  text: their children who were left after them in the land[a], whom the sons of Israel had not been able to devote to destruction—Solomon conscripted them for forced labor, to this day.
  footnotes:
  - marker: a
    text: Hebrew 'devote to destruction'; alternatively, 'put under the ban' or 'utterly destroy.' The verb refers to placing people or things under חרם, a form of irrevocable dedication to judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 자녀들, 곧 그들 뒤에 그 땅에 남아 있던 자들, 이스라엘 자손이 멸절시키지 못했던 자들을 솔로몬이 노역을 시키도록 불러올렸습니다. 오늘날까지 그러했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חרם은 ‘멸절시키다’로도 옮길 수 있으며, 대상을 심판 아래 바치는 제의적·법적 의미를 함께 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵיהֶם
  english_pob_choice: their children
  chosen_korean: 그들의 자녀들
  alternatives_korean:
  - 그들의 아들들
  - 그들의 후손들
  lexicon: HALOT
  rationale: 복수 הֵם의 자손을 가리키는 문맥이므로 성별을 좁히는 ‘아들들’보다 포괄적인 ‘자녀들’이 자연스럽고 원문 범위를 잘 보존합니다.
- source_word: נֹתְרוּ אַחֲרֵיהֶם
  english_pob_choice: were left after them
  chosen_korean: 그들 뒤에 … 남아 있던 자들
  alternatives_korean:
  - 그들 뒤에 남은 자들
  - 그들 뒤에 남아 있던 사람들
  lexicon: HALOT
  rationale: ‘남아 있다’는 결과 상태와 ‘그들 뒤에’라는 시간·순서 관계를 함께 드러내기 위해 이렇게 옮겼습니다.
- source_word: לְהַחֲרִימָם
  english_pob_choice: devote to destruction
  chosen_korean: 멸절시키지 못했던
  alternatives_korean:
  - 진멸하지 못했던
  - 저주 아래 두지 못했던
  lexicon: HALOT
  rationale: חרם의 제의적·심판적 긴장을 살리기 위해 단순한 ‘죽이다’보다 ‘멸절시키다’를 택했습니다. 영어 POB의 ‘devote to destruction’에 대응합니다.
- source_word: לְמַס עֹבֵד
  english_pob_choice: for forced labor
  chosen_korean: 노역을 시키도록
  alternatives_korean:
  - 강제 노역을 하게
  - 부역을 하도록
  - 강제 노동으로
  lexicon: HALOT
  rationale: מַס עֹבֵד는 세금보다 사람을 동원한 강제 노동을 가리키므로, 현대 한국어에서 의미가 분명한 ‘노역’으로 옮겼습니다.
theological_decisions:
- issue: חרם의 심판-헌납 의미 보존
  chosen_reading: ‘멸절시키다’로 옮겨 단순 군사적 학살로만 축소하지 않고, 하나님께 바쳐진 심판 행위라는 긴장을 유지했습니다.
  alternative_readings:
  - ‘진멸하다’
  - ‘전멸시키다’
  - ‘저주 아래 두다’
  rationale: 이 구절은 정복 전쟁의 폭력만이 아니라 חרם의 신학적 배경을 함께 지니므로, 의미를 평탄화하지 않는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it.
