  naturalness: 현대 표준 한국어 합쇼체에서는 ‘강제 노역에 동원했습니다’가 명료하고 자연스럽습니다. 원문의 종결 시간구를 해당 동작에 연결하여 ‘오늘날까지’의 범위를 분명히 했습니다.
  terminology: ‘이스라엘 자손’, ‘진멸’, ‘강제 노역’은 각각 בְּנֵי יִשְׂרָאֵל, החרים, מַס עֹבֵד에 적절히 대응합니다. ‘진멸’ 자체가 חרם의 모든 제의적 함의를 담지는 않으므로, 각주에서 ‘심판에 바치다’라는 의미 범위를 설명합니다.
