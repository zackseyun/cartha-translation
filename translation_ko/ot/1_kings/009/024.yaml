translation:
  language: ko
  text: 그러나 파라오의 딸은 다윗 성에서 그녀를 위해 그가 지은 집으로 올라갔습니다[a]. 그때 그가 밀로를 건축했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 밀로는 아마도 요새나 지지 흙둑/테라스 구조물을 가리키는 말로 보이며, ‘테라스들’ 또는 ‘채움’으로도 옮길 수 있습니다.
    reason: lexical_alternative
