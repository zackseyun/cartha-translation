translation:
  language: ko
  text: 그러나 파라오의 딸은 다윗 성에서 그녀를 위해 그가 지은 집으로 올라갔습니다. 그때 그가 밀로[a]를 건축했습니다.
  philosophy: optimal-equivalence
  footnotes:
