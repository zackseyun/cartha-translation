source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל עָרֵ֤י הַֽ/מִּסְכְּנוֹת֙ אֲשֶׁ֣ר הָי֣וּ לִ/שְׁלֹמֹ֔ה וְ/אֵת֙ עָרֵ֣י הָ/רֶ֔כֶב וְ/אֵ֖ת עָרֵ֣י הַ/פָּרָשִׁ֑ים וְ/אֵ֣ת חֵ֣שֶׁק שְׁלֹמֹ֗ה אֲשֶׁ֤ר חָשַׁק֙ לִ/בְנ֤וֹת בִּ/ירוּשָׁלִַ֨ם֙ וּ/בַ/לְּבָנ֔וֹן וּ/בְ/כֹ֖ל אֶ֥רֶץ מֶמְשַׁלְתּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/019.yaml
  text: also all the storage cities that belonged to Solomon[a], the chariot cities, the horsemen's cities, and whatever Solomon desired to build in Jerusalem, in Lebanon[c][b], and in all the land of his dominion.
  footnotes:
  - marker: a
    text: Or 'store cities' or 'supply cities.' The Hebrew refers to cities designated for storage or provisions.
    reason: lexical_alternative
  - marker: b
    text: Or 'cities of the horsemen' or 'cavalry cities.' The Hebrew term refers more specifically to horsemen than to horses in general.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'the desire of Solomon which he desired to build,' a Hebrew emphatic expression for what Solomon strongly wished to build.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 솔로몬에게 속한 모든 저장 성읍들과 전차 성읍들, 기병의 성읍들, 그리고 솔로몬이 예루살렘과 레바논과 그의 통치의 온 땅에서 짓기를 원한 모든 것을.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָרֵי הַמִּסְכְּנוֹת
  english_pob_choice: storage cities
  chosen_korean: 저장 성읍들
  alternatives_korean:
  - 저장 도시들
  - 비축 성읍들
  - 창고 성읍들
  lexicon: HALOT
  rationale: 물자와 보급품을 저장하는 용도의 성읍이라는 행정적 의미를 살려, 직역의 어색함보다 현대 한국어에서 바로 이해되는 표현을 택했습니다.
- source_word: עָרֵי הָרֶכֶב
  english_pob_choice: the chariot cities
  chosen_korean: 전차 성읍들
  alternatives_korean:
  - 병거 성읍들
  - 전차를 위한 성읍들
  lexicon: HALOT
  rationale: 전차 부대를 위한 거점 성읍이라는 뜻을 간결하게 드러내기 위해 '전차 성읍들'로 옮겼습니다.
- source_word: עָרֵי הַפָּרָשִׁים
  english_pob_choice: the horsemen’s cities
  chosen_korean: 기병의 성읍들
  alternatives_korean:
  - 말 탄 자들의 성읍들
  - 기병 성읍들
  - 말들의 성읍들
  lexicon: HALOT
  rationale: פָּרָשִׁים은 말 자체보다 기병/말 탄 병사를 가리키므로, 전차와 구별되게 '기병의 성읍들'로 렌더링했습니다.
- source_word: חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק לִבְנוֹת
  english_pob_choice: whatever Solomon desired to build
  chosen_korean: 솔로몬이 … 짓기를 원한 모든 것
  alternatives_korean:
  - 솔로몬이 … 짓고자 한 모든 것
  - 솔로몬이 … 건축하기를 갈망한 모든 것
  lexicon: HALOT
  rationale: 히브리어의 명사-동사 공호응 강조를 한국어에서 자연스럽게 살리기 위해 '원한 모든 것'으로 풀되, 범위는 '모든 것'으로 보존했습니다.
- source_word: בִּירוּשָׁלִַם וּבַלְּבָנוֹן וּבְכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  english_pob_choice: in Jerusalem, in Lebanon, and in all the land of his dominion
  chosen_korean: 예루살렘과 레바논과 그의 통치의 온 땅에서
  alternatives_korean:
  - 예루살렘과 레바논과 그의 다스림의 온 땅에서
  - 예루살렘과 레바논과 그의 나라의 온 땅에서
  lexicon: HALOT
  rationale: אֶרֶץ מֶמְשַׁלְתּוֹ의 ‘땅/영역’과 ‘통치’의 이중성을 살리기 위해 '그의 통치의 온 땅'으로 옮겼습니다.
