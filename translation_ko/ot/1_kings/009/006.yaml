    rationale: ‘당신들과 당신의 아들들이’는 단수 상대인 솔로몬과 그의 아들들을 가리키는 표현으로 자연스럽지 않으며, 영어 POB 및 각주가 보존한 ‘너 또는 네 아들들’의 해석 가능성과도 맞지 않습니다.
