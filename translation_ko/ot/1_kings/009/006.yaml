  source_fidelity: 수정이 필요합니다. 초안의 ‘당신들과 당신의 아들들이’는 히브리어의 대상 표현을 부자연스럽게 복수화하며, 각주가 설명하는 ‘너 또는 네 아들들’이라는 본문상의 가능성을 본문에서 가립니다. 또한 ‘내 뒤를 따라가다 돌아서서’는 한국어에서 ‘따라가던 중 방향을 바꾸다’처럼 들릴 수 있어, מֵאַחֲרַי의 언약적 이탈을 더 분명히 드러내야 합니다.
  naturalness: ‘너나 네 아들들이’와 ‘나를 따르는 데서 완전히 돌아서서’는 왕에게 주어지는 경고라는 문맥에서 자연스럽고, שׁוֹב תְּשֻׁבוּן의 강조도 반영합니다. ‘그들 앞에 엎드리면’은 신체적 복종 행위를 보존하면서 자연스럽습니다.
  terminology: מִצְוֺת와 חֻקֹּת의 구별은 ‘계명’과 ‘규례’로 유지했습니다. עבד와 השתחוה도 각각 ‘섬기다’와 ‘엎드리다’로 구별했습니다.
