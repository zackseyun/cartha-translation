id: 1KI.9.6
reference: 1 Kings 9:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם שׁ֨וֹב תְּשֻׁב֜וּ/ן אַתֶּ֤ם וּ/בְנֵי/כֶם֙ מֵֽ/אַחֲרַ֔/י וְ/לֹ֤א תִשְׁמְרוּ֙ מִצְוֺתַ֣/י חֻקֹּתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/006.yaml
  text: But if you or your sons turn away from following me[a], and do not keep my commandments and my statutes that I have set before you, and go and serve other gods and bow down to them,
  footnotes:
  - marker: a
    text: Or 'you and your sons.' The Hebrew can be understood as addressing Solomon together with his descendants; the main text brings out the conditional force toward either Solomon or his royal line.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 만일 당신들과 당신의 아들들이 내 뒤를 따라가다 돌아서서, 내가 당신들 앞에 둔 내 명령들과 내 규례들을 지키지 않고, 가서 다른 신들을 섬기고 그들에게 엎드리면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘당신들과 당신의 아들들’로도 이해할 수 있습니다. 본문은 솔로몬이나 그의 왕통 어느 쪽이든 조건적 경고의 대상임을 드러내기 위해 자연스럽게 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 만일
  - 그런데 만일
  lexicon: HALOT
  rationale: 조건문 자체는 ‘만일’이지만, 문맥상 앞선 약속과 대비되는 경고이므로 한국어에서는 역접을 보태어 자연스러운 전환을 살렸습니다.
- source_word: שׁוֹב תְּשֻׁבוּן / מֵאַחֲרַי
  english_pob_choice: turn away from following me
  chosen_korean: 내 뒤를 따라가다 돌아서서
  alternatives_korean:
  - 나를 따르던 길에서 돌아서서
  - 나를 따르지 않고 돌아서서
  lexicon: HALOT
  rationale: 이 표현은 회개가 아니라 언약적 이탈을 가리키므로 ‘돌아서다’로 옮기되, ‘뒤를 따라가다’로 관계적·추종적 뉘앙스를 살렸습니다.
- source_word: מִצְוֺתַי חֻקֹּתַי
  english_pob_choice: my commandments and my statutes
  chosen_korean: 내 명령들과 내 규례들
  alternatives_korean:
  - 내 계명들과 내 율례들
  - 내 명령과 내 규례
  lexicon: HALOT
  rationale: 두 법적 용어를 구분해 유지해야 하므로 ‘명령’과 ‘규례’를 병렬로 두었습니다. ‘규례’는 חֻקֹּתַי의 제정된 규범성을 비교적 잘 드러냅니다.
- source_word: וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים / וְהִשְׁתַּחֲוִיתֶם לָהֶם
  english_pob_choice: and go and serve other gods and bow down to them
  chosen_korean: 가서 다른 신들을 섬기고 그들에게 엎드리면
  alternatives_korean:
  - 가서 다른 신들을 섬기고 그들에게 절하면
  - 가서 다른 신들을 섬기고 그들 앞에 엎드리면
  lexicon: HALOT
  rationale: ‘섬기다’와 ‘엎드리다’를 분리해 히브리어의 두 동작을 보존했습니다. ‘엎드리다’는 실제 몸의 굴복을 나타내는 השתחוה의 구체성을 살립니다.
theological_decisions:
- issue: 다윗 왕조에 대한 경고의 대상 범위
  chosen_reading: ‘당신들과 당신의 아들들’로, 솔로몬과 그 왕통을 함께 향한 경고로 읽었습니다.
  alternative_readings:
  - 일반적인 ‘당신과 당신의 자녀들’로 넓게 읽을 수 있습니다.
  rationale: 문맥상 성전과 왕조에 대한 언약 경고이므로, 단순한 일반 청중보다 솔로몬과 그의 후손을 포함하는 왕조적 의미를 드러내는 것이 더 정확합니다.
  doctrine_reference: Translation philosophy §4 (gender-accurate over gender-neutral)
