lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: built
  chosen_korean: 건축하였습니다
  alternatives_korean:
  - 세웠습니다
  - 지었습니다
  - 재건하였습니다
  - 보수하여 세웠습니다
  lexicon: HALOT
  rationale: qal wayyiqtol בנה의 기본 의미를 살려 ‘건축하다’로 옮겼습니다. 왕의 건축 사업 맥락상 재건이나 요새화 가능성은 있지만, 본문은 그 함의를 과도하게 풀지 않는 것이 적절합니다.
- source_word: שְׁלֹמֹה
  english_pob_choice: Solomon
  chosen_korean: 솔로몬
  alternatives_korean:
  - 다윗의 아들 솔로몬
  lexicon: 표준 고유명사 표기
  rationale: 히브리어 고유명사 שְׁלֹמֹה는 한국어 성경에서 널리 쓰이는 ‘솔로몬’으로 옮겼습니다.
- source_word: גָּזֶר
  english_pob_choice: Gezer
  chosen_korean: 게셀
  alternatives_korean:
  - 게저
  lexicon: 표준 지명 표기
  rationale: 지명 גָּזֶר은 한국어 성경의 통용 표기인 ‘게셀’을 사용했습니다.
- source_word: בֵּית חֹרֹן תַּחְתּוֹן
  english_pob_choice: Lower Beth-horon
  chosen_korean: 아래 벧호론
  alternatives_korean:
  - 낮은 벧호론
  - 하벧호론
  - 벧호론 아래쪽
  lexicon: HALOT
  rationale: תַּחְתּוֹן의 방위/지형적 의미를 살려 ‘아래’로 옮기고, 두 벧호론을 구분하는 지명을 자연스러운 한국어로 표현했습니다.
theological_decisions:
- issue: 지명 구문의 표기 방식
  chosen_reading: ‘Lower Beth-horon’의 지리적 구분을 드러내되, 본문은 장식적 설명 없이 간결하게 유지했습니다.
  alternative_readings:
  - ‘벧호론 아래쪽’처럼 더 직역적으로 표기
  - ‘낮은 벧호론’처럼 형용사형으로 표기
  rationale: 히브리어는 두 지역을 구별하는 지명 표지로 תַּחְתּוֹן을 사용하므로, 한국어도 그 구분을 유지하되 독자가 바로 읽을 수 있는 표현이 필요합니다.
  doctrine_reference: 지명·역사 서술
- issue: 동사의 서술 강도
  chosen_reading: ‘건축하였습니다’로 두어 왕의 공적 건축 사업을 중립적으로 서술했습니다.
  alternative_readings:
  - ‘재건하였습니다’로 해석 강화
  - ‘요새화하였습니다’로 군사적 기능을 부각
  rationale: 본문 자체는 건축 행위를 말할 뿐이므로, 추정되는 군사적 의미를 본문 본문에 직접 주입하지 않았습니다.
  doctrine_reference: 문맥 우선 원칙
