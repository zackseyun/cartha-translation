source:
  edition: WLC
  text: וְ/אֶֽת בַּעֲלָ֛ת וְ/אֶת תמר בַּ/מִּדְבָּ֖ר בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/018.yaml
  text: and Baalath[a], and Tamar in the wilderness, in the land.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Tamar''; the parallel passage in 2 Chronicles 8:4 reads ''Tadmor.'''
    reason: textual_variant
translation:
  language: ko
  text: 그리고 바알랏과 사막에 있는 다말을, 그 땅에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘다말’이지만, 평행본문인 역대하 8:4는 ‘다드모르’로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְ/אֶת בַּעֲלָ֛ת
  english_pob_choice: and Baalath
  chosen_korean: 그리고 바알랏
  alternatives_korean:
  - 또 바알랏
  - 바알랏을
  lexicon: HALOT
  rationale: 고유 지명은 음역하고, 첫 번째 וְ는 앞절 목록을 잇는 단순 연결로 ‘그리고’로 옮겼습니다. 목적격 표지는 한국어에서 드러내지 않았습니다.
- source_word: תמר
  english_pob_choice: Tamar
  chosen_korean: 다말
  alternatives_korean:
  - 타말
  - 다드모르
  lexicon: HALOT
  rationale: 히브리어 본문은 תמר이므로 음역상 ‘다말’이 가장 직접적입니다. 역대하의 이문 ‘Tadmor’는 본문이 아니라 주석으로 처리하는 편이 타당합니다.
- source_word: בַּ/מִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 사막에 있는
  alternatives_korean:
  - 광야에 있는
  - 들판에 있는
  lexicon: HALOT
  rationale: מִדְבָּר의 기본 의미 범위를 살리되, 한국어에서 지리적 배경을 자연스럽게 전달하는 ‘사막’을 택했습니다. 다만 본문 흐름상 위치 수식은 ‘있는’으로 처리했습니다.
- source_word: בָּ/אָֽרֶץ
  english_pob_choice: in the land
  chosen_korean: 그 땅에
  alternatives_korean:
  - 그 나라에
  - 그 지역에
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 구체적 국명보다 넓은 지리적 ‘땅’을 가리키므로, 범위를 과도하게 좁히지 않는 ‘그 땅’이 적절합니다.
