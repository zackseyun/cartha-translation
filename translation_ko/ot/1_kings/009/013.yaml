  text: And he said[a], “What are these cities that you have given me, my brother?” So he called them the land of Cabul to this day.
  footnotes:
  - marker: a
    text: Cabul is likely a place-name, but the Hebrew may also suggest a disparaging wordplay, possibly implying something like 'good for nothing' or 'as if bound/limited.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말하되 「내가 준 이 도시들이 무엇이냐, 내 형제여?」 하였으므로 그는 그것들을 오늘까지 ‘가불의 땅’이라고 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가불’은 지명으로 보이지만, 히브리어는 ‘쓸모없음’ 또는 ‘가치 없음’ 같은 비하적 말장난을 암시할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הֶעָרִים הָאֵלֶּה
  english_pob_choice: What are these cities
  chosen_korean: 「내가 준 이 도시들이 무엇이냐」
  alternatives_korean:
  - 「이 도시들이 무엇이냐」
  - 「이것들은 무슨 도시들이냐」
  lexicon: HALOT
  rationale: מָה의 질의·비난 뉘앙스를 살리면서, 담화상 불만이 섞인 왕실 대화로 자연스럽게 옮겼습니다. '내가 준'은 뒤의 אֲשֶׁר נָתַתָּה לִּי를 반영합니다.
- source_word: אָחִי
  english_pob_choice: my brother
  chosen_korean: 내 형제여
  alternatives_korean:
  - 내 형제님
  - 형제여
  lexicon: HALOT
  rationale: 히브리어의 직설적 호칭을 유지하되, 왕실 외교 문맥에 맞게 한국어에서도 호격으로 처리했습니다.
- source_word: וַיִּקְרָא לָהֶם אֶרֶץ כָּבוּל
  english_pob_choice: So he called them the land of Cabul
  chosen_korean: 그는 그것들을 오늘까지 ‘가불의 땅’이라고 불렀습니다
  alternatives_korean:
  - 그는 그것들을 ‘가불’이라 불렀습니다
  - 그는 그것들을 ‘가불 땅’이라 불렀습니다
  lexicon: HALOT
  rationale: אֶרֶץ כָּבוּל은 지명화된 표현으로 보아 본문에는 음역을 유지했습니다. פּOB의 주석처럼 비하적 말장난 가능성은 본문이 아니라 주석으로 남기는 편이 원문에 더 충실합니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘까지
  alternatives_korean:
  - 지금까지
  - 이날까지
  lexicon: HALOT
  rationale: 히브리어의 관용적 종결 공식을 현대 한국어로 가장 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 히브리어 수사 의문문의 어조
  chosen_reading: 단순 정보 질문이 아니라 불만과 경멸이 섞인 질문으로 옮겼습니다.
  alternative_readings:
  - 중립적 질문으로 옮기기
  - 감탄문으로 강하게 재구성하기
  rationale: מָה와 전체 장면 문맥상 솔로몬이 준 성읍들에 대한 히람의 불만이 드러납니다. 한국어에서도 이를 완화하지 않는 편이 서사 의도를 더 잘 드러냅니다.
  doctrine_reference: 문맥 기반 화행·담화 의미
- issue: Cabul의 처리
  chosen_reading: 본문에는 음역 ‘가불’을 유지하고, 비하적 함의는 본문 밖에서 다루도록 했습니다.
  alternative_readings:
  - ‘쓸모없는 땅’으로 본문에 반영하기
  - ‘가불(쓸모없는 땅)’처럼 병기하기
  rationale: 본문 차원에서는 지명 여부가 확정적이므로, 해석 가능성은 보존하되 서술을 과잉해석하지 않았습니다. 이는 본문과 주석의 경계를 분리하는 POB 방식에 맞습니다.
  doctrine_reference: 본문-주석 분리 원칙
