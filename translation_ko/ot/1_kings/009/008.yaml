id: 1KI.9.8
reference: 1 Kings 9:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ יִהְיֶ֣ה עֶלְי֔וֹן כָּל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֣ם וְ/שָׁרָ֑ק וְ/אָמְר֗וּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/008.yaml
  text: And this house will become a ruin[a]. Everyone who passes by it will be appalled and will whistle, and they will say[b], ‘Why has Yahweh done thus to this land and to this house?’
  footnotes:
  - marker: a
    text: 'Hebrew: ''this house will be high/exalted.'' In context, many understand the sense to be that it will become a ruin or object of horror; compare 2 Chronicles 7:21.'
    reason: textual_variant
  - marker: b
    text: Or 'hiss.' The Hebrew verb refers to making a sharp sound in astonishment or derision.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 집은 폐허가 될 것입니다[a]. 지나가는 모든 사람이 그 앞에서 놀라며 휘파람을 불고, ‘야훼께서 어찌하여 이 땅과 이 집에 이같이 행하셨습니까?’ 하고 말할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이 집은 높다/높아질 것이다’입니다. 문맥상 많은 해석이 이 표현을 폐허나 경악의 대상로 이해하며, 2역대기 7:21과 비교할 수 있습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘쉿 소리를 낸다’로 옮길 수 있습니다. 히브리어 동사는 놀람이나 조롱의 날카로운 소리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  english_pob_choice: And this house
  chosen_korean: 이 집
  alternatives_korean:
  - 이 성전
  - 이 건물
  lexicon: HALOT
  rationale: 히브리어 בַּיִת의 기본 의미를 살리면서, 문맥상 성전을 가리키는 점도 자연스럽게 드러내는 가장 직접적인 표현입니다.
- source_word: יִהְיֶה עֶלְיוֹן
  english_pob_choice: will become a ruin
  chosen_korean: 폐허가 될 것입니다
  alternatives_korean:
  - 높아질 것입니다
  - 높은 곳이 될 것입니다
  - 무너진 폐허가 될 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘높다/높아지다’이지만, 문맥과 평행본문의 심판 맥락상 파괴와 황폐를 뜻하는 것으로 이해하는 것이 타당하여 한국어로는 ‘폐허가 될 것입니다’로 옮겼습니다.
- source_word: וְשָׁרָק
  english_pob_choice: and will whistle
  chosen_korean: 휘파람을 불고
  alternatives_korean:
  - 쉿 소리를 내고
  - 야유하고
  lexicon: HALOT
  rationale: 히브리어는 놀람이나 조롱의 날카로운 소리를 가리키며, 한국어에서는 ‘휘파람을 불다’가 가장 직접적이면서도 문맥의 경탄/경멸 뉘앙스를 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 여호와 대신 하나님의 고유명사 ‘야훼’를 사용하여 히브리어 원문의 인칭성과 언약적 이름을 보존했습니다.
theological_decisions:
- issue: 궁정/성전 예언에서의 심판 표현
  chosen_reading: ‘이 집은 폐허가 될 것입니다’로 심판의 결과를 분명히 드러내고, ‘높다/높아지다’의 문자적 긴장은 각주로 보존합니다.
  alternative_readings:
  - ‘이 집은 높아질 것입니다’
  - ‘이 집은 높게 될 것입니다’
  rationale: 본문의 표면형은 ‘높다’이지만, 문맥상 솔로몬 성전의 황폐와 경악을 예고하는 문장으로 읽어야 하므로, 의미를 완전히 놓치지 않되 원문의 난점을 각주로 남겨 둡니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
- issue: 야훼 이름의 번역
  chosen_reading: 하나님의 고유명사 ‘야훼’를 본문에 직접 표기합니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 이 절은 하나님의 행위를 설명하는 군중의 인용문으로, 신성명을 대체 칭호로 바꾸면 원문의 직접성이 약해집니다. לכן 고유명사 표기를 유지합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
