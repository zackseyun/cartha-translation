base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/022.yaml
  text: But from the sons of Israel Solomon made no slaves[a], for they were the men of war, his slaves, his commanders, his officers, and the commanders of his chariots and his horsemen.
  footnotes:
  - marker: a
    text: Or 'his adjutants' for 'his officers'; the Hebrew term likely refers to a specific class of high-ranking military aides or chariot officers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이스라엘 자손에게는 솔로몬이 종을 두지 않았습니다. 그들이 전사들이며, 그의 종들과 그의 지휘관들과 그의 장교들과 그의 병거 지휘관들과 그의 기병들이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘장교들’은 여기서 고위 군사 보좌관이나 병거 관련 장교를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשְׂרָאֵל
  english_pob_choice: But from the sons of Israel
  chosen_korean: 그러나 이스라엘 자손에게는
  alternatives_korean:
  - 그리고 이스라엘 자손에게는
  - 이스라엘 사람들 가운데서는
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 ‘이스라엘 자손’으로 옮기고, 앞절과의 대조를 반영해 ‘그러나’로 시작했습니다.
- source_word: לֹא נָתַן ... עָבֶד
  english_pob_choice: made no slaves
  chosen_korean: 종을 두지 않았습니다
  alternatives_korean:
  - 노예로 삼지 않았습니다
  - 종으로 만들지 않았습니다
  lexicon: HALOT
  rationale: 이 절의 핵심은 강제된 종속 상태를 나타내는 עָבֶד이므로, 본문 긴장을 살리면서도 한국어에서 자연스러운 ‘종을 두지 않다’로 옮겼습니다.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  english_pob_choice: the men of war
  chosen_korean: 전사들이며
  alternatives_korean:
  - 전쟁의 사람들입니다
  - 전투원들입니다
  lexicon: HALOT
  rationale: 남성형 군사 표현을 완화하지 않고, 문맥상 전투에 속한 인물을 가리키는 말로 ‘전사들’이 가장 간결합니다.
- source_word: וְשָׁלִשָׁיו
  english_pob_choice: his officers
  chosen_korean: 그의 장교들
  alternatives_korean:
  - 그의 부관들
  - 그의 참모들
  lexicon: HALOT
  rationale: 이 어휘는 고위 군사 보좌관/장교를 가리킬 수 있어, 현대 한국어에서 그 지위를 드러내는 ‘장교들’로 처리했습니다.
theological_decisions:
- issue: 왕권 아래의 신분 구분을 어떻게 드러낼지
  chosen_reading: ‘종을 두지 않았습니다’로 번역해, 이스라엘 자손이 강제 노역의 대상이 아니었다는 점을 분명히 했습니다.
  alternative_readings:
  - ‘노예로 삼지 않았습니다’
  - ‘종으로 만들지 않았습니다’
  rationale: 앞뒤 문맥이 외국인에 대한 노역 체계를 말하므로, 여기서도 단순한 고용이 아니라 종속 신분의 배제를 분명히 해야 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 1; bonded-status terminology policy
