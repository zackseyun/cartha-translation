  - severity: low
    issue: 각주 a의 앵커 위치
    rationale: 각주는 문장 끝이 아니라 ‘강제 노역’에 직접 붙여, 무엇에 대한 어휘 대안인지 분명히 해야 합니다.
  - severity: low
