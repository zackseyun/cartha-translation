  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֶ֨ה דְבַר הַ/מַּ֜ס אֲשֶֽׁר הֶעֱלָ֣ה הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה לִ/בְנוֹת֩ אֶת בֵּ֨ית יְהוָ֤ה וְ/אֶת בֵּית/וֹ֙ וְ/אֶת הַ/מִּלּ֔וֹא וְ/אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/אֶת חָצֹ֥ר וְ/אֶת מְגִדּ֖וֹ וְ/אֶת גָּֽזֶר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/015.yaml
  text: Now this is the account of the forced labor that King Solomon levied to build the house of Yahweh[a], his own house, the Millo, the wall of Jerusalem, Hazor, Megiddo[b], and Gezer.
  footnotes:
  - marker: a
    text: Or 'labor levy' or 'corvée,' that is, compulsory state labor rather than a monetary tax.
    reason: lexical_alternative
  - marker: b
    text: '''The Millo'' is likely a known fortification or terraced fill structure in Jerusalem; the Hebrew term may mean ''the fill'' or refer to terraces.'
    reason: cultural_note
translation:
  language: ko
  text: 이것은 솔로몬 왕이 야훼의 집과 자기의 궁전과 밀로[b]와 예루살렘 성벽과 하솔과 므깃도와 게셀을 건축하려고 부과한 강제 노역[a]의 기록입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노역 징발’. 금전 세금이 아니라 국가가 강제로 동원한 노동을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘밀로’는 예루살렘에 있던 것으로 보이는 성벽 시설 또는 성토 구조물을 가리킬 수 있습니다. 히브리어는 ‘채움’을 뜻할 수도 있고, 계단식 구조물을 가리킬 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְזֶה דְבַר
  english_pob_choice: this is the account
  chosen_korean: 그리고 이것은 …의 기록입니다
  alternatives_korean:
  - 그리고 이것은 …의 일입니다
  - 그리고 이것은 …의 말씀입니다
  lexicon: HALOT
  rationale: דְבַר는 여기서 설명적 서문으로 기능하므로, 현대 한국어에서는 ‘기록’이 가장 자연스럽게 보고/설명문의 성격을 살립니다.
- source_word: הַמַּס
  english_pob_choice: forced labor
  chosen_korean: 강제 노역
  alternatives_korean:
  - 부역
  - 노역 징발
  - 강제 노동
  lexicon: HALOT
  rationale: מַס는 금전적 조공이 아니라 국가가 부과한 의무 노동을 가리키므로, ‘강제 노역’이 의미를 분명히 드러냅니다.
- source_word: הֶעֱלָה
  english_pob_choice: levied
  chosen_korean: 부과한
  alternatives_korean:
  - 징발한
  - 부과한
  - 올려 부과한
  lexicon: HALOT
  rationale: הֶעֱלָה는 여기서 부역을 ‘부과하다/징발하다’는 행정적 의미이므로, 한국어에서는 간결한 ‘부과한’이 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project glossary
  rationale: 본문의 신명은 프로젝트 기본어인 ‘야훼’를 따라 옮겼습니다. 본문 자체에는 각주를 두지 않되, 이 서술이 성전 건축 맥락의 야훼를 가리킨다는 점을 유지합니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼로 직역해 고유한 언약 이름을 보존합니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 성전과 왕궁의 건축을 대조하는 역사 서술 안에서 신명 יְהוָה를 직접 사용하므로, 일반 호칭인 ‘주님’보다 고유명 ‘야훼’가 원문의 구분을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
