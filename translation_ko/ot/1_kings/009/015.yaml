    issue: 지명 ‘게젤’
    rationale: גָּזֶר(Gezer)의 통용 표준 한국어 성서 지명은 ‘게셀’입니다. ‘게젤’은 한국어 성서 독자에게 비표준적이며 기존 지명 관습과 어긋납니다.
