  text: All the people who remained of the Amorites[a], the Hittites, the Perizzites, the Hivites, and the Jebusites, who were not of the sons of Israel—
  footnotes:
  - marker: a
    text: 'Or ''were not from the Israelites.'' Hebrew: ''were not from the sons of Israel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 아모리 사람, 헷 사람, 브리스 사람, 히위 사람, 여부스 사람 가운데 남은 모든 사람들로서, 이스라엘 자손에게서 난 것이 아닌 사람들입니다—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들에게서 난 것이 아니다’. 히브리어는 ‘이스라엘 자손에게서 난 것이 아니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעָם
  english_pob_choice: All the people
  chosen_korean: 모든 사람들
  alternatives_korean:
  - 모든 백성
  - 그 모든 사람들
  lexicon: HALOT
  rationale: 전체성을 살리되, 뒤의 열거된 민족 집단을 자연스럽게 받도록 현대 한국어에서는 ‘모든 사람들’이 가장 매끄럽습니다.
- source_word: הַנּוֹתָר
  english_pob_choice: who remained
  chosen_korean: 남은
  alternatives_korean:
  - 남아 있는
  - 남겨진
  lexicon: HALOT
  rationale: 남아 있던 잔존 집단이라는 뜻을 간결하게 살리기 위해 형용사적 표현 ‘남은’을 사용했습니다.
- source_word: הָאֱמֹרִי הַחִתִּי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  english_pob_choice: the Amorites, the Hittites, the Perizzites, the Hivites, and the Jebusites
  chosen_korean: 아모리 사람, 헷 사람, 브리스 사람, 히위 사람, 여부스 사람
  alternatives_korean:
  - 아모리족, 헷족, 브리스족, 히위족, 여부스족
  - 아모리인, 헷인, 브리스인, 히위인, 여부스인
  lexicon: HALOT
  rationale: 히브리어 민족명은 한국어 성경에서 통용되는 고유 민족명 형식을 따라 옮겼고, ‘사람’은 집단성을 자연스럽게 나타냅니다.
- source_word: לֹא מִבְּנֵי יִשְׂרָאֵל
  english_pob_choice: who were not from the sons of Israel
  chosen_korean: 이스라엘 자손에게서 난 것이 아닌
  alternatives_korean:
  - 이스라엘 자손이 아닌
  - 이스라엘 사람들에게서 나온 것이 아닌
  lexicon: HALOT
  rationale: POB가 보존한 ‘sons of Israel’의 형식을 살리면서도, 한국어에서는 혈통·출신을 드러내는 ‘~에게서 난’으로 옮겨 원문의 출처/소속 대비를 분명히 했습니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 성별 표지와 출신 구분
  chosen_reading: ‘이스라엘 자손’이라는 집단 표지를 유지하되, 자연스러운 한국어 문장 안에서 출신/소속의 대비가 드러나도록 옮겼습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘의 자손
  rationale: 히브리어는 단순한 국적 표지보다 언약 공동체의 계보적 소속을 드러내므로, 이를 평탄화하지 않고 보존하는 편이 원문 의미에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy: source transparency and gender-accurate rendering'
