lexical_decisions:
- source_word: וַיֵּרָא
  english_pob_choice: appeared
  chosen_korean: 나타나셨습니다
  alternatives_korean:
  - 보이셨습니다
  - 드러나셨습니다
  lexicon: WLC / 표준어 용례
  rationale: 니팔형의 신현적 ‘appear’는 한국어에서 자연스럽고 직접적인 ‘나타나시다’가 가장 잘 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 여호와 자리에 해당하는 고유명은 교단식 칭호가 아니라 신명 ‘야훼’로 옮겨야 원문 식별성이 유지됩니다.
- source_word: שֵׁנִית
  english_pob_choice: a second time
  chosen_korean: 두 번째로
  alternatives_korean:
  - 다시
  - 두 번째 번으로
  lexicon: HALOT
  rationale: 순서를 분명히 드러내면서도 현대 한국어에서 가장 자연스러운 수량·순서 표현입니다.
- source_word: כַּאֲשֶׁר נִרְאָה אֵלָיו בְּגִבְעוֹן
  english_pob_choice: as he had appeared to him at Gibeon
  chosen_korean: 그분이 기브온에서 그에게 나타나셨던 것처럼
  alternatives_korean:
  - 기브온에서 그에게 나타나셨던 것처럼
  - 기브온에서 그에게 보이셨던 것처럼
  lexicon: HALOT
  rationale: 비교절의 과거완료적 선행 사건을 살리기 위해 ‘-셨던 것처럼’으로 처리했고, מקום 표지는 한국어 관용에 따라 ‘기브온에서’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 두 번째 현현 표현
  chosen_reading: ‘두 번째로 나타나셨습니다’로 옮겨, 솔로몬에게 주어진 반복적 신현을 분명히 드러냈습니다.
  alternative_readings:
  - 다시 나타나셨습니다
  - 두 번째 번에 나타나셨습니다
  rationale: שֵׁנִית는 단순한 재등장이 아니라 순차적 반복을 표시하므로, 본문이 강조하는 ‘두 번째 현현’의 의미를 유지하는 번역이 필요합니다.
  doctrine_reference: 본문의 역사적 신현 서술
