  text: Hiram king of Tyre had supplied Solomon with cedar timber[a], cypress timber, and gold, according to all his desire; then King Solomon gave Hiram twenty cities in the land of Galilee.
  footnotes:
  - marker: a
    text: Or 'juniper,' 'fir,' or another conifer; the exact species denoted by Hebrew berosh is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 두로 왕 히람은 솔로몬에게 백향목 재목과 노간주나무 재목과 금을 그의 모든 원하는 대로 공급하였으므로, 그때 솔로몬 왕은 히람에게 갈릴리 땅의 성읍 스무 개를 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְרוֹשׁ은 정확한 수종이 확정되지 않아, ‘노간주나무·전나무·사이프러스’ 등으로 다양하게 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשָּׂא
  english_pob_choice: had supplied
  chosen_korean: 공급하였으므로
  alternatives_korean:
  - 제공하였으므로
  - 보냈으므로
  - 지원하였으므로
  lexicon: HALOT
  rationale: 문맥상 히람이 솔로몬에게 자원을 대어 준 뜻이므로, ‘들다/지니다’의 직역보다 ‘공급하다’가 서술 흐름을 가장 잘 드러냅니다.
- source_word: בַּעֲצֵי אֲרָזִים
  english_pob_choice: with cedar timber
  chosen_korean: 백향목 재목
  alternatives_korean:
  - 백향목 목재
  - 백향목 나무
  - 백향목
  lexicon: HALOT
  rationale: עֵץ의 재료적 용법을 살려 건축 자재인 ‘재목’으로 옮겼습니다.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  english_pob_choice: and cypress timber
  chosen_korean: 노간주나무 재목
  alternatives_korean:
  - 사이프러스 재목
  - 전나무 재목
  - 향나무 재목
  lexicon: HALOT
  rationale: בְרוֹשׁ은 수종이 확정되지 않아, 기존 영어 주석처럼 식별 불확실성을 남기면서도 한국어에서는 ‘노간주나무’로 대표 번역했습니다.
- source_word: לְכָל חֶפְצוֹ
  english_pob_choice: according to all his desire
  chosen_korean: 그의 모든 원하는 대로
  alternatives_korean:
  - 그가 바라는 모든 것에 따라
  - 그의 모든 소원대로
  - 그의 모든 뜻대로
  lexicon: HALOT
  rationale: חֵפֶץ의 ‘소원/원함’ 범위를 살리되, 솔로몬의 요청 범위를 자연스러운 현대 한국어로 표현했습니다.
theological_decisions:
- issue: 오래된 서술의 시제 처리
  chosen_reading: 과거 완료적 배경 설명 뒤에 주동 사건을 단순 과거로 이어서 옮겼습니다.
  alternative_readings:
  - 배경절을 모두 단순 과거로 처리
  - 한국어 현재완료로 번역
  rationale: 히람의 공급이 솔로몬의 뒤따르는 행위를 앞선 배경으로 제시하므로, 한국어에서는 ‘공급하였으므로’로 배경을 만들고 ‘주었습니다’로 मुख्य 사건을 연결하는 것이 서술 관계를 가장 분명히 보여 줍니다.
  doctrine_reference: 서사 텍스트의 시제-담화 기능
