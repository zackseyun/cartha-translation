  text: Hiram king of Tyre had supplied Solomon with cedar timber[a], cypress timber, and gold, according to all his desire; then King Solomon gave Hiram twenty cities in the land of Galilee.
  footnotes:
  - marker: a
    text: Or 'juniper,' 'fir,' or another conifer; the exact species denoted by Hebrew berosh is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 두로 왕 히람은 솔로몬이 바라는 모든 것에 따라 백향목 목재와 사이프러스[a] 목재와 금을 솔로몬에게 공급했습니다. 그때 솔로몬 왕은 히람에게 갈릴리 땅에 있는 성읍 스무 곳을 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּרוֹשׁ은 정확한 수종이 확정되지 않았습니다. ‘사이프러스’ 외에 ‘노간주나무’, ‘전나무’ 또는 다른 침엽수로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשָּׂא
  english_pob_choice: had supplied
  chosen_korean: 공급하였으므로
  alternatives_korean:
