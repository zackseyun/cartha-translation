    rationale: 원문은 히람의 종들을 솔로몬의 종들과 함께 보냈다고 말하지만, 초안은 ‘자기 종들과 함께 솔로몬의 종들과 함께’라고 하여 문법적으로 어색하고 관계를 흐립니다.
  - severity: medium
    issue: 항해 전문가 표현의 비자연스러움
    rationale: ‘바닷길을 아는 배의 사람들’은 한국어 어법상 어색하며, 원문의 동격 설명도 충분히 전달하지 못합니다.
  revised_text: 히람은 솔로몬의 신하들과 함께 배에 자기 신하들, 곧 바다를 아는 선원들을 보냈습니다.
