  text: And Hiram sent his servants on the ship with Solomon’s servants—men of ships, men who knew the sea.
translation:
  language: ko
  text: 그리고 히람은 자기 종들과 함께 솔로몬의 종들과 함께 배를 타고 가게 했습니다—바닷길을 아는 배의 사람들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 가게 했습니다
  alternatives_korean:
  - 보냈습니다
  - 파견했습니다
  lexicon: WLC
  rationale: 히람이 사람들을 배에 태워 이동시키는 동작을 자연스럽게 드러내되, 단순 전달보다 목적지로 떠나게 하는 뉘앙스를 살렸습니다.
- source_word: עֲבָדָיו / עַבְדֵי שְׁלֹמֹה
  english_pob_choice: his servants / Solomon’s servants
  chosen_korean: 자기 종들 / 솔로몬의 종들
  alternatives_korean:
  - 자기 노예들 / 솔로몬의 노예들
  - 그의 종들 / 솔로몬의 종들
  lexicon: WLC
  rationale: 기본 용례인 종을 따르되, 본문이 봉사 인원을 가리키는 문맥이므로 노예보다 종이 더 직접적입니다.
- source_word: אַנְשֵׁי אֳנִיּוֹת
  english_pob_choice: men of ships
  chosen_korean: 배의 사람들
  alternatives_korean:
  - 배의 사람들
  - 배를 다루는 사람들
  - 선원들
  lexicon: WLC
  rationale: 직역상 ‘배의 사람들’이 가장 가깝지만, 한국어에서 자연스럽게 선원 집단을 가리키는 표현으로 이해되도록 했습니다.
- source_word: יֹדְעֵי הַיָּם
  english_pob_choice: who knew the sea
  chosen_korean: 바닷길을 아는
  alternatives_korean:
  - 바다를 아는
  - 바닷길을 아는
  - 바다에 익숙한
  lexicon: WLC
  rationale: 단순 지식보다 항해 경험과 숙련을 암시하므로 ‘바닷길을 아는’으로 옮겨, 다음 구절의 항해 전문성을 드러냈습니다.
theological_decisions:
- issue: 신학적 쟁점 없이 서술하는 항해 전문 인력의 묘사
  chosen_reading: 이 구절은 히람과 솔로몬의 인력 협력을 통해 해상 운송의 실제성을 보여주는 역사 서술로 읽었습니다.
  alternative_readings:
  - 상징적으로 해석하는 읽기
  - 왕권의 국제성을 강조하는 읽기
  rationale: 본문 자체가 신학적 주장을 직접 펼치기보다, 누구를 어떤 전문성으로 보냈는지 서술합니다.
  doctrine_reference: 서사 본문 해석 원칙
