revisions:
- from: 이들은 솔로몬의 일을 맡은 감독들 가운데 우두머리들입니다. 오백오십 명이었으며, 일을 하는 백성을 다스리고 있었습니다.[a][b]
  to: 이들은 솔로몬을 위한 일을 맡은 감독관들의 상관들이었습니다.[a] 모두 오백오십 명으로, 그 일을 하는 백성을 다스리고 있었습니다.[b]
  rationale: The revision restores the Hebrew construct-chain sense by identifying these 550 persons as the superiors of the overseers, not as leaders among them. It retains the work’s service to Solomon, preserves the stronger governing sense of רדה, and anchors each lexical note to the relevant Korean expression.
  reviewer_model: gpt-5.6-terra
