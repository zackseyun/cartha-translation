  text: אֵ֣לֶּה שָׂרֵ֣י הַ/נִּצָּבִ֗ים אֲשֶׁ֤ר עַל הַ/מְּלָאכָה֙ לִ/שְׁלֹמֹ֔ה חֲמִשִּׁ֖ים וַ/חֲמֵ֣שׁ מֵא֑וֹת הָ/רֹדִ֣ים בָּ/עָ֔ם הָ/עֹשִׂ֖ים בַּ/מְּלָאכָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/023.yaml
  text: 'These were the chief officers of the deputies who were over the work for Solomon: five hundred and fifty[b][a], ruling over the people who were doing the work.'
  footnotes:
  - marker: a
    text: Or 'the overseers' for 'the deputies'; the Hebrew term can denote appointed officials or those set over others.
    reason: lexical_alternative
  - marker: b
    text: Or 'supervising the people who were doing the work'; the verb can denote ruling, having charge, or exercising authority over.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 솔로몬의 일을 맡은 감독들 가운데 우두머리들입니다. 오백오십 명이었으며, 일을 하는 백성을 다스리고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הַנִּצָּבִים는 문맥에 따라 ‘감독들’ 또는 ‘배치된 관리들’처럼 번역될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다스리고 있었습니다’는 ‘감독하고 있었습니다’보다 히브리어 רדה의 직접적인 힘을 더 가깝게 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  english_pob_choice: chief officers
  chosen_korean: 우두머리들
  alternatives_korean:
  - 주요 관리들
  - 수장들
  - 상관들
  lexicon: HALOT
  rationale: 행정적·관리적 우두머리라는 뜻을 살리되, 군사적 뉘앙스가 강한 표현은 피했습니다.
- source_word: הַנִּצָּבִים
  english_pob_choice: the deputies
  chosen_korean: 감독들
  alternatives_korean:
  - 대리들
  - 배치된 자들
  - 감독관들
  lexicon: HALOT
  rationale: 문맥상 공사를 맡아 배정된 하위 관리자들을 가리키므로, 한국어로는 ‘감독들’이 가장 자연스럽고 기능적으로 대응합니다.
- source_word: הָרֹדִים
  english_pob_choice: ruling over
  chosen_korean: 다스리고 있었습니다
  alternatives_korean:
  - 통치하고 있었습니다
  - 주관하고 있었습니다
  - 감독하고 있었습니다
  lexicon: HALOT
  rationale: רדה의 핵심 의미인 ‘다스리다/지배하다’를 살리면서도, 노동 현장 문맥에서 과도하게 정치적으로 들리지 않도록 했습니다.
- source_word: בָּעָם הָעֹשִׂים בַּמְּלָאכָה
  english_pob_choice: the people who were doing the work
  chosen_korean: 일을 하는 백성
  alternatives_korean:
  - 일하는 사람들
  - 공사에 종사하는 백성
  - 노동하는 백성
  lexicon: HALOT
  rationale: ‘백성’과 ‘일하는’의 결합을 유지해 히브리어의 넓은 범주를 보존하고, 뒤의 ‘다스리고 있었습니다’와 함께 자연스러운 한국어가 되게 했습니다.
