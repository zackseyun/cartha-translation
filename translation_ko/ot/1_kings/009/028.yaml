translation:
  language: ko
  text: 그들은 오빌로 가서 그곳에서 금 사백이십 달란트를 가져와 솔로몬 왕에게 전했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가서’에 해당하는 첫 히브리어 동사는 문맥상 ‘그들이 가서’로 옮기는 것이 자연스럽지만, ‘그들이 왔다’로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  english_pob_choice: They went
