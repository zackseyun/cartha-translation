  yaml_path: translation/ot/1_kings/009/028.yaml
  text: They went to Ophir and took from there four hundred and twenty talents of gold[a], and brought it to King Solomon.
  footnotes:
  - marker: a
    text: Or 'They came to Ophir.' The Hebrew verb can be rendered either way, but 'went' fits the narrative viewpoint more naturally in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 오빌로 가서 거기서 금 사백이십 달란트를 가져와 솔로몬 왕에게 가져왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가서’는 이동의 결과를 드러낸 자연스러운 번역입니다. 히브리어 동사는 문맥상 ‘그들이 가서’ 또는 ‘그들이 왔다’로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  english_pob_choice: They went
  chosen_korean: 가서
  alternatives_korean:
  - 갔습니다
  - 왔습니다
  lexicon: HALOT
  rationale: 서술 흐름상 출발·도착의 이동을 자연스럽게 드러내기 위해 ‘가서’로 옮겼습니다. 영어 POB의 ‘went’와 같은 방향성을 유지합니다.
- source_word: אוֹפִירָה
  english_pob_choice: to Ophir
  chosen_korean: 오빌로
  alternatives_korean:
  - 오빌에
  - 오피르로
  lexicon: HALOT
  rationale: 지명 오빌에 방향 접미 성격이 붙은 형태이므로 목적지를 나타내는 조사 ‘-로’를 살렸습니다.
- source_word: אַרְבַּע מֵאוֹת וְעֶשְׂרִים כִּכָּר
  english_pob_choice: four hundred and twenty talents
  chosen_korean: 사백이십 달란트
  alternatives_korean:
  - 420 달란트
  - 사백 스무 달란트
  lexicon: HALOT
  rationale: 히브리어 수량과 도량형을 그대로 반영하되, 문어체에서 자연스러운 ‘사백이십 달란트’로 옮겼습니다.
- source_word: וַיָּבִאוּ אֶל הַמֶּלֶךְ שְׁלֹמֹה
  english_pob_choice: brought it to King Solomon
  chosen_korean: 솔로몬 왕에게 가져왔습니다
  alternatives_korean:
  - 솔로몬 왕에게 가져다주었습니다
  - 왕 솔로몬에게 가져왔습니다
  lexicon: HALOT
  rationale: 히필형 ‘가져오다/가져다주다’의 전달 의미를 살려, 왕의 칭호를 앞세우지 않고도 문맥상 분명하게 표현했습니다.
