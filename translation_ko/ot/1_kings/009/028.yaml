  alternatives_korean:
  - 갔습니다
  - 왔습니다
  lexicon: HALOT
  rationale: 서술 흐름상 출발·도착의 이동을 자연스럽게 드러내기 위해 ‘가서’로 옮겼습니다. 영어 POB의 ‘went’와 같은 방향성을 유지합니다.
- source_word: אוֹפִירָה
  english_pob_choice: to Ophir
  chosen_korean: 오빌로
  alternatives_korean:
  - 오빌에
