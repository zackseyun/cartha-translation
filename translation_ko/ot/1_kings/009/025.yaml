id: 1KI.9.25
reference: 1 Kings 9:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֶעֱלָ֣ה שְׁלֹמֹ֡ה שָׁלֹשׁ֩ פְּעָמִ֨ים בַּ/שָּׁנָ֜ה עֹל֣וֹת וּ/שְׁלָמִ֗ים עַל הַ/מִּזְבֵּ֨חַ֙ אֲשֶׁ֣ר בָּנָ֣ה לַ/יהוָ֔ה וְ/הַקְטֵ֣יר אִתּ֔/וֹ אֲשֶׁ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שִׁלַּ֖ם אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/025.yaml
  text: And Solomon offered up burnt offerings and peace offerings on the altar that he had built for Yahweh three times a year[a], and he burned incense with it before Yahweh[b]. Thus he completed the house.
  footnotes:
  - marker: a
    text: Or 'he made offerings smoke with it'; the Hebrew verb can refer more broadly to turning a sacrifice into smoke, not only to burning incense.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house,' referring to the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 여호와를 위해 그가 지은 제단 위에 번제와 화목제를 해마다 세 번 드렸고, 그 위에 향을 피워 여호와 앞에서 드렸습니다. 이렇게 그는 그 집을 완성했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 제물을 불살라 연기로 올리는 일을 더 넓게 가리킬 수 있으므로, 여기서는 ‘향을 피워’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘그 집’이며, 여기서는 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  english_pob_choice: offered up
  chosen_korean: 드렸고
  alternatives_korean:
  - 바쳤고
  - 올려 드렸고
  lexicon: HALOT
  rationale: 제사 문맥의 히필 עלה는 단순한 ‘하다’보다 제사를 ‘드리다’로 옮기는 것이 한국어에서 자연스럽고, 제의적 헌납의 의미도 살립니다.
- source_word: עֹלוֹת וּשְׁלָמִים
  english_pob_choice: burnt offerings and peace offerings
  chosen_korean: 번제와 화목제
  alternatives_korean:
  - 번제와 화목제물
  - 전번제와 화목제
  lexicon: HALOT
  rationale: 번제와 שלמים는 한국어 성경에서 굳어진 제사 명칭을 따르되, 원문의 제의 범주를 분명히 하기 위해 간결하게 옮겼습니다.
- source_word: וְהַקְטֵיר אִתּוֹ
  english_pob_choice: he burned incense with it
  chosen_korean: 그 위에 향을 피워 … 드렸습니다
  alternatives_korean:
  - 그와 함께 향을 피웠고
  - 그것과 함께 향을 피웠고
  lexicon: HALOT
  rationale: קטר는 문맥상 향을 피우는 행위이지만 더 넓게는 ‘연기로 올리다’도 될 수 있어, POB의 주석 가능성을 반영해 직역적 요소를 살리면서도 한국어로는 자연스럽게 풀었습니다.
- source_word: הַבָּיִת
  english_pob_choice: the house
  chosen_korean: 그 집
  alternatives_korean:
  - 성전
  - 그 성전
  lexicon: HALOT
  rationale: 원문은 직역상 ‘집’이지만, 여기서는 문맥상 성전을 가리키므로 본문에서는 ‘그 집’을 유지하고 완성의 의미를 살렸습니다.
theological_decisions:
- issue: 솔로몬의 제의 수행 주체
  chosen_reading: 본문의 표면적 주어를 따라 솔로몬이 제사 행위를 ‘드렸다’고 옮기되, 그가 직접 제사장 직무를 수행했다는 강한 해석은 덧붙이지 않았습니다.
  alternative_readings:
  - 솔로몬이 제사장들을 시켜 드리게 했다
  - 왕실 후원으로 제사가 시행되었다
  rationale: 히브리어 서술은 왕정 요약체로서 행위의 직접 수행과 승인/주도 사이를 명시적으로 좁히지 않으므로, 본문이 유지하는 긴장을 그대로 보존하는 것이 적절합니다.
  doctrine_reference: 본문의 서술 범위를 넘는 제의 직무 추론을 피함.
