language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִכְרַתִּ֣י אֶת יִשְׂרָאֵ֗ל מֵ/עַ֨ל פְּנֵ֤י הָ/אֲדָמָה֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֨יִת֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אֲשַׁלַּ֖ח מֵ/עַ֣ל פָּנָ֑/י וְ/הָיָ֧ה יִשְׂרָאֵ֛ל לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/007.yaml
  text: then I will cut off Israel from the face of the land that I have given them[a], and the house that I have consecrated for my name I will cast out from before my face[d][c][b], and Israel will become a proverb and a taunt among all peoples.
  footnotes:
  - marker: a
    text: 'Or ''the temple.'' Hebrew: ''the house.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'I will send away from my presence.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a proverb and a byword.'
    reason: lexical_alternative
  - marker: d
    text: '''For my name'' is a Hebrew idiom for what is dedicated to bear and honor God''s name.'
    reason: cultural_note
translation:
  language: ko
  text: 그러면 내가 이스라엘을 내가 그들에게 준 땅 위에서 끊어 버리고, 내 이름을 위하여 내가 거룩하게 한 이 집을 내 앞에서 내쫓을 것이며, 이스라엘은 모든 민족 가운데서 속담거리와 조롱거리가 될 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 문맥상 성전을 가리킵니다. 히브리어는 문자 그대로 ‘집’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 앞에서 내쫓을 것이며’는 ‘내 임재에서 내보내다’의 의미일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘속담거리와 조롱거리’는 ‘속담과 비방거리’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘내 이름을 위하여’는 하나님의 이름을 지니고 영화롭게 하도록 헌납되었다는 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכְרַתִּי
  english_pob_choice: I will cut off
  chosen_korean: 끊어 버리고
  alternatives_korean:
  - 끊어 내고
  - 도려내고
  - 제거하고
  lexicon: HALOT
  rationale: כרת의 심판적·언약적 강도를 살리면서 한국어에서 자연스럽고 단호한 표현으로 옮겼습니다.
- source_word: הָאֲדָמָה אֲשֶׁר נָתַתִּי לָהֶם
  english_pob_choice: the land that I have given them
  chosen_korean: 내가 그들에게 준 땅
  alternatives_korean:
  - 내가 그들에게 준 토지
  - 내가 그들에게 주었던 땅
  lexicon: HALOT
  rationale: 여기서 אֲדָמָה는 계약적 맥락의 ‘땅’이 자연스럽고, 완료된 신적 부여를 현재 완료처럼 자연스럽게 표현했습니다.
- source_word: הַבַּיִת
  english_pob_choice: the house
  chosen_korean: 이 집
  alternatives_korean:
  - 이 성전
  - 그 집
  lexicon: HALOT
  rationale: 원문은 ‘집’이며, 한국어에서도 이를 그대로 살려 하나님의 이름을 위해 구별된 건물이라는 성격을 유지했습니다.
- source_word: לִשְׁמִי
  english_pob_choice: for my name
  chosen_korean: 내 이름을 위하여
  alternatives_korean:
  - 내 이름을 위해
  - 내 이름을 따라
  lexicon: HALOT
  rationale: 히브리어 관용구의 헌납·귀속 의미를 보존하면서도 한국어에서 매끄럽게 읽히도록 ‘위하여’로 옮겼습니다.
- source_word: וְלִשְׁנִינָה
  english_pob_choice: and a taunt
  chosen_korean: 조롱거리
  alternatives_korean:
  - 비웃음거리
  - 멸시거리
  lexicon: HALOT
  rationale: לִשְׁנִינָה의 조롱·비웃음의 뉘앙스를 자연스럽게 전달하는 한국어로, 앞의 ‘속담거리’와 구별되게 했습니다.
theological_decisions:
- issue: 문장에 나타나는 언약 심판의 강도
  chosen_reading: 끊어 버리고
  alternative_readings:
  - 없애 버리고
  - 멸망시키고
  rationale: 본문은 단순한 이동이 아니라 언약 위반에 대한 강한 심판을 말하므로, 완전 파괴로 단정하지 않으면서도 강한 단절의 의미를 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘이름을 위하여’ 구문의 의미
  chosen_reading: 내 이름을 위하여
  alternative_readings:
  - 내 이름을 위해
  - 내 명예를 위해
  rationale: 성전이 하나님의 이름을 지니고 그 이름을 드러내도록 헌납되었다는 성경적 관용구를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
