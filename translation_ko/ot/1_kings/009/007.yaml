  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 הַבַּיִת의 정관사는 지시사 ‘이’보다 문맥 지시의 ‘그’가 더 정확하며, מֵעַל פְּנֵי הָאֲדָמָה는 ‘땅 위에서’보다 ‘땅에서’가 한국어에서 자연스럽게 축출의 뜻을 나타냅니다. 히브리어의 심판, 추방, 조롱의 의미는 유지했습니다.
  naturalness: 현 문장은 이해되지만, 하나님의 미래 선언 안에서 ‘끊어 버리고’와 ‘내쫓을 것이며’의 연결은 다소 비대칭적입니다. 모든 절을 미래 선언으로 정렬하고 각주 표지를 해당 어구에 붙이면 현대 표준어 합쇼체로 더 명료하고 자연스럽습니다.
