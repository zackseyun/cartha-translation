  text: וְ/הִכְרַתִּ֣י אֶת יִשְׂרָאֵ֗ל מֵ/עַ֨ל פְּנֵ֤י הָ/אֲדָמָה֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֨יִת֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אֲשַׁלַּ֖ח מֵ/עַ֣ל פָּנָ֑/י וְ/הָיָ֧ה יִשְׂרָאֵ֛ל לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/007.yaml
  text: then I will cut off Israel from the face of the land that I have given them[a], and the house that I have consecrated for my name I will cast out from before my face[d][c][b], and Israel will become a proverb and a taunt among all peoples.
  footnotes:
  - marker: a
    text: 'Or ''the temple.'' Hebrew: ''the house.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'I will send away from my presence.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a proverb and a byword.'
    reason: lexical_alternative
  - marker: d
    text: '''For my name'' is a Hebrew idiom for what is dedicated to bear and honor God''s name.'
    reason: cultural_note
translation:
  language: ko
  text: 그러면 내가 이스라엘을 내가 그들에게 준 땅에서 끊어 버릴 것이며, 내 이름을 위하여 거룩하게 구별한 그 집[a][d]을 내 앞에서 내쫓을 것이며[b], 이스라엘은 모든 민족 가운데서 속담거리와 조롱거리가 될 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 문맥상 성전을 가리킵니다. 히브리어는 문자 그대로 ‘집’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 임재에서 내보내겠다.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘속담과 비웃음거리.’
    reason: lexical_alternative
  - marker: d
    text: ‘내 이름을 위하여’는 하나님의 이름을 지니고 영화롭게 하도록 헌납되었다는 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכְרַתִּי
  english_pob_choice: I will cut off
  chosen_korean: 끊어 버리고
  alternatives_korean:
