  text: And Hiram sent to the king one hundred and twenty talents of gold[a][b].
  footnotes:
  - marker: a
    text: A talent was a large unit of weight; the phrase refers to one hundred and twenty talents' worth of gold.
    reason: cultural_note
  - marker: b
    text: Or 'to King Solomon'; the Hebrew says simply 'to the king.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 히람이 왕에게 금 백이십 달란트를 보냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 달란트는 고대의 큰 중량 단위이며, 여기서는 금 백이십 달란트어치를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘솔로몬 왕에게’. 히브리어 본문은 단순히 ‘왕에게’라고 되어 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 전달했습니다
  - 보내었습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 드러내는 단순 과거로 옮겼습니다.
- source_word: לַמֶּלֶךְ
  english_pob_choice: to the king
  chosen_korean: 왕에게
  alternatives_korean:
  - 솔로몬 왕에게
  - 그 왕에게
  lexicon: HALOT
  rationale: 히브리어는 정관사만 있는 ‘왕에게’로 말하고 있으므로, 본문은 그 표현을 유지하고 문맥상 솔로몬을 가리키는 정보는 본문 밖으로 두었습니다.
- source_word: מֵאָה וְעֶשְׂרִים
  english_pob_choice: one hundred and twenty
  chosen_korean: 백이십
  alternatives_korean:
  - 백스무
  - '120'
  lexicon: HALOT
  rationale: 수량 표현은 현대 한국어에서 가장 자연스러운 한자어 수사로 옮겼습니다.
- source_word: כִּכַּר
  english_pob_choice: talents
  chosen_korean: 달란트
  alternatives_korean:
  - 재능
  - 탈렌트
  lexicon: HALOT
  rationale: כִּכָּר는 고대 중량 단위이므로 관용적으로 ‘달란트’로 옮겼고, 금의 양을 나타내는 단위로 이해하도록 했습니다.
theological_decisions:
- issue: 히브리어의 무관사 표현 לַמֶּלֶךְ 를 본문에 어떻게 반영할지
  chosen_reading: 본문은 ‘왕에게’로 두고, 대상이 솔로몬임은 각주로 처리합니다.
  alternative_readings:
  - ‘솔로몬 왕에게’로 본문에 명시
  - ‘그 왕에게’로 더 일반화
  rationale: 원문은 단순히 ‘왕’이라고만 하며, 영어 POB도 본문에서는 이를 보존하고 대안 독법을 각주로 달았습니다. 본문에서 고유명을 덧붙이면 소스의 절제된 표현을 넘어서게 됩니다.
  doctrine_reference: 본문 충실성과 최소 개입 원칙
- issue: כִּכַּר 의 문화적 단위를 한국어 독자가 이해하도록 할지
  chosen_reading: ‘달란트’로 번역하고 각주로 고대 중량 단위임을 밝혔습니다.
  alternative_readings:
  - ‘탈렌트’로 음역
  - ‘약 34킬로그램’처럼 환산
  rationale: 영어 POB가 cultural note를 두었으므로, 한국어도 단위의 성격을 유지하면서 환산 대신 원문 단위를 보존하는 편이 소스-직결적입니다.
  doctrine_reference: 문화적 배경 주석 원칙
