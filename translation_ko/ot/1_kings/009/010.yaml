translation:
  language: ko
  text: 솔로몬이 두 집, 곧 여호와의 집과 왕의 집을 건축해 온 이십 년이 끝났을 때에, 이런 일이 있었습니다.[a][b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이십 년이 끝났을 때에’는 히브리어 관용구로, ‘이십 년이 지난 뒤’ 또는 ‘이십 년이 끝난 후’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두 집’은 곧 여호와의 집과 왕의 집을 가리킵니다.
    reason: lexical_alternative
