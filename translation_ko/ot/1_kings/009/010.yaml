  text: And it happened at the end of twenty years[b][a], in which Solomon had built the two houses—the house of Yahweh and the king's house—
  footnotes:
  - marker: a
    text: Or 'after twenty years.' The Hebrew idiom marks the completion of a twenty-year period.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the two houses,' namely, the house of the LORD and the king's house.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 일이, 솔로몬이 두 집—곧 여호와의 집과 왕의 집—을 건축한 이십 년의 끝에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이십 년의 끝에’는 히브리어 관용구로, ‘이십 년이 지난 뒤’ 또는 ‘이십 년이 끝난 후’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두 집’은 곧 여호와의 집과 왕의 집을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 그 일이 있었습니다
  alternatives_korean:
  - 그 일이 있었습니다
  - 그리고 일이 있었습니다
  lexicon: HALOT
  rationale: 서술 전환을 나타내는 וַיְהִי의 담화 기능을 살리면서, 현대 한국어에서는 ‘그리고 그 일이 있었습니다’가 자연스럽고 문어체에 맞습니다.
- source_word: מִקְצֵה עֶשְׂרִים שָׁנָה
  english_pob_choice: at the end of twenty years
  chosen_korean: 이십 년의 끝에
  alternatives_korean:
  - 이십 년이 끝날 무렵에
  - 이십 년 후에
  lexicon: HALOT
  rationale: מִן + קֵץ/קָצֶה 관용구는 기간의 완료 지점을 가리키므로, ‘이십 년의 끝에’가 원문의 시점 완료성을 가장 직접적으로 반영합니다.
- source_word: שְׁנֵי הַבָּתִּים
  english_pob_choice: the two houses
  chosen_korean: 두 집
  alternatives_korean:
  - 두 건물
  - 두 집들
  lexicon: HALOT
  rationale: בַּיִת의 직역을 유지해 뒤의 병치 설명(여호와의 집, 왕의 집)과 어휘적 연결을 보존했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 여호와의 집
  alternatives_korean:
  - 야훼의 집
  - 주님의 집
  lexicon: HALOT
  rationale: 히브리어의 소유격 구조를 그대로 살려 ‘여호와의 집’으로 옮겼습니다. 본 프로젝트의 구약 본문에서는 יְהוָה를 ‘여호와’로 표기하는 관행을 따릅니다.
- source_word: בֵּית הַמֶּלֶךְ
  english_pob_choice: the king's house
  chosen_korean: 왕의 집
  alternatives_korean:
  - 왕궁
  - 왕의 궁전
  lexicon: HALOT
  rationale: 원문과 영어 POB의 병행 구조를 보존하기 위해 ‘왕의 집’으로 옮겼습니다. ‘왕궁’은 의미는 자연스럽지만 원문 어휘 대응이 더 약합니다.
theological_decisions:
- issue: 여호와의 이름을 어떻게 표기할지
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - 주
  rationale: 본문은 YHWH를 직접 사용하므로, 병행 구조와 전통적 한국어 성경 가독성을 고려해 ‘여호와’로 표기했습니다. 여기서는 인용이나 신약의 야훼 인용 문제가 아니라 구약 서술 본문입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
