  source_fidelity: 히브리어 מִקְצֵה עֶשְׂרִים שָׁנָה는 이십 년 기간의 완료 시점을 가리킵니다. 초안의 ‘이십 년의 끝에’는 직역적이지만 현대 한국어에서는 부자연스럽고, ‘솔로몬이 … 건축한 이십 년’도 관계절의 범위가 다소 불명확합니다. וַיְהִי는 다음 절로 이어지는 서술 전환이므로 ‘이런 일이 있었습니다’로 자연스럽게 옮기되, 원문의 미완결 연결을 긴 줄표로 나타내는 것이 적절합니다.
