id: 1KI.9.3
reference: 1 Kings 9:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו שָׁ֠מַעְתִּי אֶת תְּפִלָּתְ/ךָ֣ וְ/אֶת תְּחִנָּתְ/ךָ֮ אֲשֶׁ֣ר הִתְחַנַּ֣נְתָּה לְ/פָנַ/י֒ הִקְדַּ֗שְׁתִּי אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר בָּנִ֔תָה לָ/שֽׂוּם שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/003.yaml
  text: And Yahweh said to him[a], “I have heard your prayer and your plea for favor that you made before me. I have consecrated this house that you built, to put my name there forever[c][b], and my eyes and my heart will be there all the days.”
  footnotes:
  - marker: a
    text: Or 'your supplication' or 'your entreaty' for תְּחִנָּה, a humble plea for favor.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'this house'; that is, the temple Solomon built.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'my eyes and my heart will be there all the days,' an anthropomorphic expression for the LORD's ongoing attention and concern.
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 그에게 말씀하셨습니다. “나는 네가 내 앞에서 드린 네 기도와 네 간구를 들었습니다. 나는 네가 건축한 이 집[a]을, 내 이름을 그곳에 영원히 두기 위하여 거룩하게 구별하였습니다. 내 눈과 내 마음[b]이 그곳에 언제나 있을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘이 집’은 솔로몬이 건축한 성전을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘내 눈과 내 마음’은 하나님의 지속적인 관심과 돌보심을 나타내는 의인적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 프로젝트 기본값
  rationale: 원문 고유명사인 야훼를 음역하여 하나님의 이름을 드러내며, 본 프로젝트의 기본 표기와도 일치합니다.
- source_word: תְּפִלָּתְךָ
  english_pob_choice: your prayer
  chosen_korean: 네 기도
  alternatives_korean:
  - 네 간구
  - 네 청원
  lexicon: HALOT
  rationale: תְּפִלָּה는 일반적인 기도이므로 한국어도 가장 직접적인 ‘기도’로 옮겼습니다.
- source_word: תְּחִנָּתְךָ / הִתְחַנַּנְתָּה
  english_pob_choice: your plea for favor / that you made
  chosen_korean: 네 간구
  alternatives_korean:
  - 네 간청
  - 네 청원
  - 네가 애원한 것
  lexicon: HALOT
  rationale: 같은 어근이 만드는 ‘은혜를 구하는 간청’의 뉘앙스를 살리기 위해 두 번째 항목을 ‘간구’로 받아, 기도와의 구별을 유지했습니다.
- source_word: הִקְדַּשְׁתִּי
  english_pob_choice: I have consecrated
  chosen_korean: 거룩하게 구별하여
  alternatives_korean:
  - 성별하여
  - 봉헌하여
  - 거룩하게 하여
  lexicon: HALOT
  rationale: קדש의 핵심은 ‘거룩한 용도로 따로 떼어 놓음’이므로, 현대 한국어에서 그 기능을 가장 분명히 드러내는 표현으로 옮겼습니다.
- source_word: לָשׂוּם שְׁמִי שָׁם
  english_pob_choice: to put my name there
  chosen_korean: 내 이름을 거기에 두려고
  alternatives_korean:
  - 내 이름을 거기에 두기 위해
  - 내 이름이 거기에 있게 하려고
  lexicon: HALOT
  rationale: 성전-이름 공식의 문구를 유지해, 하나님의 이름이 그곳에 ‘두어진다’는 언약적 표현을 보존했습니다.
- source_word: עֵינַי וְלִבִּי
  english_pob_choice: my eyes and my heart
  chosen_korean: 내 눈과 내 마음
  alternatives_korean:
  - 내 눈과 내 심장
  - 내 관심과 내 마음
  lexicon: HALOT
  rationale: 하나님의 지속적 돌봄과 관심을 나타내는 의인적 표현을 그대로 살렸습니다.
theological_decisions:
- issue: 하나님의 눈과 마음을 문자적으로 옮기는가
  chosen_reading: 의인적 표현을 그대로 유지해 ‘내 눈과 내 마음’으로 번역했습니다.
  alternative_readings:
  - 내 관심과 돌봄
  - 내 주의와 애정
  rationale: 히브리어는 하나님의 지속적 주의를 몸의 언어로 표현합니다. 이를 풀어 쓰면 이미지의 신학적 밀도가 약해지므로, 긴장을 해소하지 않고 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: 신학적 긴장 보존'
- issue: ‘내 이름을 거기에 두다’의 성전 의미
  chosen_reading: 도시나 제의 일반론으로 바꾸지 않고 이름-성전 공식을 유지했습니다.
  alternative_readings:
  - 거기서 예배받으려고
  - 거기 거주하려고
  rationale: 원문은 하나님 자신이 아니라 ‘이름’을 두는 언약적 표현을 사용합니다. 이를 보존해야 성전 신학과 원문의 뉘앙스가 살아납니다.
  doctrine_reference: 'Translation philosophy §1: 원어 우선'
