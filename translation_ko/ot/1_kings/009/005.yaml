  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲקִ֨מֹתִ֜י אֶת כִּסֵּ֧א מַֽמְלַכְתְּ/ךָ֛ עַל יִשְׂרָאֵ֖ל לְ/עֹלָ֑ם כַּ/אֲשֶׁ֣ר דִּבַּ֗רְתִּי עַל דָּוִ֤ד אָבִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מֵ/עַ֖ל כִּסֵּ֥א יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/005.yaml
  text: then I will establish the throne of your kingdom over Israel forever, just as I spoke concerning David your father, saying, ‘A man of yours will not be cut off from the throne of Israel.’
translation:
  language: ko
  text: 그러면 내가 너의 왕국의 왕좌를 이스라엘 위에 영원히 견고히 세울 것이며, 내가 네 아버지 다윗에게 말한 것처럼, ‘네게 속한 한 사람이 이스라엘의 왕좌에서 끊어지지 않을 것이다.’
  philosophy: formal
lexical_decisions:
- source_word: וַהֲקִמֹתִי / establish
  english_pob_choice: I will establish
  chosen_korean: 견고히 세울 것입니다
  alternatives_korean:
  - 세울 것입니다
  - 확립할 것입니다
  lexicon: הקים
  rationale: 단순한 ‘세우다’보다 왕조의 지속성을 드러내는 ‘견고히 세우다’가 문맥상 적절하며, 왕좌를 지탱해 계속되게 한다는 의미를 살립니다.
- source_word: כִּסֵּא מַמְלַכְתְּךָ
  english_pob_choice: the throne of your kingdom
  chosen_korean: 너의 왕국의 왕좌
  alternatives_korean:
  - 네 나라의 왕좌
  - 네 왕조의 왕좌
  lexicon: כִּסֵּא + מַמְלָכָה
  rationale: ‘왕좌’는 כסא를 직접 반영하고, ‘왕국’은 מַמְלָכָה의 기본 의미를 살린 표현입니다. ‘왕조’는 의미를 좁힐 수 있어 기본적으로 피했습니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영구히
  - 끝없이
  lexicon: לְעוֹלָם
  rationale: 시간적 지속의 일반적 의미를 가장 자연스럽게 옮겼습니다.
- source_word: אִישׁ מֵעַל כִּסֵּא יִשְׂרָאֵל
  english_pob_choice: A man of yours will not be cut off from the throne of Israel
  chosen_korean: 네게 속한 한 사람이 이스라엘의 왕좌에서 끊어지지 않을 것이다
  alternatives_korean:
  - 네 사람 중 하나가 이스라엘의 왕좌에서 끊기지 않을 것이다
  - 이스라엘의 왕좌에서 네 사람의 계보가 끊어지지 않을 것이다
  lexicon: אִישׁ + כרת
  rationale: POB의 개정된 ‘A man of yours’는 소유/귀속을 드러내므로 ‘네게 속한 한 사람’으로 옮겼고, כרת의 수동적 결과를 ‘끊어지지 않을 것이다’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 다윗 언약의 조건부 서술과 지속성 강조
  chosen_reading: 하나님이 솔로몬에게 왕좌의 영속성을 약속하되, 다윗에게 하신 약속을 근거로 제시하는 문장으로 옮겼습니다.
  alternative_readings:
  - 단순 역사 예고로만 읽기
  - 왕조 보장만 강조하기
  rationale: 본문은 언약적 약속의 지속성을 강조하므로, ‘영원히’와 ‘끊어지지 않을 것이다’의 병치를 유지했습니다.
  doctrine_reference: 다윗 언약 / 사무엘하 7장
