reference: 1 Kings 16:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב בַּעְשָׁא֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֖ר בְּ/תִרְצָ֑ה וַ/יִּמְלֹ֛ךְ אֵלָ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/006.yaml
  text: Baasha slept with his fathers and was buried in Tirzah[a], and Elah his son reigned in his place.
  footnotes:
  - marker: a
    text: Or 'with his ancestors.' The Hebrew idiom 'slept with his fathers' is a conventional formula for a king's death.
    reason: lexical_alternative
translation:
  language: ko
  text: 바아사는 그의 조상들과 함께 잠들었고[a], 디르사에 묻혔으며, 그의 아들 엘라가 그를 이어 왕이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조상들과 함께 잠들다’는 히브리어에서 왕의 죽음을 알리는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 잠들고
  alternatives_korean:
  - 누워
  - 죽고
  lexicon: HALOT
  rationale: 왕의 부고 공식에서 ‘잠들다’는 히브리어 관용구를 그대로 살리면서 죽음을 완곡하게 드러내므로, 단순한 ‘죽다’보다 원문 형식을 더 잘 보존합니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 문자적으로는 ‘아버지들’이지만, 한국어에서는 족보적·왕조적 관용을 살리기 위해 ‘조상들’이 자연스럽고, 장례/사망 공식의 뜻도 더 분명히 드러냅니다.
- source_word: בְּתִרְצָה
  english_pob_choice: in Tirzah
  chosen_korean: 디르사에
  alternatives_korean:
  - 디르사에서
  - 디르사로
  lexicon: HALOT
  rationale: 도시명 앞 ב는 장소를 나타내므로 한국어에서는 처소 부사격 ‘-에’가 가장 자연스럽습니다. 지명은 음역해 표기했습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: reigned ... in his place
  chosen_korean: 그의 자리를 이어 다스렸습니다
  alternatives_korean:
  - 그를 대신해 다스렸습니다
  - 그의 뒤를 이어 왕이 되었습니다
  lexicon: HALOT
  rationale: 왕위 계승 공식에서 תַּחַת은 단순한 시간적 ‘뒤에’보다 ‘대신하여/이어’의 교체 의미가 핵심이므로, 한국어에서도 succession의 뜻을 분명히 살렸습니다.
theological_decisions:
- issue: 왕의 죽음 서술에서 관용구를 직역할지 의미화할지
  chosen_reading: ‘잠들고’로 유지해 히브리어 왕조 부고 공식의 관용성을 보존했습니다.
  alternative_readings:
  - ‘죽고’로 의미화
  - ‘세상을 떠나고’로 완화
  rationale: 본문은 단순 사망 통보가 아니라 열왕기의 반복되는 공식 표현이므로, 관용구 자체를 유지하는 것이 원문 청취 효과를 가장 잘 보존합니다.
  doctrine_reference: 문학적-서술적 관용구 보존
- issue: 계승 표현 תַּחְתָּיו의 번역
  chosen_reading: ‘그의 자리를 이어 다스렸습니다’로 번역해 왕위 교체의 의미를 드러냈습니다.
  alternative_readings:
  - ‘그의 뒤를 이어’
  - ‘그를 대신하여’
  rationale: 열왕기 연대기 문맥에서 תַּחַת은 정권/왕위의 교체를 뜻하므로, 단순한 순서상 ‘뒤’를 넘어 실제 계승을 명시하는 것이 문맥상 적절합니다.
  doctrine_reference: 왕조 계승 서술
