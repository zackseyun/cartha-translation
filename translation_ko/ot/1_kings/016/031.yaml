  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִי֙ הֲ/נָקֵ֣ל לֶכְתּ֔/וֹ בְּ/חַטֹּ֖אות יָרָבְעָ֣ם בֶּן נְבָ֑ט וַ/יִּקַּ֨ח אִשָּׁ֜ה אֶת אִיזֶ֗בֶל בַּת אֶתְבַּ֨עַל֙ מֶ֣לֶךְ צִידֹנִ֔ים וַ/יֵּ֨לֶךְ֙ וַֽ/יַּעֲבֹ֣ד אֶת הַ/בַּ֔עַל וַ/יִּשְׁתַּ֖חוּ לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/031.yaml
  text: And as if it were a light thing for him to walk in the sins of Jeroboam son of Nebat[a], he took Jezebel daughter of Ethbaal, king of the Sidonians, as his wife, and went and served Baal and bowed down to him.
  footnotes:
  - marker: a
    text: Or, 'Was it a trivial thing for him to walk in the sins of Jeroboam son of Nebat...?' The Hebrew opening is idiomatic and rhetorically emphasizes that Ahab treated those sins as insignificant.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 느밧의 아들 여로보암의 죄 가운데로 가는 것이 오히려 가벼운 일인 듯하였으며, 시돈 왕 엣바알의 딸 이세벨을 아내로 맞이하고 가서 바알을 섬기며 그에게 절하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘느밧의 아들 여로보암의 죄 가운데로 가는 것이 하찮은 일이었습니까?’ 히브리어 첫머리는 관용적 표현으로, 아합이 그 죄들을 대수롭지 않게 여겼음을 수사적으로 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָקֵל
  english_pob_choice: as if it were a light thing
  chosen_korean: 오히려 가벼운 일인 듯하였으며
  alternatives_korean:
  - 그것이 하찮은 일이었던 것처럼
  - 그에게는 너무도 가벼운 일이었던 듯하였으며
  lexicon: HALOT
  rationale: 의문형 관용구의 수사적 뉘앙스를 살려, 여로보암의 죄를 대수롭지 않게 여겼다는 평가를 자연스럽게 드러냈습니다.
- source_word: לֶכְתּוֹ בְּחַטֹּאות
  english_pob_choice: for him to walk in the sins
  chosen_korean: 죄 가운데로 가는 것
  alternatives_korean:
  - 죄들 안에서 걷는 것
  - 죄 가운데 행하는 것
  lexicon: HALOT
  rationale: הלך + ב의 행위 관용을 한국어에서 자연스러운 ‘가다’로 옮기되, 단순 이동이 아니라 죄의 길을 따른다는 뜻을 살렸습니다.
- source_word: וַיִּקַּח אִשָּׁה אֶת אִיזֶבֶל
  english_pob_choice: he took Jezebel ... as his wife
  chosen_korean: 이세벨을 아내로 맞이하고
  alternatives_korean:
  - 이세벨을 아내로 삼고
  - 이세벨과 결혼하고
  lexicon: HALOT
  rationale: 히브리어의 ‘취하다’ 구조를 유지하면서도 한국어에서 혼인 관계를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: וַיַּעֲבֹד אֶת הַבַּעַל
  english_pob_choice: served Baal
  chosen_korean: 바알을 섬기며
  alternatives_korean:
  - 바알을 섬겼고
  - 바알을 예배하며
  lexicon: HALOT
  rationale: עבד의 제의적 의미를 ‘섬기다’로 살려, 다음 절의 ‘절하다’와 구별되게 했습니다.
- source_word: וַיִּשְׁתַּחוּ לֽוֹ
  english_pob_choice: bowed down to him
  chosen_korean: 그에게 절하였습니다
  alternatives_korean:
  - 그에게 엎드려 절하였습니다
  - 그를 경배하였습니다
  lexicon: HALOT
  rationale: 신체적 굴복 동작을 분명히 하기 위해 ‘경배’보다 ‘절하다’를 택했고, 대상 대명사는 한국어에서 자연스럽게 ‘그에게’로 풀었습니다.
theological_decisions:
- issue: 아합의 죄가 여로보암의 죄보다 더 나아간 것으로 제시되는 수사
  chosen_reading: 첫 절을 ‘가벼운 일인 듯하였으며’로 옮겨, 여로보암의 죄를 하찮게 여긴 뒤 바알 숭배로 더 나아가는 흐름을 드러냈습니다.
  alternative_readings:
  - 보다 평면적으로 ‘여로보암의 죄 가운데로 가는 것이 쉬운 일이었다’로 옮길 수 있습니다.
  rationale: 열왕기 서술의 평가적 뉘앙스를 보존해야 하므로, 단순한 용이함이 아니라 죄를 가볍게 여긴 태도를 반영했습니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
