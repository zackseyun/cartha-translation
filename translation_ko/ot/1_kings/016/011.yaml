base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/011.yaml
  text: And it happened that when he became king[a], as soon as he sat on his throne, he struck down all the house of Baasha. He did not leave him a single male[b], or any of his kinsmen or his friends.
  footnotes:
  - marker: a
    text: Hebrew literally, 'one who urinates against a wall,' a coarse idiom meaning 'male.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his avengers' or 'his redeemers'; the Hebrew term refers to a kinsman with family obligations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 왕이 되어 왕좌에 앉자마자 바아사의 온 집안을 쳐서 멸하고, 바아사에게 남자 하나도[a], 그의 친족도[b], 그의 친구도 남기지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘담에 대고 소변을 보는 자’라는 거친 관용구이며, 남자를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 보복자들’ 또는 ‘그의 구속자들’. 히브리어는 가족 의무를 지닌 친족을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְמָלְכוֹ כְּשִׁבְתּוֹ עַל כִּסְאוֹ
  english_pob_choice: And it happened that when he became king, as soon as he sat on his throne
  chosen_korean: 그가 왕이 되자, 곧 왕좌에 앉은 즉시
  alternatives_korean:
  - 그가 왕이 되었을 때, 왕좌에 앉자마자
  - 그가 왕위에 오르자마자
  lexicon: HALOT
  rationale: 접속적 서술 흐름과 즉각성을 함께 살리기 위해 ‘왕이 되자’와 ‘곧 … 즉시’를 사용해 원문의 시간 전개를 드러냈습니다.
- source_word: הִכָּה אֶת כָּל בֵּית בַּעְשָׁא
  english_pob_choice: he struck down all the house of Baasha
  chosen_korean: 그는 바아사의 온 집안을 쳐서 멸하였고
  alternatives_korean:
  - 그는 바아사의 온 집안을 쳤고
  - 그는 바아사의 온 집안을 죽였고
  lexicon: HALOT
  rationale: ‘집’은 왕조/가문을 뜻하므로 ‘온 집안’으로 살리고, 군사적·치명적 폭력을 반영하기 위해 ‘쳐서 멸하다’로 옮겼습니다.
- source_word: מַשְׁתִּין בְּקִיר
  english_pob_choice: a single male
  chosen_korean: 한 명의 남자도
  alternatives_korean:
  - 담에 오줌 누는 사람 한 명도
  - 남자 하나도
  lexicon: HALOT
  rationale: 원문은 남성을 가리키는 거친 관용구이므로 본문에서는 ‘한 명의 남자도’로 자연스럽게 옮기되, 문체를 해치지 않는 범위에서 성별 참조를 유지했습니다.
- source_word: וְגֹאֲלָי/ו
  english_pob_choice: his kinsmen
  chosen_korean: 그의 친족도
  alternatives_korean:
  - 그의 혈족도
  - 그의 구속자도
  lexicon: HALOT
  rationale: גאל의 가족 의무를 지닌 친족 개념을 한국어에서 가장 무리 없이 드러내기 위해 ‘친족’으로 옮겼습니다.
theological_decisions:
- issue: 멸절 서술의 강도
  chosen_reading: 본문의 잔혹한 왕조 숙청을 완화하지 않고 ‘쳐서 멸하다’로 직접 옮겼습니다.
  alternative_readings:
  - 부드럽게 ‘없애다’로 완화하기
  - 단순히 ‘죽이다’로 축소하기
  rationale: 열왕기의 정치·신학적 심판 서술을 흐리지 않기 위해, 원문의 폭력성과 전면성을 드러내는 표현을 유지했습니다.
  doctrine_reference: 열왕기서의 왕조 심판 서술과 언약적 역사 이해
- issue: 가문 전체와 관계망의 소멸
  chosen_reading: ‘친족’과 ‘친구’는 단순한 개인 관계가 아니라 가문과 지지망의 제거를 뜻하는 것으로 읽었습니다.
  alternative_readings:
  - 단순한 사적 인간관계로만 이해하기
  - 법정적 보복 개념만 강조하기
  rationale: 문맥상 바아사의 왕조 기반을 완전히 제거하는 장면이므로, 관계망까지 포함하는 폭넓은 소멸로 반영했습니다.
  doctrine_reference: 왕조 서술과 언약적 심판의 역사성
