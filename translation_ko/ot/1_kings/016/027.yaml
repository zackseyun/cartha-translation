  text: וְ/יֶ֨תֶר דִּבְרֵ֤י עָמְרִי֙ אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְבוּרָת֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/027.yaml
  text: Now the rest of the acts of Omri[a], what he did[b], and his might that he showed—are they not written in the Book of the Chronicles of the Kings of Israel?
  footnotes:
  - marker: a
    text: Or 'and his mighty deeds.' The Hebrew גְּבוּרָה can refer either to might/strength or to acts that display such might.
    reason: lexical_alternative
  - marker: b
    text: '''The Book of the Chronicles of the Kings of Israel'' refers to a royal annalistic source, not the biblical book of Chronicles.'
    reason: cultural_note
translation:
  language: ko
  text: 오므리의 나머지 행적, 곧 그가 행한 일과 그가 드러낸 힘[a]은 이스라엘 왕들의 역대기[b]에 기록되어 있지 않습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘힘’으로 번역한 히브리어 גְּבוּרָה는 힘이나 위력을 뜻할 수 있으며, 문맥에 따라 그러한 힘을 드러낸 용맹한 행위나 무공을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 왕들의 역대기’는 성경의 역대기를 가리키는 것이 아니라, 이스라엘 왕들에 관한 왕실 연대기 자료를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  english_pob_choice: Now the rest of the acts of
  chosen_korean: 이제 …의 나머지 업적
  alternatives_korean:
  - 그리고 …의 나머지 일들
  - …의 남은 일들
  - …의 나머지 행적
  lexicon: HALOT
  rationale: 왕의 연대기 공식에서 יֶתֶר דִּבְרֵי는 단순한 ‘말들’이 아니라 기록된 나머지 업적을 가리키므로, 자연스러운 현대 한국어로 ‘나머지 업적’이 가장 가깝습니다.
- source_word: אֲשֶׁר עָשָׂה
  english_pob_choice: what he did
  chosen_korean: 그가 행한 일
  alternatives_korean:
  - 그가 한 것
  - 그가 했던 일
  - 그가 한 행위
  lexicon: HALOT
  rationale: 반복되는 עָשָׂה를 한국어에서 평이하면서도 공식문체에 맞게 ‘행한 일’로 옮겨, 앞의 ‘업적’과 중복되지 않게 했습니다.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  english_pob_choice: and his might that he showed
  chosen_korean: 그리고 그가 나타낸 그의 용맹
  alternatives_korean:
  - 그리고 그의 용맹
  - 그리고 그가 보여 준 그의 용맹
  - 그리고 그가 드러낸 그의 힘
  lexicon: HALOT
  rationale: גְּבוּרָה는 ‘힘’일 수도 있으나, 여기서는 왕의 전승적 공식에서 두드러진 용맹/무공을 가리키므로 ‘용맹’으로 옮기고, 뒤의 관계절을 ‘나타낸’으로 반영했습니다.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  english_pob_choice: the Book of the Chronicles of the Kings of Israel
  chosen_korean: 이스라엘 왕들의 역대기
  alternatives_korean:
  - 이스라엘 왕들의 사적
  - 이스라엘 왕들의 연대기
  - 이스라엘 왕들의 일지
  lexicon: HALOT
  rationale: דִּבְרֵי הַיָּמִים은 문맥상 왕실 연대기/기록물을 가리키므로, 정전 ‘역대기’와 혼동되지 않게 하면서도 기능적으로는 ‘역대기’가 가장 간결합니다.
