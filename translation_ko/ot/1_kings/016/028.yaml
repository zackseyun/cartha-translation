theological_decisions:
- issue: ‘sleeped with his fathers’ 관용구의 죽음 완곡 표현 유지
  chosen_reading: 직역된 완곡 표현 ‘그의 조상들과 함께 잠들었고’를 유지했습니다.
  alternative_readings:
  - ‘죽었고’로 의미만 풀어 쓰는 방식
  - ‘잠자리에 들었고’처럼 더 완화하는 방식
  rationale: 본문의 왕조 공식이 반복되는 관용구이므로, 의미를 풀어버리기보다 히브리어 표현의 형식을 보존하는 것이 서술의 신학적·문학적 기능을 더 잘 드러냅니다.
  doctrine_reference: 왕조 연대기 공식과 죽음의 완곡어법
- issue: 승계 공식에서 ‘왕이 되었습니다’의 명시
  chosen_reading: ‘아합이 그의 뒤를 이어 왕이 되었습니다’로 왕위 승계를 분명히 했습니다.
  alternative_readings:
  - ‘다스렸습니다’만 쓰는 방식
  - ‘즉위했습니다’로 옮기는 방식
  rationale: 히브리어 וַיִּמְלֹךְ는 단순 통치보다 왕위 계승의 서술로 기능하므로, 독자가 왕조 전환을 즉시 이해하도록 명시했습니다.
  doctrine_reference: 왕조 계승 서술
