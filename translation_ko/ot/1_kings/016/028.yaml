  text: And Omri slept with his fathers and was buried in Samaria[a], and Ahab his son reigned in his place.
  footnotes:
  - marker: a
    text: Hebrew 'slept with his fathers,' a conventional expression for death in the royal narratives.
    reason: lexical_alternative
translation:
  language: ko
  text: 오므리가 그의 조상들과 함께 잠들었고 사마리아에 장사되었으며, 그의 아들 아합이 그의 뒤를 이어 왕이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그의 조상들과 함께 잠들다’는 왕조 서술에서 죽음을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עָמְרִי עִם אֲבֹתָיו
  english_pob_choice: slept with his fathers
  chosen_korean: 그의 조상들과 함께 잠들었고
  alternatives_korean:
  - 그의 조상들과 함께 누웠고
  - 그의 조상들과 함께 죽었고
  lexicon: HALOT
  rationale: 왕조 서술에서 ‘잠들다’는 히브리어 관용구를 살리면서 죽음을 완곡하게 드러내는 표현입니다.
- source_word: וַיִּקָּבֵר בְּשֹׁמְרוֹן
  english_pob_choice: was buried in Samaria
  chosen_korean: 사마리아에 장사되었으며
  alternatives_korean:
  - 사마리아에 묻혔으며
  - 사마리아에 안장되었으며
  lexicon: HALOT
  rationale: נִקְבַּר는 수동의 ‘장사되다/묻히다’로 자연스럽게 옮길 수 있으며, 왕실 서술의 격식을 고려해 ‘장사되다’를 택했습니다.
- source_word: וַיִּמְלֹךְ אַחְאָב בְּנוֹ תַּחְתָּיו
  english_pob_choice: Ahab his son reigned in his place
  chosen_korean: 그의 아들 아합이 그의 뒤를 이어 왕이 되었습니다
  alternatives_korean:
  - 그의 아들 아합이 그 자리를 대신하여 다스렸습니다
  - 그의 아들 아합이 그를 대신하여 통치했습니다
  lexicon: HALOT
  rationale: ‘그의 뒤를 이어’는 תַּחְתָּיו의 승계 의미를 자연스럽게 드러내며, 왕위 계승을 분명히 하기 위해 ‘왕이 되었습니다’를 붙였습니다.
theological_decisions:
- issue: ‘sleeped with his fathers’ 관용구의 죽음 완곡 표현 유지
  chosen_reading: 직역된 완곡 표현 ‘그의 조상들과 함께 잠들었고’를 유지했습니다.
  alternative_readings:
  - ‘죽었고’로 의미만 풀어 쓰는 방식
  - ‘잠자리에 들었고’처럼 더 완화하는 방식
  rationale: 본문의 왕조 공식이 반복되는 관용구이므로, 의미를 풀어버리기보다 히브리어 표현의 형식을 보존하는 것이 서술의 신학적·문학적 기능을 더 잘 드러냅니다.
  doctrine_reference: 왕조 연대기 공식과 죽음의 완곡어법
- issue: 승계 공식에서 ‘왕이 되었습니다’의 명시
  chosen_reading: ‘아합이 그의 뒤를 이어 왕이 되었습니다’로 왕위 승계를 분명히 했습니다.
  alternative_readings:
  - ‘다스렸습니다’만 쓰는 방식
  - ‘즉위했습니다’로 옮기는 방식
  rationale: 히브리어 וַיִּמְלֹךְ는 단순 통치보다 왕위 계승의 서술로 기능하므로, 독자가 왕조 전환을 즉시 이해하도록 명시했습니다.
  doctrine_reference: 왕조 계승 서술
