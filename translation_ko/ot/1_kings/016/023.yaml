base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/023.yaml
  text: In the thirty-first year of Asa king of Judah[a], Omri became king over Israel for twelve years; he reigned in Tirzah six years.
  footnotes:
  - marker: a
    text: Or, more literally, 'Omri reigned over Israel twelve years; in Tirzah he reigned six years.' The verse distinguishes his total reign from the six years spent reigning in Tirzah.
    reason: lexical_alternative
translation:
  language: ko
  text: 아사가 유다 왕이 된 지 서른한째 해에 오므리가 이스라엘의 왕이 되어 열두 해 동안 다스렸는데, 그중 여섯 해는 디르사에서 다스렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절은 오므리의 총 재위 기간과 디르사에서 보낸 6년을 구별합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת֩ שְׁלֹשִׁ֨ים וְ/אַחַ֜ת שָׁנָ֗ה לְ/אָסָא֙ מֶ֣לֶךְ יְהוּדָ֔ה
  english_pob_choice: In the thirty-first year of Asa king of Judah
  chosen_korean: 아사가 유다 왕이 된 지 서른한째 해에
  alternatives_korean:
  - 아사 유다 왕의 서른한째 해에
  - 아사 유다 왕의 통치 서른한째 해에
  lexicon: WLC / HALOT
  rationale: 히브리어의 연대 공식은 아사의 즉위 연차를 가리키므로, 한국어에서도 자연스러운 연대 표현인 ‘된 지 서른한째 해에’로 옮겼습니다.
- source_word: מָלַךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되어
  alternatives_korean:
  - 즉위하여
  - 왕위에 올라
  lexicon: HALOT
  rationale: 첫 번째 מָלַךְ는 단순한 지속적 통치보다 즉위의 시작을 나타내므로, ‘왕이 되어’로 ingressive한 의미를 살렸습니다.
- source_word: עַל יִשְׂרָאֵל
  english_pob_choice: over Israel
  chosen_korean: 이스라엘의 왕
  alternatives_korean:
  - 이스라엘 위에
  - 이스라엘을 다스려
  lexicon: HALOT
  rationale: ‘מלך + על’의 지배 대상을 한국어에서는 관용적으로 ‘~의 왕’으로 자연스럽게 표현할 수 있어, 통치 대상을 분명히 했습니다.
- source_word: שְׁתֵּ֥ים עֶשְׂרֵ֖ה שָׁנָ֑ה
  english_pob_choice: for twelve years
  chosen_korean: 열두 해 동안 다스렸는데
  alternatives_korean:
  - 열두 해 동안
  - 열두 해를 다스렸는데
  lexicon: HALOT
  rationale: 오므리의 총 재위 기간을 나타내므로, 기간과 행위를 함께 드러내는 ‘열두 해 동안 다스렸는데’로 옮겼습니다.
- source_word: בְּ/תִרְצָ֖ה
  english_pob_choice: in Tirzah
  chosen_korean: 디르사에서
  alternatives_korean:
  - 디르사에
  - 디르사 안에서
  lexicon: HALOT
  rationale: ב의 장소 용법을 따라 재위의 장소를 나타내는 말로 옮겼습니다.
