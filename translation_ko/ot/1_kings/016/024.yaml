id: 1KI.16.24
reference: 1 Kings 16:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֜קֶן אֶת הָ/הָ֥ר שֹׁמְר֛וֹן מֵ֥/אֶת שֶׁ֖מֶר בְּ/כִכְּרַ֣יִם כָּ֑סֶף וַ/יִּ֨בֶן֙ אֶת הָ/הָ֔ר וַ/יִּקְרָ֗א אֶת שֵׁ֤ם הָ/עִיר֙ אֲשֶׁ֣ר בָּנָ֔ה עַ֣ל שֶׁם שֶׁ֔מֶר אֲדֹנֵ֖י הָ/הָ֥ר שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/024.yaml
  text: He bought the hill of Samaria from Shemer for two talents of silver[a], built on the hill, and called the name of the city that he built Samaria, after the name of Shemer[b], the owner of the hill.
  footnotes:
  - marker: a
    text: Or, more simply, 'and named the city he built Samaria, after Shemer, the owner of the hill.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'two talents of silver,' a large weight-based sum.
    reason: cultural_note
translation:
  language: ko
  text: 그는 세멜에게서 은 두 달란트[a]를 주고 사마리아 언덕을 사서, 그 언덕 위에 건축을 한 뒤, 자기가 세운 성읍의 이름을 그 언덕의 주인 세멜의 이름을 따라 사마리아라고 불렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘두 달란트’는 동전의 액면가가 아니라 은의 무게를 기준으로 한 큰 액수를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקֶן
  english_pob_choice: He bought
  chosen_korean: 사고
  alternatives_korean:
  - 구하고
  - 샀습니다
  lexicon: HALOT
  rationale: קנה는 여기서 대가를 치르고 소유를 얻는 뜻이므로, 자연스러운 현대 한국어로는 ‘사다’가 가장 직접적입니다.
- source_word: בְּכִכְּרַיִם כָּסֶף
  english_pob_choice: for two talents of silver
  chosen_korean: 은 두 달란트에
  alternatives_korean:
  - 은 두 세겔에
  - 은 두 달란트 값으로
  lexicon: HALOT
  rationale: כִּכָּר는 화폐 문맥에서 ‘달란트’이며, 쌍수형은 ‘두 달란트’를 뜻하므로 이를 그대로 살렸습니다.
- source_word: הָהָר
  english_pob_choice: the hill
  chosen_korean: 언덕
  alternatives_korean:
  - 산
  - 산비탈
  lexicon: HALOT
  rationale: 지형상 성읍이 세워지는 고지를 가리키므로, 한국어에서는 ‘산’보다 ‘언덕’이 더 자연스럽고 구체적입니다.
- source_word: עַל שֵׁם שֶׁמֶר
  english_pob_choice: after the name of Shemer
  chosen_korean: 세멜의 이름을 따라
  alternatives_korean:
  - 세멜의 이름을 따라서
  - 세멜의 이름대로
  lexicon: HALOT
  rationale: 히브리어 관용구의 명명 관계를 드러내기 위해 ‘이름을 따라’로 옮겨, 단순한 수식이 아니라 출처를 따른 명명임을 보존했습니다.
- source_word: אֲדֹנֵי הָהָר
  english_pob_choice: the owner of the hill
  chosen_korean: 그 언덕의 주인
  alternatives_korean:
  - 그 언덕의 소유자
  - 그 언덕의 주인님
  lexicon: HALOT
  rationale: אדון은 여기서 지배권이 아니라 소유권을 가리키므로, 신앙적 호칭인 ‘주님’이 아니라 재산권 의미의 ‘주인’으로 번역했습니다.
theological_decisions:
- issue: 성읍 명명에서의 반복과 소유 관계 표현
  chosen_reading: ‘그 언덕의 주인 세멜의 이름을 따라 사마리아라고 불렀습니다’로 옮겨, 단순히 이름만 붙인 것이 아니라 전 소유자의 이름을 따라 명명했다는 점을 드러냈습니다.
  alternative_readings:
  - ‘세멜 이름을 따서 사마리아라 불렀습니다’
  - ‘세멜을 따라 사마리아라고 불렀습니다’
  rationale: 본문은 지명 형성과 소유권 이전을 함께 보여 주므로, 명명 동기와 토지 소유의 연결을 한국어에서도 분명히 유지하는 것이 중요합니다.
  doctrine_reference: 본문 주해/서사 의미 보존
