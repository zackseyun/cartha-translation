source:
  edition: WLC
  text: וַ/יַּשְׁמֵ֣ד זִמְרִ֔י אֵ֖ת כָּל בֵּ֣ית בַּעְשָׁ֑א כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֶל בַּעְשָׁ֔א בְּ/יַ֖ד יֵה֥וּא הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/012.yaml
  text: So Zimri destroyed all the house of Baasha[b][a], according to the word of Yahweh that he had spoken against Baasha through Jehu the prophet.
  footnotes:
  - marker: a
    text: Or 'to Baasha.' The Hebrew preposition is literally 'to,' but here it introduces a word of judgment directed against him.
    reason: lexical_alternative
  - marker: b
    text: '''House of Baasha'' refers to Baasha''s royal house or dynasty, not merely his physical household.'
    reason: cultural_note
translation:
  language: ko
  text: 그리하여 시므리는 바아사의 온 집안[b]을 멸망시켰습니다. 이는 야훼께서 예언자 예후를 통하여 바아사를 거슬러[a] 하신 말씀대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 אֶל은 기본적으로 ‘~에게’라는 뜻이지만, 여기서는 바아사를 향한 심판의 말씀이라는 문맥에서 ‘~을 거슬러’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집안’은 바아사의 혈통과 왕조, 곧 왕가 전체를 가리키는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  english_pob_choice: destroyed
  chosen_korean: 멸망시켰으니
  alternatives_korean:
  - 파괴하였으니
  - 없애 버렸으니
  - 전멸시켰으니
  lexicon: HALOT
  rationale: שׁמד의 사역형은 완전한 파멸을 뜻하므로, 역사 서술의 힘을 살리면서도 과도하게 군사적·잔혹한 뉘앙스를 더하지 않는 ‘멸망시켰다’가 적절합니다.
- source_word: כָּל בֵּית בַּעְשָׁא
  english_pob_choice: all the house of Baasha
  chosen_korean: 바아사의 온 집안
  alternatives_korean:
  - 바아사의 모든 집
  - 바아사의 온 가문
  - 바아사의 모든 왕조
  lexicon: HALOT
  rationale: 왕조를 가리키는 ‘집’의 관용을 살리면서 한국어에서는 자연스럽게 ‘가문/집안’으로 옮겼고, כָּל은 전체성을 드러내는 ‘온’으로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: project glossary
  rationale: 이 문맥에서 한국어 교회권 독자에게 즉시 식별되는 형태를 우선 고려해, 본문은 관행적 음역인 ‘여호와’를 사용하되, 원전 표기는 유다임을 감사층에서 추적할 수 있습니다.
- source_word: בְּיַד יֵהוּא הַנָּבִיא
  english_pob_choice: through Jehu the prophet
  chosen_korean: 예언자 예후를 통해
  alternatives_korean:
  - 예언자 예후의 손으로
  - 예후 예언자를 통해
  - 예언자 예후로 말미암아
  lexicon: HALOT
  rationale: ‘손으로’라는 직역은 한국어에서 어색하므로, 매개 수단을 나타내는 ‘~를 통해’로 옮겨 예언자의 중개 역할을 분명히 했습니다.
- source_word: אֶל בַּעְשָׁא
  english_pob_choice: against Baasha
  chosen_korean: 바아사에게 하신
  alternatives_korean:
  - 바아사를 향해 하신
  - 바아사에 대하여 하신
  lexicon: HALOT
  rationale: 히브리어 전치사 אֶל의 기본값은 ‘~에게’이므로 이를 유지하되, 본문 전체의 심판 맥락이 이미 분명하므로 한국어 본문에서는 별도의 ‘against’를 덧붙이지 않았습니다.
theological_decisions:
- issue: 여호와의 말씀의 성취를 드러내는 문장 구조
  chosen_reading: 이는 여호와께서 예언자 예후를 통해 바아사에게 하신 말씀대로였습니다
  alternative_readings:
  - 여호와께서 예언자 예후를 통해 바아사에게 말씀하신 대로였습니다
  - 여호와의 예언대로였습니다
  rationale: 사건이 선행한 신적 말씀에 정확히 부합한다는 점을 드러내기 위해 ‘말씀대로였습니다’ 구조를 유지했고, 예언의 매개와 대상도 함께 보존했습니다.
  doctrine_reference: 'optimal-equivalence: fulfillments should remain explicit when the source marks correspondence'
