base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/010.yaml
  text: Then Zimri came in, struck him down, and killed him, in the twenty-seventh year of Asa king of Judah; and he reigned in his place.
translation:
  language: ko
  text: 그때 시므리가 들어와 그를 쳐서 죽였는데, 유다 왕 아사의 스물일곱째 해였습니다. 그리고 그가 그의 자리를 이어 왕이 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: Then ... came in
  chosen_korean: 들어와
  alternatives_korean:
  - 와
  - 들어가
  lexicon: HALOT
  rationale: בוא는 ‘오다/들어오다’의 뜻이므로, 암살 장면의 문맥에서는 단순한 이동보다 ‘들어와’가 자연스럽고 사건의 긴박함을 살립니다.
- source_word: וַיַּכֵּהוּ
  english_pob_choice: struck him down
  chosen_korean: 그를 쳐서
  alternatives_korean:
  - 그를 쳤고
  - 그를 공격하고
  lexicon: HALOT
  rationale: נכה는 ‘치다, 치명상을 입히다’의 뜻이어서, 뒤의 ‘죽였는데’와 구별되도록 첫 동작을 ‘쳐서’로 옮겼습니다.
- source_word: וַיְמִיתֵהוּ
  english_pob_choice: and killed him
  chosen_korean: 죽였는데
  alternatives_korean:
  - 죽이고
  - 목숨을 끊었는데
  lexicon: HALOT
  rationale: מות 히필은 ‘죽이다’이므로 가장 직접적으로 번역했습니다. 연결어 ‘-었는데’는 서술의 연속을 살리면서 한국어 문장을 자연스럽게 합니다.
- source_word: תַּחְתָּיו
  english_pob_choice: in his place
  chosen_korean: 그의 자리를 이어
  alternatives_korean:
  - 그를 대신하여
  - 그의 자리에
  lexicon: HALOT
  rationale: royal succession 문맥에서 תחתיו는 단순한 위치가 아니라 ‘뒤를 이어’의 뜻이 분명하므로, 직역보다 통치 계승을 드러내는 표현을 택했습니다.
