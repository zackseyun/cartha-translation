  - severity: low
    issue: ‘그의 자리를 이어’의 대명사 지시가 모호함
    rationale: 원문 תַּחְתָּיו는 피살된 왕을 대신하는 왕위 계승을 뜻합니다. ‘그를 대신하여’가 관계를 더 직접적으로 표현합니다.
  revised_text: 그때 시므리가 들어와 그를 치고 죽였으며, 유다 왕 아사의 제이십칠년에 그를 대신하여 왕이 되었습니다.
