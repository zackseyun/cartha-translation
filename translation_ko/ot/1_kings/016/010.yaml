  source_fidelity: 히브리어의 연속 동작(들어옴, 침, 죽임)과 왕위 계승을 대체로 반영했으나, 초안의 ‘유다 왕 아사의 스물일곱째 해였습니다’는 서술 시제를 부자연스럽게 바꾸며 날짜 공식을 독립적인 설명문으로 처리합니다. 또한 ‘그의 자리’는 두 대명사의 지시 대상이 겹쳐 다소 모호합니다.
  naturalness: 합쇼체는 유지되지만, ‘죽였는데’ 뒤에 ‘해였습니다’를 붙인 연결은 사건 서술로서 어색합니다. 날짜를 ‘제이십칠년에’로 처리하고 계승을 ‘그를 대신하여’로 표현하면 현대 한국어에서 더 자연스럽고 명료합니다.
  terminology: ‘시므리’, ‘유다 왕 아사’, ‘왕이 되었습니다’는 적절합니다. 왕위 계승의 תחתיו는 ‘그를 대신하여’가 원문의 관계를 명확히 드러냅니다.
  issues:
