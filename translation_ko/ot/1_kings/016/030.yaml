translation:
  language: ko
  text: 오므리의 아들 아합은 야훼의 보시기에 악을 행했습니다. 그는 그보다 앞선 모든 이보다 더 악을 행했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘야훼의 눈에.’'
    reason: source_note
  - marker: b
    text: 또는 ‘그보다 앞선 모든 이를 넘어서.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 행했습니다
  alternatives_korean:
  - 했습니다
  - 저질렀습니다
  lexicon: HALOT
  rationale: עשה는 여기서 ‘악을 행하다’의 관용적 용법이므로, 현대 한국어에서는 ‘행했습니다’가 자연스럽고 본문의 평가를 유지합니다.
- source_word: הָרַע
  english_pob_choice: what was evil
  chosen_korean: 악
  alternatives_korean:
  - 악한 일
  - 나쁜 일
  lexicon: HALOT
  rationale: 정관사가 붙은 הָרַע는 도덕적 평가를 가리키는 실질적 표현이므로, ‘악’을 써서 짧고 직접적으로 살렸습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the sight of Yahweh
  chosen_korean: 야훼의 보시기에
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어 자연성을 위해 ‘보시기에’로 옮겨, 평가의 기준이 야훼께 있음을 드러냈습니다.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  english_pob_choice: more than all who were before him
  chosen_korean: 자기보다 앞선 모든 사람보다 더 그랬습니다
  alternatives_korean:
  - 그보다 앞선 모든 이들보다 더했습니다
  - 자기 앞에 있던 모든 이보다 더했습니다
  lexicon: HALOT
  rationale: 비교구문을 자연스러운 한국어로 풀어, 아합이 이전의 모든 이보다 더 심했다는 의미를 명확히 했습니다.
theological_decisions:
- issue: 야훼의 보시기라는 평가 관용구의 번역
  chosen_reading: ‘야훼의 보시기에’로 옮겨, 행위의 도덕적 기준이 인간이 아니라 야훼께 있음을 분명히 했습니다.
  alternative_readings:
  - ‘야훼 앞에서’
  - ‘주님의 눈에’
  rationale: 본문은 왕의 행위를 신적 평가의 관점에서 판단하므로, 단순한 장소 표현보다 ‘보시기에’가 의미를 가장 분명하게 전달합니다.
  doctrine_reference: 'DOCTRINE.md: יְהוָה의 번역과 신적 평가 관용구'
