  yaml_path: translation/ot/1_kings/016/030.yaml
  text: Ahab son of Omri did what was evil in the sight of Yahweh[b][a], more than all who were before him.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in the eyes of the LORD.'''
