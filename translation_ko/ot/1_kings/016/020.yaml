  yaml_path: translation/ot/1_kings/016/020.yaml
  text: Now the rest of the acts of Zimri[a], and his conspiracy that he carried out—are they not written in the Book of the Chronicles of the Kings of Israel?
  footnotes:
  - marker: a
    text: Or 'his plot that he plotted.' The Hebrew uses a noun and cognate verb from the same root for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 시므리의 나머지 행적과 그가 꾸민 음모[a]는 이스라엘 왕들의 역대지략에 기록되어 있지 않습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 음모’라는 명사와 ‘그가 음모를 꾸몄다’라는 동사를 같은 어근으로 겹쳐 써서 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי זִמְרִי
  english_pob_choice: Now the rest of the acts of Zimri
  chosen_korean: 이제 시므리의 나머지 행적
  alternatives_korean:
  - 그리고 시므리의 나머지 행적
  - 시므리의 나머지 행적은
  lexicon: HALOT
  rationale: 왕의 연대기 공식에서 יֶתֶר דִּבְרֵי 는 단순한 ‘말’이 아니라 남은 행적/사적을 가리키므로, 현대 한국어에서는 ‘나머지 행적’이 가장 자연스럽고 원문 기능을 잘 살립니다.
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  english_pob_choice: and his conspiracy that he carried out
  chosen_korean: 그가 꾸민 음모
  alternatives_korean:
  - 그의 음모와 그가 음모를 꾸민 것
  - 그가 모의한 음모
  lexicon: HALOT
  rationale: 히브리어는 명사 קִשְׁרוֹ 와 동사 קָשָׁר 를 같은 어근으로 겹쳐 써서 강조하므로, 한국어에서는 중복을 살리기보다 자연스러운 방식으로 ‘꾸민 음모’라고 옮기되, 정치적 반역의 의미는 ‘음모’로 보존했습니다.
- source_word: הֲלֹא הֵם כְּתוּבִים
  english_pob_choice: are they not written
  chosen_korean: 기록되어 있지 않습니까
  alternatives_korean:
  - 기록되어 있지 않습니까?
  - 기록되어 있지 않습니까
  lexicon: HALOT
  rationale: 수사적 질문 형식을 살리면서, 한국어 연대기 문체에 맞게 ‘기록되어 있지 않습니까’로 옮겨 원문의 확인적 질문을 유지했습니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  english_pob_choice: the Book of the Chronicles
  chosen_korean: 역대지략
  alternatives_korean:
  - 역대기
  - 역대의 기록
  lexicon: HALOT
  rationale: סֵפֶר דִּבְרֵי הַיָּמִים 는 궁정 연대기/실록을 가리키므로, 표준 성경 관용인 ‘역대지략’을 사용해 문서형 기록이라는 뉘앙스를 살렸습니다.
