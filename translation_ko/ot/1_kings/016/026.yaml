base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/026.yaml
  text: For he walked in all the way of Jeroboam son of Nebat[a], and in his sins by which he caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
  footnotes:
  - marker: a
    text: 'Hebrew: ''with their vanities'' or ''with their worthless things''; the term is a common polemical word for idols.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 느밧의 아들 여로보암의 모든 길로 걸어갔고, 그가 이스라엘에게 죄를 짓게 한 그의 죄들 가운데서 행했으며, 이스라엘의 하나님 야훼를 그들의 우상으로 노엽게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 헛됨들’ 또는 ‘그들의 무가치한 것들’입니다. 여기서는 우상을 가리키는 폄하적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: he walked
  chosen_korean: 걸어갔고
  alternatives_korean:
  - 갔고
  - 살아갔고
  lexicon: HALOT
  rationale: הלך의 관용적 용법이 삶의 행실을 가리키므로, 단순 이동보다 행위의 방향성을 살리는 ‘걸어가다’를 택했습니다.
- source_word: בְּכָל דֶּרֶךְ
  english_pob_choice: in all the way
  chosen_korean: 모든 길로
  alternatives_korean:
  - 모든 방식으로
  - 모든 길 가운데
  lexicon: HALOT
  rationale: 히브리어의 ‘길’은 행위 양식을 뜻하는 관용구이므로, 한국어에서도 ‘모든 길’로 유지해 완전한 추종의 뉘앙스를 살렸습니다.
- source_word: וּבְחַטֹּאתָיו אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  english_pob_choice: and in his sins by which he caused Israel to sin
  chosen_korean: 그가 이스라엘에게 죄를 짓게 한 그의 죄들 가운데서
  alternatives_korean:
  - 이스라엘을 죄짓게 한 그의 죄들 가운데서
  - 그의 죄들과 함께
  lexicon: HALOT
  rationale: 히필의 인과성을 드러내기 위해 ‘죄를 짓게 하다’를 사용했고, 복수형 ‘죄들’과 소유격을 그대로 살려 여로보암의 누적된 죄를 보존했습니다.
- source_word: בְּהַבְלֵיהֶם
  english_pob_choice: with their idols
  chosen_korean: 그들의 우상으로
  alternatives_korean:
  - 그들의 허무한 것들로
  - 그들의 헛것들로
  lexicon: HALOT
  rationale: 문맥상 הבל은 우상 비판의 관용어이므로 본문에는 ‘우상’으로 자연스럽게 옮기고, 히브리어의 ‘허무/헛됨’ 이미지는 주석에서 보완할 수 있습니다.
theological_decisions:
