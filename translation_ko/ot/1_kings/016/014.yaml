translation:
  language: ko
  text: 이세의 남은 행적과 그가 한 모든 일은 이스라엘 왕들의 역대기에 기록되어 있지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 왕들의 연대기’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  english_pob_choice: Now the rest of
  chosen_korean: 남은
  alternatives_korean:
  - 나머지
  - 남은 일들
  lexicon: HALOT
  rationale: 왕들의 열전에서 반복되는 관용구로, יֶתֶר의 핵심 의미인 ‘남은 것, 나머지’를 자연스러운 서술형 한국어로 옮겼습니다.
- source_word: דִּבְרֵי
  english_pob_choice: acts
  chosen_korean: 행적
  alternatives_korean:
  - 일들
  - 행위들
  - 기록
  lexicon: HALOT
  rationale: 문자적으로는 ‘말들/일들’이지만, 이 공식구에서는 왕의 행적 기록을 가리키므로 ‘행적’이 가장 간결하고 문맥에 맞습니다.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  english_pob_choice: and all that he did
  chosen_korean: 그가 한 모든 일
  alternatives_korean:
  - 그가 행한 모든 것
  - 그가 한 모든 행위
  lexicon: HALOT
  rationale: עשה의 넓은 뜻을 살려 ‘한 모든 일’로 옮겨, 왕의 전반적 행위를 포괄하는 formula를 유지했습니다.
- source_word: דִּבְרֵי הַיָּמִים
  english_pob_choice: the Chronicles
  chosen_korean: 역대기
  alternatives_korean:
  - 연대기
  - 사건 기록
  lexicon: HALOT
  rationale: 공식적인 왕조 연대 기록을 가리키는 정착된 표현이므로, 한국어 성경 전통에서도 통용되는 ‘역대기’를 사용했습니다.
theological_decisions:
- issue: 수사적 질문의 종결 방식
  chosen_reading: ‘기록되어 있지 않습니까?’로 옮겨, 히브리어 הֲלוֹא의 기대 확인 질문을 한국어에서도 유지했습니다.
  alternative_readings:
  - ‘기록되어 있지요?’
  - ‘기록되어 있지 않습니까?’ 대신 단정문으로 처리
  rationale: 본문은 정보를 묻기보다 독자가 알고 있는 공적 기록을 환기하는 수사적 질문이므로, 확인을 요청하는 형태를 유지하는 것이 적절합니다.
  doctrine_reference: 역사 서술의 수사법 보존
- issue: ‘책/기록’의 성격
  chosen_reading: ‘이스라엘 왕들의 역대기’로 옮겨, 특정 공식 사료를 가리키는 기록체로 이해했습니다.
  alternative_readings:
  - ‘이스라엘 왕들의 연대기’
  - ‘이스라엘 왕들의 기록’
  rationale: סֵפֶר과 דִּבְרֵי הַיָּמִים의 결합은 단순한 책 제목이라기보다 왕실 기록 보관소를 가리키는 관용구이므로, 독자가 공적 사료를 떠올리도록 했습니다.
  doctrine_reference: 구약 역사서의 문서 관행
