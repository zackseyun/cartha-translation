  lexicon: HALOT
  rationale: לְבַעְשָׁא의 관계표현을 자연스럽게 풀어, 단순 소유보다 ‘바아사에게 속한 사람들’이라는 의미를 드러냈습니다.
- source_word: יֹאכְלוּ הַכְּלָבִים
  english_pob_choice: the dogs will eat
  chosen_korean: 개들이 먹고
  alternatives_korean:
  - 개들이 삼키고
  - 개들이 잡아먹고
  lexicon: HALOT
  rationale: אָכַל의 기본 의미인 ‘먹다’를 살리되, 문맥상의 잔혹함은 그대로 유지했습니다.
- source_word: עוֹף הַשָּׁמָיִם
  english_pob_choice: the birds of the heavens
  chosen_korean: 하늘의 새들이
  alternatives_korean:
  - 하늘의 새들
  - 하늘의 날짐승들이
  lexicon: HALOT
  rationale: 히브리어의 관용적 소유격을 자연스러운 한국어로 옮기면서도 ‘하늘’과 ‘새들’의 대응을 유지했습니다.
