base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/004.yaml
  text: Whoever belonging to Baasha dies in the city[a], the dogs will eat; and whoever belonging to him dies in the field[b], the birds of the heavens will eat.
  footnotes:
  - marker: a
    text: Or 'of Baasha' / 'Baasha's.' The Hebrew uses a relational construction that refers to those belonging to Baasha, likely his household or dynasty.
    reason: lexical_alternative
  - marker: b
    text: Or 'the birds of the sky.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바아사에게 속한 자[a]가 도시에서 죽으면 개들이 그를 먹고, 그에게 속한 자가 들에서 죽으면 하늘의 새들[b]이 그를 먹을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바아사의’. 히브리어는 바아사와의 소속 또는 관계를 나타내는 구문을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하늘의 새’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְבַעְשָׁא
  english_pob_choice: whoever belonging to Baasha dies
  chosen_korean: 바아사의 사람들 중 누구든지 ... 죽으면
  alternatives_korean:
