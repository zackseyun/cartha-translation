- from: 바아사의 사람들 중 누구든지 성읍에서 죽으면 개들이 먹고, 그의 사람들 중 누구든지 들에서 죽으면 하늘의 새들이 먹을 것입니다.[a][b]
  to: 바아사에게 속한 자[a]가 도시에서 죽으면 개들이 그를 먹고, 그에게 속한 자가 들에서 죽으면 하늘의 새들[b]이 그를 먹을 것입니다.
  rationale: 관계 표현의 모호성을 ‘속한 자’로 보존하고, 두 절의 단수·포괄적 병행을 유지했습니다. ‘그에게 속한 자’는 대명사가 바아사를 가리키는 원문을 반영합니다. 목적어 ‘그를’은 한국어의 명료성을 위해 보충했으며, 죽은 자가 개와 새에게 먹힌다는 원문의 의미를 그대로 전달합니다. 각주 표지도 해당 표현에 직접 배치했습니다.
