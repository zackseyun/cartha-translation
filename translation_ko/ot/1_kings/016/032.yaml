  source_fidelity: 원문은 아합이 바알을 위한 제단을 세운 장소를, 그가 사마리아에 지은 ‘바알의 집’으로 특정합니다. 초안은 ‘제단을 쌓았다’와 ‘집 안에 있었습니다’를 연결하여 제단이 주어인 별도 서술처럼 되어, 원문의 직접적인 행위·장소 관계가 흐려집니다. ‘세우다’가 וַיָּקֶם의 사역형 의미에도 더 정확합니다.
