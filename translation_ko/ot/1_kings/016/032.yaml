    text: Or 'the temple of Baal.' Hebrew literally says 'the house of Baal.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 바알에게 제단을 쌓았는데, 사마리아에 세운 바알의 집 안에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바알의 신전.’ 히브리어는 문자적으로 ‘바알의 집’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  english_pob_choice: He set up
  chosen_korean: 제단을 쌓았는데
  alternatives_korean:
  - 세웠는데
  - 설치했는데
  lexicon: HALOT
  rationale: Hiphil wayyiqtol의 ‘세우다/설립하다’ 뜻을 제단 문맥에 맞게 자연스럽게 옮기되, 제의 구조물을 만든다는 느낌을 살려 ‘제단을 쌓다’로 번역했습니다.
- source_word: לַבָּעַל
  english_pob_choice: for Baal
  chosen_korean: 바알에게
  alternatives_korean:
  - 바알을 위하여
  - 바알에 대하여
  lexicon: HALOT
  rationale: 히브리어 לְ의 헌납·지향 의미를 한국어에서 가장 간결하게 드러내는 표현으로 ‘~에게’를 택했습니다.
- source_word: בֵּית הַבַּעַל
  english_pob_choice: the house of Baal
  chosen_korean: 바알의 집
  alternatives_korean:
  - 바알 신전
  - 바알의 성전
  lexicon: HALOT
  rationale: POB의 직역 방침에 따라 ‘집’을 살리고, 한국어에서는 소유격으로 자연스럽게 연결해 ‘바알의 집’으로 옮겼습니다.
- source_word: בְּשֹׁמְרוֹן
  english_pob_choice: in Samaria
  chosen_korean: 사마리아에
  alternatives_korean:
  - 사마리아에서
  - 사마리아 안에
  lexicon: HALOT
  rationale: 지명 ב의 장소 의미를 표준적인 위치 부사격으로 옮겼습니다.
theological_decisions:
- issue: ‘바알의 집’의 문화적·문체적 처리
  chosen_reading: ‘바알의 집’으로 유지해 히브리어의 직설적 표현을 살렸습니다.
  alternative_readings:
  - ‘바알 신전’
  - ‘바알의 성전’
  rationale: 이 구절은 교리적 쟁점보다 원문 투명성이 중요한 곳이므로, 전통적 종교어휘로 바꾸지 않고 직역 성격을 유지했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; consistency of key terms.'
