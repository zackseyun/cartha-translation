id: 1KI.16.3
reference: 1 Kings 16:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנְ/נִ֥י מַבְעִ֛יר אַחֲרֵ֥י בַעְשָׁ֖א וְ/אַחֲרֵ֣י בֵית֑/וֹ וְ/נָֽתַתִּי֙ אֶת בֵּ֣יתְ/ךָ֔ כְּ/בֵ֖ית יָרָבְעָ֥ם בֶּן נְבָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/003.yaml
  text: Behold[a], I am sweeping away Baasha and his house, and I will make your house like the house of Jeroboam son of Nebat.
  footnotes:
  - marker: a
    text: Or, more literally, 'I am burning/consuming after Baasha.' The Hebrew idiom means that the LORD will wipe out Baasha and his line.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 바아사를 그 뒤를 따라 쓸어버릴 것이며, 그의 집을 네 집처럼, 곧 느밧의 아들 여로보암의 집처럼 만들겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘바아사 뒤에 불을 지르며/소멸시키며’에 가깝습니다. 이 히브리어 관용구는 바아사와 그의 계열을 완전히 없애신다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보소서
  lexicon: HALOT
  rationale: 선지자적·신적 선언의 엄숙한 호명어를 현대 합쇼체로 살리기 위해 ‘보십시오’를 택했습니다. '보라'보다 덜 구어적이고, '보소서'보다 덜 고어적입니다.
- source_word: מַבְעִיר אַחֲרֵי
  english_pob_choice: am sweeping away
  chosen_korean: 그 뒤를 따라 쓸어버릴 것이며
  alternatives_korean:
  - 불살라 없애겠습니다
  - 소멸시키겠습니다
  - 제거하겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 바아사와 그의 계열을 완전히 제거하는 뜻이므로, 문자적인 ‘불사르다’보다 결과를 드러내는 ‘쓸어버리다’로 옮겼습니다. ‘그 뒤를 따라’는 אחרי의 방향감을 약하게나마 반영합니다.
- source_word: בֵיתוֹ / בֵּיתְךָ
  english_pob_choice: his house / your house
  chosen_korean: 그의 집 / 네 집
  alternatives_korean:
  - 그의 가문 / 네 가문
  - 그의 왕가 / 네 왕가
  lexicon: HALOT
  rationale: 문맥상 왕조·가문을 뜻하지만, 히브리어의 '집' 이미지를 유지하는 것이 본문의 결을 더 잘 살립니다. 비교 구절에서 같은 표현을 반복해 대조를 분명히 했습니다.
- source_word: וְנָתַתִּי
  english_pob_choice: I will make
  chosen_korean: 만들겠습니다
  alternatives_korean:
  - 되게 하겠습니다
  - 두겠습니다
  - 삼겠습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 ‘주다’가 아니라 ‘~이 되게 하다’의 의미이므로, 한국어에서는 결과를 명확히 하는 ‘만들다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 바아사 집안에 대한 심판의 성격
  chosen_reading: 주님이 바아사와 그의 집을 완전히 제거하겠다는 왕조적 심판으로 이해하고, 본문에는 불의 물리적 방식보다 멸절의 결과를 드러내었습니다.
  alternative_readings:
  - ‘불태우겠습니다’처럼 문자적 화염 이미지를 전면화하는 읽기
  - ‘없애버리겠습니다’처럼 이미지성을 약화한 읽기
  rationale: 히브리어 관용구 mʿbîr ʾaḥărê는 본문 자체에서 ‘뒤를 따라’ 오는 계열을 없애는 심판을 뜻하므로, 독자가 심판의 강도를 놓치지 않으면서도 오해 없이 읽도록 결과 중심으로 번역했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
