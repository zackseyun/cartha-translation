  text: 이는 그가 지은 죄들 때문입니다. 그는 야훼 보시기에 악을 행하고, 여로보암의 길과 그가 이스라엘을 죄짓게 하려고 지은 죄를 따랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “그가 지은 그의 죄 때문에, 곧 야훼 보시기에 악을 행하고 여로보암의 길과 그가 이스라엘을 죄짓게 하려고 지은 그의 죄를 따라 걸었기 때문이다”입니다.
    reason: 히브리어의 반복된 ‘그의 죄’와 마지막 부정사의 목적·사역 관계를 드러냅니다.
