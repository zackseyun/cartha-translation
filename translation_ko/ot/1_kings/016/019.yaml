translation:
  language: ko
  text: 그가 지은 죄들 때문에, 곧 야훼의 눈앞에서 악을 행하고 여로보암의 길로 걸으며 이스라엘을 죄 짓게 한 그 죄 때문에입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: “그가 한 죄, 곧 이스라엘을 죄 짓게 한 죄.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  english_pob_choice: because of
  chosen_korean: ~때문에
  alternatives_korean:
  - ~로 말미암아
  - ~에 대하여
  lexicon: HALOT
  rationale: 판결·평가 문맥에서 원인이나 근거를 나타내므로, 한국어로는 자연스러운 인과 표현인 '~때문에'로 옮겼습니다.
- source_word: חטאתו אֲשֶׁר חָטָא
  english_pob_choice: his sins that he committed
  chosen_korean: 그가 지은 죄들
  alternatives_korean:
  - 그가 범한 죄
  - 그의 죄, 곧 그가 지은 죄
  lexicon: HALOT
  rationale: 히브리어의 '자기 죄를 죄지었다'는 관용적 중첩을 살리되, 문맥상 복수적 누적을 자연스럽게 드러내기 위해 '죄들'로 옮겼습니다.
- source_word: לַעֲשׂוֹת הָרַע
  english_pob_choice: doing what was evil
  chosen_korean: 악을 행하고
  alternatives_korean:
  - 악한 일을 하며
  - 악을 행하여
  lexicon: HALOT
  rationale: 이 부정사는 앞선 죄의 내용을 풀어 설명하므로, 한국어에서는 동작 서술형인 '악을 행하고'로 풀어 원문의 행위성을 살렸습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼의 눈앞에서
  alternatives_korean:
  - 야훼 보시기에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 평가 관용구를 직역해 '눈앞에서'로 두어, 하나님 앞에서의 도덕적 평가라는 원문의 비유를 보존했습니다.
- source_word: לָלֶכֶת בְּדֶרֶךְ יָרָבְעָם
  english_pob_choice: walking in the way of Jeroboam
  chosen_korean: 여로보암의 길로 걸으며
  alternatives_korean:
  - 여로보암의 길을 따라가며
  - 여로보암의 길로 행하며
  lexicon: HALOT
  rationale: 행동 양식과 삶의 방향을 뜻하는 '걷다/길'의 은유를 그대로 살려, 지속적 추종의 의미를 드러냈습니다.
- source_word: לְהַחֲטִיא אֶת יִשְׂרָאֵל
  english_pob_choice: causing Israel to sin
  chosen_korean: 이스라엘을 죄 짓게 한
  alternatives_korean:
  - 이스라엘로 죄를 짓게 한
  - 이스라엘을 죄로 이끈
  lexicon: HALOT
  rationale: 힢힐의 사역적 의미를 반영해 단순한 동시적 분사가 아니라 '죄 짓게 한'이라는 인과 표현으로 옮겼습니다.
theological_decisions:
