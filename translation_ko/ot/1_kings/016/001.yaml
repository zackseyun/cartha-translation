  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֶל יֵה֣וּא בֶן חֲנָ֔נִי עַל בַּעְשָׁ֖א לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/001.yaml
  text: Then the word of Yahweh came to Jehu son of Hanani against Baasha[a], saying,
  footnotes:
  - marker: a
    text: Or "concerning Baasha." The Hebrew preposition can be broader, but here it introduces an oracle of judgment, so "against" is preferred.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼의 말씀이 하난니의 아들 예후에게 바아사를 향하여 임하여 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “바아사에 관하여.” 히브리어 전치사 עַל은 더 넓게도 쓰이지만, 여기서는 심판 신탁을 도입하므로 ‘향하여’가 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה
  english_pob_choice: Then the word of Yahweh came
  chosen_korean: 그때 야훼의 말씀이 … 임하여
  alternatives_korean:
  - 야훼의 말씀이 … 오셨습니다
  - 야훼의 말씀이 … 이르렀습니다
  lexicon: HALOT
  rationale: 예언 서문의 정형적 표현을 한국어로 자연스럽게 살리되, 단순한 정보 전달보다 하나님의 주도적 발화를 드러내는 ‘임하여’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 고유명사 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 호칭이 아닌 언약적 신적 이름을 유지했습니다.
- source_word: עַל
  english_pob_choice: against
  chosen_korean: …를 향하여
  alternatives_korean:
  - …에 관하여
  - …을/를 대하여
  lexicon: HALOT
  rationale: 히브리어 전치사 עַל은 이 문맥에서 심판의 신탁을 도입하지만, 한국어에서는 직접적인 ‘against’보다 ‘향하여’가 문맥상 적대적 방향성을 유지하면서도 지나치게 해석적으로 들리지 않습니다.
- source_word: יֵהוּא בֶן חֲנָנִי
  english_pob_choice: Jehu son of Hanani
  chosen_korean: 하난니의 아들 예후
  alternatives_korean:
  - 예후, 하난니의 아들
  - 하난니 아들 예후
  lexicon: HALOT
  rationale: 히브리어 친족관계 표현을 한국어 소유격으로 자연스럽게 옮기고, 인명은 표준 음역에 따라 ‘예후’와 ‘하난니’로 처리했습니다.
theological_decisions:
- issue: 심판 신탁의 방향성 표시
  chosen_reading: ‘바아사를 향하여’로 옮겨 다음 절의 책망/심판 발화를 예고했습니다.
  alternative_readings:
  - ‘바아사에 관하여’
  - ‘바아사에 대하여’
  rationale: עַל을 중립적인 ‘관하여’로 약화시키면 예언 본문의 사법적·선고적 성격이 흐려집니다. ‘향하여’는 본문의 심판 방향성을 보존하면서도 한국어 어법에 무리하지 않습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
