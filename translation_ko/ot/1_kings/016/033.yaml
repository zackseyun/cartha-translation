revisions:
- from: 아합이 아세라를 만들고, 이스라엘의 하나님 야훼를 격노하게 하려고 아합이 그전의 이스라엘의 모든 왕들보다 더 많은 일을 하였습니다.[a]
  to: 아합은 아세라를 만들었습니다. 또한 아합은 자기보다 앞서 있었던 이스라엘의 모든 왕보다 더 많이 야훼, 곧 이스라엘의 하나님을 격노하게 하는 일을 하였습니다.[a]
  rationale: 문장을 둘로 나누어 서사 진행을 자연스럽게 했습니다. ‘또한’과 ‘더 많이’로 וַיּוֹסֶף 및 비교 구문의 증가 의미를 드러내고, ‘격노하게 하는 일을 하였습니다’로 히브리어 부정사의 내용을 목적 표현으로 과도하게 한정하지 않았습니다. 아세라의 지시 대상에 관한 중의성은 본문 음역과 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:50:48Z'
