  source_fidelity: 초안은 아세라의 중의성과 야훼라는 신명을 적절히 보존하고 비교 구문도 대체로 반영합니다. 그러나 וַיּוֹסֶף(‘더하다/계속하다’)의 추가·증가 의미가 ‘더 많은 일을 하였습니다’에 충분히 명시되지 않으며, ‘격노하게 하려고’는 결과적/목적적 의미로 다소 치우칩니다. 본문은 야훼를 노하게 하는 일을 더욱 행했다는 뜻입니다.
  naturalness: ‘이스라엘의 하나님 야훼’는 가능하지만, 삽입 동격인 ‘야훼, 곧 이스라엘의 하나님’이 더 자연스럽고 명료합니다. ‘그전의 이스라엘의 모든 왕들’보다 ‘자기보다 앞서 있었던 이스라엘의 모든 왕’이 선행 관계를 더 분명히 나타냅니다.
  terminology: ‘아세라’와 ‘야훼’는 일관되고 적절합니다. 아세라를 여신 또는 제의물로 단정하지 않는 각주는 유지하되, 가능한 ‘아세라 목상’이라는 관용적 대안을 덧붙여 기능을 분명히 합니다.
