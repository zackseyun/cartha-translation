source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אַחְאָ֖ב אֶת הָ/אֲשֵׁרָ֑ה וַ/יּ֨וֹסֶף אַחְאָ֜ב לַ/עֲשׂ֗וֹת לְ/הַכְעִיס֙ אֶת יְהֹוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִ/כֹּ֨ל מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/033.yaml
  text: Ahab also made the Asherah[a], and Ahab went on to do more to provoke Yahweh, the God of Israel, than all the kings of Israel who were before him.
  footnotes:
  - marker: a
    text: Or 'the Asherah pole.' The Hebrew אֲשֵׁרָה may refer to the goddess Asherah or to the cultic object associated with her.
    reason: alternative_reading
translation:
  language: ko
  text: 아합이 아세라를 만들고, 이스라엘의 하나님 야훼를 격노하게 하려고 아합이 그전의 이스라엘의 모든 왕들보다 더 많은 일을 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֲשֵׁרָה는 아세라 여신이나 그와 연관된 제의적 상징물을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: made
  chosen_korean: 만들고
  alternatives_korean:
  - 만들었습니다
  - 세웠고
  - 제작하고
  lexicon: HALOT
  rationale: עָשָׂה의 기본 의미인 ‘만들다/하다’를 살리되, 우상·제의 대상에 대한 자연스러운 한국어로 ‘만들다’를 택했습니다.
- source_word: הָאֲשֵׁרָה
  english_pob_choice: the Asherah
  chosen_korean: 아세라
  alternatives_korean:
  - 아세라 목상
  - 아세라 상
  - 아세라(여신)
  lexicon: HALOT
  rationale: 히브리어의 중의성을 본문에서 풀지 않고 음역어로 남겨, 여신인지 제의적 상징물인지의 긴장을 보존했습니다.
- source_word: לְהַכְעִיס
  english_pob_choice: to provoke
  chosen_korean: 격노하게 하려고
  alternatives_korean:
  - 노하게 하려고
  - 분노하게 하려고
  - 화를 내게 하려고
  lexicon: HALOT
  rationale: 히필의 ‘분노하게 하다, 격노하게 하다’라는 사역적 뉘앙스를 살려, 단순한 감정 유발보다 강한 동작을 반영했습니다.
- source_word: מִכֹּל מַלְכֵי יִשְׂרָאֵל אֲשֶׁר הָיוּ לְפָנָיו
  english_pob_choice: than all the kings of Israel who were before him
  chosen_korean: 그전의 이스라엘의 모든 왕들보다
  alternatives_korean:
  - 그보다 앞선 이스라엘의 모든 왕들보다
  - 그 이전의 이스라엘 모든 왕들보다
  lexicon: HALOT
  rationale: 비교 구문을 한국어 비교격 ‘-보다’로 자연스럽게 옮기면서, ‘before him’의 시간적 선행 관계를 ‘그전의’로 간결하게 반영했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 고유명사성을 살리고, 프로젝트 기본 용례에 따라 신적 이름을 대체 титl이 아닌 음역으로 유지했습니다.
  doctrine_reference: '공인 번역 원칙: יהוה는 ‘야훼’로 번역'
- issue: אֲשֵׁרָה의 중의성 보존
  chosen_reading: 아세라
  alternative_readings:
  - 아세라 목상
  - 아세라 여신
  rationale: 문맥상 우상숭배의 대상이 분명하지만, 본문 자체가 여신과 제의물의 구분을 명시하지 않으므로 본문 수준에서는 단정하지 않았습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
