  text: וְ/אַחְאָ֣ב בֶּן עָמְרִ֗י מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁמֹנֶה֙ שָׁנָ֔ה לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ֠/יִּמְלֹךְ אַחְאָ֨ב בֶּן עָמְרִ֤י עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/029.yaml
  text: And Ahab son of Omri became king over Israel in the thirty-eighth year of Asa king of Judah, and Ahab son of Omri reigned over Israel in Samaria twenty-two years.
translation:
  language: ko
  text: 아합은 유다의 왕 아사의 서른여덟째 해에 오므리의 아들로서 이스라엘의 왕이 되었고, 아합은 사마리아에서 이십이 년 동안 이스라엘을 다스렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 즉위하였습니다
  - 통치하기 시작했습니다
  lexicon: HALOT
  rationale: 왕위에 오르는 순간을 나타내는 어형이므로, 재위 기간을 말하는 뒤 문장과 구분되도록 ‘왕이 되었습니다’로 옮겼습니다.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  english_pob_choice: in the thirty-eighth year
  chosen_korean: 서른여덟째 해에
  alternatives_korean:
  - 서른여덟 해에
  - 제삼십팔년에
  lexicon: HALOT
  rationale: 아사의 재위와 연결되는 연대식이므로, 자연스러운 현대 한국어로 순서를 드러내는 ‘서른여덟째 해에’가 적절합니다.
- source_word: וַיִּמְלֹךְ
  english_pob_choice: reigned
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 통치했습니다
  - 재위했습니다
  lexicon: HALOT
  rationale: 뒤의 ‘이십이 년’과 결합해 지속적 통치를 나타내므로, ‘재위했습니다’보다 서술적이면서도 현대적인 ‘다스렸습니다’를 택했습니다.
- source_word: בְּשֹׁמְרוֹן
  english_pob_choice: in Samaria
  chosen_korean: 사마리아에서
  alternatives_korean:
  - 사마리아 안에서
  - 사마리아에
  lexicon: HALOT
  rationale: ב의 장소 용법을 살려, 왕의 통치 중심지를 나타내는 자연스러운 표현으로 옮겼습니다.
