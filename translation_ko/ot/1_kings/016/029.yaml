revisions:
- from: 아합은 유다의 왕 아사의 서른여덟째 해에 오므리의 아들로서 이스라엘의 왕이 되었고, 아합은 사마리아에서 이십이 년 동안 이스라엘을 다스렸습니다.
  to: 오므리의 아들 아합은 유다 왕 아사의 서른여덟째 해에 이스라엘의 왕이 되었고, 오므리의 아들 아합은 사마리아에서 스물두 해 동안 이스라엘을 다스렸습니다.
  rationale: The revision preserves the accession/reign distinction, restores the source’s repeated patronymic, and uses direct Korean apposition for the Hebrew genealogical identification. No footnote is needed because the wording is unambiguous in this verse.
  reviewer_model: gpt-5.6-terra
