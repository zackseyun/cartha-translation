  text: וְ/יֶ֨תֶר דִּבְרֵ֥י בַעְשָׁ֛א וַ/אֲשֶׁ֥ר עָשָׂ֖ה וּ/גְבֽוּרָת֑/וֹ הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/005.yaml
  text: Now the rest of the acts of Baasha[a], and what he did, and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
  footnotes:
  - marker: a
    text: Or 'the book of the annals of the kings of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바아사의 남은 행적과 그가 한 일, 그리고 그의 힘은—이스라엘 왕들의 역대기에 기록되어 있지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 왕들의 연대기’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי בַעְשָׁא
  english_pob_choice: Now the rest of the acts of Baasha
  chosen_korean: 바아사의 남은 행적
  alternatives_korean:
  - 바아사의 나머지 행적
  - 바아사의 남은 일들
  - 바아사의 남은 사건들
  lexicon: HALOT
  rationale: 왕의 기록을 맺는 관용구로서 ‘남은 행적’이 דִּבְרֵי의 기록적 의미와 יֶתֶר의 ‘나머지’ 뜻을 함께 자연스럽게 살립니다.
- source_word: וַאֲשֶׁר עָשָׂה
  english_pob_choice: and what he did
  chosen_korean: 그가 한 일
  alternatives_korean:
  - 그가 행한 것
  - 그가 한 모든 일
  lexicon: HALOT
  rationale: 히브리어가 포함하는 일반적 행위를 그대로 옮기되, 원문에 없는 ‘모든’을 덧붙이지 않도록 했습니다.
- source_word: וּגְבוּרָתוֹ
  english_pob_choice: and his might
  chosen_korean: 그리고 그의 힘
  alternatives_korean:
  - 그리고 그의 능력
  - 그리고 그의 용맹
  - 그리고 그의 무훈
  lexicon: HALOT
  rationale: גְּבוּרָה는 여기서 추상적 ‘힘/강함’을 가리키므로, 무공을 뜻하는 방향으로 좁히기보다 포괄적인 ‘힘’으로 옮겼습니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  english_pob_choice: the Book of the Chronicles
  chosen_korean: 역대기
  alternatives_korean:
  - 기록의 책
  - 연대기
  - 역사의 책
  lexicon: HALOT
  rationale: 해당 공식 명칭은 한국어 성경에서 익숙한 ‘역대기’로 옮기되, 왕들의 공식 기록집이라는 문맥은 유지했습니다.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  english_pob_choice: of the Kings of Israel
  chosen_korean: 이스라엘 왕들의
  alternatives_korean:
  - 이스라엘의 왕들의
  - 이스라엘 왕들에 관한
  lexicon: HALOT
  rationale: לְ가 표시하는 소속/관련을 한국어 소유격으로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 수사적 질문의 기능
  chosen_reading: “기록되어 있지 않습니까?”로 옮겨, 단순 정보 전달이 아니라 왕조 기록을 가리키는 관례적 수사문으로 살렸습니다.
  alternative_readings:
  - “기록되어 있지 않습니까?”
  - “기록된 것이 아닙니까?”
  - “기록되어 있지 않습니까?”
  rationale: 열왕기의 정형화된 종결 문구로서 독자에게 공식 사료를 환기하는 효과가 있으므로, 평서형보다 수사적 질문을 유지하는 편이 본문 기능에 충실합니다.
  doctrine_reference: 성경 내 역사 서술의 관례적 문체
- issue: ‘역대기’의 책명 처리
  chosen_reading: 일반 명사처럼 풀지 않고 ‘역대기’로 옮겼습니다.
  alternative_readings:
  - ‘연대기의 책’
  - ‘왕들의 연대기’
  rationale: 히브리어 관용구가 가리키는 공식 기록집을 독자가 즉시 알아볼 수 있도록 하면서, 본문의 역사 기록 지시를 보존합니다.
  doctrine_reference: 정경 내 역사서 명칭의 관례
