  yaml_path: translation/ot/1_kings/016/008.yaml
  text: In the twenty-sixth year of Asa king of Judah, Elah son of Baasha became king over Israel in Tirzah for two years.
translation:
  language: ko
  text: 유다 왕 아사의 스물여섯째 해에, 엘라 곧 바아사의 아들이 이스라엘의 왕이 되어 디르사에서 두 해 동안 다스렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֵׁשׁ שָׁנָה
  english_pob_choice: In the twenty-sixth year
  chosen_korean: 아사의 스물여섯째 해에
  alternatives_korean:
  - 아사의 스물여섯 해에
  - 아사의 제26년에
  lexicon: WLC regnal formula; HALOT
  rationale: 히브리어 연대 공식의 관용적 왕위 연대를 살려, 자연스러운 한국어로 '스물여섯째 해에'라고 옮겼습니다.
- source_word: מֶלֶךְ יְהוּדָה
  english_pob_choice: king of Judah
  chosen_korean: 유다 왕
  alternatives_korean:
  - 유다의 왕
  - 유다의 통치자
  lexicon: WLC; HALOT
  rationale: 왕호 수식은 한국어 성경 관용에 맞게 '유다 왕'으로 압축해 자연스럽게 처리했습니다.
- source_word: מָלַךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되어
  alternatives_korean:
  - 다스리기 시작하여
  - 즉위하여
  lexicon: HALOT
  rationale: 접속적 서술에서 מָלַךְ의 즉위/통치 개시를 살려 '왕이 되어'로 옮겼습니다.
- source_word: עַל יִשְׂרָאֵל
  english_pob_choice: over Israel
  chosen_korean: 이스라엘의 왕
  alternatives_korean:
  - 이스라엘 위에
  - 이스라엘을 다스리는
  lexicon: HALOT
  rationale: 지배 대상을 한국어 관용으로 풀어 '이스라엘의 왕'이라 하여 원문의 통치 관계를 분명히 했습니다.
- source_word: בְּתִרְצָה
  english_pob_choice: in Tirzah
  chosen_korean: 디르사에서
  alternatives_korean:
  - 디르사 안에서
  - 디르사에
  lexicon: WLC proper noun
  rationale: 지명은 현대 음역 관행에 따라 '디르사'로 옮기고, स्थान 부사격은 '-에서'로 처리했습니다.
