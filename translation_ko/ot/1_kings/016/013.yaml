base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/013.yaml
  text: because of all the sins of Baasha and the sins of Elah his son[a], which they committed and by which they caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
  footnotes:
  - marker: a
    text: Hebrew 'with their vanities' or 'with their worthless things,' a common polemical expression for idols.
    reason: lexical_alternative
translation:
  language: ko
  text: 바아사의 모든 죄와 그의 아들 엘라의 죄, 곧 그들이 지은 죄와 그 죄로 이스라엘을 죄짓게 하여, 그들의 헛것으로 이스라엘의 하나님 야훼를 노하게 한 일 때문이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '그들의 헛것들/무가치한 것들'입니다. 여기서는 우상을 가리키는 폄하적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל חַטֹּאות
  english_pob_choice: all the sins
  chosen_korean: 모든 죄
  alternatives_korean:
  - 온갖 죄
  - 모든 죄악
  lexicon: HALOT
  rationale: 총괄적 범위를 살리되 한국어에서는 '모든 죄'가 가장 직접적이고 자연스럽습니다.
- source_word: וְחַטֹּאות אֵלָה בְנוֹ
  english_pob_choice: and the sins of Elah his son
  chosen_korean: 그의 아들 엘라의 죄
  alternatives_korean:
  - 엘라 그의 아들의 죄
  - 그 아들 엘라의 죄
  lexicon: HALOT
  rationale: 소유 관계를 자연스럽게 풀어, 엘라가 바아사의 아들임을 분명히 했습니다.
- source_word: וַאֲשֶׁר הֶחֱטִיאוּ אֶת יִשְׂרָאֵל
  english_pob_choice: and by which they caused Israel to sin
  chosen_korean: 그 죄로 이스라엘을 죄짓게 하여
  alternatives_korean:
  - 이스라엘을 죄짓게 하여
  - 이스라엘로 죄를 짓게 하여
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 '죄짓게 하다'로 옮겼고, 바로 앞의 '죄'를 되받아 연결했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 문맥상 지시하는 언약 이름을 본문에서 그대로 드러내기 위해 '야훼'를 사용했습니다.
- source_word: בְּהַבְלֵיהֶם
  english_pob_choice: with their idols
  chosen_korean: 그들의 헛것으로
  alternatives_korean:
  - 그들의 우상으로
  - 그들의 허무한 것들로
  lexicon: HALOT
  rationale: 직역하면 '헛것들/무가치한 것들'이지만, 여기서는 우상 비판의 관용적 표현을 한국어로도 보존하기 위해 '헛것'으로 옮겼습니다.
theological_decisions:
