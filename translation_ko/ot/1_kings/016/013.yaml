  - 여호와
  rationale: POB의 원칙대로 신적 호칭으로 대체하지 않고, 원어의 고유성을 드러내는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
