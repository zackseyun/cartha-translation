base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/025.yaml
  text: Omri did what was evil in the eyes of Yahweh[a], and he did more evil than all who were before him.
  footnotes:
  - marker: a
    text: Or, 'and he was more evil than all who were before him.' The Hebrew verb can be understood as describing Omri himself or his actions; the main text preserves the common evaluative sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 오므리는 야훼[a]의 눈에 악한 일을 행했고, 자기 앞에 있던 모든 사람보다 더 악을 행했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 그는 자기 앞에 있던 모든 사람보다 더 악했습니다.’ 히브리어 동사는 오므리 자신을 묘사하는 뜻으로도, 그의 행위를 묘사하는 뜻으로도 읽을 수 있습니다. 본문은 문맥상 흔한 평가적 의미를 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה / הָרַע
  english_pob_choice: did what was evil
  chosen_korean: 악한 일을 행했고
  alternatives_korean:
  - 악을 행했고
  - 악한 일을 했고
  lexicon: HALOT
  rationale: עשה + הרע의 관용적 평가 표현을 한국어에서 자연스럽게 살려, 단순한 행위가 아니라 ‘악한 일’을 저질렀다는 뜻이 드러나도록 옮겼습니다.
- source_word: בְּעֵינֵי
  english_pob_choice: in the eyes of
  chosen_korean: …의 눈에
  alternatives_korean:
  - …의 보기에
  - …앞에서
  lexicon: HALOT
  rationale: 히브리어의 평가 관용구를 보존하기 위해 직역에 가까운 ‘…의 눈에’를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥상 신적 고유명사를 가리키므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וַיָּרַע מִכֹּל אֲשֶׁר לְפָנָיו
  english_pob_choice: and he did more evil than all who were before him
  chosen_korean: 자기 앞에 있던 모든 사람보다 더 악을 행했습니다
  alternatives_korean:
  - 자기 앞에 있던 모든 사람보다 더 악했습니다
  - 그는 자기보다 앞선 모든 이보다 더 악하게 행동했습니다
  lexicon: HALOT
  rationale: 비교 구문을 한국어에서 자연스럽게 풀어, ‘악을 행했습니다’로 앞 절과 동사적 평행을 유지했습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 본문에서 יְהוָה를 인칭 고유명사로 드러내는 ‘야훼’를 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 하나님의 이름 자체를 직접 사용하므로, 칭호로 치환하지 않고 고유명사를 보존하는 편이 소스의 의미를 더 투명하게 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 마지막 절의 비교 의미
  chosen_reading: ‘더 악을 행했습니다’로 옮겨 행위 평가를 유지했습니다.
  alternative_readings:
  - 더 악했습니다
  - 그 자신이 더 악했습니다
  rationale: 히브리어는 오므리의 인격보다 그의 행위를 평가하는 서술로 읽히는 것이 자연스러우므로, 본문 전체의 판결 형식을 살렸습니다.
  doctrine_reference: 'POB audit trail: lexical alternative on וַיָּרַע'
