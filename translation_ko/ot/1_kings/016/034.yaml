  text: בְּ/יָמָ֞י/ו בָּנָ֥ה חִיאֵ֛ל בֵּ֥ית הָאֱלִ֖י אֶת יְרִיחֹ֑ה בַּ/אֲבִירָ֨ם בְּכֹר֜/וֹ יִסְּדָ֗/הּ ו/ב/שגיב צְעִיר/וֹ֙ הִצִּ֣יב דְּלָתֶ֔י/הָ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד יְהוֹשֻׁ֥עַ בִּן נֽוּן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/034.yaml
  text: In his days Hiel of Bethel rebuilt Jericho[a]. At the cost of Abiram his firstborn he laid its foundation, and at the cost of Segub his youngest he set up its gates[b], according to the word of Yahweh that he had spoken through Joshua son of Nun.
  footnotes:
  - marker: a
    text: Or, more literally, 'built Jericho.' 'Rebuilt' reflects the context that Jericho had previously been destroyed.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'in/with Abiram his firstborn ... and in/with Segub his youngest.' The sense is that the rebuilding came at the cost of these sons, in fulfillment of Joshua 6:26.
    reason: alternative_reading
translation:
  language: ko
  text: 아합 시대에 벧엘 사람 히엘이 여리고를 다시 세웠습니다[a]. 그는 장자 아비람을 잃는 대가로 그 성의 기초를 놓았고, 막내 스굽을 잃는 대가로 그 성문들을 세웠습니다[b]. 이는 여호와께서 눈의 아들 여호수아를 통하여 하신 말씀대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘여리고를 세웠습니다’입니다. 그러나 문맥상 여리고는 이전에 파괴된 성읍이므로, ‘다시 세웠습니다’는 문맥적 의미를 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 장자 아비람으로/아비람과 함께 … 그의 막내 스굽으로/스굽과 함께’라고 합니다. 여호수아 6:26과의 연관 속에서, 이 재건이 두 아들을 잃는 대가로 이루어졌다는 뜻으로 이해됩니다.
    reason: alternative_reading
lexical_decisions:
