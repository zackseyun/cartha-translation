  edition: WLC
  text: בְּ/יָמָ֞י/ו בָּנָ֥ה חִיאֵ֛ל בֵּ֥ית הָאֱלִ֖י אֶת יְרִיחֹ֑ה בַּ/אֲבִירָ֨ם בְּכֹר֜/וֹ יִסְּדָ֗/הּ ו/ב/שגיב צְעִיר/וֹ֙ הִצִּ֣יב דְּלָתֶ֔י/הָ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד יְהוֹשֻׁ֥עַ בִּן נֽוּן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/034.yaml
  text: In his days Hiel of Bethel rebuilt Jericho[a]. At the cost of Abiram his firstborn he laid its foundation, and at the cost of Segub his youngest he set up its gates[b], according to the word of Yahweh that he had spoken through Joshua son of Nun.
  footnotes:
  - marker: a
    text: Or, more literally, 'built Jericho.' 'Rebuilt' reflects the context that Jericho had previously been destroyed.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'in/with Abiram his firstborn ... and in/with Segub his youngest.' The sense is that the rebuilding came at the cost of these sons, in fulfillment of Joshua 6:26.
    reason: alternative_reading
translation:
  language: ko
  text: 그의 시대에 벧엘 사람 힐이 여리고를 다시 세웠습니다[a]. 장자 아비람을 잃는 대가로 그 성의 기초를 놓았고, 막내 스굽을 잃는 대가로 그 문들을 세웠습니다[b]. 이는 여호와께서 눈의 아들 여호수아를 통해 말씀하신 말씀대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘여리고를 세웠습니다’입니다. 그러나 문맥상 여리고는 이미 파괴된 성읍이므로, ‘다시 세웠습니다’가 의미를 더 분명히 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘아비람과 함께/아비람 안에서 … 스굽과 함께/스굽 안에서’입니다. 뜻은 그 재건이 두 아들의 희생을 대가로 치러졌다는 것입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיָמָיו
  english_pob_choice: In his days
  chosen_korean: 그의 시대에
  alternatives_korean:
  - 그의 날들에
  - 그가 통치하던 때에
  lexicon: HALOT
  rationale: 히브리어 관용적 시간표현을 자연스러운 한국어로 옮기되, 앞선 왕의 통치 기간이라는 뜻을 살렸습니다.
- source_word: חִיאֵל בֵּית הָאֱלִי
  english_pob_choice: Hiel of Bethel
  chosen_korean: 벧엘 사람 힐
  alternatives_korean:
  - 벧엘의 힐
  - 벧엘 출신 힐
  lexicon: HALOT
  rationale: 지명 연계형을 한국어의 출신 표지로 자연스럽게 풀어, 인명과 출신을 함께 드러냈습니다.
- source_word: בָּנָה
  english_pob_choice: rebuilt
  chosen_korean: 다시 세웠습니다
  alternatives_korean:
  - 재건했습니다
  - 세웠습니다
  lexicon: HALOT
  rationale: 여리고가 이미 파괴된 성읍이라는 문맥을 반영해 단순한 ‘세우다’보다 ‘다시 세우다’를 택했습니다.
- source_word: בַּאֲבִירָם ... וּבִשְׂגוּב ...
  english_pob_choice: At the cost of Abiram ... and at the cost of Segub ...
  chosen_korean: 아비람을 잃는 대가로 ... 스굽을 잃는 대가로
  alternatives_korean:
  - 아비람과 함께 ... 스굽과 함께
  - 아비람으로 ... 스굽으로
  lexicon: HALOT
  rationale: 히브리어 전치사의 도구적/동반적 뉘앙스가 자식의 죽음을 통한 대가라는 뜻으로 읽히므로, 의미를 분명히 드러내는 표현을 사용했습니다.
- source_word: צְעִירוֹ
  english_pob_choice: his youngest
  chosen_korean: 막내
  alternatives_korean:
  - 가장 어린 아들
  - 어린 아들
  lexicon: HALOT
  rationale: 가족 내 출생서열을 나타내는 말로서 한국어의 자연스러운 대응인 ‘막내’를 사용했습니다.
- source_word: כִּדְבַר יְהוָה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 여호와께서 말씀하신 말씀대로
  alternatives_korean:
  - 여호와의 말씀대로
  - 야훼의 말씀대로
  lexicon: HALOT
  rationale: 본문의 예언 성취 공식을 유지하면서, POB의 야훼 표기는 한국어 본문 가독성과 관용을 고려해 설명 문구로 풀었습니다.
- source_word: בְּיַד יְהוֹשֻׁעַ בִּן נוּן
  english_pob_choice: through Joshua son of Nun
  chosen_korean: 눈의 아들 여호수아를 통해
  alternatives_korean:
  - 눈의 아들 여호수아의 손을 통해
  - 눈의 아들 여호수아로 말미암아
  lexicon: HALOT
  rationale: ‘손을 통해’의 직역보다 한국어에서 예언 매개를 자연스럽게 나타내는 ‘~를 통해’를 선택했습니다.
theological_decisions:
- issue: 여리고 재건과 아들들의 희생 사이의 관계
  chosen_reading: 이 구절은 힐이 여리고를 다시 세우는 일이 첫째 아들과 막내아들의 상실을 대가로 이루어졌고, 그로써 여호와의 말씀이 성취되었다고 말합니다.
  alternative_readings:
  - 단순히 공사 단계의 병렬 묘사로만 읽는 방식
  rationale: 여호수아 6:26의 저주 성취를 직접 상기시키는 문맥이므로, 희생과 성취의 긴장을 흐리지 않고 드러냈습니다.
  doctrine_reference: 본문의 신학적 긴장을 보존하는 최적 대응
