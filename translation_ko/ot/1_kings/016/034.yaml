revisions:
- from: 그의 시대에 벧엘 사람 힐이 여리고를 다시 세웠습니다[a]. 장자 아비람을 잃는 대가로 그 성의 기초를 놓았고, 막내 스굽을 잃는 대가로 그 문들을 세웠습니다[b]. 이는 여호와께서 눈의 아들 여호수아를 통해 말씀하신 말씀대로였습니다.
  to: 아합 시대에 벧엘 사람 히엘이 여리고를 다시 세웠습니다[a]. 그는 장자 아비람을 잃는 대가로 그 성의 기초를 놓았고, 막내 스굽을 잃는 대가로 그 성문들을 세웠습니다[b]. 이는 여호와께서 눈의 아들 여호수아를 통하여 하신 말씀대로였습니다.
  rationale: 아합을 명시하여 시간 표현의 선행사를 분명히 하고, 히엘의 관용 음역을 적용했습니다. 도시 건축 문맥에 맞게 ‘성문들’로 다듬었으며, 마지막 문장은 원문의 ‘여호와께서 여호수아를 통하여 말씀하신 말씀’이라는 구조를 자연스럽게 옮겼습니다. 각주는 재건·상실의 해석이 문맥 및 여호수아 6:26의 반향에 근거함을 밝히면서도 히브리어 전치사의 문자적 폭을 보존합니다.
  reviewer_model: gpt-5.6-terra
