- from: 그의 종 지므리[a]는 병거 절반의 지휘관이었는데, 그가 디르사에서 아르자의 집[b]—그가 왕실 가사에 책임이 있던 곳—에 있을 때 그를 상대로 반역을 꾀하고 있었습니다.
  to: 그의 신하 지므리는 병거 절반의 지휘관이었습니다. 그는 엘라가 디르사에서 왕궁 살림을 맡고 있던 아르자의 집[b]에서 술을 마시며 취해 있던[a] 동안, 그를 상대로 음모를 꾸몄습니다.
  rationale: 엘라의 음주 상태를 복원하고, 아르자가 왕궁 업무를 맡은 관리였다는 관계절의 수식 대상을 바로잡았습니다. 또한 엘라를 명시하여 사건의 주체와 상황절의 인물을 분명히 했으며, 두 각주를 해당 어휘에 맞게 재배치했습니다.
