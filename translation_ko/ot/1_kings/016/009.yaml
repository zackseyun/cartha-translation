id: 1KI.16.9
reference: 1 Kings 16:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֤ר עָלָי/ו֙ עַבְדּ֣/וֹ זִמְרִ֔י שַׂ֖ר מַחֲצִ֣ית הָ/רָ֑כֶב וְ/ה֤וּא בְ/תִרְצָה֙ שֹׁתֶ֣ה שִׁכּ֔וֹר בֵּ֣ית אַרְצָ֔א אֲשֶׁ֥ר עַל הַ/בַּ֖יִת בְּ/תִרְצָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/009.yaml
  text: But his servant Zimri[a], commander of half the chariots, conspired against him while he was in Tirzah, drinking himself drunk in the house of Arza[b], who was over the household in Tirzah.
  footnotes:
  - marker: a
    text: Or 'drinking to drunkenness.' The Hebrew expression is vivid, describing active drinking that resulted in intoxication.
    reason: lexical_alternative
  - marker: b
    text: '''Over the household'' is an administrative title, likely referring to the official in charge of the royal household or palace.'
    reason: cultural_note
translation:
  language: ko
  text: 그의 종 지므리[a]는 병거 절반의 지휘관이었는데, 그가 디르사에서 아르자의 집[b]—그가 왕실 가사에 책임이 있던 곳—에 있을 때 그를 상대로 반역을 꾀하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘취하도록 마시며’라고도 옮길 수 있습니다. 히브리어 표현은 적극적으로 마셔서 취기에 이르는 모습을 생생하게 묘사합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘왕실 가사에 책임이 있던’은 히브리어 관용구 ‘집 위에 있는 자’를 풀어 옮긴 것입니다. 왕실 또는 궁정 행정을 맡은 고위 관리직을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  english_pob_choice: conspired against him
  chosen_korean: 그를 상대로 반역을 꾀하고 있었습니다
  alternatives_korean:
  - 그를 상대로 음모를 꾸미고 있었습니다
  - 그에게 반역을 꾀하고 있었습니다
  lexicon: HALOT
  rationale: 왕정 서술에서 קשר עַל은 단순한 사적 모의보다 통치자에 대한 반역적 결탁을 뜻하므로, ‘반역을 꾀하다’로 정치적 함의를 살렸습니다.
- source_word: עַבְדּוֹ
  english_pob_choice: his servant
  chosen_korean: 그의 종
  alternatives_korean:
  - 그의 신하
  - 그의 관리
  lexicon: HALOT
  rationale: 직역상 ‘종’이 기본값이며, 왕궁 맥락의 직함 가능성은 문맥으로 드러나므로 본문에서는 과도한 해석 없이 유지했습니다.
- source_word: שַׂר מַחֲצִית הָרָכֶב
  english_pob_choice: commander of half the chariots
  chosen_korean: 병거 절반의 지휘관
  alternatives_korean:
  - 병거 절반의 사령관
  - 병거 반의 지휘관
  - 병거 부대 절반의 지휘관
  lexicon: HALOT
  rationale: שַׂר는 지휘관, רכב는 병거 병력을 가리키므로 구조를 따라 자연스러운 한국어 관용으로 옮겼습니다.
- source_word: שֹׁתֶה שִׁכּוֹר
  english_pob_choice: drinking himself drunk
  chosen_korean: 술에 취하도록 마시고 있었습니다
  alternatives_korean:
  - 술에 취할 때까지 마시고 있었습니다
  - 술 취하도록 마시고 있었습니다
  - 술에 취해 가고 있었습니다
  lexicon: HALOT
  rationale: 분사와 형용사가 결합한 생생한 표현으로, 단순히 ‘취해 있었다’보다 능동적 음주로 인한 취기를 드러내기 위해 결과를 명시했습니다.
- source_word: בֵּית אַרְצָא
  english_pob_choice: in the house of Arza
  chosen_korean: 아르자의 집
  alternatives_korean:
  - 아르자의 집 안
  - 아르자의 집에서
  lexicon: HALOT
  rationale: בית + 인명은 자연스럽게 ‘~의 집’으로 옮기며, 장소 표지를 과도하게 중복하지 않도록 했습니다.
- source_word: אֲשֶׁר עַל הַבַּיִת
  english_pob_choice: who was over the household
  chosen_korean: 왕실 가사에 책임이 있던 곳
  alternatives_korean:
  - 가사 위에 있던 자
  - 궁정 살림을 맡은 자
  lexicon: HALOT
  rationale: עַל־הַבַּיִת는 왕실/궁정 가사를 총괄하는 직책이므로, 한국어로는 기능을 분명히 드러내되 ‘집 위에’ 같은 직역투는 피했습니다.
theological_decisions:
- issue: 왕궁 직책 표현의 범위
  chosen_reading: ‘아르자의 집’ 뒤에 ‘그가 왕실 가사에 책임이 있던 곳’이라고 풀어, المكان과 직책 의미를 함께 전달했습니다.
  alternative_readings:
  - ‘왕실의 집을 맡은 자’
  - ‘궁정의 집을 관장한 자’
  rationale: 본문은 단순한 물리적 주거보다 행정 직무를 가리키므로, 독자가 지위를 오해하지 않도록 설명적 표현을 보탰습니다.
  doctrine_reference: 역사서의 직함 해석 원칙
