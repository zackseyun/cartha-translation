id: 1KI.16.2
reference: 1 Kings 16:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר הֲרִימֹתִ֨י/ךָ֙ מִן הֶ֣/עָפָ֔ר וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֣/י יִשְׂרָאֵ֑ל וַ/תֵּ֣לֶךְ בְּ/דֶ֣רֶךְ יָרָבְעָ֗ם וַֽ/תַּחֲטִא֙ אֶת עַמִּ֣/י יִשְׂרָאֵ֔ל לְ/הַכְעִיסֵ֖/נִי בְּ/חַטֹּאתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/002.yaml
  text: Because I raised you up from the dust and made you ruler over my people Israel[a], and you walked in the way of Jeroboam and caused my people Israel to sin, provoking me to anger by their sins,
  footnotes:
  - marker: a
    text: Or 'and made my people Israel sin.' The Hebrew verb is causative.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 먼지에서 일으켜 내 백성 이스라엘 위에 지도자로 세웠고, 네가 여로보암의 길을 따라 내 백성 이스라엘을 죄짓게 하여 그들의 죄로 나를 노하게 하였으므로,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲרִימֹתִיךָ מִן הֶעָפָר
  english_pob_choice: I raised you up from the dust
  chosen_korean: 너를 먼지 속에서 들어 올려
  alternatives_korean:
  - 너를 흙먼지에서 끌어올려
  - 너를 티끌에서 높여
  lexicon: HALOT
  rationale: ‘들어 올리다’는 רוּם의 신분 상승 이미지를 살리면서 현대 한국어로 자연스럽게 옮깁니다. עָפָר는 ‘먼지/티끌’ 중에서도 낮아짐을 드러내는 ‘먼지 속’으로 처리했습니다.
- source_word: וָאֶתֶּנְךָ נָגִיד עַל עַמִּי יִשְׂרָאֵל
  english_pob_choice: and made you ruler over my people Israel
  chosen_korean: 내 백성 이스라엘 위에 지도자로 세웠는데도
  alternatives_korean:
  - 내 백성 이스라엘 위에 통치자로 삼았는데도
  - 내 백성 이스라엘의 통치자로 세웠는데도
  lexicon: HALOT
  rationale: נָגִיד는 왕권 맥락에서 ‘지도자/통치자’가 가능하나, 한국어에서는 ‘지도자’가 권한 부여를 비교적 자연스럽게 전달합니다. ‘세웠는데도’는 뒤의 책망 구문과 연결되는 결과적 대비를 담되, 히브리어 자체를 넘어서지 않도록 과도한 역접은 피했습니다.
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  english_pob_choice: you walked in the way of Jeroboam
  chosen_korean: 너는 여로보암의 길로 걸어가
  alternatives_korean:
  - 너는 여로보암의 길을 따랐고
  - 너는 여로보암의 길을 걸었고
  lexicon: HALOT
  rationale: ‘walked in the way of’는 성경적 관용구이므로 ‘길로 걸어가’로 보존했습니다. 도덕적·행동적 반복성을 유지하면서도 현대 문체로 다듬었습니다.
- source_word: וַתַּחֲטִא אֶת עַמִּי יִשְׂרָאֵל
  english_pob_choice: caused my people Israel to sin
  chosen_korean: 내 백성 이스라엘을 죄짓게 하였고
  alternatives_korean:
  - 내 백성 이스라엘이 죄를 짓게 하였고
  - 내 백성 이스라엘을 죄로 이끌었고
  lexicon: HALOT
  rationale: חטא의 히필은 사역형이므로 ‘죄짓게 하다’가 원인 부여를 직접 드러냅니다. POB의 causative 판단을 한국어에서도 분명히 살렸습니다.
- source_word: לְהַכְעִיסֵנִי בְּחַטֹּאתָם
  english_pob_choice: provoking me to anger by their sins
  chosen_korean: 그들의 죄로 나를 화나게 하였습니다
  alternatives_korean:
  - 그들의 죄로 나를 분노하게 하였습니다
  - 그들의 죄로 내 진노를 일으켰습니다
  lexicon: HALOT
  rationale: הכעס은 단순한 ‘화’가 아니라 하나님의 분노를 포함하므로, 합쇼체에서 직설적으로 ‘화나게 하였습니다’로 옮겼습니다. ‘그들의 죄로’는 בְ의 도구적 의미를 반영합니다.
theological_decisions:
- issue: 말하는 주체의 존칭 처리
  chosen_reading: 하나님께 직접 말하는 인용문이므로 1인칭은 평서형이지만, 한국어 문장 전체는 예언적 책망의 직접 화법으로 처리했습니다.
  alternative_readings:
  - 전부 서술문으로 평탄화할 수 있음
  - 일부 구어체로 완화할 수 있음
  rationale: 원문은 야훼의 직접 발화이므로 한국어에서도 신적 발화의 긴장을 유지해야 합니다. 다만 본절은 독백이 아니라 책망 선언이므로 과도한 경어체보다는 간결한 직접 진술이 적절합니다.
  doctrine_reference: 신적 발화의 직접성, 예언서/열왕기 책망 문체
