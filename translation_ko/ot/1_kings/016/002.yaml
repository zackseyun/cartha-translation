  to: 내가 너를 먼지에서 일으켜 내 백성 이스라엘 위에 지도자로 세웠고, 네가 여로보암의 길을 따라 내 백성 이스라엘을 죄짓게 하여 그들의 죄로 나를 노하게 하였으므로,
  rationale: 'The revision removes the unsupported concessive and locative additions, uses a natural Korean rendering of the biblical conduct idiom, and retains the causal continuation of יַעַן אֲשֶׁר for the judgment completed in the following verse. The causative relationship and the plural referent of ‘their sins’ remain explicit. No footnote is required in Korean: the causative force is directly represented by ‘죄짓게 하여,’ and the English alternative does not mark a distinct source-text ambiguity.'
