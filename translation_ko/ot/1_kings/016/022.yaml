    rationale: 제시된 각주는 וַיֶּחֱזַק(우세해지다/더 강하다)의 어휘적 대안을 설명하므로, 해당 번역어에 표지를 붙여야 합니다.
  - severity: low
    issue: ‘그래서’가 원문의 단순 서사 연결보다 인과를 강하게 나타냅니다.
