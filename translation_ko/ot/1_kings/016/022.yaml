source:
  edition: WLC
  text: וַ/יֶּחֱזַ֤ק הָ/עָם֙ אֲשֶׁ֣ר אַחֲרֵ֣י עָמְרִ֔י אֶת הָ/עָ֕ם אֲשֶׁ֥ר אַחֲרֵ֖י תִּבְנִ֣י בֶן גִּינַ֑ת וַ/יָּ֣מָת תִּבְנִ֔י וַ/יִּמְלֹ֖ךְ עָמְרִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/022.yaml
  text: But the people who followed Omri prevailed over the people who followed Tibni son of Ginath. So Tibni died[a], and Omri became king.
  footnotes:
  - marker: a
    text: Or 'were stronger than' / 'grew stronger than.' The Hebrew verb can denote strength or superiority; here it refers to Omri's faction gaining the upper hand in the civil conflict.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 오므리를 따르는 백성이 기낫의 아들 디브니를 따르는 백성보다 우세해졌습니다[a]. 디브니가 죽고, 오므리가 왕이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더 강했습니다’ 또는 ‘더 강해졌습니다’. 히브리어 동사는 강함이나 우세를 가리킬 수 있으며, 여기서는 오므리 편이 내전에서 우세해진 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  english_pob_choice: prevailed
  chosen_korean: 이겼습니다
  alternatives_korean:
  - 강해졌습니다
  - 우세했습니다
  - 더 강했습니다
  lexicon: HALOT
  rationale: 이 동사구는 단순한 내부 강함이 아니라 상대 진영을 누르고 우세해진 뜻이므로, 현대 한국어에서는 전투·정쟁 맥락에 자연스러운 ‘이겼습니다’로 옮겼습니다.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי עָמְרִי
  english_pob_choice: the people who followed Omri
  chosen_korean: 오므리 편의 사람들
  alternatives_korean:
  - 오므리를 따르던 사람들
  - 오므리를 뒤따르던 사람들
  lexicon: HALOT
  rationale: אַחֲרֵי는 여기서 시간적 ‘뒤에’가 아니라 정치적 추종·편을 뜻하므로, 문맥상 자연스럽고 간결한 ‘편’으로 풀었습니다.
- source_word: תִּבְנִי בֶן גִּינַת
  english_pob_choice: Tibni son of Ginath
  chosen_korean: 디브니 가인의 아들
  alternatives_korean:
  - 티브니 가인의 아들
  - 디브니, 가인의 아들
  lexicon: project transliteration standard
  rationale: 고유명사는 현대 외래어 표기법을 따르되, בן은 족보·식별 기능을 그대로 살려 ‘~의 아들’로 옮겼습니다.
- source_word: וַיִּמְלֹךְ עָמְרִי
  english_pob_choice: Omri became king
  chosen_korean: 오므리는 왕이 되었습니다
  alternatives_korean:
  - 오므리는 다스리기 시작했습니다
  - 오므리는 통치자가 되었습니다
  lexicon: HALOT
  rationale: מלך의 여기서의 기능은 단순한 통치 지속보다 즉위·왕위 승계를 가리키므로, ‘왕이 되었습니다’가 가장 직접적입니다.
theological_decisions:
- issue: ‘prevailed over’의 전투/정쟁적 의미를 어떻게 드러낼지
  chosen_reading: 오므리 편이 디브니 편보다 우세하여 결국 왕위가 오므리에게 넘어간 정치적 승리로 읽었습니다.
  alternative_readings:
  - 단순히 ‘강해졌습니다’로 이해하는 읽기
  - 도덕적 우열로 읽는 해석
  rationale: 문맥은 개인의 내적 강함이 아니라 두 세력의 내전적 대결이므로, 결과 중심의 정치적 승리를 드러내는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 역사서 문맥과 서술 기능
- issue: ‘죽었다’와 ‘왕이 되었다’의 서사 연결
  chosen_reading: 디브니의 죽음 뒤에 오므리의 즉위가 이어지는 순차적 서술로 유지했습니다.
  alternative_readings:
  - 인과를 강하게 암시하는 번역
  - 두 사건을 느슨하게 병렬하는 번역
  rationale: 와우 연속의 서사 진행을 살려, 인과를 과도하게 부풀리지 않으면서도 사건의 전환을 분명히 했습니다.
  doctrine_reference: 히브리어 서사체의 시제·연결법
