  lexicon: HALOT
  rationale: 예언 공식의 정식 표현을 살리기 위해 '말씀'을 택했고, 본문의 신명 표기는 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
- source_word: לְהַכְעִיסוֹ
  english_pob_choice: provoking him to anger
