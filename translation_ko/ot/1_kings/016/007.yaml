    rationale: 본문도 각주도 ‘그를 쳤기 때문’으로 되어 있어 대안 독법을 제공하지 못합니다. 문제는 번역어 자체보다 ‘그’의 지시 대상이므로, 각주에서 여로보암 개인 또는 그의 집/왕조라는 가능한 지시 대상을 밝혀야 합니다.
