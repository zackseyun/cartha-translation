  lexicon: HALOT
  rationale: 예언자적 매개를 나타내는 관용구이므로, 한국어에서도 수단·매개를 자연스럽게 드러내는 '통해'가 적절합니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 주님의 말씀
  lexicon: HALOT
  rationale: 예언 공식의 정식 표현을 살리기 위해 '말씀'을 택했고, 본문의 신명 표기는 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
- source_word: לְהַכְעִיסוֹ
  english_pob_choice: provoking him to anger
  chosen_korean: 그를 격노하게 한
  alternatives_korean:
  - 그를 화나게 한
  - 그의 분노를 일으킨
  lexicon: HALOT
  rationale: 원문의 사역적 뉘앙스를 살리되, 현대 한국어에서 심판 문맥의 강한 감정 반응을 나타내는 표현으로 옮겼습니다.
- source_word: כְּ/בֵית יָרָבְעָם
  english_pob_choice: by becoming like the house of Jeroboam
  chosen_korean: 여로보암의 집과 같이 된
  alternatives_korean:
  - 여로보암의 집처럼 된
  - 여로보암 집과 같이 되어
  lexicon: HALOT
  rationale: '''집''은 단순 가정보다 왕조/가문 전체를 포괄하므로, 문맥의 동적 대응과 심판의 범위를 함께 살리는 표현을 유지했습니다.'
- source_word: וְעַל אֲשֶׁר הִכָּה אֹתֽוֹ
  english_pob_choice: and because he struck him down
  chosen_korean: 그리고 그를 쳤기 때문입니다
  alternatives_korean:
  - 그리고 그를 죽였기 때문입니다
  - 또 그를 친 것 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 직접적 동사를 따라 '쳤다'로 두어, 본문이 여기서 명시적으로 말하는 행위를 과도하게 구체화하지 않았습니다.
