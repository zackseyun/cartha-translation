base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/007.yaml
  text: And also through Jehu son of Hanani the prophet[a], the word of Yahweh came against Baasha and against his house, both because of all the evil that he did in the sight of Yahweh, provoking him to anger by the work of his hands, by becoming like the house of Jeroboam, and because he struck him down.
  footnotes:
  - marker: a
    text: Or 'and because he struck him down.' The Hebrew suffix is singular masculine and may refer either to Jeroboam personally or, more likely in context, to his house/dynasty as a collective.
    reason: alternative_reading
translation:
  language: ko
  text: 또한 제사의 아들 예후 곧 하나니의 예언자를 통해 야훼의 말씀이 바아사와 그의 집에 임했습니다. 이는 그가 야훼의 눈앞에서 행한 모든 악과, 자기 손으로 한 일로 그를 격노하게 한 일과, 여로보암의 집과 같이 된 일과, 그리고 그를 쳤기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 그를 쳤기 때문이다.” 히브리어의 목적어 접미사는 남성 단수형이며, 문맥상 여로보암 개인을 가리킬 수도 있고 더 가능성 있게는 그의 집/왕조를 집합적으로 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: And also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고 또한
  - 더욱이
  lexicon: HALOT
  rationale: 앞선 심판 선언에 덧붙는 연결을 자연스럽게 살리면서, 추가 의미를 분명하게 표현합니다.
- source_word: בְּיַד
