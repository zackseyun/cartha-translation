  lexicon: HALOT
  rationale: 군사적 의미의 צור를 ‘포위하다’로 옮겨 성문을 둘러싼 공격 상황을 분명히 하되, 영어 POB의 ‘laid siege to’에 해당하는 표준적 현대 한국어로 정리했습니다.
- source_word: מִגִּבְּתוֹן / תִּרְצָה
