  lexicon: HALOT
  rationale: 집합명사 ‘이스라엘’을 그대로 살리면서, ‘with him’의 동반 관계를 한국어 어순에 맞게 자연스럽게 표현했습니다.
- source_word: וַיָּצֻרוּ עַל
