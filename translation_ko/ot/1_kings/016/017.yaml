theological_decisions:
- issue: 전쟁 서술에서 동사의 강도
  chosen_reading: ‘포위하였습니다’로 번역해 전쟁 행위의 구체성을 유지했습니다.
  alternative_readings:
  - ‘공격하였습니다’
  - ‘에워쌌습니다’
  rationale: 본문은 단순한 이동이 아니라 도시를 둘러싼 군사 행동을 말하므로, 의미를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: Narrative fidelity
- issue: ‘온 이스라엘’의 집합적 의미
  chosen_reading: 이스라엘 전체가 오므리 편에 섰다는 집합적 서술로 읽었습니다.
  alternative_readings:
  - 단순히 군대 전체
  - 북이스라엘 사람들 전체
  rationale: 히브리어의 집합명사적 표현을 보존해, 본문이 정치·군사적 연합을 묘사한다는 점을 드러냈습니다.
  doctrine_reference: Source-text semantics
