source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/רְא֤וֹת זִמְרִי֙ כִּֽי נִלְכְּדָ֣ה הָ/עִ֔יר וַ/יָּבֹ֖א אֶל אַרְמ֣וֹן בֵּית הַ/מֶּ֑לֶךְ וַ/יִּשְׂרֹ֨ף עָלָ֧י/ו אֶת בֵּֽית מֶ֛לֶךְ בָּ/אֵ֖שׁ וַ/יָּמֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/018.yaml
  text: And when Zimri saw that the city had been captured[a], he went into the citadel of the king’s house and burned the king’s house over himself with fire[b], and died.
  footnotes:
  - marker: a
    text: Or 'fortress' or 'palace' for 'citadel'; the Hebrew אַרְמוֹן can refer to a fortified royal structure.
    reason: lexical_alternative
  - marker: b
    text: Literally 'burned the king’s house over himself with fire,' describing Zimri’s self-destruction by setting the royal residence ablaze around himself.
    reason: cultural_note
translation:
  language: ko
  text: 짐리가 성이 함락된 것을 보았을 때, 그는 왕의 집의 요새로 들어가 왕의 집을 불로 자기 위에 태우고 죽었습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 אַרְמוֹן은 ‘요새’ 외에도 ‘성채’나 ‘궁전’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘왕의 집을 불로 자기 위에 태웠다’로, 왕궁을 불태우며 그 안에서 스스로 죽은 장면을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: כִּ/רְא֤וֹת ... כִּֽי נִלְכְּדָ֣ה
  english_pob_choice: when ... saw that the city had been captured
  chosen_korean: 성이 함락된 것을 보았을 때
  alternatives_korean:
  - 성이 빼앗긴 것을 보았을 때
  - 그 성이 함락되었음을 보고
  lexicon: HALOT
  rationale: 시간을 나타내는 구조와 ‘captured’의 완료된 결과를 자연스러운 한국어 과거 관찰 표현으로 옮겼습니다.
- source_word: אַרְמ֣וֹן
  english_pob_choice: citadel
  chosen_korean: 요새
  alternatives_korean:
  - 산성
  - 성채
  - 궁성
  lexicon: HALOT
  rationale: אַרְמוֹן은 방어 시설을 갖춘 왕실 구조를 가리킬 수 있으므로, 뒤따르는 ‘왕의 집’과의 중복을 피하면서도 방어적 성격을 살려 ‘요새’로 옮겼습니다.
- source_word: בֵּית הַ/מֶּ֑לֶךְ
  english_pob_choice: the king’s house
  chosen_korean: 왕의 집
  alternatives_korean:
  - 왕궁
  - 왕실
  - 왕궁 건물
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 유지해 ‘왕의 집’으로 두어, 앞의 אַרְמוֹן과 구별되는 표현을 살렸습니다.
- source_word: וַ/יִּשְׂרֹ֨ף ... בָּ/אֵ֖שׁ
  english_pob_choice: burned ... with fire
  chosen_korean: 불로 자기 위에 태우고
  alternatives_korean:
  - 불로 자기 위에 불태우고
  - 불을 질러 자기 위에 태우고
  lexicon: HALOT
  rationale: ‘over himself’의 자해적·파괴적 의미를 살리되, 한국어로는 자연스럽게 ‘자기 위에 태우고’라고 옮겨 원문의 잔혹한 행위를 분명히 드러냈습니다.
theological_decisions:
- issue: 자살로 끝나는 서술의 표현 수위
  chosen_reading: 직접적인 자멸 행위를 완화하지 않고 서술형으로 그대로 제시했습니다.
  alternative_readings:
  - 스스로 목숨을 끊고
  - 자결하고
  rationale: 본문은 사건의 사실적 전개를 묘사하므로, 윤리적 완화 표현보다 원문의 서술 강도를 유지하는 것이 적절합니다.
  doctrine_reference: 서술 본문은 사건 자체를 있는 그대로 전달해야 한다는 번역 원칙
