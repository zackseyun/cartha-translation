translation:
  language: ko
  text: 그때 이스라엘 백성은 둘로 갈라졌습니다. 백성의 절반은 기낫의 아들 디브니를 따라 그를 왕으로 세우려 했고, 나머지 절반은 오므리를 따랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성의 절반이 기낫의 아들 디브니를 지지하여 그를 왕으로 세우려 했고, 나머지 절반은 오므리를 지지했습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵחָלֵק
  english_pob_choice: were divided
  chosen_korean: 갈라졌습니다
  alternatives_korean:
  - 나뉘었습니다
  - 분열되었습니다
  lexicon: HALOT
  rationale: 니팔형의 ‘나뉘다/갈라지다’라는 의미를 살리되, 현대 한국어에서 자연스럽고 상태 변화를 잘 드러내는 표현을 택했습니다.
- source_word: הָעָם יִשְׂרָאֵל
  english_pob_choice: the people of Israel
  chosen_korean: 이스라엘 백성
  alternatives_korean:
  - 이스라엘의 백성
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 민족 전체를 가리키는 집합적 표현으로는 ‘이스라엘 백성’이 가장 자연스럽고, 원문의 집합명사 느낌도 잘 유지합니다.
- source_word: לַחֵצִי / חֲצִי הָעָם
  english_pob_choice: into two parts / half of the people
  chosen_korean: 두 편 / 백성의 절반
  alternatives_korean:
  - 둘로
  - 반씩
  lexicon: HALOT
  rationale: 히브리어의 ‘절반’ 반복을 한국어에서도 대응시키되, ‘두 편’과 ‘백성의 절반’으로 분배와 대칭을 분명히 했습니다.
- source_word: לְהַמְלִיכוֹ
  english_pob_choice: to make him king
  chosen_korean: 왕으로 세우려 했고
  alternatives_korean:
  - 왕으로 삼으려 했고
  - 왕으로 만들려 했고
  lexicon: HALOT
  rationale: 히필의 ‘왕이 되게 하다’는 뜻을 직역적으로 풀어, 한국어에서 자연스러운 ‘왕으로 세우다’로 옮겼습니다.
theological_decisions:
- issue: 정치적 ‘따르다’ 동사의 뉘앙스
  chosen_reading: 왕위 다툼 속에서 특정 দাব자를 지지하는 정치적 충성의 의미로 ‘따르다’를 사용했습니다.
  alternative_readings:
  - 지지하다
  - 편에 서다
  rationale: 히브리어 אַחֲרֵי는 단순한 물리적 뒤따름이 아니라 왕위 주장자에게 붙는 정치적 지지를 뜻하므로, 문맥상 ‘따르다’가 가장 직접적입니다.
  doctrine_reference: 본문 문맥상 역사서의 정치 서술
