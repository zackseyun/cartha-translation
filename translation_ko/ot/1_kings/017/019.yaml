  rationale: עֲלִיָּה는 위층의 방을 가리키므로, 한국어에서 간결하고 이해하기 쉬운 '윗방'이 본문의 공간성을 잘 살립니다.
- source_word: אֲשֶׁר הוּא יֹשֵׁב שָׁם
  english_pob_choice: where he was staying
  chosen_korean: 자기가 머무르고 있던
  alternatives_korean:
  - 거처하던
  - 살고 있던
  lexicon: HALOT
  rationale: ישב는 여기서 단순한 '앉다'가 아니라 거주/체류를 뜻하므로, 장소의 임시성과 상황성을 담는 '머무르고 있던'으로 옮겼습니다.
- source_word: וַיַּשְׁכִּבֵהוּ עַל מִטָּתוֹ
  english_pob_choice: laid him on his own bed
  chosen_korean: 자기 침대에 뉘었습니다
  alternatives_korean:
  - 자기 침상에 눕혔습니다
  - 자기 침대에 눕혔습니다
  lexicon: HALOT
  rationale: שׁכב의 히필은 '눕게 하다'이므로, 동작의 결과를 분명히 드러내는 '뉘었습니다'를 택했고, מִטָּה는 현대 문맥에서는 '침대'가 가장 자연스럽습니다.
