base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/019.yaml
  text: And he said to her[a], “Give me your son.” Then he took him from her bosom, carried him up to the upper room where he was staying[b], and laid him on his own bed.
  footnotes:
  - marker: a
    text: Or 'from her bosom.' The Hebrew term refers to the chest/lap area and conveys close maternal holding.
    reason: lexical_alternative
  - marker: b
    text: Or 'the upstairs room' or 'the loft.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그녀에게 말했습니다. 「아들을 제게 주십시오.」 그러고 나서 그는 그를 그녀의 품에서 받아[a] 자기가 머무르던 윗방[b]으로 데리고 올라가, 자기 침대에 눕혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘품’은 히브리어 חֵיק를 옮긴 말로, 가슴이나 무릎 가까이에서 안고 있는 자리를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘윗방’은 위층의 방 또는 다락방으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנִי לִי אֶת בְּנֵךְ
