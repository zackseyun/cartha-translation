base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/019.yaml
  text: And he said to her[a], “Give me your son.” Then he took him from her bosom, carried him up to the upper room where he was staying[b], and laid him on his own bed.
  footnotes:
  - marker: a
    text: Or 'from her bosom.' The Hebrew term refers to the chest/lap area and conveys close maternal holding.
    reason: lexical_alternative
  - marker: b
    text: Or 'the upstairs room' or 'the loft.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그녀에게 말했습니다. 「당신의 아들을 내게 주십시오.」 그러고 나서 그는 그를 그녀의 품에서 받아 올려, 자기가 머무르고 있던 윗방으로 데려가 자기 침대에 뉘었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘품’은 히브리어 חֵיק가 가리키는 가슴/무릎 주변의 밀착 공간을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘윗방’은 히브리어 הָעֲלִיָּה의 직역에 가까운 현대 한국어 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנִי לִי אֶת בְּנֵךְ
  english_pob_choice: Give me your son
  chosen_korean: 당신의 아들을 내게 주십시오
  alternatives_korean:
  - 아들을 내게 주십시오
  - 당신의 아들을 내게 넘겨주십시오
  lexicon: HALOT
  rationale: נתן의 명령형과 목적어를 자연스러운 한국어 명령으로 옮기되, 관계의 긴장과 즉각성을 살리기 위해 공손한 직접명령형을 택했습니다.
- source_word: מֵחֵיקָהּ
  english_pob_choice: from her bosom
  chosen_korean: 그녀의 품에서
  alternatives_korean:
  - 그녀의 가슴에서
  - 그녀의 무릎에서
  lexicon: HALOT
  rationale: חֵיק은 가슴/품/무릎 주변의 밀착된 안착 공간을 가리키므로, 현대 한국어에서 가장 자연스럽고 과도하게 신체를 세부화하지 않는 '품'을 택했습니다.
- source_word: הָעֲלִיָּה
  english_pob_choice: the upper room
  chosen_korean: 윗방
  alternatives_korean:
  - 윗층 방
  - 다락방
  lexicon: HALOT
  rationale: עֲלִיָּה는 위층의 방을 가리키므로, 한국어에서 간결하고 이해하기 쉬운 '윗방'이 본문의 공간성을 잘 살립니다.
- source_word: אֲשֶׁר הוּא יֹשֵׁב שָׁם
  english_pob_choice: where he was staying
  chosen_korean: 자기가 머무르고 있던
  alternatives_korean:
  - 거처하던
  - 살고 있던
  lexicon: HALOT
  rationale: ישב는 여기서 단순한 '앉다'가 아니라 거주/체류를 뜻하므로, 장소의 임시성과 상황성을 담는 '머무르고 있던'으로 옮겼습니다.
- source_word: וַיַּשְׁכִּבֵהוּ עַל מִטָּתוֹ
  english_pob_choice: laid him on his own bed
  chosen_korean: 자기 침대에 뉘었습니다
  alternatives_korean:
  - 자기 침상에 눕혔습니다
  - 자기 침대에 눕혔습니다
  lexicon: HALOT
  rationale: שׁכב의 히필은 '눕게 하다'이므로, 동작의 결과를 분명히 드러내는 '뉘었습니다'를 택했고, מִטָּה는 현대 문맥에서는 '침대'가 가장 자연스럽습니다.
theological_decisions:
- issue: 엘리야의 요청에 대한 화행(register)
  chosen_reading: 직접 인용문 안에서 공손한 명령형 「주십시오」를 사용했습니다.
  alternative_readings:
  - 「줘」
  - 「아들을 내게 달라」
  rationale: 히브리어 명령형의 직접성을 유지하면서도 한국어 합쇼체 문체에 맞춰, 무례함 없이 긴박한 요청의 힘을 보존했습니다.
  doctrine_reference: 문체/화행 일치 원칙
