  lexicon: HALOT
  rationale: חֵיק은 가슴/품/무릎 주변의 밀착된 안착 공간을 가리키므로, 현대 한국어에서 가장 자연스럽고 과도하게 신체를 세부화하지 않는 '품'을 택했습니다.
- source_word: הָעֲלִיָּה
  english_pob_choice: the upper room
  chosen_korean: 윗방
  alternatives_korean:
