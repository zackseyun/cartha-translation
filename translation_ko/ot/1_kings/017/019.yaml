  rationale: נתן의 명령형과 목적어를 자연스러운 한국어 명령으로 옮기되, 관계의 긴장과 즉각성을 살리기 위해 공손한 직접명령형을 택했습니다.
- source_word: מֵחֵיקָהּ
  english_pob_choice: from her bosom
  chosen_korean: 그녀의 품에서
