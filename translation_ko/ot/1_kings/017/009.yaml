  lexicon: HALOT
  rationale: 히브리어의 연속 명령을 현대 한국어의 자연스러운 명령형으로 옮기되, 촉구의 힘을 살리기 위해 ‘일어나’와 ‘가십시오’를 함께 유지했습니다.
- source_word: צָרְפַ֨תָ/ה֙ אֲשֶׁ֣ר לְ/צִיד֔וֹן
  english_pob_choice: Zarephath, which belongs to Sidon
  chosen_korean: 시돈에 속한 사르밧
