  lexicon: HALOT
  rationale: כלכל의 의미가 단순한 한 끼 제공보다 생계 유지와 부양을 포함하므로, 문맥상 ‘먹여 살리다’가 가장 압축적으로 대응합니다.
theological_decisions:
- issue: 하나님이 과부에게 ‘명령했다’는 표현의 보존
  chosen_reading: 직접적인 ‘명령했습니다’를 유지하고, 이를 ‘임명했습니다’나 ‘준비하셨습니다’로 완화하지 않았습니다.
  alternative_readings:
  - 내가 거기 과부를 임명했습니다
  - 내가 거기 과부를 마련해 두었습니다
  rationale: 본문의 צִוִּיתִי는 문자적으로 ‘명령하다’이며, 이후 서술에서 그 과부가 그 명령을 사전에 의식한 것으로 보이지 않더라도, 본문의 표현과 신학적 긴장을 해소하지 않고 보존하는 것이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: preserve textual and theological tension rather than resolve it.'
