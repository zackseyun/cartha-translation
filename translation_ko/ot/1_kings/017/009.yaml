  lexicon: HALOT
  rationale: לְצִידוֹן의 관계를 단순 위치보다 속함/연관성으로 보는 POB의 해석을 반영해, 지역·정치적 소속감을 드러내는 ‘시돈에 속한’으로 옮겼습니다.
- source_word: וְ/יָשַׁבְתָּ֖ שָׁ֑ם
  english_pob_choice: and stay there
  chosen_korean: 거기에서 머물러 있으십시오
  alternatives_korean:
  - 거기에서 사십시오
  - 거기에서 거주하십시오
  lexicon: HALOT
  rationale: 지속적으로 거주하라는 뜻을 살리면서도, 현대 한국어에서 가장 자연스럽고 명령의 뉘앙스가 분명한 표현으로 옮겼습니다.
- source_word: צִוִּ֥יתִי
  english_pob_choice: I have commanded
  chosen_korean: 내가 … 명령했습니다
  alternatives_korean:
  - 내가 … 지시했습니다
  - 내가 … 임명했습니다
  lexicon: HALOT
  rationale: צוה의 기본 의미인 ‘명령하다’를 유지해 본문의 직접적 표현과 서술적 긴장을 그대로 살렸습니다.
- source_word: לְ/כַלְכְּלֶֽ/ךָ
  english_pob_choice: to provide for you
  chosen_korean: 당신을 먹여 살리도록
  alternatives_korean:
