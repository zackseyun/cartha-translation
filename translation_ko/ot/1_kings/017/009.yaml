source:
  edition: WLC
  text: ק֣וּם לֵ֤ךְ צָרְפַ֨תָ/ה֙ אֲשֶׁ֣ר לְ/צִיד֔וֹן וְ/יָשַׁבְתָּ֖ שָׁ֑ם הִנֵּ֨ה צִוִּ֥יתִי שָׁ֛ם אִשָּׁ֥ה אַלְמָנָ֖ה לְ/כַלְכְּלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/009.yaml
  text: Get up[a], go to Zarephath, which belongs to Sidon, and stay there. Look[b], I have commanded a widow there to provide for you.
  footnotes:
  - marker: a
    text: Or 'which is in Sidon' or 'which is near Sidon.' The Hebrew more literally relates Zarephath to Sidon, likely indicating regional or political association.
    reason: lexical_alternative
  - marker: b
    text: Or 'I have appointed a widow there to sustain you.' The Hebrew says 'I have commanded,' which may describe God's sovereign direction even if the widow is not yet shown as consciously aware of it.
    reason: alternative_reading
translation:
  language: ko
  text: 일어나십시오. 시돈에 속한[a] 사르밧으로 가서 거기에 머무르십시오. 보십시오, 내가 거기에 있는 한 과부에게 당신을 부양하도록 명령했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시돈에 있는’ 또는 ‘시돈 근처의’. 히브리어는 사르밧을 시돈과 관련지으며, 아마도 지역적 또는 정치적 소속·연관을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 거기에 있는 한 과부를 지정하여 당신을 부양하게 했다.’ 히브리어는 ‘내가 명령했다’라고 말합니다. 이는 과부가 아직 그 명령을 의식하고 있는 것으로 본문이 보여 주지 않더라도, 하나님의 주권적인 지시를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
