source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ הַ/תִּשְׁבִּ֜י מִ/תֹּשָׁבֵ֣י גִלְעָד֮ אֶל אַחְאָב֒ חַי יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר עָמַ֣דְתִּי לְ/פָנָ֔י/ו אִם יִהְיֶ֛ה הַ/שָּׁנִ֥ים הָ/אֵ֖לֶּה טַ֣ל וּ/מָטָ֑ר כִּ֖י אִם לְ/פִ֥י דְבָרִֽ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/001.yaml
  text: And Elijah the Tishbite[a], from the inhabitants of Gilead, said to Ahab, “As Yahweh, the God of Israel, lives, before whom I stand, there will be neither dew nor rain in these years[c][b], except by my word.”
  footnotes:
  - marker: a
    text: Or 'from among the inhabitants of Gilead'; the Hebrew may denote residents/settlers rather than simply natives.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew oath idiom: ''if there shall be...'' meaning ''there shall not be.'''
    reason: cultural_note
  - marker: c
    text: Or 'except according to my word' / 'except at my word.'
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리야는 길르앗 주민들 가운데 한 사람인 디셉 사람[a]으로서 아합에게 말했습니다. “이스라엘의 하나님 야훼께서 살아 계심을 두고 맹세합니다. 내가 그분 앞에 서 있습니다. 이 몇 해 동안은 이슬도 비도 내리지 않을 것입니다[b], 오직 내 말에 따라[c] 있을 뿐입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘길르앗 주민들 가운데서’; 히브리어는 단순한 출신지보다 거주민/정착민을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어 서약 관용구: ‘만일 …이 있으면’이라는 형태로 ‘…이 없을 것이다’의 뜻입니다.'
    reason: cultural_note
  - marker: c
    text: 또는 ‘내 말에 따라’ / ‘내 말대로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּשְׁבִּי / מִתֹּשָׁבֵי גִלְעָד
  english_pob_choice: the Tishbite / from the settlers (inhabitants) of Gilead
  chosen_korean: 디셉 사람 / 길르앗 주민들 가운데 한 사람
  alternatives_korean:
  - 길르앗의 디셉 사람
  - 길르앗 거주자들 중 한 사람
  lexicon: HALOT
  rationale: הַתִּשְׁבִּי는 출신을 나타내는 표지이므로 ‘디셉 사람’으로 옮기고, מִתֹּשָׁבֵי גִלְעָד는 단순한 출신지보다 ‘주민들 가운데 한 사람’이라는 소속·거주 뉘앙스를 살렸습니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh ... lives
  chosen_korean: 야훼께서 살아 계심을 두고 맹세합니다
  alternatives_korean:
  - 야훼께서 살아 계십니다
  - 야훼의 생명을 두고
  lexicon: HALOT
  rationale: 히브리어의 서약 관용구를 한국어에서 자연스러운 맹세 표현으로 옮기되, 단순 선언이 아니라 맹세의 힘이 드러나도록 했습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 하나님이신 분
  - 이스라엘 하나님
  lexicon: HALOT
  rationale: 직역에 가깝게 ‘이스라엘의 하나님’으로 두어 언약적 표지를 보존했습니다.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  english_pob_choice: before whom I stand
  chosen_korean: 내가 그분 앞에 서 있습니다
  alternatives_korean:
  - 제가 그분 앞에 서 있습니다
  - 내가 그 앞에 서 있습니다
  lexicon: HALOT
  rationale: 하나님 앞에 서 있다는 예언자적 대기·봉사의 관용구를 살리되, 현대 한국어에서 자연스럽게 구성했습니다.
- source_word: לְפִי דְבָרִי
  english_pob_choice: except by my word / according to my word
  chosen_korean: 오직 내 말에 따라
  alternatives_korean:
  - 내 말에 의하지 않고서는
  - 내 말에 의해서만
  lexicon: HALOT
  rationale: 예언적 권위가 작동하는 조건을 드러내면서도, 한국어에서 ‘except by’의 의미를 무리 없이 전달했습니다.
theological_decisions:
- issue: YHWH의 음역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙에 따라 신성명을 ‘야훼’로 옮겨 본문에 직접 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 서약문의 부정 관용구
  chosen_reading: 이슬도 비도 내리지 않을 것입니다
  alternative_readings:
  - 이슬도 비도 없을 것입니다
  - 이슬이나 비가 있을 것입니다
  rationale: 히브리어의 אם ... 구조가 서약 맥락에서 강한 부정을 뜻하므로, 한국어에서는 부정을 명시해 의미를 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
