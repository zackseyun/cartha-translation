theological_decisions:
- issue: 히브리어의 단수 동사와 뒤따르는 참여자 목록을 한국어에서 어떻게 보존할지
  chosen_reading: “그녀는—그와 그녀와 그녀의 집안이—먹었습니다”처럼 단수 서술을 유지하고, 참여자 목록을 삽입부로 분리했습니다.
  alternative_readings:
  - “그와 그녀와 그녀의 집안이 먹었습니다”로 평탄화
  - “그녀와 그와 그녀의 집안이 먹었습니다”로 순서를 재배열
  rationale: 본문의 문법적 긴장—단수 동사와 명시적 목록—을 지우지 않기 위해, 의미를 매끈하게 합치지 않고 원문의 장치를 드러내는 쪽을 택했습니다.
  doctrine_reference: 본문 문법 보존 원칙
- issue: ‘엘리야의 말’의 번역 톤
  chosen_reading: ‘엘리야의 말대로’로 옮겨, 지시의 권위를 살렸습니다.
  alternative_readings:
  - ‘엘리야가 말한 대로’
  - ‘엘리야의 말씀대로’
  rationale: 여기서 דבר는 단순한 발화가 아니라 수행을 요구하는 지시이므로, 너무 완화된 표현보다 명령적 함의를 유지하는 번역이 적절합니다.
  doctrine_reference: 예언자적 명령의 수행성
