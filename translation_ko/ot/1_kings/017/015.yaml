translation:
  language: ko
  text: 그녀가 가서 엘리야의 말대로 했습니다. 그리고 그녀는—그와 그녀와 그녀의 집안이—여러 날 동안 먹었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 3인칭 여성 단수 동사 뒤에 ‘그와 그녀와 그녀의 집안’이라는 참여자 목록을 덧붙입니다.
    reason: source_note
