translation:
  language: ko
  text: 그녀가 가서 엘리야의 말대로 했습니다. 그러자 그와 그녀와 그녀의 집안은 여러 날 동안 먹었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그녀가 먹었다, 그와 그녀와 그녀의 집안이, 여러 날’과 같이 3인칭 여성 단수 동사 뒤에 먹은 이들의 목록을 덧붙입니다.
    reason: source_note
