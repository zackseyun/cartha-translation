  text: וַ/יְהִ֛י מִ/קֵּ֥ץ יָמִ֖ים וַ/יִּיבַ֣שׁ הַ/נָּ֑חַל כִּ֛י לֹֽא הָיָ֥ה גֶ֖שֶׁם בָּ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/007.yaml
  text: And it happened after some days that the wadi dried up[a], because there was no rain in the land.
  footnotes:
  - marker: a
    text: Or 'the brook.' The Hebrew word refers to a seasonal streambed or wadi.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 며칠 뒤에, 그 시내가 말라 버렸습니다. 그것은 그 땅에 비가 내리지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘개울’. 히브리어 단어는 계절성 물줄기나 와디를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ יָמִים
  english_pob_choice: And it happened after some days
  chosen_korean: 그리고 며칠 뒤에
  alternatives_korean:
  - 그리고 얼마 후에
  - 그리고 시간이 지난 뒤에
  - 그리고 여러 날이 지나
  lexicon: HALOT
  rationale: 서사 전환 וַיְהִי와 미정량 시간표현 מִקֵּץ יָמִים을 한국어에서 가장 자연스럽게 풀어, 사건 진행의 흐름과 ‘일정 기간이 지난 뒤’라는 뜻을 함께 살렸습니다.
- source_word: הַנָּחַל
  english_pob_choice: the wadi
  chosen_korean: 그 시내
  alternatives_korean:
  - 그 와디
  - 그 개울
  - 그 시냇물
  lexicon: HALOT
  rationale: 원어 נחל은 계절성 물줄기라는 점이 핵심이지만, 한국어 본문에서는 생경한 음역보다 문맥상 이해가 쉬운 ‘시내’를 택하되, 주석 없이도 마르는 물줄기라는 기능이 드러나게 했습니다.
- source_word: וַיִּיבַשׁ
  english_pob_choice: dried up
  chosen_korean: 말라 버렸습니다
  alternatives_korean:
  - 말랐습니다
  - 바싹 말라 버렸습니다
  - 메말랐습니다
  lexicon: HALOT
  rationale: 물길이 더 이상 흐르지 않게 되었음을 분명히 드러내기 위해 완료적 뉘앙스를 살린 ‘말라 버렸습니다’를 사용했습니다.
- source_word: לֹא הָיָה גֶשֶׁם בָּאָרֶץ
  english_pob_choice: because there was no rain in the land
  chosen_korean: 그 땅에 비가 내리지 않았기 때문입니다
  alternatives_korean:
  - 그 땅에 비가 없었기 때문입니다
  - 그 지역에 비가 오지 않았기 때문입니다
  - 그 땅에 비가 내린 적이 없었기 때문입니다
  lexicon: HALOT
  rationale: 원인의 직접 표지를 분명히 하기 위해 ‘때문입니다’로 옮겼고, גֶשֶׁם은 한국어에서 자연스러운 ‘비’로 렌더링했습니다.
