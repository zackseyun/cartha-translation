  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א תִכְלָ֔ה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א תֶחְסָ֑ר עַ֠ד י֧וֹם תתן יְהוָ֛ה גֶּ֖שֶׁם עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/014.yaml
  text: 'For this is what Yahweh[a], the God of Israel, says: ‘The jar of flour will not be used up, and the jug of oil will not run dry[c][b], until the day Yahweh gives rain on the face of the ground.’'
  footnotes:
  - marker: a
    text: Or “will not fail” for “will not be used up.”
    reason: lexical_alternative
  - marker: b
    text: Or “will not diminish” for “will not run dry.”
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: “on the face of the ground.”'
    reason: cultural_note
translation:
  language: ko
  text: “야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. ‘가루 항아리는 다 쓰이지 않을 것이며, 기름 병은 마르지 않을 것입니다[c][b]. 야훼께서 땅 위에 비를 내리시는 날까지 그러할 것입니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 “줄어들지 않을 것입니다”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: '히브리어: “땅 위에.”'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms / Hebrew divine name
  rationale: 원문이 여호와의 고유명 יְהוָה를 직접 사용하므로, 한국어도 관용적 대체칭호인 ‘주님’보다 음역 ‘야훼’를 유지합니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘 하나님
  - 이스라엘의 신
  lexicon: WLC construct chain
  rationale: 소유/관계 구조를 그대로 살려, 엘리야의 예언 공식이 지시하는 언약의 하나님을 분명히 드러냅니다.
- source_word: כַּד הַקֶּמַח
  english_pob_choice: the jar of flour
  chosen_korean: 가루 항아리
  alternatives_korean:
  - 밀가루 항아리
  - 가루 단지
  - 가루 그릇
  lexicon: HALOT
  rationale: כַּד는 저장용 용기를 뜻하므로 ‘항아리’로, קֶּמַח은 곡물가루를 뜻하므로 자연스러운 현대 한국어 ‘가루’로 옮겨 문맥을 살렸습니다.
- source_word: וְצַפַּחַת הַשֶּׁמֶן
  english_pob_choice: the jug of oil
  chosen_korean: 기름 병
  alternatives_korean:
  - 기름 항아리
  - 기름 단지
  - 기름 주전자
  lexicon: HALOT
  rationale: צַפַּחַת은 더 작은 용기이므로 앞의 כַּד와 구별되게 ‘병’으로 옮겼고, שֶׁמֶן은 원문대로 넓게 ‘기름’으로 유지했습니다.
- source_word: לֹא תִכְלָה / לֹא תֶחְסָר
  english_pob_choice: will not be used up / will not run dry
  chosen_korean: 다 쓰이지 않을 것이며 / 마르지 않을 것입니다
  alternatives_korean:
  - 소진되지 않을 것이며 / 줄어들지 않을 것입니다
  - 다하지 않을 것이며 / 부족하지 않을 것입니다
  lexicon: HALOT
  rationale: 앞절은 보급량의 소진을, 뒷절은 액체의 고갈을 가리키므로 한국어도 각각 ‘다 쓰이다’, ‘마르다’로 구분해 의미 대비를 보존했습니다.
theological_decisions:
- issue: 야훼의 이름을 고유명으로 유지할지 여부
  chosen_reading: 본문과 후반의 동사 주어 모두 ‘야훼’로 유지합니다.
  alternative_readings:
  - 두 곳 모두 ‘주님’으로 치환
  - 첫 등장은 ‘야훼’, 후반은 ‘주님’
  rationale: 원문은 예언의 권위를 하나님의 이름을 직접 반복해 강조하므로, 한국어에서도 같은 고유명을 유지해 서술적 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
