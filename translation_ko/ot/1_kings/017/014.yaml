  revised_text: “이스라엘의 하나님 야훼께서 이렇게 말씀하십니다. ‘야훼께서 땅 표면에[c] 비를 내리시는 날까지 가루 항아리는 다하지 않고, 기름병은 줄어들지 않을 것입니다[b].’”
