base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/022.yaml
  text: And Yahweh listened to the voice of Elijah[a], and the life of the child returned to his inner being, and he lived.
  footnotes:
  - marker: a
    text: Or 'the soul of the child returned to his inner being.' Hebrew nephesh can mean 'life,' 'soul,' or 'self' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 엘리야의 목소리를 들으셨습니다. 그리하여 아이의 생명이[a] 그 아이의 몸속으로 돌아왔고, 그는 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아이의 영혼이 그 아이의 몸속으로 돌아왔다’라고 옮길 수 있습니다. 히브리어 nephesh는 문맥에 따라 ‘생명’, ‘영혼’, ‘자기 자신’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע / בְּקוֹל
  english_pob_choice: listened to the voice
  chosen_korean: 엘리야의 목소리를 들으셨습니다
  alternatives_korean:
  - 엘리야의 음성을 들으셨습니다
  - 엘리야의 기도를 들으셨습니다
  - 엘리야의 간구를 들으셨습니다
  lexicon: HALOT
  rationale: שׁמע는 단순 청취보다 응답적 ‘들음’의 뉘앙스를 가질 수 있어, 야훼께서 엘리야의 말에 귀를 기울여 응답하셨다는 뜻을 자연스럽게 살렸습니다.
- source_word: נֶפֶשׁ
  english_pob_choice: the life
  chosen_korean: 생명
  alternatives_korean:
  - 영혼
  - 목숨
  - 생기
  lexicon: HALOT
  rationale: 죽었던 아이가 다시 살아나는 문맥이므로 נֶפֶשׁ을 ‘생명’으로 옮겨, 영혼론을 과도하게 불러오지 않으면서 회복된 삶 자체를 드러냈습니다.
- source_word: עַל קִרְבּוֹ
  english_pob_choice: to his inner being
  chosen_korean: 그의 몸속으로
  alternatives_korean:
  - 그의 내면으로
  - 그의 속으로
  - 그의 중심으로
  lexicon: HALOT
  rationale: קֶרֶב의 ‘내부/몸의 안쪽’ 의미를 살리되, 죽음에서의 회복이라는 장면에 맞게 ‘몸속으로’라고 옮겨 히브리어의 구체성을 보존했습니다.
- source_word: וַיֶּחִי
  english_pob_choice: and he lived
  chosen_korean: 그는 살았습니다
  alternatives_korean:
  - 그는 살아났습니다
  - 그는 다시 살았습니다
  lexicon: HALOT
  rationale: חיה는 결과를 단순히 진술하므로, 과장하지 않고 ‘살았습니다’로 직역에 가깝게 처리했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역에서 영혼론을 얼마나 드러낼지
  chosen_reading: 생명으로 번역해 문맥상 소생을 강조했습니다
  alternative_readings:
  - 영혼으로 번역할 수 있습니다
  - 목숨으로 옮길 수도 있습니다
  rationale: 이 본문은 아이의 죽음과 회복을 서술하므로, ‘생명’이 가장 직접적으로 사건의 의미를 전달합니다. ‘영혼’은 가능하지만, 본문이 말하는 바 이상을 암시할 수 있어 주석적 여지를 남기는 것이 더 적절합니다.
  doctrine_reference: Translation philosophy §3; נֶפֶשׁ의 다의성은 확정하지 않고 문맥에 따라 표시합니다.
