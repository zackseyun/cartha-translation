  - 보십시오, 저는 두 개의 나뭇가지를 줍고 있습니다
  lexicon: HALOT
  rationale: 현재 진행 중인 행동을 살리면서도, 가난한 생존의 뉘앙스를 담는 동사로 ‘주워서’를 택했습니다.
- source_word: וַעֲשִׂיתִיהוּ לִי וְלִבְנִי
  english_pob_choice: prepare it for myself and for my son
  chosen_korean: 저와 제 아들을 위해 그것을 준비해
  alternatives_korean:
  - 저와 제 아들을 위해 그것을 만들어
  - 저와 제 아들을 위해 그것을 마련해
  lexicon: HALOT
  rationale: 음식 행위를 포괄하는 히브리어 동사를 한국어에서는 조리 행위를 자연스럽게 포함하는 ‘준비해’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 고유명사 처리
  chosen_reading: 텍스트의 יְהוָה는 ‘야훼’로 옮기고, ‘당신의 하나님’은 אָנָה로 받침 없는 직접 호칭을 살려 예언자에게 하는 맹세로 읽었습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 지명된 신적 이름이 직접 나오는 맹세문이므로, 표제적 호칭인 ‘주님’보다 고유명사 ‘야훼’가 원문의 긴장을 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
