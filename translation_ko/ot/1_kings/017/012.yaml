  text: וַ/תֹּ֗אמֶר חַי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אִם יֶשׁ לִ֣/י מָע֔וֹג כִּ֣י אִם מְלֹ֤א כַף קֶ֨מַח֙ בַּ/כַּ֔ד וּ/מְעַט שֶׁ֖מֶן בַּ/צַּפָּ֑חַת וְ/הִנְ/נִ֨י מְקֹשֶׁ֜שֶׁת שְׁנַ֣יִם עֵצִ֗ים וּ/בָ֨אתִי֙ וַ/עֲשִׂיתִ֨י/הוּ֙ לִ֣/י וְ/לִ/בְנִ֔/י וַ/אֲכַלְנֻ֖/הוּ וָ/מָֽתְנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/012.yaml
  text: And she said[a], “As Yahweh your God lives, I have no bread-cake, only a handful of flour in the jar and a little oil in the jug. And look, I am gathering two sticks, so that I may go in and prepare it for myself and for my son, and we may eat it and die.”
  footnotes:
  - marker: a
    text: Or “I have no loaf” or “I have no baked bread.” The Hebrew מָעוֹג refers to a small bread-cake.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그녀가 말했습니다. 「야훼, 당신의 하나님께서 살아 계심을 두고 맹세합니다. 저에게는 떡 한 조각도 없습니다. 다만 항아리 속에 밀가루 한 줌과 병 속에 기름 조금만 있을 뿐입니다. 보십시오, 저는 두 개의 나뭇가지를 주워서 들어가, 저와 제 아들을 위해 그것을 준비해 먹고 죽으려 합니다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘떡이 없다’ 혹은 ‘구운 빵이 없다’. 히브리어 מָעוֹג는 작은 빵덩이나 빵케이크를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh your God lives
  chosen_korean: 야훼, 당신의 하나님께서 살아 계심을 두고 맹세합니다
  alternatives_korean:
  - 야훼, 당신의 하나님께서 살아 계시는 한
  - 야훼, 당신의 하나님께서 살아 계심을 두고
  lexicon: HALOT
  rationale: 히브리어의 맹세 공식은 단순 진술이 아니라 엄숙한 서약이므로, 한국어도 ‘~을 두고 맹세합니다’로 공적 맹세의 힘을 살렸습니다.
- source_word: מָעוֹג
  english_pob_choice: bread-cake
  chosen_korean: 떡 한 조각
  alternatives_korean:
  - 빵 한 덩이
  - 구운 떡
  lexicon: HALOT
  rationale: מָעוֹג는 일반적 ‘빵’보다 작은 빵덩이/떡에 가까워, 굶주림의 상황을 드러내는 간결한 표현으로 ‘떡 한 조각’을 택했습니다.
- source_word: מְלֹא כַף קֶמַח
  english_pob_choice: a handful of flour
  chosen_korean: 밀가루 한 줌
  alternatives_korean:
  - 밀가루 한 움큼
  - 손바닥 가득한 밀가루
  lexicon: HALOT
  rationale: ‘손바닥 가득’의 직역보다 한국어 관용에 맞는 ‘한 줌’이 소량의 의미를 자연스럽게 전달합니다.
- source_word: כַּד / צַפַּחַת
  english_pob_choice: jar / jug
  chosen_korean: 항아리 / 병
  alternatives_korean:
  - 단지 / 주전자
  - 그릇 / 잔
  lexicon: HALOT
  rationale: 두 용기를 서로 구별해야 하므로, 밀가루 통은 ‘항아리’, 기름 담는 작은 용기는 ‘병’으로 구분해 옮겼습니다.
- source_word: וְהִנְנִי מְקֹשֶׁשֶׁת שְׁנַיִם עֵצִים
  english_pob_choice: And look, I am gathering two sticks
  chosen_korean: 보십시오, 저는 두 개의 나뭇가지를 주워서
  alternatives_korean:
  - 보십시오, 저는 두 개의 나뭇가지를 모으고 있습니다
  - 보십시오, 저는 두 개의 나뭇가지를 줍고 있습니다
  lexicon: HALOT
  rationale: 현재 진행 중인 행동을 살리면서도, 가난한 생존의 뉘앙스를 담는 동사로 ‘주워서’를 택했습니다.
- source_word: וַעֲשִׂיתִיהוּ לִי וְלִבְנִי
  english_pob_choice: prepare it for myself and for my son
  chosen_korean: 저와 제 아들을 위해 그것을 준비해
  alternatives_korean:
  - 저와 제 아들을 위해 그것을 만들어
  - 저와 제 아들을 위해 그것을 마련해
  lexicon: HALOT
  rationale: 음식 행위를 포괄하는 히브리어 동사를 한국어에서는 조리 행위를 자연스럽게 포함하는 ‘준비해’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 고유명사 처리
  chosen_reading: 텍스트의 יְהוָה는 ‘야훼’로 옮기고, ‘당신의 하나님’은 אָנָה로 받침 없는 직접 호칭을 살려 예언자에게 하는 맹세로 읽었습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 지명된 신적 이름이 직접 나오는 맹세문이므로, 표제적 호칭인 ‘주님’보다 고유명사 ‘야훼’가 원문의 긴장을 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
