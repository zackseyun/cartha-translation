  yaml_path: translation/ot/1_kings/017/016.yaml
  text: The jar of flour was not used up[a], and the jug of oil did not run out, according to the word of Yahweh that he had spoken by the hand of Elijah.
  footnotes:
  - marker: a
    text: 'Hebrew: ''by the hand of Elijah,'' an idiom meaning ''through Elijah.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 밀가루 단지에는 밀가루가 다하지 않았고, 기름병에는 기름이 줄어들지 않았습니다. 이는 야훼께서 엘리야의 손을 통해 말씀하신 말씀대로였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘엘리야의 손을 통해’는 관용적으로 ‘엘리야를 통해’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּד הַקֶּמַח
  english_pob_choice: The jar of flour
  chosen_korean: 밀가루 단지
  alternatives_korean:
  - 가루 항아리
  - 밀가루 항아리
  - 밀가루 병
  lexicon: HALOT
  rationale: 가정용 저장 용기를 가리키는 כַּד를 한국어로 자연스럽게 옮기되, flour의 소량 저장 맥락에 맞게 ‘단지’를 택했습니다.
- source_word: לֹא כָלָתָה
  english_pob_choice: was not used up
  chosen_korean: 다하지 않았고
  alternatives_korean:
  - 소진되지 않았고
  - 끝나지 않았고
  - 다 없어지지 않았고
  lexicon: HALOT
  rationale: כלה의 ‘끝나다/소진되다’ 뜻을 반영하면서, 기적적 공급의 지속을 현대 한국어로 간결하게 표현했습니다.
- source_word: צַפַּחַת הַשֶּׁמֶן
  english_pob_choice: the jug of oil
  chosen_korean: 기름병
  alternatives_korean:
  - 기름 단지
  - 기름 항아리
  - 기름 주전자
  lexicon: HALOT
  rationale: 기름을 담는 작은 용기라는 점을 살려 ‘병’으로 옮겼고, flour 용기와 구별되도록 했습니다.
- source_word: כִּדְבַר יְהוָה ... בְּיַד אֵלִיָּהוּ
  english_pob_choice: according to the word of Yahweh ... by the hand of Elijah
  chosen_korean: 야훼께서 엘리야의 손을 통해 말씀하신 말씀대로
  alternatives_korean:
  - 야훼의 말씀대로 ... 엘리야를 통해
  - 야훼께서 엘리야를 통해 말씀하신 대로
  - 야훼의 말씀에 따라
  lexicon: HALOT
  rationale: כִּדְבַר יְהוָה를 ‘말씀대로’로, בְּיַד을 직역에 가깝게 ‘손을 통해’로 살려 예언자 매개라는 히브리어 관용을 드러냈습니다.
theological_decisions:
- issue: בְּיַד אֵלִיָּהוּ의 매개 표현
  chosen_reading: ‘엘리야의 손을 통해’로 직역해, 야훼의 발화와 엘리야의 대리적 역할을 함께 보이도록 했습니다.
  alternative_readings:
  - ‘엘리야를 통해’로 매끈하게 처리
  - ‘엘리야가 전한 말씀대로’로 의역
  rationale: 본문은 공급의 성취를 야훼의 말씀에 연결하면서도 예언자 매개를 보존합니다. 관용구를 너무 평평하게 만들지 않기 위해 직역을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §5
