  text: וַ/יָּ֣קָם וַ/יֵּ֣לֶךְ צָרְפַ֗תָ/ה וַ/יָּבֹא֙ אֶל פֶּ֣תַח הָ/עִ֔יר וְ/הִנֵּֽה שָׁ֛ם אִשָּׁ֥ה אַלְמָנָ֖ה מְקֹשֶׁ֣שֶׁת עֵצִ֑ים וַ/יִּקְרָ֤א אֵלֶ֨י/הָ֙ וַ/יֹּאמַ֔ר קְחִי נָ֨א לִ֧/י מְעַט מַ֛יִם בַּ/כְּלִ֖י וְ/אֶשְׁתֶּֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/010.yaml
  text: So he arose and went to Zarephath. When he came to the entrance of the city[a], behold, a widow was there gathering sticks. He called to her and said, “Please bring me a little water in a vessel, so that I may drink.”
  footnotes:
  - marker: a
    text: Or 'gate of the city.' The Hebrew says 'entrance/opening of the city' (פֶּתַח), which is broader than the more specific word for 'gate.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 일어나 사르밧으로 갔습니다. 그가 성의 입구에 이르렀을 때[a], 보니 거기에 한 과부가 나뭇가지를 줍고 있었습니다. 그가 그 여인에게 소리쳐 말했습니다. “부디 그릇에 물을 조금 담아, 제가 마실 수 있도록 제게 가져다주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성문’. 히브리어는 특정한 ‘성문’보다 넓은 뜻의 ‘성의 입구/열린 곳’(פֶּתַח)을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרְפַתָה
  english_pob_choice: to Zarephath
  chosen_korean: 사르밧으로
  alternatives_korean:
  - 사렙다로
  - 사르바트로
  lexicon: HALOT
  rationale: 지명 צָרְפַתָה는 히브리어 지명 음역에 따라 사르밧으로 옮겼습니다. 한국어 성경에서 비교적 널리 쓰이는 형태를 우선하되, 본문 흐름상 방향성을 살려 '-으로'를 붙였습니다.
- source_word: פֶּתַח הָעִיר
  english_pob_choice: the entrance of the city
  chosen_korean: 성의 입구
  alternatives_korean:
  - 성문
  - 도성의 문
  - 도시의 입구
  lexicon: HALOT
  rationale: פֶּתַח은 특정한 '문'(שַׁעַר)보다 넓은 '입구/열린 곳'이므로, POB의 해석을 따라 '성의 입구'로 옮겨 과도한 구체화를 피했습니다.
- source_word: אִשָּׁה אַלְמָנָה
  english_pob_choice: a widow
  chosen_korean: 한 과부
  alternatives_korean:
  - 과부 한 사람
  - 과부 여인
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '여자, 과부'이지만 한국어에서는 '과부'가 자연스럽고, 앞의 'הִנֵּה'로 새롭게 드러나는 인물을 살리기 위해 '한'을 더했습니다.
- source_word: מְקֹשֶׁשֶׁת עֵצִים
  english_pob_choice: gathering sticks
  chosen_korean: 나뭇가지를 줍고 있었습니다
  alternatives_korean:
  - 장작을 모으고 있었습니다
  - 나무 조각들을 모으고 있었습니다
  lexicon: HALOT
  rationale: קושׁשׁ는 여기서 작은 연료용 가지를 주워 모으는 뜻이므로, 문맥에 맞게 '나뭇가지를 줍다'로 옮겨 과도하게 큰 '장작' 이미지를 피했습니다.
- source_word: קְחִי נָא לִ֧י מְעַט מַיִם בַּכְּלִ֖י
  english_pob_choice: Please bring me a little water in a vessel
  chosen_korean: 부디 그릇에 담아 물 조금 가져와서
  alternatives_korean:
  - 부탁하니 그릇에 물 조금 가져와서
  - 물 한 모금만 그릇에 담아 가져와서
  lexicon: HALOT
  rationale: לקח의 요청형은 상황상 '가져오다'가 자연스럽고, נָא는 정중한 청유로 '부디'가 잘 살립니다. כְּלִי는 일반적인 '그릇/용기'이므로 구체적 형태를 단정하지 않고 '그릇'으로 옮겼습니다.
- source_word: וְאֶשְׁתֶּה
  english_pob_choice: so that I may drink
  chosen_korean: 내가 마시게 해주십시오
  alternatives_korean:
  - 내가 마시도록 해주십시오
  - 마시게 해주십시오
  lexicon: HALOT
  rationale: cohortative의 목적/의도는 한국어 요청문에서 자연스럽게 드러나므로, 결과 목적절을 풀어 '내가 마시게 해주십시오'로 옮겼습니다.
theological_decisions:
- issue: 엘리야의 요청 화법
  chosen_reading: 직접 인용 안에서 정중한 부탁으로 처리하되, 한국어는 현대 공손체로 유지했습니다.
  alternative_readings:
  - 명령형에 가까운 직설적 표현
  - 더 옛스러운 청원체
  rationale: 본문의 נָא는 무례한 명령이 아니라 공손한 요청이므로, 화자의 태도를 훼손하지 않으면서 현대 독자가 이해하기 쉬운 공손체로 옮겼습니다.
  doctrine_reference: 본문 화행의 재현
- issue: ‘성의 입구’와 ‘성문’의 구분
  chosen_reading: פֶּתַח의 넓은 의미를 살려 ‘성의 입구’로 번역했습니다.
  alternative_readings:
  - 성문
  - 도성의 문
  rationale: 본문이 말하는 것은 성문이라는 특정 구조물이 아니라 도시의 प्रवेश 지점이므로, 지리적·서사적 정확성을 위해 더 넓은 표현을 택했습니다.
  doctrine_reference: 본문 의미 보존
