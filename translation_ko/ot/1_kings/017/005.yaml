  text: So he went and did according to the word of Yahweh[a], and he went and stayed by the Wadi Cherith[b], which is before the Jordan.
  footnotes:
  - marker: a
    text: Or 'the brook Cherith' or 'the stream Cherith'; the Hebrew term can refer to a wadi, ravine, or seasonal watercourse.
    reason: lexical_alternative
  - marker: b
    text: Literally 'which is before/opposite the Jordan.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼의 말씀대로 행하고, 요단 강 동쪽에 있는 크릿 시냇가에 머물렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נחל은 와디, 협곡, 계절하천을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 עַל פְּנֵי는 문자적으로 ‘앞에/맞은편에’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ וַיַּעַשׂ
  english_pob_choice: So he went and did
  chosen_korean: 그는 … 행하고
  alternatives_korean:
  - 그는 가서 행하고
  - 그는 가서 실행하고
  lexicon: HALOT
  rationale: 연속 동작의 서술이므로 한국어에서는 자연스럽게 연결해 ‘가서 … 행하다’로 옮기되, 군더더기 없이 서사 진행을 살렸습니다.
- source_word: כִּדְבַר יְהוָה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 야훼의 말씀대로
  alternatives_korean:
  - 여호와의 말씀대로
  - 야훼의 말씀을 따라
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, כִּדְבַר는 단순한 내용 일치보다 규범적 순종을 드러내므로 ‘말씀대로’가 가장 자연스럽습니다.
- source_word: וַיֵּשֶׁב
  english_pob_choice: stayed
  chosen_korean: 머물렀습니다
  alternatives_korean:
  - 살았습니다
  - 정착했습니다
  - 머물러 있었습니다
  lexicon: HALOT
  rationale: 임시 체류의 뉘앙스를 살리기 위해 영구 정착 느낌의 ‘살다/정착하다’보다 ‘머물다’를 택했습니다.
- source_word: בְּנַחַל כְּרִית
  english_pob_choice: by the Wadi Cherith
  chosen_korean: 크릿 시냇가에
  alternatives_korean:
  - 크릿 와디에
  - 크릿 골짜기 시냇가에
  - 크릿 시내 곁에
  lexicon: HALOT
  rationale: נחל은 계절하천까지 포괄할 수 있어 ‘시냇가’로 옮기되, 지명 크릿은 음역하여 본문의 지리적 이미지를 유지했습니다.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  english_pob_choice: which is before the Jordan
  chosen_korean: 요단 강 동쪽에 있는
  alternatives_korean:
  - 요단 강 맞은편에 있는
  - 요단 강 앞에 있는
  - 요단 강 건너편에 있는
  lexicon: HALOT
  rationale: עַל־פְּנֵי의 문자적 방향성은 ‘맞은편/앞에’이지만, 이 문맥에서는 지리적으로 더 분명한 ‘동쪽’이 독자가 위치를 이해하는 데 도움이 됩니다.
theological_decisions:
- issue: 야훼의 음성에 대한 순종의 표현
  chosen_reading: ‘야훼의 말씀대로 행하다’로 직역성과 순종의 의미를 함께 살렸습니다.
  alternative_readings:
  - ‘야훼께서 말씀하신 대로’
  - ‘야훼의 명령대로’
  rationale: 본문은 단순 이동이 아니라 선지자가 받은 말씀에 대한 실제적 순종을 강조하므로, 말씀-순종의 연결을 약화시키지 않도록 했습니다.
  doctrine_reference: N/A
