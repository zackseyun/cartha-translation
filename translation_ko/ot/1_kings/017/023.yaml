id: 1KI.17.23
reference: 1 Kings 17:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אֵלִיָּ֜הוּ אֶת הַ/יֶּ֗לֶד וַ/יֹּרִדֵ֤/הוּ מִן הָ/עֲלִיָּה֙ הַ/בַּ֔יְתָ/ה וַֽ/יִּתְּנֵ֖/הוּ לְ/אִמּ֑/וֹ וַ/יֹּ֨אמֶר֙ אֵ֣לִיָּ֔הוּ רְאִ֖י חַ֥י בְּנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/023.yaml
  text: Then Elijah took the boy[a], brought him down from the upper room into the house, and gave him to his mother. And Elijah said, “See, your son is alive.”
  footnotes:
  - marker: a
    text: Or “your son lives.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 엘리야가 그 아이를 데리고 윗방에서 집 안으로 내려와 그 아이의 어머니에게 주었습니다. 그가 말했습니다. “보십시오, 아들이 살아 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아들이 삽니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 데리고
  alternatives_korean:
  - 붙들고
  - 들고
  lexicon: HALOT
  rationale: 단순한 ‘취하다’보다 서사 흐름상 아이를 손에 넣어 옮기는 동작을 자연스럽게 드러내는 ‘데리고’가 적절합니다.
- source_word: הַיֶּלֶד
  english_pob_choice: the boy
  chosen_korean: 그 아이
  alternatives_korean:
  - 그 소년
  - 그 아이
  lexicon: HALOT
  rationale: 이 문맥에서 הילד는 유아보다는 자녀를 가리키는 자연스러운 표현이므로 ‘그 아이’가 가장 무난합니다.
- source_word: וַיֹּרִדֵהוּ מִן הָעֲלִיָּה הַבַּיְתָה
  english_pob_choice: brought him down from the upper room into the house
  chosen_korean: 위층 방에서 집 안으로 내려와
  alternatives_korean:
  - 윗방에서 집 안으로 데리고 내려와
  - 다락방에서 집 안으로 내려와
  lexicon: HALOT
  rationale: עֲלִיָּה는 건축적으로 ‘위층 방/윗방’에 가깝고, 방향의 ‘집 안으로’는 히브리어의 이동 뉘앙스를 살립니다.
- source_word: וַיִּתְּנֵהוּ לְאִמּוֹ
  english_pob_choice: gave him to his mother
  chosen_korean: 그 아이를 그의 어머니에게 주었습니다
  alternatives_korean:
  - 그를 어머니에게 돌려주었습니다
  - 그를 어머니 손에 맡겼습니다
  lexicon: HALOT
  rationale: נתן의 기본 의미인 ‘주다’를 그대로 살리되, 문맥상 귀환의 뉘앙스를 과도하게 덧붙이지 않았습니다.
- source_word: רְאִי
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  lexicon: HALOT
  rationale: 어머니에게 직접 하는 명령이므로 현대 합쇼체에서 자연스럽고 공손한 ‘보십시오’가 적절합니다.
- source_word: חַי בְּנֵךְ
  english_pob_choice: your son is alive
  chosen_korean: 당신의 아들이 살아 있습니다
  alternatives_korean:
  - 당신의 아들이 삽니다
  - 당신의 아들이 살아납니다
  lexicon: HALOT
  rationale: 상태를 나타내는 חי를 현대 한국어의 현재 상태 표현인 ‘살아 있습니다’로 옮겨, 기적의 결과를 분명히 드러냅니다.
theological_decisions:
- issue: 엘리야의 직접 화법에서 존대의 정도
  chosen_reading: 엘리야의 말은 상대인 어머니에게 ‘보십시오’로 높임을 유지하되, 인용문 내부의 선언은 본문의 단정성을 살려 ‘살아 있습니다’로 직역했습니다.
  alternative_readings:
  - 보라, 당신의 아들이 살아 있다
  - 보십시오, 아드님이 살아 계십니다
  rationale: 히브리어 명령과 선언은 담담하고 직설적이어서, 과도한 경건어(‘아드님’, ‘살아 계십니다’)로 미화하지 않고 원문의 힘을 보존하는 것이 적절합니다.
  doctrine_reference: '번역 원칙: 문맥이 허락하는 만큼만 해석하고, 본문이 말하는 바를 직접적으로 드러낸다.'
