  to: 그러자 엘리야가 그 아이를 데리고 윗방에서 집 안으로 내려와 그 아이의 어머니에게 주었습니다. 그가 말했습니다. “보십시오, 아들이 살아 있습니다.”[a]
  rationale: 문장의 사건 순서와 ‘살아 있다’라는 원문의 직접적 선언은 유지하면서, 한국어의 자연스러운 지시 관계와 합쇼체 서사 문체에 맞게 다듬었습니다. ‘다시 살아났다’ 또는 ‘되살아났다’처럼 본문에 없는 해석은 추가하지 않았습니다.
