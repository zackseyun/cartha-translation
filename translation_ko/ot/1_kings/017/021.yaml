  yaml_path: translation/ot/1_kings/017/021.yaml
  text: Then he stretched himself out over the boy three times[a], and he cried out to Yahweh and said, “Yahweh my God, please let this boy’s life return to him.”
  footnotes:
  - marker: a
    text: 'Or “please let this boy’s soul return to him.” Hebrew: “let the נפש of this boy return to his inner part.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 아이 위에 세 번 몸을 뻗고, 야훼께 부르짖어 말했습니다. “야훼, 제 하나님, 이제 이 아이의 생명이 그에게 돌아오게 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 아이의 영혼이 그에게 돌아오게 하십시오.” 히브리어는 “이 아이의 נפש이 그의 속으로 돌아오게 하십시오”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְמֹדֵד
  english_pob_choice: stretched himself out
  chosen_korean: 몸을 뻗고
  alternatives_korean:
  - 스스로를 늘이고
  - 몸을 길게 누이고
  - 그 위에 엎드리고
  lexicon: HALOT
  rationale: 희귀한 재귀 동사는 엘리야가 아이 위에 실제로 몸을 길게 펴는 동작을 가리키므로, 현대 한국어에서는 자연스럽고 장면에 맞는 ‘몸을 뻗고’로 옮겼습니다.
- source_word: וַיִּקְרָ֥א אֶל יְהוָ֖ה
  english_pob_choice: he cried out to Yahweh
  chosen_korean: 야훼께 부르짖어
  alternatives_korean:
  - 야훼께 부르며
  - 야훼를 불러
  - 야훼께 외쳐
  lexicon: HALOT
  rationale: 기도 맥락의 קרא אל은 단순 호출보다 간절한 호소를 담으므로, 긴박한 간청을 살리는 ‘부르짖어’가 가장 적절합니다.
- source_word: יְהוָה אֱלֹהָי
  english_pob_choice: Yahweh my God
  chosen_korean: 야훼, 제 하나님
  alternatives_korean:
  - 야훼 나의 하나님
  - 주 야훼, 제 하나님
  - 야훼, 내 하나님
  lexicon: HALOT
  rationale: 본문의 직접 호칭을 살리기 위해 하나님의 이름을 그대로 두고, 뒤의 소유격은 한국어 호격에 맞게 ‘제 하나님’으로 옮겼습니다.
- source_word: נֶפֶשׁ
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 목숨
  - 영혼
  - 혼
  lexicon: HALOT
  rationale: 부활 요청 문맥에서 נֶפֶשׁ는 형이상학적 ‘영혼’보다 아이의 생명력 자체를 가리키므로, 가장 분명한 ‘생명’으로 번역했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역이 생명인지 영혼인지
  chosen_reading: 생명
  alternative_readings:
  - 영혼
  - 목숨
  rationale: 본문은 아이의 죽은 상태에서 생명이 되돌아오기를 간구하는 장면이므로, 독자에게 영혼론을 미리 확정하지 않도록 ‘생명’을 택했습니다. 다만 ‘영혼’이 가능한 전통적 독해라는 점은 본문 의미의 긴장을 보존하는 차원에서 열어 둡니다.
  doctrine_reference: 영혼/생명 구분을 단정하지 않고 문맥 우선으로 보존
