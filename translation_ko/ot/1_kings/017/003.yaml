base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/003.yaml
  text: Go from here and turn yourself eastward[a], and hide yourself by the Wadi Cherith[c][b], which is east of the Jordan.
  footnotes:
  - marker: a
    text: Or 'by the brook Cherith.' The Hebrew נחל can refer to a wadi, ravine, or brook-like watercourse.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'which is before the Jordan'; the phrase likely means 'east of the Jordan' in this geographical context, though 'opposite the Jordan' is also possible.
    reason: lexical_alternative
  - marker: c
    text: Cherith may also be transliterated 'Kerith.'
    reason: alternative_reading
translation:
  language: ko
  text: “여기서 떠나 동쪽으로 가라. 그리고 요단 강 앞에 있는 그릿 시내 곁에 몸을 숨겨라.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נחל은 와디, 협곡, 시내 같은 물줄기를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘요단 앞’이지만, 이 지리적 문맥에서는 ‘요단 강 동쪽’이라는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그릿’은 ‘케릿’으로도 옮길 수 있습니다.
    reason: alternative_reading
