  text: וַ/תֹּ֨אמֶר֙ אֶל אֵ֣לִיָּ֔הוּ מַה לִּ֥/י וָ/לָ֖/ךְ אִ֣ישׁ הָ/אֱלֹהִ֑ים בָּ֧אתָ אֵלַ֛/י לְ/הַזְכִּ֥יר אֶת עֲוֺנִ֖/י וּ/לְ/הָמִ֥ית אֶת בְּנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/018.yaml
  text: She said to Elijah[a], “What do I have to do with you, man of God? Have you come to me to bring my iniquity to remembrance and to cause my son to die?”
  footnotes:
  - marker: a
    text: Or 'my sin' or 'my guilt.' The Hebrew term can refer to wrongdoing, guilt, or the burden/consequence of guilt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여자가 엘리야에게 말했습니다. 「하나님의 사람아, 제가 당신과 무슨 상관이 있습니까? 당신은 제게 와서 제 죄를 떠올리게 하고 제 아들을 죽게 하려고 오셨습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제 죄’는 여기서 행위로서의 죄, 죄책, 또는 그 결과로서의 책임을 모두 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  english_pob_choice: What do I have to do with you
  chosen_korean: 제가 당신과 무슨 상관이 있습니까
  alternatives_korean:
  - 당신과 내가 무슨 상관이 있습니까
  - 제가 당신과 무슨 관계가 있습니까
  lexicon: HALOT
  rationale: 히브리어 관용구의 거리감과 항의의 뉘앙스를 자연스러운 현대 한국어로 옮기되, 관계의 단절감을 유지했습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 남자
  - 하나님 사람
  lexicon: HALOT
  rationale: 예언자/하나님의 사자를 가리키는 고정된 호칭을 살려, 직역의 어색함 없이 성경적 호칭감을 유지했습니다.
- source_word: לְהַזְכִּיר אֶת עֲוֺנִי
  english_pob_choice: to bring my iniquity to remembrance
  chosen_korean: 제 죄를 떠올리게 하고
  alternatives_korean:
  - 제 죄를 기억나게 하고
  - 제 죄를 상기시키고
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 반영하면서, 한국어로는 ‘떠올리게 하다’가 가장 자연스럽고 직접적인 대응이 됩니다.
- source_word: עֲוֺנִי
  english_pob_choice: my iniquity
  chosen_korean: 제 죄
  alternatives_korean:
  - 제 죄악
  - 제 불의
  - 제 죄책
  lexicon: HALOT
  rationale: 원어의 moral weight를 유지하되, 한국어에서 ‘죄악’보다 덜 과장되고 ‘죄책’보다 덜 추상적인 기본값으로 옮겼습니다.
- source_word: וּלְהָמִית אֶת בְּנִי
  english_pob_choice: and to cause my son to die
  chosen_korean: 제 아들을 죽게 하려고
  alternatives_korean:
  - 제 아들을 죽이려고
  - 제 아들을 사망하게 하려고
  lexicon: HALOT
  rationale: 히필의 사역성을 살리면서도 한국어로는 목적절에서 가장 자연스러운 표현을 택했습니다.
theological_decisions:
- issue: עֲוֺנִי의 의미 범위
  chosen_reading: 제 죄
  alternative_readings:
  - 제 죄악
  - 제 죄책
  rationale: 문맥상 여인은 아들의 죽음을 자신의 도덕적 잘못과 연결해 해석합니다. ‘제 죄’는 행위와 책임의 긴장을 과도하게 한쪽으로 좁히지 않고 보존합니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
