language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָלָ֕ה בֶּן הָ/אִשָּׁ֖ה בַּעֲלַ֣ת הַ/בָּ֑יִת וַ/יְהִ֤י חָלְי/וֹ֙ חָזָ֣ק מְאֹ֔ד עַ֛ד אֲשֶׁ֥ר לֹא נֽוֹתְרָה בּ֖/וֹ נְשָׁמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/017.yaml
  text: After these things[a], the son of the woman who owned the house became sick, and his illness became very severe, until no breath was left in him.
  footnotes:
  - marker: a
    text: Or, 'until no life remained in him.' The Hebrew literally says, 'until no breath was left in him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 일들 뒤에 그 여인의 아들이 병들었습니다. 그 여인은 집의 주인이었고, 그의 병은 매우 심해져서 그 안에 숨이 남아 있지 않게 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 안에 생명이 남아 있지 않게 되었습니다.’ 히브리어는 문자적으로는 ‘그 안에 숨이 남아 있지 않게 되었다’고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: After these things
  chosen_korean: 이런 일들 뒤에
  alternatives_korean:
  - 그런 일들 후에
  - 이런 일들 이후에
  lexicon: HALOT
  rationale: 히브리어의 서사 전환 공식을 자연스러운 현대 한국어로 옮기되, 복수형 뉘앙스인 ‘일들’을 살렸습니다.
- source_word: חָלָה
  english_pob_choice: became sick
  chosen_korean: 병들었습니다
  alternatives_korean:
  - 아팠습니다
  - 병에 걸렸습니다
  lexicon: HALOT
  rationale: 상태 진입을 나타내는 동사이므로 단순한 상태보다 ‘병들었습니다’가 변화의 뉘앙스를 더 잘 담습니다.
- source_word: בַּעֲלַת הַבָּיִת
  english_pob_choice: the woman who owned the house
  chosen_korean: 그 여인은 집의 주인이었습니다
  alternatives_korean:
  - 그 여인은 집의 주인이었습니다만
  - 그 여인은 집을 소유한 사람이었습니다
  lexicon: HALOT
  rationale: בַּעֲלַת הַבָּיִת의 사회적·소유적 의미를 드러내기 위해 ‘집의 주인’으로 옮겼습니다.
- source_word: לֹא נוֹתְרָה בּוֹ נְשָׁמָה
  english_pob_choice: until no breath was left in him
  chosen_korean: 그 안에 숨이 남아 있지 않게 되었습니다
  alternatives_korean:
  - 그 안에 호흡이 남아 있지 않게 되었습니다
  - 그 안에 생기가 남아 있지 않게 되었습니다
  lexicon: HALOT
  rationale: נְשָׁמָה의 기본 의미인 ‘숨/호흡’을 보존하면서, 결과 상태를 한국어 서술로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 마지막 절의 죽음 암시를 본문에서 어떻게 처리할 것인가
  chosen_reading: 직접적으로 ‘죽었습니다’라고 단정하지 않고, ‘숨이 남아 있지 않게 되었습니다’로 원문의 표현을 유지했습니다.
  alternative_readings:
  - 죽을 지경이 되었습니다
  - 죽었습니다
  rationale: 히브리어는 죽음을 직설적으로 서술하기보다 ‘숨이 남지 않음’이라는 관용구로 말하므로, 본문은 그 긴장을 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 번역 원칙 §1, §3
