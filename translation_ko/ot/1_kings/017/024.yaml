  yaml_path: translation/ot/1_kings/017/024.yaml
  text: Then the woman said to Elijah[a], “Now I know that you are a man of God, and that the word of Yahweh in your mouth is truth.”
  footnotes:
  - marker: a
    text: Or 'the word of the LORD in your mouth is true.' The Hebrew noun can emphasize truth, truthfulness, or reliability.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여자가 엘리야에게 말했습니다. 「지금 저는 당신이 하나님의 사람인 줄 알게 되었습니다. 또한 야훼의 말씀이 당신의 입에 있는 것이 진리입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 입에 있는 야훼의 말씀은 참되다’로도 옮길 수 있습니다. 히브리어 명사는 진리, 참됨, 신뢰성을 아울러 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר / Then ... said
  english_pob_choice: Then the woman said
  chosen_korean: 그 여자가 말했습니다
  alternatives_korean:
  - 그 여자가 말하였습니다
  - 그리고 그 여자가 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리면서도 히브리어 동사의 단순한 말하기를 담아 합쇼체로 옮겼습니다.
- source_word: הָאִשָּׁה / the woman
  english_pob_choice: the woman
  chosen_korean: 그 여자
  alternatives_korean:
  - 그 여인
  - 그 아내
  lexicon: HALOT
  rationale: 문맥상 이전에 소개된 과부이지만, 여기서는 히브리어가 단지 ‘여자’를 말하므로 문맥을 과도하게 덧붙이지 않았습니다.
- source_word: אִישׁ אֱלֹהִים / a man of God
  english_pob_choice: a man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 하나님께 속한 사람
  lexicon: HALOT
  rationale: 히브리어 관용 표현을 한국어 성경에서 널리 쓰는 ‘하나님의 사람’으로 옮겨 예언자적 호칭의 무게를 보존했습니다.
- source_word: יְהוָה / Yahweh
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
  rationale: 이 번역본의 기본 원칙에 따라 하나님의 고유 이름을 ‘야훼’로 옮겨 언약 이름을 직접 드러냈습니다.
- source_word: אֱמֶת / truth
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 진실
  - 참되다
  - 신실함
  lexicon: HALOT
  rationale: 여기서는 명사적 술어로서 말씀의 참됨과 신뢰성을 함께 강하게 드러내므로 ‘진리’가 가장 간명합니다.
theological_decisions:
- issue: 야훼의 이름을 직접 표기할지 여부
  chosen_reading: 본문의 ‘Yahweh’를 따라 한국어 본문에도 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 예언적 확언의 핵심은 야훼의 말씀이 실제로 선지자의 입에 임했다는 데 있으므로, 고유 이름을 가려 버리지 않는 쪽이 본문의 신학적 힘을 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
