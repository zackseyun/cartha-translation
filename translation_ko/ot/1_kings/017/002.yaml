translation:
  language: ko
  text: 그러자 야훼의 말씀이 그에게 임하여 이렇게 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘YHWH.’ 영어 성경 번역에서는 전통적으로 이를 ‘the LORD’로 옮깁니다.'
    reason: source_note
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 그때 ... 임하여
  alternatives_korean:
  - 그리고 ... 이르러
  - 그리하여 ... 임하고
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 와우 연속형을 한국어에서는 시간 전환이 드러나는 ‘그때’와 도착/임재를 살리는 ‘임하다’로 자연스럽게 옮겼습니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 야훼의 예언적 발화 공식인 ‘the word of YHWH’를 한국어 성서 용례에 맞는 ‘말씀’으로 옮겨, 단순한 정보가 아니라 계시적 발화임을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 절은 신명기적 예언 공식에 직접 야훼의 이름을 사용하므로, POB 기준에 따라 번역어 대체 없이 고유명 ‘야훼’를 유지했습니다.
- source_word: אֵלָיו
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그 위에
  - 그에게로
  lexicon: HALOT
  rationale: אֶל+대명사 접미사는 사람에게 향하는 방향을 나타내므로, 한국어에서는 자연스러운 여격 ‘그에게’로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시기를
  - 말하여
  lexicon: HALOT
  rationale: 직접화법 도입 표지인 לֵאמֹר는 한국어에서 중복된 ‘말하여 이르시되’보다 앞의 동사와 연결해 매끄럽게 처리하되, 이어지는 발화의 존재를 유지했습니다.
theological_decisions:
- issue: 야훼의 이름을 한국어에서 어떻게 표기할 것인가
  chosen_reading: ‘야훼’로 직접 표기하여 인격적 이름을 보존했습니다.
  alternative_readings:
  - ‘여호와’로 전통화
  - ‘주님’으로 대체
  rationale: 본문은 κύριος가 아니라 히브리어 טetragrammaton יְהוָה 자체를 사용하므로, POB 원칙대로 명칭을 титул로 바꾸지 않고 신명에 해당하는 고유명으로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
