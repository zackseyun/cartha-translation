  naturalness: ‘야훼의 말씀이 그에게 임하여 이렇게 말씀하셨습니다’는 한국어 성서 문체의 관용을 유지하면서도, 다음 절의 발화를 자연스럽게 도입합니다. ‘그때’보다 ‘그러자’는 와우 연속형이 나타내는 서사 진행을 자연스럽게 연결합니다.
