revisions:
- from: 그러면 시내의 물을 마시게 될 것이며, 내가 까마귀들에게 그곳에서 너를 먹이도록 명령하였습니다.[a][b][c]
  to: 너는 그 시내에서 물을 마시게 될 것이며[a], 내가 까마귀들에게[c] 그곳에서 너를 돌보도록[b] 명령해 두었습니다.
  rationale: The revision removes the unwarranted consequential force of ‘그러면,’ renders the brook idiom directly as a place from which Elijah drinks, retains the ordinary bird reading, and uses a broader Korean provision verb for לכלכלך. It also relocates every footnote anchor to its relevant word or phrase.
