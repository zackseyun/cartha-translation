base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/004.yaml
  text: And it shall be that you will drink from the brook[c][b][a], and I have commanded the ravens to provide for you there.
  footnotes:
  - marker: a
    text: Or 'wadi' or 'stream' for 'brook.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to sustain you' or 'to feed you.'
    reason: lexical_alternative
  - marker: c
    text: Some have proposed a non-bird reading for 'ravens,' but the ordinary Hebrew sense is the birds, and the following context supports that reading.
    reason: alternative_reading
translation:
  language: ko
  text: 그러면 시내의 물을 마시게 될 것이며, 내가 까마귀들에게 그곳에서 너를 먹이도록 명령하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘와디’, ‘하천’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너를 부양하도록’, ‘너를 먹여 살리도록’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 일부는 ‘까마귀들’ 대신 다른 읽기를 제안하지만, 일반적인 히브리어 뜻은 새를 가리키며 뒤의 문맥도 그 해석을 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it shall be that
  chosen_korean: 그러면 … 될 것이며
  alternatives_korean:
  - 그리고 … 될 것입니다
  - 이렇게 되어 …
  lexicon: WLC
  rationale: 미래의 상황을 여는 형식적 예고를 살리되, 한국어 문맥에서는 ‘그러면’이 자연스럽게 이어지는 결과 구문으로 기능합니다.
- source_word: מֵהַנַּחַל
  english_pob_choice: from the brook
  chosen_korean: 시내의 물을
  alternatives_korean:
  - 시내에서
  - 와디의 물을
  - 개울에서
  lexicon: HALOT
  rationale: נחל은 ‘시내/개울/와디’ 범위를 가지므로, 여기서는 마실 대상이 분명하도록 ‘시내의 물’을 택했습니다.
- source_word: הָעֹרְבִים
  english_pob_choice: the ravens
  chosen_korean: 까마귀들
  alternatives_korean:
  - 갈까마귀들
  - 까마귀
  lexicon: HALOT
  rationale: 기본 뜻인 새를 가리키는 것으로 보고, 한국어에서는 문맥상 익숙한 ‘까마귀들’로 옮겼습니다.
- source_word: לְכַלְכֶּלְךָ
  english_pob_choice: to provide for you
  chosen_korean: 너를 먹이도록
  alternatives_korean:
  - 너를 돌보도록
  - 너를 공급하도록
  - 너를 부양하도록
  lexicon: HALOT
  rationale: 동사의 핵심은 단순한 ‘먹이다’보다 넓은 ‘생계를 유지하게 하다/공급하다’이지만, 이어지는 문맥이 실제 음식 제공이므로 ‘먹이도록’이 가장 직접적입니다.
theological_decisions:
- issue: 까마귀의 주체성과 신적 명령의 표현
  chosen_reading: 하나님이 이미 까마귀들에게 명령하신 것으로 분명히 진술합니다.
  alternative_readings:
  - 자연 현상으로 완화하여 표현
  - 간접적으로 ‘준비하셨습니다’로 순화
  rationale: 본문은 예언자에게 필요한 공급이 하나님의 선행 명령 아래 있다는 점을 강조하므로, 이를 완화하지 않고 명령-복종 구조를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
