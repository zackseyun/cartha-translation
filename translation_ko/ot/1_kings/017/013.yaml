  text: וַ/יֹּ֨אמֶר אֵלֶ֤י/הָ אֵלִיָּ֨הוּ֙ אַל תִּ֣ירְאִ֔י בֹּ֖אִי עֲשִׂ֣י כִ/דְבָרֵ֑/ךְ אַ֣ךְ עֲשִׂי לִ֣/י מִ֠/שָּׁם עֻגָ֨ה קְטַנָּ֤ה בָ/רִאשֹׁנָה֙ וְ/הוֹצֵ֣אתְ לִ֔/י וְ/לָ֣/ךְ וְ/לִ/בְנֵ֔/ךְ תַּעֲשִׂ֖י בָּ/אַחֲרֹנָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/013.yaml
  text: And Elijah said to her[a], “Do not fear. Go, do as you have said. But first make me a small cake from there and bring it out to me[b], and afterward make some for yourself and for your son.”
  footnotes:
  - marker: a
    text: Or 'Come, do as you have said.' The Hebrew verb can be rendered more literally as 'come,' but here it functions idiomatically as an exhortation to proceed.
    reason: lexical_alternative
  - marker: b
    text: Or 'a little cake.' The Hebrew עֻגָה can refer to a small baked loaf or cake.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 엘리야가 그녀에게 말했습니다. “두려워하지 마십시오. 가서[a] 당신이 말한 대로 하십시오. 그러나 먼저 거기에서 나를 위해 작은 빵 하나를[b] 만들어 내게 가져오십시오. 그다음에는 당신과 당신의 아들을 위해 만드십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בֹּאִי는 문자적으로는 ‘오라/오십시오’에 가깝지만, 이어지는 명령과 함께 문맥상 ‘가서/나아가서’라는 행동 촉구로 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 עֻגָה는 작은 구운 빵이나 납작한 빵을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워하지 말라
  lexicon: WLC / HALOT
  rationale: 금지형과 ירא의 결합은 두려움의 금지를 뜻하므로, 합쇼체에서 자연스럽고 간결한 ‘두려워하지 마십시오’로 옮겼습니다.
- source_word: בֹּאִי
  english_pob_choice: Go
  chosen_korean: 가서
  alternatives_korean:
  - 오십시오
  - 와서
  lexicon: WLC / HALOT
  rationale: 직역하면 ‘오다’이지만, 이어지는 명령들과 함께 행동을 재촉하는 관용적 표현이므로 문맥상 ‘가서’가 더 자연스럽습니다.
- source_word: עֻגָה קְטַנָּה
  english_pob_choice: a small cake
  chosen_korean: 작은 떡 하나
  alternatives_korean:
  - 작은 과자 하나
  - 작은 케이크 하나
  - 작은 빵 하나
  lexicon: WLC / HALOT
  rationale: עֻגָה는 작은 구운 빵/떡을 가리킬 수 있으므로, 현대 한국어에서 너무 서구적이거나 제과물처럼 들리지 않도록 ‘작은 떡’으로 옮겼습니다.
- source_word: וְהוֹצֵאתְ לִי
  english_pob_choice: and bring it out to me
  chosen_korean: 가져오고
  alternatives_korean:
  - 내게 가져오고
  - 밖으로 내오고
  lexicon: WLC / HALOT
  rationale: 히필의 ‘끌어내다/내오다’ 뉘앙스가 있으나, 실제 의미는 준비한 것을 가져오는 동작이므로 한국어에서는 ‘가져오고’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 엘리야가 먼저 자신의 몫을 요구하는 요청의 강도
  chosen_reading: 도덕적으로 완화하지 않고 ‘먼저’의 시간적 우선성을 분명히 드러냈습니다.
  alternative_readings:
  - ‘우선’으로 약화하여 요청의 강도를 누그러뜨리는 번역
  rationale: 히브리어는 엘리야의 떡이 ‘먼저’ 준비되어야 하고, 그 뒤에 그녀와 아들의 몫이 오도록 말하므로, 해석적으로 완화하지 않고 서술의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
