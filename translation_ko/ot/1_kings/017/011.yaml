base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/011.yaml
  text: As she went to get it[a], he called to her and said[b], “Please bring me a piece of bread in your hand.”
  footnotes:
  - marker: a
    text: Or “he called after her.”
    reason: lexical_alternative
  - marker: b
    text: Or “a morsel of bread.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 그것을 가지러 가자, 그가 그녀를 불러 말했습니다. “제발 당신 손에 있는 빵 한 조각을 저에게 가져다주십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “그녀가 그것을 가지러 가자”는 동작의 진행을 살린 번역입니다. 직역하면 “그녀가 그것을 가지러 가는 동안” 정도가 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: “빵 한 조각”은 פַּת לֶחֶם의 자연스러운 현대 한국어 표현입니다. 더 문자적으로는 “빵 한 입” 또는 “빵의 한 조각”이 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ לָקַחַת
  english_pob_choice: As she went to get it
  chosen_korean: 그녀가 그것을 가지러 가자
  alternatives_korean:
  - 그녀가 그것을 가지러 갔을 때
  - 그녀가 그것을 가지러 가는 동안
  lexicon: HALOT
  rationale: הלך의 진행성과 לקח의 목적을 함께 살려, 동작이 이어지는 중에 말이 걸려온 장면으로 자연스럽게 옮겼습니다.
- source_word: וַיִּקְרָא אֵלֶיהָ
  english_pob_choice: he called to her
  chosen_korean: 그가 그녀를 불러
  alternatives_korean:
  - 그가 그녀에게 외쳐
  - 그가 그녀를 불러세워
  lexicon: HALOT
  rationale: קרא + אל은 대상을 향해 부르는 뜻이므로, 한국어에서는 직접적이고 자연한 “불러”로 옮겼습니다.
- source_word: לִקְחִי נָא לִי
  english_pob_choice: Please bring me
  chosen_korean: 제발 … 저에게 가져다주십시오
  alternatives_korean:
  - 부디 … 저에게 가져오십시오
  - 제발 … 저를 위해 가져오십시오
  lexicon: HALOT
  rationale: 요청의 뉘앙스를 나타내는 נָא를 “제발”로 살리고, 요청받은 물건을 가져와 전달하는 의미를 “가져다주십시오”로 자연스럽게 표현했습니다.
- source_word: פַּת לֶחֶם
  english_pob_choice: a piece of bread
  chosen_korean: 빵 한 조각
  alternatives_korean:
  - 빵 한 입
  - 빵 한 덩어리
  lexicon: HALOT
  rationale: פַּת לֶחֶם은 빵의 한 조각/한 입 정도를 뜻하므로, 문맥상 가장 평이하고 분명한 “빵 한 조각”을 선택했습니다.
- source_word: בְּיָדֵךְ
  english_pob_choice: in your hand
  chosen_korean: 당신 손에 있는
  alternatives_korean:
  - 당신 손 안에 있는
  - 당신이 손에 든
  lexicon: HALOT
  rationale: 직역의 이미지를 살리되 한국어에서 자연한 위치 표현으로 풀어, 손에 들고 있거나 지니고 있는 상태를 함께 드러냈습니다.
