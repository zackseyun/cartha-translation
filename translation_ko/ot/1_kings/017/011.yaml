  - severity: medium
    issue: 각주 표지가 문장 끝에 함께 배치되어 각주의 대상 어구가 불명확하고, 각주 내용도 영어 POB 감사 기록의 대안과 일치하지 않습니다.
    rationale: a는 ‘그녀에게 불렀다’의 ‘뒤에서 불렀다’라는 문맥상 대안에, b는 ‘빵 한 조각’의 ‘빵 한 입’이라는 어휘 대안에 각각 연결되어야 합니다.
