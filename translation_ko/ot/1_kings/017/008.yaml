translation:
  language: ko
  text: 그때 야훼의 말씀이 그에게 임했습니다. 야훼께서 이렇게 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 신적 이름 יהוה를 사용합니다. 본문은 이 이름을 ‘야훼’로 음역합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Then ... came
  chosen_korean: 그때 ... 임하여
  alternatives_korean:
  - 그리고 ... 되었습니다
  - 그 일이 있었습니다
  lexicon: HALOT
  rationale: 서사 진행을 여는 와우 연속형의 흐름을 한국어에서는 자연스러운 시간 부사구와 동사로 옮겨, 다음 사건으로 이어지는 진행성을 살렸습니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: ‘야훼의 말씀’은 예언 서술의 고정된 표현으로, 단순한 정보 전달보다 하나님의 계시적 발화를 드러내기 위해 ‘말씀’을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유명사 יהוה를 관례에 따라 ‘야훼’로 옮겨, 호칭이 아니라 신적 이름이라는 점을 보존했습니다.
- source_word: אֵלָיו
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그에게로
  - 그분에게
  lexicon: HALOT
  rationale: 3인칭 남성 단수 목적을 한국어 조사 ‘-에게’로 직접 반영했습니다.
theological_decisions:
- issue: 예언 공식의 종결 동사 처리
  chosen_reading: ‘말씀하셨습니다’로 직접화하여 뒤따르는 인용문을 예고했습니다.
  alternative_readings:
  - ‘말하여 이르셨습니다’
  - ‘말씀하시며’
  rationale: 히브리어 לֵאמֹר는 이어질 직접화법을 여는 표지이므로, 한국어에서도 선언적이고 예언적인 어조를 유지하는 쪽이 본문의 기능을 가장 잘 드러냅니다.
  doctrine_reference: 예언 서술 관행 및 직접화법 표지
