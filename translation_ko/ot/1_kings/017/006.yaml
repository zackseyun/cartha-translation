base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/006.yaml
  text: And the ravens were bringing him bread and meat in the morning[a], and bread and meat in the evening, and he would drink from the wadi.
  footnotes:
  - marker: a
    text: Or 'brook' or 'stream'; the Hebrew נַחַל refers to a wadi or watercourse.
    reason: lexical_alternative
translation:
  language: ko
  text: 까마귀들이 아침에는 그에게 빵과 고기를, 저녁에는 빵과 고기를 가져다주었고, 그는 시내에서 물을 마셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘개울’이나 ‘시내물’로 옮길 수 있습니다. 히브리어 נַחַל은 와디나 물길을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹרְבִים
  english_pob_choice: and the ravens
  chosen_korean: 까마귀들이
  alternatives_korean:
  - 까마귀들
  - 들까마귀들이
  lexicon: HALOT
  rationale: עֹרְבִים의 기본 의미를 따라 ‘ravens’를 한국어의 일반명사 ‘까마귀들’로 옮겼습니다. 본문이 초자연적 공급을 그대로 말하므로 완화하지 않았습니다.
- source_word: מְבִיאִים
  english_pob_choice: were bringing
  chosen_korean: 가져다주었고
  alternatives_korean:
  - 가져오고 있었고
  - 가져오며
  lexicon: HALOT
  rationale: 히브리어 분사의 반복·지속적 동작을 한국어 서술에서 자연스럽게 드러내기 위해, 단순 과거보다 반복 공급의 뉘앙스가 살아 있는 표현을 택했습니다.
- source_word: לֶחֶם וּבָשָׂר
  english_pob_choice: bread and meat
  chosen_korean: 빵과 고기
  alternatives_korean:
  - 떡과 고기
  - 빵과 육고기
  lexicon: HALOT
  rationale: לֶחֶם은 ‘빵’이 가장 직접적이며, בָשָׂר은 식용 고기를 뜻하므로 현대 한국어에서 자연스러운 ‘고기’로 옮겼습니다. 교회 전통어 ‘떡’은 의미를 좁히거나 익숙한 종교어로 바꿀 위험이 있어 피했습니다.
- source_word: וּמִן הַנַּחַל
  english_pob_choice: from the wadi
  chosen_korean: 시내에서
  alternatives_korean:
  - 와디에서
  - 개울에서
  - 시냇물에서
  lexicon: HALOT
  rationale: נַחַל은 계절성 물길을 가리키지만, 한국어 본문에서는 지형 기능을 살려 ‘시내’로 옮겼습니다. ‘시냇물’은 물 자체를 가리켜 원문보다 좁아질 수 있어 피했습니다.
theological_decisions:
- issue: 여호와의 공급이 자연적 가능성보다 우선하는 본문의 직설성
  chosen_reading: 까마귀들이 실제로 먹을 것을 가져다주는 것으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 까마귀 같은 새들로 상징적으로 이해
  - 사람들이 까마귀를 통해 공급한 것으로 완화
  rationale: 본문은 기적적 공급을 서술하며, מקור의 평이한 어휘를 우회적으로 바꿀 근거가 없습니다. 원문이 말하는 사건성을 그대로 드러내는 편이 독자가 본문의 신학적 긴장을 읽는 데 유리합니다.
  doctrine_reference: 기적 서술의 문자적 독해, 본문 우선 원칙
