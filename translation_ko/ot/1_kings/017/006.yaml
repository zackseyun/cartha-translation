  text: 큰까마귀들이 아침에 그에게 빵과 고기를, 저녁에 빵과 고기를 가져다주었고, 그는 그 시내[a]에서 물을 마셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘개울’ 또는 ‘시냇물’. 히브리어 נַחַל은 와디나 물길을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹרְבִים
  english_pob_choice: and the ravens
  chosen_korean: 까마귀들이
  alternatives_korean:
  - 까마귀들
  - 들까마귀들이
  lexicon: HALOT
  rationale: עֹרְבִים의 기본 의미를 따라 ‘ravens’를 한국어의 일반명사 ‘까마귀들’로 옮겼습니다. 본문이 초자연적 공급을 그대로 말하므로 완화하지 않았습니다.
- source_word: מְבִיאִים
  english_pob_choice: were bringing
  chosen_korean: 가져다주었고
  alternatives_korean:
