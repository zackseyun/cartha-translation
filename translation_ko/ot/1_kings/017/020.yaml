  chosen_korean: 오 야훼, 나의 하나님
  alternatives_korean:
  - 오 야훼 나의 하나님
  - 야훼 나의 하나님
  lexicon: HALOT
  rationale: 직접 호격이므로 한국어에서도 감탄사 ‘오’를 두어 부름의 형식을 살렸고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: מִתְגּוֹרֵר עִמָּהּ
  english_pob_choice: with whom I am staying
  chosen_korean: 제가 머물고 있는 이 과부에게
  alternatives_korean:
  - 제가 함께 머무는 이 과부에게
  - 제가 나그네로 지내는 이 과부에게
  lexicon: HALOT
  rationale: 히트파엘 גור는 임시로 의지하며 거주하는 뜻이 있어, 문맥상 현대 한국어의 ‘머물고 있는’이 가장 자연스럽고 의미를 넓게 보존합니다.
- source_word: הֲרֵעוֹתָ
  english_pob_choice: have you also brought harm
  chosen_korean: 이렇게 하셔서
  alternatives_korean:
  - 해를 끼치셔서
  - 재앙을 내리셔서
  - 해롭게 하셔서
  lexicon: HALOT
  rationale: הֵרֵעַ는 도덕적 악이라기보다 해악·재앙을 일으키는 뜻이므로, 본문의 긴박한 항변을 살리면서도 ‘악을 행하다’로 과도하게 몰지 않도록 ‘이렇게 하셔서’로 자연화했습니다.
- source_word: לְהָמִית אֶת בְּנָהּ
  english_pob_choice: by causing her son to die
  chosen_korean: 그녀의 아들을 죽게 하셨습니까
  alternatives_korean:
  - 그녀의 아들을 죽이셨습니까
  - 그녀의 아들이 죽도록 하셨습니까
  lexicon: HALOT
  rationale: 부정사 לְהָמִית는 결과/수단을 나타내므로, 직설적 ‘죽이셨습니까’보다 원인-결과를 드러내는 ‘죽게 하셨습니까’가 문맥에 더 가깝습니다.
theological_decisions:
- issue: 엘리야의 발화가 하나님을 도덕적 악으로 고발하는지, 재앙을 허용/초래하신 것으로 호소하는지
  chosen_reading: ‘이렇게 하셔서’와 ‘죽게 하셨습니까’로 옮겨, 하나님께서 재앙을 주관하신다는 항변은 유지하되 도덕적 악행 고발로 과장하지 않았습니다.
  alternative_readings:
  - ‘악을 행하셨습니까’
  - ‘해를 끼치셨습니까’
  rationale: 히브리어 הֵרֵעַ는 해악·재앙을 뜻할 수 있어, 본문의 신학적 긴장을 보존하면서도 한국어 독자가 하나님을 직접적인 악행자로 단정해 읽지 않도록 했습니다.
  doctrine_reference: 원문 우선과 신학적 긴장 보존
