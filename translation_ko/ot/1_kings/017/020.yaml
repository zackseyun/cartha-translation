base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/020.yaml
  text: Then he cried out to Yahweh and said[a], “O Yahweh my God, have you also brought harm on the widow with whom I am staying[b], by causing her son to die?”
  footnotes:
  - marker: a
    text: Or 'have you done evil to the widow'; the Hebrew verb can denote doing harm, bringing calamity, or dealing badly.
    reason: lexical_alternative
  - marker: b
    text: Or 'with whom I sojourn'; the Hebrew suggests residing as a guest or dependent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그는 야훼께 부르짖으며 말했습니다. “오 야훼, 나의 하나님, 제가 머물고 있는[a] 과부에게도 해를 끼치셔서[b] 그 아들을 죽게 하셨습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제가 나그네로 지내는’. 히브리어는 손님이나 의존인으로 머무는 뉘앙스를 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘해를 끼치다’, ‘재앙을 가져오다’, ‘나쁘게 대하다’까지 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
