  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֥א אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר יְהוָ֣ה אֱלֹהָ֔/י הֲ֠/גַם עַל הָ/אַלְמָנָ֞ה אֲשֶׁר אֲנִ֨י מִתְגּוֹרֵ֥ר עִמָּ֛/הּ הֲרֵע֖וֹתָ לְ/הָמִ֥ית אֶת בְּנָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/020.yaml
  text: Then he cried out to Yahweh and said[a], “O Yahweh my God, have you also brought harm on the widow with whom I am staying[b], by causing her son to die?”
  footnotes:
  - marker: a
    text: Or 'have you done evil to the widow'; the Hebrew verb can denote doing harm, bringing calamity, or dealing badly.
    reason: lexical_alternative
  - marker: b
    text: Or 'with whom I sojourn'; the Hebrew suggests residing as a guest or dependent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그가 야훼께 부르짖으며 말했습니다. “오 야훼, 나의 하나님, 제가 머물고 있는 이 과부에게도 이렇게 하셔서, 그녀의 아들을 죽게 하셨습니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘해를 끼치다’, ‘재앙을 가져오다’, ‘나쁘게 대하다’까지 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 나그네로 지내는’; 히브리어는 손님이나 의존인으로 머무는 뉘앙스를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל יְהוָה
  english_pob_choice: Then he cried out to Yahweh
  chosen_korean: 그가 야훼께 부르짖으며
  alternatives_korean:
  - 그가 야훼께 외치며
  - 그가 야훼께 부르짖어
  lexicon: HALOT
  rationale: אֶל־יְהוָה와 결합한 קרא는 단순 발화보다 긴급한 호소를 드러내므로, 자연스러운 현대 한국어로 ‘부르짖다’가 적절합니다.
- source_word: יְהוָה אֱלֹהָי
  english_pob_choice: O Yahweh my God
  chosen_korean: 오 야훼, 나의 하나님
  alternatives_korean:
  - 오 야훼 나의 하나님
  - 야훼 나의 하나님
  lexicon: HALOT
  rationale: 직접 호격이므로 한국어에서도 감탄사 ‘오’를 두어 부름의 형식을 살렸고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: מִתְגּוֹרֵר עִמָּהּ
  english_pob_choice: with whom I am staying
  chosen_korean: 제가 머물고 있는 이 과부에게
  alternatives_korean:
  - 제가 함께 머무는 이 과부에게
  - 제가 나그네로 지내는 이 과부에게
  lexicon: HALOT
  rationale: 히트파엘 גור는 임시로 의지하며 거주하는 뜻이 있어, 문맥상 현대 한국어의 ‘머물고 있는’이 가장 자연스럽고 의미를 넓게 보존합니다.
- source_word: הֲרֵעוֹתָ
  english_pob_choice: have you also brought harm
  chosen_korean: 이렇게 하셔서
  alternatives_korean:
  - 해를 끼치셔서
  - 재앙을 내리셔서
  - 해롭게 하셔서
  lexicon: HALOT
  rationale: הֵרֵעַ는 도덕적 악이라기보다 해악·재앙을 일으키는 뜻이므로, 본문의 긴박한 항변을 살리면서도 ‘악을 행하다’로 과도하게 몰지 않도록 ‘이렇게 하셔서’로 자연화했습니다.
- source_word: לְהָמִית אֶת בְּנָהּ
  english_pob_choice: by causing her son to die
  chosen_korean: 그녀의 아들을 죽게 하셨습니까
  alternatives_korean:
  - 그녀의 아들을 죽이셨습니까
  - 그녀의 아들이 죽도록 하셨습니까
  lexicon: HALOT
  rationale: 부정사 לְהָמִית는 결과/수단을 나타내므로, 직설적 ‘죽이셨습니까’보다 원인-결과를 드러내는 ‘죽게 하셨습니까’가 문맥에 더 가깝습니다.
theological_decisions:
- issue: 엘리야의 발화가 하나님을 도덕적 악으로 고발하는지, 재앙을 허용/초래하신 것으로 호소하는지
  chosen_reading: ‘이렇게 하셔서’와 ‘죽게 하셨습니까’로 옮겨, 하나님께서 재앙을 주관하신다는 항변은 유지하되 도덕적 악행 고발로 과장하지 않았습니다.
  alternative_readings:
  - ‘악을 행하셨습니까’
  - ‘해를 끼치셨습니까’
  rationale: 히브리어 הֵרֵעַ는 해악·재앙을 뜻할 수 있어, 본문의 신학적 긴장을 보존하면서도 한국어 독자가 하나님을 직접적인 악행자로 단정해 읽지 않도록 했습니다.
  doctrine_reference: 원문 우선과 신학적 긴장 보존
