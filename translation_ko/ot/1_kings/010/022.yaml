id: 1KI.10.22
reference: 1 Kings 10:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ אֳנִ֨י תַרְשִׁ֤ישׁ לַ/מֶּ֨לֶךְ֙ בַּ/יָּ֔ם עִ֖ם אֳנִ֣י חִירָ֑ם אַחַת֩ לְ/שָׁלֹ֨שׁ שָׁנִ֜ים תָּב֣וֹא אֳנִ֣י תַרְשִׁ֗ישׁ נֹֽשְׂאֵת֙ זָהָ֣ב וָ/כֶ֔סֶף שֶׁנְהַבִּ֥ים וְ/קֹפִ֖ים וְ/תֻכִּיִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/022.yaml
  text: For the king had ships of Tarshish at sea with Hiram’s ships. Once every three years the ships of Tarshish would come, carrying gold and silver, ivory, apes, and peacocks.
translation:
  language: ko
  text: 왕에게는 바다에서 히람의 배들과 함께 다니는 다시스의 배들이 있었습니다. 다시스의 배들은 삼 년에 한 번씩 금과 은과 상아와 원숭이와 공작을 싣고 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֳנִי תַרְשִׁישׁ
  english_pob_choice: ships of Tarshish
  chosen_korean: 다시스 배들
  alternatives_korean:
  - 다시스의 배들
  - 다시스선
  lexicon: אֳנִי
  rationale: 히브리어 אֳנִי는 단순히 ‘배/선박’을 뜻하므로, POB의 'ships of Tarshish'를 자연스럽게 살려 '다시스 배들'로 옮겼습니다.
- source_word: לַמֶּלֶךְ ... עִם אֳנִי חִירָם
  english_pob_choice: for the king had ships of Tarshish at sea with Hiram’s ships
  chosen_korean: 왕이 바다에 히람의 배들과 함께 다시스 배들을 두었으므로
  alternatives_korean:
  - 왕은 바다에 히람의 배들과 함께 다시스 배들을 두었습니다
  - 왕의 다시스 배들은 바다에서 히람의 배들과 함께 있었습니다
  lexicon: לַמֶּלֶךְ / עִם
  rationale: 원문은 상태 설명문이므로 한국어에서는 원인·배경을 드러내는 '...두었으므로'로 매끈하게 연결하되, '히람의 배들과 함께'라는 병행 관계를 보존했습니다.
- source_word: אחת לְשָׁלֹשׁ שָׁנִים
  english_pob_choice: Once every three years
  chosen_korean: 삼 년에 한 번씩
  alternatives_korean:
  - 세 해마다
  - 세 해에 한 번씩
  lexicon: אחת ... שָׁנִים
  rationale: 관용적으로 시간을 나타내는 반복 표현이므로 현대 한국어에서 가장 자연스러운 '삼 년에 한 번씩'으로 옮겼습니다.
- source_word: נֹשְׂאֵת זָהָב וָכֶסֶף שֶׁנְהַבִּים וְקֹפִים וְתֻכִּיִּים
  english_pob_choice: carrying gold and silver, ivory, apes, and peacocks
  chosen_korean: 금과 은과 상아와 원숭이와 공작을 실어 왔습니다
  alternatives_korean:
  - 금과 은과 상아와 원숭이와 공작을 싣고 왔습니다
  - 금과 은과 상아와 원숭이와 공작을 운반해 왔습니다
  lexicon: נֹשְׂאֵת
  rationale: נשא의 분사적 의미를 한국어 동사구로 풀어 '실어 왔습니다'라 번역해, 반복 입항과 화물 운송의 그림을 살렸습니다.
theological_decisions:
- issue: 고대 무역선·항목 나열을 역사 서술로 유지할지, 상징화할지
  chosen_reading: 문자적 역사 서술로 유지해, 솔로몬 시대 해상 무역의 규모를 드러내는 진술로 옮겼습니다.
  alternative_readings:
  - 부와 번영의 상징으로 의역
  - 시적·상징적 표현으로 완화
  rationale: 본문은 상징 언어가 아니라 구체적 물품 목록을 제시하는 역사 서술이므로, 의미를 약화시키지 않도록 직역에 가깝게 유지했습니다.
  doctrine_reference: 열왕기상 10장 문맥의 솔로몬 번영 기사
- issue: '''ships of Tarshish''를 고유명사+종류명으로 볼지'
  chosen_reading: '''다시스 배들''로 두어 지명적 표지를 살리되, 특정 항해 유형의 뉘앙스도 남겼습니다.'
  alternative_readings:
  - '''다시스선''처럼 하나의 조어로 처리'
  - '''다시스의 배들''로 소유격화'
  rationale: 히브리어와 POB의 'ships of Tarshish'를 함께 반영하면서, 한국어에서 지나치게 설명적이거나 인위적인 표현을 피했습니다.
  doctrine_reference: 본문의 지리·상업 배경
