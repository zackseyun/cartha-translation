  naturalness: ‘솔로몬 왕의 손에 따라 준 것’ 및 ‘다만 … 외에도 그러했습니다’는 현대 표준 한국어 문장으로 어색합니다. 관용구는 본문에서 ‘넉넉함에 따라’로 자연스럽게 의미를 전달하고, 각주에서 직역과 관용적 의미를 밝혀 주는 방식이 적절합니다. 귀환 장면은 ‘몸을 돌려 … 갔으며, … 함께였습니다’로 두 동사와 동행자를 모두 자연스럽게 살릴 수 있습니다.
