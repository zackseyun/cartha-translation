base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/013.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what he gave her according to the hand of King Solomon. Then she turned and went to her own land, she and her servants.
  footnotes:
  - marker: a
    text: 'Hebrew: ''according to the hand of King Solomon,'' an idiom meaning according to his means or generosity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬 왕은 스바의 여왕에게 그녀가 바란 모든 것, 곧 그녀가 구한 것은 무엇이든지 주었습니다. 다만 솔로몬 왕의 손에 따라 준 것 외에도 그러했습니다. 그러고 나서 그녀는 자기 땅으로 돌아갔습니다. 그녀와 그녀의 종들이 함께였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘왕의 손에 따라’는 능력이나 관대함에 따라라는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ שְׁלֹמֹה נָתַן
  english_pob_choice: And King Solomon gave
  chosen_korean: 솔로몬 왕은 … 주었습니다
  alternatives_korean:
  - 솔로몬 왕은 … 주었습니다
  - 솔로몬 왕은 … 주셨습니다
  lexicon: WLC; HALOT נָתַן
  rationale: 서술문으로서 평이한 ‘주었습니다’가 히브리어의 직접적 의미를 자연스럽게 옮기며, 왕칭칭호는 한국어에서 흔한 ‘솔로몬 왕’으로 처리했습니다.
- source_word: כָּל חֶפְצָהּ / אֲשֶׁר שָׁאָלָה
  english_pob_choice: all that she desired / whatever she asked
  chosen_korean: 그녀가 바란 모든 것, 곧 그녀가 구한 것은 무엇이든지
  alternatives_korean:
  - 그녀가 원하는 모든 것
  - 그녀가 요청한 것은 무엇이든지
  lexicon: HALOT חֵפֶץ; שׁאל
  rationale: חֵפֶץ는 단순 소망보다 ‘바람/원하는 것’의 폭이 있어 ‘바란 모든 것’으로, שׁאל은 ‘구하다’로 옮겨 두 절을 병렬적으로 살렸습니다.
- source_word: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  english_pob_choice: according to the hand of King Solomon
  chosen_korean: 솔로몬 왕의 손에 따라 준 것
  alternatives_korean:
  - 솔로몬 왕의 손에 따라
  - 솔로몬 왕의 손길에 따라 준 것
  lexicon: HALOT יָד
  rationale: ‘손’ 직역을 유지하되 한국어에서 자연스러운 문맥이 되도록 ‘손에 따라 준 것’으로 풀어, 능력·관대함을 뜻하는 관용구임을 본문 안에서 드러냈습니다.
- source_word: וַתֵּפֶן וַתֵּלֶךְ לְאַרְצָהּ
  english_pob_choice: Then she turned and went to her own land
  chosen_korean: 그러고 나서 그녀는 자기 땅으로 돌아갔습니다
  alternatives_korean:
  - 그러고 나서 그녀는 자기 땅으로 갔습니다
  - 그리하여 그녀는 자기 땅으로 돌아갔습니다
  lexicon: HALOT פנה; הלך
  rationale: 두 동사의 연속을 한국어에서는 ‘돌아갔습니다’로 자연스럽게 묶어, 왕궁 방문의 마무리와 귀환을 분명히 했습니다.
- source_word: הִיא וַעֲבָדֶיהָ
  english_pob_choice: she and her servants
  chosen_korean: 그녀와 그녀의 종들이 함께였습니다
  alternatives_korean:
  - 그녀와 그녀의 종들이 함께 있었습니다
  - 그녀와 그녀의 시종들이 함께였습니다
  lexicon: HALOT עבד
  rationale: ‘종’은 POB 기본값을 따르되, 왕실 맥락에서의 수행원을 가리키는 자연스러운 표현으로 사용했습니다.
theological_decisions:
- issue: מִלְּבַד אֲשֶׁר נָתַן לָהּ כְּיַד הַמֶּלֶךְ שְׁלֹמֹה의 관용구 처리
  chosen_reading: ‘솔로몬 왕의 손에 따라 준 것’으로 직역을 남기되 문맥상 관대함의 뜻을 보이게 함
  alternative_readings:
  - ‘솔로몬 왕의 넉넉함에 따라’
  - ‘솔로몬 왕의 재력에 따라’
  rationale: 본문은 솔로몬의 여유와 관대함을 말하지만, 히브리어 관용구의 이미지(‘손’)를 지워 버리면 출처의 맛이 약해집니다. 그래서 한국어에서도 직역 요소를 남겼습니다.
  doctrine_reference: Translation philosophy §1, §6
