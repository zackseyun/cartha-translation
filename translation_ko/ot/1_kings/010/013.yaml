revisions:
- from: 솔로몬 왕은 스바의 여왕에게 그녀가 바란 모든 것, 곧 그녀가 구한 것은 무엇이든지 주었습니다. 다만 솔로몬 왕의 손에 따라 준 것 외에도 그러했습니다. 그러고 나서 그녀는 자기 땅으로 돌아갔습니다. 그녀와 그녀의 종들이 함께였습니다.[a]
  to: 솔로몬 왕은 스바의 여왕에게 그녀가 바란 모든 것, 곧 그녀가 구한 것은 무엇이든지 주었고, 그 밖에도 솔로몬 왕의 넉넉함에 따라 그녀에게 주었습니다.[a] 그 후 그녀는 몸을 돌려 자기 땅으로 갔으며, 그녀의 종들도 함께였습니다.
  rationale: 요청한 모든 것을 준 것과 그 밖에 왕의 넉넉함에 따라 준 것을 명확히 구별하여 מִלְּבַד의 추가 의미를 회복했습니다. 히브리어 관용구의 의미는 본문에서 자연스럽게 옮기고, 직역 및 의미 범위는 해당 위치의 각주로 보완했습니다. 또한 ‘몸을 돌려’와 ‘함께였습니다’를 사용해 떠남의 연속 동작과 종들의 동행을 보존했습니다.
  reviewer_model: gpt-5.6-terra
