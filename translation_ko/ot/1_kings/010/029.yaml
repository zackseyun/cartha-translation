  naturalness: 현대 표준어 합쇼체로 ‘병거 한 대’, ‘말 한 필’, ‘수입되었습니다’, ‘내보냈습니다’를 사용하면 자연스럽고 명료합니다. ‘헷 사람의 모든 왕들’은 ‘헷 사람들의 모든 왕들’로 고쳐 한국어 소유·집단 표현을 자연스럽게 했습니다.
