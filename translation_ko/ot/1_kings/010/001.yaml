  text: Now the queen of Sheba heard of Solomon’s fame concerning the name of Yahweh[b][a], and she came to test him with riddles.
  footnotes:
  - marker: a
    text: Or 'the report about Solomon in relation to the name of the LORD.' The Hebrew phrase is compact and may indicate that Solomon’s fame was connected with the LORD’s name or reputation.
    reason: lexical_alternative
  - marker: b
    text: Or 'with hard questions.' The Hebrew more literally refers to 'riddles' or 'enigmas.'
    reason: lexical_alternative
translation:
  language: ko
  text: 스바의 여왕은 솔로몬의 명성 곧 야훼의 이름과 관련된 그 소문을 듣고, 수수께끼로 그를 시험하러 왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘솔로몬에 관한 보고, 곧 야훼의 이름과 관련된 보고’로도 옮길 수 있습니다. 히브리어 구문은 매우 압축되어 있어, 솔로몬의 명성이 야훼의 이름이나 그 명성과 연결되었음을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘어려운 질문들로’입니다. 히브리어는 더 문자적으로는 ‘수수께끼들’ 또는 ‘수수께끼 같은 말들’을 가리킵니다.
    reason: lexical_alternative
