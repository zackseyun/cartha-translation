  yaml_path: translation/ot/1_kings/010/019.yaml
  text: The throne had six steps[a], and the throne had a rounded top at its back, and armrests on this side and on that beside the seat[b], and two lions standing beside the armrests.
  footnotes:
  - marker: a
    text: Or 'the throne had a round top behind it.' The Hebrew phrase is concise and may be rendered more literally.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the place of sitting.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 왕좌에는 여섯 계단이 있었고, 그 뒤쪽에는 둥근 윗부분이 있었으며,[a] 앉는 자리[b]의 이쪽과 저쪽에는 팔걸이가 있었고, 두 사자가 그 팔걸이 곁에 서 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕좌 뒤에 둥근 꼭대기가 있었다.’ 히브리어 표현은 간결하여 더 문자적으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘앉음의 장소’입니다.
    reason: lexical_alternative
