  text: שֵׁ֧שׁ מַעֲל֣וֹת לַ/כִּסֵּ֗ה וְ/רֹאשׁ עָגֹ֤ל לַ/כִּסֵּה֙ מֵ/אַֽחֲרָ֔י/ו וְ/יָדֹ֛ת מִ/זֶּ֥ה וּ/מִ/זֶּ֖ה אֶל מְק֣וֹם הַ/שָּׁ֑בֶת וּ/שְׁנַ֣יִם אֲרָי֔וֹת עֹמְדִ֖ים אֵ֥צֶל הַ/יָּדֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/019.yaml
  text: The throne had six steps[a], and the throne had a rounded top at its back, and armrests on this side and on that beside the seat[b], and two lions standing beside the armrests.
  footnotes:
  - marker: a
    text: Or 'the throne had a round top behind it.' The Hebrew phrase is concise and may be rendered more literally.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the place of sitting.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 왕좌에는 여섯 계단이 있었고, 왕좌 뒤쪽에는 둥근 꼭대기가 있었으며, 이쪽과 저쪽에는 앉는 자리 곁까지 팔걸이가 있었고, 두 사자가 그 팔걸이 곁에 서 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그 왕좌 뒤에 둥근 꼭대기’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘앉는 자리의 장소’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  english_pob_choice: steps
  chosen_korean: 계단
  alternatives_korean:
  - 층계
  - 단
  lexicon: HALOT
  rationale: 왕좌 구조의 오름 장치를 가리키므로 자연스러운 현대어인 ‘계단’이 가장 직접적입니다.
- source_word: לַכִּסֵּה
  english_pob_choice: the throne
  chosen_korean: 왕좌
  alternatives_korean:
  - 보좌
  - 그 왕좌
  lexicon: HALOT
  rationale: 문맥상 단순한 의자가 아니라 왕의 좌정을 위한 왕좌이므로 ‘왕좌’로 옮겼습니다.
- source_word: יָדֹת
  english_pob_choice: armrests
  chosen_korean: 팔걸이
  alternatives_korean:
  - 팔받침
  - 팔받이
  - 손잡이
  lexicon: HALOT
  rationale: 좌석의 양옆 지지대를 뜻하므로, 현대 한국어에서 가장 자연스럽고 기능을 드러내는 ‘팔걸이’를 택했습니다.
- source_word: מְקוֹם הַשָּׁבֶת
  english_pob_choice: the seat
  chosen_korean: 앉는 자리
  alternatives_korean:
  - 좌석
  - 앉는 곳
  lexicon: HALOT
  rationale: 직역하면 ‘앉음의 자리’이므로, 기능을 살린 ‘앉는 자리’가 원문의 의미를 비교적 가깝게 전합니다.
theological_decisions:
- issue: 왕좌의 묘사에서 물질적 세부를 과장 없이 전달할지 여부
  chosen_reading: 구체적 장식과 구조를 있는 그대로 묘사하는 서술로 유지했습니다.
  alternative_readings:
  - 상징적으로 완화해 표현
  - 일반적인 ‘의자’로 낮춰 표현
  rationale: 본문은 솔로몬의 왕좌의 실제 구조를 세밀하게 묘사하므로, 상징화하거나 평준화하지 않고 원문의 시각적 진술을 보존하는 것이 적절합니다.
  doctrine_reference: 본문 서술의 역사성 및 왕권 묘사
