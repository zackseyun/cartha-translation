base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/004.yaml
  text: When the queen of Sheba saw all the wisdom of Solomon and the house that he had built,[a]
  footnotes:
  - marker: a
    text: Or 'the palace that he had built.' The Hebrew word 'house' can refer to a royal residence in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 스바의 여왕은 솔로몬의 모든 지혜와 그가 지은 집을 보고서,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 지은 궁전’입니다. 히브리어 ‘집’은 문맥에 따라 왕궁을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכַּת שְׁבָא
  english_pob_choice: the queen of Sheba
  chosen_korean: 스바의 여왕
  alternatives_korean:
  - 스바 여왕
  - 시바의 여왕
  lexicon: HALOT
  rationale: 히브리어 소유격 구성은 한국어의 ‘~의’로 자연스럽게 옮겼습니다. ‘스바’는 고유지명으로 음역했고, 직함은 ‘여왕’으로 분명하게 나타냈습니다.
- source_word: כָּל חָכְמַת שְׁלֹמֹה
  english_pob_choice: all the wisdom of Solomon
  chosen_korean: 솔로몬의 모든 지혜
  alternatives_korean:
  - 솔로몬의 지혜 전체
  - 솔로몬의 온갖 지혜
  lexicon: HALOT
  rationale: כָּל의 총체성을 ‘모든’으로 살리고, construct 관계는 ‘솔로몬의 지혜’로 옮겨 원문의 소유·관계 구조를 유지했습니다.
- source_word: וְהַבַּיִת
  english_pob_choice: and the house
  chosen_korean: 그가 지은 집
  alternatives_korean:
  - 그가 지은 궁전
  - 그가 건축한 집
  lexicon: HALOT
  rationale: 본문의 기본어는 ‘집’이지만 왕궁 문맥을 고려해도 원문 투명성을 우선해 ‘집’으로 두었습니다. 동사절은 뒤의 관계절을 자연스럽게 풀어 ‘그가 지은’으로 옮겼습니다.
- source_word: אֲשֶׁר בָּנָה
  english_pob_choice: that he had built
  chosen_korean: 지은
  alternatives_korean:
  - 세운
  - 건축한
  lexicon: HALOT
  rationale: 관계절은 앞 명사를 수식하는 완료된 행위를 나타내므로, 한국어에서는 축약해 ‘지은’으로 처리해 문장을 매끄럽게 했습니다.
theological_decisions:
- issue: 왕궁을 가리키는 "집"의 번역
  chosen_reading: 본문의 ‘집’을 그대로 유지하되, 왕궁일 가능성은 번역문 본문이 아니라 주석 가능성으로 남깁니다.
  alternative_readings:
  - 궁전
  - 왕궁
  rationale: 문맥상 왕궁을 뜻할 수 있으나, 원문 어휘 자체는 ‘집’이므로 의미를 좁혀 확정적으로 옮기지 않았습니다.
  doctrine_reference: 번역 투명성 원칙
- issue: 서술의 시제와 서사 흐름
  chosen_reading: ‘보고서’로 연결해 다음 절과 이어지는 서술 흐름을 한국어에서 자연스럽게 살렸습니다.
  alternative_readings:
  - 보고
  - 보니
  rationale: 히브리어 waw-연속의 서사 진행을 한국어에서 완만한 연결 표현으로 반영해 장면의 연속성을 유지했습니다.
  doctrine_reference: 서사문체 보존
