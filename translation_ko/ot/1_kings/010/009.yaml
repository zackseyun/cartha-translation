id: 1KI.10.9
reference: 1 Kings 10:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁר֙ חָפֵ֣ץ בְּ/ךָ֔ לְ/תִתְּ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל בְּ/אַהֲבַ֨ת יְהוָ֤ה אֶת יִשְׂרָאֵל֙ לְ/עֹלָ֔ם וַ/יְשִֽׂימְ/ךָ֣ לְ/מֶ֔לֶךְ לַ/עֲשׂ֥וֹת מִשְׁפָּ֖ט וּ/צְדָקָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/009.yaml
  text: Blessed be Yahweh your God[a], who delighted in you to set you on the throne of Israel. Because Yahweh loved Israel forever, he has made you king to administer justice and righteousness.
  footnotes:
  - marker: a
    text: Or, 'Because of the LORD's love for Israel forever.' The Hebrew phrase may be rendered more literally with 'love' as a noun rather than the verbal 'loves.'
    reason: lexical_alternative
translation:
  language: ko
  text: “야훼 당신의 하나님을 찬양하십시오. 그분은 당신을 좋게 여기셔서 이스라엘 왕좌에 앉히셨습니다. 야훼께서 이스라엘을 영원히 사랑하셨기 때문에 그분은 당신을 왕으로 세워 정의와 의를 행하게 하셨습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신을 좋게 여기셔서’는 히브리어 חפץ ב־의 호의·기쁨 의미를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  english_pob_choice: Blessed be
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 복되시다
  - 찬송받으소서
  lexicon: HALOT
  rationale: 히브리어 축복 선언문의 수사적 기능을 살려 한국어에서는 자연스러운 경배·찬양 표현으로 옮겼습니다. 직역형 ‘복되시다’는 문맥의 호소력을 약하게 할 수 있습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 여호와 신명 직접 표기를 따라야 하므로 프로젝트 기본값인 ‘야훼’를 유지했습니다.
- source_word: אֲשֶׁר חָפֵץ בְּךָ
  english_pob_choice: who delighted in you
  chosen_korean: 당신을 좋게 여기셔서
  alternatives_korean:
  - 당신을 기뻐하셔서
  - 당신을 기뻐하신 분으로서
  lexicon: HALOT
  rationale: חפץ ב־의 호의·기쁨 의미를 살리되, 왕위 부여와 연결되는 하나님의 호의가 한국어로 자연스럽게 들리도록 했습니다.
- source_word: לְתִתְּךָ עַל כִּסֵּא יִשְׂרָאֵל
  english_pob_choice: to set you on the throne of Israel
  chosen_korean: 이스라엘 왕좌에 앉히셨습니다
  alternatives_korean:
  - 이스라엘의 왕좌에 세우셨습니다
  - 이스라엘의 왕좌에 올려놓으셨습니다
  lexicon: HALOT
  rationale: נתן + על כסא의 즉위 이미지를 한국어 동사 ‘앉히다’로 살려 왕권 수여의 구체성을 유지했습니다.
- source_word: בְּאַהֲבַת יְהוָה אֶת יִשְׂרָאֵל לְעֹלָם
  english_pob_choice: Because Yahweh loved Israel forever
  chosen_korean: 야훼께서 이스라엘을 영원히 사랑하셨기 때문에
  alternatives_korean:
  - 야훼의 이스라엘에 대한 영원한 사랑 때문에
  - 야훼께서 이스라엘을 영원히 사랑하시는 까닭에
  lexicon: HALOT
  rationale: 히브리어의 בְּ + 추상명사 구문이 원인절로 기능하므로 ‘~때문에’로 옮겼습니다. ‘영원히’는 לְעֹלָם의 지속성을 분명하게 드러냅니다.
- source_word: וַיְשִׂימְךָ לְמֶלֶךְ
  english_pob_choice: he has made you king
  chosen_korean: 그분은 당신을 왕으로 세워
  alternatives_korean:
  - 그분은 당신을 왕으로 만드셔서
  - 그분은 당신을 왕으로 임명하셔서
  lexicon: HALOT
  rationale: שׂים + ל의 임명·위임 의미를 ‘왕으로 세워’로 자연스럽게 반영했습니다.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  english_pob_choice: to administer justice and righteousness
  chosen_korean: 정의와 의를 행하게 하셨습니다
  alternatives_korean:
  - 정의와 의를 집행하게 하셨습니다
  - 공의와 의를 행하게 하셨습니다
  lexicon: HALOT
  rationale: 왕의 직무를 가리키는 עשׂה + משפט וצדקה는 단순 행위가 아니라 통치 실행을 뜻하므로, ‘행하다’와 ‘정의/의’의 조합으로 압축해 살렸습니다.
theological_decisions:
- issue: 여호와/야훼의 개인명 사용
  chosen_reading: ‘주’ 같은 대치어가 아니라 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 예배용 칭호가 아니라 신명 יְהוָה를 직접 사용하므로, POB 원칙에 따라 고유명사성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 축복문을 한국어에서 어떻게 형상화할지
  chosen_reading: ‘찬양하십시오’로 옮겨 축복 선언의 공적·예배적 뉘앙스를 살렸습니다.
  alternative_readings:
  - 복되시다
  - 복을 받으소서
  rationale: 히브리어 benediction은 단순 정보 전달보다 선포적 찬양에 가깝기 때문에, 현대 합쇼체에서 자연스럽고 엄숙한 예배 어조를 선택했습니다.
  doctrine_reference: POB style and register guidance
