    rationale: יְהִי ... בָּרוּךְ는 ‘야훼께서/야훼는 찬송받으소서’라는 소망·찬송의 표현입니다.
  - severity: medium
    issue: ‘좋게 여기셔서’는 חָפֵץ בְּ의 기쁨과 호의의 의미를 충분히 드러내지 못합니다.
