  text: 솔로몬은 병거와 기병을 모았는데, 그에게는 병거 천사백 대와 기병 만이천 명이 있었습니다. 그는 그들을 병거 도시들과 예루살렘의 왕 곁에 배치했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
