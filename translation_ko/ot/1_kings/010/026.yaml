  text: Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen, and he stationed them in the chariot cities and with the king in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'cavalry' for 'horsemen'; the Hebrew more literally refers to mounted riders.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 병거와 기병[a]을 모았고, 그에게는 병거 천사백 대와 기병 만 이천 명이 있었습니다. 그는 그들을 병거 성읍들에, 또 예루살렘에서는 왕과 함께 배치했습니다.
  philosophy: optimal-equivalence
