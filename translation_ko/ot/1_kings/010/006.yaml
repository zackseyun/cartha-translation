  lexicon: HALOT
  rationale: 직접 대화의 대상이므로 ‘왕에게’가 가장 평이하고 본문 흐름에 맞습니다.
- source_word: אֱמֶת הָיָה הַדָּבָר
  english_pob_choice: The report ... was true
  chosen_korean: 들은 말은 참이었습니다
  alternatives_korean:
  - 그 말은 진실했습니다
  - 그 일이 참이었습니다
  lexicon: HALOT
  rationale: דָּבָר는 여기서 단순한 ‘말’보다 ‘들은 말/보고된 말’의 의미가 자연스러워, POB의 ‘report’ 취지를 살려 ‘들은 말’로 옮겼습니다. ‘참이었습니다’는 predicative אֱמֶת을 자연스럽게 반영합니다.
- source_word: בְּאַרְצִי
  english_pob_choice: in my own land
  chosen_korean: 내 땅에서
  alternatives_korean:
  - 내 나라에서
  - 내 고장 땅에서
  lexicon: HALOT
  rationale: אֶרֶץ의 기본 의미를 따라 ‘땅’으로 옮기되, 소유격 ‘내’를 살려 먼 곳에서 들은 소문이라는 대비를 분명히 했습니다.
- source_word: עַל דְּבָרֶיךָ וְעַל חָכְמָתֶךָ
  english_pob_choice: about your words and your wisdom
  chosen_korean: 당신의 말씀과 당신의 지혜에 관해
  alternatives_korean:
  - 당신의 말과 당신의 지혜에 관해
  - 당신의 일들과 당신의 지혜에 관해
  lexicon: HALOT
  rationale: דְּבָרֶיךָ는 문맥상 단순한 ‘말’뿐 아니라 평판과 관련된 전반적 내용까지 담을 수 있으므로, 한국어에서는 ‘말씀’으로 번역해 왕의 발화와 명성을 함께 포괄했습니다. ‘지혜’는 ישר로 대응합니다.
theological_decisions:
- issue: דְּבָרֶיךָ의 의미 범위
  chosen_reading: ‘당신의 말씀’으로 옮겨, 솔로몬의 발화와 그에 대한 평판을 함께 포괄하게 했습니다.
  alternative_readings:
  - ‘당신의 일들’
  - ‘당신의 업적들’
  rationale: 히브리어 복수형 דְּבָרִים는 문맥에 따라 말, 일, 사건을 뜻할 수 있습니다. 여기서는 여왕이 솔로몬에 대해 들은 내용을 가리키므로, 전통적 교회 언어보다 문맥상 더 넓은 의미를 살리는 표현이 적절합니다.
  doctrine_reference: 본문 문맥 및 HALOT 용례
- issue: 합쇼체 서술과 직접 인용의 구분
  chosen_reading: 서술부는 ‘말했습니다’로, 직접 인용문은 평서형으로 유지했습니다.
  alternative_readings:
  - 모든 부분을 한결같이 평서형으로 처리
  - 직접화법 안에서도 합쇼체를 계속 사용
  rationale: 서술자는 현대 표준어 합쇼체를 쓰고, 인용문은 원문의 직접 발화를 자연스럽게 보존하는 방식이 본문 구조를 가장 잘 드러냅니다.
  doctrine_reference: 서술/인용 체계
