  text: 그러자 그녀는 왕에게 말했습니다. “내 나라에서 왕께서 하신 말씀[a]과 왕께서 지니신 지혜에 관하여 들은 이야기는 참이었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘당신의 말씀들’은 문맥에 따라 당신에 관한 일들, 사안들, 또는 업적들을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: Then she said
  chosen_korean: 그때 그 여인이 말했습니다
  alternatives_korean:
  - 그리고 그녀가 말했습니다
  - 그 여인이 말했습니다
  lexicon: BDB/HALOT
  rationale: 와우 연속의 서술 진행을 자연스러운 한국어로 옮기되, 합쇼체 서술에 맞게 ‘그때’로 장면 전환의 흐름을 살렸습니다.
- source_word: אֶל הַמֶּלֶךְ
  english_pob_choice: to the king
  chosen_korean: 왕에게
  alternatives_korean:
