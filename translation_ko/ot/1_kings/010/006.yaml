  source_fidelity: 원문의 순차적 서술, 왕에게 한 발화, 자신이 자기 나라에서 들은 보고, 그리고 ‘당신의 말들/일들’과 지혜라는 병렬을 대체로 잘 반영합니다. 다만 왕에게 직접 ‘당신’이라고 하는 표현은 현대 한국어의 대화 관습상 부자연스럽고 무례하게 들릴 수 있으므로, 높임을 갖춘 3인칭형으로 옮기는 편이 원문의 왕에게 하는 발화라는 상황을 더 충실히 전달합니다. דְּבָרֶיךָ의 넓은 의미는 본문 표현과 각주를 통해 보존할 수 있습니다.
  naturalness: ‘그때 그 여인이’는 다소 겹치고 어색합니다. ‘그러자 그녀는’이 자연스럽게 서술 진행을 나타냅니다. ‘내 땅’보다 이 문맥에서는 ‘내 나라’가 현대 한국어에서 자연스럽고, ‘들은 말’은 ‘말씀’과 인접할 때 중복감이 있으므로 ‘들은 이야기’가 보고된 내용을 가리키는 표현으로 매끄럽습니다.
  terminology: 왕을 향한 발화에는 ‘왕께서 하신 말씀’ 및 ‘왕께서 지니신 지혜’가 적절한 높임말입니다. ‘말씀’에 붙는 각주는 히브리어 דְּבָרֶיךָ가 말뿐 아니라 일·사안·업적을 가리킬 가능성도 있음을 명시해야 하며, 해당 단어 바로 뒤에 표지하는 것이 바람직합니다.
