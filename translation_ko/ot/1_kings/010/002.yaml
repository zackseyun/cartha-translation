  rationale: 원문은 대화의 내용보다 ‘마음에 있는 모든 것’을 말한 사실을 강조하므로, 내용을 과도하게 심리화하지 않고 직접성을 살렸습니다.
  doctrine_reference: 서사 문맥의 직역-의역 균형
