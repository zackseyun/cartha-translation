  text: וַ/תָּבֹ֣א יְרוּשָׁלְַ֗מָ/ה בְּ/חַיִל֮ כָּבֵ֣ד מְאֹד֒ גְּ֠מַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב רַב מְאֹ֖ד וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר אֵלָ֔י/ו אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/002.yaml
  text: She came to Jerusalem with a very great retinue[a], with camels carrying spices and very much gold and precious stones. She came to Solomon and spoke with him about all that was in her heart.
  footnotes:
  - marker: a
    text: Or 'with a very large entourage' or, more literally, 'with very great wealth/force'; the Hebrew חַיִל can denote wealth, strength, or a substantial company.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여인은 매우 큰 수행단[a]과 함께, 향품을 실은 낙타들과 매우 많은 금과 값진 보석들을 가지고 예루살렘에 이르렀습니다. 그 여인은 솔로몬에게 나아가 자기 마음에 있던 모든 것을 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘매우 큰 무리’로 옮길 수 있습니다. 더 문자적으로는 ‘매우 큰 재물/세력’입니다. 히브리어 חַיִל은 재물, 세력, 또는 상당한 동행 무리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַיִל כָּבֵד מְאֹד
  english_pob_choice: with a very great retinue
  chosen_korean: 매우 큰 수행단
  alternatives_korean:
  - 매우 큰 무리
  - 매우 큰 호위대
  - 매우 큰 재물
  lexicon: HALOT
  rationale: חַיִל은 힘, 재물, 군대, 또는 상당한 무리를 가리킬 수 있는데, 이 문맥에서는 군사력보다 위세를 갖춘 동행 무리의 뜻이 적절하므로 ‘수행단’이 가장 자연스럽습니다.
- source_word: גְּמַלִּים נֹשְׂאִים בְּשָׂמִים
  english_pob_choice: camels carrying spices
  chosen_korean: 향품을 실은 낙타들
