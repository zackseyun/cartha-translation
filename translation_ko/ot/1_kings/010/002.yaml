source:
  edition: WLC
  text: וַ/תָּבֹ֣א יְרוּשָׁלְַ֗מָ/ה בְּ/חַיִל֮ כָּבֵ֣ד מְאֹד֒ גְּ֠מַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב רַב מְאֹ֖ד וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר אֵלָ֔י/ו אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/002.yaml
  text: She came to Jerusalem with a very great retinue[a], with camels carrying spices and very much gold and precious stones. She came to Solomon and spoke with him about all that was in her heart.
  footnotes:
  - marker: a
    text: Or 'with a very large entourage' or, more literally, 'with very great wealth/force'; the Hebrew חַיִל can denote wealth, strength, or a substantial company.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여인은 매우 큰 수행단[a]과 함께, 향품을 실은 낙타들과 심히 많은 금과 귀한 돌들을 가지고 예루살렘에 이르렀습니다. 그 여인은 솔로몬에게 와서 자기 마음에 있는 모든 것을 그와 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘매우 큰 무리’ 혹은 더 문자적으로 ‘매우 큰 재물/힘’으로도 옮길 수 있습니다. 히브리어 חַיִל은 재물, 힘, 또는 상당한 동행 무리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַיִל כָּבֵד מְאֹד
  english_pob_choice: with a very great retinue
  chosen_korean: 매우 큰 수행단
  alternatives_korean:
  - 매우 큰 무리
  - 매우 큰 호위대
  - 매우 큰 재물
  lexicon: HALOT
  rationale: חַיִל은 힘, 재물, 군대, 또는 상당한 무리를 가리킬 수 있는데, 이 문맥에서는 군사력보다 위세를 갖춘 동행 무리의 뜻이 적절하므로 ‘수행단’이 가장 자연스럽습니다.
- source_word: גְּמַלִּים נֹשְׂאִים בְּשָׂמִים
  english_pob_choice: camels carrying spices
  chosen_korean: 향품을 실은 낙타들
  alternatives_korean:
  - 향품을 나르는 낙타들
  - 향품을 싣고 가는 낙타들
  lexicon: HALOT
  rationale: 나르는 행위의 지속성을 살리되 현대 한국어에서 자연스러운 ‘실은’으로 옮겨, 무역 사절단의 장면을 간결하게 전달했습니다.
- source_word: וְזָהָב רַב מְאֹד
  english_pob_choice: and very much gold
  chosen_korean: 심히 많은 금
  alternatives_korean:
  - 매우 많은 금
  - 엄청난 양의 금
  lexicon: HALOT
  rationale: רַב מְאֹד의 강한 양적 강조를 살리면서도 문맥상 재물의 과다함을 드러내기 위해 ‘심히 많은’으로 옮겼습니다.
- source_word: וְאֶבֶן יְקָרָה
  english_pob_choice: and precious stones
  chosen_korean: 귀한 돌들
  alternatives_korean:
  - 보석들
  - 값진 돌들
  - 귀중한 보석들
  lexicon: HALOT
  rationale: אֶבֶן יְקָרָה는 문자적으로는 ‘귀한 돌’이지만, 목록의 나열 속에서 복수적 총칭이 자연스러워 ‘돌들’로 옮겼습니다. ‘보석들’은 뜻은 분명하지만 다소 해석적입니다.
theological_decisions:
- issue: 왕 앞에 나아가 말하는 장면의 진술 방식
  chosen_reading: 그 여인이 솔로몬에게 와서 자기 마음에 있는 모든 것을 그와 말했습니다.
  alternative_readings:
  - 솔로몬에게 자기 생각을 모두 털어놓았습니다
  - 마음에 둔 모든 것을 솔로몬과 나누었습니다
  rationale: 원문은 대화의 내용보다 ‘마음에 있는 모든 것’을 말한 사실을 강조하므로, 내용을 과도하게 심리화하지 않고 직접성을 살렸습니다.
  doctrine_reference: 서사 문맥의 직역-의역 균형
