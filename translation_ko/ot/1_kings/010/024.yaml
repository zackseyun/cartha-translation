  rationale: 본문이 야훼가 아니라 אֱלֹהִים을 사용하므로, 고유언약명 대신 일반 호칭인 ‘하나님’을 유지했습니다.
  doctrine_reference: Original-language primacy; YHWH/אֱלֹהִים distinction
