  lexicon: HALOT
  rationale: ‘얼굴/면’의 관용구를 그대로 번역하면 어색하므로, ‘면전’을 사용해 접근·알현의 의미를 살렸습니다. 본문에 알현의 뉘앙스를 드러내기 위해 각주를 달았습니다.
- source_word: לִשְׁמֹעַ
  english_pob_choice: to hear
  chosen_korean: 들으려 했으니
  alternatives_korean:
  - 듣기 위해
  - 들으려고
  lexicon: HALOT
  rationale: 목적의 부정사로서 자연스럽게 목적을 나타내는 한국어 표현으로 옮겼습니다.
- source_word: חָכְמָתוֹ ... אֲשֶׁר נָתַן אֱלֹהִים בְּלִבּוֹ
  english_pob_choice: his wisdom that God had put in his heart
  chosen_korean: 그 지혜는 하나님이 그의 마음에 두신 것이었습니다
  alternatives_korean:
  - 하나님이 그의 마음에 주신 지혜였습니다
  - 하나님이 그의 속에 넣으신 지혜였습니다
  lexicon: HALOT
  rationale: נָתַן의 기본뜻 ‘주다’와 ‘마음에 두다’의 관용을 함께 살려, 지혜의 내적 부여를 드러냈습니다. ‘마음’은 히브리어 לֵב의 내면 전체를 보존합니다.
theological_decisions:
- issue: אֱלֹהִים의 번역
