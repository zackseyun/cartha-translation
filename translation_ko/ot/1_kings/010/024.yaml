  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ‘솔로몬의 면전을 찾아’는 히브리어 관용구가 뜻하는 알현·접견 요청을 한국어에서 자연스럽게 전달하지 못하며, ‘면전’은 보통 ‘누구 앞에서’라는 뜻으로 쓰여 이 결합에서는 부자연스럽습니다. 또한 ‘들으려 했으니’는 목적을 나타내지만 실제 서술의 요약적 진술을 다소 약화합니다.
  naturalness: ‘온 땅이 솔로몬의 면전을 찾아’는 현대 표준어 합쇼체 성경 문장으로 어색합니다. ‘온 땅의 사람들이 솔로몬을 찾아와’는 원문의 집합적·과장적 표현을 유지하면서 자연스럽고, 목적 표현도 ‘듣기 위해’가 명료합니다.
  terminology: ‘하나님’은 אֱלֹהִים에 적절합니다. לֵב의 비유를 보존하여 ‘마음에 주신’을 유지했습니다. ‘솔로몬을 찾아와’로 관용구를 자연화하되, 각주에서 문자적 표현과 알현의 의미를 밝혔습니다.
