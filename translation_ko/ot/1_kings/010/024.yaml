  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘솔로몬의 얼굴을 찾다’이며, 여기서는 알현하거나 면전에 나아가기를 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  english_pob_choice: And all the earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 땅의 모든 백성
  lexicon: HALOT
  rationale: 히브리어의 집합적이고 과장된 표현을 살리면서도 한국어로는 자연스럽게 간결하게 옮겼습니다.
- source_word: מְבַקְשִׁים אֶת פְּנֵי שְׁלֹמֹה
  english_pob_choice: sought the presence of Solomon
  chosen_korean: 솔로몬의 면전[a]을 찾아
  alternatives_korean:
