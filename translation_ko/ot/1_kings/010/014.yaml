  lexicon: HALOT
  rationale: 수치 목록의 간결성과 가독성을 위해 아라비아 숫자를 사용했지만, 원문의 수량 자체는 그대로 보존했습니다.
- source_word: כִּכַּר
  english_pob_choice: talents
  chosen_korean: 달란트
  alternatives_korean:
