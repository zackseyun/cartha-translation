  - 솔로몬에게 가져온
  lexicon: HALOT
  rationale: 히브리어 בוא + ל의 도착/유입 의미를 반영해, 출처를 단정하지 않고 ‘들어온’으로 옮겼습니다.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וָשֵׁשׁ
  english_pob_choice: six hundred sixty-six
  chosen_korean: '666'
