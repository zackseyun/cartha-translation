base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/014.yaml
  text: Now the weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
  footnotes:
  - marker: a
    text: A talent was a large unit of weight; the verse reports the annual amount by ancient measure rather than converting it into modern units.
    reason: cultural_note
translation:
  language: ko
  text: 한 해 동안 솔로몬에게 들어온 금의 무게는 금 666달란트였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 달란트는 고대의 큰 무게 단위입니다. 이 절은 현대 단위로 환산하지 않고, 당시의 측량 방식 그대로 한 해 동안의 총량을 보고합니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִשְׁקַל
  english_pob_choice: weight
  chosen_korean: 무게
  alternatives_korean:
  - 중량
  - 양
  lexicon: HALOT
  rationale: 금의 양을 계량 단위로 보고하는 문맥이므로, 가장 직접적인 ‘무게’를 사용해 계수적 의미를 살렸습니다.
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  english_pob_choice: that came to Solomon
  chosen_korean: 솔로몬에게 들어온
  alternatives_korean:
  - 솔로몬에게 온
  - 솔로몬에게 가져온
  lexicon: HALOT
  rationale: 히브리어 בוא + ל의 도착/유입 의미를 반영해, 출처를 단정하지 않고 ‘들어온’으로 옮겼습니다.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וָשֵׁשׁ
  english_pob_choice: six hundred sixty-six
  chosen_korean: '666'
  alternatives_korean:
  - 육백육십육
  lexicon: HALOT
  rationale: 수치 목록의 간결성과 가독성을 위해 아라비아 숫자를 사용했지만, 원문의 수량 자체는 그대로 보존했습니다.
- source_word: כִּכַּר
  english_pob_choice: talents
  chosen_korean: 달란트
  alternatives_korean:
  - 탈렌트
  - 무게 단위
  lexicon: HALOT
  rationale: 고대 중량 단위인 כִּכָּר는 통용되는 음역형 ‘달란트’로 옮겨 현대 독자가 단위성을 즉시 인지하도록 했습니다.
