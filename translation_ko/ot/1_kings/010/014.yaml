  yaml_path: translation/ot/1_kings/010/014.yaml
  text: Now the weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
  footnotes:
  - marker: a
    text: A talent was a large unit of weight; the verse reports the annual amount by ancient measure rather than converting it into modern units.
    reason: cultural_note
translation:
  language: ko
  text: 그해 솔로몬에게 들어온 금의 무게는 금 666달란트였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 달란트는 고대의 큰 무게 단위입니다. 이 절은 현대 단위로 환산하지 않고, 당시의 측량 방식 그대로 연간 총량을 보고합니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִשְׁקַל
  english_pob_choice: weight
  chosen_korean: 무게
  alternatives_korean:
  - 중량
  - 양
  lexicon: HALOT
  rationale: 금의 양을 계량 단위로 보고하는 문맥이므로, 가장 직접적인 ‘무게’를 사용해 계수적 의미를 살렸습니다.
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  english_pob_choice: that came to Solomon
  chosen_korean: 솔로몬에게 들어온
  alternatives_korean:
