id: 1KI.10.8
reference: 1 Kings 10:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַשְׁרֵ֣י אֲנָשֶׁ֔י/ךָ אַשְׁרֵ֖י עֲבָדֶ֣י/ךָ אֵ֑לֶּה הָֽ/עֹמְדִ֤ים לְ/פָנֶ֨י/ךָ֙ תָּמִ֔יד הַ/שֹּׁמְעִ֖ים אֶת חָכְמָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/008.yaml
  text: Blessed are your men; blessed are these your servants, who stand before you continually and hear your wisdom.
translation:
  language: ko
  text: 왕의 남자들은 복이 있습니다. 늘 왕 앞에 서서 왕의 지혜를 듣는 이 왕의 종들도 복이 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed are
  chosen_korean: 복되며
  alternatives_korean:
  - 복이 있습니다
  - 행복합니다
  lexicon: HALOT
  rationale: אַשְׁרֵי는 단순한 감정 상태보다 복된 상태를 나타내므로, 한국어에서는 축복받은 상태를 압축적으로 드러내는 ‘복되며’로 옮겼습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 종
  - 당신의 노예들
  - 당신의 하인들
  lexicon: HALOT
  rationale: 왕궁 문맥에서 служ어적 복종을 나타내는 עֶבֶד는 ‘종’이 가장 무난하며, 본 구절은 신분의 속박보다 섬김의 지위를 강조하므로 ‘노예들’은 피했습니다.
- source_word: הָעֹמְדִים לְפָנֶיךָ תָּמִיד
  english_pob_choice: who stand before you continually
  chosen_korean: 항상 당신 앞에 서 있으며
  alternatives_korean:
  - 끊임없이 당신 앞에 서 있는
  - 늘 당신을 모시고 서 있는
  lexicon: HALOT
  rationale: ‘서 있다’는 궁정 출입·시종의 관용구를 살리면서, תָּמִיד의 지속성을 ‘항상’으로 자연스럽게 표현했습니다.
- source_word: חָכְמָתֶךָ
  english_pob_choice: your wisdom
  chosen_korean: 당신의 지혜
  alternatives_korean:
  - 당신의 지혜로운 말
  - 당신의 지혜로운 판단
  lexicon: HALOT
  rationale: 히브리어는 대상어를 단순히 ‘당신의 지혜’로 제시하므로, 해석을 덧붙이지 않고 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: 축복 진술의 수사적 형식
  chosen_reading: אַשְׁרֵי를 복된 상태를 선포하는 축복 진술로 살려, ‘복되며’로 시작했습니다.
  alternative_readings:
  - ‘행복합니다’로 정서적 행복을 강조하는 읽기
  - ‘복이 있습니다’로 설명적 문장을 택하는 읽기
  rationale: 이 절은 단순 감정 서술이 아니라 왕의 지혜 아래 있는 신하들의 복된 처지를 선포하므로, 축복 선언의 어조가 드러나야 합니다.
  doctrine_reference: 지혜문학의 복됨/형통 개념
- issue: עֲבָדִים의 사회적 뉘앙스
  chosen_reading: 이 구절에서는 왕실 시종의 의미가 우세하므로 ‘종들’로 번역했습니다.
  alternative_readings:
  - ‘노예들’로 신분적 예속을 강조하는 읽기
  - ‘일꾼들’로 기능적 봉사를 강조하는 읽기
  rationale: 문맥상 솔로몬 곁에 상시 대기하는 궁정 인물들을 가리키며, 봉사의 지위는 드러내되 본문의 초점을 초과하는 속박 이미지는 전면화하지 않았습니다.
  doctrine_reference: 고대 근동 왕궁 문맥
- issue: ‘당신 앞에 서 있다’의 관용성
  chosen_reading: 직역 이미지를 유지해 궁정 시종의 상시 대기 상태를 보이도록 했습니다.
  alternative_readings:
  - ‘당신을 모시고 있다’로 관용적 의미를 풀어 쓰는 읽기
  rationale: ‘앞에 서다’는 왕 앞에서 봉사하는 상투적 표현이므로, 장면성을 유지하는 편이 원문 효과를 더 잘 전달합니다.
  doctrine_reference: 히브리어 관용구
