source:
  edition: WLC
  text: וַ/יַּגֶּד לָ֥/הּ שְׁלֹמֹ֖ה אֶת כָּל דְּבָרֶ֑י/הָ לֹֽא הָיָ֤ה דָּבָר֙ נֶעְלָ֣ם מִן הַ/מֶּ֔לֶךְ אֲשֶׁ֧ר לֹ֦א הִגִּ֖יד לָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/003.yaml
  text: And Solomon answered all her questions[a]; there was nothing hidden from the king that he did not tell her.
  footnotes:
  - marker: a
    text: Or, more formally, 'And Solomon told her all her words/matters.' The Hebrew can be rendered more literally, but in context it refers to Solomon's responses to the queen's inquiries.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 그녀의 모든 말에 답했습니다[a]. 왕에게서 숨겨진 것은 아무것도 없어서, 그가 그녀에게 말하지 않은 것이 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, "솔로몬은 그녀의 말들/사안들을 모두 그녀에게 말했습니다." 그러나 문맥상 이는 시바 여왕의 질문에 대한 응답을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  english_pob_choice: answered
  chosen_korean: 답했습니다
  alternatives_korean:
  - 말했습니다
  - 대답했습니다
  - 전했습니다
  lexicon: HALOT
  rationale: 문맥상 솔로몬이 질문을 받은 뒤 응답한 것이므로, 단순한 '말하다'보다 '답하다'가 더 정확하며, 영어 POB의 answered를 한국어로 자연스럽게 옮겼습니다.
- source_word: דְּבָרֶיהָ
  english_pob_choice: her questions / her words
  chosen_korean: 그녀의 모든 말
  alternatives_korean:
  - 그녀의 모든 질문
  - 그녀의 말들
  - 그녀의 사안들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '말들/사안들'이지만, 바로 앞절의 시험하는 질문들 문맥을 반영해 한국어에서는 '그녀의 모든 말'로 옮겨 원문의 폭을 유지하면서도 자연스럽게 했습니다.
- source_word: לֹא הָיָה דָּבָר נֶעְלָם
  english_pob_choice: there was nothing hidden
  chosen_korean: 숨겨진 것은 아무것도 없어서
  alternatives_korean:
  - 숨긴 것은 아무것도 없어서
  - 감추어진 것은 하나도 없어서
  - 숨겨진 것이 없어서
  lexicon: HALOT
  rationale: 히브리어의 수동적 '숨겨지다/감추어지다' 이미지를 살리되, 한국어에서는 뒤 문장을 이끄는 연결 표현으로 자연스럽게 다듬었습니다.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  english_pob_choice: that he did not tell her
  chosen_korean: 그가 그녀에게 말하지 않은 것이 없었습니다
  alternatives_korean:
  - 그가 그녀에게 전하지 않은 것이 없었습니다
  - 그가 그녀에게 설명하지 않은 것이 없었습니다
  - 그가 그녀에게 알려주지 않은 것이 없었습니다
  lexicon: HALOT
  rationale: 상대절이 앞의 '숨겨진 것'을 풀어 설명하므로, '말하지 않은'으로 단순하고 직설적으로 처리해 원문의 반복 강조를 보존했습니다.
theological_decisions:
- issue: 왕의 지혜와 응답의 완전성
  chosen_reading: 솔로몬이 질문에 충분히 응답하여 왕에게 숨겨진 것이 없었다는 점을 그대로 드러냈습니다.
  alternative_readings:
  - 솔로몬이 모든 것을 설명했다는 식으로 완화할 수 있음
  - 질문이라는 의미를 더 강하게 넣어 해석할 수 있음
  rationale: 본문은 솔로몬의 지혜가 완전하고 공개적으로 드러났음을 말하므로, 이를 축소하거나 과장하지 않고 서술적 긴장을 유지했습니다.
  doctrine_reference: 왕상 10:1-3 문맥
