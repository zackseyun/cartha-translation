  - 솔로몬
  lexicon: HALOT
  rationale: 히브리어의 관형적 결합을 한국어의 일반적인 호칭 순서로 옮겨 제목과 이름을 함께 살렸습니다.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  english_pob_choice: all the kings of the earth
  chosen_korean: 세상의 모든 왕들
  alternatives_korean:
  - 땅의 모든 왕들
  - 온 땅의 모든 왕들
  lexicon: HALOT
  rationale: הָאָרֶץ를 이 왕권 비교 문맥에서 포괄적 범위의 ‘세상’으로 옮겨 비교의 보편성을 살렸습니다.
- source_word: לְעֹשֶׁר וּלְחָכְמָה
  english_pob_choice: in wealth and wisdom
  chosen_korean: 재물과 지혜에 있어서
  alternatives_korean:
  - 부와 지혜에 있어서
  - 재물과 지혜에서
  - 재물과 지혜로
  lexicon: HALOT
  rationale: לְ가 상태·평가 기준을 나타내므로 한국어에서는 ‘~에 있어서’로 받아 두 명사 모두에 걸리는 비교 기준을 분명히 했습니다.
theological_decisions:
- issue: 왕의 탁월함을 단순한 성장보다 비교적 우위로 표현하는 문제
  chosen_reading: 솔로몬의 ‘커짐’은 다른 왕들과의 비교에서의 우위를 뜻하므로, 서술을 ‘뛰어났습니다’로 옮겼습니다.
  alternative_readings:
  - 더 커졌습니다
  - 더 위대해졌습니다
  rationale: 문맥의 מִן-비교가 절대적 성장보다 상대적 우위를 가리키므로, 독자가 본문 의도를 즉시 이해하도록 했습니다.
  doctrine_reference: 문맥 기반 의미 우선 원칙
