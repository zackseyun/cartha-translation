lexical_decisions:
- source_word: וַיִּגְדַּל
  english_pob_choice: surpassed
  chosen_korean: 뛰어났습니다
  alternatives_korean:
  - 더 위대해졌습니다
  - 더 컸습니다
  - 능가했습니다
  lexicon: HALOT
  rationale: 비교 구문에서 ‘크다/커지다’의 의미를 한국어에서 자연스럽고 분명하게 나타내기 위해 ‘뛰어나다’를 택했습니다.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  english_pob_choice: King Solomon
  chosen_korean: 솔로몬 왕
  alternatives_korean:
