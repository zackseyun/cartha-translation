  source_fidelity: 본문의 ‘뛰어났습니다’는 מִן 비교구문과 וַיִּגְדַּל의 비교상 우위를 자연스럽게 잘 반영합니다. 다만 접속사 וַ를 ‘그러므로’로 옮기면 히브리어 본문이 명시하지 않는 강한 논리적 귀결이 덧붙습니다. 또한 각주의 대안은 비교 대상이 빠져 있어 원문의 비교를 완전히 반영하지 못합니다.
  naturalness: ‘재물과 지혜에 있어서’도 이해 가능하지만, 현대 표준어에서는 ‘재물과 지혜에서’가 더 간결하고 자연스럽습니다. ‘세상의 모든 왕보다’는 자연스러운 포괄 비교입니다.
  terminology: ‘솔로몬 왕’, ‘재물’, ‘지혜’는 적절합니다. 본문의 ‘뛰어났습니다’는 왕권·도덕성 일반의 ‘위대함’보다 재물과 지혜라는 명시된 기준에서의 우월성을 더 정확히 드러냅니다.
  issues:
