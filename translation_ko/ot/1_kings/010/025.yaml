  rationale: 솔로몬의 국제적 위상과 반복적 조공 맥락을 반영해야 하므로, 단순한 호의적 선물보다 공물이라는 사회·정치적 의미가 본문에 더 부합합니다.
  doctrine_reference: 본문 역사·문맥 해석
