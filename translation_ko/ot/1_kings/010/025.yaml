source:
  edition: WLC
  text: וְ/הֵ֣מָּה מְבִאִ֣ים אִ֣ישׁ מִנְחָת֡/וֹ כְּלֵ֣י כֶסֶף֩ וּ/כְלֵ֨י זָהָ֤ב וּ/שְׂלָמוֹת֙ וְ/נֵ֣שֶׁק וּ/בְשָׂמִ֔ים סוּסִ֖ים וּ/פְרָדִ֑ים דְּבַר שָׁנָ֖ה בְּ/שָׁנָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/025.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver, articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
  footnotes:
  - marker: a
    text: Or 'each his gift' or 'each man his present'; the Hebrew מִנְחָה can denote a gift, offering, or tribute. Here 'tribute' reflects the royal context.
    reason: lexical_alternative
  - marker: b
    text: Or 'cloaks' or 'robes' for 'garments.'
    reason: lexical_alternative
  - marker: c
    text: Or 'armor' for 'weapons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 해마다 각 사람이 자기의 공물과 함께 은 그릇과 금 그릇과 옷과 무기와 향품과 말과 노새를 가져왔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘각 사람의 선물’, ‘각 사람이 바치는 예물’. 히브리어 מִנְחָה는 선물, 제물, 공물을 뜻할 수 있는데, 여기서는 왕실 문맥을 반영해 ‘공물’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘갑옷’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘향신료’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה / אִישׁ מִנְחָתוֹ
  english_pob_choice: each man his tribute
  chosen_korean: 각 사람이 자기의 공물
  alternatives_korean:
  - 각 사람이 자기의 예물
  - 각 사람이 자기의 선물
  lexicon: HALOT
  rationale: 왕에게 바치는 문맥이므로 מִנְחָה를 ‘공물’로 옮겨 조공적 성격을 드러냈습니다. ‘예물/선물’도 가능하지만 이 장면의 정치적 맥락을 약화시킵니다.
- source_word: כְּלֵי כֶסֶף / וּכְלֵי זָהָב
  english_pob_choice: articles of silver / articles of gold
  chosen_korean: 은 그릇과 금 그릇
  alternatives_korean:
  - 은 기구와 금 기구
  - 은 물품과 금 물품
  lexicon: HALOT
  rationale: כְּלִי는 범위가 넓지만 한국어에서는 목록 항목으로 ‘그릇’이 가장 자연스럽고, 금속 재질의 공물 목록이라는 점도 잘 드러냅니다.
- source_word: שְׂלָמוֹת / נֵשֶׁק / בְשָׂמִים
  english_pob_choice: garments / weapons / spices
  chosen_korean: 옷과 무기와 향품
  alternatives_korean:
  - 겉옷과 갑옷과 향품
  - 의복과 무장과 향료
  lexicon: HALOT
  rationale: שְׂלָמוֹת는 복수형이지만 목록에서는 포괄적으로 ‘옷’이 자연스럽고, נֵשֶׁק은 문맥상 군사 장비를 가리켜 ‘무기’로 옮겼습니다. בְשָׂמִים은 향기로운 물품 전반을 포괄하므로 ‘향품’이 ‘향신료’보다 넓습니다.
- source_word: סוּסִים / פְרָדִים
  english_pob_choice: horses / mules
  chosen_korean: 말과 노새
  alternatives_korean:
  - 말들과 노새들
  - 군마와 노새
  lexicon: HALOT
  rationale: 표준적인 동물명으로 직역해 목록의 병렬성을 유지했습니다. ‘군마’는 원문에 없는 용례 해석을 덧붙일 수 있어 피했습니다.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  english_pob_choice: year by year
  chosen_korean: 해마다
  alternatives_korean:
  - 해마다 반복하여
  - 매년
  lexicon: HALOT
  rationale: 관용구의 반복·주기성을 한국어에서 가장 간결하게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 왕에게 바치는 מִנְחָה의 성격
  chosen_reading: 이 항목은 일반 ‘선물’이 아니라 왕실에 드리는 공물로 이해해 번역했습니다.
  alternative_readings:
  - 중립적인 선물
