base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/015.yaml
  text: besides what came from the traveling merchants and from the trade of the merchants[c][b][a], and from all the kings of Arabia and the governors of the land.
  footnotes:
  - marker: a
    text: Or 'from the men who traveled about'; the Hebrew phrase is difficult and may refer more generally to itinerant traders.
    reason: lexical_alternative
  - marker: b
    text: Or 'all the kings of the mixed peoples'; the Hebrew עֶרֶב can carry that sense in some contexts, though 'Arabia' best fits here.
    reason: alternative_reading
  - marker: c
    text: Or 'provincial governors' or 'satraps.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 밖에 떠돌아다니는 상인들과 상인들의 무역에서 나온 것, 그리고 아라비아의 모든 왕들과 그 땅의 총독들에게서 나온 것까지 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 어렵습니다. 더 넓게는 떠돌며 다니는 상인들을 가리키는 말로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 다른 가능성으로는 '혼합 민족의 모든 왕들'로 이해할 수 있으나, 여기서는 '아라비아'가 더 잘 맞습니다.
    reason: alternative_reading
  - marker: c
    text: '''지방 총독들'' 또는 ''사트라프들''로도 옮길 수 있습니다.'
    reason: lexical_alternative
