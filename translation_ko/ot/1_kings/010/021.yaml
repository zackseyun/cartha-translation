  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף לֹ֥א נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/021.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[b]. Silver was not considered anything in the days of Solomon.
  footnotes:
  - marker: a
    text: Or “refined gold.”
    reason: lexical_alternative
  - marker: b
    text: Or “Silver was not considered of any value in the days of Solomon.”
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬 왕의 음료 그릇은 모두 금이었고, 레바논 수풀 집의 모든 그릇도 순금이었습니다. 은은 솔로몬의 시대에는 아무것도 아닌 것으로 여겨졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정제된 금’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘은은 솔로몬의 시대에는 아무 가치도 없는 것으로 여겨졌습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  english_pob_choice: drinking vessels
  chosen_korean: 음료 그릇
  alternatives_korean:
  - 마시는 그릇
  - 식탁 용기
  - 음료용 기물
  lexicon: HALOT
  rationale: ‘כְּלֵי’는 넓게 ‘그릇/기물’류를 가리키고 ‘מַשְׁקֵה’가 마실 것과 관련된 용도를 지정하므로, 현대 한국어에서는 너무 좁은 ‘컵’보다 ‘음료 그릇’이 범위를 비교적 잘 보존합니다.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  english_pob_choice: the House of the Forest of Lebanon
  chosen_korean: 레바논 수풀 집
  alternatives_korean:
  - 레바논 숲 집
  - 레바논의 숲의 집
  - 레바논 삼림의 집
  lexicon: HALOT
  rationale: 본문의 고유한 건물 명칭을 살리되, ‘house’의 구조를 유지하기 위해 ‘집’을 두었고, ‘יַעַר’는 ‘숲/수풀’ 가운데 문맥상 건물 명칭의 고유성을 해치지 않는 ‘수풀’로 옮겼습니다.
- source_word: זָהָב סָגוּר
  english_pob_choice: pure gold
  chosen_korean: 순금
  alternatives_korean:
  - 정제된 금
  - 순수한 금
  - 정련한 금
  lexicon: HALOT
  rationale: ‘סָגוּר’는 금의 고급도·정련도를 가리키므로, 현대 독자가 즉시 이해하는 ‘순금’이 ‘pure gold’의 의미를 자연스럽게 전달합니다.
- source_word: לֹא נֶחְשָׁב בִּימֵי שְׁלֹמֹה לִמְאוּמָה
  english_pob_choice: Silver was not considered anything in the days of Solomon.
  chosen_korean: 은은 솔로몬의 시대에는 아무것도 아닌 것으로 여겨졌습니다.
  alternatives_korean:
  - 은은 솔로몬의 시대에는 가치가 없는 것으로 여겨졌습니다.
  - 솔로몬의 시대에는 은이 아무 가치도 없는 것으로 여겨졌습니다.
  lexicon: HALOT
  rationale: ‘נֶחְשָׁב’는 단순 존재 부정이 아니라 가치 평가를 뜻하므로 ‘여겨졌습니다’로 옮기고, ‘לִמְאוּמָה’의 무가치성을 ‘아무것도 아닌 것’으로 반영했습니다.
theological_decisions:
- issue: 솔로몬 시대의 부와 위세를 강조하는 반복적 금/은 대비
  chosen_reading: 금의 반복과 은의 무가치화는 단순한 재산 목록이 아니라 솔로몬 통치의 극단적 풍요를 강조하는 서술로 읽었습니다.
  alternative_readings:
  - 단순한 궁정 재고의 묘사
  - 과장된 왕실 장식 목록
  rationale: 히브리어 반복 구조와 마지막 절의 평가어가 결합되어, 본문은 풍요의 절정을 강조하는 서술로 이해하는 것이 자연스럽습니다.
  doctrine_reference: 왕정사 서술의 문학적 강조
