  to: 스바의 여왕은 솔로몬의 식탁 음식과 그의 신하들의 자리, 그의 시종들이 서서 섬기는 모습과 그들의 옷, 그의 술 맡은 이들, 그리고 그가 야훼의 집에 드리는 번제를[a] 보고는 더 이상 숨을 쉴 수 없을 만큼 놀랐습니다.
