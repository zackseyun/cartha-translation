  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַאֲכַ֣ל שֻׁלְחָנ֡/וֹ וּ/מוֹשַׁ֣ב עֲבָדָי/ו֩ וּ/מַעֲמַ֨ד משרת/ו וּ/מַלְבֻּֽשֵׁי/הֶם֙ וּ/מַשְׁקָ֔י/ו וְ/עֹ֣לָת֔/וֹ אֲשֶׁ֥ר יַעֲלֶ֖ה בֵּ֣ית יְהוָ֑ה וְ/לֹא הָ֥יָה בָ֛/הּ ע֖וֹד רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/005.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers, their clothing, his cupbearers, and his burnt offering that he offered at the house of Yahweh, there was no more breath in her.
  footnotes:
  - marker: a
    text: Or, “his ascent to the house of the LORD,” possibly referring to the stairway or procession by which he went up.
    reason: alternative_reading
translation:
  language: ko
  text: 스바의 여왕은 솔로몬의 식탁 음식과 그의 신하들의 자리, 그의 시종들이 서서 섬기는 모습과 그들의 옷, 그의 술 맡은 이들, 그리고 그가 야훼의 집에 드리는 번제를[a] 보고는 더 이상 숨을 쉴 수 없을 만큼 놀랐습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 야훼의 집으로 올라감.” 그가 올라가던 계단이나 행렬을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  english_pob_choice: the food of his table
  chosen_korean: 그분의 식탁의 음식
  alternatives_korean:
  - 그분의 식탁의 양식
  - 그분의 식탁의 먹거리
  lexicon: HALOT
  rationale: מַאֲכַל은 기본적으로 ‘먹을 것, 음식’이므로, 식탁과 결합된 구체적 이미지를 살려 ‘식탁의 음식’으로 옮겼습니다.
- source_word: מוֹשַׁב עֲבָדָיו
  english_pob_choice: the seating of his servants
  chosen_korean: 그분의 종들의 자리
  alternatives_korean:
  - 그분의 종들의 좌석
  - 그분의 종들의 앉음
  lexicon: HALOT
  rationale: מוֹשָׁב은 ‘자리, 앉는 곳, 배치’의 뜻이 있어, 궁정의 정돈된 배치를 드러내는 ‘자리’가 자연스럽고 원문에 가깝습니다.
- source_word: מַעֲמַד מְשָׁרְתָיו
  english_pob_choice: the attendance of his ministers
  chosen_korean: 그분의 시종들의 시중
  alternatives_korean:
  - 그분의 시종들의 대기
  - 그분의 시종들의 봉사
  lexicon: HALOT
  rationale: מַעֲמָד는 ‘서 있는 자리, 직임, 배치’를 가리키고, מְשָׁרְתִים은 궁정에서 섬기는 사람들을 뜻하므로, 공식적 섬김의 상태를 드러내는 ‘시중’으로 옮겼습니다.
- source_word: מַשְׁקָיו
  english_pob_choice: his cupbearers
  chosen_korean: 그분의 술 맡은 사람들
  alternatives_korean:
  - 그분의 잔을 드는 사람들
  - 그분의 음료 시중꾼들
  lexicon: HALOT
  rationale: 궁정 문맥에서 מַשְׁקִים은 단순한 음료가 아니라 술을 맡아 시중드는 사람들을 가리키므로, 익숙하면서도 직무를 드러내는 ‘술 맡은 사람들’이 적절합니다.
- source_word: עֹלָתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  english_pob_choice: his burnt offering that he offered at the house of Yahweh
  chosen_korean: 그분이 야훼의 집에 드리던 번제
  alternatives_korean:
  - 그분이 야훼의 집으로 올라가던 길
  - 그분의 야훼의 집으로의 올라감
  lexicon: HALOT
  rationale: 마소라 모음은 עֹלָה, 곧 ‘번제’를 지지하므로 본문은 그 읽기를 따랐습니다. 다만 자음은 ‘올라감/상승’으로도 읽힐 수 있어 그 해석 가능성은 주석으로 남겨야 합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 이 절은 여호와의 이름 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약적 고유성을 보존했습니다.
theological_decisions:
- issue: עֹלָתוֹ의 의미와 본문 긴장 보존
  chosen_reading: 본문은 ‘번제’로 번역하되, 자음 النص가 ‘올라감/상승’으로도 읽힐 수 있는 긴장을 주석으로 보존합니다.
  alternative_readings:
  - 그분의 야훼의 집으로 올라감
  - 그분이 야훼의 집으로 올라가던 길
  rationale: 마소라 모음과 오래된 해석 전통 사이에 실제 해석 차이가 있으므로, 주본문은 MT를 따르고 대안 읽기는 각주로 남겨 독자가 본문의 모호성을 볼 수 있게 했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
