  text: Also[a], Hiram’s fleet, which carried gold from Ophir[b], brought from Ophir a very great quantity of almug wood and precious stones.
  footnotes:
  - marker: a
    text: Or “Hiram’s ship”; the Hebrew noun is singular, but it may function collectively for Hiram’s maritime enterprise.
    reason: lexical_alternative
  - marker: b
    text: “Almug wood” may also be rendered “algum wood”; the exact species is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한[a] 히람의 배들은 오빌에서 금을 실어 왔는데[b], 오빌에서 매우 많은 양의 알무그 나무와 귀한 돌들도 가져왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “히람의 배”; 히브리어 명사는 단수형이지만, 히람의 해상 사업 전체를 가리키는 집합 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘알무그 나무’는 ‘알굼 나무’로도 옮길 수 있으며, 정확한 수종은 확정되지 않습니다.
    reason: lexical_alternative
