id: 1KI.10.27
reference: 1 Kings 10:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֧לֶךְ אֶת הַ/כֶּ֛סֶף בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/027.yaml
  text: The king made silver as common in Jerusalem as stones[b][a], and he made cedars as plentiful as the sycamore trees that are in the Shephelah.
  footnotes:
  - marker: a
    text: Or, 'in the lowland.' 'Shephelah' is the name of the Judean foothill region between the hill country and the coastal plain.
    reason: cultural_note
  - marker: b
    text: Hebrew 'sycamores,' referring to sycamore fig trees.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 예루살렘에서 은을 돌만큼 흔하게 하였고, 백향목은 세펠라에 있는 뽕나무처럼 많게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세펠라’는 유다의 산지와 해안 평야 사이에 있는 구릉 지대의 이름입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 ‘쉬크밈’은 뽕나무과의 시카모어 무화과나무를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  english_pob_choice: made ... as common / made ... as plentiful
  chosen_korean: 흔하게 하였고 / 많게 하였습니다
  alternatives_korean:
  - 두셨고 / 두었습니다
  - 주셨고 / 주었습니다
  - 만들어 ... 같게 하였고
  lexicon: HALOT
  rationale: נתן의 관용적 용법이 ‘주다’보다 ‘어떤 상태가 되게 하다’에 가깝기 때문에, 한국어에서도 결과 상태를 드러내는 동사로 옮겼습니다.
- source_word: הַמֶּלֶךְ
  english_pob_choice: The king
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 솔로몬 왕
  lexicon: HALOT
  rationale: 본문은 이름을 반복하지 않고 단지 ‘왕’이라고만 하므로, 서술의 직접성을 살려 그대로 옮겼습니다.
- source_word: כָּאֲבָנִים
  english_pob_choice: as stones
  chosen_korean: 돌만큼 흔하게
  alternatives_korean:
  - 돌처럼
  - 돌같이
  lexicon: HALOT
  rationale: 비교 표지를 자연스러운 한국어로 풀어, 예루살렘에서 은이 극도로 흔해졌다는 뜻을 명확히 했습니다.
- source_word: כַּשִּׁקְמִים
  english_pob_choice: as the sycamore trees
  chosen_korean: 뽕나무처럼
  alternatives_korean:
  - 시카모어나무처럼
  - 무화과뽕나무처럼
  lexicon: HALOT
  rationale: שִׁקְמִים은 레반트의 뽕나무과 계열 나무를 가리키므로, 한국어 성경 전통에서 이해되기 쉬운 ‘뽕나무’로 옮기되 비교의 뜻을 살렸습니다.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  english_pob_choice: that are in the Shephelah
  chosen_korean: 세펠라에 있는
  alternatives_korean:
  - 저지대에 있는
  - 유대 산지와 해안 평야 사이 구릉 지대에 있는
  lexicon: HALOT
  rationale: שְׁפֵלָה는 지명화된 유다의 구릉 지대이므로, 음역 ‘세펠라’를 사용해 지리적 특성을 보존했습니다.
theological_decisions:
- issue: 솔로몬의 이름을 직접 드러낼지 여부
  chosen_reading: 본문의 ‘왕’만 살리고 이름은 본문에 넣지 않았습니다.
  alternative_readings:
  - 솔로몬 왕
  - 솔로몬이 왕은
  rationale: 히브리어는 כאן에서 지시명사 ‘왕’을 쓰며, 직전 문맥이 솔로몬을 가리키더라도 이 절 자체의 표현을 유지하는 것이 더 स्रोत에 충실합니다.
  doctrine_reference: 본문 충실성 원칙
