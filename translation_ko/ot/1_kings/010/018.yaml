    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: Then ... made
  chosen_korean: 만들고
  alternatives_korean:
  - 그리고 만들고
  - 지어
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서 왕실 물건 제작의 의미를 담기 위해 ‘만들고’를 택했습니다.
- source_word: כִּסֵּא
  english_pob_choice: throne
  chosen_korean: 왕좌
  alternatives_korean:
  - 보좌
  - 의자
  lexicon: HALOT
  rationale: 왕의 전용 좌석이라는 점을 분명히 드러내기 위해 ‘왕좌’로 옮겼습니다.
- source_word: שֵׁן
  english_pob_choice: ivory
  chosen_korean: 상아
  alternatives_korean:
  - 상아로 된
  - 코끼리 뼈
  lexicon: HALOT
  rationale: 이 결합에서는 재료가 ‘상아’임을 뜻하므로, 물질 명칭을 직접 살렸습니다.
- source_word: מוּפָז
  english_pob_choice: refined gold
  chosen_korean: 정금
  alternatives_korean:
  - 정제한 금
  - 순금
  - 고운 금
  lexicon: HALOT
  rationale: 고급하게 정련된 금이라는 뜻을 한국어 성경에서 널리 통용되는 ‘정금’으로 간결하게 옮겼습니다.
