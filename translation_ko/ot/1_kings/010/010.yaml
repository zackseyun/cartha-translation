source:
  edition: WLC
  text: וַ/תִּתֵּ֨ן לַ/מֶּ֜לֶךְ מֵאָ֥ה וְ/עֶשְׂרִ֣ים כִּכַּ֣ר זָהָ֗ב וּ/בְשָׂמִ֛ים הַרְבֵּ֥ה מְאֹ֖ד וְ/אֶ֣בֶן יְקָרָ֑ה לֹא בָא֩ כַ/בֹּ֨שֶׂם הַ/ה֥וּא עוֹד֙ לָ/רֹ֔ב אֲשֶׁר נָתְנָ֥ה מַֽלְכַּת שְׁבָ֖א לַ/מֶּ֥לֶךְ שְׁלֹמֹֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/010.yaml
  text: And she gave the king one hundred and twenty talents of gold[a], and a very great quantity of spices, and precious stones. Never again did such an abundance of spices come as those that the queen of Sheba gave to King Solomon.
  footnotes:
  - marker: a
    text: Hebrew 'spice' is singular in the comparison clause ('like that spice') but likely functions collectively, hence 'such an abundance of spices.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여왕은 왕에게 금 백이십 달란트와 매우 많은 향품과 값진 돌들을 주었습니다. 스바의 여왕이 솔로몬 왕에게 준 것 같은 그 많은 향품은 다시는 오지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 비교절에서 ‘향품’이 단수형이지만, 여러 향품을 가리키는 집합적 표현으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּ֨ן לַמֶּ֜לֶךְ
  english_pob_choice: And she gave the king
  chosen_korean: 그 여왕은 왕에게 주었습니다
  alternatives_korean:
  - 그 여왕은 왕에게 바쳤습니다
  - 그 여왕은 왕에게 드렸습니다
  lexicon: HALOT
  rationale: נתן의 기본값을 살리되, 한국어에서는 자연스러운 서술어인 ‘주다’를 써서 선물을 건네는 장면을 분명하게 했습니다.
- source_word: מֵאָ֥ה וְעֶשְׂרִ֣ים כִּכַּ֣ר זָהָ֗ב
  english_pob_choice: one hundred and twenty talents of gold
  chosen_korean: 금 백이십 달란트
  alternatives_korean:
  - 120 달란트의 금
  - 금 120달란트
  lexicon: HALOT
  rationale: כִּכָּר는 고대 중량 단위이므로 현대 단위로 환산하지 않고 ‘달란트’로 옮겼습니다.
- source_word: וּבְשָׂמִ֛ים הַרְבֵּ֥ה מְאֹ֖ד
  english_pob_choice: and a very great quantity of spices
  chosen_korean: 매우 많은 향품
  alternatives_korean:
  - 향품을 매우 많이
  - 아주 많은 향품
  lexicon: HALOT
  rationale: בְשָׂמִים은 향기로운 향품 전반을 가리키므로 ‘향품’으로 옮기고, 강한 수량 강조는 ‘매우 많은’으로 살렸습니다.
- source_word: וְאֶ֣בֶן יְקָרָ֑ה
  english_pob_choice: and precious stones
  chosen_korean: 값진 돌들
  alternatives_korean:
  - 귀한 돌들
  - 보석들
  lexicon: HALOT
  rationale: 직역에 가까운 ‘돌들’을 유지하되, 귀중함을 드러내기 위해 ‘값진’으로 옮겨 목록 항목의 개별성을 보존했습니다.
- source_word: לֹא בָא֩ ... עוֹד לָרֹב
  english_pob_choice: Never again did such an abundance ... come
  chosen_korean: 다시는 오지 않았습니다
  alternatives_korean:
  - 더 이상 오지 않았습니다
  - 다시는 그렇게 많이 오지 않았습니다
  lexicon: HALOT
  rationale: 부정과 עוֹד의 반복 불가능성을 한국어 관용으로 압축해, ‘다시는’으로 비교 절의 강한 부정을 살렸습니다.
theological_decisions:
- issue: 반복 불가능한 비교 표현의 처리
  chosen_reading: ‘스바의 여왕이 솔로몬 왕에게 준 것 같은 그 많은 향품은 다시는 오지 않았습니다’로, 비교 대상과 ‘다시는’의 의미를 모두 드러냈습니다.
  alternative_readings:
  - ‘그와 같은 향품은 다시는 오지 않았습니다’
  - ‘그런 향품이 다시는 오지 않았습니다’
  rationale: 히브리어 비교절은 단순한 양의 과시가 아니라 이전 헌물의 유례없음을 강조하므로, 비교 기준과 부정을 함께 보존했습니다.
  doctrine_reference: 본문 의미 보존 원칙
- issue: ‘보석’ 대신 ‘값진 돌들’
  chosen_reading: 보석으로 의미를 순화하지 않고 ‘값진 돌들’로 옮겼습니다.
  alternative_readings:
  - 보석
  - 귀한 보석
  rationale: 히브리어 אֶבֶן יְקָרָה는 문자적으로 ‘귀한 돌’이므로, 전통적 용어로 자동 대체하지 않고 원문의 물질적 이미지를 유지했습니다.
  doctrine_reference: 원문 직접성 원칙
