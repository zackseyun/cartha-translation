theological_decisions:
- issue: מקוה의 난해한 의미 처리
  chosen_reading: 본문에는 지명 ‘규’를 두되, 난해한 히브리어의 대안 읽기는 각주로 보존합니다.
  alternative_readings:
  - ‘떼’ 또는 ‘집단’에 해당하는 보통명사
  - ‘말 떼’의 의미
  rationale: 영어 POB가 제시한 본문 이해를 따라 지명으로 번역하되, 본문의 어려움과 대안 해석을 지워버리지 않기 위해 각주를 달았습니다.
  doctrine_reference: 본문 비평 및 어휘 해석의 투명성
- issue: 소유와 상업 거래의 표현
  chosen_reading: ‘수입품’과 ‘값을 치르고 구해 왔습니다’로 상업적 흐름을 분명히 드러냅니다.
  alternative_readings:
  - ‘말이 있었다’
  - ‘가져왔습니다’
  rationale: 열왕기상 10:28은 솔로몬의 말 무역을 묘사하므로, 모호하게 만들지 않고 경제적 의미를 드러내는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 역사 서술의 문맥 보존
