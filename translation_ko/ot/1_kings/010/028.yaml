base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/028.yaml
  text: And the importation of the horses that belonged to Solomon was from Egypt and Kue[b][a]; the king’s merchants would obtain them from Kue at a price.
  footnotes:
  - marker: a
    text: 'Or, following another reading of the difficult Hebrew: “and from a drove; the king’s merchants would obtain a drove at a price.”'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term מִקְוֶה/מִקְוֵה in this verse is uncertain; it may be a place-name (Kue, likely in Cilicia) or a common noun meaning something like “drove” or “collection.”
    reason: cultural_note
translation:
  language: ko
  text: 솔로몬에게 속한 말들의 수입품은 이집트와 규에[a]서 나왔습니다. 왕의 상인들은 규에서 값을 치르고 그것들을 구해 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또 다른 어려운 히브리어 읽기에 따르면, ‘그리고 한 떼에서; 왕의 상인들은 값을 치르고 한 떼를 구해 왔다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא הַסּוּסִים
  english_pob_choice: the importation of the horses
  chosen_korean: 말들의 수입품
  alternatives_korean:
  - 말들의 출처
  - 말들의 반입
  - 말들의 유입
  lexicon: HALOT
  rationale: 상업 맥락에서 말이 어디서 들어왔는지를 가리키므로, 방향성을 드러내는 ‘수입품’이 원문의 거래 의미를 가장 분명하게 살립니다.
- source_word: אֲשֶׁר לִשְׁלֹמֹה
  english_pob_choice: that belonged to Solomon
  chosen_korean: 솔로몬에게 속한
  alternatives_korean:
  - 솔로몬의
  - 솔로몬을 위한
  lexicon: HALOT
  rationale: 단순 소유격보다 현재 문맥의 재산·거래 관계를 살리기 위해 ‘속한’으로 옮겼습니다.
- source_word: וּמִקְוֵה
  english_pob_choice: Kue
  chosen_korean: 규
  alternatives_korean:
  - 쿠에
  - 기브
  lexicon: HALOT
  rationale: 문맥상 지명으로 보는 해석을 따라 음역했고, 한국어 성경식 외래지명 표기에 맞추어 ‘규’로 적었습니다.
- source_word: בִּמְחִיר
  english_pob_choice: at a price
  chosen_korean: 값을 치르고
  alternatives_korean:
  - 값에
  - 값을 주고
  lexicon: HALOT
  rationale: 단순한 가격 표기보다 실제 매입 행위를 드러내어, 왕의 상인들이 거래로 말을 확보했다는 점을 자연스럽게 살렸습니다.
theological_decisions:
- issue: מקוה의 난해한 의미 처리
  chosen_reading: 본문에는 지명 ‘규’를 두되, 난해한 히브리어의 대안 읽기는 각주로 보존합니다.
  alternative_readings:
  - ‘떼’ 또는 ‘집단’에 해당하는 보통명사
  - ‘말 떼’의 의미
  rationale: 영어 POB가 제시한 본문 이해를 따라 지명으로 번역하되, 본문의 어려움과 대안 해석을 지워버리지 않기 위해 각주를 달았습니다.
  doctrine_reference: 본문 비평 및 어휘 해석의 투명성
- issue: 소유와 상업 거래의 표현
  chosen_reading: ‘수입품’과 ‘값을 치르고 구해 왔습니다’로 상업적 흐름을 분명히 드러냅니다.
  alternative_readings:
  - ‘말이 있었다’
  - ‘가져왔습니다’
  rationale: 열왕기상 10:28은 솔로몬의 말 무역을 묘사하므로, 모호하게 만들지 않고 경제적 의미를 드러내는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 역사 서술의 문맥 보존
