    reason: cultural_note
translation:
  language: ko
  text: 솔로몬을 위해 들여온 말들은 이집트와 규[a]에서 왔습니다. 왕의 상인들은 값을 치르고 규에서 그것들을 사들였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 미크웨(מִקְוֶה/מִקְוֵה)는 뜻이 확실하지 않습니다. 이곳에서는 길리기아의 지명으로 여겨지는 ‘규’로 옮겼습니다. 그러나 이를 ‘떼’ 또는 ‘집단’이라는 보통명사로 이해하여, ‘그리고 한 떼에서; 왕의 상인들은 값을 치르고 한 떼를 사들였다’로 옮길 수도 있습니다.
    reason: lexical_alternative
