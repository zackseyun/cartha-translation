base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/012.yaml
  text: The king made the almug wood into supports for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers. Never before had such almug wood come[b], nor has any been seen to this day.
  footnotes:
  - marker: a
    text: Or “algum wood.” The related term appears with a variant spelling in parallel/tradition history.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered “supports” is rare and may also refer to architectural features such as steps or railings.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 야훼의 집과 왕의 집을 위한 받침대로 쓸 알무그 나무와, 노래하는 사람들을 위한 수금과 비파를 만들었습니다.[a] 이런 알무그 나무는 이전에는 한 번도 들어온 적이 없었고, 오늘날까지도 보인 적이 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “알굼 나무”. 관련 용어가 평행 본문과 전승사에서 다른 철자로 나타납니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָאַלְמֻגִּים
  english_pob_choice: the almug wood
  chosen_korean: 알무그 나무
  alternatives_korean:
  - 알굼 나무
  - 알무그 목재
  lexicon: HALOT
  rationale: 히브리어의 고유한 목재 명칭을 음역으로 살리고, 문맥상 단수 집합명사로 자연스럽게 처리했습니다. “목재”도 가능하지만, 원어가 특정 수종/재목을 가리키는 점을 유지하기 위해 “나무”를 택했습니다.
- source_word: מִסְעָד
  english_pob_choice: supports
  chosen_korean: 받침대
  alternatives_korean:
  - 계단
  - 난간
  - 기둥
  lexicon: HALOT
  rationale: 희귀어로 의미가 불확실하므로, 건축물에 두루 맞는 중립적 표현인 “받침대”로 옮겼습니다. “계단”이나 “난간”처럼 좁혀 번역하면 원어의 범위를 지나치게 확정하게 됩니다.
- source_word: לְבֵית יְהוָה
  english_pob_choice: for the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 여호와의 집
  lexicon: HALOT
  rationale: POB의 원칙에 따라 신명은 야훼로 옮겼고, 히브리어 관용구 בֵּית을 살려 “집”을 유지했습니다. “성전”은 의미상 가능하지만 원문 표현을 더 직접적으로 반영하지는 않습니다.
- source_word: וּלְבֵית הַמֶּלֶךְ
  english_pob_choice: and for the king’s house
  chosen_korean: 왕의 집
  alternatives_korean:
  - 왕궁
  - 왕의 궁전
  lexicon: HALOT
  rationale: 앞 구와의 대칭을 살려 문자적으로 옮겼습니다. “왕궁”은 자연스럽지만, 원문의 반복 구조를 약화시킵니다.
- source_word: וְכִנֹּרוֹת וּנְבָלִים
  english_pob_choice: and lyres and harps
  chosen_korean: 수금과 비파
  alternatives_korean:
  - 류트와 하프
  - 거문고와 수금
  lexicon: HALOT
  rationale: 두 현악기를 구분해 옮기되, 한국어 성경에서 널리 통용되는 대역을 선택했습니다. 원문의 병렬을 유지하면서도 독자가 바로 이해할 수 있습니다.
- source_word: לַשָּׁרִים
  english_pob_choice: for the singers
  chosen_korean: 노래하는 사람들
  alternatives_korean:
  - 노래꾼들
  - 가수들
  lexicon: HALOT
  rationale: 히브리어 분사형의 뜻을 살려 직역에 가깝게 처리했습니다. “가수들”은 현대적이지만 시대착오적 뉘앙스가 있어 피했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 신명기적 이름이 직접 나오므로 POB 기본 원칙에 따라 “야훼”를 사용했습니다. 이는 전통적 관용어 “주”보다 स्रोत의 고유성을 더 분명히 드러냅니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
