  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁנֵ֧ים עָשָׂ֣ר אֲרָיִ֗ים עֹמְדִ֥ים שָׁ֛ם עַל שֵׁ֥שׁ הַֽ/מַּעֲל֖וֹת מִ/זֶּ֣ה וּ/מִ/זֶּ֑ה לֹֽא נַעֲשָׂ֥ה כֵ֖ן לְ/כָל מַמְלָכֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/020.yaml
  text: And twelve lions were standing there on the six steps[a], on this side and on that side[b]; nothing like it had been made in any kingdom.
  footnotes:
  - marker: a
    text: Or, 'on one side and on the other.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'it had not been made so for all the kingdoms.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 열두 마리 사자가 거기에 있었는데, 여섯 계단 위에, 이쪽과 저쪽에 서 있었습니다[a]. 아무 왕국에서도 이와 같은 것은 만들어진 적이 없습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한쪽과 다른 쪽에’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면, ‘그와 같이 모든 왕국을 위하여 만들어진 적이 없었습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר אֲרָיִים
  english_pob_choice: And twelve lions
  chosen_korean: 열두 마리 사자
  alternatives_korean:
  - 열두 사자들
  - 열두 사자상
  lexicon: HALOT
  rationale: 히브리어 복수 명사 אֲרָיִים는 사자 형상을 가리키는 것으로 자연스럽게 옮기되, 한국어에서는 수량과 결합한 ‘마리’를 사용해 장면의 실재성과 시각성을 살렸습니다.
- source_word: עֹמְדִים שָׁם
  english_pob_choice: were standing there
  chosen_korean: 거기에 있었는데 … 서 있었습니다
  alternatives_korean:
  - 거기에 서 있었습니다
  - 거기에 서 있던
  lexicon: HALOT
  rationale: 분사 עֹמְדִים의 묘사적 성격을 살리기 위해 ‘서 있었습니다’를 택했고, 장소 부사 שָׁם은 ‘거기에’로 옮겼습니다.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  english_pob_choice: on the six steps
  chosen_korean: 여섯 계단 위에
  alternatives_korean:
  - 여섯 계단에
  - 여섯 계단 위
  lexicon: HALOT
  rationale: מַעֲלוֹת는 계단/단을 뜻하므로 문맥상 왕좌로 올라가는 ‘계단’으로 번역했고, עַל의 위치 관계를 자연스럽게 드러내기 위해 ‘위에’를 넣었습니다.
- source_word: מִזֶּה וּמִזֶּה
  english_pob_choice: on this side and on that side
  chosen_korean: 이쪽과 저쪽에
  alternatives_korean:
  - 이편과 저편에
  - 양쪽에
  lexicon: HALOT
  rationale: 분배적 대구를 유지하면서 한국어로는 가장 직관적인 양쪽 배치를 드러내는 표현으로 옮겼습니다.
- source_word: לֹא נַעֲשָׂה כֵן לְכָל מַמְלָכֹת
  english_pob_choice: nothing like it had been made in any kingdom
  chosen_korean: 아무 왕국에서도 이와 같은 것은 만들어진 적이 없습니다
  alternatives_korean:
  - 어떤 왕국에서도 이와 같이 만들어진 적이 없습니다
  - 모든 왕국 가운데 이 같은 것은 없었습니다
  lexicon: HALOT
  rationale: 부정문과 비교문의 의미를 살려 ‘이와 같은 것은’으로 대상의 유일성을 드러냈고, לְכָל מַמְלָכֹת는 문맥상 ‘아무 왕국에서도’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 장면의 비교 강조
  chosen_reading: ‘아무 왕국에서도 이와 같은 것은 만들어진 적이 없습니다’로 옮겨, 단순한 미학적 묘사보다 왕국들 가운데 전례 없는 왕권 상징이라는 비교 강조를 살렸습니다.
  alternative_readings:
  - ‘어떤 왕국에서도 이와 같은 것은 없었습니다’
  - ‘모든 왕국 가운데 이와 같이 된 적은 없습니다’
  rationale: 히브리어 부정 비교구문은 단순 존재 부정보다 ‘전례 없음’을 강하게 말하므로, 그 뉘앙스를 한국어에서도 분명히 드러내는 것이 본문 의도에 맞습니다.
  doctrine_reference: 왕권 상징과 성전/왕궁 장식의 유일성에 대한 서술적 본문
- issue: 사자의 수량 표현
  chosen_reading: ‘열두 마리 사자’
  alternative_readings:
  - ‘열두 사자’
  - ‘열두 사자상’
  rationale: 문맥상 살아 있는 사자가 아니라 장식물일 가능성이 높지만, 본문은 그 조형을 ‘사자들’로 직접 서술하므로 과도한 해석어인 ‘사자상’은 피하고, 한국어 자연성을 위해 수량 단위만 보완했습니다.
  doctrine_reference: 본문의 표층 서술을 우선하는 역사서 해석 원칙
