  yaml_path: translation/ot/1_kings/010/016.yaml
  text: King Solomon made two hundred large shields of beaten gold[b][a]; six hundred shekels of gold went onto each shield.
  footnotes:
  - marker: a
    text: Literally, 'six hundred gold went up on the one shield'; 'shekels' is implied as the weight unit.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term for 'shield' here refers to a large shield, likely distinct from the smaller shields mentioned in the following verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬 왕은 두드려 편 금으로 큰 방패 이백 개를 만들었습니다.[b] 각 방패에는 금 육백 세겔이 들어갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘한 방패 위에 금 육백이 올라갔다’에 가깝고, 여기서는 무게 단위 ‘세겔’이 생략되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘방패’에 해당하는 히브리어는 큰 방패를 가리키며, 다음 절의 더 작은 방패와 구별되는 것으로 보입니다.
    reason: lexical_alternative
