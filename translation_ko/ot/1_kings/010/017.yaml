  to: 또 두드려 편 금으로 큰 방패 삼백 개를 만들었는데,[a] 각 방패에는 금 세 마네가 입혀졌습니다.[b] 왕은 그것들을 레바논 숲의 집에 두었습니다.[c]
  rationale: 가공된 금이라는 어휘 의미와 방패에 금이 적용되었다는 히브리어 관용을 더 명료하고 자연스러운 한국어로 반영했습니다. 히브리어 무게 단위는 ‘마네’로 바로잡았고, 각주 표지를 해당 본문 어구에 연결했습니다. 건물명은 고유명사성을 유지하되 각주 표현을 현대적으로 다듬었습니다.
