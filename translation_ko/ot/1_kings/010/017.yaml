  text: וּ/שְׁלֹשׁ מֵא֤וֹת מָֽגִנִּים֙ זָהָ֣ב שָׁח֔וּט שְׁלֹ֤שֶׁת מָנִים֙ זָהָ֔ב יַעֲלֶ֖ה עַל הַ/מָּגֵ֣ן הָ/אֶחָ֑ת וַ/יִּתְּנֵ֣/ם הַ/מֶּ֔לֶךְ בֵּ֖ית יַ֥עַר הַ/לְּבָנֽוֹן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/017.yaml
  text: and three hundred shields of beaten gold[a]; three minas of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
  footnotes:
  - marker: a
    text: Or 'hammered gold' or 'gold beaten thin.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'three minas of gold went up on the one shield,' that is, each shield had three minas of gold applied to it.
    reason: lexical_alternative
  - marker: c
    text: The House of the Forest of Lebanon was a named royal building or armory associated with Solomon's palace complex (cf. 1 Kgs 7:2).
    reason: cross_reference
translation:
  language: ko
  text: 또 두드려 편 금으로 큰 방패 삼백 개를 만들었는데,[a] 각 방패에는 금 세 마네가 입혀졌습니다.[b] 왕은 그것들을 레바논 숲의 집에 두었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두드린 금’, ‘얇게 두드린 금’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘금 세 마네가 그 한 방패 위로 올라갔다’고 말하며, 각 방패에 그만큼의 금이 입혀졌다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘레바논 숲의 집’은 솔로몬 궁전 단지와 관련된, 고유한 이름을 가진 왕실 건물 또는 무기고를 가리킵니다(왕상 7:2 참조).
    reason: cross_reference
