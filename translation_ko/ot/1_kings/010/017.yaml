  naturalness: ‘각 방패마다 금 세 마나가 들어갔습니다’는 뜻은 전달되지만, 재료가 단순히 포함되었다는 인상을 주며 다소 구어적입니다. ‘각 방패에는 금 세 마네가 입혀졌습니다’가 금을 방패에 적용했다는 문맥에 더 자연스럽게 맞습니다. 각주 표지도 해당 어구 바로 뒤에 두는 것이 독해와 주석 연결에 적절합니다.
