id: 1KI.10.7
reference: 1 Kings 10:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא הֶאֱמַ֣נְתִּי לַ/דְּבָרִ֗ים עַ֤ד אֲשֶׁר בָּ֨אתִי֙ וַ/תִּרְאֶ֣ינָה עֵינַ֔/י וְ/הִנֵּ֥ה לֹֽא הֻגַּד לִ֖/י הַ/חֵ֑צִי הוֹסַ֤פְתָּ חָכְמָה֙ וָ/ט֔וֹב אֶל הַ/שְּׁמוּעָ֖ה אֲשֶׁ֥ר שָׁמָֽעְתִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/007.yaml
  text: But I did not believe the reports until I came and my own eyes saw it; and behold[a], not even half was told to me. You have surpassed the report that I heard in wisdom and prosperity.
  footnotes:
  - marker: a
    text: Or 'You exceed the report I heard in wisdom and wealth.' The Hebrew טוֹב can denote general prosperity or well-being, and in this context may include wealth as part of Solomon's flourishing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 와서 내 눈으로 직접 보기 전에는 그 말들을 믿지 않았습니다. 보십시오, 내게 전해진 것은 절반도 되지 않았습니다. 당신의 지혜와 번영은 내가 들은 보고보다 더 뛰어납니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 지혜와 부요는 내가 들은 보고보다 더 뛰어납니다.’ 히브리어 טוֹב는 일반적인 번영이나 형통을 뜻할 수 있으며, 이 문맥에서는 솔로몬의 번성 가운데 재물을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹֽא הֶאֱמַנְתִּי לַדְּבָרִים
  english_pob_choice: I did not believe the reports
  chosen_korean: 그 말들을 믿지 못했습니다
  alternatives_korean:
  - 그 보고를 믿지 못했습니다
  - 그 소식을 믿지 못했습니다
  lexicon: HALOT
  rationale: 히필형 הֶאֱמַנְתִּי는 ‘참된 것으로 여기다/믿다’의 뜻이므로, 궁정 맥락에서 ‘말들’보다 자연스러운 ‘그 말들’을 써서 들은 내용을 반영했습니다.
- source_word: וַתִּרְאֶינָה עֵינַי
  english_pob_choice: my own eyes saw it
  chosen_korean: 내 눈으로 직접 보기 전에는
  alternatives_korean:
  - 내 눈이 그것을 보았습니다
  - 내 눈으로 보았습니다
  lexicon: HALOT
  rationale: 직역의 어순보다 한국어에서 강조가 살아나는 ‘내 눈으로 직접’이 첫눈에 확인한 체험을 잘 드러냅니다.
- source_word: לֹא הֻגַּד לִי הַחֵצִי
  english_pob_choice: not even half was told to me
  chosen_korean: 전해진 것은 절반도 되지 않았습니다
  alternatives_korean:
  - 절반도 내게 말해지지 않았습니다
  - 절반도 내게 알려지지 않았습니다
  lexicon: HALOT
  rationale: 관용적 과장 표현을 한국어의 자연스러운 부정 강조로 옮겼고, ‘전해지다’가 궁정 보고의 맥락을 살립니다.
- source_word: הוֹסַפְתָּ חָכְמָה וָטוֹב
  english_pob_choice: You have surpassed ... in wisdom and prosperity
  chosen_korean: 당신은 ... 지혜와 번영에서 더 뛰어납니다
  alternatives_korean:
  - 지혜와 복리에서 더 뛰어납니다
  - 지혜와 부요에서 더 뛰어납니다
  lexicon: HALOT
  rationale: הוֹסַפְתָּ는 단순히 ‘더하다’보다 비교적으로 ‘더 뛰어나다/초과하다’의 뜻이므로 ‘더 뛰어납니다’로 옮겼습니다. טוֹב는 여기서 도덕적 ‘좋음’보다 왕의 번성·형통을 가리키는 ‘번영’이 적절합니다.
- source_word: הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  english_pob_choice: the report that I heard
  chosen_korean: 내가 들은 그 소문
  alternatives_korean:
  - 내가 들은 그 보고
  - 내가 들은 그 뉴스
  lexicon: HALOT
  rationale: שְׁמוּעָה는 ‘전해 들은 말/소문’의 성격이 강하므로, 공식 문체를 해치지 않는 범위에서 ‘소문’이 가장 직접적입니다.
theological_decisions:
- issue: 솔로몬의 번영을 묘사하는 טוֹב의 의미
  chosen_reading: ‘번영’으로 옮겨 물질적 풍요와 형통을 함께 열어 두었습니다.
  alternative_readings:
  - ‘좋음’
  - ‘부요’
  rationale: 문맥이 왕궁의 화려함과 국가적 번성을 말하므로, 도덕적 평가로 축소하지 않고 번성의 총체적 상태를 살리는 번역이 적절합니다.
  doctrine_reference: 문맥 우선 원칙
