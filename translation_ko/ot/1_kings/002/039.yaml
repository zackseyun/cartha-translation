base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/039.yaml
  text: Now at the end of three years[a], two slaves of Shimei ran away to Achish son of Maacah, king of Gath. And they told Shimei, saying, “Look, your slaves are in Gath.”
  footnotes:
  - marker: a
    text: Or 'servants' for 'slaves' (עֲבָדִים / עֲבָדֶיךָ); 'slaves' is used here because their bonded status is contextually prominent in their running away from their master.
    reason: lexical_alternative
translation:
  language: ko
  text: 삼 년이 끝날 무렵, 시므이의 종 둘이 가드 왕 마아가의 아들 아기스에게 달아났습니다. 사람들이 시므이에게 알려 말하기를 “보십시오, 당신의 종들이 가드에 있습니다” 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקֵּץ שָׁלֹשׁ שָׁנִים
  english_pob_choice: at the end of three years
  chosen_korean: 삼 년이 끝날 무렵
  alternatives_korean:
  - 삼 년 뒤에
  - 삼 년이 지나서
  lexicon: HALOT
  rationale: 시작점보다 종결점을 강조하는 זמן 표현이라서, 기간의 끝을 살리는 ‘삼 년이 끝날 무렵’으로 옮겼습니다.
- source_word: עֲבָדִים / עֲבָדֶיךָ
  english_pob_choice: slaves
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  lexicon: HALOT
  rationale: 영문 POB가 ‘slaves’를 택했지만, 한국어 본문에서는 관계를 직접 드러내면서도 본문의 사회적 종속성을 과도하게 현대화하지 않는 기본어 ‘종’을 사용했습니다.
- source_word: וַיִּבְרְחוּ
  english_pob_choice: ran away
  chosen_korean: 달아났습니다
  alternatives_korean:
  - 도망쳤습니다
  - 도망갔습니다
  lexicon: HALOT
  rationale: 노예/종이 주인에게서 이탈하는 행동을 자연스럽게 드러내는 현대 한국어로 ‘달아나다’를 선택했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 보고를 받는 장면에서 주의를 끄는 감탄을 공손한 직접화법으로 살리기 위해 ‘보십시오’로 옮겼습니다.
