  edition: WLC
  text: וַ/יַּ֗עַל בְּנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וַ/יִּפְגַּע בּ֖/וֹ וַ/יְמִתֵ֑/הוּ וַ/יִּקָּבֵ֥ר בְּ/בֵית֖/וֹ בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/034.yaml
  text: Then Benaiah son of Jehoiada went up[a], struck him down, and put him to death[b]; and he was buried at his house in the wilderness.
  footnotes:
  - marker: a
    text: Or 'fell upon him and killed him.' The Hebrew uses two verbs, one for the assault and one for the killing, which the main text preserves distinctly.
    reason: lexical_alternative
  - marker: b
    text: '''At his house'' may refer more broadly to burial on his family property or estate in the wilderness.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 브나야(여호야다의 아들)가 올라가서[a] 그를 쳐 죽였으며[b], 그는 광야에 있는 자기 집에 묻혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 달려들어 그를 죽였다’일 수 있습니다. 히브리어는 공격 동사와 살해 동사를 따로 사용하여, 본문이 두 단계를 구분해 보여 줍니다.
    reason: alternative_reading
  - marker: b
    text: ‘자기 집’은 광야에 있는 가족의 소유지나 부지를 더 넓게 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라가서
  alternatives_korean:
  - 올라갔습니다
  - 들어가서
  - 가서
  lexicon: HALOT
  rationale: עלה의 기본 의미인 ‘올라가다’를 살리면서, 서술 흐름을 자연스럽게 잇기 위해 연결형으로 옮겼습니다.
- source_word: וַיִּפְגַּע בּוֹ
  english_pob_choice: struck him down
  chosen_korean: 그를 쳐 죽였으며
  alternatives_korean:
  - 그를 쳐서 쓰러뜨렸으며
  - 그를 공격했으며
  - 그를 쳐서
  lexicon: HALOT
  rationale: פגע의 공격적 의미와 이어지는 ‘죽이다’를 함께 드러내기 위해, 단순한 ‘쳤다’보다 결과가 분명한 표현으로 옮겼습니다.
- source_word: וַיְמִתֵהוּ
  english_pob_choice: put him to death
  chosen_korean: 죽였으며
  alternatives_korean:
  - 사형에 처했으며
  - 죽게 했으며
  lexicon: HALOT
  rationale: 히필 동사의 사역적 의미는 한국어에서 가장 자연스럽게 ‘죽이다’로 드러나며, 앞 동사와 함께 실행·사살의 연속을 보여 줍니다.
- source_word: בְּבֵיתוֹ בַּמִּדְבָּר
  english_pob_choice: at his house in the wilderness
  chosen_korean: 광야에 있는 자기 집에
  alternatives_korean:
  - 광야에 있는 자기 집에서
  - 광야의 자기 집에
  - 광야에 있는 자기 집터에
  lexicon: HALOT
  rationale: בית가 단순한 ‘집’보다 집터·가문 소유지를 가리킬 수 있으므로, 묘지 위치를 과도하게 구체화하지 않으면서 문맥상 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 형벌 집행을 나타내는 이중 동사 구조
  chosen_reading: ‘올라가서… 쳐 죽였으며’로 두 동사의 연속을 구분해 살렸습니다.
  alternative_readings:
  - ‘가서 그를 죽였습니다’처럼 단순화
  - ‘올라가 그를 공격하고 죽였습니다’처럼 합침
  rationale: 히브리어는 공격 동사와 살해 동사를 분리해 서술하므로, 한국어도 사건의 강도와 진행을 분리해 드러내는 것이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: 본문 서술의 사건 구조 보존
- issue: Joab의 매장 위치
  chosen_reading: ‘광야에 있는 자기 집’은 실제 거주지라기보다 가문 소유지나 부지까지 포함할 수 있는 표현으로 남겼습니다.
  alternative_readings:
  - ‘자기 집 안에’로 직역
  - ‘자기 재산에’로 해석
  rationale: 본문의 בית는 주거 공간보다 더 넓은 소유지 의미를 가질 수 있어, 번역에서 그 긴장을 유지하는 편이 स्रोत에 충실합니다.
  doctrine_reference: 본문의 문화적·어휘적 모호성 보존
