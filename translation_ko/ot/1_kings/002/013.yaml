  yaml_path: translation/ot/1_kings/002/013.yaml
  text: Then Adonijah son of Haggith came to Bathsheba[a], the mother of Solomon, and she said, “Do you come in peace?” And he said, “In peace.”
  footnotes:
  - marker: a
    text: Or, more literally, “Is your coming peace?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 학깃의 아들 아도니야가 솔로몬의 어머니 밧세바에게 왔습니다. 밧세바가 말했습니다. 「평화로운 뜻으로 오셨습니까?」[a] 그가 말했습니다. 「평화로운 뜻으로 왔습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, 「당신의 오는 것이 평안입니까?」입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 왔습니다
  alternatives_korean:
  - 들어왔습니다
  - 왔어요
  lexicon: HALOT
  rationale: 서술의 시점이 밧세바에게 향해 있으므로, 영어 POB의 came처럼 ‘오다’로 자연스럽게 옮겼습니다.
- source_word: בַּת שֶׁבַע
  english_pob_choice: Bathsheba
  chosen_korean: 밧세바
  alternatives_korean:
  - 바트세바
  lexicon: modern biblical proper name usage
  rationale: 성경에서 널리 정착된 한국어 음역을 따랐습니다.
- source_word: אֵם שְׁלֹמֹה
  english_pob_choice: the mother of Solomon
  chosen_korean: 솔로몬의 어머니
  alternatives_korean:
  - 솔로몬의 모친
  lexicon: HALOT
  rationale: 히브리어의 소유·관계 구문을 그대로 살려 밧세바의 왕실적 지위를 분명히 했습니다.
- source_word: הֲשָׁלוֹם בֹּאֶךָ
  english_pob_choice: Do you come in peace?
  chosen_korean: 평안한 뜻으로 오셨습니까?
  alternatives_korean:
  - 평안히 오셨습니까?
  - 평안하게 오셨습니까?
  lexicon: HALOT
  rationale: 직역하면 ‘당신의 옴이 평안입니까?’에 가까운 관용구이므로, 평화로운 의도 여부를 묻는 질문으로 옮겼습니다.
theological_decisions:
- issue: שָׁלוֹם / 평안의 응답
  chosen_reading: 아도니야의 대답 「평안합니다」를 짧게 살려, 의도적으로 애매하고 조심스러운 안부 응답으로 유지했습니다.
  alternative_readings:
  - 평안합니다요
  - 평안합니다만
  rationale: 원문은 짧은 단어 하나로 응답하여 긴장감을 남기므로, 한국어에서도 그 절제를 보존했습니다.
  doctrine_reference: 서사적 문맥 보존
