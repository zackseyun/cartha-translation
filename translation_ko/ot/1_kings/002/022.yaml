  to: 솔로몬 왕이 그의 어머니에게 대답하여 말했습니다. “어찌하여 아도니야를 위해 수넴 여인 아비삭을 청하고 있습니까? 그에게 왕권[a]도 구하십시오. 그는 저보다 나이가 많은 제 형이니, 그를 위해서뿐 아니라 제사장 아비아달과 스루야의 아들 요압을 위해서도 구하십시오!”
  rationale: 히브리어의 ‘그를 위하여 … 그리고 아비아달을 위하여, 요압을 위하여’라는 병렬적이고 생략적인 표현을 한국어에서 반복된 ‘구하십시오’로 보완했습니다. 이렇게 하면 아도니야의 청원이 왕권 요구와 연결된다는 솔로몬의 반어를 보존하면서도 자연스러운 합쇼체 문장이 됩니다. 각주 표지는 해당 어휘인 ‘왕권’ 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:45:04Z'
