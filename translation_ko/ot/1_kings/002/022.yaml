base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/022.yaml
  text: King Solomon answered and said to his mother[a], “Why are you asking for Abishag the Shunammite for Adonijah? Ask for the kingship for him as well, since he is my older brother—and for him, for Abiathar the priest, and for Joab son of Zeruiah!”
  footnotes:
  - marker: a
    text: Or “the kingdom” or “the throne.” The Hebrew term can denote royal rule more broadly; here “the kingship” highlights Solomon’s point that Adonijah’s request carries dynastic implications.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬 왕이 그의 어머니에게 대답하며 말했습니다. “어찌하여 아비삭 수넴 여인을 아도니야를 위해 구하고 있습니까? 그에게 왕권도 구하십시오. 그는 저보다 나이가 많은 형이기 때문입니다. 그리고 그에게, 제사장 아비아달에게, 그리고 스루야의 아들 요압에게도 말입니다!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕권’은 여기서 단순한 영토가 아니라 통치권과 왕위 계승권을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ שְׁלֹמֹה
  english_pob_choice: King Solomon answered
  chosen_korean: 솔로몬 왕이 … 대답하며 말했습니다
  alternatives_korean:
  - 솔로몬 왕이 대답하여 말했습니다
  - 솔로몬 왕이 응답하며 말했습니다
  lexicon: HALOT
  rationale: 서사적 응답 동사를 유지하되, 한국어에서는 ‘대답하며 말했습니다’가 자연스럽고 ‘응답하다’보다 덜 인공적입니다.
- source_word: לְאִמּוֹ
  english_pob_choice: to his mother
  chosen_korean: 그의 어머니에게
  alternatives_korean:
  - 어머니에게
  - 그의 어머니 바스세바에게
  lexicon: HALOT
  rationale: 히브리어 본문은 단지 ‘어머니’만 말하므로, 문맥상 바스세바를 보충하지 않고 그대로 옮겼습니다.
- source_word: אֶת הַמְּלוּכָה
  english_pob_choice: the kingship
  chosen_korean: 왕권
  alternatives_korean:
  - 왕국
  - 나라
  - 왕좌
  lexicon: HALOT
  rationale: 여기서는 영토보다 통치 권한과 왕위 계승 문제를 가리키므로 ‘왕권’이 가장 직접적입니다. 영어 POB의 ‘the kingship’와도 대응됩니다.
- source_word: וְשַׁאֲלִי לוֹ
  english_pob_choice: Ask for him as well
  chosen_korean: 그에게 … 구하십시오
  alternatives_korean:
  - 그를 위해도 구하십시오
  - 그를 위해 왕권도 구하십시오
  lexicon: HALOT
  rationale: 명령형의 누적과 반어적 압박을 살리기 위해, 앞의 요청에 덧붙여 ‘구하십시오’로 반복했습니다.
- source_word: וְלוֹ וּלְאֶבְיָתָר הַכֹּהֵן וּלְיוֹאָב בֶּן צְרוּיָה
  english_pob_choice: —and for him, for Abiathar the priest, and for Joab son of Zeruiah!
  chosen_korean: 그리고 그에게, 제사장 아비아달에게, 그리고 스루야의 아들 요압에게도 말입니다
  alternatives_korean:
  - 그리고 그를 위해, 제사장 아비아달과 스루야의 아들 요압을 위해서도 말입니다
  - 그리고 아비아달 제사장과 스루야의 아들 요압에게도 말입니다
  lexicon: HALOT
  rationale: 본문의 병렬 구조를 유지하면서 한국어 어순에 맞게 정리했습니다. ‘제사장’은 직함으로 앞세웠고, 고유명사 ‘아비아달’과 ‘요압’은 통용 표기를 따랐습니다.
theological_decisions:
- issue: 아도니야의 요청이 암시하는 왕위 계승 의미
  chosen_reading: ‘왕권’으로 옮겨, 아비삭을 구하는 일이 단순한 결혼 요청이 아니라 왕권 주장과 연결된다는 함의를 드러냈습니다.
  alternative_readings:
  - ‘왕국’으로 더 일반적으로 옮겨 함의를 약화한다
  - 암시를 주석에만 남기고 본문은 중립적으로 번역한다
  rationale: 히브리어가 실제로 ‘왕권’을 명시하므로, 이를 약화시키지 않는 것이 본문 의도에 더 충실합니다. 영어 POB도 같은 이유로 ‘the kingship’를 택했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
