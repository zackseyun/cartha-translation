id: 1KI.2.12
reference: 1 Kings 2:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁלֹמֹ֕ה יָשַׁ֕ב עַל כִּסֵּ֖א דָּוִ֣ד אָבִ֑י/ו וַ/תִּכֹּ֥ן מַלְכֻת֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/012.yaml
  text: And Solomon sat on the throne of David his father[a], and his kingdom was firmly established.
  footnotes:
  - marker: a
    text: Or 'his reign was very secure' or 'his kingship was firmly established.'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 그의 아버지 다윗의 왕좌에 앉았고, 그의 왕국은 매우 견고하게 세워졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕국’은 여기서 솔로몬의 통치 또는 왕권까지 아우를 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  english_pob_choice: sat on
  chosen_korean: 왕좌에 앉았고
  alternatives_korean:
  - 왕좌에 앉았습니다
  - 왕좌에 자리를 잡았습니다
  lexicon: HALOT
  rationale: 왕위 계승 문맥에서 יָשַׁב은 단순한 ‘앉다’가 아니라 왕위에 오르다/즉위하다의 함의를 가지므로, ‘왕좌에 앉았고’로 왕권 취임의 이미지를 살렸습니다.
- source_word: כִּסֵּא
  english_pob_choice: throne
  chosen_korean: 왕좌
  alternatives_korean:
  - 보좌
  - 왕위의 자리
  lexicon: HALOT
  rationale: 다윗의 후계 왕권 문맥이므로 일반적인 ‘의자’보다 왕권을 드러내는 ‘왕좌’가 적절합니다.
- source_word: מַלְכֻתוֹ
  english_pob_choice: his kingdom
  chosen_korean: 그의 왕국
  alternatives_korean:
  - 그의 통치
  - 그의 왕권
  - 그의 왕위
  lexicon: HALOT
  rationale: מַלְכוּת는 ‘왕국/통치/왕권’을 아우를 수 있지만, 여기서는 솔로몬의 즉위 뒤 안정된 통치 상태를 서술하므로 ‘왕국’이 가장 자연스럽고 포괄적입니다.
- source_word: וַתִּכֹּן ... מְאֹד
  english_pob_choice: was firmly established
  chosen_korean: 매우 견고하게 세워졌습니다
  alternatives_korean:
  - 굳게 확립되었습니다
  - 매우 확립되었습니다
  - 아주 견고해졌습니다
  lexicon: HALOT
  rationale: כון의 수동적/결과적 의미와 מְאֹד의 강화를 함께 살려, ‘세워졌습니다’로 기본 의미를 유지하고 ‘매우 견고하게’로 강도를 드러냈습니다.
theological_decisions:
- issue: 다윗 왕좌의 계승과 후대 메시아적 함의
  chosen_reading: 본문의 직접 의미를 따라 솔로몬의 즉위와 왕국의 안정만을 진술하고, 후대의 메시아적 의미는 본문 밖으로 보류했습니다.
  alternative_readings:
  - 다윗 언약의 신학을 전면에 드러내는 해석
  - 메시아적 왕위 계승을 암시하는 강화된 번역
  rationale: 이 절은 역사 서술로서 솔로몬의 즉위 사실을 말하며, 후대 정경적 의미가 있더라도 번역문이 그 의미를 선취해 넣지는 않아야 합니다.
  doctrine_reference: 'Translation philosophy: Never import doctrinal claims the text does not make; preserve theological tension rather than resolve it.'
