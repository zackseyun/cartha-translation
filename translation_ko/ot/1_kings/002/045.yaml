  yaml_path: translation/ot/1_kings/002/045.yaml
  text: But King Solomon will be blessed[a], and the throne of David will be established before Yahweh forever.
  footnotes:
  - marker: a
    text: Or, 'King Solomon is blessed.' The Hebrew predicate can be read as a present declaration, though the context also supports the future-oriented rendering used in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 솔로몬 왕은 복을 받을 것이며, 다윗의 왕좌는 야훼 앞에서 영원히 견고히 세워질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘솔로몬 왕은 복받은 사람입니다.’ 히브리어 서술형 표현은 현재적 선언으로도 읽을 수 있지만, 문맥은 본문에 사용한 미래 지향 번역도 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ
  english_pob_choice: But King
  chosen_korean: 그러나 … 왕은
  alternatives_korean:
  - 그리고 … 왕은
  - 그 왕은
  lexicon: HALOT
  rationale: 문맥상 앞절의 심판 선언과 대조를 이루므로 접속사 ו를 ‘그러나’로 옮겨 담화의 반전을 살렸습니다. 기사적 정관은 한국어에서 자연스럽게 생략할 수 있어 ‘왕은’으로 처리했습니다.
- source_word: בָּרוּךְ
  english_pob_choice: will be blessed
  chosen_korean: 복을 받을 것이며
  alternatives_korean:
  - 복받은 것입니다
  - 복을 받습니다
  lexicon: HALOT
  rationale: 히브리어 서술형 형용사/분사 בָּרוּךְ는 상태 진술이지만, 왕의 선언 맥락에서 미래 지향적 약속으로 읽히므로 ‘복을 받을 것’으로 옮겨 원문의 전망성을 살렸습니다.
- source_word: יִהְיֶה נָכוֹן
  english_pob_choice: will be established
  chosen_korean: 견고히 세워질 것입니다
  alternatives_korean:
  - 확립될 것입니다
  - 굳게 설 것입니다
  lexicon: HALOT
  rationale: היה + נכון은 ‘확고히 서다/세워지다’의 뜻을 가지므로, 왕좌 언어에 맞게 ‘견고히 세워질 것입니다’로 자연스럽게 표현했습니다.
- source_word: לִ/פְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 앞에
  - 야훼의 면전에서
  lexicon: HALOT
  rationale: לִפְנֵי는 문자적으로 ‘앞에/면전에서’이므로 프로젝트 기본값에 따라 하나님의 이름을 ‘야훼’로, স্থান관계를 ‘앞에서’로 간결하게 살렸습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 공용 원칙이 YHWH를 학술적 음역 ‘야훼’로 표기하도록 제시하므로, 전통 교회어보다 स्रोत-직접적 표기를 우선했습니다.
  doctrine_reference: Project glossary — יְהוָה / YHWH → 야훼
- issue: בָּרוּךְ의 시제 감각
  chosen_reading: 축복 상태의 현재 진술보다 미래 약속으로 읽었습니다.
  alternative_readings:
  - '현재적 선언: ‘복이 있습니다’'
  - '정태적 형용: ‘복된’'
  rationale: 전후 문맥이 왕의 판결 선포와 다윗 왕좌의 지속을 함께 말하므로, 솔로몬에 대한 선언도 예언적/선언적 미래로 한국어화하는 것이 전체 흐름을 더 정확히 반영합니다.
  doctrine_reference: Translation philosophy §1, §6
