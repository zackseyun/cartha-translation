  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל שִׁמְעִ֗י אַתָּ֤ה יָדַ֨עְתָּ֙ אֵ֣ת כָּל הָ/רָעָ֗ה אֲשֶׁ֤ר יָדַע֙ לְבָ֣בְ/ךָ֔ אֲשֶׁ֥ר עָשִׂ֖יתָ לְ/דָוִ֣ד אָבִ֑/י וְ/הֵשִׁ֧יב יְהוָ֛ה אֶת רָעָתְ/ךָ֖ בְּ/רֹאשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/044.yaml
  text: Then the king said to Shimei[a], “You know all the evil that your heart knows, which you did to David my father[b]; and Yahweh has returned your evil on your own head.”
  footnotes:
  - marker: a
    text: Or, “that you know in your heart.” The Hebrew literally says, “that your heart knows,” emphasizing Shimei’s inward awareness of his guilt.
    reason: lexical_alternative
  - marker: b
    text: Or, “has returned” or “has repaid.” The Hebrew verb carries the sense of causing Shimei’s evil to come back upon him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 시므이에게 말했습니다. "당신은 당신의 마음이 아는 온갖 악을 알고 있습니다. 곧 당신이 내 아버지 다윗에게 행한 그 일입니다. 그리고 야훼께서 당신의 악을 당신의 머리 위로 되돌리셨습니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “당신의 마음이 아는”이라고 말합니다. 이는 시므이가 자기 내면에서 죄책을 알고 있음을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 “되돌리다” 또는 “갚다”의 뜻을 가질 수 있습니다. 여기서는 시므이의 악이 그에게 되돌아오는 보응의 이미지를 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  english_pob_choice: Then the king said
  chosen_korean: 그때 왕이 말했습니다
  alternatives_korean:
  - 그리고 왕이 말했습니다
  - 그러자 왕이 말했습니다
  lexicon: WLC; HALOT
  rationale: 와우 연속의 서술 진행을 자연스러운 한국어 시간표현으로 옮기되, 왕을 특정 이름 없이 지칭하는 서술 방식을 유지했습니다.
- source_word: אַתָּה יָדַעְתָּ אֵת כָּל הָרָעָה אֲשֶׁר יָדַע לְבָבְךָ
  english_pob_choice: You know all the evil that your heart knows
  chosen_korean: 당신은 당신의 마음이 아는 온갖 악을 알고 있습니다
  alternatives_korean:
  - 당신은 마음이 아는 모든 악을 알고 있습니다
  - 당신은 당신의 마음이 아는 모든 악을 알고 있습니다
  lexicon: WLC; HALOT
  rationale: 히브리어의 직역적 이미지를 살려 ‘마음이 아는’ 구조를 유지했고, רָעָה는 이 문맥에서 도덕적 악을 가리키므로 ‘악’으로 옮겼습니다.
- source_word: לְדָוִד אָבִי
  english_pob_choice: to David my father
  chosen_korean: 내 아버지 다윗에게
  alternatives_korean:
  - 내 아버지 다윗에게
  - 내 아버지 다윗에게 행한
  lexicon: WLC; HALOT
  rationale: 관계절을 한국어로 매끄럽게 정리하면서도, 다윗을 솔로몬의 아버지로 지칭하는 직접 표현을 보존했습니다.
- source_word: וְהֵשִׁיב יְהוָה אֶת רָעָתְךָ בְּרֹאשֶׁךָ
  english_pob_choice: Yahweh has returned your evil on your own head
  chosen_korean: 야훼께서 당신의 악을 당신의 머리 위로 되돌리셨습니다
  alternatives_korean:
  - 야훼께서 당신의 악을 당신의 머리 위에 갚으셨습니다
  - 야훼께서 당신의 악을 당신 자신에게 돌려보내셨습니다
  lexicon: WLC; HALOT
  rationale: הֵשִׁיב의 ‘되돌리다/돌려오게 하다’ 의미를 살렸고, ‘머리 위로’는 보응이 행위자에게 돌아오는 관용구를 비교적 직접적으로 보존합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 하나님의 이름 יְהוָה를 대체 титул이 아닌 고유명으로 드러내기 위해 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 보응의 주체
  chosen_reading: 야훼께서 당신의 악을 당신의 머리 위로 되돌리셨습니다
  alternative_readings:
  - 주께서 당신의 악을 당신의 머리 위로 되돌리셨습니다
  - 야훼께서 당신의 악에 대해 갚으셨습니다
  rationale: 본문이 악의 귀결을 야훼의 행위로 직접 진술하므로, 그 신적 주체성을 약화하지 않고 그대로 반영했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
