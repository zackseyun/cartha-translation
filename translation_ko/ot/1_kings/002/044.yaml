- from: 그때 왕이 시므이에게 말했습니다. "당신은 당신의 마음이 아는 온갖 악을 알고 있습니다. 곧 당신이 내 아버지 다윗에게 행한 그 일입니다. 그리고 야훼께서 당신의 악을 당신의 머리 위로 되돌리셨습니다."[a][b]
  to: 그때 왕이 시므이에게 말했습니다. “당신은 당신의 마음이 알고 있는[a] 모든 악, 곧 당신이 내 아버지 다윗에게 행한 악을 알고 있습니다. 야훼께서 당신의 악을 당신의 머리 위에 되돌리셨습니다.[b]”
  rationale: 관계절을 원문에 가깝게 ‘다윗에게 행한 악’으로 직접 연결하고, ‘마음이 알고 있는’으로 현대 한국어의 자연스러움을 확보했습니다. 야훼의 직접적 행위와 악이 행위자에게 돌아오는 표현은 유지했으며, 각주 표지를 해당 어구에 배치했습니다.
