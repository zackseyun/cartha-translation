  rationale: 공식적인 왕실 부고 문맥에 맞는 문어적 표현으로, 단순한 일상어보다 장례 완료의 뜻을 분명히 드러냅니다.
- source_word: בְּעִיר דָּוִד
  english_pob_choice: in the city of David
  chosen_korean: 다윗 성읍에
