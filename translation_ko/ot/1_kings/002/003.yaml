base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/003.yaml
  text: And keep the charge of Yahweh your God by walking in his ways and by keeping his statutes[a], his commandments, his judgments, and his testimonies, as it is written in the Law of Moses, so that you may act wisely in all that you do and wherever you turn.
  footnotes:
  - marker: a
    text: Or, 'so that you may act wisely' or 'so that you may succeed.' The Hebrew verb can emphasize wise conduct or the success that flows from it.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와 당신의 하나님께서 맡기신 직무를 지키고, 그의 길로 걸으며, 그의 규례와 계명과 판결과 증거를 모세의 율법에 기록된 대로 지키십시오. 그러면 당신이 하는 모든 일과 어디로 가든지 지혜롭게 행하게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “지혜롭게 행하게 하려는 것입니다” 또는 “형통하게 하려는 것입니다.” 히브리어 동사는 지혜로운 처신이나 그에 따르는 성공을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ / מִשְׁמֶרֶת
  english_pob_choice: And keep the charge
  chosen_korean: 맡기신 직무를 지키고
  alternatives_korean:
  - 맡은 직무를 지키고
  - 맡겨진 책임을 지키고
  - 맡기신 것을 지키고
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת는 단순한 ‘보호’보다 맡겨진 책임·직무의 뉘앙스를 가지므로, 한국어에서는 ‘맡기신 직무’가 문맥의 위임성과 의무성을 함께 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 주어진 영어 POB는 Yahweh를 사용하지만, 본문 자체의 번역에서는 한국어 독자에게 가장 직접적으로 인식되는 고유 신명 표기로 ‘여호와’를 사용했습니다.
- source_word: חֻקֹּתָיו מִצְוֺתָיו וּמִשְׁפָּטָיו וְעֵדְוֺתָיו
  english_pob_choice: his statutes, his commandments, his judgments, and his testimonies
  chosen_korean: 그의 규례와 계명과 판결과 증거
  alternatives_korean:
  - 그의 법도와 계명과 판단과 증거
  - 그의 율례와 명령과 재판과 증언
  lexicon: HALOT
  rationale: 네 용어를 각각 구별해 살리되, 한국어 성경에서 널리 통용되는 법적·언약적 어휘를 택해 목록의 병렬성과 구분을 유지했습니다.
- source_word: תַּשְׂכִּיל
  english_pob_choice: so that you may act wisely / succeed
  chosen_korean: 지혜롭게 행하게 될 것입니다
  alternatives_korean:
  - 형통하게 될 것입니다
  - 잘 분별하게 될 것입니다
  - 성공하게 될 것입니다
  lexicon: HALOT
  rationale: הִפְעִיל형 שׂכל은 ‘지혜롭게 행하다’와 ‘형통하다’의 의미 범위를 가지므로, 본문이 강조하는 언약적 순종의 결과를 살리면서도 ‘지혜롭게’로 의미를 직접 드러냈습니다.
theological_decisions:
- issue: תּוֹרַת מֹשֶׁה의 한국어 신학 용어
  chosen_reading: 모세의 율법
  alternative_readings:
  - 모세의 가르침
  - 모세의 교훈
  rationale: 여기서 תּוֹרָה는 단순한 ‘instruction’보다 모세를 매개로 한 언약적 규범 전체를 가리키므로, 한국어 성경 관용과 문맥상 ‘율법’이 가장 분명합니다.
  doctrine_reference: Torah terminology in historical narrative
- issue: לְמַעַן תַּשְׂכִּיל의 결과 진술
  chosen_reading: 지혜롭게 행하게 될 것입니다
  alternative_readings:
  - 형통하게 될 것입니다
  - 성공하게 될 것입니다
  rationale: 이 표현은 단순한 번영 약속보다 순종이 낳는 지혜로운 행위를 강조하므로, 독자가 행위의 방식과 결과를 함께 읽도록 했습니다.
  doctrine_reference: Covenantal obedience and wisdom
- issue: 여호와 호칭의 음역 선택
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 단락의 한국어 본문에서는 전통적이고 즉시 식별 가능한 신명 표기를 유지했지만, 번역철학상 본문 원형의 신명성을 의식한 선택입니다.
  doctrine_reference: Divine name rendering
