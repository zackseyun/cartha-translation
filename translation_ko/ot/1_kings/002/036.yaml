  text: Then the king sent and called for Shimei and said to him[a], “Build yourself a house in Jerusalem and live there, and do not go out from there anywhere.”
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''here or there,'' that is, ''anywhere.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 사람을 보내 시므이를 불러 말했습니다. 「예루살렘에 너를 위해 집을 짓고 거기에서 살라. 그리고 거기에서 어디로도 나가지 말아라.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘여기 또는 저기’이며 곧 ‘어디로나/어디든지’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ וַיִּקְרָא
  english_pob_choice: Then the king sent and called for Shimei
  chosen_korean: 왕이 사람을 보내 시므이를 불러
  alternatives_korean:
  - 왕이 시므이를 보내 불렀습니다
  - 왕이 시므이를 불러오게 했습니다
  lexicon: WLC; HALOT
  rationale: 히브리어의 연속 동사 שניים(‘보내다’ + ‘부르다’)를 살려, 단순히 한 번의 요청이 아니라 왕의 전갈과 소환을 함께 드러냈습니다.
- source_word: בְּנֵה לְךָ בַיִת
  english_pob_choice: Build yourself a house
  chosen_korean: 예루살렘에 너를 위해 집을 짓고
  alternatives_korean:
  - 예루살렘에 네 집을 지어라
  - 예루살렘에 너 자신을 위해 집을 지어라
  lexicon: HALOT
  rationale: לְךָ의 ‘너를 위해’라는 개인적 유익을 살리되, 한국어에서는 자연스럽게 풀어 ‘너를 위해 집을 짓고’로 옮겼습니다.
- source_word: וְלֹא תֵצֵא מִשָּׁם אָנֶה וָאָנָה
  english_pob_choice: and do not go out from there anywhere
  chosen_korean: 그리고 거기에서 어디로도 나가지 말아라
  alternatives_korean:
  - 그리고 거기에서 아무 데도 나가지 말아라
  - 그리고 거기에서 이리저리 나가지 말아라
  lexicon: HALOT
  rationale: אָנֶה וָאָנָה의 관용구를 ‘어디로도’로 옮겨, POB의 의미인 ‘anywhere’와 출입 금지의 포괄성을 분명히 했습니다.
theological_decisions:
- issue: 왕의 명령문 체와 직접 화법의 존중을 어떻게 처리할지
  chosen_reading: 직접 명령은 한국어에서 반말 명령형으로 유지해 왕권적 제약의 강도를 드러냈습니다.
  alternative_readings:
  - 합니다체 명령으로 완화
  - 간접화법으로 완곡하게 처리
  rationale: 본문은 시므이에 대한 실제 왕명이며, 명령의 구속성을 약화시키지 않기 위해 직접 명령형을 유지하는 것이 적절합니다.
  doctrine_reference: 본문 신학보다는 서술-명령 구조의 보존 문제
