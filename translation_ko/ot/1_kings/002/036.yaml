translation:
  language: ko
  text: 그때 왕이 사람을 보내 시므이를 불러 말했습니다. “예루살렘에 네 집을 짓고 그곳에 살며, 그곳에서 어디로도 나가지 말라[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘이리 또는 저리로’이며, 곧 ‘어디로든지’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ וַיִּקְרָא
  english_pob_choice: Then the king sent and called for Shimei
  chosen_korean: 왕이 사람을 보내 시므이를 불러
  alternatives_korean:
