revisions:
- from: 그때 왕이 사람을 보내 시므이를 불러 말했습니다. 「예루살렘에 너를 위해 집을 짓고 거기에서 살라. 그리고 거기에서 어디로도 나가지 말아라.」[a]
  to: 그때 왕이 사람을 보내 시므이를 불러 말했습니다. “예루살렘에 네 집을 짓고 그곳에 살며, 그곳에서 어디로도 나가지 말라[a].”
  rationale: 왕이 보내고 시므이를 불러 말한 두 동작, 예루살렘 거주의 명령, 그리고 어느 방향으로도 떠나지 못하게 하는 포괄적 금지를 모두 보존했습니다. 직접 명령은 현대 한국어의 공식적 역사 서술에 맞게 '-말라'로 정리했으며, לְךָ의 개인적 소유·수익의 뉘앙스는 자연스러운 표현인 '네 집'으로 옮겼습니다.
