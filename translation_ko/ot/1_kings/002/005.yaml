source:
  edition: WLC
  text: וְ/גַ֣ם אַתָּ֣ה יָדַ֡עְתָּ אֵת֩ אֲשֶׁר עָ֨שָׂה לִ֜/י יוֹאָ֣ב בֶּן צְרוּיָ֗ה אֲשֶׁ֣ר עָשָׂ֣ה לִ/שְׁנֵֽי שָׂרֵ֣י צִבְא֣וֹת יִ֠שְׂרָאֵל לְ/אַבְנֵ֨ר בֶּן נֵ֜ר וְ/לַ/עֲמָשָׂ֤א בֶן יֶ֨תֶר֙ וַ/יַּ֣הַרְגֵ֔/ם וַ/יָּ֥שֶׂם דְּמֵֽי מִלְחָמָ֖ה בְּ/שָׁלֹ֑ם וַ/יִּתֵּ֞ן דְּמֵ֣י מִלְחָמָ֗ה בַּ/חֲגֹֽרָת/וֹ֙ אֲשֶׁ֣ר בְּ/מָתְנָ֔י/ו וּֽ/בְ/נַעֲל֖/וֹ אֲשֶׁ֥ר בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/005.yaml
  text: 'And you also know what Joab son of Zeruiah did to me[a], what he did to the two commanders of the armies of Israel, to Abner son of Ner and to Amasa son of Jether: he killed them and put the blood of war in peace[b], and put the blood of war on the belt that was around his waist and on the sandals that were on his feet.'
  footnotes:
  - marker: a
    text: Or, more literally, "and set the blood of war in peace"; the Hebrew idiom means that Joab committed wartime bloodshed under peaceful conditions.
    reason: lexical_alternative
  - marker: b
    text: The imagery of blood on Joab's belt and sandals likely signifies bloodguilt visibly clinging to him because of these killings.
    reason: cultural_note
translation:
  language: ko
  text: 또한 당신도 스루야의 아들 요압이 내게 한 일, 곧 이스라엘 군대의 두 지휘관인 넬의 아들 아브넬과 예델의 아들 아마사에게 한 일을 알고 계십니다. 그는 그들을 죽이고 전쟁의 피를 평화 속에 두었으며[a], 전쟁의 피를 자기 허리에 두른 띠와 자기 발에 신은 신발에 묻혔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘전쟁의 피를 평화 가운데 두었다’입니다. 요압이 평화로운 상황에서 전쟁과 같은 유혈을 저질렀다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 띠와 신발에 묻은 피는 요압이 피를 흘린 죄책이 그에게 눈에 보이게 붙어 있음을 드러내는 이미지일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אַתָּה יָדַעְתָּ
  english_pob_choice: And you also know
  chosen_korean: 그뿐 아니라 당신도 아시다시피
  alternatives_korean:
  - 당신도 또한 아십니다
  - 그리고 당신도 알고 있습니다
  lexicon: HALOT
  rationale: 추가 강조와 이미 알고 있는 사실을 전하는 어감을 살리면서, 솔로몬에게 하는 직접 호칭을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: שָׂרֵי צִבְאוֹת יִשְׂרָאֵל
  english_pob_choice: the two commanders of the armies of Israel
  chosen_korean: 이스라엘 군대의 두 지휘관
  alternatives_korean:
  - 이스라엘 군대의 두 사령관
  - 이스라엘의 두 군대 지휘관
  lexicon: HALOT
  rationale: שָׂרֵי는 군사 지휘자를 가리키므로 ‘지휘관’이 적절하며, צִבְאוֹת의 복수성은 한국어에서 ‘군대’로 자연스럽게 풀었습니다.
- source_word: וַיָּשֶׂם דְּמֵי מִלְחָמָה בְּשָׁלֹם
  english_pob_choice: he killed them and put the blood of war in peace
  chosen_korean: 그들을 죽이고 전쟁의 피를 평화 가운데 두었으며
  alternatives_korean:
  - 그들을 죽이고 전쟁의 피를 평화 속에 두었으며
  - 전쟁의 피를 평화 중에 놓았으며
  lexicon: HALOT
  rationale: 히브리어의 반복 동사와 대비 구조를 살리기 위해 ‘두었으며’를 유지했고, 관용적 의미는 뒤의 전개와 함께 이해되도록 했습니다.
- source_word: וַיִּתֵּן דְּמֵי מִלְחָמָה בַּחֲגֹרָתוֹ ... וּבְנַעֲלוֹ ...
  english_pob_choice: and put the blood of war on the belt ... and on the sandals ...
  chosen_korean: 그 전쟁의 피를 그의 허리에 두른 띠와 그의 발에 신은 신발에 묻혔습니다
  alternatives_korean:
  - 그 전쟁의 피를 그의 띠와 그의 신발에 묻혔습니다
  - 그 전쟁의 피를 그의 허리띠와 발 신발에 묻혔습니다
  lexicon: HALOT
  rationale: חֲגוֹרָה와 נַעַל의 구체적 이미지를 보존하기 위해 ‘띠’와 ‘신발’을 택했고, 신체 부위 수식을 한국어 어순에 맞게 자연화했습니다.
theological_decisions:
- issue: 다윗의 진술에 담긴 ‘전쟁의 피를 평화 가운데 두었다’는 관용구의 처리
  chosen_reading: 직역적 이미지를 살리되, 문맥상 무죄한 피흘림과 평화 시의 살인을 고발하는 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘평화 중에 전쟁의 피를 흘렸다’로 설명적으로 풀기
  - ‘평화한 때에 피를 흘렸다’로 완화하기
  rationale: 본문은 요압의 살인이 전시가 아닌 평화의 조건에서 일어났음을 강조하므로, 의미를 평탄화하지 않고 수사적 긴장을 유지하는 것이 필요합니다.
  doctrine_reference: 구약 본문 해석과 서사적 수사 보존
