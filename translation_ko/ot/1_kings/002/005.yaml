  source_fidelity: 히브리어의 인명, 두 군 지휘관, 살해, ‘전쟁의 피’와 평화의 대조, 띠와 신발의 이미지는 대체로 보존되었습니다. 다만 현 번역은 ‘요압이 내게 한 일 ... 한 일은, 그들을 죽이고’라는 구문에서 주술 관계가 불안정하여, 요압이 행위의 주체임이 문법적으로 분명하게 드러나도록 고쳐야 합니다. ‘두었다’의 반복적 동사 이미지는 유지하되, 한국어 문장을 자연화했습니다.
