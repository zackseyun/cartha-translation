  rationale: 요압을 두 절의 명시적 행위 주체로 세워 한국어 문법을 바로잡고, 원문의 반복과 구체적 피의 이미지를 보존했습니다. 논쟁적 관용구는 ‘전쟁의 피를 평화 속에 두었다’로 직역에 가깝게 유지하고 각주에서만 설명했습니다.
