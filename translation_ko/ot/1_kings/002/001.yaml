lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי דָוִד לָמוּת
  english_pob_choice: As the days of David drew near for him to die
  chosen_korean: 다윗의 죽을 날이 가까워지자
  alternatives_korean:
  - 다윗의 날들이 죽으려고 가까워지자
  - 다윗의 생애가 끝나 갈 때
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘날들’이 죽음에 이르도록 가까워진다는 뜻이므로, 한국어에서는 자연스러운 시간 표현으로 옮기되 죽음의 임박을 분명히 드러냈습니다.
- source_word: וַיְצַו
  english_pob_choice: he commanded
  chosen_korean: 그는 ... 명령하며
  alternatives_korean:
  - 그는 ... 지시하며
  - 그는 ... 명하며
  lexicon: HALOT
  rationale: צוה의 기본 강도는 단순한 말함보다 강한 ‘명령’이므로, 다윗의 마지막 유언적 지시라는 문맥을 살려 옮겼습니다.
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  english_pob_choice: Solomon his son
  chosen_korean: 자기 아들 솔로몬
  alternatives_korean:
  - 솔로몬, 그의 아들
  - 그의 아들 솔로몬
  lexicon: HALOT
  rationale: 직접목적 표지와 동격 관계를 한국어 자연어 순서로 풀어, 관계를 분명히 하면서도 인물 호칭을 매끄럽게 유지했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이르셨습니다
  - 말하여
  lexicon: HALOT
  rationale: 다음 절로 이어지는 직접 화법 도입 기능을 살려, 현대 한국어에서 가장 자연스러운 서술형 연결로 처리했습니다.
