translation:
  language: ko
  text: 다윗이 죽을 때가 가까워지자[a], 그는 그의 아들 솔로몬에게 이렇게 명령했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 다윗의 죽음의 때가 가까워졌다는 뜻입니다.
