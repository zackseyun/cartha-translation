  text: 다윗의 죽을 날이 가까워지자, 그는 자기 아들 솔로몬에게 명령하며 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 다윗의 죽음의 때가 가까워졌다는 뜻입니다.
