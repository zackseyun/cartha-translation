  text: וְ/לִ/בְנֵ֨י בַרְזִלַּ֤י הַ/גִּלְעָדִי֙ תַּֽעֲשֶׂה חֶ֔סֶד וְ/הָי֖וּ בְּ/אֹכְלֵ֣י שֻׁלְחָנֶ֑/ךָ כִּי כֵן֙ קָרְב֣וּ אֵלַ֔/י בְּ/בָרְחִ֕/י מִ/פְּנֵ֖י אַבְשָׁל֥וֹם אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/007.yaml
  text: But show kindness to the sons of Barzillai the Gileadite[a], and let them be among those who eat at your table[c][b], for this is how they came near to me when I fled from Absalom your brother.
  footnotes:
  - marker: a
    text: Or 'deal loyally with the sons of Barzillai'; the Hebrew phrase 'do/show hesed' can carry the sense of loyal kindness, not mere sentiment.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'let them be among the eaters of your table,' an idiom for ongoing royal provision and favor.
    reason: cultural_note
  - marker: c
    text: Or 'they came to me' / 'they stood by me'; the Hebrew verb is literally 'came near,' here implying support during David's flight.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 바르질래, 길르앗 사람의 아들들에게는 인애를 베푸십시오. 그리고 그들이 당신의 상에서 먹는 사람들 가운데 있게 하십시오. 그들이 압살롬 당신의 형제에게서 도망할 때 나에게 그렇게 가까이 왔기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아들들’은 남성 후손을 가리키는 직접적 표현입니다.
    reason: source_note
  - marker: b
    text: ‘상에서 먹는 사람들’은 왕의 상에서 지속적으로 먹는다는 뜻으로, 왕실의 부양과 호의를 가리키는 관용입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי
  english_pob_choice: But ... to the sons of
  chosen_korean: 그러나 ... 아들들에게는
  alternatives_korean:
  - 그리고 ... 아들들에게는
  - 바르질래의 자손들에게는
  - 바르질래의 아들들에게는
  lexicon: HALOT
  rationale: 문맥상 앞선 명령을 잇는 전환이 있으므로 ‘그러나’로 처리했고, בנים의 직접적 친족 표지를 살려 ‘아들들’로 옮겼습니다.
- source_word: תַּעֲשֶׂה חֶסֶד
  english_pob_choice: show kindness
  chosen_korean: 인애를 베푸십시오
  alternatives_korean:
  - 친절을 베푸십시오
  - 충성을 베푸십시오
  - 은혜를 베푸십시오
  lexicon: HALOT
  rationale: עשה חסד는 단순한 호의보다 관계적·언약적 선의를 포함하므로, 현대 한국어에서 그 결을 살릴 수 있는 ‘인애를 베풀다’를 선택했습니다.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  english_pob_choice: among those who eat at your table
  chosen_korean: 당신의 상에서 먹는 사람들 가운데
  alternatives_korean:
  - 당신의 상에서 먹는 이들 가운데
  - 당신의 식탁에서 먹는 사람들 가운데
  - 당신의 상에 앉아 먹는 사람들 가운데
  lexicon: HALOT
  rationale: 왕의 지속적인 부양과 호의를 가리키는 관용을 유지하기 위해 직설적인 ‘상에서 먹는 사람들’로 옮겼습니다.
- source_word: קָרְבוּ אֵלַי
  english_pob_choice: they came near to me
  chosen_korean: 나에게 그렇게 가까이 왔기 때문입니다
  alternatives_korean:
  - 나에게 가까이 왔기 때문입니다
  - 나를 도우러 가까이 왔기 때문입니다
  - 나에게 다가왔기 때문입니다
  lexicon: HALOT
  rationale: קרב의 기본 의미인 ‘가까이 오다’를 유지하되, 영어 POB의 해설처럼 지원의 뉘앙스는 문맥이 드러내도록 두었습니다.
theological_decisions:
- issue: חֶסֶד의 번역에서 언약적 뉘앙스의 정도
  chosen_reading: ‘인애’로 옮기되, 단순한 감정이 아니라 보여 주는 선의와 충성의 실천을 함축하게 했습니다.
  alternative_readings:
  - ‘친절’로 완화
  - ‘충성스러운 사랑’으로 확대
  rationale: 바르질래 집안에 대한 보상 요청이라는 왕실·관계적 맥락에서, חסד의 공적이고 관계적인 성격을 너무 약화시키지 않는 표현이 필요했습니다.
  doctrine_reference: 구약 חסד의 언약적 자비와 성실성
