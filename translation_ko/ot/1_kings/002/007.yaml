review_pass:
  verdict: revise
  source_fidelity: 원문의 주어는 다윗 자신입니다(‘내가 도망할 때’). 초안의 ‘그들이 … 도망할 때’는 주어를 바꾸므로 수정이 필요합니다. 또한 ‘압살롬 당신의 형제에게서’는 한국어 어순상 부자연스럽고, 원문의 호칭 관계를 분명히 드러내도록 다듬는 것이 적절합니다. כֵן의 지시적·비교적 요소는 ‘그렇게’로 보존했습니다.
  naturalness: ‘바르질래, 길르앗 사람의’는 쉼표가 부자연스럽고, ‘인애’는 현대 표준어 합쇼체 본문에서는 다소 교회적·고어적입니다. 통용 표기인 ‘바르실래’와 자연스러운 ‘호의를 베푸십시오’를 사용했습니다. ‘당신의 형제 압살롬을 피해’는 현대 한국어에서 명료하고 자연스럽습니다.
  terminology: 바르실래와 길르앗은 한국어 성경 전통에서 널리 쓰이는 표기를 따랐습니다. חֶסֶד는 본문에서 특정 교리 용어로 과도하게 한정하지 않고 ‘호의’로 번역하되, 각주에서 충성스럽고 지속적인 친절의 뉘앙스를 밝혔습니다. 왕의 식탁 관용은 본문과 문화 각주에 유지했습니다.
  issues:
  - severity: high
    issue: 도망하는 주어가 ‘그들이’로 번역됨
    rationale: בְּבָרְחִי는 1인칭 접미사를 지녀 ‘내가 도망할 때’를 뜻합니다. 바르실래의 아들들이 도망했다는 뜻이 아닙니다.
  - severity: medium
    issue: ‘압살롬 당신의 형제에게서’의 어순과 관계 표현이 부자연스러움
    rationale: אָחִיךָ는 압살롬을 수식하는 ‘당신의 형제’입니다. ‘당신의 형제 압살롬을 피해’가 자연스럽고 의미도 분명합니다.
  - severity: medium
    issue: 각주 a의 앵커 위치가 해당 어구와 떨어져 있음
    rationale: ‘아들들’에 관한 주석이므로 ‘아들들’ 직후에 붙여야 독자가 참조 대상을 명확히 알 수 있습니다.
  - severity: low
    issue: ‘인애’는 현대 일반 독자에게 다소 비일상적임
    rationale: חֶסֶד의 관계적 충실성은 각주로 보완하면서, 본문은 현대적이고 자연스러운 ‘호의’를 쓰는 것이 적절합니다.
  revised_text: 그러나 바르실래 길르앗 사람의 아들들에게[a] 호의를 베푸십시오. 그들이 당신의 상에서 먹는 사람들 가운데[b] 있게 하십시오. 그들이 내가 당신의 형제 압살롬을 피해 도망할 때 그렇게 내게 가까이 왔기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 히브리어 ‘아들들’은 여기서 바르실래의 남성 후손을 직접적으로 가리킵니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘당신의 상을 먹는 이들 가운데’입니다. 이는 왕의 식탁에서 지속적으로 먹게 하는 것, 곧 왕실의 부양과 호의를 가리키는 관용 표현입니다.
    reason: cultural_note
  - marker: c
    text: ‘호의를 베푸십시오’에 해당하는 히브리어 표현은 충성스럽고 지속적인 친절을 행하라는 뜻도 포함할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 1인칭 동사 접미사에 맞추어 ‘내가 … 도망할 때’로 바로잡고, 압살롬이 솔로몬의 형제라는 호칭을 자연스러운 한국어 어순으로 옮겼습니다. כֵן의 연결을 ‘그렇게’로 남겨 바르실래 측의 접근·지원과 솔로몬이 베풀 호의의 대응 관계를 보존했습니다. 이름 표기, 현대적 문체, 그리고 각주 앵커도 정비했습니다.
