  rationale: 히브리어 동사들의 연속을 자연스러운 서술로 옮기되, '불러오게 하고'로 소환의 목적을 분명히 살렸습니다.
- source_word: הִשְׁבַּעְתִּיךָ בַיהוָה
  english_pob_choice: make you swear by Yahweh
  chosen_korean: 야훼로 너에게 맹세하게 하고
  alternatives_korean:
  - 야훼로 너에게 맹세시키고
  - 야훼 앞에서 너에게 맹세하게 하고
  lexicon: HALOT
  rationale: 히필 שבע의 강제·사역 의미를 살려 '맹세하게 하다'로 옮겼고, 본문과 프로젝트 관례에 따라 신명은 '야훼'로 번역했습니다.
- source_word: וָאָעִד בְּךָ
  english_pob_choice: warn you
  chosen_korean: 너에게 경고하며
  alternatives_korean:
  - 너에게 증언하며
  - 너에게 엄중히 경고하며
  lexicon: HALOT
  rationale: עוד의 법정적 뉘앙스가 있으나 문맥상 왕의 엄중한 경고를 가리키므로, 현대 한국어에서 자연스러운 '경고하다'를 택했습니다.
- source_word: אָנֶה וָאָנָה
  english_pob_choice: anywhere at all
  chosen_korean: 어디로든
  alternatives_korean:
