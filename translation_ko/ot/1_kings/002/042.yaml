base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/042.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Did I not make you swear by Yahweh and warn you, saying, ‘On the day you go out and go anywhere at all, know for certain that you shall surely die’? And you said to me, ‘The word is good[c][b]; I have heard.’”
  footnotes:
  - marker: a
    text: Or, “testify against you” or “solemnly charge you” for “warn you.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, “go here or there,” an idiom meaning “go anywhere at all.”
    reason: lexical_alternative
  - marker: c
    text: Or, “The matter is good.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 사람을 보내 시므이를 불러오게 하고 그에게 말했습니다. "내가 야훼로 너에게 맹세하게 하고, 또 너에게 경고하며 말하지 않았느냐? '네가 나가는 날에 어디로든 가면, 너는 반드시 죽을 줄을 분명히 알아라.' 그런데 너는 내게 '그 말이 좋습니다. 내가 들었습니다.'라고 말했습니다."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 경고·증언·엄중한 당부를 모두 포괄할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로는 “이리저리/여기저기”라는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그 일이 좋습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ וַיִּקְרָא לְשִׁמְעִי
  english_pob_choice: Then the king sent and called for Shimei
  chosen_korean: 그러자 왕이 사람을 보내 시므이를 불러오게 하고
  alternatives_korean:
  - 그때 왕이 시므이를 부르도록 사람을 보내고
  - 왕이 시므이를 부르러 사람을 보내고
  lexicon: HALOT
  rationale: 히브리어 동사들의 연속을 자연스러운 서술로 옮기되, '불러오게 하고'로 소환의 목적을 분명히 살렸습니다.
- source_word: הִשְׁבַּעְתִּיךָ בַיהוָה
  english_pob_choice: make you swear by Yahweh
  chosen_korean: 야훼로 너에게 맹세하게 하고
  alternatives_korean:
  - 야훼로 너에게 맹세시키고
  - 야훼 앞에서 너에게 맹세하게 하고
  lexicon: HALOT
  rationale: 히필 שבע의 강제·사역 의미를 살려 '맹세하게 하다'로 옮겼고, 본문과 프로젝트 관례에 따라 신명은 '야훼'로 번역했습니다.
- source_word: וָאָעִד בְּךָ
  english_pob_choice: warn you
  chosen_korean: 너에게 경고하며
  alternatives_korean:
  - 너에게 증언하며
  - 너에게 엄중히 경고하며
  lexicon: HALOT
  rationale: עוד의 법정적 뉘앙스가 있으나 문맥상 왕의 엄중한 경고를 가리키므로, 현대 한국어에서 자연스러운 '경고하다'를 택했습니다.
- source_word: אָנֶה וָאָנָה
  english_pob_choice: anywhere at all
  chosen_korean: 어디로든
  alternatives_korean:
  - 이리저리
  - 여기저기
  lexicon: HALOT
  rationale: 관용적으로 '여기나 저기'라는 의미의 방향 불특정을 나타내므로, 의미 범위를 간결하게 드러내는 '어디로든'으로 옮겼습니다.
- source_word: מוֹת תָּמוּת
  english_pob_choice: you shall surely die
  chosen_korean: 반드시 죽을 줄을 분명히 알아라
  alternatives_korean:
  - 반드시 죽을 것이다
  - 죽고 말 것이다
  lexicon: HALOT
  rationale: 중첩형으로 강조된 죽음의 확실성을 한국어의 경고문체로 재현했습니다.
- source_word: טוֹב הַדָּבָר
  english_pob_choice: The word is good / The matter is good
  chosen_korean: 그 말이 좋습니다
  alternatives_korean:
  - 그 일이 좋습니다
  - 그 말씀입니다
  lexicon: HALOT
  rationale: 대답으로서의 דבר를 문장·말의 의미로 읽어, 응답의 자연스러운 현대 한국어인 '그 말이 좋습니다'로 번역했습니다.
theological_decisions:
- issue: יהוה(YHWH)의 번역
  chosen_reading: 본문의 언약적 신명은 '야훼'로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 직접 신명 יְהוָה가 나오므로 프로젝트 기본값에 따라 '야훼'를 사용해 고유한 언약명을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
