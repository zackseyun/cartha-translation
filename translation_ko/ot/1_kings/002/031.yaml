  rationale: 각주 표지를 각각 ‘쳐 죽이고’와 ‘죄 없는 피’에 재배치하여 모든 앵커 불일치를 해소했습니다. פגע בו에 대한 각주를 원어 용례에 맞게 수정했고, ‘무죄한 피’와 ‘치워 버리십시오’를 현대적이고 자연스러운 ‘죄 없는 피’와 ‘없애십시오’로 다듬었습니다. 원문의 명령 구조와 피 흘림의 책임이 왕과 왕가에서 제거된다는 의미는 보존했습니다.
