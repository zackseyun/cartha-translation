source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר ל֣/וֹ הַ/מֶּ֗לֶךְ עֲשֵׂה֙ כַּ/אֲשֶׁ֣ר דִּבֶּ֔ר וּ/פְגַע בּ֖/וֹ וּ/קְבַרְתּ֑/וֹ וַ/הֲסִירֹ֣תָ דְּמֵ֣י חִנָּ֗ם אֲשֶׁר֙ שָׁפַ֣ךְ יוֹאָ֔ב מֵ/עָלַ֕/י וּ/מֵ/עַ֖ל בֵּ֥ית אָבִֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/031.yaml
  text: Then the king said to him[a], “Do as he has said, and strike him down and bury him[b], and remove from me and from my father’s house the innocent blood that Joab shed.”
  footnotes:
  - marker: a
    text: Or “kill him”; the Hebrew idiom literally means “fall upon him” and in this context refers to executing him.
    reason: lexical_alternative
  - marker: b
    text: “Innocent blood” is a Hebrew legal-moral expression for bloodshed committed without just cause, carrying the sense of bloodguilt.
    reason: cultural_note
translation:
  language: ko
  text: 그때 왕이 그에게 말했습니다[a]. 「그가 말한 대로 하십시오. 그리고 그를 쳐 죽이고 묻으십시오[b]. 그렇게 하여 요압이 흘린 무죄한 피를 내게서와 내 아버지의 집에서 치워 버리십시오」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그 위로 떨어지다”에 가깝지만, 여기서는 처형을 뜻하는 관용입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘무죄한 피’는 정당한 이유 없이 흘린 피를 가리키는 히브리어 법-도덕 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  english_pob_choice: Then the king said to him
  chosen_korean: 그때 왕이 그에게 말했습니다
  alternatives_korean:
  - 그때 왕이 그에게 이르렀습니다
  - 왕이 그에게 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리면서도 직접화법 도입을 분명히 했습니다.
- source_word: עֲשֵׂה כַּאֲשֶׁר דִּבֶּר
  english_pob_choice: Do as he has said
  chosen_korean: 그가 말한 대로 하십시오
  alternatives_korean:
  - 그가 말한 대로 하십시오
  - 그가 말한 것처럼 하십시오
  lexicon: HALOT
  rationale: 명령형 עשה를 한국어 명령으로 살리고, כַּאֲשֶׁר דִּבֶּר를 직역보다 자연스러운 ‘말한 대로’로 옮겼습니다.
- source_word: וּפְגַע בּוֹ
  english_pob_choice: strike him down
  chosen_korean: 그를 쳐 죽이고
  alternatives_korean:
  - 그를 공격하고
  - 그를 덮쳐
  lexicon: HALOT
  rationale: פגע + ב는 이 문맥에서 처형을 뜻하는 관용으로 이해되므로, 살해 의미를 분명히 하되 과도한 의역은 피했습니다.
- source_word: וּקְבַרְתּוֹ
  english_pob_choice: and bury him
  chosen_korean: 묻으십시오
  alternatives_korean:
  - 장사하십시오
  - 매장하십시오
  lexicon: HALOT
  rationale: 한국어 성경 문맥에서 ‘묻다’가 가장 सीधे하고 자연스러우며, 앞의 동사들과 병렬을 유지합니다.
- source_word: דְּמֵי חִנָּם
  english_pob_choice: the innocent blood
  chosen_korean: 무죄한 피
  alternatives_korean:
  - 억울한 피
  - 무고한 피
  lexicon: HALOT
  rationale: 히브리어 법-도덕적 표현인 ‘blood of innocence’를 한국어로는 ‘무죄한 피’가 가장 직접적으로 드러냅니다.
- source_word: מֵעָלַי וּמֵעַל בֵּית אָבִי
  english_pob_choice: from me and from my father’s house
  chosen_korean: 내게서와 내 아버지의 집에서
  alternatives_korean:
  - 내 위에서와 내 아버지의 집 위에서
  - 나와 내 아버지의 집에서
  lexicon: HALOT
  rationale: עַל 위의 짐처럼 놓인 책임/피의 부담을 한국어의 ‘~에서 치우다’로 풀어, 혈채가 제거된다는 뜻을 살렸습니다.
theological_decisions:
- issue: 공동체적 혈채의 제거
  chosen_reading: ‘무죄한 피’를 솔로몬 개인과 ‘내 아버지의 집’에서 치우는 것으로 옮겨, 요압의 부당한 살육에 대한 책임이 왕가 전체에 걸쳐 있다고 보는 문맥을 유지했습니다.
  alternative_readings:
  - 추상적으로 ‘피값’을 제거한다고 옮길 수 있음
  - ‘혈채’를 직접 음역할 수 있음
  rationale: 본문은 추상 용어보다 ‘무죄한 피’라는 구체적 법적-도덕 표현을 사용하므로, 그 긴장을 그대로 유지하는 편이 원문에 충실합니다.
  doctrine_reference: 구약의 혈죄/혈채 개념을 보존하고 후대 교리화로 환원하지 않음
