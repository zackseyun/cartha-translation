    rationale: 이 문맥에서 פגע ב는 그에게 덤비다/공격하다, 곧 처형하다는 뜻으로 기능합니다. 제시된 설명은 영어 감사 기록의 관용 설명을 그대로 따르려 한 것으로 보이나, 한국어 각주에서는 원어에 대해 오해를 낳을 수 있습니다.
