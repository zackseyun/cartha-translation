source:
  edition: WLC
  text: וְ/עַתָּ֗ה חַי יְהוָה֙ אֲשֶׁ֣ר הֱכִינַ֗/נִי ו/יושיבי/ני עַל כִּסֵּא֙ דָּוִ֣ד אָבִ֔/י וַ/אֲשֶׁ֧ר עָֽשָׂה לִ֛/י בַּ֖יִת כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר כִּ֣י הַ/יּ֔וֹם יוּמַ֖ת אֲדֹנִיָּֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/024.yaml
  text: And now[a], as Yahweh lives, who has established me and seated me on the throne of David my father, and who has made for me a house as he promised, surely Adonijah shall be put to death today.
  footnotes:
  - marker: a
    text: Or 'has established a dynasty for me.' The Hebrew 'house' here likely carries the royal sense of a lasting family line, not merely a physical building.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 나를 굳게 세우시고 제 아버지 다윗의 왕좌에 앉히시며, 말씀하신 대로 나에게 집[a]을 세워 주신 야훼께서 살아 계심을 두고 맹세합니다. 오늘 아도니야는 반드시 죽임을 당할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘집’은 여기서 물리적인 건물보다 왕조나 가문을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  english_pob_choice: as Yahweh lives
  chosen_korean: 야훼께서 살아 계심을 두고 맹세합니다
  alternatives_korean:
  - 야훼께서 살아 계십니다
  - 야훼의 생명으로 맹세합니다
  lexicon: HALOT
  rationale: 히브리어의 전형적인 서원 공식으로, 단순 진술보다 맹세의 기능이 핵심이어서 한국어에서도 ‘~을 두고 맹세합니다’로 옮겨 그 힘을 살렸습니다.
- source_word: הֱכִינַנִי
  english_pob_choice: has established me
  chosen_korean: 제게 힘을 주시고
  alternatives_korean:
  - 저를 세우시고
  - 저를 확립하셨고
  lexicon: HALOT
  rationale: 직역상 ‘세우다/확립하다’가 가능하지만, 문맥의 왕권 확립을 한국어에서 자연스럽게 드러내기 위해 ‘힘을 주시고’로 옮겼습니다. 다만 본문의 ‘세우다’는 다음 구절에서 왕좌에 앉히는 표현으로 보존됩니다.
- source_word: וַיּוֹשִׁיבֵנִי עַל כִּסֵּא
  english_pob_choice: and seated me on the throne
  chosen_korean: 다윗 제 아버지의 왕좌에 앉히셨으며
  alternatives_korean:
  - 다윗 제 아버지의 왕좌에 앉게 하셨으며
  - 다윗 제 아버지의 보좌에 앉히셨으며
  lexicon: HALOT
  rationale: 사역적 의미를 살려 ‘앉히셨으며’로 옮겼고, ‘왕좌’는 왕위 계승의 정치적 맥락을 분명하게 드러냅니다.
- source_word: עָשָׂה לִי בַּיִת
  english_pob_choice: has made for me a house
  chosen_korean: 제게 집을 세워 주셨습니다
  alternatives_korean:
  - 제게 집을 만들어 주셨습니다
  - 제게 한 집안을 세워 주셨습니다
  - 제게 왕실을 세워 주셨습니다
  lexicon: HALOT
  rationale: ‘집’은 왕조/가문을 뜻할 수 있지만, 본문이 실제로 쓰는 어휘를 보존하기 위해 기본어를 유지했습니다. 한국어에서는 ‘세워 주셨습니다’로 왕조 설립의 의미를 자연스럽게 암시합니다.
- source_word: כַּאֲשֶׁר דִּבֵּר
  english_pob_choice: as he promised
  chosen_korean: 말씀하신 대로
  alternatives_korean:
  - 약속하신 대로
  - 말한 대로
  lexicon: HALOT
  rationale: ‘말하다’의 문맥상 의미가 하나님의 신실한 약속이므로, 직역보다 약속의 성격을 드러내는 한국어 관용구를 택했습니다.
- source_word: יוּמַת
  english_pob_choice: shall be put to death
  chosen_korean: 반드시 죽습니다
  alternatives_korean:
  - 사형당합니다
  - 죽임을 당합니다
  lexicon: HALOT
  rationale: 히브리어는 사역-수동의 처형 선고이지만, 한국어에서는 왕의 단호한 선포를 살리는 쪽이 자연스러워 ‘반드시 죽습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘house’의 왕조적 의미를 얼마나 드러낼 것인가
  chosen_reading: 본문의 ‘집’은 유지하되, 한국어 동사 선택으로 왕조/가문 설립의 뉘앙스를 간접적으로 살렸습니다.
  alternative_readings:
  - ‘왕조’로 직접 번역
  - ‘왕실’로 번역
  rationale: 히브리어 בַּיִת은 다윗 언약 문맥에서 왕조를 뜻할 수 있지만, 소스 텍스트가 실제로는 ‘집’을 사용하므로 본문에서는 과도한 해석을 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
