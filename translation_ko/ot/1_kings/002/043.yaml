base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/043.yaml
  text: Why then have you not kept the oath of Yahweh and the command that I commanded you?[a][b]
  footnotes:
  - marker: a
    text: Or, 'the oath to the LORD'—that is, the oath made in the LORD's name or under his authority.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the command that I commanded you.' The Hebrew literally says 'the command that I commanded upon you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 어찌하여 야훼의 맹세와 내가 그대에게 내린 명령을 지키지 않았습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께 한 맹세’ — 곧 야훼의 이름으로, 또는 그의 권위 아래에서 한 맹세일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 그대에게 명령한 명령’입니다. 히브리어는 문자적으로 ‘내가 그대에게 부과한 명령’이라고 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדּוּעַ
  english_pob_choice: Why then
  chosen_korean: 그러면 어찌하여
  alternatives_korean:
  - 그런데 왜
  - 어찌하여
  lexicon: HALOT
  rationale: 질문 앞의 접속 성분을 한국어에서 자연스럽게 연결하기 위해 ‘그러면’으로 옮기고, 이유를 묻는 말은 격식을 살려 ‘어찌하여’로 렌더링했습니다.
- source_word: שָׁמַרְתָּ
  english_pob_choice: have you not kept
  chosen_korean: 지키지 않았습니까
  alternatives_korean:
  - 지켜 두지 않았습니까
  - 준수하지 않았습니까
  lexicon: HALOT
  rationale: שׁמר의 기본 의미인 ‘지키다/준수하다’를 살리되, 맹세와 명령 둘 다에 자연스럽게 걸리는 현대 한국어로 ‘지키다’를 택했습니다.
- source_word: שְׁבֻעַת יְהוָה
  english_pob_choice: the oath of Yahweh
  chosen_korean: 야훼의 맹세
  alternatives_korean:
  - 야훼의 서약
  - 야훼께 한 맹세
  lexicon: HALOT
  rationale: 문맥상 야훼 자신이 하신 맹세가 아니라 야훼 이름 아래에서 행해진 맹세를 가리키므로, 자연스러운 소유격 구조로 ‘야훼의 맹세’라고 옮겼습니다.
- source_word: הַמִּצְוָה אֲשֶׁר צִוִּיתִי עָלֶיךָ
  english_pob_choice: the command that I commanded you
  chosen_korean: 내가 당신에게 명령한 명령
  alternatives_korean:
  - 내가 당신에게 내린 명령
  - 내가 당신 위에 명령한 명령
  lexicon: HALOT
  rationale: 반복 구조를 가능한 한 드러내기 위해 ‘명령한 명령’으로 옮겼고, עָלֶיךָ의 ‘위에/위에 두다’라는 뉘앙스는 한국어 문장 흐름상 ‘당신에게’로 완화하지 않고 직역을 과도하게 만들지 않는 범위에서 유지했습니다.
theological_decisions:
