translation:
  language: ko
  text: 밧세바가 말했습니다. 「좋습니다. 제가 왕께 당신을 위해 말씀드리겠습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דבר + על은 ‘~에 관하여’도 뜻하지만, 이 문맥에서는 ‘당신을 위해/대신하여’라는 중재적 의미가 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת שֶׁבַע
  english_pob_choice: Bathsheba
  chosen_korean: 밧세바
  alternatives_korean:
