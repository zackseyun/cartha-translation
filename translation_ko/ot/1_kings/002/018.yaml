- source_word: אֲדַבֵּר עָלֶיךָ
  english_pob_choice: I will speak for you
  chosen_korean: 제가 ... 당신을 위해 말씀드리겠습니다
  alternatives_korean:
  - 제가 ... 당신에 대해 말씀드리겠습니다
  - 제가 ... 당신을 대신하여 말씀드리겠습니다
  - 제가 ... 당신을 위해 말씀드리겠습니다
  lexicon: HALOT
  rationale: דבר + על의 ‘~에 대해/~을 위해’ 범위를 문맥상 왕 앞 중재 발언으로 이해해, 한국어에서는 ‘당신을 위해’로 자연스럽게 옮겼습니다.
