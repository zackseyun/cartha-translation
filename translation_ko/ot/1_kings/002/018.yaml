  - 왕께
  lexicon: HALOT
  rationale: 대화 속 공손한 목적어 표지로 ‘왕께’를 사용해, 왕실 궁정 맥락의 존칭을 살렸습니다.
theological_decisions:
- issue: 중재 발언의 방향성
  chosen_reading: 밧세바가 아도니야를 위해 왕에게 말해 주겠다고 응답하는 뜻으로 옮겼습니다.
  alternative_readings:
  - ‘당신에 관해 말씀드리겠습니다’로 더 중립적으로 옮길 수 있습니다.
  - ‘당신을 대신하여’라고 더 강하게 중재성을 드러낼 수 있습니다.
  rationale: 히브리어 על + דבר는 문맥에 따라 ‘대하여’ 또는 ‘위하여/대신하여’로 열려 있지만, 앞뒤 정황상 왕 앞에서의 청원적 중재를 가리키므로 그 기능을 드러내는 번역이 적절합니다.
  doctrine_reference: 서사 문맥에 따른 의미 범위 판단
