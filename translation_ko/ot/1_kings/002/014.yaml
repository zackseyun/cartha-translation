  footnotes:
  - marker: a
    text: 히브리어 관용구를 직역하면 ‘내게 당신에게 할 말/일이 있다’에 가깝지만, 뜻은 ‘당신에게 할 말이 있습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then he said
  chosen_korean: 그러자 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그러고는 그가 말했습니다
  lexicon: WLC; HALOT
  rationale: 서사적 wayyiqtol의 순차 진행을 살리면서도 한국어에서는 자연스러운 연결어인 ‘그러자’로 옮겼습니다.
- source_word: דָּבָר לִי אֵלַיִךְ
  english_pob_choice: I have something to say to you
  chosen_korean: 내가 당신에게 할 말이 있습니다
  alternatives_korean:
  - 내게 당신에게 말할 것이 있습니다
  - 내가 당신에게 전할 말이 있습니다
  lexicon: HALOT
  rationale: 직역의 ‘말/일’ 구문보다 한국어 관용에 맞는 ‘할 말이 있습니다’가 히브리어 관용구의 의미를 가장 자연스럽게 드러냅니다.
- source_word: וַתֹּאמֶר
  english_pob_choice: And she said
  chosen_korean: 그러자 그녀가 말했습니다
  alternatives_korean:
  - 그리고 그녀가 말했습니다
  - 그때 그녀가 말했습니다
  lexicon: WLC; HALOT
  rationale: 앞 절과 같은 서사적 진행을 일관되게 반영하되, 대화 응답의 흐름을 분명히 했습니다.
- source_word: דַּבֵּר
  english_pob_choice: Speak
  chosen_korean: 말씀하십시오
  alternatives_korean:
  - 말하세요
  - 말해 보십시오
  lexicon: HALOT
  rationale: 상대에게 말을 청하는 단순 명령형을 한국어에서 공손한 직접화법으로 옮겼습니다. 대화 상대가 왕자/상급자 상황일 수 있는 문맥을 고려해 합쇼체를 택했습니다.
theological_decisions:
- issue: 직접화법의 공손도
  chosen_reading: 여성의 응답을 ‘말씀하십시오’로 공손하게 처리했습니다.
  alternative_readings:
  - 말하세요
  - 말해 보십시오
  rationale: 히브리어 imperative 자체는 공손도 표시가 없지만, 한국어의 자연스러운 대화 예절을 반영해 의미를 과장하지 않는 범위에서 공손한 형태를 사용했습니다.
  doctrine_reference: Korean style and discourse register
