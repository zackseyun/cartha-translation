base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/026.yaml
  text: And to Abiathar the priest the king said[a], “Go to Anathoth, to your field, for you are a man deserving death; but on this day I will not put you to death, because you carried the ark of the Lord GOD before David my father, and because you shared in all the affliction with which my father was afflicted.”
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''a man of death,'' that is, one deserving death or liable to execution.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아비아달 제사장에게 왕이 말했습니다. “아나돗에 있는 당신의 밭으로 가십시오. 당신은 죽어 마땅한 사람[a]입니다. 그러나 오늘은 내가 당신을 죽이지 않겠습니다. 당신이 내 아버지 다윗 앞에서 주 야훼의 궤를 메었고, 또 내 아버지가 겪은 모든 고난을 당신도 함께 겪었기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘죽음의 사람’은 죽어 마땅한 사람, 곧 사형을 받을 만한 사람을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָתֹת
  english_pob_choice: Anathoth
  chosen_korean: 아나돗
  alternatives_korean:
  - 아낫돗
  - 아나돗 지방
  lexicon: HALOT
  rationale: 고유 지명은 음역하는 것이 원문의 지리적 구체성을 가장 잘 보존합니다.
- source_word: עַל שָׂדֶיךָ
  english_pob_choice: to your field
  chosen_korean: 네 밭으로
  alternatives_korean:
  - 네 땅으로
  - 네 토지로
  - 네 영지로
  lexicon: HALOT
  rationale: 문맥상 아비아달을 아나돗의 자기 소유지로 돌려보내는 뜻이므로, 보다 구체적인 "밭"이 원문의 ملم한 소유지 감각을 살립니다.
- source_word: אִישׁ מָוֶת
  english_pob_choice: a man deserving death
  chosen_korean: 죽어 마땅한 사람
  alternatives_korean:
  - 사형에 해당하는 사람
  - 죽음의 사람
  - 죽을 사람
  lexicon: HALOT
  rationale: 히브리어 관용구의 법정적 의미를 살리되, 한국어에서는 자연스럽고 의미가 분명한 표현으로 옮겼습니다.
- source_word: נָשָׂאתָ אֶת אֲרוֹן אֲדֹנָי יְהוִה
  english_pob_choice: you carried the ark of the Lord GOD
  chosen_korean: 주 야훼의 궤를 메었고
  alternatives_korean:
  - 주 야훼의 궤를 들었고
  - 주 하나님 야훼의 궤를 메었고
  - 주 여호와의 궤를 메었고
  lexicon: HALOT
  rationale: אֲרוֹן은 언약궤를 가리키며, נשא는 실제로 "메다/지다"의 의미가 자연스럽습니다. יְהוִה는 프로젝트 기본 원칙에 따라 "야훼"로 옮겼고, 앞의 אֲדֹנָי와 함께 "주 야훼"로 처리했습니다.
- source_word: הִתְעַנִּיתָ ... הִתְעַנָּה
  english_pob_choice: you shared in all the affliction with which my father was afflicted
  chosen_korean: 내 아버지가 겪은 모든 고난을 너도 함께 겪었기 때문이다
  alternatives_korean:
  - 내 아버지가 겪은 모든 고난에 너도 동참했기 때문이다
  - 내 아버지가 받은 모든 고난을 네가 함께 받았기 때문이다
  - 내 아버지가 겪은 모든 괴로움을 너도 겪었기 때문이다
  lexicon: HALOT
  rationale: 반복되는 히트파엘의 어근을 한국어에서도 "겪다/함께 겪다"로 살려, 아비아달과 다윗의 고난의 연대를 드러냈습니다.
theological_decisions:
- issue: אֲדֹנָי יְהוִה의 합성 호칭 처리
  chosen_reading: '"주 야훼"로 옮겨 두 칭호가 함께 보이도록 했습니다.'
  alternative_readings:
  - '"주 하나님"'
  - '"주 여호와"'
  - '"주 야훼 하나님"'
  rationale: 본문은 주권 칭호 אֲדֹנָי와 언약명 יְהוִה를 함께 사용하므로, 둘을 합쳐도 하나로 평준화하지 않고 구분이 보이도록 번역했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה → 야훼; אֲדֹנָי + יְהוִה 합성 호칭'
