  - 네 토지로
  - 네 영지로
  lexicon: HALOT
  rationale: 문맥상 아비아달을 아나돗의 자기 소유지로 돌려보내는 뜻이므로, 보다 구체적인 "밭"이 원문의 ملم한 소유지 감각을 살립니다.
- source_word: אִישׁ מָוֶת
  english_pob_choice: a man deserving death
  chosen_korean: 죽어 마땅한 사람
  alternatives_korean:
  - 사형에 해당하는 사람
  - 죽음의 사람
  - 죽을 사람
  lexicon: HALOT
  rationale: 히브리어 관용구의 법정적 의미를 살리되, 한국어에서는 자연스럽고 의미가 분명한 표현으로 옮겼습니다.
- source_word: נָשָׂאתָ אֶת אֲרוֹן אֲדֹנָי יְהוִה
  english_pob_choice: you carried the ark of the Lord GOD
  chosen_korean: 주 야훼의 궤를 메었고
  alternatives_korean:
  - 주 야훼의 궤를 들었고
  - 주 하나님 야훼의 궤를 메었고
  - 주 여호와의 궤를 메었고
  lexicon: HALOT
  rationale: אֲרוֹן은 언약궤를 가리키며, נשא는 실제로 "메다/지다"의 의미가 자연스럽습니다. יְהוִה는 프로젝트 기본 원칙에 따라 "야훼"로 옮겼고, 앞의 אֲדֹנָי와 함께 "주 야훼"로 처리했습니다.
- source_word: הִתְעַנִּיתָ ... הִתְעַנָּה
  english_pob_choice: you shared in all the affliction with which my father was afflicted
  chosen_korean: 내 아버지가 겪은 모든 고난을 너도 함께 겪었기 때문이다
  alternatives_korean:
  - 내 아버지가 겪은 모든 고난에 너도 동참했기 때문이다
  - 내 아버지가 받은 모든 고난을 네가 함께 받았기 때문이다
  - 내 아버지가 겪은 모든 괴로움을 너도 겪었기 때문이다
  lexicon: HALOT
  rationale: 반복되는 히트파엘의 어근을 한국어에서도 "겪다/함께 겪다"로 살려, 아비아달과 다윗의 고난의 연대를 드러냈습니다.
theological_decisions:
