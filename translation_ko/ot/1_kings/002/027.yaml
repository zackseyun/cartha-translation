  source_fidelity: 핵심 의미는 잘 보존합니다. 다만 בְּשִׁלֹה는 영어 POB의 독해에 따라 ‘엘리의 집’을 수식하도록 옮기는 편이 더 적절합니다. 현 번역의 ‘실로에서 … 말씀하신’은 야훼께서 말씀하신 장소를 특정하는 독해가 됩니다.
  naturalness: ‘야훼께서 실로에서 엘리의 집에 관해 말씀하신 야훼의 말씀’은 ‘야훼’가 가까이 반복되고 수식 관계가 다소 무겁습니다. ‘실로에 있는 엘리의 집에 관하여 말씀하신 말씀’으로 정리하면 현대 표준 한국어로 자연스럽습니다.
  terminology: ‘야훼’, ‘제사장’, ‘말씀’, ‘엘리의 집’은 일관되고 적절합니다. ‘야훼의 제사장 자리’는 직분으로부터의 축출을 자연스럽게 나타내며, 히브리어의 강한 추방 동사도 보존합니다.
