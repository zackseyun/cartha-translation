revisions:
- from: 솔로몬은 아비아달을 야훼의 제사장 직분에서 쫓아내어, 야훼께서 실로에서 엘리의 집에 관해 말씀하신 야훼의 말씀을 이루었습니다.[a][b]
  to: 솔로몬은 아비아달을 야훼의 제사장 자리에서 쫓아내어, 야훼께서 실로에 있는 엘리의 집에 관하여 말씀하신 말씀을 이루었습니다.[a][b]
  rationale: 수정은 실로의 수식 범위를 영어 POB 감사 기록의 독해와 맞추고, 한국어 문장의 자연스러움을 높입니다. ‘쫓아내어’는 גרשׁ의 강한 축출 의미를, ‘제사장 자리에서’는 מִהְיוֹת כֹּהֵן의 직분 상실을 보존합니다. ‘이루었습니다’는 לְמַלֵּא의 목적·결과 가능성을 본문에서 과도하게 한쪽으로 단정하지 않으며, 각주 a가 그 대안을 명시합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:44:59Z'
