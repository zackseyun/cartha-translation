reference: 1 Kings 2:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְגָ֤רֶשׁ שְׁלֹמֹה֙ אֶת אֶבְיָתָ֔ר מִ/הְי֥וֹת כֹּהֵ֖ן לַֽ/יהוָ֑ה לְ/מַלֵּא֙ אֶת דְּבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֛ר עַל בֵּ֥ית עֵלִ֖י בְּ/שִׁלֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/027.yaml
  text: So Solomon drove Abiathar out from being priest to Yahweh[b][a], fulfilling the word of Yahweh that he had spoken concerning the house of Eli in Shiloh.
  footnotes:
  - marker: a
    text: Or 'in order to fulfill the word of the LORD.' The Hebrew may express purpose or result.
    reason: alternative_reading
  - marker: b
    text: See 1 Samuel 2:27–36 and 3:11–14 regarding the word spoken against the house of Eli.
    reason: cross_reference
translation:
  language: ko
  text: 솔로몬은 아비아달을 야훼의 제사장 자리에서 쫓아내어, 야훼께서 실로에 있는 엘리의 집에 관하여 말씀하신 말씀을 이루었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 말씀을 이루기 위하여.’ 히브리어는 목적이나 결과를 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 사무엘상 2:27–36과 3:11–14를 보십시오. 이는 엘리의 집에 대하여 하신 말씀을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  english_pob_choice: drove ... out
  chosen_korean: 쫓아내어
  alternatives_korean:
  - 내쫓아
  - 내보내어
  - 축출하여
  lexicon: HALOT
  rationale: גרשׁ는 단순한 해임보다 강한 추방·축출의 뉘앙스가 있어, 한국어에서는 '쫓아내어'가 그 강도를 자연스럽게 살립니다.
- source_word: מִהְיוֹת כֹּהֵן
  english_pob_choice: from being priest
  chosen_korean: 제사장 직분에서
  alternatives_korean:
  - 제사장으로 있지 못하게
  - 제사장으로 섬기지 못하게
  - 제사장 신분에서
  lexicon: HALOT
  rationale: 미ן+부정사 구조는 어떤 상태에서의 제거를 나타내므로, '직분에서'라고 옮기면 역할 상실을 한국어로 분명하게 드러낼 수 있습니다.
- source_word: כֹּהֵן לַיהוָה
  english_pob_choice: priest to Yahweh
  chosen_korean: 야훼의 제사장
  alternatives_korean:
  - 야훼께 바치는 제사장
  - 야훼를 섬기는 제사장
  - 야훼의 제사장으로
  lexicon: HALOT
  rationale: לְ는 소속보다 지향·봉사를 나타낼 수 있으므로, 한국어에서는 문맥상 가장 자연스럽고 관용적인 '야훼의 제사장'으로 옮기되, 인격명 야훼를 유지했습니다.
- source_word: לְמַלֵּא אֶת דְּבַר יְהוָה
  english_pob_choice: fulfilling the word of Yahweh
  chosen_korean: 야훼의 말씀을 이루었습니다
  alternatives_korean:
  - 야훼의 말씀을 성취하였습니다
  - 야훼의 말씀을 완수하였습니다
  - 야훼의 말씀을 채웠습니다
  lexicon: HALOT
  rationale: לְמַלֵּא는 목적과 결과를 아우를 수 있어, 서술적으로는 '이루다/성취하다'가 자연스럽습니다. '이루었습니다'는 예언 성취의 연결을 분명히 하면서도 과도하게 해석하지 않습니다.
- source_word: בְּשִׁלֹה
  english_pob_choice: in Shiloh
  chosen_korean: 실로에서
  alternatives_korean:
  - 실로에
  - 실로 안에서
  lexicon: HALOT
  rationale: 지명 앞의 ב는 장소를 가리키므로 한국어에서는 '실로에서'가 가장 자연스럽습니다.
theological_decisions:
- issue: די브ר יהוה의 성취가 솔로몬의 행위와 어떻게 연결되는지
  chosen_reading: 본문은 솔로몬의 아비아달 축출을 야훼께서 이미 하신 말씀의 성취로 제시합니다.
  alternative_readings:
  - 목적('이루려고')으로 읽을 수도 있습니다.
  - 단순한 결과 진술로만 읽을 수도 있습니다.
  rationale: 히브리어 לְמַלֵּא는 목적과 결과를 모두 가질 수 있으므로, 한국어 본문은 '이루었습니다'로 두어 서술의 핵심인 성취 관계를 살리되, 목적성까지 단정하지는 않았습니다.
  doctrine_reference: '번역 철학 §3: 성경 본문의 신학적 긴장을 해소하지 말고 유지할 것'
