base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/008.yaml
  text: And behold[a], with you is Shimei son of Gera, the Benjaminite from Bahurim, and he cursed me with a grievous curse on the day I went to Mahanaim. But he came down to meet me at the Jordan, and I swore to him by Yahweh, saying, ‘I will not put you to death with the sword.’
  footnotes:
  - marker: a
    text: Hebrew literally, 'if I put you to death with the sword,' an elliptical oath formula meaning 'I will not put you to death with the sword.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 당신 곁에는 바후림 출신 베냐민 사람 게라의 아들 시므이가 있습니다. 그는 내가 마하나임으로 가던 날 나를 심하게 저주했습니다. 그러나 그는 요르단에서 나를 만나려고 내려왔고, 나는 야훼를 두고 그에게 맹세하여 말했습니다. ‘내가 칼로 그대를 죽이지 않겠습니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내가 칼로 그대를 죽인다면’이라고 합니다. 그러나 이는 생략된 저주를 전제하는 맹세 공식으로서, 여기서는 ‘죽이지 않겠다’는 부정 맹세를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold / And look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  - 잘 보십시오
  lexicon: HALOT
  rationale: 주의를 환기하는 지시 표현으로, 문맥상 왕의 진술에서 자연스럽고 현대적인 합쇼체 호소어를 택했습니다.
- source_word: עִמְּךָ
  english_pob_choice: with you
  chosen_korean: 당신과 함께 있는
  alternatives_korean:
  - 당신 곁에 있는
  - 당신 편에 있는
  - 당신에게 속한
  lexicon: HALOT
  rationale: 단순한 위치 표시를 넘어 솔로몬의 영역 안에 현재 함께 있는 인물을 가리키므로, 한국어에서는 자연스럽게 풀어 썼습니다.
- source_word: שִׁמְעִי בֶן גֵּרָא בֶן הַיְמִינִי מִבַּחֻרִים
  english_pob_choice: Shimei son of Gera, the Benjaminite from Bahurim
  chosen_korean: 바후림 출신의 베냐민 사람 게라의 아들 시므이
  alternatives_korean:
  - 바후림 사람이며 베냐민 지파인 게라의 아들 시므이
  - 바후림 출신 베냐민 사람 게라의 아들 시므이
  lexicon: HALOT
  rationale: 인명은 음역하고, הַיְמִינִי는 ‘베냐민 사람’으로 옮겨 지파/출신을 분명히 했습니다.
- source_word: קִלְלַנִי קְלָלָה נִמְרֶצֶת
  english_pob_choice: cursed me with a grievous curse
  chosen_korean: 나를 모욕하는 심한 저주를 퍼부었습니다
  alternatives_korean:
  - 나를 심하게 저주했습니다
  - 나에게 맹렬한 저주를 퍼부었습니다
  - 나를 맹렬히 저주했습니다
  lexicon: HALOT
  rationale: 히브리어의 중첩 구조를 한국어에서 자연스럽게 살리되, 다윗에게 가해진 공개적 모욕과 저주의 강도를 함께 드러냈습니다.
- source_word: יָרַד לִקְרָאתִי
  english_pob_choice: came down to meet me
  chosen_korean: 나를 맞이하였고
  alternatives_korean:
  - 나를 만나러 내려왔고
  - 나를 맞으러 내려왔고
  - 나를 만나러 왔고
  lexicon: HALOT
  rationale: ‘내려오다’의 방향성을 살리면서도 한국어에서는 ‘맞이하다/맞으러 내려오다’가 문맥상 가장 자연스럽습니다.
- source_word: וָאֶשָּׁבַע לוֹ בַיהוָה
  english_pob_choice: I swore to him by Yahweh
  chosen_korean: 내가 야훼를 두고 그에게 맹세하며
  alternatives_korean:
  - 내가 야훼의 이름으로 그에게 맹세하며
  - 내가 야훼로 그에게 맹세하며
  - 내가 야훼를 가리켜 그에게 맹세하며
  lexicon: HALOT
  rationale: יהוה를 본문에서 ‘야훼’로 옮기고, 히브리어 맹세 관용구는 한국어에서 ‘야훼를 두고 맹세하다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 본문에서는 하나님의 언약 이름을 ‘야훼’로 직역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  - 그 LORD
  rationale: 이 절은 Tetragrammaton을 직접 사용하므로, 프로젝트 기본값에 따라 전통적 대체어보다 고유한 신명 전달을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
- issue: אִם אֲמִיתְךָ בֶּחָרֶב의 맹세형
  chosen_reading: 부정적 서원으로 풀어 ‘내가 칼로 당신을 죽이지 않겠습니다’라고 옮겼습니다.
  alternative_readings:
  - ‘내가 칼로 당신을 죽인다면’
  - ‘내가 칼로 당신을 죽일지라도’
  rationale: 히브리어의 생략된 맹세 공식은 문자적으로는 조건문처럼 보이지만, 실제 의도는 죽이지 않겠다는 부정 서원이므로 그 힘을 드러내는 번역이 필요합니다.
  doctrine_reference: 맹세 공식의 관용적 이해
