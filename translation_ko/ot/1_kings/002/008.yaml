  to: 보십시오. 당신 곁에는 바후림 출신 베냐민 사람 게라의 아들 시므이가 있습니다. 그는 내가 마하나임으로 가던 날 나를 심하게 저주했습니다. 그러나 그는 요르단에서 나를 만나려고 내려왔고, 나는 야훼를 두고 그에게 맹세하여 말했습니다. ‘내가 칼로 그대를 죽이지 않겠습니다.’[a]
  rationale: 원문의 어휘 범위를 넘는 ‘모욕’이라는 해석적 첨가를 제거하고, ‘내려오다’라는 이동 방향을 명시했습니다. 맹세 공식의 관용적 부정 의미는 본문과 각주에서 유지하되, 각주 문장을 더 정확하고 자연스럽게 다듬었습니다.
