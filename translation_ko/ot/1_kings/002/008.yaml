    rationale: 이 인용은 솔로몬이 아니라 시므이에게 한 맹세의 직접 인용입니다. 현대 한국어에서 ‘당신’은 대립적·배우자 호칭 등으로 읽힐 여지가 있어, 문학적이면서 지시 대상이 분명한 ‘그대’가 더 자연스럽습니다.
