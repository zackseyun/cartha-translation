    issue: ‘내 형’
    rationale: 아도니야는 솔로몬의 형이므로, 그의 발화에서 솔로몬은 ‘형’이 아니라 ‘아우’입니다.
  - severity: medium
    issue: הַמְּלוּכָה를 ‘나라’로 번역
    rationale: 본문은 영토나 백성을 뜻하는 국가보다 왕위와 통치권의 귀속·계승을 말합니다. ‘왕권’이 문맥적 의미를 더 정확히 드러냅니다.
  - severity: medium
