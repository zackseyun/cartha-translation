revisions:
- from: 그가 말했습니다. 「당신은 나라가 내 것이었고, 온 이스라엘이 내가 다스리도록 나에게 얼굴을 돌렸다는 것을 압니다. 그러나 그 나라가 돌아서서 내 형의 것이 되었습니다. 그것은 야훼로부터 그에게 있었기 때문입니다.」[a][b]
  to: 그가 말했습니다. 「당신은 왕권이 내 것이었고, 온 이스라엘이 내가 왕이 되도록 나에게 얼굴을 향했다는 것을 알고 있습니다.[a] 그러나 그 왕권은 돌아서서 내 아우의 것이 되었습니다. 그것이 야훼에게서 그에게 온 것이기 때문입니다.[b]」
  rationale: 왕위 계승이라는 문맥에 맞춰 ‘나라’를 ‘왕권’으로 바꾸고, 솔로몬을 가리키는 친족 호칭을 ‘아우’로 바로잡았습니다. 히브리어 관용구의 형상은 보존하되 현대 한국어에서 뜻이 분명하도록 ‘내가 왕이 되도록’과 ‘나에게 얼굴을 향했다’로 다듬었습니다. 마지막 절은 신적 기원과 왕권의 귀속을 유지하면서 문법적으로 자연스러운 한국어로 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:50:01Z'
review_pass:
  verdict: revise
  source_fidelity: ‘형’은 화자 아도니야보다 어린 솔로몬을 가리키는 אָחִי와 맞지 않으므로 ‘아우’로 고쳐야 합니다. 또한 הַמְּלוּכָה는 영토 국가인 ‘나라’보다 이 문맥의 왕위·왕권을 분명히 하는 ‘왕권’이 적절합니다. 마지막 절의 ‘야훼로부터 그에게 있었다’는 히브리어 구문을 기계적으로 따른 탓에 한국어로 성립하지 않으므로, 야훼에게서 그에게 이르렀다는 원문의 기원 및 귀속을 자연스럽게 옮겼습니다.
  naturalness: 합쇼체와 직접화법은 적절하나, ‘내가 다스리도록 나에게 얼굴을 돌렸다’와 ‘야훼로부터 그에게 있었다’는 현대 표준 한국어에서 부자연스럽습니다. 관용구의 이미지는 ‘얼굴을 향하다’로 보존하고, 왕이 되려는 의도는 문맥상 명시했습니다.
  terminology: 신명은 방침에 맞게 ‘야훼’로 유지합니다. 왕위 계승 문맥에서는 ‘왕권’이 ‘나라’보다 정확하며, 남성 화자의 연소한 남자 형제는 ‘아우’가 맞습니다.
  issues:
