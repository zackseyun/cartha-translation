source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַ֤תְּ יָדַ֨עַתְּ֙ כִּי לִ/י֙ הָיְתָ֣ה הַ/מְּלוּכָ֔ה וְ/עָלַ֞/י שָׂ֧מוּ כָֽל יִשְׂרָאֵ֛ל פְּנֵי/הֶ֖ם לִ/מְלֹ֑ךְ וַ/תִּסֹּ֤ב הַ/מְּלוּכָה֙ וַ/תְּהִ֣י לְ/אָחִ֔/י כִּ֥י מֵ/יְהוָ֖ה הָ֥יְתָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/015.yaml
  text: And he said[a], “You know that the kingdom was mine, and that all Israel had set their faces on me to reign; but the kingdom turned and became my brother’s[b], for it was his from Yahweh.”
  footnotes:
  - marker: a
    text: Or “all Israel had looked to me to reign.” The Hebrew idiom is literally “had set their faces on me.”
    reason: lexical_alternative
  - marker: b
    text: Or “for it came to him from the LORD.”
    reason: alternative_reading
translation:
  language: ko
  text: 그가 말했습니다. 「당신은 나라가 내 것이었고, 온 이스라엘이 내가 다스리도록 나에게 얼굴을 돌렸다는 것을 압니다. 그러나 그 나라가 돌아서서 내 형의 것이 되었습니다. 그것은 야훼로부터 그에게 있었기 때문입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온 이스라엘이 내가 다스리도록 나에게 얼굴을 돌렸다는 것’은 히브리어 관용구를 살린 번역입니다. 직역하면 ‘내게 얼굴을 두었다/향했다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 ‘그것은 야훼께서 그에게 주셨기 때문입니다’로도 옮길 수 있으나, 히브리어는 ‘그에게 있었다/그의 것이었다’에 더 가깝습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְּלוּכָה
  english_pob_choice: the kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕권
  - 왕국
  - 통치
  lexicon: HALOT
  rationale: 문맥상 왕위 계승과 통치권을 가리키므로, 한국어에서는 자연스럽고 포괄적인 ‘나라’로 옮기되 왕권의 성격이 흐려지지 않게 했습니다.
- source_word: וְעָלַי שָׂמוּ כָל־יִשְׂרָאֵל פְּנֵיהֶם
  english_pob_choice: all Israel had set their faces on me
  chosen_korean: 온 이스라엘이 내가 다스리도록 나에게 얼굴을 돌렸다는 것
  alternatives_korean:
  - 온 이스라엘이 나를 주목했다는 것
  - 온 이스라엘이 나에게 얼굴을 향했다는 것
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘얼굴을 두다/돌리다’ 이미지를 살리면서, 단순한 관심이 아니라 왕으로 세우려는 지향을 드러내도록 했습니다.
- source_word: וַתִּסֹּב ... וַתְּהִי לְאָחִי
  english_pob_choice: the kingdom turned and became my brother’s
  chosen_korean: 그 나라가 돌아서서 내 형의 것이 되었습니다
  alternatives_korean:
  - 그 나라가 바뀌어 내 형에게 갔습니다
  - 그 나라가 전환되어 내 형의 것이 되었습니다
  lexicon: HALOT
  rationale: ‘돌아서다’는 전환·역전을 나타내는 동사를 비교적 직접적으로 살리며, לְאָחִי의 소유 관계는 ‘내 형의 것’으로 자연스럽게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 전통적 대체어인 ‘주’가 아니라 번역 방침에 따라 음역형 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 결말절의 신적 기원 표현
  chosen_reading: 그것은 야훼로부터 그에게 있었기 때문입니다
  alternative_readings:
  - 그것은 야훼께서 그에게 주셨기 때문입니다
  - 그것은 야훼께로부터 그에게 온 것이기 때문입니다
  rationale: 히브리어는 ‘주다’보다 ‘~에게 있었다/그에게 속했다’의 구문을 사용하므로, 신적 주권은 드러내되 동사를 더 강하게 만들지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
- issue: 화자 지시와 인용부 처리
  chosen_reading: 그가 말했습니다. 「…」
  alternative_readings:
  - '그가 말하되: …'
  - 그가 말했습니다, “…”
  rationale: 서사체는 합쇼체로 유지하고, 인용문은 한국어 문장부호에 맞춰 처리해 원문의 직접화법을 분명히 했습니다.
  doctrine_reference: Korean target style — standard modern formal-polite
