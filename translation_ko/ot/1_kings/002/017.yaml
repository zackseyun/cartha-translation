  text: And he said[a], “Please speak to King Solomon, for he will not refuse you, and let him give me Abishag the Shunammite as a wife.”
  footnotes:
  - marker: a
    text: Literally, 'he will not turn back your face,' a Hebrew idiom meaning 'he will not refuse you' or 'he will not deny your request.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「부디 솔로몬 왕께 말씀드려서, 수넴 여자 아비삭을 제 아내로 주시도록 해 주십시오. 왕께서는 그 청을 거절하지 않으실 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘당신의 얼굴을 돌려보내지 않을 것이다’입니다. 여기서는 청원을 거절하거나 물리치지 않겠다는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  english_pob_choice: Please speak
  chosen_korean: 부디 … 말씀하십시오
  alternatives_korean:
  - 부디 … 말하십시오
  - 부디 … 말씀해 주십시오
  lexicon: HALOT
  rationale: 여성 단수형의 공손한 요청을 현대 한국어의 정중한 청유로 옮겼습니다. 왕에게 직접 말하는 것이 아니라 간접 청탁하는 맥락이므로 ‘말씀하십시오’가 가장 자연스럽습니다.
- source_word: לִשְׁלֹמֹה הַמֶּלֶךְ
  english_pob_choice: to King Solomon
  chosen_korean: 솔로몬 왕에게
  alternatives_korean:
  - 솔로몬에게
  - 왕 솔로몬에게
  lexicon: HALOT
  rationale: 히브리어의 왕호+이름 어순은 한국어에서 ‘솔로몬 왕’으로 간결하게 재현하는 것이 자연스럽습니다.
- source_word: לֹא יָשִׁיב אֶת פָּנָיִךְ
  english_pob_choice: he will not refuse you
  chosen_korean: 왕은 당신을 거절하지 않을 것이니
  alternatives_korean:
  - 왕은 당신의 얼굴을 돌리지 않을 것이니
  - 왕은 당신의 요청을 거절하지 않을 것이니
  lexicon: HALOT
  rationale: 직역인 ‘얼굴을 돌리다’는 한국어 독자에게는 의미가 불분명하므로, POB의 해석대로 청탁 거절의 의미를 드러냈습니다.
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  english_pob_choice: Abishag the Shunammite
  chosen_korean: 수넴 여자 아비삭
  alternatives_korean:
  - 수넴 사람 아비삭
  - 수넴 출신 아비삭
  lexicon: HALOT
  rationale: 고유명사는 아비삭으로 음역하고, הַשּׁוּנַמִּית는 지명 유래의 여성형 민족/출신 표지이므로 ‘수넴 여자’로 옮겼습니다.
- source_word: לְאִשָּׁה
  english_pob_choice: as a wife
  chosen_korean: 아내로
  alternatives_korean:
  - 아내로서
  - 아내가 되게
  lexicon: HALOT
  rationale: 결혼 관계를 뜻하는 목적격 용법이므로 한국어에서는 자연스럽게 ‘아내로’로 풀어 옮겼습니다.
theological_decisions:
- issue: 직접 화법 안의 요청 표현의 공손도
  chosen_reading: 청탁의 정중함을 살리되, 과도한 종교적 높임말은 쓰지 않고 현대적 공손체로 유지했습니다.
  alternative_readings:
  - ‘부디 말씀해 주십시오’처럼 더 완곡하게
  - ‘말하시오’처럼 더 직설적으로
  rationale: 원문은 예의 바른 간청이지만 예언/기도체는 아니므로, 현대 한국어 독자가 관계의 긴장을 바로 느끼도록 정중한 합쇼체로 처리했습니다.
  doctrine_reference: 문맥 기반 화행 재현
