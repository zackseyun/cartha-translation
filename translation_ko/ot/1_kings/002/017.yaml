revisions:
- from: 그가 말했습니다. 「부디 솔로몬 왕에게 말씀하십시오. 왕은 당신을 거절하지 않을 것이니, 나에게 수넴 여자 아비삭을 아내로 주게 하십시오」.[a]
  to: 그가 말했습니다. 「부디 솔로몬 왕께 말씀드려서, 수넴 여자 아비삭을 제 아내로 주시도록 해 주십시오. 왕께서는 그 청을 거절하지 않으실 것입니다.」[a]
  rationale: ‘거절하지 않을’의 대상을 사람인 ‘당신’이 아니라 그 사람이 드리는 청으로 명시하여 히브리어 관용구의 문맥상 의미를 정확히 드러냈습니다. 요청의 내용은 한국어에서 자연스럽게 ‘주시도록 해 주십시오’로 옮겼으며, 아비삭의 출신 표지와 혼인 요청의 의미를 유지했습니다. 각주의 직역도 히브리어의 동사와 목적어 관계에 맞게 바로잡았습니다.
