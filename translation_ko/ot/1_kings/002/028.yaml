  edition: WLC
  text: וְ/הַ/שְּׁמֻעָה֙ בָּ֣אָה עַד יוֹאָ֔ב כִּ֣י יוֹאָ֗ב נָטָה֙ אַחֲרֵ֣י אֲדֹנִיָּ֔ה וְ/אַחֲרֵ֥י אַבְשָׁל֖וֹם לֹ֣א נָטָ֑ה וַ/יָּ֤נָס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/028.yaml
  text: And the report came to Joab[a], for Joab had turned after Adonijah, though he had not turned after Absalom[b]. So Joab fled to the tent of Yahweh and took hold of the horns of the altar.
  footnotes:
  - marker: a
    text: Or 'had sided with Adonijah ... had not sided with Absalom.' The Hebrew literally says 'had turned after.'
    reason: lexical_alternative
  - marker: b
    text: The 'horns' were the horn-like projections at the altar's corners; grasping them was an appeal for sanctuary or mercy.
    reason: cultural_note
translation:
  language: ko
  text: 그 소식이 요압에게 이르렀습니다. 이는 요압이 아도니야를 따랐지만 아브살롬을 따르지는 않았기 때문입니다. 그래서 요압은 야훼의 성막으로 도망하여 제단의 뿔을 붙잡았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '뒤를 향해 돌다'이며, 여기서는 아도니야 편에 섰다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: '''제단의 뿔''은 제단 모서리의 뿔 모양 돌출부를 가리키며, 그곳을 붙잡는 것은 피난과 자비를 구하는 행동입니다.'
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֻעָה
  english_pob_choice: the report
  chosen_korean: 그 소식
  alternatives_korean:
  - 그 보고
  - 그 소문
  lexicon: HALOT
  rationale: 도착하는 정보라는 의미를 살리되, 서사 문맥에 자연스러운 표준어 표현으로 옮겼습니다. '소문'은 불확실한 뉘앙스가 강해 다소 약하고, '보고'는 행정적 느낌이 강합니다.
- source_word: נָטָה אַחֲרֵי
  english_pob_choice: had turned after
  chosen_korean: 따랐지만
  alternatives_korean:
  - 편을 들었지만
  - 뒤따랐지만
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현은 '뒤로 향하다/따르다'의 관용구이지만, 여기서는 정치적 지지의 뜻이므로 한국어에서는 자연스럽게 '따르다'로 옮기되 반복 대조가 드러나도록 했습니다.
- source_word: אֹהֶל יְהוָה
  english_pob_choice: the tent of Yahweh
  chosen_korean: 야훼의 성막
  alternatives_korean:
  - 야훼의 장막
  - 야훼의 천막
  lexicon: HALOT
  rationale: 원문은 문자적으로 '야훼의 장막/천막'이지만, 구약의 제의적 문맥에서 한국어 독자는 '성막'을 가장 자연스럽게 인식합니다. 다만 기술어를 쓰되 원문의 장소성을 유지했습니다.
- source_word: וַיַּחֲזֵק בְּקַרְנוֹת הַמִּזְבֵּחַ
  english_pob_choice: took hold of the horns of the altar
  chosen_korean: 제단의 뿔을 붙잡았습니다
  alternatives_korean:
  - 제단의 뿔을 움켜잡았습니다
  - 제단의 뿔을 잡았습니다
  lexicon: HALOT
  rationale: 예배용 제단의 모서리 돌출부를 가리키는 표준적 직역을 유지했습니다. '붙잡다'는 급박하게 매달리는 동작을 잘 살립니다.
theological_decisions:
- issue: יהוה(여호와) 고유명사의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 יְהוָה는 고유명사로서 '야훼'를 유지했습니다. 이는 칭호로 대체하지 않고 본문이 가진 신명 표지를 드러냅니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → 야훼
- issue: '''성막''과 ''장막'' 중 제의적 장소 표현'
  chosen_reading: 성막
  alternative_readings:
  - 장막
  - 천막
  rationale: 여기서는 단순한 천막이 아니라 야훼의 거처이자 제의 공간이라는 점이 중요하므로, 한국어 성경에서 이미 정착한 제의적 용어를 택했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
