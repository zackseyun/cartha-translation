  text: The days that David reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: ko
  text: 다윗이 이스라엘을 다스린 날 수는 사십 년이었습니다. 헤브론에서 칠 년을 다스렸고, 예루살렘에서 삼십삼 년을 다스렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים
  english_pob_choice: The days
  chosen_korean: 날 수는
  alternatives_korean:
  - 기간은
  - 세월은
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어에서는 자연스럽게 기간을 뜻하는 표현으로 옮겨, 통치 기간 요약임을 드러냈습니다.
- source_word: מָלַךְ
  english_pob_choice: reigned
  chosen_korean: 다스린 / 다스렸습니다
  alternatives_korean:
  - 통치한 / 통치하였습니다
  - 왕으로 있었던 / 왕이었던
  lexicon: HALOT
  rationale: מלך의 통치 의미를 살리면서도 한국어에서 군더더기 없이 왕권 행위를 나타내는 ‘다스리다’를 택했습니다.
- source_word: עַל יִשְׂרָאֵל
  english_pob_choice: over Israel
  chosen_korean: 이스라엘을
  alternatives_korean:
  - 이스라엘 위에
  - 이스라엘 위에서
  lexicon: HALOT
  rationale: מלך + עַל의 지배 관계는 한국어에서 목적어 표지로 자연스럽게 나타낼 수 있어, ‘이스라엘을 다스리다’로 옮겼습니다.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנִים
  english_pob_choice: thirty-three years
  chosen_korean: 삼십삼 년
  alternatives_korean:
  - 서른셋 해
  - 삼십과 셋 해
  lexicon: HALOT
  rationale: 합성 수사는 현대 한국어의 표준식인 ‘삼십삼 년’으로 옮겨 정확한 총계를 분명히 했습니다.
theological_decisions:
- issue: 역사 서술의 문체
  chosen_reading: 서술형 역사 문장으로 평이하게 옮기되, 왕의 통치 기간이라는 사실 정보를 선명하게 유지했습니다.
  alternative_readings:
  - 문어적으로 더 압축한 연대기식 표현
  - ‘왕 노릇하다’ 같은 관용 표현
  rationale: 본 절은 신학적 논쟁보다 왕조 연대기 정보가 핵심이므로, 원문의 요약적·기록적 성격을 한국어에서도 그대로 드러내는 것이 가장 충실합니다.
  doctrine_reference: 역사서의 서술 충실성
