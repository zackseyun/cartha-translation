base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/037.yaml
  text: For on the day you go out and cross the Kidron Valley[a], know for certain that you shall surely die[b]; your blood shall be on your own head.
  footnotes:
  - marker: a
    text: Or 'cross the brook Kidron.' The Hebrew נחל can refer to a valley, wadi, or seasonal watercourse.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''your blood shall be on your head,'' meaning you yourself will bear responsibility for your death.'
    reason: cultural_note
translation:
  language: ko
  text: 네가 나가서 기드론 골짜기[a]를 건너는 날에는, 네가 반드시 죽는다는 것을 분명히 아십시오. 네 피는 네 머리 위에 있을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기드론 시내’. 히브리어 נחל은 골짜기, 와디, 또는 계절성 물길을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, ‘네 피가 네 머리 위에 있다’는 네가 자신의 죽음에 대한 책임을 진다는 뜻입니다.
    reason: cultural_note
