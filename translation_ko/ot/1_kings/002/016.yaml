  source_fidelity: '수정이 필요합니다. 원문은 아도니야의 요청 뒤에 ‘그녀가 그에게 말하였다: 말하라’라는 순서이나, 초안은 ‘그가 그녀에게 말하자’라고 하여 발화 순서를 바꾸었습니다. 또한 히브리어 관용구를 한국어에서 문자적으로 재현한 ‘제 얼굴을 돌리지 마십시오’는 원문의 관용적 의미를 전달하지 못하고 물리적으로 얼굴을 돌리는 뜻으로 읽힐 수 있습니다.'
  naturalness: 합쇼체의 기본 수준은 적절하지만, ‘그가 그녀에게 말하자’는 서술상 부자연스럽고 원문과도 다릅니다. ‘저를 거절하지 마십시오’는 현대 표준어에서 자연하며, 직역적 이미지는 각주로 보존할 수 있습니다.
  terminology: ‘청’은 문맥에 맞는 격식 있는 표현입니다. ‘말하십시오’도 דַּבֵּר의 간결한 권유 명령에 적절합니다. 관용구의 직역은 본문 대신 각주에서 밝혀야 합니다.
