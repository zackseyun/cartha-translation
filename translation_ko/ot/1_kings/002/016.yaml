  - 지금
  lexicon: HALOT
  rationale: 문맥 전환 표지와 시간 부사를 간결하게 살려, 대화가 이어지는 흐름을 자연스러운 한국어로 옮겼습니다.
- source_word: שְׁאֵלָה אַחַת
  english_pob_choice: one request
  chosen_korean: 한 가지 청
  alternatives_korean:
  - 한 가지 요청
  - 한 가지 부탁
  - 한 가지 소원
  lexicon: HALOT
  rationale: שְׁאֵלָה는 요청/청원을 뜻하므로, 문어체이면서도 인물 간 대화에 자연한 ‘청’을 택해 수량 표현 ‘한 가지’를 살렸습니다.
- source_word: אַל תָּשִׁ֖בִי אֶת פָּנַ֑י
  english_pob_choice: do not turn away my face
  chosen_korean: 제 얼굴을 돌리지 마십시오
  alternatives_korean:
  - 저를 거절하지 마십시오
  - 제 청을 거절하지 마십시오
  - 제 얼굴을 외면하지 마십시오
  lexicon: HALOT
  rationale: 직역 이미지인 ‘얼굴을 돌리다’를 유지해 히브리어 관용구의 힘을 살리되, 한국어에서는 상대의 거절을 뜻하는 말로 이해되도록 자연화했습니다.
- source_word: דַּבֵּר
  english_pob_choice: Speak
  chosen_korean: 말하십시오
  alternatives_korean:
  - 말해 보십시오
  - 말씀하십시오
  lexicon: HALOT
  rationale: 요청을 받아들이는 즉각적 응답으로서 명령형을 살리면서, 현대 표준어 합쇼체에 맞게 간결하게 옮겼습니다.
theological_decisions:
- issue: 히브리어 관용구를 직역 이미지로 유지할지 의미를 풀어 옮길지
  chosen_reading: 본문에는 ‘제 얼굴을 돌리지 마십시오’로 이미지성을 유지하고, 의미는 주석으로 보완했습니다.
  alternative_readings:
  - 저를 거절하지 마십시오
  - 제 청을 거절하지 마십시오
  rationale: 원문은 문자적으로는 ‘내 얼굴을 돌려 보내지 말라’는 이미지지만, 실제 의미는 거절/거부의 금지입니다. 본문에서 이미지를 보존해야 서사와 수사적 긴장이 유지됩니다.
  doctrine_reference: '번역 철학: 원문 이미지 보존과 의미 전달의 균형'
- issue: 대화체의 높임말 수준
  chosen_reading: 상대에게는 합쇼체를 사용했고, 요청 인용문 안에서도 같은 높임말을 유지했습니다.
  alternative_readings:
  - 인용문 내부를 반말로 낮춤
  - 더 고전적인 경어 사용
  rationale: 이 절은 궁정/대화 장면이므로 현대 한국어 독자가 자연스럽게 읽을 수 있는 정중체가 적절합니다. 원문의 발화 기능을 해치지 않는 범위에서 일관된 예의를 유지했습니다.
  doctrine_reference: 현대 한국어 문체 원칙
