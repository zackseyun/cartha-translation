translation:
  language: ko
  text: “이제 제가 당신께 한 가지 청을 드립니다. 저를 거절하지 마십시오.[a]” 그러자 그녀가 그에게 “말하십시오.” 하고 대답했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘내 얼굴을 돌려 보내지 말라’는 뜻입니다. 이는 ‘나를 거절하지 마십시오’ 또는 ‘내 청을 물리치지 마십시오’라는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
