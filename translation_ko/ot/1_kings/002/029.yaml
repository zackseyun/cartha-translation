  - 솔로몬 왕에게 … 전해졌습니다
  lexicon: HALOT
  rationale: 히브리어 수동형의 정보 전달을 한국어에서는 자연스럽게 ‘보고가 들어왔습니다’로 옮겨, 전달된 정보라는 점과 수동성을 함께 살렸습니다.
- source_word: אֶל אֹהֶל יְהוָה
  english_pob_choice: to the tent of the LORD
  chosen_korean: 야훼의 장막으로
  alternatives_korean:
  - 여호와의 장막으로
  - 야훼의 성막으로
  lexicon: HALOT
  rationale: 원문은 직역하면 ‘야훼의 tent’이므로 프로젝트 기본값에 따라 고유 신명은 ‘야훼’로, אֹהֶל은 ‘장막’으로 옮겼습니다. ‘성막’은 전통적이지만 원어의 투명성이 떨어집니다.
- source_word: וְהִנֵּה אֵצֶל הַמִּזְבֵּחַ
  english_pob_choice: and behold, he was beside the altar
  chosen_korean: 보십시오, 그가 제단 곁에 있다는
  alternatives_korean:
  - 보십시오, 그가 제단 옆에 있는
  - 그리고 보니 그가 제단 곁에 있는
  lexicon: HALOT
  rationale: וְהִנֵּה의 주목 환기 기능을 ‘보십시오’로 살렸고, אֵצֶל은 위치의 근접성을 드러내는 ‘곁에’로 옮겼습니다.
- source_word: פְּגַע בּוֹ
  english_pob_choice: strike him down
  chosen_korean: 가서 그를 치십시오
  alternatives_korean:
  - 가서 그를 공격하십시오
  - 가서 그를 쓰러뜨리십시오
  - 가서 그를 죽이십시오
  lexicon: HALOT
  rationale: פּגע는 문맥상 치명적 공격을 뜻하지만, 한국어 본문에서는 어휘 범위를 지나치게 좁히는 ‘죽이십시오’보다 원어의 폭을 남기는 ‘치십시오’를 택했습니다. 상황상 lethal force는 본문 흐름이 보여 줍니다.
