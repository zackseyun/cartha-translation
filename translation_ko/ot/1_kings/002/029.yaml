source:
  edition: WLC
  text: וַ/יֻּגַּ֞ד לַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה כִּ֣י נָ֤ס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וְ/הִנֵּ֖ה אֵ֣צֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁלַ֨ח שְׁלֹמֹ֜ה אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע לֵ/אמֹ֖ר לֵ֥ךְ פְּגַע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/029.yaml
  text: And it was reported to King Solomon that Joab had fled to the tent of Yahweh[a], and behold, he was beside the altar. So Solomon sent Benaiah son of Jehoiada, saying, “Go[b], strike him down.”
  footnotes:
  - marker: a
    text: Or “tabernacle of the LORD.” The Hebrew says “tent of the LORD.”
    reason: lexical_alternative
  - marker: b
    text: Or “Go, fall upon him” / “Go, attack him.” The Hebrew verb can denote striking or assaulting; here it carries the sense of a lethal blow in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬 왕에게 요압이 야훼의 장막으로 도망하였고, 보십시오, 그가 제단 곁에 있다는 보고가 들어왔습니다. 그러자 솔로몬은 여호야다의 아들 브나야를 보내며 말했습니다. "가서 그를 치십시오."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘장막’은 히브리어 אֹהֶל의 직역입니다. 전통적 교회 용어로는 ‘성막’이 쓰이기도 하지만, 원문 투명성을 위해 ‘장막’을 본문에 두었습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 פּגע는 이 문맥에서 치명적 타격을 뜻합니다. 한국어 본문은 ‘치십시오’로 두어 원어의 범위를 보존하고, 문맥이 살해 의도를 분명히 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לַמֶּלֶךְ שְׁלֹמֹה
  english_pob_choice: it was reported to King Solomon
  chosen_korean: 솔로몬 왕에게 … 보고가 들어왔습니다
  alternatives_korean:
  - 솔로몬 왕에게 … 알렸습니다
  - 솔로몬 왕에게 … 전해졌습니다
  lexicon: HALOT
  rationale: 히브리어 수동형의 정보 전달을 한국어에서는 자연스럽게 ‘보고가 들어왔습니다’로 옮겨, 전달된 정보라는 점과 수동성을 함께 살렸습니다.
- source_word: אֶל אֹהֶל יְהוָה
  english_pob_choice: to the tent of the LORD
  chosen_korean: 야훼의 장막으로
  alternatives_korean:
  - 여호와의 장막으로
  - 야훼의 성막으로
  lexicon: HALOT
  rationale: 원문은 직역하면 ‘야훼의 tent’이므로 프로젝트 기본값에 따라 고유 신명은 ‘야훼’로, אֹהֶל은 ‘장막’으로 옮겼습니다. ‘성막’은 전통적이지만 원어의 투명성이 떨어집니다.
- source_word: וְהִנֵּה אֵצֶל הַמִּזְבֵּחַ
  english_pob_choice: and behold, he was beside the altar
  chosen_korean: 보십시오, 그가 제단 곁에 있다는
  alternatives_korean:
  - 보십시오, 그가 제단 옆에 있는
  - 그리고 보니 그가 제단 곁에 있는
  lexicon: HALOT
  rationale: וְהִנֵּה의 주목 환기 기능을 ‘보십시오’로 살렸고, אֵצֶל은 위치의 근접성을 드러내는 ‘곁에’로 옮겼습니다.
- source_word: פְּגַע בּוֹ
  english_pob_choice: strike him down
  chosen_korean: 가서 그를 치십시오
  alternatives_korean:
  - 가서 그를 공격하십시오
  - 가서 그를 쓰러뜨리십시오
  - 가서 그를 죽이십시오
  lexicon: HALOT
  rationale: פּגע는 문맥상 치명적 공격을 뜻하지만, 한국어 본문에서는 어휘 범위를 지나치게 좁히는 ‘죽이십시오’보다 원어의 폭을 남기는 ‘치십시오’를 택했습니다. 상황상 lethal force는 본문 흐름이 보여 줍니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 본문에서 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 번역본의 공용 기본값에 따라 신명은 번역어로 대체하지 않고 음역해, 본문이 지닌 언약적 고유성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
