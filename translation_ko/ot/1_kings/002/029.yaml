base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/029.yaml
  text: And it was reported to King Solomon that Joab had fled to the tent of Yahweh[a], and behold, he was beside the altar. So Solomon sent Benaiah son of Jehoiada, saying, “Go[b], strike him down.”
  footnotes:
  - marker: a
    text: Or “tabernacle of the LORD.” The Hebrew says “tent of the LORD.”
    reason: lexical_alternative
  - marker: b
    text: Or “Go, fall upon him” / “Go, attack him.” The Hebrew verb can denote striking or assaulting; here it carries the sense of a lethal blow in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬 왕에게 요압이 야훼의 장막[a]으로 도망하였고, 보니 그가 제단 곁에 있다는 보고가 들어왔습니다. 그러자 솔로몬은 여호야다의 아들 브나야를 보내며 말했습니다. “가서 그를 치십시오.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘장막’은 히브리어 אֹהֶל의 직역입니다. 전통적 교회 용어로는 ‘성막’이 쓰이기도 하지만, 원문 투명성을 위해 ‘장막’을 본문에 두었습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 פּגע는 이 문맥에서 치명적 타격을 뜻합니다. 한국어 본문은 ‘치십시오’로 두어 원어의 범위를 보존하고, 문맥이 살해 의도를 분명히 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לַמֶּלֶךְ שְׁלֹמֹה
  english_pob_choice: it was reported to King Solomon
  chosen_korean: 솔로몬 왕에게 … 보고가 들어왔습니다
  alternatives_korean:
