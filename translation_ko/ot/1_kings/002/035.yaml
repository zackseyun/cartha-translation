id: 1KI.2.35
reference: 1 Kings 2:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֜לֶךְ אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע תַּחְתָּ֖י/ו עַל הַ/צָּבָ֑א וְ/אֶת צָד֤וֹק הַ/כֹּהֵן֙ נָתַ֣ן הַ/מֶּ֔לֶךְ תַּ֖חַת אֶבְיָתָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/035.yaml
  text: And the king appointed Benaiah son of Jehoiada in his place over the army[a], and the king appointed Zadok the priest in place of Abiathar.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in his place''; the pronoun refers to the previously displaced commander, Joab, from the immediate context.'
    reason: cross_reference
translation:
  language: ko
  text: 왕은 여호야다의 아들 브나야를 그의 자리[a]에 세워 군대를 맡게 하셨고, 왕은 사독 제사장을 아비아달의 자리에 세우셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘그의 자리’에서 ‘그’는 바로 앞 문맥에서 해임된 요압을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  english_pob_choice: appointed
  chosen_korean: 세우고
  alternatives_korean:
  - 임명하고
  - appointed하여
  - 두고
  lexicon: HALOT
  rationale: 행정적·직무 배치 맥락이므로 단순한 ‘주다’보다 직분에 앉히는 뜻을 살리는 표현이 적절합니다.
- source_word: עַל הַצָּבָא
  english_pob_choice: over the army
  chosen_korean: 군대 위에 사령관으로서
  alternatives_korean:
  - 군대 위에
  - 군대를 맡아
  - 군대의 우두머리로
  lexicon: HALOT
  rationale: צָבָא는 여기서 군사 조직을 가리키므로, 단순한 위치 표현보다 지휘 직분이 드러나도록 옮겼습니다.
- source_word: תַּחְתָּיו / תַּחַת אֶבְיָתָר
  english_pob_choice: in his place / in place of Abiathar
  chosen_korean: 요압을 대신하여 / 아비아달 대신
  alternatives_korean:
  - 요압의 자리에
  - 아비아달의 자리에
  - 요압을 대신해서
  lexicon: HALOT
  rationale: תַּחַת의 핵심은 직책의 교체이므로, ‘대신하여/대신’으로 승계 관계를 분명히 했습니다.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע / צָדוֹק / אֶבְיָתָר
  english_pob_choice: Benaiah son of Jehoiada / Zadok / Abiathar
  chosen_korean: 브나야 / 여호야다의 아들 브나야 / 사독 / 아비아달
  alternatives_korean:
  - 베나야
  - 사독
  - 아비아달
  lexicon: 고유명사 표기 관행
  rationale: 이 프로젝트의 방침에 따라 인명은 현대 외래어 표기 원칙을 따르되, 이미 널리 굳어진 성경 인명은 통용 표기를 유지했습니다.
theological_decisions:
- issue: 요압의 해임과 직분 교체를 어떻게 드러낼지
  chosen_reading: ‘대신하여’로 번역해 왕권에 의한 공식적 교체를 분명히 드러냈습니다.
  alternative_readings:
  - ‘그 자리에’
  - ‘그 대신에’
  rationale: 히브리어 תַּחַת은 단순한 위치보다 대체·승계를 뜻하므로, 본문의 행정적 결단이 희석되지 않도록 했습니다.
  doctrine_reference: 왕정 서술의 역사적 문맥
- issue: 사독의 직함을 어떻게 처리할지
  chosen_reading: ‘사독 제사장’으로 유지했습니다.
  alternative_readings:
  - ‘사독, 그 제사장’
  - ‘사독 대제사장’
  rationale: 본문의 הַכֹּהֵן은 단순히 제사장 직분을 가리키며, ‘대제사장’은 본문이 명시하지 않는 정보를 덧붙일 수 있습니다.
  doctrine_reference: 성서 본문 엄격성
