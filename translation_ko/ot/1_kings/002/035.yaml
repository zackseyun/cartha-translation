    rationale: 히브리어는 두 번째 임명 절에서 ‘왕’을 다시 명시합니다. 한국어에서도 이를 유지하면 원문의 절 구조와 강조를 보존할 수 있습니다.
  revised_text: 왕은 여호야다의 아들 브나야를 그의 자리[a]에 세워 군대를 맡게 하셨고, 왕은 사독 제사장을 아비아달의 자리에 세우셨습니다.
