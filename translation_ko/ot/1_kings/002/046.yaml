  terminology: ‘여호야다’, ‘브나야’, ‘솔로몬’은 적절합니다. ‘왕국’은 מַּמְלָכָה를 충실히 반영하며, ‘손’의 관용적 통치·지배 이미지는 본문과 각주에서 유지합니다.
