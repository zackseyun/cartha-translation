  text: Then the king commanded Benaiah son of Jehoiada[a], and he went out and struck him down, and he died. So the kingdom was established in the hand of Solomon.
  footnotes:
  - marker: a
    text: Or 'was firmly established under Solomon' / 'in Solomon’s hand.' The Hebrew idiom 'in the hand of' expresses control or possession.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 여호야다의 아들 브나야에게 명령했습니다. 그러자 브나야가 나가 그를 쳤고, 그가 죽었습니다. 그러므로 왕국은 솔로몬의 손 안에서 굳게 세워졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘솔로몬의 손 안에서’입니다. 히브리어 관용구는 통치·지배 또는 소유를 뜻합니다.
    reason: lexical_alternative
