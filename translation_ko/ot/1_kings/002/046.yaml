base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/046.yaml
  text: Then the king commanded Benaiah son of Jehoiada[a], and he went out and struck him down, and he died. So the kingdom was established in the hand of Solomon.
  footnotes:
  - marker: a
    text: Or 'was firmly established under Solomon' / 'in Solomon’s hand.' The Hebrew idiom 'in the hand of' expresses control or possession.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 여호야다의 아들 브나야에게 명령하자, 그가 나가서 그를 쳐 죽였고 그가 죽었습니다. 그러므로 왕국은 솔로몬의 손에 확고히 서게 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘솔로몬의 손 안에’입니다. 히브리어 관용구는 통치·지배 또는 소유를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명령하자
  alternatives_korean:
  - 명령했습니다
  - 지시하자
  - 명하자
  lexicon: HALOT
  rationale: 왕의 권위 있는 명령을 자연스러운 서술형으로 옮기되, 이어지는 사건 전개를 살리기 위해 연결형으로 처리했습니다.
- source_word: וַיִּפְגַּע בּוֹ
  english_pob_choice: struck him down
  chosen_korean: 그를 쳐 죽였고
  alternatives_korean:
  - 그를 쳐서 쓰러뜨렸고
  - 그를 공격했고
  - 그에게 달려들었고
  lexicon: HALOT
  rationale: 문맥이 처형 장면이므로 단순한 ‘공격하다’보다 실제 치명상을 가한 의미가 드러나도록 옮겼습니다.
- source_word: נָכוֹנָה
  english_pob_choice: was established
  chosen_korean: 확고히 서게 되었습니다
  alternatives_korean:
  - 세워졌습니다
  - 견고히 확립되었습니다
  - 굳게 세워졌습니다
  lexicon: HALOT
  rationale: נכון의 ‘견고해지다, 확립되다’라는 뜻을 살리면서 한국어로는 왕권의 안정이 드러나게 했습니다.
- source_word: בְּיַד שְׁלֹמֹה
  english_pob_choice: in the hand of Solomon
  chosen_korean: 솔로몬의 손에
  alternatives_korean:
  - 솔로몬의 통치 아래
  - 솔로몬에게
  - 솔로몬의 권세 아래
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되, 한국어에서 자연스러운 ‘손에’ 표현을 유지해 지배·통치의 뜻을 보존했습니다.
theological_decisions:
- issue: ‘왕국’과 ‘솔로몬의 손’의 통치 이미지 보존
  chosen_reading: 왕국은 솔로몬의 손에 확고히 서게 되었습니다
  alternative_readings:
  - 솔로몬의 통치가 굳어졌습니다
  - 왕권이 솔로몬에게 안전하게 넘어갔습니다
  rationale: 히브리어의 정치적·왕권적 뉘앙스를 약화하지 않도록, 관용구를 완전히 풀지 않고 통치의 손 이미지와 확립의 결과를 함께 보존했습니다.
  doctrine_reference: 본문의 왕권 성립 서술
