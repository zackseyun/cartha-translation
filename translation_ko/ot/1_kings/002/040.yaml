id: 1KI.2.40
reference: 1 Kings 2:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣קָם שִׁמְעִ֗י וַֽ/יַּחֲבֹשׁ֙ אֶת חֲמֹר֔/וֹ וַ/יֵּ֤לֶךְ גַּ֨תָ/ה֙ אֶל אָכִ֔ישׁ לְ/בַקֵּ֖שׁ אֶת עֲבָדָ֑י/ו וַ/יֵּ֣לֶךְ שִׁמְעִ֔י וַ/יָּבֵ֥א אֶת עֲבָדָ֖י/ו מִ/גַּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/040.yaml
  text: Then Shimei arose[a], saddled his donkey, and went to Gath, to Achish, to look for his slaves. Shimei went and brought his slaves back from Gath.
  footnotes:
  - marker: a
    text: Or 'his servants.' The Hebrew עֲבָדָיו can denote servants or slaves; here 'slaves' is used because the context emphasizes bonded status and recovery of runaways.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 시므이가 일어나 자기 나귀에 안장을 지우고 가드로, 아기스에게 가서 자기 노예들을 찾았습니다. 시므이가 가서 가드에서 자기 노예들을 데려왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '자기 종들'로 번역할 수 있습니다. 히브리어 עֲבָדָיו는 '종들' 또는 '노예들'을 뜻할 수 있는데, 여기서는 도주자들을 다시 찾아오는 맥락이므로 '노예들'을 사용했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 일어났습니다
  - 일어났어요
  lexicon: HALOT
  rationale: 서사적 진행을 자연스럽게 살리면서도 현대 한국어에서 과도하게 문어적이지 않게 옮겼습니다.
- source_word: וַיַּחֲבֹשׁ אֶת חֲמֹרוֹ
  english_pob_choice: saddled his donkey
  chosen_korean: 자기 나귀에 안장을 지우고
  alternatives_korean:
  - 자기 나귀를 준비하고
  - 자기 나귀에 안장을 얹고
  lexicon: HALOT
  rationale: חבש는 여행 맥락에서 짐승을 타기 위해 준비시키는 뜻이므로, 한국어에서는 '안장을 지우다'가 가장 구체적이고 자연스럽습니다.
- source_word: לְבַקֵּשׁ
  english_pob_choice: to look for
  chosen_korean: 찾았습니다
  alternatives_korean:
  - 찾으려고
  - 구하려고
  - 찾았습니다
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 탐색보다 실제로 노예들을 찾아 데려오려는 행동이므로, 자연스러운 서술형으로 '찾다'를 썼습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his slaves
  chosen_korean: 자기 노예들
  alternatives_korean:
  - 자기 종들
  - 자기 하인들
  lexicon: HALOT
  rationale: POB의 영어 선택이 bonded status를 드러내는 'slaves'이므로, 본문 맥락의 소유·도주·회수 관계를 반영해 '노예'를 유지했습니다.
- source_word: מִגַּת
  english_pob_choice: from Gath
  chosen_korean: 가드에서
  alternatives_korean:
  - 가드로부터
  - 가드에서부터
  lexicon: HALOT
  rationale: מִן의 출발점을 한국어 조사 '에서'로 간결하게 옮겼습니다.
theological_decisions:
- issue: עֲבָדָיו를 '종/하인'이 아니라 '노예'로 옮길지 여부
  chosen_reading: 본문의 사회적·법적 종속 상태를 드러내는 '노예'를 사용했습니다.
  alternative_readings:
  - '''종들''은 한국 교회 언어로 부드럽지만 본문이 전제하는 소유·회수의 긴장을 약화시킵니다.'
  - '''하인들''은 고용 관계로 오해될 수 있습니다.'
  rationale: 이 절은 단순한 예우 관계가 아니라 도망한 사람들을 다시 소유물처럼 찾아오는 장면이므로, POB의 audit trail에 맞춰 완곡어를 피했습니다.
  doctrine_reference: 본문 의미 보존 및 번역 윤리
