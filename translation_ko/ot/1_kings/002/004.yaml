  edition: WLC
  text: לְמַעַן֩ יָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֣ר עָלַ/י֮ לֵ/אמֹר֒ אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֤כֶת לְ/פָנַ/י֙ בֶּ/אֱמֶ֔ת בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָׁ֑/ם לֵ/אמֹ֕ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מֵ/עַ֖ל כִּסֵּ֥א יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/004.yaml
  text: so that Yahweh may establish his word that he spoke concerning me[a], saying, ‘If your sons keep their way by walking before me in truth with all their heart and with all their soul,’ saying[c][b], ‘A man of yours shall not be cut off from upon the throne of Israel.’
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'you shall not lack a man on the throne of Israel.' The Hebrew is literally, 'a man of yours shall not be cut off from upon the throne of Israel.'
    reason: lexical_alternative
  - marker: b
    text: '''In truth'' can also be rendered ''faithfully'' or ''with integrity.'''
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'he spoke concerning me'; some translations render 'he spoke to me.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 야훼께서 나에 관하여 말씀하신 그의 말씀을 이루시도록 하기 위함입니다. 곧 “만일 네 자손들이 자신들의 길을 지키고, 온 마음과 온 영혼을 다해 진실하게 내 앞에서 걸어가면, 이스라엘의 왕좌 위에서 네게 속한 사람이 끊어지지 않을 것이다”라고 말씀하신 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘나에 관하여 말씀하신’이지만, 일부 번역은 ‘내게 말씀하신’으로 옮깁니다.
    reason: alternative_reading
  - marker: b
    text: ‘진실하게’는 ‘신실하게’ 또는 ‘성실하게’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 조건절 안의 ‘내 앞에서 걸어가다’는 문자적 이동이 아니라 삶의 방식에 대한 비유입니다.
    reason: source_note
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: so that
  chosen_korean: 그리하여 … 하시려는 것입니다
  alternatives_korean:
  - …하도록
  - …하기 위하여
  lexicon: HALOT
  rationale: 목적/결과를 드러내는 표현으로 옮기되, 현대 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: יָקִים
  english_pob_choice: may establish
  chosen_korean: 이루게 하시려는 것입니다
  alternatives_korean:
  - 세우게 하시려는 것입니다
  - 확정하게 하시려는 것입니다
  lexicon: HALOT
  rationale: ‘말씀’을 ‘세우다/이루다’로 옮길 수 있으나, 문맥상 이미 하신 말씀의 성취를 가리켜 ‘이루게 하다’가 가장 자연스럽습니다.
- source_word: דְּבָרוֹ
  english_pob_choice: his word
  chosen_korean: 그의 말씀
  alternatives_korean:
  - 그의 말
  - 그의 약속
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘말씀’이며, 이 맥락에서는 약속의 의미를 포함하지만 ‘말씀’이 원문을 더 가깝게 보존합니다.
- source_word: דִּבֶּר עָלַי
  english_pob_choice: he spoke concerning me
  chosen_korean: 내게 관하여 말씀하신
  alternatives_korean:
  - 내게 말씀하신
  - 나에 대해 말씀하신
  lexicon: HALOT
  rationale: עַל + דבר의 ‘~에 관하여’ 의미를 반영해, 단순한 간접목적어보다 내용 대상성을 살렸습니다.
- source_word: בֶּאֱמֶת
  english_pob_choice: in truth
  chosen_korean: 진실함으로
  alternatives_korean:
  - 진리 안에서
  - 성실하게
  - 정직하게
  lexicon: HALOT
  rationale: אמת는 ‘진실/신실함/성실함’을 아우를 수 있어, 문맥의 언약적 삶의 태도를 살리는 ‘진실함으로’를 택했습니다.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  english_pob_choice: A man of yours shall not be cut off
  chosen_korean: 네게서 한 사람이 끊어지지 않을 것이다
  alternatives_korean:
  - 네가 후손을 잃지 않을 것이다
  - 네게 한 사람이 끊기지 않을 것이다
  lexicon: HALOT
  rationale: כרת의 수동형 이미지를 살려 ‘끊어지다’로 옮겨, 왕위 계승이 끊기는 다윗 왕조의 위협을 드러냈습니다.
theological_decisions:
- issue: 다윗 언약의 조건성
  chosen_reading: 본문의 조건절을 그대로 살려, 자손들의 행실에 따라 왕좌 계승이 유지된다는 긴장을 번역에서 지웠습니다.
  alternative_readings:
  - 조건을 완화해 일반적 권면처럼 옮김
  - 언약의 무조건성을 암시하도록 매끈하게 정리함
  rationale: 히브리어는 분명히 ‘만일’로 조건을 제시하므로, 다른 본문과의 조화를 위해 이를 약화하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: 왕좌 표현의 직역성
  chosen_reading: ‘이스라엘의 왕좌 위에서’로 직역해, 왕권이 단순한 지위가 아니라 다윗 계열의 통치 자리를 가리킨다는 점을 보존했습니다.
  alternative_readings:
  - 이스라엘 왕위에서
  - 이스라엘의 왕위에
  rationale: מֵעַל כִּסֵּא의 ‘~위에서’ 구조를 살려, 왕권 상실의 이미지를 더 직접적으로 전달합니다.
  doctrine_reference: Maintain source-level imagery.
