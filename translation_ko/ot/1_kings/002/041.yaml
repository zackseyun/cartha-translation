base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/041.yaml
  text: And it was reported to Solomon that Shimei had gone from Jerusalem to Gath and had returned.
translation:
  language: ko
  text: 시므이가 예루살렘에서 가드로 갔다가 돌아왔다는 소식이 솔로몬에게 전해졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  english_pob_choice: it was reported
  chosen_korean: ~에게 알려졌는데
  alternatives_korean:
  - ~에게 보고되었는데
  - ~에게 전해졌는데
  lexicon: HALOT
  rationale: 수동적 ‘알려짐’은 행위자를 드러내지 않는 מקור의 수동형을 자연스럽게 살리며, 한국어 서술 흐름에도 무리 없이 맞습니다.
- source_word: לִשְׁלֹמֹה
  english_pob_choice: to Solomon
  chosen_korean: 솔로몬에게
  alternatives_korean:
  - 솔로몬에게로
  lexicon: HALOT
  rationale: 전치사 ל의 수혜자/수신자 용법을 그대로 반영합니다.
- source_word: הָלַךְ ... וַיָּשֹׁב
  english_pob_choice: had gone ... and had returned
  chosen_korean: 갔다가 돌아왔다는
  alternatives_korean:
  - 가서 돌아왔다는
  - 갔고 돌아왔다는
  lexicon: HALOT
  rationale: ‘가다/돌아오다’의 완료된 연속 동작을 한국어의 ‘-다가’ 구성으로 압축해, 보고 내용의 사건 순서를 자연스럽게 드러냅니다.
- source_word: מִירוּשָׁלִַם ... גַּת
  english_pob_choice: from Jerusalem to Gath
  chosen_korean: 예루살렘에서 가드로
  alternatives_korean:
  - 예루살렘에서 가드까지
  - 예루살렘을 떠나 가드로
  lexicon: HALOT
  rationale: 출발점과 목적지를 각각 ‘-에서’와 ‘-로’로 구분해, מקור의 이동 방향을 분명하게 옮겼습니다.
theological_decisions:
- issue: 전달 동사의 대상을 드러내는 방식
  chosen_reading: ‘그것이 솔로몬에게 알려졌는데’라고 옮겨, 행위자를 특정하지 않은 수동 보고를 유지했습니다.
  alternative_readings:
  - ‘사람들이 솔로몬에게 보고했는데’로 능동화
  - ‘솔로몬이 듣게 되었는데’로 완화
  rationale: 본문은 정보가 솔로몬에게 전달되었음을 강조할 뿐, 전달 주체를 밝히지 않습니다. 따라서 능동화로 의미를 보강하지 않았습니다.
  doctrine_reference: 서사 문맥의 익명 보고 표현 보존
