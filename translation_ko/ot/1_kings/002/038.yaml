  text: וַ/יֹּ֨אמֶר שִׁמְעִ֤י לַ/מֶּ֨לֶךְ֙ ט֣וֹב הַ/דָּבָ֔ר כַּ/אֲשֶׁ֤ר דִּבֶּר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֵּ֖ן יַעֲשֶׂ֣ה עַבְדֶּ֑/ךָ וַ/יֵּ֧שֶׁב שִׁמְעִ֛י בִּ/ירוּשָׁלִַ֖ם יָמִ֥ים רַבִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/038.yaml
  text: Shimei said to the king[a], “The word is good. Just as my lord the king has spoken, so your servant will do.” And Shimei lived in Jerusalem many days.
  footnotes:
  - marker: a
    text: Or “The matter is good” or “What you say is good.”
    reason: lexical_alternative
translation:
  language: ko
  text: 시므이가 왕에게 말했습니다. “그 말이 좋습니다.[a] 제 주이신 왕께서 말씀하신 대로 이 종이 그렇게 하겠습니다.” 시므이는 예루살렘에서 여러 날 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 말이 좋습니다’는 “그 일이나 내용이 좋습니다” 또는 “당신이 말씀하신 것이 좋습니다”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב הַדָּבָר
  english_pob_choice: The word is good
  chosen_korean: 그 말이 좋습니다
  alternatives_korean:
  - 그 일이 좋습니다
  - 그 내용이 좋습니다
  - 말씀이 좋습니다
  lexicon: HALOT
  rationale: דָּבָר는 여기서 왕이 한 말/명령을 가리키므로, 문맥상 자연스럽고 직접적인 ‘그 말’로 옮겼습니다. ‘좋습니다’는 시므이의 수긍을 현대 한국어로 간결하게 드러냅니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: 제 주 왕
  alternatives_korean:
  - 나의 주 왕
  - 내 주 왕
  - 왕이신 내 주
  lexicon: HALOT
  rationale: 아도니의 공손한 왕실 호칭을 한국어의 존대 표현으로 살리기 위해 ‘제 주 왕’으로 옮겼습니다. ‘주 왕’은 주종 뉘앙스를 유지하면서도 지나치게 교회적이지 않게 합니다.
- source_word: כֵּן יַעֲשֶׂה עַבְדֶּךָ
  english_pob_choice: so your servant will do
  chosen_korean: 당신의 종이 그렇게 하겠습니다
  alternatives_korean:
  - 당신의 종이 그리하겠습니다
  - 당신의 종이 그렇게 할 것입니다
  - 당신의 종이 따르겠습니다
  lexicon: HALOT
  rationale: עֶבֶד는 여기서 궁정에서 쓰는 자기비하적 호칭이므로 ‘종’을 유지했습니다. 동사구는 서약의 뉘앙스를 살려 ‘그렇게 하겠습니다’로 자연스럽게 옮겼습니다.
- source_word: וַיֵּשֶׁב
  english_pob_choice: lived
  chosen_korean: 머물렀습니다
  alternatives_korean:
  - 살았습니다
  - 거주했습니다
  - 거하였습니다
  lexicon: HALOT
  rationale: 이 문맥은 예루살렘에서의 제한된 체류를 말하므로, 단순한 정주보다 ‘머물렀습니다’가 더 정확합니다. יָשַׁב의 거주 의미를 유지하면서도 상황의 제약을 드러냅니다.
theological_decisions:
- issue: 시므이의 왕에 대한 복종 서약의 어조
  chosen_reading: 직접 인용문 안에서 높임을 유지하되, 고어체 대신 현대 합쇼체로 표현했습니다.
  alternative_readings:
  - ‘제가 하겠습니다’로 더 중립적으로 옮기는 방식
  - ‘하겠나이다’ 같은 전통적 경어를 쓰는 방식
  rationale: 본문은 궁정 대화이므로 극존대가 필요하지만, 번역 목표가 현대 표준어이므로 합쇼체가 원문의 공손성과 현대 가독성을 함께 살립니다.
  doctrine_reference: 문체/화행 결정
