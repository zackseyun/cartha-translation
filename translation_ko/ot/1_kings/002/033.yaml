  yaml_path: translation/ot/1_kings/002/033.yaml
  text: So their blood shall return on the head of Joab and on the head of his offspring forever[a], but for David and for his offspring and for his house and for his throne, there shall be peace forever from Yahweh.
  footnotes:
  - marker: a
    text: Hebrew 'their blood,' an idiom referring to responsibility for the blood they shed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 피가 영원히 요압의 머리 위와 그의 자손의 머리 위로 돌아갈 것입니다.[a] 그러나 다윗과 그의 자손과 그의 집과 그의 왕좌에는 야훼에게서 영원히 평화가 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그들의 피’는 그들이 흘리게 한 피에 대한 책임이 그들에게 돌아감을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ דְמֵיהֶם
  english_pob_choice: their blood shall return
  chosen_korean: 그들의 피가 … 돌아가고
  alternatives_korean:
  - 그들의 피가 … 되돌아오고
  - 그들의 피의 책임이 … 돌아가고
  lexicon: HALOT
  rationale: 히브리어의 직역 이미지를 살리면서, 문맥상 유혈의 책임이 가해자에게 되돌아오는 법정적 의미를 한국어 동사 ‘돌아가다’로 드러냈습니다.
- source_word: בְּרֹאשׁ
  english_pob_choice: on the head of
  chosen_korean: 머리와
  alternatives_korean:
  - 머리 위에
  - 머리로
  lexicon: HALOT
  rationale: ‘머리 위에’의 관용적 책임 부담 이미지를 유지하되, 한국어에서는 ‘머리로’가 더 자연스럽고 심판의 귀착을 분명히 합니다.
- source_word: זַרְעוֹ
  english_pob_choice: his offspring
  chosen_korean: 그의 자손
  alternatives_korean:
  - 그의 후손
  - 그의 씨
  lexicon: HALOT
  rationale: 현대 한국어에서 집단적 후대를 자연스럽게 가리키며, ‘씨’의 문자주의보다 읽기 쉬운 표현입니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 안녕
  lexicon: HALOT
  rationale: 왕조적·언약적 배경을 가진 שָׁלוֹם을 단순한 심리적 평안보다 더 넓은 안정과 복을 담는 ‘평강’으로 옮겼습니다.
theological_decisions:
- issue: 요압의 집에 대한 심판과 다윗의 집에 대한 축복의 대비
  chosen_reading: 전반부는 피의 책임이 되돌아오는 심판으로, 후반부는 야훼에게서 오는 평강의 약속으로 대비를 살렸습니다.
  alternative_readings:
  - 두 절을 단순 병렬로 처리하기
  - ‘그러나’를 명시적으로 넣지 않기
  rationale: 히브리어 접속사는 형식상 병렬이지만 문맥상 요압에 대한 저주와 다윗에 대한 축복이 선명히 대조되므로, 한국어에서도 그 긴장을 분명히 드러내는 것이 소스 의미에 충실합니다.
  doctrine_reference: 'Translation philosophy: optimal-equivalence; preserve source sense in readable modern Korean.'
