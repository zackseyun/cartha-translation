  text: וַ/יִּשָּׁבַע֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף כִּ֣י בְ/נַפְשׁ֔/וֹ דִּבֶּר֙ אֲדֹ֣נִיָּ֔הוּ אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/023.yaml
  text: Then King Solomon swore by Yahweh[a], saying, “May God do so to me, and more also[b], for Adonijah has spoken this word against his own life.”
  footnotes:
  - marker: a
    text: Or 'by Yahweh.' The Hebrew divine name is יְהוָה.
    reason: alternative_reading
  - marker: b
    text: 'Hebrew idiom: ''has spoken this word with/against his life,'' meaning he has said something that puts his life in jeopardy or costs him his life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 솔로몬 왕이 야훼를 두고 맹세하며 말했습니다. “하나님이 내게 그렇게 하시고, 그보다 더하시기를 바라노니, 아도니야가 자기 생명을 걸고 이 말을 하였기 때문입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 여호와(YHWH)는 학술적 표기인 ‘야훼’로 옮겼습니다.
    reason: ot_citation
  - marker: b
    text: ‘자기 생명을 걸고’는 히브리어 ‘그의 생명 안에서’라는 관용구를 한국어 관용으로 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  english_pob_choice: swore
  chosen_korean: 맹세하며 말했습니다
  alternatives_korean:
  - 맹세했습니다
  - 맹세하며 이르렀습니다
  lexicon: HALOT
  rationale: 서사 문맥에서 ‘swore’는 ‘맹세하다’가 자연스럽고, 합쇼체 서술로는 ‘맹세하며 말했습니다’가 서술과 발화를 함께 살립니다.
- source_word: בַּיהוָה
  english_pob_choice: by Yahweh
  chosen_korean: 야훼를 두고
  alternatives_korean:
  - 야훼로
  - 야훼의 이름으로
  lexicon: HALOT
  rationale: 히브리어 전치사 בְּ는 맹세의 대상/근거를 나타내므로, 한국어에서는 ‘~를 두고’가 가장 직접적이고 자연스럽습니다.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  english_pob_choice: May God do so to me, and more also
  chosen_korean: 하나님이 내게 그렇게 하시고, 그보다 더하시기를 바라노니
  alternatives_korean:
  - 하나님이 내게 그렇게 하시고, 더하실지라도
  - 하나님이 내게 이처럼 하시고 더욱 더하시기를 바라노니
  lexicon: HALOT
  rationale: 고정된 맹세/저주 공식이므로, 직역보다 한국어로도 그 격식을 살리는 관용적 기도를 택했습니다. ‘바라노니’는 강한 자기저주적 맹세의 문체를 유지합니다.
- source_word: בְנַפְשׁוֹ
  english_pob_choice: against his own life
  chosen_korean: 자기 생명을 걸고
  alternatives_korean:
  - 자기 생명에 대하여
  - 자기 목숨을 걸고
  - 자기 생명에 걸쳐
  lexicon: HALOT
  rationale: 직역하면 ‘그의 생명/혼 안에서’이지만, 여기서는 아도니야의 발언이 자신의 생명을 위험에 빠뜨리는 의미이므로 한국어 관용으로 그 긴장을 살렸습니다.
- source_word: דִּבֶּר ... אֶת־הַדָּבָר הַזֶּה
  english_pob_choice: has spoken this word
  chosen_korean: 이 말을 하였기 때문입니다
  alternatives_korean:
  - 이 말을 하였기 때문에
  - 이 일을 말하였기 때문입니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘이 말을 말하다’이지만, 한국어에서는 자연스럽게 ‘이 말을 하다’로 옮기되, 발화 내용의 특정성을 유지했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 야훼의 이름이 직접 나오므로, 프로젝트 기본어에 따라 ‘야훼’로 유지해 언약 სახელ을 가리키는 본문의 직접성을 살렸습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 맹세 공식의 강한 자기저주 뉘앙스
  chosen_reading: ‘하나님이 내게 그렇게 하시고, 그보다 더하시기를 바라노니’로 유지
  alternative_readings:
  - 완화하여 일반적 서술로 옮김
  - 단순히 ‘하나님이 내게 그렇게 하실 것이다’로 처리
  rationale: 이 구절은 단순한 강조가 아니라 미완결된 저주적 맹세 공식이므로, 한국어에서도 그 긴장과 위협성을 약화시키지 않도록 했습니다.
  doctrine_reference: Textual/pragmatic force of oath formula in 1 Kgs 2:23
