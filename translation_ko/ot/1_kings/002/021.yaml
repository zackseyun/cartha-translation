  - 수넴 여인
  - 수넴 사람 여자
  lexicon: HALOT
  rationale: 지명 유래의 여성형 별칭을 한국어에서 통용되는 의미가 드러나도록 옮겼습니다.
- source_word: לְאִשָּׁה
  english_pob_choice: as a wife
  chosen_korean: 아내로
  alternatives_korean:
  - 아내로서
  - 아내가 되게
  - 결혼하여
  lexicon: HALOT
  rationale: 결혼 관계의 결과를 자연스러운 현대 한국어로 표현하되, 단순한 목적어가 아니라 혼인 지위를 뜻하는 점을 유지했습니다.
theological_decisions:
- issue: 솔로몬에게 하는 요청의 공손한 명령형 처리
  chosen_reading: 직접 인용 안에서는 「주십시오」를 사용해 청유의 힘을 보존했습니다.
  alternative_readings:
  - 「주어지게 하십시오」
  - 「주게 하십시오」
  rationale: 히브리어 수동 청유 יֻתַּן의 요청성은 약화시키지 않고, 한국어에서 가장 자연스럽게 들리는 공손한 요청형으로 옮겼습니다.
  doctrine_reference: 담화 기능 보존
- issue: 이름 뒤 지명형 별칭의 의미 전달
  chosen_reading: הַשֻּׁנַמִּית를 ‘수넴 여자’로 옮겼습니다.
  alternative_readings:
  - ‘수넴 사람’
  - ‘수넴 여인’
  rationale: 이 표현은 아비삭의 출신을 식별하는 표지이므로, 단순 고유명사화보다 의미가 드러나는 번역이 적절합니다.
  doctrine_reference: 본문 식별성 유지
