  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 한국어의 자연스러운 서사체로 옮기되, 불필요한 접속사를 덧붙이지 않았습니다.
- source_word: יֻתַּן
  english_pob_choice: Let ... be given
  chosen_korean: 주십시오
  alternatives_korean:
  - 주어지게 하십시오
  - 주게 하십시오
  - 주십시오
  lexicon: HALOT
  rationale: 수동 사역적 청유를 한국어의 직접적 요청 표현으로 살려, 요청·제안을 분명히 드러냈습니다.
- source_word: הַשֻּׁנַמִּית
  english_pob_choice: the Shunammite
  chosen_korean: 수넴 여자
  alternatives_korean:
