  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵשִׁיב֩ יְהוָ֨ה אֶת דָּמ֜/וֹ עַל רֹאשׁ֗/וֹ אֲשֶׁ֣ר פָּגַ֣ע בִּ/שְׁנֵֽי אֲ֠נָשִׁים צַדִּקִ֨ים וְ/טֹבִ֤ים מִמֶּ֨/נּוּ֙ וַ/יַּהַרְגֵ֣/ם בַּ/חֶ֔רֶב וְ/אָבִ֥/י דָוִ֖ד לֹ֣א יָדָ֑ע אֶת אַבְנֵ֤ר בֶּן נֵר֙ שַׂר צְבָ֣א יִשְׂרָאֵ֔ל וְ/אֶת עֲמָשָׂ֥א בֶן יֶ֖תֶר שַׂר צְבָ֥א יְהוּדָֽה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/032.yaml
  text: 'And Yahweh will return his blood on his own head[a], because he struck down two men more righteous and better than he, and killed them with the sword while my father David did not know it: Abner son of Ner, commander of Israel’s army, and Amasa son of Jether, commander of Judah’s army.'
  footnotes:
  - marker: a
    text: Or, 'his bloodguilt on his head.' The Hebrew idiom speaks of responsibility for bloodshed returning upon the guilty person.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 그의 피를 그의 머리 위로 돌려보내실 것입니다. 그가 자기보다 더 의롭고 더 나은 두 사람을 쳤고, 칼로 죽였기 때문입니다. 내 아버지 다윗은 그것을 알지 못했습니다. 곧 이스라엘 군대의 사령관 넬의 아들 아브넬과 유다 군대의 사령관 예델의 아들 아마사입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 그를 죽인 일에 대한 책임이 그에게 돌아간다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 한국어 성경 독자에게는 통용 관행을 고려해 ‘여호와’로 옮기되, 원문 신명은 그대로 반영했습니다.
- source_word: וְהֵשִׁיב
  english_pob_choice: will return
  chosen_korean: 돌려보내실 것입니다
  alternatives_korean:
  - 되돌리실 것입니다
  - 갚으실 것입니다
  lexicon: HALOT
  rationale: 보복·응보의 관용적 의미를 살리면서도 ‘돌리다’의 이미지와 ‘그의 머리 위로’라는 후속 관용구를 함께 보존했습니다.
- source_word: דָּמוֹ ... עַל רֹאשׁוֹ
  english_pob_choice: his blood on his own head
  chosen_korean: 그의 피를 그의 머리 위로
  alternatives_korean:
  - 그의 피값을 그의 머리 위로
  - 그의 피의 책임을 그의 머리 위로
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살려 책임이 행위자에게 되돌아간다는 뜻을 드러냈습니다.
- source_word: צַדִּקִים וְטֹבִים מִמֶּנּוּ
  english_pob_choice: more righteous and better than he
  chosen_korean: 더 의롭고 더 나은
  alternatives_korean:
  - 더 의롭고 더 선한
  - 더 의롭고 더 뛰어난
  lexicon: HALOT
  rationale: צַדִּיקִים의 도덕·법적 평가를 ‘의롭다’로, טוֹבִים의 비교 평가는 ‘나은’으로 옮겨 두 형용사의 중복이 주는 강조를 보존했습니다.
- source_word: שַׂר צְבָא יִשְׂרָאֵל / יְהוּדָה
  english_pob_choice: commander of Israel’s army / commander of Judah’s army
  chosen_korean: 이스라엘 군대의 사령관 / 유다 군대의 사령관
  alternatives_korean:
  - 이스라엘 군대의 지휘관
  - 이스라엘 군대의 대장
  lexicon: HALOT
  rationale: שַׂר צָבָא의 군사적 직함을 현대 한국어의 공식적인 관직어인 ‘사령관’으로 옮겨 문맥의 위계를 분명히 했습니다.
theological_decisions:
- issue: 여호와 신명 표기
  chosen_reading: 본문에는 ‘여호와’를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 절의 원문은 YHWH를 직접 사용하므로 신명성을 드러내되, 한국어 교회 독자에게 익숙한 표기는 ‘여호와’입니다. 본 프로젝트 기본값인 ‘야훼’와의 차이는 한국어 수용성을 위한 번안 선택입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: 피가 머리 위로 돌아간다는 관용구
  chosen_reading: 살인에 대한 책임과 보응이 가해자에게 돌아간다는 뜻으로 이해하고 번역했습니다.
  alternative_readings:
  - 피가 실제로 머리 위에 놓인다는 문자적 이해
  - 피의 책임이 그의 머리 위에 있다
  rationale: 문맥상 물리적 묘사가 아니라 혈죄와 응보를 말하는 관용구이므로, 직역 이미지를 유지하면서 의미를 한국어로 분명하게 드러냈습니다.
  doctrine_reference: 혈죄와 신적 보응에 관한 구약 법적 관용구
