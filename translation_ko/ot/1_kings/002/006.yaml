    text: ‘스올’은 히브리어로 죽은 자들의 영역을 가리키며, 또는 ‘무덤’으로 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: Act
  chosen_korean: 행하고
  alternatives_korean:
  - 하십시오
  - 실행하십시오
  - 처리하십시오
  lexicon: HALOT
  rationale: עשה는 여기서 구체적 행위 지시로 쓰였으므로, 직설적이되 문맥에 맞는 ‘행하고’로 옮겨 명령의 실천성을 살렸습니다.
- source_word: כְּחָכְמָתֶךָ
  english_pob_choice: according to your wisdom
  chosen_korean: 지혜대로
  alternatives_korean:
  - 당신의 지혜에 따라
  - 지혜에 맞게
  - 지혜에 따라
  lexicon: HALOT
  rationale: כ + ‘당신의 지혜’는 단순 수단이 아니라 그 지혜에 맞춘 판단을 뜻하므로, 한국어에서는 간결한 ‘지혜대로’가 자연스럽고 원뜻을 유지합니다.
- source_word: שֵׂיבָתוֹ
  english_pob_choice: his gray head
  chosen_korean: 그의 백발
  alternatives_korean:
  - 그의 회백색 머리
  - 그의 늙은 머리
  - 그의 백발머리
  lexicon: HALOT
  rationale: שֵׂיבָה는 백발/노년을 가리키는 관용 표현이므로, ‘백발’로 옮겨 노쇠한 인물을 가리키는 이미지와 함의를 보존했습니다.
- source_word: שְׁאֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자들의 세계
  - 사망의 영역
  lexicon: HALOT
  rationale: 문맥상 단순 매장지가 아니라 죽은 자의 영역을 가리키는 המקרא 용어이므로, 번역어로 평면화하지 않고 음역 ‘스올’을 유지했습니다.
theological_decisions:
- issue: שְׁאֹל의 처리
  chosen_reading: ‘스올’로 음역하여 히브리 성경의 사자(死者) 영역 개념을 보존했습니다.
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  rationale: 이 구절은 조용한 장례가 아니라 심판과 결부된 죽음의 귀결을 말하므로, ‘무덤’으로 좁히면 개념의 범위가 축소됩니다. 음역은 본문이 가진 신학적 긴장을 그대로 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3
