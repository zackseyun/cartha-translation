  text: וַ/יָּבֹ֨א בְנָיָ֜הוּ אֶל אֹ֣הֶל יְהוָ֗ה וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר הַ/מֶּ֨לֶךְ֙ צֵ֔א וַ/יֹּ֥אמֶר לֹ֖א כִּ֣י פֹ֣ה אָמ֑וּת וַ/יָּ֨שֶׁב בְּנָיָ֤הוּ אֶת הַ/מֶּ֨לֶךְ֙ דָּבָ֣ר לֵ/אמֹ֔ר כֹּֽה דִבֶּ֥ר יוֹאָ֖ב וְ/כֹ֥ה עָנָֽ/נִי־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/030.yaml
  text: 'Then Benaiah came to the tent of Yahweh and said to him[a], “Thus says the king: ‘Come out.’” But he said, “No, for I will die here.” And Benaiah brought word back to the king, saying, “Thus Joab spoke, and thus he answered me.”'
  footnotes:
  - marker: a
    text: Or, “the tabernacle of the LORD.” The Hebrew reads “the tent of the LORD.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 브나야가 야훼의 장막에 들어가 그에게 말했습니다. 「왕이 이렇게 말씀하셨습니다. ‘나와라.’」 그러나 그가 말했습니다. 「아니오, 나는 여기서 죽겠습니다.」 브나야는 왕에게 돌아와 말했습니다. 「요압이 이렇게 말했고, 이렇게 대답했습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘야훼의 장막’입니다. POB의 영어 본문은 이를 ‘the tent of the LORD’로 옮기며, ‘tabernacle’은 가능한 해석적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל יְהוָה
  english_pob_choice: the tent of the LORD
  chosen_korean: 야훼의 장막
  alternatives_korean:
  - 야훼의 천막
  - 야훼의 성막
  lexicon: HALOT
  rationale: אֹהֶל은 기본적으로 ‘장막/천막’이라는 뜻이므로, 본문이 말하는 물리적 공간을 직접 살리기 위해 ‘장막’으로 옮겼습니다. ‘성막’은 전통적 해석을 더 강하게 반영할 수 있어 여기서는 덜 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명는 일반 호칭이 아니라 고유명사이므로, POB의 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: כֹה אָמַר הַמֶּלֶךְ
  english_pob_choice: Thus says the king
  chosen_korean: 왕이 이렇게 말씀하셨습니다
  alternatives_korean:
  - 왕이 이렇게 말합니다
  - 이것이 왕의 말씀입니다
  lexicon: HALOT
  rationale: 왕의 전령 공식은 한국어에서 지나치게 딱딱한 고어보다 현대적 보고체가 자연스럽습니다. 과거 보고 맥락이므로 ‘말씀하셨습니다’로 과거성을 살렸습니다.
- source_word: צֵא
  english_pob_choice: Come out
  chosen_korean: 나와라
  alternatives_korean:
  - 나오십시오
  - 나가라
  lexicon: HALOT
  rationale: 직접명령의 압박감을 살리면서도, 인물 간 대화의 생동감을 유지하기 위해 명령형 ‘나와라’를 선택했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 번역
  chosen_reading: 본문의 고유명사로서 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 יְהוָה를 직접 사용하므로, 제목적 호칭인 ‘주님’보다 고유한 언약명인 ‘야훼’가 원문을 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
