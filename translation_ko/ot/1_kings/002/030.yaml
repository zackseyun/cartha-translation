- from: 그때 브나야가 야훼의 장막에 들어가 그에게 말했습니다. 「왕이 이렇게 말씀하셨습니다. ‘나와라.’」 그러나 그가 말했습니다. 「아니오, 나는 여기서 죽겠습니다.」 브나야는 왕에게 돌아와 말했습니다. 「요압이 이렇게 말했고, 이렇게 대답했습니다.」[a]
  to: 그때 브나야가 야훼의 장막에 이르러 요압에게 말했습니다. 「왕께서 이렇게 말씀하셨습니다. ‘나오십시오.’」 그러나 요압이 말했습니다. 「아니요, 저는 여기서 죽겠습니다.」 브나야는 왕에게 돌아가 말했습니다. 「요압이 이렇게 말하고, 저에게 이렇게 대답했습니다.」
  rationale: 장막 안으로 들어갔다는 추가 함의를 제거하고, 요압이 브나야에게 대답했다는 원문의 인칭 관계를 복원했습니다. 한국어 본문에 실질적 정보를 더하지 않는 영어 중심의 각주는 삭제했습니다.
