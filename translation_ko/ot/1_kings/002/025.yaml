base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/025.yaml
  text: So King Solomon sent Benaiah son of Jehoiada[a], and he struck him down, and he died.
  footnotes:
  - marker: a
    text: Literally, 'sent by the hand of Benaiah son of Jehoiada,' an idiom meaning he sent him as his agent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 솔로몬 왕이 여호야다의 아들 브나야를 보내어 그를 치게 했고, 그가 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘여호야다의 아들 브나야의 손으로’라고 되어 있으며, 대리/도구를 나타내는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ שְׁלֹמֹה
  english_pob_choice: So King Solomon sent
  chosen_korean: 그러자 솔로몬 왕이 … 보내어
  alternatives_korean:
  - 솔로몬 왕이 보냈습니다
  - 솔로몬 왕이 파견했습니다
  lexicon: HALOT
  rationale: שׁלח의 기본 의미를 살리되, 한국어에서는 ‘보내다’가 가장 자연스럽고 서술 흐름도 잘 드러납니다.
- source_word: בְּיַד בְּנָיָהוּ בֶן יְהוֹיָדָע
  english_pob_choice: sent Benaiah son of Jehoiada
  chosen_korean: 여호야다의 아들 브나야를
  alternatives_korean:
  - 브나야를 통해
  - 브나야의 손으로
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘~의 손으로’는 대리/도구를 뜻하지만, 문맥상 브나야가 실행자라는 점을 한국어 본문에서는 직접적으로 풀어 옮기는 편이 자연스럽습니다.
- source_word: וַיִּפְגַּע בּוֹ
  english_pob_choice: he struck him down
  chosen_korean: 그를 치게 했고
  alternatives_korean:
  - 그를 공격했고
  - 그를 쳐서
  lexicon: HALOT
  rationale: פגע ב의 공격적·치명적 의미를 반영하되, 죽음은 다음 절의 결과 진술로 남겨 히브리어의 서술 순서를 보존했습니다.
- source_word: וַיָּמֹת
  english_pob_choice: and he died
  chosen_korean: 그가 죽었습니다
  alternatives_korean:
  - 그리고 그가 죽었습니다
  - 그리하여 죽었습니다
  lexicon: HALOT
  rationale: 히브리어의 단순한 결과 진술을 평이한 합쇼체로 옮겼습니다.
theological_decisions:
- issue: 사형 집행의 서술 방식
  chosen_reading: 본문의 행위 주체를 솔로몬의 명령-파견과 브나야의 집행으로 분리해, 왕권 행사와 실행을 함께 드러냈습니다.
  alternative_readings:
  - 솔로몬이 직접 그를 쳐 죽였다
  - 브나야만을 주어로 두어 왕의 명령을 약화시킨다
  rationale: 히브리어는 왕이 보내고, 대리자인 브나야가 치며, 그 결과 죽는다는 연쇄를 보여 주므로, 이를 한국어에서도 분리해 드러내는 것이 본문 의미에 가장 충실합니다.
  doctrine_reference: 본문 서술의 역사적-서사적 의미 보존
- issue: 문장 연결어
  chosen_reading: ‘그러자’로 앞선 서사의 즉각적 진행과 판결 집행의 연결을 표시했습니다.
  alternative_readings:
  - 그리고
  - 그때
  rationale: 히브리어 waw 연속의 서사 진행을 한국어에서 자연스럽게 드러내는 연결어입니다.
  doctrine_reference: 서사 흐름 보존
