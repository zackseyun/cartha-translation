    rationale: וַיִּפְגַּע בּוֹ의 주어는 앞서 파견된 브나야입니다. 솔로몬의 파견과 브나야의 타격을 각각 서술하는 편이 원문의 서사 연쇄에 충실합니다.
  - severity: low
