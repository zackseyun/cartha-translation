  source_fidelity: 개정이 필요합니다. 초안의 ‘그를 치게 했고’는 솔로몬이 브나야에게 치도록 명령했다는 인과를 전면화하지만, 히브리어는 솔로몬이 브나야를 보내고 이어 브나야가 그를 친다는 행위 연쇄를 서술합니다. 브나야를 두 번째 절의 명시적 주어로 밝혀야 합니다.
  naturalness: 합쇼체 서술로 자연스럽게 다듬을 수 있습니다. ‘브나야가 그를 쳤고, 그는 죽었습니다’는 앞 문맥의 대상(아도니야)을 가리키는 대명사를 유지하면서도 행위 주체를 분명히 합니다.
  terminology: 인명 ‘솔로몬’, ‘여호야다’, ‘브나야’는 적절합니다. בְּיָד의 대리·매개 관용구는 본문에서 자연스럽게 풀고, 해당 명사구 바로 뒤에 각주를 두어 문자적 표현을 보존합니다.
