base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/020.yaml
  text: She said, “I am asking one small request of you; do not turn away my face.” And the king said to her, “Ask, my mother, for I will not turn away your face.”
translation:
  language: ko
  text: 그가 말했습니다. “제가 당신께 드리는 작은 한 가지 청이 있습니다. 제 얼굴을 외면하지 마십시오.” 왕이 그에게 말했습니다. “청하십시오, 어머니. 제가 당신의 얼굴을 외면하지 않겠습니다.”[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 “제 얼굴을 돌리지 마십시오”입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁאֵלָה אַחַת קְטַנָּה
  english_pob_choice: one small request
  chosen_korean: 작은 한 가지 청
  alternatives_korean:
  - 작은 부탁 하나
  - 사소한 한 가지 요청
  lexicon: שׁאל / 요청하다
  rationale: 원문의 ‘한 가지’와 ‘작은’의 중첩을 살리면서, 왕 앞에서의 청원 맥락에는 ‘청’이 가장 자연스럽고 격식에 맞습니다.
- source_word: אַל תָּשֶׁב אֶת פָּנַי
  english_pob_choice: do not turn away my face
  chosen_korean: 제 얼굴을 외면하지 마십시오
  alternatives_korean:
  - 제 얼굴을 돌리지 마십시오
  - 제 얼굴을 거절하지 마십시오
  lexicon: פנה / 얼굴을 향하다, 돌리다
  rationale: 직역적 ‘얼굴’ 이미지를 유지하되, 한국어에서는 ‘외면하다’가 관계적 거절과 시선의 회피를 함께 자연스럽게 드러냅니다.
- source_word: לֹא אָשִׁיב אֶת פָּנַיִךְ
  english_pob_choice: I will not turn away your face
  chosen_korean: 제가 당신의 얼굴을 외면하지 않겠습니다
  alternatives_korean:
  - 당신의 얼굴을 돌리지 않겠습니다
  - 당신을 거절하지 않겠습니다
  lexicon: פנה / 얼굴을 향하다, 돌리다
  rationale: 앞절과 같은 어휘를 맞추어 대칭을 살렸고, 왕의 답변도 동일한 이미지로 연결했습니다.
- source_word: אִמִּי
  english_pob_choice: my mother
  chosen_korean: 어머니
  alternatives_korean:
  - 저의 어머니
  - 어머님
  lexicon: אם / 어머니
  rationale: 히브리어의 친밀하고 존중 어린 호칭을 살리되, 한국어에서는 직접 호칭으로 ‘어머니’가 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: 히브리어 ‘얼굴’ 관용구의 번역 방식
  chosen_reading: 관용적 의미를 풀되 원문 이미지를 보존하여 ‘얼굴을 외면하다’로 옮겼습니다.
  alternative_readings:
  - ‘거절하다’로 의미만 옮김
  - ‘얼굴을 돌리다’로 더 직역
  rationale: 본문은 단순한 시선 회피보다 왕의 인정과 청원을 받아들이지 않는 관계적 거절을 암시하므로, 이미지와 의미를 함께 전달하는 표현이 적절합니다.
  doctrine_reference: 서사 문맥의 화행과 관용구 해석
- issue: 왕의 호칭 ‘어머니’의 유지
  chosen_reading: 솔로몬의 응답에서 관계의 친밀함과 예우를 드러내는 ‘어머니’를 그대로 유지했습니다.
  alternative_readings:
  - ‘어머님’으로 더 공손하게 조정
  - 호칭을 완화해 ‘부인’처럼 처리
  rationale: 원문은 혈연 관계를 직접 지칭하므로, 예우를 유지하되 관계 자체를 흐리지 않는 직역이 필요합니다.
  doctrine_reference: 본문 서사의 인물 관계
