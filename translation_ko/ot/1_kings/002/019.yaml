id: 1KI.2.19
reference: 1 Kings 2:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּבֹ֤א בַת שֶׁ֨בַע֙ אֶל הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה לְ/דַבֶּר ל֖/וֹ עַל אֲדֹנִיָּ֑הוּ וַ/יָּקָם֩ הַ/מֶּ֨לֶךְ לִ/קְרָאתָ֜/הּ וַ/יִּשְׁתַּ֣חוּ לָ֗/הּ וַ/יֵּ֨שֶׁב֙ עַל כִּסְא֔/וֹ וַ/יָּ֤שֶׂם כִּסֵּא֙ לְ/אֵ֣ם הַ/מֶּ֔לֶךְ וַ/תֵּ֖שֶׁב לִֽ/ימִינֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/019.yaml
  text: Then Bathsheba came to King Solomon to speak to him about Adonijah. And the king rose to meet her and bowed down to her, then sat on his throne and had a throne set for the king’s mother, and she sat at his right hand.
translation:
  language: ko
  text: 그때 밧세바가 아도니야에 관하여 솔로몬 왕에게 말하려고 왔습니다. 왕은 그녀를 맞으려고 일어나 그녀에게 절하고, 자기 왕좌에 앉았습니다. 또 왕의 어머니를 위하여 왕좌를 마련하였으며, 그녀는 그의 오른편에 앉았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַת שֶׁבַע
  english_pob_choice: Bathsheba
  chosen_korean: 밧세바
  alternatives_korean:
  - 바스세바
  - 밧쉬바
  lexicon: 고유명사
  rationale: 성경 고유명사로 널리 통용되는 형태를 따르되, 현대 표기법에 맞는 밧세바를 사용했습니다.
- source_word: וַיִּשְׁתַּחוּ לָהּ
  english_pob_choice: bowed down to her
  chosen_korean: 그녀에게 절한 뒤
  alternatives_korean:
  - 그녀 앞에 엎드렸습니다
  - 그녀에게 경배했습니다
  lexicon: 절하다
  rationale: 문맥상 왕이 왕의 어머니에게 보인 예우를 나타내므로, 종교적 ‘경배’보다 일반적 존대 행위인 ‘절하다’를 택했습니다.
- source_word: כִּסֵּא לְאֵם הַמֶּלֶךְ
  english_pob_choice: a throne set for the king’s mother
  chosen_korean: 왕의 어머니를 위해 왕좌를 마련하게 했으며
  alternatives_korean:
  - 왕의 어머니를 위한 왕좌를 놓게 했으며
  - 왕의 어머니에게 의자를 내주게 했으며
  lexicon: 왕좌
  rationale: 히브리어 כִּסֵּא는 단순 의자보다 왕실의 권위를 지닌 ‘왕좌’가 더 직접적이므로 그렇게 옮겼습니다.
- source_word: לִימִינֹו
  english_pob_choice: at his right hand
  chosen_korean: 그의 오른편에
  alternatives_korean:
  - 그의 오른쪽에
  - 그의 우편에
  lexicon: 오른편
  rationale: 권위와 명예의 자리라는 함의를 살리면서도 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
theological_decisions:
- issue: 왕이 어머니에게 보이는 예우의 성격
  chosen_reading: 본문의 절은 예배 행위가 아니라 왕실 내 위계와 존중을 드러내는 예우로 읽었습니다.
  alternative_readings:
  - 종교적 경배로 이해하는 읽기
  - 단순한 인사로 약화하는 읽기
  rationale: 히브리어 동사와 장면 전체가 궁중 예법을 보여 주므로, 예배적 의미를 덧씌우지 않으면서도 지나치게 약화하지 않았습니다.
  doctrine_reference: 본문 문맥 우선의 서사 해석
- issue: 왕의 어머니의 지위
  chosen_reading: ‘왕의 어머니’를 그대로 살려 모후적 지위를 드러냈습니다.
  alternative_readings:
  - 왕비
  - 어머니
  rationale: 히브리어 אֵם הַמֶּלֶךְ는 단순한 ‘어머니’보다 왕권과 관련된 공식적 호칭이므로, 서사적·정치적 의미를 보존했습니다.
  doctrine_reference: 구약 왕정 서사
