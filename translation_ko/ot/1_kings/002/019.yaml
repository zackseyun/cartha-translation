  source_fidelity: 히브리어의 사건 순서와 핵심 동작(밧세바의 방문, 솔로몬의 영접과 절, 자신의 왕좌에 앉음, 왕의 어머니를 위한 왕좌 마련, 오른편 착석)은 대체로 반영되었습니다. 그러나 ‘그에게 절한’은 직전의 여성 지시 대상인 밧세바와 맞지 않는 남성 대명사 선택으로, 원문의 여성 접미사 לָהּ(그녀에게)를 바로잡아야 합니다. ‘말하려고 했습니다’도 방문의 목적을 나타내지만, ‘말하려고 왔습니다’가 לְדַבֶּר־לוֹ와 וַתָּבֹא의 연결을 더 정확히 드러냅니다.
