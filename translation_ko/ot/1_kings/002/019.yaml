  terminology: ‘밧세바’, ‘솔로몬’, ‘아도니야’, ‘왕좌’, ‘오른편’은 통용되는 성경 고유명사와 적절한 왕실 용어입니다. 절을 종교적 경배로 과도하게 해석하지 않고 ‘절했습니다’로 유지했습니다.
