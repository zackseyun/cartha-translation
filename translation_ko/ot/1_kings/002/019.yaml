revisions:
- from: 그때 밧세바가 솔로몬 왕에게 와서 아도니야에 대해 말하려고 했습니다. 왕이 그녀를 맞으러 일어나 그에게 절한 뒤, 자기 왕좌에 앉고 왕의 어머니를 위해 왕좌를 마련하게 했으며, 그녀는 그의 오른편에 앉았습니다.
  to: 그때 밧세바가 아도니야에 관하여 솔로몬 왕에게 말하려고 왔습니다. 왕은 그녀를 맞으려고 일어나 그녀에게 절하고, 자기 왕좌에 앉았습니다. 또 왕의 어머니를 위하여 왕좌를 마련하였으며, 그녀는 그의 오른편에 앉았습니다.
  rationale: 필수적인 여성 대명사 오류를 ‘그녀에게’로 바로잡았습니다. 또한 원문의 목적구와 방문 동사를 자연스럽고 직접적으로 반영하도록 첫 문장을 조정했습니다. 왕이 왕의 어머니를 위해 자리를 준비하게 한 행위는 한국어에서 자연스러운 ‘왕좌를 마련하였으며’로 옮겼고, 해석적·교리적 내용을 덧붙이지 않았습니다.
