translation:
  language: ko
  text: 그러나 이제는 그를 죄 없다고 여기지 마십시오. 당신은 지혜로운 사람이니, 그에게 어떻게 해야 할지 알 것입니다. 그리고 그의 백발을 피 흘림과 함께 스올로 내려보내야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤’, ‘죽은 자들의 세계’로 볼 수 있습니다. ‘스올’은 히브리어 사후 세계 개념입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּנַקֵּהוּ
  english_pob_choice: do not hold him guiltless
  chosen_korean: 그를 죄 없다고 여기지 마십시오
  alternatives_korean:
  - 그를 무죄로 여기지 마십시오
  - 그를 죄 없다고 간주하지 마십시오
  - 그를 처벌 없이 두지 마십시오
  lexicon: HALOT
  rationale: נקה의 피엘형은 ‘무죄로 선언하다/죄 없다고 여기다’의 사법적 의미를 가지므로, 단순한 방임보다 판단·선고의 뉘앙스를 살려 옮겼습니다.
- source_word: אִישׁ חָכָם
  english_pob_choice: a wise man
  chosen_korean: 지혜로운 사람이니
  alternatives_korean:
  - 지혜로운 남자이니
  - 지혜로운 사람입니다
  lexicon: HALOT
  rationale: 대상이 솔로몬이라는 남성 개인이므로 ‘사람’보다 ‘사람이니’로 자연스럽게 연결하되, 성별을 꼭 드러내는 번역은 피했습니다.
- source_word: וְיָדַעְתָּ אֵת אֲשֶׁר תַּעֲשֶׂה לּוֹ
  english_pob_choice: and you will know what you should do to him
  chosen_korean: 그에게 어떻게 해야 할지 알 것입니다
  alternatives_korean:
  - 그에게 무엇을 해야 하는지 알 것입니다
  - 그에게 어떻게 해야 할지 아실 것입니다
  lexicon: HALOT
  rationale: 문맥상 왕의 분별과 실행을 격려하는 말이므로, 영어 POB의 ‘should’가 담는 판단적 권고를 한국어의 ‘어떻게 해야 할지’로 자연스럽게 살렸습니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자들의 세계
  lexicon: HALOT
  rationale: 히브리어 고유 개념을 보존하기 위해 음역을 유지했습니다. ‘무덤’으로 풀면 죽음의 세계라는 범위를 좁혀 버릴 수 있습니다.
theological_decisions:
- issue: שְׁאוֹל의 처리
  chosen_reading: ‘스올’로 음역하여 히브리적 사후 세계 개념을 보존했습니다.
  alternative_readings:
  - ‘무덤’으로 의역
  - ‘죽은 자들의 세계’로 설명적 번역
  rationale: 이 용어는 단순한 매장 장소 이상을 가리킬 수 있으므로, 의미 범위를 조기에 확정하지 않고 긴장을 유지하는 편이 본문에 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
