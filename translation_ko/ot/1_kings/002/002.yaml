  text: I am going the way of all the earth. So be strong[a], and be a man,
  footnotes:
  - marker: a
    text: Or 'show yourself a man' or 'be manly.' The Hebrew expression combines the idea of being a man with acting courageously and responsibly.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 온 땅의 모든 사람의 길로 가고 있습니다. 그러니 강해지십시오[a], 그리고 한 사람답게 되십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남자답게 되십시오’, ‘남자다워지십시오’. 이 히브리어 표현은 ‘한 사람’이라는 뜻과 더불어 용기 있고 책임 있게 행동하라는 의미를 함께 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  english_pob_choice: I
  chosen_korean: 나는
  alternatives_korean:
  - 저는
  - 나 자신은
  lexicon: HALOT
  rationale: 1인칭 독립대명사는 한국어에서도 간단히 ‘나는’이 가장 자연스럽고, 문맥상 특별한 강조를 과장하지 않습니다.
- source_word: הֹלֵךְ בְּדֶרֶךְ כָּל הָאָרֶץ
  english_pob_choice: I am going the way of all the earth
  chosen_korean: 온 땅의 모든 사람의 길로 가고 있습니다
  alternatives_korean:
  - 온 땅의 길을 가고 있습니다
  - 땅 위의 모든 사람의 길로 가고 있습니다
  lexicon: HALOT
  rationale: ‘땅의 길’이라는 히브리어 관용구는 죽음을 가리키므로, 한국어에서는 의미를 분명히 드러내되 원문의 비유성을 유지해 옮겼습니다.
- source_word: וְחָזַקְתָּ
  english_pob_choice: So be strong
  chosen_korean: 그러니 강해지십시오
  alternatives_korean:
  - 그리고 강하십시오
  - 그러므로 담대하십시오
  lexicon: HALOT
  rationale: 전치사적 접속사와 함께 이어지는 권고이므로 ‘그러니’로 문맥을 살렸고, 동사는 기본 의미인 ‘강하다’를 살려 옮겼습니다.
- source_word: וְהָיִיתָ לְאִישׁ
  english_pob_choice: and be a man
  chosen_korean: 그리고 한 사람답게 되십시오
  alternatives_korean:
  - 그리고 남자답게 되십시오
  - 그리고 한 사람으로서 되십시오
  lexicon: HALOT
  rationale: 직역 ‘한 남자’보다, 문맥이 요구하는 용기와 책임을 드러내되 원문의 남성 호칭을 흐리지 않도록 ‘한 사람답게’로 옮겼습니다.
theological_decisions:
- issue: 남성형 권고의 한국어 처리
  chosen_reading: ‘한 사람답게’로 옮겨, 젠더 표지를 지우지 않으면서도 현대 한국어에서 자연스러운 책임·용기 권면으로 전달했습니다.
  alternative_readings:
  - 남자답게 되십시오
  - 사내답게 되십시오
  rationale: 히브리어는 문법적으로 남성형이며 솔로몬에게 직접 주어진 권면이므로, 중성화보다 대상성과 권면성을 함께 살리는 번역이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4 (Gender-accurate over gender-neutral)
