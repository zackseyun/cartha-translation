source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ עֲשָׂרָ֥ה כִיֹּר֖וֹת נְחֹ֑שֶׁת אַרְבָּעִ֨ים בַּ֜ת יָכִ֣יל הַ/כִּיּ֣וֹר הָ/אֶחָ֗ד אַרְבַּ֤ע בָּֽ/אַמָּה֙ הַ/כִּיּ֣וֹר הָ/אֶחָ֔ד כִּיּ֤וֹר אֶחָד֙ עַל הַ/מְּכוֹנָ֣ה הָ/אַחַ֔ת לְ/עֶ֖שֶׂר הַ/מְּכֹנֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/038.yaml
  text: He made ten bronze basins[a]. Each basin held forty baths, and each basin was four cubits across[c][b]. One basin stood on each of the ten stands.
  footnotes:
  - marker: a
    text: A 'bath' was a Hebrew unit of liquid measure.
    reason: cultural_note
  - marker: b
    text: Or 'four cubits in diameter.' The Hebrew simply says 'four cubits' here.
    reason: lexical_alternative
  - marker: c
    text: Or 'lavers' for 'basins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 청동 대야 열 개를 만들었습니다. 각 대야는 사십 밧[a]을 담을 수 있었고, 각 대야의 크기는 넉 규빗이었습니다[b]. 열 개의 받침 각각 위에 대야 하나씩을 놓았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밧’은 히브리어 액량 단위입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘지름이 네 규빗.’ 히브리어는 여기서 단순히 ‘네 규빗’이라고만 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִיֹּרוֹת
  english_pob_choice: basins
  chosen_korean: 대야
  alternatives_korean:
  - 세숫대야
  - 물받이 그릇
  - 항아리
  lexicon: HALOT
  rationale: 성전 기구 문맥에서 큰 물 담는 그릇을 가리키므로, 현대 한국어에서 기능이 드러나는 ‘대야’로 옮겼습니다. 영어 POB의 ‘basins’와도 의미가 맞습니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  lexicon: HALOT
  rationale: 성경 한국어에서 금속 재료를 말할 때 널리 쓰이는 ‘놋’이 본문의 전통적 재질 감각을 잘 보존합니다.
- source_word: בַּת
  english_pob_choice: baths
  chosen_korean: 바트
  alternatives_korean:
  - 밧
  - 액량단위 바트
  lexicon: HALOT
  rationale: 히브리 액량 단위를 그대로 유지해 본문의 측량 정보를 보존했습니다. 발음은 현대 표기법에 맞춰 ‘바트’로 옮겼습니다.
- source_word: אַרְבַּע בָּאַמָּה
  english_pob_choice: four cubits
  chosen_korean: 넉 규빗
  alternatives_korean:
  - 네 규빗
  - 네 큐빗
  - 네 규빗의 너비
  lexicon: HALOT
  rationale: 히브리어는 단순히 길이만 제시하므로, 영어 POB처럼 도형을 덧붙이지 않고 ‘넉 규빗’으로 직역해 측정값을 그대로 살렸습니다.
- source_word: עַל הַמְּכֹנוֹת
  english_pob_choice: on each of the ten stands
  chosen_korean: 그 열 개의 받침마다 하나씩 있었습니다
  alternatives_korean:
  - 열 개의 받침 위에 하나씩 있었습니다
  - 열 개의 받침 위에 있었습니다
  lexicon: HALOT
  rationale: ‘מְכוֹנוֹת’는 앞뒤 문맥상 받침대/거치대를 가리키므로 ‘받침’으로 옮겼고, 분배 구조를 한국어로 자연스럽게 풀어 ‘마다 하나씩’이라고 했습니다.
