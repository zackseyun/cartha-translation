    issue: '[a] 주석의 위치와 내용이 액량 단위가 아니라 ‘놋’을 설명합니다.'
    rationale: 영어 감사 기록의 문화 주석 및 히브리어 בת의 의미에 맞춰, 표지는 ‘밧’ 뒤에 두고 히브리 액량 단위임을 밝혀야 합니다.
  - severity: low
    issue: ‘바트’ 및 ‘놋’의 표기가 현대 표준어·현대 번역 문체에 덜 적합합니다.
    rationale: ‘밧’은 성경의 히브리 액량 단위에 대한 통용 표기이고, ‘청동’은 נְחֹשֶׁת의 현대적이고 자연스러운 번역입니다.
  - severity: low
    issue: 측정 표현의 주석이 실질적인 번역 대안을 제공하지 않습니다.
