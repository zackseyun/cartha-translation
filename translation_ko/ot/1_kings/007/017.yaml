id: 1KI.7.17
reference: 1 Kings 7:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׂבָכִ֞ים מַעֲשֵׂ֣ה שְׂבָכָ֗ה גְּדִלִים֙ מַעֲשֵׂ֣ה שַׁרְשְׁר֔וֹת לַ/כֹּ֣תָרֹ֔ת אֲשֶׁ֖ר עַל רֹ֣אשׁ הָ/עַמּוּדִ֑ים שִׁבְעָה֙ לַ/כֹּתֶ֣רֶת הָ/אֶחָ֔ת וְ/שִׁבְעָ֖ה לַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/017.yaml
  text: 'There were lattices of latticework and twisted cords of chainwork for the capitals that were on the tops of the pillars: seven for the one capital[a], and seven for the second capital.'
  footnotes:
  - marker: a
    text: Or 'networks of network-work and braided strands of chain-work.' The Hebrew uses paired craft terms to describe the decorative metalwork on the pillar capitals.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 기둥들의 머리 위에 있는 머리장식에는 그물무늬의 격자와 꼬아 만든 사슬무늬가 있었는데, 하나의 머리장식에는 일곱이었고, 둘째 머리장식에도 일곱이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂבָכִים
  english_pob_choice: lattices
  chosen_korean: 그물무늬의 격자
  alternatives_korean:
  - 격자
  - 그물들
  - 그물무늬
  lexicon: HALOT
  rationale: 장식용 금속 구조의 격자성을 살리면서도, 단순한 ‘그물’보다 건축·장식 맥락이 드러나도록 ‘그물무늬의 격자’로 옮겼습니다.
- source_word: מַעֲשֵׂה שְׂבָכָה
  english_pob_choice: of latticework
  chosen_korean: 그물무늬의 격자
  alternatives_korean:
  - 격자무늬의
  - 그물로 만든
  - 격자공예의
  lexicon: HALOT
  rationale: ‘~의 공작/세공’이라는 제작·양식 표현을 한국어에서 자연스럽게 드러내기 위해 앞의 명사구를 수식하는 방식으로 처리했습니다.
- source_word: גְּדִלִים מַעֲשֵׂה שַׁרְשְׁרוֹת
  english_pob_choice: twisted cords of chainwork
  chosen_korean: 꼬아 만든 사슬무늬
  alternatives_korean:
  - 꼬인 끈모양의 사슬세공
  - 꼬아 만든 줄무늬
  - 엮은 사슬장식
  lexicon: HALOT
  rationale: ‘gədilîm’과 ‘chainwork’의 반복적 장식성을 살리되, 금속 장식으로서의 성격을 유지하도록 ‘사슬무늬’로 옮겼습니다.
- source_word: לַכֹּתָרֹת ... עַל רֹאשׁ הָעַמּוּדִים
  english_pob_choice: for the capitals ... on the tops of the pillars
  chosen_korean: 기둥들의 머리 위에 있는 머리장식
  alternatives_korean:
  - 기둥 꼭대기에 있는 주두
  - 기둥의 머리 위에 있는 장식머리
  lexicon: HALOT
  rationale: ‘capital’의 건축 용어를 ‘머리장식’으로 풀어, 독자가 쉽게 이해하면서도 기둥의 윗부분이라는 공간관계를 유지했습니다.
- source_word: שִׁבְעָה לַכֹּתֶרֶת הָאֶחָת וְשִׁבְעָה לַכֹּתֶרֶת הַשֵּׁנִית
  english_pob_choice: seven for the one capital, and seven for the second capital
  chosen_korean: 하나의 머리장식에는 일곱이었고, 둘째 머리장식에도 일곱
  alternatives_korean:
  - 한 머리장식에 일곱, 다른 머리장식에 일곱
  - 첫째 머리장식과 둘째 머리장식에 각각 일곱
  lexicon: HALOT
  rationale: 히브리어의 분배적 수량을 분명히 하기 위해 두 머리장식에 각각 일곱씩이었다는 점을 자연스러운 한국어 어순으로 옮겼습니다.
