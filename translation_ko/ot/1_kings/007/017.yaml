base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/017.yaml
  text: 'There were lattices of latticework and twisted cords of chainwork for the capitals that were on the tops of the pillars: seven for the one capital[a], and seven for the second capital.'
  footnotes:
  - marker: a
    text: Or 'networks of network-work and braided strands of chain-work.' The Hebrew uses paired craft terms to describe the decorative metalwork on the pillar capitals.
    reason: lexical_alternative
translation:
  language: ko
  text: 기둥 꼭대기에 있는 주두들을 위해 그물 세공으로 만든 그물과 사슬 세공으로 만든 꼰 줄장식[a]이 있었는데, 한 주두에는 일곱 개, 다른 주두에는 일곱 개였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그물 모양의 세공과 사슬 모양의 꼰 장식.” 히브리어는 주두의 금속 장식을 가리키는 두 쌍의 세공 용어를 사용합니다.
    reason: lexical_alternative
