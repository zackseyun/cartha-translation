base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/021.yaml
  text: He set up the pillars at the portico of the temple[a]. He set up the right pillar and called its name Jachin; then he set up the left pillar and called its name Boaz.
  footnotes:
  - marker: a
    text: Jachin and Boaz are transliterations of the Hebrew pillar names, not translations of their possible meanings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 기둥들을 성전 현관에 세웠습니다[a]. 그는 오른쪽 기둥을 세우고 이름을 야긴이라 했으며, 왼쪽 기둥을 세우고 이름을 보아스라 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 야긴과 보아스는 히브리어 기둥 이름의 음역이며, 가능한 뜻을 번역한 것이 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם / הָעַמֻּדִים
  english_pob_choice: He set up the pillars
  chosen_korean: 기둥들을 세웠습니다
  alternatives_korean:
  - 기둥들을 세워 두었습니다
  - 기둥들을 세웠습니다/세워 놓았습니다
  lexicon: WLC + HALOT
  rationale: קום의 사역형은 여기서 ‘서 있게 하다/세우다’의 뜻이므로, 현대 한국어로는 ‘세웠습니다’가 가장 자연스럽고 문맥에 맞습니다.
- source_word: לְאֻלָם הַהֵיכָל
  english_pob_choice: at the portico of the temple
  chosen_korean: 성전 현관에
  alternatives_korean:
  - 성전의 현관에
  - 성전 포치에
  lexicon: HALOT
  rationale: אוּלָם은 성전 앞쪽의 현관·포치 공간을 가리키므로, ‘현관’이 현대 독자에게 가장 분명하면서도 의미를 지나치게 좁히지 않습니다.
- source_word: הָעַמּוּד הַיְמָנִי / הָעַמּוּד הַשְּׂמָאלִי
  english_pob_choice: the right pillar / the left pillar
  chosen_korean: 오른쪽 기둥 / 왼쪽 기둥
  alternatives_korean:
  - 우편 기둥 / 좌편 기둥
  - 오른편 기둥 / 왼편 기둥
  lexicon: HALOT
  rationale: 방향 표지는 본문이 의도한 공간 대비를 그대로 살리되, 오늘날 자연스러운 표준어인 ‘오른쪽/왼쪽’을 택했습니다.
- source_word: וַיִּקְרָא אֶת שְׁמֹו
  english_pob_choice: called its name
  chosen_korean: 이름을 …이라 했습니다
  alternatives_korean:
  - 이름을 …이라 불렀습니다
  - 그 이름을 …이라 지었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘그 이름을 부르다’의 이름 붙이기 공식을 한국어에서 자연스럽게 옮기기 위해 ‘이름을 …이라 했습니다’를 사용했습니다.
- source_word: יָכִין / בֹּעַז
  english_pob_choice: Jachin / Boaz
  chosen_korean: 야긴 / 보아스
  alternatives_korean:
  - 야킨 / 보아즈
  - 자킨 / 보아즈
  lexicon: 고유명사 관례
  rationale: 히브리어 고유명사는 통용되는 한국어 음역을 따랐고, 번역하지 않고 음역만 유지해 기둥 이름의 성격을 보존했습니다.
