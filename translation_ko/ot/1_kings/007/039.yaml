    text: 히브리어는 직역하면 ‘성전 건물의 오른쪽에서, 동쪽으로, 남쪽 맞은편에’라는 압축된 공간 묘사이며, 전체 위치는 남동쪽을 가리킵니다.
    reason: source_note
