translation:
  language: ko
  text: 그는 기둥받침 다섯을 집의 오른쪽에, 다섯을 집의 왼쪽에 두었고, 또 그 바다를 집의 오른쪽, 곧 남쪽을 마주한 동쪽 쪽에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘집의 오른쪽에서, 동쪽으로, 남쪽을 마주하여’라는 압축된 공간 묘사를 사용하며, 전체 의미는 남동쪽입니다.
    reason: source_note
