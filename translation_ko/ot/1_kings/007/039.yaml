translation:
  language: ko
  text: 그는 받침대 다섯을 성전 건물의 오른쪽에, 또 다섯을 성전 건물의 왼쪽에 두었으며, 바다는 성전 건물의 남동쪽에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
