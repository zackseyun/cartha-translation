  text: וּ֠/פִי/הוּ מִ/בֵּ֨ית לַ/כֹּתֶ֤רֶת וָ/מַ֨עְלָ/ה֙ בָּֽ/אַמָּ֔ה וּ/פִ֨י/הָ֙ עָגֹ֣ל מַעֲשֵׂה כֵ֔ן אַמָּ֖ה וַ/חֲצִ֣י הָֽ/אַמָּ֑ה וְ/גַם עַל פִּ֨י/הָ֙ מִקְלָע֔וֹת וּ/מִסְגְּרֹתֵי/הֶ֥ם מְרֻבָּע֖וֹת לֹ֥א עֲגֻלּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/031.yaml
  text: Its opening projected upward from within the capital by a cubit[a], and its opening was round, like the work of a pedestal, a cubit and a half; and also on its opening were carvings, and their panels were square[c][b], not round.
  footnotes:
  - marker: a
    text: Or 'its mouth'; the Hebrew uses an architectural metaphor for the opening.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase 'made like a pedestal' is technically difficult; alternatives include 'the workmanship of a stand' or 'made like a base.'
    reason: lexical_alternative
  - marker: c
    text: Or 'engraved work,' 'wreaths,' or 'garlands' for the decorative term here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 입은 안에서부터 그 머리장식의 바깥으로 한 규빗 올라와 있었고, 그 입은 둥글었으며, 받침의 솜씨를 닮아 있었고, 한 규빗 반이었습니다. 또 그 입 둘레에는 조각무늬가 있었고, 그 테들은 네모꼴이었지 둥글지 않았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 구조물의 ‘입/개구부’를 가리키는 비유적 표현입니다.
    reason: source_note
  - marker: b
    text: ‘받침의 솜씨’는 히브리어의 기술적 표현을 자연스럽게 옮긴 것으로, ‘받침대의 공법’ 또는 ‘받침의 제작’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘조각무늬’는 문양의 정확한 종류가 불확실한 히브리어를 포괄적으로 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיהוּ / פִּיהָ
  english_pob_choice: opening
  chosen_korean: 그 입
  alternatives_korean:
  - 입구
  - 개구부
  - 열린 부분
  lexicon: HALOT
  rationale: 건축물의 입구를 가리키는 비유적 표현이므로 문자적 ‘입’의 이미지를 살리되, 한국어에서는 자연스럽게 읽히도록 ‘그 입’으로 옮겼습니다.
- source_word: מִבֵּית לַכֹּתֶרֶת
  english_pob_choice: from within the capital
  chosen_korean: 안에서부터 그 머리장식의 바깥으로
  alternatives_korean:
  - 그 머리장식 안에서
  - 그 장식의 내부에서
  - 그 머리장식 속에서
  lexicon: HALOT
  rationale: כֹּתֶרֶת은 여기서 기둥머리/머리장식에 해당하는 구조물로 보이며, בַּיִת의 ‘안’ 의미를 살려 공간적 출발점을 분명하게 표현했습니다.
- source_word: מַעֲשֵׂה כֵן
  english_pob_choice: like the work of a pedestal
  chosen_korean: 받침의 솜씨를 닮아 있었고
  alternatives_korean:
  - 받침의 공법을 닮아 있었고
  - 받침대의 제작과 같았고
  - 받침처럼 만들어져 있었고
  lexicon: HALOT
  rationale: כֵן은 받침/대좌를 가리킬 수 있어, 원문이 단순한 형태 비교인지 기술적 제작 비교인지 애매한 점을 보존하면서도 한국어에서는 ‘솜씨를 닮아’로 자연스럽게 옮겼습니다.
- source_word: מִקְלָעוֹת
  english_pob_choice: carvings
  chosen_korean: 조각무늬
  alternatives_korean:
  - 조각
  - 새김무늬
  - 새긴 장식
  lexicon: HALOT
  rationale: 정확한 문양은 불확실하지만 장식적 새김을 가리키므로, 과도하게 특정하지 않는 ‘조각무늬’로 처리했습니다.
- source_word: מִסְגְּרֹתֵיהֶם
  english_pob_choice: their panels
  chosen_korean: 그 테들
  alternatives_korean:
  - 그 둘레들
  - 그 틀들
  - 그 판들
  lexicon: HALOT
  rationale: 문맥상 조각무늬의 구획/테두리를 가리키는 표현으로 보아, 형상을 살리면서도 기술적 의미를 유지하는 ‘테들’을 택했습니다.
theological_decisions:
- issue: 사물 묘사 문장에서의 직역과 자연스러운 한국어 사이의 긴장
  chosen_reading: 원문의 건축 묘사를 해치지 않도록 비유적 표현(‘입’, ‘받침’)을 살리되, 한국어 문장으로는 매끈하게 읽히도록 조정했습니다.
  alternative_readings:
  - 완전 직역하여 어색함을 감수하는 방식
  - 의미를 풀어쓴 설명체 방식
  rationale: 이 절은 신학적 해석보다 기술적 묘사가 중심이므로, 원문의 세부 형상을 최대한 보존하는 것이 우선입니다.
  doctrine_reference: 본문 기술 묘사 보존 원칙
- issue: ‘네모꼴이었지 둥글지 않았습니다’의 대조 유지
  chosen_reading: 원문의 명시적 대조를 그대로 살려 네모꼴/둥글지 않음의 대비를 유지했습니다.
  alternative_readings:
  - 직사각형이었습니다
  - 사각형이었습니다
  rationale: 히브리어의 직접적인 대비는 ‘사각/둥글’이므로, 너무 현대적 규격 용어로 바꾸지 않고 본문 관찰을 그대로 드러냈습니다.
  doctrine_reference: 본문 기술 정확성 원칙
