  - 개구부
  - 열린 부분
  lexicon: HALOT
  rationale: 건축물의 입구를 가리키는 비유적 표현이므로 문자적 ‘입’의 이미지를 살리되, 한국어에서는 자연스럽게 읽히도록 ‘그 입’으로 옮겼습니다.
- source_word: מִבֵּית לַכֹּתֶרֶת
