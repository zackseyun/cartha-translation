  lexicon: HALOT
  rationale: כֹּתֶרֶת은 여기서 기둥머리/머리장식에 해당하는 구조물로 보이며, בַּיִת의 ‘안’ 의미를 살려 공간적 출발점을 분명하게 표현했습니다.
- source_word: מַעֲשֵׂה כֵן
  english_pob_choice: like the work of a pedestal
  chosen_korean: 받침의 솜씨를 닮아 있었고
  alternatives_korean:
  - 받침의 공법을 닮아 있었고
  - 받침대의 제작과 같았고
  - 받침처럼 만들어져 있었고
  lexicon: HALOT
  rationale: כֵן은 받침/대좌를 가리킬 수 있어, 원문이 단순한 형태 비교인지 기술적 제작 비교인지 애매한 점을 보존하면서도 한국어에서는 ‘솜씨를 닮아’로 자연스럽게 옮겼습니다.
- source_word: מִקְלָעוֹת
  english_pob_choice: carvings
  chosen_korean: 조각무늬
  alternatives_korean:
  - 조각
  - 새김무늬
  - 새긴 장식
  lexicon: HALOT
  rationale: 정확한 문양은 불확실하지만 장식적 새김을 가리키므로, 과도하게 특정하지 않는 ‘조각무늬’로 처리했습니다.
- source_word: מִסְגְּרֹתֵיהֶם
  english_pob_choice: their panels
  chosen_korean: 그 테들
  alternatives_korean:
  - 그 둘레들
  - 그 틀들
  - 그 판들
  lexicon: HALOT
  rationale: 문맥상 조각무늬의 구획/테두리를 가리키는 표현으로 보아, 형상을 살리면서도 기술적 의미를 유지하는 ‘테들’을 택했습니다.
theological_decisions:
- issue: 사물 묘사 문장에서의 직역과 자연스러운 한국어 사이의 긴장
  chosen_reading: 원문의 건축 묘사를 해치지 않도록 비유적 표현(‘입’, ‘받침’)을 살리되, 한국어 문장으로는 매끈하게 읽히도록 조정했습니다.
  alternative_readings:
  - 완전 직역하여 어색함을 감수하는 방식
  - 의미를 풀어쓴 설명체 방식
  rationale: 이 절은 신학적 해석보다 기술적 묘사가 중심이므로, 원문의 세부 형상을 최대한 보존하는 것이 우선입니다.
  doctrine_reference: 본문 기술 묘사 보존 원칙
- issue: ‘네모꼴이었지 둥글지 않았습니다’의 대조 유지
  chosen_reading: 원문의 명시적 대조를 그대로 살려 네모꼴/둥글지 않음의 대비를 유지했습니다.
  alternative_readings:
  - 직사각형이었습니다
  - 사각형이었습니다
  rationale: 히브리어의 직접적인 대비는 ‘사각/둥글’이므로, 너무 현대적 규격 용어로 바꾸지 않고 본문 관찰을 그대로 드러냈습니다.
  doctrine_reference: 본문 기술 정확성 원칙
