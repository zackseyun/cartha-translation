  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣ד אָבִ֗י/ו אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית יְהוָֽה־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/051.yaml
  text: So all the work that King Solomon did for the house of Yahweh was finished. And Solomon brought in the holy things of David his father—the silver[a], the gold, and the vessels—and put them in the treasuries of the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'the dedicated things of David his father.' The Hebrew refers to items set apart as holy for the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 솔로몬 왕이 야훼의 집을 위해 한 모든 일이 끝났습니다. 솔로몬은 아버지 다윗의 성물[a], 곧 은과 금과 기구들을 들여와 야훼의 집 보물 창고들에 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아버지 다윗이 봉헌한 것들.’ 히브리어는 야훼께 따로 구별하여 거룩하게 한 물품들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁלַם כָּל הַמְּלָאכָה
  english_pob_choice: So all the work ... was finished
  chosen_korean: 그리하여 ... 모든 일이 끝났습니다
  alternatives_korean:
  - '...모든 공사가 완료되었습니다'
  - '...모든 일이 완성되었습니다'
  lexicon: HALOT
  rationale: מְלָאכָה는 성전 건축과 관련된 전체 작업을 가리키므로 ‘일’로 넓게 받되, השלם의 완료 의미는 ‘끝났습니다’로 자연스럽게 옮겼습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 여호와의 집
  alternatives_korean:
  - 야훼의 집
  - 성전
  lexicon: HALOT
  rationale: 본문의 직역 구조를 살리기 위해 ‘집’을 유지했고, 전통적 한국어 성경 용례에 따라 divine name은 문맥상 여호와로 옮겼습니다.
- source_word: קָדְשֵׁי דָּוִד אָבִיו
  english_pob_choice: the holy things of David his father
  chosen_korean: 아버지 다윗의 거룩한 것들
  alternatives_korean:
  - 아버지 다윗의 봉헌된 것들
  - 아버지 다윗의 성별된 것들
  lexicon: HALOT
  rationale: קָדְשֵׁי의 핵심은 ‘거룩하게 구별된 것들’이므로, 문맥의 헌납물 성격을 살리되 POB의 직설성을 따라 ‘거룩한 것들’로 옮겼습니다.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב וְאֶת הַכֵּלִים
  english_pob_choice: the silver, the gold, and the vessels
  chosen_korean: 은과 금과 기구들
  alternatives_korean:
  - 은과 금과 그릇들
  - 은과 금과 용기들
  lexicon: HALOT
  rationale: כֵּלִים는 성전 맥락에서 기능적 도구/그릇을 포괄하므로, 과도하게 특정하지 않는 ‘기구들’이 무난합니다.
- source_word: בְּאֹצְרוֹת
  english_pob_choice: in the treasuries
  chosen_korean: 곳간에
  alternatives_korean:
  - 창고에
  - 보물창고에
  lexicon: HALOT
  rationale: אֹצָרוֹת는 보관 공간을 뜻하지만, 성전 재정·헌납물의 저장이라는 맥락을 살려 ‘곳간’이 자연스럽고 이해 가능합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 기록은 한국어 독자에게 널리 통용되는 성경적 관용어를 우선해 ‘여호와’로 옮겼습니다. 본문은 1인칭 신명 선포가 아니라 역사 서술이므로 전통적 표기를 유지해도 의미 손상이 없습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
