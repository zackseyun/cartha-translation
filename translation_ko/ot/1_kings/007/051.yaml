- from: 그리하여 여호와의 집을 위하여 솔로몬 왕이 한 모든 일이 끝났습니다. 그리고 솔로몬은 아버지 다윗의 거룩한 것들—은과 금과 기구들—을 들여와 여호와의 집 곳간에 두었습니다.[a]
  to: 그리하여 솔로몬 왕이 야훼의 집을 위해 한 모든 일이 끝났습니다. 솔로몬은 아버지 다윗의 성물[a], 곧 은과 금과 기구들을 들여와 야훼의 집 보물 창고들에 두었습니다.
  rationale: 하나님의 이름을 POB 정책에 따라 ‘야훼’로 바로잡았습니다. קָדְשֵׁי는 한국어에서 자연스러우면서도 제의적으로 구별된 물품이라는 의미를 유지하는 ‘성물’로 옮기고, 그 가능한 ‘봉헌’ 의미는 각주로 보완했습니다. 저장 장소는 원문의 복수형을 반영하여 ‘보물 창고들’로 번역했으며, 각주 표지를 해당 어구 뒤로 옮겼습니다.
