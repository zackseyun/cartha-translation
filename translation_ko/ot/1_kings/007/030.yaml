  text: וְ/אַרְבָּעָה֩ אוֹפַנֵּ֨י נְחֹ֜שֶׁת לַ/מְּכוֹנָ֤ה הָֽ/אַחַת֙ וְ/סַרְנֵ֣י נְחֹ֔שֶׁת וְ/אַרְבָּעָ֥ה פַעֲמֹתָ֖י/ו כְּתֵפֹ֣ת לָ/הֶ֑ם מִ/תַּ֤חַת לַ/כִּיֹּר֙ הַ/כְּתֵפֹ֣ת יְצֻק֔וֹת מֵ/עֵ֥בֶר אִ֖ישׁ לֹיֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/030.yaml
  text: And the one stand had four bronze wheels and bronze axles[a], and its four corners had supports for them; beneath the basin the supports were cast[c][b], each beside wreathwork.
  footnotes:
  - marker: a
    text: Or 'base' for 'stand' (Hebrew מְכוֹנָה), referring to the wheeled support structure beneath the basin.
    reason: lexical_alternative
  - marker: b
    text: Hebrew כְּתֵפֹת is literally 'shoulders'; here it likely means projecting support pieces.
    reason: lexical_alternative
  - marker: c
    text: The final term may refer to decorative garlands or festoons; 'wreathwork' reflects this likely sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 받침대 하나에는 청동 바퀴 네 개와 청동 차축들이 있었고[a], 그 네 발에는 지지대가 달려 있었습니다[b]. 물두멍 아래의 그 지지대들은 주조되어 있었으며, 각각 둘레 장식 곁에 있었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘청동’은 히브리어 נְחֹשֶׁת을 성전 기물 문맥에 맞게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 כְּתֵפֹת은 문자적으로 ‘어깨들’이며, 여기서는 돌출된 지지 부분을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 표현은 장식용 화환이나 둘레 장식을 가리키는 말로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹפַנֵּי נְחֹשֶׁת
  english_pob_choice: bronze wheels
  chosen_korean: 놋바퀴 네 개
  alternatives_korean:
  - 청동 바퀴 네 개
  - 구리 바퀴 네 개
  lexicon: HALOT
  rationale: 오판님은 물리적 바퀴이므로 ‘바퀴’로 옮기고, נְחֹשֶׁת은 성막·성전 문맥의 관용을 따라 ‘놋’으로 두어 POB의 ‘bronze’ 대응을 반영했습니다.
- source_word: סַרְנֵי נְחֹשֶׁת
  english_pob_choice: bronze axles
  chosen_korean: 놋 차축들
  alternatives_korean:
  - 놋 축들
  - 놋 막대들
  lexicon: HALOT
  rationale: 수레바퀴와 함께 나오는 구조물 문맥이므로 통치자 뜻의 동음어가 아니라 기계 부품인 차축으로 이해하는 것이 자연스럽습니다.
- source_word: מְכוֹנָה
  english_pob_choice: stand
  chosen_korean: 받침대
  alternatives_korean:
  - 대
  - 기대
  - 기단
  lexicon: HALOT
  rationale: 이 절의 장치는 물두멍을 지탱하는 이동식 구조물이므로 ‘stand’의 기능을 살려 ‘받침대’로 옮겼습니다.
- source_word: כְּתֵפֹת
  english_pob_choice: supports
  chosen_korean: 받침
  alternatives_korean:
  - 어깨들
  - 돌출부
  - 옆지지대
  lexicon: HALOT
  rationale: 직역하면 ‘어깨들’이지만, 기물 설명에서는 돌출된 지지 구조를 가리키므로 기능을 드러내는 ‘받침’이 가장 적절합니다.
- source_word: יְצֻקוֹת
  english_pob_choice: were cast
  chosen_korean: 주조되었는데
  alternatives_korean:
  - 부어 만들었는데
  - 주물로 만들어졌는데
  lexicon: HALOT
  rationale: 금속 제작 문맥의 피동 분사이므로 ‘주조되다’가 공정 의미를 가장 정확하게 전달합니다.
theological_decisions:
- issue: 기구 묘사에서 ‘롱/귀퉁이/둘레 장식’의 공간 관계를 어떻게 표현할지
  chosen_reading: ‘그 네 귀퉁이에는 그것들을 위한 받침이 있었습니다’로 기능 관계를 분명히 했습니다.
  alternative_readings:
  - ‘그 네 모서리에는 그것들을 위한 받침이 있었습니다’
  - ‘그 네 가장자리에는 그것들을 위한 받침이 있었습니다’
  rationale: 히브리어는 구조물의 바깥쪽 돌출 지점과 그 지지물을 묘사하므로, 독자가 실제 기물 구조를 이해하도록 관계를 드러내되 과도한 해석은 피했습니다.
  doctrine_reference: 성전 기물의 세부 묘사는 본문 자체의 장인적 정확성을 따라야 하며, 의미를 약화시키지 않는 범위에서만 현대어로 옮깁니다.
