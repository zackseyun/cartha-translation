  text: עַמֻּדִ֣ים שְׁנַ֔יִם וְ/גֻלֹּ֧ת הַ/כֹּתָרֹ֛ת אֲשֶׁר עַל רֹ֥אשׁ הָֽ/עַמֻּדִ֖ים שְׁתָּ֑יִם וְ/הַ/שְּׂבָכ֣וֹת שְׁתַּ֔יִם לְ/כַסּ֗וֹת אֶת שְׁתֵּי֙ גֻּלֹּ֣ת הַ/כֹּֽתָרֹ֔ת אֲשֶׁ֖ר עַל רֹ֥אשׁ הָ/עַמּוּדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/041.yaml
  text: the two pillars[a], and the two bowls of the capitals that were on the tops of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on the tops of the pillars[c][b];
  footnotes:
  - marker: a
    text: Or 'globes' or 'rounded forms' for 'bowls'; the Hebrew term refers to rounded features of the capitals, and the exact architectural shape is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Traditional English versions often use 'chapiters' for 'capitals.'
    reason: lexical_alternative
  - marker: c
    text: Or 'networks' for 'latticeworks.'
    reason: lexical_alternative
translation:
  language: ko
  text: 두 기둥[a], 그리고 기둥의 꼭대기 위에 있는 두 그릇 모양의 머리장식[b], 그리고 기둥의 꼭대기 위에 있는 그 두 그릇 모양을 덮는 두 격자무늬[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구체’나 ‘둥근 형태’로도 옮길 수 있습니다. 히브리어는 머리장식의 둥근 요소를 가리키며, 정확한 구조 형태는 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적 영어 번역은 ‘chapiters’를 쓰기도 하지만, 여기서는 현대 한국어에 맞게 ‘머리장식’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘네트워크’로도 옮길 수 있습니다.
    reason: lexical_alternative
