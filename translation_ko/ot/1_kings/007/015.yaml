  source_fidelity: 히브리어 본문은 마지막에 명시적으로 ‘둘째 기둥’을 말합니다(הָעַמּוּד הַשֵּׁנִי). 초안의 본문 ‘그 둘레’는 선행하는 ‘한 기둥’으로 자연스럽게 연결될 수 있어, 본문의 지시 대상을 충분히 반영하지 못합니다. 이를 각주로만 처리한 것은 원문 우선 원칙에도 맞지 않습니다.
