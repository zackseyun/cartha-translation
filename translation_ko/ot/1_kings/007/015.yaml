base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/015.yaml
  text: He cast the two bronze pillars; the height of the one pillar was eighteen cubits[a], and a line of twelve cubits measured around it.
  footnotes:
  - marker: a
    text: Or 'and a cord of twelve cubits encircled the second pillar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 놋기둥 둘을 주조하였는데, 한 기둥의 높이는 열여덟 규빗이었고, 열두 규빗의 줄이 그 둘레를 둘렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “열두 규빗의 줄이 둘째 기둥을 둘렀습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּצַר
  english_pob_choice: cast
  chosen_korean: 주조하였는데
  alternatives_korean:
  - 만들었는데
  - 형성하였는데
  - 부어 만들었는데
  lexicon: HALOT
  rationale: 놋으로 만든 성전 기둥의 제작 맥락에서는 일반적인 ‘만들다’보다 금속을 거푸집에 부어 만드는 뜻의 ‘주조하다’가 원문의 공정과 영어 POB의 ‘cast’를 가장 정확히 반영합니다.
- source_word: שְׁנֵי הָעַמּוּדִים
  english_pob_choice: the two ... pillars
  chosen_korean: 놋기둥 둘
  alternatives_korean:
  - 두 기둥
  - 두 개의 기둥
  - 놋으로 된 두 기둥
  lexicon: HALOT
  rationale: 문맥상 성전 장식 기둥이므로 ‘기둥’이 자연스럽고, 재질을 앞에 둔 ‘놋기둥’이 원문의 נְחֹשֶׁת과 영어 POB의 bronze를 간결하게 살립니다.
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה
  english_pob_choice: eighteen cubits
  chosen_korean: 열여덟 규빗
  alternatives_korean:
  - 18 규빗
  - 열여덟 자
  - 열여덟 척
  lexicon: HALOT
  rationale: 고대 단위를 그대로 살려야 하므로 ‘규빗’을 유지했고, 숫자는 현대 한국어 표기인 ‘열여덟’로 옮겼습니다.
- source_word: וְחוּט שְׁתֵּים עֶשְׂרֵה אַמָּה יָסֹב
  english_pob_choice: and a line of twelve cubits measured around it
  chosen_korean: 열두 규빗의 줄이 그 둘레를 둘렀습니다
  alternatives_korean:
  - 열두 규빗의 선이 그 둘레를 둘렀습니다
  - 열두 규빗짜리 줄이 그 둘레를 둘렀습니다
  - 열두 규빗의 줄이 그 둘레를 쟀습니다
  lexicon: HALOT
  rationale: חוּט는 문자적으로 ‘줄/실/선’이므로 ‘줄’이 자연스럽고, יָסֹב는 측정 기능을 드러내되 과도한 의역을 피하기 위해 ‘둘레를 둘렀습니다’로 처리했습니다.
