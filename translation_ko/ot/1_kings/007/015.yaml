translation:
  language: ko
  text: 그가 청동 기둥 두 개를 주조하였습니다. 한 기둥의 높이는 열여덟 규빗이었고, 길이가 열두 규빗인 줄이 둘째 기둥을 둘렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
