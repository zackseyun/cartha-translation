  lexicon: HALOT
  rationale: חוּט는 문자적으로 ‘줄/실/선’이므로 ‘줄’이 자연스럽고, יָסֹב는 측정 기능을 드러내되 과도한 의역을 피하기 위해 ‘둘레를 둘렀습니다’로 처리했습니다.
