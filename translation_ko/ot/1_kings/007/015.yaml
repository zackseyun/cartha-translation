  rationale: 고대 단위를 그대로 살려야 하므로 ‘규빗’을 유지했고, 숫자는 현대 한국어 표기인 ‘열여덟’로 옮겼습니다.
- source_word: וְחוּט שְׁתֵּים עֶשְׂרֵה אַמָּה יָסֹב
  english_pob_choice: and a line of twelve cubits measured around it
  chosen_korean: 열두 규빗의 줄이 그 둘레를 둘렀습니다
