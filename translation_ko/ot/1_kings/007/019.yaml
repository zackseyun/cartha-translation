source:
  edition: WLC
  text: וְ/כֹֽתָרֹ֗ת אֲשֶׁר֙ עַל רֹ֣אשׁ הָ/עַמּוּדִ֔ים מַעֲשֵׂ֖ה שׁוּשַׁ֣ן בָּֽ/אוּלָ֑ם אַרְבַּ֖ע אַמּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/019.yaml
  text: And the capitals that were on the tops of the pillars were made like a lily blossom in the portico[c][b][a], four cubits.
  footnotes:
  - marker: a
    text: Or 'in the vestibule' or 'on the porch.' The Hebrew אוּלָם denotes the entrance hall or portico of the temple structure.
    reason: lexical_alternative
  - marker: b
    text: Or simply 'like a lily.' Some understand שׁוּשַׁן here as a lotus-shaped floral design in the pillar capitals.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''four cubits.'' The measurement likely describes the height of the lily-shaped portion of the capitals.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 기둥들의 머리 위에 있는 머리장식은 백합꽃 무늬로 만들어졌고, 둘레는 네 규빗이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘현관에’, ‘주랑에’로 옮길 수 있습니다. 히브리어 אוּלָם은 성전 구조의 출입 전실 또는 주랑을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 단순히 ‘백합’으로 옮길 수 있습니다. 이곳의 שׁוּשַׁן은 기둥 머리장식의 꽃무늬를 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어로는 ‘네 규빗’입니다. 이 치수는 아마도 머리장식의 백합 형상 부분의 높이나 크기를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹתָרֹת
  english_pob_choice: capitals
  chosen_korean: 머리장식
  alternatives_korean:
  - 기둥머리
  - 주두
  lexicon: HALOT
  rationale: 건축 맥락에서 기둥의 윗부분을 가리키므로, 현대 한국어에서 의미가 분명한 ‘머리장식’으로 옮겼습니다. ‘주두’는 전문적이지만 일반 독자에게는 덜 직접적입니다.
- source_word: מַעֲשֵׂה שׁוּשַׁן
  english_pob_choice: made like a lily blossom / lily-work
  chosen_korean: 백합꽃 무늬로 만들어졌고
  alternatives_korean:
  - 백합으로 된
  - 백합 장식의
  - 백합 모양의
  lexicon: HALOT
  rationale: מַעֲשֵׂה는 단순한 재료표시보다 ‘형상/무늬로 된 제작 양식’을 가리키므로, ‘무늬로 만들어졌고’로 처리해 ‘work/design’의 뜻을 살렸습니다. שׁוּשַׁן은 표준적으로 ‘백합’이므로 꽃의 형상을 드러내는 표현을 택했습니다.
- source_word: בָאוּלָם
  english_pob_choice: in the portico
  chosen_korean: 둘레는
  alternatives_korean:
  - 주랑에
  - 현관에
  - 행랑에
  lexicon: HALOT
  rationale: 본문의 אָרְבַּע אַמּוֹת는 머리장식의 치수를 말하는 것으로 이해되어, 영어 POB가 괄호식으로 제시한 ‘portico’ 정보는 본문에 자연스럽게 직접 삽입하지 않고 문장의 측정 대상인 ‘둘레’로 풀어 옮겼습니다.
- source_word: אַרְבַּע אַמּוֹת
  english_pob_choice: four cubits
  chosen_korean: 네 규빗
  alternatives_korean:
  - 네 자
  - 네 큐빗
  lexicon: HALOT
  rationale: 히브리어의 고대 길이 단위 아מה를 한국어 성경 관용에 맞게 ‘규빗’으로 옮겨, 측정값 자체를 보존했습니다.
theological_decisions:
- issue: 오울람(אוּלָם) 처리와 건축 맥락의 반영
  chosen_reading: 이 절은 머리장식의 형상과 치수를 말하는 문장으로 보고, ‘portico/vestibule/porch’는 본문 밖의 설명으로 처리했습니다.
  alternative_readings:
  - ‘현관에’ 또는 ‘주랑에’를 본문에 넣어 읽는 방식
  - ‘둘레’ 대신 ‘높이는 네 규빗’으로 구체화하는 방식
  rationale: 영어 POB의 각주도 오울람의 의미를 설명적 주석으로 다루며, 본문 차원에서는 장식의 형식과 치수에 초점이 있습니다. 따라서 한국어 본문은 본문 정보와 주석 정보를 분리해 과도한 해석을 피했습니다.
  doctrine_reference: '본문 해석 원칙: 설명은 각주로, 본문은 원문의 초점 유지'
