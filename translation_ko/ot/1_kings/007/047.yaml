    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  english_pob_choice: left ... unweighed
  chosen_korean: 달지 않았습니다
  alternatives_korean:
  - 그대로 두었습니다
  - 남겨 두었습니다
  - 재지 않았습니다
  lexicon: HALOT
  rationale: 문맥상 솔로몬이 기구들을 계속 계량하지 않고 그대로 두었다는 뜻이므로, 결과를 자연스럽게 드러내는 ‘달지 않았습니다’로 옮겼습니다.
- source_word: כָּל הַכֵּלִים
  english_pob_choice: all the vessels
  chosen_korean: 모든 기구를
  alternatives_korean:
  - 모든 그릇을
  - 모든 물품을
  - 모든 기물을
  lexicon: HALOT
  rationale: 성전 기구들의 총칭으로는 ‘기구’가 가장 자연스럽고, 원문의 넓은 범위를 무리 없이 담을 수 있습니다.
- source_word: מֵרֹב מְאֹד מְאֹד
  english_pob_choice: because they were exceedingly many
  chosen_korean: 너무나 많아서
  alternatives_korean:
  - 대단히 많아서
  - 매우 많아서
  - 엄청나게 많아서
  lexicon: HALOT
  rationale: 히브리어의 중첩된 강조를 한국어의 강한 정도 표현으로 압축하되, 과도한 구어체가 되지 않도록 ‘너무나’로 옮겼습니다.
- source_word: לֹא נֶחְקַר מִשְׁקַל הַנְּחֹשֶׁת
  english_pob_choice: the weight of the bronze was not determined
  chosen_korean: 청동의 무게는 헤아려지지 않았습니다
  alternatives_korean:
  - 청동의 무게는 결정되지 않았습니다
  - 청동의 무게는 조사되지 않았습니다
  - 청동의 무게는 계산되지 않았습니다
  lexicon: HALOT
  rationale: נֶחְקַר는 이 문맥에서 ‘조사되다’의 의미를 넘어서 최종적으로 ‘헤아려지다/산정되다’는 뜻으로 쓰이므로, 무게와 자연스럽게 결합하는 ‘헤아려지지 않았습니다’를 택했습니다.
