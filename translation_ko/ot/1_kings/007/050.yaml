base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/050.yaml
  text: and the basins[a], the snuffers, the bowls, the cups, and the firepans, of pure gold; and the hinges for the doors of the inner house, for the Most Holy Place, and for the doors of the house, that is, the nave[d][c][b], of gold.
  footnotes:
  - marker: a
    text: Or 'sprinkling bowls' for 'bowls.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditional rendering: ''Holy of Holies.'''
    reason: lexical_alternative
  - marker: c
    text: The Hebrew likely refers to pivot-sockets or similar door fittings, not modern strap hinges.
    reason: cultural_note
  - marker: d
    text: Or 'main hall' for 'nave.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 대야들과 심지 가위들과 대접들[a]과 잔들과 불그릇들은 순금이었으며, 안쪽 집, 곧 지성소[b]의 문들과 성전 본당[d]의 문들을 위한 축받이들[c]은 금이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뿌리는 그릇들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지극히 거룩한 곳’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 말은 현대식 옆경첩보다 문이 돌게 하는 축받이 또는 이와 비슷한 문 부속을 가리킬 가능성이 큽니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘주된 방’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפּוֹת
  english_pob_choice: the basins
  chosen_korean: 대접들
  alternatives_korean:
  - 분지들
  - 바닥이 얕은 그릇들
  lexicon: HALOT
  rationale: 성전 기물 목록에서 담는 그릇류를 자연스럽게 옮기되, 뒤의 מִזְרָקוֹת와 중복되지 않도록 일반적이고 읽기 쉬운 ‘대접들’을 택했습니다.
- source_word: הַמְזַמְּרוֹת
  english_pob_choice: the snuffers
  chosen_korean: 심지 집게들
  alternatives_korean:
  - 심지 가위들
  - 등잔 다듬는 도구들
  lexicon: HALOT
  rationale: 성소 문맥에서 등잔 심지를 다듬는 도구이므로 기능을 드러내는 ‘심지 집게들’이 가장 자연스럽습니다.
- source_word: הַפֹּתוֹת
  english_pob_choice: the hinges
  chosen_korean: 경첩들
  alternatives_korean:
  - 축받이들
  - 문짝 받침들
  lexicon: HALOT
  rationale: 영어 POB의 주석처럼 고대 문틀의 회전 부속을 가리키므로, 현대 한국어에서는 실제 기능을 가장 잘 전달하는 ‘경첩들’로 옮겼습니다.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  english_pob_choice: for the Most Holy Place
  chosen_korean: 지성소
  alternatives_korean:
  - 가장 거룩한 곳
  - 지극히 거룩한 곳
  lexicon: HALOT
  rationale: 전통적 한국어 성경 용례와 의미를 함께 살려, 주석 없이도 성전 내부의 최내소 구획임을 분명히 하는 ‘지성소’를 사용했습니다.
- source_word: הֵיכָל
  english_pob_choice: the nave
  chosen_korean: 전각
  alternatives_korean:
  - 큰 방
  - 성전 본당
  lexicon: HALOT
  rationale: 이 단어는 성전의 내실과 구별되는 주된 건물 공간을 가리키므로, 건축적 뉘앙스를 살리는 ‘전각’으로 옮겼습니다.
theological_decisions:
- issue: 문 목록의 병렬 구조와 두 범주의 문짝 부속물 구분
  chosen_reading: ‘안쪽 집의 문들... 곧 지성소를 위한 것들과, 곧 전각의 문들을 위한 것들’로 옮겨, 내실과 전각의 두 문 범주가 구분되도록 했습니다.
  alternative_readings:
  - ‘안쪽 집의 문들, 곧 지성소와 전각의 문들’처럼 하나의 문목록으로 묶는 해석
  - ‘성소’로 일반화하여 두 공간의 대비를 약화시키는 읽기
  rationale: 히브리어의 לְ ... וְ לְ ... 구조는 두 용도의 문을 나열하는 것으로 읽는 것이 가장 직접적이어서, 공간 구분을 흐리지 않도록 반영했습니다.
  doctrine_reference: 성전 구조와 지성소/전각 구분
- issue: ‘Most Holy Place’의 번역어 선택
  chosen_reading: 전통적 교회어를 그대로 반복하기보다 ‘지성소’를 사용했습니다.
  alternative_readings:
  - ‘지극히 거룩한 곳’
  - ‘가장 거룩한 곳’
  rationale: 히브리어 קֹדֶשׁ הַקֳּדָשִׁים의 관용적 의미를 가장 안정적으로 전달하는 한국어 성경 용례를 따랐습니다.
  doctrine_reference: 성막/성전 용어의 관용 번역
