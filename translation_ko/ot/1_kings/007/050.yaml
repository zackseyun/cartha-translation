  source_fidelity: 개정이 필요합니다. 초안은 기물 목록과 두 문 구역의 큰 틀을 보존하지만, הַמִּזְרָקוֹת의 ‘주발’은 현대 표준어 성경 문맥에서 다소 불명확하고, פֹּתוֹת를 ‘경첩’으로 옮긴 것은 고대의 회전축 부속이라는 의미를 현대식 부속품으로 지나치게 특정합니다. 또한 ‘것들과’의 반복은 원문의 간결한 병렬 구조를 흐립니다.
  naturalness: ‘안쪽 집의 문들을 위한 경첩들과 곧 지성소를 위한 것들과’는 ‘지성소를 위한 것’이 무엇인지 불분명하여 자연스럽지 않습니다. ‘안쪽 집, 곧 지성소의 문들’로 동격 관계를 드러내고, 두 문 범주를 하나의 ‘축받이들’에 연결하면 명료하고 현대적인 합쇼체가 됩니다.
  terminology: הַסִּפּוֹת은 ‘대야들’, הַמִּזְרָקוֹת은 ‘대접들’이 서로 구별되면서 자연스럽습니다. הַמְזַמְּרוֹת은 ‘심지 가위들’, הַכַּפּוֹת은 ‘잔들’, הַמַּחְתּוֹת은 ‘불그릇들’로 옮길 수 있습니다. קֹדֶשׁ הַקֳּדָשִׁים의 ‘지성소’는 안정적인 관용어이며, הֵיכָל은 내실과 구별되는 ‘성전 본당’이 적절합니다. פֹּתוֹת는 ‘축받이들’로 번역하고 고대 문 회전 부속이라는 주석을 다는 편이 안전합니다.
