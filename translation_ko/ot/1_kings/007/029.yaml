  text: And on the panels that were between the frames were lions[a], oxen, and cherubim; and on the frames likewise above, and beneath the lions and the oxen were wreaths[b], a work of hanging relief.
  footnotes:
  - marker: a
    text: Or 'garlands' for 'wreaths'; the Hebrew term is rare and its exact ornamental form is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'a work of hanging relief' is difficult; it may refer to pendent or descending ornamental work beneath the lions and oxen.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 틀들 사이에 있는 판들 위에는 사자들과 소들과 그룹들이 있었고, 그 틀들 위쪽에도 그와 같은 장식이 있었습니다. 사자들과 소들 아래에는 늘어뜨린 세공으로 만든 화환들이 있었습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화환들’로 옮긴 히브리어 낱말은 드문 장식 용어입니다. 화환, 화환 모양 장식 등으로 이해될 수 있으나 정확한 형태는 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘늘어뜨린 세공’으로 옮긴 표현은 뜻이 어려워, 사자들과 소들 아래로 드리워지거나 내려오는 장식 세공을 가리킬 수 있습니다.
    reason: lexical_alternative
