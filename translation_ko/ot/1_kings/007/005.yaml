  text: All the doorways and the doorposts had square frames[b][a], and window was opposite window three times.
  footnotes:
  - marker: a
    text: Or 'All the openings and the doorposts had square lintels'; the Hebrew architectural term may refer more specifically to the upper frame or lintel.
    reason: lexical_alternative
  - marker: b
    text: Literally 'window opposite window, three times'; that is, corresponding windows arranged in three tiers or rows.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 출입문과 문설주는 네모 반듯한 틀이었고, 창은 창과 마주하여 세 번 반복되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 건축 용어 שָׁקֶף는 ‘틀’로도, 더 구체적으로는 ‘상인방/윗틀’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절구는 문자적으로는 ‘창이 창에 대하여, 세 번’이라는 뜻으로, 창의 대칭적 배열을 말합니다.
    reason: source_note
