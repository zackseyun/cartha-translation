  source_fidelity: 초안은 טֻרִים(‘줄들/줄지어’)을 ‘두 줄’로 옮겨 원문에 없는 수량을 더했습니다. 또한 מִלְּעֻמַּת הַבֶּטֶן와 אֲשֶׁר לְעֵבֶר שְׂבָכָה의 난해한 공간 관계를 ‘울타리 장식 곁에 있는 배불뚝한 부분과 마주하였으며’라고 처리하여, 기둥머리의 위치·장식 관계가 불분명하고 자연스럽지 않습니다. 수정문은 이 건축 묘사의 불확실성을 보존하면서 ‘위쪽’과 ‘맞은편’의 관계를 직역에 가깝게 드러냅니다.
  naturalness: ‘배불뚝한 부분’은 현대 한국어에서 다소 구어적이고 사람의 체형을 연상시킵니다. ‘불룩한 부분’이 건축 장식의 형상을 더 중립적이고 자연스럽게 나타냅니다. ‘격자 장식’은 שְׂבָכָה에 적절하며 ‘울타리 장식’보다 정확합니다.
  terminology: כֹתָרֹת는 ‘기둥머리’로 일관되게 옮길 수 있습니다. הָרִמּוֹנִים은 실제 과일이 아니라 장식물이므로 본문에서 ‘석류 장식’으로 밝혔습니다. הַשֵּׁנִית는 ‘두 번째 기둥머리’로 유지하되, 짝이 되는 다른 기둥머리를 뜻할 가능성을 각주로 보존합니다.
