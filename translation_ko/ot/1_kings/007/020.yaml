  rationale: 원문에 없는 ‘두 줄’을 삭제하고, 난해한 건축 용어와 공간 관계를 과도하게 해석하지 않도록 ‘격자 장식 건너편’, ‘맞은편 위쪽’으로 보존했습니다. 문장 종결은 현대 표준어 합쇼체로 통일했으며, 각주는 해당 본문 표현에 직접 연결했습니다.
