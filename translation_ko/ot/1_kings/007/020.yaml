source:
  edition: WLC
  text: וְ/כֹתָרֹ֗ת עַל שְׁנֵי֙ הָֽ/עַמּוּדִ֔ים גַּם מִ/מַּ֨עַל֙ מִ/לְּ/עֻמַּ֣ת הַ/בֶּ֔טֶן אֲשֶׁ֖ר לְ/עֵ֣בֶר שבכה וְ/הָ/רִמּוֹנִ֤ים מָאתַ֨יִם֙ טֻרִ֣ים סָבִ֔יב עַ֖ל הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/020.yaml
  text: And the capitals were on the two pillars[a], also above, opposite the bulge that was beside the latticework; and the pomegranates were two hundred, in rows all around[c][b], on the second capital.
  footnotes:
  - marker: a
    text: Or 'on the other capital.' The Hebrew 'the second' may simply distinguish the matching capital of the second pillar in this architectural description.
    reason: alternative_reading
  - marker: b
    text: Hebrew literally 'the belly,' likely referring to the rounded swelling part of the capital.
    reason: lexical_alternative
  - marker: c
    text: That is, the decorative net or latticework attached to the capitals.
    reason: cultural_note
translation:
  language: ko
  text: 두 기둥 위에는 기둥머리가 있었고, 그 기둥머리들은 격자 장식 건너편에 있는 불룩한 부분의 맞은편 위쪽에도 있었습니다.[b][c] 두 번째 기둥머리 위에는 석류 장식 이백 개가 사방으로 줄지어 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다른 기둥머리 위에’로도 볼 수 있습니다. 히브리어의 ‘두 번째’는 이 건축 묘사에서 짝이 되는 다른 기둥머리를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘배’이며, 여기서는 기둥머리의 둥글게 불룩한 부분을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 기둥머리에 붙은 장식용 그물무늬 또는 격자 장식을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: כֹתָרֹת
  english_pob_choice: capitals
  chosen_korean: 기둥머리
  alternatives_korean:
  - 머리장식
  - 주두
  lexicon: HALOT
  rationale: 건축 문맥에서 기둥의 윗부분을 가리키므로, 현대 한국어에서 이해하기 쉬운 ‘기둥머리’로 옮겼습니다.
- source_word: מִלְּעֻמַּת הַבֶּטֶן
  english_pob_choice: opposite the bulge
  chosen_korean: 배불뚝한 부분과 마주하였으며
  alternatives_korean:
  - 배 부분과 마주하였으며
  - 둥글게 부푼 부분과 마주하였으며
  lexicon: HALOT
  rationale: 히브리어의 ‘배’는 문자 그대로의 인체가 아니라 장식 기둥의 둥글게 부푼 부분을 뜻하므로, 그 형상을 살려 자연스럽게 표현했습니다.
- source_word: שׁבכה
  english_pob_choice: latticework
  chosen_korean: 울타리 장식
  alternatives_korean:
  - 격자 장식
  - 그물무늬
  lexicon: HALOT
  rationale: 이 장식 요소가 기둥의 격자무늬 장식을 가리키므로, 문맥상 이해되도록 ‘울타리 장식’으로 풀었습니다.
- source_word: הַשֵּׁנִית
  english_pob_choice: second capital
  chosen_korean: 두 번째 기둥머리
  alternatives_korean:
  - 다른 기둥머리
  - 두 번째 머리
  lexicon: HALOT
  rationale: ‘두 번째’라는 수적 구분을 직접 살리되, 대응하는 짝의 머리라는 뜻도 열어 두기 위해 ‘두 번째 기둥머리’로 옮겼습니다.
