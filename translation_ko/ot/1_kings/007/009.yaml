id: 1KI.7.9
reference: 1 Kings 7:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל אֵ֜לֶּה אֲבָנִ֤ים יְקָרֹת֙ כְּ/מִדֹּ֣ת גָּזִ֔ית מְגֹרָר֥וֹת בַּ/מְּגֵרָ֖ה מִ/בַּ֣יִת וּ/מִ/ח֑וּץ וּ/מִ/מַּסָּד֙ עַד הַ/טְּפָח֔וֹת וּ/מִ/ח֖וּץ עַד הֶ/חָצֵ֥ר הַ/גְּדוֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/009.yaml
  text: All these were costly stones[a], cut according to measure, sawed with a saw on the inside and on the outside, from the foundation to the coping[b], and on the outside as far as the great court.
  footnotes:
  - marker: a
    text: Or 'precious stones.' Here the sense is likely expensive, high-quality building stones rather than gemstones.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to the tĕfaḥot'; the exact architectural feature is uncertain. It may refer to the upper finishing, such as the coping or top course.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 것은 값비싼 돌들로, 규격에 맞게 다듬고 톱으로 켠 것이며, 안과 밖에서, 기초부터 돌출부까지, 그리고 바깥으로는 큰 뜰에 이르기까지 그랬습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘귀한 돌들’입니다. 여기서는 보석이라기보다 값비싸고 질 좋은 건축용 석재를 가리키는 뜻으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘טְּפָחוֹת까지’입니다. 정확한 건축 요소는 확실하지 않으며, 상부 마감이나 윗단을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים יְקָרֹת
  english_pob_choice: costly stones
  chosen_korean: 값비싼 돌들
  alternatives_korean:
  - 귀한 돌들
  - 값진 돌들
  lexicon: HALOT
  rationale: 이 문맥은 보석이 아니라 건축 자재의 고급성·고가성을 말하므로, ‘값비싼’이 POB의 ‘costly’와 가장 잘 맞습니다.
- source_word: כְּמִדֹּת גָּזִית
  english_pob_choice: cut according to measure
  chosen_korean: 규격에 맞게 다듬고
  alternatives_korean:
  - 측량대로 다듬고
  - 정해진 치수대로 깎고
  lexicon: HALOT
  rationale: ‘측정된 치수’와 ‘다듬은 돌’의 뜻을 함께 살려, 건축용 석재를 정확한 규격으로 손질했다는 의미를 자연스럽게 전합니다.
- source_word: מְגֹרָרוֹת בַּמְּגֵרָה
  english_pob_choice: sawed with a saw
  chosen_korean: 톱으로 켠 것이며
  alternatives_korean:
  - 톱으로 잘라낸 것이며
  - 톱으로 켠 돌이며
  lexicon: HALOT
  rationale: 히브리어의 도구 표현을 그대로 살려, 돌이 톱으로 가공되었음을 간결하고 구체적으로 드러냅니다.
- source_word: מִמַּסָּד עַד הַטְּפָחוֹת
  english_pob_choice: from the foundation to the coping
  chosen_korean: 기초부터 돌출부까지
  alternatives_korean:
  - 기초부터 마감층까지
  - 기초부터 처마틀까지
  lexicon: HALOT
  rationale: ‘הַטְּפָחוֹת’의 정확한 건축 요소가 불확실하므로, POB의 주석 취지를 따라 특정화하지 않고 상부 마감 부위를 가리키는 중립적 표현으로 옮겼습니다.
theological_decisions:
- issue: 건축 묘사에서의 불확실한 기술 용어 처리
  chosen_reading: ‘돌출부’처럼 기능적이되 특정 부재를 단정하지 않는 표현을 사용했습니다.
  alternative_readings:
  - ‘코핑’으로 음차하거나
  - ‘상부 마감’으로 더 일반화할 수 있습니다.
  rationale: 본문의 핵심은 성전/궁전 석재가 아래에서 위까지 정교하게 마감되었다는 점이며, 불확실한 용어를 과도하게 특정하지 않는 것이 원문 신뢰성을 지킵니다.
  doctrine_reference: 본문 비신학적·기술적 난점
