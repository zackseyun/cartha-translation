  source_fidelity: ‘백합 꽃봉오리’는 פֶּרַח שׁוֹשָׁן(백합의 꽃/꽃송이)의 만개한 꽃 모양을 가리키므로, ‘꽃봉오리’는 원문의 형상을 부정확하게 좁힙니다. 또한 주석 표지는 각각 해당 표현인 길이 단위와 테두리 비교에 붙어야 합니다.
  naturalness: ‘한 손너비’와 ‘테두리’는 현대 표준 한국어에서 자연스럽고, 성전 기물의 치수와 형태를 명료하게 전달합니다. ‘잔의 테두리처럼 백합 꽃과 같은 모양으로’는 히브리어의 연속된 형상 비교를 자연스럽게 살립니다.
  terminology: 밧은 고대 액량 단위이므로 음역을 유지하는 것이 적절합니다. טֶפַח은 한국 전통 단위로 오해될 수 있는 ‘뼘’보다 ‘손너비’가 원문의 handbreadth를 더 투명하게 전달합니다.
