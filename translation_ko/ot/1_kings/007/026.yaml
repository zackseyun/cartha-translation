source:
  edition: WLC
  text: וְ/עָבְי֣/וֹ טֶ֔פַח וּ/שְׂפָת֛/וֹ כְּ/מַעֲשֵׂ֥ה שְׂפַת כּ֖וֹס פֶּ֣רַח שׁוֹשָׁ֑ן אַלְפַּ֥יִם בַּ֖ת יָכִֽיל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/026.yaml
  text: Its thickness was a handbreadth[a], and its rim was made like the rim of a cup, like a lily blossom[b]. It could hold two thousand baths.
  footnotes:
  - marker: a
    text: The parallel description in 2 Chronicles 4:5 says the basin held three thousand baths. This may reflect a textual, transmissional, or interpretive difference between capacity and usual contents.
    reason: cross_reference
  - marker: b
    text: Or 'its lip ... like the lip of a cup.'
    reason: lexical_alternative
translation:
  language: ko
  text: 두께는 한 뼘이었고, 그 가장자리는 잔의 가장자리처럼, 백합 꽃봉오리처럼 만들어졌습니다. 그것은 이천 밧을 담을 수 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 평행본문인 2역대기 4:5에는 이 대야의 용량이 삼천 밧으로 나옵니다. 이는 용량과 통상적 내용물, 또는 전승상의 차이를 반영한 것일 수 있습니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘잔의 입술처럼’이라고 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבְיוֹ
  english_pob_choice: its thickness
  chosen_korean: 두께는
  alternatives_korean:
  - 그 두께는
  - 그 벽 두께는
  lexicon: HALOT
  rationale: 그릇의 물리적 치수를 자연스럽게 옮기기 위해 ‘두께’를 택했습니다.
- source_word: טֶפַח
  english_pob_choice: a handbreadth
  chosen_korean: 한 뼘
  alternatives_korean:
  - 손 한 뼘
  - 한 손뼘
  lexicon: HALOT
  rationale: 고대 단위의 감각을 살리면서도 현대 한국어 독자가 바로 이해할 수 있는 길이로 옮겼습니다.
- source_word: שְׂפָתוֹ / שְׂפַת כּוֹס
  english_pob_choice: its rim / the rim of a cup
  chosen_korean: 가장자리 / 잔의 가장자리
  alternatives_korean:
  - 테두리 / 잔의 테두리
  - 입술 / 잔의 입술
  lexicon: HALOT
  rationale: 금속 대야의 윗부분 형상을 자연스럽게 보여 주는 ‘가장자리’가 문맥상 가장 분명합니다.
- source_word: פֶּרַח שׁוֹשָׁן
  english_pob_choice: a lily blossom
  chosen_korean: 백합 꽃봉오리처럼
  alternatives_korean:
  - 백합 꽃처럼
  - 백합 꽃모양처럼
  lexicon: HALOT
  rationale: 꽃 모양의 퍼짐을 살리되, 장식적 형태를 드러내기 위해 ‘꽃봉오리처럼’이라는 비유를 사용했습니다.
- source_word: יָכִיל
  english_pob_choice: It could hold
  chosen_korean: 그것은 … 담을 수 있었습니다
  alternatives_korean:
  - 그것은 … 담을 수 있었습니다
  - 그것은 … 들어갈 수 있었습니다
  lexicon: HALOT
  rationale: 용량을 말하는 동사이므로 실제 내용물이 아니라 수용 가능량을 드러내는 ‘담을 수 있었습니다’가 적절합니다.
theological_decisions:
- issue: 2역대 4:5와의 용량 수치 차이
  chosen_reading: 이 구절은 이천 밧이라고 옮기되, 평행본문과의 차이는 번역문에 반영하지 않고 주석적 처리로 남깁니다.
  alternative_readings:
  - 삼천 밧으로 조정
  - 본문 차이를 본문 안에 설명
  rationale: 히브리어 본문과 POB의 수치를 그대로 유지하면서, 평행본문 차이는 본문 훼손 없이 추적 가능하게 두는 것이 가장 투명합니다.
  doctrine_reference: 본문비평/평행본문 일관성
- issue: ‘백합 꽃봉오리’의 형상 표현
  chosen_reading: 장식적 형상을 문자적으로 유지하되 과도한 해석은 피합니다.
  alternative_readings:
  - 백합꽃 모양
  - 백합의 꽃처럼
  rationale: 원문은 구체적 제작 형상을 제시하므로, 미화하거나 상징화하기보다 시각적 유사성을 그대로 살리는 것이 합당합니다.
  doctrine_reference: 성막/성전 기물 묘사
