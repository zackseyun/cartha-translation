  text: Its thickness was a handbreadth[a], and its rim was made like the rim of a cup, like a lily blossom[b]. It could hold two thousand baths.
  footnotes:
  - marker: a
    text: The parallel description in 2 Chronicles 4:5 says the basin held three thousand baths. This may reflect a textual, transmissional, or interpretive difference between capacity and usual contents.
    reason: cross_reference
  - marker: b
    text: Or 'its lip ... like the lip of a cup.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 두께는 한 손너비[a]였고, 그 테두리는 잔의 테두리[b]처럼 백합 꽃과 같은 모양으로 만들어졌습니다. 그것은 이천 밧을 담을 수 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 평행 본문인 역대기하 4:5에는 이 대야가 삼천 밧을 담았다고 합니다. 이는 용량과 통상적인 내용물의 차이, 또는 본문상·전승상·해석상의 차이를 반영할 수 있습니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그 입술은 잔의 입술처럼’이라고 할 수 있습니다.
    reason: lexical_alternative
