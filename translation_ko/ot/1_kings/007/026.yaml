theological_decisions:
- issue: 2역대 4:5와의 용량 수치 차이
  chosen_reading: 이 구절은 이천 밧이라고 옮기되, 평행본문과의 차이는 번역문에 반영하지 않고 주석적 처리로 남깁니다.
  alternative_readings:
  - 삼천 밧으로 조정
  - 본문 차이를 본문 안에 설명
  rationale: 히브리어 본문과 POB의 수치를 그대로 유지하면서, 평행본문 차이는 본문 훼손 없이 추적 가능하게 두는 것이 가장 투명합니다.
  doctrine_reference: 본문비평/평행본문 일관성
- issue: ‘백합 꽃봉오리’의 형상 표현
  chosen_reading: 장식적 형상을 문자적으로 유지하되 과도한 해석은 피합니다.
  alternative_readings:
  - 백합꽃 모양
  - 백합의 꽃처럼
  rationale: 원문은 구체적 제작 형상을 제시하므로, 미화하거나 상징화하기보다 시각적 유사성을 그대로 살리는 것이 합당합니다.
  doctrine_reference: 성막/성전 기물 묘사
