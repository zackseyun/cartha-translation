  to: 그는 기둥들의 꼭대기에 놓을 주조한 놋쇠로 된 두 기둥머리[a]를 만들었습니다. 한 기둥머리의 높이는 다섯 규빗이었고, 둘째 기둥머리의 높이도 다섯 규빗이었습니다.
  rationale: 명백한 표기 오류를 수정하고, 기둥 상단의 건축 장식이라는 원문의 의미를 ‘기둥머리’로 자연스럽게 표현했습니다. 수량과 높이, ‘한’과 ‘둘째’의 구별, 규빗 단위를 모두 보존했으며, 어휘 대안 각주를 해당 단어에 연결했습니다.
