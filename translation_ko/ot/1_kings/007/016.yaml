  terminology: כֹתֶרֶת는 기둥의 장식적 상단부를 뜻하므로 ‘기둥머리’가 적절합니다. מֻצַק נְחֹשֶׁת는 ‘주조한 놋쇠로 된’으로 유지하여 주조 공정과 전통적 금속 명칭을 함께 보존했습니다. ‘관’은 가능한 어휘 대안으로 각주에서만 제시합니다.
