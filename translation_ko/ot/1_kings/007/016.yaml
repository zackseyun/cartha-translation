  source_fidelity: 히브리어의 두 기둥 상단 장식, 주조 금속, 설치 목적, 각 장식의 높이(각 다섯 규빗)를 전반적으로 충실히 옮겼습니다. 다만 본문의 ‘주柱’는 명백한 표기 오류이며, ‘그 하나 머리장식’은 한국어에서 부자연스럽습니다.
