  lexicon: HALOT
  rationale: 원문 단위를 보존하는 것이 가장 투명하므로 ‘규빗’을 유지했습니다.
theological_decisions:
- issue: 기둥 위 장식의 의미
  chosen_reading: architectural ornament on pillars, not royal or cultic crowns
  alternative_readings:
  - 왕관
  - 관
  - 면류관
  rationale: 문맥상 성전 기둥의 상단 장식이므로, 왕권적 의미를 떠올리게 하는 번역은 피하고 건축적 기능을 분명히 했습니다.
  doctrine_reference: 성전 건축 묘사의 문맥적 해석
