base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/016.yaml
  text: He made two capitals of cast bronze to set on the tops of the pillars. The height of the one capital was five cubits[a], and the height of the second capital was five cubits.
  footnotes:
  - marker: a
    text: Or 'crowns' for 'capitals'; the Hebrew term denotes the top ornamental section of a pillar.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 기둥들의 꼭대기에 놓을 주조한 놋쇠로 된 두 기둥머리[a]를 만들었습니다. 한 기둥머리의 높이는 다섯 규빗이었고, 둘째 기둥머리의 높이도 다섯 규빗이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘관’. 여기서 히브리어는 기둥의 장식된 윗부분을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  english_pob_choice: capitals / capital
  chosen_korean: 머리장식
  alternatives_korean:
  - 기둥머리
  - 주두
  - 관
  lexicon: HALOT
  rationale: 건축 맥락의 기둥 윗장식을 가리키므로, 현대 독자가 이해하기 쉬우면서도 장식 부위를 드러내는 ‘머리장식’을 택했습니다.
- source_word: עָשָׂה
  english_pob_choice: made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 제작했습니다
  - 지었습니다
  lexicon: HALOT
  rationale: 단순한 제작 서술로서 무난하고 자연스러운 현대 한국어 동사인 ‘만들었습니다’가 원문의 평이한 서술을 잘 살립니다.
- source_word: לָתֵת
  english_pob_choice: to set
  chosen_korean: 얹을
  alternatives_korean:
  - 놓을
  - 설치할
  lexicon: HALOT
  rationale: 기둥 꼭대기에 올려 두는 목적을 나타내므로, 물리적으로 위에 ‘얹는’ 느낌이 가장 직접적입니다.
- source_word: מֻצַק נְחֹשֶׁת
  english_pob_choice: of cast bronze
  chosen_korean: 주조한 놋쇠로 된
  alternatives_korean:
  - 주조한 청동으로 된
  - 부어 만든 놋쇠의
  lexicon: HALOT
  rationale: 주조 과정을 분명히 드러내기 위해 ‘주조한’을 살렸고, 한국어 성경 전통에서 널리 쓰이는 금속명인 ‘놋쇠’를 사용했습니다.
- source_word: חָמֵשׁ אַמּוֹת
  english_pob_choice: five cubits
  chosen_korean: 다섯 규빗
  alternatives_korean:
  - 약 2.3미터
  - 5암마
  lexicon: HALOT
  rationale: 원문 단위를 보존하는 것이 가장 투명하므로 ‘규빗’을 유지했습니다.
theological_decisions:
- issue: 기둥 위 장식의 의미
  chosen_reading: architectural ornament on pillars, not royal or cultic crowns
  alternative_readings:
  - 왕관
  - 관
  - 면류관
  rationale: 문맥상 성전 기둥의 상단 장식이므로, 왕권적 의미를 떠올리게 하는 번역은 피하고 건축적 기능을 분명히 했습니다.
  doctrine_reference: 성전 건축 묘사의 문맥적 해석
