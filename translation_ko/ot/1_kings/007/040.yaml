base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/040.yaml
  text: And Hiram made the basins[a], the shovels, and the bowls. So Hiram finished doing all the work that he did for King Solomon for the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'sprinkling bowls,' referring to bowls used in sacrificial rites.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 히람은 대야들과 부삽들과 대접들을 만들었습니다. 이렇게 히람은 야훼의 집을 위해 솔로몬 왕에게 하던 모든 일을 끝냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뿌리는 그릇들’로도 옮길 수 있으며, 제의 때 액체를 담거나 붓는 그릇을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיֹּרוֹת
  english_pob_choice: basins
  chosen_korean: 대야들
  alternatives_korean:
  - 세수대야들
  - 물두멍들
  lexicon: HALOT
  rationale: 성전 기구로서의 큰 씻는 그릇이라는 뜻을 살리면서, 현대 한국어에서 자연스럽고 과도하게 예전식이지 않은 표현을 택했습니다.
- source_word: יָּעִים
  english_pob_choice: shovels
  chosen_korean: 부삽들
  alternatives_korean:
  - 삽들
  - 재삽들
  lexicon: HALOT
  rationale: 재나 숯을 다루는 도구라는 맥락을 반영해 일반 ‘삽’보다 더 구체적인 ‘부삽’을 선택했습니다.
- source_word: מִּזְרָקוֹת
  english_pob_choice: bowls
  chosen_korean: 대접들
  alternatives_korean:
  - 그릇들
  - 제사용 대접들
  lexicon: HALOT
  rationale: 제의적 용도의 용기를 가리키므로, 넓은 의미의 ‘그릇’보다 예배 맥락에 맞는 ‘대접’으로 옮겼습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: for the house of Yahweh
  chosen_korean: 야훼의 집을 위해
  alternatives_korean:
  - 여호와의 집을 위해
  - 야훼의 성전을 위해
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문의 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 히브리어의 ‘집’을 그대로 살려 ‘성전’으로만 치환하지 않았습니다.
theological_decisions:
- issue: 히브리어 완료 서술의 마무리 표현
  chosen_reading: ‘이렇게 히람은 ... 끝냈습니다’로 공적 보고문처럼 마무리
  alternative_readings:
  - ‘그래서 히람은 ... 마쳤습니다’
  - ‘... 모든 일을 완성했습니다’
  rationale: 히브리어 וַיְכַל의 완료·종결 뉘앙스를 유지하되, 한국어에서는 공사 완료 보고에 어울리는 자연스러운 종결문으로 처리했습니다.
  doctrine_reference: 서술문 문체/완결성
