id: 1KI.7.8
reference: 1 Kings 7:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בֵית/וֹ֩ אֲשֶׁר יֵ֨שֶׁב שָׁ֜ם חָצֵ֣ר הָ/אַחֶ֗רֶת מִ/בֵּית֙ לָֽ/אוּלָ֔ם כַּ/מַּֽעֲשֶׂ֥ה הַ/זֶּ֖ה הָיָ֑ה וּ/בַ֜יִת יַעֲשֶׂ֤ה לְ/בַת פַּרְעֹה֙ אֲשֶׁ֣ר לָקַ֣ח שְׁלֹמֹ֔ה כָּ/אוּלָ֖ם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/008.yaml
  text: His house where he was to live[a], in the other court farther back from the Hall, was of the same workmanship. He also made a house like this Hall for Pharaoh’s daughter[b], whom Solomon had taken as wife.
  footnotes:
  - marker: a
    text: Or 'in another court, farther inward from the Hall.' The Hebrew spatial phrase is difficult, and translations vary in how they describe the residence’s position relative to the Hall.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'whom Solomon had taken'; that is, taken in marriage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 집, 곧 그가 거주할 곳은 다른 뜰, 곧 홀에서 더 안쪽에 있는 곳에 있었으며, 그 공사는 이와 같은 솜씨로 되어 있었습니다. 솔로몬은 또 파라오의 딸, 곧 자기가 아내로 맞은 여자를 위하여 이 홀이와 같은 집을 지었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 공간 표현은 해석이 어려워, 번역본들마다 ‘홀에서 더 안쪽에 있는 곳’, ‘홀에서 더 뒤쪽에 있는 곳’ 등으로 다르게 옮깁니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘솔로몬이 취한 여자’입니다. 여기서는 혼인하여 아내로 맞은 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵיתוֹ
  english_pob_choice: His house
  chosen_korean: 그의 집
  alternatives_korean:
  - 그리고 그의 집
  - 또 그의 집
  lexicon: HALOT
  rationale: 문맥상 다음 건축물 설명을 여는 표현이므로, 접속사의 기능은 한국어에서 자연스럽게 흡수하고 핵심 명사구만 살렸습니다.
- source_word: אֲשֶׁר יֵשֶׁב שָׁם
  english_pob_choice: where he was to live
  chosen_korean: 곧 그가 거주할 곳
  alternatives_korean:
  - 그가 살 곳
  - 그가 거주하던 곳
  lexicon: HALOT
  rationale: 요지는 실제 거처를 가리키는 설명이므로, 미래/의도적 용법을 살려 ‘거주할 곳’으로 옮겼습니다.
- source_word: חָצֵר הָאַחֶרֶת מִבֵּית לָאוּלָם
  english_pob_choice: the other court farther back from the Hall
  chosen_korean: 다른 뜰, 곧 홀에서 더 안쪽에 있는 곳
  alternatives_korean:
  - 다른 뜰, 곧 홀에서 더 뒤쪽에 있는 곳
  - 다른 뜰, 곧 홀로부터 더 안쪽에 있는 곳
  lexicon: HALOT
  rationale: חָצֵר는 건축 맥락에서 ‘뜰’이 가장 무난하고, מִבֵּית לָאוּלָם의 난해한 공간 관계는 ‘더 안쪽에 있는 곳’으로 과도한 해석 없이 전달했습니다.
- source_word: כַּמַּעֲשֶׂה הַזֶּה הָיָה
  english_pob_choice: was of the same workmanship
  chosen_korean: 이와 같은 솜씨로 되어 있었습니다
  alternatives_korean:
  - 이와 같은 공사로 되어 있었습니다
  - 같은 솜씨였습니다
  - 같은 설계였습니다
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 단순한 ‘행위’가 아니라 제작/공사상의 결과를 가리키므로, 건축 문맥에 맞게 ‘솜씨’와 ‘되어 있었습니다’로 자연스럽게 풀었습니다.
- source_word: וּבַיִת יַעֲשֶׂה לְבַת פַּרְעֹה
  english_pob_choice: He also made a house for Pharaoh’s daughter
  chosen_korean: 솔로몬은 또 파라오의 딸을 위하여 집을 지었습니다
  alternatives_korean:
  - 솔로몬은 또 파라오의 딸을 위해 집을 만들었습니다
  - 솔로몬은 또한 파라오의 딸을 위한 집을 지었습니다
  lexicon: HALOT
  rationale: לְבַת פַּרְעֹה는 수혜 대상을 나타내므로 ‘위하여’로 자연스럽게 살렸고, 건축 서술에는 ‘집을 지었습니다’가 적절합니다.
- source_word: אֲשֶׁר לָקַח שְׁלֹמֹה
  english_pob_choice: whom Solomon had taken as wife
  chosen_korean: 곧 자기가 아내로 맞은 여자를
  alternatives_korean:
  - 곧 솔로몬이 취한 여자를
  - 곧 솔로몬이 아내로 삼은 여자를
  lexicon: HALOT
  rationale: לָקַח는 여성 목적어와 함께 혼인 취함을 뜻하므로, 한국어에서 오해가 없도록 ‘아내로 맞은’으로 풀이했습니다.
- source_word: כָּאוּלָם הַזֶּה
  english_pob_choice: like this Hall
  chosen_korean: 이 홀이와 같은 집
  alternatives_korean:
  - 이 홀이 같은 집
  - 이 홀과 같은 집
  lexicon: HALOT
  rationale: 비교 대상이 앞서 나온 구조물과의 유사성이므로, 반복을 피하면서도 ‘이 홀과 같은’의 대응 관계를 분명히 했습니다.
theological_decisions:
- issue: אַרכיטექტур적/공간적 표현의 난해성
  chosen_reading: ‘홀에서 더 안쪽에 있는 곳’으로 옮겨, 본문의 공간 관계를 과도하게 확정하지 않았습니다.
  alternative_readings:
  - ‘홀에서 더 뒤쪽에 있는 곳’
  - ‘홀 내부에서 더 안쪽’
  rationale: 히브리어 מִבֵּית לָאוּלָם은 해석이 엇갈리는 난구이므로, POB의 주석적 신중함을 따라 최소한의 방향성만 제시했습니다.
  doctrine_reference: 본문의 역사·건축 서술에 대한 해석 신중성
