id: 1KI.7.46
reference: 1 Kings 7:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/כִכַּ֤ר הַ/יַּרְדֵּן֙ יְצָקָ֣/ם הַ/מֶּ֔לֶךְ בְּ/מַעֲבֵ֖ה הָ/אֲדָמָ֑ה בֵּ֥ין סֻכּ֖וֹת וּ/בֵ֥ין צָרְתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/046.yaml
  text: In the plain of the Jordan the king cast them[c][b][a], in the clay ground between Sukkoth and Zarethan.
  footnotes:
  - marker: a
    text: Or 'the Jordan Valley.' The Hebrew literally refers to the district/plain of the Jordan.
    reason: lexical_alternative
  - marker: b
    text: Or 'poured them'; the verb refers to casting metal objects.
    reason: lexical_alternative
  - marker: c
    text: Literally 'in the thickness of the ground,' likely meaning dense clay soil suitable for casting.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 요단 평원[a]의 진흙 땅[b][c], 곧 숙곳과 사르단 사이에서 그것들을 부었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요단 계곡’입니다. 히브리어는 문자적으로 ‘요단의 구역/평원’을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘부어 만들었습니다’입니다. 이 동사는 금속을 주조할 때 쓰입니다.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로는 ‘땅의 두터움’이며, 주조에 알맞은 질은 토양을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  english_pob_choice: In the plain of the Jordan
  chosen_korean: 요단 평원
  alternatives_korean:
  - 요단의 평야
  - 요단 계곡
  - 요단 둔덕
  lexicon: HALOT
  rationale: כִּכָּר는 지리적 문맥에서 요단 주변의 넓은 평원/구역을 가리키므로, 한국어로는 자연스럽고 의미를 잘 드러내는 ‘평원’이 적절합니다.
- source_word: יְצָקָם
  english_pob_choice: cast them
  chosen_korean: 부었습니다
  alternatives_korean:
  - 주조했습니다
  - 쏟아부었습니다
  - 부어 만들었습니다
  lexicon: HALOT
  rationale: יצק은 금속을 ‘붓다/주조하다’의 뜻을 가지며, 여기서는 청동 기구를 만드는 맥락이므로 ‘부었습니다’가 원문의 동작과 공정을 무리 없이 살립니다.
- source_word: בְּמַעֲבֵה הָאֲדָמָה
  english_pob_choice: in the clay ground
  chosen_korean: 진흙 땅
  alternatives_korean:
  - 두꺼운 땅
  - 질은 땅
  - 점토질 땅
  lexicon: HALOT
  rationale: מַעֲבֶה는 ‘두꺼움/밀도’를 뜻하지만, 여기서는 주조에 적합한 단단하고 질은 토양을 가리키므로 ‘진흙 땅’이 문맥상 가장 이해하기 쉽습니다.
- source_word: בֵּין סֻכּוֹת וּבֵין צָרְתָן
  english_pob_choice: between Sukkoth and Zarethan
  chosen_korean: 숙곳과 사르단 사이
  alternatives_korean:
  - 수곳과 사르단 사이
  - 숙곳과 자레단 사이
  - 숙곳과 사레단 사이
  lexicon: HALOT
  rationale: 두 지명은 음역하는 것이 타당하며, 한국어 성경에서 널리 쓰이는 ‘숙곳’을 유지하고 צָרְתָן은 현대 외래어 표기 취지에 맞춰 ‘사르단’으로 옮겼습니다.
theological_decisions:
- issue: 왕의 주체를 개인명으로 풀지 않고 일반 명사로 유지하는지 여부
  chosen_reading: ‘왕’으로 옮겨, 본문이 가진 일반 명사 표현을 그대로 살렸습니다.
  alternative_readings:
  - 솔로몬 왕
  - 솔로몬이
  rationale: 히브리어는 정관사 붙은 일반 명사 הַמֶּלֶךְ를 사용하므로, 본문 자체는 ‘왕’을 말합니다. 문맥상 솔로몬을 가리키지만 번역문에서 그 해석을 미리 고정하지 않았습니다.
  doctrine_reference: 본문 충실성과 주해적 절제
