id: 1KI.7.35
reference: 1 Kings 7:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/רֹ֣אשׁ הַ/מְּכוֹנָ֗ה חֲצִ֧י הָ/אַמָּ֛ה קוֹמָ֖ה עָגֹ֣ל סָבִ֑יב וְ/עַ֨ל רֹ֤אשׁ הַ/מְּכֹנָה֙ יְדֹתֶ֔י/הָ וּ/מִסְגְּרֹתֶ֖י/הָ מִמֶּֽ/נָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/035.yaml
  text: And on the top of the stand there was a round rim all around[a], half a cubit high[b]; and on the top of the stand its supports and its panels were of one piece with it.
  footnotes:
  - marker: a
    text: Or 'its handles'; the Hebrew יְדֹתֶיהָ literally means 'its hands' and may refer to projecting parts of the stand.
    reason: lexical_alternative
  - marker: b
    text: Or 'its frames' for 'its panels.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 받침대의 윗부분에는 사방으로 둘린 둥근 테가 있었고, 높이는 반 규빗이었습니다[a]. 또한 받침대의 윗부분에는 그 받침대와 한 덩어리인 지지대들과 판들이 있었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사방으로 둘린 테’; 히브리어 עָגֹל סָבִיב은 둥글게 둘러진 가장자리 또는 고리를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 판들’; 히브리어 מִסְגְּרֹת은 이 구조물의 틀 또는 패널을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹאשׁ הַמְּכוֹנָה
  english_pob_choice: on the top of the stand
  chosen_korean: 받침대의 윗부분에는
  alternatives_korean:
  - 받침대의 꼭대기에는
  - 받침대 위에는
  lexicon: HALOT
  rationale: מְכוֹנָה는 이 문맥에서 제사 기구의 구조물인 ‘stand’에 해당하므로 ‘받침대’로 옮기고, רֹאשׁ은 구조물의 상단을 가리키므로 ‘윗부분’으로 자연스럽게 표현했습니다.
- source_word: עָגֹל סָבִיב
  english_pob_choice: a round rim all around
  chosen_korean: 사방으로 둘린 둥근 테
  alternatives_korean:
  - 둥근 테가 사방으로 둘려 있는
  - 사방으로 둘러진 둥근 가장자리
  lexicon: HALOT
  rationale: עָגֹל은 ‘둥근’, סָבִיב은 ‘둘러/사방으로’의 뜻이므로, 구조물의 형태를 살려 ‘둥근 테’로 옮겼습니다. 영어 POB의 ‘rim’에 해당하는 건축적 표현을 유지하되 과도한 해석은 피했습니다.
- source_word: יְדֹתֶיהָ
  english_pob_choice: its supports
  chosen_korean: 지지대들
  alternatives_korean:
  - 손잡이들
  - 받침들
  lexicon: HALOT
  rationale: 직역하면 ‘손들’이지만, 이 건축 묘사에서는 돌출된 구조 부재를 가리키므로 ‘지지대들’이 가장 문맥에 맞습니다. 영어 POB가 남겨 둔 ‘handles’ 가능성은 본문 의미의 대안으로 처리할 수 있습니다.
- source_word: וּמִסְגְּרֹתֶיהָ
  english_pob_choice: its panels
  chosen_korean: 판들
  alternatives_korean:
  - 틀들
  - 테두리들
  lexicon: HALOT
  rationale: מִסְגְּרוֹת은 이 장치의 구획된 면/테를 가리키는 건축 용어로 보이며, 현대 한국어에서는 ‘판들’이 가장 읽기 쉽고 기능을 드러냅니다.
- source_word: מִמֶּנָּה
  english_pob_choice: were of one piece with it
  chosen_korean: 그 받침대와 한 덩어리인
  alternatives_korean:
  - 그것과 한 몸인
  - 그것에서 나온
  lexicon: HALOT
  rationale: מן+대명사는 분리된 부착물이 아니라 본체와의 일체성을 나타내므로, 영어 POB의 ‘of one piece with it’를 살려 ‘한 덩어리인’으로 옮겼습니다.
