translation:
  language: ko
  text: 창문틀이 세 줄로 있었고, 창문은 창문과 마주 보게 세 차례 배치되어 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “창문과 창문이 세 층에서 서로 마주 보고 있었다.” 히브리어는 문자적으로 “창문 대 창문, 세 번”이라고 말하며, 세 단에 걸쳐 같은 배열이 반복되었음을 가리킬 수 있습니다.
    reason: lexical_alternative
