translation:
  language: ko
  text: 그리고 그 솥들과 삽들과 대야들과, 야훼의 집을 위해 솔로몬 왕을 위하여 히람이 만든 그 모든 기구들은 다 두들겨 만든 청동이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘솥들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘대야들’은 ‘그릇들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘두들겨 만든’은 ‘윤이 나게 닦은’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  english_pob_choice: the pots
  chosen_korean: 솥들
  alternatives_korean:
  - 냄비들
  - 항아리들
  lexicon: HALOT
  rationale: 제사용 기물 목록에서 סִירוֹת는 내용물과 용도상 ‘솥들’이 가장 자연스럽고, ‘pots’의 넓은 범위를 무리 없이 옮깁니다.
- source_word: הַיָּעִים
  english_pob_choice: the shovels
  chosen_korean: 삽들
  alternatives_korean:
  - 스쿠프들
  - 퍼내는 도구들
  lexicon: HALOT
  rationale: 제단에서 재를 다루는 도구로서 ‘shovels’에 해당하는 일반적이고 이해하기 쉬운 표현은 ‘삽들’입니다.
- source_word: הַמִּזְרָקוֹת
  english_pob_choice: the basins
  chosen_korean: 대야들
  alternatives_korean:
  - 그릇들
  - 바구니들
  lexicon: HALOT
  rationale: మִזְרָקוֹת는 액체를 담거나 붓는 그릇이므로, 예배용 용기라는 문맥을 살리면서도 구체적인 ‘대야들’이 적절합니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 집안
  lexicon: HALOT
  rationale: 직역에 가까운 ‘집’을 유지해 히브리어 표현을 보존했고, יְהוָה는 본문 원문 표기와 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: נְחֹשֶׁת מְמֹרָט
  english_pob_choice: burnished bronze
  chosen_korean: 두들겨 만든 청동
  alternatives_korean:
  - 윤이 나게 닦은 청동
  - 광을 낸 청동
  lexicon: HALOT
  rationale: מְמֹרָט는 단순한 광택보다 금속을 두드려 매끈하게 다듬은 느낌이 있어, 공예적 처리와 결과를 함께 드러내는 ‘두들겨 만든’으로 살렸습니다.
theological_decisions:
