  text: 또 그 솥들[a]과 삽들과 대야들[b]과 히람이 솔로몬 왕을 위하여 야훼의 집에 만든 그 모든 기구는 윤을 낸 청동[c]이었습니다.
  philosophy: optimal-equivalence
  footnotes:
