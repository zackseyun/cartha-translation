  rationale: 직역에 가까운 ‘집’을 유지해 히브리어 표현을 보존했고, יְהוָה는 본문 원문 표기와 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: נְחֹשֶׁת מְמֹרָט
