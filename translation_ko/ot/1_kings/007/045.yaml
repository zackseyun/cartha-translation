  lexicon: HALOT
  rationale: మִזְרָקוֹת는 액체를 담거나 붓는 그릇이므로, 예배용 용기라는 문맥을 살리면서도 구체적인 ‘대야들’이 적절합니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
