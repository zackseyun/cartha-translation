translation:
  language: ko
  text: 기둥들 꼭대기에는 백합꽃 모양의 세공이 있었고,[a] 기둥들에 대한 작업은 끝났습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백합 장식’. 히브리어 שׁוֹשָׁן은 문자적으로 ‘백합’이며, 여기서는 백합꽃 모양의 장식을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기둥들의 작업이 마무리되었습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  english_pob_choice: top
  chosen_korean: 꼭대기
  alternatives_korean:
  - 머리
  - 윗부분
  - 상단
  lexicon: HALOT
  rationale: 기둥의 건축 맥락에서 רֹאשׁ는 사람의 '머리'가 아니라 상부를 가리키므로, 현대 한국어에서는 자연스럽고 구체적인 '꼭대기'가 가장 적절합니다.
- source_word: מַעֲשֵׂה שׁוֹשָׁן
  english_pob_choice: lily-work
  chosen_korean: 백합 무늬 장식
  alternatives_korean:
  - 백합 무늬
  - 백합 장식
  - 백합 형상의 장식
  lexicon: HALOT
  rationale: 직역하면 '백합의 작업'이지만, 문맥상 장식물의 형상을 뜻하므로 '무늬 장식'으로 풀어 건축 장식의 뜻을 살렸습니다.
- source_word: וַתִּתֹּם מְלֶאכֶת הָעַמּוּדִים
  english_pob_choice: and the work of the pillars was finished
  chosen_korean: 기둥들의 공사는 마무리되었습니다
  alternatives_korean:
  - 기둥들의 일이 끝났습니다
  - 기둥들의 작업이 완성되었습니다
  - 기둥들의 공사가 끝났습니다
  lexicon: HALOT
  rationale: מְלֶאכֶת은 단순한 '일'보다 건축 현장의 공사·작업을 가리키는 맥락이므로, 한국어에서는 '공사'가 가장 자연스럽고 의미도 분명합니다.
