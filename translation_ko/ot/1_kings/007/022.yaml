  terminology: שׁוֹשָׁן은 전통적이고 기본적인 어휘값을 따라 ‘백합꽃’으로 옮기되, 문맥상 장식 형상임을 ‘모양의 세공’으로 나타냈습니다. מְלֶאכֶת은 특정 공사로 한정하지 않고 ‘작업’으로 유지했습니다.
