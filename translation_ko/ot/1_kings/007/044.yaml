translation:
  language: ko
  text: 그리고 그 바다 하나와 그 바다 아래에 있는 열두 마리의 소입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 물두멍 하나와 그 물두멍 아래에 있는 열두 마리의 소’입니다. 히브리어는 이 큰 물 저장기를 가리켜 ‘바다’라고 부릅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  english_pob_choice: Sea
  chosen_korean: 바다
  alternatives_korean:
  - 대야
  - 물두멍
  - 바다(고유명사)
  lexicon: HALOT
  rationale: 성전 기구 목록의 문맥에서 יָם은 큰 주조 물통을 가리키므로, 영어 POB의 설명을 따라 본뜻은 살리되 한국어로는 자연스러운 ‘바다’로 옮겼습니다.
- source_word: הָאֶחָד
  english_pob_choice: the one
  chosen_korean: 그 하나의
  alternatives_korean:
  - 하나의
  - 그 한
  lexicon: HALOT
  rationale: 단수의 특정 기구를 다른 여러 기구들과 구별하는 정관적 표현이므로, 단순한 수사 ‘하나’보다 ‘그 하나의’가 원문의 특정성을 더 잘 드러냅니다.
- source_word: הַבָּקָר
  english_pob_choice: oxen
  chosen_korean: 소
  alternatives_korean:
  - 황소
  - 소들
  - 쇠
  lexicon: HALOT
  rationale: 이 구절은 받침 장식으로 사용된 소 형상을 말하므로, 성별을 덧씌우는 ‘황소’보다 중립적인 ‘소’가 원문과 영어 POB의 의미를 더 안정적으로 반영합니다.
- source_word: תַּחַת
  english_pob_choice: under
  chosen_korean: 아래의
  alternatives_korean:
  - 밑의
  - 아래에 있는
  lexicon: HALOT
  rationale: 받침 구조를 설명하는 위치 관계이므로, 한국어에서는 명사구 내부의 수식으로 자연스러운 ‘아래의’를 선택했습니다.
