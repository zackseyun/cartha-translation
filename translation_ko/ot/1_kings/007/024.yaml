  text: And gourds were under its rim all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The gourds were in two rows, cast in one piece with it.
  footnotes:
  - marker: a
    text: Or 'buds' or 'knobs'; the Hebrew term refers to gourd-like ornamental forms.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그릇 아래에는 오이 모양 장식들이 사방으로 둘려 있었는데, 한 규빗에 열 개씩이어서 바다를 사방으로 둘러싸고 있었습니다. 그 오이 모양 장식들은 두 줄로 되어 있었고, 그것은 그것이 주조될 때 함께 주조된 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘꽃눈’ ‘마디’로도 옮길 수 있습니다. 히브리어 용어는 오이 모양의 장식적 형태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקָעִים
  english_pob_choice: gourds
  chosen_korean: 오이 모양 장식들
  alternatives_korean:
  - 박 모양 장식들
  - 조롱박 장식들
  - 박들
  lexicon: HALOT
  rationale: 문맥상 식물 자체보다 장식적 돌기 형상을 가리키므로, 한국어에서는 자연스럽고 오해를 덜 낳는 ‘오이 모양 장식들’로 옮겼습니다.
- source_word: מִתַּחַת לִשְׂפָתוֹ
  english_pob_choice: under its rim
  chosen_korean: 그릇 아래에는
  alternatives_korean:
  - 테두리 아래에는
  - 가장자리 아래에는
  - 입술 아래에는
  lexicon: HALOT
  rationale: 큰 청동 그릇의 상단 가장자리를 가리키므로, ‘rim’의 자연스러운 한국어 대응으로 상황을 과도하게 해석하지 않는 ‘그릇 아래에는’으로 처리했습니다.
- source_word: עֶשֶׂר בָּאַמָּה
  english_pob_choice: ten to the cubit
  chosen_korean: 한 규빗에 열 개씩
  alternatives_korean:
  - 규빗당 열 개
  - 한 규빗마다 열 개
  - 규빗마다 열 개씩
  lexicon: HALOT
  rationale: 배열 밀도를 나타내는 표현이므로 한국어에서는 수량 관계가 바로 드러나도록 ‘한 규빗에 열 개씩’으로 자연화했습니다.
- source_word: הַיָּם
  english_pob_choice: the Sea
  chosen_korean: 바다
  alternatives_korean:
  - 그 바다
  - 바다(대야)
  - 큰 물통
  lexicon: HALOT
  rationale: 솔로몬 성전의 기술용 명칭을 따라, 본문이 가리키는 거대한 물받이의 고유적 명칭을 ‘바다’로 유지했습니다.
- source_word: יְצֻקִים בִּיצֻקָתוֹ
  english_pob_choice: cast in one piece with it
  chosen_korean: 함께 주조된 것이었습니다
  alternatives_korean:
  - 한 덩어리로 주조된 것이었습니다
  - 그것과 함께 부어 만든 것이었습니다
  - 주조할 때 같이 주조된 것이었습니다
  lexicon: HALOT
  rationale: 장식이 나중에 붙은 것이 아니라 본체와 일체로 만들어졌다는 점을 살리기 위해, ‘함께 주조된’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: 성전 기물의 기술적 묘사에서 고유명칭과 형태 설명을 어떻게 처리할지
  chosen_reading: ‘바다’라는 기술명은 유지하고, 장식 형상은 식물학적 정확성보다 형태 전달을 우선해 ‘오이 모양 장식들’로 번역했습니다.
  alternative_readings:
  - ‘큰 대야’로 일반화하기
  - ‘박 장식들’로 식물명을 유지하기
  rationale: 본문의 목적은 성전 기물의 구조와 장식을 묘사하는 것이므로, 기술명은 보존하되 독자가 형상을 즉시 이해할 수 있게 했습니다.
  doctrine_reference: 출 25–27; 왕상 7장 성전 기물 묘사
