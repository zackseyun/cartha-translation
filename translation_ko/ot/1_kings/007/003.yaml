  text: It was paneled with cedar above[a], over the side chambers that were on the pillars, forty-five in all, fifteen to a row.
  footnotes:
  - marker: a
    text: Or 'It was covered with cedar above, over the side structures that were on the pillars.' The Hebrew architectural terms are difficult, especially צלעות ('sides/ribs/side chambers').
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 백향목으로 판넬을 입혔습니다[a]. 즉, 기둥들 위에 있는 옆칸들 위를 덮었는데, 모두 사십오 칸이었고 한 줄에 열다섯 칸씩이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것은 위를 백향목으로 덮었고, 기둥들 위에 있는 옆 구조물들을 덮었습니다.’ 히브리어 건축 용어는 특히 צלעות(‘옆/갈비/옆칸들’) 때문에 뜻이 어렵습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָפֻן
  english_pob_choice: It was paneled
  chosen_korean: 판넬을 입혔습니다
  alternatives_korean:
  - 백향목으로 덮었습니다
  - 백향목으로 입혔습니다
  lexicon: HALOT
  rationale: ספן의 건축적 용법은 마감재로 덮어 입히는 뜻이므로, ‘판넬을 입히다’가 백향목 내장재의 느낌을 가장 자연스럽게 살립니다.
- source_word: בָּאֶרֶז
  english_pob_choice: with cedar
  chosen_korean: 백향목으로
  alternatives_korean:
  - 백향목으로서
  - 백향목을 가지고
  lexicon: HALOT
  rationale: 재료를 나타내는 בְּ 구문이므로, 한국어에서는 ‘백향목으로’가 재료표현으로 가장 간결하고 정확합니다.
- source_word: צְּלָעֹת
  english_pob_choice: side chambers
  chosen_korean: 옆칸들
  alternatives_korean:
  - 측면 구조물들
  - 곁방들
  - 옆방들
  lexicon: HALOT
  rationale: 이 단어는 문자적으로는 ‘옆/갈비’이지만 건축 문맥에서는 구조물의 옆칸 내지 측면 구획을 가리킬 수 있어, 독자가 실제 공간 구성을 이해하도록 ‘옆칸들’로 옮겼습니다.
- source_word: הַטּוּר
  english_pob_choice: a row
  chosen_korean: 한 줄에
  alternatives_korean:
  - 한 열에
  - 한 줄씩
  lexicon: HALOT
  rationale: טור는 배열된 ‘줄/열’을 뜻하므로, 수량 분배를 드러내는 한국어로 ‘한 줄에’가 가장 자연스럽습니다.
