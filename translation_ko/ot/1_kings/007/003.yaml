  text: It was paneled with cedar above[a], over the side chambers that were on the pillars, forty-five in all, fifteen to a row.
  footnotes:
  - marker: a
    text: Or 'It was covered with cedar above, over the side structures that were on the pillars.' The Hebrew architectural terms are difficult, especially צלעות ('sides/ribs/side chambers').
