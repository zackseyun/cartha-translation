  text: וְ/אֶת הַ֠/מְּנֹרוֹת חָמֵ֨שׁ מִ/יָּמִ֜ין וְ/חָמֵ֧שׁ מִ/שְּׂמֹ֛אול לִ/פְנֵ֥י הַ/דְּבִ֖יר זָהָ֣ב סָג֑וּר וְ/הַ/פֶּ֧רַח וְ/הַ/נֵּרֹ֛ת וְ/הַ/מֶּלְקַחַ֖יִם זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/049.yaml
  text: and the lampstands[a], five on the right and five on the left, before the inner sanctuary, of pure gold; and the flowers, the lamps, and the tongs[c][b], of gold.
  footnotes:
  - marker: a
    text: Or 'before the Most Holy Place.' The Hebrew דְּבִיר refers to the temple's innermost room.
    reason: lexical_alternative
  - marker: b
    text: Or 'refined gold' for 'pure gold.'
    reason: lexical_alternative
  - marker: c
    text: Or 'snuffers' for 'tongs.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 안쪽 성소[a] 앞에 순금[b] 등잔대 다섯은 오른쪽에, 다섯은 왼쪽에 있었고, 꽃 장식과 등잔들과 집게[c]는 금으로 되어 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지성소 앞에’. 히브리어 דְּבִיר는 성전의 가장 안쪽 방을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정련된 금’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘등잔 심지 집게’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרוֹת
  english_pob_choice: lampstands
  chosen_korean: 등잔대들
  alternatives_korean:
  - 촛대들
  - 등대들
  lexicon: HALOT
  rationale: מְנוֹרָה는 촛불이 아니라 기름등을 받치는 ‘등잔대’이므로, 전통적이지만 오해를 부를 수 있는 ‘촛대’보다 직접적인 대응을 택했습니다.
- source_word: מִיָּמִין ... מִשְּׂמֹאול
  english_pob_choice: on the right ... on the left
  chosen_korean: 오른쪽 ... 왼쪽
  alternatives_korean:
  - 남쪽 ... 북쪽
  - 우편 ... 좌편
  lexicon: HALOT
  rationale: 히브리어는 방향을 관계적으로 말하고 있으므로, 템플 배치의 추정 방향을 본문에 앞서 넣기보다 ‘오른쪽 ... 왼쪽’으로 살렸습니다.
- source_word: לִפְנֵי הַדְּבִיר
  english_pob_choice: before the inner sanctuary
  chosen_korean: 안쪽 성소 앞에
  alternatives_korean:
  - 지성소 앞에
  - 내실 앞에
  lexicon: HALOT
  rationale: דְּבִיר는 성전의 가장 안쪽 방을 가리키므로, ‘지성소’라는 후대적 용어를 본문에 바로 넣기보다 의미를 드러내는 ‘안쪽 성소’로 옮겼습니다.
- source_word: זָהָב סָגוּר
  english_pob_choice: of pure gold
  chosen_korean: 순금
  alternatives_korean:
  - 정련된 금
  - 순수한 금
  lexicon: HALOT
  rationale: סָגוּר는 정련·고급 금을 뜻하므로, 한국어로는 관용적이면서도 품질을 드러내는 ‘순금’이 가장 자연스럽습니다.
- source_word: הַפֶּרַח / הַנֵּרֹת / הַמֶּלְקַחַיִם
  english_pob_choice: the flowers, the lamps, and the tongs
  chosen_korean: 꽃 장식과 등잔들과 집게
  alternatives_korean:
  - 꽃과 등잔들과 집게
  - 꽃무늬와 등잔들과 집게
  lexicon: HALOT
  rationale: פֶּרַח는 문자적으로 ‘꽃’이지만 여기서는 등잔대 장식 요소를 가리키므로, 오해를 줄이기 위해 ‘꽃 장식’으로 풀어 옮겼고, מֶלְקַחַיִם는 램프를 다루는 도구이므로 ‘집게’로 직역했습니다.
theological_decisions:
- issue: 성소 용어의 한국어 처리
  chosen_reading: ‘안쪽 성소’로 옮겨 본문의 공간 대비를 유지했습니다.
  alternative_readings:
  - 지성소
  - 내실
  rationale: 본문의 דְּבִיר는 성전 내부의 가장 깊은 공간을 가리키지만, 번역 본문에서는 후대 교회 용어의 고정된 인상을 덜고 원문의 공간 감각을 직접 전달하는 것이 더 투명합니다.
  doctrine_reference: 성전 구조와 명칭에 대한 본문-기반 번역 원칙
