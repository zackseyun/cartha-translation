translation:
  language: ko
  text: 솔로몬은 야훼의 집에 있는 모든 기구를 만들었습니다. 곧 금으로 된 제단과, 그 위에 진설병이 놓여 있는 상이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여호와의 성전’. 문자적으로는 ‘여호와의 집’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘진설병’. 문자적으로는 ‘임재의 빵’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 지었습니다
  - 제작했습니다
  lexicon: BDB/HALOT
  rationale: 문맥이 성전 기구 목록이므로 넓은 뜻의 ‘עשה’를 자연스럽게 옮겨 ‘만들었습니다’로 처리했습니다.
- source_word: כָּל הַכֵּלִים
  english_pob_choice: all the vessels
  chosen_korean: 모든 기구
  alternatives_korean:
  - 모든 그릇
  - 모든 기물
  lexicon: HALOT
  rationale: 성전 내부의 예배용 물품들을 가리키므로, 한국어에서는 ‘기구’가 가장 무난하게 cultic inventory의 느낌을 살립니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of the LORD
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 성전
  lexicon: HALOT
  rationale: 직역에 가까운 ‘집’을 살리고, 텍스트의 신명칭은 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: לֶחֶם הַפָּנִים
  english_pob_choice: the bread of the Presence
  chosen_korean: 진설병
  alternatives_korean:
  - 얼굴 앞의 빵
  - 임재의 빵
  lexicon: HALOT
  rationale: 의례 용어로 이미 정착된 표현이어서, 의미를 풀어쓴 설명보다 ‘진설병’을 본문에 유지하고 문맥상 ‘그 위에 … 놓여 있는 상’으로 보완했습니다.
theological_decisions:
- issue: YHWH(יהוה)의 번역
