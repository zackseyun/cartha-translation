  text: וַ/יַּ֧עַשׂ אֶת הַ/מְּכֹנ֛וֹת עֶ֖שֶׂר נְחֹ֑שֶׁת אַרְבַּ֣ע בָּ/אַמָּ֗ה אֹ֚רֶךְ הַ/מְּכוֹנָ֣ה הָֽ/אֶחָ֔ת וְ/אַרְבַּ֤ע בָּֽ/אַמָּה֙ רָחְבָּ֔/הּ וְ/שָׁלֹ֥שׁ בָּ/אַמָּ֖ה קוֹמָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/027.yaml
  text: He made ten bronze stands. The length of each stand was four cubits[a], its width four cubits, and its height three cubits.
  footnotes:
  - marker: a
    text: Or 'bases.' The Hebrew term refers to the bronze supports made for the basins in the temple complex.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 놋으로 된 받침대 열 개를 만들었습니다. 각 받침대의 길이는 네 규빗이고, 너비도 네 규빗이며, 높이는 세 규빗이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '기초대'. 이 히브리어 용어는 성전 परिसर에서 물두멍을 받치도록 만든 청동 구조물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 지었습니다
  - 제작했습니다
  lexicon: HALOT
  rationale: 서술 진행형 완료의 단순 행위를 한국어 과거 서술로 자연스럽게 옮겼습니다. 이 문맥은 성전 기물 제작이므로 '만들다'가 가장 직접적입니다.
- source_word: הַמְּכֹנוֹת
  english_pob_choice: the ... stands
  chosen_korean: 받침대
  alternatives_korean:
  - 기초대
  - 기둥대
  - 틀
  lexicon: HALOT
  rationale: 영어 POB가 주해에서 이 항목을 성전의 대야를 받치는 구조물로 설명하므로, 기능을 드러내는 '받침대'가 가장 분명합니다. '기초'나 '기둥'은 문맥상 오해를 부를 수 있습니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋으로 된
  alternatives_korean:
  - 청동으로 된
  - 구리로 된
  lexicon: HALOT
  rationale: 성전 기물 문맥에서 נְחֹשֶׁת은 전통적 한국어 성경 용례와도 맞는 '놋'이 자연스럽습니다. 영어 POB의 'bronze'와도 대응됩니다.
- source_word: אַמָּה
  english_pob_choice: cubits
  chosen_korean: 규빗
  alternatives_korean:
  - 약 45센티미터
  - 한 규빗
  lexicon: HALOT
  rationale: 원문의 고대 չափ량 단위를 그대로 살려야 하므로 현대 환산치 대신 '규빗'을 유지했습니다. 수치의 정확성과 고대 문맥을 함께 보존합니다.
theological_decisions:
- issue: 성전 기물의 기능을 드러내는 번역
  chosen_reading: '''받침대''로 번역해 대야를 떠받치는 구조물이라는 기능을 본문 안에서 바로 드러냈습니다.'
  alternative_readings:
  - '''기초''로 옮기는 번역'
  - '''기둥''으로 옮기는 번역'
  rationale: 이 절은 신학적 논설보다 성전 기물 목록에 가깝기 때문에, 기능을 정확히 드러내는 번역이 본문의 의도에 더 충실합니다.
  doctrine_reference: 성전 기물 묘사 본문
