  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֹמֵ֞ד עַל שְׁנֵ֧י עָשָׂ֣ר בָּקָ֗ר שְׁלֹשָׁ֣ה פֹנִ֣ים צָפ֡וֹנָ/ה וּ/שְׁלֹשָׁה֩ פֹנִ֨ים יָ֜מָּ/ה וּ/שְׁלֹשָׁ֣ה פֹּנִ֣ים נֶ֗גְבָּ/ה וּ/שְׁלֹשָׁה֙ פֹּנִ֣ים מִזְרָ֔חָ/ה וְ/הַ/יָּ֥ם עֲלֵי/הֶ֖ם מִ/לְ/מָ֑עְלָ/ה וְ/כָל אֲחֹֽרֵי/הֶ֖ם בָּֽיְתָ/ה־׀׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/025.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east; and the Sea was on them above[b], and all their rear parts were inward.'
  footnotes:
  - marker: a
    text: Hebrew 'west' is literally 'sea-ward,' a standard biblical way of indicating the west.
    reason: lexical_alternative
  - marker: b
    text: Or 'all their hindquarters were toward the inside.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 열두 마리의 소 위에 놓여 있었는데, 세 마리는 북쪽을 향하고, 세 마리는 서쪽을 향하고, 세 마리는 남쪽을 향하고, 세 마리는 동쪽을 향하고 있었습니다. 그리고 바다는 그들 위에 있었고, 그들의 뒤쪽은 안쪽을 향하고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘바다 쪽’이지만, 성경 히브리어의 관용적 방향 표현에서는 서쪽을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 뒷부분이 안쪽을 향하고 있었다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמֵד
  english_pob_choice: It stood
  chosen_korean: 놓여 있었는데
  alternatives_korean:
  - 서 있었습니다
  - 서 있었습니다
  lexicon: HALOT
  rationale: 문맥상 ‘바다’가 수직으로 ‘서 있는’ 것이 아니라 열두 소 위에 지지되어 있는 상태이므로, 한국어에서는 자연스럽게 ‘놓여 있었는데’로 옮겨 지지 관계를 드러냈습니다.
- source_word: בָּקָר
  english_pob_choice: oxen
  chosen_korean: 소
  alternatives_korean:
  - 황소
  - 들소
  lexicon: HALOT
  rationale: 이 절은 성전 기물의 지지용 짐승 형상을 묘사하므로, 일반적이고 과도하게 특정되지 않는 ‘소’가 가장 안정적입니다.
- source_word: פֹנִים
  english_pob_choice: facing
  chosen_korean: 을 향하고
  alternatives_korean:
  - 마주 보고
  - 향하여
  lexicon: HALOT
  rationale: 반복되는 방향 표지로서 얼굴의 방향을 나타내므로, 한국어에서는 ‘을 향하고’가 가장 간결하고 자연스럽습니다.
- source_word: הַיָּם
  english_pob_choice: the Sea
  chosen_korean: 바다
  alternatives_korean:
  - 그 바다
  - 바다(대야)
  lexicon: HALOT
  rationale: 여기서는 성전의 큰 주조물 이름이라기보다 직전 문맥의 ‘바다’를 가리키는 지시로 이해되어, 과도한 고유명사화 없이 ‘바다’로 옮겼습니다.
- source_word: אֲחֹרֵיהֶם בָּיְתָה
  english_pob_choice: their rear parts were inward
  chosen_korean: 그들의 뒤쪽은 안쪽을 향하고 있었습니다
  alternatives_korean:
  - 그들의 뒷부분은 안쪽이었습니다
  - 그들의 엉덩이 쪽은 안을 향하고 있었습니다
  lexicon: HALOT
  rationale: ‘뒤쪽/뒷부분’은 동물 형상의 방향을 분명히 하면서도, 원문의 해부학적 표현을 무리 없이 전달합니다. ‘안쪽을 향하고’는 히브리어 방향형의 뜻을 자연스럽게 반영합니다.
theological_decisions:
- issue: 성전 기물의 묘사에서 ‘Sea’를 고유명사로 처리할지 여부
  chosen_reading: ‘바다’로 번역하여 문맥상의 지시 대상을 직접 드러냈습니다.
  alternative_readings:
  - ‘바다’(고유명사처럼 대문자 처리에 해당하는 처리)
  - ‘대야’
  rationale: 이 절은 지지 구조와 방향을 설명하는 기술적 문장으로, 고유명사화보다 평이한 지시가 원문의 기능을 더 잘 드러냅니다.
  doctrine_reference: 성전 기물 묘사 문맥의 서술 기능
