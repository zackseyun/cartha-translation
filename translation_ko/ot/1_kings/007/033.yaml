  text: The workmanship of the wheels was like the workmanship of a chariot wheel[a]; their axles, their rims, their spokes[b], and their hubs were all cast metal.
  footnotes:
  - marker: a
    text: Or 'handles' for 'axles' (יְדוֹתָם); the Hebrew term literally relates to 'hands,' but in this wheel context it likely refers to axle-pieces or supports.
    reason: lexical_alternative
  - marker: b
    text: Or 'bands' for 'spokes' and 'struts' or 'fittings' for 'hubs'; both Hebrew terms are rare, and their exact technical sense is inferred from the context of wheel construction.
    reason: lexical_alternative
translation:
  language: ko
  text: 바퀴의 제작은 병거의 바퀴를 만든 것과 같았고, 그들의 축과 테두리와 살과 중심부는 모두 주조한 금속이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘축’은 직역상 ‘손들’에 해당하는 יְדוֹתָם를 문맥상 해석한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘테두리·살·중심부’는 희귀한 바퀴 부품 용어들(גַבֵּיהֶם, חִשֻּׁקֵיהֶם, חִשֻּׁרֵיהֶם)을 문맥에 따라 옮긴 것입니다.
    reason: lexical_alternative
