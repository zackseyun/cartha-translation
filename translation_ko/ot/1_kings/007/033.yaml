base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/033.yaml
  text: The workmanship of the wheels was like the workmanship of a chariot wheel[a]; their axles, their rims, their spokes[b], and their hubs were all cast metal.
  footnotes:
  - marker: a
    text: Or 'handles' for 'axles' (יְדוֹתָם); the Hebrew term literally relates to 'hands,' but in this wheel context it likely refers to axle-pieces or supports.
    reason: lexical_alternative
  - marker: b
    text: Or 'bands' for 'spokes' and 'struts' or 'fittings' for 'hubs'; both Hebrew terms are rare, and their exact technical sense is inferred from the context of wheel construction.
    reason: lexical_alternative
translation:
  language: ko
  text: 바퀴의 제작 방식은 병거 바퀴의 제작 방식과 같았습니다. 그 축[a]과 테두리와 살과 중심부[b]는 모두 주조한 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘축’은 히브리어 יְדוֹתָם(직역하면 ‘그들의 손들’)을 바퀴 구조의 문맥에 따라 옮긴 것입니다. ‘손잡이’ 또는 ‘지지대’를 뜻할 가능성도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘테두리’, ‘살’, ‘중심부’는 각각 희귀한 히브리어 바퀴 부품 용어(גַבֵּיהֶם, חִשֻּׁקֵיהֶם, חִשֻּׁרֵיהֶם)를 문맥에 따라 옮긴 것입니다. 정확한 기술적 지시는 확실하지 않습니다.
    reason: lexical_alternative
