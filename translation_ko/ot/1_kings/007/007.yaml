  text: And he made the Hall of the Throne[a], where he was to judge—the Hall of Judgment—and it was paneled with cedar from floor to floor.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'from floor to ceiling.' The Hebrew literally reads 'from the floor to the floor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 그가 그곳에서 재판을 하는 왕좌의 전당, 곧 재판의 전당을 만들었습니다. 그 전당은 바닥에서 바닥까지 백향목으로 입혀져 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바닥에서 바닥까지’라고 읽힙니다. 문맥상 ‘바닥에서 천장까지’, 곧 전체 높이에 걸쳐라는 뜻으로 이해하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  english_pob_choice: Hall
  chosen_korean: 홀
  alternatives_korean:
  - 전당
  - 현관
  - 주랑
  lexicon: HALOT
  rationale: אוּלָם은 궁전 안의 넓은 건축 공간을 가리키므로, ‘홀’이 현대 한국어에서 가장 자연스럽고도 격식을 살린 대응입니다.
- source_word: הַכִּסֵּא
  english_pob_choice: the Throne
  chosen_korean: 왕좌
  alternatives_korean:
  - 보좌
  - 왕의 자리
  - 왕좌석
  lexicon: HALOT
  rationale: 문맥상 단순한 의자가 아니라 왕권을 상징하는 자리이므로, ‘왕좌’가 POB의 ‘Throne’에 가장 직접적으로 대응합니다.
- source_word: אֻלָם הַמִּשְׁפָּט
  english_pob_choice: the Hall of Judgment
  chosen_korean: 심판의 홀
  alternatives_korean:
  - 재판의 홀
  - 판결의 방
  - 심판당
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 법정적 ‘판결/재판’ 기능을 가리키므로, ‘심판의 홀’이 기능과 격식을 함께 살립니다.
- source_word: מֵהַקַּרְקַע עַד הַקַּרְקָע
  english_pob_choice: from floor to floor
  chosen_korean: 바닥에서 천장까지
  alternatives_korean:
  - 바닥에서 바닥까지
  - 바닥부터 바닥까지
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘바닥에서 바닥까지’이지만, 건축 묘사에서는 전체 높이를 뜻하는 관용으로 이해되므로 본문에는 자연스러운 의미를 살린 표현을 두고, 문자적 가능성은 각주로 남깁니다.
