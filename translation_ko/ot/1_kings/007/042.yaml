  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הָ/רִמֹּנִ֛ים אַרְבַּ֥ע מֵא֖וֹת לִ/שְׁתֵּ֣י הַ/שְּׂבָכ֑וֹת שְׁנֵֽי טוּרִ֤ים רִמֹּנִים֙ לַ/שְּׂבָכָ֣ה הָֽ/אֶחָ֔ת לְ/כַסּ֗וֹת אֶת שְׁתֵּי֙ גֻּלֹּ֣ת הַ/כֹּֽתָרֹ֔ת אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/עַמּוּדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/042.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on the tops of the pillars.
  footnotes:
  - marker: a
    text: Or 'networks' instead of 'latticeworks.' The Hebrew term refers to ornamental openwork on the capitals.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the two bowls of the capitals.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 두 격자무늬를 위한 석류가 사백 개 있었는데, 각 격자무늬마다 석류 두 줄씩이었으며, 기둥 꼭대기에 있는 두 개의 그릇 모양 머리장식을 가리기 위한 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그물무늬들’. 히브리어 용어는 장식용 열린 세공을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘기둥머리의 두 그릇’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמֹּנִים
  english_pob_choice: pomegranates
  chosen_korean: 석류
  alternatives_korean:
  - 석류 장식
  - 장식용 석류
  lexicon: HALOT
  rationale: 기본 어휘는 실제 과일명인 ‘석류’이며, 본문 자체가 장식용 형상을 설명하므로 한국어 본문도 구체어를 유지하는 것이 원문에 가장 가깝습니다.
- source_word: שְׂבָכוֹת
  english_pob_choice: latticeworks
  chosen_korean: 격자무늬
  alternatives_korean:
  - 격자틀
  - 그물무늬
  - 네트형 장식
  lexicon: HALOT
  rationale: 열린 장식공을 가리키는 말이므로, 현대 한국어에서 자연스럽고 형태를 잘 드러내는 ‘격자무늬’로 옮겼습니다.
- source_word: גֻּלֹּת הַכֹּתָרֹת
  english_pob_choice: bowl-shaped capitals
  chosen_korean: 그릇 모양 머리장식
  alternatives_korean:
  - 그릇 모양의 기둥머리
  - 머리장식 그릇 모양
  - 볼록한 기둥머리
  lexicon: HALOT
  rationale: 건축 용어로는 ‘기둥머리’가 자연스럽지만, 원문의 ‘그릇 같은 둥근 형태’라는 이미지를 살리기 위해 ‘그릇 모양 머리장식’으로 풀어 옮겼습니다.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  english_pob_choice: on the tops of the pillars
  chosen_korean: 기둥 꼭대기에
  alternatives_korean:
  - 기둥 위에
  - 기둥의 윗면에
  - 기둥 꼭대기 위에
  lexicon: HALOT
  rationale: 직역하면 ‘기둥들의 פני/앞면’이지만, 문맥상 실제 위치는 기둥의 맨 위이므로 한국어에서는 공간 관계를 분명히 드러내는 표현을 택했습니다.
