source:
  edition: WLC
  text: וְ/אֵ֨ת אוּלָ֤ם הָֽ/עַמּוּדִים֙ עָשָׂ֔ה חֲמִשִּׁ֤ים אַמָּה֙ אָרְכּ֔/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה רָחְבּ֑/וֹ וְ/אוּלָם֙ עַל פְּנֵי/הֶ֔ם וְ/עַמֻּדִ֥ים וְ/עָ֖ב עַל פְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/006.yaml
  text: He made the Hall of Pillars fifty cubits long and thirty cubits wide[a], with a porch in front of them[b], and pillars and a threshold in front of them.
  footnotes:
  - marker: a
    text: Or 'portico' for both occurrences of אוּלָם; the Hebrew uses the same term twice, but the second likely refers to a frontal porch-like feature attached to the Hall of Pillars.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word rendered 'canopy' (עָב) is uncertain in this architectural context; alternatives include 'threshold,' 'beamwork,' or another covered structural element.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 기둥들의 홀을 만들었는데, 길이는 오십 규빗, 너비는 삼십 규빗이었으며[a], 그 앞에는 현관이 있었고[b], 기둥들과 그 앞의 문지방이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에는 같은 말 אוּלָם이 두 번 나오며, 앞의 것은 ‘홀’, 뒤의 것은 전면의 작은 현관/포르티코를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 עָב는 이 건축 문맥에서 뜻이 분명하지 않아, ‘문지방’ 외에 ‘보’, ‘차양’, ‘덮개’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם הָעַמּוּדִים
  english_pob_choice: Hall of Pillars
  chosen_korean: 기둥들의 홀
  alternatives_korean:
  - 기둥의 홀
  - 기둥 회랑
  - 기둥 현관
  lexicon: HALOT
  rationale: 건축물의 규모와 기능을 고려해, POB의 ‘Hall’을 따라 단순한 ‘현관’보다 넓은 내부 공간을 나타내는 ‘홀’로 옮기고, 소유/특징 관계는 ‘기둥들의’로 드러냈습니다.
- source_word: עָשָׂה
  english_pob_choice: made
  chosen_korean: 만들었는데
  alternatives_korean:
  - 지었는데
  - 세웠는데
  - 건축했는데
  lexicon: HALOT
  rationale: 히브리어 עשה의 기본값인 ‘만들다’를 살리면서, 문맥상 건축 행위임도 자연스럽게 드러나도록 했습니다.
- source_word: חֲמִשִּׁים אַמָּה ... וּשְׁלֹשִׁים אַמָּה
  english_pob_choice: fifty cubits long ... thirty cubits wide
  chosen_korean: 길이는 오십 규빗, 너비는 삼십 규빗이었으며
  alternatives_korean:
  - 오십 규빗 길이와 삼십 규빗 너비였으며
  - 길이 오십 규빗, 너비 삼십 규빗으로
  lexicon: HALOT
  rationale: 히브리어의 치수 표현을 한국어의 자연스러운 서술형으로 옮기되, 정확한 수치를 그대로 보존했습니다.
- source_word: וְאוּלָם עַל פְּנֵיהֶם
  english_pob_choice: with a porch in front of them
  chosen_korean: 그 앞에는 현관이 있었고
  alternatives_korean:
  - 그 앞에는 포르티코가 있었고
  - 그 앞에는 전실이 있었고
  lexicon: HALOT
  rationale: 두 번째 אוּלָם은 첫 번째 ‘홀’과 구분되는 전면부 구조로 보이므로, 한국어에서 기능을 가장 무리 없이 전달하는 ‘현관’을 택했습니다.
- source_word: וְעָב
  english_pob_choice: and a threshold
  chosen_korean: 문지방
  alternatives_korean:
  - 차양
  - 보
  - 덮개
  lexicon: HALOT
  rationale: עָב는 건축 맥락에서 불확실하지만, POB의 조정된 독법에 맞춰 전면부의 구조 요소로 이해되는 ‘문지방’을 채택했습니다.
theological_decisions:
- issue: 건축 용어의 불확실성(עָב) 처리
  chosen_reading: 본문에는 전면부에 있는 추가 구조 요소를 가리키는 것으로 보고 ‘문지방’으로 옮겼습니다.
  alternative_readings:
  - ‘차양’
  - ‘보’
  - ‘덮개’
  rationale: 이 절은 신학적 쟁점보다 건축 묘사의 정확성이 핵심이므로, 주석적으로 불확실성을 남기면서도 한국어 본문은 읽히는 형태로 정리했습니다.
  doctrine_reference: 본문-비평/번역학적 판단
- issue: 전면부 반복 표현의 처리
  chosen_reading: ‘그 앞에는 … 있었고’로 반복되는 공간 관계를 유지했습니다.
  alternative_readings:
  - 의미를 묶어 한 번만 번역
  - 문장 구조를 단순화
  rationale: 히브리어의 반복된 전치 관계를 평탄화하지 않고 보존해, 독자가 구조 묘사의 층위를 따라가도록 했습니다.
  doctrine_reference: 번역 원칙(형식-의미 대응)
