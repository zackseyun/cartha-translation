  - 십
  lexicon: HALOT
  rationale: 수사 עָשֶׂר은 여기서 복수 명사를 수식하므로 한국어에서는 자연스럽게 ‘열’로 옮겼습니다.
- source_word: וְ/אֶת הַ/כִּיֹּרֹת
  english_pob_choice: the basins
