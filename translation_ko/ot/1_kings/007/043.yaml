  rationale: כִּיּוֹר은 성전 기물의 씻는 그릇이므로 전통적이고도 기능을 드러내는 ‘물두멍’이 원문 의미를 가장 잘 보존합니다.
- source_word: עַל הַ/מְּכֹנוֹת
