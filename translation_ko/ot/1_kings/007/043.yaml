  - 그 받침대 위에
  - 받침대에
  lexicon: HALOT
  rationale: עַל은 단순한 접촉보다 ‘위에 놓임’을 나타내므로, 한국어에서는 관계구문 ‘위의’로 압축해 원문의 배치 관계를 분명히 했습니다.
