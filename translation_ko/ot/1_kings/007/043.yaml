  lexicon: HALOT
  rationale: מְכֹנוֹת은 문맥상 물두멍을 받치는 구조물을 가리키므로, 현대 한국어에서는 기능이 드러나는 ‘받침대’가 가장 자연스럽고, POB의 ‘stands’와도 잘 맞습니다.
