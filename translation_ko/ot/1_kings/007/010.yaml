translation:
  language: ko
  text: 그리고 그 기초는 값비싼 돌들로, 큰 돌들로, 곧 길이가 열 규빗인 돌들과 여덟 규빗인 돌들로 되어 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘값비싼 돌들’은 여기서 보석류가 아니라 건축용으로 고급인 석재라는 뜻을 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְיֻסָּד
  english_pob_choice: And the foundation was
  chosen_korean: 그리고 그 기초는
  alternatives_korean:
  - 그리고 그 터는
  - 그리고 그 바닥은
  - 그리고 그것은 기초되었습니다
  lexicon: HALOT
  rationale: 건축 맥락에서 수동적·서술적 표현을 한국어로 자연스럽게 옮기기 위해 ‘기초’로 풀어, 뒤따르는 돌 재료 묘사와의 관계를 분명히 했습니다.
- source_word: אֲבָנִים יְקָרוֹת
  english_pob_choice: of costly stones
  chosen_korean: 값비싼 돌들로
  alternatives_korean:
  - 귀한 돌들로
  - 진귀한 돌들로
  - 보석 같은 돌들로
  lexicon: HALOT
  rationale: 이 표현은 보석이 아니라 값이 비싸고 질이 좋은 건축용 석재를 가리키므로, 오해를 피하려고 ‘값비싼’으로 옮겼습니다.
- source_word: אַבְנֵי עֶשֶׂר אַמּוֹת / וְאַבְנֵי שְׁמֹנֶה אַמּוֹת
  english_pob_choice: stones of ten cubits / and stones of eight cubits
  chosen_korean: 길이가 열 규빗인 돌들과 여덟 규빗인 돌들로
  alternatives_korean:
  - 열 규빗 돌들과 여덟 규빗 돌들로
  - 열 규빗짜리 돌들과 여덟 규빗짜리 돌들로
  - 열 규빗과 여덟 규빗의 돌들로
  lexicon: HALOT
  rationale: 히브리어의 소유·수량 결합을 한국어에서 가장 분명하게 드러내기 위해 ‘길이가 …인’ 구조를 사용했고, 단위 ‘규빗’은 본문의 측량을 그대로 보존했습니다.
