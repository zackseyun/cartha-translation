lexical_decisions:
- source_word: וּמִלְמַעְלָה
  english_pob_choice: And above
  chosen_korean: 그리고 그 위에는
  alternatives_korean:
  - 위에는
  - 그리고 위에는
  - 그리고 위쪽에는
  lexicon: HALOT
  rationale: 건축 묘사에서 아래 층위를 이어 받으면서 상부 구조를 가리키는 말이므로, 자연스러운 한국어로 ‘그 위에는’이라 옮겼습니다.
- source_word: אֲבָנִים יְקָרוֹת
  english_pob_choice: costly stones
  chosen_korean: 비용이 많이 드는 돌들
  alternatives_korean:
  - 값비싼 돌들
  - 귀한 돌들
  - 고가의 돌들
  lexicon: HALOT
  rationale: 문맥상 보석 같은 ‘귀한’보다 건축 재료로서 고급스럽고 값이 많이 든다는 뜻이 강하므로, POB의 ‘costly’를 살려 옮겼습니다.
- source_word: כְּמִדּוֹת גָּזִית
  english_pob_choice: cut according to measure
  chosen_korean: 크기에 맞게 다듬은 것이고
  alternatives_korean:
  - 치수에 맞게 다듬은 것이고
  - 정해진 치수대로 다듬은 것이고
  - 규격에 맞게 손질한 것이고
  lexicon: HALOT
  rationale: ‘according to measures’와 ‘hewn/dressed stone’의 결합으로 보아, 정해진 크기에 맞추어 다듬은 석재라는 뜻을 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: וָאָרֶז
  english_pob_choice: and cedar
  chosen_korean: 백향목이 있었습니다
  alternatives_korean:
  - 백향목도 있었습니다
  - 그리고 백향목이 있었습니다
  - 백향목이었습니다
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘cedar’라고만 말하므로, 재료명을 직접 살리되 건축 맥락에 맞게 ‘백향목’으로 옮겼습니다.
