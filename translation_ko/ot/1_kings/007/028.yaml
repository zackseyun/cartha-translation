  yaml_path: translation/ot/1_kings/007/028.yaml
  text: 'And this was the construction of the stand: they had frames[b][a], and there were frames between the supports.'
  footnotes:
  - marker: a
    text: Or 'frames' for 'panels' (Hebrew מִסְגְּרֹת), referring to framed sections of the stand.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term translated 'supports' may also be rendered 'crossbars,' 'uprights,' or 'rails'; the exact architectural feature is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 바로 그 받침대의 구조입니다. 그것에는 틀이 있었고, 받침들 사이에도 틀이 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘틀’로 옮긴 히브리어 מִסְגְּרֹת는 ‘프레임’, ‘테두리’, ‘판넬’처럼 이해할 수 있는 구조적 부분을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘받침들’로 옮긴 히브리어 הַשְׁלַבִּים는 정확한 건축 요소가 확정적이지 않아 ‘가로대들’, ‘세로기둥들’, ‘지지대들’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
