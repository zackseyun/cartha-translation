source:
  edition: WLC
  text: וְ/חָצֵ֨ר הַ/גְּדוֹלָ֜ה סָבִ֗יב שְׁלֹשָׁה֙ טוּרִ֣ים גָּזִ֔ית וְ/ט֖וּר כְּרֻתֹ֣ת אֲרָזִ֑ים וְ/לַ/חֲצַ֧ר בֵּית יְהוָ֛ה הַ/פְּנִימִ֖ית וּ/לְ/אֻלָ֥ם הַ/בָּֽיִת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/012.yaml
  text: And the great court all around had three rows of cut stone and a row of cedar beams[c][b][a], like the inner court of the house of Yahweh and the vestibule of the house.
  footnotes:
  - marker: a
    text: 'Or ''and for the inner court of the house of the LORD and for the vestibule of the house.'' The Hebrew preposition may be taken as indicating correspondence or relation; here it is rendered comparatively: ''like.'''
    reason: alternative_reading
  - marker: b
    text: Or 'three courses of hewn stone and a course of cedar beams.'
    reason: lexical_alternative
  - marker: c
    text: That is, the entrance hall of the temple building.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 큰 뜰의 사방은 다듬은 돌 세 줄과 백향목 들보 한 줄로 되어 있었고, 야훼의 집 안뜰과 그 집의 현관도 그러했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 집 안뜰과 그 집의 현관을 위하여’. 히브리어 전치사는 비교나 대응의 관계를 나타낼 수 있으며, 여기서는 앞서 말한 구조가 이곳들에도 같았다는 뜻으로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘다듬은 돌 세 단과 백향목 들보 한 단’.
    reason: lexical_alternative
  - marker: c
    text: 즉, 성전 건물의 입구 홀입니다.
    reason: cultural_note
lexical_decisions:
- source_word: חָצֵר הַגְּדוֹלָה
  english_pob_choice: the great court
  chosen_korean: 큰 뜰
  alternatives_korean:
  - 큰 마당
  - 넓은 뜰
  lexicon: HALOT
  rationale: חָצֵר는 성전·궁전 문맥에서 둘러진 뜰을 가리키므로, 현대 한국어에서 가장 자연스러우면서도 건축적 의미를 살리는 ‘뜰’로 옮겼습니다.
- source_word: שְׁלֹשָׁה טוּרִים גָּזִית
  english_pob_choice: three rows of cut stone
  chosen_korean: 세 줄의 다듬은 돌
  alternatives_korean:
  - 세 줄의 깎은 돌
  - 세 단의 다듬은 돌
  lexicon: HALOT
  rationale: טוּר는 건축 문맥에서 ‘줄/층’을 뜻하므로 ‘줄’로 옮겼고, גָּזִית은 가공된 석재를 뜻하므로 ‘다듬은 돌’이 가장 무난합니다.
- source_word: וְטוּר כְּרֻתֹת אֲרָזִים
  english_pob_choice: and a row of cedar beams
  chosen_korean: 한 줄의 백향목 들보
  alternatives_korean:
  - 한 줄의 백향목 재목
  - 한 줄의 백향목 보
  lexicon: HALOT
  rationale: כְּרֻתֹת은 ‘잘라낸’ 목재를 가리키지만 여기서는 건축 요소이므로, 기능이 분명한 ‘들보’로 자연스럽게 옮겼습니다.
- source_word: וְלַחֲצַר בֵּית יְהוָה הַפְּנִימִית וּלְאֻלָם הַבָּיִת
  english_pob_choice: like the inner court of the house of Yahweh and the vestibule of the house
  chosen_korean: 야훼의 집의 안뜰과 그 집의 현관과 같았습니다
  alternatives_korean:
  - 야훼의 집의 안뜰과 그 집의 현관을 따라
  - 야훼의 집의 안뜰과 그 집의 주랑과 같았습니다
  lexicon: HALOT
  rationale: ל은 이 문맥에서 비교/대응을 나타내므로 ‘~과 같았습니다’로 풀어 비교 관계를 드러냈고, אֻלָם은 성전 건축의 입구 공간이어서 ‘현관’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
