  rationale: 본문의 신명기 이름 יְהוָה를 한국어 음역 관행에 따라 ‘야훼’로 옮겨, 본문이 지닌 고유한 언약적 신명성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
