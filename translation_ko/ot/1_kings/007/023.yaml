  source_fidelity: 핵심 어휘와 치수는 대체로 충실합니다. 다만 מִשְּׂפָתוֹ עַד־שְׂפָתוֹ는 ‘가장자리와 가장자리 사이’보다 ‘가장자리에서 가장자리까지’가 양쪽 테 사이의 지름 측정이라는 뜻을 더 정확히 드러냅니다. 또한 יָסֹב의 서술을 ‘줄이 … 두르고 있었습니다’로 옮긴 것은 가능하나, 측정줄이 둘레를 두른 행위를 가리키는 과거 서술로 명료하게 옮기는 편이 좋습니다.
  naturalness: 원문의 병렬 측정 서술에 맞추어 문장을 정돈했습니다. ‘둘레는 둥글게 둘러져 있었으며’는 둘레 자체가 무언가를 둘러싼다는 듯 다소 부자연스럽고 의미가 흐려질 수 있으므로 ‘사방이 둥글었으며’로 고쳤습니다.
  terminology: ‘주조한 바다’는 מוּצָק과 הַיָּם의 형식적 명칭을 적절히 보존합니다. ‘규빗’도 표준적인 단위어입니다. 본문의 케티브 קוה와 전통적 케레 קו의 관계를 각주에서 구별하여 밝혔고, 각주 표지는 해당 어구에 직접 붙였습니다.
