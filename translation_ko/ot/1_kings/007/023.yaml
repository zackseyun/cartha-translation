  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אֶת הַ/יָּ֖ם מוּצָ֑ק עֶ֣שֶׂר בָּ֠/אַמָּה מִ/שְּׂפָת֨/וֹ עַד שְׂפָת֜/וֹ עָגֹ֣ל סָבִ֗יב וְ/חָמֵ֤שׁ בָּֽ/אַמָּה֙ קוֹמָת֔/וֹ ו/קוה שְׁלֹשִׁ֣ים בָּֽ/אַמָּ֔ה יָסֹ֥ב אֹת֖/וֹ סָבִֽיב־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/023.yaml
  text: Then he made the cast sea[a], ten cubits from brim to brim, round all around; its height was five cubits[c][b], and a line of thirty cubits went around it all around.
  footnotes:
  - marker: a
    text: Or 'the basin.' The Hebrew calls this large temple vessel 'the sea,' a formal designation preserved in the main text.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a line of thirty cubits'; that is, its circumference measured thirty cubits.
    reason: cultural_note
  - marker: c
    text: The written form here is קוה ('line'), traditionally read with the sense of measuring cord; compare the parallel in 2 Chronicles 4:2.
    reason: textual_variant
translation:
  language: ko
  text: 그는 주조한 바다[a]를 만들었습니다. 그것은 가장자리에서 가장자리까지 열 규빗이고, 사방이 둥글었으며, 높이는 다섯 규빗이었습니다. 또 삼십 규빗 되는 줄[b][c]이 그것을 사방으로 둘렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “바다”입니다. 본문은 이 대형 성전 용기를 이렇게 부르는 형식적 명칭을 그대로 사용합니다.
    reason: source_note
  - marker: b
    text: 히브리어는 “삼십 규빗 되는 줄”이라고 말합니다. 이는 그 둘레가 삼십 규빗이었음을 나타냅니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 본문의 표기형(케티브)은 קוה이며, 전통적 독법(케레)은 측정줄을 뜻하는 קו입니다. 역대하 4:2과 비교하십시오.
    reason: textual_variant
lexical_decisions:
- source_word: הַיָּם
  english_pob_choice: the cast sea
  chosen_korean: 주조한 바다
  alternatives_korean:
  - 바다
  - 큰 대야
  lexicon: HALOT
  rationale: 히브리어의 형식적 명칭인 “바다”를 유지하되, מוּצָק의 의미를 살려 “주조한”을 붙여 기능과 형식을 함께 드러냈습니다.
- source_word: מוּצָק
  english_pob_choice: cast
  chosen_korean: 주조한
  alternatives_korean:
  - 녹여 만든
  - 부어 만든
  lexicon: HALOT
  rationale: 금속을 부어 만든다는 의미를 자연스럽게 살리는 표준어로 “주조한”이 가장 정확합니다.
- source_word: מִשְּׂפָתוֹ עַד שְׂפָתוֹ
  english_pob_choice: from its brim to its brim
  chosen_korean: 가장자리와 가장자리 사이
  alternatives_korean:
  - 둘레와 둘레 사이
  - 테두리에서 테두리까지
  lexicon: HALOT
  rationale: 그릇의 테를 가리키는 שָׂפָה를 현대 한국어의 물체 경계감에 맞는 “가장자리”로 옮겨, 계량 표현의 뜻을 자연스럽게 전달했습니다.
- source_word: עָגֹל סָבִיב
  english_pob_choice: round all around
  chosen_korean: 둥글게 둘러져 있었으며
  alternatives_korean:
  - 사방으로 둥글었으며
  - 원형으로 둘러져 있었으며
  lexicon: HALOT
  rationale: 중복 강조를 단순히 “둥글다”로만 줄이지 않고, 전체 형태가 원형임을 나타내는 동적인 표현으로 살렸습니다.
- source_word: קוֹמָתוֹ
  english_pob_choice: its height
  chosen_korean: 높이
  alternatives_korean:
  - 키
  - 장대함
  lexicon: HALOT
  rationale: 건축물의 치수를 말하는 문맥이므로 “높이”가 가장 직접적이고 명확합니다.
- source_word: וְקוה
  english_pob_choice: and a line
  chosen_korean: 삼십 규빗 되는 줄
  alternatives_korean:
  - 삼십 규빗의 줄
  - 삼십 규빗짜리 측정줄
  lexicon: HALOT
  rationale: 본문의 ‘줄’은 둘레를 재는 측정 도구를 가리키므로, 의미를 분명히 하되 본문의 간결함을 유지했습니다.
theological_decisions:
- issue: 대형 성전 용기의 명칭을 기능어로 바꿀지, 형식적 호칭을 유지할지
  chosen_reading: “바다”라는 형식적 명칭을 유지하고, 주조된 재질은 별도 형용사로 보완했습니다.
  alternative_readings:
  - “큰 대야”처럼 기능 중심으로 옮김
  - “물두멍”으로 교회 전통어를 사용
  rationale: 히브리어는 이 기구를 관례적으로 “바다”라 부르므로, 기능어로 평탄화하면 의도된 상징성과 명칭의 특수성이 약해집니다.
  doctrine_reference: 성전 기물의 상징 언어를 본문이 부여한 대로 보존하는 원칙
