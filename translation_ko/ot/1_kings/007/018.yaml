id: 1KI.7.18
reference: 1 Kings 7:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ אֶת הָ/עַמּוּדִ֑ים וּ/שְׁנֵי֩ טוּרִ֨ים סָבִ֜יב עַל הַ/שְּׂבָכָ֣ה הָ/אֶחָ֗ת לְ/כַסּ֤וֹת אֶת הַ/כֹּֽתָרֹת֙ אֲשֶׁר֙ עַל רֹ֣אשׁ הָֽ/רִמֹּנִ֔ים וְ/כֵ֣ן עָשָׂ֔ה לַ/כֹּתֶ֖רֶת הַ/שֵּׁנִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/018.yaml
  text: He made the pillars[a], and two rows all around on the one latticework, to cover the capitals that were on top of the pomegranates[b]; and so he did for the second capital.
  footnotes:
  - marker: a
    text: Or 'the pomegranate ornaments.' The Hebrew says 'the pomegranates,' likely referring to decorative pomegranate-shaped elements on the capitals.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of this verse is difficult, and some interpreters understand the rows as belonging to the pomegranate decoration around the latticework of each capital.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 기둥들을 만들었고, 하나의 격자무늬 둘레에 둘씩 둘러 놓아 그 위에 있는 석류들을 덮게 했습니다. 그리고 두 번째 머리장식도 그렇게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘석류들’이라고 하며, 장식용 석류 모양 요소를 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 난해하며, 일부 해석자는 두 줄이 각 머리장식의 격자무늬 둘레에 있는 석류 장식에 속한다고 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He made
  chosen_korean: 만들었고
  alternatives_korean:
  - 지었고
  - 제작했고
  lexicon: HALOT
  rationale: 서사 동작을 자연스럽게 옮기되, 기둥 장식 제작의 맥락을 살려 ‘만들다’로 렌더링했습니다.
- source_word: שְׁנֵי טוּרִים
  english_pob_choice: two rows
  chosen_korean: 하나의 격자무늬 둘레에 둘씩
  alternatives_korean:
  - 두 줄로
  - 두 겹으로
  lexicon: HALOT
  rationale: 직역상 ‘두 줄’이 가능하지만, 본문의 장식 배치를 더 잘 드러내기 위해 행렬적 배열을 나타내는 방식으로 풀어 옮겼습니다.
- source_word: הַשְּׂבָכָה
  english_pob_choice: the latticework
  chosen_korean: 격자무늬
  alternatives_korean:
  - 그물무늬
  - 격자 장식
  lexicon: HALOT
  rationale: 기둥 머리장식의 장식적 구조를 현대 한국어로 가장 분명하게 전달하는 표현입니다.
- source_word: הָרִמֹּנִים
  english_pob_choice: the pomegranates
  chosen_korean: 석류들
  alternatives_korean:
  - 석류 장식들
  - 석류 모양 장식들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘석류들’이지만, 본문상 장식 요소를 가리킬 가능성이 높으므로 본문에는 직역을 유지하고 해석은 주석에서 처리할 수 있게 했습니다.
- source_word: לַכֹּתֶרֶת
  english_pob_choice: the capital
  chosen_korean: 머리장식
  alternatives_korean:
  - 주두
  - 장식머리
  lexicon: HALOT
  rationale: 건축 용어로는 ‘주두’가 정확하지만, 한국어 독자에게 더 읽기 쉽게 기둥 꼭대기 장식을 뜻하는 ‘머리장식’을 선택했습니다.
theological_decisions:
- issue: 반복 구조의 전달
  chosen_reading: ‘그리고 두 번째 머리장식도 그렇게 했습니다’로 반복 완료를 분명히 표현했습니다.
  alternative_readings:
  - ‘그리고 둘째 것도 마찬가지로 했습니다’
  - ‘그리고 두 번째 것도 그렇게 했습니다’
  rationale: 히브리어의 וְכֵן עָשָׂה는 동일한 작업의 반복을 가리키므로, 단순 반복임을 분명히 하되 서술을 자연스럽게 유지했습니다.
  doctrine_reference: 본문 해석상 문제는 아니지만, 공예 묘사의 정확성을 보존하는 번역 원칙에 해당합니다.
