revisions:
- from: 그가 기둥들을 만들었고, 하나의 격자무늬 둘레에 둘씩 둘러 놓아 그 위에 있는 석류들을 덮게 했습니다. 그리고 두 번째 머리장식도 그렇게 했습니다.[a][b]
  to: 그는 기둥들을 만들고, 한 격자무늬 둘레에 두 줄[b]을 둘러 만들었습니다. 이는 석류들[a] 위에 있는 기둥머리들을 덮기 위한 것이었습니다. 그는 둘째 기둥머리에도 그렇게 했습니다.
  rationale: ‘두 줄’과 ‘한 격자무늬 둘레’의 배치를 보존하고, 원문의 문법상 ‘석류들 위에 있는’ 것이 기둥머리들이라는 관계를 바로잡았습니다. 건축 세부의 정확한 물리적 배열은 논쟁적이므로 본문에서 해소하지 않고 대안적 이해를 각주에 남겼습니다.
