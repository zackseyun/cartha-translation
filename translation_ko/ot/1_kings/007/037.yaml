base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/037.yaml
  text: 'Thus he made the ten stands: one casting[a], one measure, one form for all of them.'
  footnotes:
  - marker: a
    text: Or 'one cast work, one size, one design for all of them.' The Hebrew uses three compact parallel expressions to stress that all ten stands were made to the same specification.
    reason: lexical_alternative
translation:
  language: ko
  text: 이와 같이 그는 열 개의 받침대를 만들었습니다. 하나의 주조, 하나의 치수, 하나의 형식이 모두에게 적용되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּזֹאת
  english_pob_choice: Thus
  chosen_korean: 이와 같이
  alternatives_korean:
  - 그와 같이
  - 이렇게
  lexicon: HALOT
  rationale: 앞서 설명한 제작 방식과 규격을 요약해 돌아보는 지시어이므로, 서술을 자연스럽게 여는 ‘이와 같이’가 적합합니다.
- source_word: עֶשֶׂר הַמְּכֹנוֹת
  english_pob_choice: the ten stands
  chosen_korean: 열 개의 받침대
  alternatives_korean:
  - 열 개의 스탠드
  - 열 개의 받침
  lexicon: HALOT
  rationale: 성전 기구 맥락에서 מְכֹנוֹת은 대야를 받치는 받침대/받침 구조물을 가리키므로, 현대 한국어에서 기능을 바로 드러내는 ‘받침대’로 옮겼습니다.
- source_word: מוּצָק אֶחָד
  english_pob_choice: one casting
  chosen_korean: 하나의 주조
  alternatives_korean:
  - 한 번의 주조
  - 하나의 주조품
  lexicon: HALOT
  rationale: 금속을 부어 만든 단일한 제작 방식과 동일성을 나타내므로, 명사형 ‘주조’로 압축해 원문의 병렬성을 살렸습니다.
- source_word: מִדָּה אַחַת קֶצֶב אֶחָד
  english_pob_choice: one measure, one form
  chosen_korean: 하나의 치수, 하나의 형식
  alternatives_korean:
  - 하나의 크기, 하나의 모양
  - 같은 치수, 같은 형식
  lexicon: HALOT
  rationale: 연속된 세 개의 짧은 병렬구가 모두 동일 규격을 강조하므로, ‘치수’와 ‘형식’으로 각각 규모와 형태의 통일성을 살렸습니다.
