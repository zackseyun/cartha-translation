  yaml_path: translation/ot/1_kings/007/036.yaml
  text: On the panels of its supports and on its frames he engraved cherubim[a], lions, and palm trees, according to the space on each[b], with wreaths all around.
  footnotes:
  - marker: a
    text: Or 'wherever there was room for each figure.' The Hebrew phrase is difficult and likely describes the arrangement of the carvings according to the available space.
    reason: lexical_alternative
  - marker: b
    text: Or 'garlands' for 'wreaths.' The Hebrew term likely refers to ornamental festoons surrounding the figures.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 받침대의 지지대에 있는 판들과 그 테두리들 위에, 그는 각각에 알맞은 공간에 따라[a] 그룹들과 사자들과 종려나무 무늬를 새기고, 그 둘레에는 화환 무늬를 새겼습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구문은 어렵습니다. ‘각 도상에 허락된 공간 안에서’ 또는 ‘각각의 자리 여백에 맞추어’라는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘화환’은 사방을 두른 장식용 갈런드 또는 장식 띠를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתַּח
  english_pob_choice: he engraved
  chosen_korean: 새겼으며
  alternatives_korean:
  - 조각했으며
  - 파냈으며
  lexicon: HALOT
  rationale: 건축 장식 문맥에서 금속이나 목재 표면에 문양을 새기는 뜻이므로, 일반적이지만 정확한 ‘새기다’가 가장 자연스럽습니다.
- source_word: הַלֻּחֹת
  english_pob_choice: the panels
  chosen_korean: 판들
  alternatives_korean:
  - 널빤지들
  - 판재들
  lexicon: HALOT
  rationale: 이 단어는 여기서 기록용 ‘판’이 아니라 받침대의 장식 면을 가리키므로, 구조적 표면이라는 뜻을 살려 ‘판들’로 옮겼습니다.
- source_word: יְדֹתֶיהָ
  english_pob_choice: its supports
  chosen_korean: 그의 받침대
  alternatives_korean:
  - 그의 손들
  - 그의 옆부분들
  lexicon: HALOT
  rationale: 직역하면 ‘손들’이지만, 기구 설명에서는 돌출된 지지 부분을 가리키는 관용적 표현이어서 기능을 드러내는 ‘받침대’로 옮겼습니다.
- source_word: לֹיֹת
  english_pob_choice: wreaths
  chosen_korean: 화환
  alternatives_korean:
  - 장식띠
  - 덩굴무늬
  lexicon: HALOT
  rationale: 이 장식어는 둘러진 장식용 화환이나 festoon을 뜻하므로, 사방을 두른 장식이라는 점을 살리는 ‘화환’이 적절합니다.
theological_decisions:
- issue: 성전 기물 장식의 묘사에서 해석을 덧붙일지 여부
  chosen_reading: 본문의 장식 도상을 그대로 살려, 상징적 의미를 과도하게 해설하지 않았습니다.
  alternative_readings:
