  - 기능 설명을 덧붙이는 방식
  rationale: 이 절은 신학적 해석보다 제작 विवरण의 정확성이 핵심이므로, 과도한 해설 없이 구조 관계를 보존했습니다.
  doctrine_reference: 성경 본문의 서술 충실성
