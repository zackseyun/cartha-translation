  text: And there were four supports at the four corners of the one stand; its supports were part of the stand itself.
translation:
  language: ko
  text: 그리고 그 받침대 하나의 네 모퉁이에는 네 개의 지지대가 있었으며, 그 지지대들은 받침대와 한 몸이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּתֵפ֔וֹת
  english_pob_choice: supports
  chosen_korean: 지지대
  alternatives_korean:
  - 받침
  - 버팀대
  - 지지기둥
  lexicon: כָּתֵף / כְּתֵפֹת
  rationale: 문맥상 놋받침의 모서리를 떠받치는 구조물로 보이므로, 기능을 분명히 하는 ‘지지대’를 택했습니다.
- source_word: אֶ֚ל אַרְבַּ֣ע פִּנּ֔וֹת
  english_pob_choice: at the four corners
  chosen_korean: 네 모퉁이에는
  alternatives_korean:
  - 네 귀퉁이에
  - 네 끝에
  - 네 꼭짓점에
  lexicon: פִּנָּה
  rationale: 형태와 위치를 자연스럽게 드러내는 현대 표준어로 옮겼습니다.
- source_word: הַמְּכֹנָ֖ה הָאֶחָ֑ת
  english_pob_choice: the one stand
  chosen_korean: 그 받침대 하나
  alternatives_korean:
  - 유일한 받침대
  - 한 받침대
  - 그 하나의 받침대
  lexicon: מְכֹנָה
  rationale: 본문의 정관사적 강조를 살려 ‘하나’의 단독성을 드러내되, 한국어 어순상 ‘그 받침대 하나’가 가장 자연스럽습니다.
- source_word: מִן הַמְּכֹנָ֖ה כְּתֵפֶי/הָ
  english_pob_choice: its supports were part of the stand itself
  chosen_korean: 그 지지대들은 받침대와 한 몸이었습니다
  alternatives_korean:
  - 그 지지대들은 받침대에 붙어 있었습니다
  - 그 지지대들은 받침대의 일부였습니다
  - 그 지지대들은 받침대에서 나왔습니다
  lexicon: מִן + כְּתֵפַיִם
  rationale: 분리되지 않은 일체성을 강조하는 구조이므로, ‘한 몸이었습니다’가 본문의 결합 관계를 강하게 전달합니다.
theological_decisions:
