  terminology: מְכֹנָה는 문맥상 ‘받침대’, כְּתֵפוֹת는 ‘지지대’로 일관되게 옮길 수 있습니다. ‘한 몸’은 구조물의 재질·제작 관계를 나타내는 용어로는 부정확할 수 있으므로 사용하지 않습니다.
