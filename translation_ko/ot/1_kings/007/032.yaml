base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/032.yaml
  text: And the four wheels were underneath the panels[a], and the axles of the wheels were on the stand[b]; and the height of each wheel was a cubit and a half.
  footnotes:
  - marker: a
    text: Or 'frames' or 'borders' for 'panels' (Hebrew מִסְגְּרוֹת).
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally 'hands of the wheels'; in context this likely refers to the wheel-axles or supporting shafts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네 바퀴는 패널들[a] 아래에 있었고, 바퀴의 축들[b]은 받침대 위에 있었으며, 각 바퀴의 높이는 한 규빗 반이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִסְגְּרוֹת은 ‘틀’, ‘테두리’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘바퀴의 손들’이지만, 문맥상 바퀴를 받치는 축이나 돌출부를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּסְגְּרוֹת
  english_pob_choice: the panels
  chosen_korean: 패널들
  alternatives_korean:
  - 틀
  - 테두리
  lexicon: HALOT
  rationale: 기계·장식 구조를 설명하는 문맥에서 מִסְגְּרוֹת은 단순한 ‘프레임’보다 구조판에 가까운 의미로 읽히므로, 영어 POB의 ‘panels’를 따라 ‘패널들’로 옮겼습니다.
- source_word: וִידוֹת
  english_pob_choice: the axles
  chosen_korean: 바퀴의 축들
  alternatives_korean:
  - 손잡이들
  - 지지대들
  - 축대들
  lexicon: HALOT
  rationale: 직역하면 ‘손들’이지만, 여기서는 바퀴를 지탱하는 돌출부를 가리키므로 기능을 드러내는 ‘축들’이 문맥에 가장 가깝습니다.
- source_word: בַּמְּכוֹנָה
  english_pob_choice: on the stand
  chosen_korean: 받침대 위에
  alternatives_korean:
  - 받침대 안에
  - 받침대에
  lexicon: HALOT
  rationale: מְכוֹנָה는 이 단락 전체에서 물두멍 받침 구조를 가리키므로, 바퀴 축이 그 구조물의 표면/위치에 놓였다는 뜻을 살려 ‘받침대 위에’로 옮겼습니다.
- source_word: קוֹמַת הָאֶחָד
  english_pob_choice: the height of each wheel
  chosen_korean: 각 바퀴의 높이
  alternatives_korean:
  - 한 바퀴의 높이
  - 각각의 바퀴 높이
  lexicon: HALOT
  rationale: 분배적 표현이므로 한국어에서는 ‘각 바퀴’가 가장 자연스럽고, 측정값인 ‘높이’도 그대로 유지했습니다.
