  - 지지대들
  - 축대들
  lexicon: HALOT
  rationale: 직역하면 ‘손들’이지만, 여기서는 바퀴를 지탱하는 돌출부를 가리키므로 기능을 드러내는 ‘축들’이 문맥에 가장 가깝습니다.
- source_word: בַּמְּכוֹנָה
