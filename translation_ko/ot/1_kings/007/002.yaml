base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/002.yaml
  text: He built the House of the Forest of Lebanon[a], one hundred cubits long, fifty cubits wide, and thirty cubits high, on four rows of cedar pillars[c][b], with cedar beams on the pillars.
  footnotes:
  - marker: a
    text: Or 'with four rows of cedar pillars'; the preposition may describe either support ('on') or arrangement ('with').
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'beams' is literally 'cut pieces' of cedar; it may refer to beams, rafters, or another hewn cedar structural element.
    reason: lexical_alternative
  - marker: c
    text: Or 'one hundred cubits its length, fifty cubits its width, and thirty cubits its height'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 백향목 기둥 네 줄 위에 백향목 들보를 얹은, 길이 백 규빗, 너비 오십 규빗, 높이 삼십 규빗의 레바논 수풀 궁전[a][b][c]을 지었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백향목 기둥 네 줄과 함께’; 전치사 עַל은 지지 관계(‘위에’)나 배열 관계(‘함께’)로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘레바논 수풀 궁전’은 히브리어의 문자적 명칭을 살린 번역이며, 기능상 왕궁을 가리키는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘길이 백 규빗, 너비 오십 규빗, 높이 삼십 규빗’처럼 치수를 명사구로 직역할 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: He built
  chosen_korean: 지었습니다
  alternatives_korean:
  - 세웠습니다
  - 건축하였습니다
  lexicon: HALOT
  rationale: 완료된 서술문으로 옮겨 현대 한국어 내러티브 흐름을 살리되, 건축 행위를 분명히 드러내기 위해 ‘지었습니다’를 선택했습니다.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  english_pob_choice: the House of the Forest of Lebanon
  chosen_korean: 레바논 수풀 궁전
  alternatives_korean:
  - 레바논 숲의 집
  - 레바논 숲 궁전
  - 레바논 백향목 궁전
  lexicon: HALOT
  rationale: 히브리어의 ‘집/בית’ 구조를 직접 풀면 다소 어색하므로, 건축물 명칭으로 널리 이해되는 기능을 살려 ‘궁전’을 택했습니다. 다만 ‘יַעַר’는 문자적으로 ‘숲/수풀’이므로 ‘레바논 수풀’로 남겨 원어의 이미지도 보존했습니다.
- source_word: מֵאָה אַמָּה אָרְכּוֹ ... וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  english_pob_choice: one hundred cubits long, fifty cubits wide, and thirty cubits high
  chosen_korean: 길이 백 규빗, 너비 오십 규빗, 높이 삼십 규빗
  alternatives_korean:
  - 백 규빗 길이, 오십 규빗 너비, 삼십 규빗 높이
  - 백 규빗의 길이, 오십 규빗의 너비, 삼십 규빗의 높이
  lexicon: HALOT
  rationale: POB의 치수 표현을 따라 건축물의 규격을 간결하고 자연스럽게 제시했습니다. ‘규빗’은 원문 단위를 유지하는 표준 번역입니다.
- source_word: עַל אַרְבָּעָה טוּרֵי עַמּוּדֵי אֲרָזִים
  english_pob_choice: on four rows of cedar pillars
  chosen_korean: 백향목 기둥 네 줄 위에
  alternatives_korean:
  - 백향목 기둥 네 줄에
  - 백향목 기둥 네 열 위에
  - 백향목 기둥 네 줄로
  lexicon: HALOT
  rationale: עַל은 지지 관계를 나타낼 수 있어 ‘위에’로 옮겨 구조가 기둥 위에 놓였음을 살렸습니다. ‘טוּרֵי’는 줄/열의 배열이므로 ‘네 줄’이 가장 자연스럽습니다.
- source_word: וּכְרֻתֹת אֲרָזִים עַל הָעַמּוּדִים
  english_pob_choice: with cedar beams on the pillars
  chosen_korean: 백향목 들보를 얹은
  alternatives_korean:
  - 백향목 들보가 있는
  - 백향목으로 깎은 들보를 기둥 위에 둔
  - 기둥 위에 백향목 들보가 놓인
  lexicon: HALOT
  rationale: כְרֻתֹת은 문자적으로 ‘깎아낸/잘라낸 것들’이지만, 건축 문맥상 들보나 서까래 같은 구조재를 가리킬 가능성이 높아 ‘들보’로 번역했습니다. ‘얹은’은 영어 POB의 ‘on’과 원문의 지지 관계를 함께 반영합니다.
theological_decisions:
- issue: 건축 명칭의 기능적 번역과 원어 이미지 보존
  chosen_reading: ‘בית יער הלבנון’을 건축물 명칭으로 보되, 원문의 ‘숲/수풀’ 이미지를 유지해 ‘레바논 수풀 궁전’으로 옮겼습니다.
  alternative_readings:
  - ‘레바논 숲의 집’처럼 직역
  - ‘레바논 백향목 궁전’처럼 재해석
  rationale: 문맥상 단순한 주거가 아니라 왕실 건축물 명칭이므로 기능적으로는 ‘궁전’이 적절합니다. 동시에 원어의 이미지와 명칭의 생경함을 지워버리지 않기 위해 ‘수풀’을 남겼습니다.
  doctrine_reference: 본문의 역사-서술적 의미 보존
- issue: 구조재 표현의 의미 범위
  chosen_reading: ‘כְרֻתֹת אֲרָזִים’은 확정적 기술어가 아니라 해석 여지가 있으므로 ‘백향목 들보’로 옮기되, 구조물의 상부 지지재라는 관계를 드러냈습니다.
  alternative_readings:
  - ‘백향목으로 깎은 것들’처럼 직역
  - ‘백향목 서까래’처럼 더 구체화
  rationale: 원문이 정확히 어떤 부재인지 단정하기 어려우므로, 건축 문맥에서 가장 개연성 높은 일반 구조재 용어를 택해 과도한 구체화를 피했습니다.
  doctrine_reference: 해석 가능성의 보존
