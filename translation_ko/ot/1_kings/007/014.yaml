  text: בֶּן אִשָּׁה֩ אַלְמָנָ֨ה ה֜וּא מִ/מַּטֵּ֣ה נַפְתָּלִ֗י וְ/אָבִ֣י/ו אִישׁ צֹרִי֮ חֹרֵ֣שׁ נְחֹשֶׁת֒ וַ֠/יִּמָּלֵא אֶת הַ/חָכְמָ֤ה וְ/אֶת הַ/תְּבוּנָה֙ וְ/אֶת הַ/דַּ֔עַת לַ/עֲשׂ֥וֹת כָּל מְלָאכָ֖ה בַּ/נְּחֹ֑שֶׁת וַ/יָּבוֹא֙ אֶל הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה וַ/יַּ֖עַשׂ אֶת כָּל מְלַאכְתּֽ/וֹ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/014.yaml
  text: He was the son of a widow from the tribe of Naphtali[a], and his father was a man of Tyre, a worker in bronze. He was filled with wisdom, understanding, and knowledge to do every kind of work in bronze[b]. So he came to King Solomon and did all his work.
  footnotes:
  - marker: a
    text: Or 'a Tyrian man' for 'a man of Tyre.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew neḥoshet can denote copper or bronze; 'bronze' fits the temple-furnishings context here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 납달리 지파[a]의 한 과부의 아들이었고, 그의 아버지는 두로 사람으로 청동 세공사였습니다. 그는 청동으로 하는 모든 일[b]을 할 지혜와 분별과 지식이 충만했습니다. 그래서 그는 솔로몬 왕에게 가서 자기의 모든 일을 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘납달리의 사람’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 네후셋은 여기서 구리 또는 청동을 가리킬 수 있으나, 성전 기물 문맥에서는 ‘청동’이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה אַלְמָנָה
  english_pob_choice: the son of a widow
  chosen_korean: 한 과부의 아들
  alternatives_korean:
  - 과부의 아들
  - 한 과부의 아들이었습니다
  lexicon: HALOT
  rationale: 히브리어는 어머니의 과부 신분을 앞세워 출신 배경을 강조하므로, 한국어도 이를 직접 반영해 자연스럽고 분명하게 옮겼습니다.
- source_word: מִמַּטֵּה נַפְתָּלִי
  english_pob_choice: from the tribe of Naphtali
  chosen_korean: 납달리 지파
  alternatives_korean:
  - 납달리에서
  - 납달리의 지파
  lexicon: HALOT
  rationale: מַטֶּה는 족속/지파를 뜻하므로, 여기서는 사회적·혈연적 소속을 드러내는 ‘지파’가 가장 적절합니다.
- source_word: אִישׁ צֹרִי חֹרֵשׁ נְחֹשֶׁת
  english_pob_choice: a worker in bronze
  chosen_korean: 두로 사람으로 청동 세공사
  alternatives_korean:
  - 두로 사람인 청동 일꾼
  - 두로 출신의 청동 장인
  lexicon: HALOT
  rationale: צֹרִי는 ‘두로 사람’의 출신 표지이고, חֹרֵשׁ는 단순 노동자보다 숙련된 기술자를 가리키므로 ‘세공사’로 옮겨 기술적 의미를 살렸습니다.
- source_word: וַיִּמָּלֵא אֶת הַחָכְמָה וְאֶת הַתְּבוּנָה וְאֶת הַדַּעַת
  english_pob_choice: He was filled with wisdom, understanding, and knowledge
  chosen_korean: 지혜와 분별과 지식이 충만했습니다
  alternatives_korean:
  - 지혜와 이해와 지식이 충만했습니다
  - 지혜, 이해, 지식으로 가득 찼습니다
  lexicon: HALOT
  rationale: 세 개의 명사는 공예 기술을 위한 자질의 삼중구조이므로, 문맥상 ‘분별’은 단순 지식보다 판단 능력을 더 잘 드러냅니다.
- source_word: לַעֲשׂוֹת כָּל מְלָאכָה בַּנְּחֹשֶׁת
  english_pob_choice: to do every kind of work in bronze
  chosen_korean: 청동으로 하는 모든 일
  alternatives_korean:
  - 청동으로 모든 종류의 일을 하는
  - 청동 작업의 온갖 일을 하는
  lexicon: HALOT
  rationale: מְלָאכָה는 폭넓은 숙련 작업을 뜻하므로, ‘모든 일’로 넓게 살리되 재료를 분명히 밝혀 문맥을 자연스럽게 했습니다.
theological_decisions:
- issue: 공예 기술의 충만이 하나님의 부여로 이해되는지
  chosen_reading: 본문은 직접적으로 하나님을 언급하지 않지만, ‘충만했습니다’는 수동적 결과 상태를 살려 기술적 자질이 내적으로 갖추어진 상태를 나타냅니다.
  alternative_readings:
  - 그가 스스로 익힌 기술로 가득 찼습니다
  - 그가 천부적 재능을 갖추었습니다
  rationale: 히브리어 니팔/수동형 뉘앙스를 과장하지 않으면서도, 능력이 단순한 자력 성취가 아님을 보여 줍니다.
  doctrine_reference: 문맥 주해
- issue: ‘청동’의 재료 의미
  chosen_reading: 네후셋은 여기서 성전 기물 제작 문맥에 따라 ‘청동’으로 옮겼습니다.
  alternative_readings:
  - 구리
  - 금속
  rationale: 영어 POB도 temple-furnishings context를 근거로 bronze를 택했으므로, 재료의 통상적·문맥적 의미를 그대로 따랐습니다.
  doctrine_reference: 문맥 주해
