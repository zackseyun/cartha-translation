  yaml_path: translation/ot/1_kings/007/001.yaml
  text: Solomon built his own house for thirteen years[a], and he finished all his house.
  footnotes:
  - marker: a
    text: Or 'his palace.' The Hebrew 'house' can refer to a royal residence or palace complex in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 자기 궁궐을 십삼 년 동안 지었고, 자기 궁궐 전체를 마쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘궁궐’은 히브리어 ‘집’(בַּיִת)의 문맥상 의미를 풀어 옮긴 것입니다. 왕의 거처 또는 왕궁 복합체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  english_pob_choice: his own house
  chosen_korean: 자기 궁궐
  alternatives_korean:
  - 자기 집
  - 자기 왕궁
  - 자기 궁
  lexicon: HALOT
  rationale: 왕의 거처를 가리키는 문맥이므로 일반적인 ‘집’보다 ‘궁궐’이 한국어 독자에게 의미를 더 분명하게 전달합니다. POB의 ‘his own house’에 반영된 소유·대조 의미는 ‘자기’로 살렸습니다.
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  english_pob_choice: for thirteen years
  chosen_korean: 십삼 년 동안
  alternatives_korean:
  - 열세 해 동안
  - 십삼 년간
  lexicon: HALOT
  rationale: 지속 기간을 자연스러운 현대 한국어로 옮기기 위해 ‘동안’을 넣었습니다. 본문의 공사 기간이라는 시간 길이를 그대로 드러냅니다.
- source_word: וַיְכַל
  english_pob_choice: he finished
  chosen_korean: 마쳤습니다
  alternatives_korean:
  - 끝냈습니다
  - 완성했습니다
  lexicon: HALOT
  rationale: 서술의 종결과 공사 완료를 간결하게 드러내는 동사로 ‘마치다’를 선택했습니다. ‘완성했습니다’도 가능하지만, 원문의 단순한 완료 감각에는 ‘마쳤습니다’가 더 직접적입니다.
- source_word: כָּל בֵּיתוֹ
  english_pob_choice: all his house
  chosen_korean: 자기 궁궐 전체
  alternatives_korean:
  - 자기 집 전체
  - 그의 왕궁 전체
  - 자기 궁궐 모든 부분
  lexicon: HALOT
  rationale: כָּל은 전체성을 강조하므로 ‘전체’로 옮겼습니다. 여기서 ‘house’는 사람들보다 건물·궁정 복합체를 가리키므로, 한국어에서는 의미를 분명히 하는 ‘궁궐 전체’가 적절합니다.
theological_decisions:
- issue: 왕실 거처를 가리키는 בַּיִת의 번역
  chosen_reading: 이 구절에서는 솔로몬의 개인 주거이면서 왕실 거처를 뜻하므로 ‘궁궐’로 번역했습니다.
  alternative_readings:
  - ‘집’으로 옮겨 원어의 직역감을 살리는 방법
  - ‘왕궁’으로 더 명시적으로 옮기는 방법
  rationale: 문맥상 성전 건축과 대비되는 왕의 거처이며, 한국어 ‘집’은 현대 독자에게 너무 평범하게 들릴 수 있습니다. ‘궁궐’은 왕실 거처라는 기능을 자연스럽게 전달합니다.
  doctrine_reference: 역사서 문맥의 의미 정확성
