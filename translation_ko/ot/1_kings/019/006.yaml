source:
  edition: WLC
  text: וַ/יַּבֵּ֕ט וְ/הִנֵּ֧ה מְרַאֲשֹׁתָ֛י/ו עֻגַ֥ת רְצָפִ֖ים וְ/צַפַּ֣חַת מָ֑יִם וַ/יֹּ֣אכַל וַ/יֵּ֔שְׁתְּ וַ/יָּ֖שָׁב וַ/יִּשְׁכָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/006.yaml
  text: He looked[a], and behold, at his head was a cake baked on hot stones and a jar of water. He ate and drank and lay down again.
  footnotes:
  - marker: a
    text: Or 'a cake on coals.' The Hebrew רְצָפִים may refer to heated stones used for baking, though some translations render it more generally as 'coals.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 바라보니, 그의 머리맡에 달군 돌 위에 구운 빵[a]과 물 한 병이 있었습니다. 그는 먹고 마시고 다시 누웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숯불에 구운 빵’. 히브리어 רְצָפִים은 빵을 굽는 데 쓰인 달군 돌을 가리킬 수 있으나, 더 일반적으로 ‘숯불’을 뜻하는 것으로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט / וְהִנֵּה
  english_pob_choice: He looked, and behold
  chosen_korean: 그가 바라보니, 보라
  alternatives_korean:
  - 그가 보니, 보라
  - 그가 바라보니, 보니
  lexicon: HALOT
  rationale: וַיַּבֵּט의 시선 동작을 ‘바라보니’로 자연스럽게 살리고, וְהִנֵּה의 주목 표지를 ‘보라’로 옮겨 장면의 갑작스러운 발견감을 살렸습니다.
- source_word: מְרַאֲשֹׁתָיו
  english_pob_choice: at his head
  chosen_korean: 그의 머리맡에
  alternatives_korean:
  - 그의 머리 옆에
  - 그의 머리 곁에
  lexicon: HALOT
  rationale: 이 표현은 ‘머리 가까이/머리맡’을 가리키므로, 한국어로는 자연스럽고 구체적인 ‘머리맡에’가 적절합니다.
- source_word: עֻגַת רְצָפִים
  english_pob_choice: a cake baked on hot stones
  chosen_korean: 뜨거운 돌 위에 구운 빵
  alternatives_korean:
  - 뜨거운 돌에 구운 빵
  - 숯불에 구운 빵
  lexicon: HALOT
  rationale: עֻגָה는 문맥상 달콤한 케이크가 아니라 빵 덩어리에 가까우므로 ‘빵’으로 옮기고, רְצָפִים의 조리 방식은 영어 POB의 해석을 따라 ‘뜨거운 돌 위에 구운’으로 반영했습니다.
- source_word: צַפַּחַת מָיִם
  english_pob_choice: a jar of water
  chosen_korean: 물 한 병
  alternatives_korean:
  - 물 한 항아리
  - 물 한 단지
  lexicon: HALOT
  rationale: צַפַּחַת는 항아리·단지·병류의 그릇을 가리킬 수 있으나, 현대 한국어에서는 서술이 간결하게 전달되는 ‘물 한 병’이 장면의 실용적 의미를 잘 드러냅니다.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ וַיָּשָׁב וַיִּשְׁכָּב
  english_pob_choice: He ate and drank and lay down again
  chosen_korean: 그는 먹고 마시고 다시 누웠습니다
  alternatives_korean:
  - 그는 먹고 마시고 다시 드러누웠습니다
  - 그는 먹고 마시고 다시 누워 있었습니다
  lexicon: HALOT
  rationale: 연속 동작을 단순하고 자연스럽게 살리기 위해 ‘먹고 마시고 다시 누웠습니다’로 옮겼습니다. שׁוּב + שׁכב의 관용적 의미는 별도의 ‘돌아가서’보다 ‘다시 누웠습니다’가 더 정확합니다.
theological_decisions:
- issue: 장면의 묵시적 돌봄과 공급
  chosen_reading: 본문이 직접 말하지는 않지만, 천사의 공급으로 엘리야가 먹고 마신 뒤 다시 눕는 장면의 단순성을 그대로 유지했습니다.
  alternative_readings:
  - 하나님의 초자연적 돌보심을 더 해설적으로 드러내는 번역
  - 돌봄의 의미를 덧붙이는 설명적 번역
  rationale: 히브리어 본문은 사건 자체를 간결하게 제시하므로, 해설을 덧붙이기보다 독자가 장면의 의미를 스스로 읽도록 두는 편이 원문에 가깝습니다.
  doctrine_reference: 열왕기상 19장의 문맥적 서술
- issue: 반복 동작의 표현
  chosen_reading: ‘다시 누웠습니다’로 שׁוּב의 반복성을 드러냈습니다.
  alternative_readings:
  - ‘돌아가서 누웠습니다’
  - ‘그리고 눕기를 반복했습니다’
  rationale: 본문의 핵심은 장소 이동이 아니라 이전 동작으로의 복귀이므로, 반복성을 간결하게 살리는 표현이 적절합니다.
  doctrine_reference: 히브리어 서술동사 관용법
