  text: וְ/הֽוּא הָלַ֤ךְ בַּ/מִּדְבָּר֙ דֶּ֣רֶךְ י֔וֹם וַ/יָּבֹ֕א וַ/יֵּ֕שֶׁב תַּ֖חַת רֹ֣תֶם אחת וַ/יִּשְׁאַ֤ל אֶת נַפְשׁ/וֹ֙ לָ/מ֔וּת וַ/יֹּ֣אמֶר רַ֗ב עַתָּ֤ה יְהוָה֙ קַ֣ח נַפְשִׁ֔/י כִּֽי לֹא ט֥וֹב אָנֹכִ֖י מֵ/אֲבֹתָֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/004.yaml
  text: But he himself went a day's journey into the wilderness[a], and came and sat down under a broom tree. And he asked that he might die, and said, “It is enough; now, Yahweh, take my life[b], for I am no better than my fathers.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Yahweh.'' The divine name יְהוָה is rendered ''LORD'' in keeping with the project''s default practice.'
    reason: alternative_reading
  - marker: b
    text: Or 'a broom bush.' The Hebrew רֹתֶם refers to a desert shrub often rendered 'broom tree.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 광야로 하루길을 걸어 들어가 한 로뎀나무 아래에 앉았습니다. 그리고 죽기를 구하며 말했습니다. “이제는 충분합니다. 야훼, 제 생명을 거두어 주십시오. 저는 제 조상들보다 나은 사람이 아닙니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רֹתֶם은 광야에서 자라는 관목으로, 전통적으로 'broom tree' 또는 'broom bush'로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נֶפֶשׁ는 여기서 '생명' 또는 '목숨'의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר
  english_pob_choice: into the wilderness
  chosen_korean: 광야로
  alternatives_korean:
  - 광야 안으로
  - 광야로 들어가
  lexicon: HALOT
  rationale: מִדְבָּר는 여기서 사람이 드나드는 황야 지대를 가리키며, 이동을 나타내는 הָלַךְ와 함께 '광야로'가 자연스럽고 본문 흐름을 잘 살립니다.
- source_word: דֶּרֶךְ יוֹם
  english_pob_choice: a day's journey
  chosen_korean: 하루길
  alternatives_korean:
  - 하루 여정
  - 하루 길
  lexicon: HALOT
  rationale: 이 관용구는 단순한 시간보다 하루에 갈 수 있는 거리의 의미가 강하므로, 간결한 현대어 표현인 '하루길'로 옮겼습니다.
- source_word: רֹתֶם
  english_pob_choice: broom tree
  chosen_korean: 로뎀나무
  alternatives_korean:
  - 광야 관목
  - 빗자루나무
  lexicon: HALOT
  rationale: רֹתֶם은 광야 관목을 가리키며, 한국어 성경 문맥에서는 '로뎀나무'가 비교적 익숙한 대응어이므로 이를 채택했습니다.
- source_word: וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת
  english_pob_choice: he asked that he might die
  chosen_korean: 죽기를 구하며
  alternatives_korean:
  - 자기 생명이 죽기를 구하며
  - 죽게 해 달라고 청하며
  lexicon: HALOT
  rationale: 직역하면 '자기 영혼/생명에 대해 죽음을 구하다'이지만, 문맥상 엘리야가 죽음을 요청하는 뜻이므로 한국어에서는 자연스럽게 '죽기를 구하며'로 풀었습니다.
- source_word: קַח נַפְשִׁי
  english_pob_choice: take my life
  chosen_korean: 제 생명을 거두어 주십시오
  alternatives_korean:
  - 제 목숨을 거두어 주십시오
  - 제 생명을 가져가 주십시오
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 '생명/목숨'의 뜻이 적절하고, 하나님께 드리는 직접 간구이므로 합쇼체의 공손한 청유로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대신 신명기 본래 이름의 음역인 '야훼'를 유지했습니다.
- source_word: כִּי לֹא טוֹב אָנֹכִי מֵאֲבֹתָי
  english_pob_choice: for I am no better than my fathers
  chosen_korean: 저는 제 조상들보다 나은 사람이 아닙니다
  alternatives_korean:
  - 저는 제 조상들보다 더 낫지 않습니다
  - 저는 제 조상들만 못합니다
  lexicon: HALOT
  rationale: טוֹב + 비교는 '더 낫다'의 의미이므로, 자기 평가의 뉘앙스를 살려 '나은 사람이 아닙니다'로 옮겼습니다.
theological_decisions:
- issue: 신명기 이름 יְהוָה의 한국어 처리
  chosen_reading: 본문에는 '야훼'를 사용해 인격적 호칭을 보존했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트의 기본 원칙상 יְהוָה는 하나님의 고유명으로 번역/음역해야 하므로, 일반적 대체 표기인 '주님'보다 '야훼'가 원문 의도를 더 직접적으로 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
