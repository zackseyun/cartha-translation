  rationale: 프로젝트의 기본 원칙상 יְהוָה는 하나님의 고유명으로 번역/음역해야 하므로, 일반적 대체 표기인 '주님'보다 '야훼'가 원문 의도를 더 직접적으로 드러냅니다.
