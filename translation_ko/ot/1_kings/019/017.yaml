source:
  edition: WLC
  text: וְ/הָיָ֗ה הַ/נִּמְלָ֛ט מֵ/חֶ֥רֶב חֲזָאֵ֖ל יָמִ֣ית יֵה֑וּא וְ/הַ/נִּמְלָ֛ט מֵ/חֶ֥רֶב יֵה֖וּא יָמִ֥ית אֱלִישָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/017.yaml
  text: And it shall be that whoever escapes from the sword of Hazael[a], Jehu shall put to death; and whoever escapes from the sword of Jehu, Elisha shall put to death.
  footnotes:
  - marker: a
    text: Or, 'Elisha shall kill.' The Hebrew verb is causative ('put to death'). In context, Elisha's role may be understood directly or through the judgment effected by his prophetic ministry.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하면 하사엘의 칼을 피한 사람은 예후가 죽일 것이며, 예후의 칼을 피한 사람은 엘리사가 죽일 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘엘리사가 죽게 할 것이다’입니다. 히브리어 동사는 사역형(‘죽게 하다’)이며, 문맥에서는 엘리사의 예언적 사역을 통하여 이루어지는 심판으로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it shall be
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하면
  - 그리고 나서
  - 그 일이 있으리니
  lexicon: HALOT
  rationale: 예언적·서술적 미래를 한국어에서 자연스럽게 연결하는 표지로 옮겼습니다. 문맥상 새 선언의 결과를 이어 주므로, 단순 직역보다 예고의 기능을 살리는 ‘그러므로’를 택했습니다.
- source_word: הַנִּמְלָט
  english_pob_choice: whoever escapes
  chosen_korean: 도망한 사람은
  alternatives_korean:
  - 달아난 사람은
  - 피한 사람은
  - 도망하는 자는
  lexicon: HALOT
  rationale: 관사 붙은 분사로서 일반적·포괄적 대상을 가리키므로, 현대 한국어에서 자연스러운 ‘도망한 사람은’으로 풀었습니다. ‘자’보다 문장이 읽기 쉽고, 대상의 일반성을 유지합니다.
- source_word: יָמִית
  english_pob_choice: shall put to death
  chosen_korean: 죽일 것입니다
  alternatives_korean:
  - 사형에 처할 것입니다
  - 죽게 할 것입니다
  - 죽일 것입니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리되, 본문의 직설적 병행 구조를 보존하기 위해 ‘죽일 것입니다’로 옮겼습니다. 영어 POB가 ‘put to death’를 택한 것처럼, 단순한 ‘죽이다’보다 행위성을 분명히 합니다.
- source_word: חֲזָאֵל / יֵהוּא / אֱלִישָׁע
  english_pob_choice: Hazael / Jehu / Elisha
  chosen_korean: 하사엘 / 예후 / 엘리사
  alternatives_korean:
  - 하사엘 / 예후 / 엘리사
  - 하사엘 / 예후 / 엘리사
  lexicon: HALOT
  rationale: 고유명사는 프로젝트 표기 원칙에 따라 음역했습니다. 표준 한국어 성경에서 널리 통용되는 형태를 우선했습니다.
theological_decisions:
- issue: 엘리사의 ‘죽일 것’ 표현의 직접성
  chosen_reading: 본문의 병렬 구조를 따라 엘리사도 직접적 행위 주어로 옮겼습니다.
  alternative_readings:
  - 엘리사의 예언적 사역이 초래하는 심판으로 완곡하게 옮김
  - 엘리사가 직접 죽인다는 뜻을 약화해 ‘심판이 임할 것’으로 옮김
  rationale: 히브리어는 하사엘, 예후, 엘리사를 동일한 사역 동사로 병렬합니다. 본문의 긴장을 완화하지 않고 유지하는 것이 원문 충실도에 더 부합하므로, 해석적 완곡화는 본문이 아니라 주석적 이해로 남겼습니다.
  doctrine_reference: 원문이 드러내는 신적 심판의 도구성과 서술적 긴장을 보존
