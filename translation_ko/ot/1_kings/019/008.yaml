  text: וַ/יָּ֖קָם וַ/יֹּ֣אכַל וַ/יִּשְׁתֶּ֑ה וַ/יֵּ֜לֶךְ בְּ/כֹ֣חַ הָ/אֲכִילָ֣ה הַ/הִ֗יא אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה עַ֛ד הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/008.yaml
  text: So he arose and ate and drank[a], and went in the strength of that food forty days and forty nights to Horeb, the mountain of God.
  footnotes:
  - marker: a
    text: Or 'on the strength of that meal.' The Hebrew expression refers to the nourishment he received from what he had eaten.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 일어나 먹고 마셨으며[a], 그 음식의 힘으로 사십 일 사십 야간을 걸어 하나님의 산 호렙에 이르렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 식사의 힘으로’. 히브리어 표현은 그가 먹은 것이 제공한 양식을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: So he arose
  chosen_korean: 그는 일어나
  alternatives_korean:
  - 그는 일어났습니다
  - 그래서 그는 일어났습니다
  lexicon: HALOT
  rationale: 서술 진행을 살리되, 현대 한국어에서 자연스러운 동사구로 옮겼습니다.
- source_word: בְּכֹחַ הָאֲכִילָה הַהִיא
  english_pob_choice: in the strength of that food
  chosen_korean: 그 음식의 힘으로
  alternatives_korean:
  - 그 음식으로 얻은 힘으로
  - 그 식사의 힘으로
  lexicon: HALOT
  rationale: 히브리어의 ‘힘’(כֹּחַ)과 전치사 ב의 결합을 살리면서, 그가 먹은 것이 제공한 지속력을 자연스럽게 드러냈습니다.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  english_pob_choice: forty days and forty nights
  chosen_korean: 사십 일 사십 야간
  alternatives_korean:
  - 사십 일 밤낮
  - 사십 일과 사십 밤
  lexicon: HALOT
  rationale: 시간 표현을 직역에 가깝게 유지했습니다. ‘야간’은 본문의 병렬 구조를 보존하며, ‘밤낮’보다 원문의 대응감을 더 잘 드러냅니다.
- source_word: הַר הָאֱלֹהִים חֹרֵב
  english_pob_choice: the mountain of God, Horeb
  chosen_korean: 하나님의 산 호렙
  alternatives_korean:
  - 하나님의 산, 호렙
  - 하나님의 산 호렙
  lexicon: HALOT
  rationale: ‘산’에 대한 소유/연결 관계를 그대로 살리고, 지명 ‘호렙’은 익숙한 음역으로 옮겼습니다.
theological_decisions:
- issue: הָאֱלֹהִים의 번역
  chosen_reading: ‘하나님’으로 번역하여 ‘하나님의 산’으로 유지했습니다.
  alternative_readings:
  - ‘하나님의 산’ 대신 ‘신의 산’
  - ‘거룩한 산’처럼 의미화
  rationale: 이 표현은 고유 지명적 관용구이지만, 본문이 시내/호렙과 야훼의 계시 배경을 가리키므로 개인적 신격을 분명히 하는 ‘하나님’이 가장 적절합니다.
  doctrine_reference: 성경의 지명 관용구와 야훼 계시 전승
