  to: 그는 소를 두고 엘리야를 따라 달려가서 말했습니다. “부디 제 아버지와 어머니에게 입맞추게[a] 해 주십시오. 그런 다음 제가 당신을 따라가겠습니다.” 그러자 그가 그에게 말했습니다. “돌아가십시오. 내가 당신에게 무엇을 했습니까?”[b]
