  source_fidelity: 히브리어의 순서(소를 두고, 엘리야 뒤를 달려가고, 말함), ‘입맞추다’의 구체적 행위, 그리고 엘리야의 난해한 질문을 대체로 잘 보존했습니다. 다만 ‘달려가며 말했습니다’는 두 동작을 동시적으로 들리게 하므로, 완료 뒤 발화의 순서를 더 분명히 하는 편이 좋습니다. 각주 b는 본문의 대안을 실질적으로 제시하지 못하고 본문을 반복하므로 보완해야 합니다.
  naturalness: 현대 표준어로 자연스럽게 하려면 ‘달려가서 말했습니다’가 더 적절합니다. 또한 목표 문체가 합쇼체인데 엘리야의 직접화법만 ‘돌아가라 / 했느냐’라는 해라체이므로, 직접화법도 합쇼체로 통일하는 것이 필요합니다.
  terminology: ‘소’, ‘엘리야’, ‘엘리사’, ‘입맞추다’는 적절합니다. ‘제 아버지와 어머니’는 원문의 개별 명시를 보존합니다.
