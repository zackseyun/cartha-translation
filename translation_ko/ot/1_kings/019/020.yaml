  text: וַ/יַּעֲזֹ֣ב אֶת הַ/בָּקָ֗ר וַ/יָּ֨רָץ֙ אַחֲרֵ֣י אֵֽלִיָּ֔הוּ וַ/יֹּ֗אמֶר אֶשְּׁקָה נָּא֙ לְ/אָבִ֣/י וּ/לְ/אִמִּ֔/י וְ/אֵלְכָ֖ה אַחֲרֶ֑י/ךָ וַ/יֹּ֤אמֶר ל/וֹ֙ לֵ֣ךְ שׁ֔וּב כִּ֥י מֶה עָשִׂ֖יתִי לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/020.yaml
  text: So he left the oxen and ran after Elijah and said[a], “Please let me kiss my father and my mother, and then I will go after you.” And he said to him, “Go back[b], for what have I done to you?”
  footnotes:
  - marker: a
    text: Or, more generally, “Please let me bid farewell to my father and my mother.” The Hebrew verb is literally “kiss.”
    reason: lexical_alternative
  - marker: b
    text: Elijah’s reply is difficult and may mean, “Go back, for what have I done for you?” or function as an elliptical way of leaving the decision with Elisha.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 소를 두고 엘리야를 따라 달려가며 말했습니다. “부디 제 아버지와 어머니에게 입맞추게 해 주십시오. 그런 다음 제가 당신을 따라가겠습니다.” 그러자 그가 그에게 말했습니다. “돌아가라. 내가 네게 무엇을 했느냐?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보다 일반적으로는 “부디 제 아버지와 어머니께 작별 인사를 하게 해 주십시오”로 옮길 수도 있습니다. 히브리어 동사의 문자적 뜻은 “입맞추다”입니다.
    reason: lexical_alternative
  - marker: b
    text: 엘리야의 대답은 난해하며, “돌아가라, 내가 네게 무엇을 했느냐?” 또는 결정을 엘리사에게 맡기는 생략된 표현일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲזֹב אֶת הַבָּקָר
  english_pob_choice: he left the oxen
  chosen_korean: 소를 두고
  alternatives_korean:
  - 소를 떠나
  - 소를 버리고
  lexicon: HALOT
  rationale: בקר의 구체적 맥락이 쟁기질에 쓰인 짐승들이므로 ‘소’로 옮기고, עזב은 완전한 포기보다 단순한 이탈이므로 ‘두고’가 자연스럽습니다.
- source_word: וַיָּרָץ אַחֲרֵי אֵלִיָּהוּ
  english_pob_choice: ran after Elijah
  chosen_korean: 엘리야를 따라 달려가며
  alternatives_korean:
  - 엘리야 뒤를 따라 달려가며
  - 엘리야를 뒤쫓아 달려가며
  lexicon: HALOT
  rationale: אַחֲרֵי의 방향성을 살리되 한국어에서 가장 자연스러운 동작 묘사로 ‘따라 달려가며’를 택했습니다.
- source_word: אֶשְּׁקָה נָּא
  english_pob_choice: Please let me kiss
  chosen_korean: 부디 … 입맞추게 해 주십시오
  alternatives_korean:
  - 부디 … 작별 인사를 하게 해 주십시오
  - 부디 … 입맞추게 하소서
  lexicon: HALOT
  rationale: 동사의 핵심 의미인 ‘입맞추다’를 본문에 유지하되, 문맥상 작별 의례의 뜻도 가능하므로 공손한 요청형으로 살렸습니다.
- source_word: לְאָבִי וּלְאִמִּי
  english_pob_choice: my father and my mother
  chosen_korean: 제 아버지와 어머니에게
  alternatives_korean:
  - 제 부모님에게
  - 아버지와 어머니에게
  lexicon: HALOT
  rationale: 히브리어가 두 부모를 각각 명시하므로 ‘부모님’으로 압축하지 않고 그대로 옮겼습니다.
- source_word: לֵךְ שׁוּב
  english_pob_choice: Go back
  chosen_korean: 돌아가라
  alternatives_korean:
  - 가서 돌아가라
  - 돌아가
  lexicon: HALOT
  rationale: 두 명령형의 긴박하고 단호한 어조를 살리되, 한국어에서는 ‘돌아가라’가 가장 간결하고 자연스럽습니다.
- source_word: כִּי מֶה עָשִׂיתִי לָךְ
  english_pob_choice: for what have I done to you?
  chosen_korean: 내가 네게 무엇을 했느냐?
  alternatives_korean:
  - 내가 너에게 무엇을 했느냐?
  - 내가 네게 무엇을 해 주었느냐?
  lexicon: HALOT
  rationale: 이 구절의 애매함을 본문에서 해소하지 않고, 직역에 가까운 질문형을 유지했습니다.
theological_decisions:
- issue: 엘리야의 응답인 כִּי מֶה עָשִׂיתִי לָךְ의 의미
  chosen_reading: 본문은 해석을 단정하지 않고, 엘리야가 엘리사에게 결정을 맡기는 듯한 여운을 남기는 질문으로 유지했습니다.
  alternative_readings:
  - ‘내가 네게 무엇을 했느냐?’라는 단순 질문
  - ‘내가 네게 무엇을 해 주었느냐?’라는 은근한 허락
  - ‘내가 네게 무엇을 했기에 돌아서려 하느냐?’라는 책망
  rationale: 히브리어가 실제로 허락, 책망, 또는 결정을 넘기는 말로 읽힐 수 있으므로, 번역본도 그 긴장을 보존하는 편이 소스 충실성에 맞습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
