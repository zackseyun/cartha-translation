- from: 야훼께서 그에게 말씀하셨습니다. “가서 네 길로 돌아가 다마스쿠스 광야로 가라. 그리고 네가 도착하면, 너는 하사엘에게 기름을 부어 아람의 왕이 되게 하라.”[a]
