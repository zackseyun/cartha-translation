  rationale: 합쇼체 명령형으로 통일하고, 두 히브리어 명령(‘가라, 돌아가라’)과 경로 표현을 한국어 어순에 맞게 유지했습니다. ‘기름을 부어 아람의 왕으로 세우십시오’는 하사엘을 왕으로 기름 부으라는 임명 공식을 명확히 나타내며, 원문에 없는 교리적 해석을 더하지 않습니다. 각주 표지는 방향 어미가 반영된 목적지 표현 바로 뒤로 옮겼습니다.
