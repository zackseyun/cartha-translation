source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלָ֔י/ו לֵ֛ךְ שׁ֥וּב לְ/דַרְכְּ/ךָ֖ מִדְבַּ֣רָ/ה דַמָּ֑שֶׂק וּ/בָ֗אתָ וּ/מָשַׁחְתָּ֧ אֶת חֲזָאֵ֛ל לְ/מֶ֖לֶךְ עַל אֲרָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/015.yaml
  text: And Yahweh said to him[a], “Go, return by your way to the wilderness of Damascus; and when you arrive[b], you shall anoint Hazael as king over Aram.”
  footnotes:
  - marker: a
    text: Or 'toward the wilderness of Damascus.' The Hebrew form of 'wilderness' includes a directional ending.
    reason: lexical_alternative
  - marker: b
    text: Aram is the Hebrew name often rendered 'Syria.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그에게 말씀하셨습니다. “가서 네 길을 따라 다마스쿠스 광야로[a] 돌아가십시오. 그곳에 이르면 하사엘에게 기름을 부어 아람의 왕으로 세우십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘광야’는 히브리어 형태상 방향을 나타내는 어미를 포함하므로, ‘다마스쿠스 광야로’로 옮길 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 여호와 이름(테트라그람마톤)을 칭호로 바꾸지 않고 고유명사로 살리기 위해 '야훼'를 사용했습니다.
- source_word: לֵךְ שׁוּב לְדַרְכְּךָ
  english_pob_choice: Go, return by your way
  chosen_korean: 가서 네 길로 돌아가
  alternatives_korean:
  - 가서 돌아가
  - 네 길로 돌아가
  lexicon: HALOT
  rationale: 두 명령형의 연속을 살리면서 한국어에서는 '네 길로'가 'by your way'의 관용적 의미를 자연스럽게 드러냅니다.
- source_word: מִדְבָּרָה דַמָּשֶׂק
  english_pob_choice: to the wilderness of Damascus
  chosen_korean: 다마스쿠스 광야로
  alternatives_korean:
  - 다마스쿠스의 광야로
  - 다마스쿠스 광야 쪽으로
  lexicon: HALOT
  rationale: 지명과 결합된 '광야'를 자연스럽게 옮기되, 히브리어의 목적지 방향을 한국어 조사 '-로'로 반영했습니다.
- source_word: וּבָאתָ
  english_pob_choice: when you arrive
  chosen_korean: 네가 도착하면
  alternatives_korean:
  - 네가 오면
  - 그리고 네가 오면
  lexicon: HALOT
  rationale: 문맥상 다음 행동을 여는 도착 시점을 나타내므로, 직역보다 순차 관계가 분명한 '도착하면'을 택했습니다.
- source_word: וּמָשַׁחְתָּ אֶת חֲזָאֵל
  english_pob_choice: you shall anoint Hazael
  chosen_korean: 하사엘에게 기름을 부어
  alternatives_korean:
  - 하사엘에게 기름을 부으라
  - 하사엘을 기름 부어
  lexicon: HALOT
  rationale: 히브리어 '기름을 붓다'를 살리되, 한국어에서는 대상 표지가 분명한 여격 표현이 자연스럽습니다.
- source_word: לְמֶלֶךְ עַל אֲרָם
  english_pob_choice: as king over Aram
  chosen_korean: 아람의 왕이 되게 하라
  alternatives_korean:
  - 아람 왕으로 삼아라
  - 아람 위에 왕으로
  lexicon: HALOT
  rationale: 임명 공식의 결과를 한국어 동사구로 풀어, '왕이 되게 하라'가 명령의 기능을 분명히 전달합니다.
theological_decisions:
- issue: יהוה를 한국어에서 어떻게 드러낼지
  chosen_reading: 본문에는 ‘야훼’로 표기해 하나님의 고유한 이름을 직접 보이게 했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 단순한 칭호가 아니라 야훼의 직접 발화이므로, 이름을 가리는 전통적 대체어보다 원문 고유명을 유지하는 것이 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
