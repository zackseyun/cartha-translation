base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/019.yaml
  text: So he went from there and found Elisha son of Shaphat[a], and he was plowing with twelve yoke-pairs before him, and he was with the twelfth[b]. Elijah passed by him and threw his cloak over him.
  footnotes:
  - marker: a
    text: Or 'twelve yokes of oxen'; the Hebrew refers to twelve paired teams for plowing.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional: ''and threw his mantle over him.'' The garment signifies Elijah''s prophetic office in the surrounding context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그곳을 떠나 스밧의 아들 엘리사를 찾아냈습니다. 엘리사는 자기 앞에 열두 겨리[a]를 두고 밭을 갈고 있었으며, 자신은 열두 번째 겨리[b] 곁에 있었습니다. 엘리야가 그에게 다가가서 자기 겉옷을 그에게 던졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘겨리’는 멍에를 메고 함께 일하는 짐승 한 쌍을 뜻합니다. 문맥상 소일 가능성이 높지만, 히브리어 본문은 짐승의 종류를 명시하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘열두 번째 것에/와 함께’입니다. ‘겨리’가 생략되어 있으며, 엘리사가 열두 번째 겨리와 함께 있었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  english_pob_choice: So he went from there
  chosen_korean: 그는 거기서 떠나
  alternatives_korean:
  - 그는 거기서 갔습니다
  - 그는 거기서 나아갔습니다
  lexicon: HALOT
  rationale: 이야기 진행을 자연스럽게 잇되 מִשָּׁם의 장소 이동을 간결하게 살렸습니다.
- source_word: שְׁנֵים עָשָׂ֤ר צְמָדִים
  english_pob_choice: twelve yoke-pairs
  chosen_korean: 열두 쌍의 겨리소
  alternatives_korean:
  - 열두 겨리
  - 열두 쌍의 소
  lexicon: HALOT
  rationale: צֶמֶד의 ‘쌍’과 농경 맥락의 짐승을 함께 드러내기 위해 ‘겨리소’로 옮겼습니다. 영어 본문의 ‘yoke-pairs’에 대응하면서도 한국어에서 이해 가능하도록 했습니다.
- source_word: וְהוּא בִּשְׁנֵים הֶעָשָׂ֑ר
  english_pob_choice: and he was with the twelfth
  chosen_korean: 그는 열두째 곁에 있었습니다
  alternatives_korean:
  - 그는 열두째와 함께 있었습니다
  - 그는 열두째에 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 생략된 구문을 과도하게 풀지 않고, 엘리사가 열두 번째 겨리와 연결되어 있음을 한국어로 자연스럽게 드러냈습니다.
- source_word: אַדַּרְתּוֹ
  english_pob_choice: his cloak
  chosen_korean: 자기 겉옷
  alternatives_korean:
  - 자기 망토
  - 자기 외투
  - 자기 겉옷
  lexicon: HALOT
  rationale: 전통적 ‘망토’보다 현대 한국어에서 바로 이해되는 ‘겉옷’을 택하되, 엘리야의 표지 되는 외투라는 물리적 이미지를 유지했습니다.
theological_decisions:
- issue: 엘리야의 겉옷을 던지는 행위의 의미
  chosen_reading: 본문은 상징적 행위를 직접 서술할 뿐이므로, 본문 안에서는 ‘자기 겉옷을 그에게 던졌습니다’로 평서적으로 옮겼습니다.
  alternative_readings:
  - 제자를 임명하셨습니다처럼 의미를 풀어 쓰기
  - ‘망토’를 써서 예언자직 계승 상징을 더 강하게 드러내기
  rationale: 이 절 자체는 행위의 의미를 설명하지 않으므로, 해석을 본문에 앞서 넣지 않고 상징은 문맥에 맡기는 것이 원문 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
