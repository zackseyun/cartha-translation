base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/007.yaml
  text: Then the angel of Yahweh returned a second time and touched him and said[a], “Get up and eat, because the journey is too much for you.”
  footnotes:
  - marker: a
    text: Or “the messenger of the LORD.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 천사[a]가 두 번째로 돌아와 그를 만지고 말했습니다. “일어나 먹으십시오. 그 여정이 당신에게 너무 버겁기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼의 사자”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  - 야훼의 천사
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥상 단순한 ‘사자’보다 초월적 전달자인 ‘천사’가 자연스럽고, יְהוָה는 영어 POB의 ‘Yahweh’에 맞춰 ‘야훼’로 옮겼습니다.
- source_word: שֵׁנִית
  english_pob_choice: a second time
  chosen_korean: 두 번째로
  alternatives_korean:
  - 다시
  - 한 번 더
  lexicon: HALOT
  rationale: 반복을 단순화한 ‘다시’보다, 원문의 반복 횟수를 분명히 드러내는 ‘두 번째로’가 더 정확합니다.
- source_word: וַיִּגַּע בּוֹ
  english_pob_choice: touched him
  chosen_korean: 그를 만지며
  alternatives_korean:
  - 그를 만졌고
  - 그를 건드리며
  lexicon: HALOT
  rationale: נגע는 여기서 물리적 접촉을 뜻하므로 ‘만지다’가 적절하며, 이어지는 발화와의 연결을 위해 서술형으로 처리했습니다.
- source_word: קוּם אֱכֹל
  english_pob_choice: Get up and eat
  chosen_korean: 일어나 먹으십시오
  alternatives_korean:
  - 일어나서 먹으시오
  - 일어나 먹어라
  lexicon: HALOT
  rationale: 명령의 힘을 살리면서 현대 한국어 합쇼체를 유지하기 위해 ‘일어나 먹으십시오’로 옮겼습니다.
- source_word: רַב מִמְּךָ הַדָּרֶךְ
  english_pob_choice: the journey is too much for you
  chosen_korean: 그 길이 당신에게 너무 버거울 것입니다
  alternatives_korean:
  - 그 여정은 당신에게 너무 큽니다
  - 그 길은 당신에게 너무 길 것입니다
  - 그 길이 당신에게 너무 많을 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘길이 당신에게 너무 많다/크다’이지만, 문맥상 엘리야의 체력이 감당하기 어려운 상태를 가리키므로 ‘너무 버겁다’가 관용적이면서도 의미를 보존합니다.
theological_decisions:
- issue: YHWH divine name rendering
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה를 전통적 대체어인 ‘주님’으로 순화하지 않고, 공개된 POB 원칙에 따라 신명 ‘야훼’로 옮겨 이름 자체를 드러냈습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
