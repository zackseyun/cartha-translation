source:
  edition: WLC
  text: וְ/אֵת֙ יֵה֣וּא בֶן נִמְשִׁ֔י תִּמְשַׁ֥ח לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/אֶת אֱלִישָׁ֤ע בֶּן שָׁפָט֙ מֵ/אָבֵ֣ל מְחוֹלָ֔ה תִּמְשַׁ֥ח לְ/נָבִ֖יא תַּחְתֶּֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/016.yaml
  text: And you shall anoint Jehu son of Nimshi as king over Israel[a], and Elisha son of Shaphat from Abel-meholah you shall anoint as prophet in your place.
  footnotes:
  - marker: a
    text: Or 'after you' or 'instead of you'; the Hebrew can express succession or replacement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그대는 님시의 아들 예후에게 이스라엘의 왕으로 기름을 부어야 합니다. 또 아벨므홀라 출신인 사밧의 아들 엘리사에게 그대의 자리에 예언자로 기름을 부어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그대의 자리’는 ‘그대를 대신하여’ 또는 ‘그대 이후에’로도 옮길 수 있습니다. 히브리어는 계승과 대체의 뉘앙스를 모두 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשַׁח
  english_pob_choice: you shall anoint
  chosen_korean: 기름 부어야 합니다
  alternatives_korean:
  - 기름 붓습니다
  - 기름 부을 것입니다
  lexicon: HALOT
  rationale: 예언적/위임적 명령의 העתיד형을 한국어에서는 의무·지시를 나타내는 ‘-어야 합니다’로 옮겨, 명령성과 문체의 단정함을 함께 살렸습니다.
- source_word: לְמֶלֶךְ / לְנָבִיא
  english_pob_choice: as king / as prophet
  chosen_korean: 왕으로 / 선지자로
  alternatives_korean:
  - 왕으로서 / 예언자로
  - 왕 직분으로 / 예언 직분으로
  lexicon: HALOT
  rationale: ל 접두사의 직분 지정 의미를 한국어 조사 ‘-으로’로 자연스럽게 표현했습니다. ‘선지자’는 본문의 직무 호칭을 직접 드러내는 전통적이지만 소스에 충실한 대응입니다.
- source_word: תַּחְתֶּיךָ
  english_pob_choice: in your place
  chosen_korean: 너의 자리에
  alternatives_korean:
  - 네 대신
  - 너의 후임으로
  - 너를 대신하여
  lexicon: HALOT
  rationale: תחת의 승계·대체 의미를 살리면서도, 선지직 계승의 맥락을 과도하게 해석하지 않도록 ‘너의 자리에’로 옮겼습니다.
- source_word: מֵאָבֵל מְחוֹלָה
  english_pob_choice: from Abel-meholah
  chosen_korean: 아벨므홀라의
  alternatives_korean:
  - 아벨-므홀라에서 온
  - 아벨므홀라 출신의
  lexicon: HALOT
  rationale: מִן의 출처 표지를 한국어 소유격으로 처리해 인물 식별 기능을 유지했습니다. 지명은 외래어 표기 관행에 따라 ‘아벨므홀라’로 옮겼습니다.
theological_decisions:
- issue: 엘리사의 직분 계승을 나타내는 תַּחְתֶּיךָ의 범위
  chosen_reading: 엘리사는 엘리야의 자리를 이어받는 선지자로 नियुक्त됩니다.
  alternative_readings:
  - 엘리사는 단순히 엘리야의 뒤를 잇는 시간적 후계자입니다
  - 엘리사는 엘리야를 완전히 대체하는 자로 임명됩니다
  rationale: 본문은 선지자 직분의 계승을 말하되, 시간 순서만이 아니라 직무 이전도 포함합니다. ‘너의 자리’는 계승과 대체의 긴장을 함께 보존합니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it'
