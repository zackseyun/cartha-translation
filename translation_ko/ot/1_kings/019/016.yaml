  to: 그리고 그대는 님시의 아들 예후에게 이스라엘의 왕으로 기름을 부어야 합니다. 또 아벨므홀라 출신인 사밧의 아들 엘리사에게 그대의 자리에 예언자로 기름을 부어야 합니다.[a]
