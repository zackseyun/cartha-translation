id: 1KI.19.12
reference: 1 Kings 19:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַחַ֤ר הָ/רַ֨עַשׁ֙ אֵ֔שׁ לֹ֥א בָ/אֵ֖שׁ יְהוָ֑ה וְ/אַחַ֣ר הָ/אֵ֔שׁ ק֖וֹל דְּמָמָ֥ה דַקָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/012.yaml
  text: And after the earthquake[a], a fire; Yahweh was not in the fire. And after the fire, a sound of a gentle whisper.
  footnotes:
  - marker: a
    text: Or 'a still small voice,' 'a gentle whisper,' or 'a low whisper.' The Hebrew literally reads 'a sound/voice of thin stillness,' an intentionally delicate and difficult expression.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 지진 뒤에는 불이 있었고, 야훼께서는 그 불 가운데 계시지 않았습니다. 그리고 불 뒤에는 가느다란 고요의 소리가 있었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아주 작은 고요한 목소리’, ‘부드러운 속삭임’, ‘낮은 속삭임’으로 옮길 수 있습니다. 히브리어는 문자적으로 ‘가느다란 고요의 소리/목소리’를 뜻하는데, 의도적으로 섬세하고 난해한 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַחַר
  english_pob_choice: And after
  chosen_korean: 그리고 … 뒤에
  alternatives_korean:
  - 그 뒤에
  - 그리고 나서
  lexicon: HALOT
  rationale: 히브리어의 연속 서술을 살리기 위해 단순한 시간 전환보다 연결감을 유지하는 표현을 택했습니다.
- source_word: הָ/רַעַשׁ
  english_pob_choice: the earthquake
  chosen_korean: 지진
  alternatives_korean:
  - 흔들림
  - 요동
  lexicon: HALOT
  rationale: 문맥상 신현 현상으로서의 강한 흔들림을 한국어에서 가장 자연스럽고 분명하게 드러내는 말은 ‘지진’입니다.
- source_word: לֹא בָ/אֵשׁ יְהוָה
  english_pob_choice: the LORD was not in the fire
  chosen_korean: 야훼께서는 그 불 가운데 계시지 않았습니다
  alternatives_korean:
  - 야훼께서는 불 안에 계시지 않았습니다
  - 야훼께서는 불 가운데 계시지 않으셨습니다
  lexicon: HALOT
  rationale: ב의 장소적 의미를 살려 ‘가운데’로 옮겼고, 신적 임재의 부재를 한국어 자연문으로 표현했습니다.
- source_word: קוֹל דְּמָמָה דַקָּה
  english_pob_choice: a sound of a gentle whisper
  chosen_korean: 고요한 속삭임 같은 소리
  alternatives_korean:
  - 아주 가는 고요의 소리
  - 얇은 정적의 소리
  - 아주 여린 속삭임
  lexicon: HALOT
  rationale: 직역형의 낯섦을 완전히 지우지 않으면서도, 히브리어의 난해한 결합을 한국어에서 이해 가능한 비유 구조로 옮겼습니다. ‘소리’는 קוֹל의 넓은 의미를 살리고, ‘고요한 속삭임 같은’은 דְּמָמָה דַקָּה의 미세하고 섬세한 뉘앙스를 반영합니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명은 제목어가 아니라 고유한 언약 이름이므로, POB 원칙에 따라 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
