revisions:
- from: 그리고 지진 뒤에 불이 있었으나, 야훼께서는 그 불 가운데 계시지 않았습니다. 그리고 불 뒤에, 고요한 속삭임 같은 소리가 있었습니다.[a]
  to: 그리고 지진 뒤에는 불이 있었고, 야훼께서는 그 불 가운데 계시지 않았습니다. 그리고 불 뒤에는 가느다란 고요의 소리가 있었습니다[a].
  rationale: The revised wording removes the added simile and the main-text specification of a whisper, preserving the lexical and syntactic tension of קוֹל דְּמָמָה דַקָּה. It also replaces an unwarranted adversative connective with simple coordination while maintaining idiomatic modern formal-polite Korean.
