  edition: WLC
  text: וַ/יֹּ֗אמֶר צֵ֣א וְ/עָמַדְתָּ֣ בָ/הָר֮ לִ/פְנֵ֣י יְהוָה֒ וְ/הִנֵּ֧ה יְהוָ֣ה עֹבֵ֗ר וְ/ר֣וּחַ גְּדוֹלָ֡ה וְ/חָזָ֞ק מְפָרֵק֩ הָרִ֨ים וּ/מְשַׁבֵּ֤ר סְלָעִים֙ לִ/פְנֵ֣י יְהוָ֔ה לֹ֥א בָ/ר֖וּחַ יְהוָ֑ה וְ/אַחַ֤ר הָ/ר֨וּחַ רַ֔עַשׁ לֹ֥א בָ/רַ֖עַשׁ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/011.yaml
  text: And he said[a], “Go out and stand on the mountain before Yahweh.” And behold, Yahweh was passing by, and a great and strong wind was tearing apart the mountains and shattering rocks before Yahweh, but Yahweh was not in the wind. And after the wind, an earthquake[b], but Yahweh was not in the earthquake.
  footnotes:
  - marker: a
    text: Hebrew 'the LORD was not in the wind.' This may imply not being revealed in it, but the translation keeps the more literal wording.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD was not in the earthquake.' The text does not deny the LORD's sovereignty over the event; it states that he was not in it in the sense expressed by the narrative.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「나가서 산 위에서 야훼 앞에 서십시오.」 보십시오, 야훼께서 지나가고 계셨습니다. 크고 강한 바람이 야훼 앞에서 산들을 찢고 바위를 부수고 있었지만, 야훼께서는 바람 속에 계시지 않았습니다. 그 바람 뒤에 지진이 있었지만, 야훼께서는 그 지진 속에 계시지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그때’의 서술 흐름 속에서 이어지며, 인용의 호흡을 자연스럽게 표시하기 위해 ‘그가 말했습니다’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 히브리어 רַעַשׁ는 이 문맥에서 지진을 가리킵니다. 단순한 ‘흔들림’보다 구체성이 더 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֵא וְעָמַדְתָּ
  english_pob_choice: Go out and stand
  chosen_korean: 나가서 … 서십시오
  alternatives_korean:
  - 나가서 … 서 계십시오
  - 나가서 … 자리를 잡으십시오
  lexicon: HALOT
  rationale: צֵא의 이동성과 עָמַד의 정지 상태를 살려, 먼저 ‘나가서’로 나오게 한 뒤 ‘서십시오’로 위치를 유지하게 했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 야훼 앞에서
  - 야훼의 앞에
  lexicon: HALOT
  rationale: 히브리어의 공간적·관계적 표현을 그대로 살려 ‘앞에’로 옮겼고, POB의 이름 표기 원칙에 따라 יְהוָה는 ‘야훼’로 렌더링했습니다.
- source_word: רוּחַ גְּדוֹלָה וְחָזָק
  english_pob_choice: a great and strong wind
  chosen_korean: 크고 강한 바람
  alternatives_korean:
  - 큰 세찬 바람
  - 크고 세찬 바람
  lexicon: HALOT
  rationale: רוּחַ는 이 문맥에서 물리적 현상인 바람이므로 ‘바람’으로 번역했고, 두 형용사를 분리해 힘의 강도를 유지했습니다.
- source_word: מְפָרֵק הָרִים וּמְשַׁבֵּר סְלָעִים
  english_pob_choice: was tearing apart the mountains and shattering rocks
  chosen_korean: 산들을 찢고 바위를 부수고
  alternatives_korean:
  - 산들을 허물고 바위를 산산이 깨고
  - 산들을 갈라놓고 바위를 깨뜨리고
  lexicon: HALOT
  rationale: 연속 분사들의 격렬한 동작을 살리되, 한국어에서 자연스러운 폭력적 이미지인 ‘찢고… 부수고’로 옮겼습니다.
- source_word: לֹא בָרוּחַ יְהוָה / לֹא בָרַעַשׁ יְהוָה
  english_pob_choice: but Yahweh was not in the wind / earthquake
  chosen_korean: 야훼께서는 바람 속에 계시지 않았습니다 / 그 지진 속에 계시지 않았습니다
  alternatives_korean:
  - 야훼께서는 바람 가운데 계시지 않았습니다
  - 야훼께서는 바람에 나타나지 않으셨습니다
  lexicon: HALOT
  rationale: POB가 보존한 ‘in’의 직설성을 따라 ‘속에 계시지 않았습니다’로 옮겨, 본문이 말하는 신학적 긴장을 해소하지 않았습니다.
theological_decisions:
- issue: 야훼의 현현 방식이 바람과 지진에 ‘없다’고 말하는 구절의 해석
  chosen_reading: 현현의 부재/비동일성을 암시하는 서술로 남기고, ‘드러나지 않으셨다’ 같은 해설적 표현을 넣지 않았습니다.
  alternative_readings:
  - 그 안에 계시지 않았다를 ‘그 현상들로는 자신을 나타내지 않으셨다’로 풀어 설명하기
  - 자연현상을 통한 하나님의 임재 부정으로 강하게 해석하기
  rationale: 히브리어와 POB 모두 단정적 설명을 피하고 ‘in’의 표현을 유지하므로, 독자가 본문이 가진 긴장을 그대로 읽도록 두는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
