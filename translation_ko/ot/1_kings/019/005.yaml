  text: וַ/יִּשְׁכַּב֙ וַ/יִּישַׁ֔ן תַּ֖חַת רֹ֣תֶם אֶחָ֑ד וְ/הִנֵּֽה זֶ֤ה מַלְאָךְ֙ נֹגֵ֣עַ בּ֔/וֹ וַ/יֹּ֥אמֶר ל֖/וֹ ק֥וּם אֱכֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/005.yaml
  text: Then he lay down and slept under a broom tree. And behold[a], an angel touched him and said to him, “Get up, eat.”
  footnotes:
  - marker: a
    text: Or 'messenger.' The Hebrew מַלְאָךְ can refer to either a human messenger or an angelic being; here the context favors 'angel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 엎드려 그 금작화나무 아래에서 잠들었습니다. 보십시오, 한 천사가 그에게 손을 대며 그에게 말했습니다. 「일어나서 먹으십시오」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사자’. 히브리어 מַלְאָךְ는 사람의 사자나 천사적 존재를 가리킬 수 있으며, 여기서는 문맥상 ‘천사’가 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב / וַיִּישַׁן
  english_pob_choice: Then he lay down and slept
  chosen_korean: 그는 엎드려 … 잠들었습니다
  alternatives_korean:
  - 그는 누워 잠들었습니다
  - 그는 몸을 뉘고 잠들었습니다
  lexicon: HALOT
  rationale: שכב과 ישן의 연속 동작을 한국어에서는 자연스럽게 ‘엎드려’와 ‘잠들었습니다’로 옮겨, 단순한 자세와 수면의 결과를 함께 드러냈습니다.
- source_word: תַּחַת רֹתֶם אֶחָד
  english_pob_choice: under a broom tree
  chosen_korean: 그 금작화나무 아래
  alternatives_korean:
  - 그 관목 아래
  - 그 싸리나무 아래
  lexicon: HALOT
  rationale: רֹתֶם은 사막의 broom tree/shrub를 가리키므로, 한국어에서는 구체성을 살리되 독자가 이해할 수 있는 ‘금작화나무’로 옮겼습니다.
- source_word: מַלְאָךְ
  english_pob_choice: angel
  chosen_korean: 한 천사
  alternatives_korean:
  - 한 사자
  - 한 메신저
  lexicon: HALOT
  rationale: 이 문맥은 초자연적 돌봄과 이어지므로, האנגל/사자의 양의적 가능성을 주석으로 남기되 본문은 ‘천사’로 옮기는 것이 가장 자연스럽습니다.
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보니
  lexicon: HALOT
  rationale: 새로운 장면을 갑작스럽게 제시하는 담화 표지를 한국어에서는 ‘보십시오’로 살려, 독자에게 시각적 전환과 놀라움을 전달했습니다.
theological_decisions:
- issue: מַלְאָךְ의 의미를 ‘천사’로 둘지 ‘사자/메신저’로 둘지
  chosen_reading: 본문은 ‘천사’로 두고, 대안 의미는 각주로 남깁니다.
  alternative_readings:
  - 사자
  - 메신저
  rationale: 광야에서의 돌봄과 말하기 장면이 초자연적 존재를 가리키는 흐름이므로, 독자가 본문에서 즉시 이해할 의미는 ‘천사’입니다.
  doctrine_reference: 본문 맥락에 따른 어휘 선택
