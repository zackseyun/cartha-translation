id: 1KI.19.21
reference: 1 Kings 19:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֨שָׁב מֵ/אַחֲרָ֜י/ו וַ/יִּקַּ֣ח אֶת צֶ֧מֶד הַ/בָּקָ֣ר וַ/יִּזְבָּחֵ֗/הוּ וּ/בִ/כְלִ֤י הַ/בָּקָר֙ בִּשְּׁלָ֣/ם הַ/בָּשָׂ֔ר וַ/יִּתֵּ֥ן לָ/עָ֖ם וַ/יֹּאכֵ֑לוּ וַ/יָּ֗קָם וַ/יֵּ֛לֶךְ אַחֲרֵ֥י אֵלִיָּ֖הוּ וַ/יְשָׁרְתֵֽ/הוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/021.yaml
  text: Then he turned back from following him[a], took the pair of oxen, and sacrificed them. With the oxen’s equipment he boiled the flesh and gave it to the people, and they ate[b]. Then he arose and went after Elijah and served him.
  footnotes:
  - marker: a
    text: Or 'the yoke of oxen.'
    reason: lexical_alternative
  - marker: b
    text: Or 'With the yoke/implements of the oxen.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 뒤를 따르던 데서 돌아서서 소 두 마리를 가져다가 잡아 바쳤습니다. 그리고 소의 도구로 그 고기를 삶아 백성에게 주니, 그들이 먹었습니다. 그런 다음 그는 일어나 엘리야를 따라가 그를 섬겼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소의 멍에’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘소의 멍에/도구로’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב מֵאַחֲרָיו
  english_pob_choice: Then he turned back from following him
  chosen_korean: 그는 자기 뒤를 따르던 데서 돌아서서
  alternatives_korean:
  - 그는 그를 따라가던 데서 돌아서서
  - 그는 그 뒤에서 돌아섰습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 방향감(‘뒤따르던 데서’)을 살리면서도 한국어로 자연스럽게 풀었습니다.
- source_word: צֶמֶד הַבָּקָר
  english_pob_choice: the pair of oxen
  chosen_korean: 소 두 마리
  alternatives_korean:
  - 멍에 든 소 한 쌍
  - 한 쌍의 소
  lexicon: HALOT
  rationale: צֶמֶד는 ‘한 쌍/한 짝’의 뜻이므로 수량 중심으로 옮기되, 뒤의 도살·조리 문맥에 맞게 ‘소 두 마리’로 자연화했습니다.
- source_word: וַיִּזְבָּחֵהוּ
  english_pob_choice: and sacrificed them
  chosen_korean: 잡아 바쳤습니다
  alternatives_korean:
  - 희생 제물로 삼았습니다
  - 잡아 죽였습니다
  lexicon: HALOT
  rationale: זבח의 제의적 뉘앙스를 살리면서도, 여기서 누구에게 바쳤는지 명시되지 않으므로 과도한 제의 해석을 피했습니다.
- source_word: וּבִכְלִי הַבָּקָר
  english_pob_choice: With the oxen’s equipment
  chosen_korean: 소의 도구로
  alternatives_korean:
  - 소의 멍에로
  - 소의 기구로
  lexicon: HALOT
  rationale: כְּלִי의 넓은 의미(도구/기구/장비)를 반영해, 연료가 되는 소의 장비라는 사실을 간결하게 드러냈습니다.
- source_word: בִּשְּׁלָם הַבָּשָׂר
  english_pob_choice: he boiled their flesh
  chosen_korean: 그 고기를 삶아
  alternatives_korean:
  - 그 살을 삶아
  - 그 고기를 끓여
  lexicon: HALOT
  rationale: בשל은 ‘삶다/익히다’의 뜻이므로 한국어의 일반적 음식 조리 표현을 택했고, בשר는 여기서 ‘고기’가 가장 자연스럽습니다.
- source_word: וַיֵּלֶךְ אַחֲרֵי אֵלִיָּהוּ
  english_pob_choice: and went after Elijah
  chosen_korean: 엘리야를 따라가
  alternatives_korean:
  - 엘리야 뒤를 따라가
  - 엘리야 뒤를 쫓아가
  lexicon: HALOT
  rationale: ‘뒤를 따라가다’의 의미를 유지하면서 한국어로는 가장 자연스러운 동사구로 옮겼습니다.
- source_word: וַיְשָׁרְתֵהוּ
  english_pob_choice: and served him
  chosen_korean: 그를 섬겼습니다
  alternatives_korean:
  - 그를 시중들었습니다
  - 그의 시종이 되었습니다
  lexicon: HALOT
  rationale: שרת의 기본 뜻인 ‘섬기다’를 살려, 예언자에 대한 지속적 보조 관계를 무리 없이 드러냈습니다.
theological_decisions:
- issue: זבח의 제의적 성격을 한국어에서 어떻게 보존할 것인가
  chosen_reading: ‘잡아 바쳤습니다’로 옮겨 제의적 뉘앙스를 살리되, 제물의 대상은 명시하지 않았습니다.
  alternative_readings:
  - ‘잡아 죽였습니다’처럼 중립적으로 처리
  - ‘희생 제물로 바쳤습니다’처럼 더 강하게 제의화
  rationale: 본문은 엘리사가 소를 죽여 공동식사를 마련하는 장면이지만, 히브리어 זבח의 제의적 색채도 분명합니다. 한국어에서는 그 긴장을 보존하는 표현이 가장 적절합니다.
  doctrine_reference: 제의/서원 행위의 서술은 본문이 말하는 범위 안에서만 옮겨야 함
- issue: 공동체 식사와 소유 포기의 서술을 과장하지 않을 것
  chosen_reading: ‘백성에게 주니, 그들이 먹었습니다’로 간결하게 유지했습니다.
  alternative_readings:
  - ‘잔치를 베풀어’처럼 해석을 추가
  - ‘모두 함께 먹었습니다’처럼 관계를 확장
  rationale: 본문은 식사의 결과만 말하며, 사회적 의미는 암시됩니다. 번역은 그 암시를 남기되 해석을 덧붙이지 않아야 합니다.
  doctrine_reference: 서사 본문은 명시된 사건 중심으로 번역
