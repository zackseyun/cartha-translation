base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/013.yaml
  text: And when Elijah heard it[a], he wrapped his face in his cloak, and went out and stood at the entrance of the cave. And behold, a voice came to him and said, “What are you doing here[b], Elijah?”
  footnotes:
  - marker: a
    text: Or, 'What is it to you here, Elijah?' The Hebrew idiom asks Elijah's business or purpose in this place.
    reason: lexical_alternative
  - marker: b
    text: The object of 'heard' is implicit in Hebrew; contextually it refers to what immediately preceded, often understood as the sound/voice from the prior verse.
    reason: alternative_reading
translation:
  language: ko
  text: 엘리야가 그것을[a] 듣자, 자기 겉옷으로 얼굴을 가리고 나가 굴 어귀에 섰습니다. 그때 그에게 음성이 들려와 말했습니다. “엘리야, 네가 여기서 무엇을 하고 있습니까?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에는 ‘듣다’의 목적어가 명시되어 있지 않습니다. 바로 앞 문맥상 그가 들은 소리 또는 음성을 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어 관용구는 단순히 위치를 묻기보다, 엘리야가 이곳에서 무엇을 하는지 또는 무슨 목적으로 여기 있는지를 묻습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  english_pob_choice: when ... heard it
  chosen_korean: 듣자
  alternatives_korean:
  - 들었을 때
  - 그것을 들었을 때
  lexicon: HALOT
  rationale: 히브리어의 זמן부사적 용법을 자연스러운 서술문으로 옮겼으며, 영어 POB처럼 들은 대상은 문맥상 암시된 것으로 두어 과잉설명을 피했습니다.
- source_word: פָּנָיו בְּאַדַּרְתּוֹ
  english_pob_choice: he wrapped his face in his cloak
  chosen_korean: 자기 얼굴을 겉옷으로 가리고
  alternatives_korean:
  - 자기 얼굴을 망토로 감싸고
  - 자기 얼굴을 겉옷 속에 싸고
  lexicon: HALOT
  rationale: 동작은 얼굴을 가려 숨기는 행위이므로 ‘가리고’가 가장 자연스럽고, אַדֶּרֶת는 문맥상 겉옷/겉옷자락으로 이해해 현대 한국어로 풀었습니다.
- source_word: פֶּתַח הַמְּעָרָה
  english_pob_choice: the entrance of the cave
  chosen_korean: 굴 어귀
  alternatives_korean:
  - 굴 입구
  - 동굴 입구
  lexicon: HALOT
  rationale: פֶּתַח은 단순한 ‘문’보다 ‘어귀/입구’가 적합하며, מְעָרָה는 산문 문맥에서 ‘굴’이 간결하고 자연스러워 보입니다.
- source_word: אֵלָיו קוֹל
  english_pob_choice: a voice came to him
  chosen_korean: 그에게 한 음성이 와서
  alternatives_korean:
  - 그에게 음성이 들려와
  - 한 음성이 그에게 와서
  lexicon: HALOT
  rationale: 베풂의 표현을 그대로 살리면 ‘와서’가 원문의 방향성을 보존합니다. ‘음성’은 단순한 소리가 아니라 화자적 발화를 드러냅니다.
- source_word: מַה לְּךָ פֹה
  english_pob_choice: What are you doing here
  chosen_korean: 네가 여기서 무엇을 하고 있느냐
  alternatives_korean:
  - 네게 여기서 무슨 일이 있느냐
  - 네가 여기서 왜 있느냐
  lexicon: HALOT
  rationale: 이 관용구는 단순한 위치 질문보다 목적/행동의 정당성을 묻는 뜻이므로, 영어 POB의 해석을 따라 ‘무엇을 하고 있느냐’로 옮겼습니다.
theological_decisions:
- issue: 여호와의 음성 제시 방식
  chosen_reading: ‘그에게 한 음성이 와서’로 처리해, 화자의 정체를 이 절 안에서는 밝히지 않았습니다.
  alternative_readings:
  - ‘주님의 음성이 와서’
  - ‘하나님의 음성이 와서’
  rationale: 원문은 단지 ‘음성’이라고만 하므로, 앞뒤 문맥이 지시하는 발화자의 정체를 여기서 명시적으로 풀지 않고 서술의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
