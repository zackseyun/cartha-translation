revisions:
- from: 엘리야는 그것을 듣자 자기 얼굴을 겉옷으로 가리고 밖으로 나와 굴 어귀에 서 있었습니다. 그런데 보라, 그에게 한 음성이 와서 말했습니다. “엘리야야, 네가 여기서 무엇을 하고 있느냐?”[a][b]
  to: 엘리야가 그것을[a] 듣자, 자기 겉옷으로 얼굴을 가리고 나가 굴 어귀에 섰습니다. 그때 그에게 음성이 들려와 말했습니다. “엘리야, 네가 여기서 무엇을 하고 있습니까?”[b]
  rationale: 현대 합쇼체를 일관되게 적용하고, ‘음성이 들려와’로 자연스러운 한국어 서술을 마련했습니다. ‘그것’은 원문에 없는 대상을 특정한 명사로 과도하게 보충하지 않으면서 앞 문맥의 암시를 반영합니다. 각주 표지를 해당 표현에 직접 연결했으며, 관용구의 목적·행동 양면을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:53:30Z'
