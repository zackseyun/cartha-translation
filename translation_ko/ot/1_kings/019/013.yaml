  source_fidelity: 핵심 서술과 질문의 뜻은 원문에 충실합니다. 다만 원문의 וְהִנֵּה אֵלָיו קוֹל은 한국어에서 ‘한 음성이 와서’보다 ‘음성이 들려와’가 더 자연스럽게 그 기능을 살립니다. ‘그것’은 원문에 명시되지 않았지만 앞 절을 받는 최소한의 보충으로 허용됩니다.
  naturalness: 초안의 ‘그런데 보라, 그에게 한 음성이 와서 말했습니다’는 현대 한국어 산문에서 다소 직역투이며, 직접 인용문의 ‘있느냐’는 요구된 현대 합쇼체와 맞지 않습니다. 또한 각주 표지는 해당 어구 바로 뒤에 두는 편이 명확합니다.
  terminology: ‘엘리야’, ‘겉옷’, ‘굴 어귀’, ‘음성’은 적절합니다. 화자의 정체를 이 절에서 ‘여호와’ 또는 ‘하나님’으로 명시하지 않은 것은 원문의 표현을 보존합니다.
