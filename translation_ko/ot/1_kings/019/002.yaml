  verdict: revise
  source_fidelity: 히브리어의 맹세 공식은 ‘신들이 그렇게 하고 더하기를’이라는 선행 저주 선언 뒤에 ‘내일 이맘때까지 … 하지 않는다면’이라는 조건이 이어집니다. 초안은 조건절을 맹세문 내부에 앞세우고 ‘이 신들이’와 ‘신들이’를 중복하여, 원문의 공식적 구조와 한국어 문장 흐름을 모두 약화시킵니다. 또한 מַלְאָךְ는 이 문맥에서 인간 사절이므로 ‘전령’이 현대 한국어에서 더 분명합니다.
  naturalness: ‘보내며 말했습니다’보다 ‘보내어 이렇게 말했습니다’가 자연스럽습니다. 맹세의 조건을 뒤에 ‘…않는다면 말입니다’로 두면 원문의 순서와 위협적 발화의 흐름을 자연스럽게 보존합니다. ‘그렇게 하고 더하기를 바랍니다’는 저주/맹세 공식의 생략된 목적어를 한국어 관용상 ‘내게’로 보완하면서도, 무엇을 하라는지 구체화하지 않습니다.
  terminology: ‘이세벨’, ‘엘리야’, ‘신들’, ‘목숨’은 적절합니다. אֱלֹהִים는 복수 동사와 발화 맥락에 따라 ‘신들’로 옮기되, 단수 독법 가능성은 각주에서 유지합니다. ‘전령’은 ‘사자’가 현대 독자에게 ‘천사’로 오해될 여지를 줄입니다.
