id: 1KI.19.2
reference: 1 Kings 19:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּשְׁלַ֤ח אִיזֶ֨בֶל֙ מַלְאָ֔ךְ אֶל אֵלִיָּ֖הוּ לֵ/אמֹ֑ר כֹּֽה יַעֲשׂ֤וּ/ן אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִפ֔וּ/ן כִּֽי כָ/עֵ֤ת מָחָר֙ אָשִׂ֣ים אֶֽת נַפְשְׁ/ךָ֔ כְּ/נֶ֖פֶשׁ אַחַ֥ד מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/002.yaml
  text: Then Jezebel sent a messenger to Elijah[a], saying, “So may the gods do, and more also, if by this time tomorrow I do not make your life like the life of one of them.”
  footnotes:
  - marker: a
    text: Or, 'So may God do to me, and more also.' The Hebrew אֱלֹהִים can be read as singular 'God' or plural 'gods'; here the plural sense fits Jezebel's setting and the plural verbs in the oath formula.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 이세벨이 엘리야에게 전령을 보내어 이렇게 말했습니다. “신들이 내게 그렇게 하고 더하기를 바랍니다. 내일 이맘때까지 내가 네 목숨을 그들 가운데 한 사람의 목숨처럼 만들지 않는다면 말입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신들’은 히브리어 אֱלֹהִים를 복수로 이해한 번역입니다. 이 말은 단수 ‘하나님’으로도 읽을 수 있으나, 이 장면의 맥락과 맹세 공식에 쓰인 복수 동사가 복수 해석을 더 강하게 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּשְׁלַח
  english_pob_choice: Then ... sent
  chosen_korean: 그때 ... 보내며
  alternatives_korean:
  - 그리고 ... 보내며
  - 그리하여 ... 보내며
  lexicon: HALOT
  rationale: wayyiqtol의 서사 진행을 한국어 자연스러운 순서 표현인 ‘그때’로 옮겨, 단순 나열보다 사건 전개감을 살렸습니다.
- source_word: מַלְאָךְ
  english_pob_choice: messenger
  chosen_korean: 사자
  alternatives_korean:
  - 전령
  - 천사
  lexicon: HALOT
  rationale: 궁정 문맥에서 초자연적 존재가 아니라 인간 전달자를 가리키므로, 고전적 교회어 ‘천사’보다 ‘사자’가 소스 의미를 더 정확히 드러냅니다.
- source_word: כֹּה יַעֲשׂוּן אֱלֹהִים וְכֹה יוֹסִפוּן
  english_pob_choice: So may the gods do, and more also
  chosen_korean: 이 신들이 ... 그렇게 하고도 더 하기를
  alternatives_korean:
  - 신들이 그렇게 하기를, 그리고 더 하기를
  - 하나님이 그렇게 하시고 더 하시기를
  lexicon: HALOT
  rationale: 이스벨의 맹세 공식과 복수 동사를 따라 ‘이 신들’로 옮겼고, 서약체의 저주/맹세 뉘앙스를 한국어로 자연스럽게 살리기 위해 축약형 서술을 사용했습니다.
- source_word: כָעֵת מָחָר
  english_pob_choice: by this time tomorrow
  chosen_korean: 내일 이맘때까지
  alternatives_korean:
  - 내일 이때쯤까지
  - 내일 이 시각까지
  lexicon: HALOT
  rationale: 다음 날의 대응 시점을 가리키는 관용구이므로, 한국어에서 가장 자연스럽고 시간 한계를 드러내는 ‘내일 이맘때까지’를 선택했습니다.
- source_word: נַפְשְׁךָ / נֶפֶשׁ
  english_pob_choice: your life / the life of one of them
  chosen_korean: 네 목숨 / 그들 가운데 한 사람의 목숨
  alternatives_korean:
  - 네 생명 / 그들 가운데 한 사람의 생명
  - 네 혼 / 그들 가운데 한 사람의 혼
  lexicon: HALOT
  rationale: 이 문맥의 נֶפֶשׁ는 ‘영혼’보다 생명·목숨을 뜻하므로, 위협의 직접성과 반복 구조를 살리기 위해 ‘목숨’으로 일관되게 옮겼습니다.
theological_decisions:
- issue: אֱלֹהִים의 지시 대상
  chosen_reading: 이스벨의 맹세 맥락과 복수 동사를 따라 ‘이 신들’로 이해했습니다.
  alternative_readings:
  - ‘하나님’으로 단수 이해
  - ‘신들’과 ‘하나님’의 이중 가능성 유지
  rationale: 이세벨의 발화 상황은 바알 숭배 맥락이며, 바로 뒤 복수 동사도 복수 해석을 지지합니다. 한국어 본문에서는 독자가 그 긴장을 바로 읽을 수 있도록 복수로 드러냈습니다.
  doctrine_reference: 본문-문맥 해석(왕상 19:2; 출처 문맥상 다신교적 맹세 공식)
