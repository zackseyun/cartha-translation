  rationale: 맹세 공식의 선언을 먼저, 그 위반 조건을 뒤에 배치하여 히브리어의 문장 순서와 수사적 힘을 보존했습니다. ‘내게’는 히브리어 맹세 공식에서 문맥상 함축된 수혜/피해 대상을 한국어 관용에 맞게 드러낸 것이며, 저주의 구체적 내용을 추가하지 않습니다. ‘전령’으로 인간 사절임을 명확히 했습니다.
