base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/009.yaml
  text: There he came to the cave and spent the night there. And behold[a], the word of Yahweh came to him and said to him, “What are you doing here, Elijah?”
  footnotes:
  - marker: a
    text: Or, “Why are you here, Elijah?” The Hebrew idiom literally reads, “What [is] to you here, Elijah?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그곳에 있는 동굴로 들어가 그곳에서 밤을 지냈습니다. 보십시오[a], 야훼의 말씀이 그에게 임하여 그에게 말씀하셨습니다. “엘리야야, 네가 여기서 무엇을 하고 있느냐?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “엘리야야, 왜 여기 있느냐?” 히브리어 관용구는 문자적으로는 “네게 무엇이 여기 있느냐?”에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... אֶל הַמְּעָרָה
  english_pob_choice: he came ... to the cave
  chosen_korean: 그곳에 있는 동굴로 들어가
  alternatives_korean:
  - 그 동굴에 이르러
  - 그 동굴로 왔습니다
  lexicon: HALOT
  rationale: בוא의 기본 이동 의미를 살리되, 동굴 앞 문맥에서 자연스러운 한국어로 ‘들어가’를 택해 진입 장면을 분명히 했습니다.
- source_word: וַיָּלֶן
  english_pob_choice: spent the night
  chosen_korean: 그곳에서 밤을 지냈습니다
  alternatives_korean:
  - 그곳에서 묵었습니다
  - 그곳에서 하룻밤을 보냈습니다
  lexicon: HALOT
  rationale: לון/לין의 ‘밤을 지내다, 묵다’라는 뜻을 현대적이고 자연스러운 표현으로 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제
  lexicon: HALOT
  rationale: 갑작스러운 주의 환기를 나타내는 הִנֵּה의 담화 기능을 살리면서, 한국어에서 자연스럽고 격식 있는 감탄형으로 옮겼습니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말씀이
  - 여호와의 말씀
  lexicon: HALOT
  rationale: 예언자 공식의 관용구를 그대로 살려 ‘말씀’으로 옮기고, 신명기적·예언자적 어법을 반영해 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: 여호와/야훼의 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에 있는 יְהוָה를 번역어 ‘주’로 대체하지 않고, 본 프로젝트 기본 방침에 따라 고유명사적 신명 ‘야훼’로 드러냈습니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה YHWH → 야훼
- issue: בְּדִיבּוּר형 신적 질문의 한국어 문체
  chosen_reading: “엘리야야, 네가 여기서 무엇을 하고 있느냐?”
  alternative_readings:
  - “엘리야야, 왜 여기 있느냐?”
  - “엘리야야, 네가 여기서 무엇을 찾고 있느냐?”
  rationale: 히브리어 관용구 מַה לְּךָ פֹה는 단순한 ‘왜’보다 존재·상황에 대한 추궁을 포함하므로, 직역적 요소를 살린 질문으로 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 5
