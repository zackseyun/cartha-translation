  source_fidelity: 히브리어 본문은 아합이 이세벨에게 엘리야가 행한 모든 일과 그가 모든 예언자들을 칼로 죽인 일을 알렸다고 말합니다. 번역은 두 목적절과 ‘칼로’라는 수단을 충실히 반영합니다. 두 번째 절의 생략된 남성 단수 주어는 문맥상 엘리야로 자연스럽게 이어지며, 번역도 이를 적절히 드러냅니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고 읽기 쉽습니다. ‘알렸습니다’는 הגיד의 보고·전달 의미에 잘 맞습니다. 문장 끝의 ‘모두’는 앞의 두 ‘모든’과 다소 겹쳐 보일 수 있으나, 두 내용을 빠짐없이 알렸다는 범위를 분명히 하며 오류는 아닙니다.
  terminology: ‘아합’, ‘이세벨’, ‘엘리야’는 통용되는 성서 인명 표기이며, ‘예언자들’은 נביאים에 대한 현대적이고 일관된 번역입니다. ‘칼로 죽인’도 הרג ... בחרב를 정확히 옮깁니다.
