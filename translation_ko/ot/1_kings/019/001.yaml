  text: וַ/יַּגֵּ֤ד אַחְאָב֙ לְ/אִיזֶ֔בֶל אֵ֛ת כָּל אֲשֶׁ֥ר עָשָׂ֖ה אֵלִיָּ֑הוּ וְ/אֵ֨ת כָּל אֲשֶׁ֥ר הָרַ֛ג אֶת כָּל הַ/נְּבִיאִ֖ים בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/001.yaml
  text: Ahab told Jezebel all that Elijah had done, and how he had killed all the prophets with the sword.
translation:
  language: ko
  text: 아합이 이세벨에게 엘리야가 한 모든 일과 그가 모든 예언자들을 칼로 죽인 일을 모두 알렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד ... לְאִיזֶבֶל
  english_pob_choice: Ahab told Jezebel
  chosen_korean: 아합이 이세벨에게 ... 알렸습니다
  alternatives_korean:
  - 아합이 이세벨에게 ... 말했습니다
  - 아합이 이세벨에게 ... 전했습니다
  lexicon: הגיד / tell, report
  rationale: 히브리어 동사는 단순 대화가 아니라 사실을 ‘알리다/보고하다’는 뉘앙스가 있어, 한국어도 ‘알렸습니다’로 사건 전달의 성격을 살렸습니다.
- source_word: כָּל אֲשֶׁר עָשָׂה אֵלִיָּהוּ
  english_pob_choice: all that Elijah had done
  chosen_korean: 엘리야가 한 모든 일
  alternatives_korean:
  - 엘리야가 행한 모든 일
  - 엘리야가 저지른 모든 일
  lexicon: כָּל אֲשֶׁר + עשה
  rationale: ‘עשה’는 문맥상 엘리야의 행위 전반을 가리키므로, 자연스러운 현대 한국어로 ‘한 모든 일’이라고 옮겼습니다.
- source_word: וְאֵת כָּל אֲשֶׁר הָרַג ... בֶּחָרֶב
  english_pob_choice: and how he had killed all the prophets with the sword
  chosen_korean: 그가 모든 예언자들을 칼로 죽인 일
  alternatives_korean:
  - 그가 모든 예언자들을 칼로 죽였다는 일
  - 그가 칼로 모든 예언자들을 죽인 일
  lexicon: הרג ... בחרב
  rationale: 영어 POB의 ‘and how’는 단순 병렬보다 ‘그가 어떻게 했는지’라는 보고체를 반영하므로, 한국어에서는 사건 보고로 자연스럽게 풀어 ‘...죽인 일’로 처리했습니다.
- source_word: הַנְּבִיאִים
  english_pob_choice: the prophets
  chosen_korean: 예언자들
  alternatives_korean:
  - 선지자들
  - 예언자들
  lexicon: נביא
  rationale: POB의 기본 방침에 맞춰 전통적 교회어 ‘선지자들’ 대신, 원어의 의미를 더 직접적으로 드러내는 ‘예언자들’을 사용했습니다.
theological_decisions:
- issue: ‘and how’의 서술 방식
  chosen_reading: 사건을 단순한 목록이 아니라, 아합이 이세벨에게 엘리야의 행동과 그 결과를 보고하는 방식으로 번역했습니다.
  alternative_readings:
  - 단순히 ‘그리고 그가 ... 죽였다’로 병렬 처리
  - ‘어떻게’라는 부사어를 문자 그대로 살려 직역
  rationale: 히브리어 연결은 이야기 전개상 보고의 강조를 주므로, 한국어에서는 문맥을 살린 서술형으로 옮기는 편이 원문의 기능을 더 잘 전달합니다.
  doctrine_reference: 서사 문맥 보존
