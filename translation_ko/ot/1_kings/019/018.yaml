source:
  edition: WLC
  text: וְ/הִשְׁאַרְתִּ֥י בְ/יִשְׂרָאֵ֖ל שִׁבְעַ֣ת אֲלָפִ֑ים כָּל הַ/בִּרְכַּ֗יִם אֲשֶׁ֤ר לֹֽא כָֽרְעוּ֙ לַ/בַּ֔עַל וְ/כָ֨ל הַ/פֶּ֔ה אֲשֶׁ֥ר לֹֽא נָשַׁ֖ק לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/018.yaml
  text: Yet I have left for myself seven thousand in Israel—all the knees that have not bowed to Baal[b][a], and every mouth that has not kissed him.
  footnotes:
  - marker: a
    text: Or 'I have kept/reserved for myself seven thousand in Israel.'
    reason: lexical_alternative
  - marker: b
    text: Kissing an idol was an act of homage or worship.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 나는 이스라엘 가운데 나를 위해 칠천 명을 남겨 두었습니다.[a] 그들은 모두 바알에게 무릎을 꿇지 않았고, 그에게 입맞추지도 않았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보존해 두었습니다.’
    reason: lexical_alternative
  - marker: b
    text: 우상에게 입맞추는 행위는 경의나 예배를 나타냈습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  english_pob_choice: Yet I have left for myself
  chosen_korean: 그러나 나는 이스라엘 가운데 나를 위해 ... 남겨 두었습니다
  alternatives_korean:
  - 그러나 나는 ... 두었습니다
  - 그러나 나는 나를 위해 ... 보존해 두었습니다
  - 그러나 나는 ... 남겨 두었습니다
  lexicon: HALOT
  rationale: הִשְׁאַרְתִּי는 ‘남기다/남겨 두다’의 사역형으로, 문맥상 ‘남겨 둔 결과가 지금 남아 있다’는 현재적 의미를 살리는 것이 자연스럽습니다. 영어 POB의 ‘for myself’는 소유보다 보존 의도를 드러내므로 ‘나를 위해’로 옮겼습니다.
- source_word: שִׁבְעַת אֲלָפִים
  english_pob_choice: seven thousand
  chosen_korean: 칠천 명
  alternatives_korean:
  - 일곱 천
  - 일곱천 명
  - 7천 명
  lexicon: HALOT
  rationale: 히브리어 수사 구조는 한국어에서 관용적으로 ‘칠천 명’으로 자연스럽게 옮길 수 있습니다. 사람을 가리키는 문맥이므로 단위를 보강했습니다.
- source_word: כָּל הַבִּרְכַּיִם
  english_pob_choice: all the knees
  chosen_korean: 모든 무릎
  alternatives_korean:
  - 온 무릎들
  - 무릎마다
  - 모든 무릎들
  lexicon: HALOT
  rationale: 직역의 신체 이미지를 살리되 한국어에서는 ‘모든 무릎’이 집합적·비유적 의미를 가장 분명하게 전달합니다. 사람을 환유하는 표현이지만 원문의 이미지가 중요하므로 유지했습니다.
- source_word: וְכָל הַפֶּה
  english_pob_choice: and every mouth
  chosen_korean: 그에게 입맞추지 않은 모든 입
  alternatives_korean:
  - 모든 입
  - 입마다
  - 그에게 입맞추지 않은 모든 입들
  lexicon: HALOT
  rationale: ‘입’ 역시 환유를 유지해 병행 구조를 살렸습니다. 한국어에서는 뒤의 관계절을 바로 붙여 ‘그에게 입맞추지 않은 모든 입’으로 옮겨, 우상 숭배의 행위를 더 분명히 드러냈습니다.
theological_decisions:
- issue: 바알 숭배를 향한 절하는 행위와 입맞춤의 예배적 의미
  chosen_reading: 바알에게 무릎을 꿇지 않은 ... 그에게 입맞추지 않은
  alternative_readings:
  - 바알 앞에 무릎을 꿇지 않은
  - 바알에게 절하지 않은
  - 그에게 입맞추지 않은
  rationale: 원문은 단순한 자세가 아니라 배타적 경배의 거부를 말하므로 ‘무릎을 꿇다’와 ‘입맞추다’를 함께 살렸습니다. 영어 POB의 주석처럼 입맞춤은 우상에 대한 경의·숭배 행위이므로, 한국어 본문에서도 그 종교적 함의를 약화시키지 않았습니다.
  doctrine_reference: 우상숭배의 표지로서의 몸짓과 예배 행위
- issue: 남은 자 진술을 신학 용어로 확대하지 않기
  chosen_reading: 나는 이스라엘 가운데 나를 위해 칠천 명을 남겨 두었습니다
  alternative_readings:
  - 나는 이스라엘 가운데 나를 위해 칠천 명을 보존해 두었습니다
  - 나는 이스라엘 가운데 나를 위해 칠천 명을 남겨 두었습니다
  rationale: 본문은 남은 자 교리를 직접 설명하기보다 하나님이 자기 백성을 보존하셨다는 사실을 말합니다. 따라서 ‘남겨 두었습니다’를 택해 본문의 역사적 진술을 유지하고, 후대 교리 용어를 과도하게 끌어오지 않았습니다.
  doctrine_reference: 문맥적 remnant 진술을 보존하되 용어 체계화는 자제
