    rationale: 본문의 ‘남겨 두었습니다’ 자체가 해당 동사의 정상적인 번역입니다. 영어 감사 기록의 lexical alternative에 맞추어 ‘보존해 두었습니다’를 대안으로 제시하는 방식이 정확합니다.
