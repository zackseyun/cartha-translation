    rationale: 히브리어의 ‘모든 무릎’과 ‘모든 입’은 사람을 가리키는 환유적 병행이지만, 한국어에서 칠천 ‘명’을 신체 부위와 직접 등치하면 의미와 문장 구조가 부자연스럽습니다. ‘그들은 모두’라고 풀되 두 행위를 그대로 유지하는 것이 원문의 뜻과 한국어 관용을 함께 살립니다.
  - severity: low
