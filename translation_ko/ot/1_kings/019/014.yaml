reference: 1 Kings 19:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/014.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[b], to take it.”
  footnotes:
  - marker: a
    text: Or “I have been exceedingly jealous for the LORD.” The Hebrew uses an infinitive absolute with the finite verb to intensify the statement.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the sons of Israel”; many translations render this more idiomatically as “the Israelites.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「나는 야훼, 만군의 하나님을 위하여 몹시 열심을 냈습니다. 이는 이스라엘 자손이 주의 언약을 버리고 주의 제단들을 헐어 버렸으며 주의 예언자들을 칼로 죽였기 때문입니다. 저만 홀로 남았는데, 그들이 제 생명을 빼앗으려고 찾습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  english_pob_choice: I have been very zealous
  chosen_korean: 몹시 열심을 냈습니다
  alternatives_korean:
  - 매우 질투했습니다
  - 몹시 질투했습니다
  - 매우 열심이었습니다
  lexicon: HALOT
  rationale: 분사적 강조(부정사 절대형 + 완료형)의 강세를 한국어에서는 자연스러운 관용인 ‘열심을 내다’로 살리되, 부사의 ‘몹시’로 강조를 반영했습니다. ‘질투’는 여기서 언약적 열심의 의미를 충분히 담지 못해 피했습니다.
- source_word: לַיהוָה אֱלֹהֵי צְבָאוֹת
  english_pob_choice: Yahweh, the God of hosts
  chosen_korean: 야훼, 만군의 하나님
  alternatives_korean:
  - 여호와, 만군의 하나님
  - 야훼, 군대의 하나님
  - 야훼, 하늘의 군대의 하나님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH; HALOT'
  rationale: 여기서는 본문이 직접 하나님의 언약 이름 יהוה를 사용하므로 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. צְבָאוֹת은 ‘만군’이 가장 굳어진 대응으로, ‘hosts’의 넓은 범위를 과도하게 좁히지 않습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살리면서도 한국어에서 자연스러운 집합 명칭인 ‘이스라엘 자손’을 사용했습니다. 성별 비가시화를 피하면서도 문맥상 무리가 없습니다.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  english_pob_choice: I alone am left
  chosen_korean: 오직 저만 홀로 남았는데
  alternatives_korean:
  - 저만 홀로 남았습니다
  - 저 혼자만 남았습니다
  - 오직 저만 남았습니다
  lexicon: HALOT
  rationale: אלָה적 강조를 ‘오직…만 홀로’로 살려 엘리야의 고립감을 드러냈습니다. 이어지는 이유절과의 연결을 위해 종결을 약간 열어 두었습니다.
- source_word: נַפְשִׁי ... לְקַחְתָּהּ
  english_pob_choice: my life ... to take it
  chosen_korean: 제 생명을 빼앗으려고
  alternatives_korean:
  - 제 목숨을 빼앗으려고
  - 제 생명을 가져가려고
  - 제 생명을 취하려고
  lexicon: HALOT
  rationale: נפש는 여기서 ‘영혼’이 아니라 생명/목숨의 관용 표현이므로 ‘생명’으로 옮겼습니다. לָקַח의 목적 의미는 한국어에서 가장 자연스러운 ‘빼앗다’로 드러냈습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 본문의 언약 이름을 ‘야훼’로 유지합니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 영어 POB가 본문 전통보다 야훼를 택한 이유를 따라, 한국어도 직역적·주해적 투명성을 위해 ‘야훼’를 사용했습니다. 이는 번역 전통보다 소스 텍스트의 고유한 신명성을 드러내려는 선택입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
