source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָֽ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/010.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[c][b], to take it.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Yahweh.'' The divine name יְהוָה is rendered ''the LORD'' in keeping with the project''s default practice.'
    reason: alternative_reading
  - marker: b
    text: 'Or ''the Israelites.'' Hebrew: ''the sons of Israel.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'I have been exceedingly jealous for the LORD.' The Hebrew uses an intensive construction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「내가 야훼, 만군의 하나님을 위해 매우 열심을 내었습니다. 왜냐하면 이스라엘의 자손들이 주의 언약을 버리고, 주의 제단들을 헐어 버렸으며, 주의 선지자들을 칼로 죽였기 때문입니다. 오직 나만 홀로 남았는데, 그들이 내 생명을 찾아 그것을 빼앗으려 합니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה는 프로젝트 기본값에 따라 본문에서 ‘야훼’로 옮깁니다.
    reason: source_note
  - marker: b
    text: 히브리어 ‘이스라엘의 자손들’은 집합적 민족 명칭입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 부정사 절대형과 완료형을 겹쳐 강한 강조를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  english_pob_choice: I have been very zealous
  chosen_korean: 매우 열심을 내었습니다
  alternatives_korean:
  - 극도로 열심을 내었습니다
  - 매우 질투하였습니다
  lexicon: HALOT
  rationale: 히브리어의 강조 구조(부정사 절대형+완료형)는 강한 강조를 나타내므로, 현대 한국어에서는 ‘매우 열심을 내었습니다’로 자연스럽게 옮겨 그 강도를 살렸습니다. ‘질투하다’는 문맥상 부적절합니다.
- source_word: לַ/יהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문의 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. 이 절에서는 영어 POB의 각주와 달리 본문에 직접 반영하는 것이 소스-직결 번역에 더 적합합니다.
- source_word: אֱלֹהֵי צְבָאֹות
  english_pob_choice: the God of hosts
  chosen_korean: 만군의 하나님
  alternatives_korean:
  - 하늘군대의 하나님
  - 만군의 주 하나님
  lexicon: HALOT
  rationale: צְבָאֹות의 기본 의미인 ‘군대/무리들’을 한국어 성경 관용에 맞게 ‘만군’으로 살렸습니다. ‘하나님’은 문맥상 소유격 제목을 자연스럽게 받습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 자손들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성들이
  lexicon: HALOT
  rationale: 히브리어의 직역성인 ‘sons of Israel’을 보존하되, 한국어에서는 관용적인 복수 집단 표현인 ‘자손들’로 옮겨 원문 어감을 유지했습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my life
  chosen_korean: 내 생명
  alternatives_korean:
  - 내 목숨
  - 내 혼
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 ‘영혼’이 아니라 생명/목숨의 의미이므로, 서술의 긴박함을 살리는 ‘생명’이 적절합니다. ‘목숨’도 가능하지만 문체상 ‘생명’이 더 균형적입니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 본문에는 ‘야훼’를 사용하고, 경외적 호칭은 ‘하나님’과 함께 병기했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문의 신명은 소스 직접성 때문에 음역을 유지하되, 뒤따르는 칭호 ‘만군의 하나님’으로 관계적·예배적 호칭을 함께 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
