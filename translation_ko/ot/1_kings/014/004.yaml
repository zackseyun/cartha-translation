source:
  edition: WLC
  text: וַ/תַּ֤עַשׂ כֵּן֙ אֵ֣שֶׁת יָרָבְעָ֔ם וַ/תָּ֨קָם֙ וַ/תֵּ֣לֶךְ שִׁלֹ֔ה וַ/תָּבֹ֖א בֵּ֣ית אֲחִיָּ֑ה וַ/אֲחִיָּ֨הוּ֙ לֹֽא יָכֹ֣ל לִ/רְא֔וֹת כִּ֛י קָ֥מוּ עֵינָ֖י/ו מִ/שֵּׂיבֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/004.yaml
  text: Jeroboam’s wife did so. She arose and went to Shiloh[a], and came to Ahijah’s house. Now Ahijah could not see, because his eyes were dim because of his old age.
  footnotes:
  - marker: a
    text: Hebrew literally, 'his eyes stood because of his old age,' an idiom describing age-related loss of sight.
    reason: lexical_alternative
translation:
  language: ko
  text: 여로보암의 아내가 그렇게 했습니다. 그녀는 일어나 실로[a]로 가서 아히야의 집에 이르렀습니다. 그런데 아히야는 나이가 많아 눈이 어두워져 보지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 '그의 눈이 그의 노쇠 때문에 섰다'이며, 나이로 인한 시력 저하를 뜻하는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ כֵּן
  english_pob_choice: did so
  chosen_korean: 그렇게 했습니다
  alternatives_korean:
  - 그리하였습니다
  - 그와 같이 했습니다
  lexicon: HALOT
  rationale: 앞선 지시에 대한 순종을 나타내는 서술 공식이므로, 현대 한국어에서는 자연스럽고 격식을 유지하는 '그렇게 했습니다'가 가장 적절합니다.
- source_word: שִׁלֹה
  english_pob_choice: Shiloh
  chosen_korean: 실로
  alternatives_korean:
  - 실로가
  - 실로(지명)
  lexicon: 고유명사 표기 관행
  rationale: 지명은 현대 외래어/성경 관행에 따라 '실로'로 음역하는 것이 자연스럽습니다.
- source_word: לֹא יָכֹל לִרְאֹת
  english_pob_choice: could not see
  chosen_korean: 보지 못했습니다
  alternatives_korean:
  - 볼 수 없었습니다
  - 볼 수 없었습니다
  lexicon: HALOT
  rationale: 능력 부정과 시각 상실을 직접적으로 전달하는 한국어로 옮겼습니다.
- source_word: קָמוּ עֵינָיו מִשֵּׂיבוֹ
  english_pob_choice: his eyes were dim because of his old age
  chosen_korean: 눈이 어두워져
  alternatives_korean:
  - 눈이 침침해져
  - 눈이 흐려져
  lexicon: HALOT
  rationale: 직역하면 '눈이 섰다'는 관용 표현이지만, 문맥상 노쇠로 인한 시력 저하를 뜻하므로 의미를 보존하면서도 한국어 관용에 맞게 '눈이 어두워져'로 옮겼습니다.
theological_decisions:
- issue: 노쇠로 인한 시력 상실의 서술을 어떻게 표현할지
  chosen_reading: 원문의 관용적 이미지(‘눈이 섰다’)를 과도하게 풀지 않고, 결과 상태인 시력 저하를 분명히 드러내도록 했습니다.
  alternative_readings:
  - '''눈이 고정되어'''
  - '''눈이 굳어져'''
  rationale: 이 본문은 아히야의 신체적 한계를 설명하는 역사 서술이므로, 독자가 즉시 이해할 수 있는 방식으로 의미를 전달하되 원문의 원인을 유지해야 합니다.
  doctrine_reference: 본문 문맥상의 서술적 정확성
- issue: 아히야의 이름과 서술 전환을 어떻게 처리할지
  chosen_reading: '''그런데 아히야는''으로 전환하여 인물 중심 장면 전환을 표시했습니다.'
  alternative_readings:
  - '''그리고 아히야는'''
  - '''이제 아히야는'''
  rationale: וַאֲחִיָּהוּ의 장면 전환 기능을 한국어 담화 표지로 자연스럽게 드러내는 선택입니다.
  doctrine_reference: 히브리어 서술 담화 구조
