source:
  edition: WLC
  text: וְ/סָֽפְדוּ ל֤/וֹ כָל יִשְׂרָאֵל֙ וְ/קָבְר֣וּ אֹת֔/וֹ כִּֽי זֶ֣ה לְ/בַדּ֔/וֹ יָבֹ֥א לְ/יָרָבְעָ֖ם אֶל קָ֑בֶר יַ֣עַן נִמְצָא ב֞/וֹ דָּבָ֣ר ט֗וֹב אֶל יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/בֵ֥ית יָרָבְעָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/013.yaml
  text: All Israel will mourn for him and bury him[a], because he alone of Jeroboam’s house will come to the grave, since in him something good toward Yahweh, the God of Israel[c][b], has been found in the house of Jeroboam.
  footnotes:
  - marker: a
    text: Literally, 'he alone will come to Jeroboam, to the grave'—that is, he alone from Jeroboam’s house will receive burial.
    reason: lexical_alternative
  - marker: b
    text: Or 'a good thing' instead of 'something good.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'toward the LORD'; this may mean a disposition or quality directed toward, or pleasing in relation to, the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 이스라엘이 그를 위해 슬퍼하며 그를 장사할 것입니다[a]. 왜냐하면 그가 야훼, 이스라엘의 하나님께[b][c] 좋은 것이 하나 발견된 사람으로서 여로보암의 집안에서 홀로 무덤에 들어갈 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그는 홀로 여로보암에게, 곧 무덤으로 갈 것입니다’라는 뜻으로, 여로보암의 집안 가운데서 그만이 장사될 것이라는 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 전치사 אֶל은 여기서 ‘~을 향한’ 또는 ‘~에 대하여’라는 지향·관계의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘야훼, 이스라엘의 하나님’은 원문에 나타난 하나님의 호칭을 그대로 반영한 것입니다.
    reason: source_note
lexical_decisions:
- source_word: וְסָפְדוּ
  english_pob_choice: will mourn
  chosen_korean: 슬퍼하며
  alternatives_korean:
  - 애곡하며
  - 애도하며
  lexicon: HALOT
  rationale: 장례 맥락의 ציבור적 애도 동작을 자연스러운 현대 한국어로 옮기되, 지나치게 강한 ‘애곡’보다 넓은 의미의 슬퍼함을 살렸습니다.
- source_word: וְקָבְרוּ אֹתוֹ
  english_pob_choice: and bury him
  chosen_korean: 그를 장사할 것입니다
  alternatives_korean:
  - 그를 묻을 것입니다
  - 그를 매장할 것입니다
  lexicon: HALOT
  rationale: 히브리어의 직접 목적어를 그대로 살리면서, 장례·매장 문맥에 맞는 ‘장사하다’를 선택했습니다.
- source_word: נִמְצָא בּוֹ דָּבָר טוֹב
  english_pob_choice: something good has been found in him
  chosen_korean: 좋은 것이 하나 발견된
  alternatives_korean:
  - 무언가 좋은 것이 발견된
  - 선한 것이 발견된
  lexicon: HALOT
  rationale: דָּבָר טוֹב의 불특정성을 살려 ‘좋은 것’으로 두었고, 발견된 상태를 수동형으로 반영했습니다.
- source_word: אֶל יְהוָה
  english_pob_choice: toward Yahweh
  chosen_korean: 야훼, 이스라엘의 하나님께
  alternatives_korean:
  - 야훼를 향한
  - 야훼께
  lexicon: HALOT
  rationale: 전치사 אֶל의 지향성은 한국어에서 ‘~께’가 가장 자연스럽지만, 문맥상 대상을 분명히 하기 위해 ‘야훼, 이스라엘의 하나님께’로 옮겼습니다.
- source_word: בְּבֵית יָרָבְעָם
  english_pob_choice: in the house of Jeroboam
  chosen_korean: 여로보암의 집안
  alternatives_korean:
  - 여로보암의 가문
  - 여로보암의 집
  lexicon: HALOT
  rationale: 여기서 ‘집’은 왕조/가문을 뜻하므로, 현대 독자가 이해하기 쉬운 ‘집안’으로 옮기되 동적 의미를 유지했습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 고유명사이므로, 공인된 음역인 ‘야훼’를 사용해 본문의 이름성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘좋은 것’의 도덕적·관계적 뉘앙스
  chosen_reading: 좋은 것이
  alternative_readings:
  - 선한 것이
  - 좋은 일
  rationale: 히브리어 표현은 단순한 행위 하나보다 인물 안에서 발견된 긍정적 질서나 성향을 열어 두므로, 과도한 신학적 해석을 피하고 중립적인 ‘좋은 것’으로 두었습니다.
  doctrine_reference: 1 Kings 14:13 source-level semantic tension
