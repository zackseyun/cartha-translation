  rationale: 원문의 순서에 따라 이스라엘의 애도와 매장, 여로보암 집안에서 유일하게 무덤에 이르는 사실, 그 이유인 야훼를 향한 ‘좋은 것’의 발견을 차례로 제시했습니다. ‘무덤에 들어갈’은 ‘무덤에 이르다’라는 히브리어 표현을 자연스러운 한국어로 옮기면서, 문맥상 유일하게 매장된다는 뜻을 보존합니다. 각주 표지도 해당 어휘·표현 바로 뒤에 배치했습니다.
