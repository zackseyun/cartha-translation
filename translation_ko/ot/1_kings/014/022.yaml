  text: וַ/יַּ֧עַשׂ יְהוּדָ֛ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְקַנְא֣וּ אֹת֗/וֹ מִ/כֹּל֙ אֲשֶׁ֣ר עָשׂ֣וּ אֲבֹתָ֔/ם בְּ/חַטֹּאתָ֖/ם אֲשֶׁ֥ר חָטָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/022.yaml
  text: And Judah did what was evil in the eyes of Yahweh[a], and they provoked him to jealousy more than all that their fathers had done, by the sins that they committed.
  footnotes:
  - marker: a
    text: Or 'they made him jealous' or 'they aroused his jealousy.' The Hebrew uses covenantal jealousy language for the LORD's response to Judah's unfaithfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다는 야훼께서 보시기에 악을 행했으며, 그들이 저지른 죄로 말미암아 그들의 조상들이 행한 모든 것보다 더 야훼의 질투를 불러일으켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼의 질투를 불러일으켰습니다’는 히브리어의 언약적 질투 언어를 따른 번역입니다. 직역하면 ‘그분을 질투하게 했다’이며, ‘그분의 질투를 일으켰다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  english_pob_choice: Judah
  chosen_korean: 유다
  alternatives_korean:
  - 유다 백성
  - 유다 왕국
  lexicon: HALOT
  rationale: 고유명사이지만 문맥상 남유다 공동체 전체를 가리키므로, 한국어 본문에서는 가장 직접적인 형태인 ‘유다’로 두고 집합적 의미는 문맥이 받치게 했습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼의 눈에
  alternatives_korean:
  - 야훼 보시기에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 평가를 나타내는 히브리어 관용구를 살리기 위해 ‘눈에’를 유지했고, YHWH는 본문 지침에 따라 ‘야훼’로 옮겼습니다.
- source_word: וַיְקַנְאוּ אֹתוֹ
  english_pob_choice: they provoked him to jealousy
  chosen_korean: 그분을 질투하게 했습니다
  alternatives_korean:
  - 그분을 질투하시게 했습니다
  - 그분의 질투를 일으켰습니다
  - 그분을 질투하게 만들었습니다
  lexicon: HALOT
  rationale: קנא의 언약적 ‘질투’ 의미를 보존하되, ‘질투하게 했다’로 자연스럽게 옮겨 신적 불순종에 대한 반응이라는 뜻을 드러냈습니다.
- source_word: מִכֹּל אֲשֶׁר עָשׂוּ אֲבֹתָם
  english_pob_choice: more than all that their fathers had done
  chosen_korean: 그들의 조상들이 행한 모든 것보다 더
  alternatives_korean:
  - 그들의 조상들이 한 모든 것보다
  - 조상들이 행한 어떤 것보다도
  lexicon: HALOT
  rationale: מִן + כֹּל의 비교 의미를 한국어의 ‘~보다 더’로 자연스럽게 표현했고, ‘조상들’은 직역성을 유지했습니다.
theological_decisions:
- issue: 야훼의 언약적 질투를 어떻게 드러낼지
  chosen_reading: ‘질투하게 했습니다’로 옮겨, 하나님께서 죄에 대해 보이시는 언약적 질투를 약화시키지 않았습니다.
  alternative_readings:
  - ‘화나게 했습니다’
  - ‘분노하시게 했습니다’
  - ‘시기하게 했습니다’
  rationale: 본문은 단순한 분노보다 언약 위반에 대한 질투의 범주를 사용하므로, 그 신학적 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy §1, §3; Contested terms: divine jealousy'
