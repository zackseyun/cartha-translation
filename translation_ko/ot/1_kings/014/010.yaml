source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ אֶל בֵּ֣ית יָרָבְעָ֔ם וְ/הִכְרַתִּ֤י לְ/יָֽרָבְעָם֙ מַשְׁתִּ֣ין בְּ/קִ֔יר עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵ֑ל וּ/בִֽעַרְתִּי֙ אַחֲרֵ֣י בֵית יָרָבְעָ֔ם כַּ/אֲשֶׁ֛ר יְבַעֵ֥ר הַ/גָּלָ֖ל עַד תֻּמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/010.yaml
  text: Therefore[a], behold, I am bringing disaster on the house of Jeroboam, and I will cut off from Jeroboam every male, bond and free in Israel, and I will burn away after the house of Jeroboam[b], just as one burns away dung until it is all gone.
  footnotes:
  - marker: a
    text: Hebrew literally, 'one who urinates against a wall,' a crude idiom for a male.
    reason: lexical_alternative
  - marker: b
    text: Or 'slave and free'; the Hebrew expression likely functions as a merism meaning all without exception.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 보십시오, 내가 여로보암의 집에 재앙을 내리고, 여로보암에게서 남자 곧 이스라엘에서 매인 자나 자유인이나 모두 끊어 버리며, 여로보암의 집 뒤를 따라 배설물을 치우듯 다 치워 버릴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘담에 오줌 누는 자’라는 거친 남성 지시 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 ‘노예와 자유인’처럼 총체성을 나타내는 병렬어로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן הִנְנִי מֵבִיא רָעָה
  english_pob_choice: I am bringing disaster
  chosen_korean: 재앙을 내리고
  alternatives_korean:
  - 재난을 가져오고
  - 재앙을 가져오고
  - 화를 내리고
  lexicon: HALOT
  rationale: 판결 맥락의 רָעָה는 도덕적 ‘악’이 아니라 임박한 심판의 재난이므로, 현대 한국어에서 직접적이고 강한 ‘재앙’으로 옮겼습니다.
- source_word: וְהִכְרַתִּי
  english_pob_choice: I will cut off
  chosen_korean: 끊어 버리며
  alternatives_korean:
  - 끊어 내며
  - 제거하며
  - 끊어 버리고
  lexicon: HALOT
  rationale: כרת의 언약-심판 관용구를 살리되 한국어에서 자연스러운 강단을 유지하기 위해 ‘끊어 버리다’를 선택했습니다.
- source_word: מַשְׁתִּין בְּקִיר
  english_pob_choice: every male
  chosen_korean: 남자
  alternatives_korean:
  - 수컷
  - 사내
  - 담에 오줌 누는 자
  lexicon: HALOT
  rationale: 히브리어의 거친 남성 지시 관용구를 본문에는 간결한 ‘남자’로 옮기고, 직역의 저속한 뉘앙스는 보존할 수 있어도 출판용 본문에서는 주석으로 처리하는 편이 적절합니다.
- source_word: עָצוּר וְעָזוּב
  english_pob_choice: bond and free
  chosen_korean: 매인 자나 자유인이나
  alternatives_korean:
  - 노예나 자유인이나
  - 억눌린 자나 버림받은 자나
  - 속박된 자나 풀린 자나
  lexicon: HALOT
  rationale: 이 쌍은 총체성을 나타내는 병렬어이므로, 영어 POB의 의미를 따라 신분 전체를 포괄하는 ‘매인 자나 자유인이나’로 옮겼습니다.
- source_word: וּבִעַרְתִּי ... כַּאֲשֶׁר יְבַעֵר הַגָּלָל
  english_pob_choice: I will sweep away ... just as one sweeps away dung
  chosen_korean: 배설물을 치우듯 다 치워 버릴 것입니다
  alternatives_korean:
  - 똥을 치우듯 다 치워 버릴 것입니다
  - 배설물을 없애듯 다 없앨 것입니다
  - 똥을 없애듯 다 없앨 것입니다
  lexicon: HALOT
  rationale: בער의 반복과 분뇨 비유가 강조하는 완전한 제거를 살리기 위해 ‘치워 버리다’를 반복했고, הַגָּלָל은 한국어에서 완곡한 ‘배설물’로 옮겨도 조롱의 힘이 유지됩니다.
theological_decisions:
- issue: 심판 선언의 수위 보존
  chosen_reading: 본문의 도발적이고 모욕적인 심판 어조를 약화시키지 않고, ‘재앙’, ‘끊어 버리며’, ‘다 치워 버릴 것입니다’로 직접적으로 번역했습니다.
  alternative_readings:
  - 재난을 가져오고
  - 제거하며
  - 다 없앨 것입니다
  rationale: 여기서는 신학적·수사적 강도를 완화하기보다, 예언적 저주의 충격을 독자가 그대로 받도록 하는 것이 원문 효과를 가장 잘 반영합니다.
  doctrine_reference: Translation philosophy §§1, 6
