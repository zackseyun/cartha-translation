source:
  edition: WLC
  text: וְ/יִתֵּ֖ן אֶת יִשְׂרָאֵ֑ל בִּ/גְלַ֞ל חַטֹּ֤אות יָֽרָבְעָם֙ אֲשֶׁ֣ר חָטָ֔א וַ/אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/016.yaml
  text: And he will give up Israel because of the sins of Jeroboam[a], which he committed and by which he caused Israel to sin.
  footnotes:
  - marker: a
    text: Or 'hand Israel over.' The Hebrew verb is literally 'give,' used here in a judgment context for delivering a people over to disaster or enemies.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서는 여로보암이 저지르고 이스라엘을 죄짓게 한 죄들 때문에 이스라엘을 넘겨주실 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘을 내어주실 것입니다.’ 히브리어 동사는 문자적으로는 ‘주다’이며, 여기서는 심판 문맥에서 백성을 재앙이나 원수에게 넘겨주거나 내주는 뜻으로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֵּן
  english_pob_choice: and he will give up
  chosen_korean: 내어줄 것입니다
  alternatives_korean:
  - 넘겨줄 것입니다
  - 포기할 것입니다
  - 내줄 것입니다
  lexicon: HALOT
  rationale: נתן이 심판 문맥에서 ‘넘겨주다/내주다’의 뜻으로 쓰인 점을 살려, 한국어에서는 자연스럽고 단호한 ‘내어주다’로 옮겼습니다.
- source_word: בִּגְלַל
  english_pob_choice: because of
  chosen_korean: 때문입니다
  alternatives_korean:
  - 으로 말미암아
  - 인하여
  - 때문에
  lexicon: HALOT
  rationale: 원인의 전치를 분명히 드러내는 가장 자연스러운 현대 문장으로 처리했습니다.
- source_word: אֲשֶׁר חָטָא
  english_pob_choice: which he committed
  chosen_korean: 그가 저지른 죄들
  alternatives_korean:
  - 그가 지은 죄들
  - 그가 범한 죄들
  - 그가 죄 지은 것들
  lexicon: HALOT
  rationale: 히브리어 관계절은 여로보암 자신의 실제 행위를 가리키므로, ‘저지른’으로 개인적 책임을 분명히 했습니다.
- source_word: וַאֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  english_pob_choice: and by which he caused Israel to sin
  chosen_korean: 그 죄들로 이스라엘로 죄를 짓게 했기 때문입니다
  alternatives_korean:
  - 그것들로 이스라엘을 죄짓게 했기 때문입니다
  - 그 죄들 때문에 이스라엘을 죄에 빠뜨렸기 때문입니다
  - 그 죄들로 이스라엘이 죄를 짓게 만들었기 때문입니다
  lexicon: HALOT
  rationale: 히필의 사역성을 살려 ‘죄를 짓게 했다’로 옮기되, 원인이 앞의 ‘죄들’임을 드러내기 위해 ‘그 죄들로’라고 했습니다.
theological_decisions:
- issue: 심판의 수여/인도 표현
  chosen_reading: 이스라엘을 내어줄 것입니다
  alternative_readings:
  - 이스라엘을 넘겨줄 것입니다
  - 이스라엘을 넘기실 것입니다
  rationale: 본문은 여호와의 심판 행위를 말하지만, 구체적 역사 도구는 밝히지 않습니다. ‘내어주다’는 심판적 인도/방임의 뉘앙스를 유지하면서 과도한 해석을 피합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 여로보암의 죄와 이스라엘 유도죄를 함께 보존
  chosen_reading: 그가 저지른 죄들이고, 그 죄들로 이스라엘로 죄를 짓게 했기 때문입니다
  alternative_readings:
  - 그가 지은 죄들이고, 그 죄들로 이스라엘을 죄짓게 했기 때문입니다
  - 그가 죄를 지었고 이스라엘도 죄짓게 했기 때문입니다
  rationale: 본문은 여로보암의 개인적 책임과 이스라엘을 죄로 끌어들인 책임을 둘 다 담습니다. 두 요소를 분리해 보존해 책임의 중첩을 약화시키지 않았습니다.
  doctrine_reference: Translation philosophy §3, §5
