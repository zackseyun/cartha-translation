id: 1KI.14.14
reference: 1 Kings 14:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵקִים֩ יְהוָ֨ה ל֥/וֹ מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יַכְרִ֛ית אֶת בֵּ֥ית יָרָבְעָ֖ם זֶ֣ה הַ/יּ֑וֹם וּ/מֶ֖ה גַּם עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/014.yaml
  text: And Yahweh will raise up for himself a king over Israel who will cut off the house of Jeroboam this day[a]. But what? Even now.
  footnotes:
  - marker: a
    text: 'The Hebrew ending is abrupt and difficult: literally, ''and what? even now.'' Some understand it as an exclamation stressing the immediacy of the judgment, such as ''and what? even now!'' or ''but what more? already now.'''
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서는 이스라엘 위에 여로보암의 집을 이 날에 끊어 버릴 왕을 일으키실 것입니다[a]. 그런데 무엇입니까? 바로 지금도.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 끝맺음은 매우 갑작스럽고 난해합니다. 문자적으로는 ‘그리고 무엇? 또한 지금’ 또는 ‘그리고 무엇? 심지어 지금’에 가깝습니다. 일부는 이를 심판이 바로 지금 시작됨을 강조하는 감탄으로, 또는 ‘그뿐만이 아니라, 지금도’라는 뜻으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵקִים
  english_pob_choice: will raise up
  chosen_korean: 일으키셔서
  alternatives_korean:
  - 세우셔서
  - 임명하셔서
  lexicon: HALOT
  rationale: 왕을 역사 속에 등장하게 하시는 하나님의 주권적 행위를 살리기 위해 ‘일으키다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유한 신명(神名)을 직역적 대치어가 아닌 음역으로 드러내는 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֲשֶׁר יַכְרִית אֶת בֵּית יָרָבְעָם
  english_pob_choice: who will cut off the house of Jeroboam
  chosen_korean: 여로보암의 집을 끊어 버리게 하실
  alternatives_korean:
  - 여로보암의 집을 멸하게 하실
  - 여로보암의 집을 잘라 내게 하실
  lexicon: HALOT
  rationale: כרת의 언약적 심판 뉘앙스를 살려 ‘끊어 버리다’로 옮기되, 한국어에서 결과의 강도를 분명히 했습니다.
- source_word: וּ/מֶה גַּם עָֽתָּה־־־
  english_pob_choice: But what? Even now.
  chosen_korean: 그런데 무엇입니까? 이제라도.
  alternatives_korean:
  - 하지만 무엇입니까? 지금도.
  - 그렇다면 무엇입니까? 바로 지금.
  lexicon: HALOT
  rationale: 끝맺음의 단절된 어법을 매끈하게 풀지 않고, 원문의 돌발적·생략된 감탄성을 드러내도록 유지했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 처리
  chosen_reading: 본문의 고유명은 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 신명 처리 원칙에 따라, 제목적 표현으로 대체하지 않고 본문의 고유한 언약 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: 마지막 절의 파편화된 결말 처리
  chosen_reading: ‘그런데 무엇입니까? 이제라도.’로 남겨 해석을 과도하게 확정하지 않았습니다.
  alternative_readings:
  - 그런데 무슨 말입니까? 이제라도.
  - 하지만 무엇입니까? 지금이라도.
  rationale: 히브리어가 의도적으로 난해하고 절단된 형태이므로, 문맥상 가능성을 닫아 버리는 설명적 의역은 피했습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy #3'
