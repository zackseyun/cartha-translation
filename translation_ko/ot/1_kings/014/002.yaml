source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יָרָבְעָ֜ם לְ/אִשְׁתּ֗/וֹ ק֤וּמִי נָא֙ וְ/הִשְׁתַּנִּ֔ית וְ/לֹ֣א יֵֽדְע֔וּ כִּי אתי אֵ֣שֶׁת יָרָבְעָ֑ם וְ/הָלַ֣כְתְּ שִׁלֹ֗ה הִנֵּה שָׁם֙ אֲחִיָּ֣ה הַ/נָּבִ֔יא הֽוּא דִבֶּ֥ר עָלַ֛/י לְ/מֶ֖לֶךְ עַל הָ/עָ֥ם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/002.yaml
  text: Jeroboam said to his wife[a], “Please get up and disguise yourself, so that they will not know that you are the wife of Jeroboam, and go to Shiloh. Behold, Ahijah the prophet is there; he is the one who spoke concerning me[b], that I would be king over this people.”
  footnotes:
  - marker: a
    text: Or, more literally, 'and they will not know'; the Hebrew leaves the subject indefinite.
    reason: lexical_alternative
  - marker: b
    text: Or 'to be king over this people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여로보암이 자기 아내에게 말했습니다. “부디 일어나 변장하여, 사람들이 당신이 여로보암의 아내인 줄 알지 못하도록 하십시오.[a] 그리고 실로로 가십시오. 보십시오, 거기에 아히야 예언자가 있습니다. 그는 내가 이 백성의 왕이 될 것이라고 나에 관하여 말씀한 사람입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘그들이 당신이 여로보암의 아내인 줄 알지 못하도록 하십시오.’ 히브리어는 주어를 불특정하게 둡니다.
    reason: 원문의 불특정 복수 주어를 명시하여 번역의 해석적 보충을 투명하게 밝힙니다.
  - marker: b
    text: 또는 ‘이 백성의 왕이 되리라고.’
    reason: 히브리어 לְמֶלֶךְ의 결과/신분 표현을 간결하게 옮길 수 있는 대안을 제시합니다.
lexical_decisions:
- source_word: קוּמִי נָא
  english_pob_choice: Please get up
  chosen_korean: 부디 일어나
  alternatives_korean:
  - 일어나 주십시오
  - 제발 일어나십시오
  lexicon: HALOT
  rationale: 명령형과 간청의 뉘앙스(נָא)를 함께 살리되, 현대 한국어에서 자연스러운 공손한 요청으로 옮겼습니다.
- source_word: וְהִשְׁתַּנִּית
  english_pob_choice: disguise yourself
  chosen_korean: 변장하십시오
  alternatives_korean:
  - 모습을 바꾸십시오
  - 자신을 알아볼 수 없게 하십시오
  lexicon: HALOT
  rationale: 히트파엘의 자기-변형을 문맥상 가장 직접적으로 드러내는 말로 ‘변장하다’를 택했습니다.
- source_word: וְלֹא יֵדְעוּ
  english_pob_choice: so that they will not know
  chosen_korean: 그러면 사람들이 … 알지 못할 것입니다
  alternatives_korean:
  - 그러면 아무도 … 알지 못할 것입니다
  - 그래서 그들이 … 알지 못할 것입니다
  lexicon: HALOT
  rationale: 히브리어의 주어가 불특정한 점을 살려, 본문은 ‘사람들이’로 자연스럽게 풀되 특정 대상을 과도하게 한정하지 않았습니다.
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 지시·주의 환기 기능을 현대 공용어체로 살리기 위해 ‘보십시오’를 사용했습니다.
- source_word: לְמֶלֶךְ
  english_pob_choice: that I would be king
  chosen_korean: 왕이 되라고
  alternatives_korean:
  - 왕이 되게 하려고
  - 왕이 되리라고
  lexicon: HALOT
  rationale: 여로보암의 왕위 부여를 나타내는 결과/목적 관계를 한국어에서 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 예언 인용의 방향성
  chosen_reading: ‘그는 이 백성 위에 왕이 되라고 나에 관하여 말한 사람입니다’로, 아히야의 발언이 여로보암의 즉위에 관한 예언임을 분명히 했습니다.
  alternative_readings:
  - ‘그는 이 백성 위의 왕이 되라고 나에게 말한 사람입니다’
  - ‘그는 이 백성의 왕이 되라고 나에 관하여 말한 사람입니다’
  rationale: 히브리어의 עָלַי 와 לְמֶלֶךְ 의 관계를 따라, 말의 초점이 ‘나에 관하여’라는 예언의 내용에 있음을 보존했습니다.
  doctrine_reference: 왕권에 대한 예언적 선언(열왕기상 11–14장 문맥)
- issue: 대명사 불특정성
  chosen_reading: ‘사람들이 … 알지 못할 것입니다’로 옮겨, 주어를 특정하지 않은 원문의 여지를 남겼습니다.
  alternative_readings:
  - ‘아무도 … 알지 못할 것입니다’
  - ‘그들이 … 알지 못할 것입니다’
  rationale: 영어 POB의 audit note처럼 히브리어는 주어를 불특정하게 두므로, 한국어도 그 모호성을 과도하게 해소하지 않았습니다.
  doctrine_reference: 원문 문법 보존의 번역 원칙
