  source_fidelity: 전반적으로 원문의 명령 연쇄와 불특정 복수 주어를 잘 반영합니다. 그러나 마지막 절의 ‘왕이 되라고 나에 관하여 말한’은 히브리어가 말하는 예언의 내용을 ‘명령’처럼 바꾸며, 한국어 문장 구조도 부자연스럽습니다. 이는 여로보암이 왕이 될 것이라는 예언으로 옮겨야 합니다.
  naturalness: 합쇼체는 일관되지만, ‘그러면’보다 목적을 나타내는 ‘…알지 못하도록’이 원문의 문맥에 더 맞습니다. 마지막 절은 ‘내가 … 왕이 될 것이라고 나에 관하여 말씀한’으로 고치면 원문의 강조와 현대 한국어의 자연스러움을 함께 살릴 수 있습니다.
  terminology: 여로보암, 실로, 아히야, 예언자, 왕, 백성은 적절합니다. ‘이 백성 위에 왕’은 한국어에서 다소 직역투이므로 ‘이 백성의 왕’으로 옮기는 것이 자연스럽고 원뜻을 보존합니다.
