revisions:
- from: 그들도 자기들을 위해 산당과 기둥들, 아세라 목상들을 만들었습니다. 모든 높은 언덕 위와 모든 푸른 나무 아래에 말입니다.[a]
  to: 그들도 모든 높은 언덕 위와 모든 푸른 나무 아래에 자기들을 위하여 산당들과 기둥들과 아세라 상들을 세웠습니다.[a]
  rationale: 장소구를 동사와 직접 연결하여 원문의 수식 관계와 반복 병렬을 보존했습니다. ‘세웠습니다’는 제의 시설물의 설치를 자연스럽게 포괄합니다. 아세림은 물체로 번역하되, ‘목상’이 암시하는 구체적 형태는 본문에서 강제하지 않고 각주에 대안을 남겼습니다.
  reviewer_model: gpt-5.6-terra
