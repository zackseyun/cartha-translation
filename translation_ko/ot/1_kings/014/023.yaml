  text: וַ/יִּבְנ֨וּ גַם הֵ֧מָּה לָ/הֶ֛ם בָּמ֥וֹת וּ/מַצֵּב֖וֹת וַ/אֲשֵׁרִ֑ים עַ֚ל כָּל גִּבְעָ֣ה גְבֹהָ֔ה וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/023.yaml
  text: They too built for themselves high places[a], pillars, and Asherah poles on every high hill and under every green tree.
  footnotes:
  - marker: a
    text: Or 'Asherim' or 'sacred poles'; the Hebrew term refers to cult objects associated with Asherah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들도 모든 높은 언덕 위와 모든 푸른 나무 아래에 자기들을 위하여 산당들과 기둥들과 아세라 상들을 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아세라 상들’은 히브리어 ‘아세림’을 옮긴 것입니다. 아세라와 관련된 제의 물체를 가리키며, ‘아세림’ 또는 ‘성스러운 기둥들’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  english_pob_choice: built
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 세웠습니다
  - 지었습니다
  lexicon: HALOT
  rationale: 건축물뿐 아니라 예배용 설치물을 가리키므로, 한국어에서는 ‘짓다’보다 넓게 포괄하는 ‘만들다’가 문맥에 가장 자연스럽습니다.
- source_word: בָּמוֹת
  english_pob_choice: high places
  chosen_korean: 산당
  alternatives_korean:
  - 높은 곳
  - 산당들
  lexicon: HALOT
  rationale: 이 용어는 이스라엘/유다의 우상 숭배 장소를 가리키는 관용적 종교 용어이므로, 한국어 성경 전통에서 문맥상 가장 식별력이 높은 ‘산당’을 유지했습니다.
- source_word: מַצֵּבוֹת
  english_pob_choice: pillars
  chosen_korean: 기둥들
  alternatives_korean:
  - 세운 돌들
  - 성석들
  lexicon: HALOT
  rationale: 문맥상 우상숭배에 쓰인 세운 물체를 뜻하므로 ‘기둥들’이 가장 직접적이며, 뒤의 아세라 목상과 함께 열거 구조도 살립니다.
- source_word: אֲשֵׁרִים
  english_pob_choice: Asherah poles
  chosen_korean: 아세라 목상들
  alternatives_korean:
  - 아세라 상들
  - 아세라 목들
  - 아세림
  lexicon: HALOT
  rationale: 영어 POB의 판단처럼 신격 자체보다 아세라와 관련된 제의적 물체를 가리키므로, 의미를 분명히 드러내는 ‘목상들’을 택했습니다.
theological_decisions:
- issue: 아세라 항목을 신격 명칭으로 둘지, 제의 물체로 둘지
  chosen_reading: 제의 물체로 이해하여 ‘아세라 목상들’로 번역했습니다.
  alternative_readings:
  - 아세림
  - 아세라들
  - 아세라 상들
  rationale: 산당과 기둥들과 병렬된 목록 안에서, כאן의 אֲשֵׁרִים은 여신 자체보다 예배용 조형물/기물로 읽는 것이 더 자연스럽습니다.
  doctrine_reference: 우상숭배 관련 본문 해석의 문맥 우선 원칙
- issue: 문장 끝의 장소 보어를 한국어에서 어떻게 연결할지
  chosen_reading: ‘…아래에 말입니다’로 마무리해 히브리어의 반복적 장소 구문을 보존했습니다.
  alternative_readings:
  - …아래에
  - …아래에서
  rationale: 원문은 ‘모든 높은 언덕 위’와 ‘모든 푸른 나무 아래’의 병렬을 강조하므로, 한국어에서도 말미에 보충해 구조를 분명히 했습니다.
  doctrine_reference: 히브리어 평행법 보존 원칙
