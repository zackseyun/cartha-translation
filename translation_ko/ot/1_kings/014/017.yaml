reference: 1 Kings 14:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּ֨קָם֙ אֵ֣שֶׁת יָרָבְעָ֔ם וַ/תֵּ֖לֶךְ וַ/תָּבֹ֣א תִרְצָ֑תָ/ה הִ֛יא בָּאָ֥ה בְ/סַף הַ/בַּ֖יִת וְ/הַ/נַּ֥עַר מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/017.yaml
  text: Then Jeroboam’s wife arose and went and came to Tirzah. As she came to the threshold of the house[a], the boy died.
  footnotes:
  - marker: a
    text: Or “when she came to the threshold of the house.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 여로보암의 아내가 일어나 길을 떠나 디르사에 이르렀습니다. 그녀가 집의 문지방에 이르렀을 때[a], 그 소년이 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그녀가 집의 문지방에 이르렀을 때”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  english_pob_choice: arose
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 일어났다가
  - 일어났습니다
  lexicon: HALOT
  rationale: 서사 진행의 첫 동작을 자연스러운 현대 한국어로 살리되, 단순히 ‘나갔다’보다 원문의 קום 동작을 드러내기 위해 ‘일어나다’를 선택했습니다.
- source_word: וַתֵּלֶךְ / וַתָּבֹא
  english_pob_choice: went / came to Tirzah
  chosen_korean: 길을 떠나 디르사에 이르렀습니다
  alternatives_korean:
  - 가서 디르사에 도착했습니다
  - 디르사에 갔습니다
  lexicon: HALOT
  rationale: הלך와 בוא의 연속된 이동을 한국어 서사 흐름에 맞게 한 문장으로 묶되, 목적지 도달을 분명히 하기 위해 ‘이르렀습니다’를 사용했습니다.
- source_word: בְסַף הַבַּיִת
  english_pob_choice: the threshold of the house
  chosen_korean: 집의 문지방
  alternatives_korean:
  - 집의 문턱
  - 집의 출입문
  lexicon: HALOT
  rationale: סַף는 ‘문지방/문턱’이 가장 정확하므로, 한국어에서 더 구체적이고 표준적인 ‘문지방’을 택했습니다.
- source_word: וְהַנַּעַר
  english_pob_choice: the boy
  chosen_korean: 그 소년
  alternatives_korean:
  - 그 아이
  - 그 아이들
  lexicon: HALOT
  rationale: 문맥상 여로보암의 아들을 가리키므로, 자연스러운 지시어 ‘그’와 함께 연령감을 살린 ‘소년’으로 옮겼습니다.
theological_decisions:
- issue: 문장 시작의 시간관계와 ‘일어남/이르렀을 때’의 처리
  chosen_reading: ‘일어나 길을 떠나 디르사에 이르렀습니다. 그녀가 집의 문지방에 이르렀을 때…’로, 서술 순서와 동시 진행을 함께 드러냈습니다.
  alternative_readings:
  - ‘일어나서 디르사에 갔습니다. 그녀가 집 문지방에 왔을 때…’
  - ‘일어나 디르사에 도착했는데, 집 문지방에 이르자…’
  rationale: 히브리어의 연속 동작과 절단면 같은 순간 전환을 한국어에서도 유지해야 하므로, 도착 장면과 죽음의 순간을 너무 매끈하게 합치지 않고 병행적으로 제시했습니다.
  doctrine_reference: 서사체의 시점 유지와 사건의 동시성 보존
- issue: 나ער의 죽음을 사건으로 표현
  chosen_reading: ‘그 소년이 죽었습니다’로 사건 발생을 직접적으로 번역했습니다.
  alternative_readings:
  - ‘그 소년은 죽어 있었습니다’
  - ‘그 소년은 이미 죽어 있었습니다’
  rationale: 원문의 מֵת는 이 순간 죽음이 발생했다는 서술적·사건적 의미가 강하므로, 상태 진술보다 사건 진술이 더 적절합니다.
  doctrine_reference: 히브리어 완료형의 내러티브 기능
