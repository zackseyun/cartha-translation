base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/029.yaml
  text: Now the rest of the acts of Rehoboam[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
  footnotes:
  - marker: a
    text: Or 'the annals of the kings of Judah.' The Hebrew phrase rendered 'the Chronicles' refers to a royal record of events.
    reason: lexical_alternative
translation:
  language: ko
  text: 르호보암의 나머지 행적과 그가 한 모든 일은 유다 왕들의 연대기 책[a]에 기록되어 있지 않습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘유다 왕들의 역대기 책’입니다. 여기서 ‘연대기’는 성경의 책명이 아니라 왕실의 사건 기록을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  english_pob_choice: Now the rest of the acts
  chosen_korean: 나머지 행적
  alternatives_korean:
  - 나머지 일들
  - 남은 행위들
  - 남은 행적들
  lexicon: HALOT
  rationale: דִּבְרֵי는 이 왕실 공식문맥에서 단순한 ‘말’이 아니라 왕의 공적 기록을 가리키므로, ‘행적’이 한국어에서 가장 자연스럽게 그 범위를 살립니다.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  english_pob_choice: and all that he did
  chosen_korean: 그가 한 모든 일
  alternatives_korean:
  - 그가 행한 모든 것
  - 그가 한 모든 행위
  - 그가 이룬 모든 일
  lexicon: HALOT
  rationale: עָשָׂה의 포괄성을 살리면서도, 열왕기식 왕 기록의 문체에 맞게 과도하게 도덕화하지 않는 표현으로 옮겼습니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  english_pob_choice: the Book of the Chronicles
  chosen_korean: 역대기 책
  alternatives_korean:
  - 역대지
  - 역사 기록 책
  - 역대의 기록책
  lexicon: HALOT
  rationale: 이 공식 인용구는 왕조 연대기/실록을 가리키므로, 전통적 경전명인 역대기와 구별되는 ‘책’의 문서성을 살려 옮겼습니다.
- source_word: לְמַלְכֵי יְהוּדָה
  english_pob_choice: of the Kings of Judah
  chosen_korean: 유다 왕들의
  alternatives_korean:
  - 유다 왕들의 것인
  - 유다 왕들에 관한
  - 유다의 왕들에 속한
  lexicon: HALOT
  rationale: ל의 소유/귀속 관계를 한국어 소유격으로 자연스럽게 처리해, 앞의 ‘역대기 책’과 결합된 문서 제목임을 드러냈습니다.
