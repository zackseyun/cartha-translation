reference: 1 Kings 14:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְכִ֞י אִמְרִ֣י לְ/יָרָבְעָ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֛עַן אֲשֶׁ֥ר הֲרִימֹתִ֖י/ךָ מִ/תּ֣וֹךְ הָ/עָ֑ם וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/007.yaml
  text: 'Go and say to Jeroboam[a], ‘Thus says Yahweh[b], the God of Israel: Because I raised you up from among the people and made you ruler over my people Israel,’'
  footnotes:
  - marker: a
    text: Or “I exalted you” for “I raised you up.”
    reason: lexical_alternative
  - marker: b
    text: Or “appointed you leader” for “made you ruler.” The Hebrew literally says “gave you as ruler.”
    reason: lexical_alternative
translation:
  language: ko
  text: 가서 여로보암에게 이렇게 말하십시오. “이스라엘의 하나님 야훼께서 이렇게 말씀하십니다. ‘내가 너를 백성 가운데서 높여 세우고[a] 내 백성 이스라엘 위에 통치자로 삼았기[b] 때문에,’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “높이셨다.” 히브리어는 백성 가운데서 지위 있게 세우셨다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 “통치자로 주었다”입니다. נָגִיד는 여기서 공적 권위를 가진 지도자 또는 통치자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי / אִמְרִי
  english_pob_choice: Go and say
  chosen_korean: 가서 … 말하십시오
  alternatives_korean:
  - 가서 … 말씀하십시오
  - 가서 … 전하십시오
  lexicon: HALOT
  rationale: 전달 명령형의 연쇄를 한국어로 자연스럽게 옮기되, 예언 메시지 전달 공식의 공적 어조를 살리기 위해 ‘말하십시오’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 테트라그라마톤을 제목이 아니라 고유한 이름으로 처리하는 프로젝트 기준에 따라 ‘야훼’를 사용했습니다.
- source_word: הֲרִימֹתִיךָ
  english_pob_choice: I raised you up
  chosen_korean: 내가 너를 백성 가운데서 들어 올려
  alternatives_korean:
  - 내가 너를 들어 올려
  - 내가 너를 높여
  lexicon: HALOT
  rationale: 단순한 ‘임명’보다, 낮은 자리에서 높여 세우는 동사의 비유적·정치적 힘을 살리기 위해 ‘들어 올려’로 옮겼습니다.
- source_word: וָאֶתֶּנְךָ נָגִיד
  english_pob_choice: and made you ruler
  chosen_korean: 통치자로 삼았기 때문에
  alternatives_korean:
  - 지도자로 삼았기 때문에
  - 왕으로 세웠기 때문에
  lexicon: HALOT
  rationale: נָגִיד의 공적 통치권을 현대 한국어에서 가장 분명하게 드러내는 표현으로 ‘통치자’를 택했습니다. ‘삼았기 때문에’는 히브리어의 ‘주다’+직함 구조를 자연스럽게 반영합니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 한국어 처리
  chosen_reading: ‘야훼’로 직역하여 고유 이름성을 유지합니다.
  alternative_readings:
  - ‘주님’으로 번역
  - ‘여호와’로 음역
  rationale: 본문은 하나님을 일반 호칭이 아니라 언약의 이름으로 부르므로, 이름 자체를 드러내는 것이 본문의 직접성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 예언자 전달문에서의 존칭
  chosen_reading: 직접 인용 안의 하나님의 말씀은 합쇼체를 유지합니다.
  alternative_readings:
  - 명령문을 평서형으로 완화
  - 더 경어적인 종교어로 조정
  rationale: 예언 신탁의 공식성과 하나님께 대한 공손한 직접화법을 함께 보존하기 위해 외부 서술은 합쇼체, 인용문 내부는 말씀체를 유지했습니다.
  doctrine_reference: Korean target style guidance
