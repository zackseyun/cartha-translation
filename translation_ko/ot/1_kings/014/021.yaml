id: 1KI.14.21
reference: 1 Kings 14:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/רְחַבְעָם֙ בֶּן שְׁלֹמֹ֔ה מָלַ֖ךְ בִּֽ/יהוּדָ֑ה בֶּן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָ/עַמֹּנִֽית־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/021.yaml
  text: Now Rehoboam the son of Solomon reigned in Judah[a]. Rehoboam was forty-one years old when he became king, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite woman.
  footnotes:
  - marker: a
    text: Or 'over Judah' for 'in Judah.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''to put his name there,'' a covenantal expression for the place specially associated with the LORD’s presence and worship.'
    reason: cultural_note
translation:
  language: ko
  text: 솔로몬의 아들 르호보암이 유다에서 다스렸습니다[a]. 르호보암은 왕이 되었을 때 마흔한 살이었고, 예루살렘에서 십칠 년 동안 다스렸는데, 그곳은 야훼께서 이스라엘의 모든 지파 가운데에서 자신의 이름을 두시려고 택하신 도시였습니다[b]. 그의 어머니의 이름은 암몬 출신 여인 나아마였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다를 다스렸습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 이름을 두시려고’라고 하며, 하나님의 임재와 예배가 특별히 연결된 언약적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: מָלַךְ / בְּמָלְכוֹ
  english_pob_choice: reigned / when he became king
  chosen_korean: 다스렸습니다 / 왕이 되었을 때
  alternatives_korean:
  - 왕 노릇했습니다 / 즉위했을 때
  - 통치했습니다 / 즉위한 때
  lexicon: HALOT
  rationale: 첫 번째 מָלַךְ는 왕의 통치를 자연스럽게 나타내는 ‘다스리다’로, בְּמָלְכוֹ는 즉위 시점을 드러내는 ‘왕이 되었을 때’로 구분해 연령과 재위 기간을 혼동하지 않게 했습니다.
- source_word: בִּ/יהוּדָה
  english_pob_choice: in Judah
  chosen_korean: 유다에서
  alternatives_korean:
  - 유다 안에서
  - 유다 위에서
  lexicon: HALOT
  rationale: 히브리어 전치사 ב의 기본값을 살려 ‘유다에서’로 옮겼고, 왕권 방향을 덧붙여 의미를 좁히지 않았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥의 신적 이름 יְהוָה는 프로젝트 기본값에 따라 고유명사인 ‘야훼’로 옮겨, 호칭으로 바꾸지 않았습니다.
- source_word: לָשׂוּם אֶת שְׁמוֹ שָׁם
  english_pob_choice: to put his name there
  chosen_korean: 자기 이름을 두시려고
  alternatives_korean:
  - 그의 이름을 두시려고
  - 그 이름을 그곳에 두시려고
  lexicon: HALOT
  rationale: 직역적 관용구인 ‘이름을 두다’를 살리되, 한국어에서 자연스럽게 목적을 나타내는 ‘-시려고’를 사용해 성전/예배 장소를 가리키는 언약적 표현을 보존했습니다.
- source_word: הָעַמֹּנִית
  english_pob_choice: the Ammonite woman
  chosen_korean: 암몬 여인
  alternatives_korean:
  - 암몬 사람 여자
  - 암몬 사람인 여자
  lexicon: HALOT
  rationale: 여성형 민족형용사를 한국어에서 자연스럽게 드러내기 위해 ‘암몬 여인’으로 옮겼습니다. '암몬 여자'보다 인명 뒤의 친족/출신 표지로 더 매끄럽습니다.
theological_decisions:
- issue: יהוה의 번역과 왕실/언약 문맥의 명칭 유지
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절의 핵심은 예루살렘이 하나님의 선택과 이름 두심의 장소라는 점이므로, 본문 속 신적 이름은 제목화하지 않고 고유명사 ‘야훼’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
