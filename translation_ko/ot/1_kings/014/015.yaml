revisions:
- from: 야훼께서 이스라엘을 물속에서 흔들리는 갈대처럼 치실 것입니다.[a] 그는 이 선한 땅, 곧 그들의 조상들에게 주신 땅에서 이스라엘을 뽑아내시고, 강 건너편으로 흩으실 것입니다.[a] 그들이 자기 아세라 상들[b]을 만들어 야훼를 격노하게 했기 때문입니다.
  to: 야훼께서는 물속의 갈대가 흔들리듯 이스라엘을 치실 것이며, 그들의 조상들에게 주신 이 좋은 땅에서 이스라엘을 뽑아내시고 그 강[a] 너머로 흩으실 것입니다. 그들이 자기 아세림[b]을 만들어 야훼를 격노하게 했기 때문입니다.
  rationale: ‘그 강’에 [a]를 배치하여 각주 연결을 바로잡았습니다. 또한 아세라 관련 제의 물체의 구체적 형태를 본문에서 단정하지 않도록 ‘아세림’으로 옮기고 설명을 각주에 남겼습니다. 나머지 핵심 표현은 원문의 어순과 심판 이미지, 현대 표준 한국어 합쇼체를 고려하여 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:50:48Z'
