  source_fidelity: 히브리어의 미래적 심판 진술, 갈대의 비유, 땅에서 뽑아 냄, ‘그 강’ 너머로의 흩음, 그리고 아세림을 만든 까닭을 전반적으로 충실히 반영합니다. 다만 [a] 각주 표지가 ‘강’이 아니라 첫 문장의 ‘이스라엘’에 붙어 있어, 원문의 ‘그 강’에 관한 주석 연결이 잘못되었습니다. 또한 אֲשֵׁרֵיהֶם의 정확한 물질적 형태가 논쟁적이므로 본문 ‘아세라 상들’은 ‘상’으로 의미를 과도하게 한정합니다.
  naturalness: 합쇼체는 일관되어 있으며 대체로 자연스럽습니다. ‘물속에서 흔들리는 갈대처럼’도 이해되지만, ‘물속의 갈대가 흔들리듯’이 비유의 문장 연결을 더 자연스럽게 합니다. ‘강 건너편으로’는 가능하나 ‘그 강 너머로’가 정관사와 관용적 지시를 더 잘 보존합니다.
  terminology: ‘야훼’는 제공된 POB 방침과 일치합니다. אֲשֵׁרֵיהֶם은 아세라와 관련된 제의 물체를 가리키지만 정확한 형태가 확정되지 않으므로, 본문에서는 음역 복수형 ‘아세림’을 사용하고 각주에서 설명하는 편이 안전합니다.
