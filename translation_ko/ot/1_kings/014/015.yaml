  text: וְ/הִכָּ֨ה יְהוָ֜ה אֶת יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֨ר יָנ֣וּד הַ/קָּנֶה֮ בַּ/מַּיִם֒ וְ/נָתַ֣שׁ אֶת יִשְׂרָאֵ֗ל מֵ֠/עַל הָ/אֲדָמָ֨ה הַ/טּוֹבָ֤ה הַ/זֹּאת֙ אֲשֶׁ֤ר נָתַן֙ לַ/אֲב֣וֹתֵי/הֶ֔ם וְ/זֵרָ֖/ם מֵ/עֵ֣בֶר לַ/נָּהָ֑ר יַ֗עַן אֲשֶׁ֤ר עָשׂוּ֙ אֶת אֲשֵׁ֣רֵי/הֶ֔ם מַכְעִיסִ֖ים אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/015.yaml
  text: And Yahweh will strike Israel[a], as a reed sways in the water, and he will uproot Israel from this good land that he gave to their fathers, and scatter them beyond the River, because they made their Asherim[b], provoking Yahweh.
  footnotes:
  - marker: a
    text: Or 'beyond the Euphrates'; in this context 'the River' refers to the Euphrates.
    reason: cross_reference
  - marker: b
    text: Hebrew 'their Asherim'; that is, cult objects associated with the goddess Asherah, often understood as wooden poles or images.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이스라엘을 물속에서 흔들리는 갈대처럼 치실 것입니다.[a] 그는 이 선한 땅, 곧 그들의 조상들에게 주신 땅에서 이스라엘을 뽑아내시고, 강 건너편으로 흩으실 것입니다.[a] 그들이 자기 아세라 상들[b]을 만들어 야훼를 격노하게 했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유브라데 강 너머로’. 이 문맥에서 ‘강’은 유브라데 강을 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 히브리어 ‘그들의 아세라들’; 곧 아세라 여신과 관련된 제의 물체로, 흔히 나무 기둥이나 형상으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문이 여호와의 고유명사 형태를 쓰므로, 본문에서는 관용적 대치어가 아니라 음역형인 ‘야훼’를 사용해 이름의 직접성을 살렸습니다.
- source_word: כַּאֲשֶׁר יָנוּד הַקָּנֶה בַּמַּיִם
  english_pob_choice: as a reed sways in the water
  chosen_korean: 물속에서 흔들리는 갈대처럼
  alternatives_korean:
  - 물속에서 갈대가 흔들리듯
  - 물에서 흔들리는 갈대처럼
  lexicon: HALOT
  rationale: 비유의 핵심은 불안정하게 흔들리는 움직임이므로, ‘흔들리는 갈대처럼’으로 자연스럽게 살렸습니다.
- source_word: וְנָתַשׁ
  english_pob_choice: and he will uproot
  chosen_korean: 뽑아내시고
  alternatives_korean:
  - 뿌리째 뽑으시고
  - 뽑아 버리시고
  lexicon: HALOT
  rationale: 문맥상 땅에서의 제거를 가리키므로 ‘뽑아내시고’로 옮겨, 심판과 추방의 이미지를 유지했습니다.
- source_word: מֵעֵבֶר לַנָּהָר
  english_pob_choice: beyond the River
  chosen_korean: 강 건너편으로
  alternatives_korean:
  - 강 저편으로
  - 유브라데 강 건너편으로
  lexicon: HALOT
  rationale: 본문의 표현은 ‘the River’이지만, 한국어 본문에서는 자연스러운 표현을 우선해 ‘강 건너편’으로 옮기고, 주석에서 역사적 지시 대상을 보완합니다.
- source_word: עָשׂוּ אֶת אֲשֵׁרֵיהֶם
  english_pob_choice: they made their Asherim
  chosen_korean: 자기 아세라 상들
  alternatives_korean:
  - 자기 아세라들
  - 아세림
  lexicon: HALOT
  rationale: אֲשֵׁרִים은 아세라와 관련된 우상적 제의 물체를 가리키므로, 의미를 드러내는 ‘아세라 상들’을 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 본문에서는 ‘야훼’를 사용해 신적 이름을 그대로 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 구절은 하나님의 이름이 직접 등장하므로, 칭호로 대치하기보다 고유명을 보존하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘the River’의 지시 대상
  chosen_reading: 본문은 ‘강 건너편’으로 번역하고, 각주로 유브라데 강을 밝힙니다.
  alternative_readings:
  - 유브라데 강 너머로
  - 강 너머로
  rationale: 히브리어의 관용 표현을 지나치게 설명적으로 풀지 않으면서도, 현대 독자가 역사적 지시 대상을 이해할 수 있게 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
