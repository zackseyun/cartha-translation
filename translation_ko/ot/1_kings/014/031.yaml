base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/031.yaml
  text: And Rehoboam slept with his fathers and was buried with his fathers in the city of David[a]. And his mother's name was Naamah the Ammonite[b]. And Abijam his son reigned in his place.
  footnotes:
  - marker: a
    text: Or 'Naamah the Ammonite.' The Hebrew uses a feminine gentilic, explicitly identifying her as an Ammonite woman.
    reason: lexical_alternative
  - marker: b
    text: Abijam is called Abijah in some other passages; this verse specifically reads 'Abijam.'
    reason: alternative_reading
translation:
  language: ko
  text: 르호보암이 그의 조상들과 함께 잠들었고, 다윗 성에 그의 조상들과 함께 장사되었습니다. 그의 어머니의 이름은 암몬 사람 나아마였습니다.[a] 그의 아들 아비얌이 그의 뒤를 이어 왕이 되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여성형 민족명을 사용하여 나아마가 암몬 사람 여성임을 분명히 밝힙니다.
    reason: source_note
  - marker: b
    text: 아비얌은 다른 본문들에서는 아비야로도 불리지만, 이 구절의 히브리어 형태는 아비얌입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 잠들고
  alternatives_korean:
  - 죽고
  - 누워
  lexicon: HALOT
  rationale: 왕의 죽음을 나타내는 관용구를 한국어에서도 직접 살리기 위해 '잠들다'를 사용했습니다. 이는 단순한 '죽다'보다 서술의 공식성과 완곡성을 함께 보존합니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 이 표현은 왕조적 장례/죽음 공식을 가리키므로, 문맥에 맞게 '조상들'로 옮겨 한국어에서 자연스럽게 유지했습니다.
- source_word: הָעַמֹּנִית
  english_pob_choice: the Ammonite
  chosen_korean: 암몬 사람 여인
  alternatives_korean:
  - 암몬 여인
  - 암몬 사람
  lexicon: HALOT
  rationale: 히브리어 여성형 민족표지를 드러내기 위해 성별을 분명히 한 '암몬 사람 여인'으로 옮겼습니다. 이는 POB의 주석적 지적과도 맞닿아 있습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: reigned in his place
  chosen_korean: 그를 대신하여 왕이 되었습니다
  alternatives_korean:
  - 그의 자리에 왕이 되었습니다
  - 그를 대신해 다스렸습니다
  lexicon: HALOT
  rationale: 왕위 승계 관용구를 현대 한국어로 자연스럽게 풀면서도, 단순한 '통치하다'보다 왕위 계승의 의미가 분명히 드러나도록 했습니다.
theological_decisions:
- issue: 왕의 죽음 서술을 '잠들다'로 유지할지 여부
  chosen_reading: 직역적 공식성을 살려 '잠들고'를 유지했습니다.
  alternative_readings:
  - 죽고
  - 세상을 떠나고
  rationale: 이 본문은 단순 사망 통보가 아니라 왕조 연대기 공식이므로, 히브리어 관용을 보존하는 것이 본문 양식을 더 정확히 드러냅니다.
  doctrine_reference: 구약 서사체의 관용적 죽음 표현
