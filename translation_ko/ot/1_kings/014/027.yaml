id: 1KI.14.27
reference: 1 Kings 14:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/מֶּ֤לֶךְ רְחַבְעָם֙ תַּחְתָּ֔/ם מָגִנֵּ֖י נְחֹ֑שֶׁת וְ/הִפְקִ֗יד עַל יַד֙ שָׂרֵ֣י הָ/רָצִ֔ים הַ/שֹּׁ֣מְרִ֔ים פֶּ֖תַח בֵּ֥ית הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/027.yaml
  text: So King Rehoboam made bronze shields in their place and committed them into the hand of the commanders of the runners[b][a], who guarded the entrance of the king’s house.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'the captains of the guard'; the Hebrew is literally 'the commanders of the runners,' likely a royal bodyguard or courier corps.
    reason: lexical_alternative
  - marker: b
    text: '''The king’s house'' refers to the royal palace.'
    reason: cultural_note
translation:
  language: ko
  text: 르호보암 왕은 그것들을 대신하여 놋 방패들을 만들고, 왕의 집[b] 입구를 지키는 달리는 자들의 지휘관들에게[a] 그것들을 맡겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘달리는 자들’이며, 왕실 경호대나 전령대일 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘왕의 집’은 여기서 왕궁을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: made
  chosen_korean: 만들고
  alternatives_korean:
  - 제작하고
  - 지어
  lexicon: HALOT
  rationale: 서술문맥의 עשה는 단순한 제작 행위로 읽히므로, 현대 한국어에서 가장 자연스럽고 직접적인 ‘만들다’로 옮겼습니다.
- source_word: מָגִנֵּי נְחֹשֶׁת
  english_pob_choice: bronze shields
  chosen_korean: 놋 방패들
  alternatives_korean:
  - 청동 방패들
  - 구리 방패들
  lexicon: HALOT
  rationale: נְחֹשֶׁת은 문맥상 청동/놋을 가리킬 수 있으나, 한국어 성경 전통과 고대 금속기물의 자연스러운 표현을 살려 ‘놋’을 택했습니다.
- source_word: וְהִפְקִיד עַל יַד
  english_pob_choice: committed them into the hand of
  chosen_korean: 맡겼습니다
  alternatives_korean:
  - 그 손에 넘겼습니다
  - 그 책임 아래 두었습니다
  lexicon: HALOT
  rationale: 히필 פקד와 관용구 עַל יַד는 어떤 것을 누군가의 관리와 책임 아래 두는 뜻이므로, 한국어에서는 ‘맡기다’가 의미를 가장 간명하게 전달합니다.
- source_word: שָׂרֵי הָרָצִים
  english_pob_choice: the commanders of the runners
  chosen_korean: 달리는 자들의 지휘관들
  alternatives_korean:
  - 경호병들의 지휘관들
  - 전령들의 지휘관들
  lexicon: HALOT
  rationale: POB가 원문 투명성을 위해 ‘runners’를 직역했으므로, 여기서도 해석을 과도하게 좁히지 않고 ‘달리는 자들’로 유지했습니다.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  english_pob_choice: the entrance of the king’s house
  chosen_korean: 왕의 집 입구
  alternatives_korean:
  - 왕궁의 입구
  - 왕의 집의 입구
  lexicon: HALOT
  rationale: בֵּית הַמֶּלֶךְ는 문맥상 왕궁을 뜻하지만, 원문 구조를 드러내기 위해 ‘왕의 집’을 기본으로 두고 ‘입구’와 연결했습니다.
theological_decisions:
- issue: שָׂרֵי הָרָצִים의 기능을 과도하게 해석할지 여부
  chosen_reading: 본문의 표면 의미를 따라 ‘달리는 자들의 지휘관들’로 두어, 경호대/전령대 여부를 본문 밖으로 단정하지 않았습니다.
  alternative_readings:
  - ‘호위대 대장들’
  - ‘경호병의 지휘관들’
  rationale: 해당 표현은 왕실 조직을 가리키지만 정확한 현대 직무명은 문맥상 추정이므로, 본문이 확실히 말하는 범위만 번역했습니다.
  doctrine_reference: 원문 투명성 원칙
