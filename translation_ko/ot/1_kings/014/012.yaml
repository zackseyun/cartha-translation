language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַ֥תְּ ק֖וּמִי לְכִ֣י לְ/בֵיתֵ֑/ךְ בְּ/בֹאָ֥ה רַגְלַ֛יִ/ךְ הָ/עִ֖ירָ/ה וּ/מֵ֥ת הַ/יָּֽלֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/012.yaml
  text: But as for you[a], arise, go to your house. When your feet enter the city, the child will die.
  footnotes:
  - marker: a
    text: Literally, 'when your feet enter the city.' The Hebrew uses 'your feet' idiomatically to mark the moment of arrival.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신은 일어나서 당신의 집으로 가십시오. 당신의 발이 성에 들어가는 순간, 그 아이는 죽을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 발이 성에 들어갈 때’입니다. 히브리어는 도착의 순간을 ‘당신의 발’이라는 관용구로 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתְּ
  english_pob_choice: But as for you
  chosen_korean: 그러나 당신은
  alternatives_korean:
  - 그리고 당신은
  - 이제 당신은
  lexicon: HALOT
  rationale: 접속사 וְ와 여성 2인칭 강조형은 단순한 연결보다 대조적 전환을 드러내므로, 앞선 상황과 구분되는 지시를 살려 ‘그러나 당신은’으로 옮겼습니다.
- source_word: ק֖וּמִי
  english_pob_choice: arise
  chosen_korean: 일어나서
  alternatives_korean:
  - 일어나십시오
  - 으러나
  lexicon: HALOT
  rationale: קום의 명령형은 예언적 지시의 단호함을 가지므로, 문어체이면서도 자연한 ‘일어나서’로 대응했습니다.
- source_word: לְכִ֣י לְ/בֵיתֵ֑/ךְ
  english_pob_choice: go to your house
  chosen_korean: 당신의 집으로 가십시오
  alternatives_korean:
  - 당신의 집으로 떠나십시오
  - 집으로 돌아가십시오
  lexicon: HALOT
  rationale: בַּיִת의 기본 의미를 살리되 한국어에서 가장 자연한 목적지 표현인 ‘집으로’와 명령형 ‘가십시오’를 사용했습니다.
- source_word: בְּ/בֹאָ֥ה רַגְלַ֛יִ/ךְ הָ/עִ֖ירָ/ה
  english_pob_choice: When your feet enter the city
  chosen_korean: 당신의 발이 성에 들어가는 순간
  alternatives_korean:
  - 당신의 발이 성에 들어갈 때
  - 당신이 성에 들어가면
  lexicon: HALOT
  rationale: 히브리어의 ‘당신의 발’이라는 관용적 도착 표현을 그대로 살리면서, 시간적 즉시성을 분명히 하기 위해 ‘들어가는 순간’으로 옮겼습니다.
- source_word: הַ/יָּֽלֶד
  english_pob_choice: the child
  chosen_korean: 그 아이
  alternatives_korean:
  - 그 아이가
  - 그 어린아이는
  lexicon: HALOT
  rationale: יֶלֶד는 문맥상 성별보다 대상 아동 자체를 가리키므로, 자연스러운 한국어 ‘그 아이’로 옮겼습니다.
theological_decisions:
- issue: 예언적 미래 시제 표현
  chosen_reading: 예언적 선언으로서 ‘죽을 것입니다’라고 번역했습니다.
  alternative_readings:
  - 죽습니다
  - 죽게 될 것입니다
  rationale: 히브리어 완료형과 접속사는 여기서 미래 결과를 예고하는 예언적 용법이므로, 단순 현재형보다 예고성과 단호함이 드러나는 미래형이 적절합니다.
  doctrine_reference: 예언적 완결/미래 지시 용법
