translation:
  language: ko
  text: 솔로몬 왕의 다섯째 해에 이집트 왕 시삭이 예루살렘을 치러 올라왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Now ...
  chosen_korean: (문맥상 새 사건의 전개를 여는 말은 생략)
  alternatives_korean:
  - 이때
  - 그때
  - 이렇게 되었습니다
  lexicon: HALOT
  rationale: 히브리어 서술 시작 표지는 한국어에서 보통 직접 옮기지 않아도 의미가 유지되므로, 현대적 문장 흐름을 우선해 생략했습니다.
- source_word: בַּשָּׁנָה הַחֲמִישִׁית
  english_pob_choice: in the fifth year
  chosen_korean: 다섯째 해에
  alternatives_korean:
  - 다섯 번째 해에
  - 다섯 해째에
  lexicon: HALOT
  rationale: 연대기 공식에 맞는 자연스러운 한국어 표현으로, 왕의 재위 연호를 간결하게 드러냅니다.
- source_word: עָלָה עַל
  english_pob_choice: came up against
  chosen_korean: 치러 올라왔습니다
  alternatives_korean:
  - 올라왔습니다
  - 쳐들어왔습니다
  - 대항하여 올라왔습니다
  lexicon: HALOT
  rationale: עלה의 군사적 관용구를 살리면서도, 한국어에서 적대적 이동을 분명히 하는 표현으로 옮겼습니다.
- source_word: שושק
  english_pob_choice: Shishak
  chosen_korean: 시삭
  alternatives_korean:
  - 시삭크
  - 시샥
  lexicon: HALOT
  rationale: 히브리어 음가에 따른 통용 표기를 따랐습니다.
theological_decisions:
- issue: 군사적 관용구의 방향성과 공격성
  chosen_reading: 예루살렘을 치러 올라왔습니다
  alternative_readings:
  - 예루살렘을 향해 올라왔습니다
  - 예루살렘에 올라왔습니다
  rationale: עָלָה עַל은 단순 이동이 아니라 군사적 공세를 뜻하므로, 공격성을 분명히 하되 한국어 어법에 맞게 번역했습니다.
  doctrine_reference: 역사서의 서술적 관용구 처리
