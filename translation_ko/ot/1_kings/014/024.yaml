  text: וְ/גַם קָדֵ֖שׁ הָיָ֣ה בָ/אָ֑רֶץ עָשׂ֗וּ כְּ/כֹל֙ הַ/תּוֹעֲבֹ֣ת הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/024.yaml
  text: There were also cult prostitutes in the land[a]. They did according to all the abominations of the nations that Yahweh had driven out before the sons of Israel.
  footnotes:
  - marker: a
    text: Or “male cult prostitute” or “temple prostitute.” The Hebrew קָדֵשׁ refers to a person associated with illicit cultic sexual practice.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 그 땅에 가증한 일을 행하는 자들[a]이 있었습니다. 그들은 야훼께서 이스라엘 자손 앞에서 쫓아내신 그 민족들의 모든 가증한 일과 같이 행하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “남성 성전 창기”, “성전 창기”일 수 있습니다. 히브리어 קָדֵשׁ는 금지된 제의적 성행위와 관련된 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: There were also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고 또한
  - 더욱이
  lexicon: HALOT
  rationale: 추가적 진술의 기능을 자연스러운 한국어 부사로 살려, 앞 문장에 더해지는 추가적 책망임을 분명히 했습니다.
- source_word: קָדֵשׁ
  english_pob_choice: cult prostitutes
  chosen_korean: 가증한 일을 행하는 자들
  alternatives_korean:
  - 남성 성전 창기
  - 성전 창기
  - 사당의 창기
  lexicon: HALOT
  rationale: 히브리어 קָדֵשׁ는 우상숭배와 결부된 금지된 성적 행위에 연루된 사람을 가리키므로, 성별을 과도하게 단정하는 표현보다 그 행위의 성격을 드러내는 표현을 택했습니다. 본문 주석으로 대안 번역 가능성도 남깁니다.
- source_word: עָשׂוּ כְּכֹל
  english_pob_choice: They did according to all
  chosen_korean: 그들은 … 같이 행하였습니다
  alternatives_korean:
  - 그들은 … 대로 행하였습니다
  - 그들은 …을 따라 행하였습니다
  lexicon: HALOT
  rationale: 단순 동사 עָשׂוּ와 비교구문 כְּכֹל의 결합을 한국어에서 자연스럽게 옮겨, 단순한 행위가 아니라 본받아 따른다는 뜻을 살렸습니다.
- source_word: הַתּוֹעֲבֹת הַגּוֹיִם
  english_pob_choice: the abominations of the nations
  chosen_korean: 그 민족들의 모든 가증한 일
  alternatives_korean:
  - 그 나라들의 모든 혐오스러운 일
  - 이방 민족들의 모든 가증한 일
  lexicon: HALOT
  rationale: תועבות의 도덕·종교적 무게를 '가증한 일'로 살리고, 구약 역사 문맥의 비이스라엘 민족을 '민족들'로 옮겼습니다.
- source_word: הוֹרִישׁ יְהוָה מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh had driven out before the sons of Israel
  chosen_korean: 야훼께서 이스라엘 자손 앞에서 쫓아내신
  alternatives_korean:
  - 야훼께서 이스라엘 자손 앞에서 몰아내신
  - 야훼께서 이스라엘 자손 앞에서 내쫓으신
  lexicon: HALOT
  rationale: הוֹרִישׁ의 정복·축출 의미를 '쫓아내다'로 옮겨 장소적 제거를 분명히 했고, מִפְּנֵי는 '앞에서'로 자연스럽게 처리했습니다.
theological_decisions:
- issue: קָדֵשׁ의 성격을 한국어에서 어떻게 드러낼 것인가
  chosen_reading: 가증한 일을 행하는 자들
  alternative_readings:
  - 남성 성전 창기
  - 성전 창기
  rationale: 본문은 우상숭배와 성적 타락의 결합을 정죄하므로, 전통적이지만 오해를 낳기 쉬운 특정 성별·직업 용어를 바로 본문으로 고정하기보다, 그 행위의 도덕적·종교적 성격을 우선 드러냈습니다. 주석의 대안 번역으로 어휘상의 불확실성은 유지합니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: בְּנֵי יִשְׂרָאֵל의 직역 여부
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 히브리어의 남성 복수 친족 표현을 유지해 원문 형식을 보존하되, 한국어에서는 의미가 자연스럽게 이해되도록 했습니다.
  doctrine_reference: Translation philosophy §4
