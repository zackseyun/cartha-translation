base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/026.yaml
  text: He took the treasures of the house of Yahweh and the treasures of the king’s house; he took everything[a]. He also took all the gold shields that Solomon had made.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the house of the LORD''; that is, the temple.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼의 집의 보물과 왕궁의 보물을 가져갔으며, 모든 것을 가져갔습니다[a]. 또 솔로몬이 만든 금 방패들을 모두 가져갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘여호와의 집’, 곧 성전을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח / לָקָח
  english_pob_choice: he took
  chosen_korean: 가져갔습니다
  alternatives_korean:
  - 취했습니다
  - 빼앗았습니다
  lexicon: HALOT
  rationale: 반복되는 לקח의 기본 의미를 살리되, 문맥상 약탈 행위를 자연스럽게 드러내는 현대적 표현으로 옮겼습니다.
- source_word: אֹצְרוֹת
  english_pob_choice: treasures
  chosen_korean: 보물
  alternatives_korean:
  - 재물
  - 창고
  lexicon: HALOT
  rationale: 이 구절은 저장고 건물보다 그 안에 있던 귀중한 물품을 가리키므로, ‘보물’이 가장 직접적입니다.
- source_word: בֵּית יְהוָה / יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 주님의 집
  - 성전
  lexicon: HALOT
  rationale: יהוה는 본문 원어의 고유명사이므로 ‘야훼’로 옮기고, ‘집’이라는 히브리어 표현을 유지해 직역성을 살렸습니다.
- source_word: מָגִנֵּי הַזָּהָב
  english_pob_choice: the gold shields
  chosen_korean: 금 방패들
  alternatives_korean:
  - 황금 방패들
  - 금으로 만든 방패들
  lexicon: HALOT
  rationale: 히브리어의 소유/재질 표현을 한국어에서 가장 자연스럽게 보이는 관형어 구조로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 본문의 고유명사로서 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 일관된 원칙에 따라 Tetragrammaton을 호칭 대체어가 아니라 신적 고유명사로 드러내기 위해 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
