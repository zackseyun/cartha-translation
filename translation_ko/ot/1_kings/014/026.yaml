  source_fidelity: 본문의 반복된 לקח를 ‘가져갔습니다’로 옮기고, אֹצְרוֹת를 ‘보물’로, 금 방패를 솔로몬이 이전에 만들었다는 관계절을 옮긴 점은 원문에 충실합니다. 다만 각주가 히브리어 표현을 ‘여호와의 집’이라고 제시하여, 본문의 고유명사 ‘야훼’와 불일치합니다. ‘모든 것’은 앞서 언급한 보물 전체를 가리키도록 ‘그 모든 것’으로 명확히 하는 것이 안전합니다.
  naturalness: ‘야훼의 집의 보물’은 이해할 수 있으나 소유격이 겹쳐 다소 뻣뻣합니다. ‘야훼의 집에 있는 보물’이 현대 표준어 합쇼체에서 더 자연스럽고, 원문의 의미도 유지합니다. ‘금 방패들을 모두’도 가능하지만 한국어에서는 ‘금 방패를 모두’가 더 매끄럽습니다.
  terminology: יהוה는 POB 원칙과 원문에 따라 ‘야훼’로 유지하는 것이 적절합니다. בֵּית הַמֶּלֶךְ를 문맥상 ‘왕궁’으로 옮긴 것은 자연스럽고 의미상 타당합니다. 각주도 ‘야훼의 집’이라는 직역 표현 및 성전 지시를 정확하게 밝혀야 합니다.
