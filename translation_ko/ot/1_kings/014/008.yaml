id: 1KI.14.8
reference: 1 Kings 14:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מִ/בֵּ֣ית דָּוִ֔ד וָ/אֶתְּנֶ֖/הָ לָ֑/ךְ וְ/לֹֽא הָיִ֜יתָ כְּ/עַבְדִּ֣/י דָוִ֗ד אֲשֶׁר֩ שָׁמַ֨ר מִצְוֺתַ֜/י וַ/אֲשֶׁר הָלַ֤ךְ אַחֲרַ/י֙ בְּ/כָל לְבָב֔/וֹ לַ/עֲשׂ֕וֹת רַ֖ק הַ/יָּשָׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/008.yaml
  text: and I tore the kingdom away from the house of David and gave it to you[a]. But you have not been like my servant David, who kept my commandments and who walked after me with all his heart[b], to do only what was right in my eyes.
  footnotes:
  - marker: a
    text: Or 'followed me.' The Hebrew literally says 'walked after me.'
    reason: lexical_alternative
  - marker: b
    text: '''House of David'' is a dynastic expression, that is, David''s royal line.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 왕국을 다윗의 집[a]에서 찢어 내어 너에게 주었으나, 너는 내 종 다윗과 같지 않았습니다. 다윗은 내 명령들을 지켰고, 온 마음을 다해 나를 따라가며[b] 내 눈에 옳은 것만 행했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다윗의 집’은 다윗의 왕조를 가리키는 관용적 표현입니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘나를 따라 걸었다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְרַע
  english_pob_choice: I tore ... away
  chosen_korean: 찢어 내어
  alternatives_korean:
  - 찢어
  - 뜯어 내어
  - 갈라내어
  lexicon: HALOT
  rationale: קרע의 물리적 ‘찢다/가르다’ 이미지를 살리되, 왕국을 권력 중심에서 분리해 옮겨 주는 뉘앙스를 한국어 동사구 ‘찢어 내어’로 자연스럽게 담았습니다.
- source_word: מִבֵּית דָּוִד
  english_pob_choice: from the house of David
  chosen_korean: 다윗의 집에서
  alternatives_korean:
  - 다윗의 가문에서
  - 다윗의 왕조에서
  lexicon: HALOT
  rationale: ‘집’은 히브리어 בַּיִת의 왕조적 관용구를 보존하는 가장 직접적인 표현이므로, 본문 의미를 유지하면서도 이해 가능한 ‘다윗의 집’으로 옮겼습니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 노예
  - 내 종자
  lexicon: HALOT
  rationale: 다윗에 대한 하나님의 호칭은 신분적 속박보다 언약적 봉사의 뉘앙스가 강하므로, 프로젝트 기본값대로 ‘종’을 사용했습니다.
- source_word: שָׁמַר מִצְוֺתַי
  english_pob_choice: kept my commandments
  chosen_korean: 내 명령들을 지켰고
  alternatives_korean:
  - 내 계명들을 지켰고
  - 내 명령들을 준수했고
  lexicon: HALOT
  rationale: שׁמר는 여기서 언약적 순종을 뜻하므로 ‘지키다’가 가장 자연스럽고, 복수형 ‘명령들’로 문맥의 집합적 뉘앙스를 살렸습니다.
- source_word: הָלַךְ אַחֲרַי בְּכָל לְבָבוֹ
  english_pob_choice: walked after me with all his heart
  chosen_korean: 온 마음으로 나를 따라왔으며
  alternatives_korean:
  - 온 마음으로 나를 따라갔으며
  - 마음을 다해 나를 뒤따랐으며
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘뒤따르다/따라가다’를 한국어에서는 ‘따라오다’보다 ‘따라가다’가 더 자연스럽지만, 하나님을 향한 추종의 방향성을 살리기 위해 ‘나를 따라왔으며’로 처리했습니다.
theological_decisions:
- issue: 다윗 평가를 본문 그대로 유지할지 여부
  chosen_reading: 다윗을 ‘내 종’으로 칭하고 그가 계명을 지켰으며 마음을 다해 따랐다고 말하는 본문의 평가를 그대로 유지했습니다.
  alternative_readings:
  - 다윗은 대체로 그러했다고 완화해 표현하기
  - 다윗의 특정 죄를 암시하는 주석적 완충어를 넣기
  rationale: 본문은 여로보암과의 대조를 위해 다윗을 언약적 모범으로 제시하므로, 다른 본문의 긴장을 여기로 끌어와 약화시키지 않는 것이 원문의 수사와 의도를 더 충실히 반영합니다.
  doctrine_reference: 본문 내부의 평가를 보존하고, 성경 내 다른 본문과의 긴장은 해설 영역에 남겨 둡니다.
