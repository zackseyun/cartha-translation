  source_fidelity: ‘몸을 숨기고 있습니까?’는 자신을 숨기는 행위로도 이해될 수 있어, 자신을 알아보지 못하게 하는 히브리어 מִתְנַכֵּרָה의 뜻을 충분히 드러내지 못합니다. ‘변장하고 있습니까?’가 문맥과 어휘에 더 정확합니다. קָשָׁה는 생략된 명사를 수식하는 말이므로 ‘엄한 소식’을 보충한 것은 가능하되, 원문의 생략을 각주에서 밝혀야 합니다.
  naturalness: 합쇼체는 일관되어 있으며, ‘문간에 들어설 때 그녀의 발소리’와 ‘엄한 소식을 가지고 당신에게 보내졌습니다’는 현대 표준어에서 자연스럽고 본문의 긴장을 유지합니다.
  terminology: 인명 ‘아히야’, ‘여로보암’은 적절합니다. 직접 호칭 ‘여로보암의 아내여’는 성서적 공식 발화에 어울립니다. ‘엄한 소식’은 ‘거친 소식’보다 심판적이고 중대한 전달 내용이라는 문맥에 자연스럽지만, ‘말씀’ 등으로 특정하지 않아 원문의 명사 생략을 보존합니다.
