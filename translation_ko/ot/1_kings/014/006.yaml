  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲחִיָּ֜הוּ אֶת ק֤וֹל רַגְלֶ֨י/הָ֙ בָּאָ֣ה בַ/פֶּ֔תַח וַ/יֹּ֕אמֶר בֹּ֖אִי אֵ֣שֶׁת יָרָבְעָ֑ם לָ֣/מָּה זֶּ֗ה אַ֚תְּ מִתְנַכֵּרָ֔ה וְ/אָ֣נֹכִ֔י שָׁל֥וּחַ אֵלַ֖יִ/ךְ קָשָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/006.yaml
  text: And when Ahijah heard the sound of her feet as she came in at the doorway[a], he said, “Come in, wife of Jeroboam[b]. Why are you disguising yourself? For I am sent to you with a hard message.”
  footnotes:
  - marker: a
    text: Or 'Why do you pretend to be another?'
    reason: lexical_alternative
  - marker: b
    text: Literally 'I am sent to you hard'; the Hebrew leaves the noun unstated, implying a severe message or news.
    reason: lexical_alternative
translation:
  language: ko
  text: 아히야가 그녀가 문으로 들어오는 발소리를 듣고 말했습니다. “들어오십시오, 여로보암의 아내여. 왜 몸을 숨기고 있습니까? 나는 당신에게 거친 소식을 전하도록 보내졌습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왜 다른 사람인 척합니까?’입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘나는 당신에게 거친/심한 [무언가]로 보내졌습니다’라는 식으로 명사를 생략합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קול רגליה
  english_pob_choice: the sound of her feet
  chosen_korean: 그녀가 문으로 들어오는 발소리
  alternatives_korean:
  - 그녀의 발걸음 소리
  - 그녀의 발소리
  lexicon: HALOT
  rationale: 히브리어의 이미지인 ‘발의 소리’를 살리되, 한국어에서는 자연스럽게 ‘발소리/발걸음 소리’로 옮기는 것이 가장 직접적입니다.
- source_word: בָּאָה בַפֶּתַח
  english_pob_choice: as she came in at the doorway
  chosen_korean: 문으로 들어오는
  alternatives_korean:
  - 문지방으로 들어오는
  - 문간으로 들어오는
  lexicon: HALOT
  rationale: פֶּתַח은 단순한 ‘문’보다 ‘들어오는 입구/문간’의 의미가 있어, 장면의 흐름을 살리면서도 한국어에서 자연스러운 ‘문으로 들어오는’으로 옮겼습니다.
- source_word: מִתְנַכֵּרָה
  english_pob_choice: Why are you disguising yourself?
  chosen_korean: 왜 몸을 숨기고 있습니까?
  alternatives_korean:
  - 왜 변장하고 있습니까?
  - 왜 다른 사람인 척하고 있습니까?
  lexicon: HALOT
  rationale: 동사 נכר의 핵심은 ‘자신을 알아보지 못하게 하다’이므로, 문맥상 더 자연스럽고 덜 현대적 소품화가 되는 ‘몸을 숨기다’로 옮겼습니다.
- source_word: שָׁלוּחַ אֵלַיִךְ קָשָׁה
  english_pob_choice: I am sent to you with a hard message
  chosen_korean: 나는 당신에게 거친 소식을 전하도록 보내졌습니다
  alternatives_korean:
  - 나는 당신에게 কঠ한 말을 전하도록 보내졌습니다
  - 나는 당신에게 엄한 소식을 전하도록 보내졌습니다
  lexicon: HALOT
  rationale: 히브리어는 목적어를 생략한 채 ‘거친/심한’이라는 형용사만 남기므로, 한국어에서는 생략을 풀어 ‘소식’을 보충하되 그 강도를 ‘거친’으로 살렸습니다.
theological_decisions:
- issue: 성격이 생략된 קָשָׁה의 보충어 처리
  chosen_reading: ‘거친 소식’을 선택해, 단순한 정보 전달이 아니라 심판적이고 무거운 예언 말씀이 온다는 점을 드러냈습니다.
  alternative_readings:
  - ‘무거운 소식’
  - ‘엄한 말씀’
  - ‘괴로운 소식’
  rationale: 히브리어는 명사를 생략해 강도를 강조하므로, 한국어에서도 그 긴장을 유지해야 합니다. ‘소식’은 본문이 예언 전달 상황임을 살리면서도 과도한 해석을 덧붙이지 않습니다.
  doctrine_reference: 예언적 발화의 강도 보존, 번역 원칙 §1, §3
- issue: 아히야의 직접 발화 형식
  chosen_reading: “들어오십시오 …”로 정중한 호칭과 명령을 유지했습니다.
  alternative_readings:
  - “들어오시오 …”
  - “들어오라 …”
  rationale: 본문의 장면은 대면하는 예언자와 왕비의 공식적 대화이므로, 현대 한국어 합쇼체 안에서 정중한 명령형을 쓰는 것이 적절합니다.
  doctrine_reference: 대화체 존대 유지
