source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י יָֽרָבְעָ֔ם אֲשֶׁ֥ר נִלְחַ֖ם וַ/אֲשֶׁ֣ר מָלָ֑ךְ הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/019.yaml
  text: Now the rest of the acts of Jeroboam[a], how he fought and how he reigned, behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
  footnotes:
  - marker: a
    text: Or, more literally, 'the rest of the matters of Jeroboam.' In this regnal formula, 'acts' conveys the sense of recorded deeds or affairs.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'behold, they are written,' a presentative expression drawing attention to the written record.
    reason: lexical_alternative
  - marker: c
    text: That is, an official royal annal or historical record, not the biblical book of 1–2 Chronicles.
    reason: cross_reference
translation:
  language: ko
  text: 여로보암의 나머지 행적, 곧 그가 싸운 일과 다스린 일은, 보십시오, 이스라엘 왕들의 역대기 책에 기록되어 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘여로보암의 나머지 일들’입니다. 이 왕조 결구에서 이 표현은 왕의 기록된 행적과 사항을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘보십시오, 그것들이 기록되어 있습니다’라고 하며, 기록을 가리켜 주의를 환기합니다.
    reason: lexical_alternative
  - marker: c
    text: 왕실의 연대기 또는 공식 역사 기록을 가리키며, 성경의 『역대기』와는 다른 기록입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר
  english_pob_choice: Now the rest of
  chosen_korean: 나머지 일들
  alternatives_korean:
  - 남은 말들
  - 그 밖의 일들
  lexicon: HALOT
  rationale: 왕조 실록형 결구에서 יֶתֶר는 단순한 ‘남은 것’이 아니라 인물의 기록된 나머지 사항을 가리키므로, 자연스러운 한국어로 ‘나머지 일들’이 적절합니다.
- source_word: דִּבְרֵי
  english_pob_choice: acts
  chosen_korean: 일들
  alternatives_korean:
  - 말들
  - 사실들
  - 행적들
  lexicon: HALOT
  rationale: 직역하면 ‘말들/일들’이지만, 이 문맥에서는 왕의 기록된 사항 전반을 뜻하므로 ‘일들’이 가장 과장되지 않으면서도 포괄적입니다.
- source_word: אֲשֶׁר נִלְחַם / וַאֲשֶׁר מָלָךְ
  english_pob_choice: how he fought / and how he reigned
  chosen_korean: 그가 싸운 일과 그가 다스린 일
  alternatives_korean:
  - 그가 싸운 것과 그가 통치한 것
  - 그가 전쟁한 일과 왕 노릇 한 일
  lexicon: HALOT
  rationale: נלחם와 מלך의 병렬을 살리면서도 한국어 서술형 결구로 자연스럽게 옮기기 위해 ‘...한 일’ 구조를 사용했습니다.
- source_word: הִנָּם
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오,
  - 참으로
  lexicon: HALOT
  rationale: הִנָּם의 주의 환기 기능을 현대 한국어에서 가장 자연스럽게 드러내는 표현은 ‘보십시오’입니다. 본문 독자에게 기록의 존재를 직접 환기하는 효과를 유지합니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  english_pob_choice: the Book of the Chronicles of the Kings of Israel
  chosen_korean: 이스라엘 왕들의 역대기 책
  alternatives_korean:
  - 이스라엘 왕들의 연대기 책
  - 이스라엘 왕들의 사적 기록 책
  lexicon: HALOT
  rationale: 이 고정 표현은 성경의 역대기가 아니라 왕실 연대 기록을 가리키므로, ‘역대기 책’으로 옮겨 기록 성격을 드러내되 오해를 피했습니다.
theological_decisions:
- issue: 본문의 presentative 표현 הִנָּם의 처리
  chosen_reading: ‘보십시오’로 옮겨, 기록된 문서를 가리키며 독자의 주의를 환기하는 문장 기능을 살렸습니다.
  alternative_readings:
  - 그것들이 있습니다
  - 보라, 그것들이 기록되어 있습니다
  rationale: 이 구절은 신학적 난점보다 서술 기능이 핵심이지만, presentative를 약화시키면 원문의 장중한 기록 안내가 사라집니다.
  doctrine_reference: 성경 서술의 기록-증언 기능
