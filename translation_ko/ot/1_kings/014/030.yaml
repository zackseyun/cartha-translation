source:
  edition: WLC
  text: וּ/מִלְחָמָ֨ה הָיְתָ֧ה בֵין רְחַבְעָ֛ם וּ/בֵ֥ין יָרָבְעָ֖ם כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/030.yaml
  text: And there was war between Rehoboam and Jeroboam all their days[a].
  footnotes:
  - marker: a
    text: Or, more formally, 'all the days.' The Hebrew idiom means the conflict persisted throughout their lives/reigns.
    reason: lexical_alternative
translation:
  language: ko
  text: 르호보암과 여로보암 사이에는 그들의 생애 동안 전쟁이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘모든 날들’입니다. 히브리어 관용구는 갈등이 그들의 생애/치세 전반에 걸쳐 지속되었음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלְחָמָה
  english_pob_choice: And there was war
  chosen_korean: 전쟁이 있었습니다
  alternatives_korean:
  - 전쟁이 있었습니다만
  - 전쟁이 계속되었습니다
  - 전쟁이 있었습니다, 그리고
  lexicon: HALOT
  rationale: מִלְחָמָה는 기본적으로 ‘전쟁’이며, כאן은 단순 존재 구문이므로 한국어도 상태 진술인 ‘전쟁이 있었습니다’로 자연스럽게 옮겼습니다.
- source_word: הָיְתָה
  english_pob_choice: there was
  chosen_korean: 있었습니다
  alternatives_korean:
  - 계속되었습니다
  - 존재했습니다
  lexicon: HALOT
  rationale: היה의 여기서는 존재·상태를 나타내므로, 해석을 덧붙인 ‘계속되었습니다’보다 ‘있었습니다’가 원문에 더 가깝습니다.
- source_word: בֵין ... וּבֵין
  english_pob_choice: between ... and
  chosen_korean: 사이에
  alternatives_korean:
  - ~와 ~ 사이에
  - ~와 ~ 사이
  lexicon: HALOT
  rationale: 쌍을 이루는 בין 구문은 두 인물 사이의 대립을 나타내므로 한국어 ‘~ 사이에’가 가장 직접적입니다.
- source_word: כָּל הַיָּמִים
  english_pob_choice: all their days
  chosen_korean: 그들의 생애 동안
  alternatives_korean:
  - 모든 날 동안
  - 평생
  - 그 모든 날 동안
  lexicon: HALOT
  rationale: 직역하면 ‘모든 날들’이지만, 문맥상 두 왕의 지속적인 대립이 그들의 생애/치세 내내 이어졌다는 뜻이므로 한국어에서는 관용적으로 ‘그들의 생애 동안’이 자연스럽습니다.
theological_decisions:
- issue: כָּל הַיָּמִים의 지속성 표현
  chosen_reading: 단순한 기간 진술로서 두 왕의 관계가 생애 내내 지속적으로 적대적이었음을 보여 줍니다.
  alternative_readings:
  - ‘항상’처럼 일반적 반복으로 읽기
  - ‘전쟁이 계속되었다’로 강하게 과정화하기
  rationale: 본문은 전쟁의 양상을 설명하기보다 관계의 지속된 상태를 말하므로, 과도한 과정화 없이 지속 기간을 담담히 표현했습니다.
  doctrine_reference: 본문 관찰
