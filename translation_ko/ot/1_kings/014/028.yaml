id: 1KI.14.28
reference: 1 Kings 14:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֛י מִ/דֵּי בֹ֥א הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה יִשָּׂאוּ/ם֙ הָֽ/רָצִ֔ים וֶ/הֱשִׁיב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/028.yaml
  text: And whenever the king entered the house of Yahweh[b][a], the guards would carry them and then return them to the guards’ chamber.
  footnotes:
  - marker: a
    text: That is, the bronze shields made by Rehoboam in place of the gold shields taken by Shishak (see 1 Kings 14:27).
    reason: cross_reference
  - marker: b
    text: Hebrew 'the runners'; in this royal setting, the term refers to the king’s guards or bodyguards.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 야훼의 집에 들어갈 때마다, 경호병들[b]이 그것들[a]을 나르고는 경호병들의 방에 되돌려 놓았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 스사크가 가져간 금 방패들을 대신하여 르호보암이 만든 놋 방패들입니다(1열왕 14:27 참조).
    reason: cross_reference
  - marker: b
    text: 히브리어는 문자적으로 ‘달리는 자들’이지만, 이 왕실 맥락에서는 왕의 경호병 또는 호위병을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדֵּי בֹא
  english_pob_choice: whenever ... entered
  chosen_korean: '...할 때마다'
  alternatives_korean:
  - '...할 때마다 늘'
  - '...할 때마다마다'
  lexicon: HALOT
  rationale: 반복적·습관적 상황을 나타내므로 한국어의 자연스러운 반복 표현인 ‘할 때마다’로 옮겼습니다.
- source_word: יִשָּׂאוּם / הָרָצִים
  english_pob_choice: would carry them / the guards
  chosen_korean: 경호병들이 그것들을 나르고
  alternatives_korean:
  - 경비병들이 그것들을 나르고
  - 달리는 자들이 그것들을 나르고
  lexicon: HALOT
  rationale: 직역하면 ‘달리는 자들’이지만, 왕실 맥락에서 기능은 호위·경호이므로 독자가 역할을 바로 이해하도록 ‘경호병들’로 옮겼습니다.
- source_word: אֶל תָּא הָרָצִים
  english_pob_choice: to the guards’ chamber
  chosen_korean: 경호병들의 방으로
  alternatives_korean:
  - 경호병들의 방으로
  - 경호실로
  - 경비병들의 방으로
  lexicon: HALOT
  rationale: תָּא는 방/칸을 뜻하므로, 왕궁 내 보관 장소를 자연스럽게 드러내는 ‘방’으로 옮겼습니다.
- source_word: בֵּית יְהוָה / יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 여호와의 집
  lexicon: HALOT
  rationale: 고유명사 יְהוָה는 이 프로젝트 기본에 따라 ‘야훼’로 옮기고, בַּיִת는 전형적 성전 표현인 ‘집’을 유지해 원문 관용을 살렸습니다.
theological_decisions:
- issue: ‘house of Yahweh’의 한국어 관용어 선택
  chosen_reading: ‘야훼의 집’으로 유지해 원문 표현을 보존했습니다.
  alternative_readings:
  - ‘야훼의 성전’
  - ‘주님의 성전’
  rationale: 본문은 단순한 의미 번역보다 ‘집’이라는 히브리어 관용을 반복적으로 드러내므로, 과도한 해설어 ‘성전’보다 원문 밀착형 표현이 더 적절합니다.
  doctrine_reference: 출 25–40 및 열왕기서의 성전/야훼-임재 어휘 관찰
- issue: 문장 시제와 반복성
  chosen_reading: 서술형 과거에 반복 습관을 나타내는 ‘할 때마다’ 구문을 사용했습니다.
  alternative_readings:
  - ‘들어올 때마다’
  - ‘들어갈 때면’
  rationale: wayyiqtol과 미디어/반복 구조가 단발 사건이 아니라 관례를 나타내므로, 한국어에서도 반복적 습관을 분명히 해야 합니다.
  doctrine_reference: 히브리어 서사 동사상/관습적 반복 용법
