id: 1KI.14.18
reference: 1 Kings 14:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְבְּר֥וּ אֹת֛/וֹ וַ/יִּסְפְּדוּ ל֖/וֹ כָּל יִשְׂרָאֵ֑ל כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥הוּ הַ/נָּבִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/018.yaml
  text: They buried him[a], and all Israel mourned for him, according to the word of Yahweh that he had spoken through his servant Ahijah the prophet.
  footnotes:
  - marker: a
    text: 'Hebrew: ''by the hand of his servant Ahijah the prophet,'' an idiom meaning ''through his servant Ahijah the prophet.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그를 장사했고, 온 이스라엘은 그를 위해 애도했습니다. 이는 야훼께서 그의 종 예언자 아히야를 통하여 말씀하신 대로였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘그의 종 예언자 아히야의 손을 통해’입니다. 이는 관용적으로 ‘그의 종 예언자 아히야를 통하여’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  english_pob_choice: They buried him
  chosen_korean: 그를 장사했고
  alternatives_korean:
  - 그를 묻었고
  - 그를 매장했고
  lexicon: HALOT
  rationale: קבר는 문맥상 시신을 매장하는 뜻이므로 ‘장사하다’가 자연스럽고, 이어지는 서술과도 잘 맞습니다.
- source_word: וַיִּסְפְּדוּ לוֹ
  english_pob_choice: mourned for him
  chosen_korean: 그를 위하여 애도했습니다
  alternatives_korean:
  - 그를 위하여 슬퍼했습니다
  - 그를 위하여 곡했습니다
  lexicon: HALOT
  rationale: ספד는 공개적 애도와 통곡을 아우르지만, 장례 문맥에서는 현대 한국어 ‘애도하다’가 가장 균형 있게 의미를 살립니다.
- source_word: כִּדְבַר יְהוָה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 야훼께서 ... 말씀하신 것대로였습니다
  alternatives_korean:
  - 야훼의 말씀대로였습니다
  - 야훼의 말씀에 따라 이루어졌습니다
  lexicon: HALOT
  rationale: כִּדְבַר는 단순 비교보다 ‘말씀하신 대로/대로였다’는 성취 표현이 자연스럽습니다. 본문 흐름상 결과 진술로 풀었습니다.
- source_word: עַבְדּוֹ
  english_pob_choice: his servant
  chosen_korean: 그의 종
  alternatives_korean:
  - 그의 노예
  - 그의 하인
  lexicon: HALOT
  rationale: 예언자와 야훼의 관계를 나타내는 관용적 표현으로서 ‘종’이 가장 정확하며, 여기서는 신분적 억압을 강조하는 ‘노예’가 문맥에 맞지 않습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신적 이름 יְהוָה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 제목어 ‘주’로 대체하지 않고 ‘야훼’로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Contested terms — YHWH → 야훼
- issue: בְּיַד עַבְדּוֹ의 매개성
  chosen_reading: '... 말씀하신 것대로였습니다'
  alternative_readings:
  - 그의 종 아히야를 통해 말씀하신 대로였습니다
  - 그의 종 아히야를 통하여 말씀하신 대로였습니다
  rationale: 히브리어 관용구 ‘손을 통해’가 담는 매개성을 한국어에서 과도하게 도식화하지 않고, 예언 성취 진술로 자연스럽게 재현했습니다.
  doctrine_reference: Translation philosophy §1, §6
