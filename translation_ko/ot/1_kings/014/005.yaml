base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/005.yaml
  text: And Yahweh said to Ahijah[a], “Look, Jeroboam’s wife is coming to ask you about her son, because he is sick. You shall speak to her like this and like that. And when she comes[b], she will be disguising herself.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''thus and thus''—an idiom meaning a specific message whose content is not yet stated explicitly.'
    reason: lexical_alternative
  - marker: b
    text: Or 'she will pretend to be another woman.' The Hebrew verb conveys making oneself unrecognized or disguised.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 아히야에게 말씀하셨습니다. “보십시오, 여로보암의 아내가 아들의 일로 당신에게 물으러 오고 있습니다. 그가 병들었기 때문입니다. 당신은 그녀에게 이렇게 저렇게[a] 말해야 합니다. 그녀가 올 때에는 변장하고[b] 있을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 아직 내용이 명시되지 않은 구체적인 메시지를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘자신을 알아보지 못하게 하다’, 곧 ‘변장하다’라는 뜻을 가집니다.
    reason: lexical_alternative
