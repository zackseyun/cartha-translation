  text: וַ/יהוָ֞ה אָמַ֣ר אֶל אֲחִיָּ֗הוּ הִנֵּ֣ה אֵ֣שֶׁת יָרָבְעָ֡ם בָּאָ֣ה לִ/דְרֹשׁ֩ דָּבָ֨ר מֵ/עִמְּ/ךָ֤ אֶל בְּנָ/הּ֙ כִּֽי חֹלֶ֣ה ה֔וּא כָּ/זֹ֥ה וְ/כָ/זֶ֖ה תְּדַבֵּ֣ר אֵלֶ֑י/הָ וִ/יהִ֣י כְ/בֹאָ֔/הּ וְ/הִ֖יא מִתְנַכֵּרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/005.yaml
  text: And Yahweh said to Ahijah[a], “Look, Jeroboam’s wife is coming to ask you about her son, because he is sick. You shall speak to her like this and like that. And when she comes[b], she will be disguising herself.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''thus and thus''—an idiom meaning a specific message whose content is not yet stated explicitly.'
    reason: lexical_alternative
  - marker: b
    text: Or 'she will pretend to be another woman.' The Hebrew verb conveys making oneself unrecognized or disguised.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 아히야에게 말씀하셨습니다. 「보라, 여로보암의 아내가 자기 아들에 관해 당신에게 묻기 위해 오고 있다. 그는 병이 들었기 때문이다. 너는 그녀에게 이렇게 저렇게 말하라. 그리고 그녀가 올 때, 그녀는 변장하고 있을 것이다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 아직 내용이 명시되지 않은 구체적 메시지를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘자신을 알아보지 못하게 하다/변장하다’의 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 원문 고유명사 יְהוָה의 프로젝트 기본값을 따라, 영어 POB의 Yahweh에 대응해 학술적 음역인 ‘야훼’로 옮겼습니다.
- source_word: לִדְרֹשׁ דָּבָר מֵעִמְּךָ
  english_pob_choice: to ask you about
  chosen_korean: 당신에게 묻기 위해
  alternatives_korean:
  - 당신에게 문의하기 위해
  - 당신에게서 한 말씀을 구하기 위해
  - 당신에게서 묻기 위해
  lexicon: HALOT
  rationale: 문맥상 단순 질문이 아니라 선지자에게 조언/신탁을 구하는 행위이지만, 본절의 어휘는 아직 구체 내용을 말하지 않으므로 과도하게 ‘신탁’으로 고정하지 않고 ‘묻기 위해’로 유지했습니다.
- source_word: כָּזֹה וְכָזֶה
  english_pob_choice: like this and like that
  chosen_korean: 이렇게 저렇게
  alternatives_korean:
  - 그렇게 저렇게
  - 이러이러하게
  - 이런저런 식으로
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘아직 구체화되지 않은 특정 내용’이라는 뉘앙스를 살리면서, 현대 한국어에서 자연스럽고 예측 명령의 성격을 드러내는 표현으로 옮겼습니다.
- source_word: וְהִיא מִתְנַכֵּרָה
  english_pob_choice: she will be disguising herself
  chosen_korean: 그녀는 변장하고 있을 것이다
  alternatives_korean:
  - 그녀는 알아보지 못하게 자신을 꾸미고 있을 것이다
  - 그녀는 다른 사람인 척하고 있을 것이다
  - 그녀는 변장할 것이다
  lexicon: HALOT
  rationale: 히트파엘이 지닌 ‘자기 자신을 알아보지 못하게 만들다’의 반사적 의미를 살려 ‘변장하다’로 옮겼고, 예언적 미래 진행을 반영해 ‘-하고 있을 것이다’로 처리했습니다.
