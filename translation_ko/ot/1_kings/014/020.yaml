  source_fidelity: 원문은 여로보암의 재위 기간이 22년이었음을 말하고, 이어 ‘그의 조상들과 함께 누웠다’라는 왕정 서술의 죽음 관용구와 나답의 계승을 기록합니다. 초안의 ‘왕이 된 지는’은 재위 기간을 대체로 전달하지만, ‘다스린 기간’이 원문의 요약 공식에 더 직접적으로 대응합니다. ‘누웠고’는 현대 한국어에서 죽음 관용구로 자연스럽지 않아 의미가 불분명해질 수 있습니다.
  naturalness: ‘그의 조상들과 함께 잠들었습니다’는 한국어 성경 문체와 현대 정중체에서 자연스럽고, 죽음을 뜻하는 관용적 성격도 유지합니다. 두 사건을 문장으로 나누어도 원문의 순차적 전개와 계승 관계는 보존됩니다.
  terminology: 여로보암과 나답의 표기는 통용되는 한국어 성경식 음역과 일치합니다. ‘조상들’은 히브리어 ‘그의 아버지들’이 가리키는 선조들을 자연스럽게 전달합니다. 각주 표지는 죽음 관용구 바로 뒤에 두어 해당 범위를 명확히 해야 합니다.
