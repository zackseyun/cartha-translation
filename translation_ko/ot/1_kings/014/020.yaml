  lexicon: HALOT
  rationale: 히브리어 연대기식 왕정 요약문에서 ‘날들’은 한국어로는 기간을 뜻하는 방식으로 풀어 쓰는 것이 자연스러워, 왕위 재위 기간을 간결하게 드러내도록 했습니다.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  english_pob_choice: twenty-two years
  chosen_korean: 이십이 년이었습니다
  alternatives_korean:
  - 스물두 해였습니다
  - 22년이었습니다
  lexicon: HALOT
  rationale: 원문의 수량 표현을 현대 표준 한국어의 자연스러운 서술형으로 옮겼습니다.
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  english_pob_choice: he lay down with his fathers
  chosen_korean: 그는 그의 조상들과 함께 누웠고
  alternatives_korean:
  - 그는 그의 조상들과 함께 잠들었고
  - 그는 조상들과 함께 죽었고
  lexicon: HALOT
  rationale: 왕정 서술의 관용구를 너무 평이하게 ‘죽었다’로 바꾸지 않고, 한국어에서도 비슷한 비유를 살리되 오해 소지가 적은 ‘누웠고’를 택했습니다.
- source_word: וַיִּמְלֹךְ נָדָב בְּנוֹ תַּחְתָּיו
  english_pob_choice: Nadab his son became king in his place
  chosen_korean: 그의 아들 나답이 그의 뒤를 이어 왕이 되었습니다
  alternatives_korean:
  - 그의 아들 나답이 그를 대신하여 왕이 되었습니다
  - 그의 아들 나답이 그 자리를 이어 왕이 되었습니다
  lexicon: HALOT
  rationale: תַּחְתָּיו는 왕위 계승 문맥에서 ‘대신하여/뒤를 이어’의 의미이므로, 후계 관계와 즉위 사실이 분명한 표현으로 옮겼습니다.
theological_decisions:
- issue: 죽음 관용구의 보존 여부
  chosen_reading: ‘그는 그의 조상들과 함께 누웠고’로 옮겨, 왕정 연대기 특유의 죽음 관용구를 유지했습니다.
  alternative_readings:
  - 그는 죽었습니다
  - 그는 그의 조상들과 함께 잠들었고
  rationale: 이 표현은 사후 상태에 대한 교리 진술이 아니라 서술 관용구이므로, 원문 결을 보존하면서도 현대 한국어에서 무리 없이 읽히는 방식으로 처리했습니다.
  doctrine_reference: Translation philosophy §3, §6
