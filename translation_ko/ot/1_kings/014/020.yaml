  text: The days that Jeroboam reigned were twenty-two years. Then he lay down with his fathers[a], and Nadab his son became king in his place.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'he slept with his fathers.' The Hebrew idiom refers to death in a royal succession formula.
    reason: lexical_alternative
translation:
  language: ko
  text: 여로보암이 다스린 기간은 이십이 년이었습니다. 그는 그의 조상들과 함께 잠들었습니다.[a] 그의 아들 나답이 그의 뒤를 이어 왕이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 조상들과 함께 누웠다’입니다. 이는 왕의 죽음을 나타내는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  english_pob_choice: The days that Jeroboam reigned
  chosen_korean: 여로보암이 왕이 된 지는
  alternatives_korean:
  - 여로보암이 다스린 날들은
