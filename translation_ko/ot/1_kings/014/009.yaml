id: 1KI.14.9
reference: 1 Kings 14:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּ֣רַע לַ/עֲשׂ֔וֹת מִ/כֹּ֖ל אֲשֶׁר הָי֣וּ לְ/פָנֶ֑י/ךָ וַ/תֵּ֡לֶךְ וַ/תַּעֲשֶׂה לְּ/ךָ֩ אֱלֹהִ֨ים אֲחֵרִ֤ים וּ/מַסֵּכוֹת֙ לְ/הַכְעִיסֵ֔/נִי וְ/אֹתִ֥/י הִשְׁלַ֖כְתָּ אַחֲרֵ֥י גַוֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/009.yaml
  text: and have done evil above all who were before you. You went and made for yourself other gods and molten images to provoke me to anger[a], and you have cast me behind your back.
  footnotes:
  - marker: a
    text: Or 'molten images' for 'cast images'; the Hebrew refers to images made by casting, likely metal cult objects.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신 앞에 있었던 모든 사람보다 더 악을 행하였으며, 가서 자신을 위해 다른 신들과 부어 만든 형상들을 만들어 나를 노하게 하였고, 나를 당신의 등 뒤에 내던졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּרַע לַעֲשׂוֹת מִכֹּל
  english_pob_choice: have done more evil above all
  chosen_korean: 더 악을 행하였으며
  alternatives_korean:
  - 더욱 악하게 행하였으며
  - 모든 것보다 더 악을 행하였으며
  lexicon: HALOT
  rationale: וַתָּרַע + לַעֲשׂוֹת는 ‘악을 행하다’의 관용 표현이고, מִכֹּל은 비교를 강화하므로 한국어도 ‘더 악을 행하다’로 비교의 강도를 살렸습니다.
- source_word: אֱלֹהִים אֲחֵרִים
  english_pob_choice: other gods
  chosen_korean: 다른 신들
  alternatives_korean:
  - 다른 신
  - 이방 신들
  lexicon: HALOT
  rationale: 언약 위반을 드러내는 기본 표현이므로, 의미를 넓히지 않고 직접적으로 ‘다른 신들’로 옮겼습니다.
- source_word: וּמַסֵּכוֹת
  english_pob_choice: cast images / molten images
  chosen_korean: 부어 만든 형상들
  alternatives_korean:
  - 부어 만든 우상들
  - 주조한 형상들
  lexicon: HALOT
  rationale: מַסֵּכָה는 ‘부어 만들다/주조하다’의 제조 방식을 가리키므로, 재료보다 제작 방식을 드러내는 ‘부어 만든 형상들’이 본문에 더 가깝습니다.
- source_word: וְאֹתִי הִשְׁלַכְתָּ אַחֲרֵי גַוֶּךָ
  english_pob_choice: you have thrown me behind your back
  chosen_korean: 나를 당신의 등 뒤에 내던졌습니다
  alternatives_korean:
  - 나를 당신의 등 뒤로 내던졌습니다
  - 나를 당신의 뒤에 버렸습니다
  lexicon: HALOT
  rationale: 히브리어의 몸짓 비유를 유지하면서, 경멸적 거절의 뉘앙스를 자연스러운 현대 한국어로 살리기 위해 ‘내던졌습니다’를 선택했습니다.
theological_decisions:
- issue: 우상숭배를 추상화하지 않고 구체적으로 보존할 것인가
  chosen_reading: 다른 신들과 부어 만든 형상들
  alternative_readings:
  - 다른 신들과 우상들
  - 이방 신들과 우상 형상들
  rationale: 본문은 단순한 종교적 일반론이 아니라 구체적인 배교 행위를 고발하므로, 신적 대상과 제작된 물체를 함께 드러내는 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: 하나님을 등 뒤에 둔다는 수치를 어떤 강도로 옮길 것인가
  chosen_reading: 나를 당신의 등 뒤에 내던졌습니다
  alternative_readings:
  - 나를 당신의 등 뒤에 두었습니다
  - 나를 무시하였습니다
  rationale: 히브리어는 단순 무시가 아니라 모욕적 배척의 몸짓을 말하므로, 그 긴장을 약화시키지 않도록 신체적이고 공격적인 표현을 보존했습니다.
  doctrine_reference: Translation philosophy §3
