base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/016.yaml
  text: And when Ahab heard that Naboth was dead[a], Ahab arose to go down to the vineyard of Naboth the Jezreelite[b], to take possession of it.
  footnotes:
  - marker: a
    text: Or 'had died.' The Hebrew can be rendered either as a resulting state ('was dead') or as the completed event ('had died').
    reason: lexical_alternative
  - marker: b
    text: Or 'to possess it' or 'to inherit it.' The Hebrew verb can denote taking possession, possessing, or inheriting, depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 아합이 나봇이 죽었다는[a] 말을 듣자, 아합은 일어나 이스르엘 사람 나봇의 포도원으로 내려가 그것을 차지하기 위해[b] 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 나봇의 상태를 ‘죽어 있었다’로, 또는 완료된 사건을 ‘죽었다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 문맥에 따라 ‘차지하다’, ‘소유하다’, 또는 ‘상속받다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  english_pob_choice: when ... heard
  chosen_korean: '...이라는 소식을 듣자'
  alternatives_korean:
  - 들을 때
  - 듣고서
  lexicon: HALOT
  rationale: 히브리어 전치사 כ + 동명사구는 시간 부사를 이루므로, 한국어에서는 자연스러운 사건 진행을 살려 ‘소식을 듣자’로 옮겼습니다.
- source_word: מֵת
  english_pob_choice: was dead
  chosen_korean: 죽었다는
  alternatives_korean:
  - 죽어 있었다는
  - 죽었다는 소식을
  lexicon: HALOT
  rationale: 서술 상태와 완료 사건 둘 다 가능한데, 한국어에서는 보고된 내용임을 분명히 하면서도 상태를 과장하지 않는 ‘죽었다는’을 택했습니다.
- source_word: לָרֶדֶת
  english_pob_choice: to go down
  chosen_korean: 내려가
  alternatives_korean:
  - 가서
  - 내려가서
  lexicon: HALOT
  rationale: ירד의 방향성 ‘내려가다’를 보존해, 지리적·서사적 이동을 그대로 드러냈습니다.
- source_word: לְרִשְׁתּוֹ
  english_pob_choice: to take possession of it
  chosen_korean: 그것을 차지하려고
  alternatives_korean:
  - 그것을 소유하려고
  - 그것을 차지하기 위해
  lexicon: HALOT
  rationale: ירשׁ는 문맥상 단순 소유보다 권리를 내세워 점유를 확보하는 행위를 가리키므로, 법적·서사적 뉘앙스를 살려 ‘차지하다’로 옮겼습니다.
theological_decisions:
- issue: 아합의 행동 목적과 서사의 도덕적 긴장
  chosen_reading: ‘차지하려고 했습니다’로 옮겨, 본문이 드러내는 부정한 점유 의도를 직접적으로 보이게 했습니다.
  alternative_readings:
  - ‘소유하려고 했습니다’
  - ‘상속받으려 했습니다’
  rationale: 히브리어 ירשׁ는 단순한 중립적 소유보다 ‘권리를 주장해 차지하다’는 문맥적 힘이 있으며, 바로 앞 이야기의 불의와 연결됩니다.
  doctrine_reference: 본문의 서사적 윤리성
