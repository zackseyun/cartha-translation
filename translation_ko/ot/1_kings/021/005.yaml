  text: Then Jezebel his wife came to him and said to him[a], “Why is your spirit so sullen that you are not eating bread?”
  footnotes:
  - marker: a
    text: Hebrew literally, “What is this—your spirit is sullen—and you are not eating bread?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아합의 아내 이세벨이 그에게 와서 그에게 말했습니다. “왜 당신의 영이 그렇게 우울하여 빵을 먹지 않습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “당신의 영이 왜 이렇게 우울하고, 당신은 왜 빵을 먹지 않습니까?”라는 식의 중첩된 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  english_pob_choice: Then ... came
  chosen_korean: 그때 ... 와서
  alternatives_korean:
  - 그리고 ... 와서
  - 그런 뒤 ... 와서
  lexicon: WLC
  rationale: 와-연속의 서사 진행을 한국어의 자연스러운 시간 부사로 옮겨, 사건의 다음 순서를 분명히 했습니다.
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  english_pob_choice: Jezebel his wife
  chosen_korean: 아합의 아내 이세벨
  alternatives_korean:
  - 그의 아내 이세벨
  - 이세벨, 그의 아내
  lexicon: WLC
  rationale: 히브리어의 소유 관계를 한국어에서는 ‘아합의 아내’로 자연스럽게 풀어, 문맥상 누구의 아내인지를 분명히 했습니다.
- source_word: רוּחֲךָ סָרָה
  english_pob_choice: your spirit so sullen
  chosen_korean: 당신의 영이 그렇게 우울하여
  alternatives_korean:
  - 당신의 영이 그렇게 시무룩하여
  - 당신의 심정이 그렇게 우울하여
  - 당신의 기운이 그렇게 가라앉아
  lexicon: HALOT
  rationale: רוּחַ는 내적 상태를 가리킬 수 있으므로 ‘영’을 유지하되, סָרָה의 기울어지고 침울한 상태를 ‘우울하여’로 옮겼습니다.
- source_word: לָחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 음식
  - 빵을
  lexicon: WLC
  rationale: 히브리어의 관용구 ‘빵을 먹다’를 한국어에서도 유지하되, 현대 독자에게 자연스러운 일상어로 ‘빵’을 사용했습니다.
theological_decisions:
- issue: רוּחַ를 심리 상태가 아닌 ‘영’으로 유지할지 여부
  chosen_reading: ‘영이 우울하여’로 유지해, 히브리어의 이미지와 내적 상태를 함께 살렸습니다.
  alternative_readings:
  - ‘심정이 우울하여’
  - ‘기분이 우울하여’
  rationale: 본문은 단순 감정 묘사보다 ‘영/내적 상태’의 표현을 사용하므로, 의미를 풀되 원문의 은유를 지웠다기보다 보존하는 쪽이 적절합니다.
  doctrine_reference: 구약의 רוּחַ는 사람의 내면과 상태를 가리킬 수 있음
