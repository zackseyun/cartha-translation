  revised_text: 일어나 내려가 이스라엘 왕 아합을 만나십시오. 그는 사마리아에 있습니다. 보십시오, 그가 나봇의 포도원에 있습니다. 그는 그것을 차지하려고 그곳으로 내려갔습니다.[a]
