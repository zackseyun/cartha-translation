  - 그것을 소유하려고 합니다
  - 그것을 물려받으려고 합니다
  lexicon: HALOT
  rationale: ירש의 ‘소유하다/차지하다/상속받다’ 범위를 반영하되, 여기서는 아합이 포도원을 자기 것으로 삼으려는 구체적 상황이므로 ‘차지하다’가 가장 적절합니다.
theological_decisions:
- issue: 아합의 현재 위치를 드러내는 표현
  chosen_reading: ‘그가 사마리아에 있습니다’와 ‘그는 나봇의 포도원에 있으니’를 함께 살렸습니다.
  alternative_readings:
  - ‘사마리아에 있는’으로 압축
  - ‘사마리아에 앉아 있는’으로 의역
  rationale: 히브리어의 장소 표지와 이어지는 현장감 있는 지시를 모두 보존하기 위해 두 위치 표현을 분리해 옮겼습니다.
  doctrine_reference: 본문 서술의 시간·장소 정보 보존
