base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/018.yaml
  text: Arise[a], go down to meet Ahab king of Israel, who is in Samaria. Look, he is in the vineyard of Naboth, where he has gone down to take possession of it.
  footnotes:
  - marker: a
    text: Or 'to possess it.' The Hebrew verb can denote taking possession, possessing, or inheriting, depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나 내려가서 이스라엘 왕 아합을 맞으십시오. 그가 사마리아에 있습니다. 보십시오, 그는 나봇의 포도원에 있으니, 거기로 내려가 그것을 차지하려고 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘차지하려고 합니다’는 히브리어 동사 ירש가 문맥에 따라 ‘소유하다’, ‘차지하다’, ‘상속받다’로도 뜻할 수 있음을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּם
  english_pob_choice: Arise
  chosen_korean: 일어나
  alternatives_korean:
  - 일어나십시오
  - 일어서십시오
  lexicon: HALOT
  rationale: 예언적 급박성을 살리되, 현대 한국어에서 자연스러운 명령형으로 옮겼습니다.
- source_word: לִקְרַאת
  english_pob_choice: to meet
  chosen_korean: 맞으십시오
  alternatives_korean:
  - 만나십시오
  - 대면하십시오
  - 마주 가십시오
  lexicon: HALOT
  rationale: 단순한 이동 방향이 아니라 아합과의 조우를 지시하므로, 관계적·상황적 뉘앙스를 살려 ‘맞으십시오’로 옮겼습니다.
- source_word: לְרִשְׁתּוֹ
  english_pob_choice: to take possession of it
  chosen_korean: 그것을 차지하려고 합니다
  alternatives_korean:
