id: 1KI.21.29
reference: 1 Kings 21:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲֽ/רָאִ֔יתָ כִּֽי נִכְנַ֥ע אַחְאָ֖ב מִ/לְּ/פָנָ֑/י יַ֜עַן כִּֽי נִכְנַ֣ע מִ/פָּנַ֗/י לֹֽא אבי הָֽ/רָעָה֙ בְּ/יָמָ֔י/ו בִּ/ימֵ֣י בְנ֔/וֹ אָבִ֥יא הָ/רָעָ֖ה עַל בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/029.yaml
  text: Have you seen that Ahab has humbled himself before me? Because he has humbled himself before me[a], I will not bring the disaster in his days[b]; in his son's days I will bring the disaster on his house.
  footnotes:
  - marker: a
    text: Or 'calamity'; Hebrew 'the evil/disaster.' In this judgment context the word refers to punitive disaster, not moral evil.
    reason: lexical_alternative
  - marker: b
    text: '''On his house'' can mean on his household or dynasty.'
    reason: lexical_alternative
translation:
  language: ko
  text: “아합이 내 앞에서 스스로 낮아진 것을 보았느냐? 그가 내 앞에서 스스로 낮아졌으므로, 내가 그가 살아 있는 동안에는 재앙을 내리지 않겠고, 그의 아들의 시대에 그의 집에 재앙을 내리겠노라.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재앙’으로 옮긴 히브리어 רָעָה는 이 심판 문맥에서 도덕적 ‘악’이 아니라 징벌적 재난을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 집’은 문자적으로는 집이지만, 왕실 문맥에서는 가문이나 왕조를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָאִיתָ
  english_pob_choice: Have you seen
  chosen_korean: “보았느냐?”
  alternatives_korean:
  - “보았습니까?”
  - “눈여겨보았느냐?”
  lexicon: HALOT
  rationale: 하나님이 엘리야에게 묻는 확인 질문이므로, 완료된 관찰의 뉘앙스를 살리면서도 자연스러운 과거형으로 옮겼습니다.
- source_word: נִכְנַע
  english_pob_choice: has humbled himself
  chosen_korean: “스스로 낮아진”
  alternatives_korean:
  - “스스로 겸손해진”
  - “자신을 낮춘”
  - “복종한”
  lexicon: HALOT
  rationale: נכנע의 자기 낮춤을 살리되, 본문이 직접 ‘회개’를 말하지 않으므로 그보다 좁은 표현인 ‘스스로 낮아지다’를 택했습니다.
- source_word: הָרָעָה
  english_pob_choice: the disaster
  chosen_korean: “재앙”
  alternatives_korean:
  - “악”
  - “재난”
  - “재앙/재난”
  lexicon: HALOT
  rationale: 심판 문맥에서 רעה는 도덕적 ‘악’보다 징벌적 ‘재앙’의 뜻이 강하므로, 하나님에게 도덕적 악을 돌리는 오해를 피했습니다.
- source_word: בֵּיתוֹ
  english_pob_choice: his house
  chosen_korean: “그의 집”
  alternatives_korean:
  - “그의 가문”
  - “그의 왕조”
  - “그의 집안”
  lexicon: HALOT
  rationale: 왕실 문맥에서 ‘집’은 가문/왕조까지 포함할 수 있지만, 본문 자체의 구체적 표현을 먼저 살려 ‘집’으로 두고 함의를 열어 두었습니다.
theological_decisions:
- issue: 아합의 반응을 회개로 더 강하게 규정할지 여부
  chosen_reading: ‘스스로 낮아진’으로 번역해 본문이 말하는 행동만 제시했습니다.
  alternative_readings:
  - ‘회개한’
  - ‘복종한’
  rationale: 본문은 아합이 하나님 앞에서 자신을 낮추었다고 말할 뿐, 표준적인 회개 어휘를 쓰지 않습니다. 따라서 신학적 결론을 앞서기보다 서술 자체를 보존했습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 서술을 넘어서는 해석을 주입하지 않음
- issue: 하나님이 내리시는 הָרָעָה의 성격
  chosen_reading: ‘재앙’으로 번역했습니다.
  alternative_readings:
  - ‘악’
  - ‘재난’
  rationale: 심판 선언의 맥락에서 이는 도덕적 악이 아니라 징벌적 재앙을 뜻하므로, 하나님의 성품을 오해하지 않도록 ‘재앙’으로 옮겼습니다.
  doctrine_reference: 심판과 하나님의 의로움에 대한 문맥적 구분
