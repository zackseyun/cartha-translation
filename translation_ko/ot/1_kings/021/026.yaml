source:
  edition: WLC
  text: וַ/יַּתְעֵ֣ב מְאֹ֔ד לָ/לֶ֖כֶת אַחֲרֵ֣י הַ/גִּלֻּלִ֑ים כְּ/כֹל֙ אֲשֶׁ֣ר עָשׂ֣וּ הָ/אֱמֹרִ֔י אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/026.yaml
  text: He acted very abominably by going after idols[a], according to all that the Amorites had done[b], whom Yahweh drove out before the sons of Israel.
  footnotes:
  - marker: a
    text: Hebrew גִּלֻּלִים is a strongly contemptuous term for idols; alternatively, 'detestable idols' or more literally 'dung-idols.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites' for 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 우상들[a]을 따라가는 일로 매우 가증한 짓을 했습니다. 야훼께서 이스라엘 자손[b] 앞에서 쫓아내신 아모리 사람들이 한 모든 것과 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִּלֻּלִים는 우상을 가리키는 매우 경멸적인 말로, 직역하면 ‘배설물 우상’의 뉘앙스를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 직역은 ‘이스라엘의 아들들’이지만, 한국어 본문에서는 관용적으로 ‘이스라엘 자손’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתְעֵב מְאֹד
  english_pob_choice: acted very abominably
  chosen_korean: 매우 가증한 짓을 했습니다
  alternatives_korean:
  - 매우 가증하게 행했습니다
  - 극도로 가증한 일을 했습니다
  - 심히 혐오스러운 일을 했습니다
  lexicon: HALOT
  rationale: תעב의 강한 도덕적 혐오를 한국어의 '가증한 짓'으로 살리되, 동사의 행위성을 유지했습니다.
- source_word: לָלֶכֶת אַחֲרֵי הַגִּלֻּלִים
  english_pob_choice: by going after idols
  chosen_korean: 우상들을 따라가는 일로
  alternatives_korean:
  - 우상들을 뒤따르는 것으로
  - 우상들을 좇는 일로
  - 우상들을 따라가며
  lexicon: HALOT
  rationale: אַחֲרֵי의 추종·충성을 한국어 '따라가다'로 자연스럽게 옮기면서, גִּלֻּלִים의 경멸적 어감을 주석으로 남기기 위해 본문은 과도하게 장식하지 않았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥상 신적 고유명사를 가리키므로 전통적 대체어 '주'가 아니라 프로젝트 기본값인 '야훼'를 유지했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 관용구를 본문에서 보존하되, 한국어로는 문맥상 자연스러운 '이스라엘 자손'이 가장 직접적입니다.
theological_decisions:
- issue: התועבה(가증함)와 우상 추종의 강도
  chosen_reading: ‘매우 가증한 짓’으로 옮겨, 단순한 도덕적 실수보다 우상 숭배에 대한 언약적 혐오를 드러냈습니다.
  alternative_readings:
  - ‘매우 악한 일을 했다’
  - ‘몹시 혐오스러운 일을 했다’
  rationale: 본문의 תעב는 단순한 나쁜 행동이 아니라 하나님 앞에서의 혐오를 표현하므로, 한국어에서도 그 강도를 약화시키지 않았습니다.
  doctrine_reference: 성서적 우상숭배 비판과 언약적 순결의 언어
