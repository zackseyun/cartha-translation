  text: He acted very abominably by going after idols[a], according to all that the Amorites had done[b], whom Yahweh drove out before the sons of Israel.
  footnotes:
  - marker: a
    text: Hebrew גִּלֻּלִים is a strongly contemptuous term for idols; alternatively, 'detestable idols' or more literally 'dung-idols.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites' for 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼께서 이스라엘 자손[b] 앞에서 쫓아내신 아모리 사람들이 행한 모든 것대로 우상들[a]을 따라가며 매우 가증하게 행했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִּלֻּלִים는 우상을 가리키는 매우 경멸적인 표현입니다. 문자적으로는 ‘배설물 우상’이라는 뉘앙스를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이스라엘의 아들들’입니다. 이 표현은 문맥상 이스라엘 백성을 가리킵니다.
    reason: lexical_alternative
