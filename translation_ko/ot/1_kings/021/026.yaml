theological_decisions:
- issue: התועבה(가증함)와 우상 추종의 강도
  chosen_reading: ‘매우 가증한 짓’으로 옮겨, 단순한 도덕적 실수보다 우상 숭배에 대한 언약적 혐오를 드러냈습니다.
  alternative_readings:
