base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/013.yaml
  text: Then the two worthless men came in and sat opposite him[a], and the worthless men testified against Naboth before the people, saying, “Naboth cursed God and the king.” So they brought him outside the city and stoned him with stones[b], and he died.
  footnotes:
  - marker: a
    text: Hebrew literally, 'sons of Belial' / 'men of Belial,' an idiom for worthless or wicked men.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'blessed,' used here as a euphemism for 'cursed' in an accusation of blasphemy.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그 두 불량한 사람이 들어와 나봇을 마주 보고 앉았습니다[a]. 그 불량한 사람들이 백성 앞에서 나봇에게 불리한 증언을 하며 말했습니다. “나봇이 하나님과 왕을 저주했습니다.”[b] 그래서 그들은 그를 성 밖으로 끌어내어 돌로 쳤고, 그는 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문자적으로는 ‘벨리알의 아들들/사람들’이며, 무가치하거나 사악한 사람들을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘축복했다’라고 되어 있으나, 여기서는 신과 왕을 저주했다는 고발에서 ‘저주했다’를 완곡하게 표현한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בְלִיַּעַל / אַנְשֵׁי הַבְּלִיַּעַל
  english_pob_choice: worthless men
  chosen_korean: 무가치한 사람들
  alternatives_korean:
  - 불량한 사람들
  - 사악한 사람들
  - 벨리알의 아들들
  lexicon: HALOT
  rationale: 히브리어 관용구는 혈통이 아니라 도덕적으로 타락하고 쓸모없는 자들을 가리키므로, 본문에서는 의미를 살린 ‘무가치한 사람들’로 옮기고, 직역 대안은 각주로 보존합니다.
- source_word: נֶגְדּוֹ
  english_pob_choice: opposite him
  chosen_korean: 그 앞에
  alternatives_korean:
  - 맞은편에
  - 그의 정면에
  - 그를 마주 보고
  lexicon: HALOT
  rationale: 재판 장면의 배치 관계를 자연스럽게 드러내면서도, 히브리어의 ‘마주함’이라는 공간적 의미를 보존하는 표현입니다.
- source_word: וַיְעִדֻהוּ
  english_pob_choice: testified against
  chosen_korean: 증언하여
  alternatives_korean:
  - 그를 증언하여
  - 그에게 불리하게 증언하여
  - 그를 고발하여
  lexicon: HALOT
  rationale: 법정적 증언 행위가 핵심이므로 ‘증언하여’로 옮기되, 앞뒤 문맥이 이미 불리한 증언임을 분명히 하므로 추가 설명은 본문에 넣지 않았습니다.
- source_word: בֵּרַךְ
  english_pob_choice: cursed
  chosen_korean: 저주했습니다
  alternatives_korean:
  - 복을 빌었습니다
  - 축복했습니다
  - 저주하였습니다
  lexicon: HALOT
  rationale: 히브리어는 경외적 완곡법으로 ‘축복하다’라는 형식을 쓰지만 실제 법정 혐의는 ‘저주하다’이므로, 본문은 의미역으로 처리하고 완곡법 정보는 각주에 둡니다.
theological_decisions:
- issue: בֵּרַךְ의 완곡법을 한국어 본문에서 어떻게 처리할지
  chosen_reading: 법정 혐의의 실제 의미를 따라 ‘저주했습니다’로 번역했습니다.
  alternative_readings:
  - ‘축복했습니다’로 직역하고 각주로 완곡법을 설명함
  - ‘복을 빌었습니다’처럼 완곡하게 옮김
  rationale: 이 본문은 나봇이 하나님과 왕을 모독했다는 고발의 내용이 핵심이므로, 독자가 실제 혐의를 즉시 이해하도록 직역형 완곡어 대신 의미역을 선택했습니다.
  doctrine_reference: Translation philosophy §1, §3
