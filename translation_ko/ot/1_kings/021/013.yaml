revisions:
- from: 그때 그 무가치한 두 사람이 들어와 그 앞에 앉았고[a], 그 무가치한 사람들이 백성 앞에서 나봇을 증언하여 말하기를 “나봇이 하나님과 왕을 저주했습니다.” 하였습니다. 그래서 그를 성 밖으로 끌어내어 돌로 쳤으며[b], 그가 죽었습니다.
  to: 그때 그 두 불량한 사람이 들어와 나봇을 마주 보고 앉았습니다[a]. 그 불량한 사람들이 백성 앞에서 나봇에게 불리한 증언을 하며 말했습니다. “나봇이 하나님과 왕을 저주했습니다.”[b] 그래서 그들은 그를 성 밖으로 끌어내어 돌로 쳤고, 그는 죽었습니다.
  rationale: 나봇을 상대로 한 법정 증언이라는 원문의 의미를 분명히 하고, 나봇을 마주 보고 앉은 공간적 배치를 명료하게 했습니다. 가장 중요한 구조적 수정으로, 완곡법 관련 각주를 ‘저주했습니다’에 정확히 연결하고 그 내용을 영어 POB 감사 기록 및 히브리어 בֵּרַךְ에 맞게 바로잡았습니다. 돌로 친 행위는 본문에 충실하게 유지하되, 원어의 신학적·어휘적 쟁점이 아닌 단순한 명시적 도구 표현에는 별도 각주를 두지 않았습니다.
