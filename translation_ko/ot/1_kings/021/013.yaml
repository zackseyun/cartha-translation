  source_fidelity: 본문의 사건 순서와 핵심 의미는 대체로 충실합니다. 다만 וַיְעִדֻהוּ는 나봇에게 불리한 법정 증언을 뜻하므로 ‘나봇을 증언하여’는 목적어 관계가 불명확하고 한국어로도 부자연스럽습니다. 또한 בֵּרַךְ의 완곡법을 설명해야 하는 각주가 ‘돌들로’라는 표현에 잘못 연결되어 있어, 각주 표지와 내용이 원어 및 영어 POB 감사 기록에 맞지 않습니다.
  naturalness: ‘그 앞에’는 선행 대상이 문맥상 나봇이지만 다소 모호하므로 ‘나봇을 마주 보고’가 더 명료합니다. ‘나봇에게 불리한 증언을 하며’는 법정 문맥과 현대 표준 한국어에 자연스럽습니다. 합쇼체 서술도 일관되게 유지했습니다.
  terminology: ‘불량한 사람들’은 בְּנֵי/אַנְשֵׁי בְלִיַּעַל의 관용적·도덕적 비난 의미를 자연스럽게 전달하며, ‘벨리알의 아들들/사람들’은 각주에 보존했습니다. ‘저주했습니다’는 이 고발 문맥에서 בֵּרַךְ의 완곡적 표기를 의미에 따라 옮긴 것입니다.
