id: 1KI.21.22
reference: 1 Kings 21:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּ֣י אֶת בֵּיתְ/ךָ֗ כְּ/בֵית֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט וּ/כְ/בֵ֖ית בַּעְשָׁ֣א בֶן אֲחִיָּ֑ה אֶל הַ/כַּ֨עַס֙ אֲשֶׁ֣ר הִכְעַ֔סְתָּ וַֽ/תַּחֲטִ֖א אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/022.yaml
  text: And I will make your house like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a], because of the provocation with which you have provoked me and caused Israel to sin.
  footnotes:
  - marker: a
    text: Or 'your dynasty.' Hebrew 'house' here refers to Ahab's royal line.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 네 집을 느밧의 아들 여로보암의 집처럼, 또 아히야의 아들 바아사의 집처럼 만들겠습니다<a>. 이는 네가 나를 격분시켰고 이스라엘이 죄를 짓게 했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 왕조’. 여기서 ‘집’은 아합의 왕통을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: And I will make
  chosen_korean: 내가 ... 만들겠습니다
  alternatives_korean:
  - 내가 ... 주겠습니다
  - 내가 ... 두겠습니다
  lexicon: HALOT
  rationale: 심판 선언 공식에서 נתן은 결과 상태를 가리키는 ‘만들다’가 자연스럽고, 왕조 붕괴의 문맥을 가장 잘 드러냅니다.
- source_word: בֵּיתְךָ / כְּבֵית ... וּכְבֵית
  english_pob_choice: your house / like the house of ... and like the house of
  chosen_korean: 네 집을 ...의 집처럼, 또 ...의 집처럼
  alternatives_korean:
  - 네 왕조를 ...처럼
  - 네 가문을 ...처럼
  lexicon: HALOT
  rationale: בַּיִת의 비유를 살리기 위해 ‘집’을 유지했습니다. 여기서는 문자적 건물이 아니라 왕가/왕통을 가리키지만, 본문의 표상을 보존하는 것이 중요합니다.
- source_word: אֶל הַכַּעַס אֲשֶׁר הִכְעַסְתָּ
  english_pob_choice: because of the provocation with which you have provoked me
  chosen_korean: 이는 네가 나를 격분시켰기 때문에
  alternatives_korean:
  - 이는 네가 나를 진노하게 했기 때문에
  - 이는 네가 나를 분노하게 했기 때문에
  lexicon: HALOT
  rationale: כעס의 히필은 단순 감정이 아니라 ‘격분시키다/노하게 하다’의 의미이므로, 원문의 도발적 뉘앙스를 살려 ‘격분시켰다’로 옮겼습니다.
- source_word: וַתַּחֲטִא אֶת יִשְׂרָאֵל
  english_pob_choice: and caused Israel to sin
  chosen_korean: 이스라엘이 죄를 짓게 했기
  alternatives_korean:
  - 이스라엘을 죄짓게 했기
  - 이스라엘을 죄로 이끌었기
  lexicon: HALOT
  rationale: חטא의 히필은 ‘죄를 짓게 하다’이므로, 한국어에서도 원인의 직접성을 분명히 하는 표현을 택했습니다.
theological_decisions:
- issue: 하나님이 직접 말씀하시는 1인칭 재현
  chosen_reading: ‘나를 격분시켰고’로 1인칭 목적어를 명시했습니다.
  alternative_readings:
  - 목적어를 생략해 ‘격분시켰고’로만 번역
  rationale: 문맥상 발화자는 야훼이므로, 히브리어에 드러나지 않은 목적어를 한국어에서 명시해도 의미를 넘어서지 않으며 독자가 심판의 대상이 누구인지 분명히 이해하도록 돕습니다.
  doctrine_reference: Translation philosophy §1, §6
