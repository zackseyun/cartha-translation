  lexicon: HALOT
  rationale: אַט는 조용함, 완만함, 억제된 움직임을 가리키므로, 과도한 해석을 피하면서 문맥상 낮아진 태도를 전달하는 표현으로 옮겼습니다.
theological_decisions:
- issue: 아합의 반응의 성격
  chosen_reading: 겉으로 드러난 애도와 낮춤의 행동만 묘사하고, 그의 내적 회개가 진실한지 여부는 단정하지 않았습니다.
  alternative_readings:
  - 아합이 참되게 회개했다
  - 아합은 외적인 애도만 보였다
  rationale: 히브리어 본문은 옷을 찢고, 굵은 베를 두르고, 금식하고, 눕고, 조용히 다니는 행위만 제시하며 내면 평가는 하지 않으므로, 번역도 그 긴장을 그대로 남겼습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 범위를 넘어 신학적 판단을 덧씌우지 않음'
