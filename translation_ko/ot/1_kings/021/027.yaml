source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אַחְאָ֜ב אֶת הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ וַ/יִּקְרַ֣ע בְּגָדָ֔י/ו וַ/יָּֽשֶׂם שַׂ֥ק עַל בְּשָׂר֖/וֹ וַ/יָּצ֑וֹם וַ/יִּשְׁכַּ֣ב בַּ/שָּׂ֔ק וַ/יְהַלֵּ֖ךְ אַֽט־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/027.yaml
  text: And it happened[a], when Ahab heard these words, that he tore his clothes and put sackcloth on his flesh and fasted and lay in sackcloth and went about softly.
  footnotes:
  - marker: a
    text: Or 'went about quietly,' 'walked softly,' or 'went about dejectedly.' The Hebrew suggests subdued, humbled movement.
    reason: lexical_alternative
translation:
  language: ko
  text: 아합이 이 말들을 듣자 자기 옷을 찢고, 자기 살에 굵은 베를 두르고, 금식하며, 굵은 베를 입은 채 눕고, 조용히 다녔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אַט은 ‘조용히’, ‘천천히’, ‘침울하게’ 등으로도 옮길 수 있습니다. 문맥상 낮아지고 절제된 움직임을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  english_pob_choice: And it happened, when ... heard
  chosen_korean: 아합이 이 말들을 듣자
  alternatives_korean:
  - 그리고 ...가 이 말들을 들었을 때
  - 이 일이 일어났는데, ...가 들었을 때
  lexicon: WLC / HALOT
  rationale: 히브리어 서사 공식을 자연스러운 한국어 시간 표현으로 옮기되, 사건 전개를 드러내는 기본 서술 느낌은 유지했습니다.
- source_word: הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: these words
  chosen_korean: 이 말들을
  alternatives_korean:
  - 이것들을
  - 이 일들을
  lexicon: HALOT
  rationale: 엘리야의 선포가 직접 언급된 문맥이므로, ‘말들’이 원문의 언어적 힘을 가장 잘 살립니다.
- source_word: וַיָּשֶׂם שַׂק עַל בְּשָׂרוֹ
  english_pob_choice: put sackcloth on his flesh
  chosen_korean: 자기 살에 굵은 베를 두르고
  alternatives_korean:
  - 자기 몸에 굵은 베를 입고
  - 자기 살에 베옷을 걸치고
  lexicon: HALOT
  rationale: שַׂק은 애도용 베옷이므로 ‘굵은 베’로 옮겼고, בָּשָׂר의 직역감은 살렸지만 한국어에서 더 자연스러운 동사 ‘두르다’를 택했습니다.
- source_word: וַיְהַלֵּךְ אַט
  english_pob_choice: went about softly
  chosen_korean: 조용히 다녔습니다
  alternatives_korean:
  - 조심스럽게 다녔습니다
  - 느리게 다녔습니다
  - 침울하게 다녔습니다
  lexicon: HALOT
  rationale: אַט는 조용함, 완만함, 억제된 움직임을 가리키므로, 과도한 해석을 피하면서 문맥상 낮아진 태도를 전달하는 표현으로 옮겼습니다.
theological_decisions:
- issue: 아합의 반응의 성격
  chosen_reading: 겉으로 드러난 애도와 낮춤의 행동만 묘사하고, 그의 내적 회개가 진실한지 여부는 단정하지 않았습니다.
  alternative_readings:
  - 아합이 참되게 회개했다
  - 아합은 외적인 애도만 보였다
  rationale: 히브리어 본문은 옷을 찢고, 굵은 베를 두르고, 금식하고, 눕고, 조용히 다니는 행위만 제시하며 내면 평가는 하지 않으므로, 번역도 그 긴장을 그대로 남겼습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 범위를 넘어 신학적 판단을 덧씌우지 않음'
