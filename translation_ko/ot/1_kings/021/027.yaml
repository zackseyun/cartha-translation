base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/027.yaml
  text: And it happened[a], when Ahab heard these words, that he tore his clothes and put sackcloth on his flesh and fasted and lay in sackcloth and went about softly.
  footnotes:
  - marker: a
    text: Or 'went about quietly,' 'walked softly,' or 'went about dejectedly.' The Hebrew suggests subdued, humbled movement.
    reason: lexical_alternative
translation:
  language: ko
  text: 아합이 이 말들을 듣자, 자기 옷을 찢고 맨살에 굵은 베옷을 두르고 금식했으며, 굵은 베옷을 입은 채 누워 조용히 다녔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אַט은 ‘조용히’, ‘천천히’, ‘침울하게’ 등으로도 옮길 수 있습니다. 문맥상 낮아지고 절제된 움직임을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  english_pob_choice: And it happened, when ... heard
  chosen_korean: 아합이 이 말들을 듣자
  alternatives_korean:
