    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ צ֑וֹם
  english_pob_choice: They proclaimed a fast
  chosen_korean: 금식을 선포하고
  alternatives_korean:
  - 금식을 공포하고
  - 금식을 알리고
  lexicon: HALOT
  rationale: קָרָא + צום은 단순한 ‘부르다’보다 공적인 금식 선언을 뜻하므로, 한국어에서는 공식적 행위를 드러내는 ‘선포하다’가 가장 자연스럽습니다.
- source_word: וְהֹשִׁ֥יבוּ
  english_pob_choice: and seated
  chosen_korean: 앉혔습니다
  alternatives_korean:
  - 자리하게 했습니다
  - 앉게 했습니다
  - 배치했습니다
  lexicon: HALOT
  rationale: 히필형 ישב는 ‘앉게 하다/앉히다’의 의미이므로, 본문의 강제적·의례적 배치를 드러내는 ‘앉혔습니다’가 적절합니다.
- source_word: בְּ/רֹ֥אשׁ הָ/עָֽם
  english_pob_choice: at the head of the people
  chosen_korean: 백성의 머리 자리에
  alternatives_korean:
  - 백성의 맨 앞자리에
  - 백성 앞자리에
  - 백성의 으뜸 자리에
  lexicon: HALOT
  rationale: בְּרֹאשׁ은 문자적으로 ‘머리/앞’이므로, POB의 직역적 이미지를 살리되 한국어로는 이해 가능한 ‘머리 자리’로 옮겼습니다.
theological_decisions:
- issue: 공적 모욕과 수치의 연출
  chosen_reading: 이 구절은 단순한 좌석 배치가 아니라 공적 재판/의례 속에서 나봇을 드러내어 놓는 수치의 장면으로 읽었습니다.
  alternative_readings:
  - 단순히 명예로운 상석에 앉힌 것으로 읽는 해석
  rationale: 문맥상 금식 선포와 함께 특정 인물을 ‘백성의 머리 자리’에 앉히는 것은 사건 전개의 의도된 연출을 가리키므로, 그 긴장을 약화시키지 않도록 옮겼습니다.
  doctrine_reference: 서사 문맥 해석
