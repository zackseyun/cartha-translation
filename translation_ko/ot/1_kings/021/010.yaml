  text: And seat two worthless men opposite him[a], and let them testify against him, saying, ‘You have cursed God and the king.’ Then bring him out and stone him, so that he dies.
  footnotes:
  - marker: a
    text: Hebrew literally, 'You have blessed God and the king.' Here 'blessed' is a euphemistic way of saying 'cursed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 불량한 자들 두 사람을 그 맞은편에 앉히고, 그들이 ‘당신이 하나님과 왕을 저주하였습니다’라고 그에게 불리하게 증언하게 하십시오[a]. 그 뒤에 그를 데리고 나가 돌로 쳐 죽이십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신이 하나님과 왕을 축복하였습니다’라고 되어 있습니다. 여기서 ‘축복하다’는 ‘저주하다’를 완곡하게 이르는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשִׁיבוּ
  english_pob_choice: seat
  chosen_korean: 앉히고
  alternatives_korean:
