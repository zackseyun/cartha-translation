id: 1KI.21.10
reference: 1 Kings 21:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/הוֹשִׁיבוּ שְׁנַ֨יִם אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ נֶגְדּ/וֹ֒ וִ/יעִדֻ֣/הוּ לֵ/אמֹ֔ר בֵּרַ֥כְתָּ אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וְ/הוֹצִיאֻ֥/הוּ וְ/סִקְלֻ֖/הוּ וְ/יָמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/010.yaml
  text: And seat two worthless men opposite him[a], and let them testify against him, saying, ‘You have cursed God and the king.’ Then bring him out and stone him, so that he dies.
  footnotes:
  - marker: a
    text: Hebrew literally, 'You have blessed God and the king.' Here 'blessed' is a euphemistic way of saying 'cursed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 두 사람의 무가치한 자를 그 맞은편에 앉히고, 그가 「하나님과 왕을 저주하였습니다」라고 증언하게 하십시오. 그런 다음 그를 끌어내어 돌로 쳐서 죽이십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹשִׁיבוּ
  english_pob_choice: seat
  chosen_korean: 앉히고
  alternatives_korean:
  - 자리에 앉히고
  - 세우고
  lexicon: HALOT
  rationale: 히필 명령/청유로서 ‘앉게 하다’의 사역 의미를 살려, 현대 한국어에서도 자연스러운 ‘앉히고’로 옮겼습니다.
- source_word: שְׁנַיִם אֲנָשִׁים בְּנֵי בְלִיַּעַל
  english_pob_choice: two worthless men
  chosen_korean: 두 사람의 무가치한 자
  alternatives_korean:
  - 두 사람의 악한 자
  - 두 사람의 불량한 자
  - 두 사람의 불량배
  lexicon: HALOT
  rationale: 법정용으로 동원된 부패한 인물을 가리키는 관용구를, 도덕적 타락과 무가치함을 드러내면서도 과도하게 속어화하지 않도록 ‘무가치한 자’로 옮겼습니다.
- source_word: וִיעִדֻהוּ
  english_pob_choice: let them testify against him
  chosen_korean: 증언하게 하십시오
  alternatives_korean:
  - 그에게 불리하게 증언하게 하십시오
  - 그를 고발하게 하십시오
  lexicon: HALOT
  rationale: 법정 맥락의 ‘증언하다’ 의미를 살려, 영어 POB의 증언 against him을 자연스럽게 반영했습니다.
- source_word: בֵּרַכְתָּ אֱלֹהִים וָמֶלֶךְ
  english_pob_choice: You have cursed God and the king.
  chosen_korean: 하나님과 왕을 저주하였습니다
  alternatives_korean:
  - 하나님과 왕을 저주했습니다
  - 하나님과 왕을 욕하였습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘복을 빌다’이지만 여기서는 완곡법으로 ‘저주하다’를 뜻하므로, 본문 의미를 드러내는 한국어를 택했습니다. POB의 각주 취지를 반영해 literal 의미는 본문에 넣지 않았습니다.
- source_word: וְהוֹצִיאֻהוּ וְסִקְלֻהוּ
  english_pob_choice: Then bring him out and stone him
  chosen_korean: 그를 끌어내어 돌로 쳐서
  alternatives_korean:
  - 그를 밖으로 끌어내어 돌로 치고
  - 그를 끌어내어 돌을 던져
  lexicon: HALOT
  rationale: 처형 절차를 나타내는 표준 표현으로 ‘끌어내어 돌로 쳐서’가 가장 직접적이며, 형벌의 실행을 명확히 전달합니다.
theological_decisions:
- issue: 브래킥형 완곡법 בֵּרַכְתָּ의 처리
  chosen_reading: 본문에는 ‘저주하다’로 옮기고, 문자적 ‘복을 빌다’는 각주로 따로 두지 않았습니다.
  alternative_readings:
  - ‘복을 빌었습니다’로 문자적으로 옮기고 설명 각주를 달기
  - ‘축복하였다’로 옮기고 의미 각주를 달기
  rationale: 이 발화는 실제 칭송이 아니라 위조된 사형 사유이므로, 독자가 즉시 죄목의 성격을 이해하도록 의미를 우선해 번역했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
