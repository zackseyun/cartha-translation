    text: Or, more formally, “Naboth was stoned, and he died.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이세벨에게 사람을 보내며 말했습니다. 「나봇이 돌에 맞아 죽었습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, 「나봇이 돌에 맞았고, 죽었습니다」.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אֶל
  english_pob_choice: Then they sent word to
  chosen_korean: 사람을 보내며
  alternatives_korean:
  - 보내며
  - 소식을 보내며
  - 사람을 보내어
  lexicon: HALOT
  rationale: 문맥상 단순한 이동이 아니라 이세벨에게 전달할 보고를 보낸 것이므로, 한국어에서는 자연스럽게 ‘사람을 보내며’로 옮겨 메시지 전달을 드러냈습니다.
- source_word: אִיזֶבֶל
  english_pob_choice: Jezebel
  chosen_korean: 이세벨
  alternatives_korean:
  - 제이즈벨
  - 이즈벨
  lexicon: 표준 외래어 표기
  rationale: 성경 인명은 한국어 성경 관용 표기를 따르는 것이 가장 식별성이 높으므로 ‘이세벨’로 옮겼습니다.
- source_word: סֻקַּל
  english_pob_choice: has been stoned
  chosen_korean: 돌에 맞아 죽었습니다
  alternatives_korean:
  - 돌에 맞았습니다
  - 돌에 맞아 처형당했습니다
  lexicon: HALOT
  rationale: 히브리어 수동형은 돌로 치는 사형 집행을 가리키므로, 단순한 ‘맞다’보다 결과까지 분명한 ‘돌에 맞아 죽었습니다’가 본문 의도를 가장 잘 전달합니다.
- source_word: וַיָּמֹת
  english_pob_choice: and he is dead
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 그리고 죽었습니다
  - 그리고 이미 죽었습니다
  lexicon: HALOT
  rationale: 영어 POB가 결과 상태를 살렸지만, 한국어에서는 앞 절과 결합해 종결적으로 ‘죽었습니다’라고 옮기면 자연스럽고 원문의 완료된 결과를 충분히 반영합니다.
theological_decisions:
- issue: 살해 사실을 전하는 보고문의 문체
  chosen_reading: 직접적이고 건조한 보고문으로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘처형되었습니다’로 순화
  - 서사성을 높여 감정적 표현을 추가
  rationale: 본문은 이세벨에게 전달되는 사실 보고이므로, 의미를 약화시키지 않도록 건조하고 직접적인 표현을 유지했습니다.
  doctrine_reference: 본문 서술의 사실성 보존
