review_pass:
  verdict: revise
  source_fidelity: 원문의 ‘보내다’는 보고를 전달한 행위를 뜻하므로 ‘사람을 보내어’는 문맥상 가능하지만, 본문이 명시하지 않은 전달자(사람)를 보충합니다. 또한 ‘돌에 맞아 죽었습니다’는 자연스럽지만 수동형 ‘돌에 맞았다’와 이어지는 ‘죽었다’를 하나의 인과 표현으로 합칩니다. 이를 본문에서는 두 동작으로 분명히 구별하는 편이 더 충실합니다.
  naturalness: ‘그들은 이세벨에게 사람을 보내며 말했습니다’는 ‘-며’가 동시 행동처럼 들리고 다소 부자연스럽습니다. ‘소식을 전했습니다’와 ‘이렇게’라는 보고 도입 표현이 현대 한국어 합쇼체 서술에 자연스럽습니다.
  terminology: ‘이세벨’, ‘나봇’은 한국어 성경 인명 관용에 맞습니다. ‘돌에 맞았습니다’는 סֻקַּל의 수동성을 보존하며, 뒤의 ‘죽었습니다’와 함께 돌로 인한 처형이라는 문맥을 충분히 드러냅니다.
  issues:
  - severity: medium
    issue: ‘사람을 보내며’가 원문에 없는 전달자를 명시하고, 연결 표현도 부자연스럽습니다.
    rationale: וַיִּשְׁלְחוּ는 목적어를 명시하지 않으며, 문맥상 ‘소식을 보내다/전하다’로 자연스럽게 옮길 수 있습니다. ‘-며’ 대신 보고를 도입하는 종결 서술을 쓰는 편이 적절합니다.
  - severity: medium
    issue: ‘돌에 맞아 죽었습니다’가 두 개의 원문 동사를 인과적으로 결합합니다.
    rationale: סֻקַּל은 ‘돌에 맞았다/돌로 쳐졌다’이고, 이어지는 וַיָּמֹת은 ‘그가 죽었다’입니다. 한국어에서도 두 서술어를 분리하여 원문의 전개와 수동태를 보존하는 것이 안전합니다.
  - severity: low
