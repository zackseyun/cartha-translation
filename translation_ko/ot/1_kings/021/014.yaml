    rationale: 각주는 ‘돌에 맞았습니다’라는 표현에 직접 붙여, 해당 어휘의 대안을 분명히 가리키게 해야 합니다.
  revised_text: 그들은 이세벨에게 소식을 전했습니다. “나봇이 돌에 맞았습니다[a]. 그리고 죽었습니다.”
