    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 말씀이 디셉 사람 엘리야에게 임했습니다. 말씀은 이러했습니다:[a]
  philosophy: optimal-equivalence
  footnotes:
