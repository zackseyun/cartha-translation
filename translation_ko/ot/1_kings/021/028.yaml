lexical_decisions:
- source_word: וַיְהִי דְּבַר יְהוָה
  english_pob_choice: And the word of Yahweh came
  chosen_korean: 여호와의 말씀이 … 임하여
  alternatives_korean:
  - 여호와의 말씀이 … 왔습니다
  - 여호와의 말씀이 … 이르렀습니다
  lexicon: HALOT
  rationale: 예언자에게 임하는 계시 공식을 한국어에서 가장 자연스럽고 성경적으로 읽히는 표현으로 옮겼습니다. ‘임하다’는 מקור의 도착·도달 감각을 살리면서도 너무 구어적이지 않습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
  rationale: 이 구절의 영어 POB는 이름의 직접 음역인 ‘Yahweh’를 채택하지만, 한국어 본문은 이 프로젝트의 공용 용어를 따라 ‘여호와’로 표기했습니다. 본문 자체는 예언 공식의 가독성을 우선했습니다.
- source_word: אֵלִיָּהוּ הַתִּשְׁבִּי
  english_pob_choice: Elijah the Tishbite
  chosen_korean: 디셉 사람 엘리야
  alternatives_korean:
  - 디셉 사람 엘리야 선지자
  - 디셉의 엘리야
  lexicon: HALOT
  rationale: הַתִּשְׁבִּי를 전통적 지명형으로 풀어 ‘디셉 사람’으로 옮겼습니다. ‘엘리야’는 한국어에서 확립된 고유명사 형태를 따랐습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르셨습니다
  - 말하기를
  lexicon: HALOT
  rationale: 히브리어의 לֵאמֹר는 뒤에 이어질 직접 화자를 여는 표지이므로, 한국어에서는 서술을 끊지 않고 ‘말씀하셨습니다’로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 주어진 본문이 시작하는 예언자적 계시 공식의 처리
  chosen_reading: 예언자에게 임하는 하나님의 말씀이라는 기능을 드러내기 위해 ‘여호와의 말씀이 … 임하여 말씀하셨습니다’로 옮겼습니다.
  alternative_readings:
  - 여호와의 말씀이 … 왔습니다
  - 여호와께서 엘리야에게 말씀하셨습니다
  rationale: 단순한 이동 서술보다 계시의 주체성과 선지자 수신성을 함께 드러내는 공식을 유지하는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: 예언자적 계시 공식
