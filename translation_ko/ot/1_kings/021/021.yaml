  text: הִנְ/נִ֨י מבי אֵלֶ֨י/ךָ֙ רָעָ֔ה וּ/בִעַרְתִּ֖י אַחֲרֶ֑י/ךָ וְ/הִכְרַתִּ֤י לְ/אַחְאָב֙ מַשְׁתִּ֣ין בְּ/קִ֔יר וְ/עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/021.yaml
  text: Behold[a], I am bringing disaster upon you, and I will sweep away after you, and I will cut off from Ahab every male, both bond and free in Israel.
  footnotes:
  - marker: a
    text: Hebrew literally, 'every one who urinates against a wall,' a coarse idiom meaning every male.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 당신에게 재앙을 가져오겠습니다. 내가 당신 뒤의 것을 쓸어버리겠습니다. 그리고 이스라엘에서 아합에게 속한 모든 남자, 곧 묶인 자나 풀린 자를 끊어버리겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘벽에 오줌 누는 모든 자’라는 거친 관용구로, 남자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  - 이제 보십시오
  lexicon: HALOT
  rationale: 예언적 선포의 엄숙한 도입을 살리면서도 현대 한국어 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: רָעָה
  english_pob_choice: I am bringing disaster
  chosen_korean: 재앙을 가져오겠습니다
  alternatives_korean:
  - 재난을 가져오겠습니다
  - 해를 가져오겠습니다
  - 악을 가져오겠습니다
  lexicon: HALOT
  rationale: 여기서는 도덕적 ‘악’이 아니라 심판으로 내리는 재난·재앙의 뜻이므로, 문맥상 가장 분명한 ‘재앙’으로 옮겼습니다.
- source_word: וּבִעַרְתִּי אַחֲרֶיךָ
  english_pob_choice: I will sweep away after you
  chosen_korean: 당신 뒤의 것을 쓸어버리겠습니다
  alternatives_korean:
  - 당신 뒤를 쓸어버리겠습니다
  - 당신의 후손을 쓸어버리겠습니다
  - 당신 뒤를 제거하겠습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘뒤에 있는 것’을 쓸어 없앤다는 관용구이므로, 본문에 명시된 범위를 유지하면서도 한국어로는 자연스럽게 표현했습니다.
- source_word: מַשְׁתִּין בְּקִיר
  english_pob_choice: every male
  chosen_korean: 모든 남자
  alternatives_korean:
  - 벽에 오줌 누는 자마다
  - 모든 남성
  - 남자마다
  lexicon: HALOT
  rationale: 거친 히브리어 관용구의 직접 번역은 각주로 남기고, 본문은 그 의도를 분명히 드러내는 ‘모든 남자’로 옮겼습니다.
- source_word: וְעָצוּר וְעָזוּב
  english_pob_choice: both bond and free
  chosen_korean: 묶인 자나 풀린 자
  alternatives_korean:
  - 노예나 자유인
  - 붙잡힌 자나 버려진 자
  - 종이나 자유인
  lexicon: HALOT
  rationale: 이 대구는 모든 예외를 포괄하는 말이므로, 본문의 총체성을 살리면서도 한국어에서 이해하기 쉬운 ‘묶인 자나 풀린 자’로 옮겼습니다.
theological_decisions:
- issue: 하나님이 내리시는 רָעָה의 의미
  chosen_reading: 재앙
  alternative_readings:
  - 악
  - 해
  - 재난
  rationale: 하나님을 도덕적 악의 행위자로 오해하게 만들지 않으면서, 언약적 심판의 엄중함을 분명히 드러내는 번역을 택했습니다.
  doctrine_reference: 원문 우선 원칙; 심판 맥락에서의 רָעָה 의미 구분
- issue: 예언 선포문의 화자 태도와 한국어 높임말
  chosen_reading: 합쇼체의 직접 선포형
  alternative_readings:
  - 평서체
  - 명령형
  - 고어체
  rationale: 예언적 선언의 장중함은 유지하되, 현대 한국어 공역문으로 읽힐 수 있도록 합쇼체를 사용했습니다.
  doctrine_reference: 표준어 현대 문체 원칙
