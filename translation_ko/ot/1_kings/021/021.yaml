base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/021.yaml
  text: Behold[a], I am bringing disaster upon you, and I will sweep away after you, and I will cut off from Ahab every male, both bond and free in Israel.
  footnotes:
  - marker: a
    text: Hebrew literally, 'every one who urinates against a wall,' a coarse idiom meaning every male.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 당신에게 재앙을 내리겠습니다. 내가 당신 뒤를 쓸어 없애겠습니다. 그리고 이스라엘 가운데서 아합에게 속한 모든 남자, 곧 붙들린 자나 버려진 자를 끊어 버리겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘벽에 오줌 누는 모든 자’라는 거친 관용구로, 남자를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘붙들린 자나 버려진 자’의 정확한 관용적 뜻은 불확실합니다. 이 문맥에서는 아무도 남기지 않겠다는 포괄적 표현으로 이해되기도 합니다.
    reason: translation_uncertainty
