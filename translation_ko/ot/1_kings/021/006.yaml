  text: וַ/יְדַבֵּ֣ר אֵלֶ֗י/הָ כִּֽי אֲ֠דַבֵּר אֶל נָב֨וֹת הַ/יִּזְרְעֵאלִ֜י וָ/אֹ֣מַר ל֗/וֹ תְּנָ/ה לִּ֤/י אֶֽת כַּרְמְ/ךָ֙ בְּ/כֶ֔סֶף א֚וֹ אִם חָפֵ֣ץ אַתָּ֔ה אֶתְּנָה לְ/ךָ֥ כֶ֖רֶם תַּחְתָּ֑י/ו וַ/יֹּ֕אמֶר לֹֽא אֶתֵּ֥ן לְ/ךָ֖ אֶת כַּרְמִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/006.yaml
  text: And he spoke to her, because I spoke to Naboth the Jezreelite and said to him, ‘Give me your vineyard for silver, or, if you prefer, I will give you a vineyard in place of it,’ but he said, ‘I will not give you my vineyard.’
translation:
  language: ko
  text: 그리고 그가 그녀에게 말했습니다. “내가 이스르엘 사람 나봇에게 말하여 그에게 ‘은으로 네 포도원을 내게 주시오. 아니면, 당신이 원하시면 내가 그 대신 포도원을 드리겠습니다’라고 했으나, 그는 ‘나는 내 포도원을 당신에게 주지 않겠습니다’라고 말했습니다.”
  philosophy: formal
lexical_decisions:
- source_word: וַיְדַבֵּר ... אֵלֶיהָ
  english_pob_choice: And he spoke to her
  chosen_korean: 그리고 그가 그녀에게 말했습니다
  alternatives_korean:
  - 그리고 그가 그녀에게 이야기했습니다
  - 그리고 그가 그녀와 말했습니다
  lexicon: דבר
  rationale: 히브리어 동사 דִּבֵּר의 기본 의미를 직역하되, 현대 표준어로 자연스러운 ‘말했습니다’를 택했습니다.
- source_word: כִּי
  english_pob_choice: because
  chosen_korean: —
  alternatives_korean:
  - 왜냐하면
  - 그 이유는
  lexicon: כי
  rationale: 문맥상 뒤이어 나오는 직접화법 전체가 ‘그가 그녀에게 말한’ 이유를 설명하므로, 한국어에서는 자연스러운 종속 연결로 풀어 과도한 접속어를 넣지 않았습니다.
- source_word: אֶת כַּרְמְךָ / אֶת כַּרְמִי
  english_pob_choice: your vineyard / my vineyard
  chosen_korean: 네 포도원 / 내 포도원
  alternatives_korean:
  - 당신의 포도원 / 나의 포도원
  - 그대의 포도원 / 제 포도원
  lexicon: כרם
  rationale: 포도원을 뜻하는 כֶּרֶם은 문맥상 실제 재산으로서의 소유 포도원이며, 인칭 대명사는 상대에게는 ‘네’, 화자에게는 ‘내’로 간결하게 옮겼습니다.
- source_word: תְּנָה לִּי ... בְּכֶסֶף / אֶתְּנָה לְךָ
  english_pob_choice: Give me ... for silver / I will give you ... in place of it
  chosen_korean: 은으로 네 포도원을 내게 주시오 / 당신이 원하시면 내가 그 대신 포도원을 드리겠습니다
  alternatives_korean:
  - 은값으로 네 포도원을 내게 주십시오 / 원하시면 내가 그 대신 포도원을 드리겠습니다
  - 은을 받고 네 포도원을 내게 주시오 / 네가 원하면 내가 그 자리에 포도원을 주겠소
  lexicon: כסף
  rationale: בְּכֶסֶף는 ‘은으로/은값으로’의 거래 대가를 나타내므로 ‘은으로’로 직역했고, אֶתְּנָה לְךָ כֶרֶם תַּחְתָּיו는 ‘그 대신 포도원’을 통해 교환 제안을 분명히 했습니다.
theological_decisions:
- issue: 직접화법 안의 대등한 제안과 거절의 힘을 살릴지 여부
  chosen_reading: 거래 제안과 나봇의 단호한 거절을 모두 직접화법으로 유지했습니다.
  alternative_readings:
  - 서술로 압축해 ‘그는 은을 주고 포도원을 달라고 했으나 거절당했다’로 정리
  - 부드러운 표현으로 완화
  rationale: 본문은 아합의 요구와 나봇의 거절을 인용문 안에서 대조적으로 제시하여 서사적 긴장을 형성하므로, 그 구조를 보존하는 것이 원문의 의도를 가장 잘 드러냅니다.
  doctrine_reference: 서사 본문 구조 보존
