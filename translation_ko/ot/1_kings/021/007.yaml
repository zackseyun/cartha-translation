  edition: WLC
  text: וַ/תֹּ֤אמֶר אֵלָי/ו֙ אִיזֶ֣בֶל אִשְׁתּ֔/וֹ אַתָּ֕ה עַתָּ֛ה תַּעֲשֶׂ֥ה מְלוּכָ֖ה עַל יִשְׂרָאֵ֑ל ק֤וּם אֱכָל לֶ֨חֶם֙ וְ/יִטַ֣ב לִבֶּ֔/ךָ אֲנִי֙ אֶתֵּ֣ן לְ/ךָ֔ אֶת כֶּ֖רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/007.yaml
  text: Then Jezebel his wife said to him[a], “Do you now govern Israel as king? Get up, eat bread, and let your heart be cheerful[b]; I will give you the vineyard of Naboth the Jezreelite.”
  footnotes:
  - marker: a
    text: Or, 'You are now exercising kingship over Israel'—the Hebrew can be read as an assertion or taunt rather than a question.
    reason: alternative_reading
  - marker: b
    text: '''Eat bread'' is a Hebrew idiom for taking a meal.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 아합의 아내 이세벨이 그에게 말했습니다. “당신이 이제 이스라엘을 왕으로 다스리고 있습니까?[a] 일어나서 빵을 드시고[b] 마음을 즐겁게 하십시오. 내가 이스르엘 사람 나봇의 포도원을 당신에게 주겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신이 이제 이스라엘에서 왕권을 행사하고 있군요.” 히브리어는 질문으로도, 빈정대는 단언으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘빵을 먹다’는 히브리어에서 식사하다를 뜻하는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו אִיזֶבֶל אִשְׁתּוֹ
  english_pob_choice: Then Jezebel his wife said to him
  chosen_korean: 그때 아합의 아내 이세벨이 그에게 말했습니다
  alternatives_korean:
  - 이세벨, 그의 아내가 그에게 말했습니다
  - 그리고 그의 아내 이세벨이 그에게 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 서술 진행(waw-consecutive)을 자연스러운 서사 연결인 ‘그때’로 옮기고, 앱포지션 관계는 ‘아합의 아내 이세벨’로 분명하게 살렸습니다.
- source_word: אַתָּה עַתָּה תַּעֲשֶׂה מְלוּכָה עַל יִשְׂרָאֵל
  english_pob_choice: Do you now govern Israel as king?
  chosen_korean: 당신이 이제 이스라엘에서 왕노릇을 하는 것입니까?
  alternatives_korean:
  - 당신이 이제 이스라엘을 다스리는 것이 아닙니까?
  - 당신이 이제 이스라엘 위에 왕으로 군림하는 것입니까?
  lexicon: HALOT
  rationale: 문맥상 책망/비꼼이 섞인 수사적 발언으로 읽히며, מְלוּכָה는 단순 통치보다 ‘왕으로서 왕권을 행사함’의 뜻이 있어 ‘왕노릇’으로 비교적 직역에 가깝게 살렸습니다.
- source_word: אֱכָל לֶחֶם
  english_pob_choice: eat bread
  chosen_korean: 빵을 드시고
  alternatives_korean:
  - 빵을 먹고
  - 식사하시고
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서도 식사 권유로 자연스럽게 전달하되, ‘빵’의 표면 의미를 유지했습니다. 대화 상대가 왕이므로 존대형을 썼습니다.
- source_word: וְיִטַב לִבֶּךָ
  english_pob_choice: and let your heart be cheerful
  chosen_korean: 마음을 즐겁게 하십시오
  alternatives_korean:
  - 마음이 기쁘게 하십시오
  - 마음이 편안해지십시오
  lexicon: HALOT
  rationale: 직역하면 ‘네 마음이 좋게 되게 하라’는 뜻이므로, 내면 상태의 회복과 기분 전환을 드러내는 ‘마음을 즐겁게 하십시오’로 옮겼습니다.
- source_word: כֶּרֶם נָבוֹת הַיִּזְרְעֵאלִי
  english_pob_choice: the vineyard of Naboth the Jezreelite
  chosen_korean: 나봇, 이스르엘 사람의 포도원
  alternatives_korean:
  - 이스르엘 사람 나봇의 포도원
  - 나봇의, 이스르엘 사람의 포도원
  lexicon: HALOT
  rationale: 구문상 소유격 연쇄를 한국어에서 자연스럽게 풀어 ‘나봇, 이스르엘 사람’으로 인물과 출신을 함께 드러냈습니다.
theological_decisions:
- issue: 첫 문장의 발화 뉘앙스
  chosen_reading: 이세벨의 말은 단순 질문이라기보다 아합의 소극성을 책망하며 왕답게 행동하라고 몰아붙이는 수사적 발언으로 처리했습니다.
  alternative_readings:
  - '서술형 진술: ‘당신이 이제 이스라엘에서 왕으로 통치하는군요.’'
  - 직접적 질문형만 유지하는 번역
  rationale: 히브리어는 질문 표지가 없지만, 문맥상 비꼼과 촉구가 함께 들립니다. 한국어에서는 수사적 질문을 살리되 의미를 과도하게 평탄화하지 않았습니다.
  doctrine_reference: 'Translation philosophy: source-tension 보존; 문맥상 허용되는 수사적 발화 재현'
