- from: 그때 아합의 아내 이세벨이 그에게 말했습니다. 「당신이 이제 이스라엘에서 왕노릇을 하는 것입니까? 일어나 빵을 드시고 마음을 즐겁게 하십시오. 내가 나봇, 이스르엘 사람의 포도원을 당신에게 주겠습니다」.[a][b]
  to: 그때 아합의 아내 이세벨이 그에게 말했습니다. “당신이 이제 이스라엘을 왕으로 다스리고 있습니까?[a] 일어나서 빵을 드시고[b] 마음을 즐겁게 하십시오. 내가 이스르엘 사람 나봇의 포도원을 당신에게 주겠습니다.”
  rationale: 히브리어의 수사적 발화는 본문에서 질문형으로 유지하고, 무표지 단언/빈정거림이라는 가능한 읽기는 해당 위치의 각주로 보존했습니다. ‘빵을 드시고’는 원문의 표면 표현을 살리되, 관용적 의미는 정확한 위치의 각주로 설명했습니다. 기존의 ‘마음’ 각주는 영어 POB 감사 추적에 없는 추가 해설이므로 제거했으며, 모든 각주 표지를 해당 어구 바로 뒤에 배치했습니다.
