  lexicon: HALOT
  rationale: 서사 진행을 나타내는 와우 연속형을 한국어에서 자연스러운 시간 표지인 ‘그때’와 도착/임재의 뉘앙스를 가진 ‘임하여’로 옮겨, 다음 사건으로 이어지는 흐름을 살렸습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 야훼의 메시지
  lexicon: HALOT
  rationale: 예언자적 공식어인 ‘말씀’을 유지해 계시의 권위를 살렸고, 영어 POB의 Yahweh에 맞춰 하나님의 이름은 ‘야훼’로 옮겼습니다.
- source_word: אֵלִיָּהוּ הַתִּשְׁבִּי
  english_pob_choice: Elijah the Tishbite
  chosen_korean: 디셉 사람 엘리야
  alternatives_korean:
  - 디셉 사람인 엘리야
  - 디셉 출신 엘리야
  lexicon: HALOT
  rationale: 히브리어의 간결한 출신 표지를 한국어 관용에 맞게 ‘디셉 사람’으로 옮겼고, 고유명사는 통용형인 ‘엘리야’를 사용했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시기를
  - 말하여
  lexicon: HALOT
  rationale: 직접 인용이 뒤따르는 도입구를 한국어 성경 문맥에 맞게 ‘말씀하셨습니다’로 처리해, 문장 종결이 어색해지지 않도록 했습니다.
theological_decisions:
