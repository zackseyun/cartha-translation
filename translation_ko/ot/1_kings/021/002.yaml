base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/002.yaml
  text: And Ahab spoke to Naboth[a], saying, “Give me your vineyard, so that it may become a vegetable garden for me, because it is near my house; and in its place I will give you a better vineyard than it. Or, if it seems good in your eyes, I will give you its price in silver.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''if it is good in your eyes,'' an idiom meaning ''if it seems good to you'' or ''if you approve.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 아합이 나봇에게 말하며 이르렀습니다. “네 포도원을 내게 주어 내가 그것을 채소밭으로 삼게 하라. 그것이 내 집 가까이에 있기 때문이다. 그 대신 내가 네게 그보다 더 좋은 포도원을 주겠다. 아니면, 네 눈에 좋다면 내가 그 값을 은으로 네게 주겠다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘네 눈에 좋다면’이며 ‘네가 좋다고 여기면’, ‘네가 승인하면’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... אֶל
  english_pob_choice: spoke to
  chosen_korean: 말하며 이르렀습니다
  alternatives_korean:
  - 말했습니다
  - 이야기했습니다
  lexicon: HALOT
  rationale: וַיְדַבֵּר with אֶל은 단순 발화보다 상대에게 말을 건네는 서술이라, 자연스럽게 ‘말하며 이르렀습니다’로 옮겨 아합의 요청 장면을 살렸습니다.
- source_word: תְּנָה לִּי אֶת כַּרְמְךָ
  english_pob_choice: Give me your vineyard
  chosen_korean: 네 포도원을 내게 주어
  alternatives_korean:
  - 네 포도원을 내게 주십시오
  - 네 포도원을 내게 달라
  lexicon: HALOT
  rationale: נתן 명령형의 직접성을 살리되 한국어에서는 목적절로 이어지는 요청형이 자연스러워 ‘내게 주어’로 처리했습니다.
- source_word: וִיהִי לִי לְגַן יָרָק
  english_pob_choice: so that it may become a vegetable garden for me
  chosen_korean: 내가 그것을 채소밭으로 삼게 하라
  alternatives_korean:
  - 내게 채소밭이 되게 하라
  - 내가 그곳을 채소밭으로 만들게 하라
  lexicon: HALOT
  rationale: יְהִי의 결과/목적 뉘앙스를 한국어의 사역적 표현으로 옮겨, 단순한 소유가 아니라 용도 변경 의도를 드러냈습니다.
- source_word: כִּי הוּא קָרוֹב אֵצֶל בֵּיתִי
  english_pob_choice: because it is near my house
  chosen_korean: 그것이 내 집 가까이에 있기 때문이다
  alternatives_korean:
  - 내 집과 가까이 있기 때문이다
  - 내 집 곁에 있기 때문이다
  lexicon: HALOT
  rationale: 이유 제시를 분명히 하면서 קָרוֹב אֵצֶל בֵּיתִי의 공간적 근접성을 자연스러운 한국어로 옮겼습니다.
- source_word: וְאֶתְּנָה לְךָ תַּחְתָּיו כֶּרֶם טוֹב מִמֶּנּוּ
  english_pob_choice: and in its place I will give you a better vineyard than it
  chosen_korean: 그 대신 내가 네게 그보다 더 좋은 포도원을 주겠다
  alternatives_korean:
  - 그 자리에 네게 그보다 나은 포도원을 주겠다
  - 그것 대신 네게 더 좋은 포도원을 주겠다
  lexicon: HALOT
  rationale: תַּחַת의 교환/대체 의미를 ‘그 대신’으로, 비교 표현은 ‘그보다 더 좋은’으로 옮겨 제안의 내용이 분명히 드러나게 했습니다.
theological_decisions:
