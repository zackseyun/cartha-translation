  rationale: יְהִי의 결과/목적 뉘앙스를 한국어의 사역적 표현으로 옮겨, 단순한 소유가 아니라 용도 변경 의도를 드러냈습니다.
- source_word: כִּי הוּא קָרוֹב אֵצֶל בֵּיתִי
  english_pob_choice: because it is near my house
  chosen_korean: 그것이 내 집 가까이에 있기 때문이다
  alternatives_korean:
  - 내 집과 가까이 있기 때문이다
