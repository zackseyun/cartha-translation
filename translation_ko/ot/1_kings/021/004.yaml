base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/004.yaml
  text: So Ahab went into his house sullen and angry because of the word that Naboth the Jezreelite had spoken to him[a], saying, “I will not give you the inheritance of my fathers.” And he lay down on his bed and turned his face away[c][b], and he would not eat bread.
  footnotes:
  - marker: a
    text: Or “because of what Naboth the Jezreelite had said to him.” The Hebrew word can mean “word,” “matter,” or “thing.”
    reason: lexical_alternative
  - marker: b
    text: 'Or “the inheritance of my ancestors.” Hebrew: “my fathers.”'
    reason: lexical_alternative
  - marker: c
    text: Hebrew “eat bread,” an idiom that can mean taking food generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아합은 이스르엘 사람 나봇이 자기에게 한 말[a], 곧 “내 조상들의 유산[b]을 당신에게 주지 않겠습니다”라고 한 말 때문에, 마음이 불편하고 화가 나서 자기 집으로 들어왔습니다. 그는 침상에 누워 얼굴을 돌리고 빵[c]을 먹지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 다바르(dābār)는 ‘말’, ‘일’, 또는 ‘사건’을 뜻할 수 있습니다. 여기서는 나봇의 발언을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘내 아버지들’입니다. 이 문맥에서는 조상에게서 물려받은 가문의 상속 몫을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 ‘빵을 먹다’는 일반적으로 음식을 먹거나 식사하는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַר וְזָעֵף
  english_pob_choice: sullen and angry
  chosen_korean: 시무룩하고 화가 난 채로
  alternatives_korean:
  - 울적하고 화가 난 채로
  - 기분이 상하고 화가 난 채로
  lexicon: HALOT
  rationale: 두 형용사가 함께 나타내는 아합의 삐치고 분노한 내적 상태를 한국어로 자연스럽게 살리기 위해, 가벼운 내향성은 ‘시무룩하고’, 분노는 ‘화가 난’으로 나누어 옮겼습니다.
- source_word: עַל הַדָּבָר אֲשֶׁר דִּבֶּר אֵלָיו
  english_pob_choice: because of the word that ... had spoken to him
  chosen_korean: '...에게 한 말 때문에'
  alternatives_korean:
  - '...에게 말한 일 때문에'
  - '...에게 한 그 말 때문에'
  lexicon: HALOT
  rationale: דָּבָר는 ‘말/일/사건’을 모두 가질 수 있지만, 여기서는 나봇의 직접 발언을 가리키므로 ‘한 말’이 본문 의미를 가장 간결하게 드러냅니다.
- source_word: לֹא אֶתֵּן לְךָ אֶת נַחֲלַת אֲבוֹתָי
  english_pob_choice: I will not give you the inheritance of my fathers
  chosen_korean: 내 조상의 유산을 당신에게 주지 않겠습니다
  alternatives_korean:
  - 내 조상의 상속 재산을 당신에게 주지 않겠습니다
  - 내 아버지들의 유산을 당신에게 주지 않겠습니다
  lexicon: HALOT
  rationale: נחלה는 단순한 소유물이 아니라 세습된 몫이므로 ‘유산’으로 옮겼고, 한국어에서 ‘조상’이 자연스럽게 가문/선조의 상속권을 드러내므로 본문의 계승 의미를 살렸습니다.
- source_word: וַיַּסֵּב אֶת פָּנָיו
  english_pob_choice: turned his face away
  chosen_korean: 얼굴을 돌리고
  alternatives_korean:
  - 얼굴을 외면하고
  - 얼굴을 돌려
  lexicon: HALOT
  rationale: 관용구의 핵심은 단순한 방향 전환이 아니라 삐친 듯한 거부와 철수이므로, 한국어에서 가장 자연스럽게 그 뉘앙스를 전달하는 ‘얼굴을 돌리고’를 택했습니다.
theological_decisions:
- issue: 나봇의 인용문에서 세대 계승 표현을 어떻게 보존할지
  chosen_reading: ‘내 조상의 유산’으로 옮겨, 남성 복수 형태와 가문 상속의 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘내 조상들의 유산’
  - ‘내 선조의 유산’
  rationale: 히브리어 אבותי는 문자적으로 ‘나의 아버지들’이지만, 이 맥락에서는 가문과 세습 토지를 가리키므로 한국어로는 ‘조상’이 가장 자연스럽습니다. 다만 단순한 일반화가 되지 않도록 ‘유산’과 결합해 계승권의 무게를 보존했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy, point 4 (Gender-accurate over gender-neutral)
