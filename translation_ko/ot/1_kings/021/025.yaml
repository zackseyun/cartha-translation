revisions:
- from: 실로 아합과 같이 자기 자신을 팔아 야훼 보시기에 악을 행한 자는 없었습니다. 그의 아내 이세벨이 그를 부추겼기 때문입니다.
  to: 실로 야훼 보시기에 악을 행하는 데 자신을 팔아넘긴 아합과 같은 사람은 없었습니다. 그의 아내 이세벨이 그를 부추겼습니다.
