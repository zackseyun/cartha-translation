source:
  edition: WLC
  text: רַ֚ק לֹֽא הָיָ֣ה כְ/אַחְאָ֔ב אֲשֶׁ֣ר הִתְמַכֵּ֔ר לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה אֲשֶׁר הֵסַ֥תָּה אֹת֖/וֹ אִיזֶ֥בֶל אִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/025.yaml
  text: Surely there was no one like Ahab, who sold himself to do what was evil in the sight of Yahweh, because Jezebel his wife incited him.
translation:
  language: ko
  text: 실로 야훼 보시기에 악을 행하는 데 자신을 팔아넘긴 아합과 같은 사람은 없었습니다. 그의 아내 이세벨이 그를 부추겼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  english_pob_choice: Surely
  chosen_korean: 실로
  alternatives_korean:
  - 참으로
  - 정녕
  - 확실히
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘오직’이 아니라 앞 문장을 강하게 단정하는 어조이므로, 합쇼체에서 자연스러운 강조 부사 ‘실로’로 옮겼습니다.
- source_word: הִתְמַכֵּר
  english_pob_choice: sold himself
  chosen_korean: 자기 자신을 팔아
  alternatives_korean:
  - 스스로를 넘겨
  - 자기를 내맡겨
  - 몸을 팔아
  lexicon: HALOT
  rationale: 아합이 악에 자신을 ‘팔았다’는 비유를 살리기 위해 직역성을 유지하되 한국어로는 ‘자기 자신을 팔아’가 가장 자연스럽습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the sight of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈앞에서
  - 야훼 앞에서
  - 야훼 보기에
  lexicon: HALOT
  rationale: 히브리어의 평가 관용구를 한국어 관용으로 살리면서도, POB의 이름 원칙에 따라 יְהוָה를 ‘야훼’로 반영했습니다.
- source_word: הֵסַתָּה
  english_pob_choice: incited
  chosen_korean: 부추겼기 때문입니다
  alternatives_korean:
  - 선동했기 때문입니다
  - 충동질했기 때문입니다
  - 부추겨서입니다
  lexicon: HALOT
  rationale: 부정적 유도·부추김의 의미를 담되, 현대 한국어에서 인물 간 관계를 지나치게 거칠게 만들지 않는 표현으로 ‘부추기다’를 택했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 본문의 신명은 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 기준에 따라 신명은 신학적 제목이 아니라 고유한 언약 이름으로 드러내는 것이 원문의 의도를 더 직접적으로 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
