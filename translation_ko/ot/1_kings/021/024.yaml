id: 1KI.21.24
reference: 1 Kings 21:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/מֵּ֤ת לְ/אַחְאָב֙ בָּ/עִ֔יר יֹאכְל֖וּ הַ/כְּלָבִ֑ים וְ/הַ/מֵּת֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֥וֹף הַ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/024.yaml
  text: Anyone belonging to Ahab who dies in the city the dogs will eat[b][a], and anyone who dies in the field the birds of the sky will eat.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the one dead/of Ahab'; the expression means anyone belonging to Ahab's house who dies.
    reason: lexical_alternative
  - marker: b
    text: Or 'the birds of heaven.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아합에게 속한 자들 가운데 성읍에서 죽는 자는 개들이 먹고, 들에서 죽는 자는 하늘의 새들이 먹을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘아합에게 속한 죽은 자/죽는 자’입니다. 뜻은 아합의 집안에 속한 누구든지 죽는 자를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하늘의 새들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְאַחְאָב
  english_pob_choice: anyone belonging to Ahab who dies
  chosen_korean: 아합에게 속한 자들 가운데 죽는 자
  alternatives_korean:
  - 아합의 자손 가운데 죽는 자
  - 아합의 집안에 속한 자들 가운데 죽는 자
  lexicon: HALOT
  rationale: לה with 아합은 단순 소유보다 관계/소속을 나타내므로, ‘아합에게 속한 자들’로 풀어 원문의 범위를 살렸습니다.
- source_word: בָּעִיר
  english_pob_choice: in the city
  chosen_korean: 성읍에서
  alternatives_korean:
  - 도성에서
  - 도시에서
  lexicon: HALOT
  rationale: 히브리어의 장소 대조를 살리기 위해 ‘성읍’을 택했습니다.
- source_word: יֹאכְלוּ הַכְּלָבִים
  english_pob_choice: the dogs will eat
  chosen_korean: 개들이 먹고
  alternatives_korean:
  - 개들이 삼키고
  - 개들이 먹어치우고
  lexicon: HALOT
  rationale: אכל의 기본 의미를 유지하되, 문맥상 불명예스러운 사체 훼손의 이미지는 동사 자체와 문맥이 충분히 전달합니다.
- source_word: עוֹף הַשָּׁמָיִם
  english_pob_choice: the birds of the sky
  chosen_korean: 하늘의 새들
  alternatives_korean:
  - 하늘의 새
  - 공중의 새들
  lexicon: HALOT
  rationale: ‘하늘의 새들’은 원문의 관용구를 자연스럽게 옮기면서도 ‘of heaven’보다 직역성을 유지합니다.
theological_decisions:
- issue: 시체 훼손을 통한 심판 선언의 표현 강도
  chosen_reading: 원문이 지닌 저주/심판의 수치를 완화하지 않고, 개와 새가 시체를 먹는 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘잠식당하다’로 풀기
  - ‘죽임을 당하다’처럼 일반화하기
  rationale: 이 절은 아합 집에 대한 공적 심판 선언으로, 불명예와 저주의 효과가 핵심이므로 이미지의 충격을 보존하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 열왕기상 21장 문맥의 예언적 심판 선언
- issue: ‘하늘’의 번역
  chosen_reading: ‘하늘의 새들’로 번역하고, ‘하늘 나라’ 같은 신학적 용어로 바꾸지 않았습니다.
  alternative_readings:
  - ‘하늘의 새’
  - ‘공중의 새들’
  rationale: 여기서의 שמים은 신학적 개념이 아니라 단순한 하늘/상공을 가리키므로, 문맥에 맞는 자연스러운 공간 표현을 유지했습니다.
  doctrine_reference: 히브리어 שמים의 일반적 공간 의미
