base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/009.yaml
  text: She wrote in the letters[a], saying, “Proclaim a fast, and seat Naboth at the head of the people.”
  footnotes:
  - marker: a
    text: Or “before the people” or “in a prominent place among the people.” The Hebrew literally says “at the head of the people,” which may indicate a conspicuous or leading position in the assembly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 그 편지들에 이렇게 썼습니다. “금식을 선포하고, 나봇을 백성의 맨 앞자리에 앉히십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “백성의 머리[선두]에”라고 말합니다. 이는 백성 앞의 눈에 띄는 자리 또는 백성 가운데 두드러진 위치를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  english_pob_choice: She wrote
  chosen_korean: 그녀는 … 썼습니다
  alternatives_korean:
  - 그때 그녀는 … 썼습니다
  lexicon: HALOT
  rationale: 미완료-서술형 진행을 한국어 과거 서술로 자연스럽게 옮기되, 문맥상 이세벨을 가리키는 여성 단수 주어를 분명히 반영했습니다.
- source_word: בַּסְּפָרִים
  english_pob_choice: in the letters
  chosen_korean: 그 편지들에
  alternatives_korean:
  - 그 문서들에
  - 편지들 안에
  lexicon: HALOT
  rationale: 여기서 ספרים은 현대적 의미의 ‘책’이 아니라 발송된 공문성 편지들이므로, 본문 안에서 자연스러운 한국어로 ‘편지들에’라고 옮겼습니다.
- source_word: קִרְאוּ צ֔וֹם
  english_pob_choice: Proclaim a fast
  chosen_korean: 금식을 선포하고
  alternatives_korean:
  - 금식을 공포하고
  - 금식을 알리고
  lexicon: HALOT
  rationale: 공적 예식의 선언이라는 힘을 살려 ‘선포하다’를 택했고, צוֹם은 공동체적 금식으로서 ‘금식’이 가장 직접적입니다.
- source_word: וְהוֹשִׁ֥יבוּ אֶת נָב֖וֹת בְּרֹאשׁ הָעָֽם
  english_pob_choice: and seat Naboth at the head of the people
  chosen_korean: 나봇을 백성의 머리에 앉히십시오
  alternatives_korean:
  - 나봇을 백성 앞에 앉히십시오
  - 나봇을 백성 가운데 두드러진 자리에 앉히십시오
  lexicon: HALOT
  rationale: 히필 명령형의 ‘앉히게 하다’라는 사역적 뉘앙스를 살리면서, בְּרֹאשׁ הָעָם의 직역적 이미지인 ‘백성의 머리’를 유지해 의도된 눈에 띄는 자리라는 긴장을 남겼습니다.
theological_decisions:
- issue: 공개 금식과 나봇의 자리 배치는 기만적 재판 절차를 예비합니다.
  chosen_reading: 본문은 단순한 종교 행사 지시가 아니라, 공적 종교 형식을 악용해 나봇을 전면에 세우려는 조작된 상황을 드러냅니다.
  alternative_readings:
  - 중립적인 공동체 행사 준비로 완화하는 읽기
  - ‘백성의 머리’를 단순히 명예석으로만 처리하는 읽기
  rationale: 앞 절과 다음 문맥을 함께 보면, 이 명령은 정의로운 절차가 아니라 함정의 도입부입니다. 번역에서도 그 불길한 기능을 지워서는 안 됩니다.
  doctrine_reference: 서술 문맥상 악의적 위장과 불의한 재판에 대한 성경적 증언
