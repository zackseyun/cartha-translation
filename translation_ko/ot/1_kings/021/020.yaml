  - severity: low
    issue: מצא의 반복을 ‘찾아내다’로 강화했습니다.
    rationale: ‘찾아내다’도 문맥상 가능하지만 원문의 단순 동사와 문답의 어휘 반복에는 ‘찾다’를 반복하는 편이 더 정확합니다.
  - severity: medium
    issue: 각주의 내용 및 reason이 본문과 맞지 않습니다.
    rationale: 각주는 YHWH 표기에 관한 것이므로 ‘ot_citation’이 아니라 ‘alternative_reading’이어야 합니다. 또한 한국어 전통 성경 표기와 관련해 ‘주’를 전통적 번역으로 단정하기보다 이 번역의 ‘야훼’ 선택과 ‘여호와’라는 대안 표기를 명시하는 편이 정확합니다.
