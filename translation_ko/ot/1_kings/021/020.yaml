translation:
  language: ko
  text: 아합이 엘리야에게 말했습니다. “당신이 나를 찾았습니까, 나의 원수여?” 그러자 엘리야가 말했습니다. “찾았습니다. 당신이 야훼께서 보시기에 악을 행하려고 자신을 팔았기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 하나님의 이름: ‘YHWH’. 이 번역은 이를 ‘야훼’로 옮겼습니다. ‘여호와’로도 옮깁니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְצָאתַנִי
  english_pob_choice: Have you found me
  chosen_korean: 네가 나를 찾아냈느냐
  alternatives_korean:
  - 네가 나를 찾았느냐
  - 네가 나를 발견했느냐
  lexicon: HALOT
  rationale: 직접적인 대질 질문으로서 ‘찾아내다’가 단순한 ‘보다’보다 추적·발견의 뉘앙스를 살리며, 아합의 공격적 어조도 자연스럽게 전달합니다.
- source_word: אֹיְבִי
  english_pob_choice: my enemy
  chosen_korean: 내 원수야
  alternatives_korean:
  - 내 적이여
  - 내 적이야
  lexicon: HALOT
  rationale: 호격의 힘을 살리기 위해 ‘내 원수야’로 옮겼고, ‘원수’가 אויב의 적대성과 관계적 대립을 더 선명하게 드러냅니다.
- source_word: הִתְמַכֶּרְךָ
  english_pob_choice: you have sold yourself
  chosen_korean: 네 자신을 팔았기 때문이다
  alternatives_korean:
  - 너 자신을 팔았기 때문이다
  - 스스로를 팔았기 때문이다
  - 너 자신을 내줬기 때문이다
  lexicon: HALOT
  rationale: 히트파엘의 반사적 의미를 보존하기 위해 ‘네 자신을 팔다’를 유지했고, 이어지는 이유절에 맞게 한국어 어순을 조정했습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 평가 의미를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘보시기에’로 옮겼습니다. יְהוָה는 본 지침에 따라 야훼로 표기했습니다.
theological_decisions:
