  yaml_path: translation/ot/1_kings/021/023.yaml
  text: And also concerning Jezebel[a], Yahweh spoke, saying, ‘The dogs will eat Jezebel in the territory of Jezreel.’
  footnotes:
  - marker: a
    text: Or “by the rampart of Jezreel.” The Hebrew term here is difficult and may refer more specifically to the fortified outer area of the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이세벨에 대해서도 야훼께서 말씀하셨습니다. “개들이 이세벨을 이스르엘의 경계에서 먹을 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֵל은 이곳에서 ‘성벽’ 또는 ‘외곽 방어구역’을 뜻할 수 있는 난해한 말입니다. 그래서 본문은 의미를 넓게 살린 ‘경계’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם לְאִיזֶבֶל
  english_pob_choice: And also concerning Jezebel
  chosen_korean: 그리고 이세벨에 대해서도
  alternatives_korean:
  - 또한 이세벨에게
  - 이세벨을 향하여도
  lexicon: HALOT
  rationale: לְ + 인명은 이 문맥에서 직접 수신자보다 ‘~에 관하여’의 주제를 나타내므로, 한국어도 판단의 대상이 ‘이세벨에 대하여’임을 분명히 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 공동체 관용어 대신 하나님의 고유명사를 음역해, 본문이 가진 언약적 신명성을 드러냈습니다.
- source_word: הַכְּלָבִים
  english_pob_choice: the dogs
  chosen_korean: 개들이
  alternatives_korean:
  - 그 개들이
  - 개들
  lexicon: HALOT
  rationale: 히브리어 정관사를 자연스럽게 반영하면서도 한국어 어순에서는 주어 표지를 살려 ‘개들이’로 옮겼습니다.
- source_word: בְּחֵל יִזְרְעֶאל
  english_pob_choice: in the territory of Jezreel
  chosen_korean: 이스르엘의 경계에서
  alternatives_korean:
  - 이스르엘의 성벽에서
  - 이스르엘의 지역에서
  - 이스르엘의 둘레에서
  lexicon: HALOT
  rationale: חֵל은 이곳에서 성벽/외곽 방어구역을 가리킬 수 있는 난해한 어휘이므로, 본문 의미를 지나치게 좁히지 않으면서도 장소성을 살린 ‘경계’로 번역했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명은 직함이 아니라 고유명사이므로, POB 원칙에 따라 대치어 ‘주님’ 대신 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: בְּחֵל יִזְרְעֶאל의 지리적 의미
  chosen_reading: 이스르엘의 경계에서
  alternative_readings:
  - 이스르엘의 성벽에서
  - 이스르엘 땅에서
  rationale: 히브리어가 정확히 성벽, 외곽구역, 경계를 어느 정도로 지시하는지 불확실하므로, 단정적 해석을 피하고 심판이 이스르엘에서 일어난다는 점만 분명히 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, Preserve theological tension rather than resolve it
