id: 1KI.21.19
reference: 1 Kings 21:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/רָצַ֖חְתָּ וְ/גַם יָרָ֑שְׁתָּ וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה בִּ/מְק֗וֹם אֲשֶׁ֨ר לָקְק֤וּ הַ/כְּלָבִים֙ אֶת דַּ֣ם נָב֔וֹת יָלֹ֧קּוּ הַ/כְּלָבִ֛ים אֶת דָּמְ/ךָ֖ גַּם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/019.yaml
  text: 'And you shall speak to him[a], saying, ‘Thus says Yahweh: Have you murdered and also taken possession?’ And you shall speak to him, saying, ‘Thus says Yahweh: In the place where the dogs licked the blood of Naboth[b], the dogs shall lick your blood—you also.’'
  footnotes:
  - marker: a
    text: Or, 'Have you killed and also taken possession?' The Hebrew verb can be rendered more broadly as 'kill,' but here likely carries the stronger sense 'murder.'
    reason: lexical_alternative
  - marker: b
    text: The final words 'you also' are emphatic in Hebrew, underscoring that the same disgrace that befell Naboth will come upon Ahab himself.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 그에게 말하여야 합니다. ‘야훼께서 이렇게 말씀하십니다. 네가 살해하고도 또 차지하였느냐?’ 그리고 당신은 그에게 말하여야 합니다. ‘야훼께서 이렇게 말씀하십니다. 개들이 나봇의 피를 핥은 바로 그 자리에서 개들이 네 피도 핥을 것이다 — 바로 너도 말입니다.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו לֵאמֹר
  english_pob_choice: And you shall speak to him, saying
  chosen_korean: 당신은 그에게 말하여야 합니다
  alternatives_korean:
  - 그에게 말하십시오
  - 그에게 말하라고 하십시오
  lexicon: HALOT
  rationale: דבר + אל + לאמר의 위임/전달 공식으로, 반복 구조를 살리되 한국어에서는 두 번의 ‘말하다’를 그대로 중복하지 않고 자연스러운 명령형으로 옮겼습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 이같이 말씀하십니다
  - 주께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언자 전령 공식의 표지성을 살리면서, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: הֲרָצַחְתָּ
  english_pob_choice: Have you murdered
  chosen_korean: 네가 살해하고도
  alternatives_korean:
  - 네가 살인하고도
  - 네가 죽이고도
  lexicon: HALOT
  rationale: רצח의 강한 불법적 살해 뉘앙스를 ‘살해하다’로 옮겨, 단순한 ‘죽이다’보다 Ahab의 책임을 분명히 했습니다.
- source_word: וְגַם יָרָשְׁתָּ
  english_pob_choice: and also taken possession
  chosen_korean: 또 차지하였느냐
  alternatives_korean:
  - 또 소유하였느냐
  - 또 빼앗아 차지하였느냐
  lexicon: HALOT
  rationale: ירש는 문맥상 나봇의 포도원을 불법적으로 점유한 결과를 가리키므로, 법적·소유적 점유를 드러내는 ‘차지하다’를 선택했습니다.
- source_word: לָקְקוּ ... יָלֹקּוּ
  english_pob_choice: the dogs licked ... the dogs shall lick
  chosen_korean: 개들이 … 핥은 … 개들이 … 핥을 것이다
  alternatives_korean:
  - 개들이 … 핥았다 … 개들이 … 핥겠다
  - 개들이 … 혀로 핥은 … 개들이 … 혀로 핥을 것이다
  lexicon: HALOT
  rationale: 같은 동사를 반복해 심판의 잔혹한 대칭을 살렸고, 한국어에서도 ‘핥다’를 유지해 이미지의 직설성을 보존했습니다.
- source_word: דַּם נָבוֹת
  english_pob_choice: the blood of Naboth
  chosen_korean: 나봇의 피
  alternatives_korean:
  - 나봇의 혈흔
  - 나봇의 피
  lexicon: HALOT
  rationale: 구문을 직결해 소유격을 그대로 살렸으며, 인명은 통용 표기인 ‘나봇’을 사용했습니다.
- source_word: אֶת דָּמְךָ גַּם אָתָּה
  english_pob_choice: your blood—you also
  chosen_korean: 네 피도 핥을 것이다 — 바로 너도 말입니다
  alternatives_korean:
  - 네 피도 핥을 것이다 — 너도 마찬가지입니다
  - 네 피도 핥을 것이다 — 너 또한 그렇습니다
  lexicon: HALOT
  rationale: ‘גם אתה’의 강한 강조를 매끈하게 약화하지 않도록, 본문 마지막의 압박감을 살리는 독립적 덧붙임으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 본문에서는 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 프로젝트 기본 원칙에 따라 신명기적 고유명사성을 유지하고, 주호칭으로 평준화하지 않았습니다.
  doctrine_reference: POB glossary / Tetragrammaton rendering policy
- issue: ‘핥을 것이다 — 바로 너도 말입니다’의 강조 보존
  chosen_reading: শেষ의 ‘גם אתה’는 설명적 평서로 풀어 본문 밖으로 빼지 않고, 짧은 강조구로 남겼습니다.
  alternative_readings:
  - 네 피도 핥을 것이다
  - 네 피도 핥을 것이다, 너도 역시
  rationale: 나봇에게 임한 수치가 아합에게도 동일하게 돌아온다는 예언적 응징의 대칭을 흐리지 않기 위한 선택입니다.
  doctrine_reference: Translation philosophy §3, §5
