source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ אִיזֶ֔בֶל כִּֽי סֻקַּ֥ל נָב֖וֹת וַ/יָּמֹ֑ת וַ/תֹּ֨אמֶר אִיזֶ֜בֶל אֶל אַחְאָ֗ב ק֣וּם רֵ֞שׁ אֶת כֶּ֣רֶם נָב֣וֹת הַ/יִּזְרְעֵאלִ֗י אֲשֶׁ֤ר מֵאֵן֙ לָ/תֶת לְ/ךָ֣ בְ/כֶ֔סֶף כִּ֣י אֵ֥ין נָב֛וֹת חַ֖י כִּי מֵֽת־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/015.yaml
  text: When Jezebel heard that Naboth had been stoned and had died[a], Jezebel said to Ahab, “Get up, take possession of the vineyard of Naboth the Jezreelite, which he refused to give you for silver, because Naboth is not alive; he is dead.”
  footnotes:
  - marker: a
    text: Or, 'which he refused to sell to you for money.' The Hebrew reads literally, 'which he refused to give you for silver.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이세벨이 나봇이 돌에 맞아 죽었다는 소식을 듣고, 아합에게 말했습니다. “일어나서, 이스르엘 사람 나봇의 포도원을 차지하십시오. 그는 그것을 은으로 당신에게 주기를 거절했습니다. 나봇은 살아 있지 않으니, 곧 죽은 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  english_pob_choice: When ... heard
  chosen_korean: '...이라는 소식을 듣고'
  alternatives_korean:
  - '...을 듣고'
  - '...을 들었을 때'
  lexicon: HALOT
  rationale: 히브리어의 서사 도입 공식은 다음 사건의 배경을 제시하므로, 한국어에서는 자연스럽게 시간 부사절로 풀어 옮겼습니다.
- source_word: סֻקַּל / וַיָּמֹת
  english_pob_choice: had been stoned and had died
  chosen_korean: 돌에 맞아 죽었다
  alternatives_korean:
  - 돌로 쳐서 죽임을 당했다
  - 돌에 맞아 죽고 말았다
  lexicon: HALOT
  rationale: 소식의 내용은 처형 방식과 죽음의 결과를 함께 말하므로, 한국어에서도 ‘돌에 맞아 죽다’로 두 요소를 직결해 전달했습니다.
- source_word: קוּם רֵשׁ
  english_pob_choice: Get up, take possession of
  chosen_korean: 일어나서 ... 차지하십시오
  alternatives_korean:
  - 일어나서 ... 취하십시오
  - 일어나서 ... 소유하십시오
  lexicon: HALOT
  rationale: קוּם의 즉각적 명령은 ‘일어나서’로, ירש의 문맥상 점유 행위는 ‘차지하다’로 옮기는 것이 현대 한국어에서 가장 자연스럽습니다.
- source_word: כֶּרֶם נָבוֹת הַיִּזְרְעֵאלִי
  english_pob_choice: the vineyard of Naboth the Jezreelite
  chosen_korean: 이스르엘 사람 나봇의 포도원
  alternatives_korean:
  - 이스르엘 사람 나봇의 포도밭
  - 이스르엘 출신 나봇의 포도원
  lexicon: HALOT
  rationale: 지명형 형용사는 인물의 출신/소속을 표시하므로, 관용적으로 ‘이스르엘 사람’으로 풀어 번역했습니다.
- source_word: מֵאֵן לָתֵת לְךָ בְכֶסֶף
  english_pob_choice: which he refused to give you for silver
  chosen_korean: 그는 그것을 은으로 당신에게 주기를 거절했습니다
  alternatives_korean:
  - 그는 그것을 돈을 받고 당신에게 주기를 거절했습니다
  - 그는 그것을 은값으로 당신에게 주기를 거절했습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘은으로 주기를 거절하다’이므로, POB의 해석을 따르되 ‘은으로’로 원문 이미지를 보존했습니다.
- source_word: אֵין נָבוֹת חַי ... כִּי מֵת
  english_pob_choice: Naboth is not alive; he is dead
  chosen_korean: 나봇은 살아 있지 않으니, 곧 죽은 것입니다
  alternatives_korean:
  - 나봇은 더 이상 살아 있지 않습니다. 그는 죽었습니다
  - 나봇은 살아 있지 않습니다. 그는 죽었습니다
  lexicon: HALOT
  rationale: 히브리어의 이중 진술은 단순한 사망 통보보다 더 단호한 단언이므로, ‘살아 있지 않으니’와 ‘죽은 것입니다’로 그 강도를 살렸습니다.
theological_decisions:
- issue: 이세벨의 발화가 지닌 냉담하고 조롱 섞인 단정의 어조
  chosen_reading: 직접화법을 유지하되, 명령형과 단정형을 거칠지 않게 현대 한국어로 옮겨 이 장면의 냉혹함을 드러냈습니다.
  alternative_readings:
  - 보다 완곡한 서술체로 완화하기
  - 전통적 교회 문체로 높이기
  rationale: 본문은 살해 소식을 즉시 이용해 재산을 차지하라고 말하는 장면이므로, 어조를 약화시키지 않는 것이 본문의 도덕적 긴장을 보존합니다.
  doctrine_reference: 서사 본문의 화행과 인물 성격의 정확한 재현
