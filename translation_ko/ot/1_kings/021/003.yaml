revisions:
- from: 그러나 나봇이 아합에게 말했습니다. “야훼로 말미암아, 내 조상들의 유산을 당신에게 주는 일은 내게 있을 수 없습니다.”[a]
  to: 그러나 나봇이 아합에게 말했습니다. “야훼께서 결코 허락하지 않으실 일입니다. 제가 제 조상들에게서 물려받은 유산을 왕께 드리는 것은 안 됩니다.”[a]
  rationale: The revision replaces an opaque causal expression with a natural modern Korean rendering of the Hebrew repudiation idiom while retaining Yahweh’s name and the emphatic refusal. It also makes the ancestral-inheritance sense explicit, uses an appropriate Korean form for the royal addressee, and aligns the footnote’s divine-name rendering with the main text.
