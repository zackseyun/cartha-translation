  text: But Naboth said to Ahab[a], “Far be it from me by Yahweh to give you the inheritance of my fathers.”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “The LORD forbid that I should give you the inheritance of my fathers.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나봇이 아합에게 말했습니다. “야훼로 말미암아, 내 조상들의 유산을 당신에게 주는 일은 내게 있을 수 없습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, “주께서 내가 내 조상들의 유산을 당신에게 주는 일을 금하십니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: But ... said
  chosen_korean: 그러나 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: WLC
  rationale: 와우-연속은 서술 전개를 잇지만, 앞선 아합의 제안과의 대비가 분명하므로 한국어에서는 ‘그러나’가 문맥 기능을 더 잘 살립니다.
- source_word: חָלִילָה לִּי
  english_pob_choice: Far be it from me
  chosen_korean: 내게 있을 수 없습니다
  alternatives_korean:
  - 결코 그럴 수 없습니다
  - 그런 일은 상상할 수도 없습니다
  lexicon: HALOT
  rationale: 이 관용구는 강한 거부와 혐오를 나타내므로, 과도하게 종교적이거나 고어적인 표현보다 현대 한국어의 강한 부정으로 힘을 보존했습니다.
- source_word: מֵיהוָה
  english_pob_choice: from the LORD
  chosen_korean: 야훼로 말미암아
  alternatives_korean:
  - 야훼로부터
  - 야훼에 의해
  lexicon: HALOT
  rationale: 미ן+신명사는 단순 출처보다 ‘야훼와 관련하여/야훼에 비추어’라는 결의를 띤 표현으로 읽히므로, oath-like 뉘앙스를 살려 ‘야훼로 말미암아’로 옮겼습니다.
- source_word: נַחֲלַת אֲבֹתַי
  english_pob_choice: the inheritance of my fathers
  chosen_korean: 내 조상들의 유산
  alternatives_korean:
  - 내 조상들의 상속지
  - 내 아버지들의 유산
  lexicon: HALOT
  rationale: נַחֲלָה는 단순 재산보다 세습된 가족 소유를 뜻하므로 ‘유산’이 자연스럽고, ‘fathers’는 직역하면 ‘조상들’로 풀어 세대 계승의 의미를 살렸습니다.
theological_decisions:
- issue: 야훼의 이름과 나봇의 맹세적 거부 표현을 어떻게 함께 살릴 것인가
  chosen_reading: ‘야훼로 말미암아’와 강한 부정 ‘내게 있을 수 없습니다’를 함께 두어, 하나님의 이름을 지우지 않으면서도 맹세/금지의 뉘앙스를 과도하게 도식화하지 않았습니다.
  alternative_readings:
  - ‘주께서 금하시나이다’처럼 전통적 금지식 표현
  - ‘야훼께서 금하십니다’처럼 직접적 금지형
  rationale: 히브리어는 직역하면 ‘나에게 있어서 야훼로 말미암아’에 가까운 강한 거부 관용구이므로, 전통 번역의 관용구로 완전히 흡수하지 않고 원문 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: original-language primacy over translation tradition; preserve theological tension rather than resolve it'
