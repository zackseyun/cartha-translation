  text: 그러나 나봇이 아합에게 말했습니다. “야훼께서 결코 허락하지 않으실 일입니다. 제가 제 조상들에게서 물려받은 유산을 왕께 드리는 것은 안 됩니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
