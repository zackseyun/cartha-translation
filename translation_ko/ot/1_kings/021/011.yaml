  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲשׂוּ֩ אַנְשֵׁ֨י עִיר֜/וֹ הַ/זְּקֵנִ֣ים וְ/הַ/חֹרִ֗ים אֲשֶׁ֤ר הַ/יֹּֽשְׁבִים֙ בְּ/עִיר֔/וֹ כַּ/אֲשֶׁ֛ר שָׁלְחָ֥ה אֲלֵי/הֶ֖ם אִיזָ֑בֶל כַּ/אֲשֶׁ֤ר כָּתוּב֙ בַּ/סְּפָרִ֔ים אֲשֶׁ֥ר שָׁלְחָ֖ה אֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/011.yaml
  text: So the men of his city—the elders and the nobles who lived in his city—did as Jezebel had sent to them[a], as it was written in the letters that she had sent to them.
  footnotes:
  - marker: a
    text: Or 'the dignitaries'; the Hebrew term for 'nobles' can denote socially prominent men or officials of high rank.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그의 성읍 사람들, 곧 그 성읍에 사는 장로들과 귀족들은 이세벨이 그들에게 보낸 편지들에 기록된 대로 행했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי עִירוֹ
  english_pob_choice: the men of his city
  chosen_korean: 그의 성읍의 사람들
  alternatives_korean:
  - 그의 성읍의 남자들
  - 그의 성읍의 시민들
  lexicon: HALOT
  rationale: 직역하면 ‘그의 성읍의 사람들/남자들’이지만, 뒤이어 장로들과 귀족들이라는 설명이 붙어 있어 집단 전체를 가리키는 문맥상 표현으로 옮겼습니다.
- source_word: הַזְּקֵנִים
  english_pob_choice: the elders
  chosen_korean: 장로들
  alternatives_korean:
  - 연장자들
  - 늙은이들
  lexicon: HALOT
  rationale: 이곳은 나이 든 사람들보다 공동체의 공적 지도자를 가리키므로, 한국어에서도 행정·재판 맥락에 맞는 ‘장로들’이 적절합니다.
- source_word: הַחֹרִים
  english_pob_choice: the nobles
  chosen_korean: 귀족들
  alternatives_korean:
  - 유력자들
  - 고관들
  - 신분 높은 사람들
  lexicon: HALOT
  rationale: 이 말은 이 문맥에서 사회적 지위가 높은 사람들을 가리키므로, 문맥상 가장 자연스러운 대응어로 ‘귀족들’을 택했습니다.
- source_word: כַּאֲשֶׁר שָׁלְחָה אֲלֵיהֶם אִיזָבֶל
  english_pob_choice: as Jezebel had sent to them
  chosen_korean: 이세벨이 그들에게 보낸 대로
  alternatives_korean:
  - 이세벨이 그들에게 보낸 그대로
  - 이세벨이 그들에게 보내 준 대로
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘그들에게 보냈다’고만 하므로, 내용상 명령/지시를 받은 상황을 반영하되 과도하게 덧붙이지 않는 형태로 옮겼습니다.
- source_word: כָּתוּב בַּסְּפָרִים
  english_pob_choice: as it was written in the letters
  chosen_korean: 그가 그들에게 보낸 편지에 기록된 그대로
  alternatives_korean:
  - 편지에 기록된 대로
  - 서신들에 적힌 그대로
  lexicon: HALOT
  rationale: סְפָרִים는 여기서 서면 문서, 곧 편지들을 가리키므로 한국어도 ‘편지’로 구체화했습니다. 주어를 자연스럽게 받기 위해 앞의 ‘그’는 이세벨을 가리키는 것으로 문맥상 처리했습니다.
