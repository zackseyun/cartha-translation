id: 1KI.21.8
reference: 1 Kings 21:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּכְתֹּ֤ב סְפָרִים֙ בְּ/שֵׁ֣ם אַחְאָ֔ב וַ/תַּחְתֹּ֖ם בְּ/חֹתָמ֑/וֹ וַ/תִּשְׁלַ֣ח ה/ספרים אֶל הַ/זְקֵנִ֤ים וְ/אֶל הַֽ/חֹרִים֙ אֲשֶׁ֣ר בְּ/עִיר֔/וֹ הַ/יֹּשְׁבִ֖ים אֶת נָבֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/008.yaml
  text: So she wrote letters in Ahab’s name[a], sealed them with his seal, and sent the letters to the elders and to the nobles who were in his city, who were living with Naboth.
  footnotes:
  - marker: a
    text: Or, 'who were in Ahab’s city.' The Hebrew suffix in 'his city' could be understood to refer either to Naboth or to Ahab.
    reason: alternative_reading
translation:
  language: ko
  text: 그녀는 아합의 이름으로 편지들을 써서 그의 인장으로 봉인하고, 그 편지들을 그의 성읍[a]에 있는 장로들과 귀족들에게, 곧 나봇과 함께 거주하는 이들에게 보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 성읍’의 ‘그’는 아합을 가리킬 수도 있고 나봇을 가리킬 수도 있습니다. 히브리어의 소유 접미사는 두 해석을 모두 가능하게 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּכְתֹּב
  english_pob_choice: So she wrote
  chosen_korean: 그녀는 … 써서
  alternatives_korean:
  - 그리고 그녀는 … 썼습니다
  - 그러자 그녀는 … 썼습니다
  lexicon: HALOT
  rationale: 히브리어 연속 서술의 진행을 한국어에서는 자연스럽게 풀어 ‘써서’로 연결해, 이후 동작(봉인하고, 보냈습니다)과의 관계를 살렸습니다.
- source_word: סְפָרִים
  english_pob_choice: letters
  chosen_korean: 편지들
  alternatives_korean:
  - 문서들
  - 서신들
  lexicon: HALOT
  rationale: 여기서는 공식적으로 발송된 글이라는 기능이 핵심이므로, 현대 한국어에서 가장 자연스러운 ‘편지들’로 옮겼습니다.
- source_word: בְּשֵׁם אַחְאָב
  english_pob_choice: in Ahab’s name
  chosen_korean: 아합의 이름으로
  alternatives_korean:
  - 아합의 권위 아래
  - 아합의 명의로
  lexicon: HALOT
  rationale: ‘이름으로’는 단순 명칭이 아니라 대표·권한을 뜻하는 관용구를 한국어로 직접 드러냅니다. ‘명의로’는 법률적 뉘앙스가 강해 약간 좁습니다.
- source_word: וַתַּחְתֹּם בְּחֹתָמוֹ
  english_pob_choice: sealed them with his seal
  chosen_korean: 그의 인장으로 봉인하고
  alternatives_korean:
  - 그의 도장으로 봉인하고
  - 그의 인장으로 봉하였고
  lexicon: HALOT
  rationale: 고대 행정 문맥의 חותם은 단순 서명보다 ‘인장’이 더 직접적이며, ‘봉인하다’가 그 기능을 가장 분명히 전달합니다.
- source_word: הַזְּקֵנִים וְאֶל הַחֹרִים
  english_pob_choice: to the elders and to the nobles
  chosen_korean: 장로들과 귀족들에게
  alternatives_korean:
  - 장로들과 고관들에게
  - 장로들과 유력자들에게
  lexicon: HALOT
  rationale: זְקֵנִים은 공동체의 장로, חֹרִים은 신분이 높은 사람들을 가리키므로, 문맥상 자연스러운 ‘귀족들’을 택했습니다.
theological_decisions:
- issue: בְּעִירוֹ의 소유격 지시 대상
  chosen_reading: ‘그의 성읍’으로 옮기되, 문맥상 지시가 나봇일 수도 있음을 열어 둡니다.
  alternative_readings:
  - 아합의 성읍
  - 나봇의 성읍
  rationale: 히브리어 소유격은 아합 또는 나봇 모두를 가리킬 수 있어, 본문 해석을 단정하지 않고 문맥적 긴장을 유지했습니다. 편지가 아합의 이름으로 쓰였다는 점과, 나봇과 함께 거주하는 이들을 향한다는 점이 둘 다 살아납니다.
  doctrine_reference: '번역 원칙 §3: 본문이 허용하는 해석적 긴장을 주석 없이 단정하지 않음'
