  text: and Ahishar was over the household[b][a], and Adoniram son of Abda was over the forced labor.
  footnotes:
  - marker: a
    text: Or 'was over the palace' / 'was in charge of the house.' The Hebrew literally says 'over the house,' a court title for oversight of the royal household.
    reason: lexical_alternative
  - marker: b
    text: Or 'was over the labor levy.' The Hebrew term refers to compulsory state labor.
    reason: lexical_alternative
translation:
