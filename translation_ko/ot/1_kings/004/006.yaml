  text: 그리고 아히살은 왕궁 일을 맡았고[a], 압다의 아들 아도니람은 강제 노동을 맡았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕궁 일’은 히브리어의 문자적 표현인 ‘집’이 이 문맥에서 왕실의 가정과 궁정 행정을 가리키는 뜻을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘강제 노동’은 히브리어 מַס가 가리키는 의무적으로 부과된 부역 또는 노역을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הַבָּיִת
  english_pob_choice: was over the household
  chosen_korean: 왕궁 일을 맡았고
  alternatives_korean:
