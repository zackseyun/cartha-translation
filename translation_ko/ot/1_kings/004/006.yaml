  text: וַ/אֲחִישָׁ֖ר עַל הַ/בָּ֑יִת וַ/אֲדֹנִירָ֥ם בֶּן עַבְדָּ֖א עַל הַ/מַּֽס־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/006.yaml
  text: and Ahishar was over the household[b][a], and Adoniram son of Abda was over the forced labor.
  footnotes:
  - marker: a
    text: Or 'was over the palace' / 'was in charge of the house.' The Hebrew literally says 'over the house,' a court title for oversight of the royal household.
    reason: lexical_alternative
  - marker: b
    text: Or 'was over the labor levy.' The Hebrew term refers to compulsory state labor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아히사르는 왕궁 일을 맡았고, 아도니람은 아브다의 아들로서 강제 노동을 맡았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕궁’은 히브리어의 문자적 ‘집’이 왕실 행정 구역을 가리키는 문맥적 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘강제 노동’은 히브리어 מַס이 가리키는 부역·노역 의무를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הַבָּיִת
  english_pob_choice: was over the household
  chosen_korean: 왕궁 일을 맡았고
  alternatives_korean:
  - 왕궁을 맡았고
  - 집안을 맡았고
  - 궁정을 맡았고
  lexicon: HALOT
  rationale: עַל은 행정 직책의 관할을 나타내며, הַבָּיִת는 문자적으로 ‘집’이지만 왕실 문맥에서는 궁정/왕궁 행정을 가리키므로, 직책의 기능을 살려 ‘왕궁 일’을 맡았다고 옮겼습니다.
- source_word: עַל הַמַּס
  english_pob_choice: was over the forced labor
  chosen_korean: 강제 노동을 맡았습니다
  alternatives_korean:
  - 노역을 맡았습니다
  - 부역을 맡았습니다
  - 노동 징발을 맡았습니다
  lexicon: HALOT
  rationale: מַס은 단순한 세금보다 강제 동원되는 노동 의무를 뜻하므로, 현대 독자가 즉시 이해할 수 있도록 ‘강제 노동’으로 옮겼습니다.
- source_word: וַאֲחִישָׁר / וַאֲדֹנִירָם / בֶּן עַבְדָּא
  english_pob_choice: and Ahishar / and Adoniram son of Abda
  chosen_korean: 아히사르 / 아도니람 / 아브다의 아들
  alternatives_korean:
  - 아히살
  - 아도니람
  - 압다의 아들
  lexicon: 고유명사 표기
  rationale: 인명은 현대 외래어 표기 관행에 따라 음역했고, בֶּן עַבְדָּא는 족보식 표기이므로 ‘아브다의 아들’로 자연스럽게 옮겼습니다.
