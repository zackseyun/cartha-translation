  lexicon: HALOT
  rationale: מַס은 단순한 세금보다 강제 동원되는 노동 의무를 뜻하므로, 현대 독자가 즉시 이해할 수 있도록 ‘강제 노동’으로 옮겼습니다.
- source_word: וַאֲחִישָׁר / וַאֲדֹנִירָם / בֶּן עַבְדָּא
  english_pob_choice: and Ahishar / and Adoniram son of Abda
  chosen_korean: 아히사르 / 아도니람 / 아브다의 아들
  alternatives_korean:
