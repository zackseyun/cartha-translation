base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/015.yaml
  text: Ahimaaz[a], in Naphtali; he too took Basemath, the daughter of Solomon[b], as a wife.
  footnotes:
  - marker: a
    text: Or 'over Naphtali' or 'for Naphtali'; the Hebrew preposition can mark the territory assigned to Ahimaaz in this list of district officials.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'took Basemath daughter of Solomon as a wife,' a standard idiom meaning he married her.
    reason: lexical_alternative
translation:
  language: ko
  text: 아히마아스는 납달리에 있었으며, 그도 솔로몬의 딸 바셈닷을 아내로 맞이했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְ+지명은 여기서 ‘납달리 안에서’라기보다 그 지역에 대한 관할 또는 배정을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִימַעַץ
  english_pob_choice: Ahimaaz
  chosen_korean: 아히마아스
  alternatives_korean:
  - 아히마즈
  - 아히맛
  lexicon: 표준 음역 관행
  rationale: 고유명사는 한국어 성경에서 널리 통용되는 현대 음역으로 옮겼습니다.
- source_word: בְּנַפְתָּלִי
  english_pob_choice: in Naphtali
  chosen_korean: 납달리에 있었으며
  alternatives_korean:
  - 납달리에서
  - 납달리를 맡아
  lexicon: HALOT
  rationale: 행정 구역 목록의 בְ+지명은 단순한 위치보다 관할 영역을 가리킬 수 있어, 영어 POB의 주석을 반영해 중립적으로 ‘있었으며’로 처리했습니다.
- source_word: לָקַח ... לְאִשָּׁה
  english_pob_choice: took ... as a wife
  chosen_korean: 아내로 맞이했습니다
  alternatives_korean:
  - 아내로 삼았습니다
  - 장가들었습니다
  lexicon: HALOT
  rationale: 히브리어의 혼인 관용구를 자연스러운 현대 한국어로 옮기되, 단순한 ‘데려오다’보다 혼인 의미가 분명히 드러나도록 했습니다.
- source_word: בָּשְׂמַת בַּת שְׁלֹמֹה
  english_pob_choice: Basemath, the daughter of Solomon
  chosen_korean: 솔로몬의 딸 바셈닷
  alternatives_korean:
  - 솔로몬의 딸 바세맛
  - 솔로몬의 딸 바스맛
  lexicon: 표준 음역 관행
  rationale: 이름은 음역을 따르되, 영어 POB의 ‘Basemath’에 대응하는 한국어 관행형을 우선했습니다.
theological_decisions:
- issue: 혼인 관용구의 처리
  chosen_reading: 직역적 ‘취하다’보다 혼인 의미가 드러나는 ‘아내로 맞이했습니다’를 택했습니다.
  alternative_readings:
  - 그는 바셈닷을 취했습니다
  - 그는 바셈닷을 아내로 취했습니다
  rationale: 문맥상 행정 기록이면서 혼인을 말하는 관용구이므로, 한국어 독자가 오해하지 않도록 의미를 분명히 하되 원문의 혼인 행위를 유지했습니다.
  doctrine_reference: 본문 해석/문체 결정
