  text: Ahimaaz[a], in Naphtali; he too took Basemath, the daughter of Solomon[b], as a wife.
  footnotes:
  - marker: a
    text: Or 'over Naphtali' or 'for Naphtali'; the Hebrew preposition can mark the territory assigned to Ahimaaz in this list of district officials.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'took Basemath daughter of Solomon as a wife,' a standard idiom meaning he married her.
    reason: lexical_alternative
translation:
  language: ko
  text: 납달리를 맡은 이는 아히마아스였습니다. 그도 솔로몬의 딸 바스맛을 아내로 맞이했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘솔로몬의 딸 바스맛을 아내로 취했다’입니다. 이는 그가 바스맛과 혼인했다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
