id: 1KI.4.8
reference: 1 Kings 4:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה שְׁמוֹתָ֔/ם בֶּן ח֖וּר בְּ/הַ֥ר אֶפְרָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/008.yaml
  text: 'And these were their names: Ben-hur[a], in the hill country of Ephraim;'
  footnotes:
  - marker: a
    text: Or 'the son of Hur,' if taken as a patronymic rather than a personal name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이들의 이름은 이러합니다. 베누르[а], 에브라임의 산지에 있는 사람입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 혹은 patronymic으로 보면 ‘후르의 아들’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: And these
  chosen_korean: 그리고 이들의
  alternatives_korean:
  - 이들은
  - 그리고 이것들은
  lexicon: HALOT
  rationale: 목록을 여는 단순한 연결과 지시 기능을 살리기 위해, 자연스러운 서술 연결사 ‘그리고’와 지시 표현 ‘이들의’를 사용했습니다.
- source_word: שְׁמוֹתָם
  english_pob_choice: were their names
  chosen_korean: 이들의 이름은 이러합니다
  alternatives_korean:
  - 이들의 이름은 다음과 같습니다
  - 그들의 이름은
  lexicon: HALOT
  rationale: 히브리어의 무서술문을 한국어에서는 공지형 목록 서두에 맞게 ‘이러합니다’로 풀어, 열거문이라는 성격을 자연스럽게 드러냈습니다.
- source_word: בֶּן חוּר
  english_pob_choice: Ben-hur
  chosen_korean: 베누르
  alternatives_korean:
  - 벤후르
  - 후르의 아들
  lexicon: HALOT
  rationale: 영어 본문이 고유명사로 처리한 점을 따라 음역했고, 본문 주석 없이도 인명으로 읽히는 흐름을 유지했습니다.
- source_word: בְּהַר אֶפְרָיִם
  english_pob_choice: in the hill country of Ephraim
  chosen_korean: 에브라임의 산지에 있는
  alternatives_korean:
  - 에브라임의 고지대에 있는
  - 에브라임 산지에 있는
  lexicon: HALOT
  rationale: 지명적 표현에서 הַר는 단일 산보다 ‘산지/고지대’의 지역 의미가 강하므로, 영어 POB의 ‘hill country’에 맞춰 ‘산지’로 옮겼습니다.
theological_decisions:
- issue: 'בֶּן חוּר의 성격: 인명인지 patronymic인지'
  chosen_reading: 본문은 목록 안의 인명으로 읽히는 흐름을 우선해 ‘베누르’로 음역했습니다.
  alternative_readings:
  - ‘후르의 아들’로 이해하는 족보적 patronymic 읽기
  rationale: 영어 POB가 주석에서 patronymic 가능성을 열어 두었지만, 본문 자체는 지방 관원 목록의 이름 항목처럼 제시되므로 기본 본문은 고유명사 처리로 유지하는 것이 가장 덜 해석적입니다.
  doctrine_reference: 본문 비평/해석 주석
