  - 이스라엘 전체 위에
  lexicon: HALOT
  rationale: 지배·통치 관계의 עַל은 한국어에서 자연스러운 소유격/관할 표현 ‘-의’로 풀어 ‘온 이스라엘의’라 했습니다.
theological_decisions:
- issue: 반복된 מלך의 강조 유지
  chosen_reading: ‘솔로몬 왕은 … 왕이었습니다’로 두 번의 מלך를 모두 살렸습니다.
  alternative_readings:
  - 솔로몬은 온 이스라엘을 다스렸습니다
  - 솔로몬 왕이 온 이스라엘을 통치했습니다
  rationale: 히브리어는 첫 번째를 호칭, 두 번째를 술어로 반복해 왕권의 확립을 강조하므로, 그 반복을 한국어에서도 보존했습니다.
