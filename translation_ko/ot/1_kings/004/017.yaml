theological_decisions:
- issue: 행정적 관계를 ‘over Issachar’로 명시할지 여부
  chosen_reading: 본문의 문자적 형식은 유지하되, ‘잇사갈에’로 옮겨 행정 구역 소속을 암시합니다.
  alternative_readings:
  - 잇사갈을 다스리는
  - 잇사갈 위에
  rationale: 히브리어 전치사 בְּ 자체는 ‘위에’라는 지배 관계를 직접 말하지 않으므로, 과도한 해석을 피하고도 행정적 맥락은 드러내는 번역이 적절합니다.
