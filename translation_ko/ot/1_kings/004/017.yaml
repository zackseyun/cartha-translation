  source_fidelity: 히브리어는 행정 명부 안에서 ‘여호사밧, 파루아의 아들, 잇사갈에’라고 인명·부칭·관할 구역을 병렬하는 생략적 형식입니다. 초안의 ‘있었습니다’는 문장 완결을 위해 보충할 수 있으나, 현재 어순과 쉼표는 ‘여호사밧’이 ‘파루아의 아들’이라는 관계를 부자연스럽게 만듭니다.
  naturalness: ‘잇사갈에는 파루아의 아들 여호사밧이 있었습니다’는 현대 표준 한국어로 자연스럽고, 앞뒤 행정 명부 문맥에서 그가 해당 구역의 관리임을 과도하게 해석하지 않고 나타냅니다.
  terminology: ‘여호사밧’, ‘파루아’, ‘잇사갈’은 통용되는 성경 인명·지명 표기와 잘 맞습니다. 각주 대안은 원문의 전치사 자체보다 행정 문맥을 명시하는 해석이므로, ‘다스리는’보다 넓고 문맥에 알맞은 ‘맡은’으로 표현하는 것이 좋습니다.
  issues:
