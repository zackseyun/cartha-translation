theological_decisions:
- issue: ‘사독의 아들’과 ‘제사장’의 수식 관계
  chosen_reading: ‘사독의 아들 아사랴와 제사장입니다’로 두 표현을 나란히 두어, ‘제사장’이 사독에게 붙는지 아사랴에게 붙는지 본문이 확정하지 않는 긴장을 남겼습니다.
  alternative_readings:
  - 사독의 아들 제사장 아사랴
  - 사독의 아들 아사랴, 제사장
  rationale: 히브리어는 결합을 허용하지만 ‘대제사장’처럼 직위를 확장하지 않으므로, 주어진 정보를 넘지 않는 쪽을 택했습니다.
  doctrine_reference: 본문 우선 원칙, 직분 용어 보존
- issue: 직함의 한국어 톤
  chosen_reading: 현대 문맥에 맞게 ‘관리들’과 ‘제사장’을 사용하여, 고전적 교회 용어로 과도하게 격상하지 않았습니다.
  alternative_readings:
  - 방백들
  - 고관들
  rationale: POB의 행정적·서술적 뉘앙스를 유지하기 위해 관습적 예배 언어보다 기능적 표현을 우선했습니다.
  doctrine_reference: '번역 철학: optimal equivalence'
