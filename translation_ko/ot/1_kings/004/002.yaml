  text: 'And these were the officials who were his: Azariah son of Zadok[a], the priest[b];'
  footnotes:
  - marker: a
    text: Or 'the princes' or 'the officers'; the Hebrew term can denote high-ranking rulers or administrators.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Azariah son of Zadok, the priest.' Some understand 'the priest' as identifying Zadok; others take it as Azariah's title. The text does not explicitly say 'high priest.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 이들은 그의 관리들이었습니다. 사독의 아들 아사랴, 제사장이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘사독의 아들 아사랴, 그 제사장’이라고 합니다. ‘제사장’이 사독을 가리키는지 아사랴의 직함인지에 대해서는 견해가 갈립니다. 본문은 그를 ‘대제사장’이라고 명시하지 않습니다.
    reason: alternative_reading
