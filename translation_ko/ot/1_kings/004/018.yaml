  rationale: 족보·직명 목록에서 בֶן은 자연스럽게 ‘아들’로 옮기는 것이 간결하고 원문의 친족 관계를 분명히 드러냅니다.
- source_word: אֵלָא
  english_pob_choice: Ela
  chosen_korean: 아일
  alternatives_korean:
