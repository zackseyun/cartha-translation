- source_word: אֵלָא
  english_pob_choice: Ela
  chosen_korean: 아일
  alternatives_korean:
  - 엘라
  - 엘라
  lexicon: HALOT
  rationale: 원문 자음형에 더 가까운 음역을 택해 고유명사를 처리했습니다. 영어 주석의 ‘Ela/Elah’ 이형 표기는 한국어 본문에서는 한 형태로 통일했습니다.
- source_word: בְּ/בִנְיָמִן
  english_pob_choice: in Benjamin
  chosen_korean: 베냐민에
  alternatives_korean:
  - 베냐민에서
  - 베냐민 위에
  - 베냐민을 맡아
  lexicon: HALOT
  rationale: 목록의 행정적 소속을 나타내는 전치사 בְ를 본문에서는 가장 중립적인 ‘~에’로 옮겼습니다. 이는 영어 주석의 ‘in Benjamin’에 해당하며, 더 해석적인 ‘~을 맡아’는 본문이 아니라 대안으로 남겨 두는 편이 낫습니다.
