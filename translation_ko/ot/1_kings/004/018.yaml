  footnotes:
  - marker: a
    text: 히브리어 전치사 בְ는 이 명단에서 행정적 소속을 가리킬 수 있으므로, 문맥에 따라 “베냐민에”, “베냐민을 맡아”, “베냐민 위에” 등으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 아일은 영어 번역들에서 흔히 엘라(Elah)로도 표기됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעִי
  english_pob_choice: Shimei
  chosen_korean: 시므이
  alternatives_korean:
  - 쉬므이
  - 시매
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 한국어 성경에서 널리 쓰이는 표기를 반영해 시므이로 옮겼습니다.
- source_word: בֶן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
