source:
  edition: WLC
  text: בֶּן גֶּ֖בֶר בְּ/רָמֹ֣ת גִּלְעָ֑ד ל֡/וֹ חַוֺּת֩ יָאִ֨יר בֶּן מְנַשֶּׁ֜ה אֲשֶׁ֣ר בַּ/גִּלְעָ֗ד ל֚/וֹ חֶ֤בֶל אַרְגֹּב֙ אֲשֶׁ֣ר בַּ/בָּשָׁ֔ן שִׁשִּׁים֙ עָרִ֣ים גְּדֹל֔וֹת חוֹמָ֖ה וּ/בְרִ֥יחַ נְחֹֽשֶׁת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/013.yaml
  text: 'Ben-geber[a], in Ramoth-gilead—to him belonged the villages of Jair son of Manasseh, which are in Gilead; to him belonged the region of Argob[b], which is in Bashan: sixty large cities with walls and bronze bars.'
  footnotes:
  - marker: a
    text: Or 'the tent-settlements of Jair' or, by transliteration, 'Havvoth-jair.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the district/territory of Argob.'
    reason: lexical_alternative
translation:
  language: ko
  text: 벤-게베르[a]는 길르앗 라못에 있었고, 야일의 마을들—곧 길르앗에 있는 마을들—은 그에게 속해 있었으며, 바산에 있는 아르고브 지역[b]도 그에게 속해 있었습니다. 그곳에는 성벽이 있고 놋쇠 빗장이 있는 큰 성읍이 육십 개 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '야일의 천막 거처들' 혹은 음역으로 '하봇-야일'.
    reason: alternative_reading
  - marker: b
    text: 또는 '아르고브의 지경/영토'.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן גֶּבֶר
  english_pob_choice: Ben-geber
  chosen_korean: 벤-게베르
  alternatives_korean:
  - 게베르의 아들
  - 벤-게버
  lexicon: HALOT
  rationale: 행정 명단에서 이름처럼 기능하므로 직역보다 음역이 적절하며, 영어 POB의 이름형 처리와 맞추어 한국어도 고유명사로 살렸습니다.
- source_word: לֹו
  english_pob_choice: to him belonged
  chosen_korean: 그에게 속해 있었습니다
  alternatives_korean:
  - 그의 것이었습니다
  - 그가 맡고 있었습니다
  lexicon: HALOT
  rationale: 반복되는 לֹו의 소유/배정 의미를 살리되, 행정 구획의 배속을 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: חַוֺּת יָאִיר
  english_pob_choice: the villages of Jair
  chosen_korean: 야일의 마을들
  alternatives_korean:
  - 야일의 천막 거처들
  - 하봇-야일
  lexicon: HALOT
  rationale: 문맥상 지명으로 알려진 야일의 정착지들을 가리키므로, 독자가 바로 이해할 수 있는 '마을들'을 택했습니다.footnotes a와 연동되는 대안 독해도 보존합니다.
- source_word: חֶבֶל אַרְגֹּב
  english_pob_choice: the region of Argob
  chosen_korean: 아르고브 지역
  alternatives_korean:
  - 아르고브 지경
  - 아르고브 영토
  lexicon: HALOT
  rationale: חֶבֶל은 구획된 영토를 뜻할 수 있으므로, 행정 목록에 맞는 '지역'으로 옮겼습니다.
- source_word: בְרִיחַ נְחֹשֶׁת
  english_pob_choice: bronze bars
  chosen_korean: 놋쇠 빗장
  alternatives_korean:
  - 놋쇠 막대
  - 구리 빗장
  lexicon: HALOT
  rationale: בְרִיחַ는 문짝의 빗장/볼트를 가리키므로 '빗장'이 가장 정확하며, נְחֹשֶׁת은 전통적 성경 한국어에서 널리 쓰이는 금속명인 '놋쇠'로 옮겼습니다.
theological_decisions:
- issue: 행정 명단의 반복 소유 표현을 어떻게 처리할지
  chosen_reading: '''그에게 속해 있었습니다''로 두 차례의 לֹו를 모두 동일한 배속 관계로 표현했습니다.'
  alternative_readings:
  - '''그의 구역에 포함되었습니다'''
  - '''그가 다스렸습니다'''
  rationale: 본문은 통치 행위보다 배정된 관할권을 말하므로, 소유/귀속의 의미를 유지하는 것이 더 소스에 가깝습니다.
  doctrine_reference: 열왕기상 4장의 관료·행정 목록 문맥
