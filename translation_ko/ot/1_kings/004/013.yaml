revisions:
- from: 벤-게베르[a]는 길르앗 라못에 있었고, 야일의 마을들—곧 길르앗에 있는 마을들—은 그에게 속해 있었으며, 바산에 있는 아르고브 지역[b]도 그에게 속해 있었습니다. 그곳에는 성벽이 있고 놋쇠 빗장이 있는 큰 성읍이 육십 개 있었습니다.
  to: 길르앗 라못을 맡은 벤-게벨에게는 길르앗에 있는 야일의 마을들[a]이 속해 있었고, 바산에 있는 아르곱 지역[b], 곧 성벽과 놋쇠 빗장을 갖춘 큰 성읍 육십 곳도 속해 있었습니다.
  rationale: 행정 명단의 관할 배정 의미를 ‘맡은’과 ‘속해 있었고’로 보존하고, 아르고브와 육십 성읍의 수식 관계를 직접 드러냈습니다. 또한 표준적인 한국어 성경식 지명·인명 음역을 적용하고, חַוֺּת יָאִיר의 대안 번역 각주를 올바른 본문 표현에 연결했습니다.
