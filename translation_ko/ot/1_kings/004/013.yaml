    issue: 각주 a의 표지가 ‘벤-게베르’에 붙어 있으나, 각주 내용은 חַוֺּת יָאִיר(야일의 마을들)에 관한 것이다.
    rationale: 각주 앵커와 설명 대상이 불일치하여 독자가 벤-게벨의 대안 명칭으로 오해하게 됩니다.
