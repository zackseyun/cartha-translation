  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לִ/שְׁלֹמֹ֞ה שְׁנֵים עָשָׂ֤ר נִצָּבִים֙ עַל כָּל יִשְׂרָאֵ֔ל וְ/כִלְכְּל֥וּ אֶת הַ/מֶּ֖לֶךְ וְ/אֶת בֵּית֑/וֹ חֹ֧דֶשׁ בַּ/שָּׁנָ֛ה יִהְיֶ֥ה עַל אחד לְ/כַלְכֵּֽל־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/007.yaml
  text: And Solomon had twelve deputies over all Israel[a], and they provided for the king and his household; each one had to provide for one month in the year.
  footnotes:
  - marker: a
    text: Or 'officials,' 'governors,' or 'officers' for 'deputies.' The Hebrew term refers broadly to appointed administrators.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬에게는 온 이스라엘을 맡은 열두 명의 관리가 있었는데, 그들은 왕과 그의 집안을 공급하였습니다. 각 사람은 해마다 한 달씩 그 일을 맡았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נִצָּבִים는 넓게는 '관리들', '관원들', '총독들', '집행관들'로도 옮길 수 있는 행정 직함입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִצָּבִים
  english_pob_choice: deputies
  chosen_korean: 관리
  alternatives_korean:
  - 대리들
  - 부관들
  - 총독들
  lexicon: HALOT
  rationale: 행정적으로 임명된 사람들을 가리키는 넓은 뜻을 살리되, 왕국 전역을 다스리는 '총독'처럼 강하게 좁히지 않기 위해 '관리'로 옮겼습니다.
- source_word: וְכִלְכְּלוּ
  english_pob_choice: they provided for
  chosen_korean: 공급하였습니다
  alternatives_korean:
  - 부양하였습니다
  - 제공하였습니다
  - 먹을 것을 대었습니다
  lexicon: HALOT
  rationale: 왕실에 필요한 물자를 책임지는 뜻을 드러내기 위해 '공급하다'를 택했고, 문맥상 단순한 호의가 아니라 공식적 조달임을 보이도록 했습니다.
- source_word: אֶת הַמֶּלֶךְ וְאֶת בֵּיתוֹ
  english_pob_choice: the king and his household
  chosen_korean: 왕과 그의 집안
  alternatives_korean:
  - 왕과 그의 가문
  - 왕과 그의 집
  - 왕과 그의 왕실
  lexicon: HALOT
  rationale: בית는 단순 건물이 아니라 왕의 생활권과 소속 인원을 가리키므로, 한국어로는 자연스럽게 '집안'으로 옮겼습니다.
- source_word: חֹדֶשׁ בַּשָּׁנָה
  english_pob_choice: each one had to provide for one month in the year
  chosen_korean: 각 사람은 해마다 한 달씩 그 일을 맡았습니다
  alternatives_korean:
  - 매년 한 달씩 맡았습니다
  - 한 해에 한 달씩 공급해야 했습니다
  lexicon: HALOT
  rationale: 분배된 의무가 순환적으로 돌아간다는 뜻을 분명히 하기 위해, 영어 POB의 분배적 의미를 한국어 관용으로 풀어 표현했습니다.
theological_decisions:
- issue: 왕실 재정·조달 체계의 성격
  chosen_reading: 본문은 솔로몬 왕국의 행정 조직이 왕과 왕실을 유지하기 위해 전국적으로 조직되었음을 보여 주므로, '공급하다'로 왕실 조달의 공적 성격을 살렸습니다.
  alternative_readings:
  - '''부양하다''로 왕실 생계를 강조하는 읽기'
  - '''제공하다''로 일반적 지원을 강조하는 읽기'
  rationale: 히브리어 כלכל은 여기서 단순한 도움보다 식량과 물자를 책임지는 행정적 조달을 가리키므로, 그 기능을 흐리지 않는 번역이 필요합니다.
  doctrine_reference: 열왕기상 4장의 왕정 행정 묘사
