  to: 솔로몬에게는 온 이스라엘을 맡은 열두 명의 관리가 있었습니다.[a] 그들은 왕과 그의 왕실에 필요한 것을 공급하였습니다. 각 사람은 해마다 한 달씩 공급할 책임을 맡았습니다.
