base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/012.yaml
  text: 'Baana son of Ahilud: Taanach and Megiddo[a], and all Beth-shean, which is beside Zarethan below Jezreel, from Beth-shean to Abel-meholah, as far as beyond Jokmeam.'
  footnotes:
  - marker: a
    text: Or 'as far as the region beyond Jokmeam.' The Hebrew boundary expression is terse and somewhat difficult, so a slightly smoother geographical rendering is possible.
    reason: lexical_alternative
translation:
  language: ko
  text: 아힐룻의 아들 바아나에게는 다아낙과 므깃도, 그리고 사르단 곁 이스르엘 아래에 있는 벧스안 전 지역, 곧 벧스안에서 아벨므홀라까지와 욕느암 건너편까지[a]가 맡겨졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘욕느암 너머의 지역까지’로 옮길 수 있습니다. 히브리어 경계 표현은 간결하고 다소 난해합니다.
    reason: lexical_alternative
