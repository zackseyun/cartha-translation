base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/012.yaml
  text: 'Baana son of Ahilud: Taanach and Megiddo[a], and all Beth-shean, which is beside Zarethan below Jezreel, from Beth-shean to Abel-meholah, as far as beyond Jokmeam.'
  footnotes:
  - marker: a
    text: Or 'as far as the region beyond Jokmeam.' The Hebrew boundary expression is terse and somewhat difficult, so a slightly smoother geographical rendering is possible.
    reason: lexical_alternative
translation:
  language: ko
  text: 바아나, 아힐룻의 아들입니다. 다아낙과 므깃도[a], 그리고 벳-스안의 온 지역, 곧 사르단 곁, 이스르엘 아래에 있는 곳, 벳-스안에서 아벨-므홀라까지, 그리고 욱므암 건너편까지입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘욱므암 너머의 지역까지’로 옮길 수 있습니다. 히브리어 경계 표현이 간결하고 다소 난해하므로, 더 매끄러운 지리적 표현이 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּֽעֲנָא֙ בֶּן אֲחִיל֔וּד
  english_pob_choice: Baana son of Ahilud
  chosen_korean: 바아나, 아힐룻의 아들
  alternatives_korean:
  - 바아나의 아들 아힐룻
  lexicon: 고유명사 음역
  rationale: 인명은 음역하고, 소유/혈연 관계는 한국어의 자연스러운 속격으로 옮겨 원문의 인물 식별을 분명히 했습니다.
- source_word: וְ/כָל בֵּ֣ית שְׁאָ֡ן
  english_pob_choice: and all Beth-shean
  chosen_korean: 벳-스안의 온 지역
  alternatives_korean:
  - 벳-스안 전체
  - 벳-스안
  lexicon: HALOT
  rationale: כָל이 지명과 결합할 때 단순한 전부가 아니라 그에 속한 영토/행정 구역을 가리킬 수 있으므로, 의미를 살려 ‘온 지역’으로 옮겼습니다.
- source_word: אֲשֶׁר֩ אֵ֨צֶל צָרְתַ֜נָ/ה
  english_pob_choice: which is beside Zarethan
  chosen_korean: 사르단 곁
  alternatives_korean:
  - 사르단 근처
  - 사르단 옆
  lexicon: HALOT
  rationale: אֵצֶל의 공간 관계를 간결하게 살리기 위해 ‘곁’을 택했고, 뒤의 관계절은 한국어에서 자연스럽게 압축했습니다.
- source_word: מִ/תַּ֣חַת לְ/יִזְרְעֶ֗אל
  english_pob_choice: below Jezreel
  chosen_korean: 이스르엘 아래에 있는 곳
  alternatives_korean:
  - 이스르엘 아래
  - 이스르엘 남쪽
  lexicon: HALOT
  rationale: 지형적 하위를 나타내는 표현이므로, 방향을 해석해 ‘남쪽’으로 풀기보다 ‘아래에 있는’으로 원문 이미지를 보존했습니다.
- source_word: עַ֖ד מֵ/עֵ֥בֶר לְ/יָקְמֳעָֽם
  english_pob_choice: as far as beyond Jokmeam
  chosen_korean: 욱므암 건너편까지
  alternatives_korean:
  - 욱므암 너머까지
  - 욱므암을 지나 저편까지
  lexicon: HALOT
  rationale: מֵעֵבֶר의 핵심은 경계선 너머/반대편이라는 뜻이므로, 한국어의 ‘건너편’으로 경계 표현을 살렸습니다.
