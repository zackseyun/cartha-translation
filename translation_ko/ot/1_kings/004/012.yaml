  lexicon: HALOT
  rationale: 지형적 하위를 나타내는 표현이므로, 방향을 해석해 ‘남쪽’으로 풀기보다 ‘아래에 있는’으로 원문 이미지를 보존했습니다.
- source_word: עַ֖ד מֵ/עֵ֥בֶר לְ/יָקְמֳעָֽם
  english_pob_choice: as far as beyond Jokmeam
  chosen_korean: 욱므암 건너편까지
  alternatives_korean:
