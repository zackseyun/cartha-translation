translation:
  language: ko
  text: 아히나답은 잇도의 아들이며, 마하나임을 맡았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘마하나임’에 방향을 나타내는 어미가 붙어 있어, 문자적으로는 ‘마하나임 쪽으로’ 또는 ‘마하나임을 향하여’라는 뜻입니다. 그러나 이 행정 목록의 문맥에서는 마하나임을 중심으로 한 지역 또는 관할 구역을 가리키는 것으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִינָדָב
  english_pob_choice: Ahinadab
  chosen_korean: 아히나답
