  text: Ahinadab son of Iddo[a], in Mahanaim.
  footnotes:
  - marker: a
    text: Hebrew has a directional ending on 'Mahanaim,' literally 'toward Mahanaim.' In this administrative context, the sense is likely the district centered in or at Mahanaim.
    reason: lexical_alternative
translation:
  language: ko
  text: 아히나답, 이또의 아들, 마하나임에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘마하나임’에 방향을 나타내는 어미가 붙어 있어, 문자적으로는 ‘마하나임 쪽으로/향하여’에 가깝습니다. 그러나 이 행정 맥락에서는 마하나임을 중심으로 한 지역 또는 관할 구역을 가리키는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
