  rationale: 고유명사는 통일된 음역이 필요하므로 영어 POB의 Iddo를 한국어로 음역했습니다.
- source_word: מַחֲנָיְמָה
  english_pob_choice: in Mahanaim
  chosen_korean: 마하나임에
  alternatives_korean:
