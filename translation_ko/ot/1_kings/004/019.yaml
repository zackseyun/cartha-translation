  text: גֶּ֥בֶר בֶּן אֻרִ֖י בְּ/אֶ֣רֶץ גִּלְעָ֑ד אֶ֜רֶץ סִיח֣וֹן מֶ֣לֶךְ הָ/אֱמֹרִ֗י וְ/עֹג֙ מֶ֣לֶךְ הַ/בָּשָׁ֔ן וּ/נְצִ֥יב אֶחָ֖ד אֲשֶׁ֥ר בָּ/אָֽרֶץ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/019.yaml
  text: Geber son of Uri[a], in the land of Gilead, the land of Sihon king of the Amorites and of Og king of Bashan; and he was the only governor who was in the land.
  footnotes:
  - marker: a
    text: Or, 'who was over the land.' The Hebrew literally reads 'who was in the land,' but some take the phrase in an administrative sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 기벌은 길르앗 땅, 곧 아모리 사람의 왕 시혼과 바산 왕 옥의 땅에 있던 유리의 아들이었고, 그 땅에 있던 유일한 총독이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅을 관할한 자’로도 옮길 수 있습니다. 히브리어는 문자적으로는 ‘그 땅에 있던’이라고 되어 있지만, 행정적 의미로 이해하는 견해도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  english_pob_choice: Geber
  chosen_korean: 기벌
  alternatives_korean:
  - 게벨
  - 게버
  lexicon: 고유명사 음역
  rationale: 인명으로 보고 현대 한국어 외래어 표기법에 따라 음역했습니다.
- source_word: בֶּן אֻרִי
  english_pob_choice: son of Uri
  chosen_korean: 유리의 아들
  alternatives_korean:
  - 우리의 아들
  - 우리의 자손
  lexicon: HALOT
  rationale: 히브리어 친족표현 בן을 자연스럽게 ‘...의 아들’로 옮겼습니다.
- source_word: בְּ/אֶרֶץ גִּלְעָד ... אֶרֶץ
  english_pob_choice: in the land of Gilead ... the land
  chosen_korean: 길르앗 땅
  alternatives_korean:
  - 길르앗에
  - 길르앗 지방
  lexicon: HALOT
  rationale: אֶרֶץ를 두 번 살려 지리적 범주를 유지하되, 한국어에서는 반복을 줄이기 위해 첫 절을 ‘길르앗 땅’으로 압축했습니다.
- source_word: נְצִיב
  english_pob_choice: governor
  chosen_korean: 총독
  alternatives_korean:
  - 지방관
  - 관리
  lexicon: HALOT
  rationale: 문맥상 왕이 임명한 지역 행정관으로서의 의미를 살리되, 현대 독자가 바로 이해할 수 있게 ‘총독’으로 옮겼습니다.
- source_word: אֲשֶׁר בָּאָרֶץ
  english_pob_choice: who was in the land
  chosen_korean: 그 땅에 있던
  alternatives_korean:
  - 그 땅을 다스리던
  - 그 땅에 있었던
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그 땅에 있는’이지만, 문맥상 행정적 의미를 배제하지 않고 POB의 보류를 따라 ‘그 땅에 있던’으로 남겼습니다.
theological_decisions:
- issue: ‘only governor’에 대한 행정적 의미 보존
  chosen_reading: 기벌이 그 지역의 유일한 총독이었다는 뜻을 분명히 했습니다.
  alternative_readings:
  - 그 땅에 한 명의 총독이 있었다
  - 그 땅을 다스리는 총독이었다
  rationale: 영문 POB의 개정판이 Geber 자신을 유일한 행정관으로 명시하므로, 히브리어의 무동사 구조를 한국어에서 자연스럽게 풀어 그 의미를 보존했습니다.
  doctrine_reference: 본문의 역사 서술 보존
