revisions:
- from: 기벌은 길르앗 땅, 곧 아모리 사람의 왕 시혼과 바산 왕 옥의 땅에 있던 유리의 아들이었고, 그 땅에 있던 유일한 총독이었습니다.[a]
  to: 우리의 아들 게벨은 길르앗 땅, 곧 아모리 사람들의 왕 시혼과 바산 왕 옥의 땅에 있었으며, 그 땅에 있던 유일한 총독이었습니다.[a]
  rationale: 고유명사를 표준 성서 한국어의 통용 표기인 ‘우리’와 ‘게벨’로 바로잡았습니다. 문장 배열을 조정하여 히브리어의 ‘우리의 아들 게벨’이라는 부칭 구조를 보존했고, ‘유일한 총독’과 각주를 통해 אֶחָד 및 אֲשֶׁר בָּאָרֶץ의 행정적·문자적 긴장을 유지했습니다.
