base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/019.yaml
  text: Geber son of Uri[a], in the land of Gilead, the land of Sihon king of the Amorites and of Og king of Bashan; and he was the only governor who was in the land.
  footnotes:
  - marker: a
    text: Or, 'who was over the land.' The Hebrew literally reads 'who was in the land,' but some take the phrase in an administrative sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리의 아들 게벨은 길르앗 땅, 곧 아모리 사람들의 왕 시혼과 바산 왕 옥의 땅에 있었으며, 그 땅에 있던 유일한 총독이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅을 관할한 자’로도 옮길 수 있습니다. 히브리어는 문자적으로는 ‘그 땅에 있던’이라고 되어 있지만, 행정적 의미로 이해하는 견해도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  english_pob_choice: Geber
  chosen_korean: 기벌
  alternatives_korean:
  - 게벨
  - 게버
  lexicon: 고유명사 음역
