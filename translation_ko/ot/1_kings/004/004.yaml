source:
  edition: WLC
  text: וּ/בְנָיָ֥הוּ בֶן יְהוֹיָדָ֖ע עַל הַ/צָּבָ֑א וְ/צָד֥וֹק וְ/אֶבְיָתָ֖ר כֹּהֲנִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/004.yaml
  text: Benaiah son of Jehoiada was over the army[a], and Zadok and Abiathar were priests.
  footnotes:
  - marker: a
    text: Or 'chief ministers' or 'principal officers' for 'priests,' if כֹּהֲנִים is understood here in a broader court-administrative sense.
    reason: alternative_reading
translation:
  language: ko
  text: 브나야는 여호야다의 아들로서 군대의 책임자였고, 사독과 아비아달은 제사장이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제사장들’은 여기서 더 넓게는 ‘주된 관리들’ 또는 ‘수석 대신들’로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל הַצָּבָא
  english_pob_choice: was over the army
  chosen_korean: 군대의 책임자였고
  alternatives_korean:
  - 군대 위에 있었고
  - 군대를 맡고 있었고
  - 군대의 지휘관이었고
  lexicon: HALOT
  rationale: עַל은 직분·관할의 의미로 쓰여 ‘~위에 있다’는 식의 직역보다, 통치·감독 관계를 드러내는 ‘책임자’가 한국어로 자연스럽고 의미를 잘 보존합니다.
- source_word: הַצָּבָא
  english_pob_choice: the army
  chosen_korean: 군대
  alternatives_korean:
  - 군사
  - 군
  - 군대 조직
  lexicon: HALOT
  rationale: צָבָא의 기본 의미는 조직된 군사력이며, 여기서는 하늘의 군대가 아니라 지상 군대를 가리키므로 ‘군대’가 가장 분명합니다.
- source_word: כֹּהֲנִים
  english_pob_choice: priests
  chosen_korean: 제사장이었습니다
  alternatives_korean:
  - 제사장들이었습니다
  - 제사장들이었고
  - 주된 관리들이었습니다
  lexicon: HALOT
  rationale: 히브리어 כֹּהֲנִים의 기본 의미를 따라 ‘제사장’으로 옮겼습니다. 문맥상 행정적 확장 해석이 가능하지만, 사독과 아비아달의 통상적 제사장 신분이 본문에 잘 맞습니다.
- source_word: בְנָיָהוּ / יְהוֹיָדָע / צָדוֹק / אֶבְיָתָר
  english_pob_choice: Benaiah / Jehoiada / Zadok / Abiathar
  chosen_korean: 브나야 / 여호야다 / 사독 / 아비아달
  alternatives_korean:
  - 베나야 / 여호야다 / 자독 / 아비아달
  - 브나야후 / 예호야다 / 차독 / 에비아달
  lexicon: 표준 외래어 표기 관행
  rationale: 한국어 성경에서 널리 통용되는 인명 표기를 우선했습니다. 사독은 관용 표기를 따르고, 여호야다는 표준 음역을 유지했습니다.
theological_decisions:
- issue: כֹּהֲנִים을 행정 관료 일반으로 넓혀 볼 것인지, 문자적 의미인 제사장으로 유지할 것인지
  chosen_reading: 제사장으로 유지했습니다.
  alternative_readings:
  - 주된 관리들
  - 수석 대신들
  rationale: 본문의 행정적 배경은 인정되지만, 제사장 신분을 가진 사독과 아비아달이 함께 언급되므로 본래 의미를 유지하는 편이 독자가 본문의 신분 구분을 더 정확히 이해하게 합니다.
  doctrine_reference: 번역 원칙 §§1, 3, 5
