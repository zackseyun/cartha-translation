base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/005.yaml
  text: Azariahu son of Nathan was over the governors[a], and Zabud son of Nathan was priest and the king’s friend.
  footnotes:
  - marker: a
    text: Or possibly 'chief minister' or 'royal adviser' for 'priest' in this court setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 아사랴후는 나단의 아들로서 관리들을 맡았고, 자붓은 나단의 아들로서 제사장이며 왕의 벗이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제사장’은 이 궁정 문맥에서 ‘궁정 대신’ 또는 ‘왕실 고문’으로 볼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲזַרְיָהוּ
  english_pob_choice: Azariahu
  chosen_korean: 아사랴후
  alternatives_korean:
  - 아사랴
  - 아사랴야후
  lexicon: 고유명사 음역
  rationale: 히브리어 이름 끝의 -יהו(-yahu)를 반영하여 영어 POB의 Azariahu에 맞추어 음역했습니다.
- source_word: הַנִּצָּבִים
  english_pob_choice: the governors
  chosen_korean: 관리들
  alternatives_korean:
  - 총독들
  - 수령들
  - 관원들
  lexicon: HALOT
  rationale: 솔로몬 행정 체계의 직책을 가리키는 말이지만, 한국어에서는 지역 통치자 뉘앙스를 과도하게 좁히지 않으면서도 행정 담당자임을 드러내는 ‘관리들’이 무난합니다.
- source_word: כֹּהֵן
  english_pob_choice: priest
  chosen_korean: 제사장
  alternatives_korean:
  - 제관
  - 궁정 대신
  lexicon: HALOT
  rationale: 기본 어휘 의미를 살려 ‘제사장’으로 옮겼고, 궁정 관직 가능성은 본문이 아니라 각주로 처리하는 방침을 따랐습니다.
- source_word: רֵעֶה הַמֶּלֶךְ
  english_pob_choice: the king’s friend
  chosen_korean: 왕의 친구
  alternatives_korean:
  - 왕의 동반자
  - 왕의 측근
  lexicon: HALOT
  rationale: 직역에 가까우면서도 관용적으로 이해되는 표현을 유지했습니다. 이 구는 단순한 우정을 넘어 왕의 친밀한 측근을 뜻할 수 있지만, 본문은 그 표현 자체를 보존합니다.
theological_decisions:
- issue: כֹּהֵן의 궁정 직책 가능성
  chosen_reading: 본문에는 ‘제사장’으로 두고, 궁정 고위직일 수 있다는 가능성은 각주로 남깁니다.
  alternative_readings:
  - 궁정 대신
  - 왕실 고문
  rationale: 어휘의 기본 의미를 훼손하지 않으면서도, 이 구절의 행정적 문맥이 제사장 직무와 긴장될 수 있음을 보존하기 위해서입니다.
  doctrine_reference: 번역 원칙 §§1, 3, 5
