base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/003.yaml
  text: Elihoreph and Ahijah[a], the sons of Shisha, were secretaries[c][b]; Jehoshaphat the son of Ahilud was the recorder.
  footnotes:
  - marker: a
    text: 'Hebrew: ''sons of Shisha.'' A parallel passage (2 Sam 8:17) has a related name form often rendered ''Shavsha.'''
    reason: alternative_reading
  - marker: b
    text: Or 'scribes' for 'secretaries'; the Hebrew term refers to royal writing officials.
    reason: lexical_alternative
  - marker: c
    text: Or 'the chronicler' or 'the remembrancer' for 'the recorder,' referring to a court official who maintained records and reported matters to the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리호렙과 아히야는 시사의 아들들로서 서기관들이었습니다. 여호사밧은 아힐룻의 아들로서 기록관이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 '시사의 아들들'이라고 읽습니다. 병행구절(2사무엘 8:17)에는 관련된 이름형이 나타나며, 흔히 '세브사'로 옮깁니다.
    reason: alternative_reading
  - marker: b
    text: '''서기관들''은 궁정의 문서 작성 관직을 가리키며, 단순한 필사자보다 넓은 행정 직분입니다.'
    reason: lexical_alternative
  - marker: c
    text: '''기록관''은 왕에게 사건을 보고하고 기록을 관리하던 궁정 관직을 가리킵니다.'
    reason: lexical_alternative
