reference: 1 Kings 15:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב אָסָא֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ עִם אֲבֹתָ֔י/ו בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ יְהוֹשָׁפָ֥ט בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/024.yaml
  text: And Asa slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoshaphat his son reigned in his place.
  footnotes:
  - marker: a
    text: Or 'with his ancestors.' The Hebrew literally says 'with his fathers,' a standard royal formula for death and burial.
    reason: lexical_alternative
  - marker: b
    text: '''His father'' refers to David as Asa''s royal forefather, not his immediate parent.'
    reason: cultural_note
translation:
  language: ko
  text: 아사는 그의 조상들과 함께 잠들어[a] 그의 조상들과 함께 그의 조상 다윗의 성에 장사되었으며, 그의 아들 여호사밧이 그의 뒤를 이어 왕이 되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 아버지들과 함께’라고 합니다. 이는 열왕기에 나오는 왕의 죽음과 매장을 나타내는 정형화된 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 조상 다윗’은 아사의 직계 부친이 아니라 왕조적 선조인 다윗을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 누웠고
  alternatives_korean:
  - 잠들었고
  - 죽었고
  lexicon: HALOT
  rationale: 왕의 죽음을 나타내는 관용구를 살리되, 한국어에서는 직역형 ‘잠들다’보다 서술문 흐름에 맞는 ‘누웠고’를 택해 다음 절의 매장 표현과 자연스럽게 연결했습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 히브리어의 관용적 왕실 장례 공식을 살리면서, 한국어에서는 ‘아버지들’보다 의미가 분명한 ‘조상들’로 옮겨 동적이면서도 혈통/왕조의 뉘앙스를 유지했습니다.
- source_word: בְּעִיר דָּוִד אָבִיו
  english_pob_choice: in the city of David his father
  chosen_korean: 다윗 성에
  alternatives_korean:
  - 그의 아버지 다윗의 성에
  - 다윗의 성에
  lexicon: HALOT
  rationale: ‘his father’가 직계 부친이 아니라 왕조적 조상 다윗을 가리키므로, 관용적으로 통용되는 ‘다윗 성’으로 압축해 의미를 보존했습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: reigned in his place
  chosen_korean: 그의 뒤를 이어 왕이 되었습니다
  alternatives_korean:
  - 그의 자리를 이어 다스렸습니다
  - 그 대신 왕이 되었습니다
  lexicon: HALOT
  rationale: 후계 즉위 공식을 한국어 왕정 서술에 자연스럽게 반영하되, 단순한 시간적 ‘뒤에’가 아니라 왕권의 계승이라는 점을 드러냈습니다.
theological_decisions:
- issue: 왕실 장례 공식의 반복 보존
  chosen_reading: ‘누웠고 / 장사되었으며’로 이어지는 이중 공식 표현을 유지했습니다.
  alternative_readings:
  - ‘죽었고 묻혔습니다’로 단순화
  - 한 문장으로 압축
  rationale: 열왕기의 정형화된 왕실 사망·매장 공식을 보존하면 본문의 문학적 리듬과 왕조 연속성이라는 신학적 메시지가 더 분명해집니다.
  doctrine_reference: 열왕기 사가의 왕조 계승 서술
