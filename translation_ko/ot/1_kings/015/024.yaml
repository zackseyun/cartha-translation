- from: 아사와 그의 조상들에 누웠고, 그의 조상들과 함께 다윗 성에 장사되었으며, 그의 아들 여호사밧이 그의 뒤를 이어 왕이 되었습니다.[a][b]
  to: 아사는 그의 조상들과 함께 잠들어[a] 그의 조상들과 함께 그의 조상 다윗의 성에 장사되었으며, 그의 아들 여호사밧이 그의 뒤를 이어 왕이 되었습니다.[b]
