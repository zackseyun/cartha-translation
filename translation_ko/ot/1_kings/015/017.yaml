base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/017.yaml
  text: Then Baasha king of Israel went up against Judah and built Ramah[b][a], so as not to allow anyone to go out or come in to Asa king of Judah.
  footnotes:
  - marker: a
    text: Or 'fortified Ramah'; the Hebrew verb is simply 'built,' but the context suggests a strategic military construction.
    reason: lexical_alternative
  - marker: b
    text: The expression 'go out or come in' is a Hebrew idiom for ordinary movement or access; the sense is that Baasha sought to block traffic to Asa king of Judah.
    reason: cultural_note
translation:
  language: ko
  text: 그때 이스라엘 왕 바아사가 유다를 치러 올라와 라마를 지어, 유다 왕 아사에게 나가거나 들어오는 사람이 없게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘라마를 지어’로 번역한 히브리어 동사는 단순히 ‘짓다’라는 뜻입니다. 문맥상 전략적 군사 공사를 가리킬 수 있으므로 ‘라마를 요새화하여’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나가거나 들어오다’는 히브리어에서 출입이나 왕래를 가리키는 관용적 표현입니다. 여기서는 바아사가 아사와 관련된 왕래를 차단하려 했다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְהוּדָה
  english_pob_choice: went up against Judah
  chosen_korean: 유다를 치러 올라와
  alternatives_korean:
  - 유다를 향해 올라와
  - 유다에 맞서 올라와
  lexicon: HALOT
  rationale: עלה는 군사적 문맥에서 ‘올라가다’와 함께 공격 방향을 드러내므로, 한국어에서도 공격 의도를 살린 ‘치러 올라와’가 자연스럽습니다.
- source_word: וַיִּבֶן אֶת הָרָמָה
  english_pob_choice: built Ramah
  chosen_korean: 라마를 쌓아
  alternatives_korean:
  - 라마를 세워
  - 라마를 건축하여
  lexicon: HALOT
  rationale: בנה는 기본적으로 ‘짓다/세우다’이지만, 문맥상 방어적 군사 공사로 읽히므로 ‘쌓아’로 옮겨 전략적 성격을 드러냈습니다.
- source_word: לְבִלְתִּי תֵּת יֹצֵא וָבָא
  english_pob_choice: so as not to allow anyone to go out or come in
  chosen_korean: 사람이 나가거나 들어오지 못하게
  alternatives_korean:
  - 나가고 들어오는 일을 막으려고
  - 출입하지 못하게
  lexicon: HALOT
  rationale: ‘나가다/들어오다’는 히브리어 관용구의 출입 차단을 살리며, 한국어에서는 목적을 분명히 하는 ‘-지 못하게’가 가장 직접적입니다.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  english_pob_choice: to Asa king of Judah
  chosen_korean: 유다 왕 아사에게
  alternatives_korean:
  - 유다 왕 아사에게로
  - 유다 왕 아사를 향하여
  lexicon: HALOT
  rationale: לְ는 이 구절에서 차단 대상의 관계를 나타내므로, 블로킹의 목적지로서 ‘~에게’가 가장 절제된 표현입니다.
