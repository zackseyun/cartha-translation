id: 1KI.15.19
reference: 1 Kings 15:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּרִית֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ בֵּ֥ין אָבִ֖/י וּ/בֵ֣ין אָבִ֑י/ךָ הִנֵּה֩ שָׁלַ֨חְתִּֽי לְ/ךָ֥ שֹׁ֨חַד֙ כֶּ֣סֶף וְ/זָהָ֔ב לֵ֣ךְ הָפֵ֗רָ/ה אֶת בְּרִֽיתְ/ךָ֙ אֶת בַּעְשָׁ֣א מֶֽלֶךְ יִשְׂרָאֵ֔ל וְ/יַעֲלֶ֖ה מֵ/עָלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/019.yaml
  text: There is a covenant between me and you, between my father and your father. Look, I have sent you a bribe of silver and gold. Go, break your covenant with Baasha king of Israel, so that he may withdraw from me.
translation:
  language: ko
  text: “나와 당신 사이, 내 아버지와 당신의 아버지 사이에는 언약이 있습니다. 보십시오, 내가 당신에게 은과 금의 뇌물을 보냈습니다. 가서 당신의 언약을 바아사 이스라엘 왕과 깨뜨리십시오. 그러면 그가 내게서 물러날 것입니다.”[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘언약’은 히브리어 בְּרִית의 직접 대응입니다.
    reason: source_note
lexical_decisions:
- source_word: בְּרִית
  english_pob_choice: covenant
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 맹약
  lexicon: covenant
  rationale: 히브리어 בְּרִית는 단순한 계약보다 상호 구속력을 지닌 언약이므로, POB의 covenant를 한국어 성서어법에서 가장 직접적으로 반영하는 ‘언약’을 택했습니다.
- source_word: שֹׁחַד
  english_pob_choice: bribe
  chosen_korean: 뇌물
  alternatives_korean:
  - 선물
  - 사례
  lexicon: bribe
  rationale: 본문과 POB가 의도적으로 부정적 뉘앙스의 bribe를 택하므로, 가치중립적인 ‘선물’이 아니라 ‘뇌물’로 옮겨 source의 윤리적 평가를 유지했습니다.
- source_word: הָפֵרָה
  english_pob_choice: break
  chosen_korean: 깨뜨리십시오
  alternatives_korean:
  - 어기십시오
  - 파기하십시오
  lexicon: break
  rationale: 언약을 ‘break’하는 행위를 한국어에서 법적·관계적 파기로 분명히 드러내기 위해 ‘깨뜨리십시오’를 사용했습니다.
- source_word: וְ/יַעֲלֶ֖ה מֵ/עָלָֽ/י
  english_pob_choice: so that he may withdraw from me
  chosen_korean: 그러면 그가 내게서 물러날 것입니다
  alternatives_korean:
  - 그러면 그가 나를 떠날 것입니다
  - 그래서 그가 내게서 올라갈 것입니다
  lexicon: withdraw
  rationale: 직역하면 ‘내 위에서 올라가다’이지만 한국어에서는 관계의 압박이 풀리는 결과를 자연스럽게 드러내는 ‘내게서 물러날 것입니다’가 source의 의도를 가장 잘 보존합니다.
theological_decisions:
- issue: 언약 관계의 정치적·도덕적 성격
  chosen_reading: 본문의 언약은 단순 외교 협정이 아니라, 서로의 충성을 저버리도록 요구하는 중대한 언약 파기로 제시했습니다.
  alternative_readings:
  - 중립적인 외교적 합의로 완화
  - 단순한 동맹 해제로 처리
  rationale: 히브리어와 POB의 bribe 선택은 이 행위의 도덕적 문제를 흐리지 않으므로, 한국어도 그 긴장을 유지해야 합니다.
  doctrine_reference: 성경의 언약 윤리와 정직성
- issue: ‘내게서 물러날’의 표현
  chosen_reading: ‘물러날’로 옮겨 לחץ/압박이 풀리는 방향을 살리되, 군사적 위협이 해소되는 맥락을 남겼습니다.
  alternative_readings:
  - 떠날 것입니다
  - 뒤로 물러설 것입니다
  rationale: 문맥상 바아사의 압박이 사라지는 결과를 나타내야 하며, 한국어 ‘물러날’은 그 함의를 비교적 정확히 전달합니다.
  doctrine_reference: 문맥적 의미 보존
