base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/007.yaml
  text: Now the rest of the acts of Abijam[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah? And there was war between Abijam and Jeroboam.
  footnotes:
  - marker: a
    text: Abijam is called Abijah in some parallel or related passages; the Hebrew text here reads Abijam.
    reason: alternative_reading
  - marker: b
    text: Or 'the annals of the kings of Judah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아비얌의 남은 행적과 그가 행한 모든 일은 유다 왕들의 역대지략에 기록되어 있지 않습니까? 아비얌과 여로보암 사이에는 전쟁이 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아비얌은 일부 평행 구절에서 아비야로 불리며, 여기서는 히브리어 본문 형태를 따랐습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘유다 왕들의 연대기’입니다.
    reason: lexical_alternative
