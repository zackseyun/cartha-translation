source:
  edition: WLC
  text: אֲשֶׁ֨ר עָשָׂ֥ה דָוִ֛ד אֶת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹֽא סָ֞ר מִ/כֹּ֣ל אֲשֶׁר צִוָּ֗/הוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו רַ֕ק בִּ/דְבַ֖ר אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/005.yaml
  text: because David had done what was right in the eyes of Yahweh and had not turned aside from anything that he had commanded him all the days of his life[a], except in the matter of Uriah the Hittite.
  footnotes:
  - marker: a
    text: Or 'in the case of Uriah the Hittite.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 야훼 보시기에 옳은 일을 하고, 그의 평생 동안 그가 명령한 것에서 하나도 벗어나지 않았습니다. 다만 헷 사람 우리야의 일은 예외였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '헷 사람 우리야의 경우에.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  english_pob_choice: because
  chosen_korean: -하였기 때문입니다
  alternatives_korean:
  - -해서
  - -이므로
  - -한 까닭에
  lexicon: HALOT
  rationale: 문맥상 앞 절의 이유를 설명하는 접속이므로, 한국어에서도 원인·이유 관계를 분명히 드러냈습니다.
- source_word: עָשָׂה ... אֶת הַיָּשָׁר
  english_pob_choice: had done what was right
  chosen_korean: 옳은 일을 하고
  alternatives_korean:
  - 바른 일을 하고
  - 의로운 일을 하고
  - 옳다고 여겨지는 일을 하고
  lexicon: HALOT
  rationale: 히브리어 관용구는 도덕적 평가를 가리키므로, 자연스러운 현대 한국어로 '옳은 일'을 택했습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  - 야훼께서 보시기에
  lexicon: HALOT
  rationale: 평가적 관용구를 유지하되 한국어에서는 존대 표현 '보시기에'로 자연스럽게 옮겼습니다.
- source_word: וְלֹא סָר מִכֹּל אֲשֶׁר צִוָּהוּ
  english_pob_choice: and had not turned aside from anything that he had commanded him
  chosen_korean: 그의 평생 동안 그가 명령한 것에서 하나도 벗어나지 않았습니다
  alternatives_korean:
  - 그의 평생 동안 그가 명령한 것에서 조금도 떠나지 않았습니다
  - 그의 평생 동안 그가 명령한 어떤 것에서도 벗어나지 않았습니다
  lexicon: HALOT
  rationale: '''turn aside''의 이탈 의미를 살려 ''벗어나지 않았다''로 옮기고, כֹּל의 전면성을 ''하나도''로 반영했습니다.'
- source_word: רַק בִּדְבַר אוּרִיָּה הַחִתִּי
  english_pob_choice: except in the matter of Uriah the Hittite
  chosen_korean: 다만 헷 사람 우리야의 일은 예외였습니다
  alternatives_korean:
  - 오직 헷 사람 우리야의 일만은 예외였습니다
  - 헷 사람 우리야의 사건은 예외였습니다
  - 헷 사람 우리야에 관한 일은 예외였습니다
  lexicon: HALOT
  rationale: דְבַר는 여기서 '일/사건/문제'의 뜻이므로, 너무 법정적이지 않은 '일'로 옮겨 예외 조항의 기능을 살렸습니다.
theological_decisions:
- issue: 다윗에 대한 전면적 칭찬과 명시적 예외의 긴장
  chosen_reading: 본문의 칭찬을 완화하지 않고, '예외'를 분명히 드러내어 그대로 유지했습니다.
  alternative_readings:
  - 회개를 암시하도록 풀어 쓰기
  - '''대체로 충실했다''처럼 범위를 약화하기'
  rationale: 본문은 다윗의 전반적 순종을 말하면서도 분명한 예외를 남기므로, 그 긴장을 해소하지 않고 보존하는 것이 소스 충실성에 맞습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
