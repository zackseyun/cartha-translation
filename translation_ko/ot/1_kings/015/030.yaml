  source_fidelity: 개정이 필요합니다. בְּכַעְסוֹ는 이 문맥에서 야훼를 노하게 한 여로보암의 행위, 곧 ‘도발/격분하게 함’으로 이해하는 것이 뒤따르는 הִכְעִיס와의 어근 반복을 더 잘 반영합니다. 초안의 ‘그의 격분’은 여로보암 자신의 감정 상태를 뜻하는 한국어 표현으로 읽히기 쉬워 원문의 문맥적 의미를 흐립니다.
  naturalness: ‘그가 … 격노하게 한 그의 격분’은 동일 의미가 중첩되고 소유격 관계도 부자연스럽습니다. ‘야훼를 격노하게 한 도발’로 옮기면 현대 표준어 합쇼체에서 자연스럽고 인과 관계도 분명합니다.
  terminology: ‘여로보암’, ‘이스라엘’, ‘하나님’, ‘야훼’는 적절합니다. חַטֹּאות의 복수성을 ‘죄들’로 나타내고, הֶחֱטִיא의 사역 의미는 ‘이스라엘로 죄를 짓게 한’으로 보존했습니다. כַּעַס의 대안 의미는 각주에서 ‘노여움’으로 남깁니다.
