translation:
  language: ko
  text: 이는 여로보암이 저지른 죄들, 곧 그가 이스라엘로 죄를 짓게 한 죄들 때문이며, 또 그가 이스라엘의 하나님이신 야훼를 격노하게 한 도발 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 노여움’으로 옮길 수 있습니다. 히브리어 명사는 분노 또는 분노를 일으키는 도발을 뜻할 수 있으나, 뒤의 ‘격노하게 한’이라는 동사와의 연결상 여기서는 ‘도발’이 더 잘 어울립니다.
    reason: lexical_alternative
