  text: because of the sins of Jeroboam that he committed and by which he caused Israel to sin[a], and because of his provocation by which he provoked Yahweh, the God of Israel.
  footnotes:
  - marker: a
    text: Or 'by his anger'; the Hebrew noun can denote anger or provocation, but here 'provocation' best matches the following verb 'provoked.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 여로보암이 저지른 죄와 그가 이스라엘에게 죄를 짓게 한 일, 그리고 그가 이스라엘의 하나님이신 야훼를 격노하게 한 그의 격분 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 노여움’으로도 옮길 수 있습니다. 히브리어 명사는 분노나 격분을 뜻할 수 있으나, 뒤의 ‘격노하게 한’이라는 동사와 맞물릴 때는 ‘격분’이 더 잘 어울립니다.
    reason: lexical_alternative
