  to: 그가 왕이 되었을 때, 여로보암의 온 집안을 쳤습니다. 그는 여로보암의 집안을 멸망시킬 때까지 그 집안에 숨 쉬는 자를 하나도[a] 남겨 두지 않았습니다[b]. 이는 야훼께서 그의 종 실로 사람 아히야를 통하여 말씀하신 대로였습니다.
  rationale: 수정문은 ‘온 집안’이라는 왕조·가문 표현을 유지하고, נְשָׁמָה의 ‘숨’ 이미지를 본문과 각주에 보존했습니다. 히브리어의 단수 목적어가 지닌 형식적 특성과 문맥상 집합적 지시를 각주로 밝혀, 불필요하게 특정 해석을 강요하지 않으면서도 한국어 본문의 선행사를 명료하게 했습니다. 또한 각주 표지를 해당 어구에 배치했습니다.
