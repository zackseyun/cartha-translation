source:
  edition: WLC
  text: וַ/יְהִ֣י כְ/מָלְכ֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית יָרָבְעָ֔ם לֹֽא הִשְׁאִ֧יר כָּל נְשָׁמָ֛ה לְ/יָרָבְעָ֖ם עַד הִשְׁמִד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥ה הַ/שִּׁילֹנִֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/029.yaml
  text: And when he became king[a], he struck down all the house of Jeroboam. He did not leave to Jeroboam a single living thing, until he had destroyed him[b], according to the word of Yahweh that he had spoken by the hand of his servant Ahijah the Shilonite.
  footnotes:
  - marker: a
    text: Literally, 'he did not leave ... any breath'; that is, he left no one alive.
    reason: lexical_alternative
  - marker: b
    text: Or 'until he had destroyed it,' referring to Jeroboam's house as a collective.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 왕이 되었을 때, 그는 여로보암의 집안을 모두 쳤습니다. 그는 여로보암에게 살아 있는 것 하나도 남겨 두지 않았고, 그를 멸망시킬 때까지 그리하였습니다. 이는 야훼께서 그의 종 실로 사람 아히야를 통해 말씀하신 야훼의 말씀대로였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나하나 숨 쉬는 것’을 뜻하는 히브리어 관용구입니다. 여기서는 살아남은 사람이 없었다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여로보암의 ‘집안’을 집합적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִ֣י כְ/מָלְכ֗/וֹ
  english_pob_choice: And when he became king
  chosen_korean: 그가 왕이 되었을 때
  alternatives_korean:
  - 그가 통치하기 시작했을 때
  - 그가 왕위에 올랐을 때
  lexicon: WLC
  rationale: 서사적 시간 부사구를 자연스러운 한국어 종속절로 옮기되, 즉위 직후의 상황을 분명히 드러내기 위해 '왕이 되었을 때'로 렌더링했습니다.
- source_word: הִכָּה֙ אֶת כָּל בֵּ֣ית יָרָבְעָ֔ם
  english_pob_choice: he struck down all the house of Jeroboam
  chosen_korean: 여로보암의 집안을 모두 쳤습니다
  alternatives_korean:
  - 여로보암의 집안을 모두 멸하였습니다
  - 여로보암의 온 집안을 쳤습니다
  lexicon: HALOT
  rationale: הִכָּה의 폭력적 타격 의미를 살리면서도 왕조 전체를 가리키는 '집안'을 유지했습니다.
- source_word: לֹֽא הִשְׁאִ֧יר כָּל נְשָׁמָ֛ה
  english_pob_choice: He did not leave ... a single living thing
  chosen_korean: 살아 있는 것 하나도 남겨 두지 않았고
  alternatives_korean:
  - 호흡하는 것 하나도 남겨 두지 않았고
  - 한 생명도 남겨 두지 않았고
  lexicon: HALOT
  rationale: נְשָׁמָה의 문자적 '호흡' 이미지를 너무 어색하게 만들지 않으면서, POB의 최종 영어처럼 생존자 전멸의 뜻을 한국어로 자연스럽게 옮겼습니다.
- source_word: כִּ/דְבַ֣ר יְהוָ֔ה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 야훼의 말씀대로
  alternatives_korean:
  - 야훼의 말씀에 따라
  - 야훼께서 말씀하신 대로
  lexicon: HALOT
  rationale: יַהְוֶה를 관례적 대체어가 아니라 고유명 '야훼'로 옮겨, 본문에 직접 나타난 신적 이름을 보존했습니다.
- source_word: אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥ה הַ/שִּׁילֹנִֽי
  english_pob_choice: that he had spoken by the hand of his servant Ahijah the Shilonite
  chosen_korean: 그의 종 실로 사람 아히야를 통해 말씀하신
  alternatives_korean:
  - 그의 종 아히야 실로 사람을 통해 말씀하신
  - 그의 종 아히야 실로 사람의 손을 통해 말씀하신
  lexicon: HALOT
  rationale: בְיַד의 관용적 매개 표현을 '를 통해'로 풀어 한국어에서 이해 가능하게 하면서, 아히야의 출신을 '실로 사람'으로 표준적으로 옮겼습니다.
