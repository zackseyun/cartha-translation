reference: 1 Kings 15:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֨ר עָלָ֜י/ו בַּעְשָׁ֤א בֶן אֲחִיָּה֙ לְ/בֵ֣ית יִשָּׂשכָ֔ר וַ/יַּכֵּ֣/הוּ בַעְשָׁ֔א בְּ/גִבְּת֖וֹן אֲשֶׁ֣ר לַ/פְּלִשְׁתִּ֑ים וְ/נָדָב֙ וְ/כָל יִשְׂרָאֵ֔ל צָרִ֖ים עַֽל גִּבְּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/027.yaml
  text: Then Baasha son of Ahijah[a], of the house of Issachar, conspired against him, and Baasha struck him down at Gibbethon, which belonged to the Philistines[c][b], while Nadab and all Israel were besieging Gibbethon.
  footnotes:
  - marker: a
    text: Or 'plotted against him' / 'formed a conspiracy against him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'killed him'; Hebrew literally 'struck him.'
    reason: lexical_alternative
  - marker: c
    text: Or 'which was held by the Philistines.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 바아사, 아히야의 아들이며 잇사갈 집안 출신인 사람이 그를 반역하여 기브던에서 그를 쳤습니다. 그곳은 블레셋 사람들에게 속한 곳이었습니다[c][b]. 나답과 온 이스라엘은 기브던을 포위하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘그를 죽였습니다.’ 히브리어는 문자적으로 ‘그를 쳤습니다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그곳은 블레셋 사람들의 지배 아래 있었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  english_pob_choice: conspired against him
  chosen_korean: 그를 반역하여
  alternatives_korean:
  - 그를 모의하여
  - 그를 상대로 음모를 꾸며
  lexicon: HALOT
  rationale: קשר עַל은 단순한 내적 계획보다 대상에 대한 반역·음모를 뜻하므로, 왕권을 겨냥한 정치적 배반을 드러내는 ‘반역하여’로 옮겼습니다.
- source_word: לְבֵית יִשָּׂשכָר
  english_pob_choice: of the house of Issachar
  chosen_korean: 잇사갈 집안 출신인
  alternatives_korean:
  - 잇사갈 집안의
  - 잇사갈 가문에 속한
  lexicon: HALOT
  rationale: 계보를 나타내는 ‘house’는 한국어에서 혈족·가문을 드러내는 ‘집안’이 자연스럽고, 바아사의 출신 배경을 분명히 합니다.
- source_word: וַיַּכֵּהוּ
  english_pob_choice: struck him down
  chosen_korean: 그를 쳤습니다
  alternatives_korean:
  - 그를 쳐 죽였습니다
  - 그를 죽였습니다
  lexicon: HALOT
  rationale: נכה의 기본 이미지는 ‘치다/때리다’이므로, 죽음의 결과를 지나치게 풀어 쓰기보다 원문의 동작성을 살렸습니다.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  english_pob_choice: which belonged to the Philistines
  chosen_korean: 블레셋 사람들에게 속한 곳
  alternatives_korean:
  - 블레셋 사람들의 것이었던 곳
  - 블레셋 사람들이 점거하던 곳
  lexicon: HALOT
  rationale: לְ/לַ는 소유·지배를 나타내므로, ‘속한 곳’으로 번역해 도시의 소속과 점유 상태를 함께 드러냈습니다.
- source_word: צָרִים עַל גִּבְּתֹן
  english_pob_choice: were besieging Gibbethon
  chosen_korean: 기브던을 포위하고 있었습니다
  alternatives_korean:
  - 기브던을 포위 중이었습니다
  - 기브던을 에워싸고 있었습니다
  lexicon: HALOT
  rationale: צור עַל은 군사적으로 포위하다/포위 공격하다의 뜻이므로, 진행 중인 상황을 자연스럽게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: '바아사의 행동 묘사: ‘conspired against him’의 한국어 강도'
  chosen_reading: 정치적 반역을 드러내는 ‘반역하여’로 번역했습니다.
  alternative_readings:
  - 그를 모의하여
  - 그를 상대로 음모를 꾸며
  rationale: 본문은 단순한 사적 음모가 아니라 왕을 겨냥한 정변의 맥락이므로, 서술의 정치성을 유지하는 표현이 가장 적절합니다.
  doctrine_reference: 서사 본문의 역사적-정치적 의미 보존
- issue: וַיַּכֵּהוּ의 결과(죽임) 명시 여부
  chosen_reading: ‘그를 쳤습니다’로 두어 살해 결과는 문맥이 드러내도록 했습니다.
  alternative_readings:
  - 그를 쳐 죽였습니다
  - 그를 죽였습니다
  rationale: 원문은 동사를 ‘치다’로 두고 있으며, POB의 주석처럼 결과상 살해를 뜻하지만 동작 이미지를 보존하는 편이 원문 밀착에 더 충실합니다.
  doctrine_reference: 서사적 디테일 보존
