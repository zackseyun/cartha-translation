revisions:
- from: 그때 바아사, 아히야의 아들이며 잇사갈 집안 출신인 사람이 그를 반역하여 기브던에서 그를 쳤습니다. 그곳은 블레셋 사람들에게 속한 곳이었습니다[c][b]. 나답과 온 이스라엘은 기브던을 포위하고 있었습니다.
  to: 그때 잇사갈 지파에 속한 아히야의 아들 바아사가 그를 대적하여 음모를 꾸미고[a], 블레셋 사람들에게 속한 깁브돈에서 그를 쳤습니다[b]. 나답과 온 이스라엘이 깁브돈을 포위하고 있을 때였습니다[c].
  rationale: ‘음모를 꾸미고’로 קשר על의 정치적 공모 의미를 자연스럽고 정확하게 옮겼습니다. ‘잇사갈 지파에 속한’은 לְבֵית יִשָּׂשכָר의 계보·집단 소속을 한국어 관용에 맞게 표현합니다. 깁브돈이 블레셋 사람들에게 속했다는 관계를 본문에 보존했고, 나답과 온 이스라엘의 포위는 사건의 동시적 배경이므로 시간절로 명시했습니다. 기존 주석 c의 ‘블레셋 사람들의 지배 아래’는 본문에 이미 반영된 소유/소속 표현의 대안으로는 적절하지만, 포위의 상황절을 설명하는 주석으로 대체하여 앵커와 내용의 대응을 명확히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:50:48Z'
