    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּמוֹת
  english_pob_choice: the high places
  chosen_korean: 산당
  alternatives_korean:
  - 높은 곳들
  - 산 위의 제단들
  - 고지의 제사처
  lexicon: HALOT
  rationale: בָּמוֹת는 이스라엘의 지역 제의 장소를 가리키는 통상어이므로, 한국어 성경 전통에 널리 알려진 ‘산당’을 쓰되 의미를 과도하게 약화하지 않았습니다.
- source_word: לֹא סָרוּ
  english_pob_choice: were not removed
  chosen_korean: 제거되지 않았습니다
  alternatives_korean:
  - 치워지지 않았습니다
  - 없애지 않았습니다
  - 철거되지 않았습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 이동이 아니라 개혁 조치로서의 철폐가 문제이므로, 수동형으로 ‘제거되지 않았습니다’라고 옮기는 것이 자연스럽습니다.
- source_word: רַק
  english_pob_choice: nevertheless
  chosen_korean: 그럼에도
  alternatives_korean:
  - 다만
  - 오직
  - 그렇지만
  lexicon: HALOT
  rationale: 앞의 부정적 사실과 뒤의 긍정적 평가를 대조하는 접속 기능이므로, 문맥상 양보를 드러내는 ‘그럼에도’가 적절합니다.
- source_word: שָׁלֵם
  english_pob_choice: wholly devoted
  chosen_korean: 온전하였습니다
  alternatives_korean:
  - 완전하였습니다
  - 전적으로 헌신하였습니다
  - 흠잡을 데 없었습니다
  lexicon: HALOT
  rationale: לֵב/לְבַב과 함께 쓰여 언약적 충성의 완전성, 곧 분열되지 않은 마음을 가리키므로 ‘온전하다’가 무결점이 아닌 충성의 충만함을 잘 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: יהוה의 고유명을 직역 관습에 따라 ‘야훼’로 옮겨, 호칭 ‘주님’과 구별되는 하나님의 이름을 보존했습니다.
theological_decisions:
- issue: 아사의 ‘온전한 마음’과 산당 미제거의 긴장
  chosen_reading: 본문은 아사의 전반적 언약 충성을 affirm하지만, 모든 개혁이 완벽했다는 뜻은 아닙니다.
  alternative_readings:
  - 아사가 완전히 무결점이었다
  - 산당이 남았으므로 마음도 온전하지 않았다는 뜻이다
  rationale: 산당이 제거되지 않았다는 사실과 마음이 온전했다는 진술이 나란히 있으므로, 본문이 말하는 것은 죄 없는 완벽함이 아니라 야훼께 대한 분열되지 않은 충성입니다.
  doctrine_reference: 본문의 긴장을 해소하지 말고 유지한다.
