translation:
  language: ko
  text: 바아사가 이 소식을 듣고는 라마를 건축하는 일을 그만두고 디르사에 머물렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  english_pob_choice: And when ... heard of it
  chosen_korean: 이 소식을 듣고는
  alternatives_korean:
  - '...를 듣자'
  - '...을 듣고'
  lexicon: HALOT
  rationale: 히브리어 서술 도입 공식과 시간 절을 자연스러운 한국어로 옮겨, 앞선 정황에서 드러난 내용을 '이 소식'으로 받았습니다.
- source_word: וַיֶּחְדַּל מִבְּנוֹת אֶת הָרָמָה
  english_pob_choice: he stopped building Ramah
  chosen_korean: 라마를 건축하는 일을 그만두고
  alternatives_korean:
  - 라마 건축을 중단하고
  - 라마를 짓는 일을 멈추고
  lexicon: HALOT
  rationale: חדל 뒤의 מִן+동명사적 용법은 '...하는 일을 그만두다/중단하다'로 풀어, 공사 중단이라는 동작을 분명하게 했습니다.
- source_word: וַיֵּשֶׁב בְּתִרְצָה
  english_pob_choice: remained in Tirzah
  chosen_korean: 디르사에 머물렀습니다
  alternatives_korean:
  - 디르사에 살았습니다
  - 디르사에 있었습니다
  lexicon: HALOT
  rationale: ישׁב는 이 문맥에서 단순 거주보다 '머물다/체류하다'가 더 정확하여, 공사를 멈춘 뒤의 상태를 간결하게 살렸습니다.
- source_word: בַּעְשָׁא
  english_pob_choice: Baasha
  chosen_korean: 바아사
  alternatives_korean:
  - 바아샤
  lexicon: 표준 음역
  rationale: 고유명사는 한국어 성경에서 통용되는 표기를 따르되, 음가에 맞춰 '바아사'로 옮겼습니다.
