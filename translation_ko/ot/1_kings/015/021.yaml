  terminology: 바아사, 라마, 디르사는 한국어 성경에서 널리 쓰이는 고유명사 표기와 부합합니다. “머물렀습니다”는 יָשַׁב의 문맥적 ‘머무르다/체류하다’ 의미를 적절히 살립니다.
