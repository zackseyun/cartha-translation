  source_fidelity: 원문의 וַיְמִתֵהוּ(히필)는 ‘그를 죽게 하다/처형하다’라는 사역형이며, 본문의 ‘그를 죽이고’는 사건의 의미를 충실하게 전달합니다. בִּשְׁנַת שָׁלֹשׁ와 לְאָסָא מֶלֶךְ יְהוּדָה도 ‘유다 왕 아사의 셋째 해에’로 정확히 옮겼습니다. תַּחְתָּיו의 왕위 계승 의미는 ‘그의 뒤를 이어’로 더 분명하고 자연스럽게 표현할 수 있습니다.
  naturalness: ‘그의 자리에 왕이 되었습니다’도 이해되지만, 현대 한국어의 왕위 계승 서술에서는 ‘그의 뒤를 이어 왕이 되었습니다’가 더 관용적이고 명료합니다. 또한 각주 표지는 해당 히브리어 동사를 번역한 ‘죽이고’ 바로 뒤에 두는 편이 각주의 범위를 정확히 드러냅니다.
  terminology: ‘바아사’, ‘유다 왕 아사’, ‘셋째 해’는 통용성과 문체 면에서 적절합니다. ‘왕이 되었습니다’는 וַיִּמְלֹךְ의 즉위·통치 개시 의미를 무리 없이 반영합니다.
  issues:
