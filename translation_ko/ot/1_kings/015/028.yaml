translation:
  language: ko
  text: 바아사가 유다 왕 아사의 셋째 해에 그를 죽이고, 그의 자리에 왕이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 사역형으로, 더 문자적으로는 ‘죽게 하다/죽게 만들다’라는 뜻입니다.
    reason: lexical_alternative
