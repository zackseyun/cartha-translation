  lexicon: HALOT
  rationale: 왕정 연대기 공식에서 ב의 시간 표지를 한국어의 ‘~에’로 자연스럽게 살렸습니다.
- source_word: תַּחְתָּיו
  english_pob_choice: in his place
  chosen_korean: 그의 자리에
  alternatives_korean:
  - 그를 대신하여
  - 그 대신에
