translation:
  language: ko
  text: 바아사가 유다 왕 아사의 셋째 해에 그를 죽이고[a] 그의 뒤를 이어 왕이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 사역형으로, 더 문자적으로는 ‘죽게 하다’ 또는 ‘죽게 만들다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמִתֵהוּ
  english_pob_choice: put him to death
  chosen_korean: 그를 죽이고
  alternatives_korean:
  - 그를 살해하고
  - 그를 죽게 하고
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 한국어로 자연스럽게 살리되, 연대기 서술의 간결함을 유지하기 위해 ‘죽이다’로 옮겼습니다.
- source_word: בַעְשָׁא
