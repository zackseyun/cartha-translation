  text: Baasha put him to death in the third year of Asa king of Judah[a], and reigned in his place.
  footnotes:
  - marker: a
    text: Or 'killed him.' The Hebrew verb is causative ('caused him to die'), which can be rendered more literally as 'put him to death.'
