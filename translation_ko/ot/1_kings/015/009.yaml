translation:
  language: ko
  text: 이스라엘 왕 여로보암의 제20년에 유다 왕 아사가 왕이 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בִ/שְׁנַ֣ת עֶשְׂרִ֔ים
  english_pob_choice: In the twentieth year
  chosen_korean: 스무째 해에
  alternatives_korean:
  - 제20년에
  - 스무 해에
  lexicon: HALOT
  rationale: 왕위 연대기 공식에서 ‘twentieth year’는 한국어에서 ‘스무째 해’가 가장 자연스럽고 간결합니다.
- source_word: לְ/יָרָבְעָ֖ם מֶ֣לֶךְ יִשְׂרָאֵ֑ל
  english_pob_choice: of Jeroboam king of Israel
  chosen_korean: 이스라엘 왕 여로보암의
  alternatives_korean:
  - 이스라엘 왕 여로보암의 때에
  - 이스라엘 왕 여로보암에 대한
  lexicon: HALOT
  rationale: ל는 연대 계산의 기준점을 나타내므로 ‘~의’로 처리해 연대기적 기준을 살렸습니다.
- source_word: מָלַ֥ךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 다스리기 시작했습니다
  - 즉위했습니다
  - 통치하기 시작했습니다
  lexicon: HALOT
  rationale: 여기서는 통치 기간 전체보다 즉위 사건을 가리키므로, 현대 한국어에서 자연스러운 ‘왕이 되었습니다’로 옮겼습니다.
- source_word: מֶ֥לֶךְ יְהוּדָֽה
  english_pob_choice: king over Judah
  chosen_korean: 유다 왕
  alternatives_korean:
  - 유다의 왕
  - 유다를 다스리는 왕
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘유다의 왕’이지만, 한국어 왕호에서는 ‘유다 왕’이 가장 간결하고 관용적입니다.
