base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/008.yaml
  text: And Abijam lay down with his fathers[a], and they buried him in the city of David[b]. Then Asa his son became king in his place.
  footnotes:
  - marker: a
    text: Hebrew 'lay down with his fathers,' a customary expression for death and burial among one's forefathers.
    reason: cultural_note
  - marker: b
    text: Abijam is called Abijah in some parallel or related passages; here the Hebrew text reads 'Abijam.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아비얌[b]은 그의 조상들과 함께 잠들었고[a], 사람들이 그를 다윗 성에 장사하였습니다. 그의 아들 아사가 그 뒤를 이어 왕이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘그의 조상들과 함께 잠들었다’는 죽음을 가리키는 관용적 표현입니다.
    reason: cultural_note
  - marker: b
    text: 이 구절의 히브리어 본문에는 ‘아비얌’이라는 형태가 나오며, 일부 평행 구절이나 관련 구절에는 ‘아비야’라는 형태가 나옵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: lay down
  chosen_korean: 누웠고
  alternatives_korean:
  - 잠들었고
  - 죽었고
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 죽음을 완곡하게 드러내면서도, 단순히 ‘죽었다’로 평평하게 만들지 않기 위해 ‘누웠고’를 택했습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 왕조적 매장 공식을 한국어로 자연스럽게 옮기되, 문자적 친족성보다 세대적·왕조적 뉘앙스를 살렸습니다.
- source_word: וַיִּקְבְּרוּ אֹתוֹ בְּעִיר דָּוִד
  english_pob_choice: and they buried him in the city of David
  chosen_korean: 사람들이 그를 다윗 성에 장사하였습니다
  alternatives_korean:
  - 그를 다윗 성에 묻었습니다
  - 그를 다윗 성에 매장하였습니다
  lexicon: HALOT
  rationale: 수동형보다 히브리어의 능동 복수형을 살리면서, ‘장사하다’로 장례·매장 공식을 비교적 격식 있게 표현했습니다.
- source_word: וַיִּמְלֹךְ אָסָא בְנוֹ תַּחְתָּיו
  english_pob_choice: Then Asa his son became king in his place
  chosen_korean: 그의 아들 아사가 그의 뒤를 이어 왕이 되었습니다
  alternatives_korean:
  - 그의 아들 아사가 그를 대신하여 왕이 되었습니다
  - 그의 아들 아사가 그의 자리에 왕이 되었습니다
  lexicon: HALOT
  rationale: 즉위의 시작을 나타내는 동사를 ‘왕이 되었습니다’로 옮기고, תַּחַת의 계승 의미는 ‘그의 뒤를 이어’로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 왕위 계승 공식을 한국어로 어떻게 드러낼지
  chosen_reading: ‘그의 뒤를 이어 왕이 되었습니다’로 번역해 단순한 시간적 ‘뒤’가 아니라 직위 승계를 분명히 했습니다.
  alternative_readings:
  - ‘그의 뒤에 왕이 되었습니다’
  - ‘그의 자리를 이어 왕이 되었습니다’
  rationale: 본문은 단순 연속이 아니라 왕권의 교체를 말하므로, 계승·대체의 의미를 분명히 해야 합니다.
  doctrine_reference: 문맥상 역사 서술; 특별한 교리 쟁점 없음
