    text: 히브리어의 ‘딸’은 족보 문맥에서 더 넓게는 여성 후손을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 아비살롬은 히브리어 이름형이며, 많은 번역본은 ‘압살롬’으로 옮깁니다.
