  text: וַ/יֵּ֕לֶךְ בְּ/כָל חַטֹּ֥אות אָבִ֖י/ו אֲשֶׁר עָשָׂ֣ה לְ/פָנָ֑י/ו וְ/לֹא הָיָ֨ה לְבָב֤/וֹ שָׁלֵם֙ עִם יְהוָ֣ה אֱלֹהָ֔י/ו כִּ/לְבַ֖ב דָּוִ֥ד אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/003.yaml
  text: He walked in all the sins of his father that he had committed before him[a], and his heart was not wholly devoted to Yahweh his God[c][b], like the heart of David his father.
  footnotes:
  - marker: a
    text: Hebrew 'before him' may mean either 'in his presence' or 'previously/before his time'; the wording may suggest that his father's sins stood before him as an example he followed.
    reason: lexical_alternative
  - marker: b
    text: Or 'his heart was not fully loyal to the LORD his God.'
    reason: alternative_reading
  - marker: c
    text: Hebrew YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 그의 아버지가 그보다 앞서 저지른 모든 죄를 따라 살았으며, 그의 마음은 그의 하나님 야훼께 온전히 충성하지 않았습니다. 그의 조상 다윗의 마음과 같지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그의 앞에서’는 ‘그보다 앞서’라는 시간적 뜻 또는 ‘그가 보는 앞에서’라는 공간적 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 마음은 그의 하나님 야훼와 온전하지 않았습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: He walked
  chosen_korean: 걸어갔고
  alternatives_korean:
  - 행했습니다
  - 살았습니다
  lexicon: HALOT
  rationale: הלך의 윤리적 행실 표현을 살리기 위해 단순한 ‘행하다’보다 ‘걸어가다’ 계열을 택했습니다. 한국어에서는 이어지는 죄의 길을 나타내도록 ‘걸어갔고’가 가장 자연스럽습니다.
- source_word: בְּכָל חַטֹּאות
  english_pob_choice: in all the sins
  chosen_korean: 모든 죄 가운데로
  alternatives_korean:
  - 모든 죄 안에서
  - 모든 죄의 길로
  lexicon: HALOT
  rationale: הלך + בְּ의 관용적 의미를 따라 삶의 방향을 나타내되, ‘죄 가운데로’로 원문의 도덕적 범주를 유지했습니다.
- source_word: לְפָנָיו
  english_pob_choice: before him
  chosen_korean: 자기 앞에서
  alternatives_korean:
  - 그의 앞에
  - 그보다 전에
  lexicon: HALOT
  rationale: ‘before him’의 공간적/시간적 중의를 살리기 위해 ‘자기 앞에서’로 옮겨, 그의 아버지의 죄가 본보기처럼 놓여 있었음을 암시할 수 있게 했습니다.
- source_word: שָׁלֵם
  english_pob_choice: wholly devoted
  chosen_korean: 온전히 헌신되어 있지 않았습니다
  alternatives_korean:
  - 온전하지 않았습니다
  - 완전히 충성하지 않았습니다
  - 전적으로 헌신되어 있지 않았습니다
  lexicon: HALOT
  rationale: ‘마음’과 결합한 שָׁלֵם은 무결점이 아니라 분열되지 않은 언약적 충성을 뜻하므로, ‘온전히 헌신되다’로 그 의미를 드러냈습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 야훼의 계약명 יְהוָה가 직접 나오므로, 프로젝트 기본값에 따라 고유명 ‘야훼’를 유지했습니다. 이는 호칭 ‘주’로 흡수해 버리기보다 원문 구별을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: שָׁלֵם with heart의 신학적 의미
  chosen_reading: 분열 없는 언약적 충성의 결핍을 평가하는 표현으로 이해했습니다.
  alternative_readings:
  - 도덕적 완전무결의 부재
  - 단순한 내면의 성실성 부족
  rationale: 이 구절은 다윗과의 비교를 통해 왕의 하나님께 대한 충성 여부를 평가하므로, 죄 없는 완전성으로 오해되지 않도록 ‘온전히 헌신’의 부정형으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
