revisions:
- from: 그는 아버지가 자기 앞에서 행한 모든 죄 가운데로 걸어갔고, 그의 마음은 자기 아버지 다윗의 마음과 같이 야훼 그의 하나님께 온전히 헌신되어 있지 않았습니다.[a][b]
  to: 그는 그의 아버지가 그보다 앞서 저지른 모든 죄를 따라 살았으며, 그의 마음은 그의 하나님 야훼께 온전히 충성하지 않았습니다. 그의 조상 다윗의 마음과 같지 않았습니다.[a][b]
  rationale: 본문은 아버지의 죄를 본받아 살았다는 הלך בְּ의 윤리적 의미를 자연스러운 한국어로 옮겼습니다. לְפָנָיו의 가능한 중의성은 본문에서 가장 자연스러운 시간적 독해를 사용하되 각주에 보존했습니다. 다윗은 직계 부친이 아니라 왕조의 조상이므로 ‘그의 조상’으로 수정했습니다. ‘마음이 온전하다’는 표현은 야훼께 대한 전적인 충성을 뜻하므로 이를 명료하고 비교적 직역적인 한국어로 표현했습니다.
