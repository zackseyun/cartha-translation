  text: וַ/יַּ֧עַשׂ אָסָ֛א הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/דָוִ֖ד אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/011.yaml
  text: Asa did what was right in the eyes of Yahweh[a], as David his father had done.
  footnotes:
  - marker: a
    text: Or 'as David his ancestor'; 'father' here reflects dynastic ancestry rather than immediate parentage.
    reason: lexical_alternative
translation:
  language: ko
  text: 아사는 야훼[a]의 눈에 옳은 일을 행하였는데, 그의 아버지 다윗이 행한 것과 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘야훼’는 히브리어 יְהוָה를 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 행하였습니다 / 행하였는데
  alternatives_korean:
  - 하였습니다
  - 했습니다
  lexicon: HALOT
  rationale: 평가적 왕정 서술에서 עשה는 단순한 ‘하다’보다 ‘행하다’가 문맥에 더 잘 맞으며, 서술 흐름을 살려 종결형보다 연결형으로 제시했습니다.
- source_word: הַיָּשָׁר
  english_pob_choice: what was right
  chosen_korean: 옳은 일
  alternatives_korean:
  - 바른 일
  - 올바른 일
  - 의로운 일
  lexicon: HALOT
  rationale: יָשָׁר는 ‘곧은, 바른, 옳은’의 뜻이므로, 평가 관용구 ‘옳은 일’을 사용해 도덕적 판단을 자연스럽게 옮겼습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼의 눈에
  alternatives_korean:
  - 야훼 보시기에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 평가 주체가 야훼이심을 드러냈고, ‘보시기에’도 가능하지만 본문 이미지인 ‘눈에’를 유지했습니다.
- source_word: כְּדָוִד אָבִיו
  english_pob_choice: as David his father had done
  chosen_korean: 그의 아버지 다윗이 행한 것과 같았습니다
  alternatives_korean:
  - 그의 조상 다윗처럼
  - 그의 조상 다윗이 한 것과 같았습니다
  lexicon: HALOT
  rationale: אָבִיו는 직계 부친이 아니라 왕조적 선조를 가리킬 수 있어, 본문에는 ‘아버지’를 유지하되 한국어에서 오해를 줄이도록 ‘다윗’의 선행 위치를 살렸습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문은 신명기적 왕정 평가의 표준 형식에서 하나님의 고유명사를 직접 사용하므로, POB 기준에 따라 ‘야훼’로 옮겨 언약적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘아버지’의 문맥
  chosen_reading: 다윗을 왕조적 선조로 이해하되 본문 표현은 유지
  alternative_readings:
  - 다윗 그의 조상
  - 다윗 그의 선조
  rationale: 히브리어 אָב은 직계 부친뿐 아니라 조상을 뜻할 수 있습니다. 본문 표현을 그대로 살리되, 한국어 오해 가능성은 번역 구조로 완화했습니다.
  doctrine_reference: 'Translation philosophy #5 (consistency of key terms, or documented exception)'
