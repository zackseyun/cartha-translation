  text: וְ/נָדָ֣ב בֶּן יָרָבְעָ֗ם מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/025.yaml
  text: Now Nadab son of Jeroboam became king over Israel in the second year of Asa king of Judah, and he reigned over Israel two years.
translation:
  language: ko
  text: 이제 나답, 여로보암의 아들이, 유다 왕 아사 제 이년에 이스라엘의 왕이 되었고, 이스라엘을 두 해 동안 다스렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 즉위했습니다
  - 왕이 되었습니다
  lexicon: HALOT
  rationale: 첫 번째 מָלַךְ는 통치 기간보다 즉위를 가리키므로, 한국어도 '다스렸습니다'와 구별되는 즉위 표현으로 옮겼습니다.
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  english_pob_choice: in the second year
  chosen_korean: 제 이년에
  alternatives_korean:
  - 둘째 해에
  - 두 해째에
  lexicon: HALOT
  rationale: 왕들의 연대기 공식에서 '둘째 해'의 의미를 자연스럽게 드러내면서도, 원문의 연대 기준 표현을 유지했습니다.
- source_word: עַל יִשְׂרָאֵל
  english_pob_choice: over Israel
  chosen_korean: 이스라엘의 왕이 되었습니다 / 이스라엘을 다스렸습니다
  alternatives_korean:
  - 이스라엘 위에
  - 이스라엘을 통치했습니다
  lexicon: HALOT
  rationale: 히브리어의 통치 관용구를 한국어에서 '왕이 되다', '다스리다'로 나누어 옮겨, 즉위와 재위 기간을 구분했습니다.
- source_word: שְׁנָתָיִם
  english_pob_choice: two years
  chosen_korean: 두 해 동안
  alternatives_korean:
  - 이 년 동안
  - 두 해
  lexicon: HALOT
  rationale: משך 기간을 자연스럽게 살리되, 왕정 연대기 문맥에 맞는 '두 해 동안'으로 옮겼습니다.
