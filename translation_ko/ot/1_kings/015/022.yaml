  edition: WLC
  text: וְ/הַ/מֶּ֨לֶךְ אָסָ֜א הִשְׁמִ֤יעַ אֶת כָּל יְהוּדָה֙ אֵ֣ין נָקִ֔י וַ/יִּשְׂא֞וּ אֶת אַבְנֵ֤י הָֽ/רָמָה֙ וְ/אֶת עֵצֶ֔י/הָ אֲשֶׁ֥ר בָּנָ֖ה בַּעְשָׁ֑א וַ/יִּ֤בֶן בָּ/ם֙ הַ/מֶּ֣לֶךְ אָסָ֔א אֶת גֶּ֥בַע בִּנְיָמִ֖ן וְ/אֶת הַ/מִּצְפָּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/022.yaml
  text: Then King Asa summoned all Judah—no one was exempt—and they carried away the stones of Ramah and its timber[a], with which Baasha had built[c][b], and King Asa built with them Geba of Benjamin and Mizpah.
  footnotes:
  - marker: a
    text: Or 'proclaimed to all Judah.' The Hebrew verb literally means 'caused to hear.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''there is no exempt one,'' meaning that no person was excused from the labor.'
    reason: lexical_alternative
  - marker: c
    text: The clause 'with which Baasha had built' refers to the stones and timber as the materials Baasha used in fortifying Ramah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아사 왕은 온 유다에 선포하여, 아무도 면제되지 않게 했습니다. 그들은 라마의 돌과 바아사가 쌓은 그 나무를[a] 가져다가, 아사 왕이 그것으로 베냐민의 게바와 미스바를 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 나무들’이지만, 여기서는 라마를 쌓는 데 쓰인 건축 목재를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁמִיעַ
  english_pob_choice: summoned
  chosen_korean: 선포하여
  alternatives_korean:
  - 소집하여
  - 불러 모아
  - 알리어
  lexicon: HALOT
  rationale: 히필형 שׁמע는 단순한 ‘듣게 하다’보다 공식적으로 알리거나 부르는 행위를 가리키므로, 문맥상 ‘온 유다에 선포하여’가 가장 자연스럽고 원문의 공적 동원을 잘 살립니다.
- source_word: אֵין נָקִי
  english_pob_choice: no one was exempt
  chosen_korean: 아무도 면제되지 않게
  alternatives_korean:
  - 면제된 자가 없게
  - 아무도 빠지지 않게
  - 면제받은 사람이 없게
  lexicon: HALOT
  rationale: נָקִי는 여기서 도덕적 ‘무죄’가 아니라 동원에서의 ‘면제/예외 없음’을 뜻하므로, 행정적·실무적 의미가 드러나는 표현으로 옮겼습니다.
- source_word: עֵצֶיהָ
  english_pob_choice: its timber
  chosen_korean: 그 나무
  alternatives_korean:
  - 그 목재
  - 그 목재들
  - 그 목재와 나무
  lexicon: HALOT
  rationale: 문맥상 건축 재료를 가리키지만, 한국어에서는 ‘목재’보다 ‘나무’가 더 직접적으로 원문의 재료 이미지를 살리며, 뒤의 ‘그것으로’와 함께 재사용된 자재임을 자연스럽게 보여 줍니다.
- source_word: וַיִּבֶן בָּם
  english_pob_choice: built with them
  chosen_korean: 그것으로 …를 세웠습니다
  alternatives_korean:
  - 그것들로 …를 지었습니다
  - 그것들을 사용하여 …를 세웠습니다
  - 그것으로 …를 건축했습니다
  lexicon: HALOT
  rationale: בָּם은 앞의 돌과 나무를 가리키는 도구/재료 관계이므로, 한국어에서는 ‘그것으로’로 묶어 자재를 재사용해 축성했음을 분명히 했습니다.
theological_decisions:
- issue: 재사용된 성읍 축성 자재의 전달 방식
  chosen_reading: 바아사가 라마를 쌓을 때 사용한 돌과 나무를 그대로 거두어, 아사가 그 재료로 게바와 미스바를 세운 것으로 읽었습니다.
  alternative_readings:
  - ‘그가 라마를 건축한 돌과 나무’처럼 단순 서술
  - ‘그 재료들로 다시 지었다’는 일반화된 표현
  rationale: 본문의 문법은 라마 축성에 쓰인 재료를 회수해 다른 성읍에 재투입하는 장면을 보여 주므로, 전리품적 재사용의 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: 열왕기상 15:22의 역사 서술
