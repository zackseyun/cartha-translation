translation:
  language: ko
  text: 아사와 이스라엘 왕 바아사 사이에는 그들 평생 내내 전쟁이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘그들의 모든 날’입니다.
    reason: source_note
lexical_decisions:
- source_word: וּמִלְחָמָה
  english_pob_choice: And there was war
  chosen_korean: 전쟁이 있었습니다
  alternatives_korean:
  - 전쟁이 있었습니다
  - 전투가 있었습니다
  - 전쟁이 계속되었습니다
  lexicon: HALOT
  rationale: מִלְחָמָה는 ‘전쟁, 싸움, 전투’의 뜻이며, 여기서는 존재를 나타내는 절이므로 한국어도 자연스럽게 ‘전쟁이 있었습니다’로 옮기는 것이 가장 직접적입니다.
- source_word: בֵּין ... וּבֵין
  english_pob_choice: between ... and
  chosen_korean: 사이에는
  alternatives_korean:
  - 사이에서
  - 사이에는
  - 사이에
  lexicon: HALOT
  rationale: 두 대상 사이의 상호 대립을 나타내는 בין ... ובין 구조를 한국어의 ‘사이에는’으로 간결하게 살렸습니다.
- source_word: כָּל יְמֵיהֶם
  english_pob_choice: all their days
  chosen_korean: 그들 평생 내내
  alternatives_korean:
  - 그들의 모든 날 동안
  - 그들 평생 동안
  - 그들이 사는 모든 날 동안
  lexicon: HALOT
  rationale: 히브리어 관용구를 너무 직역해 어색해지지 않도록 하면서도, 의미 범위를 벗어나지 않게 시간의 지속성을 살렸습니다.
- source_word: אָסָא / בַּעְשָׁא
  english_pob_choice: Asa / Baasha
  chosen_korean: 아사 / 바아사
  alternatives_korean:
  - 아사 / 바샤
  - 아사 / 바아샤
  lexicon: transliteration
  rationale: 인명은 현대 외래어 표기 관행에 따라 음역했고, 국내 성경에서 널리 익숙한 ‘아사’를 유지했습니다.
theological_decisions:
- issue: כָּל יְמֵיהֶם의 시간 범위
  chosen_reading: 두 왕의 생애/재위 동안 계속된 상태로 읽었습니다.
  alternative_readings:
  - 그들의 재위 기간 내내
  - 그들의 평생 동안
  rationale: 문맥상 양측의 대립이 지속되었다는 뜻이므로, 기간을 과도하게 좁히지 않고 원문의 관용 표현을 한국어로 자연스럽게 전달했습니다.
  doctrine_reference: 문맥 기반 역사 서술
