  text: He did what was evil in the sight of Yahweh and walked in the way of his father and in his sin with which he caused Israel to sin.
translation:
  language: ko
  text: 그는 야훼 보시기에 악을 행하고, 그의 아버지의 길을 걸었으며 그의 아버지가 이스라엘을 죄짓게 한 그 죄를 따랐습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  english_pob_choice: He did what was evil
  chosen_korean: 악을 행하고
  alternatives_korean:
  - 악한 일을 하고
  - 악을 저지르고
  lexicon: HALOT
  rationale: 열왕기의 왕 평가 공식에서 עשה + הרע는 단순히 ‘악을 행하다’로 옮기는 것이 가장 자연스럽고 관용적입니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the sight of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈앞에서
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 히브리어의 평가 관용구를 살리기 위해 ‘보시기에’로 옮겼고, יְהוָה는 본 프로젝트 기준에 따라 야훼로 옮겼습니다.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ אָבִיו
  english_pob_choice: walked in the way of his father
  chosen_korean: 자기 아버지의 길과 … 따라 걸었습니다
  alternatives_korean:
  - 자기 아버지의 길을 걸었습니다
  - 아버지의 행실을 따랐습니다
  lexicon: HALOT
  rationale: ‘걷다’의 비유를 유지해 행위의 지속성과 삶의 방식을 드러냈습니다.
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  english_pob_choice: and in his sin with which he caused Israel to sin
  chosen_korean: 그가 이스라엘을 죄짓게 한 자기의 죄
  alternatives_korean:
  - 이스라엘을 죄짓게 한 그의 죄
  - 이스라엘에게 죄를 짓게 한 자기 죄
  lexicon: HALOT
  rationale: חטא의 히필 인과 의미를 반영해 ‘죄짓게 하다’로 옮기고, 관계절의 원인·수단 관계를 자연스러운 한국어로 정리했습니다.
theological_decisions:
