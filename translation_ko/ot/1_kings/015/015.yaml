  - marker: a
    text: Or 'the things his father had dedicated, and the things he himself had dedicated.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 야훼의 집에 자기 아버지의 거룩한 것들과 자기의 거룩한 것들, 곧 은과 금과 기물들을 가져왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아버지가 봉헌한 것들과 그가 자신이 봉헌한 것들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  english_pob_choice: he brought
  chosen_korean: 가져왔습니다
  alternatives_korean:
  - 들여왔습니다
  - 가져다가 두었습니다
  lexicon: HALOT
  rationale: 히필형 בוא는 ‘데려오다/가져오다’의 뜻이 자연하며, 문맥상 목적지로의 이동을 간명하게 드러내기 위해 ‘가져왔습니다’로 옮겼습니다.
- source_word: קָדְשֵׁי אָבִיו / וְקָדְשׁוֹ
  english_pob_choice: the holy things of his father and his own holy things
  chosen_korean: 자기 아버지의 거룩한 것들과 자기의 거룩한 것들
  alternatives_korean:
  - 아버지가 봉헌한 것들과 자신이 봉헌한 것들
  - 아버지의 성물들과 자기의 성물들
  lexicon: HALOT
  rationale: קדשׁ는 여기서 추상적 ‘거룩함’보다 성별하여 바친 물품을 가리키므로, POB의 투명성을 살려 ‘거룩한 것들’로 옮기고, ‘자기’와 ‘아버지의’의 대구를 보존했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 야훼의 성전
  lexicon: HALOT
  rationale: 프로젝트 기본 용례에 따라 신명은 ‘야훼’로 옮겼고, 히브리어 관용구 ‘house of YHWH’는 ‘집’을 유지해 원문 표현을 보존했습니다.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  english_pob_choice: silver and gold and vessels
  chosen_korean: 은과 금과 기물들
  alternatives_korean:
  - 은과 금과 그릇들
  - 은과 금과 기구들
  lexicon: HALOT
  rationale: כלים는 성전 맥락에서 제기·도구를 넓게 가리킬 수 있으므로, 과도하게 좁히지 않으면서도 현대 한국어에서 자연스러운 ‘기물들’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 본문의 יְהוָה는 한국어 본문에서 ‘야훼’로 표기합니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 프로젝트의 표준에 따라 신명은 번역어로 가리지 않고 고유명사적 호칭을 드러내는 ‘야훼’를 사용해 원문과의 대응성을 유지합니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
