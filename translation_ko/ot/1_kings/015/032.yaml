  text: וּ/מִלְחָמָ֨ה הָיְתָ֜ה בֵּ֣ין אָסָ֗א וּ/בֵ֛ין בַּעְשָׁ֥א מֶֽלֶךְ יִשְׂרָאֵ֖ל כָּל יְמֵי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/032.yaml
  text: And there was war between Asa and Baasha king of Israel all their days[a].
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'all their lives.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아사와 이스라엘 왕 바아사 사이에는 평생 전쟁이 있었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 모든 날 동안’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִלְחָמָה
  english_pob_choice: And there was war
  chosen_korean: 평생 전쟁이 있었습니다
  alternatives_korean:
  - 전쟁이 있었습니다
  - 그리고 전쟁이 있었습니다
  - 전쟁이 계속되었습니다
  lexicon: HALOT
  rationale: מִלְחָמָה는 기본적으로 전쟁을 뜻하므로 이를 직접 살렸고, 서술 자연성을 위해 ‘있었습니다’로 존재문을 구성했습니다.
- source_word: בֵּין ... וּ/בֵין
  english_pob_choice: between ... and
  chosen_korean: 아사와 ... 바아사 사이에는
  alternatives_korean:
  - 아사와 ... 바아사 사이에서
  - 아사와 ... 바아사 간에
  lexicon: HALOT
  rationale: 히브리어의 상호관계를 한국어 ‘사이에는’으로 자연스럽게 옮겨 긴장 관계를 분명히 했습니다.
- source_word: כָּל יְמֵי/הֶם
  english_pob_choice: all their days
  chosen_korean: 평생
  alternatives_korean:
  - 그들의 모든 날 동안
  - 그들의 삶 내내
  - 평생 동안
  lexicon: HALOT
  rationale: 직역은 ‘모든 날 동안’이지만, 한국어에서는 관용적으로 ‘평생’이 같은 총체적 지속을 가장 자연스럽게 전달합니다. 역주로 직역 가능성을 보존했습니다.
theological_decisions:
- issue: כָּל יְמֵי/הֶם의 관용적 시간 표현
  chosen_reading: ‘평생’으로 옮겨, 단순한 기간 표지가 아니라 인물들의 생애 전반에 걸친 지속된 적대 관계를 드러냈습니다.
  alternative_readings:
  - ‘그들의 모든 날 동안’
  - ‘그들의 삶 내내’
  rationale: 본문은 전쟁의 지속성을 강조하는 서술이므로, 한국어 관용표현을 쓰되 원문 의미 범위를 해치지 않도록 했습니다.
  doctrine_reference: 서술 문맥의 지속성 표현
