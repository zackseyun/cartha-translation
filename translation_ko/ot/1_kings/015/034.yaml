  - 여호와
  rationale: 본문이 여호와/야훼 신명기를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약 სახელ을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
