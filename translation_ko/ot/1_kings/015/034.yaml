base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/034.yaml
  text: He did what was evil in the eyes of Yahweh and walked in the way of Jeroboam and in his sin by which he caused Israel to sin.
translation:
  language: ko
  text: 그는 야훼 보시기에 악을 행하고, 여로보암의 길을 따르며 여로보암이 이스라엘을 죄짓게 한 그의 죄를 따랐습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  english_pob_choice: He did what was evil
  chosen_korean: 악을 행하고
  alternatives_korean:
  - 악한 일을 하고
  - 악을 저지르고
  lexicon: HALOT
  rationale: 히브리어 관용구 עשה הרע는 단순히 ‘나쁜 것’을 만들거나 행한다는 뜻보다 평가적 표현으로서 ‘악을 행하다’가 자연스럽고 간결합니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈앞에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: ‘눈에’라는 관용을 한국어에서는 ‘보시기에’로 옮기면 평가의 관점을 살리면서도 문체가 자연스럽습니다.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  english_pob_choice: and walked in the way of Jeroboam
  chosen_korean: 여로보암의 길을 따랐습니다
  alternatives_korean:
  - 여로보암의 길로 걸어갔습니다
  - 여로보암의 길을 걸었습니다
  lexicon: HALOT
  rationale: ‘walk in the way of’는 단순 이동이 아니라 삶의 행실을 뜻하므로, 한국어에서는 ‘길을 따르다’가 그 비유를 가장 분명하게 살립니다.
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  english_pob_choice: and in his sin by which he caused Israel to sin
  chosen_korean: 그가 이스라엘을 죄짓게 한 그의 죄
  alternatives_korean:
  - 이스라엘을 죄짓게 한 그의 죄
  - 이스라엘을 죄로 이끈 그의 죄
  lexicon: HALOT
  rationale: 히브리어는 ‘그의 죄’와 그 죄의 결과를 연결하는데, ‘죄짓게 한’이 히필의 인과적 힘을 직접 드러내며 문맥상 여로보암의 전형적 죄를 유지합니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
