  lexicon: יהוה + אֱלֹהִים
  rationale: 프로젝트 기본값에 따라 YHWH는 ‘야훼’로, 소유격 관계는 본문 순서를 따라 ‘그의 하나님’으로 유지했습니다.
- source_word: לְהָקִים ... וּלְהַעֲמִיד
