  yaml_path: translation/ot/1_kings/015/004.yaml
  text: Nevertheless[a], for David’s sake Yahweh his God gave him a lamp in Jerusalem, to raise up his son after him and to establish Jerusalem.
  footnotes:
  - marker: a
    text: Or 'a light'; the phrase 'gave him a lamp in Jerusalem' is a metaphor for preserving David’s royal line there.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 다윗을 위하여 야훼, 그의 하나님께서는 그의 뒤를 이어 그의 아들을 세우시고 예루살렘을 굳게 세우시려고, 예루살렘에서 그에게 등불을 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빛’; 여기서 ‘예루살렘에서 그에게 등불을 주셨다’는 표현은 다윗의 왕조를 그곳에 보존하신다는 은유입니다.
    reason: lexical_alternative
lexical_decisions:
