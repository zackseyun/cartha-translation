base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/004.yaml
  text: Nevertheless[a], for David’s sake Yahweh his God gave him a lamp in Jerusalem, to raise up his son after him and to establish Jerusalem.
  footnotes:
  - marker: a
    text: Or 'a light'; the phrase 'gave him a lamp in Jerusalem' is a metaphor for preserving David’s royal line there.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 다윗을 위하여 야훼 그의 하나님께서 예루살렘에 등불을 주셔서, 그의 아들을 그의 뒤에 일으키시고 예루살렘을 견고하게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빛’; 여기서 ‘예루살렘에 등불을 주셨다’는 표현은 다윗의 왕조를 그곳에 보존하신다는 은유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִיר
  english_pob_choice: a lamp
  chosen_korean: 등불
  alternatives_korean:
  - 불빛
  - 횃불
  - 빛
  lexicon: נִיר
  rationale: 영어 POB의 은유를 그대로 살리되, 왕조의 지속을 암시하는 가시적 이미지로 한국어에서는 ‘등불’이 가장 자연스럽고 오해가 적습니다.
- source_word: לְמַעַן דָּוִד
  english_pob_choice: for David’s sake
  chosen_korean: 다윗을 위하여
  alternatives_korean:
  - 다윗 때문에
  - 다윗을 위해서
  lexicon: לְמַעַן
  rationale: 동기의 초점을 보존하면서도 현대 한국어에서 가장 직접적인 목적/배려 표현으로 옮겼습니다.
- source_word: יְהוָה אֱלֹהָיו
  english_pob_choice: Yahweh his God
  chosen_korean: 야훼 그의 하나님
  alternatives_korean:
  - 여호와 그의 하나님
  - 야훼 하나님
  - 그의 하나님 야훼
  lexicon: יהוה + אֱלֹהִים
  rationale: 프로젝트 기본값에 따라 YHWH는 ‘야훼’로, 소유격 관계는 본문 순서를 따라 ‘그의 하나님’으로 유지했습니다.
- source_word: לְהָקִים ... וּלְהַעֲמִיד
  english_pob_choice: to raise up ... and to establish
  chosen_korean: 일으키시고 ... 견고하게 하셨습니다
  alternatives_korean:
  - 세우시고 ... 굳게 하셨습니다
  - 일으켜 세우시고 ... 확립하셨습니다
  lexicon: הקים / עמד
  rationale: 왕위를 ‘일으키다’와 ‘견고하게 하다’의 이중 동사를 살려, 다윗 왕조 보존의 행위를 분명히 드러냈습니다.
theological_decisions:
- issue: ‘등불’ 은유의 의미
  chosen_reading: 예루살렘에 ‘등불’을 주셨다는 표현은 다윗 왕조를 보존하신 하나님의 지속적 섭리를 가리킵니다.
  alternative_readings:
  - 문자적으로 실제 등불을 주신 것으로 읽는 해석
  - 단순히 번영을 뜻하는 일반적 은유로 약화하는 해석
  rationale: 히브리어와 영어 POB의 주석이 모두 왕조 보존의 은유임을 지시하므로, 본문 의미를 유지하면서도 과도한 설명은 본문 밖 주석으로 남기는 편이 적절합니다.
  doctrine_reference: 왕조 언약과 다윗 언약의 지속성
