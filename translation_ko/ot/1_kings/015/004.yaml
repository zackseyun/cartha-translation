  - 일으켜 세우시고 ... 확립하셨습니다
  lexicon: הקים / עמד
  rationale: 왕위를 ‘일으키다’와 ‘견고하게 하다’의 이중 동사를 살려, 다윗 왕조 보존의 행위를 분명히 드러냈습니다.
theological_decisions:
- issue: ‘등불’ 은유의 의미
  chosen_reading: 예루살렘에 ‘등불’을 주셨다는 표현은 다윗 왕조를 보존하신 하나님의 지속적 섭리를 가리킵니다.
  alternative_readings:
  - 문자적으로 실제 등불을 주신 것으로 읽는 해석
  - 단순히 번영을 뜻하는 일반적 은유로 약화하는 해석
  rationale: 히브리어와 영어 POB의 주석이 모두 왕조 보존의 은유임을 지시하므로, 본문 의미를 유지하면서도 과도한 설명은 본문 밖 주석으로 남기는 편이 적절합니다.
  doctrine_reference: 왕조 언약과 다윗 언약의 지속성
