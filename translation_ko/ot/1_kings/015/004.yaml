  source_fidelity: 히브리어의 접속사(문맥상 양보·대조), ‘다윗을 위하여’, 야훼의 이름, ‘등불’ 은유, 왕위 계승과 예루살렘을 세우는 목적을 전반적으로 보존했습니다. 다만 현 초안의 ‘그의 아들을 그의 뒤에 일으키시고’는 히브리어의 계승 의미를 한국어로 자연스럽게 드러내지 못하며, ‘주셔서 … 하셨습니다’는 목적을 나타내는 두 부정사의 관계를 다소 흐립니다.
  naturalness: ‘야훼 그의 하나님께서’는 성경 번역의 문체로 가능하나, 쉼표를 통해 동격 관계를 표시하면 현대 한국어에서 더 명료합니다. ‘그의 뒤를 이어 그의 아들을 세우시고’는 ‘그의 아들을 그의 뒤를 이어 세우시고’보다 자연스럽고, 왕위 계승을 분명히 합니다.
