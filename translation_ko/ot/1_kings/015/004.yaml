  to: 그러나 다윗을 위하여 야훼, 그의 하나님께서는 그의 뒤를 이어 그의 아들을 세우시고 예루살렘을 굳게 세우시려고, 예루살렘에서 그에게 등불을 주셨습니다.[a]
