translation:
  language: ko
  text: '그때 아사는 여호와의 집의 보물 창고와 왕궁[a]의 보물 창고에 남아 있던 은과 금을 모두 가져다가 자기 신하들에게 맡겼습니다. তারপর 왕 아사는 그것들을 다메섹에 살고 있는 아람[b] 왕 벤하닷, 곧 헤시온의 아들 다브림몬의 아들에게 보내고 이렇게 말했습니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘왕의 집’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘아람’을 따릅니다. 전통적으로는 ‘시리아’로도 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: house of Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: HWH (Tetragrammaton)
  rationale: 이 영어 POB는 본문상 יְהוָה를 Yahweh로 처리했으나, 현재 한국어 판형의 공용 신명 표기는 문맥상 ‘여호와’가 가장 직접적으로 대응됩니다. 본문은 야훼/여호와 선택의 신학적 긴장을 내포하므로, 여기서는 한국어 성서 수용성을 고려한 ‘여호와’를 썼습니다.
- source_word: אֹצְרוֹת
  english_pob_choice: treasuries
  chosen_korean: 곳간
  alternatives_korean:
  - 보물 창고
  - 창고
  - 금고
  lexicon: HALOT
  rationale: אֹצְרוֹת는 단순한 저장 공간보다 귀중품을 보관하는 장소를 가리키므로, 현대 한국어에서 자연스럽고 의미를 살리는 ‘곳간’으로 옮겼습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 여호와의 집
  alternatives_korean:
  - 여호와의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: ‘house of Yahweh’의 직역 구조를 유지하면서도 한국어 독자가 즉시 알아볼 수 있는 표현으로 ‘여호와의 집’을 선택했습니다.
- source_word: בֵּית מֶלֶךְ
  english_pob_choice: the king’s house
  chosen_korean: 왕궁
  alternatives_korean:
  - 왕의 집
  - 궁전
  - 왕의 궁정
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘왕의 집’이지만, 문맥상 왕실 재정이 보관된 궁전/궁정 영역이므로 한국어에서는 오해를 줄이는 ‘왕궁’을 택했습니다.
- source_word: בְּיַד עֲבָדָיו
  english_pob_choice: into the hand of his servants
  chosen_korean: 자기 신하들의 손에 맡겼습니다
  alternatives_korean:
  - 그의 종들의 손에 두었습니다
  - 그의 종들에게 넘겼습니다
  lexicon: HALOT
  rationale: ‘손에’라는 히브리 관용을 살리되, 한국어에서는 통치자가 재물을 위임·인계하는 의미가 분명하도록 ‘맡겼습니다’로 풀었습니다. עֲבָדָיו는 이 문맥에서 신분 강조보다 왕의 수행원/신하를 뜻하므로 ‘신하들’이 적절합니다.
- source_word: בֶּן הֲדַד בֶּן טַבְרִמֹּן בֶּן חֶזְיוֹן
  english_pob_choice: Ben-hadad son of Tabrimmon, son of Hezion
  chosen_korean: 벤하닷—다브림몬의 아들이며 헤시온의 손자
  alternatives_korean:
  - 벤하닷, 다브림몬의 아들, 헤시온의 아들
  - 벤하닷 다브림몬의 아들이며 헤시온의 아들
  lexicon: HALOT
  rationale: 계보 관계를 한국어에서 가장 자연스럽게 읽히도록 정리했습니다. 3대 연결을 직역식으로 두기보다 ‘손자’로 환원해 의미를 분명히 했습니다.
theological_decisions:
- issue: יַ/יְהוָה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 절에서는 신명 자체가 직접 문제되지 않고, 본문 이해상 ‘여호와의 집’이라는 전통적 한국어가 가장 안정적으로 작동합니다. 다만 POB의 원칙상 원어 직해와 한국어 수용 사이의 긴장이 있으므로, 후속 절에서 일관성 검토가 필요합니다.
  doctrine_reference: POB contested terms — divine name rendering
- issue: 왕실 공간 표현
  chosen_reading: 왕궁
  alternative_readings:
  - 왕의 집
  - 왕의 궁전
  rationale: ‘왕의 집’은 원문에 가깝지만 현대 한국어에서는 다소 어색할 수 있어, 문맥상 궁정/왕실 재정을 가리키는 뜻을 드러내는 ‘왕궁’으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §2
