  source_fidelity: 본문은 히브리어의 왕 통치 요약 공식, 즉 ‘나답의 나머지 행적과 그가 행한 모든 일’ 및 긍정의 답을 기대하는 반어적 질문을 충실히 반영합니다. 다만 주석이 설명하는 대상은 ‘역대 기록’이므로, 각주 표지는 나답의 이름이 아니라 해당 표현에 붙어야 합니다.
  naturalness: ‘역대 기록에 기록되어’는 의미상 정확하지만 같은 어근의 반복으로 다소 무겁습니다. ‘역대 기록에 쓰여’는 현대 표준어의 격식 있는 성경 문체에서 자연스럽고, כְּתוּבִים(‘쓰여 있다’)에도 가깝습니다.
  terminology: ‘이스라엘 왕들의 역대 기록’은 왕들의 연대기적 기록이라는 מקור 표현을 적절히 보존합니다. 주석에서는 이를 ‘이스라엘 왕조’의 기록이라고 하기보다, 본문의 표현에 맞춰 ‘이스라엘 왕들의’ 기록이라고 해야 합니다. 이는 정경 『역대기』와 동일시되지 않는다는 설명도 더 정확하게 만듭니다.
