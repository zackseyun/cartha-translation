translation:
  language: ko
  text: 나답의 나머지 행적과 그가 행한 모든 일은 이스라엘 왕들의 역대 기록[a]에 쓰여 있지 않습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘역대 기록’은 정경 『역대기』라기보다 이스라엘 왕들의 연대기적 기록을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  english_pob_choice: Now the rest of
  chosen_korean: 나답의 나머지 행적
  alternatives_korean:
  - 그리고 나답의 나머지
  - 나답의 나머지 일들
  lexicon: HALOT
  rationale: 연대기적 결론 공식에서 יֶתֶר는 ‘나머지/남은 것’의 뜻이므로, 한국어에서는 자연스럽게 ‘나머지 행적’으로 옮겨 전환 기능과 역사 서술성을 함께 살렸습니다.
- source_word: דִּבְרֵי
  english_pob_choice: acts
  chosen_korean: 행적
  alternatives_korean:
  - 말들
  - 일들
  - 행동들
  lexicon: HALOT
  rationale: 직역하면 ‘말들/일들’이지만, ‘나답의 … דִּבְרֵי’와 ‘그가 행한 모든 일’의 병렬 구조에서는 왕의 기록된 삶과 행위를 가리키므로 ‘행적’이 가장 적절합니다.
- source_word: הֲלֹא הֵם כְּתוּבִים
  english_pob_choice: are they not written
  chosen_korean: 기록되어 있지 않습니까?
  alternatives_korean:
  - 기록되어 있지 않습니까
  - 기록되어 있지 않나요?
  lexicon: HALOT
  rationale: 히브리어의 반어적 질문을 한국어에서도 반문형으로 살려, 단순 진술이 아니라 독자가 기록의 존재를 당연한 것으로 받아들이게 하는 기능을 유지했습니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  english_pob_choice: Book of the Chronicles
  chosen_korean: 역대 기록
  alternatives_korean:
  - 역대지
  - 연대기 기록
  - 사료집
  lexicon: HALOT
  rationale: 영어 POB의 주석처럼 이는 정경 ‘역대기’가 아니라 왕실 연대기 자료를 가리키므로, 오해를 피하면서도 공식적인 기록체임을 드러내는 ‘역대 기록’을 선택했습니다.
theological_decisions:
- issue: מהות of the source citation in a regnal summary
  chosen_reading: 본문의 질문은 실제 독자를 확인시키는 수사적 질문으로 처리하고, 기록의 권위를 직접적으로 상정하는 문맥을 유지했습니다.
  alternative_readings:
  - 단순 선언문처럼 평서문으로 옮김
  - 더 강한 강조형으로 옮김
  rationale: 열왕기 역대 서술의 공식 문체는 왕의 행적이 외부 기록에 남아 있음을 상기시키는 기능이므로, 한국어에서도 그 수사적 힘을 보존하는 것이 본문의 목적에 부합합니다.
  doctrine_reference: 열왕기상 15장 문맥의 역사 서술/왕조 기록 기능
