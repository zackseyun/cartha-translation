  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲבֵ֥ר הַ/קְּדֵשִׁ֖ים מִן הָ/אָ֑רֶץ וַ/יָּ֨סַר֙ אֶת כָּל הַ/גִּלֻּלִ֔ים אֲשֶׁ֥ר עָשׂ֖וּ אֲבֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/012.yaml
  text: He removed the male cult prostitutes from the land[d][c][b][a], and he took away all the idols that his fathers had made.
  footnotes:
  - marker: a
    text: Or 'drove out.' The verb can denote causing someone to pass from a place, hence removing or expelling them.
    reason: lexical_alternative
  - marker: b
    text: Hebrew קְדֵשִׁים, males associated with illicit cultic sexual practice. Traditional English versions often have 'sodomites,' but that is not the most precise lexical rendering here.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term for 'idols' is contemptuous and may carry the sense of 'detestable idols' or even 'dung-idols.'
    reason: lexical_alternative
  - marker: d
    text: Or 'his ancestors' / 'his forefathers.' Hebrew 'his fathers' is an idiom for earlier generations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 땅에서 남자 성전 창기들을 제거하고, 그의 조상들이 만든 모든 우상들을 치웠습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몰아냈다’입니다. 이 동사는 어떤 사람을 한곳에서 떠나가게 하거나 내쫓는 뜻으로도 쓸 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 קְדֵשִׁים는 불법적인 제의 성행위와 관련된 남성들을 가리킵니다. 전통 번역의 ‘소돔 사람들’은 뜻을 좁히거나 바꿀 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘우상들’에 해당하는 말은 경멸적 뉘앙스가 있어 ‘가증한 우상들’ 혹은 더 강하게는 ‘똥우상들’의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그의 조상들’ / ‘그의 선조들’입니다. 히브리어 ‘그의 아버지들’은 이전 세대를 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֵר / removed
  english_pob_choice: removed
  chosen_korean: 제거하고
  alternatives_korean:
  - 몰아내고
  - 쫓아내고
  - 내쫓고
  lexicon: HALOT
  rationale: 여기서는 사람들을 그 땅에서 없애는 뜻이므로, 현대 한국어에서 가장 자연스럽고 포괄적인 동사인 ‘제거하다’를 택했습니다.
- source_word: הַקְּדֵשִׁים / the male cult prostitutes
  english_pob_choice: the male cult prostitutes
  chosen_korean: 남자 성전 창기들
  alternatives_korean:
  - 남자 신전 창기들
  - 남자 성적 제의 종사자들
  - 남자 제의 창기들
  lexicon: HALOT
  rationale: קְדֵשִׁים는 남성으로서 불법적인 제의 성행위와 관련된 존재를 가리키므로, 의미를 분명히 드러내는 ‘남자 성전 창기들’로 옮겼습니다. 전통적이지만 오해를 부를 수 있는 표현은 피했습니다.
- source_word: כָּל הַגִּלֻּלִים / all the idols
  english_pob_choice: all the idols
  chosen_korean: 모든 우상들
  alternatives_korean:
  - 모든 가증한 우상들
  - 모든 똥우상들
  - 모든 우상
  lexicon: HALOT
  rationale: גִּלֻּלִים의 경멸적 뉘앙스는 있으나, 본문에서는 기본 지시 대상을 드러내는 ‘우상들’을 본문에 두고, 경멸성은 과장하지 않았습니다.
- source_word: אֲבֹתָיו / his fathers
  english_pob_choice: his fathers
  chosen_korean: 그의 조상들이
  alternatives_korean:
  - 그의 아버지들이
  - 그의 선조들이
  - 그의 조상들
  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘his fathers’는 직역하면 ‘아버지들’이지만, 문맥상 이전 세대를 가리키므로 한국어에서는 자연스럽게 ‘조상들’로 옮겼습니다.
theological_decisions:
- issue: קְדֵשִׁים의 사회·종교적 성격
  chosen_reading: 의미를 약화하지 않고, 불법적인 제의 성행위와 연결된 남성들을 가리키는 표현으로 번역했습니다.
  alternative_readings:
  - 단순히 ‘성전 창기들’로만 옮기는 것
  - 전통적 용어인 ‘소돔 사람들’로 옮기는 것
  rationale: 본문의 역사적·어휘적 긴장을 보존해야 하므로, 도덕적 낙인보다 원문의 제의적·성적 맥락을 드러내는 번역이 더 적절합니다.
  doctrine_reference: '번역 원칙: 어휘의 직접성 및 역사적 맥락 보존'
