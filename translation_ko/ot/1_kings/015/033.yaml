source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שָׁלֹ֔שׁ לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ בַּעְשָׁ֨א בֶן אֲחִיָּ֤ה עַל כָּל יִשְׂרָאֵל֙ בְּ/תִרְצָ֔ה עֶשְׂרִ֥ים וְ/אַרְבַּ֖ע שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/033.yaml
  text: In the third year of Asa king of Judah, Baasha son of Ahijah became king over all Israel in Tirzah, and he reigned twenty-four years.
translation:
  language: ko
  text: 유다 왕 아사의 제삼년에 아히야의 아들 바아사가 온 이스라엘의 왕이 되어 디르사에서 스물네 해 동안 다스렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלֹשׁ
  english_pob_choice: In the third year
  chosen_korean: “아사가 … 된 지 삼 년째 되던 해”
  alternatives_korean:
  - “아사의 셋째 해에”
  - “삼 년째에”
  lexicon: HALOT
  rationale: 히브리어 연대기 공식의 시점 표시를 자연스러운 현대 한국어로 옮기되, regnal-year formula임이 드러나도록 했습니다.
- source_word: מָלַךְ
  english_pob_choice: became king
  chosen_korean: “왕이 되어”
  alternatives_korean:
  - “다스리기 시작했습니다”
  - “즉위했습니다”
  lexicon: HALOT
  rationale: 첫 번째 מָלַךְ는 즉위/왕위에 오름을 가리키므로, 뒤의 통치 기간과 구별되게 ‘왕이 되어’로 옮겼습니다.
- source_word: עַל כָּל יִשְׂרָאֵל
  english_pob_choice: over all Israel
  chosen_korean: “온 이스라엘의 왕”
  alternatives_korean:
  - “모든 이스라엘 위에”
  - “온 이스라엘을 다스리는 왕”
  lexicon: HALOT
  rationale: עַל + 왕위 표지는 통치 대상을 나타내므로, 한국어에서는 소유격 구조보다 ‘왕’의 대상 표지가 자연스럽고 의미가 분명합니다.
- source_word: בְּתִרְצָה
  english_pob_choice: in Tirzah
  chosen_korean: “디르사에서”
  alternatives_korean:
  - “디르사 안에서”
  - “디르사에”
  lexicon: HALOT
  rationale: 장소 전치사 ב의 통상적 위치 의미를 살려, 즉위/통치의 장소를 자연스럽게 표시했습니다.
- source_word: עֶשְׂרִים וְאַרְבַּע שָׁנָה
  english_pob_choice: twenty-four years
  chosen_korean: “스물네 해”
  alternatives_korean:
  - “스물네 년”
  - “24년”
  lexicon: HALOT
  rationale: 연대기 문맥에서 ‘years’는 한국어 성경체에서 ‘해’가 자연스럽고, 뒤의 ‘통치했습니다’가 기간 의미를 보완합니다.
