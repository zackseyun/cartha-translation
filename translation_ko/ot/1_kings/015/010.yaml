  text: 그는 예루살렘에서 마흔한 해 동안 통치했습니다. 그의 어머니의 이름은 마아가였는데, 아비살롬의 딸이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름은 아비살롬입니다. 많은 영어 번역은 ‘압살롬’으로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘딸’은 족보 문맥에서 더 넓게는 여성 후손을 가리킬 수도 있습니다.
    reason: alternative_reading
