  source_fidelity: 수정이 필요합니다. 원문의 עַל עָרֵי יִשְׂרָאֵל은 군사 파견의 적대적 목표를 나타내는데, 초안의 ‘이스라엘의 성읍들로 보냈습니다’는 단순한 목적지처럼 읽힙니다. 또한 אָסָא의 칭호 ‘왕’이 빠졌습니다. 마지막 ‘납달리의 온 땅을 쳤습니다’는 반복된 공격 동작을 명시하여 원문의 범위를 잘 반영합니다.
  naturalness: ‘자기에게 속한 군대의 지휘관들’은 이해 가능하지만 현대 한국어로는 ‘자기 휘하의 군대 지휘관들’이 더 자연스럽습니다. ‘온 긴네롯’보다 지역명이라는 성격을 드러내는 ‘긴네롯 전 지역’이 자연스럽습니다. 각주 표지는 해당 표현 바로 뒤에 두는 편이 독자에게 명확합니다.
  terminology: ‘벤하닷’, ‘아사 왕’, ‘이욘’, ‘단’, ‘아벨벳마아가’, ‘긴네롯’, ‘납달리’는 일관된 음역으로 유지합니다. ‘치다’는 נכה의 넓은 군사 의미를 과도하게 특정하지 않고 보존합니다.
