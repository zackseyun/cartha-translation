base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/020.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of the armies that were his against the cities of Israel[a], and he struck Ijon, Dan, Abel-beth-maacah, and all Chinneroth[b], against all the land of Naphtali.
  footnotes:
  - marker: a
    text: Or 'heeded King Asa.' The Hebrew idiom can carry the sense of listening favorably and acting on the request.
    reason: lexical_alternative
  - marker: b
    text: Chinneroth is a place name here, likely referring to a district or region, not the common noun 'harps.'
    reason: cultural_note
translation:
  language: ko
  text: 벤하닷은 아사의 말을 듣고, 자기에게 속한 군대의 지휘관들을 이스라엘의 성읍들로 보냈습니다. 그는 이욘과 단과 아벨벳마아가와 온 긴네롯을 치고, 납달리의 온 땅을 쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말을 듣고’는 히브리어 관용구 שׁמע אֶל의 자연스러운 번역으로, ‘호의적으로 받아들여 그에 따라 행동하다’는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘긴네롯’은 여기서 ‘하프들’이라는 일반명사가 아니라 지명으로 이해하는 것이 적절합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  english_pob_choice: listened to
  chosen_korean: 말을 듣고
  alternatives_korean:
  - 귀를 기울이고
  - 순종하고
  lexicon: HALOT
  rationale: שׁמע אֶל은 단순 청취보다 호의적 수용의 뉘앙스가 있어, 한국어에서는 자연스럽고 과도하지 않은 ‘말을 듣고’로 옮겼습니다.
- source_word: שָׂרֵי הַחֲיָלִים
  english_pob_choice: the commanders of the armies
  chosen_korean: 군대의 지휘관들
  alternatives_korean:
  - 군대의 우두머리들
  - 군대의 장관들
  lexicon: HALOT
  rationale: 군사적 통솔자라는 뜻을 살리되, ‘captains’식의 옛말보다 현대 한국어의 ‘지휘관들’이 구조를 더 분명하게 드러냅니다.
- source_word: כָּל כִּנְרוֹת
  english_pob_choice: all Chinneroth
  chosen_korean: 온 긴네롯
  alternatives_korean:
  - 모든 긴네롯
  - 긴네롯 전 지역
  lexicon: HALOT
  rationale: 여기서는 일반명사보다 지명으로 보는 것이 타당하므로, 음역을 유지하고 ‘온’으로 범위를 살렸습니다.
- source_word: עַל כָּל אֶרֶץ נַפְתָּלִי
  english_pob_choice: against all the land of Naphtali
  chosen_korean: 납달리의 온 땅
  alternatives_korean:
  - 납달리의 온 지역
  - 납달리 땅 전체
  lexicon: HALOT
  rationale: 반복되는 전치사 עַל의 적대 방향성은 앞의 ‘치고’에 이미 반영되므로, 한국어 본문에서는 대상 범위인 ‘납달리의 온 땅’으로 매끄럽게 처리했습니다.
theological_decisions:
- issue: 전투 동사의 방향성과 반복
  chosen_reading: ‘치고 … 납달리의 온 땅’으로 연결해, 도시들에 대한 공격과 땅 전체를 향한 공격을 모두 드러냈습니다.
  alternative_readings:
  - ‘치고 … 납달리의 온 땅을 향하여’
  - ‘치고 … 납달리 온 땅을 쳤습니다’
  rationale: 히브리어는 여러 지점에 대한 공격을 열거한 뒤 마지막에 영역 전체를 덧붙이므로, 한국어도 군사적 맥락을 유지하면서 중복을 과도하게 만들지 않도록 조정했습니다.
  doctrine_reference: source-text fidelity
