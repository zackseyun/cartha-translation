- from: 벤하닷은 아사의 말을 듣고, 자기에게 속한 군대의 지휘관들을 이스라엘의 성읍들로 보냈습니다. 그는 이욘과 단과 아벨벳마아가와 온 긴네롯을 치고, 납달리의 온 땅을 쳤습니다.[a][b]
