source:
  edition: WLC
  text: וְ/יֶ֣תֶר כָּל דִּבְרֵֽי אָ֠סָא וְ/כָל גְּב֨וּרָת֜/וֹ וְ/כָל אֲשֶׁ֣ר עָשָׂ֗ה וְ/הֶֽ/עָרִים֙ אֲשֶׁ֣ר בָּנָ֔ה הֲ/לֹֽא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֣י יְהוּדָ֑ה רַ֚ק לְ/עֵ֣ת זִקְנָת֔/וֹ חָלָ֖ה אֶת רַגְלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/023.yaml
  text: Now the rest of all the acts of Asa[a], and all his might, and all that he did[b], and the cities that he built—are they not written in the Book of the Chronicles of the Kings of Judah? Yet in the time of his old age he became diseased in his feet.
  footnotes:
  - marker: a
    text: Or 'recorded in the book of the annals of the kings of Judah.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he became ill in his feet.' The Hebrew specifies the body part affected without naming the exact disease.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 아사의 남은 행적과 그의 모든 용맹한 일과 그가 행한 모든 것과 그가 세운 성읍들이 유다 왕들의 역대기에 기록되어 있지 않습니까? 다만 그의 노년에는 그의 발에 병이 생겼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다 왕들의 연대기에 기록되어 있지 않습니까.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 발이 병들었습니다.’ 히브리어는 정확한 병명 없이 병이 난 부위를 직접 밝힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר כָּל דִּבְרֵי אָסָא
  english_pob_choice: Now the rest of all the acts of Asa
  chosen_korean: 이제 아사의 남은 행적
  alternatives_korean:
  - 아사의 나머지 모든 행적
  - 아사의 남은 모든 일들
  lexicon: HALOT
  rationale: 연대기식 결말 공식인 וְיֶתֶר을 ‘남은’으로, דִּבְרֵי אָסָא를 왕의 기록에 남은 ‘행적’으로 옮겨 역사적 요약의 성격을 살렸습니다.
- source_word: וְכָל גְּבוּרָתוֹ
  english_pob_choice: and all his might
  chosen_korean: 그의 모든 용맹한 일
  alternatives_korean:
  - 그의 모든 능력
  - 그의 모든 힘
  lexicon: HALOT
  rationale: גְּבוּרָה는 단순한 신체적 힘보다 전투적·영웅적 역량까지 포함하므로, 한국어에서는 추상 명사 ‘힘’보다 결과적으로 드러난 용맹의 성격을 살려 번역했습니다.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  english_pob_choice: written in the Book of the Chronicles of the Kings of Judah
  chosen_korean: 유다 왕들의 역대기에 기록되어 있지 않습니까
  alternatives_korean:
  - 유다 왕들의 연대기에 기록되어 있지 않습니까
  - 유다 왕들의 역대 기록에 적혀 있지 않습니까
  lexicon: HALOT
  rationale: 표제구는 관용적으로 ‘역대기/연대기’로 옮길 수 있어, 문헌 제목의 기능을 살리면서도 자연스러운 한국어 질문형을 유지했습니다.
- source_word: לְעֵת זִקְנָתוֹ חָלָה אֶת רַגְלָיו
  english_pob_choice: Yet in the time of his old age he became diseased in his feet
  chosen_korean: 다만 그의 노년에는 그의 발에 병이 생겼습니다
  alternatives_korean:
  - 그러나 그의 노년에 그의 발이 병들었습니다
  - 다만 늙은 때에 그의 발이 병들었습니다
  lexicon: HALOT
  rationale: 히브리어는 병의 정확한 명칭보다 আক্রান্ত 부위인 ‘발’을 명시하므로, 이를 유지해 ‘발에 병이 생겼습니다’로 직역과 자연스러움 사이를 맞췄습니다.
theological_decisions:
- issue: 왕의 업적 나열 뒤에 붙는 말기 질병 진술의 톤
  chosen_reading: 업적 요약과 말년의 질병을 함께 두어, 본문이 아사의 공적과 쇠약을 병치하는 역사 서술로 읽히게 했습니다.
  alternative_readings:
  - 질병 진술을 완화해 단순히 ‘아팠습니다’로 처리
  - 업적과 무관하게 별도 문장으로 분리
  rationale: 히브리 본문은 왕의 기록과 말년 상태를 대조적으로 묶어 전하므로, 두 요소의 긴장을 유지하는 것이 본문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 사무엘상/열왕기의 왕권 평가 방식; 역사 서술의 병치 구조
