  text: And there was war between Rehoboam and Jeroboam all the days of his life[a].
  footnotes:
  - marker: a
    text: Or, 'all the days of Rehoboam's life.' Some interpreters, in light of the surrounding context and textual discussion, understand the pronoun to refer instead to Abijah (Abijam).
    reason: alternative_reading
translation:
  language: ko
  text: 르호보암과 여로보암 사이에는 그의 생애 동안 내내 전쟁이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘르호보암의 생애 동안 내내’입니다. 일부 해석자들은 주변 문맥과 본문 논의를 고려해, 이 대명사가 오히려 아비야(아비얌)를 가리킨다고 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִלְחָמָה
  english_pob_choice: And there was war
  chosen_korean: 전쟁이 있었습니다
  alternatives_korean:
  - 전쟁이 있었습니다
  - 전쟁 상태가 있었습니다
  lexicon: HALOT
  rationale: מִלְחָמָה는 기본적으로 ‘전쟁’을 뜻하므로, 서술형 존재문으로 자연스럽게 옮겼습니다.
- source_word: בֵין ... וּבֵין
  english_pob_choice: between ... and
  chosen_korean: 르호보암과 여로보암 사이에는
  alternatives_korean:
  - 르호보암과 여로보암 사이에
  - 르호보암과 여로보암 사이에는
  lexicon: HALOT
  rationale: 두 당사자 사이의 대립 관계를 한국어에서는 ‘사이에는’으로 간결하게 드러내는 것이 가장 자연스럽습니다.
- source_word: כָּל יְמֵי חַיָּיו
  english_pob_choice: all the days of his life
  chosen_korean: 그의 생애 동안 내내
  alternatives_korean:
  - 그의 생애 동안
  - 그의 생애 내내
  - 그의 삶의 모든 날 동안
  lexicon: HALOT
  rationale: 히브리어 관용구는 한 사람의 생애 전체를 가리키므로, 형식을 지나치게 직역하기보다 한국어 관용에 맞는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘his’의 지시 대상이 본문에서 분명히 확정되지 않음
  chosen_reading: 주본문은 ‘그의 생애’를 유지하고, 지시 대상은 본문 안에서 특정하지 않았습니다.
  alternative_readings:
  - 르호보암의 생애
  - 아비야의 생애
  rationale: 히브리어는 단수 남성 접미사만 제시하며, POB의 영어 주석처럼 문맥상 지시 대상에 논의가 있으므로 주본문에서 해석을 확정하지 않고 모호성을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
