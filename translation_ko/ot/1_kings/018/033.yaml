lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  english_pob_choice: arranged
  chosen_korean: 배열하고
  alternatives_korean:
  - 정돈하고
  - 차려놓고
  lexicon: HALOT
  rationale: 제의적 준비의 순서를 드러내는 동사로, 단순히 ‘놓다’보다 ‘배열하다’가 원문의 정돈된 준비 동작을 더 잘 살립니다.
- source_word: הָעֵצִים
  english_pob_choice: the wood
  chosen_korean: 나무
  alternatives_korean:
  - 장작
  - 나무들
  lexicon: HALOT
  rationale: 문맥상 제단 위에 놓는 연료를 가리키므로 한국어에서는 자연스럽게 단수 집합명사 ‘나무’로 옮겼습니다.
- source_word: וַיְנַתַּח
  english_pob_choice: cut ... into pieces
  chosen_korean: 조각내어
  alternatives_korean:
  - 토막내어
  - 잘라서
  lexicon: HALOT
  rationale: 제물 처리의 분할 행위를 간결하게 드러내며, ‘토막내다’보다 문어체에서 덜 거칠고, 단순 절단보다 분할 의미가 분명합니다.
- source_word: הַפָּר
  english_pob_choice: the bull
  chosen_korean: 황소
  alternatives_korean:
  - 수송아지
  - 소
  lexicon: HALOT
  rationale: 제사 맥락의 פַּר을 가장 직접적으로 가리키는 기본어로 ‘황소’를 택해, 동물의 성숙함과 제의적 무게를 살렸습니다.
