  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣ה חָטָ֑אתִי כִּֽי אַתָּ֞ה נֹתֵ֧ן אֶֽת עַבְדְּ/ךָ֛ בְּ/יַד אַחְאָ֖ב לַ/הֲמִיתֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/009.yaml
  text: And he said[a], “What have I sinned, that you are giving your servant into Ahab’s hand to put me to death?”
  footnotes:
  - marker: a
    text: Or, 'to kill me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「내가 무슨 죄를 지었기에, 당신이 당신의 종을 아합의 손에 넘겨 나를 죽게 하시려 합니까?[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나를 죽이려 하십니까?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말하였습니다
  lexicon: HALOT
  rationale: 서사적 wayyiqtol의 단순한 발화를 자연스러운 현대 합쇼체로 옮기되, 불필요한 연결어를 과하게 드러내지 않았습니다.
- source_word: מֶה חָטָאתִי
  english_pob_choice: What have I sinned
  chosen_korean: 내가 무슨 죄를 지었기에
  alternatives_korean:
  - 내가 무엇을 죄지었기에
  - 내가 어떻게 죄를 지었기에
  lexicon: HALOT
  rationale: 직역적 '나는 죄를 지었습니다'보다 한국어 관용에 맞는 의문 표현으로, 히브리어의 책임 부정을 자연스럽게 살렸습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 하인
  lexicon: HALOT
  rationale: 상급자에게 드리는 겸양적 자기지칭이므로 '종'이 가장 적절하며, 이 절에서는 신분적 굴종을 강조하는 '노예'가 아닙니다.
- source_word: בְּיַד אַחְאָב
  english_pob_choice: into Ahab’s hand
  chosen_korean: 아합의 손에 넘겨
  alternatives_korean:
  - 아합의 손 안에
  - 아합의 손에
  lexicon: HALOT
  rationale: 히브리어 관용구의 통제·지배 의미를 드러내기 위해 '손에'만 두지 않고 '넘겨'를 보태어 문맥상 위협을 분명히 했습니다.
- source_word: לַהֲמִיתֵנִי
  english_pob_choice: to put me to death
  chosen_korean: 죽이려 하십니까
  alternatives_korean:
  - 죽게 하려 하십니까
  - 죽여 버리려 하십니까
  lexicon: HALOT
  rationale: 히브리어 사역형의 살해 의도를 한국어에서 가장 자연스럽고 정중하게 표현했습니다. 영어 POB의 'put me to death'보다 덜 관용적이지 않되 같은 치명성을 유지합니다.
theological_decisions:
- issue: 간접 질문의 공손도와 대화 상대 지정
  chosen_reading: 공손한 대화체를 유지하되, 질문은 직접 인용 안에서 아합을 향한 위협을 선명하게 드러내는 형태로 옮겼습니다.
  alternative_readings:
  - 더 평평한 서술형 의문문
  - 보다 고어적인 왕대접 표현
  rationale: 이 절은 예배적 문맥이 아니라 긴박한 대면 대화이므로, 현대 합쇼체를 유지하면서도 원문의 절박함과 경어의 긴장을 함께 살리는 것이 중요합니다.
  doctrine_reference: 서사문 해석 원칙
