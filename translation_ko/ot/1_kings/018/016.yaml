  lexicon: HALOT
  rationale: 움직임의 목적을 나타내는 표현이므로, 문맥상 가장 자연스러운 ‘만나러’로 옮겨 양쪽 동작의 방향성을 살렸습니다.
- source_word: וַיַּגֶּד לוֹ
  english_pob_choice: told him
  chosen_korean: 그에게 알렸고
  alternatives_korean:
  - 그에게 말했고
  - 그에게 보고했고
  - 그에게 전했고
  lexicon: HALOT
  rationale: נגד의 ‘말하다/보고하다/알리다’ 범위를 반영하되, 오바댜가 아합에게 상황을 전달하는 맥락을 살려 ‘알리다’를 택했습니다.
