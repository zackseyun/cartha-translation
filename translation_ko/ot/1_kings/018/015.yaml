  source_fidelity: 히브리어의 맹세 공식, ‘만군의 야훼’, 야훼 앞에 서 있는 종의 이미지, 그리고 그날 아합에게 자신을 보이겠다는 선언을 대체로 잘 반영합니다. 다만 현 번역의 ‘그분’과 ‘그에게’가 각각 야훼와 아합을 가리키므로, 한국어에서는 지시 대상이 혼동됩니다.
