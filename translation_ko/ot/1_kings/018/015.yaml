  text: וַ/יֹּ֨אמֶר֙ אֵֽלִיָּ֔הוּ חַ֚י יְהוָ֣ה צְבָא֔וֹת אֲשֶׁ֥ר עָמַ֖דְתִּי לְ/פָנָ֑י/ו כִּ֥י הַ/יּ֖וֹם אֵרָאֶ֥ה אֵלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/015.yaml
  text: And Elijah said[a], “As Yahweh of hosts lives, before whom I stand, today I will surely present myself to him.”
  footnotes:
  - marker: a
    text: Or “I will appear before him” / “I will show myself to him.” The Hebrew verb can mean to be seen or to present oneself.
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리야가 말했습니다. “만군의 야훼께서 살아 계심을 두고 맹세합니다. 내가 그분 앞에 서 있으니, 오늘 나는 반드시 그에게 나타나겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나타나겠습니다’는 히브리어 נפעל형 동사의 ‘보이다/나타나다/몸을 드러내다’에 해당하며, 문맥상 ‘그에게 나타나다/자기 자신을 드러내다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה צְבָאוֹת
  english_pob_choice: As Yahweh of hosts lives
  chosen_korean: 만군의 야훼께서 살아 계심을 두고 맹세합니다
  alternatives_korean:
  - 야훼 만군의 하나님께서 살아 계심을 두고 맹세합니다
  - 만군의 야훼의 살아 계심을 두고 맹세합니다
  lexicon: WLC
  rationale: 히브리어의 표준 맹세 공식은 한국어에서 자연스러운 서약 표현으로 옮기되, יְהוָה는 프로젝트 기준에 따라 ‘야훼’로, צְבָאוֹת은 신적 칭호의 넓이를 살려 ‘만군의’로 옮겼습니다.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  english_pob_choice: before whom I stand
  chosen_korean: 내가 그분 앞에 서 있으니
  alternatives_korean:
  - 내가 그 앞에 서 있나니
  - 내가 그분 앞에 서 있습니다
  lexicon: WLC
  rationale: ‘서 있다’는 종속 관계와 섬김의 관용구를 살리면서도, 한국어 문장 안에서 맹세절의 자연스러운 배경 설명이 되도록 옮겼습니다.
- source_word: אֵרָאֶה אֵלָיו
  english_pob_choice: I will surely present myself to him
  chosen_korean: 오늘 나는 반드시 그에게 나타나겠습니다
  alternatives_korean:
  - 오늘 나는 그에게 나타나겠습니다
  - 오늘 나는 그 앞에 모습을 드러내겠습니다
  lexicon: WLC
  rationale: נִפעל형 ראה의 ‘보이다/나타나다/몸을 드러내다’ 뜻을 반영해, 자의적 추가 없이 ‘나타나겠습니다’로 옮기고 POB의 확정적 어조는 ‘반드시’로 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 만군의 야훼
  alternative_readings:
