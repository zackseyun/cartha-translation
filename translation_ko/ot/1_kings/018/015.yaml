  rationale: 본문이 직접 사용하는 신명기적 언약명을 보존하기 위해 ‘야훼’를 택했고, צְבָאוֹת은 군사력에만 좁히지 않도록 관용적 칭호를 함께 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
