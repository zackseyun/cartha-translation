  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלִיָּ֨הוּ֙ אֶל הָ/עָ֔ם אֲנִ֞י נוֹתַ֧רְתִּי נָבִ֛יא לַ/יהוָ֖ה לְ/בַדִּ֑/י וּ/נְבִיאֵ֣י הַ/בַּ֔עַל אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/022.yaml
  text: Then Elijah said to the people[a], “I, I alone, am left as a prophet of Yahweh, but the prophets of Baal are four hundred and fifty men.”
  footnotes:
  - marker: a
    text: Or, 'I alone remain a prophet of the LORD.' Elijah's statement reflects his present public standing in the confrontation, though elsewhere the narrative mentions other prophets hidden by Obadiah (1 Kgs 18:4, 13).
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 엘리야가 백성에게 말했습니다. “저만, 저만이 야훼의 예언자로 남아 있고, 바알의 예언자들은 사백오십 명입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 엘리야의 말은 그 순간의 공개적 상황을 반영한 것으로, 다른 곳에서는 오바댜가 숨겨 둔 다른 예언자들이 언급됩니다(왕상 18:4, 13).
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우-연속형의 서술 진행을 한국어의 자연스러운 순차 표현으로 살리면서, 문맥상 즉각적인 전환을 드러내기 위해 ‘그러자’를 썼습니다.
- source_word: אֶל הָעָם
  english_pob_choice: to the people
  chosen_korean: 백성에게
  alternatives_korean:
  - 사람들에게
  - 무리에게
  lexicon: HALOT
  rationale: 여기서 עָם은 엘리야가 대면한 이스라엘의 집단을 가리키므로, 단순한 군중보다 언약 공동체를 떠올리게 하는 ‘백성’이 더 정확합니다.
- source_word: נוֹתַרְתִּי / לְבַדִּי
  english_pob_choice: I, I alone, am left
  chosen_korean: 저만, 저만이 ... 남아 있고
  alternatives_korean:
  - 저 혼자만 ... 남아 있고
  - 저만 홀로 ... 남아 있고
  lexicon: HALOT
  rationale: 반복된 1인칭 대명사와 לְבַדִּי의 강조를 살리기 위해 ‘저만, 저만이’로 중복을 반영했습니다. ‘남아 있고’는 현재의 남겨진 상태를 자연스럽게 전달합니다.
- source_word: נָבִיא לַיהוָה
  english_pob_choice: as a prophet of Yahweh
  chosen_korean: 야훼의 예언자로
  alternatives_korean:
  - 야훼께 속한 예언자로
  - 야훼를 섬기는 예언자로
  lexicon: HALOT
  rationale: יְהוָה를 관습적 대체어가 아닌 ‘야훼’로 옮기고, נָבִיא를 교회적 관용구보다 원문에 가까운 ‘예언자’로 옮겨 신적 발화자라는 정체성을 분명히 했습니다.
- source_word: וּנְבִיאֵי הַבַּעַל
  english_pob_choice: the prophets of Baal
  chosen_korean: 바알의 예언자들
  alternatives_korean:
  - 바알 선지자들
  - 바알의 선지자들
  lexicon: HALOT
  rationale: בַּעַל의 종교적 대항자를 나타내는 표현이므로, 같은 용어를 일관되게 ‘예언자’로 맞추어 대조를 분명히 했습니다.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים אִישׁ
  english_pob_choice: four hundred and fifty men
  chosen_korean: 사백오십 명입니다
  alternatives_korean:
  - 사백오십 남자입니다
  - 사백오십 사람입니다
  lexicon: HALOT
  rationale: 히브리어의 개별 인원 수를 한국어 수사 표현으로 자연스럽게 옮겼습니다. 여기서 אִישׁ은 집합적 인원 표시로 기능하므로 ‘명’이 가장 간결하고 정확합니다.
theological_decisions:
- issue: 엘리야의 ‘오직 나만’이라는 자기 진술
  chosen_reading: 본문의 과장된 단독성 주장으로 그대로 유지했습니다.
  alternative_readings:
  - ‘저만이 남아 있다고 생각했습니다’처럼 완화하기
  - 주석적으로 다른 선지자들의 존재를 본문에 덧붙이기
  rationale: 열왕기상 18:4, 13의 다른 선지자 존재를 본문에서 조화시키지 않고, 엘리야가 대결 현장에서 한 말의 수사적 긴장 그대로 두는 것이 원문과 POB의 취지에 맞습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
- issue: יְהוָה의 번역
  chosen_reading: ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘여호와’로 표기하기
  - ‘주님’으로 대체하기
  rationale: 본문의 신명기적 언약 이름을 가리는 번역을 피하고, 감사 추적이 가능한 음역을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
