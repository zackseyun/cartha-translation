  rationale: 행동과 발화의 주체를 명시하여 한국어 서술의 혼동을 없앴습니다. 마지막 명령은 히브리어 שׁוּב의 기본 의미인 ‘돌아가다’를 본문에 유지하고, 반복 관찰이라는 문맥적 함의는 기존 각주로 처리했습니다. 각주 표지도 해당 낱말에 직접 연결했습니다.
