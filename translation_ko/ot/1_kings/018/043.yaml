id: 1KI.18.43
reference: 1 Kings 18:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶֽל נַעֲר֗/וֹ עֲלֵֽה נָא֙ הַבֵּ֣ט דֶּֽרֶךְ יָ֔ם וַ/יַּ֨עַל֙ וַ/יַּבֵּ֔ט וַ/יֹּ֖אמֶר אֵ֣ין מְא֑וּמָה וַ/יֹּ֕אמֶר שֻׁ֖ב שֶׁ֥בַע פְּעָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/043.yaml
  text: Then he said to his servant[a], “Please go up and look toward the sea.” So he went up and looked, and said, “There is nothing.” Then he said[c][b], “Go back seven times.”
  footnotes:
  - marker: a
    text: Or “his young man” or “his attendant.”
    reason: lexical_alternative
  - marker: b
    text: Literally “look in the direction of the sea.”
    reason: lexical_alternative
  - marker: c
    text: That is, repeat the trip and look again until seven times have been completed.
    reason: cultural_note
translation:
  language: ko
  text: 그가 자기 종에게 말했습니다. "부디 올라가서 바다 쪽을 살펴보십시오." 그가 올라가서 살펴보고 말했습니다. "아무것도 보이지 않습니다." 그러자 그가 말했습니다. "일곱 번 가서 보십시오."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘종’으로 옮겼지만, 히브리어는 문맥에 따라 ‘젊은이’나 ‘시종’도 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘바다의 방향을 보라’는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 즉, 같은 동작을 반복하여 일곱 차례가 될 때까지 다시 살펴보라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹ
  english_pob_choice: his servant
  chosen_korean: 자기 종
  alternatives_korean:
  - 자기 젊은이
  - 자기 시종
  lexicon: HALOT
  rationale: 나아르는 문맥에 따라 ‘젊은이/시종/종’이 될 수 있는데, 여기서는 엘리야의 지시를 받는 하인 역할이므로 기능을 드러내는 ‘종’이 가장 자연스럽습니다.
- source_word: עֲלֵה נָא
  english_pob_choice: Please go up
  chosen_korean: 부디 올라가서
  alternatives_korean:
  - 제발 올라가서
  - 올라가 보십시오
  lexicon: HALOT
  rationale: 명령형 ‘올라가’와 완곡한 요청의 נָא를 함께 살려 공손하면서도 긴급한 요청으로 표현했습니다.
- source_word: הַבֵּט דֶּרֶךְ יָם
  english_pob_choice: look toward the sea
  chosen_korean: 바다 쪽을 살펴보십시오
  alternatives_korean:
  - 바다 방향을 살펴보십시오
  - 바다 쪽을 보십시오
  lexicon: HALOT
  rationale: דֶּרֶךְ יָם의 ‘바다 쪽/방향’을 한국어 관용에 맞게 옮겼고, הַבֵּט는 단순히 보다보다 ‘살펴보다’가 관찰 행위를 더 잘 드러냅니다.
- source_word: אֵין מְאוּמָה
  english_pob_choice: There is nothing
  chosen_korean: 아무것도 보이지 않습니다
  alternatives_korean:
  - 아무것도 없습니다
  - 전혀 보이지 않습니다
  lexicon: HALOT
  rationale: 문맥상 ‘무언가가 보이는가’에 대한 답이므로, 히브리어의 강한 부정을 자연스럽게 살려 ‘아무것도 보이지 않습니다’로 옮겼습니다.
- source_word: שֻׁב שֶׁבַע פְּעָמִים
  english_pob_choice: Go back seven times
  chosen_korean: 일곱 번 가서 보십시오
  alternatives_korean:
  - 일곱 번 돌아가십시오
  - 일곱 번 반복해서 가보십시오
  lexicon: HALOT
  rationale: 히브리어는 ‘돌아가라/되돌아가라’로 말하지만, 문맥상 같은 동작을 반복해 다시 살펴보라는 뜻이므로 한국어에서는 행동의 의도를 드러내는 방식으로 옮겼습니다.
