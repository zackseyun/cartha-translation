  - 고쳤습니다
  - 회복시켰습니다
  - 치유했습니다
  lexicon: HALOT
  rationale: רפא는 문자적으로는 "치유하다"이지만 제단을 목적어로 할 때는 손상된 것을 바로잡는 뜻이므로, 물건에 자연스러운 "수리하다"를 택했습니다.
- source_word: יְהוָה
