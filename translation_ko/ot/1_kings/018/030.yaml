  text: Then Elijah said to all the people[a], “Come near to me.” So all the people came near to him, and he repaired the altar of Yahweh that had been torn down.
  footnotes:
  - marker: a
    text: Or 'restored' the altar of the LORD; the Hebrew verb is literally 'healed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 엘리야가 모든 백성에게 말했습니다. "내게 가까이 오십시오." 그러자 모든 백성이 그에게 가까이 왔고, 그는 야훼의 무너진 제단을 수리했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “회복시켰습니다”가 가능하나, 히브리어 동사는 문자적으로는 “치유하다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּשׁוּ / וַיִּגְּשׁוּ
  english_pob_choice: Come near / came near
  chosen_korean: 가까이 오십시오 / 가까이 왔고
  alternatives_korean:
