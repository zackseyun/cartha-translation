  yaml_path: translation/ot/1_kings/018/030.yaml
  text: Then Elijah said to all the people[a], “Come near to me.” So all the people came near to him, and he repaired the altar of Yahweh that had been torn down.
  footnotes:
  - marker: a
    text: Or 'restored' the altar of the LORD; the Hebrew verb is literally 'healed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 엘리야가 모든 백성에게 말했습니다. “내게 가까이 오십시오.” 이에 모든 백성이 그에게 가까이 왔고, 그는 야훼의 허물어진 제단을 수리했습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “복구했습니다.” 히브리어 동사는 문자적으로 “치유하다”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּשׁוּ / וַיִּגְּשׁוּ
  english_pob_choice: Come near / came near
  chosen_korean: 가까이 오십시오 / 가까이 왔고
  alternatives_korean:
  - 와 보십시오 / 와서
  - 다가오십시오 / 다가왔고
  lexicon: HALOT
  rationale: נגשׁ의 핵심은 물리적으로 가까이 다가오는 동작이므로, 자연스러운 현대어로 "가까이"를 살려 명령과 이행의 대응을 맞췄습니다.
- source_word: וַיְרַפֵּא
  english_pob_choice: repaired
  chosen_korean: 수리했습니다
  alternatives_korean:
  - 고쳤습니다
  - 회복시켰습니다
  - 치유했습니다
  lexicon: HALOT
  rationale: רפא는 문자적으로는 "치유하다"이지만 제단을 목적어로 할 때는 손상된 것을 바로잡는 뜻이므로, 물건에 자연스러운 "수리하다"를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default / DOCTRINE.md
  rationale: 본문의 여호와-대체표현 대신, 프로젝트 기본값에 따라 신적 고유명사 יְהוָה를 음역한 "야훼"로 옮겼습니다.
- source_word: הֶהָרוּס
  english_pob_choice: that had been torn down
  chosen_korean: 무너진
  alternatives_korean:
  - 헐린
  - 파괴된
  - 무너져 있던
  lexicon: HALOT
  rationale: רס는 무너뜨리거나 허무는 의미이므로, 제단의 훼손 상태를 간결하게 드러내는 "무너진"이 가장 직접적입니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
