  - 주님
  rationale: 히브리어 본문이 직접 사용하는 언약명 יהוה를 제목어로 바꾸지 않고, 프로젝트 기준에 따라 고유명사로 드러내는 것이 원문 효과를 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
