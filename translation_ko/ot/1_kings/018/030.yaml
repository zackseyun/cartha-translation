  lexicon: HALOT
  rationale: נגשׁ의 핵심은 물리적으로 가까이 다가오는 동작이므로, 자연스러운 현대어로 "가까이"를 살려 명령과 이행의 대응을 맞췄습니다.
- source_word: וַיְרַפֵּא
