  text: And now you are saying, ‘Go, tell your lord, “Look, Elijah is here,”’ and he will kill me.’
translation:
  language: ko
  text: 그런데 이제 당신은 당신의 주인에게 가서 이렇게 말하라고 하고 있습니다. “보십시오, 엘리야가 여기 있습니다.” 그러면 그가 저를 죽일 것입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 הִנֵּה는 여기서 단순한 감탄사보다 상대에게 주의를 환기하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה / And now
  english_pob_choice: And now
  chosen_korean: 그런데 이제
  alternatives_korean:
  - 이제
  - 그러므로 이제
  - 지금
  lexicon: וְ + עַתָּה
  rationale: 화자의 항변이 이어지는 흐름을 살리기 위해 단순한 시간표지보다 반전·대조를 띠는 ‘그런데 이제’로 옮겼습니다.
- source_word: אֹמֵר / you are saying
  english_pob_choice: you are saying
  chosen_korean: 당신은 … 말하라고 하고 있습니다
  alternatives_korean:
  - 당신은 … 말합니다
  - 당신이 … 말하고 있습니다
  lexicon: אָמַר
  rationale: 현재 진행 중인 지시를 드러내기 위해 직역적 현재형보다 ‘말하라고 하고 있습니다’로 자연스럽게 풀었습니다.
- source_word: לַאדֹנֶיךָ / to your lord
  english_pob_choice: your lord
  chosen_korean: 당신의 주인에게
  alternatives_korean:
  - 당신의 상전에게
  - 당신의 주께
  lexicon: אֲדֹנִים/אָדוֹן
  rationale: 문맥상 엘리야를 향한 아합의 왕권 아래 있는 ‘주인/상전’ 관계이므로, 종교적 ‘주’가 아니라 지배자 의미의 ‘주인’으로 옮겼습니다.
- source_word: הִנֵּה / Look
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 봐
  - 여기 보십시오
  lexicon: הִנֵּה
  rationale: 영어 POB의 ‘Look’을 한국어의 정중한 주의 환기 표현으로 반영해, 단순 감탄사보다 화행 기능이 드러나게 했습니다.
- source_word: וַהֲרָגָנִי / and he will kill me
  english_pob_choice: and he will kill me
  chosen_korean: 그러면 그가 저를 죽일 것입니다
  alternatives_korean:
  - 그러면 그가 나를 죽일 것입니다
  - 그가 나를 죽일 것입니다
  lexicon: הָרַג
  rationale: 예언적 또는 확정적 결과를 나타내는 העתיד형 뉘앙스를 살려 ‘그러면’으로 인과를 드러냈습니다.
theological_decisions:
- issue: 엘리야를 가리키는 호칭 표현
  chosen_reading: ‘당신의 주인’으로 평범한 지배 관계를 드러내고, ‘주님’ 같은 신앙 언어는 쓰지 않았습니다.
  alternative_readings:
  - 당신의 주님
  - 당신의 상전
  rationale: 히브리어 אֲדֹנֶיךָ는 여기서 신적 호칭이 아니라 인간 상전/주인을 가리키므로, 본문 의미를 흐리지 않기 위해 세속적 관계로 번역했습니다.
  doctrine_reference: 문맥상 인칭 관계 유지; 신성 호칭 오독 방지
