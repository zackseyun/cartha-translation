reference: 1 Kings 18:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֤א עָכַ֨רְתִּי֙ אֶת יִשְׂרָאֵ֔ל כִּ֥י אִם אַתָּ֖ה וּ/בֵ֣ית אָבִ֑י/ךָ בַּֽ/עֲזָבְ/כֶם֙ אֶת מִצְוֺ֣ת יְהוָ֔ה וַ/תֵּ֖לֶךְ אַחֲרֵ֥י הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/018.yaml
  text: And he said[a], “I have not troubled Israel, but you and your father's house have[c][b], because you have forsaken the commandments of Yahweh and have gone after the Baals.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; rendered ''the LORD'' following the translation''s standard practice for the divine name.'
    reason: alternative_reading
  - marker: b
    text: Or 'have brought trouble on Israel.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew is plural: ''the Baals,'' referring to Baal worship in its various local forms or manifestations.'
    reason: cultural_note
translation:
  language: ko
  text: 그가 말했습니다. “내가 이스라엘을 곤경에 빠뜨린 것이 아닙니다.[b] 이스라엘을 곤경에 빠뜨린 것은 너와 네 아버지의 집입니다. 너희가 야훼[a]의 계명들을 버리고 바알들[c]을 따라갔기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 하나님의 고유한 이름인 ‘야훼’를 사용합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘이스라엘에 어려움을 가져온 것’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 복수형 ‘바알들’입니다. 여러 지역적 형태 또는 발현의 바알 숭배를 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: עָכַרְתִּי
  english_pob_choice: have not troubled
  chosen_korean: 괴롭게 한 것이 아니라
  alternatives_korean:
  - 혼란에 빠뜨린 것이 아니라
  - 해를 끼친 것이 아니라
  - 문제를 일으킨 것이 아니라
  lexicon: HALOT
  rationale: עכר는 단순한 감정적 ‘괴롭힘’보다 공동체에 재난이나 혼란을 끼치는 뜻이어서, 여기서는 ‘괴롭게 하다’로 옮겨 대조를 살렸습니다.
- source_word: בַּעֲזָבְכֶם
  english_pob_choice: because you have forsaken
  chosen_korean: 버리고
  alternatives_korean:
  - 저버리고
  - 떠나
  - 배반하고
  lexicon: HALOT
  rationale: 전치사적 의미가 원인 제시이므로 한국어에서는 문맥상 자연스러운 원인절로 풀어 ‘버리고’로 옮겼습니다.
- source_word: מִצְוֺת יְהוָה
  english_pob_choice: the commandments of Yahweh
  chosen_korean: 야훼의 명령들
  alternatives_korean:
  - 야훼의 계명들
  - 야훼의 명령
  - 여호와의 계명들
  lexicon: HALOT
  rationale: מִצְוֺת는 단수 ‘명령’이 아니라 복수형이므로 ‘명령들’로 살렸고, 본문 원칙에 따라 신명은 ‘야훼’로 옮겼습니다.
- source_word: הַבְּעָלִים
  english_pob_choice: the Baals
  chosen_korean: 바알들을
  alternatives_korean:
  - 바알
  - 바알 신들
  - 바알 우상들
  lexicon: HALOT
  rationale: 히브리어 복수형을 한국어에서도 그대로 반영해 단수화하지 않았습니다. 이는 지역별·형태별 바알 숭배를 드러냅니다.
theological_decisions:
- issue: יהוה(YHWH)의 번역
  chosen_reading: ‘야훼’로 음역했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주’
  rationale: 본문이 신명기적 언약 이름을 직접 사용하므로, 표준 프로젝트 원칙에 따라 대체 칭호가 아니라 고유명 ‘야훼’를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: הַבְּעָלִים의 복수성
  chosen_reading: ‘바알들을’로 복수성을 유지했습니다.
  alternative_readings:
  - ‘바알’
  - ‘바알 우상들’
  rationale: 히브리어 복수형은 바알 숭배의 다양한 지역적·형태적 표현을 시사하므로, 단수로 평탄화하지 않았습니다.
  doctrine_reference: 'POB OT translation principle: preserve documented plurality where source marks it'
