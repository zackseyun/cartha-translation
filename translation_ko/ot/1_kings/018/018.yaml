revisions:
- from: 그가 말했습니다. “내가 이스라엘을 괴롭게 한 것이 아니라, 너와 네 아버지의 집이 그렇습니다. 너희가 야훼의 명령들을 버리고 바알들을 따라갔기 때문입니다.”[a][b][c]
  to: 그가 말했습니다. “내가 이스라엘을 곤경에 빠뜨린 것이 아닙니다.[b] 이스라엘을 곤경에 빠뜨린 것은 너와 네 아버지의 집입니다. 너희가 야훼[a]의 계명들을 버리고 바알들[c]을 따라갔기 때문입니다.”
  rationale: 대조되는 두 절에 ‘이스라엘을 곤경에 빠뜨리다’라는 의미를 명시하여 עכר의 공동체적 재난·곤경의 뉘앙스와 문장 논리를 분명히 했습니다. ‘아버지의 집’과 ‘바알들’의 복수는 유지했으며, 각주 b를 완결되고 본문에 직접 대응하는 어휘 대안으로 고쳤습니다.
