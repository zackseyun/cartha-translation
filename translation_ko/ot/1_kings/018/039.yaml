source:
  edition: WLC
  text: וַ/יַּרְא֙ כָּל הָ/עָ֔ם וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֹּ֣אמְר֔וּ יְהוָה֙ ה֣וּא הָ/אֱלֹהִ֔ים יְהוָ֖ה ה֥וּא הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/039.yaml
  text: When all the people saw it[a], they fell on their faces and said, “Yahweh, he is God! Yahweh, he is God!”
  footnotes:
  - marker: a
    text: 'Hebrew: ''The LORD, he is the God! The LORD, he is the God!'' The article in ''the God'' marks YHWH as the true God in contrast to Baal; English commonly expresses this as ''God.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 온 백성이 그것을 보고 얼굴을 땅에 대고 엎드려 말했습니다. “야훼, 그분이 하나님이십니다[a]! 야훼, 그분이 하나님이십니다!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 “야훼, 그분이 그 하나님이십니다”입니다. 여기서 정관사가 붙은 ‘하나님’은 바알과 대비되는 참 하나님을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: saw it
  chosen_korean: 그것을 보고
  alternatives_korean:
  - 보고
  - 그것을 보았습니다
  lexicon: HALOT
  rationale: 영어 POB가 문맥상 드러난 불의 사건을 가리켜 'it'을 보충한 것처럼, 한국어도 바로 앞 사건을 받는 목적어를 살려 자연스럽게 옮겼습니다.
- source_word: כָּל הָעָם
  english_pob_choice: all the people
  chosen_korean: 온 백성이
  alternatives_korean:
  - 모든 백성이
  - 그 모든 백성이
  lexicon: HALOT
  rationale: 집합 명사 עָם은 여기서 자연스럽게 '백성'으로 옮기되, 전체성을 드러내기 위해 '온'을 사용했습니다.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  english_pob_choice: fell on their faces
  chosen_korean: 얼굴을 땅에 대고 엎드려
  alternatives_korean:
  - 얼굴에 엎드려
  - 엎드려 절하며
  lexicon: HALOT
  rationale: 히브리어의 구체적 신체 이미지를 유지하면서, 한국어에서는 관용적으로 이해되도록 '얼굴을 땅에 대고 엎드려'로 풀었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥의 신적 이름 יְהוָה는 프로젝트 기본값에 따라 '야훼'로 옮겨, 칭호가 아니라 고유한 언약 이름임을 보존했습니다.
- source_word: הָאֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님이십니다
  alternatives_korean:
  - 하나님이십니다
  - 그 하나님이십니다
  lexicon: HALOT
  rationale: 정관사에 담긴 대조적 의미는 한국어에서 '하나님'으로 자연스럽게 전달하고, 문맥상 승리를 선포하는 진술로서 높임 종결을 유지했습니다.
theological_decisions:
- issue: 백성의 고백에서 신적 이름과 술어의 반복
  chosen_reading: 두 번의 반복을 그대로 살려, 야훼의 유일성과 바알과의 대조를 강하게 드러냈습니다.
  alternative_readings:
  - 한 번만 옮기기
  - '''야훼께서 참 하나님이십니다''로 완화하기'
  rationale: 히브리어의 반복은 단순 장식이 아니라 결정적 신앙 고백의 절정이므로, 한국어에서도 반복을 유지해야 서사적·신학적 힘이 보존됩니다.
  doctrine_reference: 본문의 문맥상 야훼의 유일신 고백
- issue: '''하나님''의 관사 효과'
  chosen_reading: '''하나님이십니다''로 옮겨, 정관사로 표시된 대조성을 과도하게 설명하지 않고도 살렸습니다.'
  alternative_readings:
  - '''그 하나님이십니다'''
  - '''참 하나님이십니다'''
  rationale: 히브리어 הָאֱלֹהִים의 정관사 효과는 바알과 대비되는 참 하나님을 가리키지만, 한국어 본문에서는 본문을 과잉 해설하지 않는 것이 더 충실합니다.
  doctrine_reference: 정관사에 의한 대조적 지시
