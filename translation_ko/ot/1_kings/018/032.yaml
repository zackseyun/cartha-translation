  text: And with the stones he built an altar in the name of Yahweh[a], and he made a trench around the altar, like the capacity for two seahs of seed.
  footnotes:
  - marker: a
    text: 'Hebrew: ''like the measure of two seahs of seed,'' an idiom indicating the trench''s size or capacity.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 돌들로 야훼의 이름으로 제단을 쌓고, 그 제단 주위에 두 세아의 씨앗이 들어갈 만한 도랑을 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘두 세아의 씨앗 분량’이라는 관용구로, 도랑의 크기나 수용량을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבְנֶה אֶת הָאֲבָנִים מִזְבֵּחַ
  english_pob_choice: with the stones he built an altar
  chosen_korean: 돌들로 제단을 쌓고
  alternatives_korean:
  - 돌들로 제단을 만들고
  - 돌들을 가지고 제단을 쌓고
  lexicon: HALOT
  rationale: 히브리어는 돌들을 재료로 하여 제단을 세웠다는 뜻이므로, 한국어에서는 자연스럽게 ‘돌들로 제단을 쌓고’로 옮겨 재료·행위 관계를 살렸습니다.
- source_word: בְּשֵׁם יְהוָה
  english_pob_choice: in the name of Yahweh
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
  - 야훼의 이름 안에서
  - 야훼의 이름을 따라
  lexicon: HALOT
  rationale: בְּשֵׁם은 ‘~의 이름으로’가 가장 직접적이며, 전승된 호칭 대신 신명기적 고유명사인 야훼를 유지했습니다.
- source_word: וַיַּעַשׂ תְּעָלָה
  english_pob_choice: he made a trench
  chosen_korean: 도랑을 만들었습니다
  alternatives_korean:
  - 도랑을 팠습니다
  - 수로를 만들었습니다
  lexicon: HALOT
  rationale: תְּעָלָה는 여기서 제단 둘레의 파인 홈을 가리키므로, 현대 한국어로는 ‘도랑’이 가장 간명합니다.
- source_word: כְּבֵית סָאתַיִם זֶרַע
  english_pob_choice: like the capacity for two seahs of seed
  chosen_korean: 두 세아의 씨앗이 들어갈 만한
  alternatives_korean:
  - 두 세아의 씨앗 분량의
  - 두 세아의 씨앗을 담을 만큼의
  lexicon: HALOT
  rationale: 직역하면 ‘두 세아의 씨앗의 양/분량’이라는 관용적 표현이므로, 수량감은 살리되 한국어 어법에 맞게 ‘들어갈 만한’으로 처리했습니다.
- source_word: סָבִיב לַמִּזְבֵּחַ
  english_pob_choice: around the altar
  chosen_korean: 제단 주위에
  alternatives_korean:
  - 제단 둘레에
  - 제단을 둘러
  lexicon: HALOT
  rationale: סָבִיב은 둘러싼 위치를 나타내므로, 문맥상 가장 자연스러운 ‘제단 주위에’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 본문의 신명은 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
