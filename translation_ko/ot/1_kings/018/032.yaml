  - 여호와
  rationale: 원문에 יְהוָה가 직접 나오므로, 본문에서는 고유 신명인 ‘야훼’를 유지해 제목화된 대체 표기를 피했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
