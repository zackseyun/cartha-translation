theological_decisions:
- issue: 의례적 자해의 묘사 수위
  chosen_reading: 원문의 충격을 약화하지 않고, 바알 선지자들의 광적인 제의 행위를 드러내는 방향으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 풀어 ‘상하게 하다’로 번역
  - 의미를 약화해 단순히 ‘애원하다’로 번역
  rationale: 본문은 우상 숭배의 실패와 광기를 보여 주므로, 자해의 실제성을 흐리지 않는 번역이 문맥에 충실합니다.
  doctrine_reference: 열왕기상 18장의 바알 대결 서사
