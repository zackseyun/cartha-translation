base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/028.yaml
  text: So they cried out with a loud voice and cut themselves according to their custom with swords and spears until the blood gushed out on them[a][b].
  footnotes:
  - marker: a
    text: Or 'gashed themselves' for 'cut themselves.' The Hebrew refers to ritual self-laceration.
    reason: lexical_alternative
  - marker: b
    text: Or 'according to their practice' or 'as was their manner.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 그들은 큰 소리로 부르짖고, 자기들의 관습대로 칼과 창으로 몸을 찔러 피가 자기들 위에 쏟아질 때까지 그러했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몸을 베어’로 옮길 수 있습니다. 히브리어는 의례적 자해를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘관습대로’, ‘늘 하던 대로’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  english_pob_choice: they cried out
  chosen_korean: 부르짖고
  alternatives_korean:
  - 외치고
  - 소리치고
  lexicon: HALOT
  rationale: 바알을 향한 의례적 절규라는 문맥에서 단순한 ‘부르다’보다 강한 ‘부르짖다’가 원문의 절박함을 더 잘 드러냅니다.
- source_word: בְּקוֹל גָּדוֹל
  english_pob_choice: with a loud voice
  chosen_korean: 큰 소리로
  alternatives_korean:
  - 큰 음성으로
  - 높은 소리로
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 현대 한국어로 옮기되, 소리의 크기를 직접 보존했습니다.
- source_word: וַיִּתְגֹּדְדוּ
  english_pob_choice: cut themselves
  chosen_korean: 몸을 찔러
  alternatives_korean:
  - 자해하여
  - 몸을 베어
  lexicon: HALOT
  rationale: 이 동사는 의례적 자해를 가리키므로, 직접적이면서도 과도하게 해석하지 않는 표현으로 옮겼습니다.
- source_word: כְּמִשְׁפָּטָם
  english_pob_choice: according to their custom
  chosen_korean: 자기들의 관습대로
  alternatives_korean:
  - 자기들의 규례대로
  - 자기들의 방식대로
  - 그들이 늘 하던 대로
  lexicon: HALOT
  rationale: 여기서 מִשְׁפָּט은 법적 ‘판결’보다 종교적·의례적 ‘관습/규범’의 뜻이므로, 바알 제의의 고정된 행위를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 의례적 자해의 묘사 수위
  chosen_reading: 원문의 충격을 약화하지 않고, 바알 선지자들의 광적인 제의 행위를 드러내는 방향으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 풀어 ‘상하게 하다’로 번역
  - 의미를 약화해 단순히 ‘애원하다’로 번역
  rationale: 본문은 우상 숭배의 실패와 광기를 보여 주므로, 자해의 실제성을 흐리지 않는 번역이 문맥에 충실합니다.
  doctrine_reference: 열왕기상 18장의 바알 대결 서사
