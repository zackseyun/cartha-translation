  text: So they cried out with a loud voice and cut themselves according to their custom with swords and spears until the blood gushed out on them[a][b].
  footnotes:
  - marker: a
    text: Or 'gashed themselves' for 'cut themselves.' The Hebrew refers to ritual self-laceration.
    reason: lexical_alternative
  - marker: b
    text: Or 'according to their practice' or 'as was their manner.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 그들은 큰 소리로 부르짖으며, 피가 그들 위에 흐를 때까지 자기들의 관습대로[b] 칼과 창으로 몸을 베었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몸을 그어 상처를 내어’로 옮길 수 있습니다. 히브리어는 의례적 자기 절상을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기들의 방식대로’ 또는 ‘늘 하던 대로’로 옮길 수 있습니다.
    reason: alternative_reading
