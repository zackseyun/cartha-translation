base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/006.yaml
  text: 'So they divided the land between themselves to pass through it: Ahab went one way by himself[a], and Obadiah went another way by himself.'
  footnotes:
  - marker: a
    text: 'Hebrew literally repeats ''one way'' for both men: ''Ahab went on one way by himself, and Obadiah went on one way by himself.'' The translation uses ''another way'' in the second clause to make the contrast explicit in natural English.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그 땅을 나누어 그곳을 지나가기로 했습니다. 아합은 혼자서 한 길로 갔고, 오바댜는 혼자서 다른 길로 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 두 사람에 대해 모두 ‘한 길’을 반복합니다. 여기서는 두 사람이 서로 다른 길로 갔다는 대조를 자연스럽게 드러내기 위해 둘째 절을 ‘다른 길’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלְּקוּ
  english_pob_choice: they divided
  chosen_korean: 그들은 그 땅을 나누어
  alternatives_korean:
  - 그들은 분배하여
  - 그들은 분할하여
  lexicon: HALOT
  rationale: פּיעל 완료형 서술로 ‘나누다/분할하다’의 능동적 행위를 나타내므로, 자연스러운 서술체인 ‘나누어’로 옮겼습니다.
- source_word: אֶת הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 그 지역
  - 그 영토
  lexicon: HALOT
  rationale: 여기서 אֶרֶץ는 전 세계가 아니라 탐색할 지역을 가리키므로, 한국어로도 가장 일반적이고 넓은 의미의 ‘땅’이 적절합니다.
- source_word: בְּדֶרֶךְ אֶחָד / בְּדֶרֶךְ אֶחָד
  english_pob_choice: one way / another way
  chosen_korean: 한 길로 / 다른 길로
  alternatives_korean:
  - 한 방향으로 / 다른 방향으로
  - 한 노선으로 / 다른 노선으로
  lexicon: HALOT
  rationale: 히브리어가 두 사람 모두에게 ‘한 길’이라는 표현을 반복하지만, 대조를 분명히 하기 위해 둘째 절은 ‘다른 길’로 옮겨 균형과 대비를 살렸습니다.
- source_word: לְבַדּוֹ
  english_pob_choice: by himself
  chosen_korean: 혼자서
  alternatives_korean:
  - 홀로
  - 그 자신만
  lexicon: HALOT
  rationale: ‘혼자서’는 분리된 이동을 자연스럽게 드러내며, 두 사람이 각자 따로 갔다는 서술의 초점을 잘 살립니다.
