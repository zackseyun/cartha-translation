  text: וַ/יֹּ֤אמֶר אַחְאָב֙ אֶל עֹ֣בַדְיָ֔הוּ לֵ֤ךְ בָּ/אָ֨רֶץ֙ אֶל כָּל מַעְיְנֵ֣י הַ/מַּ֔יִם וְ/אֶ֖ל כָּל הַ/נְּחָלִ֑ים אוּלַ֣י נִמְצָ֣א חָצִ֗יר וּ/נְחַיֶּה֙ ס֣וּס וָ/פֶ֔רֶד וְ/ל֥וֹא נַכְרִ֖ית מֵ/הַ/בְּהֵמָֽה־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/005.yaml
  text: And Ahab said to Obadiah[a], “Go through the land to all the springs of water and to all the wadis. Perhaps we may find grass and keep horse and mule alive[b], so that we do not have to cut off some of the livestock.”
  footnotes:
  - marker: a
    text: Or “the streams.” The Hebrew word can denote a wadi, torrent-bed, or stream; in this drought setting, “wadis” best reflects the likely sense of seasonal watercourses.
    reason: lexical_alternative
  - marker: b
    text: Literally “cut off from the livestock.” The expression likely means reducing the number of animals, probably because there is not enough fodder to keep them alive.
    reason: lexical_alternative
translation:
  language: ko
  text: 아합이 오바댜에게 말하였습니다. “그 땅을 두루 다니며 모든 샘과 모든 와디[a]를 찾아보십시오. 어쩌면 풀을 찾아 말과 노새를 살려 두고, 가축 가운데 일부를 잘라 내지[b] 않아도 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “시내들”. 히브리어 נחל은 와디, 급류가 흐르는 골짜기, 또는 시내를 가리킬 수 있습니다. 여기서는 가뭄의 정황상 계절성 물길인 “와디”가 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “가축 가운데서 잘라 내지 않도록”입니다. 이 표현은 먹이가 부족하여 가축의 수를 줄이거나 도태하는 일을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאָרֶץ
  english_pob_choice: through the land
  chosen_korean: 땅을 두루
  alternatives_korean:
  - 땅 안으로
  - 그 땅에서
  lexicon: HALOT
  rationale: 이동 동사와 결합된 ב는 단순한 위치보다 지역 전체를 두루 이동하는 뜻이 자연스러워, 한국어도 ‘두루’로 순회 뉘앙스를 살렸습니다.
- source_word: מַעְיְנֵי הַמַּיִם
  english_pob_choice: the springs of water
  chosen_korean: 물 샘
  alternatives_korean:
  - 물의 샘
  - 샘물
  lexicon: HALOT
  rationale: 히브리어의 구체적 물 공급원을 살리면서도 한국어에서 자연스럽게 읽히도록 직역에 가까운 ‘물 샘’을 택했습니다.
- source_word: הַנְּחָלִים
  english_pob_choice: the wadis
  chosen_korean: 와디
  alternatives_korean:
  - 시내
  - 골짜기
  - 개울
  lexicon: HALOT
  rationale: 가뭄 상황에서 נחל은 계절성 물길을 가리키므로, 지리적 함의를 보존하는 ‘와디’가 본문의 정황을 가장 정확히 드러냅니다.
- source_word: וְלֹא נַכְרִית מֵהַבְּהֵמָה
  english_pob_choice: so that we do not have to cut off some of the livestock
  chosen_korean: 가축 가운데 일부를 끊어 버리지 않아도 될 것입니다
  alternatives_korean:
  - 가축 가운데 일부를 없애지 않아도 될 것입니다
  - 가축을 일부 죽이지 않아도 될 것입니다
  lexicon: HALOT
  rationale: כרת의 ‘끊다/잘라 내다’ 이미지를 유지하면서, מן의 부분성을 한국어로 자연스럽게 옮겨 ‘가축 가운데 일부’로 처리했습니다.
theological_decisions:
- issue: 가뭄 속 왕의 실용적 언어를 어떻게 번역할 것인가
  chosen_reading: 본문의 긴박감과 생존 목적을 그대로 살려, 신학적 완화 없이 가축 보존의 현실적 의도를 드러냈습니다.
  alternative_readings:
  - 가축을 살려 두지 않게 될 것이다
  - 가축을 줄여야 할 것이다
  rationale: 히브리어는 단순한 손실이 아니라 생존을 위한 조치 가능성을 말하므로, 본문의 절박함과 구체성을 유지하는 표현이 적절합니다.
  doctrine_reference: '서술 본문 해석 원칙: 서사적 현실성 보존'
