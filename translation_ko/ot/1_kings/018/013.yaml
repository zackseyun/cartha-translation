  text: הֲ/לֹֽא הֻגַּ֤ד לַֽ/אדֹנִ/י֙ אֵ֣ת אֲשֶׁר עָשִׂ֔יתִי בַּ/הֲרֹ֣ג אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וָ/אַחְבִּא֩ מִ/נְּבִיאֵ֨י יְהוָ֜ה מֵ֣אָה אִ֗ישׁ חֲמִשִּׁ֨ים חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וָ/אֲכַלְכְּלֵ֖/ם לֶ֥חֶם וָ/מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/013.yaml
  text: Has it not been told to my lord what I did when Jezebel was killing the prophets of Yahweh—how I hid a hundred of the prophets of Yahweh[a], fifty men in each cave, and provided them with bread and water?
  footnotes:
  - marker: a
    text: Or, 'fifty men each in a cave' or 'in two groups of fifty in caves.' The Hebrew expresses a distributive grouping by fifties.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것이 내 주인님께 알려지지 않았습니까? 내가 무슨 일을 했는지, 곧 이세벨이 야훼의 선지자들을 죽일 때—내가 야훼의 선지자들 가운데서 백 명을 숨겼고, 오십 명씩 각 동굴에 두었으며, 그들에게 빵과 물로 먹을 것을 대주었습니다?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동굴마다 오십 명씩’ 또는 ‘동굴들에 두 그룹으로 나누어 오십 명씩’이라는 뜻일 수 있습니다. 히브리어는 오십 단위의 분배를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Has it not
  chosen_korean: 그것이 … 않습니까?
  alternatives_korean:
  - 그렇지 않습니까?
  - …이 아니었습니까?
  lexicon: HALOT
  rationale: 수사적 질문으로 상대의 인지를 전제하는 표현이므로, 한국어에서는 확인을 요구하는 반문형으로 살렸습니다.
- source_word: לַאדֹנִי
  english_pob_choice: to my lord
  chosen_korean: 내 주인님께
  alternatives_korean:
  - 내 주께
  - 내 주님께
  lexicon: HALOT
  rationale: 엘리야에 대한 정중한 호칭이므로 신적 호칭처럼 들리지 않게 하면서도 공손함을 유지하는 표현을 택했습니다.
- source_word: נְבִיאֵי יְהוָה
  english_pob_choice: the prophets of Yahweh
  chosen_korean: 야훼의 선지자들
  alternatives_korean:
  - 야훼의 예언자들
  - 여호와의 선지자들
  lexicon: HALOT
  rationale: YHWH는 본 프로젝트 기본값에 따라 야훼로 옮겼고, נביאים는 한국어 성경에서 통용되는 선지자를 유지하되 주석적 투명성을 위해 영어 POB의 Yahweh와 맞췄습니다.
- source_word: מֵאָה אִישׁ
  english_pob_choice: a hundred men
  chosen_korean: 백 명
  alternatives_korean:
  - 백 명의 남자들
  - 남자 백 명
  lexicon: HALOT
  rationale: 히브리어의 אישׁ가 명시되어 있으나, 한국어에서는 수량 표현만으로 충분히 자연스러워 장황함을 피했습니다. 인물성은 뒤의 분배 표현으로 이미 드러납니다.
- source_word: חֲמִשִּׁים חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  english_pob_choice: fifty men in each cave
  chosen_korean: 오십 명씩 각 동굴에
  alternatives_korean:
  - 동굴마다 오십 명씩
  - 오십 명씩 한 동굴에
  lexicon: HALOT
  rationale: 반복된 오십-오십 구조는 분배적 의미이므로 한국어에서는 ‘~씩’과 ‘각’으로 살렸습니다. בַּמְּעָרָה는 분배된 배치를 드러내는 자연스러운 ‘각 동굴에’로 옮겼습니다.
- source_word: וָאֲכַלְכְּלֵם לֶחֶם וָמָיִם
  english_pob_choice: and provided them with bread and water
  chosen_korean: 그들에게 빵과 물로 먹을 것을 대주었습니다
  alternatives_korean:
  - 그들에게 빵과 물을 공급했습니다
  - 그들을 빵과 물로 부양했습니다
  lexicon: HALOT
  rationale: כלה의 사역형은 단순히 ‘먹이다’보다 지속적으로 돌보고 공급한다는 뜻이 강하므로, 현대 한국어에서 자연스러운 ‘대주다’로 옮겼습니다. ‘빵과 물’은 본문의 최소한의 생존 공급을 보존합니다.
theological_decisions:
- issue: YHWH 고유명 렌더링
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 일반 호칭이 아니라 언약적 신명(神名)이므로, 프로젝트 기본값에 따라 ‘야훼’로 표기해 원문 고유성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
