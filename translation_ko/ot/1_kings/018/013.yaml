- from: 그것이 내 주인님께 알려지지 않았습니까? 내가 무슨 일을 했는지, 곧 이세벨이 야훼의 선지자들을 죽일 때—내가 야훼의 선지자들 가운데서 백 명을 숨겼고, 오십 명씩 각 동굴에 두었으며, 그들에게 빵과 물로 먹을 것을 대주었습니다?[a]
  to: 내 주인께서는 이세벨이 야훼의 선지자들을 죽일 때에 내가 한 일, 곧 내가 야훼의 선지자들 가운데서 백 명을 숨겨 한 동굴에 오십 명씩 두고[a] 그들에게 빵과 물을 공급한 일을 전해 들으시지 못했습니까?
  rationale: 수사 의문문의 전달 대상인 엘리야에게 자연스러운 존대를 적용하고, 히브리어의 ‘전해지다’라는 피동 의미를 ‘전해 들으시다’로 옮겼습니다. 백 명과 오십 명씩의 분배를 보존했으며, 동굴의 단수형이 낳는 배치상의 불확실성은 본문에서 과도하게 해소하지 않고 각주에 대안을 유지했습니다. 양육·공급의 뜻은 ‘빵과 물을 공급하다’로 충실하게 표현했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:50:55Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘내 주인님께 알려지지 않았습니까?’는 수동형 히브리어와 상대에 대한 존대의 결합을 한국어에서 다소 어색하게 처리하며, ‘두었으며’는 숨긴 행위와 분배 배치를 분명히 하되 문장 흐름을 다듬을 필요가 있습니다. אִישׁ의 인원 표현과 오십 명씩의 분배는 유지해야 합니다.
  naturalness: 현대 표준어 합쇼체에서는 ‘내 주인께서는 … 전해 들으시지 못했습니까?’가 더 자연스럽고 공손합니다. 원문의 긴 수사 의문문도 ‘…한 일을 말입니다’로 마무리하면 자연스럽게 재현됩니다. 각주 표지는 분배 구문 바로 뒤에 두는 편이 앵커 범위가 명확합니다.
  terminology: ‘야훼’는 제시된 프로젝트 방침과 일치합니다. 엘리야에게 쓰인 אֲדֹנִי는 신적 칭호가 아니므로 ‘내 주인’이 ‘내 주인님’보다 문어적이고 자연스러우며, 주체 존대는 ‘께서는/들으시지’로 표현합니다. ‘선지자’는 한국어 성경 문맥에서 통용되므로 유지할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘내 주인님께 알려지지 않았습니까?’의 존대 및 피동 표현
    rationale: לַאדֹנִי와 הֻגַּד는 ‘내 주인에게 전해지다’라는 뜻입니다. 한국어에서는 ‘내 주인께서는 … 전해 들으시지 못했습니까?’가 수신자 존대와 전달의 피동적 의미를 더 자연스럽게 드러냅니다.
  - severity: low
    issue: 각주 표지가 문장 끝의 물음표 뒤에 있음
    rationale: 각주는 ‘오십 명씩 한 동굴에’라는 분배 구문에 관한 것이므로, 해당 구문 직후에 표지를 두어 참조 범위를 명확히 해야 합니다.
  - severity: low
    issue: 분배 구문의 문체
    rationale: ‘오십 명씩 각 동굴에 두었으며’보다 ‘한 동굴에 오십 명씩 숨겨 두고’가 한국어 어순상 자연스럽고, 숨김과 동굴 배치를 함께 명확히 합니다.
