source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֵלִיָּ֗הוּ שְׁתֵּ֤ים עֶשְׂרֵה֙ אֲבָנִ֔ים כְּ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יַעֲקֹ֑ב אֲשֶׁר֩ הָיָ֨ה דְבַר יְהוָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר יִשְׂרָאֵ֖ל יִהְיֶ֥ה שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/031.yaml
  text: And Elijah took twelve stones[a], according to the number of the tribes of the sons of Jacob, to whom the word of Yahweh had come, saying[b], “Israel shall be your name.”
  footnotes:
  - marker: a
    text: Or, “the children of Jacob.” The Hebrew is literally “the sons of Jacob.”
    reason: lexical_alternative
  - marker: b
    text: 'This recalls God''s renaming of Jacob in Genesis 32:28; 35:10: “Israel shall be your name.”'
    reason: cross_reference
translation:
  language: ko
  text: 엘리야는 야곱의 아들들 지파 수대로 돌 열두 개를 가져왔습니다. 야훼의 말씀이 그에게 임하여 이르기를, 「이스라엘이 네 이름이 되리라」 하셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “야곱의 아들들”입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 창세기 32:28; 35:10의 야곱 개명 장면을 되돌아보게 합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 가져왔습니다
  alternatives_korean:
  - 취했습니다
  - 집어 들었습니다
  lexicon: HALOT
  rationale: 서사적 wayyiqtol לקח은 단순한 ‘취하다’보다 문맥상 필요한 대상을 옮겨 오는 동작이 드러나는 ‘가져오다’가 자연스럽습니다.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  english_pob_choice: twelve stones
  chosen_korean: 돌 열두 개
  alternatives_korean:
  - 열두 돌
  - 열두 개의 돌
  lexicon: HALOT
  rationale: 히브리어의 수사와 명사를 그대로 살리되 한국어 어순에 맞게 ‘돌 열두 개’로 옮겼습니다.
- source_word: בְנֵי יַעֲקֹב
  english_pob_choice: the sons of Jacob
  chosen_korean: 야곱의 아들들
  alternatives_korean:
  - 야곱의 자손들
  - 야곱의 자녀들
  lexicon: HALOT
  rationale: POB의 직역 취지를 따라 남성 복수 표현을 유지했고, 문맥상 지파 수와의 연결도 분명하게 했습니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 주님의 말씀
  lexicon: HALOT
  rationale: 전통적인 ‘여호와’ 대신 본 프로젝트 기본값인 ‘야훼’를 사용하고, דְבַר은 계시적 발화의 무게를 살려 ‘말씀’으로 옮겼습니다.
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  english_pob_choice: Israel shall be your name
  chosen_korean: 「이스라엘이 네 이름이 되리라」
  alternatives_korean:
  - 「네 이름이 이스라엘이 되리라」
  - 「이스라엘은 네 이름이 될 것이다」
  lexicon: HALOT
  rationale: 명명 선언의 강조점을 살려 히브리어 어순을 최대한 반영했고, 직접 인용 형태로 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접 발화와 회고적 인용의 처리
  chosen_reading: ‘야훼의 말씀이 그에게 임하여 이르기를’로 현재 서술과 과거 계시를 구분하고, 인용문 안에서 야곱의 이름 변경 선언을 직접 재현했습니다.
  alternative_readings:
  - ‘야훼의 말씀이 그에게 와서 말하기를’
  - ‘여호와의 말씀이 그에게 이르러 말하되’
  rationale: 본문은 야훼의 계시가 이미 임한 상태를 회고하며, 이어지는 인용은 창세기의 이름 변경을 환기합니다. 한국어에서도 이 계시적 연결을 분명히 드러내는 것이 중요합니다.
  doctrine_reference: Genesis 32:28; 35:10 intertext
