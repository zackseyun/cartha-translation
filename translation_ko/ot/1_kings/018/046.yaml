  text: וְ/יַד יְהוָ֗ה הָֽיְתָה֙ אֶל אֵ֣לִיָּ֔הוּ וַ/יְשַׁנֵּ֖ס מָתְנָ֑י/ו וַ/יָּ֨רָץ֙ לִ/פְנֵ֣י אַחְאָ֔ב עַד בֹּאֲ/כָ֖ה יִזְרְעֶֽאלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/046.yaml
  text: And the hand of Yahweh was on Elijah[b][a], and he tucked up his loins and ran ahead of Ahab as far as the entrance to Jezreel.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the hand of the LORD came upon Elijah.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'he girded up his loins,' that is, he gathered up his garment for running.
    reason: cultural_note
translation:
  language: ko
  text: 야훼의 손이 엘리야 위에 있었습니다. 그는 허리를 동이고 아합보다 앞서 이스르엘 어귀까지 달려갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “허리를 동였다”입니다. 달리기 위해 겉옷을 걷어 올리는 동작을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 전통적으로는 “여호와의 손이 엘리야 위에 임했다”로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה / יַד יְהוָה
  english_pob_choice: the hand of Yahweh was on
  chosen_korean: 야훼의 손이 … 위에 머물렀습니다
  alternatives_korean:
  - 야훼의 손이 … 위에 있었습니다
  - 야훼의 손이 … 위에 임했습니다
  - 야훼의 손이 … 위에 역사했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 접촉이 아니라 하나님의 능력과 영향 아래 있음(영감/강권)을 뜻하므로, 한국어로는 ‘손이 … 위에’의 구조를 살리되 자연스럽게 ‘머물렀습니다’로 옮겼습니다.
- source_word: וַיְשַׁנֵּס מָתְנָיו
  english_pob_choice: he tucked up his loins
  chosen_korean: 허리를 동이고
  alternatives_korean:
  - 옷자락을 걷어 올리고
  - 허리띠를 졸라매고
  - 허리를 가다듬고
  lexicon: HALOT
  rationale: 달리기 위해 옷을 걷어 올리는 동작을 가리키므로, 직역적이면서도 현대 한국어에서 이해되는 관용 표현인 ‘허리를 동이고’를 선택했습니다.
- source_word: וַיָּרָץ לִפְנֵי אַחְאָב
  english_pob_choice: ran ahead of Ahab
  chosen_korean: 아합보다 앞서 … 달려갔습니다
  alternatives_korean:
  - 아합 앞에서 달렸습니다
  - 아합 앞질러 달렸습니다
  - 아합 앞을 달렸습니다
  lexicon: HALOT
  rationale: לִפְנֵי는 단순한 시공간적 ‘앞’이므로, 서열이나 예식적 시종 의미를 덧붙이지 않는 ‘보다 앞서’로 옮겼습니다.
- source_word: עַד בֹּאֲכָה יִזְרְעֶאלָה
  english_pob_choice: as far as the entrance to Jezreel
  chosen_korean: 이스르엘 어귀까지
  alternatives_korean:
  - 이스르엘 입구까지
  - 이스르엘에 이르기까지
  - 이스르엘로 들어가는 곳까지
  lexicon: HALOT
  rationale: 지명 앞의 בֹּאֲכָה는 도착점/접근 지점을 가리키므로, 문맥에 맞게 ‘어귀’로 압축해 자연스럽게 표현했습니다.
theological_decisions:
- issue: 야훼의 손이 엘리야 위에 있었다는 표현의 신학적 강도
  chosen_reading: 하나님의 주도적 능력이 엘리야를 붙드셨다는 의미를 살리되, 그 효과를 초인적 속도인지 예언적 격동인지로 단정하지 않았습니다.
  alternative_readings:
  - 초자연적 힘을 주셔서 매우 빠르게 달렸다는 해석
  - 예언적 감동/촉구의 관용구로만 보는 해석
  rationale: 원문은 분명한 신적 개입을 말하지만, 그 방식의 세부는 특정하지 않으므로 긴장을 보존하는 번역이 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
