revisions:
- from: 야훼의 손이 엘리야 위에 머물렀습니다. 그래서 그는 허리를 동이고 아합보다 앞서 이스르엘 어귀까지 달려갔습니다.[a][b]
  to: 야훼의 손이 엘리야 위에 있었습니다. 그는 허리를 동이고 아합보다 앞서 이스르엘 어귀까지 달려갔습니다.[a][b]
  rationale: 원문의 상태 표현을 ‘있었습니다’로 바로 옮기고, 인과를 강화하는 접속사를 제거했습니다. 달리기 준비의 관용구, 아합 앞에서 달린 공간적 의미, 이스르엘의 접근 지점은 초안의 자연스러운 표현을 유지했습니다. 각주 표지는 각각 ‘허리를 동이고’와 ‘야훼의 손’에 모두 문장 끝에서 적용되며, 각주 b는 전통적 신명 표기에 맞추었습니다.
