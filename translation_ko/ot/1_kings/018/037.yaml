base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/037.yaml
  text: Answer me[a], O Yahweh, answer me, so that this people may know that you, O Yahweh, are God[b], and that you have turned their heart back.
  footnotes:
  - marker: a
    text: Or, 'that you, LORD, are the God.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their heart' (singular), a collective expression for the people as a whole; some translations render 'their hearts.'
    reason: lexical_alternative
translation:
  language: ko
  text: “응답하소서, 야훼여, 응답하소서. 이 백성으로 하여금 당신, 야훼께서 하나님이신 줄 알게 하시고, 당신께서 그들의 마음을 돌이키셨음을 알게 하소서.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 정관사 הָאֱלֹהִים는 이 문맥에서 ‘하나님’의 서술적/정체 확인으로도, ‘그 하나님’으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘마음’을 단수로 둔 히브리어는 백성 전체를 가리키는 집합적 표현입니다. 일부 번역은 ‘그들의 마음들’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנֵנִי
  english_pob_choice: Answer me
  chosen_korean: 응답하소서
  alternatives_korean:
  - 대답하소서
  - 응답해 주십시오
  lexicon: HALOT
  rationale: 엘리야의 기도문이므로 하나님께 드리는 직접 호소를 살려 존칭 청유형으로 옮겼습니다. '응답하소서'는 단순 정보 응답보다 행동으로 나타나는 신적 응답을 자연스럽게 담습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사역의 기준에 따라 신적 고유명사는 대체 칭호가 아니라 음역형 '야훼'로 일관해, 본문이 드러내는 하나님의 이름을 보존했습니다.
- source_word: הָעָם הַזֶּה
  english_pob_choice: this people
  chosen_korean: 이 백성
  alternatives_korean:
  - 이 ხალხ?
  - 이 사람들
  lexicon: HALOT
  rationale: 히브리어의 집합적 단수인 '이 백성'을 살려 공동체 전체를 한 덩어리로 지칭하는 뉘앙스를 유지했습니다.
- source_word: אֶת לִבָּם ... אֲחֹרַנִּית
  english_pob_choice: their heart ... back
  chosen_korean: 그들의 마음을 돌이키셨음을
  alternatives_korean:
  - 그들의 마음을 되돌리셨음을
  - 그들의 마음을 돌아오게 하셨음을
  lexicon: HALOT
  rationale: '''마음''은 Hebrew לֵב의 내적 중심을 자연스럽게 옮기며, ''돌이키셨음''은 Hiphil의 원인적 뉘앙스를 반영해 하나님이 그 회심/전환을 이루신다는 점을 드러냅니다.'
theological_decisions:
- issue: 하나님의 이름과 서술어의 결합
  chosen_reading: 당신, 야훼께서 하나님이신 줄 알게 하시고
  alternative_readings:
  - 당신, 야훼께서 그 하나님이신 줄 알게 하시고
  - 당신께서 야훼 하나님이신 줄 알게 하시고
  rationale: 히브리어의 정체 선언을 과도하게 풀지 않고, 예언자적 대결 맥락에서 야훼만이 참 하나님이심을 직접적으로 고백하게 했습니다.
  doctrine_reference: 원문이 말하는 고백의 대상과 배타성을 유지
