    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  english_pob_choice: And he said to him
  chosen_korean: 그가 그에게 말했습니다
  alternatives_korean:
  - 그리고 그가 그에게 말했습니다
  - 그러자 그가 그에게 말했습니다
  lexicon: HALOT
  rationale: 히브리어 이어짐을 자연스럽게 살리되, 서술 흐름을 해치지 않도록 한국어에서는 담백한 과거형으로 옮겼습니다.
- source_word: אָ֑נִי
  english_pob_choice: I am he
  chosen_korean: 제가 그 사람입니다
  alternatives_korean:
  - 저입니다
  - 제가 바로 그입니다
  lexicon: HALOT
  rationale: 히브리어의 강조된 1인칭 대명사는 단순한 ‘저입니다’보다 자기 식별을 분명히 드러내는 표현이 적절합니다. 동시에 한국어에서 어색하지 않도록 ‘그 사람’으로 지시 대상을 보완했습니다.
- source_word: לַאדֹנֶיךָ
  english_pob_choice: to your master
  chosen_korean: 네 주인에게
  alternatives_korean:
  - 네 주인에게
  - 네 상전에게
  lexicon: HALOT
  rationale: 여기서는 인간 상사인 아합을 가리키므로, 하나님의 호칭 ‘주님’과 구별되는 ‘주인’을 택했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자
  lexicon: HALOT
  rationale: 청자를 향해 주의를 끄는 감각을 한국어에서 가장 자연스럽게 살리는 표현으로 옮겼습니다.
- source_word: אֵלִיָּהוּ
  english_pob_choice: Elijah
  chosen_korean: 엘리야
  alternatives_korean:
  - 일리야
  - 엘리야후
  lexicon: HALOT
  rationale: 성경 인명은 한국어에서 널리 쓰이는 표기인 ‘엘리야’를 따랐습니다.
theological_decisions:
- issue: אָדוֹן의 인간 지칭과 신적 호칭 구별
  chosen_reading: 네 주인
  alternative_readings:
  - 네 주님
  - 네 상전
  rationale: 이 구절의 אָדוֹן은 아합이라는 인간 권위를 뜻하므로, 신적 호칭으로 읽히는 ‘주님’을 피하고 관계를 분명히 드러내는 ‘주인’을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: titles should reflect referent; preserve divine/human distinction'
