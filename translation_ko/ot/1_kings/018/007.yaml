base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/007.yaml
  text: As Obadiah was on the way, behold, Elijah came to meet him. When he recognized him, he fell on his face and said, “Is that you, my lord Elijah?”
translation:
  language: ko
  text: 오바댜가 길 위에 있을 때, 보라, 엘리야가 그를 만나러 왔습니다. 그가 엘리야를 알아보고 얼굴을 땅에 대고 엎드려 말했습니다. “나의 주 엘리야님이십니까?”
  philosophy: formal
lexical_decisions:
- source_word: בַּדֶּרֶךְ
  english_pob_choice: on the way
  chosen_korean: 길 위에
  alternatives_korean:
  - 가는 길에
  - 도중에
  lexicon: דרך
  rationale: 이동 중임을 자연스럽게 살리되, 서술의 흐름을 간결하게 유지했습니다.
- source_word: לִקְרָאתוֹ
  english_pob_choice: came to meet him
  chosen_korean: 그를 만나러 왔습니다
  alternatives_korean:
  - 그를 맞으러 왔습니다
  - 그를 향해 왔습니다
  lexicon: פגש/לקראת
  rationale: 단순히 ‘우연히 만났다’보다 ‘맞으러/만나러 오다’의 방향성을 살려 POB의 의미 선택을 반영했습니다.
- source_word: וַיַּכִּרֵהוּ
  english_pob_choice: recognized him
  chosen_korean: 그를 알아보고
  alternatives_korean:
  - 그를 알아채고
  - 그를 알아보자
  lexicon: נכר
  rationale: 인식·식별의 즉각적 반응을 자연스러운 한국어 동작 부사형으로 옮겼습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 나의 주
  alternatives_korean:
  - 내 주
  - 주인님
  lexicon: אדון
  rationale: 엘리야에 대한 공손한 호칭으로서의 ‘주’를 살리되, 현대 한국어에서 지나치게 왕복적인 어감을 피했습니다.
theological_decisions:
- issue: 엘리야에 대한 호칭의 위계와 공손성
  chosen_reading: “나의 주 엘리야님이십니까?”로 옮겨, 존칭과 충격 섞인 확인 질문의 뉘앙스를 함께 살렸습니다.
  alternative_readings:
  - “내 주 엘리야입니까?”
  - “엘리야 선지자님이십니까?”
  rationale: 본문은 예언자 엘리야를 향한 극존칭보다, 놀라움 속에 예를 갖춘 호칭을 보여 줍니다. 한국어에서는 종결 어미와 호칭을 함께 조정하는 편이 원문 화행을 더 잘 전달합니다.
  doctrine_reference: 서사 본문에서 인물 간 위계와 경외의 표현을 과도하게 신학화하지 않고 문맥대로 옮김
