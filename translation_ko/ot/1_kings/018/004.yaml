source:
  edition: WLC
  text: וַ/יְהִי֙ בְּ/הַכְרִ֣ית אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וַ/יִּקַּ֨ח עֹבַדְיָ֜הוּ מֵאָ֣ה נְבִאִ֗ים וַֽ/יַּחְבִּיאֵ֞/ם חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וְ/כִלְכְּלָ֖/ם לֶ֥חֶם וָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/004.yaml
  text: Now when Jezebel was cutting off the prophets of Yahweh[a], Obadiah took a hundred prophets and hid them, fifty men to a cave[b], and provided them with bread and water.
  footnotes:
  - marker: a
    text: Or 'was destroying' or more literally 'was cutting off' the prophets of the LORD.
    reason: lexical_alternative
  - marker: b
    text: Literally 'fifty men in a cave'; the Hebrew likely means he hid them in groups of fifty, apparently in separate caves.
    reason: lexical_alternative
translation:
  language: ko
  text: 이세벨이 야훼의 예언자들을 죽이고[a] 있을 때, 오바댜는 예언자 백 명을 데려다가 그들을 쉰 명씩 동굴에[b] 숨겨 두고 빵과 물을 공급했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘잘라 내다’ 또는 ‘끊어 없애다’라는 뜻이며, 여기서는 예언자들을 죽여 제거하는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘쉰 명의 남자들, 한 동굴에’입니다. 쉰 명씩 여러 동굴에 나누어 숨겼다는 뜻으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהַכְרִית / וַיְהִי בְּ
  english_pob_choice: Now when ... was cutting off
  chosen_korean: ~하고 있을 때에
  alternatives_korean:
  - ~할 때
  - ~을 멸하고 있을 때에
  - ~을 죽여 없애고 있을 때에
  lexicon: HALOT
  rationale: וַיְהִי בְּ + infinitive construct는 사건의 배경 시점을 여는 표현이라 ‘~하고 있을 때에’로 자연스럽게 살렸고, כרת의 강한 ‘끊어 없애다/도려내다’ 이미지는 ‘죽여 없애다’로 반영했습니다.
