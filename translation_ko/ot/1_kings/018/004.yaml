  english_pob_choice: the prophets of Yahweh
  chosen_korean: 야훼의 선지자들
  alternatives_korean:
  - 야훼의 예언자들
  - 여호와의 선지자들
  lexicon: HALOT
  rationale: 예언 행위보다 야훼에게 속한 신분이 강조되므로 ‘선지자들’이 본문 기능을 잘 드러내며, 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  english_pob_choice: fifty men to a cave
  chosen_korean: 쉰 명씩 한 굴에
  alternatives_korean:
  - 쉰 명씩 한 동굴에
  - 한 굴에 쉰 명씩
  - 굴마다 쉰 명씩
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘쉰 명의 남자들, 한 굴에’에 가깝지만 분배적 의미가 분명하므로 ‘쉰 명씩 한 굴에’로 옮겨 분산 수용의 뉘앙스를 살렸습니다.
- source_word: וְכִלְכְּלָם
  english_pob_choice: provided them with
  chosen_korean: 공급했습니다
  alternatives_korean:
  - 부양했습니다
  - 먹여 살렸습니다
  - 보살폈습니다
  lexicon: HALOT
  rationale: כול/כלכל의 지속적 부양 의미를 살리면서 빵과 물 뒤에 오는 결과에 맞게 ‘공급했습니다’로 번역해 단순 급식보다 넓은 돌봄을 드러냈습니다.
