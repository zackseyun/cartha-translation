  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִי֙ בְּ/הַכְרִ֣ית אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וַ/יִּקַּ֨ח עֹבַדְיָ֜הוּ מֵאָ֣ה נְבִאִ֗ים וַֽ/יַּחְבִּיאֵ֞/ם חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וְ/כִלְכְּלָ֖/ם לֶ֥חֶם וָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/004.yaml
  text: Now when Jezebel was cutting off the prophets of Yahweh[a], Obadiah took a hundred prophets and hid them, fifty men to a cave[b], and provided them with bread and water.
  footnotes:
  - marker: a
    text: Or 'was destroying' or more literally 'was cutting off' the prophets of the LORD.
    reason: lexical_alternative
  - marker: b
    text: Literally 'fifty men in a cave'; the Hebrew likely means he hid them in groups of fifty, apparently in separate caves.
    reason: lexical_alternative
translation:
  language: ko
  text: 이세벨이 야훼의 선지자들을 죽여 없애고 있을 때에 오바디야는 선지자 백 명을 데려다가, 쉰 명씩 한 굴에 숨겨 두고 그들에게 빵과 물을 공급했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죽여 없애고’는 히브리어 כרת의 문자적 이미지인 ‘잘라 내다/끊어 없애다’를 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘쉰 명의 남자들, 한 굴에’이며, 아마 여러 굴에 나눠 숨겼다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהַכְרִית / וַיְהִי בְּ
  english_pob_choice: Now when ... was cutting off
  chosen_korean: ~하고 있을 때에
  alternatives_korean:
  - ~할 때
  - ~을 멸하고 있을 때에
  - ~을 죽여 없애고 있을 때에
  lexicon: HALOT
  rationale: וַיְהִי בְּ + infinitive construct는 사건의 배경 시점을 여는 표현이라 ‘~하고 있을 때에’로 자연스럽게 살렸고, כרת의 강한 ‘끊어 없애다/도려내다’ 이미지는 ‘죽여 없애다’로 반영했습니다.
- source_word: נְבִיאֵי יְהוָה
  english_pob_choice: the prophets of Yahweh
  chosen_korean: 야훼의 선지자들
  alternatives_korean:
  - 야훼의 예언자들
  - 여호와의 선지자들
  lexicon: HALOT
  rationale: 예언 행위보다 야훼에게 속한 신분이 강조되므로 ‘선지자들’이 본문 기능을 잘 드러내며, 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  english_pob_choice: fifty men to a cave
  chosen_korean: 쉰 명씩 한 굴에
  alternatives_korean:
  - 쉰 명씩 한 동굴에
  - 한 굴에 쉰 명씩
  - 굴마다 쉰 명씩
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘쉰 명의 남자들, 한 굴에’에 가깝지만 분배적 의미가 분명하므로 ‘쉰 명씩 한 굴에’로 옮겨 분산 수용의 뉘앙스를 살렸습니다.
- source_word: וְכִלְכְּלָם
  english_pob_choice: provided them with
  chosen_korean: 공급했습니다
  alternatives_korean:
  - 부양했습니다
  - 먹여 살렸습니다
  - 보살폈습니다
  lexicon: HALOT
  rationale: כול/כלכל의 지속적 부양 의미를 살리면서 빵과 물 뒤에 오는 결과에 맞게 ‘공급했습니다’로 번역해 단순 급식보다 넓은 돌봄을 드러냈습니다.
theological_decisions:
- issue: YHWH rendering in an OT narrative verse
  chosen_reading: 고유 신명은 본문에서 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 히브리어 본문이 여호와 신명을 직접 사용하므로, 프로젝트 기본 원칙에 따라 고유한 언약 이름을 보존했습니다.
  doctrine_reference: Contested terms — יְהוָה/YHWH → 야훼
