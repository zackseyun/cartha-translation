  text: And Elijah said to Ahab[a], “Go up, eat and drink, for there is the sound of the abundance of rain.”
  footnotes:
  - marker: a
    text: Or, more formally, 'for the sound of the roar of the rain.' The Hebrew phrase קול המון הגשם is compact and vivid; the main text renders it idiomatically as a coming great rainstorm.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 엘리야가 아합에게 말했습니다. “올라가서 먹고 마시십시오. 큰비가 쏟아지는 소리가 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘비의 요란함/풍성함의 소리’입니다. 히브리어는 요란한 비의 소리와 많은 비라는 뉘앙스를 함께 지닌 압축된 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַחְאָב
  english_pob_choice: to Ahab
  chosen_korean: 아합에게
  alternatives_korean:
