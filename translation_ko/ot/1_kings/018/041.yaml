  - 식사하고 마시십시오
  lexicon: HALOT
  rationale: 직접 명령형의 뜻을 살리되, 현대 한국어 합쇼체에 맞게 ‘먹고 마시십시오’로 옮겼습니다.
- source_word: קוֹל הֲמוֹן הַגָּשֶׁם
  english_pob_choice: the sound of the abundance of rain
  chosen_korean: 비가 쏟아질 소리
  alternatives_korean:
  - 폭우의 소리
  - 비가 몰려오는 소리
  - 비의 요란한 소리
  lexicon: HALOT
  rationale: קול(소리)과 הֲמוֹן(요란한 몰림/풍성함), 그리고 גשם(비)의 압축된 표현을 한국어 자연문으로 풀어, 임박한 큰비의 기세를 드러냈습니다.
theological_decisions:
- issue: 예언적 음성의 직접 화법 등록
  chosen_reading: 엘리야의 명령과 이유를 그대로 살려, 예언자의 확신 어린 선언으로 읽히게 했습니다.
  alternative_readings:
  - 단순 정보 전달로 완화
  - 미래형으로 완곡하게 처리
  rationale: 본문은 단순한 예고가 아니라 즉각적 행동을 요구하는 예언적 명령과 근거 제시의 결합이므로, 명령조를 유지하는 것이 원문의 힘을 보존합니다.
  doctrine_reference: 예언자적 발화의 권위와 하나님의 행위에 대한 선포
- issue: ‘비가 쏟아질 소리’의 표현 강도
  chosen_reading: 직역적 ‘풍성한 비’보다 결과적 의미를 살려 ‘비가 쏟아질 소리’로 옮겼습니다.
  alternative_readings:
  - 비의 풍성한 소리
  - 비의 소리
  rationale: 히브리어의 압축된 이미지가 단순한 청각 정보가 아니라 다가오는 폭우의 현장감을 전달하므로, 문맥상 허용되는 범위에서 그 생동감을 드러냈습니다.
  doctrine_reference: 시적·예언적 언어의 이미지 보존
