  - 아합을 향해
  lexicon: HALOT
  rationale: 히브리어 לְ는 말의 상대를 표시하므로, 한국어에서는 여격 조사 ‘-에게’로 자연스럽게 옮겼습니다.
- source_word: עֲלֵה
  english_pob_choice: Go up
  chosen_korean: 올라가서
  alternatives_korean:
