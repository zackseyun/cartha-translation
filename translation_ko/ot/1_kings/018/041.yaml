  lexicon: HALOT
  rationale: עלה의 기본 동작 이미지를 살려 ‘올라가서’로 옮겼고, 이어지는 동사들과 연결되도록 자연스럽게 처리했습니다.
- source_word: אֱכֹל וּשְׁתֵה
  english_pob_choice: eat and drink
  chosen_korean: 먹고 마시십시오
  alternatives_korean:
