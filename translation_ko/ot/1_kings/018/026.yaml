base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/026.yaml
  text: So they took the bull that had been given to them[a], prepared it, and called on the name of Baal from morning until noon, saying, “O Baal, answer us!” But there was no voice, and no one answered. And they limped around the altar that had been made.
  footnotes:
  - marker: a
    text: Or “they danced around” or “they leaped around the altar.” The Hebrew verb likely denotes a limping or hopping ritual movement and may intentionally echo Elijah’s later use of the same root in verse 21.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그들에게 주어진 송아지를 가져다가 준비하고, 아침부터 정오까지 바알의 이름을 불러 “오 바알이여, 우리에게 응답하소서!”라고 하였지만, 소리도 없고 응답하는 이도 없었습니다. 그들은 또 그들이 만든 제단 주위를 절뚝거리며 돌았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제단 주위를 춤추었습니다”, “제단 주위를 뛰어올랐습니다.” 히브리어 동사는 절뚝이거나 깡충거리는 제의적 움직임을 가리킬 가능성이 있으며, 21절의 같은 어근과의 말장난을 의도적으로 울릴 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ אֶת הַפָּר
  english_pob_choice: they took the bull
  chosen_korean: 송아지를 가져다가
  alternatives_korean:
  - 황소를 가져다가
  - 수소를 가져다가
  lexicon: HALOT
  rationale: פָּר는 제의 맥락에서 소 제물로 쓰이는 어린 수소를 가리킬 수 있어, 한국어로는 자연스럽게 ‘송아지’로 풀었습니다.
- source_word: וַיַּעֲשׂוּ
  english_pob_choice: prepared it
  chosen_korean: 준비하고
  alternatives_korean:
  - 만들고
  - 드리고
  lexicon: HALOT
  rationale: 여기서는 제물을 실제로 바치는 동작보다 제의 절차에 맞게 갖추는 의미가 강하므로, 과도한 해석을 피하고 ‘준비하고’로 옮겼습니다.
- source_word: וַיִּקְרְאוּ בְשֵׁם הַבַּעַל
  english_pob_choice: called on the name of Baal
  chosen_korean: 바알의 이름을 불러
  alternatives_korean:
  - 바알의 이름으로 불러
  - 바알을 불러
  lexicon: HALOT
  rationale: קרא בשם의 관용구를 살리기 위해 직역에 가깝게 옮겼고, 우상 숭배의 제의적 호출이라는 점도 드러나게 했습니다.
- source_word: וַיְפַסְּחוּ עַל הַמִּזְבֵּחַ
  english_pob_choice: they limped around the altar
  chosen_korean: 절뚝거리며 돌았습니다
  alternatives_korean:
  - 절뚝거리며 제단 주위를 돌았습니다
  - 뛰어다녔습니다
  lexicon: HALOT
  rationale: פּסח의 모호한 동작을 ‘절뚝거리며’로 살려, 본문의 조롱 섞인 리듬과 21절의 말장난 가능성을 유지했습니다.
theological_decisions:
- issue: 바알 호칭의 문체
  chosen_reading: “오 바알이여, 우리에게 응답하소서!”
  alternative_readings:
  - “바알이여, 우리에게 응답하소서!”
  - “오 바알, 우리에게 응답하소서!”
  rationale: 호소문의 제의적이고 직접적인 뉘앙스를 살리되, 한국어 독자가 자연스럽게 읽을 수 있도록 감탄형 호격을 사용했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 우상 숭배 장면의 묘사
  chosen_reading: 소리도 없고 응답하는 이도 없었습니다
  alternative_readings:
  - 소리도 없고 대답하는 자도 없었습니다
  - 아무 소리도, 아무 응답도 없었습니다
  rationale: ביןאין קוֹל וְאֵין עֹנֶה의 두 겹 부정을 유지해 바알의 무능을 서술적으로 분명하게 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §5
