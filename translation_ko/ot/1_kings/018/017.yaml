base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/017.yaml
  text: And when Ahab saw Elijah[a], Ahab said to him, “Is that you, troubler of Israel?”
  footnotes:
  - marker: a
    text: Or 'one who brings trouble on Israel' or 'one who brings disaster on Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아합이 엘리야를 보았을 때, 아합이 그에게 말했습니다. “너야말로 이스라엘을 어지럽히는 자냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘에 trouble/disaster를 가져오는 자’라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  english_pob_choice: And when ... saw
  chosen_korean: “...을 보았을 때”
  alternatives_korean:
  - “...을 보자마자”
  - “...을 보았을 때에”
  lexicon: HALOT
  rationale: 서사 도입의 시간적 상황을 한국어에서 자연스럽게 살리되, 지나치게 관용적으로 확장하지 않도록 ‘보았을 때’로 옮겼습니다.
- source_word: אֵלִיָּהוּ
  english_pob_choice: Elijah
  chosen_korean: 엘리야
  alternatives_korean:
  - 엘리야후
  - 일라이저
  lexicon: 고유명사 표기 관행
  rationale: 성경에서 통용되는 한국어 인명 형태를 따랐습니다.
- source_word: הַאַתָּה זֶה
  english_pob_choice: Is that you
  chosen_korean: “너야말로 …냐?”
  alternatives_korean:
  - “그대가 바로 …냐?”
  - “정말 네가 …냐?”
  lexicon: HALOT
  rationale: 히브리어의 지시적·도전적 뉘앙스를 살려, 단순한 확인 질문보다 대면하는 듯한 표현으로 옮겼습니다.
- source_word: עֹכֵר
  english_pob_choice: troubler
  chosen_korean: 어지럽히는 자
  alternatives_korean:
  - 소란을 일으키는 자
  - 재앙을 가져오는 자
  - 괴롭게 하는 자
  lexicon: HALOT
  rationale: ‘עכר’의 핵심 의미인 혼란·재앙 초래의 뉘앙스를 담되, 한국어에서 지나치게 해석된 ‘재앙을 가져오는 자’보다 문맥상 직접적인 ‘어지럽히는 자’를 택했습니다.
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 이스라엘 백성
  - 야곱
  lexicon: 고유명사 표기 관행
  rationale: 민족/국가명으로서의 표준 음역을 따랐습니다.
theological_decisions:
- issue: 아합의 고발 어조 보존
  chosen_reading: 아합의 말을 직접적인 비난으로 유지했습니다.
  alternative_readings:
  - 완곡한 질문형으로 순화
  - ‘이스라엘의 재앙’으로 도덕화
  rationale: 본문은 엘리야를 이스라엘의 혼란 원인으로 지목하는 아합의 공격을 드러내므로, 그 긴장과 적대감을 약화시키지 않았습니다.
  doctrine_reference: 본문의 화용적 힘을 유지하고, 아합의 잘못된 판단을 교정하지 않은 채 제시
