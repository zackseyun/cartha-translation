reference: 1 Kings 18:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חַ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אִם יֶשׁ גּ֤וֹי וּ/מַמְלָכָה֙ אֲ֠שֶׁר לֹֽא שָׁלַ֨ח אֲדֹנִ֥/י שָׁם֙ לְ/בַקֶּשְׁ/ךָ֔ וְ/אָמְר֖וּ אָ֑יִן וְ/הִשְׁבִּ֤יעַ אֶת הַ/מַּמְלָכָה֙ וְ/אֶת הַ/גּ֔וֹי כִּ֖י לֹ֥א יִמְצָאֶֽ/כָּה׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/010.yaml
  text: As Yahweh your God lives, there is no nation or kingdom where my lord has not sent to seek you. When they said, ‘He is not here,’ he made the kingdom and the nation swear that they could not find you.
translation:
  language: ko
  text: “당신의 하나님 야훼께서 살아 계심을 두고 맹세합니다. 제 주인이 당신을 찾으려고 사람을 보내지 않은 나라나 왕국은 하나도 없습니다. 그들이 ‘그는 그곳에 없습니다’라고 말할 때마다, 제 주인은 그 왕국과 나라로 하여금 당신을 찾지 못했다고 맹세하게 했습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘야훼께서 살아 계심을 두고’는 엄숙한 맹세를 시작하는 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  english_pob_choice: As Yahweh your God lives
  chosen_korean: “야훼, 당신의 하나님이 살아 계심을 두고 맹세합니다”
  alternatives_korean:
  - “야훼, 당신의 하나님이 살아 계십니다”
  - “당신의 하나님 야훼의 삶을 두고 맹세합니다”
  lexicon: HALOT
  rationale: 히브리어는 맹세 서두의 관용구로, 단순 진술보다 서약의 힘이 중요합니다. ‘살아 계심을 두고 맹세합니다’가 한국어에서 자연스럽게 그 맹세 기능을 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문서의 기본 기준에 따라 신성명을 제목화하지 않고 ‘야훼’로 옮겨 인명적 고유성을 보존합니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 제 주인
  alternatives_korean:
  - 제 주님
  - 제 상전
  lexicon: HALOT
  rationale: 이 장면에서 발화자는 왕을 높여 부르고 있으므로, 예수/하나님 호칭으로 오해될 수 있는 ‘주님’보다 문맥적으로 중립적인 ‘제 주인’이 적합합니다.
- source_word: אִם יֶשׁ גּוֹי וּמַמְלָכָה אֲשֶׁר לֹא
  english_pob_choice: there is no nation or kingdom where ... not
  chosen_korean: 나라나 왕국은 하나도 없습니다
  alternatives_korean:
  - 어느 나라나 왕국에도 없습니다
  - 나라와 왕국 중 찾지 않은 곳은 없습니다
  lexicon: HALOT
  rationale: 서약 문맥의 אִם는 조건문보다 강한 부정적 총괄을 나타내므로, ‘하나도 없습니다’로 옮겨 Ahab의 광범위한 수색을 분명히 합니다.
- source_word: וְאָמְרוּ אָיִן
  english_pob_choice: When they said, ‘He is not here,’
  chosen_korean: 그들이 ‘그는 여기 없습니다’라고 말하면
  alternatives_korean:
  - 그들이 ‘없습니다’라고 말하면
  - 그들이 ‘그는 없다’라고 말하면
  lexicon: HALOT
  rationale: אָיִן의 뜻을 한국어 대화체로 풀어, 누락된 대상이 엘리야임을 문맥상 자연스럽게 드러냅니다.
- source_word: וְהִשְׁבִּיעַ
  english_pob_choice: he made ... swear
  chosen_korean: 맹세하게 했습니다
  alternatives_korean:
  - 맹세시켰습니다
  - 맹세를 시켰습니다
  lexicon: HALOT
  rationale: 히필의 사역 의미를 현대 한국어에서 간결하게 살리되, 강제적 서약 부과라는 힘을 유지합니다.
- source_word: כִּי לֹא יִמְצָאֶךָ
  english_pob_choice: that they could not find you
  chosen_korean: 당신을 찾지 못할 것이라고
  alternatives_korean:
  - 당신을 찾지 못한다고
  - 당신을 찾을 수 없다고
  lexicon: HALOT
  rationale: 서약의 내용으로서 결과적 불능을 나타내므로, ‘찾지 못할 것’이 가장 자연스럽고 서사 흐름에도 맞습니다.
theological_decisions:
- issue: 야훼 신성명과 oath formula의 처리
  chosen_reading: 맹세 서두는 ‘야훼, 당신의 하나님이 살아 계심을 두고 맹세합니다’로 옮겨, 신성명의 고유성과 서약의 긴박감을 함께 살렸습니다.
  alternative_readings:
  - ‘당신의 하나님 야훼는 살아 계십니다’
  - ‘야훼, 당신의 하나님이 살아 계심으로 맹세합니다’
  rationale: 본문은 단순 선언이 아니라 맹세 발화입니다. 신성명을 ‘주’로 대체하면 고유명이 사라지므로, 본문이 요구하는 직접성을 유지해야 합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
