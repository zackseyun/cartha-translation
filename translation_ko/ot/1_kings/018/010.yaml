  to: “당신의 하나님 야훼께서 살아 계심을 두고 맹세합니다. 제 주인이 당신을 찾으려고 사람을 보내지 않은 나라나 왕국은 하나도 없습니다. 그들이 ‘그는 그곳에 없습니다’라고 말할 때마다, 제 주인은 그 왕국과 나라로 하여금 당신을 찾지 못했다고 맹세하게 했습니다.”[a]
