base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/024.yaml
  text: Then call on the name of your god[a], and I will call on the name of Yahweh; and the God who answers by fire, he is God." And all the people answered and said[b], "The word is good.
  footnotes:
  - marker: a
    text: Or, 'your gods,' if אֱלֹהֵיכֶם is taken as a true plural rather than a singular reference to the deity represented in the contest.
    reason: lexical_alternative
  - marker: b
    text: Or, 'The proposal is good' or 'The thing is good.' Hebrew דָּבָר can mean 'word,' 'matter,' or 'proposal.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 너희 신[a]의 이름을 부르십시오. 나는 야훼의 이름을 부르겠습니다. 그러면 불로 응답하는 신, 그가 하나님이십니다.” 그러자 온 백성이 대답하여 말했습니다. “그 말[b]이 좋습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 신들’로도 옮길 수 있습니다. אֱלֹהֵיכֶם의 형태만 보면 복수 해석이 가능하지만, 이 대결 문맥에서는 각 진영이 자기 편의 신을 대표로 부르는 것으로 읽는 편이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 제안이 좋습니다’ 혹은 ‘그 일이 좋습니다’로도 옮길 수 있습니다. 히브리어 דָּבָר는 ‘말’, ‘일’, ‘제안’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם בְּשֵׁם
  english_pob_choice: call on the name of
  chosen_korean: 이름으로 부르짖으십시오
  alternatives_korean:
  - 이름을 불러 기도하십시오
  - 이름을 부르십시오
  lexicon: HALOT
  rationale: קרא + בְּשֵׁם은 신적 호명/호소의 관용구이므로, 문맥상 ‘부르짖다’로 옮겨 예배적·대결적 긴장을 살렸습니다.
- source_word: אֱלֹהֵיכֶם
  english_pob_choice: your god
  chosen_korean: 너희 신
  alternatives_korean:
  - 너희 하나님
  - 너희들의 신들
  lexicon: HALOT
  rationale: 이 문맥에서는 바알 제사장들이 부르는 대상을 가리키므로, 한국어에서는 단수 의미를 살린 ‘너희 신’이 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 언약 이름 יהוה는 본문 발음형을 드러내는 ‘야훼’로 옮겨, 직함 대체가 아니라 고유한 신명임을 보존했습니다.
- source_word: הַדָּבָר
  english_pob_choice: The word is good
  chosen_korean: 그 말이 좋습니다
  alternatives_korean:
  - 그 일이 좋습니다
  - 그 제안이 좋습니다
  lexicon: HALOT
  rationale: דָּבָר는 이곳에서 엘리야의 제안을 가리키지만, POB의 ‘The word is good’에 맞춰 ‘그 말’로 옮겨 발화 자체에 대한 동의를 드러냈습니다.
theological_decisions:
- issue: 하나님 호칭의 대결 구도
  chosen_reading: 불로 응답하는 그 신이 바로 하나님이십니다
  alternative_readings:
  - 불로 응답하는 그가 하나님이십니다
  - 불로 응답하는 그 신이 참 하나님입니다
  rationale: 히브리어의 판정문 구조를 따라, 응답하는 신/하나님을 판가름하는 엘리야의 논지를 분명하게 살렸습니다.
  doctrine_reference: 1 Kings 18:24의 서사적 신정 논증
- issue: 직접화법의 한국어 높임법
  chosen_reading: 너희는... 부르짖으십시오 / 나는 ... 부르짖겠습니다
  alternative_readings:
  - 너희는 ... 부르짖어라 / 나는 ... 부르짖겠다
  rationale: 본문이 대결 장면의 직접 발화를 전하므로, 표준 문어 합쇼체를 유지하되 인용문 안에서는 자연스러운 구어적 명령형으로 처리했습니다.
  doctrine_reference: Korean target style guidelines
