source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ לָ/הֶ֜ם תִּפְשׂ֣וּ אֶת נְבִיאֵ֣י הַ/בַּ֗עַל אִ֛ישׁ אַל יִמָּלֵ֥ט מֵ/הֶ֖ם וַֽ/יִּתְפְּשׂ֑וּ/ם וַ/יּוֹרִדֵ֤/ם אֵלִיָּ֨הוּ֙ אֶל נַ֣חַל קִישׁ֔וֹן וַ/יִּשְׁחָטֵ֖/ם שָֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/040.yaml
  text: Then Elijah said to them[a], “Seize the prophets of Baal; let not one of them escape.” And they seized them[b], and Elijah brought them down to the Kishon Wadi and slaughtered them there.
  footnotes:
  - marker: a
    text: 'Or “let no one escape.” Hebrew: “let not a man escape.”'
    reason: lexical_alternative
  - marker: b
    text: Or “the Kishon Brook.” Hebrew naḥal can refer to a wadi, streambed, or brook.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 엘리야가 그들에게 말했습니다. 「바알의 예언자들을 붙잡으십시오. 그들 가운데 한 사람도 도망치지 못하게 하십시오.」 그들이 그들을 붙잡았고, 엘리야는 그들을 키손 골짜기[a]로 내려가게 하여 거기서 그들을 살육했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘키손 와디’ 또는 ‘키손 시내’. 히브리어 나할은 와디, 시내, 하상 또는 골짜기 같은 지형을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּ / וַיִּתְפְּשׂוּם
  english_pob_choice: Seize / they seized them
  chosen_korean: 붙잡으십시오 / 붙잡자
  alternatives_korean:
  - 잡으십시오 / 잡자
  - 체포하십시오 / 체포하자
  lexicon: HALOT
  rationale: תפשׂ는 강하게 붙들어 제압하는 뉘앙스가 있어, 법적 ‘체포’보다 직접적인 ‘붙잡다’가 본문의 급박한 명령과 서술을 잘 살립니다.
- source_word: נְבִיאֵי הַבַּעַל
  english_pob_choice: the prophets of Baal
  chosen_korean: 바알의 예언자들
  alternatives_korean:
  - 바알의 선지자들
  - 바알 예언자들
  lexicon: HALOT
  rationale: 히브리어 소유격 구성을 자연스럽게 살리면서도, 한국어에서 ‘예언자’가 본문의 종교적 직함을 가장 직접적으로 드러냅니다.
- source_word: אִישׁ אַל יִמָּלֵט מֵהֶם
  english_pob_choice: let not one of them escape
  chosen_korean: 그들 가운데 한 사람도 도망치지 못하게 하십시오
  alternatives_korean:
  - 한 사람도 도망하지 못하게 하십시오
  - 그들 중 아무도 빠져나가지 못하게 하십시오
  lexicon: HALOT
  rationale: 히브리어는 אישׁ와 복수 대명사 מֵהֶם을 함께 써서 ‘그들 가운데 한 사람도’라는 분배적 의미를 강하게 만들며, 이를 한국어로 자연스럽고 정확하게 옮겼습니다.
- source_word: נַחַל קִישׁוֹן
  english_pob_choice: the Kishon Wadi
  chosen_korean: 키손 골짜기
  alternatives_korean:
  - 키손 와디
  - 키손 시내
  lexicon: HALOT
  rationale: נַחַל은 마른 하천바닥까지 포함하는 지형 용어라 ‘골짜기’가 한국어 독자에게 가장 무리 없이 그 지형성을 전달합니다.
- source_word: וַיִּשְׁחָטֵם
  english_pob_choice: slaughtered them
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 도살했습니다
  - 도륙했습니다
  - 학살했습니다
  lexicon: HALOT
  rationale: שׁחט의 강한 살해 의미는 분명하지만, 한국어 ‘도살’은 사람 대상에서 지나치게 비유적이고 ‘학살’은 과잉 해석적이어서, 서술의 직접성을 살리는 ‘죽였습니다’를 택했습니다.
theological_decisions:
- issue: 본문의 폭력적 행위를 어떻게 전달할지
  chosen_reading: 폭력을 완화하거나 정당화 문구를 덧붙이지 않고, 서술된 행위를 있는 그대로 옮겼습니다.
  alternative_readings:
  - ‘처형했습니다’처럼 법적·완곡한 표현 사용
  - 본문 안에 하나님의 승인 의미를 명시적으로 삽입
  rationale: 이 절은 엘리야의 명령과 그 실행을 간결하게 서술할 뿐이므로, 본문이 말하지 않는 평가를 덧붙이지 않고 강도를 유지하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: '번역 원리: 원문 우선, 해석적 완곡어법 최소화'
