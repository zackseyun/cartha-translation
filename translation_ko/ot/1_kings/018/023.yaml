base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/023.yaml
  text: Let them give us two bulls[a], and let them choose one bull for themselves, cut it into pieces, and place it on the wood, but put no fire under it. And I will prepare the other bull and place it on the wood, and I will put no fire under it.
  footnotes:
  - marker: a
    text: Hebrew literally, 'put no fire.' 'Under it' is supplied in English from the sacrificial context, since the fire would be applied beneath the offering on the wood.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 우리에게 수소 두 마리를 주고, 그들 자신은 수소 하나를 택하여 그것을 쪼개어 나무 위에 놓고, 불은 붙이지 말게 하십시오. 그리고 저는 다른 수소를 준비하여 나무 위에 놓고, 불은 붙이지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘불을 두지 말라’입니다. ‘붙이지’는 제사 문맥에서 그 뜻을 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתְּנוּ לָנוּ
  english_pob_choice: Let them give us
  chosen_korean: 그들이 우리에게 … 주고
  alternatives_korean:
  - 그들이 우리에게 … 제공하고
  - 우리에게 … 주게 하고
  lexicon: HALOT
  rationale: 주다의 청유형을 사용해 제안/도전의 어조를 살리면서, 자연스러운 현대 한국어로 옮겼습니다.
- source_word: שְׁנַ֣יִם פָּרִ֗ים
  english_pob_choice: two bulls
  chosen_korean: 수소 두 마리
  alternatives_korean:
  - 두 소
  - 황소 두 마리
  lexicon: HALOT
  rationale: פָּר는 제사용 수컷 소를 가리키므로, 한국어로는 자연스럽고 구체적인 ‘수소’가 적절합니다. ‘소’는 너무 넓고, ‘황소’는 색/성별 인상이 지나치게 특정됩니다.
- source_word: וִינַתְּחֻ֗/הוּ
  english_pob_choice: cut it into pieces
  chosen_korean: 그것을 쪼개어
  alternatives_korean:
  - 그것을 조각내어
  - 그것을 잘라 나누어
  lexicon: HALOT
  rationale: 제사 준비에서 동물을 분할하는 뜻을 살려 ‘쪼개어’로 옮겼습니다. 너무 설명적인 표현보다 행동의 단순성을 유지했습니다.
- source_word: וְאֵשׁ לֹא יָשִׂימוּ
  english_pob_choice: put no fire under it
  chosen_korean: 불은 붙이지 말게 하십시오
  alternatives_korean:
  - 불을 놓지 말게 하십시오
  - 불을 대지 말게 하십시오
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘불을 두지 말라’이지만, 한국어에서는 제사 맥락상 ‘불을 붙이다’가 가장 자연스럽고 의미를 분명히 드러냅니다. POB의 ‘under it’ 보충은 한국어에서 불필요한 중복으로 보아 생략했습니다.
- source_word: וְנָתַתִּי עַל הָ֣/עֵצִ֔ים
  english_pob_choice: and place it on the wood
  chosen_korean: 나무 위에 놓고
  alternatives_korean:
  - 나무 위에 두고
  - 장작 위에 놓고
  lexicon: HALOT
  rationale: עֵצִים은 제사용 장작을 뜻하지만, 한국어에서는 복수형보다 집합명사 ‘나무’ 또는 ‘장작’이 자연스럽습니다. 여기서는 앞뒤 병행을 살리기 위해 ‘나무 위에’로 유지했습니다.
theological_decisions:
- issue: 제사 준비 표현을 어디까지 분명하게 드러낼지
  chosen_reading: ‘쪼개어 나무 위에 놓고’처럼 구체적 행동만 드러내고, 제의적 해석어는 덧붙이지 않았습니다.
  alternative_readings:
  - ‘제물로 준비하여’
  - ‘번제처럼 차려’
  rationale: 이 구절은 갈멜산 대결의 실제 절차를 말할 뿐, 여기서 제사의 신학을 해설하지 않습니다. 따라서 원문의 물리적 행위를 중심으로 옮겼습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; avoid importing later cultic/theological terminology beyond the source.'
