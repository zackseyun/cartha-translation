  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י עַד כֹּ֣ה וְ/עַד כֹּ֗ה וְ/הַ/שָּׁמַ֨יִם֙ הִֽתְקַדְּרוּ֙ עָבִ֣ים וְ/ר֔וּחַ וַ/יְהִ֖י גֶּ֣שֶׁם גָּד֑וֹל וַ/יִּרְכַּ֥ב אַחְאָ֖ב וַ/יֵּ֥לֶךְ יִזְרְעֶֽאלָ/ה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/045.yaml
  text: And in a little while[a], the sky grew black with clouds and wind, and there was a heavy rain[c][b]. Then Ahab mounted his chariot and went to Jezreel.
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''until thus and until thus,'' meaning ''meanwhile'' or ''in a little while.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'the heavens grew dark.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'a great rain.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 잠시 후에 하늘이 구름과 바람으로 검게 변하고 큰 비가 내렸습니다[c][b]. 그러자 아합은 병거를 타고 이스르엘로 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘하늘이 어두워졌습니다.’
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘큰 비’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד כֹּה וְעַד כֹּה
  english_pob_choice: And in a little while
  chosen_korean: 그리고 잠시 후에
  alternatives_korean:
  - 그리고 얼마 안 되어
  - 그리고 한동안
  - 그리고 그사이
  lexicon: HALOT
  rationale: 관용구로서 ‘잠시 후에’가 짧은 시간 경과를 자연스럽게 드러내며, 문자적 ‘이렇고 저렇고’의 어색함을 피합니다.
- source_word: הַשָּׁמַיִם / הִתְקַדְּרוּ
  english_pob_choice: the sky grew black
  chosen_korean: 하늘이 … 검게 변하고
  alternatives_korean:
  - 하늘이 어두워지고
  - 하늘이 깜깜해지고
  lexicon: HALOT
  rationale: 날씨 묘사에서 הַשָּׁמַיִם는 ‘하늘’이 자연스럽고, הִתְקַדְּרוּ는 ‘어두워지다’보다 더 강한 색채의 ‘검게 변하다’가 문맥의 폭풍 전조를 잘 살립니다.
- source_word: עָבִים וְרוּחַ
  english_pob_choice: with clouds and wind
  chosen_korean: 구름과 바람으로
  alternatives_korean:
  - 두터운 구름과 바람으로
  - 구름과 한 줄기 바람으로
  lexicon: HALOT
  rationale: 동반 수단/상태를 나타내는 표현으로 ‘구름과 바람으로’가 간결하며, עָבִים의 ‘두터운’ 뉘앙스는 본문이 허용하는 범위 안에서 과도하게 구체화하지 않았습니다.
- source_word: וַיְהִי גֶּשֶׁם גָּדוֹל
  english_pob_choice: there was a heavy rain
  chosen_korean: 큰 비가 내렸습니다
  alternatives_korean:
  - 세찬 비가 내렸습니다
  - 장대비가 내렸습니다
  - 큰비가 있었습니다
  lexicon: HALOT
  rationale: גָּדוֹל의 직역을 기계적으로 옮기기보다, 한국어에서 자연스럽게 강한 강수량을 나타내는 ‘큰 비’로 옮겼습니다.
- source_word: וַיִּרְכַּב ... יִזְרְעֶאלָה
  english_pob_choice: Then Ahab mounted his chariot and went to Jezreel
  chosen_korean: 그러자 아합은 병거를 타고 이스르엘로 갔습니다
  alternatives_korean:
  - 그러자 아합은 자기 병거에 올라 이스르엘로 갔습니다
  - 그러자 아합은 병거에 올라 이스르엘로 갔습니다
  lexicon: HALOT
  rationale: וַיִּרְכַּב는 탈것에 ‘오르다/타다’의 의미이므로 한국어에서는 ‘병거를 타고’가 자연스럽고, 방향 목적지는 조사 ‘로’로 표시했습니다.
