  lexicon: HALOT
  rationale: גהר는 낮게 몸을 숙이는 동작을 가리키므로, 예배로 단정하지 않으면서 자세를 선명하게 드러내는 표현을 택했습니다.
- source_word: וַיָּשֶׂם פָּנָיו בֵּין בִּרְכָּיו
