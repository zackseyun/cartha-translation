theological_decisions:
- issue: 엘리야의 자세를 기도로 명시할지 여부
  chosen_reading: 본문에는 기도라는 말을 넣지 않고, 물리적 자세만 번역했습니다.
  alternative_readings:
  - 기도하며 몸을 굽혔습니다
  - 무릎 사이에 얼굴을 넣고 기도했습니다
  rationale: 앞뒤 문맥은 기도를 시사할 수 있지만, 이 절 자체는 실제 자세를 묘사하므로 본문이 말하는 범위를 넘어 해석을 본문에 넣지 않았습니다.
  doctrine_reference: '번역 원칙: 본문이 명시하지 않은 의미를 본문에 덧붙이지 않고, 문맥이 암시하는 긴장은 주석 영역에 남겨 둡니다.'
