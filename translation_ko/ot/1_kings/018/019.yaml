id: 1KI.18.19
reference: 1 Kings 18:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁלַ֨ח קְבֹ֥ץ אֵלַ֛/י אֶת כָּל יִשְׂרָאֵ֖ל אֶל הַ֣ר הַ/כַּרְמֶ֑ל וְ/אֶת נְבִיאֵ֨י הַ/בַּ֜עַל אַרְבַּ֧ע מֵא֣וֹת וַ/חֲמִשִּׁ֗ים וּ/נְבִיאֵ֤י הָֽ/אֲשֵׁרָה֙ אַרְבַּ֣ע מֵא֔וֹת אֹכְלֵ֖י שֻׁלְחַ֥ן אִיזָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/019.yaml
  text: Now send and gather to me all Israel at Mount Carmel[a], along with the prophets of Baal, four hundred and fifty, and the prophets of Asherah, four hundred[c][b], who eat at Jezebel’s table.
  footnotes:
  - marker: a
    text: Or 'to Mount Carmel.' The Hebrew preposition marks movement toward the gathering place.
    reason: lexical_alternative
  - marker: b
    text: Or 'who dine at Jezebel’s table,' referring to those maintained by her royal patronage.
    reason: lexical_alternative
  - marker: c
    text: '''Asherah'' may refer either to the goddess Asherah or, in some contexts, to a cult object associated with her. Here the parallel with ''Baal'' favors the deity.'
    reason: cultural_note
translation:
  language: ko
  text: 이제 보내어 갈멜 산에[a] 온 이스라엘을 모으고, 바알의 예언자들 사백오십 명과 아세라의 예언자들 사백 명[b][c], 곧 이세벨의 상에서 먹는 자들도 모으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈멜 산에’는 히브리어 전치사가 집결 장소를 향한 이동을 표시한다는 점을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이세벨의 상’은 왕실 후원 아래 먹는 자들을 가리키는 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 아세라는 여기서 바알과 평행을 이루는 신격 이름으로 읽는 것이 자연스럽습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 그러므로
  lexicon: HALOT
  rationale: 대화의 흐름을 이어 주면서 즉각적인 명령을 시작하는 담화 표지이므로, 현대 한국어에서 자연스러운 ‘이제’로 옮겼습니다.
- source_word: שְׁלַח קְבֹץ
  english_pob_choice: send and gather
  chosen_korean: 보내어 … 모으고
  alternatives_korean:
  - 보내고 모으고
  - 파견하여 소집하고
  lexicon: HALOT
  rationale: 두 개의 명령형 연쇄를 살려, ‘보내어’와 ‘모으고’로 동작의 순서를 드러냈습니다. ‘소집하다’보다 본문의 간결한 명령감을 더 직접적으로 반영합니다.
- source_word: אֶל הַר הַכַּרְמֶל
  english_pob_choice: at Mount Carmel
  chosen_korean: 갈멜 산에
  alternatives_korean:
  - 갈멜 산으로
  - 갈멜 산에서
  lexicon: HALOT
  rationale: 히브리어 전치사는 집결지로의 이동을 가리키므로, 한국어에서는 목적지 방향을 분명히 하는 ‘-에’가 가장 자연스럽습니다.
- source_word: נְבִיאֵי הַבַּעַל / נְבִיאֵי הָאֲשֵׁרָה
  english_pob_choice: the prophets of Baal / the prophets of Asherah
  chosen_korean: 바알의 예언자들 / 아세라의 예언자들
  alternatives_korean:
  - 바알의 선지자들 / 아세라의 선지자들
  - 바알 예언자들 / 아세라 예언자들
  lexicon: HALOT
  rationale: 예언자의 직무를 나타내는 표현이므로, 교회 전통어인 ‘선지자’보다 원문의 일반 명칭에 가까운 ‘예언자’로 옮겼습니다. ‘아세라’는 이 구절의 평행법상 신격 이름으로 읽는 것이 타당하므로 고유명사로 보존했습니다.
- source_word: אֹכְלֵי שֻׁלְחַן אִיזָבֶל
  english_pob_choice: who eat at Jezebel’s table
  chosen_korean: 이세벨의 상에서 먹는 자들
  alternatives_korean:
  - 이세벨의 식탁에서 먹는 자들
  - 이세벨에게서 먹는 자들
  lexicon: HALOT
  rationale: 왕실 후원의 뉘앙스를 살리면서도 히브리어의 직설적 표현을 유지하기 위해 ‘상’으로 옮겼습니다. ‘먹는 자들’은 단순한 식사가 아니라 이세벨의 부양 아래 있는 사람들을 가리키는 원문 느낌을 보존합니다.
theological_decisions:
- issue: 아세라의 의미
  chosen_reading: 이 구절에서는 신격 이름으로 이해하여 ‘아세라의 예언자들’로 번역했습니다.
  alternative_readings:
  - 아세라 숭배 목상/기둥을 가리켜 ‘아세라의 예언자들’ 대신 다른 설명을 붙이는 해석
  rationale: 바알과의 평행 구조가 강하므로, 여기서는 cult object보다 신격명으로 읽는 것이 본문의 대칭성과 서술 의도를 더 잘 드러냅니다. 본문은 논쟁적 해설을 본문 안에 넣기보다, 가능한 한 투명하게 전달하는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘이제’와 명령형의 직설성
  chosen_reading: 엘리야의 긴급한 요구를 살리기 위해 공손한 청유가 아니라 직접 명령형으로 옮겼습니다.
  alternative_readings:
  - ‘보내 주십시오’처럼 완곡하게 조정하는 번역
  rationale: 본문은 아합에게 내리는 직접적 지시이므로, 한국어에서도 명령의 강도를 약화시키지 않는 것이 원문 충실도에 부합합니다.
  doctrine_reference: Translation philosophy §1
