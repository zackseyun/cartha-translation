  terminology: ‘야훼’, ‘말씀’, ‘엘리야’, ‘아합’은 적절합니다. ‘땅 위에 비를 내리겠습니다’는 נתן מָטָר의 직역적 ‘비를 주다’를 자연스러운 한국어로 반영합니다.
