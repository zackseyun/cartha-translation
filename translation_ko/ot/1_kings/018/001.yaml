  text: וַ/יְהִי֙ יָמִ֣ים רַבִּ֔ים וּ/דְבַר יְהוָ֗ה הָיָה֙ אֶל אֵ֣לִיָּ֔הוּ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ית לֵ/אמֹ֑ר לֵ֚ךְ הֵרָאֵ֣ה אֶל אַחְאָ֔ב וְ/אֶתְּנָ֥ה מָטָ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/001.yaml
  text: And it happened after many days that the word of Yahweh came to Elijah in the third year[a], saying, “Go, show yourself to Ahab, and I will give rain upon the face of the land.”
  footnotes:
  - marker: a
    text: Or 'and I will send rain on the land.' The Hebrew says literally, 'I will give rain upon the face of the land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 날이 지난 뒤, 셋째 해에 야훼의 말씀이 엘리야에게 임했습니다. “가서 아합에게 모습을 드러내십시오. 내가 땅 위에 비를 내리겠습니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그 땅에 비를 보내겠다.’ 히브리어는 문자적으로 ‘내가 땅의 표면 위에 비를 주겠다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יָמִים רַבִּים
  english_pob_choice: And it happened after many days
  chosen_korean: 그리고 많은 날이 지난 뒤에
  alternatives_korean:
  - 오랜 시간이 지난 뒤에
  - 많은 날 후에
  lexicon: HALOT
  rationale: 히브리어의 서술 도입과 긴 시간 경과를 자연스러운 현대 한국어로 옮기되, 원문의 시간 전환을 유지했습니다.
- source_word: וּדְבַר יְהוָה הָיָה אֶל אֵלִיָּהוּ
  english_pob_choice: the word of Yahweh came to Elijah
  chosen_korean: 야훼의 말씀이 엘리야에게 이르렀는데
  alternatives_korean:
  - 야훼의 말씀이 엘리야에게 왔는데
  - 야훼의 말씀이 엘리야에게 임하였는데
  lexicon: HALOT
  rationale: 예언자 수신 공식은 ‘이르다’가 한국어 성경 문맥에서 가장 안정적으로 수용되며, ‘말씀’은 מקור의 דְבַר을 직접 반영합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본 프로젝트의 표준에 따라 신명문을 인명형 전사인 ‘야훼’로 옮겨, 제목어 ‘주’로 대체하지 않았습니다.
- source_word: הֵרָאֵה אֶל
  english_pob_choice: show yourself to
  chosen_korean: 네 모습을 드러내어라
  alternatives_korean:
  - 네 몸을 보여라
  - 스스로 나타나라
  lexicon: HALOT
  rationale: 니팔 명령형의 ‘보이다/드러나다’ 의미를 살리면서, 아합 앞에 자신을 드러내라는 요청을 현대 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 신명기 명칭의 표기
  chosen_reading: 본문에서는 야훼를 사용했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 원문이 אישית 이름인 יְהוָה를 사용하므로, 호칭어 ‘주’로 완화하지 않고 고유명성를 유지하는 것이 본문 이해에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 직접 인용부의 어조
  chosen_reading: 「가서 … 드러내어라 … 내리겠습니다」처럼 명령은 반말형, 야훼의 약속은 합쇼체로 처리했습니다.
  alternative_readings:
  - 전체를 합쇼체로 통일
  - 전체를 성경식 명령형으로 통일
  rationale: 히브리어 직접화법의 명령과 약속을 한국어에서도 구분해, 권위 있는 지시와 화자 어조의 차이를 드러냈습니다.
  doctrine_reference: Korean style and discourse register policy
