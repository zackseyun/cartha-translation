id: 1KI.18.35
reference: 1 Kings 18:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּלְכ֣וּ הַ/מַּ֔יִם סָבִ֖יב לַ/מִּזְבֵּ֑חַ וְ/גַ֥ם אֶת הַ/תְּעָלָ֖ה מִלֵּא מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/035.yaml
  text: And the water went all around the altar[b][a], and it also filled the trench with water.
  footnotes:
  - marker: a
    text: Or 'flowed all around the altar.' The Hebrew verb is literally 'went,' used here of the movement of water.
    reason: lexical_alternative
  - marker: b
    text: Or 'channel' or 'ditch' for 'trench.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 물이 제단 주위로 흘러갔고, 도랑에도 물을 가득 채웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכ֣וּ הַמַּ֔יִם
  english_pob_choice: And the water went
  chosen_korean: 그리고 물이 둘렀고
  alternatives_korean:
  - 그리고 물이 갔고
  - 그리고 물이 흘렀고
  - 그리고 물이 돌아다녔고
  lexicon: HALOT
  rationale: 히브리어 동사 ‘הלך’의 기본 의미는 ‘가다’이지만, 물이 주어일 때는 물의 움직임을 자연스럽게 묘사하는 표현이 필요합니다. 한국어에서는 ‘둘렀다’가 제단을 에워싼 물의 확산을 간결하게 살립니다.
- source_word: סָבִיב לַמִּזְבֵּחַ
  english_pob_choice: all around the altar
  chosen_korean: 제단 사방을
  alternatives_korean:
  - 제단을 둘러
  - 제단 주위를
  - 제단 둘레를
  lexicon: HALOT
  rationale: סביב은 단순한 ‘옆’이 아니라 둘러싸는 범위를 가리키므로, ‘사방을’이 장면의 완전한 에워쌈을 잘 드러냅니다.
- source_word: וְגַם אֶת הַתְּעָלָה
  english_pob_choice: and it also filled the trench
  chosen_korean: 도랑에도
  alternatives_korean:
  - 도랑까지도
  - 도랑도
  - 개천에도
  lexicon: HALOT
  rationale: תְּעָלָה는 이 엘리야 이야기의 맥락에서 제단 둘레의 도랑/수로를 뜻하므로, 한국어에서는 가장 직관적인 ‘도랑’으로 옮겼습니다.
- source_word: מִלֵּא מָיִם
  english_pob_choice: filled ... with water
  chosen_korean: 물이 가득 찼습니다
  alternatives_korean:
  - 물을 가득 채웠습니다
  - 물로 가득 찼습니다
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘물을 채웠다’이지만, 한국어에서는 결과 상태를 드러내는 ‘가득 찼습니다’가 더 자연스럽고 장면의 완성도를 잘 전달합니다.
