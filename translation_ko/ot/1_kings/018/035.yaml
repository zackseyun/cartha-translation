  source_fidelity: 수정안은 물이 제단 주위로 움직였다는 וַיֵּלְכוּ의 동작성을 ‘흘러갔고’로 드러내며, 물이 도랑을 채웠다는 두 번째 절의 능동적 서술도 보존합니다. ‘도랑’은 הַתְּעָלָה에 적절합니다.
