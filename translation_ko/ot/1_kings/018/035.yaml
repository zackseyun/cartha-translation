    rationale: וַיֵּלְכוּ는 문자적으로 ‘갔다’이며, 물이 제단 주위로 움직이는 장면을 말합니다. ‘흘러갔고’가 한국어에서 자연스럽게 이 동작을 보존합니다.
  - severity: medium
    issue: 둘째 절이 ‘물이 가득 찼습니다’라는 결과 상태로 되어 주어가 도랑을 채운 원문의 능동 서술을 흐립니다.
