  text: Then the fire of Yahweh fell and consumed the burnt offering[a], the wood, the stones, the dust, and licked up the water that was in the trench.
  footnotes:
  - marker: a
    text: Or 'fire from the LORD fell.' The Hebrew can be understood as emphasizing the fire's divine source.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼의 불이 내려와 번제물과 나무와 돌과 흙을 삼키고, 도랑에 있던 물까지 핥아 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「야훼에게서 나온 불이 떨어졌다」. 히브리어는 불의 직접적 기원을 강조하는 것으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשׁ יְהוָה
  english_pob_choice: the fire of Yahweh
  chosen_korean: 야훼의 불
  alternatives_korean:
  - 야훼에게서 나온 불
  - 주님의 불
  lexicon: HALOT
  rationale: 히브리어는 불과 야훼를 밀접하게 연결하며, 한국어에서는 소유격 형태의 「야훼의 불」이 가장 자연스럽고 원문의 직접성을 살립니다.
- source_word: וַתִּפֹּל
  english_pob_choice: fell
  chosen_korean: 내려와
  alternatives_korean:
  - 떨어졌습니다
  - 내렸습니다
  lexicon: HALOT
  rationale: 불이 위에서 임하는 장면을 한국어로는 「내려와」가 가장 자연스럽게 살리면서도, 원문의 하강 이미지를 유지합니다.
- source_word: וַתֹּאכַל
  english_pob_choice: consumed
  chosen_korean: 삼키고
  alternatives_korean:
  - 먹어 치우고
  - 소멸시키고
  lexicon: HALOT
  rationale: 불이 제물과 재료를 완전히 없애는 강한 동작을 살리기 위해, 직역적이되 생생한 「삼키다」를 택했습니다.
- source_word: לִחֵכָה
  english_pob_choice: licked up
  chosen_korean: 핥아 버렸습니다
  alternatives_korean:
  - 핥아 먹었습니다
  - 모조리 빨아들였습니다
  lexicon: HALOT
  rationale: 마지막 물을 향한 동작은 문자 그대로의 「핥다」 이미지를 살려야 하므로, 한국어에서도 「핥아 버렸습니다」로 옮겼습니다.
theological_decisions:
