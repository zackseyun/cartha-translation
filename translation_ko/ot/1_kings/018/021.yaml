  edition: WLC
  text: וַ/יִּגַּ֨שׁ אֵלִיָּ֜הוּ אֶל כָּל הָ/עָ֗ם וַ/יֹּ֨אמֶר֙ עַד מָתַ֞י אַתֶּ֣ם פֹּסְחִים֮ עַל שְׁתֵּ֣י הַ/סְּעִפִּים֒ אִם יְהוָ֤ה הָֽ/אֱלֹהִים֙ לְכ֣וּ אַחֲרָ֔י/ו וְ/אִם הַ/בַּ֖עַל לְכ֣וּ אַחֲרָ֑י/ו וְ/לֹֽא עָנ֥וּ הָ/עָ֛ם אֹת֖/וֹ דָּבָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/021.yaml
  text: Then Elijah came near to all the people and said[a], “How long will you keep limping between two opinions? If Yahweh is God, follow him; but if Baal, follow him.” But the people did not answer him a word.
  footnotes:
  - marker: a
    text: Or 'wobbling between two opinions.' The Hebrew more literally speaks of limping or hobbling 'upon/between two branches/forks,' a metaphor for divided loyalty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 엘리야가 모든 백성에게 가까이 가서 말했습니다. 「너희가 언제까지 두 갈래 가지 사이에서 절뚝거릴 것입니까? 야훼께서 하나님이시면 그를 따르십시오. 그러나 바알이시면 그를 따르십시오.」 그러나 백성은 그에게 한마디도 대답하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘두 갈래/가지’에 해당하는 표현을 써서, 분열된 충성과 망설임의 이미지를 더 구체적으로 전합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  english_pob_choice: came near
  chosen_korean: 가까이 가서
  alternatives_korean:
  - 다가가서
  - 나아가서
  lexicon: HALOT
  rationale: 물리적으로 군중 앞에 다가서는 동작을 자연스러운 현대 한국어로 살리면서, 엘리야의 도전적 접근을 유지합니다.
- source_word: פֹּסְחִים
  english_pob_choice: keep limping
  chosen_korean: 절뚝거릴 것입니까
  alternatives_korean:
  - 비틀거릴 것입니까
  - 흔들릴 것입니까
  lexicon: HALOT
  rationale: 동사의 기본 이미지인 ‘절뚝거리다/절다’를 살려, 단순한 심리적 동요보다 몸짓의 비유를 드러냅니다.
- source_word: עַל שְׁתֵּי הַסְּעִפִּים
  english_pob_choice: between two branches
  chosen_korean: 두 갈래 가지 사이에서
  alternatives_korean:
  - 두 갈래 사이에서
  - 두 생각 사이에서
  lexicon: HALOT
  rationale: 전통적 해석어인 ‘생각’보다 히브리어의 구체적 은유인 ‘갈라진 가지/갈림길의 이미지’를 보존해 분열된 충성을 드러냅니다.
- source_word: לְכוּ אַחֲרָיו
  english_pob_choice: follow him
  chosen_korean: 그를 따르십시오
  alternatives_korean:
  - 그의 뒤를 가십시오
  - 그를 좇으십시오
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 표준적인 제자도/충성 표현으로 옮기되, 명령의 직접성을 분명히 했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 언약 이름을 가리키는 텍스트이므로, 본 프로젝트 기본값에 따라 ‘야훼’로 옮겨 고유 이름성과 대조 효과를 보존했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: ‘하나님이시면… 바알이시면…’의 대조 구조
  chosen_reading: 조건문 형태를 그대로 살려 양자택일의 도전을 유지
  alternative_readings:
  - 서술형으로 완화하여 표현
  - 의미를 풀어 ‘참 하나님이시면’으로 보강
  rationale: 엘리야의 수사적 압박은 본문의 핵심이므로, 해석을 덧붙여 완화하지 않고 조건문과 반복 명령을 그대로 재현했습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy; preserve theological tension'
