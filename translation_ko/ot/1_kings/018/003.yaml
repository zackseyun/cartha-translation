base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/003.yaml
  text: And Ahab called Obadiah[a], who was over the household. Now Obadiah feared Yahweh greatly.
  footnotes:
  - marker: a
    text: Or 'who was in charge of the palace.' The Hebrew literally says 'who was over the house,' an expression for a chief household official.
    reason: lexical_alternative
translation:
  language: ko
  text: 아합이 궁내를 맡은 오바댜를 불렀습니다. 오바댜는 야훼를 매우 두려워하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘궁내를 맡은’은 히브리어 ‘집 위에 있는 자’를 풀어 옮긴 것으로, 왕실의 최고 가정관리자/궁정 책임자를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֲחְאָב אֶל
  english_pob_choice: called Obadiah
  chosen_korean: 오바댜를 불렀습니다
  alternatives_korean:
  - 오바댜를 소집했습니다
  - 오바댜를 불렀습니다
  lexicon: WLC
  rationale: קרא + אֶל은 여기서 아합이 오바댜를 부르는 행위를 뜻하므로, 과도한 군사·왕실 뉘앙스를 덧붙이지 않고 자연스럽게 ‘불렀습니다’로 옮겼습니다.
- source_word: אֲשֶׁר עַל הַבָּיִת
  english_pob_choice: who was over the household
  chosen_korean: 궁내를 맡은
  alternatives_korean:
  - 왕궁을 맡은
  - 집안을 맡은
  - 궁정의 책임자인
  lexicon: HALOT
  rationale: ‘집 위에 있다’는 히브리어 관용구는 왕실 행정직을 가리키므로, 한국어로는 직무를 풀어 ‘궁내를 맡은’으로 옮겨 직분과 궁정 맥락을 함께 드러냈습니다.
- source_word: יָרֵא אֶת יְהוָה מְאֹד
  english_pob_choice: feared Yahweh greatly
  chosen_korean: 야훼를 매우 두려워하고 있었습니다
  alternatives_korean:
  - 야훼를 크게 두려워했습니다
  - 야훼를 경외하였습니다
  - 야훼를 매우 두려워했습니다
  lexicon: HALOT
  rationale: ירא + את יהוה는 단순한 감정이 아니라 경외를 포함한 언약적 두려움을 뜻하므로, 전통적 ‘경외하다’보다 본문의 직접성을 살려 ‘두려워하다’로 옮기되, 상태적 표현을 반영해 ‘두려워하고 있었습니다’로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE
  rationale: 사역 원칙에 따라 신명기적 고유명사 יְהוָה는 대체 호칭이 아니라 음역형 ‘야훼’로 유지했습니다.
theological_decisions:
- issue: ירא אֶת יְהוָה의 신학적 뉘앙스
  chosen_reading: 오바댜는 단순히 무서워한 것이 아니라, 야훼 앞에서의 경외와 충성의 태도를 지닌 인물로 제시됩니다.
  alternative_readings:
  - 야훼를 무서워했습니다
  - 야훼를 공경했습니다
  rationale: 히브리어 ירא는 공포만이 아니라 하나님 앞에서의 경외를 포함하지만, 한국어에서 전통적 종교어 ‘공경’은 힘을 약화시킬 수 있어, 본문의 긴장을 살리면서도 신앙적 의미가 드러나도록 번역했습니다.
  doctrine_reference: 'POB translation principle: preserve lexical tension without softening the source'
