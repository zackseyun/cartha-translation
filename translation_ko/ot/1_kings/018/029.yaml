  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כַּ/עֲבֹ֣ר הַֽ/צָּהֳרַ֔יִם וַ/יִּֽתְנַבְּא֔וּ עַ֖ד לַ/עֲל֣וֹת הַ/מִּנְחָ֑ה וְ/אֵֽין ק֥וֹל וְ/אֵין עֹנֶ֖ה וְ/אֵ֥ין קָֽשֶׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/029.yaml
  text: And it happened[a], when noon had passed, that they kept prophesying until the offering up of the grain offering, but there was no voice, no one answering[b], and no one paying attention.
  footnotes:
  - marker: a
    text: Or, 'they raved.' The Hebrew uses the usual verb for prophesying, here describing ecstatic behavior by Baal's prophets.
    reason: lexical_alternative
  - marker: b
    text: '''The offering up of the grain offering'' may also be understood as the time of the regular evening offering.'
    reason: alternative_reading
translation:
  language: ko
  text: 정오가 지나자, 그들은 곡식제물을 올리는 때까지 계속 예언하였습니다.[a] 그러나 소리도 없고, 응답하는 이도 없고, 귀 기울이는 이도 없었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 광란하였습니다.’ 히브리어는 통상적인 ‘예언하다’라는 동사를 사용하지만, 여기서는 바알의 예언자들이 보인 황홀경적 행동을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘곡식제물을 올리는 때’는 정규 저녁 제물을 드리는 시간으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 이런 일이 있었습니다
  alternatives_korean:
  - 그때 일이 벌어졌습니다
  - 그러자
  lexicon: HALOT
  rationale: 서사 진행을 여는 wayyiqtol의 기능을 자연스러운 현대 한국어로 살리되, 지나치게 구어적이거나 해석적인 표현은 피했습니다.
- source_word: כַּעֲבֹר הַצָּהֳרַיִם
  english_pob_choice: when noon had passed
  chosen_korean: 정오가 지나자
  alternatives_korean:
  - 한낮이 지나자
  - 정오 무렵이 지나자
  lexicon: HALOT
  rationale: 중앙 시각표현인 צָהֳרַיִם을 '정오'로 옮겨 문맥의 시간 진행을 분명히 했습니다.
- source_word: וַיִּתְנַבְּאוּ
  english_pob_choice: they kept prophesying
  chosen_korean: 그들은 계속 예언하였고
  alternatives_korean:
  - 그들은 계속 예언했습니다
  - 그들은 광란하며 떠들었습니다
  lexicon: HALOT
  rationale: 히트파엘 동사의 기본 의미를 유지해 '예언하다'로 옮기고, 지속상은 '계속'으로 드러냈습니다. 바알의 예언자들이 보인 광적 행위라는 문맥적 뉘앙스는 본문이 아니라 주해에서 처리하는 편이 더 정확합니다.
- source_word: עַד לַעֲלוֹת הַמִּנְחָה
  english_pob_choice: until the offering up of the grain offering
  chosen_korean: 곡식제물을 드리는 때까지
  alternatives_korean:
  - 소제물을 드리는 때까지
  - 곡식제물을 올리는 때까지
  lexicon: HALOT
  rationale: מִנְחָה를 기본적으로 '곡식제물'로 옮기고, 시간표시로 쓰인 구절은 '드리는 때'로 자연스럽게 표현했습니다. 여기서는 '저녁'을 본문에 넣지 않았습니다.
- source_word: וְאֵין קוֹל וְאֵין עֹנֶה וְאֵין קָשֶׁב
  english_pob_choice: but there was no voice, no one answering, and no one paying attention
  chosen_korean: 소리도 없고, 응답하는 자도 없고, 주의하는 자도 없었습니다
  alternatives_korean:
  - 소리도 없고, 대답하는 자도 없고, 귀 기울이는 자도 없었습니다
  - 응답도, 주의도 없었습니다
  lexicon: HALOT
  rationale: 세 개의 부정 병렬을 한국어에서도 점층적으로 살려, 첫째는 '소리', 둘째는 '응답', 셋째는 '주의/귀 기울임'의 부재를 분명히 했습니다.
theological_decisions:
- issue: 바알 선지자들의 ecstatic behavior를 어떻게 드러낼지
  chosen_reading: 본문은 '예언하다'를 유지하고, 광적인 행위라는 평가는 직접 번역에 넣지 않았습니다.
  alternative_readings:
  - 광란하며 떠들었습니다
  - 예언하는 체했습니다
  rationale: 히브리어 동사 자체는 일반적인 '예언하다'이므로, 본문은 사전적 형식을 보존하고 아이러니는 서술 맥락이 전달하도록 두는 편이 소스 충실도에 맞습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
