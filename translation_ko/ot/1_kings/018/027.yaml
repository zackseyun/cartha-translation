base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/027.yaml
  text: And it happened at noon that Elijah mocked them and said[a], “Cry out with a loud voice, for he is a god. For he is musing, or he has gone aside, or he is on a journey. Perhaps he is sleeping and will awake.”
  footnotes:
  - marker: a
    text: Or possibly, 'he is relieving himself.' The Hebrew expression is likely euphemistic.
    reason: lexical_alternative
translation:
  language: ko
  text: 정오가 되었을 때 엘리야가 그들을 조롱하며 말했습니다. 「큰 소리로 부르십시오. 그는 신이기 때문입니다. 그는 생각에 잠겨 있거나, 한쪽으로 물러났거나, 길을 가고 있거나, 어쩌면 자고 있을지도 모릅니다. 그러니 깨어나게 해 보십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 완곡어법일 가능성이 있으며, 문맥상 ‘용변을 보느라’라는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּצָּהֳרַיִם
  english_pob_choice: And it happened at noon
  chosen_korean: 정오가 되었을 때
  alternatives_korean:
  - 그 일이 정오에 일어났을 때
  - 정오 무렵에
  lexicon: HALOT
  rationale: 서사 도입의 wayyiqtol 흐름을 자연스러운 현대 한국어로 옮기되, 시간 표시인 בַּצָּהֳרַיִם의 핵심 의미인 ‘정오’는 분명히 살렸습니다.
- source_word: וַיְהַתֵּל בָּהֶם
  english_pob_choice: mocked them
  chosen_korean: 그들을 조롱하며
  alternatives_korean:
  - 그들을 조소하며
  - 그들을 비웃으며
  lexicon: HALOT
  rationale: 동사는 단순한 웃음이 아니라 적대적·경멸적 조롱을 뜻하므로, 엘리야의 풍자적 어조를 드러내는 ‘조롱하다’가 적절합니다.
- source_word: קִרְאוּ בְקוֹל גָּדוֹל
  english_pob_choice: Cry out with a loud voice
  chosen_korean: 큰 소리로 부르십시오
  alternatives_korean:
  - 큰 소리로 외치십시오
  - 더 큰 소리로 부르십시오
  lexicon: HALOT
  rationale: 요청형의 힘을 살리면서 한국어에서 가장 자연스러운 명령 표현으로 옮겼습니다. '큰 소리로'가 히브리어의 בְקוֹל גָדוֹל을 충분히 반영합니다.
- source_word: כִּי אֱלֹהִים הוּא
  english_pob_choice: for he is a god
  chosen_korean: 그는 신이기 때문입니다
  alternatives_korean:
  - 그는 한 신이기 때문입니다
  - 그는 신이기 때문입니다
  lexicon: HALOT
  rationale: 문맥상 야훼에 대한 신앙고백이 아니라 바알을 향한 빈정거림이므로, 특정 참신을 뜻하는 '하나님'이 아니라 일반적 의미의 '신'으로 옮겨 아이러니를 보존했습니다.
- source_word: שִׂיחַ וְכִי שִׂיג לוֹ וְכִי דֶרֶךְ לוֹ
  english_pob_choice: he is musing, or he has gone aside, or he is on a journey
  chosen_korean: 그는 생각에 잠겨 있거나, 한쪽으로 물러났거나, 길을 가고 있거나
  alternatives_korean:
  - 그는 생각하고 있거나, 몸을 피했거나, 여행 중이거나
  - 그는 사색 중이거나, 자리를 비웠거나, 길을 가는 중이거나
  lexicon: HALOT
  rationale: 세 동사구의 불확실성과 완곡성을 그대로 남기기 위해 단정적 해석을 피하고, 각 표현을 병렬적으로 옮겼습니다. 특히 שִׂיג לוֹ는 노골적 의미로 좁히지 않고 '한쪽으로 물러났거나'로 완곡하게 처리했습니다.
theological_decisions:
- issue: 엘리야가 바알을 가리켜 אֱלֹהִים이라고 말하는 표현
  chosen_reading: ‘그는 신이기 때문입니다’
  alternative_readings:
  - ‘그는 하나님이기 때문입니다’
  - ‘그는 한 신이기 때문입니다’
  rationale: 본문은 참하나님을 부르는 것이 아니라 우상 숭배를 조롱하는 발언이므로, 전통적 교회어 ‘하나님’을 피하고 일반 명사 ‘신’으로 처리해 원문의 풍자와 신학적 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §1; 열왕기상 18장 문맥
