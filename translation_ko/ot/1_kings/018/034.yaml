id: 1KI.18.34
reference: 1 Kings 18:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מִלְא֨וּ אַרְבָּעָ֤ה כַדִּים֙ מַ֔יִם וְ/יִֽצְק֥וּ עַל הָ/עֹלָ֖ה וְ/עַל הָ/עֵצִ֑ים וַ/יֹּ֤אמֶר שְׁנוּ֙ וַ/יִּשְׁנ֔וּ וַ/יֹּ֥אמֶר שַׁלֵּ֖שׁוּ וַ/יְשַׁלֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/034.yaml
  text: Then he said[a], “Fill four jars with water and pour it on the burnt offering and on the wood.” Then he said, “Do it a second time,” and they did it a second time. Then he said, “Do it a third time,” and they did it a third time.
  footnotes:
  - marker: a
    text: Or “four pitchers”; the Hebrew term refers to a vessel for carrying liquids.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그는 「물 네 항아리에 물을 채워 번제물과 나무 위에 붓으십시오」라고 말했습니다. 그러고 나서 그는 「두 번째로 하십시오」라고 말했고, 그들은 두 번째로 했습니다. 그러고 나서 그는 「세 번째로 하십시오」라고 말했고, 그들은 세 번째로 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “물통 네 개”; 히브리어는 액체를 나르는 그릇을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְאוּ אַרְבָּעָה כַדִּים מַיִם
  english_pob_choice: Fill four jars with water
  chosen_korean: 물 네 항아리에 물을 채우십시오
  alternatives_korean:
  - 물 네 항아리를 채우십시오
  - 네 물항아리에 물을 채우십시오
  lexicon: HALOT
  rationale: כד는 액체를 담아 나르는 그릇으로, 한국어에서는 자연스럽고 구체적인 '항아리'가 적절합니다. 동작의 대상이 용기이므로 '항아리에 물을 채우다'로 옮겼습니다.
- source_word: וְיִצְקוּ
  english_pob_choice: and pour it
  chosen_korean: 붓으십시오
  alternatives_korean:
  - 쏟으십시오
  - 부으십시오
  lexicon: HALOT
  rationale: 물 자체를 '붓다'가 자연스럽고, 제단 위로 의도적으로 쏟아 붓는 동작도 무리 없이 드러냅니다.
- source_word: הָעֹלָה
  english_pob_choice: the burnt offering
  chosen_korean: 번제물
  alternatives_korean:
  - 번제
  - 태움제물
  lexicon: HALOT
  rationale: עֹלָה는 표준 제의 용어로, 여기서는 제물 자체를 가리키므로 '번제물'이 가장 분명합니다.
- source_word: הָעֵצִים
  english_pob_choice: the wood
  chosen_korean: 나무
  alternatives_korean:
  - 장작
  - 땔나무
  lexicon: HALOT
  rationale: 제단에 놓인 연료를 가리키지만, 한국어에서는 단수 집합명사 '나무'가 본문의 간결한 병렬 구조를 잘 살립니다.
- source_word: שְׁנוּ / שַׁלֵּשׁוּ
  english_pob_choice: Do it a second time / Do it a third time
  chosen_korean: 두 번째로 하십시오 / 세 번째로 하십시오
  alternatives_korean:
  - 다시 하십시오 / 세 번째로 반복하십시오
  - 한 번 더 하십시오 / 세 번 더 하십시오
  lexicon: HALOT
  rationale: 히브리어는 단순 반복 명령이 아니라 회수까지 분명히 하는 표현이므로, '두 번째로/세 번째로'로 각각의 차수를 드러냈습니다.
theological_decisions:
- issue: 번제 용어의 현대 한국어 표현
  chosen_reading: 번제물
  alternative_readings:
  - 번제
  - 불로 드리는 제물
  rationale: 본문은 설명이 아닌 제의 행위를 서술하므로, 전통 용어를 유지하되 제물의 실재를 드러내는 '번제물'이 가장 직접적입니다.
  doctrine_reference: 제의 용어의 문맥 우선 번역 원칙
