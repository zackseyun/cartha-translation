  text: וְ/הָיָ֞ה אֲנִ֣י אֵלֵ֣ךְ מֵ/אִתָּ֗/ךְ וְ/ר֨וּחַ יְהוָ֤ה יִֽשָּׂאֲ/ךָ֙ עַ֚ל אֲשֶׁ֣ר לֹֽא אֵדָ֔ע וּ/בָ֨אתִי לְ/הַגִּ֧יד לְ/אַחְאָ֛ב וְ/לֹ֥א יִֽמְצָאֲ/ךָ֖ וַ/הֲרָגָ֑/נִי וְ/עַבְדְּ/ךָ֛ יָרֵ֥א אֶת יְהוָ֖ה מִ/נְּעֻרָֽ/י׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/012.yaml
  text: And when I go away from you[a], the Spirit of Yahweh may carry you where I do not know. Then when I come and tell Ahab and he does not find you, he will kill me—though your servant has feared Yahweh from my youth.
  footnotes:
  - marker: a
    text: Or 'the wind of the LORD may carry you'; Hebrew רוּחַ can mean 'spirit,' 'wind,' or 'breath,' though 'Spirit' best fits the context here.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신에게서 떠나가면 야훼의 영이 당신을 내가 알지 못하는 곳으로 데려가실지도 모릅니다. 그러다가 제가 가서 아합에게 알리면 그가 당신을 찾지 못할 것이고, 그러면 그가 저를 죽일 것입니다. 그런데 당신의 종은 어릴 때부터 야훼를 경외해 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 바람이 당신을 데려갈지도 모릅니다’. 히브리어 רוּחַ는 ‘영’, ‘바람’, ‘숨’을 뜻할 수 있으나, 여기서는 문맥상 ‘영’이 가장 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ יְהוָה
  english_pob_choice: the Spirit of Yahweh
  chosen_korean: 야훼의 영
  alternatives_korean:
  - 야훼의 바람
  - 야훼의 숨
  - 주님의 영
  lexicon: HALOT
  rationale: רוּחַ는 문맥에 따라 바람·숨·영을 뜻할 수 있지만, 엘리야를 옮겨 가는 초자연적 주도권을 말하므로 ‘영’이 가장 적절합니다. יהוה는 POB 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: יִשָּׂאֲךָ
  english_pob_choice: may carry you
  chosen_korean: 데려가실지도 모릅니다
  alternatives_korean:
  - 옮기실지도 모릅니다
  - 실어 가실지도 모릅니다
  - 들어 올리실지도 모릅니다
  lexicon: HALOT
  rationale: נשא는 ‘들다, 옮기다, 실어 가다’의 뜻이 있어, 여기서는 엘리야가 예기치 않게 이동되는 상황을 자연스럽게 드러내는 ‘데려가다’가 적합합니다. 가능성 표현도 문맥의 우려를 따라 살렸습니다.
- source_word: עֲל אֲשֶׁר לֹא אֵדָע
  english_pob_choice: where I do not know
  chosen_korean: 내가 알지 못하는 곳으로
  alternatives_korean:
  - 어디인지 알지 못하는 곳으로
  - 내가 모르는 곳으로
  - 어디로인지 알지 못하는 곳으로
  lexicon: HALOT
  rationale: 히브리어는 목적지를 알 수 없다는 뜻이므로, 한국어에서는 더 자연스럽고 직역에 가까운 ‘알지 못하는 곳으로’로 옮겼습니다.
- source_word: וְעַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 하인
  - 당신의 종복
  lexicon: HALOT
  rationale: 여기서는 엘리야에게 대한 겸양적 자기호칭이므로, POB의 문맥 판단을 따라 ‘종’이 가장 자연스럽습니다. ‘노예’는 이 절의 관계를 지나치게 물화할 수 있습니다.
- source_word: יָרֵא אֶת יְהוָה
  english_pob_choice: has feared Yahweh
  chosen_korean: 야훼를 경외해 왔습니다
  alternatives_korean:
  - 야훼를 두려워해 왔습니다
  - 야훼를 경외했습니다
  - 야훼를 두려워했습니다
  lexicon: HALOT
  rationale: 하나님을 대상으로 한 ירא는 단순 공포보다 경외의 의미가 강하므로 ‘경외하다’가 더 정확합니다. 완료된 삶의 지속성을 살리기 위해 ‘-해 왔습니다’를 사용했습니다.
theological_decisions:
- issue: יהוה(야훼)의 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 프로젝트의 표준에 따라 신적 고유명은 전통적 대체어보다 음역형 ‘야훼’를 사용해 본문의 언약적 고유성을 보존합니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH'
