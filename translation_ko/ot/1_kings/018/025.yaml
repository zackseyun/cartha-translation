reference: 1 Kings 18:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלִיָּ֜הוּ לִ/נְבִיאֵ֣י הַ/בַּ֗עַל בַּחֲר֨וּ לָ/כֶ֜ם הַ/פָּ֤ר הָֽ/אֶחָד֙ וַ/עֲשׂ֣וּ רִאשֹׁנָ֔ה כִּ֥י אַתֶּ֖ם הָ/רַבִּ֑ים וְ/קִרְאוּ֙ בְּ/שֵׁ֣ם אֱלֹהֵי/כֶ֔ם וְ/אֵ֖שׁ לֹ֥א תָשִֽׂימוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/025.yaml
  text: Then Elijah said to the prophets of Baal[a], “Choose one bull for yourselves and prepare it first, because you are many; then call on the name of your god[b], but put no fire under it.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''call on the name of your god''; the idiom means to invoke or appeal to the deity.'
    reason: lexical_alternative
  - marker: b
    text: Or 'put no fire'; the Hebrew does not explicitly say 'under it,' though that is implied by the sacrificial context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 엘리야가 바알의 예언자들에게 말했습니다. “여러분을 위해 한 마리의 수소를 택하여 먼저 준비하십시오. 여러분이 많기 때문입니다. 그리고 여러분의 신의 이름으로 부르십시오. 그러나 불은 붙이지 마십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 '불을 두지 말라'에 가깝습니다. 제사 준비 문맥상 불을 붙이지 말라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여러분의 신’은 히브리어의 단수 대상(바알)을 반영합니다.
    reason: theological_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 자연스러운 현대 한국어로 살려, 앞 사건에서 이어지는 즉각적 발화를 표현했습니다.
- source_word: לִנְבִיאֵי הַבַּעַל
  english_pob_choice: to the prophets of Baal
  chosen_korean: 바알의 예언자들에게
  alternatives_korean:
  - 바알의 선지자들에게
  - 바알 예언자들에게
  lexicon: HALOT
  rationale: 지시 대상은 바알에 속한 예언자들이므로 소유격 구조를 살려 번역했습니다. '예언자'는 מקור의 직능을 직접 반영합니다.
- source_word: הַפָּר הָאֶחָד
  english_pob_choice: one bull
  chosen_korean: 한 마리의 수소
  alternatives_korean:
  - 한 마리의 황소
  - 그 한 마리의 수소
  lexicon: HALOT
  rationale: 문맥상 제사용 수송아지/황소를 가리키므로 자연스러운 현대 한국어로 '수소'를 택했고, 단수의 선택성을 살려 '한 마리'로 옮겼습니다.
- source_word: וְאֵשׁ לֹא תָשִׂימוּ
  english_pob_choice: but put no fire under it
  chosen_korean: 그러나 불은 붙이지 마십시오
  alternatives_korean:
  - 그러나 불을 놓지 마십시오
  - 그러나 불은 두지 마십시오
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '불을 두지 말라'는 금지이며, 제물 준비 맥락에서 실제 의미는 점화하지 말라는 뜻입니다. 한국어에서는 자연스럽고 오해가 적은 표현으로 옮겼습니다.
theological_decisions:
- issue: אֱלֹהֵיכֶם의 단수/복수 뉘앙스
  chosen_reading: 여러분의 신
  alternative_readings:
  - 여러분의 신들
  - 여러분의 하나님
  rationale: 문맥상 바알 한 신을 가리키므로 단수로 옮겼습니다. 동시에 바알을 참하나님으로 오해하지 않도록 일반명사 '신'을 유지했습니다.
  doctrine_reference: 본문 문맥 우선; 우상 숭배 대상에 대한 지칭
