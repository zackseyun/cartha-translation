  to: 그러자 엘리야가 바알의 예언자들에게 말했습니다. “여러분이 수소 한 마리를 택하여 먼저 준비하십시오. 여러분이 수가 많으니, 여러분의 신의 이름을 부르십시오[a]. 그러나 불은 놓지 마십시오[b].”
