  text: וַ/יֹּ֨אמֶר אֵלִיָּ֜הוּ לִ/נְבִיאֵ֣י הַ/בַּ֗עַל בַּחֲר֨וּ לָ/כֶ֜ם הַ/פָּ֤ר הָֽ/אֶחָד֙ וַ/עֲשׂ֣וּ רִאשֹׁנָ֔ה כִּ֥י אַתֶּ֖ם הָ/רַבִּ֑ים וְ/קִרְאוּ֙ בְּ/שֵׁ֣ם אֱלֹהֵי/כֶ֔ם וְ/אֵ֖שׁ לֹ֥א תָשִֽׂימוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/025.yaml
  text: Then Elijah said to the prophets of Baal[a], “Choose one bull for yourselves and prepare it first, because you are many; then call on the name of your god[b], but put no fire under it.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''call on the name of your god''; the idiom means to invoke or appeal to the deity.'
    reason: lexical_alternative
  - marker: b
    text: Or 'put no fire'; the Hebrew does not explicitly say 'under it,' though that is implied by the sacrificial context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 엘리야가 바알의 예언자들에게 말했습니다. “여러분이 수소 한 마리를 택하여 먼저 준비하십시오. 여러분이 수가 많으니, 여러분의 신의 이름을 부르십시오[a]. 그러나 불은 놓지 마십시오[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘이름을 부르다’는 그 신에게 부르짖거나 호소한다는 뜻의 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘불을 놓지 말라’라고 합니다. 불을 제물 아래에 놓는다는 말은 본문에 명시되어 있지 않지만 제사 문맥에서 함의됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
