  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 자연스러운 현대 한국어로 살려, 앞 사건에서 이어지는 즉각적 발화를 표현했습니다.
- source_word: לִנְבִיאֵי הַבַּעַל
  english_pob_choice: to the prophets of Baal
  chosen_korean: 바알의 예언자들에게
  alternatives_korean:
  - 바알의 선지자들에게
  - 바알 예언자들에게
  lexicon: HALOT
  rationale: 지시 대상은 바알에 속한 예언자들이므로 소유격 구조를 살려 번역했습니다. '예언자'는 מקור의 직능을 직접 반영합니다.
- source_word: הַפָּר הָאֶחָד
  english_pob_choice: one bull
  chosen_korean: 한 마리의 수소
  alternatives_korean:
  - 한 마리의 황소
  - 그 한 마리의 수소
  lexicon: HALOT
  rationale: 문맥상 제사용 수송아지/황소를 가리키므로 자연스러운 현대 한국어로 '수소'를 택했고, 단수의 선택성을 살려 '한 마리'로 옮겼습니다.
- source_word: וְאֵשׁ לֹא תָשִׂימוּ
  english_pob_choice: but put no fire under it
  chosen_korean: 그러나 불은 붙이지 마십시오
  alternatives_korean:
  - 그러나 불을 놓지 마십시오
  - 그러나 불은 두지 마십시오
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '불을 두지 말라'는 금지이며, 제물 준비 맥락에서 실제 의미는 점화하지 말라는 뜻입니다. 한국어에서는 자연스럽고 오해가 적은 표현으로 옮겼습니다.
theological_decisions:
