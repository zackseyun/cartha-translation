  yaml_path: translation/ot/1_kings/018/020.yaml
  text: So Ahab sent to all the sons of Israel and gathered the prophets to Mount Carmel[a].
  footnotes:
  - marker: a
    text: Or 'to all the Israelites.' The Hebrew reads literally 'to all the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 아합이 온 이스라엘 자손에게 사람을 보내고 예언자들을 갈멜 산에 모았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들 모두에게’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘이스라엘의 아들들 모두에게’라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 사람을 보내고
  alternatives_korean:
  - 보내고
  - 전하고
  - 소집하고
  lexicon: HALOT
  rationale: שׁלח는 기본적으로 ‘보내다’라는 뜻이므로 이를 살리되, 문맥상 아합이 사람들을 파견한 것으로 이해해 ‘사람을 보내고’로 풀었습니다.
- source_word: בְּכָל בְּנֵי יִשְׂרָאֵל
  english_pob_choice: to all the sons of Israel
  chosen_korean: 온 이스라엘 자손에게
  alternatives_korean:
  - 온 이스라엘 사람들에게
  - 온 이스라엘에게
  - 이스라엘의 모든 아들들에게
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘이스라엘의 아들들’이지만, 한국어에서는 혈연적·민족적 집합을 자연스럽게 드러내는 ‘이스라엘 자손’이 원문과 관용을 함께 살립니다.
- source_word: וַיִּקְבֹּץ
  english_pob_choice: gathered
  chosen_korean: 모았습니다
  alternatives_korean:
  - 모으고
  - 소집했습니다
  - 집합시켰습니다
  lexicon: HALOT
  rationale: קבץ는 ‘모으다, 모이다’의 뜻이므로 한국어에서 가장 자연스러운 서술형으로 ‘모았습니다’를 택했습니다.
- source_word: הַנְּבִיאִים
  english_pob_choice: the prophets
  chosen_korean: 예언자들을
  alternatives_korean:
  - 선지자들을
  - 선견자들을
  - 예언자들
  lexicon: HALOT
  rationale: 히브리어 נביאים는 일반적으로 ‘예언자들’이며, 본문이 아합이 불러 모은 사람들을 가리키므로 표준적인 복수 목적격으로 옮겼습니다.
- source_word: אֶל הַר הַכַּרְמֶל
  english_pob_choice: to Mount Carmel
  chosen_korean: 갈멜 산에
  alternatives_korean:
  - 갈멜산에
  - 갈멜의 산에
  - 갈멜 산으로
  lexicon: HALOT
  rationale: 지명 구문은 관용적으로 ‘갈멜 산’으로 옮기는 것이 가장 자연스럽고, 전치사 אֶל은 목적지 방향을 드러내므로 조사 ‘-에’로 반영했습니다.
theological_decisions:
- issue: ‘예언자들’의 직역 선택
  chosen_reading: 전통적 교회어인 ‘선지자들’보다 본문의 히브리어 נביאים에 가까운 ‘예언자들’을 본문어로 유지했습니다.
  alternative_readings:
  - 선지자들
  rationale: 이 단락은 제도적 교회 용어보다 원문 어휘의 직접 대응이 더 중요하므로, 시대착오적 관용을 줄이고 מקור의 직역성을 살렸습니다.
  doctrine_reference: 성경 번역의 원문 충실성 원칙
- issue: ‘이스라엘 자손’의 성별 표지 보존
  chosen_reading: ‘이스라엘 자손’으로 옮겨 בְּנֵי의 남성 복수 표지를 가능한 한 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 원문은 단순 집합명사보다 ‘아들들’이라는 혈연 표현을 사용하므로, 의미를 완화하는 평준화보다 원문의 사회적·수사적 뉘앙스를 보존했습니다.
  doctrine_reference: 원문 형식 보존과 본문 의미의 공시성
