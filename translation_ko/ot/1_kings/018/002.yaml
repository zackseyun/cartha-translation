theological_decisions:
- issue: 엘리야가 아합에게 ‘자신을 보였다’는 표현의 직역성
  chosen_reading: ‘아합에게 자신을 보이러’로 유지해, 엘리야가 왕 앞에 단순 방문이 아니라 의도적으로 나타나는 장면임을 드러냈습니다.
  alternative_readings:
  - ‘아합에게 나타나러’
  - ‘아합에게 자신을 알리러’
  rationale: 본문의 לְהֵרָאוֹת은 단순 이동보다 공개적 출현의 성격이 강하므로, 서술적 완곡화보다 원문의 긴장을 살리는 쪽이 적절합니다.
  doctrine_reference: 서사적 서술의 충실성
