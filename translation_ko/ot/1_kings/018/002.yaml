  terminology: ‘엘리야’, ‘아합’, ‘사마리아’, ‘기근’은 표준적인 성경 고유명사 및 핵심 용어입니다. 각주 b는 원문의 형용사 חָזָק에 관한 어휘 대안을 제시해야 하므로, 장소 표현의 어순 대안이 아니라 ‘몹시 심했습니다’ 같은 강도 표현을 제시하는 편이 적절합니다.
