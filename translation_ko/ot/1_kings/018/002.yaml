revisions:
- from: 그래서 엘리야는 아합에게 자신을 보이러 갔습니다. 그런데 사마리아의 기근은 매우 심했습니다.[a][b]
  to: 그리하여 엘리야는 아합에게 자신을 보이려고[a] 갔습니다. 사마리아의 기근은 매우 심했습니다.[b]
  rationale: 서사 진행을 나타내는 와우 연속형은 ‘그리하여’로 정중한 문체 안에서 자연스럽게 옮겼습니다. ‘자신을 보이려고’는 니팔형의 재귀적 출현 의미를 유지하며, 각주를 해당 어구 바로 뒤에 배치했습니다. 기근의 심각성을 뜻하는 חָזָק의 대안은 어순이 아니라 강도 어휘로 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:50:46Z'
