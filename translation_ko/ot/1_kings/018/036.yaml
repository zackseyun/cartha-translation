revisions:
- from: 그리고 그레인 제물을 드리는 때에 엘리야 예언자가 가까이 나아가 말했습니다. "야훼, 아브라함과 이삭과 이스라엘의 하나님, 오늘 당신이 이스라엘 가운데 하나님이시며 제가 당신의 종임을 알려 주십시오. 또한 제가 당신의 말씀대로 이 모든 일을 행했음을 알려 주십시오."[a][b]
  to: 곡식 제물을 드릴 때가 되자 엘리야 예언자가 가까이 나아와 말했습니다. “야훼, 아브라함과 이삭과 이스라엘[a]의 하나님, 오늘 당신께서 이스라엘 가운데 하나님이시고 제가 당신의 종이며, 제가 당신의 말씀대로[b] 이 모든 일을 행했다는 것이 알려지게 하여 주십시오.”
  rationale: 원문의 기원형 ‘오늘 알려지게 하여 주십시오’가 뒤따르는 세 병렬 내용 전체를 지배하도록 문장을 재구성했습니다. ‘그레인 제물’을 ‘곡식 제물’로 고쳐 현대 표준어의 자연스러움과 원어의 제물 종류를 함께 살렸으며, ‘이스라엘’ 각주를 해당 이름에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:50:56Z'
