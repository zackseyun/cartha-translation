  verdict: revise
  source_fidelity: 핵심 어휘와 내용은 대체로 원문에 충실하나, 원문의 יִוָּדַע(‘알려지게/드러나게 하여 주십시오’)는 하나님께 어떤 사실을 ‘알려 달라’고 요청하는 뜻이 아닙니다. 세 병렬 절 전체가 오늘 공개적으로 알려지기를 구하는 기도이므로 이를 분명히 해야 합니다.
  naturalness: ‘그레인 제물’은 현대 표준 한국어에서 부자연스러운 외래어 혼용입니다. ‘곡식 제물’이 자연스럽고 מִנְחָה의 구체성도 보존합니다. 또한 각주 표지는 해당 어구에 직접 붙이는 편이 독해에 명료합니다.
  terminology: ‘야훼’, ‘아브라함과 이삭과 이스라엘의 하나님’, ‘당신의 종’, ‘당신의 말씀대로’는 적절합니다. 다만 ‘이스라엘’ 본문 읽기를 설명하는 각주 a는 본문의 ‘이스라엘’ 바로 뒤에 배치해야 합니다.
  issues:
