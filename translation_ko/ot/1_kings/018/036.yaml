id: 1KI.18.36
reference: 1 Kings 18:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/עֲל֣וֹת הַ/מִּנְחָ֗ה וַ/יִּגַּ֞שׁ אֵלִיָּ֣הוּ הַ/נָּבִיא֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל הַ/יּ֣וֹם יִוָּדַ֗ע כִּֽי אַתָּ֧ה אֱלֹהִ֛ים בְּ/יִשְׂרָאֵ֖ל וַ/אֲנִ֣י עַבְדֶּ֑/ךָ ו/ב/דברי/ך עָשִׂ֔יתִי אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/036.yaml
  text: And it happened[a], at the offering up of the grain offering, that Elijah the prophet came near and said, “O Yahweh, God of Abraham, Isaac, and Israel, let it be known today that you are God in Israel, and that I am your servant[b], and that by your word I have done all these things.”
  footnotes:
  - marker: a
    text: Hebrew 'Israel'; many readers may expect 'Jacob' from the more familiar patriarchal formula, but the text here specifically reads 'Israel.'
    reason: alternative_reading
  - marker: b
    text: Or 'according to your word' / 'at your word.'
    reason: lexical_alternative
translation:
  language: ko
  text: 곡식 제물을 드릴 때가 되자 엘리야 예언자가 가까이 나아와 말했습니다. “야훼, 아브라함과 이삭과 이스라엘[a]의 하나님, 오늘 당신께서 이스라엘 가운데 하나님이시고 제가 당신의 종이며, 제가 당신의 말씀대로[b] 이 모든 일을 행했다는 것이 알려지게 하여 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 익숙한 족장 공식의 ‘야곱’이 아니라 ‘이스라엘’이라고 읽습니다.
    reason: source_note
  - marker: b
    text: 또는 ‘당신의 말씀에 따라’ / ‘당신의 말씀으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלוֹת הַמִּנְחָה
  english_pob_choice: at the offering up of the grain offering
  chosen_korean: 그레인 제물을 드리는 때에
  alternatives_korean:
  - 곡식 제물을 바칠 때에
  - 소제물을 드리는 때에
  - 곡식 제물을 올릴 때에
  lexicon: HALOT
  rationale: מִנְחָה를 제물의 종류로 살리면서, 오름/드림의 동작도 자연스러운 현대 한국어로 옮겼습니다. '그레인 제물'은 POB의 'grain offering'을 직접 반영해 소제의 특정성을 유지합니다.
- source_word: וַיִּגַּשׁ
  english_pob_choice: came near
  chosen_korean: 가까이 나아가
  alternatives_korean:
  - 다가가
  - 나아와
  - 접근하여
  lexicon: HALOT
  rationale: 숭고하고 의례적인 접근의 뉘앙스를 살리기 위해 '가까이 나아가'를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 문맥상 고유 신명 יהוה를 그대로 음역해야 하므로, 관용적 치환어인 '주님' 대신 프로젝트 기본값인 '야훼'를 사용했습니다.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  english_pob_choice: God of Abraham, Isaac, and Israel
  chosen_korean: 아브라함과 이삭과 이스라엘의 하나님
  alternatives_korean:
  - 아브라함과 이삭과 야곱의 하나님
  lexicon: HALOT
  rationale: 히브리어 본문이 '이스라엘'이라고 직접 말하므로, 익숙한 '야곱'으로 조화하지 않고 그대로 옮겼습니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 일꾼
  lexicon: HALOT
  rationale: 예언자적 충성 맥락에서는 '종'이 가장 자연스럽지만, 원문의 종속 관계를 분명히 드러내도록 했습니다. 여기서는 POB의 'servant'를 한국어 표준 종교어휘로 옮겼습니다.
- source_word: וּבִדְבָרֶךָ
  english_pob_choice: by your word
  chosen_korean: 당신의 말씀대로
  alternatives_korean:
  - 당신의 말씀으로
  - 당신의 말에 따라
  - 당신의 명령에 따라
  lexicon: HALOT
  rationale: בְּ + דָּבָר의 규범/근거 의미를 현대 한국어에서 가장 자연스럽게 살릴 수 있는 표현으로 옮겼습니다. '말씀'은 하나님의 권위 있는 발화를 가리키는 문맥상 적절한 대응입니다.
- source_word: עָשִׂיתִי אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: I have done all these things
  chosen_korean: 제가 이 모든 일을 행했음을
  alternatives_korean:
  - 제가 이 모든 것을 했음을
  - 제가 이 모든 말씀들을 행했음을
  - 제가 이 모든 일을 했음을
  lexicon: HALOT
  rationale: דְּבָרִים는 여기서 '말씀들'보다 '일/일들'의 뜻이 자연스럽고, 맥락상 엘리야의 행위를 가리키므로 '일'로 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접 호명 유지
  chosen_reading: 기도문 안에서 하나님의 고유 이름을 '야훼'로 직접 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 제의적 기도 속에서도 יהוה를 직접 사용하므로, 호칭으로 완화하지 않고 고유 이름을 보존했습니다. 이는 본문이 강조하는 언약적 친밀성과 직접성을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 이스라엘/야곱 조화 방지
  chosen_reading: 족장 공식은 '아브라함과 이삭과 이스라엘'로 유지했습니다.
  alternative_readings:
  - 아브라함과 이삭과 야곱
  rationale: 본문 자체의 표기를 따르며, 후대 독자의 익숙한 공식으로 평준화하지 않았습니다. 이는 서술이 의도한 '이스라엘'이라는 현재적 언약 정체성을 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1 Original-language primacy over translation tradition
