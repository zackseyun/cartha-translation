reference: 1 Kings 18:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/שְּׁבִעִ֔ית וַ/יֹּ֗אמֶר הִנֵּה עָ֛ב קְטַנָּ֥ה כְּ/כַף אִ֖ישׁ עֹלָ֣ה מִ/יָּ֑ם וַ/יֹּ֗אמֶר עֲלֵ֨ה אֱמֹ֤ר אֶל אַחְאָב֙ אֱסֹ֣ר וָ/רֵ֔ד וְ/לֹ֥א יַעַצָרְ/כָ֖ה הַ/גָּֽשֶׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/044.yaml
  text: And it happened on the seventh time that he said[a], “Look, a small cloud, like a man’s palm, is rising from the sea.” Then he said, “Go up, say to Ahab, ‘Harness your chariot and go down[c][b], so that the rain does not stop you.’”
  footnotes:
  - marker: a
    text: Or “like the palm of a man’s hand.”
    reason: lexical_alternative
  - marker: b
    text: “Harness up” refers to hitching or preparing the chariot/team for travel.
    reason: cultural_note
  - marker: c
    text: Or “lest the rain detain you” or “hold you back.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 일곱 번째가 되었을 때 그가 말했습니다. 「보십시오, 사람의 손바닥만 한 작은 구름이 바다에서 올라오고 있습니다.」 그러자 그가 말했습니다. 「올라가서 아합에게 말하십시오. ‘마차를 준비하고 내려가십시오. 비가 당신을 멈추게 하지 않도록 말입니다.’」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람의 손바닥’은 문자적으로는 ‘한 남자의 손바닥’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘마차를 준비하고’는 전차/마차와 그 말들을 출발할 수 있게 갖추라는 관용적 표현입니다.
    reason: cultural_note
  - marker: c
    text: ‘멈추게 하지 않도록’은 ‘붙들다/지체시키다’의 의미를 풀어 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁבִעִית
  english_pob_choice: on the seventh time
  chosen_korean: 일곱 번째가 되었을 때
  alternatives_korean:
  - 일곱 번째에
  - 일곱 번째 때
  lexicon: HALOT
  rationale: 문맥상 반복해서 살펴본 일곱 번째 관찰 시점을 가리키므로, 한국어에서는 자연스럽게 사건의 시점을 드러내는 표현으로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 눈에 들어온 광경을 즉시 주의를 끄는 말로 제시하는 기능을 살려, 현대적이면서도 직접적인 「보십시오」를 택했습니다.
- source_word: עָב קְטַנָּה כְּכַף אִישׁ
  english_pob_choice: a small cloud, like a man’s palm
  chosen_korean: 사람의 손바닥만 한 작은 구름
  alternatives_korean:
  - 한 사람의 손바닥 같은 작은 구름
  - 작은 구름, 사람의 손바닥 크기만 한
  lexicon: HALOT
  rationale: כְּכַף는 크기 비교이므로 한국어에서는 「-만 한」 구문이 가장 자연스럽고, ‘אִישׁ’는 문자적으로 남성 단수의 인체 비교를 살려 「사람의 손바닥」으로 옮겼습니다.
- source_word: אֱסֹר
  english_pob_choice: Harness your chariot
  chosen_korean: 마차를 준비하고
  alternatives_korean:
  - 마차를 갖추고
  - 마차를 매고
  lexicon: HALOT
  rationale: 문맥상 전차/마차를 타고 떠날 준비를 하라는 뜻이므로, 한국어에서는 과도하게 직역한 ‘매다’보다 이동 준비를 드러내는 표현으로 옮겼습니다.
- source_word: וְלֹא יַעַצָרְכָה הַגָּשֶׁם
  english_pob_choice: so that the rain does not stop you
  chosen_korean: 비가 당신을 멈추게 하지 않도록 말입니다
  alternatives_korean:
  - 비가 당신을 붙들지 않도록 말입니다
  - 비가 당신을 지체시키지 않도록 말입니다
  lexicon: HALOT
  rationale: עצר는 막다, 붙들다, 지체시키다의 의미가 있으므로, POB의 직설적 표현을 살리되 현대 한국어에서 자연스러운 「멈추게 하지 않도록」으로 옮겼습니다.
theological_decisions:
- issue: 아합에게 전하는 명령문의 경어 수준
  chosen_reading: 직접 인용 안쪽은 왕에게 하는 명령이므로, 한국어에서는 공손한 명령형 「-십시오」를 사용했습니다.
  alternative_readings:
  - 반말 명령형으로 직역
  - 더 높은 궁정체로 완곡화
  rationale: 히브리어 원문은 단순 명령이지만, 한국어 독자에게 아합이 대상임을 분명히 하면서도 공적 발화의 긴장을 유지하는 수준을 택했습니다.
  doctrine_reference: 서사체의 발화 대상과 한국어 존대 체계 조정
