  rationale: 반복된 관찰의 일곱 번째 시점을 명확히 하고, 전차에 말을 매는 원문의 구체적 행위를 살렸습니다. 마지막 경고문은 비가 여행을 지체시킬 수 있다는 뜻을 자연스러운 현대 한국어 합쇼체로 옮겼으며, 각주 표지를 해당 어구에 직접 연결했습니다.
