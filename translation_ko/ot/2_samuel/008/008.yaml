  yaml_path: translation/ot/2_samuel/008/008.yaml
  text: And from Betah and from Berothai[a], cities of Hadadezer[c][b], King David took very much bronze.
  footnotes:
  - marker: a
    text: The parallel account in 1 Chronicles 18:8 names these places as Tibhath and Cun; this verse's Hebrew text reads Betah and Berothai.
    reason: cross_reference
  - marker: b
    text: Or 'Berothah,' reflecting a related place-name form in some translations.
    reason: lexical_alternative
  - marker: c
    text: Or 'copper'; the Hebrew term can refer to copper or bronze, depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 베타와 베로타이[a][b]—하닷에셀의 성읍들—에서 다윗 왕이 매우 많은 청동[c]을 가져갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대역대기 18:8에서는 이곳들이 디브핫과 쿤으로 나옵니다. 여기의 히브리어 본문은 베타와 베로타이로 읽습니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘베로다’로도 옮길 수 있습니다. 관련된 지명형의 차이를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘구리’입니다. 히브리어 נְחֹשֶׁת은 문맥에 따라 구리나 청동을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּטַח
  english_pob_choice: and from Betah
  chosen_korean: 베타에서
  alternatives_korean:
  - 베턱에서
  - 테바에서
  lexicon: HALOT
  rationale: 전치사와 접속을 자연스럽게 반영해 ‘에서’로 옮기고, 지명은 MT의 형태를 따라 음역했습니다. 1역대 18:8의 대응 지명 차이는 각주로 보존합니다.
- source_word: וּמִבֵּרֹתַי
  english_pob_choice: and from Berothai
  chosen_korean: 베로타이에서
  alternatives_korean:
