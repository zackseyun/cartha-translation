  yaml_path: translation/ot/2_samuel/008/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
  footnotes:
  - marker: a
    text: Hebrew אֲרַם is rendered 'Aram' rather than the traditional 'Syria'; it refers to the Aramean kingdom centered at Damascus.
    reason: lexical_alternative
  - marker: b
    text: Hadadezer is spelled 'Hadarezer' in some passages and translations.
    reason: alternative_reading
translation:
  language: ko
  text: 다메섹의 아람이 소바 왕 하닷에셀을 돕기 위해 왔고, 다윗이 아람 사람 이만이천 명을 쳐서 쓰러뜨렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֲרַם은 전통적 ‘시리아’보다 ‘아람’으로 옮겼으며, 이는 다메섹을 중심으로 한 아람 왕국을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 하닷에셀은 일부 본문과 번역에서 ‘하다레셀’로도 적힙니다.
    reason: alternative_reading
