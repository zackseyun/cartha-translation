base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/016.yaml
  text: And Joab son of Zeruiah was over the army[b][a], and Jehoshaphat son of Ahilud was recorder.
  footnotes:
  - marker: a
    text: Or 'was in command of the army.'
    reason: lexical_alternative
  - marker: b
    text: '''Recorder'' refers to a royal official responsible for keeping records and reporting matters to the king; alternatively, ''secretary'' or ''chronicler.'''
    reason: cultural_note
translation:
  language: ko
  text: 그리고 요압—스루야의 아들—은 군대의 책임자였고, 아힐룻의 아들 여호사밧은 기록관이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '군대를 지휘하였습니다.'
    reason: alternative_reading
  - marker: b
    text: '''기록관''은 왕에게 보고하고 기록을 관리하는 궁정 관리로, ''비서''나 ''서기관''으로도 옮길 수 있습니다.'
    reason: cultural_note
lexical_decisions:
- source_word: עַל הַצָּבָא
  english_pob_choice: was over the army
  chosen_korean: 군대의 책임자였고
  alternatives_korean:
  - 군대 위에 있었고
  - 군대를 관장했고
  - 군대의 지휘관이었고
  lexicon: HALOT
  rationale: עַל + 직분 표기는 단순한 위치가 아니라 감독·책임의 뜻을 띠므로, POB의 'was over the army'를 한국어로 자연스럽게 살려 '군대의 책임자'로 옮겼습니다.
- source_word: מַזְכִּיר
  english_pob_choice: recorder
  chosen_korean: 기록관
  alternatives_korean:
  - 서기관
  - 비서
  - 기록원
  lexicon: HALOT
  rationale: מַזְכִּיר는 왕실 행정직을 가리키는 말이므로, 현대적 '비서'보다 직분적 의미가 분명한 '기록관'을 택했습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 자녀
  - 후손
  lexicon: HALOT
  rationale: 계보·관직 목록의 형식에 맞게 בֶּן을 직역하여 '아들'로 유지했습니다.
- source_word: יוֹאָב / צְרוּיָה / יְהוֹשָׁפָט / אֲחִילוּד
  english_pob_choice: Joab / Zeruiah / Jehoshaphat / Ahilud
  chosen_korean: 요압 / 스루야 / 여호사밧 / 아힐룻
  alternatives_korean:
  - 요아브 / 제루야 / 여호사팟 / 아히룻
  lexicon: 고유명사 표기 관례
  rationale: 이미 널리 정착된 한국어 성경 표기를 따르되, 히브리어 인명은 현대 표기 관례에 맞춰 옮겼습니다.
theological_decisions:
- issue: 궁정 직함의 의미를 일반 직업명으로 약화시키지 않을지
  chosen_reading: '''기록관''으로 왕실 행정직임을 드러내고, ''군대의 책임자''로 단순한 군사적 위치가 아니라 관직적 감독을 나타냈습니다.'
  alternative_readings:
  - 서기관
  - 비서
  - 군대의 지휘관
  rationale: 이 절은 다윗 왕국의 관직 목록이므로, 본문의 행정적·궁정적 성격을 유지하는 번역이 필요합니다.
  doctrine_reference: 사무엘하 8장 궁정 관직 목록
