base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/001.yaml
  text: And after this[a], David struck the Philistines and subdued them, and David took Metheg-ammah from the hand of the Philistines.
  footnotes:
  - marker: a
    text: Hebrew 'the bridle of the mother city,' a difficult phrase. It may refer idiomatically to control of the chief city; compare 1 Chronicles 18:1, which reads 'Gath and its daughter towns.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후에 다윗은 블레셋 사람들을 쳐서 그들을 굴복시키고, 블레셋 사람들의 손에서 메테그 암마를 빼앗았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘메테그 암마’는 난해한 표현입니다. 문자적으로는 ‘어머니 도시의 재갈’로 이해될 수 있으며, 중심 도시의 통제나 지배를 가리키는 관용일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  english_pob_choice: And after this
  chosen_korean: 그 후에
  alternatives_korean:
  - 이 일 후에
  - 그런 다음
  lexicon: HALOT
  rationale: 서사 전환을 자연스러운 현대 한국어로 옮기되, 시간적 이어짐을 분명히 살렸습니다.
- source_word: וַיַּךְ
  english_pob_choice: struck
  chosen_korean: 쳐서
  alternatives_korean:
  - 쳤습니다
  - 타격하여
  lexicon: HALOT
  rationale: נכה의 기본적인 ‘치다/치다(공격하다)’의 구체성을 살리면서 군사적 패배의 뉘앙스를 유지했습니다.
- source_word: וַיַּכְנִיעֵם
  english_pob_choice: subdued them
  chosen_korean: 그들을 굴복시키고
  alternatives_korean:
  - 그들을 복종시키고
  - 그들을 제압하고
  lexicon: HALOT
  rationale: 히필 형태의 ‘복종하게 하다/굴복시키다’ 의미를 반영해, 단순한 패배보다 지배 아래 두는 결과를 드러냈습니다.
- source_word: מֶתֶג הָאַמָּה
  english_pob_choice: Metheg-ammah
  chosen_korean: 메테그 암마
  alternatives_korean:
  - 메덱 암마
  - 암마의 재갈
  lexicon: HALOT
  rationale: POB가 본문에서는 transliteration을 택하고 난해한 표현은 각주로 설명하므로, 한국어 본문도 음역을 유지해 해석을 과도하게 고정하지 않았습니다.
theological_decisions:
- issue: 전리품/군사적 승리 서술의 톤
  chosen_reading: 본문의 전쟁 서술을 완화하지 않고, 다윗의 군사적 승리와 점유 이동을 직설적으로 표현했습니다.
  alternative_readings:
  - 승리하여 차지했습니다
  - 정복했습니다
  rationale: 히브리어 동사들의 연쇄가 만들어 내는 공적 승리 서술을 그대로 드러내는 것이 본문 의미를 가장 잘 보존합니다.
  doctrine_reference: 사무엘서의 역사서 서술 원리
