  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח תֹּ֣עִי אֶת יֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִד לִ/שְׁאָל ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עִי הָיָ֣ה הֲדַדְעָ֑זֶר וּ/בְ/יָד֗/וֹ הָי֛וּ כְּלֵֽי כֶ֥סֶף וּ/כְלֵֽי זָהָ֖ב וּ/כְלֵ֥י נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/010.yaml
  text: Then Toi sent Joram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Toi; and in his hand were articles of silver, articles of gold[b], and articles of bronze.
  footnotes:
  - marker: a
    text: Or, more smoothly, 'for Hadadezer had been at war with Toi.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'in his hand were'—that is, he carried these items with him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 도이가 그의 아들 요람을 다윗 왕에게 보내어 그의 안부를 묻고 그를 축복하게 했습니다. 이는 그가 하닷에셀과 싸워 그를 쳐부쉈기 때문입니다[a]. 하닷에셀은 도이와 전쟁을 벌여 온 사람이었고, 그의 손에는 은그릇과 금그릇[b], 놋그릇이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는 ‘하닷에셀이 도이와 전쟁을 벌여 왔기 때문입니다’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 손에는’이지만, 실제 의미는 그가 이것들을 가지고 왔다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח תֹּעִי אֶת יוֹרָם בְּנוֹ
  english_pob_choice: Then Toi sent Joram his son
  chosen_korean: 그때 도이가 그의 아들 요람을 보내어
  alternatives_korean:
  - 도이가 아들 요람을 보냈습니다
  - 그때 도이가 자기 아들 요람을 보냈습니다
  lexicon: WLC / HALOT
  rationale: 히브리어 어순과 서사 진행을 살리되, 한국어에서는 자연스럽게 ‘그의 아들 요람을’로 옮겨 인물 관계를 분명히 했습니다.
- source_word: לִשְׁאָל לוֹ לְשָׁלוֹם וּלְבָרֲכוֹ
  english_pob_choice: to ask about his welfare and to bless him
  chosen_korean: 그의 안부를 묻고 그를 축복하게
  alternatives_korean:
  - 그의 평안을 묻고 그를 축복하게
  - 그에게 평안을 묻게 하고 그를 축복하게
  lexicon: HALOT
  rationale: שׁאל לְשָׁלוֹם은 단순한 인사보다 ‘안부를 묻다’가 자연스럽고, בָּרַךְ은 외교적 문맥에서도 기본 의미인 ‘축복하다’를 유지했습니다.
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  english_pob_choice: because he had fought against Hadadezer and struck him down
  chosen_korean: 이는 그가 하닷에셀과 싸워 그를 쳐부쉈기 때문입니다
  alternatives_korean:
  - 이는 그가 하닷에셀과 싸워 그를 쳤기 때문입니다
  - 이는 그가 하닷에셀과 맞서 싸워 그를 무찔렀기 때문입니다
  lexicon: HALOT
  rationale: נִלְחַם בְּ는 대적하여 싸우는 뜻이므로 ‘~과 싸워’로 자연스럽게 옮기고, וַיַּכֵּהוּ는 군사적 패배를 드러내는 강한 표현인 ‘쳐부수다’로 처리했습니다.
- source_word: כִּי אִישׁ מִלְחֲמ֥וֹת תֹּעִי הָיָה הֲדַדְעָזֶר
  english_pob_choice: for Hadadezer had been at war with Toi
  chosen_korean: 하닷에셀은 도이와 전쟁을 벌여 온 사람이었고
  alternatives_korean:
  - 하닷에셀은 도이와 전쟁 중이었고
  - 하닷에셀은 도이와 싸움하던 사람이었고
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 한국어에서는 ‘전쟁을 벌여 온 사람’으로 풀어, 지속적 적대 관계라는 의미를 분명히 했습니다.
- source_word: וּבְיָד֗וֹ הָי֛וּ כְּלֵי כֶסֶף וּכְלֵי זָהָב וּכְלֵי נְחֹשֶׁת
  english_pob_choice: and in his hand were articles of silver, articles of gold, and articles of bronze
  chosen_korean: 그의 손에는 은그릇과 금그릇, 놋그릇이 있었습니다
  alternatives_korean:
  - 그의 손에는 은의 기구와 금의 기구, 놋의 기구가 있었습니다
  - 그가 가지고 온 것은 은그릇과 금그릇, 놋그릇이었습니다
  lexicon: HALOT
  rationale: כְּלִי는 넓게 ‘그릇/기구’를 뜻하지만, 금속 목록의 병렬성과 한국어의 읽기 자연성을 고려해 ‘그릇’으로 구체화했습니다.
theological_decisions:
- issue: 다윗에게 보내는 사신의 목적 표현
  chosen_reading: ‘안부를 묻고 그를 축복하게’로 옮겨, 외교적 예우이면서도 축복 행위라는 본문의 이중성을 유지했습니다.
  alternative_readings:
  - ‘평안을 묻고 인사하게’
  - ‘문안하고 축하하게’
  rationale: 본문의 לְשָׁלוֹם은 단순 인사보다 평안/안녕을 확인하는 행위이고, בָּרַךְ은 축복의 동사이므로 둘을 완화하지 않고 함께 살렸습니다.
  doctrine_reference: 본문 문맥의 의미론적 보존
