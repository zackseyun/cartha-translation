reference: 2 Samuel 8:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ דָּוִד֙ שֵׁ֔ם בְּ/שֻׁב֕/וֹ מֵ/הַכּוֹת֥/וֹ אֶת אֲרָ֖ם בְּ/גֵיא מֶ֑לַח שְׁמוֹנָ֥ה עָשָׂ֖ר אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/013.yaml
  text: And David made a name for himself when he returned from striking down Aram in the Valley of Salt—eighteen thousand men[a].
  footnotes:
  - marker: a
    text: Some witnesses and the parallel in 1 Chronicles 18:12 point to 'Edom' rather than 'Aram.'
    reason: textual_variant
translation:
  language: ko
  text: 다윗이 소금 골짜기에서 아람을 쳐부수고 돌아와서 자신을 위하여 이름을 떨쳤습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본들과 역대상 18:12의 병행본문은 ‘아람’ 대신 ‘에돔’을 가리킵니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַשׂ שֵׁם
  english_pob_choice: made a name for himself
  chosen_korean: 자신을 위하여 이름을 떨쳤습니다
  alternatives_korean:
  - 이름을 만들었습니다
  - 명성을 얻었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 עשה שם은 문자적으로 ‘이름을 만들다’이지만, 한국어에서는 ‘이름을 떨치다’가 같은 관용 의미(명성/명예 획득)를 자연스럽게 전달합니다.
- source_word: בְּשֻׁבוֹ מֵהַכּוֹתוֹ
  english_pob_choice: when he returned from striking down
  chosen_korean: 쳐부수고 돌아와서
  alternatives_korean:
  - 쳐서 돌아왔을 때
  - 무찔러 돌아와서
  lexicon: HALOT
  rationale: 반환 시점과 전투 행위를 함께 살리면서도 현대 한국어에서 자연스럽게 읽히도록 동작 연쇄로 옮겼습니다.
- source_word: אֶת אֲרָם
  english_pob_choice: Aram
  chosen_korean: 아람
  alternatives_korean:
  - 아람 사람들
  - 시리아
  lexicon: HALOT
  rationale: 본문 히브리어의 고유명사 ‘아람’을 그대로 옮겨, 후대 지리명인 ‘시리아’로 바꾸거나 민족명으로 풀어쓴 해석을 피했습니다.
- source_word: בְּגֵיא מֶלַח
  english_pob_choice: in the Valley of Salt
  chosen_korean: 소금 골짜기에서
  alternatives_korean:
  - 소금 골짜기 안에서
  - 소금 계곡에서
  lexicon: HALOT
  rationale: 지명 앞의 ב를 한국어 장소 조사 ‘에서’로 옮겨 전투가 벌어진 장소를 분명히 했습니다.
theological_decisions:
- issue: 본문의 적군 명칭(아람)과 병행본문 전승(에돔)
  chosen_reading: 본문은 ‘아람’을 따르고, 병행본문이 제시하는 다른 전승은 각주로 보존했습니다.
  alternative_readings:
  - 에돔
  rationale: 이 절의 히브리어 본문은 아람을 읽지만, 역대상 18:12와 일부 전승은 에돔을 가리키므로 본문-전승의 긴장을 지우지 않고 투명하게 남깁니다.
  doctrine_reference: 원문 우선 및 대조 전승 보존 원칙
