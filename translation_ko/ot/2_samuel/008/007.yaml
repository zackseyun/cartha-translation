translation:
  language: ko
  text: 다윗은 하닷에셀의 종들이 지니고 있던 금 방패들을 취하여 예루살렘으로 가져왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘금으로 만든 방패들’. 히브리어는 문자적으로 ‘금의 방패들’입니다. 소수 견해는 이 말을 ‘화살통들’로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 가져다가
  alternatives_korean:
  - 취했습니다
  - 빼앗았습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 취득이 아니라 전리품을 옮겨 오는 동작이므로, ‘가져다가’가 ‘took’의 자연스러운 서술성과 이동 뉘앙스를 함께 살립니다.
- source_word: שִׁלְטֵי הַזָּהָב
  english_pob_choice: the shields of gold
  chosen_korean: 금 방패들
  alternatives_korean:
  - 황금 방패들
  - 금으로 된 방패들
  lexicon: HALOT
  rationale: 히브리어의 명사구 구조를 살려 직역에 가깝게 ‘금 방패들’로 옮겼습니다. 영어 POB의 각주처럼 ‘golden shields’도 가능하지만, 본문에서는 원문 구성에 더 밀착했습니다.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  english_pob_choice: the servants of Hadadezer
  chosen_korean: 하닷에셀의 종들에게 속한
  alternatives_korean:
  - 하닷에셀의 신하들에게 속한
  - 하닷에셀의 노예들에게 속한
  lexicon: HALOT
  rationale: עַבְדֵי는 여기서 왕실 종속 인물들을 가리키는 문맥이므로 ‘종들’로 두되, 영어 POB의 ‘belonged to’를 반영해 소유 관계를 분명히 했습니다.
- source_word: וַיְבִיאֵם
  english_pob_choice: and brought them
  chosen_korean: 가져왔습니다
  alternatives_korean:
  - 데려왔습니다
  - 옮겨왔습니다
  lexicon: HALOT
  rationale: 히필 형태의 בוא는 ‘데려오다/가져오다’의 의미이므로, 전리품을 예루살렘으로 운반해 온 상황에 맞게 ‘가져왔습니다’로 번역했습니다.
