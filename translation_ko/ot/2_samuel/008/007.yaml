  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 וַיִּקַּח와 וַיְבִיאֵם을 각각 ‘가져다가’와 ‘가져왔습니다’로 옮겨 동일 동작이 불필요하게 중복되어 보입니다. 첫 동사는 ‘취하다’로, 둘째 동사는 예루살렘으로 ‘가져오다’로 구분하는 것이 원문의 두 동사를 더 정확히 반영합니다.
  naturalness: 현 번역은 ‘가져다가 … 가져왔습니다’라는 연속 표현이 부자연스럽고 장황합니다. ‘취하여 예루살렘으로 가져왔습니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘종들에게 속한’도 문법적으로 가능하나, 무생물인 방패와 관련하여 ‘종들이 지니고 있던’이 더 자연스럽습니다.
