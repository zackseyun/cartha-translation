source:
  edition: WLC
  text: וַ/יַּ֣ךְ דָּוִ֔ד אֶת הֲדַדְעֶ֥זֶר בֶּן רְחֹ֖ב מֶ֣לֶךְ צוֹבָ֑ה בְּ/לֶכְתּ֕/וֹ לְ/הָשִׁ֥יב יָד֖/וֹ בִּֽ/נְהַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/003.yaml
  text: David struck down Hadadezer son of Rehob[a], king of Zobah[c][b], when he went to restore his power at the River.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Hadadezer''; some textual traditions and the parallel in 1 Chronicles read ''Hadarezer.'''
    reason: textual_variant
  - marker: b
    text: Or 'to recover his control' or 'to reestablish his dominion'; literally, 'to restore his hand.'
    reason: lexical_alternative
  - marker: c
    text: That is, likely the Euphrates River.
    reason: cross_reference
translation:
  language: ko
  text: 다윗이 소바의 왕 르홉의 아들 하닷에셀[a]을 쳐서 무찔렀습니다. 그는 자기 손[b]을 되찾으러 강[c]에 갔을 때였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 형태는 ‘하닷에셀’이며, 일부 본문 전승과 역대상 평행본문에는 ‘하다르에셀’이 나옵니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘자기 손을 되찾다’입니다. 여기서는 힘, 통치권, 지배력 회복을 가리키는 관용구일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 아마 유프라테스강을 가리키는 것으로 보입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּךְ
  english_pob_choice: struck down
  chosen_korean: 쳐서 무찔렀습니다
  alternatives_korean:
  - 쳤습니다
  - 패배시켰습니다
  lexicon: HALOT
  rationale: 전투 문맥에서 단순한 ‘쳤습니다’보다 결과까지 드러내는 ‘무찔렀습니다’가 영어 POB의 강한 군사적 뉘앙스를 더 잘 반영합니다.
- source_word: בֶּן רְחוֹב
  english_pob_choice: son of Rehob
  chosen_korean: 르홉의 아들
  alternatives_korean:
  - 르홉의 자손
  - 르홉의 아들로
  lexicon: HALOT
  rationale: 히브리어 친족 표지를 자연스럽게 살리기 위해 직역형인 ‘~의 아들’을 유지했습니다.
- source_word: לְהָשִׁיב יָדֹו
  english_pob_choice: to restore his power / to restore his hand
  chosen_korean: 자기 손을 되찾으러
  alternatives_korean:
  - 자기 권세를 회복하러
  - 자기 통치를 회복하러
  lexicon: HALOT
  rationale: 직역의 ‘손’은 유지하되, 한국어에서 자연스러운 표현인 ‘되찾다’를 써서 원문의 관용구와 영어 POB의 주석 처리된 중의성을 함께 살렸습니다.
- source_word: בִּנְהַר
  english_pob_choice: at the River
  chosen_korean: 강
  alternatives_korean:
  - 그 강
  - 유프라테스 강
  lexicon: HALOT
  rationale: 본문의 정관적·절대적 용법을 따라 기본어는 ‘강’으로 두고, 특정 강의 식별은 주석에서 처리했습니다.
theological_decisions:
- issue: 지명 및 고유명사의 음역 유지
  chosen_reading: ‘하닷에셀’, ‘소바’, ‘르홉’을 음역해 본문에 유지했습니다.
  alternative_readings:
  - ‘하데셀’
  - ‘하닷에셀 왕’의 식별을 풀어쓴 번역
  rationale: 본문이 전하는 역사적 인물과 지명을 독자가 그대로 추적할 수 있도록, 통용되는 음역을 최대한 보존했습니다.
  doctrine_reference: 성경 본문의 역사성 및 고유명사 보존 원칙
