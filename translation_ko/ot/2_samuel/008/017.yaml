  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/צָד֧וֹק בֶּן אֲחִיט֛וּב וַ/אֲחִימֶ֥לֶךְ בֶּן אֶבְיָתָ֖ר כֹּהֲנִ֑ים וּ/שְׂרָיָ֖ה סוֹפֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/017.yaml
  text: Zadok son of Ahitub and Ahimelech son of Abiathar were priests[b][a], and Seraiah was secretary.
  footnotes:
  - marker: a
    text: Or 'chief ministers' or 'royal officials' for 'priests'; some take the term here in a broader court-administrative sense because the verse lists David's officials.
    reason: lexical_alternative
  - marker: b
    text: Or 'scribe.' The Hebrew term refers to an official responsible for writing or administration.
    reason: lexical_alternative
translation:
  language: ko
  text: 사독의 아들 아히둡의 아들 아히멜렉과 아비아달의 아들 아히멜렉은 제사장이었고, 스라야는 서기관이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제사장들’은 여기서 ‘최고 대신들’ 또는 ‘왕실 관리들’로도 이해할 수 있습니다. 이 명칭을 다윗의 관직 목록이라는 문맥 때문에 더 넓은 행정 직함으로 보는 견해가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘서기관’은 문서를 작성하거나 행정을 담당하는 관직을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוֹק
  english_pob_choice: Zadok
  chosen_korean: 사독
  alternatives_korean:
  - 자독
  lexicon: 고유명사 표기
  rationale: 히브리어 고유명사 צָדוֹק는 한국어 성경에서 널리 굳은 ‘사독’을 따르는 것이 자연스럽습니다.
- source_word: כֹּהֲנִים
  english_pob_choice: priests
  chosen_korean: 제사장이었습니다
  alternatives_korean:
  - 사제였습니다
  - 제사장들이었습니다
  lexicon: HALOT
  rationale: כֹּהֵן의 기본 의미는 ‘제사장’이므로 본문에는 그 기본 뜻을 살렸습니다.
- source_word: סוֹפֵר
  english_pob_choice: secretary
  chosen_korean: 서기관이었습니다
  alternatives_korean:
  - 비서였습니다
  - 기록관이었습니다
  lexicon: HALOT
  rationale: 왕실 관직 목록의 סוֹפֵר는 단순 필사가보다 행정 문서 업무를 맡는 관직이므로, ‘서기관’이 가장 직접적으로 대응합니다.
theological_decisions:
- issue: כֹּהֲנִים을 왕실 관직 목록에서 어떻게 읽을지
  chosen_reading: 본문에는 기본 의미인 ‘제사장’으로 옮기되, 행정적 직무 가능성은 주석으로 남깁니다.
  alternative_readings:
  - 최고 대신들
  - 왕실 관리들
  rationale: 문맥상 다윗의 관직 목록에 놓여 있어 행정적 의미를 제안하는 견해가 있지만, 히브리어의 기본 의미를 본문에 유지하는 편이 원문 우선 원칙에 더 잘 맞습니다.
  doctrine_reference: '번역 원칙: 원어 우선, 실제로 필요한 경우만 대안 의미를 각주에 보존'
