  text: וַ/יִּמְלֹ֥ךְ דָּוִ֖ד עַל כָּל יִשְׂרָאֵ֑ל וַ/יְהִ֣י דָוִ֗ד עֹשֶׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה לְ/כָל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/015.yaml
  text: So David reigned over all Israel[a], and David was administering justice and righteousness to all his people.
  footnotes:
  - marker: a
    text: Or 'administered justice and what is right.' The Hebrew pair 'justice and righteousness' is a standard expression for ideal royal rule.
    reason: lexical_alternative
translation:
  language: ko
  text: 이처럼 다윗은 온 이스라엘의 왕이 되었고, 다윗은 온 그의 백성에게 정의와 의를 행하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온당한 것을 행하고 있었습니다.’ 히브리어의 ‘정의와 의’는 이상적인 왕의 통치를 가리키는 표준적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  english_pob_choice: reigned
  chosen_korean: 왕이 되었고
  alternatives_korean:
  - 통치했고
  - 다스렸고
  lexicon: HALOT
  rationale: מלך의 왕권 행사 결과를 자연스러운 한국어 서술로 옮기되, 단순한 즉위가 아니라 왕으로서 다스리는 상태를 드러내기 위해 ‘왕이 되다’를 선택했습니다.
- source_word: עַל כָּל יִשְׂרָאֵל
  english_pob_choice: over all Israel
  chosen_korean: 온 이스라엘의
  alternatives_korean:
  - 온 이스라엘 위에
  - 온 이스라엘을 다스리는
  lexicon: HALOT
  rationale: עַל + 왕권 구문을 한국어 소유격 구문으로 자연스럽게 풀어 ‘온 이스라엘의’로 옮겼습니다.
- source_word: מִשְׁפָּט וּצְדָקָה
  english_pob_choice: justice and righteousness
  chosen_korean: 정의와 의
  alternatives_korean:
  - 공의와 의
  - 정의와 올바름
  lexicon: HALOT
  rationale: 왕정 문맥의 מִשְׁפָּט와 צְדָקָה의 두 요소를 구별해 살리기 위해, 제도적·재판적 측면은 ‘정의’, اخلاق적·바른 질서의 측면은 ‘의’로 옮겼습니다.
- source_word: לְכָל עַמּוֹ
  english_pob_choice: to all his people
  chosen_korean: 온 그의 백성에게
  alternatives_korean:
  - 그의 모든 백성에게
  - 온 백성에게
  lexicon: HALOT
  rationale: ל의 목적·대상 관계를 한국어 여격으로 자연스럽게 표현했고, 3인칭 소유 접미사를 ‘그의’로 반영했습니다.
theological_decisions:
- issue: 왕의 이상적 통치의 표어인 ‘정의와 의’의 구별
  chosen_reading: 두 표현을 구별하여, 왕이 백성에게 공적으로 정의를 세우고 관계적으로 바른 질서를 행하는 모습으로 읽었습니다.
  alternative_readings:
  - ‘정의와 공의’로 통일해 더 전통적인 교회어로 읽기
  - 두 단어를 ‘정의와 올바름’처럼 중화하기
  rationale: 이 절은 이상적 왕정의 정형 표현을 제시하므로, 두 낱말의 긴장과 풍성함을 유지하는 것이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
