  yaml_path: translation/ot/2_samuel/008/011.yaml
  text: King David also dedicated them to Yahweh[b][a], along with the silver and the gold that he had dedicated from all the nations that he had subdued.
  footnotes:
  - marker: a
    text: Or 'conquered.' The Hebrew verb can denote bringing peoples under control by force.
    reason: lexical_alternative
  - marker: b
    text: '''Them'' refers to the items mentioned in the previous verse.'
    reason: cross_reference
translation:
  language: ko
  text: 다윗 왕은 그 물건들[b]도 그가 정복한[a] 모든 민족에게서 가져와 이미 바친 은과 금과 함께 야훼께 바쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정복한’으로 옮겼습니다. 히브리어 동사는 무력으로 민족을 지배 아래 두는 의미를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 물건들’은 바로 앞 절에 언급된 물건들을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: הִקְדִּישׁ
  english_pob_choice: dedicated
  chosen_korean: 바쳤습니다
  alternatives_korean:
  - 봉헌했습니다
  - 구별하여 바쳤습니다
  lexicon: HALOT
  rationale: 귀중품을 하나님께 돌려드리는 헌납의 뜻을 살리되, 현대 한국어에서 자연스럽고 과도하게 제의적이지 않은 표현으로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 원문의 고유 신명 יהוה를 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 방향격 조사 ‘-께’를 붙여 문맥에 맞게 처리했습니다.
- source_word: אֲשֶׁר כִּבֵּשׁ
  english_pob_choice: that he had subdued
  chosen_korean: 그가 정복한
  alternatives_korean:
  - 그가 굴복시킨
  - 그가 진압한
  lexicon: HALOT
  rationale: כָּבַשׁ의 군사적·정치적 의미를 살려 ‘정복한’으로 옮겼고, 영어 POB의 ‘subdued’가 담는 힘의 뉘앙스를 반영했습니다.
- source_word: אֹתָם
  english_pob_choice: them
  chosen_korean: 그것들도
  alternatives_korean:
  - 그것들
  - 그 물건들도
  lexicon: HALOT
  rationale: 바로 앞 절의 항목들을 가리키는 대명사이므로, 한국어에서는 지시를 분명히 하면서도 원문의 포괄성을 유지하는 ‘그것들도’를 썼습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 본문에 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
