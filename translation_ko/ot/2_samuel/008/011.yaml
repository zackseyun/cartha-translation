  rationale: WLC의 יְהוָה를 영어 POB의 감추어진 관습적 대체어가 아니라 원문 신명 자체를 드러내는 방식으로 반영하는 것이 본 프로젝트 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
