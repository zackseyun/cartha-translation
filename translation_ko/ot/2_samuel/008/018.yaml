  yaml_path: translation/ot/2_samuel/008/018.yaml
  text: Benaiah son of Jehoiada was over the Kerethites and the Pelethites, and David’s sons were priests.[a]
  footnotes:
  - marker: a
    text: Or 'chief ministers' or 'royal officials.' The Hebrew word is the usual term for 'priests,' but some understand it here in a broader courtly sense because the context concerns royal administration.
    reason: alternative_reading
translation:
  language: ko
  text: 브나야는 여호야다의 아들이며, 크렛 사람들과 블렛 사람들 위에 있었고, 다윗의 아들들은 제사장이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수석 관리들’ 혹은 ‘왕실 관리들’일 수 있습니다. 히브리어 단어는 보통 ‘제사장’을 뜻하지만, 문맥이 왕실 행정을 다루므로 더 넓은 궁정 의미로 이해하는 사람들도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנָיָהוּ בֶּן יְהוֹיָדָע
  english_pob_choice: Benaiah son of Jehoiada
  chosen_korean: 브나야는 여호야다의 아들
  alternatives_korean:
