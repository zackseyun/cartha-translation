base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/018.yaml
  text: Benaiah son of Jehoiada was over the Kerethites and the Pelethites, and David’s sons were priests.[a]
  footnotes:
  - marker: a
    text: Or 'chief ministers' or 'royal officials.' The Hebrew word is the usual term for 'priests,' but some understand it here in a broader courtly sense because the context concerns royal administration.
    reason: alternative_reading
translation:
  language: ko
  text: 여호야다의 아들 브나야는 크렛 사람들과 블렛 사람들을 맡고 있었고, 다윗의 아들들은 제사장들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수석 관리들’ 혹은 ‘왕실 관리들’일 수 있습니다. 히브리어 단어는 보통 ‘제사장들’을 뜻하지만, 문맥이 왕실 행정을 다루므로 일부는 이를 더 넓은 궁정의 의미로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנָיָהוּ בֶּן יְהוֹיָדָע
  english_pob_choice: Benaiah son of Jehoiada
  chosen_korean: 브나야는 여호야다의 아들
  alternatives_korean:
  - 베나야는 여호야다의 아들
  lexicon: WLC
  rationale: 고유명사는 현대 한국어 음역 관행을 따르되, 히브리어 자음값을 비교적 투명하게 반영하는 ‘브나야’를 채택했습니다.
- source_word: וְהַכְּרֵתִי
  english_pob_choice: the Kerethites
  chosen_korean: 크렛 사람들
  alternatives_korean:
  - 케렛 사람들
  - 그렛 사람들
  lexicon: WLC
  rationale: 히브리어 קבוצת명칭을 직접 음역해 원문 투명성을 살렸습니다. 전통적 영어형에 기대지 않고 자음군을 반영했습니다.
- source_word: וְהַפְּלֵתִי
  english_pob_choice: the Pelethites
  chosen_korean: 블렛 사람들
  alternatives_korean:
  - 펠렛 사람들
  - 플렛 사람들
  lexicon: WLC
  rationale: 앞의 집단명칭과 평행을 이루도록 직접 음역했습니다. 둘 다 특정 직책명보다 집단 표지로 보이므로 ‘사람들’로 풀었습니다.
- source_word: כֹּהֲנִים
  english_pob_choice: priests
  chosen_korean: 제사장
  alternatives_korean:
  - 고관
  - 왕실 관리
  lexicon: HALOT
  rationale: 원문은 일반적으로 ‘제사장’이지만, 다윗의 아들들에게 적용될 때는 궁정 직무를 가리킨다는 해석이 있어 그 긴장은 각주로 남기고 본문은 기본 어휘를 살렸습니다.
theological_decisions:
- issue: 다윗의 아들들이 ‘제사장들’이라고 불리는 표현의 해석
  chosen_reading: 본문은 ‘제사장’으로 옮기고, 궁정의 수석 관리나 왕실 관리를 뜻할 수 있다는 대안을 각주에 두었습니다.
  alternative_readings:
  - 수석 관리
  - 왕실 관리
  rationale: 제사장 직분의 통상적 제한과 충돌하는 해석적 긴장이 있어, 본문에서 의미를 완화하지 않고 원문 어휘를 우선 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
