source:
  edition: WLC
  text: וַ/יָּ֨שֶׂם בֶּ/אֱד֜וֹם נְצִבִ֗ים בְּ/כָל אֱדוֹם֙ שָׂ֣ם נְצִבִ֔ים וַ/יְהִ֥י כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑ד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/014.yaml
  text: He placed garrisons in Edom[a]; throughout all Edom he placed garrisons, and all Edom became servants to David[b]. And Yahweh gave David victory wherever he went.
  footnotes:
  - marker: a
    text: Or 'all the Edomites became servants to David.' The Hebrew says 'all Edom became slaves/servants to David,' using the nation name collectively for its people.
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD saved/delivered David wherever he went.' In this military context, 'gave David victory' brings out the sense of deliverance in battle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 에돔에 수비대를 두었습니다[a]. 에돔 전역에 수비대를 두었으며, 온 에돔은 다윗의 종이 되었습니다. 야훼께서는 다윗이 가는 곳마다 승리를 주셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “온 에돔 사람들이 다윗의 종이 되었습니다.” 히브리어는 민족 이름을 집합적으로 써서 그 백성을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “야훼께서 다윗이 가는 곳마다 그를 구원하셨습니다.” 전쟁 문맥에서는 ‘승리를 주셨습니다’가 구원의 뜻을 더 분명하게 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם / שָׂם
  english_pob_choice: placed
  chosen_korean: 두었습니다
  alternatives_korean:
  - 두었습니다
  - 배치했습니다
  - 세웠습니다
  lexicon: HALOT
  rationale: צב / שׂים의 기본 뜻은 ‘두다, 놓다, 배치하다’이므로, 군사 맥락에서 자연스럽고 간결한 ‘두었습니다’가 원문을 잘 살립니다.
- source_word: נְצִבִים
  english_pob_choice: garrisons
  chosen_korean: 수비대
  alternatives_korean:
  - 주둔군
  - 파견대
  - 총독들
  lexicon: HALOT
  rationale: 정복 후 통제용으로 설치된 군사적 주둔을 가리키므로 ‘수비대’가 문맥상 가장 적절합니다.
- source_word: וַיְהִי כָל אֱד֖וֹם עֲבָדִ֣ים לְדָוִד
  english_pob_choice: all Edom became slaves to David
  chosen_korean: 온 에돔은 다윗의 종이 되었습니다
  alternatives_korean:
  - 온 에돔은 다윗의 노예가 되었습니다
  - 에돔 사람들 모두가 다윗에게 종이 되었습니다
  - 온 에돔은 다윗에게 복속되었습니다
  lexicon: HALOT
  rationale: עֲבָדִים은 문자적으로는 ‘종들/노예들’이지만, 여기서는 국가 전체의 복속을 집합적으로 말하므로 POB의 본문 흐름에 맞춰 ‘종’으로 옮기되, 강한 예속의 의미는 유지했습니다.
- source_word: וַיּוֹשַׁע יְהוָה
  english_pob_choice: Yahweh gave David victory
  chosen_korean: 야훼께서는 ... 승리를 주셨습니다
  alternatives_korean:
  - 야훼께서는 ... 구원하셨습니다
  - 야훼께서는 ... 건져내셨습니다
  - 야훼께서는 ... 승리하게 하셨습니다
  lexicon: HALOT
  rationale: ישׁע의 사역형은 군사 문맥에서 ‘구원/건짐’과 함께 ‘승리’를 포함할 수 있으므로, 영어 POB의 해석을 따라 결과를 분명하게 하는 ‘승리를 주셨습니다’로 옮겼습니다.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  english_pob_choice: wherever he went
  chosen_korean: 가는 곳마다
  alternatives_korean:
  - 어디로 가든지
  - 그가 가는 모든 곳에서
  - 가는 곳마다
  lexicon: HALOT
  rationale: 관용구적으로 광범위한 성공과 이동의 범위를 나타내므로, 현대 한국어에서 자연스러운 ‘가는 곳마다’가 가장 잘 대응합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
