  rationale: 본문의 신명기호는 제목이 아니라 고유한 언약 이름이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 원문 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 군사적 ‘승리/구원’의 중첩
  chosen_reading: 승리를 주셨습니다
  alternative_readings:
  - 구원하셨습니다
  - 건져내셨습니다
  rationale: 이 절은 정복 전승 요약문이므로, 하나님의 구원 행위를 전쟁 결과로 드러내는 ‘승리’를 택해 문맥의 힘을 살렸습니다.
  doctrine_reference: 2 Samuel 8:14 military context
