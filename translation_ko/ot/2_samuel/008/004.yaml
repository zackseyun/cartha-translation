base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/004.yaml
  text: David captured from him 1,700 horsemen and 20,000 foot soldiers[a]. Then David hamstrung all the chariot horses[c][b], but left enough for 100 chariots.
  footnotes:
  - marker: a
    text: The Hebrew text reads '1,700 horsemen.' The parallel in 1 Chronicles 18:4 reads '7,000 horsemen.'
    reason: textual_variant
  - marker: b
    text: Hebrew 'all the chariot force'; the translation makes explicit that the horses were hamstrung, since that is the action described.
    reason: lexical_alternative
  - marker: c
    text: Or 'but left enough of them for 100 chariots'.
    reason: previous_rendering
translation:
  language: ko
  text: 다윗은 그에게서 1,700명의 기병과 2만 명의 보병을 사로잡았습니다. 그리고 다윗은 모든 병거의 말을 절었지만, 100대의 병거를 유지할 만큼은 남겨 두었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문에는 ‘1,700명’으로 되어 있습니다. 역대상 18:4의 평행본문에는 ‘7,000명’으로 나옵니다.
    reason: textual_variant
  - marker: b
    text: 히브리어는 문자적으로 ‘모든 병거’를 뜻하지만, 여기서는 병거를 끄는 말을 가리키는 것으로 풀어 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘100대의 병거에 쓸 만큼은 남겨 두었습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּלְכֹּד
  english_pob_choice: captured
  chosen_korean: 사로잡았습니다
  alternatives_korean:
  - 붙잡았습니다
  - 포로로 잡았습니다
  lexicon: HALOT
  rationale: 전투 맥락에서 לָכַד는 적을 사로잡거나 붙잡는 뜻이므로, 자연스러운 군사 표현인 ‘사로잡았습니다’로 옮겼습니다.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת פָּרָשִׁים
  english_pob_choice: 1,700 horsemen
  chosen_korean: 1,700명의 기병
  alternatives_korean:
  - 1,700명의 말탄 병사
  - 1,700명의 마병
  lexicon: HALOT
  rationale: פָּרָשִׁים는 말탄 병력, 곧 기병을 가리키므로 현대 한국어 군사 용어인 ‘기병’을 선택했습니다.
- source_word: וְעֶשְׂרִים אֶלֶף אִישׁ רַגְלִי
  english_pob_choice: 20,000 foot soldiers
  chosen_korean: 2만 명의 보병
  alternatives_korean:
  - 2만 명의 보행병
  - 2만 명의 걸어서 싸우는 병사
  lexicon: HALOT
  rationale: ‘발로 가는 사람’이라는 직역보다, 대조되는 병력 유형을 분명히 하는 ‘보병’이 원문 의도를 더 정확하게 전달합니다.
- source_word: וַיְעַקֵּר
  english_pob_choice: hamstrung
  chosen_korean: 절었습니다
  alternatives_korean:
  - 힘줄을 끊었습니다
  - 다리를 못 쓰게 했습니다
  lexicon: HALOT
  rationale: 말의 뒷다리 힘줄을 끊어 전투력을 없애는 뜻을 한국어 동사로 압축하면 ‘절다’가 가장 직접적이며, 본문이 말하는 손상 행위를 잘 드러냅니다.
- source_word: אֶת כָּל הָרֶכֶב
  english_pob_choice: all the chariot horses
  chosen_korean: 모든 병거의 말
  alternatives_korean:
  - 모든 병거
  - 모든 병거 부대의 말
  lexicon: HALOT
  rationale: רֶכֶב은 여기서 병거 자체보다 병거를 끄는 말들을 가리키는 것으로 이해하는 것이 자연스러우므로, POB의 풀이를 따라 ‘병거의 말’로 풀어 썼습니다.
theological_decisions:
- issue: 전리품/전쟁 기사에서 רֶכֶב을 병거 말로 풀어 쓰는 문제
  chosen_reading: ‘병거의 말’로 옮겨, 말의 절단이라는 행위가 실제 대상에 가해졌음을 분명히 했습니다.
  alternative_readings:
  - ‘모든 병거를’로 단순화함
  - ‘병거 군세’를 유지함
  rationale: 말을 절었다는 동사와 결합할 때 병거 자체를 의미한다고 읽으면 문맥상 어색하므로, 본문의 폭력적 조치를 정확히 드러내는 해석을 택했습니다.
  doctrine_reference: 본문 이해의 명료성 및 전쟁 서술의 문자적 행위
- issue: מֵאָה רָכֶב의 한국어 표현
  chosen_reading: ‘100대의 병거를 유지할 만큼은 남겨 두었습니다’로, 남겨 둔 것이 병거 수를 충족할 정도의 말이라는 의미를 살렸습니다.
  alternative_readings:
  - ‘100대의 병거를 남겨 두었습니다’
  - ‘100대의 병거에 쓸 말은 남겨 두었습니다’
  rationale: 원문은 병거 수를 기준으로 남겨 둔 양을 말하므로, 한국어에서는 자연스럽게 ‘유지할 만큼’이라는 풀이가 필요합니다.
  doctrine_reference: 본문의 문법적-의미적 정확성
