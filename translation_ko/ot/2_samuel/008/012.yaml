translation:
  language: ko
  text: 아람과 모압과 암몬 자손과 블레셋 사람들과 아말렉에게서, 또 소바 왕 르홉의 아들 하닷에셀의 전리품에서 나온 것이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֲרָם은 전통적으로 ‘시리아’로 옮겨지기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘암몬의 자손들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 일부 본문은 이 이름을 ‘하다레셀’로 철자합니다.
    reason: textual_variant
lexical_decisions:
- source_word: מֵאֲרָם
  english_pob_choice: from Aram
  chosen_korean: 아람에서
  alternatives_korean:
  - 시리아에서
  lexicon: HALOT
  rationale: 아람은 본문의 히브리어 고유명사를 보존하는 번역이어서, 후대 지명인 시리아보다 원문 지시를 더 직접적으로 드러냅니다.
- source_word: וּמִבְּנֵי עַמּוֹן
  english_pob_choice: and from the Ammonites
  chosen_korean: 암몬 자손과
  alternatives_korean:
  - 암몬 사람들과
  - 암몬 족속과
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘암몬의 자손들’이므로, ‘암몬 자손’이 원문 구조를 가장 가깝게 반영합니다.
- source_word: וּמִשְּׁלַל
  english_pob_choice: and from the spoil
  chosen_korean: 전리품에서
  alternatives_korean:
  - 노획물에서
  - 노략물에서
  lexicon: HALOT
  rationale: שָׁלָל은 전쟁으로 취한 물품을 가리키므로, 문맥상 자연스럽고 군사적 의미를 분명히 하는 ‘전리품’이 적절합니다.
- source_word: מֶלֶךְ צוֹבָה
  english_pob_choice: king of Zobah
  chosen_korean: 소바 왕
  alternatives_korean:
  - 조바 왕
  lexicon: HALOT
  rationale: צוֹבָה는 한국어 성경에서 비교적 덜 정착된 고유명사이므로, 현대 음역인 ‘소바’를 사용해 원문 지명을 일관되게 옮겼습니다.
theological_decisions:
- issue: 열거 구조를 한국어로 어떻게 유지할지
  chosen_reading: 원문의 반복적인 전치사열을 살려, ‘아람과 모압과 …’처럼 단순 병렬로 옮겼습니다.
  alternative_readings:
  - ‘아람에서, 모압에서, …’처럼 각 항목에 장소 전치를 반복하는 방식
  rationale: 본절은 출처 목록의 열거가 핵심이므로, 의미를 덧붙이기보다 병렬 구조를 유지하는 편이 원문의 어조와 정보 구조를 더 잘 드러냅니다.
  doctrine_reference: 본문 구조 보존 원칙
- issue: ‘아말렉’의 인명/족속 지시
  chosen_reading: ‘아말렉’으로 옮겨, 집단을 암시하되 영어 POB처럼 굳이 ‘아말렉 사람들’로 풀지 않았습니다.
  alternative_readings:
  - 아말렉 사람들
  - 아말렉 족속
  rationale: 히브리어는 עֲמָלֵק이라는 고유명사 형태를 쓰므로, 원문 표면형을 보존하는 쪽이 더 정확합니다.
  doctrine_reference: 고유명사 보존 원칙
