id: 2SA.8.6
reference: 2 Samuel 8:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֨שֶׂם דָּוִ֤ד נְצִבִים֙ בַּ/אֲרַ֣ם דַּמֶּ֔שֶׂק וַ/תְּהִ֤י אֲרָם֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נוֹשְׂאֵ֣י מִנְחָ֑ה וַ/יֹּ֤שַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and Aram became servants to David, bringing tribute[c][b]. And Yahweh gave David victory wherever he went.
  footnotes:
  - marker: a
    text: Or 'in Syria of Damascus.' The Hebrew name is 'Aram,' which this translation normally preserves rather than replacing with the traditional 'Syria.'
    reason: lexical_alternative
  - marker: b
    text: Or 'bearing tribute' or 'bringing gifts.' The Hebrew term can mean gift, offering, or tribute; here it likely refers to vassal payment.
    reason: lexical_alternative
  - marker: c
    text: Or 'the LORD saved/delivered David wherever he went.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 다메섹의 아람에 주둔군을 두었고[a], 아람은 다윗에게 종이 되어 조공을 바쳤습니다[b]. 그리고 야훼께서는 다윗이 가는 곳마다 그에게 승리를 주셨습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다메섹의 시리아에’. 히브리어 이름은 ‘아람’이며, 이 번역은 보통 이를 전통적인 ‘시리아’로 바꾸기보다 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘공물을 바치며’ 또는 ‘예물을 가져오며’. 히브리어 표현은 선물, 예물, 조공을 뜻할 수 있으며, 여기서는 속국의 납부를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘야훼께서 다윗이 가는 곳마다 그를 구원/건지셨습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְצִבִים
  english_pob_choice: garrisons
  chosen_korean: 주둔군
  alternatives_korean:
  - 수비대
  - 주둔지
  - 총독들
  lexicon: HALOT
  rationale: 군사적 점령과 통제의 문맥이므로, 행정관보다 군사적 의미를 드러내는 ‘주둔군’이 가장 자연스럽고 source-near합니다.
- source_word: בַּאֲרַם דַּמֶּשֶׂק
  english_pob_choice: in Aram of Damascus
  chosen_korean: 다메섹의 아람에
  alternatives_korean:
  - 다메섹의 시리아에
  - 다메섹 아람에
  - 아람-다메섹에
  lexicon: HALOT
  rationale: 히브리어 지명 ‘아람’을 그대로 살려, 전통적 ‘시리아’로 바꾸지 않고 ‘다메섹의 아람’으로 옮겼습니다.
- source_word: לַעֲבָדִים
  english_pob_choice: servants
  chosen_korean: 종이 되어
  alternatives_korean:
  - 종이 되었습니다
  - 복속되어
  - 노예가 되어
  lexicon: HALOT
  rationale: 정치적 예속 관계를 나타내지만, POB의 선택처럼 ‘servants’의 어휘를 살려 ‘종’으로 옮기되 문맥상 상태 변화를 드러내기 위해 ‘되어’를 더했습니다.
- source_word: נוֹשְׂאֵי מִנְחָה
  english_pob_choice: bringing tribute
  chosen_korean: 조공을 바쳤습니다
  alternatives_korean:
  - 예물을 들고 왔습니다
  - 공물을 가져왔습니다
  - 선물을 가져왔습니다
  lexicon: HALOT
  rationale: 왕권에 대한 속국의 정기적 납부라는 문맥이므로 ‘조공’이 가장 정확합니다. ‘바쳤습니다’는 목적어 없이도 공물 납부의 관용적 의미를 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여기서는 신적 호칭이 아니라 고유명사 יְהוָה이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: בְּכֹל אֲשֶׁר הָלָךְ의 의미
  chosen_reading: ‘다윗이 가는 곳마다 그에게 승리를 주셨습니다’로, 전투와 원정 전반에서의 포괄적 성공을 드러냈습니다.
  alternative_readings:
  - ‘그가 어디로 가든지 그를 구원하셨습니다’
  - ‘그가 가는 모든 길에서 그를 건지셨습니다’
  rationale: 히브리어 동사는 단순한 이동이 아니라 야훼의 군사적 성공 부여를 포함하는 문맥이므로, POB의 ‘gave victory’에 맞춰 ‘승리’를 택했습니다.
  doctrine_reference: 2 Sam 8:6의 왕권-전쟁 문맥; ישׁע의 구원/승리 의미 범위
- issue: עֲבָדִים의 번역
  chosen_reading: ‘종’으로 옮겨 예속 상태를 드러내되, 현대 한국어에서 직접적 노예제 이미지는 본문이 요구하는 만큼만 띠게 했습니다.
  alternative_readings:
  - ‘노예’
  - ‘백성’
  - ‘신하’
  rationale: 본문은 개인 노예가 아니라 국가 간 복속을 말하므로, ‘노예’는 과하고 ‘신하/백성’은 관계의 강도를 약화시킵니다. ‘종’이 가장 덜 왜곡적입니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: יְהוָה의 표기
  chosen_reading: ‘야훼’
  alternative_readings:
  - ‘여호와’
  - ‘주’
  rationale: 본문의 신명은 칭호가 아니라 언약 이름이므로, 전통적 대체어보다 고유명사를 보존하는 것이 source-direct합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
