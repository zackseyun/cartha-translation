base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/009.yaml
  text: When Toi king of Hamath heard that David had struck down all the army of Hadadezer,[a]
  footnotes:
  - marker: a
    text: The parallel passage in 1 Chronicles 18:9 reads the king's name as 'Tou.' The Hebrew text here reads 'Toi.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 하맛의 왕 도이가 다윗이 하닷에셀의 모든 군대를 쳐부쉈다는 것을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 역대상 18:9의 평행본문은 이 왕의 이름을 ‘도우’로 적습니다. 히브리어 본문은 여기서 ‘도이’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 듣게 되었습니다
  - 알게 되었습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서도, 보고받은 내용의 수용을 직접적으로 표현하는 가장 기본적인 대응입니다.
- source_word: תֹּעִי
  english_pob_choice: Toi
  chosen_korean: 도이
  alternatives_korean:
  - 토이
  - 투
  lexicon: HALOT
  rationale: 개인명은 한국어 음역으로 옮기되, 본문 MT의 표기 Toi에 맞춰 도이로 적었습니다.
- source_word: מֶלֶךְ חֲמָת
  english_pob_choice: king of Hamath
  chosen_korean: 하맛의 왕
  alternatives_korean:
  - 하맛 왕
  - 하맛의 임금
  lexicon: HALOT
  rationale: 히브리어 소유격 관계를 자연스러운 한국어 관형구로 옮겼고, king은 현대 문체에 맞게 왕으로 번역했습니다.
- source_word: הִכָּה
  english_pob_choice: had struck down
  chosen_korean: 쳐부쉈다는
  alternatives_korean:
  - 쳐이겼다는
  - 격파했다는
  lexicon: HALOT
  rationale: 전투 문맥의 강한 타격성을 살리되, 한국어에서 자연스럽고 역동적인 표현으로 옮겼습니다. 단순한 '이기다'보다 원문의 물리적·폭력적 뉘앙스를 더 잘 반영합니다.
- source_word: אֵת כָּל חֵיל
  english_pob_choice: all the army
  chosen_korean: 모든 군대
  alternatives_korean:
  - 모든 군세
  - 모든 병력
  lexicon: HALOT
  rationale: חֵיל은 여기서 군사 세력을 가리키므로, 현대 독자가 즉시 이해할 수 있는 군대로 옮겼습니다.
theological_decisions:
- issue: 군사적 승리 서술의 강도
  chosen_reading: 다윗이 하닷에셀의 모든 군대를 쳐부쉈다고 직설적으로 옮겼습니다.
  alternative_readings:
  - 다윗이 하닷에셀의 군대를 물리쳤다고 완화해 옮길 수 있음
  - 다윗이 하닷에셀의 군대를 패배시켰다고 중립적으로 옮길 수 있음
  rationale: 히브리어 הִכָּה의 직접적이고 구체적인 타격 감각을 약화시키지 않기 위해, 승리의 결과보다 전투 행위의 강도를 드러내는 표현을 택했습니다.
  doctrine_reference: 서사 본문의 직설적 묘사 보존 원칙
