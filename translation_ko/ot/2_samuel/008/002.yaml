  naturalness: 현행의 “두 줄은 죽이려고 재고, 한 줄 가득은 살려 두려고 잰 것입니다”는 ‘줄’ 자체를 죽인다는 듯이 읽힐 수 있고 “한 줄 가득”도 다소 부자연스럽습니다. ‘두 줄의 길이/한 줄의 온 길이’와 목적을 연결하면 현대 표준어 합쇼체로 더 자연스럽습니다.
