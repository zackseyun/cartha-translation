  to: 그가 모압을 쳤습니다. 그는 그들을 땅에 눕힌 뒤 줄[a]로 재었습니다. 그는 죽이기 위해 두 줄의 길이를 재고, 살려 두기 위해 한 줄의 온 길이를 재었습니다.[b] 그래서 모압은 다윗의 종이 되어 조공을 바치게 되었습니다.
