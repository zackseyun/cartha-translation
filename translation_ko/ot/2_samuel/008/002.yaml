id: 2SA.8.2
reference: 2 Samuel 8:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֣ךְ אֶת מוֹאָ֗ב וַֽ/יְמַדְּדֵ֤/ם בַּ/חֶ֨בֶל֙ הַשְׁכֵּ֣ב אוֹתָ֣/ם אַ֔רְצָ/ה וַ/יְמַדֵּ֤ד שְׁנֵֽי חֲבָלִים֙ לְ/הָמִ֔ית וּ/מְלֹ֥א הַ/חֶ֖בֶל לְ/הַחֲי֑וֹת וַ/תְּהִ֤י מוֹאָב֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נֹשְׂאֵ֥י מִנְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/002.yaml
  text: He struck Moab and measured them with a line[a], making them lie down on the ground. He measured off two lengths of line for death and a full length of line to keep alive. So Moab became David’s servants[b], bringing tribute.
  footnotes:
  - marker: a
    text: Or 'with a cord' or 'with a measuring line.'
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew describes David measuring the Moabites while they lay on the ground: two measured portions were assigned ''for death'' and one full portion ''for life,'' implying that some were executed and others spared.'
    reason: cultural_note
translation:
  language: ko
  text: 그가 모압을 쳐서 그들을 줄로 재고, 그들을 땅에 눕게 했습니다. 두 줄은 죽이려고 재고, 한 줄 가득은 살려 두려고 잰 것입니다. 그래서 모압은 다윗의 종이 되어 조공을 바치게 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘줄’은 여기서 측량 도구를 가리킬 수 있으며, ‘끈’ 또는 ‘측량줄’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 다윗이 모압 사람들을 땅에 눕힌 뒤 측정하여, 두 몫은 죽임을 당하게 하고 한 몫은 살려 두는 절차를 묘사합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  english_pob_choice: He struck
  chosen_korean: 쳐서
  alternatives_korean:
  - 공격해서
  - 무찔러서
  lexicon: HALOT
  rationale: נכה의 기본적이고 구체적인 뜻인 '치다/때리다'를 살려, 군사적 결과를 과도하게 해석하지 않으면서도 원문의 강한 행동성을 유지했습니다.
- source_word: בַּחֶבֶל
  english_pob_choice: with a line
  chosen_korean: 줄로
  alternatives_korean:
  - 끈으로
  - 측량줄로
  lexicon: HALOT
  rationale: חבל은 끈/줄/측량줄을 뜻할 수 있으나, 여기서는 반복되는 '재다' 동사와 함께 측정 도구를 가리키므로 간결하게 '줄'로 옮겼습니다.
- source_word: וַיְמַדְּדֵם / וַיְמַדֵּד
  english_pob_choice: measured them / measured off
  chosen_korean: 그들을 줄로 재고 / 두 줄은 ... 재고
  alternatives_korean:
  - 그들을 측정하고 / 두 몫을 나누고
  - 그들을 재어 보고 / 두 길이를 재고
  lexicon: HALOT
  rationale: מדד의 기본 의미인 '재다'를 유지해, 대상과 측정 행위의 냉혹한 구체성을 그대로 드러냈습니다.
- source_word: לְהָמִית / לְהַחֲיוֹת
  english_pob_choice: for death / to keep alive
  chosen_korean: 죽이려고 / 살려 두려고
  alternatives_korean:
  - 죽이기 위해 / 살리기 위해
  - 사망하게 하려고 / 살게 하려고
  lexicon: HALOT
  rationale: 히필 부정사들의 목적 의미를 자연스러운 한국어로 풀어, 대조 구조를 살리면서도 문맥상 실제 처형과 생존 보존의 뜻이 분명하게 드러나도록 했습니다.
- source_word: לַעֲבָדִים
  english_pob_choice: servants
  chosen_korean: 종이
  alternatives_korean:
  - 노예가
  - 신하가
  lexicon: HALOT
  rationale: 정치적 예속 관계를 가리키지만, 한국어에서 '종'은 통치자에게 종속된 신분을 비교적 직접적으로 드러내어 본문 맥락에 적합합니다.
- source_word: נֹשְׂאֵי מִנְחָה
  english_pob_choice: bringing tribute
  chosen_korean: 조공을 바치게 되었습니다
  alternatives_korean:
  - 예물을 가져오게 되었습니다
  - 공물을 바치게 되었습니다
  lexicon: HALOT
  rationale: 왕권 하의 속국 관계를 가리키므로, cultic '예물'보다 정치적 의미가 분명한 '조공'을 선택했습니다.
theological_decisions:
- issue: 모압에 대한 잔혹한 처분의 표현 수위
  chosen_reading: 본문의 측량 이미지와 죽임/살림의 대비를 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 비유적으로 완곡하게 처리하기
  - 비율을 본문에 명시해 설명하기
  rationale: 히브리어는 실제로 눕힌 뒤 죽일 몫과 살릴 몫을 나누는 냉혹한 절차를 보여 주므로, 의미를 약화시키지 않는 방향이 원문에 가장 충실합니다.
  doctrine_reference: '번역 원칙: 원문 밀착성과 의미 보존'
