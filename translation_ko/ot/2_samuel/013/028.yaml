  text: וַ/יְצַו֩ אַבְשָׁל֨וֹם אֶת נְעָרָ֜י/ו לֵ/אמֹ֗ר רְא֣וּ נָ֠א כְּ/ט֨וֹב לֵב אַמְנ֤וֹן בַּ/יַּ֨יִן֙ וְ/אָמַרְתִּ֣י אֲלֵי/כֶ֔ם הַכּ֧וּ אֶת אַמְנ֛וֹן וַ/הֲמִתֶּ֥ם אֹת֖/וֹ אַל תִּירָ֑אוּ הֲ/ל֗וֹא כִּ֤י אָֽנֹכִי֙ צִוִּ֣יתִי אֶתְ/כֶ֔ם חִזְק֖וּ וִ/הְי֥וּ לִ/בְנֵי חָֽיִל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/028.yaml
  text: 'Then Absalom commanded his young men[a], saying, “Please watch: when Amnon’s heart is merry with wine, and I say to you, ‘Strike Amnon,’ then kill him. Do not fear. Have I not myself commanded you? Be strong, and be men of valor.”'
  footnotes:
  - marker: a
    text: Or, 'when Amnon is in good spirits from wine.' The Hebrew idiom literally speaks of his heart being good with wine.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 압살롬이 자기의 젊은이들에게 명령하며 말했습니다. 「잘 보십시오. 암논이 포도주로 마음이 즐거워지면, 내가 여러분에게 ‘암논을 치십시오’ 하고 말하겠습니다. 그러면 그를 죽이십시오. 두려워하지 마십시오. 내가 여러분에게 직접 명령하지 않았습니까? 강해지십시오. 그리고 용사다운 사람이 되십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘포도주로 그의 마음이 좋다’는 뜻이며, 술기운으로 기분이 풀린 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָרָיו
  english_pob_choice: his young men
  chosen_korean: 자기의 젊은이들
  alternatives_korean:
  - 자기의 종들
  - 자기의 시종들
  lexicon: HALOT
  rationale: נַעַר는 문맥에 따라 ‘젊은이, 종, 시종’이 될 수 있는데, 여기서는 압살롬의 명령을 수행할 사적인 부하들을 가리키므로 ‘젊은이들’이 원문의 연령감과 폭력적 실행 맥락을 함께 살립니다.
- source_word: רְאוּ נָא
  english_pob_choice: Please watch
  chosen_korean: 잘 보십시오
  alternatives_korean:
  - 보십시오
  - 주의해서 보십시오
  - 이제 보십시오
  lexicon: HALOT
  rationale: ראה 명령형과 נָא는 주의를 기울여 보라는 급한 지시입니다. ‘잘 보십시오’는 현대 한국어로 자연스럽고, 강한 주의 촉구를 유지합니다.
- source_word: כְּטוֹב לֵב אַמְנוֹן בַּיַּיִן
  english_pob_choice: when Amnon’s heart is merry with wine
  chosen_korean: 암논이 포도주로 마음이 즐거워지면
  alternatives_korean:
  - 암논이 포도주로 기분이 좋아지면
  - 암논이 포도주로 마음이 좋으면
  lexicon: HALOT
  rationale: ‘마음이 좋다’는 히브리어 관용구를 직역에 가깝게 살리되, 한국어에서는 ‘즐거워지다’가 자연스럽고 현재 문맥의 술기운을 드러냅니다.
- source_word: וִהְיוּ לִבְנֵי חָיִל
  english_pob_choice: be men of valor
  chosen_korean: 용사다운 사람이 되십시오
  alternatives_korean:
  - 용감한 사람들이 되십시오
  - 용사들이 되십시오
  - 담대한 사람이 되십시오
  lexicon: HALOT
  rationale: בְּנֵי חָיִל은 남성 복수의 관용구로 용맹한 전사/능력자를 뜻합니다. 한국어에서는 군사적·남성적 뉘앙스를 지나치게 현대화하지 않으면서도 자연스럽게 ‘용사다운 사람’으로 옮겼습니다.
theological_decisions:
- issue: 남성 복수 관용구 לִבְנֵי חָיִל의 처리
  chosen_reading: ‘용사다운 사람들/사람이 되십시오’로 남성적 대상과 전투적 맥락을 유지했습니다.
  alternative_readings:
  - 용감하십시오
  - 용맹한 자가 되십시오
  rationale: 이 말은 압살롬이 실행자들인 남성 부하들에게 하는 군사적 독려입니다. 성별과 사회적 맥락을 흐리는 중립화보다 원문의 남성 복수성과 전투적 분위기를 드러내는 편이 더 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
