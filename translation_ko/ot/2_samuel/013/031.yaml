base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/031.yaml
  text: Then the king arose[a], tore his garments, and lay on the ground, and all his servants were standing with their garments torn.
  footnotes:
  - marker: a
    text: Tearing one's garments was a customary expression of grief, horror, or mourning in the Hebrew Bible.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 왕은 일어나 자신의 옷을 찢고 땅에 누웠습니다.[a] 그의 모든 신하도 옷이 찢어진 채 서 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 옷을 찢는 것은 히브리 성경에서 슬픔, 공포 또는 애도를 나타내는 관습적 표현이었습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어서
  - 깨어나
  lexicon: HALOT
  rationale: 서술 진행을 나타내는 동작으로, 왕의 즉각적인 반응을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  english_pob_choice: tore his garments
  chosen_korean: 자기 옷을 찢고
