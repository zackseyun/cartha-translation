  - 땅에 쓰러졌습니다
  lexicon: HALOT
  rationale: אַרְצָה의 ‘땅/지면’ 방향성과 상실·비탄의 자세를 함께 보여 주기 위해 ‘엎드리다’를 택했습니다.
- source_word: נִצָּבִים קְרֻעֵי בְגָדִים
  english_pob_choice: were standing with their garments torn
  chosen_korean: 찢어진 옷을 입은 채 서 있었습니다
  alternatives_korean:
  - 옷이 찢어진 채 서 있었습니다
  - 찢어진 옷을 입고 서 있었습니다
  lexicon: HALOT
  rationale: 분사들의 상태를 한국어에서 자연스럽게 풀어, 신하들의 지속된 애통 상태를 드러냈습니다.
theological_decisions:
- issue: 왕의 애통 행동을 어떻게 표기할지
  chosen_reading: 왕의 즉각적인 비탄과 수치를 드러내는 몸짓으로, 과장 없이 직접적으로 묘사했습니다.
  alternative_readings:
  - 의례적 슬픔으로 완곡하게 표현하기
  - 감정적 표현을 약화시키기
  rationale: 본문은 애통의 관용적 행동들을 연속으로 제시하므로, 의미를 약화하지 않고 그대로 살리는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 서사 본문 해석 원칙
