  source_fidelity: ‘땅에 엎드렸습니다’는 שכב ארצה(땅에 눕다/누워 있다)보다 엎드려 절하는 자세를 구체화하므로 원문의 동작을 넘습니다. ‘땅에 누웠습니다’가 더 직접적입니다. 나머지 서술 순서와 신하들이 찢어진 옷을 한 상태로 서 있었다는 의미는 잘 반영합니다.
