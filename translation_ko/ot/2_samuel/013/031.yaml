  rationale: 히브리어 관용구를 그대로 살리되, 애통의 표지를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: וַיִּשְׁכַּב אַרְצָה
  english_pob_choice: lay on the ground
  chosen_korean: 땅에 엎드렸습니다
  alternatives_korean:
