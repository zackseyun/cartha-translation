- from: 그러자 왕이 일어나 자기 옷을 찢고 땅에 엎드렸습니다. 그의 모든 신하들도 찢어진 옷을 입은 채 서 있었습니다.[a]
  to: 그러자 왕은 일어나 자신의 옷을 찢고 땅에 누웠습니다.[a] 그의 모든 신하도 옷이 찢어진 채 서 있었습니다.
  rationale: ‘엎드리다’를 ‘땅에 눕다’로 고쳐 שכב와 ארצה의 기본 의미를 보존했습니다. 신하들의 상태는 원문의 수동 분사에 맞추어 ‘옷이 찢어진 채’로 다듬었고, 문화 주석은 해당 행위 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:37:08Z'
