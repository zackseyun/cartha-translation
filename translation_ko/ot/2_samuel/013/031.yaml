  - severity: low
    issue: 각주의 위치와 ‘찢어진 옷을 입은 채’
    rationale: 각주는 옷을 찢는 행위에 직접 붙이는 편이 적절합니다. 또한 ‘옷이 찢어진 채’는 קְרֻעֵי בְגָדִים의 수동적 결과 상태를 더 투명하게 드러냅니다.
