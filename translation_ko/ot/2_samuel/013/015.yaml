base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/015.yaml
  text: Then Amnon hated her with very great hatred[a], because the hatred with which he hated her was greater than the love with which he had loved her. And Amnon said to her, “Get up, go.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Get up, go.'' The abrupt two-word command conveys Amnon''s harsh dismissal; some English versions expand the sense with ''be gone'' or ''go away.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 암논은 몹시 큰 미움으로 그녀를 미워했습니다[a]. 그가 그녀에게 품은 미움이 그가 그녀에게 품었던 사랑보다 더 컸기 때문입니다. 암논이 그녀에게 말했습니다. “일어나십시오. 가십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘일어나라, 가라’라는 두 개의 짧은 명령으로 되어 있습니다. 그 단절된 표현은 암논의 가혹한 내침을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂנָאֶהָ / שִׂנְאָה
  english_pob_choice: hated her with very great hatred
  chosen_korean: 그녀를 매우 크게 미워하게 되었습니다 / 미움
  alternatives_korean:
  - 그녀를 몹시 미워하게 되었습니다
  - 그녀를 극도로 미워하게 되었습니다
  - 미워함
  lexicon: HALOT
  rationale: 히브리어는 단순한 감정보다 강도 높은 상태를 누적해 말하므로, 한국어도 ‘매우 크게’와 명사형 ‘미움’을 함께 써서 반복적 강조를 살렸습니다.
- source_word: גְּדוֹלָה מְאֹד / גְדוֹלָה הַשִּׂנְאָה
  english_pob_choice: very great / the hatred ... was greater
  chosen_korean: 매우 크게 / 더 컸기
  alternatives_korean:
  - 극히 큰
  - 지극히 큰
  - 더 강했기
  lexicon: HALOT
  rationale: 비교 구조가 뒤에 분명하므로, ‘더 컸기 때문입니다’로 비교를 직접 드러내되 과도한 의역은 피했습니다.
- source_word: אֲשֶׁר שְׂנֵאָהּ מֵאַהֲבָה אֲשֶׁר אֲהֵבָהּ
  english_pob_choice: the hatred with which he hated her ... than the love with which he had loved her
  chosen_korean: 그가 그녀를 미워한 미움이 그가 그녀를 사랑한 사랑보다
  alternatives_korean:
  - 그가 그녀를 미워했던 미움이 그가 그녀를 사랑했던 사랑보다
  - 그가 그녀를 미워한 것보다 그가 그녀를 사랑한 것보다
  lexicon: HALOT
  rationale: 히브리어의 상응 구조를 한국어에서도 평행하게 유지하여, 미움/사랑의 대비와 인과를 눈에 띄게 보존했습니다.
- source_word: קוּמִי לֵכִי
  english_pob_choice: Get up, go
  chosen_korean: 일어나서 가십시오
  alternatives_korean:
  - 일어나 가십시오
  - 일어나서 가세요
  - 일어나 가세요
  lexicon: HALOT
  rationale: 두 개의 짧은 명령을 한국어에서도 2연동으로 살리되, 본문 대화의 공적·냉혹한 톤을 반영해 합쇼체 명령으로 옮겼습니다.
theological_decisions:
- issue: 암논의 급격한 태도 전환과 명령의 냉혹함을 어떻게 드러낼지
  chosen_reading: 서술은 감정의 급변을 직접적으로 묘사하고, 명령은 정중한 형식이지만 내용상 차가운 축출로 읽히게 했습니다.
  alternative_readings:
  - ‘미워했습니다’로 단순화하여 감정 상태만 제시하는 방식
  - ‘가십시오’를 ‘나가십시오’로 더 노골적으로 해석하는 방식
  rationale: 본문의 핵심은 감정의 극단적 전도와 무정한 내쫓음이므로, 그 긴장을 완화하지 않는 쪽이 원문 의도에 더 가깝습니다.
  doctrine_reference: 서술 본문 해석 원칙
- issue: 직접 화법의 호칭 및 어조
  chosen_reading: 직접 인용은 합쇼체로 유지해 현대 표준어의 읽기성을 확보했습니다.
  alternative_readings:
  - 반말체로 옮겨 원문 명령의 거침을 극대화하는 방식
  - 더 완곡한 경어로 완화하는 방식
  rationale: 인물의 무례함은 내용 자체로 충분히 전달되며, 문체는 한국어 성경의 공적 읽기 관습에 맞추는 것이 적절합니다.
  doctrine_reference: 한국어 문체 원칙
