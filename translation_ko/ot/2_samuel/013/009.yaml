    rationale: יצק는 ‘쏟다’라는 동작을 나타내지만, 한국어에서는 쟁반에 음식을 ‘쏟아 놓다’가 자연스럽지 않습니다. הַמַּשְׂרֵת는 조리·제공 용기를 가리키므로 ‘그릇’으로 옮기면 본문의 구체성을 지나치게 제한하지 않으면서 동작을 보존합니다.
