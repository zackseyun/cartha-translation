base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/009.yaml
  text: Then she took the pan and poured them out before him[a], but he refused to eat. And Amnon said[b], “Send everyone out from me.” So everyone went out from him.
  footnotes:
  - marker: a
    text: Or “poured them out before him” or “set it before him”; the Hebrew verb is literally “poured out,” used here in the context of serving food.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “every man.” Here it functions collectively for all those present.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 쟁반을 가져다가 그의 앞에 쏟아 놓았으나, 그는 먹기를 거절했습니다. 그러자 암논이 말했습니다. “모든 사람을 내 앞에서 내보내십시오.” 그래서 모든 사람이 그의 곁에서 나갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 앞에 쏟아 놓았다’입니다. 여기서는 음식을 내오는 장면의 관용적 용법으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘모든 남자’입니다. 여기서는 그 자리에 있던 사람들을 통칭합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂרֵת
  english_pob_choice: the pan
  chosen_korean: 쟁반
  alternatives_korean:
  - 팬
  - 접시
  - 서빙 쟁반
  lexicon: HALOT
  rationale: 식탁에 음식을 내오는 그릇/받침을 가리키는 문맥이므로, 현대 한국어에서 가장 자연스러운 구체 명사인 ‘쟁반’을 택했습니다.
- source_word: וַתִּצֹק לְפָנָיו
  english_pob_choice: poured them out before him
  chosen_korean: 그의 앞에 쏟아 놓았으나
  alternatives_korean:
  - 그의 앞에 부어 놓았으나
  - 그 앞에 내놓았으나
  - 그의 앞에 퍼부었으나
  lexicon: HALOT
  rationale: יצק의 직역인 ‘붓다/쏟다’의 구체적 동작을 살리되, 음식 제공 장면이라는 문맥을 반영해 자연스럽게 옮겼습니다.
- source_word: וַיְמָאֵן לֶאֱכֹל
  english_pob_choice: he refused to eat
  chosen_korean: 먹기를 거절했습니다
  alternatives_korean:
  - 먹지 않으려 했습니다
  - 먹기를 마다했습니다
  lexicon: HALOT
  rationale: מָאֵן은 단순한 무의욕보다 분명한 거절을 뜻하므로, 의지적 거부를 분명히 드러냈습니다.
- source_word: הוֹצִיאוּ כָל אִישׁ מֵעָלַי
  english_pob_choice: Send everyone out from me
  chosen_korean: 모든 사람을 내 앞에서 내보내십시오
  alternatives_korean:
  - 모든 사람을 내 곁에서 내보내십시오
  - 모든 사람을 나에게서 내보내십시오
  - 사람마다 다 내보내십시오
  lexicon: HALOT
  rationale: הוֹצִיאוּ는 사동 명령이므로 ‘내보내십시오’로 옮겼고, מֵעָלַי의 관계적 의미를 한국어에서 자연스러운 ‘내 앞에서’로 풀었습니다.
- source_word: כָל אִישׁ
  english_pob_choice: everyone
  chosen_korean: 모든 사람
  alternatives_korean:
  - 모두
  - 각 사람
  - 모든 남자
  lexicon: HALOT
  rationale: 직역하면 ‘각 사람/모든 남자’이지만, 여기서는 함께 있던 이들을 통칭하는 표현이므로 성별을 드러내지 않는 ‘모든 사람’이 적절합니다.
theological_decisions:
- issue: 화자 존대와 직접 명령의 한국어 톤
  chosen_reading: 암논의 명령형은 상급자에게 내리는 일상적 지시로 보고, 현대 공손한 명령체 ‘-십시오’를 사용했습니다.
  alternative_readings:
  - ‘내보내라’로 낮춘 평서형/반말 명령
  - ‘내보내시오’ 같은 고전적 명령체
  rationale: 서사 문맥의 긴박함은 유지하되, 본문 전체를 현대 합쇼체로 일관시키기 위해 가장 중립적인 공손 명령형을 선택했습니다.
  doctrine_reference: n/a
