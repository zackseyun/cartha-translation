  source_fidelity: 전반적인 의미는 충실합니다. 다만 מֵעָלָיו는 앞선 명령의 מֵעָלַי와 대응하므로, ‘그의 곁에서 나갔습니다’보다 ‘그의 곁을 떠났습니다’가 한국어로 더 자연스럽게 대응합니다. 또한 ‘쟁반에 쏟아 놓다’는 한국어에서 다소 어색하므로, 용기의 종류를 과도하게 특정하지 않는 ‘그릇’을 사용하면서 יצק의 구체적 동작인 ‘쏟아 놓다’를 유지하는 편이 안전합니다.
  naturalness: 현대 표준어 합쇼체는 잘 유지되어 있습니다. 각주 표지는 해당 어휘 바로 뒤에 두는 것이 독자가 각주의 대상을 분명히 알 수 있어 더 적절합니다.
  terminology: 암논은 통용 표기이며 적절합니다. ‘모든 사람’은 כָּל־אִישׁ이 이 문맥에서 그 자리에 있던 사람 전체를 가리키는 용법을 자연스럽게 반영합니다. ‘그릇’은 הַמַּשְׂרֵת의 정확한 기물 종류가 불확실한 점을 보존합니다.
