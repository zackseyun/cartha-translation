  lexicon: HALOT
  rationale: דְּבָרִים는 여기서 보고된 사건들과 사정을 가리키므로 ‘일’이 가장 자연스럽고 포괄적입니다.
- source_word: וַ/יִּחַר ל֖/וֹ מְאֹד
  english_pob_choice: he was very angry
  chosen_korean: 매우 화가 났습니다
  alternatives_korean:
  - 몹시 분노했습니다
  - 그에게 크게 분노가 일었습니다
  lexicon: HALOT
  rationale: חרה לו의 관용적 의미를 현대 한국어의 ‘화가 나다’로 살리되, מְאֹד은 ‘매우’로 강도를 유지했습니다.
