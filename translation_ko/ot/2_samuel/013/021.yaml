  text: When King David heard all these things[a], he was very angry.
  footnotes:
  - marker: a
    text: Or, more literally, 'And the king David heard all these things, and it burned to him greatly,' that is, 'his anger burned greatly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗 왕이 이 모든 일을 듣고 매우 화가 났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘다윗 왕이 이 모든 일을 듣고 그에게 크게 타올랐다’는 뜻으로, 히브리어 관용구는 ‘분노가 크게 타올랐다’는 뉘앙스를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  english_pob_choice: When King David
  chosen_korean: 그때 다윗 왕이
  alternatives_korean:
  - 그리고 다윗 왕이
  - 다윗 왕은
  lexicon: HALOT
  rationale: 문장 첫머리의 וְ는 서술 전환으로 자연스럽게 풀었고, הַמֶּלֶךְ דָּוִד는 고유명사 앞의 칭호를 살려 ‘다윗 왕’으로 옮겼습니다.
- source_word: שָׁמַע אֵת כָּל הַ/דְּבָרִים הָ/אֵלֶּה
