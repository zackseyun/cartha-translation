translation:
  language: ko
  text: 다윗 왕은 이 모든 일을 듣고 몹시 분노했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘다윗 왕이 이 모든 일을 들었고, 그에게 매우 타올랐다’입니다. 이는 ‘그의 분노가 크게 타올랐다’는 뜻의 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  english_pob_choice: When King David
  chosen_korean: 그때 다윗 왕이
  alternatives_korean:
  - 그리고 다윗 왕이
  - 다윗 왕은
  lexicon: HALOT
  rationale: 문장 첫머리의 וְ는 서술 전환으로 자연스럽게 풀었고, הַמֶּלֶךְ דָּוִד는 고유명사 앞의 칭호를 살려 ‘다윗 왕’으로 옮겼습니다.
- source_word: שָׁמַע אֵת כָּל הַ/דְּבָרִים הָ/אֵלֶּה
  english_pob_choice: heard all these things
  chosen_korean: 이 모든 일을 듣고
  alternatives_korean:
  - 이 모든 것들을 듣고
  - 이 모든 말을 듣고
  lexicon: HALOT
  rationale: דְּבָרִים는 여기서 보고된 사건들과 사정을 가리키므로 ‘일’이 가장 자연스럽고 포괄적입니다.
- source_word: וַ/יִּחַר ל֖/וֹ מְאֹד
  english_pob_choice: he was very angry
  chosen_korean: 매우 화가 났습니다
  alternatives_korean:
  - 몹시 분노했습니다
  - 그에게 크게 분노가 일었습니다
  lexicon: HALOT
  rationale: חרה לו의 관용적 의미를 현대 한국어의 ‘화가 나다’로 살리되, מְאֹד은 ‘매우’로 강도를 유지했습니다.
