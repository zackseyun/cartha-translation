translation:
  language: ko
  text: 그러자 압살롬이 말했습니다. “그렇지 않다면, 제 형 암논을 우리와 함께 가게 해 주십시오.” 그러자 왕이 그에게 말했습니다. “어찌 그가 너와 함께 가야 하겠느냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 생략이 있는 표현으로, 더 풀면 ‘만일 당신이 허락하지 않으시면, 제 형 암논을 우리와 함께 가게 해 주십시오’라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֹּאמֶר / וַיֹּאמֶר
  english_pob_choice: Then ... said / But ... said
  chosen_korean: 그러자 ... 말했습니다 / 그러자 ... 말했습니다
