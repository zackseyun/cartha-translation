  text: Then Absalom said[a], “If not, please let my brother Amnon go with us.” But the king said to him, “Why should he go with you?”
  footnotes:
  - marker: a
    text: Or, more explicitly, 'If you will not, please let Amnon my brother go with us.' The Hebrew is elliptical.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 압살롬이 말했습니다. “그렇지 않다면[a], 제 형 암논을 우리와 함께 가게 해 주십시오.” 그러자 왕이 그에게 말했습니다. “어찌 그가 너와 함께 가야 하겠느냐?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 생략이 있는 표현으로, 더 풀면 ‘만일 당신이 허락하지 않으시면, 제 형 암논을 우리와 함께 가게 해 주십시오’라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֹּאמֶר / וַיֹּאמֶר
  english_pob_choice: Then ... said / But ... said
  chosen_korean: 그러자 ... 말했습니다 / 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: WLC narrative waw-consecutive
  rationale: 연속 서술을 자연스럽게 살리면서도, 대화 전환을 보여 주기 위해 두 절 모두 ‘그러자’로 옮겼습니다.
- source_word: וָלֹא
  english_pob_choice: If not
  chosen_korean: 그렇지 않다면
  alternatives_korean:
  - 만일 아니라면
  - 그렇지 않으면
  lexicon: HALOT
  rationale: 앞선 거절에 대한 응답이라는 문맥을 살려, 간결한 조건 표현을 현대 한국어로 자연스럽게 풀었습니다.
- source_word: אָחִי
  english_pob_choice: my brother
  chosen_korean: 제 형
  alternatives_korean:
  - 나의 형
  - 내 형
  lexicon: HALOT
  rationale: 압살롬의 말에서 아버지 다윗 왕에게 말하는 공손한 1인칭 표현으로 ‘제’를 사용했고, 형제 관계는 문맥상 남성 친족 관계인 ‘형’이 자연합니다.
- source_word: יֵלֵךְ עִמָּךְ
  english_pob_choice: Why should he go with you?
  chosen_korean: 어찌 그가 너와 함께 가야 하겠느냐?
  alternatives_korean:
  - 왜 그가 너와 함께 가야 하겠습니까?
  - 어찌 그가 당신과 함께 가야 하겠느냐?
  lexicon: HALOT
  rationale: 왕의 반문을 한국어의 자연스러운 반문형으로 살렸고, 왕이 압살롬에게 직접 말하는 구문이므로 2인칭 평칭을 사용했습니다.
theological_decisions:
- issue: 왕과 아들에게서 보이는 대화체 존칭 수준
  chosen_reading: 직접 인용문 안에서는 압살롬이 왕에게 공손하게 청하고, 왕은 압살롬에게 반문하는 대화 구조를 그대로 살렸습니다.
  alternative_readings:
  - 압살롬의 말을 더 평이하게 낮춤
  - 왕의 말을 지나치게 격식화함
  rationale: 본문의 서사적 긴장과 관계 구도를 흐리지 않기 위해, 화자 간 호칭과 종결을 한국어 대화 관습에 맞게 최소한으로 조정했습니다.
  doctrine_reference: 서사문 맥락의 화행 및 존대 체계
