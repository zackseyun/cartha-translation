  yaml_path: translation/ot/2_samuel/013/036.yaml
  text: And as soon as he finished speaking[a], behold, the king’s sons came, and they raised their voices and wept. The king also, and all his servants, wept with very great weeping.
  footnotes:
  - marker: a
    text: 'Hebrew: ''wept with a very great weeping,'' an emphatic expression for intense mourning.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말을 마치자마자 보십시오, 왕의 아들들이 와서 소리를 높여 울었습니다. 왕도 그의 모든 신하도 아주 크게 울었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘매우 큰 울음으로 울었다’는 강조 표현을 써서, 극심한 애곡을 나타냅니다.
    reason: lexical_alternative
