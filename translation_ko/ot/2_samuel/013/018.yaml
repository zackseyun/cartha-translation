translation:
  language: ko
  text: 그녀는 긴 소매가 달린 화려한 옷을 입고 있었습니다[a]. 이는 왕의 처녀 딸들이 늘 입던 옷이었습니다. 그때 그의 시종이 그녀를 밖으로 데리고 나가서 그녀 뒤에서 문을 잠갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘화려하게 장식된 옷’, ‘여러 빛깔의 옷’, ‘긴 소매가 달린 옷’으로도 옮길 수 있으나, 의복 용어의 정확한 뜻은 확정적이지 않습니다.
    reason: lexical_alternative
