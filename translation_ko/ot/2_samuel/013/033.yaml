  naturalness: ‘내 주 왕께서는’과 ‘마음에 두지 마십시오’는 현대 표준어 합쇼체에서 자연스럽고, 궁정적 공손함도 유지합니다. 인용문을 ‘…라는 말을’로 받아 첫 권고에 연결하면 한국어 문장 구조도 명료해집니다.
  terminology: ‘암논’, ‘왕의 아들들’, ‘내 주 왕’은 적절합니다. ‘말씀하지 마십시오’는 존대 동사 선택 자체보다 원문의 의미 관계에 맞지 않으므로 ‘…라는 말을 마음에 두지 마십시오’로 고칩니다.
