  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֡ה אַל יָשֵׂם֩ אֲדֹנִ֨/י הַ/מֶּ֤לֶךְ אֶל לִבּ/וֹ֙ דָּבָ֣ר לֵ/אמֹ֔ר כָּל בְּנֵ֥י הַ/מֶּ֖לֶךְ מֵ֑תוּ כִּֽי אִם אַמְנ֥וֹן לְ/בַדּ֖/וֹ מֵֽת־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/033.yaml
  text: Now let not my lord the king take this matter to heart[a], saying, ‘All the king’s sons are dead,’ for Amnon alone is dead.
  footnotes:
  - marker: a
    text: Hebrew literally, 'do not set this word/matter on his heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내 주 왕께서 이 일을 마음에 두지 마십시오[a]. ‘왕의 아들들이 모두 죽었다’고 말씀하지 마십시오. 암논만 죽었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 말을/일을 그의 마음에 두지 말라’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 지금
  - 그런즉
  lexicon: HALOT
  rationale: 화제 전환과 즉각적인 권고를 여는 담화 표지로, 현대 문체에서 자연스러운 ‘이제’가 적절합니다.
- source_word: אַ ל יָשֵׂם ... אֶל לִבּוֹ
  english_pob_choice: let not ... take ... to heart
  chosen_korean: 이 일을 마음에 두지 마십시오
  alternatives_korean:
  - 이 말을 마음에 새기지 마십시오
  - 이 일을 마음에 담아두지 마십시오
  - 이 말씀을 마음에 두지 마십시오
  lexicon: HALOT
  rationale: 직역의 ‘마음에 두다/새기다’보다, 본문의 관용구가 뜻하는 ‘염려하거나 깊이 받아들이지 말라’는 뉘앙스를 한국어로 자연스럽게 옮겼습니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: 내 주 왕께서
  alternatives_korean:
  - 내 주이신 왕께서
  - 왕이신 내 주께서
  - 왕이여
  lexicon: HALOT
  rationale: 궁정적이고 공손한 호칭을 유지하되, 현대 합쇼체에 맞게 ‘내 주 왕께서’로 옮겼습니다.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ מֵתוּ
  english_pob_choice: All the king’s sons are dead
  chosen_korean: 왕의 아들들이 모두 죽었다
  alternatives_korean:
  - 왕의 모든 아들들이 죽었다
  - 왕자들이 모두 죽었다
  lexicon: HALOT
  rationale: ‘sons’는 특정한 왕자 집단이지만, 본문은 혈연적 자손을 가리키므로 직설적인 ‘왕의 아들들’이 가장 소스에 가깝습니다.
- source_word: כִּי אִם אַמְנ֥וֹן לְבַדּוֹ מֵת
  english_pob_choice: for Amnon alone is dead
  chosen_korean: 암논만 죽었기 때문입니다
  alternatives_korean:
  - 암논만 죽었습니다
  - 암논만이 죽었습니다
  lexicon: HALOT
  rationale: ‘כִּי אִם’의 정정·제외 의미를 한국어 원인절로 풀어, 앞의 잘못된 보고를 바로잡는 대조를 분명히 했습니다.
theological_decisions:
- issue: 공손 호칭과 서술체의 균형
  chosen_reading: 인물 간 대화의 공손한 궁정 호칭은 유지하되, 본문 전체는 표준어 합쇼체로 정리했습니다.
  alternative_readings:
  - ‘내 주 왕이여’ 같은 더 고풍스러운 호칭
  - 평서형으로 완전히 중화된 표현
  rationale: 본문의 궁정 예절을 보존하면서도 현대 한국어 독자가 자연스럽게 읽도록 균형을 맞췄습니다.
  doctrine_reference: 문체·화행 일관성
