  source_fidelity: 본문의 ‘좋든 나쁘든 아무 말도 하지 않았습니다’는 לְמֵרָע וְעַד־טוֹב의 관용적 전면 부정을 잘 반영합니다. 그러나 ‘그의 누이’는 한국어에서 선행사가 모호할 수 있으므로, 히브리어 접미사가 가리키는 압살롬과의 관계를 명시하는 편이 안전합니다. עִנָּה는 이 문맥의 성적 폭력·수치를 드러내도록 ‘성적으로 욕보였다’로 보완하는 것이 적절합니다.
  naturalness: 초안의 ‘이는 … 때문인데, … 때문입니다’는 인과 표현이 중복되어 다소 부자연스럽습니다. 두 문장으로 나누어 자연스러운 현대 표준어 합쇼체로 다듬었습니다.
  terminology: ‘압살롬’, ‘암논’, ‘다말’은 통용 표기를 유지했습니다. ‘성적으로 욕보였다’는 법률 용어로 과도하게 특정하지 않으면서 이 문맥에서 עִנָּה가 가리키는 성적 훼손을 명확히 합니다.
