source:
  edition: WLC
  text: וְ/לֹֽא דִבֶּ֧ר אַבְשָׁל֛וֹם עִם אַמְנ֖וֹן לְ/מֵ/רָ֣ע וְ/עַד ט֑וֹב כִּֽי שָׂנֵ֤א אַבְשָׁלוֹם֙ אֶת אַמְנ֔וֹן עַל דְּבַר֙ אֲשֶׁ֣ר עִנָּ֔ה אֵ֖ת תָּמָ֥ר אֲחֹתֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/022.yaml
  text: And Absalom did not speak with Amnon[a], either bad or good[b], because Absalom hated Amnon because he had violated Tamar his sister.
  footnotes:
  - marker: a
    text: Or 'neither bad nor good,' an idiom meaning that Absalom said nothing at all to Amnon.
    reason: lexical_alternative
  - marker: b
    text: Or 'had humbled Tamar.' In this context the Hebrew verb refers to Amnon's sexual violation of her.
    reason: lexical_alternative
translation:
  language: ko
  text: 압살롬은 암논에게 좋든 나쁘든[a] 아무 말도 하지 않았습니다. 압살롬이 암논을 미워한 것은 암논이 압살롬의 누이 다말을 성적으로 욕보였기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나쁜 것에서 좋은 것까지’입니다. 히브리어 관용구로, 압살롬이 암논에게 전혀 말하지 않았다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘다말을 낮추었기 때문입니다.’ 이 문맥에서 히브리어 동사는 암논이 다말에게 가한 성적 폭력과 수치를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא דִבֶּר ... עִם
  english_pob_choice: did not speak with
  chosen_korean: 아무 말도 하지 않았습니다
  alternatives_korean:
  - 암논과 말하지 않았습니다
  - 암논에게 말하지 않았습니다
  lexicon: HALOT
  rationale: 히브리어 ‘דבר עם’의 대화 행위를 살리되, 관용구 전체가 ‘아예 말하지 않음’의 뜻이므로 한국어에서는 자연스럽게 ‘아무 말도 하지 않았습니다’로 옮겼습니다.
- source_word: לְמֵרָע וְעַד טוֹב
  english_pob_choice: either bad or good
  chosen_korean: 좋든 나쁘든
  alternatives_korean:
  - 나쁘든 좋든
  - 선하든 악하든
  lexicon: HALOT
  rationale: 이 표현은 실제 내용 범주가 아니라 어떤 말도 하지 않았음을 나타내는 관용적 대구이므로, 한국어에서도 의미를 그대로 드러내는 ‘좋든 나쁘든’을 택했습니다.
- source_word: עִנָּה
  english_pob_choice: had violated
  chosen_korean: 욕보였기
  alternatives_korean:
  - 학대했기
  - 괴롭혔기
  - 수치스럽게 했기
  lexicon: HALOT
  rationale: 이 동사는 여기서 단순한 ‘괴롭힘’보다 성적 수치와 폭력을 포함한 훼손을 가리키므로, 본문 의미를 분명히 하면서도 과도하게 법률화하지 않는 ‘욕보이다’를 사용했습니다.
- source_word: אֲחֹתוֹ
  english_pob_choice: his sister
  chosen_korean: 그의 누이 다말
  alternatives_korean:
  - 자기 누이 다말
  - 누이 다말
  lexicon: HALOT
  rationale: 대명사 소유격은 압살롬을 가리키며, 관계의 핵심이 남매 관계이므로 한국어에서는 자연스러운 ‘그의 누이 다말’로 옮겼습니다.
theological_decisions:
- issue: 압살롬의 침묵의 의미
  chosen_reading: ‘아무 말도 하지 않았습니다’로 옮겨, 단순한 무응답이 아니라 의도적 침묵이라는 문맥을 살렸습니다.
  alternative_readings:
  - ‘좋든 나쁘든 말하지 않았습니다’
  - ‘암논과 말하지 않았습니다’
  rationale: 본문은 질의응답 부재가 아니라 복수의 대구를 통한 전면적 침묵을 말하므로, 관용구의 힘을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 서사 문맥 해석
