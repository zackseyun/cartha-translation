revisions:
- from: 그러자 암논이 다말에게 말했습니다. “음식을 안쪽 방으로 가져와서, 네 손에서 먹게 하여라.” 그래서 다말은 자기가 만든 과자를 가져다가, 자기 오라버니 암논에게 안쪽 방으로 가져갔습니다.[a]
  to: 그러자 암논이 다말에게 말했습니다. “음식을 안쪽 방[a]으로 가져오너라. 내가 네 손에서 먹겠다.” 그래서 다말은 자기가 만든 과자를 가져다가 자기 오빠 암논이 있는 안쪽 방으로 가져갔습니다.
  rationale: 화자 자신이 먹겠다는 원문의 코호르타티브 뉘앙스를 자연스러운 한국어로 회복하고, 마지막 이동의 목적지를 분명히 했습니다. 고풍스러운 친족 호칭을 현대 표준어로 바꾸었으며, 각주는 본문의 어휘 범위만 설명하도록 절제했습니다.
