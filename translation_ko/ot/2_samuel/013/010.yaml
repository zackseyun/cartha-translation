base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/010.yaml
  text: Then Amnon said to Tamar[a], “Bring the food into the inner room, so that I may eat from your hand.” So Tamar took the cakes she had made and brought them into the inner room to Amnon her brother.
  footnotes:
  - marker: a
    text: Or “the chamber” or simply “the room.” The Hebrew חֶדֶר refers to an interior room; “inner room” is chosen here to reflect the secluded setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 암논이 다말에게 말했습니다. “음식을 안쪽 방으로 가져와서, 네 손에서 먹게 하여라.” 그래서 다말은 자기가 만든 과자를 가져다가, 자기 오라버니 암논에게 안쪽 방으로 가져갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘안쪽 방’은 히브리어 חֶדֶר의 내부 공간을 가리키며, 여기서는 다말을 더 은밀한 공간으로 불러들이는 서사적 효과를 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאִי
  english_pob_choice: Bring
  chosen_korean: 가져와서
  alternatives_korean:
  - 가져오너라
  - 가져오십시오
  lexicon: HALOT
  rationale: 여성 단수 명령형의 지시를 한국어 자연스러운 명령으로 옮기되, 상황상 다말을 시키는 말투를 반영해 ‘가져와서’로 처리했습니다.
- source_word: הַבִּרְיָה
  english_pob_choice: the food
  chosen_korean: 음식
  alternatives_korean:
  - 먹을 것
  - 식사
  - 음식물
  lexicon: HALOT
  rationale: 특정한 한 끼 전체보다 준비된 먹거리를 가리키므로, 과도하게 구체화하지 않는 ‘음식’이 적절합니다.
- source_word: הַחֶדֶר / הֶחָדְרָה
  english_pob_choice: the inner room
  chosen_korean: 안쪽 방
  alternatives_korean:
  - 방 안
  - 내실
  - 침실
  lexicon: HALOT
  rationale: חֶדֶר의 내부성 및 폐쇄성을 살리면서도 ‘내실’처럼 전통적이거나 해석이 덧붙은 표현을 피하기 위해 ‘안쪽 방’으로 일관되게 옮겼습니다.
- source_word: אֲשֶׁר עָשָׂתָה
  english_pob_choice: she had made
  chosen_korean: 자기가 만든
  alternatives_korean:
  - 만들어 둔
  - 만들어 놓은
  lexicon: HALOT
  rationale: 완료된 제작 사실을 자연스럽게 표현하되, 과자의 준비가 이미 끝났음을 드러내기 위해 ‘자기가 만든’으로 옮겼습니다.
theological_decisions:
- issue: 다말과 암논의 호칭 관계
  chosen_reading: ‘자기 오라버니 암논’처럼 친족 관계를 분명히 드러냈습니다.
  alternative_readings:
  - ‘형 암논’
  - ‘오빠 암논’
  rationale: 히브리어 אָחִיהָ는 중립적인 친족 용어이지만, 서사상 비극적 긴장을 강조하므로 관계를 분명히 드러내는 표현이 필요합니다. 남녀 친족 호칭의 구어적 뉘앙스는 한국어에서 고정되기 쉬워 보다 중립적인 ‘오라버니’를 택했습니다.
  doctrine_reference: 서사 문맥과 친족어의 직역성
