review_pass:
  verdict: revise
  source_fidelity: ‘누이동생’은 히브리어 אָחוֹת가 말하지 않는 연령 관계를 덧붙입니다. 본문은 단지 압살롬의 ‘누이’라고 하므로 이를 유지해야 합니다. ‘사랑하였습니다’는 וַיֶּאֱהָבֶהָ의 기본 의미를 충실히 보존합니다.
  naturalness: ‘아리따운’은 오늘날 표준 현대 한국어의 격식 있는 성경 문체에서는 다소 문어적·고풍스럽게 들립니다. ‘아름다운 누이’가 자연스럽고 명료합니다. 인칭 대명사 ‘그녀’ 대신 이름을 다시 쓰면 서술이 더 자연스럽습니다.
  terminology: ‘다말’, ‘압살롬’, ‘암논’, ‘다윗의 아들’은 한국어 성경의 통용 표기 및 원문의 반복된 혈통 표시에 적절합니다. ‘누이’는 관계를 정확히 유지하며, ‘누이동생’처럼 출생 순서를 특정하지 않습니다.
  issues:
  - severity: medium
    issue: ‘누이동생’이 אָחוֹת에 없는 연령 정보를 추가합니다.
    rationale: 히브리어 אָחוֹת는 ‘자매/누이’를 뜻할 뿐, 압살롬보다 어린 여동생임을 문법적으로 표시하지 않습니다. 원문의 모호성을 보존하려면 ‘누이’로 옮겨야 합니다.
  - severity: low
    issue: ‘아리따운’은 현대 표준어 합쇼체 본문에서 다소 고풍스럽습니다.
    rationale: יָפָה의 신체적 아름다움이라는 뜻은 ‘아름다운’으로 자연스럽고 직접적으로 전달됩니다.
  revised_text: 그 뒤에[a] 다윗의 아들 압살롬에게는 아름다운 누이가 있었는데, 그의 이름은 다말이었습니다. 다윗의 아들 암논은 다말을 사랑하였습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘이 일이 있은 뒤에’.
    reason: lexical_alternative
  - marker: b
    text: ‘사랑하였습니다’는 문맥에 따라 ‘반하였습니다’ 또는 ‘욕망하였습니다’로도 옮길 수 있습니다. 히브리어 동사는 일반적으로 ‘사랑하다’를 뜻하지만, 이어지는 이야기는 암논의 사랑이 왜곡되었음을 보여 줍니다.
    reason: lexical_alternative
  revision_rationale: 원문에 없는 연령 관계를 암시하는 ‘누이동생’을 ‘누이’로 고치고, 현대적이고 직접적인 표현인 ‘아름다운’으로 다듬었습니다. 암논의 감정을 본문에서 미리 도덕적으로 규정하지 않고 ‘사랑하였습니다’를 유지했습니다. 다만 해당 어휘의 문맥상 가능한 뉘앙스는 각주로 제시했습니다.
