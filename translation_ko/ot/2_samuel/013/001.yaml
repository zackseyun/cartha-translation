language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֗ן וּ/לְ/אַבְשָׁל֧וֹם בֶּן דָּוִ֛ד אָח֥וֹת יָפָ֖ה וּ/שְׁמָ֣/הּ תָּמָ֑ר וַ/יֶּאֱהָבֶ֖/הָ אַמְנ֥וֹן בֶּן דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/001.yaml
  text: After this[a], Absalom son of David had a beautiful sister whose name was Tamar, and Amnon son of David loved her.
  footnotes:
  - marker: a
    text: Or 'was infatuated with her' or 'desired her.' The Hebrew verb is the ordinary word for 'love,' but the following narrative shows that Amnon's affection was corrupt.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일이 있은 뒤에 다윗의 아들 압살롬에게는 아리따운 누이동생이 있었는데, 이름은 다말이었습니다. 다윗의 아들 암논은 그녀를 사랑하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  english_pob_choice: After this
  chosen_korean: 이 일이 있은 뒤에
  alternatives_korean:
  - 그 뒤에
  - 그 후에
  lexicon: HALOT
  rationale: 사건 전개의 시간표시를 자연스러운 현대 한국어로 옮기되, 다음 서사의 연결감을 유지하기 위해 단순한 접속 표현보다 시간 부사를 분명히 했습니다.
- source_word: אָחוֹת יָפָה
  english_pob_choice: a beautiful sister
  chosen_korean: 아리따운 누이동생
  alternatives_korean:
  - 아름다운 누이
  - 예쁜 누이동생
  lexicon: HALOT
  rationale: אָחוֹת는 단순한 ‘자매’이지만 문맥상 남성 친족 관계 안에서의 ‘누이동생’이 자연스럽고, יָפָה는 외모의 아름다움을 가리켜 ‘아리따운’으로 옮겼습니다.
- source_word: וּשְׁמָהּ תָּמָר
  english_pob_choice: whose name was Tamar
  chosen_korean: 이름은 다말이었습니다
  alternatives_korean:
  - 그의 이름은 다말이었습니다
  - 그리고 이름은 다말이었습니다
  lexicon: HALOT
  rationale: 히브리어 이름 제시 공식을 한국어 서술문으로 간결하게 옮겼으며, 고유명사 다말은 성서 관용 표기를 따랐습니다.
- source_word: וַיֶּאֱהָבֶהָ
  english_pob_choice: loved her
  chosen_korean: 사랑하였습니다
  alternatives_korean:
  - 그녀를 사랑했습니다
  - 그녀를 좋아했습니다
  lexicon: HALOT
  rationale: 원어는 সাধারণ한 אָהֵב의 용례이므로 의미를 앞서 해석하지 않고 ‘사랑하다’로 직역하되, 인물 관계의 비극적 긴장은 본문 자체가 드러내도록 두었습니다.
theological_decisions:
- issue: 암논의 אָהֵב를 도덕적으로 미리 규정할지 여부
  chosen_reading: 본문 표면어휘대로 ‘사랑하였습니다’로 두고, 뒤의 서사가 그 사랑의 왜곡을 드러내도록 유지합니다.
  alternative_readings:
  - 욕정에 사로잡혀 있었습니다
  - 사랑인 척하며 탐하였습니다
  rationale: 이 절 자체는 רגיל한 동사 ‘사랑하다’를 사용하므로, 번역문이 미리 평가어를 삽입하면 서사의 긴장과 아이러니를 해칠 수 있습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it prematurely.'
