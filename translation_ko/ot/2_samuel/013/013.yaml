review_pass:
  verdict: revise
  source_fidelity: ‘저를 당신에게서 거절하지’는 히브리어 מִמֶּךָּ(‘당신에게서/from you’)의 방향을 한국어에서 부자연스럽고 의미상 모호하게 처리합니다. 왕이 타마르를 암논에게 주는 것을 막거나 거절하지 않는다는 뜻으로 명시하는 편이 원문에 충실합니다. אָנָה ... אוֹלִיךְ는 ‘내 수치를 어디로 가져가겠습니까’로 옮겨 이동 비유와 수사 의문을 보존했습니다.
  naturalness: ‘어디로 내 수치를 가져가겠습니까?’와 ‘왕께 말씀드리십시오’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘불한당들 중 하나’는 문맥상의 도덕적 비난을 유지하면서도 과도하게 현대적·속어적인 표현은 피합니다.
  terminology: חֶרְפָּה는 ‘수치’로 유지했습니다. נְבָלִים은 단순한 지적 어리석음이 아니라 도덕적으로 수치스럽고 파렴치한 자들을 가리킬 수 있으므로 본문은 ‘불한당들’로, 각주는 그 의미 범위를 설명합니다. 결혼 허락의 함의는 각주에서 설명하되 타마르의 의도나 그 제안의 현실성을 확정하지 않았습니다.
  issues:
