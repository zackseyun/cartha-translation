revisions:
- from: 나로서는, 어디에 내 수치를 가져갈 수 있겠습니까? 그리고 당신은 이스라엘의 불한당들 가운데 하나처럼 될 것입니다. 그러니 이제 왕에게 말씀해 주십시오. 왕이 저를 당신에게서 거절하지 않을 것입니다.[a][b][c]
  to: 나로서는 내 수치를 어디로 가져가겠습니까?[a] 그리고 당신은 이스라엘의 불한당들 중 하나처럼 될 것입니다.[b] 그러니 이제 왕께 말씀드리십시오. 왕께서 저를 당신에게 주기를 거절하지 않으실 것입니다.[c]
  rationale: 원문의 이동 비유와 도덕적 비난을 유지하면서, 한국어의 부자연스러운 ‘당신에게서 거절하다’를 왕이 타마르를 암논에게 주기를 거절하지 않는다는 명료한 표현으로 수정했습니다. 각주 표지를 해당 어구에 배치하고, 타마르의 발화 의도에 관한 본문의 해석상 유보를 보존했습니다.
  reviewer_model: gpt-5.6-terra
