    issue: ‘왕이 저를 당신에게서 거절하지 않을 것입니다’의 조사 결합과 의미 방향
    rationale: ‘당신에게서 거절하다’는 한국어에서 자연스럽지 않으며, 왕이 타마르를 암논에게 주지 않는다는 원문의 ‘withhold ... from you’ 의미를 명료하게 전달하지 못합니다. ‘저를 당신에게 주기를 거절하지 않으실 것입니다’로 바로잡아야 합니다.
