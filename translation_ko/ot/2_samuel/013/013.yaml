source:
  edition: WLC
  text: וַ/אֲנִ֗י אָ֤נָה אוֹלִיךְ֙ אֶת חֶרְפָּתִ֔/י וְ/אַתָּ֗ה תִּהְיֶ֛ה כְּ/אַחַ֥ד הַ/נְּבָלִ֖ים בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּה֙ דַּבֶּר נָ֣א אֶל הַ/מֶּ֔לֶךְ כִּ֛י לֹ֥א יִמְנָעֵ֖/נִי מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/013.yaml
  text: As for me[a], where could I carry my disgrace? And you—you would be like one of the fools in Israel. So now, please speak to the king[c][b], for he will not withhold me from you.
  footnotes:
  - marker: a
    text: Or 'my shame' or 'my reproach.'
    reason: lexical_alternative
  - marker: b
    text: Or 'like one of the fools in Israel'; Hebrew נְבָלִים often refers to morally shameless or disgraceful people, not merely the intellectually foolish.
    reason: lexical_alternative
  - marker: c
    text: That is, 'he will not refuse to give me to you.' Tamar's statement may reflect either a genuine appeal or a desperate attempt to delay Amnon.
    reason: alternative_reading
translation:
  language: ko
  text: 나로서는 내 수치를 어디로 가져가겠습니까?[a] 그리고 당신은 이스라엘의 불한당들 중 하나처럼 될 것입니다.[b] 그러니 이제 왕께 말씀드리십시오. 왕께서 저를 당신에게 주기를 거절하지 않으실 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수치’는 ‘치욕’ 또는 ‘욕됨’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נְבָלִים은 단순히 지적으로 어리석은 사람들보다 도덕적으로 비열하고 수치스러운 사람들을 가리키는 경우가 많습니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 ‘왕께서 저를 당신에게 주는 것을 거절하지 않으실 것입니다’라는 뜻입니다. 이 말이 실제 허락을 기대한 청원인지, 시간을 벌기 위한 절박한 호소인지는 본문이 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָ֤נָה
  english_pob_choice: where
  chosen_korean: 어디에
  alternatives_korean:
  - 어디로
  - 어떻게
  lexicon: HALOT
  rationale: 불가피한 위치 상실과 수치의 ‘어디에 두다’는 질문이므로, 목적지 성격을 살리는 ‘어디에’가 가장 자연스럽습니다.
- source_word: חֶרְפָּתִ֔י
  english_pob_choice: my disgrace
  chosen_korean: 내 수치
  alternatives_korean:
  - 내 치욕
  - 내 수치스러움
  - 내 욕됨
  lexicon: HALOT
  rationale: 공적 모욕과 명예 손상을 함께 가리키는 말로, 한국어에서는 ‘수치’가 가장 직접적으로 그 긴장을 전달합니다.
- source_word: כְּ/אַחַ֥ד הַ/נְּבָלִ֖ים
  english_pob_choice: one of the fools / vile men
  chosen_korean: 불한당들 가운데 하나
  alternatives_korean:
  - 어리석은 자들 가운데 하나
  - 비열한 자들 가운데 하나
  - 망나니들 가운데 하나
  lexicon: HALOT
  rationale: 이 문맥의 נבל은 지능적 ‘어리석음’보다 도덕적·사회적 비열함을 가리키므로, 한국어의 ‘불한당들’이 그 경멸과 도덕적 비난을 잘 살립니다.
- source_word: יִמְנָעֵנִי מִמֶּךָּ
  english_pob_choice: he will not withhold me from you
  chosen_korean: 저를 당신에게서 거절하지 않을 것입니다
  alternatives_korean:
  - 저를 당신에게서 막지 않을 것입니다
  - 저를 당신에게서 떼어 놓지 않을 것입니다
  - 저를 당신에게 주는 것을 거절하지 않을 것입니다
  lexicon: HALOT
  rationale: מנע의 기본 의미는 ‘막다/거절하다’이며, 여기서는 왕이 결혼 요청을 거절하지 않을 것이라는 함의를 살려 ‘거절하지 않을 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 다윗 왕에게 청하는 말의 함의
  chosen_reading: 왕이 실제로 허락할 수 있었는지, 또는 암논을 지연시키려는 전략적 발화였는지 판단하지 않고, 본문이 드러내는 청원형 문장 그대로 유지했습니다.
  alternative_readings:
  - 타마르가 실제로 왕의 허락 가능성을 기대했다고 볼 수 있음
  - 타마르가 시간을 벌기 위해 의도적으로 말했을 수 있음
  rationale: 본문은 타마르의 발화를 보고할 뿐, 그 제안의 현실성이나 동기를 해설하지 않으므로 번역에서 해석을 확정하지 않는 것이 source-driven입니다.
  doctrine_reference: 'Translation philosophy: preserve tension and ambiguity rather than resolving it.'
