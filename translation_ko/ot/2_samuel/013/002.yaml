source:
  edition: WLC
  text: וַ/יֵּ֨צֶר לְ/אַמְנ֜וֹן לְ/הִתְחַלּ֗וֹת בַּֽ/עֲבוּר֙ תָּמָ֣ר אֲחֹת֔/וֹ כִּ֥י בְתוּלָ֖ה הִ֑יא וַ/יִּפָּלֵא֙ בְּ/עֵינֵ֣י אַמְנ֔וֹן לַ/עֲשׂ֥וֹת לָ֖/הּ מְאֽוּמָה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/002.yaml
  text: Amnon was so distressed that he made himself sick because of Tamar his sister[a], for she was a virgin[b], and it seemed impossible in Amnon’s eyes to do anything to her.
  footnotes:
  - marker: a
    text: Or, 'Amnon was distressed to the point of becoming sick because of Tamar his sister.' The Hebrew expression can be understood either as reflexive ('made himself sick') or as describing the result ('became sick').
    reason: lexical_alternative
  - marker: b
    text: The phrase 'it seemed impossible in Amnon’s eyes' is a Hebrew idiom meaning that Amnon saw no feasible way to act.
    reason: cultural_note
translation:
  language: ko
  text: 암논은 자신의 누이 다말 때문에 몹시 괴로워서 병까지 났습니다. 그녀가 처녀였기 때문에, 암논의 눈에는 그녀에게 아무것도 할 수 없는 것처럼 여겨졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘암논은 자신의 누이 다말 때문에 병이 날 정도로 괴로워했습니다.’ 히브리어 표현은 반사적으로 ‘스스로 병들게 하다’로도, 결과적으로 ‘병이 나다’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘암논의 눈에는 …처럼 여겨졌습니다’는 히브리어 관용구로, 암논이 실행 가능한 길을 보지 못했다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֶר
  english_pob_choice: was so distressed
  chosen_korean: 몹시 괴로워서
  alternatives_korean:
  - 괴로워서
  - 몹시 괴로워하며
  - 심하게 답답하여
  lexicon: HALOT
  rationale: 동사 יצר의 이 문맥상 의미는 내적으로 강한 압박과 괴로움을 느끼는 상태이므로, ‘몹시 괴로워서’가 자연스럽고 원문의 긴박함을 살립니다.
- source_word: לְהִתְחַלּוֹת
  english_pob_choice: that he made himself sick
  chosen_korean: 병까지 났습니다
  alternatives_korean:
  - 스스로 병들었습니다
  - 병이 났습니다
  - 스스로 아플 정도가 되었습니다
  lexicon: HALOT
  rationale: 히트파엘형은 ‘스스로 병들다/병이 나다’의 뉘앙스를 가질 수 있으므로, 결과를 자연스럽게 드러내는 ‘병까지 났습니다’로 옮겼습니다.
- source_word: בְתוּלָה
  english_pob_choice: a virgin
  chosen_korean: 처녀
  alternatives_korean:
  - 동정녀
  - 미혼 여인
  - 처녀 여자
  lexicon: HALOT
  rationale: 히브리어의 핵심 의미는 성경적/사회적 의미의 ‘처녀’이므로, 과도하게 교회적이거나 설명적인 표현보다 직접적인 표준어를 택했습니다.
- source_word: וַיִּפָּלֵא בְּעֵינֵי אַמְנוֹן
  english_pob_choice: it seemed impossible in Amnon’s eyes
  chosen_korean: 암논의 눈에는 아무것도 할 수 없는 것처럼 여겨졌습니다
  alternatives_korean:
  - 암논에게는 불가능해 보였습니다
  - 암논의 눈에는 불가능해 보였습니다
  - 암논에게는 할 수 없는 일처럼 보였습니다
  lexicon: HALOT
  rationale: ‘눈에는’이라는 히브리 관용구를 살리면서, ‘פלא’가 가리키는 ‘불가능해 보임/어려워 보임’을 한국어로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 성적 대상화와 서술 시점
  chosen_reading: 원문이 암논의 왜곡된 시선을 그대로 드러내므로, 한국어도 그 관점을 완곡하게 지우지 않고 유지했습니다.
  alternative_readings:
  - ‘그녀에게 아무것도 할 수 없었습니다’처럼 약하게 풀어 쓰기
  - 해설적으로 도덕 판단을 덧붙이기
  rationale: 이 절은 인물의 내적 상태와 관점 표현이 중요하므로, 서술의 거리감을 보존하는 것이 본문 이해에 유익합니다.
  doctrine_reference: 서사문맥의 화자 관점 보존
- issue: 문장 내 ‘병까지 났습니다’의 표현
  chosen_reading: 히브리어의 결과적 뉘앙스를 살려, 단순한 감정 묘사보다 신체적 결과를 드러내는 번역을 택했습니다.
  alternative_readings:
  - ‘괴로워했습니다’로만 번역하기
  - ‘스스로 병들었습니다’로 직역하기
  rationale: 원문은 감정이 신체적 병증으로 이어지는 전개를 말하므로, 결과성을 분명히 하는 표현이 적절합니다.
  doctrine_reference: 서사적 결과 표현
