- from: 그러므로 압살롬의 청년들이 암논에게 압살롬이 명령한 대로 하였습니다. 그때 왕의 모든 아들들이 일어나서, 각자 자기 노새를 타고 달아났습니다.[a][b]
  to: 그래서 압살롬의 부하들[b]은 암논에게 압살롬이 명령한 대로 하였습니다[a]. 그때 왕의 모든 아들들이 일어나, 각자 자기 노새를 타고 달아났습니다.
