source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֞וּ נַעֲרֵ֤י אַבְשָׁלוֹם֙ לְ/אַמְנ֔וֹן כַּ/אֲשֶׁ֥ר צִוָּ֖ה אַבְשָׁל֑וֹם וַ/יָּקֻ֣מוּ כָּל בְּנֵ֣י הַ/מֶּ֗לֶךְ וַֽ/יִּרְכְּב֛וּ אִ֥ישׁ עַל פִּרְדּ֖/וֹ וַ/יָּנֻֽסוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/029.yaml
  text: So Absalom’s young men did to Amnon as Absalom had commanded[a]. Then all the king’s sons arose[b], and each mounted his mule and fled.
  footnotes:
  - marker: a
    text: 'Literally, ''did to Amnon as Absalom had commanded.'' The previous verse states the command explicitly: to strike Amnon down when his heart was merry with wine.'
    reason: cross_reference
  - marker: b
    text: Or 'Absalom’s servants' / 'Absalom’s attendants.' The Hebrew term can refer to young men in service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 압살롬의 청년들이 암논에게 압살롬이 명령한 대로 하였습니다. 그때 왕의 모든 아들들이 일어나서, 각자 자기 노새를 타고 달아났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 ‘암논에게 압살롬이 명령한 대로 하였다’입니다. 바로 앞절이 그 명령의 구체적 내용—술에 취해 기분이 좋을 때 암논을 치라는 명령—을 이미 밝혀 줍니다.
    reason: cross_reference
  - marker: b
    text: ‘압살롬의 청년들’은 문맥상 압살롬의 수하들, 즉 그의 시종·종들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי אַבְשָׁלוֹם
  english_pob_choice: Absalom’s young men
  chosen_korean: 압살롬의 청년들
  alternatives_korean:
  - 압살롬의 종들
  - 압살롬의 시종들
  lexicon: HALOT
  rationale: נַעַר는 문맥에 따라 청년, 종, 시종이 될 수 있으므로, 여기서는 압살롬의 지시를 실행한 무리라는 점을 살리면서도 자연스러운 현대 한국어로 ‘청년들’을 택했습니다.
- source_word: וַיַּעֲשׂוּ לְאַמְנוֹן כַּאֲשֶׁר צִוָּה
  english_pob_choice: did to Amnon as Absalom had commanded
  chosen_korean: 암논에게 압살롬이 명령한 대로 하였습니다
  alternatives_korean:
  - 암논에게 압살롬이 시킨 대로 하였습니다
  - 암논에게 압살롬이 명령한 바를 행하였습니다
  lexicon: HALOT
  rationale: עשה + ל의 간결한 표현을 살려 ‘하였습니다’로 옮기고, 앞절의 명령 내용을 직접 덧붙이지 않고 문맥이 보완하도록 했습니다.
- source_word: וַיִּרְכְּבוּ אִישׁ עַל פִּרְדּוֹ
  english_pob_choice: each mounted his mule
  chosen_korean: 각자 자기 노새를 타고
  alternatives_korean:
  - 각자 자기 노새에 올랐고
  - 각자 자기 노새를 탔고
  lexicon: HALOT
  rationale: פֶּרֶד는 노새이므로 이를 직역했고, 분배적 이슈를 ‘각자 자기’로 분명히 하여 서술 흐름을 자연스럽게 만들었습니다.
- source_word: וַיָּנֻסוּ
  english_pob_choice: fled
  chosen_korean: 달아났습니다
  alternatives_korean:
  - 도망쳤습니다
  - 달아났습니다
  lexicon: HALOT
  rationale: 급박한 도주를 나타내는 נוּס의 의미를 살리되, 서사체에 잘 맞는 ‘달아났습니다’를 택했습니다.
theological_decisions:
- issue: 왕자들의 즉각적 반응과 서사적 긴박감
  chosen_reading: ‘일어나서… 달아났습니다’로 두 동작을 순차적으로 살려, 공포와 혼란의 급작스러움을 드러냈습니다.
  alternative_readings:
  - ‘일어나 각자 노새를 타고 도망쳤습니다’처럼 압축하기
  - ‘일어나서… 피했습니다’로 완곡하게 옮기기
  rationale: 히브리어 연속동사 구조를 따라 사건의 급박한 전개를 보존하는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: 서사 본문 번역 원칙
