  text: וַ/יֹּ֤אמֶר יֽוֹנָדָב֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּ֥ה בְנֵֽי הַ/מֶּ֖לֶךְ בָּ֑אוּ כִּ/דְבַ֥ר עַבְדְּ/ךָ֖ כֵּ֥ן הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/035.yaml
  text: Then Jonadab said to the king[a], “Look, the king’s sons have come; as your servant said, so it has happened.”
  footnotes:
  - marker: a
    text: Or “Behold, the king’s sons have come; as your servant said, so it was.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요나답이 왕에게 말했습니다. 「보십시오, 왕의 아들들이 왔습니다. 당신의 종이 말한 그대로 그렇게 되었습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “보십시오, 왕의 아들들이 왔습니다. 당신의 종이 말한 그대로 그렇게 되었습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그러자 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 진행감을 살리면서 현대 한국어 서술에 자연스럽게 맞추기 위해 ‘그때’로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사를 공손한 대화체로 살려, 왕에게 하는 발화의 예절을 유지했습니다.
- source_word: בְנֵי הַמֶּלֶךְ
  english_pob_choice: the king’s sons
  chosen_korean: 왕의 아들들
  alternatives_korean:
  - 왕의 아들들 모두
  - 왕자들
  lexicon: HALOT
  rationale: 문맥상 다수의 아들을 가리키므로 복수를 분명히 했고, ‘왕자들’보다 직역성이 높은 ‘왕의 아들들’을 택했습니다.
- source_word: כִּדְבַר עַבְדְּךָ כֵּן הָיָה
  english_pob_choice: as your servant said, so it has happened
  chosen_korean: 당신의 종이 말한 그대로 그렇게 되었습니다
  alternatives_korean:
  - 당신의 종이 말한 대로 그렇게 되었습니다
  - 당신의 종이 말한 그대로, 그렇게 된 것입니다
  lexicon: HALOT
  rationale: ‘כִּדְבַר’의 대응과 ‘כֵּן הָיָה’의 확인적 의미를 함께 살리기 위해, 예언/진술의 일치와 성취를 나타내는 ‘그대로 그렇게 되었습니다’로 옮겼습니다.
theological_decisions:
- issue: 왕에게 하는 정중한 직접 화법의 처리
  chosen_reading: 요나답의 발화를 현대 공손체로 옮겨, 왕에게 말하는 상황의 사회적 위계를 드러냈습니다.
  alternative_readings:
  - 평서체로 중립화
  - 더 고어적인 왕대접 표현
  rationale: 히브리어 원문은 단순한 서술이지만, 장면의 공적·궁정적 성격을 한국어에서 자연스럽게 전달하려면 공손체가 적절합니다.
  doctrine_reference: 서술 화법과 담화 정황의 재현
