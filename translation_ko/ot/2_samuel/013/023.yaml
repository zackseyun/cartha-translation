base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/023.yaml
  text: Now it happened after two full years that Absalom had sheep shearers at Baal-hazor[a], which is near Ephraim, and Absalom invited all the king’s sons.
  footnotes:
  - marker: a
    text: 'Hebrew: ''after two years of days,'' an idiom meaning a full two-year period.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일이 있은 지 두 해가 지나서, 압살롬은 바알하솔[?]에서, 곧 에브라임 근처에서, 양털 깎는 사람들을 두었고 압살롬은 왕의 모든 아들들을 초대했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘두 해의 날들 뒤에’라는 관용구로, 완전히 지난 두 해의 기간을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִשְׁנָתַיִם יָמִים
  english_pob_choice: after two full years
  chosen_korean: 이 일이 있은 지 두 해가 지나서
  alternatives_korean:
  - 두 해가 다 지나서
  - 두 해 뒤에
  lexicon: HALOT
  rationale: 히브리어 관용구는 완료된 기간을 나타내므로, 한국어에서는 자연스럽게 ‘있은 지 두 해가 지나서’로 옮겨 시간 경과와 완결성을 함께 살렸습니다.
- source_word: גֹזְזִים
  english_pob_choice: sheep shearers
  chosen_korean: 양털 깎는 사람들
  alternatives_korean:
  - 털 깎는 사람들
  - 양을 깎는 사람들
  lexicon: HALOT
  rationale: 문맥상 축제성 있는 양털 깎기이므로, 대상인 양을 분명히 드러내는 ‘양털 깎는 사람들’이 자연스럽고 오해가 적습니다.
- source_word: בְּבַעַל חָצ֖וֹר
  english_pob_choice: at Baal-hazor
  chosen_korean: 바알하솔
  alternatives_korean:
  - 바알-하솔
  - 바알 하솔
  lexicon: HALOT
  rationale: 지명은 음역을 따르며, 한국어 표기에서는 복합 지명을 붙여 쓰는 방식으로 간결하게 처리했습니다.
- source_word: אֲשֶׁר עִם אֶפְרָיִם
  english_pob_choice: which is near Ephraim
  chosen_korean: 에브라임 근처에서
  alternatives_korean:
  - 에브라임 곁에
  - 에브라임과 함께
  lexicon: HALOT
  rationale: עִם은 여기서 단순한 동반이 아니라 근접을 뜻하므로, 영어 POB의 판단을 따라 ‘근처’로 옮겼습니다.
- source_word: וַיִּקְרָא
  english_pob_choice: invited
  chosen_korean: 초대했습니다
  alternatives_korean:
  - 불렀습니다
  - 소집했습니다
  lexicon: HALOT
  rationale: 연회 문맥에서 ‘부르다’의 실질적 기능은 초대이므로, 서술 의도를 살려 ‘초대했습니다’로 번역했습니다.
