  text: וְ/אַבְשָׁל֥וֹם בָּרַ֖ח וַ/יֵּ֣לֶךְ גְּשׁ֑וּר וַ/יְהִי שָׁ֖ם שָׁלֹ֥שׁ שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/038.yaml
  text: But Absalom fled and went to Geshur[b][a], and he was there three years.
  footnotes:
  - marker: a
    text: Or "And Absalom fled and went to Geshur." The Hebrew conjunction can be rendered either "and" or "but" in context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, "and he was there three years"; alternatively, "and he stayed there three years."
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 압살롬은 도망하여 그술로 가서 거기서 삼 년 동안 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그런데’는 히브리어 접속사 וְ를 문맥상 전환 표시로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘거기서 삼 년 동안 있었다’입니다. ‘머물렀습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם
  english_pob_choice: But Absalom
  chosen_korean: 그런데 압살롬은
  alternatives_korean:
  - 그리고 압살롬은
  lexicon: WLC narrative conjunction
  rationale: 서술 흐름상 וְ는 단순 접속의 ‘그리고’보다 앞절과 이어지며 전환을 보이는 ‘그런데’가 더 자연스럽고, 고유명사는 압살롬으로 옮겼습니다.
- source_word: בָּרַח
  english_pob_choice: fled
  chosen_korean: 도망하여
  alternatives_korean:
  - 달아나
  - 도망쳤습니다
  - 피하여
  lexicon: HALOT
  rationale: ברח의 핵심은 도주이며, 합쇼체 서술에서 ‘도망하여’가 간결하고 원문의 긴박감을 살립니다.
- source_word: גְּשׁוּר
  english_pob_choice: Geshur
  chosen_korean: 그술
  alternatives_korean:
  - 게슈르
  - 그슈르
  lexicon: 표준 음역
  rationale: 성경 지명은 한국어에서 통용되는 ‘그술’을 사용해 가독성과 성경적 관용형을 반영했습니다.
- source_word: וַ/יְהִי שָׁ֖ם
  english_pob_choice: and he was there
  chosen_korean: 거기서 ... 있었습니다
  alternatives_korean:
  - 거기서 ... 머물렀습니다
  - 거기서 ... 살았습니다
  lexicon: HALOT
  rationale: היה의 문자적 의미를 살리되 한국어에서는 ‘거기서 있었습니다’가 가장 직접적이고, 시간 부사구와 함께 체류 의미를 자연스럽게 전달합니다.
theological_decisions:
- issue: 도주와 체류의 서술 방식
  chosen_reading: 압살롬의 이동을 단순한 장소 변경이 아니라 반역 이후의 도피와 유배 상태를 암시하는 서술로 유지했습니다.
  alternative_readings:
  - 그술로 갔다
  - 그곳에서 지냈습니다
  rationale: 히브리어 동사 배열은 사건의 연속성과 결과 상태를 함께 보여 주므로, 이를 약화시키지 않기 위해 ‘도망하여’와 ‘거기서 ... 있었습니다’를 함께 살렸습니다.
  doctrine_reference: 본문 서술의 역사적·서사적 뉘앙스 보존
