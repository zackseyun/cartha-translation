- from: 그때 압살롬이 그녀에게 말했습니다. 「암논 네 형이 너와 함께 있었느냐? 그러나 이제 내 누이야, 잠잠하라. 그가 네 형이 아니냐. 이 일을 마음에 두지 마라.」 그래서 다말은 압살롬 자기 형의 집에서 참담한 모습으로 지냈습니다.[a][b]
