base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/020.yaml
  text: Then Absalom her brother said to her[a], “Has Amnon your brother been with you? But now, my sister, keep silent; he is your brother. Do not take this matter to heart.” So Tamar remained, devastated[b], in the house of Absalom her brother.
  footnotes:
  - marker: a
    text: Hebrew 'Has Amnon your brother been with you?'—a discreet expression referring to the sexual assault.
    reason: lexical_alternative
  - marker: b
    text: Or 'desolate.' The Hebrew term conveys devastation, ruin, or appalled desolation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다말의 오빠 압살롬이 그녀에게 말했습니다. “암논 오빠가 너와 함께 있었습니까?[a] 그러나 이제, 내 누이여, 잠잠하십시오. 그는 네 오빠입니다. 이 일을 마음에 두지 마십시오.” 그래서 다말은 오빠 압살롬의 집에서 참담하게 지냈습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘암논 오빠가 너와 함께 있었습니까?’라는 완곡한 표현을 사용합니다. 문맥상 성폭력을 직접 말하지 않고 암시합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘황폐한 상태로.’ 히브리어는 파괴와 황량함, 충격으로 인한 참담한 상태를 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָחִי/ךְ
  english_pob_choice: your brother
  chosen_korean: 네 형
  alternatives_korean:
  - 네 오빠
  - 당신의 형제
  lexicon: HALOT
  rationale: 압살롬과 다말의 대화 맥락에서는 친족 관계를 자연스러운 현대 한국어로 드러내되, 남녀 형제 구분을 살려 ‘형’으로 옮겼습니다.
- source_word: הַחֲרִישִׁי
  english_pob_choice: keep silent
  chosen_korean: 잠잠하라
  alternatives_korean:
  - 조용히 하라
  - 말하지 마라
  lexicon: HALOT
  rationale: 히브리어 명령형의 ‘침묵하라’는 힘을 살리면서도, 한국어에서 다소 단호하고 고어적 뉘앙스가 있는 ‘잠잠하라’로 대응했습니다.
- source_word: אַל תָּשִׁיתִי אֶת לִבֵּךְ לַ/דָּבָר הַ/זֶּה
  english_pob_choice: Do not take this matter to heart
  chosen_korean: 이 일을 마음에 두지 마라
  alternatives_korean:
  - 이 일을 마음에 새기지 마라
  - 이 일에 마음 쓰지 마라
  lexicon: HALOT
  rationale: ‘마음을 두다/두지 마라’는 히브리어 관용구의 내면적 집착 금지를 자연스럽게 전달합니다.
- source_word: וְ/שֹׁ֣מֵמָ֔ה
  english_pob_choice: devastated
  chosen_korean: 참담한 모습으로
  alternatives_korean:
  - 황폐한 채로
  - 망연자실한 채로
  - 비참하게
  lexicon: HALOT
  rationale: 어근이 단순한 정서보다 폐허·황폐·충격의 상태를 함께 담기 때문에, 인물의 상태를 보여 주는 서술로 ‘참담한 모습으로’를 택했습니다.
theological_decisions:
- issue: 암묵적 성폭력 완곡 표현 보존
  chosen_reading: 본절의 ‘너와 함께 있었느냐?’를 성적 행위를 노골적으로 풀지 않고 그대로 유지했습니다.
  alternative_readings:
  - 암논이 너를 범했느냐?
  - 암논이 너와 동침했느냐?
  rationale: 히브리어는 의도적으로 완곡합니다. 본문의 절제된 표현을 보존하고, 문맥이 사건의 중대성을 드러내도록 두는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
