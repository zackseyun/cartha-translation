base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/007.yaml
  text: Then David sent word to Tamar at home[a], saying, “Please go to the house of your brother Amnon and prepare the food for him.”
  footnotes:
  - marker: a
    text: Or “make him a restorative dish” or “prepare the meal for him.” The Hebrew term refers to food prepared for an invalid or convalescent person.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗은 다말에게 사람을 보내어, “부디 네 형 암논의 집으로 가서 그를 위해 음식을 준비해라” 하고 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “회복식을 만들어라” 혹은 “그를 위한 식사를 준비해라”. 이 히브리어는 병자나 회복 중인 사람을 위해 마련한 음식을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent word
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 전하여
  - 말을 보내어
  lexicon: HALOT
  rationale: 동사 자체는 단순히 ‘보내다’이지만, 이어지는 לֵאמֹר과 결합되어 전달 행위가 강조되므로 한국어에서는 ‘사람을 보내어’로 옮겨 메시지 전달을 자연스럽게 드러냈습니다.
- source_word: הַבַּיְתָה
  english_pob_choice: at home
  chosen_korean: 집으로
  alternatives_korean:
  - 집에
  - 집안으로
  lexicon: HALOT
  rationale: 방향을 나타내는 הביתה는 위치라기보다 이동 방향을 띠므로, 문맥상 다말에게 특정 장소로 가라는 뜻을 살려 ‘집으로’로 옮겼습니다.
- source_word: לְכִי נָא
  english_pob_choice: Please go
  chosen_korean: 부디 … 가서
  alternatives_korean:
  - 제발 가서
  - 가 주십시오
  lexicon: HALOT
  rationale: 여성 단수 명령형에 나가 붙어 공손한 요청이 되므로, ‘부디’로 완곡함을 살리고 이어지는 행위를 한국어 관용에 맞게 연결했습니다.
- source_word: הַבִּרְיָה
  english_pob_choice: prepare the food
  chosen_korean: 음식을 준비해라
  alternatives_korean:
  - 회복식으로 준비해라
  - 먹을 것을 만들어라
  lexicon: HALOT
  rationale: 이 단어는 병자나 회복자를 위한 음식이라는 뉘앙스가 있지만, 본문 자체만으로는 구체성이 제한되므로 मुख्य 본문에서는 과도하게 좁히지 않고 ‘음식’을 유지했습니다.
theological_decisions:
- issue: 다윗의 명령체를 어떻게 전달할지
  chosen_reading: 직접 명령의 성격을 유지하되, 한국어에서는 공손한 요청 표현을 함께 살렸습니다.
  alternative_readings:
  - 단순 명령조로 ‘가서 … 준비해라’
  - 더 완곡하게 ‘가서 … 준비해 달라’
  rationale: 히브리어 לְכִי נָא는 단순 지시가 아니라 정중한 요청이므로, 다윗의 발화 톤을 지나치게 거칠거나 지나치게 약하게 만들지 않는 균형이 필요했습니다.
  doctrine_reference: 본문 화행의 정확한 재현
