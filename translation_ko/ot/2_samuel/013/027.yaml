    issue: ‘그는’의 선행사 모호성
    rationale: 한국어에서는 ‘압살롬이 … 하자, 그는 …’의 ‘그’가 압살롬을 가리키는 것으로 쉽게 해석될 수 있습니다. 그러나 ‘보냈다’의 주어는 문맥상 다윗입니다.
  - severity: low
    issue: ‘강하게 밀어붙이자’의 표현상 뉘앙스
    rationale: 지속적인 간청·강권의 관용적 의미를 전달하려는 의도는 적절하나, ‘밀어붙이다’는 물리적 행동이나 무리한 추진을 연상시킬 수 있습니다. ‘거듭 재촉하다’가 문맥과 문체에 더 정확하고 자연스럽습니다.
  revised_text: 그러나 압살롬이 다윗을 거듭 재촉하자, 다윗은 암논과 왕의 모든 아들을 그와 함께 보냈습니다.[a]
