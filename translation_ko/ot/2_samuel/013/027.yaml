source:
  edition: WLC
  text: וַ/יִּפְרָץ בּ֖/וֹ אַבְשָׁל֑וֹם וַ/יִּשְׁלַ֤ח אִתּ/וֹ֙ אֶת אַמְנ֔וֹן וְ/אֵ֖ת כָּל בְּנֵ֥י הַ/מֶּֽלֶךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/027.yaml
  text: But Absalom pressed him[a], so he sent Amnon and all the king’s sons with him.
  footnotes:
  - marker: a
    text: Or 'Absalom urged him' / 'Absalom prevailed upon him.' The Hebrew idiom is stronger than a simple request and indicates persistent pressure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 압살롬이 그를 강하게 밀어붙이자, 그는 암논과 왕의 모든 아들들을 그와 함께 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 단순한 요청보다 강한 지속적 압박을 뜻하므로, ‘강하게 밀어붙이자’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרָץ בּוֹ
  english_pob_choice: pressed him
  chosen_korean: 그를 강하게 밀어붙이자
  alternatives_korean:
  - 그를 간절히 권하자
  - 그를 거듭 재촉하자
  - 그를 강하게 압박하자
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 요청이 아니라 지속적이고 강한 압력을 뜻하므로, 한국어에서도 그 압박감을 살려 동사구로 옮겼습니다.
- source_word: וַיִּשְׁלַח
  english_pob_choice: he sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 파견했습니다
  - 내보냈습니다
  lexicon: HALOT
  rationale: 문맥상 다윗이 요청을 받아들여 사람들을 보내는 의미이므로, 가장 자연스럽고 직접적인 ‘보냈습니다’로 옮겼습니다.
- source_word: אִתּוֹ
  english_pob_choice: with him
  chosen_korean: 그와 함께
  alternatives_korean:
  - 그와 같이
  - 압살롬과 함께
  lexicon: HALOT
  rationale: 대명사형을 살려 ‘그와 함께’로 옮기되, 앞문맥상 압살롬을 가리키는 점은 한국어에서도 충분히 분명합니다.
- source_word: וְאֵת כָּל בְּנֵי הַמֶּלֶךְ
  english_pob_choice: and all the king’s sons
  chosen_korean: 왕의 모든 아들들을
  alternatives_korean:
  - 왕의 아들들 모두를
  - 왕자들을 모두
  lexicon: HALOT
  rationale: 직역하면 ‘왕의 아들들’이며, 본문은 다윗의 왕자들을 가리키므로 소유격 구조를 유지한 표현이 가장 정확합니다.
theological_decisions:
- issue: 서술의 힘을 살린 압박 표현
  chosen_reading: ‘그를 강하게 밀어붙이자’로 옮겨, 압살롬의 지속적 압박이라는 서술 효과를 유지했습니다.
  alternative_readings:
  - ‘그를 설득하자’
  - ‘그에게 간청하자’
  rationale: 이 절의 핵심은 단순한 설득이 아니라 거듭된 압박이므로, 서술 강도를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 본문 의미 보존 및 서술 강도
- issue: 대명사 지시의 명료성
  chosen_reading: ‘그와 함께’로 두어 히브리어 대명사 구조를 보존하면서도 문맥상 압살롬임을 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘압살롬과 함께’
  rationale: 원문의 형식을 지나치게 풀어 쓰지 않으면서도 한국어 독자가 주어 지시를 어렵지 않게 파악하도록 했습니다.
  doctrine_reference: 본문 형식 보존
