  text: וַ/יִּקְרָ֗א אֶֽת נַעֲר/וֹ֙ מְשָׁ֣רְת֔/וֹ וַ/יֹּ֕אמֶר שִׁלְחוּ נָ֥א אֶת זֹ֛את מֵ/עָלַ֖/י הַ/ח֑וּצָ/ה וּ/נְעֹ֥ל הַ/דֶּ֖לֶת אַחֲרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/017.yaml
  text: Then he called his young man who served him and said[a], “Please send this one away from me, outside[b], and bolt the door behind her.”
  footnotes:
  - marker: a
    text: Hebrew 'this'; the feminine form refers to Tamar with a deliberately distancing, contemptuous tone. 'This woman' makes the referent explicit in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'lock the door behind her.' The Hebrew verb can mean 'bolt,' 'bar,' or 'lock.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기의 시중을 드는 젊은이를 불러 말했습니다. “부디 이 여자[a]를 내게서 내보내어 밖으로 보내고, 그녀가 나간 뒤에 문을 걸어 잠그십시오[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 지시어는 여성형 단수이며, 문맥상 다말을 가리킵니다. 여기서는 경멸적이고 거리를 두는 말투를 드러냅니다.
    reason: source_note
  - marker: b
    text: 또는 “그녀가 나간 뒤에 문을 잠그십시오.” 히브리어 동사는 ‘걸어 잠그다’, ‘빗장지르다’, ‘잠그다’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת נַעֲרוֹ מְשָׁרְתוֹ
  english_pob_choice: his young man who served him
  chosen_korean: 자기에게 시중드는 젊은이
  alternatives_korean:
  - 그의 종
  - 그의 시종
  lexicon: HALOT
  rationale: נַעַר와 מְשָׁרֵת의 결합은 단순한 신분 호칭보다 ‘그를 시중드는 젊은 남자’라는 설명적 표현이 더 가깝습니다.
- source_word: שִׁלְחוּ נָא
  english_pob_choice: Please send
  chosen_korean: 부디 … 보내십시오
  alternatives_korean:
  - 제발 … 보내십시오
  - 부디 … 내보내십시오
  lexicon: HALOT
  rationale: נָא의 간청·정중함을 한국어의 ‘부디’로 살리고, שִׁלְחוּ는 문맥상 ‘보내다/내보내다’로 자연스럽게 옮겼습니다.
- source_word: זֹאת
  english_pob_choice: this one
  chosen_korean: 이 여자
  alternatives_korean:
  - 이것
  - 이 사람
  lexicon: HALOT
  rationale: 여성형 지시어가 다말을 가리키며 경멸적 거리감을 띠므로, 한국어에서는 대상이 분명히 드러나도록 ‘이 여자’로 옮겼습니다.
- source_word: וּנְעֹל הַדֶּלֶת אַחֲרֶיהָ
  english_pob_choice: and bolt the door behind her
  chosen_korean: 그녀 뒤로 문을 걸어 잠그십시오
  alternatives_korean:
  - 그녀 뒤로 문을 잠그십시오
  - 그녀 뒤로 문을 걸어 두십시오
  lexicon: HALOT
  rationale: נעל은 ‘잠그다’보다 더 강한 ‘걸어 잠그다/bolt’의 힘을 가지므로, 문을 확실히 닫아 잠그는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 다말을 가리키는 지시어의 경멸적 거리감
  chosen_reading: ‘이 여자’로 옮겨, 단순 지시가 아니라 무례하고 냉담한 어조를 드러냈습니다.
  alternative_readings:
  - ‘이 사람’으로 순화
  - ‘이것’처럼 중립적으로 처리
  rationale: 히브리어 זֹאת는 여기서 인격적 존중이 아닌 대상화된 거리감을 전달하므로, 그 어조를 희석하지 않는 번역이 필요합니다.
  doctrine_reference: 서사 문맥의 화용론적 의미 보존
- issue: 명령문의 격식
  chosen_reading: 인물 간 직접 명령은 합쇼체로 유지하되, 정중 표현 ‘부디’는 원문의 נָא를 반영해 살렸습니다.
  alternative_readings:
  - 전면 평서형으로 완화
  - 과도하게 고어체로 격상
  rationale: 현대 한국어 문체를 유지하면서도 원문의 간청·명령 결합을 보존하기 위한 선택입니다.
  doctrine_reference: 번역 문체 일관성 원칙
