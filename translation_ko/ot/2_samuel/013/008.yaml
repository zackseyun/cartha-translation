source:
  edition: WLC
  text: וַ/תֵּ֣לֶךְ תָּמָ֗ר בֵּ֛ית אַמְנ֥וֹן אָחִ֖י/הָ וְ/ה֣וּא שֹׁכֵ֑ב וַ/תִּקַּ֨ח אֶת הַ/בָּצֵ֤ק ו/תלוש וַ/תְּלַבֵּ֣ב לְ/עֵינָ֔י/ו וַ/תְּבַשֵּׁ֖ל אֶת הַ/לְּבִבֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/008.yaml
  text: So Tamar went to the house of her brother Amnon[a], while he was lying down. She took the dough, kneaded it, shaped it into cakes in his sight[b], and cooked the cakes.
  footnotes:
  - marker: a
    text: Or 'made heart-shaped cakes'; the Hebrew verb and noun are rare and may reflect a shape associated with the word for 'heart.'
    reason: lexical_alternative
  - marker: b
    text: Or 'boiled the cakes'; the Hebrew verb can specifically denote boiling, though here it may function more generally for cooking.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 다말은 자기 오빠 암논의 집으로 갔습니다. 암논은 누워 있었고, 다말은 반죽을 가져다가 주무르고 그가 보는 앞에서 떡으로 빚었습니다.[a] 그리고 그 떡을 익혔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음 모양의 떡을 만들고’라는 뜻일 수 있습니다. 히브리어 동사와 명사는 드물게 쓰이며, ‘마음’과 관련된 모양을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 떡을 삶았습니다’로 옮길 수 있습니다. 히브리어 동사는 특히 ‘삶다’를 뜻할 수 있으나, 여기서는 더 일반적으로 ‘익히다’를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ ... בֵּית
  english_pob_choice: So Tamar went to the house of her brother Amnon
  chosen_korean: 다말이 그의 오빠 암논의 집으로 갔습니다
  alternatives_korean:
  - 다말이 그의 형제 암논의 집으로 갔습니다
  - 다말이 오빠 암논의 집에 갔습니다
  lexicon: HALOT
  rationale: הלך + בית는 자연스러운 이동 표현으로 처리했고, אָחִיהָ는 관계를 분명히 하기 위해 문맥상 ‘오빠’로 옮겼습니다.
- source_word: וְהוּא שֹׁכֵב
  english_pob_choice: while he was lying down
  chosen_korean: 그는 누워 있었고
  alternatives_korean:
  - 그는 누워 있었으며
  - 그는 침상에 누워 있었고
  lexicon: HALOT
  rationale: 현재분사적 배경 설명을 한국어에서는 동시상태를 나타내는 연결형으로 자연스럽게 살렸습니다.
- source_word: וַתְּלַבֵּב לְעֵינָיו
  english_pob_choice: shaped it into cakes in his sight
  chosen_korean: 그의 눈앞에서 빚어 놓고
  alternatives_korean:
  - 그의 눈앞에서 떡 모양으로 만들고
  - 그가 보는 앞에서 빚어 놓고
  lexicon: HALOT
  rationale: לְעֵינָיו는 단순한 시각 정보가 아니라 ‘그가 보는 앞에서/눈앞에서’라는 공개적 행동을 뜻하므로 이를 반영했습니다. Rare verb וַתְּלַבֵּב는 확정적 ‘하트 모양’으로 좁히지 않고 ‘빚다/만들다’로 옮겼습니다.
- source_word: וַתְּבַשֵּׁל
  english_pob_choice: cooked the cakes
  chosen_korean: 그 떡을 익혔습니다
  alternatives_korean:
  - 그 떡을 삶았습니다
  - 그 떡을 조리했습니다
  lexicon: HALOT
  rationale: בשל은 문맥상 일반적인 조리 행위를 가리킬 수 있어 ‘익히다’로 옮겨 불필요한 ‘삶다’의 구체화를 피했습니다.
theological_decisions:
- issue: 본문의 희귀 동사 וַתְּלַבֵּב의 의미 범위
  chosen_reading: 주본문에서는 ‘빚어 놓고’로 두어 형태를 확정하지 않고, 희귀 어근이 암시할 수 있는 모양의 불확실성을 유지했습니다.
  alternative_readings:
  - ‘하트 모양으로 만들고’
  - ‘떡을 만들어 놓고’
  rationale: 영어 POB도 ‘heart-shaped’ 가능성을 각주로만 남기고 본문에서는 중립적으로 처리하므로, 한국어도 과잉해석을 피하는 쪽이 본문 충실성이 높습니다.
  doctrine_reference: 본문 주해/어휘 결정
