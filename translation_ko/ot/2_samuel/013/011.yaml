review_pass:
  verdict: revise
  source_fidelity: 히브리어의 동작 순서와 강제성을 대체로 충실히 반영했습니다. 다만 ‘먹으려고’는 한국어에서 다말이 먹기 위한 것처럼 읽히기 쉬우며, לֶאֱכֹל의 목적어/행위 주체가 암논임을 드러내야 합니다. שׁכב עִם의 성적 관용구는 ‘함께 누우라’만으로는 현대 한국어에서 충분히 명시되지 않을 수 있습니다.
  naturalness: 서술문은 자연스럽지만, 현대 합쇼체라는 목표에 비해 인용문의 ‘오너라’, ‘누우라’는 고어적·비격식 명령형입니다. ‘오십시오’와 ‘동침하십시오’는 현대의 격식 있는 문체를 유지하면서도 원문의 명령성과 성적 요구를 분명히 합니다.
  terminology: ‘내 누이여’는 אֲחוֹתִי의 친족 호칭을 보존하며 격식 있는 직접 호칭으로 적절합니다. ‘동침하다’는 이 문맥에서 שׁכב עִם의 성적 의미를 명확히 전달합니다. 각주에서는 인명 Tamar를 한국어 성경식 표기인 ‘다말’로 표기해야 합니다.
  issues:
  - severity: medium
    issue: ‘먹으려고’의 행위 주체가 불명확함
    rationale: 원문의 부정사는 암논이 먹는 목적을 나타내지만, 현 번역은 문법상 다말이 먹으려고 가져간 것으로 읽힐 수 있습니다. ‘그가 먹도록’으로 명시하는 편이 충실합니다.
  - severity: medium
    issue: 성적 관용구가 현대 한국어에서 충분히 명시되지 않음
    rationale: ‘나와 함께 누우라’는 문자적으로 함께 눕는 행위로도 이해될 수 있습니다. 문맥상 성적 요구인 שׁכב עִם을 ‘나와 동침하십시오’로 명확히 옮기는 것이 안전합니다.
  - severity: low
    issue: 인용문의 종결형이 목표 합쇼체와 불일치
    rationale: ‘오너라’, ‘누우라’는 고어적 명령형입니다. 지정된 현대 격식체에는 ‘오십시오’, ‘동침하십시오’가 더 적합합니다.
