  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תַּגֵּ֥שׁ אֵלָ֖י/ו לֶֽ/אֱכֹ֑ל וַ/יַּֽחֲזֶק בָּ/הּ֙ וַ/יֹּ֣אמֶר לָ֔/הּ בּ֛וֹאִי שִׁכְבִ֥י עִמִּ֖/י אֲחוֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/011.yaml
  text: When she brought it near to him to eat[a], he seized her and said to her, “Come, lie with me, my sister.”
  footnotes:
  - marker: a
    text: Or, 'she approached him to eat'; the Hebrew verb can mean either that Tamar came near or that she brought the food near to him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 그가 먹도록 그것을 그에게 가까이 가져가자[a], 그가 그녀를 붙잡고 그녀에게 말했습니다. “오십시오, 내 누이여. 나와 동침하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀가 그가 먹도록 그에게 가까이 갔다’로도 옮길 수 있습니다. 히브리어 동사는 다말이 가까이 간 것인지, 음식을 그에게 가까이 가져간 것인지 둘 다 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ אֵלָיו לֶאֱכֹל
  english_pob_choice: she brought it near to him to eat
  chosen_korean: 먹으려고 그것을 그에게 가까이 가져가자
  alternatives_korean:
  - 그에게 다가가자 먹으려고 그것을 가져가자
  - 그에게 그것을 가져다주자
  lexicon: HALOT
  rationale: נגשׁ는 ‘다가가다’와 ‘가까이 가져가다’ 모두 가능하므로, 문맥상 음식을 내어 드리는 장면을 살려 ‘가까이 가져가다’로 옮겼습니다.
- source_word: וַיַּחֲזֶק בָּהּ
  english_pob_choice: he seized her
  chosen_korean: 그가 그녀를 붙잡고
  alternatives_korean:
  - 그가 그녀를 움켜잡고
  - 그가 그녀를 강제로 붙잡고
  lexicon: HALOT
  rationale: חזק בְּ는 단순한 접촉보다 강하게 붙드는 뜻이므로, 강압적 상황을 과도하게 해석하지 않으면서도 힘의 뉘앙스를 살려 ‘붙잡고’로 옮겼습니다.
- source_word: בּוֹאִי שִׁכְבִי עִמִּי
  english_pob_choice: Come, lie with me
  chosen_korean: 오너라, 내 누이야. 나와 함께 누우라.
  alternatives_korean:
  - 와, 나와 동침하라, 내 누이야.
  - 오라, 내 누이야. 나와 잠자리를 같이하라.
  lexicon: HALOT
  rationale: שׁכב עִם은 성적 관용구이지만, 한국어에서 직설적이면서도 문체를 해치지 않는 표현으로 ‘나와 함께 누우라’를 택했습니다.
- source_word: אֲחוֹתִי
  english_pob_choice: my sister
  chosen_korean: 내 누이야
  alternatives_korean:
  - 내 여동생아
  - 내 자매야
  lexicon: HALOT
  rationale: 가족 관계를 분명히 드러내는 호칭을 유지해야 본문의 도덕적 충격이 살아나므로, 문학적으로 자연한 ‘내 누이야’를 사용했습니다.
theological_decisions:
- issue: 성적 요구를 완곡하게 만들지 않음
  chosen_reading: ‘나와 함께 누우라’로 성적 요구를 직접 드러냄
  alternative_readings:
  - ‘잠자리를 같이하라’로 완화
  - ‘동침하라’로 더 문어적으로 처리
  rationale: 히브리어 관용구의 노골성을 흐리면 장면의 폭력성과 서사적 무게가 약해지므로, 의미를 직접 전달하는 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: 누이 호칭의 유지
  chosen_reading: ‘내 누이야’
  alternative_readings:
  - 호칭을 생략
  - ‘내 여동생아’
  rationale: 가족 호칭은 단순한 신분 표시가 아니라 행위의 도덕적 파괴를 강조하므로 본문에 분명히 남겼습니다.
  doctrine_reference: Translation philosophy §§1, 5
