  lexicon: HALOT
  rationale: 본문 문맥상 다말의 신분을 드러내는 특수한 옷을 가리키며, POB의 주석 전통과 어휘 연구를 따라 전통적이지만 불확실한 ‘많은 색’보다 기능적 의미를 살린 표현을 택했습니다.
- source_word: וַתֵּלֶךְ הָלוֹךְ וְזָעָקָה
  english_pob_choice: went away, going and crying out
  chosen_korean: 나가면서 울부짖었습니다
  alternatives_korean:
  - 울며 나갔습니다
  - 가면서 계속 소리쳤습니다
  - 나가면서 소리 높여 울었습니다
  lexicon: HALOT
  rationale: 히브리어의 진행·반복 강조를 한국어에서 ‘-면서’와 ‘울부짖었습니다’로 압축해, 단순한 ‘울었다’보다 더 강한 지속적 절규를 살렸습니다.
theological_decisions:
- issue: 다말의 슬픔과 수치의 행위를 어떻게 드러낼 것인가
  chosen_reading: ‘재를 얹고’, ‘옷을 찢고’, ‘손을 머리에 얹은 채’라는 구체적 몸짓을 그대로 살려 애도와 수치를 직접 드러냈습니다.
  alternative_readings:
  - 의역하여 ‘슬퍼하며’ 정도로 묶는 번역
  - 문화적 설명을 본문 속에 덧붙이는 번역
  rationale: 본문은 감정을 설명하기보다 상징적 행위를 연속적으로 제시하므로, 행동의 구체성을 유지하는 편이 원문의 충격과 비탄을 더 충실히 전달합니다.
  doctrine_reference: 서사 본문 번역 원칙; 애도 표지의 상징성 보존
