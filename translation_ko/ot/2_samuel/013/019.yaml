  rationale: 애도의 표시로 머리에 얹는 물질을 한국어로는 보통 ‘재’라고 자연스럽게 옮길 수 있으며, 복수형 뉘앙스는 한국어에서 필수적이지 않습니다.
- source_word: כְּתֹנֶת הַפַּסִּים
  english_pob_choice: the robe of many colors
  chosen_korean: 긴 소매 옷
  alternatives_korean:
