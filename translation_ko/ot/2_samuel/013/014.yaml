theological_decisions:
- issue: 성폭력 서술의 직접성
  chosen_reading: ‘그녀를 욕보이고 그녀와 동침했습니다’로 두 동작을 분리해 번역했습니다.
  alternative_readings:
  - ‘그녀를 강간하고 그녀와 동침했습니다’
  - ‘그녀를 모욕하고 그녀와 동침했습니다’
  rationale: 원문은 ענה와 שׁכב의 두 동사를 연속해 사용하므로, 행위의 단계성과 폭력을 함께 보이기 위해 하나로 합치지 않고 구분했습니다.
  doctrine_reference: 본문의 역사서술; 성폭력 진술의 명료성
- issue: ‘듣다’ 관용구의 처리
  chosen_reading: ‘그녀의 말을 듣지 않았고’로 옮겼습니다.
  alternative_readings:
  - ‘그녀의 목소리를 듣지 않았고’
  - ‘그녀에게 순종하지 않았고’
  rationale: 히브리어 관용구 ‘목소리를 듣다’는 단순 청취가 아니라 요청을 받아들이는 것을 뜻하므로, 한국어 독자가 즉시 이해할 수 있는 관용 표현을 택했습니다.
  doctrine_reference: 히브리어 관용구의 의미 보전
