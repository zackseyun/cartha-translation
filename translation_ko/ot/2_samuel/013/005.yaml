revisions:
- from: 여호나답이 그에게 말했습니다. 「네 침상에 누워 병든 체하라. 네 아버지가 너를 보러 오시면 그에게 말하기를 ‘부디 내 누이 다말을 오게 하여 내게 음식을 차리게 하소서. 그리고 내 눈앞에서 그 음식을 만들게 하여 내가 보고 그녀의 손에서 먹게 하소서’ 하라」.[a][b][c]
  to: 여호나답이 그에게 말했습니다. “침상에 누워 아픈 체하십시오[a]. 아버지께서 당신을 보러 오시면, 그분께 ‘부디 제 누이 다말을 오게 하셔서 제게 음식[b]을 주게 해 주십시오. 또 제 눈앞에서 그 특별한 음식[c]을 만들게 하셔서 제가 보고 그 손에서 먹게 해 주십시오’라고 말씀하십시오.”
  rationale: 첫 음식 관련 동사는 다말이 암논에게 먹을 것을 제공하게 해 달라는 요청으로, 뒤의 ‘만들다’는 병자를 위한 특별 음식을 조리하게 해 달라는 요청으로 구별했습니다. 원문의 시각 요소와 ‘그 손에서’라는 직접 전달의 표현을 유지했으며, 지정된 현대 합쇼체에 맞추어 발화 형식을 정리하고 각주 표지를 해당 낱말에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:37:11Z'
