  text: וַ/יֹּ֤אמֶר ל/וֹ֙ יְה֣וֹנָדָ֔ב שְׁכַ֥ב עַל מִשְׁכָּבְ/ךָ֖ וְ/הִתְחָ֑ל וּ/בָ֧א אָבִ֣י/ךָ לִ/רְאוֹתֶ֗/ךָ וְ/אָמַרְתָּ֣ אֵלָ֡י/ו תָּ֣בֹא נָא֩ תָמָ֨ר אֲחוֹתִ֜/י וְ/תַבְרֵ֣/נִי לֶ֗חֶם וְ/עָשְׂתָ֤ה לְ/עֵינַ/י֙ אֶת הַ/בִּרְיָ֔ה לְמַ֨עַן֙ אֲשֶׁ֣ר אֶרְאֶ֔ה וְ/אָכַלְתִּ֖י מִ/יָּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/005.yaml
  text: Jehonadab said to him[a], “Lie down on your bed and pretend to be sick. When your father comes to see you, say to him, ‘Please let Tamar my sister come and give me food, and let her prepare the meal in my sight[c][b], so that I may watch and eat from her hand.’”
  footnotes:
  - marker: a
    text: Or 'feign illness.' The Hebrew verb here refers to making oneself appear sick.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'bread,' often used more broadly for food.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term likely refers to food specially prepared for a sick person or convalescent.
    reason: cultural_note
translation:
  language: ko
  text: 여호나답이 그에게 말했습니다. “침상에 누워 아픈 체하십시오[a]. 아버지께서 당신을 보러 오시면, 그분께 ‘부디 제 누이 다말을 오게 하셔서 제게 음식[b]을 주게 해 주십시오. 또 제 눈앞에서 그 특별한 음식[c]을 만들게 하셔서 제가 보고 그 손에서 먹게 해 주십시오’라고 말씀하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘아픈 척하다/병든 체하다’라는 뜻으로, 실제로 병들라는 말이 아니라 병을 가장하라는 지시입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘빵’은 여기서 병자에게 제공하는 음식 일반을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 여기서 ‘특별한 음식’으로 옮긴 히브리어 말은 병자나 회복 중인 사람을 위해 특별히 마련된 식사를 가리키는 것으로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁכַב עַל מִשְׁכָּבְךָ
  english_pob_choice: Lie down on your bed
  chosen_korean: 네 침상에 누워
  alternatives_korean:
  - 네 침대에 누워
  - 네 자리에 누워
  lexicon: HALOT
  rationale: 상태 지시 동사와 결합한 관용을 한국어로 자연스럽게 옮기되, 구체적 장소인 침상의 이미지를 유지했습니다.
- source_word: וְהִתְחָל
  english_pob_choice: pretend to be sick
  chosen_korean: 병든 체하라
  alternatives_korean:
  - 아픈 체하라
  - 병을 가장하라
  lexicon: HALOT
  rationale: 본문은 실제로 아프라는 뜻이 아니라 아픈 것처럼 보이라는 지시이므로, '체하다'를 사용해 위장/가장의 의미를 살렸습니다.
- source_word: וְתַבְרֵנִי לֶחֶם
  english_pob_choice: give me food
  chosen_korean: 내게 음식을 차리게 하소서
  alternatives_korean:
  - 내게 먹을 것을 주게 하소서
  - 내게 빵을 가져오게 하소서
  lexicon: HALOT
  rationale: לֶחֶם이 문자적으로는 '빵'이지만 문맥상 병자에게 제공하는 식사를 가리키므로, '음식을 차리다'로 번역해 식사 준비의 뉘앙스를 살렸습니다.
- source_word: וְעָשְׂתָה לְעֵינַי אֶת הַבִּרְיָה
  english_pob_choice: let her prepare the meal in my sight
  chosen_korean: 내 눈앞에서 그 음식을 만들게 하여
  alternatives_korean:
  - 내 눈앞에서 식사를 준비하게 하여
  - 내 앞에서 그 식사를 만들게 하여
  lexicon: HALOT
  rationale: ‘내 눈앞에서’는 가시성의 요소를, '만들게 하여'는 הַבִּרְיָה의 조리 행위를 반영합니다. 한국어에서는 'prepare the meal'보다 '음식을 만들다'가 문맥상 덜 어색합니다.
- source_word: וְאָכַלְתִּי מִיָּדָהּ
  english_pob_choice: eat from her hand
  chosen_korean: 그녀의 손에서 먹게 하소서
  alternatives_korean:
  - 그녀의 손에서 먹게 하소서
  - 그녀의 손으로부터 먹게 하소서
  lexicon: HALOT
  rationale: ‘손에서’는 직접 건네받는 관계를 보존하며, 사건 전개에서 중요한 신체적·관계적 긴장을 드러냅니다.
theological_decisions:
- issue: 명령/간청이 섞인 연속 대화의 한국어 높임말
  chosen_reading: 아버지에게 올릴 요청 부분은 간청형 '하소서'로 옮기고, 서술·지시 부분은 평서/명령형을 유지했습니다.
  alternative_readings:
  - 전 구절을 일괄적으로 명령형으로 처리
  - 전 구절을 일괄적으로 간청형으로 처리
  rationale: 히브리어 원문은 아버지에게 전달할 말 속에 공손한 요청이 섞여 있으므로, 한국어에서도 화자 간 관계와 발화 층위를 구분하는 것이 의미를 더 정확히 드러냅니다.
  doctrine_reference: 화행과 담화층위 보존
- issue: ‘보고’와 ‘그녀의 손에서 먹다’의 시각·행위 강조
  chosen_reading: ‘내 눈앞에서 그 음식을 만들게 하여 내가 보고 ... 먹게 하소서’로 시각적 감시와 직접 수발의 의도를 함께 드러냈습니다.
  alternative_readings:
  - ‘내 눈앞에서 ... 준비하게 하여 내가 먹게 하소서’
  - ‘내가 지켜보며 먹게 하소서’
  rationale: 본문의 의도는 단순한 식사보다 아버지와 가족을 속이기 위한 연출이므로, 시각성과 직접 수발의 요소를 모두 살려야 합니다.
  doctrine_reference: 서사 의도 보존
