  yaml_path: translation/ot/2_samuel/013/004.yaml
  text: He said to him[a], “Why are you so gaunt, son of the king, morning after morning? Will you not tell me?” And Amnon said to him, “I love Tamar[b], the sister of my brother Absalom.”
  footnotes:
  - marker: a
    text: Or 'every morning' or more formally 'morning by morning.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I am in love with Tamar.' The Hebrew more literally says 'I love Tamar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말했습니다. “어찌하여 당신은 왕의 아들인데도 아침마다 그렇게 야위어 갑니까? 내게 말하지 않겠습니까?” 그러자 암논이 그에게 말했습니다. “나는 압살롬의 누이 다말을 사랑합니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아침마다’는 원문의 반복 표현 בַּבֹּקֶר בַּבֹּקֶר을 자연스럽게 옮긴 것입니다. 더 직역하면 ‘아침으로 아침으로’ 또는 ‘아침마다 아침마다’가 될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 אָהֵב는 기본적으로 ‘사랑하다’입니다. 문맥상 더 강한 해석인 ‘사랑에 빠져 있다/사모하고 있다’도 가능하지만, 본문은 그 자체로는 단순히 ‘사랑합니다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  lexicon: HALOT
  rationale: 직접적인 이유를 묻는 의문사이므로, 문어체이면서도 자연스러운 ‘어찌하여’로 옮겼습니다.
- source_word: דַּל
  english_pob_choice: gaunt
  chosen_korean: 야위어 갑니다
  alternatives_korean:
  - 여위어 갑니다
  - 수척해집니다
  lexicon: HALOT
  rationale: 문맥상 눈에 띄게 수척해진 상태를 가리키므로, 외형의 쇠약을 드러내는 ‘야위어 갑니다’가 가장 자연스럽습니다.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  english_pob_choice: morning after morning
  chosen_korean: 아침마다
  alternatives_korean:
  - 아침마다 아침마다
  - 아침 아침마다
  lexicon: HALOT
  rationale: 반복의 의미를 한국어 부사구로 간결하게 살렸습니다. 영어 POB의 반복 표현은 의미상 ‘매일 아침 반복됨’을 가리킵니다.
- source_word: אֲחוֹת אַבְשָׁלֹם אָחִי
  english_pob_choice: the sister of my brother Absalom
  chosen_korean: 압살롬의 누이 다말
  alternatives_korean:
  - 내 형제 압살롬의 누이 다말
  - 내 동생 압살롬의 누이 다말
  lexicon: HALOT
  rationale: 히브리어의 친족 관계를 유지하되, 한국어에서는 소유·관계 표현을 자연스럽게 정리했습니다. ‘누이’는 여성 형제 관계를 분명히 드러냅니다.
- source_word: אֹהֵב
  english_pob_choice: I love
  chosen_korean: 사랑합니다
  alternatives_korean:
  - 사랑하고 있습니다
  - 좋아합니다
  - 사모합니다
  lexicon: HALOT
  rationale: 히브리어의 기본 동사 אָהֵב를 평이하게 살려 ‘사랑합니다’로 번역했습니다. POB의 직역 취지를 유지하면서도 한국어에서 가장 직접적인 대응입니다.
theological_decisions:
- issue: 암논의 진술을 어떤 어조로 옮길지
  chosen_reading: ‘나는 압살롬의 누이 다말을 사랑합니다’처럼 중립적 서술로 유지했습니다.
  alternative_readings:
  - ‘나는 다말을 사랑하고 있습니다’
  - ‘나는 다말에게 마음이 있습니다’
  rationale: 본문 자체는 אָהֵב의 일반적 의미를 말할 뿐이므로, 욕망이나 연애 감정을 해석적으로 덧입히지 않았습니다. 서사 전체의 죄성은 본문 밖 맥락에서 이해하도록 두는 것이 source-grounded에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
