  text: He said to him[a], “Why are you so gaunt, son of the king, morning after morning? Will you not tell me?” And Amnon said to him, “I love Tamar[b], the sister of my brother Absalom.”
  footnotes:
  - marker: a
    text: Or 'every morning' or more formally 'morning by morning.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I am in love with Tamar.' The Hebrew more literally says 'I love Tamar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말했습니다. “왕자님께서는 어찌하여 아침마다[a] 그렇게 수척하십니까? 내게 말하지 않겠습니까?” 그러자 암논이 그에게 말했습니다. “나는 내 형제 압살롬의 누이인 다말을 사랑합니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아침에 아침에’라고 반복합니다. ‘매일 아침’ 또는 ‘아침마다 아침마다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אָהֵב는 기본적으로 ‘사랑하다’입니다. ‘다말을 사랑하고 있습니다’ 또는 문맥을 반영하여 ‘다말을 사모합니다’로 옮길 수도 있으나, 본문은 문자적으로 ‘나는 다말을 사랑한다’라고 말합니다.
    reason: lexical_alternative
