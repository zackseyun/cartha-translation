  lexicon: HALOT
  rationale: 히브리어의 친족 관계를 유지하되, 한국어에서는 소유·관계 표현을 자연스럽게 정리했습니다. ‘누이’는 여성 형제 관계를 분명히 드러냅니다.
- source_word: אֹהֵב
  english_pob_choice: I love
  chosen_korean: 사랑합니다
  alternatives_korean:
  - 사랑하고 있습니다
  - 좋아합니다
  - 사모합니다
  lexicon: HALOT
  rationale: 히브리어의 기본 동사 אָהֵב를 평이하게 살려 ‘사랑합니다’로 번역했습니다. POB의 직역 취지를 유지하면서도 한국어에서 가장 직접적인 대응입니다.
theological_decisions:
- issue: 암논의 진술을 어떤 어조로 옮길지
  chosen_reading: ‘나는 압살롬의 누이 다말을 사랑합니다’처럼 중립적 서술로 유지했습니다.
  alternative_readings:
  - ‘나는 다말을 사랑하고 있습니다’
  - ‘나는 다말에게 마음이 있습니다’
  rationale: 본문 자체는 אָהֵב의 일반적 의미를 말할 뿐이므로, 욕망이나 연애 감정을 해석적으로 덧입히지 않았습니다. 서사 전체의 죄성은 본문 밖 맥락에서 이해하도록 두는 것이 source-grounded에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
