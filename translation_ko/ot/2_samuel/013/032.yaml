  text: וַ/יַּ֡עַן יוֹנָדָ֣ב בֶּן שִׁמְעָ֨ה אֲחִֽי דָוִ֜ד וַ/יֹּ֗אמֶר אַל יֹאמַ֤ר אֲדֹנִ/י֙ אֵ֣ת כָּל הַ/נְּעָרִ֤ים בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הֵמִ֔יתוּ כִּֽי אַמְנ֥וֹן לְ/בַדּ֖/וֹ מֵ֑ת כִּֽי עַל פִּ֤י אַבְשָׁלוֹם֙ הָיְתָ֣ה שׂוּמָ֔ה מִ/יּוֹם֙ עַנֹּת֔/וֹ אֵ֖ת תָּמָ֥ר אֲחֹתֽ/וֹ׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/032.yaml
  text: Then Jonadab son of Shimeah[a], David’s brother, answered and said, “Let not my lord say, ‘They have killed all the young men, the king’s sons,’ for Amnon alone is dead[b]. For this had been determined by Absalom from the day he violated Tamar his sister.”
  footnotes:
  - marker: a
    text: Or 'had been set on Absalom’s word/command,' that is, had been fixed in accordance with Absalom’s settled intention.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb can also be rendered 'humiliated' or, in context, more explicitly 'raped.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗의 형제 시므아의 아들 요나답이 대답하여 말했습니다. “내 주께서는 ‘왕의 아들들인 모든 젊은이가 죽임을 당했다’고 말씀하지 마십시오. 암논만 죽었습니다. 이는 압살롬이 자기 누이 다말을 욕보인 날부터 압살롬의 뜻에 따라[a] 정해져 있던 일이었습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 직역하면 ‘압살롬의 입/말에 따라’입니다. 여기서는 압살롬의 확정된 뜻에 따라, 또는 압살롬의 명령에 따라라는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘굴욕을 주다’로도 옮길 수 있으며, 이 문맥에서는 더 직접적으로 ‘강간하다’를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
