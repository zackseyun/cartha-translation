  edition: WLC
  text: וַ/יַּ֡עַן יוֹנָדָ֣ב בֶּן שִׁמְעָ֨ה אֲחִֽי דָוִ֜ד וַ/יֹּ֗אמֶר אַל יֹאמַ֤ר אֲדֹנִ/י֙ אֵ֣ת כָּל הַ/נְּעָרִ֤ים בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הֵמִ֔יתוּ כִּֽי אַמְנ֥וֹן לְ/בַדּ֖/וֹ מֵ֑ת כִּֽי עַל פִּ֤י אַבְשָׁלוֹם֙ הָיְתָ֣ה שׂוּמָ֔ה מִ/יּוֹם֙ עַנֹּת֔/וֹ אֵ֖ת תָּמָ֥ר אֲחֹתֽ/וֹ׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/032.yaml
  text: Then Jonadab son of Shimeah[a], David’s brother, answered and said, “Let not my lord say, ‘They have killed all the young men, the king’s sons,’ for Amnon alone is dead[b]. For this had been determined by Absalom from the day he violated Tamar his sister.”
  footnotes:
  - marker: a
    text: Or 'had been set on Absalom’s word/command,' that is, had been fixed in accordance with Absalom’s settled intention.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb can also be rendered 'humiliated' or, in context, more explicitly 'raped.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요나답이 대답하여 말했습니다. “내 주께서 ‘왕의 아들인 모든 젊은이들이 죽임을 당했다’고 말씀하지 마십시오. 암논만 홀로 죽었습니다. 이것은 압살롬이 다말 그의 누이를 욕보인 날부터 이미 결정된 일이었습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘입/말에 따라’는 여기서 압살롬의 이미 확정된 의도나 명령에 따른 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 문맥상 ‘굴욕을 주다’ 또는 더 직접적으로 ‘강간하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답하여 이르렀습니다
  - 대답하며 말했습니다
  lexicon: HALOT
  rationale: 히브리어 서사문에서 이어지는 응답 공식을 자연스러운 현대 서술체로 옮기되, 대화의 격식을 유지했습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주
  alternatives_korean:
  - 주인님
  - 주님
  lexicon: HALOT
  rationale: 궁정 예법의 존칭으로서 ‘my lord’에 가장 직접적으로 대응하는 표현을 택했습니다.
- source_word: הַנְּעָרִים בְּנֵי הַמֶּלֶךְ
  english_pob_choice: the young men, the king’s sons
  chosen_korean: 왕의 아들인 모든 젊은이들
  alternatives_korean:
  - 왕의 아들들인 젊은이들
  - 젊은 왕자들
  lexicon: HALOT
  rationale: ‘젊은이들’과 ‘왕의 아들들’의 동격 관계를 살리면서, 문맥상 다수의 왕자들을 가리키는 점을 한국어로 분명히 했습니다.
- source_word: עַל פִּי אַבְשָׁלוֹם ... הָיְתָה שׂוּמָה
  english_pob_choice: this had been determined by Absalom
  chosen_korean: 이것은 압살롬이 ... 이미 결정된 일이었습니다
  alternatives_korean:
  - 이것은 압살롬의 말대로 정해진 일이었습니다
  - 이것은 압살롬의 명령에 따라 정해진 일이었습니다
  lexicon: HALOT
  rationale: ‘עַל פִּי’의 ‘입/말’ 관용은 한국어 본문에서는 지나치게 직역하지 않고 ‘압살롬이’로 압축하되, 후반부 ‘결정된’으로 고정된 계획의 뉘앙스를 살렸습니다.
- source_word: עַנֹּתוֹ אֵת תָּמָר אֲחֹתוֹ
  english_pob_choice: he violated Tamar his sister
  chosen_korean: 다말 그의 누이를 욕보인
  alternatives_korean:
  - 다말 그의 누이를 학대한
  - 다말 그의 누이를 강간한
  lexicon: HALOT
  rationale: ‘ענה’의 성적 폭력/수치화 의미를 완곡하지만 분명하게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 성적 학대 동사의 번역 강도
  chosen_reading: ‘욕보인’으로 옮겨 본문이 암시하는 성적 폭력과 수치의 의미를 드러냈습니다.
  alternative_readings:
  - ‘학대한’
  - ‘강간한’
  rationale: 히브리어 동사는 문맥상 성적 침해를 가리키지만, 본문 자체의 표현 수준을 지나치게 넘어서는 직접어는 본문 근접성을 해칠 수 있어 중간 강도의 표현을 선택했습니다.
  doctrine_reference: 본문 윤리와 서사 문맥의 보존
