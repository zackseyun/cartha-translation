  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר ל֗/וֹ אַל אָחִ/י֙ אַל תְּעַנֵּ֔/נִי כִּ֛י לֹא יֵֽעָשֶׂ֥ה כֵ֖ן בְּ/יִשְׂרָאֵ֑ל אַֽל תַּעֲשֵׂ֖ה אֶת הַ/נְּבָלָ֥ה הַ/זֹּֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/012.yaml
  text: She said to him[a], “No, my brother, do not violate me, for such a thing is not done in Israel[b]. Do not do this disgraceful thing.”
  footnotes:
  - marker: a
    text: Or “do not humiliate me” or “do not rape me.” The Hebrew verb can denote violation with both sexual and shame/humiliation overtones.
    reason: lexical_alternative
  - marker: b
    text: Or “this outrageous thing” or “this vile act.” The Hebrew term refers to a morally scandalous act, not mere foolishness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그녀에게 말했습니다[a], “아니, 내 동생아, 나를 욕되게 하지 마십시오. 그런 일은 이스라엘에서 행해지지 않습니다[b]. 이 수치스러운 일을 하지 마십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나를 욕되게 하지 마십시오”, “나를 강간하지 마십시오”. 히브리어 동사는 성적 침해와 수치/굴욕의 뉘앙스를 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그런 outrageous한 일은”, “그런 비열한 짓은”. 히브리어는 단순한 어리석음이 아니라 도덕적으로 경악스러운 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר לּוֹ
  english_pob_choice: She said to him
  chosen_korean: 그가 그녀에게 말했습니다
  alternatives_korean:
  - 그리고 그녀가 그에게 말했습니다
  - 그녀가 그에게 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리되, 히브리어의 방향 관계(그에게)를 분명히 보존했습니다.
- source_word: אַל תְּעַנֵּנִי
  english_pob_choice: do not violate me
  chosen_korean: 나를 욕되게 하지 마십시오
  alternatives_korean:
  - 나를 학대하지 마십시오
  - 나를 강간하지 마십시오
  - 나를 더럽히지 마십시오
  lexicon: HALOT
  rationale: ענה의 성적 폭력 맥락을 살리면서도, POB가 지닌 ‘violate/humiliate’의 폭을 한국어에서 함께 전달할 수 있는 표현으로 옮겼습니다.
- source_word: כִּי לֹא יֵעָשֶׂה כֵן בְּיִשְׂרָאֵל
  english_pob_choice: for such a thing is not done in Israel
  chosen_korean: 그런 일은 이스라엘에서 행해지지 않습니다
  alternatives_korean:
  - 그런 일은 이스라엘에서 하지 않습니다
  - 이스라엘에서는 그런 일을 하지 않습니다
  lexicon: HALOT
  rationale: 수동형의 관례적 금지 뉘앙스를 살려, 공동체적 도덕 규범을 가리키는 말로 옮겼습니다.
- source_word: הַנְּבָלָה הַזֹּאת
  english_pob_choice: this disgraceful thing
  chosen_korean: 이 수치스러운 일
  alternatives_korean:
  - 이 끔찍한 일
  - 이 악한 일
  - 이 패륜적인 일
  lexicon: HALOT
  rationale: נְבָלָה의 도덕적 수치성과 공동체적 충격을 드러내는 표현으로, 현대 한국어에서 과하지 않으면서도 강도를 유지했습니다.
theological_decisions:
- issue: 첫 번째 אַל의 정서적 기능
  chosen_reading: ‘아니’로 시작해 즉각적 거절의 감정을 살렸습니다.
  alternative_readings:
  - ‘그만’
  - ‘제발’
  rationale: 첫 אַל은 단순 금지문이 아니라 절박한 저항의 외침이므로, 정중한 청유보다 단호한 거절의 정서를 우선했습니다.
  doctrine_reference: 본문의 담화·수사 관찰
