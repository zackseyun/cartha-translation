  text: וַ/תְּכַל֙ דָּוִ֣ד הַ/מֶּ֔לֶךְ לָ/צֵ֖את אֶל אַבְשָׁל֑וֹם כִּֽי נִחַ֥ם עַל אַמְנ֖וֹן כִּֽי מֵֽת־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/039.yaml
  text: And King David longed to go out to Absalom, for he was comforted concerning Amnon, since he was dead.
translation:
  language: ko
  text: 그러나 다윗 왕은 압살롬에게 나가고 싶어 하였습니다. 암논에 관하여 마음이 풀렸기 때문입니다. 그는 이미 죽었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּכַל ... לָצֵאת
  english_pob_choice: longed to go out
  chosen_korean: 나가고 싶어 하였습니다
  alternatives_korean:
  - 가기를 그만두었습니다
  - 나가기를 갈망하였습니다
  - 나가고자 하였습니다
  lexicon: כלה / יצא
  rationale: 문맥상 단순한 중단보다 압살롬에게 가고 싶어 하는 내적 소망을 나타내므로, POB의 'longed'를 자연스럽게 살려 '나가고 싶어 하였습니다'로 옮겼습니다.
- source_word: נִחַם עַל
  english_pob_choice: was comforted concerning
  chosen_korean: 마음이 풀렸기 때문입니다
  alternatives_korean:
  - 위로를 받았기 때문입니다
  - 그 일에 대해 뜻을 돌렸기 때문입니다
  - 슬픔이 가셨기 때문입니다
  lexicon: נחם + על
  rationale: 히브리어 נִחַם עַל은 단순 감정 위로보다 어떤 일에 대해 마음이 누그러지거나 풀린 상태를 가리킬 수 있어, 관계의 긴장을 풀린 뉘앙스로 반영했습니다.
- source_word: כִּי מֵת
  english_pob_choice: since he was dead
  chosen_korean: 그는 이미 죽었기 때문입니다
  alternatives_korean:
  - 그가 죽었기 때문입니다
  - 그가 죽은 까닭입니다
  - 그는 죽어 있었기 때문입니다
  lexicon: כי + מת
  rationale: 이유절을 분명히 하되, 암논의 죽음이 이미 확정된 사실임을 자연스럽게 드러내기 위해 '이미 죽었기 때문입니다'로 옮겼습니다.
theological_decisions:
- issue: 다윗의 내적 상태를 '위로'가 아닌 '마음이 풀림'으로 표현할지 여부
  chosen_reading: 관계의 갈등이 죽음 이후에 누그러져 압살롬에게 가고 싶은 마음이 생긴 것으로 읽었습니다.
  alternative_readings:
  - 단순히 슬픔을 위로받은 상태로 볼 수 있습니다.
  - 법적/도덕적 긴장이 해소되었다고 볼 수 있습니다.
  rationale: 히브리어 동사와 전치사구는 정서적 위로를 넘어서 감정적 긴장의 해소를 포함할 수 있으므로, 본문이 말하는 인물의 태도 변화를 과도하게 부드럽게 만들지 않도록 했습니다.
  doctrine_reference: 서사 본문 해석
