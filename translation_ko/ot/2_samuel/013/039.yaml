  naturalness: ‘압살롬에게 나가고 싶어 하였습니다’는 한국어에서 목적지와 ‘나가다’의 결합이 다소 부자연스럽습니다. ‘압살롬에게로 가기를 갈망하였습니다’가 자연스럽고 원문의 강조도 더 잘 전달합니다. 또한 원문에 없는 역접 ‘그러나’는 삭제해야 합니다. 마지막 ‘그는’은 지시 대상이 잠시 불명확하므로 ‘암논이’로 밝혀야 합니다.
