base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/037.yaml
  text: But Absalom fled and went to Talmai son of Ammihur[a], king of Geshur. And he mourned for his son all the days.
  footnotes:
  - marker: a
    text: The subject of 'he mourned' is implicit in Hebrew and is understood from context to be David.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 압살롬은 도망하여 그술 왕 암미훌의 아들 탈매에게로 가서, 자기 아들을 위해 모든 날 동안 애곡했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그가 애곡했다’의 주어를 명시하지 않지만, 문맥상 다윗을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם
  english_pob_choice: But Absalom
  chosen_korean: 그러나 압살롬은
  alternatives_korean:
  - 그리고 압살롬은
  - 이제 압살롬은
  lexicon: HALOT
  rationale: 문맥상 암논의 죽음과 이어지는 대비를 살려 וְ를 ‘그러나’로 옮겼고, 고유명사는 표준 음역을 따랐습니다.
- source_word: בָּרַח
  english_pob_choice: fled
  chosen_korean: 도망하여
  alternatives_korean:
  - 달아나서
  - 피하여
  lexicon: HALOT
  rationale: בָּרַח의 핵심 의미는 ‘도망하다/달아나다’이므로, 서술의 긴박감을 살리는 ‘도망하여’를 택했습니다.
- source_word: וַיִּתְאַבֵּל עַל בְּנוֹ
  english_pob_choice: And he mourned for his son
  chosen_korean: 자기 아들을 위해 애곡했습니다
  alternatives_korean:
  - 자기 아들을 위해 슬퍼했습니다
  - 자기 아들을 위해 곡했습니다
  lexicon: HALOT
  rationale: 히트파엘 אבל은 단순한 감정적 슬픔보다 상실을 두고 애도하는 행위를 뜻하므로 ‘애곡하다’로 옮겼습니다.
- source_word: כָּל הַיָּמִים
  english_pob_choice: all the days
  chosen_korean: 모든 날 동안
  alternatives_korean:
  - 날마다
  - 평생
  lexicon: HALOT
  rationale: 히브리어 관용구를 비교적 직역해 반복적·지속적 기간감을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 생략된 주어의 처리
  chosen_reading: 주어를 드러내지 않고 ‘자기 아들을 위해’로만 처리했습니다.
  alternative_readings:
  - ‘그는 자기 아들을 위해’
  - ‘다윗이 자기 아들을 위해’
  rationale: 히브리어는 주어를 명시하지 않지만 문맥상 다윗으로 이해되므로, 원문의 암시를 보존하면서도 해설적 보충은 본문에 넣지 않았습니다.
  doctrine_reference: 문맥 추론과 원문 생략의 보존
