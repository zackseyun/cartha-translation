  yaml_path: translation/ot/2_samuel/013/024.yaml
  text: Then Absalom came to the king and said, “Look, your servant has shearers. Please let the king and his servants go with your servant.”
translation:
  language: ko
  text: 그때 압살롬이 왕에게 와서 말했습니다. 「보십시오, 당신의 종에게는 양털 깎는 이들이 있습니다. 청하건대 왕과 왕의 종들도 당신의 종과 함께 가게 해 주십시오」.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘보십시오’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 גֹזְזִים은 여기서 양털 깎는 사람들을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: עַבְדֶּךָ / עַבְדֶּךָ־־־־
  english_pob_choice: your servant / your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 주인님의 종
  lexicon: עֶבֶד / δοῦλος
  rationale: 압살롬이 왕에게 자신을 낮추는 예법적 자기호칭이므로, 본문이 요구하는 기본값인 ‘종’을 살렸습니다. ‘노예’는 속박 상태를 강조할 때 쓰지만 여기서는 과도합니다.
- source_word: גֹזְזִים
  english_pob_choice: shearers
  chosen_korean: 양털 깎는 이들
  alternatives_korean:
  - 털 깎는 사람들
  - 양을 깎는 사람들
  lexicon: גזז
  rationale: 동사 גזז는 가축의 털을 깎는 일을 가리키므로, 한국어로는 자연스럽고 구체적인 ‘양털 깎는 이들’이 원문의 직업/행위를 잘 드러냅니다.
- source_word: יֵלֶךְ נָא
  english_pob_choice: Please let ... go
  chosen_korean: 청하건대 ... 가게 해 주십시오
  alternatives_korean:
  - 부디 ... 가게 해 주십시오
  - 제발 ... 가게 해 주십시오
  lexicon: הלך + נא
  rationale: 요청의 공손한 뉘앙스를 살리되, 합쇼체에 맞는 정중한 청유로 옮겼습니다. ‘제발’보다 궁중 예절 장면에는 ‘청하건대’가 더 적합합니다.
- source_word: וַעֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 왕의 종들도
  alternatives_korean:
  - 왕의 신하들도
  - 왕의 종들
  lexicon: עבד
  rationale: 히브리어 עֲבָדָיו는 왕을 섬기는 이들을 뜻하므로, 본문 내의 ‘종’ 표현과 일관되게 유지했습니다. ‘신하들’은 지위감을 살리지만 원문의 종속성을 다소 약화시킵니다.
theological_decisions:
- issue: 압살롬의 자기비하 호칭과 궁정 예절의 톤
  chosen_reading: 본문의 예절적 겸양을 살려 ‘당신의 종’과 ‘청하건대’로 번역했습니다.
  alternative_readings:
  - 더 중립적인 ‘저의 사람들’
  - 현대적 구어체 ‘부탁드립니다’
  rationale: 이 절은 정보 전달만이 아니라 왕 앞에서의 정치적 공손함을 보여 주므로, 원문의 사회적 긴장을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 서사 본문의 화행과 예절 표현
