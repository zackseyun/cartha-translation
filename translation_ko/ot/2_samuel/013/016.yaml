  naturalness: ‘저를 내보내는 이 큰 잘못은 당신이 제게 저지른 다른 잘못보다 더 큽니다’는 현대 표준어 합쇼체 서사 안에서 자연스럽고, 비교 구조도 명료합니다. ‘말을 듣지 않았습니다’는 אָבָה의 의지적 거절을 문맥상 무리 없이 전달합니다.
  terminology: רָעָה는 이 대목에서 ‘악’도 가능하지만, 한국어 ‘악’은 다소 추상적이거나 실체화된 악의 뉘앙스를 낼 수 있습니다. 대인적·도덕적 위법을 가리키는 ‘잘못’을 양쪽 비교항에 일관되게 써서 원문의 연결을 보존하는 편이 더 정확하고 자연스럽습니다.
