source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר ל֗/וֹ אַל אוֹדֹ֞ת הָ/רָעָ֤ה הַ/גְּדוֹלָה֙ הַ/זֹּ֔את מֵ/אַחֶ֛רֶת אֲשֶׁר עָשִׂ֥יתָ עִמִּ֖/י לְ/שַׁלְּחֵ֑/נִי וְ/לֹ֥א אָבָ֖ה לִ/שְׁמֹ֥עַֽ לָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/016.yaml
  text: But she said to him[a], “No, because this great wrong of sending me away is greater than the other that you did to me.” But he would not listen to her.
  footnotes:
  - marker: a
    text: Or, more formally, 'Do not, because this great wrong—sending me away—is greater than the other that you did to me.' The Hebrew is compressed and difficult, so English must smooth the syntax.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 그에게 말했습니다. “아니요, 저를 내보내는 이 큰 악은, 당신이 저에게 행한 다른 일보다 더 큽니다.” 그러나 그는 그녀의 말을 듣지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 압축되어 있어, 한국어에서는 비교 대상과 행위를 풀어 말해야 자연스럽습니다.
    reason: source_note
lexical_decisions:
- source_word: אַל
  english_pob_choice: 'No'
  chosen_korean: 아니요
  alternatives_korean:
  - 아닙니다
  - 하지 마십시오
  lexicon: HALOT
  rationale: 직설적 거절/항의로 쓰인 קצר한 אַל을 한국어에서는 대화체의 즉각적인 거부인 “아니요”로 옮겨, 문장의 압축성과 감정적 긴장을 살렸습니다.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  english_pob_choice: this great wrong
  chosen_korean: 이 큰 악
  alternatives_korean:
  - 이 큰 잘못
  - 이 큰 해악
  lexicon: HALOT
  rationale: רָעָה는 도덕적 악, 해악, 잘못의 폭을 가질 수 있어, 여기서는 서술의 강도를 살리는 중립적·강한 표현인 “악”을 택했습니다. “큰”은 הַגְּדוֹלָה를 직접 반영합니다.
- source_word: לְשַׁלְּחֵנִי
  english_pob_choice: of sending me away
  chosen_korean: 저를 내보내는
  alternatives_korean:
  - 저를 떠나보내는
  - 저를 보내 버리는
  lexicon: HALOT
  rationale: 부정사구가 말하는 행위 자체를 가리키므로, 명사화보다 자연스러운 동작 표현인 “내보내는”을 사용해 압축된 히브리어의 힘을 유지했습니다.
- source_word: וְלֹא אָבָה לִשְׁמֹעַ לָהּ
  english_pob_choice: But he would not listen to her
  chosen_korean: 그러나 그는 그녀의 말을 듣지 않았습니다
  alternatives_korean:
  - 그러나 그는 그녀에게 귀를 기울이지 않았습니다
  - 그러나 그는 듣기를 거부했습니다
  lexicon: HALOT
  rationale: אָבָה는 의지적 거절을 나타내므로, 한국어에서는 단순한 청각이 아니라 수용 거부를 담는 “그녀의 말을 듣지 않다”로 옮겼습니다.
theological_decisions:
- issue: Tamar의 항의가 압축된 히브리어로 제시됨
  chosen_reading: “아니요, …”로 시작하는 짧은 거절을 살려, 번역문에서도 수사적 항의와 비교 구문을 분명히 드러냈습니다.
  alternative_readings:
  - “하지 마십시오, …”
  - “아니요, …”보다 더 풀어 쓴 설명형 번역
  rationale: 본문은 직역보다 응축된 항변의 힘이 중요하므로, 문법적 보충을 최소화하면서도 한국어가 자연스럽게 읽히도록 했습니다.
  doctrine_reference: 서사 본문 번역 원칙
- issue: ‘악/잘못’의 윤리적 강도
  chosen_reading: “이 큰 악”을 택해 행위의 도덕적 무게를 분명히 했습니다.
  alternative_readings:
  - “이 큰 잘못”
  - “이 큰 해악”
  rationale: 히브리어 רָעָה의 범위가 넓지만, 문맥상 단순 실수보다 심각한 도덕적 악을 가리키므로 강도를 약화시키지 않았습니다.
  doctrine_reference: 본문 의미 보존 원칙
