  rationale: 본문은 왕에게 하는 정중한 요청이므로, 한국어에서도 청유의 예의를 분명히 드러내야 합니다.
  doctrine_reference: 서사 본문의 화행과 인물 간 관계를 보존하는 번역 원칙
