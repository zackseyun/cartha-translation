base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/006.yaml
  text: So Amnon lay down and pretended to be sick. When the king came to see him[a], Amnon said to the king, “Please let Tamar my sister come and make two cakes before my eyes, so that I may eat from her hand.”
  footnotes:
  - marker: a
    text: Or 'two cakes' or 'two pastries'; the exact kind of food denoted by the Hebrew term is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 암논은 누워 아픈 체했습니다. 왕이 그를 보러 오자, 암논이 왕에게 말했습니다. 「제발 제 누이 다말을 보내어, 내 눈앞에서 두 개의 떡을 만들게 하시고, 내가 그녀의 손에서 먹게 하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두 개의 떡’ 또는 ‘두 개의 과자’; 히브리어가 가리키는 음식의 정확한 종류는 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: lay down
  chosen_korean: 누워
  alternatives_korean:
  - 자리에 누웠습니다
  - 드러누웠습니다
  lexicon: HALOT
  rationale: 암논이 병든 척하기 위한 동작이므로, 상태를 간단히 드러내는 ‘누워’가 문맥에 맞습니다.
- source_word: וַיִּתְחָל
  english_pob_choice: pretended to be sick
  chosen_korean: 아픈 체했습니다
  alternatives_korean:
  - 병든 척했습니다
  - 스스로 병들게 했습니다
  lexicon: HALOT
  rationale: 히트파엘형은 실제 병이 아니라 가장하는 뉘앙스를 가지므로, 한국어로도 위장을 분명히 드러내는 표현이 필요합니다.
- source_word: שְׁתֵּי לְבִבוֹת
  english_pob_choice: two cakes
  chosen_korean: 두 개의 떡
  alternatives_korean:
  - 두 개의 과자
  - 두 개의 빵
  lexicon: HALOT
  rationale: 히브리어 לְבִבוֹת는 종류가 분명하지 않은 음식 명칭이므로, 본문이 보장하는 범위 안에서 가장 중립적인 ‘떡’으로 옮겼습니다.
- source_word: לְעֵינַי
  english_pob_choice: before my eyes
  chosen_korean: 내 눈앞에서
  alternatives_korean:
  - 내 눈앞에
  - 내가 보는 앞에서
  lexicon: HALOT
  rationale: 직역성을 살리면서도 한국어 문장으로 자연스럽게 들리는 표현을 택했습니다.
- source_word: מִיָּדָהּ
  english_pob_choice: from her hand
  chosen_korean: 그녀의 손에서
  alternatives_korean:
  - 그녀의 손으로부터
  - 그녀 손에서
  lexicon: HALOT
  rationale: 히브리어의 단수 ‘손’을 유지하되, 식사를 시키는 직접성을 살려 자연스럽게 표현했습니다.
theological_decisions:
- issue: 암논의 요청 속 예의 표지 נָא와 직접화법의 재현
  chosen_reading: 정중한 청유를 반영해 「제발」과 공손한 명령형을 사용했습니다.
  alternative_readings:
