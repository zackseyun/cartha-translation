  - 동무
  - 동반자
  lexicon: HALOT
  rationale: 관계적 연결을 자연스럽게 살리면서도, 이어지는 이야기에서 드러날 미묘한 조언 관계를 과도하게 해석하지 않기 위해 기본적인 ‘친구’를 택했습니다.
- source_word: וּלְאַמְנוֹן
