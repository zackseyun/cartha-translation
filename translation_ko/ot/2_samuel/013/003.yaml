  text: וּ/לְ/אַמְנ֣וֹן רֵ֗עַ וּ/שְׁמ/וֹ֙ יֽוֹנָדָ֔ב בֶּן שִׁמְעָ֖ה אֲחִ֣י דָוִ֑ד וְ/י֣וֹנָדָ֔ב אִ֥ישׁ חָכָ֖ם מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/003.yaml
  text: Now Amnon had a friend[a], whose name was Jonadab son of Shimeah, David’s brother; and Jonadab was a very shrewd man.
  footnotes:
  - marker: a
    text: Or 'a very wise man' or 'a very clever man.' The Hebrew can denote wisdom broadly; 'shrewd' is chosen here because the narrative soon presents Jonadab’s insight in a morally dubious way.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 암논에게는 친구가 있었는데, 그의 이름은 다윗의 형제 시므아의 아들 요나답이었습니다. 그리고 요나답은 매우 간교한 사람이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘간교한’은 כאן의 חָכָם를 문맥상 해석한 것입니다. 직역하면 ‘지혜로운’ 또는 ‘영리한’일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵעַ
  english_pob_choice: friend
  chosen_korean: 친구
  alternatives_korean:
  - 벗
  - 동무
  - 동반자
  lexicon: HALOT
  rationale: 관계적 연결을 자연스럽게 살리면서도, 이어지는 이야기에서 드러날 미묘한 조언 관계를 과도하게 해석하지 않기 위해 기본적인 ‘친구’를 택했습니다.
- source_word: וּלְאַמְנוֹן
  english_pob_choice: Now Amnon had
  chosen_korean: 이제 암논에게는 ... 있었습니다
  alternatives_korean:
  - 암논에게는 ... 있었습니다
  - 그리고 암논에게는 ... 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 소유·상황 도입 관용구를 한국어에서는 ‘에게는 … 있었습니다’로 자연스럽게 풀어, 서술 흐름을 매끄럽게 했습니다.
- source_word: וּשְׁמוֹ
  english_pob_choice: and his name was
  chosen_korean: 그의 이름은
  alternatives_korean:
  - 그리고 그의 이름은
  - 그 이름은
  lexicon: HALOT
  rationale: 이름 소개의 정형 표현을 한국어에서 가장 자연스러운 주어화로 옮겼습니다.
- source_word: אִישׁ חָכָם מְאֹד
  english_pob_choice: a very shrewd man
  chosen_korean: 매우 간교한 사람
  alternatives_korean:
  - 매우 지혜로운 사람
  - 매우 영리한 사람
  - 매우 총명한 사람
  lexicon: HALOT
  rationale: 문맥상 요나답의 ‘지혜’는 도덕적으로 중립적이거나 긍정적인 의미가 아니라, 곧 이어질 꾀 있는 조언을 예고하므로 ‘간교한’으로 옮겨 그 긴장을 드러냈습니다.
theological_decisions:
- issue: חָכָם의 मूल्य값이 문맥에서 긍정적 지혜인지, 교활한 재능인지
  chosen_reading: ‘매우 간교한 사람’으로 옮겨, 본문이 요나답의 지적 능력을 칭찬하기보다 그의 계략적 성격을 암시하도록 했습니다.
  alternative_readings:
  - ‘매우 지혜로운 사람’
  - ‘매우 영리한 사람’
  rationale: 이 서술은 뒤의 사건 전개에서 요나답의 충고가 도덕적으로 의심스러운 방식으로 작동하므로, 단순한 칭찬으로 읽히지 않게 하는 것이 본문의 효과를 더 정확히 반영합니다.
  doctrine_reference: 서술 문맥에 따른 어휘 가치 판정
