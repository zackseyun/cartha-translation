  alternatives_korean:
  - 암논에게는 ... 있었습니다
  - 그리고 암논에게는 ... 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 소유·상황 도입 관용구를 한국어에서는 ‘에게는 … 있었습니다’로 자연스럽게 풀어, 서술 흐름을 매끄럽게 했습니다.
- source_word: וּשְׁמוֹ
  english_pob_choice: and his name was
  chosen_korean: 그의 이름은
  alternatives_korean:
  - 그리고 그의 이름은
  - 그 이름은
  lexicon: HALOT
  rationale: 이름 소개의 정형 표현을 한국어에서 가장 자연스러운 주어화로 옮겼습니다.
- source_word: אִישׁ חָכָם מְאֹד
  english_pob_choice: a very shrewd man
  chosen_korean: 매우 간교한 사람
  alternatives_korean:
  - 매우 지혜로운 사람
  - 매우 영리한 사람
  - 매우 총명한 사람
  lexicon: HALOT
  rationale: 문맥상 요나답의 ‘지혜’는 도덕적으로 중립적이거나 긍정적인 의미가 아니라, 곧 이어질 꾀 있는 조언을 예고하므로 ‘간교한’으로 옮겨 그 긴장을 드러냈습니다.
theological_decisions:
- issue: חָכָם의 मूल्य값이 문맥에서 긍정적 지혜인지, 교활한 재능인지
  chosen_reading: ‘매우 간교한 사람’으로 옮겨, 본문이 요나답의 지적 능력을 칭찬하기보다 그의 계략적 성격을 암시하도록 했습니다.
  alternative_readings:
  - ‘매우 지혜로운 사람’
  - ‘매우 영리한 사람’
  rationale: 이 서술은 뒤의 사건 전개에서 요나답의 충고가 도덕적으로 의심스러운 방식으로 작동하므로, 단순한 칭찬으로 읽히지 않게 하는 것이 본문의 효과를 더 정확히 반영합니다.
  doctrine_reference: 서술 문맥에 따른 어휘 가치 판정
