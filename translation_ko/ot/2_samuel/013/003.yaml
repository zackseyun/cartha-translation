  yaml_path: translation/ot/2_samuel/013/003.yaml
  text: Now Amnon had a friend[a], whose name was Jonadab son of Shimeah, David’s brother; and Jonadab was a very shrewd man.
  footnotes:
  - marker: a
    text: Or 'a very wise man' or 'a very clever man.' The Hebrew can denote wisdom broadly; 'shrewd' is chosen here because the narrative soon presents Jonadab’s insight in a morally dubious way.
    reason: lexical_alternative
translation:
  language: ko
  text: 암논에게는 친구가 있었는데, 그의 이름은 다윗의 형제인 시므아의 아들 요나답이었습니다. 요나답은 매우 영리한 사람이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘매우 지혜로운 사람’ 또는 ‘매우 영리한 사람’으로도 옮길 수 있습니다. 이어지는 문맥에서는 그의 영리함이 간교하게 드러납니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵעַ
  english_pob_choice: friend
  chosen_korean: 친구
  alternatives_korean:
