base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/030.yaml
  text: While they were on the way[a], the report came to David, saying, “Absalom has struck down all the king’s sons, and not one of them is left.”
  footnotes:
  - marker: a
    text: Or “the news came to David”; the Hebrew term can also carry the sense of an unverified report or rumor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 길에 있는 동안, 다윗에게 소식이 전해져 말했습니다. “압살롬이 왕의 아들들을 모두 쳐서 죽였고, 그들 가운데 하나도 남지 않았습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소식’은 여기서 확정된 사실보다는 전달된 보고나 소문까지 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵמָּה בַדֶּרֶךְ
  english_pob_choice: While they were on the way
  chosen_korean: 그들이 길에 있는 동안
  alternatives_korean:
  - 그들이 길을 가는 동안
  - 길 위에 있는 동안
  lexicon: HALOT
  rationale: 서술 도입의 시간적 배경을 자연스럽게 살리되, ‘길에 있는 동안’으로 이동 중이라는 상황을 간결하게 드러냈습니다.
- source_word: הַשְּׁמֻעָה
  english_pob_choice: the report
  chosen_korean: 소식
  alternatives_korean:
  - 보고
  - 소문
  lexicon: HALOT
  rationale: 이 문맥에서는 사실로 확정되지 않은 전달 내용을 가리키므로 ‘소식’이 가장 자연스럽고, ‘소문’보다 덜 단정적이며 ‘보고’보다 일상적입니다.
- source_word: הִכָּה
  english_pob_choice: has struck down
  chosen_korean: 쳐서 죽였고
  alternatives_korean:
  - 쳐서 쓰러뜨렸고
  - 쳤고
  lexicon: HALOT
  rationale: 히브리어의 ‘치다’의 힘을 살리면서 이 문맥의 치명적 의미를 분명히 하기 위해 ‘쳐서 죽였고’로 옮겼습니다.
