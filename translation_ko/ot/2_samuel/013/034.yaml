source:
  edition: WLC
  text: וַ/יִּבְרַ֖ח אַבְשָׁל֑וֹם וַ/יִּשָּׂ֞א הַ/נַּ֤עַר הַ/צֹּפֶה֙ אֶת עינ/ו וַ/יַּ֗רְא וְ/הִנֵּ֨ה עַם רַ֜ב הֹלְכִ֥ים מִ/דֶּ֛רֶךְ אַחֲרָ֖י/ו מִ/צַּ֥ד הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/034.yaml
  text: But Absalom fled[a]. And the young man who was watching lifted up his eyes and saw, and behold, many people were coming by the road behind him[c][b], from the side of the mountain.
  footnotes:
  - marker: a
    text: Or 'the watchman' for 'the young man who was watching'; the Hebrew combines 'young man/attendant' with a participle meaning 'watching' or 'keeping lookout.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'lifted up his eyes,' an idiom meaning he looked up.
    reason: lexical_alternative
  - marker: c
    text: Or 'from the road behind him, from the mountainside.' The exact spatial relation in the Hebrew is somewhat compressed.
    reason: alternative_reading
translation:
  language: ko
  text: 하지만 압살롬은 도망쳤습니다[a]. 그때 지키고 서 있던 그 젊은이는 눈을 들어 보았고, 보십시오, 많은 사람이 그 뒤의 길을 따라 산쪽에서 오고 있었습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 ברח는 ‘도망하다/달아나다’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘눈을 들어 보았다’는 히브리어 관용구로, 직역하면 ‘눈을 들어’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 공간 표현이 압축되어 있어, ‘뒤의 길’과 ‘산쪽’의 관계를 약간 풀어 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרַח
  english_pob_choice: fled
  chosen_korean: 도망쳤습니다
  alternatives_korean:
  - 달아났습니다
  - 피했습니다
  lexicon: HALOT
  rationale: ברח는 ‘도망하다/달아나다’의 뜻이므로, 서술의 긴박함을 살리면서도 현대 한국어에서 자연스러운 ‘도망쳤습니다’를 택했습니다.
- source_word: הַנַּעַר הַצֹּפֶה
  english_pob_choice: the young man who was watching
  chosen_korean: 지키고 서 있던 그 젊은이
  alternatives_korean:
  - 감시하던 젊은이
  - 망보던 젊은이
  - 파수하던 젊은이
  lexicon: HALOT
  rationale: נַעַר와 צֹפֶה의 결합은 단순한 나이 표현보다 ‘지켜보는 배치된 인물’의 뉘앙스가 있어, 직책을 단정하지 않으면서 기능을 살린 표현으로 옮겼습니다.
- source_word: וַיִּשָּׂא ... אֶת עֵינוֹ
  english_pob_choice: lifted up his eyes
  chosen_korean: 눈을 들어 보았고
  alternatives_korean:
  - 눈을 들어 살폈고
  - 눈을 들어
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 자연스러운 대응인 ‘눈을 들어 보다’로 옮겨, 직역의 어색함 없이 원문의 관용 표현을 보존했습니다.
- source_word: הֹלְכִים מִדֶּרֶךְ אַחֲרָיו מִצַּד הָהָר
  english_pob_choice: were coming by the road behind him ... from the side of the mountain
  chosen_korean: 그 뒤의 길을 따라 산쪽에서 오고 있었습니다
  alternatives_korean:
  - 그 뒤의 길로 산비탈에서 오고 있었습니다
  - 그 뒤의 길을 따라 산기슭에서 오고 있었습니다
  lexicon: HALOT
  rationale: 본문의 공간 관계가 압축되어 있으므로, ‘뒤의 길’과 ‘산쪽’을 함께 살려 이동 방향과 지형 정보를 모두 드러냈습니다.
