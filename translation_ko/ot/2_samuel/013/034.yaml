  - 피했습니다
  lexicon: HALOT
  rationale: ברח는 ‘도망하다/달아나다’의 뜻이므로, 서술의 긴박함을 살리면서도 현대 한국어에서 자연스러운 ‘도망쳤습니다’를 택했습니다.
- source_word: הַנַּעַר הַצֹּפֶה
  english_pob_choice: the young man who was watching
  chosen_korean: 지키고 서 있던 그 젊은이
  alternatives_korean:
  - 감시하던 젊은이
  - 망보던 젊은이
  - 파수하던 젊은이
  lexicon: HALOT
  rationale: נַעַר와 צֹפֶה의 결합은 단순한 나이 표현보다 ‘지켜보는 배치된 인물’의 뉘앙스가 있어, 직책을 단정하지 않으면서 기능을 살린 표현으로 옮겼습니다.
- source_word: וַיִּשָּׂא ... אֶת עֵינוֹ
  english_pob_choice: lifted up his eyes
  chosen_korean: 눈을 들어 보았고
  alternatives_korean:
