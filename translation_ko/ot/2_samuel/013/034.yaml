  to: 그러나 압살롬은 도망쳤습니다[a]. 지켜보고 있던 젊은이가 눈을 들어 보니[b], 보십시오, 많은 사람이 그 뒤쪽 길을 따라 산기슭 쪽에서 오고 있었습니다[c].
