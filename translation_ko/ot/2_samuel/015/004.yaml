  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם מִי יְשִׂמֵ֥/נִי שֹׁפֵ֖ט בָּ/אָ֑רֶץ וְ/עָלַ֗/י יָב֥וֹא כָּל אִ֛ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִ֥יב וּ/מִשְׁפָּ֖ט וְ/הִצְדַּקְתִּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/004.yaml
  text: Then Absalom would say[a], “If only I were appointed judge in the land! Then every man who has a dispute or a case could come to me[c][b], and I would give him justice.”
  footnotes:
  - marker: a
    text: Or, more literally, “Who will appoint me judge in the land?” The Hebrew wording is a rhetorical wish, not merely a request for information.
    reason: lexical_alternative
  - marker: b
    text: “Every man” renders a grammatically masculine singular expression used generically for any person with a legal matter.
    reason: lexical_alternative
  - marker: c
    text: Or “I would vindicate him” / “I would declare him right.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 압살롬은 이렇게 말하곤 했습니다. 「아, 누가 나를 이 땅의 재판관으로 세워 주면 좋겠습니다![a] 그러면 분쟁이나 소송 사건이 있는 모든 사람[b]이 내게 와서, 내가 그에게 공정한 판결을 내려 줄 것입니다.[c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “누가 나를 이 땅의 재판관으로 세우겠습니까?” 히브리어는 단순한 질문이 아니라 소망을 드러내는 수사적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모든 사람’은 법적 사안을 가진 누구에게나 적용되는 남성 단수 표현을 우리말로 일반화한 것입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “내가 그를 옳다고 판결해 줄 것입니다” 또는 “내가 그를 정당하다고 선언할 것입니다.”
    reason: lexical_alternative
