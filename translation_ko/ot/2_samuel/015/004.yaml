  - 내가 그에게 정당함을 선언해 줄 텐데
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 선언보다 판결·변호의 행위를 가리키므로, POB의 ‘give him justice’를 따라 판결적 의미가 드러나는 표현을 택했습니다.
theological_decisions:
- issue: 압살롬의 발화 등록과 예절 수준
  chosen_reading: 서술문은 평서형으로, 압살롬의 직접 인용은 고풍스러운 높임 없이 현대 독자에게 자연스러운 구어적 감탄형으로 처리했습니다.
  alternative_readings:
  - 모두 표준 서술체로만 처리
  - 직접 인용도 완전한 문어체 합쇼체로 통일
  rationale: 히브리어의 선동적·개인적 어조를 살리기 위해, 한국어에서는 직접 인용의 절박함을 유지하는 편이 본문 의도에 더 가깝습니다.
  doctrine_reference: narrative register
