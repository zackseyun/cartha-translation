  source_fidelity: 히브리어의 반복적 발화, 소망을 나타내는 수사적 표현, 법적 분쟁을 가진 사람이 압살롬에게 와서 유리한 판결을 받게 하겠다는 뜻을 대체로 잘 반영했습니다. 다만 ‘정의를 내려 주다’는 한국어 관용과 משפט적 문맥에 맞지 않아 판결 행위로 명료하게 고칠 필요가 있습니다.
