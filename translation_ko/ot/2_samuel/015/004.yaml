source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם מִי יְשִׂמֵ֥/נִי שֹׁפֵ֖ט בָּ/אָ֑רֶץ וְ/עָלַ֗/י יָב֥וֹא כָּל אִ֛ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִ֥יב וּ/מִשְׁפָּ֖ט וְ/הִצְדַּקְתִּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/004.yaml
  text: Then Absalom would say[a], “If only I were appointed judge in the land! Then every man who has a dispute or a case could come to me[c][b], and I would give him justice.”
  footnotes:
  - marker: a
    text: Or, more literally, “Who will appoint me judge in the land?” The Hebrew wording is a rhetorical wish, not merely a request for information.
    reason: lexical_alternative
  - marker: b
    text: “Every man” renders a grammatically masculine singular expression used generically for any person with a legal matter.
    reason: lexical_alternative
  - marker: c
    text: Or “I would vindicate him” / “I would declare him right.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 압살롬은 이렇게 말하곤 했습니다. 「아, 누가 나를 이 땅의 재판관으로 세워 주면 좋겠소! 그러면 재판이나 소송이 있는 모든 사람이 내게 와서, 내가 그에게 정의를 내려 줄 텐데!」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “누가 나를 이 땅의 재판관으로 세우겠소?” 히브리어는 단순한 질문이 아니라 소망을 드러내는 수사적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모든 사람’은 법적 사안을 가진 누구에게나 적용되는 남성 단수 표현을 우리말로 일반화한 것입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “내가 그를 옳다 할 텐데” / “내가 그를 정당하다고 선언할 텐데”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אַבְשָׁלוֹם
  english_pob_choice: Then Absalom would say
  chosen_korean: 그러자 압살롬은 이렇게 말하곤 했습니다
  alternatives_korean:
  - 그리고 압살롬이 말했습니다
  - 압살롬이 말하곤 했습니다
  lexicon: HALOT
  rationale: 반복적 발화를 나타내는 서술 흐름을 살려 ‘말하곤 했습니다’로 옮겼습니다.
- source_word: מִי יְשִׂמֵנִי שֹׁפֵט בָּאָרֶץ
  english_pob_choice: If only I were appointed judge in the land!
  chosen_korean: 아, 누가 나를 이 땅의 재판관으로 세워 주면 좋겠소!
  alternatives_korean:
  - 누가 나를 이 땅의 재판관으로 세우겠소?
  - 나를 이 땅의 재판관으로 세워 주기만 하면 좋겠소!
  lexicon: HALOT
  rationale: 직접적인 정보 질문이 아니라 절박한 소망을 드러내는 수사 의문이므로, 영어 POB의 해석을 따라 소망형 감탄으로 옮겼습니다.
- source_word: רִיב וּמִשְׁפָּט
  english_pob_choice: a dispute or a case
  chosen_korean: 재판이나 소송
  alternatives_korean:
  - 다툼이나 사건
  - 분쟁이나 소송
  - 재판할 일
  lexicon: HALOT
  rationale: 두 법정 용어의 짝을 한국어 법률 감각에 맞게 자연스럽게 살리되, 둘 다 법적 분쟁을 가리킨다는 점을 보존했습니다.
- source_word: וְהִצְדַּקְתִּיו
  english_pob_choice: I would give him justice
  chosen_korean: 내가 그에게 정의를 내려 줄 텐데
  alternatives_korean:
  - 내가 그를 옳다 해 줄 텐데
  - 내가 그를 의롭다 할 텐데
  - 내가 그에게 정당함을 선언해 줄 텐데
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 선언보다 판결·변호의 행위를 가리키므로, POB의 ‘give him justice’를 따라 판결적 의미가 드러나는 표현을 택했습니다.
theological_decisions:
- issue: 압살롬의 발화 등록과 예절 수준
  chosen_reading: 서술문은 평서형으로, 압살롬의 직접 인용은 고풍스러운 높임 없이 현대 독자에게 자연스러운 구어적 감탄형으로 처리했습니다.
  alternative_readings:
  - 모두 표준 서술체로만 처리
  - 직접 인용도 완전한 문어체 합쇼체로 통일
  rationale: 히브리어의 선동적·개인적 어조를 살리기 위해, 한국어에서는 직접 인용의 절박함을 유지하는 편이 본문 의도에 더 가깝습니다.
  doctrine_reference: narrative register
