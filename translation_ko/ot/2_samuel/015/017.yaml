  text: The king went out[a], and all the people with him on foot, and they halted at the distant house.
  footnotes:
  - marker: a
    text: 'Or possibly a place-name: ''Beth-merhak.'' The Hebrew phrase can be read as ''house of distance/remoteness,'' but many understand it descriptively as ''the last house.'''
    reason: alternative_reading
translation:
  language: ko
  text: 왕이 나가고, 그와 함께한 모든 백성도 걸어서 나아가다가, 그들은 먼 집에서 멈추었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 장소명일 수 있습니다: ‘베트-메르하크.’ 히브리어 구는 ‘거리/멀어짐의 집’으로 읽을 수 있지만, 많은 사람은 이를 설명적으로 ‘마지막 집’으로 이해합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나가고
  alternatives_korean:
  - 나섰고
  - 나왔고
  - 떠났고
  lexicon: HALOT
  rationale: 출정/이동 서술에서 가장 직접적인 대응으로, 본문 흐름을 자연스럽게 살리면서도 단순한 상태 변화보다 ‘밖으로 나감’의 동작을 분명히 합니다.
- source_word: וְכָל הָעָם בְּרַגְלָיו
  english_pob_choice: and all the people with him on foot
  chosen_korean: 그와 함께한 모든 백성도 걸어서
  alternatives_korean:
  - 그와 함께한 모든 백성도 도보로
  - 그와 함께한 모든 백성도 걸어서 따라가다가
  lexicon: HALOT
  rationale: בְּרַגְלָיו는 문자적으로 ‘그의 발들에/그와 함께’의 관용적 표현이므로, 동행과 도보 이동을 함께 드러내는 ‘걸어서’로 옮겼습니다.
- source_word: וַיַּעַמְדוּ
  english_pob_choice: they halted
  chosen_korean: 멈추었습니다
  alternatives_korean:
  - 멈춰 섰습니다
  - 그들은 섰습니다
  - 정지했습니다
  lexicon: HALOT
  rationale: 문맥상 단순히 ‘서 있다’보다 이동이 중단되는 장면이므로, 서술체로 자연스러운 ‘멈추었습니다’가 가장 적절합니다.
- source_word: בֵּית הַמֶּרְחָק
  english_pob_choice: the distant house
  chosen_korean: 먼 집
  alternatives_korean:
  - 멀리 있는 집
  - 베트-메르하크
  - 그 먼 집
  lexicon: HALOT
  rationale: 본문 자체의 가장 직접적인 의미를 살려 장소명 가능성은 각주로 처리하고, 본문에는 해석을 최소화한 ‘먼 집’을 유지했습니다.
theological_decisions:
- issue: בֵּית הַמֶּרְחָק의 이해
  chosen_reading: 본문에는 ‘먼 집’으로 옮기고, 장소명일 가능성은 각주로 남깁니다.
  alternative_readings:
  - ‘베트-메르하크’라는 고유 지명으로 처리
  - ‘마지막 집’으로 해석
  rationale: 히브리어 표현은 ‘distance/remoteness의 집’으로도 읽히며, 장소명인지 설명적 표현인지가 본문상 확정되지 않으므로, 의미를 좁히지 않는 번역과 대안 독해 병기를 택합니다.
  doctrine_reference: 본문 해석의 불확정성 보존
