  source_fidelity: 히브리어의 세 동작(왕이 나감, 그를 따르는 모든 백성이 나감, 그들이 멈춰 섬)과 בֵּית הַמֶּרְחָק의 불확정성을 대체로 잘 반영합니다. 다만 현행 문장의 ‘나아가다가’는 히브리어의 연속된 와우 서술을 종속적 진행 동작으로 바꾸며, 누가 멈추었는지도 다소 불분명하게 만듭니다.
  naturalness: ‘왕이 나가고 … 나아가다가, 그들은’은 연결이 어색하고 주어 전환이 매끄럽지 않습니다. 두 문장으로 나누어 동작의 순서와 복수 주어를 명료하게 하는 편이 자연스러운 현대 한국어 합쇼체입니다.
