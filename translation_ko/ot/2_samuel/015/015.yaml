  text: The king’s servants said to the king[a], “Whatever my lord the king chooses, here are your servants.”
  footnotes:
  - marker: a
    text: Or, more formally, 'According to all that my lord the king chooses, behold, your servants.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 신하들이 왕께 말하였습니다. 「내 주 왕께서 무엇을 선택하시든지, 여기 당신의 종들이 있습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 주 왕께서 선택하시는 바대로, 보십시오, 당신의 종들이 있습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי הַמֶּלֶךְ
  english_pob_choice: the king’s servants
  chosen_korean: 왕의 신하들
  alternatives_korean:
  - 왕의 종들
  - 왕의 하인들
  lexicon: HALOT
  rationale: 궁정 맥락에서 עבד는 단순 고용인보다 왕에게 속한 신하·시종의 의미가 자연스러워, ‘신하들’로 옮겨 충성과 신분의 뉘앙스를 살렸습니다.
- source_word: כְּכֹל אֲשֶׁר יִבְחַר
  english_pob_choice: Whatever ... chooses
  chosen_korean: 무엇을 선택하시든지
  alternatives_korean:
  - 선택하시는 대로
  - 모든 것에 따라 선택하시든지
  lexicon: HALOT
  rationale: 히브리어 관용구의 완전한 순응 의사를 한국어로 자연스럽게 드러내기 위해 ‘무엇을 선택하시든지’로 옮겼습니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: 내 주 왕께서
  alternatives_korean:
  - 내 주 왕이여
  - 주 왕이시여
  lexicon: HALOT
  rationale: 아도니의 존칭과 왕에 대한 예를 합쇼체로 반영하되, 본문 발화의 직접성을 살리기 위해 ‘내 주 왕께서’로 옮겼습니다.
- source_word: הִנֵּה עֲבָדֶיךָ
  english_pob_choice: here are your servants
  chosen_korean: 여기 당신의 종들이 있습니다
  alternatives_korean:
  - 보십시오, 당신의 종들이 있습니다
  - 여기 왕의 종들이 있습니다
  lexicon: HALOT
  rationale: 히네의 제시·대기 뉘앙스를 한국어의 ‘여기 … 있습니다’로 살렸고, עבד를 뒤에서는 반복 번역해 앞의 ‘신하들’과 어근 대응을 유지했습니다.
theological_decisions:
- issue: 왕에게 드리는 직접 화법의 존칭 수준
  chosen_reading: 직접 발화는 합쇼체를 유지하되, ‘내 주 왕께서’로 극진한 공손을 표현했습니다.
  alternative_readings:
  - 왕이시여
  - 주군이여
  rationale: 본문은 궁정 예절을 드러내는 장면이므로, 현대 한국어에서도 과도하게 고어화하지 않으면서도 위계와 충성을 분명히 보이도록 했습니다.
  doctrine_reference: 본문 맥락의 예의·위계 표현
