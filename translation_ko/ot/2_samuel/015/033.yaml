  text: David said to him[a], “If you pass on with me, you will be a burden to me.”
  footnotes:
  - marker: a
    text: Or “If you cross over with me, you will be a burden to me.” The Hebrew verb can more literally mean “cross over” or “pass over.”
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 그에게 말했습니다. “당신이 나와 함께 건너가면, 당신은 내게 짐이 될 것입니다.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신이 나와 함께 지나가면, 당신은 내게 짐이 될 것입니다.” 히브리어 동사는 ‘건너가다’ 또는 ‘지나가다’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... דָּוִד
  english_pob_choice: David said
  chosen_korean: 다윗이 말했습니다
  alternatives_korean:
  - 그리고 다윗이 말했습니다
  - 그러자 다윗이 말했습니다
  lexicon: WLC; HALOT
  rationale: 와우-연속으로 이어지는 서술을 자연스러운 한국어로 옮기되, 불필요한 접속부사를 덧붙이지 않고 사건 진행을 간결하게 살렸습니다.
- source_word: עָבַרְתָּ אִתִּי
  english_pob_choice: you pass on with me
  chosen_korean: 네가 나와 함께 지나가면
  alternatives_korean:
  - 네가 나와 함께 건너가면
  - 네가 나와 함께 넘어가면
  - 네가 나와 함께 가면
  lexicon: HALOT
  rationale: עבר의 기본 의미인 ‘지나가다/건너가다’를 살리면서, 이 문맥에서의 동반 이동을 한국어로 가장 자연스럽게 표현했습니다.
- source_word: וְהָיִתָ עָלַי לְמַשָּׂא
  english_pob_choice: you will be a burden to me
  chosen_korean: 네가 내게 짐이 될 것이다
  alternatives_korean:
  - 네가 내게 부담이 될 것이다
  - 네가 내 위에 짐이 될 것이다
  - 네가 내게 부담으로 있게 될 것이다
  lexicon: HALOT
  rationale: היה + על + מַשָּׂא의 결과적 부담을 직역보다 자연스러운 현대 한국어로 옮기되, ‘짐’으로 관계의 무게를 분명히 드러냈습니다.
