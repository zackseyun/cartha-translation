  text: David said to him[a], “If you pass on with me, you will be a burden to me.”
  footnotes:
  - marker: a
    text: Or “If you cross over with me, you will be a burden to me.” The Hebrew verb can more literally mean “cross over” or “pass over.”
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 그에게 말했습니다. 「네가 나와 함께 지나가면, 네가 내게 짐이 될 것이다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네가 나와 함께 건너가면, 네가 내게 짐이 될 것이다.” 히브리어 동사는 더 문자적으로 ‘건너가다/지나가다’를 뜻할 수 있습니다.
    reason: alternative_reading
