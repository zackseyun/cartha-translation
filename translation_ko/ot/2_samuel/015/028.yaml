translation:
  language: ko
  text: 보십시오, 저는 광야의 나루터들에서 기다리고 있으니, 여러분에게서 말씀이 와서 저에게 알릴 때까지입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「나루터들」은 본문의 ‘건너는 곳들’이라는 지리적 의미를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 복수 명령형의 주의를 끄는 어조를 현대 한국어에서 가장 자연스럽고 공손하게 살리기 위해 「보십시오」를 선택했습니다.
- source_word: מִתְמַהְמֵהַּ
  english_pob_choice: will wait
  chosen_korean: 기다리고 있으니
  alternatives_korean:
  - 머물고 있으니
  - 지체하고 있으니
  - 머뭇거리고 있으니
  lexicon: HALOT
  rationale: 문맥상 다윗이 의도적으로 자리를 지키며 결과를 기다리는 뜻이므로, 자연스럽게 기능을 전달하는 「기다리고 있으니」로 옮겼습니다.
- source_word: בְּעַבְרוֹת הַמִּדְבָּר
  english_pob_choice: at the fords of the wilderness
  chosen_korean: 광야의 나루터들에서
  alternatives_korean:
  - 광야의 건넘목에서
  - 광야의 건널목에서
  - 광야의 여울목들에서
  lexicon: HALOT
  rationale: עברות은 ‘건너는 곳/나루’의 복수형이므로, 지리적·서사적 맥락에 맞는 「나루터들」로 구체화했습니다.
- source_word: דָבָר ... לְהַגִּיד
  english_pob_choice: word ... to inform me
  chosen_korean: 말씀이 와서 저에게 알릴 때까지
  alternatives_korean:
  - 소식이 와서 저에게 전할 때까지
  - 말이 와서 저에게 보고할 때까지
  - 전갈이 와서 저에게 알릴 때까지
  lexicon: HALOT
  rationale: דָבָר는 여기서 추상적 ‘말’보다 전달되는 메시지/소식을 가리키므로, 원문의 간결함을 살리면서도 한국어에서 자연스러운 「말씀이 와서 알릴」 구조를 택했습니다.
