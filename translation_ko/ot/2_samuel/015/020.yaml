source:
  edition: WLC
  text: תְּמ֣וֹל בּוֹאֶ֗/ךָ וְ/הַ/יּ֞וֹם אנוע/ך עִמָּ֨/נוּ֙ לָ/לֶ֔כֶת וַ/אֲנִ֣י הוֹלֵ֔ךְ עַ֥ל אֲשֶׁר אֲנִ֖י הוֹלֵ֑ךְ שׁ֣וּב וְ/הָשֵׁ֧ב אֶת אַחֶ֛י/ךָ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/020.yaml
  text: You came only yesterday[a], and today should I make you wander with us, while I go wherever I can go? Return, and take your brothers back with you[c][b]. May steadfast love and faithfulness be with you.
  footnotes:
  - marker: a
    text: Or, more literally, 'while I am going where I am going.' The Hebrew expression is idiomatic and conveys the uncertainty of David's flight.
    reason: lexical_alternative
  - marker: b
    text: '''Your brothers'' likely refers to Ittai''s companions or kinsmen who came with him.'
    reason: cultural_note
  - marker: c
    text: Hebrew 'steadfast love and faithfulness,' a common expression for loyal love and reliability.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 어제만 해도 왔는데, 오늘 내가 당신을 우리와 함께 떠돌아다니게 해야 하겠습니까? 나는 내가 가야 할 곳으로 가고 있습니다. 돌아가서 당신의 형제들을 당신과 함께 데려가십시오. 신실한 사랑과 신실함이 당신과 함께하기를 바랍니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어제만 해도’는 תְּמוֹל의 ‘어제/최근’ 뉘앙스를 살려 다윗의 ‘아주 최근에 온 사람’이라는 점을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제들’은 문맥상 이ttai의 동료나 친족을 가리킬 가능성이 있습니다.
    reason: cultural_note
  - marker: c
    text: 히브리어의 관용구로, 다윗의 도피가 불확실하고 정처 없음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּמוֹל בּוֹאֶךָ
  english_pob_choice: You came only yesterday
  chosen_korean: 당신은 어제만 해도 왔는데
  alternatives_korean:
  - 당신은 어제 왔는데
  - 당신은 최근에 왔는데
  lexicon: HALOT
  rationale: תְּמוֹל은 단순한 ‘어제’보다 최근 도착의 짧은 시간을 강조하므로, ‘어제만 해도’로 처리해 다윗의 반문을 살렸습니다.
- source_word: אֲנוּעֲךָ עִמָּנוּ לָלֶכֶת
  english_pob_choice: should I make you wander with us
  chosen_korean: 내가 당신을 우리와 함께 떠돌아다니게 해야 하겠습니까
  alternatives_korean:
  - 내가 당신을 우리와 함께 움직이게 해야 하겠습니까
  - 내가 당신을 우리와 함께 방랑하게 해야 하겠습니까
  lexicon: HALOT
  rationale: נוע의 흔들리며 정처 없이 옮겨 다니는 뉘앙스를 살리기 위해 ‘떠돌아다니게 하다’를 택했습니다. 단순 이동보다 망명·불안정의 느낌을 더 잘 드러냅니다.
- source_word: וַאֲנִי הוֹלֵךְ עַל אֲשֶׁר אֲנִי הוֹלֵךְ
  english_pob_choice: while I go wherever I can go
  chosen_korean: 나는 내가 가야 할 곳으로 가고 있습니다
  alternatives_korean:
  - 나는 내가 가는 곳으로 가고 있습니다
  - 나는 갈 수 있는 곳으로 가고 있습니다
  lexicon: HALOT
  rationale: 히브리어는 관용적이고 생략이 많아 다윗의 불확실한 도피를 암시합니다. 이를 지나치게 직역하기보다 ‘가야 할 곳’으로 옮겨 현재의 피난 상황과 방향성의 불안정을 함께 살렸습니다.
- source_word: אַחֶיךָ
  english_pob_choice: your brothers
  chosen_korean: 당신의 형제들
  alternatives_korean:
  - 당신의 친족들
  - 당신의 동료들
  lexicon: HALOT
  rationale: 직역하면 ‘형제들’이며, 문맥상 동행자들을 가리킬 가능성이 크지만 히브리어의 친족 용어를 유지하는 편이 더 투명합니다.
- source_word: חֶסֶד וֶאֱמֶת
  english_pob_choice: steadfast love and faithfulness
  chosen_korean: 신실한 사랑과 신실함
  alternatives_korean:
  - 인자와 진실
  - 인애와 신실함
  - 언약적 사랑과 신실함
  lexicon: HALOT
  rationale: 이 통상적 쌍은 언약적이고 신뢰할 수 있는 선함을 가리킵니다. ‘신실한 사랑과 신실함’은 이를 현대 한국어로 자연스럽게 옮기면서도 단순한 친절보다 더 무게 있는 의미를 유지합니다.
theological_decisions:
- issue: 마지막 축복 표현의 문장화
  chosen_reading: 신실한 사랑과 신실함이 당신과 함께하기를 바랍니다
  alternative_readings:
  - 신실한 사랑과 신실함
  - 인자와 진실
  rationale: 히브리어는 동사가 생략된 축복문이므로, 한국어에서는 서원형 표현으로 보충하는 것이 담화상 자연스럽고 본문의 축복 의도를 분명히 합니다.
  doctrine_reference: Benediction / blessing formula
