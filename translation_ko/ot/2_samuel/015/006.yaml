  naturalness: ‘이 일을 이렇게 행하였고’는 같은 지시어가 겹쳐 다소 부자연스럽습니다. ‘이와 같이 하였고’가 현대 표준 한국어에서 간결하고 자연스럽습니다. ‘재판을 위해 왕에게 오는’은 원문의 법정 접근이라는 뜻을 자연스럽게 전달하면서 ‘재판을 받다’의 오해를 피합니다.
