  text: וַ/יַּ֨עַשׂ אַבְשָׁל֜וֹם כַּ/דָּבָ֤ר הַ/זֶּה֙ לְ/כָל יִשְׂרָאֵ֔ל אֲשֶׁר יָבֹ֥אוּ לַ/מִּשְׁפָּ֖ט אֶל הַ/מֶּ֑לֶךְ וַ/יְגַנֵּב֙ אַבְשָׁל֔וֹם אֶת לֵ֖ב אַנְשֵׁ֥י יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/006.yaml
  text: Absalom did this to all Israel who came to the king for judgment[a], and Absalom stole the hearts of the men of Israel.
  footnotes:
  - marker: a
    text: Or 'won over the hearts of the men of Israel.' The Hebrew literally says 'stole the heart,' preserving the image of winning loyalty by stealth or manipulation.
    reason: lexical_alternative
translation:
  language: ko
  text: 압살롬은 왕에게 재판을 받으러 오는 모든 이스라엘 사람들에게 이 일을 이렇게 행하였고, 압살롬은 이스라엘 사람들의 마음을 훔쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘마음을 훔쳤다’입니다. 이 표현은 은밀한 조작으로 충성을 얻는다는 이미지를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּדָּבָר הַזֶּה
  english_pob_choice: did this
  chosen_korean: 이 일을 이렇게 행하였고
  alternatives_korean:
  - 이렇게 하였고
  - 이 일을 하였고
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현을 살려, 단순한 ‘하였고’보다 반복된 행동 양식을 드러내는 ‘이렇게 행하였고’로 옮겼습니다.
- source_word: לְכָל יִשְׂרָאֵל
  english_pob_choice: to all Israel
  chosen_korean: 모든 이스라엘 사람들에게
  alternatives_korean:
  - 온 이스라엘에게
  - 모든 이스라엘에게
  lexicon: HALOT
  rationale: 전치사 לְ의 방향성을 살리면서 한국어에서는 사람들을 대상으로 한 행위를 분명히 하기 위해 ‘사람들에게’로 자연스럽게 풀었습니다.
- source_word: לַמִּשְׁפָּט
  english_pob_choice: for judgment
  chosen_korean: 재판을 받으러
  alternatives_korean:
  - 판결을 받으러
  - 심판을 받으러
  lexicon: HALOT
  rationale: 여기서는 일반적 ‘판단’보다 왕 앞에서의 사법 절차를 가리키므로 ‘재판’이 가장 직접적입니다.
- source_word: וַיְגַנֵּב ... אֶת לֵב
  english_pob_choice: stole the hearts
  chosen_korean: 마음을 훔쳤습니다
  alternatives_korean:
  - 마음을 사로잡았습니다
  - 마음을 빼앗았습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘훔치다’ 이미지를 보존하여 은밀한 조작과 충성의 탈취라는 뉘앙스를 살렸습니다.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  english_pob_choice: the men of Israel
  chosen_korean: 이스라엘 사람들의
  alternatives_korean:
  - 이스라엘 남자들의
  - 이스라엘의 사람들의
  lexicon: HALOT
  rationale: 영어 POB의 ‘men of Israel’은 남성형을 보존했지만, 한국어에서는 본문 흐름상 전체 백성을 가리키는 집합적 표현이 자연스러워 ‘이스라엘 사람들’로 옮겼습니다.
theological_decisions:
- issue: ‘stole the hearts’의 은유 유지
  chosen_reading: ‘마음을 훔쳤습니다’로 은유를 직역해, 압살롬의 정치적 조작성과 기만성을 드러냅니다.
  alternative_readings:
  - ‘마음을 사로잡았습니다’처럼 완화해 번역할 수 있음
  - ‘충성을 얻었습니다’처럼 해석적으로 번역할 수 있음
  rationale: 본문은 단순한 호감 형성보다 은밀한 탈취의 이미지를 사용하므로, 윤리적 긴장과 서술의 힘을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy: source-directed image preservation'
