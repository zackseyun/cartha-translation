  text: וְ/דָוִ֡ד עֹלֶה֩ בְ/מַעֲלֵ֨ה הַ/זֵּיתִ֜ים עֹלֶ֣ה וּ/בוֹכֶ֗ה וְ/רֹ֥אשׁ ל/וֹ֙ חָפ֔וּי וְ/ה֖וּא הֹלֵ֣ךְ יָחֵ֑ף וְ/כָל הָ/עָ֣ם אֲשֶׁר אִתּ֗/וֹ חָפוּ֙ אִ֣ישׁ רֹאשׁ֔/וֹ וְ/עָל֥וּ עָלֹ֖ה וּ/בָכֹֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/030.yaml
  text: And David was going up the ascent of the Mount of Olives[a], going up and weeping, with his head covered, and he was walking barefoot. And all the people who were with him each covered his head, and they went up[c][b], weeping as they went.
  footnotes:
  - marker: a
    text: 'Hebrew repeats ''going up'' for emphasis: ''going up and weeping.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'every man covered his head'; the Hebrew uses a distributive singular.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''they went up, going up and weeping,'' with repetition for emphasis and vividness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 감람산 오르막으로[a] 올라가며 울고 있었는데, 머리를 가린 채 맨발로 걷고 있었습니다. 또 그와 함께 있던 모든 백성도 각자 머리를 가리고 올라갔으며, 올라가면서 울었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘올라가며’를 반복해, 움직임과 애도의 지속을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: מַעֲלֵה הַזֵּיתִים
  english_pob_choice: the ascent of the Mount of Olives
  chosen_korean: 감람산 오르막
  alternatives_korean:
  - 감람산의 산길
  - 감람산의 오르막길
  lexicon: HALOT
  rationale: מַעֲלֵה는 위로 올라가는 길이나 비탈을 가리키므로, ‘오르막’으로 자연스럽게 옮기되 המקום표현인 הַזֵּיתִים는 감람산으로 이해했습니다.
- source_word: עֹלֶה ... עֹלֶה וּבוֹכֶה
  english_pob_choice: was going up ... going up and weeping
  chosen_korean: 올라가며 울고 있었는데
  alternatives_korean:
  - 올라가며 울고 있었고
  - 올라가며 울었습니다
  lexicon: HALOT
  rationale: 반복된 분사와 진행성은 한국어에서 진행형으로 살려, 장면의 지속성과 반복 강조를 무리 없이 전달했습니다.
- source_word: וְרֹאשׁ ל/וֹ חָפוּי
  english_pob_choice: with his head covered
  chosen_korean: 머리를 가린 채
  alternatives_korean:
  - 머리를 덮은 채
  - 머리를 가리고
  lexicon: HALOT
  rationale: 장례·애도의 자세를 나타내는 상태 표현이므로, 한국어의 관용적 상태구 ‘-ㄴ 채’로 옮겨 자연스러움과 상태성을 함께 살렸습니다.
- source_word: יָחֵף
  english_pob_choice: barefoot
  chosen_korean: 맨발로
  alternatives_korean:
  - 발벗고
  - 맨발인 채
  lexicon: HALOT
  rationale: יָחֵף의 핵심 의미인 신발 없이 걷는 모습을 간결하고 표준적인 현대어로 전달합니다.
- source_word: חָפוּ אִישׁ רֹאשׁ/וֹ
  english_pob_choice: each covered his head
  chosen_korean: 각자 머리를 가리고
  alternatives_korean:
  - 각 사람이 머리를 가리고
  - 사람마다 머리를 가리고
  lexicon: HALOT
  rationale: אִישׁ의 분배적 용법을 ‘각자’로 풀어, 집합 전체가 아니라 개인별 행위를 분명히 했습니다.
theological_decisions:
- issue: 애도와 수치의 표지인 ‘머리를 가림’과 ‘맨발’의 묘사
  chosen_reading: 두 표지를 그대로 유지해 다윗의 공개적 애통과 굴욕적 상태를 드러냈습니다.
  alternative_readings:
  - 의미를 완화해 ‘슬퍼하며’ 정도로 처리
  - 문화적 설명을 덧붙여 해설적으로 번역
  rationale: 본문은 감정만이 아니라 몸의 자세를 통해 왕의 비참함을 보여 주므로, 상징적 행위를 보존하는 것이 source-direct합니다.
  doctrine_reference: 본문 서사와 고대 근동의 애도 관습
