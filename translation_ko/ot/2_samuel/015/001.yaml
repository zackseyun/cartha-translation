base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/001.yaml
  text: After this[a], Absalom made for himself a chariot and horses[b], and fifty men running before him.
  footnotes:
  - marker: a
    text: Or 'made for himself' or 'provided himself with.' The Hebrew verb can denote making or procuring.
    reason: lexical_alternative
  - marker: b
    text: The fifty men running before him form a royal-style escort, signaling Absalom's public self-exaltation.
    reason: cultural_note
translation:
  language: ko
  text: 그 후에 압살롬은 자기에게 전차와 말들을 마련하고, 자기 앞에 달리는 사람 오십 명을 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '자기에게 ... 만들고', '자기에게 ... 갖추고'로도 옮길 수 있습니다. 히브리어 동사 עשה는 문맥에 따라 만들다, 마련하다, 갖추다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 오십 명이 앞서 달리는 모습은 압살롬이 왕실 행렬처럼 자신을 드러내는 장면을 시사합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מֵאַחֲרֵי כֵן
  english_pob_choice: After this
  chosen_korean: 그 후에
  alternatives_korean:
  - 이후에
  - 그 뒤에
  lexicon: WLC narrative formula
  rationale: 히브리어 서술 공식의 시간 연결을 자연스러운 현대 한국어로 옮기되, 장황한 직역은 피했습니다.
- source_word: וַיַּעַשׂ לוֹ
  english_pob_choice: made for himself
  chosen_korean: 자기에게 ... 마련하고
  alternatives_korean:
  - 자기에게 ... 만들고
  - 자기에게 ... 갖추고
  lexicon: HALOT
  rationale: 전차와 말은 통상 '제작'보다 '마련/갖춤'의 의미가 자연스러우며, לוֹ의 재귀적 뉘앙스도 살립니다.
- source_word: מֶרְכָּבָה וְסֻסִים
  english_pob_choice: a chariot and horses
  chosen_korean: 전차와 말들
  alternatives_korean:
  - 병거와 말들
  - 전차와 말
  lexicon: BDB/HALOT
  rationale: 한국어 성경에서 통용되는 '전차'를 사용하되, 복수형 סֻסִים의 군사적·호화로운 이미지를 살리기 위해 '말들'로 옮겼습니다.
- source_word: רָצִים לְפָנָיו
  english_pob_choice: fifty men running before him
  chosen_korean: 자기 앞에 달리는 사람 오십 명
  alternatives_korean:
  - 자기 앞에서 달리는 오십 명의 사람들
  - 자기 앞을 달리는 오십 명
  lexicon: WLC syntax
  rationale: רָצִים은 역할명사보다 동작을 드러내는 분사이므로 '달리는 사람'으로 옮겨, 왕실 행렬처럼 보이는 장면을 과잉 해석 없이 전달했습니다.
theological_decisions:
- issue: 압살롬의 행렬이 암시하는 왕권 과시
  chosen_reading: 본문이 직접 말하는 것은 전차와 말, 그리고 선행하는 오십 명의 배치이며, 본문 밖의 해석적 표현은 본문에 넣지 않았습니다.
  alternative_readings:
  - 왕처럼 행차하게 했다
  - 왕실식 호위를 갖추었다
  rationale: 히브리어는 압살롬의 자기 과시를 암시하지만, 서술 자체는 묘사에 머무르므로 암시를 유지하되 해설을 본문화하지 않았습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; meaning implied by context should not be over-explicitized in the main text.'
