  lexicon: WLC narrative formula
  rationale: 히브리어 서술 공식의 시간 연결을 자연스러운 현대 한국어로 옮기되, 장황한 직역은 피했습니다.
- source_word: וַיַּעַשׂ לוֹ
  english_pob_choice: made for himself
  chosen_korean: 자기에게 ... 마련하고
