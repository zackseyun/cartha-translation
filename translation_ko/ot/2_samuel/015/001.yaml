base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/001.yaml
  text: After this[a], Absalom made for himself a chariot and horses[b], and fifty men running before him.
  footnotes:
  - marker: a
    text: Or 'made for himself' or 'provided himself with.' The Hebrew verb can denote making or procuring.
    reason: lexical_alternative
  - marker: b
    text: The fifty men running before him form a royal-style escort, signaling Absalom's public self-exaltation.
    reason: cultural_note
translation:
  language: ko
  text: 그 후에 압살롬은 자신을 위해 전차와 말을 마련하고[a], 자신 앞에서 달리는 사람 오십 명을 두었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신을 위해 … 만들고’, ‘자신을 위해 … 갖추고’로 옮길 수 있습니다. 히브리어 동사 עשה는 문맥에 따라 만들다, 마련하다, 갖추다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 오십 명이 앞서 달리는 모습은 압살롬이 왕실 행렬처럼 자신을 드러내는 장면을 시사합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מֵאַחֲרֵי כֵן
  english_pob_choice: After this
  chosen_korean: 그 후에
  alternatives_korean:
