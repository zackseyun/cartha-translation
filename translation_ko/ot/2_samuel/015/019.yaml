- from: 그러자 왕이 깃 사람 잇대에게 말했습니다. "왜 너도 우리와 함께 가려 하느냐? 돌아가서 왕과 함께 머물러라. 너는 이방 사람이요, 또한 너의 본래 자리에서 떠난 사람이다."[a][b][c]
