base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/019.yaml
  text: Then the king said to Ittai the Gittite[a], “Why are you also going with us? Return and stay with the king[c][b], for you are a foreigner and also an exile from your own place.”
  footnotes:
  - marker: a
    text: Or 'Why will you also go with us?'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'stay with the king' may refer to remaining under the reigning royal authority in Jerusalem; the Hebrew does not explicitly name the referent.
    reason: alternative_reading
  - marker: c
    text: Or 'and also an exile to your place.' The Hebrew wording is compressed and may emphasize Ittai's displaced status and his connection to his own homeland/place.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 깃 사람 잇대에게 말했습니다. "왜 너도 우리와 함께 가려 하느냐? 돌아가서 왕과 함께 머물러라. 너는 이방 사람이요, 또한 너의 본래 자리에서 떠난 사람이다."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왜 너도 우리와 함께 가려 하느냐?’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘왕과 함께 머물러라’의 ‘왕’은 지시 대상이 본문에 명시되지 않습니다.
    reason: alternative_reading
  - marker: c
    text: ‘너의 본래 자리에서 떠난 사람’은 압축된 히브리어를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: WLC narrative waw-consecutive; HALOT
  rationale: 서사 진행을 자연스럽게 이어 주면서도, 원문의 사건 순서를 분명히 드러내기 위해 ‘그러자’를 선택했습니다.
- source_word: אִתַּי הַגִּתִּי
  english_pob_choice: Ittai the Gittite
  chosen_korean: 깃 사람 잇대
  alternatives_korean:
  - 깃 사람 이타이
  - 잇대 깃 사람
  lexicon: HALOT
  rationale: 고유명사는 현대 표기법에 따라 옮기고, gentilic은 ‘깃 사람’으로 처리해 가드(Gath) 출신임을 드러냈습니다.
- source_word: שׁוּב וְשֵׁב
  english_pob_choice: Return and stay
  chosen_korean: 돌아가서 ... 머물러라
  alternatives_korean:
  - 돌아가서 ... 있으라
  - 돌아가서 ... 거하라
  lexicon: HALOT
  rationale: שׁוּב와 ישׁב의 결합을 명령형으로 자연스럽게 풀되, 단순한 이동이 아니라 ‘머물러 있다’는 지속 상태를 살렸습니다.
- source_word: כִּי נָכְרִי אַתָּה וְגַם גֹּלֶה אַתָּה לִמְקוֹמֶךָ
  english_pob_choice: for you are a foreigner and also an exile from your own place
  chosen_korean: 너는 이방 사람이요, 또한 너의 본래 자리에서 떠난 사람이다
  alternatives_korean:
  - 너는 외국인이요, 또한 네 고장에서 떠난 사람이다
  - 너는 이방인이며, 또한 네 자리에서 유배된 사람이다
  lexicon: HALOT
  rationale: נָכְרִי와 גֹּלֶה를 각각 ‘이방 사람’과 ‘떠난 사람’으로 옮겨, 신분적 타자성과 거주지 상실을 과장 없이 드러냈습니다.
theological_decisions:
- issue: ‘with the king’의 지시 대상이 본문에서 명시되지 않음
  chosen_reading: 본문의 모호성을 유지해 ‘왕과 함께’로 옮겼습니다.
  alternative_readings:
  - 압살롬과 함께
  - 예루살렘의 왕과 함께
  - 나와 함께
  rationale: 히브리어는 직함만 반복하고 지시 대상을 이름으로 밝히지 않으므로, 해석을 본문에 선반영하지 않고 열린 상태를 보존했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
