review_pass:
  verdict: revise
  source_fidelity: ‘깃 사람’은 גַּתִּי(가드 사람, Gittite)를 잘못 옮긴 것으로 보이며, ‘떠난 사람’은 גּוֹלֶה의 유배·추방·이주 상태를 충분히 반영하지 못합니다. 또한 원문의 לִמְקוֹמֶךָ는 직역상 ‘네 자리/고향으로’라는 압축된 표현이므로, 본문에서는 자연스러운 의미를 제시하되 각주에서 그 표현의 난점을 밝혀야 합니다.
  naturalness: 현재 본문은 서술문은 합쇼체이나 직접화법이 ‘하느냐/머물러라/사람이다’ 해라체여서 지정된 현대 공식 존대체와 일치하지 않습니다. ‘가드 사람’, ‘타국인’, ‘고향을 떠나온 유배자’ 및 합쇼체 직접화법으로 다듬는 것이 자연스럽습니다.
  terminology: 고유지명 Gath는 한국어 성경 관례와 음역에 따라 ‘가드’로 옮기는 것이 적절합니다. נָכְרִי는 여기서 종교적 범주를 강조하는 ‘이방인’보다 ‘타국인’이 문맥상 중립적이며, גּוֹלֶה는 ‘유배자’로 옮겨 강제된 이산·추방의 상태를 보존합니다. ‘왕’의 지시 대상은 본문에서 확정하지 않습니다.
  issues:
  - severity: high
    issue: גַּתִּי를 ‘깃 사람’으로 번역함
    rationale: גַּתִּי는 블레셋 도시 가드(Gath) 출신을 뜻하는 gentilic입니다. ‘깃’은 지명 가드의 적절한 한국어 음역이 아니므로 ‘가드 사람’으로 고쳐야 합니다.
  - severity: medium
    issue: 직접화법의 문체가 합쇼체가 아님
    rationale: 번역 목표가 현대 공식 존대체(합쇼체)인데 ‘가려 하느냐’, ‘머물러라’, ‘사람이다’는 해라체입니다. ‘가려고 하십니까’, ‘머무르십시오’, ‘사람입니다’로 통일해야 합니다.
  - severity: medium
    issue: גּוֹלֶה를 ‘떠난 사람’으로 약화함
    rationale: ‘떠난 사람’은 자발적 이동도 포함할 수 있어 유배·추방·이산의 의미를 약화합니다. ‘유배자’가 원문의 상태를 더 정확히 반영합니다.
