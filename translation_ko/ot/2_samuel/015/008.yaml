  lexicon: HALOT
  rationale: 히브리어의 동족 목적어 반복은 강조를 이루므로, 한국어에서는 자연스럽게 ‘서원을 하나 하여’로 처리해 반복의 힘을 살렸습니다.
- source_word: בְּשִׁבְתִּי בִגְשׁוּר בַּאֲרָם
