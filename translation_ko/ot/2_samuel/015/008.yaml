  rationale: 서원의 결과를 예배 행위로만 좁히면 히브리어의 포괄적 의미가 줄어들기 때문에, 본문의 폭을 유지하는 쪽을 택했습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: עבד with God'
