  - 아람의 그술에 거주할 때
  lexicon: HALOT
  rationale: 시간 부사절의 지속적 의미를 살리되, 고어투를 피하고 현대 문장으로 자연스럽게 옮겼습니다.
- source_word: אִם ישיב יְשִׁיבֵנִי
  english_pob_choice: if Yahweh indeed brings me back
  chosen_korean: 야훼께서 나를 예루살렘으로 반드시 다시 데려오시면
  alternatives_korean:
  - 야훼께서 나를 예루살렘으로 다시 데려오시면
  - 야훼께서 나를 예루살렘으로 되돌려 주시면
  lexicon: HALOT
