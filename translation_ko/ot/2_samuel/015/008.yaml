  lexicon: HALOT
  rationale: 왕에게 대한 공손한 자기지칭으로서의 관용 표현이므로, 예배적 문맥을 과도하게 만들지 않으면서도 합쇼체와 맞는 ‘당신의 종’으로 옮겼습니다.
