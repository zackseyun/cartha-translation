id: 2SA.15.25
reference: 2 Samuel 15:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/צָד֔וֹק הָשֵׁ֛ב אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים הָ/עִ֑יר אִם אֶמְצָ֥א חֵן֙ בְּ/עֵינֵ֣י יְהוָ֔ה וֶ/הֱשִׁבַ֕/נִי וְ/הִרְאַ֥/נִי אֹת֖/וֹ וְ/אֶת נָוֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/025.yaml
  text: Then the king said to Zadok[a], “Return the ark of God to the city. If I find favor in the eyes of Yahweh, he will bring me back and let me see it and its dwelling place.”
  footnotes:
  - marker: a
    text: Or 'and show me it and his habitation'; the Hebrew could be understood with a more God-centered referent, though the immediate antecedent is 'the ark of God.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 왕이 사독에게 말했습니다. 「하나님의 궤를 성으로 돌려보내십시오. 내가 야훼의 눈에 든다면, 그분께서 나를 다시 데려오시고 그 궤와 그 거처를 보게 하실 것입니다.[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 궤와 그 거처’는 가장 가까운 선행사인 ‘하나님의 궤’를 가리키는 것으로 이해할 수 있습니다. 그러나 하나님 자신과 그분의 거처를 더 직접적으로 가리킨다는 이해도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָשֵׁב
  english_pob_choice: Return
  chosen_korean: 돌려보내십시오
  alternatives_korean:
  - 돌려보내라
  - 돌려보내십시오
  lexicon: HALOT
  rationale: 사독에게 주는 명령이므로 현대 표준어의 공손한 명령형을 사용해, 궤를 예루살렘 성읍으로 되돌리라는 뜻을 분명히 살렸습니다.
- source_word: אֲרוֹן הָאֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 궤
  alternatives_korean:
  - 하나님 궤
  - 야훼의 궤
  lexicon: HALOT
  rationale: 히브리어가 분명히 אֱלֹהִים을 쓰므로, 익숙한 ‘야훼의 궤’로 바꾸지 않고 직역에 가깝게 ‘하나님의 궤’로 옮겼습니다.
- source_word: אִם אֶמְצָא חֵן בְּעֵינֵי יְהוָה
  english_pob_choice: If I find favor in the eyes of Yahweh
  chosen_korean: 내가 야훼의 눈에 은총을 입는다면
  alternatives_korean:
  - 내가 야훼 앞에서 은총을 얻는다면
  - 내가 야훼의 눈에 호의를 얻는다면
  lexicon: HALOT
  rationale: ‘눈에 은총을 입다’는 히브리어 관용구를 한국어에서도 비교적 투명하게 살렸고, POB의 ‘favor’를 ‘은총’으로 옮겨 관계적 호의를 드러냈습니다.
- source_word: וְהִרְאַ֥נִי אֹת֖וֹ וְאֶת נָוֵהוּ
  english_pob_choice: and let me see it and its dwelling place
  chosen_korean: 내가 그것과 그 거처를 보게 하실 것입니다
  alternatives_korean:
  - 내가 그것과 그 거처를 보게 하실 것입니다
  - 내가 그것과 그의 거처를 보게 하실 것입니다
  lexicon: HALOT
  rationale: 대명사 ‘그것’을 궤에 맞춰 유지해 원문상의 직접 지시를 살렸고, נָוֵהוּ는 신전으로 과도하게 특정하지 않고 ‘거처’로 옮겼습니다.
theological_decisions:
- issue: ‘it and its dwelling place’의 지시 대상
  chosen_reading: 본문의 직접 지시 대상은 ‘하나님의 궤’이며, 동시에 궤가 상징하는 야훼의 임재를 배제하지 않습니다.
  alternative_readings:
  - 더 신중하게는 하나님 자신과 그의 거처를 가리킨다고 볼 수도 있습니다.
  rationale: 가장 가까운 선행사는 ‘하나님의 궤’이므로 본문 표면 의미를 우선 따르되, 궤가 하나님의 임재를 나타낸다는 신학적 긴장은 해소하지 않고 남겨 두었습니다.
  doctrine_reference: 본문의 지시 대상과 신학적 함의를 구분해 보존합니다.
