  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲ/ל֤וֹא עִמְּ/ךָ֙ שָׁ֔ם צָד֥וֹק וְ/אֶבְיָתָ֖ר הַ/כֹּהֲנִ֑ים וְ/הָיָ֗ה כָּל הַ/דָּבָר֙ אֲשֶׁ֤ר תִּשְׁמַע֙ מִ/בֵּ֣ית הַ/מֶּ֔לֶךְ תַּגִּ֕יד לְ/צָד֥וֹק וּ/לְ/אֶבְיָתָ֖ר הַ/כֹּהֲנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/035.yaml
  text: Are not Zadok and Abiathar the priests there with you? And whatever matter you hear from the king’s house, you shall report to Zadok and Abiathar the priests.
translation:
  language: ko
  text: 「사독과 아비아달 제사장들이 거기 당신과 함께 있지 않습니까? 왕궁에서 당신이 들은 일마다 사독과 아비아달 제사장들에게 전하십시오.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדוֹק וְאֶבְיָתָר הַכֹּהֲנִים
  english_pob_choice: Zadok and Abiathar the priests
  chosen_korean: 사독과 아비아달 제사장들
  alternatives_korean:
  - 사독과 아비아달의 제사장들
  - 사독과 아비아달인 제사장들
  lexicon: 고유명사 + כֹּהֲנִים
  rationale: 히브리어의 두 인물명 뒤에 정관사와 복수 명사구가 붙어 있어, 한국어에서는 자연스럽게 ‘제사장들’로 묶어 주었습니다.
- source_word: כָּל הַדָּבָר
  english_pob_choice: whatever matter
  chosen_korean: 들은 일마다
  alternatives_korean:
  - 어떤 일마다
  - 들으시는 모든 일마다
  lexicon: דָּבָר
  rationale: POB의 ‘whatever matter’를 반영하되, 왕궁에서 들은 구체적 사안이라는 문맥을 살려 ‘일’로 옮겼습니다.
- source_word: מִבֵּית הַמֶּלֶךְ
  english_pob_choice: from the king’s house
  chosen_korean: 왕궁에서
  alternatives_korean:
  - 왕의 집에서
  - 왕궁으로부터
  lexicon: בַּיִת + מֶלֶךְ
  rationale: ‘왕의 집’의 직역도 가능하지만, 한국어에서는 왕의 거처와 궁정 전체를 자연스럽게 가리키는 ‘왕궁’이 문맥상 가장 분명합니다.
- source_word: תַּגִּיד
  english_pob_choice: you shall report
  chosen_korean: 전하십시오
  alternatives_korean:
  - 알리십시오
  - 보고하십시오
  lexicon: נגד
  rationale: 히브리어의 ‘말하다/알리다/보고하다’ 계열을 살려, 상황상 하위 전달을 나타내는 공손 명령형 ‘전하십시오’로 옮겼습니다.
