reference: 2 Samuel 15:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/דָוִד֙ הִגִּ֣יד לֵ/אמֹ֔ר אֲחִיתֹ֥פֶל בַּ/קֹּשְׁרִ֖ים עִם אַבְשָׁל֑וֹם וַ/יֹּ֣אמֶר דָּוִ֔ד סַכֶּל נָ֛א אֶת עֲצַ֥ת אֲחִיתֹ֖פֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/031.yaml
  text: And it was told David[a], saying, “Ahithophel is among the conspirators with Absalom.” And David said, “O Yahweh, please turn Ahithophel’s counsel into foolishness.”
  footnotes:
  - marker: a
    text: Or, “frustrate Ahithophel’s counsel.” The Hebrew more literally asks that his counsel be made foolish.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗에게 전해졌는데, 「압살롬과 함께 반역자들 가운데 아히도벨이 있습니다」라는 것이었습니다. 그러자 다윗이 말했습니다. 「야훼님, 부디 아히도벨의 계략을 어리석음으로 바꾸어 주십시오」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아히도벨의 계략을 좌절시켜 주십시오.” 히브리어는 더 문자적으로는 그의 계략이 어리석음이 되게 해 달라고 요청합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּיד לֵאמֹר
  english_pob_choice: it was told ... saying
  chosen_korean: 전해졌는데, …라는 것이었습니다
  alternatives_korean:
  - 누가 다윗에게 말했는데
  - 다윗에게 이렇게 보고되었는데
  lexicon: HALOT
  rationale: 히필 동사의 보고 공식을 한국어에서 자연스러운 수동·전언 표현으로 살려, 암시된 전달 주체를 굳이 보충하지 않았습니다.
- source_word: בַּקֹּשְׁרִים
  english_pob_choice: among the conspirators
  chosen_korean: 반역자들 가운데
  alternatives_korean:
  - 음모자들 가운데
  - 공모자들 가운데
  lexicon: HALOT
  rationale: קשר의 이 문맥은 압살롬 편에 선 반역 행위를 가리키므로, 한국어에서는 의미를 분명히 드러내는 ‘반역자들’을 택했습니다.
- source_word: סַכֶּל
  english_pob_choice: turn ... into foolishness
  chosen_korean: 어리석음으로 바꾸어 주십시오
  alternatives_korean:
  - 어리석게 만들어 주십시오
  - 헛되게 해 주십시오
  lexicon: HALOT
  rationale: 동사의 핵심은 ‘무효화’보다 ‘어리석음으로 만들다’에 있으므로, 지혜/어리석음의 대비가 드러나도록 직역성을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼님
  alternatives_korean:
  - 야훼여
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명은 관례적 대체칭호가 아니라 고유명으로 처리해, 한국어 직접 호칭에서 ‘야훼님’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름을 직접 호칭하는 기도문의 어조
  chosen_reading: 야훼님, 부디 … 주십시오
  alternative_readings:
  - 야훼여, … 해 주십시오
  - 주님, … 해 주십시오
  rationale: 시편적 간구의 직접 호칭을 살리되, 현대 합쇼체 기도문에 맞게 공손한 청유형으로 정리했습니다.
  doctrine_reference: YHWH는 번역 대체가 아니라 고유명으로 표기한다는 프로젝트 원칙
- issue: ‘어리석음으로 바꾸어 주십시오’의 신학적 긴장
  chosen_reading: 계략을 어리석음으로 바꾸어 주십시오
  alternative_readings:
  - 계략을 좌절시켜 주십시오
  - 계략을 실패하게 해 주십시오
  rationale: 히브리어는 단순한 실패가 아니라 지혜로 보였던 계책을 ‘어리석음’으로 드러내 달라는 요청이므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 원문이 보존하는 지혜/어리석음 대비
