id: 2SA.15.26
reference: 2 Samuel 15:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם֙ כֹּ֣ה יֹאמַ֔ר לֹ֥א חָפַ֖צְתִּי בָּ֑/ךְ הִנְ/נִ֕י יַֽעֲשֶׂה לִּ֕/י כַּ/אֲשֶׁ֥ר ט֖וֹב בְּ/עֵינָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/026.yaml
  text: But if he says[a], ‘I take no pleasure in you,’ here I am[b]; let him do to me as seems good in his eyes.
  footnotes:
  - marker: a
    text: Or, 'I do not delight in you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew, 'as is good in his eyes,' an idiom meaning 'as seems good to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하지만 그가 이렇게 말하면, ‘나는 너에게 기쁨을 느끼지 않는다.’ 보십시오, 그가 내게 좋게 여겨지는 대로 나를 행하게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 너를 기뻐하지 않는다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그의 눈에 좋은 대로’라는 관용구로, ‘그에게 좋게 보이는 대로’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם כֹּה יֹאמַר
  english_pob_choice: But if he says
  chosen_korean: 하지만 그가 이렇게 말하면
  alternatives_korean:
  - 그리고 그가 이렇게 말하면
  - 만일 그가 말하면
  lexicon: HALOT
  rationale: 조건문 앞의 전환을 ‘하지만’으로 살리고, כֹּה는 직접화법을 여는 ‘이렇게’로 자연스럽게 옮겼습니다.
- source_word: לֹא חָפַצְתִּי בָּךְ
  english_pob_choice: I take no pleasure in you
  chosen_korean: 나는 너에게 기쁨을 느끼지 않는다
  alternatives_korean:
  - 나는 너를 기뻐하지 않는다
  - 나는 너에게서 즐거움을 얻지 않는다
  - 나는 너를 좋아하지 않는다
  lexicon: HALOT
  rationale: חפץ의 핵심인 ‘기뻐하다/즐기다’를 살리되, 관계적 거절을 드러내는 표현으로 옮겼습니다.
- source_word: הִנְנִי
  english_pob_choice: here I am
  chosen_korean: 보십시오
  alternatives_korean:
  - 내가 여기 있습니다
  - 저는 여기 있습니다
  - 보소서
  lexicon: HALOT
  rationale: 예언적·서사적 자기제시 공식의 응답성을 살리기 위해, 문맥상 다음 절구를 이끄는 감탄형 ‘보십시오’를 택했습니다.
- source_word: כַּאֲשֶׁר טוֹב בְּעֵינָיו
  english_pob_choice: as seems good in his eyes
  chosen_korean: 그가 내게 좋게 여겨지는 대로
  alternatives_korean:
  - 그의 눈에 좋은 대로
  - 그에게 좋게 보이는 대로
  - 그에게 옳게 여겨지는 대로
  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘눈에 좋다’를 한국어로는 ‘좋게 여겨지다’로 옮겨, 겉보기로 옳고 좋은 판단이라는 뜻을 유지했습니다.
theological_decisions:
- issue: 15장 26절의 최종 순응 표현이 누구를 가리키는가
  chosen_reading: 문맥상 야훼의 처분에 자신을 맡기는 고백으로 읽었습니다.
  alternative_readings:
  - 일반적인 인간 상전에게의 복종 표현으로 읽기
  - 참조 대상을 분명히 밝히지 않고 중립적으로 두기
  rationale: 전후 문맥에서 다윗의 말은 하나님께 자신을 맡기는 기도적 태도로 이해되는 것이 자연스럽습니다. 따라서 ‘그가’는 문맥상 야훼를 가리키는 것으로 유지했습니다.
  doctrine_reference: 문맥 우선 해석; 본문 내 대명사의 지시 대상은 앞뒤 문맥으로 결정
