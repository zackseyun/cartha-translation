source:
  edition: WLC
  text: וְ/כָל הָ/אָ֗רֶץ בּוֹכִים֙ ק֣וֹל גָּד֔וֹל וְ/כָל הָ/עָ֖ם עֹֽבְרִ֑ים וְ/הַ/מֶּ֗לֶךְ עֹבֵר֙ בְּ/נַ֣חַל קִדְר֔וֹן וְ/כָל הָ/עָם֙ עֹבְרִ֔ים עַל פְּנֵי דֶ֖רֶךְ אֶת הַ/מִּדְבָּֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/023.yaml
  text: And all the land was weeping with a loud voice[a], and all the people were crossing over. The king also crossed over the Kidron Valley[b], and all the people were crossing over on the road toward the wilderness.
  footnotes:
  - marker: a
    text: Or, more formally, 'all the people were crossing over by the way of the wilderness.'
    reason: lexical_alternative
  - marker: b
    text: 'Kidron Valley: traditionally ''the brook Kidron.'' The Hebrew נחל can refer to a wadi, ravine, or seasonal watercourse.'
    reason: cultural_note
translation:
  language: ko
  text: 온 땅은 큰 소리로 울고 있었고, 모든 백성은 건너가고 있었습니다. 왕도 기드론 골짜기를 건넜고, 모든 백성은 광야로 가는 길을 따라 건너가고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기드론 골짜기’는 전통적 번역인 ‘기드론 시내’보다 현대 독자에게 지형 의미가 분명합니다. 히브리어 נחל은 와디, 골짜기, 계절하천을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: כָל הָאָרֶץ
  english_pob_choice: all the land
  chosen_korean: 온 땅
  alternatives_korean:
  - 그 땅 전체
  - 온 나라
  lexicon: HALOT
  rationale: אָרֶץ는 여기서 지면 전체보다 그곳의 공동체와 상황을 포괄하는 ‘땅’의 관용적 표현으로 보는 것이 자연스럽습니다.
- source_word: בּוֹכִים קוֹל גָּדוֹל
  english_pob_choice: was weeping with a loud voice
  chosen_korean: 큰 소리로 울고 있었고
  alternatives_korean:
  - 크게 울고 있었고
  - 통곡하고 있었고
  lexicon: HALOT
  rationale: קוֹל גָּדוֹל의 ‘큰/높은 소리’ 이미지를 살리되, 한국어에서는 ‘큰 소리로 울다’가 가장 직접적이고 자연스럽습니다.
- source_word: בְּנַחַל קִדְרוֹן
  english_pob_choice: the Kidron Valley
  chosen_korean: 기드론 골짜기
  alternatives_korean:
  - 기드론 와디
  - 기드론 개천
  lexicon: HALOT
  rationale: נחל은 와디·골짜기·개천을 포괄할 수 있으므로, 현대 한국어에서는 지형을 분명히 드러내는 ‘골짜기’가 적절합니다.
- source_word: עַל פְּנֵי דֶרֶךְ אֶת הַמִּדְבָּר
  english_pob_choice: on the road toward the wilderness
  chosen_korean: 광야로 가는 길을 따라
  alternatives_korean:
  - 광야를 향한 길로
  - 광야 쪽 길을 따라
  lexicon: HALOT
  rationale: 압축된 히브리어를 과도하게 풀지 않으면서, ‘דרך’의 이동 경로와 ‘המדבר’의 방향성을 자연스러운 한국어로 살렸습니다.
theological_decisions:
- issue: 왕과 백성의 ‘건너감’ 반복 표현
  chosen_reading: ‘건너가다/건넜다’를 반복해 동일 동사를 유지했습니다.
  alternative_readings:
  - ‘지나가다/지나갔다’로 완화하기
  - 문맥상 한 번만 반복하기
  rationale: 히브리어 עָבַר의 반복은 도피와 이탈의 긴박한 행진을 형성하므로, 반복 구조를 유지하는 것이 서술의 리듬과 긴장을 보존합니다.
  doctrine_reference: 서사적 반복의 보존 원칙
