  lexicon: HALOT
  rationale: 히브리어 관용구의 도구성·전달성을 살리되 한국어에서 이해 가능한 표현으로 옮겨, 문자성과 의미를 함께 보존했습니다.
- source_word: כָּל דָּבָר אֲשֶׁר תִּשְׁמָעוּ
  english_pob_choice: every matter that you hear
  chosen_korean: 듣는 모든 일
  alternatives_korean:
  - 듣는 모든 말
  - 들은 모든 소식
  - 듣는 모든 사항
  lexicon: HALOT
  rationale: דָּבָר는 여기서 정보·사항의 폭넓은 범위를 가리키므로, ‘일’로 옮겨 ‘모든’과 결합된 포괄성을 살렸습니다.
