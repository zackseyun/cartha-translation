source:
  edition: WLC
  text: הִנֵּה שָׁ֤ם עִמָּ/ם֙ שְׁנֵ֣י בְנֵי/הֶ֔ם אֲחִימַ֣עַץ לְ/צָד֔וֹק וִ/יהוֹנָתָ֖ן לְ/אֶבְיָתָ֑ר וּ/שְׁלַחְתֶּ֤ם בְּ/יָדָ/ם֙ אֵלַ֔/י כָּל דָּבָ֖ר אֲשֶׁ֥ר תִּשְׁמָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/036.yaml
  text: 'Look[a], their two sons are there with them: Ahimaaz for Zadok, and Jonathan for Abiathar[b]. You shall send to me by their hand every matter that you hear.'
  footnotes:
  - marker: a
    text: Or 'through them.' The Hebrew reads literally 'by their hand,' an idiom for agency or transmission.
    reason: lexical_alternative
  - marker: b
    text: Or 'everything that you hear' or 'every report that you hear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그들의 두 아들, 곧 사독에게 속한 아히마아스와 아비아달에게 속한 요나단이 거기에 그들과 함께 있습니다. 당신들은 그들의 손을 통해 듣는 모든 일을 내게 보내십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 손을 통해’는 히브리어의 문자적 관용구를 살린 표현입니다. 뜻은 전달 수단 또는 대리 전달입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘듣는 모든 일’은 ‘듣는 모든 말’, ‘듣는 모든 소식’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오요
  - 자
  lexicon: HALOT
  rationale: 주의를 끄는 감탄 표현으로, 현대 한국어의 공손한 직접 주의 환기인 ‘보십시오’가 원문의 지시성과 문체를 잘 살립니다.
- source_word: לְצָדוֹק / לְאֶבְיָתָר
  english_pob_choice: for Zadok / for Abiathar
  chosen_korean: 사독에게 속한 / 아비아달에게 속한
  alternatives_korean:
  - 사독의 / 아비아달의
  - 사독에게 있는 / 아비아달에게 있는
  lexicon: HALOT
  rationale: 이미 앞에서 ‘그들의 두 아들’이라고 밝히므로, לְ는 소속·관계 표시로 보고 ‘...에게 속한’으로 옮겨 소유 관계를 자연스럽게 드러냈습니다.
- source_word: בְּיָדָם
  english_pob_choice: by their hand
  chosen_korean: 그들의 손을 통해
  alternatives_korean:
  - 그들의 손으로
  - 그들을 통해
  - 그들의 손에 의해
  lexicon: HALOT
  rationale: 히브리어 관용구의 도구성·전달성을 살리되 한국어에서 이해 가능한 표현으로 옮겨, 문자성과 의미를 함께 보존했습니다.
- source_word: כָּל דָּבָר אֲשֶׁר תִּשְׁמָעוּ
  english_pob_choice: every matter that you hear
  chosen_korean: 듣는 모든 일
  alternatives_korean:
  - 듣는 모든 말
  - 들은 모든 소식
  - 듣는 모든 사항
  lexicon: HALOT
  rationale: דָּבָר는 여기서 정보·사항의 폭넓은 범위를 가리키므로, ‘일’로 옮겨 ‘모든’과 결합된 포괄성을 살렸습니다.
