  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם הָ/עִ֣יר תָּשׁ֗וּב וְ/אָמַרְתָּ֤ לְ/אַבְשָׁלוֹם֙ עַבְדְּ/ךָ֨ אֲנִ֤י הַ/מֶּ֨לֶךְ֙ אֶֽהְיֶ֔ה עֶ֣בֶד אָבִ֤י/ךָ וַֽ/אֲנִי֙ מֵ/אָ֔ז וְ/עַתָּ֖ה וַ/אֲנִ֣י עַבְדֶּ֑/ךָ וְ/הֵפַרְתָּ֣ה לִ֔/י אֵ֖ת עֲצַ֥ת אֲחִיתֹֽפֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/034.yaml
  text: But if you return to the city and say to Absalom, ‘I will be your servant, O king; as I was your father’s servant in the past, so now I will be your servant,’ then you will frustrate Ahithophel’s counsel for me.
translation:
  language: ko
  text: 그러나 네가 성읍으로 돌아가 압살롬에게 이렇게 말하면, ‘왕이여, 나는 왕의 종이겠습니다. 전에는 왕의 아버지의 종이었듯이, 이제도 나는 왕의 종이겠습니다.’ 그러면 네가 나를 위하여 아히도벨의 계략을 좌절시킬 것이다.
  philosophy: formal
lexical_decisions:
- source_word: עֶבֶד
  english_pob_choice: servant
  chosen_korean: 종
  alternatives_korean:
  - 종사자
  - 시종
  - 노비
  lexicon: DBL Hebrew עֶבֶד
  rationale: 히브리어 עֶבֶד은 예속된 신분을 포함한 ‘종/종된 자’의 폭넓은 뜻을 가지므로, 문맥상 충성의 표현이면서도 주종 관계를 분명히 드러내는 ‘종’이 가장 적절합니다.
- source_word: וְהֵפַרְתָּ
  english_pob_choice: you will frustrate
  chosen_korean: 좌절시킬 것이다
  alternatives_korean:
  - 무너뜨릴 것이다
  - 꺾을 것이다
  - 헛되게 할 것이다
  lexicon: DBL Hebrew הפר
  rationale: 동사 הפר는 계획·언약 등을 ‘무효로 하다, 깨뜨리다’의 뜻이므로, 아히도벨의 ‘계략’을 무력화한다는 의미를 살려 ‘좌절시킬 것이다’로 옮겼습니다.
- source_word: עֲצַת אֲחִיתֹפֶל
  english_pob_choice: Ahithophel’s counsel
  chosen_korean: 아히도벨의 계략
  alternatives_korean:
  - 아히도벨의 조언
  - 아히도벨의 책략
  - 아히도벨의 상담
  lexicon: DBL Hebrew עֵצָה
  rationale: עֵצָה는 단순한 조언보다 실제 행동 방침·정책·계책의 뉘앙스가 강하므로, 문맥에 맞게 ‘계략’으로 옮겼습니다.
- source_word: בַּעֲבוּר
  english_pob_choice: for me
  chosen_korean: 나를 위하여
  alternatives_korean:
  - 내게
  - 내 편에서
  - 나를 위해
  lexicon: DBL Hebrew עַל/לְ + 1cs context
  rationale: 문맥상 압살롬에게 말할 때의 목적어적 방향성을 분명히 하되, 한국어에서는 ‘나를 위하여’가 앞뒤 호응을 가장 자연스럽게 드러냅니다.
theological_decisions:
- issue: ‘I will be your servant, O king’의 화법과 충성 표지
  chosen_reading: 압살롬을 직접 높이는 호칭 ‘왕이여’를 유지하고, 자기진술은 ‘왕의 종이겠습니다’로 번역해 위장된 충성을 드러냈습니다.
  alternative_readings:
  - ‘임금님’
  - ‘왕이신 분’
  rationale: 본문은 다윗의 첩보 전략 속 발화를 그대로 전하므로, 압살롬을 왕으로 호칭하는 표면적 충성 표현을 완화하지 않는 것이 문맥과 수사 효과에 더 충실합니다.
  doctrine_reference: 서사 문맥의 화용론적 보존
- issue: ‘as I was your father’s servant in the past, so now I will be your servant’의 반복 구조
  chosen_reading: ‘전에는 … 종이었듯이, 이제도 … 종이겠습니다’로 대구를 살렸습니다.
  alternative_readings:
  - ‘그전에도 … 종이었고, 이제도 … 종이겠습니다’
  - ‘예전처럼 … 지금도 … 종이겠습니다’
  rationale: 히브리어의 대구와 대조(과거/현재)를 보존해야 압살롬을 속이기 위한 발화의 설득력이 유지됩니다.
  doctrine_reference: 수사 구조 보존
