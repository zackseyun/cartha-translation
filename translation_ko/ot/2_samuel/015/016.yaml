source:
  edition: WLC
  text: וַ/יֵּצֵ֥א הַ/מֶּ֛לֶךְ וְ/כָל בֵּית֖/וֹ בְּ/רַגְלָ֑י/ו וַ/יַּעֲזֹ֣ב הַ/מֶּ֗לֶךְ אֵ֣ת עֶ֧שֶׂר נָשִׁ֛ים פִּֽלַגְשִׁ֖ים לִ/שְׁמֹ֥ר הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/016.yaml
  text: So the king went out[a], and all his household after him on foot; and the king left ten women, concubines, to keep the house.
  footnotes:
  - marker: a
    text: Or, more literally, 'and all his household at his feet.' The Hebrew idiom conveys that they went after him on foot.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 왕이 나갔고, 그의 온 집안도 걸어서[a] 그의 뒤를 따라 나갔습니다. 왕은 집을 지키도록 여인 열 명, 곧 첩들을 남겨 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 발에’라고 말합니다. 이는 그의 온 집안이 왕의 뒤를 따라 걸어갔다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나가고
  alternatives_korean:
  - 떠나고
  - 밖으로 나가고
  lexicon: HALOT
  rationale: 서술의 연속을 살리면서 יצא의 기본적 이동 의미를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: וְכָל בֵּיתוֹ בְּרַגְלָיו
  english_pob_choice: and all his household after him on foot
  chosen_korean: 그의 온 집안도 그의 뒤를 따라 걸어서
  alternatives_korean:
  - 그의 온 집안도 발로 그의 뒤를 따라
  - 그의 온 집안도 그의 발밑에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 ‘발로/걸어서’ 따라갔다는 뜻이므로, 직역의 어색함을 피하면서도 도보 이동의 의미를 분명히 드러냈습니다.
- source_word: עֶשֶׂר נָשִׁים פִּלַגְשִׁים
  english_pob_choice: ten women, concubines
  chosen_korean: 열 명의 여인들, 곧 첩들
  alternatives_korean:
  - 열 명의 첩들
  - 열 명의 여인들, 첩들
  lexicon: HALOT
  rationale: 히브리어의 병렬 어법을 따라 ‘여인들’과 ‘첩들’을 함께 살려, 단순한 신분 호칭으로 평평하게 만들지 않았습니다.
- source_word: לִשְׁמֹר הַבָּיִת
  english_pob_choice: to keep the house
  chosen_korean: 집을 맡게 했습니다
  alternatives_korean:
  - 집을 지키게 했습니다
  - 집을 보살피게 했습니다
  lexicon: HALOT
  rationale: שׁמר는 ‘지키다’의 보호 의미도 있으나, 이 문맥에서는 남겨진 이들이 왕의 집을 관리하도록 두었다는 기능이 핵심이므로 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 왕의 뒤를 따르는 방식과 남겨진 첩들의 배치가 서술적·정치적 의미를 함께 지님
  chosen_reading: 전쟁 도피나 의식적 행진을 설명하는 장면으로 과장하지 않고, 왕의 퇴장과 남겨진 사람들의 배치를 있는 그대로 서술했습니다.
  alternative_readings:
  - 도망쳤습니다처럼 위기감을 강조하는 번역
  - 궁정을 버렸다는 식의 해석적 번역
  rationale: 원문은 사건의 진행을 담담하게 묘사하며, 평가를 덧붙이지 않습니다. 그래서 서술의 절제된 어조를 유지하는 것이 가장 충실합니다.
  doctrine_reference: 내러티브 절제 원칙
- issue: ‘첩들’의 표현
  chosen_reading: 현대 한국어에서 통용되면서도 본문의 가부장적·법적 현실을 숨기지 않는 ‘첩들’을 유지했습니다.
  alternative_readings:
  - 부인을 풀어 완화하는 번역
  - 현대적 순화어로 대체하는 번역
  rationale: 원문 פִּלַגְשִׁים의 사회적 지위를 흐리지 않기 위해, 관습적 완화보다 원문 대응성을 우선했습니다.
  doctrine_reference: 사회사적 정확성
