base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/018.yaml
  text: And all his servants were passing by at his side[a], and all the Cherethites, and all the Pelethites, and all the Gittites—six hundred men who had come on foot with him from Gath—were passing on before the king.
  footnotes:
  - marker: a
    text: Or 'who had followed him from Gath'; the Hebrew literally says 'who had come with his foot from Gath,' an idiom for accompanying someone in his train or on foot.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 모든 종들이 그의 곁을 지나가고, 모든 그렛 사람들과 모든 블렛 사람들, 그리고 가드에서 그와 함께 온 육백 명의 가드 사람들이 — 그들의 발로 온 사람들이 — 왕 앞을 지나가고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 발로 가드에서 온 사람들’이라는 뜻의 관용구로, 누구와 함께 도보로 동행했는지를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들
  alternatives_korean:
  - 그의 시종들
  - 그의 부하들
  lexicon: HALOT
  rationale: עֶבֶד의 기본 의미를 살려 '종들'로 옮기되, 문맥상 왕의 수행 무리를 뜻하므로 과도한 관직화는 피했습니다.
- source_word: עֹבְרִים עַל יָדוֹ
  english_pob_choice: were passing by at his side
  chosen_korean: 그의 곁을 지나가고
  alternatives_korean:
  - 그의 옆을 지나가고
  - 그의 손 아래를 지나가고
  lexicon: HALOT
  rationale: עַל יָד의 공간적 의미를 자연스러운 한국어로 살려 '곁'으로 옮겼고, 문자적인 '손' 표현은 피했습니다.
- source_word: הַכְּרֵתִי / הַפְּלֵתִי
  english_pob_choice: the Cherethites / the Pelethites
  chosen_korean: 그렛 사람들 / 블렛 사람들
  alternatives_korean:
  - 그렛 사람들 / 펠렛 사람들
  - 케레딧 사람들 / 펠렛 사람들
  lexicon: HALOT
  rationale: 이들은 고유 집단명으로 보아 음역하되, 한국어 성경 관용에 맞춰 '사람들'을 붙여 집단성을 드러냈습니다.
- source_word: הַגִּתִּים
  english_pob_choice: the Gittites
  chosen_korean: 가드 사람들
  alternatives_korean:
  - 가드인들
  - 깃 사람들
  lexicon: HALOT
  rationale: 문맥상 '가드에서 온 사람들'이라는 지시가 분명하므로, 지명 연원을 드러내는 '가드 사람들'이 가장 분명합니다.
- source_word: בְרַגְלוֹ מִגַּת
  english_pob_choice: who had come on foot with him from Gath
  chosen_korean: 그들의 발로 온 사람들이
  alternatives_korean:
  - 가드에서 그와 함께 걸어온 사람들이
  - 가드에서 그와 함께 발로 온 사람들이
  lexicon: HALOT
  rationale: 직역하면 어색한 관용구이므로, 영어 POB의 각주 취지를 반영해 '발로 온 사람들'로 옮겨 도보 동행의 이미지를 살렸습니다.
