  text: וַ/יִּשְׁלַ֣ח אַ֠בְשָׁלוֹם אֶת אֲחִיתֹ֨פֶל הַ/גִּֽילֹנִ֜י יוֹעֵ֣ץ דָּוִ֗ד מֵֽ/עִיר/וֹ֙ מִ/גִּלֹ֔ה בְּ/זָבְח֖/וֹ אֶת הַ/זְּבָחִ֑ים וַ/יְהִ֤י הַ/קֶּ֨שֶׁר֙ אַמִּ֔ץ וְ/הָ/עָ֛ם הוֹלֵ֥ךְ וָ/רָ֖ב אֶת אַבְשָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/012.yaml
  text: And Absalom sent for Ahithophel the Gilonite[a], David’s counselor, from his city, from Giloh, while he was offering the sacrifices. And the conspiracy grew strong[c][b], and the people kept increasing with Absalom.
  footnotes:
  - marker: a
    text: Or 'sent Ahithophel'; the Hebrew verb can be rendered more literally, but in context it likely means Absalom summoned him to join the revolt.
    reason: lexical_alternative
  - marker: b
    text: Or 'the plot grew strong.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'the people were going and becoming many with Absalom,' an idiom for steadily increasing support.
    reason: lexical_alternative
translation:
  language: ko
  text: 압살롬은 길로 사람인 아히도벨, 곧 다윗의 모사[a]를 그의 성읍 길로에서 불러들였습니다. 압살롬이 제물들을 바치고 있을 때였습니다. 그 음모는 강해졌고[b], 백성은 압살롬과 함께 점점 더 불어났습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아히도벨을 불러서”; 히브리어 동사는 더 문자적으로는 “보내다”로도 옮길 수 있지만, 문맥상 압살롬이 그를 반란에 끌어들이려고 소환한 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그 모반이 강해졌고.”
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “백성이 압살롬과 함께 가며 많아지고 있었다”로, 지지자가 계속 늘어나는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent for
  chosen_korean: 불러왔습니다
  alternatives_korean:
  - 보냈습니다
  - 불렀습니다
  - 불러들였습니다
  lexicon: HALOT
  rationale: 직접 목적어가 사람이고 반란 가담 문맥이므로 단순한 ‘보내다’보다 호출·소환의 뉘앙스가 살아 있는 ‘불러오다’가 원문과 영어 POB의 취지를 더 잘 반영합니다.
- source_word: הַגִּלֹנִי
  english_pob_choice: the Gilonite
  chosen_korean: 길로 사람
  alternatives_korean:
  - 길론 사람
  - 길로 출신
  lexicon: HALOT
  rationale: 지명 길로에서 나온 지시적 형용사이므로, 한국어에서는 ‘~사람’ 구조가 자연스럽고 출신/소속을 함께 드러냅니다.
- source_word: יוֹעֵץ דָּוִד
  english_pob_choice: David’s counselor
  chosen_korean: 다윗의 모사
  alternatives_korean:
  - 다윗의 조언자
  - 다윗의 참모
  lexicon: HALOT
  rationale: 궁정 정치 조언자라는 역할을 한국어 성경 문맥에서 잘 드러내는 말은 ‘모사’입니다. 다만 현대 독자를 위해 ‘다윗의’로 소속 관계를 분명히 했습니다.
- source_word: בְּזָבְחוֹ אֶת־הַזְּבָחִים
  english_pob_choice: while he was offering the sacrifices
  chosen_korean: 그가 제물을 드리고 있을 때였습니다
  alternatives_korean:
  - 그가 제물을 바치고 있을 때였습니다
  - 제사를 드리고 있을 때였습니다
  lexicon: HALOT
  rationale: 동시 동작을 나타내는 표현을 살리되, זבח/זבחים의 제의적 의미를 한국어에서 무리 없이 전달하기 위해 ‘제물을 드리다’로 옮겼습니다.
- source_word: הַקֶּשֶׁר
  english_pob_choice: the conspiracy
  chosen_korean: 그 음모
  alternatives_korean:
  - 그 모반
  - 그 공모
  lexicon: HALOT
  rationale: 압살롬의 조직적 반역을 가리키는 말이지만, 한국어에서 ‘음모’가 비밀스러운 반역의 성격을 직접적으로 드러냅니다.
- source_word: הוֹלֵךְ וָרָב
  english_pob_choice: kept increasing
  chosen_korean: 점점 더 많아졌습니다
  alternatives_korean:
  - 계속 불어났습니다
  - 점점 증가했습니다
  - 계속 많아졌습니다
  lexicon: HALOT
  rationale: 히브리어의 진행적 반복 구조를 자연스러운 현대 한국어로 풀어, 지지 세력이 계속 늘어나는 흐름을 표현했습니다.
