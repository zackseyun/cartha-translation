source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אַבְשָׁל֔וֹם רְאֵ֥ה דְבָרֶ֖/ךָ טוֹבִ֣ים וּ/נְכֹחִ֑ים וְ/שֹׁמֵ֥עַ אֵין לְ/ךָ֖ מֵ/אֵ֥ת הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/003.yaml
  text: Then Absalom said to him[a], “Look, your claims are good and right[b], but there is no one from the king to hear you.”
  footnotes:
  - marker: a
    text: Or “your case is good and right.” The Hebrew דָּבָר can mean “word,” “matter,” or, in a legal context, “case/claim.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “there is no hearer for you from the king,” meaning no one commissioned by the king to hear the case.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 압살롬이 그에게 말했습니다. “보십시오, 당신의 사안은 좋고 바릅니다.[a] 그러나 왕의 편에서 당신의 사안을 들어 줄 사람은 없습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 주장은 좋고 바릅니다.” 히브리어 דָּבָר는 “말”이나 “일”을 뜻하며, 법정 문맥에서는 “사안” 또는 “주장”을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “왕에게서 당신을 들을 사람이 없습니다”입니다. 이는 왕이 위임하여 그 사안을 들어 줄 사람이 없다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אַבְשָׁלוֹם
  english_pob_choice: Then Absalom said to him
  chosen_korean: 그러자 압살롬이 그에게 말했습니다
  alternatives_korean:
  - 그리고 압살롬이 그에게 말했습니다
  - 그때 압살롬이 그에게 말했습니다
  lexicon: WLC; POB narrative rendering
  rationale: 와우 연속형은 서술의 진행을 나타내므로 자연스러운 한국어 서사 연결어인 ‘그러자’로 옮겼고, 대화 대상은 ‘그에게’로 분명히 했습니다.
- source_word: רְאֵה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  lexicon: HALOT
  rationale: 상대의 주의를 끄는 명령형이므로 현대적이면서도 정중한 ‘보십시오’가 문맥에 맞습니다.
- source_word: דְבָרֶךָ טוֹבִים וּנְכֹחִים
  english_pob_choice: your claims are good and right
  chosen_korean: 당신의 주장들은 좋고 바르지만
  alternatives_korean:
  - 당신의 사안은 좋고 바릅니다
  - 당신의 사건은 좋고 옳습니다
  lexicon: HALOT
  rationale: דָּבָר는 법정 맥락에서 단순한 ‘말’보다 ‘주장’이나 ‘사안’을 가리키므로, POB의 법률적 의미를 살려 ‘주장들’로 옮겼습니다. נְכֹחִים는 ‘바르다/올바르다’의 의미가 자연스럽습니다.
- source_word: וְשֹׁמֵעַ אֵין לְךָ מֵאֵת הַמֶּלֶךְ
  english_pob_choice: but there is no one from the king to hear you
  chosen_korean: 왕에게서 당신의 말을 들어줄 사람이 없습니다
  alternatives_korean:
  - 왕이 임명한 청취자가 없습니다
  - 왕에게서 들을 사람이 당신에게 없습니다
  lexicon: HALOT
  rationale: שֹׁמֵעַ는 여기서 법적 청취자, 곧 호소를 들어줄 사람을 뜻하므로 ‘당신의 말을 들어줄 사람’으로 풀었습니다. מֵאֵת הַמֶּלֶךְ는 ‘왕에게서/왕 쪽에서’라는 출처·위임의 뜻을 살렸습니다.
theological_decisions:
- issue: 왕의 재판 접근이 차단된 상황의 의미
  chosen_reading: 압살롬은 청원자의 주장을 인정하면서도, 왕에게서 그것을 լս고 처리할 공식 통로가 없다고 지적하는 말로 읽었습니다.
  alternative_readings:
  - 단순히 왕 자신이 직접 듣지 않는다는 뜻
  - 왕의 대리인이 전혀 없다는 뜻
  rationale: 문맥상 משפט(재판) 상황이므로, 단순한 청취가 아니라 왕권 아래의 공식 심리가 없다는 점을 드러내는 번역이 필요합니다.
  doctrine_reference: 본문 문맥 해석
