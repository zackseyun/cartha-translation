  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 성문으로 통하는 접근로라는 공간감을 살렸습니다.
- source_word: רִיב ... לַמִּשְׁפָּט
  english_pob_choice: had a dispute ... came to the king for judgment
  chosen_korean: 송사가 있어 ... 왕에게 나와 판결을 받으러
  alternatives_korean:
  - 분쟁이 있어 ... 왕에게 와서 재판을 받으러
  - 법적 다툼이 있어 ... 왕에게 나와 심판을 받으러
  lexicon: HALOT
  rationale: רִיב과 מִשְׁפָּט의 법정 맥락을 살려 ‘송사’와 ‘판결’을 사용했습니다. ‘판결을 받다’가 왕에게서 결정을 구하는 의미를 자연스럽게 전달합니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: Your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 종이오
  - 당신의 종입니다
  lexicon: HALOT
  rationale: 원어의 예의적 자기지칭을 살리되, 본문 전체의 현대적 문체에 맞게 ‘당신의 종’으로 옮겼습니다.
theological_decisions:
- issue: 왕에게 나와 판결을 받는 장면의 법정적 뉘앙스
  chosen_reading: 이 구절은 단순한 방문이 아니라 왕이 사법적 판결을 내리는 공식 절차를 전제하는 장면으로 읽었습니다.
  alternative_readings:
  - 왕에게 도움을 청하러 오는 정도로 완화해 읽기
  - ‘정의’를 받으러 오는 것으로 추상화하기
  rationale: 히브리어 מִשְׁפָּט과 앞뒤 문맥이 분쟁의 판정 절차를 가리키므로, 법정적 의미를 약화시키지 않는 것이 본문 의도에 부합합니다.
  doctrine_reference: 구약의 왕권과 재판 기능
- issue: 압살롬의 직접화법 속 호칭과 예의
  chosen_reading: 대화의 예의적 거리감은 유지하되, 한국어에서는 왕자에게 붙이는 과도한 궁중식 높임말은 쓰지 않았습니다.
  alternative_readings:
  - 상투적인 궁중체로 과장하기
  - 현대 구어체로 지나치게 낮추기
  rationale: 히브리어의 사회적 예의는 분명하지만, 현대 한국어 독자는 자연스럽게 읽을 수 있어야 하므로 절제된 높임으로 옮겼습니다.
  doctrine_reference: 서사 문체와 화행의 등가성
