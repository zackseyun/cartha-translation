  text: וְ/הִשְׁכִּים֙ אַבְשָׁל֔וֹם וְ/עָמַ֕ד עַל יַ֖ד דֶּ֣רֶךְ הַ/שָּׁ֑עַר וַ/יְהִ֡י כָּל הָ/אִ֣ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִיב֩ לָ/ב֨וֹא אֶל הַ/מֶּ֜לֶךְ לַ/מִּשְׁפָּ֗ט וַ/יִּקְרָ֨א אַבְשָׁל֤וֹם אֵלָי/ו֙ וַ/יֹּ֗אמֶר אֵֽי מִ/זֶּ֥ה עִיר֙ אַ֔תָּה וַ/יֹּ֕אמֶר מֵ/אַחַ֥ד שִׁבְטֵֽי יִשְׂרָאֵ֖ל עַבְדֶּֽ/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/002.yaml
  text: Absalom would rise early and stand beside the road to the gate. Whenever any man had a dispute and came to the king for judgment[a], Absalom would call to him and say, “From what city are you?” And he would say, “Your servant is from one of the tribes of Israel.”
  footnotes:
  - marker: a
    text: Or “had a legal case” for “had a dispute”; the Hebrew רִיב can denote a dispute, complaint, or legal case in a judicial setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 압살롬은 일찍 일어나 성문으로 가는 길목에 서 있곤 했습니다. 어떤 사람이든 송사가 있어 왕에게 판결을 구하러 올 때면, 압살롬이 그를 불러 말하곤 했습니다. “당신은 어느 성읍 사람입니까?” 그러면 그는 “당신의 종은 이스라엘의 여러 지파 가운데 한 지파 출신입니다”라고 대답했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘송사’는 법적 분쟁, 고소 또는 소송 사건을 포괄할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁכִּים
  english_pob_choice: would rise early
  chosen_korean: 일찍 일어나
  alternatives_korean:
  - 이른 아침에 일어나
  - 일찍 일어나곤
  lexicon: HALOT
  rationale: 반복되는 행동을 나타내는 서술이므로 단회 과거보다 습관적 의미가 드러나는 표현이 적절합니다.
- source_word: דֶּרֶךְ הַשַּׁעַר
