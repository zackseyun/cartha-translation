    rationale: הִשְׁתַּחֲוֺת는 종교적 경배를 포함할 수 있으나, 본문 문맥과 영어 POB 감사 기록은 좁은 종교적 예배가 아닌 존경의 몸짓도 될 수 있음을 밝히며 ‘pay homage’를 대안으로 듭니다. ‘경의를 표하다’가 이를 더 정확하고 자연스럽게 반영합니다.
  - severity: low
    issue: 접근과 입맞춤의 대상이 본문에서 다소 덜 명시적입니다.
    rationale: ‘가까이 와서’는 בִּקְרָב의 의미를, ‘그에게 입을 맞추었습니다’는 두 차례의 לוֹ를 더 분명하게 살립니다.
