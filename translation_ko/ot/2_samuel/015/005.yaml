id: 2SA.15.5
reference: 2 Samuel 15:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֙ בִּ/קְרָב אִ֔ישׁ לְ/הִשְׁתַּחֲוֺ֖ת ל֑/וֹ וְ/שָׁלַ֧ח אֶת יָד֛/וֹ וְ/הֶחֱזִ֥יק ל֖/וֹ וְ/נָ֥שַׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/005.yaml
  text: And whenever a man came near to bow down to him[a], he would reach out his hand, take hold of him, and kiss him.
  footnotes:
  - marker: a
    text: Or 'pay homage to him.' The Hebrew verb can denote an act of respectful obeisance, not necessarily worship in the narrow religious sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 사람이 그에게 가까이 와서 절하려 하면, 그는 손을 내밀어 그를 붙들고 그에게 입을 맞추었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 경의를 표하려’로 옮길 수 있습니다. 히브리어 동사는 좁은 의미의 종교적 예배가 아니라 존경을 나타내는 절이나 예우의 행위를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And whenever ... he would
  chosen_korean: 사람이 ... 하려 하면, 그는 ... 하였습니다
  alternatives_korean:
  - 사람이 ... 할 때마다 그는 ... 하였습니다
  - 사람이 ... 하러 오면 그는 ... 하였습니다
  lexicon: HALOT
  rationale: 반복되는 관습적 행동을 나타내므로, 단발 사건이 아니라 ‘하려 하면’의 반복 조건으로 살렸습니다.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  english_pob_choice: to bow down to him
  chosen_korean: 그에게 절하려
  alternatives_korean:
  - 그에게 경배하려
  - 그에게 엎드리려
  lexicon: HALOT
  rationale: 여기서는 종교적 예배보다 예우의 몸짓이 핵심이므로, ‘절하다’로 신체적 굽힘을 자연스럽게 전달했습니다.
- source_word: וְשָׁלַח אֶת יָדוֹ
  english_pob_choice: he would reach out his hand
  chosen_korean: 손을 내밀어
  alternatives_korean:
  - 손을 뻗어
  - 손을 내어
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 자연스러운 동작 표현인 ‘손을 내밀다’로 옮겼습니다.
- source_word: וְהֶחֱזִיק לוֹ
  english_pob_choice: take hold of him
  chosen_korean: 그를 붙들고
  alternatives_korean:
  - 그를 잡고
  - 그를 움켜잡고
  lexicon: HALOT
  rationale: 사회적 환대의 동작이므로 더 거친 ‘잡다’보다 ‘붙들다’가 문맥에 맞습니다.
theological_decisions:
- issue: לְהִשְׁתַּחֲוֺת לוֹ의 의미 범위
  chosen_reading: ‘절하다’는 예우의 몸짓으로 이해해 본문에 반영했습니다.
  alternative_readings:
  - ‘경배하다’
  - ‘엎드려 절하다’
  rationale: EN POB 각주처럼 이 동사는 좁은 종교적 예배만이 아니라 존경의 표시를 뜻할 수 있으므로, 본문은 중립적으로 두고 필요 시 각주로 보완하는 편이 원문의 긴장을 보존합니다.
  doctrine_reference: 사무엘하 15:5 문맥의 왕적 예우/접근 의례
