base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/013.yaml
  text: Then a messenger came to David[a], saying, “The hearts of the men of Israel are with Absalom.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'the heart of the men of Israel is after Absalom,' an idiom meaning their loyalty or allegiance has gone over to him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 한 전령이 다윗에게 와서 말했습니다. "이스라엘 사람들의 마음이 압살롬 편에 있습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “이스라엘 사람들의 마음이 압살롬 뒤에 있었다”라는 관용구로, 충성이나 지지가 압살롬에게 넘어갔다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּגִּיד
  english_pob_choice: a messenger
  chosen_korean: 전령
  alternatives_korean:
  - 사자
  - 알리는 자
  - 보고자
  lexicon: HALOT
  rationale: 보고를 가져오는 사람이라는 기능을 살려 현대 한국어에서 자연스러운 ‘전령’을 택했습니다.
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 왔습니다
  - 도착했습니다
  lexicon: HALOT
  rationale: 서사 진행을 부드럽게 잇는 동작으로 옮겨, 뒤의 직접화법을 자연스럽게 연결했습니다.
- source_word: הָיָה לֶב ... אַחֲרֵי
  english_pob_choice: The hearts ... are with
  chosen_korean: 마음이 ... 편에 있습니다
  alternatives_korean:
  - 마음이 ... 뒤에 있습니다
  - 충성심이 ...에게로 돌아갔습니다
  - 마음이 ...를 따릅니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로 ‘뒤에 있다’이지만, 여기서는 정치적 충성을 가리키므로 ‘편에 있습니다’가 의미를 가장 분명하게 살립니다.
- source_word: אִישׁ יִשְׂרָאֵל
  english_pob_choice: the men of Israel
  chosen_korean: 이스라엘 사람들
  alternatives_korean:
  - 이스라엘의 남자들
  - 이스라엘의 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현을 현대 한국어에서 자연스럽게 전달하되, 성별을 과도하게 드러내지 않는 중립적 표현으로 옮겼습니다.
theological_decisions:
- issue: אַחֲרֵי אַבְשָׁלוֹם의 충성/지지 의미
  chosen_reading: 압살롬에게 마음이 기울어 정치적 지지와 충성이 넘어갔다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 압살롬을 따라간다
  - 지리적으로 뒤따른다
  rationale: 본문의 문맥은 이동이 아니라 내적 지지의 전환을 보고하는 것이므로, 관용적 의미를 드러내는 번역이 더 정확합니다.
  doctrine_reference: 본문 문맥에 따른 관용구 해석
- issue: 직접화법의 현대 문체
  chosen_reading: 보고문 형식은 서사체로 유지하고, 직접화법은 현대 합쇼체로 옮겼습니다.
  alternative_readings:
  - 직역형 ‘말하여 이르되’
  - 구어체 과도한 완화
  rationale: 히브리어의 간결한 보고 구조를 보존하면서도 한국어 독자가 바로 이해할 수 있도록 서술-인용 구조를 살렸습니다.
  doctrine_reference: 문체 일관성 원칙
