source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל צָד֣וֹק הַ/כֹּהֵ֔ן הֲ/רוֹאֶ֣ה אַתָּ֔ה שֻׁ֥בָ/ה הָ/עִ֖יר בְּ/שָׁל֑וֹם וַ/אֲחִימַ֨עַץ בִּנְ/ךָ֜ וִ/יהוֹנָתָ֧ן בֶּן אֶבְיָתָ֛ר שְׁנֵ֥י בְנֵי/כֶ֖ם אִתְּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/027.yaml
  text: Then the king said to Zadok the priest[a], “Are you a seer? Return to the city in peace, and your two sons with you, Ahimaaz your son and Jonathan son of Abiathar.”
  footnotes:
  - marker: a
    text: Or possibly, “You see, do you not?” The Hebrew הראה may be taken as a reference to Zadok as a 'seer' or as a question about seeing/perceiving.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 제사장 사독에게 말했습니다. “당신은 선견자입니까?[a] 평안히 성읍으로 돌아가십시오. 아히마아스, 곧 당신의 아들과 아비아달의 아들 요나단, 이 두 사람도 당신과 함께 가십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הֲרוֹאֶה는 ‘선견자’를 가리킬 수도 있고, ‘보고 있습니까?’ 또는 ‘알고 있습니까?’라는 질문으로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲ/רוֹאֶה
  english_pob_choice: Are you a seer?
  chosen_korean: 당신은 보는 사람입니까?
  alternatives_korean:
  - 당신은 선견자입니까?
  - 당신은 보고 있습니까?
  lexicon: HALOT
  rationale: 문맥상 단순한 시각 질문보다 사독을 ‘보는 사람/분별하는 사람’으로 부르는 뉘앙스를 살리면서도, 한국어에서 과도하게 직역된 ‘선견자’보다 자연스럽게 옮겼습니다.
- source_word: שֻׁ֥בָ/ה ... בְּ/שָׁל֑וֹם
  english_pob_choice: Return to the city in peace
  chosen_korean: 평안히 성읍으로 돌아가고
  alternatives_korean:
  - 평강 가운데 성읍으로 돌아가고
  - 안전하게 성읍으로 돌아가고
  lexicon: HALOT
  rationale: שָׁלוֹם의 평화·안전 뉘앙스를 ‘평안히’로 살리고, 이동 동사를 한국어 어순에 맞게 자연스럽게 처리했습니다.
- source_word: וַ/אֲחִימַ֨עַץ בִּנְ/ךָ֜ וִ/יהוֹנָתָ֧ן בֶּן אֶבְיָתָ֛ר שְׁנֵ֥י בְנֵי/כֶ֖ם אִתְּ/כֶֽם
  english_pob_choice: with Ahimaaz your son and Jonathan son of Abiathar, your two sons with you
  chosen_korean: 당신의 두 아들, 곧 아히마아스 당신의 아들과 아비아달의 아들 요나단도 당신과 함께 가십시오.
  alternatives_korean:
  - 아히마아스 당신의 아들과 아비아달의 아들 요나단, 당신의 두 아들이 당신과 함께 가십시오.
  - 아히마아스 당신의 아들과 요나단, 아비아달의 아들, 당신의 두 아들이 당신과 함께 가십시오.
  lexicon: HALOT
  rationale: 히브리어의 마지막 총괄구를 먼저 두 아들로 제시한 뒤, 동격으로 두 이름을 풀어 주는 구조를 살려 한국어에서도 인물 식별과 총괄을 모두 보이게 했습니다.
- source_word: הַ/מֶּ֨לֶךְ֙
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 임금
  lexicon: HALOT
  rationale: 서술문에서 인칭이 분명하므로 ‘그 왕’보다 간결한 ‘왕’을 택했고, 현대 표준어 합쇼체 흐름에 맞췄습니다.
theological_decisions:
- issue: הֲ/רוֹאֶה의 의미를 ‘시력 질문’으로만 좁힐지, 사독의 역할을 암시하는 호칭으로 넓게 살릴지
  chosen_reading: ‘당신은 보는 사람입니까?’로 번역해, 단순한 물리적 시각이 아니라 분별·관찰의 역할을 암시하는 열린 표현을 유지했습니다.
  alternative_readings:
  - ‘당신은 보지 않습니까?’
  - ‘당신은 선견자입니까?’
  rationale: 영문 POB가 'Are you a seer?'로 의도적 모호성을 보존하므로, 한국어도 그 긴장을 유지하는 쪽이 본문에 더 충실합니다.
  doctrine_reference: 해석학적 겸손; 본문 의미의 다층성 보존
- issue: 사독에게 한 왕의 직접 발화에서 명령형의 공손도
  chosen_reading: 직접 명령은 합쇼체 명령형 ‘가십시오’로 옮겨, 왕의 발화와 한국어 공적 문체를 함께 반영했습니다.
  alternative_readings:
  - 가라
  - 가십시오요
  rationale: 본문의 위계와 현대 한국어 성경 문체를 함께 고려하면, 지나치게 반말로 낮추거나 부자연스러운 완곡형으로 흐르는 것을 피하는 것이 적절합니다.
  doctrine_reference: 문체·화행 재현
