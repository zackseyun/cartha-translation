base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/011.yaml
  text: Two hundred men from Jerusalem went with Absalom[a], invited, and they went innocently, not knowing anything.
  footnotes:
  - marker: a
    text: Or 'in their innocence' or 'with integrity'; the Hebrew expression suggests they went unsuspectingly, unaware of Absalom's plan.
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘에서 온 이백 명의 사람들이 압살롬과 함께 갔는데, 초대받은 사람들이었고, 그들은 순진하게 걸어가며 아무것도 알지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 순진함 속에’ 혹은 ‘성실하게’. 히브리어 표현은 압살롬의 계획을 알지 못한 채 뜻밖에 간 것으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָאתַיִם אִישׁ
  english_pob_choice: Two hundred men
  chosen_korean: 이백 명의 사람들
  alternatives_korean:
  - 이백 명의 남자들
  - 이백 명의 사람들
  lexicon: HALOT
  rationale: 히브리어의 숫자+אִישׁ는 남성 집합을 가리키지만, 한국어에서는 ‘사람들’이 가장 자연스럽고 장면의 초점을 유지합니다.
- source_word: מִירוּשָׁלִַם
  english_pob_choice: from Jerusalem
  chosen_korean: 예루살렘에서 온
  alternatives_korean:
  - 예루살렘에서 온
  - 예루살렘 출신의
  lexicon: HALOT
  rationale: 출처/기원을 나타내는 מן의 뜻을 한국어에서 자연스럽게 살려 ‘에서 온’으로 옮겼습니다.
- source_word: קְרֻאִים
  english_pob_choice: invited
  chosen_korean: 초대받은 사람들이었고
  alternatives_korean:
  - 초대된 사람들이었고
  - 초대받은 사람들이었고
  - 초청받은 사람들이었고
  lexicon: HALOT
  rationale: 수동 분사이므로 ‘초대받은’이 가장 직접적이며, 문맥상 뒤에 이어지는 서술을 받기 위해 명사절로 풀어 주었습니다.
- source_word: לְתֻמָּם וְלֹא יָדְעוּ כָּל דָּבָר
  english_pob_choice: they went innocently, not knowing anything
  chosen_korean: 순진하게 걸어가며 아무것도 알지 못했습니다
  alternatives_korean:
  - 순진하게 걸어가며 아무것도 알지 못했습니다
  - 순진하게 가며 아무것도 알지 못했습니다
  - 아무것도 모르고 갔습니다
  lexicon: HALOT
  rationale: לְתֻמָּם은 단순한 ‘무고함’보다 ‘순진함/눈치채지 못함’의 뉘앙스가 강해, 뒤 절의 ‘아무것도 알지 못했습니다’와 함께 ‘순진하게’로 번역했습니다.
theological_decisions:
- issue: 압살롬의 공모에 대한 무지의 묘사
  chosen_reading: ‘아무것도 알지 못했습니다’로 옮겨, 이들이 압살롬의 계획을 전혀 눈치채지 못한 상태임을 분명히 했습니다.
  alternative_readings:
  - ‘무슨 일도 알지 못했습니다’
  - ‘그 일의 내막을 알지 못했습니다’
  rationale: 히브리어의 כָּל דָּבָר는 단순한 일반지식 부재가 아니라 사건의 핵심을 모른다는 뜻을 포함할 수 있어, 문맥상 오해의 소지를 줄이면서도 의미를 보존했습니다.
  doctrine_reference: 문맥적 서술에 관한 번역 원칙
