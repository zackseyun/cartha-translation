  source_fidelity: ‘예루살렘에서 온’은 출신을 나타내기 쉬워 출발지를 뜻하는 מִירוּשָׁלַםִ을 충분히 반영하지 못합니다. 또한 אִישׁ의 남성 지시를 ‘사람들’로 일반화했고, ‘걸어가며’는 본문의 단순한 ‘가다’보다 불필요하게 보행 방식을 부각합니다. 수정문은 초대받은 이들이 압살롬의 계획을 알지 못한 채 동행했다는 뜻을 보존합니다.
  naturalness: 초안은 ‘함께 갔는데, 초대받은 사람들이었고, 그들은 순진하게 걸어가며’가 연결상 다소 장황하고 부자연스럽습니다. 두 문장으로 나누고 ‘초대를 받은 이들’ 및 ‘아무것도 알지 못한 채’로 처리하면 현대 표준 한국어 합쇼체에서 더 자연스럽습니다.
  terminology: ‘압살롬’, ‘예루살렘’은 적절합니다. אִישׁ는 이 구절에서 남성 수량 표현이므로 ‘남자 이백 명’으로 옮기는 것이 원문에 더 충실합니다. לְתֻמָּם은 문맥상 ‘순진하게’가 가능하나, 각주에서는 ‘성실하게/온전한 마음으로’라는 어휘 범위와 ‘의심 없이’라는 문맥적 의미를 구분해 제시합니다.
