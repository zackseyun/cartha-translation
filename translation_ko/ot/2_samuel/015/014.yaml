revisions:
- from: 그때 다윗이 예루살렘에 자기와 함께 있던 모든 종들에게 말했습니다. “일어나서 도망합시다. 압살롬 앞에서 우리에게는 피할 길이 없을 것입니다. 서둘러 떠나십시오. 그가 서둘러 우리를 따라잡아 우리에게 재앙을 내리고 성을 칼날로 치지 못하게 하려는 것입니다.”[a][b][c]
  to: 그때 다윗이 예루살렘에 자기와 함께 있던 모든 종들에게 말했습니다. “일어나서 도망합시다. 압살롬을 피해서는 우리가 피할 길이 없을 것입니다. 서둘러 떠나십시오.[a] 그가 서둘러 우리를 따라잡아 우리에게 재앙을 가져오고[b] 칼로 성을 칠까 염려됩니다.[c]”
