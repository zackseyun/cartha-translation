source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּ֠וִד לְ/כָל עֲבָדָ֨י/ו אֲשֶׁר אִתּ֤/וֹ בִ/ירוּשָׁלִַ֨ם֙ ק֣וּמוּ וְ/נִבְרָ֔חָה כִּ֛י לֹא תִֽהְיֶה לָּ֥/נוּ פְלֵיטָ֖ה מִ/פְּנֵ֣י אַבְשָׁל֑וֹם מַהֲר֣וּ לָ/לֶ֗כֶת פֶּן יְמַהֵ֤ר וְ/הִשִּׂגָ֨/נוּ֙ וְ/הִדִּ֤יחַ עָלֵ֨י/נוּ֙ אֶת הָ֣/רָעָ֔ה וְ/הִכָּ֥ה הָ/עִ֖יר לְ/פִי חָֽרֶב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/014.yaml
  text: Then David said to all his servants who were with him in Jerusalem[a], “Arise, and let us flee, for there will be no escape for us from Absalom. Hurry to depart[c][b], lest he quickly overtake us and bring disaster upon us and strike the city with the edge of the sword.”
  footnotes:
  - marker: a
    text: Or 'Hurry to leave.' The Hebrew is literally 'Hurry to go,' an urgent command to depart at once.
    reason: lexical_alternative
  - marker: b
    text: Or 'bring evil upon us.' Here 'evil' refers to calamity or disaster, not moral evil.
    reason: lexical_alternative
  - marker: c
    text: Literally 'with the mouth of the sword,' a Hebrew idiom meaning death by the sword.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗이 예루살렘에 자기와 함께 있던 모든 종들에게 말했습니다. “일어나서 도망합시다. 압살롬 앞에서 우리에게는 피할 길이 없을 것입니다. 서둘러 떠나십시오. 그가 서둘러 우리를 따라잡아 우리에게 재앙을 내리고 성을 칼날로 치지 못하게 하려는 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘가서/가도록 서둘러라’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘재앙’은 도덕적 악이 아니라 재난을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘칼의 입으로’라는 히브리어 관용구로, 칼에 죽는다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 종들
  alternatives_korean:
  - 신하들
  - 시종들
  - 종복들
  lexicon: HALOT
  rationale: 왕실 문맥이지만 עֶבֶד 계열의 기본 뜻을 살려, 지위는 드러내되 지나치게 완곡한 ‘신하들’보다 원어의 종속성을 더 직접적으로 반영했습니다.
- source_word: ק֣וּמוּ
  english_pob_choice: Arise
  chosen_korean: 일어나서
  alternatives_korean:
  - 일어나
  - 어서 일어나
  lexicon: HALOT
  rationale: 공동체적 긴급 명령을 자연스러운 현대 한국어로 옮기면서, 본문의 즉각적 행동 촉구를 살렸습니다.
- source_word: וְ/נִבְרָחָה
  english_pob_choice: let us flee
  chosen_korean: 도망합시다
  alternatives_korean:
  - 피합시다
  - 도망쳐 갑시다
  lexicon: HALOT
  rationale: 화자 자신을 포함하는 권고형이므로 ‘합시다’를 사용했고, 전투·추격 상황의 긴박함을 ‘도망하다’로 직결했습니다.
- source_word: מַהֲר֣וּ לָ/לֶ֗כֶת
  english_pob_choice: Hurry to depart
  chosen_korean: 서둘러 떠나십시오
  alternatives_korean:
  - 서둘러 가십시오
  - 빨리 떠나십시오
  lexicon: HALOT
  rationale: 히브리어의 ‘서둘러 가라’는 재촉을 한국어에서는 출발의 의미를 분명히 하는 ‘떠나십시오’로 옮겼습니다.
- source_word: וְ/הִדִּ֤יחַ עָלֵ֨י/נוּ֙ אֶת הָ֣/רָעָ֔ה
  english_pob_choice: bring disaster upon us
  chosen_korean: 우리에게 재앙을 내리고
  alternatives_korean:
  - 우리에게 악을 가져오고
  - 우리에게 재난을 가져오고
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 악이 아니라 재앙·재난의 뜻이므로, POB의 해설을 따라 ‘재앙’을 택했습니다.
- source_word: לְ/פִי חָֽרֶב
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼로
  - 칼의 날로
  - 칼끝으로
  lexicon: HALOT
  rationale: 히브리 관용구를 한국어 관용으로 자연스럽게 옮기되, ‘죽임/공격’의 폭력을 압축적으로 드러내는 ‘칼날로’를 사용했습니다.
theological_decisions:
- issue: 압살롬의 위협을 ‘재앙’으로 표현한 이유
  chosen_reading: 본문의 רָעָה는 도덕적 악이 아니라 다윗과 성읍 위에 닥칠 실제적 재난을 가리키므로 ‘재앙’으로 번역했습니다.
  alternative_readings:
  - 악
  - 재난
  rationale: POB의 주석과 문맥이 모두 calamity/disaster의 뜻임을 분명히 하므로, 신학적 도덕 판단어로 읽히지 않도록 했습니다.
  doctrine_reference: 문맥 의미론; POB lexical note on רָעָה
