review_pass:
  verdict: revise
  source_fidelity: 'The draft broadly conveys the Hebrew sequence and key terms, including the collective exhortation to flee, the threat of Absalom, calamity, and sword violence. However, its final clause, “그가 … 치지 못하게 하려는 것입니다,” reverses the force of פֶּן: it expresses prevention (“in order to keep him from doing so”) rather than David’s warning that Absalom may overtake them and do these things. The imperative is plural in Hebrew; Korean -십시오 appropriately addresses the group.'
  naturalness: “압살롬 앞에서” is overly literal and less natural in this threat context; “압살롬을 피해서” communicates the sense naturally. “재앙을 내리고” is possible but less idiomatic for a human aggressor than “재앙을 가져오고.” “성을 칼날로 치다” is awkward in modern Korean; “칼로 성을 치다” is natural and retains the idiomatic sense.
  terminology: “종들,” “도망합시다,” “재앙,” and “성” are acceptable. “칼로” is preferable in the main text, while a note can preserve the Hebrew image “칼의 입.” Footnote anchors should be placed at their corresponding expressions rather than accumulated after the quotation.
  issues:
  - severity: high
    issue: The final Korean clause changes the warning introduced by פֶּן into a purpose of prevention.
    rationale: The Hebrew means “lest/otherwise he may quickly overtake us, bring calamity upon us, and strike the city.” The draft’s “치지 못하게 하려는 것입니다” means that the action is intended to prevent him from striking, which reverses the relation and adds an unsupported purpose.
  - severity: medium
    issue: Footnote anchors are all placed at the end of the quotation.
    rationale: 'Each marker should directly follow its relevant expression: haste/departure, calamity, and sword idiom. This makes the notes unambiguous and preserves usable anchoring.'
  - severity: low
    issue: Several expressions are overly literal or less idiomatic in modern formal Korean.
    rationale: “압살롬을 피해서,” “재앙을 가져오고,” and “칼로 성을 치고” are clearer and more natural without reducing source fidelity.
