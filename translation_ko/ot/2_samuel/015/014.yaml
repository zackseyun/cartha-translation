  rationale: 히브리어의 ‘서둘러 가라’는 재촉을 한국어에서는 출발의 의미를 분명히 하는 ‘떠나십시오’로 옮겼습니다.
- source_word: וְ/הִדִּ֤יחַ עָלֵ֨י/נוּ֙ אֶת הָ֣/רָעָ֔ה
