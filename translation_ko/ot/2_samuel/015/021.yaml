  text: וַ/יַּ֧עַן אִתַּ֛י אֶת הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר חַי יְהוָ֗ה וְ/חֵי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּ֠י אִם בִּ/מְק֞וֹם אֲשֶׁ֥ר יִֽהְיֶה שָּׁ֣ם אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ אִם לְ/מָ֨וֶת֙ אִם לְ/חַיִּ֔ים כִּי שָׁ֖ם יִהְיֶ֥ה עַבְדֶּֽ/ךָ־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/021.yaml
  text: Then Ittai answered the king and said[a], “As Yahweh lives, and as my lord the king lives, surely in whatever place my lord the king may be, whether for death or for life[b], there your servant will be.”
  footnotes:
  - marker: a
    text: 'Hebrew oath formula: ''As the LORD lives, and as my lord the king lives.'''
    reason: cultural_note
  - marker: b
    text: Or 'wherever my lord the king may be.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이드두의 아들 이타이가 왕에게 대답하며 말했습니다. 「야훼께서 살아 계시며, 내 주 왕께서도 살아 계시는 것처럼, 참으로 내 주 왕께서 계시는 곳이 어디든지 — 죽음이든 생명이든 — 그곳에 당신의 종도 있겠습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 맹세 공식입니다. “야훼께서 살아 계시며, 내 주 왕께서도 살아 계시는 것처럼.”
    reason: cultural_note
  - marker: b
    text: 또는 “내 주 왕께서 어디에 계시든지”라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하며
  alternatives_korean:
  - 응답하며
  - 대답하여
  lexicon: HALOT
  rationale: 서사 속 대화 응답을 자연스럽게 드러내면서도 원문의 담화 구조를 유지합니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서 살아 계시며
  alternatives_korean:
  - 야훼께서 살아 계십니다
  - 야훼의 생명으로
  lexicon: HALOT
  rationale: 맹세 공식의 힘을 살리되, יְהוָה를 본문 정책대로 야훼로 옮겼습니다.
- source_word: וְחֵי אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: and as my lord the king lives
  chosen_korean: 내 주 왕께서도 살아 계시는 것처럼
  alternatives_korean:
  - 내 주 왕의 생명으로
  - 내 주 왕께서 살아 계시는 것과 같이
  lexicon: HALOT
  rationale: 평행 맹세식을 한국어에서 자연스러운 비교 표현으로 옮기면서, אֲדֹנִי의 존칭과 왕의 지위를 함께 반영했습니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 주의 종
  lexicon: HALOT
  rationale: 여기서는 왕 앞에서의 겸손한 자기 호칭이므로 기본값인 종을 사용했고, bonded status를 강조하는 노예는 채택하지 않았습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문의 יְהוָה는 야훼로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 프로젝트의 원어 기반 이름 표기 원칙에 따라 고유 신명은 야훼로 직접 옮겨야 맹세 공식의 원문 형식을 보존할 수 있습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
