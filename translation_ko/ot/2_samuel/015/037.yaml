translation:
  language: ko
  text: 다윗의 친구 후새가 그 도시로 들어갔고, 압살롬은 예루살렘으로 들어가고 있었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 압살롬은 예루살렘으로 들어갔습니다’로 옮길 수 있습니다. 히브리어의 접속사는 단순한 연결로 읽힐 수 있고, 동사도 단순 과거로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came into
  chosen_korean: 들어갔고
  alternatives_korean:
  - 들어왔고
  - 들어가고
  lexicon: HALOT
  rationale: 진행 중인 장면을 이어 주는 서술로, 단순한 ‘들어갔다’보다 사건 연결을 살리면서도 한국어 문장을 자연스럽게 만들 수 있습니다.
- source_word: רֵעֶה דָוִד
  english_pob_choice: David’s friend
  chosen_korean: 다윗의 벗
  alternatives_korean:
