  text: So Hushai[a], David’s friend, came into the city, as Absalom was entering Jerusalem.
  footnotes:
  - marker: a
    text: Or 'and Absalom entered Jerusalem.' The Hebrew conjunction can be read as a simple sequential 'and,' and the verb may be rendered as a simple past.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 후새, 다윗의 벗이 그 성읍으로 들어갔고, 압살롬도 예루살렘으로 들어가고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 압살롬이 예루살렘으로 들어갔습니다.’로도 옮길 수 있습니다. 히브리어의 접속사는 단순한 연결로 읽힐 수 있고, 동사도 단순 과거처럼 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came into
  chosen_korean: 들어갔고
  alternatives_korean:
  - 들어왔고
  - 들어가고
  lexicon: HALOT
  rationale: 진행 중인 장면을 이어 주는 서술로, 단순한 ‘들어갔다’보다 사건 연결을 살리면서도 한국어 문장을 자연스럽게 만들 수 있습니다.
- source_word: רֵעֶה דָוִד
  english_pob_choice: David’s friend
  chosen_korean: 다윗의 벗
  alternatives_korean:
  - 다윗의 친구
  - 다윗의 동반자
  lexicon: HALOT
  rationale: רֵעַ/רֵעֶה의 기본 의미를 직접 살려 ‘벗’으로 옮겼고, 서사 문맥에서 공식 직함처럼 굳히지 않았습니다.
- source_word: הָעִיר
  english_pob_choice: the city
  chosen_korean: 그 성읍
  alternatives_korean:
  - 그 도시
  - 예루살렘
  lexicon: HALOT
  rationale: 히브리어는 일반명사 ‘도시/성읍’을 쓰므로, 본문 어법을 따라 ‘예루살렘’으로 풀지 않고 지시어를 유지했습니다.
- source_word: יָבֹא
  english_pob_choice: was entering
  chosen_korean: 들어가고 있었습니다
  alternatives_korean:
  - 들어갔습니다
  - 들어가고 있었습니다
  lexicon: HALOT
  rationale: 앞절의 wayyiqtol 뒤에 오는 미완료형의 배경적·동시적 진행을 반영해, 단순 과거보다 ‘-고 있었습니다’로 처리했습니다.
theological_decisions:
- issue: 압살롬 동작의 시제/상 처리
  chosen_reading: 압살롬의 동작을 후새의 도착과 병행하는 진행형으로 제시했습니다.
  alternative_readings:
  - 압살롬도 예루살렘으로 들어갔습니다
  - 압살롬이 예루살렘으로 들어오는 중이었습니다
  rationale: 히브리어의 전후 동사 형태 차이를 지우지 않고, 사건의 동시성을 한국어 진행상으로 살리는 편이 본문 흐름에 더 충실합니다.
  doctrine_reference: 문법-서사 상( aspect / discourse )
