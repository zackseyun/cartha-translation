base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/024.yaml
  text: And look[a], Zadok also came, and all the Levites with him, carrying the ark of the covenant of God. And they set down the ark of God[c][b], and Abiathar went up until all the people had finished crossing over from the city.
  footnotes:
  - marker: a
    text: That is, from Jerusalem.
    reason: cross_reference
  - marker: b
    text: Or 'They placed the ark of God.' The Hebrew verb may denote setting it down or positioning it there.
    reason: lexical_alternative
  - marker: c
    text: Or 'Abiathar came up.' The Hebrew literally says 'went up,' and the precise narrative nuance is uncertain.
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 사독도 왔고, 그와 함께한 모든 레위 사람이 하나님의 언약궤를 메고 왔습니다. 그들은 하나님의 궤를 내려놓았고[b], 아비아달은 모든 백성이 성읍에서[a] 건너가기를 마칠 때까지 올라갔습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 예루살렘에서입니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그들이 하나님의 궤를 두었습니다.’ 히브리어 동사는 그것을 내려놓거나 그 자리에 두는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘아비아달이 올라왔습니다.’ 히브리어는 문자적으로 ‘올라갔다’고 말하며, 정확한 서술 뉘앙스는 분명하지 않습니다.
    reason: alternative_reading
lexical_decisions:
