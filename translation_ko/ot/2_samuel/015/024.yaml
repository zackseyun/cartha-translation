  lexicon: HALOT
  rationale: 히브리어의 관용적 결합을 표준적이고 간결한 한국어 표현으로 옮겼습니다.
- source_word: וַיַּצִּקוּ
  english_pob_choice: They set down
  chosen_korean: 내려놓자
  alternatives_korean:
  - 놓자
  - 세우자
  - 두자
  lexicon: HALOT
  rationale: 궤를 이동에서 멈춰 특정 장소에 내려두는 동작을 반영해 ‘내려놓자’로 옮겼습니다.
- source_word: וַיַּעַל אֶבְיָתָר
  english_pob_choice: and Abiathar went up
  chosen_korean: 아비아달은 … 올라갔습니다
  alternatives_korean:
