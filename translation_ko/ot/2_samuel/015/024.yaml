  source_fidelity: 수정이 필요합니다. 원문은 첫 번째 언급에서만 ‘하나님의 언약궤’(אֲרוֹן בְּרִית הָאֱלֹהִים)라고 하고, 두 번째에서는 ‘하나님의 궤’(אֲרוֹן הָאֱלֹהִים)라고 합니다. 초안은 이 두 번째 표현까지 ‘하나님의 언약궤’로 반복하여 원문의 어휘 변화를 평준화했습니다. 또한 ‘내려놓자’는 원문의 단순 연속 서술을 즉시적 시간 관계로 바꿀 수 있습니다.
