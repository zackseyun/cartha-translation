  rationale: עלה의 기본 의미를 보존해 ‘올라갔습니다’로 직역에 가깝게 유지했습니다.
- source_word: מִן הָעִיר
  english_pob_choice: from the city
  chosen_korean: 성읍에서
  alternatives_korean:
  - 도성에서
  - 그 성에서
  - 예루살렘에서
  lexicon: HALOT
  rationale: 원문의 일반 명사 ‘성읍’을 유지하여 POB의 본문 어휘를 따라가되, 문맥상 예루살렘임은 암시하되 본문에는 덧붙이지 않았습니다.
theological_decisions:
- issue: 언약궤의 호칭을 한국 교회식으로 완화할지 여부
  chosen_reading: ‘하나님의 언약궤’로 직역해 원문의 서술적·성전적 긴장을 유지했습니다.
  alternative_readings:
  - ‘언약궤’
  - ‘하나님께 속한 궤’
  rationale: 히브리어의 소유·언약 관계를 분명히 드러내기 위해 축약하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘올라갔습니다’의 방향 동사 해석
  chosen_reading: 아비아달의 동작을 ‘올라갔습니다’로 그대로 두어, POB가 남긴 해석 여지를 유지했습니다.
  alternative_readings:
  - ‘올라왔습니다’
  - ‘나아갔습니다’
  rationale: עלה의 문자적 방향성을 보존하는 것이 본문의 서술을 가장 덜 개입적으로 전달합니다.
  doctrine_reference: Translation philosophy §3
