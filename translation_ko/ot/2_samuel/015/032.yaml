  text: וַ/יְהִ֤י דָוִד֙ בָּ֣א עַד הָ/רֹ֔אשׁ אֲשֶֽׁר יִשְׁתַּחֲוֶ֥ה שָׁ֖ם לֵ/אלֹהִ֑ים וְ/הִנֵּ֤ה לִ/קְרָאת/וֹ֙ חוּשַׁ֣י הָ/אַרְכִּ֔י קָר֨וּעַ֙ כֻּתָּנְתּ֔/וֹ וַ/אֲדָמָ֖ה עַל רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/032.yaml
  text: When David came to the summit[a], where he worshiped God, behold[b], Hushai the Archite came to meet him with his tunic torn and dirt on his head.
  footnotes:
  - marker: a
    text: Or 'where he worshiped God'; the Hebrew verb may denote either customary action ('used to worship') or simple past action.
    reason: lexical_alternative
  - marker: b
    text: '''Behold'' renders a Hebrew narrative marker that highlights the sudden appearance of Hushai.'
    reason: cultural_note
translation:
  language: ko
  text: 다윗이 하나님께 예배하던 그 꼭대기에 이르렀을 때, 보십시오, 아르키 사람 후새가 옷이 찢어지고 머리에 흙을 이고 그를 맞으러 왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 하나님께 예배하던 곳’이라는 뜻일 수 있습니다. 히브리어 동사는 습관적 행위나 단순 과거를 모두 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘보십시오’는 히브리어 서사 표지를 옮긴 것으로, 후새의 갑작스러운 등장에 초점을 줍니다.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  english_pob_choice: the summit
  chosen_korean: 그 꼭대기
  alternatives_korean:
  - 그 정상
  - 그 꼭대기
  lexicon: HALOT
  rationale: 지형 문맥에서 ‘머리’의 직역보다 ‘꼭대기/정상’이 자연스럽고, 지리적 상승 지점을 분명하게 드러냅니다.
- source_word: אֲשֶׁר יִשְׁתַּחֲוֶה שָׁם לֵאלֹהִים
  english_pob_choice: where he worshiped God
  chosen_korean: 하나님께 예배하던
  alternatives_korean:
  - 하나님께 예배하던
  - 하나님께 예배하곤 하던
  lexicon: HALOT
  rationale: 문맥상 습관적 장소를 가리키는 용법을 살려, 과거에 그곳에서 예배하던 곳임을 자연스럽게 표현했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 갑작스러운 등장과 장면 전환을 살리는 서술 표지이므로, 현대 한국어에서 자연스럽게 경계감을 주는 ‘보십시오’로 옮겼습니다.
- source_word: קָרוּעַ כֻּתָּנְתּ/וֹ
  english_pob_choice: with his tunic torn
  chosen_korean: 옷이 찢어지고
  alternatives_korean:
  - 속옷이 찢어지고
  - 옷이 찢어지고
  - 튠닉이 찢어지고
  lexicon: HALOT
  rationale: כֻּתֹּנֶת은 고대 의복이지만 한국어로는 특정 외래 문화어보다 의미가 분명한 ‘옷’이 읽기와 전달력에 더 적합합니다.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  english_pob_choice: and dirt on his head
  chosen_korean: 머리에 흙을 이고
  alternatives_korean:
  - 머리에 흙을 얹고
  - 머리에 흙을 뒤집어쓰고
  - 머리에 흙을 이고
  lexicon: HALOT
  rationale: ‘아다마’는 문자적으로 토양/흙을 가리키며, 장례·애도 맥락에서 ‘머리에 흙을 이고’가 관용적이면서도 원문의 상태를 잘 드러냅니다.
theological_decisions:
- issue: 예배 동사의 시제와 습관성
  chosen_reading: ‘하나님께 예배하던’으로 습관적 과거의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘하나님께 예배했습니다’
  - ‘하나님께 예배하곤 하던’
  rationale: 히브리어 미완료형은 서술 문맥에서 반복·습관 행동을 나타낼 수 있어, 단발 사건보다 그 장소의 예배 관습을 반영하는 쪽이 문맥에 더 가깝습니다.
  doctrine_reference: 서사 문맥의 동사상(상/Aspect) 처리
