  text: So Zadok and Abiathar returned the ark of God to Jerusalem, and they stayed there.
translation:
  language: ko
  text: 그리하여 사독과 아비아달은 하나님의 궤를 예루살렘으로 되돌려 놓고, 거기에서 머물렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  english_pob_choice: returned
  chosen_korean: 되돌려 놓고
  alternatives_korean:
  - 돌려보내고
  - 돌려놓고
  - 되돌아가게 하고
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려, 궤를 예루살렘으로 다시 가져다 놓는 동작을 자연스럽게 표현했습니다.
- source_word: אֲרוֹן הָאֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 궤
  alternatives_korean:
  - 하나님의 언약궤
  - 하나님의 법궤
  lexicon: HALOT
  rationale: 본문은 단순히 ‘하나님의 궤’라고 하므로, 더 풀어 쓴 전통적 표현을 덧붙이지 않고 직접적으로 옮겼습니다.
- source_word: וַיֵּשְׁבוּ שָׁם
  english_pob_choice: and they stayed there
  chosen_korean: 거기에서 머물렀습니다
  alternatives_korean:
  - 거기에서 지냈습니다
  - 거기에서 있었습니다
  - 거기에서 거주했습니다
  lexicon: HALOT
  rationale: ישב의 여기 문맥상 의미를 따라, 장기 체류보다는 단순한 계속 거주/머묾을 현대 한국어로 자연스럽게 표현했습니다.
- source_word: צָדוֹק וְאֶבְיָתָר
  english_pob_choice: Zadok and Abiathar
  chosen_korean: 사독과 아비아달
  alternatives_korean:
  - 사독과 아비아타르
  lexicon: 표준 인명 표기
  rationale: 한국어 성경에서 널리 쓰이는 표기를 따랐습니다.
theological_decisions:
- issue: ‘the ark of God’의 번역 범위
  chosen_reading: ‘하나님의 궤’로 옮겨, 본문에 없는 ‘언약’은 덧붙이지 않았습니다.
  alternative_readings:
  - 하나님의 언약궤
  rationale: 히브리어 원문이 여기서는 간단히 ‘하나님의 궤’라고 하므로, 의미를 넓혀 전통적 용어를 보태지 않았습니다.
  doctrine_reference: 본문 충실성 원칙
