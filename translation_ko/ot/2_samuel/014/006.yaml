source:
  edition: WLC
  text: וּ/לְ/שִׁפְחָֽתְ/ךָ֙ שְׁנֵ֣י בָנִ֔ים וַ/יִּנָּצ֤וּ שְׁנֵי/הֶם֙ בַּ/שָּׂדֶ֔ה וְ/אֵ֥ין מַצִּ֖יל בֵּֽינֵי/הֶ֑ם וַ/יַּכּ֧/וֹ הָ/אֶחָ֛ד אֶת הָ/אֶחָ֖ד וַ/יָּ֥מֶת אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/006.yaml
  text: And your servant had two sons[a], and the two of them fought in the field, and there was no one to separate them[b]; then the one struck the other and killed him.
  footnotes:
  - marker: a
    text: Or, 'your maidservant.' The Hebrew term is a deferential self-reference by a woman speaking to the king.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'there was no deliverer between them,' that is, no one to intervene and separate them.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 여종인 저에게는 두 아들이 있었습니다.[a] 그 두 아들이 들에서 서로 싸웠는데, 그들 사이에는 말릴 사람이 없었습니다.[b] 그러자 한 아들이 다른 아들을 쳐 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여성 종을 가리키는 말이며, 여기서는 왕 앞에서 여성이 자신을 낮추어 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들 사이에 구원자가 없었다’라는 말이지만, 문맥상 싸움에 개입하여 그들을 떼어 놓거나 말릴 사람이 없었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשִׁפְחָתְךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 여종
  - 당신의 여종인 저
  lexicon: HALOT
  rationale: שִׁפְחָה는 본래 여성 종/노비를 가리키지만, 왕 앞에서의 겸손한 자기지칭이라는 문맥상 한국어에서는 성별을 드러내기보다 공손한 자칭인 ‘당신의 종’이 가장 자연스럽습니다.
- source_word: שְׁנֵי בָנִים
  english_pob_choice: two sons
  chosen_korean: 두 아들
  alternatives_korean:
  - 두 아들이
  lexicon: HALOT
  rationale: בָנִים은 여기서 분명히 남자 자녀를 뜻하므로 ‘두 아들’이 원문의 성별 정보를 정확히 반영합니다.
- source_word: וַיִּנָּצוּ ... וְאֵין מַצִּיל בֵּינֵיהֶם
  english_pob_choice: fought ... and there was no one to separate them
  chosen_korean: 서로 다투다가 ... 그들을 말릴 사람이 없었고
  alternatives_korean:
  - 서로 싸우다가 ... 그들 사이에 구해낼 사람이 없었고
  - 서로 격투하다가 ... 중재할 사람이 없었고
  lexicon: HALOT
  rationale: וַיִּנָּצוּ는 단순 언쟁보다 실제 충돌로 번질 수 있는 다툼을 가리키며, מַצִּיל은 문자적으로 ‘구해내는 사람’이지만 여기서는 분쟁을 멈추게 할 중재자를 뜻하므로 ‘말릴 사람’이 문맥상 가장 적절합니다.
- source_word: וַיַּכּוֹ הָאֶחָד אֶת הָאֶחָד ... וַיָּמֶת אֹתוֹ
  english_pob_choice: then the one struck the other and killed him
  chosen_korean: 마침내 그들 가운데 하나가 다른 하나를 쳐서 죽였습니다
  alternatives_korean:
  - 그들 가운데 하나가 다른 하나를 때려 죽였습니다
  - 한 사람이 다른 사람을 쳐서 죽였습니다
  lexicon: HALOT
  rationale: נכה는 폭넓게 ‘치다/때리다/치다’로 옮길 수 있고, 뒤이은 מוּת 목적어 구조는 결과를 명시하므로 한국어에서는 ‘쳐서 죽였습니다’가 간결하면서도 인과를 분명히 드러냅니다.
