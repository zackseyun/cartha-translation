id: 2SA.14.8
reference: 2 Samuel 14:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר הַ/מֶּ֛לֶךְ אֶל הָ/אִשָּׁ֖ה לְכִ֣י לְ/בֵיתֵ֑/ךְ וַ/אֲנִ֖י אֲצַוֶּ֥ה עָלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/008.yaml
  text: Then the king said to the woman[a], “Go to your house, and I will give orders concerning you.”
  footnotes:
  - marker: a
    text: Or “I will command for you” / “I will give orders on your behalf.” The Hebrew preposition can be understood in more than one way, but the sense is that the king will issue instructions regarding her matter.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 그 여자에게 말했습니다. 「네 집으로 가라. 내가 너에 관하여 명령하겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 עַל은 이 문맥에서 ‘관하여’로도, ‘~를 위해/대신하여’로도 이해될 수 있습니다. 본문은 왕이 그녀의 사안에 대해 지시를 내린다는 뜻을 분명히 하되, 호의적 대리행위로 과도하게 좁히지 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 וַ-연속형을 한국어 자연스러운 순서 표지인 ‘그러자’로 살렸습니다.
- source_word: לְכִי
  english_pob_choice: Go
  chosen_korean: 가라
  alternatives_korean:
  - 가십시오
  - 떠나라
  lexicon: HALOT
  rationale: 여성 단수 명령형의 직접적인 명령을 유지하기 위해 평서적 명령형 ‘가라’로 옮겼습니다.
- source_word: לְבֵיתֵךְ
  english_pob_choice: to your house
  chosen_korean: 네 집으로
  alternatives_korean:
  - 네 집에
  - 네 집으로 돌아가
  lexicon: HALOT
  rationale: בַּיִת의 구체성을 살려 ‘집’으로 옮기고, 방향성을 나타내는 ל를 ‘-으로’로 자연스럽게 반영했습니다.
- source_word: אֲצַוֶּה עָלָיִךְ
  english_pob_choice: I will give orders concerning you
  chosen_korean: 너에 관하여 명령하겠습니다
  alternatives_korean:
  - 너를 위해 명령하겠습니다
  - 너에 대해 명령하겠습니다
  - 너와 관련하여 명령하겠습니다
  lexicon: HALOT
  rationale: צוה의 ‘명령하다’와 עַל의 ‘관하여/대하여’ 의미를 함께 살려, 왕이 그녀의 사안에 대해 지시를 내린다는 뜻을 드러냈습니다.
theological_decisions:
- issue: 왕의 명령이 누구를 위한 것인지의 뉘앙스
  chosen_reading: ‘너에 관하여 명령하겠습니다’로 옮겨, 왕이 그녀를 위해 좋은 조치를 한다는 뜻으로 과도하게 확정하지 않았습니다.
  alternative_readings:
  - 너를 위해 명령하겠습니다
  - 너를 대신하여 명령하겠습니다
  rationale: 히브리어 עָלָיִךְ는 ‘너에 관하여/대하여’가 기본적으로 가능하며, 문맥상 그녀의 일을 처리하겠다는 의미는 있으나 반드시 호의적 대리행위로만 좁힐 수는 없습니다.
  doctrine_reference: 문맥 주해 원칙
- issue: 직접화법의 명령 어조
  chosen_reading: 왕의 발화는 직접 명령형을 유지해 권위 있는 왕명으로 드러냈습니다.
  alternative_readings:
  - 가십시오로 완화
  - 돌아가라로 해석
  rationale: 서사 속 왕의 권위를 희석하지 않도록 히브리어 명령형의 직접성을 보존했습니다.
  doctrine_reference: 본문 화행 보존
