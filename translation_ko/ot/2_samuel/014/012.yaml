base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/012.yaml
  text: Then the woman said[a], “Please let your servant speak a word to my lord the king.” And he said, “Speak.”
  footnotes:
  - marker: a
    text: Hebrew 'your maidservant' or 'your female servant'; the main text uses the idiomatic courtly expression 'your servant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그 여인이 말했습니다. 「청하오니, 당신의 여종이 나의 주 왕께 한 마디 말씀드리게 하십시오.」 왕이 말했습니다. 「말하시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘당신의 여자 종/여종’이지만, 궁정에 드리는 겸손한 표현으로 영어 POB는 관용적으로 ‘your servant’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר הָאִשָּׁה
  english_pob_choice: Then the woman said
  chosen_korean: 그러자 그 여인이 말했습니다
  alternatives_korean:
  - 그리고 그 여인이 말했습니다
  - 그 여인이 말했습니다
  lexicon: HALOT
  rationale: 서술 진행을 나타내는 וַ-연속형을 한국어 담화 흐름에 맞게 ‘그러자’로 옮겨, 장면의 이어짐을 자연스럽게 살렸습니다.
- source_word: תְּדַבֶּר נָא שִׁפְחָתְךָ
  english_pob_choice: Please let your servant speak
  chosen_korean: 청하오니, 당신의 여종이 ... 말씀드리게 하십시오
  alternatives_korean:
  - 부디 당신의 종이 ... 말하게 하십시오
  - 부디 당신의 여종이 ... 말하게 하십시오
  lexicon: HALOT
  rationale: נָא의 공손한 청원을 ‘청하오니’로 옮기고, שִׁפְחָתְךָ의 여성형을 살려 ‘여종’으로 번역했습니다. 요청의 방향성은 ‘말씀드리게 하십시오’로 처리해 왕에게 드리는 정중한 간청을 드러냈습니다.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: to my lord the king
  chosen_korean: 나의 주 왕께
  alternatives_korean:
  - 내 주 왕께
  - 나의 주인 왕께
  lexicon: HALOT
  rationale: אדון의 인간 상호 존칭을 살려 ‘나의 주 왕께’로 옮겼습니다. ‘주인’은 한국어에서 지배적 뉘앙스가 강해 궁정 예절의 호칭으로는 덜 자연스럽습니다.
- source_word: דַּבֵּרִי
  english_pob_choice: Speak
  chosen_korean: 말씀드리게 하십시오… 왕이 말했습니다. 「말하시오.」
  alternatives_korean:
  - 말하십시오
  - 말하세요
  lexicon: HALOT
  rationale: 왕의 응답은 직접 명령형이므로 짧고 단호한 ‘말하시오’로 옮겼습니다. 대화체 내부에서 하십시오체를 유지하되, 왕의 발화는 상대적 위계를 반영해 더 직접적인 명령으로 처리했습니다.
theological_decisions:
- issue: 궁정 예절의 격식과 화자 간 위계 표현
  chosen_reading: 여인이 자신을 ‘당신의 여종’으로 낮추고 왕은 짧은 명령형으로 응답하는 궁정적 높임말 구조를 유지했습니다.
  alternative_readings:
  - 평이한 대화체로 완화
  - ‘종’으로 일반화
  rationale: 본문의 핵심은 내용보다 발화 예절과 위계의 연출에 있으므로, 한국어에서도 공손성과 신분 차이를 분명히 드러내는 편이 원문 기능을 더 잘 보존합니다.
  doctrine_reference: 서사 본문의 화행과 사회적 맥락 보존
