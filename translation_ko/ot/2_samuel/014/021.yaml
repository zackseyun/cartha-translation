  lexicon: WLC/HALOT
  rationale: 와우-연속의 서술 진행을 한국어 서사에 자연스럽게 옮기기 위해 시간 전환의 '그때'를 사용했습니다.
- source_word: הִנֵּה נָא
  english_pob_choice: Look now
  chosen_korean: 보십시오
  alternatives_korean:
