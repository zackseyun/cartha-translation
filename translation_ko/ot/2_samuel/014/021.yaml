  - 보라 지금
  lexicon: WLC/HALOT
  rationale: 주의 환기와 간청의 뉘앙스를 현대 한국어 명령/권유형으로 간결하게 살렸습니다.
- source_word: עָשִׂיתִי אֶת הַדָּבָר הַזֶּה
  english_pob_choice: I have done this thing
  chosen_korean: 제가 이 일을 했습니다
