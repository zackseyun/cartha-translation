  text: Then the king said to Joab[a], “Behold now, I have done this thing. Go, bring back the young man Absalom.”
  footnotes:
  - marker: a
    text: Or, “See now, I have granted this request; go, bring back the youth Absalom.” The Hebrew more literally reads, “I have done this thing.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 요압에게 말했습니다. "보십시오, 제가 이 일을 했습니다. 가서 젊은이 압살롬을 데려오십시오."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 "이 일을 했습니다"라고만 말합니다. 문맥상 요압의 요청을 허락했다는 뜻이 드러납니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
