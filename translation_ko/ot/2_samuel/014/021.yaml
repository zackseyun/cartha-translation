  lexicon: WLC/HALOT
  rationale: 히브리어의 직역성은 유지하되, 한국어에서 어색한 '이 일'을 살려 문맥상 조치의 실행을 드러냈습니다.
- source_word: הָשֵׁב אֶת הַנַּעַר אֶת אַבְשָׁלוֹם
  english_pob_choice: bring back the young man Absalom
  chosen_korean: 젊은이 압살롬을 데려오십시오
  alternatives_korean:
  - 젊은 압살롬을 데려오십시오
