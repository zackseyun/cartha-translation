revisions:
- from: 이제 내가 이 말씀을 내 주 왕께 아뢰러 왔습니다. 사람들이 저를 두렵게 했기 때문입니다. 그래서 당신의 여종이 말했습니다. ‘청하오니 왕께 말씀드리게 하소서. 아마 왕께서 여종의 말을 시행하실 것입니다.’[a][b]
  to: 이제 제가 이 일을 왕이신 내 주께 아뢰러 왔습니다. 사람들이 저를 두렵게 했기 때문입니다[a]. 그래서 이 여종이 말했습니다. ‘부디 왕께 말씀드리게 해 주십시오. 아마 왕께서 이 여종의 청을 들어 주실지도 모릅니다[b].’
  rationale: 히브리어 원문을 우선하여 사역 동사의 의미와 여성 화자의 겸손한 자기 지칭을 보존했습니다. 동시에 현대 표준어 합쇼체에 맞게 고풍스러운 ‘하소서’를 피하고, ‘시행하다’라는 부자연스러운 표현을 요청을 들어준다는 문맥적 의미로 바로잡았습니다. 각주 표지도 해당 구절 바로 뒤로 옮겼습니다.
