    rationale: ‘하소서’는 현대 합쇼체보다 고풍스러운 청원체입니다. 대상 변환의 요구인 현대 표준어 합쇼체에 맞추어 ‘말씀드리게 해 주십시오’로 고칩니다.
  - severity: low
