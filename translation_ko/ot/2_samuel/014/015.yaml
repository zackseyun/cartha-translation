id: 2SA.14.15
reference: 2 Samuel 14:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/עַתָּה אֲשֶׁר בָּ֜אתִי לְ/דַבֵּ֨ר אֶל הַ/מֶּ֤לֶךְ אֲדֹנִ/י֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּ֥י יֵֽרְאֻ֖/נִי הָ/עָ֑ם וַ/תֹּ֤אמֶר שִׁפְחָֽתְ/ךָ֙ אֲדַבְּרָה נָּ֣א אֶל הַ/מֶּ֔לֶךְ אוּלַ֛י יַעֲשֶׂ֥ה הַ/מֶּ֖לֶךְ אֶת דְּבַ֥ר אֲמָתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/015.yaml
  text: And now I have come to speak this matter to my lord the king[a], because the people have frightened me. And your servant said, ‘Please let me speak to the king[b]; perhaps the king will do the word of his servant.’
  footnotes:
  - marker: a
    text: Or, 'because the people made me afraid.' The Hebrew verb is causative ('frightened me'), not 'the people fear me.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the word of his maidservant.' That is, her request or plea.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내가 이 말씀을 내 주 왕께 아뢰러 왔습니다. 사람들이 저를 두렵게 했기 때문입니다. 그래서 당신의 여종이 말했습니다. ‘청하오니 왕께 말씀드리게 하소서. 아마 왕께서 여종의 말을 시행하실 것입니다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘두렵게 하다/겁주다’의 사역적 뉘앙스를 갖습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그의 여종의 말’입니다. 곧 그녀의 요청이나 청원을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 이제는
  lexicon: HALOT
  rationale: 담화 전환을 자연스럽게 살리되, 한국어에서는 중복된 접속감을 줄이기 위해 간결한 ‘이제’로 옮겼습니다.
- source_word: אֲשֶׁר בָּאתִי לְדַבֵּר
  english_pob_choice: I have come to speak
  chosen_korean: 이 말씀을 … 아뢰러 왔습니다
  alternatives_korean:
  - 말하려 왔습니다
  - 말씀드리러 왔습니다
  lexicon: HALOT
  rationale: ‘오다 + לדבר’의 도착·발화 결합을 살리면서, 왕에게 드리는 공손한 궁정 언어로 ‘아뢰다’를 선택했습니다.
- source_word: אֶת הַדָּבָר הַזֶּה
  english_pob_choice: this matter
  chosen_korean: 이 말씀
  alternatives_korean:
  - 이 일
  - 이 사정
  lexicon: HALOT
  rationale: דָּבָר는 단순한 ‘말’보다 그녀가 제시하는 요청/사안을 가리키므로, 문맥상 자연스러운 ‘이 말씀’으로 옮겼습니다.
- source_word: כִּי יֵרְאֻנִי הָעָם
  english_pob_choice: because the people have frightened me
  chosen_korean: 사람들이 저를 두렵게 했기 때문입니다
  alternatives_korean:
  - 사람들이 저를 무서워하기 때문입니다
  - 사람들이 저를 겁주었기 때문입니다
  lexicon: HALOT
  rationale: 피엘의 사역적 의미를 반영해 ‘사람들이 저를 두렵게 했다’로 옮겨, 백성이 그녀를 두려워한다는 오해를 피했습니다.
- source_word: שִׁפְחָתְךָ / אֲמָתֽוֹ
  english_pob_choice: your servant / his maidservant
  chosen_korean: 당신의 여종 / 여종의
  alternatives_korean:
  - 당신의 종 / 종의
  - 당신의 시녀 / 시녀의
  lexicon: HALOT
  rationale: 여성 하인에 해당하는 두 표현을 한국어에서 일관되게 ‘여종’으로 풀어, 겸손한 자기지칭과 성별 정보를 함께 살렸습니다.
- source_word: אֲדַבְּרָה נָּא אֶל הַמֶּלֶךְ
  english_pob_choice: Please let me speak to the king
  chosen_korean: 청하오니 왕께 말씀드리게 하소서
  alternatives_korean:
  - 부디 왕께 말하게 하소서
  - 왕께 말씀드리게 해 주십시오
  lexicon: HALOT
  rationale: נָא의 정중한 간청을 한국어 청원체로 옮기고, 왕에게 드리는 직접 화행을 살리기 위해 ‘말씀드리게 하소서’를 택했습니다.
- source_word: אוּלַי
  english_pob_choice: perhaps
  chosen_korean: 아마
  alternatives_korean:
  - 혹시
  - 어쩌면
  lexicon: HALOT
  rationale: 불확실성과 기대를 함께 나타내는 말로, 문맥상 지나치게 구어적인 ‘혹시’보다 문어적인 ‘아마’가 적절합니다.
- source_word: אֶת דְּבַר אֲמָתוֹ
  english_pob_choice: the word of his maidservant
  chosen_korean: 여종의 말을
  alternatives_korean:
  - 여종의 말씀을
  - 여종의 요청을
  lexicon: HALOT
  rationale: ‘word’의 직역을 지나치게 강조하기보다, 여기서의 내용이 곧 청원이라는 점을 드러내는 ‘말’을 사용하되, 여성 자칭을 유지했습니다.
theological_decisions:
- issue: 궁정 예절에서의 자기 호칭과 왕에게의 직접 청원
  chosen_reading: 화자가 자신을 낮추는 표현을 한국어 궁정/공손 표현으로 살려, 단순한 정보 전달이 아니라 간청 행위임을 분명히 했습니다.
  alternative_readings:
  - 직역적으로 ‘종’만 반복해 평평하게 옮김
  - 현대적 평어로 ‘저’만 사용해 예절감을 약화시킴
  rationale: 본문은 왕 앞에서의 예우와 간청이 핵심이므로, 한국어에서도 공손도의 차이를 보존해야 합니다.
  doctrine_reference: 서사적 화행과 본문 수사 보존
- issue: 피엘 형태의 causative 의미
  chosen_reading: ‘사람들이 저를 두렵게 했기 때문입니다’로 옮겨, 백성이 그녀를 ‘무서워한다’는 수동적 읽기를 배제했습니다.
  alternative_readings:
  - ‘사람들이 저를 두려워하기 때문입니다’
  - ‘사람들이 저를 무서워합니다’
  rationale: 히브리어 동사의 사역적 의미를 보존하지 않으면 사건의 인과관계가 달라집니다.
  doctrine_reference: 히브리어 동사상(사역/피엘) 보존
