translation:
  language: ko
  text: 압살롬에게는 세 아들과 한 딸이 태어났는데, 딸의 이름은 다말이었습니다. 그녀는 용모가 아름다운 여인이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘그녀는 매우 아름다웠다.’ 히브리어는 문자적으로 ‘용모가 아름다운 여인’이라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּלְדוּ לְאַבְשָׁלוֹם
  english_pob_choice: were born to Absalom
  chosen_korean: 압살롬에게는 …이 태어났는데
  alternatives_korean:
