  text: Three sons and one daughter were born to Absalom[a], and her name was Tamar. She was a woman beautiful in appearance.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'She was very beautiful.' The Hebrew reads literally, 'a woman beautiful in appearance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 압살롬에게는 아들 셋과 딸 하나가 태어났습니다. 그 딸의 이름은 다말이었습니다. 그녀는 용모가 아름다운 여인이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 자연스럽게, ‘그녀는 아름다웠습니다.’ 히브리어는 문자적으로 ‘용모가 아름다운 여인’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּלְדוּ לְאַבְשָׁלוֹם
  english_pob_choice: were born to Absalom
  chosen_korean: 압살롬에게는 …이 태어났는데
  alternatives_korean:
  - 압살롬에게서 …이 태어났는데
  - 압살롬에게 …이 태어났는데
  lexicon: BDB / HALOT
  rationale: יַלד의 니팔은 자녀 출생을 수동적으로 나타내므로, 한국어에서도 ‘태어나다’로 자연스럽게 옮기되 לְאַבְשָׁלוֹם의 친자 관계를 ‘압살롬에게는’으로 드러냈습니다.
- source_word: שְׁלוֹשָׁה בָנִים וּבַת אַחַת
  english_pob_choice: Three sons and one daughter
  chosen_korean: 세 아들과 한 딸
  alternatives_korean:
  - 세 자녀와 딸 하나
  - 아들 셋과 딸 하나
  lexicon: HALOT
  rationale: בָנִים는 ‘아들들’의 뜻이므로 성별을 유지했고, 수 표현은 한국어에서 가장 자연스러운 순서로 정리했습니다.
- source_word: וּשְׁמָהּ תָּמָר
  english_pob_choice: and her name was Tamar
  chosen_korean: 딸의 이름은 다말이었습니다
  alternatives_korean:
  - 그녀의 이름은 다말이었습니다
  - 이름은 다말이었습니다
  lexicon: HALOT
  rationale: 지시 대상이 바로 앞의 딸이므로 한국어에서는 소유대명사보다 ‘딸의 이름’이 더 분명하고 자연스럽습니다.
- source_word: אִשָּׁה יְפַת מַרְאֶה
  english_pob_choice: a woman beautiful in appearance
  chosen_korean: 용모가 아름다운 여인이었습니다
  alternatives_korean:
  - 아름다운 여인이었습니다
  - 겉모습이 아름다운 여인이었습니다
  lexicon: HALOT
  rationale: יְפַת מַרְאֶה는 외적인 아름다움을 가리키므로, ‘용모가 아름다운’으로 직역의 긴장을 유지하면서도 한국어 표현으로 자연화했습니다.
