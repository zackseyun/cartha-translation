source:
  edition: WLC
  text: וַ/יֹּֽאמֶר לָ֥/הּ הַ/מֶּ֖לֶךְ מַה לָּ֑/ךְ וַ/תֹּ֗אמֶר אֲבָ֛ל אִשָּֽׁה אַלְמָנָ֥ה אָ֖נִי וַ/יָּ֥מָת אִישִֽׁ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/005.yaml
  text: The king said to her[a], “What is the matter?” She said, “Indeed, I am a widow[b], and my husband has died.”
  footnotes:
  - marker: a
    text: Or, “What is the matter with you?”
    reason: lexical_alternative
  - marker: b
    text: Or, “Alas, I am a widow.”
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 그 여자에게 말씀하셨습니다[a]. 「무슨 일이오?」 그러자 여자가 말했습니다. 「정말 저는 과부입니다[b]. 제 남편이 죽었습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “무슨 일이 당신에게 있소?”
    reason: lexical_alternative
  - marker: b
    text: 또는 “아, 저는 과부입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לָּךְ
  english_pob_choice: What is the matter?
  chosen_korean: 무슨 일이오?
  alternatives_korean:
  - 어찌된 일이오?
  - 무슨 일이 있소?
  - 무슨 일이 있습니까?
  lexicon: HALOT
  rationale: 히브리어 관용구는 상대에게 직접 무슨 문제가 있는지 묻는 말이므로, 왕의 대화체 질문을 자연스럽게 살리되 의미를 과하게 완화하지 않기 위해 「무슨 일이오?」로 옮겼습니다.
- source_word: אֲבָל
  english_pob_choice: Indeed
  chosen_korean: 정말
  alternatives_korean:
  - 참으로
  - 과연
  - 아니오
  lexicon: HALOT
  rationale: 여기서는 역접이 아니라 발화의 강조를 여는 말이므로, 한국어의 담화 표지인 「정말」로 재현했습니다.
- source_word: אִשָּׁה אַלְמָנָה
  english_pob_choice: a widow
  chosen_korean: 과부
  alternatives_korean:
  - 과부인 여자
  - 홀몸의 여자
  lexicon: HALOT
  rationale: 히브리어의 '여자+과부'는 한국어 관용으로 「과부」가 가장 직접적이며, 문맥상 신분 설명을 간결하게 전달합니다.
- source_word: וַיָּמָת אִישִׁי
  english_pob_choice: my husband has died
  chosen_korean: 제 남편이 죽었습니다
  alternatives_korean:
  - 제 남편은 죽었습니다
  - 제 남편이 죽었나이다
  lexicon: HALOT
  rationale: אִישִׁי는 이 문맥에서 '남편'을 뜻하므로 그대로 살렸고, עבר형의 결과 상태를 한국어에서는 현재완료에 가까운 「죽었습니다」로 자연스럽게 표현했습니다.
- source_word: וַתֹּאמֶר
  english_pob_choice: She said
  chosen_korean: 그러자 여자가 말했습니다
  alternatives_korean:
  - 그리고 여자가 말했습니다
  - 여자가 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 וַ- 연쇄를 한국어의 순차 연결 「그러자」로 반영해 말의 흐름을 분명히 했습니다.
theological_decisions:
- issue: 왕의 질문과 여인의 자기 규정이 지닌 직접성
  chosen_reading: 왕의 직접 질문과 여인의 자가진술을 모두 살려, 정중하지만 거리감 있는 궁중 대화로 읽히게 했습니다.
  alternative_readings:
  - 더 현대적인 평서체로 완화하는 번역
  - 더 전통적인 경어로 과도하게 높이는 번역
  rationale: 본문은 서사 속 대면 대화이므로, 의미를 바꾸지 않으면서 한국어 화행의 자연스러움을 확보하는 것이 중요합니다.
  doctrine_reference: 서사체 대화의 화행 재현
