id: 2SA.14.1
reference: 2 Samuel 14:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֖דַע יוֹאָ֣ב בֶּן צְרֻיָ֑ה כִּֽי לֵ֥ב הַ/מֶּ֖לֶךְ עַל אַבְשָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/001.yaml
  text: Now Joab son of Zeruiah knew that the king’s heart was toward Absalom[a].
  footnotes:
  - marker: a
    text: Or 'the king longed for Absalom'; the Hebrew expression is terse and could also be understood more generally as 'the king’s heart was set toward Absalom.' Some have taken it negatively, 'was against Absalom,' though the following context favors a positive inclination.
    reason: alternative_reading
translation:
  language: ko
  text: 이제 요압은 스루야의 아들로서 왕의 마음이 압살롬 쪽으로 향해 있음을 알았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 간결하여 ‘왕의 마음이 압살롬을 그리워했다’, ‘왕의 마음이 압살롬에게 기울었다’로도 옮길 수 있습니다. 반대로 ‘왕의 마음이 압살롬을 반대했다’로 이해한 해석도 있으나, 이어지는 문맥은 대체로 긍정적 기울기를 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  english_pob_choice: Now ... knew
  chosen_korean: 이제 ... 알았습니다
  alternatives_korean:
  - 그리고 ... 알았습니다
  - 알게 되었습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서술 진행 기능을 살리면서, 한국어에서는 문맥 전환을 부드럽게 여는 ‘이제’와 완료형 ‘알았습니다’가 가장 자연스럽습니다.
- source_word: יוֹאָב בֶּן צְרֻיָה
  english_pob_choice: Joab son of Zeruiah
  chosen_korean: 요압은 스루야의 아들로서
  alternatives_korean:
  - 스루야의 아들 요압은
  - 요압, 스루야의 아들
  lexicon: 고유명사 표기 관행
  rationale: 인명은 한국어 성경에서 통용되는 ‘요압’, ‘스루야’를 따르고, 문장 흐름상 ‘스루야의 아들로서’가 가장 자연스럽습니다.
- source_word: לֵב הַמֶּלֶךְ
  english_pob_choice: the king’s heart
  chosen_korean: 왕의 마음
  alternatives_korean:
  - 왕의 심장
  - 왕의 중심
  lexicon: HALOT
  rationale: 히브리어 לֵב의 인지·의지·정서의 중심을 한국어 ‘마음’이 가장 폭넓게 담습니다.
- source_word: עַל
  english_pob_choice: was toward
  chosen_korean: '... 쪽으로 향해 있음을'
  alternatives_korean:
  - '...을 향하고 있음을'
  - '...에 마음이 가 있음을'
  - '...을 향한 마음이 있음을'
  lexicon: HALOT
  rationale: עַל과 ‘마음’의 결합은 문맥상 방향성을 주지만 단정적으로 풀기 어렵기 때문에, ‘쪽으로 향해 있다’로 두어 긍정적 호의인지 단순한 지향인지의 긴장을 보존합니다.
- source_word: אַבְשָׁלוֹם
  english_pob_choice: Absalom
  chosen_korean: 압살롬
  alternatives_korean:
  - 압삶
  - 압살롬
  lexicon: 고유명사 표기 관행
  rationale: 압살롬은 한국어 성경에서 확립된 표기이므로 이를 따릅니다.
theological_decisions:
- issue: 다윗의 내적 태도에 대한 의미 긴장
  chosen_reading: 왕의 마음이 압살롬 쪽으로 향해 있었다는 표현으로 두어, 호의적 그리움인지 단순한 내적 기울기인지 완전히 확정하지 않았습니다.
  alternative_readings:
  - 왕이 압살롬을 그리워했다
  - 왕의 마음이 압살롬에게 반대되어 있었다
  rationale: 히브리어는 매우 압축적이어서 본문만으로 감정의 방향을 단정하기 어렵습니다. 문맥을 살리되 해석을 과도하게 고정하지 않는 것이 적절합니다.
  doctrine_reference: '번역 원칙: 본문이 허용하는 긴장을 해소하지 않고 보존합니다.'
