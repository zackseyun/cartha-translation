revisions:
- from: 그 여인이 말했습니다. 「그렇다면 어찌하여 하나님의 백성을 상대로 그런 일을 꾸미셨습니까? 왕이 이 말씀을 하셨으니, 왕은 마치 죄인과도 같으십니다. 이는 왕께서 자기의 쫓겨난 이를 다시 데려오지 않으셨기 때문입니다.」[a][b]
  to: 그 여인이 말하였습니다. 「그렇다면 어찌하여 하나님의 백성을 거슬러 그런 일을 꾸미셨습니까?[a] 왕께서 이 말씀을 하신 것으로 말미암아, 왕께서는 유죄인 사람과 같으십니다.[b] 이는 왕께서 자신의 쫓겨난 이를 다시 데려오지 않으셨기 때문입니다.」
  rationale: 법정적 뉘앙스의 אָשֵׁם을 ‘유죄인 사람’으로 바로잡아 ‘죄인’이 유발할 수 있는 불필요한 도덕적·신학적 함의를 피했습니다. עַל עַם אֱלֹהִים은 ‘하나님의 백성을 거슬러’로 옮겨 원문의 대적 방향을 유지했습니다. 또한 각주 표지를 해당 어구 뒤로 옮기고 각주 문구를 수정하여 원문 및 영어 감사 기록의 대안을 정확하게 반영했습니다.
