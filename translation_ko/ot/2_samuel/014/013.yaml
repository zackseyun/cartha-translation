  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה וְ/לָ֧/מָּה חָשַׁ֛בְתָּה כָּ/זֹ֖את עַל עַ֣ם אֱלֹהִ֑ים וּ/מִ/דַּבֵּ֨ר הַ/מֶּ֜לֶךְ הַ/דָּבָ֤ר הַ/זֶּה֙ כְּ/אָשֵׁ֔ם לְ/בִלְתִּ֛י הָשִׁ֥יב הַ/מֶּ֖לֶךְ אֶֽת נִדְּחֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/013.yaml
  text: Then the woman said[a], “Why then have you planned such a thing against the people of God? For in speaking this word, the king is like one who is guilty[b], because the king has not brought back his banished one.”
  footnotes:
  - marker: a
    text: Or 'have you thought/devised such a thing against the people of God?'
    reason: lexical_alternative
  - marker: b
    text: Or 'the king is as one guilty,' that is, his own judgment implies his guilt for not bringing back the one banished from him.
    reason: alternative_reading
translation:
  language: ko
  text: 그 여인이 말했습니다. 「그렇다면 어찌하여 하나님의 백성을 상대로 그런 일을 꾸미셨습니까? 왕이 이 말씀을 하셨으니, 왕은 마치 죄인과도 같으십니다. 이는 왕께서 자기의 쫓겨난 이를 다시 데려오지 않으셨기 때문입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 백성을 상대로 이런 일을 생각/꾸미셨습니까?’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕은 유죄인 자와 같으십니다.’ 즉, 돌아오지 못한 사람을 데려오지 않은 자신의 판단이 자신을 유죄로 비춘다는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חָשַׁבְתָּה
  english_pob_choice: have you planned
  chosen_korean: 꾸미셨습니까
  alternatives_korean:
  - 생각하셨습니까
  - 계획하셨습니까
  lexicon: HALOT
  rationale: חשב은 생각하다/계획하다/꾸미다의 폭이 있는데, 여기서는 책망의 맥락에서 의도적으로 꾸민 행위가 강조되므로 ‘꾸미다’가 가장 직접적입니다.
- source_word: עַל עַם אֱלֹהִים
  english_pob_choice: against the people of God
  chosen_korean: 하나님의 백성을 상대로
  alternatives_korean:
  - 하나님의 백성에게
  - 하나님의 백성에 대하여
  lexicon: HALOT
  rationale: עַל은 여기서 대상에 대한 적대적 방향을 띠므로, 단순한 ‘대하여’보다 ‘상대로’가 책망의 뉘앙스를 더 잘 드러냅니다.
- source_word: וּמִדַּבֵּר הַמֶּלֶךְ הַדָּבָר הַזֶּה
  english_pob_choice: For in speaking this word, the king
  chosen_korean: 왕이 이 말씀을 하셨으니
  alternatives_korean:
  - 왕이 이 말을 하심으로
  - 왕이 이 말씀을 하므로
  lexicon: HALOT
  rationale: 구문상 원인은 왕의 발화 행위 자체에 있으므로, 한국어에서는 자연스러운 인과 표현으로 옮기되 ‘이 말씀’으로 구체성을 유지했습니다.
- source_word: כְּאָשֵׁם
  english_pob_choice: is like one who is guilty
  chosen_korean: 마치 죄인과도 같으십니다
  alternatives_korean:
  - 유죄인 것과도 같습니다
  - 죄가 있는 사람과도 같습니다
  lexicon: HALOT
  rationale: כ는 단정적 선언보다 비유를 나타내므로 ‘마치 … 같으십니다’로 살리고, אשׁם은 ‘죄인’으로 옮겨 왕의 자기판결이라는 수사 효과를 유지했습니다.
- source_word: נִדְּחוֹ
  english_pob_choice: his banished one
  chosen_korean: 자기의 쫓겨난 이를
  alternatives_korean:
  - 자기의 버려진 이를
  - 자기의 추방된 이를
  lexicon: HALOT
  rationale: נדח은 쫓겨나거나 내쫓긴 상태를 가리키므로, 인물 관계를 분명히 하면서도 ‘쫓겨난 이’로 압축해 아브살롬을 가리키는 여인의 우회적 표현을 살렸습니다.
theological_decisions:
- issue: 왕의 자기유죄 암시
  chosen_reading: 여인의 말은 왕이 아들을 돌려보내지 않은 처지를 스스로의 판결로 드러내는 것으로 유지했습니다.
  alternative_readings:
  - 단순히 행정적 판단의 오류로 완화하기
  - 왕의 도덕적 책임을 약화시키기
  rationale: 히브리어의 ‘마치 죄인’이라는 비유는 단순한 실수보다 왕의 판결이 자신에게 되돌아오는 수사적 긴장을 담고 있으므로, 이를 약화하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
