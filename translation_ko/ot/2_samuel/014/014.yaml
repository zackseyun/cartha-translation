source:
  edition: WLC
  text: כִּי מ֣וֹת נָמ֔וּת וְ/כַ/מַּ֨יִם֙ הַ/נִּגָּרִ֣ים אַ֔רְצָ/ה אֲשֶׁ֖ר לֹ֣א יֵאָסֵ֑פוּ וְ/לֹֽא יִשָּׂ֤א אֱלֹהִים֙ נֶ֔פֶשׁ וְ/חָשַׁב֙ מַֽחֲשָׁב֔וֹת לְ/בִלְתִּ֛י יִדַּ֥ח מִמֶּ֖/נּוּ נִדָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/014.yaml
  text: For we must surely die and are like water poured out on the ground[a], which cannot be gathered up again. Yet God does not take away life[b], but devises plans so that the banished one will not remain banished from him.
  footnotes:
  - marker: a
    text: Or, 'God does not show partiality to a person'; the Hebrew clause is difficult, and some understand it differently.
    reason: alternative_reading
  - marker: b
    text: Or, 'so that a banished one is not driven away from him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 반드시 죽습니다. 우리는 땅에 쏟아져 다시 모을 수 없는 물과 같습니다. 그러나 하나님은 생명을 거두지 않으시며[a], 쫓겨난 사람이 하나님에게서 쫓겨난 채로 남지 않도록 계획을 세우십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘하나님은 사람을 차별하지 않으신다’; 히브리어 절이 어렵기 때문에 다르게 이해하기도 합니다.
    reason: alternative_reading
  - marker: b
    text: 또는, ‘쫓겨난 사람이 그에게서 쫓겨나지 않도록’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹת נָמוּת
  english_pob_choice: we must surely die
  chosen_korean: 우리는 반드시 죽습니다
  alternatives_korean:
  - 우리는 반드시 죽을 것입니다
  - 죽고 또 죽습니다
  lexicon: HALOT
  rationale: תוֹרָה식의 강조 구조를 한국어로 자연스럽게 옮기되, 죽음의 필연성을 분명히 드러내기 위해 ‘반드시’로 강하게 표현했습니다.
- source_word: וְכַמַּיִם הַנִּגָּרִים אַרְצָה אֲשֶׁר לֹא יֵאָסֵפוּ
  english_pob_choice: and are like water poured out on the ground, which cannot be gathered up again
  chosen_korean: 땅에 쏟아진 물처럼 다시 모을 수 없습니다
  alternatives_korean:
  - 땅에 부어진 물처럼 다시 거둘 수 없습니다
  - 땅으로 쏟아진 물처럼 다시 모을 수 없습니다
  lexicon: HALOT
  rationale: 흩어진 물의 비가역성을 살리면서, 이어지는 ‘다시 모을 수 없음’과의 연결이 자연스럽도록 한국어로 매끈하게 옮겼습니다.
- source_word: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  english_pob_choice: Yet God does not take away a life
  chosen_korean: 그러나 하나님은 생명을 거두지 않으시고
  alternatives_korean:
  - 그러나 하나님은 목숨을 취하지 않으시고
  - 그러나 하나님은 사람을 차별하지 않으시고
  lexicon: HALOT
  rationale: 문맥상 죽음과 단절, 그리고 회복의 대비가 핵심이므로, נֶפֶשׁ을 ‘생명’으로 옮겨 ‘거두다’라는 표현으로 생명의 박탈을 자연스럽게 나타냈습니다.
- source_word: וְחָשַׁב מַחֲשָׁבוֹת לְבִלְתִּי יִדַּח מִמֶּנּוּ נִדָּח
  english_pob_choice: but devises plans so that the banished one will not remain banished from him
  chosen_korean: 쫓겨난 자가 자기에게서 쫓겨난 채로 남지 않도록 계획을 세우십니다
  alternatives_korean:
  - 유배된 자가 자기에게서 유배된 채로 남지 않도록 계획을 세우십니다
  - 내쫓긴 자가 그에게서 내쫓긴 채로 남지 않도록 계획을 세우십니다
  lexicon: HALOT
  rationale: 두 번 반복되는 נדח의 상태성을 살려 ‘쫓겨난 채로 남지 않도록’으로 옮겼고, 문맥에 맞게 회복을 향한 하나님의 의도적 계획을 드러냈습니다.
theological_decisions:
- issue: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ의 의미
  chosen_reading: ‘하나님은 생명을 거두지 않으신다’로 옮겨, 죽음의 불가역성과 대비되는 하나님의 회복 의지를 강조했습니다.
  alternative_readings:
  - 하나님은 사람을 차별하지 않으신다
  - 하나님은 목숨을 취하지 않으신다
  rationale: 이 절은 바로 앞의 죽음 비유와 뒤의 회복 계획 사이에 놓여 있어, ‘생명을 거두지 않으신다’가 문맥상 가장 자연스럽고, 동시에 본문의 난해함을 무리하게 평탄화하지 않습니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it without documentation.'
