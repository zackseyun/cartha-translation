- from: 우리는 반드시 죽습니다. 땅에 쏟아진 물처럼 다시 모을 수 없습니다. 그러나 하나님은 생명을 거두지 않으시고, 쫓겨난 자가 자기에게서 쫓겨난 채로 남지 않도록 계획을 세우십니다.[a][b]
  to: 우리는 반드시 죽습니다. 우리는 땅에 쏟아져 다시 모을 수 없는 물과 같습니다. 그러나 하나님은 생명을 거두지 않으시며[a], 쫓겨난 사람이 하나님에게서 쫓겨난 채로 남지 않도록 계획을 세우십니다.[b]
  rationale: 비교 구문을 명시하여 쏟아진 물의 회복 불가능성을 사람의 죽음에 적용하는 히브리어 구문을 분명히 했습니다. 또한 각주 a를 난해한 ‘생명을 거두지 않으시며’ 절에 직접 연결하고, 각주 b는 마지막 구문에 연결했습니다. 선택된 본문 해석과 그 대안 가능성은 모두 유지했습니다.
