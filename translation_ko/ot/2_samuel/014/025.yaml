language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/כְ/אַבְשָׁל֗וֹם לֹא הָיָ֧ה אִישׁ יָפֶ֛ה בְּ/כָל יִשְׂרָאֵ֖ל לְ/הַלֵּ֣ל מְאֹ֑ד מִ/כַּ֤ף רַגְל/וֹ֙ וְ/עַ֣ד קָדְקֳד֔/וֹ לֹא הָ֥יָה ב֖/וֹ מֽוּם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/025.yaml
  text: Now in all Israel there was not a man as handsome as Absalom[a], so highly praised; from the sole of his foot to the crown of his head there was no blemish in him.
  footnotes:
  - marker: a
    text: Or 'greatly praised' or 'praised exceedingly.' The Hebrew phrase לְהַלֵּל מְאֹד expresses the exceptional degree of praise Absalom received for his appearance.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 이스라엘에 압살롬만큼 잘생긴 남자는 없었는데, 사람들이 그를 매우 칭찬했습니다.[a] 발바닥에서부터 머리 꼭대기까지 그의 몸에는 흠이 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘매우 칭찬받았다’, ‘극진히 칭찬받았다’. 히브리어 לְהַלֵּל מְאֹד는 압살롬의 외모가 특별히 높은 찬사의 대상이었음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאַבְשָׁלוֹם
  english_pob_choice: Now ... Absalom
  chosen_korean: 온 이스라엘에 압살롬만큼
  alternatives_korean:
  - 그리고 압살롬은
  - 압살롬에 관해서는
  lexicon: HALOT
  rationale: 문장 첫머리의 전환과 압살롬 중심의 대비를 살려, 담화 초점을 자연스럽게 압살롬으로 옮겼습니다.
- source_word: לֹא הָיָה אִישׁ יָפֶה
  english_pob_choice: there was not a man as handsome
  chosen_korean: 잘생긴 남자는 없었는데
  alternatives_korean:
  - 아름다운 남자는 없었는데
  - 그만큼 잘생긴 남자는 없었는데
  lexicon: HALOT
  rationale: 남성 인물에 대한 יָפֶה의 자연스러운 현대 한국어 대응으로 '잘생기다'를 택했고, 비교의 뜻은 문맥 전체로 살렸습니다.
- source_word: לְהַלֵּל מְאֹד
  english_pob_choice: so highly praised
  chosen_korean: 그를 매우 칭찬했습니다
  alternatives_korean:
  - 그를 크게 칭찬했습니다
  - 그가 매우 칭찬받았습니다
  lexicon: HALOT
  rationale: 직역하면 다소 어색한 '찬양하다'보다, 외모에 대한 과도한 칭송이라는 뜻을 드러내도록 수동적 의미를 살려 자연스럽게 옮겼습니다.
- source_word: מִכַּף רַגְלוֹ וְעַד קָדְקֳדוֹ
  english_pob_choice: from the sole of his foot to the crown of his head
  chosen_korean: 발바닥에서부터 머리 꼭대기까지
  alternatives_korean:
  - 발바닥부터 머리의 꼭대기까지
  - 발바닥에서 머리 꼭대기까지
  lexicon: HALOT
  rationale: 신체 전체를 나타내는 머리에서 발끝까지의 관용적 범위를 한국어에서도 자연스럽게 보존했습니다.
- source_word: מוּם
  english_pob_choice: blemish
  chosen_korean: 흠
  alternatives_korean:
  - 결함
  - 흠집
  - 반점
  lexicon: HALOT
  rationale: 육체적 결함을 가리키는 מוּם의 의미를 유지하면서, 현대 한국어에서 인체 묘사에 무난한 '흠'으로 번역했습니다.
theological_decisions:
- issue: 압살롬의 외모 묘사에서 평가 어휘의 강도
  chosen_reading: ‘매우 칭찬했습니다’로 옮겨, 단순한 호감이 아니라 특별히 두드러진 외모 찬사를 나타냈습니다.
  alternative_readings:
  - ‘크게 칭찬받았습니다’
  - ‘극진히 칭송되었습니다’
  rationale: 히브리어 לְהַלֵּל מְאֹד의 과장된 정도를 약화하지 않고, 본문이 강조하는 예외적 외모 평판을 드러내기 위해서입니다.
  doctrine_reference: 서술 본문의 의미 보존; 인물 평가의 강도 유지
