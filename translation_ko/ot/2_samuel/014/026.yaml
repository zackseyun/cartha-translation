source:
  edition: WLC
  text: וּֽ/בְ/גַלְּח/וֹ֮ אֶת רֹאשׁ/וֹ֒ וְֽ֠/הָיָה מִ/קֵּ֨ץ יָמִ֤ים לַ/יָּמִים֙ אֲשֶׁ֣ר יְגַלֵּ֔חַ כִּֽי כָבֵ֥ד עָלָ֖י/ו וְ/גִלְּח֑/וֹ וְ/שָׁקַל֙ אֶת שְׂעַ֣ר רֹאשׁ֔/וֹ מָאתַ֥יִם שְׁקָלִ֖ים בְּ/אֶ֥בֶן הַ/מֶּֽלֶךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/026.yaml
  text: 'Whenever he cut the hair of his head—at the end of every year he would cut it[a], because it was heavy on him—when he cut it, he weighed the hair of his head: two hundred shekels by the king’s stone.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'according to the king’s stone,' referring to the royal standard weight.
    reason: cultural_note
translation:
  language: ko
  text: 그의 머리카락을 깎을 때마다—매년 말이 되면 그는 그것을 깎았는데, 그것이 그에게 무거웠기 때문입니다—그가 그것을 깎을 때마다 그는 머리카락을 달아 보았습니다. 왕의 돌로 두백 세겔이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘왕의 돌에 따라’로, 왕실의 표준 추를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְגַלְּחוֹ אֶת רֹאשׁוֹ
  english_pob_choice: Whenever he cut the hair of his head
  chosen_korean: 그의 머리카락을 깎을 때마다
  alternatives_korean:
  - 그의 머리를 깎을 때마다
  - 그가 머리카락을 밀 때마다
  lexicon: HALOT
  rationale: 본문은 반복적 습관 동작을 가리키며, 여기서는 ‘머리’보다 실제로 깎는 대상인 ‘머리카락’이 한국어에서 자연스럽고 오해를 줄입니다.
- source_word: וְהָיָה מִקֵּץ יָמִים לַיָּמִים
  english_pob_choice: at the end of every year
  chosen_korean: 매년 말이 되면
  alternatives_korean:
  - 해마다 끝날 무렵
  - 매년이 끝날 때마다
  lexicon: HALOT
  rationale: 관용구의 반복 주기를 현대 한국어로 자연스럽게 풀어, 연례적 규칙성을 분명하게 드러냅니다.
- source_word: כִּי כָבֵד עָלָיו
  english_pob_choice: because it was heavy on him
  chosen_korean: 그것이 그에게 무거웠기 때문입니다
  alternatives_korean:
  - 그에게 부담스러웠기 때문입니다
  - 그에게 무거운 짐이었기 때문입니다
  lexicon: HALOT
  rationale: ‘무겁다’라는 히브리어 이미지를 유지하되, 자연스러운 한국어로 풀어 육체적 무게와 번거로움을 함께 살립니다.
- source_word: מָאתַיִם שְׁקָלִים בְּאֶבֶן הַמֶּלֶךְ
  english_pob_choice: two hundred shekels by the king’s stone
  chosen_korean: 왕의 돌로 두백 세겔이었습니다
  alternatives_korean:
  - 왕의 표준돌로 두백 세겔이었습니다
  - 왕의 저울돌로 두백 세겔이었습니다
  lexicon: HALOT
  rationale: אֶבֶן은 문자적으로 ‘돌’이며, 여기서는 왕실 표준 추를 가리키므로 본문 이미지를 살려 ‘왕의 돌’로 옮기고, 단위는 세겔로 유지합니다.
