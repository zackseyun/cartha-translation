revisions:
- from: 그의 머리카락을 깎을 때마다—매년 말이 되면 그는 그것을 깎았는데, 그것이 그에게 무거웠기 때문입니다—그가 그것을 깎을 때마다 그는 머리카락을 달아 보았습니다. 왕의 돌로 두백 세겔이었습니다.[a]
  to: 그의 머리카락을 깎을 때마다—해마다 말이 되면, 머리카락이 그에게 무거웠기 때문에 그는 그것을 깎았습니다—그가 머리카락을 깎을 때에는 그 무게를 달았는데, 왕의 표준 추[a]에 따라 이백 세겔이었습니다.
  rationale: 반복적 머리 손질, 머리카락이 무거웠다는 이유, 그리고 왕실 표준 무게추에 따른 이백 세겔의 계량이라는 히브리어의 정보를 유지했습니다. 계량 동사는 실제 행위를 뜻하도록 고치고, ‘돌’의 문자적 표현은 본문의 자연스러움을 해치지 않도록 각주에 보존했습니다.
