  - severity: medium
    issue: ‘왕의 돌로 두백 세겔이었습니다’의 의미와 연결
    rationale: ‘돌’은 표준 추를 뜻하지만, 본문 표현만으로는 그 기능이 불분명하고 ‘로’의 관계도 어색합니다. ‘왕의 표준 추에 따라 이백 세겔’로 옮기면 מקור의 계량 기준을 자연스럽게 드러냅니다.
  - severity: low
