  source_fidelity: 핵심 내용은 대체로 충실합니다. 다만 ‘왕의 돌로 두백 세겔’은 בְּאֶבֶן הַמֶּלֶךְ가 가리키는 왕실의 표준 무게추에 따른 계량이라는 뜻을 한국어로 충분히 전달하지 못하며, 문장 분리로 인해 계량의 대상과 결과의 연결도 약해졌습니다.
  naturalness: ‘달아 보았습니다’는 여기서 실제로 무게를 재었다는 뜻의 שָׁקַל에 비해 시험적으로 해 본 듯한 뉘앙스를 줄 수 있습니다. 또한 ‘두백’은 현대 표준어 성경 문체에서는 일반적으로 ‘이백’이 자연스럽습니다. 반복되는 대명사 ‘그것’은 ‘머리카락’으로 밝혀 주는 편이 명료합니다.
  terminology: ‘세겔’은 유지하는 것이 적절합니다. אֶבֶן의 문자적 ‘돌’은 각주에서 보존하고, 본문에서는 기능을 드러내는 ‘왕의 표준 추’를 사용합니다. 각주 표지는 해당 표현 바로 뒤에 두었습니다.
  issues:
