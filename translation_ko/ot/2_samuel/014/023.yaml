base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/023.yaml
  text: So Joab arose and went to Geshur[a], and brought Absalom to Jerusalem.
  footnotes:
  - marker: a
    text: Or 'brought Absalom back to Jerusalem.' The context implies return from exile, though 'back' is not explicit in the Hebrew verb itself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 요압이 일어나 그술로 가서 압살롬을 예루살렘으로 데려왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 자체에는 ‘다시/돌아’의 의미가 분명히 들어 있지 않습니다. 문맥상 압살롬의 귀환이 암시됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어났습니다
  - 몸을 일으켰습니다
  lexicon: HALOT
  rationale: קום의 서술 진행형을 자연스러운 현대 한국어 동사 ‘일어나’로 옮겨, 행동 개시의 뉘앙스를 살리되 과도한 의역은 피했습니다.
- source_word: גְּשׁוּרָה
  english_pob_choice: to Geshur
  chosen_korean: 그술로
  alternatives_korean:
  - 그술에
  - 그술 쪽으로
  lexicon: HALOT
  rationale: 방향을 나타내는 동작에 맞춰 조사 ‘-로’를 사용해, 원문의 이동 방향을 간결하게 반영했습니다.
- source_word: וַיָּבֵא
  english_pob_choice: brought
  chosen_korean: 데려왔습니다
  alternatives_korean:
  - 가져왔습니다
  - 데리고 왔습니다
  lexicon: HALOT
  rationale: ביא의 ‘데려오다/데리고 오다’ 의미를 한국어에서 관계적·인격적 대상을 동반하는 자연스러운 표현으로 살렸습니다.
- source_word: יְרוּשָׁלִָם
  english_pob_choice: to Jerusalem
  chosen_korean: 예루살렘으로
  alternatives_korean:
  - 예루살렘에
  - 예루살렘까지
  lexicon: HALOT
  rationale: 도착지 표지를 한국어 목적격 방향 조사 ‘-으로’로 옮겨, 히브리어의 목적지 지시를 분명히 했습니다.
theological_decisions:
- issue: ‘back’의 암시를 본문에 넣을지 여부
  chosen_reading: 본문에는 ‘다시’나 ‘돌아’ 같은 회복·귀환 표지를 넣지 않고, 단순히 ‘데려왔습니다’로 옮겼습니다.
  alternative_readings:
  - 압살롬을 예루살렘으로 다시 데려왔습니다
  - 압살롬을 예루살렘으로 돌아오게 했습니다
  rationale: 영어 POB 주석이 지적하듯 히브리어 동사 자체는 ‘다시’라는 의미를 명시하지 않으므로, 귀환의 맥락은 독자가 이해하되 본문에서는 과잉 해석을 피했습니다.
  doctrine_reference: 본문 충실성 원칙
