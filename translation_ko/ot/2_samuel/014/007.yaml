language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּה֩ קָ֨מָה כָֽל הַ/מִּשְׁפָּחָ֜ה עַל שִׁפְחָתֶ֗/ךָ וַ/יֹּֽאמְרוּ֙ תְּנִ֣י אֶת מַכֵּ֣ה אָחִ֗י/ו וּ/נְמִתֵ֨/הוּ֙ בְּ/נֶ֤פֶשׁ אָחִי/ו֙ אֲשֶׁ֣ר הָרָ֔ג וְ/נַשְׁמִ֖ידָה גַּ֣ם אֶת הַ/יּוֹרֵ֑שׁ וְ/כִבּ֗וּ אֶת גַּֽחַלְתִּ/י֙ אֲשֶׁ֣ר נִשְׁאָ֔רָה לְ/בִלְתִּ֧י שום לְ/אִישִׁ֛/י שֵׁ֥ם וּ/שְׁאֵרִ֖ית עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/007.yaml
  text: And look[a], the whole family has risen up against your servant and said, ‘Give up the one who struck his brother, so that we may put him to death for the life of his brother whom he killed; and we will destroy the heir also.’ Thus they would quench my remaining ember[b], leaving my husband neither name nor remnant on the face of the earth.
  footnotes:
  - marker: a
    text: Or 'my last coal.' The Hebrew uses the image of a remaining live coal/ember for the last surviving hope of a family line.
    reason: lexical_alternative
  - marker: b
    text: '''Name nor remnant'' refers to preserving a man''s memory and surviving line, not merely his reputation.'
    reason: cultural_note
translation:
  language: ko
  text: 보십시오[a], 온 집안이 당신의 종을 대적하여 일어나 말하기를, ‘형제를 쳐 죽인 자를 넘겨 주어 그가 죽인 형제의 생명 때문에 그를 죽이게 하십시오. 그러면 그 상속자도 멸망시켜 버리겠습니다.’ 이리하여 그들은 남아 있는 제 불씨[b]를 꺼서, 제 남편에게 이 땅 위에 이름도 남은 자도 없게 하려 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보라’. 히브리어는 주의를 끄는 감탄사입니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘남아 있는 제 마지막 숯불/숯덩이’입니다. 남아 있는 가문의 마지막 희망을 가리키는 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게
  lexicon: HALOT
  rationale: 문맥상 놀람과 주목을 끄는 감탄사이므로, 현대 합쇼체에서 자연스러운 호명형인 ‘보십시오’로 옮겼습니다.
- source_word: שִׁפְחָתֶךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 여종
  - 당신의 노예
  lexicon: HALOT
  rationale: 왕에게 올리는 겸손한 자기지칭으로서 기능하므로, 성별을 드러내는 ‘여종’보다 포괄적이고 예절적인 ‘종’을 택했습니다.
- source_word: וְכִבּוּ אֶת גַּחַלְתִּי
  english_pob_choice: Thus they would quench my remaining ember
  chosen_korean: 남아 있는 제 불씨를 꺼서
  alternatives_korean:
  - 남아 있는 제 잿불을 끄고
  - 남아 있는 제 마지막 숯불을 꺼서
  lexicon: HALOT
  rationale: 가문의 마지막 남은 생명/희망을 가리키는 불씨 이미지를 살리기 위해 직역적이면서도 한국어로 자연스러운 ‘불씨를 꺼서’를 사용했습니다.
- source_word: לְאִישִׁי שֵׁם וּשְׁאֵרִית
  english_pob_choice: my husband neither name nor remnant
  chosen_korean: 제 남편에게 이 땅 위에 이름도 남은 자도 없게
  alternatives_korean:
  - 제 남편에게 이름도 후손도 없게
  - 제 남편의 이름도 남은 자도 없게
  lexicon: HALOT
  rationale: ‘name nor remnant’는 단순 명예가 아니라 기억과 생존 계통의 소멸을 뜻하므로, 이를 한국어에서 ‘이름’과 ‘남은 자’의 병렬로 유지했습니다.
theological_decisions:
- issue: ‘이름’과 ‘남은 자’의 의미 범위
  chosen_reading: 가문의 마지막 생존선과 기억의 소멸을 함께 드러내는 표현으로 읽었습니다.
  alternative_readings:
  - 단순히 사회적 평판의 상실로만 읽기
  - 직계 후손의 부재만 강조하기
  rationale: 히브리어 표현은 명성만이 아니라 계보의 지속과 기억의 보존을 함께 포함하므로, 둘 중 하나로 축소하지 않았습니다.
  doctrine_reference: 구약의 계보/기념 신학
