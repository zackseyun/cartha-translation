  to: 보십시오[a], 온 집안이 당신의 여종을 대적하여 일어나 말하기를, ‘형제를 친 자를 내놓으십시오. 그가 죽인 그 형제의 생명에 대한 대가로 우리가 그를 죽이겠습니다. 그리고 그 상속자도 없애 버리겠습니다.’ 이리하여 그들은 남아 있는 제 불씨[b]를 꺼서, 제 남편에게 이 땅 위에 이름도 후손도 남지 않게 하려 합니다.
