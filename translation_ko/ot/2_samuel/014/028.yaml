  text: So Absalom lived in Jerusalem for two years[a], and he did not see the king's face.
  footnotes:
  - marker: a
    text: Literally, 'and the face of the king he did not see.' The Hebrew idiom refers to being denied personal audience or access to the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 압살롬은 예루살렘에서 꼬박 두 해 동안 살았고, 왕의 얼굴을 보지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왕의 얼굴을 보지 않았습니다’입니다. 히브리어 관용구는 왕을 직접 알현하거나 왕에게 나아가지 못했음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: lived
  chosen_korean: 살았으나
  alternatives_korean:
  - 머물렀으나
  - 거주했으나
  - 머무르며 지냈으나
  lexicon: HALOT
  rationale: ישׁב는 ‘앉다/거주하다/머물다’의 뜻이므로, 예루살렘에서의 계속된 체류를 자연스러운 현대 한국어로 ‘살다’로 옮겼습니다.
- source_word: בִּירוּשָׁלִַם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘 안에서
  - 예루살렘에
  - 예루살렘 가운데서
  lexicon: 표준 지명 표기
  rationale: 히브리어 전치사구의 장소 의미를 그대로 살려 한국어의 자연스러운 처소 조사 ‘-에서’로 옮겼습니다.
- source_word: שְׁנָתַיִם יָמִים
  english_pob_choice: for two years
  chosen_korean: 두 해 동안
  alternatives_korean:
  - 두 해의 시간 동안
  - 두 해
  - 이 년 동안
  lexicon: HALOT
  rationale: ‘두 해, 날들’의 관용적 강조를 한국어의 자연한 지속 표현 ‘두 해 동안’으로 옮겨, 기간의 연속성을 드러냈습니다.
- source_word: וּפְנֵי הַמֶּלֶךְ
  english_pob_choice: the king's face
  chosen_korean: 왕의 얼굴
  alternatives_korean:
  - 왕의 얼굴 앞
  - 왕의 면전
  - 왕의 얼굴을 뵙지 못했습니다
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현을 살려 ‘왕의 얼굴’로 번역해, 왕에게 직접 나아가 알현하지 못했다는 관용적 의미를 유지했습니다.
theological_decisions:
- issue: 왕의 얼굴을 보지 못함이라는 관용구의 보존
  chosen_reading: 직접적 알현 부재를 드러내는 표현으로 그대로 유지했습니다.
  alternative_readings:
  - 왕을 알현하지 못했습니다
  - 왕의 면전에 나아가지 못했습니다
  rationale: 본문의 히브리어 관용구가 지닌 구체성과 서사적 긴장을 유지하기 위해, 완전히 의미화한 표현보다 ‘왕의 얼굴을 보지 못했습니다’를 택했습니다.
  doctrine_reference: 서사 본문의 직설적 표현 보존
