base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/024.yaml
  text: But the king said[a], “Let him turn aside to his own house, and let him not see my face.” So Absalom turned aside to his own house and did not see the king’s face.
  footnotes:
  - marker: a
    text: 'Hebrew: “see my face” / “the king’s face,” an idiom for being in someone’s presence or receiving an audience.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 왕이 말했습니다. “그를 자기 집으로 돌려보내고 내 얼굴은 보지 못하게 하십시오.” 그래서 압살롬은 자기 집으로 돌아갔고, 왕의 얼굴을 보지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 “내 얼굴/왕의 얼굴을 보다”는 사람의 임재 속에 있거나 접견을 받는다는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: But the king said
  chosen_korean: 그러나 왕이 말했습니다
  alternatives_korean:
  - 그리고 왕이 말했습니다
  - 그때 왕이 말했습니다
  lexicon: HALOT
  rationale: 서술의 흐름상 앞선 조치와 대비되는 왕의 거절을 드러내기 위해 ‘그러나’로 옮겼습니다. 합쇼체 서술에 맞춰 ‘말했습니다’를 사용했습니다.
- source_word: יִסֹּב / וַיִּסֹּב (סבב)
  english_pob_choice: turn aside / turned aside
  chosen_korean: 돌려보내고 / 돌아갔고
  alternatives_korean:
  - 돌아서게 하고 / 돌아섰고
  - 비켜가게 하고 / 비켜갔고
  lexicon: HALOT
  rationale: 히브리어 סבב는 단순 이동보다 방향을 바꾸어 떠나게 하는 뉘앙스가 있어, 명령형에서는 ‘돌려보내고’, 서술에서는 ‘돌아갔고’로 자연스럽게 살렸습니다.
- source_word: וּפָנַי ... לֹא יִרְאֶה / וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  english_pob_choice: and let him not see my face / and did not see the king’s face
  chosen_korean: 내 얼굴은 보지 못하게 하십시오 / 왕의 얼굴을 보지 못했습니다
  alternatives_korean:
  - 내 앞에 오지 못하게 하십시오 / 왕 앞에 나오지 못했습니다
  - 내 얼굴을 뵙지 못하게 하십시오 / 왕의 얼굴을 뵙지 못했습니다
  lexicon: HALOT
  rationale: פָּנִים를 POB처럼 문자적으로 ‘얼굴’로 유지해, ‘면전/접견 불가’라는 관용적 의미를 과도하게 풀지 않았습니다. 왕의 말과 내러티브 반복 구조도 그대로 드러납니다.
- source_word: אַבְשָׁלוֹם
  english_pob_choice: Absalom
  chosen_korean: 압살롬
  alternatives_korean:
  - 압살롬
  - 압셜롬
  lexicon: 표준 외래어 표기법
  rationale: 인명은 한국어 성서 관용 표기인 ‘압살롬’을 따랐습니다.
theological_decisions:
- issue: 히브리어 관용구 ‘얼굴을 보다’의 해석 여부
  chosen_reading: 주요 본문에서는 관용구를 직역해 ‘얼굴’을 유지했습니다.
  alternative_readings:
  - 내 앞에 오다
  - 접견을 받다
  rationale: 이 구절은 교리 쟁점이 아니라 서사적 거리두기를 보여 주는 표현이므로, 의미를 설명으로 바꾸기보다 반복되는 ‘얼굴’ 이미지를 보존하는 편이 원문 효과를 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
