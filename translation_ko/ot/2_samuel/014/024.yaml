revisions:
- from: 그러나 왕이 말했습니다. “그를 자기 집으로 돌려보내고 내 얼굴은 보지 못하게 하십시오.” 그래서 압살롬은 자기 집으로 돌아갔고, 왕의 얼굴을 보지 못했습니다.[a]
  to: 그러나 왕이 말했습니다. “그가 자기 집으로 돌아가게 하고, 내 얼굴을 보지 못하게 하십시오.” 그래서 압살롬은 자기 집으로 돌아갔고 왕의 얼굴을 보지 못했습니다.[a]
  rationale: 명령과 그 이행에서 같은 이동 동사가 반복되는 원문의 구조를 한국어에서도 ‘돌아가게 하고/돌아갔고’로 보존했습니다. ‘얼굴을 보다’는 본문에서 직역하고, 관용적 의미만 각주에서 설명했습니다.
