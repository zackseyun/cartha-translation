review_pass:
  verdict: revise
  source_fidelity: ‘돌려보내고’는 왕이나 제삼자가 압살롬을 보내는 행위를 다소 강하게 전제합니다. 히브리어 יִסֹּב와 이어지는 וַיִּסֹּב의 반복은 압살롬이 왕의 얼굴을 보지 않은 채 자기 집으로 방향을 돌리는 것을 나타내므로, 두 절에서 ‘돌아가다’를 반복하는 편이 더 충실합니다. ‘얼굴을 보다’의 직역과 부정 명령/서술의 대조는 유지되어야 합니다.
  naturalness: 합쇼체의 서술과 인용문은 자연스럽습니다. 다만 ‘내 얼굴은 보지 못하게’보다 목적격을 밝혀 ‘내 얼굴을 보지 못하게’ 하는 편이 문맥상 더 매끄럽습니다. 각주의 ‘임재 속에 있다’는 현대 한국어에서 다소 부자연스러우므로 ‘그 사람 앞에 나아가다’로 다듬는 것이 좋습니다.
  terminology: ‘왕’, ‘압살롬’, ‘얼굴’은 적절합니다. ‘얼굴을 보다’는 접견·알현의 관용적 함의를 각주에서 설명하되, 본문은 문자적 반복을 보존합니다.
  issues:
  - severity: medium
    issue: ‘그를 자기 집으로 돌려보내고’가 원문의 주어와 반복 동사를 약화합니다.
    rationale: יִסֹּב와 וַיִּסֹּב는 모두 압살롬이 자기 집으로 돌아서는 행위를 가리킵니다. ‘돌려보내다’는 누군가가 그를 보내는 타동적 조치를 전면에 내세우므로, ‘그가 … 돌아가게 하고’가 원문의 병행을 더 잘 반영합니다.
  - severity: low
    issue: 각주의 ‘임재 속에 있거나’ 표현이 현대 한국어로 다소 어색합니다.
    rationale: 관용구의 의미는 ‘그 사람 앞에 나아가거나 접견을 받다’로 설명하면 자연스럽고, 본문의 문자적 표현을 해설하는 기능도 분명합니다.
  revised_text: 그러나 왕이 말했습니다. “그가 자기 집으로 돌아가게 하고, 내 얼굴을 보지 못하게 하십시오.” 그래서 압살롬은 자기 집으로 돌아갔고 왕의 얼굴을 보지 못했습니다.[a]
  revised_footnotes:
  - marker: a
    text: 히브리어의 “내 얼굴/왕의 얼굴을 보다”는 그 사람 앞에 나아가거나 접견을 받는다는 관용적 표현입니다.
