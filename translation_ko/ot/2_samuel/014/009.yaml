  text: Then the woman from Tekoa said to the king[a], “On me, my lord the king, be the guilt, and on my father’s house; but the king and his throne are innocent.”
  footnotes:
  - marker: a
    text: Or “the iniquity” or “the blame”; the Hebrew word can refer to guilt, wrongdoing, or its liability/consequence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 드고아 여인이 왕에게 말했습니다. 「내 주 왕이여, 죄책은 저와 제 아버지의 집에 돌리소서. 그러나 왕과 왕의 왕좌는 무죄합니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죄책’은 여기서 히브리어 עָוֹן이 가리킬 수 있는 ‘죄, 허물, 책임, 그 결과로서의 दोष/부담’을 포괄적으로 옮긴 것입니다.
    reason: lexical_alternative
