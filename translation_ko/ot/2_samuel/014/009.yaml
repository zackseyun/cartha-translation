review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘죄책은 … 돌리소서’는 히브리어에 없는 청원/명령의 뉘앙스를 더합니다. 본문은 여인이 죄책의 귀속을 단정하는 명사절로 말합니다. 또한 ‘왕좌’까지 포함한 무죄 선언은 원문의 법정적 표현을 유지해야 합니다.
  naturalness: ‘드고아 출신 여인’과 ‘그 죄책은 … 있고’는 현대 표준 한국어의 격식 있는 서술체에서 자연스럽고, 원문의 강조된 호칭과 대조를 보존합니다. ‘왕과 왕의 왕좌’보다 ‘왕과 그 왕좌’가 동일 지시를 더 매끄럽게 드러냅니다.
  terminology: עָוֹן은 이 문맥에서 ‘죄책’으로 옮길 수 있습니다. 다만 각주에 혼입된 데바나가리 문자(‘दोष’)는 제거해야 하며, ‘죄, 허물, 책임 및 그에 따른 부담/결과’라는 의미 범위를 한국어로 명료하게 제시하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘돌리소서’가 원문에 없는 명령·청원 표현을 첨가합니다.
    rationale: 히브리어는 ‘내게 … 죄책이, 내 아버지의 집에’라는 명사절이며, 여인이 책임을 자신과 부계 가문에 돌린다고 선언합니다. 이를 명령형으로 바꾸면 발화의 문법적 형태와 뉘앙스가 달라집니다.
  - severity: low
    issue: 각주에 한국어 문맥과 무관한 ‘दोष’가 포함되어 있습니다.
    rationale: 의미 설명을 방해하는 문자 혼입이므로 제거해야 합니다.
  - severity: low
    issue: 각주 표지를 ‘죄책’에 직접 연결하는 편이 어휘 주석의 범위를 명확히 합니다.
    rationale: 주석은 עָוֹן의 의미 범위에 관한 것이므로 해당 번역어 바로 뒤에 두는 것이 적절합니다.
  revised_text: 그때 드고아 출신 여인이 왕에게 말했습니다. 「내 주 왕이여, 그 죄책은 저와 제 아버지의 집에 있고, 왕과 그 왕좌는 무죄합니다.」
