base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/009.yaml
  text: Then the woman from Tekoa said to the king[a], “On me, my lord the king, be the guilt, and on my father’s house; but the king and his throne are innocent.”
  footnotes:
  - marker: a
    text: Or “the iniquity” or “the blame”; the Hebrew word can refer to guilt, wrongdoing, or its liability/consequence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 드고아 여인이 왕에게 말했습니다. 「내 주 왕이여, 죄책은 저와 제 아버지의 집에 돌리소서. 그러나 왕과 왕의 왕좌는 무죄합니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죄책’은 여기서 히브리어 עָוֹן이 가리킬 수 있는 ‘죄, 허물, 책임, 그 결과로서의 दोष/부담’을 포괄적으로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקוֹעִית
  english_pob_choice: the woman from Tekoa
  chosen_korean: 드고아 여인
  alternatives_korean:
  - 드고아 사람 여자
  - 드고아 출신 여인
  lexicon: HALOT
  rationale: 지명형 형용사 תְּקוֹעִית의 출신 표시를 살리되, 현대 한국어에서 자연스러운 인물 지칭으로 옮겼습니다.
- source_word: עָלַי הֶעָוֺן
  english_pob_choice: On me ... be the guilt
  chosen_korean: 죄책은 저에게 돌리소서
  alternatives_korean:
  - 허물은 저에게 돌리소서
  - 죄악은 저에게 돌리소서
  - 책임은 저에게 돌리소서
  lexicon: HALOT
  rationale: עָוֹן은 단순한 추상적 ‘죄’보다 책임이 귀속되는 법적·도덕적 부담을 포함하므로, 문맥에 맞게 ‘죄책’으로 옮겼습니다.
- source_word: וְכִסְאוֹ
  english_pob_choice: his throne
  chosen_korean: 왕의 왕좌
  alternatives_korean:
  - 그의 왕좌
  - 그의 보좌
  - 왕권
  lexicon: HALOT
  rationale: 직역의 이미지를 유지하면서도 한국어에서 왕권의 상징인 ‘왕좌’로 표현해 메톤미를 살렸습니다.
theological_decisions:
- issue: 왕과 왕좌에 대한 무죄 선언의 범위
  chosen_reading: 왕과 왕의 왕좌는 무죄합니다
  alternative_readings:
  - 왕과 왕의 왕좌는 죄가 없습니다
  - 왕과 왕의 왕좌는 허물이 없습니다
  rationale: 이 표현은 왕의 전반적 도덕적 완전성을 선언하기보다, 이 사건에서의 법적 책임을 부인하는 말입니다. 따라서 본문이 말하는 사법적 무죄를 그대로 살렸습니다.
  doctrine_reference: 본문의 사법적/서사적 진술을 신학적으로 확장하지 않음
