  text: וַ/יֹּ֨אמֶר אֶל עֲבָדָ֜י/ו רְאוּ֩ חֶלְקַ֨ת יוֹאָ֤ב אֶל יָדִ/י֙ וְ/ל/וֹ שָׁ֣ם שְׂעֹרִ֔ים לְכ֖וּ ו/הוצתי/ה בָ/אֵ֑שׁ וַ/יַּצִּ֜תוּ עַבְדֵ֧י אַבְשָׁל֛וֹם אֶת הַ/חֶלְקָ֖ה בָּ/אֵֽשׁ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/030.yaml
  text: Then he said to his servants[a], “Look, Joab’s field is next to mine, and he has barley there. Go and set it on fire.” So Absalom’s servants set the field on fire.
  footnotes:
  - marker: a
    text: Hebrew literally, “Joab’s field is at my hand,” an idiom meaning it is beside or adjacent to Absalom’s property.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 자기 종들에게 말했습니다. 「보십시오, 요압의 밭이 내 곁에 있고 거기 보리가 있습니다. 가서 그것을 불태우십시오.」 그러자 압살롬의 종들이 그 밭에 불을 질렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “요압의 밭이 내 손에 있다”는 뜻이지만, 여기서는 ‘내 곁에/가까이 있다’는 인접을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו / עַבְדֵי אַבְשָׁלוֹם
  english_pob_choice: servants / Absalom’s servants
  chosen_korean: 종들 / 압살롬의 종들
  alternatives_korean:
  - 하인들
  - 시종들
  lexicon: HALOT
  rationale: 이 문맥의 עבד는 궁중적 수행원을 가리키며, 본문은 노예 상태를 부각하지 않으므로 표준적인 ‘종들’이 가장 무난합니다.
- source_word: אֶל יָדִי
  english_pob_choice: next to mine
  chosen_korean: 내 곁에
  alternatives_korean:
  - 내 손에
  - 내 옆에
  - 내 소유 곁에
  lexicon: HALOT
  rationale: 직역하면 ‘내 손에/내 손 곁에’이지만, 토지의 인접성을 나타내는 관용구이므로 한국어에서는 자연스럽게 ‘내 곁에’로 옮겼습니다.
- source_word: חֶלְקַת
  english_pob_choice: field
  chosen_korean: 밭
  alternatives_korean:
  - 땅
  - 구획
  - 토지
  lexicon: HALOT
  rationale: 요압의 농작지로 묘사되므로, 소유된 경작지를 드러내는 ‘밭’이 가장 자연스럽습니다.
- source_word: וְהוּצִיתִהָ / וַיַּצִּתוּ
  english_pob_choice: set it on fire / set ... on fire
  chosen_korean: 불태우십시오 / 불을 질렀습니다
  alternatives_korean:
  - 불사르십시오 / 불태웠습니다
  - 태우십시오 / 태웠습니다
  lexicon: HALOT
  rationale: 동사의 사역적 뉘앙스를 살려 명령형은 ‘불태우십시오’로, 서술형은 결과를 분명히 하는 ‘불을 질렀습니다’로 옮겼습니다.
- source_word: שְׂעֹרִים
  english_pob_choice: barley
  chosen_korean: 보리
  alternatives_korean:
  - 보리 곡식
  - 보리 이삭
  lexicon: HALOT
  rationale: 여기서는 밭에서 자라는 작물로서의 보리를 뜻하므로 일반 명사 ‘보리’로 충분합니다.
