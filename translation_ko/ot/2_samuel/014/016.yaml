  source_fidelity: 초안은 ‘그 사람의 손에서’와 ‘그 사람에게서’를 중복하여 원문의 문장 관계를 흐리며, ‘하나님의 상속 유산에서 끊어지지 않게’는 원문의 ‘나와 내 아들을 함께 … 끊어 버리려는’ 목적을 부정형 결과절로 바꾸었습니다. 또한 ‘죽이려는’은 הִשְׁמִיד의 포괄적인 ‘멸하다/끊어 버리다’보다 좁습니다. 수정문은 왕이 여종을 구출할 것이라는 진술과, 그 남자가 어머니와 아들을 하나님의 유산에서 함께 끊어 버리려 한다는 목적을 보존합니다.
  naturalness: ‘하나님의 상속 유산’은 한국어에서 의미가 중복되고, 초안의 긴 수식 구조는 ‘그 사람’의 지시 관계를 불명확하게 합니다. ‘하나님의 유산에서 끊어 버리려는 그 사람의 손에서’로 배열하면 현대 표준어 합쇼체에서 자연스럽고 의미 관계도 분명합니다.
  terminology: אֲמָתוֹ의 여성형은 ‘여종’으로 유지했습니다. נַחֲלַת אֱלֹהִים은 본문에서 ‘하나님의 유산’으로 직역에 가깝게 두고, 이스라엘 안에서 하나님이 배정하신 몫이라는 가능한 문맥적 이해와 ‘하나님의 유산’이라는 소유격 이해를 각주에 보존했습니다. הִשְׁמִיד는 ‘죽이다’로 한정하지 않고 ‘끊어 버리다’로 옮겼습니다.
