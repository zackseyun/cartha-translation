base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/016.yaml
  text: For the king will hear[b][a], to deliver his servant from the hand of the man who would destroy me and my son together from the inheritance of God.
  footnotes:
  - marker: a
    text: Or 'his maidservant'; the Hebrew term is specifically feminine.
    reason: lexical_alternative
  - marker: b
    text: '''The inheritance of God'' likely refers to the inheritance allotted by God within Israel; alternatively, ''God''s inheritance.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 왕께서는 이 여종을 나와 내 아들을 함께 하나님의 유산에서 끊어 버리려는 그 사람의 손에서 건져 내시려고 들으실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여종’은 히브리어가 여성형임을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하나님의 유산’은 하나님께서 이스라엘 안에서 배정하신 언약적 몫을 가리킬 수 있으며, 또는 하나님 자신의 유산으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע
  english_pob_choice: will hear
  chosen_korean: 들으실 것입니다
  alternatives_korean:
  - 들으십니다
  - 들으실 터입니다
  - 들을 것입니다
  lexicon: HALOT
  rationale: 원문의 ‘듣다’ 의미를 살리되, 왕의 응답 가능성을 전망하는 문맥이므로 미래·정중 표현으로 옮겼습니다.
- source_word: אֲמָתוֹ
  english_pob_choice: his servant
  chosen_korean: 자기 여종
  alternatives_korean:
  - 그의 여종
  - 자기 종녀
  - 그의 시녀
  lexicon: HALOT
  rationale: 히브리어가 여성형임을 반영해야 하므로 ‘여종’으로 옮기고, 문맥상 왕에게 드리는 공손한 자기 지칭을 살려 ‘자기’를 붙였습니다.
- source_word: מִכַּף הָאִישׁ
  english_pob_choice: from the hand of the man
  chosen_korean: 그 사람의 손에서
  alternatives_korean:
  - 그 사람의 손아귀에서
  - 그 사람의 권세에서
  - 그 사람의 손길에서
  lexicon: HALOT
  rationale: ‘손’의 관용적 의미인 권세를 너무 풀지 않고, 한국어에서도 직역에 가까운 표현을 유지해 원문의 긴장을 보존했습니다.
- source_word: מִנַּחֲלַת אֱלֹהִים
  english_pob_choice: from the inheritance of God
  chosen_korean: 하나님의 상속 유산에서
  alternatives_korean:
  - 하나님의 기업에서
  - 하나님의 유산에서
  - 하나님께서 정하신 몫에서
  lexicon: HALOT
  rationale: POB의 ‘inheritance’ 선택을 따라, 언약적 배분이라는 의미를 드러내기 위해 ‘상속 유산’으로 옮겼습니다. 전통적 교회어 ‘기업’은 가능하지만 여기서는 독자가 소유·배분의 개념을 바로 파악하도록 했습니다.
theological_decisions:
- issue: ‘하나님의 inheritance’의 범위
  chosen_reading: 여인과 아들이 하나님께서 이스라엘 안에서 정해 주신 언약적 몫에서 끊어질 위험을 가리킵니다.
  alternative_readings:
  - 하나님의 소유된 백성 자체를 가리킨다
  - 일반적인 가족 상속 문제를 말한다
  rationale: 문맥이 가문 단절과 공동체 내 자리 상실을 함께 다루므로, 원문의 언약적 무게를 살리면서도 뜻을 지나치게 좁히지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3, §5
