  to: 왕께서는 이 여종을 나와 내 아들을 함께 하나님의 유산에서 끊어 버리려는 그 사람의 손에서 건져 내시려고 들으실 것입니다.[a][b]
  rationale: 원문의 문장 순서와 목적 관계를 따라, 왕이 여종을 구출하기 위해 들을 것이라는 진술을 유지했습니다. ‘그 사람’이 화자와 아들을 ‘함께’ 하나님의 유산에서 끊어 버리려 한다는 수식어를 ‘그 사람의 손에서’에 연결하여 원문의 적대 행위를 자연스럽게 드러냈습니다. 각주 표지는 여종과 하나님의 유산에 각각 연결되도록 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:37:13Z'
