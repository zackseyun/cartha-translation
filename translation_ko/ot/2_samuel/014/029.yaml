  source_fidelity: 개정이 필요합니다. 초안의 ‘그를 왕에게 보내도록 하려 하였으나’는 압살롬 자신의 의도만을 나타내어, 요압에게 자신을 왕에게 보내 달라고 요청한 목적 구문을 충분히 드러내지 못합니다. 또한 ‘그러므로’는 앞 절과의 논리적 인과를 다소 강하게 보탭니다. 두 번째 ‘보냈으나’의 수신자인 요압도 한국어에서는 밝혀 주는 편이 자연스럽고 정확합니다.
  naturalness: ‘요압에게 사람을 보내어’와 ‘요압에게 다시 두 번째로 사람을 보냈으나’는 원문의 ‘보내다’와 문맥상 소환의 뜻을 자연스럽게 연결합니다. ‘다시 두 번째로’는 히브리어의 반복 강조를 보존하되 다소 중복적으로 들릴 수 있으나, 최적 등가 번역에서는 유지할 수 있습니다.
  terminology: ‘압살롬’, ‘요압’, ‘왕’은 표준적인 성경 인명 및 호칭입니다. אָבָה는 ‘오려고 하지 않았습니다’로 옮겨 ‘원하지 않다/응하려 하지 않다’의 의미를 보존합니다.
