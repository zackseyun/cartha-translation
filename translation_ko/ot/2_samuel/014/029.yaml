  to: 이에 압살롬은 요압에게 사람을 보내어 자신을 왕에게 보내 달라고 하였으나, 요압은 그에게 오려고 하지 않았습니다.[a] 압살롬은 요압에게 다시 두 번째로 사람을 보냈으나, 요압은 오려고 하지 않았습니다.
