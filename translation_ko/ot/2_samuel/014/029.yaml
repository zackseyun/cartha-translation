  yaml_path: translation/ot/2_samuel/014/029.yaml
  text: So Absalom sent for Joab to send him to the king[a], but he was not willing to come to him. So he sent again a second time, but he was not willing to come.
  footnotes:
  - marker: a
    text: Or, 'refused to come' (lit. 'was not willing to come').
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 압살롬은 요압에게 사람을 보내어 자신을 왕에게 보내 달라고 하였으나, 요압은 그에게 오려고 하지 않았습니다.[a] 압살롬은 요압에게 다시 두 번째로 사람을 보냈으나, 요압은 오려고 하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오려고 하지 않았습니다’는 히브리어 אָבָה의 직역에 가깝습니다. 문맥상 ‘오기를 거절했습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent for
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 보냈습니다
  - 요압을 불렀습니다
  - 요압에게 전갈을 보냈습니다
  lexicon: HALOT
  rationale: אָבָה와 결합된 반복 구조 속에서 단순한 ‘보내다’보다, 요압에게 메시지를 전달해 반응을 요구하는 행위를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: לִשְׁלֹחַ אֹתוֹ אֶל הַמֶּלֶךְ
  english_pob_choice: to send him to the king
  chosen_korean: 그를 왕에게 보내도록
  alternatives_korean:
  - 그를 왕에게 데려가도록
  - 그를 왕 앞에 나아가게 하도록
  - 왕에게 가게 하도록
  lexicon: HALOT
  rationale: 목적 부정사로서 ‘~하도록’의 뜻을 살려, 요압이 왕에게 가는 길을 마련해 주는 중개적 목적을 드러냈습니다.
- source_word: אָבָה
  english_pob_choice: was not willing
  chosen_korean: 오려고 하지 않았습니다
  alternatives_korean:
  - 원하지 않았습니다
  - 마음이 내키지 않았습니다
  - 응하지 않았습니다
  lexicon: HALOT
  rationale: 단순한 거절 선언보다 ‘원함/의지 없음’의 어감을 살리되, 앞뒤 문맥상 출발 행동을 가리켜 ‘오려고 하지 않았다’로 구체화했습니다.
- source_word: עוֹד שֵׁנִית
  english_pob_choice: again a second time
  chosen_korean: 다시 두 번째로
  alternatives_korean:
  - 두 번째로 다시
  - 한 번 더
  - 거듭 두 번째로
  lexicon: HALOT
  rationale: עוֹד와 שֵׁנִית이 함께 주는 반복의 강세를 한국어에서도 두 요소가 모두 보이도록 옮겼습니다.
theological_decisions:
- issue: 압살롬의 반복된 요청과 요압의 비응답을 나타내는 서술의 어조
  chosen_reading: 사건 서술의 반복과 대조를 그대로 살려, 인물 평가를 덧붙이지 않았습니다.
  alternative_readings:
  - 요압이 끝내 거절했습니다
  - 압살롬이 거듭 간청했습니다
  rationale: 히브리어의 wayyiqtol 반복과 אָבָה의 의미를 따라, 독자가 요압의 비협조를 직접 판단하도록 두는 것이 본문 효과에 충실합니다.
  doctrine_reference: 서사 본문 해석 원칙
