base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/032.yaml
  text: Absalom said to Joab[a], “Look, I sent word to you, saying, ‘Come here, so that I may send you to the king, to say, “Why have I come from Geshur? It would be better for me still to be there.”’ Now then, let me see the king’s face; and if there is guilt in me[b], let him put me to death.”
  footnotes:
  - marker: a
    text: Hebrew literally, “let me see the king’s face,” an idiom for appearing before the king.
    reason: lexical_alternative
  - marker: b
    text: Or, “Better for me if I were still there.” The Hebrew clause is elliptical.
    reason: lexical_alternative
translation:
  language: ko
  text: 압살롬이 요압에게 말했습니다. 「보십시오, 내가 당신에게 사람을 보내 ‘이리로 오라. 그러면 내가 당신을 왕에게 보내어, ‘내가 왜 그술에서 왔는가? 아직 거기 있는 편이 나았을 것이다’라고 말하게 하겠다’고 했습니다. 이제 제가 왕의 얼굴을 뵙게 해 주십시오. 그리고 제게 죄가 있거든, 저를 죽이십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕의 얼굴을 보다’는 왕 앞에 나아가 공식적으로 알현한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘내가 아직 거기 있었더라면 더 좋았을 것이다’라는 뜻을 압축해 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자
  lexicon: HALOT
  rationale: 대화의 주의를 끄는 담화 표지로서, 현대 문어체에서 자연스러운 공손 명령형으로 옮겼습니다.
- source_word: שָׁלַחְתִּי אֵלֶיךָ
  english_pob_choice: I sent word to you
  chosen_korean: 당신에게 사람을 보내
  alternatives_korean:
  - 당신에게 전갈을 보내
  - 당신에게 보냈다
  lexicon: HALOT
  rationale: 이 문맥의 שׁלח은 단순한 물건 발송보다 호출/전갈 전달의 의미가 강하므로, 한국어로는 ‘사람을 보내’로 구체화했습니다.
- source_word: אֶרְאֶה פְּנֵי הַמֶּלֶךְ
  english_pob_choice: let me see the king’s face
  chosen_korean: 왕의 얼굴을 뵙게 해 주십시오
  alternatives_korean:
  - 왕 앞에 나가게 해 주십시오
  - 왕을 뵙게 해 주십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘얼굴을 보다’를 한국어의 존대 관용 표현으로 풀어, 왕 앞에 나아감을 자연스럽게 드러냈습니다.
- source_word: עָוֺן
  english_pob_choice: guilt
  chosen_korean: 죄
  alternatives_korean:
  - 죄책
  - 불의
  lexicon: HALOT
  rationale: 재판적 맥락에서 책임을 묻는 의미가 있으나, 한국어 본문에서는 압살롬의 생사 요청을 분명히 하기 위해 가장 직접적인 ‘죄’로 옮겼습니다.
- source_word: וֶהֱמִתָנִי
  english_pob_choice: let him put me to death
  chosen_korean: 저를 죽이십시오
  alternatives_korean:
  - 저를 사형에 처하십시오
  - 저를 죽게 하십시오
  lexicon: HALOT
  rationale: 원문의 사역형은 ‘죽게 하다’이지만, 한국어에서는 군더더기 없이 강한 최종 요청을 전달하는 ‘저를 죽이십시오’가 가장 자연스럽습니다.
theological_decisions:
- issue: 압살롬의 직접 화법 안에서의 공손도
  chosen_reading: 압살롬의 왕에게 드리는 요청은 한국어에서 공손체로 옮기되, 내용 자체의 도전성과 긴박함은 그대로 유지했습니다.
  alternative_readings:
  - 반말체로 직역
  - 더 완곡한 청원체로 순화
  rationale: 원문은 위기 상황에서의 직접적인 요구이므로, 한국어에서는 합쇼체를 쓰되 의미를 약화시키지 않도록 했습니다.
  doctrine_reference: 문체/화행 보존
- issue: ‘왕의 얼굴을 보다’ 관용구 처리
  chosen_reading: 관용구의 이미지를 살리면서도 독자가 의미를 즉시 이해하도록 ‘왕의 얼굴을 뵙게 해 주십시오’로 번역했습니다.
  alternative_readings:
  - ‘왕 앞에 나가게 해 주십시오’처럼 완전 의역
  - ‘왕의 얼굴을 보게 해 주십시오’의 직역
  rationale: 히브리어의 표면 이미지를 완전히 지우지 않되, 한국어에서 자연스럽고 존대가 드러나는 표현을 택했습니다.
  doctrine_reference: 관용구/서사 문체
