base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/032.yaml
  text: Absalom said to Joab[a], “Look, I sent word to you, saying, ‘Come here, so that I may send you to the king, to say, “Why have I come from Geshur? It would be better for me still to be there.”’ Now then, let me see the king’s face; and if there is guilt in me[b], let him put me to death.”
  footnotes:
  - marker: a
    text: Hebrew literally, “let me see the king’s face,” an idiom for appearing before the king.
    reason: lexical_alternative
  - marker: b
    text: Or, “Better for me if I were still there.” The Hebrew clause is elliptical.
    reason: lexical_alternative
translation:
  language: ko
  text: 압살롬이 요압에게 말했습니다. “보십시오, 내가 당신에게 전갈을 보내어 ‘이리로 오십시오. 내가 당신을 왕께 보내어, “내가 왜 그술에서 왔습니까? 아직도 거기에 있는 것이 내게 더 나았을 것입니다.”라고 말씀드리게 하려고 합니다’라고 했습니다. 이제 제가 왕의 얼굴을 뵙게 해 주십시오[a]. 제게 죄가 있다면, 왕께서 저를 죽이시게 하십시오.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘왕의 얼굴을 보다’는 왕 앞에 나아가 공식적으로 알현한다는 뜻의 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 마지막 청원은 문자적으로 ‘그가 나를 죽이게 하라’이며, 여기서 ‘그’는 왕을 가리킵니다.
    reason: lexical_alternative
