  lexicon: HALOT
  rationale: 이 문맥의 שׁלח은 단순한 물건 발송보다 호출/전갈 전달의 의미가 강하므로, 한국어로는 ‘사람을 보내’로 구체화했습니다.
- source_word: אֶרְאֶה פְּנֵי הַמֶּלֶךְ
  english_pob_choice: let me see the king’s face
  chosen_korean: 왕의 얼굴을 뵙게 해 주십시오
  alternatives_korean:
  - 왕 앞에 나가게 해 주십시오
  - 왕을 뵙게 해 주십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘얼굴을 보다’를 한국어의 존대 관용 표현으로 풀어, 왕 앞에 나아감을 자연스럽게 드러냈습니다.
- source_word: עָוֺן
  english_pob_choice: guilt
  chosen_korean: 죄
  alternatives_korean:
  - 죄책
  - 불의
  lexicon: HALOT
  rationale: 재판적 맥락에서 책임을 묻는 의미가 있으나, 한국어 본문에서는 압살롬의 생사 요청을 분명히 하기 위해 가장 직접적인 ‘죄’로 옮겼습니다.
- source_word: וֶהֱמִתָנִי
  english_pob_choice: let him put me to death
  chosen_korean: 저를 죽이십시오
  alternatives_korean:
  - 저를 사형에 처하십시오
  - 저를 죽게 하십시오
  lexicon: HALOT
  rationale: 원문의 사역형은 ‘죽게 하다’이지만, 한국어에서는 군더더기 없이 강한 최종 요청을 전달하는 ‘저를 죽이십시오’가 가장 자연스럽습니다.
theological_decisions:
- issue: 압살롬의 직접 화법 안에서의 공손도
  chosen_reading: 압살롬의 왕에게 드리는 요청은 한국어에서 공손체로 옮기되, 내용 자체의 도전성과 긴박함은 그대로 유지했습니다.
  alternative_readings:
