theological_decisions:
- issue: 왕에게 드리는 극존칭 요청의 한국어 화용론
  chosen_reading: 왕에게는 일반 서술체가 아니라 공손 명령형과 높임말을 사용해, 원문의 궁정 예절을 살린 합쇼체로 옮겼습니다.
  alternative_readings:
  - 보다 평평한 중립체로 옮기기
  - 전통 교회문체의 '말씀하옵소서' 사용
  rationale: 이 절은 신학적 진술보다 대화의 예절과 위계가 핵심이므로, 현대 독자가 원문의 정중한 긴장감을 바로 느끼도록 공손한 높임을 유지했습니다.
  doctrine_reference: 고대 근동의 왕실 예절과 서사적 대화 관습
