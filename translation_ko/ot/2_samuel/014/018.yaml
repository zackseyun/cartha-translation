  text: 그러자 왕이 대답하여 그 여자에게 말했습니다. “부디, 내가 너에게 묻는 것을 하나도 내게 숨기지 마십시오.” 그러자 그 여자가 말했습니다. “내 주 왕이시여, 부디 말씀하십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “내가 너에게 묻는 한 가지도 내게 숨기지 마십시오”라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 더 문자적으로, “내 주 왕께서 말씀하시게 하십시오.”
    reason: lexical_alternative
