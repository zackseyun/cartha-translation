  yaml_path: translation/ot/2_samuel/014/018.yaml
  text: Then the king answered and said to the woman[a], “Please do not hide from me anything that I ask you.” And the woman said, “Please speak[b], my lord the king.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''do not hide from me a thing that I ask you.'''
    reason: lexical_alternative
  - marker: b
    text: Or, more formally, 'Let my lord the king speak.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 그 여자에게 대답하여 말했습니다. "부탁하니, 내가 너에게 묻는 것을 하나도 내게서 숨기지 마십시오." 그러자 그 여자가 말했습니다. "부탁하오니, 내 주 왕께서 말씀하십시오."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “내가 너에게 묻는 것을 하나도 내게서 숨기지 마십시오”의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 더 문자적으로, “내 주 왕께서 말씀하시게 하십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  english_pob_choice: answered ... said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 연속 동사구를 자연스럽게 살리면서, 서술 흐름과 대화 전환을 분명히 드러내기 위해 '대답하여 말했습니다'로 옮겼습니다.
- source_word: אַֽל־נָא ... תְכַחֲדִי
  english_pob_choice: Please do not hide
  chosen_korean: 부탁하니 ... 숨기지 마십시오
  alternatives_korean:
  - 부디 ... 감추지 마십시오
  - 제발 ... 숨기지 마십시오
  lexicon: HALOT
  rationale: 금지와 정중한 간청이 함께 있는 표현으로 보아, 현대 한국어에서 가장 자연스러운 공손 명령형인 '숨기지 마십시오'를 택했습니다.
- source_word: מִמֶּנִּי דָּבָר
  english_pob_choice: anything
  chosen_korean: 내게서 ... 것을 하나도
  alternatives_korean:
  - 내게서 ... 아무것도
  - 내게서 ... 한 가지도
  lexicon: HALOT
  rationale: 문맥상 '묻는 것' 전체를 가리키는 미완전 목적어이므로, 부정문에서 자연스러운 '하나도'를 더해 의미를 분명히 했습니다.
- source_word: יְדַבֶּר נָא אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: Please speak, my lord the king
  chosen_korean: 부탁하오니, 내 주 왕께서 말씀하십시오
  alternatives_korean:
  - 부탁하오니, 내 주 왕이 말씀하십시오
  - 내 주 왕께서 말씀하시기를 청합니다
  lexicon: HALOT
  rationale: 아지랑이처럼 남는 3인칭 정중 요청을 한국어에서는 직접 청하는 말로 풀어, 왕에게 올리는 공손한 요청의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 왕에게 드리는 극존칭 요청의 한국어 화용론
  chosen_reading: 왕에게는 일반 서술체가 아니라 공손 명령형과 높임말을 사용해, 원문의 궁정 예절을 살린 합쇼체로 옮겼습니다.
  alternative_readings:
  - 보다 평평한 중립체로 옮기기
  - 전통 교회문체의 '말씀하옵소서' 사용
  rationale: 이 절은 신학적 진술보다 대화의 예절과 위계가 핵심이므로, 현대 독자가 원문의 정중한 긴장감을 바로 느끼도록 공손한 높임을 유지했습니다.
  doctrine_reference: 고대 근동의 왕실 예절과 서사적 대화 관습
