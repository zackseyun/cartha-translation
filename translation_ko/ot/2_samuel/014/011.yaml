  text: Then she said[a], “Please let the king remember Yahweh your God, so that the avenger of blood may not continue to destroy, and they may not destroy my son.” And he said, “As Yahweh lives[b], not one hair of your son shall fall to the ground.”
  footnotes:
  - marker: a
    text: Or, 'the blood avenger.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''if a hair of your son falls to the ground,'' meaning complete protection.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그 여인이 말했습니다. 「청하오니 왕께서 야훼, 당신의 하나님을 기억하시어, 피의 복수자가 더 이상 멸망시키지 못하게 하시고, 내 아들을 멸망시키지 못하게 하소서」. 왕이 말했습니다. 「야훼께서 살아 계심과 같이, 네 아들의 머리카락 한 올도 땅에 떨어지지 않을 것이다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, ‘네 아들의 머리카락 한 올도 땅에 떨어지지 않는다’는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: יִזְכָּר נָא
  english_pob_choice: Please let the king remember
  chosen_korean: 청하오니 왕께서 기억하시어
  alternatives_korean:
  - 부디 왕이 기억하시어
  - 왕께서 기억해 주시기를 청합니다
  lexicon: HALOT
  rationale: נָא가 붙은 미완료/쥬서브형 요청은 단순 서술이 아니라 공손한 청원입니다. 한국어에서는 ‘청하오니’와 연결형 ‘기억하시어’가 왕에게 드리는 간청을 자연스럽게 살립니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼, 당신의 하나님
  alternatives_korean:
  - 야훼, 왕의 하나님
  - 여호와, 당신의 하나님
  lexicon: HALOT
  rationale: 본문의 יְהוָה는 공용역 전통 대신 학술적 음역 ‘야훼’로 옮겼고, 2인칭 소유 표현은 왕에게 직접 말하는 문맥을 따라 ‘당신의 하나님’으로 살렸습니다.
- source_word: גֹּאֵל הַדָּם
  english_pob_choice: the avenger of blood
  chosen_korean: 피의 복수자
  alternatives_korean:
  - 피를 갚는 자
  - 피보수자
  lexicon: HALOT
  rationale: 법률적 용어를 드러내면서도 한국어에서 이해 가능한 표현으로 옮겼습니다. ‘복수자’는 POB의 법정/혈연 보복 개념을 비교적 सीधे 보여 줍니다.
- source_word: מֵהַרְבּוֹת ... לְשַׁחֵת
  english_pob_choice: may not continue to destroy
  chosen_korean: 더 이상 멸망시키지 못하게 하시고
  alternatives_korean:
  - 더 멸망시키지 못하게 하시고
  - 계속 멸망시키지 못하게 하시고
  lexicon: HALOT
  rationale: הִפְעִיל infinitive of רבה가 단순 ‘파괴’보다 반복·증식의 뉘앙스를 가지므로, ‘더 이상’으로 그 계속성을 반영했습니다. ‘멸망시키다’는 출애굽기적·재난적 파괴의 강도를 살립니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서 살아 계심과 같이
  alternatives_korean:
  - 야훼의 살아 계심을 두고
  - 야훼께서 살아 계시는 한
  lexicon: HALOT
  rationale: 맹세 공식은 한국어 성경 문체에서 ‘…께서 살아 계심과 같이’가 가장 자연스럽고 엄숙합니다.
- source_word: מִשַּׂעֲרַת בְּנֵךְ
  english_pob_choice: not one hair of your son
  chosen_korean: 네 아들의 머리카락 한 올도
  alternatives_korean:
  - 네 아들의 머리카락 하나도
  - 네 아들의 털끝 하나도
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어 관용으로 옮겨 완전한 보호를 나타냈습니다. ‘한 올도’가 문맥상 가장 자연스럽습니다.
theological_decisions:
- issue: 여호와 대신 야훼 사용
  chosen_reading: 본문의 여호와를 ‘야훼’로 음역
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 יְהוָה를 사용하므로, 프로젝트 기본 원칙에 따라 고유 신명은 ‘야훼’로 일관되게 표기했습니다. 이는 독자가 언약 이름의 직접성을 보도록 돕습니다.
