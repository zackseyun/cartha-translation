  source_fidelity: 핵심 법적 표현인 גֹּאֵל הַדָּם을 ‘피의 복수자’로 옮긴 점과, מֵהַרְבּוֹת의 계속·증가의 뉘앙스를 ‘더는’으로 반영하려 한 점은 적절합니다. 다만 ‘내 아들을 멸망시키지 못하게 하소서’는 앞 절의 왕에 대한 청원과 문법적으로 연결되지 않고, 원문의 복수 동사 יַשְׁמִידוּ도 충분히 드러나지 않습니다. 수정문은 왕에게 드리는 청원의 범위와 복수 주어를 자연스럽게 보존합니다.
  naturalness: ‘야훼, 당신의 하나님’에서 ‘당신’은 현대 한국어에서 왕에게 올리는 말로 부자연스럽거나 대립적으로 들릴 수 있으므로 ‘왕의 하나님’으로 고쳤습니다. 또한 ‘청하오니’와 ‘하소서’는 목표로 삼은 현대 합쇼체와 다소 거리가 있어, 현대적이면서도 공손한 ‘청합니다/해 주십시오’로 정리했습니다. ‘멸망시키다’를 한 개인에게 적용한 반복은 부자연스러워 ‘해치다’와 ‘없애 버리다’로 문맥에 맞게 조정했습니다.
  terminology: ‘야훼’는 프로젝트 방침과 원문의 신명 יְהוָה에 부합하므로 유지했습니다. ‘피의 복수자’는 גֹּאֵל הַדָּם의 법적·혈연적 보복 개념을 보존하는 적절한 용어입니다. 맹세 공식 חַי־יְהוָה는 ‘야훼께서 살아 계심을 두고 맹세합니다’로 자연스럽고 엄숙하게 옮겼습니다.
