  rationale: 본문이 직접 יְהוָה를 사용하므로, 프로젝트 기본 원칙에 따라 고유 신명은 ‘야훼’로 일관되게 표기했습니다. 이는 독자가 언약 이름의 직접성을 보도록 돕습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
