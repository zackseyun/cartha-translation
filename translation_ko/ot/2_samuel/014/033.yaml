base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/033.yaml
  text: Then Joab came to the king and told him[a], and he called for Absalom. So he came to the king and bowed himself with his face to the ground before the king[b], and the king kissed Absalom.
  footnotes:
  - marker: a
    text: Or 'summoned Absalom.'
    reason: lexical_alternative
  - marker: b
    text: The king's kiss likely signals reconciliation or restored favor, though the text states only that he kissed him.
    reason: cultural_note
translation:
  language: ko
  text: 그때 요압이 왕에게 와서 그에게 알렸습니다. 그러자 왕이 압살롬을 불러 오게 했습니다. 압살롬이 왕에게 와서, 왕 앞에서 얼굴을 땅에 대고 엎드려 절하자, 왕이 압살롬에게 입을 맞추었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불러 오게 했습니다’는 궁정 문맥에서 ‘소환하다’의 뜻을 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 입맞춤은 화해나 회복된 호의를 시사할 수 있지만, 본문은 그 행동 자체만 말합니다.
    reason: theological_note
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 왔습니다
  - 들어와
  lexicon: HALOT
  rationale: 이동 서술을 자연스러운 현대 한국어로 옮기되, 왕에게 다가오는 문맥을 살려 ‘와서’로 처리했습니다.
- source_word: וַיַּגֶּד לוֹ
  english_pob_choice: told him
  chosen_korean: 그에게 알렸습니다
  alternatives_korean:
  - 그에게 말했습니다
  - 그에게 보고했습니다
  lexicon: HALOT
  rationale: נגד의 기본 의미인 ‘알리다/전하다’를 반영해, 단순 발화보다 보고성 있는 전달을 드러냈습니다.
- source_word: וַיִּקְרָא אֶל אַבְשָׁלוֹם
  english_pob_choice: he called for Absalom
  chosen_korean: 압살롬을 불러 오게 했습니다
  alternatives_korean:
  - 압살롬을 불렀습니다
  - 압살롬을 소환했습니다
  lexicon: HALOT
  rationale: 궁정 맥락에서 ‘부르다’는 단순 호명이 아니라 왕 앞으로 데려오게 하는 뜻이므로, 그 함의를 살려 옮겼습니다.
- source_word: וַיִּשְׁתַּחוּ לוֹ עַל אַפָּיו אַרְצָה לִפְנֵי הַמֶּלֶךְ
  english_pob_choice: bowed himself with his face to the ground before the king
  chosen_korean: 왕 앞에서 얼굴을 땅에 대고 엎드려 절하자
  alternatives_korean:
  - 왕 앞에서 얼굴을 땅에 대고 절하자
  - 왕 앞에 엎드려 얼굴을 땅에 대자
  lexicon: HALOT
  rationale: ‘엎드려 절하다’는 שחה와 자세 묘사를 함께 살리는 한국어 표현으로, 단순한 절보다 더 깊은 경배/예를 드러냅니다.
- source_word: וַיִּשַּׁק הַמֶּלֶךְ לְאַבְשָׁלוֹם
  english_pob_choice: the king kissed Absalom
  chosen_korean: 왕이 압살롬에게 입을 맞추었습니다
  alternatives_korean:
  - 왕이 압살롬에게 입맞춤했습니다
  - 왕이 압살롬에게 입을 맞추어 주었습니다
  lexicon: HALOT
  rationale: נשק을 문자적으로 옮겨, 본문이 말하는 행동 자체를 보존했습니다. 한국어에서는 ‘입을 맞추다’가 가장 सीधे 대응됩니다.
theological_decisions:
- issue: 왕의 입맞춤이 의미하는 바
  chosen_reading: 본문이 말하는 행동만 제시하고, 화해나 회복의 의미는 본문 밖의 해석으로 남겼습니다.
  alternative_readings:
  - 화해의 표시로 옮김
  - 왕의 호의 회복으로 명시
  rationale: 히브리어 본문은 단지 왕이 압살롬에게 입을 맞추었다고만 말하므로, 해석을 본문에 앞세우지 않고 긴장을 보존했습니다.
  doctrine_reference: '서술의 절제: 본문이 직접 말하지 않는 의미를 단정하지 않음'
