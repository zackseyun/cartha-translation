base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/031.yaml
  text: Then Joab arose and went to Absalom’s house and said to him[a], “Why have your servants set my field on fire?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''the plot of land that belongs to me with fire.'' English idiom renders this as ''my field on fire.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요압이 일어나 압살롬의 집으로 가서 그에게 말했습니다. “왜 당신의 종들이 내 밭에 불을 질렀습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: Then Joab arose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어났습니다
  - 벌떡 일어나
  lexicon: HALOT
  rationale: 서술 진행을 나타내는 wayyiqtol을 한국어 자연문으로 옮기되, 과도하게 문어적인 “아로되”류를 피하고 장면 전환의 동작을 분명히 드러냅니다.
- source_word: וַיָּבֹא אֶל אַבְשָׁלוֹם הַבָּיְתָה
  english_pob_choice: went to Absalom’s house
  chosen_korean: 압살롬의 집으로 가서
  alternatives_korean:
  - 압살롬에게로 집에 가서
  - 압살롬의 집 안으로 가서
  lexicon: HALOT
  rationale: 방향형 어미가 있는 ‘집으로’가 목적지를 자연스럽게 살리며, 문맥상 압살롬의 거처를 가리키므로 ‘집’으로 풀었습니다.
- source_word: הִצִּיתוּ
  english_pob_choice: have ... set ... on fire
  chosen_korean: 불을 질렀습니까
  alternatives_korean:
  - 태웠습니까
  - 불태웠습니까
  lexicon: HALOT
  rationale: 히필의 사동적 의미를 살려 단순한 ‘타다’보다 ‘불을 지르다’가 원문의 행위성을 더 직접적으로 반영합니다.
- source_word: עֲבָדֶךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들이
  alternatives_korean:
  - 당신의 노예들이
  - 당신의 일꾼들이
  lexicon: HALOT
  rationale: 이 절의 궁정 대화에서는 사회적 소속을 나타내는 일반적 ‘종’이 가장 자연스럽고, POB의 ‘servants’ 선택도 이를 뒷받침합니다.
- source_word: הַחֶלְקָה אֲשֶׁר לִי
  english_pob_choice: my field
  chosen_korean: 내 밭
  alternatives_korean:
  - 내 소유의 밭
  - 내 땅
  lexicon: HALOT
  rationale: חֶלְקָה를 한국어의 짧고 통용되는 ‘밭’으로 옮기되, 뒤의 소유 관계를 ‘내’로 압축해 원문의 의미를 유지합니다.
