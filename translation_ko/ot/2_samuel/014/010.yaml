  text: And the king said[a], “Whoever speaks to you, bring him to me, and he will never touch you again.”
  footnotes:
  - marker: a
    text: Or 'he will no longer touch you'; the Hebrew idiom may imply hostile contact or harm, not merely physical touch.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 말씀하셨습니다. “그대에게 말하는 사람이 있으면 그를 내게 데려오십시오. 그러면 그는 더 이상 그대에게 손대지 않을 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 직역하면 ‘그가 더 이상 그대에게 손대는 일을 계속하거나 되풀이하지 않을 것이다’라는 뜻입니다. 여기서 ‘손대다’는 단순한 신체 접촉뿐 아니라 문맥상 해치거나 괴롭히는 행위를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 임금
  lexicon: HALOT
  rationale: 히브리어 정관사 붙은 מֶלֶךְ을 자연스럽게 옮기되, 현대 한국어에서는 문맥상 ‘왕’이 가장 직접적입니다.
- source_word: הַמְדַבֵּר אֵלַיִךְ
  english_pob_choice: whoever speaks to you
  chosen_korean: 누구든지 당신에게 말하는 사람
  alternatives_korean:
  - 당신에게 말하는 자
  - 당신에게 말하는 이
  lexicon: HALOT
  rationale: 분사구문이 실질적으로 ‘~하는 사람’의 뜻이므로, 열린 범위를 드러내는 ‘누구든지’로 옮겼습니다.
- source_word: וַהֲבֵאתוֹ אֵלַי
  english_pob_choice: bring him to me
  chosen_korean: 그를 내게 데려오십시오
  alternatives_korean:
  - 그를 내게 데려오고
  - 그를 내게 가져오십시오
  lexicon: HALOT
  rationale: הֵבִיא의 사역적 의미는 한국어에서 ‘데려오다’가 가장 자연스럽고, 왕의 직접 명령이므로 존대 명령형으로 옮겼습니다.
- source_word: לֹא יֹסִיף עוֹד לָגַעַת בָּךְ
  english_pob_choice: he will never touch you again
  chosen_korean: 다시는 당신에게 손대지 못할 것입니다
  alternatives_korean:
  - 더는 당신에게 손대지 않을 것입니다
  - 다시는 당신을 만지지 않을 것입니다
  lexicon: HALOT
  rationale: ‘לא יוסיף עוד’의 반복 금지와 ‘לגעת’의 문맥상 해로운 접촉을 함께 살려, 문자적 ‘만지다’보다 한국어에서 함의가 드러나는 ‘손대다’를 택했습니다.
theological_decisions:
- issue: ‘touch’의 의미를 단순 신체 접촉으로 제한할지 여부
  chosen_reading: 문맥상 보호적 판결이므로 ‘손대다’로 옮겨 해로운 접촉 금지를 드러냈습니다.
  alternative_readings:
  - 그는 다시는 당신을 만지지 못할 것입니다
  - 그는 다시는 당신에게 접촉하지 못할 것입니다
  rationale: 이 절의 נגע는 단순 촉각보다 공격적·해로운 접촉의 가능성을 띠므로, 한국어에서도 그 함의를 보존하는 번역이 필요합니다.
  doctrine_reference: 서술문 맥락과 어휘 의미 범위
