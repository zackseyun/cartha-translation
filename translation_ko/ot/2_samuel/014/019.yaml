  source_fidelity: 초안은 요압의 관여, 맹세 공식, 왕의 말에서 벗어날 수 없다는 표현, 요압이 여인의 발화를 지시했다는 핵심을 대체로 담고 있습니다. 그러나 ‘요압의 손이 이 모든 일과 함께 있습니까?’는 히브리어의 관여 관용구를 한국어에서 부자연스럽게 직역하여 뜻이 불분명합니다. 또한 ‘왕이신 저의 주의 생명’은 호격과 소유 관계가 어색하며, ‘왕의 여종’은 발화자인 여인의 자기지칭임을 더 명확히 해야 합니다.
