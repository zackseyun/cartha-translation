  rationale: 히브리어 관용구를 기계적으로 직역하지 않고 한국어에서 뜻이 분명한 표현으로 옮겼습니다. 맹세 공식과 방향 관용구는 본문과 각주를 함께 사용하여 원문의 어법과 의미를 보존했습니다. 여인의 궁정적 자기낮춤과 요압의 지시·대리 발화라는 관계도 유지했습니다.
