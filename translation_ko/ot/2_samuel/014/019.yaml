revisions:
- from: 그때 왕이 물었습니다. 「요압의 손이 이 모든 일과 함께 있습니까?」 그러자 여인이 대답하며 말했습니다. 「왕이신 저의 주의 생명이 살아 계신 것처럼, 저의 주 왕께서 말씀하신 것에서 오른쪽으로도 왼쪽으로도 빗나갈 수 있는 사람은 없습니다. 왕의 종 요압이 저에게 명령하였고, 그가 이 모든 말을 왕의 여종의 입에 넣었습니다.」[a][b]
