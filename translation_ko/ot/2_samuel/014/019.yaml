base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/019.yaml
  text: Then the king said[a], “Is the hand of Joab with you in all this?” And the woman answered and said, “As your soul lives, my lord the king, no one can turn to the right or to the left from anything that my lord the king has spoken, for your servant Joab himself commanded me[b], and he himself put all these words into the mouth of your female servant.”
  footnotes:
  - marker: a
    text: Or, “As surely as you live, my lord the king.” The Hebrew oath formula is literally, “As your soul lives.”
    reason: lexical_alternative
  - marker: b
    text: The expression “turn to the right or to the left” is a Hebrew idiom meaning to deviate from, contradict, or evade what the king has said.
    reason: cultural_note
translation:
  language: ko
  text: 그때 왕이 말했습니다. “이 모든 일에 요압이 관여했습니까?” 그러자 그 여인이 대답했습니다. “왕이신 제 주님, 당신의 생명이 살아 계심을 두고 맹세합니다.[a] 제 주 왕께서 말씀하신 모든 것에서 오른쪽으로도 왼쪽으로도 벗어날 사람은 없습니다.[b] 왕의 신하 요압이 저에게 명령했고, 그가 이 모든 말을 왕의 여종인 제 입에 넣었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 “당신의 영혼이 살아 있음으로”입니다. 왕의 생명을 두고 하는 맹세 공식입니다.
    reason: source_note
  - marker: b
    text: “오른쪽으로도 왼쪽으로도 벗어나다”는 왕이 말한 바에서 벗어나거나, 그것을 반박하거나 회피할 수 없다는 뜻의 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הֲיָד ... אִתָּךְ
  english_pob_choice: Is the hand of Joab with you
  chosen_korean: “요압의 손이 이 모든 일과 함께 있습니까?”
  alternatives_korean:
  - “요압이 이 일에 관여하고 있습니까?”
  - “요압이 당신과 함께 이 일을 꾸몄습니까?”
  lexicon: HALOT
  rationale: 히브리어의 ‘손’은 행위·관여·주도권을 가리킬 수 있으므로, 직역 이미지를 살리되 한국어에서는 의미가 드러나도록 유지했습니다.
- source_word: חֵי נַפְשְׁךָ
  english_pob_choice: As your soul lives
  chosen_korean: “왕이신 저의 주의 생명이 살아 계신 것처럼”
  alternatives_korean:
  - “왕이신 저의 주님의 생명이 살아 계신 것처럼”
  - “왕의 생명으로 맹세합니다”
  lexicon: HALOT
  rationale: 히브리어의 맹세 공식인 ‘네 영혼이 살아 있음’을 한국어에서 자연스럽게 옮기면서도, 원문의 형식을 지나치게 평문화하지 않았습니다.
- source_word: אִם אִישׁ לְהֵמִין וּלְהַשְׂמִיל
  english_pob_choice: no one can turn to the right or to the left
  chosen_korean: “오른쪽으로도 왼쪽으로도 빗나갈 수 있는 사람은 없습니다”
  alternatives_korean:
  - “오른쪽이나 왼쪽으로도 돌이킬 수 있는 사람은 없습니다”
  - “오른쪽으로도 왼쪽으로도 치우칠 수 있는 사람은 없습니다”
  lexicon: HALOT
  rationale: 방향 관용구를 유지하되, 왕의 말을 벗어나지 못한다는 뜻이 한국어에서 분명히 드러나도록 ‘빗나가다’를 선택했습니다.
- source_word: שִׁפְחָתְךָ
  english_pob_choice: your female servant
  chosen_korean: “왕의 여종의 입에”
  alternatives_korean:
  - “왕의 여자 종의 입에”
  - “왕의 여종의 입에”
  lexicon: HALOT
  rationale: 여성형 종을 뜻하는 표현을 한국어의 자연스러운 관용인 ‘여종’으로 옮겨 성별 정보를 보존했습니다.
theological_decisions:
- issue: 궁정적 자기 호칭에서의 낮춤 표현
  chosen_reading: 여인은 자신을 ‘왕의 여종’으로 낮춰, 요압이 시킨 말을 그대로 전하는 입장임을 분명히 했습니다.
  alternative_readings:
  - 단순히 ‘종’으로 옮겨 성별 표지를 약화시키는 읽기
  - 완화하여 ‘시종’처럼 궁정 예법만 강조하는 읽기
  rationale: 이 장면은 왕 앞에서의 극도의 종속성과 대리 발화를 드러내므로, 본문의 사회적 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: 서술 문맥의 화자-청자 관계와 고대 근동 궁정 예법
