base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/017.yaml
  text: Then your servant said[a], ‘Please let the word of my lord the king bring rest, for my lord the king is like the angel of God, to hear the good and the evil[b]. And may Yahweh your God be with you.’
  footnotes:
  - marker: a
    text: Or 'like an angel of God'; the Hebrew phrase could also be understood more broadly as 'like a messenger of God.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'to hear the good and the evil,' an idiom for discerning or judging between good and evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 당신의 여종이 말했습니다[a]. ‘청하오니, 내 주 왕의 말씀이 편안함이 되게 하십시오. 내 주 왕은 하나님의 천사와 같아서 선과 악을 들으십니다[b]. 그리고 야훼 당신의 하나님이 당신과 함께 계시기를 바랍니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 천사처럼’; 히브리어 표현은 더 넓게 ‘하나님의 사자처럼’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘선과 악을 듣는 것’이며, 선악을 분별하거나 판결하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחָתְךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 여종
  alternatives_korean:
  - 당신의 종
  - 당신의 시녀
  - 당신의 여자 종
  lexicon: HALOT
  rationale: 히브리어는 여성 종을 가리키지만, 이 왕 앞의 겸손한 청원에서는 ‘여종’이 성별과 신분을 함께 드러내며 자연스럽습니다.
- source_word: יִהְיֶה נָּא דְּבַר אֲדֹנִי הַמֶּלֶךְ לִמְנוּחָה
  english_pob_choice: Please let the word of my lord the king bring rest
  chosen_korean: 청하오니, 내 주 왕의 말씀이 편안함이 되게 하십시오
  alternatives_korean:
  - 청하오니, 내 주 왕의 말씀이 안식이 되게 하십시오
  - 부디 내 주 왕의 말씀이 쉼이 되게 하십시오
  - 내 주 왕의 말씀이 안정이 되게 하십시오
  lexicon: HALOT
  rationale: דָּבָר는 여기서 왕의 판결/말씀을 가리키고, לִמְנוּחָה는 상황을 진정시키는 ‘편안함/안정’의 뜻이므로, 직역과 문맥을 함께 살려 옮겼습니다.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  english_pob_choice: like the angel of God
  chosen_korean: 하나님의 천사와 같아서
  alternatives_korean:
  - 하나님의 사자와 같아서
  - 하나님의 메신저와 같아서
  - 하나님의 천사처럼
  lexicon: HALOT
  rationale: 문맥상 왕의 분별력을 높이는 비교 표현이므로 ‘천사’를 기본으로 하되, 한국어 흐름을 위해 ‘~와 같아서’로 연결했습니다.
- source_word: לִשְׁמֹעַ הַטּוֹב וְהָרָע
  english_pob_choice: to hear the good and the evil
  chosen_korean: 선과 악을 들으십니다
  alternatives_korean:
  - 선과 악을 들으실 수 있습니다
  - 선과 악을 분별하십니다
  - 선과 악을 들어 판단하십니다
  lexicon: HALOT
  rationale: 직역하면 ‘선과 악을 듣다’이지만, 히브리어 관용구의 재판적 의미를 살려 ‘듣다’를 유지하면서 한국어에서는 판단의 기능이 드러나도록 했습니다.
