review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 ‘그러니 이제’는 히브리어의 순차적 접속을 넘어 인과관계와 시간적 강조를 더합니다. ‘그런 다음’은 지시의 순서를 자연스럽게 나타냅니다. 마지막 절의 ‘입에 ... 넣다’는 원문의 의도적인 관용 표현을 보존하되, ‘그 말들’을 사용하여 특정한 발화 내용을 가리키게 하는 편이 낫습니다.
  naturalness: ‘왕께 가서 이렇게 말씀드리십시오’는 왕을 향한 발화라는 뜻을 자연스럽고 현대적인 합쇼체로 드러냅니다. ‘그녀의 입에 그 말들을 넣었습니다’는 다소 직역적인 표현이지만, 원문의 비유를 보존하기 위해 적절하며 주석으로 뜻을 풀이합니다.
  terminology: ‘요압’은 통용되는 인명 표기입니다. 왕에게 말하는 장면에는 ‘왕께’와 ‘말씀드리십시오’를 사용해 존대의 방향을 자연스럽게 반영했습니다. 주석 표지는 실제로 설명하는 관용구에 붙였습니다.
  issues:
