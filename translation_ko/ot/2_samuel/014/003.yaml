translation:
  language: ko
  text: 그런 다음 왕께 가서 이렇게 말씀드리십시오. 요압은 그녀의 입에 그 말들을 넣었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그녀의 입에 그 말들을 넣다’는 관용구로, 요압이 그녀가 말할 내용을 일러 주었다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאת אֶל הַמֶּלֶךְ
  english_pob_choice: Then go to the king
  chosen_korean: 그러니 이제 왕에게 가서
  alternatives_korean:
  - 그리고 왕에게 가십시오
  - 그러면 왕에게 가십시오
  lexicon: HALOT
  rationale: 문맥상 명령형/지시형 연속이므로, 한국어에서는 순서를 이끄는 ‘그러니 이제’와 함께 자연스럽게 지시했습니다.
- source_word: וְדִבַּרְתְּ אֵלָיו
  english_pob_choice: and speak to him
  chosen_korean: 이렇게 말하십시오
  alternatives_korean:
  - 그에게 말하십시오
  - 그에게 이야기하십시오
  lexicon: HALOT
  rationale: דבר עם/אל의 기본 의미를 살리되, 이어지는 인용문을 바로 받는 말하기 동사를 현대 한국어로 간결하게 옮겼습니다.
- source_word: כַּדָּבָר הַזֶּה
  english_pob_choice: in this way
  chosen_korean: 이렇게
  alternatives_korean:
  - 이 말대로
  - 이런 식으로
  lexicon: HALOT
  rationale: 지시적 표현으로서 말의 내용과 형식을 함께 가리키므로, ‘이렇게’가 가장 자연스럽고 축자적 부담이 적습니다.
- source_word: וַיָּשֶׂם יוֹאָב אֶת הַדְּבָרִים בְּפִיהָ
  english_pob_choice: And Joab put the words in her mouth.
  chosen_korean: 요압이 그녀의 입에 말들을 넣었습니다.
  alternatives_korean:
  - 요압이 그녀의 입에 그 말들을 넣었습니다
  - 요압이 그녀가 할 말을 정해 주었습니다
  lexicon: HALOT
  rationale: ‘입에 말을 넣다’는 히브리어 관용구를 그대로 살려, 요압이 정확한 발화를 제공했다는 점을 드러냈습니다.
theological_decisions:
- issue: 히브리어 관용구 ‘말들을 입에 넣다’의 보존 여부
  chosen_reading: 직역에 가까운 ‘그녀의 입에 말들을 넣었습니다’로 유지했습니다.
  alternative_readings:
  - ‘그녀에게 할 말을 정해 주었습니다’
  - ‘그녀에게 말할 내용을 일러 주었습니다’
  rationale: 본문은 단순한 조언이 아니라 조작된 발화를 뜻하므로, 관용구의 생동감과 통제성을 함께 보존하는 쪽이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: 본문의 서술 의도와 담화적 뉘앙스
