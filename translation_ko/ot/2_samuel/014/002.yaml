base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/002.yaml
  text: So Joab sent to Tekoa and took from there a wise woman[a], and he said to her, “Please pretend to be mourning, and please put on mourning clothes, and do not anoint yourself with oil[d][c][b], but be like a woman who has been mourning for the dead many days.”
  footnotes:
  - marker: a
    text: Or, “Please mourn” / “Please act as a mourner.” The Hebrew verb means “mourn,” but the narrative context shows Joab is instructing her to assume mourning as part of a planned presentation.
    reason: lexical_alternative
  - marker: b
    text: Literally, “garments of mourning.”
    reason: lexical_alternative
  - marker: c
    text: Abstaining from oil was a customary sign of grief rather than normal grooming and festivity.
    reason: cultural_note
  - marker: d
    text: Literally, “like a woman mourning over the dead many days.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 요압은 드고아에 사람을 보내어 그곳에서 지혜로운 여자 한 사람을 데려왔습니다. 그리고 그 여자에게 말했습니다. “부디 애도하는 체하십시오.[a] 상복을 입으십시오.[b] 기름을 바르지 마십시오.[c] 그리고 여러 날 동안 죽은 이를 애도해 온 여자처럼 보이십시오.[d]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사의 기본 뜻은 “애도하다”입니다. 그러나 서술 문맥은 요압이 계획된 연출을 지시하고 있음을 보여 줍니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “애도의 옷들”입니다.
    reason: lexical_alternative
  - marker: c
    text: 기름을 바르지 않는 것은 평상시의 몸단장을 삼가는 애도의 관습적 표지였습니다.
    reason: cultural_note
  - marker: d
    text: 직역하면 “여러 날 동안 죽은 이를 애도하는 여자처럼”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקוֹעָה
  english_pob_choice: Tekoa
  chosen_korean: 드고아
  alternatives_korean:
  - 데고아
  - 드코아
  lexicon: 표준 음역 관행
  rationale: 고유명사는 번역하지 않고 음역하되, 한국어 성경에서 통용되는 형태인 드고아를 따랐습니다.
- source_word: אִשָּׁה חֲכָמָה
  english_pob_choice: a wise woman
  chosen_korean: 한 지혜로운 여자
  alternatives_korean:
  - 한 슬기로운 여자
  - 한 간교한 여자
  lexicon: HALOT
  rationale: חֲכָמָה는 문맥상 단순한 지식보다 분별력과 능숙함을 함께 가리킬 수 있으므로, 본문이 요구하는 인물의 자질을 살려 지혜로운 여자로 옮겼습니다.
- source_word: הִתְאַבְּלִי נָא
  english_pob_choice: Please pretend to be mourning
  chosen_korean: 부디 애도하는 사람처럼 지내고
  alternatives_korean:
  - 부디 슬퍼하는 체하고
  - 부디 애도하십시오
  lexicon: HALOT
  rationale: 동사 자체는 ‘애도하다’이지만, 문맥상 요압이 의도된 연출을 지시하므로 행위의 역할을 드러내는 표현으로 옮겼습니다.
- source_word: בִגְדֵי אֵבֶל
  english_pob_choice: mourning clothes
  chosen_korean: 상복
  alternatives_korean:
  - 애도 옷
  - 애도하는 옷
  lexicon: HALOT
  rationale: 히브리어 관용구의 문화적 의미를 자연스럽게 전달하는 한국어 표현으로 상복을 선택했습니다.
- source_word: וְאַל תָּסוּכִי שֶׁמֶן
  english_pob_choice: do not anoint yourself with oil
  chosen_korean: 기름을 바르지 마십시오
  alternatives_korean:
  - 몸에 기름을 바르지 마십시오
  - 기름으로 도유하지 마십시오
  lexicon: HALOT
  rationale: 여기서의 סוך은 몸에 기름을 바르는 일상적 몸단장을 가리키므로, 애도 표지로서의 금지를 분명히 하는 자연스러운 표현을 택했습니다.
- source_word: מִתְאַבֶּלֶת עַל מֵת
  english_pob_choice: who has been mourning for the dead
  chosen_korean: 오랫동안 죽은 사람을 위해 슬퍼해 온 여자처럼
  alternatives_korean:
  - 죽은 이를 위해 오래 슬퍼해 온 여자처럼
  - 많은 날 동안 애도해 온 여자처럼
  lexicon: HALOT
  rationale: משך הזמן을 드러내는 ‘많은 날들’의 의미를 살리면서, עַל מֵת의 일반적·관용적 용법을 한국어로 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: 요압의 지시가 실제 애도인지 연기인지
  chosen_reading: 본문은 실제 상실의 애도가 아니라, 요압이 준비한 연출로서의 애도 상태를 꾸미게 하는 지시로 읽었습니다.
  alternative_readings:
  - 그냥 애도하라는 단순 지시
  - 애도하는 척하라는 노골적 번역
  rationale: 서술 흐름 전체가 계획된 접근과 설득을 위한 장치이므로, 한국어에서도 의도된 역할 수행임을 드러내는 것이 본문 의미를 더 정확히 전달합니다.
  doctrine_reference: 서사 문맥에 근거한 의미 해석
- issue: 문장 종결의 공손도
  chosen_reading: 요압의 직접 발화는 명령형이지만, 한국어 합쇼체를 유지하되 공손한 명령형으로 처리했습니다.
  alternative_readings:
  - 반말형 명령
  - 더 전통적인 종결어미
  rationale: 출판용 현대 한국어 본문 스타일을 유지하면서도, 인물 간 위계와 지시의 성격을 흐리지 않기 위한 선택입니다.
  doctrine_reference: 번역체계상 문체 결정
