revisions:
- from: 그리하여 요압은 드고아로 사람을 보내어, 거기에서 한 지혜로운 여자를 데려오고는 그 여자에게 말했습니다. "부디 애도하는 사람처럼 지내고, 부디 상복을 입고, 기름을 바르지 마십시오. 그리고 오랫동안 죽은 사람을 위해 슬퍼해 온 여자처럼 되십시오."[a][b][c][d]
  to: 그리하여 요압은 드고아에 사람을 보내어 그곳에서 지혜로운 여자 한 사람을 데려왔습니다. 그리고 그 여자에게 말했습니다. “부디 애도하는 체하십시오.[a] 상복을 입으십시오.[b] 기름을 바르지 마십시오.[c] 그리고 여러 날 동안 죽은 이를 애도해 온 여자처럼 보이십시오.[d]”
  rationale: 문맥이 요구하는 가장 적은 범위에서 계획된 가장(假裝)의 성격을 자연스러운 한국어로 드러내고, 마지막 비교 표현을 대상의 외양을 지시하는 말로 다듬었습니다. 또한 각주 표지를 해당 어구에 연결했습니다. 본문의 불특정한 '죽은 이'와 지속적인 애도 상태는 유지했습니다.
