base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/022.yaml
  text: Then Joab fell with his face to the ground[a], bowed down, and blessed the king. Joab said, “Today your servant knows that I have found favor in your eyes, my lord the king, because the king has done the word of his servant.”
  footnotes:
  - marker: a
    text: Literally, 'has done the word of his servant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요압이 얼굴을 땅에 대고 엎드려 절하고 왕에게 복을 빌었습니다. 요압이 말했습니다. “오늘 왕의 종인 저는 내 주 왕의 눈에 호의를 얻었음을 알게 되었습니다. 왕께서 왕의 종이 드린 요청을 들어주셨기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “왕께서 자신의 종의 말을 행하셨기 때문입니다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל ... אֶל פָּנָיו אַרְצָה
  english_pob_choice: fell with his face to the ground
  chosen_korean: 얼굴을 땅에 대고 엎드려
  alternatives_korean:
  - 얼굴을 땅에 대고 넘어져
  - 얼굴을 땅에 대고 엎드렸습니다
  lexicon: HALOT
  rationale: 히브리어 관용구가 가리키는 몸짓을 자연스러운 현대 한국어로 옮기되, 얼굴이 땅을 향한 자세를 보존했습니다.
- source_word: וַיִּשְׁתַּחוּ
  english_pob_choice: bowed down
  chosen_korean: 절한 뒤
  alternatives_korean:
  - 몸을 굽혀
  - 경배한 뒤
  lexicon: HALOT
  rationale: 인간 왕 앞에서의 공손한 경의를 나타내므로, 예배적 뉘앙스를 과하게 주지 않는 ‘절하다’로 옮겼습니다.
- source_word: וַיְבָרֶךְ אֶת הַמֶּלֶךְ
  english_pob_choice: blessed the king
  chosen_korean: 왕에게 복을 빌었습니다
  alternatives_korean:
  - 왕을 축복했습니다
  - 왕을 찬송했습니다
  lexicon: HALOT
  rationale: 인간 대상에 대한 ברך는 문맥상 축복의 선언/기원을 뜻하므로, 한국어에서도 ‘복을 빌다’로 자연스럽게 살렸습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 신하
  lexicon: HALOT
  rationale: 왕 앞의 겸양 표현이므로 기본값인 ‘종’을 사용했습니다. ‘신하’는 한국어 궁정어 느낌이 강해 본문의 일반적 종속성을 약화시킬 수 있습니다.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  english_pob_choice: I have found favor in your eyes
  chosen_korean: 제가 왕의 눈에 은총을 입었다는 것
  alternatives_korean:
  - 왕의 눈에 호의를 얻었다는 것
  - 왕께 은총을 받았다는 것
  lexicon: HALOT
  rationale: 히브리어 관용구의 이미지인 ‘눈에’와 POB의 ‘favor’를 함께 살리면서, 한국어에서는 ‘은총을 입다’로 자연스럽게 표현했습니다.
- source_word: עָשָׂה ... אֶת דְּבַר עַבְדּוֹ
  english_pob_choice: has done the word of his servant
  chosen_korean: 자신의 종의 말을 그대로 행하셨기 때문입니다
  alternatives_korean:
  - 자신의 종의 말을 행하셨기 때문입니다
  - 자신의 종의 말을 실행하셨기 때문입니다
  lexicon: HALOT
  rationale: 직역의 ‘종의 말을 하다/행하다’는 한국어에서 어색하므로, 본문의 의미를 해치지 않는 범위에서 ‘말을 그대로 행하다’로 옮겼습니다.
theological_decisions:
- issue: 인간 왕 앞에서의 절함과 복 빌기의 성격
  chosen_reading: 왕에 대한 궁정적 경의로 이해하고, 예배나 신적 숭배로 읽히지 않게 했습니다.
  alternative_readings:
  - 왕을 예배하다
  - 왕에게 경배하다
  rationale: 본문은 정치적·궁정적 존경 표현을 묘사하므로, 신앙적 예배 용어를 쓰면 의미가 과도하게 확대됩니다.
  doctrine_reference: 본문 문맥의 역사서 서술과 인간 왕에 대한 예우 구분
