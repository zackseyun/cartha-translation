revisions:
- from: 그때 요압이 얼굴을 땅에 대고 엎드려 절한 뒤 왕에게 복을 빌었습니다. 요압이 말했습니다. “오늘 당신의 종은 제가 왕의 눈에 은총을 입었다는 것을 압니다. 내 주 왕이여, 왕께서 자신의 종의 말을 그대로 행하셨기 때문입니다.”[a]
  to: 그때 요압이 얼굴을 땅에 대고 엎드려 절하고 왕에게 복을 빌었습니다. 요압이 말했습니다. “오늘 왕의 종인 저는 내 주 왕의 눈에 호의를 얻었음을 알게 되었습니다. 왕께서 왕의 종이 드린 요청을 들어주셨기 때문입니다.”[a]
  rationale: 원문의 ‘엎드림—절함—왕에게 복을 빎’이라는 세 동작을 유지했습니다. 왕 앞에서 자신을 낮추는 עַבְדְּךָ는 ‘왕의 종인 저는’으로 자연스럽게 처리했고, מָצָאתִי חֵן בְּעֵינֶיךָ는 왕의 호의를 얻었다는 뜻으로 옮겼습니다. 마지막 구절은 문맥상 요청을 들어준 행위이므로 본문에서는 자연스럽게 번역하되, 히브리어의 문자적 표현은 해당 절 끝의 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:37:13Z'
review_pass:
  verdict: revise
  source_fidelity: 대체로 원문의 동작 연쇄와 궁정적 경의 표현을 충실히 옮겼습니다. 다만 마지막 절의 ‘그대로’는 히브리어에 없는 강조이며, ‘종의 말’은 문맥상 왕이 들어 준 요청을 가리키므로 자연스러운 본문 번역과 직역 각주로 처리하는 편이 더 정확합니다.
  naturalness: ‘당신의 종은 제가’는 동일한 화자가 자신을 가리키는 방식이 겹쳐 어색하고, 왕을 향한 ‘당신’도 현대 한국어 궁정 발화로는 부자연스럽습니다. ‘왕의 종인 저는’ 및 ‘내 주 왕이여’로 정리하면 합쇼체의 격식과 화자 관계가 자연스럽습니다.
  terminology: ‘절하다’와 ‘왕에게 복을 빌다’는 인간 왕을 향한 궁정적 경의를 적절히 나타냅니다. ‘은총’도 가능하나 현대 일반 문맥에서는 ‘호의’를 사용하여 신학적 함의를 불필요하게 강하게 하지 않았습니다.
