  text: לְ/בַ/עֲב֤וּר סַבֵּב֙ אֶת פְּנֵ֣י הַ/דָּבָ֔ר עָשָׂ֛ה עַבְדְּ/ךָ֥ יוֹאָ֖ב אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/אדֹנִ֣/י חָכָ֗ם כְּ/חָכְמַת֙ מַלְאַ֣ךְ הָ/אֱלֹהִ֔ים לָ/דַ֖עַת אֶֽת כָּל אֲשֶׁ֥ר בָּ/אָֽרֶץ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/020.yaml
  text: In order to change the course of the matter[a], your servant Joab did this thing. But my lord is wise, with the wisdom of the angel of God[b], to know all that is in the land.
  footnotes:
  - marker: a
    text: Or 'turn the matter around' or 'alter the appearance of the matter.' The Hebrew idiom is literally 'change/turn the face of the matter.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all that is on the earth.' In context, 'the land' likely refers to the realm or country rather than the whole world.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일의 양상을 바꾸려고[a] 왕의 종 요압이 이 일을 하였습니다. 그러나 내 주께서는 하나님의 천사가 지닌 지혜처럼 지혜로우셔서, 이 땅에 있는 모든 것을[b] 아십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 일의 얼굴을 돌이키려고’입니다. 히브리어 관용구는 문자적으로 ‘일의 얼굴을 돌리다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅 위에 있는 모든 것’입니다. 문맥상 여기서 ‘땅’은 온 세상보다 나라나 영토를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
