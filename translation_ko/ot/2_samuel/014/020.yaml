  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/בַ/עֲב֤וּר סַבֵּב֙ אֶת פְּנֵ֣י הַ/דָּבָ֔ר עָשָׂ֛ה עַבְדְּ/ךָ֥ יוֹאָ֖ב אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/אדֹנִ֣/י חָכָ֗ם כְּ/חָכְמַת֙ מַלְאַ֣ךְ הָ/אֱלֹהִ֔ים לָ/דַ֖עַת אֶֽת כָּל אֲשֶׁ֥ר בָּ/אָֽרֶץ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/020.yaml
  text: In order to change the course of the matter[a], your servant Joab did this thing. But my lord is wise, with the wisdom of the angel of God[b], to know all that is in the land.
  footnotes:
  - marker: a
    text: Or 'turn the matter around' or 'alter the appearance of the matter.' The Hebrew idiom is literally 'change/turn the face of the matter.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all that is on the earth.' In context, 'the land' likely refers to the realm or country rather than the whole world.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일의 얼굴을 돌이키기 위해 당신의 종 요압이 이 일을 행하였습니다. 그러나 내 주께서는 하나님의 천사와 같은 지혜로, 땅에 있는 모든 것을 아는 지혜로운 분이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 일의 양상을 바꾸기 위해’, ‘이 일의 얼굴을 돌려놓기 위해’라는 뜻일 수 있습니다. 히브리어 관용구는 문자적으로 ‘일의 얼굴을 바꾸다/돌리다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅에 있는 모든 것’입니다. 문맥상 여기서 ‘땅’은 온 세상보다 나라나 영토를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַעֲבוּר סַבֵּב אֶת־פְּנֵי הַדָּבָר
  english_pob_choice: In order to change the face of the matter
  chosen_korean: 이 일의 얼굴을 돌이키기 위해
  alternatives_korean:
  - 이 일의 양상을 바꾸기 위해
  - 이 일의 본모습을 바꾸기 위해
  lexicon: HALOT
  rationale: 히브리어의 관용구인 ‘사물/일의 얼굴’을 살려 ‘얼굴을 돌이키다’로 옮겨, 사안을 다른 방향으로 보이게 하려는 의도를 드러냈습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 종이
  - 당신의 신하
  lexicon: HALOT
  rationale: 왕 앞의 겸양 표현으로서 ‘종’이 적절하며, ‘신하’보다 원문의 자기 낮춤을 더 직접적으로 보존합니다.
- source_word: מַלְאַךְ הָאֱלֹהִים
  english_pob_choice: the angel of God
  chosen_korean: 하나님의 천사
  alternatives_korean:
  - 하나님의 사자
  - 하나님의 천사들
  lexicon: HALOT
  rationale: 천사/사자 중에서 본문이 가리키는 초월적 지혜의 비교 대상을 한국어에서 가장 자연스럽게 드러내는 표준 표현을 택했습니다.
- source_word: כְּחָכְמַת
  english_pob_choice: with the wisdom of
  chosen_korean: …와 같은 지혜로
  alternatives_korean:
  - …의 지혜처럼
  - …에 버금가는 지혜로
  lexicon: HALOT
  rationale: 비교의 뜻을 분명히 하면서 한국어 문장 흐름에 맞게 ‘~와 같은 지혜로’로 옮겼습니다.
- source_word: כָּל אֲשֶׁר בָּאָרֶץ
  english_pob_choice: all that is in the land
  chosen_korean: 땅에 있는 모든 것
  alternatives_korean:
  - 그 땅에 있는 모든 것
  - 나라 안에 있는 모든 것
  lexicon: HALOT
  rationale: 원문은 지역적 ‘땅/나라’ 맥락도 가능하지만, 한국어 본문에서는 ‘땅에 있는 모든 것’으로 옮겨 포괄성을 유지하되, 필요 시 각주로 지역적 의미를 보완할 수 있게 했습니다.
theological_decisions:
- issue: ‘하나님의 천사’와의 비교가 갖는 수사적 범위
  chosen_reading: 다윗의 본성을 신격화하는 말이 아니라, 왕의 분별력을 극찬하는 비교 표현으로 유지했습니다.
  alternative_readings:
  - 다윗이 천사와 같은 초월적 인식을 가졌다는 과장법
  - 특정 천사를 가리키는 직설적 언급
  rationale: 본문의 궁정 수사와 비교문 구조를 따라, 과도한 신학적 확장 없이 지혜의 탁월함을 칭송하는 뜻을 살렸습니다.
  doctrine_reference: 비교 표현은 본문의 수사적 기능을 우선하며, 인물의 본질에 대한 형이상학적 주장으로 확대하지 않습니다.
