  rationale: 히브리어의 관용구인 ‘사물/일의 얼굴’을 살려 ‘얼굴을 돌이키다’로 옮겨, 사안을 다른 방향으로 보이게 하려는 의도를 드러냈습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 종이
  - 당신의 신하
  lexicon: HALOT
  rationale: 왕 앞의 겸양 표현으로서 ‘종’이 적절하며, ‘신하’보다 원문의 자기 낮춤을 더 직접적으로 보존합니다.
- source_word: מַלְאַךְ הָאֱלֹהִים
  english_pob_choice: the angel of God
  chosen_korean: 하나님의 천사
  alternatives_korean:
  - 하나님의 사자
  - 하나님의 천사들
  lexicon: HALOT
  rationale: 천사/사자 중에서 본문이 가리키는 초월적 지혜의 비교 대상을 한국어에서 가장 자연스럽게 드러내는 표준 표현을 택했습니다.
- source_word: כְּחָכְמַת
  english_pob_choice: with the wisdom of
  chosen_korean: …와 같은 지혜로
  alternatives_korean:
  - …의 지혜처럼
  - …에 버금가는 지혜로
  lexicon: HALOT
  rationale: 비교의 뜻을 분명히 하면서 한국어 문장 흐름에 맞게 ‘~와 같은 지혜로’로 옮겼습니다.
- source_word: כָּל אֲשֶׁר בָּאָרֶץ
  english_pob_choice: all that is in the land
  chosen_korean: 땅에 있는 모든 것
  alternatives_korean:
