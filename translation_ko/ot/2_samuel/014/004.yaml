base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/004.yaml
  text: Then the woman from Tekoa spoke to the king[a]. She fell with her face to the ground and bowed down, and she said, “Save me[b], O king!”
  footnotes:
  - marker: a
    text: Or, more literally, 'the Tekoite woman.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew ''Save, O king''; English idiom makes the implied object explicit: ''Save me, O king.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 드고아의 여인이 왕에게 말했습니다[a]. 그녀는 얼굴을 땅에 대고 엎드려 절하며, “왕이시여, 저를 구해 주십시오[b]!”라고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 더 문자적으로는 ‘드고아 사람 여인’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘구하소서, 왕이시여’에 가깝지만, 한국어에서는 청원의 대상을 분명히 하여 ‘저를 구해 주십시오’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקֹעִית
  english_pob_choice: the woman from Tekoa
  chosen_korean: 드고아의 여인
  alternatives_korean:
  - 드고아 사람 여인
  - 드고아 출신의 여인
  lexicon: HALOT
  rationale: 히브리어 형용사형 지시를 자연스러운 한국어 속격 구조로 옮겨, 출신지를 분명히 하면서도 문장을 매끄럽게 했습니다.
- source_word: וַתִּפֹּל עַל אַפֶּיהָ אַרְצָה
  english_pob_choice: She fell with her face to the ground
  chosen_korean: 얼굴을 땅에 대고 엎드려
  alternatives_korean:
  - 얼굴을 땅에 대고 엎드렸습니다
  - 얼굴을 땅에 박고
  lexicon: HALOT
  rationale: 직역의 경직함을 피하면서도 몸을 완전히 낮추는 자세라는 원문 이미지를 살리기 위해 ‘얼굴을 땅에 대고 엎드려’로 옮겼습니다.
- source_word: וַתִּשְׁתָּחוּ
  english_pob_choice: bowed down
  chosen_korean: 절하며
  alternatives_korean:
  - 엎드려 절하며
  - 경배하며
  lexicon: HALOT
  rationale: 문맥상 왕 앞의 간청에 따른 존대·예절의 몸짓이므로, 종교적 뉘앙스를 과도하게 띠는 ‘경배’보다 ‘절하다’가 더 적절합니다.
- source_word: הוֹשִׁיעָה
  english_pob_choice: Save me
  chosen_korean: 저를 구해 주십시오
  alternatives_korean:
  - 저를 구원해 주십시오
  - 저를 살려 주십시오
  lexicon: HALOT
  rationale: 동사의 핵심 의미는 구조·구출이므로, 한국어 청원 표현으로는 ‘구해 주십시오’가 가장 자연스럽고 긴박감을 잘 전달합니다.
- source_word: הַמֶּלֶךְ
  english_pob_choice: O king
  chosen_korean: 왕이시여
  alternatives_korean:
  - 임금님
  - 왕님
  lexicon: HALOT
  rationale: 직접 호칭의 정중함을 한국어 호격으로 살려, 현대 독자가 이해하기 쉬운 ‘왕이시여’를 선택했습니다.
theological_decisions:
- issue: 왕에게 드리는 간청의 화법과 예절 표현
  chosen_reading: 직접 화법은 ‘왕이시여’로 높임을 유지하고, 본문 서술은 합쇼체로 유지했습니다.
  alternative_readings:
  - ‘임금님’으로 더 구어적으로 옮김
  - 직접 호칭 없이 평서문으로 완화
  rationale: 히브리어 원문은 절박한 청원을 왕에게 드리는 장면이므로, 한국어에서도 경어를 유지해 관계의 위계와 간청의 긴장감을 보존했습니다.
  doctrine_reference: 출 20:12; 삼상 25장과 같은 왕 앞 청원 서술의 예절 맥락
