  chosen_reading: 직접 화법은 ‘왕이시여’로 높임을 유지하고, 본문 서술은 합쇼체로 유지했습니다.
  alternative_readings:
  - ‘임금님’으로 더 구어적으로 옮김
  - 직접 호칭 없이 평서문으로 완화
  rationale: 히브리어 원문은 절박한 청원을 왕에게 드리는 장면이므로, 한국어에서도 경어를 유지해 관계의 위계와 간청의 긴장감을 보존했습니다.
  doctrine_reference: 출 20:12; 삼상 25장과 같은 왕 앞 청원 서술의 예절 맥락
