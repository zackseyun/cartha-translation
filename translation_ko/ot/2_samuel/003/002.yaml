lexical_decisions:
- source_word: ו/ילדו לְ/דָוִד בָּנִים
  english_pob_choice: Sons were born to David
  chosen_korean: 다윗에게서 … 아들들이 태어났습니다
  alternatives_korean:
  - 다윗에게 아들들이 태어났습니다
