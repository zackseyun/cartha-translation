  - 헤브론에
  lexicon: WLC/HALOT
  rationale: 전치사 ב의 장소 표시는 한국어 조사 ‘-에서’가 가장 직접적이고 자연스럽습니다.
- source_word: בְכוֹר/וֹ
  english_pob_choice: his firstborn
  chosen_korean: 그의 맏아들
  alternatives_korean:
  - 그의 첫째 아들
  - 그의 장자
  lexicon: WLC/HALOT
  rationale: ‘맏아들’은 출생 순서를 드러내면서도 현대 한국어에서 자연스럽고, ‘장자’보다 덜 전통적·제도적입니다.
- source_word: לַ/אֲחִינֹעַם הַ/יִּזְרְעֵאלִת
  english_pob_choice: by Ahinoam the Jezreelitess
  chosen_korean: 아히노암이 낳은
  alternatives_korean:
  - 아히노암에게서 난
  - 아히노암의
  lexicon: WLC/HALOT
  rationale: 여기서 ל는 출산의 인적 매개를 가리키므로, 한국어에서는 관계를 분명히 하는 ‘-이 낳은’이 가장 분명합니다. ‘-의’는 모호하고, 단순히 ‘에게서 난’은 출생 주체성을 덜 드러냅니다.
