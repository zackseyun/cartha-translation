lexical_decisions:
- source_word: ו/ילדו לְ/דָוִד בָּנִים
  english_pob_choice: Sons were born to David
  chosen_korean: 다윗에게서 … 아들들이 태어났습니다
  alternatives_korean:
  - 다윗에게 아들들이 태어났습니다
  - 다윗에게서 아들들이 낳아졌습니다
  lexicon: WLC/HALOT
  rationale: 히브리어는 출생 사실을 사건적으로 진술하며, 주어를 낳은 사람보다 ‘아들들’의 출생에 둡니다. 한국어에서는 자연스러운 수동·사동 회피 표현인 ‘태어났습니다’가 이 문맥을 잘 살립니다.
- source_word: בְּ/חֶבְרוֹן
  english_pob_choice: in Hebron
  chosen_korean: 헤브론에서
  alternatives_korean:
  - 헤브론 안에서
  - 헤브론에
  lexicon: WLC/HALOT
  rationale: 전치사 ב의 장소 표시는 한국어 조사 ‘-에서’가 가장 직접적이고 자연스럽습니다.
- source_word: בְכוֹר/וֹ
  english_pob_choice: his firstborn
  chosen_korean: 그의 맏아들
  alternatives_korean:
  - 그의 첫째 아들
  - 그의 장자
  lexicon: WLC/HALOT
  rationale: ‘맏아들’은 출생 순서를 드러내면서도 현대 한국어에서 자연스럽고, ‘장자’보다 덜 전통적·제도적입니다.
- source_word: לַ/אֲחִינֹעַם הַ/יִּזְרְעֵאלִת
  english_pob_choice: by Ahinoam the Jezreelitess
  chosen_korean: 아히노암이 낳은
  alternatives_korean:
  - 아히노암에게서 난
  - 아히노암의
  lexicon: WLC/HALOT
  rationale: 여기서 ל는 출산의 인적 매개를 가리키므로, 한국어에서는 관계를 분명히 하는 ‘-이 낳은’이 가장 분명합니다. ‘-의’는 모호하고, 단순히 ‘에게서 난’은 출생 주체성을 덜 드러냅니다.
theological_decisions:
- issue: 2인칭/서술체의 문체가 아니라 족보·연대기적 서술을 어떻게 처리할지
  chosen_reading: 중립적 서술문으로 옮기되, 사건의 열거성과 순서를 유지했습니다.
  alternative_readings:
  - 더 설명적으로 풀어쓴 서술
  - 문어체의 고전적 족보식 표현
  rationale: 본문은 신학적 논설이 아니라 역사 서술이므로, 과장이나 해설 없이 간결하게 사실 진술의 톤을 살리는 것이 적절합니다.
  doctrine_reference: 서사 본문 번역 원칙
