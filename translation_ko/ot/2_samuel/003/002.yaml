  lexicon: WLC/HALOT
  rationale: 히브리어는 출생 사실을 사건적으로 진술하며, 주어를 낳은 사람보다 ‘아들들’의 출생에 둡니다. 한국어에서는 자연스러운 수동·사동 회피 표현인 ‘태어났습니다’가 이 문맥을 잘 살립니다.
- source_word: בְּ/חֶבְרוֹן
