  text: וְ/הִנֵּה֩ עַבְדֵ֨י דָוִ֤ד וְ/יוֹאָב֙ בָּ֣א מֵֽ/הַ/גְּד֔וּד וְ/שָׁלָ֥ל רָ֖ב עִמָּ֣/ם הֵבִ֑יאוּ וְ/אַבְנֵ֗ר אֵינֶ֤/נּוּ עִם דָּוִד֙ בְּ/חֶבְר֔וֹן כִּ֥י שִׁלְּח֖/וֹ וַ/יֵּ֥לֶךְ בְּ/שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/022.yaml
  text: And behold[a], David’s servants and Joab came in from a raid and brought much plunder with them. But Abner was not with David in Hebron, because he had sent him away[b], and he had gone in peace.
  footnotes:
  - marker: a
    text: Or 'from the raiding party.' The Hebrew גְּדוּד can refer to a troop or band; here 'raid' is chosen because the next clause mentions plunder.
    reason: lexical_alternative
  - marker: b
    text: Literally 'went in peace,' an idiom meaning he departed safely and on good terms.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 다윗의 종들과 요압이 약탈에서 돌아와 많은 전리품을 가지고 왔습니다. 그러나 아브넬은 헤브론에서 다윗과 함께 있지 않았으니, 다윗이 그를 보냈고 그가 평안히 떠났기[b] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘약탈대에서’. 히브리어 גְּדוּד는 부대나 무리를 가리킬 수 있으나, 여기서는 뒤의 전리품 언급 때문에 ‘약탈’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘평안히 갔다’입니다. 이는 안전하게, 그리고 좋은 관계 속에서 떠났다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제 보십시오
  lexicon: HALOT
  rationale: 서술을 새로 열어 주는 주의 환기 표현으로, 합쇼체에서 고어적인 '보라'보다 자연스럽고 직접적인 호소형 '보십시오'가 דְּיֵיק한 대응입니다.
- source_word: עַבְדֵי דָוִד
  english_pob_choice: David’s servants
  chosen_korean: 다윗의 종들
  alternatives_korean:
  - 다윗의 부하들
  - 다윗의 사람들
  - 다윗의 노예들
  lexicon: HALOT
  rationale: 여기서는 군사-궁정 맥락의 시종/종속자들을 가리키므로, POB의 'servants'를 따라 '종들'로 옮기되 '노예들'처럼 신분적 강도를 과도하게 드러내지 않았습니다.
- source_word: מֵהַגְּדוּד
  english_pob_choice: from a raid
  chosen_korean: 약탈에서
  alternatives_korean:
  - 습격대에서
  - 침략대에서
  - 약탈 부대에서
  lexicon: HALOT
  rationale: 뒤의 '많은 전리품'과 결합해 גְּדוּד를 단순한 '무리'보다 약탈 행위/원정의 맥락으로 이해하는 것이 자연스럽기 때문에 '약탈'로 압축했습니다.
- source_word: וְשָׁלָל רָב
  english_pob_choice: much plunder
  chosen_korean: 많은 전리품
  alternatives_korean:
  - 많은 노획물
  - 큰 노획물
  - 많은 전리품들
  lexicon: HALOT
  rationale: 전쟁·습격에서 얻은 물건을 가리키는 표준 의미를 살려 '전리품'을 택했고, רָב은 수량을 나타내는 '많은'으로 반영했습니다.
- source_word: כִּי שִׁלְּחוֹ ... וַיֵּלֶךְ בְּשָׁלוֹם
  english_pob_choice: because he had sent him away ... and he had gone in peace
  chosen_korean: 다윗이 그를 보내었고 그가 평안히 떠났기 때문입니다
  alternatives_korean:
  - 다윗이 그를 보내어 그가 평안히 갔기 때문입니다
  - 다윗이 그를 해산하여 그가 평안히 떠났기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구 '평안히 가다'는 단순한 심리 상태가 아니라 안전한 석별/무사한 귀가를 뜻하므로, '평안히 떠났습니다'로 옮겨 관계적·사건적 의미를 함께 살렸습니다.
theological_decisions:
- issue: וַיֵּלֶךְ בְּשָׁלוֹם의 관용성
  chosen_reading: 직역보다 '평안히 떠났습니다'로 옮겨, 무사한 석별과 좋은 관계의 뉘앙스를 함께 드러냈습니다.
  alternative_readings:
  - 평안히 갔습니다
  - 평화롭게 떠났습니다
  rationale: 이 표현은 단순히 '평화로운 마음'이 아니라 안전하게 떠난 상태를 가리키므로, POB의 주석 취지를 반영해 한국어에서도 관용적 의미를 보존했습니다.
  doctrine_reference: 서술 관용구 처리
