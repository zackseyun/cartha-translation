base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/009.yaml
  text: May God do so to Abner[a], and more also, if, just as Yahweh has sworn to David, so I do for him—
  footnotes:
  - marker: a
    text: Or, 'so I will do for him.' The Hebrew imperfect in the final clause can be understood with future force.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 아브넬에게 이렇게 하시고 더하시기를, 만일 야훼께서 다윗에게 맹세하신 것처럼 내가 그에게 그렇게 하지 않는다면 하시기를 바랍니다—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내가 그에게 그렇게 하지 않는다면’은 히브리어 미완료형의 미래적 힘을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים לְאַבְנֵר וְכֹה יֹסִיף לְוֹ
  english_pob_choice: May God do so to Abner, and more also
  chosen_korean: 하나님이 아브넬에게 이렇게 하시고 더하시기를
  alternatives_korean:
  - 하나님이 아브넬에게 이렇게 하시기를, 더하여
  - 하나님이 아브넬에게 그렇게 하시고 더하시기를
  lexicon: HALOT
  rationale: 히브리어의 맹세 공식은 직접적인 자기 저주를 담으므로, 한국어에서도 기원형으로 옮겨 그 강한 맹세 어조를 살렸습니다. '이렇게 하시고 더하시기를'은 전통적 관용을 과도하게 옛말로 만들지 않으면서 intensifying phrase를 반영합니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 신들
  lexicon: HALOT
  rationale: 문맥상 복수의 '신들'이 아니라 맹세 공식의 신적 주체이므로, 한국어 성경 관례에 맞는 단수 '하나님'으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה는 POB 기준에 따라 음역형 '야훼'로 옮겨, 일반 호칭이 아니라 언약적 고유명을 드러냈습니다.
- source_word: כִּי כֵן אֶעֱשֶׂה לּוֹ
  english_pob_choice: if ... so I do for him
  chosen_korean: 만일 ... 내가 그에게 그렇게 하지 않는다면
  alternatives_korean:
  - 내가 그에게 그렇게 하겠습니다
  - 내가 그에게 그렇게 하지 않는다면
  lexicon: HALOT
  rationale: 히브리어의 조건문-맹세 구조를 한국어로 자연스럽게 드러내기 위해 '만일 ... 않는다면' 구성을 사용했습니다. 끝의 동사는 미래적 뉘앙스를 유지하되, 맹세 공식의 조건성을 분명히 했습니다.
theological_decisions:
- issue: 신명사 יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 야훼의 맹세를 직접 언급하므로, 주칭 '주'로 완화하지 않고 고유명 '야훼'를 유지해야 신학적·서사적 대비가 선명해집니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 서약 공식의 자기저주적 어조
  chosen_reading: 기원형으로 번역해 강한 맹세 어조를 유지
  alternative_readings:
  - 평서문형으로 완화
  - 직설적 자기저주 표현
  rationale: 아브넬의 말은 단순한 예고가 아니라 조건부 자기저주를 동반한 맹세이므로, 한국어에서도 완화하지 않고 기원형을 유지했습니다.
  doctrine_reference: Hebrew oath formula in narrative context
