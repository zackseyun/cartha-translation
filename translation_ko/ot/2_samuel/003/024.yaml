  yaml_path: translation/ot/2_samuel/003/024.yaml
  text: Then Joab came to the king and said[a], “What have you done? Look, Abner came to you. Why is this—you sent him away, and he has gone on his way?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''and he went, going''—an emphatic form meaning that he has certainly gone or gone completely.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요압이 왕에게 와서 말했습니다. “무엇을 하셨습니까? 보십시오, 아브넬이 당신에게 왔는데, 왜 이러십니까—그를 보내셨고, 그는 자기 길로 갔습니다?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “가서, 가며”의 강조형으로, 이미 확실히 떠났거나 완전히 떠났다는 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: Then ... came
  chosen_korean: 그때 ... 와서
  alternatives_korean:
  - 그리고 ... 와서
  - 그래서 ... 와서
  lexicon: HALOT
  rationale: 와이콸의 서술 진행을 한국어로 자연스럽게 이어 주기 위해 ‘그때’로 사건 전환을 표시했습니다.
- source_word: מֶה עָשִׂיתָה
  english_pob_choice: What have you done?
  chosen_korean: 무엇을 하셨습니까?
  alternatives_korean:
  - 무슨 일을 하셨습니까?
  - 무엇을 하셨습니까?
  lexicon: HALOT
  rationale: 왕에게 하는 직접 질책이므로 공손한 높임을 유지하되, 원문의 책망 어조를 살렸습니다.
- source_word: לָמָּה זֶּה
  english_pob_choice: Why is this—
  chosen_korean: 왜 이러십니까—
  alternatives_korean:
  - 왜 그러십니까—
  - 어찌 이러십니까—
  lexicon: HALOT
  rationale: לָמָּה זֶּה의 지시적·추궁적 힘을 ‘왜 이러십니까’로 살려, 단순한 ‘왜’보다 더 날카로운 항의가 되도록 했습니다.
- source_word: וַיֵּלֶךְ הָלֽוֹךְ־־־
  english_pob_choice: and he has gone on his way
  chosen_korean: 그는 자기 길로 갔습니다
  alternatives_korean:
  - 그는 완전히 떠났습니다
  - 그는 가버렸습니다
  lexicon: HALOT
  rationale: 히브리어의 강조적 반복을 한국어 관용 표현으로 옮겨, 단순한 이동이 아니라 ‘이미 떠나 버린 상태’를 드러냈습니다.
