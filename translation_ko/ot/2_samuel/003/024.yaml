  text: Then Joab came to the king and said[a], “What have you done? Look, Abner came to you. Why is this—you sent him away, and he has gone on his way?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''and he went, going''—an emphatic form meaning that he has certainly gone or gone completely.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요압이 왕에게 와서 말했습니다. “무엇을 하셨습니까? 보십시오, 아브넬이 왕께 왔습니다. 왜 이렇게 그를 보내셔서 그가 아주 떠나가게 하셨습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘가다’라는 동사와 그 부정사를 결합하여, 그가 이미 확실히, 완전히 떠났음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: Then ... came
