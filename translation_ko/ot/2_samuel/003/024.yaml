  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘그는 자기 길로 갔습니다’는 히브리어의 강조된 떠남을 충분히 드러내지 못하며, ‘자기 길’은 원문에 없는 표현입니다. ‘당신에게’도 왕에게 직접 말하는 한국어 역사 서술의 격식에는 덜 자연스럽습니다.
