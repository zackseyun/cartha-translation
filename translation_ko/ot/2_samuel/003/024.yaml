  lexicon: HALOT
  rationale: 왕에게 하는 직접 질책이므로 공손한 높임을 유지하되, 원문의 책망 어조를 살렸습니다.
- source_word: לָמָּה זֶּה
  english_pob_choice: Why is this—
  chosen_korean: 왜 이러십니까—
  alternatives_korean:
  - 왜 그러십니까—
