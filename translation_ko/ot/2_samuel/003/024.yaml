  lexicon: HALOT
  rationale: לָמָּה זֶּה의 지시적·추궁적 힘을 ‘왜 이러십니까’로 살려, 단순한 ‘왜’보다 더 날카로운 항의가 되도록 했습니다.
- source_word: וַיֵּלֶךְ הָלֽוֹךְ־־־
  english_pob_choice: and he has gone on his way
  chosen_korean: 그는 자기 길로 갔습니다
  alternatives_korean:
  - 그는 완전히 떠났습니다
  - 그는 가버렸습니다
  lexicon: HALOT
  rationale: 히브리어의 강조적 반복을 한국어 관용 표현으로 옮겨, 단순한 이동이 아니라 ‘이미 떠나 버린 상태’를 드러냈습니다.
