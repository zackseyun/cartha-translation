  text: Now while the war continued between the house of Saul and the house of David[a], Abner was strengthening himself in the house of Saul.
  footnotes:
  - marker: a
    text: Or 'was growing strong in the house of Saul.' The Hebrew verb can denote becoming strong or strengthening oneself; the reflexive form here likely suggests Abner was consolidating his own position within Saul's house.
    reason: lexical_alternative
