base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/006.yaml
  text: Now while the war continued between the house of Saul and the house of David[a], Abner was strengthening himself in the house of Saul.
  footnotes:
  - marker: a
    text: Or 'was growing strong in the house of Saul.' The Hebrew verb can denote becoming strong or strengthening oneself; the reflexive form here likely suggests Abner was consolidating his own position within Saul's house.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 전쟁이 사울의 집과 다윗의 집 사이에 계속되는 동안, 아브넬은 사울의 집에서 점점 더 강해지고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사울의 집에서 점점 더 강해지고 있었다.’ 히브리어 동사는 ‘강해지다’와 ‘자기 세력을 굳히다’의 뜻을 둘 다 가질 수 있으며, 여기서는 아브넬이 자기 입지를 공고히 하는 뉘앙스가 있습니다.
    reason: lexical_alternative
