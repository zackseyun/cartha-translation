  text: וַ/יִּחַר֩ לְ/אַבְנֵ֨ר מְאֹ֜ד עַל דִּבְרֵ֣י אִֽישׁ בֹּ֗שֶׁת וַ/יֹּ֨אמֶר֙ הֲ/רֹ֨אשׁ כֶּ֥לֶב אָנֹ֘כִי֮ אֲשֶׁ֣ר לִֽ/יהוּדָה֒ הַ/יּ֨וֹם אֶֽעֱשֶׂה חֶ֜סֶד עִם בֵּ֣ית שָׁא֣וּל אָבִ֗י/ךָ אֶל אֶחָי/ו֙ וְ/אֶל מֵ֣רֵעֵ֔/הוּ וְ/לֹ֥א הִמְצִיתִ֖/ךָ בְּ/יַד דָּוִ֑ד וַ/תִּפְקֹ֥ד עָלַ֛/י עֲוֺ֥ן הָ/אִשָּׁ֖ה הַ/יּֽוֹם־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/008.yaml
  text: Then Abner became very angry because of Ish-bosheth’s words[a], and he said, “Am I a dog’s head that belongs to Judah? To this day I have shown covenant loyalty to the house of Saul your father, to his brothers, and to his friends, and have not delivered you into David’s hand; yet today you charge me with guilt concerning this woman.”
  footnotes:
  - marker: a
    text: Hebrew 'a dog’s head that belongs to Judah,' a difficult insult idiom. It likely means something like 'a contemptible dog aligned with Judah,' but the translation preserves the metaphor more literally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아브넬은 이스보셋의 말 때문에 몹시 화를 내며 말했습니다. 「내가 유다에 속한 개의 머리란 말이냐? 오늘날까지 나는 사울 왕실, 곧 네 아버지의 집과 그의 형제들과 그의 친구들에게 언약의 신실함을 보여 왔고, 너를 다윗의 손에 넘겨주지도 않았는데, 오늘 너는 이 여인 때문에 내게 죄를 묻는구나.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘유다에 속한 개의 머리’라는 난해한 모욕 표현입니다. 여기서는 은유를 살려 더 직역적으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְאַבְנֵר מְאֹד
  english_pob_choice: Then Abner became very angry
  chosen_korean: 아브넬은 … 몹시 화를 내며
  alternatives_korean:
  - 아브넬은 … 크게 타오르며
  - 아브넬은 … 매우 분노하며
  lexicon: HALOT
  rationale: חָרָה לְ는 분노가 치밀어 오르는 관용구이므로, 현대 한국어에서는 자연스러운 ‘몹시 화를 내다’로 옮기되 강도 표시 מְאֹד은 유지했습니다.
- source_word: הֲרֹאשׁ כֶּלֶב אָנֹכִי אֲשֶׁר לִיהוּדָה
  english_pob_choice: Am I a dog’s head that belongs to Judah?
  chosen_korean: 내가 유다에 속한 개의 머리란 말이냐?
  alternatives_korean:
  - 내가 유다 편의 개머리란 말이냐?
  - 내가 유다에 딸린 개의 머리란 말이냐?
  lexicon: HALOT
  rationale: 모욕적 관용구의 은유를 풀어 설명하지 않고 ‘개의 머리’를 살려, 경멸의 뉘앙스와 수사적 충격을 본문 수준에서 그대로 드러냈습니다.
- source_word: אֶעֱשֶׂה חֶסֶד
  english_pob_choice: I have shown covenant loyalty
  chosen_korean: 언약의 신실함을 보여 왔고
  alternatives_korean:
  - 언약적 인애를 베풀어 왔고
  - 언약 충성을 보여 왔고
  lexicon: HALOT
  rationale: חֶסֶד는 단순한 친절보다 언약 관계의 충실성을 포함하므로, ‘언약의 신실함’으로 옮겨 관계적·정치적 충성의 무게를 살렸습니다.
- source_word: וַתִּפְקֹד עָלַי עֲוֺן הָאִשָּׁה
  english_pob_choice: yet today you charge me with guilt concerning this woman
  chosen_korean: 오늘 너는 이 여인 때문에 내게 죄를 묻는구나
  alternatives_korean:
  - 오늘 너는 이 여인의 죄를 내게 돌리는구나
  - 오늘 너는 이 여인에 대한 죄책을 내게 지우는구나
  lexicon: HALOT
  rationale: פקד עַל + עָוֹן은 책임을 물어 책망하는 법정·도덕적 표현이므로, 현대 독자가 즉시 이해할 수 있도록 ‘죄를 묻다’로 압축했습니다.
theological_decisions:
- issue: הַיּוֹם 두 번의 사용과 동사의 시제-상 처리
  chosen_reading: ‘오늘날까지 나는 … 보여 왔고’와 ‘오늘 너는 … 묻는구나’의 대조를 살려, 첫 번째 הַיּוֹם는 과거에서 현재에 이르는 دفاع적 진술로, 두 번째는 현재의 책망으로 구분했습니다.
  alternative_readings:
  - ‘오늘 나는 … 보여’처럼 현재형으로 평탄화
  - ‘지금까지’로만 바꾸어 첫 번째 הַיּוֹם의 시간적 무게를 약화
  rationale: 본문은 같은 היום를 반복하지만 앞부분은 누적된 충성을, 뒷부분은 현재의 обвин책을 가리키므로, 한국어에서도 시제 대비를 유지하는 것이 담화 구조를 더 정확히 반영합니다.
  doctrine_reference: 담화-시제/상 해석 원칙
- issue: ‘언약의 신실함’의 신학적·관계적 의미
  chosen_reading: חֶסֶד를 단순 감정이 아니라 언약 관계에 대한 충성으로 이해해 ‘언약의 신실함’으로 번역했습니다.
  alternative_readings:
  - ‘인애’
  - ‘자비’
  rationale: 이 문맥은 감정적 친절보다 왕조·정치적 충성의 항변이 핵심이므로, 언약성을 드러내는 표현이 본문 의도를 더 직접적으로 전달합니다.
  doctrine_reference: 구약 חסד의 언약적 용법
