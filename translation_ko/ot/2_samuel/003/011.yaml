    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아브넬에게 한마디도 더 대답할 수 없었습니다. 그를 두려워했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아브넬에게 아무것도 답하지’입니다. 히브리어 관용구는 문자적으로 ‘아브넬에게 한마디를 대답하다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹֽא יָכֹ֣ל ע֔וֹד
  english_pob_choice: could no longer
  chosen_korean: 한마디도 더 대답할 수 없었습니다
  alternatives_korean:
  - 더 이상 대답할 수 없었습니다
  - 아무 말도 할 수 없었습니다
  lexicon: HALOT
  rationale: 부정 + עוֹד의 지속 불가를 한국어의 '더 이상' 계열로 풀되, 뒤의 관용구와 함께 자연스럽게 읽히도록 했습니다.
- source_word: לְ/הָשִׁ֥יב אֶת אַבְנֵ֖ר דָּבָ֑ר
  english_pob_choice: answer Abner a word
  chosen_korean: 아브넬에게 한마디도 더 대답할 수 없었습니다
  alternatives_korean:
  - 아브넬에게 한마디도 대답할 수 없었습니다
  - 아브넬에게 아무 말도 답하지 못했습니다
  lexicon: HALOT
  rationale: 히브리어의 직역형 관용구 '아브넬에게 한마디'를 살리면서, 현대 한국어에서는 '대답하다'로 옮겨 의미를 분명하게 했습니다.
- source_word: מִ/יִּרְאָת֖/וֹ
  english_pob_choice: because he feared him
  chosen_korean: 그를 두려워했기 때문입니다
  alternatives_korean:
  - 그를 두려워했기 때문입니다
  - 그에 대한 두려움 때문이었습니다
  lexicon: HALOT
  rationale: 원문의 원인 표현을 자연스러운 이유절로 옮겼으며, פחד 계열의 단순한 감정이 아니라 상대를 두려워하는 관계적 공포를 반영했습니다.
theological_decisions:
- issue: 두려움의 대상과 서술 방식
  chosen_reading: 인물의 정치적/사회적 두려움을 그대로 드러내는 서술로 유지했습니다.
  alternative_readings:
  - 더 부드럽게 '주저했습니다'로 완화
  - '''무서워했습니다''로 일상화'
  rationale: 본문은 아브넬 앞에서 입을 열지 못하는 실제 두려움을 서술하므로, 의미를 약화시키지 않고 직접적으로 번역하는 것이 적절합니다.
  doctrine_reference: 서사 문맥 보존
