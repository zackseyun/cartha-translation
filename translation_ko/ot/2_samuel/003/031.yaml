- source_word: וְסִפְדוּ
  english_pob_choice: mourn
  chosen_korean: 슬퍼하십시오
  alternatives_korean:
  - 애도하십시오
  - 곡하십시오
  lexicon: HALOT
  rationale: 공식적 조문/애도의 행위를 가리키므로 ‘슬퍼하다’보다 다소 더 직접적인 ‘애도하다’도 가능하지만, 여기서는 넓은 뜻의 애도 명령을 담아 자연스럽게 옮겼습니다.
- source_word: הַמִּטָּה
  english_pob_choice: the bier
  chosen_korean: 침상
  alternatives_korean:
  - 상여
  - 운구 침대
