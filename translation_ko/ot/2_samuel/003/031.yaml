  rationale: 히브리어의 דבר/명사구는 다윗을 왕으로 특정하는 기능이므로, 한국어에서도 호칭을 이름 앞에 두어 서술의 초점을 유지했습니다.
  doctrine_reference: 본문의 역사서 서술과 왕권 표지
