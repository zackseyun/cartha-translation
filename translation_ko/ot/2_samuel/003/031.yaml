base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/031.yaml
  text: Then David said to Joab and to all the people who were with him[a], “Tear your clothes, gird yourselves with sackcloth, and mourn before Abner.” And King David was walking behind the bier.
  footnotes:
  - marker: a
    text: Or “funeral couch” or “stretcher”; the Hebrew word often means “bed,” but here it refers to the platform on which Abner’s body was carried.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다윗이 요압과 그와 함께 있던 모든 백성에게 말했습니다. “너희 옷을 찢고, 베옷을 입고, 아브넬 앞에서 슬퍼하십시오.” 그리고 왕 다윗은 침상 뒤를 따라가고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘장례용 침상’ 혹은 ‘운구용 들것’. 히브리어 단어는 흔히 ‘침상’을 뜻하지만, 여기서는 아브넬의 시신이 실린 운구대(상여)에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְעוּ בִגְדֵיכֶם
  english_pob_choice: Tear your clothes
  chosen_korean: 너희 옷을 찢고
  alternatives_korean:
  - 너희 옷을 찢으십시오
  - 너희 옷을 찢어라
  lexicon: HALOT
  rationale: 애도 행위로서의 ‘찢다’의 뜻을 직접 살리면서도, 군중에게 주는 명령형을 자연스러운 한국어로 옮겼습니다.
- source_word: חִגְרוּ שַׂקִּים
  english_pob_choice: gird yourselves with sackcloth
  chosen_korean: 베옷을 입고
  alternatives_korean:
  - 베옷으로 띠를 두르고
  - 베옷을 허리에 두르고
  lexicon: HALOT
  rationale: 히브리어는 본래 ‘베옷을 몸에 두르다/띠다’는 관용적 애도 표현이지만, 현대 한국어에서는 ‘베옷을 입다’가 가장 자연스럽고 의미를 온전히 전달합니다.
- source_word: וְסִפְדוּ
  english_pob_choice: mourn
  chosen_korean: 슬퍼하십시오
  alternatives_korean:
  - 애도하십시오
  - 곡하십시오
  lexicon: HALOT
  rationale: 공식적 조문/애도의 행위를 가리키므로 ‘슬퍼하다’보다 다소 더 직접적인 ‘애도하다’도 가능하지만, 여기서는 넓은 뜻의 애도 명령을 담아 자연스럽게 옮겼습니다.
- source_word: הַמִּטָּה
  english_pob_choice: the bier
  chosen_korean: 침상
  alternatives_korean:
  - 상여
  - 운구 침대
  - 들것
  lexicon: HALOT
  rationale: 문맥상 시신을 실은 운구용 받침대/침상을 가리키므로, 본문 주석을 두지 않는 한국어 본문에서는 ‘침상’으로 옮겨 POB의 ‘bier’에 대응시켰습니다.
theological_decisions:
- issue: 다윗의 왕호 표현
  chosen_reading: ‘왕 다윗’으로 옮겨, 서술 안에서 다윗의 왕적 신분이 분명히 드러나게 했습니다.
  alternative_readings:
  - ‘다윗 왕’
  - ‘왕이신 다윗’
  rationale: 히브리어의 דבר/명사구는 다윗을 왕으로 특정하는 기능이므로, 한국어에서도 호칭을 이름 앞에 두어 서술의 초점을 유지했습니다.
  doctrine_reference: 본문의 역사서 서술과 왕권 표지
