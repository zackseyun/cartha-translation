  lexicon: HALOT
  rationale: 문맥상 시신을 실은 운구용 받침대/침상을 가리키므로, 본문 주석을 두지 않는 한국어 본문에서는 ‘침상’으로 옮겨 POB의 ‘bier’에 대응시켰습니다.
theological_decisions:
- issue: 다윗의 왕호 표현
  chosen_reading: ‘왕 다윗’으로 옮겨, 서술 안에서 다윗의 왕적 신분이 분명히 드러나게 했습니다.
  alternative_readings:
