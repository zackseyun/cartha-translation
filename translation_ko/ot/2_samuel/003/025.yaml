source:
  edition: WLC
  text: יָדַ֨עְתָּ֙ אֶת אַבְנֵ֣ר בֶּן נֵ֔ר כִּ֥י לְ/פַתֹּתְ/ךָ֖ בָּ֑א וְ/לָ/דַ֜עַת אֶת מוֹצָֽאֲ/ךָ֙ וְ/אֶת מבוא/ך וְ/לָ/דַ֕עַת אֵ֛ת כָּל אֲשֶׁ֥ר אַתָּ֖ה עֹשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/025.yaml
  text: You know Abner son of Ner[a], that he came to deceive you, and to learn your going out and your coming in[b], and to learn all that you are doing.
  footnotes:
  - marker: a
    text: Or 'to entice you' / 'to persuade you.' The Hebrew verb can denote seducing, enticing, or deceiving; here the hostile context favors 'deceive you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your going out and your coming in,' an idiom for the whole range of your movements or activities.
    reason: cultural_note
translation:
  language: ko
  text: 왕께서는 넬의 아들 아브넬이 왕을 속이고[a] 왕의 나가고 들어감을[b] 알아보며, 왕께서 하시는 모든 일을 알아보려고 왔다는 것을 알고 계십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕을 꾀하려고’ / ‘왕을 설득하려고’. 히브리어 동사는 유혹하다, 꾀다, 속이다의 뜻을 모두 가질 수 있습니다. 여기서는 적대적인 문맥상 ‘속이고’가 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘왕의 나가는 것과 들어오는 것’은 왕의 움직임이나 활동 전반을 가리키는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יָדַעְתָּ
  english_pob_choice: You know
  chosen_korean: 당신은 … 알고 있습니다
  alternatives_korean:
  - 당신은 … 아십니다
  - 당신은 … 알고 계십니다
  lexicon: HALOT
  rationale: 2인칭 완료형은 단순 과거보다 현재적 인식의 진술로 자연스럽게 읽히므로, 합쇼체로 ‘알고 있습니다’를 택했습니다.
- source_word: לְפַתֹּתְךָ
  english_pob_choice: to deceive you
  chosen_korean: 당신을 속이려고
  alternatives_korean:
  - 당신을 유혹하려고
  - 당신을 꾀하려고
  - 당신을 설득하려고
  lexicon: HALOT
  rationale: 정치적·의도적 문맥에서 פתה는 단순 설득보다 기만의 뉘앙스가 강하므로 ‘속이려고’가 가장 직접적입니다.
- source_word: מוֹצָאֲךָ / מְבוֹאֶךָ
  english_pob_choice: your going out and your coming in
  chosen_korean: 당신의 나가는 것과 들어오는 것
  alternatives_korean:
  - 당신의 출입
  - 당신의 나가고 들어옴
  - 당신의 출입과 왕래
  lexicon: HALOT
  rationale: 히브리어 관용구의 전체적 동선/행동 범위를 살리기 위해 ‘나가는 것과 들어오는 것’으로 직역에 가깝게 옮겼습니다.
- source_word: כָּל אֲשֶׁר אַתָּה עֹשֶׂה
  english_pob_choice: all that you are doing
  chosen_korean: 당신이 하고 있는 모든 것
  alternatives_korean:
  - 당신이 하는 모든 일
  - 당신이 하고 있는 모든 일
  - 당신이 하는 모든 것
  lexicon: HALOT
  rationale: 분사 עֹשֶׂה의 진행성을 반영해 현재 진행형 느낌의 ‘하고 있는’으로 옮겼습니다.
theological_decisions:
- issue: 아브넬의 의도 표현
  chosen_reading: ‘속이려고’로 번역해, 본문의 적대적 의도와 기만성을 분명히 드러냈습니다.
  alternative_readings:
  - 유혹하려고
  - 설득하려고
  - 꾀하려고
  rationale: 문맥상 요압이 다윗에게 아브넬의 악의적 목적을 고발하는 장면이므로, 의미를 약화시키는 표현보다 기만을 직접 드러내는 번역이 본문 의도에 더 부합합니다.
  doctrine_reference: 서사 문맥 해석
- issue: ‘나가는 것과 들어오는 것’ 관용구 보존
  chosen_reading: 관용구를 풀어 옮겨, 다윗의 전반적 동선과 활동을 포괄한다는 의미를 유지했습니다.
  alternative_readings:
  - 출입
  - 왕래
  - 모든 움직임
  rationale: 히브리어의 메리스므를 한국어로 너무 압축하면 범위가 흐려질 수 있으므로, 관용적 의미를 드러내면서도 원문 구조를 보존했습니다.
  doctrine_reference: 히브리어 관용구/문학적 표현
