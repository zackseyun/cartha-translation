  text: וְ/עַתָּ֖ה עֲשׂ֑וּ כִּ֣י יְהוָ֗ה אָמַ֤ר אֶל דָּוִד֙ לֵ/אמֹ֔ר בְּ/יַ֣ד דָּוִ֣ד עַבְדִּ֗/י הוֹשִׁ֜יעַ אֶת עַמִּ֤/י יִשְׂרָאֵל֙ מִ/יַּ֣ד פְּלִשְׁתִּ֔ים וּ/מִ/יַּ֖ד כָּל אֹיְבֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/018.yaml
  text: Now then[a], do it, for Yahweh has spoken concerning David, saying, ‘By the hand of my servant David I will save my people Israel from the hand of the Philistines and from the hand of all their enemies.’
  footnotes:
  - marker: a
    text: Or, 'David my servant will save my people Israel from the hand of the Philistines and from the hand of all their enemies.' The Hebrew form may be taken with David as the grammatical subject rather than the LORD as the implied speaker acting through David.
    reason: alternative_reading
translation:
  language: ko
  text: 지금이라도 그렇게 하십시오. 야훼께서 다윗에 대하여 말씀하시기를, ‘내 종 다윗의 손으로 내 백성 이스라엘을 블레셋 사람들의 손에서, 그리고 그들의 모든 원수들의 손에서 내가 구원하리라’ 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗 내 종이 블레셋 사람들의 손에서, 그리고 그들의 모든 원수들의 손에서 내 백성 이스라엘을 구원하리라’. 히브리어 형태는 야훼의 말씀을 인용하는 것으로도, 다윗을 문법적 주어로 보는 것으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now then
  chosen_korean: 지금이라도
  alternatives_korean:
  - 이제
  - 그러니 지금
  lexicon: HALOT
  rationale: 전환과 촉구가 함께 있는 담화 표지이므로, 단순한 시간 부사보다 즉각적 실행을 재촉하는 뉘앙스를 살려 옮겼습니다.
- source_word: עֲשׂוּ
  english_pob_choice: do it
  chosen_korean: 그렇게 하십시오
  alternatives_korean:
  - 행하십시오
  - 하십시오
  lexicon: HALOT
  rationale: 복수 명령을 한국어에서 자연스럽고 공손하게 재현하면서, 앞서 언급된 행동을 수행하라는 직접성을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 고유신명은 대체 тит울이 아니라 음역형 ‘야훼’로 옮겨 원문 고유성을 보존했습니다.
- source_word: בְּיַד דָּוִד עַבְדִּי
  english_pob_choice: By the hand of my servant David
  chosen_korean: 내 종 다윗의 손으로
  alternatives_korean:
  - 다윗의 손으로
  - 내 종 다윗을 통하여
  lexicon: HALOT
  rationale: ‘손’이라는 히브리 관용구를 살리면서도 한국어에서 자연스럽게 들리도록 ‘~의 손으로’로 옮겼습니다. עֶבֶד는 여기서 왕적·신적 소명 문맥이므로 ‘종’을 택했습니다.
- source_word: הוֹשִׁיעַ אֶת עַמִּי יִשְׂרָאֵל
  english_pob_choice: I will save my people Israel
  chosen_korean: 내 백성 이스라엘을 … 내가 구원하리라
  alternatives_korean:
  - 내 백성 이스라엘을 … 내가 구해내리라
  - 이스라엘 내 백성을 … 내가 구원하리라
  lexicon: HALOT
  rationale: 구원의 주체를 야훼로 두는 영어 POB의 독법을 따라 ‘내가 구원하리라’로 옮겨, 다윗을 도구로 쓰시는 하나님의 주도권을 보존했습니다.
theological_decisions:
- issue: ‘내 종 다윗의 손으로’ 구문에서 구원의 주체를 누구로 드러낼지
  chosen_reading: 야훼께서 직접 말씀하신 구원 약속으로 제시하되, 다윗은 그 구원의 도구로 드러나게 했습니다.
  alternative_readings:
  - ‘다윗이 내 백성을 구원하리라’로 다윗을 문법적 주어처럼 보이게 하는 읽기
  rationale: 히브리어는 다윗을 주어로 볼 여지도 있으나, 앞의 ‘야훼께서 … 말씀하시기를’과 ‘내 종 다윗의 손으로’가 하나님의 직접 행위를 더 강하게 가리키므로, 구원 행위의 최종 주체는 하나님으로 유지하는 편이 본문의 신학적 긴장을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it without documentation)
