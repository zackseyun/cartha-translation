id: 2SA.3.10
reference: 2 Samuel 3:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/הַֽעֲבִ֥יר הַ/מַּמְלָכָ֖ה מִ/בֵּ֣ית שָׁא֑וּל וּ/לְ/הָקִ֞ים אֶת כִּסֵּ֣א דָוִ֗ד עַל יִשְׂרָאֵל֙ וְ/עַל יְהוּדָ֔ה מִ/דָּ֖ן וְ/עַד בְּאֵ֥ר שָֽׁבַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/010.yaml
  text: to transfer the kingdom from the house of Saul and to establish the throne of David over Israel and over Judah[a], from Dan to Beer-sheba.
  footnotes:
  - marker: a
    text: Or 'from Dan as far as Beer-sheba,' a geographic idiom meaning the whole land from north to south.
    reason: cultural_note
translation:
  language: ko
  text: 사울의 집에서 왕국을 옮기고, 이스라엘과 유다 위에 다윗의 왕좌를 세우며, 단에서부터 브엘-세바에 이르기까지입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 단에서부터 브엘-세바까지, 남북 전역을 가리키는 지리 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַעֲבִיר
  english_pob_choice: to transfer
  chosen_korean: 옮기고
  alternatives_korean:
  - 전달하고
  - 이전하고
  - 옮겨
  lexicon: HALOT
  rationale: 히필형 עבר는 어떤 것을 한 지배자에게서 다른 지배자로 ‘옮기게 하다’는 뜻이므로, 왕국의 정치적 이전을 자연스럽게 드러내는 ‘옮기다’가 적절합니다.
- source_word: הַמַּמְלָכָה
  english_pob_choice: the kingdom
  chosen_korean: 왕국
  alternatives_korean:
  - 나라
  - 왕권
  - 통치
  lexicon: HALOT
  rationale: 문맥상 단순한 영토가 아니라 사울 집안에서 다윗에게 넘어가는 왕적 지배를 가리키므로, ‘왕국’이 가장 직접적입니다.
- source_word: מִבֵּית שָׁאוּל
  english_pob_choice: from the house of Saul
  chosen_korean: 사울의 집에서
  alternatives_korean:
  - 사울의 가문에서
  - 사울 집안에서
  - 사울의 왕가에서
  lexicon: HALOT
  rationale: ‘집’은 성경적 관용구로서 왕조/통치 가문을 뜻하므로, ‘사울의 집’이 원문의 가문적·왕조적 뉘앙스를 유지합니다.
- source_word: וּלְהָקִים אֶת כִּסֵּא דָוִד
  english_pob_choice: and to establish the throne of David
  chosen_korean: 다윗의 왕좌를 세우며
  alternatives_korean:
  - 다윗의 왕좌를 स्थापित하며
  - 다윗의 왕좌를 확립하며
  - 다윗의 보좌를 세우며
  lexicon: HALOT
  rationale: ‘תָּכִים/הֵקִים’의 정치적 용법을 ‘세우다’로 옮기되, ‘כסא’의 왕권 상징은 ‘왕좌’로 살렸습니다.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  english_pob_choice: from Dan to Beer-sheba
  chosen_korean: 단에서부터 브엘-세바에 이르기까지
  alternatives_korean:
  - 단에서 브엘-세바까지
  - 단에서부터 브엘세바에 이르기까지
  lexicon: HALOT
  rationale: 이 표현은 북쪽의 단에서 남쪽의 브엘-세바까지라는 전역을 가리키는 관용구이므로, 한국어에서는 ‘~에서부터 ~에 이르기까지’로 자연스럽게 대응했습니다.
theological_decisions:
- issue: 왕조 이전을 드러내는 ‘집’과 ‘왕좌’의 보존
  chosen_reading: 추상화하지 않고 ‘사울의 집’과 ‘다윗의 왕좌’를 그대로 살렸습니다.
  alternative_readings:
  - 사울의 왕조에서 다윗의 통치로
  - 사울 가문에서 다윗의 शासन으로
  rationale: 본문은 정치적 교체를 말하지만, 히브리어는 성경적 왕조 언어를 사용하므로 그 구체적 이미지를 유지하는 편이 원문 의도에 충실합니다.
  doctrine_reference: 번역 철학 §§1, 5
