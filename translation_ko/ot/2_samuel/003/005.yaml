translation:
  language: ko
  text: 그리고 여섯째는 다윗의 아내[a] 에글라에게서 난 이드르암입니다. 이들은 헤브론에서 다윗에게서 태어났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘다윗의 아내’라고 합니다. 문맥상 이는 에글라가 다윗의 여러 아내 가운데 한 사람이었음을 가리키며, 그의 유일한 아내라는 뜻은 아닙니다.
    reason: lexical_alternative
