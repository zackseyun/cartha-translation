  text: and the sixth[a], Ithream, by Eglah, David’s wife. These were born to David in Hebron.
  footnotes:
  - marker: a
    text: Or 'the wife of David.' The Hebrew phrase is literally 'wife of David'; in context it identifies Eglah as one of David’s wives, not necessarily his only wife.
