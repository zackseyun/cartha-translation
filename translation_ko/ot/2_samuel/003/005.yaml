  text: וְ/הַ/שִּׁשִּׁ֣י יִתְרְעָ֔ם לְ/עֶגְלָ֖ה אֵ֣שֶׁת דָּוִ֑ד אֵ֛לֶּה יֻלְּד֥וּ לְ/דָוִ֖ד בְּ/חֶבְרֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/005.yaml
  text: and the sixth[a], Ithream, by Eglah, David’s wife. These were born to David in Hebron.
  footnotes:
  - marker: a
    text: Or 'the wife of David.' The Hebrew phrase is literally 'wife of David'; in context it identifies Eglah as one of David’s wives, not necessarily his only wife.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여섯째는, 다윗의 아내 에글라가 낳은 이드르암입니다. 이들은 모두 헤브론에서 다윗에게서 태어났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשִּׁשִּׁי
  english_pob_choice: and the sixth
  chosen_korean: 그리고 여섯째는
  alternatives_korean:
  - 그리고 여섯째 아들은
  - 여섯째는
  lexicon: HALOT
  rationale: 열거를 이어 가는 서두로서 ‘그리고’를 살리고, 문맥상 아들이라는 말은 뒤에서 드러나므로 본문에는 덧붙이지 않았습니다.
- source_word: לְעֶגְלָה אֵשֶׁת דָּוִד
  english_pob_choice: by Eglah, David’s wife
  chosen_korean: 다윗의 아내 에글라가 낳은
  alternatives_korean:
  - 에글라, 다윗의 아내
  - 다윗의 아내 에글라에게서
  lexicon: HALOT
  rationale: 히브리어의 जन्म সূত্র에서 לְ가 어머니를 가리키는 용법을 살려, 한국어에서는 ‘낳은’으로 모성을 분명하게 표현했습니다.
- source_word: יִתְרְעָם
  english_pob_choice: Ithream
  chosen_korean: 이드르암
  alternatives_korean:
  - 이트르암
  - 이드르엠
  lexicon: 표준 외래어 표기법
  rationale: 고유명사는 한국어 음역으로 옮겼습니다.
- source_word: יֻלְּדוּ לְדָוִד בְּחֶבְרוֹן
  english_pob_choice: These were born to David in Hebron
  chosen_korean: 이들은 모두 헤브론에서 다윗에게서 태어났습니다
  alternatives_korean:
  - 이들은 헤브론에서 다윗에게 태어났습니다
  - 이들은 헤브론에서 다윗에게서 태어났습니다
  lexicon: HALOT
  rationale: 수동형 ‘태어났습니다’로 जन्म 사실을 자연스럽게 살리고, מקום과 출생 관계를 함께 드러내기 위해 ‘헤브론에서’와 ‘다윗에게서’를 병기했습니다.
