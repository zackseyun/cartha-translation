base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/015.yaml
  text: So Ish-bosheth sent and took her from her husband[b][a], from Paltiel the son of Laish.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from the man, from Paltiel son of Laish.'' The translation makes explicit that ''the man'' is her husband.'
    reason: lexical_alternative
  - marker: b
    text: Some English versions use 'Palti' in related passages; the Hebrew form here is Paltiel.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 이스보셋이 사람을 보내어 그녀를 그의 남편에게서, 곧 라이스의 아들 팔티엘에게서 데려왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 남자에게서’이지만, 문맥상 미갈의 남편을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 인명 לושׁ은 한국어 성경 전통에서 대개 ‘라이스’로 옮깁니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 보내어
  - 보냈습니다
  lexicon: HALOT
  rationale: 히브리어 이야기체의 וַיִּשְׁלַח는 단순히 ‘보내다’의 행위이므로, 보내는 대상이 명시되지 않은 채 자연스럽게 ‘사람을 보내어’로 옮겼습니다.
- source_word: וַיִּקָּחֶהָ
  english_pob_choice: took her
  chosen_korean: 데려왔습니다
  alternatives_korean:
  - 데려갔습니다
  - 붙잡아 왔습니다
  lexicon: HALOT
  rationale: לקח의 기본 의미를 살리면서도 이 문맥의 ‘이동·회수’ 뉘앙스를 한국어로 가장 자연스럽게 드러내기 위해 ‘데려왔습니다’를 택했습니다.
- source_word: אִישׁ
  english_pob_choice: her husband
  chosen_korean: 그의 남편에게서
  alternatives_korean:
  - 그 남자에게서
  - 남편에게서
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘그 남자에게서’이지만, 문맥상 미갈의 남편을 가리키므로 관계를 분명히 하는 ‘그의 남편’으로 옮겨 혼동을 줄였습니다.
- source_word: פַּלְטִיאֵל בֶּן־לוּשׁ
  english_pob_choice: Paltiel the son of Laish
  chosen_korean: 라이스의 아들 팔티엘
  alternatives_korean:
  - 팔티엘, 라이스의 아들
  - 라이스 아들 팔티엘
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역 관행에 따라 ‘팔티엘’로 옮기고, בֶּן־לוּשׁ는 계보 관계를 드러내는 표준 표현인 ‘라이스의 아들’로 번역했습니다.
theological_decisions:
- issue: 이동 동사의 강도
  chosen_reading: 중립적 서술로 ‘데려왔습니다’를 사용해 본문의 사실 전달을 유지했습니다.
  alternative_readings:
  - 붙잡아 왔습니다
  - 강제로 끌고 왔습니다
  rationale: 히브리어 לקח 자체는 강제성을 직접 명시하지 않으므로, 본문이 말하는 범위를 넘는 해석적 강화를 피했습니다.
  doctrine_reference: 본문 주해의 범위와 서술의 절제
