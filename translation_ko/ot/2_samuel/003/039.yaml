  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָנֹכִ֨י הַ/יּ֥וֹם רַךְ֙ וּ/מָשׁ֣וּחַ מֶ֔לֶךְ וְ/הָ/אֲנָשִׁ֥ים הָ/אֵ֛לֶּה בְּנֵ֥י צְרוּיָ֖ה קָשִׁ֣ים מִמֶּ֑/נִּי יְשַׁלֵּ֧ם יְהוָ֛ה לְ/עֹשֵׂ֥ה הָ/רָעָ֖ה כְּ/רָעָתֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/039.yaml
  text: And I am still weak today[a], though anointed king; and these men, the sons of Zeruiah, are too harsh for me[b]. May Yahweh repay the evildoer according to his evil.
  footnotes:
  - marker: a
    text: Or, 'And I am still tender today, though anointed king.' The Hebrew adjective can mean 'tender/soft' or, in context, 'weak.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'The LORD will repay the one who does evil according to his evil.' The Hebrew verb may also be read as a simple future.
    reason: alternative_reading
translation:
  language: ko
  text: 나는 오늘도 여전히 약하지만[a], 기름부음받은 왕입니다. 스루야의 아들들인 이 사람들은 나에게 너무 가혹합니다. 야훼께서 악을 행하는 자에게 그 악에 따라 갚으시기를 바랍니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 오늘도 여전히 연약합니다.’ 히브리어 형용사는 ‘연한, 부드러운’을 뜻할 수도 있으나, 여기서는 문맥상 ‘약한’이라는 뜻으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼께서 악을 행하는 자에게 그 악에 따라 갚으실 것입니다.’ 히브리어 미완료형은 단순 미래로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רַךְ
  english_pob_choice: weak
  chosen_korean: 약합니다
  alternatives_korean:
  - 연합니다
  - 부드럽습니다
  - 유약합니다
  lexicon: HALOT
  rationale: 문맥상 다윗은 성격의 연함이 아니라 요압 일행을 제어할 수 없는 처지의 취약함을 말하므로, 현대 한국어의 자연스러운 ‘약합니다’로 압축해 나타냈습니다.
- source_word: וּמָשׁוּחַ מֶלֶךְ
  english_pob_choice: though anointed king
  chosen_korean: 기름부음받아 왕이 된 몸입니다
  alternatives_korean:
  - 기름부음받은 왕이지만
  - 왕으로 기름부음받았지만
  - 기름부음받아 왕입니다
  lexicon: HALOT
  rationale: 히브리어는 동사 없는 대구로 약함과 신분을 대비하므로, ‘그러나’와 함께 양보 의미를 살려 왕으로 세워진 상태를 드러냈습니다.
- source_word: בְּנֵי צְרוּיָה
  english_pob_choice: the sons of Zeruiah
  chosen_korean: 스루야의 아들들
  alternatives_korean:
  - 스루야의 아들들
  - 스루야의 아들들인 사람들
  - 스루야의 자손들
  lexicon: HALOT
  rationale: 요압과 그의 형제들을 가리키는 고정 표현이므로, 소유격 구조를 그대로 살려 인물군을 식별하게 했습니다.
- source_word: קָשִׁים מִמֶּנִּי
  english_pob_choice: are too harsh for me
  chosen_korean: 나보다 너무 강합니다
  alternatives_korean:
  - 나에게 너무 가혹합니다
  - 나에게 너무 कठ?
  lexicon: HALOT
  rationale: קָשִׁים는 ‘딱딱한/가혹한’뿐 아니라 상대적으로 ‘감당하기 어려운, 강한’ 뜻을 지니므로, 여기서는 다윗이 그들을 제어하지 못하는 상황을 가장 직접적으로 드러내는 표현을 택했습니다.
- source_word: יְשַׁלֵּם
  english_pob_choice: May Yahweh repay
  chosen_korean: 야훼께서 … 갚으시기를 바랍니다
  alternatives_korean:
  - 야훼께서 갚으실 것입니다
  - 야훼께서 갚아 주시기를 바랍니다
  - 야훼께서 보응하시기를 바랍니다
  lexicon: HALOT
  rationale: 미완료형이 문맥상 기원/저주의 뉘앙스를 띠므로, 예측문보다 청유적 기도를 살려 번역했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: יהוה는 본문이 직접 쓰는 고유 이름이므로, 프로젝트 기본값에 따라 칭호 ‘주님’이 아니라 ‘야훼’로 옮겼습니다.
- source_word: לְעֹשֵׂה הָרָעָה
  english_pob_choice: the evildoer
  chosen_korean: 악을 행하는 자
  alternatives_korean:
  - 악을 행하는 사람
  - 행악자
  - 악인
  lexicon: HALOT
  rationale: 행위자를 나타내는 분사구문이므로, 단순한 도덕 범주인 ‘악인’보다 행위 중심의 표현을 유지했습니다.
- source_word: כְּרָעָתוֹ
  english_pob_choice: according to his evil
  chosen_korean: 그의 악에 따라
  alternatives_korean:
  - 그의 악대로
  - 그의 악행에 따라
  - 그의 악에 맞게
  lexicon: HALOT
  rationale: 보응의 비례성을 드러내는 비교구문이므로, 원문의 대응 관계를 직역에 가깝게 보존했습니다.
theological_decisions:
- issue: 야훼 이름의 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 음역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 Tetragrammaton을 직접 사용하므로, 본문 고유명을 보존하는 프로젝트 원칙에 따라 칭호 대체를 피했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 마지막 절의 어조
  chosen_reading: 기원적 표현으로 ‘갚으시기를 바랍니다’를 사용했습니다.
  alternative_readings:
  - '예언적 미래: ‘갚으실 것입니다’'
  - '단순 서술: ‘갚으십니다’'
  rationale: 문맥상 다윗은 보복을 하나님께 맡기며 판결을 청원하므로, 확정적 예언보다 기도의 어조가 더 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (preserve tension where ambiguity exists)
