  source_fidelity: 원문의 רַךְ는 문맥상 다윗의 정치적·실질적 취약함을 가리키므로 ‘약하지만’이 적절합니다. וּמָשׁוּחַ מֶלֶךְ의 양보 관계도 유지했습니다. קָשִׁים מִמֶּנִּי는 이 문맥에서 단순한 물리적 비교인 ‘나보다 강하다’보다 그들의 완고하고 가혹한 태도 및 다윗이 감당하기 어려운 상황을 나타내는 ‘나에게 너무 가혹합니다’가 더 충실합니다. 마지막 미완료형은 기원으로 번역하되 미래형 읽기의 가능성을 각주로 보존했습니다.
  naturalness: 기존의 ‘기름부음받아 왕이 된 몸입니다’는 현대 표준어 성경 문체로 다소 우회적이며, ‘기름부음받은 왕입니다’가 더 자연스럽습니다. 또한 ‘그의 악’은 한국어에서 지시 대상이 다소 불분명할 수 있어 ‘그 악’으로 다듬었습니다.
