id: 2SA.3.35
reference: 2 Samuel 3:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֣א כָל הָ/עָ֗ם לְ/הַבְר֧וֹת אֶת דָּוִ֛ד לֶ֖חֶם בְּ/ע֣וֹד הַ/יּ֑וֹם וַ/יִּשָּׁבַ֨ע דָּוִ֜ד לֵ/אמֹ֗ר כֹּ֣ה יַעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יֹסִ֔יף כִּ֣י אִם לִ/פְנֵ֧י בֽוֹא הַ/שֶּׁ֛מֶשׁ אֶטְעַם לֶ֖חֶם א֥וֹ כָל מְאֽוּמָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/035.yaml
  text: Then all the people came to urge David to eat bread while it was still day[a], but David swore, saying, “May God do so to me, and more also[b], if before the sun goes down I taste bread or anything at all.”
  footnotes:
  - marker: a
    text: Hebrew 'bread'; here it can function more broadly for food, but the translation retains the concrete term.
    reason: lexical_alternative
  - marker: b
    text: 'The oath formula is a conventional self-curse: ''May God do so to me, and more also.'' The specific punishment is left unstated in Hebrew.'
    reason: cultural_note
translation:
  language: ko
  text: 그러자 온 백성이 아직 낮이 남아 있을 때 다윗에게 떡을 먹으라고 권하러 왔습니다. 그러나 다윗은 맹세하며 말했습니다. “하나님이 내게 그렇게 하시고, 그보다 더하셔도 좋습니다[b]. 해가 지기 전에 내가 떡이나 무엇이든 맛보게 되면.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 이 맹세 공식은 ‘하나님이 내게 그렇게 하시고, 그보다 더하셔도 좋습니다’라는 관용적 자기 저주입니다. 실제로 어떤 벌을 뜻하는지는 히브리어가 밝히지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַבְרוֹת
  english_pob_choice: to urge ... to eat
  chosen_korean: 먹으라고 권하러 왔습니다
  alternatives_korean:
  - 먹게 하려고 왔습니다
  - 먹도록 권했습니다
  - 먹을 것을 가져와 위로하러 왔습니다
  lexicon: HALOT
  rationale: 이 동사는 단순히 음식을 가져오는 것보다 다윗이 먹도록 재촉하는 뉘앙스를 담으므로, ‘먹으라고 권하러 왔습니다’가 자연스럽고 의미를 잘 드러냅니다.
- source_word: לֶחֶם
  english_pob_choice: bread
  chosen_korean: 떡
  alternatives_korean:
  - 빵
  - 음식
  lexicon: HALOT
  rationale: 히브리어의 ‘빵/떡’이라는 구체성을 살리면서도 한국어 성경 문맥에서 자연스럽게 읽히는 표현을 택했습니다. 필요 이상으로 ‘음식’으로 넓히지 않았습니다.
- source_word: וַיִּשָּׁבַע
  english_pob_choice: swore
  chosen_korean: 맹세하며 말했습니다
  alternatives_korean:
  - 맹세했습니다
  - 서약하며 말했습니다
  lexicon: HALOT
  rationale: 이어지는 인용문을 이끄는 서술이므로, 단순한 ‘맹세했습니다’보다 말하기 동작을 함께 드러내는 표현이 문맥상 자연합니다.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יֹסִיף
  english_pob_choice: May God do so to me, and more also
  chosen_korean: 하나님이 내게 그렇게 하시고, 그보다 더하셔도 좋습니다
  alternatives_korean:
  - 하나님이 내게 그렇게 하시고, 그 이상 더하시기를 바랍니다
  - 하나님이 내게 이렇게 하시고 또 더하시기를 바랍니다
  - 하나님이 내게 그렇게 하시고 더하시더라도 좋습니다
  lexicon: HALOT
  rationale: 이것은 특정 형벌을 밝히지 않는 자기 저주 서약 공식이므로, 내용을 과잉 설명하지 않으면서 한국어로 그 엄중함을 살렸습니다.
- source_word: אֶטְעַם
  english_pob_choice: I taste
  chosen_korean: 맛보게 되면
  alternatives_korean:
  - 먹게 되면
  - 맛을 보게 되면
  - 입에 대게 되면
  lexicon: HALOT
  rationale: ‘맛보다’는 아주 조금이라도 입에 대는 행위를 포함하는 원문의 강한 제한을 살립니다. ‘먹다’보다 더 세밀합니다.
- source_word: אוֹ כָל מְאוּמָה
  english_pob_choice: or anything at all
  chosen_korean: 무엇이든
  alternatives_korean:
  - 아무것도
  - 어떤 것이든
  - 전혀 아무것도
  lexicon: HALOT
  rationale: 원문은 떡을 넘어 어떤 것이라도 금하는 포괄 표현이므로, 한국어에서는 ‘무엇이든’으로 자연스럽게 넓혔습니다.
theological_decisions:
- issue: 자기 저주 맹세 공식의 처리
  chosen_reading: 직역 투로 옮기되, 실제 저주의 내용은 밝히지 않고 원문의 관용적 엄중함만 유지했습니다.
  alternative_readings:
  - 하나님이 내게 벌을 내리셔도 좋습니다
  - 하나님이 내게 저주를 내리셔도 좋습니다
  rationale: 히브리어 공식은 구체적 형벌을 말하지 않으므로, 이를 한국어에서 특정 형벌로 바꾸면 원문의 의도보다 좁아집니다. 따라서 관용적 자기 저주 형식을 보존했습니다.
  doctrine_reference: 서원/맹세의 관용구와 본문의 문학적 형식
- issue: 맹세문 안의 신칭
  chosen_reading: 하나님
  alternative_readings:
  - 주님
  - 하나님께서
  rationale: 본문의 אֱלֹהִים은 일반 신칭으로 읽히며, 여기서는 야훼 표지나 인용 시그널이 없으므로 ‘하나님’이 가장 직접적입니다.
  doctrine_reference: 히브리어 אֱלֹהִים의 일반 신칭 용법
