base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/023.yaml
  text: When Joab and all the army that was with him arrived, they told Joab, saying, “Abner son of Ner came to the king, and he sent him away, and he went in peace.”
translation:
  language: ko
  text: 요압과 그와 함께한 모든 군대가 돌아오자, 사람들이 요압에게 말하여 이르기를 “아브넬은 넬의 아들이 왕에게 왔는데, 왕이 그를 돌려보냈고 그는 평안히 갔습니다” 하였습니다.
  philosophy: formal
lexical_decisions:
- source_word: וְכָל הַצָּבָא
  english_pob_choice: all the army
  chosen_korean: 모든 군대
  alternatives_korean:
  - 모든 군사들
  - 온 군대
  lexicon: צבא
  rationale: צבא는 여기서 요압과 함께 움직인 무장 집단을 가리키므로, 자연스러운 현대어로 ‘군대’라고 옮기되 전체성을 살리기 위해 ‘모든’을 덧붙였습니다.
- source_word: בָּאוּ
  english_pob_choice: arrived
  chosen_korean: 돌아오자
  alternatives_korean:
  - 도착하자
  - 왔을 때
  lexicon: בוא
  rationale: 문맥상 이미 이동 중이던 요압 일행이 어떤 장소에 이르러 보고를 듣는 장면이므로, 단순한 ‘오다’보다 상황을 드러내는 ‘돌아오자’가 자연스럽습니다.
- source_word: וַיְשַׁלְּחֵהוּ
  english_pob_choice: he sent him away
  chosen_korean: 왕이 그를 돌려보냈고
  alternatives_korean:
  - 왕이 그를 보내었고
  - 왕이 그를 놓아주었고
  lexicon: שלח
  rationale: שלח는 단순한 발송보다 상대를 보내는 행위를 뜻하므로, 대화 흐름상 아브넬이 왕과의 만남 뒤 되돌려 보내진 뜻을 살려 ‘돌려보냈고’로 옮겼습니다.
- source_word: בְּשָׁלוֹם
  english_pob_choice: in peace
  chosen_korean: 평안히
  alternatives_korean:
  - 평화롭게
  - 안전하게
  lexicon: שלום
  rationale: שָׁלוֹם의 관용적 의미를 현대 한국어에서 가장 자연스럽게 드러내는 말로 ‘평안히’를 택해, 단순한 충돌 부재만이 아니라 무사한 귀환의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: “그는 평안히 갔습니다”의 의미 범위
  chosen_reading: 여기서 평안은 단순한 내적 감정이 아니라, 왕에게서 무사히 떠난 상태를 가리키는 서술로 이해했습니다.
  alternative_readings:
  - 정치적 화해 상태로 읽기
  - 개인적 안심의 표현으로만 읽기
  rationale: 히브리어 בְּשָׁלוֹם은 인사말적 평안보다 ‘무사히/평안히’의 상태 서술이 기본이므로, 본문이 말하는 출발의 안전성을 중심으로 옮겼습니다.
  doctrine_reference: 서사 본문의 평강/무사 개념
