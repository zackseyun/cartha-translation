id: 2SA.3.34
reference: 2 Samuel 3:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָדֶ֣/ךָ לֹֽא אֲסֻר֗וֹת וְ/רַגְלֶ֨י/ךָ֙ לֹא לִ/נְחֻשְׁתַּ֣יִם הֻגָּ֔שׁוּ כִּ/נְפ֛וֹל לִ/פְנֵ֥י בְנֵֽי עַוְלָ֖ה נָפָ֑לְתָּ וַ/יֹּסִ֥פוּ כָל הָ/עָ֖ם לִ/בְכּ֥וֹת עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/034.yaml
  text: Your hands were not bound[a], and your feet were not put into bronze fetters; as one falls before sons of injustice, so you have fallen. And all the people wept over him even more.
  footnotes:
  - marker: a
    text: Or more idiomatically, 'before wicked men' or 'before evildoers.' The Hebrew reads literally 'before sons of injustice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그대의 손은 묶이지 않았고, 그대의 발은 청동 족쇄에 채워지지 않았습니다. 마치 불의한 자들[a] 앞에서 쓰러지듯이 그대도 쓰러졌습니다. 온 백성은 그를 두고 더욱 울었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘불의의 아들들 앞에’입니다. 더 관용적으로는 ‘악한 사람들 앞에’ 또는 ‘행악자들 앞에’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֶךָ לֹא אֲסֻרוֹת
  english_pob_choice: Your hands were not bound
  chosen_korean: 당신의 손은 묶이지 않았고
  alternatives_korean:
  - 당신의 손은 매이지 않았고
  - 당신의 손은 결박되지 않았고
  lexicon: HALOT
  rationale: אֲסֻרוֹת는 ‘묶인/결박된’ 상태를 가리키므로, 한국어에서는 자연스럽고 장례 탄식의 문맥에 맞는 ‘묶이지 않았고’로 옮겼습니다.
- source_word: וְרַגְלֶיךָ לֹא לִנְחֻשְׁתַּיִם הֻגָּשׁוּ
  english_pob_choice: and your feet were not put into bronze fetters
  chosen_korean: 당신의 발은 청동 족쇄에 채워지지 않았습니다
  alternatives_korean:
  - 당신의 발은 청동 쇠사슬에 넣어지지 않았습니다
  - 당신의 발은 청동 족쇄에 들이지지 않았습니다
  lexicon: HALOT
  rationale: לִנְחֻשְׁתַּיִם은 재료를 살리는 ‘청동’과 구속 도구를 뜻하는 ‘족쇄’로 옮겨, 본문의 물질적·형상적 대비를 유지했습니다.
- source_word: לִפְנֵי בְנֵי עַוְלָה
  english_pob_choice: before sons of injustice
  chosen_korean: 불의의 아들들 앞에
  alternatives_korean:
  - 악한 자들 앞에
  - 불의한 사람들 앞에
  lexicon: HALOT
  rationale: 히브리어 직역의 날카로움을 살려 ‘불의의 아들들’을 본문에 유지했고, POB가 제시한 관용적 의미는 별도 각주로 처리할 수 있지만 여기서는 본문 흐름상 생략하지 않았습니다.
- source_word: וַיֹּסִפוּ כָל הָעָם לִבְכּוֹת עָלָיו
  english_pob_choice: And all the people wept over him even more
  chosen_korean: 그러자 온 백성은 그를 두고 더욱 울었습니다
  alternatives_korean:
  - 그러자 온 백성은 그를 두고 계속 울었습니다
  - 그러자 온 백성은 그를 두고 한층 더 울었습니다
  lexicon: HALOT
  rationale: יָסַף + 부정사는 단순 지속보다 강도 증가를 뜻하므로, ‘더욱’으로 애도의 심화를 살렸습니다.
theological_decisions:
- issue: 탄식 문맥에서의 직설적 묘사 유지
  chosen_reading: 신체적 구속과 전사적 치욕을 완화하지 않고 그대로 드러내어, 아브넬의 죽음에 대한 다윗의 애가가 가진 비극성을 유지했습니다.
  alternative_readings:
  - 구속 이미지를 순화해 더 일반적으로 표현함
  - 의미만 남기고 비유를 완화함
  rationale: 본문은 무고한/비극적 죽음의 상황을 ‘묶임’과 ‘족쇄’라는 구체적 이미지로 대비시키므로, 그 긴장을 약화하지 않는 것이 source-direct 번역에 부합합니다.
  doctrine_reference: 시적/서사적 본문 해석 원칙
- issue: ‘불의의 아들들’의 이질감 보존
  chosen_reading: 관용적 의미를 예상할 수 있어도, 본문에는 히브리어식 표현의 거침을 남겨 독자가 원문 수사를 느끼게 했습니다.
  alternative_readings:
  - ‘악인들’로 완전 의역
  - ‘불의한 자들’로 완화
  rationale: POB의 영어 본문도 직역어를 본문에 두고 대체 의미를 각주로 제시하므로, 한국어도 동일한 긴장을 보존하는 편이 원문 관찰에 도움이 됩니다.
  doctrine_reference: '번역 철학: 원문 수사 보존'
