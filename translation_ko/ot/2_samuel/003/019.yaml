  naturalness: ‘베냐민의 귀에 말했고’, ‘다윗의 귀에 말하여’는 현대 표준 한국어에서 부자연스럽고, 특히 후자는 문장 구조가 어색합니다. 관용구의 의미를 자연스럽게 ‘~에게 말하다’로 옮기는 것이 적절합니다.
