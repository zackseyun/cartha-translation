base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/019.yaml
  text: Abner also spoke in the hearing of Benjamin[b][a], and Abner also went to speak in the hearing of David at Hebron all that seemed good in the eyes of Israel and in the eyes of the whole house of Benjamin.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in the ears of,'' an idiom meaning ''in the hearing of'' or ''to.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'all that was pleasing to Israel and to the whole house of Benjamin.'
    reason: alternative_reading
translation:
  language: ko
  text: 아브넬은 베냐민의 귀에 또한 말했고, 아브넬은 또한 헤브론에서 다윗의 귀에 말하여 이스라엘과 베냐민 온 집안의 눈에 좋게 여겨지는 모든 것을 전했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/אָזְנֵי
  english_pob_choice: in the hearing of
  chosen_korean: ~의 귀에
  alternatives_korean:
  - ~의 들음 속에
  - ~이 듣는 데에
  - ~에게
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘귀에’의 직역을 살리되, 한국어에서는 ‘~의 귀에 말하다’가 자연스럽고 청중이 듣는 상황을 충분히 전달합니다.
- source_word: גַּם ... גַּם
  english_pob_choice: also ... also
  chosen_korean: 또한 ... 또한
  alternatives_korean:
  - 그리고 ... 그리고
  - 심지어 ... 또한
  lexicon: HALOT
  rationale: 반복된 גַּם의 병렬성과 추가 강조를 그대로 드러내기 위해 ‘또한’을 두 번 사용했습니다.
- source_word: אֵת כָּל אֲשֶׁר טוֹב בְּ/עֵינֵי
  english_pob_choice: all that seemed good to
  chosen_korean: '... 눈에 좋게 여겨지는 모든 것'
  alternatives_korean:
  - '... 보기에 좋은 모든 것'
  - '... 마음에 드는 모든 것'
  - '... 옳게 여겨지는 모든 것'
  lexicon: HALOT
  rationale: ‘눈에 좋다/좋게 여겨지다’라는 히브리어 관용을 유지하면서, 단순한 미감보다 판단·평가의 의미를 살렸습니다.
- source_word: כָּל בֵּית בִּנְיָמִן
  english_pob_choice: the whole house of Benjamin
  chosen_korean: 베냐민 온 집안
  alternatives_korean:
  - 베냐민의 온 집
  - 베냐민 온 부족
  - 베냐민의 온 집안
  lexicon: HALOT
  rationale: ‘house of Benjamin’의 친족-정치적 표현을 ‘온 집안’으로 살려, 단순한 지리적 집합이 아니라 공동체 전체를 가리키는 뉘앙스를 보존했습니다.
