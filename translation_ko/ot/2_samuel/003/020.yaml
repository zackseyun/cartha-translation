base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/020.yaml
  text: Abner came to David at Hebron[a], and twenty men were with him. And David made a feast for Abner and for the men who were with him.
  footnotes:
  - marker: a
    text: Or 'prepared a feast' or 'made a banquet.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아브넬이 헤브론에 있는 다윗에게 오니, 그와 함께한 사람은 스무 명이었습니다. 다윗은 아브넬과 그와 함께한 사람들을 위해 잔치를 베풀었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잔치를 마련했습니다’ 혹은 ‘연회를 베풀었습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 오니
  alternatives_korean:
  - 왔습니다
  - 도착하니
  lexicon: WLC/HALOT
  rationale: 서술적 진행을 살리면서도 자연스러운 합쇼체로 옮기기 위해 ‘오니’를 택했습니다. 단순한 도착보다 서사적 연결이 드러납니다.
- source_word: אֶל דָּוִד חֶבְרוֹן
  english_pob_choice: to David at Hebron
  chosen_korean: 헤브론에 있는 다윗에게
  alternatives_korean:
  - 다윗에게 헤브론으로
  - 헤브론의 다윗에게
  lexicon: WLC/HALOT
  rationale: 히브리어의 יעד+장소 구문을 한국어에서 자연스럽게 풀어, 다윗의 거처를 나타내는 의미를 분명히 했습니다.
- source_word: וְאִתּוֹ עֶשְׂרִים אֲנָשִׁים
  english_pob_choice: and twenty men were with him
  chosen_korean: 그와 함께한 사람은 스무 명이었습니다
  alternatives_korean:
  - 그와 함께 스무 명이 있었습니다
  - 스무 명의 남자가 그와 함께 있었습니다
  lexicon: WLC/HALOT
  rationale: 히브리어의 무동사 구문을 한국어에서 자연스럽게 보완했고, אֲנָשִׁים을 문맥에 따라 ‘사람들’로 옮기되 수량을 그대로 살렸습니다.
- source_word: מִשְׁתֶּה
  english_pob_choice: made a feast
  chosen_korean: 잔치를 베풀었습니다
  alternatives_korean:
  - 잔치를 마련했습니다
  - 연회를 베풀었습니다
  lexicon: WLC/HALOT
  rationale: ‘עשה + משתה’의 관용구를 한국어에서 가장 자연스럽게 드러내는 표현이 ‘잔치를 베풀다’이므로 이를 택했습니다. ‘연회’는 다소 격식이 강합니다.
theological_decisions:
- issue: 잔치의 성격을 어떻게 옮길지
  chosen_reading: 본문의 사회적 환대 행위를 드러내는 일반적 ‘잔치’로 번역했습니다.
  alternative_readings:
  - ‘연회’로 옮겨 보다 공식적 분위기를 살릴 수 있음
  - ‘술잔치’처럼 음주 뉘앙스를 덧붙일 수 있음
  rationale: מִשְׁתֶּה는 잔치/연회를 뜻하지만, 본문이 음주를 전면에 두지 않으므로 과잉 해석을 피하고 환대의 의미를 보존했습니다.
  doctrine_reference: 본문 해석상의 절제 원칙
