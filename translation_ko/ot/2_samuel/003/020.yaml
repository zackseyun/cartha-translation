  naturalness: ‘오니’는 문어적 연결 표현이며 문장 전체의 현대 합쇼체 종결과도 다소 어울리지 않습니다. 독립 절을 ‘왔습니다’로 옮기면 현대 표준어 합쇼체로 더 자연스럽고 명료합니다.
