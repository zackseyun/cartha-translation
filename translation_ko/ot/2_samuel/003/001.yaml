  text: Now the war between the house of Saul and the house of David was prolonged[a], and David kept growing stronger[b], while the house of Saul kept growing weaker.
  footnotes:
  - marker: a
    text: Or 'was long.' The Hebrew adjective is literally 'long,' here referring to the duration of the war.
    reason: lexical_alternative
  - marker: b
    text: '''House'' can mean a household, family line, or ruling dynasty; the Hebrew likely carries both familial and political force here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울의 집과 다윗의 집[b] 사이의 전쟁은 오래 계속되었고[a], 다윗은 점점 강해진 반면 사울의 집은 점점 약해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오래 계속되었다’는 히브리어 형용사 ‘길다’를 전쟁의 지속 기간을 나타내는 말로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 가문, 가족 계통, 또는 통치 왕조를 함께 가리킬 수 있습니다.
    reason: lexical_alternative
