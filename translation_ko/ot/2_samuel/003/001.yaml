source:
  edition: WLC
  text: וַ/תְּהִ֤י הַ/מִּלְחָמָה֙ אֲרֻכָּ֔ה בֵּ֚ין בֵּ֣ית שָׁא֔וּל וּ/בֵ֖ין בֵּ֣ית דָּוִ֑ד וְ/דָוִד֙ הֹלֵ֣ךְ וְ/חָזֵ֔ק וּ/בֵ֥ית שָׁא֖וּל הֹלְכִ֥ים וְ/דַלִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/001.yaml
  text: Now the war between the house of Saul and the house of David was prolonged[a], and David kept growing stronger[b], while the house of Saul kept growing weaker.
  footnotes:
  - marker: a
    text: Or 'was long.' The Hebrew adjective is literally 'long,' here referring to the duration of the war.
    reason: lexical_alternative
  - marker: b
    text: '''House'' can mean a household, family line, or ruling dynasty; the Hebrew likely carries both familial and political force here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울의 집과 다윗의 집 사이에 전쟁이 길어졌고, 다윗은 점점 강해졌으며 사울의 집은 점점 약해졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘길어졌다’는 히브리어 형용사 ‘길다’를 시간의 지속으로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 가문, 가족 라인, 통치 왕조를 함께 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה
  english_pob_choice: Now the war ... was prolonged
  chosen_korean: 전쟁이 길어졌고
  alternatives_korean:
  - 전쟁이 오래 지속되었고
  - 전쟁이 길었고
  lexicon: HALOT
  rationale: מִלְחָמָה는 단순한 다툼이 아니라 전쟁/전투를 뜻하므로 ‘전쟁’으로 옮겼고, אֲרֻכָּה의 ‘길다’는 시간 지속의 의미를 살려 ‘길어지다’로 자연스럽게 반영했습니다.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  english_pob_choice: between the house of Saul and the house of David
  chosen_korean: 사울의 집과 다윗의 집 사이에
  alternatives_korean:
  - 사울 가문과 다윗 가문 사이에
  - 사울의 왕조와 다윗의 왕조 사이에
  lexicon: HALOT
  rationale: בַּיִת은 가족/가문/왕조를 함께 가리킬 수 있으므로, 본문의 정치적·가계적 이중성을 살리기 위해 직역에 가까운 ‘집’을 유지했습니다.
- source_word: וְדָוִד הֹלֵךְ וְחָזֵק
  english_pob_choice: David kept growing stronger
  chosen_korean: 다윗은 점점 강해졌으며
  alternatives_korean:
  - 다윗은 계속 강해졌으며
  - 다윗은 점점 더 강해졌으며
  lexicon: HALOT
  rationale: הלך + 형용사의 연속은 진행적·점증적 의미를 나타내므로, 단순 과거보다 반복적 진전을 드러내는 ‘점점 강해지다’로 옮겼습니다.
- source_word: וּבֵית שָׁאוּל הֹלְכִים וְדַלִּים
  english_pob_choice: while the house of Saul kept growing weaker
  chosen_korean: 사울의 집은 점점 약해졌습니다
  alternatives_korean:
  - 사울의 집은 점점 더 약해졌습니다
  - 사울의 집은 계속 약해졌습니다
  lexicon: HALOT
  rationale: דַלִּים는 이 문맥에서 경제적 ‘가난’보다 세력의 쇠약을 뜻하므로, 다윗의 ‘강해짐’과 대조되는 ‘약해지다’로 옮겼습니다.
theological_decisions:
- issue: ‘집’(house)의 의미 범위
  chosen_reading: 가문이면서 동시에 통치 세력을 가리키는 표현으로 이해해 ‘집’을 유지했습니다.
  alternative_readings:
  - ‘가문’으로 풀어 쓰는 해석
  - ‘왕조’로 좁혀 옮기는 해석
  rationale: 히브리어 בַּיִת의 의미 범위가 본문에서 가계와 정치 권력을 함께 포함하므로, 어느 한쪽으로만 좁히지 않는 번역이 원문 의도를 더 잘 보존합니다.
  doctrine_reference: 본문 문맥의 역사서적·서술적 의미
