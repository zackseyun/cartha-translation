lexical_decisions:
- source_word: וַיְקֹנֵן
  english_pob_choice: lamented
  chosen_korean: 애도하며
  alternatives_korean:
  - 슬퍼하며
  - 곡하며
  - 애곡하며
  lexicon: HALOT
  rationale: קונן은 단순히 ‘슬퍼하다’보다 애가(哀歌)를 지어 부르거나 애도하는 행위를 가리키므로, 현대 한국어에서는 ‘애도하며’가 가장 자연스럽고 장례적 정서를 잘 살립니다.
- source_word: אֶל
  english_pob_choice: over
  chosen_korean: 아브넬을
  alternatives_korean:
  - 아브넬에 대해
  - 아브넬 위에
  lexicon: HALOT
  rationale: 애도 동사와 결합한 אֶל은 애도의 대상 표시로 기능하므로, 한국어에서는 직접목적어처럼 ‘아브넬을’로 옮기는 것이 가장 자연스럽습니다.
- source_word: הַכְּמוֹת נָבָל יָמוּת אַבְנֵר
  english_pob_choice: Should Abner die as a fool dies?
  chosen_korean: 아브넬이 어리석은 사람처럼 죽어야 합니까?
  alternatives_korean:
  - 아브넬이 어리석은 사람의 죽음처럼 죽어야 합니까?
  - 아브넬이 바보처럼 죽어야 합니까?
  lexicon: HALOT
  rationale: 직역형 ‘어리석은 사람처럼’은 נָבָל의 기본 의미를 유지하면서도, 한국어에서 ‘바보’보다 덜 구어적이고 경멸적 뉘앙스를 과도하게 강화하지 않습니다.
theological_decisions:
- issue: 수사적 질문의 어조
  chosen_reading: 반문형 ‘죽어야 합니까?’로 옮겨, 다윗의 애통 속 항의를 분명하게 드러냈습니다.
  alternative_readings:
  - 평서형 ‘죽지 않았어야 합니다’
  - 완곡한 탄식형 ‘어리석은 사람처럼 죽다니요’
  rationale: 히브리어는 단순 정보가 아니라 애도 속에서 던지는 항의성 질문이므로, 합쇼체 반문이 본문의 정서와 기능을 가장 잘 보존합니다.
  doctrine_reference: 서술 기능/수사학
