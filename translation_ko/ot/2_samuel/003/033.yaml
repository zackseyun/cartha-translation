  naturalness: ‘아브넬이 어리석은 사람처럼 죽어야 합니까?’도 자연스럽지만, ‘어리석은 자가 죽듯이 아브넬이 죽어야 합니까?’가 비교 대상의 ‘죽음/죽는 방식’을 더 명확히 드러내며 한국어 성경 문체에도 자연스럽습니다. ‘애가를 지으며’는 현대 표준어 합쇼체 서술 안에서 이해 가능하고, 원문의 장르성을 살립니다.
