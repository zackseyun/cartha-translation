  source_fidelity: 히브리어 본문은 ‘그의 둘째, 갈멜 사람 나발의 아내 아비가일에게서 난 길르압; 셋째, 그술 왕 달매의 딸 마아가의 아들 압살롬’을 열거합니다. 초안은 두 모계 관계와 순서를 충실히 재현하며, ‘그술 왕 달매의 딸 마아가’도 히브리어의 연쇄 속격 관계를 정확히 반영합니다.
