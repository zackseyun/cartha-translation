  yaml_path: translation/ot/2_samuel/003/032.yaml
  text: They buried Abner in Hebron[a], and the king lifted up his voice and wept at Abner’s grave, and all the people wept.
  footnotes:
  - marker: a
    text: Or 'toward Abner’s grave.' The Hebrew preposition can be read more literally, but the context favors the idiomatic sense 'at Abner’s grave.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 아브넬을 헤브론에 장사하였고, 왕은 목소리를 높여 아브넬의 무덤에서 울었으며, 모든 백성도 울었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 אֶל은 문자적으로는 ‘~을 향하여’로도 옮길 수 있지만, 이 문맥에서는 애곡이 이루어진 장소를 나타내는 ‘~에서’가 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  english_pob_choice: They buried
  chosen_korean: 장사하였고
  alternatives_korean:
  - 묻었고
  - 매장하였고
  lexicon: HALOT
  rationale: 장사하다는 장례·매장 행위를 자연스럽게 나타내면서도 서술 흐름을 유지합니다.
- source_word: בְּחֶבְרוֹן
  english_pob_choice: in Hebron
  chosen_korean: 헤브론에 있는
  alternatives_korean:
  - 헤브론에서
  - 헤브론의
  lexicon: HALOT
  rationale: 무덤이 위치한 도시를 자연스럽게 수식하도록 ‘헤브론에 있는’을 택했습니다.
- source_word: וַיִּשָּׂא אֶת קוֹלוֹ
  english_pob_choice: lifted up his voice
  chosen_korean: 소리를 높여
  alternatives_korean:
  - 목소리를 높여
  - 큰소리로
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서 자연스러운 비탄 표현으로 살리되, 문자적 ‘목소리를 들다’는 피했습니다.
- source_word: אֶל קֶבֶר אַבְנֵר
  english_pob_choice: at Abner’s grave
  chosen_korean: 아브넬의 무덤에서
