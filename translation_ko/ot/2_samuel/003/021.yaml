source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְנֵ֣ר אֶל דָּוִ֡ד אָק֣וּמָה וְֽ/אֵלֵ֡כָה וְ/אֶקְבְּצָה֩ אֶל אֲדֹנִ֨/י הַ/מֶּ֜לֶךְ אֶת כָּל יִשְׂרָאֵ֗ל וְ/יִכְרְת֤וּ אִתְּ/ךָ֙ בְּרִ֔ית וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וַ/יְּשַׁלַּ֥ח דָּוִ֛ד אֶת אַבְנֵ֖ר וַ/יֵּ֥לֶךְ בְּ/שָׁלֽוֹם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/021.yaml
  text: Abner said to David[a], “I will arise and go, and I will gather all Israel to my lord the king, so that they may make a covenant with you, and you shall reign over all that your soul desires.” Then David sent Abner away[c][b], and he went in peace.
  footnotes:
  - marker: a
    text: Hebrew literally, 'cut a covenant with you.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'over all that you desire'; Hebrew, 'over all that your soul desires.'
    reason: lexical_alternative
  - marker: c
    text: '''Went in peace'' is a Hebrew idiom for departing safely and on peaceful terms.'
    reason: cultural_note
translation:
  language: ko
  text: 아브넬이 다윗에게 말했습니다. 「내가 일어나 가서, 온 이스라엘을 내 주 왕께 모아 오겠습니다. 그러면 그들이 당신과 언약을 맺고, 당신은 당신의 영혼이 바라는 모든 것 위에 다스리게 될 것입니다.」 그때 다윗은 아브넬을 보내었고, 그는 평안히 갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 연속된 의지형을 반영한 표현입니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘당신의 영혼이 바라는 모든 것’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘평안히 갔다’는 히브리어 관용구로, 안전하게 떠나고 평화로운 관계로 헤어졌다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אָק֣וּמָה וְאֵלֵכָה וְאֶקְבְּצָה
  english_pob_choice: I will arise and go, and I will gather
  chosen_korean: 내가 일어나 가서, … 모아 오겠습니다
  alternatives_korean:
  - 내가 일어나 가서, … 모으겠습니다
  - 내가 일어나 가서, … 집결시키겠습니다
  lexicon: WLC/HALOT
  rationale: 세 개의 연속된 cohortative를 한국어의 의지형으로 살리되, ‘모으다’보다 정치적 통합의 뉘앙스가 살아 있는 ‘모아 오다’를 택해 다윗에게로 이끌어 오는 방향성을 드러냈습니다.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: to my lord the king
  chosen_korean: 내 주 왕께
  alternatives_korean:
  - 내 주님 왕께
  - 나의 주인 왕께
  lexicon: WLC/HALOT
  rationale: courtly 호칭을 살리되 현대 한국어에서 자연스러운 존칭 구조로 옮겼습니다. ‘주인’은 종속적 뉘앙스가 강해 문맥상 과합니다.
- source_word: וְיִכְרְתוּ אִתְּךָ בְּרִית
  english_pob_choice: so that they may make a covenant with you
  chosen_korean: 그러면 그들이 당신과 언약을 맺고
  alternatives_korean:
  - 그러면 그들이 당신과 계약을 맺고
  - 그러면 그들이 당신과 언약을 체결하고
  lexicon: WLC/HALOT
  rationale: כרת ברית의 표준 관용구를 ‘언약을 맺다’로 옮겼습니다. 교회적 문맥에서 익숙한 ‘언약’은 유지하되, 동사 표현은 현대어로 자연스럽게 처리했습니다.
- source_word: נַפְשֶׁךָ
  english_pob_choice: your soul desires
  chosen_korean: 당신의 영혼이 바라는
  alternatives_korean:
  - 당신이 바라는
  - 당신의 마음이 바라는
  lexicon: WLC/HALOT
  rationale: נפש를 ‘영혼’으로 보존하여 원문의 인류학적 표현을 살렸습니다. 한국어에서는 ‘영혼이 바라는’이 다소 직역적으로 들릴 수 있으나, 본문의 직설성을 유지하는 쪽을 택했습니다.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  english_pob_choice: and he went in peace
  chosen_korean: 그는 평안히 갔습니다
  alternatives_korean:
  - 그는 평안 가운데 떠났습니다
  - 그는 평화롭게 떠났습니다
  lexicon: WLC/HALOT
  rationale: 히브리어 관용구의 의미를 따라 안전한 출발과 화목한 이별을 함께 담는 표현으로 옮겼습니다. ‘평안히 갔다’가 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: 아브넬의 제안이 지닌 정치-언약적 성격
  chosen_reading: ‘언약을 맺고’로 옮겨, 단순한 동맹 제안이 아니라 왕권 승인과 결속을 동반한 언약 행위로 드러냈습니다.
  alternative_readings:
  - ‘동맹을 맺고’
  - ‘계약을 맺고’
  rationale: 본문의 בְּרִית는 단순한 정치 협정보다 더 무게 있는 관계 설정을 가리키므로, 한국어에서도 ‘언약’을 유지하는 것이 원문의 힘을 보존합니다.
  doctrine_reference: Translation philosophy §1, §6
