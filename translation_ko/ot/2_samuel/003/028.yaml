base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/028.yaml
  text: Afterward[a], when David heard of it, he said[b], “I and my kingdom are forever innocent before Yahweh of the blood of Abner son of Ner.”
  footnotes:
  - marker: a
    text: Or “After this” or “Later.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “from the bloods of Abner,” an idiom referring to responsibility for Abner’s bloodshed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후에 다윗이 그것을 듣고 말했습니다. “나는 나와 내 왕국이 영원히 야훼 앞에서 아브넬의 피에 대하여 무죄합니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 후에’는 ‘이후에’ ‘그 뒤에’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로는 ‘아브넬의 피들로부터’라는 관용구로, 유혈과 그에 대한 책임을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחֲרֵי כֵן
  english_pob_choice: Afterward
  chosen_korean: 그 후에
  alternatives_korean:
  - 그 뒤에
  - 이후에
  lexicon: HALOT
  rationale: 시간 순서를 자연스럽게 잇는 표현으로, 영어 POB의 'Afterward'에 해당하는 간결한 현대 한국어입니다.
- source_word: וַיִּשְׁמַע
  english_pob_choice: when David heard of it
  chosen_korean: 그것을 듣고
  alternatives_korean:
  - 그 소식을 듣고
  - 들었고
  lexicon: HALOT
  rationale: 히브리어 동사는 단순히 '듣다'를 뜻하며, 앞선 사건을 가리키는 대상을 문맥상 받아 '그것을'로 옮겼습니다.
- source_word: נָקִי
  english_pob_choice: innocent
  chosen_korean: 무죄합니다
  alternatives_korean:
  - 무죄입니다
  - 결백합니다
  - 죄가 없습니다
  lexicon: HALOT
  rationale: 법적·도덕적 책임이 없다는 선언이므로 '무죄합니다'가 가장 직접적이고 공적 선언문에 어울립니다.
- source_word: מִדְּמֵי אַבְנֵר בֶּן נֵר
  english_pob_choice: of the blood of Abner son of Ner
  chosen_korean: 아브넬의 피에 대하여
  alternatives_korean:
  - 아브넬의 피에서
  - 아브넬의 유혈에 대하여
  - 아브넬의 피의 책임에 대하여
  lexicon: HALOT
  rationale: 히브리어의 '피들' 관용구는 유혈과 그 책임을 가리키므로, POB의 직역성을 살리면서도 한국어에서 자연스럽게 '피에 대하여'로 처리했습니다.
