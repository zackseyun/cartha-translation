  text: 그 후에[a] 다윗이 그 소식을 듣고 말했습니다. “나와 내 왕국은 영원히 야훼 앞에서 넬의 아들 아브넬의 피에 대해서는 결백합니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
