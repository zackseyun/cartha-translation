  to: 그것이 요압의 머리와 그의 아버지 집안 전체 위에 내리기를 바랍니다. 또 요압의 집안에서는 몸에서 유출이 있는 자나 나병 환자[a]나 방추를 잡는 자[b]나 칼에 쓰러지는 자나 먹을 빵이 없는 자가 끊어지지 않기를 바랍니다.
