source:
  edition: WLC
  text: יָחֻ֨לוּ֙ עַל רֹ֣אשׁ יוֹאָ֔ב וְ/אֶ֖ל כָּל בֵּ֣ית אָבִ֑י/ו וְֽ/אַל יִכָּרֵ֣ת מִ/בֵּ֣ית יוֹאָ֡ב זָ֠ב וּ/מְצֹרָ֞ע וּ/מַחֲזִ֥יק בַּ/פֶּ֛לֶךְ וְ/נֹפֵ֥ל בַּ/חֶ֖רֶב וַ/חֲסַר לָֽחֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/029.yaml
  text: May it fall on the head of Joab and on all his father’s house[a], and may there never be cut off from the house of Joab one who has a discharge, or is leprous, or holds a staff, or falls by the sword[b], or lacks bread.
  footnotes:
  - marker: a
    text: Or, more broadly, “has a defiling skin disease.” The Hebrew term traditionally rendered “leprous” can refer to a range of serious skin conditions.
    reason: lexical_alternative
  - marker: b
    text: Or “holds a distaff”; some understand the phrase as “leans on a staff.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 요압의 머리와 그의 아버지의 온 집에 내리기를 원합니다[a]. 또 요압의 집에서 분비물이 있는 자나 나병환자나 지팡이를 잡은 자나 칼에 죽는 자나 빵이 없는 자가 끊어지지 않기를 원합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 넓게, “더럽히는 피부병이 있다.” 히브리어로 전통적으로 ‘나병환자’로 옮기는 말은 여러 심한 피부 질환을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “물레를 잡은 자”; 어떤 해석은 “지팡이에 의지한 자”로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֻלוּ עַל רֹאשׁ
  english_pob_choice: May it fall on the head of
  chosen_korean: 머리와 … 내리기를 원합니다
  alternatives_korean:
  - 머리 위에 떨어지기를 원합니다
  - 머리 위에 임하기를 원합니다
  lexicon: HALOT
  rationale: 원문은 머리에 임하는 저주를 뜻하므로, 한국어에서는 자연스럽게 ‘내리다’로 옮겨 저주·죄책이 덮이는 뉘앙스를 살렸습니다.
- source_word: בֵּית אָבִיו
  english_pob_choice: his father’s house
  chosen_korean: 그의 아버지의 온 집
  alternatives_korean:
  - 그의 조상의 집
  - 그의 가족
  lexicon: HALOT
  rationale: 가문 전체를 가리키는 표현을 직역에 가깝게 유지하되, ‘온’으로 범위를 분명히 했습니다.
- source_word: מְצֹרָע
  english_pob_choice: is leprous
  chosen_korean: 나병환자
  alternatives_korean:
  - 문둥병에 걸린 자
  - 심한 피부병이 있는 자
  lexicon: HALOT
  rationale: 한국어 교회 언어에서 통용되는 짧은 표현을 쓰되, 원문의 더 넓은 피부 질환 범위는 a 각주로 보완했습니다.
- source_word: מַחֲזִיק בַּפֶּלֶךְ
  english_pob_choice: holds a staff
  chosen_korean: 지팡이를 잡은 자
  alternatives_korean:
  - 물레를 잡은 자
  - 방추를 잡은 자
  lexicon: HALOT
  rationale: 영어 POB의 검토 흐름을 반영해 פֶּלֶךְ을 보행 보조의 이미지로 이해하여 ‘지팡이’로 옮겼습니다.
- source_word: חֲסַר לָחֶם
  english_pob_choice: lacks bread
  chosen_korean: 빵이 없는 자
  alternatives_korean:
  - 양식이 없는 자
  - 먹을 것이 없는 자
  lexicon: HALOT
  rationale: ‘빵’은 생존을 가리키는 음식의 환유를 살리면서도 현대 한국어에서 즉시 이해되도록 했습니다.
