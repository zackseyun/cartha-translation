    rationale: 인용문 끝의 ‘알지 못하느냐?’는 해라체 질문형입니다. 대상 변종의 현대 공식-공손체에 맞춰 ‘알지 못합니까?’로 고쳐야 합니다.
  - severity: low
    issue: ‘고관’이 שַׂר의 의미를 다소 협소하게 만듭니다.
