source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ אֶל עֲבָדָ֑י/ו הֲ/ל֣וֹא תֵדְע֔וּ כִּי שַׂ֣ר וְ/גָד֗וֹל נָפַ֛ל הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/038.yaml
  text: Then the king said to his servants[a], “Do you not know that a prince and a great man has fallen today in Israel?”
  footnotes:
  - marker: a
    text: Or 'a leader and a great man.' The Hebrew שַׂר can denote a prince, commander, ruler, or leading official.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 그의 종들에게 말했습니다. “오늘 이스라엘에서 한 지도자[a]이자 큰 인물이 쓰러졌다는 것을 너희는 알지 못합니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “고관”으로 옮길 수 있습니다. 히브리어 שַׂר는 왕자, 지휘관, 통치자, 고위 관리 등을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 왕님
  lexicon: HALOT
  rationale: 왕의 신분을 직접 살리되, 현대 한국어에서 자연스러운 표준어로 옮겼습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들
  alternatives_korean:
  - 그의 신하들
  - 그의 관리들
  lexicon: HALOT
  rationale: court context를 고려하되, עבד의 기본 의미를 유지하기 위해 ‘종들’을 택했습니다. ‘신하들’은 직무적 뉘앙스를 더 강하게 만들 수 있습니다.
- source_word: הֲלוֹא תֵדְעוּ
  english_pob_choice: Do you not know
  chosen_korean: 너희가 알지 못하느냐
  alternatives_korean:
  - 너희가 모르느냐
  - 너희가 알지 않느냐
  lexicon: HALOT
  rationale: 수사적 질문의 압박감을 살리기 위해 직설적 문형을 유지했습니다.
- source_word: שַׂר
  english_pob_choice: a prince / a leader
  chosen_korean: 고관
  alternatives_korean:
  - 지도자
  - 군대 장관
  - 통치자
  lexicon: HALOT
  rationale: 본문의 인물이 아브넬처럼 군정 권위를 지닌 고위 인물이라는 점을 반영해, 한국어에서 위상을 드러내는 ‘고관’을 사용했습니다.
- source_word: וְגָדוֹל
  english_pob_choice: and a great man
  chosen_korean: 그리고 큰 인물
  alternatives_korean:
  - 그리고 위대한 사람
  - 그리고 중요한 사람
  lexicon: HALOT
  rationale: ‘큰’은 지위와 중요성을 함께 포괄하는 완곡하지만 강한 표현이며, ‘인물’은 사람 자체의 중량감을 살립니다.
- source_word: נָפַל
  english_pob_choice: has fallen
  chosen_korean: 쓰러진
  alternatives_korean:
  - 죽은
  - 떨어진
  - 넘어진
  lexicon: HALOT
  rationale: 죽음을 직접 말하는 관용을 한국어에서 자연스럽게 살리기 위해 ‘쓰러진’을 택했습니다. 서술의 격식을 유지하면서도 죽음을 암시합니다.
theological_decisions:
- issue: 수사적 질문의 어조
  chosen_reading: 왕의 탄식과 책망이 섞인 질문을 그대로 살려, 한국어에서도 질문형을 유지했습니다.
  alternative_readings:
  - “너희는 알아야 한다”
  - “너희가 당연히 알지 않느냐”
  rationale: 히브리어 הֲלֹא는 단순 정보 확인이 아니라 청자에게 상식을 상기시키는 수사적 질문이므로, 의미를 완화하지 않았습니다.
  doctrine_reference: 본문 맥락상 서술적·수사적 의미 보존
