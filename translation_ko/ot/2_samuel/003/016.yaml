  text: Her husband went with her[a], walking and weeping behind her as far as Bahurim. Then Abner said to him, “Go[b], return.” So he returned.
  footnotes:
  - marker: a
    text: Or “after her” for “behind her.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “Go, return,” an emphatic double command; alternatively, “Go back.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여자의 남편이 그 여자와 함께 가며, 그 여자의 뒤를 따라[a] 울면서 바후림까지 갔습니다. 그때 아브넬이 그에게 말했습니다. “가시오, 돌아가시오.”[b] 그래서 그는 돌아갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 여자의 뒤에’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘가라, 돌아가라’라는 두 명령입니다. 또한 ‘돌아가시오’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישָׁהּ
  english_pob_choice: her husband
  chosen_korean: 그의 남편
  alternatives_korean:
