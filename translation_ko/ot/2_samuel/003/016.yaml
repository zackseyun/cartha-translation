base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/016.yaml
  text: Her husband went with her[a], walking and weeping behind her as far as Bahurim. Then Abner said to him, “Go[b], return.” So he returned.
  footnotes:
  - marker: a
    text: Or “after her” for “behind her.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “Go, return,” an emphatic double command; alternatively, “Go back.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 남편이 그녀와 함께 가면서, 그녀의 뒤를 따라 울며 바후림까지 갔습니다. 그때 아브넬이 그에게 말했습니다. 「가시오, 돌아가시오.」 그래서 그는 돌아갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그녀의 뒤를 따라’는 영어 POB의 ‘behind her’와 같은 방향성을 풀어쓴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘가라, 돌아가라’라는 이중 명령입니다. 한국어에서는 이를 나누어 보존했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישָׁהּ
  english_pob_choice: her husband
  chosen_korean: 그의 남편
  alternatives_korean:
  - 그의 남자
  - 남편
  lexicon: HALOT
  rationale: 문맥상 3인칭 여성 소유격이 붙은 אִישׁ는 단순한 ‘남자’보다 ‘남편’으로 구체화하는 것이 정확하며, 한국어에서는 소유를 풀어쓴 ‘그의 남편’이 자연스럽습니다.
- source_word: הָלוֹךְ וּבָכֹה
  english_pob_choice: walking and weeping
  chosen_korean: 가면서, … 울며
  alternatives_korean:
  - 계속 가며 울며
  - 걸어가며 울며
  lexicon: HALOT
  rationale: 동사적 반복과 지속성을 살리되, 한국어에서는 ‘가면서…울며’가 진행성과 장면감을 가장 자연스럽게 전달합니다.
- source_word: אַחֲרֶיהָ
  english_pob_choice: behind her
  chosen_korean: 그녀의 뒤를 따라
  alternatives_korean:
  - 뒤에서
  - 그녀 뒤에
  lexicon: HALOT
  rationale: 영어 POB의 공간적 뉘앙스와 히브리어의 추적 방향을 살리기 위해 ‘뒤를 따라’로 옮겼습니다.
- source_word: לֵךְ שׁוּב
  english_pob_choice: Go, return
  chosen_korean: 가시오, 돌아가시오
  alternatives_korean:
  - 가시오, 돌아오시오
  - 가시오, 되돌아가시오
  - 돌아가시오
  lexicon: HALOT
  rationale: 히브리어의 두 명령형을 모두 드러내기 위해 분리해 번역했고, 한국어에서는 명령의 직접성을 살리면서도 현대 합쇼체에 맞게 정리했습니다.
theological_decisions:
- issue: Abner의 이중 명령 표현
  chosen_reading: 두 개의 명령을 각각 살려 ‘가시오, 돌아가시오’로 번역했습니다.
  alternative_readings:
  - ‘돌아가시오’로만 단순화
  - ‘가서 돌아가시오’로 통합
  rationale: 원문은 לֵךְ שׁוּב의 이중 명령으로 압축된 강한 지시를 담고 있으므로, 이를 단일 명령으로 약화하지 않도록 했습니다.
  doctrine_reference: source fidelity / discourse force
