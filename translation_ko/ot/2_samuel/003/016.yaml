  to: 그 여자의 남편이 그 여자와 함께 가며, 그 여자의 뒤를 따라[a] 울면서 바후림까지 갔습니다. 그때 아브넬이 그에게 말했습니다. “가시오, 돌아가시오.”[b] 그래서 그는 돌아갔습니다.
