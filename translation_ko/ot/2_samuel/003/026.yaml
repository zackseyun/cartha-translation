  yaml_path: translation/ot/2_samuel/003/026.yaml
  text: Then Joab went out from David and sent messengers after Abner[a], and they brought him back from the well of Sirah. But David did not know it.
  footnotes:
  - marker: a
    text: Or possibly, 'from Bor-sirah,' treating the Hebrew as a place-name rather than 'the well of Sirah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요압이 다윗에게서 나가서 아브넬을 뒤쫓아 사자들을 보냈고, 그들은 그를 시라의 우물에서 데려왔습니다. 그러나 다윗은 그것을 알지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보르-시라에서’로 이해하여, 히브리어를 ‘시라의 우물’이 아니라 지명으로 볼 수도 있습니다.
    reason: lexical_alternative
