  lexicon: HALOT
  rationale: 아비새와 요압의 형제 관계를 간명하게 드러내기 위해 ‘형제’보다 구체적인 친족어를 사용했습니다.
- source_word: הָרְג֖וּ לְ/אַבְנֵ֑ר
  english_pob_choice: killed Abner
  chosen_korean: 아브넬을 죽였습니다
  alternatives_korean:
  - 아브넬을 살해했습니다
  - 아브넬을 쳐 죽였습니다
  lexicon: HALOT
  rationale: הרג의 기본 의미를 과잉 해석 없이 현대 한국어로 옮기기 위해 중립적인 ‘죽였습니다’를 사용했습니다.
- source_word: עַל֩ אֲשֶׁ֨ר הֵמִ֜ית
  english_pob_choice: because he had killed
  chosen_korean: …죽인 일 때문에
  alternatives_korean:
