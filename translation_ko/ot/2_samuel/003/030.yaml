  - …죽인 까닭에
  lexicon: HALOT
  rationale: 원문의 인과관계를 자연스럽게 드러내되, 앞선 살해 사건이 원인이었음을 한국어에서도 분명히 하도록 과거완료적 관계를 표현했습니다.
- source_word: בְּ/גִבְע֖וֹן בַּ/מִּלְחָמָֽה
  english_pob_choice: at Gibeon in the battle
  chosen_korean: 기브온의 전투에서
  alternatives_korean:
  - 기브온에서의 전투에서
  - 기브온에서 벌어진 전투에서
  lexicon: HALOT
  rationale: 지명과 전투 상황을 함께 유지하면서도 문장을 간결하게 하기 위해 ‘기브온의 전투에서’로 옮겼습니다.
theological_decisions:
- issue: 보복 행위의 서술 방식
  chosen_reading: 본문은 요압과 아비새의 행위를 사실대로 진술하며, 별도의 도덕적 평가어를 덧붙이지 않았습니다.
  alternative_readings:
  - 아브넬을 살해했습니다처럼 법적·도덕적 판단을 강하게 드러내는 번역
  - 아브넬을 죽였다는 중립적 서술
  rationale: 히브리어는 행위와 이유를 제시할 뿐 ‘살인’에 해당하는 별도 법적 평가어를 사용하지 않으므로, 번역도 서술적 중립성을 유지했습니다.
  doctrine_reference: 본문의 서술 범위와 서술자 평가의 구분
