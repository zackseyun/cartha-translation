base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/030.yaml
  text: So Joab and Abishai his brother killed Abner because he had killed Asahel their brother at Gibeon in the battle[a].
  footnotes:
  - marker: a
    text: Or 'And Joab and Abishai his brother killed Abner.' The Hebrew conjunction can be rendered simply 'and'; 'so' brings out the explanatory connection to the surrounding context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 요압과 그의 형제 아비새는 기브온의 전투에서 그들의 형제 아사헬을 죽인 일 때문에 아브넬을 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 요압과 그의 형제 아비새는 아브넬을 죽였습니다.’ 히브리어 접속사는 단순한 ‘그리고’로도 옮길 수 있으며, ‘그리하여’는 앞 문맥과의 설명적 연결을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב֙ וַ/אֲבִישַׁ֣י
  english_pob_choice: So Joab and Abishai
  chosen_korean: 그리하여 요압과 그의 형 아비새
  alternatives_korean:
  - 그리고 요압과 그의 형 아비새
  - 그래서 요압과 그의 형 아비새
  lexicon: HALOT
  rationale: 연결 접속사의 서사적·설명적 흐름을 살리기 위해 ‘그리하여’를 택했고, 인명은 한국어 성서에서 널리 쓰이는 표기를 따랐습니다.
- source_word: אָחִ֔י/ו
  english_pob_choice: his brother
  chosen_korean: 그의 형
  alternatives_korean:
  - 그의 동생
  - 그의 형제
  lexicon: HALOT
  rationale: 아비새와 요압의 형제 관계를 간명하게 드러내기 위해 ‘형제’보다 구체적인 친족어를 사용했습니다.
- source_word: הָרְג֖וּ לְ/אַבְנֵ֑ר
  english_pob_choice: killed Abner
  chosen_korean: 아브넬을 죽였습니다
  alternatives_korean:
  - 아브넬을 살해했습니다
  - 아브넬을 쳐 죽였습니다
  lexicon: HALOT
  rationale: הרג의 기본 의미를 과잉 해석 없이 현대 한국어로 옮기기 위해 중립적인 ‘죽였습니다’를 사용했습니다.
- source_word: עַל֩ אֲשֶׁ֨ר הֵמִ֜ית
  english_pob_choice: because he had killed
  chosen_korean: …죽인 일 때문에
  alternatives_korean:
  - …죽였기 때문에
  - …죽인 까닭에
  lexicon: HALOT
  rationale: 원문의 인과관계를 자연스럽게 드러내되, 앞선 살해 사건이 원인이었음을 한국어에서도 분명히 하도록 과거완료적 관계를 표현했습니다.
- source_word: בְּ/גִבְע֖וֹן בַּ/מִּלְחָמָֽה
  english_pob_choice: at Gibeon in the battle
  chosen_korean: 기브온의 전투에서
  alternatives_korean:
  - 기브온에서의 전투에서
  - 기브온에서 벌어진 전투에서
  lexicon: HALOT
  rationale: 지명과 전투 상황을 함께 유지하면서도 문장을 간결하게 하기 위해 ‘기브온의 전투에서’로 옮겼습니다.
theological_decisions:
- issue: 보복 행위의 서술 방식
  chosen_reading: 본문은 요압과 아비새의 행위를 사실대로 진술하며, 별도의 도덕적 평가어를 덧붙이지 않았습니다.
  alternative_readings:
  - 아브넬을 살해했습니다처럼 법적·도덕적 판단을 강하게 드러내는 번역
  - 아브넬을 죽였다는 중립적 서술
  rationale: 히브리어는 행위와 이유를 제시할 뿐 ‘살인’에 해당하는 별도 법적 평가어를 사용하지 않으므로, 번역도 서술적 중립성을 유지했습니다.
  doctrine_reference: 본문의 서술 범위와 서술자 평가의 구분
