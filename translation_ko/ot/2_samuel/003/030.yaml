  - 그래서 요압과 그의 형 아비새
  lexicon: HALOT
  rationale: 연결 접속사의 서사적·설명적 흐름을 살리기 위해 ‘그리하여’를 택했고, 인명은 한국어 성서에서 널리 쓰이는 표기를 따랐습니다.
- source_word: אָחִ֔י/ו
  english_pob_choice: his brother
  chosen_korean: 그의 형
