theological_decisions:
- issue: 정혼과 아내라는 관계 표지의 긴장
  chosen_reading: ‘내 아내’와 ‘정혼시켰습니다’를 함께 유지해, 다윗의 관계 주장과 법적 근거를 함께 드러냈습니다.
  alternative_readings:
  - ‘내 아내’를 ‘내 여자’나 ‘내 신부’로 완화하는 읽기
  - ‘정혼’ 대신 단순히 ‘결혼시켰습니다’로 평탄화하는 읽기
  rationale: 원문은 이미 혼인 상태를 지칭하면서도 정혼/대가의 근거를 함께 제시하므로, 한국어에서도 그 긴장을 해소하지 않고 보존하는 것이 소스에 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
