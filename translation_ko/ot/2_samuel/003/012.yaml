base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/012.yaml
  text: Then Abner sent messengers to David on his behalf[a], saying, “To whom does the land belong?” saying, “Make your covenant with me, and behold[b], my hand is with you to bring all Israel over to you.”
  footnotes:
  - marker: a
    text: Or, “To whom does the land belong?” The Hebrew is terse and may imply a claim about rightful rule.
    reason: alternative_reading
  - marker: b
    text: 'Hebrew: “my hand is with you,” an idiom expressing support or power on David’s side.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아브넬이 다윗에게 자기 대신 사자들을 보내어 이렇게 말하게 했습니다. 「땅이 누구의 것입니까?」 또 이렇게 말하게 했습니다. 「나와 언약을 맺으십시오. 보십시오, 내 손이 당신과 함께 있습니다. 온 이스라엘을 당신에게로 돌아서게 하려고 합니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 간결하여 ‘땅이 누구의 것입니까?’라는 질문이 곧바로 합법적 소유와 통치권을 둘러싼 주장일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 직역은 “내 손이 당신과 함께 있습니다”이며, 지원과 권세를 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תחתו
  english_pob_choice: on his behalf
  chosen_korean: 자기 대신
  alternatives_korean:
  - 그를 대신하여
  - 그의 편으로
  lexicon: HALOT
  rationale: 아브넬이 사자들을 보내는 대리 관계를 자연스럽게 드러내면서도, 원문의 대리·대표 뉘앙스를 유지합니다.
- source_word: לְמִי אָרֶץ
  english_pob_choice: To whom does the land belong?
  chosen_korean: 땅이 누구의 것입니까?
  alternatives_korean:
  - 누구에게 땅이 속합니까?
  - 이 땅은 누구의 것입니까?
  lexicon: HALOT
  rationale: 히브리어의 간결한 수사 의문을 한국어로 압축해 살리되, 소유와 통치에 대한 질문이라는 중의성을 너무 풀어쓰지 않았습니다.
- source_word: כָּרְתָה בְרִיתְךָ אִתִּי
  english_pob_choice: Make your covenant with me
  chosen_korean: 나와 언약을 맺으십시오
  alternatives_korean:
  - 나와 계약을 맺으십시오
  - 나와 언약을 세우십시오
  lexicon: HALOT
  rationale: כרת ברית의 관용구를 직역보다 한국어에서 자연스러운 ‘언약을 맺다’로 옮기되, 고대 언약 언어를 보존했습니다.
- source_word: וְהִנֵּה יָדִי עִמָּךְ
  english_pob_choice: and behold, my hand is with you
  chosen_korean: 보십시오, 내 손이 당신과 함께 있습니다
  alternatives_korean:
  - 보라, 내 손이 당신 편에 있습니다
  - 그리고 내 손은 당신과 함께 있습니다
  lexicon: HALOT
  rationale: ‘손’의 비유를 그대로 살려 지원과 권세의 뉘앙스를 유지했고, ‘보십시오’로 주의를 환기하는 수사도 반영했습니다.
- source_word: לְהָסֵב אֵלֶיךָ אֶת כָּל יִשְׂרָאֵל
  english_pob_choice: to bring all Israel over to you
  chosen_korean: 온 이스라엘을 당신에게로 돌아서게 하려고 합니다
  alternatives_korean:
  - 온 이스라엘을 당신 편으로 돌리려고 합니다
  - 온 이스라엘을 당신에게로 옮기려고 합니다
  lexicon: HALOT
  rationale: 정치적 충성의 이동을 나타내는 동사를 한국어의 ‘돌아서게 하다’로 표현해, 단순한 이동이 아니라 편입·전환의 의미를 드러냈습니다.
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들
  - 사신들
  lexicon: HALOT
  rationale: 정치적 상황에서 인간 전달자를 가리키므로 ‘사자들’ 또는 ‘사신들’이 가능하지만, 본문 내 대리 파견의 성격을 살려 ‘사자들’을 택했습니다.
theological_decisions:
- issue: לְמִי אָרֶץ의 수사적·정치적 함의
  chosen_reading: 질문형을 유지해 다윗의 정당한 통치권을 둘러싼 긴장을 드러냈습니다.
  alternative_readings:
  - ‘땅은 누구의 것입니까?’로 더 직설적으로 옮김
  - ‘누가 이 땅을 다스립니까?’로 해석해 옮김
  rationale: 원문은 간결한 수사 의문으로 되어 있어, 의미를 미리 해석해 확정하지 않고 정치적 긴장을 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: '번역 원칙: 원문이 허용하는 긴장을 해소하지 말 것'
