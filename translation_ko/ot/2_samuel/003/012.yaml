  to: 그러자 아브넬이 자기 이름으로 사자들을 다윗에게 보내어 이렇게 전했습니다. 「땅이 누구의 것입니까?」 또 이렇게 전했습니다. 「나와 언약을 맺으십시오. 보십시오, 내 손이 당신과 함께 있습니다[b]. 온 이스라엘을 당신에게로 돌아서게 하려고 합니다.」[a]
  rationale: 사자 파견의 대표·공식 전달 성격을 ‘자기 이름으로’로 명료하게 하고, 한국어의 부자연스러운 이중 사역 표현을 ‘전했습니다’로 고쳤습니다. 원문의 반복된 ‘말하여’를 보존했으며, 언약·손·이스라엘이라는 핵심 표현과 수사 의문의 개방성은 유지했습니다. 각주 a는 실제로 설명하는 질문 바로 뒤로 옮겨야 하므로, 해당 문장 뒤에 배치하는 것이 바람직합니다.
