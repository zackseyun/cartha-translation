  naturalness: 초안의 ‘말하게 했습니다’는 사자에게 발화를 시킨다는 중첩된 사역 표현으로 다소 부자연스럽습니다. ‘전했습니다’가 사신의 전달 행위와 문맥에 맞습니다. 각주 표지도 해당 어구 바로 뒤에 배치하는 것이 독자의 이해에 적절합니다.
