base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/007.yaml
  text: Now Saul had a concubine whose name was Rizpah daughter of Aiah. And Ish-bosheth said to Abner[a], “Why did you go in to my father’s concubine?”
  footnotes:
  - marker: a
    text: Or, more explicitly, “Why did you have relations with my father’s concubine?” The Hebrew says “go in to,” a common sexual euphemism.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울에게는 첩이 있었는데, 이름은 리스바였으며 아야의 딸이었습니다. 이스보셋이 아브넬에게 말했습니다. “왜 내 아버지의 첩에게 들어갔습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 좀 더 직접적으로는 “왜 내 아버지의 첩과 관계를 맺었습니까?”입니다. 히브리어 ‘들어가다’는 여기서 흔한 성적 완곡어법입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשָׁאוּל
  english_pob_choice: Now Saul had
  chosen_korean: 사울에게는 …이 있었습니다
  alternatives_korean:
  - 그리고 사울에게는 …이 있었습니다
  - 사울에게도 …이 있었습니다
  - 사울에게 …이 있었습니다
  lexicon: HALOT
  rationale: 앞의 접두사와 소유/존재 구문은 한국어에서 ‘-에게는 …이 있었습니다’로 자연스럽게 배경 정보를 제시하는 것이 가장 무리 없습니다.
- source_word: פִּלֶגֶשׁ
  english_pob_choice: concubine
  chosen_korean: 첩
  alternatives_korean:
  - 후궁
  - 부차적 아내
  lexicon: HALOT
  rationale: 히브리어의 사회-법적 지위를 가장 직접적으로 드러내는 한국어는 ‘첩’입니다.
- source_word: בָּאתָה אֶל
  english_pob_choice: did you go in to
  chosen_korean: 들어갔습니까
  alternatives_korean:
  - 들어가셨습니까
  - 관계를 맺었습니까
  lexicon: HALOT
  rationale: 본문의 완곡어법을 살리기 위해 직역적 의미인 ‘들어가다’를 유지했고, 노골적 해설어인 ‘관계를 맺다’는 본문의 표현력을 평탄화할 수 있어 본문에는 넣지 않았습니다.
- source_word: רִצְפָּה בַת אַיָּה
  english_pob_choice: Rizpah daughter of Aiah
  chosen_korean: 리스바 … 아야의 딸
  alternatives_korean:
  - 르스바 … 아야의 딸
  - 리스바 … 아야의 딸로서
  lexicon: HALOT
  rationale: 고유명사는 통용되는 음역을 따르고, בן/בת 구조는 ‘아야의 딸’로 간명하게 옮겼습니다.
theological_decisions:
- issue: אַבְנֵר에게 말하는 이의 신원
  chosen_reading: 문맥상 화자는 앞절의 이스보셋이므로 한국어 본문에서도 주어를 분명히 밝혔습니다.
  alternative_readings:
  - 그가 아브넬에게 말했습니다
  - 아브넬에게 말했습니다
  rationale: 전개상 발화자를 명시하는 것이 서사적 오해를 줄이며, 본문 의미를 추가하지 않습니다.
  doctrine_reference: 서사 문맥의 명시적 대명사 해소
