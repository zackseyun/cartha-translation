  source_fidelity: 히브리어는 그날 모든 백성과 온 이스라엘이 아브넬의 죽임이 왕에게서 비롯된 것이 아님을 알았다고 말합니다. 초안은 출처·기원의 의미를 적절히 살렸으나, ‘아브넬… 죽이는 일’이 다음 문장으로 분리되어 원문의 보어 관계가 끊기고 한국어 문장도 파편화되었습니다.
