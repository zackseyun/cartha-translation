base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/037.yaml
  text: So all the people and all Israel knew on that day that it was not from the king to put Abner son of Ner to death[a].
  footnotes:
  - marker: a
    text: Or, 'it was not from the king' or 'the king had not ordered it.' The Hebrew speaks of the matter's source or origin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 그날 모든 백성과 온 이스라엘은 넬의 아들 아브넬을 죽이는 일이 왕에게서 비롯된 것이 아니었다는 것을 알게 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이 일이 왕에게서 나온 것이 아니라는 출처 또는 기원을 말합니다. ‘왕이 명령하지 않았다’로도 이해할 수 있지만, 본문은 그보다 넓은 출처의 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדְעוּ
  english_pob_choice: knew
  chosen_korean: 알게 되었습니다
  alternatives_korean:
  - 알았습니다
  - 알게 되었습니다
  lexicon: HALOT
  rationale: 서술적 완료를 자연스럽게 살리면서, 단순한 지식보다 사실을 깨닫게 된 뉘앙스를 반영합니다.
- source_word: כָל הָעָם וְכָל יִשְׂרָאֵל
  english_pob_choice: all the people and all Israel
  chosen_korean: 모든 백성과 온 이스라엘
  alternatives_korean:
  - 온 백성과 온 이스라엘
  - 모든 사람과 온 이스라엘
  lexicon: HALOT
  rationale: הָעָם을 백성으로, יִשְׂרָאֵל을 집합적 민족 표현인 온 이스라엘로 옮겨 병렬 구조를 유지했습니다.
- source_word: מֵהַמֶּלֶךְ
  english_pob_choice: it was not from the king
  chosen_korean: 왕에게서 난 일이 아니라는 것
  alternatives_korean:
  - 왕에게서 온 것이 아니라는 것
  - 왕의 명령이 아니라는 것
  lexicon: HALOT
  rationale: מן의 출처·기원을 드러내는 표현이므로, 단순한 책임 부인이나 명령 부재로 좁히지 않고 ‘왕에게서 난 일’로 옮겼습니다.
- source_word: לְהָמִית
  english_pob_choice: to put ... to death
  chosen_korean: 죽이는 일
  alternatives_korean:
  - 죽게 하는 일
  - 사형에 처하는 일
  lexicon: HALOT
  rationale: 히필 부정사가 ‘죽게 하다’의 원인적 의미를 가지므로, 지나치게 법적 뉘앙스를 넣는 ‘사형’보다 중립적으로 ‘죽이는 일’로 옮겼습니다.
- source_word: אֶת אַבְנֵר בֶּן נֵר
  english_pob_choice: Abner son of Ner
  chosen_korean: 아브넬, 곧 넬의 아들
  alternatives_korean:
  - 아브넬, 넬의 아들
  - 넬의 아들 아브넬
  lexicon: HALOT
  rationale: 고유명사는 통용 표기를 따르되, 동격 설명을 ‘곧’으로 풀어 혈통 관계를 분명히 했습니다.
theological_decisions:
- issue: וַיֵּדְעוּ의 결과 진술과 출처 부정의 범위
  chosen_reading: 이 구절은 다윗의 책임 여부를 넓게 논평하기보다, 아브넬의 죽음이 ‘왕에게서 난 일’이 아니라는 출처 진술에 초점을 둡니다.
  alternative_readings:
  - 왕이 무죄였다는 선언
  - 왕이 명령하지 않았다는 법적 진술
  rationale: 히브리어는 מקור/출처를 말할 뿐, 무죄 판결이나 법적 면책을 직접 선언하지 않으므로 그보다 좁은 의미를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3
