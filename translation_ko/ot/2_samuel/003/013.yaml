base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/013.yaml
  text: 'He said[a], “Good. I will make a covenant with you. Only one thing I ask of you: You shall not see my face unless you first bring Michal, Saul’s daughter, when you come to see my face.”'
  footnotes:
  - marker: a
    text: Or, “You shall not appear before me unless you first bring Michal, Saul’s daughter, when you come to appear before me.” The Hebrew literally says, “see my face.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「좋습니다. 내가 당신과 언약을 맺겠습니다. 다만 한 가지를 당신에게 요구합니다. 당신이 먼저 사울의 딸 미갈을 데리고 올 때까지는 내 얼굴을 보지 못할 것입니다. 당신이 내 얼굴을 보러 올 때에 말입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 얼굴을 보라’는 뜻이므로, ‘나를 대면하다’의 의미로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: Good
  chosen_korean: 좋습니다
  alternatives_korean:
  - 좋군요
  - 잘됐습니다
  - 알겠습니다
  lexicon: HALOT
  rationale: 짧은 동의의 감탄사를 한국어 합쇼체로 자연스럽게 옮기되, 원문의 간결한 승인 어감을 유지했습니다.
- source_word: אֶכְרֹת ... בְּרִית
  english_pob_choice: I will make a covenant
  chosen_korean: 언약을 맺겠습니다
  alternatives_korean:
  - 언약을 세우겠습니다
  - 언약을 체결하겠습니다
  - 언약을 끊겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 직접성은 살리되 한국어에서는 ‘맺다’가 가장 자연스럽고, POB의 covenant를 ‘언약’으로 일관되게 반영했습니다.
- source_word: לֹא תִרְאֶה אֶת פָּנַי
  english_pob_choice: You shall not see my face
  chosen_korean: 내 얼굴을 보지 못할 것입니다
  alternatives_korean:
  - 내 얼굴을 볼 수 없습니다
  - 내 앞에 나오지 못할 것입니다
  - 내 얼굴을 뵙지 못할 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴을 보다’ 관용구를 유지하되 한국어 독자에게 자연스럽게 전달되는 표현으로 옮겼습니다. ‘뵙다’는 지나치게 공손한 뉘앙스를 만들어 원문의 긴장을 약화시킬 수 있어 피했습니다.
- source_word: מִיכַל בַּת שָׁאוּל
  english_pob_choice: Michal, Saul’s daughter
  chosen_korean: 사울의 딸 미갈
  alternatives_korean:
  - 미갈, 사울의 딸
  - 사울의 딸인 미갈
  - 미갈
  lexicon: HALOT
  rationale: 인명과 혈연관계를 표준적인 한국어 어순으로 제시해 식별성을 높였습니다.
theological_decisions:
- issue: 접속 구조와 조건문의 힘
  chosen_reading: ‘다만 한 가지를… 요구합니다’와 ‘…까지는’으로 예외 조건을 분명히 드러냈습니다.
  alternative_readings:
  - ‘오직 하나를… 묻습니다’
  - ‘…하기 전에는’
  rationale: 히브리어 אַךְ와 לִפְנֵי/כִּי אִם의 제한·선행 조건을 약화하지 않도록, 단호한 조건문으로 옮겼습니다.
  doctrine_reference: 본문의 서술적 의미 보존 원칙
- issue: ‘내 얼굴을 보다’ 관용구 보존
  chosen_reading: 원문의 관용구를 살리되 의미상 ‘나를 대면하다’로 과도하게 풀지 않았습니다.
  alternative_readings:
  - ‘내 앞에 나오다’
  - ‘나를 뵙다’
  rationale: 히브리어 표현의 왕실/대면 뉘앙스를 유지하는 것이 본문 긴장과 요구 조건의 성격을 더 잘 드러냅니다.
  doctrine_reference: 본문의 문학적·서사적 맥락 보존
