base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/013.yaml
  text: 'He said[a], “Good. I will make a covenant with you. Only one thing I ask of you: You shall not see my face unless you first bring Michal, Saul’s daughter, when you come to see my face.”'
  footnotes:
  - marker: a
    text: Or, “You shall not appear before me unless you first bring Michal, Saul’s daughter, when you come to appear before me.” The Hebrew literally says, “see my face.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「좋습니다. 내가 당신과 언약을 맺겠습니다. 다만 한 가지를 당신에게 요청합니다. 당신이 내 얼굴을 보러 올 때, 먼저 사울의 딸 미갈을 데리고 오지 않으면 내 얼굴을 보지 못할 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 얼굴을 보다’입니다. 이는 ‘나를 대면하다’ 또는 ‘내 앞에 나아가다’라는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
