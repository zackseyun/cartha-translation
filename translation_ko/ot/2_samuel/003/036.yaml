  text: וְ/כָל הָ/עָ֣ם הִכִּ֔ירוּ וַ/יִּיטַ֖ב בְּ/עֵֽינֵי/הֶ֑ם כְּ/כֹל֙ אֲשֶׁ֣ר עָשָׂ֣ה הַ/מֶּ֔לֶךְ בְּ/עֵינֵ֥י כָל הָ/עָ֖ם טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/036.yaml
  text: And all the people recognized it[a], and it was good in their eyes; for everything the king did was good in the eyes of all the people.
  footnotes:
  - marker: a
    text: Or 'it pleased them.' The Hebrew idiom literally says 'it was good in their eyes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 온 백성은 그것을 알아차렸고, 그들의 눈에는 좋았습니다. 이는 왕이 한 모든 일이 온 백성의 눈에도 좋았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로 ‘그들의 눈에 좋았다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכִּירוּ
  english_pob_choice: recognized it
  chosen_korean: 알아차렸고
  alternatives_korean:
  - 인식했고
  - 알아보았고
  lexicon: HALOT
  rationale: 문맥상 백성이 사건의 의미를 파악하고 받아들였다는 뜻이므로, 단순한 지적 인식보다 자연스러운 현대어인 ‘알아차리다’로 옮겼습니다.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  english_pob_choice: it was good in their eyes
  chosen_korean: 그들의 눈에는 좋았습니다
  alternatives_korean:
  - 그들에게 좋게 여겨졌습니다
  - 그들의 눈에 좋았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈에 좋다’를 보존하되 한국어로는 문법적으로 자연스러운 ‘그들의 눈에는 좋았습니다’로 옮겨, 평가·승인의 뉘앙스를 살렸습니다.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה הַמֶּלֶךְ
  english_pob_choice: for everything the king did was good in the eyes of all the people
  chosen_korean: 이는 왕이 한 모든 일이 온 백성의 눈에도 좋았기 때문입니다
  alternatives_korean:
  - 왕이 한 모든 일이 온 백성에게도 좋았기 때문입니다
  - 곧 왕이 한 모든 일이 온 백성의 눈에도 좋았기 때문입니다
  lexicon: HALOT
  rationale: כְּכֹל אֲשֶׁר는 비교·설명의 연결을 가지므로, 영어 POB의 ‘for’에 맞춰 이유를 밝히는 문장으로 처리했습니다. ‘왕’은 본문이 고유명사보다 칭호를 사용하므로 그대로 유지했습니다.
