translation:
  language: ko
  text: 아브넬이 헤브론으로 돌아오자, 요압은 그를 성문 한가운데로 따로 데리고 가서 은밀히 이야기하려고 하였고, 거기서 그의 배[a]를 쳤습니다. 그러자 그는 죽었습니다. 이것은 요압의 형제 아사헬의 피 때문이었습니다.
  philosophy: optimal-equivalence
  footnotes:
