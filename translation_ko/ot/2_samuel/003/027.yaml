  yaml_path: translation/ot/2_samuel/003/027.yaml
  text: When Abner returned to Hebron[a], Joab drew him aside into the middle of the gate to speak with him privately, and there he struck him in the belly, so that he died, for the blood of Asahel his brother.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in the fifth rib,'' a traditional rendering for an idiom referring to the abdomen or belly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아브넬이 헤브론으로 돌아오자, 요압은 그를 성문 한가운데로 데리고 가서 그와 은밀히 말하려고 하였고, 거기서 그의 배를 쳐서 그가 죽었습니다. 이는 그의 형 아사헬의 피 때문이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘다섯째 갈비뼈’ — 배 또는 복부를 가리키는 관용적 표현으로 이해됩니다.'
    reason: lexical_alternative
lexical_decisions:
