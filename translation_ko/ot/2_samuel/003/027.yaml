  lexicon: HALOT
  rationale: ב의 원인/동기 용법을 살려 ‘때문에’로 번역하되, 보복의 법적 뉘앙스는 본문에 없는 설명을 덧붙이지 않도록 절제했습니다.
theological_decisions:
- issue: 살해 동기의 표현 방식
  chosen_reading: ‘아사헬의 피 때문이었습니다’로 원인만 드러내고, 복수의 정당성 여부는 판정하지 않았습니다.
  alternative_readings:
  - ‘아사헬의 피에 대한 복수였습니다’
  - ‘아사헬의 피를 갚기 위해서였습니다’
  rationale: 본문은 동기를 제시하지만 윤리적 평가를 직접 언급하지 않으므로, 본문의 서술 범위를 넘는 해석을 피했습니다.
  doctrine_reference: 서술 본문 해석 원칙
