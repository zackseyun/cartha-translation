  lexicon: WLC + POB audit trail
  rationale: שׁוּב의 기본 의미를 자연스럽게 살려 ‘돌아오자’로 옮기되, 서술 흐름을 해치지 않도록 시간절로 처리했습니다.
- source_word: וַיַּטֵּהוּ יוֹאָב אֶל תּוֹךְ הַשַּׁעַר
  english_pob_choice: Joab drew him aside into the middle of the gate
  chosen_korean: 요압은 그를 성문 한가운데로 데리고 가서
  alternatives_korean:
  - 요압은 그를 성문 한가운데로 끌어가서
  - 요압은 그를 성문 안쪽으로 데리고 가서
  lexicon: WLC + POB audit trail
  rationale: נטה의 방향성 있는 ‘비켜 데리다’는 동작을 한국어에서 가장 자연스러운 ‘데리고 가다’로 옮겼고, תּוֹךְ הַשַּׁעַר은 ‘성문 한가운데’로 가까이 유지했습니다.
- source_word: לְדַבֵּר אִתּוֹ בַּשֶּׁלִי
  english_pob_choice: to speak with him privately
  chosen_korean: 그와 은밀히 말하려고 하였고
  alternatives_korean:
  - 그와 몰래 말하려고 하였고
  - 그와 조용히 말하려고 하였고
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘조용히’보다 의도적으로 숨은 자리에서 말한다는 뉘앙스가 강하므로 ‘은밀히’가 더 적절합니다.
- source_word: וַיַּכֵּהוּ שָׁם הַחֹמֶשׁ
  english_pob_choice: and there he struck him in the belly
  chosen_korean: 거기서 그의 배를 쳐서
  alternatives_korean:
  - 거기서 그의 복부를 쳐서
  - 거기서 그의 옆구리를 쳐서
  lexicon: HALOT
  rationale: חֹמֶשׁ의 관용적 의미를 살려, 한국어 독자가 즉시 이해하는 신체 부위인 ‘배’를 택했습니다. 전통적 ‘다섯째 갈비뼈’는 본문 각주로 처리하는 쪽이 적절합니다.
- source_word: וַיָּמָת
  english_pob_choice: so that he died
  chosen_korean: 그가 죽었습니다
  alternatives_korean:
  - 그리하여 그가 죽었습니다
  - 그리고 그가 죽었습니다
  lexicon: WLC + POB audit trail
  rationale: 히브리어 결과절의 자연스러운 서술로 간결하게 처리했습니다.
- source_word: בְּדַם עֲשָׂה אֵל אָחִיו
  english_pob_choice: for the blood of Asahel his brother
  chosen_korean: 이는 그의 형 아사헬의 피 때문이었습니다
  alternatives_korean:
  - 그의 형 아사헬의 피 때문에
