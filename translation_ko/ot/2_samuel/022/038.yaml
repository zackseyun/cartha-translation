base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/038.yaml
  text: I pursued my enemies and destroyed them[a], and I did not turn back until they were consumed.
  footnotes:
  - marker: a
    text: Or 'until I had consumed them' / 'until they were ended.' The Hebrew verb can carry the sense of bringing something to completion or consuming it utterly.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 나의 원수들을 추격하여 그들을 멸하였고, 그들이 소멸될 때까지[a] 돌아서지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그들이 끝날 때까지’라고도 옮길 수 있습니다. 동사는 완전히 끝나다, 소멸되다, 다하다의 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרְדְּפָ֥ה
  english_pob_choice: I pursued
  chosen_korean: 제가 내쫓는 자들을 추격하여
  alternatives_korean:
  - 제가 추적하여
  - 제가 पीछ이하여
  lexicon: HALOT
  rationale: רָדַף의 핵심 의미인 ‘추격하다/뒤쫓다’를 살리되, 군사적 문맥에서 자연스럽게 읽히도록 ‘추격하여’로 옮겼습니다.
- source_word: אֹיְבַ֖י
  english_pob_choice: my enemies
  chosen_korean: 내쫓는 자들
  alternatives_korean:
  - 나의 원수들
  - 나의 적들
  lexicon: HALOT
  rationale: 직역성은 ‘나의 적들’이지만, 본절의 화자-대상 관계를 군사적 대립으로 또렷하게 드러내기 위해 ‘내쫓는 자들’로 옮겼습니다.
- source_word: וָ/אַשְׁמִידֵ֑/ם
  english_pob_choice: and destroyed them
  chosen_korean: 그들을 멸하였고
  alternatives_korean:
  - 그들을 멸절하였고
  - 그들을 없애버렸고
  lexicon: HALOT
  rationale: שׁמד의 강한 파괴 의미를 유지하면서도 한국어 성경 문체에서 자연스러운 ‘멸하다’를 택했습니다.
- source_word: עַד כַּלּוֹתָֽ/ם
  english_pob_choice: until they were consumed
  chosen_korean: 그들이 소멸할 때까지
  alternatives_korean:
  - 그들이 다할 때까지
  - 그들이 완전히 끝날 때까지
  - 그들이 소진될 때까지
  lexicon: HALOT
  rationale: כלה의 의미 범위(끝내다/소멸되다)를 반영하여, POB의 ‘consumed’와 대응하면서도 한국어로는 ‘소멸하다’가 가장 직접적입니다.
theological_decisions:
- issue: 전투적·파괴적 표현의 강도
  chosen_reading: 원문의 군사적 완결성과 최종성을 약화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 부드럽게 완화한 표현
  - ‘완전히 이겼다’ 같은 우회적 표현
  rationale: 시편/다윗 전승의 승전 진술로서, 원문의 강한 정복·멸망 어휘를 약화시키면 저자의 의도를 흐릴 수 있습니다.
  doctrine_reference: 본문의 역사서적-시적 승전 표현
