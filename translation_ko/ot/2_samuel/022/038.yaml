  naturalness: ‘나는 나의 원수들을 추격하여 … 돌아서지 않았습니다’는 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. ‘제가’는 본문 화자의 겸양 관계를 불필요하게 덧붙일 수 있으므로 ‘나는’이 더 적절합니다.
