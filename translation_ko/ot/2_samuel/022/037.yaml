  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּרְחִ֥יב צַעֲדִ֖/י תַּחְתֵּ֑/נִי וְ/לֹ֥א מָעֲד֖וּ קַרְסֻלָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/037.yaml
  text: You widen my steps beneath me[b][a], and my ankles have not given way.
  footnotes:
  - marker: a
    text: Literally, 'You widen my steps beneath me.' The Hebrew idiom expresses giving secure or ample footing.
    reason: lexical_alternative
  - marker: b
    text: Or 'my ankles have not slipped.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 제 발걸음을 넓게 하셔서, 제 발목이 흔들리지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘제 발걸음을 제 아래에서 넓게 하십니다’입니다. 히브리어 관용구는 안전한 발판과 넉넉한 진행 공간을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 발목이 미끄러지지 않았습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב צַעֲדַי
  english_pob_choice: You widen my steps
  chosen_korean: 제 발걸음을 넓게 하셔서
  alternatives_korean:
  - 제 걸음을 넓히셔서
  - 제 발을 넓게 하셔서
  lexicon: HALOT
  rationale: 히필형 רחב의 사역적 의미를 살려 하나님이 길과 발걸음을 안정되게 하시는 모습을 한국어로 자연스럽게 옮겼습니다. ‘발걸음’은 시적 이미지와 보행의 안정성을 함께 담습니다.
- source_word: תַּחְתֵּנִי
  english_pob_choice: beneath me
  chosen_korean: 저 아래에서
  alternatives_korean:
  - 제 아래에서
  - 저 밑에서
  lexicon: HALOT
  rationale: 전치사의 공간적 이미지를 살리되, 한국어에서는 ‘발걸음을 넓게 하다’와 결합할 때 ‘저 아래에서’보다 문장 흐름이 더 자연스럽도록 처리했습니다.
- source_word: מָעֲדוּ
  english_pob_choice: have not given way
  chosen_korean: 흔들리지 않았습니다
  alternatives_korean:
  - 미끄러지지 않았습니다
  - 벗어나지 않았습니다
  - 휘청거리지 않았습니다
  lexicon: HALOT
  rationale: 발목이 대상일 때 ‘given way’는 단순 미끄러짐보다 지탱이 무너지는 의미를 띨 수 있어, 시적이면서도 안정성을 잘 드러내는 ‘흔들리지 않다’로 옮겼습니다.
- source_word: קַרְסֻלַּי
  english_pob_choice: my ankles
  chosen_korean: 제 발목
  alternatives_korean:
  - 제 발목들
  - 제 발
  lexicon: HALOT
  rationale: 어휘가 가리키는 신체 부위가 일반적인 ‘발’보다 구체적인 ‘발목’에 가깝기 때문에, 해부학적 정확성을 우선해 번역했습니다.
theological_decisions:
- issue: 하나님이 보행을 안정되게 하시는 은유의 유지
  chosen_reading: 문맥의 은유를 풀어쓰지 않고, 하나님이 ‘발걸음을 넓게’ 하셔서 ‘발목이 흔들리지 않게’ 하시는 시적 이미지를 유지했습니다.
  alternative_readings:
  - ‘내 길을 넓게 하셔서’로 의미를 일반화하는 읽기
  - ‘내 걸음이 미끄러지지 않았다’로 단순화하는 읽기
  rationale: 본문은 단순한 안전의 진술을 넘어, 하나님이 주시는 넉넉한 보행 공간과 견고한 지지를 함께 그립니다. 이를 보존해야 시적·신학적 힘이 살아납니다.
  doctrine_reference: 하나님의 보호와 인도하심
