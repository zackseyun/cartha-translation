  yaml_path: translation/ot/2_samuel/022/032.yaml
  text: For who is God besides Yahweh? And who is a rock besides our God?[a]
  footnotes:
  - marker: a
    text: Or 'who is Rock besides our God?' The Hebrew 'rock' is a frequent metaphor and sometimes functions almost like a title for God.
