translation:
  language: ko
  text: 야훼 밖에 하나님이 누가 있겠습니까? 또 우리 하나님 밖에 누가 바위이겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 하나님 밖에 누가 바위이겠습니까?’ 히브리어 ‘바위’는 하나님을 가리키는 흔한 은유이며, 때로는 거의 호칭처럼 기능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 신들
  lexicon: HALOT
  rationale: 문맥이 유일신을 전제하는 수사적 질문이므로 일반 명사가 아니라 고유한 신칭인 ‘하나님’으로 옮겼습니다.
- source_word: מִבַּלְעֲדֵי
  english_pob_choice: besides
  chosen_korean: 밖에
  alternatives_korean:
  - 말고
  - 외에
  - 없이
  lexicon: HALOT
  rationale: 배제와 유일성을 드러내는 표현으로, 현대 한국어에서 가장 자연스럽고 간결하게 ‘~밖에’가 그 기능을 살립니다.
- source_word: צוּר
  english_pob_choice: a rock
  chosen_korean: 바위
  alternatives_korean:
  - 반석
  - 돌
  - 바위(비유적)
  lexicon: HALOT
  rationale: 영어 POB가 제목화된 ‘Rock’보다 보통명사적 비유를 택한 점을 따라, 비유를 직접 살리되 한국어에서는 ‘바위’가 ‘반석’보다 덜 전통적 신학 용어로 굳어 있기에 원문의 은유를 더 가깝게 반영했습니다.
- source_word: אֱלֹהֵינוּ
  english_pob_choice: our God
  chosen_korean: 우리 하나님
  alternatives_korean:
  - 우리의 하나님
  - 우리의 신
  lexicon: HALOT
  rationale: 1인칭 복수 소유격을 자연스럽게 살려 공동체적 소속감을 나타내는 ‘우리 하나님’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문은 신명기적 고유명사 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 표기해 하나님의 언약적 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
