  yaml_path: translation/ot/2_samuel/022/014.yaml
  text: Yahweh thundered from heaven[a], and the Most High gave his voice.
  footnotes:
  - marker: a
    text: Or 'uttered his voice.' The Hebrew literally says 'gave his voice,' a poetic expression parallel to 'thundered.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 하늘에서 우레를 치셨고, 지극히 높으신 이가 그분의 음성을 내셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 음성을 발하셨다’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘그분의 음성을 주셨다’고 말하며, 이는 ‘우레를 치셨다’와 평행을 이루는 시적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 직역 원칙에 따라 언약적 고유명사를 일반 호칭인 ‘주님’으로 바꾸지 않고, 학술적 음역인 ‘야훼’로 옮겼습니다.
- source_word: יַרְעֵ֥ם
  english_pob_choice: thundered
  chosen_korean: 우레를 치시고
  alternatives_korean:
  - 천둥하셨고
  - 우레를 발하셨고
  lexicon: HALOT
  rationale: 동사 רעם의 시적·신현적 의미를 살리면서 한국어에서 자연스러운 표현인 ‘우레를 치시다’로 옮겨, 단순한 소리보다 하나님의 현현적 위엄을 드러냈습니다.
- source_word: מִן שָׁמַ֖יִם
  english_pob_choice: from heaven
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘들에서
  - 하늘로부터
  lexicon: HALOT
  rationale: 신적 주어와 결합된 שָׁמַיִם은 여기서 우주론적 ‘하늘’보다 하나님의 처소를 가리키는 말이므로, 한국어에서도 자연스러운 ‘하늘에서’로 옮겼습니다.
- source_word: יִתֵּ֥ן קוֹלֽוֹ
  english_pob_choice: gave his voice
  chosen_korean: 그의 음성을 내십니다
  alternatives_korean:
  - 그의 음성을 주십니다
  - 그의 목소리를 내십니다
  - 그의 소리를 내십니다
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현 ‘그의 음성을 주다’는 시적 관용구이므로, 의미를 드러내면서도 한국어에서 부자연스럽지 않은 ‘음성을 내다’로 옮겼습니다.
theological_decisions:
- issue: 야훼와 지극히 높으신 이의 병렬성
  chosen_reading: 두 표현을 같은 하나님에 대한 시적 평행법으로 읽었습니다.
  alternative_readings:
  - ‘지극히 높으신 이’를 별도의 호칭으로 약하게 분리해 읽는 방식
  rationale: 문맥상 두 절은 동일한 신적 행위를 두 방식으로 병렬 진술하며, 히브리 시의 평행법을 유지하는 것이 본문의 신학적 힘을 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve theological tension rather than resolve it'
