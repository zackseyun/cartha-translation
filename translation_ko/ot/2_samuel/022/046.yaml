  text: בְּנֵ֥י נֵכָ֖ר יִבֹּ֑לוּ וְ/יַחְגְּר֖וּ מִ/מִּסְגְּרוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/046.yaml
  text: Foreigners lose heart and come trembling out of their strongholds[a][b][c].
  footnotes:
  - marker: a
    text: Or 'Foreigners fade away.' The Hebrew verb can more literally denote withering or fading.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb is difficult here; alternatives include 'come cringing,' 'come limping,' or more literally 'gird themselves.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from their fortresses' or, less likely, 'from their prisons/enclosures.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이방인들은 기력이 쇠하고 자기 요새에서 떨며 나옵니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  english_pob_choice: Foreigners
  chosen_korean: 이방인들
  alternatives_korean:
  - 외국인들
  - 낯선 자들
  - 이방의 자손들
  lexicon: HALOT
  rationale: 직역인 ‘이방의 자손들’보다, 시적 병행과 집단 지칭을 살려 자연스러운 집합 명사 ‘이방인들’로 옮겼습니다.
- source_word: יִבֹּלוּ
  english_pob_choice: lose heart
  chosen_korean: 기력이 쇠하고
  alternatives_korean:
  - 마음이 꺾이고
  - 시들어 가고
  - 쇠하여
  lexicon: HALOT
  rationale: 이 동사는 문자적으로 ‘시들다/쇠하다’의 뜻이 있어, 전투 장면에서의 무력화와 쇠잔을 살리는 표현으로 ‘기력이 쇠하고’를 택했습니다.
- source_word: וְיַחְגְּרוּ
  english_pob_choice: come trembling
  chosen_korean: 떨며 나옵니다
  alternatives_korean:
  - 비틀거리며 나옵니다
  - 몸을 웅크리고 나옵니다
  - 허둥지둥 나옵니다
  lexicon: HALOT
  rationale: 어근상 ‘띠를 띠다’가 기본이지만 이 문맥에서는 두려움 속에 나오는 모습이 핵심이므로, POB의 해석을 따라 ‘떨며 나옵니다’로 옮겼습니다.
- source_word: מִמִּסְגְּרוֹתָם
  english_pob_choice: out of their strongholds
  chosen_korean: 자기 요새에서
  alternatives_korean:
  - 그들의 요새에서
  - 그들의 성채에서
  - 그들의 감금소에서
  lexicon: HALOT
  rationale: 전투적 문맥에서 מִסְגְּרוֹת는 ‘요새/방어 거점’이 가장 적절하므로, 군사적 맥락을 분명히 하는 ‘자기 요새’로 번역했습니다.
