  yaml_path: translation/ot/2_samuel/022/039.yaml
  text: I consumed them and shattered them[a], and they did not rise[b]; they fell under my feet.
  footnotes:
  - marker: a
    text: Or 'I destroyed them'; the Hebrew verb literally means 'consume' and is used here in battle imagery.
    reason: lexical_alternative
  - marker: b
    text: Or 'crushed them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들을 삼키고[a] 부수었으며[b], 그들은 일어나지 않았습니다. 그들은 내 발아래에 쓰러졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멸했습니다.’ 히브리어 동사는 이 전쟁 문맥에서 ‘삼키다’에서 ‘멸하다’ 또는 ‘파괴하다’의 뜻으로 확장되어 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘짓부수었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲכַלֵּם
  english_pob_choice: I consumed them
  chosen_korean: 그들을 삼키고
  alternatives_korean:
  - 그들을 파괴하고
  - 그들을 멸하고
  lexicon: HALOT
  rationale: אכל의 전쟁 문맥상 ‘삼키다’는 원의 동적 이미지를 살리며, POB의 ‘consumed’와도 가장 가깝습니다.
- source_word: וָאֶמְחָצֵם
  english_pob_choice: shattered them
  chosen_korean: 부수었으며
  alternatives_korean:
  - 짓부수었으며
  - 산산이 부수었으며
  - 쳐부수었으며
  lexicon: HALOT
  rationale: מחץ는 ‘치다, 부수다, 산산이 깨뜨리다’의 뜻이므로, 짧은 시구의 압박감을 살려 ‘부수다’로 옮겼습니다.
- source_word: וְלֹא יְקוּמוּן
  english_pob_choice: and they did not rise
  chosen_korean: 그들은 일어서지 못했습니다
  alternatives_korean:
  - 그들은 일어나지 못했습니다
  - 그들은 다시 일어서지 못했습니다
  lexicon: HALOT
  rationale: 직역하면 ‘일어나지 않았다’이지만, 앞뒤 전투 진술의 결과를 자연스럽게 드러내기 위해 한국어에서는 능동적 가능성의 상실을 포함한 표현으로 옮겼습니다.
- source_word: תַּחַת רַגְלָי
  english_pob_choice: under my feet
  chosen_korean: 내 발아래에
  alternatives_korean:
  - 내 발밑에
  - 내 발 아래에
  lexicon: HALOT
  rationale: 패배와 굴복의 관용구를 그대로 살려, 승자가 적을 짓누르는 이미지를 유지했습니다.
