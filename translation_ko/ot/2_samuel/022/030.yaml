    rationale: 한국어 문장 안의 ‘כאן’은 구조적·언어적 오류입니다. ‘여기서’로 바로잡아야 합니다.
  - severity: low
    issue: 각주 c의 대안 ‘성루’
    rationale: שׁוּר의 대안인 ‘rampart’는 방어용 벽·방벽을 가리키며, 탑인 ‘성루’와는 의미가 다릅니다.
