revisions:
- from: 그러므로 당신으로 말미암아 내가 군대에 달려갈 수 있습니다. 내 하나님으로 말미암아 내가 성벽을 뛰어넘을 수 있습니다.[a][b][c]
  to: 이는 내가 주님을 힘입어[a] 한 부대를 향해 달려갈 수 있으며[b], 나의 하나님을 힘입어 성벽을 뛰어넘을 수 있기 때문입니다.[c]
  rationale: 접속사의 논리 관계를 바로잡고, 하나님께 대한 직접 호칭을 한국어 종교 문체에 자연스러운 ‘주님’으로 조정했습니다. 군사적 동작과 병행된 능력의 미완료형은 ‘~할 수 있습니다’로 유지했습니다. 각주의 언어 혼입, 의미상 부정확한 대안, 표지 위치를 수정했습니다.
