base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/030.yaml
  text: For by you I can run against a troop[c][b][a]; by my God I can leap over a wall.
  footnotes:
  - marker: a
    text: 'Or ''with you'' / ''through you''; the Hebrew preposition can express accompaniment or means. Here it is taken as means: God enables the action.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a raiding band.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a rampart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 주님을 힘입어[a] 한 부대를 향해 달려갈 수 있으며[b], 나의 하나님을 힘입어 성벽을 뛰어넘을 수 있기 때문입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님과 함께’ / ‘주님을 통하여’; 히브리어 전치사는 동반이나 수단을 나타낼 수 있습니다. 여기서는 하나님께서 행동을 가능하게 하시는 수단으로 이해했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘습격대’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘방벽’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ / בְכָה
  english_pob_choice: by you
  chosen_korean: 당신으로 말미암아
  alternatives_korean:
  - 당신과 함께
  - 당신을 통해
  lexicon: HALOT
  rationale: בְ + 2인칭 접미사는 동반이나 수단을 가리킬 수 있으므로, 여기서는 하나님이 행동을 가능하게 하시는 수단의 의미를 살려 ‘말미암아’로 옮겼습니다.
- source_word: גְּדוּד
  english_pob_choice: a troop
  chosen_korean: 군대
  alternatives_korean:
  - 무리
  - 습격대
  lexicon: HALOT
  rationale: 문맥상 전투 단위를 가리키며, 현대 한국어에서는 ‘군대’가 가장 자연스럽게 군사적 대상을 전달합니다.
- source_word: אֲדַלֶּג
  english_pob_choice: I can leap over
  chosen_korean: 뛰어넘을 수 있습니다
  alternatives_korean:
  - 뛰어넘습니다
  - 건너뜁니다
  lexicon: HALOT
  rationale: 힙필/피엘 계열의 동작 감각과 가능성 의미를 살려, 앞의 행과 같은 능력 표현으로 ‘~할 수 있습니다’를 유지했습니다.
- source_word: שׁוּר
  english_pob_choice: a wall
  chosen_korean: 성벽
  alternatives_korean:
  - 벽
  - 담
  lexicon: HALOT
  rationale: 정복·방어 이미지가 강한 단어이므로 단순한 ‘벽’보다 요새화된 벽을 드러내는 ‘성벽’이 문맥에 더 잘 맞습니다.
theological_decisions:
- issue: 하나님이 주시는 능력의 강조
  chosen_reading: 두 절 모두 단순한 행동 진술이 아니라, 하나님이 전투적 돌파를 가능하게 하시는 능력의 진술로 번역했습니다.
  alternative_readings:
  - 내가 군대에 달려간다
  - 내가 성벽을 뛰어넘는다
  rationale: 히브리어 미완료형은 시적 문맥에서 가능성과 반복적 능력을 나타낼 수 있으므로, 시편적 찬양의 초점을 보존하기 위해 능력 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
