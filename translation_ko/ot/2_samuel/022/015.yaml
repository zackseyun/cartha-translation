  terminology: ‘화살’, ‘번개’, ‘혼란에 빠뜨리셨습니다’는 모두 문맥과 어휘 의미 범위에 맞습니다. ‘혼란에 빠뜨리셨습니다’는 המם의 혼란·동요·패주 유발의 의미를 특정 군사 결과로 과도하게 한정하지 않습니다. 각주의 ‘패주시켰습니다’ 대안도 두 동사에 적용될 수 있음을 정확히 설명합니다.
