id: 2SA.22.15
reference: 2 Samuel 22:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח חִצִּ֖ים וַ/יְפִיצֵ֑/ם בָּרָ֖ק ו/יהמ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/015.yaml
  text: He sent arrows and scattered them; lightning[a], and threw them into confusion.
  footnotes:
  - marker: a
    text: Or 'and routed them' for both verbs describing the effect of the arrows and lightning on David's enemies.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 화살들을 보내어 그들을 흩으시고, 번개로 그들을 혼란에 빠뜨리셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 패주시켰습니다’로도 옮길 수 있습니다. 이 경우 화살과 번개의 효과를 함께 나타내는 두 동사 모두에 적용됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: He sent
  chosen_korean: 보내어
  alternatives_korean:
  - 쏘시고
  - 발사하시고
  - 내리시고
  lexicon: HALOT
  rationale: שלח의 기본 의미인 ‘보내다’를 살리되, 뒤의 ‘화살들’과 결합될 때 한국어에서는 ‘화살들을 보내어’가 시적이면서도 자연스럽습니다.
- source_word: חִצִּים
  english_pob_choice: arrows
  chosen_korean: 화살들
  alternatives_korean:
  - 살들
  - 화살
  lexicon: HALOT
  rationale: חצים은 구체적인 전투 이미지의 ‘화살’이 가장 직접적인 대응이며, 복수형을 드러내기 위해 ‘화살들’로 옮겼습니다.
- source_word: וַיְפִיצֵם
  english_pob_choice: and scattered them
  chosen_korean: 그들을 흩으시고
  alternatives_korean:
  - 그들을 흩으셨고
  - 그들을 흩어 놓으시고
  - 그들을 분산시키시고
  lexicon: HALOT
  rationale: פוץ/פיץ의 분산·흩어짐을 그대로 반영해 ‘흩으시고’로 옮겼고, ‘them’은 문맥상 적대자들을 가리키므로 자연스럽게 보완했습니다.
- source_word: בָּרָק
  english_pob_choice: lightning
  chosen_korean: 번개
  alternatives_korean:
  - 번갯불
  - 벼락
  lexicon: HALOT
  rationale: ברק은 ‘번개/섬광’의 뜻으로, 시적 병렬을 유지하면서도 한국어에서 자연스러운 ‘번개’를 선택했습니다.
- source_word: וַיְהֻמֵּם
  english_pob_choice: and threw them into confusion
  chosen_korean: 그들을 혼란에 빠뜨리셨습니다
  alternatives_korean:
  - 그들을 혼란에 떨게 하셨습니다
  - 그들을 어지럽히셨습니다
  - 그들을 혼란시키셨습니다
  lexicon: HALOT
  rationale: המם의 ‘혼란에 빠뜨리다, 패주시키다’라는 효과를 살리되, 단순한 군사적 ‘패주’로 좁히지 않고 시적·의미적 폭을 유지했습니다.
theological_decisions:
- issue: ‘them’의 지시 대상
  chosen_reading: 화살과 번개가 겨냥한 대상은 문맥상 다윗의 대적들입니다.
  alternative_readings:
  - 대상을 한국어에서 생략해 문맥에 맡길 수 있습니다.
  rationale: 히브리어의 3인칭 복수 접미사는 실제 대상을 요구하며, 이 절의 전투적 신현 맥락상 적대자들이 가장 자연스러운 지시 대상입니다.
  doctrine_reference: 문맥 기반 해석
- issue: 시적 평행에서 ‘routed them’ 계열 의미의 처리
  chosen_reading: ‘혼란에 빠뜨리셨습니다’로 옮겨 군사적 패주와 내적 동요를 함께 포괄했습니다.
  alternative_readings:
  - ‘패주시켰습니다’로 더 군사적으로 좁힐 수 있습니다.
  - ‘그들을 무찌르셨습니다’로 의미를 일반화할 수 있습니다.
  rationale: POB의 각주가 지적하듯 שני 동사는 결과상 ‘rout’까지 포함할 수 있으나, 히브리어 동사의 직접적 이미지는 ‘혼란/동요’이므로 이를 보존했습니다.
  doctrine_reference: 시적-의미적 등가
