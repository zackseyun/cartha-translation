  source_fidelity: 히브리어의 순서와 핵심 어휘를 충실히 반영합니다. ‘보내어’는 וַיִּשְׁלַח, ‘화살들’은 חִצִּים, ‘그들을 흩으시고’는 וַיְפִיצֵם, ‘번개로’는 בָּרָק, ‘그들을 혼란에 빠뜨리셨습니다’는 וַיְהֻמֵּם에 적절히 대응합니다. ‘번개로’는 히브리어의 압축된 병렬 표현을 한국어에서 자연스럽게 풀어, 번개가 후속 행위의 수단임을 나타냅니다. 복수 접미사의 대상인 대적자들도 문맥에 따라 무리 없이 보완되었습니다.
