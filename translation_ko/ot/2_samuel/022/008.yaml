  text: Then the earth reeled and quaked; the foundations of the heavens trembled and shook, because he was angry.
translation:
  language: ko
  text: 그때 땅이 흔들리고 요동하며, 하늘의 기초들이 떨고 흔들렸습니다. 이는 그분이 진노하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “흔들리고 있었습니다”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְעַשׁ / וַתִּגעַשׁ
  english_pob_choice: reeled and quaked
  chosen_korean: 흔들리고 요동하며
  alternatives_korean:
  - 흔들리고 진동하며
  - 흔들리고 뒤흔들리며
  lexicon: רָעַשׁ / גָּעַשׁ
  rationale: POB가 earth를 단순히 ‘shook’가 아니라 ‘reeled and quaked’로 잡은 점을 살려, 중복 동사 두 개를 한국어의 ‘흔들리고 요동하며’로 나누어 강한 지각 변동의 이미지를 유지했습니다.
- source_word: מוֹסְדוֹת הַשָּׁמָיִם
  english_pob_choice: the foundations of the heavens
  chosen_korean: 하늘의 기초들
  alternatives_korean:
  - 하늘의 토대들
  - 하늘의 터전들
  lexicon: מוֹסָד / שָׁמַיִם
  rationale: 직역적으로 ‘기초들’에 해당하는 이미지를 보존해, 하늘마저 물리적 구조처럼 흔들린다는 시적 과장을 그대로 드러냈습니다.
- source_word: יִרְגָּזוּ וַיִּתְגָּעֲשׁוּ
  english_pob_choice: trembled and shook
  chosen_korean: 떨고 흔들렸습니다
  alternatives_korean:
  - 전율하고 흔들렸습니다
  - 떨며 요동했습니다
  lexicon: רָגַז / גָּעַשׁ
  rationale: 앞 절의 ‘흔들리다’와 구별되면서도 병렬성을 살리기 위해 ‘떨고 흔들렸습니다’로 옮겨, 상부 구조가 두려움과 동요에 반응하는 장면을 유지했습니다.
- source_word: כִּי חָרָה לֹו
  english_pob_choice: because he was angry
  chosen_korean: 이는 그분이 진노하셨기 때문입니다
  alternatives_korean:
  - 이는 그분이 분노하셨기 때문입니다
  - 그분의 노가 치밀었기 때문입니다
  lexicon: חָרָה
  rationale: 하나님에 대한 직접 주어를 분명히 하면서, ‘anger’보다 더 강한 경어적·신학적 어감의 ‘진노하셨습니다’를 선택해 원문의 원인 진술을 분명히 했습니다.
theological_decisions:
- issue: 신적 진노의 표현
  chosen_reading: ‘그분이 진노하셨기 때문입니다’로 번역해, 자연현상 뒤의 인격적 원인을 분명히 했습니다.
  alternative_readings:
  - ‘그분이 화를 내셨기 때문입니다’
  - ‘그분이 노하셨기 때문입니다’
  rationale: 시편/사무엘하의 신현적 언어는 단순한 감정 묘사가 아니라 야훼의 거룩한 반응을 드러내므로, 완화된 표현보다 원문의 긴장을 보존했습니다.
  doctrine_reference: 하나님의 거룩하심과 심판의 인격성
