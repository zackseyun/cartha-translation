  source_fidelity: 히브리어는 땅에 대해 ‘요동하다/흔들리다’의 두 동사를, 하늘의 기초에 대해 ‘떨다/요동하다’의 두 동사를 병렬로 사용합니다. 수정문은 이 동사들의 순서와 반복적 격동의 이미지를 더 직접적으로 보존합니다. כִּי חָרָה לוֹ는 ‘그분께서 분노하셨기 때문’이라는 인과절로 적절히 옮겼습니다.
  naturalness: ‘땅이 요동하고 흔들렸으며, 하늘의 기초들이 떨고 요동했습니다’는 현대 표준 한국어에서 자연스럽고, 시적·장엄한 문맥에도 맞습니다. 합쇼체 종결을 유지했습니다.
  terminology: ‘하늘의 기초들’은 מוֹסְדוֹת הַשָּׁמַיִם의 시적 복수 이미지를 보존합니다. ‘분노하셨습니다’는 חָרָה의 의미를 과도한 교리적 함의 없이 자연스럽게 전달합니다.
