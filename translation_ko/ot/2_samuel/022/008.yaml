    rationale: ‘또는 “흔들리고 있었습니다”’는 히브리어의 완료/미완료 병렬을 정당하게 반영한 대안이 아니고, 영어 감사 이력에도 해당 각주의 근거가 없습니다. 삭제하는 것이 본문과 각주 앵커의 명료성을 높입니다.
