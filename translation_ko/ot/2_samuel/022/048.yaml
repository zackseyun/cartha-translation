    rationale: 원문과 영어 POB는 하나님이 보응을 화자에게 ‘주시는’ 것으로 표현합니다. ‘나를 위해 행하다’는 가능한 문맥적 함의일 수 있으나, 본문 표현 자체를 더 해석적으로 바꿉니다.
