    rationale: לִי의 기본값은 ‘내게’이며, 이 구절에서는 ‘나를 위해’도 문맥상 가능하지만 단정할 근거가 충분하지 않습니다. 본문에 불필요한 해석을 고정하는 각주는 제거하는 편이 안전합니다.
