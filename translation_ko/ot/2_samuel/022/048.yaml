    rationale: 종속의 함의는 분명하지만, 동사의 하강 이미지를 살린 ‘내 아래로 낮추시는’이 원문에 더 가깝습니다.
  revised_text: 내게 보응을 베푸시고 민족들을 내 아래로 낮추시는 하나님이십니다.
