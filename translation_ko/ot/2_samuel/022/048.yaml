  yaml_path: translation/ot/2_samuel/022/048.yaml
  text: the God who gives vengeance to me and brings peoples down under me.
translation:
  language: ko
  text: 내게 보응을 베푸시고 민족들을 내 아래로 낮추시는 하나님이십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  english_pob_choice: the God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: Θεός / אֵל
  rationale: 원문은 칭호형으로 ‘하나님’을 가리키며, POB의 기본 신칭을 따라 표준적인 신명으로 옮겼습니다.
- source_word: הַנֹּתֵן נְקָמֹת לִי
  english_pob_choice: who gives vengeance to me
  chosen_korean: 나를 위해 보복을 행하시는
  alternatives_korean:
  - 내게 보복을 주시는
  - 나에게 원수를 갚아 주시는
  - 나를 위하여 복수하시는
  lexicon: נתן + נקמות
  rationale: לִי는 단순 수혜자 ‘to me’로, 보복의 대상이 아니라 하나님이 친히 행하시는 보복의 귀속을 나타내므로 ‘나를 위해’보다 ‘나를 위해 보복을 행하시는’이 의미를 더 분명히 드러냅니다.
- source_word: וּמוֹרִיד עַמִּים תַּחְתֵּנִי
  english_pob_choice: and brings peoples down under me
  chosen_korean: 그리고 민족들을 내 아래에 굴복시키시는
  alternatives_korean:
  - 그리고 백성들을 내 아래로 끌어내리시는
  - 그리고 여러 민족을 내 밑에 두시는
  lexicon: מוריד + עמים + תחתני
  rationale: עַמִּים은 개인 집단보다 넓은 ‘민족들’로 옮기고, תַּחְתֵּנִי는 공간적 하강보다 종속을 나타내므로 ‘내 아래에 굴복시키시는’으로 처리했습니다.
theological_decisions:
- issue: ‘보복’의 신학적 어조
  chosen_reading: 하나님이 다윗에게 개인적 복수심을 주는 것이 아니라, 원수들에 대한 공의로운 보응을 행하시는 분으로 읽었습니다.
  alternative_readings:
  - ‘복수’로 순화하는 읽기
  - ‘원수 갚음’으로 완화하는 읽기
  rationale: 시적 문맥에서 נקמות는 단순 감정적 복수보다 언약적·사법적 보응을 가리키며, 원문이 가진 강한 어조를 유지하는 편이 적절합니다.
  doctrine_reference: 시편 18:47 병행문맥, 신명기 32:35의 보응 어휘
- issue: ‘민족들’을 ‘내 아래에’ 두는 표현
  chosen_reading: 지배의 서열을 직접적으로 드러내는 표현을 유지했습니다.
  alternative_readings:
  - ‘내게 항복하게 하시는’
  - ‘내게 복종하게 하시는’
  rationale: תַּחְתֵּנִי의 기본 이미지는 ‘아래에’이며, 전쟁 승리의 결과로 타자들이 종속되는 상태를 나타내므로 이를 약화시키지 않았습니다.
  doctrine_reference: 시편 18:47
