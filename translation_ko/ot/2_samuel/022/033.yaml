id: 2SA.22.33
reference: 2 Samuel 22:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָ/אֵ֥ל מָעוּזִּ֖/י חָ֑יִל וַ/יַּתֵּ֥ר תָּמִ֖ים דרכ/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/033.yaml
  text: God is my strong refuge[a], and he makes my way blameless.
  footnotes:
  - marker: a
    text: Or, following the consonantal form more literally, 'and he makes his way blameless.' The parallel in Psalm 18:32 supports 'my way.'
    reason: alternative_reading
translation:
  language: ko
  text: 하나님은 나의 견고한 피난처이시며, 내 길을 흠 없이 하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 자음 형태를 더 문자적으로 따르면 '그의 길'로도 읽을 수 있습니다. 시편 18:32의 평행은 '내 길'을 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֵל / הָאֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 그 하나님
  - 신
  lexicon: HALOT
  rationale: 정관사와 함께 쓰인 אֵל은 문맥상 호칭적 지칭이므로, POB의 'God'에 맞춰 표준적인 신칭인 '하나님'으로 옮겼습니다.
- source_word: מָעוּזִּי חָיִל
  english_pob_choice: my strong refuge
  chosen_korean: 나의 견고한 피난처
  alternatives_korean:
  - 나의 강한 요새
  - 나의 강한 피난처
  - 나의 견고한 요새
  lexicon: HALOT
  rationale: מָעוֹז는 보호의 장소/근원을 가리키므로 '피난처'가 뜻을 살리고, חָיִל의 힘의 뉘앙스는 '견고한'으로 압축해 군사적 이미지를 지나치게 좁히지 않았습니다.
- source_word: וַיַּתֵּר תָּמִים
  english_pob_choice: he makes ... blameless
  chosen_korean: 흠 없이 하십니다
  alternatives_korean:
  - 온전하게 하십니다
  - 완전하게 하십니다
  - 흠 없게 하십니다
  lexicon: HALOT
  rationale: תָּמִים은 온전함/흠없음을 가리키므로, 한국어에서 자연스럽고 도덕적·관계적 무결성을 함께 담는 '흠 없이'를 택했습니다.
- source_word: דַּרְכּוֹ
  english_pob_choice: my way
  chosen_korean: 내 길
  alternatives_korean:
  - 그의 길
  - 내가 가는 길
  lexicon: HALOT
  rationale: 마소라 본문 표기는 3인칭으로도 읽힐 수 있지만, 평행구인 시편 18:32와 POB의 판단을 따라 화자의 길로 이해하여 '내 길'로 번역했습니다.
theological_decisions:
- issue: 마소라 본문과 평행본문 사이의 인칭 읽기
  chosen_reading: 시편 18:32의 평행에 따라 하나님이 '내 길'을 흠 없게 하신다는 뜻으로 읽었습니다.
  alternative_readings:
  - 하나님이 그의 길을 흠 없게 하신다
  rationale: 문맥상 화자의 신뢰 고백이 자연스럽고, 본문의 해석상 중요한 분기이므로 한국어 본문에는 평행본문이 지지하는 독법을 반영하되, 대안은 각주로 보존하는 편이 바람직합니다.
  doctrine_reference: 모호한 본문은 해소하기보다 근거 있는 대안을 보존합니다.
