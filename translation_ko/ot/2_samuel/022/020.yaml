    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא / He brought me out
  english_pob_choice: He brought me out
  chosen_korean: 나를 넓은 곳으로 이끄셨습니다
  alternatives_korean:
  - 나를 넓은 곳으로 데리고 나오셨습니다
  - 나를 넓은 곳으로 끌어내셨습니다
  lexicon: HALOT
  rationale: יצא의 사역형은 ‘나오게 하다/이끌어 내다’의 뜻이므로, 좁음과 대조되는 해방의 이미지를 살려 자연스러운 한국어로 옮겼습니다.
- source_word: לַמֶּרְחָב / into a broad place
  english_pob_choice: into a broad place
  chosen_korean: 넓은 곳
  alternatives_korean:
  - 드넓은 곳
  - 넓은 자리
  lexicon: HALOT
  rationale: מֶרְחָב은 넓고 트인 공간을 가리키므로, ‘넓은 곳’으로 간결하게 옮겨 시편적 은유를 살렸습니다.
- source_word: יְחַלְּצֵנִי / he rescued me
  english_pob_choice: he rescued me
  chosen_korean: 나를 구해 주셨습니다
  alternatives_korean:
  - 나를 건져 주셨습니다
  - 나를 구원하셨습니다
  lexicon: HALOT
  rationale: חלץ의 구출·해방 의미를 담되, 현재 문맥의 개인적 구원 행위를 가장 자연스럽게 드러내는 표현으로 선택했습니다.
- source_word: חָפֵץ בִּי / he delighted in me
  english_pob_choice: he delighted in me
  chosen_korean: 나를 기뻐하셨기 때문입니다
  alternatives_korean:
  - 나를 즐거워하셨기 때문입니다
  - 나를 좋게 여기셨기 때문입니다
  lexicon: HALOT
  rationale: חפץ בְּ는 ‘기뻐하다/즐거워하다’의 호의적 애정을 나타내므로, 관계적 기쁨을 살려 번역했습니다.
theological_decisions:
- issue: 구출의 근거가 되는 하나님의 호의
  chosen_reading: ‘나를 기뻐하셨기 때문입니다’로 번역해, 구출이 하나님의 호의에서 비롯됨을 분명히 했습니다.
  alternative_readings:
  - ‘나를 좋게 여기셨기 때문입니다’
  - ‘나를 기쁘게 여기셨기 때문입니다’
  rationale: 본문은 구출의 원인을 하나님의 delight에 두며, 이를 공로론으로 확장하지 않습니다. 한국어도 그 관계적 호의를 그대로 드러내도록 했습니다.
  doctrine_reference: 본문의 신학적 긴장을 보존하고, 본문이 말하지 않는 공로 개념을 덧붙이지 않음.
