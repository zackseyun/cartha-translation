source:
  edition: WLC
  text: וַ/תַּזְרֵ֥/נִי חַ֖יִל לַ/מִּלְחָמָ֑ה תַּכְרִ֥יעַ קָמַ֖/י תַּחְתֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/040.yaml
  text: You armed me with strength for battle[b][a]; you caused those who rose against me to bow beneath me.
  footnotes:
  - marker: a
    text: Or 'You girded me with strength for battle.' The Hebrew verb carries the imagery of girding or equipping, which can be rendered more formally that way.
    reason: lexical_alternative
  - marker: b
    text: Or 'you caused my adversaries to bow under me.' The verb can more literally express forcing opponents to kneel or bow down.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 저에게 전투를 위한 힘을 입히시고, 저에게 맞서 일어나는 자들을 제 아래로 굴복시키셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 ‘띠를 두르다, 장비하다’의 이미지를 담고 있어 ‘무장시키다/전투를 위해 띠를 두르다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 적들을 ‘굴복시키다’보다 더 문자적으로는 ‘엎드리게 하다, 무릎 꿇게 하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּזְרֵנִי
  english_pob_choice: You armed me
  chosen_korean: 저에게 전투를 위한 힘을 입히시고
  alternatives_korean:
  - 저에게 전투를 위해 띠를 두르시고
  - 저에게 전투를 위해 무장시키시고
  lexicon: HALOT
  rationale: 히브리어 동사는 원래 ‘띠를 두르다/준비시키다’의 이미지를 가지지만, 문맥상 전투 준비를 뜻하므로 한국어에서는 ‘힘을 입히시고’로 자연스럽게 옮겨 무장·준비의 의미를 살렸습니다.
- source_word: חַיִל
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 능력
  - 용맹
  - 군사력
  lexicon: HALOT
  rationale: 여기서는 전투를 위해 부여된 역량을 가리키므로 ‘힘’이 가장 सीधे하고 현대적인 표현입니다.
- source_word: תַּכְרִיעַ
  english_pob_choice: you caused those who rose against me to bow
  chosen_korean: 저에게 맞서 일어나는 자들을 제 아래로 굴복시키셨습니다
  alternatives_korean:
  - 저에게 맞서 일어나는 자들을 제 아래로 굽히셨습니다
  - 저에게 맞서 일어나는 자들을 제 아래로 꺾으셨습니다
  lexicon: HALOT
  rationale: 동사는 단순히 ‘내리치다’보다 상대를 엎드리게 하거나 굴복시키는 뜻이므로, ‘굴복시키셨습니다’가 POB의 의미를 잘 드러냅니다.
- source_word: קָמַי
  english_pob_choice: those who rose against me
  chosen_korean: 저에게 맞서 일어나는 자들
  alternatives_korean:
  - 제게 대항하는 자들
  - 제 반역자들
  - 저를 대적하는 자들
  lexicon: HALOT
  rationale: 직역하면 ‘일어나는 자들’이지만, 적대적 봉기의 뉘앙스를 살리기 위해 ‘저에게 맞서 일어나는 자들’로 옮겼습니다.
theological_decisions:
- issue: 전투 은유와 승리의 귀속
  chosen_reading: 다윗의 군사적 승리가 자기 능력이 아니라 주께서 주신 힘과 굴복시키심에서 비롯된 것으로 표현했습니다.
  alternative_readings:
  - 단순한 군사적 성공 묘사로 읽는 방법
  - ‘무장’ 이미지를 약화시켜 일반적 보호로 읽는 방법
  rationale: 문맥상 시인은 전투 승리를 주의 행위로 돌리고 있으므로, 군사적 은유를 약화하지 않고 그대로 유지하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 시편/사무엘하의 왕권 신학과 주의 구원 행위
