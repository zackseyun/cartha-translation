  text: וַ/יֵּ֥ט שָׁמַ֖יִם וַ/יֵּרַ֑ד וַ/עֲרָפֶ֖ל תַּ֥חַת רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/010.yaml
  text: He bent the heavens and came down[a]; thick darkness was under his feet.
  footnotes:
  - marker: a
    text: Or 'dark cloud' for 'thick darkness'; the Hebrew עֲרָפֶל can denote dense gloom associated with the LORD's appearing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분이 하늘들을 굽히시고 내려오셨습니다[a]. 그분의 발 아래에는 짙은 어둠이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘짙은 구름’으로 옮길 수 있습니다. 히브리어 עֲרָפֶל은 여호와의 나타나심과 관련된 짙은 어둠을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  english_pob_choice: bent
  chosen_korean: 굽히시고
  alternatives_korean:
  - 구부리시고
  - 기울이시고
  - 펼치시고
  lexicon: HALOT
  rationale: שָׁמַיִם을 목적어로 둔 동작이므로 하늘이 아래로 ‘굽혀지는’ 형상을 살렸습니다. ‘구부리다’보다 문어적이고, 원문의 우주적 신현 이미지를 더 직접적으로 드러냅니다.
- source_word: שָׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘들을
  alternatives_korean:
  - 하늘
  - 하늘을
  lexicon: HALOT
  rationale: 히브리어 복수형의 형식을 반영해 ‘하늘들’로 옮겼습니다. 단수 ‘하늘’보다 원문의 장중한 우주적 범위를 더 잘 보존합니다.
- source_word: וַעֲרָפֶל
  english_pob_choice: thick darkness
  chosen_korean: 짙은 어둠
  alternatives_korean:
  - 짙은 흑암
  - 먹구름 같은 어둠
  - 깊은 어둠
  lexicon: HALOT
  rationale: עֲרָפֶל의 밀도감과 신현에 동반되는 어둠을 살리되, 한국어에서 가장 자연스럽고 읽기 쉬운 표현으로 옮겼습니다. ‘먹구름’은 해석이 더 강해져 본문을 좁힐 수 있습니다.
- source_word: רַגְלָיו
  english_pob_choice: his feet
  chosen_korean: 그분의 발
  alternatives_korean:
  - 그의 발
  - 발
  - 발자국
  lexicon: HALOT
  rationale: 직역에 가깝게 신체 이미지를 유지했습니다. ‘발자국’으로 바꾸면 원문의 구체적 공간적 표현이 약해집니다.
theological_decisions:
- issue: 하나님의 신현을 묘사하는 신체적·공간적 언어
  chosen_reading: ‘하늘들을 굽히시고 내려오셨습니다’와 ‘그분의 발 아래’라는 표현을 그대로 유지했습니다.
  alternative_readings:
  - 비인격적 표현으로 완화해 ‘하늘에서 임하셨습니다’처럼 옮기기
  rationale: 본문은 하나님의 초월성을 훼손하지 않으면서도 의도적으로 신체적·공간적 이미지를 사용합니다. 이 긴장을 보존하는 것이 원문의 시적 신현을 살리는 번역에 더 부합합니다.
  doctrine_reference: Translation philosophy §3
