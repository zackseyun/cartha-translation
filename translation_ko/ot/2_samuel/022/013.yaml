lexical_decisions:
- source_word: מִנֹּגַהּ
  english_pob_choice: From the brightness
  chosen_korean: 그분 앞의 빛남으로부터
  alternatives_korean:
  - 밝음으로부터
  - 광채로부터
  - 빛남에서
  lexicon: HALOT
  rationale: נֹגַהּ는 밝은 빛, 광채, 빛남의 뜻이므로, 시적·신현적 분위기를 살리되 현대 한국어에서 자연스러운 ‘빛남’으로 옮겼습니다. מִן은 출발점/근원을 나타내어 ‘-으로부터’로 처리했습니다.
- source_word: נֶגְדּוֹ
  english_pob_choice: before him
  chosen_korean: 그분 앞의
  alternatives_korean:
  - 그분 앞에 있는
  - 그분 면전의
  - 그분 앞에
  lexicon: HALOT
  rationale: נֶגֶד + 3인칭 남성 단수 접미사는 ‘그 앞에/그 면전에’ 있는 위치를 가리키므로, 반복을 줄이면서도 공간적 방향을 보존하는 ‘그분 앞의’로 옮겼습니다.
- source_word: בָּעֲרוּ
  english_pob_choice: blazed forth
  chosen_korean: 타올랐습니다
  alternatives_korean:
  - 불탔습니다
  - 활활 타올랐습니다
  - 불길이 치솟았습니다
  lexicon: HALOT
  rationale: בער는 타다/활활 타오르다의 뜻이어서, 갑작스럽고 강한 점화를 드러내는 한국어 동사 ‘타올랐습니다’가 시적 긴장과 동작성을 잘 살립니다.
- source_word: גַּחֲלֵי אֵשׁ
  english_pob_choice: coals of fire
  chosen_korean: 불의 숯들
  alternatives_korean:
  - 불타는 숯
  - 화염의 숯들
  - 불숯
  lexicon: HALOT
  rationale: 직역하면 ‘불의 숯들’이지만, 한국어에서는 ‘불의 숯들’이 다소 어색할 수 있어 의미를 유지하면서도 자연스러운 ‘불의 숯들’로 정리했습니다. 복수형을 살려 심상적 집합성을 보존했습니다.
theological_decisions:
- issue: 신현적 이미지의 주어를 명시하지 않음
  chosen_reading: 불과 숯이 그분에게서 나오는 장면을 암시하되, 본문에 없는 추가 동사나 원인을 보탤 수 없어 그대로 이미지 중심으로 옮겼습니다.
  alternative_readings:
  - ‘그분의 빛남이 불의 숯들을 타오르게 했습니다’처럼 원인관계를 명시하는 번역
  rationale: 히브리어는 매우 압축된 시적 표현이므로, 본문이 말하는 신현의 장면을 유지하면서도 해석적 확장을 피하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
