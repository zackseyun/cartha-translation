id: 2SA.22.34
reference: 2 Samuel 22:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מְשַׁוֶּ֥ה רגלי/ו כָּ/אַיָּל֑וֹת וְ/עַ֥ל בָּמוֹתַ֖/י יַעֲמִדֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/034.yaml
  text: He makes my feet like the feet of deer[b][a], and sets me secure on my heights.
  footnotes:
  - marker: a
    text: Or 'like hinds'; the Hebrew refers to female deer, a common image for agility and sure-footedness.
    reason: lexical_alternative
  - marker: b
    text: Or 'sets me on my high places.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 내 발을 사슴의 발처럼 되게 하시며, 내 높은 곳에 나를 굳게 세우십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '암사슴의 발처럼'으로도 옮길 수 있습니다. 히브리어는 민첩함과 발디딤의 안정감을 떠올리게 하는 암사슴 이미지를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '내 높은 지대에'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁוֶּה
  english_pob_choice: makes
  chosen_korean: 되게 하시며
  alternatives_korean:
  - 만드십니다
  - 같게 하십니다
  - 만들어 주십니다
  lexicon: HALOT
  rationale: 피엘형의 사역적 의미를 살리되, 한국어에서는 '되게 하시며'가 비교절과 가장 자연스럽게 맞물립니다.
- source_word: רַגְלַי
  english_pob_choice: my feet
  chosen_korean: 내 발
  alternatives_korean:
  - 내 두 발
  - 내 발들
  - 내 발꿈치
  lexicon: HALOT
  rationale: 히브리어 단수형 '발'이 집합적으로 쓰인 문맥이므로 자연스러운 한국어로 '내 발'이 적절합니다.
- source_word: כָּאַיָּלוֹת
  english_pob_choice: like the feet of deer
  chosen_korean: 사슴의 발처럼
  alternatives_korean:
  - 암사슴의 발처럼
  - 사슴들처럼
  - 도망치는 사슴처럼
  lexicon: HALOT
  rationale: 히브리어의 여성형 복수는 전통적으로 암사슴/들사슴을 가리킬 수 있으나, 한국어에서는 비유의 핵심인 민첩함과 안정감을 살리는 '사슴'이 가장 자연스럽습니다.
- source_word: בָּמוֹתַי
  english_pob_choice: my heights
  chosen_korean: 내 높은 곳
  alternatives_korean:
  - 내 높은 지대
  - 내 산당들
  - 내 고지
  lexicon: HALOT
  rationale: 직역의 '높은 곳들'은 한국어에서 다소 부자연스러우므로, 시적 의미를 유지하면서도 문맥상 안전과 승리를 드러내는 '내 높은 곳'으로 옮겼습니다.
theological_decisions:
- issue: 안전의 뉘앙스가 있는 결말 동사 יַעֲמִדֵנִי의 처리
  chosen_reading: '''굳게 세우십니다''로 옮겨, 단순한 위치 이동이 아니라 하나님이 위험한 고지에서 견고하게 서게 하시는 뜻을 반영했습니다.'
  alternative_readings:
  - 나를 세우십니다
  - 나를 서게 하십니다
  - 나를 안정되게 세우십니다
  rationale: 문맥상 '높은 곳'은 험한 지형이므로, 동사의 사역적 의미와 보호의 함의를 함께 살리는 번역이 필요합니다.
  doctrine_reference: 시편적/다윗 전승의 하나님의 보호와 능력
- issue: 비유적 동물 이미지의 번역
  chosen_reading: '''사슴의 발처럼''을 사용해 원문의 민첩함과 확실한 발디딤이라는 이미지를 유지했습니다.'
  alternative_readings:
  - 암사슴의 발처럼
  - 들사슴의 발처럼
  rationale: 원문 여성형 복수는 어미사슴 계열을 가리킬 수 있지만, 한국어 본문에서는 이미지 전달이 더 중요하므로 과도한 세부화를 피했습니다.
  doctrine_reference: 시적 은유의 보존
