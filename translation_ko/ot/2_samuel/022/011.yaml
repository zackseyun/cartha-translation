base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/011.yaml
  text: He rode on a cherub and flew[a]; he appeared on the wings of the wind.
  footnotes:
  - marker: a
    text: Or, 'he appeared on the wings of the wind.' The Hebrew verb can be understood as 'was seen' or 'appeared.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 그룹을 타고 날으셨습니다; 바람의 날개 위에 나타나셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보이셨습니다.’ 히브리어 동사는 ‘나타나다’ 또는 ‘보이다’로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְכַּב עַל כְּרוּב
  english_pob_choice: He rode on a cherub
  chosen_korean: 그는 그룹을 타고
  alternatives_korean:
  - 그는 케루빔을 타고
  - 그는 그룹 위에 타고
  lexicon: HALOT
  rationale: כְּרוּב은 성경적 하늘 존재를 가리키므로, 통용되는 교회어휘인 ‘그룹’을 유지하되 동사의 행위를 자연스럽게 살려 ‘타고’로 옮겼습니다.
- source_word: וַיָּעֹף
  english_pob_choice: and flew
  chosen_korean: 날아가셨습니다
  alternatives_korean:
  - 날아갔습니다
  - 날았습니다
  lexicon: HALOT
  rationale: עוף의 기본 의미인 ‘날다’를 반영하되, 앞의 신적 주어를 고려해 한국어에서는 존칭 종결을 써서 합쇼체로 맞췄습니다.
- source_word: וַיֵּרָא
  english_pob_choice: he appeared
  chosen_korean: 나타나셨습니다
  alternatives_korean:
  - 보이셨습니다
  - 드러나셨습니다
  lexicon: HALOT
  rationale: 히브리어 לא the Niphal of ראה는 ‘보이다/나타나다’의 여지가 있어, 시적 신현 맥락에 맞는 ‘나타나셨습니다’를 택했습니다.
- source_word: כַּנְפֵי רוּחַ
  english_pob_choice: the wings of the wind
  chosen_korean: 바람의 날개 위에
  alternatives_korean:
  - 바람의 날개 위에서
  - 바람의 날개에
  lexicon: HALOT
  rationale: 직역하면 ‘바람의 날개’이지만, 한국어에서는 관용적으로 ‘~위에’가 시각적 이미지를 더 자연스럽게 전달합니다.
theological_decisions:
- issue: 신현적 시적 이미지의 보존
  chosen_reading: ‘그룹을 타고 날아가셨습니다; 바람의 날개 위에 나타나셨습니다’라는 구체적 이미지를 유지했습니다.
  alternative_readings:
  - 하나님의 권능으로 오셨습니다
  - 폭풍 가운데 임하셨습니다
  rationale: 이 절은 하나님의 현현을 묘사하는 시어이므로, 의미를 추상화하지 않고 원문이 주는 영상성을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
