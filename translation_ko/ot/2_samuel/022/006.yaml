  text: 스올의 줄이 저를 둘러쌌고, 죽음의 올무가 저를 맞닥뜨렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스올’은 ‘무덤’ 또는 ‘죽은 자들의 영역’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘맞닥뜨렸습니다’는 ‘만났습니다’ 또는 ‘먼저 다가왔습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
