theological_decisions:
- issue: שְׁאוֹל의 한국어 처리
  chosen_reading: 고유 개념을 살리기 위해 '스올'로 음역했습니다.
  alternative_readings:
  - 무덤
  - 저승
  - 죽은 자의 세계
  rationale: 이 절은 죽음/음부의 영역을 단일 이미지로 환원하기보다, 히브리 성경의 고유한 사후 세계 개념을 그대로 들려주는 편이 원문의 긴장을 보존합니다.
  doctrine_reference: Original-language primacy; preserve theological tension rather than resolving it in translation.
