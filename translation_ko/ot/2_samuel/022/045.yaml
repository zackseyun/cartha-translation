source:
  edition: WLC
  text: בְּנֵ֥י נֵכָ֖ר יִתְכַּֽחֲשׁוּ לִ֑/י לִ/שְׁמ֥וֹעַ אֹ֖זֶן יִשָּׁ֥מְעוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/045.yaml
  text: The sons of foreigners come cringing to me[b][a]; at the hearing of the ear they obey me.
  footnotes:
  - marker: a
    text: Or 'feign obedience to me,' highlighting the nuance of reluctant or insincere submission in the Hebrew verb.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'at the hearing of the ear'; that is, 'as soon as they hear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이방의 자손들이 나에게 거짓으로 복종합니다[a]. 귀로 듣자마자[b] 나에게 순종합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마지못해 굴복합니다’로 옮길 수 있습니다. 히브리어 동사에는 겉으로만 복종하거나 불성실하게 복종하는 뉘앙스가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘귀의 들음에’이며, 뜻은 ‘듣자마자’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  english_pob_choice: The sons of foreigners
  chosen_korean: 이방인의 아들들
  alternatives_korean:
  - 외국인의 아들들
  - 낯선 자들의 아들들
  - 이방인들
  lexicon: HALOT
  rationale: בְּנֵי נֵכָר의 직역 구조를 살려 ‘아들들’과 ‘이방인’의 관계를 보존했습니다. ‘이방인들’로 단순화하면 히브리어의 관용적 병렬과 인적 계층감을 덜 드러냅니다.
- source_word: יִתְכַּחֲשׁוּ לִי
  english_pob_choice: come cringing to me
  chosen_korean: 나에게 굴복합니다
  alternatives_korean:
  - 나에게 비굴하게 다가옵니다
  - 나에게 순종하는 척합니다
  - 나에게 항복합니다
  lexicon: HALOT
  rationale: 이 동사의 핵심에는 자발적 복종보다 강요된 굴복이나 불성실한 복종의 뉘앙스가 있어, 문맥상 승리 노래의 압도적 복속을 ‘굴복합니다’로 옮겼습니다. 필요하면 ‘순종하는 척하다’의 뉘앙스를 각주로 보완할 수 있습니다.
- source_word: לִשְׁמֹעַ אֹזֶן
  english_pob_choice: at the hearing of the ear
  chosen_korean: 귀로 듣자마자
  alternatives_korean:
  - 귀가 듣는 즉시
  - 귀에 들리는 대로
  - 귀로 들을 때
  lexicon: HALOT
  rationale: 히브리어 관용구가 ‘듣는 즉시’의 신속한 반응을 뜻하므로, 형태를 지나치게 경직시키지 않으면서 즉각성을 자연스럽게 살렸습니다.
- source_word: יִשָּׁמְעוּ לִי
  english_pob_choice: they obey me
  chosen_korean: 나에게 순종합니다
  alternatives_korean:
  - 나에게 듣습니다
  - 나에게 복종합니다
  - 나의 말을 따릅니다
  lexicon: HALOT
  rationale: שׁמע + ל는 단순 청취보다 수용과 복종을 가리키므로 ‘순종합니다’가 기능적 의미를 가장 잘 드러냅니다.
theological_decisions:
- issue: 정복 전승에서의 복종 표현 강도
  chosen_reading: ‘굴복합니다’로 번역해 강제된 복속의 성격을 보존했습니다.
  alternative_readings:
  - ‘순종합니다’로 완화
  - ‘항복합니다’로 더 군사적으로 번역
  rationale: 본문은 자발적 협조가 아니라 왕의 승리 아래 놓인 민족들의 굴복을 묘사하므로, 부드러운 종교적 표현보다 원문의 압박감을 살리는 것이 적절합니다.
  doctrine_reference: 시편/사무엘하의 왕권·정복 이미지
- issue: 두 번째 절의 속도감과 병렬성
  chosen_reading: ‘귀로 듣자마자’로 옮겨 즉각 반응의 의미를 강조했습니다.
  alternative_readings:
  - ‘들리는 즉시’
  - ‘들을 때마다’
  rationale: 히브리어 관용구는 시간의 지체 없이 응답하는 모습을 말하므로, 본문의 병렬 구조와 속도감을 한국어에서 분명히 드러냈습니다.
  doctrine_reference: 히브리어 관용구의 서술적 기능
