review_pass:
  verdict: revise
  source_fidelity: יִתְכַּחֲשׁוּ לִי conveys feigned, insincere, or compelled allegiance, not merely straightforward surrender. ‘나에게 굴복합니다’ captures the conquest setting but omits the verb’s central dissembling nuance. The immediate-hearing idiom and the sense of obedience in the second clause are conveyed accurately.
  naturalness: The draft uses clear modern formal-polite Korean. ‘이방인의 아들들’ is understandable but can suggest literal sons of individual foreigners; ‘이방의 자손들’ more closely retains the Hebrew idiomatic construction while reading naturally. The footnote marker for the hearing idiom must be attached to the relevant second-clause expression.
  terminology: ‘이방의 자손들’ preserves בני נכר without reducing it to simply ‘이방인들.’ ‘거짓으로 복종합니다’ represents the insincere-submission nuance without imposing a theological interpretation. ‘순종합니다’ appropriately renders שמע + ל in this context.
  issues:
  - severity: medium
    issue: The rendering ‘나에게 굴복합니다’ does not state the feigned/insincere dimension of יִתְכַּחֲשׁוּ.
    rationale: The Hitpael of כחש here denotes deceptive or forced outward submission. Since Korean can express this directly and naturally, the main text should preserve it rather than leaving the principal semantic feature only to a footnote.
  - severity: medium
    issue: Footnote marker b is anchored after ‘굴복합니다,’ though its note explains ‘귀로 듣자마자.’
    rationale: The marker must be placed immediately after the expression it explains. This is a footnote-anchor structural and usability correction.
  - severity: low
    issue: ‘이방인의 아들들’ can be read as biological sons of particular foreign individuals.
    rationale: ‘이방의 자손들’ better reflects the Hebrew idiom בני נכר while maintaining the source’s collective designation.
  revised_text: 이방의 자손들이 나에게 거짓으로 복종합니다[a]. 귀로 듣자마자[b] 나에게 순종합니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘마지못해 굴복합니다’로 옮길 수 있습니다. 히브리어 동사에는 겉으로만 복종하거나 불성실하게 복종하는 뉘앙스가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘귀의 들음에’이며, 뜻은 ‘듣자마자’입니다.
    reason: lexical_alternative
  revision_rationale: 수정문은 첫 동사의 거짓되거나 겉으로만 하는 복종의 의미를 본문에 반영하고, 둘째 절의 즉각성 및 복종의 의미를 유지합니다. 또한 각주 표지를 해당 표현에 정확히 연결했습니다. 두 절의 현재형 합쇼체 서술은 시적 노래의 일반적·생생한 진술로 자연스럽습니다.
