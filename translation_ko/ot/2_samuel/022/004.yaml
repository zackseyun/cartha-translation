  source_fidelity: 개정이 필요합니다. אִוָּשֵׁעַ는 1인칭 단수 니팔(수동)으로, 초안의 ‘나를 ... 구원하십니다’는 야훼를 능동 주어로 전환하여 원문의 문법적 초점을 바꿉니다. ‘구원을 받습니다’는 수동성과 1인칭 화자를 보존합니다. קרא בְּשֵׁם의 기도·호소 의미는 ‘야훼께 부르짖다’로 적절히 드러납니다.
  naturalness: ‘그분은’으로 새 문장을 시작하면 앞의 ‘야훼’와 수동형 결과절의 연결이 다소 느슨해집니다. 분사 מְהֻלָּל을 ‘찬양받기에 합당하신’으로 야훼를 꾸미고, 두 동사를 ‘-며’로 연결하면 현대 표준어 합쇼체에서 자연스럽고 시적 흐름도 유지됩니다.
  terminology: ‘야훼’는 제공된 영어 POB의 Yahweh 선택 및 프로젝트 방침과 일치합니다. ‘찬양받기에 합당하신’은 מְהֻלָּל의 ‘찬양받을/찬양받기에 합당한’ 뜻을 자연스럽게 전달합니다. ‘구원’은 ישׁע의 어휘 연결을 유지합니다.
  issues:
