  - marker: a
    text: Or 'praised' / 'to be praised.' The Hebrew participle describes the LORD as one who is to be praised; 'worthy of praise' makes the sense explicit in natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 야훼께 부르짖습니다. 그분은 찬양받기에 합당하시며, 나를 내 원수들에게서 구원하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘찬양받으신다’ / ‘찬양받기에 합당하시다.’ 히브리어 분사는 야훼를 ‘찬양받아야 할 분’으로 묘사하므로, 자연스러운 한국어로 그 뜻을 분명히 했습니다.
    reason: lexical_alternative
