  lexicon: proprietary POB rendering
  rationale: 언약 이름을 대체 칭호로 바꾸지 않고, 프로젝트 기본값에 따라 신명기식 고유명으로 옮겼습니다.
- source_word: כְּצִדְקָתִי
  english_pob_choice: according to my righteousness
  chosen_korean: 제 의로움에 따라
  alternatives_korean:
  - 제 의에 따라
  - 제 정의에 따라
  lexicon: HALOT
  rationale: צדקה의 개인적·도덕적 차원을 살리면서, 한국어에서는 '의'보다 '의로움'이 이 맥락의 자기 진술을 더 자연스럽게 드러냅니다.
- source_word: כְּבֹרִי
  english_pob_choice: according to my cleanness
  chosen_korean: 제 깨끗함에 따라
  alternatives_korean:
  - 제 순결함에 따라
  - 제 정결함에 따라
  - 제 청결함에 따라
  lexicon: HALOT
  rationale: בֹּר의 핵심 의미인 깨끗함/청결함을 직접 반영했습니다. '정결'은 제의적 뉘앙스를 더 강하게 띨 수 있어 여기서는 덜 좁은 표현을 택했습니다.
- source_word: לְנֶגֶד עֵינָיו
  english_pob_choice: before his eyes
  chosen_korean: 그의 눈앞에서
  alternatives_korean:
  - 그의 시야에서
  - 그의 눈앞에서 보기에
  lexicon: HALOT
  rationale: 직역의 구체적 이미지('눈앞')를 살리되 한국어로 자연스럽게 연결했습니다. 영어 POB의 주석처럼 의미는 '그의 보시기에'입니다.
theological_decisions:
- issue: 다윗의 의로움과 깨끗함에 대한 직접적 진술
  chosen_reading: 본문의 1인칭 진술을 약화시키지 않고 그대로 유지했습니다.
  alternative_readings:
  - 문맥상 언약적 신실함으로 풀어 쓰기
  - 다윗의 죄와의 긴장을 피하려고 완화하기
  rationale: 히브리어는 여호와께서 다윗을 그의 의로움과 깨끗함에 따라 갚으셨다고 직접 말합니다. 본문이 가진 신학적 긴장을 번역문에서 미리 해소하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
