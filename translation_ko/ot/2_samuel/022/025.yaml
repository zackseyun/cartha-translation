translation:
  language: ko
  text: 야훼께서 제게 제 의로움에 따라, 그의 눈앞[a]에서의 제 깨끗함[b]에 따라 갚으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 ‘그의 보시기에’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 순결함에 따라’. 히브리어 표현은 깨끗함 또는 순결함을 뜻합니다.
    reason: lexical_alternative
