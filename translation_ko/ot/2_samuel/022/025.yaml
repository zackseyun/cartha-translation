base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/025.yaml
  text: And Yahweh repaid me according to my righteousness[b][a], according to my cleanness before his eyes.
  footnotes:
  - marker: a
    text: Or 'according to my purity.' The Hebrew term denotes cleanness or purity.
    reason: lexical_alternative
  - marker: b
    text: That is, 'in his sight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 제게 제 의로움에 따라, 그의 눈앞에서의 제 깨끗함에 따라 갚으셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 '그의 보시기에'라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '제 순결함에 따라'. 히브리어 표현은 깨끗함 또는 순결함을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  english_pob_choice: repaid
  chosen_korean: 갚으셨습니다
  alternatives_korean:
  - 되돌려 주셨습니다
  - 보상하셨습니다
  - 보답하셨습니다
  lexicon: HALOT
  rationale: 보복이 아니라 되갚음·응답의 의미를 살리면서도, 보응의 문맥에 맞는 자연스러운 합쇼체로 옮겼습니다.
- source_word: יְהוָה
