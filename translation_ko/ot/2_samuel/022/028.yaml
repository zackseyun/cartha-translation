base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/028.yaml
  text: You save an afflicted people[b][a], but your eyes are on the haughty to bring them low.
  footnotes:
  - marker: a
    text: Or 'poor people.' The Hebrew adjective can denote those who are poor, afflicted, or oppressed.
    reason: lexical_alternative
  - marker: b
    text: Or 'the proud.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 고난받는 백성을[a] 구원하시지만, 주님의 눈은 오만한 자들[b]을 향하고 계시며 그들을 낮추십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가난한 백성’. 히브리어 형용사는 가난한 사람, 고난을 당하는 사람, 또는 억눌린 사람을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘교만한 자들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם עָנִי
  english_pob_choice: afflicted people
  chosen_korean: 괴로운 백성
  alternatives_korean:
  - 고난받는 백성
  - 억눌린 백성
  - 가난한 백성
  lexicon: HALOT
  rationale: עָנִי는 단순한 경제적 빈곤보다 고난·억눌림·낮아짐을 아우를 수 있으므로, 한국어에서는 ‘괴로운’으로 그 폭을 살리면서 백성이라는 집합명사와 자연스럽게 연결했습니다.
- source_word: תּוֹשִׁיעַ
  english_pob_choice: you save
  chosen_korean: 구원하시고
  alternatives_korean:
  - 구하시고
  - 건지시고
  - 살리시고
  lexicon: HALOT
  rationale: 히필형 ישׁע의 기본 의미를 따라 ‘구원하다’로 옮기되, 앞뒤 평행 구조를 위해 연결형으로 처리했습니다.
- source_word: רָמִים
  english_pob_choice: the haughty
  chosen_korean: 오만한 자들
  alternatives_korean:
  - 교만한 자들
  - 높은 자들
  - 거만한 자들
  lexicon: HALOT
  rationale: 문맥상 긍정적 ‘높음’이 아니라 도덕적 우월감을 지닌 사람들을 가리키므로, ‘오만한 자들’이 대비를 가장 분명하게 드러냅니다.
- source_word: תַּשְׁפִּיל
  english_pob_choice: to bring them low
  chosen_korean: 낮추십니다
  alternatives_korean:
  - 낮추십니다
  - 끌어내리십니다
  - 천하게 하십니다
  lexicon: HALOT
  rationale: 히필형 שׁפל의 핵심 의미인 ‘낮게 하다/낮추다’를 간결하게 살렸고, 시적 평행과 현재적 진술감을 유지했습니다.
theological_decisions:
- issue: ‘afflicted’의 번역 범위
  chosen_reading: 사회경제적 빈곤으로만 좁히지 않고, 고난받고 억눌린 낮은 처지를 함께 담는 표현으로 옮겼습니다.
  alternative_readings:
  - 가난한 백성으로만 번역
  - 겸손한 백성으로만 번역
  rationale: 히브리어 עָנִי와 문맥은 가난, 억눌림, 낮아짐을 함께 허용하므로, 번역에서 한 가지 의미로 환원하지 않고 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; optimal equivalence'
