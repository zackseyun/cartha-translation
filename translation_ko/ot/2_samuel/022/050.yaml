  text: Therefore I will praise you among the nations[a], O Yahweh, and I will sing praise to your name.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Yahweh.'' The main text follows the project’s standard rendering of the divine name as ''the LORD.'''
