translation:
  language: ko
  text: 그러므로 내가 주님께 열방 가운데서 당신을 찬양하며, 당신의 이름을 노래하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘야훼’입니다.
    reason: source_note
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 따라서
  lexicon: HALOT
  rationale: 앞선 구원의 결과를 이끄는 결론 표지이므로, 현대 한국어에서 가장 자연스럽고 논리 관계를 분명히 하는 ‘그러므로’를 택했습니다.
- source_word: אוֹדְךָ
  english_pob_choice: I will praise you
  chosen_korean: 내가 주님께 … 찬양하며
  alternatives_korean:
  - 내가 주님께 감사하며
  - 내가 주님을 찬양하며
  lexicon: HALOT
  rationale: ידה의 예배적 용법에서 ‘감사하다/찬양하다’가 모두 가능하지만, 다음 절의 ‘노래하겠습니다’와 병렬을 이루는 시적 문맥을 살려 ‘찬양하다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 절은 히브리어 본문에서 하나님의 이름을 직접 지칭하지만, 한국어 합쇼체 본문에서는 경어 호칭이 자연스러워 ‘주님’으로 옮기고, 고유 이름 표기는 본문을 과도하게 중단시키지 않도록 하지 않았습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 열방 가운데서
  alternatives_korean:
  - 민족들 가운데서
  - 나라들 가운데서
  lexicon: HALOT
  rationale: גּוֹיִם은 이스라엘 밖의 여러 민족을 가리키며, 시편적 평행법에서는 ‘열방’이 가장 압축적이고 문맥에 맞는 표준 한국어입니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 본문에는 ‘주님’으로 옮기고, 고유 이름 ‘야훼’는 표면화하지 않았습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 시적 1인칭 고백에서 직접 호칭은 합쇼체의 경어 체계를 따라 ‘주님’이 가장 자연스럽습니다. 다만 본 절의 מקור은 YHWH이므로, 번역 방향은 이름을 지시하는 것이며 신학적 의미를 약화시키지 않습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
