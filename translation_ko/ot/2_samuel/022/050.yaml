- from: 그러므로 내가 주님께 열방 가운데서 당신을 찬양하며, 당신의 이름을 노래하겠습니다.[a]
  to: 그러므로 제가 야훼를 열방 가운데서 찬양하고, 야훼의 이름을 노래하겠습니다.
  rationale: 직접 호격 יהוה를 POB 방침과 원문에 따라 ‘야훼’로 표기하고, 찬양의 대상과 장소를 자연스러운 한국어 어순으로 바로잡았습니다. ‘이름을 노래하겠습니다’는 לְשִׁמְךָ와 אֲזַמֵּר의 시적 표현을 보존합니다.
