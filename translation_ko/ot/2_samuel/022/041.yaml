base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/041.yaml
  text: You gave me the necks of my enemies[a]; I destroyed those who hated me.
  footnotes:
  - marker: a
    text: Hebrew literally, 'You gave me the neck/back of my enemies,' an idiom for causing enemies to turn and flee before the victor.
