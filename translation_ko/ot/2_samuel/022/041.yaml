translation:
  language: ko
  text: 주께서 제 원수들의 목을 제게 내주셨습니다. 저를 미워하던 자들을 제가 멸망시켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘원수들의 목/뒤목을 제게 주셨다’로, 적이 등을 돌리고 패주하게 된 모습을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּתָּה לִּי עֹרֶף
  english_pob_choice: you gave me the necks of my enemies
  chosen_korean: “주께서 제 원수들의 목을 제게 내주셨습니다”
  alternatives_korean:
  - “주께서 제 원수들의 등을 제게 주셨습니다”
  - “주께서 제 원수들이 등을 돌리게 하셨습니다”
  lexicon: HALOT
  rationale: עֹרֶף는 문자적으로 ‘목/뒤목’이지만, 본문에서는 패주하도록 굴복시키는 전투 관용구이므로 ‘목을 내주셨습니다’로 옮겨 원문의 강한 이미지와 전승된 POB 선택을 살렸습니다.
- source_word: אֹיְבַי
  english_pob_choice: my enemies
  chosen_korean: “제 원수들”
  alternatives_korean:
  - “제 적들”
  - “제 원수들”
  lexicon: HALOT
  rationale: 1인칭 소유접미사가 붙은 אֹיֵב는 가장 직접적으로 ‘원수들/적들’의 뜻이므로, 현대 표준어에서 분명한 ‘원수들’로 옮겼습니다.
- source_word: מְשַׂנְאַי
  english_pob_choice: those who hated me
  chosen_korean: “제게 미워하던 자들”
  alternatives_korean:
  - “저를 미워하는 자들”
  - “저를 미워하던 이들”
  lexicon: HALOT
  rationale: 분사형은 단순 과거보다 지속적 성격을 담으므로 ‘미워하던 자들’로 옮겨 적대의 지속성을 살렸습니다.
- source_word: וָאַצְמִיתֵם
  english_pob_choice: I destroyed
  chosen_korean: “제가 멸망시켰습니다”
  alternatives_korean:
  - “제가 파멸시켰습니다”
  - “제가 멸절시켰습니다”
  lexicon: HALOT
  rationale: צמת의 히필은 ‘멸하다/멸망시키다’가 자연스럽고 충분히 강하므로, 현대어에서 의미와 격식을 함께 유지하는 ‘멸망시켰습니다’를 택했습니다.
theological_decisions:
- issue: 전투 승리의 주체 표현
  chosen_reading: 주께서 승리를 주시는 분이라는 점을 분명히 하기 위해 동사 주어를 ‘주께서’로 유지했습니다.
  alternative_readings:
  - ‘주님이’
  - ‘하나님께서’
  rationale: 히브리어 문맥상 승리의 원인은 전적으로 야훼이므로, 서술의 초점을 인간 전사가 아니라 주의 주권적 도움에 두었습니다.
  doctrine_reference: 시편/사무엘하의 전쟁 찬가에서의 신적 구원 강조
- issue: ‘목/등’ 관용구 처리
  chosen_reading: 직역을 완전히 버리지 않고 전투 관용구를 살린 ‘목을 제게 내주셨습니다’를 채택했습니다.
  alternative_readings:
  - ‘등을 돌리게 하셨습니다’
  - ‘도망치게 하셨습니다’
  rationale: 원문은 단순한 도주가 아니라 적이 패주하도록 만드신 장면을 강하게 그리므로, 한국어에서도 시각적 긴장을 유지하는 번역이 적절합니다.
  doctrine_reference: 원문 이미지 보존 원칙
