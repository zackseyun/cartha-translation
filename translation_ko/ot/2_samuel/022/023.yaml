    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그리고 / 그러므로의 의미를 반영한 연결 없이 문맥상 이어지는 서술
  alternatives_korean:
