  rationale: 히브리어 כִּי는 여기서 앞선 진술을 받는 원인·근거의 접속으로 쓰였으므로, 한국어에서는 과도한 접속사를 넣지 않고 시구의 흐름을 자연스럽게 살렸습니다.
- source_word: כָל מִשְׁפָּטָיו
  english_pob_choice: all his judgments
  chosen_korean: 그의 모든 판단
  alternatives_korean:
  - 그의 모든 규례
  - 그의 모든 법도
  - 그의 모든 판결
  lexicon: HALOT
  rationale: מִשְׁפָּט는 단순한 '법'보다 판정·판단의 뉘앙스가 있어, 시편적/지혜적 문맥의 공적 판단을 살리는 '판단'을 택했습니다.
- source_word: לְנֶגְדִּי
  english_pob_choice: were before me
  chosen_korean: 내 앞에 있었고
  alternatives_korean:
  - 내 눈앞에 있었고
  - 내 앞에 늘 있었고
  lexicon: HALOT
  rationale: 관용구의 공간적 이미지를 유지하면서도 현대 한국어에서 자연스럽게 읽히도록 '내 앞에 있었다'로 옮겼습니다.
- source_word: וְחֻקֹּתָיו
  english_pob_choice: his statutes
  chosen_korean: 그의 규례들
  alternatives_korean:
  - 그의 율례들
  - 그의 규정들
  lexicon: HALOT
  rationale: חֻקּוֹת는 고정된 정해진 규범을 가리키므로, 교회 전통어인 '율례'도 가능하지만 더 현대적이면서도 법적·규범적 성격을 드러내는 '규례들'을 선택했습니다.
- source_word: לֹא אָסוּר
  english_pob_choice: I did not turn away
  chosen_korean: 떠나지 않았습니다
  alternatives_korean:
  - 돌이키지 않았습니다
  - 벗어나지 않았습니다
  lexicon: HALOT
  rationale: סוּר의 기본 뜻은 '비키다/떠나다'이므로, 도덕적 이탈까지 포함하는 자연스러운 현대 표현으로 '떠나지 않았다'를 사용했습니다.
theological_decisions:
- issue: 두 법률 용어의 구분 유지
  chosen_reading: מִשְׁפָּטָיו와 חֻקֹּתָיו를 각각 '판단'과 '규례들'로 구별해 번역했습니다.
  alternative_readings:
  - 둘 다 '법도'로 통일
  - 둘 다 '율례'로 통일
  rationale: 병렬 구조 안에서 서로 다른 히브리어 법률 용어를 구별해 주어, 본문의 수사적 대조와 의미 범위를 흐리지 않도록 했습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
