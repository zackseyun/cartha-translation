  text: With the pure you show yourself pure[a], but with the crooked you show yourself twisted.
  footnotes:
  - marker: a
    text: Or 'with the crooked you show yourself twisted/contrary.' The Hebrew verb is rare and difficult; the main text chooses 'shrewd' to convey a fitting response to the devious without suggesting moral crookedness in God.
    reason: lexical_alternative
translation:
  language: ko
  text: 순결한 사람에게는 주님께서 순결하심을 보이시고, 비뚤어진 사람에게는 교묘하게 대하십니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비뚤어진 사람에게는 비뚤어지게 자신을 보이십니다’ 또는 ‘반대로 대하십니다.’ 히브리어 동사는 희귀하고 의미가 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  english_pob_choice: pure
  chosen_korean: 순결한
  alternatives_korean:
  - 깨끗한
  - 흠 없는
  lexicon: HALOT
  rationale: 사람의 성품과 상태를 가리키는 형용사로서 ‘순결한’이 문맥의 도덕적·관계적 깨끗함을 가장 자연스럽게 드러냅니다.
- source_word: תִּתָּבָר
  english_pob_choice: you show yourself pure
  chosen_korean: 순결하게 행하십니다
  alternatives_korean:
  - 스스로 순결하십니다
  - 순결하심을 보이십니다
  lexicon: HALOT
  rationale: 히트파엘의 반사적 뉘앙스를 한국어에서 자연스럽게 살리기 위해, 단순 상태 진술보다 ‘행하다’로 관계적 대응을 표현했습니다.
- source_word: עִקֵּשׁ
  english_pob_choice: crooked
  chosen_korean: 비뚤어진
  alternatives_korean:
  - 굽은
  - 왜곡된
  lexicon: HALOT
  rationale: 도덕적으로 곧지 않은 사람을 가리키는 말로 ‘비뚤어진’이 현대 한국어에서 가장 직관적이고, 앞의 ‘순결한’과 대조도 분명합니다.
- source_word: תִּתַּפָּל
  english_pob_choice: you show yourself shrewd
  chosen_korean: 비뚤어지게 행하십니다
  alternatives_korean:
  - 비뚤어진 방식으로 대하십니다
  - 그에 맞서 비뚤어진 자처럼 행하십니다
  lexicon: HALOT
  rationale: 히브리어의 희귀하고 난해한 동사를 직역하면 하나님께 도덕적 비뚤어짐을 돌릴 위험이 있어, 원문의 대응적 의미를 살리되 하나님의 성품은 훼손하지 않는 방식으로 옮겼습니다.
theological_decisions:
- issue: 하나님이 ‘비뚤어진 자’에게 어떻게 대응하시는가를 표현할 때, 하나님께 도덕적 비뚤어짐을 돌리지 않기
  chosen_reading: 순결한 자에게는 순결하게, 비뚤어진 자에게는 비뚤어지게 행하시는 대응의 대비
  alternative_readings:
  - 비뚤어진 자에게는 기민하게 대하시는 것으로
  - 비뚤어진 자를 상대로 비틀린 방식으로 행하시는 것으로
  rationale: 본문의 병행법은 대응의 적합성을 말하지만, 하나님의 성품을 비도덕적으로 묘사하라고 요구하지는 않습니다. 따라서 원문의 긴장을 유지하면서도 하나님의 거룩함을 해치지 않는 표현을 택했습니다.
  doctrine_reference: 하나님의 거룩하심과 시적 병행의 긴장 유지
