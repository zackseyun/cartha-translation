lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …입니다
  - For
  lexicon: HALOT
  rationale: 앞 구절의 이유를 밝히는 연결어로서, 시가체의 설명적 기능을 살리면서 한국어에서는 문장형 종결로 자연스럽게 풀었습니다.
- source_word: שָׁמַרְתִּי דַּרְכֵי
  english_pob_choice: I have kept the ways
  chosen_korean: 제가 … 길들을 지켰고
  alternatives_korean:
  - 제가 … 길들을 지켰습니다
  - 제가 … 길들을 지켜 왔고
  lexicon: HALOT
  rationale: שׁמר는 ‘지키다/준수하다’의 의미가 핵심이므로 ‘지켰고’로 옮겼습니다. דַּרְכֵי는 관습적 삶의 방식이므로 ‘길들’이 가장 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 공용 번역 관행보다 본문 고유 신명 보존을 우선하여, 문맥상 지시 대상을 이름으로 드러내는 ‘야훼’를 사용했습니다.
- source_word: רָשַׁעְתִּי מֵאֱלֹהָי
  english_pob_choice: have not wickedly departed from my God
  chosen_korean: 내 하나님에게서 악하게 떠나지 않았습니다
  alternatives_korean:
  - 내 하나님에게서 악하게 이탈하지 않았습니다
  - 내 하나님을 거슬러 악하게 행하지 않았습니다
  lexicon: HALOT
  rationale: רשע의 ‘악하게 행하다’와 מן의 ‘~에게서/로부터’가 함께 있어, 단순한 무죄 진술보다 관계적 이탈을 드러내는 ‘악하게 떠나지 않았습니다’가 본문을 가장 가깝게 반영합니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 본문의 신명은 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 시적 자기변론의 맥락에서 신적 이름 자체를 보존하는 것이, 일반 호칭으로 대체하는 것보다 본문의 직접성을 더 잘 살립니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: רָשַׁעְתִּי מֵאֱלֹהָי의 관계적 뉘앙스
  chosen_reading: ‘악하게 떠나지 않았습니다’로 번역해 도덕적 악행과 언약적 이탈을 함께 보존했습니다.
  alternative_readings:
  - 악하게 행동하지 않았습니다
  - 내 하나님을 거슬러 악하지 않았습니다
  rationale: 히브리어는 단순한 도덕 평가보다 ‘하나님에게서 멀어짐’의 관계적 함의를 포함하므로, 그 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: HALOT on רשע + prepositional phrase מן
