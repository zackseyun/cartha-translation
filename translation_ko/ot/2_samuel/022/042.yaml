translation:
  language: ko
  text: 그들은 부르짖었으나 구원할 사람이 없었고, 야훼께 부르짖었으나 그분은 그들에게 대답하지 않으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
