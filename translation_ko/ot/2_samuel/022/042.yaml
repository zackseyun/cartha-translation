  - 주님
  rationale: 본문이 직접 신명을 사용하므로 번역본의 전통적 대체어보다 고유한 언약 이름을 드러내는 번역을 채택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
