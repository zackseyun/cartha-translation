lexical_decisions:
- source_word: יִשְׁעוּ
  english_pob_choice: They cried for help
  chosen_korean: 그들은 부르짖었으나
  alternatives_korean:
  - 그들은 도움을 청했으나
  - 그들은 외쳤으나
  lexicon: HALOT
  rationale: 문맥상 단순한 시선이 아니라 구원을 구하는 절박한 호소이므로 ‘부르짖다’가 가장 자연스럽고 원문 힘을 잘 살립니다.
- source_word: מֹשִׁיעַ
  english_pob_choice: one to save
  chosen_korean: 구원할 사람이 없었고
  alternatives_korean:
  - 구원자가 없었고
  - 도와줄 사람이 없었고
  lexicon: HALOT
  rationale: 분사형이 가리키는 것은 당장의 구원 행위를 할 수 있는 존재의 부재이므로, 제목화된 ‘구원자’보다 기능을 드러내는 표현이 더 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 신명은 ‘야훼’로 옮겨 언약적 고유성을 보존했습니다.
- source_word: וְלֹא עָנָם
  english_pob_choice: but he did not answer them
  chosen_korean: 그분은 그들에게 대답하지 않으셨습니다
  alternatives_korean:
  - 그분은 그들에게 응답하지 않으셨습니다
  - 그분은 그들을 듣지 않으셨습니다
  lexicon: HALOT
  rationale: ענה는 여기서 ‘응답하다/대답하다’의 뜻이므로, 하나님이 호소에 반응하지 않으셨다는 의미를 분명히 하는 쪽이 적절합니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
