  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶהְיֶ֥ה תָמִ֖ים ל֑/וֹ וָ/אֶשְׁתַּמְּרָ֖/ה מֵ/עֲוֺנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/024.yaml
  text: I was blameless before him[b][a], and I kept myself from my iniquity.
  footnotes:
  - marker: a
    text: Or 'I was whole/complete with him.' The Hebrew adjective can emphasize integrity or wholeness, not merely freedom from accusation.
    reason: lexical_alternative
  - marker: b
    text: Or 'I guarded myself from my sin/guilt.' The Hebrew word can mean iniquity, guilt, or sin depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그분 앞에서 흠잡을 데 없었고, 내 죄악에서 나 자신을 지켰습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분과 함께 온전했다.’ 히브리어 형용사는 단순히 비난이 없다는 뜻뿐 아니라 온전함이나 성실함을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 죄/죄책에서 나 자신을 지켰다.’ 히브리어는 문맥에 따라 죄악, 죄책, 죄를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  english_pob_choice: I was
  chosen_korean: 나는 ... 있었고
  alternatives_korean:
  - 나는 ... 되었습니다
  - 나는 ... 있었습니다
  lexicon: HALOT
  rationale: 이 서술형 과거는 단순한 상태 진술이므로 한국어에서도 자연스러운 과거형으로 옮기고, 절 연결은 문맥에 맞게 처리했습니다.
- source_word: תָמִים
  english_pob_choice: blameless
  chosen_korean: 흠잡을 데 없었고
  alternatives_korean:
  - 온전했고
  - 완전했고
  - 책망할 데 없었고
  lexicon: HALOT
  rationale: תָמִים의 핵심인 도덕적·관계적 온전함을 살리되, '죄 없었다'는 과도한 무결성 주장으로 좁히지 않기 위해 '흠잡을 데 없다'를 택했습니다.
- source_word: לוֹ
  english_pob_choice: before him
  chosen_korean: 그분 앞에서
  alternatives_korean:
  - 그분께
  - 그분과 함께
  - 그분 보시기에
  lexicon: HALOT
  rationale: 직역상의 '그에게/그를 향하여'보다, 하나님 앞에서의 평가와 관계를 드러내는 한국어 관용으로 옮겼습니다.
- source_word: וָאֶשְׁתַּמְּרָה
  english_pob_choice: I kept myself
  chosen_korean: 내 자신을 지켰습니다
  alternatives_korean:
  - 나를 지켰습니다
  - 스스로를 지켰습니다
  - 주의했습니다
  lexicon: HALOT
  rationale: 재귀적 자기보호의 뉘앙스를 살리기 위해 '스스로'의 의미를 담았고, 현대 한국어에서는 '내 자신을 지키다'가 가장 자연스럽습니다.
- source_word: מֵעֲוֺנִי
  english_pob_choice: from my iniquity
  chosen_korean: 내 죄악에서
  alternatives_korean:
  - 내 죄에서
  - 내 악행에서
  - 내 죄책에서
  lexicon: HALOT
  rationale: עָוֹן의 도덕적 무게와 '죄/악/죄책'의 의미 범위를 반영해, 문맥상 강한 도덕적 오염을 드러내는 '죄악'을 선택했습니다.
theological_decisions:
- issue: 다윗의 진술이 무죄성 또는 완전무결을 뜻하는지 여부
  chosen_reading: 하나님 앞에서의 충실한 온전함과 자기보호를 말하는 것으로 읽었습니다.
  alternative_readings:
  - 절대적 무죄 또는 도덕적 완전무결의 주장
  rationale: תָמִים과 עָוֹן의 의미 범위를 보존하면, 본문은 죄 없는 인간을 주장하기보다 하나님 앞에서의 성실성과 죄에서의 자기보호를 강조합니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
