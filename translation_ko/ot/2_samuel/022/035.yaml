translation:
  language: ko
  text: 그분은 내 손을 싸움을 위해 훈련시키시며, 내 팔이 청동 활을 굽힐 수 있게 하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전쟁을 위해.’
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내 팔이 청동 활을 굽힙니다.’ 히브리어는 하나님이 주시는 힘 아래 활이 굽혀지는 모습을 담고 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מְלַמֵּד
  english_pob_choice: trains
  chosen_korean: 훈련시키시며
  alternatives_korean:
  - 가르치시며
  - 지시하시며
  lexicon: HALOT
  rationale: למד의 기본 뜻은 ‘가르치다/훈련하다’이며, 전투 맥락에서는 실제 능력 배양을 나타내므로 ‘훈련시키시며’가 가장 자연스럽고 본문 의도를 잘 드러냅니다.
- source_word: יָדַי
  english_pob_choice: my hands
  chosen_korean: 내 손을
  alternatives_korean:
  - 내 손들을
  - 나를
  lexicon: HALOT
  rationale: 복수형을 유지해 몸의 구체성을 살리되, 한국어에서는 ‘손들’보다 단수형 목적격 ‘내 손을’이 자연스럽고 시적 병행을 해치지 않습니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: for battle
  chosen_korean: 싸움을 위해
  alternatives_korean:
  - 전쟁을 위해
  - 전투를 위해
  lexicon: HALOT
  rationale: מִלְחָמָה는 ‘전쟁/전투’ 모두 가능하지만, 앞의 ‘훈련’과 결합할 때 한국어에서는 ‘싸움을 위해’가 무술적·전투적 이미지를 더 직관적으로 전달합니다.
- source_word: וְנִחַת קֶשֶׁת נְחוּשָׁה
  english_pob_choice: my arms can bend a bow of bronze
  chosen_korean: 내 팔이 청동 활을 굽힐 수 있게 하십니다
  alternatives_korean:
  - 내 팔로 청동 활을 굽히게 하십니다
  - 청동 활이 내 팔 아래 굽혀지게 하십니다
  lexicon: HALOT
  rationale: 히브리어는 활이 굽혀지는 장면과 팔의 힘을 함께 암시하므로, 영어 POB의 해석을 따라 능력 부여의 결과를 한국어로 풀어 ‘굽힐 수 있게 하십니다’로 옮겼습니다.
theological_decisions:
- issue: 전투 능력의 신적 기원
  chosen_reading: 이 절은 다윗의 실제 군사적 능력과 힘이 하나님에게서 온다고 말하며, 이를 영적 전쟁으로 일반화하지 않습니다.
  alternative_readings:
  - 신자 일반의 영적 싸움을 뜻하는 보편적 선언
  rationale: 문맥은 왕의 감사 찬양으로서 구체적 역사 상황의 구원과 전투 능력을 노래합니다. 본문이 말하는 범위를 넘어 알레고리화하지 않는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 원어 우선 원칙; 문맥 보존
