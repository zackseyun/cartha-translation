- from: 그는 어둠을 자기 둘레의 한 피난처로 삼으시고, 물의 더미, 하늘의 짙은 구름을 두르셨습니다.[a]
  to: 그분께서는 어둠을 자기 둘레의 은신처들로 삼으셨습니다. 물이 뭉친 덩이, 하늘의 짙은 구름이었습니다.[a]
  rationale: 원문의 단일 동사와 뒤따르는 압축된 명사구의 관계를 보존하기 위해, 물과 구름에 원문에 없는 ‘두르셨습니다’를 부여하지 않았습니다. סֻכּוֹת의 복수형은 ‘은신처들’로 반영하되, 희귀어 חַשְׁרַת의 불확실성은 본문에서 보수적으로 유지하고 각주에서 대안을 밝혔습니다.
