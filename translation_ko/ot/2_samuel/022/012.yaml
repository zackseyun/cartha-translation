  - severity: medium
    issue: ‘한 피난처’가 סֻכּוֹת의 복수형을 단수로 좁힙니다.
    rationale: 집합 단수 자체는 가능하지만, ‘한’은 복수형의 형태적 정보와 둘레를 이루는 여러 가리개의 이미지를 약화합니다.
  - severity: medium
    issue: ‘피난처’는 문맥상 ‘몸을 숨기는 가리개’보다 피난민의 피신처를 더 강하게 연상시킵니다.
    rationale: סֻכּוֹת는 여기서 하나님을 둘러싼 어둠의 은폐·차단 이미지를 나타내므로 ‘은신처들’이 더 직접적입니다.
