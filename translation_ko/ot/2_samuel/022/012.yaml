base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/012.yaml
  text: He made darkness a shelter around him[a], a massing of waters, thick clouds of the skies.
  footnotes:
  - marker: a
    text: Or 'He set darkness around him as shelters; a gathering of waters, thick clouds of the heavens.' The Hebrew is highly poetic, and the rare phrase translated 'a massing of waters' may also be understood as 'gathering of waters' or, more interpretively, 'dark rain clouds.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 어둠을 자기 둘레의 한 피난처로 삼으시고, 물의 더미, 하늘의 짙은 구름을 두르셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 어둠을 자기 둘레에 있는 피난처들로 삼으셨습니다. 물의 모임, 하늘의 짙은 구름.’ 히브리어는 매우 시적이며, 희귀한 ‘물의 더미’는 ‘물의 모임’ 또는 더 해석적으로는 ‘검은 비구름’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁת
  english_pob_choice: He made
  chosen_korean: 삼으시고
  alternatives_korean:
  - 만드셨습니다
  - 두셨습니다
  - 세우셨습니다
  lexicon: HALOT
  rationale: 이 동사는 단순히 '놓다'보다 결과 상태를 이루게 하는 뜻이 있어, 문맥상 '어둠을 피난처로 삼다'로 옮기면 원문의 서술 기능과 시적 압축을 함께 살릴 수 있습니다.
- source_word: סֻכּוֹת
  english_pob_choice: shelters
  chosen_korean: 한 피난처
  alternatives_korean:
  - 피난처들
  - 장막들
  - 초막들
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 한국어에서는 '어둠을 둘레의 한 피난처로'라고 집합적으로 옮기는 편이 자연스럽고, 절기의 '초막' 의미로 오해되지 않게 합니다.
- source_word: חַשְׁרַת מַיִם
  english_pob_choice: a massing of waters
  chosen_korean: 물의 더미
  alternatives_korean:
  - 물의 모임
  - 물의 집합
  - 검은 비구름
  lexicon: HALOT
  rationale: 희귀한 표현으로서 구체적인 폭풍 이미지가 핵심이므로, 해석을 과도하게 넓히지 않으면서도 덩어리감과 응집성을 드러내는 표현을 택했습니다.
- source_word: עָבֵי שְׁחָקִים
  english_pob_choice: thick clouds of the skies
  chosen_korean: 하늘의 짙은 구름
  alternatives_korean:
  - 하늘의 두터운 구름
  - 하늘의 구름 덩이
  lexicon: HALOT
  rationale: עָבֵי는 두텁고 짙은 구름을 뜻하며, שְׁחָקִים는 하늘/창공을 가리키므로, 한국어에서는 '하늘의 짙은 구름'이 가장 직접적입니다.
theological_decisions:
- issue: 시적·신현적 이미지 보존
  chosen_reading: 어둠, 물의 더미, 하늘의 짙은 구름을 하나의 둘러싸는 현현 이미지로 이어서 옮겼습니다.
  alternative_readings:
  - 폭풍 구름으로 해석을 더 분명히 드러내는 번역
  - 이미지를 완화해 서술적으로 푸는 번역
  rationale: 문맥은 야훼의 현현을 둘러싼 어둠과 폭풍 이미지를 병렬적으로 제시하므로, 지나친 설명을 피하고 원문의 긴장과 장중함을 유지하는 것이 적절합니다.
  doctrine_reference: 신현 본문 해석
