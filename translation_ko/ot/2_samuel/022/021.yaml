reference: 2 Samuel 22:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִגְמְלֵ֥/נִי יְהוָ֖ה כְּ/צִדְקָתִ֑/י כְּ/בֹ֥ר יָדַ֖/י יָשִׁ֥יב לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/021.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
  footnotes:
  - marker: a
    text: Or 'has rewarded me.' The Hebrew verb can mean to deal with or recompense someone according to their conduct.
    reason: lexical_alternative
  - marker: b
    text: '''Cleanness of my hands'' is a Hebrew idiom for innocence or purity in one''s actions.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 내 의로움에 따라 나를 대하셨고, 내 손의 깨끗함에 따라[a] 나에게 갚으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 손의 깨끗함’은 히브리어 관용구로, 행위의 무죄함이나 도덕적 순결을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵ֥נִי
  english_pob_choice: has dealt with me
  chosen_korean: 나를 대하셨고
  alternatives_korean:
  - 나를 보상하셨고
  - 나에게 갚으셨고
  lexicon: HALOT
  rationale: גמל은 행위에 상응하는 방식으로 대하다/갚다의 폭이 있어, 앞절의 병행을 살리면서도 의미 범위를 지나치게 좁히지 않는 ‘대하셨고’를 택했습니다.
- source_word: יְהוָ֖ה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 성호의 직접 음역을 따라 ‘야훼’로 옮겨, 본문이 가진 고유명칭성을 보존했습니다.
- source_word: כְּצִדְקָתִ֑י
  english_pob_choice: according to my righteousness
  chosen_korean: 내 의로움에 따라
  alternatives_korean:
  - 내 의에 따라
  - 내 의로운 행실에 따라
  lexicon: HALOT
  rationale: צדקה의 추상적 개념을 한국어에서는 자연스러운 ‘의로움’으로 옮겨, 화자의 자기 진술을 직접적으로 드러냈습니다.
- source_word: כְּבֹר יָדַ֖י
  english_pob_choice: according to the cleanness of my hands
  chosen_korean: 내 손의 깨끗함에 따라
  alternatives_korean:
  - 내 손의 청결에 따라
  - 내 손의 순결에 따라
  - 내 손의 무죄함에 따라
  lexicon: HALOT
  rationale: ‘깨끗함’은 손의 깨끗함이라는 히브리어 관용구를 보존하면서도, 도덕적/행위적 순결의 이미지를 과도하게 해석하지 않습니다.
- source_word: יָשִׁ֥יב לִֽי
  english_pob_choice: he has repaid me
  chosen_korean: 나에게 갚으셨습니다
  alternatives_korean:
  - 나에게 보상하셨습니다
  - 나에게 되돌려주셨습니다
  lexicon: HALOT
  rationale: שוב의 사역형은 여기서 보상·보응의 의미를 띠므로, 앞의 ‘대하셨고’와 짝을 이루는 ‘갚으셨습니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: ‘의로움’과 ‘손의 깨끗함’이 자칫 무죄/공로 교리로 읽힐 가능성
  chosen_reading: 본문의 직접 표현을 유지하되, 이것을 다윗의 특정 상황에서의 자기 변론으로 읽을 수 있게 번역했습니다.
  alternative_readings:
  - 교리적으로 완화한 표현
  - 절대적 무죄를 암시하는 표현
  rationale: 히브리어는 첫인칭의 의와 손의 깨끗함을 분명히 말하므로, 이를 흐리지 않고 보존하되 더 넓은 신학적 결론은 강요하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
