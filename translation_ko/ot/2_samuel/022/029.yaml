  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי אַתָּ֥ה נֵירִ֖/י יְהוָ֑ה וַ/יהוָ֖ה יַגִּ֥יהַּ חָשְׁכִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/029.yaml
  text: For you are my lamp[a], O Yahweh[b], and Yahweh lights up my darkness.
  footnotes:
  - marker: a
    text: 'Hebrew: ''my lamp''; alternatively, ''my light.'' The image is concrete in Hebrew, referring to a lamp rather than abstract light.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD gives light to my darkness.'
    reason: alternative_reading
translation:
  language: ko
  text: 주님은 저의 등불이시며, 야훼께서 저의 어둠을 밝히십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵירִי
  english_pob_choice: my lamp
  chosen_korean: 저의 등불
  alternatives_korean:
  - 저의 빛
  - 나의 등불
  lexicon: HALOT
  rationale: 히브리어 נֵיר는 추상적인 ‘빛’보다 구체적인 ‘등불’에 가깝기 때문에, 원문의 비유를 살려 ‘등불’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신성호칭 יְהוָה는 POB 기본 원칙에 따라 ‘야훼’로 옮겨, 하나님의 고유한 이름을 드러냈습니다.
- source_word: יַגִּיהַּ
  english_pob_choice: lights up
  chosen_korean: 밝히십니다
  alternatives_korean:
  - 비추십니다
  - 빛나게 하십니다
  - 환히 하십니다
  lexicon: HALOT
  rationale: 히필형의 원인적 의미(‘빛나게 하다, 밝히다’)를 살리면서, 현대 한국어에서 자연스럽고 시적인 표현으로 ‘밝히십니다’를 택했습니다.
- source_word: חָשְׁכִּי
  english_pob_choice: my darkness
  chosen_korean: 저의 어둠
  alternatives_korean:
  - 저의 흑암
  - 저의 어두움
  - 어둠 속
  lexicon: HALOT
  rationale: 명사 ‘어둠’에 1인칭 소유격이 붙은 형태를 직역에 가깝게 반영하여, 개인적인 곤경과 침잠을 함축하는 표현을 유지했습니다.
theological_decisions:
- issue: יהוה를 한국어에서 어떻게 드러낼지
  chosen_reading: 본문의 두 번째 절에서 하나님의 이름은 ‘야훼’로 유지하되, 문맥상 직접 호칭의 자연스러움을 위해 첫 절은 ‘주님’으로 시작합니다.
  alternative_readings:
  - 두 곳 모두 야훼
  - 두 곳 모두 주님
  rationale: 히브리어는 두 절 모두 יְהוָה를 포함하지만, 한국어 시편/찬가풍 문맥에서는 첫 절의 병렬성을 자연스럽게 살리기 위해 호칭형 ‘주님’을, 두 번째 절에서는 고유명 ‘야훼’를 사용해 원문과 전통 사이의 긴장을 줄였습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
