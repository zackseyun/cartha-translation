    reason: lexical_alternative
  revision_rationale: 첫 번째 신명을 ‘야훼여’로 명시하여 직접 호칭을 회복하고, 두 번째 신명도 ‘야훼’로 유지했습니다. ‘주님’은 야훼를 향한 한국어 존칭 2인칭 표현으로 남겨 원문의 ‘당신은’을 반영합니다. ‘이는’은 כִּי의 연결 기능을 보존합니다. 등불의 구체적 비유는 번역문과 각주에서 유지했습니다.
