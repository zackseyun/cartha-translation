  naturalness: ‘언약의 신실함을 보이십니다’는 이해할 수 있으나, 이 문맥에서 חֶסֶד를 목적어로 하여 행하는 표현으로는 ‘인애를 베푸십니다’가 더 자연스럽고 한국어 성서 문체에도 알맞습니다. 각주 표지는 해당 단어 바로 뒤에 두는 것이 명확합니다.
