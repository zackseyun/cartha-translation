  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מגדיל יְשׁוּע֣וֹת מַלְכּ֑/וֹ וְ/עֹֽשֶׂה חֶ֧סֶד לִ/מְשִׁיח֛/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֖/וֹ עַד עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/051.yaml
  text: He gives great salvation to his king and shows covenant faithfulness to his anointed[c][b][a], to David and to his offspring forever.
  footnotes:
  - marker: a
    text: Or 'great deliverances' or 'great victories' to his king.
    reason: lexical_alternative
  - marker: b
    text: Or 'shows steadfast love' to his anointed. The Hebrew term often denotes loyal love or covenant faithfulness.
    reason: lexical_alternative
  - marker: c
    text: '''His anointed'' can also be rendered ''his Messiah''; here it refers first to David/the Davidic king, while also echoing the broader messianic promise.'
    reason: alternative_reading
translation:
  language: ko
  text: 그의 왕에게 큰 구원을 베푸시며, 그의 메시아에게도 언약의 신실함을 보이십니다 — 곧 다윗과 그의 후손에게 영원히 그러하십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘큰 구원’은 ‘큰 구원들’ 또는 ‘큰 승리들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘언약의 신실함’은 ‘인애’ 또는 ‘변함없는 사랑’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그의 메시아’는 여기서 곧바로 다윗 왕을 가리키지만, 더 넓게는 메시아적 약속을 울립니다.
    reason: theological_note
lexical_decisions:
- source_word: מגדיל יְשׁוּעוֹת
  english_pob_choice: gives great salvation
  chosen_korean: 큰 구원을 베푸시며
  alternatives_korean:
  - 구원을 크게 베푸시며
  - 큰 구원들을 베푸시며
  - 큰 구원들을 이루시며
  lexicon: HALOT
  rationale: 히필 ‘크게 하다/크게 만들다’와 복수형 ‘구원들’의 포괄적 의미를 한국어에서 자연스럽게 살려, 단수 명사로도 집합적 의미가 드러나는 ‘큰 구원’으로 옮겼습니다.
- source_word: וְעֹשֶׂה חֶסֶד
  english_pob_choice: and shows covenant faithfulness
  chosen_korean: 언약의 신실함을 보이십니다
  alternatives_korean:
  - 언약의 사랑을 보이십니다
  - 인애를 베푸십니다
  - 언약에 신실하심을 나타내십니다
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 성격을 드러내기 위해 ‘신실함’을 택했고, 동사 ‘보이다’는 원문의 행위성을 유지하면서 문맥상 ‘행하다’보다 자연스럽습니다.
- source_word: לִמְשִׁיחוֹ
  english_pob_choice: to his anointed
  chosen_korean: 그의 메시아에게도
  alternatives_korean:
  - 그의 기름부음 받은 이에게도
  - 그의 받은 자에게도
  - 그의 그리스도에게도
  lexicon: HALOT
  rationale: 영문 POB의 각주가 제시하듯 여기서는 즉각적으로 다윗/다윗 왕조를 가리키면서도 메시아적 울림을 남기므로, POB의 본문 선택을 따라 ‘메시아’로 두되 역사적 지시를 각주 없이 본문에 곧바로 이어지는 ‘다윗’으로 보정했습니다.
- source_word: וּלְזַרְעוֹ
  english_pob_choice: and to his offspring
  chosen_korean: 그의 후손에게
  alternatives_korean:
  - 그의 자손에게
  - 그의 씨에게
  - 그의 대에게
  lexicon: HALOT
  rationale: זֶרַע의 언약적 집합 의미를 현대 한국어에서 가장 자연스럽게 드러내는 말로 ‘후손’을 택했습니다.
theological_decisions:
- issue: מְשִׁיחוֹ의 역사적 지시와 메시아적 여운의 동시 보존
  chosen_reading: 본문에는 ‘그의 메시아’라고 두어 메시아적 울림을 살리되, 이어지는 ‘곧 다윗과 그의 후손’으로 역사적 참조를 분명히 했습니다.
  alternative_readings:
  - 그의 기름부음 받은 이
  - 그의 왕
  rationale: 이 절은 다윗의 노래 결론으로서 즉각적 지시 대상은 다윗 왕조이지만, 용례 자체가 장차의 메시아 약속을 비춥니다. 본문과 문맥을 함께 살려 두 의미를 지우지 않는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
