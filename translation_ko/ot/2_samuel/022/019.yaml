  - 주
  rationale: 본문이 직접 YHWH를 사용하므로, 번역은 직함 ‘주’가 아니라 고유 신명 ‘야훼’를 유지해 언약적 이름의 식별성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
