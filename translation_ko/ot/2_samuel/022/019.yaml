  source_fidelity: 히브리어 יְקַדְּמֻנִי는 적대적인 맥락에서 ‘나를 맞아 대적하다/맞서다’라는 뜻으로 옮길 수 있으며, ‘내 재앙의 날에’와 מִשְׁעָן의 비유적 표현인 ‘나의 버팀목’도 원문 의미를 충실히 반영합니다. YHWH를 ‘야훼’로 표기한 것도 번역 원칙과 일치합니다.
  naturalness: 본문의 ‘나를 맞섰으나’는 ‘맞서다’의 통상적인 문형에 맞지 않아 비문입니다. ‘나를 맞아 대적했으나’로 고치면 원문의 적대적 의미를 보존하면서 자연스러운 현대 한국어가 됩니다. 각주 a의 ‘내게 만났습니다’도 문법적으로 부자연스럽습니다.
  terminology: ‘야훼’, ‘재앙’, ‘버팀목’은 표준어 현대 문어체에 적절하며 신명 및 핵심 비유를 잘 보존합니다. 신명 각주는 히브리어 표기 자체가 ‘야훼’인 것처럼 말하기보다 YHWH를 한국어로 옮긴 표기임을 분명히 하는 편이 정확합니다.
