  text: 그들이 내 재앙의 날에 나를 맞섰으나, 야훼께서 나의 버팀목이 되셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 내게 닥쳐왔습니다’ 혹은 ‘그들이 내게 만났습니다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘야훼’는 신명 YHWH를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְקַדְּמֻנִי
  english_pob_choice: They confronted me
  chosen_korean: 나를 맞섰으나
  alternatives_korean:
  - 나를 맞이했으나
  - 나를 만났으나
  - 나를 앞질러 왔으나
  lexicon: HALOT
  rationale: קדמ의 대적적 용법을 따라 단순한 ‘만남’보다 적대적으로 다가와 대항하는 뉘앙스를 살려 ‘맞서다’로 옮겼습니다.
- source_word: בְּיוֹם אֵידִי
  english_pob_choice: in the day of my calamity
  chosen_korean: 내 재앙의 날에
  alternatives_korean:
  - 내 재난의 날에
  - 내 환난의 날에
  - 내 재앙이 닥친 날에
  lexicon: HALOT
  rationale: אֵיד를 ‘재앙’으로 옮겨 심각한 파멸·불행의 뜻을 살렸고, 히브리어 관용구를 자연스러운 한국어 어순으로 정리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: Tetragrammaton은 본문 표기대로 고유 신명 ‘야훼’로 옮겨, 영어 POB의 원칙을 한국어에서도 그대로 반영했습니다.
- source_word: מִשְׁעָן
  english_pob_choice: my support
  chosen_korean: 나의 버팀목
  alternatives_korean:
  - 나의 지팡이
  - 나의 지지
  - 나의 의지처
  lexicon: HALOT
  rationale: ‘의지하다/기대다’에서 온 비유적 의미를 살리되, 현대 한국어에서 안정과 지탱의 이미지를 분명히 전달하는 ‘버팀목’을 택했습니다.
theological_decisions:
- issue: 여호와/야훼 대체어 선택
  chosen_reading: 야훼
  alternative_readings:
