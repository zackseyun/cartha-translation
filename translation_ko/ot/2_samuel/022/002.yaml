  source_fidelity: 히브리어의 화자 도입과 세 병렬 술어(‘나의 바위, 나의 요새, 나를 건져 내시는 이’)를 충실히 반영했습니다. מְפַלְטִי לִי의 ‘나를 위하여/나를’의 강조는 ‘나를 건져 내시는 분’으로 자연스럽게 구현되어 있습니다.
  naturalness: ‘내 바위시며 내 요새시며 나를 건져 내시는 분이십니다’는 현대 표준 한국어의 경건하고 격식 있는 합쇼체로 자연스럽습니다. 인용문 앞의 ‘그가 말하였습니다’도 문체상 허용됩니다.
  terminology: יהוה를 ‘야훼’로 옮긴 선택은 원문의 고유명을 드러내며, ‘바위’, ‘요새’, ‘건져 내시는 분’도 각각 סֶלַע, מְצוּדָה, מְפַלֵּט에 적절히 대응합니다. 특정 교파적 해석을 덧붙이지 않았습니다.
