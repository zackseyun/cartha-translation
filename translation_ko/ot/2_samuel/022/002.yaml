  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר יְהוָ֛ה סַֽלְעִ֥/י וּ/מְצֻדָתִ֖/י וּ/מְפַלְטִ/י לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/002.yaml
  text: 'And he said: “The LORD is my rock and my fortress and my deliverer for me.”'
translation:
  language: ko
  text: 그가 말하였습니다. “야훼는 내 바위시며 내 요새시며 나를 건져 내시는 분이십니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: The LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: YHWH
  rationale: 출애굽기와 시편 계열의 신명 자료에서 하나님의 고유명사를 드러내기 위해, POB의 원칙에 따라 '야훼'를 사용했습니다.
- source_word: סַלְעִי
  english_pob_choice: my rock
  chosen_korean: 내 바위
  alternatives_korean:
  - 내 반석
  - 나의 바위
  lexicon: rock/stronghold imagery
  rationale: 문맥상 피난처와 견고함의 이미지를 살리되, 기존 교회어 '반석'보다 히브리어의 직설적 비유를 살려 '바위'로 옮겼습니다.
- source_word: מְצֻדָתִי
  english_pob_choice: my fortress
  chosen_korean: 내 요새
  alternatives_korean:
  - 내 성채
  - 내 성
  lexicon: fortress
  rationale: 군사적 방어 거점을 가리키는 표현으로, 한국어에서 가장 자연스럽고 강한 대응어인 '요새'를 선택했습니다.
- source_word: מְפַלְטִי לִי
  english_pob_choice: my deliverer for me
  chosen_korean: 나를 건져 내시는 분
  alternatives_korean:
  - 나의 구원자
  - 나를 구해 내시는 분
  lexicon: deliverer
  rationale: 동사의 구출·탈출 뉘앙스를 살려 '건져 내다'로 옮기고, 인격적 주어를 분명히 하기 위해 '분'을 보완했습니다.
theological_decisions:
- issue: יהוה의 번역어
  chosen_reading: 문맥상 하나님의 고유명사를 '야훼'로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 신명적 고백이므로, 주어를 일반 칭호 '주'로 완화하지 않고 신명 고유명사를 드러내는 것이 원문 효과에 더 가깝습니다.
  doctrine_reference: 하나님의 이름의 가시성 및 신명적 전통
- issue: '''for me''의 처리'
  chosen_reading: '''나를 건져 내시는 분''으로 자연스럽게 합쳐, 관계 부사구를 과도하게 분리하지 않았습니다.'
  alternative_readings:
  - 나를 위하여
  - 나에게
  rationale: 히브리어의 לִי는 여기서 목적·귀속의 감각을 가지며, 한국어에서는 수식어를 과도하게 늘리기보다 구출 행위의 대상성을 드러내는 편이 원문 의미를 더 잘 전달합니다.
  doctrine_reference: 히브리어 전치사 용법
