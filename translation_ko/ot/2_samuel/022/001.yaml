  source_fidelity: 원문의 시간 부사구(‘야훼께서 그를 ... 건져 주신 날에’)는 다윗이 노래의 말들을 야훼께 말한 때를 나타냅니다. 초안은 이를 별도 문장으로 분리하면서 ‘한 말입니다’의 주어와 수식 관계가 불분명해졌습니다. 수정문은 이 관계를 한 문장 안에서 보존합니다. ‘말들’과 ‘노래’를 모두 반영하고, ‘손에서’라는 히브리어 관용 표현 및 야훼와 사울이라는 이름도 유지합니다.
  naturalness: ‘이 노래의 말들을 말했습니다’는 원문의 의도적인 어휘 중복을 보존하므로 다소 반복적이지만 이해 가능하고, 합쇼체 문장으로 자연스럽습니다. 시간절을 문두에 배치하여 한국어 문장 구조를 명료하게 했습니다.
  terminology: יהוה는 프로젝트 방침 및 영어 POB의 최종 신학 용례에 따라 ‘야훼’로 일관되게 유지했습니다. הִצִּיל은 적대 세력의 손에서의 구출이라는 문맥에 맞게 ‘건져 주신’으로, שָׁאוּל은 통용 표기인 ‘사울’로 옮겼습니다.
