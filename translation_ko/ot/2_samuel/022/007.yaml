source:
  edition: WLC
  text: בַּ/צַּר לִ/י֙ אֶקְרָ֣א יְהוָ֔ה וְ/אֶל אֱלֹהַ֖/י אֶקְרָ֑א וַ/יִּשְׁמַ֤ע מֵ/הֵֽיכָל/וֹ֙ קוֹלִ֔/י וְ/שַׁוְעָתִ֖/י בְּ/אָזְנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/007.yaml
  text: In my distress I call on Yahweh[a]; I call to my God. He hears my voice from his temple[b], and my cry for help reaches his ears.
  footnotes:
  - marker: a
    text: Or 'He heard my voice from his temple' (formal past-tense rendering of the Hebrew narrative verb).
    reason: lexical_alternative
  - marker: b
    text: '''Temple'' may also be rendered ''palace'' or ''sanctuary,'' referring to God''s heavenly dwelling.'
    reason: lexical_alternative
translation:
  language: ko
  text: 환난 중에 제가 야훼를 부르며, 제 하나님께 부릅니다. 그는 자기 성전에서 제 목소리를 들으시고, 제 부르짖음이 그의 귀에 닿습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부르다’는 כאן의 반복을 살린 기본 번역입니다. 더 강한 ‘부르짖다’로도 옮길 수 있지만, 본문은 청원의 반복과 응답을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성전’은 כאן의 הֵיכָל이 가질 수 있는 ‘궁전/성소’ 의미를 포함하는 대표 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר
  english_pob_choice: In my distress
  chosen_korean: 환난 중에
  alternatives_korean:
  - 고난 중에
  - 고통 중에
  - 곤경 속에서
  lexicon: HALOT
  rationale: צַר은 압박과 어려움의 상황을 가리키므로, 시적이면서도 자연스러운 ‘환난 중에’로 옮겨 상황의 긴박함을 살렸습니다.
- source_word: אֶקְרָא / אֶל אֱלֹהַי אֶקְרָא
  english_pob_choice: I call on Yahweh; I call to my God
  chosen_korean: 야훼를 부르며, 제 하나님께 부릅니다
  alternatives_korean:
  - 야훼께 부르짖으며, 제 하나님께 부르짖습니다
  - 야훼를 부르고, 제 하나님께 부릅니다
  lexicon: HALOT
  rationale: קרא는 단순한 ‘부르다’와 ‘부르짖다’의 범위를 가지므로, 앞뒤 반복을 살리되 한국어에서는 자연스럽게 ‘부르다’로 통일해 두 번의 청원을 보여 주었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: DOCTRINE.md contested terms
  rationale: 사본의 고유 신명은 관용적 대체어보다 음역인 ‘야훼’로 옮겨, 인격적 이름이라는 점을 유지했습니다.
- source_word: מֵהֵיכָלוֹ
  english_pob_choice: from his temple
  chosen_korean: 자기 성전에서
  alternatives_korean:
  - 그의 궁전에서
  - 그의 성소에서
  lexicon: HALOT
  rationale: הֵיכָל은 궁전/성전의 범위를 가지지만, 하나님을 향한 이 시적 맥락에서는 예배적·거처적 뉘앙스를 살리는 ‘성전’이 가장 적절합니다.
- source_word: שַׁוְעָתִי
  english_pob_choice: my cry for help
  chosen_korean: 제 부르짖음
  alternatives_korean:
  - 제 간구
  - 제 도움 요청
  lexicon: HALOT
  rationale: שַׁוְעָה는 위기 속 도움을 구하는 외침을 뜻하므로, 한국어에서는 간결하게 ‘부르짖음’으로 옮겨 긴급성을 유지했습니다.
- source_word: בְּאָזְנָיו
  english_pob_choice: reaches his ears
  chosen_korean: 그의 귀에 닿습니다
  alternatives_korean:
  - 그의 귀에 들어갑니다
  - 그의 귀에 이릅니다
  lexicon: HALOT
  rationale: 직역의 ‘그의 귀 안에’보다는 관용적 의미인 ‘들으심’을 드러내는 ‘귀에 닿습니다’가 현대 한국어에서 자연스럽고 이미지도 보존합니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה는 언약 이름 자체를 가리키므로, 호칭으로 대체하지 않고 고유명사로 드러내는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘제 하나님’의 존칭 처리
  chosen_reading: 제 하나님께 부릅니다
  alternative_readings:
  - 나의 하나님께 부릅니다
  - 내 하나님께 부릅니다
  rationale: 시적 1인칭 진술이지만 하나님을 향한 직접 지칭이므로, 현대 문체에서 자연스러운 겸양 표현인 ‘제 하나님’으로 정리했습니다.
  doctrine_reference: Korean style and reverence conventions
