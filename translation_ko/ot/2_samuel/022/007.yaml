  - 고통 중에
  - 곤경 속에서
  lexicon: HALOT
  rationale: צַר은 압박과 어려움의 상황을 가리키므로, 시적이면서도 자연스러운 ‘환난 중에’로 옮겨 상황의 긴박함을 살렸습니다.
- source_word: אֶקְרָא / אֶל אֱלֹהַי אֶקְרָא
  english_pob_choice: I call on Yahweh; I call to my God
