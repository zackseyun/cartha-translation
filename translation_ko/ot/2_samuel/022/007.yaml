  - 제 도움 요청
  lexicon: HALOT
  rationale: שַׁוְעָה는 위기 속 도움을 구하는 외침을 뜻하므로, 한국어에서는 간결하게 ‘부르짖음’으로 옮겨 긴급성을 유지했습니다.
- source_word: בְּאָזְנָיו
  english_pob_choice: reaches his ears
  chosen_korean: 그의 귀에 닿습니다
  alternatives_korean:
  - 그의 귀에 들어갑니다
  - 그의 귀에 이릅니다
  lexicon: HALOT
  rationale: 직역의 ‘그의 귀 안에’보다는 관용적 의미인 ‘들으심’을 드러내는 ‘귀에 닿습니다’가 현대 한국어에서 자연스럽고 이미지도 보존합니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה는 언약 이름 자체를 가리키므로, 호칭으로 대체하지 않고 고유명사로 드러내는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘제 하나님’의 존칭 처리
  chosen_reading: 제 하나님께 부릅니다
  alternative_readings:
  - 나의 하나님께 부릅니다
  - 내 하나님께 부릅니다
  rationale: 시적 1인칭 진술이지만 하나님을 향한 직접 지칭이므로, 현대 문체에서 자연스러운 겸양 표현인 ‘제 하나님’으로 정리했습니다.
  doctrine_reference: Korean style and reverence conventions
