  - 야훼를 부르고, 제 하나님께 부릅니다
  lexicon: HALOT
  rationale: קרא는 단순한 ‘부르다’와 ‘부르짖다’의 범위를 가지므로, 앞뒤 반복을 살리되 한국어에서는 자연스럽게 ‘부르다’로 통일해 두 번의 청원을 보여 주었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: DOCTRINE.md contested terms
  rationale: 사본의 고유 신명은 관용적 대체어보다 음역인 ‘야훼’로 옮겨, 인격적 이름이라는 점을 유지했습니다.
- source_word: מֵהֵיכָלוֹ
  english_pob_choice: from his temple
  chosen_korean: 자기 성전에서
  alternatives_korean:
  - 그의 궁전에서
  - 그의 성소에서
  lexicon: HALOT
  rationale: הֵיכָל은 궁전/성전의 범위를 가지지만, 하나님을 향한 이 시적 맥락에서는 예배적·거처적 뉘앙스를 살리는 ‘성전’이 가장 적절합니다.
- source_word: שַׁוְעָתִי
  english_pob_choice: my cry for help
  chosen_korean: 제 부르짖음
  alternatives_korean:
