  text: בַּ/צַּר לִ/י֙ אֶקְרָ֣א יְהוָ֔ה וְ/אֶל אֱלֹהַ֖/י אֶקְרָ֑א וַ/יִּשְׁמַ֤ע מֵ/הֵֽיכָל/וֹ֙ קוֹלִ֔/י וְ/שַׁוְעָתִ֖/י בְּ/אָזְנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/007.yaml
  text: In my distress I call on Yahweh[a]; I call to my God. He hears my voice from his temple[b], and my cry for help reaches his ears.
  footnotes:
  - marker: a
    text: Or 'He heard my voice from his temple' (formal past-tense rendering of the Hebrew narrative verb).
    reason: lexical_alternative
  - marker: b
    text: '''Temple'' may also be rendered ''palace'' or ''sanctuary,'' referring to God''s heavenly dwelling.'
    reason: lexical_alternative
translation:
  language: ko
  text: 환난 중에 제가 야훼를 부르며[a], 제 하나님께 부릅니다. 그분은 그분의 성전으로부터[b] 제 목소리를 들으셨고, 제 부르짖음은 그분의 귀에 이릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘부르다’를 두 번 반복합니다. 문맥상 ‘부르짖다’ 또는 ‘외치다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성전’은 히브리어 헤칼(הֵיכָל)의 대표 번역입니다. 이 말은 ‘궁전’ 또는 ‘성소’라는 뜻도 가질 수 있으며, 여기서는 하나님의 하늘 거처를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר
  english_pob_choice: In my distress
  chosen_korean: 환난 중에
  alternatives_korean:
