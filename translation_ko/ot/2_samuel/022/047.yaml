lexical_decisions:
- source_word: חַי יְהוָה
  english_pob_choice: Yahweh lives
  chosen_korean: 야훼는 살아 계십니다
  alternatives_korean:
  - 야훼는 살아 있습니다
  - 주님은 살아 계십니다
  lexicon: HALOT
  rationale: 히브리어의 서술적 선언을 한국어의 자연스러운 현재완료형이 아니라 현재 진술로 옮기되, 신적 이름 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 유지했습니다.
- source_word: וּבָרוּךְ
  english_pob_choice: and blessed be
  chosen_korean: 나의 반석은 복되시며
  alternatives_korean:
  - 나의 반석은 복을 받으시며
  - 나의 반석이 복되시며
  lexicon: HALOT
  rationale: 축복 선언의 종결적 평행법을 살리기 위해 ‘복되시며’로 옮겼고, 화자의 고백 대상이 하나님이라는 점을 반영해 존칭을 사용했습니다.
- source_word: צוּרִי
  english_pob_choice: my rock
  chosen_korean: 나의 반석
  alternatives_korean:
  - 내 바위
  - 내 피난처
  lexicon: HALOT
  rationale: צוּר의 핵심 은유를 그대로 살려 ‘반석’으로 번역했습니다. ‘피난처’는 해석이 더 들어가므로 보수적으로 피했습니다.
- source_word: וְיָרֻם אֱלֹהֵי צ֥וּר יִשְׁעִֽ/י־
  english_pob_choice: and exalted be God, the rock of my salvation
  chosen_korean: 내 구원의 반석이신 하나님은 높임을 받으소서
  alternatives_korean:
  - 내 구원의 반석이신 하나님은 높으시기를
  - 내 구원의 반석이신 하나님은 존귀를 받으소서
  lexicon: HALOT
  rationale: יַרֻם의 수동적·희구적 뉘앙스를 한국어의 청유형 고어가 아닌 현대 공손체 희구로 옮겨 ‘높임을 받으소서’로 처리했습니다. ‘내 구원의 반석’은 המקרא적 수식 관계를 유지합니다.
theological_decisions:
- issue: YHWH 신명 표기
  chosen_reading: ‘야훼’로 직역해 언약적 고유성을 드러냈습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 본문에 יְהוָה가 직접 나오므로, 프로젝트 기본값과 source-direct 원칙에 따라 신명 자체를 드러내는 표기를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘높임을 받으소서’의 기원문체
  chosen_reading: 축복/찬양 맥락의 희구문을 한국어 예배체로 자연스럽게 옮겼습니다.
  alternative_readings:
  - ‘높으시길 바랍니다’
  - ‘높임을 받습니다’
  rationale: 히브리어 jussive는 단순 서술이 아니라 찬양의 소망을 나타내므로, 하나님께 대한 직접 호칭에 맞는 공손한 희구형을 사용했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
