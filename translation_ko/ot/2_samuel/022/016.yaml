source:
  edition: WLC
  text: וַ/יֵּֽרָאוּ֙ אֲפִ֣קֵי יָ֔ם יִגָּל֖וּ מֹסְד֣וֹת תֵּבֵ֑ל בְּ/גַעֲרַ֣ת יְהוָ֔ה מִ/נִּשְׁמַ֖ת ר֥וּחַ אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/016.yaml
  text: Then the channels of the sea were seen[a]; the foundations of the world were laid bare at the rebuke of Yahweh[b], at the blast of the breath of his nostrils.
  footnotes:
  - marker: a
    text: Or “Yahweh” for “the LORD.”
    reason: alternative_reading
  - marker: b
    text: Or “the foundations of the inhabited world.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 바다의 수로들이 보였으며, 세상의 기초들이 드러났습니다 — 야훼의 꾸짖음과 그의 코에서 나오는 숨의 폭발로 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “세계의 거주하는 기초들”
    reason: lexical_alternative
  - marker: b
    text: 또는 “그의 콧구멍의 숨의 폭발”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָאוּ
  english_pob_choice: were seen
  chosen_korean: 보였으며
  alternatives_korean:
  - 드러났으며
  - 눈에 띄었으며
  lexicon: HALOT
  rationale: 니팔 완료형의 수동적 뉘앙스를 살려 ‘보였다’로 옮겼고, 시적 장면의 즉각성을 유지하기 위해 연결 어미 ‘-으며’를 사용했습니다.
- source_word: אֲפִקֵי יָם
  english_pob_choice: the channels of the sea
  chosen_korean: 바다의 수로들
  alternatives_korean:
  - 바다의 골짜기들
  - 바다의 물길들
  - 바다의 하상들
  lexicon: HALOT
  rationale: אֲפִיקֵי는 물길/수로/하상 계열의 뜻이므로, 노출된 바다 바닥의 이미지를 살리면서도 한국어에서 자연스러운 ‘수로들’로 옮겼습니다.
- source_word: מֹסְדוֹת תֵּבֵל
  english_pob_choice: the foundations of the world
  chosen_korean: 세상의 기초들
  alternatives_korean:
  - 세상의 토대들
  - 세상의 기초
  - 인간이 사는 세상의 기초들
  lexicon: HALOT
  rationale: תֵּבֵל은 단순한 땅보다 ‘세상/거주하는 세계’에 가깝고, מֹסְדוֹת는 복수형 ‘기초들’이므로 시적 복수성을 살려 ‘세상의 기초들’로 옮겼습니다.
- source_word: בְּגַעֲרַת יְהוָה
  english_pob_choice: at the rebuke of Yahweh
  chosen_korean: 야훼의 꾸짖음
  alternatives_korean:
  - 야훼의 책망
  - 야훼의 호통
  - 야훼의 꾸짖으심
  lexicon: HALOT
  rationale: גְּעָרָה는 단순한 말이 아니라 위엄 있는 제압/질책의 음성을 뜻하므로, 직설적이면서도 시적 힘을 유지하는 ‘꾸짖음’을 택했습니다. יְהוָה는 본문과 POB 규정에 따라 ‘야훼’로 옮겼습니다.
- source_word: מִנִּשְׁמַת רוּחַ אַפּוֹ
  english_pob_choice: at the blast of the breath of his nostrils
  chosen_korean: 그의 코에서 나오는 숨의 폭발
  alternatives_korean:
  - 그의 콧김의 폭발
  - 그의 콧구멍의 숨결
  - 그의 코의 숨의 불어냄
  lexicon: HALOT
  rationale: נִשְׁמָה는 숨/숨결, רוּחַ는 여기서 그 숨의 강한 내뿜음, אַף는 문자적으로 코/콧구멍이므로, 의인화된 시어를 유지하면서 한국어에서 이해 가능한 이미지로 풀어 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה를 어떻게 옮길지
  chosen_reading: 본문에서 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - the LORD식 대역
  - 전통적 교회식 ‘여호와’
  rationale: 이 구절은 히브리어 신명기적 이름을 직접 사용하므로, 독자가 본문에서 하나님의 고유한 언약 이름을 보게 하려는 POB 원칙을 따랐습니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
