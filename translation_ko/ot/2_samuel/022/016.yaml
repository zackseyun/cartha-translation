revisions:
- from: 그때 바다의 수로들이 보였으며, 세상의 기초들이 드러났습니다 — 야훼의 꾸짖음과 그의 코에서 나오는 숨의 폭발로 말입니다.[a][b]
  to: 그때 바다의 수로들이 드러나고 세상의 기초들이 밝혀졌습니다. 야훼의 꾸짖음과 그의 콧김에서 뿜어져 나오는 거센 숨결 때문입니다.
  rationale: 수동적 노출의 이미지(‘드러나고’, ‘밝혀졌습니다’)와 우주적 범위(‘세상의 기초들’)를 유지했습니다. 마지막 구절은 원문의 신체적·시적 비유를 추상화하지 않고 ‘콧김’과 ‘거센 숨결’로 자연스럽게 옮겼습니다. 불명확하거나 비문인 각주는 삭제했습니다.
