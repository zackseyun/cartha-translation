source:
  edition: WLC
  text: הָ/אֵ֖ל תָּמִ֣ים דַּרְכּ֑/וֹ אִמְרַ֤ת יְהוָה֙ צְרוּפָ֔ה מָגֵ֣ן ה֔וּא לְ/כֹ֖ל הַ/חֹסִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/031.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is proven; he is a shield to all who take refuge in him.
  footnotes:
  - marker: a
    text: Or 'refined' or 'tested' for 'proven'; the Hebrew evokes metal purified in a furnace.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님은 그의 길이 흠없으시며, 야훼의 말씀은 단련되었고, 그는 자신에게 피하는 모든 이의 방패이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정련되었고’, ‘시험되었고’로 옮길 수 있습니다. 히브리어는 용광로에서 금속이 정련되는 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  english_pob_choice: As for God
  chosen_korean: 하나님은
  alternatives_korean:
  - 하나님이
  - 하나님께서는
  lexicon: HALOT
  rationale: 히브리어 문두의 הָאֵל은 주제 전환을 띠는 강조적 도입이므로, 한국어에서는 자연스러운 주제 표지로 처리해 앞부분의 강조를 살렸습니다.
- source_word: תָּמִים
  english_pob_choice: blameless
  chosen_korean: 흠없으시며
  alternatives_korean:
  - 완전하시며
  - 온전하시며
  - 흠 없으시며
  lexicon: HALOT
  rationale: 하나님의 길에 대해 ‘결함이 없다’는 뜻을 살려, 현대 한국어에서 도덕적·질적 무흠함을 드러내는 ‘흠없으시며’를 택했습니다.
- source_word: צְרוּפָה
  english_pob_choice: proven
  chosen_korean: 단련되었고
  alternatives_korean:
  - 연단되었고
  - 시험되었고
  - 정련되었고
  lexicon: HALOT
  rationale: 금속을 불에 의해 정련·검증하는 이미지를 살리되, POB의 ‘proven’이 지닌 ‘검증되어 참됨이 드러남’의 뜻을 한국어로 압축해 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 언약명사 יְהוָה를 고유명사로 드러내기 위해 관례적 대체어인 ‘주’ 대신 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 야훼의 이름을 대체 титуле로 바꿀지 여부
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문이 하나님의 개인적 언약 이름을 직접 사용하므로, 그 명칭을 가리지 않고 그대로 드러내는 것이 원문 의도를 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
