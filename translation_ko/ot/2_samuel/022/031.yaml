    rationale: ‘자신에게’는 한국어에서 피난처의 대상·방향을 자연스럽게 나타내지 못하고, ‘그는’과 결합할 때 재귀 지시가 불필요하게 어색합니다. 원문의 ‘그에게 피하는’을 명시적으로 옮기는 편이 좋습니다.
