base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/043.yaml
  text: I crushed them like the dust of the earth[a]; like the mud of the streets I pounded them and trampled them down.
  footnotes:
  - marker: a
    text: Or possibly, 'I spread them out,' for the final verb; the Hebrew can carry the sense of beating out or flattening.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 땅의 먼지처럼 부수고, 길거리의 진흙처럼 내가 그들을 짓밟았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 마지막 동사를 ‘펴서 펼쳤다/흩었다’는 뜻으로도 볼 수 있습니다. 히브리어는 두드려 펴거나 평평하게 만드는 뜻을 띨 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  english_pob_choice: I crushed them
  chosen_korean: 내가 그들을 … 부수고
  alternatives_korean:
  - 내가 그들을 깔아뭉개고
  - 내가 그들을 갈아버리고
  lexicon: HALOT
  rationale: שׁחק의 ‘짓이기다/부수다’ 계열 의미를 살리되, 한국어에서는 ‘부수다’가 시적·폭력적 이미지를 자연스럽게 전달합니다.
- source_word: כַּעֲפַר אָרֶץ
  english_pob_choice: like the dust of the earth
  chosen_korean: 땅의 먼지처럼
  alternatives_korean:
  - 땅의 흙처럼
  - 세상의 먼지처럼
  lexicon: HALOT
  rationale: עפר의 기본 의미인 ‘먼지/흙’ 가운데, 여기서는 비유의 하한을 선명히 드러내는 ‘먼지’가 가장 적절합니다.
- source_word: כְּטִיט חוּצוֹת
  english_pob_choice: like the mud of the streets
  chosen_korean: 길거리의 진흙처럼
  alternatives_korean:
  - 거리의 진흙처럼
  - 거리의 질척한 진흙처럼
  lexicon: HALOT
  rationale: חוּצוֹת는 도시의 거리/길거리들을 가리키므로, 일상적이고 직관적인 ‘길거리’가 이미지의 현장감을 살립니다.
- source_word: אֲדִקֵּם / אֶרְקָעֵם
  english_pob_choice: I pounded them and trampled them down
  chosen_korean: 내가 그들을 짓밟았습니다
  alternatives_korean:
  - 내가 그들을 두드려 부수고 짓밟았습니다
  - 내가 그들을 펴서 밟았습니다
  lexicon: HALOT
  rationale: 두 동사는 파쇄/압착의 연속 동작을 이루지만, 한국어에서는 과도한 중복을 줄이기 위해 후반부를 ‘짓밟다’로 묶어 강한 결말을 유지했습니다.
theological_decisions:
- issue: 시적 병렬에서 폭력적 이미지의 강도
  chosen_reading: 원문의 전투적·압도적 이미지를 완화하지 않고 직설적으로 유지했습니다.
  alternative_readings:
  - ‘꺾었습니다’처럼 완곡하게 옮길 수 있음
  - ‘흩뜨렸습니다’처럼 비유를 약화시킬 수 있음
  rationale: 이 절은 승리의 서술 속에서 적을 먼지와 진흙에 비유해 철저히 제압하는 장면이므로, 의미를 약화시키지 않는 것이 본문의 의도에 가깝습니다.
  doctrine_reference: 시편적/사무엘하의 승리-심판 시학
