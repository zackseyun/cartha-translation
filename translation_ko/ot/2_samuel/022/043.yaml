  lexicon: HALOT
  rationale: עפר의 기본 의미인 ‘먼지/흙’ 가운데, 여기서는 비유의 하한을 선명히 드러내는 ‘먼지’가 가장 적절합니다.
- source_word: כְּטִיט חוּצוֹת
  english_pob_choice: like the mud of the streets
  chosen_korean: 길거리의 진흙처럼
  alternatives_korean:
  - 거리의 진흙처럼
