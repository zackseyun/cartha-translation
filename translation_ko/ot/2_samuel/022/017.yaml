id: 2SA.22.17
reference: 2 Samuel 22:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִשְׁלַ֥ח מִ/מָּר֖וֹם יִקָּחֵ֑/נִי יַֽמְשֵׁ֖/נִי מִ/מַּ֥יִם רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/017.yaml
  text: He sent from on high[a]; he took me[b]; he drew me out of many waters.
  footnotes:
  - marker: a
    text: Or 'He sent from on high' or 'He stretched out from on high.' The Hebrew verb can more literally mean 'send' or 'stretch out'; 'reached down' brings out the rescue sense in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'from great waters' or 'from mighty waters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 높은 곳에서 보내시고, 저를 붙드셨으며, 많은 물에서 저를 건져 내셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보내시고’는 히브리어 동사의 문자적 의미(보내다/뻗다)를 따른 번역입니다. 구원 문맥에서는 ‘손을 뻗으시고’와 같은 의미로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘많은 물’은 ‘큰 물’ 또는 ‘힘센 물’로도 옮길 수 있는 관용적 시적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  english_pob_choice: sent from on high / reached down from on high
  chosen_korean: 높은 곳에서 보내시고
  alternatives_korean:
  - 높은 곳에서 손을 뻗으시고
  - 위로부터 보내시고
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘보내다/뻗다’의 뜻이 있으므로, 본문 흐름을 살리면서도 과도한 해석을 피하기 위해 ‘보내시고’로 옮겼습니다.
- source_word: מִמָּרוֹם
  english_pob_choice: from on high
  chosen_korean: 높은 곳에서
  alternatives_korean:
  - 하늘에서
  - 높은 데서
  lexicon: HALOT
  rationale: mārōm은 일반적으로 ‘높은 곳, 높음’을 가리키므로, ‘하늘’로 구체화하지 않고 ‘높은 곳’으로 옮겨 시적 공간감을 유지했습니다.
- source_word: יִקָּחֵנִי
  english_pob_choice: he took me
  chosen_korean: 저를 붙드셨으며
  alternatives_korean:
  - 저를 취하셨으며
  - 저를 데려가셨으며
  lexicon: HALOT
  rationale: 직역상 ‘취하다/데려가다’이지만, 구원 문맥에서는 하나님이 사람을 구출하여 자기 손에 두시는 뉘앙스가 있어 한국어로는 ‘붙드셨으며’가 자연스럽고 문맥 적합합니다.
- source_word: יַמְשֵׁנִי
  english_pob_choice: he drew me out
  chosen_korean: 저를 건져 내셨습니다
  alternatives_korean:
  - 저를 끌어내셨습니다
  - 저를 물 밖으로 끌어내셨습니다
  lexicon: HALOT
  rationale: 물에서 건져 올리는 구출 이미지를 살리기 위해 ‘건져 내셨습니다’를 택했습니다. 한국어에서 가장 자연스럽게 구조적·구원적 의미를 전달합니다.
- source_word: מִמַּיִם רַבִּים
  english_pob_choice: out of many waters
  chosen_korean: 많은 물에서
  alternatives_korean:
  - 큰 물에서
  - 많은 물들에서
  lexicon: HALOT
  rationale: 히브리어의 직유적 표현을 보존하기 위해 ‘많은 물’의 이미지를 그대로 살렸고, 복수적·집합적 뉘앙스도 유지했습니다.
theological_decisions:
- issue: 신적 구출의 공간적 표현
  chosen_reading: ‘높은 곳에서’라는 시적 공간 표현을 유지하고 ‘하늘’로 신학적으로 좁히지 않았습니다.
  alternative_readings:
  - 하늘에서
  rationale: 히브리어 מִמָּרוֹם은 일반적인 ‘높은 곳’을 뜻하므로, 본문의 시적·상징적 언어를 보존하는 것이 문맥상 더 충실합니다.
  doctrine_reference: 번역 원칙 §1, §3
