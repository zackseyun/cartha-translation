  source_fidelity: ‘높은 곳에서 보내시고’는 히브리어의 목적어가 생략된 시적 표현을 한국어에서 그대로 재현하여, 무엇을 보내셨는지가 불분명하고 문장이 부자연스럽습니다. 문맥상 암시된 ‘손’을 보충한 ‘손을 뻗어’는 구출 행위의 의미를 자연스럽게 드러냅니다. 또한 יִקָּחֵנִי는 ‘붙드시다’보다 ‘붙잡으시다’가 ‘take me’를 더 직접적으로 반영합니다.
