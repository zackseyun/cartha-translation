  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/תְּפַלְּטֵ֔/נִי מֵ/רִיבֵ֖י עַמִּ֑/י תִּשְׁמְרֵ֨/נִי֙ לְ/רֹ֣אשׁ גּוֹיִ֔ם עַ֥ם לֹא יָדַ֖עְתִּי יַעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/044.yaml
  text: You delivered me from the strivings of my people[a]; you kept me as the head of nations[c][b]; a people I had not known served me.
  footnotes:
  - marker: a
    text: Or 'from the contentions of my people.' The Hebrew may refer to internal strife among David's own people or conflicts involving them.
    reason: lexical_alternative
  - marker: b
    text: Or 'you preserved me as chief over nations.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a people I did not know will serve me.' The Hebrew imperfect can be rendered with a future nuance in poetic context.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 제 백성의 다툼에서 저를 건져 주셨습니다[a]. 주께서 저를 민족들의 머리로 지켜 세우셨습니다[b]; 제가 알지 못하던 한 백성이 저를 섬겼습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 백성의 다툼들에서’. 히브리어는 다윗의 백성 내부의 갈등이나 그들과 관련된 분쟁을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘민족들의 우두머리로 저를 보존하셨습니다’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘제가 알지 못하던 한 백성이 저를 섬길 것입니다’. 히브리어 미완료형은 시적 문맥에서 미래 뉘앙스로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּפַלְּטֵנִי
  english_pob_choice: You delivered me
  chosen_korean: 저를 건져 주셨습니다
  alternatives_korean:
  - 저를 구해 주셨습니다
  - 저를 구출해 주셨습니다
  lexicon: HALOT
  rationale: פּלט의 Hiphil은 ‘탈출시키다/건져내다’의 뜻이므로, 현대 한국어에서는 ‘건져 주셨습니다’가 구원의 동작을 자연스럽게 살리면서도 과도하게 해설적이지 않습니다.
- source_word: מֵרִיבֵי עַמִּי
  english_pob_choice: from the strivings of my people
  chosen_korean: 제 백성의 다툼에서
  alternatives_korean:
  - 제 백성의 다툼들에서
  - 제 백성의 분쟁에서
  - 제 백성의 시비에서
  lexicon: HALOT
  rationale: ריב은 분쟁, 다툼, 시비까지 포괄하므로, ‘다툼’이 가장 넓고 자연스러운 대응입니다. 영어 주석처럼 내부 갈등인지 대외 분쟁인지는 한국어 본문에서 열어 두었습니다.
- source_word: לְרֹאשׁ גּוֹיִם
  english_pob_choice: as the head of nations
  chosen_korean: 민족들의 머리로
  alternatives_korean:
  - 민족들의 우두머리로
  - 민족들 위의 우두머리로
  - 민족들의 우두머리로 세우셨습니다
  lexicon: HALOT
  rationale: רֹאשׁ의 비유적 의미를 살려 ‘머리로’ 번역했습니다. לְ는 역할/결과를 나타내므로 ‘~로 지켜 세우셨습니다’가 위임된 지위를 자연스럽게 전달합니다.
- source_word: יַעַבְדֻנִי
  english_pob_choice: served me
  chosen_korean: 저를 섬겼습니다
  alternatives_korean:
  - 저를 섬길 것입니다
  - 저에게 복종했습니다
  - 저에게 종속되었습니다
  lexicon: HALOT
  rationale: עבד는 기본적으로 ‘섬기다’이지만, 왕권 문맥에서는 정치적 복속까지 포함할 수 있습니다. 본문은 시적 회고로 읽어 현재형보다 과거형 ‘섬겼습니다’가 더 자연스럽습니다.
theological_decisions:
- issue: 왕권 언어를 메시아적 의미로 직접 확대할지 여부
  chosen_reading: 본문의 직접적 역사-왕권 의미를 본문에 유지했습니다.
  alternative_readings:
  - 메시아적 성취를 본문에 직접 반영해 읽는 방식
  rationale: 이 절은 다윗의 구원과 왕권을 노래하는 맥락이므로, 번역문은 우선 히브리어의 역사적 의미를 따라야 합니다. 더 넓은 정경적/메시아적 해석 가능성은 번역이 아니라 주해의 영역으로 남겨 두었습니다.
  doctrine_reference: 원어 우선과 역사적 문맥 보존; 해석의 여지를 번역문에서 성급히 닫지 않음
