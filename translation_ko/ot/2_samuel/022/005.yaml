base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/005.yaml
  text: For the waves of death surrounded me[b][a]; the torrents of worthlessness terrified me.
  footnotes:
  - marker: a
    text: Or 'the torrents of Belial,' taking בְלִיַּעַל as a proper name rather than 'worthlessness.'
    reason: alternative_reading
  - marker: b
    text: '''Breakers'' may also be rendered ''waves'' or ''billows.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 죽음의 파도들[b]이 나를 에워쌌으며, 파멸[a]의 급류가 나를 두렵게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벨리알의 급류’로 옮길 수 있습니다. בְלִיַּעַל을 고유명사로 보는 독법입니다.
    reason: alternative_reading
  - marker: b
    text: ‘파도들’은 ‘부서지는 물결’ 또는 ‘거센 물결’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲפָפֻנִי
  english_pob_choice: surrounded me
  chosen_korean: 에워쌌습니다
  alternatives_korean:
  - 둘러쌌습니다
  - 감쌌습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 밀려드는 물에 둘러싸여 갇히는 이미지를 나타내므로, 자연스러운 현대 한국어로는 ‘에워쌌습니다’가 가장 가깝습니다.
- source_word: מִשְׁבְּרֵי
  english_pob_choice: waves / breakers
  chosen_korean: 파도들
  alternatives_korean:
  - 파도
  - 쇠파도
  - 부서지는 물결
  lexicon: HALOT
  rationale: POB가 ‘waves’와 ‘breakers’ 사이의 역동성을 열어 두고 있으므로, 한국어에서는 파도의 폭력성을 살리되 과도한 의역 없이 ‘파도들’로 옮겼습니다.
- source_word: נַחֲלֵי
  english_pob_choice: torrents
  chosen_korean: 급류
  alternatives_korean:
  - 시내들
  - 도랑물
  - 홍수의 물줄기
  lexicon: HALOT
  rationale: 시와 병행되는 격렬한 물살의 이미지를 살리기 위해 ‘급류’를 택했습니다.
- source_word: בְלִיַּעַל
  english_pob_choice: worthlessness / Belial
  chosen_korean: 무가치함
  alternatives_korean:
  - 벨리알
  - 파멸
  - 사악함
  lexicon: HALOT
  rationale: 본문은 여기서 고유명사보다 공통명사적 뜻을 우선하므로, POB의 본문 선택에 맞춰 ‘무가치함’으로 옮기고 대안 독법은 각주로 남겼습니다.
theological_decisions:
- issue: בְלִיַּעַל을 고유명사 ‘벨리알’로 볼지 공통명사로 볼지
  chosen_reading: 본문에는 ‘무가치함’으로 두고, 각주에서 ‘벨리알’ 가능성을 제시했습니다.
  alternative_readings:
  - 벨리알
  - 파멸
  - 사악함
  rationale: 이 구절의 문맥은 파괴적인 물살과의 병행이며, 후기의 인격화된 악의 존재를 본문에 앞당겨 넣을 필요가 없습니다. 다만 독자가 다른 독법을 확인할 수 있도록 각주를 유지합니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy), §3 (preserve tension where ambiguity exists)
