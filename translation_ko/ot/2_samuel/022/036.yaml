  - 저를 번성하게 하셨습니다
  lexicon: HALOT
  rationale: 히필형의 결과적·승귀적 뜻을 살리되, 한국어에서 가장 자연스럽고 문맥에 맞는 ‘크게 하셨습니다’로 옮겼습니다.
theological_decisions:
- issue: וַעֲנֹתְךָ의 신학적 함의
  chosen_reading: ‘온유하심’으로 옮겨, 하나님이 낮아지셔서 종을 높이시는 은혜의 움직임을 드러냈습니다.
  alternative_readings:
  - ‘겸손’
  - ‘낮아지심’
  - ‘자비로우심’
  rationale: 본문은 하나님 안의 결핍이 아니라, 높이시기 위해 스스로 낮추시는 은혜로운 태도를 암시합니다. 이 긴장을 보존하기 위해 단순화하지 않고, 문맥에 맞는 존칭 표현으로 처리했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
