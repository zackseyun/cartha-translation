  rationale: 히브리어 완료 서술은 한국어에서 자연스러운 과거 서술로 옮기고, 간접목적어는 ‘제게’로 처리해 원문의 수여 의미를 살렸습니다.
- source_word: מָגֵן יִשְׁעֶךָ
