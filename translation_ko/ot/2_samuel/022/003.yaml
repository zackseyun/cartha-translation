- from: 하나님은 나의 바위, 내가 그분께 피합니다. 나의 방패이시며 나의 구원의 뿔, 나의 높은 요새이시며 나의 피난처, 나의 구원자이십니다. 주님은 폭력에서 나를 구하십니다.[a][b][c]
