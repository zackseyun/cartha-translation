source:
  edition: WLC
  text: אֱלֹהֵ֥י צוּרִ֖/י אֶחֱסֶה בּ֑/וֹ מָגִנִּ֞/י וְ/קֶ֣רֶן יִשְׁעִ֗/י מִשְׂגַּבִּ/י֙ וּ/מְנוּסִ֔/י מֹשִׁעִ֕/י מֵ/חָמָ֖ס תֹּשִׁעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/003.yaml
  text: my God[a], my rock, in whom I take refuge, my shield and the horn of my salvation, my stronghold and my refuge[c][b], my savior—you save me from violence.
  footnotes:
  - marker: a
    text: Or 'God of my rock'; the Hebrew construction can be rendered more literally this way, but 'my God, my rock' better fits the poetic apposition in English.
    reason: lexical_alternative
  - marker: b
    text: '''Horn'' is a Hebrew image for strength and victorious power.'
    reason: cultural_note
  - marker: c
    text: Or 'my deliverer' for 'my savior.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 하나님, 나의 바위이신 분, 내가 그분께 피하여 숨습니다. 나의 방패, 나의 구원의 뿔, 나의 요새, 나의 피난처, 나의 구원자이십니다. 주님께서는 폭력에서 나를 구하십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나의 바위이신 분’은 히브리어 구성상 ‘나의 바위의 하나님’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뿔’은 히브리어에서 힘과 승리의 상징입니다.
    reason: cultural_note
  - marker: c
    text: ‘구원자’는 여기서 ‘구해 주시는 분’ 또는 ‘구원해 주시는 분’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי צוּרִי
  english_pob_choice: my God, my rock
  chosen_korean: 하나님은 나의 바위
  alternatives_korean:
  - 나의 바위이신 하나님
  - 바위이신 나의 하나님
  lexicon: WLC/HALOT
  rationale: 히브리어는 ‘하나님’과 ‘나의 바위’가 밀접하게 붙은 호칭 연쇄이므로, 한국어에서는 ‘하나님은 나의 바위’로 자연스럽게 묶어 시적 병치를 살렸습니다.
- source_word: אֶחֱסֶה בּוֹ
  english_pob_choice: in whom I take refuge
  chosen_korean: 내가 그분께 피합니다
  alternatives_korean:
  - 그분 안에 피합니다
  - 그분께 피난처를 구합니다
  lexicon: HALOT
  rationale: חסה는 단순한 감정보다 실제로 ‘피하다/피신하다’의 동작을 뜻하므로, 시적 문맥에서 현대 한국어로는 ‘피합니다’가 가장 직접적입니다.
- source_word: קֶרֶן יִשְׁעִי
  english_pob_choice: the horn of my salvation
  chosen_korean: 나의 구원의 뿔
  alternatives_korean:
  - 나를 구원하시는 뿔
  - 나의 구원 뿔
  lexicon: HALOT
  rationale: ‘뿔’의 이미지를 보존해 힘과 승리의 상징을 살렸고, 해설적으로 풀지 않고 소유 관계도 원문에 가깝게 유지했습니다.
- source_word: מִשְׂגַּבִּי
  english_pob_choice: my stronghold
  chosen_korean: 나의 높은 요새
  alternatives_korean:
  - 나의 요새
  - 나의 견고한 피난처
  lexicon: HALOT
  rationale: מִשְׂגָּב은 높은 곳의 안전한 피난처를 가리키므로, ‘높은 요새’가 높이와 방어성을 함께 드러냅니다.
- source_word: וּמְנוּסִי
  english_pob_choice: my refuge
  chosen_korean: 나의 피난처
  alternatives_korean:
  - 나의 도피처
  - 나의 피할 곳
  lexicon: HALOT
  rationale: ‘피난처’는 한국어 성경에서 익숙하면서도 원문의 도피/안전 이미지를 잘 전달합니다.
- source_word: מֹשִׁעִי
  english_pob_choice: my savior
  chosen_korean: 나의 구원자
  alternatives_korean:
  - 나를 구하시는 분
  - 나의 구세주
  lexicon: HALOT
  rationale: 시편적 칭호로서의 מֹשִׁיעַ는 ‘구원자’가 가장 직접적이며, 교리적 용어인 ‘구세주’보다 원문의 일반적 의미를 더 중립적으로 반영합니다.
- source_word: מֵחָמָס
  english_pob_choice: from violence
  chosen_korean: 폭력에서
  alternatives_korean:
  - 포악함에서
  - 폭력으로부터
  lexicon: HALOT
  rationale: חָמָס의 핵심 의미를 유지하기 위해 추상명사 ‘폭력’을 택했고, 한국어 문장 흐름상 ‘에서’가 가장 간결합니다.
theological_decisions:
- issue: ‘horn’ 이미지의 보존
  chosen_reading: ‘구원의 뿔’로 직역해 힘과 승리의 상징을 살렸습니다.
  alternative_readings:
  - ‘구원의 능력’처럼 의미를 풀어 번역하기
  - ‘구원의 힘’으로 해석적으로 옮기기
  rationale: 이 절은 보호와 승리를 나타내는 은유들을 연쇄적으로 쌓고 있으므로, 이미지를 평이하게 바꾸면 시적·신학적 밀도가 약해집니다.
  doctrine_reference: '번역 원칙: 원문 은유 보존, 신학적 긴장 유지'
