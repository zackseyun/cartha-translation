    rationale: מִשְׂגָּב에는 높은 안전처라는 어감이 있을 수 있으나, 본문은 별도의 ‘높은’ 수식어를 두지 않습니다. ‘나의 요새’가 핵심 방어·안전 의미를 보존하면서 과잉 명시를 피합니다.
