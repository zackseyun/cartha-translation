  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מוֹצִיאִ֖/י מֵ/אֹֽיְבָ֑/י וּ/מִ/קָּמַ/י֙ תְּר֣וֹמְמֵ֔/נִי מֵ/אִ֥ישׁ חֲמָסִ֖ים תַּצִּילֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/049.yaml
  text: who brings me out from my enemies[a]; you exalt me above those who rise against me[b]; you deliver me from the violent man.
  footnotes:
  - marker: a
    text: Or 'and brings me out from my enemies'; the Hebrew conjunction may be carried into English explicitly.
    reason: lexical_alternative
  - marker: b
    text: Or 'from a man of violence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 원수들에게서 저를 이끌어 내시고[a], 저를 대적하여 일어나는 자들 위에 저를 높이시며, 포악한 사람에게서 저를 구해 내십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘원수들에게서 저를 이끌어 내시고’; 히브리어 접속사를 한국어에 명시적으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘포악한 사람에게서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצִיאִי
  english_pob_choice: who brings me out
  chosen_korean: 저를 이끌어 내시고
  alternatives_korean:
  - 저를 끌어내시고
  - 저를 구해 내시고
  lexicon: HALOT
  rationale: יצא/הוציא의 사역적 의미를 살리면서, 구원의 맥락에서 자연스러운 현대 한국어로 옮기기 위해 ‘이끌어 내시고’를 선택했습니다.
- source_word: מֵאֹיְבָי
  english_pob_choice: from my enemies
  chosen_korean: 원수들에게서
  alternatives_korean:
  - 적들에게서
  - 제 원수들에게서
  lexicon: HALOT
  rationale: 소유격이 분명하므로 ‘원수들에게서’로 간명하게 옮겼고, 시편적·전쟁적 문맥에 맞는 ‘원수’가 가장 직접적입니다.
- source_word: וּמִקָּמַי
  english_pob_choice: those who rise against me
  chosen_korean: 저를 대적하여 일어나는 자들
  alternatives_korean:
  - 저를 치러 일어나는 자들
  - 저의 대적들
  lexicon: HALOT
  rationale: קום의 ‘일어나다’라는 동사 이미지를 유지하면서 적대 방향을 드러내기 위해 ‘대적하여 일어나는 자들’로 옮겼습니다.
- source_word: מֵאִישׁ חֲמָסִים
  english_pob_choice: from the violent man
  chosen_korean: 포악한 사람
  alternatives_korean:
  - 폭력의 사람
  - 폭력적인 사람
  lexicon: HALOT
  rationale: איש의 단수성을 살리되, חמס의 폭력·포악성을 자연스럽게 드러내는 한국어로 ‘포악한 사람’을 택했습니다.
theological_decisions:
- issue: 하나님의 구원 행위의 중첩 표현
  chosen_reading: ‘이끌어 내시고… 높이시며… 구해 내십니다’로 서로 다른 동사를 살려, 단순 반복이 아니라 구원과 승귀의 연속된 행위를 드러냈습니다.
  alternative_readings:
  - 모두 ‘구원하십니다’로 평탄화
  - ‘끌어내시고… 세우시며… 건져 내십니다’로 일부만 변경
  rationale: 히브리어가 동사들을 분화해 병렬하고 있으므로, 한국어도 그 긴장과 진행을 보존하는 편이 본문 의미에 더 충실합니다.
  doctrine_reference: 시 18:48 평행본문의 구원-승리 표현
- issue: ‘포악한 사람’의 단수성
  chosen_reading: 단수 ‘사람’을 유지해 개인적 가해자/폭군의 이미지를 보존했습니다.
  alternative_readings:
  - ‘포악한 자들’로 복수화
  - ‘폭력적인 사람’으로 완화
  rationale: 히브리어 איש חמסים의 단수 형식을 살려, 공동체적 적대가 아니라 대표적 폭력 행위자를 가리키는 뉘앙스를 유지했습니다.
  doctrine_reference: 시 18:48의 시적 적대자 묘사
