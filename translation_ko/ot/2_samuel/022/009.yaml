base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/009.yaml
  text: Smoke went up from his nostrils[a], and consuming fire from his mouth; coals blazed from him.
  footnotes:
  - marker: a
    text: Or 'from his nose,' with 'his anger' as an idiomatic sense of the Hebrew word for 'nose/nostril.'
    reason: lexical_alternative
translation:
  language: ko
  text: 연기가 그의 콧구멍에서 올라오고, 사르는 불이 그의 입에서 나오니, 숯불이 그로부터 타올랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אַף는 문자적으로는 ‘코/콧구멍’이지만, 문맥에 따라 ‘분노’라는 관용적 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַפּוֹ / nostrils
  english_pob_choice: from his nostrils
  chosen_korean: 그의 콧구멍에서
  alternatives_korean:
  - 그의 코에서
  - 그의 분노에서
  lexicon: HALOT
  rationale: 히브리어 אַף의 구체적 신체 이미지를 살려, 시적 평행구조에 맞게 ‘입’과 대응되는 신체 부위를 그대로 옮겼습니다.
- source_word: תֹּאכֵל
  english_pob_choice: consuming
  chosen_korean: 사르는
  alternatives_korean:
  - 삼키는
  - 불태우는
  - 소멸시키는
  lexicon: HALOT
  rationale: 불이 능동적으로 태워 없애는 의미를 한국어 관형사형으로 자연스럽게 살렸습니다.
- source_word: גֶּחָלִים
  english_pob_choice: coals
  chosen_korean: 숯불
  alternatives_korean:
  - 숯덩이
  - 숯불들
  - 타는 숯
  lexicon: HALOT
  rationale: ‘숯불’은 불붙은 숯의 이미지를 현대 한국어로 자연스럽게 전달하면서, 앞뒤의 불·타오름 이미지와도 잘 이어집니다.
- source_word: בָּעֲרוּ
  english_pob_choice: blazed
  chosen_korean: 타올랐습니다
  alternatives_korean:
  - 활활 타올랐습니다
  - 불탔습니다
  - 붙었습니다
  lexicon: HALOT
  rationale: 시적 동사 ‘blazed’의 강한 발화 이미지를 자연스러운 합쇼체로 옮겼습니다.
theological_decisions:
- issue: 하나님에 대한 신체적/인간형 표현 유지
  chosen_reading: ‘콧구멍’과 ‘입’에서 연기와 불이 나오는 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘코’나 ‘분노’로 완화하여 옮김
  - 의미를 추상화하여 하나님의 진노만을 표현함
  rationale: 이 절은 신현(theophany)적 시로서, 구체적 신체 이미지가 하나님의 위엄과 진노를 드러내므로, 본문이 지닌 긴장을 해소하지 않고 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 (신학적 긴장을 보존)
