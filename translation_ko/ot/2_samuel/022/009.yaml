  rationale: 상향 운동을 나타내는 히브리어 동사 עָלָה를 더 중립적이고 정확한 ‘올라가고’로 조정했습니다. 또한 세 이미지가 모두 하나님에게서 발하는 원문의 병렬성을 한국어 어순으로 더 선명하게 했습니다. 본문의 인간형 신현 이미지와 אַף의 의미 가능성을 보존하는 각주는 유지했습니다.
