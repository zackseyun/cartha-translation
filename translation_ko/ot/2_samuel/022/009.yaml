    issue: ‘올라오고’의 방향성
    rationale: עָלָה는 ‘올라가다/올라오르다’의 상향 운동입니다. 한국어 ‘올라오다’는 화자 또는 기준점 쪽으로 다가오는 방향을 덧붙일 수 있으므로, 여기서는 ‘올라가고’가 더 중립적이고 정확합니다.
  - severity: low
    issue: 마지막 절의 출처 표현과 어순
    rationale: מִמֶּנּוּ는 숯불이 ‘그에게서’ 나오는 근원을 나타냅니다. ‘숯불이 그에게서 타올랐습니다’보다 ‘그에게서 숯불이 타올랐습니다’가 출처와 시적 병렬을 더 분명히 합니다.
