  source_fidelity: 동사와 전쟁 문맥의 ‘점령’은 적절합니다. 다만 עִיר הַמְּלוּכָה는 문자적으로 왕권/통치와 관련된 ‘성읍’을 가리키며, 본문의 ‘왕도’는 곧바로 ‘수도’라는 뜻으로 좁혀질 수 있습니다. 또한 현행 각주는 본문의 ‘왕도’와 ‘또는 수도’가 사실상 중복되어 어휘적 대안을 제대로 보존하지 못합니다.
  naturalness: ‘암몬 사람들의 라바’보다 성서 지명 관례와 한국어 결합상 ‘암몬 자손의 랍바’가 더 자연스럽습니다. ‘왕실의 도시’는 현대 한국어에서 이해 가능하면서도 수도라는 해석을 본문에 확정하지 않습니다.
  terminology: ‘랍바’는 한국어 성서 전통에서 널리 쓰이는 지명 표기입니다. עִיר הַמְּלוּכָה의 어휘적 여지를 살리기 위해 본문은 ‘왕실의 도시’로, 수도라는 문맥상 해석은 각주로 처리하는 것이 적절합니다.
