  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ נָתָ֖ן אֶל בֵּית֑/וֹ וַ/יִּגֹּ֣ף יְהוָ֗ה אֶת הַ/יֶּ֜לֶד אֲשֶׁ֨ר יָלְדָ֧ה אֵֽשֶׁת אוּרִיָּ֛ה לְ/דָוִ֖ד וַ/יֵּאָנַֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/015.yaml
  text: Then Nathan went to his house[a], and Yahweh struck the child whom Uriah’s wife had borne to David[c][b], and it became sick.
  footnotes:
  - marker: a
    text: Or 'afflicted' or 'plagued' the child.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''Uriah’s wife,'' preserving the narrative’s deliberate refusal here to name Bathsheba directly.'
    reason: cultural_note
  - marker: c
    text: Or 'and he was ill.' The Hebrew refers to the child becoming sick.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 나단은 자기 집으로 갔습니다[a]. 그리고 야훼께서 우리아의 아내가 다윗에게 낳은 아이를 치시니[b], 그 아이가 병들었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 집으로 돌아갔습니다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여기서 밧세바의 이름 대신 ‘우리아의 아내’라는 표현을 유지합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘병이 들었습니다’라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ נָתָן אֶל בֵּיתוֹ
  english_pob_choice: Then Nathan went to his house
  chosen_korean: 그러자 나단은 자기 집으로 갔습니다
  alternatives_korean:
  - 그리고 나단은 자기 집으로 갔습니다
  - 그러자 나단은 집으로 갔습니다
  lexicon: HALOT
  rationale: 와우 연속의 서사 진행을 자연스러운 한국어로 살려 ‘그러자’로 옮기고, בֵּיתוֹ는 구체적인 ‘자기 집’으로 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트의 기본값에 따라 신적 고유명사를 ‘야훼’로 옮겨, 호칭이 아닌 이름이라는 점을 보존했습니다.
- source_word: וַיִּגֹּף
  english_pob_choice: struck
  chosen_korean: 치시니
  alternatives_korean:
  - 때리시니
  - 치시니앗
  lexicon: HALOT
  rationale: נָגַף의 직접적 의미인 ‘치다/치심’을 살려, 구체적 병명의 추정 없이 하나님의 직접 행위를 드러냈습니다.
- source_word: אֵשֶׁת אוּרִיָּה לְדָוִד
  english_pob_choice: Uriah’s wife ... to David
  chosen_korean: 우리아의 아내가 다윗에게 낳은 아이
  alternatives_korean:
  - 우리아의 아내가 다윗에게서 낳은 아이
  - 우리아의 아내가 다윗에게 낳은 아이
  lexicon: HALOT
  rationale: 본문이 여기서 밧세바 이름 대신 ‘우리아의 아내’라는 서술을 유지하므로, 그 서사적 긴장을 그대로 반영했습니다.
- source_word: וַיֵּאָנַשׁ
  english_pob_choice: and it became sick
  chosen_korean: 그 아이가 병들었습니다
  alternatives_korean:
  - 그 아이가 아프게 되었습니다
  - 그리고 그 아이는 병이 났습니다
  lexicon: HALOT
  rationale: 동사의 병듦 시작을 자연스러운 현대 한국어로 옮겼고, 주어는 직전의 ‘아이’를 받게 했습니다.
theological_decisions:
- issue: 하나님의 직접적인 재난/징계 행위 표현
  chosen_reading: 야훼께서 ... 치시니
  alternative_readings:
  - 야훼께서 ... 벌하시니
  - 주님께서 ... 치시니
  rationale: 히브리어는 주어를 명시적으로 야훼로 두고 직접적인 타격을 말하므로, 이를 완화하지 않고 그대로 살렸습니다.
  doctrine_reference: 원문 우선 원칙 및 신적 행위의 직접성 보존
- issue: ‘우리아의 아내’라는 호칭 유지
  chosen_reading: 우리아의 아내
  alternative_readings:
  - 밧세바
  - 우리야의 아내
  rationale: 본문이 의도적으로 인물명을 생략하고 관계 호칭을 사용하므로, 서사의 도덕적·법적 긴장을 흐리지 않도록 유지했습니다.
  doctrine_reference: 서사적 지칭 보존
