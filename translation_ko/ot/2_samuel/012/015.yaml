  source_fidelity: 히브리어의 사건 순서와 직접 행위는 대체로 충실합니다. 다만 וַיִּגֹּף와 뒤따르는 וַיֵּאָנַשׁ은 각각 연속 서술이므로, ‘치시니’보다 ‘치셨고’가 두 절의 관계를 더 직접적으로 재현합니다. ‘다윗에게 낳아 준’은 לְדָוִד의 방향·수혜 관계를 자연스럽게 보존합니다.
  naturalness: 합쇼체는 적절합니다. ‘야훼께서 … 치셨고, 그 아이가 병들었습니다’가 현대 표준 한국어에서 더 매끄럽고, 원문의 서사적 병렬도 분명히 합니다.
  terminology: ‘야훼’, ‘우리아’, ‘다윗’, ‘아이’는 적절합니다. 밧세바라는 이름으로 바꾸지 않고 ‘우리아의 아내’를 유지해야 합니다. 문화·서사 주석의 앵커는 해당 표현 바로 뒤에 두는 것이 적절합니다.
