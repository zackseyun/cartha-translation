  source_fidelity: 첫머리의 ‘이제’는 히브리어에 명시되지 않아 삭제하는 것이 좋습니다. 또한 부자가 자기 가축을 아껴 손님을 위한 음식을 마련하지 않았다는 뜻이므로, ‘아까워하였습니다’의 대상을 분명히 하되 원문의 절제된 표현을 유지했습니다. 히브리어의 הֵלֶךְ(여행 중인 사람), אָרֵחַ(환대받는 손님), הָאִישׁ הַבָּא אֵלָיו(그에게 온 사람)의 어휘적 구별도 한국어에서 반영했습니다.
  naturalness: ‘양 떼나 소 떼 가운데서 가져다가 … 차리는 것을 아까워하였습니다’는 현대 표준어 합쇼체에서 자연스럽고, 원래 문안의 ‘하나를’처럼 원문에 없는 수량을 부가하지 않습니다. ‘나그네/손님/사람’의 순차적 표현도 반복을 줄이면서 원문의 지시를 따릅니다.
  terminology: ‘나그네’는 הֵלֶךְ의 이동성을, ‘손님’은 אָרֵחַ의 환대 맥락을 잘 나타냅니다. כִּבְשַׂת는 ‘암양’으로, הָאִישׁ הָרָאשׁ는 ‘가난한 사람’으로 옮기는 것이 적절합니다.
