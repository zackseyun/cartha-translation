- from: 이제 부자에게 한 나그네가 왔습니다[a]. 그런데 그는 자기 양 떼와 소 떼에서 하나를 가져와, 자기에게 온 나그네를 위해 차리기를 아까워하였습니다. 그래서 그는 가난한 사람의 암양 한 마리를 가져다가, 자기에게 온 그 사람을 위해 차렸습니다.
  to: 한 나그네가 부자에게 왔습니다[a]. 그러나 그는 자기 양 떼나 소 떼 가운데서 가져다가 자기에게 온 손님을 위해 차리는 것을 아까워하였습니다. 그래서 그는 가난한 사람의 암양을 가져다가 자기에게 온 사람을 위해 차렸습니다.
  rationale: 명시되지 않은 ‘이제’와 수량사 ‘하나’를 제거했습니다. 부자의 인색함을 나타내는 וַיַּחְמֹל의 문맥적 뜻은 ‘자기 가축을 가져다가 손님을 위해 차리는 것을 아까워하다’로 자연스럽게 드러냈습니다. 또한 본문의 세 호칭을 ‘나그네’, ‘손님’, ‘사람’으로 구별하여 원문의 어휘적 차이를 유지했습니다.
