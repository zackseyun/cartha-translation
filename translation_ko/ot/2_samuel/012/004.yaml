id: 2SA.12.4
reference: 2 Samuel 12:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣בֹא הֵלֶךְ֮ לְ/אִ֣ישׁ הֶֽ/עָשִׁיר֒ וַ/יַּחְמֹ֗ל לָ/קַ֤חַת מִ/צֹּאנ/וֹ֙ וּ/מִ/בְּקָר֔/וֹ לַ/עֲשׂ֕וֹת לָ/אֹרֵ֖חַ הַ/בָּא ל֑/וֹ וַ/יִּקַּ֗ח אֶת כִּבְשַׂת֙ הָ/אִ֣ישׁ הָ/רָ֔אשׁ וַֽ/יַּעֲשֶׂ֔/הָ לָ/אִ֖ישׁ הַ/בָּ֥א אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/004.yaml
  text: Now a traveler came to the rich man[a], and he spared taking from his own flock and from his own herd to prepare for the traveler who had come to him. So he took the ewe lamb of the poor man and prepared it for the man who had come to him.
  footnotes:
  - marker: a
    text: Or 'guest' for both occurrences of 'traveler.' The Hebrew uses related but distinct terms for a person on a journey and for one received in hospitality.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 부자에게 한 나그네가 왔습니다[a]. 그런데 그는 자기 양 떼와 소 떼에서 하나를 가져와, 자기에게 온 나그네를 위해 차리기를 아까워하였습니다. 그래서 그는 가난한 사람의 암양 한 마리를 가져다가, 자기에게 온 그 사람을 위해 차렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘손님’. 히브리어는 길 위의 사람을 뜻하는 말과 환대받는 사람을 뜻하는 관련되지만 서로 다른 말을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵלֶךְ
  english_pob_choice: traveler
  chosen_korean: 나그네
  alternatives_korean:
  - 여행자
  - 손님
  lexicon: HALOT
  rationale: הֵלֶךְ는 길 위의 사람을 가리키므로, hospitality의 맥락을 살리면서도 ‘손님’보다 이동성을 드러내는 ‘나그네’가 적절합니다.
- source_word: וַיַּחְמֹל
  english_pob_choice: he spared taking
  chosen_korean: 아까워하였습니다
  alternatives_korean:
  - 취하지 않았습니다
  - 불쌍히 여겨 취하지 않았습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 감정보다 ‘자기 것을 쓰기를 아까워하며 아끼다’의 뉘앙스를 가지므로, 문맥상 자기 몫을 내놓지 않으려는 태도를 드러내는 ‘아까워하였습니다’가 가장 자연스럽습니다.
- source_word: מִצֹּאנ/וֹ וּמִבְּקָר/וֹ
  english_pob_choice: from his own flock and from his own herd
  chosen_korean: 자기 양 떼와 소 떼에서
  alternatives_korean:
  - 자기 양들과 소들에서
  - 자기 가축 떼와 소 떼에서
  lexicon: HALOT
  rationale: 소유 접미사를 살리되 한국어에서는 ‘자기’로 자연스럽게 드러내고, 집합명사인 צאן/בקר을 ‘양 떼/소 떼’로 옮겨 대비를 유지했습니다.
- source_word: כִּבְשַׂת
  english_pob_choice: the ewe lamb
  chosen_korean: 암양 한 마리
  alternatives_korean:
  - 어린 암양
  - 암송아지
  lexicon: HALOT
  rationale: כִּבְשָׂה는 암컷 어린 양을 뜻하므로, 성별 정보를 분명히 하면서도 한국어로 과도하게 희귀하지 않은 ‘암양 한 마리’를 선택했습니다.
- source_word: הָאִישׁ הָרָאשׁ
  english_pob_choice: the poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 자
  - 빈궁한 사람
  lexicon: HALOT
  rationale: רָאשׁ는 궁핍한 사람을 가리키며, 서술 전체의 대비를 위해 현대 한국어에서 가장 직접적인 ‘가난한 사람’이 적절합니다.
theological_decisions:
- issue: 서술적 공손체와 대화체의 유지
  chosen_reading: 화자의 서술은 합쇼체로 유지하고, 직접 인용이 아니므로 별도의 문체 전환 없이 서술형으로 옮겼습니다.
  alternative_readings:
  - 구어체로 더 풀어 쓰는 방식
  - 문어체로 더 고전적으로 옮기는 방식
  rationale: 이 절은 비유의 내러티브를 전달하는 서술문이므로, 현대 표준어의 공적인 독서에 맞는 합쇼체가 원문 효과를 가장 잘 보존합니다.
  doctrine_reference: 문체 일관성과 서술 신뢰성
- issue: ‘여행자/손님’의 구별
  chosen_reading: 두 용어의 관련성은 주석[a]로 표시하고 본문은 ‘나그네’로 통일했습니다.
  alternative_readings:
  - 본문에서 둘 다 ‘손님’으로 처리
  - 본문에서 둘 다 ‘여행자’로 처리
  rationale: 히브리어는 길 위의 사람과 환대받는 사람을 서로 다른 어휘로 구별하므로, 본문은 자연스러운 한국어를 택하되 주석으로 어휘 차이를 보존해야 합니다.
  doctrine_reference: 원문 어휘 대비 보존
