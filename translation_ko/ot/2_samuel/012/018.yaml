  edition: WLC
  text: וַ/יְהִ֛י בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י וַ/יָּ֣מָת הַ/יָּ֑לֶד וַ/יִּֽרְאוּ֩ עַבְדֵ֨י דָוִ֜ד לְ/הַגִּ֥יד ל֣/וֹ כִּי מֵ֣ת הַ/יֶּ֗לֶד כִּ֤י אָֽמְרוּ֙ הִנֵּה֩ בִ/הְי֨וֹת הַ/יֶּ֜לֶד חַ֗י דִּבַּ֤רְנוּ אֵלָי/ו֙ וְ/לֹא שָׁמַ֣ע בְּ/קוֹלֵ֔/נוּ וְ/אֵ֨יךְ נֹאמַ֥ר אֵלָ֛י/ו מֵ֥ת הַ/יֶּ֖לֶד וְ/עָשָׂ֥ה רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/018.yaml
  text: And on the seventh day the child died. And David’s servants were afraid to tell him that the child was dead[a], for they said, “Behold, while the child was still alive, we spoke to him, and he did not listen to our voice. How then can we say to him, ‘The child is dead’? He may do harm.”
  footnotes:
  - marker: a
    text: Or, 'He may do evil,' 'He may react badly,' or possibly 'He may harm himself.' The Hebrew expression is brief and leaves the exact feared action unspecified.
    reason: lexical_alternative
translation:
  language: ko
  text: 이레째 되는 날에 그 아이가 죽었습니다. 다윗의 종들은 그 아이가 죽었다고 그에게 알리기를 두려워하였는데, 그들은 이렇게 말했습니다. “보십시오, 아이가 아직 살아 있을 때 우리가 그에게 말했지만, 그는 우리 목소리를 듣지 않았습니다. 그런데 어떻게 그에게 ‘그 아이가 죽었습니다’라고 말할 수 있겠습니까? 그는 해를 입을지도 모릅니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 악을 행할지도 모른다’, ‘그가 나쁘게 반응할지도 모른다’, 또는 ‘그가 스스로에게 해를 입힐지도 모른다’. 히브리어 표현이 짧아서, 두려워한 정확한 행동은 분명하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  english_pob_choice: on the seventh day
  chosen_korean: 이레째 되는 날에
  alternatives_korean:
  - 일곱째 날에
  - 그 이레째 날에
  lexicon: HALOT
  rationale: 시간 순서를 자연스러운 현대 한국어로 살리면서, 단순 수량보다 절차적 경과를 드러내는 표현을 택했습니다.
- source_word: וַיָּמָת הַיָּלֶד
  english_pob_choice: the child died
  chosen_korean: 그 아이가 죽었습니다
  alternatives_korean:
  - 그 아이가 사망했습니다
  - 그 아이가 죽었어요
  lexicon: HALOT
  rationale: יֶלֶד는 문맥상 영아/어린아이라는 뉘앙스가 강하므로 ‘아이’가 가장 자연스럽고, 서술문체는 합쇼체로 맞췄습니다.
- source_word: עַבְדֵי דָוִד
  english_pob_choice: David’s servants
  chosen_korean: 다윗의 종들
  alternatives_korean:
  - 다윗의 신하들
  - 다윗의 부하들
  lexicon: HALOT
  rationale: עֶבֶד의 기본 대응은 ‘종’이며, 본문이 궁정 관리보다 다윗에게 속한 하인/시종들의 집단을 가리키므로 ‘종들’이 원문에 더 가깝습니다.
- source_word: וְלֹא שָׁמַע בְּקוֹלֵנוּ
  english_pob_choice: and he did not listen to our voice
  chosen_korean: 우리 목소리를 듣지 않았습니다
  alternatives_korean:
  - 우리 말을 듣지 않았습니다
  - 우리의 음성에 귀 기울이지 않았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 너무 평탄화하지 않으면서도 한국어에서 자연스럽게 읽히도록 ‘목소리’를 유지했습니다.
- source_word: וְעָשָׂה רָעָה
  english_pob_choice: He may do harm
  chosen_korean: 해를 입을지도 모릅니다
  alternatives_korean:
  - 해를 끼칠지도 모릅니다
  - 나쁜 일을 할지도 모릅니다
  lexicon: HALOT
  rationale: 히브리어는 정확한 행동을 밝히지 않아 불확정성이 핵심이므로, 자해·도덕적 악행으로 좁히지 않고 문맥상 가능한 ‘해를 입다’로 남겼습니다.
theological_decisions:
- issue: וְעָשָׂה רָעָה의 불분명한 대상과 행위
  chosen_reading: 다윗이 어떤 해로운 반응을 보일 수 있다는 열린 가능성으로 남겼습니다.
  alternative_readings:
  - 그가 스스로에게 해를 끼칠 수 있다
  - 그가 악한 일을 할 수 있다
  - 그가 화를 내며 반응할 수 있다
  rationale: 원문은 두려워한 결과를 간단히 말할 뿐, 정확히 무엇을 할지 지정하지 않습니다. 따라서 심리적·도덕적 해석을 단정하지 않고 긴장을 보존했습니다.
  doctrine_reference: '번역 원칙: 원문이 열어 둔 의미 범위를 한국어에서도 닫지 않습니다.'
