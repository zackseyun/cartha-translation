  source_fidelity: 마지막 절의 וְעָשָׂה רָעָה는 다윗이 해로운/나쁜 행동을 ‘할’ 가능성을 말하는 능동 표현입니다. 초안의 ‘그는 해를 입을지도 모릅니다’는 다윗이 해를 받는다는 수동 의미가 되어 원문의 행위 주체와 의미 방향을 바꿉니다. 그 밖에는 시간 표현, 아이, 종들, 두려움의 내용 및 수사 의문문의 의미가 대체로 잘 반영되었습니다.
  naturalness: 합쇼체는 일관됩니다. 다만 ‘우리 목소리를 듣지 않았습니다’는 히브리어 관용구를 직역한 흔적이 있어 현대 표준 한국어에서는 ‘우리 말을 듣지 않았습니다’가 자연스럽고 의미도 정확합니다. ‘일곱째 날’은 ‘이레째 되는 날’보다 원문의 순서수 표현을 더 직접적이고 자연스럽게 재현합니다.
  terminology: ‘다윗’, ‘종들’, ‘아이’는 문맥과 한국어 성경 서술에 적절합니다. 마지막 표현은 대상과 구체적 행동을 특정하지 않는 ‘해를 끼칠지도 모릅니다’로 옮겨, 자해·타해·도덕적 악행 가운데 하나로 본문을 제한하지 않도록 했습니다.
  issues:
