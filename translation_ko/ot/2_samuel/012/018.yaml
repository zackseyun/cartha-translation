- from: 이레째 되는 날에 그 아이가 죽었습니다. 다윗의 종들은 그 아이가 죽었다고 그에게 알리기를 두려워하였는데, 그들은 이렇게 말했습니다. “보십시오, 아이가 아직 살아 있을 때 우리가 그에게 말했지만, 그는 우리 목소리를 듣지 않았습니다. 그런데 어떻게 그에게 ‘그 아이가 죽었습니다’라고 말할 수 있겠습니까? 그는 해를 입을지도 모릅니다.”[a]
  to: 일곱째 날에 그 아이가 죽었습니다. 다윗의 종들은 그 아이가 죽었다고 그에게 알리기를 두려워하였습니다. 그들이 말하기를, “보십시오, 아이가 아직 살아 있을 때 우리가 그에게 말했지만, 그는 우리 말을 듣지 않았습니다. 그런데 어떻게 그에게 ‘그 아이가 죽었습니다’라고 말할 수 있겠습니까? 그가 해를 끼칠지도 모릅니다[a].” 하였습니다.
  rationale: 핵심 수정은 마지막 절을 능동형 ‘그가 해를 끼칠지도 모릅니다’로 바로잡은 것입니다. 이는 원문의 불특정하고 잠재적인 해로운 행동을 보존하며, 자해나 특정 대상에 대한 해악으로 해석을 한정하지 않습니다. 또한 한국어 관용에 맞게 ‘우리 말을 듣지 않았습니다’로 다듬고, 시간 표현을 ‘일곱째 날’로 명료하게 했습니다. 각주 표지는 불확정성이 실제로 나타나는 마지막 절에 붙였습니다.
