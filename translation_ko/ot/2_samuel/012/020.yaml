  source_fidelity: 본문의 동작 순서와 내용은 대체로 충실합니다. 다만 וַיִּשְׁתָּחוּ는 몸을 굽히거나 엎드리는 행위를 우선 가리키므로, 본문에서는 그 신체적 행위를 보존하고 각주에서 ‘경배’라는 해석적 가능성을 제시하는 편이 원문의 폭을 더 잘 유지합니다. וַיִּשְׁאַל의 목적어가 생략된 점은 ‘청하자’로 자연스럽게 보존할 수 있습니다.
  naturalness: 합쇼체 문체는 적절합니다. 그러나 ‘그는 물었고’는 한국어에서 목적어 없이 다소 부자연스럽고, 각주 표지가 문장 끝에 놓여 있어 ‘엎드려 경배’가 아니라 마지막의 ‘먹었습니다’에 걸리는 것처럼 보입니다. 이를 해당 동사 바로 뒤로 옮겨야 합니다.
  terminology: ‘야훼의 집’, ‘몸에 기름을 바르고’, ‘빵’은 이 번역 방침 안에서 일관됩니다. ‘엎드려 경배한’은 물리적 몸짓과 예배의 해석을 함께 본문에 확정하므로, ‘엎드렸습니다’와 각주 처리로 조정합니다.
