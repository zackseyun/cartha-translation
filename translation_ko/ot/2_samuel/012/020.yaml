  rationale: 본문이 신적 고유명사를 직접 사용하므로, 대체 호칭이 아니라 음역형 '야훼'로 보존해 원문 고유성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
