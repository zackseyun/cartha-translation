  text: וַ/יָּקָם֩ דָּוִ֨ד מֵ/הָ/אָ֜רֶץ וַ/יִּרְחַ֣ץ וַ/יָּ֗סֶךְ וַ/יְחַלֵּף֙ שמלת/ו וַ/יָּבֹ֥א בֵית יְהוָ֖ה וַ/יִּשְׁתָּ֑חוּ וַ/יָּבֹא֙ אֶל בֵּית֔/וֹ וַ/יִּשְׁאַ֕ל וַ/יָּשִׂ֥ימוּ ל֛/וֹ לֶ֖חֶם וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/020.yaml
  text: Then David got up from the ground[a], washed, anointed himself, and changed his clothes. He went into the house of Yahweh and bowed down. Then he went to his house, asked, and they set bread before him, and he ate.
  footnotes:
  - marker: a
    text: Or 'worshiped'; the Hebrew verb can denote bowing down physically in reverence or worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗은 땅에서 일어나 씻고, 몸에 기름을 바르고, 옷을 갈아입었습니다. 그는 야훼의 집에 들어가 엎드려 경배한 뒤, 자기 집으로 갔습니다. 그는 물었고, 사람들이 그에게 빵을 차려 주었으며, 그는 먹었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '경배했다' — 히브리어 동사는 경외의 마음으로 몸을 굽히는 행위나 예배를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם מֵהָאָרֶץ
  english_pob_choice: got up from the ground
  chosen_korean: 땅에서 일어나다
  alternatives_korean:
  - 땅에서 일어서다
  - 땅에서 몸을 일으키다
  lexicon: HALOT
  rationale: די윗이 애도 중 땅에 엎드려 있던 상황을 한국어로 자연스럽게 살리면서, 원문의 구체적 동작을 보존했습니다.
- source_word: וַיִּרְחַץ / וַיָּסֶךְ / וַיְחַלֵּף שִׂמְלֹתוֹ
  english_pob_choice: washed, anointed himself, and changed his clothes
  chosen_korean: 씻고, 몸에 기름을 바르고, 옷을 갈아입었습니다
  alternatives_korean:
  - 목욕하고, 기름을 바르고, 옷을 바꾸었습니다
  - 씻고, 기름을 바르고, 옷을 갈아입었습니다
  lexicon: HALOT
  rationale: 세 동작의 연속을 살리되, סוך의 반신적 의미를 '몸에 기름을 바르다'로 풀어 자연스럽게 표현했습니다.
- source_word: בֵית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 집
  lexicon: HALOT
  rationale: פּ이트 יְהוָה의 직역을 유지해 예배 장소를 분명히 했고, POB의 표준 용례에 따라 하나님의 이름은 '야훼'로 옮겼습니다.
- source_word: וַיִּשְׁתָּחוּ
  english_pob_choice: bowed down
  chosen_korean: 엎드려 경배한
  alternatives_korean:
  - 절한
  - 몸을 굽혀 경배한
  lexicon: HALOT
  rationale: 단순한 '절하다'보다 물리적 굴복과 경배의 의미를 함께 드러내는 표현으로, 주석의 'bowing down physically in reverence or worship'를 반영했습니다.
- source_word: וַיִּשְׁאַל
  english_pob_choice: asked
  chosen_korean: 물었고
  alternatives_korean:
  - 요청했고
  - 문의했고
  lexicon: HALOT
  rationale: 히브리어 본문은 목적어를 직접 밝히지 않으므로, 한국어도 불필요하게 '먹을 것을' 등을 보충하지 않고 단순히 '물었고'로 유지했습니다.
- source_word: לֶחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 음식
  lexicon: HALOT
  rationale: 한국어 일상어에서 '빵'이 가장 직접적으로 לחם의 기본 의미를 전달하며, 앞뒤 문맥상 식사를 가리키는 자연스러운 표현입니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: '''야훼''를 본문에 유지했습니다.'
  alternative_readings:
  - '''주님'''
  - '''여호와'''
  rationale: 본문이 신적 고유명사를 직접 사용하므로, 대체 호칭이 아니라 음역형 '야훼'로 보존해 원문 고유성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
