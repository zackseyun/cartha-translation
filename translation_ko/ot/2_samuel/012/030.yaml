revisions:
- from: 그는 그들의 왕의 왕관을 그의 머리에서 벗겨 냈습니다. 그 무게는 금 한 달란트였고, 그 안에는 귀한 돌이 있었습니다. 그것이 다윗의 머리에 놓였습니다. 그는 그 성읍의 전리품을 매우 많이 끌어냈습니다.[a][b]
  to: 그는 그들의 왕[a]의 머리에서 왕관을 벗겨 내었습니다. 그 무게는 금 한 달란트[b]였고, 그 안에는 귀한 돌이 있었습니다. 그 왕관은 다윗의 머리에 놓였습니다. 그는 그 성읍의 전리품을 매우 많이 가져 나왔습니다.
  rationale: 수정문은 מֵעַל רֹאשׁוֹ의 분리·방향성을 ‘머리에서 … 벗겨 내었습니다’로 유지하고, וְאֶבֶן יְקָרָה의 간결한 장착 관계도 ‘그 안에는 귀한 돌이 있었습니다’로 보존합니다. 마지막 절은 הוֹצִיא에 없는 구체적 방식의 뉘앙스를 제거하여 ‘가져 나왔습니다’로 고쳤습니다. 논쟁적인 מַלְכָּם 독법은 본문에서 ‘그들의 왕’을 따르되 해당 위치의 각주에 대안을 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:37:07Z'
review_pass:
  verdict: revise
  source_fidelity: 본문은 대체로 히브리어의 절차와 의미를 따르지만, ‘끌어냈습니다’는 הוֹצִיא의 중립적인 ‘가져 나오게 하다/가져 나오다’보다 물리적으로 끌어내는 방식을 불필요하게 덧붙입니다. 또한 מַלְכָּם의 대안 독법은 본문 가까이에 각주로 유지하는 편이 적절합니다.
  naturalness: ‘그들의 왕의 왕관’은 이해되나 소유격이 연속되어 다소 무겁습니다. ‘그들의 왕의 머리에서 왕관을’로 어순을 바꾸면 현대 한국어로 더 자연스럽습니다. ‘그 왕관’으로 재지시하면 ‘그것’보다 선행사가 분명합니다.
  terminology: ‘왕관’, ‘귀한 돌’, ‘전리품’, ‘달란트’는 문맥과 현대 성서 문체에 적절합니다. 각주의 히브리어 뒤에 한국어가 아닌 ‘כאן’이 들어간 것은 ‘여기서’로 바로잡아야 합니다. ‘밀곰/말감’ 대안도 보존합니다.
  issues:
  - severity: medium
    issue: ‘전리품을 매우 많이 끌어냈습니다’
    rationale: הוֹצִיא는 ‘가져 나오다/내오다’이지 끌어내는 특정한 물리적 방식을 뜻하지 않습니다. ‘매우 많이 가져 나왔습니다’가 동작의 방식은 덧붙이지 않고 수량 강조를 보존합니다.
  - severity: low
    issue: 각주 a의 ‘כאן’
    rationale: 한국어 각주에 의도되지 않은 히브리어 단어가 혼입되어 있어 ‘여기서’로 수정해야 합니다.
  - severity: low
    issue: 각주 표지가 관련 본문이 아니라 문단 끝에 함께 놓임
    rationale: a는 מַלְכָּם/‘그들의 왕’에, b는 ‘달란트’에 각각 붙여야 독자가 각주의 적용 대상을 명확히 알 수 있습니다.
