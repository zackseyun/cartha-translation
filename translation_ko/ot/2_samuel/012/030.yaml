id: 2SA.12.30
reference: 2 Samuel 12:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וּ/מִשְׁקָלָ֨/הּ כִּכַּ֤ר זָהָב֙ וְ/אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑ד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/030.yaml
  text: He took the crown of their king from his head[a]. Its weight was a talent of gold, and in it was a precious stone, and it was placed on David’s head[b]. He brought out the spoil of the city in very great quantity.
  footnotes:
  - marker: a
    text: Or 'the crown of Milcom' (also spelled 'Malcam'), taking מַלְכָּם as the name of the Ammonite deity rather than 'their king.'
    reason: alternative_reading
  - marker: b
    text: A talent was a very large unit of weight, often estimated at roughly 75 pounds (34 kilograms), though exact ancient standards varied.
    reason: cultural_note
translation:
  language: ko
  text: 그는 그들의 왕[a]의 머리에서 왕관을 벗겨 내었습니다. 그 무게는 금 한 달란트[b]였고, 그 안에는 귀한 돌이 있었습니다. 그 왕관은 다윗의 머리에 놓였습니다. 그는 그 성읍의 전리품을 매우 많이 가져 나왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘밀곰의 왕관’(‘말감’으로도 표기). 여기서 מַלְכָּם을 암몬의 신 이름으로 읽는 견해입니다.
    reason: alternative_reading
  - marker: b
    text: ‘달란트’는 매우 큰 무게 단위로, 대략 34킬로그램(75파운드) 안팎으로 추정되지만 고대의 정확한 기준은 다양했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  english_pob_choice: crown
  chosen_korean: 왕관
  alternatives_korean:
  - 면류관
  - 왕관
  lexicon: HALOT
  rationale: 왕권을 나타내는 עֲטֶרֶת은 이 문맥에서 자연스럽게 ‘왕관’이 가장 직접적입니다.
- source_word: מֵעַל רֹאשׁוֹ
  english_pob_choice: from off his head
  chosen_korean: 그의 머리에서 벗겨 냈습니다
  alternatives_korean:
  - 그의 머리에서
  - 그 머리 위에서
  lexicon: HALOT
  rationale: מֵעַל의 ‘~위에서/떼어’라는 방향성을 살려 단순한 출처보다 분리 동작이 드러나게 옮겼습니다.
- source_word: וְאֶבֶן יְקָרָה
  english_pob_choice: and in it was a precious stone
  chosen_korean: 그 안에는 귀한 돌이 있었습니다
  alternatives_korean:
  - 보석이 박혀 있었습니다
  - 귀한 돌이 있었습니다
  lexicon: HALOT
  rationale: 돌이 왕관에 장착된 상태를 암시하되, 정확한 세공 방식은 단정하지 않기 위해 ‘그 안에는’으로 처리했습니다.
- source_word: שְׁלַל הָעִיר
  english_pob_choice: the spoil of the city
  chosen_korean: 그 성읍의 전리품
  alternatives_korean:
  - 그 성읍의 노획물
  - 그 도시의 전리품
  lexicon: HALOT
  rationale: שָׁלָל은 전쟁에서 얻은 전리품을 가리키므로, 현대 한국어 성서 문맥에서는 ‘전리품’이 가장 적절합니다.
theological_decisions:
- issue: מַלְכָּם을 ‘그들의 왕’으로 읽을지, 암몬 신 밀곰/말감의 이름으로 읽을지
  chosen_reading: 본문은 ‘그들의 왕의’로 옮기고, 대안은 주석으로 보존합니다.
  alternative_readings:
  - 밀곰
  - 말감
  rationale: 형태상 ‘왕’+3인칭 복수 소유격으로 읽을 수 있고, 문맥상 왕관을 머리에서 벗기는 장면이 자연스럽습니다. 다만 신명으로 읽는 전통도 있으므로 해석 가능성을 지우지 않았습니다.
  doctrine_reference: Translation philosophy §3 (의미 있는 문법·어휘의 긴장 보존)
