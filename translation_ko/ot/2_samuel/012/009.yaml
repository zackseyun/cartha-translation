id: 2SA.12.9
reference: 2 Samuel 12:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַדּ֜וּעַ בָּזִ֣יתָ אֶת דְּבַ֣ר יְהוָ֗ה לַ/עֲשׂ֣וֹת הָ/רַע֮ ב/עינ/ו אֵ֣ת אוּרִיָּ֤ה הַֽ/חִתִּי֙ הִכִּ֣יתָ בַ/חֶ֔רֶב וְ/אֶ֨ת אִשְׁתּ֔/וֹ לָקַ֥חְתָּ לְּ/ךָ֖ לְ/אִשָּׁ֑ה וְ/אֹת֣/וֹ הָרַ֔גְתָּ בְּ/חֶ֖רֶב בְּנֵ֥י עַמּֽוֹן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/009.yaml
  text: Why have you despised the word of Yahweh[a], to do what is evil in his sight? You struck down Uriah the Hittite with the sword, and took his wife for yourself as a wife[c][b], and killed him with the sword of the Ammonites.
  footnotes:
  - marker: a
    text: Or 'have you treated the word of the LORD with contempt?'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'took his wife for yourself as a wife'; the wording underscores David's personal appropriation of Uriah's wife.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'with the sword of the sons of Ammon,' indicating that David caused Uriah's death through Ammonite agency.
    reason: cultural_note
translation:
  language: ko
  text: 어찌하여 너는 야훼의 말씀을 업신여겨 그 보시기에 악을 행하였습니까? 너는 헷 사람 우리야를 칼로 쳤고, 그의 아내를 네 아내로 삼았으며, 그를 암몬 사람들의 칼로 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַדּוּעַ
  english_pob_choice: Why
  chosen_korean: 왜
  alternatives_korean:
  - 어찌하여
  - 왜 그러했습니까
  lexicon: HALOT
  rationale: 나단의 강한 질책형 질문을 자연스러운 현대 한국어로 옮기되, 과도하게 장식하지 않고 직접성을 유지했습니다.
- source_word: בָּזִיתָ אֶת דְּבַר יְהוָה
  english_pob_choice: have you despised the word of Yahweh
  chosen_korean: 야훼의 말씀을 업신여겨
  alternatives_korean:
  - 야훼의 말씀을 멸시하여
  - 야훼의 말씀을 깔보아
  lexicon: HALOT
  rationale: בזה의 핵심은 단순 불순종이 아니라 경멸·업신여김이므로, ‘업신여기다’로 그 도덕적 무게를 살렸습니다.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינָיו
  english_pob_choice: to do what is evil in his sight
  chosen_korean: 그의 눈앞에서 악을 행하였습니까
  alternatives_korean:
  - 그 보시기에 악한 일을 하였습니까
  - 그 앞에서 악을 저질렀습니까
  lexicon: HALOT
  rationale: ‘그의 눈앞에서’는 히브리어 관용을 살린 직역에 가깝고, ‘악을 행하다’는 평가적 표현을 유지합니다.
- source_word: לָקַחְתָּ לְּךָ לְאִשָּׁה
  english_pob_choice: took his wife for yourself as a wife
  chosen_korean: 그의 아내를 네 자신을 위해 아내로 데려갔으며
  alternatives_korean:
  - 그의 아내를 네 것으로 삼았으며
  - 그의 아내를 네 아내로 취하였으며
  lexicon: HALOT
  rationale: 히브리어의 중복적 표현이 자기중심적 점유를 강조하므로, 그 반복성을 한국어에서도 일부 살렸습니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the Ammonites
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬인들
  lexicon: HALOT
  rationale: ‘בני’의 직접 대응을 살려 ‘암몬 자손’으로 옮겼고, 전승적 민족명보다 원문의 관계성을 보존했습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 절은 יְהוָה가 직접 나오므로, 프로젝트 기본값에 따라 고유한 언약 이름을 드러내는 ‘야훼’를 채택했습니다.
  doctrine_reference: DOCTRINE.md — יְהוָה / YHWH
