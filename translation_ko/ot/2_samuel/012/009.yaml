revisions:
- from: 왜 너는 야훼의 말씀을 업신여겨 그의 눈앞에서 악을 행하였습니까? 너는 헷 사람 우리야를 칼로 치고, 그의 아내를 네 자신을 위해 아내로 데려갔으며, 그를 암몬 자손의 칼로 죽였습니다.
  to: 어찌하여 너는 야훼의 말씀을 업신여겨 그 보시기에 악을 행하였습니까? 너는 헷 사람 우리야를 칼로 쳤고, 그의 아내를 네 아내로 삼았으며, 그를 암몬 사람들의 칼로 죽였습니다.
  rationale: 수정은 히브리어의 고발 구조와 반복되는 ‘칼’의 표현을 유지하면서, 한국어 관용과 현대 합쇼체 문장을 다듬는 데 한정했습니다. ‘네 아내로 삼고’는 자기 것으로 취한 의미를 보존하며 불필요하게 어색한 중복을 피합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:37:03Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 세 행위의 병렬, 그리고 ‘칼’의 반복은 잘 보존되었습니다. 다만 בְּעֵינָיו는 한국어 관용상 ‘그 보시기에’가 더 정확하고 자연스럽습니다. 또한 בְּנֵי עַמּוֹן은 여기서 암몬 사람들/암몬인들을 가리키므로 ‘암몬 자손’보다 ‘암몬 사람들’이 문맥상 분명합니다.
  naturalness: 초안의 ‘그의 눈앞에서’와 ‘네 자신을 위해 아내로 데려갔으며’는 현대 표준어 성서 문체로 다소 어색합니다. ‘그 보시기에’와 ‘네 아내로 삼고’가 합쇼체의 엄중한 질책 문맥에 자연스럽습니다.
  terminology: ‘야훼’, ‘헷 사람 우리야’, ‘악을 행하다’는 적절합니다. ‘암몬 사람들’은 민족 집단을 가리키는 본문의 용법을 자연스럽게 드러냅니다.
  issues:
  - severity: low
    issue: ‘그의 눈앞에서’는 히브리어 관용구의 한국어 표현으로 다소 직역투입니다.
    rationale: בְּעֵינָיו는 하나님이 보시고 평가하시는 관용적 표현이므로 ‘그 보시기에’가 의미와 한국어 관용을 함께 살립니다.
  - severity: medium
    issue: ‘그의 아내를 네 자신을 위해 아내로 데려갔으며’는 부자연스럽고 목적 관계가 불명료합니다.
    rationale: לָקַחְתָּ לְּךָ לְאִשָּׁה는 그의 아내를 자기 아내로 취했다는 뜻입니다. ‘네 아내로 삼고’는 이를 자연스럽고 정확하게 전달합니다.
  - severity: low
    issue: ‘암몬 자손의 칼’은 현대 한국어에서 민족 집단 지칭으로 어색합니다.
    rationale: בְּנֵי עַמּוֹן은 관용적으로 암몬 사람들(암몬인들)을 뜻하며, ‘암몬 사람들의 칼’이 그들이 실행한 수단이라는 문맥을 분명히 합니다.
  revised_text: 어찌하여 너는 야훼의 말씀을 업신여겨 그 보시기에 악을 행하였습니까? 너는 헷 사람 우리야를 칼로 쳤고, 그의 아내를 네 아내로 삼았으며, 그를 암몬 사람들의 칼로 죽였습니다.
  revised_footnotes: []
