source:
  edition: WLC
  text: וַ/יְבַקֵּ֥שׁ דָּוִ֛ד אֶת הָ/אֱלֹהִ֖ים בְּעַ֣ד הַ/נָּ֑עַר וַ/יָּ֤צָם דָּוִד֙ צ֔וֹם וּ/בָ֥א וְ/לָ֖ן וְ/שָׁכַ֥ב אָֽרְצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/016.yaml
  text: And David sought God on behalf of the boy[b][a]. David fasted a fast, and he went in and spent the night and lay on the ground.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'David fasted' or 'David kept a fast.' The Hebrew uses a cognate expression, literally 'fasted a fast,' for emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''The boy'' refers to David''s child who was struck with illness (vv. 15, 18). ''The child'' is also a possible rendering of the Hebrew term here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 그 아이를 위하여 하나님께 간구하였습니다.[b] 다윗은 금식하였습니다.[a] 그리고 안으로 들어가 밤을 지내고 땅에 누웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 동족 목적어를 사용하여 문자적으로는 ‘금식하고 금식했다’라는 강조를 나타냅니다. 한국어 본문에서는 이를 자연스럽게 ‘금식하였습니다’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: ‘아이’는 여기서 다윗의 병든 자녀를 가리킵니다. 히브리어 낱말은 문맥에 따라 ‘소년’ 또는 ‘어린아이’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ אֶת הָאֱלֹהִים
  english_pob_choice: sought God
  chosen_korean: 하나님을 찾았습니다
  alternatives_korean:
  - 하나님께 간구했습니다
  - 하나님께 매달렸습니다
  lexicon: HALOT
  rationale: בקש의 기본 의미를 살리면서 문맥상 다윗의 중보적 간구를 자연스럽게 드러내기 위해 ‘찾다’를 선택했습니다. ‘간구하다’는 의미는 가능하지만 동사 자체보다 해석을 더 강하게 드러냅니다.
- source_word: בְּעַד הַנַּעַר
  english_pob_choice: on behalf of the boy
  chosen_korean: 그 아이를 위해
  alternatives_korean:
  - 그 소년을 위하여
  - 그 아이를 대신하여
  lexicon: HALOT
  rationale: בעד의 대표적/중보적 의미를 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘위해’를 택했습니다. ‘대신하여’는 대리성은 강하지만 본문보다 더 구체적입니다.
- source_word: וַיָּצָם ... צוֹם
  english_pob_choice: fasted a fast
  chosen_korean: 금식하고
  alternatives_korean:
  - 금식하였습니다
  - 금식을 금식했습니다
  lexicon: HALOT
  rationale: 히브리어의 동족 목적어 강조를 한국어로는 직역하기보다 문맥의 강조를 해치지 않으면서도 자연스럽게 옮기기 위해 ‘금식하고’로 처리했습니다. 본문의 반복적 강조는 주절의 연속 동작과 중대한 애도를 통해 충분히 드러납니다.
- source_word: וּבָא וְלָן וְשָׁכַב אָרְצָה
  english_pob_choice: went in and spent the night and lay on the ground
  chosen_korean: 안으로 들어가 그 밤을 보내며 땅에 엎드려 누웠습니다
  alternatives_korean:
  - 들어가 밤을 보내고 땅에 누웠습니다
  - 들어가 머무르며 땅에 엎드렸습니다
  lexicon: HALOT
  rationale: 연속된 동작을 현대 한국어 문장으로 자연스럽게 재구성하되, ‘땅에’와 ‘누웠습니다’로 낮아짐과 슬픔의 자세를 살렸습니다. ‘엎드려’는 ארצה의 지향성과 애도 자세를 보강하는 보조 표현입니다.
theological_decisions:
- issue: 금식 표현의 강조를 어떻게 옮길지
  chosen_reading: 히브리어의 ‘금식하였다, 금식’이라는 강조는 한국어에서 비정상적인 중복 직역 대신 서술 전체의 긴박함과 반복적 동작으로 반영했습니다.
  alternative_readings:
  - ‘금식을 금식하였습니다’처럼 형식을 보존하는 번역
  - 각주로 동족 목적어 구조를 설명하는 번역
  rationale: 본문의 수사적 강조를 완전히 지우지 않으면서도 한국어 가독성을 지키기 위한 선택입니다. 본문이 요구하는 것은 어색한 반복 그 자체보다 다윗의 절박한 애도와 간구입니다.
  doctrine_reference: source-level rhetorical emphasis
