  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף דָּוִ֛ד בָּ/אִ֖ישׁ מְאֹ֑ד וַ/יֹּ֨אמֶר֙ אֶל נָתָ֔ן חַי יְהוָ֕ה כִּ֣י בֶן מָ֔וֶת הָ/אִ֖ישׁ הָ/עֹשֶׂ֥ה זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/005.yaml
  text: Then David burned with anger against the man greatly[a], and he said to Nathan, “As Yahweh lives, the man who has done this is a son of death!”
  footnotes:
  - marker: a
    text: Hebrew 'a son of death,' that is, one who deserves to die or is worthy of death.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다윗은 그 사람에게 매우 크게 분노하며 나단에게 말했습니다. “야훼께서 살아 계심을 두고 맹세하건대, 이 일을 행한 그 사람은 죽어 마땅한 사람입니다!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  english_pob_choice: burned with anger
  chosen_korean: 매우 크게 분노하다
  alternatives_korean:
  - 몹시 분노하다
  - 분노가 타오르다
  - 격노하다
  lexicon: HALOT
  rationale: 히브리어 관용구의 강한 분노와 ‘타오름’의 이미지를 살리되, 현대 한국어에서는 자연스럽게 ‘매우 크게 분노하다’로 옮기는 것이 가장 직접적입니다.
- source_word: בָּאִישׁ
  english_pob_choice: against the man
  chosen_korean: 그 사람에게
  alternatives_korean:
  - 그 사람을 향해
  - 그 남자에게
  lexicon: HALOT
  rationale: 분노의 대상 표지를 한국어에서는 ‘~에게’로 자연스럽게 드러내면 충분하며, 문맥상 비유 속 인물을 가리키므로 ‘그 사람’이 적절합니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서 살아 계심을 두고 맹세하건대
  alternatives_korean:
  - 야훼의 살아 계심을 두고
  - 야훼께서 살아 계신다
  lexicon: HALOT
  rationale: 직역형 맹세 공식을 한국어에서 자연스럽게 풀어, 맹세의 기능을 분명히 하면서도 신명(神名) 야훼를 보존했습니다.
- source_word: בֶן מָוֶת
  english_pob_choice: a son of death
  chosen_korean: 죽어 마땅한 사람
  alternatives_korean:
  - 죽음의 아들
  - 사형 받을 사람
  - 죽을 자
  lexicon: HALOT
  rationale: 히브리어 관용구의 뜻은 ‘죽음에 해당하는 자’이므로, 본문에는 의미를 분명히 드러내는 표현을 두고 원문식 관용구는 주석 없이도 이해되도록 처리했습니다.
- source_word: הָעֹשֶׂה זֹאת
  english_pob_choice: who has done this
  chosen_korean: 이 일을 행한
  alternatives_korean:
  - 이 일을 한
  - 이 일을 저지른
  lexicon: HALOT
  rationale: 행위자를 규정하는 분사 구조를 한국어 관계절로 옮겨, 이어지는 ‘그 사람’과 결합될 때 법적·판결적 뉘앙스가 살아나도록 했습니다.
theological_decisions:
- issue: יְהוָה 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 있는 신명을 제목형 표현으로 바꾸지 않고, 프로젝트 기준에 따라 고유명 야훼로 옮겨 언약 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: בֶן מָוֶת의 본문 처리
  chosen_reading: 죽어 마땅한 사람
  alternative_readings:
  - 죽음의 아들
  - 사형받을 사람
  - 죽을 자
  rationale: 원문의 충격적 관용구를 한국어 독자에게 오해 없이 전달하는 것이 중요하므로, 본문은 의미역을 우선하고 원문식 표현은 주해가 아니라 본문 가독성 차원에서 절제했습니다.
  doctrine_reference: 'Translation philosophy: source transparency with readable equivalence'
