translation:
  language: ko
  text: 그러자 다윗은 그 사람에게 몹시 분노했습니다. 그리고 나단에게 말했습니다. “야훼께서 살아 계심을 두고 맹세하건대, 이 일을 한 그 사람은 죽어 마땅합니다![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘죽음의 아들’이며, 죽음에 해당하는 자 또는 죽어 마땅한 자라는 뜻입니다.
    reason: 히브리어 관용구 בֶן־מָוֶת의 문자적 표현과 관용적 의미를 함께 밝혀 원문 투명성을 보완합니다.
