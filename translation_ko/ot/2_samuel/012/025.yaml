id: 2SA.12.25
reference: 2 Samuel 12:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֗ח בְּ/יַד֙ נָתָ֣ן הַ/נָּבִ֔יא וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ יְדִ֣ידְיָ֑הּ בַּ/עֲב֖וּר יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/025.yaml
  text: And he sent word through Nathan the prophet[a], and he called his name Jedidiah[b], because of Yahweh.
  footnotes:
  - marker: a
    text: Jedidiah probably means 'beloved of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'by the hand of Nathan the prophet.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 나단 예언자를 통해 말씀을 보내시고, 그의 이름을 여디디야라 지으셨습니다. 이는 야훼께서 그렇게 하셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여디디야’는 대체로 ‘야훼께 사랑받는 자’라는 뜻으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘나단 예언자의 손을 통해’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: he sent word
  chosen_korean: 말씀을 보내시고
  alternatives_korean:
  - 보내시고
  - 사자를 보내시고
  lexicon: HALOT
  rationale: 히브리어 동사는 단순히 ‘보내다’이지만, 여기서는 나단을 통한 전달 행위이므로 한국어에서는 ‘말씀을 보내시고’로 옮겨 전달의 의미를 분명히 했습니다.
- source_word: בְּיַד נָתָן הַנָּבִיא
  english_pob_choice: through Nathan the prophet
  chosen_korean: 나단 예언자를 통해
  alternatives_korean:
  - 나단 예언자의 손을 통해
  - 나단 선지자를 통해
  lexicon: HALOT
  rationale: 관용구 ‘by the hand of’는 매개/대리의 뜻이므로, 자연스러운 현대 한국어로 ‘~를 통해’가 가장 적절합니다. ‘예언자’는 본문의 직함을 직역한 것입니다.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ
  english_pob_choice: he called his name
  chosen_korean: 그의 이름을 ... 지으셨습니다
  alternatives_korean:
  - 그의 이름을 ... 불렀습니다
  - 그를 ...라 하셨습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘이름을 짓다/정하다’의 뜻이므로, 한국어에서도 의미가 자연히 드러나는 ‘이름을 지으시다’를 택했습니다.
- source_word: יְדִידְיָהּ
  english_pob_choice: Jedidiah
  chosen_korean: 여디디야
  alternatives_korean:
  - 예디디야
  - 야디디야
  lexicon: standard transliteration
  rationale: 고유명사는 통용되는 성서 음역에 따라 ‘여디디야’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본 원칙에 따라 יהוה는 ‘야훼’로 옮겼습니다. 본문 끝의 이유절도 ‘야훼께서’로 반영했습니다.
theological_decisions:
- issue: 문장의 주어와 행위 주체
  chosen_reading: 주어는 앞선 문맥과 영어 POB 해설에 따라 야훼로 이해하고, 나단은 전달의 매개자입니다.
  alternative_readings:
  - 다윗이 이름을 지었다는 읽기
  - 나단이 이름을 지었다는 읽기
  rationale: 문맥상 ‘그는’은 야훼를 가리키며, ‘나단 예언자를 통해’는 중개 표현입니다. 따라서 이름을 주시는 행위까지 야훼의 주권적 행위로 드러내는 것이 본문의 흐름에 가장 잘 맞습니다.
  doctrine_reference: 본문의 문맥적 주어 해석; 신적 주권과 계시의 매개성 보존
