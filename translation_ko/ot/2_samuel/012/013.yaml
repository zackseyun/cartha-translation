  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל נָתָ֔ן חָטָ֖אתִי לַֽ/יהוָ֑ה וַ/יֹּ֨אמֶר נָתָ֜ן אֶל דָּוִ֗ד גַּם יְהוָ֛ה הֶעֱבִ֥יר חַטָּאתְ/ךָ֖ לֹ֥א תָמֽוּת־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/013.yaml
  text: Then David said to Nathan[a], “I have sinned against Yahweh.” And Nathan said to David, “Yahweh also has taken away your sin[b]; you shall not die.”
  footnotes:
  - marker: a
    text: Or “The LORD has put away your sin.” The Hebrew verb literally means “has caused to pass over,” here in the sense of removing guilt.
    reason: lexical_alternative
  - marker: b
    text: Or “you will not die.” The Hebrew simply says “you shall not die,” without explicitly stating “be put to death,” though the legal context may imply spared capital judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 나단에게 말했습니다. "제가 야훼께 죄를 지었습니다." 그러자 나단이 다윗에게 말했습니다. "야훼께서도 당신의 죄를 거두셨으니, 당신은 죽지 않을 것입니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 "지나가게 하다"에 가깝지만, 여기서는 죄책을 제거한다는 뜻으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단순히 "당신은 죽지 않을 것이다"라고 말하며, "사형을 면한다"는 표현은 직접 나오지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי לַיהוָה
  english_pob_choice: I have sinned against Yahweh
  chosen_korean: 제가 야훼께 죄를 지었습니다
  alternatives_korean:
  - 제가 야훼께 죄를 범했습니다
  - 제가 야훼께 죄를 지었습니다
  lexicon: HALOT
  rationale: חטא의 고백 표현을 한국어 관용으로는 "죄를 짓다"가 가장 직접적이며, לַיהוָה는 대상/관계의 방향을 살려 "야훼께"로 옮겼습니다.
- source_word: גַּם יְהוָה
  english_pob_choice: Yahweh also
  chosen_korean: 야훼께서도
  alternatives_korean:
  - 야훼도
  - 또 야훼께서
  lexicon: HALOT
  rationale: גַּם의 강조·연결 기능을 자연스럽게 살리기 위해 부사 "도"를 붙여 "야훼께서도"로 옮겼습니다.
- source_word: הֶעֱבִיר חַטָּאתְךָ
  english_pob_choice: has taken away your sin
  chosen_korean: 당신의 죄를 거두셨으니
  alternatives_korean:
  - 당신의 죄를 옮겨 가셨으니
  - 당신의 죄를 없애셨으니
  - 당신의 죄를 거두셨으니
  lexicon: HALOT
  rationale: הֶעֱבִיר의 기본 뜻인 '지나가게 하다/옮기다'를 한국어에서는 문맥상 죄책 제거의 의미가 드러나는 "거두셨다"로 자연스럽게 옮겼습니다.
- source_word: לֹא תָמוּת
  english_pob_choice: you shall not die
  chosen_korean: 당신은 죽지 않을 것입니다
  alternatives_korean:
  - 당신은 죽지 않을 것입니다
  - 당신은 반드시 죽지 않을 것입니다
  - 당신은 죽임을 당하지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어는 단순히 '죽지 않는다'고 말하므로, 법정적 뉘앙스를 유지하면서도 과도한 해석을 피하는 표준 미래 부정으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 주(主)가 아니라 야훼로 직접 음역했습니다
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문이 Tetragrammaton을 직접 사용하므로, POB 기준에 따라 고유한 언약 이름을 드러내기 위해 야훼를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 죄 사함 표현의 범위
  chosen_reading: '"거두셨다"로 번역해 죄의 제거를 분명히 하되, 속죄의 메커니즘은 덧붙이지 않았습니다'
  alternative_readings:
  - '"용서하셨다"'
  - '"넘기셨다"'
  - '"죄를 없애셨다"'
  rationale: 본문은 다윗의 죄가 제거되었고 그 결과 죽지 않게 되었음을 말하지만, 그 방식까지 설명하지 않으므로 그 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
