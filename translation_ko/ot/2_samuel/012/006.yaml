  source_fidelity: ‘네 배로 갚아야 합니다’는 יְשַׁלֵּם אַרְבַּעְתָּיִם의 배상 명령을 적절히 반영합니다. 다만 כִּבְשָׂה에는 ‘어린’이라는 의미가 자체적으로 포함되어 있지 않으므로, ‘어린 암양’은 이 절의 명시적 표현보다 한 단계 더 나아갑니다. 또한 ‘암양을 네 배로 갚다’는 한국어에서 목적어와 배상 수량의 관계가 다소 불명확합니다.
  naturalness: ‘그 암양에 대하여 네 배로 배상해야 합니다’는 법적 판결의 성격을 유지하면서도 무엇을 네 배로 갚는지 자연스럽게 드러냅니다. 이유절도 ‘이 일을 저질렀고 또 불쌍히 여기지 않았기 때문입니다’로 연결하면 현대 표준어 합쇼체에서 매끄럽습니다.
  terminology: ‘암양’은 여성인 양을 나타내는 כִּבְשָׂה를 간결하게 보존합니다. חָמַל은 ‘불쌍히 여기다’로 적절히 옮겼고, 각주의 ‘아끼지 않았다’는 유효한 대안을 제공합니다. 각주 설명은 이 동사의 핵심인 동정하여 아끼거나 살려 두는 의미에 맞추어 다듬었습니다.
