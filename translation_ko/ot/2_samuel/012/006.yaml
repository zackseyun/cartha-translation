language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הַ/כִּבְשָׂ֖ה יְשַׁלֵּ֣ם אַרְבַּעְתָּ֑יִם עֵ֗קֶב אֲשֶׁ֤ר עָשָׂה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/עַ֖ל אֲשֶׁ֥ר לֹֽא חָמָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/006.yaml
  text: And he must repay the ewe lamb fourfold[a], because he did this thing and because he had no pity.
  footnotes:
  - marker: a
    text: Or 'he did not spare.' The Hebrew verb can emphasize refraining from harming or acting out of pity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 어린 암양을 네 배로 갚아야 합니다[a]. 이는 그가 이 일을 했고, 또 불쌍히 여기지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아끼지 않았다.’ 히브리어 동사는 해치지 않으려는 자제나 불쌍히 여기는 마음을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכִּבְשָׂה
  english_pob_choice: the ewe lamb
  chosen_korean: 그 어린 암양
  alternatives_korean:
  - 그 새끼 양
  - 그 암양
  lexicon: HALOT
  rationale: כִּבְשָׂה는 암컷 양을 가리키므로 성별을 드러내는 표현이 필요합니다. ‘어린 암양’은 나이와 연약함을 함께 살려, 본문의 불쌍한 사람의 소중한 짐승이라는 대비를 자연스럽게 전달합니다.
- source_word: יְשַׁלֵּם אַרְבַּעְתָּיִם
  english_pob_choice: must repay ... fourfold
  chosen_korean: 네 배로 갚아야 합니다
  alternatives_korean:
  - 네 배로 배상해야 합니다
  - 네 갑절로 갚아야 합니다
  lexicon: HALOT
  rationale: יְשַׁלֵּם은 단순한 지불보다 배상·원상회복의 뉘앙스가 강합니다. ‘갚아야 합니다’는 판결문체를 살리면서도 현대 한국어로 자연스럽고, ‘네 배’는 ארבעתים의 관용적 의미를 직접 드러냅니다.
- source_word: עֵקֶב אֲשֶׁר ... וְעַל אֲשֶׁר לֹא חָמָל
  english_pob_choice: because ... and because he had no pity
  chosen_korean: 이는 그가 이 일을 했고, 또 불쌍히 여기지 않았기 때문입니다
  alternatives_korean:
  - 이는 그가 이 일을 했고, 또 아끼지 않았기 때문입니다
  - 이는 그가 이 일을 했고, 또 측은히 여기지 않았기 때문입니다
  lexicon: HALOT
  rationale: עֵקֶב אֲשֶׁר와 וְעַל אֲשֶׁר는 판결의 이유를 연결하는 구조이므로 ‘때문입니다’로 옮겼습니다. חמל은 ‘아끼다/불쌍히 여기다/동정하다’의 의미를 가지며, 여기서는 가혹함을 강조하는 ‘불쌍히 여기지 않았다’가 가장 직접적입니다.
theological_decisions:
- issue: 문장 성격과 어조
  chosen_reading: 다윗의 판결 선포를 반영하여 명령형이 아니라 법적·선언적 종결인 ‘갚아야 합니다’로 옮겼습니다.
  alternative_readings:
  - 네 배로 갚으십시오
  - 네 배로 갚을 것입니다
  rationale: 본문은 윤리적 권고가 아니라 재판적 선언이므로, 한국어에서도 판결문 같은 단정형을 유지하는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 사무엘하 12:6의 법정적 맥락
