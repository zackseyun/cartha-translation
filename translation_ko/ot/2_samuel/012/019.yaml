revisions:
- from: 다윗은 자기의 종들이 서로 속삭이는 것을 보고, 그 아이가 죽은 줄 알았습니다. 그래서 다윗이 자기의 종들에게 말했습니다. "아이가 죽었습니까?" 그들이 대답했습니다. "죽었습니다."[a]
  to: 다윗은 신하들이 서로 속삭이는 것을 보고 아이가 죽은 줄 알았습니다. 그래서 다윗은 신하들에게 “아이가 죽었습니까?” 하고 물었습니다. 그들이 “죽었습니다” 하고 대답했습니다.
  rationale: 원문의 관찰–이해–질문–응답의 흐름과 ‘죽었다’라는 상태 질문을 보존했습니다. 궁정 문맥에 맞게 עֲבָדָיו를 ‘신하들’로 다듬고, 한국어 대화 서사에서 자연스러운 발화 동사를 사용했습니다. 히브리어의 단독 응답 מֵת에 대응하는 ‘죽었습니다’는 충분히 자연스러우므로 불필요한 각주를 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:37:04Z'
