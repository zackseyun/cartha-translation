source:
  edition: WLC
  text: וַ/יַּ֣רְא דָּוִ֗ד כִּ֤י עֲבָדָי/ו֙ מִֽתְלַחֲשִׁ֔ים וַ/יָּ֥בֶן דָּוִ֖ד כִּ֣י מֵ֣ת הַ/יָּ֑לֶד וַ/יֹּ֨אמֶר דָּוִ֧ד אֶל עֲבָדָ֛י/ו הֲ/מֵ֥ת הַ/יֶּ֖לֶד וַ/יֹּ֥אמְרוּ מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/019.yaml
  text: When David saw that his servants were whispering[a], David understood that the child was dead. So David said to his servants, “Is the child dead?” And they said, “He is dead.”
  footnotes:
  - marker: a
    text: Hebrew simply reads “dead” in the servants’ reply; English supplies “He is” for natural sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 신하들이 서로 속삭이는 것을 보고 아이가 죽은 줄 알았습니다. 그래서 다윗은 신하들에게 “아이가 죽었습니까?” 하고 물었습니다. 그들이 “죽었습니다” 하고 대답했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 자기의 종들
  alternatives_korean:
  - 자기의 신하들
  - 자기의 하인들
  lexicon: HALOT
  rationale: 왕궁 맥락을 살리면서도 עבד의 기본 의미를 유지하기 위해 ‘종들’을 택했습니다. ‘신하들’은 신분적 뉘앙스가 약하고, ‘하인들’은 지나치게 완곡합니다.
- source_word: מִתְלַחֲשִׁים
  english_pob_choice: were whispering
  chosen_korean: 서로 속삭이는
  alternatives_korean:
  - 서로 소곤거리는
  - 낮은 목소리로 이야기하는
  lexicon: HALOT
  rationale: 사울이 들을 수 없도록 낮춰 말하는 장면의 함의를 살려 ‘속삭이는’으로 옮겼습니다. 현재분사적 진행을 한국어 관용에 맞게 ‘서로 속삭이는’으로 처리했습니다.
- source_word: וַיָּבֶן
  english_pob_choice: understood
  chosen_korean: 알았습니다
  alternatives_korean:
  - 깨달았습니다
  - 분별했습니다
  lexicon: HALOT
  rationale: 관찰된 단서에서 결론에 이르는 인지 과정을 자연스럽게 드러내기 위해 ‘알았습니다’를 사용했습니다. ‘깨달았습니다’도 가능하지만 여기서는 서술의 직접성이 더 중요합니다.
- source_word: הֲמֵת הַיֶּלֶד / מֵת
  english_pob_choice: Is the child dead? / He is dead.
  chosen_korean: 아이가 죽었습니까? … 죽었습니다.
  alternatives_korean:
  - 아이가 죽었습니까? … 아이는 죽었습니다.
  - 아이가 죽었습니까? … 죽었어요.
  lexicon: HALOT
  rationale: 히브리어는 대답에서 단순히 ‘죽었습니다’만 두므로, 한국어에서도 응답을 간결하게 유지했습니다. 직접 질문은 상태를 묻는 형식을 살려 ‘죽었습니까?’로 옮겼습니다.
theological_decisions:
- issue: 왕궁 종들에 대한 호칭과 사회적 뉘앙스
  chosen_reading: ‘종들’로 옮겨, 신분적 관계를 흐리지 않되 현대 한국어에서 읽히는 자연스러움을 유지했습니다.
  alternative_readings:
  - 신하들
  - 하인들
  rationale: 본문은 단순한 고용 관계보다 왕의 소속 인물들을 가리키므로, 의미를 완화하지 않는 쪽이 원문에 가깝습니다.
  doctrine_reference: 사회적 호칭의 원문 보존 원칙
