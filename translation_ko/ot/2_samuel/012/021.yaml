id: 2SA.12.21
reference: 2 Samuel 12:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ עֲבָדָי/ו֙ אֵלָ֔י/ו מָֽה הַ/דָּבָ֥ר הַ/זֶּ֖ה אֲשֶׁ֣ר עָשִׂ֑יתָה בַּ/עֲב֞וּר הַ/יֶּ֤לֶד חַי֙ צַ֣מְתָּ וַ/תֵּ֔בְךְּ וְ/כַֽ/אֲשֶׁר֙ מֵ֣ת הַ/יֶּ֔לֶד קַ֖מְתָּ וַ/תֹּ֥אכַל לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/021.yaml
  text: Then his servants said to him[a], “What is this thing that you have done? While the child was alive, you fasted and wept; but when the child died, you got up and ate bread.”
  footnotes:
  - marker: a
    text: Hebrew 'ate bread,' an idiom for taking food or eating a meal.
    reason: cultural_note
translation:
  language: ko
  text: 그의 종들이 그에게 말했습니다. 「이 일이 무엇입니까? 아이가 살아 있을 때에는 금식하시고 우셨는데, 아이가 죽자 일어나서 빵을 드셨습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘빵을 먹다’는 식사를 하다라는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들
  alternatives_korean:
  - 그의 시종들
  - 그의 하인들
  lexicon: HALOT
  rationale: 왕궁 문맥에서 문맥상 가장 자연스러운 대응은 ‘종들’이며, 단순한 고용인보다 주종 관계가 드러납니다.
- source_word: מָה הַדָּבָר הַזֶּה
  english_pob_choice: What is this thing
  chosen_korean: 이 일이 무엇입니까?
  alternatives_korean:
  - 이것이 무슨 일입니까?
  - 왜 이렇게 하셨습니까?
  lexicon: HALOT
  rationale: 히브리어의 구체적 놀람을 살리면서도, 현대 한국어에서는 ‘무슨 일입니까’가 자연스럽고 정중합니다.
- source_word: בַּעֲבוּר הַיֶּלֶד חַי
  english_pob_choice: While the child was alive
  chosen_korean: 아이가 살아 있을 때에는
  alternatives_korean:
  - 아이가 살아 있는 동안에는
  - 아이의 생존 중에는
  lexicon: HALOT
  rationale: 문맥상 목적이 아니라 시간적 대조이므로, ‘~할 때에는’로 옮겨 대비를 분명히 했습니다.
- source_word: וַתֹּאכַל לָחֶם
  english_pob_choice: and ate bread
  chosen_korean: 빵을 드셨습니다
  alternatives_korean:
  - 빵을 드셨습니다
  - 먹을 것을 드셨습니다
  - 식을 드셨습니다
  lexicon: HALOT
  rationale: 히브리어 직역의 ‘빵’은 식사 일반을 뜻하는 관용이지만, POB의 영어가 이를 유지하므로 한국어도 구체적 이미지를 살려 ‘빵’을 택했습니다. 다만 왕에게는 존대 동사 ‘드셨습니다’를 사용했습니다.
theological_decisions:
- issue: 다윗을 향한 종들의 발화에서 존대와 직접 인용의 처리
  chosen_reading: 직접 인용은 유지하되, 한국어 서술은 높임을 사용해 왕에게 말하는 상황을 반영했습니다.
  alternative_readings:
  - 전부 평서형으로 처리
  - 왕호칭 없이 중립적으로 번역
  rationale: 원문은 단순 서술이지만, 한국어 공역에서는 왕에게 말하는 화용적 예의를 드러내는 것이 자연스럽습니다.
  doctrine_reference: 문맥 기반 화용론
