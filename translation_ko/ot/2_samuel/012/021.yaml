    issue: 첫 질문에서 ‘당신이 하신’이 누락됨
    rationale: מָה הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָה는 직역하면 ‘당신이 하신 이 일은 무엇입니까?’입니다. 초안은 관계절을 생략하여 종들의 질문이 다윗의 행위를 지목한다는 뜻을 충분히 전달하지 못합니다.
  - severity: low
    issue: 각주 문장의 문법 오류 및 각주 위치
    rationale: ‘식사를 하다라는’은 ‘식사를 한다는’으로 고쳐야 합니다. 또한 관용 표현을 설명하는 각주는 ‘빵을 드셨습니다’ 바로 뒤에 두는 편이 지시 대상이 분명합니다.
