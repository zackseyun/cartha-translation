  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 첫 질문 「이 일이 무엇입니까?」는 히브리어 אֲשֶׁר עָשִׂיתָה(‘당신이 하신’)를 빠뜨립니다. 나머지 시간적 대조, 금식과 울음, 아이의 죽음 뒤 일어나 먹는 순서는 원문에 충실합니다.
  naturalness: 왕에게 말하는 문맥에 맞춘 합쇼체는 자연스럽습니다. 다만 「하신 이 일은 무엇입니까?」로 하면 원문의 행위 주체를 살리면서도 한국어에서 자연스럽습니다. 각주 문장은 ‘식사를 하다라는’의 문법을 바로잡아야 합니다.
  terminology: ‘종들’은 왕궁 문맥에서 가능한 번역이며, ‘아이’도 해당 아기의 문맥에 적절합니다. לֶחֶם의 구체적 표현인 ‘빵’을 유지하되, 일반적으로 식사를 뜻할 수 있다는 각주를 붙이는 방식도 적절합니다.
  issues:
