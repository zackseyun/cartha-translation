id: 2SA.12.10
reference: 2 Samuel 12:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹא תָס֥וּר חֶ֛רֶב מִ/בֵּיתְ/ךָ֖ עַד עוֹלָ֑ם עֵ֚קֶב כִּ֣י בְזִתָ֔/נִי וַ/תִּקַּ֗ח אֶת אֵ֨שֶׁת֙ אוּרִיָּ֣ה הַ/חִתִּ֔י לִ/הְי֥וֹת לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/010.yaml
  text: Now therefore[a], the sword shall never depart from your house[b], because you have despised me and have taken the wife of Uriah the Hittite to be your wife.
  footnotes:
  - marker: a
    text: Or 'from your household' or 'from your dynasty'; Hebrew 'house' can include both family and royal line.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'despised me'; the offense against Uriah and his wife is presented as contempt toward God himself.
    reason: cross_reference
translation:
  language: ko
  text: 그러므로 이제 네 집[a]에서 칼이 영원히 떠나지 않을 것입니다. 이는 네가 나를 멸시하고[b], 헷 사람 우리야의 아내를 네 아내로 삼았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네 집’은 가정, 가문, 왕조를 모두 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직접적으로 ‘나를 멸시했다’고 말합니다. 여기서 ‘나’는 하나님을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now therefore
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제
  - 그러므로
  lexicon: HALOT
  rationale: 판결의 흐름을 잇는 접속성과 현재 전환을 함께 살리기 위해 ‘그러므로 이제’로 옮겼습니다.
- source_word: לֹא תָסוּר חֶרֶב
  english_pob_choice: the sword shall never depart
  chosen_korean: 칼이 영원히 떠나지 않을 것입니다
  alternatives_korean:
  - 칼이 떠나지 않을 것입니다
  - 칼이 결코 떠나지 않을 것입니다
  lexicon: HALOT
  rationale: חֶרֶב을 한국어에서 자연스러운 ‘칼’로 옮기되, 지속적 심판의 뉘앙스를 ‘영원히 떠나지’로 드러냈습니다.
- source_word: מִבֵּיתְךָ
  english_pob_choice: from your house
  chosen_korean: 네 집에서
  alternatives_korean:
  - 네 집에서
  - 네 가문에서
  - 네 집안에서
  lexicon: HALOT
  rationale: 히브리어 ‘집’의 범위를 살리면서 한국어에서 가장 직접적인 대응인 ‘네 집’으로 두어 가문·왕조까지 포괄할 여지를 남겼습니다.
- source_word: בְזִתָנִי
  english_pob_choice: you have despised me
  chosen_korean: 네가 나를 멸시하고
  alternatives_korean:
  - 네가 나를 업신여기고
  - 네가 나를 경멸하고
  lexicon: HALOT
  rationale: בזה의 핵심 의미를 ‘멸시하다’로 옮겨 하나님을 향한 직접적 모욕을 보존했습니다.
- source_word: אֵשֶׁת אוּרִיָּה הַחִתִּי
  english_pob_choice: the wife of Uriah the Hittite
  chosen_korean: 헷 사람 우리야의 아내
  alternatives_korean:
  - 헷 사람 우리야의 아내
  - 우리야 헷 사람의 아내
  lexicon: HALOT
  rationale: 관계가 이미 우리야에게 속한 아내였음을 분명히 하기 위해 소유격 구조를 살렸고, 고유명사 ‘우리야’와 통용되는 ‘헷 사람’을 사용했습니다.
- source_word: לְהִיוֹת לְךָ לְאִשָּׁה
  english_pob_choice: to be your wife
  chosen_korean: 네 아내로 삼았기 때문입니다
  alternatives_korean:
  - 네 아내가 되게 했기 때문입니다
  - 네 아내가 되도록 했기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 결혼 귀결 표현을 한국어 관용에 맞게 ‘아내로 삼다’로 옮기되, 취득·취함의 행위가 드러나도록 했습니다.
theological_decisions:
- issue: ‘나를 멸시하고’의 직접 대상
  chosen_reading: 하나님 자신이 직접 모욕의 대상이 되었다는 표현을 그대로 유지했습니다.
  alternative_readings:
  - 네가 주의 말씀을 멸시하고
  - 네가 나를 업신여기고
  rationale: 히브리어는 1인칭 단수 목적어를 직접 사용하므로, 해석을 풀어 쓰지 않고 하나님께 향한 죄의 본질을 드러내는 표현을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 죄의 신학적 무게를 해소하지 않고 유지
- issue: ‘네 집’의 범위
  chosen_reading: 문맥상 가정과 왕조를 모두 열어 두는 ‘네 집’으로 유지했습니다.
  alternative_readings:
  - 네 가문
  - 네 왕조
  - 네 집안
  rationale: 히브리어 בַּיִת의 범위를 좁히지 않고, 독자가 가정적·왕조적 심판을 함께 읽도록 남겨 두었습니다.
  doctrine_reference: 문맥의 다층적 의미 보존
