  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶתְּנָ֨/ה לְ/ךָ֜ אֶת בֵּ֣ית אֲדֹנֶ֗י/ךָ וְ/אֶת נְשֵׁ֤י אֲדֹנֶ֨י/ךָ֙ בְּ/חֵיקֶ֔/ךָ וָ/אֶתְּנָ֣/ה לְ/ךָ֔ אֶת בֵּ֥ית יִשְׂרָאֵ֖ל וִֽ/יהוּדָ֑ה וְ/אִ֨ם מְעָ֔ט וְ/אֹסִ֥פָה לְּ/ךָ֖ כָּ/הֵ֥נָּה וְ/כָ/הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/008.yaml
  text: And I gave you your master's house and your master's wives into your bosom[a], and I gave you the house of Israel and Judah; and if that had been too little[b], I would have added to you such and such things.
  footnotes:
  - marker: a
    text: Or 'into your bosom' or 'into your lap.' The Hebrew idiom conveys intimate possession or reception.
    reason: lexical_alternative
  - marker: b
    text: Or 'such things and more.' The Hebrew expression is an idiom for adding still more of the same kind.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 네 주인의 집과 네 주인의 아내들을 네 품에 주었고, 또 이스라엘의 집과 유다의 집도 네게 주었으며, 그것이 적다고 여겨졌더라면 내가 네게 이런 것들과 또 이런 것들을 더했을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘가슴/품’이지만 여기서는 소유와 밀착된 수용을 뜻합니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘이런 것들과 이런 것들’입니다. 같은 종류의 것을 더 추가한다는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  english_pob_choice: I gave
  chosen_korean: 내가 … 주었고
  alternatives_korean:
  - 내가 … 주었습니다
  - 내가 … 주었으며
  lexicon: HALOT
  rationale: 서술적 과거를 자연스러운 합쇼체로 옮기되, 이어지는 병렬 구조를 위해 ‘주었고/주었으며’로 연결했습니다.
- source_word: בֵּית אֲדֹנֶיךָ
  english_pob_choice: your master's house
  chosen_korean: 네 주인의 집
  alternatives_korean:
  - 네 주인의 가문
  - 네 주인의 집안
  - 네 주인의 왕실
  lexicon: HALOT
  rationale: 히브리어 בַּיִת의 구체적 ‘집’과 더 넓은 ‘가문/왕실’ 의미를 함께 열어 두기 위해 직역에 가까운 ‘집’을 택했습니다.
- source_word: בְּחֵיקֶךָ
  english_pob_choice: into your bosom
  chosen_korean: 네 품에
  alternatives_korean:
  - 네 품 안에
  - 네 가슴에
  - 네 무릎에
  lexicon: HALOT
  rationale: ‘가슴/품/무릎’의 관용적 의미를 현대 한국어에서 가장 자연스럽게 전달하는 표현으로 ‘네 품에’를 선택했습니다. 사적 소유와 밀착된 수용의 뉘앙스를 살립니다.
- source_word: וְכָהֵנָּה־־־־
  english_pob_choice: such and such things
  chosen_korean: 이런 것들과 또 이런 것들
  alternatives_korean:
  - 이런 것들과 더 많은 것들
  - 이런 것들 그 이상
  - 이런저런 것들
  lexicon: HALOT
  rationale: 정체를 특정하지 않는 누적적 관용구를 한국어에서 과도하게 구체화하지 않도록, ‘이런 것들… 또 이런 것들’로 여운과 증감을 함께 살렸습니다.
theological_decisions:
- issue: ‘네 주인의 아내들’을 어떻게 옮길지
  chosen_reading: 원문의 왕위 승계 문맥을 따라 ‘네 주인의 아내들’을 그대로 유지하되, 이를 승인이나 도덕적 평가로 풀어 쓰지 않았습니다.
  alternative_readings:
  - ‘네 주인의 후궁들’로 의역
  - ‘네 주인의 여자들을 네 돌봄 아래’로 완화
  rationale: 본문은 하나님이 다윗에게 이전 왕가의 소유와 권속을 주셨다고 말할 뿐, 그 행위를 신학적으로 해설하지 않습니다. 문장의 긴장을 보존하는 것이 본문 충실도에 맞습니다.
  doctrine_reference: 본문의 서술과 도덕적 평가는 구분해서 유지
