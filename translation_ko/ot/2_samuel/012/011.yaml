  lexicon: HALOT
  rationale: 예언 선포 공식의 형식을 살리면서, 프로젝트 기본값에 따라 신명은 야훼로 옮겼습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold, I am
  chosen_korean: 보십시오, 나는
