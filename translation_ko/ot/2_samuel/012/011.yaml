base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/011.yaml
  text: 'Thus says Yahweh: Behold[a], I am raising up disaster against you from your own house, and I will take your wives before your eyes and give them to your neighbor[b], and he will lie with your wives in the sight of this sun.'
  footnotes:
  - marker: a
    text: Or 'neighbor.' The Hebrew רֵעַ can mean 'neighbor,' 'companion,' or 'associate.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in the sight of this sun,' that is, openly and publicly.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 보십시오, 나는 네 집에서 네게 재앙을 일으키고, 네 아내들을 네 눈앞에서 빼앗아 네 이웃에게 주겠으며, 그는 해가 비치는 이 앞에서 네 아내들과 함께 누울 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네 이웃’은 히브리어 רֵעַ의 일반적 의미를 따른 것입니다. 문맥에 따라 ‘동료’, ‘동반자’의 뜻도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이 태양의 눈앞에서’입니다. 곧 공개적으로, 사람들 앞에서라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주님께서 이렇게 말씀하십니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언 선포 공식의 형식을 살리면서, 프로젝트 기본값에 따라 신명은 야훼로 옮겼습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold, I am
  chosen_korean: 보십시오, 나는
  alternatives_korean:
  - 보라, 나는
  - 내가 보십시오
  lexicon: HALOT
  rationale: 주의 환기 기능을 살리되 현대 한국어에서 자연스럽게 들리도록 감탄사적 호격으로 옮겼습니다.
- source_word: מֵקִים ... רָעָה
  english_pob_choice: am raising up disaster
  chosen_korean: 재앙을 일으키고
  alternatives_korean:
  - 재난을 일으키고
  - 화를 일으키고
  - 악을 일으키고
  lexicon: HALOT
  rationale: 여기서 רָעָה는 도덕적 악이 아니라 심판으로서의 재앙이므로, 하나님이 악을 행하신다는 인상을 피하면서도 행위성을 유지했습니다.
- source_word: לְרֵעֶיךָ
  english_pob_choice: to your neighbor
  chosen_korean: 네 이웃에게
  alternatives_korean:
  - 네 동료에게
  - 네 동반자에게
  - 네 가까운 사람에게
  lexicon: HALOT
  rationale: רֵעַ의 기본 의미를 따라 ‘이웃’으로 옮기되, 다윗의 가정 내에서 벌어질 공개적 수치라는 맥락을 해치지 않도록 간결하게 유지했습니다.
- source_word: לְעֵינֵי הַשֶּׁמֶשׁ הַזֹּאת
  english_pob_choice: in the sight of this sun
  chosen_korean: 해가 비치는 이 앞에서
  alternatives_korean:
  - 이 태양 아래에서
  - 이 해의 눈앞에서
  - 이 해가 보는 앞에서
  lexicon: HALOT
  rationale: 직역성이 높은 이미지인 ‘이 태양 앞에서’를 살리면서도 한국어 어순에 맞춰 ‘해가 비치는’으로 풀었습니다.
theological_decisions:
- issue: ‘재앙’과 하나님의 주권적 심판
  chosen_reading: 하나님이 다윗 집안에 심판의 재앙을 일으키시는 것으로 읽었습니다.
  alternative_readings:
  - 하나님이 악 자체를 만드시는 것으로 읽기
  - 단순한 정치적 불행으로만 읽기
  rationale: 문맥상 רָעָה는 도덕적 악이 아니라 심판으로서의 재난이며, 번역은 하나님의 주권적 심판과 도덕적 무오성을 함께 드러내야 합니다.
  doctrine_reference: 하나님의 거룩하심과 심판의 정당성; 원어 우선 번역 원칙
