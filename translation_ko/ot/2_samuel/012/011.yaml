  - 악을 일으키고
  lexicon: HALOT
  rationale: 여기서 רָעָה는 도덕적 악이 아니라 심판으로서의 재앙이므로, 하나님이 악을 행하신다는 인상을 피하면서도 행위성을 유지했습니다.
- source_word: לְרֵעֶיךָ
  english_pob_choice: to your neighbor
  chosen_korean: 네 이웃에게
  alternatives_korean:
  - 네 동료에게
  - 네 동반자에게
  - 네 가까운 사람에게
  lexicon: HALOT
  rationale: רֵעַ의 기본 의미를 따라 ‘이웃’으로 옮기되, 다윗의 가정 내에서 벌어질 공개적 수치라는 맥락을 해치지 않도록 간결하게 유지했습니다.
- source_word: לְעֵינֵי הַשֶּׁמֶשׁ הַזֹּאת
  english_pob_choice: in the sight of this sun
  chosen_korean: 해가 비치는 이 앞에서
  alternatives_korean:
  - 이 태양 아래에서
  - 이 해의 눈앞에서
  - 이 해가 보는 앞에서
  lexicon: HALOT
  rationale: 직역성이 높은 이미지인 ‘이 태양 앞에서’를 살리면서도 한국어 어순에 맞춰 ‘해가 비치는’으로 풀었습니다.
theological_decisions:
- issue: ‘재앙’과 하나님의 주권적 심판
  chosen_reading: 하나님이 다윗 집안에 심판의 재앙을 일으키시는 것으로 읽었습니다.
  alternative_readings:
  - 하나님이 악 자체를 만드시는 것으로 읽기
  - 단순한 정치적 불행으로만 읽기
  rationale: 문맥상 רָעָה는 도덕적 악이 아니라 심판으로서의 재난이며, 번역은 하나님의 주권적 심판과 도덕적 무오성을 함께 드러내야 합니다.
  doctrine_reference: 하나님의 거룩하심과 심판의 정당성; 원어 우선 번역 원칙
