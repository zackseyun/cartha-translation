revisions:
- from: 야훼께서 이렇게 말씀하십니다. 보십시오, 나는 네 집에서 네게 재앙을 일으키고, 네 아내들을 네 눈앞에서 빼앗아 네 이웃에게 주겠으며, 그는 해가 비치는 이 앞에서 네 아내들과 함께 누울 것입니다.[a][b]
  to: 야훼께서 이렇게 말씀하십니다. 보십시오, 내가 네 집안에서 네게 재앙을 일으키고, 네 아내들을 네 눈앞에서 데려가 네 동료[a]에게 주겠다. 그러면 그가 이 해가 보는 앞에서[b] 네 아내들과 함께 누울 것입니다.
  rationale: The revision removes added force from the verb for taking the wives, clarifies that the disaster arises within David’s household, repairs the Korean rendering of the solar image while preserving its concreteness, and relocates each footnote anchor to its referent. No doctrinal inference beyond the source text has been introduced.
