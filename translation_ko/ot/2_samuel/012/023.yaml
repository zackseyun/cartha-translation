  source_fidelity: 전반적으로 히브리어의 질문과 ‘그에게로 감’/‘내게로 돌아오지 않음’의 대조를 잘 반영합니다. 그러나 ‘나는 그에게로 가고 있지만’은 한국어에서 현재 진행 중인 이동과 역접의 뜻을 강하게 만들며, 히브리어 분사가 이 문맥에서 나타내는 확실한 미래의 뜻과 뒤 절의 미래 표현에 충분히 맞지 않습니다.
