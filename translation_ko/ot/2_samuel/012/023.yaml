source:
  edition: WLC
  text: וְ/עַתָּ֣ה מֵ֗ת לָ֤/מָּה זֶּה֙ אֲנִ֣י צָ֔ם הַ/אוּכַ֥ל לַ/הֲשִׁיב֖/וֹ ע֑וֹד אֲנִי֙ הֹלֵ֣ךְ אֵלָ֔י/ו וְ/ה֖וּא לֹֽא יָשׁ֥וּב אֵלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/023.yaml
  text: But now he is dead. Why should I fast any longer? Can I bring him back again? I am going to him[a], but he will not return to me.
  footnotes:
  - marker: a
    text: Or, 'I will go to him.' The Hebrew participle can express a certain future.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이제 그는 죽었습니다. 내가 왜 더 금식해야 하겠습니까? 내가 그를 다시 데려올 수 있겠습니까? 나는 그에게로 가고 있지만[a], 그는 내게로 돌아오지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그에게로 갈 것이다.’ 히브리어 분사는 특정한 미래를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: But now
  chosen_korean: 그러나 이제
  alternatives_korean:
  - 그리고 이제
  - 이제
  lexicon: HALOT
  rationale: 앞선 상황과의 대조를 드러내는 전환어이므로, 문맥상 역접을 분명히 하는 ‘그러나 이제’가 적절합니다.
- source_word: מֵת
  english_pob_choice: he is dead
  chosen_korean: 그는 죽었습니다
  alternatives_korean:
  - 그는 죽어 있습니다
  - 그는 죽은 상태입니다
  lexicon: HALOT
  rationale: 히브리어의 상태술적 표현을 자연스러운 한국어 현재 서술로 옮겨, 지금 죽어 있는 현실을 직접적으로 드러냅니다.
- source_word: לָמָּה זֶּה
  english_pob_choice: Why should I
  chosen_korean: 내가 왜 더
  alternatives_korean:
  - 왜 내가
  - 내가 왜
  lexicon: HALOT
  rationale: 수사적 질문의 어감을 살리기 위해 직역보다 담화상 자연스러운 ‘내가 왜 더’로 옮겼습니다.
- source_word: עוֹד
  english_pob_choice: any longer
  chosen_korean: 더
  alternatives_korean:
  - 여전히
  - 더 이상
  lexicon: HALOT
  rationale: 금식의 지속 여부를 묻는 맥락에서 ‘더’가 간결하게 지속 중단의 뉘앙스를 전달합니다.
- source_word: לַהֲשִׁיבוֹ עוֹד
  english_pob_choice: bring him back again
  chosen_korean: 그를 다시 데려올
  alternatives_korean:
  - 그를 다시 돌려보낼
  - 그를 다시 돌아오게 할
  lexicon: HALOT
  rationale: 동사 שוב의 사역형을 죽은 아이를 다시 생명으로 돌려보내는 의미로 이해해, 과도한 해석 없이 ‘다시 데려올’로 옮겼습니다.
- source_word: הֹלֵךְ אֵלָיו
  english_pob_choice: I am going to him
  chosen_korean: 나는 그에게로 가고 있지만
  alternatives_korean:
  - 나는 그에게로 갈 것이지만
  - 나는 그에게로 갑니다
  lexicon: HALOT
  rationale: 분사형이 지닌 확실한 미래성을 한국어 진행형으로 과도하게 굳히지 않되, POB의 각주가 지적한 ‘확실한 미래’ 가능성을 반영할 수 있게 했습니다.
- source_word: לֹא יָשׁוּב אֵלַי
  english_pob_choice: he will not return to me
  chosen_korean: 그는 내게로 돌아오지 않을 것입니다
  alternatives_korean:
  - 그는 내게로 돌아오지 못할 것입니다
  - 그는 내게로 돌아오지 않습니다
  lexicon: HALOT
  rationale: שוב의 기본 의미를 살려 ‘돌아오다’로 일관시켜 앞의 ‘다시 데려올’과 어휘 연결을 유지했습니다.
theological_decisions:
- issue: 다윗의 말이 사후에 대한 구체적 교리를 얼마나 함축하는지
  chosen_reading: ‘나는 그에게로 가고 있지만’이라고 직역에 가깝게 두고, 그 ‘감다’의 성격을 단정하지 않았습니다.
  alternative_readings:
  - 내가 죽어 그에게로 갈 것입니다
  - 내세에서 그를 다시 만나게 될 것입니다
  rationale: 히브리어는 다윗이 그 아이에게로 ‘간다’는 말과 아이가 ‘돌아오지 않는다’는 말만 제시하므로, 중간상태나 유아 구원 같은 교리를 번역이 앞서 규정하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
