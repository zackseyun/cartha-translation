  terminology: ‘금식하다’, ‘다시 데려오다’, ‘돌아오다’는 적절합니다. ‘그에게로 갈 것이다’는 사후 상태나 재회를 구체적으로 규정하지 않아 신학적 모호성을 보존합니다.
