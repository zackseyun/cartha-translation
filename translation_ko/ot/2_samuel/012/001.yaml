  yaml_path: translation/ot/2_samuel/012/001.yaml
  text: Then Yahweh sent Nathan to David. He came to him and said to him[a], “There were two men in one city, one rich and one poor.”
  footnotes:
  - marker: a
    text: Or 'There lived two men in one city.' The Hebrew more literally says, 'There were two men in one city.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 나단을 다윗에게 보내셨습니다. 그가 그에게 와서 말했습니다[a], “한 도시에 두 사람이 있었는데, 하나는 부자이고 하나는 가난했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 도시에 두 사람이 살고 있었다.’ 히브리어는 더 문자적으로 ‘한 도시에 두 사람이 있었다’고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח יְהוָה
  english_pob_choice: Then Yahweh sent
  chosen_korean: 그때 야훼께서 … 보내셨습니다
  alternatives_korean:
  - 야훼께서 … 파견하셨습니다
  - 야훼께서 … 보냈습니다
  lexicon: HALOT
  rationale: וַיִּשְׁלַח의 서사적 완료를 자연스러운 과거로 옮기되, יְהוָה는 POB 원칙에 따라 ‘야훼’로 살렸습니다.
- source_word: אֶל דָּוִד / וַיָּבֹא אֵלָי/ו
  english_pob_choice: to David / He came to him
  chosen_korean: 다윗에게 / 그가 그에게 와서
  alternatives_korean:
  - 다윗을 향하여 / 그가 그에게 갔습니다
  - 다윗에게 / 그가 그에게 다가와서
  lexicon: HALOT
  rationale: אֶל은 목적지 표지로 ‘에게’를 쓰는 것이 가장 투명하고, בוא + אֶל은 ‘오다’의 방향을 살려 ‘와서’로 옮겼습니다.
- source_word: שְׁנֵי אֲנָשִׁים הָיוּ בְּעִיר אֶחָת
  english_pob_choice: There were two men in one city
  chosen_korean: 한 도시에 두 사람이 있었는데
  alternatives_korean:
  - 한 도시에 두 남자가 있었습니다
  - 어느 도시에 두 사람이 살고 있었는데
  lexicon: HALOT
  rationale: POB의 각주가 밝히듯 히브리어는 직역하면 ‘한 도시에 두 사람이 있었다’이므로, 존재문 구조를 살려 문학적으로 자연한 한국어로 옮겼습니다.
- source_word: אֶחָד עָשִׁיר וְאֶחָד רָאשׁ
  english_pob_choice: one rich and one poor
  chosen_korean: 하나는 부자이고 하나는 가난했습니다
  alternatives_korean:
  - 하나는 부유하고 하나는 가난했습니다
  - 하나는 부자였고 하나는 빈곤했습니다
  lexicon: HALOT
  rationale: עָשִׁיר는 ‘부자’, רָאשׁ는 대조를 분명히 하는 ‘가난한’으로 옮겨 서술적 병렬을 유지했습니다.
theological_decisions:
