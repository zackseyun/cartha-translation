translation:
  language: ko
  text: 그때 야훼께서 나단을 다윗에게 보내셨습니다. 나단은 다윗에게 와서 그에게 말했습니다. “한 도시에 두 사람이 있었습니다[a]. 한 사람은 부자였고, 다른 한 사람은 가난했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 도시에 두 사람이 살고 있었다.’ 히브리어는 더 문자적으로 ‘한 도시에 두 사람이 있었다’고 말합니다.
    reason: lexical_alternative
lexical_decisions:
