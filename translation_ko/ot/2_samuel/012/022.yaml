  lexicon: HALOT
  rationale: צום은 ‘금식’이 가장 직접적이며, בכה는 장중한 맥락에 맞게 ‘울었습니다’로 옮겼습니다.
- source_word: מִי יוֹדֵעַ
  english_pob_choice: Who knows?
  chosen_korean: 누가 알겠습니까?
  alternatives_korean:
  - 누가 압니까?
  - 누가 알 수 있겠습니까?
  lexicon: HALOT
  rationale: 히브리어 관용구의 불확실성을 현대 한국어 의문문으로 자연스럽게 살렸습니다.
- source_word: יְחָנֵּנִי יְהוָה
  english_pob_choice: Yahweh may be gracious to me
  chosen_korean: 야훼께서 내게 은혜를 베푸실지
  alternatives_korean:
  - 야훼께서 내게 은혜를 베푸실지도
  - 주님께서 내게 은혜를 베푸실지
  lexicon: HALOT
  rationale: חנן의 핵심인 ‘은혜/호의’를 유지하고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וְחַי הַיָּלֶד
  english_pob_choice: and the child may live
  chosen_korean: 아이가 살지도 모른다
  alternatives_korean:
  - 아이가 살 수 있을지도 모른다
  - 아이가 살아날지도 모른다
  lexicon: HALOT
  rationale: 미래의 가능성과 소망을 과도한 확정 없이 표현하기 위해 ‘살지도 모른다’로 옮겼습니다.
theological_decisions:
- issue: 다윗의 기대를 확정으로 만들지 않는 표현
  chosen_reading: ‘야훼께서 내게 은혜를 베푸실지, 아이가 살지도 모른다’
  alternative_readings:
  - ‘야훼께서 내게 은혜를 베푸시고 아이가 살 것이다’
  - ‘야훼께서 내게 은혜를 베푸실 것이다’
  rationale: 히브리어는 ‘누가 알겠습니까?’로 시작하는 불확실한 희망을 담고 있으므로, 한국어도 가능성과 소망을 유지하고 확정적 단언은 피했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
