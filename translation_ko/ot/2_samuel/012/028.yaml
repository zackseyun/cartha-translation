id: 2SA.12.28
reference: 2 Samuel 12:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אֱסֹף֙ אֶת יֶ֣תֶר הָ/עָ֔ם וַ/חֲנֵ֥ה עַל הָ/עִ֖יר וְ/לָכְדָ֑/הּ פֶּן אֶלְכֹּ֤ד אֲנִי֙ אֶת הָ/עִ֔יר וְ/נִקְרָ֥א שְׁמִ֖/י עָלֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/028.yaml
  text: Now gather the rest of the troops[a], camp against the city, and capture it, lest I capture the city and it be called by my name.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'and it be called by my name.' The Hebrew literally says 'my name be called over it,' expressing that the honor for taking the city would be attributed to Joab.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 남은 군사들을 모으고, 그 성읍을 향하여 진을 치고, 그것을 점령하십시오. 그렇지 않으면 제가 그 성읍을 점령하여 제 이름이 그 위에 불리게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 이름이 그 위에 불리다’는 관용구로, 성읍 정복의 영예가 정복자에게 귀속된다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 담화 전환과 긴급한 지시를 자연스럽게 드러내는 현대적 표현으로 옮겼습니다.
- source_word: יֶתֶר הָעָם
  english_pob_choice: the rest of the troops
  chosen_korean: 남은 군사들
  alternatives_korean:
  - 나머지 백성
  - 남은 병력
  lexicon: HALOT
  rationale: 전투·공성 문맥이므로 일반적인 '백성'보다 군사적 의미를 분명히 하는 '군사들'이 더 적절합니다.
- source_word: וַחֲנֵה עַל הָעִיר
  english_pob_choice: camp against the city
  chosen_korean: 그 성읍을 향하여 진을 치고
  alternatives_korean:
  - 그 성읍을 대하여 진을 치고
  - 그 성읍을 포위하고
  lexicon: HALOT
  rationale: חנה의 기본 뜻인 '진을 치다'를 살리면서, נגד/עַל의 대치 방향성을 한국어로 자연스럽게 표현했습니다.
- source_word: וְלָכְדָהּ
  english_pob_choice: and capture it
  chosen_korean: 그것을 점령하십시오
  alternatives_korean:
  - 그것을 포획하십시오
  - 그것을 차지하십시오
  lexicon: HALOT
  rationale: 전쟁 서술에서 לכד는 단순한 '잡다'보다 성읍을 '점령하다'가 더 정확하고 자연스럽습니다.
- source_word: וְנִקְרָא שְׁמִי עָלֶיהָ
  english_pob_choice: and it be called by my name
  chosen_korean: 제 이름이 그 위에 불리게 될 것입니다
  alternatives_korean:
  - 그것이 제 이름으로 불리게 될 것입니다
  - 그 위에 제 이름이 붙게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구인 '이름이 그 위에 불리다'를 살려, 정복의 영예가 누구에게 돌아가는지 드러내는 직역적 표현을 택했습니다.
theological_decisions:
- issue: 명령문과 추정적 결과절의 문체
  chosen_reading: 명령은 존대형으로, 마지막 결과절은 말하는 인물의 자기 언급을 유지해 서술했습니다.
  alternative_readings:
  - 전 구절을 평서형으로 처리
  - 직접 명령을 반말체로 옮김
  rationale: 원문의 긴급한 지시와 경고를 현대 한국어 합쇼체로 재현하되, 서술 인물의 발화를 과도하게 완화하지 않도록 했습니다.
  doctrine_reference: 서사 본문 문체 재현 원칙
