  chosen_reading: 명령은 존대형으로, 마지막 결과절은 말하는 인물의 자기 언급을 유지해 서술했습니다.
  alternative_readings:
  - 전 구절을 평서형으로 처리
  - 직접 명령을 반말체로 옮김
  rationale: 원문의 긴급한 지시와 경고를 현대 한국어 합쇼체로 재현하되, 서술 인물의 발화를 과도하게 완화하지 않도록 했습니다.
  doctrine_reference: 서사 본문 문체 재현 원칙
