  text: וְ/עַתָּ֗ה אֱסֹף֙ אֶת יֶ֣תֶר הָ/עָ֔ם וַ/חֲנֵ֥ה עַל הָ/עִ֖יר וְ/לָכְדָ֑/הּ פֶּן אֶלְכֹּ֤ד אֲנִי֙ אֶת הָ/עִ֔יר וְ/נִקְרָ֥א שְׁמִ֖/י עָלֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/028.yaml
  text: Now gather the rest of the troops[a], camp against the city, and capture it, lest I capture the city and it be called by my name.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'and it be called by my name.' The Hebrew literally says 'my name be called over it,' expressing that the honor for taking the city would be attributed to Joab.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 남은 군사들을 모으고 그 성읍을 향해 진을 치고 점령하십시오. 그렇지 않으면 제가 그 성읍을 점령하여 제 이름이 그 성읍에 붙게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 이름이 그 위에 불리다’라고 합니다. 이는 성읍을 정복한 영예가 정복자에게 돌아간다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
