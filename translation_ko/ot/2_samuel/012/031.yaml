  lexicon: HALOT
  rationale: 문맥상 살해보다 강제노동을 가리키는 해석을 본문에 반영했으며, 히브리어의 난점을 고려해 직역보다 의미 중심으로 옮겼습니다.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
