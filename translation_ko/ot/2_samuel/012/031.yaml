  lexicon: HALOT
  rationale: 서술 흐름을 간결하게 마무리하는 표준 서술 표현입니다.
theological_decisions:
- issue: 암몬 포로 처리의 해석을 어떻게 본문에 반영할 것인가
  chosen_reading: 강제노동 해석을 본문에 두되, 본문의 난점은 번역 안에서 과도하게 해소하지 않았습니다.
  alternative_readings:
  - 처형 해석을 본문에 두는 읽기
  - 문자적으로 '통과하게 했다'고만 옮기는 읽기
  rationale: 히브리어는 난해하지만, POB의 본문 결정과 1역대상 20:3의 평행을 따라 강제노동 해석을 채택했습니다. 다만 원문의 모호성 자체는 각주로 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
