  - 암몬 사람들의 모든 성읍에도
  lexicon: HALOT
  rationale: בְנֵי עַמּוֹן의 관용적 민족명 기능을 살리면서, 한국어 성경체에 맞는 표현으로 정리했습니다.
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  english_pob_choice: returned to Jerusalem
  chosen_korean: 예루살렘으로 돌아왔습니다
  alternatives_korean:
