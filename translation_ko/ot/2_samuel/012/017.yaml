id: 2SA.12.17
reference: 2 Samuel 12:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּקֻ֜מוּ זִקְנֵ֤י בֵית/וֹ֙ עָלָ֔י/ו לַ/הֲקִימ֖/וֹ מִן הָ/אָ֑רֶץ וְ/לֹ֣א אָבָ֔ה וְ/לֹֽא בָרָ֥א אִתָּ֖/ם לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/017.yaml
  text: The elders of his house stood beside him to raise him up from the ground[a], but he was unwilling[b], and he would not eat bread with them.
  footnotes:
  - marker: a
    text: Or 'the elders of his household.' The Hebrew literally says 'the elders of his house.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'eat bread with them,' a Hebrew expression for taking food.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 집 장로들이 그를 땅에서 일으키려고 곁에 섰으나[a] 그는 그렇게 하려 하지 않았고[b], 그들과 함께 빵을 먹지도 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 집안 장로들’로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘그의 집의 장로들’이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들과 함께 빵을 먹다’입니다. 히브리어 관용구로, 여기서는 식사를 하는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי בֵיתוֹ
  english_pob_choice: the elders of his house
  chosen_korean: 그의 집 장로들
  alternatives_korean:
  - 그의 가문의 장로들
  - 그의 집안 장로들
  - 그의 가정의 장로들
  lexicon: HALOT
  rationale: 히브리어의 직역성을 살리면서도 한국어에서 자연스러운 소유 관계를 유지하기 위해 ‘집 장로들’로 옮겼습니다.
- source_word: וַיָּקֻמוּ ... עָלָיו
  english_pob_choice: stood beside him
  chosen_korean: 그를 … 곁에 섰으나
  alternatives_korean:
  - 그 위에 섰으나
  - 그 앞에 섰으나
  - 그 곁에 일어섰으나
  lexicon: HALOT
  rationale: 본문은 그를 붙들어 일으키려는 장면이므로, 자세한 공간 관계를 무리하게 확대하지 않고 행동의 실제성을 살린 ‘곁에 섰다’가 적절합니다.
- source_word: לַהֲקִימוֹ מִן הָאָרֶץ
  english_pob_choice: to raise him up from the ground
  chosen_korean: 그를 땅에서 일으키려고
  alternatives_korean:
  - 그를 땅에서 उठ게 하려고
  - 그를 땅에서 들어 올리려고
  - 그를 땅에서 일으켜 세우려고
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 한국어 동사 ‘일으키다’로 자연스럽게 살렸고, ‘땅에서’로 신체적 상태를 분명히 했습니다.
- source_word: וְלֹא בָרָא אִתָּם לָחֶם
  english_pob_choice: he would not eat bread with them
  chosen_korean: 그들과 함께 빵을 먹지도 않았습니다
  alternatives_korean:
  - 그들과 함께 식사하지도 않았습니다
  - 그들과 함께 떡을 먹지도 않았습니다
  - 그들과 함께 먹지도 않았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 과도하게 풀지 않고, 식사 거부의 구체성을 드러내기 위해 ‘빵을 먹다’를 유지했습니다.
- source_word: וְלֹא אָבָה
  english_pob_choice: he was unwilling
  chosen_korean: 그렇게 하려 하지 않았고
  alternatives_korean:
  - 원하지 않았고
  - 마지않았고
  - 거부하였고
  lexicon: HALOT
  rationale: אָבָה의 ‘의지하지 않다/마음이 내키지 않다’는 뉘앙스를 살려, 다소 강한 ‘거부하다’보다 완곡하지만 분명한 표현을 택했습니다.
theological_decisions:
- issue: 왕의 애도와 금식 거부의 묘사
  chosen_reading: 다윗의 극심한 슬픔과 금식 상태를, 장로들이 육체적으로 일으키려 하지만 그가 음식 섭취를 거부하는 장면으로 직설적으로 옮겼습니다.
  alternative_readings:
  - 정서적으로 완화하여 ‘기운을 돋우려 했으나’로 풀기
  - ‘먹을 수 없었다’로 내적 상태를 암시하기
  rationale: 본문의 정황은 단순한 위로가 아니라 실제적인 금식·애도 반응이므로, 이를 약화시키지 않고 서술해야 합니다.
  doctrine_reference: 문맥 주해
