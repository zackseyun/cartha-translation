revisions:
- from: 그러나 이 일로 말미암아 당신이 야훼의 원수들을 크게 업신여겼으므로, 당신에게서 난 아들은 반드시 죽을 것입니다.[a]
  to: 그러나 이 일로 말미암아 당신이 야훼의 원수들을 크게 업신여겼으므로, 당신에게 태어난 아들은 반드시 죽을 것입니다.[a]
  rationale: 마소라 본문의 직접 목적어인 ‘야훼의 원수들’을 본문에 유지하여 원문 우선 원칙과 영어 POB의 MT 기반 본문을 보존했습니다. 대안 독법은 각주에서 사역적 의미를 정확히 설명하고, 하나님의 이름을 ‘야훼’로 통일했습니다. 또한 출생 표현만 자연스럽게 다듬었습니다.
