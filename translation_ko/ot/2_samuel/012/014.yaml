  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶ֗פֶס כִּֽי נִאֵ֤ץ נִאַ֨צְתָּ֙ אֶת אֹיְבֵ֣י יְהוָ֔ה בַּ/דָּבָ֖ר הַ/זֶּ֑ה גַּ֗ם הַ/בֵּ֛ן הַ/יִּלּ֥וֹד לְ/ךָ֖ מ֥וֹת יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/014.yaml
  text: Nevertheless[a], because by this matter you have utterly scorned the enemies of Yahweh, the son born to you will surely die.
  footnotes:
  - marker: a
    text: Many translations render this clause, 'you have given the enemies of the LORD occasion to scorn' or 'to blaspheme,' following an interpretive or emended reading of the difficult Hebrew.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 이 일로 말미암아 당신이 야훼의 원수들을 크게 업신여겼으므로, 당신에게서 난 아들은 반드시 죽을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 많은 번역본은 이 절을 ‘당신이 여호와를 업신여겨 원수들이 비방하게 했다’는 뜻으로 옮기지만, 여기서는 난해한 히브리어의 MT를 본문대로 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶפֶס
  english_pob_choice: Nevertheless
  chosen_korean: 그러나
  alternatives_korean:
  - 그럼에도 불구하고
  - 하지만
  lexicon: HALOT
  rationale: 앞선 사면 선언을 강하게 제한하는 양보·대조의 전환을 한국어에서는 짧고 자연스럽게 ‘그러나’로 살렸습니다.
- source_word: נִאֵץ נִאַצְתָּ
  english_pob_choice: you have utterly scorned
  chosen_korean: 크게 업신여겼으므로
  alternatives_korean:
  - 완전히 업신여겼으므로
  - 극도로 멸시했으므로
  lexicon: HALOT
  rationale: 반복형의 강조를 ‘크게’로 살리되, נאץ의 핵심 의미인 경멸·모독을 ‘업신여기다’로 옮겨 문맥상 무게를 유지했습니다.
- source_word: אֶת אֹיְבֵי יְהוָה
  english_pob_choice: the enemies of Yahweh
  chosen_korean: 야훼의 원수들
  alternatives_korean:
  - 야훼의 적들
  - 야훼를 대적하는 자들
  lexicon: HALOT
  rationale: MT가 가리키는 직접 목적어를 그대로 살려 ‘원수들’로 옮겼고, 하나님의 고유명은 본 지침에 따라 ‘야훼’로 유지했습니다.
- source_word: בַּדָּבָר הַזֶּה
  english_pob_choice: by this matter
  chosen_korean: 이 일로 말미암아
  alternatives_korean:
  - 이 일 때문에
  - 이 사건으로
  lexicon: HALOT
  rationale: דבר의 넓은 범위를 한국어에서 자연스럽게 드러내기 위해 ‘일’로 옮기고, 인과 관계는 ‘말미암아’로 분명하게 했습니다.
- source_word: מוֹת יָמוּת
  english_pob_choice: will surely die
  chosen_korean: 반드시 죽을 것입니다
  alternatives_korean:
  - 정녕 죽을 것입니다
  - 꼭 죽을 것입니다
  lexicon: HALOT
  rationale: 부정사 절대형의 확실성을 현대 한국어에서는 ‘반드시’로 가장 직접적으로 보존했습니다.
theological_decisions:
- issue: MT의 난해한 구문을 본문 그대로 따를지, 전통적 해석으로 완화할지
  chosen_reading: 본문은 ‘당신이 야훼의 원수들을 크게 업신여겼으므로’로 유지하여, 원수들에 대한 직접 진술을 보존했습니다.
  alternative_readings:
  - ‘당신이 야훼를 업신여겼으므로’
  - ‘야훼의 원수들이 비방하게 하였으므로’
  rationale: 원문이 제공하는 직접 목적어 구조를 우선하고, 해석적·수정적 독법으로 의미를 바꾸지 않았습니다. 난해함은 각주가 아니라 본문 자체를 유지하는 방식으로 드러내는 것이 원문 우선 원칙에 더 부합합니다.
  doctrine_reference: Translation philosophy §1, §3
