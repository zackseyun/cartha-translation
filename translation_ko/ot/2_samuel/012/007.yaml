  yaml_path: translation/ot/2_samuel/012/007.yaml
  text: 'Then Nathan said to David[a], “You are the man! Thus says Yahweh, the God of Israel: I anointed you king over Israel, and I delivered you from the hand of Saul.”'
  footnotes:
  - marker: a
    text: Or, 'You are that man!' The Hebrew literally reads, 'You are the man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나단이 다윗에게 말했습니다. 「당신이 바로 그 사람입니다![a] 이스라엘의 하나님 야훼께서 이렇게 말씀하십니다. ‘내가 당신을 이스라엘의 왕으로 기름을 부어 세웠고, 또 내가 사울의 손에서 당신을 건져 냈습니다.’」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신이 그 사람입니다!’ 히브리어는 문자적으로 ‘당신이 그 사람입니다’입니다.
    reason: lexical_alternative
