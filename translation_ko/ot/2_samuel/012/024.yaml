  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְנַחֵ֣ם דָּוִ֗ד אֵ֚ת בַּת שֶׁ֣בַע אִשְׁתּ֔/וֹ וַ/יָּבֹ֥א אֵלֶ֖י/הָ וַ/יִּשְׁכַּ֣ב עִמָּ֑/הּ וַ/תֵּ֣לֶד בֵּ֗ן ו/יקרא אֶת שְׁמ/וֹ֙ שְׁלֹמֹ֔ה וַ/יהוָ֖ה אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/024.yaml
  text: Then David comforted Bathsheba his wife[a], and he went in to her and lay with her. She bore a son, and he named him Solomon[b]. And Yahweh loved him.
  footnotes:
  - marker: a
    text: Or, 'consoled Bathsheba his wife.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''went in to her and lay with her,'' referring to sexual relations.'
    reason: cultural_note
translation:
  language: ko
  text: 그러자 다윗이 그의 아내 밧세바를 위로하러 가서 그녀와 동침하였습니다. 그녀가 아들을 낳자 그가 그의 이름을 솔로몬이라고 지었습니다. 그리고 야훼께서 그를 사랑하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 완곡어법으로, 성적 관계를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 본문의 이름 짓기 관용구를 한국어의 자연한 서술로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְנַחֵם
  english_pob_choice: comforted
  chosen_korean: 위로하러 가서 / 위로하였습니다
  alternatives_korean:
  - 위로하였습니다
  - 달래었습니다
  - 위안하였습니다
  lexicon: HALOT
  rationale: 피엘형 נחם은 이 문맥에서 슬픔을 덜어 주는 위로를 뜻하므로, 자연스러운 현대 한국어로 ‘위로하다’를 택했습니다. 목적을 분명히 하기 위해 앞부분은 ‘위로하러 가서’로 옮겼습니다.
- source_word: וַיָּבֹא אֵלֶיהָ וַיִּשְׁכַּב עִמָּהּ
  english_pob_choice: he went in to her and lay with her
  chosen_korean: 그녀와 동침하였습니다
  alternatives_korean:
  - 그녀에게 들어가 그녀와 누웠습니다
  - 그녀와 잠자리를 같이하였습니다
  lexicon: HALOT
  rationale: 두 동사는 히브리어 완곡어법으로 성적 관계를 가리키므로, 의미를 명확히 하되 지나치게 노골적이지 않은 ‘동침하다’로 압축했습니다.
- source_word: וַתֵּלֶד בֵּן
  english_pob_choice: She bore a son
  chosen_korean: 그녀가 아들을 낳자
  alternatives_korean:
  - 그녀가 아들을 낳았습니다
  - 아들을 낳았습니다
  lexicon: HALOT
  rationale: 출생 사실을 간결하게 전달하면서, 다음 절차를 자연스럽게 잇기 위해 ‘낳자’로 연결했습니다.
- source_word: וַיִּקְרָא אֶת שְׁמֹו שְׁלֹמֹה
  english_pob_choice: he named him Solomon
  chosen_korean: 그가 그의 이름을 솔로몬이라고 지었습니다
  alternatives_korean:
  - 그의 이름을 솔로몬이라고 불렀습니다
  - 솔로몬이라고 이름 지었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘이름을 부르다/짓다’를 한국어의 자연한 서술로 옮겼습니다. 주어는 문맥상 다윗으로 이해하는 것이 가장 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 여기서는 여호와를 대신하는 호칭이 아니라 하나님의 고유명칭이 직접 쓰였으므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 다윗의 성관계 동사들을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘동침하였습니다’로 옮겨 히브리어의 완곡한 성적 관계 표현을 드러냈습니다.
  alternative_readings:
  - ‘들어가 그녀와 누웠습니다’처럼 직역할 수 있습니다
  - ‘잠자리를 같이하였습니다’처럼 현대적 표현을 쓸 수 있습니다
  rationale: 본문은 단순한 방문이 아니라 성적 결합을 말하므로, 그 긴장을 희석하지 않으면서도 한국어 본문으로 읽히는 표현이 필요했습니다.
  doctrine_reference: 서사 본문에서의 완곡어법 처리 원칙
- issue: יהוה의 처리
  chosen_reading: 본문에서 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주님’으로 바꿔 읽을 수 있습니다
  - 전통적으로 ‘여호와’로 읽을 수 있습니다
  rationale: 본문은 신적 칭호가 아니라 언약 이름을 직접 사용하므로, 번역에서도 고유명을 보존하는 것이 본문의 정보량을 유지합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
