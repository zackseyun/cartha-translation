    text: Or 'all the army' or 'all the troops'; Hebrew literally, 'all the people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다윗이 모든 백성을 모으고 라빠로 가서 그 성과 싸워 그것을 점령했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 군대’ 또는 ‘모든 군사’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘모든 백성’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  english_pob_choice: gathered
  chosen_korean: 모으고
  alternatives_korean:
  - 가고
  - 집결시키고
  lexicon: HALOT
  rationale: 사람들을 한데 불러 모으는 의미를 자연스럽게 살리되, 군사적 전문 용어로 좁히지 않았습니다.
- source_word: כָּל הָעָם
  english_pob_choice: all the people
  chosen_korean: 모든 백성
  alternatives_korean:
  - 모든 군대
  - 모든 군사
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘모든 백성’을 유지하여, 본문이 군사 집단을 가리키더라도 더 좁은 표현을 임의로 넣지 않았습니다.
- source_word: רַבָּתָה
  english_pob_choice: to Rabbah
  chosen_korean: 라빠로
  alternatives_korean:
  - 랍바로
  lexicon: HALOT
  rationale: 도시 이름의 방향형을 살려 ‘-로’를 붙였고, 고유명은 현대 음역 관행에 맞춰 라빠로 옮겼습니다.
- source_word: וַיִּלָּחֶם בָּהּ
  english_pob_choice: fought against it
  chosen_korean: 그 성과 싸워
  alternatives_korean:
  - 그것과 싸워
  - 그 성을 대적하여 싸워
  lexicon: HALOT
  rationale: 히브리어의 전투 행위를 자연스러운 한국어로 옮기되, 도시를 가리키는 대명사를 ‘그 성’으로 풀어 주어 문맥을 분명히 했습니다.
- source_word: וַיִּלְכְּדָהּ
  english_pob_choice: captured it
  chosen_korean: 점령했습니다
  alternatives_korean:
  - 빼앗았습니다
  - 사로잡았습니다
  lexicon: HALOT
  rationale: 성읍 정복 문맥에서 ‘점령하다’가 가장 자연스럽고, 단순한 ‘잡다’보다 전투 결과를 분명히 드러냅니다.
theological_decisions:
- issue: 전투 서술의 직역성과 현대 한국어의 자연스러움
  chosen_reading: 히브리어의 연속 동작(모으고, 가고, 싸워, 점령했습니다)을 유지해 사건 전개를 분명하게 드러냈습니다.
  alternative_readings:
  - 문맥을 풀어 ‘군대를 소집하고’로 옮김
  - 더 서사적으로 ‘함락시켰습니다’로 옮김
  rationale: 본문은 압축된 전투 기록이므로, 의미를 넓히지 않으면서도 현대 독자가 바로 이해할 수 있는 서술 리듬을 살렸습니다.
  doctrine_reference: 서사 본문의 직접성 유지 원칙
