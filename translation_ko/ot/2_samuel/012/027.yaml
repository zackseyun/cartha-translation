  text: Then Joab sent messengers to David and said[a], “I have fought against Rabbah; I have also captured the city of waters.”
  footnotes:
  - marker: a
    text: Or possibly, “the water city,” likely referring to the part of Rabbah controlling its water supply.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요압이 다윗에게 전령들을 보내어 말했습니다. “저는 라바를 상대로 싸웠고, 물의 성읍[a]도 점령했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물의 도시’. 라바의 물 공급을 장악한 구역을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: Then ... sent
  chosen_korean: 보내어
  alternatives_korean:
