  source_fidelity: ‘라바와 싸웠고’는 한국어에서 라바와 함께 싸웠다는 뜻으로도 읽힐 수 있어, בְרַבָּה가 문맥상 나타내는 대적·공격의 의미를 충분히 드러내지 못합니다. ‘라바를 상대로 싸웠고’로 고치면 원문의 군사적 대상을 자연스럽고 명확하게 보존합니다. ‘물의 성읍’은 히브리어 명사구의 의도적인 불명확성을 유지합니다.
  naturalness: ‘전령들’은 이 군사 보고 문맥에서 현대 표준어로 자연스럽고, ‘사자들’보다 인간 전달자라는 뜻이 즉시 분명합니다. 합쇼체 서술과 인용문의 높임말도 일관됩니다.
