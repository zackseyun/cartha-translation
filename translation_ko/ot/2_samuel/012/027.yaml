- source_word: עִיר הַמָּיִם
  english_pob_choice: the city of waters
  chosen_korean: 물의 성읍
  alternatives_korean:
  - 물의 도시
  - 물 성읍
  lexicon: HALOT
  rationale: 히브리어의 명사구를 비교적 투명하게 옮겨, 물 공급과 연결된 특정 지칭 가능성을 본문에서 과도하게 풀지 않았습니다.
