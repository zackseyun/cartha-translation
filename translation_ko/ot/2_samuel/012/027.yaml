base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/027.yaml
  text: Then Joab sent messengers to David and said[a], “I have fought against Rabbah; I have also captured the city of waters.”
  footnotes:
  - marker: a
    text: Or possibly, “the water city,” likely referring to the part of Rabbah controlling its water supply.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요압이 다윗에게 사자들을 보내어 말했습니다. "저는 라바와 싸웠고, 물의 성읍도 점령했습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘물의 성읍’이며, 라바의 물 공급을 장악한 구역을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: Then ... sent
  chosen_korean: 보내어
  alternatives_korean:
  - 보냈습니다
  - 그리고 ... 보냈습니다
  lexicon: HALOT
  rationale: 와우 연속으로 이어지는 서술의 진행을 한국어에서는 ‘그때’와 동사 연결형 ‘보내어’로 자연스럽게 살렸습니다.
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들
  - 천사들
  lexicon: HALOT
  rationale: 인간이 보낸 전달자들이므로 ‘사자들’이 가장 무난하며, 문맥상 천사 의미는 배제됩니다.
- source_word: נִלְחַמְתִּי בְרַבָּה
  english_pob_choice: I have fought against Rabbah
  chosen_korean: 라바와 싸웠고
  alternatives_korean:
  - 라바를 대적하여 싸웠고
  - 라바에서 싸웠고
  lexicon: HALOT
  rationale: 전투 행위를 직역하되, 한국어 군사 보고체에서는 장소보다 대상을 드러내는 ‘라바와 싸웠고’가 가장 자연스럽습니다.
- source_word: עִיר הַמָּיִם
  english_pob_choice: the city of waters
  chosen_korean: 물의 성읍
  alternatives_korean:
  - 물의 도시
  - 물 성읍
  lexicon: HALOT
  rationale: 히브리어의 명사구를 비교적 투명하게 옮겨, 물 공급과 연결된 특정 지칭 가능성을 본문에서 과도하게 풀지 않았습니다.
