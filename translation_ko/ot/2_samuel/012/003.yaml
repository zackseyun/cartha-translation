  source_fidelity: ‘그의 자녀들’은 히브리어 בָּנָיו(‘그의 아들들’)의 성별 표지를 중화합니다. 영어 감사 기록의 자연화 선택과는 별개로, 한국어에서는 ‘아들들’이 자연스럽고 원문의 구체성을 손상 없이 보존합니다. 또한 וַיְחַיֶּהָ는 ‘살려 두었다’보다 돌봄과 양육의 지속성을 나타내는 ‘길렀다’가 문맥상 더 적절합니다.
  naturalness: 원안의 ‘그의 한 조각 빵’은 한국어 소유·수식 관계가 다소 어색합니다. ‘그의 빵 한 조각’이 자연스럽습니다. 나머지 문장은 현대 표준어 합쇼체의 서사 문체에 대체로 잘 맞습니다.
  terminology: ‘가난한 사람’, ‘작은 암양’, ‘품’, ‘딸과도 같았습니다’는 각각 רָשׁ, כִּבְשָׂה אַחַת קְטַנָּה, בְחֵיקוֹ, כְּבַת을 충실하고 자연스럽게 옮깁니다. ‘암양’은 원문의 암컷 표지를 보존합니다.
