source:
  edition: WLC
  text: וְ/לָ/רָ֣שׁ אֵֽין כֹּ֗ל כִּי֩ אִם כִּבְשָׂ֨ה אַחַ֤ת קְטַנָּה֙ אֲשֶׁ֣ר קָנָ֔ה וַ/יְחַיֶּ֕/הָ וַ/תִּגְדַּ֥ל עִמּ֛/וֹ וְ/עִם בָּנָ֖י/ו יַחְדָּ֑ו מִ/פִּתּ֨/וֹ תֹאכַ֜ל וּ/מִ/כֹּס֤/וֹ תִשְׁתֶּה֙ וּ/בְ/חֵיק֣/וֹ תִשְׁכָּ֔ב וַ/תְּהִי ל֖/וֹ כְּ/בַֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/003.yaml
  text: But the poor man had nothing except one little ewe lamb[a], which he had bought. He kept it alive, and it grew up with him and with his children together; it would eat from his morsel and drink from his cup and lie in his bosom[c][b], and it was like a daughter to him.
  footnotes:
  - marker: a
    text: Or 'one little ewe lamb.'
    reason: lexical_alternative
  - marker: b
    text: '''In his bosom'' may also be rendered ''in his arms'' or ''in his lap,'' expressing close affection within the household.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'his sons'; rendered 'his children' for natural English in the household context.
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 사람에게는 자기가 산 작은[a] 암양 한 마리밖에 없었습니다. 그는 그 암양을 길렀고, 그것은 그와 그의 아들들과 함께 자랐습니다. 그것은 그의 빵 한 조각을 먹고 그의 잔에서 마시며 그의 품에[b] 누웠고, 그에게는 딸과도 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘작은 암양’은 히브리어 כִּבְשָׂה אַחַת קְטַנָּה를 옮긴 말입니다. ‘어린 암양’으로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘품’은 여기서 사랑과 보호가 깃든 가족적 친밀감을 나타냅니다. ‘팔에’ 또는 ‘무릎에’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשׁ
  english_pob_choice: poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 남자
  - 궁핍한 사람
  lexicon: HALOT
  rationale: 남성 단수 인물을 가리키지만, 한국어에서는 성별을 굳이 드러내지 않는 ‘가난한 사람’이 자연스럽고 서사적 대비를 잘 살립니다.
- source_word: כִּבְשָׂה אַחַת קְטַנָּה
  english_pob_choice: one small ewe lamb
  chosen_korean: 작은 암양 한 마리
  alternatives_korean:
  - 한 마리 작은 어린 암양
  - 한 마리의 작은 암컷 양
  lexicon: HALOT
  rationale: כִּבְשָׂה는 ‘암양/어린 암양’의 성별 정보를 담고 있어 ‘암양’으로 옮겼고, קְטַנָּה는 크기와 애정의 뉘앙스를 살려 ‘작은’으로 렌더링했습니다.
- source_word: מִפִּתּוֹ
  english_pob_choice: from his morsel
  chosen_korean: 한 조각 빵을
  alternatives_korean:
  - 자기 빵을
  - 한 입의 빵을
  lexicon: HALOT
  rationale: ‘한 조각’은 פַּת의 작고 사적인 나눔의 이미지를 살리며, ‘빵’을 더해 한국어에서 자연스럽고 구체적으로 들리게 했습니다.
- source_word: בְחֵיקוֹ
  english_pob_choice: in his bosom
  chosen_korean: 품에
  alternatives_korean:
  - 가슴에
  - 무릎에
  - 팔에
  lexicon: HALOT
  rationale: 직역형 ‘품에’는 친밀한 가정적 애착을 유지하면서도 한국어에서 과도하게 신체적이거나 낯설게 들리지 않습니다.
theological_decisions:
- issue: 가축을 가족 구성원처럼 묘사하는 비유의 정서
  chosen_reading: 가정 내부의 깊은 애정을 그대로 보존했습니다.
  alternative_readings:
  - 정서를 완화해 단순한 애완 동물처럼 읽히게 함
  - 비유적 강도를 약화시킴
  rationale: 이 장면은 나단의 비유가 지닌 정서적 압박을 형성하므로, 가족적·애정적 표현을 약화하지 않고 그대로 전달하는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §6
