revisions:
- from: 가난한 사람은 자기가 산 작은 암양 한 마리밖에 없었습니다. 그는 그 암양을 살려 두었고, 그것은 그와 그의 자녀들과 함께 자라났습니다. 그것은 그의 한 조각 빵을 먹고 그의 잔에서 마시며 그의 품에 누웠고, 그에게는 딸과도 같았습니다.[a][b][c]
  to: 가난한 사람에게는 자기가 산 작은[a] 암양 한 마리밖에 없었습니다. 그는 그 암양을 길렀고, 그것은 그와 그의 아들들과 함께 자랐습니다. 그것은 그의 빵 한 조각을 먹고 그의 잔에서 마시며 그의 품에[b] 누웠고, 그에게는 딸과도 같았습니다.
  rationale: 원문의 구체적 표현인 ‘그의 아들들’을 보존하고, 어린 양을 지속적으로 돌보아 기른다는 의미와 한국어의 자연스러운 소유·수식 관계를 반영했습니다. 각주 표지는 해당 어휘가 나오는 위치에만 배치했으며, 더 이상 적용되지 않는 ‘자녀들’ 관련 각주는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:37:10Z'
