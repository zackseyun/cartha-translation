base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/012.yaml
  text: For you did it in secret[a], but I will do this thing before all Israel and before the sun.
  footnotes:
  - marker: a
    text: Or 'and in broad daylight'; literally, 'and before the sun.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 네가 그것을 은밀히 행하였으나, 나는 이 일을 온 이스라엘 앞에서, 해 앞에서 하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘대낮에’(문자적으로는 ‘해 앞에서’).
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 이전 판결 선언에 대한 이유를 이어 주는 연결로서, 한국어에서는 문장 앞의 ‘이는’이 설명적·논증적 기능을 자연스럽게 살립니다.
- source_word: בַ/סָּתֶר
  english_pob_choice: in secret
  chosen_korean: 은밀히
  alternatives_korean:
  - 비밀리에
  - 숨은 곳에서
  lexicon: HALOT
  rationale: 히브리어의 ‘숨김/비밀’ 상태를 간결한 현대어로 옮겨, 뒤의 공개적 대비를 분명하게 합니다.
- source_word: אֶת הַ/דָּבָר הַ/זֶּה
  english_pob_choice: this thing
  chosen_korean: 이 일
  alternatives_korean:
  - 이것
  - 이 사건
  lexicon: HALOT
  rationale: 지시 대상이 앞서 언급된 징벌 행위임을 드러내면서도, 원문의 구체적 지시성을 지나치게 해석하지 않도록 ‘이 일’로 옮겼습니다.
- source_word: נֶגֶד כָּל יִשְׂרָאֵל וְ/נֶגֶד הַ/שָּׁמֶשׁ
  english_pob_choice: before all Israel and before the sun
  chosen_korean: 온 이스라엘 앞과 해 앞에서
  alternatives_korean:
  - 온 이스라엘이 보는 앞과 해가 보는 앞에서
  - 온 이스라엘 앞과 햇빛 아래서
  lexicon: HALOT
  rationale: נֶגֶד의 ‘~앞에/보는 앞에’라는 공개성은 살리되, POB의 직역성을 따라 ‘해 앞에서’로 유지해 드러난 수치와 공적 노출의 이미지를 보존했습니다.
theological_decisions:
- issue: 공개 심판의 대조 구조
  chosen_reading: 다윗의 은밀한 죄와 하나님의 공개적 행위를 대조하는 구조를 그대로 살렸습니다.
  alternative_readings:
  - ‘해 앞에서’를 ‘대낮에’로 풀어 뜻만 전달함
  rationale: 본문의 핵심은 사건의 장소 정보보다 비밀/공개의 도덕적 대비에 있으므로, 원문 이미지를 유지하는 쪽이 경고의 강도를 보존합니다.
  doctrine_reference: 번역 철학 §1, §3
- issue: 하나님의 직접적 행위 주체성
  chosen_reading: ‘나는 이 일을 … 하겠습니다’로 직접적인 1인칭 행위를 유지했습니다.
  alternative_readings:
  - ‘나는 이 일이 이루어지게 하겠습니다’
  rationale: 히브리어의 단순 1인칭 동사를 완화하지 않고, 심판을 직접 선언하시는 하나님의 주체성을 드러냅니다.
  doctrine_reference: 번역 철학 §1, §3
