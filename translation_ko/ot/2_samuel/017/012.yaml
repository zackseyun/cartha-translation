  edition: WLC
  text: וּ/בָ֣אנוּ אֵלָ֗י/ו ב/אחת הַ/מְּקוֹמֹת֙ אֲשֶׁ֣ר נִמְצָ֣א שָׁ֔ם וְ/נַ֣חְנוּ עָלָ֔י/ו כַּ/אֲשֶׁ֛ר יִפֹּ֥ל הַ/טַּ֖ל עַל הָ/אֲדָמָ֑ה וְ/לֹֽא נ֥וֹתַר בּ֛/וֹ וּ/בְ/כָל הָ/אֲנָשִׁ֥ים אֲשֶׁר אִתּ֖/וֹ גַּם אֶחָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/012.yaml
  text: Then we will come upon him in one of the places where he is found[a], and we will settle on him just as the dew falls on the ground; and not one will be left of him and of all the men who are with him—not even one.
  footnotes:
  - marker: a
    text: Or 'we will descend on him'; the Hebrew verb literally means 'settle/rest upon,' here used in a military simile of overwhelming coverage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 우리가 그가 발견되는 곳들 가운데 한 곳에서 그에게로 가서, 땅에 이슬이 내리듯이 그 위에 덮칠 것이며, 그와 그와 함께 있는 모든 사람들 가운데서 하나도 남지 않을 것입니다. 곧 하나도 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 נוח는 본래 ‘쉬다, 머물다’의 뜻이며, 여기서는 군사적 비유 속에서 ‘덮치다/압박하다’에 가까운 효과를 냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאנוּ אֵלָיו
  english_pob_choice: Then we will come upon him
  chosen_korean: 그러면 우리가 그에게로 가서
  alternatives_korean:
  - 그리고 우리는 그에게 갈 것입니다
  - 그러면 우리가 그를 치러 갈 것입니다
  lexicon: HALOT
  rationale: בוא의 기본 의미는 ‘가다/오다’이지만, 여기서는 공격 계획의 문맥상 목적지 지시보다 접근·진군의 뉘앙스가 핵심이어서 ‘그에게로 가서’로 옮겼습니다.
- source_word: בְּאַחַת הַמְּקֹמוֹת אֲשֶׁר נִמְצָא שָׁם
  english_pob_choice: in one of the places where he is found
  chosen_korean: 그가 발견되는 곳들 가운데 한 곳에서
  alternatives_korean:
  - 그가 있는 장소들 중 한 곳에서
  - 그가 찾아지는 곳 가운데 하나에서
  lexicon: HALOT
  rationale: נמצא의 피동적 뜻을 살려 ‘발견되는’으로 옮겼고, ‘한 곳’은 히브리어의 불특정 장소를 자연스럽게 반영합니다.
- source_word: וְנַחְנוּ עָלָיו
  english_pob_choice: and we will settle on him
  chosen_korean: 그 위에 덮칠 것이며
  alternatives_korean:
  - 그 위에 내려앉을 것이며
  - 그 위에 포위하듯 덮칠 것이며
  lexicon: HALOT
  rationale: נוח의 직역적 뜻은 ‘쉬다/머물다’이지만, 전투 비유에서는 압도적으로 덮치는 이미지가 요구되므로 한국어에서는 ‘덮칠’로 그 효과를 살렸습니다.
- source_word: כַּאֲשֶׁר יִפֹּל הַטַּל עַל הָאֲדָמָה
  english_pob_choice: just as the dew falls on the ground
  chosen_korean: 땅에 이슬이 내리듯이
  alternatives_korean:
  - 땅 위로 이슬이 떨어지듯이
  - 이슬이 땅에 내리듯이
  lexicon: HALOT
  rationale: ‘이슬이 내리다’는 한국어 관용이 히브리어의 낙하 이미지를 자연스럽게 전달하며, 반복되는 압도적 포위의 비유를 살립니다.
- source_word: גַּם אֶחָד
  english_pob_choice: not even one
  chosen_korean: 하나도 남지 않을 것입니다. 곧 하나도 말입니다.
  alternatives_korean:
  - 한 사람도 남지 않을 것입니다. 곧 한 사람도 말입니다.
  - 단 한 명도 남지 않을 것입니다.
  lexicon: HALOT
  rationale: גַּם אֶחָד의 강조를 한국어의 반복과 삽입구로 살려, 전멸의 절대성을 문장 끝에서 다시 한 번 부각했습니다.
theological_decisions:
- issue: 압도적 공격 비유의 동사 선택
  chosen_reading: ‘그 위에 덮칠 것이며’로 전투적 포위·압박의 이미지를 살렸습니다.
  alternative_readings:
  - ‘그 위에 내려앉을 것이며’
  - ‘그 위에 떨어질 것이며’
  rationale: 히브리어 נוח의 기본 뜻을 기계적으로 ‘쉬다/머물다’로 옮기면 공격 계획의 비유성이 약화되므로, 문맥이 허용하는 범위 안에서 한국어의 강한 전투 동사로 의미 효과를 전달했습니다.
  doctrine_reference: 문맥-우선 번역 원칙; 서술적 비유의 보존
- issue: ‘하나도 남지 않을 것입니다’의 반복
  chosen_reading: 본문의 마지막 강조를 ‘하나도 남지 않을 것입니다. 곧 하나도 말입니다.’로 중복 반영했습니다.
  alternative_readings:
  - ‘단 한 명도 남지 않을 것입니다’
  - ‘아무도 남지 않을 것입니다’
  rationale: גַּם אֶחָד의 절대적 배제를 한국어에서 명시적으로 재현해, 원문의 철저한 소멸 선언을 약화시키지 않도록 했습니다.
  doctrine_reference: 본문 강조의 보존
