  lexicon: HALOT
  rationale: 질병 역병이 아니라 전투에서의 심각한 타격을 뜻하므로, 본문이 암시하는 강한 군사적 살상을 드러내기 위해 ‘큰 살육’으로 옮겼습니다.
theological_decisions:
