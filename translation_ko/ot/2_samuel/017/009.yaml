id: 2SA.17.9
reference: 2 Samuel 17:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֨ה עַתָּ֤ה הֽוּא נֶחְבָּא֙ בְּ/אַחַ֣ת הַ/פְּחָתִ֔ים א֖וֹ בְּ/אַחַ֣ד הַ/מְּקוֹמֹ֑ת וְ/הָיָ֗ה כִּ/נְפֹ֤ל בָּ/הֶם֙ בַּ/תְּחִלָּ֔ה וְ/שָׁמַ֤ע הַ/שֹּׁמֵ֨עַ֙ וְ/אָמַ֔ר הָֽיְתָה֙ מַגֵּפָ֔ה בָּ/עָ֕ם אֲשֶׁ֖ר אַחֲרֵ֥י אַבְשָׁלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/009.yaml
  text: Look[a], right now he is hidden in one of the pits or in one of the other places. And when some of them fall at the first attack, whoever hears it will say[b], ‘There has been a slaughter among the people who follow Absalom.’
  footnotes:
  - marker: a
    text: Or 'in one of the hollows'; the Hebrew term can refer to pits, depressions, or similar hiding places in the terrain.
    reason: lexical_alternative
  - marker: b
    text: '''There has been a slaughter'' could also be rendered ''There has been a defeat'' or ''a blow'' among Absalom''s followers; the Hebrew term refers here to a severe military striking down, not to a disease-plague.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 지금 그는 구덩이들 가운데 하나나 다른 곳들 가운데 하나에 숨어 있습니다. 그리고 그들 가운데 몇 사람이 첫 공격 때 쓰러지면, 듣는 사람은 누구나 ‘압살롬을 따르는 백성 가운데 큰 살육이 있었다’라고 말할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘웅덩이들 가운데 하나’; 히브리어는 구덩이, 움푹 팬 곳, 비슷한 은신처를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 살육’은 여기서 ‘큰 패배’나 ‘큰 타격’으로도 옮길 수 있습니다. 히브리어는 질병 역병이 아니라 군사적 섬멸을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 주의를 끄는 감탄형 도입어로, 현대 한국어에서 즉각성과 생동감을 자연스럽게 살립니다.
- source_word: בְּאַחַת הַפְּחָתִים
  english_pob_choice: in one of the pits
  chosen_korean: 구덩이들 가운데 하나
  alternatives_korean:
  - 구덩이들 중 하나
  - 웅덩이들 가운데 하나
  - 함몰지들 가운데 하나
  lexicon: HALOT
  rationale: פְּחָתִים의 기본적 지형 의미를 살려 가장 مستقیم한 대응인 ‘구덩이’로 옮겼습니다.
- source_word: כִּנְפֹל בָּהֶם
  english_pob_choice: when some of them fall
  chosen_korean: 그들 가운데 몇 사람이 쓰러지면
  alternatives_korean:
  - 그들 위에 쓰러지면
  - 그들 가운데 쓰러짐이 생기면
  lexicon: HALOT
  rationale: 문맥상 전투 중 사상 발생을 가리키므로, 단순한 ‘떨어지다’보다 ‘쓰러지다’가 의미를 더 분명히 드러냅니다.
- source_word: מַגֵּפָה
  english_pob_choice: a slaughter
  chosen_korean: 큰 살육
  alternatives_korean:
  - 대패
  - 패배
  - 타격
  lexicon: HALOT
  rationale: 질병 역병이 아니라 전투에서의 심각한 타격을 뜻하므로, 본문이 암시하는 강한 군사적 살상을 드러내기 위해 ‘큰 살육’으로 옮겼습니다.
theological_decisions:
- issue: 압살롬을 따르는 자들의 전투 피해를 어떻게 표현할지
  chosen_reading: 본문의 מַגֵּפָה를 전염병 의미로 오해하지 않도록 전투적 ‘살육’으로 번역했습니다.
  alternative_readings:
  - 역병이 있었다
  - 큰 패배가 있었다
  rationale: 히브리어 어휘는 여기서 질병이 아니라 군사적 타격을 가리키므로, 독자가 장면의 정치-군사적 긴장을 그대로 이해하도록 했습니다.
  doctrine_reference: 본문의 역사서적 서술에 대한 원문 의미 보존
