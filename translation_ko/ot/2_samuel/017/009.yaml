- from: 보십시오. 지금 그는 구덩이들 가운데 하나나 다른 곳들 가운데 하나에 숨어 있습니다. 그리고 그들 가운데 몇 사람이 첫 공격 때 쓰러지면, 듣는 사람은 누구나 ‘압살롬을 따르는 백성 가운데 큰 살육이 있었다’라고 말할 것입니다.[a][b]
  to: 보십시오, 지금 그는 구덩이들[a] 중 하나나 다른 곳 중 하나에 숨어 있습니다. 그리고 처음에 그들 가운데 쓰러지는 일이 일어나면, 그것을 듣는 사람은 ‘압살롬을 따르는 백성 가운데 살육이 있었다[b]’라고 말할 것입니다.
