source:
  edition: WLC
  text: וְ/אָב֣וֹא עָלָ֗י/ו וְ/ה֤וּא יָגֵ֨עַ֙ וּ/רְפֵ֣ה יָדַ֔יִם וְ/הַֽחֲרַדְתִּ֣י אֹת֔/וֹ וְ/נָ֖ס כָּל הָ/עָ֣ם אֲשֶׁר אִתּ֑/וֹ וְ/הִכֵּיתִ֥י אֶת הַ/מֶּ֖לֶךְ לְ/בַדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/002.yaml
  text: I will come upon him while he is weary and weak-handed[a], and I will throw him into panic, so that all the people who are with him will flee; then I will strike down the king alone.
  footnotes:
  - marker: a
    text: Hebrew literally, 'weak of hands,' an idiom for diminished strength or courage.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그에게로 가서 그가 피곤하고 손이 무거운 상태일 때 그를 놀라게 하겠습니다. 그러면 그와 함께 있는 모든 백성이 도망할 것이고, 나는 왕만 따로 쳐 죽이겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘손이 약한/축 처진’으로, 여기서는 기력과 용기가 모두 꺾인 상태를 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָב֣וֹא עָלָ֗יו
  english_pob_choice: I will come upon him
  chosen_korean: 그에게로 가서
  alternatives_korean:
  - 그에게 덤벼들어
  - 그에게 닥쳐가서
  lexicon: WLC/HALOT
  rationale: בוא + על의 적대적 뉘앙스를 살리되, 한국어에서는 ‘그에게로 가서’에 뒤 문맥의 공격성을 맡겨 자연스럽게 표현했습니다.
- source_word: יָגֵעַ וּרְפֵה יָדַיִם
  english_pob_choice: weary and weak-handed
  chosen_korean: 피곤하고 손이 무거운 상태
  alternatives_korean:
  - 지치고 손이 약한 상태
  - 지쳐서 기운이 빠진 상태
  lexicon: WLC/HALOT
  rationale: ‘weak-handed’의 직역 감각을 유지하면서도 한국어에서 어색한 직유를 피하기 위해, 육체적 피로와 의기 저하가 함께 드러나도록 옮겼습니다.
- source_word: וְהַחֲרַדְתִּי אֹתוֹ
  english_pob_choice: I will throw him into panic
  chosen_korean: 그를 놀라게 하겠습니다
  alternatives_korean:
  - 그를 공포에 빠뜨리겠습니다
  - 그를 패닉에 빠뜨리겠습니다
  lexicon: WLC/HALOT
  rationale: חרד의 사역형을 반영해 ‘놀라게 하다’보다 강한 ‘공포에 빠뜨리다’도 가능하지만, 본문 흐름상 전술적 혼란을 유발하는 뜻을 자연스럽게 살려 ‘놀라게 하겠습니다’로 정했습니다.
- source_word: וְנָס כָּל הָעָם אֲשֶׁר אִתּוֹ
  english_pob_choice: so that all the people who are with him will flee
  chosen_korean: 그러면 그와 함께 있는 모든 백성이 도망할 것이고
  alternatives_korean:
  - 그와 함께 있는 모든 사람들이 달아날 것이고
  - 그와 함께한 모든 백성이 도망칠 것이고
  lexicon: WLC/HALOT
  rationale: 원문의 결과 관계를 한국어에서 분명하게 드러내기 위해 ‘그러면’을 넣었고, ‘אֲשֶׁר אִתּוֹ’를 ‘그와 함께 있는’으로 보존했습니다.
- source_word: וְהִכֵּיתִי אֶת הַמֶּלֶךְ לְבַדּוֹ
  english_pob_choice: then I will strike down the king alone
  chosen_korean: 나는 왕만 따로 쳐 죽이겠습니다
  alternatives_korean:
  - 나는 왕만 홀로 칠 것입니다
  - 나는 왕을 홀로 쳐서 죽이겠습니다
  lexicon: WLC/HALOT
  rationale: נכה의 폭력적·치명적 문맥을 살려 ‘쳐 죽이다’로 옮기되, לְבַדּוֹ의 분리 강조를 ‘왕만 따로’로 반영했습니다.
theological_decisions:
- issue: 사울의 전술적 암살 계획을 담은 화자의 직접 발언 어조
  chosen_reading: 직설적 군사 계획의 발언으로 유지하고, 완곡화하지 않았습니다.
  alternative_readings:
  - 완곡하게 ‘제거하겠습니다’로 약화
  - ‘왕을 쓰러뜨리겠습니다’로 일반화
  rationale: 본문은 전략적 살해 의도를 분명히 말하므로, 한국어도 그 긴장을 유지해야 합니다.
  doctrine_reference: 본문 장르/담화 맥락
