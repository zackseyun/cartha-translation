  rationale: חרד의 사역형을 반영해 ‘놀라게 하다’보다 강한 ‘공포에 빠뜨리다’도 가능하지만, 본문 흐름상 전술적 혼란을 유발하는 뜻을 자연스럽게 살려 ‘놀라게 하겠습니다’로 정했습니다.
- source_word: וְנָס כָּל הָעָם אֲשֶׁר אִתּוֹ
  english_pob_choice: so that all the people who are with him will flee
  chosen_korean: 그러면 그와 함께 있는 모든 백성이 도망할 것이고
  alternatives_korean:
  - 그와 함께 있는 모든 사람들이 달아날 것이고
