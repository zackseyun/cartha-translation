  text: I will come upon him while he is weary and weak-handed[a], and I will throw him into panic, so that all the people who are with him will flee; then I will strike down the king alone.
  footnotes:
  - marker: a
    text: Hebrew literally, 'weak of hands,' an idiom for diminished strength or courage.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그가 지치고 손에 힘이 빠졌을 때 그에게 들이닥쳐 그를 공포에 떨게 하겠습니다. 그러면 그와 함께 있는 모든 백성이 달아날 것이며, 나는 왕만 쳐 죽이겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘손이 약한’입니다. 기력이나 용기가 꺾인 상태를 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
