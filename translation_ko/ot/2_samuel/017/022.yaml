source:
  edition: WLC
  text: וַ/יָּ֣קָם דָּוִ֗ד וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יַּעַבְר֖וּ אֶת הַ/יַּרְדֵּ֑ן עַד א֣וֹר הַ/בֹּ֗קֶר עַד אַחַד֙ לֹ֣א נֶעְדָּ֔ר אֲשֶׁ֥ר לֹא עָבַ֖ר אֶת הַ/יַּרְדֵּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/022.yaml
  text: Then David arose[a], and all the people who were with him, and they crossed the Jordan. By morning light, not one was missing who had not crossed the Jordan.
  footnotes:
  - marker: a
    text: Or, 'until the light of morning'; the Hebrew phrase preserves the imagery of morning light while indicating the time by which the crossing was completed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗과 그와 함께 있던 모든 백성이 일어나 요단을 건넜습니다. 아침빛이 비칠 즈음에는[a] 요단을 건너지 않은 사람이 한 사람도 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘아침의 빛까지’라고 하며, 아침빛이 비칠 때까지 도하가 완료되었음을 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 일어났습니다
  - 떠났습니다
  - 출발했습니다
  lexicon: HALOT
  rationale: קום의 서사적 진행을 자연스럽게 살리되, 현대 한국어에서 과도하게 문어적인 ‘기상하다’보다 행동의 전환을 분명히 드러내는 ‘일어났습니다’를 택했습니다.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  english_pob_choice: and all the people who were with him
  chosen_korean: 그와 함께 있던 모든 백성
  alternatives_korean:
  - 그와 함께한 모든 사람
  - 그와 함께 있던 모든 사람들
  lexicon: HALOT
  rationale: הָעָם은 동반 집단 전체를 가리키므로 ‘백성’으로 옮기되, 관계절을 압축해 한국어 어순에 맞게 자연스럽게 표현했습니다.
- source_word: עַד אוֹר הַבֹּקֶר
  english_pob_choice: By morning light
  chosen_korean: 아침빛이 비칠 무렵
  alternatives_korean:
  - 아침빛이 비칠 때까지
  - 새벽까지
  - 아침빛 무렵
  lexicon: HALOT
  rationale: 직역하면 ‘아침의 빛까지’이지만, 시간의 경계와 빛의 이미지를 함께 살리기 위해 ‘아침빛이 비칠 무렵’으로 옮겼습니다.
- source_word: עַד אַחַד לֹא נֶעְדָּר
  english_pob_choice: not one was missing
  chosen_korean: 빠진 이는 하나도 없었습니다
  alternatives_korean:
  - 하나도 빠진 이가 없었습니다
  - 한 사람도 없지 않았습니다
  - 없어진 이는 하나도 없었습니다
  lexicon: HALOT
  rationale: 관용구의 의미는 ‘누락된 이가 없다’이므로 한국어에서는 ‘빠진 이’로 자연스럽게 전달했습니다.
- source_word: אֲשֶׁר לֹא עָבַר אֶת הַיַּרְדֵּן
  english_pob_choice: who had not crossed the Jordan
  chosen_korean: 요단을 건너지 않은 사람으로서
  alternatives_korean:
  - 요단을 건너지 않은 자로서
  - 요단을 건너지 않은 이로서
  - 요단을 건너지 않은 사람
  lexicon: HALOT
  rationale: 앞의 ‘빠진 이’를 풀어주는 관계절이므로, ‘건너지 않은 사람으로서’로 연결해 문장 의미를 분명히 했습니다.
theological_decisions:
- issue: 서사적 완결성과 집단의 무사한 이동
  chosen_reading: 다윗과 동행한 모든 무리가 밤사이 요단을 건너는 동안, 아침 무렵까지 누락된 사람이 한 명도 없었다는 서술로 읽었습니다.
  alternative_readings:
  - 단순한 이동 완료 보고
  - 전투적 철수의 결과 강조
  rationale: 이 절은 신학적 논쟁 지점보다 서술의 완결성과 보호된 이동을 강조하므로, 과장 없이 결과를 분명히 드러내는 방향으로 옮겼습니다.
  doctrine_reference: 본문 서술의 평이한 역사 서술
- issue: ‘아침빛’의 이미지 보존
  chosen_reading: 시간 표지로만 환원하지 않고 빛의 이미지를 살려 ‘아침빛이 비칠 무렵’으로 옮겼습니다.
  alternative_readings:
  - 새벽까지
  - 아침 무렵
  rationale: 히브리어의 אוֹר는 단순한 시각 정보뿐 아니라 빛의 이미지를 포함하므로, 이를 완전히 지우지 않도록 했습니다.
  doctrine_reference: 본문 이미지 보존 원칙
