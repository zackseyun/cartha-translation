  lexicon: HALOT
  rationale: 이 절에서 דוד을 가리키는 גִבּוֹר은 전투적·영웅적 성격을 띠므로, 전통적이면서도 본문의 군사적 맥락을 살리는 ‘용사’를 택했습니다.
