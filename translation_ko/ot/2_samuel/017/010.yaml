  lexicon: HALOT
  rationale: 앞의 단수 표현과 연결되는 ‘חיל’ 계열의 반복을 살리면서, 문맥상 동료들을 가리키는 복수 표현으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 마음이 ‘녹는다’는 비유의 번역 강도
  chosen_reading: ‘반드시 녹아 내릴 것입니다’로 옮겨, 용기가 꺾이고 사기가 붕괴되는 원문의 은유적 강도를 유지했습니다.
  alternative_readings:
  - ‘완전히 기가 죽을 것입니다’
  - ‘무너질 것입니다’
  rationale: 히브리어 מסס의 생생한 붕괴 이미지를 약화시키지 않으면서도 한국어 독자에게 자연스럽게 들리도록 했습니다.
  doctrine_reference: 본문 해석상 문제라기보다 시적·수사적 강도의 보존 문제입니다.
