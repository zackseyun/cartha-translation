base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/010.yaml
  text: Even the valiant man whose heart is like a lion’s heart will utterly melt[a], for all Israel knows that your father is a mighty man[b], and that the men with him are valiant men.
  footnotes:
  - marker: a
    text: Or 'man of valor' / 'mighty man' for both occurrences of חַיִל-based idioms in this verse.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'will melt, melt'—an emphatic construction meaning 'will utterly melt' or 'will surely lose heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그도 비록 마음이 사자의 마음 같은 용맹한 사람이라도[a], 반드시 녹아 내릴 것입니다[b]. 온 이스라엘이 당신의 아버지는 용사이며, 그와 함께 있는 이들도 용맹한 사람들이라는 것을 알고 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘용맹의 아들’이라는 관용 표현입니다. 이 절의 뒤쪽에도 같은 어근의 복수 표현이 나오며, ‘용맹한 사람들’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘녹다’ 동사의 강조형을 써서 ‘반드시/완전히 녹아 내리다’는 뜻을 나타냅니다.
    reason: lexical_alternative
