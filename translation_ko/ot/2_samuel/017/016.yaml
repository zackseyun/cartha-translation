source:
  edition: WLC
  text: וְ/עַתָּ֡ה שִׁלְח֣וּ מְהֵרָה֩ וְ/הַגִּ֨ידוּ לְ/דָוִ֜ד לֵ/אמֹ֗ר אַל תָּ֤לֶן הַ/לַּ֨יְלָה֙ בְּ/עַֽרְב֣וֹת הַ/מִּדְבָּ֔ר וְ/גַ֖ם עָב֣וֹר תַּעֲב֑וֹר פֶּ֚ן יְבֻלַּ֣ע לַ/מֶּ֔לֶךְ וּ/לְ/כָל הָ/עָ֖ם אֲשֶׁ֥ר אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/016.yaml
  text: Now send quickly and tell David[a], saying, ‘Do not stay tonight at the fords of the wilderness, but be sure to cross over, lest the king and all the people who are with him be swallowed up.’
  footnotes:
  - marker: a
    text: Or 'in the plains of the wilderness.' The Hebrew phrase can denote desert lowlands/plains; here 'fords' is chosen because the immediate context stresses crossing over and imminent danger near a crossing point.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 빨리 사람을 보내 다윗에게 말하십시오. ‘오늘 밤 광야의 나루터들에 머물지 말고, 반드시 건너가십시오. 그렇지 않으면 왕과 그와 함께 있는 모든 백성이 삼켜질 수 있습니다.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁלְחוּ מְהֵרָה
  english_pob_choice: send quickly
  chosen_korean: 빨리 사람을 보내
  alternatives_korean:
  - 서둘러 보내십시오
  - 속히 보내십시오
  lexicon: HALOT
  rationale: 즉각성을 살리면서 한국어 명령문으로 자연스럽게 풀었습니다. 대상이 복수 명령이라 ‘사람을 보내’로 옮기는 것이 한국어 표현에 맞습니다.
- source_word: וְהַגִּידוּ לְדָוִד לֵאמֹר
  english_pob_choice: and tell David, saying
  chosen_korean: 다윗에게 말하십시오
  alternatives_korean:
  - 다윗에게 전하십시오
  - 다윗에게 알리십시오
  lexicon: HALOT
  rationale: 히브리어의 전형적인 전달 공식은 한국어에서 ‘말하십시오’로 간결하게 살릴 수 있습니다. ‘말하며 이르되’ 같은 직역은 문장이 부자연스러워집니다.
- source_word: בְּעַרְב֣וֹת הַמִּדְבָּר
  english_pob_choice: at the fords of the wilderness
  chosen_korean: 광야의 나루터들에
  alternatives_korean:
  - 광야의 평지에
  - 광야의 건넘길에
  lexicon: HALOT
  rationale: 문맥상 곧바로 ‘건너가라’는 명령과 위험 경고가 이어지므로, 지리적으로 ‘건너는 지점’이라는 뜻을 살려 ‘나루터들’로 옮겼습니다. 본문이 가리키는 장소성을 유지하면서도 한국어로 자연스럽습니다.
- source_word: יְבֻלַּע
  english_pob_choice: be swallowed up
  chosen_korean: 삼켜질 수 있습니다
  alternatives_korean:
  - 멸망할 수 있습니다
  - 휩쓸릴 수 있습니다
  lexicon: HALOT
  rationale: 히브리어의 생생한 ‘삼키다’ 이미지를 보존했습니다. 군사적 위험의 결과를 뜻하지만, 의미를 약화시키지 않기 위해 완곡한 ‘위험하다’로 바꾸지 않았습니다.
theological_decisions:
- issue: 경고문의 강도와 이미지 보존
  chosen_reading: ‘삼켜질 수 있습니다’로 옮겨, 단순한 패배가 아니라 포획·붕괴의 위협을 드러냈습니다.
  alternative_readings:
  - ‘멸망할 수 있습니다’
  - ‘파괴될 수 있습니다’
  rationale: 동사의 직접 이미지를 유지하는 것이 본문의 긴박함과 경고성을 더 정확히 전달합니다.
  doctrine_reference: 서사 문맥의 위기 경고 표현
