  text: and I will bring back all the people to you[a], as when all return, the man whom you seek will be gone; all the people will be at peace.
  footnotes:
  - marker: a
    text: 'Hebrew is difficult: literally, ''as the return of all, the man whom you seek.'' The sense is that if the one man sought is dealt with, everyone else will return.'
