  text: and I will bring back all the people to you[a], as when all return, the man whom you seek will be gone; all the people will be at peace.
  footnotes:
  - marker: a
    text: 'Hebrew is difficult: literally, ''as the return of all, the man whom you seek.'' The sense is that if the one man sought is dealt with, everyone else will return.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 모든 백성을 당신에게 돌아오게 하겠습니다. 마치 모든 사람이 돌아올 때를 맞추듯, 당신이 찾는 그 사람은 없어질 것이고, 모든 백성은 평안할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 중간절은 매우 난해합니다. 직역하면 ‘모든 사람의 돌아옴처럼, 당신이 찾는 그 사람’에 가깝습니다. 문맥상 의미는 찾는 한 사람을 처리하면 다른 모든 사람은 돌아온다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  english_pob_choice: and I will bring back
  chosen_korean: 내가 … 돌아오게 하겠습니다
  alternatives_korean:
  - 내가 … 다시 데려오겠습니다
  - 내가 … 회복시키겠습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 ‘돌아오게 하다’로 옮기되, 군사·정치적 맥락에 맞는 자연스러운 합쇼체로 표현했습니다.
- source_word: כָל הָעָם
  english_pob_choice: all the people
  chosen_korean: 모든 백성
  alternatives_korean:
  - 모든 사람들
  - 온 백성
  lexicon: HALOT
  rationale: 히브리어 עָם의 집단성을 유지하면서도 한국어에서 자연스럽고 공적인 뉘앙스를 주는 ‘백성’을 택했습니다.
- source_word: כְּשׁוּב הַכֹּל
  english_pob_choice: as when all return
  chosen_korean: 마치 모든 사람이 돌아올 때를 맞추듯
  alternatives_korean:
  - 모든 것이 돌아올 때처럼
  - 모두가 돌아오는 것처럼
  lexicon: HALOT
  rationale: 히브리어의 생략적이고 난해한 구조를 직역하면 어색해지므로, POB의 해석을 따라 ‘전체가 돌아오는 상황’과 뒤의 대비를 한국어로 풀어냈습니다.
- source_word: יִהְיֶה שָׁלוֹם
  english_pob_choice: will be at peace
  chosen_korean: 평안할 것입니다
  alternatives_korean:
  - 평강할 것입니다
  - 안전할 것입니다
  lexicon: HALOT
  rationale: שָׁלוֹם의 상태 의미를 살리되, 전쟁이 끝난 뒤의 공동체적 안정이라는 문맥에 맞게 ‘평안’으로 옮겼습니다.
theological_decisions:
- issue: 난해한 중간절의 의미를 어떻게 드러낼지
  chosen_reading: 아히도벨의 제안은 ‘찾는 그 사람’이 제거되면 나머지 백성은 돌아올 것이라는 대비로 읽었습니다.
  alternative_readings:
  - 그 사람이 돌아오는 때와 같은 방식으로 이해
  - 문법을 최대한 직역하여 모호성을 그대로 유지
  rationale: 본문의 핵심은 한 사람의 처리로 전체의 귀환과 평안이 보장된다는 정치적 계산이며, 이를 한국어에서 자연스럽게 드러내는 것이 원문의 의도를 가장 잘 전달합니다.
  doctrine_reference: 본문 해석상의 서술적 판단
