translation:
  language: ko
  text: 제가 온 백성을 왕께로 돌아오게 하겠습니다. 모두가 돌아오는 것은 왕께서 찾으시는 그 한 사람이 돌아오는 것과 같으니[a], 온 백성은 평안할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 중간절은 문법과 의미가 난해합니다. 직역하면 ‘모두의 돌아옴처럼, 당신이 찾는 그 사람’입니다. 문맥상 아히도벨은 왕이 찾는 한 사람과 나머지 백성의 귀환을 연결하여 말하는 것으로 보입니다.
    reason: lexical_alternative
