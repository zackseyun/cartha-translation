theological_decisions:
- issue: 난해한 중간절의 의미를 어떻게 드러낼지
  chosen_reading: 아히도벨의 제안은 ‘찾는 그 사람’이 제거되면 나머지 백성은 돌아올 것이라는 대비로 읽었습니다.
  alternative_readings:
  - 그 사람이 돌아오는 때와 같은 방식으로 이해
  - 문법을 최대한 직역하여 모호성을 그대로 유지
  rationale: 본문의 핵심은 한 사람의 처리로 전체의 귀환과 평안이 보장된다는 정치적 계산이며, 이를 한국어에서 자연스럽게 드러내는 것이 원문의 의도를 가장 잘 전달합니다.
  doctrine_reference: 본문 해석상의 서술적 판단
