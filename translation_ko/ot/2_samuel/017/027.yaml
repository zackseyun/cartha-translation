  yaml_path: translation/ot/2_samuel/017/027.yaml
  text: Now when David came to Mahanaim, Shobi son of Nahash from Rabbah of the Ammonites, and Machir son of Ammiel from Lo-debar, and Barzillai the Gileadite from Rogelim,
translation:
  language: ko
  text: 다윗이 마하나임에 이르렀을 때에, 암몬 사람 라빠의 나하스의 아들 소비와 로데발의 암미엘의 아들 마길과 길르앗 사람 바르실래가 로겔림에서
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Now ...
  chosen_korean: ~었을 때에
  alternatives_korean:
  - 그때
  - 이제
  lexicon: HALOT
  rationale: 새로운 사건 전환을 자연스럽게 잇되, 히브리어 서사 도입의 흐름을 과장하지 않도록 시간 부사절로 옮겼습니다.
- source_word: כְּבוֹא
  english_pob_choice: when ... came
  chosen_korean: 이르렀을 때에
  alternatives_korean:
  - 올 때
  - 도착하자
  lexicon: HALOT
  rationale: 도착 동작을 현재감 있게 살리면서 한국어 서사에서 가장 자연스러운 시간 표현으로 옮겼습니다.
- source_word: מֵרַבַּת בְּנֵי עַמּוֹן
  english_pob_choice: from Rabbah of the Ammonites
  chosen_korean: 암몬 사람 라빠
  alternatives_korean:
  - 암몬 사람들의 라빠
  - 암몬인의 라빠
  lexicon: HALOT
  rationale: 지명 라빠와 민족 표지를 함께 보존하되, 한국어에서는 ‘~의’보다 ‘암몬 사람 라빠’가 간결하고 원문 관계를 잘 드러냅니다.
- source_word: מִלֹּא דְבָר
  english_pob_choice: from Lo-debar
  chosen_korean: 로데발
  alternatives_korean:
  - 로드바르
  - 로데바르
  lexicon: HALOT
  rationale: 통용되는 음역을 따르되, 지명으로서의 식별성을 위해 현대 한글 표기를 사용했습니다.
- source_word: הַגִּלְעָדִי
  english_pob_choice: the Gileadite
  chosen_korean: 길르앗 사람
  alternatives_korean:
  - 길르앗인
  - 길르앗 사람
  lexicon: HALOT
  rationale: 형용사형 민족/지역 표지를 한국어에서 자연스럽게 풀어, 고유한 출신지를 드러냈습니다.
