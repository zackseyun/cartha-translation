  source_fidelity: 인명·지명, 세 인물의 병렬, 각 인물에 연결된 출신지는 대체로 원문에 충실합니다. 다만 ‘암몬 사람 라빠’는 현대 한국어에서 지명과 민족 관계가 불분명하고, 통용 표기와도 다소 어긋납니다.
  naturalness: 원문의 미완결 열거 문장을 유지한 점은 적절합니다. 그러나 ‘암몬 사람 라빠의 나하스의 아들’은 소유격이 연속되어 읽기 어렵습니다. ‘출신’을 사용하면 관계가 자연스럽고 분명해집니다.
  terminology: 마하나임, 소비, 나하스, 암미엘, 마길, 로데발, 길르앗, 바르실래, 로겔림은 일관된 음역으로 유지할 수 있습니다. Rabbah는 한국어 성경 및 일반 음역에 맞추어 ‘랍바’로 쓰는 편이 안전합니다.
