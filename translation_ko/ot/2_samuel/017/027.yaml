  - severity: low
    issue: 연속된 소유격으로 인한 수식 관계의 불명료성
    rationale: ‘암몬 사람 라빠의 나하스의 아들 소비’보다 ‘암몬 사람들의 랍바 출신 나하스의 아들 소비’가 소비와 나하스 및 랍바의 관계를 더 자연스럽게 나타냅니다.
