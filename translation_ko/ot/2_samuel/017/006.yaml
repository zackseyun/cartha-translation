base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/006.yaml
  text: When Hushai came to Absalom[a], Absalom said to him, “Ahithophel has spoken in this way. Should we do as he says? If not, you speak.”
  footnotes:
  - marker: a
    text: Or “Should we do according to his word?” The Hebrew is more literally “Should we do his word?” meaning to carry out Ahithophel’s counsel.
    reason: lexical_alternative
translation:
  language: ko
  text: 후새가 압살롬에게 이르니, 압살롬이 그에게 말했습니다. 「아히도벨이 이런 식으로 말했습니다. 우리가 그가 말한 대로 해야 합니까? 아니라면, 당신이 말하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그의 말을 해야 합니까?”이지만, 여기서는 아히도벨의 조언을 실행하라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... אֶל
  english_pob_choice: came ... to
  chosen_korean: …에게 이르니
  alternatives_korean:
  - …에게 왔습니다
  - …에게 도착했습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서, 히브리어의 방향성(אֶל)을 ‘…에게’로 반영하기에 ‘이르다’가 가장 간결하고 격식 있는 표현입니다.
- source_word: כַּדָּבָר הַזֶּה
  english_pob_choice: in this way
  chosen_korean: 이런 식으로
  alternatives_korean:
  - 이렇게
  - 이 말씀대로
  lexicon: HALOT
  rationale: 직전 아히도벨의 발언 내용을 가리키므로, ‘말씀’처럼 지나치게 해석하지 않고 내용·방식의 지시를 살리는 표현을 택했습니다.
- source_word: אֶת דְּבָרוֹ
  english_pob_choice: what he says
  chosen_korean: 그가 말한 대로
  alternatives_korean:
  - 그의 말을
  - 그의 말대로
  - 그가 한 말대로
  lexicon: HALOT
  rationale: 직역하면 ‘그의 말’을 뜻하지만, 여기서는 아히도벨의 조언을 실행하라는 뜻이므로 한국어에서는 ‘말한 대로’가 의미를 가장 분명하게 드러냅니다.
- source_word: אַתָּה דַבֵּר
  english_pob_choice: you speak
  chosen_korean: 당신이 말하십시오
  alternatives_korean:
  - 당신이 말씀하십시오
  - 네가 말해라
  lexicon: HALOT
  rationale: 독립대명사 ‘אַתָּה’의 강조를 살리기 위해 주어를 드러냈고, 압살롬의 발화 상황에 맞춰 정중한 명령형으로 옮겼습니다.
theological_decisions:
- issue: 압살롬의 직접화법 안에서의 호칭과 말투
  chosen_reading: 직접화법은 한국어에서 합쇼체로 유지하고, 명령 부분은 ‘당신이 말하십시오’로 옮겼습니다.
  alternative_readings:
  - 반말체로 ‘네가 말해라’
  - 더 중립적으로 ‘말하십시오’
  rationale: 본문은 왕자 간 대화이지만 서술자는 현대 표준 문체의 공적 서술을 요구하므로, 직접 인용 안에서도 품위 있는 합쇼체를 유지하되, 히브리어의 강조 구조는 주어를 세워 반영했습니다.
  doctrine_reference: Narrative register and direct speech fidelity
