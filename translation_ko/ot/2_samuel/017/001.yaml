source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲחִיתֹ֖פֶל אֶל אַבְשָׁלֹ֑ם אֶבְחֲרָ֣ה נָּ֗א שְׁנֵים עָשָׂ֥ר אֶ֨לֶף֙ אִ֔ישׁ וְ/אָק֛וּמָה וְ/אֶרְדְּפָ֥ה אַחֲרֵי דָוִ֖ד הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/001.yaml
  text: Then Ahithophel said to Absalom[a], “Please let me choose twelve thousand men, and let me arise and pursue David tonight.”
  footnotes:
  - marker: a
    text: Or, more formally, “Please, I will choose twelve thousand men, and I will arise and pursue David this night.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아히도벨이 압살롬에게 말했습니다. 「부디 제가 만 이천 명을 택하게 하시고, 제가 일어나 오늘 밤 다윗을 추격하게 하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역에 더 가깝게는 ‘만 이천 명을 택하겠습니다’ 또는 ‘만 이천 명을 고르겠습니다’가 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  lexicon: WLC
  rationale: 서사 진행을 자연스러운 현대 한국어로 살리되, 단순한 접속보다 시간적 전개를 분명히 드러내기 위해 ‘그때’를 택했습니다.
- source_word: אֶבְחֲרָה נָּא
  english_pob_choice: Please let me choose
  chosen_korean: 부디 제가 ... 택하게 하시고
  alternatives_korean:
  - 부디 제가 ... 선택하게 하십시오
  - 제가 ... 고르게 해주십시오
  lexicon: HALOT
  rationale: 코호르타티브와 נָא의 청유·정중한 요청을 한국어의 공손한 요청형으로 옮겼습니다. ‘택하다’는 군사적 선발 맥락에 무리 없이 맞습니다.
- source_word: שְׁנֵים עָשָׂ֥ר אֶ֨לֶף֙ אִ֔ישׁ
  english_pob_choice: twelve thousand men
  chosen_korean: 만 이천 명
  alternatives_korean:
  - 만 이천 사람
  - 만 이천의 군사
  lexicon: HALOT
  rationale: 히브리어의 ‘사람/남자’ 표지를 한국어에서 자연스럽게 수량 표현으로 살리되, 문맥상 군사 동원임은 본문 흐름으로 드러난다고 보았습니다.
- source_word: וְ/אָקוּמָה
  english_pob_choice: and I will arise
  chosen_korean: 제가 일어나
  alternatives_korean:
  - 제가 일어나서
  - 제가 떠나
  lexicon: HALOT
  rationale: קוּם의 기본 의미인 ‘일어나다’를 보존했습니다. 이후 동작과 연결되는 준비·출발의 뉘앙스는 문맥이 보완합니다.
- source_word: וְ/אֶרְדְּפָ֥ה אַחֲרֵי
  english_pob_choice: and pursue
  chosen_korean: 추격하게 하십시오
  alternatives_korean:
  - 뒤쫓게 하십시오
  - 추적하게 하십시오
  lexicon: HALOT
  rationale: רדף의 군사적 의미를 살려 ‘추격하다’로 옮겼습니다. ‘다윗을 추격하다’는 한국어에서도 전투적 추격의 긴박감을 잘 드러냅니다.
theological_decisions:
- issue: 아히도벨의 제안문에 담긴 정중한 청유와 의지 표현
  chosen_reading: 직접 인용 안에서는 요청형으로 통일해 ‘부디 제가 ... 하게 하십시오’로 옮겼습니다.
  alternative_readings:
  - ‘제가 ... 하겠습니다’처럼 미래 서술형으로 옮김
  - ‘제가 ... 하도록 허락해 주십시오’로 풀어씀
  rationale: 히브리어의 코호르타티브 연속은 단순 예고보다 발화자의 의도와 제안을 드러내므로, 한국어에서도 청유형이 가장 원문 기능에 가깝습니다.
  doctrine_reference: 서사 텍스트의 화행 보존
