  source_fidelity: 원문의 עֹמְדִים는 ‘서 있다’로 옮길 수 있으며, 엔로겔이라는 지명과 요나단·아히마아스·다윗 왕의 표기는 적절합니다. 그러나 לְהֵרָאוֹת는 ‘보이다/발각되다’라는 수동 의미이므로, 초안의 ‘볼 수 없었기’는 주어가 다른 사람을 볼 수 없었다는 뜻이 되어 원문과 다릅니다. 또한 문맥의 전달 체계를 반영하여 ‘알리곤 했습니다’로 옮기는 것이 안전합니다.
