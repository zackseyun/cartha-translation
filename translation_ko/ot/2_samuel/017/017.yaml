base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/017.yaml
  text: Now Jonathan and Ahimaaz were standing at En-rogel[a], and a female servant would go and tell them, and they would go and tell King David[b], for they could not be seen entering the city.
  footnotes:
  - marker: a
    text: Or 'were standing at En-rogel.' The Hebrew participle literally says 'standing,' but in context it likely means they were stationed there.
    reason: lexical_alternative
  - marker: b
    text: Or 'the maidservant' / 'the servant girl.' The Hebrew שִׁפְחָה refers specifically to a female servant.
    reason: lexical_alternative
translation:
  language: ko
  text: 요나단과 아히마아스는 엔-로겔에 서 있었습니다[a]. 한 여종[b]이 가서 그들에게 알리곤 했고, 그들은 가서 다윗 왕에게 알리곤 했습니다. 그들이 성 안으로 들어갈 때 보일 수 없었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘엔-로겔에 머물러 있었습니다.’ 히브리어 분사 עֹמְדִים는 문자적으로 ‘서 있다’는 뜻이지만, 문맥상 그곳에 배치되어 있었음을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여자 종’ / ‘하녀’ / ‘여자 노예’. 히브리어 שִׁפְחָה는 여성 종을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמְדִים
  english_pob_choice: were standing
  chosen_korean: 서 있었습니다
  alternatives_korean:
  - 머물러 있었습니다
  - 서 있었습니다
  lexicon: HALOT
  rationale: 원문의 분사 עמד는 문자적으로는 ‘서다’이지만, 문맥상 특정 지점에 계속 위치해 있음을 나타내므로 한국어는 자연스럽게 ‘서 있었습니다’로 옮겼습니다.
- source_word: בְּעֵין רֹגֵל
  english_pob_choice: at En-rogel
  chosen_korean: 엔-로겔에
  alternatives_korean:
  - 엔-로겔에서
  - 엔-로겔 곁에
  lexicon: HALOT
  rationale: 지명은 음역하고, 전치사는 위치를 나타내는 ‘-에’로 처리하는 것이 가장 자연스럽습니다.
- source_word: הַשִּׁפְחָה
  english_pob_choice: a female servant
  chosen_korean: 한 여자 종
  alternatives_korean:
  - 하녀
  - 여종
  - 여자 노예
  lexicon: HALOT
  rationale: שִׁפְחָה는 여성 종을 가리키므로 ‘여자 종’이 본문의 기능을 드러내면서도 bonded status를 과장하지 않습니다. 기사와 함께 처음 등장하는 인물처럼 자연스럽게 처리했습니다.
- source_word: לְהֵרָאוֹת
  english_pob_choice: be seen
  chosen_korean: 볼 수 없었기 때문입니다
  alternatives_korean:
  - 보이지 않았기 때문입니다
  - 드러나지 않았기 때문입니다
  lexicon: HALOT
  rationale: 핵심은 도시로 들어가는 장면이 발각되지 않는다는 점이므로, 수동적 의미를 한국어 관용에 맞게 ‘볼 수 없었습니다’로 옮겼습니다.
