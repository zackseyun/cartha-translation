  lexicon: HALOT
  rationale: 여기서는 특정한 신분 호칭보다 앞서 소개된 인물을 가리키므로, 문맥에 맞게 ‘그 여자’로 단순하게 옮겼습니다.
- source_word: הַבַּיְתָה
  english_pob_choice: at the house
  chosen_korean: 집에 있는
  alternatives_korean:
