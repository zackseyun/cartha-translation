revisions:
- from: 압살롬의 종들이 집에 있는 그 여자에게 와서 말했습니다. “아히마아스와 요나단이 어디 있느냐?” 그 여자가 그들에게 말했습니다. “그들이 물의 시내를 건너갔습니다.” 그들은 찾았으나 발견하지 못했고, 예루살렘으로 돌아갔습니다.[a]
  to: 압살롬의 종들이 그 집으로 와서 그 여인에게 물었습니다. “아히마아스와 요나단이 어디 있습니까?” 그 여인이 그들에게 말했습니다. “그들은 물길[a]을 건너갔습니다.” 그들은 찾았으나 그들을 발견하지 못하고 예루살렘으로 돌아갔습니다.
  rationale: 현대 공식 존대체를 일관되게 적용하고, 집을 향해 왔다는 원문의 방향성을 더 분명히 했습니다. 불확실한 히브리어 지형 표현은 자연스러운 ‘물길’로 옮기되, 주석을 해당 어구에 연결하여 대안과 불확실성을 보존했습니다.
