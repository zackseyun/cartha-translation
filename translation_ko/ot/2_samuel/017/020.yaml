base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/020.yaml
  text: Absalom’s servants came to the woman at the house and said[a], “Where are Ahimaaz and Jonathan?” The woman said to them, “They crossed over the brook of water.” They searched, but did not find them, so they returned to Jerusalem.
  footnotes:
  - marker: a
    text: Or “the brook” or “the water channel” for “the stream of water.” The Hebrew phrase is unusual (מִיכַל הַמָּיִם), and the exact nuance of the watercourse is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 압살롬의 종들이 집에 있는 그 여자에게 와서 말했습니다. “아히마아스와 요나단이 어디 있느냐?” 그 여자가 그들에게 말했습니다. “그들이 물의 시내를 건너갔습니다.” 그들은 찾았으나 발견하지 못했고, 예루살렘으로 돌아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현 מִיכַל הַמָּיִם은 이례적이어서, 물길의 정확한 성격은 확정하기 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אַבְשָׁלוֹם
  english_pob_choice: Absalom’s servants
  chosen_korean: 압살롬의 종들
  alternatives_korean:
  - 압살롬의 사람들
  - 압살롬의 신하들
  lexicon: HALOT
  rationale: עֶבֶד은 문맥에 따라 종, 신하, 노예가 될 수 있는데, 이 절에서는 압살롬을 섬기는 수행자들이라는 뜻이 가장 자연스러워 ‘종들’로 옮겼습니다.
- source_word: הָאִשָּׁה
  english_pob_choice: the woman
  chosen_korean: 그 여자
  alternatives_korean:
  - 그 여인
  - 그 여자 사람
  lexicon: HALOT
  rationale: 여기서는 특정한 신분 호칭보다 앞서 소개된 인물을 가리키므로, 문맥에 맞게 ‘그 여자’로 단순하게 옮겼습니다.
- source_word: הַבַּיְתָה
  english_pob_choice: at the house
  chosen_korean: 집에 있는
  alternatives_korean:
  - 집으로
  - 집 안으로
  lexicon: HALOT
  rationale: 방향성을 가진 집합적 표현을 한국어에서 자연스럽게 풀어, 도착한 장소를 나타내는 ‘집에 있는’으로 옮겼습니다.
- source_word: מִיכַל הַמָּיִם
  english_pob_choice: the stream of water
  chosen_korean: 물의 시내
  alternatives_korean:
  - 시냇물
  - 물길
  - 개울
  lexicon: HALOT
  rationale: 히브리어 표현이 다소 이례적이므로, 특정 지형 용어로 단정하지 않고 ‘물의 시내’로 옮겨 원문의 불확실성을 보존했습니다.
