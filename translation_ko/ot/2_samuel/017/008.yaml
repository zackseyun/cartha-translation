base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/008.yaml
  text: Hushai said[a], “You know your father and his men, that they are mighty men and bitter of soul, like a bear robbed of her cubs in the field. And your father is a man of war[b]; he will not spend the night with the troops.”
  footnotes:
  - marker: a
    text: Or 'fierce' or 'embittered'; literally 'bitter of soul.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he will not lodge with the people'; here 'people' likely refers to David's fighting force.
    reason: lexical_alternative
translation:
  language: ko
  text: 후새가 말했습니다. “당신은 당신의 아버지와 그의 부하들을 잘 아십니다. 그들은 용사들이며, 마음이 몹시 격한 사람들입니다[a]. 들에서 새끼를 빼앗긴 암곰과 같습니다. 또 당신의 아버지는 전쟁에 능한 사람입니다. 그는 군사들과 함께 밤을 지내지 않을 것입니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사나운 사람들’; 문자적으로는 ‘영혼이 쓰라린 자들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 백성과 함께 묵지 않을 것입니다’; 여기서 ‘백성’은 다윗과 함께한 전투 집단을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִבֹּרִים
