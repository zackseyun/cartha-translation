  text: וַ/יֹּ֣אמֶר חוּשַׁ֗י אַתָּ֣ה יָ֠דַעְתָּ אֶת אָבִ֨י/ךָ וְ/אֶת אֲנָשָׁ֜י/ו כִּ֧י גִבֹּרִ֣ים הֵ֗מָּה וּ/מָרֵ֥י נֶ֨פֶשׁ֙ הֵ֔מָּה כְּ/דֹ֥ב שַׁכּ֖וּל בַּ/שָּׂדֶ֑ה וְ/אָבִ֨י/ךָ֙ אִ֣ישׁ מִלְחָמָ֔ה וְ/לֹ֥א יָלִ֖ין אֶת הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/008.yaml
  text: Hushai said[a], “You know your father and his men, that they are mighty men and bitter of soul, like a bear robbed of her cubs in the field. And your father is a man of war[b]; he will not spend the night with the troops.”
  footnotes:
  - marker: a
    text: Or 'fierce' or 'embittered'; literally 'bitter of soul.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he will not lodge with the people'; here 'people' likely refers to David's fighting force.
    reason: lexical_alternative
translation:
  language: ko
  text: 후새가 말했습니다. “당신은 당신의 아버지와 그의 신하들을 압니다. 그들은 용사들이며, 마음이 몹시 괴로운 자들입니다. 마치 들판에서 새끼를 빼앗긴 곰과 같습니다. 당신의 아버지는 전쟁의 사람이므로, 그 백성과 함께 밤을 지내지 않을 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영혼이 쓰라린’ ‘격한’; 문자적으로는 ‘마음이 괴로운’입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그 백성과 함께 묵지 않을 것입니다’; 여기서 ‘백성’은 다윗의 전투 부대를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִבֹּרִים
  english_pob_choice: mighty men
  chosen_korean: 용사들
  alternatives_korean:
  - 힘센 사람들
  - 장사들
  lexicon: HALOT
  rationale: 전쟁 상황에서 כוח/용맹을 드러내는 복수 표현으로, 현대 한국어에서 가장 자연스럽게 무장한 강자들을 가리키는 말은 ‘용사들’입니다.
- source_word: מָרֵי נֶפֶשׁ
  english_pob_choice: bitter of soul
  chosen_korean: 마음이 몹시 괴로운 자들
  alternatives_korean:
  - 영혼이 쓰라린 자들
  - 마음이 쓰린 자들
  - 격한 자들
  lexicon: HALOT
  rationale: 히브리어 관용구의 정서적 강도를 살리면서도 한국어에서 어색하지 않도록, ‘마음이 몹시 괴로운’으로 풀어 번역했습니다.
- source_word: כְּדֹב שַׁכּוּל
  english_pob_choice: like a bear robbed of her cubs
  chosen_korean: 새끼를 빼앗긴 곰
  alternatives_korean:
  - 새끼를 잃은 곰
  - 새끼를 빼앗긴 어미곰
  lexicon: HALOT
  rationale: 원문의 비유적 공격성을 보존하되, 현대 한국어에서 즉시 이해되도록 ‘새끼를 빼앗긴 곰’으로 옮겼습니다.
- source_word: אִישׁ מִלְחָמָה
  english_pob_choice: a man of war
  chosen_korean: 전쟁의 사람
  alternatives_korean:
  - 전쟁의 사람답지
  - 전쟁에 능한 사람
  - 전사의 사람
  lexicon: HALOT
  rationale: 직역에 가까운 구조를 유지하면서도 한국어에서 무난하게 읽히는 표현으로, 다윗의 전투 경험을 서술하는 명사구를 살렸습니다.
- source_word: לֹא יָלִין אֶת הָעָם
  english_pob_choice: he will not spend the night with the troops
  chosen_korean: 그 백성과 함께 밤을 지내지 않을 것입니다
  alternatives_korean:
  - 그 사람들과 함께 묵지 않을 것입니다
  - 그 군사들과 함께 밤을 보내지 않을 것입니다
  lexicon: HALOT
  rationale: 문맥상 군사 집단을 가리키지만, 히브리어 עָם의 폭을 지나치게 좁히지 않도록 ‘그 백성’으로 두되 군사적 맥락은 앞뒤로 분명히 했습니다.
theological_decisions:
- issue: 화자의 직접 인용에서 감정 묘사의 강도를 얼마나 유지할지
  chosen_reading: ‘마음이 몹시 괴로운 자들’로 옮겨 원문의 격한 감정과 위협적 분위기를 유지했습니다.
  alternative_readings:
  - ‘격한 자들’로 완화
  - ‘분노한 자들’로 해석
  rationale: 이 절은 아브살롬을 설득하는 전략적 경고이므로, 원문의 심리적 압박과 불안감을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 서사 문맥의 정서적·수사적 보존
- issue: ‘그 백성’의 범위를 어떻게 처리할지
  chosen_reading: 군사적 맥락을 고려하면서도 본문 표현을 따라 ‘그 백성’으로 유지했습니다.
  alternative_readings:
  - ‘그 군사들’로 명시
  - ‘그 무리’로 일반화
  rationale: POB 영어본도 ‘the troops’와 ‘the people’ 사이에서 군사 맥락을 해설적으로 반영했으며, 히브리어 עָם의 폭을 과도하게 축소하지 않는 쪽을 택했습니다.
  doctrine_reference: 본문 어휘의 범위와 문맥 해석
