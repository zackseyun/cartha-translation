  - 장사들
  lexicon: HALOT
  rationale: 전쟁 상황에서 כוח/용맹을 드러내는 복수 표현으로, 현대 한국어에서 가장 자연스럽게 무장한 강자들을 가리키는 말은 ‘용사들’입니다.
- source_word: מָרֵי נֶפֶשׁ
