  lexicon: HALOT
  rationale: 히브리어 관용구의 정서적 강도를 살리면서도 한국어에서 어색하지 않도록, ‘마음이 몹시 괴로운’으로 풀어 번역했습니다.
- source_word: כְּדֹב שַׁכּוּל
  english_pob_choice: like a bear robbed of her cubs
  chosen_korean: 새끼를 빼앗긴 곰
  alternatives_korean:
  - 새끼를 잃은 곰
