source:
  edition: WLC
  text: מִשְׁכָּ֤ב וְ/סַפּוֹת֙ וּ/כְלִ֣י יוֹצֵ֔ר וְ/חִטִּ֥ים וּ/שְׂעֹרִ֖ים וְ/קֶ֣מַח וְ/קָלִ֑י וּ/פ֥וֹל וַ/עֲדָשִׁ֖ים וְ/קָלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/028.yaml
  text: beds[a], basins, and pottery vessels, and wheat, barley, flour[b], roasted grain, beans, lentils[d][c], and parched grain.
  footnotes:
  - marker: a
    text: Or 'bowls' for 'basins.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'vessels of a potter'; that is, earthenware or pottery vessels.
    reason: lexical_alternative
  - marker: c
    text: Or 'parched grain' for 'roasted grain.'
    reason: lexical_alternative
  - marker: d
    text: The Hebrew likely refers more specifically to broad beans (fava beans).
    reason: lexical_alternative
translation:
  language: ko
  text: 침대와 대접들과 토기 그릇들과 밀과 보리와 가루와 볶은 곡식과 콩과 렌즈콩과 볶은 곡식입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사발들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘토기장이의 그릇들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘볶은 곡물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 아마도 더 구체적으로 넓은콩(파바콩)을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּב
  english_pob_choice: beds
  chosen_korean: 침대
  alternatives_korean:
  - 잠자리
  - 깔개
  lexicon: HALOT
  rationale: 문맥이 보급품 목록이므로 ‘누워 자는 가구/설비’의 구체성을 살려 현대 한국어의 ‘침대’로 옮겼습니다.
- source_word: סַפּוֹת
  english_pob_choice: basins
  chosen_korean: 대접들
  alternatives_korean:
  - 그릇들
  - 사발들
  lexicon: HALOT
  rationale: 그릇류의 용기라는 점을 살리면서도 한국어에서 기능적으로 자연스러운 일반 명사로 ‘대접들’을 선택했습니다.
- source_word: כְלִי יוֹצֵר
  english_pob_choice: pottery vessels
  chosen_korean: 토기 그릇들
  alternatives_korean:
  - 질그릇들
  - 옹기 그릇들
  lexicon: HALOT
  rationale: 직역하면 ‘토기장이의 그릇들’이지만, 재질을 드러내는 ‘토기 그릇들’이 의미를 더 분명하게 전달합니다.
- source_word: קָלִי
  english_pob_choice: roasted grain / parched grain
  chosen_korean: 볶은 곡식
  alternatives_korean:
  - 볶은 낟알
  - 볶은 곡물
  lexicon: HALOT
  rationale: 가열 처리된 곡식을 가리키므로 ‘볶은 곡식’이 가장 직관적입니다. 같은 원어의 반복도 한국어에서 그대로 살렸습니다.
theological_decisions:
- issue: 목록에 반복되는 קָלִי를 어떻게 처리할지
  chosen_reading: 앞의 ‘볶은 곡식’과 끝의 ‘볶은 곡식’을 모두 보존했습니다.
  alternative_readings:
  - 끝의 항목을 ‘마른 곡식’ 등으로 달리 번역
  rationale: 히브리어 본문은 같은 단어를 반복하므로, 목록의 반복성과 리듬을 유지하는 쪽이 원문 구조에 더 충실합니다.
  doctrine_reference: 원문 반복 보존 원칙
