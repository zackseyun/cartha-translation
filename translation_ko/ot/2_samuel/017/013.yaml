review_pass:
  verdict: revise
  source_fidelity: ‘나루터’는 נַחַל(나할)의 의미와 맞지 않습니다. 이는 일반적으로 시내, 계류, 골짜기 물길 또는 와디를 뜻하며, 건널목/나루터를 뜻하지 않습니다. 또한 마지막 절은 ‘남지 않게’보다 ‘발견되지 않을 때까지’라는 원문의 수동 표현을 보존하는 편이 더 충실합니다. יֵאָסֵף의 군사적 후퇴·피신 뉘앙스는 ‘물러 들어가면’으로 반영했습니다.
  naturalness: ‘성읍’은 본문의 고전적 지명·군사 문맥에 자연스럽고, 합쇼체 문장도 적절합니다. ‘밧줄을 가져오고’는 히브리어 복수 명사를 한국어의 총칭 단수로 자연스럽게 옮긴 것입니다. ‘그곳에서 작은 돌 하나도 발견되지 않게’는 원문의 전면적 파괴라는 과장 이미지를 명료하게 전달합니다.
  terminology: נַחַל은 본문에서 ‘시내’로 옮기고 각주에서 와디/골짜기 물길의 가능성을 밝혔습니다. צְרוֹר는 ‘작은 돌’로 옮겨 작은 돌 하나조차 남지 않는다는 과장법을 유지했습니다. ‘성읍’, ‘이스라엘’, ‘밧줄’은 문맥과 표준 한국어에 적합합니다.
  issues:
