source:
  edition: WLC
  text: וְ/אִם אֶל עִיר֙ יֵֽאָסֵ֔ף וְ/הִשִּׂ֧יאוּ כָֽל יִשְׂרָאֵ֛ל אֶל הָ/עִ֥יר הַ/הִ֖יא חֲבָלִ֑ים וְ/סָחַ֤בְנוּ אֹת/וֹ֙ עַד הַ/נַּ֔חַל עַ֛ד אֲשֶֽׁר לֹא נִמְצָ֥א שָׁ֖ם גַּם צְרֽוֹר־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/013.yaml
  text: And if he withdraws into a city[a], then all Israel will bring ropes to that city[b], and we will drag it to the wadi until not even a small stone is found there.
  footnotes:
  - marker: a
    text: Or 'brook' or 'stream' for 'wadi' (Heb. naḥal), a seasonal watercourse or ravine.
    reason: lexical_alternative
  - marker: b
    text: Or 'not even a small stone.' The Hebrew says 'not even a pebble/stone' as a hyperbolic image of total destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그가 성읍으로 물러 들어가면, 온 이스라엘이 그 성읍에 밧줄을 가져오고, 우리가 그 성읍을 시내[a]까지 끌고 가서 그곳에서 작은 돌 하나도 발견되지 않게 할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 나할(נַחַל)은 시내, 계류, 골짜기 물길을 뜻하며, 이 지역의 지형에서는 ‘와디’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘작은 돌/조약돌 하나도’라고 하여, 성읍이 완전히 사라질 것이라는 과장된 파괴 이미지를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף
  english_pob_choice: withdraws
  chosen_korean: 들어가면
  alternatives_korean:
  - 피신하면
  - 은신하면
  - 물러들어가면
  lexicon: HALOT
  rationale: 동사 어감은 성읍 안으로의 은신·후퇴를 가리키지만, 한국어에서는 군사적 상황을 자연스럽게 살리는 '들어가면'이 가장 간결하고 문맥에 맞습니다.
- source_word: חֲבָלִים
  english_pob_choice: ropes
  chosen_korean: 밧줄들을
  alternatives_korean:
  - 줄들을
  - 끈들을
  lexicon: HALOT
  rationale: 성읍을 끌어내리는 과장된 군사적 비유를 살리기 위해, 일반적인 '줄'보다 물리적 이미지가 강한 '밧줄'이 적절합니다.
- source_word: הַנַּחַל
  english_pob_choice: the wadi
  chosen_korean: 나루터까지
  alternatives_korean:
  - 와디까지
  - 개천까지
  - 시내까지
  lexicon: HALOT
  rationale: 원문은 성읍을 물길/골짜기 지점까지 끌어가겠다는 뜻이므로, 한국어에서는 지형어를 직역하기보다 문맥의 종착점을 드러내는 표현이 필요합니다. 다만 본 절은 WLC의 지형어를 따라 '나루터'로 옮기기보다, 보다 직접적인 지형 대응이 더 적절하므로 이 항목은 실제 본문 선택을 위한 설명용입니다.
- source_word: גַּם צְרוֹר
  english_pob_choice: not even a small stone
  chosen_korean: 작은 돌 하나도
  alternatives_korean:
  - 조약돌 하나도
  - 자갈 하나도
  - 작은 돌멩이 하나도
  lexicon: HALOT
  rationale: צְרוֹר는 작은 돌/돌멩이를 가리키는 말이므로, 과장법의 최소 단위를 살려 '작은 돌 하나도'로 옮겼습니다.
theological_decisions:
- issue: 과장된 파괴 이미지의 보존
  chosen_reading: 성읍이 밧줄로 끌려가 완전히 파괴되는 군사적 과장을 그대로 살렸습니다.
  alternative_readings:
  - 완전히 무너뜨릴 것입니다
  - 흔적도 없이 없앨 것입니다
  rationale: 이 절은 압살롬의 전략을 과장법으로 묘사하므로, 완화된 표현보다 원문의 폭력성과 총체성을 드러내는 번역이 필요합니다.
  doctrine_reference: 문맥 주해(사무엘하 17장 전반의 전쟁 수사)
