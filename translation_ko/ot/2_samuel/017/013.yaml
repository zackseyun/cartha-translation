  - severity: medium
    issue: ‘작은 돌 하나도 남지 않게’가 원문의 ‘발견되지 않을 때까지’를 변경함
    rationale: 의미상 결과는 유사하지만, 원문은 그 장소에 작은 돌 하나도 발견되지 않는다는 표현을 사용합니다. 이를 직접 보존하는 것이 더 충실합니다.
  - severity: low
    issue: 각주 표지가 해당 어휘 위치에 붙어 있지 않음
    rationale: 어휘 대안 각주는 해당 번역어인 ‘시내’와 ‘작은 돌’ 뒤에 두어 독자가 참조 대상을 분명히 알 수 있게 해야 합니다.
