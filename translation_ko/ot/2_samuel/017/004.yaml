lexical_decisions:
- source_word: וַיִּישַׁר
  english_pob_choice: seemed good
  chosen_korean: 좋게 보였습니다
  alternatives_korean:
  - 옳게 여겨졌습니다
  - 마음에 들었습니다
  - 받아들일 만했습니다
  lexicon: HALOT
  rationale: 히브리어 ישר의 여기서는 도덕적 ‘옳음’보다 제안이 수용·승인되었음을 나타내므로, ‘좋게 보이다’가 원문 관용과 자연스러움을 함께 살립니다.
- source_word: הַדָּבָר
  english_pob_choice: the proposal
  chosen_korean: 그 제안
  alternatives_korean:
  - 그 일
  - 그 말
  - 그 문제
  lexicon: HALOT
  rationale: 직역하면 ‘그 일/말’이지만, 앞 문맥의 조언·의견을 가리키므로 ‘제안’이 의미를 더 구체적으로 드러냅니다.
- source_word: בְּעֵינֵי
  english_pob_choice: in the eyes of
  chosen_korean: ~의 눈에
  alternatives_korean:
  - ~의 판단에
  - ~에게
  - ~보기에
  lexicon: HALOT
  rationale: 평가와 승인에 관한 히브리어 관용을 살리기 위해 ‘눈에’를 유지했습니다.
- source_word: זִקְנֵי יִשְׂרָאֵל
  english_pob_choice: the elders of Israel
  chosen_korean: 이스라엘의 모든 장로들
  alternatives_korean:
  - 이스라엘의 장로들
  - 이스라엘의 지도자들
  - 이스라엘의 원로들
  lexicon: HALOT
  rationale: זִקְנֵי는 단순한 연장자가 아니라 공동체의 대표적 지도층을 가리키므로, 한국어에서도 표준적인 ‘장로들’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 관용구 בְּעֵינֵי의 처리
  chosen_reading: ‘~의 눈에’라는 이미지를 유지하여 승인과 평가의 뉘앙스를 드러냈습니다.
  alternative_readings:
  - ‘~의 판단에’로 의미만 풀어 쓰는 방식
  - ‘~에게 좋게 여겨졌다’로 완전히 자연화하는 방식
  rationale: 본문의 반복 구조(압살롬과 이스라엘의 장로들 모두에게)에서 관용적 이미지 자체가 의미를 형성하므로, 이를 보존하는 편이 원문 효과를 더 잘 전달합니다.
  doctrine_reference: 없음
