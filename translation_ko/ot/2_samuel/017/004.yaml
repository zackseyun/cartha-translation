  english_pob_choice: the proposal
  chosen_korean: 그 제안
  alternatives_korean:
  - 그 일
  - 그 말
  - 그 문제
  lexicon: HALOT
  rationale: 직역하면 ‘그 일/말’이지만, 앞 문맥의 조언·의견을 가리키므로 ‘제안’이 의미를 더 구체적으로 드러냅니다.
- source_word: בְּעֵינֵי
  english_pob_choice: in the eyes of
  chosen_korean: ~의 눈에
  alternatives_korean:
  - ~의 판단에
  - ~에게
  - ~보기에
  lexicon: HALOT
  rationale: 평가와 승인에 관한 히브리어 관용을 살리기 위해 ‘눈에’를 유지했습니다.
- source_word: זִקְנֵי יִשְׂרָאֵל
  english_pob_choice: the elders of Israel
  chosen_korean: 이스라엘의 모든 장로들
  alternatives_korean:
