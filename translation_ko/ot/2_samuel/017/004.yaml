  lexicon: HALOT
  rationale: זִקְנֵי는 단순한 연장자가 아니라 공동체의 대표적 지도층을 가리키므로, 한국어에서도 표준적인 ‘장로들’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 관용구 בְּעֵינֵי의 처리
