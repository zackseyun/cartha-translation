  lexicon: HALOT
  rationale: 히브리어 ישר의 여기서는 도덕적 ‘옳음’보다 제안이 수용·승인되었음을 나타내므로, ‘좋게 보이다’가 원문 관용과 자연스러움을 함께 살립니다.
