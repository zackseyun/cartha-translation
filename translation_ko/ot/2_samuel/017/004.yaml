  alternative_readings:
  - ‘~의 판단에’로 의미만 풀어 쓰는 방식
  - ‘~에게 좋게 여겨졌다’로 완전히 자연화하는 방식
  rationale: 본문의 반복 구조(압살롬과 이스라엘의 장로들 모두에게)에서 관용적 이미지 자체가 의미를 형성하므로, 이를 보존하는 편이 원문 효과를 더 잘 전달합니다.
