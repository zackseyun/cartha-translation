  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּקַּ֣ח הָ/אִשָּׁ֗ה וַ/תִּפְרֹ֤שׂ אֶת הַ/מָּסָךְ֙ עַל פְּנֵ֣י הַ/בְּאֵ֔ר וַ/תִּשְׁטַ֥ח עָלָ֖י/ו הָֽ/רִפ֑וֹת וְ/לֹ֥א נוֹדַ֖ע דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/019.yaml
  text: Then the woman took a covering and spread it over the mouth of the well[a], and scattered crushed grain on it[b], and the matter was not known.
  footnotes:
  - marker: a
    text: Or 'spread out grain on it'; the Hebrew term refers to crushed or pounded grain products.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and no thing was known.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여인이 덮개를 가져다가 우물의 입구 위에 펴고, 그 위에 부서진 곡식을 흩뿌렸으며, 그 일은 알려지지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 위에 곡식을 펴 놓았다’로도 옮길 수 있습니다. 히브리어 단어는 부서지거나 찧은 곡식 제품을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그리고 아무것도 알려지지 않았다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה
  english_pob_choice: the woman
  chosen_korean: 그 여인
  alternatives_korean:
  - 그 여자
  - 그 아내
  lexicon: HALOT
  rationale: 문맥상 이미 언급된 집의 여인을 가리키므로, 관계를 특정하는 ‘아내’보다 중립적이고 자연스러운 ‘그 여인’이 적합합니다.
- source_word: הַמָּסָךְ
  english_pob_choice: a covering
  chosen_korean: 덮개
  alternatives_korean:
  - 가리개
  - 천
  - 막
  lexicon: HALOT
  rationale: 우물을 숨기기 위해 실제로 덮는 도구이므로, 재질을 과도하게 특정하지 않는 현대 한국어 ‘덮개’가 가장 간결합니다.
- source_word: עַל פְּנֵי הַבְּאֵר
  english_pob_choice: over the mouth of the well
  chosen_korean: 우물의 입구 위에
  alternatives_korean:
  - 우물의 표면 위에
  - 우물의 얼굴 위에
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 옮기기 위해, 우물의 열린 부분을 가리키는 ‘입구’로 풀어 옮겼습니다.
- source_word: הָרִפוֹת
  english_pob_choice: crushed grain
  chosen_korean: 부서진 곡식
  alternatives_korean:
  - 찧은 곡식
  - 부순 곡물
  - 거친 가루
  lexicon: HALOT
  rationale: 이 단어는 빻거나 부순 곡식 제품을 뜻하므로, 은폐 장면의 맥락을 살리면서도 현대 독자가 이해하기 쉬운 ‘부서진 곡식’으로 옮겼습니다.
theological_decisions:
- issue: 은폐의 결과를 나타내는 마지막 절의 상태 진술
  chosen_reading: 그 일은 알려지지 않았습니다
  alternative_readings:
  - 그래서 아무도 몰랐습니다
  - 그 사안은 드러나지 않았습니다
  rationale: 히브리어의 수동적 진술 וְלֹא נוֹדַע דָּבָר을 따라, 사건의 은폐가 성공했음을 직접적으로 보여 주는 표현을 택했습니다.
  doctrine_reference: 본문 의미 보존과 서술 동작의 결과 전달
