  source_fidelity: 첫 절의 다윗이 마하나임에 이른다는 번역은 방향격이 붙은 지명과 בוא의 의미를 충실히 반영합니다. 그러나 후반부는 히브리어에서 ‘압살롬, 그와 함께한 이스라엘의 모든 남자’가 모두 요단강을 건넌 주어인데, 초안은 압살롬만 건넌 뒤 사람들이 그와 함께 있었다는 별도 진술로 바꾸었습니다.
  naturalness: ‘압살롬과 이스라엘의 모든 남자가 함께 요단강을 건넜습니다’는 동행 관계와 공동 행위를 자연스럽고 명료하게 나타냅니다. ‘마하나임에 이르렀고’도 현대의 격식 있는 서술문에 적절합니다.
  terminology: ‘마하나임’, ‘압살롬’, ‘요단강’은 통용되는 성서 지명·인명 표기입니다. כָל־אִישׁ יִשְׂרָאֵל의 남성 단수를 집합적으로 나타내기 위해 ‘이스라엘의 모든 남자’로 옮겨 원문의 성별 표지를 보존했습니다. 이것이 실제로 전 이스라엘 남성 인구를 뜻하는지, 군사 집단을 가리키는지는 본문이 명시하지 않으므로 ‘군사들’로 한정하지 않았습니다.
