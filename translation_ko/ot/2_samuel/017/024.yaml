  text: Then David came to Mahanaim, and Absalom crossed the Jordan, he and all the men of Israel with him.
translation:
  language: ko
  text: 그때 다윗은 마하나임에 이르렀고, 압살롬은 요단강을 건넜습니다. 그와 함께 이스라엘의 모든 사람들이 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא
  english_pob_choice: came
  chosen_korean: 이르렀고
  alternatives_korean:
  - 왔고
  - 도착했고
  lexicon: HALOT
  rationale: בוא의 서술적 완료는 한국어 내러티브에서 목적지 도착을 자연스럽게 드러내는 ‘이르다’로 옮기는 것이 가장 무난합니다.
- source_word: מַחֲנָיְמָה
  english_pob_choice: to Mahanaim
  chosen_korean: 마하나임에
  alternatives_korean:
  - 마하나임으로
  - 마하나임에 이르러
  lexicon: HALOT
  rationale: 지명 뒤의 방향격 ה는 도착 방향을 나타내므로, 한국어에서는 조사 ‘에’로 그 이동의 종착점을 살렸습니다.
- source_word: עָבַר אֶת־הַיַּרְדֵּן
  english_pob_choice: crossed the Jordan
  chosen_korean: 요단강을 건넜습니다
  alternatives_korean:
  - 요단을 건넜습니다
  - 요단강을 건너갔습니다
  lexicon: HALOT
  rationale: עבר + 목적어는 강을 건너는 동작을 뜻하므로, 현대 한국어에서 분명한 ‘요단강을 건넜습니다’가 가장 직접적입니다.
- source_word: כָל־אִישׁ יִשְׂרָאֵל
  english_pob_choice: all the men of Israel
  chosen_korean: 이스라엘의 모든 사람들
  alternatives_korean:
  - 이스라엘의 모든 남자들
  - 이스라엘의 모든 군사들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘이스라엘의 모든 남자/사람’이지만, 한국어에서는 군사적 집단성을 과도하게 좁히지 않으면서도 자연스럽게 ‘모든 사람들’로 옮길 수 있습니다.
