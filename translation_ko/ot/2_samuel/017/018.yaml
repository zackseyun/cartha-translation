- from: 그런데 한 젊은이가 그들을 보고 압살롬에게 알렸습니다. 그래서 두 사람은 급히 가서 바후림에 있는 한 사람의 집에 이르렀는데, 그 집 뜰에 우물이 있었고, 그들은 거기로 내려갔습니다.[a]
  to: 그런데 한 젊은이가 그들을 보고 압살롬에게 알렸습니다. 그래서 두 사람은 급히 가서 바후림에 있는 어떤 사람의 집에 이르렀는데, 그 집 뜰에 우물이 있었고, 그들은 그곳으로 내려갔습니다.[a]
  rationale: 본문은 히브리어의 장소 부사 ‘그곳’을 보존하여 우물 안이라는 목적지를 본문에서 명시하지 않았습니다. 각주는 문맥에 따른 명시적 대안 번역을 제시합니다. 또한 ‘한 사람의 집’을 ‘어떤 사람의 집’으로 다듬어 의미를 바꾸지 않고 자연스러운 현대 한국어 표현으로 수정했습니다.
