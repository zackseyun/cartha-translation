id: 2SA.17.18
reference: 2 Samuel 17:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֤רְא אֹתָ/ם֙ נַ֔עַר וַ/יַּגֵּ֖ד לְ/אַבְשָׁלֹ֑ם וַ/יֵּלְכוּ֩ שְׁנֵי/הֶ֨ם מְהֵרָ֜ה וַ/יָּבֹ֣אוּ אֶל בֵּֽית אִ֣ישׁ בְּ/בַחוּרִ֗ים וְ/ל֥/וֹ בְאֵ֛ר בַּ/חֲצֵר֖/וֹ וַ/יֵּ֥רְדוּ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/018.yaml
  text: But a young man saw them and told Absalom[a], so the two of them went quickly and came to the house of a man in Bahurim, who had a well in his courtyard, and they went down there.
  footnotes:
  - marker: a
    text: Or 'they went down into it,' that is, into the well.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 한 젊은이가 그들을 보고 압살롬에게 알렸습니다. 그래서 두 사람은 급히 가서 바후림에 있는 한 사람의 집에 이르렀는데, 그 집 뜰에 우물이 있었고, 그들은 거기로 내려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거기로 내려갔습니다’는 문맥상 우물 속으로 내려간 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  english_pob_choice: young man
  chosen_korean: 젊은이
  alternatives_korean:
  - 소년
  - 종
  lexicon: HALOT
  rationale: 여기서는 관찰하고 전달하는 독립적 행위가 가능한 인물을 가리키므로, 나이와 신분을 특정하지 않으면서도 자연스러운 ‘젊은이’가 적절합니다.
- source_word: וַיַּגֵּד
  english_pob_choice: told
  chosen_korean: 알렸습니다
  alternatives_korean:
  - 말했습니다
  - 보고했습니다
  lexicon: HALOT
  rationale: 히필 נגד는 ‘전하다/알리다’의 뜻으로 쓰였고, 압살롬에게 정보를 전달하는 맥락이므로 ‘알렸습니다’가 가장 정확합니다.
- source_word: בְּבַחוּרִים
  english_pob_choice: in Bahurim
  chosen_korean: 바후림에 있는
  alternatives_korean:
  - 바후림에서
  - 바후림에
  lexicon: HALOT
  rationale: 지명은 음역을 유지하고, 뒤의 ‘한 사람의 집’과 자연스럽게 이어지도록 위치 관계를 드러내는 ‘-에 있는’을 택했습니다.
- source_word: בְּאֵר
  english_pob_choice: well
  chosen_korean: 우물
  alternatives_korean:
  - 샘
  - 구덩이
  lexicon: HALOT
  rationale: 기본 어휘값은 ‘우물’이며, 바로 뒤 문맥에서도 그 구멍 안으로 내려가는 장면이므로 한국어에서도 이 단어가 가장 분명합니다.
