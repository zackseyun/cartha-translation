base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/015.yaml
  text: Then Hushai said to Zadok and to Abiathar the priests[a], “This and that is what Ahithophel advised Absalom and the elders of Israel, and this and that is what I have advised.”
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''this and that'' (traditional: ''thus and thus''), meaning the substance of what was said without repeating it word for word.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 후새가 제사장 사독과 아비아달에게 말했습니다. 「아히도벨은 압살롬과 이스라엘의 장로들에게 이러이러하게 조언했고, 나는 이러이러하게 조언했습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘이러이러하게’는 말한 내용을 낱낱이 되풀이하지 않고 그 요지만 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 연속된 서술을 자연스럽게 이어 주는 הה׃ waw-consecutive의 진행성을 살리되, 현대 한국어 서사에 맞게 ‘그러자’로 옮겼습니다.
- source_word: כָּזֹאת וְכָזֹאת
  english_pob_choice: This and that / thus and thus
  chosen_korean: 이러이러한
  alternatives_korean:
  - 이러저러한
  - 이렇고 저렇고
  lexicon: HALOT
  rationale: 히브리어 관용구가 말의 구체 내용을 전부 되풀이하지 않고 요지만 가리키는 뜻이므로, 한국어에서도 관용적으로 ‘이러이러한’으로 처리했습니다.
- source_word: יָעַץ
  english_pob_choice: advised
  chosen_korean: 계책을 내놓았습니다
  alternatives_korean:
  - 조언했습니다
  - 권고했습니다
  - 의논했습니다
  lexicon: HALOT
  rationale: 이 문맥은 단순한 조언이 아니라 정치적·전략적 자문이므로, 결과물을 드러내는 ‘계책을 내놓다’로 옮겨 원문의 실질을 살렸습니다.
- source_word: אֶל צָדוֹק וְאֶל אֶבְיָתָר הַכֹּהֲנִים
  english_pob_choice: to Zadok and to Abiathar the priests
  chosen_korean: 사독과 아비아달 제사장들에게
  alternatives_korean:
  - 사독과 아비아달 두 제사장에게
  - 사독과 아비아달인 제사장들에게
  lexicon: HALOT
  rationale: 히브리어의 이중 전치사를 한국어에서는 자연스럽게 합쳐 ‘...에게’로 처리하고, 두 인물이 제사장임을 유지했습니다.
theological_decisions:
- issue: 반복 관용구의 처리
  chosen_reading: ‘이러이러한’으로 옮겨, 실제 발언 내용을 생략한 채 요지만 전달하는 문맥을 드러냈습니다.
  alternative_readings:
  - ‘이렇고 저렇고’
  - ‘이러저러한’
  rationale: 본문의 요지는 내용의 불특정성이지 내용 자체의 일부 제시가 아니므로, 번역에서도 그 불특정성을 분명히 하는 것이 적절합니다.
  doctrine_reference: 서사 문맥의 투명한 재현
