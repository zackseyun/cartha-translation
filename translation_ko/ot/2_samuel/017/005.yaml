source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם קְרָ֣א נָ֔א גַּ֖ם לְ/חוּשַׁ֣י הָ/אַרְכִּ֑י וְ/נִשְׁמְעָ֥ה מַה בְּ/פִ֖י/ו גַּם הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/005.yaml
  text: Then Absalom said[a], “Please call Hushai the Archite also, and let us hear what he too has to say.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'and let us hear what is in his mouth, he too.' The expression means 'what he has to say.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 압살롬이 말했습니다[a]. 「부탁이니 후새도 아르키 사람도 부르십시오. 그러면 그도 무엇을 말하는지 우리가 들어 보겠습니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “그가 입에 무엇을 갖고 있는지, 그도”라는 식의 관용구를 쓰며, 뜻은 “그가 무엇을 말하는지”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서사 진행을 한국어의 자연스러운 순행 표현인 「그러자」로 살렸습니다.
- source_word: קְרָא נָא
  english_pob_choice: Please call
  chosen_korean: 부탁이니 ... 부르십시오
  alternatives_korean:
  - 제발 ... 부르십시오
  - '... 불러 주십시오'
  lexicon: HALOT
  rationale: נָא의 공손한 요청 뉘앙스를 살려 정중한 청유형으로 옮겼습니다.
- source_word: וְנִשְׁמְעָה
  english_pob_choice: and let us hear
  chosen_korean: 그러면 ... 우리가 들어 보겠습니다
  alternatives_korean:
  - 그리고 ... 우리가 듣겠습니다
  - 그리하여 ... 들어 보겠습니다
  lexicon: HALOT
  rationale: 첫인칭 복수 청유의 제안적 의미를 「-어 보겠습니다」로 자연스럽게 표현했습니다.
- source_word: מַה בְּפִיו גַּם הוּא
  english_pob_choice: what he too has to say
  chosen_korean: 그도 무엇을 말하는지
  alternatives_korean:
  - 그도 입에 무엇이 있는지
  - 그도 무슨 말을 하는지
  lexicon: HALOT
  rationale: 히브리어 관용구 「그의 입에 있는 것」을 직역보다 의미 중심으로 옮겨, ‘무엇을 말하는지’라는 발화 내용으로 전달했습니다.
theological_decisions:
- issue: 아르키 사람(חֻשַׁי הָאַרְכִּי)의 표기
  chosen_reading: 후새도 아르키 사람도
  alternative_readings:
  - 후새, 아르키 사람도
  - 후새를 아르키 사람도
  rationale: 인명과 출신/소속을 병렬로 제시하는 원문 구조를 따라, 후새와 아르키 사람을 함께 호출하는 요청임을 드러냈습니다.
  doctrine_reference: 본문 서사 구조 보존
