  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר חוּשַׁ֖י אֶל אַבְשָׁל֑וֹם לֹֽא טוֹבָ֧ה הָ/עֵצָ֛ה אֲשֶׁר יָעַ֥ץ אֲחִיתֹ֖פֶל בַּ/פַּ֥עַם הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/007.yaml
  text: Then Hushai said to Absalom[a], “The counsel that Ahithophel has given this time is not good.”
  footnotes:
  - marker: a
    text: Or “on this occasion.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 후새이가 압살롬에게 말했습니다. “아히도벨이 이번에 제시한 계략은 좋지 않습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이번에’는 ‘이때/이번 경우에’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 후새이가 ... 말했습니다
  lexicon: WLC
  rationale: 와우 연속의 서술 진행을 자연스러운 한국어로 옮기되, 사건의 다음 진행을 분명히 드러내기 위해 ‘그때’로 시작했습니다.
- source_word: לֹא טוֹבָה
  english_pob_choice: is not good
  chosen_korean: 좋지 않습니다
  alternatives_korean:
  - 좋은 것이 아닙니다
  - 타당하지 않습니다
  lexicon: HALOT
  rationale: 평서형 평가를 현대 한국어로 간결하게 옮겼습니다. ‘좋다’는 히브리어의 기본 평가 의미를 가장 직접적으로 반영합니다.
- source_word: הָעֵצָה
  english_pob_choice: the counsel
  chosen_korean: 계략
  alternatives_korean:
  - 계책
  - 조언
  - 의논
  lexicon: HALOT
  rationale: 문맥상 아히도벨의 정치·전략적 제안을 가리키므로, 단순한 ‘조언’보다 의도와 실행성을 드러내는 ‘계략’이 적절합니다.
- source_word: בַּפַּעַם הַזֹּאת
  english_pob_choice: this time
  chosen_korean: 이번에
  alternatives_korean:
  - 이때
  - 이번 경우에
  - 이 기회에
  lexicon: HALOT
  rationale: ‘이번에’가 이 관용구의 자연스러운 현대 한국어 대응이며, 특정 회차를 지시하는 뉘앙스를 잘 살립니다.
theological_decisions:
- issue: 아히도벨의 말에 대한 평가를 어떻게 전달할지
  chosen_reading: 후새이는 그 제안을 단순히 정보로 전달하지 않고, 판단을 내리는 형태로 “좋지 않습니다”라고 분명히 말합니다.
  alternative_readings:
  - ‘좋지 않습니다’보다 약한 ‘좋은 것이 아닙니다’
  - ‘현명하지 않습니다’처럼 해석을 보태는 번역
  rationale: 본문은 후새이가 압살롬 앞에서 아히도벨의 조언을 평가 절하하는 장면이므로, 판단의 직접성을 유지해야 합니다. ‘좋지 않습니다’는 원문의 부정 평가를 과장 없이 드러냅니다.
  doctrine_reference: 문맥적 화행 보존
