id: 2SA.17.23
reference: 2 Samuel 17:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲחִיתֹ֣פֶל רָאָ֗ה כִּ֣י לֹ֣א נֶעֶשְׂתָה֮ עֲצָת/וֹ֒ וַ/יַּחֲבֹ֣שׁ אֶֽת הַ/חֲמ֗וֹר וַ/יָּ֜קָם וַ/יֵּ֤לֶךְ אֶל בֵּית/וֹ֙ אֶל עִיר֔/וֹ וַ/יְצַ֥ו אֶל בֵּית֖/וֹ וַ/יֵּחָנַ֑ק וַ/יָּ֕מָת וַ/יִּקָּבֵ֖ר בְּ/קֶ֥בֶר אָבִֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/023.yaml
  text: When Ahithophel saw that his counsel had not been followed[a], he saddled the donkey, arose, and went to his house in his city. He gave orders to his household, then hanged himself and died[c][b]; and he was buried in his father's tomb.
  footnotes:
  - marker: a
    text: Or 'his counsel had not been carried out.' The Hebrew is literally 'his counsel was not done.'
    reason: lexical_alternative
  - marker: b
    text: Or 'He set his house in order.' The Hebrew more literally says 'he gave orders to his house/household.'
    reason: lexical_alternative
  - marker: c
    text: Or 'strangled himself.' The verb can denote death by hanging or strangling; in context it describes Ahithophel's suicide.
    reason: lexical_alternative
translation:
  language: ko
  text: 아히도벨은 자기의 계략이 실행되지 않은 것을 보고, 나귀에 안장을 얹고 일어나 자기 성읍의 집으로 갔습니다. 그는 자기 집안에 지시를 내린 뒤 목을 매어 죽었고[c][b], 그의 아버지의 무덤에 묻혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘자기 집을 정리했습니다.’ 히브리어는 더 문자적으로 ‘자기 집/가문에 명령을 내렸다’고 말합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘목을 졸라 죽었습니다.’ 이 동사는 목매달기나 교살을 모두 가리킬 수 있으며, 문맥에서는 아히도벨의 자살을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָתוֹ / his counsel
  english_pob_choice: his counsel
  chosen_korean: 자기의 계략
  alternatives_korean:
  - 자기의 조언
  - 자기의 계획
  lexicon: HALOT
  rationale: 정치적 문맥에서 עֵצָה는 단순한 조언보다 실행 가능한 계책의 뜻이 강하므로, 한국어에서는 ‘계략’으로 옮겨 아히도벨의 전략적 발언이 무산되었다는 점을 드러냈습니다.
- source_word: נֶעֶשְׂתָה / had not been followed
  english_pob_choice: had not been followed
  chosen_korean: 실행되지 않은
  alternatives_korean:
  - 행해지지 않은
  - 따라지지 않은
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘행해지지 않았다’이지만, 문맥상 계략이 실제로 채택·집행되지 않았다는 뜻이므로 자연스럽게 ‘실행되지 않은’으로 옮겼습니다.
- source_word: וַיַּחֲבֹשׁ אֶת־הַחֲמוֹר / he saddled the donkey
  english_pob_choice: he saddled the donkey
  chosen_korean: 나귀에 안장을 얹고
  alternatives_korean:
  - 나귀를 얹혀 타게 하고
  - 나귀에 안장을 지우고
  lexicon: HALOT
  rationale: חבש는 짐승에 ‘안장을 얹어 타도록 준비하다’는 뜻이므로, 한국어 관용과 원문의 동작을 함께 살려 표현했습니다.
- source_word: וַיְצַו אֶל־בֵּיתוֹ / He gave orders to his household
  english_pob_choice: He gave orders to his household
  chosen_korean: 자기 집안에 지시를 내린 뒤
  alternatives_korean:
  - 자기 집안을 정리한 뒤
  - 자기 집에 명령을 내린 뒤
  lexicon: HALOT
  rationale: 이 동사는 단순한 유언 정리인지, 가족과 하인들에게 구체적 지시를 내리는지 둘 다 가능하므로, POB의 해석을 따라 ‘집안에 지시를 내리다’로 옮겼습니다.
- source_word: וַיֵּחָנַק / then hanged himself
  english_pob_choice: then hanged himself
  chosen_korean: 목을 매어 죽었고
  alternatives_korean:
  - 스스로 목을 졸라 죽었고
  - 목매어 죽었고
  lexicon: HALOT
  rationale: 이 동사는 목매달아 죽는 행위와 목졸라 죽는 행위를 모두 가리킬 수 있어, 문맥상 자살임을 분명히 하되 방법의 여지를 남기는 표현을 택했습니다.
- source_word: בְּקֶבֶר אָבִיו / in his father's tomb
  english_pob_choice: in his father's tomb
  chosen_korean: 그의 아버지의 무덤
  alternatives_korean:
  - 그의 아버지의 묘실
  - 그의 아버지의 무덤터
  lexicon: HALOT
  rationale: קֶבֶר는 ‘무덤/묘’의 일반어이므로, 가족 매장지를 가리키는 문맥에 맞게 ‘무덤’으로 옮겼습니다.
theological_decisions:
- issue: 아히도벨의 죽음 표현
  chosen_reading: 자살을 직접 드러내되, 원문의 행위 동사를 유지해 과도한 해석을 피했습니다.
  alternative_readings:
  - ‘목을 매어 죽었습니다’처럼 완전한 직설화
  - ‘목이 졸려 죽었습니다’처럼 중립화
  rationale: 본문은 아히도벨이 의도적으로 죽음을 택했음을 보여 주므로, 독자가 그 사실을 분명히 이해하도록 하되 히브리어의 모호성도 지나치게 지우지 않도록 했습니다.
  doctrine_reference: 서사 본문 해석 원칙
- issue: 아히도벨의 ‘집안’ 지시
  chosen_reading: 가족과 가사에 대한 실제 지시로 읽었습니다.
  alternative_readings:
  - ‘자기 집을 정리했다’는 관용적 해석
  - ‘재산을 정리했다’는 확장 해석
  rationale: 히브리어는 ‘집/가문’에 명령을 내렸다는 표현으로, 임종 전 정리라는 관용 가능성도 있으나 문면상으로는 집안에 구체적 지시를 주었다는 뜻을 우선 반영했습니다.
  doctrine_reference: 문맥 우선 해석 원칙
