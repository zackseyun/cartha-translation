    text: 'Hebrew: ''Ithra the Israelite.'' 1 Chronicles 2:17 has ''Jether the Ishmaelite.'''
    reason: textual_variant
translation:
  language: ko
  text: 압살롬은 요압 대신 아마사를 군대의 지휘관으로 세웠습니다. 아마사는 이스라엘 사람 이드라라는 한 사람의 아들이었습니다. 이드라는 나하스의 딸 아비가일에게 들어갔습니다. 아비가일은 요압의 어머니인 스루야의 누이였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘이스라엘 사람 이드라’로 읽지만, 역대상 2:17은 ‘이스마엘 사람 예델’로 읽습니다.
    reason: textual_variant
