  yaml_path: translation/ot/2_samuel/017/025.yaml
  text: And Absalom set Amasa over the army in place of Joab. Now Amasa was the son of a man whose name was Ithra the Israelite[a], who had gone in to Abigail the daughter of Nahash, sister of Zeruiah, Joab’s mother.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Ithra the Israelite.'' 1 Chronicles 2:17 has ''Jether the Ishmaelite.'''
    reason: textual_variant
translation:
  language: ko
  text: 압살롬은 요압 대신 군대 위에 아마사를 세웠습니다. 아마사는 이스라엘 사람 이드라라는 사람의 아들이었는데, 그는 나하스의 딸 아비가일에게 들어간 사람이었습니다. 아비가일은 스루야의 누이요, 요압의 어머니입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘이스라엘 사람 이드라’로 읽지만, 역대상 2:17은 ‘이스마엘 사람 예델’로 읽습니다.
    reason: textual_variant
