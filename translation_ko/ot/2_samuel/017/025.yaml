revisions:
- from: 압살롬은 요압 대신 군대 위에 아마사를 세웠습니다. 아마사는 이스라엘 사람 이드라라는 사람의 아들이었는데, 그는 나하스의 딸 아비가일에게 들어간 사람이었습니다. 아비가일은 스루야의 누이요, 요압의 어머니입니다.[a]
  to: 압살롬은 요압 대신 아마사를 군대의 지휘관으로 세웠습니다. 아마사는 이스라엘 사람 이드라라는 한 사람의 아들이었습니다. 이드라는 나하스의 딸 아비가일에게 들어갔습니다. 아비가일은 요압의 어머니인 스루야의 누이였습니다.[a]
  rationale: 군 통수권을 나타내는 표현을 현대 한국어로 자연화하되 임명과 대체의 의미를 유지했습니다. 이드라를 명시하여 관계절의 지시 대상을 분명히 했고, ‘들어가다’라는 원문의 완곡한 성적 결합 관용구를 보존했습니다. 친족 관계와 이문 주석은 변경하지 않았습니다.
