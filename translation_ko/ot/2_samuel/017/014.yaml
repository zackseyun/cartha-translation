  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל טוֹבָ֗ה עֲצַת֙ חוּשַׁ֣י הָ/אַרְכִּ֔י מֵ/עֲצַ֖ת אֲחִיתֹ֑פֶל וַ/יהוָ֣ה צִוָּ֗ה לְ/הָפֵ֞ר אֶת עֲצַ֤ת אֲחִיתֹ֨פֶל֙ הַ/טּוֹבָ֔ה לְ/בַ/עֲב֗וּר הָבִ֧יא יְהוָ֛ה אֶל אַבְשָׁל֖וֹם אֶת הָ/רָעָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/014.yaml
  text: Then Absalom and all the men of Israel said[a], “The counsel of Hushai the Archite is better than the counsel of Ahithophel.” For Yahweh had ordained to frustrate the good counsel of Ahithophel[b], so that Yahweh might bring disaster on Absalom.
  footnotes:
  - marker: a
    text: Or 'the LORD had commanded to frustrate.' The Hebrew verb often means 'command,' but here it describes the LORD's effective determination regarding Ahithophel's counsel.
    reason: lexical_alternative
  - marker: b
    text: '''Disaster'' renders a Hebrew term that can also mean ''evil'' or ''calamity''; here it refers to ruin or harm coming upon Absalom in judgment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 압살롬과 이스라엘의 모든 사람이 말했습니다[a]. 「아히도벨의 계략보다 아히 사람 후새의 계략이 더 좋다」고 하였습니다. 이는 야훼께서 아히도벨의 좋은 계략을 좌절시키도록 정하셨기 때문이니, 곧 야훼께서 압살롬에게 재앙을 내리려 하셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 좌절시키도록 명하셨다.’ 히브리어 동사는 보통 ‘명하다’를 뜻하지만, 여기서는 아히도벨의 계략을 무력하게 하려는 야훼의 유효한 뜻을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘재앙’은 히브리어가 ‘악’ 또는 ‘재난’까지 뜻할 수 있는 말을 옮긴 것입니다. 여기서는 압살롬에게 임하는 심판적 파멸을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그때 ... 말했습니다
  - 그리고 ... 말했습니다
  lexicon: WLC / narrative waw-consecutive
  rationale: 서술 진행을 자연스럽게 살리되, 직설적 인용 앞의 말하기 동사를 현대 한국어 합쇼체에 맞게 간결하게 처리했습니다.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  english_pob_choice: and all the men of Israel
  chosen_korean: 이스라엘의 모든 사람
  alternatives_korean:
  - 이스라엘의 모든 남자
  - 이스라엘의 모든 백성
  lexicon: WLC / HALOT
  rationale: 히브리어의 남성형 집합 표현을 너무 평준화하지 않으면서도, 한국어에서는 ‘사람’이 자연스럽게 집합적 의미를 전달하므로 채택했습니다.
- source_word: טוֹבָה
  english_pob_choice: is better
  chosen_korean: 더 좋다
  alternatives_korean:
  - 더 낫다
  - 좋다
  lexicon: HALOT
  rationale: 비교급의 평가를 직설적으로 살리기 위해 ‘더 좋다’를 택했습니다. 상담/계략의 비교라는 문맥에도 잘 맞습니다.
- source_word: חוּשַׁי הָאַרְכִּי
  english_pob_choice: Hushai the Archite
  chosen_korean: 아히 사람 후새
  alternatives_korean:
  - 후새 아히 사람
  - 아르키 사람 후새
  lexicon: 전통 인명 관례 + WLC gentilic
  rationale: 후새의 거주/출신 표지를 한국어 성경에서 낯설지 않게 옮기면서, 고유명사와 지명형 형용사를 함께 보존했습니다.
- source_word: וַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: YHWH transliteration
  rationale: 프로젝트 기본값에 따라 여호와가 아니라 야훼를 사용해 신명 표기를 직접 드러냈습니다.
- source_word: צִוָּה לְהָפֵר
  english_pob_choice: had ordained to frustrate
  chosen_korean: 좌절시키도록 정하셨기 때문이니
  alternatives_korean:
  - 무너뜨리도록 명하셨기 때문이니
  - 무효화하도록 명령하셨기 때문이니
  lexicon: HALOT
  rationale: צִוָּה를 단순 명령으로만 좁히기보다, 이 문맥의 섭리적 효력을 살려 ‘정하셨다’로 옮겼고, לְהָפֵר는 계략을 무력화하는 의미를 반영해 ‘좌절시키다’로 옮겼습니다.
- source_word: הָרָעָה
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 화
  lexicon: HALOT
  rationale: 이 단어는 도덕적 ‘악’보다 심판적 ‘재앙/재난’을 뜻하는 문맥이므로, 하나님이 압살롬에게 가져오시는 해를 분명하게 드러내는 ‘재앙’을 선택했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 신명기적 이름 יהוה를 직접 사용하므로, 번역에서도 언약의 고유명을 보존하는 것이 원문 가시성을 높입니다.
  doctrine_reference: 'POB contested terms: YHWH'
- issue: 하나님의 주권과 재앙 표현
  chosen_reading: 야훼께서 ... 정하셨기 때문이니 ... 재앙을 내리려 하셨습니다
  alternative_readings:
  - 야훼께서 ... 명령하셨기 때문이니 ... 화를 내리려 하셨습니다
  - 야훼께서 ... 결정하셨기 때문이니 ... 해를 주려 하셨습니다
  rationale: 본문은 아히도벨의 계략 좌절과 압살롬의 سقوط을 하나님의 주권 아래 둡니다. 동시에 הָרָעָה는 여기서 도덕적 악이 아니라 심판적 재앙이므로, ‘재앙’으로 번역해 신학적 긴장을 보존했습니다.
  doctrine_reference: 원어 우선 번역 원칙; 심판 문맥의 רָעָה
- issue: 직접 인용의 문체
  chosen_reading: 「... 더 좋다」고 하였습니다
  alternative_readings:
  - 「... 더 좋습니다」고 하였습니다
  - 「... 더 좋다」라고 말했습니다
  rationale: 인용문 내부는 원문의 평가 진술을 그대로 보여 주기 위해 평서형을 유지했습니다. 바깥 서술은 합쇼체로 유지해 문체 층위를 구분했습니다.
  doctrine_reference: 한국어 문체 일관성
