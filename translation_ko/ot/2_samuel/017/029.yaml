  rationale: 부자연스러운 식품 표현을 현대 표준어에 맞게 다듬고, 목적 용법을 ‘먹을 것으로’로 명료하게 옮겼습니다. 논쟁의 여지가 있는 유제품 명칭은 본문에서 과도하게 단정하지 않고 각주로 의미 범위를 밝혔습니다. 각주 표지는 해당 어휘에 직접 연결했습니다.
