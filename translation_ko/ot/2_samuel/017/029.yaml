base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/029.yaml
  text: and honey and curds and sheep and cheese from the herd they brought near for David and for the people who were with him to eat[a], for they said[c][b], “The people are hungry and weary and thirsty in the wilderness.”
  footnotes:
  - marker: a
    text: Or 'butter' for חֶמְאָה; the Hebrew term can denote a milk product broadly, but here it likely refers to curds rather than modern butter.
    reason: lexical_alternative
  - marker: b
    text: Or 'small livestock' for צֹאן; the Hebrew can refer collectively to sheep and goats.
    reason: lexical_alternative
  - marker: c
    text: The phrase 'cheese from the herd' renders Hebrew שְׁפוֹת בָּקָר, a cattle-based dairy product; some translations paraphrase more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 꿀과 굳은 우유와 양과 소 떼에서 난 치즈를 다윗과 그와 함께한 백성에게 먹으라고 가져왔습니다. 그들은 「백성이 광야에서 배고프고 지쳤으며 목말라 있습니다」라고 말했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘굳은 우유’는 히브리어 חֶמְאָה의 의미 범위를 살린 번역으로, 현대적 버터와는 다를 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘양’은 히브리어 צֹאן의 포괄적 의미를 따랐으며, 염소를 포함한 작은 가축까지 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘소 떼에서 난 치즈’는 히브리어 שְׁפוֹת בָּקָר의 문자적 의미를 살린 표현으로, 더 일반적으로 풀어 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/דְבַשׁ
  english_pob_choice: honey
  chosen_korean: 꿀
  alternatives_korean:
  - 시럽
  lexicon: HALOT
  rationale: 비축 식량 문맥에서 דְבַשׁ은 일반적으로 ‘꿀’이 가장 자연스럽고, 한국어 성경 독자에게도 직접적입니다.
- source_word: וְ/חֶמְאָה
  english_pob_choice: curds
  chosen_korean: 굳은 우유
  alternatives_korean:
  - 버터
  - 크림
  - 응고된 유제품
  lexicon: HALOT
  rationale: 이 단어는 고대 이스라엘 식품 문맥에서 현대적 의미의 버터보다 응고된 유제품을 가리킬 가능성이 커서, 의미를 드러내되 과도하게 특정하지 않는 표현을 택했습니다.
- source_word: וְ/צֹאן
  english_pob_choice: sheep
  chosen_korean: 양
  alternatives_korean:
  - 작은 가축
  - 양 떼
  - 염소를 포함한 작은 가축
  lexicon: HALOT
  rationale: צֹאן은 양과 염소를 포괄할 수 있지만, 이 문맥에서는 간결한 집합명사 ‘양’이 자연스럽고 문맥상 허용됩니다.
- source_word: וּ/שְׁפ֣וֹת בָּקָ֔ר
  english_pob_choice: cheese from the herd
  chosen_korean: 소 떼에서 난 치즈
  alternatives_korean:
  - 소젖 치즈
  - 소의 치즈
  - 가축에서 난 치즈
  lexicon: HALOT
  rationale: POB의 ‘cheese from the herd’가 암시하는 소 기반 유제품의 구체성을 살리면서도, 한국어로는 ‘소 떼에서 난 치즈’가 가장 직접적으로 대응합니다.
- source_word: הִגִּ֧ישׁוּ
  english_pob_choice: they brought near
  chosen_korean: 가져왔습니다
  alternatives_korean:
  - 가까이 가져왔습니다
  - 바쳤습니다
  - 내왔습니다
  lexicon: HALOT
  rationale: 동사의 기본값인 ‘가까이 가져오다/내놓다’의 공급 의미를 살리되, 한국어 서술에서 자연스러운 공손한 과거형으로 옮겼습니다.
theological_decisions:
- issue: 마지막 인용문의 화자 등록
  chosen_reading: 직접 인용으로 처리하되, 백성이 한 말의 내용이 분명하게 보이도록 표준어 문장부호를 사용했습니다.
  alternative_readings:
  - 간접화법으로 풀어쓰기
  - 따옴표 없이 서술
  rationale: 히브리어의 이유 설명 뒤에 이어지는 백성의 발화를 본문 구조대로 유지하는 편이 서술 흐름과 화자의 구분을 가장 잘 보존합니다.
  doctrine_reference: 본문 서사 구조 보존
- issue: ‘광야’의 지리적/상징적 뉘앙스
  chosen_reading: ‘광야’로 옮겨, 단순한 사막보다 넓은 황무지·거친 들판의 의미를 살렸습니다.
  alternative_readings:
  - 사막
  - 들
  rationale: מִדְבָּר는 모래사막보다 더 넓은 거친 들판을 가리킬 수 있으므로, 성경적 한국어에서 익숙하면서도 의미 범위가 넓은 ‘광야’가 적절합니다.
  doctrine_reference: 지리어휘의 범위 보존
