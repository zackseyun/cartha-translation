  text: כִּ֣י יָעַ֗צְתִּי הֵ֠אָסֹף יֵאָסֵ֨ף עָלֶ֤י/ךָ כָל יִשְׂרָאֵל֙ מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע כַּ/ח֥וֹל אֲשֶׁר עַל הַ/יָּ֖ם לָ/רֹ֑ב וּ/פָנֶ֥י/ךָ הֹלְכִ֖ים בַּ/קְרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/011.yaml
  text: But I advise that all Israel be surely gathered to you[a], from Dan to Beersheba, as numerous as the sand that is by the sea, and that you yourself go into battle.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and your face going in the battle,' an idiom meaning that you personally lead the attack.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 권합니다. 온 이스라엘을 당신에게로, 단에서부터 브엘세바에 이르기까지, 바닷가의 모래처럼 많은 수만큼 반드시 모으고, 당신은 직접 싸움에 나서십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘당신의 얼굴이 싸움에 가고’입니다. 여기서는 당신이 직접 전투를 이끈다는 관용 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: כִּי
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 왜냐하면
  - 그리고
  lexicon: HALOT
  rationale: 앞 문맥의 아히도벨 조언과 대비되는 하후새의 반대 제안을 드러내므로, 단순 인과보다 역접을 앞세운 ‘그러나’가 자연스럽습니다.
- source_word: יָעַצְתִּי
  english_pob_choice: I advise
  chosen_korean: 내가 권합니다
  alternatives_korean:
  - 내가 조언합니다
  - 내가 권고합니다
  lexicon: HALOT
  rationale: 화행상 현재형의 제안/권고를 나타내므로, 한국어에서는 ‘권합니다’가 가장 직접적이고 공손한 표현입니다.
- source_word: הֵאָסֹף יֵאָסֵף
  english_pob_choice: be surely gathered
  chosen_korean: 반드시 모으고
  alternatives_korean:
  - 확실히 모이게 되고
  - 꼭 집결하고
  lexicon: HALOT
  rationale: 사역적 모임의 강조를 살리되, 한국어에서는 반복형 강세를 ‘반드시’로 풀어 자연스럽게 옮겼습니다.
- source_word: וּפָנֶיךָ הֹלְכִים בַּקְרָב
  english_pob_choice: you yourself go into battle
  chosen_korean: 당신은 직접 싸움에 나서십시오
  alternatives_korean:
  - 당신의 얼굴이 싸움 속으로 가고
  - 당신이 친히 싸움에 나가십시오
  lexicon: HALOT
  rationale: 직역하면 ‘얼굴’이지만 관용적으로 ‘당신 자신이 친히’라는 뜻이므로, POB의 해석을 따라 의미를 분명하게 살렸습니다.
theological_decisions:
- issue: 히브리어 관용구 ‘얼굴이 싸움에 감’의 처리
  chosen_reading: 지휘관이 전투에 직접 참여한다는 뜻으로 이해하여 ‘직접 싸움에 나서십시오’로 옮겼습니다.
  alternative_readings:
  - ‘당신의 얼굴이 싸움에 가고’처럼 더 직역적으로 옮길 수 있음
  - ‘친히 전열에 서십시오’로 풀어 옮길 수 있음
  rationale: 본문은 신체 부위 묘사가 아니라 지도자의 현장 참여를 요구하는 관용구이므로, 의미를 드러내는 번역이 본문 의도에 더 충실합니다.
  doctrine_reference: 문맥적 관용구 해석
- issue: ‘온 이스라엘’과 지리적 전역 표현
  chosen_reading: ‘단에서부터 브엘세바에 이르기까지’로 ישראל의 전역을 나타내는 상투적 범위를 그대로 살렸습니다.
  alternative_readings:
  - ‘전 이스라엘’로 일반화
  - ‘북쪽 단에서 남쪽 브엘세바까지’로 설명화
  rationale: 메르즘 구조를 유지해야 왕국 전체를 포괄하는 수사적 힘이 보존됩니다.
  doctrine_reference: 서사적 수사 보존
