revisions:
- from: 그러나 내가 권합니다. 온 이스라엘을 당신에게로, 단에서부터 브엘세바에 이르기까지, 바닷가의 모래처럼 많은 수만큼 반드시 모으고, 당신은 직접 싸움에 나서십시오.[a]
  to: 그러나 저는 온 이스라엘을 단에서부터 브엘세바에 이르기까지, 바닷가의 모래처럼 많이, 반드시 당신에게로 모으시고, 당신은 친히 전투에 나서시기를 권합니다.[a]
  rationale: 원문의 강조된 집결 명령(הֵאָסֹף יֵאָסֵף)을 ‘반드시 모으시고’로 보존하고, 모래 비유의 중복되고 부자연스러운 표현을 바로잡았습니다. ‘당신은 친히 전투에 나서시기를’은 ‘그대의 얼굴이 전투에 가다’라는 관용구가 가리키는 지도자의 직접 출전을 보존하며, 각주의 직역도 원문의 ‘전투 안에서/전투에’라는 의미에 맞게 다듬었습니다.
