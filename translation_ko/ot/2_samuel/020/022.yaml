    issue: ‘가서 말했고’가 원문에 없는 발화 행위를 추가함
    rationale: וַתָּבוֹא는 여인이 백성에게 갔다는 이동만 서술합니다. 앞 절의 대화 문맥이 있더라도 이 절에 ‘말하다’를 보충하면 원문 이상의 내용을 확정하게 됩니다.
