  to: 그 여인은 자기 지혜로 온 백성에게 갔고, 그들은 비그리의 아들 세바의 머리를 잘라 요압에게 던졌습니다. 그러자 요압이 나팔을 불었고, 그들은 성읍을 떠나 흩어져 각자 자기 장막으로 갔습니다[a]. 요압은 예루살렘에 있는 왕에게 돌아갔습니다.
  rationale: 원문에 없는 ‘말하다’를 제거하고, 성읍을 포위하던 자들의 철수라는 문맥을 ‘성읍을 떠나 흩어져’로 반영했습니다. 요압을 나팔을 분 주체로 명시하고, 마지막 목적어 구문을 자연스러운 한국어 어순으로 고쳤습니다. 장막 관용구는 보존하되 그 의미를 각주로 설명했습니다.
