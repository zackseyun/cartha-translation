base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/022.yaml
  text: Then the woman went to all the people in her wisdom[a], and they cut off the head of Sheba son of Bichri and threw it to Joab. Then he blew the trumpet, and they dispersed from the city, each man to his tent; and Joab returned to Jerusalem to the king.
  footnotes:
  - marker: a
    text: 'Hebrew: ''each man to his tent,'' a stock idiom for dispersing to one''s own place.'
    reason: cultural_note
translation:
  language: ko
  text: 그 여인은 자기의 지혜로 모든 백성에게 가서 말했고, 그들은 세바의 아들 비그리의 머리를 잘라 요압에게 던졌습니다. 그러자 그가 나팔을 불었고, 그들은 성에서 흩어져 각자 자기 장막으로 돌아갔습니다. 요압은 예루살렘으로, 왕에게 돌아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, ‘자기 장막으로 돌아가다’는 각자 자기 거처로 흩어지는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּחָכְמָתָהּ
  english_pob_choice: in her wisdom
  chosen_korean: 자기의 지혜로
  alternatives_korean:
  - 지혜롭게
  - 그녀의 지혜 안에서
  lexicon: HALOT
  rationale: 히브리어의 ב + 명사는 수단/방식의 뉘앙스를 지니므로, 한국어에서는 ‘-로’로 옮겨 지혜가 행위의 수단이었음을 드러냈습니다.
- source_word: אֶל כָּל הָעָם
  english_pob_choice: to all the people
  chosen_korean: 모든 백성에게
  alternatives_korean:
  - 모든 사람들에게
  - 모든 군중에게
  lexicon: HALOT
  rationale: עָם은 문맥상 성읍의 주민과 관련된 넓은 집단을 가리키므로, 특정화하지 않고 ‘백성’으로 옮겼습니다.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  english_pob_choice: he blew the trumpet
  chosen_korean: 그가 나팔을 불었고
  alternatives_korean:
  - 그가 뿔나팔을 불었고
  - 그가 소리를 내었고
  lexicon: HALOT
  rationale: שׁוֹפָר는 전통적으로 ‘나팔/뿔나팔’로 옮길 수 있지만, 문맥의 신호 행위를 분명히 하기 위해 자연스러운 현대어 ‘나팔을 불다’를 택했습니다.
- source_word: אִישׁ לְאֹהָלָיו
  english_pob_choice: each man to his tent
  chosen_korean: 각자 자기 장막으로 돌아갔습니다
  alternatives_korean:
  - 각 사람은 자기 장막으로 갔습니다
  - 각자 집으로 돌아갔습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서 직역만 하면 생경하므로, 관용의 기능을 살리되 ‘장막’ 이미지는 유지하고 이동의 결과를 명시했습니다.
- source_word: שָׁב יְרוּשָׁלַם אֶל הַמֶּלֶךְ
  english_pob_choice: returned to Jerusalem to the king
  chosen_korean: 예루살렘으로, 왕에게 돌아갔습니다
  alternatives_korean:
  - 예루살렘으로 왕에게 돌아갔습니다
  - 예루살렘으로 왕에게 돌아왔습니다
  lexicon: HALOT
  rationale: שׁוּב의 ‘돌아가다’ 의미를 살리면서, 목적지인 왕궁/왕 앞의 방향성을 한국어 어순에 맞게 분리해 자연스럽게 표현했습니다.
theological_decisions:
- issue: 장막으로 흩어지는 고대 관용구의 처리
  chosen_reading: ‘각자 자기 장막으로 돌아갔습니다’로 관용성과 고대 배경을 함께 유지했습니다.
  alternative_readings:
  - ‘각자 집으로 돌아갔습니다’
  - ‘각자 흩어졌습니다’
  rationale: 본문의 군사적 해산을 전달하면서도, 히브리어 관용구의 역사적 표지를 지우지 않기 위해 장막 이미지를 보존했습니다.
  doctrine_reference: '번역 원칙: 원문 배경의 보존과 의미 전달의 균형'
- issue: ‘지혜로’의 수단성 표현
  chosen_reading: ‘자기의 지혜로’로 원문의 수단/방식 의미를 드러냈습니다.
  alternative_readings:
  - ‘지혜롭게’
  - ‘지혜 안에서’
  rationale: 본문은 여인의 지혜가 사건을 성취한 방식임을 강조하므로, 결과만 부드럽게 옮기기보다 수단성을 드러내는 번역이 적합합니다.
  doctrine_reference: 서사 문맥의 인과성과 행위 주체성 보존
