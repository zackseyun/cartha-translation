base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/012.yaml
  text: Now Amasa was wallowing in blood in the middle of the highway. When the man saw that all the people were stopping[a], he moved Amasa from the highway into the field and threw a garment over him, because he saw that everyone who came upon him stopped.
  footnotes:
  - marker: a
    text: Or 'was rolling about in the blood.' The Hebrew verb is more literally 'rolling oneself,' here likely describing Amasa's agonized movement as he lay wounded.
    reason: lexical_alternative
translation:
  language: ko
  text: 아마사는 길 한가운데 피 속에서 몸을 뒹굴고 있었습니다.[a] 그 사람이 모든 백성이 멈추어 서 있는 것을 보고, 아마사를 길에서 들판으로 옮겨 놓고 그에게 옷을 덮었습니다. 아마사에게 오는 사람마다 멈추어 서 있는 것을 보았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “피 속에서 몸을 굴리고 있었습니다.” 히브리어 동사는 문자적으로 ‘자기 몸을 굴리다’에 가깝고, 여기서는 부상으로 인한 고통스러운 움직임을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְגֹּלֵל
  english_pob_choice: was writhing / was wallowing
  chosen_korean: 피에 몸을 뒹굴고 있었습니다
  alternatives_korean:
  - 피에서 구르고 있었습니다
  - 피 속에서 몸부림치고 있었습니다
  lexicon: HALOT
  rationale: 히트폴엘 분사는 아마사가 중상으로 피 속에서 비정상적으로 구르는 모습을 가리키므로, ‘몸을 뒹굴다’가 문자성과 장면의 생생함을 함께 살립니다.
- source_word: בַּדָּם
  english_pob_choice: in blood
  chosen_korean: 피에
  alternatives_korean:
  - 피 속에
  - 피 가운데
  lexicon: HALOT
  rationale: 히브리어의 관사형을 과도하게 살리기보다 자연스러운 한국어로 압축하되, 아마사가 피로 뒤덮인 상태임을 유지했습니다.
- source_word: בְּתוֹךְ הַמְסִלָּה
  english_pob_choice: in the middle of the highway
  chosen_korean: 길 한가운데에서
  alternatives_korean:
  - 도로 한가운데에서
  - 대로 한가운데에서
  lexicon: HALOT
  rationale: מְסִלָּה는 주요한 길/대로를 뜻할 수 있으나, 서사 문맥에서는 한국어 ‘길 한가운데’가 가장 자연스럽게 장애 상황을 전달합니다.
- source_word: וַיַּסֵּב ... מִן הַמְסִלָּה הַשָּׂדֶה
  english_pob_choice: he moved Amasa from the highway into the field
  chosen_korean: 아마사를 길에서 들판으로 옮겨 놓고
  alternatives_korean:
  - 아마사를 길에서 들판으로 옮기고
  - 아마사를 길에서 밭으로 옮겨 놓고
  lexicon: HALOT
  rationale: הסב의 사역적 의미를 따라 ‘옮겨 놓다’로 처리해, 시신을 도로 밖으로 치운 행동을 과장 없이 드러냈습니다.
- source_word: בֶּגֶד
  english_pob_choice: a garment
  chosen_korean: 옷을
  alternatives_korean:
  - 겉옷을
  - 천을
  lexicon: HALOT
  rationale: בֶּגֶד는 일반적인 의복이므로, 특정한 겉옷보다 범위가 넓은 ‘옷’이 원문에 더 충실합니다.
theological_decisions:
- issue: 서사적 반복으로 드러나는 ‘멈춤’의 효과
  chosen_reading: 모든 백성이 멈추는 모습과, 그에게 오는 모든 사람이 멈추는 모습을 반복해 시신이 길을 막는 상황을 드러냈습니다.
  alternative_readings:
  - 단순히 ‘서 있었다’로 처리
  - 두 번째 절을 생략하거나 약화
  rationale: 히브리어의 עמד 반복은 군중의 정지와 현장 통행의 차단을 함께 강조하므로, 둘 다 살려 사건의 긴급성과 수치를 유지했습니다.
  doctrine_reference: 서사 본문 해석 원리
