  source_fidelity: 수정이 필요합니다. 원문의 בַּדָּם은 아마사가 피 가운데/피 속에 있는 상태를 나타내므로 ‘피에 몸을 뒹굴다’보다 ‘피 속에서 몸을 뒹굴다’가 장면과 결합 관계를 더 정확히 드러냅니다. 또한 עָלָיו는 아마사를 가리키는데, 초안의 ‘자기에게 오는’은 가장 가까운 주어인 ‘그 사람’을 가리키는 것으로 읽힐 수 있습니다.
  naturalness: ‘피 속에서 몸을 뒹굴고 있었습니다’, ‘멈추어 서 있는 것을 보고’, ‘아마사에게 오는 사람마다’는 현대 표준 한국어의 합쇼체 서사에 자연스럽습니다. 원문에 명시되지 않은 담화 표지 ‘이때’는 제거하는 것이 좋습니다.
  terminology: 인명 ‘아마사’를 유지하고, בֶּגֶד는 특정 의복을 덧붙이지 않는 ‘옷’으로 유지했습니다. ‘그 위에’는 선행 대상이 모호할 수 있어 ‘그에게 옷을 덮었습니다’로 명확히 했습니다.
  issues:
  - severity: medium
    issue: ‘이때’가 원문에 없는 시간 담화 표지를 더합니다.
    rationale: 히브리어 절은 와우 접속사로 시작하지만 독립적인 ‘이때/이제’ 어휘는 없습니다. 한국어에서는 생략해도 서사 연결이 보존됩니다.
  - severity: medium
    issue: ‘자기에게 오는 모든 사람’의 지시 대상이 모호합니다.
    rationale: 원문의 עָלָיו(‘그에게/그를 향해’)는 아마사를 가리킵니다. 한국어 재귀 대명사 ‘자기’는 문장의 주어인 그 사람으로 해석될 가능성이 큽니다.
  - severity: low
