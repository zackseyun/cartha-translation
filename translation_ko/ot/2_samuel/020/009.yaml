base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/009.yaml
  text: Joab said to Amasa[a], “Is it well with you, my brother?” And Joab took hold of Amasa’s beard with his right hand to kiss him.
  footnotes:
  - marker: a
    text: Grabbing the beard and kissing were gestures associated with a familiar greeting; here the action is deceptive in context.
    reason: cultural_note
translation:
  language: ko
  text: 요압이 아마사에게 말했습니다. 「잘 있느냐, 내 형제여?」 그리고 요압은 오른손으로 아마사의 수염을 잡아 그에게 입맞추려 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 수염을 잡고 입맞추는 동작은 친근한 인사로 연상될 수 있으나, 여기서는 문맥상 기만적인 행동입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הֲשָׁלוֹם אַתָּה
  english_pob_choice: Is it well with you
  chosen_korean: 잘 있느냐
  alternatives_korean:
  - 평안하냐
  - 무사하냐
  lexicon: HALOT
  rationale: 히브리어 관용구는 상대의 안부와 형편을 묻는 표현이므로, 한국어에서도 자연스럽고 간결한 안부 인사로 옮겼습니다.
- source_word: אָחִי
  english_pob_choice: my brother
  chosen_korean: 내 형제여
  alternatives_korean:
  - 내 형제님
  - 형제여
  lexicon: HALOT
  rationale: 소유격이 분명하므로 친밀하고 겉으로는 다정한 호칭을 살려 직역에 가깝게 옮겼습니다.
- source_word: יַד יְמִין יוֹאָב
  english_pob_choice: with his right hand
  chosen_korean: 오른손으로
  alternatives_korean:
  - 요압의 오른손으로
  - 오른손을 써서
  lexicon: HALOT
  rationale: 히브리어의 동작 주체와 도구성을 한국어 자연문으로 압축하되, 오른손이 동작에 쓰였다는 세부는 유지했습니다.
- source_word: בִּזְקַן עֲמָשָׂא
  english_pob_choice: Amasa’s beard
  chosen_korean: 아마사의 수염
  alternatives_korean:
  - 아마사의 턱수염
  - 아마사의 턱수염을
  lexicon: HALOT
  rationale: 수염을 잡는 몸짓이 본문의 핵심 동작이므로, 문화적 제스처를 약화시키지 않는 가장 პირდაპირ한 표현을 택했습니다.
- source_word: לִנְשָׁק לוֹ
  english_pob_choice: to kiss him
  chosen_korean: 그에게 입맞추려 했습니다
  alternatives_korean:
  - 그에게 입맞추기 위해
  - 그에게 입맞추려고
  lexicon: HALOT
  rationale: 목적의 ל를 살리면서, 뒤이어 이어질 기만적 행동임을 본문 흐름에 맞게 드러내기 위해 의도 표현으로 옮겼습니다.
theological_decisions:
- issue: 입맞춤과 수염 잡기의 의미
  chosen_reading: 평소의 친근한 인사 동작처럼 보이지만, 문맥상 속임수의 수단으로 제시했습니다.
  alternative_readings:
  - 단순한 환대의 표시
  - 문화적 인사 관습의 중립적 묘사
  rationale: 영어 POB의 주석처럼 이 행동은 친숙한 인사 관습과 연관되지만, 서술 맥락상 기만성이 분명하므로 그 긴장을 본문에 반영했습니다.
  doctrine_reference: 서술 문맥과 화용적 의미
- issue: 직접 인용의 호칭 등록
  chosen_reading: 인용문 안에서는 반말형 안부 표현을 사용해 요압의 사적이고 친밀한 가장을 드러냈습니다.
  alternative_readings:
  - 「평안하십니까, 내 형제여?」
  - 「잘 지내십니까, 내 형제여?」
  rationale: 히브리어의 직접 호칭과 친밀한 기만을 살리기 위해, 과도하게 공손한 한국어보다 자연스러운 구어적 등록이 더 적절합니다.
  doctrine_reference: 대화체 재현
