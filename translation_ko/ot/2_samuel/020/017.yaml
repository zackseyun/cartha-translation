  text: וַ/יִּקְרַ֣ב אֵלֶ֔י/הָ וַ/תֹּ֧אמֶר הָ/אִשָּׁ֛ה הַ/אַתָּ֥ה יוֹאָ֖ב וַ/יֹּ֣אמֶר אָ֑נִי וַ/תֹּ֣אמֶר ל֗/וֹ שְׁמַע֙ דִּבְרֵ֣י אֲמָתֶ֔/ךָ וַ/יֹּ֖אמֶר שֹׁמֵ֥עַ אָנֹֽכִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/017.yaml
  text: He came near to her[a], and the woman said, “Are you Joab?” He said, “I am.” Then she said to him, “Listen to the words of your servant.” He said, “I am listening.”
  footnotes:
  - marker: a
    text: Or “your maidservant.” The Hebrew term is a feminine self-designation of humility and service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그녀에게 가까이 가자, 그 여자가 말했습니다. 「당신이 요압입니까?」 그가 말했습니다. 「그렇소.」 그러자 그녀가 그에게 말했습니다. 「당신의 여종의 말을 들으십시오.」 그가 말했습니다. 「듣고 있습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 여종’. 히브리어는 겸손과 섬김을 나타내는 여성 자기지칭입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב אֵלֶיהָ
  english_pob_choice: He came near to her
  chosen_korean: 그가 그녀에게 가까이 가자
  alternatives_korean:
  - 그가 그녀에게 다가가자
  - 그가 그녀에게 접근하자
  lexicon: HALOT
  rationale: קרב은 실제로 가까이 다가오는 동작을 가리키므로, 관계의 방향성을 살리면서도 한국어로 자연스러운 동작 서술인 ‘가까이 가다’로 옮겼습니다.
- source_word: אֲמָתֶךָ
  english_pob_choice: your servant / your female servant
  chosen_korean: 당신의 여종
  alternatives_korean:
  - 당신의 여종
  - 당신의 여자 종
  - 당신의 종
  lexicon: HALOT
  rationale: אָמָה는 여성 종/종녀의 자기 낮춤 표현이므로, 성별과 종속성을 함께 드러내는 ‘여종’이 가장 간결하고 원문 감각에 가깝습니다.
- source_word: דִּבְרֵי
  english_pob_choice: the words of
  chosen_korean: 말을
  alternatives_korean:
  - 말씀을
  - 말들을
  lexicon: HALOT
  rationale: דְּבָרִים의 복수형은 문자 그대로 ‘말들/말’을 뜻하므로, 현대 한국어에서는 ‘말을’이 가장 자연스럽고 원문 형식을 지나치게 완화하지 않습니다.
- source_word: שֹׁמֵעַ אָנֹכִי
  english_pob_choice: I am listening
  chosen_korean: 듣고 있습니다
  alternatives_korean:
  - 듣고 있소
  - 들어주고 있습니다
  lexicon: HALOT
  rationale: 분사형은 지속적·진행 중인 응답을 나타내므로, 현재진행에 해당하는 ‘듣고 있습니다’가 가장 적절합니다.
theological_decisions:
- issue: 남성 전사 요압 앞에서 여성 화자가 정중히 자기 소개하는 장면의 호칭과 문체
  chosen_reading: 화자는 남성 상급자에게 ‘당신의 여종’이라고 자신을 낮추며, 요압의 응답은 간단한 확인형으로 유지했습니다.
  alternative_readings:
  - ‘당신의 종’으로 성중립화하기
  - 더 높은 공손 표현으로 완화하기
  rationale: 원문은 여성 자기호칭과 위계 관계를 분명히 드러내므로, 이를 중화하지 않고 그대로 전달하는 것이 장면의 긴장과 청원의 태도를 보존합니다.
  doctrine_reference: 사회적 위계와 화행의 보존
