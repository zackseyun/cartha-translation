- from: 그가 그녀에게 가까이 가자, 그 여자가 말했습니다. 「당신이 요압입니까?」 그가 말했습니다. 「그렇소.」 그러자 그녀가 그에게 말했습니다. 「당신의 여종의 말을 들으십시오.」 그가 말했습니다. 「듣고 있습니다.」[a]
  to: 그가 그녀에게 다가가자, 그 여자가 말했습니다. “당신이 요압입니까?” 그가 말했습니다. “그렇습니다.” 그러자 그녀가 그에게 말했습니다. “당신의 여종의 말을 들으십시오.” 그가 말했습니다. “듣고 있습니다.”
