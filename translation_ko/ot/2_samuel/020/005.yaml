  naturalness: ‘그가 그에게 정해 준’은 동일 절 안에서 두 대명사의 지시 대상이 불명확하여 현대 표준 한국어 문장으로 매끄럽지 않습니다. 또한 각주는 본문의 ‘소집’에 걸려야 하는데 문장 끝에 놓여 있어 연결 대상이 불분명합니다.
