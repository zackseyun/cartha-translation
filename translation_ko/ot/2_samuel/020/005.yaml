  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ עֲמָשָׂ֖א לְ/הַזְעִ֣יק אֶת יְהוּדָ֑ה ו/ייחר מִן הַ/מּוֹעֵ֖ד אֲשֶׁ֥ר יְעָדֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/005.yaml
  text: So Amasa went to summon Judah[a], but he delayed beyond the appointed time that he had set for him.
  footnotes:
  - marker: a
    text: Or 'to muster Judah.' The Hebrew verb can denote an urgent calling together, and in this context it likely includes military mobilization.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 아마사는 유다를 소집하러 갔지만, 그가 그에게 정해 준 기한을 넘겨 지체했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '유다를 소집하다'. 이 히브리어 동사는 긴급하게 사람들을 불러 모으는 뜻을 담을 수 있으며, 이 문맥에서는 군사적 동원까지 포함할 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: went
  chosen_korean: 갔지만
  alternatives_korean:
  - 갔습니다
  - 떠났지만
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리기 위해 기본 동사 '가다'를 썼습니다. 뒤의 대조를 위해 절말은 '지만'으로 연결했습니다.
- source_word: לְהַזְעִיק
  english_pob_choice: to summon
  chosen_korean: 소집하러
  alternatives_korean:
  - 소집하도록
  - 불러 모으러
  - 소집하러 가서
  lexicon: HALOT
  rationale: 이 히필형은 단순 호출보다 긴급하게 사람들을 불러 모으는 뜻이므로, '소집하다'가 문맥의 공식적이고 긴급한 뉘앙스를 잘 살립니다.
- source_word: אֶת יְהוּדָה
  english_pob_choice: Judah
  chosen_korean: 유다를
  alternatives_korean:
  - 유다 백성을
  - 유다 지파를
  lexicon: HALOT
  rationale: 히브리어의 집합적 목적어를 한국어에서는 보통 고유명사로 자연스럽게 옮길 수 있어 '유다를'로 처리했습니다.
- source_word: וייחר מִן הַמּוֹעֵד
  english_pob_choice: he delayed beyond the appointed time
  chosen_korean: 그가 그에게 정해 준 기한을 넘겨 지체했습니다
  alternatives_korean:
  - 그가 정한 시한을 넘겨 늦었습니다
  - 정해진 때를 지나 지체했습니다
  lexicon: HALOT
  rationale: מן + המועד는 단순한 늦음이 아니라 '정해 둔 기한을 넘김'을 뜻하므로, '기한을 넘겨 지체했습니다'로 옮겨 그 초과성을 분명히 했습니다.
- source_word: אֲשֶׁר יְעָדֽוֹ
  english_pob_choice: that he had set for him
  chosen_korean: 그에게 정해 준
  alternatives_korean:
  - 그를 위해 정한
  - 그에게 지정한
  lexicon: HALOT
  rationale: יעד는 시간이나 약속을 정하다의 뜻이어서, 관계대명사절을 풀어 '그에게 정해 준'으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 아마사의 지연 표현의 강도
  chosen_reading: 단순한 '늦음'보다, 정해진 기한을 넘어선 지체라는 책임 있는 지연으로 표현했습니다.
  alternative_readings:
  - 늦었습니다
  - 지각했습니다
  rationale: 문맥상 임무 수행의 지연이므로, 원문의 יחס '기한을 넘김'을 약화시키지 않는 번역이 필요했습니다.
  doctrine_reference: 서사 문맥의 사건 진행과 책임 귀속
