  text: וַ/יָּבֹ֨א דָוִ֣ד אֶל בֵּית/וֹ֮ יְרֽוּשָׁלִַם֒ וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֵ֣ת עֶֽשֶׂר נָשִׁ֣ים פִּלַגְשִׁ֡ים אֲשֶׁ֣ר הִנִּיחַ֩ לִ/שְׁמֹ֨ר הַ/בַּ֜יִת וַֽ/יִּתְּנֵ֤/ם בֵּית מִשְׁמֶ֨רֶת֙ וַֽ/יְכַלְכְּלֵ֔/ם וַ/אֲלֵי/הֶ֖ם לֹא בָ֑א וַ/תִּהְיֶ֧ינָה צְרֻר֛וֹת עַד י֥וֹם מֻתָ֖/ן אַלְמְנ֥וּת חַיּֽוּת־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/003.yaml
  text: When David came to his house at Jerusalem[a], the king took the ten women, the concubines whom he had left to keep the house, and put them in guarded custody and provided for them, but he did not go in to them. So they were kept confined until the day of their death[c][b], living as widows.
  footnotes:
  - marker: a
    text: Or 'a house of custody' or 'confinement'; the Hebrew is literally 'house of custody/guard.'
    reason: lexical_alternative
  - marker: b
    text: '''He did not go in to them'' is a Hebrew euphemism for sexual relations.'
    reason: cultural_note
  - marker: c
    text: Literally 'widowhood of livingness'—that is, they lived like widows though David was still alive.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 예루살렘의 자기 집으로 돌아오자, 왕은 집을 지키게 해 두었던 열 명의 여인 곧 첩들을 데려다가 감시된 곳에 두고 그들의 먹을 것을 공급하였으나 그들에게 들어가지 않았습니다. 그래서 그들은 죽는 날까지 갇혀 지내며 살아 있는 과부처럼 지냈습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘감시/지킴의 집’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들에게 들어가지 않았다’는 성관계를 가리키는 히브리어 완곡어법입니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘살아 있는 과부됨’으로, 남편이 살아 있어도 과부처럼 지냈다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ / אֶל בֵּיתוֹ
  english_pob_choice: his house
  chosen_korean: 자기 집
  alternatives_korean:
  - 자기 궁궐
  - 자기 집안
  lexicon: HALOT
  rationale: בַּיִת는 문맥에 따라 집, 궁궐, 집안을 뜻할 수 있으나, 여기서는 예루살렘의 왕적 거처로 돌아오는 장면이므로 ‘집’이 원문을 덜 해치면서도 자연스럽습니다.
- source_word: פִּלַגְשִׁים
  english_pob_choice: concubines
  chosen_korean: 첩들
  alternatives_korean:
  - 후궁들
  - 의식적 배우자가 아닌 여인들
  lexicon: HALOT
  rationale: פִּלַגְשִׁים은 정규 아내보다 낮은 지위의 성관계·가정 관계를 가진 여인들을 가리키며, 한국어에서 가장 직접적인 대응은 ‘첩들’입니다.
- source_word: בֵּית מִשְׁמֶרֶת
  english_pob_choice: guarded custody
  chosen_korean: 감시된 곳
  alternatives_korean:
  - 감금된 곳
  - 구금된 곳
  - 보호 감시 아래
  lexicon: HALOT
  rationale: 직역하면 ‘감시/지킴의 집’이지만, 여기서는 단순 거주가 아니라 감시 아래 격리된 상태를 나타내므로 ‘감시된 곳’이 핵심 의미를 살립니다.
- source_word: וַיְכַלְכְּלֵם
  english_pob_choice: provided for them
  chosen_korean: 그들의 먹을 것을 공급하였으나
  alternatives_korean:
  - 그들을 부양하였으나
  - 그들을 돌보았으나
  - 그들의 생활을 마련해 주었으나
  lexicon: HALOT
  rationale: כָּלְכֵּל은 지속적으로 부양·공급하다의 뜻이어서, 문맥상 최소한의 생계 보장을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: וַאֲלֵיהֶם לֹא בָא
  english_pob_choice: he did not go in to them
  chosen_korean: 그들에게 들어가지 않았습니다
  alternatives_korean:
  - 그들과 관계하지 않았습니다
  - 그들과 동침하지 않았습니다
  lexicon: HALOT
  rationale: ‘들어가다’는 כאן의 관용구로 성관계를 완곡하게 가리키므로, 한국어에서도 직설적 설명보다 관용을 살린 표현이 원문에 가깝습니다.
- source_word: צְרֻרוֹת
  english_pob_choice: kept confined
  chosen_korean: 갇혀 지내며
  alternatives_korean:
  - 갇혀 있었습니다
  - 격리된 채로
  - 유폐된 채로
  lexicon: HALOT
  rationale: 분사형이 지속적·결과적 상태를 나타내므로 단발적 ‘갇혔다’보다 상태의 지속을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 다윗이 첩들을 어떻게 대했는지에 대한 서술의 톤
  chosen_reading: 문맥의 냉혹함을 누그러뜨리지 않고, 감시·공급·성적 접근의 차단·과부 같은 생존 상태를 그대로 드러냈습니다.
  alternative_readings:
  - 보호 조치로만 보이게 완곡하게 옮김
  - 도덕적 평가를 덧붙여 비난조로 재구성
  rationale: 본문은 다윗의 조치를 설명하는 서술이지 해설이 아니므로, 원문이 드러내는 긴장과 불편함을 유지해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
