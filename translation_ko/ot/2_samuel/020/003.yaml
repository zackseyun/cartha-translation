revisions:
- from: 다윗이 예루살렘의 자기 집으로 돌아오자, 왕은 집을 지키게 해 두었던 열 명의 여인 곧 첩들을 데려다가 감시된 곳에 두고 그들의 먹을 것을 공급하였으나 그들에게 들어가지 않았습니다. 그래서 그들은 죽는 날까지 갇혀 지내며 살아 있는 과부처럼 지냈습니다.[a][b][c]
  to: 다윗이 예루살렘에 있는 자기 집에 이르자, 왕은 집을 지키게 해 두었던 열 명의 여인, 곧 첩들을 데려다가 감시 아래 두고[a] 그들을 부양하였으나, 그들에게 들어가지 않았습니다.[b] 그래서 그들은 죽는 날까지 갇혀 지내며 살아 있는 과부처럼 지냈습니다.[c]
  rationale: 구금·감시 상태를 더 분명히 나타내도록 ‘감시된 곳에 두고’를 ‘감시 아래 두고’로 고쳤습니다. 부양 동사의 의미를 음식 공급으로 한정하지 않도록 ‘그들을 부양하였으나’로 고쳤습니다. 또한 각주 표지를 해당 어구로 옮겼습니다. ‘살아 있는 과부처럼’은 원문의 역설적 표현을 자연스럽게 유지하므로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:37:41Z'
