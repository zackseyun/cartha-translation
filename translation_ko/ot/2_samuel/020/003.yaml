  naturalness: 합쇼체와 문장 흐름은 대체로 자연스럽습니다. 다만 ‘감시 아래 두고’와 ‘그들을 부양하였으나’가 현대 표준어에서 더 정확하고 자연스럽습니다. 각주 표지는 해당 표현에 직접 붙이는 편이 독자의 이해와 표지 기능에 적절합니다.
