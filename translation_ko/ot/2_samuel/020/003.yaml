  - 유폐된 채로
  lexicon: HALOT
  rationale: 분사형이 지속적·결과적 상태를 나타내므로 단발적 ‘갇혔다’보다 상태의 지속을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 다윗이 첩들을 어떻게 대했는지에 대한 서술의 톤
  chosen_reading: 문맥의 냉혹함을 누그러뜨리지 않고, 감시·공급·성적 접근의 차단·과부 같은 생존 상태를 그대로 드러냈습니다.
  alternative_readings:
  - 보호 조치로만 보이게 완곡하게 옮김
  - 도덕적 평가를 덧붙여 비난조로 재구성
  rationale: 본문은 다윗의 조치를 설명하는 서술이지 해설이 아니므로, 원문이 드러내는 긴장과 불편함을 유지해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
