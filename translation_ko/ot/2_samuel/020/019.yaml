  source_fidelity: 히브리어의 복수 표현 שְׁלֻמֵי אֱמוּנֵי는 ‘평화로운 사람들’과 ‘신실한 사람들’이라는 별개의 두 집단보다는, 평화롭고 신실한 이들을 함께 가리키는 것으로 옮기는 편이 적절합니다. עִיר וְאֵם בְּיִשְׂרָאֵל의 결합 방식은 논쟁의 여지가 있으므로 본문에서는 도시와 ‘이스라엘의 어머니’라는 이미지를 보존하고 각주를 해당 구절에 직접 붙였습니다. 도시를 목적어로 하는 לְהָמִית는 한국어에서 ‘죽이다’보다 ‘멸하다’가 문맥에 자연스럽습니다.
  naturalness: ‘이 도시’는 원문의 부정 표현을 불필요하게 특정하며, ‘삼켜 버리다’의 ‘버리다’는 원문에 없는 완료·강조감을 더합니다. 이를 각각 ‘한 도시’, ‘삼키려’로 조정했습니다. ‘멸하려 하고 있습니다’는 군사적 위협의 문맥과 현대 격식체에 자연스럽습니다.
  terminology: ‘야훼의 기업’은 נַחֲלַת יְהוָה의 언약적 소유·유산 이미지를 보존하며 프로젝트의 신명 표기와도 일치합니다. ‘이스라엘의 어머니’는 비유를 보존하고, 각주에서 ‘어머니인 도시’라는 가능한 해석을 제시합니다.
