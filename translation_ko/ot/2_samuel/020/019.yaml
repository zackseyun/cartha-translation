source:
  edition: WLC
  text: אָנֹכִ֕י שְׁלֻמֵ֖י אֱמוּנֵ֣י יִשְׂרָאֵ֑ל אַתָּ֣ה מְבַקֵּ֗שׁ לְ/הָמִ֨ית עִ֤יר וְ/אֵם֙ בְּ/יִשְׂרָאֵ֔ל לָ֥/מָּה תְבַלַּ֖ע נַחֲלַ֥ת יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/019.yaml
  text: I am one of the peaceable and faithful in Israel. You are seeking to destroy a city[a], and a mother in Israel. Why would you swallow up the inheritance of Yahweh?
  footnotes:
  - marker: a
    text: Or 'a city that is a mother in Israel,' likely meaning a prominent or nurturing city within Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 이스라엘의 평화로운 사람들과 신실한 사람들 가운데 하나입니다. 당신은 이 도시와 이스라엘의 어머니를 죽이려 하고 있습니다. 어찌 야훼의 기업을 삼켜 버리려 하십니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 어머니인 도시’로도 옮길 수 있으며, 유력하거나 양육하는 도시를 가리킬 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֻמֵי אֱמוּנֵי
  english_pob_choice: one of the peaceable and faithful
  chosen_korean: 평화로운 사람들과 신실한 사람들 가운데 하나입니다
  alternatives_korean:
  - 평화로운 이들과 신실한 이들 가운데 하나입니다
  - 평화롭고 신실한 자들 가운데 하나입니다
  lexicon: HALOT
  rationale: 두 형용사적 복수구를 한국어에서 자연스럽게 집단 소속으로 풀어, 화자가 자기 성향이 아니라 이스라엘 안에서 평화와 신실함을 대표하는 편에 있음을 드러냈습니다.
- source_word: מְבַקֵּשׁ לְהָמִית
  english_pob_choice: are seeking to put to death
  chosen_korean: 죽이려 하고 있습니다
  alternatives_korean:
  - 죽이려고 하고 있습니다
  - 죽여 없애려 하고 있습니다
  lexicon: HALOT
  rationale: 문맥상 특정 도시를 향한 군사적 공격이지만, 히브리어의 핵심 동사 מות의 직접 의미를 살려 과도하게 ‘파괴하다’로 일반화하지 않고 ‘죽이다’로 옮겼습니다.
- source_word: עִיר וְאֵם בְּיִשְׂרָאֵל
  english_pob_choice: a city, and a mother in Israel
  chosen_korean: 이 도시와 이스라엘의 어머니
  alternatives_korean:
  - 이스라엘의 한 도시와 어머니
  - 이스라엘에서 어머니 같은 도시
  lexicon: HALOT
  rationale: 도시를 ‘어머니’로 부르는 비유를 본문에 보존해 수사적 강도를 유지했고, 한국어에서는 쉼표보다 접속으로 자연스럽게 연결했습니다.
- source_word: נַחֲלַת יְהוָה
  english_pob_choice: the inheritance of Yahweh
  chosen_korean: 야훼의 기업
  alternatives_korean:
  - 야훼의 유산
  - 야훼께 속한 기업
  lexicon: HALOT
  rationale: נחלה의 언약적·소유적 뉘앙스를 살려 관용적으로도 통하는 ‘기업’을 사용했고, 여호와 대신 프로젝트 기본값인 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: ‘mother in Israel’의 은유 유지
  chosen_reading: 도시를 실제 어머니로 설명하지 않고, ‘이스라엘의 어머니’라는 은유를 본문에 남겼습니다.
  alternative_readings:
  - 이스라엘의 중심 도시로 풀어 옮김
  - 어머니 같은 도시로 의역
  rationale: 본문의 수사학적 긴장과 명예 호소를 보존하는 편이 원문 의도에 더 가깝고, 과잉 해석을 피할 수 있습니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: 야훼의 기업에 대한 공격을 묘사하는 동사
  chosen_reading: ‘삼켜 버리려 하십니까?’로 옮겨 파괴의 은유를 유지했습니다.
  alternative_readings:
  - 파괴하려 하십니까?
  - 집어삼키려 하십니까?
  rationale: 히브리어 בלע의 생생한 이미지를 살리되 한국어에서 자연스럽게 읽히도록 ‘삼켜 버리다’로 처리했습니다.
  doctrine_reference: Translation philosophy §3
