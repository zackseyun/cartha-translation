  yaml_path: translation/ot/2_samuel/020/011.yaml
  text: And one of Joab’s young men stood over him and said[a], “Whoever favors Joab, and whoever is for David[b], follow Joab!”
  footnotes:
  - marker: a
    text: 'Hebrew literally, “after Joab.” The sense in context is a call to rally behind him: “follow Joab.”'
    reason: lexical_alternative
  - marker: b
    text: “Young men” may also be rendered “servants” or “attendants,” referring to Joab’s subordinate retainers.
    reason: lexical_alternative
translation:
  language: ko
  text: 요압의 부하들[b] 가운데 한 사람이 그의 곁에 서서 말했습니다. “요압을 지지하는 사람은 누구든지, 다윗에게 충성하는 사람은 누구든지 요압을 따르십시오!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘요압 뒤에’입니다. 문맥상 요압의 뒤를 따라가라는 외침이므로 ‘요압을 따르십시오’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘청년들’은 여기서 요압의 하급 부하들을 가리킬 수 있으며, ‘종들’ 또는 ‘시종들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  english_pob_choice: And one
  chosen_korean: 그때 … 한 사람이
  alternatives_korean:
  - 그리고 한 사람이
  - 그리고 어떤 사람이
  lexicon: HALOT
  rationale: אִישׁ는 문자적으로 ‘사람/남자’이지만, 여기서는 요압의 부하들 가운데 한 명을 가리키는 비특정 표현이므로 한국어에서는 자연스럽게 ‘한 사람’으로 옮겼습니다.
- source_word: מִנַּעֲרֵי יוֹאָב
  english_pob_choice: of Joab’s young men
  chosen_korean: 요압의 청년들 가운데
  alternatives_korean:
  - 요압의 종들 가운데
  - 요압의 시종들 가운데
  lexicon: HALOT
  rationale: נַעַר는 문맥에 따라 청년, 종, 시종이 될 수 있으나, 여기서는 군사적 추종 집단을 가리키므로 ‘청년들’이 원문 형태와 문맥을 가장 직접적으로 드러냅니다.
- source_word: חָפֵץ בְּיוֹאָב
  english_pob_choice: favors Joab
  chosen_korean: 요압 편에 있는
  alternatives_korean:
  - 요압을 좋아하는
  - 요압을 기뻐하는
  lexicon: HALOT
  rationale: חָפֵץ는 ‘기뻐하다, 원하다, 좋아하다’의 뜻이지만, 이 외침에서는 개인적 호감보다 충성/지지를 뜻하므로 ‘편에 있는’으로 옮겨 정치적·군사적 결속을 살렸습니다.
- source_word: לְדָוִד
  english_pob_choice: for David
  chosen_korean: 다윗 편에 있는
  alternatives_korean:
  - 다윗 편인
  - 다윗을 따르는
  lexicon: HALOT
  rationale: לְ는 여기서 소속이나 충성을 나타내므로, ‘다윗 편에 있는’이 원문의 대립 구조를 한국어로 가장 자연스럽게 재현합니다.
- source_word: אַחֲרֵי יוֹאָב
  english_pob_choice: follow Joab
  chosen_korean: 요압을 따르십시오
  alternatives_korean:
  - 요압 뒤를 따르십시오
  - 요압 뒤로 가십시오
  lexicon: HALOT
  rationale: אַחֲרֵי는 직역하면 ‘뒤에/뒤따라’이지만, 여기서는 행동 촉구의 명령이므로 POB의 해석을 따라 ‘따르십시오’로 옮겼습니다.
