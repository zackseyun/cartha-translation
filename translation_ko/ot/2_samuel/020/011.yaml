revisions:
- from: 그때 요압의 청년들 가운데 한 사람이 그 위에 서서 말했습니다. 「누구든지 요압 편에 있는 사람은, 그리고 누구든지 다윗 편에 있는 사람은, 요압을 따르십시오!」[a][b]
  to: 요압의 부하들[b] 가운데 한 사람이 그의 곁에 서서 말했습니다. “요압을 지지하는 사람은 누구든지, 다윗에게 충성하는 사람은 누구든지 요압을 따르십시오!”[a]
  rationale: 문맥상 군사적 소속을 나타내는 표현을 자연스러운 한국어로 다듬고, ‘청년들’의 어휘적 폭은 각주에 보존했습니다. 또한 각주 표지를 실제로 설명하는 어구 바로 뒤로 옮겼습니다. ‘그의 곁에’는 원문의 전치사가 지닌 ‘위에/곁에’의 문맥적 범위를 한국어에서 무리 없이 반영합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:37:46Z'
