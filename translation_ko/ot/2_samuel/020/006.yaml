  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל אֲבִישַׁ֔י עַתָּ֗ה יֵ֧רַֽע לָ֛/נוּ שֶׁ֥בַע בֶּן בִּכְרִ֖י מִן אַבְשָׁל֑וֹם אַ֠תָּה קַ֞ח אֶת עַבְדֵ֤י אֲדֹנֶ֨י/ךָ֙ וּ/רְדֹ֣ף אַחֲרָ֔י/ו פֶּן מָ֥צָא ל֛/וֹ עָרִ֥ים בְּצֻר֖וֹת וְ/הִצִּ֥יל עֵינֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/006.yaml
  text: Then David said to Abishai[a], “Now Sheba son of Bichri will do us more harm than Absalom. You, take your lord’s servants and pursue after him, lest he find fortified cities for himself and escape from our sight.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'and deliver our eyes,' an idiom meaning 'escape from our sight' or 'elude us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗이 아비새에게 말했습니다. “이제 비그리의 아들 세바가 압살롬보다 우리에게 더 큰 해를 끼칠 것입니다. 당신은 당신의 주인의 종들을 데리고 그를 추격하십시오. 그가 견고한 성읍들을 얻어 우리 눈앞에서 벗어날까 염려됩니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 “우리 눈을 구해 내다”입니다. 이는 그가 우리의 시야에서 벗어나거나 우리를 따돌린다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרַע לָנוּ
  english_pob_choice: will do us more harm
  chosen_korean: 더 큰 해를 끼칠 것입니다
  alternatives_korean:
  - 우리에게 더 악할 것입니다
  - 우리에게 더 큰 해를 줄 것입니다
  lexicon: HALOT
  rationale: 문맥상 도덕적 악이 아니라 해악·재난의 비교를 말하므로, 비교의 힘을 살려 자연스러운 현대 한국어로 옮겼습니다.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  english_pob_choice: Sheba son of Bichri
  chosen_korean: 기브리의 아들 세바
  alternatives_korean:
  - 세바, 비그리의 아들
  - 비그리의 아들 세바
  lexicon: 고유명사 표기 관행
  rationale: 통용되는 인명 음역을 따르되, 히브리어 계보 구조를 보존하기 위해 ‘아들’ 구문을 유지했습니다.
- source_word: עַבְדֵי אֲדֹנֶיךָ
  english_pob_choice: your lord’s servants
  chosen_korean: 네 주인의 종들
  alternatives_korean:
  - 네 주인의 종들
  - 네 주인의 노예들
  - 주인의 종들
  lexicon: HALOT
  rationale: 아도네카는 아비새의 주인 곧 다윗을 가리키며, 여기서는 소속된 부하들을 뜻하므로 ‘종들’이 적절합니다. ‘노예들’은 본문이 강조하는 관계를 과도하게 좁힐 수 있어 채택하지 않았습니다.
- source_word: וּרְדֹף אַחֲרָיו
  english_pob_choice: and pursue after him
  chosen_korean: 그를 뒤쫓으십시오
  alternatives_korean:
  - 그를 추격하십시오
  - 그를 뒤따르십시오
  lexicon: HALOT
  rationale: 군사적 추격의 의미를 담으면서도 한국어에서 중복 어감을 줄여 자연스럽게 표현했습니다.
- source_word: וְהִצִּיל עֵינֵינוּ
  english_pob_choice: escape from our sight
  chosen_korean: 우리 눈앞에서 벗어나지 못하게 하려는 것입니다
  alternatives_korean:
  - 우리 시야에서 사라지지 못하게 하려는 것입니다
  - 우리를 피해 달아나지 못하게 하려는 것입니다
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지는 ‘우리 눈을 빼앗다/눈앞에서 벗어나다’에 가깝지만, 한국어에서는 그 관용을 살려 ‘우리 눈앞에서 벗어나다’로 옮기는 것이 가장 직접적입니다.
