  source_fidelity: ‘기브리’는 히브리어 בִּכְרִי(Bikhri)의 음역으로 부정확하며 ‘비그리’로 고쳐야 합니다. 또한 פֶּן 이하 절은 세바가 성읍들을 확보하여 달아날 가능성을 경계하는 내용인데, 초안의 ‘벗어나지 못하게 하려는 것입니다’는 목적을 설명하는 평서문으로 바꾸어 직접 명령과 경계의 구조를 흐립니다.
  naturalness: 인용문에서 ‘너는’과 합쇼체 명령 ‘뒤쫓으십시오’가 혼용되어 말투가 일관되지 않습니다. 현대 정중체에서는 ‘당신은 … 추격하십시오’로 통일할 수 있습니다. ‘…벗어날까 염려되니’는 פֶּן의 우려·방지 뉘앙스를 자연스럽게 드러냅니다.
