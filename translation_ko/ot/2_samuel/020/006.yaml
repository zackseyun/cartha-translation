- from: 그때 다윗이 아비새에게 말했습니다. “이제 기브리의 아들 세바가 압살롬보다 우리에게 더 큰 해를 끼칠 것입니다. 너는 네 주인의 종들을 데리고 그를 뒤쫓으십시오. 그가 견고한 성읍들을 얻어 우리 눈앞에서 벗어나지 못하게 하려는 것입니다.”[a]
  to: 그때 다윗이 아비새에게 말했습니다. “이제 비그리의 아들 세바가 압살롬보다 우리에게 더 큰 해를 끼칠 것입니다. 당신은 당신의 주인의 종들을 데리고 그를 추격하십시오. 그가 견고한 성읍들을 얻어 우리 눈앞에서 벗어날까 염려됩니다.”[a]
  rationale: 원문의 계보명 בֶּן בִּכְרִי를 정확한 음역인 ‘비그리의 아들’로 바로잡았습니다. 강조된 주어 אַתָּה는 ‘당신은’으로 남기되 인용문 전체를 합쇼체로 통일했습니다. פֶּן이 이끄는 경계 절은 ‘…벗어날까 염려됩니다’로 옮겨 세바가 요새화된 성읍을 확보한 뒤 추격을 피할 위험을 보존했습니다. 각주는 히브리어 관용구의 직역을 바로잡고 의미를 설명합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:37:30Z'
