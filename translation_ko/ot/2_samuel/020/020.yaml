source:
  edition: WLC
  text: וַ/יַּ֥עַן יוֹאָ֖ב וַ/יֹּאמַ֑ר חָלִ֤ילָ/ה חָלִ֨ילָ/ה֙ לִ֔/י אִם אֲבַלַּ֖ע וְ/אִם אַשְׁחִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/020.yaml
  text: Joab answered and said[a], “Far be it from me, far be it, if I should swallow up or destroy!”
  footnotes:
  - marker: a
    text: Or 'if I should engulf or bring to ruin.' The Hebrew uses vivid verbs for consuming and destroying.
    reason: lexical_alternative
translation:
  language: ko
  text: 요압이 대답하여 말했습니다. 「그럴 수 없습니다, 그럴 수 없습니다. 내가 삼켜 버리거나 멸망시키는 일이야 있겠습니까!」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘삼켜 버리다’와 ‘멸망시키다’라는 생생한 동사를 사용합니다. 문맥에 따라 ‘집어삼키다’ 또는 ‘파멸시키다’의 뉘앙스가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하여
  alternatives_korean:
  - 응답하여
  - 말하여
  lexicon: HALOT
  rationale: 서술 대화의 응답 동사를 자연스러운 합쇼체로 옮기되, 이어지는 말하기 동사를 살려 히브리어의 대화 구조를 반영했습니다.
- source_word: וַיֹּאמַר
  english_pob_choice: and said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하여
  - 이르러
  lexicon: HALOT
  rationale: 히브리어의 일반적인 발화 도입을 현대 한국어 서술로 자연스럽게 처리했습니다.
- source_word: חָלִילָה חָלִילָה לִי
  english_pob_choice: Far be it from me, far be it
  chosen_korean: 그럴 수 없습니다, 그럴 수 없습니다
  alternatives_korean:
  - 절대로 그럴 수 없습니다, 절대로 그럴 수 없습니다
  - 결코 그럴 수 없습니다, 결코 그럴 수 없습니다
  lexicon: HALOT
  rationale: 강한 부정을 나타내는 관용구라 직역보다 한국어의 단호한 거절 표현으로 옮기되, 중복을 살려 강조를 보존했습니다.
- source_word: אֲבַלַּע
  english_pob_choice: I should swallow up
  chosen_korean: 삼켜 버리거나
  alternatives_korean:
  - 삼키거나
  - 집어삼키거나
  lexicon: HALOT
  rationale: בלע의 생생한 이미지를 살려 ‘삼키다’ 계열로 옮겼고, 문맥상 위협적 함의를 자연스럽게 드러내기 위해 ‘버리다’를 보완했습니다.
- source_word: וְאִם אַשְׁחִית
  english_pob_choice: or destroy
  chosen_korean: 멸망시키는
  alternatives_korean:
  - 파괴하는
  - 멸하는
  lexicon: HALOT
  rationale: שׁחת의 파괴·멸망 의미를 전쟁 문맥에 맞게 옮겼습니다. '멸망시키다'는 결과의 파괴성을 잘 드러냅니다.
theological_decisions:
- issue: 요압의 강한 부정 어조
  chosen_reading: ‘그럴 수 없습니다, 그럴 수 없습니다’로 두 번 반복해, 히브리어의 격한 거절과 자기정당화를 드러냈습니다.
  alternative_readings:
  - ‘절대 아닙니다’
  - ‘천만에요’
  rationale: 원문의 חָלִילָה חָלִילָה 반복은 단순 부정이 아니라 강한 도덕적 거부를 표합니다. 반복을 유지해야 화자의 의도가 살아납니다.
  doctrine_reference: 서사 본문의 수사적 강조 보존
- issue: ‘swallow up’와 ‘destroy’의 이중 동사
  chosen_reading: ‘삼켜 버리거나 멸망시키는’으로, 파괴의 두 이미지를 모두 살렸습니다.
  alternative_readings:
  - ‘집어삼키거나 파괴하는’
  - ‘삼켜 버리거나 없애는’
  rationale: 영어 POB가 지적한 것처럼 히브리어는 생생한 소비/파괴 동사를 병렬로 사용합니다. 둘 중 하나로 평준화하지 않고 모두 드러내는 것이 원문의 힘을 보존합니다.
  doctrine_reference: 원문 이미지의 보존
