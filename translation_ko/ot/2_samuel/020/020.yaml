translation:
  language: ko
  text: 요압이 대답하여 말했습니다. “나로서는 결코, 결코 그럴 수 없습니다. 내가 삼키거나 파괴하다니요!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘삼키다’와 ‘파괴하다’라는 생생한 동사를 사용합니다. 문맥에 따라 ‘집어삼키다’ 또는 ‘파멸시키다’로 옮길 수 있습니다.
    reason: lexical_alternative
