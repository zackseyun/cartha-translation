- from: 요압이 대답하여 말했습니다. 「그럴 수 없습니다, 그럴 수 없습니다. 내가 삼켜 버리거나 멸망시키는 일이야 있겠습니까!」[a]
  to: 요압이 대답하여 말했습니다. “나로서는 결코, 결코 그럴 수 없습니다. 내가 삼키거나 파괴하다니요!”[a]
  rationale: 반복된 חָלִילָה를 ‘결코, 결코’로 보존하고 לִי를 ‘나로서는’으로 드러냈습니다. 이어지는 ‘내가 … 하다니요!’는 אִם이 도입하는 강하게 거부된 가능성을 현대 한국어의 자연스러운 수사 의문으로 표현합니다. 두 동사는 각각 ‘삼키다’와 ‘파괴하다’로 구별하여 원문의 병렬 이미지와 의미 범위를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:37:44Z'
