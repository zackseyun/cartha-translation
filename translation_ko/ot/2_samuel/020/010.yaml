source:
  edition: WLC
  text: וַ/עֲמָשָׂ֨א לֹֽא נִשְׁמַ֜ר בַּ/חֶ֣רֶב אֲשֶׁ֣ר בְּ/יַד יוֹאָ֗ב וַ/יַּכֵּ/הוּ֩ בָ֨/הּ אֶל הַ/חֹ֜מֶשׁ וַ/יִּשְׁפֹּ֨ךְ מֵעָ֥י/ו אַ֛רְצָ/ה וְ/לֹא שָׁ֥נָה ל֖/וֹ וַ/יָּמֹ֑ת וְ/יוֹאָב֙ וַ/אֲבִישַׁ֣י אָחִ֔י/ו רָדַ֕ף אַחֲרֵ֖י שֶׁ֥בַע בֶּן בִּכְרִֽי־׀־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/010.yaml
  text: But Amasa was not on guard against the sword that was in Joab’s hand[a], and he struck him with it in the belly, and his entrails spilled out to the ground; he did not strike him again, and he died. Then Joab and Abishai his brother pursued Sheba son of Bichri.
  footnotes:
  - marker: a
    text: Or 'in the fifth rib.' The Hebrew expression has traditionally been rendered this way in older English versions, but the term more likely refers generally to the belly or abdomen in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 아마사는 요압의 손에 있는 칼을 경계하지 않았습니다. 요압은 그 칼로 아마사의 배[a]를 쳤고, 아마사의 내장이 땅에 쏟아졌습니다. 요압은 그를 다시 치지 않았고, 아마사는 죽었습니다. 요압과 그의 형제 아비새는 비그리의 아들 세바를 뒤쫓았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '다섯째 갈비뼈에'. 이 히브리어 표현은 오래된 영어 성경 번역들에서 전통적으로 이렇게 옮겨졌지만, 이 문맥에서는 일반적으로 배나 복부를 가리키는 것으로 보는 편이 더 타당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נִשְׁמַר
  english_pob_choice: was not on guard
  chosen_korean: 경계하지 못하였으므로
  alternatives_korean:
  - 경계하지 않았으므로
  - 깨어 있지 못하였으므로
  - 조심하지 않았으므로
  lexicon: HALOT
  rationale: נשמר의 수동/반사적 뉘앙스를 살려, 단순한 지식 부족이 아니라 전투 상황에서의 경계 실패를 나타내는 표현으로 옮겼습니다.
- source_word: אֶל הַחֹמֶשׁ
  english_pob_choice: in the belly
  chosen_korean: 그의 배를
  alternatives_korean:
  - 그의 복부를
  - 그의 옆구리를
  - 그의 다섯째 갈비를
  lexicon: HALOT
  rationale: 이 구절의 חֹמֶשׁ은 전통적 '다섯째 갈비'보다 배/복부를 가리키는 문맥적 의미가 더 분명하므로, 현대 독자가 이해할 수 있는 직설적 표현을 택했습니다.
- source_word: וַיִּשְׁפֹּךְ מֵעָיו אַרְצָה
  english_pob_choice: his entrails spilled out to the ground
  chosen_korean: 그의 창자가 땅에 쏟아졌습니다
  alternatives_korean:
  - 그의 내장이 땅에 쏟아졌습니다
  - 그의 속이 땅으로 흘러나왔습니다
  - 그의 창자가 땅으로 쏟아졌습니다
  lexicon: HALOT
  rationale: פּך의 강한 유출 이미지를 살리면서, 현대 한국어에서 지나치게 구어적이지 않은 '창자'를 사용해 서술의 충격과 육체성을 유지했습니다.
- source_word: וְלֹא שָׁנָה לוֹ
  english_pob_choice: he did not strike him again
  chosen_korean: 그는 다시 찌르지 않았고
  alternatives_korean:
  - 그는 그에게 다시 하지 않았고
  - 그는 그것을 반복하지 않았고
  - 그는 두 번째로 찌르지 않았고
  lexicon: HALOT
  rationale: 문맥상 같은 칼로 가한 일격의 반복을 뜻하므로, 영어 POB의 해석을 따라 '다시 찌르지 않았다'로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 서술의 폭력성 강도와 직역성 유지
  chosen_reading: 본문의 잔혹한 신체 묘사를 완화하지 않고 그대로 드러내어, 전쟁 서사의 사실성과 긴장감을 보존했습니다.
  alternative_readings:
  - 부드럽게 완곡화하여 표현하는 번역
  - 신체 부위를 일반화해 충격을 낮추는 번역
  rationale: 히브리어 원문은 의도적으로 생생한 폭력을 묘사하므로, 이를 희석하면 서사의 효과와 경고성이 약해집니다.
  doctrine_reference: 성경 서사의 사실적 증언과 원문 의미 보존 원칙
- issue: 아마사의 죽음 서술과 문장 연결
  chosen_reading: 아마사의 죽음과 뒤이은 추격을 연속된 사건으로 연결해, 히브리어 wayyiqtol의 서술 흐름을 살렸습니다.
  alternative_readings:
  - 문장을 분리해 사건의 속도를 늦추는 번역
  - 결과를 설명하는 해설적 연결
  rationale: 원문은 사건을 빠르게 연쇄시키며 긴박감을 형성하므로, 한국어에서도 서술 순서를 유지하는 것이 적절합니다.
  doctrine_reference: 본문 서술 구조 보존 원칙
