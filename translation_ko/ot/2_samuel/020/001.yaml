id: 2SA.20.1
reference: 2 Samuel 20:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁ֨ם נִקְרָ֜א אִ֣ישׁ בְּלִיַּ֗עַל וּ/שְׁמ֛/וֹ שֶׁ֥בַע בֶּן בִּכְרִ֖י אִ֣ישׁ יְמִינִ֑י וַ/יִּתְקַ֣ע בַּ/שֹּׁפָ֗ר וַ֠/יֹּאמֶר אֵֽין לָ֨/נוּ חֵ֜לֶק בְּ/דָוִ֗ד וְ/לֹ֤א נַֽחֲלָה לָ֨/נוּ֙ בְּ/בֶן יִשַׁ֔י אִ֥ישׁ לְ/אֹהָלָ֖י/ו יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/001.yaml
  text: Now there happened to be there a worthless man[a], whose name was Sheba son of Bichri, a Benjaminite. He blew the trumpet and said, “We have no share in David, and no inheritance in the son of Jesse. Every man to his tents[d][c][b], O Israel!”
  footnotes:
  - marker: a
    text: Or 'a wicked man,' 'a scoundrel,' or more literally 'a man of Belial.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew shofar, a horn used as a public signal; traditionally understood as a ram's horn.
    reason: cultural_note
  - marker: c
    text: Or 'We have no portion in David.'
    reason: lexical_alternative
  - marker: d
    text: The Hebrew says 'Every man to his tents,' a distributive idiom meaning each person should depart to his own home or camp.
    reason: lexical_alternative
translation:
  language: ko
  text: 마침 그곳에 불량한 사람[a]이 있었는데, 그는 베냐민 사람 비그리의 아들 세바였습니다. 그가 나팔[b]을 불고 말했습니다. “우리는 다윗에게 몫이 없고[c], 이새의 아들에게 유업이 없습니다. 이스라엘이여, 각자 자기 장막으로 가십시오!”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악한 사람’, ‘불한당’. 히브리어로는 더 직역하여 ‘벨리알의 사람’이라고 할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어 쇼파르: 공적 신호에 쓰는 뿔나팔이며, 전통적으로 숫양의 뿔로 이해됩니다.'
    reason: cultural_note
  - marker: c
    text: 또는 ‘우리는 다윗에게 몫이 없다.’
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 ‘각 사람은 자기 장막으로’라고 합니다. 이는 각자가 자기 집이나 진영으로 흩어져 가라는 분배적 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּלִיַּעַל
  english_pob_choice: a worthless man
  chosen_korean: 불량한 사람
  alternatives_korean:
  - 무가치한 사람
  - 사악한 사람
  - 벨리알의 사람
  lexicon: HALOT
  rationale: בְּלִיַּעַל은 여기서 고유명사보다 성품을 드러내는 일반 표현이므로, 한국어에서도 후대의 ‘벨리알’ 신학적 연상을 피하고 인물의 비도덕성을 직접 드러냈습니다.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  english_pob_choice: He blew the trumpet
  chosen_korean: 나팔을 불고
  alternatives_korean:
  - 숫양뿔 나팔을 불고
  - 쇼파르를 불고
  lexicon: HALOT
  rationale: שׁוֹפָר는 원래 뿔나팔이지만, 서사에서 공개 신호를 알리는 동작으로서 한국어에는 가장 자연스러운 ‘나팔을 불다’로 옮기고, 구체성은 필요할 때 주석 없이도 충분히 유지됩니다.
- source_word: אֵין לָנוּ חֵלֶק בְּדָוִד
  english_pob_choice: We have no share in David
  chosen_korean: 우리는 다윗에게서 몫이 없고
  alternatives_korean:
  - 우리는 다윗에게서 분깃이 없고
  - 우리는 다윗과 상관이 없고
  lexicon: HALOT
  rationale: חֵלֶק은 ‘share/portion’의 뜻이므로 정치적 소속과 이해관계의 부정을 드러내는 ‘몫’이 적절합니다.
- source_word: וְלֹא נַחֲלָה לָנוּ בְּבֶן יִשַׁי
  english_pob_choice: and no inheritance in the son of Jesse
  chosen_korean: 이새의 아들에게서도 유업이 없습니다
  alternatives_korean:
  - 이새의 아들에게서도 상속분이 없습니다
  - 이새의 아들에게서도 분깃이 없습니다
  lexicon: HALOT
  rationale: נַחֲלָה는 ‘inheritance’의 법적·언약적 울림을 가지므로, 한국어에서도 교회식 완곡어보다 ‘유업’이 본문의 거리감과 비유적 분배 의미를 함께 살립니다.
- source_word: אִישׁ לְאֹהָלָיו
  english_pob_choice: Every man to his tents
  chosen_korean: 각자 자기 장막으로 돌아가십시오
  alternatives_korean:
  - 모두 자기 장막으로 가십시오
  - 각 사람은 자기 장막으로 가십시오
  lexicon: HALOT
  rationale: 히브리어는 분배적 관용구이므로 문자형을 그대로 두기보다 한국어 독자가 즉시 알아들을 수 있는 퇴거 명령으로 풀되, ‘장막’ 이미지는 유지했습니다.
theological_decisions:
- issue: “이새의 아들”이라는 표현의 뉘앙스
  chosen_reading: 왕호를 쓰지 않고 혈통으로 다윗을 지칭하는 경멸적 호칭으로 살렸습니다.
  alternative_readings:
  - 그냥 ‘다윗’으로 단순화하기
  - ‘이새의 아들 다윗’으로 확장하기
  rationale: 본문은 왕적 권위를 거부하는 말투이므로, 한국어에서도 인물의 혈통을 앞세운 호칭을 유지해야 수사적 폄하가 살아납니다.
  doctrine_reference: 원문 수사 보존, 번역철학 §1
- issue: “이스라엘이여”의 호격 처리
  chosen_reading: 호격을 분명히 드러내는 ‘이스라엘이여’와 명령형 ‘돌아가십시오’를 사용했습니다.
  alternative_readings:
  - ‘이스라엘아’로 옮기기
  - 호격을 생략하고 평서문으로 만들기
  rationale: 반란 선동의 구호이므로 청중 호출과 즉각적 분산 명령이 둘 다 필요합니다. 한국어 합쇼체 안에서도 호격과 명령의 긴장을 유지했습니다.
  doctrine_reference: 담화 기능 보존, 한국어 문체 일관성
