revisions:
- from: 그곳에 불량한 사람이 하나 있었는데, 그의 이름은 세바, 비그리의 아들이었고 베냐민 사람입니다. 그가 나팔을 불고 말했습니다. “우리는 다윗에게서 몫이 없고, 이새의 아들에게서도 유업이 없습니다. 이스라엘이여, 각자 자기 장막으로 돌아가십시오!”[a][b][c]
  to: 마침 그곳에 불량한 사람[a]이 있었는데, 그는 베냐민 사람 비그리의 아들 세바였습니다. 그가 나팔[b]을 불고 말했습니다. “우리는 다윗에게 몫이 없고[c], 이새의 아들에게 유업이 없습니다. 이스라엘이여, 각자 자기 장막으로 가십시오!”[d]
  rationale: 과거 서사체를 일관되게 적용하고, 원문에 없는 ‘돌아-’의 방향성을 제거했습니다. 또한 모든 각주를 관련 어구에 직접 연결하고, 영어 POB 감사 기록에 있는 בְּלִיַּעַל의 번역 대안을 한국어 주석으로 보완했습니다.
  reviewer_model: gpt-5.6-terra
