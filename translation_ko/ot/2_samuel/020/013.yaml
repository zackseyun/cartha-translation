  text: כַּ/אֲשֶׁ֥ר הֹגָ֖ה מִן הַֽ/מְסִלָּ֑ה עָבַ֤ר כָּל אִישׁ֙ אַחֲרֵ֣י יוֹאָ֔ב לִ/רְדֹּ֕ף אַחֲרֵ֖י שֶׁ֥בַע בֶּן בִּכְרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/013.yaml
  text: As soon as he had been removed from the highway[a], every man passed on after Joab to pursue Sheba son of Bichri.
  footnotes:
  - marker: a
    text: Or 'from the road' / 'from the roadway.' The Hebrew מְסִלָּה can denote a highway or main road.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 길에서 치워지자마자, 모든 사람이 요압을 따라 지나가 세바, 비그리의 아들을 추격하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְסִלָּה는 여기서 ‘길’, ‘큰길’, ‘도로’ 또는 ‘고속도로’에 해당할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  english_pob_choice: As soon as
  chosen_korean: 자마자
  alternatives_korean:
  - 그때
  - ~할 때
  lexicon: HALOT
  rationale: 즉각적인 시간적 선후를 나타내는 문맥이므로, 단순한 동시성보다 ‘자마자’가 서술의 긴박함을 잘 살립니다.
- source_word: הֹגָה מִן הַמְסִלָּה
  english_pob_choice: had been removed from the highway
  chosen_korean: 길에서 치워지자
  alternatives_korean:
  - 도로에서 옮겨지자
  - 큰길에서 제거되자
  lexicon: HALOT
  rationale: 동사의 피동적 의미와 장애물이 치워진 상황을 살려 ‘치워지다’로 옮겼고, מְסִלָּה는 여기서 실제 전투 진행을 막던 길을 뜻하므로 자연스럽게 ‘길’로 처리했습니다.
- source_word: כָּל אִישׁ אַחֲרֵי יוֹאָב
  english_pob_choice: every man passed on after Joab
  chosen_korean: 모든 사람이 요압을 따라 지나가
  alternatives_korean:
  - 모든 군인이 요압 뒤를 따라
  - 모든 사람이 요압 뒤를 따라
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현을 살리면서도 한국어에서는 군사적 이동 문맥이 자연스럽게 드러나도록 ‘따라 지나가’로 옮겼습니다.
- source_word: לִרְדֹּף אַחֲרֵי שֶׁבַע בֶּן בִּכְרִי
  english_pob_choice: to pursue Sheba son of Bichri
  chosen_korean: 세바, 비그리의 아들을 추격하였습니다
  alternatives_korean:
  - 세바, 비그리의 아들을 뒤쫓았습니다
  - 세바, 비그리의 아들을 추적하였습니다
  lexicon: HALOT
  rationale: 전쟁/추격의 강한 목적성을 드러내기 위해 ‘추격하다’를 택했고, 히브리어 인명 구조는 ‘비그리의 아들’로 보존했습니다.
theological_decisions:
- issue: 본절의 서술 긴박감과 군사적 연속성
  chosen_reading: 장애물이 치워지자 곧바로 군대가 진격하여 추격을 재개하는 장면으로 읽었습니다.
  alternative_readings:
  - 단순히 ‘그 후’로 완만하게 연결하는 읽기
  - ‘지나가다’를 약하게 하여 단순 통과로 보는 읽기
  rationale: 앞절의 시신이 길에서 옮겨진 직후라는 문맥을 반영해, 서사의 급박한 진행과 추격의 즉각성을 드러내는 쪽이 본문의 힘을 더 잘 보존합니다.
  doctrine_reference: 서사 문맥의 즉시성 해석
- issue: 인명 표기
  chosen_reading: שֶׁבַע בֶּן בִּכְרִי를 ‘세바, 비그리의 아들’로 옮겼습니다.
  alternative_readings:
  - ‘세바, 비그리의 아들’ 대신 ‘세바, 비그리 사람’으로 완화
  - ‘비그리의 아들 세바’로 도치
  rationale: 히브리어의 통상적인 patronymic 구조를 그대로 살려 인물 식별과 계보 정보를 유지했습니다.
  doctrine_reference: 고유명사/계보 표기 원칙
