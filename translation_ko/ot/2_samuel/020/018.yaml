id: 2SA.20.18
reference: 2 Samuel 20:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֖אמֶר לֵ/אמֹ֑ר דַּבֵּ֨ר יְדַבְּר֤וּ בָ/רִֽאשֹׁנָה֙ לֵ/אמֹ֔ר שָׁאֹ֧ל יְשָׁאֲל֛וּ בְּ/אָבֵ֖ל וְ/כֵ֥ן הֵתַֽמּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/018.yaml
  text: Then she said[a], “They used to say in former times[b], ‘Let them surely ask at Abel,’ and so they ended the matter.”
  footnotes:
  - marker: a
    text: Or “They would surely say in former times, ‘Let them surely inquire in Abel,’ and thus they would bring it to an end.’” The Hebrew contains emphatic infinitive-absolute constructions in both clauses, and the final verb may be rendered more literally as “bring it to an end” or “finish.”
    reason: lexical_alternative
  - marker: b
    text: “Abel” is the shortened form of Abel-beth-maacah, the city under siege in this context.
    reason: cultural_note
translation:
  language: ko
  text: 그 여인이 말했습니다[a], “옛날에는 이렇게 말하곤 했습니다[b]. ‘아벨에 가서 반드시 물어보라.’ 그러면 그들은 일을 끝냈습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 여인은 옛날에는 ‘아벨에 가서 반드시 물어보라’고 했고, 그렇게 해서 그들은 끝냈습니다”로도 옮길 수 있습니다. 히브리어에는 두 절 모두에 강조형 부정사-미완료형이 있고, 마지막 동사는 “끝내다”보다 더 문자적으로는 “마치다/끝장내다”의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “아벨”은 이 문맥의 포위된 성읍 아벨벳마아가를 줄여 부른 말입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: Then she said
  chosen_korean: 그 여인이 말했습니다
  alternatives_korean:
  - 그리고 그 여인이 말했습니다
  - 그 여자가 말했습니다
  lexicon: HALOT
  rationale: 서술 흐름의 다음 동작을 자연스럽게 옮기되, 여성 화자를 분명히 드러냈습니다.
- source_word: דַּבֵּר יְדַבְּרוּ
  english_pob_choice: They used to say
  chosen_korean: 말하곤 했습니다
  alternatives_korean:
  - 반드시 말했습니다
  - 정말로 말했습니다
  lexicon: HALOT
  rationale: 강조형 부정과거-미완료형의 관용적 반복/상례성을 한국어의 '-곤 했습니다'로 간결하게 살렸습니다.
- source_word: בְּאָבֵל
  english_pob_choice: at Abel
  chosen_korean: 아벨에
  alternatives_korean:
  - 아벨에서
  - 아벨 안에서
  lexicon: HALOT
  rationale: 짧게 축약된 지명을 그대로 옮기되, 상담을 구하러 가는 장소라는 맥락을 자연스럽게 표현했습니다.
- source_word: וְכֵן הֵתַמּוּ
  english_pob_choice: and so they ended the matter
  chosen_korean: 그러면 그들은 일을 끝냈습니다
  alternatives_korean:
  - 그러면 그들은 그 일을 끝냈습니다
  - 그렇게 해서 그들은 일을 마무리했습니다
  lexicon: HALOT
  rationale: 히필형 완료의 결과적 의미를 따라, 단순 종결보다 '일을 끝내다'로 옮겨 히브리어의 직접성을 유지했습니다.
theological_decisions:
- issue: 지혜로운 도시 아벨의 기능을 어떻게 표현할지
  chosen_reading: 본문의 관용적 속담으로 처리하여, 특정 교리적 의미를 덧붙이지 않고 실용적 조언의 맥락을 살렸습니다.
  alternative_readings:
  - 아벨을 상담·판결의 권위가 있는 곳으로 해석해 설명적으로 옮김
  - '''문제를 해결했다''로 더 해석적으로 옮김'
  rationale: 이 절은 전쟁 서술 속에 삽입된 옛말을 인용하므로, 교리화보다 속담적 성격과 서술 기능을 보존하는 것이 적절합니다.
  doctrine_reference: 문맥 우선의 서술 번역 원칙
