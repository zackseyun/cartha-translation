base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/007.yaml
  text: Joab’s men[a], the Kerethites, the Pelethites, and all the mighty men went out after him. They went out from Jerusalem to pursue Sheba son of Bichri.
  footnotes:
  - marker: a
    text: Traditional English versions often render הַכְּרֵתִי as 'the Cherethites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요압의 사람들, 그렛 사람들과 블렛 사람들과 모든 용사들도 그를 따라 나갔습니다. 그들은 예루살렘에서 나가 세바, 비그리의 아들을 추격하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그렛 사람들’은 전통적 영어 번역의 ‘Cherethites’에 해당하는 집단명입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי יוֹאָב
  english_pob_choice: Joab’s men
  chosen_korean: 요압의 사람들
  alternatives_korean:
  - 요압의 부하들
  - 요압의 군사들
  lexicon: HALOT
  rationale: 소유·소속 관계를 자연스럽게 풀어 ‘요압의 사람들’로 옮기되, 군사적 맥락은 문맥상 유지됩니다.
- source_word: הַכְּרֵתִי
  english_pob_choice: the Kerethites
  chosen_korean: 그 그렛 사람들
  alternatives_korean:
  - 그 케렛 사람들
  - 그 크레타 사람들
  lexicon: HALOT
  rationale: POB의 음역 방침을 따라 ‘Kerethites’를 직접 반영하되, 한국어 음운에 맞게 그렛으로 옮겼습니다.
- source_word: הַפְּלֵתִי
  english_pob_choice: the Pelethites
  chosen_korean: 블렛 사람들
  alternatives_korean:
  - 펠렛 사람들
  - 플렛 사람들
  lexicon: HALOT
  rationale: 고유 집단명은 추정 번역보다 음역이 적절하여, 병렬 구조를 살려 ‘그렛 사람들’과 대응되게 옮겼습니다.
- source_word: כָל הַגִּבֹּרִים
  english_pob_choice: all the mighty men
  chosen_korean: 모든 용사들
  alternatives_korean:
  - 모든 용맹한 사람들
  - 모든 힘센 자들
  lexicon: HALOT
  rationale: 군사 집단을 가리키는 관용 표현으로서 ‘용사들’이 한국어에서도 가장 자연스럽고, ‘mighty men’의 전투적 뉘앙스를 잘 반영합니다.
- source_word: לִרְדֹּף אַחֲרֵי
  english_pob_choice: to pursue
  chosen_korean: 추격하였습니다
  alternatives_korean:
  - 뒤쫓았습니다
  - 추적하였습니다
  lexicon: HALOT
  rationale: ‘따라가다’보다 पीछ적 목적이 분명한 동사인 ‘추격하다’가 רדף의 강한 पीछ적 의미를 더 직접적으로 드러냅니다.
