revisions:
- from: 그들이 와서 아벨-벳마아가에서 그를 포위하고, 성을 향해 공성 토성을 쌓았으며, 그것이 성곽에 맞섰습니다. 그리고 요압과 함께 있던 모든 사람은 성벽을 무너뜨리려고 그것을 파괴하고 있었습니다.[a][b][c]
  to: 그들이 와서 아벨벳마아가에서 그를[a] 포위하고, 성을 향하여 공성 토성[b]을 쌓아 올렸습니다. 그 토성은 성곽의 방어 시설[c]에 맞닿아 있었고, 요압과 함께 있던 모든 사람은 성벽을 무너뜨리려고 파괴 작업을 하고 있었습니다.
  rationale: 원문의 지시 대상상 긴장, 곧 쉐바를 포위하면서 성에 공성 시설을 설치하는 장면을 유지했습니다. 공성 토성이 חֵל에 놓이거나 맞닿은 장면은 ‘성곽의 방어 시설에 맞닿아 있었다’로 옮겨 과도하게 특정 구조물로 단정하지 않았습니다. 마지막 목적어는 히브리어에서 명시되지 않아 한국어 대명사로 재현하면 오히려 선행사가 왜곡되므로, ‘파괴 작업을 하고 있었습니다’로 진행 중인 파괴 행위와 성벽 붕괴의 목적을 보존했습니다.
  reviewer_model: gpt-5.6-terra
