base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/015.yaml
  text: They came and besieged him in Abel-beth-maacah[a], and they cast up a siege ramp against the city, and it stood against the rampart[c][b]; and all the people who were with Joab were destroying it to bring down the wall.
  footnotes:
  - marker: a
    text: Or 'laid siege against it'; the Hebrew says 'against him,' likely focusing on Sheba as the target even though the city is under siege.
    reason: alternative_reading
  - marker: b
    text: Or 'embankment' or 'mound' for 'siege ramp.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term rendered 'rampart' can refer to an outer defensive work or fortification.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 와서 아벨벳마아가에서 그를[a] 포위하고, 성을 향하여 공성 토성[b]을 쌓아 올렸습니다. 그 토성은 성곽의 방어 시설[c]에 맞닿아 있었고, 요압과 함께 있던 모든 사람은 성벽을 무너뜨리려고 파괴 작업을 하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그를’은 성이 아니라 그 안으로 피신한 쉐바를 주된 목표로 삼은 포위라는 점을 반영합니다. 그러나 실제 공성 작전은 성을 대상으로 이루어집니다.
    reason: source_note
  - marker: b
    text: ‘공성 토성’은 성을 공격하기 위하여 흙을 쌓아 만든 둑 또는 경사 시설을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 חֵל은 성벽 바깥의 방어 시설, 외곽 방어선, 또는 성곽의 일부를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  english_pob_choice: They came
  chosen_korean: 그들이 와서
  alternatives_korean:
  - 그들이 도착하여
  - 그들이 오고
  lexicon: HALOT
  rationale: wayyiqtol 서술동사 בוא는 전투 서사의 진행을 자연스럽게 여는 ‘와서’로 옮기는 것이 가장 직설적입니다.
- source_word: וַיָּצֻרוּ עָלָיו
  english_pob_choice: besieged him
  chosen_korean: 그를 포위하고
  alternatives_korean:
  - 그에게 포위전을 벌이고
  - 그를 에워싸고
  lexicon: HALOT
  rationale: צור + עַל의 군사적 용법을 살려 ‘포위하다’로 옮겼고, 대명사 ‘그를’은 히브리어의 남성 단수 대상을 유지합니다.
- source_word: סֹלְלָה
  english_pob_choice: siege ramp
  chosen_korean: 공성 토성
  alternatives_korean:
  - 공성 경사로
  - 포위 둑
  - 공성 대
  lexicon: HALOT
  rationale: 포위전의 흙을 쌓아 올린 구조라는 점을 살리기 위해 한국어 군사 용어로 비교적 직접적인 ‘공성 토성’을 택했습니다.
- source_word: חֵל
  english_pob_choice: rampart
  chosen_korean: 성곽
  alternatives_korean:
  - 외벽
  - 외곽 방어선
  - 성벽 바깥 방어시설
  lexicon: HALOT
  rationale: חֵל은 외부 방어시설을 가리킬 수 있어, 이 절에서는 성의 방어선 전체를 포괄하는 ‘성곽’으로 옮기되 기술적 의미를 과도하게 좁히지 않았습니다.
- source_word: מַשְׁחִיתִם לְהַפִּיל הַחוֹמָה
  english_pob_choice: were destroying it to bring down the wall
  chosen_korean: 성벽을 무너뜨리려고 그것을 파괴하고 있었습니다
  alternatives_korean:
  - 성벽을 무너뜨리려고 그것을 허물고 있었습니다
  - 성벽을 무너뜨리기 위해 그것을 파괴하고 있었습니다
  lexicon: HALOT
  rationale: 현재분사적 진행을 살려 ‘파괴하고 있었습니다’로 옮겼고, 목적절 ‘성벽을 무너뜨리려고’로 최종 의도를 분명히 했습니다.
theological_decisions:
- issue: 히브리어 서술에서 공격 대상의 지시 대상이 사람인지 성인지가 함께 작동함
  chosen_reading: ‘그를’과 ‘성을’/‘성벽’을 함께 유지하여, 쉐바를 겨냥한 포위와 성에 대한 공성 작전을 둘 다 드러냈습니다.
  alternative_readings:
  - 모두 ‘그것’으로 평준화하기
  - 모두 성만 가리키는 표현으로 바꾸기
  rationale: 영어 POB가 지적하듯 히브리어는 남성 단수 대명사로 쉐바를 가리키면서도 실제로는 성을 포위하는 장면을 말하므로, 한국어에서도 그 긴장을 보존하는 편이 원문에 충실합니다.
  doctrine_reference: Source-text fidelity / narrative referential tension
