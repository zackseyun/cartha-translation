source:
  edition: WLC
  text: וַֽ/יַּעֲבֹ֞ר בְּ/כָל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל אָבֵ֛לָ/ה וּ/בֵ֥ית מַעֲכָ֖ה וְ/כָל הַ/בֵּרִ֑ים ו/יקלהו וַ/יָּבֹ֖אוּ אַף אַחֲרָֽי/ו־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/014.yaml
  text: He passed through all the tribes of Israel to Abel and Beth-maacah[b][a], and all the Berites assembled and also followed after him.
  footnotes:
  - marker: a
    text: Hebrew 'all the Berites.' Some translations read 'all the Bichrites,' connecting the phrase to Sheba son of Bichri from the context; the Masoretic Text here more directly supports 'Berites.'
    reason: alternative_reading
  - marker: b
    text: Or 'and they too came after him.' The Hebrew idiom can be rendered more literally this way, though 'followed after him' better conveys the sense in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이스라엘의 모든 지파를 지나 아벨과 벧마아가로 갔고, 또 모든 베리 사람들도 모여 그 뒤를 따랐습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘모든 베리 사람들’입니다. 문맥상 ‘비크리 사람들’로 읽는 번역도 있으나, 마소라 본문은 더 직접적으로 ‘베리 사람들’을 지지합니다.
    reason: textual_variant
  - marker: b
    text: ‘그 뒤를 따랐습니다’는 히브리어 관용구를 자연스럽게 옮긴 것이며, 더 직역하면 ‘그 뒤로도 왔습니다’가 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  english_pob_choice: He passed through
  chosen_korean: 지나
  alternatives_korean:
  - 통과하여
  - 지나가
  lexicon: HALOT
  rationale: 이동 동작을 자연스럽게 살리되, 군사적 추격 맥락에서 지형을 가로지르는 느낌을 전달하기 위해 ‘지나’로 옮겼습니다.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: through all the tribes of Israel
  chosen_korean: 이스라엘의 모든 지파를
  alternatives_korean:
  - 이스라엘의 모든 지파 사이를
  - 이스라엘의 모든 지파 가운데
  lexicon: HALOT
  rationale: בְּ와 ‘모든 지파’의 결합은 범위를 따라 이동하는 뜻이므로, 한국어에서는 목적어형으로 두고 동사 ‘지나’와 함께 전체 구역을 통과하는 의미를 살렸습니다.
- source_word: וְכָל הַבֵּרִים
  english_pob_choice: and all the Berites
  chosen_korean: 모든 베리 사람들
  alternatives_korean:
  - 모든 베리인
  - 모든 비크리 사람들
  lexicon: HALOT
  rationale: 마소라 본문이 가리키는 형태를 따라 지명/집단명으로 투명하게 옮겼고, 전통적 조화 번역보다 음역 기반 표현을 택했습니다.
theological_decisions:
- issue: 본문의 사람 이름/지명 표기에서 전통 조화와 마소라 본문 투명성의 우선순위
  chosen_reading: ‘베리 사람들’로 직역 성격을 유지해 본문이 가진 불확실성을 드러냈습니다.
  alternative_readings:
  - ‘비크리 사람들’
  - ‘베림 사람들’
  rationale: 주석이 지적하듯 일부 번역은 문맥상 ‘비크리 사람들’로 읽지만, 본문 자체는 다른 형태를 지지하므로 주번역에서는 원문 기반의 불확실성을 보존하는 것이 더 적절합니다.
  doctrine_reference: 본문비평 원칙
