translation:
  language: ko
  text: 이제 요압은 이스라엘의 모든 군대[a]를 맡았고, 여호야다의 아들 브나야는 그렛 사람들과 블렛 사람들을 맡았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘케렛 사람들’로도 옮길 수 있습니다. 이 집단명의 정확한 형태는 음역에서 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  english_pob_choice: Now Joab
  chosen_korean: 이제 요압은
  alternatives_korean:
  - 그리고 요압은
  - 요압은
  lexicon: HALOT
  rationale: 장면 전환을 여는 접속사 וְ는 한국어에서 ‘이제’로 옮기면 행정 요약문의 전환감을 살리면서도 자연스럽습니다.
- source_word: אֶל כָּל הַ/צָּבָא יִשְׂרָאֵל
