  source_fidelity: ‘이제’는 히브리어 접속사 וְ의 담화 기능을 시간 부사로 특정한 것이며, 영어 POB 감사 기록도 이를 명시적으로 제거했습니다. 이를 삭제해야 합니다. 또한 ‘맡았다’도 문맥상 가능하지만, 본문의 군사적 감독·지휘 관계는 ‘지휘하였다’가 더 직접적으로 드러냅니다.
  naturalness: ‘이스라엘의 온 군대’를 단수 집합 명사로 두고 ‘지휘하였습니다’를 사용하면 현대 표준어 합쇼체에서 자연스럽고, 두 병렬 직책도 분명해집니다.
  terminology: 요압, 여호야다, 브나야, 그렛 사람들, 블렛 사람들은 한국어 성경의 널리 알려진 표기와 부합합니다. 집단명 대안은 음역상의 대안으로 각주에 보존합니다.
  issues:
