    issue: 문두의 ‘이제’
    rationale: וְ는 여기서 행정 목록의 연결·전환을 나타내지만 명시적 시간 부사 ‘이제’를 뜻하지 않습니다. 제공된 영어 POB 감사 기록도 같은 이유로 ‘Now’를 삭제했습니다.
  - severity: low
    issue: ‘맡았고/맡았습니다’의 의미 범위
    rationale: 직책을 맡는다는 뜻으로 가능하나, עַל이 나타내는 군사 집단에 대한 감독·지휘 관계를 ‘지휘하였습니다’가 더 명확하게 전달합니다.
  revised_text: 요압은 이스라엘의 온 군대를 지휘하였고, 여호야다의 아들 브나야는 그렛 사람들과 블렛 사람들을 지휘하였습니다.
  revised_footnotes:
