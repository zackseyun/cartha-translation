translation:
  language: ko
  text: 이제 요압은 이스라엘의 모든 군대[a]를 맡았고, 여호야다의 아들 브나야는 그렛 사람들과 블렛 사람들을 맡았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘케렛 사람들’로도 옮길 수 있습니다. 이 집단명의 정확한 형태는 음역에서 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  english_pob_choice: Now Joab
  chosen_korean: 이제 요압은
  alternatives_korean:
  - 그리고 요압은
  - 요압은
  lexicon: HALOT
  rationale: 장면 전환을 여는 접속사 וְ는 한국어에서 ‘이제’로 옮기면 행정 요약문의 전환감을 살리면서도 자연스럽습니다.
- source_word: אֶל כָּל הַ/צָּבָא יִשְׂרָאֵל
  english_pob_choice: was over all the army of Israel
  chosen_korean: 이스라엘의 모든 군대
  alternatives_korean:
  - 이스라엘의 모든 군대 위에
  - 이스라엘의 온 군대
  lexicon: HALOT
  rationale: 여기서 אֶל은 직역상 ‘~에게/로’보다 관직·지휘를 나타내는 관용적 용법이므로, 한국어에서는 ‘맡았고’로 의미를 풀어 주어 통치/지휘 관계를 드러냈습니다.
- source_word: ה/כרי
  english_pob_choice: the Cherethites
  chosen_korean: 그렛 사람들
  alternatives_korean:
  - 케렛 사람들
  - 그렛 사람
  lexicon: HALOT
  rationale: 이 집단명은 정확한 어원보다 고유 집단명 보존이 중요하므로 음역하되, 한국어 성경에서 널리 쓰이는 ‘그렛 사람들’을 채택했습니다.
- source_word: הַ/פְּלֵתִי
  english_pob_choice: the Pelethites
  chosen_korean: 블렛 사람들
  alternatives_korean:
  - 펠렛 사람들
  - 블레티 사람들
  lexicon: HALOT
  rationale: פְּלֵתִי 역시 집단명으로 보존하는 것이 적절하며, 한국어 음역 관행에 맞춰 ‘블렛 사람들’로 옮겼습니다.
theological_decisions:
- issue: 관직 서술의 표현 방식
  chosen_reading: ‘맡았고’로 두 인물의 담당 영역을 행정적·군사적 책임으로 자연스럽게 표현했습니다.
  alternative_readings:
  - ‘~ 위에 있었다’
  - ‘~를 다스렸다’
  rationale: 본문은 인물들의 역할 목록을 제시하는 문맥이므로, 지나치게 통치적 뉘앙스나 어색한 직역보다 담당·지휘의 기능을 드러내는 표현이 원문 의도에 가깝습니다.
  doctrine_reference: 본문 해석상의 행정적 서술
