  rationale: 본문은 인물들의 역할 목록을 제시하는 문맥이므로, 지나치게 통치적 뉘앙스나 어색한 직역보다 담당·지휘의 기능을 드러내는 표현이 원문 의도에 가깝습니다.
  doctrine_reference: 본문 해석상의 행정적 서술
