  source_fidelity: ‘나에게로 소집하고’는 לִי의 수혜/위임의 뜻을 ‘나를 위해’로 옮긴 것이 아니라 집결 장소가 왕에게 있는 듯한 뜻을 더합니다. 또한 해당 동사구는 왕이 아마사에게 유다 사람들을 자신을 위해 소집하라고 명령하는 내용입니다.
  naturalness: 본문 서술은 자연스럽지만, 직접 인용문의 ‘-으라’는 요구된 현대 합쇼체와 맞지 않습니다. ‘그대는 … 있으십시오’는 명시된 2인칭 강조를 보존하면서 합쇼체로 정리한 표현입니다.
