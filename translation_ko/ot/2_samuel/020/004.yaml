  text: Then the king said to Amasa[a], “Call the men of Judah together for me within three days, and you, remain here.”
  footnotes:
  - marker: a
    text: Hebrew 'the men of Judah' uses a masculine collective expression. The phrase likely refers to the fighting men or mobilizable men of Judah, but the wording itself does not explicitly say 'warriors.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 아마사에게 말했습니다. "유다 사람들을 사흘 안에 나에게로 소집하고, 너는 여기 머물러 있으라."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘유다 사람들’은 남성 집합 표현입니다. 문맥상 유다의 전투 가능 인원을 가리킬 수 있으나, 본문 자체가 ‘전사들’이라고 명시하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 … 말했습니다
  alternatives_korean:
  - 그리고 … 말했습니다
  - 그때 … 말했습니다
  lexicon: HALOT
  rationale: 서사의 진행을 자연스럽게 이어 주는 완료형 연결을 한국어의 담화 표지로 살렸습니다.
- source_word: הַזְעֶק
  english_pob_choice: Call ... together
  chosen_korean: 소집하고
  alternatives_korean:
  - 불러 모으고
  - 소집하셔서
  - 모으고
  lexicon: HALOT
  rationale: 히필 명령형의 강한 사역성을 반영하면서, 한국어에서는 군사적·공적 동원 맥락에 맞는 ‘소집하다’가 가장 정확합니다.
- source_word: אֶת אִישׁ יְהוּדָה
  english_pob_choice: the men of Judah
  chosen_korean: 유다 사람들을
  alternatives_korean:
  - 유다의 남자들을
  - 유다의 사람들을
  - 유다의 장정들을
  lexicon: HALOT
  rationale: 히브리어의 남성 집합적 표현을 살리되, 한국어에서는 어색한 직역을 피하고 집합적 대상인 ‘유다 사람들’로 옮겼습니다.
- source_word: שְׁלֹשֶׁת יָמִים
  english_pob_choice: within three days
  chosen_korean: 사흘 안에
  alternatives_korean:
  - 삼 일 안에
  - 사흘 동안
  - 세 날 안에
  lexicon: HALOT
  rationale: 명령의 기한을 나타내므로 ‘사흘 안에’가 가장 자연스럽고, 히브리어의 기간 한정을 잘 드러냅니다.
- source_word: עֲמֹד
  english_pob_choice: remain here
  chosen_korean: 머물러 있으라
  alternatives_korean:
  - 서 있으라
  - 있으라
  - 남아 있으라
  lexicon: HALOT
  rationale: 직역하면 ‘서다’이지만, 이 문맥에서는 지정된 장소에 계속 머무르라는 뜻이므로 동작보다는 상태를 나타내는 표현이 적절합니다.
