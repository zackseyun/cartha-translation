  - severity: medium
    issue: 직접 명령문이 합쇼체가 아님
    rationale: ‘소집하고 … 머물러 있으라’는 하라체입니다. 번역의 지정된 현대 formal-polite(합쇼체) 문체에 맞춰 ‘-십시오’로 통일해야 합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 놓임
    rationale: 각주가 설명하는 ‘유다 사람들’ 바로 뒤에 표지를 배치하면 지시 대상이 명확해집니다.
