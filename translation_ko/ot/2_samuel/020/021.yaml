reference: 2 Samuel 20:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא כֵ֣ן הַ/דָּבָ֗ר כִּ֡י אִישׁ֩ מֵ/הַ֨ר אֶפְרַ֜יִם שֶׁ֧בַע בֶּן בִּכְרִ֣י שְׁמ֗/וֹ נָשָׂ֤א יָד/וֹ֙ בַּ/מֶּ֣לֶךְ בְּ/דָוִ֔ד תְּנֽוּ אֹת֣/וֹ לְ/בַדּ֔/וֹ וְ/אֵלְכָ֖ה מֵ/עַ֣ל הָ/עִ֑יר וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל יוֹאָ֔ב הִנֵּ֥ה רֹאשׁ֛/וֹ מֻשְׁלָ֥ךְ אֵלֶ֖י/ךָ בְּעַ֥ד הַ/חוֹמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/021.yaml
  text: That is not the matter[a]. Rather, a man from the hill country of Ephraim, Sheba son of Bichri by name, has raised his hand against the king, against David. Hand him over alone, and I will withdraw from the city.” And the woman said to Joab, “Look[b], his head will be thrown to you over the wall.”
  footnotes:
  - marker: a
    text: Or, more interpretively, “has rebelled against the king, against David.” The Hebrew idiom is literally “has raised his hand.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “from the hill country of Ephraim”; traditionally also rendered “from Mount Ephraim.”
    reason: lexical_alternative
translation:
  language: ko
  text: “그것은 그 말이 아닙니다. 오히려 에브라임 산지 출신의 한 사람, 기스리의 아들 세바가 왕, 곧 다윗을 거슬러 손을 들었습니다. 그만을 넘겨주십시오. 그러면 내가 성읍을 떠나겠습니다.” 그 여인이 요압에게 말했습니다. “보십시오, 그의 머리가 성벽 너머로 당신에게 던져질 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא כֵן הַדָּבָר
  english_pob_choice: That is not the matter
  chosen_korean: 그것은 그 말이 아닙니다
  alternatives_korean:
  - 그것은 그렇지 않습니다
  - 그 일은 그런 것이 아닙니다
  lexicon: HALOT
  rationale: 문맥상 앞선 추정에 대한 부정이므로, 직역의 딱딱함을 피하면서도 ‘그 말/그 일’의 대상성을 살렸습니다.
- source_word: מֵהַר אֶפְרַיִם
  english_pob_choice: from the hill country of Ephraim
  chosen_korean: 에브라임 산지 출신의
  alternatives_korean:
  - 에브라임 산지에서 온
  - 에브라임의 산지에서 온
  lexicon: HALOT
  rationale: POB의 ‘hill country’ 해석을 따라 지리적 지역성을 살렸고, 한국어에서는 출신의로 자연스럽게 연결했습니다.
- source_word: נָשָׂא יָדוֹ
  english_pob_choice: has raised his hand
  chosen_korean: 손을 들었습니다
  alternatives_korean:
  - 손을 들어 반역했습니다
  - 반역했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자 이미지를 살리되, 한국어에서도 폭력적 대항의 함의를 읽을 수 있게 했습니다. ‘반역했습니다’는 의미를 너무 해석적으로 굳힐 수 있어 본문에는 두지 않았습니다.
- source_word: תְּנוּ אֹתוֹ לְבַדּוֹ
  english_pob_choice: Hand him over alone
  chosen_korean: 그만을 넘겨주십시오
  alternatives_korean:
  - 그만 넘겨주십시오
  - 그 사람만 넘겨주십시오
  lexicon: HALOT
  rationale: 명령형의 요구를 공손한 한국어로 옮기면서, לְבַדּוֹ의 배타성을 ‘그만’으로 분명하게 드러냈습니다.
- source_word: וְאֵלְכָה מֵ/עַ֣ל הָ/עִ֑יר
  english_pob_choice: and I will withdraw from the city
  chosen_korean: 그러면 내가 성읍을 떠나겠습니다
  alternatives_korean:
  - 그러면 내가 성읍에서 물러나겠습니다
  - 그러면 내가 성읍을 떠나 물러나겠습니다
  lexicon: HALOT
  rationale: 포위전 맥락에서 ‘withdraw’의 군사적 뉘앙스를 유지하되, 한국어에서는 자연스럽게 ‘성읍을 떠나겠습니다’로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 봐
  lexicon: HALOT
  rationale: 여인이 요압에게 말을 건네는 장면이므로, 현대 공손체의 직접 호명으로서 ‘보십시오’가 가장 적절합니다.
- source_word: רֹאשׁוֹ מֻשְׁלָךְ אֵלֶי/ךָ בְּעַד הַ/חוֹמָה
  english_pob_choice: his head will be thrown to you over the wall
  chosen_korean: 그의 머리가 성벽 너머로 당신에게 던져질 것입니다
  alternatives_korean:
  - 그의 머리가 성벽 위로 당신에게 던져질 것입니다
  - 그의 머리가 성벽 건너로 당신에게 던져질 것입니다
  lexicon: HALOT
  rationale: POB의 미래형 해석을 따라 확정적 약속으로 번역했고, ‘over the wall’은 ‘성벽 너머로’가 가장 자연스럽습니다.
