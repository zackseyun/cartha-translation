- from: “그것은 그 말이 아닙니다. 오히려 에브라임 산지 출신의 한 사람, 기스리의 아들 세바가 왕, 곧 다윗을 거슬러 손을 들었습니다. 그만을 넘겨주십시오. 그러면 내가 성읍을 떠나겠습니다.” 그 여인이 요압에게 말했습니다. “보십시오, 그의 머리가 성벽 너머로 당신에게 던져질 것입니다.”
