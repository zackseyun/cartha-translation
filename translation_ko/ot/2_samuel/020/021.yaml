  naturalness: ‘그것은 그 말이 아닙니다’는 현대 한국어에서 부자연스럽고 원문의 부정·정정 기능도 흐립니다. ‘그 일은 그렇지 않습니다’가 자연스럽습니다. ‘왕, 곧 다윗을 거슬러’도 가능하지만, ‘왕을, 곧 다윗을 대적하여’가 반복된 전치사의 강조와 적대적 문맥을 더 분명하게 전달합니다.
