base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/021.yaml
  text: That is not the matter[a]. Rather, a man from the hill country of Ephraim, Sheba son of Bichri by name, has raised his hand against the king, against David. Hand him over alone, and I will withdraw from the city.” And the woman said to Joab, “Look[b], his head will be thrown to you over the wall.”
  footnotes:
  - marker: a
    text: Or, more interpretively, “has rebelled against the king, against David.” The Hebrew idiom is literally “has raised his hand.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “from the hill country of Ephraim”; traditionally also rendered “from Mount Ephraim.”
    reason: lexical_alternative
translation:
  language: ko
  text: “그 일은 그렇지 않습니다. 오히려 에브라임 산지에서 온 한 사람, 비그리의 아들 세바라는 자가 왕을, 곧 다윗을 대적하여 손을 들었습니다[a]. 그 사람만 넘겨주십시오. 그러면 내가 성읍에서 물러가겠습니다.” 그 여인이 요압에게 말했습니다. “보십시오, 그의 머리가 성벽 너머로 당신에게 던져질 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 문자적 표현은 “손을 들었다”이며, 여기서는 왕에 맞서 반역하거나 적대했다는 뜻입니다.
    reason: lexical_alternative
