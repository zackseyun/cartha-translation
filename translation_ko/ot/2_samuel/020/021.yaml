  lexicon: HALOT
  rationale: 히브리어 관용구의 문자 이미지를 살리되, 한국어에서도 폭력적 대항의 함의를 읽을 수 있게 했습니다. ‘반역했습니다’는 의미를 너무 해석적으로 굳힐 수 있어 본문에는 두지 않았습니다.
- source_word: תְּנוּ אֹתוֹ לְבַדּוֹ
  english_pob_choice: Hand him over alone
  chosen_korean: 그만을 넘겨주십시오
