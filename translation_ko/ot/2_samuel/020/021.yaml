  rationale: 고유명사 ‘비그리’를 원문에 맞게 바로잡고, 첫 문장을 자연스러운 한국어의 부정·정정 표현으로 수정했습니다. 포위전 문맥에 맞게 요압이 성읍에서 물러나는 것으로 옮겼습니다. ‘손을 들다’는 원문의 이미지를 보존하되 한국어에서 생길 수 있는 ‘항복하다’의 오독을 막기 위해 정확한 위치에 설명 각주를 두었습니다. 영어 POB의 지리 관련 각주는 원문상 유효하지만, 한국어 본문 ‘에브라임 산지’는 충분히 명료하여 별도 각주가 필수는 아닙니다.
