  lexicon: HALOT
  rationale: 명령형의 요구를 공손한 한국어로 옮기면서, לְבַדּוֹ의 배타성을 ‘그만’으로 분명하게 드러냈습니다.
- source_word: וְאֵלְכָה מֵ/עַ֣ל הָ/עִ֑יר
