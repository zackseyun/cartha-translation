revisions:
- from: 그들이 기브온에 있는 큰 돌 곁에 있을 때에 아마사가 그들 앞에 이르렀습니다. 그런데 요압은 자기 군복을 입고, 그 위에 칼을 자기 허리에 칼집째 매는 띠를 띠고 있었으며, 그가 나가자 그것이 떨어졌습니다.[a][b]
  to: 그들이 기브온에 있는 큰 돌 곁에 있을 때, 아마사가 그들 앞에 이르렀습니다.[a] 그런데 요압은 자기 군복을 입고 있었고, 그 위로 칼집에 든 칼을 자기 허리에 매단 띠를 두르고 있었습니다. 그가 나갈 때 그것이 떨어졌습니다.[b]
  rationale: 수정은 원문의 공간 표현, 아마사의 접근, 요압의 의복과 칼띠, 그리고 칼이 떨어지는 서술을 유지합니다. 칼띠의 수식 관계를 자연스러운 한국어로 바로잡고, 주석 a를 실제 대안 독법으로 보완했으며 각 주석 표지를 해당 절에 배치했습니다.
