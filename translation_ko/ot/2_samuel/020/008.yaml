    issue: 칼띠 구문의 수식 관계와 표현이 부자연스럽습니다.
    rationale: ‘칼을 자기 허리에 칼집째 매는 띠를 띠고’는 ‘매는’의 행위 주체와 ‘띠를 띠고’의 반복이 어색합니다. 칼이 칼집에 든 채 허리에 고정된 상태를 묘사하도록 고치는 것이 חֶרֶב מְצֻמֶּדֶת … בְּתַעְרָהּ에 더 충실합니다.
