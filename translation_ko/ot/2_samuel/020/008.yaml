base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/008.yaml
  text: When they were by the great stone that is in Gibeon[a], Amasa came before them. Now Joab was dressed in his military garment, and over it was a belt with a sword fastened to his waist in its sheath; and as he went out[c][b], it fell.
  footnotes:
  - marker: a
    text: Or, 'Amasa came to meet them.' The Hebrew literally says 'came before them.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'his robe' or 'the garment he wore'; the Hebrew likely refers to Joab's military attire.
    reason: lexical_alternative
  - marker: c
    text: The subject of 'it fell' is most likely the sword, implied by the feminine verb in Hebrew.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 기브온에 있는 큰 돌 곁에 있을 때에 아마사가 그들 앞에 이르렀습니다. 그런데 요압은 자기 군복을 입고, 그 위에 칼을 자기 허리에 칼집째 매는 띠를 띠고 있었으며, 그가 나가자 그것이 떨어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그들 앞에 이르렀습니다’입니다.
    reason: alternative_reading
  - marker: b
    text: 문맥상 ‘칼’을 가리키는 여성형 동사입니다.
    reason: source_note
lexical_decisions:
- source_word: הָאֶבֶן הַגְּדוֹלָה אֲשֶׁר בְּגִבְעוֹן
  english_pob_choice: the great stone that is in Gibeon
  chosen_korean: 기브온에 있는 큰 돌
  alternatives_korean:
  - 기브온에 있는 큰 바위
  - 기브온에 있는 큰 돌덩이
  lexicon: WLC; HALOT
  rationale: 위치를 나타내는 עִם/בְּ의 장소적 용법을 자연스럽게 살려 ‘곁에’로 옮기고, 특정 지시 대상인 큰 돌을 그대로 유지했습니다.
- source_word: לִפְנֵיהֶם
  english_pob_choice: before them
  chosen_korean: 그들 앞에
  alternatives_korean:
  - 그들 앞에
  - 그들 면전에
  lexicon: HALOT
  rationale: 히브리어의 ‘앞에/면전에’라는 직역을 살리되, 현대 한국어에서 자연스러운 공간 관계 표현으로 옮겼습니다.
- source_word: מִדּוֹ
  english_pob_choice: his military garment
  chosen_korean: 자기 군복
  alternatives_korean:
  - 자기 옷
  - 자기 복장
  - 자기 군복
  lexicon: HALOT
  rationale: 문맥상 요압의 무장한 상태와 칼띠가 함께 묘사되므로, 일반적인 ‘옷’보다 군사적 착용을 드러내는 ‘군복’이 source-direct합니다.
- source_word: חֲגוֹר חֶרֶב מְצֻמֶּדֶת עַל מָתְנָיו בְּתַעְרָהּ
  english_pob_choice: a belt with a sword fastened to his waist in its sheath
  chosen_korean: 칼을 자기 허리에 칼집째 매는 띠
  alternatives_korean:
  - 칼을 허리에 찬 띠
  - 칼집에 든 칼을 허리에 맨 띠
  lexicon: HALOT
  rationale: ‘띠’와 ‘칼집째’로 허리에 매인 칼띠의 층위를 살리고, ‘fastened’의 결속감을 유지했습니다.
- source_word: וַתִּפֹּל
  english_pob_choice: it fell
  chosen_korean: 그것이 떨어졌습니다
  alternatives_korean:
  - 칼이 떨어졌습니다
  - 그것이 떨어졌습니다
  lexicon: HALOT
  rationale: 히브리어 여성형 동사의 주어가 칼을 가리키는 점은 유지하되, 한국어 본문에서는 대명사로 처리해 문맥의 긴장을 살렸습니다.
theological_decisions:
- issue: 요압의 착용물 묘사에서 מַד의 뉘앙스
  chosen_reading: ‘군복’으로 옮겨 군사적/공적 착용을 드러냈습니다.
  alternative_readings:
  - ‘옷’으로 중립적으로 옮김
  - ‘예복’처럼 일반 의복으로 옮김
  rationale: English POB가 revised 형태에서 단순한 ‘garment’로 평평하게 만들기보다, 이 장면의 무장 문맥과 מַד의 군사적 용례를 반영하는 쪽을 택했습니다.
  doctrine_reference: 본문의 역사서술상 세부 묘사 보존
- issue: ‘그것이 떨어졌습니다’의 지시 대상
  chosen_reading: 칼이 암시된 주어를 그대로 드러내지 않고 대명사로 유지했습니다.
  alternative_readings:
  - ‘칼이 떨어졌습니다’로 명시
  - ‘그것이 떨어졌습니다’로 유지
  rationale: 히브리어의 여성형 동사는 칼을 가리키지만, 본문이 의도적으로 간접적으로 말하는 긴장을 보존하기 위해 한국어에서도 암시를 남겼습니다.
  doctrine_reference: 서사적 모호성 보존
