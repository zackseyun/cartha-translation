source:
  edition: WLC
  text: וַ/יַּ֜עַל כָּל אִ֤ישׁ יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י דָוִ֔ד אַחֲרֵ֖י שֶׁ֣בַע בֶּן בִּכְרִ֑י וְ/אִ֤ישׁ יְהוּדָה֙ דָּבְק֣וּ בְ/מַלְכָּ֔/ם מִן הַ/יַּרְדֵּ֖ן וְ/עַד יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/002.yaml
  text: So every man of Israel went up from following David to follow Sheba son of Bichri[a], but the men of Judah held fast to their king[b], from the Jordan to Jerusalem.
  footnotes:
  - marker: a
    text: Or 'all the men of Israel.' The Hebrew is literally 'every man of Israel,' a collective masculine expression.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'went up ... after Sheba.' The wording reflects a transfer of allegiance from David to Sheba.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 이스라엘의 모든 사람이 다윗을 떠나 세바, 비그리의 아들을 따르려고 올라갔으나, 유다 사람들은 그들의 왕에게 끝까지 매달렸습니다. 요단강에서 예루살렘에 이르기까지 그러했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 모든 사람’입니다. 이는 집합적 남성 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘세바 뒤로’입니다. 여기서는 다윗에 대한 충성에서 세바에게로 옮겨 가는 뜻을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  english_pob_choice: every man of Israel
  chosen_korean: 이스라엘의 모든 사람
  alternatives_korean:
  - 이스라엘의 모든 남자
  - 이스라엘의 각 사람
  lexicon: HALOT
  rationale: 히브리어의 분배적 표현을 살리되, 한국어에서는 자연스러운 집합 표현으로 옮겼습니다. 성별 표시는 원문의 남성 단수 집합성을 반영해도 되지만, 문맥상 집단의 총체적 이탈이 핵심이어서 ‘모든 사람’이 가장 자연스럽습니다.
- source_word: מֵאַחֲרֵי דָוִד ... אַחֲרֵי שֶׁבַע בֶּן בִּכְרִי
  english_pob_choice: from following David ... to follow Sheba son of Bichri
  chosen_korean: 다윗을 떠나 ... 세바, 비그리의 아들을 따르려고
  alternatives_korean:
  - 다윗을 뒤로 하고 ... 세바, 비그리의 아들을 따라
  - 다윗의 뒤를 떠나 ... 세바, 비그리의 아들을 따르기 위해
  lexicon: HALOT
  rationale: אַחֲרֵי의 반복이 단순 이동이 아니라 충성의 이동을 가리키므로, 한국어에서는 ‘떠나/따르려고’로 풀어 의미를 드러냈습니다. ‘뒤에’ 같은 직역은 한국어에서 어색하고, ‘따르다’만 쓰면 이전 대상에서 떠나는 변화가 약해집니다.
- source_word: דָּבְקוּ בְמַלְכָּם
  english_pob_choice: held fast to their king
  chosen_korean: 그들의 왕에게 끝까지 매달렸습니다
  alternatives_korean:
  - 그들의 왕에게 굳게 붙었습니다
  - 그들의 왕에게 충성했습니다
  lexicon: HALOT
  rationale: דבק의 기본 이미지는 ‘달라붙다/붙다’이므로, 충성의 뜻을 너무 추상화하지 않고 관계의 밀착을 살렸습니다. ‘끝까지’는 문맥상 이탈한 이스라엘과 대비되는 유다의 지속적 충성을 보완합니다.
- source_word: מִן הַיַּרְדֵּן וְעַד יְרוּשָׁלִָם
  english_pob_choice: from the Jordan to Jerusalem
  chosen_korean: 요단강에서 예루살렘에 이르기까지
  alternatives_korean:
  - 요단강에서 예루살렘까지
  - 요단강에서부터 예루살렘에 이르기까지
  lexicon: HALOT
  rationale: 지리적 범위를 자연스러운 한국어 관용으로 옮겼습니다. ‘이르기까지’는 히브리어의 경계 표지를 살리면서도 문체를 격식 있게 유지합니다.
theological_decisions:
- issue: 이스라엘의 이탈과 유다의 충성 대조
  chosen_reading: ‘떠나 … 따르려고’와 ‘끝까지 매달렸습니다’로, 왕권에 대한 충성의 이동과 지속을 분명히 드러냈습니다.
  alternative_readings:
  - 단순한 이동 묘사로 완화할 수 있음
  - ‘충성했습니다’처럼 추상화할 수 있음
  rationale: 본문은 단순한 지리 이동이 아니라 다윗과 세바 사이의 정치적·언약적 충성 전환을 서술합니다. 따라서 의미를 약화시키지 않고 대비 구조를 분명히 해야 합니다.
  doctrine_reference: 2 Samuel 20:2의 서사적 왕권 충성/반역 대조
