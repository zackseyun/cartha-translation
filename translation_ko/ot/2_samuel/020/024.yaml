    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הַמַּס
  english_pob_choice: was over the forced labor
  chosen_korean: 강제 노역을 맡았고
  alternatives_korean:
  - 강제 노역을 담당했고
  - 강제 노역 위에 있었고
  - 노역 징발을 맡았고
  lexicon: HALOT
  rationale: מַס은 단순 세금보다 왕실의 강제 노동 부역을 가리키므로, 현대 독자가 바로 이해할 수 있게 ‘강제 노역’으로 옮기고 관직적 감독 관계는 ‘맡았고’로 자연스럽게 풀었습니다.
- source_word: אֲדֹרָם
  english_pob_choice: Adoram
  chosen_korean: 아도람
  alternatives_korean:
  - 아드람
  - 아도라암
  lexicon: 고유명사 음역
  rationale: 인명은 음역하되 한국어 표기 관례에 맞춰 ‘아도람’으로 옮겼습니다.
- source_word: הַמַּזְכִּיר
  english_pob_choice: the recorder
  chosen_korean: 기록관
  alternatives_korean:
  - 기록 담당관
  - 서기관
  - 기록자
  lexicon: HALOT
  rationale: 궁정 행정직 칭호로서 단순히 글을 쓰는 사람이 아니라 국가 문서를 관리하는 직책이므로, 전통적이지만 직책성을 살리는 ‘기록관’을 선택했습니다.
theological_decisions:
- issue: 궁정 관직 용어의 번역 톤
  chosen_reading: 궁정 행정 직함을 현대 독자가 이해할 수 있는 직책명으로 옮기되, 직함의 기능적 구분은 보존했습니다.
  alternative_readings:
  - 직역하여 ‘감독 아래 있었고’처럼 어색하게 옮김
  - 전통 교회식 용어로 모두 ‘서기관’으로 통일
  rationale: 본문은 왕실 행정 명단이므로 신학적 해석보다 행정 기능의 정확성이 중요합니다. 두 관직을 구분해 번역해야 본문의 역사적 정보가 살아납니다.
  doctrine_reference: 본문 해석의 역사-문법적 충실성
- issue: ‘מַס’의 사회적 의미
  chosen_reading: ‘강제 노역’으로 번역해 공납이 아니라 국가 동원 노동을 뜻함을 드러냈습니다.
  alternative_readings:
  - 세금
  - 조세
  - 공물
  rationale: 히브리어 מַס는 이 문맥에서 금전 세금보다 강제 부역을 뜻하므로, 번역에서 그 억압적 성격을 숨기지 않는 것이 원문의 의미를 더 정확히 반영합니다.
  doctrine_reference: 출애굽-왕정 문맥의 사회사적 의미
