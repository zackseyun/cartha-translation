  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א דָוִ֗ד לְ/אַחַד֙ מֵֽ/הַ/נְּעָרִ֔ים וַ/יֹּ֖אמֶר גַּ֣שׁ פְּגַע בּ֑/וֹ וַ/יַּכֵּ֖/הוּ וַ/יָּמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/015.yaml
  text: Then David called one of the young men and said[a], “Come near; strike him down.” So he struck him, and he died.
  footnotes:
  - marker: a
    text: Or “attack him” / “fall upon him” for “strike him down” (פְּגַע בּוֹ). The Hebrew verb can denote violent assault more generally; here the context makes the lethal outcome clear.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다윗이 젊은이들 가운데 하나를 불러 말했습니다. 「가까이 와서 그를 쳐라」. 그러자 그가 그를 쳐서 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: פְּגַע בּוֹ는 ‘그를 쳐라’ 외에도 ‘그를 공격하라’ 또는 ‘그에게 덮치라’로 옮길 수 있습니다. 문맥상 결과는 치명적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
  - 불렀습니다
  - 소집했습니다
  lexicon: HALOT
  rationale: 이 서술문에서는 단순히 사람을 부르는 동작이므로, 문맥에 맞는 자연스러운 동사인 ‘부르다’로 옮기는 것이 가장 직접적입니다.
- source_word: לְאַחַד מֵהַנְּעָרִים
  english_pob_choice: one of the young men
  chosen_korean: 젊은이들 가운데 하나
  alternatives_korean:
  - 젊은이 하나
  - 종들 가운데 하나
  - 시종들 가운데 하나
  lexicon: HALOT
  rationale: נְעָרִים은 여기서 연령·신분을 함께 가리키는 말이므로, 본문이 가진 일반성을 살려 ‘젊은이들 가운데 하나’로 옮겼습니다.
- source_word: פְּגַע בּוֹ
  english_pob_choice: strike him down
  chosen_korean: 그를 쳐라
  alternatives_korean:
  - 그를 공격하라
  - 그에게 달려들어라
  - 그를 죽여라
  lexicon: HALOT
  rationale: פּגע בְּ는 문자적으로 ‘치다/덮치다/공격하다’의 폭이 있어, 영어 POB처럼 직접적이되 ‘죽여라’처럼 결과를 미리 확정하지 않는 표현으로 보존했습니다.
- source_word: וַיַּכֵּהוּ
  english_pob_choice: he struck him
  chosen_korean: 그가 그를 쳐서
  alternatives_korean:
  - 그가 그를 때려
  - 그가 그를 쳤고
  - 그가 그를 공격했고
  lexicon: HALOT
  rationale: נכה는 기본적으로 ‘치다/때리다/치다(타격하다)’의 뜻이므로, 뒤의 ‘죽였습니다’와 분리해 서술 순서를 살렸습니다.
theological_decisions:
- issue: 살상 명령의 직접성
  chosen_reading: ‘그를 쳐라’로 옮겨, 본문이 허용하는 폭력의 직접성은 유지하되 해석적으로 ‘죽여라’로 선행 결론을 넣지 않았습니다.
  alternative_readings:
  - 그를 죽여라
  - 그를 공격하라
  rationale: 히브리어 פּגע와 נכה의 결합은 치명적 결과를 낳지만, 동사 자체는 별도의 해석 여지를 남기므로 서술의 단계성을 보존했습니다.
  doctrine_reference: 본문 해석의 문법적-어휘적 절제
