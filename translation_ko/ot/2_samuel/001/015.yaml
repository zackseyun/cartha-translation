  lexicon: HALOT
  rationale: נְעָרִים은 여기서 연령·신분을 함께 가리키는 말이므로, 본문이 가진 일반성을 살려 ‘젊은이들 가운데 하나’로 옮겼습니다.
- source_word: פְּגַע בּוֹ
  english_pob_choice: strike him down
  chosen_korean: 그를 쳐라
  alternatives_korean:
  - 그를 공격하라
  - 그에게 달려들어라
  - 그를 죽여라
  lexicon: HALOT
  rationale: פּגע בְּ는 문자적으로 ‘치다/덮치다/공격하다’의 폭이 있어, 영어 POB처럼 직접적이되 ‘죽여라’처럼 결과를 미리 확정하지 않는 표현으로 보존했습니다.
- source_word: וַיַּכֵּהוּ
  english_pob_choice: he struck him
  chosen_korean: 그가 그를 쳐서
  alternatives_korean:
  - 그가 그를 때려
  - 그가 그를 쳤고
  - 그가 그를 공격했고
  lexicon: HALOT
  rationale: נכה는 기본적으로 ‘치다/때리다/치다(타격하다)’의 뜻이므로, 뒤의 ‘죽였습니다’와 분리해 서술 순서를 살렸습니다.
theological_decisions:
- issue: 살상 명령의 직접성
  chosen_reading: ‘그를 쳐라’로 옮겨, 본문이 허용하는 폭력의 직접성은 유지하되 해석적으로 ‘죽여라’로 선행 결론을 넣지 않았습니다.
  alternative_readings:
  - 그를 죽여라
