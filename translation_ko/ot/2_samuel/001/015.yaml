    text: פְּגַע בּוֹ는 ‘그를 쳐라’ 외에도 ‘그를 공격하라’ 또는 ‘그를 덮쳐라’로 옮길 수 있습니다. 문맥상 그 결과가 치명적이었음이 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
