  - marker: a
    text: Or “attack him” / “fall upon him” for “strike him down” (פְּגַע בּוֹ). The Hebrew verb can denote violent assault more generally; here the context makes the lethal outcome clear.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다윗이 젊은이 하나를 불러 말했습니다. “가까이 와서 그를 쳐라.”[a] 그러자 그 젊은이가 그를 쳤고, 그 사람은 죽었습니다.
  philosophy: optimal-equivalence
