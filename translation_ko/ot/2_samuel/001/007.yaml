base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/007.yaml
  text: He turned around and saw me[a], and he called to me, and I said, “Here I am.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'He turned behind him.' The expression means he turned and looked to his rear.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 뒤를 돌아 나를 보았고[a], 나를 불렀습니다. 나는 “제가 여기 있습니다.”라고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘그가 자기 뒤쪽으로 돌았다’입니다. 곧 뒤를 돌아보았다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אַחֲרָיו
  english_pob_choice: He turned around
  chosen_korean: 뒤로 돌이켜
  alternatives_korean:
  - 돌아서
  - 뒤를 돌아
  lexicon: HALOT
  rationale: אַחֲרָיו의 문자적 방향 감각을 살리면서도 한국어에서는 ‘뒤로 돌이켜’가 ‘turned behind him’의 의미를 자연스럽게 전달합니다.
- source_word: וַיִּרְאֵנִי
  english_pob_choice: and saw me
  chosen_korean: 나를 보았고
  alternatives_korean:
  - 나를 보았으며
  - 나를 바라보았고
  lexicon: HALOT
  rationale: ראה의 기본 의미를 직접 살려 ‘보다’로 옮겼고, 서사 연결은 ‘-았고’로 처리했습니다.
- source_word: וַיִּקְרָא אֵלַי
  english_pob_choice: and he called to me
  chosen_korean: 나를 불렀습니다
  alternatives_korean:
  - 나에게 불렀습니다
  - 나를 불러 말했습니다
  lexicon: HALOT
  rationale: קרא + אֶל은 단순한 호출을 뜻하므로 ‘불렀습니다’가 가장 직접적입니다.
- source_word: הִנֵּנִי
  english_pob_choice: Here I am
  chosen_korean: 제가 여기 있습니다
  alternatives_korean:
  - 제가 여기 있습니다
  - 예, 제가 여기 있습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 자기 제시 응답을 살리되, 한국어에서는 공손한 화법으로 ‘제가 여기 있습니다’가 자연스럽습니다.
theological_decisions:
- issue: 본문의 응답 표현
  chosen_reading: ‘제가 여기 있습니다’로 응답해 즉각적인 자기 제시를 드러냈습니다.
  alternative_readings:
  - ‘예’
  - ‘저 여기 있습니다’
  rationale: הִנֵּנִי는 단순한 위치 보고가 아니라 부름에 대한 즉각적 응답이므로, 서사적·관용적 힘을 유지하는 번역이 적절합니다.
  doctrine_reference: 서사 본문 해석 원칙
