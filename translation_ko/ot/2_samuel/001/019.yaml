  lexicon: HALOT, BDB
  rationale: צְבִי는 ‘아름다움/찬란함/영광’의 뜻이 가능하며, 여기서는 이스라엘을 향한 애가에서 민족의 영화와 품위를 가리키는 표현으로 읽는 것이 문맥에 가장 잘 맞습니다.
- source_word: יִשְׂרָאֵל
