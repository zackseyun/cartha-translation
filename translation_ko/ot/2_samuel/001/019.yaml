id: 2SA.1.19
reference: 2 Samuel 1:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/צְּבִי֙ יִשְׂרָאֵ֔ל עַל בָּמוֹתֶ֖י/ךָ חָלָ֑ל אֵ֖יךְ נָפְל֥וּ גִבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/019.yaml
  text: Your glory[a], O Israel[b], lies slain on your heights! How the mighty have fallen!
  footnotes:
  - marker: a
    text: Hebrew צְבִי may also be rendered 'beauty' or 'splendor'; some take it more concretely as 'gazelle.'
    reason: lexical_alternative
  - marker: b
    text: Or 'your high places.' Here 'heights' is chosen to preserve the topographical sense without implying cultic high places.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 영광이여, 이스라엘아, 당신의 산당들 위에서 죽어 누웠습니다! 용사들이 어찌 그리 쓰러졌습니까![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צְבִי는 ‘아름다움’이나 ‘찬란함’으로도 옮길 수 있으며, 일부는 더 구체적으로 ‘사슴’으로 이해하기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 높은 곳들’. 여기서는 제의적 ‘산당’ 뉘앙스를 피하면서 지형적 의미를 살리기 위해 ‘산당들 위’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּבִי
  english_pob_choice: Your glory
  chosen_korean: 당신의 영광
  alternatives_korean:
  - 당신의 아름다움
  - 당신의 아름다운 것
  - 당신의 사슴
  lexicon: HALOT, BDB
  rationale: צְבִי는 ‘아름다움/찬란함/영광’의 뜻이 가능하며, 여기서는 이스라엘을 향한 애가에서 민족의 영화와 품위를 가리키는 표현으로 읽는 것이 문맥에 가장 잘 맞습니다.
- source_word: יִשְׂרָאֵל
  english_pob_choice: O Israel
  chosen_korean: 이스라엘아
  alternatives_korean:
  - 오 이스라엘
  - 이스라엘
  lexicon: 고유명사 관례
  rationale: 히브리어 호격을 한국어 호격 조사 ‘-아’로 자연스럽게 드러냈습니다.
- source_word: בָּמוֹתֶיךָ
  english_pob_choice: your heights
  chosen_korean: 당신의 산당들 위
  alternatives_korean:
  - 당신의 높은 곳 위
  - 당신의 높은 산 위
  - 당신의 높은 곳 위
  lexicon: HALOT, BDB
  rationale: בָּמוֹת는 ‘높은 곳들/산당들’이 가능하지만, 본문은 지형적 높이를 가리키는 애가의 표현으로 읽는 것이 적절하므로, 우상숭배적 뉘앙스를 고정하는 ‘산당들’만은 피했습니다.
- source_word: חָלָל
  english_pob_choice: lies slain
  chosen_korean: 죽어 누웠습니다
  alternatives_korean:
  - 쓰러져 있습니다
  - 살해되어 누웠습니다
  - 죽임을 당해 누워 있습니다
  lexicon: HALOT, BDB
  rationale: חָלָל은 ‘죽은 자/죽임을 당한 자’의 상태를 가리키므로, 시적 문맥에서 ‘죽어 누웠습니다’가 자연스럽고 상태를 잘 드러냅니다.
- source_word: גִבּוֹרִים
  english_pob_choice: the mighty
  chosen_korean: 용사들
  alternatives_korean:
  - 강한 자들
  - 유력한 자들
  - 영웅들
  lexicon: HALOT, BDB
  rationale: גִבּוֹרִים는 전사적 맥락에서 ‘용사들’이 가장 직접적이며, 애가의 반복 후렴에도 잘 맞습니다.
theological_decisions:
- issue: 애가의 호격과 탄식 어조
  chosen_reading: 이스라엘을 직접 부르는 호격과 이어지는 탄식 ‘어찌 그리’의 절박한 애가 어조를 살렸습니다.
  alternative_readings:
  - 보다 평이한 서술형으로 옮기는 방식
  - ‘오 이스라엘’처럼 한자어 호격을 유지하는 방식
  rationale: 본문은 단순 진술이 아니라 공동체를 향한 직접 호명과 탄식이 핵심이므로, 한국어에서도 호격과 감탄 구조를 분명히 드러내야 합니다.
  doctrine_reference: 시가서/애가의 수사적 기능
- issue: ‘산당들’의 종교적 연상 최소화
  chosen_reading: 지형적 의미를 살리되, 불필요한 제의적 의미를 고정하지 않도록 ‘당신의 산당들 위’로 번역했습니다.
  alternative_readings:
  - ‘높은 곳들 위’
  - ‘높은 산들 위’
  rationale: 히브리어 בָּמוֹת는 다른 본문에서 제의적 ‘산당’일 수 있으나, 여기서는 전쟁 애가의 공간적 이미지가 우선이므로 문맥에 따라 조절했습니다.
  doctrine_reference: 문맥 우선 원칙
