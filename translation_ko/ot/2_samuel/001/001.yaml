    issue: ‘쳐부수고’의 의미 강도
    rationale: ‘쳐부수다’는 완전한 패배·파괴를 함축할 수 있으나, 히브리어 נכה는 여기서 그러한 결과를 명시하지 않습니다. ‘치고’가 군사적 행위를 보존하면서도 불필요한 결과를 덧붙이지 않습니다.
  - severity: low
