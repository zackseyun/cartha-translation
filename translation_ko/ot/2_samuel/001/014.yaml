  to: 그러자 다윗이 그에게 말했습니다. “어찌하여 야훼의 기름부음 받은 이를 멸하려고 네 손을 내밀기를 두려워하지 않았느냐?”[a][b]
  rationale: 수정은 ‘두려워하지 않고 … 멸하려 했느냐’라는 다소 분리된 두 행위의 배열을, 히브리어의 목적 부정사 구조에 맞는 ‘… 멸하려고 네 손을 내밀기를 두려워하지 않았느냐’로 바로잡았습니다. 어휘 선택, 신명 표기, 각주 표지와 내용은 유지했습니다.
