source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו דָּוִ֑ד אֵ֚יךְ לֹ֣א יָרֵ֔אתָ לִ/שְׁלֹ֨חַ֙ יָֽדְ/ךָ֔ לְ/שַׁחֵ֖ת אֶת מְשִׁ֥יחַ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/014.yaml
  text: Then David said to him[b][a], “How were you not afraid to put out your hand to destroy Yahweh’s anointed?”
  footnotes:
  - marker: a
    text: Or, “Why were you not afraid…?” The Hebrew אֵיךְ literally means “How?” and expresses shocked reproach.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “the LORD’s anointed.” That is, the king consecrated by the LORD.'
    reason: cultural_note
translation:
  language: ko
  text: 그러자 다윗이 그에게 말했습니다. “어찌 두려워하지 않고 네 손을 뻗어 야훼의 기름부음 받은 이를 멸하려 했느냐?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֵיךְ는 문자적으로는 “어떻게?”이지만, 여기서는 놀라움이 섞인 책망의 말투로 “어찌 … 하느냐?”에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 מְשִׁיחַ יְהוָה는 “야훼의 기름부음 받은 이” 곧 야훼가 세운 왕을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: WLC narrative waw-consecutive
  rationale: 서술의 진행을 자연스럽게 이어 주는 연결어가 필요하므로, 사건 전개의 순서를 살리는 ‘그러자’를 택했습니다.
- source_word: אֵיךְ
  english_pob_choice: How
  chosen_korean: 어찌
  alternatives_korean:
  - 어떻게
  - 왜
  lexicon: HALOT
  rationale: 이 표현은 단순 정보 질문이 아니라 충격과 책망이 섞인 수사적 질책이므로, 한국어에서도 ‘어찌’가 그 어조를 가장 잘 살립니다.
- source_word: לִשְׁלֹחַ יָדְךָ
  english_pob_choice: to put out your hand
  chosen_korean: 네 손을 뻗어
  alternatives_korean:
  - 네 손을 내밀어
  - 네 손을 들어
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어에서 자연스럽게 읽히도록 ‘손을 뻗다’로 옮겼습니다. 단순한 신체 동작이 아니라 해치려는 행위를 가리키는 관용입니다.
- source_word: לְשַׁחֵת
  english_pob_choice: to destroy
  chosen_korean: 멸하려 했느냐
  alternatives_korean:
  - 죽이려 했느냐
  - 파괴하려 했느냐
  lexicon: HALOT
  rationale: 문맥상 살해를 가리키지만, 어휘 자체의 폭넓은 의미를 반영하여 ‘멸하다’로 옮겼습니다.
- source_word: מְשִׁיחַ יְהוָה
  english_pob_choice: Yahweh’s anointed
  chosen_korean: 야훼의 기름부음 받은 이
  alternatives_korean:
  - 야훼의 메시아
  - 야훼의 기름부음 받은 자
  lexicon: HALOT
  rationale: 역사적 문맥에서는 사울을 가리키는 왕적 위임 표현이므로, 메시아 칭호를 앞세우지 않고 ‘기름부음 받은 이’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC divine name convention
  rationale: 고유신명사 יְהוָה는 직역 관례에 따라 ‘야훼’로 유지해 본문의 인격적 하나님의 이름을 드러냈습니다.
theological_decisions:
- issue: מְשִׁיחַ의 신학적 함의
  chosen_reading: 사울을 가리키는 왕적 기름부음 표현으로 읽고, 본문에는 ‘야훼의 기름부음 받은 이’로 옮겼습니다.
  alternative_readings:
  - ‘야훼의 메시아’
  - ‘야훼의 기름부음 받은 자’
  rationale: 본문은 후기 메시아론이 아니라 사울의 왕권이 야훼로부터 위임되었음을 강조합니다. 따라서 기독론적 오독을 막되, 신성한 위임의 무게는 보존해야 합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: titles and roles must be rendered in context'
