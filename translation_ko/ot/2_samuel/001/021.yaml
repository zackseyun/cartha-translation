id: 2SA.1.21
reference: 2 Samuel 1:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָרֵ֣י בַ/גִּלְבֹּ֗עַ אַל טַ֧ל וְ/אַל מָטָ֛ר עֲלֵי/כֶ֖ם וּ/שְׂדֵ֣י תְרוּמֹ֑ת כִּ֣י שָׁ֤ם נִגְעַל֙ מָגֵ֣ן גִּבּוֹרִ֔ים מָגֵ֣ן שָׁא֔וּל בְּלִ֖י מָשִׁ֥יחַ בַּ/שָּֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/021.yaml
  text: Mountains of Gilboa[a], let there be no dew or rain upon you, nor fields of offerings; for there the shield of the mighty was defiled, the shield of Saul[b], not anointed with oil.
  footnotes:
  - marker: a
    text: Or 'nor bounteous fields,' 'nor fields of firstfruits,' or 'nor fields of heave offerings.' The Hebrew phrase is difficult, and תְּרוּמוֹת often refers to offerings set apart for God.
    reason: lexical_alternative
  - marker: b
    text: The final phrase may refer to Saul's shield as no longer rubbed with oil, a customary preparation for battle, rather than to Saul himself as 'the anointed.'
    reason: cultural_note
translation:
  language: ko
  text: 길보아의 산들아, 너희 위에는 이슬도 비도 내리지 말고, 헌물의 밭도 없기를 바랍니다.[a] 그곳에서 용사들의 방패, 곧 사울의 방패가 더럽혀졌으니, 기름을 바르지 않은 채였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘풍성한 밭’, ‘첫 열매의 밭’, 또는 ‘거제물의 밭’. 히브리어 표현은 난해하며, תְּרוּמוֹת는 흔히 하나님께 따로 드리는 헌물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 사울이 ‘기름부음받은 자’라는 뜻이 아니라, 전투를 앞두고 방패에 기름을 발라 관리하던 관습을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי בַּגִּלְבֹּעַ
  english_pob_choice: Mountains of Gilboa
  chosen_korean: 길보아의 산들
  alternatives_korean:
  - 길보아의 산들아
  - 길보아 산악 지대
  lexicon: HALOT
  rationale: 원문의 직접 호격을 살리되, 한국어에서는 대상 지명을 앞세운 자연스러운 호칭으로 옮겼습니다.
- source_word: אַל טַל וְאַל מָטָר עֲלֵיכֶם
  english_pob_choice: let there be no dew or rain upon you
  chosen_korean: 너희 위에는 이슬도 비도 내리지 말고
  alternatives_korean:
  - 너희 위에 이슬도 비도 없게 하라
  - 너희 위에 이슬과 비가 내리지 않기를
  lexicon: HALOT
  rationale: אַל의 저주적 소원을 한국어 금지·소망 표현으로 옮기면서, ‘위에’로 직접 대상을 유지했습니다.
- source_word: וּשְׂדֵי תְרוּמֹת
  english_pob_choice: nor fields of offerings
  chosen_korean: 제물의 밭도
  alternatives_korean:
  - 첫 열매의 밭도
  - 거제의 밭도
  - 풍성한 밭도
  lexicon: HALOT
  rationale: תְרוּמוֹת의 제의적 의미를 흐리지 않기 위해 직역에 가깝게 ‘제물의 밭’으로 두고, 난해한 표현이라는 점을 과도한 의역 없이 반영했습니다.
- source_word: נִגְעַל
  english_pob_choice: was defiled
  chosen_korean: 더럽혀졌으니
  alternatives_korean:
  - 오염되었으니
  - 버림받았으니
  - 모욕을 당했으니
  lexicon: HALOT
  rationale: 전투 후 방패가 수치스럽게 훼손된 정황을 살리면서, 부정의 뉘앙스를 한국어의 ‘더럽혀지다’로 옮겼습니다.
- source_word: בְּלִי מָשִׁיחַ בַּשָּׁמֶן
  english_pob_choice: not anointed with oil
  chosen_korean: 기름으로 바른 것 같지 않았습니다
  alternatives_korean:
  - 기름으로 기름부음 받지 않았습니다
  - 기름을 바르지 않은 채였습니다
  - 기름으로 바른 일이 없었습니다
  lexicon: HALOT
  rationale: 여기서는 ‘메시아’가 아니라 방패의 군사적 관리 관습을 가리키므로, ‘기름으로 바르다’로 자연스럽게 처리해 도구적 의미를 유지했습니다.
theological_decisions:
- issue: מָשִׁיחַ의 번역에서 ‘메시아/기름부음 받은 자’ 제목으로 오해될 가능성
  chosen_reading: 방패에 대한 유지·처리 관습으로 이해하여 ‘기름으로 바른 것 같지 않았습니다’로 번역했습니다.
  alternative_readings:
  - 메시아로 기름부음 받은 사울의 방패
  - 기름부음받지 않은 사울의 방패
  rationale: 문맥상 초점은 사울 자신의 왕적 칭호가 아니라 전투용 방패의 상태입니다. לכן/그러므로 제목적 의미를 붙이지 않고, POB의 각주 취지대로 군사적·관용적 뜻을 드러냈습니다.
  doctrine_reference: Translation philosophy §§1, 3
