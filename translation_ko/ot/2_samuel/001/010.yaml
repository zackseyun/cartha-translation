id: 2SA.1.10
reference: 2 Samuel 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶעֱמֹ֤ד עָלָי/ו֙ וַ/אֲמֹ֣תְתֵ֔/הוּ כִּ֣י יָדַ֔עְתִּי כִּ֛י לֹ֥א יִֽחְיֶ֖ה אַחֲרֵ֣י נִפְל֑/וֹ וָ/אֶקַּ֞ח הַ/נֵּ֣זֶר אֲשֶׁ֣ר עַל רֹאשׁ֗/וֹ וְ/אֶצְעָדָה֙ אֲשֶׁ֣ר עַל זְרֹע֔/וֹ וָ/אֲבִיאֵ֥/ם אֶל אֲדֹנִ֖/י הֵֽנָּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/010.yaml
  text: So I stood over him and put him to death[a], because I knew that he would not live after he had fallen. Then I took the crown that was on his head and the armlet that was on his arm[b], and I brought them here to my lord.
  footnotes:
  - marker: a
    text: Or 'the bracelet.' The Hebrew term refers to an ornament worn on the arm.
    reason: lexical_alternative
  - marker: b
    text: This is the Amalekite's report to David. Compare 1 Samuel 31:4–5 for the earlier account of Saul's death.
    reason: cross_reference
translation:
  language: ko
  text: 그래서 내가 그 위에 서서 그를 죽였습니다[a]. 그가 쓰러진 뒤에는 살아남지 못하리라는 것을 내가 알았기 때문입니다. 그런 다음 나는 그의 머리 위에 있던 왕관과 그의 팔에 있던 완장을 가져와서 여기 내 주님께 가져왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 죽음에 이르게 했습니다.’ 히브리어 표현은 사망을 초래하는 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱמֹד עָלָיו
  english_pob_choice: So I stood over him
  chosen_korean: 내가 그 위에 서서
  alternatives_korean:
  - 그 위에 섰습니다
  - 그 위로 다가가 섰습니다
  lexicon: HALOT
  rationale: עליו를 단순한 위치가 아니라 쓰러진 사울의 몸 위에 선 자세로 이해해, 문맥에 맞게 자연스럽게 옮겼습니다.
- source_word: וַאֲמֹתְתֵהוּ
  english_pob_choice: put him to death
  chosen_korean: 그를 죽였습니다
  alternatives_korean:
  - 그를 죽음에 이르게 했습니다
  - 그를 처형했습니다
  lexicon: HALOT
  rationale: 원문의 사동적 의미를 살리되, 한국어에서는 가장 직접적인 동사로 옮기는 것이 보고문체에 가장 자연스럽습니다.
- source_word: הַנֵּזֶר
  english_pob_choice: the crown
  chosen_korean: 왕관
  alternatives_korean:
  - 관
  - 왕의 관
  lexicon: HALOT
  rationale: 왕권을 상징하는 머리장식을 현대 한국어에서 가장 분명하게 전달하는 말은 ‘왕관’입니다.
- source_word: וְאֶצְעָדָה
  english_pob_choice: the armlet
  chosen_korean: 완장
  alternatives_korean:
  - 팔찌
  - 팔고리
  lexicon: HALOT
  rationale: 이 장식은 팔에 착용하는 물건이므로, 손목을 떠올리기 쉬운 ‘팔찌’보다 문맥상 더 넓고 적절한 ‘완장’을 택했습니다.
theological_decisions:
- issue: 아말렉 사람의 직접 보고를 어떻게 처리할지
  chosen_reading: 이 구절은 화자의 주장 자체를 직접 보고하는 말로 옮기고, 1사무엘 31장의 병행본문과의 긴장은 번역문에서 해소하지 않았습니다.
  alternative_readings:
  - 사울의 죽음을 완곡하게 암시하는 식으로 다듬기
  - 병행본문에 맞추어 화자의 진술을 약화시키기
  rationale: 본문은 직접화법으로 전달되는 증언이므로, 화자가 무엇을 주장하는지 그대로 드러내는 것이 원문과 가장 잘 맞습니다.
  doctrine_reference: 해석상의 긴장은 번역이 아니라 주석에서 다루는 것이 적절합니다.
