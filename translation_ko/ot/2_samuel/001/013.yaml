  lexicon: HALOT
  rationale: 출신을 묻는 관용적 질문으로 이해하여, 현대 한국어에서 가장 간결하고 공손한 표현을 택했습니다.
- source_word: גֵּר
  english_pob_choice: sojourner / resident foreigner
