theological_decisions:
- issue: 가리키는 출신/혈통 표현의 중의성
  chosen_reading: ‘아말렉 사람 이주민의 아들’로 옮겨, 혈통적 귀속과 거류 신분의 결합을 함께 보이도록 했습니다.
  alternative_readings:
  - ‘아말렉 사람의 이주민 아들’
  - ‘아말렉 사람인 거류자의 아들’
  rationale: 히브리어는 아들의 혈통과 아버지의 거류 신분을 동시에 암시할 수 있으므로, 어느 한쪽으로 단정하지 않고 열린 형태를 유지했습니다.
  doctrine_reference: 본문 의미 보존 및 어휘 중의성 유지
