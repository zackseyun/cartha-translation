  rationale: מגיד는 정보를 전달하는 행위를 나타내므로, 서술의 자연스러움과 의미를 함께 살려 ‘알려 준’으로 옮겼습니다.
- source_word: אֵי מִזֶּה אָתָּה
  english_pob_choice: Where are you from?
  chosen_korean: 어디 출신입니까?
