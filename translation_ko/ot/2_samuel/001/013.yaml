revisions:
- from: 다윗이 그에게 알려 준 젊은이에게 말했습니다. "어디 출신입니까?" 그가 대답했습니다. "저는 아말렉 사람 이주민의 아들입니다."[a]
  to: 다윗이 자기에게 소식을 전한 젊은이에게 말했습니다. “어디에서 왔습니까?” 그가 대답했습니다. “저는 아말렉 사람인 거류자의 아들입니다.”[a]
  rationale: 수정문은 원문의 질문이 묻는 출처를 자연스러운 합쇼체로 옮기고, 보고자를 가리키는 관계절의 지시 대상을 명확히 했습니다. ‘거류자’는 גֵּר의 타지 거주 외부인이라는 의미를 보존하며, 각주는 히브리어 구문의 해석 가능성을 유지하되 본문에 없는 장소 정보를 덧붙이지 않습니다.
