lexical_decisions:
- source_word: אֵי מִזֶּה
  english_pob_choice: Where have you come from?
  chosen_korean: 어디에서 왔느냐?
  alternatives_korean:
  - 어디서 왔느냐?
  - 어디에서 왔습니까?
  lexicon: HALOT
  rationale: 히브리어 관용구는 출발지/기원을 묻는 말이므로, 한국어에서는 자연스러운 기원 질문인 「어디에서 왔느냐?」로 옮겼습니다. 대화체 성격을 살리기 위해 격식 있는 질문형을 유지했습니다.
- source_word: תָּבוֹא
  english_pob_choice: have you come
  chosen_korean: 왔느냐
  alternatives_korean:
  - 왔습니까
  - 오느냐
  lexicon: HALOT
  rationale: 형태상 미완료형이지만, 이미 도착한 이동의 완료 여부를 묻는 문맥이므로 한국어에서는 완료된 이동을 가리키는 「왔느냐」가 가장 자연스럽습니다.
- source_word: מִמַּחֲנֵה יִשְׂרָאֵל
  english_pob_choice: from the camp of Israel
  chosen_korean: 이스라엘 진영에서
  alternatives_korean:
  - 이스라엘의 진영에서
  - 이스라엘 군영에서
  lexicon: HALOT
  rationale: מַחֲנֶה는 군사적 ‘진영/군영’을 뜻하므로, 역사 서술의 분위기와 전투 맥락을 살려 「이스라엘 진영」으로 번역했습니다.
- source_word: נִמְלָטְתִּי
  english_pob_choice: I have escaped
  chosen_korean: 도망쳐 나왔습니다
  alternatives_korean:
  - 탈출했습니다
  - 빠져나왔습니다
  - 도망쳤습니다
  lexicon: HALOT
  rationale: 동사의 핵심은 위험에서 벗어난 ‘탈출/도피’이므로, 결과가 드러나는 완료적 표현인 「도망쳐 나왔습니다」가 본문의 긴박함을 잘 드러냅니다.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  english_pob_choice: said ... said
  chosen_korean: 말했습니다 ... 말했습니다
  alternatives_korean:
  - 물었습니다 ... 대답했습니다
  - 이르러 말했습니다 ... 이르러 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 반복되는 ‘말하다’를 그대로 따라, 한국어도 서술을 지나치게 해석하지 않고 「말했습니다」를 유지했습니다.
theological_decisions:
- issue: 대화 인칭과 존대의 처리
  chosen_reading: 서술은 합쇼체로 유지하고, 인물 간 대화는 상대를 향한 일반적인 격식 질문으로 처리했습니다.
  alternative_readings:
  - 비격식 대화체로 낮춤
  - 전면적인 고어체
  rationale: 본문은 왕과 전령의 짧은 대화이므로 현대 표준어의 읽기성을 유지하면서도, 서사 문체는 합쇼체로 통일하는 것이 원문 정보 구조를 가장 잘 보존합니다.
  doctrine_reference: 문체/화행 선택
