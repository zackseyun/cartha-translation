  text: Then David sang this lament over Saul and over Jonathan his son,[a]
  footnotes:
  - marker: a
    text: Or 'lamented with this lament'; the Hebrew verb and noun form a formal expression for taking up a funeral lament.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗이 사울과 그의 아들 요나단을 두고 이 애가를 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 애가로 애곡했습니다’. 히브리어 동사와 명사의 결합은 장례 애가를 시작하는 정형 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקֹנֵן
  english_pob_choice: sang this lament
  chosen_korean: 이 애가를 불렀습니다
  alternatives_korean:
  - 이 애가를 지었습니다
  - 이 애가를 읊었습니다
  - 이 애가를 노래했습니다
  lexicon: HALOT
  rationale: קונן은 장례 상황에서 애가를 읊거나 부르는 정형적 행위를 가리키므로, 한국어에서는 ‘애가를 불렀습니다’가 내용과 수행성을 함께 살리면서도 자연스럽습니다.
- source_word: הַקִּינָה
  english_pob_choice: lament
  chosen_korean: 애가
  alternatives_korean:
  - 슬픔의 노래
  - 곡
  - 비가
  lexicon: HALOT
  rationale: קִינָה는 죽음과 상실을 위한 정형화된 슬픈 노래이므로, 현대 한국어에서 가장 직접적인 대응은 ‘애가’입니다.
- source_word: עַל
  english_pob_choice: over
  chosen_korean: 을 두고
  alternatives_korean:
  - 위하여
  - 에 대하여
  - 을 향하여
  lexicon: HALOT
  rationale: 애가의 대상이 사울과 요나단임을 한국어 관용에 맞게 드러내기 위해 ‘을 두고’로 옮겼습니다.
- source_word: בְּנוֹ
  english_pob_choice: his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 자기 아들
  - 그 아들
  lexicon: HALOT
  rationale: 지시 대상이 사울이므로, 소유 대명사를 자연스럽게 살려 ‘그의 아들’로 옮겼습니다.
theological_decisions:
- issue: wayyiqtol narrative sequencing
  chosen_reading: ‘그때’로 آغاز되는 서술적 전개를 유지해, 사건 순서를 간결하게 드러냈습니다.
  alternative_readings:
  - ‘그리고’
  - ‘그런 뒤에’
  rationale: 히브리어 서술 진행을 자연스러운 한국어 연결어로 옮기되, 과도한 해설 없이 다음 절로 이어지게 했습니다.
  doctrine_reference: 서사문 번역 원칙
