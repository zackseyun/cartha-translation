  yaml_path: translation/ot/2_samuel/001/025.yaml
  text: How the mighty have fallen in the midst of the battle! Jonathan lies slain on your heights[a].
  footnotes:
  - marker: a
    text: Or 'your high places.' The Hebrew can refer to elevated terrain; here it likely means the heights of Israel addressed poetically in the lament.
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 용사들이 전투 한복판에서 쓰러졌습니다! 요나단은 이스라엘의 높은 곳들 위에 죽임을 당해 쓰러져 있습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 높은 곳들.’ 히브리어의 ‘당신의’는 애가에서 시적으로 불린 이스라엘을 가리키는 것으로 보입니다. 이 말은 높이 솟은 지형을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
