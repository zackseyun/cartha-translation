base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/023.yaml
  text: Saul and Jonathan[a], beloved and pleasant in their lives, were not parted in their death; they were swifter than eagles[c][b], they were stronger than lions.
  footnotes:
  - marker: a
    text: Or 'lovely' for 'pleasant.'
    reason: lexical_alternative
  - marker: b
    text: Or 'faster than vultures,' since the Hebrew word can refer more broadly to a large bird of prey, though 'eagles' is the traditional and most natural rendering here.
    reason: lexical_alternative
  - marker: c
    text: Or 'mightier than lions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울과 요나단은 삶에서는 사랑받고 사랑스러웠으며, 죽음에서도 서로 갈라지지 않았습니다. 그들은 독수리보다 더 빨랐고 사자보다 더 강했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사랑스러웠으며’는 히브리어 נעים의 의미를 반영한 번역으로, ‘아름다운’이나 ‘즐거운’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘독수리’는 히브리어 נשר를 따른 전통적 번역입니다. 문맥상 ‘독수리’ 외에 더 넓게는 큰 맹금류를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘강했습니다’는 ‘더 힘이 셌습니다’ 또는 ‘더 위대했습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּאֱהָבִים
  english_pob_choice: beloved
  chosen_korean: 사랑받고
  alternatives_korean:
  - 사랑받은
  - 사랑스러운
  - 사랑받은 자들
  lexicon: HALOT
  rationale: 사랑의 수동적 성격을 살리되, 애가 문맥에 맞게 자연스러운 현대 한국어로 옮겼습니다.
- source_word: וְהַנְּעִימִם
  english_pob_choice: pleasant
  chosen_korean: 사랑스러웠으며
  alternatives_korean:
  - 즐거웠으며
  - 호감이 가는 이들이었으며
  - 아름다웠으며
  lexicon: HALOT
  rationale: נעים의 ‘기분 좋고 매력적인’ 뉘앙스를 한국어에서 인격적 호감을 나타내는 ‘사랑스럽다’로 옮겨, 앞의 ‘사랑받다’와 병행을 살렸습니다.
- source_word: לֹא נִפְרָדוּ
  english_pob_choice: were not parted
  chosen_korean: 서로 갈라지지 않았습니다
  alternatives_korean:
  - 헤어지지 않았습니다
  - 나뉘지 않았습니다
  - 분리되지 않았습니다
  lexicon: HALOT
  rationale: נפרד의 분리/이별 의미를 유지하면서, 시적 병행 속에서 관계의 단절이 없었다는 뜻을 자연스럽게 드러냈습니다.
- source_word: מִנְּשָׁרִים קַלּוּ
  english_pob_choice: swifter than eagles
  chosen_korean: 독수리보다 더 빨랐고
  alternatives_korean:
  - 독수리보다 더 날랐고
  - 매보다 더 빨랐고
  - 수리보다 더 빨랐고
  lexicon: HALOT
  rationale: 기존 POB의 ‘eagles’에 맞춰 ‘독수리’로 옮겼고, קַלּוּ의 속도 의미를 현대 한국어의 직접적 비교로 살렸습니다.
- source_word: מֵאֲרָיוֹת גָּבֵרוּ
  english_pob_choice: stronger than lions
  chosen_korean: 사자보다 더 강했습니다
  alternatives_korean:
  - 사자보다 더 힘셌습니다
  - 사자보다 더 위대했습니다
  - 사자보다 더 용맹했습니다
  lexicon: HALOT
  rationale: גבר의 힘/우세 의미를 가장 सीधे 드러내는 ‘강하다’로 옮겨, 시적 비교를 간결하게 유지했습니다.
theological_decisions:
- issue: 사울에 대한 장송의 언어와 서사의 긴장
  chosen_reading: 사울과 요나단을 함께 기리는 애가의 수사로 옮기되, 사울의 앞선 실패를 번역에서 해소하거나 완화하지 않았습니다.
  alternative_readings:
  - 사울의 부정적 배경을 반영해 칭송을 약화함
  - 사울을 이상화하여 성인화함
  rationale: 본문은 장송가의 고양된 언어로 두 사람을 함께 추모합니다. 번역은 이 긍정적 표현을 보존하되, 사울 서사의 긴장은 해설이 아닌 본문대로 남겨 두어야 합니다.
  doctrine_reference: 본문의 수사와 서사적 긴장을 유지합니다.
