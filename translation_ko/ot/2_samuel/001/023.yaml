base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/023.yaml
  text: Saul and Jonathan[a], beloved and pleasant in their lives, were not parted in their death; they were swifter than eagles[c][b], they were stronger than lions.
  footnotes:
  - marker: a
    text: Or 'lovely' for 'pleasant.'
    reason: lexical_alternative
  - marker: b
    text: Or 'faster than vultures,' since the Hebrew word can refer more broadly to a large bird of prey, though 'eagles' is the traditional and most natural rendering here.
    reason: lexical_alternative
  - marker: c
    text: Or 'mightier than lions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울과 요나단은 살아 있을 때 사랑받고 아름다웠으며[a], 죽을 때에도 서로 헤어지지 않았습니다. 그들은 독수리보다 더 빨랐고[b] 사자보다 더 강했습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아름다웠으며’는 히브리어 נעים의 의미를 반영한 번역으로, ‘사랑스러웠으며’ 또는 ‘기쁨을 주었으며’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘독수리’는 히브리어 נשר를 따른 전통적 번역입니다. 이 말은 더 넓게 큰 맹금류를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘더 강했습니다’는 ‘더 힘이 셌습니다’ 또는 ‘더 위세가 있었습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
