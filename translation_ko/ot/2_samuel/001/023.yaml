  source_fidelity: 대체로 히브리어의 병행과 비교 표현을 충실히 옮겼습니다. 다만 נעים의 뜻을 ‘사랑스러웠으며’로 옮기면 앞선 ‘사랑받고’와 어근이 겹쳐, ‘사랑받는’과 ‘기쁘고/아름다운’이라는 서로 다른 두 형용사의 병행이 약해집니다. ‘아름다웠으며’는 애가의 시적 문맥에서 안전하고 자연스러운 표현입니다.
  naturalness: 합쇼체 문장은 자연스럽습니다. 그러나 ‘삶에서는’보다 ‘살아 있을 때’, ‘서로 갈라지지 않았습니다’보다 관계적 이별을 나타내는 ‘서로 헤어지지 않았습니다’가 이 장송시의 현대 한국어 문맥에 더 매끄럽습니다. 각주 표지는 해당 단어 바로 뒤에 두는 편이 독자에게 명확합니다.
  terminology: 사울, 요나단, 독수리, 사자 등 고유명사와 핵심 어휘는 적절합니다. נעים에 ‘아름다웠으며’를 사용하여 ‘사랑받고’와 의미상 구별되는 시적 병행을 보존합니다. ‘더 위대했습니다’는 גבר의 비교 대상인 신체적 힘·기세보다 넓고 부정확할 수 있으므로 각주 대안에서는 제외합니다.
