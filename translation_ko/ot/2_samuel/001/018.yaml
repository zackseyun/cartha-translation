  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לְ/לַמֵּ֥ד בְּנֵֽי יְהוּדָ֖ה קָ֑שֶׁת הִנֵּ֥ה כְתוּבָ֖ה עַל סֵ֥פֶר הַ/יָּשָֽׁר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/018.yaml
  text: 'and said that the sons of Judah should be taught “The Bow.” Behold, it is written in the Book of Jashar:'
translation:
  language: ko
  text: 그리고 유다 자손들에게 활을 가르치라고 말했습니다. 보십시오, 그것은 야살의 책에 기록되어 있습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “유다 자손들에게 활을 가르치다”입니다. EN POB의 “The Bow”는 표제처럼 읽는 해석을 반영한 표현입니다.
    reason: alternative_reading
  - marker: b
    text: “보십시오”는 הנה의 주의 환기 표현을 현대 한국어 합쇼체로 옮긴 것입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: לְלַמֵּד בְּנֵי יְהוּדָה קָשֶׁת
  english_pob_choice: that the sons of Judah should be taught “The Bow”
  chosen_korean: 유다 자손들에게 활을 가르치라고
  alternatives_korean:
  - 유다 자손들에게 ‘활’이라는 노래를 가르치라고
  - 유다 자손들에게 활 사용을 가르치라고
  lexicon: למד / קשת
  rationale: 히브리어는 문자적으로 ‘유다 자손들에게 활을 가르치다’이며, EN POB의 “The Bow”는 표제처럼 처리한 표현입니다. 한국어 본문에서는 먼저 직접적인 동사구를 살리고, 표제성 해석은 본문에 과도하게 넣지 않았습니다.
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게
  lexicon: הנה
  rationale: 청자 주의를 끄는 감탄·지시 표현으로, 현대 한국어 합쇼체에서는 ‘보십시오’가 가장 자연스럽고 출판용 문체에 맞습니다.
- source_word: סֵפֶר הַיָּשָׁר
  english_pob_choice: Book of Jashar
  chosen_korean: 야살의 책
  alternatives_korean:
  - 야살서
  - 야쇠르의 책
  lexicon: ספר הישר
  rationale: 고유명사성 표현으로 보아 전통적으로 알려진 ‘야살의 책’을 유지했습니다. ‘Book of Jashar’의 Jashar는 음역보다 관용적 한국어 표기를 따랐습니다.
theological_decisions:
- issue: “The Bow”를 표제처럼 옮길지, 일반 명사구로 옮길지
  chosen_reading: 본문은 ‘활을 가르치다’로 옮기고, EN POB의 표제성 해석은 본문에 추가하지 않았습니다.
  alternative_readings:
  - ‘활’이라는 표제의 노래로 옮김
  - ‘The Bow’를 그대로 음역하거나 제목처럼 처리
  rationale: 히브리어 원문은 인용 부호가 없는 구문이며, 문맥상 애곡/기념 노래의 제목으로 이해될 가능성은 있으나 원문이 명시하지 않습니다. 따라서 해석을 과도하게 고정하지 않고 소스에 더 가까운 형태를 택했습니다.
  doctrine_reference: 문학적/주해적 절제 원칙
