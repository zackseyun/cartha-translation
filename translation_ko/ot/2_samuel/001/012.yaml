  text: וַֽ/יִּסְפְּדוּ֙ וַ/יִּבְכּ֔וּ וַ/יָּצֻ֖מוּ עַד הָ/עָ֑רֶב עַל שָׁא֞וּל וְ/עַל יְהוֹנָתָ֣ן בְּנ֗/וֹ וְ/עַל עַ֤ם יְהוָה֙ וְ/עַל בֵּ֣ית יִשְׂרָאֵ֔ל כִּ֥י נָפְל֖וּ בֶּ/חָֽרֶב־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/012.yaml
  text: They mourned[a], wept, and fasted until evening for Saul, for Jonathan his son, for the people of Yahweh, and for the house of Israel[b], because they had fallen by the sword.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Jonathan his son,'' identifying Jonathan specifically as Saul''s son.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD's people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 사울과 그의 아들 요나단과 야훼의 백성과 이스라엘 집을 위해 저녁까지 슬퍼하며 울고 금식했습니다. 이는 그들이 칼에 쓰러졌기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘요나단 그의 아들’로, 요나단이 사울의 아들임을 분명히 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼의 백성’ 또는 ‘주님의 백성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפְּדוּ
  english_pob_choice: they mourned
  chosen_korean: 슬퍼하며
  alternatives_korean:
  - 애도하며
  - 곡하며
  lexicon: HALOT
  rationale: ספד는 죽은 이를 위한 공식적 애도와 슬픔의 표현이므로, 현대 한국어에서는 ‘슬퍼하며’가 과도하게 장례용어화하지 않으면서도 장중한 mourning의 뜻을 살립니다.
- source_word: וַיִּבְכּוּ
  english_pob_choice: wept
  chosen_korean: 울고
  alternatives_korean:
  - 흘리고
  - 통곡하고
  lexicon: HALOT
  rationale: בכה의 직접적 의미는 ‘울다’이므로, 앞의 ‘슬퍼하며’와 구별되게 기본 동사형 ‘울고’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 번역의 정본 용례에 따라 여호와 대신 신명사 პირდაპირ 음역인 ‘야훼’를 사용하여, 본문의 고유명사성을 보존했습니다.
- source_word: עַם יְהוָה
  english_pob_choice: the people of Yahweh
  chosen_korean: 야훼의 백성
  alternatives_korean:
  - 야훼의 사람들
  - 야훼 백성
  lexicon: HALOT
  rationale: עַם은 ‘백성’이 가장 자연스럽고, יְהוָה를 ‘야훼’로 옮겨 언약 공동체를 고유하게 표시했습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘 가문
  - 이스라엘의 집
  lexicon: HALOT
  rationale: 직역형인 ‘집’은 본문의 관용구를 유지하며, ‘이스라엘의 집’보다 간결하게 집단 전체를 가리키는 표현을 살립니다.
theological_decisions:
- issue: 지명·인명과 함께 반복되는 애도 행위를 어떻게 나눠 옮길지
  chosen_reading: 슬퍼하며 울고 금식했습니다
  alternative_readings:
  - 애도하며 울고 금식했습니다
  - 통곡하며 울고 금식했습니다
  rationale: 세 동사 ספד / בכה / צום을 각각 구별하되, 한국어에서는 의미 중복을 과장하지 않도록 ‘슬퍼하며 / 울고 / 금식했습니다’로 자연스럽게 배열했습니다.
  doctrine_reference: 'SOURCE_FIDELITY: Hebrew verb sequence preserved without over-paraphrase'
