  source_fidelity: 첫 금지의 장소 표현은 히브리어 בְּגַת에 따라 ‘가드에서’가 더 정확합니다. פֶּן이 이끄는 두 절은 두려움의 명제라기보다, 적들이 기뻐하거나 환호하게 될 결과를 막기 위한 경계(‘~할까 하여’)입니다. 개정문은 이 관계와 두 동사의 점층(기뻐하다/크게 즐거워하다)을 보존합니다.
