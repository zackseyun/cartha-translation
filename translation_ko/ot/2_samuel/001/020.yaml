  lexicon: HALOT
  rationale: ‘uncircumcised’의 언약적 경멸어를 직역해 유지하되, 한국어에서 자연스러운 집단표현을 위해 ‘자들’로 풀었습니다.
theological_decisions:
- issue: עֲרֵלִים의 언약적 경멸 표현
  chosen_reading: ‘할례받지 않은 자들’로 직역해 블레셋을 가리키는 언약적 수치를 드러냈습니다.
  alternative_readings:
  - ‘이방인들’
  - ‘무할례자들’
  rationale: 본문의 수사는 단순한 민족 명칭이 아니라 할례 언약을 전제한 조롱이므로, 그 신학적 긴장을 약화시키지 않도록 직접적으로 옮겼습니다.
  doctrine_reference: Translation philosophy §§1, 5
