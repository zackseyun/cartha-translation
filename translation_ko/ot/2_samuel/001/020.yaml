  terminology: ‘가드’, ‘아스글론’, ‘블레셋’, ‘할례받지 않은 자들’은 적절합니다. 마지막 표현은 히브리어의 언약적·논쟁적 명칭을 직역하여 보존하되, 주석에서 그 기능을 설명합니다.
