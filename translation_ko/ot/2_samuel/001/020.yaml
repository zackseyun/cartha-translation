source:
  edition: WLC
  text: אַל תַּגִּ֣ידוּ בְ/גַ֔ת אַֽל תְּבַשְּׂר֖וּ בְּ/חוּצֹ֣ת אַשְׁקְל֑וֹן פֶּן תִּשְׂמַ֨חְנָה֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים פֶּֽן תַּעֲלֹ֖זְנָה בְּנ֥וֹת הָ/עֲרֵלִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/020.yaml
  text: Do not tell it in Gath[a]; do not proclaim the news in the streets of Ashkelon, lest the daughters of the Philistines rejoice[b], lest the daughters of the uncircumcised exult.
  footnotes:
  - marker: a
    text: Or 'announce it' / 'bring the news' for 'proclaim the news.'
    reason: lexical_alternative
  - marker: b
    text: '''The daughters of the uncircumcised'' is a literal rendering of a covenantal term of reproach for the Philistines; alternatively, ''the daughters of the uncircumcised ones.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 가드에 말하지 마십시오[a]; 아스글론의 거리에서 소식을 전하지 마십시오. 두려운 것은 블레셋의 딸들이 기뻐하고[b], 할례받지 않은 자들의 딸들이 크게 즐거워할까 함입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘알리지 마십시오’, ‘전하지 마십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘블레셋의 딸들’과 평행을 이루는 언약적 조롱을 보존한 표현입니다.
    reason: theological_note
lexical_decisions:
- source_word: אַל תַּגִּידוּ
  english_pob_choice: Do not tell it
  chosen_korean: 말하지 마십시오
  alternatives_korean:
  - 그것을 전하지 마십시오
  - 알리지 마십시오
  lexicon: HALOT
  rationale: נגד의 금지형을 현대 한국어의 직접 금지문으로 자연스럽게 옮기되, 목적어가 문맥상 생략된 점을 살려 간결하게 처리했습니다.
- source_word: תְּבַשְּׂר֖וּ
  english_pob_choice: proclaim the news
  chosen_korean: 소식을 전하지 마십시오
  alternatives_korean:
  - 소식을 선포하지 마십시오
  - 소식을 알리지 마십시오
  lexicon: HALOT
  rationale: בשר의 공적 선포 뉘앙스를 살리면서도 한국어에서 과도하게 교회적이지 않은 표현을 택했습니다.
- source_word: בְּחוּצֹ֣ת אַשְׁקְל֑וֹן
  english_pob_choice: in the streets of Ashkelon
  chosen_korean: 아스글론의 거리에서
  alternatives_korean:
  - 아스글론의 넓은 거리에서
  - 아스글론의 길거리에서
  lexicon: HALOT
  rationale: חוּצוֹת의 도시 공공장소를 한국어의 ‘거리’로 옮겨 공개적 장소라는 대비를 유지했습니다.
- source_word: בְּנ֣וֹת פְּלִשְׁתִּ֔ים / בְּנ֥וֹת הָעֲרֵלִֽים
  english_pob_choice: the daughters of the Philistines / the daughters of the uncircumcised
  chosen_korean: 블레셋의 딸들 / 할례받지 않은 자들의 딸들
  alternatives_korean:
  - 블레셋 사람들의 딸들 / 무할례자들의 딸들
  - 블레셋의 여자들 / 할례받지 않은 이들의 딸들
  lexicon: HALOT
  rationale: ‘uncircumcised’의 언약적 경멸어를 직역해 유지하되, 한국어에서 자연스러운 집단표현을 위해 ‘자들’로 풀었습니다.
theological_decisions:
- issue: עֲרֵלִים의 언약적 경멸 표현
  chosen_reading: ‘할례받지 않은 자들’로 직역해 블레셋을 가리키는 언약적 수치를 드러냈습니다.
  alternative_readings:
  - ‘이방인들’
  - ‘무할례자들’
  rationale: 본문의 수사는 단순한 민족 명칭이 아니라 할례 언약을 전제한 조롱이므로, 그 신학적 긴장을 약화시키지 않도록 직접적으로 옮겼습니다.
  doctrine_reference: Translation philosophy §§1, 5
