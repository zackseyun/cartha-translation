  text: 이스라엘의 딸들아, 사울을 두고 우십시오. 그는 너희에게 호화로운 장식과 함께[a] 주홍 옷을 입혀 주고, 너희 옷 위에 금 장신구를[b] 더해 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
