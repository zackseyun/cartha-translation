  text: Daughters of Israel[a], weep over Saul, who clothed you in scarlet with luxuries[b], who put ornaments of gold on your clothing.
  footnotes:
  - marker: a
    text: Or 'with delights,' 'with finery,' or 'with ornaments' for the phrase 'with luxuries.'
    reason: lexical_alternative
  - marker: b
    text: Or 'gold jewelry' for 'ornaments of gold.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 딸들아, 사울을 두고 울어라. 그가 너희에게 주홍 옷을 입히고 호화로운 것들을 더해 주었으며, 너희 옷에 금 장식물을 올려 주었느니라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호화로운 것들’은 עֲדָנִים의 뜻 범위를 넓게 반영한 번역이며, 문맥에 따라 ‘기쁨들’, ‘사치품들’, ‘장식들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘금 장식물’은 עֲדִי זָהָב의 자연스러운 옮김이며, ‘금 장신구’로도 번역할 수 있습니다.
    reason: lexical_alternative
