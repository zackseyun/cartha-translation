    text: ‘호화로운 장식’은 히브리어 עֲדָנִים을 옮긴 말입니다. 문맥에 따라 ‘기쁨들’, ‘사치품들’, 또는 ‘장식들’로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘금 장신구’는 히브리어 עֲדִי זָהָב을 옮긴 말이며, ‘금 장식물’로도 번역할 수 있습니다.
    reason: lexical_alternative
