translation:
  language: ko
  text: 그가 나에게 「네가 누구냐?」라고 말했습니다. 나는 그에게 「나는 아말렉 사람입니다」라고 대답했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 두 번째 절에서 표면상 ‘그리고 그가 말했다’라고 되어 있습니다. 그러나 문맥상 화자가 자신의 대답을 회상하므로, ‘그리고 내가 그에게 말했다’라는 뜻으로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
