  text: Then David said to him[a], “Your blood is on your own head, for your own mouth has testified against you, saying[b], ‘I myself killed Yahweh’s anointed.’”
  footnotes:
  - marker: a
    text: Or, more formally, “Your blood be on your head.” The Hebrew idiom assigns responsibility for his death to himself.
    reason: lexical_alternative
  - marker: b
