    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다윗이 그에게 말했습니다. “네 피가 네 머리 위에 있습니다.”[a] “네 입이 ‘내가 야훼의 기름부음 받은 이를 죽였다’고 말하여 너에게 불리하게 증언했기 때문입니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, “네 피가 네 머리 위에 있다.” 이 히브리 관용구는 그가 자기 죽음의 책임을 스스로 지고 있음을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “네 입이 너에게 불리하게 증언했기 때문입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  english_pob_choice: Then David said to him
  chosen_korean: 그러자 다윗이 그에게 말했습니다
  alternatives_korean:
  - 그리고 다윗이 그에게 말했습니다
  - 다윗이 그에게 말했습니다
  lexicon: WLC + EN POB audit trail
  rationale: 와우 연속의 서사 진행을 살려 ‘그러자’로 자연스럽게 순서를 드러내고, אֵלָיו를 ‘그에게’로 분명히 옮겼습니다.
- source_word: דָּמֶיךָ עַל רֹאשֶׁךָ
  english_pob_choice: Your blood is on your own head
  chosen_korean: 네 피가 네 머리 위에 있소
  alternatives_korean:
  - 네 피가 네 머리 위에 있습니다
  - 네 피의 책임이 네 머리 위에 있소
  lexicon: HALOT
  rationale: 히브리어의 관용적 책임 전가 표현을 그대로 살리되, ‘피’를 유지해 자업자득의 법정적 의미를 보존했습니다.
- source_word: עָנָה בְךָ
  english_pob_choice: has testified against you
  chosen_korean: 너를 대적하여 증언했기 때문이오
  alternatives_korean:
  - 너에게 불리하게 증언했기 때문이오
  - 너에 대하여 증언했기 때문이오
  lexicon: HALOT
  rationale: 법정 문맥에서 ‘증언하다’의 뜻을 살리고, בְךָ의 불리한 방향을 ‘대적하여’로 드러냈습니다.
- source_word: אָנֹכִי מֹתַתִּי אֶת מְשִׁיחַ יְהוָה
  english_pob_choice: I myself killed Yahweh’s anointed
  chosen_korean: 내가 야훼의 기름부음 받은 이를 죽였다
  alternatives_korean:
  - 내가 야훼의 메시아를 죽였다
  - 내가 야훼의 기름부음을 받은 자를 죽였다
  lexicon: HALOT + project glossary
  rationale: אָנֹכִי의 강조를 한국어에서 자연스럽게 처리하면서, מְשִׁיחַ는 본문 맥락상 ‘기름부음 받은 이’로 옮겨 사울을 가리키는 왕적 호칭을 유지했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본어에 따라 신명기를 포함한 구약의 여호와-신명은 ‘야훼’로 옮겨, 고유한 언약명을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: מְשִׁיחַ의 번역
  chosen_reading: 기름부음 받은 이
  alternative_readings:
  - 메시아
  - 기름부음 받은 자
  rationale: 이 구절은 기독론적 칭호가 아니라 사울에 대한 왕적 호칭이므로, 후대 신학적 연상을 피하고 원문의 역사적 의미를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: translate titles; transliterate names'
