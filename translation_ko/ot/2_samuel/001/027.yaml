id: 2SA.1.27
reference: 2 Samuel 1:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֚יךְ נָפְל֣וּ גִבּוֹרִ֔ים וַ/יֹּאבְד֖וּ כְּלֵ֥י מִלְחָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/027.yaml
  text: How the mighty have fallen[b][a], and the weapons of war have perished!
  footnotes:
  - marker: a
    text: Or 'the implements of war' or 'the armor of war.' The Hebrew phrase can refer broadly to military equipment, not only offensive weapons.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the weapons of war' may be understood metaphorically of Saul and Jonathan themselves as Israel's martial strength, though it can also be read literally.
    reason: alternative_reading
translation:
  language: ko
  text: 어찌 용사들이 쓰러졌으며, 전쟁의 무기들이 사라졌습니다![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 전쟁용 무기만이 아니라 전쟁 장비나 병기 전반을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 사울과 요나단 같은 이스라엘의 전투력을 비유적으로 가리킬 수도 있지만, 문자적으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  english_pob_choice: How
  chosen_korean: 어찌
  alternatives_korean:
  - 어떻게
  - 아, 어찌
  lexicon: HALOT
  rationale: 탄식의 감탄사로 쓰인 말이므로 정보 질문이 아니라 애도의 울림을 살려 「어찌」로 옮겼습니다.
- source_word: גִבּוֹרִים
  english_pob_choice: the mighty
  chosen_korean: 용사들
  alternatives_korean:
  - 강한 자들
  - 영웅들
  - 용맹한 사람들
  lexicon: HALOT
  rationale: 이 문맥에서는 전투의 강한 자들을 가리키므로, 한국어에서 자연스럽고 시적 긴장을 유지하는 「용사들」을 택했습니다.
- source_word: וַיֹּאבְד֖וּ
  english_pob_choice: have perished
  chosen_korean: 사라졌습니다
  alternatives_korean:
  - 멸망했습니다
  - 끊어졌습니다
  - 소멸했습니다
  lexicon: HALOT
  rationale: אבד는 ‘멸망하다/사라지다/잃어버리다’의 폭이 있으므로, 여기서는 전쟁 능력의 상실까지 포괄하는 「사라졌습니다」로 자연스럽게 옮겼습니다.
- source_word: כְּלֵי מִלְחָמָה
  english_pob_choice: the weapons of war
  chosen_korean: 전쟁의 무기들
  alternatives_korean:
  - 전쟁의 도구들
  - 전쟁 장비들
  - 전쟁의 병기들
  lexicon: HALOT
  rationale: 직역하면 ‘전쟁의 기구/도구들’이지만 한국어에서는 「전쟁의 무기들」이 가장 직접적이며, 문맥상 무기와 전투력을 함께 환기합니다.
theological_decisions:
- issue: ‘전쟁의 무기들’의 문자적/비유적 이해
  chosen_reading: 문자적 전투 무기를 우선으로 읽되, 사울과 요나단이 이스라엘의 전투력 자체를 대표한다는 비유 가능성은 본문 어휘를 그대로 살려 열어 둡니다.
  alternative_readings:
  - 사울과 요나단을 가리키는 은유로만 한정
  - 순전히 물리적 무기만을 지시
  rationale: 히브리어 표현과 영어 POB 주석이 문자적·비유적 두 가능성을 모두 인정하므로, 한국어 본문도 특정 해석으로 닫지 않도록 했습니다.
  doctrine_reference: 본문 주해의 다의성 보존
- issue: 탄식 시어의 격식 유지
  chosen_reading: 서술문이 아니라 애가의 감탄으로 읽히도록 문장 전체를 탄식조로 유지했습니다.
  alternative_readings:
  - 평서문처럼 중립적으로 번역
  - ‘아, 어떻게’처럼 더 감정적으로 확대
  rationale: 이 절은 슬픔의 정점에 있는 탄식이므로, 현대 한국어에서도 과도한 해설 없이 짧고 절제된 애가의 어조를 살리는 것이 원문에 충실합니다.
  doctrine_reference: 시적 장르 보존
