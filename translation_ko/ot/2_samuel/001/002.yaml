theological_decisions:
- issue: וַיִּשְׁתָּחוּ의 의미 범위
  chosen_reading: 여기서는 예배라기보다 왕 앞에서의 깊은 경의와 복종을 뜻하는 행위로 읽었습니다.
  alternative_readings:
  - 예배로 읽을 수 있음
  - 단순한 인사로 읽을 수 있음
  rationale: 문맥상 다윗 앞에 엎드린 동작이며, 히브리어 동사는 상황에 따라 경배·절·복종을 모두 가질 수 있으나 여기서는 그 중간 정도의 힘을 살리는 것이 가장 정확합니다.
  doctrine_reference: 본문 맥락과 동사 용례
- issue: מֵעִם שָׁאוּל의 관계성
  chosen_reading: 사울의 직접 파견을 단정하지 않고, 사울과 연관된 진영에서 온 것으로 표현했습니다.
  alternative_readings:
  - 사울에게서 직접 왔다고 읽기
  - 사울이 보낸 사람으로 읽기
  rationale: 영어 POB의 주석처럼 히브리어는 '사울과 함께/사울의 편에서'라는 연관성을 보여 주며, 파송 여부는 본문이 확정하지 않습니다.
  doctrine_reference: 본문의 어휘적 범위
