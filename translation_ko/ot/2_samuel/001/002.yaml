  source_fidelity: 초안의 ‘사울에게서 나온 진영’은 히브리어의 ‘진영에서, 사울과 함께 있던 곳에서’라는 출처·연관 관계를 어색하게 결합하여, 진영 자체가 사울에게서 나왔다는 뜻으로 읽힐 수 있습니다. 이를 사울이 있던 진영에서 온 것으로 바로잡았습니다. 나머지 핵심 동작과 애도의 표지는 원문에 충실합니다.
