base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/002.yaml
  text: Now on the third day[a], behold, a man came from the camp, from Saul, with his clothes torn and dirt on his head. And when he came to David[c][b], he fell to the ground and bowed down.
  footnotes:
  - marker: a
    text: Or 'from being with Saul' / 'from Saul's side.' The Hebrew expression indicates association with Saul, not necessarily direct dispatch by Saul.
    reason: lexical_alternative
  - marker: b
    text: Literally 'earth on his head,' a conventional sign of grief or mourning.
    reason: cultural_note
  - marker: c
    text: Or 'prostrated himself.' The verb can denote an act of deep respect, submission, or homage depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 셋째 날에, 보십시오, 사울이 있던 진영에서 한 사람이 왔습니다.[a] 그의 옷은 찢어져 있었고 머리에는 흙이 묻어 있었습니다.[b] 그가 다윗에게 오자, 땅에 엎드려 절했습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 사울에게서 직접 파송되었다는 뜻이라기보다, 그가 사울과 함께 있던 곳 또는 사울의 편에서 왔음을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘흙’은 문자적으로 ‘땅/흙’이며, 애통과 애도의 관습적 표지입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘몸을 굽혀 경의를 표했습니다.’ 히브리어 동사는 깊은 경의, 복종 또는 경배의 동작을 가리킬 수 있으며, 여기서는 그 의미를 한정하지 않습니다.
    reason: lexical_alternative
