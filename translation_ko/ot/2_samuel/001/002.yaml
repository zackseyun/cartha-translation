  - 갑자기
  lexicon: WLC / HALOT
  rationale: 서사적 주의를 환기하는 지시어로서의 힘을 살리기 위해 '보라'를 택했습니다.
- source_word: מֵעִם שָׁאוּל
  english_pob_choice: from Saul
  chosen_korean: 사울에게서 나온
  alternatives_korean:
  - 사울로부터
  - 사울의 편에서 온
  - 사울과 함께 있던
  lexicon: WLC / HALOT
  rationale: 단순한 출처가 아니라 사울과의 연관·동행 상태를 나타내므로, '사울에게서 나온'으로 관계성을 드러냈습니다.
- source_word: וּבְגָדָיו קְרֻעִים / וַאֲדָמָה עַל רֹאשׁוֹ
  english_pob_choice: with his clothes torn and dirt on his head
  chosen_korean: 그의 옷은 찢어져 있고 머리에는 흙이 있었습니다
  alternatives_korean:
  - 그의 옷은 찢어져 있고 머리에는 먼지가 있었습니다
  - 그의 옷은 찢어졌고 머리에는 흙을 뒤집어쓰고 있었습니다
  lexicon: WLC / HALOT
  rationale: 애통의 표지인 찢어진 옷과 머리의 흙을 직설적으로 옮기되, '흙을 뒤집어쓰고'처럼 관용을 과장하지 않았습니다.
- source_word: וַיִּשְׁתָּחוּ
