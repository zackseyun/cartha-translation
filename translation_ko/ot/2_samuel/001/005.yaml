  text: וַ/יֹּ֣אמֶר דָּוִ֔ד אֶל הַ/נַּ֖עַר הַ/מַּגִּ֣יד ל֑/וֹ אֵ֣יךְ יָדַ֔עְתָּ כִּי מֵ֥ת שָׁא֖וּל וִ/יהֽוֹנָתָ֥ן בְּנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/005.yaml
  text: Then David said to the young man who told him, “How do you know that Saul and Jonathan his son are dead?”
translation:
  language: ko
  text: 그러자 다윗이 자신에게 보고하던 젊은 사람에게 말했습니다. "사울과 그의 아들 요나단이 죽었다는 것을 어떻게 알았습니까?"
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서사 진행을 한국어에서는 ‘그러자’로 자연스럽게 살리면서, 뒤의 발화 동사를 평서체로 연결했습니다.
- source_word: הַנַּעַר
  english_pob_choice: the young man
  chosen_korean: 젊은 사람
  alternatives_korean:
  - 젊은 청년
  - 소년
  - 종
  lexicon: HALOT
  rationale: 이 문맥의 հաղորդ자/전령은 전투 소식을 전하는 인물로, ‘소년’보다 나이감이 덜 어리게 느껴지는 ‘젊은 사람’이 가장 무난합니다.
- source_word: הַמַּגִּיד לוֹ
  english_pob_choice: who told him
  chosen_korean: 자신에게 보고하던
  alternatives_korean:
  - 그에게 말하던
  - 그에게 알려 주던
  - 그에게 보고하던
  lexicon: HALOT
  rationale: 분사적 수식은 단순한 ‘말한 사람’보다 ‘보고하던 사람’으로 옮겨, 다윗에게 전투 소식을 전달하는 기능을 드러냈습니다.
- source_word: יָדַעְתָּ כִּי ...
  english_pob_choice: How do you know that ...
  chosen_korean: '...라는 것을 어떻게 알았습니까'
  alternatives_korean:
  - '...라고 어떻게 알았습니까'
  - '...라는 사실을 어떻게 아셨습니까'
  - 어떻게 ...인 줄 알았습니까
  lexicon: HALOT
  rationale: 직접화법의 질문형을 한국어에서 자연스러운 ‘-라는 것을 어떻게 알았습니까’로 옮겨, 지식의 근거를 묻는 의미를 분명히 했습니다.
theological_decisions:
- issue: 사울과 요나단의 죽음에 대한 다윗의 질문을 직접 인용문 안에서 어떻게 처리할지
  chosen_reading: 직접 인용을 유지해 다윗의 반응이 추상적 요약이 아니라 실제 질문으로 들리게 했습니다.
  alternative_readings:
  - 간접화법으로 풀어 쓸 수 있음
  - 질문을 서술문으로 완화할 수 있음
  rationale: 본문은 다윗의 실제 발화를 기록하므로, 질문 형식을 보존하는 것이 서사의 긴장과 사실성을 가장 잘 전달합니다.
  doctrine_reference: 서사 본문 직역 원칙
