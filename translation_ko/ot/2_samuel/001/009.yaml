id: 2SA.1.9
reference: 2 Samuel 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י עֲמָד נָ֤א עָלַ/י֙ וּ/מֹ֣תְתֵ֔/נִי כִּ֥י אֲחָזַ֖/נִי הַ/שָּׁבָ֑ץ כִּֽי כָל ע֥וֹד נַפְשִׁ֖/י בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/009.yaml
  text: And he said to me[a], ‘Please stand over me and put me to death, for anguish has seized me[b], though my life is still in me.’
  footnotes:
  - marker: a
    text: Or 'for cramps/convulsions have seized me'; the Hebrew term translated 'anguish' is rare and its precise sense is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'for all my life/soul is still in me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 제게 말했습니다[a]. “부탁하니, 내 위에 서서 나를 죽여 주십시오. 고통이 나를 사로잡았으나[b], 아직 내 생명이 내 안에 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고통이 나를 사로잡았다’로 볼 수 있습니다. 히브리어 표현은 희귀하여 정확한 뜻이 분명하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 생명/혼이 아직 내 안에 있다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  english_pob_choice: And he said to me
  chosen_korean: 그가 제게 말했습니다
  alternatives_korean:
  - 그리고 그는 제게 말했습니다
  - 그가 나에게 말했습니다
  lexicon: WLC
  rationale: 서사 전개를 자연스럽게 살리면서 גם 에 해당하는 단순 연결을 과도하게 드러내지 않는 현대 한국어로 옮겼습니다.
- source_word: עֲמָד נָא עָלַי
  english_pob_choice: Please stand over me
  chosen_korean: 부탁하니, 내 위에 서서
  alternatives_korean:
  - 제발 제 곁에 서서
  - 부디 내 곁에 서서
  lexicon: HALOT
  rationale: עָמַד과 עַל의 결합은 부상자를 내려다보며 위에 서는 장면을 가리키므로 ‘내 위에 서서’로 직접 반영했습니다. נָא는 공손한 간청으로 ‘부탁하니’로 옮겼습니다.
- source_word: וּמֹתְתֵנִי
  english_pob_choice: and put me to death
  chosen_korean: 나를 죽여 주십시오
  alternatives_korean:
  - 나를 죽여 주십시오
  - 나를 사형에 처해 주십시오
  lexicon: HALOT
  rationale: 전투 상황에서의 직접적 살해 요청이므로 우회하지 않고 본뜻을 살렸습니다. 한국어에서는 ‘죽여 주십시오’가 가장 자연스럽고, 공손체가 요청의 형식을 잘 드러냅니다.
- source_word: הַשָּׁבָץ
  english_pob_choice: anguish
  chosen_korean: 고통
  alternatives_korean:
  - 고뇌
  - 경련
  - 경련성 고통
  lexicon: HALOT
  rationale: 히브리어가 희귀하고 정확한 뜻이 불확실하므로 과도한 특정화를 피했습니다. 본문 맥락상 심한 고통을 가리키는 넓은 표현으로 처리했습니다.
- source_word: כִּי כָל עוֹד נַפְשִׁי בִּי
  english_pob_choice: though my life is still in me
  chosen_korean: 아직 내 생명이 내 안에 있습니다
  alternatives_korean:
  - 내 생명이 아직 내 안에 있습니다
  - 아직도 나는 살아 있습니다
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 영혼의 기술적 의미보다 생명 자체를 가리키므로 ‘생명’으로 옮겼습니다. ‘내 안에 있습니다’는 히브리어의 존재 표현을 비교적 가깝게 반영합니다.
theological_decisions:
- issue: 희귀어 הַשָּׁבָץ의 의미 범위
  chosen_reading: 의미를 단정하지 않고 문맥상 ‘고통’으로 번역했습니다.
  alternative_readings:
  - 경련
  - 발작
  - 장중경련
  rationale: 본문은 사울의 상태를 묘사하지만 용어 자체가 희귀하여 의학적으로 확정하기 어렵습니다. 따라서 독자가 문맥을 이해할 수 있는 넓은 표현을 택했습니다.
  doctrine_reference: '번역 원칙: 불확실한 어휘는 과도한 확정 대신 문맥 우선'
- issue: 직접적인 살해 요청의 화법
  chosen_reading: ‘나를 죽여 주십시오’로 공손체를 유지하되 요청의 직설성을 보존했습니다.
  alternative_readings:
  - 나를 죽여라
  - 내 목숨을 끊어 주십시오
  rationale: 히브리어 원문은 정중한 간청이면서도 매우 직접적인 요청입니다. 한국어 합쇼체에서 그 긴장을 살리기 위해 공손한 요청형을 사용했습니다.
  doctrine_reference: 화법 일치와 서사적 사실성
