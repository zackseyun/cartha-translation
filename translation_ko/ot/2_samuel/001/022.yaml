language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/דַּ֣ם חֲלָלִ֗ים מֵ/חֵ֨לֶב֙ גִּבּוֹרִ֔ים קֶ֚שֶׁת יְה֣וֹנָתָ֔ן לֹ֥א נָשׂ֖וֹג אָח֑וֹר וְ/חֶ֣רֶב שָׁא֔וּל לֹ֥א תָשׁ֖וּב רֵיקָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/022.yaml
  text: From the blood of the slain[a], from the fat of the mighty, Jonathan’s bow did not turn back[b], and Saul’s sword did not return empty.
  footnotes:
  - marker: a
    text: Or 'did not draw back.' The Hebrew verb can convey withdrawing or turning back.
    reason: lexical_alternative
  - marker: b
    text: '''Fat'' may also suggest the choicest or richest part, intensifying the image of battlefield success.'
    reason: lexical_alternative
translation:
  language: ko
  text: 피살자들의 피에서, 용사들의 기름기에서 요나단의 활은 물러서지 않았고, 사울의 칼은 헛되이 돌아오지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물러서지 않았다’는 여기서 ‘뒤로 물러나다/철수하다’의 뜻을 살린 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기름기’는 히브리어 חֵלֶב의 문자적 의미를 따른 것으로, 문맥상 ‘가장 좋은 부분’의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם חֲלָלִים
  english_pob_choice: From the blood of the slain
  chosen_korean: 피살자들의 피에서
  alternatives_korean:
  - 죽임당한 자들의 피에서
  - 전사자들의 피에서
  lexicon: HALOT
  rationale: מִן + דָּם은 출처/분리 표현으로 보고, חֲלָלִים은 전투에서 죽은 자들을 가리키므로 ‘피살자들의 피’가 원문의 전투적 이미지를 가장 직접적으로 드러냅니다.
- source_word: מֵחֵלֶב גִּבּוֹרִים
  english_pob_choice: from the fat of the mighty
  chosen_korean: 용사들의 기름기에서
  alternatives_korean:
  - 용사들의 지방에서
  - 용사들의 가장 좋은 부분에서
  lexicon: HALOT
  rationale: חֵלֶב의 문자적 의미를 살리되 한국어에서 자연스럽게 읽히도록 ‘기름기’로 옮겨, 전투의 치열함과 신체적 생생함을 유지했습니다.
- source_word: קֶשֶׁת יְהוֹנָתָן
  english_pob_choice: Jonathan’s bow
  chosen_korean: 요나단의 활
  alternatives_korean:
  - 요나단의 활시위
  - 요나단의 활
  lexicon: HALOT
  rationale: 구문 관계를 한국어 소유격으로 자연스럽게 풀어, 시적 병행을 보존했습니다.
- source_word: לֹא נָשׂוֹג אָחוֹר
  english_pob_choice: did not turn back
  chosen_korean: 물러서지 않았고
  alternatives_korean:
  - 뒤로 물러서지 않았고
  - 되돌아가지 않았고
  lexicon: HALOT
  rationale: נשׂוג 뒤의 אָחוֹר는 ‘뒤로/물러서다’의 뉘앙스를 가지므로, 무기가 겁먹고 물러나는 듯한 의인화 표현을 살려 ‘물러서지 않았다’로 옮겼습니다.
- source_word: לֹא תָשׁוּב רֵיקָם
  english_pob_choice: did not return empty
  chosen_korean: 헛되이 돌아오지 않았습니다
  alternatives_korean:
  - 빈손으로 돌아오지 않았습니다
  - 아무 성과 없이 돌아오지 않았습니다
  lexicon: HALOT
  rationale: רֵיקָם은 ‘헛되이/빈손으로’의 의미가 가능하나, 칼이 전과 없이 돌아오지 않았다는 전투적 함의를 한국어에서 자연스럽게 전달하기 위해 ‘헛되이’로 처리했습니다.
theological_decisions:
- issue: 전투 무기 의인화의 유지
  chosen_reading: 활과 칼이 스스로 ‘물러서지’ 않고 ‘돌아오지’ 않는 것으로 의인화된 시적 표현을 유지했습니다.
  alternative_readings:
  - 무기가 실제로 움직였다는 문자주의적 읽기
  - 단순히 전투 성과를 서술하는 비의인화 읽기
  rationale: 히브리 시의 수사적 과장과 병행 구조를 살리기 위해, 무기의 능동적 실패/성공을 그대로 드러내는 표현을 유지하는 것이 원문 의미에 더 가깝습니다.
  doctrine_reference: 시적 수사와 문학적 의인화의 보존
- issue: ‘기름기’ 표현의 직설성
  chosen_reading: חֵלֶב을 윤색하지 않고 물질적 이미지로 남겼습니다.
  alternative_readings:
  - ‘가장 좋은 부분’으로 완화
  - ‘비옥함’ 같은 비유로 전환
  rationale: 원문은 전장의 생생한 승리 이미지를 통해 찬가를 구성하므로, 지나치게 관용적으로 바꾸기보다 육체성과 승리를 동시에 느끼게 하는 번역이 필요합니다.
  doctrine_reference: 시가서/역사서의 강한 시각적 이미지 보존
