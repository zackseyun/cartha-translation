base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/026.yaml
  text: I am distressed over you[a], my brother Jonathan; you were very pleasant to me. Your love to me was wonderful, surpassing the love of women.
  footnotes:
  - marker: a
    text: Or 'more than the love of women' or 'surpassing women's love.' The Hebrew comparison is poetic and does not itself specify the exact nature of the comparison.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 당신 때문에 괴롭습니다, 내 형 요나단이여. 당신은 나에게 매우 좋았습니다. 당신의 사랑은 내게 놀라웠습니다—여자들의 사랑보다 더 뛰어났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 비교는 시적 표현이어서, ‘여자들의 사랑’이 정확히 무엇을 가리키는지 본문이 직접 규정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי עָלֶיךָ
  english_pob_choice: I am distressed over you
  chosen_korean: 나는 당신 때문에 괴롭습니다
  alternatives_korean:
  - 나는 당신 때문에 고통스럽습니다
  - 나는 당신 때문에 괴로워합니다
  - 나는 당신을 두고 마음이 아픕니다
  lexicon: HALOT
  rationale: 문맥은 애가의 정서이므로 개인적 고통·괴로움을 나타내는 표현이 필요하며, 현대 합쇼체에서 자연스럽고 직접적인 ‘괴롭습니다’가 원문의 긴장감을 잘 살립니다.
- source_word: אָחִי
  english_pob_choice: my brother
  chosen_korean: 내 형
  alternatives_korean:
  - 내 형제
  - 내 동생
  - 내 형님
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘내 형/형제’이므로 기본 의미를 살리되, 한국어에서는 친밀한 호칭으로 ‘내 형’을 택했습니다. 다만 관계를 혈연으로만 좁히지 않도록 ‘형제’도 가능하지만, 본문은 친밀한 애가 호칭을 유지하는 것이 핵심입니다.
- source_word: נָעַמְתָּ לִּי מְאֹד
  english_pob_choice: you were very pleasant to me
  chosen_korean: 당신은 나에게 매우 좋았습니다
  alternatives_korean:
  - 당신은 내게 매우 즐거웠습니다
  - 당신은 내게 매우 사랑스러웠습니다
  - 당신은 내게 매우 기뻤습니다
  lexicon: HALOT
  rationale: ‘pleasant’의 기본 의미는 ‘좋다/즐겁다/기쁘다’의 범위에 있으므로, 여기서는 현대 한국어에서 과도한 낭만성을 피하면서도 친밀한 호의를 드러내는 ‘매우 좋았습니다’를 선택했습니다.
- source_word: נִפְלְאָתָה אַהֲבָתְךָ לִי מֵאַהֲבַת נָשִׁים
  english_pob_choice: Your love to me was wonderful, surpassing the love of women
  chosen_korean: 당신의 사랑은 내게 놀라웠습니다—여자들의 사랑보다 더 뛰어났습니다.
  alternatives_korean:
  - 당신의 사랑은 내게 놀라웠습니다—여자들의 사랑을 뛰어넘었습니다.
  - 당신의 사랑은 내게 놀라웠습니다—여자들의 사랑보다 더 놀라웠습니다.
  lexicon: HALOT
  rationale: ‘wonderful’는 놀라운/경이로운 의미의 형용적 평가로 보아 ‘놀라웠습니다’로 옮기고, 비교구문은 원문의 시적 비교를 유지하기 위해 ‘여자들의 사랑보다 더 뛰어났습니다’로 직역에 가깝게 처리했습니다. ‘여자들의 사랑’은 해석을 덧씌우지 않고 원문 그대로 보존합니다.
theological_decisions:
- issue: ‘여자들의 사랑’ 비교문의 해석 범위
  chosen_reading: 비교의 정확한 범주를 확정하지 않고, 시적·애가적 비교로 그대로 둡니다.
  alternative_readings:
  - 연애적 사랑보다 더 컸다는 뜻으로 좁히기
  - 여성들이 보이는 일반적 애정보다 더 컸다는 뜻으로 풀기
  - 현대 범주로 재해석하지 않고 긴장을 유지하기
  rationale: 히브리어는 비교의 존재를 말하지만 그 비교가 정확히 무엇을 가리키는지 명시하지 않으므로, 본문이 허용하는 범위를 넘어 범주를 단정하지 않는 것이 source-direct합니다.
  doctrine_reference: Interpretive tension preserved; no category over-specification.
