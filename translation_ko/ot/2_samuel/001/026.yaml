source:
  edition: WLC
  text: צַר לִ֣/י עָלֶ֗י/ךָ אָחִ/י֙ יְה֣וֹנָתָ֔ן נָעַ֥מְתָּ לִּ֖/י מְאֹ֑ד נִפְלְאַ֤תָה אַהֲבָֽתְ/ךָ֙ לִ֔/י מֵ/אַהֲבַ֖ת נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/026.yaml
  text: I am distressed over you[a], my brother Jonathan; you were very pleasant to me. Your love to me was wonderful, surpassing the love of women.
  footnotes:
  - marker: a
    text: Or 'more than the love of women' or 'surpassing women's love.' The Hebrew comparison is poetic and does not itself specify the exact nature of the comparison.
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 형제 요나단이여, 나는 당신을 두고 괴롭습니다. 당신은 내게 매우 기쁨이었습니다. 당신의 사랑은 내게 여자들의 사랑보다 더 놀라웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 비교는 시적 표현이어서, ‘여자들의 사랑’이 정확히 무엇을 가리키는지 본문이 직접 규정하지 않습니다. 또는 ‘여자들의 사랑을 뛰어넘을 만큼 놀라웠습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי עָלֶיךָ
  english_pob_choice: I am distressed over you
  chosen_korean: 나는 당신 때문에 괴롭습니다
  alternatives_korean:
  - 나는 당신 때문에 고통스럽습니다
