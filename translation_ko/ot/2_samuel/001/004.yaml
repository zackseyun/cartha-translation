  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֥י/ו דָּוִ֛ד מֶה הָיָ֥ה הַ/דָּבָ֖ר הַגֶּד נָ֣א לִ֑/י וַ֠/יֹּאמֶר אֲשֶׁר נָ֨ס הָ/עָ֜ם מִן הַ/מִּלְחָמָ֗ה וְ/גַם הַרְבֵּ֞ה נָפַ֤ל מִן הָ/עָם֙ וַ/יָּמֻ֔תוּ וְ/גַ֗ם שָׁא֛וּל וִ/יהוֹנָתָ֥ן בְּנ֖/וֹ מֵֽתוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/004.yaml
  text: David said to him[a], “What happened? Please tell me.” He said, “The people fled from the battle, and many of the people also fell and died[c][b]; and Saul and Jonathan his son are also dead.”
  footnotes:
  - marker: a
    text: Or, 'What was the matter?' Literally, 'What was the thing?'
    reason: lexical_alternative
  - marker: b
    text: '''Fell'' is a common Hebrew battle expression for being struck down; the following ''and died'' makes the result explicit.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'Saul and Jonathan his son also died.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 그에게 말했습니다. “무슨 일이 있었습니까?[a] 부디 제게 말해 주십시오.” 그가 말했습니다. “백성이 전투에서 도망쳤고, 백성 가운데 많은 사람이 쓰러져[b] 죽었으며, 사울과 그의 아들 요나단도 죽었습니다.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 일이 무엇이었습니까?’ 또는 ‘무슨 일이었습니까?’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘쓰러지다’는 전투 문맥에서 ‘죽임을 당하다’ 또는 ‘전사하다’를 뜻하는 관용적 표현입니다. 이어지는 ‘죽었으며’가 그 결과를 명시합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 사울과 요나단의 죽음을 완료된 사건으로 보고합니다. 문맥에 따라 ‘죽었습니다’ 대신 ‘죽어 있습니다’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה הָיָה הַדָּבָר
  english_pob_choice: What happened?
  chosen_korean: 무슨 일이 있었습니까?
  alternatives_korean:
  - 무슨 일이었습니까?
  - 무슨 일이 있었는지요?
  lexicon: HALOT
  rationale: 직역하면 ‘무슨 일이/무슨 것이 있었는가’이지만, 문맥상 다윗의 질문은 사건의 경과를 묻는 것이므로 현대 한국어에서는 ‘무슨 일이 있었습니까?’가 자연스럽고 원문의 뜻을 잘 드러냅니다.
- source_word: הַגֶּד נָא לִי
  english_pob_choice: Please tell me
  chosen_korean: 부디 내게 말해 주십시오
  alternatives_korean:
  - 내게 말씀해 주십시오
  - 부디 알려 주십시오
  lexicon: HALOT
  rationale: הגֵּד는 ‘말하다/보고하다’의 명령형이고 נָא는 청유·간청의 뉘앙스를 더하므로, 공손한 요청으로서 ‘부디 내게 말해 주십시오’가 적절합니다.
- source_word: וְגַם הַרְבֵּה נָפַל מִן הָעָם וַיָּמֻתוּ
  english_pob_choice: and many of the people also fell and died
  chosen_korean: 백성 가운데 많은 사람이 쓰러져 죽었으며
  alternatives_korean:
  - 백성 가운데 많은 사람이 쓰러져 죽었고
  - 백성 가운데 많은 사람이 쓰러져 죽었습니다
  lexicon: HALOT
  rationale: נפל은 전투 문맥에서 ‘쓰러지다/엎드러지다’로, 이어지는 וַיָּמֻתוּ가 죽음을 명시하므로 두 동작을 함께 살려 ‘쓰러져 죽었으며’로 옮겼습니다.
- source_word: וְגַם שָׁאוּל וִיהוֹנָתָן בְּנוֹ מֵתוּ
  english_pob_choice: and Saul and Jonathan his son are also dead
  chosen_korean: 사울과 그의 아들 요나단도 죽었습니다
  alternatives_korean:
  - 사울과 그의 아들 요나단도 죽었습니다
  - 사울과 아들 요나단도 죽었습니다
  lexicon: HALOT
  rationale: 마지막 절은 전장의 소식을 결론적으로 전하므로 한국어에서는 현재 상태 표현보다 과거 서술 ‘죽었습니다’가 더 자연스럽습니다. ‘그의 아들’은 히브리어의 בְּנוֹ를 반영해 유지했습니다.
theological_decisions:
- issue: 전투 보고에서 נפל과 죽음의 관계를 어떻게 드러낼지
  chosen_reading: ‘쓰러져 죽었으며’로 번역해 전투 관용구의 이미지와 결과를 함께 드러냈습니다.
  alternative_readings:
  - ‘쓰러져 죽었습니다’
  - ‘전사했습니다’
  rationale: 히브리어는 ‘쓰러지다’와 ‘죽다’를 병렬로 배치해 전투의 참상을 강조합니다. 한국어에서 ‘전사했습니다’는 의미를 요약하지만, 원문의 이중 표현이 주는 충격을 약화시킬 수 있어 피했습니다.
  doctrine_reference: 서사 본문의 문자적 충실성 및 전투 서술의 수사 보존
- issue: 다윗의 요청 문체를 어떤 높임으로 옮길지
  chosen_reading: 다윗의 직접 발화는 높임을 유지한 합쇼체로 옮기고, 보고자인 아말렉 사람의 응답도 서술문 합쇼체로 통일했습니다.
  alternative_readings:
  - 대화체를 더 평서적으로 낮춤
  - 직접발화만 반말로 처리
  rationale: 본문 자체는 고대 서사이므로 현대 한국어 출판문체에서는 인물 대사를 과도하게 구어화하지 않는 것이 적절합니다. 다만 ‘부디’로 간청의 뉘앙스는 살렸습니다.
  doctrine_reference: 한국어 성경 문체의 일관성과 인용 대화의 공손체
