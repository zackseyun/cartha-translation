  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר הַ/נַּ֣עַר הַ/מַּגִּ֣יד ל֗/וֹ נִקְרֹ֤א נִקְרֵ֨יתִי֙ בְּ/הַ֣ר הַ/גִּלְבֹּ֔עַ וְ/הִנֵּ֥ה שָׁא֖וּל נִשְׁעָ֣ן עַל חֲנִית֑/וֹ וְ/הִנֵּ֥ה הָ/רֶ֛כֶב וּ/בַעֲלֵ֥י הַ/פָּרָשִׁ֖ים הִדְבִּקֻֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/006.yaml
  text: And the young man who told him said[a], “I happened to be on Mount Gilboa, and behold, Saul was leaning on his spear, and behold[c][b], the chariots and the horsemen were closing in on him.”
  footnotes:
  - marker: a
    text: Or “I chanced to be on Mount Gilboa.” The Hebrew idiom intensifies the idea of accidental presence.
    reason: lexical_alternative
  - marker: b
    text: Or “the chariotry and the riders” or “the chariots and the cavalry.”
    reason: lexical_alternative
  - marker: c
    text: Or “had overtaken him” / “were pressing hard after him.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그 젊은이가 그에게 말했습니다[a]. 「내가 우연히 길보아 산에 있었습니다. 그런데 보십시오[c][b], 사울이 자기 창에 기대어 있었고, 마차들과 기병들이 그를 바짝 뒤쫓고 있었습니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 길보아 산에 우연히 있었습니다.” 히브리어 관용구는 우발적 상황을 강하게 강조합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “마차군과 기병들” 혹은 “마차들과 기병대”입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그를 따라잡고 있었습니다” / “그를 바짝 추격하고 있었습니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַנַּעַר הַמַּגִּיד לוֹ
  english_pob_choice: the young man who told him
  chosen_korean: 그 젊은이가 그에게 말했습니다
  alternatives_korean:
  - 그 소년이 그에게 말했습니다
  - 그 종이 그에게 말했습니다
  lexicon: HALOT
  rationale: נַעַר는 여기서 신분보다 나이를 드러내는 ‘젊은이’가 자연스럽고, מַגִּיד לוֹ는 ‘그에게 말한/알린’ 사람을 지시하므로 간결하게 옮겼습니다.
- source_word: נִקְרֹא נִקְרֵיתִי
  english_pob_choice: I happened to be
  chosen_korean: 내가 우연히 길보아 산에 있었습니다
  alternatives_korean:
  - 내가 길보아 산에 우연히 가 있었습니다
  - 내가 길보아 산에 있던 차였습니다
  lexicon: HALOT
  rationale: 부정과거의 ‘우연히 마침 거기 있게 되다’라는 관용을 한국어에서 ‘우연히 … 있었습니다’로 옮겨, 단순 위치보다 우발적 상황을 살렸습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 그런데 보십시오
  alternatives_korean:
  - 보십시오
  - 그리고 보니
  lexicon: HALOT
  rationale: 장면 전환과 주목을 끄는 히브리어 הִנֵּה의 담화 표지를 한국어에서 ‘그런데 보십시오’로 살려 서술의 긴박함을 유지했습니다.
- source_word: בַּעֲלֵי הַפָּרָשִׁים
  english_pob_choice: the horsemen
  chosen_korean: 기병들이
  alternatives_korean:
  - 말 탄 자들이
  - 마병들이
  lexicon: HALOT
  rationale: 직역형보다 현대 독자가 즉시 알아듣는 군사 용어 ‘기병들’을 택했으며, 본문 문맥의 추격 군세를 잘 드러냅니다.
- source_word: הִדְבִּקֻהוּ
  english_pob_choice: were closing in on him
  chosen_korean: 그를 바짝 뒤쫓고 있었습니다
  alternatives_korean:
  - 그를 바짝 따라잡고 있었습니다
  - 그를 바짝 추격하고 있었습니다
  lexicon: HALOT
  rationale: 완료된 체포보다 진행 중인 압박을 나타내므로, ‘바짝 뒤쫓다’로 긴박한 추격감을 살렸습니다.
theological_decisions:
- issue: 장면 전환과 증언의 생동감
  chosen_reading: ‘그런데 보십시오’로 הִנֵּה를 옮겨 목격담의 긴박함과 시각적 강조를 유지했습니다.
  alternative_readings:
  - 단순히 ‘보십시오’로 평탄화
  - ‘그리고 보니’로 완화
  rationale: 이 절은 전투 현장 목격 진술의 연속이므로, 담화 표지를 약화하지 않고 독자가 현장성을 느끼도록 하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 서사 본문 해석 원칙
- issue: 추격의 미완성성
  chosen_reading: ‘뒤쫓고 있었습니다’로 הִדְבִּקֻהוּ의 진행 중 압박을 반영했습니다.
  alternative_readings:
  - ‘그를 따라잡았습니다’
  - ‘그를 붙잡았습니다’
  rationale: 히브리어는 도착/완료보다 접근·압박의 동작을 강조하며, 이후 문맥과도 맞게 아직 결말에 이르지 않은 상황을 드러냅니다.
  doctrine_reference: 서사적 시제·상(aspect) 반영
