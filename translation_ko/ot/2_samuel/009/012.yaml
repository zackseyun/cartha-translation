base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/012.yaml
  text: Mephibosheth had a young son[a], and his name was Mica[b]. And all who lived in the house of Ziba were servants to Mephibosheth.
  footnotes:
  - marker: a
    text: Or, 'all the household of Ziba were servants to Mephibosheth.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term for 'servants' can also mean 'slaves,' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 므비보셋에게는 어린 아들이 있었는데 그의 이름은 미가였습니다. 또 사환 집안에 속한 모든 사람은 므비보셋을 섬기는 종들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시바의 온 집안이 므비보셋을 섬기는 종들이었습니다.’
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘종들’은 문맥에 따라 ‘노예들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן קָטָן
  english_pob_choice: a young son
  chosen_korean: 어린 아들
  alternatives_korean:
  - 작은 아들
  - 어린 아들 하나
  lexicon: HALOT
  rationale: קָטָן은 여기서 크기보다 연령의 어림을 가리키므로, 한국어에서는 자연스럽고 정확한 ‘어린 아들’이 적절합니다.
- source_word: וּשְׁמוֹ מִיכָא
  english_pob_choice: and his name was Mica
  chosen_korean: 그의 이름은 미가였습니다
  alternatives_korean:
  - 이름은 미가였습니다
  - 그리고 그의 이름은 미가였습니다
  lexicon: HALOT
  rationale: 히브리어의 이름 소개 절을 그대로 살리되, 한국어 문장 흐름에 맞게 ‘그의 이름은 …였습니다’로 옮겼습니다.
- source_word: מוֹשַׁב בֵּית צִיבָא
  english_pob_choice: all who lived in the house of Ziba
  chosen_korean: 사환 집안에 속한 모든 사람
  alternatives_korean:
  - 시바의 집에 살던 모든 사람
  - 시바의 집안 식구 모두
  lexicon: HALOT
  rationale: מוֹשַׁב은 단순한 건물보다 거주 집단을 가리키므로, ‘집안에 속한’으로 공동체적 거주자를 드러냈습니다.
- source_word: עֲבָדִים
  english_pob_choice: servants
  chosen_korean: 종들이었습니다
  alternatives_korean:
  - 종이었습니다
  - 하인들이었습니다
  - 노예들이었습니다
  lexicon: HALOT
  rationale: 문맥상 예속 신분을 강조하기보다 메피보셋에게 종속된 봉사 관계를 나타내므로 기본어 ‘종’이 적절합니다.
theological_decisions:
- issue: 히브리어 관계사/소유 구문의 자연스러운 한국어 처리
  chosen_reading: ‘므비보셋에게는 … 있었는데’로 시작해 소유·존재 구문을 한국어 서술로 풀었습니다.
  alternative_readings:
  - ‘므비보셋에게 어린 아들이 있었고’
  - ‘므비보셋에게 어린 아들이 있었습니다’
  rationale: 본문의 ל-소유 구문을 직역만 하지 않고, 한국어 서사체에서 자연스럽게 읽히는 존재 서술로 옮겼습니다.
  doctrine_reference: 문법·서사 전달
