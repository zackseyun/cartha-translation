source:
  edition: WLC
  text: וְ/עָבַ֣דְתָּ לּ֣/וֹ אֶֽת הָ/אֲדָמָ֡ה אַתָּה֩ וּ/בָנֶ֨י/ךָ וַ/עֲבָדֶ֜י/ךָ וְ/הֵבֵ֗אתָ וְ/הָיָ֨ה לְ/בֶן אֲדֹנֶ֤י/ךָ לֶּ֨חֶם֙ וַ/אֲכָל֔/וֹ וּ/מְפִיבֹ֨שֶׁת֙ בֶּן אֲדֹנֶ֔י/ךָ יֹאכַ֥ל תָּמִ֛יד לֶ֖חֶם עַל שֻׁלְחָנִ֑/י וּ/לְ/צִיבָ֗א חֲמִשָּׁ֥ה עָשָׂ֛ר בָּנִ֖ים וְ/עֶשְׂרִ֥ים עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/010.yaml
  text: You and your sons and your slaves shall work the land for him[a], and you shall bring in the produce, and it shall be bread for your master's son, and he shall eat it. But Mephibosheth, your master's son, shall always eat bread at my table. Now Ziba had fifteen sons and twenty slaves.
  footnotes:
  - marker: a
    text: Hebrew 'bread' can also mean 'food' or 'provisions' in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 너와 네 아들들과 네 종들은 그를 위해 그 땅을 경작해야 하며, 너는 그 소산을 가져와야 합니다. 그것이 네 주인의 아들에게 빵[a]이 되어, 그가 그것을 먹을 것입니다. 그러나 네 주인의 아들 므비보셋은 항상 내 식탁에서 빵을 먹을 것입니다. 이제 시바에게는 아들 열다섯 명과 종 스무 명이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘빵’은 문맥에 따라 ‘음식’ 또는 ‘양식’의 뜻으로도 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַדְתָּ לּוֹ אֶת הָאֲדָמָה
  english_pob_choice: shall work the land for him
  chosen_korean: 그 땅을 그를 위해 경작해야 하며
  alternatives_korean:
  - 그를 위해 그 땅을 일구어야 하며
  - 그를 위해 그 땅을 농사짓게 해야 하며
  lexicon: HALOT
  rationale: עבד가 여기서는 추상적 ‘섬김’이 아니라 특정한 땅에 대한 농업 노동을 가리키므로, 한국어에서는 ‘경작하다’로 구체성을 살렸습니다.
- source_word: וַעֲבָדֶיךָ / וְעֶשְׂרִים עֲבָדִים
  english_pob_choice: your slaves / twenty slaves
  chosen_korean: 네 종들 / 종 스무 명
  alternatives_korean:
  - 네 종들 / 종 스무 명
  - 네 하인들 / 하인 스무 명
  lexicon: HALOT
  rationale: 이 문맥의 עֲבָדִים는 가사노동에 속한 종속 인력을 가리키므로, 프로젝트 기본어인 ‘종’을 유지하되, 본문은 호칭상 ‘네 종들’로 자연스럽게 옮겼습니다.
- source_word: וְהֵבֵאתָ
  english_pob_choice: you shall bring in the produce
  chosen_korean: 너는 그 소산을 가져와야 합니다
  alternatives_korean:
  - 너는 그것을 가져와야 합니다
  - 너는 그 수확물을 들여와야 합니다
  lexicon: HALOT
  rationale: 동사 자체는 ‘가져오다’이지만 농경 문맥에서 목적어가 생략되어 있으므로, POB의 해석을 따라 ‘소산’으로 보충해 뜻을 분명하게 했습니다.
- source_word: לֶחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 양식
  lexicon: HALOT
  rationale: 반복되는 לֶחֶם을 한국어에서 가장 직접적으로 대응하는 일상어 ‘빵’으로 옮겨, 같은 어휘의 반복과 대비를 살렸습니다.
theological_decisions:
- issue: 시바의 신분을 나타내는 עֲבָדִים의 번역
  chosen_reading: ‘종’으로 옮겨, 가사에 예속된 신분 관계를 분명히 드러냈습니다.
  alternative_readings:
  - ‘하인’으로 완화해 옮길 수 있습니다.
  - ‘일꾼’으로 중성화할 수 있습니다.
  rationale: 본문은 단순 고용 관계보다 주인의 소유 아래 있는 종속 노동력을 전제하므로, ‘종’이 사회사적 긴장을 더 정확히 드러냅니다.
  doctrine_reference: '프로젝트 용례 지침: δοῦλος / עבד의 bonded-status 맥락에서 ‘종’ 기본 사용'
