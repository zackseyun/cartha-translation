  yaml_path: translation/ot/2_samuel/009/002.yaml
  text: Now the house of Saul had a servant whose name was Ziba[a], and they called him to David. And the king said to him, “Are you Ziba?” And he said, “Your servant.”
  footnotes:
  - marker: a
    text: 'Or, more explicitly, “I am your servant.” The Hebrew reply is elliptical: “Your servant.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울의 집에는 시바라는 종이 있었습니다. 그를 다윗에게로 불렀습니다. 왕이 그에게 말했습니다. 「네가 시바냐?」 그가 말했습니다. 「왕의 종입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, 「당신의 종」입니다. 히브리어 응답은 서술어가 생략된 짧은 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבֵית שָׁאוּל
  english_pob_choice: Now the house of Saul had
  chosen_korean: 이제 사울의 집에는 … 있었습니다
  alternatives_korean:
  - 그리고 사울의 집에 … 있었습니다
  - 이제 사울의 집에 속한 … 있었습니다
  lexicon: HALOT
  rationale: 서두의 ו는 새 장면을 여는 연결어로 보고 ‘이제’로 살렸으며, 소유·존재를 나타내는 관용 표현은 한국어에서 자연스럽게 ‘집에는 … 있었습니다’로 옮겼습니다.
- source_word: עֶבֶד
  english_pob_choice: a servant
  chosen_korean: 종
  alternatives_korean:
  - 시종
  - 노예
  lexicon: HALOT
  rationale: 여기서는 사울 집안의 소속 인물이라는 신분이 핵심이므로 ‘종’이 가장 직접적입니다. ‘노예’는 본문이 강조하지 않는 구속 상태를 지나치게 부각할 수 있어 채택하지 않았습니다.
- source_word: וַיִּקְרְאוּ לוֹ אֶל דָּוִד
  english_pob_choice: and they called him to David
  chosen_korean: 사람들이 그를 다윗에게 불러오자
  alternatives_korean:
  - 그를 다윗에게 불렀습니다
  - 그를 다윗 앞으로 불러오자
  lexicon: HALOT
  rationale: קרא + ל + 목적지는 단순 호출보다 ‘불러오다/불러들이다’가 자연스럽고, 문맥상 왕 앞에 소환되는 상황을 반영했습니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: Your servant
  chosen_korean: 당신의 종입니다
  alternatives_korean:
  - 제 종입니다
  - 당신의 종이옵니다
  - 당신의 종
  lexicon: HALOT
  rationale: 히브리어는 생략적인 응답이지만 한국어에서는 서술형으로 풀어 주어 공손한 자기 지칭이 분명하게 드러나도록 했습니다. ‘당신의 종’만 둘 수도 있으나 출판용 가독성을 위해 ‘입니다’를 보탰습니다.
theological_decisions:
- issue: 왕 앞에서의 응답 형식
  chosen_reading: 시바의 대답은 짧은 자기 소개를 풀어 말해 ‘당신의 종입니다’로 처리했습니다.
  alternative_readings:
  - 직역하여 ‘당신의 종’으로 남김
  - ‘제 종입니다’로 더 현대적으로 정리
  rationale: 본문의 생략성을 보존하는 동시에, 현대 한국어에서는 주어·서술어를 보완해야 의미가 분명해집니다. 왕 앞의 극존칭 상황을 고려해 공손한 공식 응답으로 옮겼습니다.
  doctrine_reference: 서사 번역의 화용론과 인물 간 위계 표현
