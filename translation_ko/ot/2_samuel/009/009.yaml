base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/009.yaml
  text: Then the king called Ziba[a], Saul’s servant, and said to him[c][b], “All that belonged to Saul and to all his house I have given to your master’s son.”
  footnotes:
  - marker: a
    text: Or “Saul’s young man” / “Saul’s attendant” for נַעַר; here it likely denotes a household servant or retainer.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “to all his house,” that is, to all Saul’s household/estate.
    reason: lexical_alternative
  - marker: c
    text: “Your master’s son” refers to Mephibosheth, Saul’s descendant and Ziba’s superior in the household structure.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 왕이 사울의 종 시바를 불러 그에게 말했습니다. 「사울에게 속한 모든 것과 그의 온 집에 속한 모든 것을 내가 네 주인의 아들에게 주었습니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נַעַר는 여기서 ‘젊은이’보다 가문의 종속적 수행원, 곧 궁정 종사자를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘온 집’은 직역상 ‘집 전체’이지만, 여기서는 사울의 가문/가산 전체를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘네 주인의 아들’은 앞서 언급된 므비보셋을 가리키며, 사울 집안 안에서 시바보다 높은 지위에 있는 인물입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרָא ... וַיֹּאמֶר
  english_pob_choice: Then the king called ... and said
  chosen_korean: 그러자 왕이 …를 불러 …에게 말했습니다
  alternatives_korean:
  - 그리고 왕이 …를 불러 …에게 말했습니다
  - 왕이 …를 불러 …에게 말했습니다
  lexicon: WLC narrative waw-consecutive; HALOT
  rationale: 연속 동사를 한국어 서술 흐름에 맞게 ‘그러자’로 옮겨 사건의 진행과 즉시성을 살렸습니다.
- source_word: נַעַר
  english_pob_choice: servant
  chosen_korean: 종
  alternatives_korean:
  - 젊은이
  - 시종
  - 하인
  lexicon: HALOT
  rationale: 여기서는 사울의 궁정/가문에 속한 신분·역할을 가리키므로 ‘젊은이’보다 관계적 지위를 드러내는 ‘종’이 문맥에 더 맞습니다.
- source_word: כֹּל אֲשֶׁר הָיָה לְשָׁאוּל וּלְכָל בֵּיתוֹ
  english_pob_choice: All that belonged to Saul and to all his house
  chosen_korean: 사울에게 속한 모든 것과 그의 온 집에 속한 모든 것
  alternatives_korean:
  - 사울의 모든 소유와 그의 온 집의 모든 것
  - 사울에게 있던 모든 것과 그의 온 집에 속한 모든 것
  lexicon: HALOT
  rationale: ‘לְ/’의 소유 관계를 한국어의 ‘속한’으로 자연스럽게 옮기되, ‘집’을 그대로 살려 히브리어의 표현과 가문/가산의 뉘앙스를 유지했습니다.
- source_word: לְבֶן אֲדֹנֶיךָ
  english_pob_choice: to your master’s son
  chosen_korean: 네 주인의 아들
  alternatives_korean:
  - 네 상전의 아들
  - 네 주군의 아들
  lexicon: HALOT
  rationale: אֲדוֹן은 여기서 신적 호칭이 아니라 사회적 상급자이므로, 현대 한국어에서 가장 분명한 ‘주인’으로 옮겼습니다.
theological_decisions:
- issue: 가문의 소유권을 왕이 ‘주었다’는 선언의 공적 효력
  chosen_reading: 왕의 말은 단순한 의향이 아니라 이미 양도된 상태를 선포하는 공적 선언으로 읽었습니다.
  alternative_readings:
  - 왕이 앞으로 주겠다고 약속하는 말
  - 아직 실행되지 않은 허가 선언
  rationale: 히브리어 완료형 נָתַתִּי와 영어 POB의 present perfect를 반영하여, 현재 효력이 있는 양도를 나타내는 것으로 번역했습니다.
  doctrine_reference: 본문의 서술 시제와 왕권/재산 양도 맥락
