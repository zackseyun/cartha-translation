base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/009.yaml
  text: Then the king called Ziba[a], Saul’s servant, and said to him[c][b], “All that belonged to Saul and to all his house I have given to your master’s son.”
  footnotes:
  - marker: a
    text: Or “Saul’s young man” / “Saul’s attendant” for נַעַר; here it likely denotes a household servant or retainer.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “to all his house,” that is, to all Saul’s household/estate.
    reason: lexical_alternative
  - marker: c
    text: “Your master’s son” refers to Mephibosheth, Saul’s descendant and Ziba’s superior in the household structure.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 왕이 사울의 종[a] 시바를 불러 그에게 말했습니다. 「사울과 그의 온 집[b]에 속했던 모든 것을 내가 네 주인의 아들[c]에게 주었습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נַעַר는 ‘젊은이’라는 뜻도 있지만, 여기서는 가문에 딸린 수행원 또는 종을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 온 집’입니다. 여기서는 사울의 가문과 그에 딸린 재산을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘네 주인의 아들’은 앞서 언급된 므비보셋을 가리키며, 시바에게는 주인의 아들로 불립니다.
    reason: cultural_note
