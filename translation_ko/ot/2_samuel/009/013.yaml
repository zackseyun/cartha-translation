  - 그 까닭은
  lexicon: HALOT
  rationale: 여기서는 앞절의 거주 사실을 왕의 식탁과의 관계로 설명하는 이유절이므로, 한국어에서는 별도의 접속사 없이 문장 흐름으로 자연스럽게 연결했습니다.
- source_word: שֻׁלְחַן הַמֶּלֶךְ
  english_pob_choice: the king’s table
  chosen_korean: 왕의 식탁
