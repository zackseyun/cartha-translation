  lexicon: HALOT
  rationale: 거주 상태를 나타내는 거주/동거의 의미를 이 문맥에서는 자연스러운 한국어 동사인 ‘살다’로 풀어 주는 것이 가장 직접적입니다.
- source_word: כִּי
