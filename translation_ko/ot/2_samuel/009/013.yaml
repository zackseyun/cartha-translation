theological_decisions:
- issue: 왕의 식탁에서 먹는다는 표현의 함의
  chosen_reading: 단순한 식사 장소가 아니라 왕의 지속적 환대와 지위를 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘왕궁에서 식사했다’로 완화
  - ‘궁정에서 먹었다’로 일반화
  rationale: 이 구절은 므비보셋의 신분 회복과 다윗의 은혜를 서술하므로, 관용구의 사회적·신학적 함의를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 언약적 은혜와 왕의 호의
- issue: 불편한 신체 상태의 직설성
  chosen_reading: ‘두 발이 절뚝거리는 사람’으로 본문이 가진 신체적 결함의 직접성을 보존했습니다.
  alternative_readings:
  - ‘장애가 있었습니다’로 일반화
  - ‘몸이 불편했습니다’로 완화
  rationale: 본문은 므비보셋의 실제 신체 상태를 반복해서 강조하므로, 이를 추상화하지 않고 서술해야 합니다.
  doctrine_reference: 본문의 서술적 사실성
