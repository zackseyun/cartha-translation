  - 마길의 아들 암미엘의 집
  - 마길 아들 암미엘의 집
  lexicon: construct phrase / proper noun
  rationale: 히브리어 소유·관계 구문을 그대로 반영해 ‘~의 집’ 구조로 살리고, 인명은 통용되는 음역을 따랐습니다.
- source_word: בְּלוֹ דְבָר
  english_pob_choice: in Lo-debar
  chosen_korean: 로드발에
  alternatives_korean:
  - 로드발에서
  - 로드발에 있는
  lexicon: proper noun / locative phrase
  rationale: 지명 בְּל֥וֹ דְבָר를 고유명사 ‘로드발’로 옮기고, 전치사 בְּ의 장소 의미를 한국어 조사 ‘-에’로 자연스럽게 표시했습니다.
