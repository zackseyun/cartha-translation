  text: The king said to him, “Where is he?” Ziba said to the king, “Look, he is in the house of Machir son of Ammiel, in Lo-debar.”
translation:
  language: ko
  text: 왕이 그에게 말했습니다. “그가 어디 있습니까?” 시바가 왕에게 말했습니다. “보십시오, 그가 로드발에 있는 마길의 아들 암미엘의 집에 있습니다.”[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: “그가”는 히브리어의 대명사 강조를 그대로 살린 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: אֵיפֹה
  english_pob_choice: Where is he?
  chosen_korean: 그가 어디 있습니까?
  alternatives_korean:
  - 그가 어디에 있습니까?
  - 어디에 있습니까?
  lexicon: interrogative adverb
  rationale: 왕이 메피보셋의 위치를 묻는 직접 질문으로, 한국어에서도 자연스러운 위치 질문 형식인 ‘어디 있습니까?’를 사용했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오,
  - 보세요
  lexicon: discourse particle / attention marker
  rationale: 시바의 말머리에서 청자의 주의를 끄는 감탄·지시 기능을 살려, 현대 합쇼체에 맞는 ‘보십시오’로 옮겼습니다.
- source_word: בֵּית מָכִיר בֶּן עַמִּיאֵל
  english_pob_choice: the house of Machir son of Ammiel
  chosen_korean: 마길의 아들 암미엘의 집
