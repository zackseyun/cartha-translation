id: 2SA.9.8
reference: 2 Samuel 9:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁתַּ֕חוּ וַ/יֹּ֖אמֶר מֶ֣ה עַבְדֶּ֑/ךָ כִּ֣י פָנִ֔יתָ אֶל הַ/כֶּ֥לֶב הַ/מֵּ֖ת אֲשֶׁ֥ר כָּמֽוֹ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/008.yaml
  text: And he bowed down and said[a], “What is your servant[b], that you have turned toward a dead dog like me?”
  footnotes:
  - marker: a
    text: Or “paid attention to” / “regarded.” The Hebrew literally says “turned toward,” expressing gracious notice.
    reason: lexical_alternative
  - marker: b
    text: “A dead dog” is an idiom of extreme self-abasement and worthlessness.
    reason: cultural_note
translation:
  language: ko
  text: 그가 엎드려 절하고 말했습니다. 「당신의 종이 무엇이기에, 당신께서 나 같은 죽은 개를 향해 돌보십니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “향하다/돌다”를 말하며, 여기서는 은혜롭게 눈을 돌리거나 주목하신다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: “죽은 개”는 극심한 자기비하와 무가치를 드러내는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  english_pob_choice: bowed down
  chosen_korean: 엎드려 절하고
  alternatives_korean:
  - 절하고
  - 엎드려 절했습니다
  lexicon: HALOT
  rationale: 히트파엘 형태의 שׁחה는 몸을 굽혀 경배하거나 예를 표하는 동작을 가리키므로, 현대 한국어에서는 자연스럽고 경어적 뉘앙스를 살리는 「엎드려 절하고」가 적절합니다.
- source_word: מֶה עַבְדֶּךָ
  english_pob_choice: What is your servant
  chosen_korean: 당신의 종이 무엇이기에
  alternatives_korean:
  - 당신의 종이 누구이기에
  - 제가 무엇이기에
  lexicon: HALOT
  rationale: 히브리어의 직역적 질문 구조를 살리면서도, 한국어에서 어색하지 않게 self-abasement를 드러내는 표현으로 옮겼습니다. 「종」은 이 장면의 궁정적 자기비하에 맞습니다.
- source_word: פָנִיתָ אֶל
  english_pob_choice: you have turned toward
  chosen_korean: 당신께서 … 향해 돌보십니까
  alternatives_korean:
  - 당신께서 … 돌아보십니까
  - 당신께서 … 향하여 주십니까
  lexicon: HALOT
  rationale: 직역상 「향해 돌다」의 이미지를 보존하되, 한국어에서는 은혜로운 주의를 뜻하는 동작으로 자연스럽게 읽히도록 「돌보십니까」를 택했습니다.
- source_word: הַכֶּלֶב הַמֵּת
  english_pob_choice: a dead dog
  chosen_korean: 죽은 개
  alternatives_korean:
  - 죽어 있는 개
  - 시체 같은 개
  lexicon: HALOT
  rationale: 극단적 비천함과 무가치를 드러내는 관용구를 그대로 살리기 위해 직설적으로 옮겼습니다.
theological_decisions:
- issue: 화자의 자기비하 수사 유지
  chosen_reading: 「죽은 개」를 완곡하게 바꾸지 않고 그대로 유지했습니다.
  alternative_readings:
  - 「보잘것없는 사람」
  - 「죽은 개와 같은 저」
  rationale: 이 표현은 메비보셋의 과도한 자기비하를 보여 주는 핵심 수사이므로, 의미를 순화하지 않고 원문의 충격을 유지하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 본문 수사와 인물 특성에 대한 해석
- issue: פנה אל의 의미
  chosen_reading: 문자적 ‘향하다’의 이미지를 살리면서도 은혜로운 주목의 뜻이 드러나도록 번역했습니다.
  alternative_readings:
  - 그쪽을 돌아보십니까
  - 주의를 기울이십니까
  rationale: 히브리어 동작 이미지와 문맥의 호의적 의미를 함께 보존해야 하므로, 단순한 ‘주의를 기울이다’보다 ‘돌보다’를 통해 공손하고 자연스럽게 전달했습니다.
  doctrine_reference: 원문의 서사적·수사적 의미 보존
