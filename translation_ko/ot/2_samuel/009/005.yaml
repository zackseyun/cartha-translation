  text: So King David sent and took him from the house of Machir son of Ammiel[a], from Lo-debar.
  footnotes:
  - marker: a
    text: Or 'sent for him and brought him from the house of Machir son of Ammiel, from Lo-debar.' The Hebrew uses the sequence 'sent' + 'took him,' which can be rendered more idiomatically in English as 'sent for' or 'brought.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗 왕이 사람을 보내어 로데바르에 있는 암미엘의 아들 마길의 집에서 그를 데려왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘다윗 왕이 보내어 로데바르에 있는 암미엘의 아들 마길의 집에서 그를 취했습니다’입니다. 히브리어의 ‘보내다’와 ‘취하다’의 연속을 한국어에서 자연스럽게 옮겨 ‘사람을 보내어 … 데려왔습니다’로 번역했습니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּשְׁלַ֖ח
  english_pob_choice: sent
  chosen_korean: 사람을 보내어
  alternatives_korean:
