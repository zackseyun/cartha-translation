  - 그를 데려갔습니다
  lexicon: HALOT
  rationale: 문맥상 다윗 앞이나 그에게로 이동시키는 의미이므로, 단순한 ‘취하다’보다 한국어에서 자연스럽고 의미를 분명히 하는 ‘데려왔습니다’를 택했습니다.
- source_word: מִבֵּית מָכִיר בֶּן עַמִּיאֵל
  english_pob_choice: from the house of Machir son of Ammiel
  chosen_korean: 마길의 집에서 — 암미엘의 아들 —
  alternatives_korean:
  - 마길의 집에서
  - 마길, 암미엘의 아들의 집에서
  lexicon: HALOT
  rationale: ‘בית’는 단순한 건물보다 ‘집/가문/가정’을 가리킬 수 있으므로, 본문 구조를 살리면서 인물 관계를 분명히 하도록 괄호적 삽입으로 ‘암미엘의 아들’을 덧붙였습니다.
- source_word: מִלּ֥וֹ דְבָֽר
  english_pob_choice: from Lo-debar
  chosen_korean: 로데바르
  alternatives_korean:
