  - 보내어 불렀습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘보내다’ 동사를 자연스러운 한국어 서술로 옮기되, 뒤의 ‘데려왔습니다’와 결합될 때 요청·소환의 뉘앙스가 드러나도록 했습니다.
- source_word: וַיִּקָּחֵהוּ
