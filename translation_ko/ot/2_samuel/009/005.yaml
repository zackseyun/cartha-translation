  - 로데바르에서
  lexicon: HALOT
  rationale: 지명으로 보아 음역을 택했고, 히브리어의 연결 형태를 반영해 현대 한국어 표기상 하나의 지명으로 처리했습니다.
theological_decisions:
- issue: 동사 연쇄 ‘보내다’ + ‘데려오다’의 표현 방식
  chosen_reading: 왕이 직접 움직였다기보다, 사람을 보내어 대상을 불러오게 하고 실제로 그를 데려오는 서술로 읽었습니다.
  alternative_readings:
  - ‘사람을 보내어 그를 불렀습니다’
  - ‘사람을 보내어 그를 데려오게 했습니다’
  rationale: 히브리어의 연속 동사 구조를 살리면서도 한국어에서 자연스러운 왕실 행정 장면으로 전달되도록 했습니다.
  doctrine_reference: 서사 문맥의 행위 주체와 수단을 구분하는 번역 원칙
