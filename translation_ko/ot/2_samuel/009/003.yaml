  rationale: 다윗이 사울 집안의 남은 자에게 베풀려는 행위는 단순한 호의가 아니라 하나님의 성품을 닮은 언약적 자비를 가리키므로, 본문에는 넓으면서도 그 뉘앙스를 담는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
