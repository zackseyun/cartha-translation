  lexicon: HALOT
  rationale: אֶפֶס + עוֹד + אִישׁ의 관용적 질문을 한국어에서 자연스럽게 옮겨, 생존자 여부를 묻는 뜻을 살렸습니다.
- source_word: חֶסֶד אֱלֹהִים
  english_pob_choice: the kindness of God
  chosen_korean: 하나님의 인자하심
  alternatives_korean:
  - 하나님의 친절
  - 하나님의 언약적 신실하심
  lexicon: HALOT
  rationale: חֶסֶד의 핵심인 은혜롭고 언약적인 호의를 살리면서도, 본문 문맥에서 자연스러운 한국어 표현으로 옮겼습니다.
- source_word: נְכֵה רַגְלָיִם
  english_pob_choice: crippled in his feet
  chosen_korean: 발이 불편합니다
  alternatives_korean:
  - 발이 절었습니다
  - 다리에 장애가 있습니다
  lexicon: HALOT
  rationale: 직역적이지만 현대 한국어에서 지나치게 비하적으로 들릴 수 있는 표현을 피하면서, 발의 기능 장애라는 원뜻을 유지했습니다.
theological_decisions:
- issue: חֶסֶד אֱלֹהִים의 신학적 뉘앙스
  chosen_reading: 하나님의 인자하심
  alternative_readings:
