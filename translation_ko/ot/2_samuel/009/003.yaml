  text: Then the king said[a], “Is there still anyone left of the house of Saul, that I may show him the kindness of God?” Ziba said to the king, “There is still a son of Jonathan[b], crippled in his feet.”
  footnotes:
  - marker: a
    text: Or “the covenant loyalty of God” or “God’s kindness.”
    reason: lexical_alternative
  - marker: b
    text: Or “lame in his feet.”
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 말하였습니다. “사울의 집안에 아직도 남은 사람이 있습니까? 내가 그에게 하나님의 인자하심을[a] 베풀고자 합니다.” 시바가 왕에게 말하였습니다. “아직 요나단의 아들이 하나 있는데, 발을 저는 사람입니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님의 언약적 신실하심” 또는 “하나님께서 베푸시는 인자하심.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “발이 불편한 사람.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֶפֶס עוֹד אִישׁ
  english_pob_choice: Is there still anyone left
  chosen_korean: 아직도 남은 사람이 있습니까?
  alternatives_korean:
  - 아직도 아무도 남지 않았습니까?
