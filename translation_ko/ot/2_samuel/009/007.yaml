theological_decisions:
- issue: חֶסֶד의 신학적 뉘앙스
  chosen_reading: ‘인자를 베풀고’로 본문에 두되, 다윗과 요나단의 관계에서 나오는 언약적 호의를 암시하도록 했습니다.
  alternative_readings:
  - 은혜를 베풀고
  - 인애를 베풀고
  - 신실한 사랑을 베풀고
  rationale: 본문은 단순한 호의가 아니라 관계에 근거한 충실한 선행을 말하므로, 한국어에서 성경적 울림이 있으면서도 지나치게 교회화되지 않은 표현을 선택했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
- issue: 사울의 관계 호칭
  chosen_reading: ‘네 할아버지 사울’로 옮겨 왕가의 혈연 관계를 분명히 했습니다.
  alternative_readings:
  - 네 아버지 사울
  - 네 조상 사울
  rationale: 히브리어 אָב는 조상을 가리킬 수 있으나, 문맥상 므비보셋은 요나단의 아들이므로 ‘할아버지’가 오해를 줄이고 서술의 실제 관계를 명확히 드러냅니다.
  doctrine_reference: Source text + English audit trail
