base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/007.yaml
  text: David said to him[a], “Do not be afraid, for I will surely show you kindness for the sake of Jonathan your father, and I will restore to you all the land of Saul your father[c][b], and you shall always eat bread at my table.”
  footnotes:
  - marker: a
    text: Or “steadfast love,” “loyal love,” or “covenant loyalty” for the Hebrew hesed.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “Saul your father”; “father” can mean an ancestor, here Saul is Mephibosheth’s grandfather.
    reason: lexical_alternative
  - marker: c
    text: Hebrew “eat bread at my table,” an idiom for ongoing provision and table fellowship.
    reason: cultural_note
translation:
  language: ko
  text: 다윗이 그에게 말했습니다. 「두려워하지 마라. 내가 네 아버지 요나단을 생각하여 반드시 네게 인자를 베풀고, 네 할아버지 사울의 모든 밭을 네게 되돌려 주겠으며, 너는 항상 내 상에서 떡을 먹을 것이다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용 ‘떡을 먹다’는 계속적인 식사 제공과 식탁 교제를 뜻합니다.
    reason: source_note
  - marker: b
    text: 히브리어의 חֶסֶד는 여기서 단순한 친절을 넘어 관계에 근거한 언약적 호의를 가리킵니다.
    reason: lexical_alternative
