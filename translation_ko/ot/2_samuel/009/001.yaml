source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/כִ֣י יֶשׁ ע֔וֹד אֲשֶׁ֥ר נוֹתַ֖ר לְ/בֵ֣ית שָׁא֑וּל וְ/אֶעֱשֶׂ֤ה עִמּ/וֹ֙ חֶ֔סֶד בַּ/עֲב֖וּר יְהוֹנָתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/001.yaml
  text: David said[a], “Is there still anyone left of the house of Saul, that I may show kindness to him for Jonathan’s sake?”
  footnotes:
  - marker: a
    text: Or 'show loyal love' or 'show covenant faithfulness'; the Hebrew word often denotes faithful, covenantal kindness, not mere sentiment.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 말했습니다. “사울 집에 아직도 남아 있는 사람이 있습니까? 내가 요나단을 생각하여 그에게 은혜를 베풀고자 합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֶסֶד는 단순한 친절보다 언약적 충실함을 띤 호의를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 서술 도입어 אמר는 자연스러운 현대 한국어로 ‘말했습니다’가 가장 직역에 가깝고, 질문문이 뒤따라도 서술 동사는 그대로 유지하는 것이 원문의 서술 방식을 잘 드러냅니다.
- source_word: הֲכִי יֶשׁ עוֹד אֲשֶׁר נוֹתַר
  english_pob_choice: Is there still anyone left
  chosen_korean: 아직도 남아 있는 사람이 있습니까
  alternatives_korean:
  - 아직도 남은 사람이 있습니까
  - 아직도 남아 있는 이가 있습니까
  lexicon: HALOT
  rationale: 존재 질문과 ‘남아 있다’의 의미를 한국어 자연문으로 살렸습니다. ‘아직도’가 הֲכִי + יֶשׁ עוֹד의 지속·확인 뉘앙스를 함께 전달합니다.
- source_word: לְבֵית שָׁאוּל
  english_pob_choice: of the house of Saul
  chosen_korean: 사울 집에
  alternatives_korean:
  - 사울의 집에
  - 사울 집안에
  lexicon: HALOT
  rationale: בַּיִת는 여기서 가문/왕조를 가리키므로 ‘사울 집’이 간결하면서도 혈통·가문 의미를 보존합니다.
- source_word: חֶסֶד
  english_pob_choice: kindness
  chosen_korean: 은혜
  alternatives_korean:
  - 친절
  - 인애
  - 자비
  lexicon: HALOT
  rationale: 이 문맥의 חֶסֶד는 단순한 호의보다 언약적 충실함을 띤 호의를 포함하므로, 한국어에서는 ‘은혜’가 그 호의성과 관계적 깊이를 가장 압축적으로 담아낼 수 있습니다. 다만 전통적 교회어법의 신학적 과잉을 피하기 위해 본문에는 설명을 덧붙이지 않았습니다.
- source_word: בַּעֲבוּר יְהוֹנָתָן
  english_pob_choice: for Jonathan’s sake
  chosen_korean: 요나단을 생각하여
  alternatives_korean:
  - 요나단 때문에
  - 요나단을 위해
  - 요나단의 연고로
  lexicon: HALOT
  rationale: בעבור는 이유·관계에 따른 동기를 나타내므로, 다윗의 행동 동인을 드러내는 ‘요나단을 생각하여’가 한국어로 가장 자연스럽고 관계적 맥락도 잘 전달합니다.
theological_decisions:
- issue: חֶסֶד의 의미를 본문에서 어떻게 드러낼 것인지
  chosen_reading: ‘은혜’를 사용해 다윗의 행동이 단순한 친절이 아니라 관계적·언약적 호의임을 암시합니다.
  alternative_readings:
  - 친절
  - 인애
  - 자비
  rationale: 이 장면은 사울 집에 대한 정치적 보복이 아니라 요나단과의 관계에 근거한 다윗의 선의입니다. 한국어 ‘은혜’는 본문 차원의 관계적 깊이를 살리되, 본문 밖의 교리적 설명을 과도하게 끌어오지 않습니다.
  doctrine_reference: Translation philosophy §§3, 5
