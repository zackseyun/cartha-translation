  naturalness: ‘사울 집에 남아 있는 사람’은 장소 안에 남아 있다는 뜻으로 읽힐 수 있습니다. ‘사울의 집안 사람 가운데 아직 남아 있는 사람’은 현대 표준 한국어에서 가문에 속한 생존자를 명료하고 자연스럽게 표현합니다. 합쇼체도 일관됩니다.
  terminology: ‘은혜를 베풀다’는 한국어 성경 문체에서는 가능하지만, 현대어에서는 신적 은총 또는 일방적 시혜를 연상하기 쉬워 חֶסֶד의 대인적 충실한 호의와 다소 거리가 있습니다. 본문은 ‘호의’, 각주는 ‘충실하고 언약적인 호의’로 처리하는 것이 문맥과 어휘 범위를 더 안정적으로 반영합니다.
