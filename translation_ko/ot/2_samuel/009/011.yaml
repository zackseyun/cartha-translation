- from: 시바가 왕에게 말했습니다. “내 주 왕께서 그의 종에게 명령하시는 모든 것대로 당신의 종이 그렇게 하겠습니다.” 그리고 므피보셋은 왕의 식탁에서 왕의 아들들 가운데 하나처럼 먹고 있었습니다.[a]
  to: 시바가 왕에게 말했습니다. “내 주 왕께서 자신의 종에게 명령하시는 모든 대로 왕의 종이 그대로 하겠습니다.” 그리고 므비보셋은 내 식탁에서 왕의 아들들 가운데 한 사람처럼 먹고 있었습니다.[a]
  rationale: 마소라 본문의 1인칭 소유형을 본문에 보존하되, 화자 전환의 난점을 각주에서 설명했습니다. 왕에 대한 시바의 겸양 표현은 현대 합쇼체에 맞게 ‘왕의 종’으로 다듬었고, 비교 구문의 한국어 자연스러움을 개선했습니다.
