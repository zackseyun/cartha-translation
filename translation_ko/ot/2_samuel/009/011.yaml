source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר צִיבָא֙ אֶל הַ/מֶּ֔לֶךְ כְּ/כֹל֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֲדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ אֶת עַבְדּ֔/וֹ כֵּ֖ן יַעֲשֶׂ֣ה עַבְדֶּ֑/ךָ וּ/מְפִיבֹ֗שֶׁת אֹכֵל֙ עַל שֻׁלְחָנִ֔/י כְּ/אַחַ֖ד מִ/בְּנֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/011.yaml
  text: Ziba said to the king[a], “According to all that my lord the king commands his servant[b], so your servant will do.” And Mephibosheth ate at my table like one of the king’s sons.
  footnotes:
  - marker: a
    text: 'Hebrew: ''my table.'' Some translations render ''the king’s table'' to smooth the shift in person, but the Masoretic Text preserves the first person, likely reflecting David’s perspective.'
    reason: textual_variant
  - marker: b
    text: Or 'at my table'.
    reason: previous_rendering
translation:
  language: ko
  text: 시바가 왕에게 말했습니다. “내 주 왕께서 그의 종에게 명령하시는 모든 것대로 당신의 종이 그렇게 하겠습니다.” 그리고 므피보셋은 왕의 식탁에서 왕의 아들들 가운데 하나처럼 먹고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 식탁’을 뜻합니다. 일부 번역은 화자 전환을 매끄럽게 하기 위해 ‘왕의 식탁’으로 옮기지만, 마소라 본문은 1인칭 형태를 보존합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 대답했습니다
  lexicon: HALOT
  rationale: 서술 도입의 일반적 동사로, 직접화법을 자연스럽게 여는 현대 한국어 표현입니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: 내 주 왕께서
  alternatives_korean:
  - 나의 주 왕께서
  - 내 왕이신 주께서
  lexicon: HALOT
  rationale: 궁정적 존칭을 살리되, 한국어에서는 ‘내 주’가 가장 자연스럽고 공손한 대응이어서 이를 택했습니다.
- source_word: עַבְדּוֹ / עַבְדֶּךָ
  english_pob_choice: his servant / your servant
  chosen_korean: 그의 종 / 당신의 종
  alternatives_korean:
  - 그의 시종 / 당신의 시종
  - 그의 노예 / 당신의 노예
  lexicon: HALOT
  rationale: 여기서는 예속 상태를 강조하기보다 왕실 봉사의 자기지칭이므로 ‘종’이 적절합니다. 다만 상대를 높이는 종속적 자기표현은 유지했습니다.
- source_word: אֹכֵל
  english_pob_choice: was eating
  chosen_korean: 먹고 있었습니다
  alternatives_korean:
  - 먹었습니다
  - 먹고 있었습니다
  lexicon: HALOT
  rationale: 분사형의 지속 상태를 한국어 진행형으로 옮겨, 단순 과거보다 계속된 식탁 참여의 뉘앙스를 반영했습니다.
- source_word: עַל שֻׁלְחָנִי
  english_pob_choice: at my table
  chosen_korean: 왕의 식탁에서
  alternatives_korean:
  - 내 식탁에서
  - 왕의 식탁에서
  lexicon: HALOT
  rationale: MT의 1인칭 어미를 본문에서 직역하면 한국어 독자에게 혼란이 커서, 본문의 왕실 맥락을 드러내는 ‘왕의 식탁’으로 옮기되 주해적 근거는 각주로 남겼습니다.
- source_word: כְּאַחַד מִבְּנֵי הַמֶּלֶךְ
  english_pob_choice: like one of the king’s sons
  chosen_korean: 왕의 아들들 가운데 하나처럼
  alternatives_korean:
  - 왕의 아들들 중 하나처럼
  - 왕의 아들들 가운데 하나같이
  lexicon: HALOT
  rationale: 비교 표지 כְּ를 살려 ‘-처럼’으로 옮기고, 왕실 지위의 동등성 이미지를 자연스럽게 전달했습니다.
theological_decisions:
- issue: ‘my table’의 1인칭 표지 처리
  chosen_reading: 본문의 의미는 다윗의 식탁을 가리키는 것으로 보되, 한국어 본문에서는 문맥상 명시된 왕의 식탁으로 자연화했습니다.
  alternative_readings:
  - ‘내 식탁’으로 직역하여 MT의 1인칭을 보존
  - ‘왕의 식탁’으로 문맥적 명료성을 우선
  rationale: 히브리어는 1인칭 소유격을 보존하지만, 한국어에서는 화자 전환이 불분명해져 오독될 수 있습니다. 문맥적 가독성을 우선하되 원문 정보는 각주로 보존하는 편이 바람직합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
