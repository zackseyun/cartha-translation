source:
  edition: WLC
  text: וַ֠/יָּבֹא מְפִיבֹ֨שֶׁת בֶּן יְהוֹנָתָ֤ן בֶּן שָׁאוּל֙ אֶל דָּוִ֔ד וַ/יִּפֹּ֥ל עַל פָּנָ֖י/ו וַ/יִּשְׁתָּ֑חוּ וַ/יֹּ֤אמֶר דָּוִד֙ מְפִיבֹ֔שֶׁת וַ/יֹּ֖אמֶר הִנֵּ֥ה עַבְדֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/006.yaml
  text: Mephibosheth son of Jonathan, son of Saul, came to David and fell on his face and bowed down. David said, “Mephibosheth,” and he said, “Here is your servant.”
translation:
  language: ko
  text: 므비보셋은 요나단의 아들이요 사울의 손자로서 다윗에게 와서 얼굴을 땅에 대고 엎드려 절했습니다. 다윗이 "므비보셋"이라고 하자, 그가 "보십시오, 당신의 종입니다"라고 대답했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְפִיבֹשֶׁת בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  english_pob_choice: Mephibosheth son of Jonathan, son of Saul
  chosen_korean: 므비보셋은 요나단의 아들이요 사울의 손자
  alternatives_korean:
  - 므비보셋은 요나단의 아들이요 사울의 아들
  - 므비보셋, 요나단의 아들이며 사울의 아들
  lexicon: 고유명사 음역; 친족관계 표현
  rationale: 히브리어 계보 표현은 직역상 ‘사울의 아들’이 아니라 ‘사울의 손자’이므로, 한국어 독자는 관계를 정확히 이해하도록 손자로 풀어 옮겼습니다.
- source_word: וַיִּשְׁתָּחוּ
  english_pob_choice: bowed down
  chosen_korean: 얼굴을 땅에 대고 엎드려 절했습니다
  alternatives_korean:
  - 엎드려 절했습니다
  - 땅에 엎드려 절했습니다
  lexicon: 몸짓/경배 동사
  rationale: 단순한 ‘절하다’보다 원문의 신체적 전면 복종을 드러내기 위해 ‘얼굴을 땅에 대고 엎드려’라는 구체화를 더했습니다.
- source_word: הִנֵּה עַבְדֶּךָ
  english_pob_choice: Here is your servant
  chosen_korean: 보십시오, 당신의 종입니다
  alternatives_korean:
  - 여기 당신의 종입니다
  - 보라, 당신의 종입니다
  lexicon: 지시어 + 종칭 표현
  rationale: הִנֵּה는 청자 주의를 끄는 말로서 자연스러운 현대 한국어에서는 ‘보십시오’가 가장 직접적으로 대응하며, עַבְדֶּךָ는 관계적·자기비하적 선언으로 ‘당신의 종입니다’가 적절합니다.
theological_decisions:
- issue: 다윗 앞에서의 예배적/정중한 몸짓의 강도
  chosen_reading: ‘얼굴을 땅에 대고 엎드려 절했습니다’로 왕 앞의 극도의 복종과 경의를 분명히 드러냈습니다.
  alternative_readings:
  - ‘엎드려 절했습니다’
  - ‘땅에 엎드렸습니다’
  rationale: 히브리어 동사는 단순 인사보다 더 강한 몸의 굴복을 함의하므로, 서사적 긴장과 신분 차이를 약화하지 않도록 보존했습니다.
  doctrine_reference: 서사 본문에서의 왕권 존중과 겸손의 표지
