  lexicon: HALOT
  rationale: 심판으로 임한 치명적 질병이라는 의미를 살리면서, 현대 한국어에서 자연스럽고 이해 가능한 표현으로 옮겼습니다.
- source_word: עֵת מוֹעֵד
  english_pob_choice: until the appointed time
  chosen_korean: 정한 때까지
  alternatives_korean:
  - 정해진 때까지
  - 약정된 때까지
  lexicon: HALOT
  rationale: מוֹעֵד의 ‘정해진/지정된 때’ 의미를 유지하되, 한국어에서 가장 간결하고 자연스러운 시간 종결 표현으로 처리했습니다.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  english_pob_choice: from Dan to Beersheba
  chosen_korean: 단에서부터 브엘세바까지
  alternatives_korean:
  - 단에서 브엘세바까지
  lexicon: HALOT
  rationale: 이스라엘 전체를 가리키는 관용구를 그대로 살려 지리적 범위를 분명히 했습니다.
theological_decisions:
- issue: 야훼의 직접적 심판 행위
  chosen_reading: 야훼께서 … 전염병을 내리셨고
  alternative_readings:
  - 야훼께서 … 전염병을 보내셨고
  - 야훼께서 … 전염병이 일어나게 하셨고
  rationale: 히브리어 동사는 심판의 주체를 직접 야훼에게 귀속합니다. 이를 약화하지 않고, 한국어에서도 직접 행위성을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: עֵת מוֹעֵד의 의미
  chosen_reading: 정한 때
  alternative_readings:
  - 정해진 때
  - 기한
  rationale: 본문의 시간 종결점 의미를 보존하면서, ‘회중의 때’ 같은 비주해적 가능성은 문맥상 덜 적절하므로 본문에는 반영하지 않았습니다.
  doctrine_reference: Translation philosophy §3
