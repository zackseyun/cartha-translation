  rationale: WLC 원문이 יהוה를 쓰고 있으며, 본문은 다윗이 야훼께 직접 말하는 장면이므로 고유명 표기를 유지하는 것이 원문 가시성을 높입니다.
  doctrine_reference: 사본-원문 가시성 및 YHWH 표기 원칙
