base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/017.yaml
  text: Then David said to the LORD, when he saw the angel striking the people, “Look, I have sinned, and I have done wrong; but these sheep—what have they done? Please let your hand be against me and against my father's house.”
translation:
  language: ko
  text: 그때 다윗이 백성을 치는 천사를 보고 야훼께 말했습니다. “보십시오, 제가 죄를 지었고 제가 잘못을 저질렀습니다. 그러나 이 양들은 무엇을 했습니까? 원하오니, 주의 손이 저와 제 아버지의 집에 내리게 하십시오.”[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직접 대상은 히브리어 יהוה입니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 원문이 직접 하나님의 고유명 יהוה를 사용하므로, 본 프로젝트 기본값에 따라 학술적 음역인 야훼를 채택했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게나
  lexicon: deictic particle
  rationale: 다윗의 직접 발화에서 주의를 환기하는 감탄/지시 표현으로, 합쇼체 문맥에 맞게 ‘보십시오’로 옮겼습니다.
- source_word: הַצֹּאן
  english_pob_choice: these sheep
  chosen_korean: 이 양들
  alternatives_korean:
  - 이 양떼
  - 이 양무리
  lexicon: collective noun
  rationale: 문맥상 백성을 양에 비유한 표현을 살려 직역에 가깝게 ‘이 양들’로 유지했습니다.
- source_word: יָדְךָ
  english_pob_choice: your hand
  chosen_korean: 주의 손
  alternatives_korean:
  - 당신의 손
  - 주의 손길
  lexicon: metonymy
  rationale: ‘손’은 행위와 심판의 은유이므로 한국어에서도 은유를 보존해 ‘주의 손’으로 번역했습니다.
theological_decisions:
- issue: 하나님 호칭의 처리
  chosen_reading: 여호와 대신 야훼를 본문에 사용했습니다.
  alternative_readings:
  - 주님
