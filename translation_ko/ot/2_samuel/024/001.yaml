id: 2SA.24.1
reference: 2 Samuel 24:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨סֶף֙ אַף יְהוָ֔ה לַ/חֲר֖וֹת בְּ/יִשְׂרָאֵ֑ל וַ/יָּ֨סֶת אֶת דָּוִ֤ד בָּ/הֶם֙ לֵ/אמֹ֔ר לֵ֛ךְ מְנֵ֥ה אֶת יִשְׂרָאֵ֖ל וְ/אֶת יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/001.yaml
  text: Again the anger of Yahweh burned against Israel[a], and he incited David against them, saying, “Go[b], count Israel and Judah.”
  footnotes:
  - marker: a
    text: 1 Chronicles 21:1 says that Satan stood against Israel and incited David. The main text here follows the plain subject of the Hebrew in 2 Samuel and preserves the tension between the accounts rather than harmonizing them.
    reason: cross_reference
  - marker: b
    text: Or 'number' or 'take a census of.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 분노가 다시 이스라엘을 향해 타올랐고[a], 그가 다윗을 그들에게 맞서도록 충동하시어 말씀하셨습니다. “가서 이스라엘과 유다를 계수하십시오.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 역대상 21:1은 사탄이 이스라엘을 대적하고 다윗을 충동했다고 말합니다. 여기서는 사무엘하 히브리어 본문에서 문맥상 드러나는 주어를 따라, 두 기록 사이의 긴장을 본문에 그대로 남겨 둡니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘수를 세다’, ‘인구 조사를 하다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף אַף יְהוָה לַחֲרוֹת
  english_pob_choice: Again the anger of Yahweh burned
  chosen_korean: 야훼의 분노가 다시 … 타올랐고
  alternatives_korean:
  - 야훼의 노가 다시 … 불탔고
  - 야훼의 진노가 다시 … 타올랐고
  lexicon: HALOT
  rationale: אַף는 문맥상 분노를 뜻하며, 다시(וַיֹּסֶף)와 함께 ‘다시 타올랐다’로 옮기면 반복성과 비유적 열기를 자연스럽게 살릴 수 있습니다.
- source_word: וַיָּסֶת
  english_pob_choice: and he incited
  chosen_korean: 그가 … 충동하여
  alternatives_korean:
  - 그가 … 부추겨
  - 그가 … 선동하여
  lexicon: HALOT
  rationale: סות의 사역적 의미를 살리되, 한국어에서 ‘선동하다’보다 덜 정치적이고 ‘부추기다’보다 문맥상 엄중한 ‘충동하다’가 적절합니다.
- source_word: בָּהֶם
  english_pob_choice: against them
  chosen_korean: 그들에 맞서
  alternatives_korean:
  - 그들에게
  - 그들 가운데
  lexicon: HALOT
  rationale: 전치사+대명사 구는 대상에 대한 적대/대립을 나타내므로, 단순한 ‘그들에게’보다 ‘그들에 맞서’가 영어 POB의 해석을 과도하게 약화하지 않습니다.
- source_word: מְנֵה
  english_pob_choice: count
  chosen_korean: 계수하십시오
  alternatives_korean:
  - 헤아리십시오
  - 조사하십시오
  - 인구를 세십시오
  lexicon: HALOT
  rationale: מנה는 ‘세다/계수하다’의 직접적 의미가 핵심이므로, 명령형에서 공식적이고 간결한 ‘계수하십시오’가 본문을 가장 가깝게 반영합니다.
theological_decisions:
- issue: 야훼의 분노와 다윗을 충동하신 주체를 본문대로 유지할지 여부
  chosen_reading: 본문의 주어를 그대로 따라 야훼의 분노가 다시 타올랐고, 그가 다윗을 충동했다고 옮겼습니다.
  alternative_readings:
  - 사탄이 다윗을 충동했다고 조화시키는 읽기
  - 주어를 불특정한 ‘누군가’로 완화하는 읽기
  rationale: 열왕기상/사무엘의 본문과 역대기의 병행 사이 긴장을 본문에서 지우지 않고, 히브리어의 가장 가까운 주어 연결을 유지했습니다.
  doctrine_reference: 본문 상호 긴장 보존 원칙
