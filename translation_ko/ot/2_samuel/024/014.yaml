id: 2SA.24.14
reference: 2 Samuel 24:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר דָּוִ֛ד אֶל גָּ֖ד צַר לִ֣/י מְאֹ֑ד נִפְּלָה נָּ֤א בְ/יַד יְהוָה֙ כִּֽי רַבִּ֣ים רחמ/ו וּ/בְ/יַד אָדָ֖ם אַל אֶפֹּֽלָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/014.yaml
  text: Then David said to Gad[a], “I am in great distress. Let us fall, please, into the hand of Yahweh, for his mercies are many[b]; but let me not fall into the hand of man.”
  footnotes:
  - marker: a
    text: Or, 'for his compassion is abundant.' The Hebrew literally says, 'for many are his mercies.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'into the hand of man'; that is, under human power or control.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗이 갓에게 말했습니다. “제가 몹시 괴롭습니다. 부디 우리가 야훼의 손에 빠지게 해 주십시오. 그의 자비가 많기 때문입니다[b]. 그러나 제가 사람의 손에 빠지지 않게 해 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 자비들이 많다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי מְאֹד
  english_pob_choice: I am in great distress
  chosen_korean: 제가 매우 괴롭습니다
  alternatives_korean:
  - 제가 크게 곤혹스럽습니다
  - 제가 매우 곤경에 처했습니다
  lexicon: HALOT
  rationale: 개인적 압박과 고통을 나타내는 צַר לִי מְאֹד의 정서를 현대 한국어로 자연스럽게 살리면서도 과도하게 해석하지 않았습니다.
- source_word: נִפְּלָה נָּא
  english_pob_choice: Let us fall, please
  chosen_korean: 부디 … 떨어지게 하십시오
  alternatives_korean:
  - 부디 … 빠지게 하십시오
  - 제발 … 떨어지게 하십시오
  lexicon: HALOT
  rationale: 청유형의 뜻을 살려 간청으로 옮겼고, 공동체적 연대가 드러나도록 1인칭 복수 취지를 유지했습니다.
- source_word: בְ/יַד יְהוָה
  english_pob_choice: into the hand of Yahweh
  chosen_korean: 야훼의 손에
  alternatives_korean:
  - 야훼의 권세 아래
  - 야훼의 손 안에
  lexicon: HALOT
  rationale: ‘손’은 권능과 통제의 관용구이므로 직역하여 보존했습니다. גם יְהוָה는 이 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: כִּֽי רַבִּ֣ים רחמ/ו
  english_pob_choice: for his mercies are many
  chosen_korean: 그의 자비는 많으니까요
  alternatives_korean:
  - 그의 긍휼은 많으니까요
  - 그의 자비가 풍성하니까요
  lexicon: HALOT
  rationale: רַחֲמָיו의 복수형을 ‘자비들’로 기계적으로 풀기보다, 한국어에서 자연스러운 ‘자비는 많다’로 옮겨 다수성과 풍성함을 살렸습니다.
- source_word: וּ/בְ/יַד אָדָם
  english_pob_choice: but let me not fall into the hand of man
  chosen_korean: 그러나 사람의 손에는 떨어지지 않게 하십시오
  alternatives_korean:
  - 그러나 인간의 손에는 떨어지지 않게 하십시오
  - 그러나 사람 손에는 떨어지지 않게 하십시오
  lexicon: HALOT
  rationale: אָדָם의 일반적 인류 의미와 신적 손과의 대비를 살리되, 한국어에서 자연스러운 ‘사람’으로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 하나님의 고유명 יְהוָה를 직접 사용하므로, 경칭 대체어보다 이름 자체를 드러내는 ‘야훼’를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘into the hand of Yahweh’와 ‘into the hand of man’의 대조
  chosen_reading: 야훼의 손 / 사람의 손
  alternative_readings:
  - 야훼의 권세 / 인간의 권세
  - 주의 손 / 사람의 손
  rationale: 본문의 핵심 대조는 신적 통제와 인간 통제 사이의 대비이므로, ‘손’ 이미지를 보존해 문학적·신학적 긴장을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
