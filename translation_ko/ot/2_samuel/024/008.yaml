  text: They traveled throughout all the land, and at the end of nine months and twenty days they came to Jerusalem.
translation:
  language: ko
  text: 그들은 온 땅을 두루 다녔고, 아홉 달 스무 날이 지난 뒤 예루살렘에 도착했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁטוּ
  english_pob_choice: they traveled
  chosen_korean: 두루 다녔고
  alternatives_korean:
  - 여러 곳을 다녔고
  - 이곳저곳 돌아다녔고
  - 여행했고
  lexicon: HALOT
  rationale: שׁוּט는 단순 이동보다 영역 전체를 오가며 다니는 뜻이 있어, 조사 대상의 전역 순회라는 맥락을 살려 ‘두루 다녔고’로 옮겼습니다.
- source_word: בְּכָל הָאָרֶץ
  english_pob_choice: throughout all the land
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 나라
  - 그 땅 전체
  - 온 지역
  lexicon: HALOT
  rationale: 히브리어의 ‘땅’은 여기서 조사 대상이 된 영역 전체를 가리키므로, 현대 한국어에서 가장 자연스럽게 포괄성을 드러내는 ‘온 땅’을 택했습니다.
- source_word: וַיָּבֹאוּ
  english_pob_choice: they came
  chosen_korean: 도착했습니다
  alternatives_korean:
  - 왔습니다
  - 예루살렘에 왔습니다
  lexicon: HALOT
  rationale: 도시명 ‘예루살렘’이 뒤따르므로 단순한 ‘오다’보다 이동의 종결점을 분명히 하는 ‘도착했습니다’가 문맥상 더 정확합니다.
- source_word: מִקְצֵה תִשְׁעָה חֳדָשִׁים וְעֶשְׂרִים יוֹם
  english_pob_choice: at the end of nine months and twenty days
  chosen_korean: 아홉 달 스무 날이 끝났을 때
  alternatives_korean:
  - 아홉 달과 스무 날이 지난 뒤
  - 아홉 달 스무 날째에
  lexicon: HALOT
  rationale: מִקְצֵה는 기간의 완료 지점을 나타내므로, 한국어의 시간 종결 표현으로 ‘끝났을 때’가 가장 자연스럽고 원문 구조도 잘 드러냅니다.
theological_decisions:
- issue: 이 절의 서술은 단순한 이동 보고인지, 조사 과정의 완료를 강조하는지
  chosen_reading: 조사 대상이 온 땅을 다 돌아본 뒤, 정해진 기간이 끝나 예루살렘에 이른 사건을 담담히 보고하는 서술로 보았습니다.
  alternative_readings:
  - 단순히 여러 지역을 여행했다는 일반 이동 보고
  - ‘끝에’의 시간적 의미를 약하게 본 번역
  rationale: 문맥상 인구 조사와 관련된 왕의 관리들의 순회가 배경이므로, ‘두루 다녔다’와 ‘끝났을 때’의 조합이 서사의 진행과 완료를 함께 보여 줍니다.
  doctrine_reference: 문맥 주해
