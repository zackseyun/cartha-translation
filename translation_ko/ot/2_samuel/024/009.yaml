revisions:
- from: 요압이 백성의 수를 센 결과를 왕에게 보고했습니다. 이스라엘은 칼을 빼는 용사[ [a] ]가 팔십만 명이었고, 유다 사람은 오십만 명이었습니다.
  to: 요압이 백성의 수를 센 결과를 왕에게 보고했습니다. 이스라엘에는 칼을 뽑는 용사가 팔십만 명이 있었고[a], 유다 사람들은 오십만 명이었습니다.
  rationale: The revision normalizes the footnote anchor, uses idiomatic Korean to express the Hebrew collective construction introducing Israel's total, and makes the collective reference to Judah explicit. It preserves all Masoretic numerical values, the military qualification of the Israelite count, and the non-harmonizing cross-reference note.
