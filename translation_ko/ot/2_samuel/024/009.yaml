source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן יוֹאָ֛ב אֶת מִסְפַּ֥ר מִפְקַד הָ/עָ֖ם אֶל הַ/מֶּ֑לֶךְ וַ/תְּהִ֣י יִשְׂרָאֵ֡ל שְׁמֹנֶה֩ מֵא֨וֹת אֶ֤לֶף אִֽישׁ חַ֨יִל֙ שֹׁ֣לֵֽף חֶ֔רֶב וְ/אִ֣ישׁ יְהוּדָ֔ה חֲמֵשׁ מֵא֥וֹת אֶ֖לֶף אִֽישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/009.yaml
  text: 'Joab gave the number of the census of the people to the king: Israel was eight hundred thousand valiant men who drew the sword[a], and the men of Judah were five hundred thousand men.'
  footnotes:
  - marker: a
    text: The parallel in 1 Chronicles 21:5 gives different totals (1,100,000 for Israel and 470,000 for Judah). The translation here follows the Hebrew text of 2 Samuel without harmonizing the numbers.
    reason: cross_reference
translation:
  language: ko
  text: 요압이 백성의 수를 센 결과를 왕에게 보고했습니다. 이스라엘은 칼을 빼는 용사[ [a] ]가 팔십만 명이었고, 유다 사람은 오십만 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 역대상 21:5에는 이와 다른 총계(이스라엘 1,100,000명, 유다 470,000명)가 나옵니다. 여기서는 숫자를 조화시키지 않고 사무엘하 히브리어 본문을 따랐습니다.
    reason: cross_reference
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  english_pob_choice: the number of the census of the people
  chosen_korean: 백성의 수를 센 결과
  alternatives_korean:
  - 백성의 조사 숫자
  - 백성의 계수 수치
  - 백성의 인구조사 결과
  lexicon: HALOT
  rationale: 히브리어는 ‘수’와 ‘조사/계수’의 합성 구조이므로, 한국어에서는 중복을 줄이면서도 행위 결과를 드러내는 표현으로 옮겼습니다.
- source_word: אִישׁ חַיִל
  english_pob_choice: valiant men
  chosen_korean: 용사
  alternatives_korean:
  - 힘센 사람들
  - 용맹한 사람들
  - 전사들
  lexicon: HALOT
  rationale: 군사적 맥락에서 단순한 인구 집계가 아니라 전투 가능한 사람들을 가리키므로, 의미를 압축해 자연스러운 한국어 명사로 옮겼습니다.
- source_word: שֹׁלֵף חֶרֶב
  english_pob_choice: who drew the sword
  chosen_korean: 칼을 빼는
  alternatives_korean:
  - 칼을 뽑는
  - 칼을 든
  - 무장한
  lexicon: HALOT
  rationale: 직역하면 ‘칼을 빼는’이지만, 한국어에서는 동작 진행형을 써서 전투 준비가 된 사람이라는 관용적 뉘앙스를 살렸습니다.
- source_word: וְאִישׁ יְהוּדָה
  english_pob_choice: and the men of Judah
  chosen_korean: 유다 사람은
  alternatives_korean:
  - 유다의 사람들은
  - 유다의 남자들은
  - 유다 사람들은
  lexicon: HALOT
  rationale: 히브리어의 단수형 집합 표현을 한국어에서는 집합 명사구로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 사무엘하와 역대상의 인원 수 차이
  chosen_reading: 본문의 마소라 본문 수치를 그대로 제시하고, 본문 내에서 조화시키지 않았습니다.
  alternative_readings:
  - 역대상 수치로 맞추기
  - 주석 없이 두 본문을 혼합하기
  rationale: 번역 본문은 원문 자체를 드러내야 하므로, 조화 가설은 본문이 아니라 주석에서 다루는 것이 적절합니다.
  doctrine_reference: translation philosophy §1, §3
