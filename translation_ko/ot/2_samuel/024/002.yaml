  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל יוֹאָ֣ב שַׂר הַ/חַ֣יִל אֲשֶׁר אִתּ֗/וֹ שֽׁוּט נָ֞א בְּ/כָל שִׁבְטֵ֤י יִשְׂרָאֵל֙ מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וּ/פִקְד֖וּ אֶת הָ/עָ֑ם וְ/יָ֣דַעְתִּ֔י אֵ֖ת מִסְפַּ֥ר הָ/עָֽם־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/002.yaml
  text: So the king said to Joab[a], the commander of the army who was with him, “Go about now through all the tribes of Israel, from Dan to Beer-sheba, and count the people, so that I may know the number of the people.”
  footnotes:
  - marker: a
    text: Or “muster the people.” The Hebrew verb can refer to numbering or registering people, sometimes in a military context.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 자기와 함께 있던 군대의 지휘관 요압에게 말했습니다. 「이제 이스라엘의 모든 지파를 단에서 브엘세바까지 두루 다니며 백성을 계수하십시오[a]. 내가 백성의 수를 알 수 있도록 하십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “백성을 등록하십시오” 또는 “백성을 소집하십시오.” 히브리어 동사는 사람의 수를 세거나 명부에 등록하는 일을 가리키며, 때로는 군사적 문맥에서 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 그 왕
  alternatives_korean:
  - 왕
  - 그 군왕
  lexicon: HALOT
  rationale: 히브리어가 이름보다 직함을 쓰므로 이를 따라 ‘그 왕’으로 옮겼습니다. 문맥상 다윗을 가리키지만, 본문 표지 자체를 보존했습니다.
- source_word: שַׂר הַחַיִל
  english_pob_choice: the commander of the army
  chosen_korean: 군대의 지휘관
  alternatives_korean:
  - 군대의 사령관
  - 군대의 우두머리
  lexicon: HALOT
  rationale: שַׂר는 통치적·지휘적 직분을 가리키고, חַיִל은 여기서 군사력을 뜻하므로 현대 한국어로는 ‘군대의 지휘관’이 가장 자연스럽고 명료합니다.
- source_word: שׁוּט נָא
  english_pob_choice: Go about now
  chosen_korean: 이제 나아가 … 두루 돌아다니며
  alternatives_korean:
  - 이제 돌아다니며
  - 이제 두루 다니며
  lexicon: HALOT
  rationale: שׁוּט은 영역을 두루 돌아다니는 움직임을 가리키므로 단순한 ‘가다’보다 ‘두루 돌아다니다’가 어휘 의미를 더 잘 살립니다. נָא는 공손한 완화이지만 왕의 명령문에서는 ‘이제’ 정도로 자연스럽게 반영했습니다.
- source_word: וּפִקְדוּ
  english_pob_choice: and count
  chosen_korean: 계수하여
  alternatives_korean:
  - 세어
  - 등록하여
  - 소집하여
  lexicon: HALOT
  rationale: פקד는 이 문맥에서 인구 조사/등록의 뜻이므로, 단순 산술의 ‘세다’보다 행정적 뉘앙스를 지닌 ‘계수하다’가 더 정확합니다. POB의 ‘count’와 의미 범위가 맞습니다.
- source_word: מִסְפַּר הָעָם
  english_pob_choice: the number of the people
  chosen_korean: 그 백성의 수
  alternatives_korean:
  - 백성의 수
  - 그 사람들의 수
  lexicon: HALOT
  rationale: מִסְפַּר는 ‘수, 숫자’이므로 직역해 ‘수’로 옮겼고, הָעָם은 כאן ‘백성/사람들’보다 집단 전체를 가리키는 ‘백성’이 자연스럽습니다.
theological_decisions:
- issue: '이 명령의 대상 범위: ‘백성’의 번역'
  chosen_reading: ‘백성’을 그대로 유지하여 군사적 뉘앙스만으로 좁히지 않았습니다.
  alternative_readings:
  - ‘군인들’
  - ‘병력’
  rationale: 본문은 군사 지휘관에게 말하지만, 히브리어는 특정 전투원 용어가 아니라 הָעָם(백성)을 사용합니다. 따라서 본문이 실제로 말하는 범위를 보존했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; preserve what the source text actually says.'
