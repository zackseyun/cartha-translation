  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד וַ/יַּגֶּד ל֑/וֹ וַ/יֹּ֣אמֶר ל֡/וֹ הֲ/תָב֣וֹא לְ/ךָ֣ שֶֽׁבַע שָׁנִ֣ים רָעָ֣ב בְּ/אַרְצֶ֡/ךָ אִם שְׁלֹשָׁ֣ה חֳ֠דָשִׁים נֻסְ/ךָ֨ לִ/פְנֵֽי צָרֶ֜י/ךָ וְ/ה֣וּא רֹדְפֶ֗/ךָ וְ/אִם הֱ֠יוֹת שְׁלֹ֨שֶׁת יָמִ֥ים דֶּ֨בֶר֙ בְּ/אַרְצֶ֔/ךָ עַתָּה֙ דַּ֣ע וּ/רְאֵ֔ה מָה אָשִׁ֥יב שֹׁלְחִ֖/י דָּבָֽר־־־׀׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/013.yaml
  text: So Gad came to David and told him[a], and said to him[c][b], “Shall seven years of famine come to you in your land? Or will you flee three months before your adversaries while they pursue you? Or shall there be three days of pestilence in your land? Now know and see what answer I should return to the one who sent me.”
  footnotes:
  - marker: a
    text: The parallel in 1 Chronicles 21:12 reads 'three years of famine' instead of 'seven years.'
    reason: textual_variant
  - marker: b
    text: Or 'your enemies' for 'your adversaries.'
    reason: lexical_alternative
  - marker: c
    text: '''Pestilence'' may also be rendered ''plague.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 갓이 다윗에게 와서 그에게 알리고 말했습니다. “왕께서는 왕의 땅에 칠 년 동안 기근이 임하게 하시겠습니까?[a] 아니면 석 달 동안 적들에게 쫓겨 도망하시겠습니까? 아니면 왕의 땅에 사흘 동안 전염병이 있게 하시겠습니까? 이제 알아보고 살펴보십시오. 나를 보내신 분에게 내가 무슨 대답을 드려야 할지 말입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 역대상 21:12의 평행본문은 ‘삼 년의 기근’으로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 왔습니다
  - 들어와
  lexicon: HALOT
  rationale: 서술적 wayyiqtol의 이동 동사를 자연스러운 현대 한국어로 옮기되, 다윗에게 가까이 다가오는 장면의 방향성을 살렸습니다.
- source_word: וַיַּגֶּד
  english_pob_choice: told
  chosen_korean: 알리고
  alternatives_korean:
  - 말하고
  - 보고하고
  lexicon: HALOT
  rationale: נגד의 ‘말하다/알리다’ 의미를 반영해, 단순 발화보다 전달·보고의 뉘앙스를 살렸습니다.
- source_word: שֶׁבַע שָׁנִים רָעָב
  english_pob_choice: seven years of famine
  chosen_korean: 칠 년의 기근
  alternatives_korean:
  - 일곱 해의 기근
  - 칠 년간의 흉년
  lexicon: HALOT
  rationale: רָעָב는 단순한 배고픔이 아니라 공동체적 재난인 ‘기근’이므로 그렇게 옮겼고, MT의 ‘일곱’을 본문에 반영했습니다.
- source_word: צָרֶיךָ
  english_pob_choice: your adversaries
  chosen_korean: 당신의 적들
  alternatives_korean:
  - 당신의 대적들
  - 당신의 원수들
  lexicon: HALOT
  rationale: 히브리어 צַר의 적대적 의미를 살리면서, 한국어에서 가장 자연스러운 표현을 택했습니다.
- source_word: דֶּבֶר
  english_pob_choice: pestilence
  chosen_korean: 전염병
  alternatives_korean:
  - 역병
  - 전염성 질병
  lexicon: HALOT
  rationale: 본문의 재앙성 질환을 나타내는 말로 현대 독자가 즉시 이해할 수 있는 표현을 선택했습니다.
- source_word: מָה אָשִׁיב שֹׁלְחִי דָּבָר
  english_pob_choice: what answer I should return to the one who sent me
  chosen_korean: 내가 무엇을 대답해야 하는지
  alternatives_korean:
  - 내가 무엇을 보고해야 하는지
  - 내가 어떤 말을 되돌려야 하는지
  lexicon: HALOT
  rationale: ‘되돌리다’의 직역보다 ‘대답하다’가 ‘답변을 가지고 돌아가다’라는 관용구를 더 자연스럽게 전달합니다.
theological_decisions:
- issue: 사무엘하와 역대상의 수치 차이(칠 년 vs. 삼 년)
  chosen_reading: 본문은 WLC의 ‘칠 년의 기근’을 그대로 번역하고, 평행본문 차이는 각주로 처리하지 않았습니다.
  alternative_readings:
  - 삼 년의 기근
  rationale: 이 작업은 주어진 본문 자체를 번역하는 것이므로, 조화시키지 않고 MT를 본문대로 옮기는 것이 원문 우선 원칙에 맞습니다.
  doctrine_reference: 원문 우선 번역, 본문 간 긴장 보존
- issue: ‘전염병’의 재앙적 어감
  chosen_reading: ‘전염병’으로 번역해 현대 한국어에서 이해되는 공적 재난의 강도를 살렸습니다.
  alternative_readings:
  - 역병
  - 페스트
  rationale: דֶּבֶר의 무게를 약화시키지 않으면서도, 현대 독자에게 불필요하게 고어적으로 들리지 않도록 했습니다.
  doctrine_reference: 의미 보존과 가독성의 균형
