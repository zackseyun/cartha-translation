base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/011.yaml
  text: When David arose in the morning[a], the word of Yahweh had come to Gad the prophet, David’s seer, saying,
  footnotes:
  - marker: a
    text: Or, more literally, 'the word of the LORD was to Gad.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 아침에 일어났을 때, 야훼의 말씀이 예언자이자 다윗의 선견자 갓에게 임하여 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “야훼의 말씀이 갓에게 있었다/갓에게 임했다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어났을 때
  alternatives_korean:
  - 일어났습니다
  - 일어났을 때에
  lexicon: HALOT
  rationale: 서술 순서를 따라 다음 사건의 시점을 자연스럽게 드러내되, ‘일어나다’로 동작 자체를 과도하게 바꾸지 않았습니다.
- source_word: בַּבֹּקֶר
  english_pob_choice: in the morning
  chosen_korean: 아침에
  alternatives_korean:
  - 그 아침에
  - 아침에 일찍
  lexicon: HALOT
  rationale: 시간 부사구로서 현대 한국어에서 가장 자연스럽고 간결한 표현을 택했습니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 주님의 말씀
  lexicon: HALOT
  rationale: 예언 공식의 핵심인 ‘말씀’을 유지했고, 프로젝트 기준에 따라 יְהוָה는 ‘야훼’로 옮겼습니다.
- source_word: חֹזֵה דָוִד
  english_pob_choice: David’s seer
  chosen_korean: 다윗의 선견자
  alternatives_korean:
  - 다윗의 보는 자
  - 다윗의 예언자
  lexicon: HALOT
  rationale: חֹזֶה는 단순한 예언자보다 ‘보는 자/선견자’의 시각적 뉘앙스가 있어 ‘선견자’로 살렸습니다.
theological_decisions:
- issue: יהוה(YHWH)의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문 고유명사를 지우지 않고, 본 프로젝트의 기준에 따라 성호를 ‘야훼’로 직접 반영했습니다.
  doctrine_reference: POB terminology guideline for יְהוָה / YHWH
- issue: 가드의 직함 두 개(הַנָּבִיא, חֹזֵה דָוִד)
  chosen_reading: 예언자이자 다윗의 선견자
  alternative_readings:
  - 예언자 갓, 다윗의 선견자
  - 예언자 갓, 다윗의 예언자
  rationale: 원문은 갓을 일반적 직무(예언자)와 관계적 직함(다윗의 선견자)으로 함께 규정하므로, 두 표현을 모두 살려 중복이 아니라 보충 설명으로 제시했습니다.
  doctrine_reference: Narrative office titles in prophetic formulae
