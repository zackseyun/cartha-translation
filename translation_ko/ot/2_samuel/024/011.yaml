  lexicon: HALOT
  rationale: 시간 부사구로서 현대 한국어에서 가장 자연스럽고 간결한 표현을 택했습니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
