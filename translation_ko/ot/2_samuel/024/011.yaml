lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어났을 때
  alternatives_korean:
  - 일어났습니다
  - 일어났을 때에
  lexicon: HALOT
  rationale: 서술 순서를 따라 다음 사건의 시점을 자연스럽게 드러내되, ‘일어나다’로 동작 자체를 과도하게 바꾸지 않았습니다.
- source_word: בַּבֹּקֶר
  english_pob_choice: in the morning
  chosen_korean: 아침에
