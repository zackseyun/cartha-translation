  rationale: חֹזֶה는 단순한 예언자보다 ‘보는 자/선견자’의 시각적 뉘앙스가 있어 ‘선견자’로 살렸습니다.
theological_decisions:
- issue: יהוה(YHWH)의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문 고유명사를 지우지 않고, 본 프로젝트의 기준에 따라 성호를 ‘야훼’로 직접 반영했습니다.
  doctrine_reference: POB terminology guideline for יְהוָה / YHWH
- issue: 가드의 직함 두 개(הַנָּבִיא, חֹזֵה דָוִד)
  chosen_reading: 예언자이자 다윗의 선견자
  alternative_readings:
  - 예언자 갓, 다윗의 선견자
  - 예언자 갓, 다윗의 예언자
  rationale: 원문은 갓을 일반적 직무(예언자)와 관계적 직함(다윗의 선견자)으로 함께 규정하므로, 두 표현을 모두 살려 중복이 아니라 보충 설명으로 제시했습니다.
  doctrine_reference: Narrative office titles in prophetic formulae
