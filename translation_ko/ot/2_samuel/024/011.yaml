  - 주님의 말씀
  lexicon: HALOT
  rationale: 예언 공식의 핵심인 ‘말씀’을 유지했고, 프로젝트 기준에 따라 יְהוָה는 ‘야훼’로 옮겼습니다.
- source_word: חֹזֵה דָוִד
  english_pob_choice: David’s seer
  chosen_korean: 다윗의 선견자
  alternatives_korean:
