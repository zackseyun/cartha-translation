  text: 'Go and speak to David[a], ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
  footnotes:
  - marker: a
    text: Hebrew simply 'three'; the noun is implied from the context. Possible renderings include 'three things' or 'three options.'
    reason: lexical_alternative
translation:
  language: ko
  text: 가서 다윗에게 말하십시오. ‘야훼께서 이렇게 말씀하십니다. 내가 네게 세 가지를[a] 제시합니다. 그 가운데 하나를 네가 선택하십시오. 그러면 내가 그것을 네게 행하겠습니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘셋’이라고만 하며, 무엇이 셋인지는 문맥에서 보충됩니다. ‘세 가지’ 또는 ‘세 선택지’로 옮길 수 있습니다.
    reason: lexical_alternative
