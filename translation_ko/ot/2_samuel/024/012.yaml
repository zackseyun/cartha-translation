  naturalness: ‘가서 다윗에게 말하십시오’와 ‘선택하라’가 한 절 안에서 합쇼체와 해라체로 섞여 있습니다. 목표 문체인 현대 표준어 합쇼체에 맞추어 인용된 야훼의 명령도 ‘선택하십시오’로 통일해야 합니다. 또한 ‘그것을 행하겠습니다’는 원문의 משפט적·실행적 표현을 유지하면서도 ‘그것을 네게 행하겠습니다’의 어순이 더 자연스럽습니다.
