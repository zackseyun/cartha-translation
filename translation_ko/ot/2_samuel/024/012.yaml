  yaml_path: translation/ot/2_samuel/024/012.yaml
  text: 'Go and speak to David[a], ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
  footnotes:
  - marker: a
    text: Hebrew simply 'three'; the noun is implied from the context. Possible renderings include 'three things' or 'three options.'
    reason: lexical_alternative
translation:
  language: ko
  text: 가서 다윗에게 말하십시오. ‘야훼께서 이렇게 말씀하십니다. 내가 너에게 셋을 내놓습니다. 그 가운데 하나를 너 스스로 선택하라. 그러면 내가 너에게 그것을 행하겠습니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘셋’만 두고 있으며, 문맥상 ‘셋의 항목/선택지’가 생략되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ וְדִבַּרְתָּ
  english_pob_choice: Go and speak
  chosen_korean: 가서 … 말하십시오
  alternatives_korean:
  - 가서 말하십시오
  - 가서 전하십시오
  lexicon: HALOT
  rationale: 히브리어의 분사적 강조를 한국어에서는 자연스러운 명령형 연쇄로 옮기되, ‘말하다’가 직접 화행을 가장 정확하게 드러냅니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 이같이 말씀하십니다
  - 주께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 예언자 전언 공식의 격식을 살리면서, 본문에 있는 신명 ‘야훼’를 보존했습니다.
- source_word: שָׁלֹשׁ
  english_pob_choice: three things
  chosen_korean: 셋
  alternatives_korean:
  - 세 가지
  - 세 개
  lexicon: HALOT
  rationale: 히브리어는 명사가 생략된 ‘셋’이므로, 문맥에 맞게 과도한 해석 없이 간명하게 옮겼습니다.
- source_word: בְּחַר לְךָ אַחַת מֵהֶם
  english_pob_choice: Choose one of them for yourself
  chosen_korean: 그 가운데 하나를 너 스스로 선택하라
  alternatives_korean:
  - 그들 가운데 하나를 너를 위해 선택하라
  - 하나를 선택하라
  lexicon: HALOT
  rationale: לְךָ의 수혜·귀속 뉘앙스를 ‘너 스스로’로 반영해 다윗의 개인적 선택 책임을 드러냈습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
