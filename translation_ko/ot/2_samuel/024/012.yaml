  - 주
  rationale: 본문의 고유명사를 제목어로 바꾸지 않고 신명 자체를 드러내는 번역 원칙에 따라 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
