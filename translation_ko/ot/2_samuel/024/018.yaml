  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֣אמֶר ל֗/וֹ עֲלֵה֙ הָקֵ֤ם לַֽ/יהוָה֙ מִזְבֵּ֔חַ בְּ/גֹ֖רֶן ארניה הַ/יְבֻסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/018.yaml
  text: That day Gad came to David and said to him[c][b][a], “Go up and set up an altar to Yahweh on the threshing floor of Araunah the Jebusite.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''on that day.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'for the LORD.'
    reason: lexical_alternative
  - marker: c
    text: Chronicles gives the name as Ornan (1 Chr 21:18).
    reason: cross_reference
translation:
  language: ko
  text: 그날 갓이 다윗에게 와서 그에게 말했습니다. 「올라가서 야훼를 위해 여부스 사람 아라우나의 타작마당에 제단을 세우십시오.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그날에’입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 신명 יהוה를 사용합니다.
    reason: source_note
  - marker: c
    text: 역대상 21:18은 이 인물의 이름을 ‘오르난’으로 전합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 왔습니다
  - 들어와
  lexicon: HALOT
  rationale: 서사 진행의 동작을 자연스럽게 살리면서, 뒤의 ‘말했습니다’와 이어지는 유연한 표현으로 옮겼습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: That day
  chosen_korean: 그날
  alternatives_korean:
  - 그날에
  - 그 날
  lexicon: HALOT
  rationale: 히브리어의 특정 시점을 간결한 현대 한국어로 옮겼습니다.
- source_word: הָקֵם
  english_pob_choice: set up
  chosen_korean: 세우십시오
  alternatives_korean:
  - 설치하십시오
  - 세워 두십시오
  lexicon: HALOT
  rationale: מִזְבֵּחַ와 함께 쓰인 ‘세우다/세우십시오’가 제단을 ‘세워 마련하다’는 의미를 가장 직접적으로 전달합니다.
- source_word: לַיהוָה
  english_pob_choice: to the LORD
  chosen_korean: 야훼를 위해
  alternatives_korean:
  - 야훼께
  - 주님께
  lexicon: HALOT
  rationale: 제단의 목적과 헌납 대상을 드러내는 ל의 기능을 살리되, 본 프로젝트 기준에 따라 신명은 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 야훼라는 신명 표기
  chosen_reading: 원문의 יהוה를 ‘야훼’로 음역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 구절은 직접적으로 신명을 사용하므로, 프로젝트 기본 원칙에 따라 covenant name을 보존하는 표기를 택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: 제단 명령의 문체
  chosen_reading: 직접 명령을 정중한 청유형이 아닌 명령형 존대(‘세우십시오’)로 옮겼습니다.
  alternative_readings:
  - 세우세요
  - 세우라
  rationale: 예언자 갓의 전달 발화라는 장면을 살리면서도 현대 표준어 합쇼체를 유지하기 위해 명령형 존대가 가장 적절했습니다.
  doctrine_reference: Korean target style guideline
