    rationale: יִקַּח וְיַעַל은 왕이 제공물을 취하고 그것을 제물로 올리는 두 동작입니다. ‘받으셔서 ... 바치십시오’가 한국어에서 이 순서와 제의적 행위를 더 정확히 전달합니다.
