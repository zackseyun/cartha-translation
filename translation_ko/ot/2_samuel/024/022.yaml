base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/022.yaml
  text: Then Araunah said to David[a], “Let my lord the king take and offer up what is good in his eyes. Look, the oxen are for the burnt offering[b], and the threshing sledges and the implements of the oxen are for the wood.”
  footnotes:
  - marker: a
    text: Or 'whatever seems good to him.' The Hebrew idiom is literally 'the good in his eyes.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the equipment of the oxen.' The Hebrew phrase is broad and may refer generally to the oxen’s wooden gear used as fuel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아라우나는 다윗에게 말했습니다. “내 주 왕께서는 자기 눈에 좋은 것을 가져다가 드리십시오. 보십시오, 소들은 번제에 쓰이고, 타작 썰매와 소의 기구들은 나무로 쓰입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘그의 눈에 좋은 것’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 더 넓게는 소의 목재 장비나 그 재료를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: 내 주 왕
  alternatives_korean:
  - 내 주, 왕
  - 주 왕
  lexicon: HALOT
  rationale: 히브리어의 궁정식 호칭을 자연스럽게 살리면서, 다윗에게 대한 정중한 직접 호칭을 현대 한국어로 간결하게 옮겼습니다.
- source_word: הַטּוֹב בְּעֵינָיו
  english_pob_choice: what is good in his eyes
  chosen_korean: 자기 눈에 좋은 것
  alternatives_korean:
  - 그에게 좋은 것
  - 그의 눈에 좋은 것
  - 마음에 드는 것
  lexicon: HALOT
  rationale: 관용구를 직역에 가깝게 유지해 본문이 가진 투명성을 살렸고, ‘자기’로 왕을 가리키는 3인칭 전환도 드러냈습니다.
- source_word: הַבָּקָר
  english_pob_choice: the oxen
  chosen_korean: 소들
  alternatives_korean:
  - 황소들
  - 가축들
  lexicon: HALOT
  rationale: 문맥상 제물과 타작 기구에 연결된 일하는 소들을 가리키므로, 지나치게 협소한 ‘황소들’보다 일반적이고 자연스러운 ‘소들’을 택했습니다.
- source_word: הַמֹּרִגִּים
  english_pob_choice: the threshing sledges
  chosen_korean: 타작 썰매
  alternatives_korean:
  - 타작 도구
  - 타작판
  lexicon: HALOT
  rationale: מורג의 구체적 농기구 의미를 살리면서도 현대 독자가 이해할 수 있는 표현으로 옮겼습니다.
- source_word: כְלֵי הַבָּקָר
  english_pob_choice: the implements of the oxen
  chosen_korean: 소의 기구들
  alternatives_korean:
  - 소의 장비들
  - 소의 도구들
  - 소의 멍에들
  lexicon: HALOT
  rationale: 영어 POB가 문맥상 넓은 의미의 장비를 택한 점을 따라, 과도하게 특정한 ‘멍에들’ 대신 폭넓은 ‘기구들’로 두어 본문의 여지를 보존했습니다.
theological_decisions:
- issue: 아라우나의 정중한 초청 어조
  chosen_reading: 허락과 호의가 섞인 권유를 ‘가져다가 드리십시오’로 옮겨, 왕에게 예를 갖춘 초청의 뉘앙스를 유지했습니다.
  alternative_readings:
  - 가져가서 드리십시오
  - 받아 드리십시오
  rationale: 본문은 명령보다 양보적 권유에 가깝기 때문에, 한국어도 정중한 청유형으로 옮기는 것이 적절합니다.
  doctrine_reference: speech_act and discourse_pragmatics
