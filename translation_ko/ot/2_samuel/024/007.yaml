  text: They came to the fortified city of Tyre and to all the cities of the Hivites and the Canaanites[a], and they went out to the Negev of Judah, to Beersheba.
  footnotes:
  - marker: a
    text: Or 'the south of Judah.' The Hebrew negev can denote either the specific region called the Negev or, more generally, the southern area.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 두로의 요새화된 성읍과 히위 사람들과 가나안 사람들의 모든 성읍에 이르렀고, 유다의 네겝[a]에 있는 브엘세바로 나아갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다의 남쪽’입니다. 히브리어 נֶגֶב은 특정 지역명인 네겝을 가리킬 수도 있고, 더 넓게는 남쪽 지역을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצַר צֹר
  english_pob_choice: the fortified city of Tyre
  chosen_korean: 두로의 요새
  alternatives_korean:
