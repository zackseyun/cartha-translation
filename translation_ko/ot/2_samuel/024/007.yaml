  lexicon: HALOT
  rationale: נֶגֶב은 일반적인 ‘남쪽’일 수도 있지만 여기서는 지리명처럼 기능하므로 ‘네겝’을 유지하고, ‘유다의’로 범위를 분명히 했습니다.
- source_word: בְּאֵר שָׁבַע
  english_pob_choice: Beersheba
  chosen_korean: 브엘세바
  alternatives_korean:
  - 베르세바
  - 브엘-세바
  lexicon: HALOT
  rationale: 지명은 현대 한국어 성경에서 널리 쓰이는 음역인 ‘브엘세바’를 사용해 인지성과 일관성을 확보했습니다.
