  lexicon: HALOT
  rationale: מִבְצַר는 요새화된 장소를 가리키므로 ‘요새’가 자연스럽고, צֹר는 지명 두로로 옮겨 군사적·지리적 뉘앙스를 함께 살렸습니다.
