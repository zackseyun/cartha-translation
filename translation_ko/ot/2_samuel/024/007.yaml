translation:
  language: ko
  text: 그들은 두로의 요새와[a] 히위 사람들과 가나안 사람들의 모든 성읍에 이르렀고, 유다의 네겝 곧 브엘세바로 나아갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다의 남쪽’입니다. 히브리어 נֶגֶב은 특정 지역명인 네겝을 가리킬 수도 있고, 더 넓게는 남쪽 지역을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצַר צֹר
  english_pob_choice: the fortified city of Tyre
  chosen_korean: 두로의 요새
  alternatives_korean:
  - 두로의 요새화된 성읍
  - 두로의 성채
  lexicon: HALOT
  rationale: מִבְצַר는 요새화된 장소를 가리키므로 ‘요새’가 자연스럽고, צֹר는 지명 두로로 옮겨 군사적·지리적 뉘앙스를 함께 살렸습니다.
- source_word: וְכָל עָרֵי הַחִוִּי וְהַכְּנַעֲנִי
  english_pob_choice: and to all the cities of the Hivites and the Canaanites
  chosen_korean: 히위 사람들과 가나안 사람들의 모든 성읍
  alternatives_korean:
  - 히위족과 가나안족의 모든 성읍
  - 히위 사람들과 가나안 사람들의 모든 도시
  lexicon: HALOT
  rationale: עָרֵי는 도시보다 성읍이 지명·고대 문맥에 더 잘 맞고, 부족명은 한국어 성경 관행에 따라 ‘사람들’로 옮겨 집단 전체를 가리키게 했습니다.
- source_word: וַיֵּצְאוּ אֶל נֶגֶב יְהוּדָה
  english_pob_choice: and they went out to the Negev of Judah
  chosen_korean: 유다의 네겝 곧
  alternatives_korean:
  - 유다 남쪽으로
  - 유다의 남방 곧
  lexicon: HALOT
  rationale: נֶגֶב은 일반적인 ‘남쪽’일 수도 있지만 여기서는 지리명처럼 기능하므로 ‘네겝’을 유지하고, ‘유다의’로 범위를 분명히 했습니다.
- source_word: בְּאֵר שָׁבַע
  english_pob_choice: Beersheba
  chosen_korean: 브엘세바
  alternatives_korean:
  - 베르세바
  - 브엘-세바
  lexicon: HALOT
  rationale: 지명은 현대 한국어 성경에서 널리 쓰이는 음역인 ‘브엘세바’를 사용해 인지성과 일관성을 확보했습니다.
theological_decisions:
- issue: נֶגֶב의 지리어 처리
  chosen_reading: ‘네겝’은 고유한 남부 지역명으로 보아 본문에 유지했습니다.
  alternative_readings:
  - ‘남쪽’으로 일반화
  - ‘남방’으로 번역
  rationale: 출정 경로를 말하는 문맥에서 단순 방향보다 지역명으로 읽는 편이 원문이 전달하는 지리적 구체성을 보존합니다.
  doctrine_reference: 본문의 지리 묘사 보존 원칙
