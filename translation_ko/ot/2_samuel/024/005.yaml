source:
  edition: WLC
  text: וַ/יַּעַבְר֖וּ אֶת הַ/יַּרְדֵּ֑ן וַ/יַּחֲנ֣וּ בַ/עֲרוֹעֵ֗ר יְמִ֥ין הָ/עִ֛יר אֲשֶׁ֛ר בְּ/תוֹךְ הַ/נַּ֥חַל הַ/גָּ֖ד וְ/אֶל יַעְזֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/005.yaml
  text: They crossed the Jordan and camped at Aroer[a], on the right side of the city that is in the middle of the valley of Gad[c][b], and toward Jazer.
  footnotes:
  - marker: a
    text: Or 'and to Jazer.' The Hebrew preposition can indicate either direction toward a place or movement to it.
    reason: lexical_alternative
  - marker: b
    text: Or 'that is in the middle of the wadi/ravine of Gad.' The Hebrew word can refer to a valley, ravine, or seasonal streambed.
    reason: lexical_alternative
  - marker: c
    text: Literally 'to the right of the city.' Some interpreters understand this geographically as 'south of the city,' but the Hebrew expression itself is preserved here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 요단을 건너, 갓의 골짜기 한가운데 있는 성읍의 오른쪽에 있는 아로엘에서 진을 치고 야셀 쪽으로 갔습니다.[c][b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야셀로’. 히브리어 전치사는 어떤 장소를 향한 방향이나 그곳으로의 이동을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘갓의 와디/마른 하천 골짜기 한가운데 있는’. 히브리어 נחל은 골짜기, 와디, 또는 계절 하천바닥을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘성읍의 오른쪽에’. 일부 해석자는 이를 지리적으로 ‘성읍의 남쪽’으로 이해하지만, 여기서는 히브리어 표현 자체를 보존했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  english_pob_choice: They crossed the Jordan
  chosen_korean: 요단을 건너
  alternatives_korean:
  - 요단강을 건너
  - 요단을 넘어
  lexicon: HALOT
  rationale: עבר의 이동 서술은 자연스럽게 ‘건너다’로 옮기되, 성경 지명 표현에 익숙한 ‘요단’을 유지했습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 치고
  alternatives_korean:
  - 캠프를 치고
  - 야영하고
  lexicon: HALOT
  rationale: 군사적·여행 서술에서 חנה는 단순 야영보다 ‘진을 치다’가 원문 상황을 더 정확히 드러냅니다.
- source_word: בַעֲרוֹעֵר
  english_pob_choice: at Aroer
  chosen_korean: 아로엘에
  alternatives_korean:
  - 아로엘에서
  - 아로엘에 이르러
  lexicon: HALOT
  rationale: 이동 경로의 정착 지점을 나타내는 מקום 전치사 ב는 한국어에서 목적지·체류 지점의 ‘-에’로 자연스럽게 옮겼습니다.
- source_word: יְמִין הָעִיר
  english_pob_choice: to the right of the city
  chosen_korean: 성읍의 오른쪽
  alternatives_korean:
  - 성읍의 오른편
  - 성읍의 오른쪽 편
  lexicon: HALOT
  rationale: יִמין의 공간적 의미를 그대로 살려, 해석을 덧붙이지 않고 ‘오른쪽’으로 옮겼습니다. 영어 POB가 보존한 방향성도 반영합니다.
- source_word: בְּתוֹךְ הַנַּחַל הַגָּד
  english_pob_choice: the city that is in the middle of the valley of Gad
  chosen_korean: 길르앗의 골짜기 한가운데 있는 성읍
  alternatives_korean:
  - 갓의 골짜기 한가운데 있는 성읍
  - 갓의 와디 한가운데 있는 성읍
  lexicon: HALOT
  rationale: נחל은 골짜기·와디·계곡 등을 가리킬 수 있으므로, 문맥상 읽기 쉬우면서도 지형적 함의를 살리는 ‘골짜기’로 옮겼습니다. 지명 ‘Gad’는 한국어 성경의 통용형인 ‘길르앗’으로 이해되는 지형 맥락을 반영했습니다.
- source_word: וְאֶל יַעְזֵר
  english_pob_choice: and toward Jazer
  chosen_korean: 그리고 야셀 쪽에 이르렀습니다
  alternatives_korean:
  - 그리고 야셀을 향해
  - 그리고 야셀로
  lexicon: HALOT
  rationale: אל은 ‘~로’와 ‘~을 향해’ 둘 다 가능하므로, POB의 방향성 보존을 따라 도착 단정 없이 ‘쪽에 이르렀습니다’로 처리했습니다.
theological_decisions:
- issue: 지명·지형 표현의 해석 정도
  chosen_reading: ‘오른쪽’과 ‘골짜기’는 해석을 덧붙이지 않고 원문이 말하는 공간 정보를 그대로 드러내었습니다.
  alternative_readings:
  - ‘남쪽’으로 이해하는 방향 해석
  - ‘와디/계곡’으로 더 전문적으로 표기
  rationale: 이 절은 신학적 진술보다 지리 묘사가 핵심이므로, 원문이 허용하는 범위 안에서 가장 투명한 공간 표현을 유지하는 것이 적절합니다.
  doctrine_reference: 본문 지리 서술의 문맥 보존
