- from: 거기서 다윗이 야훼를 위해 제단을 쌓고 번제와 화목제물을 드렸습니다. 그러자 야훼께서 그 땅을 향해 응답하셨고, 재앙은 이스라엘에게서 그쳤습니다.[a][b][c]
  to: 그곳에서 다윗은 야훼[c]를 위하여 제단을 쌓고 번제와 화목제물[a]을 드렸습니다. 그러자 야훼께서 그 땅을 위하여 드린 간구를 들어주셨고[b], 전염병이 이스라엘에서 멈추었습니다.
  rationale: 원문의 לָאָרֶץ를 ‘그 땅을 위하여’로 바로잡고, 니팔 עתר의 간청 수용 의미를 자연스러운 한국어로 반영했습니다. ‘전염병’으로 מגפה의 질병성 의미를 살렸으며, 각주 표지를 해당 본문 어구에 연결했습니다.
