  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤ד מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יֵּעָתֵ֤ר יְהוָה֙ לָ/אָ֔רֶץ וַ/תֵּעָצַ֥ר הַ/מַּגֵּפָ֖ה מֵ/עַ֥ל יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/025.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings[a]. So Yahweh responded to the land[c][b], and the plague was restrained from Israel.
  footnotes:
  - marker: a
    text: Or 'peace offerings,' alternatively 'fellowship offerings.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD responded favorably for the land'; the expression may also be rendered 'the LORD answered prayer for the land.'
    reason: alternative_reading
  - marker: c
    text: '''the LORD'' renders the divine name YHWH.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 다윗은 야훼[c]를 위하여 제단을 쌓고 번제와 화목제물[a]을 드렸습니다. 그러자 야훼께서 그 땅을 위하여 드린 간구를 들어주셨고[b], 전염병이 이스라엘에서 멈추었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화목제물’은 히브리어 שְׁלָמִים의 번역입니다. 문맥에 따라 ‘평화제물’ 또는 ‘친교제물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘야훼께서 그 땅을 위하여 간청을 받아들이셨고’라는 뜻입니다. 본문은 간구를 직접 다시 언급하지 않지만, 동사는 간청에 호의적으로 응하셨다는 의미를 담습니다.
    reason: alternative_reading
  - marker: c
    text: 여기서 ‘야훼’는 히브리어 신명사 YHWH를 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  english_pob_choice: There
  chosen_korean: 거기서
  alternatives_korean:
  - 그곳에서
  - 그 자리에서
  lexicon: HALOT
  rationale: 앞의 문맥이 아라우나의 타작마당을 가리키므로, 위치를 자연스럽게 되살리는 ‘거기서’가 간결하고 정확합니다.
- source_word: וַיִּבֶן ... מִזְבֵּחַ
  english_pob_choice: built an altar
  chosen_korean: 제단을 쌓고
  alternatives_korean:
  - 제단을 세우고
  - 제단을 건축하고
  lexicon: HALOT
  rationale: מִזְבֵּחַ는 ‘제단’이 표준적이며, 건축보다 제의적 행위에 맞는 ‘쌓다’가 자연스럽습니다.
- source_word: וּשְׁלָמִים
  english_pob_choice: peace offerings
  chosen_korean: 화목제물
  alternatives_korean:
  - 평화제물
  - 친교제물
  lexicon: HALOT
  rationale: 절기·제의 용어로서 한국어 성경에서 널리 통용되며, POB의 ‘peace offerings’와도 대응하면서 제사 항목을 분명히 드러냅니다.
- source_word: וַיֵּעָתֵר יְהוָה לָאָרֶץ
  english_pob_choice: responded to the land
  chosen_korean: 그 땅을 향해 응답하셨고
  alternatives_korean:
  - 그 땅을 위해 응답하셨고
  - 그 땅을 위해 간구에 응답하셨고
  lexicon: HALOT
  rationale: עתר의 수동/니팔은 ‘간청에 응하다’의 뉘앙스를 가지므로, 본문이 직접 ‘간구’를 다시 말하지는 않지만 그 응답성을 살려 ‘향해 응답하셨고’로 옮겼습니다.
- source_word: הַמַּגֵּפָה
  english_pob_choice: the plague
  chosen_korean: 재앙
  alternatives_korean:
  - 전염병
  - 역병
  lexicon: HALOT
  rationale: 문맥상 대규모 징벌성 재난을 가리키므로, 현대 한국어에서 의미를 넓게 포착하는 ‘재앙’이 자연스럽습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 신명기적 고유명은 ‘야훼’로 옮겨 가시성과 추적 가능성을 유지했습니다.
  doctrine_reference: 'POB glossaries: יהוה / YHWH → 야훼'
- issue: וַיֵּעָתֵר의 신학적 함의
  chosen_reading: 그 땅을 향해 응답하셨고
  alternative_readings:
  - 그 땅을 위해 응답하셨고
  - 그 땅을 위한 간구에 응답하셨고
  rationale: 본문은 야훼의 긍휼한 응답을 말하지만 간구의 직접 언급은 하지 않으므로, 응답의 방향성은 살리되 설명을 과하게 덧붙이지 않았습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
