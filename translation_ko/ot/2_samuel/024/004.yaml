language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֶּחֱזַ֤ק דְּבַר הַ/מֶּ֨לֶךְ֙ אֶל יוֹאָ֔ב וְ/עַ֖ל שָׂרֵ֣י הֶ/חָ֑יִל וַ/יֵּצֵ֨א יוֹאָ֜ב וְ/שָׂרֵ֤י הַ/חַ֨יִל֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ לִ/פְקֹ֥ד אֶת הָ/עָ֖ם אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/004.yaml
  text: But the king’s word prevailed against Joab and against the commanders of the army, so Joab and the commanders of the army went out from before the king to count the people of Israel.
translation:
  language: ko
  text: 그러나 왕의 말이 요압과 군대의 지휘관들을 압박하였으므로, 요압과 군대의 지휘관들은 왕 앞에서 나가 이스라엘 백성을 계수하였습니다.
  philosophy: formal
lexical_decisions:
- source_word: דְּבַר הַמֶּלֶךְ
  english_pob_choice: the king’s word
  chosen_korean: 왕의 말
  alternatives_korean:
  - 왕의 명령
  - 왕의 말씀
  lexicon: דבר
  rationale: 문맥상 왕의 발언이 아니라 시행을 밀어붙이는 왕의 지시/결정이므로, 과도하게 경건한 ‘말씀’보다 중립적인 ‘말’이 원문과 English POB의 톤에 가깝습니다.
- source_word: וַיֶּחֱזַק
  english_pob_choice: prevailed against
  chosen_korean: 압박하였으므로
  alternatives_korean:
  - 강하게 하였으므로
  - 우세하였으므로
  - 밀어붙였으므로
  lexicon: חזק
  rationale: חזק의 ‘강하다/굳세다’가 여기서는 왕의 말이 요압과 지휘관들에게 강한 압력을 행사했다는 의미로 쓰였으므로, ‘압박하다’가 관계의 긴장과 강제성을 가장 잘 드러냅니다.
- source_word: שָׂרֵי הֶחָיִל / שָׂרֵי הַחַיִל
  english_pob_choice: the commanders of the army
  chosen_korean: 군대의 지휘관들
  alternatives_korean:
  - 군대의 지휘자들
  - 군대의 장관들
  - 군 지휘관들
  lexicon: שר
  rationale: שר는 군사 지휘 책임자를 가리키므로, 현대 한국어에서 자연스럽고 계층적 뉘앙스를 보존하는 ‘지휘관들’이 적절합니다.
- source_word: לִפְקֹד אֶת הָעָם
  english_pob_choice: to count the people
  chosen_korean: 백성을 계수하였습니다
  alternatives_korean:
  - 백성을 세도록 하였습니다
  - 백성을 조사하였습니다
  - 백성을 징집하였습니다
  lexicon: פקד
  rationale: פקד는 여기서 인구 조사/계수의 뜻이므로, 군사적·행정적 의미를 살리면서도 원문의 직접성을 보존하는 ‘계수하다’를 택했습니다.
theological_decisions:
- issue: 왕의 말과 순종의 서술 톤
  chosen_reading: 본문은 다윗의 명령이 요압과 군대 지휘관들을 제압해 결국 그들이 왕 앞에서 나가게 되었음을 담담하게 서술합니다.
  alternative_readings:
  - 왕의 말이 단지 설득력을 가졌다고 완곡하게 읽기
  - 요압의 책임을 약화시키는 방향으로 번역하기
  rationale: 히브리어의 강한 동사 חזק과 전치사 구조는 단순한 설득보다 더 강한 압박/우세를 암시하므로, 서술의 긴장감을 약화시키지 않는 것이 원문 충실성에 부합합니다.
  doctrine_reference: 서사적 문맥에서의 책임과 강제성 보존
- issue: 계수 행위의 성격
  chosen_reading: ‘계수하다’로 번역해 군사·행정 목적의 인구 조사라는 기능을 드러냈습니다.
  alternative_readings:
  - ‘조사하다’로 일반화하기
  - ‘등록하다’로 바꾸기
  rationale: 원문 פקד는 단순 관찰이 아니라 수적 산정의 행위를 나타내므로, 본문이 의도하는 민수적 성격을 보존하는 표현이 필요합니다.
  doctrine_reference: 본문 의미의 정확한 행정적/서사적 재현
