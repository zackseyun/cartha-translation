  text: So David went up according to the word of Gad, just as Yahweh had commanded.
translation:
  language: ko
  text: 그리하여 다윗은 갓의 말대로, 야훼께서 명령하신 대로 올라갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 갔습니다
  - 상경했습니다
  lexicon: HALOT
  rationale: עלה의 기본 의미인 ‘오르다/올라가다’를 살려 방향성을 보존했습니다. 단순히 ‘갔습니다’로 하면 상승·이동의 뉘앙스가 약해집니다.
- source_word: כִּדְבַר גָּד
  english_pob_choice: according to the word of Gad
  chosen_korean: 갓의 말대로
  alternatives_korean:
  - 갓의 말씀에 따라
  - 갓의 말에 따라
  lexicon: HALOT
  rationale: דָּבָר는 여기서 예언자적 발화로서 ‘말’의 성격이 강하므로, 과도하게 경건화된 ‘말씀’보다 ‘말’이 स्रोत의 직접성을 더 잘 드러냅니다.
- source_word: כַּאֲשֶׁר צִוָּה
  english_pob_choice: just as ... had commanded
  chosen_korean: 명령하신 그대로였습니다
  alternatives_korean:
  - 명령하신 대로였습니다
  - 명하신 그대로였습니다
  lexicon: HALOT
  rationale: כַּאֲשֶׁר는 앞선 순종이 야훼의 명령과 정확히 일치함을 나타내므로 ‘그대로’로 대응시켰습니다. 시제 관계는 한국어에서 과거 완료를 직접 표시하지 않고 문맥으로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 프로젝트 기본 용례
  rationale: 문서화된 프로젝트 기본 용례에 따라 신성명 יהוה는 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 예언자 갓의 말과 야훼의 명령의 관계
  chosen_reading: 갓의 말은 야훼의 명령에 정확히 대응하는 것으로 표현했습니다.
  alternative_readings:
  - 갓의 말만을 직접적 권위로 보이게 하는 번역
  - 야훼의 명령을 앞세워 갓의 매개성을 약화시키는 번역
  rationale: 본문은 다윗의 행동이 갓의 말을 따른 동시에, 그 말이 야훼의 명령과 일치함을 함께 말합니다. 두 권위를 모두 살려 예언자적 매개성을 보존했습니다.
  doctrine_reference: 예언자적 계시와 하나님의 직접 명령의 일치
