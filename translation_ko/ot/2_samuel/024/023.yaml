  source_fidelity: 본문은 הַכֹּל을 ‘이 모든 것’으로, נָתַן을 과거의 ‘주었습니다’로, 아라우나 뒤의 הַמֶּלֶךְ을 ‘왕’으로 보존하고, יְהוָה를 ‘야훼’로 옮겨 원문과 영어 POB의 핵심 결정을 대체로 충실히 반영합니다. 다만 어휘 대안 주석 b는 יִרְצֶךָ에 관한 것인데 현재 ‘말했습니다’에 붙어 있어, 해당 표현으로 옮겨야 합니다.
  naturalness: ‘야훼 당신의 하나님께서’는 한국어에서 이름과 소유·직함의 연결이 다소 부자연스럽습니다. ‘당신의 하나님이신 야훼께서’가 원문의 ‘야훼, 당신의 하나님’을 자연스럽고 명료하게 나타냅니다.
