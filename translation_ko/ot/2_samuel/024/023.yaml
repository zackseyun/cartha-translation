reference: 2 Samuel 24:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/כֹּ֗ל נָתַ֛ן אֲרַ֥וְנָה הַ/מֶּ֖לֶךְ לַ/מֶּ֑לֶךְ וַ/יֹּ֤אמֶר אֲרַ֨וְנָה֙ אֶל הַ/מֶּ֔לֶךְ יְהוָ֥ה אֱלֹהֶ֖י/ךָ יִרְצֶֽ/ךָס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/023.yaml
  text: Araunah the king gave all this to the king[a]. And Araunah said to the king[b], “May Yahweh your God accept you.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Araunah the king.'' Some translations smooth this to avoid implying royal status for Araunah, but the Hebrew text includes the title.'
    reason: alternative_reading
  - marker: b
    text: Or 'be pleased with you' or 'show you favor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아라우나 왕이 이 모든 것을 왕에게 주었습니다[a]. 그리고 아라우나가 왕에게 말했습니다[b]. “야훼 당신의 하나님께서 당신을 받아 주시기를 바랍니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아라우나 왕’이라고 읽습니다. 일부 번역은 아라우나의 왕적 지위를 피하려고 이를 완화하지만, 본문은 이 호칭을 포함합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘당신을 기뻐하시기를’, ‘당신께 호의를 베푸시기를’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  english_pob_choice: all this
  chosen_korean: 이 모든 것
  alternatives_korean:
  - 모든 것
  - 이것들을 모두
  lexicon: HALOT
  rationale: 직전의 제단과 제물 관련 제공물을 가리키는 총칭이므로, 문맥 지시성을 살린 ‘이 모든 것’이 자연스럽고 범위를 보존합니다.
- source_word: נָתַן
  english_pob_choice: gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 주었습니다
  - 건넸습니다
  - 내주었습니다
  lexicon: HALOT
  rationale: 서사 문맥의 완료 동사를 한국어 서술형 과거로 옮겨, 아라우나가 실제로 내어준 행위를 간결하게 나타냅니다.
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 임금
  lexicon: HALOT
  rationale: 히브리어의 ‘아라우나 왕’이라는 병치를 살리기 위해, 인물명 뒤의 호칭을 그대로 ‘왕’으로 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 여호와 대신 고유명으로서의 ‘야훼’를 사용해 신명 자체를 보존했습니다.
- source_word: יִרְצֶךָ
  english_pob_choice: accept you
  chosen_korean: 당신을 받아 주시기를 바랍니다
  alternatives_korean:
  - 당신을 받아 주시기를 바랍니다
  - 당신을 기뻐하시기를 바랍니다
  - 당신에게 호의를 베푸시기를 바랍니다
  lexicon: HALOT
  rationale: רצה의 핵심은 호의적 수용이므로, 제의적·왕적 맥락에서 자연스러운 ‘받아 주시다’로 옮겨 과도한 해석을 피했습니다.
theological_decisions:
- issue: 아라우나의 호칭 ‘the king’ 보존 여부
  chosen_reading: 본문 그대로 ‘아라우나 왕’으로 유지했습니다.
  alternative_readings:
  - 아라우나가 왕에게 주었습니다
  - 아라우나, 왕이, 왕에게 주었습니다
  rationale: 히브리어 본문이 실제로 ‘아라우나 왕’이라고 병치하므로, 난감해 보이더라도 이를 완화하지 않고 원문이 주는 정보를 그대로 드러내는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: יהוה의 한국어 표기
  chosen_reading: ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명은 일반 호칭이 아니라 언약적 고유명으로 기능하므로, 대체 호칭보다 고유명 표기가 원문 의미를 더 정확히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
