  rationale: 히브리어 본문이 YHWH를 직접 사용하므로, 본문 고유명칭을 보존하는 표기를 선택했습니다.
  doctrine_reference: POB contested terms — יְהוָה YHWH → 야훼
- issue: 다윗의 사죄 요청에서 עָוֹן의 의미
  chosen_reading: 죄책
