  naturalness: ‘다윗의 마음이 그를 찔렀습니다’는 직역 이미지로 이해 가능하나 현대 표준 한국어에서는 ‘다윗은 마음에 찔렸습니다’가 더 자연스럽습니다. 본문의 히브리어 관용구는 각주에서 문자적으로 밝혀 이미지와 의미를 함께 보존할 수 있습니다. 하나님께 직접 드리는 기도에서 ‘당신의 종’은 현대 한국어에서 다소 부자연스러우므로, 공손한 기도 문맥에 맞게 ‘주님의 종’으로 다듬었습니다.
