base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/010.yaml
  text: After that[a], David’s heart struck him after he had counted the people. And David said to Yahweh, “I have sinned greatly in what I have done. And now, Yahweh, please take away the guilt of your servant[c][b], for I have acted very foolishly.”
  footnotes:
  - marker: a
    text: Or “he had numbered the people” or “he had taken a census of the people.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “David’s heart struck him,” an idiom expressing inner conviction or a stricken conscience.
    reason: cultural_note
  - marker: c
    text: Or “the iniquity of your servant.” The Hebrew word can refer to iniquity, guilt, or at times the punishment resulting from sin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤에 다윗의 마음이 그를 찔렀습니다. 다윗은 백성을 계수한 뒤에 야훼께 말했습니다. 「제가 크게 죄를 지었습니다. 제가 한 일입니다. 이제, 야훼여, 부디 당신의 종의 죄책을 거두어 주십시오. 제가 매우 어리석게 행동했습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마음이 그를 찔렀습니다’는 히브리어 관용구를 직역한 것으로, 내적 자각이나 양심의 찔림을 나타냅니다.
    reason: cultural_note
  - marker: b
    text: ‘죄책’은 히브리어 עָוֹן의 가능한 뜻으로, 이곳에서는 죄로 인한 도덕적 부담을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ לֵב דָּוִד אֹת֔וֹ
  english_pob_choice: David’s heart struck him
  chosen_korean: 다윗의 마음이 그를 찔렀습니다
  alternatives_korean:
  - 다윗은 양심의 가책을 받았습니다
  - 다윗의 마음이 그를 쳤습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 이미지(‘마음이 치다/찌르다’)를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 옮겼습니다.
- source_word: אַחֲרֵי כֵ֖ן
  english_pob_choice: after that
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 그 후에
  - 그 후
  lexicon: HALOT
  rationale: 시간 순서를 분명하게 표시하는 간결한 연결어로 처리했습니다.
- source_word: סָפַר אֶת הָעָם
  english_pob_choice: he had counted the people
  chosen_korean: 백성을 계수한 뒤에
  alternatives_korean:
  - 백성을 셈한 뒤에
  - 백성을 센 뒤에
  lexicon: HALOT
  rationale: source가 단순한 ‘count’를 뜻하므로, ‘계수하다’로 행위의 공식성과 문자성을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신적 이름을 경칭 대체어로 바꾸지 않고, 프로젝트 기본값에 따라 야훼로 옮겼습니다.
- source_word: עֲוֺן עַבְדְּךָ
  english_pob_choice: the guilt of your servant
  chosen_korean: 당신의 종의 죄책
  alternatives_korean:
  - 당신의 종의 죄악
  - 당신의 종의 죄
  lexicon: HALOT
  rationale: עָוֹן은 이 문맥에서 죄의 도덕적 부담/책임을 가리키므로, 한국어로는 ‘죄책’이 가장 직접적입니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  lexicon: HALOT
  rationale: 하나님께 드리는 호칭에서 신분적 예속을 강조하기보다 겸손한 자칭으로 기능하므로 ‘종’이 적절합니다.
- source_word: כִּי נִסְכַּ֖לְתִּי מְאֹד
  english_pob_choice: for I have acted very foolishly
  chosen_korean: 제가 매우 어리석게 행동했습니다
  alternatives_korean:
  - 제가 매우 어리석었습니다
  - 제가 매우 어리석은 일을 했습니다
  lexicon: HALOT
  rationale: נִסְכַּלְתִּי는 ‘어리석게 행동하다’의 뜻을 살려, 결과보다 행위의 어리석음을 분명히 했습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
