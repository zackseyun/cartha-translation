  rationale: 이 문맥은 벌의 선고보다 죄로 인한 도덕적 부담의 제거를 구하는 자리이므로, ‘죄책’이 의미 범위를 가장 잘 반영합니다.
  doctrine_reference: Lexical sense of עָוֹן in penitential prayer
