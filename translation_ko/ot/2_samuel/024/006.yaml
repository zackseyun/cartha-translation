  lexicon: HALOT
  rationale: 지명은 한국어에서 보통 조사로 방향성을 자연스럽게 처리하므로, 반복되는 이동 구문 안에서 간결하게 지명만 제시했습니다.
- source_word: תַּחְתִּים חָדְשִׁי
  english_pob_choice: Tahtim-hodshi
  chosen_korean: 타흐팀-호드시
  alternatives_korean:
  - 타흐팀-하드시
  - 타하팀-호드시
  lexicon: HALOT
  rationale: 본문 자체가 불명확한 지명이므로, 추정적 해석을 넣지 않고 음역으로 보존했습니다. 영어 POB의 보류적 처리와 같은 원칙입니다.
- source_word: דָּנָה יַּעַן
  english_pob_choice: Dan-jaan
  chosen_korean: 단-야안
  alternatives_korean:
  - 단-자안
  - 단-얀
  lexicon: HALOT
  rationale: 이 표현도 식별이 불확실한 지명으로 보이므로, 가능한 범위에서 음역을 유지했습니다. 히브리어 자음군을 한국어로 옮길 때의 일반적 표기를 반영했습니다.
- source_word: וְסָבִיב
  english_pob_choice: and around
  chosen_korean: 시돈 주위까지
  alternatives_korean:
  - 시돈 둘레로
  - 시돈 주변을 돌아
  lexicon: HALOT
  rationale: סָבִיב의 ‘둘러 감/주위를 돎’이라는 의미를 한국어에서 자연스럽게 살리되, 여행 경로의 종착 방향을 드러내기 위해 ‘까지’를 덧붙였습니다.
