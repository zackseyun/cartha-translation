base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/006.yaml
  text: They came to Gilead and to the land of Tahtim-hodshi[a], and they came to Dan-jaan[b], and around to Sidon.
  footnotes:
  - marker: a
    text: Hebrew Tahtim-hodshi is obscure; some emend or interpret it as 'the land of the Hittites at Kadesh' or similar, but the underlying place-name is uncertain.
    reason: alternative_reading
  - marker: b
    text: Dan-jaan is likely a place name; its exact identification is uncertain.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 길르앗과 타흐팀-호드시[a] 땅에 이르렀고, 단-야안[b]에 이르렀으며, 시돈으로 돌아서 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 타흐팀-호디시는 뜻과 위치가 불확실한 지명 또는 지명 표현입니다. 일부는 이를 다른 지명 표현으로 고쳐 읽거나 해석하지만, 본문에 따른 정확한 식별은 확실하지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 단-야안은 지명으로 보이지만, 그 정확한 위치는 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  english_pob_choice: they came
