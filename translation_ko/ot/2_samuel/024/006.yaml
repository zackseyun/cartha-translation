  lexicon: HALOT
  rationale: 여정 서술에서 히브리어 wayyiqtol의 연속 동작을 자연스럽게 살리되, 목적지를 향한 이동 완료를 분명히 드러내는 동사로 옮겼습니다.
- source_word: הַגִּלְעָדָה
  english_pob_choice: to Gilead
  chosen_korean: 길르앗
  alternatives_korean:
