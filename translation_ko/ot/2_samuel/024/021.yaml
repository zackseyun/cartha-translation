revisions:
- from: 아라우나는 말했습니다. “어찌하여 왕 내 주께서 그의 종에게 오셨습니까?” 다윗이 말했습니다. “당신에게서 타작마당을 사서, 야훼를 위해 제단을 쌓고, 그 재앙이 백성 위에 머물지 않게 하려는 것입니다.”[a]
  to: 아라우나가 말했습니다. “어찌하여 내 주 왕께서 이 종에게 오셨습니까?” 다윗이 말했습니다. “그대에게서 타작마당을 사서 야훼께 제단을 쌓고, 백성에게서 전염병이 그치게 하려는 것입니다.”[a]
  rationale: 한국어에서 화자의 자기 지칭과 궁정 예우가 분명히 드러나도록 ‘그의 종’을 ‘이 종’으로, 어색한 호칭 어순을 ‘내 주 왕’으로 조정했습니다. 전염병 문맥을 정확히 반영하고, 원문의 공간적 표현 및 3인칭 자기 지칭은 각주에 보존했습니다. ‘그대’는 역사적 왕의 단수 직접 호칭을 현대 한국어의 지나친 무례함 없이 반영합니다.
