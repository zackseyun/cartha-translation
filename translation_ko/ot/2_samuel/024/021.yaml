base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/021.yaml
  text: And Araunah said[a], “Why has my lord the king come to his servant?” And David said, “To buy the threshing floor from you, to build an altar to Yahweh, so that the plague may be stopped from being upon the people.”
  footnotes:
  - marker: a
    text: Or 'your servant.' The Hebrew literally has 'his servant,' reflecting formal courtly self-reference.
    reason: lexical_alternative
translation:
  language: ko
  text: 아라우나가 말했습니다. “어찌하여 내 주 왕께서 이 종에게 오셨습니까?” 다윗이 말했습니다. “그대에게서 타작마당을 사서 야훼께 제단을 쌓고, 백성에게서 전염병이 그치게 하려는 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 종’이라고 합니다. 이는 아라우나가 자신을 낮추어 가리키는 궁정식 3인칭 표현입니다. 또한 ‘백성에게서’는 문자적으로는 ‘백성 위로부터’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  lexicon: HALOT
  rationale: 직접적인 이유를 묻는 의문사이므로, 구어적이기보다 약간 더 문어적인 ‘어찌하여’로 자연스럽게 옮겼습니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: 왕 내 주
  alternatives_korean:
  - 나의 주 왕이여
  - 저의 주 왕
  lexicon: HALOT
  rationale: 히브리어의 예우적 호칭과 왕권 호칭을 함께 살리되, 한국어에서는 ‘왕 내 주’가 가장 압축적으로 대응합니다.
- source_word: עַבְדּוֹ
  english_pob_choice: his servant
  chosen_korean: 그의 종
  alternatives_korean:
  - 당신의 종
  - 임금의 종
  lexicon: HALOT
  rationale: 본문의 3인칭 소유형을 그대로 반영해 ‘그의 종’으로 옮겼습니다. 이 절의 궁정적 자기 비하 표현을 보존합니다.
- source_word: לִקְנוֹת מֵעִמְּךָ
  english_pob_choice: to buy ... from you
  chosen_korean: 당신에게서 ... 사서
  alternatives_korean:
  - 당신에게서 ... 구매하여
  - 당신으로부터 ... 사서
  lexicon: HALOT
  rationale: 거래 맥락에서 자연스러운 현대 한국어로 옮기되, 출처를 나타내는 전치사 의미는 ‘당신에게서’로 살렸습니다.
- source_word: לִבְנוֹת מִזְבֵּחַ
  english_pob_choice: to build an altar
  chosen_korean: 제단을 쌓고
  alternatives_korean:
  - 제단을 세우고
  - 제단을 건축하고
  lexicon: HALOT
  rationale: 제의적 문맥에서 ‘쌓다’가 한국어 성경 문체에 자연스럽고, 단순 건축보다 제단 조성의 뉘앙스를 잘 드러냅니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼를 위해
  alternatives_korean:
  - 야훼께
  - 야훼에게
  lexicon: HALOT
  rationale: 희생 제단의 목적/귀속을 드러내기 위해 ‘를 위해’로 풀어, 야훼께 드리는 제단임을 분명히 했습니다.
- source_word: וְתֵעָצַר הַמַּגֵּפָה מֵעַל הָעָם
  english_pob_choice: so that the plague may be stopped from being upon the people
  chosen_korean: 그 재앙이 백성 위에 머물지 않게 하려는 것입니다
  alternatives_korean:
  - 그 재앙이 백성 위에서 멈추게 하려는 것입니다
  - 그 재앙이 백성에게서 거두어지게 하려는 것입니다
  lexicon: HALOT
  rationale: ‘머물다’로 ‘위에 있다’는 히브리어 공간 표현을 보존하면서, 종결 목적절로 자연스럽게 구성했습니다.
