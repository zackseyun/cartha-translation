source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יָד֨/וֹ הַ/מַּלְאָ֥ךְ יְרֽוּשָׁלִַם֮ לְ/שַׁחֲתָ/הּ֒ וַ/יִּנָּ֤חֶם יְהוָה֙ אֶל הָ֣/רָעָ֔ה וַ֠/יֹּאמֶר לַ/מַּלְאָ֞ךְ הַ/מַּשְׁחִ֤ית בָּ/עָם֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ הָיָ֔ה עִם גֹּ֖רֶן ה/אורנה הַ/יְבֻסִֽי׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/016.yaml
  text: When the angel stretched out his hand toward Jerusalem to destroy it[a], Yahweh relented concerning the calamity and said to the angel who was destroying the people, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was by the threshing floor of Araunah the Jebusite.
  footnotes:
  - marker: a
    text: Or, “the LORD relented from the disaster.” The Hebrew says literally “relented concerning the calamity/disaster,” with רָעָה here meaning calamity, not moral evil.
    reason: lexical_alternative
  - marker: b
    text: Araunah is called Ornan in the parallel account in 1 Chronicles 21:15.
    reason: cross_reference
translation:
  language: ko
  text: 그가 손을 예루살렘으로 펴서 그것을 멸하려 하자, 야훼께서 그 재앙에 대하여 뜻을 돌이키시고, 백성을 멸하던 천사에게 말씀하셨습니다. “그만하라. 이제 네 손을 거두어라.” 그때 야훼의 천사는 오르난이라는 여부스 사람의 타작마당 곁에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “재난”으로 옮길 수 있습니다. 히브리어 רָעָה는 여기서 도덕적 악이 아니라 재앙을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 오르난은 역대기 평행본문에서 오난으로 불립니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַ/יִּשְׁלַח יָד֨/וֹ
  english_pob_choice: stretched out his hand
  chosen_korean: 손을 … 펴서
  alternatives_korean:
  - 손을 내밀어서
  - 손을 뻗어서
  lexicon: HALOT
  rationale: 손을 뻗는 동작이라는 구체적 이미지를 살리면서, 한국어에서는 ‘손을 펴다’가 심판 행위를 시작하는 뉘앙스를 자연스럽게 전달합니다.
- source_word: וַ/יִּנָּחֶם יְהוָה֙ אֶל הָ֣/רָעָ֔ה
  english_pob_choice: Yahweh relented concerning the calamity
  chosen_korean: 야훼께서 그 재앙에 대하여 뜻을 돌이키시고
  alternatives_korean:
  - 야훼께서 그 재앙을 거두시고
  - 야훼께서 그 재난에 대해 후회하시고
  lexicon: HALOT
  rationale: נחם의 여기서는 ‘뜻을 돌이키다/돌이키시다’가 문맥상 가장 적절하고, רָעָה는 도덕적 악이 아니라 재앙을 가리키므로 ‘재앙’으로 옮겼습니다.
- source_word: הַ/מַּלְאָ֞ךְ הַ/מַּשְׁחִ֤ית בָּ/עָם֙
  english_pob_choice: the angel who was destroying the people
  chosen_korean: 백성을 멸하던 천사
  alternatives_korean:
  - 백성을 파멸시키던 천사
  - 백성을 멸망시키던 천사
  lexicon: HALOT
  rationale: 진행 중인 파괴 행위를 나타내는 분사이므로 서술형으로 처리했고, ‘천사’는 이 문맥의 하늘 사자를 반영합니다.
- source_word: רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ
  english_pob_choice: Enough; now withdraw your hand
  chosen_korean: “그만하라. 이제 네 손을 거두어라.”
  alternatives_korean:
  - “이제 그만해라. 손을 거두어라.”
  - “충분하다. 이제 네 손을 거두어라.”
  lexicon: HALOT
  rationale: רַב의 감탄사적 용법을 ‘그만하라’로 간결하게 살리고, הֶרֶף יָדֶךָ는 이미 내린 행동을 중단하라는 관용구로 이해해 ‘손을 거두어라’로 옮겼습니다.
- source_word: הָיָ֔ה עִם גֹּ֖רֶן ה/אורנה הַ/יְבֻסִֽי
  english_pob_choice: was by the threshing floor of Araunah the Jebusite
  chosen_korean: 오르난이라는 여부스 사람의 타작마당 곁에
  alternatives_korean:
  - 아라우나라는 여부스 사람의 타작마당 곁에
  - 오르난이라는 여부스 사람의 타작마당에
  lexicon: HALOT
  rationale: ‘with/by’의 위치 관계를 한국어 ‘곁에’로 자연스럽게 표현했고, מקור 절의 인명은 사무엘서 본문의 형태인 오르난/아라우나 변이를 주석으로 남길 수 있도록 ‘오르난’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 감정/태도 변화 표현
  chosen_reading: ‘뜻을 돌이키시고’로 옮겨, 하나님이 도덕적으로 잘못을 인정하셨다는 뜻이 아니라 심판을 더 진행하지 않으시는 전환을 나타냈습니다.
  alternative_readings:
  - ‘후회하시고’
  - ‘재앙을 거두시고’
  rationale: 히브리어 נחם은 여기서 선언된 재앙을 멈추시는 방향 전환을 말하므로, ‘뜻을 돌이키시다’가 인격적 표현을 유지하면서도 신학적 오해를 줄입니다.
  doctrine_reference: Translation philosophy §3
- issue: יְהוָה와 ‘야훼’ 표기
  chosen_reading: 본문과 천사 구문 모두에서 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 이 프로젝트의 일관된 원칙에 따라 신명사를 음역해 고유성을 보존하고, 본문의 인용/호칭을 제목어로 환원하지 않았습니다.
  doctrine_reference: Contested terms table for יְהוָה
