id: 2SA.24.24
reference: 2 Samuel 24:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל אֲרַ֗וְנָה לֹ֚א כִּֽי קָנ֨וֹ אֶקְנֶ֤ה מֵ/אֽוֹתְ/ךָ֙ בִּ/מְחִ֔יר וְ/לֹ֧א אַעֲלֶ֛ה לַ/יהוָ֥ה אֱלֹהַ֖/י עֹל֣וֹת חִנָּ֑ם וַ/יִּ֨קֶן דָּוִ֤ד אֶת הַ/גֹּ֨רֶן֙ וְ/אֶת הַ/בָּקָ֔ר בְּ/כֶ֖סֶף שְׁקָלִ֥ים חֲמִשִּֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/024.yaml
  text: But the king said to Araunah[a], “No, but I will surely buy it from you for a price[c][b]. I will not offer to Yahweh my God burnt offerings that cost me nothing.” So David bought the threshing floor and the cattle for fifty shekels of silver.
  footnotes:
  - marker: a
    text: Or, more literally, “burnt offerings for nothing” or “free of charge.”
    reason: lexical_alternative
  - marker: b
    text: In 1 Chronicles 21:25, David pays six hundred shekels of gold for the site; this verse specifies fifty shekels of silver for the threshing floor and the cattle.
    reason: cross_reference
  - marker: c
    text: Or “the oxen.” The Hebrew term can refer collectively to cattle or more specifically to bovines used for labor/sacrifice.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 왕이 아라우나에게 말했습니다. “아니오, 나는 반드시 대가를 치르고 당신에게서 사겠습니다. 내가 내 하나님 야훼께 값없는 번제물을 드리지 않겠습니다.” 그래서 다윗은 은 오십 세겔로 타작마당과 소를 샀습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘값없는’은 문자적으로는 ‘공짜로/값 없이’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 역대상 21:25에서는 이 장소 전체를 금 육백 세겔로 산 것으로 기록합니다.
    reason: cross_reference
  - marker: c
    text: 히브리어 בָּקָר는 소를 가리킬 수도 있고, 더 넓게는 가축을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרַוְנָה
  english_pob_choice: Araunah
  chosen_korean: 아라우나
  alternatives_korean:
  - 아르오나
  lexicon: 고유명사 음역
  rationale: 히브리어 본문에 있는 이름을 현대 한국어 음역으로 옮겼습니다. 역대기 병행본문의 오르난이 아니라 이 본문의 아라우나를 따릅니다.
- source_word: קָנֹו אֶקְנֶה ... בִּמְחִיר
  english_pob_choice: I will surely buy it from you for a price
  chosen_korean: 반드시 대가를 치르고 당신에게서 사겠습니다
  alternatives_korean:
  - 값을 치르고 사겠습니다
  - 분명히 당신에게서 사겠습니다
  lexicon: HALOT
  rationale: 강조형(부정사 절대형+미완료형)의 확언을 ‘반드시’로 살리고, בִּמְחִיר의 상업적 의미를 ‘대가를 치르고’로 자연스럽게 표현했습니다.
- source_word: לַיהוָה אֱלֹהַי עֹלוֹת חִנָּם
  english_pob_choice: I will not offer to Yahweh my God burnt offerings that cost me nothing
  chosen_korean: 내가 내 하나님 야훼께 값없는 번제물을 드리지 않겠습니다
  alternatives_korean:
  - 내 하나님 야훼께 공짜 번제물을 드리지 않겠습니다
  - 내 하나님 야훼께 아무 대가도 들지 않은 번제물을 드리지 않겠습니다
  lexicon: 신명기/제사 어휘
  rationale: POB의 야훼를 따르되, 한국어에서 번제물의 제사적 성격을 유지하면서 חִנָּם의 ‘값없음/공짜’ 뉘앙스를 ‘값없는’으로 압축했습니다.
- source_word: הַגֹּרֶן וְאֶת הַבָּקָר
  english_pob_choice: the threshing floor and the cattle
  chosen_korean: 타작마당과 소
  alternatives_korean:
  - 타작마당과 가축
  - 타작마당과 소떼
  lexicon: HALOT
  rationale: הַבָּקָר는 문맥상 제사용으로 함께 제시된 가축을 가리키므로, 한국어에서는 가장 직접적인 ‘소’로 옮겨 구매 대상의 구체성을 살렸습니다.
- source_word: בְּכֶסֶף שְׁקָלִים חֲמִשִּׁים
  english_pob_choice: for fifty shekels of silver
  chosen_korean: 은 오십 세겔로
  alternatives_korean:
  - 은으로 오십 세겔에
  - 은 오십 세겔의 값으로
  lexicon: HALOT
  rationale: 히브리어의 가격 표기를 한국어에서 자연스러운 금액 표현으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 본문은 하나님 이름을 직접 사용하므로, 프로젝트 기본값에 따라 언약적 신명성을 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: “값없는 번제물”의 의미
  chosen_reading: 제사 자체의 무가치함이 아니라, 다윗이 개인적 희생 없이 드리는 예배를 거부하는 말로 이해했습니다.
  alternative_readings:
  - 공짜 번제물
  - 아무 대가 없는 번제물
  rationale: 문맥상 다윗은 하나님께 드리는 제물이 실제 비용과 헌신을 포함해야 함을 강조합니다. 한국어는 이 긴장을 유지하면서도 예배의 진정성을 드러내야 합니다.
  doctrine_reference: 제사 윤리와 헌신의 원리
