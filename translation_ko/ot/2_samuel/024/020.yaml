base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/020.yaml
  text: Araunah looked out and saw the king and his servants passing by him[a]. So Araunah went out and bowed down to the king with his face to the ground.
  footnotes:
  - marker: a
    text: Or 'passing by him' or 'approaching him'; the Hebrew expression literally describes the king and his servants as moving in relation to Araunah.
    reason: lexical_alternative
translation:
  language: ko
  text: 아라우나가 내다보니, 왕과 그의 신하들이 그에게 다가오고 있었습니다[a]. 그래서 아라우나는 나가 왕 앞에 얼굴을 땅에 대고 엎드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 왕과 그의 신하들이 아라우나와 관련하여 움직이고 있음을 표현합니다. ‘그를 지나가고 있었다’ 또는 ‘그에게 다가오고 있었다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  english_pob_choice: looked out
  chosen_korean: 올라가 보니
  alternatives_korean:
  - 내다보니
  - 밖을 내다보니
  lexicon: HALOT
  rationale: 높은 곳이나 열린 곳에서 바깥을 살펴보는 뉘앙스를 살리기 위해 단순한 ‘보다’보다 상황이 드러나는 표현을 택했습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들
  alternatives_korean:
  - 그의 시종들
  - 그의 신하들
  lexicon: HALOT
  rationale: 문맥상 왕의 수행원을 가리키지만, מקור의 기본 의미를 따라 ‘종들’로 옮기되 신분을 과도하게 해석하지 않았습니다.
- source_word: עֹבְרִים עָלָיו
  english_pob_choice: passing by him
  chosen_korean: 자기 쪽으로 지나가고 있었습니다
  alternatives_korean:
  - 그를 지나가고 있었습니다
  - 그에게 다가오고 있었습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘그의 위/곁을 지나가다’라는 관계적 이동을 나타내므로, 아라우나의 시점에서 왕 일행이 그의 자리 쪽으로 이동하는 장면을 자연스럽게 반영했습니다.
- source_word: וַיִּשְׁתַּחוּ
  english_pob_choice: bowed down
  chosen_korean: 얼굴을 땅에 대고 절했습니다
  alternatives_korean:
  - 몸을 굽혀 경배했습니다
  - 엎드려 절했습니다
  lexicon: HALOT
  rationale: 인간 왕에게 하는 예를 가리키므로 예배로 번역하지 않고, 실제 몸짓이 드러나는 표현으로 옮겼습니다.
theological_decisions:
- issue: 아라우나의 몸짓을 예배로 볼 것인지 예로 볼 것인지
  chosen_reading: 인간 왕 다윗에게 드리는 관례적 경의로 이해하고 ‘절했습니다’로 번역했습니다.
  alternative_readings:
  - 왕을 경배했습니다
  - 엎드려 경배했습니다
  rationale: 히브리어 동사는 예배와 절의 둘 다를 가질 수 있지만, 여기서는 대상이 인간 왕이므로 신적 예배를 암시하지 않도록 해야 합니다.
  doctrine_reference: Translation philosophy §3 (source-directed, preserve tension without importing doctrinal claims)
