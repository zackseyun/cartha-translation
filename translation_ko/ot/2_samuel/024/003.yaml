base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/003.yaml
  text: But Joab said to the king[a], “May Yahweh your God add to the people a hundred times as many as they are, and may the eyes of my lord the king see it. But why does my lord the king delight in this thing?”
  footnotes:
  - marker: a
    text: Or 'and may the eyes of my lord the king see [them].' The Hebrew leaves the object implicit; the sense is that Joab wishes the king to live to witness such an increase.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 요압이 왕에게 말했습니다. 「야훼 당신의 하나님께서 이 백성을 지금보다 백 배나 더 많게 하시고, 내 주 왕께서 친히 그것을[a] 보시게 하시기를 바랍니다. 그런데 내 주 왕께서는 어찌하여 이 일을 바라십니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘보다’의 목적어를 직접 밝히지 않습니다. 문맥상 왕이 백성의 그러한 증가를 직접 목격하게 되기를 바라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 여호와 당신의 하나님
  - 주 당신의 하나님
  lexicon: WLC/HALOT
  rationale: יהוה는 관용적 대체어가 아니라 고유명사이므로 프로젝트 기본값대로 야훼로 옮겼고, אֱלֹהֶיךָ는 2인칭 단수 소유를 자연스럽게 당신의 하나님으로 옮겼습니다.
- source_word: וְיוֹסֵף ... אֶל הָעָם כָּהֵם וְכָהֵם מֵאָה פְעָמִים
  english_pob_choice: May ... add to the people a hundred times as many as they are
  chosen_korean: 백성을 지금의 백성보다 백 배나 더하게 하시고
  alternatives_korean:
  - 백성에게 백 배나 더하게 하시고
  - 그들이 지금보다 백 배가 되게 하시고
  lexicon: WLC/HALOT
  rationale: 증가를 뜻하는 jussive를 한국어 바람형으로 살리면서, כָּהֵם וְכָהֵם과 מֵאָה פְעָמִים의 반복·배수 감각을 '지금의 백성보다 백 배나'로 압축해 과도한 설명 없이 전달했습니다.
- source_word: וְעֵינֵי אֲדֹנִי הַמֶּלֶךְ רֹאוֹת
  english_pob_choice: and may the eyes of my lord the king see it
  chosen_korean: 내 주 왕의 눈이 그것을 보게 하시기를 바랍니다
  alternatives_korean:
  - 내 주 왕의 눈이 그것을 보게 해 주시기를 바랍니다
  - 내 주 왕께서 그것을 보시게 하시기를 바랍니다
  lexicon: WLC/HALOT
  rationale: 히브리어는 목적어가 생략되어 있지만 문맥상 왕이 그 증가를 목격한다는 뜻이므로, 한국어에서는 그것을을 보게 하시기를로 보완해 자연스럽게 옮겼습니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: 내 주 왕
  alternatives_korean:
  - 나의 주인이신 왕
  - 주군 왕
  lexicon: WLC/HALOT
  rationale: 궁정 호칭을 현대 한국어에서 가장 자연스럽게 반영하는 표현으로 내 주 왕을 택해, 신하가 왕에게 아뢰는 높임의 긴장을 유지했습니다.
- source_word: בַּדָּבָר הַזֶּה
  english_pob_choice: in this thing
  chosen_korean: 이런 일
  alternatives_korean:
  - 이 일
  - 이 문제
  lexicon: WLC/HALOT
  rationale: דָּבָר의 넓은 의미를 살리면서도 한국어에서 어색하지 않게, 다소 못마땅한 왕의 계획을 가리키는 뉘앙스를 '이런 일'로 옮겼습니다.
