base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/015.yaml
  text: 'So they arose and crossed over by number: twelve for Benjamin and for Ish-bosheth the son of Saul[d][c][b][a], and twelve from the servants of David.'
  footnotes:
  - marker: a
    text: Or 'passed over' or 'went over.' The Hebrew verb can denote movement across or over into the designated place.
    reason: lexical_alternative
  - marker: b
    text: Or 'from Benjamin.' The Hebrew preposition may indicate either origin or affiliation; here it likely means they represented Benjamin and Ish-bosheth.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'Ish-bosheth'; elsewhere the related form 'Eshbaal' appears in the Old Testament tradition.
    reason: alternative_reading
  - marker: d
    text: Or 'from David's servants' or more interpretively 'from David's men.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 일어나 수대로 건너갔습니다.[a] 베냐민과 사울의 아들 이스보셋 편에서 열두 명이 나왔고,[b][c] 다윗의 종들 가운데서도 열두 명이 나왔습니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘건너갔습니다’는 ‘지나갔습니다’ 또는 ‘넘어갔습니다’로도 옮길 수 있습니다. 히브리어 동사는 정해진 장소를 향하여 건너가거나 지나가는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘베냐민과 … 이스보셋 편에서’는 ‘베냐민과 사울의 아들 이스보셋을 위하여’ 또는 ‘베냐민과 사울의 아들 이스보셋에게 속한’으로도 옮길 수 있습니다. 여기의 전치사는 출신지보다는 소속 또는 대표 관계를 나타낼 가능성이 큽니다. 열두 명은 베냐민과 이스보셋에게 각각 열두 명이라는 뜻이 아니라, 그들의 편에서 나온 한 집단의 열두 명입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 본문은 ‘이스보셋’으로 되어 있으며, 구약 전승의 다른 곳에는 관련 형태인 ‘에스바알’이 나타납니다.
    reason: alternative_reading
  - marker: d
    text: ‘다윗의 종들 가운데서’는 ‘다윗의 종들로부터’로도 옮길 수 있으며, 군사 문맥에서는 더 풀어 ‘다윗의 부하들 가운데서’라고 할 수도 있습니다.
    reason: lexical_alternative
