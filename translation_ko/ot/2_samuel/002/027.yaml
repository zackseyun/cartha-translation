  text: וַ/יֹּ֣אמֶר יוֹאָ֔ב חַ֚י הָֽ/אֱלֹהִ֔ים כִּ֥י לוּלֵ֖א דִּבַּ֑רְתָּ כִּ֣י אָ֤ז מֵֽ/הַ/בֹּ֨קֶר֙ נַעֲלָ֣ה הָ/עָ֔ם אִ֖ישׁ מֵ/אַחֲרֵ֥י אָחִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/027.yaml
  text: Joab said[a], “As God lives, if you had not spoken, then from the morning the people would have gone up[b], each from following his brother.”
  footnotes:
  - marker: a
    text: Or 'since morning.'
    reason: lexical_alternative
  - marker: b
    text: That is, 'each would have stopped pursuing his brother.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요압이 말했습니다. 「하나님께서 살아 계심을 두고 맹세하노니, 네가 말하지 않았더라면 그때는 아침부터라도 백성이 각기 자기 형제를 뒤따르던 자리에서 물러났을 것입니다」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아침부터라도’로 자연스럽게 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 즉, ‘각자 자기 형제를 추격하던 일을 그쳤을 것이다’는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חַי הָאֱלֹהִים
  english_pob_choice: As God lives
  chosen_korean: 하나님께서 살아 계심을 두고 맹세하노니
  alternatives_korean:
  - 살아 계신 하나님을 두고
  - 하나님께서 살아 계심을 걸고
  lexicon: HALOT
  rationale: 히브리어의 표준 맹세 공식으로, 직역의 긴장과 한국어 자연스러움을 함께 살리기 위해 맹세 표현으로 옮겼습니다.
- source_word: לוּלֵא דִּבַּרְתָּ
  english_pob_choice: if you had not spoken
  chosen_korean: 네가 말하지 않았더라면
  alternatives_korean:
  - 네가 말하지 않았더라면야
  - 네가 아무 말도 하지 않았더라면
  lexicon: HALOT
  rationale: 반사실 조건을 드러내는 형태로 옮겨, ‘말하다’의 직접적 의미를 유지했습니다.
- source_word: מֵהַבֹּקֶר
  english_pob_choice: from the morning
  chosen_korean: 아침부터라도
  alternatives_korean:
  - 아침부터
  - 새벽부터
  lexicon: HALOT
  rationale: 문맥상 이미 진행 중이던 추격이 아침 시점부터 중단되었을 가능성을 살려, 본문 의미를 해치지 않는 범위에서 시간의 기점을 자연스럽게 표현했습니다.
- source_word: אִישׁ מֵאַחֲרֵי אָחִיו
  english_pob_choice: each from following his brother
  chosen_korean: 각기 자기 형제를 뒤따르던 자리에서 물러났을 것입니다
  alternatives_korean:
  - 각자 자기 형제를 뒤따르던 일을 멈췄을 것입니다
  - 각기 형제를 추격하던 것을 그쳤을 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘각 사람, 자기 형제의 뒤에서’이므로, 전쟁 맥락에서의 추격 중단을 한국어로 풀어 주되 ‘형제’ 이미지는 보존했습니다.
theological_decisions:
- issue: 전쟁 서사에서의 ‘형제’ 언어
  chosen_reading: 같은 이스라엘 사람끼리의 추격 중단을 가리키는 말로 그대로 ‘형제’를 유지했습니다.
  alternative_readings:
  - 동족
  - 서로
  rationale: 본문의 직설적 혈연/동족 표현을 완화하면 요압의 맹세와 책망의 강도가 약해집니다.
  doctrine_reference: 언약 공동체 내부의 갈등과 살상 자제
- issue: 맹세 공식의 한국어 높임
  chosen_reading: 직접 화자 발화에서는 고전적 종교어보다 현대 합쇼체를 기본으로 하되, ‘하나님께서 살아 계심을 두고 맹세하노니’로 맹세의 엄중함을 드러냈습니다.
  alternative_readings:
  - 하나님이 살아 계심을 두고
  - 살아 계신 하나님을 두고 맹세합니다
  rationale: 본문의 강한 서약 공식은 문어적 격식이 필요하므로, 현대적이면서도 엄중한 서약 표현을 택했습니다.
  doctrine_reference: 서약과 진술의 엄중성
