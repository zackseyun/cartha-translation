- from: 요압이 말했습니다. 「하나님께서 살아 계심을 두고 맹세하노니, 네가 말하지 않았더라면 그때는 아침부터라도 백성이 각기 자기 형제를 뒤따르던 자리에서 물러났을 것입니다」[a][b]
  to: 요압이 말했습니다. “하나님께서 살아 계심을 두고 맹세합니다. 네가 말하지 않았더라면, 그랬다면 아침부터[a] 백성이 각자 자기 형제를 뒤쫓는 일을 그쳤을 것입니다[b].”
  rationale: 불필요한 양보 표현을 제거하고, 반사실 결론을 ‘그랬다면’으로 표시했습니다. נַעֲלָה와 ‘각 사람이 자기 형제의 뒤에서’라는 표현은 본문에서 문맥상 자연스러운 ‘뒤쫓는 일을 그쳤다’로 옮기고, 직역 및 해석 근거는 각주에 보존했습니다. 맹세 표현도 현대 합쇼체로 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:27:04Z'
