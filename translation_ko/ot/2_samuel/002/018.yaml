  text: וַ/יִּֽהְיוּ שָׁ֗ם שְׁלֹשָׁה֙ בְּנֵ֣י צְרוּיָ֔ה יוֹאָ֥ב וַ/אֲבִישַׁ֖י וַ/עֲשָׂהאֵ֑ל וַ/עֲשָׂהאֵל֙ קַ֣ל בְּ/רַגְלָ֔י/ו כְּ/אַחַ֥ד הַ/צְּבָיִ֖ם אֲשֶׁ֥ר בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/018.yaml
  text: 'Now the three sons of Zeruiah were there: Joab[a], Abishai, and Asahel. And Asahel was swift on his feet like one of the gazelles that are in the field.'
  footnotes:
  - marker: a
    text: Or 'like one of the deer that are in the field.' The Hebrew צְבִי can be rendered more broadly as a deer-like wild animal, though 'gazelle' is the more precise choice here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에는 스루야의 세 아들 — 요압, 아비새, 아사헬 — 이 있었습니다. 아사헬은 들에 있는 암사슴들 가운데 하나처럼 발이 아주 빨랐습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם
  english_pob_choice: were there
  chosen_korean: 그곳에는 ... 있었습니다
  alternatives_korean:
  - 그곳에 있었습니다
  - 그곳에 있었습니다만
  lexicon: HALOT
  rationale: 장소 부사어와 존재 진술을 자연스러운 서술형으로 옮겼으며, 역사의 장면 전개를 살려 '그곳에는'을 사용했습니다.
- source_word: שְׁלֹשָׁה בְּנֵי צְרוּיָה
  english_pob_choice: the three sons of Zeruiah
  chosen_korean: 스루야의 세 아들
  alternatives_korean:
  - 스루야의 세 아들들
  - 스루야에게서 난 세 아들
  lexicon: HALOT
  rationale: 정관적 표지를 한국어에서는 자연스럽게 생략하고, 혈연 관계를 직접적으로 드러내는 '세 아들'로 옮겼습니다.
- source_word: קַל בְּרַגְלָיו
  english_pob_choice: swift on his feet
  chosen_korean: 발이 아주 빨랐습니다
  alternatives_korean:
  - 발이 날쌌습니다
  - 발이 빠랐습니다
  - 달리기가 아주 빨랐습니다
  lexicon: HALOT
  rationale: 직역보다 한국어 관용에 맞게 속도를 나타내되, '발' 이미지는 유지했습니다.
- source_word: כְּאַחַד הַצְּבָיִם
  english_pob_choice: like one of the gazelles
  chosen_korean: 들에 있는 암사슴들 가운데 하나처럼
  alternatives_korean:
  - 들에 있는 가젤들 가운데 하나처럼
  - 들판의 사슴들 가운데 하나처럼
  lexicon: HALOT
  rationale: צְבִי를 더 정확한 한국어 대응인 '암사슴' 계열로 옮기되, 본문의 비교 이미지를 분명히 하려고 복수 집합 표현을 사용했습니다.
- source_word: בַּשָּׂדֶה
  english_pob_choice: in the field
  chosen_korean: 들에 있는
  alternatives_korean:
  - 들판에 있는
  - 들에 사는
  lexicon: HALOT
  rationale: 경작지보다 야생의 서식지를 가리키는 뉘앙스를 살려 '들에 있는'으로 옮겼습니다.
