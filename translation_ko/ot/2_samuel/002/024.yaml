  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּרְדְּפ֛וּ יוֹאָ֥ב וַ/אֲבִישַׁ֖י אַחֲרֵ֣י אַבְנֵ֑ר וְ/הַ/שֶּׁ֣מֶשׁ בָּ֔אָה וְ/הֵ֗מָּה בָּ֚אוּ עַד גִּבְעַ֣ת אַמָּ֔ה אֲשֶׁר֙ עַל פְּנֵי גִ֔יחַ דֶּ֖רֶךְ מִדְבַּ֥ר גִּבְעֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/024.yaml
  text: Joab and Abishai pursued Abner[a], and the sun went down; and they came as far as the hill of Ammah[b], which is opposite Giah on the way to the wilderness of Gibeon.
  footnotes:
  - marker: a
    text: Or 'which is before Giah'; the Hebrew expression can denote a position in front of or opposite a place.
    reason: lexical_alternative
  - marker: b
    text: Or 'by the road to the wilderness of Gibeon'; the Hebrew may emphasize the route rather than simply the direction.
    reason: lexical_alternative
translation:
  language: ko
  text: 요압과 아비새가 아브넬을 뒤쫓았고, 해가 졌으며, 그들은 기브온 광야의 길가에 있는 아마의 언덕과 마주한 곳까지 이르렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기아 맞은편에 있는’으로도 옮길 수 있습니다. 히브리어 표현은 어떤 장소의 ‘앞’ 또는 ‘맞은편’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기브온 광야로 가는 길에’로도 옮길 수 있습니다. 히브리어는 단순한 방향보다 길/노선을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  english_pob_choice: pursued
  chosen_korean: 뒤쫓았고
  alternatives_korean:
  - 추격했고
  - 쫓았고
  lexicon: HALOT
  rationale: רדף는 군사적 추격을 뜻하므로, 한국어에서는 자연스럽고 구체적인 ‘뒤쫓다’로 옮기는 것이 가장 직접적입니다.
- source_word: וְהַשֶּׁמֶשׁ בָּאָה
  english_pob_choice: the sun went down
  chosen_korean: 해가 졌으며
  alternatives_korean:
  - 해가 내려갔으며
  - 해가 저물었으며
  lexicon: HALOT
  rationale: 직역하면 ‘해가 왔다’이지만 한국어 관용으로는 일몰을 ‘해가 지다’라고 표현하는 것이 원문의 시간 경과를 가장 분명하게 전달합니다.
- source_word: עַד
  english_pob_choice: as far as
  chosen_korean: …까지 이르렀습니다
  alternatives_korean:
  - …까지 갔습니다
  - …에 이르렀습니다
  lexicon: HALOT
  rationale: 장소의 도달 지점을 나타내므로 ‘…까지 이르렀다’가 범위를 자연스럽게 살립니다.
- source_word: אֲשֶׁר עַל פְּנֵי גִיחַ
  english_pob_choice: which is opposite Giah
  chosen_korean: 기브온 광야의 길가에 있는 아마의 언덕과 마주한 곳
  alternatives_korean:
  - 기아 앞에 있는
  - 기아 맞은편에 있는
  lexicon: HALOT
  rationale: עַל־פְּנֵי는 ‘앞에/맞은편에’의 의미폭이 있어, 지리적 관계를 한국어로는 ‘마주한 곳’으로 완화 없이 표현하는 편이 안전합니다.
- source_word: דֶּרֶךְ מִדְבַּר גִּבְעוֹן
  english_pob_choice: on the way to the wilderness of Gibeon
  chosen_korean: 기브온 광야의 길가
  alternatives_korean:
  - 기브온 광야로 가는 길에
  - 기브온 광야의 길을 따라
  lexicon: HALOT
  rationale: דֶּרֶךְ는 단순한 방향보다 ‘길/도로’의 의미를 가지므로, POB의 route 중심 뉘앙스를 살려 ‘길가에 있는’으로 옮겼습니다.
- source_word: גִּבְעַת אַמָּה
  english_pob_choice: the hill of Ammah
  chosen_korean: 아마의 언덕
  alternatives_korean:
  - 아마 언덕
  - 아마산
  lexicon: HALOT
  rationale: 구성명사 구문을 한국어에서는 소유격 구조로 옮기는 것이 가장 자연스럽고, 지명을 과도하게 설명하지 않습니다.
