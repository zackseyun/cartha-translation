source:
  edition: WLC
  text: וַ/אֲנָשָׁ֧י/ו אֲשֶׁר עִמּ֛/וֹ הֶעֱלָ֥ה דָוִ֖ד אִ֣ישׁ וּ/בֵית֑/וֹ וַ/יֵּשְׁב֖וּ בְּ/עָרֵ֥י חֶבְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/003.yaml
  text: And David brought up the men who were with him[a], each man with his household, and they settled in the towns of Hebron.
  footnotes:
  - marker: a
    text: Or 'in the cities of Hebron.' The Hebrew may refer to the settlements belonging to the Hebron area rather than the single city center.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 자기와 함께 있던 사람들과 각 사람의 집안을 데리고 올라가서, 헤브론의 마을들에 정착하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헤브론의 도시들에.’ 히브리어는 단일 도시 중심이 아니라 헤브론 권역의 정착지들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנָשָׁיו
  english_pob_choice: the men
  chosen_korean: 사람들과
  alternatives_korean:
  - 그의 남자들과
  - 그의 사람들과
  lexicon: HALOT
  rationale: 문맥상 다윗의 동행 집단을 가리키므로, 영어 POB의 'the men'에 해당하는 남성 집단성을 한국어에서 자연스럽게 담아 '사람들'로 옮겼습니다. 이어지는 '자기와 함께 있던'이 소속 관계를 분명히 해 줍니다.
- source_word: הֶעֱלָה
  english_pob_choice: brought up
  chosen_korean: 데리고 올라가서
  alternatives_korean:
  - 데리고 올라오게 하여
  - 올려보내서
  lexicon: HALOT
  rationale: עלה의 사역형은 단순 이동보다 ‘올라가게 하다/데리고 올라가다’의 상승 방향을 포함하므로, 지리적 상승을 살린 표현으로 옮겼습니다.
- source_word: אִישׁ וּבֵיתוֹ
  english_pob_choice: each man with his household
  chosen_korean: 각 사람의 집안을
  alternatives_korean:
  - 각 남자와 그의 집을
  - 각 사람과 그의 가정을
  lexicon: HALOT
  rationale: 분배를 나타내는 אִישׁ 뒤의 표현은 개인 단위의 동반 가족/가구를 뜻하므로, 현대 한국어에서 가장 자연스럽고 의미를 보존하는 '집안'을 선택했습니다.
- source_word: בְּעָרֵי חֶבְרוֹן
  english_pob_choice: in the towns of Hebron
  chosen_korean: 헤브론의 마을들에
  alternatives_korean:
  - 헤브론의 도시들에
  - 헤브론 지역의 마을들에
  lexicon: HALOT
  rationale: עָרִים는 반드시 대도시만을 뜻하지 않으므로, 영어 POB가 시사한 지역적 정착지를 따라 '마을들'로 옮겨 헤브론 권역의 거주지를 가리키게 했습니다.
theological_decisions:
- issue: 2SA.2.3의 지리적 상승 표현
  chosen_reading: 헤브론으로 ‘올라가다’는 단순 이동이 아니라 산지로의 상승을 포함하는 서술로 유지했습니다.
  alternative_readings:
  - 단순히 ‘갔다’로 완화하는 읽기
  rationale: 히브리어 הֶעֱלָה는 산지 지형을 전제한 상승 방향을 담고 있으므로, 이를 약화하지 않고 보존하는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 본문의 지리·서술적 의미 보존 원칙
