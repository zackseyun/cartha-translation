source:
  edition: WLC
  text: וְ/יוֹאָ֨ב בֶּן צְרוּיָ֜ה וְ/עַבְדֵ֤י דָוִד֙ יָֽצְא֔וּ וַֽ/יִּפְגְּשׁ֛וּ/ם עַל בְּרֵכַ֥ת גִּבְע֖וֹן יַחְדָּ֑ו וַ/יֵּ֨שְׁב֜וּ אֵ֤לֶּה עַל הַ/בְּרֵכָה֙ מִ/זֶּ֔ה וְ/אֵ֥לֶּה עַל הַ/בְּרֵכָ֖ה מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/013.yaml
  text: And Joab the son of Zeruiah and the servants of David went out and met them together by the pool of Gibeon. And these sat on one side of the pool[a], and those on the other side of the pool.
  footnotes:
  - marker: a
    text: Or 'reservoir of Gibeon'; the Hebrew word can denote a constructed pool or water reservoir.
    reason: lexical_alternative
translation:
  language: ko
  text: 요압, 세룰야의 아들과 다윗의 종들이 나가서 기브온 못에서 함께 그들을 만났습니다. 그리고 이들은 못 이쪽에, 저들은 못 저쪽에 앉았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 בְּרֵכָה는 인공 못이나 저수지를 가리킬 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וְיוֹאָב
  english_pob_choice: And Joab
  chosen_korean: 요압
  alternatives_korean:
  - 그리고 요압
  - 그때 요압
  lexicon: WLC/HALOT
  rationale: 히브리어 서사 접속사 וְ는 한국어에서 문맥상 자연스럽게 생략할 수 있어, 이름만 앞세워 사건 전개를 간결하게 살렸습니다.
- source_word: בֶּן צְרוּיָה
  english_pob_choice: the son of Zeruiah
  chosen_korean: 세룰야의 아들
  alternatives_korean:
  - 세룰야의 아들인
  - 세룰야의 아들 요압
  lexicon: WLC/HALOT
  rationale: 관계 표지를 더하지 않고 소유격으로 옮겨, 출신 표지를 자연스러운 현대 한국어로 유지했습니다.
- source_word: וְעַבְדֵי דָוִד
  english_pob_choice: and the servants of David
  chosen_korean: 다윗의 종들
  alternatives_korean:
  - 다윗의 종들
  - 다윗의 시종들
  lexicon: WLC/HALOT
  rationale: עבדים의 기본 뜻을 살려 '종들'로 옮겼고, 본문이 군사적 상황이더라도 영어 POB의 직역성을 유지했습니다.
- source_word: בְּרֵכַת גִּבְעוֹן
  english_pob_choice: pool of Gibeon
  chosen_korean: 기브온 못
  alternatives_korean:
  - 기브온의 연못
  - 기브온의 저수지
  lexicon: WLC/HALOT
  rationale: בְּרֵכָה는 인공 수역까지 포함할 수 있지만, 한국어에서는 본문 맥락상 가장 자연스러운 '못'이 간결하고 무난합니다.
- source_word: אֵלֶּה ... וְאֵלֶּה
  english_pob_choice: these ... and those
  chosen_korean: 이들은 ... 저들은
  alternatives_korean:
  - 이 사람들은 ... 저 사람들은
  - 한쪽은 ... 다른 쪽은
  lexicon: WLC/HALOT
  rationale: 지시대명사의 대비를 그대로 살려, 두 진영의 대조를 원문처럼 선명하게 보이도록 했습니다.
theological_decisions:
- issue: 서술의 군사적 뉘앙스와 직역성
  chosen_reading: '''종들''과 ''못 이쪽/저쪽''을 유지해, 전투 직전의 대치 구도를 과장하지 않고 원문이 제시하는 장면 그대로 드러냈습니다.'
  alternative_readings:
  - '''병사들''로 의미를 구체화하는 읽기'
  - '''연못''으로 장소를 풀어 쓰는 읽기'
  rationale: 본문은 직접적으로 병사라는 단어를 쓰지 않고 '다윗의 종들'과 장소 대조만 제시하므로, 한국어에서도 해석을 앞서지 않도록 했습니다.
  doctrine_reference: 문맥 보존과 최소 해석 원칙
