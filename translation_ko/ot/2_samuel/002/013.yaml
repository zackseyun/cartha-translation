base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/013.yaml
  text: And Joab the son of Zeruiah and the servants of David went out and met them together by the pool of Gibeon. And these sat on one side of the pool[a], and those on the other side of the pool.
  footnotes:
  - marker: a
    text: Or 'reservoir of Gibeon'; the Hebrew word can denote a constructed pool or water reservoir.
    reason: lexical_alternative
translation:
  language: ko
  text: 스루야의 아들 요압과 다윗의 종들이 나가서 기브온 못[a]에서 함께 그들을 만났습니다. 그리고 이들은 못 이쪽에, 저들은 못 저쪽에 앉았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 히브리어 브레카(בְּרֵכָה)는 인공 못 또는 저수지를 가리킬 수도 있습니다.
    reason: lexical_alternative
