  terminology: ‘길르앗’, ‘이스르엘’, ‘에브라임’, ‘베냐민’, ‘이스라엘’은 표준 성경 인명·지명 표기와 잘 맞습니다. 본문의 난해한 집단명은 전통적 표기인 ‘아술 사람들’을 유지하되, ‘아셀’이라는 해석 가능성을 각주에 남깁니다.
