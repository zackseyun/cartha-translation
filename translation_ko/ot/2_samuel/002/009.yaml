  source_fidelity: ‘왕으로 세웠습니다’는 וַיַּמְלִכֵהוּ의 사역적 왕위 수립 의미를 충실히 전달합니다. 지명·집단의 통치 범위도 유지되어 있습니다. 다만 통치 범위를 더 직접적으로 드러내도록 목적격 구조로 다듬고, 난해한 הָאֲשׁוּרִי의 대안은 각주로 보존하는 것이 좋습니다.
