base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/009.yaml
  text: and made him king over Gilead[a], over the Ashurites, over Jezreel, over Ephraim, over Benjamin, and over all Israel.
  footnotes:
  - marker: a
    text: Hebrew 'the Ashurites.' Some understand this as 'Asher,' referring to the tribe or region of Asher.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그를 길르앗과 아술 사람들[a]과 이스르엘과 에브라임과 베냐민과 온 이스라엘을 다스리는 왕으로 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아술 사람들’입니다. 일부는 이것을 ‘아셀’로 이해하며, 아셀 지파나 그 지역을 가리킨다고 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּמְלִכֵהוּ
  english_pob_choice: and made him king
  chosen_korean: 그를 ... 왕으로 세웠습니다
  alternatives_korean:
  - 그를 왕으로 삼았습니다
  - 그를 왕으로 세워 다스리게 했습니다
  lexicon: HALOT
  rationale: 히필형 동사 מלך의 사역 의미를 살려, 단순히 ‘다스리다’가 아니라 왕위에 올려 세우는 뜻을 한국어의 자연스러운 관용으로 옮겼습니다.
- source_word: אֶל / עַל
  english_pob_choice: over
  chosen_korean: '...의 왕으로'
  alternatives_korean:
  - '... 위에'
  - '...을 다스리도록'
  lexicon: HALOT
  rationale: 지리·집단 목록에 대한 통치 범위를 나타내므로, 한국어에서는 ‘~의 왕으로’가 지배 관계를 가장 간명하게 드러냅니다.
- source_word: הָאֲשׁוּרִי
  english_pob_choice: the Ashurites
  chosen_korean: 아술 사람들
  alternatives_korean:
  - 아수르 사람들
  - 아셀
  - 아슈르 사람들
  lexicon: HALOT
  rationale: 본문 형태를 따라 민족/집단명으로 옮기되, 해석상 ‘아셀’로 이해하는 대안이 있음을 각주로 남겼습니다.
- source_word: יִשְׂרָאֵל כֻּלֹּה
  english_pob_choice: all Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 모든 이스라엘
  - 이스라엘 전체
  lexicon: HALOT
  rationale: כֻלֹּה의 포괄성을 살리면서도 현대 한국어에서 집합적 전체성을 가장 자연스럽게 드러내는 표현입니다.
theological_decisions:
- issue: 왕권의 주체성
  chosen_reading: 사울 집안의 내전 배경 속에서도 왕위 수립은 인간 행위로 묘사하되, 본문이 보여 주는 정치적 현실을 그대로 유지했습니다.
  alternative_readings:
  - 하나님의 직접적 임명으로 풀어 주는 해석
  - 중립적으로 단순 통치 시작으로 완화하는 번역
  rationale: 히브리어 본문은 여기서 신적 평가보다 역사적 사실 서술에 초점을 두므로, 과도한 신학적 해석을 덧붙이지 않았습니다.
  doctrine_reference: 서술 본문에서의 역사-신학 구분
