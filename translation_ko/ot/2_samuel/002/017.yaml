  lexicon: WLC/LEX
  rationale: מִלְחָמָה는 이 문맥에서 장기전보다 특정 교전의 성격이 강하므로 ‘전투’가 자연스럽고, קָשָׁה עַד מְאֹד의 강도를 ‘매우 치열하다’로 살렸습니다.
- source_word: וַיִּנָּגֶף
  english_pob_choice: were defeated
  chosen_korean: 패배하였습니다
  alternatives_korean:
  - 무찔렸습니다
  - 쳐졌습니다
  - 쓰러졌습니다
  lexicon: WLC/LEX
  rationale: נָגַף의 수동형은 군사적 패배를 가리키므로, 단순한 신체적 타격보다 결과 중심의 ‘패배하다’가 가장 분명합니다.
- source_word: עַבְדֵי דָוִד
  english_pob_choice: the servants of David
  chosen_korean: 다윗의 종들
  alternatives_korean:
  - 다윗의 신하들
  - 다윗의 부하들
  - 다윗을 섬기던 사람들
  lexicon: WLC/LEX
  rationale: עֶבֶד의 기본값을 ‘종’으로 유지해 원문의 종속/봉사 관계를 드러냈고, 여기서는 군사적 추종자들을 가리키므로 문맥상 자연스럽습니다.
- source_word: לִפְנֵי
  english_pob_choice: before
  chosen_korean: 앞에서
  alternatives_korean:
  - 앞에
  - 면전에서
  - 대적하여
  lexicon: WLC/LEX
  rationale: 전투 맥락의 לִפְנֵי는 상대편 ‘앞에서/앞에’ 패배함을 뜻하므로, 한국어에서는 ‘앞에서’가 가장 직접적입니다.
theological_decisions:
- issue: 다윗의 ‘종들’ 표현 유지 여부
  chosen_reading: ‘다윗의 종들’로 직역을 유지했습니다.
  alternative_readings:
  - ‘다윗의 사람들’
  - ‘다윗의 군사들’
  rationale: 본문은 정치적 충성 관계를 보여 주는 עֲבָדִים 표현을 사용하므로, 문맥을 다소 풀어 쓰기보다 원문 표지를 남기는 편이 본문의 힘을 더 잘 보존합니다.
  doctrine_reference: 역사서의 사회적-정치적 서술
