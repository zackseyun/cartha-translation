  yaml_path: translation/ot/2_samuel/002/017.yaml
  text: The battle was very fierce that day[b][a], and Abner and the men of Israel were defeated before the servants of David.
  footnotes:
  - marker: a
    text: Or 'the battle was very severe that day.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the servants of David'; this refers to David's forces or retainers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 전투는 매우 치열하였고, 아브넬과 이스라엘 사람들은 다윗의 종들 앞에서 패배하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘치열하였습니다’는 히브리어 קָשָׁה עַד מְאֹד의 자연스러운 현대어 표현이며, 문자적으로는 ‘매우 심하였습니다/매우 가혹하였습니다’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘다윗의 종들’은 다윗의 군대나 수행원들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה קָשָׁה עַד מְאֹד
  english_pob_choice: The battle was very fierce
  chosen_korean: 전투는 매우 치열하였고
  alternatives_korean:
  - 전쟁은 매우 سخت하였고
  - 전투는 매우 심하였고
