  source_fidelity: 히브리어 וְעַתָּה에는 실제로 시간·담화 표지인 ‘이제’가 있으므로 이를 유지하는 것이 적절합니다. 그러나 ‘손을 강하게 하시고’는 손 자체가 강해지라는 히브리어 표현을 다소 타동적·사역적으로 바꾸며, 각주 표지가 해당 어구가 아니라 절 끝에 놓여 있습니다. ‘유다의 집도’는 וְגַם אֹתִי의 강조가 다윗 자신에게 있는 점을 충분히 드러내지 못합니다.
  naturalness: 현대 합쇼체로 ‘굳세게 하시고’와 ‘용맹한 사람들이 되십시오’는 자연스럽고 문맥상 권면의 어조를 보존합니다. ‘유다 집안’은 집단적 ‘유다의 집’을 한국어에서 더 자연스럽게 표현합니다.
  terminology: ‘기름부었습니다’는 왕으로 세우는 의례적 행위를 적절히 보존합니다. 사울에 대한 אֲדֹנֵיכֶם은 신적 칭호가 아닌 인간 군주에 대한 호칭이므로 ‘주인인 사울’로 문맥을 분명히 했습니다. לִבְנֵי־חַיִל의 남성 복수는 ‘사람들’로 처리되어 한국어에서 성별을 명시하지는 않지만, 원문의 용기와 역량의 뜻을 보존하며, 각주에 ‘용사들’ 대안을 제시합니다.
