base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/007.yaml
  text: Now let your hands be strong[a], and be valiant men, for your lord Saul is dead, and the house of Judah also has anointed me king over them.
  footnotes:
  - marker: a
    text: Or 'men of valor.' The Hebrew expression denotes courage and capability, often in a martial setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 여러분의 손을 강하게 하시고, 용사들이 되십시오. 여러분의 주인 사울이 죽었고, 유다의 집도 나를 그들 위에 왕으로 기름부었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘용사들’입니다. 이 히브리어 표현은 흔히 용기와 능력, 특히 군사적 맥락의 자질을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  english_pob_choice: let your hands be strong
  chosen_korean: 이제 여러분의 손을 강하게 하시고
  alternatives_korean:
  - 여러분의 손이 강해지게 하시고
  - 손을 강하게 하십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 손-강함 이미지를 살리되, 한국어에서는 자연스럽게 행위 주체를 드러내는 명령형으로 옮겼습니다.
- source_word: לִבְנֵי חַיִל
  english_pob_choice: valiant men
  chosen_korean: 용사들이
  alternatives_korean:
  - 용맹한 사람들
  - 유능한 사람들
  lexicon: HALOT
  rationale: 군사적 맥락의 능력과 용기를 가리키는 표현이므로, 현대 한국어에서 자연스럽고 힘 있는 ‘용사들’로 옮겼습니다.
- source_word: אֲדֹנֵיכֶם
  english_pob_choice: your lord
  chosen_korean: 여러분의 주인
  alternatives_korean:
  - 여러분의 주
  - 여러분의 통치자
  lexicon: HALOT
  rationale: 여기서는 신학적 ‘주님’이 아니라 사울에 대한 정치적·사회적 호칭이므로, 관계의 위계를 드러내는 ‘주인’을 택했습니다.
- source_word: בֵית יְהוּדָה
  english_pob_choice: the house of Judah
  chosen_korean: 유다의 집
  alternatives_korean:
  - 유다 지파
  - 유다 집안
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현을 그대로 살려 공동체 단위를 드러내기 위해 ‘유다의 집’으로 옮겼습니다.
- source_word: מָשְׁחוּ
  english_pob_choice: has anointed
  chosen_korean: 기름부었습니다
  alternatives_korean:
  - 왕으로 세웠습니다
  - 기름을 부었습니다
  lexicon: HALOT
  rationale: 왕위 부임을 뜻하는 예식적 동사이므로, 단순한 임명이 아니라 기름부음 행위를 직접 반영했습니다.
theological_decisions:
- issue: לִבְנֵי חַיִל의 성별 보존
  chosen_reading: 용사들이
  alternative_readings:
  - 용사들
  - 용맹한 사람들
  rationale: 본문의 남성 복수형을 한국어에서도 유지해, 본문이 가리키는 군사적 남성 집단을 흐리지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: אֲדֹנֵיכֶם의 호칭 처리
  chosen_reading: 여러분의 주인
  alternative_readings:
  - 여러분의 주
  - 여러분의 통치자
  rationale: 이 표현은 야훼나 메시아 칭호가 아니라 사울에 대한 인간적 복종 관계를 나타내므로, 신학적 확장을 피하고 정치적 맥락을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
