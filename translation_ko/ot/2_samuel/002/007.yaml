revisions:
- from: 이제 여러분의 손을 강하게 하시고, 용사들이 되십시오. 여러분의 주인 사울이 죽었고, 유다의 집도 나를 그들 위에 왕으로 기름부었습니다.[a]
  to: 이제 여러분의 손을 굳세게 하시고, 용맹한 사람들이 되십시오.[a] 여러분의 주인인 사울이 죽었고, 유다 집안이 나를 또한 그들을 다스릴 왕으로 기름부었습니다.
  rationale: ‘이제’는 원문의 וְעַתָּה를 반영하여 유지했습니다. 첫 권면은 손의 굳셈이라는 히브리어 관용을 보존하도록 다듬었고, 둘째 권면의 어휘 각주는 정확한 어구에 연결했습니다. 또한 ‘또한’의 위치를 조정하여 유다 집안이 다윗을 왕으로 기름부은 사실에서 다윗 자신이 강조되는 원문 구문을 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:27:03Z'
