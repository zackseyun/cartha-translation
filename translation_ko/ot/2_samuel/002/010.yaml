reference: 2 Samuel 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֗וּל בְּ/מָלְכ/וֹ֙ עַל יִשְׂרָאֵ֔ל וּ/שְׁתַּ֥יִם שָׁנִ֖ים מָלָ֑ךְ אַ֚ךְ בֵּ֣ית יְהוּדָ֔ה הָי֖וּ אַחֲרֵ֥י דָוִֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/010.yaml
  text: Ish-bosheth son of Saul was forty years old when he began to reign over Israel[a], and he reigned two years[c][b]. But the house of Judah followed David.
  footnotes:
  - marker: a
    text: Hebrew 'the house of Judah,' a corporate expression for the tribe/kingdom of Judah.
    reason: lexical_alternative
  - marker: b
    text: Or 'were loyal to David' / 'were on David's side.' Hebrew 'were after David' is an idiom of allegiance.
    reason: lexical_alternative
  - marker: c
    text: The name appears here in the Masoretic Text as Ish-bosheth; compare the alternative form Eshbaal in related traditions.
    reason: alternative_reading
translation:
  language: ko
  text: 이스보셋은 사울의 아들로서 사십 세에 이스라엘을 다스리기 시작했고[a], 두 해를 다스렸습니다[c][b]. 그러나 유다의 집은 다윗을 따랐습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘유다의 집’이라고 하여, 유다 지파/왕국 전체를 가리키는 집단 표현을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그 뒤에 있었다’는 관용구로, ‘다윗에게 충성했다’ 또는 ‘다윗 편에 있었다’는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마소라 본문에는 이 인명이 이스보셋으로 나오며, 관련 전승에는 에스바알 형태가 병행됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  english_pob_choice: was forty years old
  chosen_korean: 사십 세
  alternatives_korean:
  - 마흔 살
  - 사십 살
  lexicon: HALOT
  rationale: 히브리어의 나이 관용구를 한국어에서도 자연스러운 연령 표현으로 옮겼습니다.
- source_word: בְּמָלְכוֹ עַל יִשְׂרָאֵל
  english_pob_choice: when he began to reign over Israel
  chosen_korean: 이스라엘을 다스리기 시작했고
  alternatives_korean:
  - 이스라엘을 치리하기 시작했고
  - 이스라엘 위에 왕이 되었을 때
  lexicon: HALOT
  rationale: בְּ + 동사형이 시점을 나타내므로, 즉위 시점을 드러내는 문맥에 맞게 '다스리기 시작하다'로 옮겼습니다.
- source_word: בֵּית יְהוּדָה
  english_pob_choice: the house of Judah
  chosen_korean: 유다의 집
  alternatives_korean:
  - 유다 집안
  - 유다 사람들
  lexicon: HALOT
  rationale: 직역을 유지해 집단/지파 공동체를 가리키는 표현임을 보존했습니다.
- source_word: הָיוּ אַחֲרֵי דָוִד
  english_pob_choice: followed David
  chosen_korean: 다윗을 따랐습니다
  alternatives_korean:
  - 다윗 편에 있었습니다
  - 다윗에게 충성했습니다
  lexicon: HALOT
  rationale: '''~의 뒤에 있다''는 관용적 충성/지지의 뜻을 한국어의 자연스러운 동사 ''따르다''로 표현했습니다.'
theological_decisions:
- issue: 유다 집단의 입장 표현
  chosen_reading: ‘따랐습니다’로 옮겨, 정치적·언약적 지지의 뉘앙스를 열어 두었습니다.
  alternative_readings:
  - ‘다윗 편이었습니다’
  - ‘다윗에게 충성했습니다’
  rationale: 히브리어 관용구는 단순한 물리적 추종이 아니라 지지와 충성을 포함할 수 있으나, 본문 자체가 그 범위를 확정적으로 좁히지는 않으므로 열린 번역을 택했습니다.
  doctrine_reference: 본문 의미의 과잉해석 방지
