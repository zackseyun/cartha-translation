base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/010.yaml
  text: Ish-bosheth son of Saul was forty years old when he began to reign over Israel[a], and he reigned two years[c][b]. But the house of Judah followed David.
  footnotes:
  - marker: a
    text: Hebrew 'the house of Judah,' a corporate expression for the tribe/kingdom of Judah.
    reason: lexical_alternative
  - marker: b
    text: Or 'were loyal to David' / 'were on David's side.' Hebrew 'were after David' is an idiom of allegiance.
    reason: lexical_alternative
  - marker: c
    text: The name appears here in the Masoretic Text as Ish-bosheth; compare the alternative form Eshbaal in related traditions.
    reason: alternative_reading
translation:
  language: ko
  text: 사울의 아들 이스보셋[c]은 이스라엘을 다스리기 시작할 때 사십 세였고, 왕으로서 두 해 동안 다스렸습니다. 그러나 유다의 집[a]은 다윗을 따랐습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘유다의 집’이라고 하여, 유다 지파/왕국 전체를 가리키는 집단 표현을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그 뒤에 있었다’는 관용구로, ‘다윗에게 충성했다’ 또는 ‘다윗 편에 있었다’는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마소라 본문에는 이 인명이 이스보셋으로 나오며, 관련 전승에는 에스바알 형태가 병행됩니다.
    reason: alternative_reading
