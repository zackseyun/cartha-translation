  text: וַ/יֹּ֧אמֶר ל֣/וֹ אַבְנֵ֗ר נְטֵ֤ה לְ/ךָ֙ עַל יְמִֽינְ/ךָ֙ א֣וֹ עַל שְׂמֹאלֶ֔/ךָ וֶ/אֱחֹ֣ז לְ/ךָ֗ אֶחָד֙ מֵֽ/הַ/נְּעָרִ֔ים וְ/קַח לְ/ךָ֖ אֶת חֲלִצָת֑/וֹ וְ/לֹֽא אָבָ֣ה עֲשָׂהאֵ֔ל לָ/ס֖וּר מֵ/אַחֲרָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/021.yaml
  text: Then Abner said to him[a], “Turn aside to your right or to your left, and seize one of the young men for yourself, and take his gear for yourself.” But Asahel was not willing to turn aside from following him.
  footnotes:
  - marker: a
    text: Or “take his armor for yourself.” The Hebrew term likely refers to equipment stripped from a fallen fighter; the exact item is not fully certain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아브넬이 그에게 말했습니다. “네 오른쪽이나 네 왼쪽으로 비켜서, 젊은이들 가운데 한 사람을 붙잡고 그의 장비[a]를 네 것으로 차지하여라.” 그러나 아사헬은 그를 뒤따르는 것을 그만두려 하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 갑옷을 네 것으로 차지하여라.” 히브리어는 쓰러진 전사에게서 벗겨 낸 장비를 가리키는 것으로 보이지만, 정확히 무엇인지는 분명하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטֵה
  english_pob_choice: Turn aside
  chosen_korean: 비켜서서
  alternatives_korean:
  - 돌아서
  - 치우쳐서
  - 비켜
  lexicon: HALOT
  rationale: 추격 장면에서 נטה는 진행하던 방향에서 벗어나라는 뜻이므로, 한국어의 ‘비켜서다’가 방향 이탈의 뉘앙스를 자연스럽게 살립니다.
- source_word: עַל יְמִינְךָ אֹו עַל שְׂמֹאלֶךָ
  english_pob_choice: to your right or to your left
  chosen_korean: 네 오른쪽으로든 네 왼쪽으로든
  alternatives_korean:
  - 오른편으로든 왼편으로든
  - 네 오른편으로든 네 왼편으로든
  lexicon: HALOT
  rationale: 2인칭 단수 소유격을 살려 직접적인 지시로 옮겼고, 전치사 반복도 한국어 어순에 맞게 유지했습니다.
- source_word: חֲלִצָתוֹ
  english_pob_choice: his gear
  chosen_korean: 장비
  alternatives_korean:
  - 노획물
  - 갑옷
  - 무장
  lexicon: HALOT
  rationale: 해당 단어는 쓰러진 전사의 몸에서 벗겨낸 물품을 가리키지만 정확한 품목이 불확실하므로, 과도하게 특정하지 않는 ‘장비’로 옮겼습니다.
- source_word: וְלֹא אָבָה
  english_pob_choice: was not willing
  chosen_korean: 비켜서려 하지 않았습니다
  alternatives_korean:
  - 원하지 않았습니다
  - 마지못해 하지 않았습니다
  - 거절하지 않았습니다
  lexicon: HALOT
  rationale: אָבָה는 단순 거절보다 의지/동의의 부재를 나타내므로, 앞절의 동작을 이어 ‘비켜서려 하지 않았다’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 아사헬의 태도 표현
  chosen_reading: ‘비켜서려 하지 않았습니다’로 옮겨, 추격을 멈추지 않으려는 완강함을 드러냈습니다.
  alternative_readings:
  - ‘돌아서려 하지 않았습니다’
  - ‘물러서려 하지 않았습니다’
  rationale: 히브리어는 단순한 방향 전환 거부가 아니라 추격을 중단하지 않으려는 의지를 보여 주므로, 문맥의 긴장감을 유지하는 번역을 택했습니다.
  doctrine_reference: 서사 문맥 보존
- issue: חֲלִצָה의 의미 범위
  chosen_reading: ‘장비’로 번역해 전투 현장에서 벗겨 낸 물품이라는 넓은 의미를 유지했습니다.
  alternative_readings:
  - ‘갑옷’
  - ‘노획물’
  - ‘무기’
  rationale: 원어는 구체 품목이 불확실하므로, 한국어에서 지나치게 좁은 해석을 피하고 본문의 모호성을 그대로 남기는 것이 적절합니다.
  doctrine_reference: 어휘 불확정성 보존
