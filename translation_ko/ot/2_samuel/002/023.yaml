base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/023.yaml
  text: But he refused to turn aside[a], so Abner struck him in the belly with the butt end of the spear, and the spear came out behind him; and he fell there and died on the spot. And everyone who came to the place where Asahel had fallen and died stood still.
  footnotes:
  - marker: a
    text: Hebrew חֹמֶשׁ is traditionally rendered 'the fifth rib' in some older English versions; the term likely refers more generally to the abdomen or belly in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 돌아서기를 거부하였으므로, 아브넬이 창의 뒤쪽 끝으로 그의 배를[a] 쳤습니다. 창은 그의 뒤로 빠져나갔고, 그는 그곳에 쓰러져 그 자리에서 죽었습니다. 그리고 아사헬이 쓰러져 죽은 그곳에 이른 모든 사람은 멈추어 섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֹמֶשׁ은 일부 옛 영어 성경 번역에서 ‘the fifth rib’로 옮겨졌지만, 이 문맥에서는 더 일반적으로 배나 복부를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן לָסוּר
  english_pob_choice: he refused to turn aside
  chosen_korean: 돌아서기를 거부하였습니다
  alternatives_korean:
  - 옆으로 비키기를 거부하였습니다
  - 돌이키기를 거부하였습니다
  lexicon: HALOT
  rationale: מאן은 단순한 비의가 아니라 분명한 거절을 뜻하므로 ‘거부하다’로 옮겼고, לָסוּר는 추격을 멈추고 방향을 틀라는 요구를 담아 ‘돌아서다’로 자연스럽게 풀었습니다.
- source_word: בְּאַחֲרֵי הַחֲנִית
  english_pob_choice: with the butt end of the spear
  chosen_korean: 창의 뒤쪽 끝으로
  alternatives_korean:
  - 창의 뒤끝으로
  - 창의 뒤쪽으로
  lexicon: HALOT
  rationale: אַחֲרֵי는 창의 앞끝과 대비되는 뒤편을 가리키므로, 직역의 어색함을 피하면서도 무기의 후면으로 친다는 점이 드러나도록 ‘뒤쪽 끝’으로 옮겼습니다.
- source_word: אֶל הַחֹמֶשׁ
  english_pob_choice: in the belly
  chosen_korean: 그의 배를
  alternatives_korean:
  - 그의 복부를
  - 그의 옆구리를
  lexicon: HALOT
  rationale: חֹמֶשׁ은 전통적 ‘다섯째 갈비뼈’보다 문맥상 몸통 내부를 가리키는 표현으로 보는 것이 자연스럽기 때문에, 현대 한국어에서 직관적인 ‘배’를 사용했습니다.
- source_word: וַיָּמָת תחתו
  english_pob_choice: died on the spot
  chosen_korean: 그 자리에서 죽었습니다
  alternatives_korean:
  - 그곳에서 죽었습니다
  - 그가 서 있던 곳에서 죽었습니다
  lexicon: HALOT
  rationale: תחתו는 ‘그가 있던 바로 그 자리’라는 관용적 의미를 가지므로, 공간적으로만 풀기보다 즉시성과 현장성을 살린 ‘그 자리에서’로 옮겼습니다.
- source_word: וַיַּעֲמֹדוּ
  english_pob_choice: stood still
  chosen_korean: 멈추어 섰습니다
  alternatives_korean:
  - 서 있었습니다
  - 멈췄습니다
  lexicon: HALOT
  rationale: 사건을 목격한 사람들이 걸음을 멈추고 서게 된 반응을 함께 드러내기 위해 ‘멈추어 섰다’로 번역했습니다.
