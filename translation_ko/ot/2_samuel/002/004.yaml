id: 2SA.2.4
reference: 2 Samuel 2:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אַנְשֵׁ֣י יְהוּדָ֔ה וַ/יִּמְשְׁחוּ שָׁ֧ם אֶת דָּוִ֛ד לְ/מֶ֖לֶךְ עַל בֵּ֣ית יְהוּדָ֑ה וַ/יַּגִּ֤דוּ לְ/דָוִד֙ לֵ/אמֹ֔ר אַנְשֵׁי֙ יָבֵ֣ישׁ גִּלְעָ֔ד אֲשֶׁ֥ר קָבְר֖וּ אֶת שָׁאֽוּל־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/004.yaml
  text: Then the men of Judah came[a], and there they anointed David king over the house of Judah. And they told David, saying, "The men of Jabesh-gilead were the ones who buried Saul."
  footnotes:
  - marker: a
    text: Or simply, "who buried Saul."
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유다 사람들이 와서, 그곳에서 다윗에게 기름을 부어 유다 집을 다스릴 왕으로 세웠습니다. 그리고 다윗에게 말했습니다. “사울을 장사한 사람들은 바로 야베스 길르앗 사람들입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי יְהוּדָה
  english_pob_choice: the men of Judah
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유다의 남자들
  - 유다의 사람들
  lexicon: HALOT
  rationale: אַנְשֵׁי는 문자적으로 ‘사람들/남자들’이지만, 이 문맥에서는 집단 전체를 대표하는 유다 측 인물들을 가리키므로 한국어에서는 자연스러운 집단 표현인 ‘유다 사람들’로 옮겼습니다.
- source_word: וַיִּמְשְׁחוּ שָׁם אֶת דָּוִד לְמֶלֶךְ
  english_pob_choice: they anointed David king
  chosen_korean: 다윗에게 기름을 부어 … 왕으로 세웠습니다
  alternatives_korean:
  - 다윗을 왕으로 기름 부었습니다
  - 다윗을 왕으로 임명했습니다
  lexicon: HALOT
  rationale: מָשַׁח은 왕위 수여의 ‘기름 부음’을 뜻하므로 ‘기름을 부어’로 살렸고, לְמֶלֶךְ는 한국어 관용에 맞게 ‘왕으로 세웠습니다’로 풀어 의미를 분명히 했습니다.
- source_word: עַל בֵּית יְהוּדָה
  english_pob_choice: over the house of Judah
  chosen_korean: 유다 집
  alternatives_korean:
  - 유다의 집
  - 유다 지파
  lexicon: HALOT
  rationale: בֵּית은 단순한 지리명보다 혈연·정치적 공동체를 가리키므로 ‘집’을 유지했습니다. 한국어에서는 ‘유다 집의 왕’으로 간결하게 살렸습니다.
- source_word: אֲשֶׁר קָבְרוּ אֶת שָׁאוּל
  english_pob_choice: The men of Jabesh-gilead were the ones who buried Saul.
  chosen_korean: 야베스-길르앗 사람들이 바로 사울을 장사한 사람들입니다
  alternatives_korean:
  - 야베스-길르앗 사람들이 사울을 장사했습니다
  - 사울을 장사한 사람들은 바로 야베스-길르앗 사람들입니다
  lexicon: HALOT
  rationale: 관계절의 식별적 강조를 한국어에서 ‘바로 … 사람들입니다’로 표현해, 단순 사실 진술보다 ‘그들이 바로 그 사람들’이라는 원문의 초점을 살렸습니다.
theological_decisions:
- issue: 왕으로 세움과 기름 부음의 관계
  chosen_reading: ‘기름을 부어 … 왕으로 세웠습니다’로 번역해, 왕위 부여가 단순 임명이 아니라 기름 부음을 동반한 서사임을 드러냈습니다.
  alternative_readings:
  - 왕으로 임명했습니다
  - 왕으로 세웠습니다
  rationale: 본문은 דוד를 공식 왕으로 세우는 행위와 기름 부음이 결합된 장면이므로, 두 요소를 모두 유지하는 것이 서사의 신학적·정치적 의미를 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, points 1 and 5
