- from: 그때 유다 사람[a]들이 와서, 그곳에서 다윗에게 기름을 부어 유다 집의 왕으로 세웠습니다. 그리고 다윗에게 말했습니다. "야베스-길르앗 사람들이 바로 사울을 장사한 사람들입니다."
  to: 그때 유다 사람들이 와서, 그곳에서 다윗에게 기름을 부어 유다 집을 다스릴 왕으로 세웠습니다. 그리고 다윗에게 말했습니다. “사울을 장사한 사람들은 바로 야베스 길르앗 사람들입니다.”
  rationale: 무의미한 각주와 앵커를 삭제했습니다. 또한 왕권의 대상인 ‘유다 집’을 통치 관계로 명확히 하되, 기름 부음과 왕으로 세움의 두 요소를 모두 유지했습니다. 마지막 보고는 히브리어 관계절의 식별적 강조를 ‘사람들은 바로 … 사람들입니다’로 보존했습니다.
