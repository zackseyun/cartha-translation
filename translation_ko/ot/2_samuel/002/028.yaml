  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שּׁוֹפָ֔ר וַ/יַּֽעַמְדוּ֙ כָּל הָ/עָ֔ם וְ/לֹֽא יִרְדְּפ֥וּ ע֖וֹד אַחֲרֵ֣י יִשְׂרָאֵ֑ל וְ/לֹֽא יָסְפ֥וּ ע֖וֹד לְ/הִלָּחֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/028.yaml
  text: Then Joab blew the trumpet[a], and all the people stood still, and they no longer pursued Israel or continued to fight.
  footnotes:
  - marker: a
    text: Or 'the horn'; Hebrew שׁוֹפָר refers to a horn used as a signaling instrument.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요압이 나팔을 불자, 모든 백성이 멈추었고, 더는 이스라엘을 뒤쫓지 않았으며, 다시는 싸우지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나팔’은 히브리어 שׁוֹפָר의 기능을 살린 번역입니다. 이는 신호를 위한 뿔나팔을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  english_pob_choice: blew
  chosen_korean: 불자
  alternatives_korean:
  - 불었을 때
  - 나팔을 울리자
  - 나팔을 불자
  lexicon: HALOT
  rationale: שׁוֹפָר와 함께 쓰인 תקע는 악기를 ‘불다/울리다’는 뜻이므로, 현대 한국어에서 가장 자연스럽고 직접적인 표현인 ‘불자’를 택했습니다.
- source_word: בַּשּׁוֹפָר
  english_pob_choice: the trumpet
  chosen_korean: 나팔
  alternatives_korean:
  - 뿔나팔
  - 트럼펫
  - 뿔
  lexicon: HALOT
  rationale: שׁוֹפָר는 신호용 뿔나팔을 가리키지만, 한국어에서는 기능을 살린 ‘나팔’이 가장 널리 이해되며 문맥상 충분합니다.
- source_word: וַיַּעַמְדוּ כָּל הָעָם
  english_pob_choice: all the people stood still
  chosen_korean: 모든 백성이 멈추었고
  alternatives_korean:
  - 모든 백성이 서 있었고
  - 모든 군사가 멈추었고
  - 모든 백성이 멈추었습니다
  lexicon: HALOT
  rationale: 문맥상 군사 행동의 중지를 뜻하지만, 히브리어의 ‘서다’ 이미지를 완전히 지우지 않으면서 현대어로는 ‘멈추었다’가 가장 자연스럽습니다.
- source_word: וְלֹא יִרְדְּפ֥וּ ע֖וֹד אַחֲרֵ֣י יִשְׂרָאֵ֑ל
  english_pob_choice: they no longer pursued Israel
  chosen_korean: 더는 이스라엘을 뒤쫓지 않았으며
  alternatives_korean:
  - 더 이상 이스라엘을 추격하지 않았으며
  - 이스라엘을 더는 뒤쫓지 않았으며
  - 이스라엘을 더 이상 추격하지 않았으며
  lexicon: HALOT
  rationale: רדף אחרי의 추격 의미를 살리되, 현대 한국어에서 군사적 맥락에 자연스러운 ‘뒤쫓다’를 사용했습니다.
- source_word: וְלֹא יָסְפ֥וּ ע֖וֹד לְ/הִלָּחֵם
  english_pob_choice: or continued to fight
  chosen_korean: 다시는 싸우지 않았습니다
  alternatives_korean:
  - 또다시 싸우지 않았습니다
  - 더는 싸우기를 계속하지 않았습니다
  - 싸움을 계속하지 않았습니다
  lexicon: HALOT
  rationale: יסף + 부정 + 부정사구는 ‘더/다시 …하지 않다’의 의미이므로, 결과를 간결하게 드러내는 ‘다시는 싸우지 않았다’로 옮겼습니다.
