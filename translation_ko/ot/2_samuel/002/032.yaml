id: 2SA.2.32
reference: 2 Samuel 2:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׂאוּ֙ אֶת עֲשָׂהאֵ֔ל וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/קֶ֣בֶר אָבִ֔י/ו אֲשֶׁ֖ר בֵּ֣ית לָ֑חֶם וַ/יֵּלְכ֣וּ כָל הַ/לַּ֗יְלָה יוֹאָב֙ וַֽ/אֲנָשָׁ֔י/ו וַ/יֵּאֹ֥ר לָ/הֶ֖ם בְּ/חֶבְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/032.yaml
  text: They carried Asahel and buried him in his father's tomb[a], which was at Bethlehem. Then Joab and his men traveled all night[b], and daybreak came upon them at Hebron.
  footnotes:
  - marker: a
    text: Or 'in his father's grave.' The Hebrew קֶבֶר can refer either to a grave or to a tomb/family burial place.
    reason: lexical_alternative
  - marker: b
    text: Or 'the dawn broke on them at Hebron.' The Hebrew idiom literally says 'it became light for them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 아사헬을 가져다가 그의 아버지의 무덤에, 곧 베들레헴에 있는 그 무덤에 장사했습니다. 그런 다음 요압과 그의 부하들은 밤새 길을 갔고, 새벽이 그들에게 이르렀습니다[a] — 헤브론에서였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '헤브론에서 새벽이 그들에게 밝혀졌습니다.' 히브리어 관용구는 문자적으로 '그들에게 빛이 되었다'는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  english_pob_choice: They carried
  chosen_korean: 가져다가
  alternatives_korean:
  - 옮겼습니다
  - 메고 갔습니다
  lexicon: HALOT
  rationale: 시신을 운반해 매장하는 문맥이므로 단순한 '들어 올리다'보다 목적지까지 옮기는 동작을 자연스럽게 드러내는 '가져다가'를 썼습니다.
- source_word: בְּקֶבֶר אָבִיו
  english_pob_choice: in his father's tomb
  chosen_korean: 그의 아버지의 무덤에
  alternatives_korean:
  - 그의 아버지의 묘에
  - 그의 아버지의 돌무덤에
  lexicon: HALOT
  rationale: קבר는 '무덤/묘/장지' 범위를 가지므로, 가족 매장지를 가리킬 수 있다는 점을 살리면서도 현대 한국어에 자연스러운 '무덤'을 선택했습니다.
- source_word: וַיֵּלְכוּ כָל הַלַּיְלָה
  english_pob_choice: traveled all night
  chosen_korean: 밤새 길을 갔고
  alternatives_korean:
  - 밤새 갔고
  - 밤새 행군했고
  lexicon: HALOT
  rationale: הלך의 넓은 의미를 유지하되 군사적 맥락이 너무 과도하게 고정되지 않도록, 자연스러운 서술형으로 옮겼습니다.
- source_word: וַיֵּאֹר לָהֶם
  english_pob_choice: daybreak came upon them
  chosen_korean: 새벽이 그들에게 이르렀습니다
  alternatives_korean:
  - 그들에게 날이 밝았습니다
  - 새벽이 그들 위에 밝혀졌습니다
  lexicon: HALOT
  rationale: 직역하면 '그들에게 빛이 되었다'에 가깝지만, 한국어에서는 관용적으로 '새벽이 이르렀다'가 본문의 사건성과 시간을 잘 전달합니다.
theological_decisions:
- issue: ערב식 관용구인 וַיֵּאֹר לָהֶם의 표현 방식
  chosen_reading: '''새벽이 그들에게 이르렀습니다''로 옮겨, 도착지명인 헤브론과 결합된 시간 경과를 드러냈습니다.'
  alternative_readings:
  - '''그들에게 날이 밝았습니다'''
  - '''헤브론에서 새벽이 밝았습니다'''
  rationale: 문장은 단순한 자연현상 묘사보다 '밤새 이동하다가 새벽에 도착/노출되었다'는 서사적 효과가 있으므로, 한국어에서도 사건의 흐름을 살렸습니다.
  doctrine_reference: 서사 본문의 시간-장소 결합 표현
