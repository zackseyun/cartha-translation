theological_decisions:
- issue: אַחֲרֵי אַבְנֵר의 방향/추종 의미
  chosen_reading: ‘아브넬을 따라’로 처리해 위치와 추종의 이중 가능성을 살렸습니다.
  alternative_readings:
  - ‘아브넬 뒤에’
  - ‘아브넬을 뒤따라’
  rationale: 전투 서술에서는 단순한 공간 정보보다 아브넬을 중심으로 재집결하는 의미가 함께 읽히므로, 한국어에서도 그 긴장을 남겼습니다.
  doctrine_reference: 서술 맥락의 의미 보존 원칙
- issue: וַיַּעַמְדוּ의 전투적 의미
  chosen_reading: ‘자리 잡았습니다’로 옮겨 단순한 정지보다 방어적 진지를 취하는 느낌을 살렸습니다.
  alternative_readings:
  - 서 있었습니다
  - 진을 쳤습니다
  rationale: עָמַד가 전투 내러티브에서 진형을 갖추는 뜻으로 쓰일 수 있으므로, 문맥상 적절한 대비를 드러냈습니다.
  doctrine_reference: 본문 문맥 우선 번역 원칙
