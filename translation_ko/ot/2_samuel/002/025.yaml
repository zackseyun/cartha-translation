base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/025.yaml
  text: Then the sons of Benjamin gathered together behind Abner[a], became one band[b], and took their stand on the top of one hill.
  footnotes:
  - marker: a
    text: Or 'following Abner.' The Hebrew phrase can indicate either spatial position ('behind') or allegiance/sequence ('after, following').
    reason: lexical_alternative
  - marker: b
    text: Or 'one company' or 'one group.' The Hebrew term refers to a united band gathered together.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 베냐민의 아들들이 아브넬[a]을 따라 모여 하나의 무리가 되었고, 한 언덕의 꼭대기에 자리 잡았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아브넬을 뒤따라.’ 히브리어 구문은 공간적 위치(‘뒤에’)와 추종·순서(‘뒤따라, following’)를 모두 나타낼 수 있습니다.
    reason: lexical_alternative
