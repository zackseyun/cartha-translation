base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/001.yaml
  text: After this[a], David inquired of Yahweh, saying, “Shall I go up into one of the cities of Judah?” And Yahweh said to him, “Go up.” Then David said, “Where shall I go up?” And he said, “To Hebron.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 이 일 후에 다윗이 야훼께 물으며 말했습니다. 「내가 유다의 여러 성읍 중 한 곳으로 올라가야 합니까?」 야훼께서 그에게 말씀하셨습니다. 「올라가라.」 다윗이 말했습니다. 「어디로 올라가야 합니까?」 그러자 그가 말씀하셨습니다. 「헤브론으로 가라.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 본문: ‘YHWH’; 전통적으로는 ‘주님’으로 옮깁니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  english_pob_choice: inquired of Yahweh
  chosen_korean: 야훼께 물으며
  alternatives_korean:
  - 야훼께 문의하며
  - 야훼께 여쭈며
  lexicon: HALOT
  rationale: שׁאל + בְּ는 단순한 질문이 아니라 하나님의 뜻을 구하는 행위를 가리키므로, 현대 한국어에서 자연스럽고도 그 뉘앙스를 살리는 ‘물으며’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사철자 יהוה를 POB 기준에 따라 고유명사로 드러내기 위해 ‘야훼’를 사용했습니다.
- source_word: בְּאַחַת עָרֵי יְהוּדָה
  english_pob_choice: into one of the cities of Judah
  chosen_korean: 유다의 여러 성읍 중 한 곳으로
  alternatives_korean:
  - 유다의 성읍들 가운데 하나로
  - 유다의 한 성읍으로
  lexicon: HALOT
  rationale: ‘한 곳’은 원문의 ‘하나의 성읍’이라는 선택성을 살리면서 한국어에서 더 자연스럽고, ‘여러 성읍 중’은 움직임의 출발점이 되는 범주를 분명히 해 줍니다.
- source_word: חֶבְרֹנָה
  english_pob_choice: To Hebron
  chosen_korean: 헤브론으로
  alternatives_korean:
  - 헤브론으로 가라
  - 헤브론 쪽으로
  lexicon: HALOT
  rationale: 방향을 나타내는 ה־를 한국어 조사 ‘-으로’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 야훼의 음성 전달에서 명령형과 질문형의 어조
  chosen_reading: 하나님이 직접 말씀하시는 대화체를 유지하며, 질문에는 ‘-합니까?’를 써서 공손한 서술체를 유지했습니다.
  alternative_readings:
  - 전면적으로 평서형으로 바꾸는 방식
  - 구어체 반말로 통일하는 방식
  rationale: 원문은 다윗의 문의와 야훼의 응답이 선명한 대화 형식이므로, 서술은 합쇼체를 유지하되 직접 인용문은 장면의 긴장을 해치지 않는 범위에서 자연스럽게 처리했습니다.
  doctrine_reference: 서사문 직역 원칙 및 인용문 체계 유지
- issue: יהוה의 번역
  chosen_reading: 신명사철자를 고유명사 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: PB O의 오디트 기준에 따라 절의 핵심 신학적 표지인 언약 이름을 제목 대체어로 바꾸지 않고 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
