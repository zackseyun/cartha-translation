  to: 이 일이 있은 뒤에 다윗이 야훼[a]께 여쭈었습니다. “제가 유다의 성읍들 가운데 한 곳으로 올라가도 되겠습니까?” 야훼께서 그에게 말씀하셨습니다. “올라가라.” 다윗이 말했습니다. “어디로 올라가야 합니까?” 야훼께서 말씀하셨습니다. “헤브론으로 가라.”
