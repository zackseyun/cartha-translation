    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아브넬이 요압을 불러 말했습니다. “칼이 영원히 삼키겠습니까? 마침내는 쓰라린 결과가 될 것을 모르십니까? 언제까지 백성에게 그들의 형제들을 뒤쫓는 일을 그만두고 돌아서라고[a] 말하지 않으시겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 형제들을 뒤따르던 데서 돌아서라고’.
    reason: lexical_alternative
