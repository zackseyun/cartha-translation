  source_fidelity: 전반적인 문장 구조와 ‘칼이 삼키다’라는 의인화는 잘 반영했습니다. 그러나 מֵאַחֲרֵי אֲחֵיהֶם에서 ‘뒤따르는 상태로 돌아서다’라는 뜻이 될 수는 없으므로, 추격/뒤따름을 그만두고 돌아서라는 방향 전환을 명료하게 표현해야 합니다. 또한 주석이 가리키는 어휘 위치에 표지를 두어야 합니다.
  naturalness: ‘끝내는 그것이 쓰디쓰게 될 것’은 선행 대상이 불분명하고 현대 한국어로 다소 부자연스럽습니다. ‘마침내는 쓰라린 결과가 될 것’은 원문의 결과적 ‘쓰라움’을 자연스럽게 전달합니다. ‘뒤따르며 돌아서라’도 동작상 충돌하므로 수정이 필요합니다.
  terminology: 아브넬, 요압, 칼, 형제들은 적절합니다. ‘자기 형제들’보다 원문의 3인칭 복수 소유를 드러내는 ‘그들의 형제들’이 더 명료하며, 문맥상 동족끼리의 추격이라는 수사도 보존합니다.
