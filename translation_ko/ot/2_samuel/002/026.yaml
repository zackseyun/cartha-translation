  text: Then Abner called to Joab and said[a], “Must the sword devour forever? Do you not know that it will be bitter in the end? How long will it be before you tell the people to turn back from following their brothers?”
  footnotes:
  - marker: a
    text: Or 'from following after their brothers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아브넬이 요압을 불러 말했습니다. “칼이 영원히 삼키기만 하겠습니까? 끝내는 그것이 쓰디쓰게 될 것을 모르십니까? 언제쯤이면 백성에게 자기 형제들을 뒤따르며 돌아서라고 말하시겠습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 형제들을 뒤따르며’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... וַיֹּאמֶר
  english_pob_choice: called ... and said
  chosen_korean: 불러 말했습니다
  alternatives_korean:
  - 불러서 말했습니다
  - 외쳐 말했습니다
  lexicon: WLC + POB audit trail
  rationale: 호출과 발화를 연속 동사로 간결하게 살리면서, 군중에게 외치는 뉘앙스보다 대화 상대를 직접 부르는 흐름을 유지했습니다.
- source_word: הֲלָנֶצַח תֹּאכַל חֶרֶב
  english_pob_choice: Must the sword devour forever?
  chosen_korean: 칼이 영원히 삼키기만 하겠습니까?
  alternatives_korean:
  - 칼이 영원히 삼키겠습니까?
  - 칼이 끝없이 사람을 삼키겠습니까?
  lexicon: HALOT
  rationale: חֶרֶב의 의인화된 ‘먹다/삼키다’를 ‘삼키기’로 살려, 단순한 살육 설명으로 평평해지지 않게 했습니다.
- source_word: מָרָה תִהְיֶה בָּאַחֲרוֹנָה
  english_pob_choice: it will be bitter in the end
  chosen_korean: 끝내는 그것이 쓰디쓰게 될 것을
  alternatives_korean:
  - 마침내 그것이 쓰게 될 것을
  - 결국 그것이 쓰라리게 될 것을
  lexicon: HALOT
  rationale: ‘bitter’를 정서적·결과적 비유로 유지하되, 한국어에서 자연스러운 ‘쓰디쓰게’로 강도를 살렸습니다.
- source_word: לָשׁוּב מֵאַחֲרֵי אֲחֵיהֶם
  english_pob_choice: to turn back from following their brothers
  chosen_korean: 자기 형제들을 뒤따르며 돌아서라고
  alternatives_korean:
  - 자기 형제들을 뒤따르지 말고 돌아서라고
  - 자기 형제들을 추격하는 것을 멈추라고
  lexicon: HALOT
  rationale: 전치사구 ‘from after’의 군사적 추격 의미를 과도하게 해석하지 않으면서도, 한국어에서는 ‘뒤따르며 돌아서다’로 동작의 방향을 드러냈습니다.
theological_decisions:
- issue: 동족 간 전쟁의 관계 표현
  chosen_reading: ‘their brothers’를 직역에 가깝게 ‘자기 형제들’로 유지했습니다.
  alternative_readings:
  - 친족
  - 동족
  rationale: 이스라엘 내부의 유혈 충돌이라는 수사적·감정적 무게를 약화시키지 않기 위해 가족적 표현을 보존했습니다.
  doctrine_reference: 본문 수사와 내러티브 맥락
