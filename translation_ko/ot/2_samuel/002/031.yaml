  yaml_path: translation/ot/2_samuel/002/031.yaml
  text: But David’s servants struck down three hundred and sixty men from Benjamin and from Abner’s men[a].
  footnotes:
  - marker: a
    text: Or 'And David’s servants struck down ...' The Hebrew conjunction can be read simply as 'and'; the main text uses 'but' to reflect the contrast with the previous verse’s casualty report.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 다윗의 종들이 베냐민과 아브넬의 사람들 가운데서 삼백육십 명을 쳐죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고’. 히브리어 접속사 וְ는 단순히 ‘그리고’로 읽을 수 있지만, 앞 절의 손실 보고와 대비되는 흐름을 살려 본문에서는 ‘그러나’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַבְדֵי
  english_pob_choice: David’s servants
  chosen_korean: 다윗의 종들
  alternatives_korean:
  - 다윗의 신하들
  - 다윗의 종
  lexicon: HALOT
  rationale: 왕을 섬기는 무장 추종자들이라는 문맥을 살려 ‘종들’로 옮겼습니다. 본문이 단순한 관직보다 종속적 소속을 드러내므로, 이곳에서는 관용적 ‘신하들’보다 원문의 소속감을 더 직접적으로 반영합니다.
- source_word: מִ/בִּנְיָמִן
  english_pob_choice: from Benjamin
  chosen_korean: 베냐민 가운데서
  alternatives_korean:
  - 베냐민에서
  - 베냐민 사람들 가운데서
  lexicon: HALOT
  rationale: 전투 손실의 출처를 나타내는 מִן을 한국어로 자연스럽게 풀어 ‘가운데서’로 옮겼습니다. 지파명을 유지하면서도 피해 집단의 범위를 분명히 합니다.
- source_word: וּ/בְ/אַנְשֵׁי אַבְנֵר
  english_pob_choice: from Abner’s men
  chosen_korean: 아브넬의 사람들 가운데서
  alternatives_korean:
  - 아브넬의 부하들 가운데서
  - 아브넬의 군사들 가운데서
  lexicon: HALOT
  rationale: אַנְשִׁים은 여기서 전투 집단의 구성원을 가리키므로, 인격적 소속을 드러내는 ‘사람들’이 가장 중립적입니다. ‘부하들’은 위계가 강하고, ‘군사들’은 군사적 뉘앙스를 더해 본문보다 좁아질 수 있습니다.
- source_word: שְׁלֹשׁ מֵא֧וֹת וְ/שִׁשִּׁ֛ים
  english_pob_choice: three hundred and sixty
  chosen_korean: 삼백육십 명
  alternatives_korean:
  - 삼백육십 사람
  - 360명
  lexicon: HALOT
  rationale: 히브리어 수사와 단위 명사 אִישׁ을 한국어 관용에 맞게 ‘삼백육십 명’으로 옮겼습니다. 숫자의 명료성을 유지하면서 전투 사망자 집계를 자연스럽게 전달합니다.
- source_word: הִכּוּ
  english_pob_choice: struck down
  chosen_korean: 쳐죽였습니다
  alternatives_korean:
  - 쳐서 쓰러뜨렸습니다
  - 내려쳤습니다
  lexicon: HALOT
  rationale: 전투 문맥의 נכה는 단순 타격보다 치명적 타격을 뜻하므로, 결과를 분명히 드러내는 ‘쳐죽였습니다’가 본문의 살상 의미를 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 전투 보고문의 서술 톤
  chosen_reading: 중립적 사건 보고로 번역하되, 결과의 치명성을 약화하지 않았습니다.
  alternative_readings:
  - 완곡하게 ‘패배시켰습니다’로 처리
  - 더 직설적으로 ‘죽였습니다’로만 처리
  rationale: 본문은 전투 결과를 숫자로 기록하는 역사 서술이므로, 해석을 덧붙이기보다 사실 전달을 우선했습니다. 동시에 הִכּוּ의 전투적 살상 의미는 유지해야 하므로, 단순한 ‘쳤습니다’보다 강한 동사를 택했습니다.
  doctrine_reference: 역사서 본문 해석 원칙
- issue: 절 접속사 וְ의 처리
  chosen_reading: 이전 절과의 대조를 살려 ‘그러나’로 옮겼습니다.
  alternative_readings:
  - 그리고
  - 또
  rationale: 영어 POB가 앞 절의 전사자 보고와 대비되는 서술 흐름을 반영해 ‘but’를 택한 것처럼, 한국어에서도 대조 접속을 살리는 편이 문맥의 긴장을 정확히 전달합니다.
  doctrine_reference: 문맥적 담화 기능
