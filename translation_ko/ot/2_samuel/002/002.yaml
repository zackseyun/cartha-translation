base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/002.yaml
  text: 'So David went up there[a], and also his two wives: Ahinoam the Jezreelite and Abigail, the wife of Nabal the Carmelite.'
  footnotes:
  - marker: a
    text: Or, 'Abigail, Nabal's wife, the woman from Carmel.' The Hebrew identifies Abigail by her former marriage and Nabal by his origin from Carmel.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 거기로 올라갔으며, 그의 두 아내도 함께 있었습니다. 아히노암은 이스르엘 사람이고, 아비가일은 나발의 아내, 곧 갈멜 사람의 아내였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아비가일, 곧 나발의 아내, 갈멜에서 온 여자.’ 히브리어는 아비가일을 이전 혼인과 연결해 식별하며, 나발을 갈멜 출신으로 표시합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל שָׁם
  english_pob_choice: went up there
  chosen_korean: 거기로 올라갔으며
  alternatives_korean:
  - 거기 갔으며
  - 그곳으로 올라갔으며
  lexicon: HALOT
  rationale: עלה의 상향 이동 뉘앙스를 살려 ‘올라가다’를 유지했고, שָׁם은 문맥상 목적지를 가리키므로 ‘거기로’로 자연스럽게 옮겼습니다.
- source_word: וְגַם שְׁתֵּי נָשָׁיו
  english_pob_choice: and also his two wives
  chosen_korean: 그의 두 아내도 함께 있었습니다
  alternatives_korean:
  - 그리고 그의 두 아내도 있었습니다
  - 또 그의 두 아내도 있었습니다
  lexicon: HALOT
  rationale: 첨가 관계를 한국어에서는 ‘도 함께’로 자연스럽게 드러냈습니다. 문장 흐름상 다윗의 이동에 아내들이 동행함을 분명히 합니다.
- source_word: הַיִּזְרְעֵלִית
  english_pob_choice: the Jezreelite
  chosen_korean: 이스르엘 사람
  alternatives_korean:
  - 이스르엘 여자
  - 이스르엘 출신
  lexicon: HALOT
  rationale: 지명 형용사를 한국어에서 이해하기 쉬운 출신 표지인 ‘사람’으로 옮겨 아히노암의 출신을 드러냈습니다.
- source_word: אֵשֶׁת נָבָל הַכַּרְמְלִי
  english_pob_choice: the wife of Nabal, the Carmelite
  chosen_korean: 나발의 아내, 곧 갈멜 사람의 아내
  alternatives_korean:
  - 나발의 아내인 갈멜 사람의 아내
  - 나발의 아내, 갈멜 사람의 여자
  lexicon: HALOT
  rationale: 히브리어가 아비가일을 이전 혼인 관계로 식별하는 점을 반영해 ‘나발의 아내’를 유지하고, הַכַּרְמְלִי는 ‘갈멜 사람’으로 옮겨 지리적 표지를 살렸습니다.
theological_decisions:
- issue: 아비가일의 식별 방식
  chosen_reading: ‘나발의 아내’라는 표현을 그대로 살려, 현재의 다윗의 아내이면서도 본문이 과거의 혼인 관계로 인물 식별을 한다는 점을 드러냈습니다.
  alternative_readings:
  - ‘나발의 전 아내’
  - ‘나발의 아내였던 아비가일’
  rationale: 본문의 명명 방식은 서사적 회상을 기능하게 하므로, 현재 시점의 관계를 덧붙여 정리하기보다 원문의 식별 방식을 보존하는 편이 더 충실합니다.
  doctrine_reference: 서사적 인물 식별과 문맥 보존
