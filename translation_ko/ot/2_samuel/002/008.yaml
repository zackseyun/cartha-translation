  to: 그런데 넬의 아들이며 사울 군대의 지휘관인 아브넬이 사울의 아들 이스보셋을 데리고 마하나임으로 건너갔습니다.[a]
  rationale: 사역형 동사가 나타내는 이스보셋의 이동을 한국어에서 분명히 드러내도록 ‘데리고 마하나임으로 건너갔습니다’로 고쳤습니다. 또한 아브넬의 신분 설명을 자연스러운 관계절로 정리했습니다. 이름 이형에 관한 각주는 의미를 바꾸지 않고 지시 대상을 명시했습니다.
