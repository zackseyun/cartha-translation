  naturalness: ‘이스보셋을 데리고 마하나임으로 건너갔습니다’는 현대 한국어 합쇼체로 자연스럽고, 이스보셋을 동반하여 강을 건너 이동시킨 의미를 명확히 합니다. 삽입 설명의 대시는 읽기에 무리가 없으나, 관계절로 정리하면 더 매끄럽습니다.
