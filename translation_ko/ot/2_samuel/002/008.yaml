source:
  edition: WLC
  text: וְ/אַבְנֵ֣ר בֶּן נֵ֔ר שַׂר צָבָ֖א אֲשֶׁ֣ר לְ/שָׁא֑וּל לָקַ֗ח אֶת אִ֥ישׁ בֹּ֨שֶׁת֙ בֶּן שָׁא֔וּל וַ/יַּעֲבִרֵ֖/הוּ מַחֲנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/008.yaml
  text: But Abner son of Ner[a], the commander of Saul’s army, took Ish-bosheth son of Saul and brought him over to Mahanaim.
  footnotes:
  - marker: a
    text: Ish-bosheth is called Eshbaal in 1 Chronicles 8:33 and 9:39.
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 넬의 아들이며 사울 군대의 지휘관인 아브넬이 사울의 아들 이스보셋을 데리고 마하나임으로 건너갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이스보셋은 역대상 8:33과 9:39에서는 에스바알로 불립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַבְנֵר
  english_pob_choice: But Abner
  chosen_korean: 그런데 아브넬
  alternatives_korean:
  - 그리고 아브넬
  - 또 아브넬
  lexicon: HALOT
  rationale: 앞절과의 서술 대비를 살려 וְ를 단순한 연결이 아니라 전환의 '그런데'로 옮겼고, 인명은 음역했습니다.
- source_word: בֶּן נֵר
  english_pob_choice: son of Ner
  chosen_korean: 넬의 아들
  alternatives_korean:
  - 네르의 아들
  - 넬의 자식
  lexicon: HALOT
  rationale: 히브리어 친족 관계를 자연스러운 소유격으로 옮겼고, 고유명사는 한국어 성경 관용에 맞춰 '넬'로 처리했습니다.
- source_word: שַׂר צָבָא אֲשֶׁר לְשָׁאוּל
  english_pob_choice: the commander of Saul’s army
  chosen_korean: 사울 군대의 지휘관
  alternatives_korean:
  - 사울의 군대 사령관
  - 사울에게 속한 군대의 대장
  lexicon: HALOT
  rationale: שַׂר צָבָא의 직책성을 살려 '지휘관'으로 옮겼고, אֲשֶׁר לְשָׁאוּל의 소속 관계를 간결하게 반영했습니다.
- source_word: וַיַּעֲבִרֵהוּ
  english_pob_choice: brought him over
  chosen_korean: 건넜습니다
  alternatives_korean:
  - 데려갔습니다
  - 건너가게 했습니다
  - 데려다가 건넜습니다
  lexicon: HALOT
  rationale: Hiphil의 사역적 의미를 살리되 한국어에서는 목적어를 전면에 두지 않고도 이동의 결과를 자연스럽게 표현할 수 있어 '건넜습니다'로 정리했습니다. 앞의 '데려다가'가 사역·동행의 뉘앙스를 보완합니다.
- source_word: מַחֲנָיִם
  english_pob_choice: Mahanaim
  chosen_korean: 마하나임
  alternatives_korean:
  - 마하나임성
  - 마하나임 지역
  lexicon: HALOT
  rationale: 지명으로 음역을 유지해 본문이 특정 장소를 가리킨다는 사실을 보존했습니다.
theological_decisions:
- issue: 이스보셋의 이름 형태
  chosen_reading: 본문의 마소라 본문 이름 '이스보셋'을 본문에 유지하고, 다른 본문에서의 이형을 각주로 처리했습니다.
  alternative_readings:
  - 에스바알을 본문에 반영
  - 두 이름을 본문에 병기
  rationale: 이 구절의 히브리어 본문은 '이יש בֹּשֶׁת'를 지지하므로 본문은 이를 따르고, 병행 전승 정보는 각주로 제한하는 편이 원문과 주석 정보를 함께 보존합니다.
  doctrine_reference: 본문비평/본문전승
