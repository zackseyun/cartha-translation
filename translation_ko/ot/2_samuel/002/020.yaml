lexical_decisions:
- source_word: וַיִּפֶן ... אַחֲרָיו
  english_pob_choice: turned behind him
  chosen_korean: 뒤를 돌아보며
  alternatives_korean:
  - 뒤를 향해
  - 뒤돌아
  lexicon: HALOT
  rationale: פנה의 기본 의미인 ‘돌다/돌아보다’를 자연스럽게 살리되, אַחֲרָיו의 방향감도 함께 드러내기 위해 ‘뒤를 돌아보며’로 옮겼습니다.
- source_word: הֲאַתָּה זֶה עֲשָׂהאֵל
  english_pob_choice: Are you Asahel? / Or, more literally, “Are you this one, Asahel?”
  chosen_korean: 아사헬이냐?
  alternatives_korean:
  - 당신이 아사헬이냐?
  - 네가 아사헬이냐?
  lexicon: HALOT
  rationale: 히브리어의 신원 확인 질문을 한국어에서는 가장 직접적인 형태로 압축해, POB의 대안 번역이 보여 주는 지시적 뉘앙스는 이름 제시만으로 충분히 드러내게 했습니다.
- source_word: אָנֹכִי
  english_pob_choice: I am
  chosen_korean: 내가 바로 나다
  alternatives_korean:
  - 나다
  - 내가 그렇다
  lexicon: HALOT
  rationale: אָנֹכִי의 짧은 자기 확인 답변을 단순한 ‘나입니다’보다 더 분명한 동일성 응답으로 살리되, 한국어 문맥에 자연스러운 직설형으로 옮겼습니다.
theological_decisions:
- issue: 아브넬의 질문과 아사헬의 대답이 모두 인물 식별을 위한 짧은 대화인지 여부
  chosen_reading: 서술은 감정적 확대 없이, 급박한 추격 장면 속에서 서로를 확인하는 짧고 직접적인 응답으로 읽었습니다.
  alternative_readings:
  - 아브넬의 질문에 불신이나 도발의 뉘앙스를 더 강하게 읽는 해석
  - 아사헬의 대답을 완곡한 신분 확인으로 완화하는 해석
  rationale: 히브리어 본문은 최소한의 말로 신원 확인을 제시하므로, 번역도 장면의 긴박감은 유지하되 의미를 덧붙이지 않는 쪽이 적절합니다.
  doctrine_reference: 본문의 서사적 명료성 보존
