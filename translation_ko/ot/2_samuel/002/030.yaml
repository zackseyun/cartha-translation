translation:
  language: ko
  text: 요압은 아브넬을 추격하던 일을 그만두고 돌아와 온 군사를 모았습니다. 그 수를 세어 보니 다윗의 부하들 가운데 열아홉 명과 아사헬이 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘열아홉 명과 아사헬’입니다. 아사헬은 열아홉 명에 더하여 따로 계산됩니다.
    reason: lexical_alternative
