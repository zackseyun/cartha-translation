  text: And Joab returned from pursuing Abner[a], and he gathered all the people. When they were counted, nineteen men of David’s servants were missing, besides Asahel.
  footnotes:
  - marker: a
    text: 'Hebrew: ''nineteen men, and Asahel.'' The wording indicates Asahel is counted in addition to the nineteen.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 요압은 아브넬의 뒤를 추격하다가 돌아와 온 백성을 모았습니다. 그들을 셌을 때, 다윗의 종들 가운데 열아홉 명이 빠졌고, 아사헬은 따로 포함되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 ‘열아홉 명과 아사헬’로 이해되며, 아사헬은 열아홉 명과 더불어 별도로 شمار됩니다.
    reason: lexical_alternative
lexical_decisions:
