theological_decisions:
- issue: 아사헬의 포함 방식
  chosen_reading: ‘열아홉 명이 빠졌고, 아사헬은 따로 포함되었습니다’라고 처리해, 본문이 아사헬을 열아홉 명과 별도로 계산한다는 점을 드러냈습니다.
  alternative_readings:
  - ‘열아홉 명과 아사헬’
  - ‘열아홉 명, 곧 아사헬을 포함하여’
  rationale: 히브리어 배열과 영어 POB 주석이 아사헬을 추가 casualty로 설명하므로, 수치와 인물의 관계를 모호하게 하지 않고 분리해 전달했습니다.
  doctrine_reference: source alignment / textual clarity
