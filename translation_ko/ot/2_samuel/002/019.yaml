  chosen_korean: 좌로나 우로나
  alternatives_korean:
  - 오른쪽으로나 왼쪽으로나
  - 우로나 좌로나
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서도 대칭 구조로 살리기 위해 “좌로나 우로나”로 옮겼습니다.
- source_word: מֵאַחֲרֵי אַבְנֵר
  english_pob_choice: from following Abner
  chosen_korean: 아브넬을 따라가는 데서 벗어나지 않았습니다
  alternatives_korean:
  - 아브넬 뒤에서 벗어나지 않았습니다
  - 아브넬을 따라가는 길에서 벗어나지 않았습니다
  lexicon: HALOT
  rationale: 직역적인 ‘뒤에서’보다, 추적 상황을 드러내는 ‘따라가는 데서 벗어나지 않았다’가 문맥과 더 잘 맞습니다.
