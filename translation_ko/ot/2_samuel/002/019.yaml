lexical_decisions:
- source_word: וַיִּרְדֹּף
  english_pob_choice: pursued
  chosen_korean: 뒤쫓았는데
  alternatives_korean:
  - 추격했습니다
  - 쫓았습니다
  lexicon: HALOT
  rationale: רדף는 지속적인 추적을 뜻하므로, 현대 한국어에서 자연스러운 ‘뒤쫓다’로 옮겨 추적의 강도를 살렸습니다.
- source_word: וְלֹא נָטָה
  english_pob_choice: did not turn
  chosen_korean: 돌이켜
  alternatives_korean:
  - 돌지 않고
  - 벗어나지 않고
  lexicon: HALOT
  rationale: נטה의 기본 이미지는 경로에서 옆으로 ‘비키거나 돌다’이므로, “돌이켜”를 써서 방향 이탈의 동작을 살렸습니다.
- source_word: עַל הַיָּמִין וְעַל הַשְּׂמֹאול
