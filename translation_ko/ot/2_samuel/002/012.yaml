id: 2SA.2.12
reference: 2 Samuel 2:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ אַבְנֵ֣ר בֶּן נֵ֔ר וְ/עַבְדֵ֖י אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֑וּל מִֽ/מַּחֲנַ֖יִם גִּבְעֽוֹנָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/012.yaml
  text: Then Abner son of Ner[a], and the servants of Ish-bosheth son of Saul, went out from Mahanaim to Gibeon.
  footnotes:
  - marker: a
    text: Hebrew 'Ish-bosheth'; the same man is called 'Eshbaal' in 1 Chronicles 8:33; 9:39.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 넬의 아들 아브넬과 사울의 아들 이스보셋[a]의 종들이 마하나임에서 기브온으로 나갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘이스보셋’이라고 합니다. 역대기상 8:33과 9:39에서는 같은 인물이 ‘에스바알’로 불립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: Then ... went out
  chosen_korean: 나와 ... 갔습니다
  alternatives_korean:
  - 나갔습니다
  - 출발했습니다
  lexicon: WLC/서술 진행
  rationale: 서술의 진행을 자연스럽게 살리기 위해 ‘나와’로 동작의 시작을, 뒤의 ‘갔습니다’로 이동의 결과를 표현했습니다.
- source_word: וְעַבְדֵי
  english_pob_choice: the servants of
  chosen_korean: 종들이
  alternatives_korean:
  - 신하들이
  - 수종들이
  - 부하들이
  lexicon: HALOT
  rationale: 이 용례는 단순한 ‘사람들’보다 소속과 예속 관계를 드러내는 어휘가 필요하므로, 본문의 עֶבֶד 계열 의미를 살려 ‘종들’로 옮겼습니다.
- source_word: אַבְנֵר בֶּן נֵר
  english_pob_choice: Abner son of Ner
  chosen_korean: 아브넬—넬의 아들—
  alternatives_korean:
  - 넬의 아들 아브넬
  - 아브넬, 넬의 아들
  lexicon: 고유명사/친족관계
  rationale: 히브리어의 인명과 족보 정보를 그대로 살리되, 한국어에서 읽기 쉬운 삽입절 형태로 배치했습니다.
- source_word: מִמַּחֲנַיִם ... גִּבְעוֹנָה
  english_pob_choice: from Mahanaim ... to Gibeon
  chosen_korean: 마하나임에서 나와 기브온으로
  alternatives_korean:
  - 마하나임에서 기브온으로
  - 마하나임으로부터 기브온을 향해
  lexicon: 지명/방향 표지
  rationale: מִן의 출발점과 지명상의 방향성을 한국어 이동 표현으로 자연스럽게 반영했습니다.
theological_decisions:
- issue: ‘이스보셋’ 인명 표기 유지
  chosen_reading: 본문의 마소라 본문 이름형을 따라 ‘이스보셋’을 유지했습니다.
  alternative_readings:
  - 역대기의 평행형인 ‘에스바알’
  rationale: 이 절의 히브리어 본문은 אִישׁ־בֹּשֶׁת를 읽으므로, 사무엘서 본문에 맞는 이름을 유지하고 평행 전승은 각주로 처리하는 편이 본문 충실도에 맞습니다.
  doctrine_reference: 본문비평/평행본문 전승
