revisions:
- from: 그때 아브넬—넬의 아들—과 이스보셋, 사울의 아들의 종들이 마하나임에서 나와 기브온으로 갔습니다.[a]
  to: 그때 넬의 아들 아브넬과 사울의 아들 이스보셋[a]의 종들이 마하나임에서 기브온으로 나갔습니다.
  rationale: The revision restores the Hebrew possessive syntax, retaining the appositional identification of both men, and renders the single motion verb with one natural Korean verb. The note continues to identify the Chronicles name form without treating it as the reading of this verse.
  reviewer_model: gpt-5.6-terra
