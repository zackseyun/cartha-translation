  text: וַ/יֹּ֧סֶף ע֣וֹד אַבְנֵ֗ר לֵ/אמֹר֙ אֶל עֲשָׂהאֵ֔ל ס֥וּר לְ/ךָ֖ מֵ/אַֽחֲרָ֑/י לָ֤/מָּה אַכֶּ֨/כָּה֙ אַ֔רְצָ/ה וְ/אֵיךְ֙ אֶשָּׂ֣א פָנַ֔/י אֶל יוֹאָ֖ב אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/022.yaml
  text: Abner said again to Asahel[a], “Turn aside from following me. Why should I strike you to the ground? Then how could I lift up my face to Joab your brother?”
  footnotes:
  - marker: a
    text: Or, 'How could I face Joab your brother?' The Hebrew literally says, 'How could I lift up my face to Joab your brother?'
    reason: lexical_alternative
translation:
  language: ko
  text: 아브넬이 아사헬에게 다시 말했습니다. “나를 따라오는 것을 그만두고 옆으로 비키십시오. 내가 왜 당신을 땅에 쓰러뜨려야 합니까? 그러고 나서 내가 어떻게 당신의 형제 요압을 마주하겠습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 어떻게 당신의 형제 요압을 마주하겠습니까?’ 히브리어는 문자적으로 ‘내가 어떻게 내 얼굴을 당신의 형제 요압에게 들 수 있겠습니까?’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... לֵאמֹר
  english_pob_choice: said again
  chosen_korean: 다시 말했습니다
  alternatives_korean:
  - 계속 말했습니다
  - 다시 덧붙여 말했습니다
  lexicon: HALOT
  rationale: 반복 발화의 관용을 자연스러운 한국어로 옮기되, ‘다시’로 재차 말한 점을 살렸습니다.
- source_word: סוּר לְךָ מֵאַחֲרַי
  english_pob_choice: Turn aside from following me
  chosen_korean: 나를 따라오는 것을 그만두고 옆으로 비키십시오
  alternatives_korean:
  - 나를 뒤따르는 데서 돌아서십시오
  - 내 뒤에서 물러나십시오
  lexicon: HALOT
  rationale: ‘뒤에서 따르다’의 공간적 이미지를 유지하면서도 한국어로는 명령의 의미가 분명하도록 옮겼습니다.
- source_word: לָמָּה אַכֶּכָּה אַרְצָה
  english_pob_choice: Why should I strike you down to the ground?
  chosen_korean: 내가 왜 당신을 땅에 쓰러뜨려야 합니까?
  alternatives_korean:
  - 내가 왜 당신을 땅에 치겠습니까?
  - 내가 왜 당신을 땅에 쓰러뜨리겠습니까?
  lexicon: HALOT
  rationale: נכה의 강한 타격 의미와 אַרְצָה의 ‘땅으로’라는 방향성을 살리되, 한국어에서는 ‘쓰러뜨리다’가 자연스럽고 결과를 잘 드러냅니다.
- source_word: וְאֵיךְ אֶשָּׂא פָנַי
  english_pob_choice: Then how could I lift up my face
  chosen_korean: 그러고 나서 내가 어떻게 ... 마주하겠습니까
  alternatives_korean:
  - 그러면 내가 어떻게 얼굴을 들겠습니까
  - 그러고 나서 내가 어떻게 ... 얼굴을 들 수 있겠습니까
  lexicon: HALOT
  rationale: 직역인 ‘얼굴을 들다’는 가능하지만, 여기서는 부끄러움 없이 상대를 대한다는 관용을 한국어로 자연스럽게 풀었습니다.
- source_word: אֶל יוֹאָב אָחִיךָ
  english_pob_choice: to Joab your brother
  chosen_korean: 당신의 형제 요압을
  alternatives_korean:
  - 당신의 형 요압을
  - 형제 요압에게
  lexicon: HALOT
  rationale: אָחִיךָ는 관계를 강조하는 ‘당신의 형제’로 옮겨 아사헬에게 하는 직접적 호소를 살렸습니다.
- source_word: עֲשָׂהאֵל / אַבְנֵר / יוֹאָב
  english_pob_choice: Asahel / Abner / Joab
  chosen_korean: 아사헬 / 아브넬 / 요압
  alternatives_korean:
  - 아사헬 / 아브넬 / 요압
  lexicon: proper_name
  rationale: 한국어 성경에서 널리 쓰이는 표기를 따랐습니다.
theological_decisions:
- issue: 직접 화법의 공손성
  chosen_reading: 아사헬에게 하는 경고를 현대 한국어 명령형 ‘비키십시오’와 의문형 ‘합니까?’로 옮겼습니다.
  alternative_readings:
  - 더 직역적인 ‘돌아서십시오’
  - 더 강한 군사적 어감의 ‘물러나십시오’
  rationale: 본문은 전투 중의 절박한 경고이므로, 합쇼체를 유지하면서도 압박감이 살아나도록 했습니다.
  doctrine_reference: 문체/화행의 등가성
