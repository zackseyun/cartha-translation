  text: וַ/יִּשְׁלַ֤ח דָּוִד֙ מַלְאָכִ֔ים אֶל אַנְשֵׁ֖י יָבֵ֣ישׁ גִּלְעָ֑ד וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם בְּרֻכִ֤ים אַתֶּם֙ לַֽ/יהוָ֔ה אֲשֶׁ֨ר עֲשִׂיתֶ֜ם הַ/חֶ֣סֶד הַ/זֶּ֗ה עִם אֲדֹֽנֵי/כֶם֙ עִם שָׁא֔וּל וַֽ/תִּקְבְּר֖וּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/005.yaml
  text: Then David sent messengers to the men of Jabesh-gilead and said to them[a], “Blessed are you by Yahweh, because you have shown this kindness to your lord, to Saul[b], and have buried him.”
  footnotes:
  - marker: a
    text: Or “Blessed are you by the LORD.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew hesed; often denotes kindness, loyalty, or faithful love.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗이 사자들을 야베스길르앗 사람들에게 보내며 그들에게 말했습니다. “야훼께 복을 받은 사람들이 되십시오. 여러분이 여러분의 주, 곧 사울에게 이 호의를 베풀어 그를 장사하였기 때문입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼께 복을 받은 사람들이 되십시오.”
    reason: alternative_reading
  - marker: b
    text: 히브리어 חֶסֶד는 보통 친절, 충성, 신실한 사랑을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들
  - 메신저들
  lexicon: HALOT
  rationale: 이 서사 문맥에서는 천사가 아니라 다윗이 보낸 인간 전달자이므로, 한국어에서는 자연스럽고 격식 있는 ‘사자들’이 적절합니다.
- source_word: בְּרֻכִים אַתֶּם לַיהוָה
  english_pob_choice: Blessed are you by Yahweh
  chosen_korean: 야훼께 복을 받은 사람들이 되십시오
  alternatives_korean:
  - 야훼께 복을 받으십시오
  - 야훼께 복 받은 사람들입니다
  lexicon: HALOT
  rationale: 히브리어 분사문을 한국어에서 축복 선언으로 자연스럽게 옮기되, 명령형/기도문이 아니라 선언적 축복으로 들리도록 ‘복을 받은 사람들이 되십시오’로 처리했습니다.
- source_word: חֶסֶד
  english_pob_choice: this kindness
  chosen_korean: 이 호의
  alternatives_korean:
  - 이 친절
  - 이 인애
  - 이 언약적 사랑
  lexicon: HALOT
  rationale: 여기서는 사울의 장례를 치른 구체적 행위를 가리키므로, 넓은 신학어보다 행위의 성격을 담는 ‘호의’가 가장 직접적입니다.
- source_word: אֲדֹנֵיכֶם
  english_pob_choice: your lord
  chosen_korean: 여러분의 주
  alternatives_korean:
  - 여러분의 주인
  - 여러분의 군주
  lexicon: HALOT
  rationale: 사울의 신분을 존칭과 통치자적 관계를 함께 드러내는 표현으로 살렸습니다. ‘주인’은 지나치게 종속적 뉘앙스가 있어 본문보다 강합니다.
- source_word: וַתִּקְבְּרוּ אֹתוֹ
  english_pob_choice: and have buried him
  chosen_korean: 그를 장사하였기 때문입니다
  alternatives_korean:
  - 그를 묻었기 때문입니다
  - 그를 매장하였기 때문입니다
  lexicon: HALOT
  rationale: 본문의 보상 사유를 자연스럽게 연결하기 위해 종결형 대신 이유절로 옮겼습니다. ‘장사하다’는 시신을 정중하게 매장했다는 의미를 잘 살립니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 문맥상 하나님의 고유명사를 드러내는 것이 중요하므로, 전통적 대체어 대신 음역형 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
