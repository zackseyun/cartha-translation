  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 בְּרֻכִים אַתֶּם לַיהוָה는 명령이나 소망이라기보다 축복의 선언이므로, ‘…되십시오’는 원문의 문법적 힘을 바꿉니다. 또한 וַיִּשְׁלַח … וַיֹּאמֶר의 연속 동작은 ‘보내고 … 말했습니다’로 옮기는 편이 정확합니다.
  naturalness: ‘야훼께 복을 받은 사람들이 되십시오’는 현대 한국어에서 부자연스럽고, 선언적 축복과 명령형이 충돌합니다. ‘여러분은 야훼께 복을 받은 사람들입니다’가 자연스러운 합쇼체이며 원문의 축복 선언도 보존합니다. ‘호의’보다 장례라는 구체적 행위와 חֶסֶד의 관계적 뉘앙스에 ‘친절’이 더 자연스럽습니다.
  terminology: ‘야훼’, ‘다윗’, ‘사울’, ‘사자들’은 적절합니다. 지명은 한국어 성경 표기 관례에 따라 ‘야베스 길르앗’으로 띄어 쓰는 것이 좋습니다. ‘여러분의 주, 곧 사울’은 아도네켐과 사울의 동격을 잘 반영합니다.
