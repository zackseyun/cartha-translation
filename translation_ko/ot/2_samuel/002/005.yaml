  text: 그때 다윗이 사자들을 야베스 길르앗 사람들에게 보내고 그들에게 말했습니다. “여러분은 야훼께 복을 받은 사람들입니다. 여러분이 여러분의 주, 곧 사울에게 이 친절을 베풀고 그를 장사했기 때문입니다.”[b]
