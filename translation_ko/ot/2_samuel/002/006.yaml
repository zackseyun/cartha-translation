id: 2SA.2.6
reference: 2 Samuel 2:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֕ה יַֽעַשׂ יְהוָ֥ה עִמָּ/כֶ֖ם חֶ֣סֶד וֶ/אֱמֶ֑ת וְ/גַ֣ם אָנֹכִ֗י אֶעֱשֶׂ֤ה אִתְּ/כֶם֙ הַ/טּוֹבָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר עֲשִׂיתֶ֖ם הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/006.yaml
  text: And now may Yahweh show you steadfast love and faithfulness[a]. And I also will do this good to you[c][b], because you have done this thing.
  footnotes:
  - marker: a
    text: Or 'the LORD will show you steadfast love and faithfulness.' The Hebrew verb can be read as a benedictory wish or as a future statement.
    reason: alternative_reading
  - marker: b
    text: '''This thing'' refers to the action just mentioned in the previous verse: burying Saul.'
    reason: cross_reference
  - marker: c
    text: Or 'this kindness' for 'this good.' The Hebrew literally says 'this good.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 야훼께서 여러분에게 한결같은 사랑과 신실함을 베푸시기를 바랍니다[a]. 그리고 저도 여러분에게 이 좋은 것을 베풀겠습니다[c][b]. 여러분이 이 일을 하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '야훼께서 여러분에게 한결같은 사랑과 신실함을 베푸실 것입니다.' 히브리어 동사는 축복적 기원으로도, 미래 진술로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: '''이 일''은 바로 앞절에서 언급된 사울의 장례를 가리킵니다.'
    reason: cross_reference
  - marker: c
    text: 또는 '이 친절'로도 옮길 수 있습니다. 히브리어는 문자적으로 '이 좋은 것'이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 문자적 대체 тит울이 아니라 신명 자체를 드러내기 위해 POB의 원칙대로 야훼를 사용했습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 한결같은 사랑
  alternatives_korean:
  - 인애
  - 변함없는 사랑
  - 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·관계적 충실성을 살리되, 한국어에서 자연스럽고 과도하게 교회화되지 않는 표현으로 옮겼습니다.
- source_word: וֶאֱמֶת
  english_pob_choice: faithfulness
  chosen_korean: 신실함
  alternatives_korean:
  - 진리
  - 성실
  - 진실함
  lexicon: HALOT
  rationale: 이 결합에서는 추상적 '진리'보다 관계적 신뢰성과 충실성을 나타내는 '신실함'이 더 정확합니다.
- source_word: הַטּוֹבָה הַזֹּאת
  english_pob_choice: this good
  chosen_korean: 이 좋은 일
  alternatives_korean:
  - 이 선
  - 이 친절
  - 이 호의
  lexicon: HALOT
  rationale: 히브리어의 직역 의미인 '이 좋은 것'을 살리면서, 한국어에서는 행위 대상으로 자연스럽게 들리는 '좋은 일'로 표현했습니다.
theological_decisions:
- issue: יַעַשׂ의 용법
  chosen_reading: 축복의 기원으로서 '…하시기를 바랍니다'로 옮겼습니다.
  alternative_readings:
  - '미래 예고형: ''…하실 것입니다'''
  - 단순 명령형 기원
  rationale: 문맥상 다윗이 축복을 선언하는 자리이므로, 완료된 예언이 아니라 야훼의 베푸심을 비는 축복적 뉘앙스를 유지했습니다.
  doctrine_reference: 번역 철학 §3 — 본문이 허용하는 긴장은 보존한다
- issue: אָנֹכִי의 강조
  chosen_reading: '''저도''로 옮겨 다윗의 대응적 약속을 강조했습니다.'
  alternative_readings:
  - '''나도'''
  - '''저 또한'''
  rationale: 히브리어의 인칭 강조를 살리면서 한국어에서 자연스러운 자기 언급을 유지했습니다.
  doctrine_reference: 문맥 기반 서술 강조
