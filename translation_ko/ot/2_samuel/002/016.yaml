  lexicon: HALOT
  rationale: 전투 장면의 급박하고 폭력적인 동작을 살리기 위해 단순한 ‘잡다’보다 강한 ‘움켜쥐다’를 택했습니다.
- source_word: אִישׁ
  english_pob_choice: Each man
  chosen_korean: 각 사람은
  alternatives_korean:
  - 각자
  - 한 사람은
  lexicon: HALOT
  rationale: 쌍을 이룬 전투자 둘을 분배적으로 가리키므로, ‘각 사람은’이 반복되는 대칭성을 잘 드러냅니다.
- source_word: בְּרֹאשׁ רֵעֵהוּ / וְחַרְבּוֹ בְּצַד רֵעֵהוּ
  english_pob_choice: by the head ... and his sword was in his companion’s side
  chosen_korean: 자기 상대의 머리를 ... 자기 상대의 옆구리에
  alternatives_korean:
  - 상대의 머리를 ... 상대의 옆구리에
  - 동무의 머리를 ... 동무의 옆구리에
  lexicon: HALOT
  rationale: רֵעַ는 여기서 우정이 아니라 맞붙은 상대를 가리키므로 ‘상대’로 옮겼고, בְּצַד는 문자적으로 ‘옆, 옆구리’의 뜻을 살렸습니다.
- source_word: חֶלְקַת הַצֻּרִים
  english_pob_choice: Helkath-hazzurim
  chosen_korean: 헤르깟핫추림
  alternatives_korean:
  - 헬깟핫추림
  - 헬카트하추림
  lexicon: HALOT
  rationale: 지명은 음역으로 보존해야 하며, 의미가 불확실하므로 한국어로 뜻을 확정하지 않았습니다.
