base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/016.yaml
  text: Each man seized his companion by the head[a], and his sword was in his companion’s side, so they fell together. Therefore that place, which is in Gibeon, was called Helkath-hazzurim.
  footnotes:
  - marker: a
    text: Helkath-hazzurim is a transliteration of the Hebrew place name. Its exact sense is uncertain; proposed meanings include 'Field of the Sides,' 'Field of the Sharp Swords,' and other similar renderings.
    reason: lexical_alternative
translation:
  language: ko
  text: 각 사람은 자기 상대의 머리를 움켜쥐고, 각자의 칼은 자기 상대의 옆구리에 있었으므로, 그들은 함께 쓰러졌습니다. 그래서 기브온에 있는 그곳은 헬갓핫수림이라 불렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헬갓핫수림’은 히브리어 지명의 음역입니다. 정확한 뜻은 확정되지 않았으며, ‘옆구리들의 들판’, ‘날카로운 칼들의 들판’ 등으로 제안되어 왔습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזִקוּ
