  text: וַֽ/יְהִי֙ מִסְפַּ֣ר הַ/יָּמִ֔ים אֲשֶׁר֩ הָיָ֨ה דָוִ֥ד מֶ֛לֶךְ בְּ/חֶבְר֖וֹן עַל בֵּ֣ית יְהוּדָ֑ה שֶׁ֥בַע שָׁנִ֖ים וְ/שִׁשָּׁ֥ה חֳדָשִֽׁים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/011.yaml
  text: The length of time that David was king in Hebron over the house of Judah was seven years and six months[a].
  footnotes:
  - marker: a
    text: Or 'the number of the days.' The Hebrew idiom refers to the duration of David's reign in Hebron.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 헤브론에서 유다 집을 다스리는 왕으로 있던 기간은 일곱 해와 여섯 달이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘날의 수’이지만 여기서는 다윗이 헤브론에서 통치한 기간을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: מִסְפַּר הַיָּמִים
  english_pob_choice: The length of time
  chosen_korean: 기간은
  alternatives_korean:
  - 날의 수는
  - 시간의 길이는
  lexicon: HALOT
  rationale: 직역하면 ‘날의 수’이지만, 여기서는 다윗의 통치 기간을 요약하는 관용 표현이므로 한국어에서는 자연스럽고 정확한 ‘기간’으로 풀었습니다.
- source_word: הָיָה דָוִד מֶלֶךְ
  english_pob_choice: David was king
  chosen_korean: 다윗이 … 왕으로 있던
  alternatives_korean:
  - 다윗이 왕이었던
  - 다윗이 왕으로 다스린
  lexicon: HALOT
  rationale: 단순 신분 진술보다 재위의 상태를 드러내는 표현이어서 ‘왕으로 있던’이 원문의 서술 기능을 잘 살립니다.
- source_word: בְּחֶבְרוֹן
  english_pob_choice: in Hebron
  chosen_korean: 헤브론에서
  alternatives_korean:
  - 헤브론 안에서
  - 헤브론에
  lexicon: HALOT
  rationale: 지명 앞 ב의 위치 의미를 자연스럽게 살리기 위해 표준적인 ‘헤브론에서’를 사용했습니다.
- source_word: עַל בֵּית יְהוּדָה
  english_pob_choice: over the house of Judah
  chosen_korean: 유다 집을 다스리며
  alternatives_korean:
  - 유다 집 위에
  - 유다의 집을 거느리며
  - 유다 집 위에서
  lexicon: HALOT
  rationale: ‘집’은 유다 공동체를 가리키는 집합적 표현이지만, 한국어에서는 ‘유다 집을 다스리며’가 원문의 통치 관계를 가장 분명하게 전달합니다.
theological_decisions:
- issue: 연대 요약 방식
  chosen_reading: 히브리어 관용구 ‘날의 수’는 연대 계산의 공식적 요약으로 이해하여, 본문 의미를 드러내는 ‘기간’으로 옮겼습니다.
  alternative_readings:
  - ‘날들의 수’처럼 직역
  - ‘재위일수’로 기술화
  rationale: 이 절은 사건 서술이 아니라 다윗의 헤브론 재위 기간을 결산하는 문장이라, 한국어 독자가 본문의 기능을 즉시 이해하도록 옮기는 것이 적절합니다.
  doctrine_reference: 성경 번역의 명료성와 역사 서술의 기능 보존
- issue: ‘왕’과 ‘다스리다’의 결합
  chosen_reading: ‘왕으로 있던’과 ‘다스리며’를 함께 써서, 신분과 통치 행위를 모두 드러냈습니다.
  alternative_readings:
  - ‘왕이었던’만 사용
  - ‘통치하던’만 사용
  rationale: 원문은 דוד의 왕권과 그 왕권이 헤브론에서 유다 집에 대해 행사되었음을 함께 말하므로, 두 요소를 함께 보존하는 편이 더 충실합니다.
  doctrine_reference: 역사 서술의 의미 대응
