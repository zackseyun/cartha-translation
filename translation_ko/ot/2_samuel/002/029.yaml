base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/029.yaml
  text: And Abner and his men traveled through the Arabah all that night[a], crossed the Jordan, went through all the Bithron, and came to Mahanaim.
  footnotes:
  - marker: a
    text: Or possibly 'through all the ravine/gorge region'; the Hebrew term 'Bithron' may be a place-name or a descriptive geographical term.
    reason: lexical_alternative
translation:
  language: ko
  text: 압넬과 그의 사람들은 그 밤 내내 아라바를 지나, 요르단을 건너, 비드론 온 땅을 거쳐 마하나임에 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘비드론’은 지명일 수도 있고, ‘산골짜기/협곡 지역’ 같은 지리 묘사일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֲרָבָה / the Arabah
  english_pob_choice: through the Arabah
  chosen_korean: 아라바를 지나
  alternatives_korean:
  - 평원을 지나
  - 아라바 광야를 지나
  lexicon: HALOT
  rationale: 지명적·지리적 의미가 강하므로 일반명사화하지 않고 음역을 유지했습니다.
- source_word: כָּל הַלַּיְלָה הַהוּא / all that night
  english_pob_choice: all that night
  chosen_korean: 그 밤 내내
  alternatives_korean:
  - 그 밤 전체를
  - 온 밤 동안
  lexicon: HALOT
  rationale: 밤 전체를 관통하는 지속성을 자연스러운 현대 한국어로 압축해 살렸습니다.
- source_word: כָּל הַבִּתְרוֹן / all the Bithron
  english_pob_choice: all the Bithron
  chosen_korean: 비드론 온 땅
  alternatives_korean:
  - 비드론을 지나
  - 온 비드론
  lexicon: HALOT
  rationale: 영어 POB의 각주처럼 지명일 가능성을 열어 두면서도, 한국어에서 지역 전체를 통과한다는 의미를 드러내기 위해 ‘온 땅’을 덧붙였습니다.
- source_word: מַחֲנָיִם / Mahanaim
  english_pob_choice: Mahanaim
  chosen_korean: 마하나임
  alternatives_korean:
  - 마하나임 성읍
  - 두 진영
  lexicon: HALOT
  rationale: 고유지명으로 보고 음역했습니다.
- source_word: וַאֲנָשָׁיו / his men
  english_pob_choice: his men
  chosen_korean: 그의 사람들
  alternatives_korean:
  - 그와 함께한 사람들
  - 그의 부하들
  lexicon: HALOT
  rationale: 군사 맥락의 추론은 가능하지만, 원문 자체는 단순히 ‘그의 사람들’이므로 해석을 과도하게 좁히지 않았습니다.
theological_decisions:
- issue: 여정 동사의 연속과 속도감
  chosen_reading: ‘지나, … 건너, … 거쳐, … 이르렀습니다’로 연속 동작을 살렸습니다.
  alternative_readings:
  - ‘갔습니다’로 통일
  - ‘통과했습니다’로 통일
  rationale: 히브리어 연속 동사들의 진행감을 보존해 야간 이동의 긴박함을 드러내기 위해서입니다.
  doctrine_reference: 서사 문맥의 의미 보존
