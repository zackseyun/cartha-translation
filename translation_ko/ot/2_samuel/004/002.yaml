base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/002.yaml
  text: 'Now Saul’s son had two men who were commanders of raiding bands: the name of the one was Baanah[a], and the name of the second was Rechab, sons of Rimmon the Beerothite, from the sons of Benjamin; for Beeroth also was considered part of Benjamin.'
  footnotes:
  - marker: a
    text: Or “was counted as belonging to Benjamin.”
    reason: lexical_alternative
translation:
  language: ko
  text: 사울의 아들에게는 습격대의 지휘관 두 사람이 있었는데, 하나의 이름은 바아나이고 둘째의 이름은 레갑이었습니다. 그들은 브에롯 사람 림몬의 아들들로서, 베냐민의 자손들 가운데 있었습니다. 브에롯도 베냐민에 속한 것으로 여겨졌기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “베냐민에 속한 것으로 계산되었기”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי גְדוּדִים
  english_pob_choice: commanders of raiding bands
  chosen_korean: 습격대의 지휘관
  alternatives_korean:
  - 전투대의 지휘관
  - 무리의 우두머리
  lexicon: HALOT
  rationale: גְדוּדִים은 정규 군대보다 습격·약탈과 관련된 무리를 가리키는 경우가 많아, 단순한 ‘군대’보다 ‘습격대’가 문맥을 더 잘 살립니다.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  english_pob_choice: the name of the one ... and the name of the second
  chosen_korean: 하나의 이름은 ... 둘째의 이름은
  alternatives_korean:
  - 첫째의 이름은 ... 둘째의 이름은
  - 한 사람의 이름은 ... 다른 사람의 이름은
  lexicon: HALOT
  rationale: 히브리어의 반복적 명명 형식을 그대로 살리되, 한국어에서는 자연스럽게 ‘하나/둘째’로 옮겨 인물 식별을 분명히 했습니다.
- source_word: בְּנֵי רִמּוֹן הַבְּאֶרֹתִי מִבְּנֵי בִנְיָמִן
  english_pob_choice: sons of Rimmon the Beerothite, from the sons of Benjamin
  chosen_korean: 브에롯 사람 림몬의 아들들로서, 베냐민의 자손들 가운데
  alternatives_korean:
  - 브에롯 사람 림몬의 아들들, 베냐민의 자손들
  - 브에롯 사람 림몬의 아들들로, 베냐민 지파에서
  lexicon: HALOT
  rationale: 출신지·가문·지파 소속을 차례로 드러내는 문장 구조를 유지해, 바아나와 레갑의 정체를 서술하는 원문의 층위를 보존했습니다.
- source_word: תֵּחָשֵׁב עַל בִּנְיָמִן
  english_pob_choice: was considered part of Benjamin
  chosen_korean: 베냐민에 속한 것으로 여겨졌기 때문입니다
  alternatives_korean:
  - 베냐민에 속한 것으로 간주되었기 때문입니다
  - 베냐민의 일부로 شمار되었기 때문입니다
  lexicon: HALOT
  rationale: נפעל형 תֵּחָשֵׁב는 ‘여겨지다/간주되다’의 수동적 판단을 나타내므로, ‘속한 것으로 여겨졌기’가 가장 자연스럽고 의미를 잘 전달합니다.
theological_decisions:
- issue: 브에롯의 베냐민 소속 설명
  chosen_reading: 지리적 출신과 지파 소속이 다를 수 있음을 설명하는 역사적 주석으로 옮기고, 본문이 말하는 소속 판단을 그대로 유지했습니다.
  alternative_readings:
  - 브에롯도 베냐민의 땅으로 계산되었기 때문입니다
  - 브에롯도 베냐민 지파에 포함되었기 때문입니다
  rationale: 원문은 단순한 지명 정보가 아니라, 두 인물이 왜 ‘베냐민의 자손들’로 분류되는지 설명하는 근거를 제시합니다. 따라서 판단 동사 ‘여겨졌’의 뉘앙스를 보존하는 것이 중요합니다.
  doctrine_reference: 본문 해석의 역사·지리적 맥락
