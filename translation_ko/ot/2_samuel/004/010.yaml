source:
  edition: WLC
  text: כִּ֣י הַ/מַּגִּיד֩ לִ֨/י לֵ/אמֹ֜ר הִנֵּה מֵ֣ת שָׁא֗וּל וְ/הֽוּא הָיָ֤ה כִ/מְבַשֵּׂר֙ בְּ/עֵינָ֔י/ו וָ/אֹחֲזָ֣/ה ב֔/וֹ וָ/אֶהְרְגֵ֖/הוּ בְּ/צִֽקְלָ֑ג אֲשֶׁ֥ר לְ/תִתִּ/י ל֖/וֹ בְּשֹׂרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/010.yaml
  text: When someone told me[a], saying, ‘Look, Saul is dead,’ and he thought he was bringing good news in his own eyes[b], I seized him and killed him in Ziklag—that was the reward I gave him for his news.
  footnotes:
  - marker: a
    text: Or, more formally, 'the one who told me, “Behold, Saul is dead,” while he was in his own eyes like one bringing good news.'
    reason: lexical_alternative
  - marker: b
    text: 'The final clause is elliptical in Hebrew and likely ironic: David means that execution, not payment, was the only ''reward'' the messenger received for reporting Saul''s death.'
    reason: cultural_note
translation:
  language: ko
  text: 그가 나에게 “보시오, 사울이 죽었습니다”라고 말했는데, 그는 자기 눈에는 마치 좋은 소식을 전하는 사람처럼 여겼습니다. 그래서 내가 그를 붙잡아 시글락에서 죽였으니—그의 소식에 대해 내가 그에게 준 보상이 그것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나에게 말한 자, 곧 “보라, 사울이 죽었다”라고 한 자’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 마지막 절은 생략적이며, 문맥상 그가 기대한 보상이 아니라 처형이 유일한 ‘보상’이었음을 드러냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַמַּגִּיד לִי לֵאמֹר
  english_pob_choice: someone told me, saying
  chosen_korean: 나에게 “...라고 말한 사람
  alternatives_korean:
  - 나에게 알리며 말한 사람
  - 나에게 전해 말한 사람
  lexicon: HALOT
  rationale: 분사구문을 한국어에서 자연스럽게 풀어 ‘말한 사람’으로 옮기되, 직접 인용 구조를 유지해 보고행위의 성격을 드러냈습니다.
- source_word: הִנֵּה מֵת שָׁאוּל
  english_pob_choice: ‘Look, Saul is dead,’
  chosen_korean: “보시오, 사울이 죽었습니다”
  alternatives_korean:
  - “보라, 사울이 죽었습니다”
  - “사울이 죽었습니다”
  lexicon: HALOT
  rationale: הִנֵּה의 주목 환기 기능을 살리기 위해 ‘보시오’를 택했고, 고전적 ‘보라’보다 현대 한국어 합쇼체에 맞게 조정했습니다.
- source_word: וְהוּא הָיָה כִמְבַשֵּׂר בְּעֵינָיו
  english_pob_choice: and he thought he was bringing good news in his own eyes
  chosen_korean: 그는 자기 눈에는 마치 좋은 소식을 전하는 사람처럼 여겼습니다
  alternatives_korean:
  - 그는 자기 눈에는 마치 기쁜 소식을 전하는 사람 같았습니다
  - 그는 스스로 좋은 소식을 전한다고 생각했습니다
  lexicon: HALOT
  rationale: כִמְבַשֵּׂר의 ‘좋은 소식/기쁜 소식’ 뉘앙스를 살리고, בְּעֵינָיו를 ‘자기 눈에는’로 옮겨 자기평가라는 관용을 보존했습니다.
- source_word: וָאֹחֲזָה בוֹ וָאֶהְרְגֵהוּ
  english_pob_choice: I seized him and killed him
  chosen_korean: 내가 그를 붙잡아 ... 죽였으니
  alternatives_korean:
  - 내가 그를 붙들어 ... 죽였으니
  - 내가 그를 잡아 ... 죽였으니
  lexicon: HALOT
  rationale: אָחַז는 강한 물리적 제압을 뜻하므로 ‘붙잡다’로 옮겨 행위의 폭력을 분명히 했습니다.
- source_word: בְּשֹׂרָה
  english_pob_choice: his news
  chosen_korean: 그의 소식
  alternatives_korean:
  - 그의 좋은 소식
  - 그가 전한 소식
  lexicon: HALOT
  rationale: 문맥상 보상 대상이 된 ‘전달된 소식’을 가리키므로, 영어처럼 ‘news’의 기본 의미를 따라 ‘소식’으로 번역했습니다.
theological_decisions:
- issue: 기쁜 소식/좋은 소식의 역설적 사용
  chosen_reading: ‘좋은 소식을 전하는 사람처럼’이라고 옮겨, 화자가 실제로는 사울의 죽음을 반가운 소식으로 간주했음을 드러냈습니다.
  alternative_readings:
  - ‘좋은 소식을 가져오는 사람’
  - ‘기쁜 소식을 전하는 사람’
  rationale: 히브리어는 화자가 자기 기준으로 ‘복된 소식 전달자’처럼 여겼다는 아이러니를 담으므로, 중립화하지 않고 역설을 살렸습니다.
  doctrine_reference: 서사적 아이러니와 인물 평가
- issue: 보상과 처벌의 반어
  chosen_reading: ‘그의 소식에 대해 내가 그에게 준 보상’이라고 하여, 실제 보상이 처형이었다는 반어를 유지했습니다.
  alternative_readings:
  - ‘그의 소식 값으로 내가 준 대가’
  - ‘그 소식에 대해 내가 준 품삯’
  rationale: 문맥상 ‘보상’은 긍정적 의미가 아니라 처벌로 대체된 역설이므로, 평가를 완화하지 않고 원문의 반어를 보존했습니다.
  doctrine_reference: 서사적 반어
- issue: 직접화법의 경어
  chosen_reading: 하나님께 직접 드리는 기도문이 아니라 인물의 발화이므로, 현대 합쇼체의 보고체를 유지했습니다.
  alternative_readings:
  - 반말형 인용
  - 더 고어체의 성경식 어법
  rationale: 등장인물의 말은 현대 독자가 읽을 수 있는 공적 서술체로 유지하는 것이 본문 의미 전달에 가장 적절합니다.
  doctrine_reference: 문체/담화 수준
