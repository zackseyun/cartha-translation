  to: 어떤 사람이 나에게 “보시오, 사울이 죽었습니다”라고 알렸을 때[a], 그는 자기 생각에는 자신이 좋은 소식을 전하는 사람이라고 여겼습니다. 나는 그를 붙잡아 시글락에서 죽였습니다. 그것이 내가 그에게 그가 전한 소식의 대가로 준 것이었습니다.[b]
  rationale: 선행사 없는 대명사를 명사구로 바로잡고, 원문에 없는 강한 인과 접속을 제거했습니다. 또한 ‘자기 눈에’라는 히브리어 관용이 나타내는 자기평가를 명시했으며, 마지막 절의 생략적·반어적 소식 대가 표현과 각주 위치를 본문 기능에 맞게 정리했습니다.
