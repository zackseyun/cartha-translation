  source_fidelity: 개정이 필요합니다. 초안의 ‘그가’는 선행사가 없이 시작하여 히브리어의 정관사 분사구 ‘나에게 알린 사람’을 충분히 전달하지 못합니다. 또한 ‘그래서’는 원문에 명시되지 않은 인과관계를 다소 강하게 만들고, ‘자기 눈에는 마치 좋은 소식을 전하는 사람처럼 여겼습니다’는 주어가 자신을 어떻게 평가했는지가 한국어에서 불분명합니다. 마지막 절의 반어적 ‘소식의 대가’를 유지하되, 죽임이 그 대가였음을 문장 구조로 명확히 하는 편이 좋습니다.
  naturalness: ‘어떤 사람이 … 알렸을 때’와 ‘자기 생각에는 자신이 좋은 소식을 전하는 사람이라고 여겼습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 자기평가라는 관용적 의미도 분명합니다. 두 문장으로 나누어 사건의 순서와 마지막 절의 반어를 읽기 쉽게 했습니다.
  terminology: 사울과 시글락은 통용 표기를 유지했습니다. מְבַשֵּׂר의 문맥상 ‘좋은 소식을 전하는 사람’을 유지하되, 그것이 그 사람 자신의 판단임을 명시했습니다. בְּשֹׂרָה는 여기서 전달한 소식 및 그에 대해 기대한 보수를 아우르는 반어적 표현이므로 ‘그가 전한 소식의 대가’로 옮겼습니다.
