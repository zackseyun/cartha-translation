  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서도 몸의 이미지가 살아 있도록 살리되, 의미가 분명하게 드러나는 ‘힘이 풀리다’로 옮겼습니다.
- source_word: נִבְהָלוּ
  english_pob_choice: was alarmed
  chosen_korean: 놀라움에 사로잡혔습니다
  alternatives_korean:
  - 불안해했습니다
  - 당황했습니다
  - 두려움에 사로잡혔습니다
  lexicon: HALOT
  rationale: ‘온 이스라엘’의 집단적 반응을 나타내므로, 단순한 정보 전달보다 동요와 충격을 함께 담는 표현을 택했습니다.
theological_decisions:
- issue: ‘온 이스라엘’의 집단 주어 처리
  chosen_reading: 개별 사람들이 아니라 민족 전체의 동요를 가리키는 집합적 표현으로 읽었습니다.
  alternative_readings:
  - 이스라엘의 지도층만을 가리킨다고 볼 수 있음
  - 정치적 연합체 전체의 반응으로 제한할 수 있음
  rationale: 문맥상 사울 집안과 아브넬의 죽음이 왕권 질서 전체에 미친 충격을 서술하므로, 집합적 의미를 보존하는 것이 본문 의도에 가깝습니다.
  doctrine_reference: 내러티브 문맥 해석
- issue: ‘his hands became weak’의 관용적 의미
  chosen_reading: 심리적 낙담과 무기력까지 포함하는 관용구로 처리했습니다.
  alternative_readings:
  - 단순히 신체적 쇠약만을 뜻한다고 볼 수 있음
  - 직역하여 의미를 독자가 추론하게 둘 수 있음
  rationale: 히브리어 관용구가 신체 표현을 통해 용기 상실을 뜻하므로, 한국어에서도 문자성과 의미를 함께 살리는 번역이 필요합니다.
  doctrine_reference: 히브리어 관용법
