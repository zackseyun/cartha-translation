translation:
  language: ko
  text: 사울의 아들이 아브넬이 헤브론에서 죽었다는 소식을 듣자, 그의 손은 힘이 풀렸고, 온 이스라엘은 놀라움에 사로잡혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 “그의 손이 약해졌다”이며, 힘이나 용기를 잃었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שָׁאוּל
  english_pob_choice: Saul’s son
  chosen_korean: 사울의 아들
  alternatives_korean:
