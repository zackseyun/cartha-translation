  - 사울의 아들 이스보셋
  lexicon: HALOT
  rationale: 본문은 고유명사를 생략한 친족 표현으로 시작하므로, 한국어도 직역에 가까운 ‘사울의 아들’로 옮겨 본문의 지시를 유지했습니다.
- source_word: מֵת
  english_pob_choice: had died
  chosen_korean: 죽었다는
  alternatives_korean:
  - 죽었다
  - 이미 죽었다는
  lexicon: HALOT
  rationale: 듣게 된 내용으로서의 완료 사건이므로, ‘-다는’ 종속절로 처리해 서술의 시간관계를 자연스럽게 드러냈습니다.
- source_word: וַיִּרְפּוּ יָדָיו
  english_pob_choice: his hands became weak
  chosen_korean: 그의 손은 힘이 풀렸고
  alternatives_korean:
  - 그의 손은 약해졌고
  - 그의 손은 축 늘어졌고
