- from: 그들은 그가 침상 위에서 자기 침실에 누워 있는 동안 집 안으로 들어가 그를 때려 죽였습니다. 그런 다음 그의 머리를 제거하고 그의 머리를 가져가 아라바 길로 밤새 갔습니다.[a][b][c]
  to: 그들은 그가 침상 위 그의 침실[a]에 누워 있을 때 집 안으로 들어가, 그를 치고 죽였습니다. 그런 다음 그의 머리를 떼어 내고[c] 그의 머리를 가져가 아라바[b]를 거쳐 밤새 갔습니다.
  rationale: 원문의 동사 순서와 반복된 ‘그의 머리’를 유지했습니다. ‘떼어 내고’는 실제 수단을 ‘잘라내다’로 한정하지 않으면서도, 살해 뒤 머리를 가져갔다는 문맥에 맞는 자연스러운 한국어입니다. 지명과 관련 각주 표지도 해당 단어에 직접 연결했습니다.
