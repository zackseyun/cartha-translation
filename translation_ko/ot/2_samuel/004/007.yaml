source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ הַ/בַּ֗יִת וְ/הֽוּא שֹׁכֵ֤ב עַל מִטָּת/וֹ֙ בַּ/חֲדַ֣ר מִשְׁכָּב֔/וֹ וַ/יַּכֻּ֨/הוּ֙ וַ/יְמִתֻ֔/הוּ וַ/יָּסִ֖ירוּ אֶת רֹאשׁ֑/וֹ וַ/יִּקְחוּ֙ אֶת רֹאשׁ֔/וֹ וַ/יֵּֽלְכ֛וּ דֶּ֥רֶךְ הָ/עֲרָבָ֖ה כָּל הַ/לָּֽיְלָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/007.yaml
  text: They came into the house while he was lying on his bed in his bedroom[a], and they struck him and put him to death. Then they removed his head, took his head[c][b], and went by way of the Arabah all night.
  footnotes:
  - marker: a
    text: Or 'in the room where he slept' for 'in his bedroom.'
    reason: lexical_alternative
  - marker: b
    text: The Arabah is the Jordan rift/plain region; the Hebrew uses a geographic name.
    reason: cultural_note
  - marker: c
    text: Or 'they cut off his head'; the Hebrew verb is more literally 'they removed his head.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그가 침상 위에서 자기 침실에 누워 있는 동안 집 안으로 들어가 그를 때려 죽였습니다. 그런 다음 그의 머리를 제거하고 그의 머리를 가져가 아라바 길로 밤새 갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘침실’은 문자적으로는 ‘눕는 방/잠자는 방’에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아라바’는 요르단 열곡/평야 지대를 가리키는 지명입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 여기서 머리를 ‘제거했다’고 말하며, 곧이어 머리를 ‘가져갔다’고 덧붙입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲדַר מִשְׁכָּבוֹ
  english_pob_choice: in his bedroom
  chosen_korean: 자기 침실에
  alternatives_korean:
  - 그가 누워 자는 방에
  - 그의 잠자리 방에
  lexicon: HALOT
  rationale: 직역하면 ‘눕는/잠드는 방’이지만, 현대 한국어에서는 ‘침실’이 가장 자연스럽고 원문의 장소 의미를 충분히 살립니다.
- source_word: וַיַּכֻּהוּ
  english_pob_choice: they struck him
  chosen_korean: 그를 때려
  alternatives_korean:
  - 그를 치고
  - 그를 쳐서
  lexicon: HALOT
  rationale: 살해 문맥이므로 단순한 ‘치다’보다 결과를 분명히 드러내는 ‘때려’가 적절합니다. POB의 보수적 어휘를 따르되, 원문의 폭력성을 유지합니다.
- source_word: וַיְמִתֻהוּ
  english_pob_choice: put him to death
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 목숨을 끊었습니다
  - 사형에 처했습니다
  lexicon: HALOT
  rationale: 동사의 사역적 의미는 앞절의 폭력 행위와 함께 이미 분명하므로, 한국어에서는 자연스럽게 ‘죽였습니다’로 옮기되 사역성을 문맥이 받쳐 줍니다.
- source_word: וַיָּסִירוּ אֶת רֹאשׁוֹ
  english_pob_choice: they removed his head
  chosen_korean: 그의 머리를 제거하고
  alternatives_korean:
  - 그의 머리를 잘라내고
  - 그의 머리를 떼어 내고
  lexicon: HALOT
  rationale: 히브리어는 ‘머리를 제거하다’에 가깝고, 뒤이어 다시 머리를 가져간다고 말하므로, 1차 행위를 ‘제거하다’로 유지해 두 단계를 구분했습니다.
- source_word: הָעֲרָבָה
  english_pob_choice: the Arabah
  chosen_korean: 아라바 길
  alternatives_korean:
  - 아라바를 따라
  - 아라바 지역 길
  lexicon: HALOT
  rationale: 고유 지명은 음역을 유지하되, 문맥상 이동 경로임을 드러내기 위해 ‘길’을 보탰습니다. 지리명 자체를 일반명사로 풀어쓰지 않았습니다.
theological_decisions:
- issue: 폭력 서술의 직접성
  chosen_reading: ‘때려 죽였습니다’와 ‘그의 머리를 제거하고’로 원문의 잔혹한 사건 전개를 완화하지 않고 드러냈습니다.
  alternative_readings:
  - ‘공격해 죽였습니다’로 완화
  - ‘머리를 잘라냈습니다’로 사건을 요약
  rationale: 본문은 정치적 암살의 연속 동작을 건조하게 기록하므로, 한국어도 그 날것의 서술을 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 서술 본문 번역 원칙
