  text: וְ֠/הֵנָּה בָּ֜אוּ עַד תּ֤וֹךְ הַ/בַּ֨יִת֙ לֹקְחֵ֣י חִטִּ֔ים וַ/יַּכֻּ֖/הוּ אֶל הַ/חֹ֑מֶשׁ וְ/רֵכָ֛ב וּ/בַעֲנָ֥ה אָחִ֖י/ו נִמְלָֽטוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/006.yaml
  text: And there they came into the midst of the house[a], taking wheat, and they struck him in the belly. Then Rekab and Baanah his brother escaped.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'under the fifth rib.' The Hebrew expression likely refers more generally to the abdomen or belly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 거기서 집의 한복판까지 들어갔는데, 밀을 가져오는 듯한 모습이었습니다[a]. 그리고 그들이 그를 배를 찔렀습니다. 그러자 레갑과 그의 형 바아나가 도망쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 전통적으로, ‘제5갈비뼈 아래에.’ 히브리어 표현은 대체로 복부나 배를 가리키는 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנָּה בָּאוּ
  english_pob_choice: And there they came
  chosen_korean: 그들은 거기서 들어갔는데
  alternatives_korean:
  - 그리고 거기서 왔는데
  - 그들은 거기로 들어왔는데
  lexicon: HALOT
  rationale: 서술의 진행과 장소 지시를 자연스럽게 살리되, 원문의 동사 շարժ임을 유지했습니다.
- source_word: עַד תּוֹךְ הַבַּיִת
  english_pob_choice: into the midst of the house
  chosen_korean: 집의 한복판까지
  alternatives_korean:
  - 집 안쪽까지
  - 집의 중심까지
  lexicon: HALOT
  rationale: תּוֹךְ의 핵심인 ‘안쪽/한복판’ 의미를 살려, 단순한 ‘집 안’보다 더 깊숙이 들어간 장면을 드러냈습니다.
- source_word: לֹקְחֵי חִטִּים
  english_pob_choice: taking wheat
  chosen_korean: 밀을 가져오는 듯한 모습이었습니다
  alternatives_korean:
  - 밀을 가져오고 있었습니다
  - 밀을 취하는 사람들이었습니다
  lexicon: HALOT
  rationale: 문맥상 실제 목적이 아니라 위장된 행동을 드러내는 함축적 표현이므로, 의미를 과도하게 확정하지 않으면서도 서술상의 속임수를 드러냈습니다.
- source_word: וַיַּכֻּהוּ אֶל הַחֹמֶשׁ
  english_pob_choice: they struck him in the belly
  chosen_korean: 그들이 그를 배를 찔렀습니다
  alternatives_korean:
  - 그들이 그를 배를 쳤습니다
  - 그들이 그를 복부를 찔렀습니다
  lexicon: HALOT
  rationale: חֹמֶשׁ을 전통적 ‘제5갈비뼈 아래’보다 실제 신체 부위로 이해하여, 여기서는 공격의 치명성을 분명히 드러내는 ‘배를 찔렀습니다’로 옮겼습니다.
- source_word: נִמְלָטוּ
  english_pob_choice: escaped
  chosen_korean: 도망쳤습니다
  alternatives_korean:
  - 달아났습니다
  - 탈출했습니다
  lexicon: HALOT
  rationale: 전투·살해 맥락에서의 सफल한 이탈을 자연스럽게 나타내는 한국어로 옮겼습니다.
theological_decisions:
- issue: לֹקְחֵי חִטִּים의 함축 처리
  chosen_reading: ‘밀을 가져오는 듯한 모습이었습니다’로 옮겨, 침입의 위장성과 살해 의도를 함께 드러냈습니다.
  alternative_readings:
  - ‘밀을 가져오는 사람들이었습니다’
  - ‘밀을 취하고 있었습니다’
  rationale: 히브리어 분사구는 단순 직역보다 서술적 함축을 지니므로, 본문이 암시하는 속임수의 맥락을 드러내는 편이 독자에게 원문의 서사 기능을 더 정확히 전달합니다.
  doctrine_reference: 본문의 서사적 사실성 및 문맥 충실성
- issue: 하중적 부위 표현 חֹמֶשׁ
  chosen_reading: 전통적 관용구를 따르지 않고 ‘배’로 번역했습니다.
  alternative_readings:
  - ‘제5갈비뼈 아래’
  - ‘복부’
  rationale: 해당 표현은 전통 번역의 관용을 유지하기보다, 본문이 실제로 지시하는 신체 부위를 현대 한국어로 명확히 전달하는 것이 더 적절합니다.
  doctrine_reference: 역사적 서술의 명료성
