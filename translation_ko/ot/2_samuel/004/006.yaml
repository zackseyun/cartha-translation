revisions:
- from: 그들은 거기서 집의 한복판까지 들어갔는데, 밀을 가져오는 듯한 모습이었습니다[a]. 그리고 그들이 그를 배를 찔렀습니다. 그러자 레갑과 그의 형 바아나가 도망쳤습니다.
  to: 그들이 그곳에서 밀을 가져가려는 사람들처럼 집 안쪽까지 들어가서, 그의 배를 쳤습니다[a]. 그러자 레갑과 그의 형제 바아나는 달아났습니다.
  rationale: 문법 오류를 바로잡고, 타격 동사의 의미를 ‘찔렀다’로 좁히지 않았습니다. 연령을 함축하는 ‘형’을 원문의 포괄적 친족어에 맞춰 ‘형제’로 바꾸었으며, 신체 부위 대안에 관한 각주 표지를 해당 단어 뒤로 옮겼습니다. ‘밀을 가져가려는 사람들처럼’은 분사구의 문맥적 기능을 자연스럽게 재현하되, 행위의 실제 여부를 본문보다 더 단정하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:27:01Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. וַיַּכֻּהוּ는 기본적으로 ‘그를 쳤다/타격했다’이므로, 도구나 자상(刺傷)을 명시하지 않는 ‘찔렀습니다’는 원문보다 구체적입니다. לֹקְחֵי חִטִּים는 문맥상 출입을 위한 가장을 시사하지만, 본문 자체는 ‘밀을 가져가는 사람들’이라는 분사구로 표현하므로 이를 자연스럽게 ‘밀을 가져가려는 사람들처럼’으로 옮겼습니다. אָחִיו는 ‘형’이 아니라 성별·연령을 특정하지 않는 ‘형제’입니다.
  naturalness: 현 번역의 ‘그들이 그를 배를 찔렀습니다’는 목적격 구성이 비문입니다. 또한 ‘밀을 가져오는 듯한 모습이었습니다’는 서술 흐름을 끊고, ‘가져오는’은 לֹקְחֵי(가져가는/취하는)와도 맞지 않습니다. 수정문은 현대 표준어 합쇼체로 자연스럽게 연결됩니다.
  terminology: 인명은 레갑, 바아나로 유지합니다. חֹמֶשׁ은 현대어 본문에서 ‘배’로 옮기고 전통적 대안은 각주로 보존합니다. 각주는 해당 신체 부위 표현 바로 뒤에 붙여야 합니다.
  issues:
  - severity: high
    issue: ‘그들이 그를 배를 찔렀습니다’는 문법적으로 잘못되었고, ‘찔렀습니다’가 원문의 일반적 동사 ‘쳤다’보다 구체적입니다.
    rationale: 목적어는 ‘그의 배를’처럼 구성해야 하며, נכה는 이 절에서 찌르기라는 수단을 명시하지 않습니다.
  - severity: medium
    issue: ‘그의 형 바아나’의 ‘형’은 אָחִיו에 없는 연령 정보를 더합니다.
    rationale: אָחִיו는 여기서 레갑의 형제 바아나를 가리키므로 ‘그의 형제 바아나’가 정확합니다.
  - severity: medium
    issue: 각주 표지가 ‘집의 한복판’에 붙어 있으나 각주 내용은 חֹמֶשׁ, 곧 배/복부 표현에 관한 것입니다.
    rationale: 각주 앵커를 ‘배’ 뒤로 옮겨 독자가 대체 번역의 적용 대상을 분명히 알 수 있게 해야 합니다.
  - severity: low
    issue: ‘밀을 가져오는 듯한 모습이었습니다’는 원문의 분사구를 불필요하게 명사적 서술로 바꾸고 방향 의미도 달리합니다.
    rationale: ‘밀을 가져가려는 사람들처럼’은 문맥상의 가장을 과도하게 단정하지 않으면서도 자연스럽게 반영합니다.
