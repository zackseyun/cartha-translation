  text: But David answered Rekab and Baanah his brother[a], the sons of Rimmon the Beerothite, and said to them, “As Yahweh lives, who has redeemed my life out of every distress,
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; alternatively rendered ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 다윗이 레갑과 그의 형 바아나—림몬의 아들인 브에로 사람들—에게 대답하며 그들에게 말했습니다. "야훼께서는 살아 계십니다. 그분은 내 생명을 모든 환난에서 건져 주셨습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 이름 יְהוָה를 사용합니다. 본문에서는 ‘야훼’로 옮겼습니다.
    reason: ot_citation
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하며
  alternatives_korean:
  - 응답하며
  - 말하며
  lexicon: HALOT
  rationale: 대화 속 응답을 여는 서술형 동사를 자연스럽게 옮기되, 바로 뒤의 직접화법과 연결되도록 했습니다.
- source_word: רֵכָב ... בַּעֲנָה אָחִיו
  english_pob_choice: Rekab and Baanah his brother
  chosen_korean: 레갑과 그의 형 바아나
  alternatives_korean:
  - 레갑과 바아나 그의 형제
  - 레갑과 바아나 그의 형
  lexicon: HALOT
  rationale: 히브리어의 단수 소유격 관계를 한국어에서는 자연스럽게 ‘그의 형’으로 풀어, 두 사람의 형제관계를 분명히 했습니다.
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  english_pob_choice: the sons of Rimmon the Beerothite
  chosen_korean: 림몬의 아들인 브에로 사람들
  alternatives_korean:
  - 브에로 사람 림몬의 아들들
  - 림몬의 아들인 베로 사람들
  lexicon: HALOT
  rationale: 구문상 부친 이름과 출신 지명을 함께 드러내야 하므로, ‘림몬의 아들인’과 ‘브에로 사람들’을 병치해 의미를 보존했습니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서는 살아 계십니다
  alternatives_korean:
  - 야훼께서 살아 계시옵니다
  - 여호와께서는 살아 계십니다
  lexicon: HALOT
  rationale: 맹세 공식의 강한 현재적 진술을 살리면서, 본 프로젝트의 기본 용례에 따라 하나님의 이름을 ‘야훼’로 옮겼습니다.
- source_word: פָּדָה
  english_pob_choice: has redeemed
  chosen_korean: 건져 주셨습니다
  alternatives_korean:
  - 속량해 주셨습니다
  - 구속해 주셨습니다
  - 구원해 주셨습니다
  lexicon: HALOT
  rationale: פדה의 ‘대가를 치르고 구해 내다’는 뉘앙스를 한국어에서 가장 자연스럽게 드러내는 동사로 옮겼습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my life
  chosen_korean: 내 생명
  alternatives_korean:
  - 내 목숨
  - 내 영혼
  - 나
  lexicon: HALOT
  rationale: 이 문맥의 נפש는 내면의 영혼보다 위험에 놓인 생명 자체를 가리키므로 ‘내 생명’이 가장 정확합니다.
- source_word: מִכָּל צָרָה
  english_pob_choice: out of every distress
  chosen_korean: 모든 환난에서
  alternatives_korean:
  - 모든 고난에서
  - 온갖 고통에서
  - 모든 재난에서
  lexicon: HALOT
  rationale: צָרָה의 폭넓은 ‘고통/곤경/환난’ 의미를 살리되, 맹세와 구원 진술에 어울리는 한국어로 정리했습니다.
theological_decisions:
