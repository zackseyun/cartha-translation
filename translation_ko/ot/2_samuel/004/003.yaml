  text: But the Beerothites fled to Gittaim and have lived there as sojourners to this day[a].
  footnotes:
  - marker: a
    text: Or "have been living there as resident foreigners to this day."
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 베에롯 사람들은 깃다임으로 도망하여, 오늘날까지 거기에서 나그네로 살아왔습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오늘날까지 거주 외국인으로 살아왔다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרְחוּ
  english_pob_choice: had fled
  chosen_korean: 도망하여
  alternatives_korean:
  - 도망쳤습니다
  - 달아났습니다
  lexicon: HALOT
  rationale: ברח의 기본 의미는 ‘도망하다/달아나다’이며, 앞선 상황을 배경으로 제시하는 서술이어서 한국어에서는 단순 과거 연결형으로 자연스럽게 처리했습니다.
- source_word: הַבְּאֵרֹתִים
  english_pob_choice: the Beerothites
  chosen_korean: 베에롯 사람들은
  alternatives_korean:
  - 베에롯 사람들은
  - 베에롯 족속은
  lexicon: HALOT
  rationale: 지명 Beeroth에서 나온 민족/거주민 지칭이므로, 현대 한국어에서는 ‘사람들’이 가장 자연스럽고 과도한 종족화도 피합니다.
- source_word: גָּרִים
  english_pob_choice: as sojourners
  chosen_korean: 나그네로
  alternatives_korean:
  - 거류민으로
  - 임시 거주자로
  - 외국인으로
  lexicon: HALOT
  rationale: גור의 분사형은 본토민이 아닌 상태로 거주한다는 뜻이어서, ‘나그네로’가 사회적·법적 뉘앙스를 비교적 간결하게 살립니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘날까지
  alternatives_korean:
  - 이날까지
  - 이때까지
  lexicon: HALOT
  rationale: 히브리어 관용구는 서술 시점까지 지속됨을 뜻하므로, 한국어에서는 ‘오늘날까지’가 가장 관용적입니다.
theological_decisions:
- issue: 배경 설명적 서술의 시제 처리
  chosen_reading: ‘도망하여 … 살아왔습니다’로 현재에 이르는 지속 상태를 드러냈습니다.
  alternative_readings:
  - ‘도망쳤고 … 살고 있습니다’
  - ‘도망하여 … 살았습니다’
  rationale: 본문의 ‘오늘날까지’는 과거 사건의 결과가 현재까지 이어짐을 강조하므로, 한국어에서도 지속성을 살리는 표현이 적절합니다.
  doctrine_reference: 서술적 역사 문맥의 시간적 연속성
- issue: 무난한 민족/거주민 표기
  chosen_reading: Beerothites를 ‘베에롯 사람들’로 옮겼습니다.
  alternative_readings:
  - ‘베에롯인들’
  - ‘베에롯 족속’
  rationale: 여기서는 신학적 용어보다 지명 유래의 집단 표지가 핵심이므로, 독자가 이해하기 쉬운 중립적 표현을 택했습니다.
  doctrine_reference: 역사서의 민족 지칭
