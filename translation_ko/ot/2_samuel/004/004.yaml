  terminology: ‘발에 장애가 있는’은 낙인적인 표현을 피하면서 נְכֵה רַגְלָיִם의 신체 손상 상태를 보존합니다. ‘므립보셋’은 통용되는 한국어 성경식 음역입니다. 각주는 ‘양쪽 발’이라는 가능한 해석을 제시하되, 본문에 없는 ‘치명상’이나 추정 표현을 넣지 않아야 합니다.
