  source_fidelity: 본문의 사건 순서와 주어는 대체로 정확합니다. 다만 첫머리의 ‘이제’는 히브리어에 명시된 시간 부사가 아니므로 삭제하는 것이 좋습니다. ‘그런데’는 원문의 단순 서사 접속을 다소 대조적으로 만들며, 각주가 נְכֵה רַגְלָיִם의 뜻을 ‘치명상’ 및 가정법으로 과도하게 한정하고 있습니다.
