  to: 사울의 아들 요나단에게는 발에 장애가 있는 아들이 있었습니다.[a] 사울과 요나단에 대한 소식이 이스르엘에서 전해졌을 때, 그는 다섯 살이었습니다. 그의 유모가 그를 안고 달아났습니다. 그 유모가 달아나려고 서두르다가 그가 떨어져 절게 되었습니다. 그의 이름은 므립보셋이었습니다.
  rationale: 명시되지 않은 ‘이제’를 삭제하고, 사울과 요나단의 관계를 자연스러운 한국어 어순으로 정리했습니다. 도주 장면의 단순한 서사 연결을 보존했으며, 원문의 신체 상태 표현을 과도하게 의학화하거나 추정하지 않도록 각주를 바로잡고 해당 표현에 앵커를 옮겼습니다.
