base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/004.yaml
  text: Now Jonathan son of Saul had a son crippled in his feet. He was five years old when the news about Saul and Jonathan came from Jezreel[a], and his nurse picked him up and fled. And as she hurried to flee, he fell and became lame. His name was Mephibosheth.
  footnotes:
  - marker: a
    text: Or 'lame in both feet.' The Hebrew phrase literally refers to being stricken in the feet.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 요나단, 곧 사울의 아들에게는 발에 장애가 있는 아들이 있었습니다. 그가 다섯 살이었을 때, 사울과 요나단에 대한 소식이 이스르엘에서 전해지자, 그의 유모가 그를 안고 도망했습니다. 그런데 그녀가 급히 달아나는 중에 그가 떨어져 절게 되었으며, 그의 이름은 므립보셋이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘양쪽 발이 절었을 것이다.’ 히브리어 표현은 문자적으로 ‘발에 치명상을 입은’ 상태를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נְכֵה רַגְלָיִם
  english_pob_choice: crippled in his feet
  chosen_korean: 발에 장애가 있는
  alternatives_korean:
  - 발이 불구인
  - 발을 다친
  - 절름발이인
  lexicon: HALOT
  rationale: 히브리어는 발에 생긴 신체적 손상 상태를 가리키므로, ‘발에 장애가 있는’으로 옮겨 원뜻을 분명하게 하되 현대 한국어에서의 낙인적 뉘앙스를 줄였습니다.
- source_word: בְּבֹא שְׁמֻעַת שָׁאוּל וִיהוֹנָתָן
  english_pob_choice: when the news about Saul and Jonathan came
  chosen_korean: 사울과 요나단에 대한 소식이 전해지자
  alternatives_korean:
  - 사울과 요나단에 대한 보고가 들어오자
  - 사울과 요나단의 소식이 도착하자
  lexicon: HALOT
  rationale: ‘שְׁמֻעַת’는 단순한 소문이 아니라 도달한 소식을 뜻하므로, 사건의 시점 기능을 살려 ‘전해지자’로 자연스럽게 옮겼습니다.
- source_word: וַתִּשָּׂאֵהוּ אֹמַנְתּוֹ
  english_pob_choice: his nurse picked him up
  chosen_korean: 그의 유모가 그를 안고
  alternatives_korean:
  - 그의 유모가 그를 들어 올리고
  - 그의 유모가 그를 데리고
  lexicon: HALOT
  rationale: ‘אֹמַנְתּוֹ’는 양육하는 여인을 가리키므로 ‘유모’가 가장 직접적이며, ‘그를 안고’는 곧바로 뒤따르는 도주 장면에 맞습니다.
- source_word: וַיִּפָּסֵחַ
  english_pob_choice: became lame
  chosen_korean: 절게 되었으며
  alternatives_korean:
  - 절게 되었고
  - 불구가 되었으며
  - 절름발이가 되었으며
  lexicon: HALOT
  rationale: 결과 상태를 나타내는 동사로 이해하여 ‘절게 되었습니다’ 계열로 옮겼고, 본문의 서술 흐름상 연결을 위해 ‘되었으며’를 택했습니다.
- source_word: מְפִיבֹשֶׁת
  english_pob_choice: Mephibosheth
  chosen_korean: 므립보셋
  alternatives_korean:
  - 메피보셋
  - 므비보셋
  lexicon: 표준 음역 관행
  rationale: 한국어 성경에서 널리 쓰이는 고유명사 음역을 따랐습니다.
theological_decisions:
- issue: 장애 표현의 톤
  chosen_reading: 본문의 신체 상태를 분명히 하되, 현대 한국어에서 비하로 들릴 수 있는 표현은 피했습니다.
  alternative_readings:
  - 절름발이
  - 불구
  - 장애인
  rationale: 히브리어 원문의 육체적 손상 사실을 흐리지 않으면서, 서술문에서 필요한 수준의 중립성을 유지하기 위한 선택입니다.
  doctrine_reference: 인간의 존엄성과 본문 직역성 사이의 균형
