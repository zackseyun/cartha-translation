  text: וַ/יְצַו֩ דָּוִ֨ד אֶת הַ/נְּעָרִ֜ים וַ/יַּהַרְג֗וּ/ם וַֽ/יְקַצְּצ֤וּ אֶת יְדֵי/הֶם֙ וְ/אֶת רַגְלֵי/הֶ֔ם וַ/יִּתְל֥וּ עַל הַ/בְּרֵכָ֖ה בְּ/חֶבְר֑וֹן וְ/אֵ֨ת רֹ֤אשׁ אִֽישׁ בֹּ֨שֶׁת֙ לָקָ֔חוּ וַ/יִּקְבְּר֥וּ בְ/קֶֽבֶר אַבְנֵ֖ר בְּ/חֶבְרֽוֹן־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/012.yaml
  text: Then David commanded the young men[a], and they killed them and cut off their hands and their feet and hung them by the pool at Hebron. But they took the head of Ish-bosheth and buried it in the tomb of Abner at Hebron.
  footnotes:
  - marker: a
    text: Or 'hung them at the pool.' The Hebrew preposition can be understood more broadly as indicating location.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다윗이 젊은이들에게 명령하였습니다. 그들은 그들을 죽이고, 그들의 손과 발을 잘라 내어 헤브론에 있는 못가에 매달았습니다.[a] 그리고 이스보셋의 머리를 가져다가 헤브론에 있는 아브넬의 무덤에 장사하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘못 곁에 매달았습니다.’ 히브리어 전치사는 더 넓게 위치를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו דָּוִד
  english_pob_choice: Then David commanded
  chosen_korean: 그러자 다윗이 명령하였고
  alternatives_korean:
  - 그리고 다윗이 명령하였고
  - 다윗이 명령하였습니다
  lexicon: HALOT
  rationale: 와우 연속으로 이어지는 서술 흐름을 한국어의 ‘그러자’로 살렸고, צוה의 강한 지시성을 ‘명령하다’로 직접 옮겼습니다.
- source_word: הַנְּעָרִים
  english_pob_choice: the young men
  chosen_korean: 젊은이들
  alternatives_korean:
  - 청년들
  - 종들
  - 시종들
  lexicon: HALOT
  rationale: 여기서는 다윗의 실행자들을 가리키며 문맥상 ‘젊은이들’이 가장 직접적입니다. ‘종들/시종들’은 관계를 더 해석적으로 좁힙니다.
- source_word: וַיִּתְלוּ עַל הַבְּרֵכָה
  english_pob_choice: hung them by the pool
  chosen_korean: 못 가에 매달았습니다
  alternatives_korean:
  - 못에 매달았습니다
  - 못 위에 매달았습니다
  - 못 곁에 매달았습니다
  lexicon: HALOT
  rationale: עַל הַבְּרֵכָה는 ‘못/저수지’의 위치를 넓게 나타낼 수 있어, POB의 주석 취지를 따라 ‘가에’로 위치적 의미를 살렸습니다.
- source_word: רֹאשׁ אִישׁ בֹּשֶׁת
  english_pob_choice: the head of Ish-bosheth
  chosen_korean: 이스보셋의 머리
  alternatives_korean:
  - 이쉬보셋의 머리
  - 이스보셋 머리
  lexicon: HALOT
  rationale: 고유명사는 한국어에서 널리 쓰이는 음역 ‘이스보셋’을 택했고, 소유 관계는 자연스러운 속격으로 보존했습니다.
- source_word: וַיִּקְבְּרוּ בְקֶבֶר אַבְנֵר
  english_pob_choice: buried it in the tomb of Abner
  chosen_korean: 아브넬의 무덤에 장사하였습니다
  alternatives_korean:
  - 아브넬의 무덤에 묻었습니다
  - 아브넬의 묘에 장사하였습니다
  lexicon: HALOT
  rationale: קבר는 단순 매장보다 장례 맥락을 갖는 ‘장사하다’가 적절하며, POB의 ‘tomb’을 살려 ‘무덤’으로 옮겼습니다.
theological_decisions:
- issue: 이 장면의 폭력성과 평가어의 처리
  chosen_reading: 본문이 서술하는 사실성을 유지하고, ‘처형’ 같은 평가적·법정적 완충 표현은 넣지 않았습니다.
  alternative_readings:
  - 그들이 그들을 처형하고
  - 그들을 사형에 처하고
  rationale: 이 절은 다윗의 명령과 신체 훼손, 시신 처리라는 사실을 그대로 제시할 뿐, 서술 안에서 해석적 평결을 내리지 않습니다. 따라서 본문이 가진 거친 긴장을 보존했습니다.
  doctrine_reference: 서술적 긴장 보존
