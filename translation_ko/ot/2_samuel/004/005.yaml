reference: 2 Samuel 4:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ בְּנֵֽי רִמּ֤וֹן הַ/בְּאֵֽרֹתִי֙ רֵכָ֣ב וּ/בַעֲנָ֔ה וַ/יָּבֹ֨אוּ֙ כְּ/חֹ֣ם הַ/יּ֔וֹם אֶל בֵּ֖ית אִ֣ישׁ בֹּ֑שֶׁת וְ/ה֣וּא שֹׁכֵ֔ב אֵ֖ת מִשְׁכַּ֥ב הַֽ/צָּהֳרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/005.yaml
  text: The sons of Rimmon the Beerothite[a], Rekab and Baanah, went and came to the house of Ish-bosheth in the heat of the day[b], while he was lying down for his midday rest.
  footnotes:
  - marker: a
    text: Or 'Rechab and Baanah,' following a more traditional English spelling of Rekab's name.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the lying down of noon,' that is, a midday rest.
    reason: lexical_alternative
translation:
  language: ko
  text: 르몬의 아들들인 베에롯 사람 레갑과 바아나가 가서, 날이 더울 때에 이스보셋의 집에 이르렀습니다. 그는 한낮에 쉬려고 누워 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘정오의 눕기’이며, 한낮의 휴식을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  english_pob_choice: The sons of Rimmon the Beerothite
  chosen_korean: 르몬의 아들들인 베에롯 사람
  alternatives_korean:
  - 베에롯 사람 르몬의 아들들
  - 르몬 베에롯 사람의 자손들
  lexicon: WLC
  rationale: בְּנֵי는 여기서 실제 아들 관계를 가리키며, 이어지는 고유명사 두 사람을 그 아들들로 바로 제시하므로 ‘아들들인’으로 풀었습니다. הַבְּאֵרֹתִי는 출신 표지이므로 ‘베에롯 사람’으로 옮겼습니다.
- source_word: רֵכָב וּבַעֲנָה
  english_pob_choice: Rekab and Baanah
  chosen_korean: 레갑과 바아나
  alternatives_korean:
  - 르갑과 바아나
  - 레카브와 바아나
  lexicon: 신명기/사무엘기 고유명사 표기 관행
  rationale: 인명은 현대 한국어 성서에서 널리 통용되는 음역을 따랐습니다. רֵכָב는 ‘레갑’이 관용적으로 더 알아보기 쉽고, 본문 의미를 바꾸지 않습니다.
- source_word: כְּחֹם הַיּוֹם
  english_pob_choice: in the heat of the day
  chosen_korean: 낮의 더위 때에
  alternatives_korean:
  - 한낮 무더위에
  - 낮이 가장 더울 때에
  - 더위가 심한 때에
  lexicon: HALOT
  rationale: 직역인 ‘낮의 더위’는 살리되, 한국어에서는 시간 부사구로 자연스럽게 풀어 ‘때에’로 정리했습니다. POB의 ‘heat of the day’가 가리키는 한낮 무더위를 과도하게 해석하지 않도록 했습니다.
- source_word: מִשְׁכַּב הַצָּהֳרָיִם
  english_pob_choice: for his midday rest
  chosen_korean: 낮잠을 자고 있었습니다
  alternatives_korean:
  - 정오 휴식을 취하고 있었습니다
  - 한낮 휴식을 하고 있었습니다
  - 낮의 쉼을 취하고 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘낮의 눕는 행위/쉼’은 한국어에서 가장 자연스럽게 ‘낮잠’으로 전달됩니다. 다만 본문의 상황적 의미를 살리기 위해 ‘자고 있었습니다’로 상태를 분명히 했습니다.
theological_decisions:
- issue: 서술의 긴박함과 상황적 대비
  chosen_reading: ‘더위를 무릅쓰고 가서’와 ‘낮잠을 자고 있었습니다’로 이동과 휴식의 대비를 살렸습니다.
  alternative_readings:
  - ‘가서’와 ‘누워 있었습니다’처럼 더 평이하게 옮김
  - ‘더운 한낮에’로만 표현
  rationale: 원문은 공격이 가능한 시간대와 피해자의 무방비한 상태를 대비시키므로, 한국어에서도 그 긴장감을 드러내는 것이 서술 효과를 보존합니다.
  doctrine_reference: 서사 문맥 보존 원칙
