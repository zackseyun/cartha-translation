revisions:
- from: 르몬의 아들들인 베에롯 사람 레갑과 바아나는 더위를 무릅쓰고 가서, 낮의 더위 때에 이스보셋의 집에 이르렀습니다. 그는 낮잠을 자고 있었습니다.[a][b]
  to: 르몬의 아들들인 베에롯 사람 레갑과 바아나가 가서, 날이 더울 때에 이스보셋의 집에 이르렀습니다. 그는 한낮에 쉬려고 누워 있었습니다.[a]
  rationale: 원문이 말하는 단순한 시간 배경과 휴식 상태를 보존하기 위해, ‘더위를 무릅쓰고’와 수면을 단정하는 ‘낮잠을 자고’를 각각 삭제·완화했습니다. 이동의 연속성과 인명·지명 표기는 유지했고, 한국어와 무관한 영어 철자 각주는 제거한 뒤 한낮의 휴식에 대한 직역 각주만 해당 구절에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:27:57Z'
review_pass:
  verdict: revise
  source_fidelity: ‘더위를 무릅쓰고’는 히브리어 본문에 없는 역경·의도 뉘앙스를 더하므로 삭제해야 합니다. 또한 מִשְׁכַּב הַצָּהֳרָיִם은 한낮의 휴식을 위해 누워 있는 상태를 뜻하며, 실제로 잠들었다고 단정하는 ‘낮잠을 자고’보다 ‘한낮에 쉬려고 누워’가 원문에 더 가깝습니다. 이동 동사 ‘가서 … 이르렀습니다’는 וַיֵּלְכוּ וַיָּבֹאוּ를 적절히 반영합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘날이 더울 때에’는 כְּחֹם הַיּוֹם의 시간적 표현을 무리 없이 옮기며, ‘한낮에 쉬려고 누워 있었습니다’는 한국어 서술로 매끄럽습니다.
  terminology: ‘베에롯 사람’, ‘레갑’, ‘바아나’, ‘이스보셋’은 일관된 한국어 음역으로 사용할 수 있습니다. 영어 철자 Rechab에 관한 기존 각주 a는 한국어 독자에게 적용되지 않는 정보이므로 제거합니다. 한낮의 휴식이라는 표현에만 원문의 직역 정보를 제공하는 각주를 둡니다.
