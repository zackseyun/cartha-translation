source:
  edition: WLC
  text: אַ֞ף כִּֽי אֲנָשִׁ֣ים רְשָׁעִ֗ים הָרְג֧וּ אֶת אִישׁ צַדִּ֛יק בְּ/בֵית֖/וֹ עַל מִשְׁכָּב֑/וֹ וְ/עַתָּ֗ה הֲ/ל֨וֹא אֲבַקֵּ֤שׁ אֶת דָּמ/וֹ֙ מִ/יֶּדְ/כֶ֔ם וּ/בִעַרְתִּ֥י אֶתְ/כֶ֖ם מִן הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/011.yaml
  text: How much more[a], when wicked men have killed a righteous man in his own house on his bed[b], should I not now require his blood from your hand and purge you from the land?
  footnotes:
  - marker: a
    text: Or 'hold you accountable for his blood'; the Hebrew idiom is literally 'require his blood from your hand.'
    reason: lexical_alternative
  - marker: b
    text: '''Purge you from the land'' refers to judicially removing the murderers from the land, not ritual cleansing alone.'
    reason: cultural_note
translation:
  language: ko
  text: 하물며 악한 사람들이 의로운 사람을 그의 집에서, 그의 침상 위에서 죽였으니, 이제 내가 너희에게 그의 피에 대한 책임을 묻고[a] 너희를 이 땅에서 쓸어 버리지 않겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 피를 너희 손에서 요구하다’입니다. 이는 살해에 대한 책임을 법적으로 추궁한다는 히브리어 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이 땅에서 쓸어 버리다’는 단순한 정화가 아니라, 살인자들을 사법적으로 제거한다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  english_pob_choice: How much more, when
  chosen_korean: 한층 더 그렇습니다. ... 말입니다
  alternatives_korean:
  - 하물며 ...
  - 더구나 ...
  lexicon: HALOT
  rationale: 앞절의 더 작은 사례에서 여기의 더 큰 사례로 나아가는 아포르투리오(a fortiori) 논리를 살려, 단순 접속이 아니라 강한 추론의 어조를 한국어로 드러냈습니다.
- source_word: אֲנָשִׁים רְשָׁעִים
  english_pob_choice: wicked men
  chosen_korean: 악한 사람들
  alternatives_korean:
  - 악인들
  - 사악한 사람들
  lexicon: HALOT
  rationale: 원문의 도덕적 비난을 자연스러운 현대 한국어로 옮기되, 지나치게 문어적인 '악인들'보다 서술 흐름에 맞는 표현을 택했습니다.
- source_word: אִישׁ צַדִּיק
  english_pob_choice: a righteous man
  chosen_korean: 의로운 사람
  alternatives_korean:
  - 의인
  - 정직한 사람
  lexicon: HALOT
  rationale: צַדִּיק의 기본 의미인 '의로운/의인'을 살리면서, 이 장면의 법정적·도덕적 평가를 가장 직접적으로 전달하는 표현으로 옮겼습니다.
- source_word: בְּבֵיתוֹ עַל מִשְׁכָּבוֹ
  english_pob_choice: in his own house on his bed
  chosen_korean: 자기 집에서, 자기 침상 위에서
  alternatives_korean:
  - 자기 집 안에서, 자기 침대 위에서
  - 자기 집에서, 자기 침대에서
  lexicon: HALOT
  rationale: 소유 접미사와 장소성을 각각 살려, 피해자가 가장 사적인 공간에서 살해되었다는 충격을 분명히 드러냈습니다.
- source_word: וּבִעַרְתִּי אֶתְכֶם מִן הָאָרֶץ
  english_pob_choice: and purge you from the land
  chosen_korean: 너희를 이 땅에서 쓸어 버리지 않겠습니까
  alternatives_korean:
  - 너희를 이 땅에서 제거하지 않겠습니까
  - 너희를 이 땅에서 없애지 않겠습니까
  lexicon: HALOT
  rationale: בער의 법적·징계적 제거 의미를 살리되, 한국어에서는 '쓸어 버리다'가 심판적 추방/제거의 강도를 가장 잘 전달합니다.
theological_decisions:
- issue: 피의 책임을 '보복'으로 약화할지, 본문의 법정 언어를 유지할지
  chosen_reading: '''그의 피를 너희 손에서 요구하다''라는 책임 추궁의 언어를 본문에 유지했습니다.'
  alternative_readings:
  - 그의 피를 갚다
  - 그의 피에 대해 보복하다
  - 그의 피값을 묻다
  rationale: 히브리어 관용구는 개인적 복수보다 혈죄에 대한 법적 책임 추궁을 가리키므로, 본문의 사법적 긴장을 보존하는 쪽이 원문 의미에 더 충실합니다.
  doctrine_reference: 구약의 혈흔/혈죄 책임 개념과 공의로운 심판
- issue: 직접 인용이 아닌 서술문에서 화자의 수사적 반문을 어떻게 표시할지
  chosen_reading: 반문형으로 옮겨, 다윗의 강한 확신과 판결 선포의 어조를 살렸습니다.
  alternative_readings:
  - 평서형으로 완화
  - 단순 선언형으로 재구성
  rationale: 히브리어의 הֲלוֹא는 강한 반문으로, 이를 평서로 바꾸면 판결문의 긴장이 약화됩니다.
  doctrine_reference: 본문 수사 구조 보존
