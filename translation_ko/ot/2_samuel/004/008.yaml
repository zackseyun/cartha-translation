  - marker: a
    text: Hebrew 'vengeances' (plural), an intensive form meaning 'vengeance' or 'acts of vengeance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 이스보셋의 머리를 헤브론에 있는 다윗에게 가져가서 왕에게 말했습니다. 「보십시오, 당신의 원수이며 당신의 목숨을 노리던 사울의 아들 이스보셋의 머리입니다. 오늘 야훼께서 내 주 왕께 사울과 그의 자손에게 내리신 보복[a]을 주셨습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 복수형 ‘보복들’(נְקָמוֹת)을 사용하며, 여기서는 강도를 나타내는 집합적 표현으로 ‘보복’ 또는 ‘보복 행위들’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  english_pob_choice: They brought
  chosen_korean: 그들이 … 가져가서
  alternatives_korean:
  - 그들이 … 데려와서
  - 그들이 … 가져왔습니다
  lexicon: HALOT
  rationale: 서사 진행의 wayyiqtol 동사를 자연스러운 현대 한국어로 옮기되, 행위의 방향이 분명한 ‘가져가다’를 사용했습니다.
- source_word: רֹאשׁ
  english_pob_choice: head
  chosen_korean: 머리
  alternatives_korean:
  - 두상
  - 정수리
  lexicon: HALOT
  rationale: 처형 후 실제 신체 부위를 가리키므로 문자적으로 ‘머리’로 옮기는 것이 가장 직접적입니다.
- source_word: וַיִּתֵּן יְהוָה
  english_pob_choice: Yahweh has given
  chosen_korean: 야훼께서 … 주셨습니다
  alternatives_korean:
  - 주님께서 … 주셨습니다
  - 여호와께서 … 주셨습니다
  lexicon: HALOT
  rationale: 본문의 고유신명 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 동사는 직접적인 수여 의미를 살려 ‘주셨습니다’로 렌더링했습니다.
- source_word: נְקָמוֹת
  english_pob_choice: vengeance
  chosen_korean: 보복
  alternatives_korean:
  - 복수
  - 응징
  lexicon: HALOT
  rationale: 히브리어 복수형 명사로 강한 응보 의미를 지니며, 한국어에서는 단수로 자연스럽게 ‘보복’이 가장 근접합니다.
theological_decisions:
- issue: 화자들의 야훼 평가를 본문에서 어떻게 처리할 것인가
  chosen_reading: 직접화법의 주장으로 그대로 두고, 서술자의 평가를 덧붙이지 않았습니다.
  alternative_readings:
  - ‘그들이 그렇게 주장했습니다’처럼 완화
  - 신학적 판단을 추가해 의심을 표기
  rationale: 히브리어는 암살자들의 말을 직접 인용할 뿐이며, 번역문은 본문에 없는 해석을 끼워 넣지 않아야 합니다. 이후 문맥이 이 주장의 정당성 여부를 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
