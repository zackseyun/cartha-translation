  source_fidelity: 본문은 대체로 원문을 충실히 옮겼습니다. 다만 נַחֲלָה는 이 문맥에서 야훼께 속한 이스라엘을 가리키는 전통적·성경적 표현이므로 ‘유산’보다 ‘기업’이 더 정확하고 자연스럽습니다. 마지막 וּבָרְכוּ는 문맥상 목적/결과로 번역할 수 있으나, 단순 접속으로도 읽힐 수 있어 주석으로 그 가능성을 보존하는 것이 좋습니다.
