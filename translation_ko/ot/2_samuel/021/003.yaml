source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/גִּבְעֹנִ֔ים מָ֥ה אֶעֱשֶׂ֖ה לָ/כֶ֑ם וּ/בַ/מָּ֣ה אֲכַפֵּ֔ר וּ/בָרְכ֖וּ אֶת נַחֲלַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/003.yaml
  text: David said to the Gibeonites[a], “What shall I do for you, and with what shall I make atonement[b], that you may bless the inheritance of Yahweh?”
  footnotes:
  - marker: a
    text: Or, 'and bless the LORD’s inheritance.' The Hebrew form can be read more literally as a coordinated clause; the main text brings out the likely purpose/result sense in context.
    reason: lexical_alternative
  - marker: b
    text: '''The inheritance of the LORD'' refers to Israel, the people belonging to the LORD.'
    reason: cultural_note
translation:
  language: ko
  text: 다윗이 기브온 사람들에게 말했습니다. 「내가 너희를 위해 무엇을 해야 합니까? 무엇으로 속죄해야 너희가 야훼의 유산을 축복하겠습니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기브온 사람들’은 기브온 출신 집단을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘야훼의 유산’은 야훼께 속한 이스라엘 백성을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּבְעֹנִים
  english_pob_choice: the Gibeonites
  chosen_korean: 기브온 사람들
  alternatives_korean:
  - 기브온인들
  - 기브온족
  lexicon: HALOT
  rationale: 히브리어 지명에서 나온 집단명으로, 한국어에서는 민족·집단성을 살리면서도 자연스러운 ‘사람들’이 가장 읽기 쉽습니다.
- source_word: אֶעֱשֶׂה לָכֶם
  english_pob_choice: What shall I do for you
  chosen_korean: 내가 너희를 위해 무엇을 해야 합니까
  alternatives_korean:
  - 내가 너희를 위해 무엇을 하겠습니까
  - 내가 너희에게 무엇을 해야 합니까
  lexicon: HALOT
  rationale: 의문문과 의지적 미래의 뉘앙스를 살리면서도 현대 한국어에서 자연스러운 합쇼체 질문으로 옮겼습니다.
- source_word: אֲכַפֵּר
  english_pob_choice: shall I make atonement
  chosen_korean: 속죄해야
  alternatives_korean:
  - 속죄해야 합니까
  - 화목해야
  - 보상해야
  lexicon: HALOT
  rationale: כפר의 제의적·신학적 무게를 살려 ‘속죄’로 옮겼습니다. 단순한 사과나 보상보다 원문 의미에 가깝습니다.
- source_word: נַחֲלַת יְהוָה
  english_pob_choice: the inheritance of Yahweh
  chosen_korean: 야훼의 유산
  alternatives_korean:
  - 야훼의 기업
  - 야훼의 상속
  - 야훼의 소유
  lexicon: HALOT
  rationale: ‘נחלה’는 전통적으로 ‘기업’으로도 옮길 수 있지만, 여기서는 야훼께 속한 백성을 가리키는 비유적 표현이어서 POB의 ‘inheritance’ 의미를 살려 ‘유산’으로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 표기와 마지막 절구의 대상
  chosen_reading: 야훼를 고유명사로 드러내고, ‘야훼의 유산’을 이스라엘 공동체로 이해하도록 옮겼습니다.
  alternative_readings:
  - 주님의 유산
  - 여호와의 기업
  - 야훼의 기업
  rationale: POB의 원칙에 따라 신명기적 고유명사인 יהוה는 ‘야훼’로 표기했습니다. 또한 마지막 구는 지명·토지가 아니라 야훼께 속한 백성 전체를 가리키는 표현이므로 그 신학적 함의를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
