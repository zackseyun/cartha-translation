revisions:
- from: 다윗이 기브온 사람들에게 말했습니다. 「내가 너희를 위해 무엇을 해야 합니까? 무엇으로 속죄해야 너희가 야훼의 유산을 축복하겠습니까?」[a][b]
  to: 다윗이 기브온 사람들에게 말했습니다. “내가 여러분을 위해 무엇을 해야 하겠습니까? 무엇으로 속죄하여야 여러분이 야훼의 기업을 축복하시겠습니까?”[a][b]
  rationale: 원문의 수단을 묻는 질문과 כפר의 속죄 의미를 유지하면서, ‘기업’으로 נחלה의 성경적 비유를 더 정확히 전달했습니다. 마지막 절은 목적/결과로 자연스럽게 번역하되, 접속절로 읽을 수 있는 원문의 여지를 각주에서 보존했습니다. 각주 표지는 관련 표현 뒤에 두어 내용과 연결되게 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:38:06Z'
