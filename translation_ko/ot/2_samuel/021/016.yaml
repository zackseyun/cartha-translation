revisions:
- from: 그리고 이스비-노브[a]는 라파의 자손들 가운데 있었는데[b], 그의 창 무게는 은 삼백 세겔이었고, 그는 새것[c]으로 무장한 채 다윗을 쳐죽이겠다고 말했습니다.
  to: 그리고 라파에게서 난 자들 가운데 있던 이스비-베놉[a]은 그의 창의 무게가 청동 삼백 세겔이었고, 새 칼[c]을 차고 다윗을 치겠다고 말했습니다.[b]
  rationale: ‘은’을 ‘청동’으로 바로잡아 원문의 물질 명칭을 충실히 반영했습니다. 이름은 영어 POB의 전통적 독법에 맞추되 본문상의 난점은 각주에 남겼습니다. 생략된 명사는 한국어 문장에 필요한 범위에서 ‘칼’로 보충하고, 각주로 원문의 불확정성을 보존했습니다. 다만 ‘라파에게서 난 자들 가운데’에 붙는 각주는 해당 구절 바로 뒤에 두어야 하므로, 문장 흐름상 각주 표지를 문장 끝에 배치했습니다.
