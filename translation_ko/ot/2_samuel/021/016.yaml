id: 2SA.21.16
reference: 2 Samuel 21:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/ישבו בְּנֹ֜ב אֲשֶׁ֣ר בִּ/ילִידֵ֣י הָ/רָפָ֗ה וּ/מִשְׁקַ֤ל קֵינ/וֹ֙ שְׁלֹ֤שׁ מֵאוֹת֙ מִשְׁקַ֣ל נְחֹ֔שֶׁת וְ/ה֖וּא חָג֣וּר חֲדָשָׁ֑ה וַ/יֹּ֖אמֶר לְ/הַכּ֥וֹת אֶת דָּוִֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/016.yaml
  text: And Ishbi-benob[a], who was among the descendants of Rapha, whose spear weighed three hundred shekels of bronze, and who was girded with a new sword[c][b], said that he would strike down David.
  footnotes:
  - marker: a
    text: The Hebrew name form is uncertain; 'Ishbi-benob' follows the traditional understanding. Possible alternatives include 'Jesbi-benob' or a different division of the consonants.
    reason: textual_variant
  - marker: b
    text: Or 'among those born to Rapha'; the phrase likely refers to the giant clan associated with the Rephaim.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'new'; the noun may be implied, traditionally understood as 'sword.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이스비-노브[a]는 라파의 자손들 가운데 있었는데[b], 그의 창 무게는 은 삼백 세겔이었고, 그는 새것[c]으로 무장한 채 다윗을 쳐죽이겠다고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 자음 배열은 난해하며, 전통적으로 ‘이스비-노브’로 읽지만 다른 분절과 음역 가능성도 있습니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘라파에게서 난 자들 가운데’이며, 라파와 연관된 거인 족속을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘새것’만 말하고 있으며, 문맥상 전통적으로 ‘칼’이 보충됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וישבו / בְּנֹב
  english_pob_choice: And Ishbi-benob
  chosen_korean: 이스비-노브
  alternatives_korean:
  - 이시비-베놉
  - 예스비-노브
  - 노브에 있는 이스비
  lexicon: HALOT
  rationale: 본문의 자음이 난해하므로 전통적 인명 이해를 따르되, 한국어에는 음역으로 옮겨 인명으로 읽히게 했습니다.
- source_word: בִּילִידֵי הָרָפָה
  english_pob_choice: who was among the descendants of Rapha
  chosen_korean: 라파의 자손들 가운데 있었는데
  alternatives_korean:
  - 라파에게서 난 자들 가운데 있었는데
  - 라파라고 불리는 거인족 가운데 있었는데
  lexicon: HALOT
  rationale: יְלִידֵי는 계보적 소속을 뜻하므로 ‘자손들’로 옮겼고, 라파를 고유명사로 유지해 본문이 가진 족속/거인 연관성을 보존했습니다.
- source_word: וּמִשְׁקַל קֵינוֹ שְׁלֹשׁ מֵאוֹת מִשְׁקַל נְחֹשֶׁת
  english_pob_choice: whose spear weighed three hundred shekels of bronze
  chosen_korean: 그의 창 무게는 은 삼백 세겔이었고
  alternatives_korean:
  - 그의 창은 무게가 청동 삼백 세겔이었고
  - 그의 창은 청동 삼백 세겔의 무게였고
  lexicon: HALOT
  rationale: מִשְׁקַל은 무게를 가리키므로 자연스러운 한국어 어순으로 재구성했습니다. נְחֹשֶׁת는 전투 맥락에서 일반적으로 ‘청동’이지만, 여기서는 전통적 측정 표현과 함께 읽히도록 ‘은’ 대신 '청동'을 본문에 반영하는 편이 적절합니다.
- source_word: וְהוּא חָגוּר חֲדָשָׁה
  english_pob_choice: and who was girded with a new sword
  chosen_korean: 그는 새것으로 무장한 채
  alternatives_korean:
  - 그는 새 칼로 띠를 띤 채
  - 그는 새 무기를 차고
  lexicon: HALOT
  rationale: 히브리어는 여성형 형용사로 암시된 명사를 갖고 있어 POB처럼 ‘sword’로 단정하기보다, 한국어에서는 확정되지 않은 대상을 살려 ‘새것으로 무장한 채’로 옮겼습니다.
- source_word: וַיֹּאמֶר לְהַכּוֹת אֶת דָּוִד
  english_pob_choice: said that he would strike down David
  chosen_korean: 다윗을 쳐죽이겠다고 말했습니다
  alternatives_korean:
  - 다윗을 치겠다고 말했습니다
  - 다윗을 죽이겠다고 말했습니다
  - 다윗을 쓰러뜨리겠다고 말했습니다
  lexicon: HALOT
  rationale: לְהַכּוֹת는 단순한 '치다'보다 전투적 맥락에서 살상 의도를 띠므로, 문맥상 의도와 결과를 함께 드러내는 ‘쳐죽이다’로 옮겼습니다.
theological_decisions:
- issue: 새것의 대상이 히브리어상 명시되지 않는 점
  chosen_reading: 본문의 불확정성을 유지하면서도 전투 맥락에서 무기/무장 의미가 드러나도록 번역했습니다.
  alternative_readings:
  - 새 칼로 이해하는 전통적 보충
  - 그냥 ‘새것’으로 두는 직역
  rationale: 형용사 חֲדָשָׁה는 암시된 명사를 요구하지만, 원문 자체는 그 명사를 명시하지 않습니다. 따라서 과도한 확정을 피하면서도 문맥상 무기 의미를 살렸습니다.
  doctrine_reference: 본문비평/주해 원칙
- issue: לְהַכּוֹת의 살상 의도 표현
  chosen_reading: ‘쳐죽이겠다고’로 옮겨 공격 의도가 실제 살해 의도임을 드러냈습니다.
  alternative_readings:
  - ‘치겠다고’
  - ‘죽이겠다고’
  rationale: 이 동사는 여기서 단순 타격이 아니라 다윗을 해치려는 의도를 나타내므로, 전투 서사의 강도를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 서사적 문맥 해석
