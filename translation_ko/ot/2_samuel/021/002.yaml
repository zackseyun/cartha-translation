base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/002.yaml
  text: So the king called the Gibeonites and spoke to them[a]. Now the Gibeonites were not from the sons of Israel, but from the remnant of the Amorites; and the sons of Israel had sworn to them[c][b]. But Saul had sought to strike them down in his zeal for the sons of Israel and Judah.
  footnotes:
  - marker: a
    text: Or 'were not Israelites.' The Hebrew reads 'were not from the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from what was left of the Amorites.'
    reason: lexical_alternative
  - marker: c
    text: Or 'Saul had sought to kill them in his jealousy for Israel and Judah.' The Hebrew term can mean either 'zeal' or 'jealousy' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 기브온 사람들을 불러 그들에게 말했습니다. 기브온 사람들은 이스라엘 자손이 아니었습니다[a]. 그들은 아모리 사람들 가운데 남은 자들이었습니다[b]. 이스라엘 자손은 그들에게 맹세했지만, 사울은 이스라엘과 유다를 위한 열심으로 그들을 치려고 했습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람이 아니었습니다.’ 히브리어는 직역하면 ‘이스라엘 자손 가운데 속한 이들이 아니었다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아모리 사람들 가운데 남은 자들.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘사울은 이스라엘과 유다를 위한 자신의 질투로 그들을 치려고 했습니다.’ 히브리어 용어는 문맥에 따라 ‘열심’ 또는 ‘질투’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא הַמֶּלֶךְ
  english_pob_choice: So the king called
  chosen_korean: 왕이 … 불러
  alternatives_korean:
  - 왕이 … 소집해
  - 왕이 … 불렀습니다
  lexicon: HALOT
  rationale: קרא는 문맥상 사람을 자기 앞으로 부르다/부르다의 뜻이므로, 한국어에서는 자연스럽게 ‘불러’로 옮겼습니다. 왕의 동작을 간결하게 드러내면서도 원문의 호출 행동을 보존합니다.
- source_word: לַגִּבְעֹנִים
  english_pob_choice: the Gibeonites
  chosen_korean: 기브온 사람들
  alternatives_korean:
  - 기브온 사람들
  - 기브온 사람들
  lexicon: HALOT
  rationale: 지명형 집단명은 현대 한국어에서 가장 읽기 자연스러운 ‘기브온 사람들’로 옮겼습니다. 표준 외래어 표기법에 따라 고유명사를 유지하되, 집단 정체성을 분명히 했습니다.
- source_word: לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  english_pob_choice: were not from the sons of Israel
  chosen_korean: 이스라엘 자손이 아니고
  alternatives_korean:
  - 이스라엘 자손이 아니고
  - 이스라엘 사람들은 아니고
  lexicon: HALOT
  rationale: 반복되는 בני ישראל의 연결을 살리기 위해 ‘이스라엘 자손’을 유지했습니다. 영어 POB의 투명성을 따라 ‘이스라엘 사람들’보다 원어 대응성이 높은 표현을 택했습니다.
- source_word: מִיֶּתֶר הָאֱמֹרִי
  english_pob_choice: from the remnant of the Amorites
  chosen_korean: 아모리 사람의 남은 무리
  alternatives_korean:
  - 아모리 사람의 남은 무리
  - 아모리 사람의 남은 자들
  lexicon: HALOT
  rationale: יֶתֶר는 남은 것, 잔여를 뜻하므로 ‘남은 무리’로 옮겨 생존 잔여의 의미를 드러냈습니다. POB의 ‘remnant’가 지닌 의미를 한국어로 지나치게 신학화하지 않고 보존합니다.
- source_word: נִשְׁבְּעוּ לָהֶם
  english_pob_choice: the sons of Israel had sworn to them
  chosen_korean: 이스라엘 자손이 그들에게 맹세했기 때문입니다
  alternatives_korean:
  - 이스라엘 자손이 그들에게 맹세했기 때문입니다
  - 이스라엘 자손이 그들과 맹세했기 때문입니다
  lexicon: HALOT
  rationale: שבע의 기본 의미는 맹세하다이므로, 서술의 흐름에 맞게 원인 절로 처리했습니다. ‘그들과’보다 ‘그들에게’가 맹세의 상대를 더 직접적으로 드러냅니다.
- source_word: בְּקַנֹּאתוֹ
  english_pob_choice: in his zeal
  chosen_korean: 열심으로
  alternatives_korean:
  - 열심으로
  - 열정으로
  - 질투심으로
  lexicon: HALOT
  rationale: קנא는 문맥상 이스라엘과 유다를 위한 편파적 열심을 뜻하므로, 전통적 교회어법에서 오해될 수 있는 ‘질투심’ 대신 ‘열심’을 택했습니다. 이는 윤리적 긴장(과도한 민족적 열심)을 지우지 않으면서도 한국어 독해에 적합합니다.
theological_decisions:
- issue: קנא의 정서적 뉘앙스
  chosen_reading: ‘열심’으로 번역해 사울의 동기가 민족적 편향의 강한 열심임을 드러냈습니다.
  alternative_readings:
  - ‘질투심’으로 번역
  - ‘분기’로 완화 번역
  rationale: 본문은 사울의 동기를 정당화하지 않고 설명만 합니다. 따라서 ‘열심’은 원문의 강도를 유지하면서도, 문맥상 ‘질투’보다 더 적절하게 사울의 정치적·민족적 동기를 전달합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 3
- issue: 서술 구조의 배경 설명성
  chosen_reading: 첫 문장을 ‘그러므로’로 시작해 앞 문맥과 연결되는 서술적 배경을 드러냈습니다.
  alternative_readings:
  - 그리고
  - 그리하여
  rationale: 히브리어 waw 연속은 단순한 접속 이상으로 서술 전개를 잇는 기능이 있으며, 여기서는 다윗의 조치가 앞 문맥에 대한 응답임을 보여 줍니다. ‘그러므로’는 그 배경적 연결을 가장 자연스럽게 반영합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 2
