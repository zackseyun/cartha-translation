revisions:
- from: 그러므로 왕이 기브온 사람들을 불러 그들에게 말했습니다. 기브온 사람들은 이스라엘 자손이 아니고, 아모리 사람의 남은 무리였는데, 이스라엘 자손이 그들에게 맹세했기 때문입니다[a][b]. 그런데 사울은 이스라엘과 유다 자손을 위한 열심으로 그들을 죽이려고 했습니다[c].
  to: 왕이 기브온 사람들을 불러 그들에게 말했습니다. 기브온 사람들은 이스라엘 자손이 아니었습니다[a]. 그들은 아모리 사람들 가운데 남은 자들이었습니다[b]. 이스라엘 자손은 그들에게 맹세했지만, 사울은 이스라엘과 유다를 위한 열심으로 그들을 치려고 했습니다[c].
  rationale: 원문의 서사 연결과 배경 설명을 인과 관계로 바꾸지 않도록 문장을 분리·재구성했습니다. ‘맹세했지만’은 이스라엘의 맹세와 사울의 적대 행위 사이의 문맥상 대조를 자연스럽게 드러냅니다. 폭력 동사는 ‘치려고’로 유지하여 원문의 의미 범위를 보존했으며, 각주의 앵커를 해당 표현 바로 뒤에 배치하고 비문인 대안 표현을 수정했습니다.
