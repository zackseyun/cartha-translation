  text: אֶת אַרְבַּ֥עַת אֵ֛לֶּה יֻלְּד֥וּ לְ/הָ/רָפָ֖ה בְּ/גַ֑ת וַ/יִּפְּל֥וּ בְ/יַד דָּוִ֖ד וּ/בְ/יַ֥ד עֲבָדָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/022.yaml
  text: These four were born to the Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
  footnotes:
  - marker: a
    text: Or 'to Rapha,' 'to the giant,' or 'to the Rephaim.' The Hebrew likely refers to descent from the giant line associated with Gath.
    reason: alternative_reading
translation:
  language: ko
  text: 이 네 사람은 가드에서 라파에게서 태어났으며[a], 다윗과 그의 종들의 손에 쓰러졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘라파에게’, ‘거인에게’, 또는 ‘르바임에게’. 히브리어는 가드와 관련된 거인 계열의 후손을 가리키는 것으로 보이지만, 정확한 지시 대상은 여러 가지로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶת אַרְבַּעַת אֵּלֶּה
  english_pob_choice: these four
  chosen_korean: 이 네 사람
  alternatives_korean:
  - 이 네 명
  - 이 네 개
  lexicon: WLC
  rationale: 지시사+수사구를 자연스러운 현대 한국어로 옮기면 ‘이 네 사람’이 가장 직접적이며, 전투 맥락상 사람을 분명히 드러냅니다.
- source_word: יֻלְּדוּ
  english_pob_choice: were born
  chosen_korean: 태어났으며
  alternatives_korean:
  - 낳아졌으며
  - 출생했으며
  lexicon: WLC
  rationale: 수동형 ילד는 출생/기원을 말하므로 ‘태어났으며’가 가장 자연스럽고, 단순한 생물학적 출생보다 혈통적 기원을 함께 살립니다.
- source_word: לְהָרָפָה
  english_pob_choice: to the Rapha
  chosen_korean: 라바에게서
  alternatives_korean:
  - 라바에게
  - 라파에게서
  - 라파에게
  lexicon: WLC
  rationale: 영어 POB가 보존한 ‘the Rapha’의 불확정성을 한국어에서도 유지하려고 고유명사 음역을 택했으며, ‘에게서’로 계보/출신의 뉘앙스를 살렸습니다.
- source_word: וּבְיַד עֲבָדָיו
  english_pob_choice: by the hand of his servants
  chosen_korean: 그의 종들의 손에
  alternatives_korean:
  - 그의 종들의 손으로
  - 그의 부하들의 손에
  lexicon: WLC
  rationale: 히브리어 관용구 ‘손에’는 행위 주체를 나타내므로 그대로 살렸고, עֲבָדָיו는 여기서 왕의 수행자/종들을 뜻하는 기본값 ‘종들’로 옮겼습니다.
theological_decisions:
- issue: הָרָפָה의 정체를 어떻게 처리할지
  chosen_reading: 주본문은 혈통적·계보적 지시를 보존하는 방향으로 ‘라바에게서’라고 두고, 의미를 단정하지 않습니다.
  alternative_readings:
  - ‘라파에게서’
  - ‘거인에게서’
  - ‘르바임에게서’
  rationale: 본문과 영어 POB 모두 이 표현의 해석 가능성을 열어 두고 있으므로, 본문에서는 전승적 모호성을 유지하고 주석 없이 단정하지 않는 것이 원문 충실도에 맞습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
