source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יִּקַּ֞ח אֶת עַצְמ֤וֹת שָׁאוּל֙ וְ/אֶת עַצְמוֹת֙ יְהוֹנָתָ֣ן בְּנ֔/וֹ מֵ/אֵ֕ת בַּעֲלֵ֖י יָבֵ֣ישׁ גִּלְעָ֑ד אֲשֶׁר֩ גָּנְב֨וּ אֹתָ֜/ם מֵ/רְחֹ֣ב בֵּֽית שַׁ֗ן אֲשֶׁ֨ר תלו/ם שם ה/פלשתים בְּ/י֨וֹם הַכּ֧וֹת פְּלִשְׁתִּ֛ים אֶת שָׁא֖וּל בַּ/גִּלְבֹּֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/012.yaml
  text: Then David went and took the bones of Saul and the bones of Jonathan his son from the citizens of Jabesh-gilead[a], who had stolen them from the public square of Beth-shan[c][b], where the Philistines had hung them on the day the Philistines struck down Saul on Gilboa.
  footnotes:
  - marker: a
    text: Or 'remains' for 'bones,' though the Hebrew more literally says 'bones.'
    reason: lexical_alternative
  - marker: b
    text: '''Hung them'' could also be rendered ''displayed them'' or, in a stronger reading, ''impaled them''; the Hebrew verb itself most directly means ''hang.'''
    reason: lexical_alternative
  - marker: c
    text: Gilboa refers to the mountain area where Saul fell (cf. 1 Sam 31:8–13).
    reason: cross_reference
translation:
  language: ko
  text: 그때 다윗이 가서 사울의 뼈[a]와 그의 아들 요나단의 뼈를 길르앗 야베스 사람들에게서 가져왔습니다. 그들은 그것들을 벧스안의 광장에서 훔쳐 왔는데, 거기서 블레셋 사람들이 길보아[c]에서 사울을 쳐 죽인 날 그것들을 매달아 두었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뼈’ 대신 ‘유해’로 옮길 수도 있으나, 히브리어는 더 문자적으로 ‘뼈들’이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘매달아 두었습니다’는 히브리어 동사의 가장 직접적인 의미를 따릅니다. ‘전시해 두었습니다’로 옮길 수도 있으며, 더 강하게는 ‘꿰어 세웠다’로 이해할 가능성도 있지만, 원문 자체는 그 정도까지 명시하지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 길보아는 사울이 쓰러진 산악 지대를 가리킵니다(참조 1사무엘 31:8–13).
    reason: cross_reference
lexical_decisions:
- source_word: עַצְמוֹת
  english_pob_choice: bones
  chosen_korean: 뼈
  alternatives_korean:
  - 유해
  - 남은 것
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘뼈들’을 뜻하므로, 매장된 유해를 회수하는 장면에서도 구체성을 살려 ‘뼈’로 옮기는 것이 원문에 가장 가깝습니다.
- source_word: בַּעֲלֵי יָבֵישׁ גִּלְעָד
  english_pob_choice: citizens of Jabesh-gilead
  chosen_korean: 길르앗 야베스 사람들
  alternatives_korean:
  - 길르앗 야베스 시민들
  - 길르앗 야베스의 주민들
  lexicon: HALOT
  rationale: בַּעֲלֵי + 지명은 해당 지역 사람들을 가리키는 관용적 표현이므로, 현대 한국어에서는 자연스럽게 ‘~사람들’로 옮기는 것이 가장 무난합니다.
- source_word: מֵרְחֹב בֵּית שַׁן
  english_pob_choice: from the public square of Beth-shan
  chosen_korean: 벳산의 광장
  alternatives_korean:
  - 벳산의 공공 광장
  - 벳산의 시내 광장
  lexicon: HALOT
  rationale: רְחוֹב은 열린 광장/거리의 의미이므로, 현대어로는 간결한 ‘광장’이 원문의 시민적 공개 장소를 잘 전달합니다.
- source_word: תָּלֻם שָׁם
  english_pob_choice: had hung them there
  chosen_korean: 매달아 두었습니다
  alternatives_korean:
  - 거기 매어 달아 두었습니다
  - 거기 걸어 두었습니다
  - 거기 매달았습니다
  lexicon: HALOT
  rationale: 동사는 기본적으로 ‘매다, 걸다’의 뜻이며, 시체의 공개 전시 맥락에서는 결과 상태를 드러내는 ‘매달아 두다’가 가장 직접적입니다.
- source_word: וַיֵּלֶךְ ... וַיִּקַּח
  english_pob_choice: Then David went and took
  chosen_korean: 그때 다윗이 가서 ... 가져왔습니다
  alternatives_korean:
  - 그리고 다윗이 가서 ... 가져왔습니다
  - 그러자 다윗이 가서 ... 가져왔습니다
  lexicon: HALOT
  rationale: 연속된 와우-연속형은 서사를 전진시키므로, 한국어에서는 흐름을 살리는 ‘그때’가 자연스럽고 과도한 해석을 피합니다.
theological_decisions:
- issue: 사울과 요나단의 유골 회수 장면의 표현 수위
  chosen_reading: 원문의 구체성을 살려 ‘뼈’를 그대로 옮기고, 공개 전시의 충격을 완화하지 않았습니다.
  alternative_readings:
  - ‘유해’를 사용해 더 완곡하게 표현
  - ‘시신’으로 일반화
  rationale: 이 본문은 장례와 수치의 회수라는 역사 서술이므로, 원문의 물질적·공개적 성격을 흐리지 않는 것이 중요합니다.
  doctrine_reference: 본문의 역사 서술 및 장례/명예 수치의 서사적 의미
- issue: 블레셋이 사울을 ‘쳤다’의 동사 선택
  chosen_reading: ‘치다’ 계열의 간결한 표현을 사용해 히브리어 נכה의 강한 타격/제압 의미를 살렸습니다.
  alternative_readings:
  - ‘죽였다’
  - ‘패배시켰다’
  rationale: 원문은 단순한 사살보다 전투적 타격과 패배를 함께 함축하므로, ‘치다’는 의미 범위를 과도하게 좁히지 않습니다.
  doctrine_reference: 전쟁 서술에서의 동사 의미 범위
