    rationale: ‘처형자’는 처형을 실행하는 사람을 뜻하므로, 원문의 공개 처형되어 전시된 사람들과 반대되는 의미가 될 수 있습니다. ‘처형된 이들’ 또는 ‘처형된 사람들’로 수정해야 합니다.
  - severity: low
