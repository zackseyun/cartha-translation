base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/013.yaml
  text: He brought up from there the bones of Saul and the bones of Jonathan his son[a], and they gathered the bones of those who had been impaled.
  footnotes:
  - marker: a
    text: Or, 'those who had been impaled' or 'those who had been exposed.' The Hebrew refers to the executed men whose bodies were publicly displayed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그곳에서 사울의 뼈와 그의 아들 요나단의 뼈를 가져왔고, 그들은 매달려 있던 이들의 뼈를 수습했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내걸려 있던 이들’ 또는 ‘드러나 있던 이들’로 옮길 수 있습니다. 히브리어는 공개적으로 전시된 처형된 이들의 시신을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל מִשָּׁם
  english_pob_choice: brought up from there
  chosen_korean: 거기에서 … 가져올렸고
  alternatives_korean:
  - 거기에서 … 데려왔고
  - 거기에서 … 올려왔고
  lexicon: HALOT
  rationale: עלה의 ‘위로 가져오다/올리다’라는 이동·회수 감각을 살리되, 유골을 회수하는 문맥에 맞게 자연스럽게 표현했습니다.
- source_word: עַצְמוֹת
  english_pob_choice: bones
  chosen_korean: 뼈
  alternatives_korean:
  - 유해
  - 유골
  lexicon: HALOT
  rationale: 히브리어의 문자적 의미가 ‘뼈’이므로, 매장 맥락에서도 본문 정보를 더 직접적으로 드러내는 번역을 택했습니다.
- source_word: יְהוֹנָתָן בְּנוֹ
  english_pob_choice: Jonathan his son
  chosen_korean: 그의 아들 요나단
  alternatives_korean:
  - 요나단 그의 아들
  - 그 아들 요나단
  lexicon: HALOT
  rationale: 히브리어의 동격 구조를 한국어에서 자연스럽게 옮기면서, 요나단이 사울의 아들임을 분명히 했습니다.
- source_word: הַמּוּקָעִים
  english_pob_choice: those who had been impaled
  chosen_korean: 매달린 자들
  alternatives_korean:
  - 못 박혀 매달린 자들
  - 처형되어 드러난 자들
  lexicon: HALOT
  rationale: 이 어근은 공개 처형 후 시신이 드러나 매달린 상태를 가리킬 수 있어, 문맥상 ‘매달린 자들’로 번역하되 영어 POB의 대안 의미를 주석으로 남겼습니다.
theological_decisions:
- issue: 처형된 자들의 신체 처리 방식
  chosen_reading: 본문의 핵심은 사울과 요나단의 뼈 회수와, 함께 수습된 처형자들의 뼈라는 점을 살리는 데 두고, 처형 방식은 본문이 허용하는 범위 안에서만 번역합니다.
  alternative_readings:
  - ‘못 박혀 매달린 자들’처럼 더 구체화
  - ‘노출된 자들’처럼 공개 전시를 강조
  rationale: 히브리어는 처형 방식의 세부를 완전히 고정하지 않으므로, 과도한 단정 대신 공개적 처형·노출의 의미를 보존했습니다.
  doctrine_reference: 본문 해석의 절제와 역사 서술의 정확성
