theological_decisions:
- issue: 다윗의 수행원을 ‘종들’로 유지할지 ‘신하/부하’로 완화할지
  chosen_reading: ‘종들’로 두어 왕의 소속 인원이라는 원문의 사회적 관계를 드러냈습니다.
  alternative_readings:
  - 신하들
  - 부하들
  - 종복들
  rationale: 본문의 עֲבָדִים는 단순한 예의적 호칭보다 왕에게 속한 인적 집단을 가리키므로, 현대어이면서도 관계의 질감을 살리는 ‘종들’이 가장 स्रोत-직접적입니다.
  doctrine_reference: 2 Samuel 21:15의 역사 서술; 사회적/신분적 어휘의 보존
