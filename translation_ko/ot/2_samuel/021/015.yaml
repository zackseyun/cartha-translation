  yaml_path: translation/ot/2_samuel/021/015.yaml
  text: And there was war again between the Philistines and Israel[a], and David went down with his servants with him, and they fought against the Philistines, and David grew weary.
  footnotes:
  - marker: a
    text: Or 'his men.' The Hebrew says 'his servants,' a common expression for those in a king's service, including military retainers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 또 블레셋 사람들과 이스라엘 사이에 전쟁이 있었습니다. 다윗이 자기 종들과 함께 내려가서, 블레셋 사람들과 싸웠고, 다윗은 피곤해졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 종들’이라고 하며, 왕의 봉사에 속한 사람들, 곧 군사적 수행원까지 포함하는 흔한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
