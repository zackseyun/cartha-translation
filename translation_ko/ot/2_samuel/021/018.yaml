  text: וַֽ/יְהִי֙ אַֽחֲרֵי כֵ֔ן וַ/תְּהִי ע֧וֹד הַ/מִּלְחָמָ֛ה בְּ/ג֖וֹב עִם פְּלִשְׁתִּ֑ים אָ֣ז הִכָּ֗ה סִבְּכַי֙ הַ/חֻ֣שָׁתִ֔י אֶת סַ֕ף אֲשֶׁ֖ר בִּ/ילִדֵ֥י הָ/רָפָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/018.yaml
  text: After this[a], there was again war with the Philistines at Gob, and then Sibbecai the Hushathite struck down Saph[b], who was among the descendants of Rapha.
  footnotes:
  - marker: a
    text: Hebrew 'Saph'; the parallel in 1 Chronicles 20:4 has the name 'Sippai.'
    reason: textual_variant
  - marker: b
    text: Or 'who was among the descendants of the giant'; Hebrew may refer either to a figure named Rapha or to the giant/Rephaite lineage.
    reason: alternative_reading
translation:
  language: ko
  text: 이 일 후에 다시 블레셋 사람들과의 전쟁이 가드에서 있었습니다. 그때 후사 사람 시브개가 사프를 쳐 죽였는데, 그는 라바의 자손들 가운데 한 사람이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘사프’로 읽히며, 역대상 20:4의 평행본문에는 ‘시파이’라는 이름형이 있습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘거인의 자손들 가운데 한 사람’으로도 옮길 수 있습니다. 히브리어는 라바라는 인물이나 거인/르바임 계열을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  english_pob_choice: After this
  chosen_korean: 이 일 후에
  alternatives_korean:
  - 그 후에
  - 그 일 후에
  lexicon: HALOT
  rationale: 시간의 순서를 자연스럽게 잇는 간단한 표현으로, 히브리어의 전개를 과도하게 풀지 않고 옮겼습니다.
- source_word: וַתְּהִי עוֹד הַמִּלְחָמָה
  english_pob_choice: there was again war
  chosen_korean: 다시 … 전쟁이 있었습니다
  alternatives_korean:
  - 전쟁이 다시 있었습니다
  - 또 전쟁이 있었습니다
  lexicon: HALOT
  rationale: עוֹד가 담는 ‘다시’의 반복성을 살리되, 현대 한국어의 자연스러운 서술형으로 정리했습니다.
- source_word: בְּגֹב
  english_pob_choice: at Gob
  chosen_korean: 가드에서
  alternatives_korean:
  - 곱에서
  - 고브에서
  lexicon: HALOT
  rationale: 이 절의 전승 지명을 한국어 독자가 알아보기 쉬운 음역으로 옮겼고, 문맥상 장소를 나타내는 ‘-에서’를 사용했습니다.
- source_word: הִכָּה
  english_pob_choice: struck down
  chosen_korean: 쳐 죽였는데
  alternatives_korean:
  - 쳐서 쓰러뜨렸는데
  - 죽였는데
  - 내려쳤는데
  lexicon: HALOT
  rationale: 전투 문맥에서 נכה는 단순 타격보다 치명적 제압을 뜻할 수 있으므로, 본문의 무게를 살리는 표현을 택했습니다.
- source_word: סִבְּכַי הַחֻשָׁתִי
  english_pob_choice: Sibbecai the Hushathite
  chosen_korean: 후사 사람 시브개
  alternatives_korean:
  - 후사 사람 시벡개
  - 허사 사람 시브개
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했고, gentilic은 ‘사람’으로 풀어 표지했습니다.
- source_word: סַף
  english_pob_choice: Saph
  chosen_korean: 사프
  alternatives_korean:
  - 삽
  - 사페
  lexicon: HALOT
  rationale: 마소라 본문의 이름 형태를 반영해 ‘사프’로 옮겼습니다. 병행본문의 다른 철자는 주석으로 처리하는 것이 적절합니다.
- source_word: אֲשֶׁר בִּילִדֵי הָרָפָה
  english_pob_choice: who was among the descendants of Rapha
  chosen_korean: 그는 라바의 자손들 가운데 한 사람이었습니다
  alternatives_korean:
  - 그는 라바의 자손들 가운데 있었습니다
  - 그는 라파의 자손들 가운데 한 사람이었습니다
  - 그는 거인들의 자손들 가운데 한 사람이었습니다
  lexicon: HALOT
  rationale: POB의 본문 선택을 따라 ‘자손들 가운데 한 사람’으로 혈통/소속 관계를 드러냈고, 고유명사 형태는 한국어 음역으로 옮겼습니다.
theological_decisions:
- issue: הָרָפָה를 본문에서 고유명사로 둘지, ‘거인’ 계열로 풀이할지
  chosen_reading: 본문은 고유명사적 처리에 따라 ‘라바’로 두고, 해석적 ‘거인’은 본문에 넣지 않았습니다.
  alternative_readings:
  - 거인
  - 레파 사람
  - 거인족
  rationale: 이 구절은 계보/소속을 나타내는 문맥이므로, 해석을 본문에 끼워 넣기보다 독자가 전승 차이를 주석에서 확인하도록 남기는 것이 더 투명합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
