    rationale: '[a]는 사프의 병행본문 이름형, [b]는 라바/거인 계열의 해석 가능성에 관한 주석입니다. 각각 ‘사프’와 ‘라바’에 붙여야 주석의 적용 대상이 명확합니다.'
  - severity: low
    issue: ‘쳐 죽였는데’가 הִכָּה의 의미를 확정적으로 좁힘
    rationale: 전투 목록의 문맥상 죽음일 가능성은 높지만, נכה의 기본 의미는 치다/쳐서 쓰러뜨리다입니다. 영어 POB의 ‘struck down’과 같이 직접적이되 과도하게 확정하지 않는 표현이 더 적절합니다.
