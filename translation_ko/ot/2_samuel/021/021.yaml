translation:
  language: ko
  text: 그는 이스라엘을 모욕하였습니다. 다윗의 형제 시므이[a]의 아들 요나단이 그를 쳐서 쓰러뜨렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본과 역대상 20:7의 평행 본문은 ‘시므이’ 대신 ‘시마’ 또는 ‘시메아’를 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיְחָרֵף
  english_pob_choice: defied
  chosen_korean: 모욕하였습니다
  alternatives_korean:
  - 도전하였습니다
  - 조롱하였습니다
  - 저주하였습니다
  lexicon: HALOT
  rationale: 전투 문맥에서 ישראל을 향한 חרף는 단순한 조롱보다 공개적 모욕과 적대적 도전을 드러내므로, 한국어에서는 ‘모욕하다’가 그 공격성을 가장 자연스럽게 살립니다.
- source_word: אֶת יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 직접목적어는 집단명 ‘이스라엘’이므로, 별도의 확장 없이 고유 집단명으로 옮기는 것이 원문의 간결함을 유지합니다.
- source_word: וַיַּכֵּהוּ
  english_pob_choice: struck him down
  chosen_korean: 쳐서 쓰러뜨렸습니다
  alternatives_korean:
  - 죽였습니다
  - 쳤습니다
  - 쳐 죽였습니다
  lexicon: HALOT
  rationale: נכה는 기본적으로 ‘치다’이지만 이 전투 장면에서는 치명타를 포함할 수 있으므로, ‘쳐서 쓰러뜨리다’로 동작성과 결과를 함께 살렸습니다.
- source_word: בֶּן שמעי
  english_pob_choice: the son of Shimei
  chosen_korean: 시므이의 아들
  alternatives_korean:
  - 시마의 아들
  - 시메아의 아들
  lexicon: HALOT
  rationale: 마소라 본문의 자음형에 따른 대표 음역을 따르되, 역대기 병행본문의 이형을 각주로 처리하여 본문과 변이 모두를 보존했습니다.
theological_decisions:
- issue: דָוִד־־의 친족 관계 표현
  chosen_reading: ‘다윗의 형제’로 옮겨, 혈연적 친족 표지를 분명히 드러냈습니다.
  alternative_readings:
  - ‘다윗의 형제인’
  - ‘다윗의 형제의 아들’
  rationale: 히브리어 구문 אֲחִי דָוִד는 직역하면 ‘다윗의 형제’이며, 앞의 인물 식별에 필요한 친족 정보를 분명히 전달합니다. 한국어에서도 소유격으로 자연스럽게 처리할 수 있습니다.
  doctrine_reference: 문맥적 친족 표지 유지
- issue: 모욕/도전의 뉘앙스
  chosen_reading: ‘모욕하였습니다’로 번역해 적대적 공개 도전의 힘을 살렸습니다.
  alternative_readings:
  - ‘도전하였습니다’
  - ‘조롱하였습니다’
  rationale: 이 절은 단순한 심리적 조롱보다 전쟁 맥락의 공개적 모독을 말하므로, 독자가 원문의 공격성을 놓치지 않도록 했습니다.
  doctrine_reference: 본문-문맥 우선 원칙
