base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/021.yaml
  text: And he defied Israel[a], and Jonathan the son of Shimei, David’s brother, struck him down.
  footnotes:
  - marker: a
    text: Some manuscripts and the parallel in 1 Chronicles 20:7 read 'Shimea' or 'Shimeah' instead of 'Shimei.'
