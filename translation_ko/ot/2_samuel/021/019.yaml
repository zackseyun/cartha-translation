revisions:
- from: 그리고 다시 전쟁이 가드에서 블레셋 사람들과 있었습니다[a]. 엘하난은 베들레헴 사람 야레-오르김의 아들로서 길르앗 사람 골리앗을 쳐 죽였는데[b], 그의 창 자루는 베틀 채 같았습니다.
  to: 블레셋 사람들과 고브에서 다시 전쟁이 벌어졌습니다. 베들레헴 사람인 야레-오르김[a]의 아들 엘하난이 가드 사람 골리앗을 쳐 죽였습니다[b]. 그의 창 자루는 베틀의 들보 같았습니다.
  rationale: 고브와 가드의 지명 오류를 원문대로 바로잡고, 본문의 MT 독법은 조화시키지 않았습니다. 인명 난점과 역대기 병행 본문의 차이에 관한 각주를 각각 해당 어구에 연결했으며, 직조 도구 비유를 더 정확하고 자연스러운 한국어로 수정했습니다.
  reviewer_model: gpt-5.6-terra
