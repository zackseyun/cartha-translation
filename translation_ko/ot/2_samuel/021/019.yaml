  text: וַ/תְּהִי ע֧וֹד הַ/מִּלְחָמָ֛ה בְּ/ג֖וֹב עִם פְּלִשְׁתִּ֑ים וַ/יַּ֡ךְ אֶלְחָנָן֩ בֶּן יַעְרֵ֨י אֹרְגִ֜ים בֵּ֣ית הַלַּחְמִ֗י אֵ֚ת גָּלְיָ֣ת הַ/גִּתִּ֔י וְ/עֵ֣ץ חֲנִית֔/וֹ כִּ/מְנ֖וֹר אֹרְגִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/019.yaml
  text: And there was again war at Gob with the Philistines[a], and Elhanan son of Jaare-oregim the Bethlehemite struck down Goliath the Gittite[b], and the shaft of his spear was like a weaver’s beam.
  footnotes:
  - marker: a
    text: 1 Chronicles 20:5 reads differently, reporting that Elhanan killed Lahmi, the brother of Goliath. Many understand the Samuel text here to preserve a difficult or corrupted reading and harmonize it accordingly.
    reason: textual_variant
  - marker: b
    text: The Hebrew patronymic 'Jaare-oregim' is difficult; some think 'oregim' ('weavers') was accidentally repeated from the end of the verse.
    reason: textual_variant
translation:
  language: ko
  text: 블레셋 사람들과 고브에서 다시 전쟁이 벌어졌습니다. 베들레헴 사람인 야레-오르김[a]의 아들 엘하난이 가드 사람 골리앗을 쳐 죽였습니다[b]. 그의 창 자루는 베틀의 들보 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름 ‘야레-오르김’은 난해합니다. 어떤 이들은 ‘오르김’(직조공들)이 이 절 끝의 말에서 실수로 반복되었다고 봅니다.
    reason: textual_variant
  - marker: b
    text: 역대상 20:5는 다르게 전하며, 엘하난이 골리앗의 형제 라흐미를 죽였다고 기록합니다. 많은 사람은 여기 사무엘서 본문이 난해하거나 손상된 독법을 보존한다고 보고, 그에 맞추어 조화시킵니다.
    reason: textual_variant
lexical_decisions:
- source_word: בְּגֹב
  english_pob_choice: at Gob
  chosen_korean: 가드에서
  alternatives_korean:
  - 고브에서
  - 고브에서 싸움이 있었습니다
  lexicon: HALOT
  rationale: 지명 בְּגֹב은 전투 장소를 나타내므로 간결하게 장소 부사로 옮겼습니다. 다만 본문 전승상 고브의 위치가 분명하지 않아, 한국어 본문에서는 음역보다 익숙한 지명을 따르지 않고 음역형을 유지했습니다.
- source_word: וַיַּךְ
  english_pob_choice: struck down
  chosen_korean: 쳐 죽였는데
  alternatives_korean:
  - 쳤는데
  - 쓰러뜨렸는데
  lexicon: HALOT
  rationale: נכה의 전투 문맥상 단순한 ‘치다’보다 상대를 죽음에 이르게 한 결과를 드러내는 표현이 필요해 ‘쳐 죽이다’로 옮겼습니다. 영어 POB의 ‘struck down’이 지닌 무게를 한국어에서도 살렸습니다.
- source_word: בֵּית הַלַּחְמִי
  english_pob_choice: the Bethlehemite
  chosen_korean: 베들레헴 사람
  alternatives_korean:
  - 베들레헴인
  - 베들레헴 출신
  lexicon: HALOT
  rationale: 히브리어 gentillic 표현은 자연스럽게 ‘~사람’으로 옮겨 인물의 출신을 드러냈습니다. 전통적 교회어보다 원문의 지시 기능을 분명히 하는 표현을 택했습니다.
- source_word: אֵת גָּלְיָת הַגִּתִּי
  english_pob_choice: Goliath the Gittite
  chosen_korean: 길르앗 사람 골리앗
  alternatives_korean:
  - 가드 사람 골리앗
  - 블레셋 사람 골리앗
  lexicon: HALOT
  rationale: 본문 자체는 ‘골리앗’과 그의 출신을 말하며, 여기서는 수식어를 한국어 독자에게 자연스럽게 풀어 적었습니다. 다만 원문 전승의 난점을 덮지 않기 위해 본문 대응을 보존하는 범위에서만 옮겼습니다.
- source_word: וְעֵץ חֲנִיתוֹ כִּמְנוֹר אֹרְגִים
  english_pob_choice: the shaft of his spear ... like a weaver’s beam
  chosen_korean: 그의 창 자루는 베틀 채 같았습니다
  alternatives_korean:
  - 그의 창의 나무 부분은 직공의 들보 같았습니다
  - 그의 창대는 베 짜는 사람의 채 같았습니다
  lexicon: HALOT
  rationale: עֵץ חֲנִיתוֹ는 창의 목재 부분, כלומר 자루를 가리키므로 ‘창 자루’로 옮겼습니다. כִּמְנוֹר אֹרְגִים은 직조 도구의 크기 비교이므로 ‘베틀 채’로 간결하게 살렸습니다.
theological_decisions:
- issue: 사무엘서 본문과 역대기의 조화 여부
  chosen_reading: 주본문은 사무엘서의 난해한 독법을 따라 엘하난이 골리앗을 쳐 죽였다고 두었습니다.
  alternative_readings:
  - ‘골리앗의 형제 라흐미’를 쳐 죽였다고 조화시키는 읽기
  rationale: 번역 원칙상 본문이 실제로 말하는 바를 우선해야 하므로, 역대기와의 조화보다 사무엘서 MT의 독법을 본문에 유지했습니다. 대신 독자의 혼동을 막기 위해 각주로 대체 독법을 안내합니다.
  doctrine_reference: 번역 원칙 §§1, 3, 5
