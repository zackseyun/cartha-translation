reference: 2 Samuel 21:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תְּהִי ע֥וֹד מִלְחָמָ֖ה בְּ/גַ֑ת וַ/יְהִ֣י אִ֣ישׁ מדין וְ/אֶצְבְּעֹ֣ת יָדָי/ו֩ וְ/אֶצְבְּעֹ֨ת רַגְלָ֜י/ו שֵׁ֣שׁ וָ/שֵׁ֗שׁ עֶשְׂרִ֤ים וְ/אַרְבַּע֙ מִסְפָּ֔ר וְ/גַם ה֖וּא יֻלַּ֥ד לְ/הָ/רָפָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/020.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six and six, twenty-four in number[c][b]; he also was born to the Rapha.
  footnotes:
  - marker: a
    text: Or 'a huge man' or more literally 'a man of measure.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the fingers of his hands and the fingers of his feet'; English uses 'toes' for the digits of the feet.
    reason: lexical_alternative
  - marker: c
    text: Or 'was descended from Rapha'; possibly referring to the Rephaim, a group associated with giants.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 가드에서 다시 전쟁이 일어났습니다. 그리고 키가 매우 큰 한 사람이 있었는데, 그의 손가락들과 발가락들은 각각 여섯 개씩이어서 모두 스물네 개였습니다[b][c]. 그도 라파에게서 태어났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 히브리어는 ‘그의 손의 손가락들과 그의 발의 손가락들’이라고 말합니다. 한국어에서는 발의 손가락들을 ‘발가락’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘라파의 후손이었다’로도 옮길 수 있으며, 이는 르바임과 관련된 집단을 가리킬 가능성이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִלְחָמָה
  english_pob_choice: war
  chosen_korean: 전쟁
  alternatives_korean:
  - 전투
  lexicon: HALOT
  rationale: 반복되는 군사 충돌의 성격을 살려 ‘전쟁’으로 옮겼습니다. ‘전투’보다 사건 규모와 문맥의 연속성이 더 잘 드러납니다.
- source_word: אִישׁ מדין
  english_pob_choice: a man of great size
  chosen_korean: 키가 매우 큰 한 사람
  alternatives_korean:
  - 아주 거대한 한 사람
  - 한 거인 같은 사람
  - 신체 치수가 매우 큰 한 사람
  lexicon: HALOT
  rationale: 히브리어 표현은 신체적 규모를 가리키는 관용적 표현으로 보이므로, 직역을 피하고 한국어로 자연스러운 크기 묘사를 살렸습니다.
- source_word: אֶצְבְּעֹת יָדָיו ... אֶצְבְּעֹת רַגְלָיו
  english_pob_choice: fingers and toes
  chosen_korean: 손가락들과 발가락들
  alternatives_korean:
  - 손의 손가락들과 발의 손가락들
  lexicon: HALOT
  rationale: 히브리어는 ‘손의 손가락들’과 ‘발의 손가락들’을 말하지만, 한국어에서는 발의 손가락들을 ‘발가락’으로 옮기는 것이 가장 자연스럽고 의미도 분명합니다.
- source_word: יֻלַּד לְהָרָפָה
  english_pob_choice: was born to the Rapha
  chosen_korean: 라파에게서 태어났습니다
  alternatives_korean:
  - 라파에게서 태어난 사람입니다
  - 라파의 후손입니다
  lexicon: HALOT
  rationale: לְ + ילד의 계보적 용법을 살려 혈통/소속을 나타내되, 본문이 암시하는 고유명사성을 유지했습니다. ‘후손’은 해석이 더 강해 본문보다 좁혀질 수 있습니다.
theological_decisions:
- issue: 라파(הָרָפָה)의 정체
  chosen_reading: 고유한 조상 표지로서의 라파
  alternative_readings:
  - 거인
  - 르바임
  rationale: 본문은 주로 출신/계보를 말하므로, 본문 자체에서는 ‘거인’으로 풀지 않고 고유명사로 남겼습니다. 독자는 더 넓은 르바임 전승과 연결해 이해할 수 있습니다.
  doctrine_reference: 계보 표지와 본문-전승 관계의 보존
