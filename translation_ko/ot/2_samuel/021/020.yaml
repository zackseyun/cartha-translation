revisions:
- from: 그리고 가드에서 다시 전쟁이 일어났습니다. 그리고 키가 매우 큰 한 사람이 있었는데, 그의 손가락들과 발가락들은 각각 여섯 개씩이어서 모두 스물네 개였습니다[b][c]. 그도 라파에게서 태어났습니다.
  to: 가드에서 다시 전쟁이 일어났습니다. 그곳에 몸집이 매우 큰 사람이 있었는데, 그의 손가락과 발가락이 각각 여섯 개씩, 모두 스물네 개였습니다[b][c]. 그도 라파에게서 태어났습니다.
