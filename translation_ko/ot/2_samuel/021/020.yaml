  rationale: 본문은 주로 출신/계보를 말하므로, 본문 자체에서는 ‘거인’으로 풀지 않고 고유명사로 남겼습니다. 독자는 더 넓은 르바임 전승과 연결해 이해할 수 있습니다.
  doctrine_reference: 계보 표지와 본문-전승 관계의 보존
