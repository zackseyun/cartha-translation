base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/020.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six and six, twenty-four in number[c][b]; he also was born to the Rapha.
  footnotes:
  - marker: a
    text: Or 'a huge man' or more literally 'a man of measure.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the fingers of his hands and the fingers of his feet'; English uses 'toes' for the digits of the feet.
    reason: lexical_alternative
  - marker: c
    text: Or 'was descended from Rapha'; possibly referring to the Rephaim, a group associated with giants.
    reason: alternative_reading
translation:
  language: ko
  text: 가드에서 다시 전쟁이 일어났습니다. 그곳에 몸집이 매우 큰 사람이 있었는데, 그의 손가락과 발가락이 각각 여섯 개씩, 모두 스물네 개였습니다[b][c]. 그도 라파에게서 태어났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 히브리어는 ‘그의 손의 손가락들과 그의 발의 손가락들’이라고 말합니다. 한국어에서는 발의 손가락들을 ‘발가락’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘라파의 후손이었다’. ‘라파’는 르바임과 관련된 명칭을 가리킬 가능성이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִלְחָמָה
  english_pob_choice: war
  chosen_korean: 전쟁
  alternatives_korean:
  - 전투
  lexicon: HALOT
  rationale: 반복되는 군사 충돌의 성격을 살려 ‘전쟁’으로 옮겼습니다. ‘전투’보다 사건 규모와 문맥의 연속성이 더 잘 드러납니다.
- source_word: אִישׁ מדין
  english_pob_choice: a man of great size
  chosen_korean: 키가 매우 큰 한 사람
  alternatives_korean:
