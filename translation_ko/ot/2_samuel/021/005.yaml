id: 2SA.21.5
reference: 2 Samuel 21:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אֶל הַ/מֶּ֔לֶךְ הָ/אִישׁ֙ אֲשֶׁ֣ר כִּלָּ֔/נוּ וַ/אֲשֶׁ֖ר דִּמָּה לָ֑/נוּ נִשְׁמַ֕דְנוּ מֵֽ/הִתְיַצֵּ֖ב בְּ/כָל גְּבֻ֥ל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/005.yaml
  text: They said to the king[a], “The man who consumed us, and who planned against us[b], so that we should be destroyed from having a place within all the territory of Israel—”
  footnotes:
  - marker: a
    text: Or, 'who devised against us.' The Hebrew verb can carry the sense of planning or scheming.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from standing/establishing ourselves in all the territory of Israel,' that is, from continuing to have a place anywhere in Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 왕에게 말하였습니다. 「우리를 멸한 그 사람, 그리고 우리를 해하려고 꾀한 그 사람은 — 우리가 이스라엘의 온 경계 안에서 설 자리를 잃고 말았습니다」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 사람’은 히브리어 정관 표현을 살린 것이며, 사울을 가리키는 비난 섞인 지시 표현입니다.
    reason: source_note
  - marker: b
    text: ‘설 자리를 잃고’는 직역의 ‘서다/자리를 잡다’보다 문맥상 의미를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  english_pob_choice: The man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 그 인간
  lexicon: HALOT
  rationale: 직접 화법에서 앞서 언급된 사울을 가리키는 지시적 표현이므로, ‘그 사람’이 히브리어의 정관성과 비난의 뉘앙스를 가장 자연스럽게 살립니다.
- source_word: כִּלָּנוּ
  english_pob_choice: consumed us
  chosen_korean: 우리를 멸한
  alternatives_korean:
  - 우리를 삼킨
  - 우리를 끝장낸
  lexicon: HALOT
  rationale: כלה의 생생한 파괴 이미지를 한국어에서 가장 무리 없이 전달하는 표현으로 ‘멸한’을 택했습니다.
- source_word: דִּמָּה לָנוּ
  english_pob_choice: planned against us
  chosen_korean: 우리를 해하려고 꾀한
  alternatives_korean:
  - 우리에게 계획한
  - 우리에게 모의한
  lexicon: HALOT
  rationale: 이 동사는 단순한 ‘생각하다’보다 해로운 계책을 꾸미는 뜻이 강하므로, 대적성은 살리되 문맥에 맞게 ‘해하려고 꾀한’으로 옮겼습니다.
- source_word: מֵהִתְיַצֵּב
  english_pob_choice: from having a place
  chosen_korean: 설 자리를 잃고
  alternatives_korean:
  - 서 있을 수 없게 되어
  - 자리를 잡지 못하게 되어
  lexicon: HALOT
  rationale: 직역하면 ‘서다/자리를 잡다’의 계열이지만, 이 문맥에서는 이스라엘 안에서 계속 존재할 자리를 빼앗긴다는 뜻이므로 ‘설 자리를 잃고’가 의미를 가장 잘 드러냅니다.
- source_word: בְּכָל גְּבֻל יִשְׂרָאֵל
  english_pob_choice: within all the territory of Israel
  chosen_korean: 이스라엘의 온 경계 안에서
  alternatives_korean:
  - 이스라엘의 모든 지역에서
  - 이스라엘의 모든 영토 안에서
  lexicon: HALOT
  rationale: גְּבוּל은 경계/영토를 함께 담을 수 있어, 전역성을 살리면서도 문자적 이미지가 유지되는 ‘온 경계 안에서’를 택했습니다.
theological_decisions:
- issue: 가해의 목적절을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘우리를 해하려고 꾀한’으로, 단순한 사고가 아니라 적대적 계책을 분명히 드러냈습니다.
  alternative_readings:
  - ‘우리를 위해 계획한’
  - ‘우리에게 생각한’
  rationale: 본문의 דִּמָּה לָנוּ는 중립적 사고가 아니라 해로운 의도를 가진 계책으로 읽히므로, 문맥상 폭력성과 책임을 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: 본문 해석 및 서사적 문맥
- issue: 마지막 결과절의 상태 변화를 어떻게 표현할지
  chosen_reading: ‘설 자리를 잃고 말았습니다’로 결과와 상실감을 함께 표현했습니다.
  alternative_readings:
  - ‘계속 설 수 없게 되었습니다’
  - ‘남아 있을 수 없게 되었습니다’
  rationale: 히브리어의 ‘서다/자리를 잡다’ 이미지를 유지하면서, 이스라엘 안에서의 존속권 상실이라는 서사적 의미를 자연스럽게 드러내기 위한 선택입니다.
  doctrine_reference: 본문 해석 및 문맥
