  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּקַּ֣ח רִצְפָּה֩ בַת אַיָּ֨ה אֶת הַ/שַּׂ֜ק וַ/תַּטֵּ֨/הוּ לָ֤/הּ אֶל הַ/צּוּר֙ מִ/תְּחִלַּ֣ת קָצִ֔יר עַ֛ד נִתַּךְ מַ֥יִם עֲלֵי/הֶ֖ם מִן הַ/שָּׁמָ֑יִם וְ/לֹֽא נָתְנָה֩ ע֨וֹף הַ/שָּׁמַ֜יִם לָ/נ֤וּחַ עֲלֵי/הֶם֙ יוֹמָ֔ם וְ/אֶת חַיַּ֥ת הַ/שָּׂדֶ֖ה לָֽיְלָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/010.yaml
  text: Then Rizpah the daughter of Aiah took sackcloth and spread it out for herself on the rock[a], from the beginning of harvest until water was poured on them from the heavens. And she did not allow the birds of the sky to rest on them by day, nor the wild animals of the field by night.
  footnotes:
  - marker: a
    text: Or 'until rain fell on them from heaven.' The Hebrew more literally says 'until water was poured on them from the heavens.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 리츠바, 아야의 딸이 베옷을 가져다가 그 바위 위에 자신을 위해 펴 놓았습니다[a]. 곡식 거두기를 시작할 때부터 하늘에서 물이 그 위에 쏟아지기까지였습니다. 그녀는 낮에는 하늘의 새들이 그 위에 내려앉지 못하게 하고, 밤에는 들의 들짐승들도 그러지 못하게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하늘에서 비가 그들 위에 내리기까지.” 히브리어는 더 문자적으로 “하늘에서 물이 그 위에 쏟아지기까지”라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׂק
  english_pob_choice: sackcloth
  chosen_korean: 베옷
  alternatives_korean:
  - 삼베
  - 굵은 베
  lexicon: HALOT
  rationale: 여기서는 장례와 애도의 표지인 거친 천을 가리키므로, 한국어 성경에서 널리 통하는 ‘베옷’이 의미와 관용을 함께 살립니다.
- source_word: וַתַּטֵּהוּ לָהּ אֶל הַצּוּר
  english_pob_choice: spread it out for herself on the rock
  chosen_korean: 그 바위 위에 자신을 위해 펴 놓았습니다
  alternatives_korean:
  - 그 바위에 자신을 위해 펼쳤습니다
  - 그 바위 곁에 자신을 위해 늘어놓았습니다
  lexicon: HALOT
  rationale: נטה는 천을 ‘펴다/늘이다’의 뜻이므로, ‘펴 놓다’가 동작을 자연스럽게 살리며 לָהּ의 이익격도 ‘자신을 위해’로 반영합니다.
- source_word: מִתְּחִלַּת קָצִיר
  english_pob_choice: from the beginning of harvest
  chosen_korean: 곡식 거두기를 시작할 때부터
  alternatives_korean:
  - 추수의 시작부터
  - 수확이 시작될 때부터
  lexicon: HALOT
  rationale: 본문은 단지 ‘수확의 시작’만 말하므로, 특정 작물명을 덧붙이지 않고 현대 한국어에서 자연스러운 ‘곡식 거두기’로 옮겼습니다.
- source_word: עַד נִתַּךְ מַיִם עֲלֵיהֶם מִן הַשָּׁמַיִם
  english_pob_choice: until water was poured on them from the heavens
  chosen_korean: 하늘에서 물이 그 위에 쏟아지기까지였습니다
  alternatives_korean:
  - 하늘에서 비가 그 위에 내리기까지였습니다
  - 하늘에서 물이 그들 위로 쏟아질 때까지였습니다
  lexicon: HALOT
  rationale: נתך의 핵심은 ‘붓다/쏟아지다’이므로 이를 살렸고, POB처럼 ‘비’로 바로 좁히지 않고 ‘물’을 유지해 본문의 직설적 이미지를 보존했습니다.
- source_word: עוֹף הַשָּׁמַיִם
  english_pob_choice: the birds of the sky
  chosen_korean: 하늘의 새들
  alternatives_korean:
  - 공중의 새들
  - 하늘의 새
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 가장 자연스럽게 옮기면서도 ‘하늘’의 상향 이미지를 유지했습니다.
- source_word: חַיַּת הַשָּׂדֶה
  english_pob_choice: the wild animals of the field
  chosen_korean: 들의 들짐승들
  alternatives_korean:
  - 들의 야생 동물들
  - 들의 짐승들
  lexicon: HALOT
  rationale: 구약적 관용구의 자연스러운 한국어 대응으로 ‘들짐승’이 적합하며, מקבילה의 반복을 살리기 위해 ‘들’도 유지했습니다.
theological_decisions:
- issue: ‘물’과 ‘비’의 관계
  chosen_reading: 본문의 히브리어는 ‘비가 내렸다’보다 더 문자적으로 ‘하늘에서 물이 쏟아졌다’고 말하므로, 본문 본연의 표현을 유지했습니다.
  alternative_readings:
  - ‘비가 내리기까지’로 자연화하는 번역
  rationale: 이 절은 장례적 경계가 끝나는 시점을 자연현상으로 표시하지만, 히브리어는 해석을 넓게 열어 둡니다. 따라서 본문이 직접 말하는 수준을 넘지 않았습니다.
  doctrine_reference: 본문 충실성 / 원문 이미지 보존
