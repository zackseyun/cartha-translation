base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/017.yaml
  text: But Abishai son of Zeruiah came to his aid[a], struck the Philistine, and killed him. Then David’s men swore to him, saying, “You must not go out with us to battle any longer, lest you extinguish the lamp of Israel.”
  footnotes:
  - marker: a
    text: Or “the light of Israel.” The Hebrew reads “lamp,” a metaphor for David’s vital role in the life and stability of the nation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 스루야의 아들 아비새가 그를 도와 블레셋 사람을 쳐서 죽였습니다. 그러자 다윗의 사람들이 그에게 맹세하여 말했습니다. “당신은 이제 더 이상 우리와 함께 전쟁에 나가지 마십시오. 그렇게 하여 이스라엘의 등불을 끄는 일이 없게 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘의 빛.” 히브리어는 문자적으로 “등불”이라고 하며, 다윗이 민족의 삶과 안정에서 맡는 핵심적 역할을 비유합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזָר לוֹ
  english_pob_choice: came to his aid
  chosen_korean: 그를 도와서
  alternatives_korean:
  - 그를 도왔고
  - 그를 구해 주어
  lexicon: HALOT
  rationale: עזר는 기본적으로 ‘돕다’이므로, 전투 장면의 긴박함을 해치지 않으면서도 자연스러운 한국어로 ‘그를 도와서’라고 옮겼습니다.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי
  english_pob_choice: struck the Philistine
  chosen_korean: 블레셋 사람을 쳐서
  alternatives_korean:
  - 블레셋 사람을 쳤고
  - 블레셋 사람을 공격하여
  lexicon: HALOT
  rationale: נכה는 ‘치다/때리다’의 뜻이 기본이므로, 이어지는 ‘죽였습니다’와 중복을 피하면서도 원문의 폭력적 행위를 유지하도록 ‘쳐서’로 옮겼습니다.
- source_word: וַיְמִיתֵהוּ
  english_pob_choice: and killed him
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 죽이셨습니다
  - 그를 죽였습니다
  lexicon: HALOT
  rationale: מות 히필은 ‘죽게 하다’이므로, 현대 문체에 맞게 직접적이고 분명한 ‘죽였습니다’를 사용했습니다.
- source_word: נֵר יִשְׂרָאֵל
  english_pob_choice: the lamp of Israel
  chosen_korean: 이스라엘의 등불
  alternatives_korean:
  - 이스라엘의 램프
  - 이스라엘의 빛
  lexicon: HALOT
  rationale: נֵר는 문자적으로 ‘등불’이므로, 메타포를 풀어쓴 ‘빛’보다 원문 이미지를 살리는 ‘등불’을 택했습니다.
theological_decisions:
- issue: 다윗을 ‘이스라엘의 등불’로 부르는 은유의 보존
  chosen_reading: 주석 없이 본문에서 ‘이스라엘의 등불’을 그대로 유지했습니다.
  alternative_readings:
  - 이스라엘의 빛
  - 이스라엘의 희망
  rationale: 원문은 다윗의 왕적·공동체적 중요성을 구체적 이미지로 표현하므로, 해석을 앞세운 추상어보다 은유를 보존하는 편이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
