  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּתְּנֵ֞/ם בְּ/יַ֣ד הַ/גִּבְעֹנִ֗ים וַ/יֹּקִיעֻ֤/ם בָּ/הָר֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יִּפְּל֥וּ שבעתים יָ֑חַד ו/הם הֻמְת֜וּ בִּ/ימֵ֤י קָצִיר֙ בָּ/רִ֣אשֹׁנִ֔ים תחלת קְצִ֥יר שְׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/009.yaml
  text: He gave them into the hand of the Gibeonites[a], and they hanged them on the mountain before Yahweh, and the seven of them fell together. They were put to death in the first days of harvest, at the beginning of the barley harvest.
  footnotes:
  - marker: a
    text: Or, 'they impaled them' or 'they exposed them publicly.' The Hebrew verb can refer more broadly to hanging up bodies in public display, not necessarily to hanging in the later narrow sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그들을 기브온 사람들의 손에 넘기셨고[a], 그들은 그들을 산 위에서 야훼 앞에 매달았습니다. 그리고 그 일곱 사람은 함께 쓰러졌습니다. 그들은 추수의 첫 날들, 곧 보리 추수의 시작에 죽임을 당했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 꿰뚫어 세웠다’, ‘그들을 공개적으로 노출시켰다’. 히브리어 동사는 시신을 공공장소에 드러내는 더 넓은 의미도 가질 수 있으며, 반드시 후대의 좁은 의미의 ‘매달다’만을 뜻하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵם בְּיַד
  english_pob_choice: He gave them into the hand of
  chosen_korean: 그는 그들을 ... 손에 넘기셨고
  alternatives_korean:
  - 그는 그들을 ... 손에 주셨고
  - 그는 그들을 ... 손에 넘겨주셨고
  lexicon: HALOT
  rationale: נתן + בְּיַד는 단순한 ‘주다’보다 권한·통제 아래로 넘기는 법정적 인계를 뜻하므로, 한국어도 ‘넘기다’로 그 뉘앙스를 살렸습니다.
- source_word: הַגִּבְעֹנִים
  english_pob_choice: the Gibeonites
  chosen_korean: 기브온 사람들
  alternatives_korean:
  - 기브온 사람들
  - 기브온인
  lexicon: 고유명사 관행
  rationale: 지명 기브온에서 온 집단을 자연스러운 한국어로 옮겨 ‘기브온 사람들’로 했습니다.
- source_word: וַיֹּקִיעֻם
  english_pob_choice: they hanged them
  chosen_korean: 그들은 그들을 산 위에서 ... 매달았습니다
  alternatives_korean:
  - 그들은 그들을 산 위에서 달아매었습니다
  - 그들은 그들을 산 위에서 매달아 놓았습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 ‘매달다’보다 공개 처형/노출의 의미 범위를 가질 수 있어, 본문에는 가장 자연스러운 동사 ‘매달았습니다’를 쓰고 그 공개적 처형 성격은 문맥으로 살렸습니다.
- source_word: שבעתים יָחַד
  english_pob_choice: and the seven of them fell together
  chosen_korean: 그 일곱 사람은 함께 쓰러졌습니다
  alternatives_korean:
  - 그 일곱은 함께 쓰러졌습니다
  - 그 일곱 사람은 한꺼번에 쓰러졌습니다
  lexicon: 문맥 및 수사
  rationale: 히브리어의 숫자표현과 יחד의 결합은 일곱 사람의 동시적 죽음을 가리키므로, 한국어에서는 과도한 직역보다 결과를 분명히 드러내는 ‘함께 쓰러졌습니다’로 옮겼습니다.
- source_word: בִּימֵי קָצִיר בָּרִאשֹׁנִים / תְּחִלַּת קְצִיר שְׂעֹרִים
  english_pob_choice: in the first days of harvest, at the beginning of the barley harvest
  chosen_korean: 추수의 첫 날들, 곧 보리 추수의 시작
  alternatives_korean:
  - 추수의 처음 며칠, 곧 보리 추수의 시작
  - 추수의 첫 무렵, 곧 보리 추수의 시작
  lexicon: HALOT
  rationale: 두 시간표현을 나란히 살려, 사건이 보리 추수기의 초입에 일어났음을 현대 한국어로 분명하게 전달했습니다.
theological_decisions:
- issue: 야훼 앞에서의 공개 처형 의미
  chosen_reading: ‘야훼 앞에’는 단순한 장소 표시가 아니라 언약적·사법적 공개성을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘야훼 앞에서’만의 일반적 장소 의미
  - 종교적 의식 행위로 완화하는 해석
  rationale: 본문은 처형이 야훼의 임재 앞에서, 곧 공동체적·언약적 책임 아래 이루어졌음을 보여 주므로 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 구약의 공적 책임과 언약적 재판의 표지
- issue: ‘매달았습니다’의 처형 방식 불확정성
  chosen_reading: 본문에는 ‘매달았습니다’를 두고, 정확한 방식의 세부는 본문이 허용하는 범위 안에서만 남겼습니다.
  alternative_readings:
  - ‘그들을 못 박아 세웠습니다’
  - ‘그들을 노출시켰습니다’
  rationale: 히브리어 동사 יקע는 ‘매달다/꿰뚫어 세우다/공개적으로 드러내다’까지 포괄할 수 있어, 한 가지 세부 방식으로 과도하게 특정하지 않았습니다.
  doctrine_reference: 본문의 어휘적 긴장 보존
