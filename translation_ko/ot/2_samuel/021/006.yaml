source:
  edition: WLC
  text: ינתן לָ֜/נוּ שִׁבְעָ֤ה אֲנָשִׁים֙ מִ/בָּנָ֔י/ו וְ/הוֹקַֽעֲנוּ/ם֙ לַֽ/יהוָ֔ה בְּ/גִבְעַ֥ת שָׁא֖וּל בְּחִ֣יר יְהוָ֑ה וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ אֲנִ֥י אֶתֵּֽן־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/006.yaml
  text: Let seven men from his sons be given to us[a], and we will impale them before Yahweh at Gibeah of Saul, the chosen of Yahweh.” And the king said, “I will give them.”
  footnotes:
  - marker: a
    text: Or 'we will impale them' or 'we will expose them.' The Hebrew verb refers to a public execution or display, and the exact method is debated.
    reason: lexical_alternative
translation:
  language: ko
  text: “그의 아들들 가운데서 일곱 사람을 우리에게 주어, 우리가 그들을 야훼 앞에서 사울의 기브아에서 달 것입니다. 그는 야훼께서 택하신 이입니다.” 왕이 말했습니다. “내가 그들을 주겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리가 그들을 달 것입니다’의 다른 해석으로, 히브리어 동사는 공개 처형이나 전시를 가리킬 수 있어 정확한 방법은 논란이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹקַעֲנוּם
  english_pob_choice: we will impale them
  chosen_korean: 우리가 그들을 달 것입니다
  alternatives_korean:
  - 우리가 그들을 매달 것입니다
  - 우리가 그들을 기둥에 달 것입니다
  lexicon: HALOT
  rationale: 동사 יקע 계열은 공개 처형 또는 전시를 가리키므로, 한국어에서는 직역적이면서도 방법을 특정하지 않는 ‘달다’가 본문의 공개 처형 뉘앙스를 가장 잘 보존합니다.
- source_word: לַיהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼께
  - 야훼를 위하여
  lexicon: HALOT
  rationale: 사형 집행의 장소적·증언적 성격을 살려, 희생 제물처럼 읽히는 ‘~께/위하여’보다 ‘앞에서’가 더 적절합니다.
- source_word: בְּחִיר יְהוָה
  english_pob_choice: the chosen of Yahweh
  chosen_korean: 야훼께서 택하신 이
  alternatives_korean:
  - 야훼의 택하심을 받은 이
  - 야훼의 선택을 받은 이
  lexicon: HALOT
  rationale: 사울을 설명하는 관형적 명사구로, ‘택하신 이’가 히브리어의 명사적 압축을 가장 자연스럽게 옮깁니다.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ אֲנִי אֶתֵּן
  english_pob_choice: And the king said, “I will give them.”
  chosen_korean: 왕이 말했습니다. “내가 그들을 주겠습니다.”
  alternatives_korean:
  - 왕이 말했습니다. “내가 주겠습니다.”
  - 왕이 말했습니다. “내가 그들을 넘기겠습니다.”
  lexicon: HALOT
  rationale: 앞 절의 요청된 대상을 문맥상 보충하여 자연스럽게 옮기되, ‘넘기다’보다 원문의 נתן을 직접 반영하는 ‘주다’를 유지합니다.
theological_decisions:
- issue: יהוה를 전통적 ‘여호와’가 아니라 ‘야훼’로 표기하는 문제
  chosen_reading: 본문 전체에서 고유명사로서 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 표준에 따라 신명기적 고유명사성을 보존하고, 한국 교회 전통의 대체 칭호로 평준화하지 않습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: לַיהוָה의 관계를 제사적 헌납으로 읽을지 여부
  chosen_reading: ‘야훼 앞에서’로 옮겨 사법적·공적 집행의 성격을 살렸습니다.
  alternative_readings:
  - 야훼께
  - 야훼를 위하여
  rationale: 문맥은 제사 행위가 아니라 속죄/보복의 공적 처형이므로, 제의적 의미를 강화하는 번역은 피했습니다.
  doctrine_reference: Translation philosophy §3; contested ל + divine name
