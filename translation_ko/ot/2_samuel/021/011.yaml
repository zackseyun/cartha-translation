source:
  edition: WLC
  text: וַ/יֻּגַּ֖ד לְ/דָוִ֑ד אֵ֧ת אֲשֶׁר עָשְׂתָ֛ה רִצְפָּ֥ה בַת אַיָּ֖ה פִּלֶ֥גֶשׁ שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/011.yaml
  text: And it was reported to David what Rizpah daughter of Aiah, Saul’s concubine, had done.
translation:
  language: ko
  text: 다윗에게 사람들이 알렸는데, 그것은 야이아의 딸이며 사울의 첩인 리스바가 한 일이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  english_pob_choice: it was reported
  chosen_korean: 사람들이 알렸는데
  alternatives_korean:
  - 보고되었습니다
  - 전해졌는데
  - 알려졌는데
  lexicon: HALOT
  rationale: 수동형 נגד의 보고/전달 의미를 살리되, 한국어에서는 자연스러운 수동 표현보다 ‘사람들이 알렸다’가 사건의 전달을 분명하게 드러냅니다.
- source_word: לְדָוִד
  english_pob_choice: to David
  chosen_korean: 다윗에게
  alternatives_korean:
  - 다윗에게로
  - 다윗에게 전해져
  lexicon: HALOT
  rationale: ל 전치사의 간접목적어를 한국어 조사 ‘-에게’로 직접 옮겨 보고의 수신자를 분명히 했습니다.
- source_word: בַת אַיָּה פִּלֶגֶשׁ שָׁאוּל
  english_pob_choice: Saul’s concubine, daughter of Aiah
  chosen_korean: 야이아의 딸이며 사울의 첩인 리스바
  alternatives_korean:
  - 야이아의 딸이자 사울의 첩인 리스바
  - 야이아의 딸 리스바, 사울의 첩
  lexicon: HALOT
  rationale: פעלגש는 완곡하게 누그러뜨리지 않고 ‘첩’으로 직역해 신분 관계를 보존했고, בַת אַיָּה는 인물 식별의 부가 정보로 처리했습니다.
- source_word: עָשְׂתָה
  english_pob_choice: had done
  chosen_korean: 한 일이었습니다
  alternatives_korean:
  - 행한 일이었습니다
  - 했던 일이었습니다
  lexicon: HALOT
  rationale: 완료된 행위를 과거보다 앞선 서술로 받아들여 ‘한 일’로 옮겨, 보고 내용의 핵심 행위를 간결하게 제시했습니다.
theological_decisions:
- issue: פִּלֶגֶשׁ의 사회적 지위 표현
  chosen_reading: ‘첩’으로 옮겨 본문의 가부장적·궁정적 관계를 그대로 드러냅니다.
  alternative_readings:
  - 부인
  - 동거인
  - 후궁
  rationale: 본문은 리스바의 사회적 지위를 애매하게 만들지 않고 사울과의 종속적 관계를 드러내므로, 전통적 교회어보다 직접적인 표현이 원문에 더 가깝습니다.
  doctrine_reference: 역사서 서술의 사회사적 정밀성
