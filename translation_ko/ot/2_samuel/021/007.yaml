  text: וַ/יַּחְמֹ֣ל הַ/מֶּ֔לֶךְ עַל מְפִי בֹ֖שֶׁת בֶּן יְהוֹנָתָ֣ן בֶּן שָׁא֑וּל עַל שְׁבֻעַ֤ת יְהוָה֙ אֲשֶׁ֣ר בֵּֽינֹתָ֔/ם בֵּ֣ין דָּוִ֔ד וּ/בֵ֖ין יְהוֹנָתָ֥ן בֶּן שָׁאֽוּל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/007.yaml
  text: But the king spared Mephibosheth son of Jonathan[a], son of Saul, because of the oath of Yahweh that was between them, between David and Jonathan son of Saul.
  footnotes:
  - marker: a
    text: Or 'the LORD's oath'; that is, an oath sworn in the LORD's name between David and Jonathan.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 왕은 요나단의 아들, 사울의 아들 므피보셋을 야훼 앞에서 그들 사이에 있었던 서약 때문에 살려 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼 앞에서’는 야훼를 증인으로 모신 맹세라는 뜻을 드러내기 위한 풀어쓴 번역입니다.
    reason: theological_note
lexical_decisions:
- source_word: וַיַּחְמֹל
  english_pob_choice: spared
  chosen_korean: 살려 두었습니다
  alternatives_korean:
  - 용서했습니다
  - 긍휼히 여겼습니다
  - 사면했습니다
  lexicon: HALOT
  rationale: 이 동사는 여기서 죽이거나 넘겨주지 않고 보존하는 구체적 행위를 가리키므로, 현대 한국어에서는 ‘살려 두었습니다’가 가장 직접적으로 대응합니다.
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕은
  alternatives_korean:
  - 그 왕은
  - 임금은
  lexicon: HALOT
  rationale: 히브리어의 정관사 있는 칭호를 자연스럽게 옮기되, 본문이 다윗을 가리키는 점은 문맥으로 유지했습니다.
- source_word: בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  english_pob_choice: son of Jonathan, son of Saul
  chosen_korean: 요나단의 아들, 사울의 아들
  alternatives_korean:
  - 요나단의 아들이자 사울의 손자
  - 사울의 손자인 요나단의 아들
  lexicon: HALOT
  rationale: 반복되는 ‘아들’ 구조를 그대로 살려 계보 관계를 투명하게 보이도록 했습니다.
- source_word: שְׁבֻעַת יְהוָה
  english_pob_choice: the oath of Yahweh
  chosen_korean: 야훼 앞에서 그들 사이에 있었던 서약
  alternatives_korean:
  - 야훼의 서약
  - 야훼의 이름으로 한 서약
  - 야훼의 맹세
  lexicon: HALOT
  rationale: 이 표현은 야훼가 직접 맹세했다기보다 야훼를 증인으로 삼아 한 맹세를 가리킬 가능성이 높으므로, 그 긴장을 살려 ‘야훼 앞에서’와 ‘그들 사이에 있었던 서약’으로 옮겼습니다.
theological_decisions:
- issue: שְׁבֻעַת יְהוָה의 신학적 해석
  chosen_reading: 다윗과 요나단이 야훼를 증인으로 두고 맺은 언약적 서약
  alternative_readings:
  - 야훼 자신이 주신 맹세
  - 단순한 인간적 약속
  rationale: 본문의 문법은 소유격처럼 보이지만, 서사 맥락상 야훼의 이름 아래 맺은 맹세로 읽는 것이 가장 자연스럽습니다. 번역은 이를 단정적으로 풀지 않고 원문의 긴장을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it'
