  text: But the king spared Mephibosheth son of Jonathan[a], son of Saul, because of the oath of Yahweh that was between them, between David and Jonathan son of Saul.
  footnotes:
  - marker: a
    text: Or 'the LORD's oath'; that is, an oath sworn in the LORD's name between David and Jonathan.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 왕은 사울의 아들 요나단의 아들 므비보셋을 살려 두었습니다. 이는 다윗과 사울의 아들 요나단 사이에 있었던 야훼의 맹세 때문이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야훼의 맹세’입니다. 문맥상 이는 다윗과 요나단이 야훼의 이름으로 한 맹세를 가리킬 수 있습니다.
    reason: lexical_alternative
