  - 단순한 인간적 약속
  rationale: 본문의 문법은 소유격처럼 보이지만, 서사 맥락상 야훼의 이름 아래 맺은 맹세로 읽는 것이 가장 자연스럽습니다. 번역은 이를 단정적으로 풀지 않고 원문의 긴장을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it'
