base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/001.yaml
  text: Now there was a famine in the days of David for three years[a], year after year. And David sought the face of Yahweh, and Yahweh said, “It is because of Saul and his bloodguilty house[b], because he put the Gibeonites to death.”
  footnotes:
  - marker: a
    text: Or 'sought the LORD' or 'inquired of the LORD'; literally, 'sought the face of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'house of bloods,' an idiom for a household guilty of bloodshed.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시대에 삼 년 동안, 해마다 기근이 있었습니다. 다윗이 야훼의 얼굴을 찾자, 야훼께서 말씀하셨습니다. 「그것은 사울과 그의 피로 물든 집안 때문입니다. 그가 기브온 사람들을 죽였기 때문입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼의 얼굴을 찾다’는 ‘야훼께 묻다’의 뜻으로도 옮길 수 있는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘피로 물든 집안’은 히브리어 ‘피들의 집’을 풀어 옮긴 것으로, 단순한 폭력보다 혈죄 책임을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  english_pob_choice: famine
  chosen_korean: 기근
  alternatives_korean:
  - 굶주림
  - 식량 부족
  lexicon: HALOT
  rationale: 본문은 개인적 허기보다 온 땅에 미친 심각한 식량 재난을 가리키므로, 한국어에서도 '기근'이 가장 정확합니다.
- source_word: שָׁלֹשׁ שָׁנִים שָׁנָה אַחֲרֵי שָׁנָה
  english_pob_choice: for three years, year after year
  chosen_korean: 삼 년 동안, 해마다
  alternatives_korean:
  - 삼 년 연속으로
  - 삼 년 동안, 해를 거듭하여
  lexicon: HALOT
  rationale: 기간의 길이와 반복성을 함께 살리기 위해 '삼 년 동안'과 '해마다'를 분리해 옮겼습니다.
- source_word: וַיְבַקֵּשׁ ... אֶת פְּנֵי יְהוָה
  english_pob_choice: sought the face of Yahweh
  chosen_korean: 야훼의 얼굴을 찾자
  alternatives_korean:
  - 야훼를 찾자
  - 야훼께 물으려 하자
  lexicon: HALOT
  rationale: 히브리어 관용구인 '얼굴을 찾다'를 보존해 관계적·언약적 뉘앙스를 유지했습니다.
- source_word: בֵּית הַדָּמִים
  english_pob_choice: bloodguilty house
  chosen_korean: 피로 물든 집안
  alternatives_korean:
  - 피의 집안
  - 피 흘림의 집안
  lexicon: HALOT
  rationale: 직역적인 '피들의 집'보다, 혈흔과 책임을 함께 드러내는 표현으로 사울의 가문이 지닌 피의 책임을 전달합니다.
- source_word: הַגִּבְעֹנִים
  english_pob_choice: the Gibeonites
  chosen_korean: 기브온 사람들
  alternatives_korean:
  - 기브온 사람들
  - 기브온 사람들
  lexicon: HALOT
  rationale: 민족/집단 명칭을 한국어 성경 문맥에 자연스럽게 맞춰 '사람들'로 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접 응답을 인용문 안에서 어떤 어조로 옮길지
  chosen_reading: 보도문은 합쇼체를 유지하고, 하나님의 직접 말씀은 평서형으로 두어 원문의 진술성을 살렸습니다.
  alternative_readings:
  - 인용문 안에서도 더욱 공손한 종결형을 쓰는 방식
  - 전체를 같은 높임말로 평준화하는 방식
  rationale: 본문은 하나님이 원인과 책임을 선언하는 신적 판결의 성격을 가지므로, 한국어에서도 설명적이고 단정적인 어조가 적절합니다.
  doctrine_reference: Narrative divine speech register in Hebrew Bible
- issue: 야훼를 '여호와' 대신 '야훼'로 표기할지
  chosen_reading: 본문과 기존 프로젝트 기준에 따라 '야훼'를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 번역은 신명기계 전승의 고유명사를 보존하려는 프로젝트 방침을 따릅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
