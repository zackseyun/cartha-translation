theological_decisions:
- issue: 야훼의 직접 응답을 인용문 안에서 어떤 어조로 옮길지
  chosen_reading: 보도문은 합쇼체를 유지하고, 하나님의 직접 말씀은 평서형으로 두어 원문의 진술성을 살렸습니다.
  alternative_readings:
  - 인용문 안에서도 더욱 공손한 종결형을 쓰는 방식
  - 전체를 같은 높임말로 평준화하는 방식
  rationale: 본문은 하나님이 원인과 책임을 선언하는 신적 판결의 성격을 가지므로, 한국어에서도 설명적이고 단정적인 어조가 적절합니다.
  doctrine_reference: Narrative divine speech register in Hebrew Bible
- issue: 야훼를 '여호와' 대신 '야훼'로 표기할지
  chosen_reading: 본문과 기존 프로젝트 기준에 따라 '야훼'를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 번역은 신명기계 전승의 고유명사를 보존하려는 프로젝트 방침을 따릅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
