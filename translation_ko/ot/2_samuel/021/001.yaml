base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/001.yaml
  text: Now there was a famine in the days of David for three years[a], year after year. And David sought the face of Yahweh, and Yahweh said, “It is because of Saul and his bloodguilty house[b], because he put the Gibeonites to death.”
  footnotes:
  - marker: a
    text: Or 'sought the LORD' or 'inquired of the LORD'; literally, 'sought the face of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'house of bloods,' an idiom for a household guilty of bloodshed.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗 시대에 삼 년 동안, 해를 거듭하여 기근이 들었습니다. 다윗은 야훼의 얼굴을 찾았습니다[a]. 야훼께서 말씀하셨습니다. “사울과 피 흘림의 죄를 지은 그의 집안 때문입니다[b]. 그가 기브온 사람들을 죽였기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼의 얼굴을 찾다’는 문자적으로 옮긴 표현이며, ‘야훼를 찾다’ 또는 ‘야훼께 묻다’로도 옮길 수 있는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘피들의 집’입니다. 피 흘림에 대한 죄책, 곧 혈죄가 있는 집안이라는 뜻의 관용 표현입니다.
    reason: lexical_alternative
