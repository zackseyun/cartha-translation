source:
  edition: WLC
  text: וַ/יֹּ֧אמְרוּ ל֣/וֹ הַ/גִּבְעֹנִ֗ים אֵֽין ל/י כֶּ֤סֶף וְ/זָהָב֙ עִם שָׁא֣וּל וְ/עִם בֵּית֔/וֹ וְ/אֵֽין לָ֥/נוּ אִ֖ישׁ לְ/הָמִ֣ית בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֛אמֶר מָֽה אַתֶּ֥ם אֹמְרִ֖ים אֶעֱשֶׂ֥ה לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/004.yaml
  text: The Gibeonites said to him[a], “We have no claim for silver or gold against Saul or against his house, and it is not for us to put any man in Israel to death.” Then he said[b], “What do you say that I should do for you?”
  footnotes:
  - marker: a
    text: Or, “It is not a matter of silver or gold between us and Saul and his house.” The Hebrew expression is idiomatic and likely refers to monetary compensation.
    reason: lexical_alternative
  - marker: b
    text: Or, “we have no right to put any man in Israel to death.”
    reason: lexical_alternative
translation:
  language: ko
  text: 기브온 사람들이 그에게 말했습니다. 「우리는 사울과 그의 집에 대하여 은이나 금에 대한 요구가 없습니다. 또한 이스라엘에서 어떤 사람도 죽일 권한이 우리에게는 없습니다.」 그러자 그가 말했습니다. 「내가 너희를 위해 무엇을 해 주기를 너희가 말하겠습니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “사울과 그의 집 사이에 은이나 금 문제가 없다”는 뜻의 관용구입니다. 여기서는 보상 청구를 거절하는 의미를 드러냈습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “이스라엘에서 어떤 사람도 죽일 권한이 없다”는 뜻으로 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין לִי כֶּסֶף וְזָהָב עִם שָׁאוּל וְעִם בֵּיתוֹ
  english_pob_choice: We have no claim for silver or gold against Saul or against his house
  chosen_korean: 우리는 사울과 그의 집에 대하여 은이나 금에 대한 요구가 없습니다
  alternatives_korean:
  - 사울과 그의 집과 함께 은이나 금이 없습니다
  - 사울과 그의 집 사이에 은이나 금 문제가 없습니다
  lexicon: HALOT
  rationale: 히브리어는 단순 소유가 아니라 보상이나 청구를 거절하는 관용구이므로, 한국어도 ‘요구가 없습니다’로 권리·청구의 뜻을 살렸습니다.
- source_word: עִם
  english_pob_choice: against
  chosen_korean: 사울과 그의 집에 대하여
  alternatives_korean:
  - 사울과 그의 집과
  - 사울과 그의 집 사이에 대하여
  lexicon: HALOT
  rationale: 문맥상 עִם은 단순한 ‘함께’가 아니라 분쟁의 상대를 가리키므로, 한국어는 ‘대하여’로 관계의 방향을 드러냈습니다.
- source_word: וְאֵין לָנוּ אִישׁ לְהָמִית בְּיִשְׂרָאֵל
  english_pob_choice: and it is not for us to put any man in Israel to death
  chosen_korean: 또한 이스라엘에서 어떤 사람도 죽일 권한이 우리에게는 없습니다
  alternatives_korean:
  - 또한 이스라엘에서 어떤 사람도 죽일 사람이 우리에게는 없습니다
  - 또한 이스라엘에서 어떤 사람도 죽일 일이 우리에게는 없습니다
  lexicon: HALOT
  rationale: 히브리어는 희생자를 찾는 말이 아니라 처형할 권한의 부재를 뜻하므로, ‘권한이 없습니다’로 의미를 명확히 했습니다.
- source_word: מָה אַתֶּם אֹמְרִים אֶעֱשֶׂה לָכֶם
  english_pob_choice: What do you say that I should do for you?
  chosen_korean: 내가 너희를 위해 무엇을 해 주기를 너희가 말하겠습니까?
  alternatives_korean:
  - 너희가 내가 너희를 위해 무엇을 해야 한다고 말하겠습니까?
  - 너희는 내가 너희를 위해 무엇을 하기를 원합니까?
  lexicon: HALOT
  rationale: 압축된 히브리어 질문을 자연스러운 한국어로 풀어, 요청할 조건을 물어보는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 사울의 집에 대한 배상 요구 포기와 처형 권한 부정의 대비
  chosen_reading: 기브온 사람들은 금전적 보상 대신, 자신들에게는 이스라엘 사람을 죽일 권한이 없다고 분명히 말합니다.
  alternative_readings:
  - 단순히 보복 의사가 없다고 읽을 수 있습니다
  - 법적 책임 회피 표현으로만 볼 수 있습니다
  rationale: 본문은 보상 거절과 생명 처분 권한 부재를 나란히 두어, 보복이 아니라 정당한 처분 문제를 강조합니다.
  doctrine_reference: 구약 서술의 공적 책임과 응보 구조
