  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְבְּר֣וּ אֶת עַצְמוֹת שָׁא֣וּל וִ/יהוֹנָֽתָן בְּ֠נ/וֹ בְּ/אֶ֨רֶץ בִּנְיָמִ֜ן בְּ/צֵלָ֗ע בְּ/קֶ֨בֶר֙ קִ֣ישׁ אָבִ֔י/ו וַֽ/יַּעֲשׂ֔וּ כֹּ֥ל אֲשֶׁר צִוָּ֖ה הַ/מֶּ֑לֶךְ וַ/יֵּעָתֵ֧ר אֱלֹהִ֛ים לָ/אָ֖רֶץ אַֽחֲרֵי כֵֽן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/014.yaml
  text: They buried the bones of Saul and of Jonathan his son in the land of Benjamin[a], in Zela, in the tomb of Kish his father. They did all that the king had commanded, and after that God responded to the plea for the land.
  footnotes:
  - marker: a
    text: Or, 'God was entreated for the land,' or 'God answered prayer for the land.' The Hebrew verb implies a favorable response to supplication.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 사울과 그의 아들 요나단의 뼈를 베냐민 땅[a] 셀라에 있는 사울의 아버지 기스의 무덤에 장사하였습니다. 그들은 왕이 명령한 모든 것을 행하였고, 그 뒤에 하나님께서 그 땅을 위하여 간구를 들으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘베냐민 지방’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹת
  english_pob_choice: the bones of
  chosen_korean: 뼈를
  alternatives_korean:
  - 유해를
  - 뼈들을
  lexicon: HALOT
  rationale: עַצְמוֹת는 문자적으로 ‘뼈들’이므로, 한국어도 구체성을 살려 ‘뼈를’로 옮겼습니다.
- source_word: בְּאֶרֶץ בִּנְיָמִן
  english_pob_choice: in the land of Benjamin
  chosen_korean: 베냐민 땅
  alternatives_korean:
  - 베냐민 지역
  - 베냐민 בארץ
  lexicon: HALOT
  rationale: 히브리어가 영토적 범위를 분명히 하므로, ‘베냐민 땅’으로 자연스럽게 살렸습니다.
- source_word: בְּצֵלָע
  english_pob_choice: in Zela
  chosen_korean: 세라
  alternatives_korean:
  - 젤라
  - 질라
  lexicon: HALOT
  rationale: 고유 지명은 음역하되, 한국어 표기 관행에 맞춰 ‘세라’로 옮겼습니다.
- source_word: בְּקֶבֶר קִישׁ אָבִיו
  english_pob_choice: in the tomb of Kish his father
  chosen_korean: 기시의 묘에
  alternatives_korean:
  - 기시의 무덤에
  - 그의 아버지 기시의 묘에
  lexicon: HALOT
  rationale: קבר는 문맥상 가족 매장지를 가리키므로 ‘묘’가 자연스럽고, ‘그의 아버지’ 관계는 소유격으로 충분히 드러납니다.
- source_word: וַיֵּעָתֵר אֱלֹהִים לָאָרֶץ
  english_pob_choice: God responded to the plea for the land
  chosen_korean: 하나님이 그 땅을 위해 응답하셨습니다
  alternatives_korean:
  - 하나님이 그 땅의 간구를 들으셨습니다
  - 하나님이 그 땅에 응답하셨습니다
  lexicon: HALOT
  rationale: עתר의 수동/니팔은 간구에 호의적으로 응답하는 뜻을 담으므로, 한국어에서는 ‘응답하셨습니다’로 자연스럽게 살리되, 목적어는 ‘그 땅을 위해’로 맥락을 드러냈습니다.
theological_decisions:
- issue: וַיֵּעָתֵר אֱלֹהִים לָאָרֶץ의 ‘응답’ 성격
  chosen_reading: 하나님이 그 땅을 위해 호의적으로 응답하신 것으로 읽었습니다.
  alternative_readings:
  - 하나님이 그 땅의 기도를 들으신 것으로 읽음
  - 하나님이 그 땅에 대해 진노를 거두신 것으로 읽음
  rationale: 본문은 명시적 ‘기도’ 명사를 쓰지 않지만, 동사 자체가 간구에 대한 호의적 응답을 내포하므로 그 의미를 너무 약화시키지 않도록 했습니다.
  doctrine_reference: HALOT on עתר; maintain semantic force without over-clarifying the implied petition
