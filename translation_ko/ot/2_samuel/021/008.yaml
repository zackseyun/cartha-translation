reference: 2 Samuel 21:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֶת שְׁ֠נֵי בְּנֵ֨י רִצְפָּ֤ה בַת אַיָּה֙ אֲשֶׁ֣ר יָלְדָ֣ה לְ/שָׁא֔וּל אֶת אַרְמֹנִ֖י וְ/אֶת מְפִבֹ֑שֶׁת וְ/אֶת חֲמֵ֗שֶׁת בְּנֵי֙ מִיכַ֣ל בַּת שָׁא֔וּל אֲשֶׁ֥ר יָלְדָ֛ה לְ/עַדְרִיאֵ֥ל בֶּן בַּרְזִלַּ֖י הַ/מְּחֹלָתִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/008.yaml
  text: So the king took the two sons of Rizpah daughter of Aiah[a], whom she had borne to Saul—Armoni and Mephibosheth—and the five sons of Michal daughter of Saul, whom she had borne to Adriel son of Barzillai the Meholathite.
  footnotes:
  - marker: a
    text: Some manuscripts and ancient interpreters have 'Merab' instead of 'Michal'; compare 1 Samuel 18:19, where Adriel is said to have married Merab, Saul's daughter.
    reason: textual_variant
translation:
  language: ko
  text: 그러므로 왕은 아야의 딸 리스바가 사울에게서 낳은 두 아들, 곧 아르모니와 므비보셋과 사울의 딸 미갈이 아드리엘 곧 브실래 사람 메홀랏 사람의 아들에게서 낳은 다섯 아들을 붙잡았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본과 고대 해석자들은 ‘미갈’ 대신 ‘메랍’을 읽습니다. 사무엘상 18:19에서는 아드리엘이 사울의 딸 메랍과 결혼한 것으로 나옵니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: So ... took
  chosen_korean: 붙잡았습니다
  alternatives_korean:
  - 데려갔습니다
  - 가져갔습니다
  lexicon: HALOT
  rationale: 서술 진행을 살리면서, 왕이 이들을 ‘취하여’ 죽음의 처분 대상으로 삼는 문맥을 드러내기 위해 일반적 ‘데려가다’보다 더 강한 ‘붙잡다’를 택했습니다.
- source_word: שְׁנֵי בְּנֵי ... וְאֶת חֲמֵשֶׁת בְּנֵי
  english_pob_choice: the two sons of ... and the five sons of
  chosen_korean: 두 아들 ... 다섯 아들
  alternatives_korean:
  - 두 아들들 ... 다섯 아들들
  - 두 사람의 아들 ... 다섯 사람의 아들
  lexicon: HALOT
  rationale: 히브리어의 수사적 열거를 그대로 살려 ‘두 아들’, ‘다섯 아들’로 간결하게 옮겼습니다.
- source_word: רִצְפָּה בַת אַיָּה / מִיכַל בַּת שָׁאוּל
  english_pob_choice: Rizpah daughter of Aiah / Michal daughter of Saul
  chosen_korean: 아야의 딸 리스바 / 사울의 딸 미갈
  alternatives_korean:
  - 아야의 딸 리스바 / 사울의 딸 미갈
  - 아야의 딸 리스바 / 사울의 딸 미칼
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역을 따랐고, 딸-소속 구문은 소유격보다 직역에 가까운 ‘~의 딸’로 처리했습니다.
- source_word: אֲשֶׁר יָלְדָה לְשָׁאוּל / אֲשֶׁר יָלְדָה לְעַדְרִיאֵל
  english_pob_choice: whom she had borne to Saul / whom she had borne to Adriel
  chosen_korean: 사울에게서 낳은 / 아드리엘에게서 낳은
  alternatives_korean:
  - 사울에게 낳은
  - 사울을 위해 낳은
  - 사울에게서 낳은
  lexicon: HALOT
  rationale: לְ가 붙은 ילד는 출생의 귀속 대상을 표시하므로, 한국어에서는 자연스럽고 관계를 분명히 하는 ‘~에게서 낳은’으로 옮겼습니다.
- source_word: בֶּן בַּרְזִלַּי הַמְּחֹלָתִי
  english_pob_choice: son of Barzillai the Meholathite
  chosen_korean: 브실래 사람 메홀랏 사람의 아들
  alternatives_korean:
  - 메홀랏 사람 브실래의 아들
  - 브실래의 아들 메홀랏 사람
  lexicon: HALOT
  rationale: 히브리어의 고유명사 연결을 보존하기 위해 ‘브실래 사람’과 출신지 형용사 ‘메홀랏 사람’을 함께 살렸습니다. 전통적 한국 교회어보다 원문의 지리·민족 표지를 우선했습니다.
theological_decisions:
- issue: 2 Samuel 21:8의 ‘미갈’ vs. 사무엘상 18:19의 ‘메랍’ 긴장
  chosen_reading: 주본문은 히브리어 마소라 본문에 따라 ‘미갈’로 유지하고, 조화하지 않았습니다.
  alternative_readings:
  - 메랍
  rationale: 번역은 원문 증거를 우선해야 하므로 본문을 임의로 수정하지 않았습니다. 다만 다른 전승이 이 난점을 제기하므로, 별도 주석으로 확인 가능하게 하는 것이 투명성에 맞습니다.
  doctrine_reference: 번역 원칙 §1, §3
