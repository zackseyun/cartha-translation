revisions:
- from: 그러므로 왕은 아야의 딸 리스바가 사울에게서 낳은 두 아들, 곧 아르모니와 므비보셋과 사울의 딸 미갈이 아드리엘 곧 브실래 사람 메홀랏 사람의 아들에게서 낳은 다섯 아들을 붙잡았습니다.[a]
  to: 그러므로 왕은 아야의 딸 리스바가 사울에게 낳은 두 아들, 곧 아르모니와 므비보셋, 그리고 사울의 딸 미갈[a]이 므홀랏 사람 바르실래의 아들 아드리엘에게 낳은 다섯 아들을 데려갔습니다.
  rationale: 마소라 본문의 ‘미갈’을 본문에 그대로 유지하되, 사무엘상 18:19와 관련된 메랍 이문을 각주로 보존했습니다. לקח은 본문이 명시하지 않는 체포의 뉘앙스를 피하여 ‘데려갔습니다’로 옮겼고, ‘므홀랏 사람’이 바르실래를 수식하는 히브리어 계보 구조를 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:37:35Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어 본문은 왕이 두 집단을 ‘취하였다’고 말하며, 바르실래가 ‘므홀랏 사람’이라는 수식어를 받습니다. 초안의 ‘붙잡았습니다’는 לקח보다 지나치게 강한 의미를 더하고, ‘브실래 사람 메홀랏 사람의 아들’은 원문의 인명·출신지 수식을 잘못 연결합니다. 본문 읽기 ‘미갈’은 유지해야 하며, 메랍 이문은 각주로 처리하는 것이 적절합니다.
  naturalness: 수정문은 두 목적어 집단을 명료하게 병렬하고, 긴 계보 수식어를 현대 표준 한국어에서 자연스럽게 처리합니다. ‘데려갔습니다’는 이 문맥에서 중립적이면서도 자연스럽습니다.
  terminology: 인명은 리스바, 아야, 아르모니, 므비보셋, 미갈, 아드리엘, 바르실래로 통일했습니다. הַמְּחֹלָתִי는 바르실래를 수식하도록 ‘므홀랏 사람 바르실래’로 옮겼습니다. 미갈/메랍의 본문상 긴장은 해소하거나 조화시키지 않았습니다.
  issues:
  - severity: medium
    issue: וַיִּקַּח을 ‘붙잡았습니다’로 번역함
    rationale: לקח은 여기서 기본적으로 ‘취하다/데려가다’이며, ‘붙잡다’는 체포·강제성의 의미를 본문보다 강하게 부가합니다.
  - severity: high
    issue: ‘브실래 사람 메홀랏 사람의 아들’이 바르실래와 므홀랏 사람이라는 수식을 잘못 연결함
    rationale: 히브리어는 ‘므홀랏 사람 바르실래의 아들 아드리엘’입니다. 초안은 바르실래를 ‘메홀랏 사람의 아들’과 혼동하게 하며, 인명 음역도 ‘브실래’로 잘못되었습니다.
  - severity: low
    issue: 미갈 이문 각주의 표지가 문장 끝에만 있음
    rationale: 이문은 ‘미갈’이라는 특정 본문어에 관련되므로 해당 이름 바로 뒤에 표지를 두는 편이 독자에게 더 명확합니다.
  revised_text: 그러므로 왕은 아야의 딸 리스바가 사울에게 낳은 두 아들, 곧 아르모니와 므비보셋, 그리고 사울의 딸 미갈[a]이 므홀랏 사람 바르실래의 아들 아드리엘에게 낳은 다섯 아들을 데려갔습니다.
