    reason: textual_variant
  revision_rationale: 마소라 본문의 ‘미갈’을 본문에 그대로 유지하되, 사무엘상 18:19와 관련된 메랍 이문을 각주로 보존했습니다. לקח은 본문이 명시하지 않는 체포의 뉘앙스를 피하여 ‘데려갔습니다’로 옮겼고, ‘므홀랏 사람’이 바르실래를 수식하는 히브리어 계보 구조를 바로잡았습니다.
