  - severity: medium
    issue: 각주 b의 ‘제의적 전제의 뉘앙스’ 표현이 모호하고 어색합니다.
    rationale: ‘전제’는 한국어에서 논증의 premise로도 흔히 쓰입니다. 여기서는 붓는 제의 행위와의 관련성을 말하므로 ‘전제를 드리는 것과 같은 제의적 뉘앙스’라고 해야 뜻이 분명합니다.
