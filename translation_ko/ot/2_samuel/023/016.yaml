reference: 2 Samuel 23:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּבְקְעוּ֩ שְׁלֹ֨שֶׁת הַ/גִּבֹּרִ֜ים בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בֹּ֤אר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑ד וְ/לֹ֤א אָבָה֙ לִ/שְׁתּוֹתָ֔/ם וַ/יַּסֵּ֥ךְ אֹתָ֖/ם לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/016.yaml
  text: Then the three mighty men broke through the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But he was not willing to drink it; instead[b], he poured it out to Yahweh.
  footnotes:
  - marker: a
    text: Or 'he poured them out'; the Hebrew uses a plural suffix, likely referring to the water idiomatically as 'waters.'
    reason: lexical_alternative
  - marker: b
    text: That is, he poured it out as an offering to the LORD, with libation-like force.
    reason: cultural_note
translation:
  language: ko
  text: 그때에 그 세 용사가 블레셋 진영을 뚫고 들어가 베들레헴 성문 곁에 있는 우물에서 물을 길어, 그것을 가지고 다윗에게 왔습니다. 그러나 다윗은 그것을 마시려 하지 않았고, 오히려 야훼께 부었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 물을 가리키는 복수형 어미를 사용합니다. 한국어 본문은 자연스럽게 단수로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 야훼께 예물처럼 부은 것입니다. 제의적 전제의 뉘앙스가 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  english_pob_choice: broke through
  chosen_korean: 뚫고 들어가
  alternatives_korean:
  - 돌파하여
  - 들어갔습니다
  lexicon: HALOT
  rationale: 전투 맥락에서 적진을 ‘돌파’했다는 강한 동작을 살리기 위해, 자연스러운 한국어로 ‘뚫고 들어가’로 옮겼습니다.
- source_word: שְׁלֹשֶׁת הַגִּבֹּרִים
  english_pob_choice: the three mighty men
  chosen_korean: 그 세 용사
  alternatives_korean:
  - 그 세 전사
  - 그 세 장사
  lexicon: HALOT
  rationale: 다윗 서사에서 גִּבּוֹרִים은 정예 전사들을 가리키는 관용적 호칭이므로, ‘용사’로 옮겨 위상을 유지했습니다.
- source_word: וַיַּסֵּךְ אֹתָם
  english_pob_choice: he poured it out
  chosen_korean: 부었습니다
  alternatives_korean:
  - 쏟아 부었습니다
  - 전제물로 부었습니다
  lexicon: HALOT
  rationale: 동사의 핵심 동작은 ‘붓다/쏟다’이지만, 본문에서 이미 ‘야훼께’가 붙어 있어 제의적 의미를 노출하되 한국어 본문은 과도하게 해석하지 않도록 간결하게 처리했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주께
  - 여호와께
  lexicon: Project default
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨, 제의적 방향성까지 분명히 드러냈습니다.
theological_decisions:
- issue: 다윗이 물을 부은 행위의 성격
  chosen_reading: 단순 폐기가 아니라 야훼께 드리는 제의적 헌납의 의미를 유지합니다.
  alternative_readings:
  - 상징적으로 마시지 않겠다는 거절 표시로만 읽는 해석
  rationale: 히브리어 נסך는 단순히 버리다보다 ‘붓다/전제하다’의 제의적 울림이 있으므로, 본문은 그 긴장을 살리고 과도한 범주화는 피했습니다.
  doctrine_reference: Translation philosophy §3; the text preserves libation-like force without over-specifying the ritual category
