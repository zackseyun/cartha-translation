lexical_decisions:
- source_word: צַלְמוֹן
  english_pob_choice: Zalmon
  chosen_korean: 잘몬
  alternatives_korean:
  - 살몬
  lexicon: 고유명사 음역
  rationale: 인명은 음역하는 것이 적절하며, 영어 POB의 Zalmon을 따라 ‘잘몬’으로 옮기면 자음형에 더 가깝습니다. 영어 변이형 ‘Salmon’은 각주로만 처리합니다.
- source_word: הָֽ/אֲחֹחִי
  english_pob_choice: the Ahohite
  chosen_korean: 아호아 사람
