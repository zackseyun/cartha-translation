  - 아호히 사람
  - 아호아의 후손
  lexicon: HALOT
  rationale: 관사와 결합한 지명형 형용사로, 목록체에서는 ‘~사람’이 가장 자연스럽고 간결합니다. ‘후손’은 해석이 더 강합니다.
- source_word: מַהְרַ֖י
  english_pob_choice: Maharai
  chosen_korean: 마하라이
  alternatives_korean: []
  lexicon: 고유명사 음역
  rationale: 표준 음역으로 옮겼습니다.
- source_word: הַ/נְּטֹפָתִֽי
  english_pob_choice: the Netophathite
  chosen_korean: 네도바 사람
  alternatives_korean:
  - 네도바 출신
  - 네토바 사람
  lexicon: HALOT
  rationale: 히브리어 지명 Netophah를 한국어 음역 ‘네도바’로 옮기고, 목록 맥락을 살려 ‘사람’으로 처리했습니다. ‘출신’은 의미는 분명하지만 목록형 문체가 덜합니다.
