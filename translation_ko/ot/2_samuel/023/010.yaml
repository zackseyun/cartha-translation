revisions:
- from: 그는 일어나 블레셋 사람들을 쳐서 쓰러뜨렸는데, 그의 손이 피곤해지고 그의 손이 칼에 달라붙을 때까지였습니다. 야훼께서 그날에 큰 승리를 이루셨고, 백성은 그 뒤로 돌아와 오직 쓰러진 자들의 것을 벗기기만 하였습니다.[a][b]
  to: 그는 일어나 블레셋 사람들을 쳐서 쓰러뜨렸습니다. 그의 손은 지쳐 칼에 달라붙었습니다. 야훼께서 그날 큰 승리를 이루셨습니다.[a] 백성은 그의 뒤를 따라 돌아와, 오직 쓰러진 자들에게서 전리품을 벗겨 내기만 하였습니다.[b]
  rationale: 문장 구조를 현대 표준 한국어 합쇼체로 바로잡되, 손이 지쳐 칼에 달라붙는 생생한 묘사를 의학적으로 해석하지 않고 보존했습니다. 마지막 절은 전장 문맥에서 암시되는 목적어를 ‘전리품’으로 명시하여 자연스럽게 하되, 각주에서 원문의 직역과 구체적 관습을 밝혔습니다. 각주의 오탈자를 수정하고 표지를 해당 어구에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:45:00Z'
