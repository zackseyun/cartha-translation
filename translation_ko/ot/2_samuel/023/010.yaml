source:
  edition: WLC
  text: ה֣וּא קָם֩ וַ/יַּ֨ךְ בַּ/פְּלִשְׁתִּ֜ים עַ֣ד כִּֽי יָגְעָ֣ה יָד֗/וֹ וַ/תִּדְבַּ֤ק יָד/וֹ֙ אֶל הַ/חֶ֔רֶב וַ/יַּ֧עַשׂ יְהוָ֛ה תְּשׁוּעָ֥ה גְדוֹלָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/הָ/עָ֛ם יָשֻׁ֥בוּ אַחֲרָ֖י/ו אַךְ לְ/פַשֵּֽׁט׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/010.yaml
  text: He rose and struck down the Philistines until his hand grew weary and his hand clung to the sword[a]. And Yahweh brought about a great victory on that day[b], and the people returned after him only to strip the slain.
  footnotes:
  - marker: a
    text: Or 'a great deliverance' or 'a great salvation.' The Hebrew term can denote rescue broadly; here it refers to the LORD's decisive deliverance in battle.
    reason: lexical_alternative
  - marker: b
    text: Literally 'only to strip,' that is, to strip the fallen of weapons and spoil after the battle.
    reason: cultural_note
translation:
  language: ko
  text: 그는 일어나 블레셋 사람들을 쳐서 쓰러뜨렸는데, 그의 손이 피곤해지고 그의 손이 칼에 달라붙을 때까지였습니다. 야훼께서 그날에 큰 승리를 이루셨고, 백성은 그 뒤로 돌아와 오직 쓰러진 자들의 것을 벗기기만 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 구원’, ‘큰 구출’. 히브리어 תְּשׁוּעָה는 넓게는 구원·구출을 뜻할 수 있으나, 여기서는 전투에서 야훼께서 이루신 निर्ण정적 해방을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘오직 벗기기 위해서’입니다. 즉 전투 후 쓰러진 자들에게서 무기와 전리품을 벗겨 취한다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים
  english_pob_choice: struck down the Philistines
  chosen_korean: 블레셋 사람들을 쳐서 쓰러뜨렸는데
  alternatives_korean:
  - 블레셋 사람들을 쳤는데
  - 블레셋 사람들을 공격했는데
  lexicon: HALOT
  rationale: 전투 문맥의 נכה는 단순한 ‘치다’보다 격파·살상 뉘앙스를 띠므로, ‘쳐서 쓰러뜨리다’로 전투적 강도를 살렸습니다.
- source_word: יָגְעָה יָדוֹ
  english_pob_choice: until his hand grew weary
  chosen_korean: 그의 손이 피곤해지고
  alternatives_korean:
  - 그의 손이 지치고
  - 그의 손이 피로해지고
  lexicon: HALOT
  rationale: יָגע의 핵심은 피로·소진이어서, 자연스러운 현대 한국어로 ‘피곤해지다’와 병렬 구조를 이루게 했습니다.
- source_word: וַתִּדְבַּק יָדוֹ אֶל הַחֶרֶב
  english_pob_choice: his hand clung to the sword
  chosen_korean: 그의 손이 칼에 달라붙을 때까지
  alternatives_korean:
  - 그의 손이 칼에 붙을 때까지
  - 그의 손이 칼을 놓지 못할 때까지
  lexicon: HALOT
  rationale: דבק는 ‘붙다/달라붙다/달라붙어 떨어지지 않다’의 물리적 이미지를 살리므로, 손의 경직을 설명으로 풀기보다 직설적으로 옮겼습니다.
- source_word: תְּשׁוּעָה גְדוֹלָה
  english_pob_choice: a great victory
  chosen_korean: 큰 승리를
  alternatives_korean:
  - 큰 구원을
  - 큰 구출을
  lexicon: HALOT
  rationale: 전투 서술의 즉각적 결과를 드러내기 위해 ‘구원/구출’보다 ‘승리’를 채택하되, 야훼의 행위로 귀속된다는 점은 본문에 그대로 유지했습니다.
- source_word: אַךְ לְפַשֵּׁט
  english_pob_choice: only to strip the slain
  chosen_korean: 오직 쓰러진 자들의 것을 벗기기만 하였습니다
  alternatives_korean:
  - 오직 죽은 자들의 것을 벗기기만 하였습니다
  - 오직 전리품을 거두기만 하였습니다
  lexicon: HALOT
  rationale: פשט는 전투 후 시체/패잔병에게서 무기와 전리품을 벗기는 행위이므로, 의미를 넓히지 않고 ‘벗기다’로 구체화했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 고유한 신명 사역을 보존하기 위해 칭호 대체어가 아니라 음역형을 사용했습니다.
  doctrine_reference: 'POB glossary: יְהוָה / YHWH → 야훼'
- issue: תְּשׁוּעָה의 의미를 전투 문맥에서 어떻게 드러낼지
  chosen_reading: 큰 승리
  alternative_readings:
  - 큰 구원
  - 큰 구출
  rationale: 본문은 구원의 신학을 지우지 않으면서도 전투 결과를 직접 서술하므로, 여기서는 군사적 성취를 분명히 하는 ‘승리’가 가장 적합합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
