source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר חָלִילָ/ה֩ לִּ֨/י יְהוָ֜ה מֵ/עֲשֹׂ֣תִ/י זֹ֗את הֲ/דַ֤ם הָֽ/אֲנָשִׁים֙ הַ/הֹלְכִ֣ים בְּ/נַפְשׁוֹתָ֔/ם וְ/לֹ֥א אָבָ֖ה לִ/שְׁתּוֹתָ֑/ם אֵ֣לֶּה עָשׂ֔וּ שְׁלֹ֖שֶׁת הַ/גִּבֹּרִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/017.yaml
  text: And he said[a], “Far be it from me, O Yahweh, that I should do this! Is it not the blood of the men who went at the risk of their lives?” So he was not willing to drink it[b]. These things the three mighty men did.
  footnotes:
  - marker: a
    text: Or, more literally, “with their lives”; the phrase means they went in mortal danger.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional rendering: “Is this not the blood of the men...?” David treats the water as if it were their blood because they obtained it at the risk of death.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그는 말했습니다. “야훼여, 제가 이런 일을 하는 것은 결코 있을 수 없습니다! 목숨을 걸고 간 그 사람들의 피[a]가 아니겠습니까?” 그래서 그는 그것을 마시려 하지 않았습니다. 이 일을 한 사람들은 세 용사였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 “그들의 생명과 함께”입니다. 이 표현은 그들이 목숨을 걸고 갔다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 전통 번역은 “이것이 그 사람들의 피가 아니냐?”입니다. 다윗은 그 물을, 그들이 죽을 위험을 무릅쓰고 얻었으므로 마치 그들의 피처럼 여깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חָלִילָה לִּי יְהוָה
  english_pob_choice: Far be it from me, O Yahweh
  chosen_korean: “야훼여, 이런 일을 제가 하다니, 제게서 멀리하소서!”
  alternatives_korean:
  - “야훼여, 제가 결코 이런 일을 하지 않겠습니다!”
  - “야훼여, 이것은 제게서 멀리 있습니다!”
  lexicon: HALOT
  rationale: חָלִילָה는 강한 거부와 혐오를 나타내는 관용구이므로, 단순한 금지보다 결연한 자기 부정을 드러내는 표현으로 옮겼습니다. יְהוָה는 본문대로 야훼로 옮기고 호격으로 처리했습니다.
- source_word: הֲדַם הָאֲנָשִׁים
  english_pob_choice: Is it not the blood of the men
  chosen_korean: “자기들의 생명을 걸고 간 그 사람들의 피가 아니겠습니까?”
  alternatives_korean:
  - “그 사람들의 피가 아니겠습니까?”
  - “그 사람들의 피가 아닙니까?”
  lexicon: HALOT
  rationale: 수사 의문문을 한국어의 확인형 의문으로 살려, 물을 마시는 행위가 그들의 피를 마시는 것처럼 여겨진다는 뜻을 보존했습니다. '피'는 단순한 물리적 혈액이 아니라 위험 속에서 얻은 대가를 가리키는 표현으로 유지했습니다.
- source_word: בְּנַפְשׁוֹתָם
  english_pob_choice: at the risk of their lives
  chosen_korean: “자기들의 생명을 걸고 간”
  alternatives_korean:
  - “목숨을 걸고 간”
  - “생명의 위험을 무릅쓰고 간”
  lexicon: HALOT
  rationale: 직역하면 '자기들의 생명과 함께/안고'이지만 관용적으로는 목숨을 건 위험을 뜻하므로, 현대 한국어에서 자연스럽고 의미를 분명히 하는 표현을 택했습니다.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  english_pob_choice: So he was not willing to drink it
  chosen_korean: “그래서 그는 그것을 마시려 하지 않았습니다.”
  alternatives_korean:
  - “그래서 그는 그것을 마시지 않았습니다.”
  - “그래서 그는 그것을 마시기를 거부했습니다.”
  lexicon: HALOT
  rationale: אָבָה의 핵심은 의지·수락의 부재이므로, 단순한 행위 부정보다 '마시려 하지 않았다'가 원문의 뉘앙스를 더 잘 살립니다. 대상은 물이므로 한국어에서는 단수 지시대명사 '그것'으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 여호와의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
