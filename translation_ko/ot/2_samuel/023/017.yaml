  rationale: 본문이 하나님의 고유명 יְהוָה를 직접 사용하므로, 제목어 '주님'으로 바꾸지 않고 음역형 '야훼'를 유지해 원문의 인칭성과 언약적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
