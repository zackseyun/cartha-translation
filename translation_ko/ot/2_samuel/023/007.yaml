source:
  edition: WLC
  text: וְ/אִישׁ֙ יִגַּ֣ע בָּ/הֶ֔ם יִמָּלֵ֥א בַרְזֶ֖ל וְ/עֵ֣ץ חֲנִ֑ית וּ/בָ/אֵ֕שׁ שָׂר֥וֹף יִשָּׂרְפ֖וּ בַּ/שָּֽׁבֶת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/007.yaml
  text: But the man who touches them must arm himself with iron and the shaft of a spear[c][b][a], and they must be completely burned with fire in their place.
  footnotes:
  - marker: a
    text: Or 'must equip himself with iron and a spear shaft'; literally, 'must be filled with iron and wood of a spear.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they shall surely be burned with fire on the spot.' The Hebrew uses an infinitive absolute with the verb for emphasis.
    reason: lexical_alternative
  - marker: c
    text: The 'them' refers back to the thorn-like 'worthless men' in the previous verse.
    reason: cross_reference
translation:
  language: ko
  text: 그러나 그것들[c]을 만지는 사람은 철과 창 자루[a]를 갖추어야 하며, 그것들은 그 자리에서 불에 완전히[b] 태워져야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘철과 창의 나무로 채워져야 한다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 부정사 절대구와 동사를 함께 써서 ‘반드시/완전히’의 강조를 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그것들’은 바로 앞절의 가시 같은 ‘쓸모없는 사람들’을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישׁ
  english_pob_choice: But the man
  chosen_korean: 그것들을 만지는 사람은
  alternatives_korean:
  - 그 사람은
  - 어떤 사람이
  lexicon: HALOT
  rationale: 히브리어 אישׁ의 일반적 단수 용법을 한국어에서 자연스러운 일반인 표현으로 옮겼습니다. 앞절의 가시 같은 ‘그것들’을 이어 받아 관계절로 처리하면 문맥상 매끄럽습니다.
- source_word: יִגַּע בָּהֶם
  english_pob_choice: who touches them
  chosen_korean: 그것들을 만지는
  alternatives_korean:
  - 그것들에 닿는
  - 그것들을 건드리는
  lexicon: HALOT
  rationale: נגע는 ‘만지다, 닿다’의 기본 뜻이므로 가장 직접적인 동사인 ‘만지다’를 택했습니다. 위험한 대상에 대한 경고라는 문맥도 잘 살립니다.
- source_word: יִמָּלֵא בַרְזֶל וְעֵץ חֲנִית
  english_pob_choice: must arm himself with iron and the shaft of a spear
  chosen_korean: 철과 창 자루를 갖추어야 하며
  alternatives_korean:
  - 철과 창 자루로 무장해야 하며
  - 철과 창 자루로 채워져야 하며
  lexicon: HALOT
  rationale: מלא의 문자적 ‘채워지다’보다 무기·도구를 갖추는 관용적 뜻을 살려 ‘갖추다’로 옮겼습니다. עֵץ חֲנִית는 ‘창의 나무’ 곧 창 자루이므로 그대로 구체화했습니다.
- source_word: שָׂרוֹף יִשָּׂרְפוּ בַּשָּׁבֶת
  english_pob_choice: they must be completely burned with fire in their place
  chosen_korean: 그것들은 그 자리에서 불에 완전히 타 버려야 합니다
  alternatives_korean:
  - 그것들은 그 자리에서 반드시 불로 태워져야 합니다
  - 그것들은 그 자리에서 불로 완전히 불살라져야 합니다
  lexicon: HALOT
  rationale: 히브리어의 강조형(부정확한 단순 반복이 아닌 부정사 절대구 + 동사)을 반영해 ‘완전히’로 강세를 살렸습니다. בַּשָּׁבֶת은 문맥상 ‘그 자리에서/그곳에서’가 자연스러워 이를 선택했습니다.
theological_decisions:
- issue: 마지막 절의 경고 이미지와 강조법의 처리
  chosen_reading: ‘완전히 타 버려야 합니다’로 단순 과거·서술이 아니라 강한 필연성과 심판성을 드러냈습니다.
  alternative_readings:
  - ‘반드시 불에 태워집니다’
  - ‘불로 완전히 불살라집니다’
  rationale: 본문은 단순 묘사가 아니라 경고적 진술이며, 강조형 동사구가 그 강도를 높입니다. 한국어에서도 명령적·필연적 어감이 살아야 하므로 미래/필연 표현을 택했습니다.
  doctrine_reference: 본문 문맥의 심판적 경고와 히브리어 강조법
