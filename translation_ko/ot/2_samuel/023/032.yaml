  text: 샤알본 사람 엘야하바, 야센의 아들들, 요나단입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 매우 축약되어 있어 난해합니다. 직역하면 ‘샤알본 사람 엘야하바, 야센의 아들들, 요나단’입니다. 일부 해석자들은 ‘요나단’을 ‘야센의 아들들’ 가운데 하나로 보아 목록을 재구성하지만, 이 번역은 본문에 전승된 표현을 수정하지 않고 보존합니다.
    reason: textual_variant
