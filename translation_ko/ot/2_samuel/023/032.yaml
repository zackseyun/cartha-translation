  - marker: a
    text: 'The Hebrew text is terse and difficult here: literally, ''Elyahba the Shaalbonite, the sons of Jashen, Jonathan.'' Some interpreters understand a textual irregularity and reconstruct the list differently, such as taking ''Jonathan'' as one of ''the sons of Jashen.'' This translation preserves the Hebrew wording as transmitted rather than emending it.'
