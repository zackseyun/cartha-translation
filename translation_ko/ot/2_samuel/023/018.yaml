  text: Now Abishai[a], the brother of Joab son of Zeruiah, was chief of the Three. He wielded his spear against three hundred and killed them[b], and he had a name among the Three.
translation:
  language: ko
  text: 스루야의 아들이며 요압의 아우인 아비새는 그 삼인의 우두머리였습니다.[a] 그는 창을 들어 삼백 명을 죽였고,[b] 그 삼인 가운데 이름을 떨쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘삼인의 우두머리’라고 합니다. 역대상 11:20의 병행 구절과 이 대목의 본문상 불확실성 때문에, 일부는 이를 ‘삼십인의 우두머리’로 이해합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘그는 창을 들어 삼백 명의 죽임을 당한 자들을 대적했습니다.’ 히브리어는 매우 압축되어 있으며, 직역하면 ‘그의 창을 삼백 명의 죽임을 당한 자들 위로/대적하여 일으켰다’는 뜻입니다.
    reason: lexical_alternative
