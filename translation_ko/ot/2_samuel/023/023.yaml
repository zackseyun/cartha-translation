reference: 2 Samuel 23:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִן הַ/שְּׁלֹשִׁ֣ים נִכְבָּ֔ד וְ/אֶל הַ/שְּׁלֹשָׁ֖ה לֹא בָ֑א וַ/יְשִׂמֵ֥/הוּ דָוִ֖ד אֶל מִשְׁמַעְתּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/023.yaml
  text: He was honored among the thirty[a], but he did not attain to the three[c][b]; and David appointed him over his bodyguard.
  footnotes:
  - marker: a
    text: Or 'He was more honored than the thirty.' The Hebrew construction may be read comparatively rather than inclusively.
    reason: lexical_alternative
  - marker: b
    text: Or 'but he did not come up to the three,' that is, he did not attain the rank of the elite three warriors.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'to his mishmaath'; this may mean 'to his command' or 'over his guard.' 'Bodyguard' reflects the likely military sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 삼십 명 가운데서 존중을 받았지만[a], 세 사람에게는 미치지 못했습니다[b]. 다윗은 그를 자신의 호위대 책임자로 세웠습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 삼십 명보다 더 존귀했다.’ 히브리어 구문은 집단 안에서의 지위를 나타낼 수도 있고 비교의 뜻으로 읽을 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그러나 그는 세 사람에게 이르지 못했다.’ 곧 세 명의 정예 용사 반열에는 이르지 못했다는 뜻입니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 ‘그의 미쉬마아토’; 이는 ‘그의 지휘를 맡도록’ 또는 ‘그의 호위대를 맡도록’이라는 뜻일 수 있습니다. 문맥상 ‘호위대’가 가장 그럴듯합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלֹשִׁים
  english_pob_choice: among the thirty
  chosen_korean: 삼십 명 가운데서는
  alternatives_korean:
  - 삼십 명 중에서는
  - 삼십 명 가운데서
  - 삼십 명보다
  lexicon: HALOT
  rationale: מִן은 이 문맥에서 단순 출처보다 집단 내 위치를 나타내는 것으로 보이므로, 비교적이면서도 포함적인 의미를 살려 ‘가운데서는’으로 옮겼습니다.
- source_word: נִכְבָּד
  english_pob_choice: was honored
  chosen_korean: 존중을 받았
  alternatives_korean:
  - 존경을 받았
  - 명예롭게 여겨졌
  - 높이 여겨졌
  lexicon: HALOT
  rationale: 니팔형의 ‘존귀하게 여겨짐/존중받음’ 의미를 현대 한국어의 수동 표현으로 자연스럽게 살렸습니다.
- source_word: וְאֶל הַשְּׁלֹשָׁה לֹא בָא
  english_pob_choice: but he did not attain to the three
  chosen_korean: 세 사람에게는 미치지 못했으며
  alternatives_korean:
  - 세 사람에 이르지 못했으며
  - 세 사람과 같은 반열에는 오르지 못했으며
  - 세 사람에 도달하지 못했으며
  lexicon: HALOT
  rationale: בוא + אל은 이 명예 서열 문맥에서 ‘도달하다/미치다’의 뜻이므로, 위계적 도달 실패를 자연스럽게 드러내는 표현을 택했습니다.
- source_word: אֶל מִשְׁמַעְתּוֹ
  english_pob_choice: over his bodyguard
  chosen_korean: 자기 호위대 위에
  alternatives_korean:
  - 자기 명령 아래
  - 자기 경호대 위에
  - 자기 경호를 맡아
  lexicon: HALOT
  rationale: מִשְׁמַעַת은 이 군사적 궁정 문맥에서 ‘명령/지휘 아래의 부대’로 이해되는 것이 가장 자연스러워, POB의 해석을 따라 ‘호위대’로 옮겼습니다.
theological_decisions:
- issue: 다윗이 그를 어디에 세웠는지의 군사적 직무 표현
  chosen_reading: ‘호위대’는 단순한 행정 임명이 아니라 다윗의 신변 보호와 직결된 군사적 배치를 뜻하는 것으로 이해했습니다.
  alternative_readings:
  - ‘명령 아래’로 더 문자적으로 옮길 수 있습니다.
  - ‘경호대’로 보다 일반적인 한국어를 쓸 수 있습니다.
  rationale: 히브리어 מִשְׁמַעְתּוֹ는 문자적으로는 ‘그의 명령/복종’이지만, 문맥상 다윗의 개인 경호 또는 수행 부대를 가리키는 것으로 보는 해석이 가장 설득력 있습니다.
  doctrine_reference: 사무엘하 23장의 용례와 POB 주석 전통에 따른 문맥적 해석
- issue: ‘삼십 명 가운데’와 ‘세 사람에게 미치지 못함’의 서열 대비
  chosen_reading: 포함적 관계와 서열적 미달을 함께 보이도록 번역했습니다.
  alternative_readings:
  - ‘삼십 명보다 더 존귀했다’로 비교적 의미를 강하게 드러낼 수 있습니다.
  - ‘세 사람에 미치지 못했다’를 더 직역적으로 유지할 수 있습니다.
  rationale: 히브리어 מִן은 비교적 뉘앙스도 가능하지만, 문맥상 이 인물의 명예와 등급을 함께 전달하는 표현이 적절합니다.
  doctrine_reference: 히브리어 비교구문 해석(문맥상 의미 우선)
