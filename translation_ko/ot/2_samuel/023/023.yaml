  source_fidelity: 핵심 서열 대조와 다윗의 임명 행위는 잘 전달합니다. 다만 אֶל מִשְׁמַעְתּוֹ는 문자적으로 ‘그의 미쉬마아트에/로’이며, 문맥상 호위대를 맡기는 임명으로 이해할 수 있으므로, ‘호위대 위에 세웠습니다’보다 책임·지휘의 의미를 자연스럽게 드러내는 표현이 적절합니다.
  naturalness: ‘자기 호위대 위에 세웠습니다’는 현대 한국어에서 다소 직역투이고 ‘위에 세우다’가 물리적 위치처럼 들릴 수 있습니다. ‘자신의 호위대 책임자로 세웠습니다’가 합쇼체 문체에 자연스럽습니다. 각주 표지도 해당 본문 어구 바로 뒤에 두는 편이 독자의 이해와 각주 연결에 분명합니다.
  terminology: ‘삼십 명’, ‘세 사람’, ‘다윗’, ‘호위대’는 문맥과 고유명·군사 용어에 적절합니다. ‘존중을 받았다’도 נִכְבָּד의 수동 의미를 무리 없이 반영합니다.
