source:
  edition: WLC
  text: אֱלִיפֶ֥לֶט בֶּן אֲחַסְבַּ֖י בֶּן הַ/מַּֽעֲכָתִ֑י אֱלִיעָ֥ם בֶּן אֲחִיתֹ֖פֶל הַ/גִּלֹנִֽי־־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/034.yaml
  text: Eliphelet son of Ahasbai son of the Maacathite[a], Eliam son of Ahithophel the Gilonite.
  footnotes:
  - marker: a
    text: Or possibly, 'Eliphelet son of Ahasbai the Maacathite; Eliam son of Ahithophel the Gilonite,' depending on how the appositional relationship in the list is construed and in comparison with the parallel in 1 Chronicles 11:35–36.
    reason: alternative_reading
translation:
  language: ko
  text: 마아가 사람의 아들 아하스바이의 아들 엘리벨렛, 길론 사람 아히도벨의 아들 엘리암입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘엘리벨렛, 아하스바이의 아들, 마아가 사람의 아들’입니다. 이 인명 목록의 연결 관계는 다르게 이해될 수 있으며, 대상 11:35–36의 평행본문과 비교할 때 ‘마아가 사람’이 아하스바이를 수식하는 것으로 읽을 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִיפֶלֶט
  english_pob_choice: Eliphelet
  chosen_korean: 엘리베렛
  alternatives_korean:
  - 엘리페렛
  - 엘리팔렛
  lexicon: 고유명사 음역
  rationale: 히브리어 이름을 한국어 음역으로 옮겼으며, 장절의 인명 목록 성격을 살려 뜻풀이보다 표기 일관성을 우선했습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - ~의 자손
  - ~의 후손
  lexicon: HALOT
  rationale: 계보 목록에서 בֶּן은 직접 부자 관계를 표시하므로 한국어에서는 자연스러운 '아들'로 옮겼습니다.
- source_word: הַמַּעֲכָתִי
  english_pob_choice: the Maacathite
  chosen_korean: 엘리바셋의 아들 아하스바이의 아들
  alternatives_korean:
  - 마아가 사람
  - 마아가 출신
  lexicon: HALOT
  rationale: 본문의 어형은 호칭적 형용사이지만, 영어 POB의 주석처럼 앱포지션 가능성이 있어 한국어에서는 '아하스바이의 아들'을 앞에 두어 연결 관계를 보존했습니다.
- source_word: הַגִּלֹנִי
  english_pob_choice: the Gilonite
  chosen_korean: 길론 사람
  alternatives_korean:
  - 길론인
  - 길로 사람
  lexicon: HALOT
  rationale: 지명 유래의 거주/소속 표지로 이해하여, 한국어에서는 널리 통용되는 지리적 소속 표현인 '길론 사람'을 택했습니다.
theological_decisions:
- issue: 이 절의 두 번째 인명군에서 속격 관계의 배열
  chosen_reading: '''아히도벨의 아들 길론 사람 엘리암''으로 직역적 순서를 유지했습니다.'
  alternative_readings:
  - '''길론 사람 아히도벨의 아들 엘리암''처럼 더 풀어 쓰는 번역'
  - 앱포지션을 재구성해 별도 쉼표로 처리하는 번역
  rationale: 본문은 족보식 목록이며, 평행본문과의 비교를 전제로 한 영어 POB의 주석을 존중해 해석을 고정하지 않고 원문의 애매성을 보존했습니다.
  doctrine_reference: 본문비평/평행본문 처리 원칙
