  lexicon: 고유명사 음역
  rationale: 히브리어 이름을 한국어 음역으로 옮겼으며, 장절의 인명 목록 성격을 살려 뜻풀이보다 표기 일관성을 우선했습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - ~의 자손
