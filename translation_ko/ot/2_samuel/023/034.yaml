  text: Eliphelet son of Ahasbai son of the Maacathite[a], Eliam son of Ahithophel the Gilonite.
  footnotes:
  - marker: a
    text: Or possibly, 'Eliphelet son of Ahasbai the Maacathite; Eliam son of Ahithophel the Gilonite,' depending on how the appositional relationship in the list is construed and in comparison with the parallel in 1 Chronicles 11:35–36.
    reason: alternative_reading
translation:
  language: ko
  text: 엘리바셋의 아들 아하스바이의 아들 엘리베렛, 아히도벨의 아들 길론 사람 엘리암입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 앱포지션 관계는 '엘리바셋의 아들 아하스바이의 아들'로 읽을 수도 있고, 평행본문(대상 11:35–36)과 비교하면 다른 배열로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִיפֶלֶט
  english_pob_choice: Eliphelet
  chosen_korean: 엘리베렛
  alternatives_korean:
