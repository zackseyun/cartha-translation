  text: מִן הַ/שְּׁלֹשָׁה֙ הֲ/כִ֣י נִכְבָּ֔ד וַ/יְהִ֥י לָ/הֶ֖ם לְ/שָׂ֑ר וְ/עַד הַ/שְּׁלֹשָׁ֖ה לֹא בָֽא־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/019.yaml
  text: Was he not more honored than the three? So he became their commander[b][a], but he did not attain to the three.
  footnotes:
  - marker: a
    text: Or 'Was he not honored among the three?' The Hebrew may be taken less comparatively, but the comparative sense ('more honored than the three') best fits the syntax and the parallel in the surrounding passage.
    reason: lexical_alternative
  - marker: b
    text: That is, he did not attain the rank or standing of 'the three,' the highest tier among David's mighty men.
    reason: cultural_note
translation:
  language: ko
  text: 그는 세 사람보다 더 존귀하지 않았습니까?[a] 그래서 그는 그들의 지휘관이 되었지만, 세 사람에게는 미치지 못했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 세 사람 가운데 존귀하지 않았습니까?’로 볼 수도 있습니다. 히브리어는 비교의 의미를 약하게 이해할 수도 있으나, 문법과 주변 문맥은 ‘세 사람보다 더’라는 비교적 의미를 더 잘 뒷받침합니다.
    reason: alternative_reading
  - marker: b
    text: 즉, 그는 다윗의 용사들 가운데 ‘세 사람’으로 불린 최고 등급의 반열에는 이르지 못했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִן הַשְּׁלֹשָׁה
  english_pob_choice: than the three
  chosen_korean: 세 사람보다
  alternatives_korean:
  - 세 사람 가운데
  - 세 사람보다 더
  lexicon: HALOT
  rationale: 비교 의미의 מִן을 한국어 비교 조사 ‘-보다’로 자연스럽게 옮겨, ‘세 사람’과의 우열 관계를 분명히 했습니다.
- source_word: נִכְבָּד
  english_pob_choice: more honored
  chosen_korean: 더 존귀하지 않았습니까
  alternatives_korean:
  - 더 영예롭지 않았습니까
  - 더 존중받지 않았습니까
  - 더 높이 여겨지지 않았습니까
  lexicon: HALOT
  rationale: כבד의 수동적·형용사적 의미를 살려 ‘존귀하다’로 옮기되, 비교문과 수사적 질문을 함께 반영했습니다.
- source_word: וַיְהִי לָהֶם לְשָׂר
  english_pob_choice: So he became their commander
  chosen_korean: 그래서 그가 그들의 사령관이 되었지만
  alternatives_korean:
  - 그래서 그가 그들의 지휘관이 되었지만
  - 그리하여 그가 그들의 우두머리가 되었지만
  lexicon: HALOT
  rationale: שַׂר는 군사적 문맥에서 지도자·지휘관을 뜻하므로 현대 한국어의 ‘사령관’이 가장 직접적입니다.
- source_word: עַד הַשְּׁלֹשָׁה לֹא בָא
  english_pob_choice: but he did not attain to the three
  chosen_korean: 세 사람에게는 미치지 못했습니다
  alternatives_korean:
  - 세 사람에 이르지는 못했습니다
  - 세 사람의 반열에는 들지 못했습니다
  lexicon: HALOT
  rationale: ‘도달하지 못하다/미치지 못하다’는 관용적 의미로, 단순한 이동이 아니라 그들과 같은 최상위 반열에 이르지 못했다는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: ‘the three’의 위상 표현
  chosen_reading: ‘세 사람’은 다윗의 용사들 가운데 최고 등급의 집단으로 이해하여, 비교와 미달의 뉘앙스를 보존했습니다.
  alternative_readings:
  - 단순히 ‘세 사람 가운데’로 읽는 방법
  - ‘세 사람의 반열’로 풀어 쓰는 방법
  rationale: 문맥상 비교적 우위와 최상위 집단에 대한 미달이 함께 표현되므로, 우열과 위계를 동시에 드러내는 번역이 적절합니다.
  doctrine_reference: 문맥 주해(다윗의 용사 서술)
