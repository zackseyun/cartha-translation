  rationale: 이 절에서는 후대의 신학적 고유명사보다, 시적 비유 안에서 부패한 사람들의 성격을 묘사하는 일반 명사적 의미가 우선합니다.
  doctrine_reference: 본문 맥락 우선 원칙
