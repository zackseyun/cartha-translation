translation:
  language: ko
  text: 그러나 불량한 사람들은 모두 던져 버린 가시 같아서, 손으로는 잡을 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 beliyya‘al은 여기서 후대의 고유명사 '벨리알'보다 '불량함/무가치함'을 가리키는 일반 명사로 보는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלִיַּעַל
  english_pob_choice: worthless men
  chosen_korean: 불량한 사람들
  alternatives_korean:
