  source_fidelity: 히브리어 וּבְלִיַּעַל은 이 문맥에서 후대의 인격화된 고유명사로 보기보다 ‘무가치하거나 불량한 자들’을 뜻하는 집합적·인칭적 표현으로 이해하는 것이 적절합니다. כֻּלָּהֶם은 ‘모두’를, כְּקוֹץ מֻנָד는 ‘내버려진 가시와 같은’이라는 비유를, לֹא בְיָד יִקָּחוּ는 손으로 붙잡거나 집지 못한다는 뜻을 충실히 전달해야 합니다. 초안의 ‘던져 버린 가시’는 능동형으로 읽혀 수동 분사 מֻנָד의 의미를 충분히 반영하지 못합니다.
  naturalness: ‘내버려진 가시와 같아서’는 현대 표준 한국어에서 자연스럽고, 가시가 손으로 다루기 어려운 비유와도 잘 연결됩니다. ‘불량한 사람들’도 이해 가능하나, 시적·성경 문체에서는 ‘불량한 자들’이 더 간결하고 자연스럽습니다.
  terminology: ‘벨리알’은 본절에서 본문상의 고유명사로 번역하지 않고 각주에서만 가능한 후대적 이해와 구별하는 것이 적절합니다. ‘불량한 자들’은 원문의 가치 판단 및 인칭 지시를 유지하며, 특정 교파적 해석을 부과하지 않습니다.
