translation:
  language: ko
  text: 이가알은 나단의 아들로서 소바에서 온 사람이며, 바니는 갓 사람입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 소바에서’는 מִן의 가장 직접적인 지리적 의미를 따른 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְאָ֤ל
  english_pob_choice: Igal
  chosen_korean: 이가알
  alternatives_korean:
  - 이가엘
  - 이갈
  lexicon: 표준 음역
  rationale: 히브리어 고유명사는 뜻풀이보다 음역이 필요하므로, 영어 POB의 Igal에 맞춰 한국어 음역으로 옮겼습니다.
- source_word: בֶּן נָתָן
  english_pob_choice: son of Nathan
  chosen_korean: 나단의 아들
  alternatives_korean:
  - 나단의 자녀
  - 나단에게서 난
  lexicon: 히브리어 계보 용법
  rationale: bən은 계보 표지이므로 자연스러운 현대 한국어로 ‘~의 아들’로 옮겼습니다.
- source_word: מִ/צֹּבָ֔ה
  english_pob_choice: from Zobah
  chosen_korean: 소바에서 온
  alternatives_korean:
  - 소바 출신의
  - 소바의
  lexicon: HALOT
  rationale: מִן은 기본적으로 출처/기원을 나타내므로, 영어 POB의 ‘from Zobah’를 따라 지리적 출신을 분명히 했습니다.
- source_word: הַ/גָּדִֽי
  english_pob_choice: the Gadite
  chosen_korean: 갓 사람
  alternatives_korean:
  - 갓 사람인
  - 갓 지파 사람
  lexicon: HALOT
  rationale: 지파 소속을 나타내는 gentilice는 현대 한국어에서 간명한 ‘갓 사람’이 가장 직접적입니다.
theological_decisions:
- issue: 이 절은 전투 영웅 명단의 계보·출신 표기이며 신학적 해석어를 덧씌울 필요가 있는지
  chosen_reading: 출신과 소속을 단순히 나열하는 문장으로 유지했습니다.
  alternative_readings:
  - 의도적으로 장식적인 문체를 넣는 번역
  - 교회적 친숙어로 풀어쓰는 번역
  rationale: 본문은 서사적 인명 목록이므로, 의미를 확대하지 않고 원문의 정보 기능을 보존하는 것이 가장 충실합니다.
  doctrine_reference: 본문 장르와 문맥 보존 원칙
