translation:
  language: ko
  text: 그 암몬 사람 제렉과 베로 사람 나하라이, 요압의 무기를 메는 사람이었습니다. 그는 스루야의 아들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 나하라이는 영어 음역에서 Nahrai로도 적힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶלֶק / הָעַמֹּנִי
  english_pob_choice: Zelek the Ammonite
  chosen_korean: 그 암몬 사람 제렉
  alternatives_korean:
  - 암몬 사람 제렉
  - 제렉 암몬 사람
  lexicon: 고유명사·지파/민족 표지
  rationale: 히브리어 고유명사와 민족 표지를 함께 살리되, 한국어에서는 이름 뒤에 출신 표지를 붙여 자연스럽게 읽히도록 했습니다.
- source_word: נַחְרַי / הַבְּאֵרֹתִי
  english_pob_choice: Naharai the Beerothite
  chosen_korean: 베로 사람 나하라이
  alternatives_korean:
  - 베로 사람 나흐라이
  - 나하라이 베로 사람
  lexicon: 고유명사·지명 유래 형용사
  rationale: Beerothite는 지명 베로(Beeroth)에서 온 사람이라는 뜻이므로, 한국어에서는 ‘베로 사람’으로 옮겨 간결한 족보/명단 형식을 보존했습니다.
- source_word: נשאי כְּלֵי
  english_pob_choice: armor-bearer
  chosen_korean: 요압의 무기를 메는 사람
  alternatives_korean:
  - 요압의 무기 든 사람
  - 요압의 갑옷을 드는 사람
  - 요압의 무기 حامل
  lexicon: 동사 נשא + כלי의 군사적 관용구
  rationale: 직역하면 ‘무기/장비를 지는 사람’이지만, 군사적 맥락에서 역할을 드러내는 가장 자연스러운 한국어 표현으로 풀었습니다. ‘갑옷’은 원문 범위를 좁힐 수 있어 피했습니다.
- source_word: בֶּן צְרֻיָה
  english_pob_choice: son of Zeruiah
  chosen_korean: 스루야의 아들
  alternatives_korean:
  - 스루야의 아들입니다
  - 스루야의 아들이었습니다
  lexicon: 족보/관계 표지
  rationale: 히브리어의 소유·출신 관계를 한국어 관용대로 옮겼고, 명단 문맥상 종결을 매끈하게 하기 위해 마지막에 서술형 종결을 사용했습니다.
theological_decisions:
- issue: 군사 직책 표현의 범위
  chosen_reading: ‘armor-bearer’를 ‘무기를 메는 사람’으로 옮겨, 특정한 제도 직함보다 실제 수행 역할을 드러냈습니다.
  alternative_readings:
  - 무기 든 사람
  - 병기 담당자
  - 갑옷병
  rationale: 본문은 직책 명칭을 정의하기보다 요압과의 관계 속 기능을 묘사하므로, 한국어도 과도한 제도화 대신 역할 중심으로 옮겼습니다.
  doctrine_reference: 본문 문맥상 역사 서술의 기능적 직함 해석
- issue: 명단 문장 종결
  chosen_reading: 열거문을 현대 한국어 문장으로 정리해 합쇼체 종결을 사용했습니다.
  alternative_readings:
  - 세미콜론식 단문 열거
  - 원문식 비문투
  rationale: 히브리어 명단의 압축성을 유지하되, 한국어 출판문체에서는 독자가 한 문장으로 읽을 수 있도록 최소한의 연결을 보완했습니다.
  doctrine_reference: 문체·가독성 원칙
