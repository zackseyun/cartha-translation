  text: צֶ֖לֶק הָ/עַמֹּנִ֑י נַחְרַי֙ הַ/בְּאֵ֣רֹתִ֔י נשאי כְּלֵ֖י יוֹאָ֥ב בֶּן צְרֻיָֽהס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/037.yaml
  text: Zelek the Ammonite[a], Naharai the Beerothite, armor-bearer of Joab son of Zeruiah;
  footnotes:
  - marker: a
