  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הוּא הִכָּה֩ אֶת אִ֨ישׁ מִצְרִ֜י אשר מַרְאֶ֗ה וּ/בְ/יַ֤ד הַ/מִּצְרִי֙ חֲנִ֔ית וַ/יֵּ֥רֶד אֵלָ֖י/ו בַּ/שָּׁ֑בֶט וַ/יִּגְזֹ֤ל אֶֽת הַ/חֲנִית֙ מִ/יַּ֣ד הַ/מִּצְרִ֔י וַ/יַּהַרְגֵ֖/הוּ בַּ/חֲנִיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/021.yaml
  text: He also struck down an Egyptian[a], a man of impressive appearance. The Egyptian had a spear in his hand, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[b], and killed him with his own spear.
  footnotes:
  - marker: a
    text: Or 'a handsome man' or 'a man of notable appearance.' The Hebrew phrase refers broadly to the Egyptian's appearance; some interpreters, influenced by the parallel in 1 Chronicles 11:23, understand it to imply unusual stature.
    reason: lexical_alternative
  - marker: b
    text: Or 'with a club' or 'with a rod.' The Hebrew שֵׁבֶט can denote a staff, rod, scepter, or club depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 또 한 이집트 사람을 쳐 죽였는데, 그는 외모가 뛰어난 사람이었습니다. 이집트 사람은 손에 창을 들고 있었고, 그는 지팡이를 들고 그에게로 내려가 그 이집트 사람의 손에서 창을 빼앗아 그 자신의 창으로 그를 죽였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘외모가 뛰어난 사람’은 히브리어의 넓은 표현을 따른 번역입니다. 문맥상 놀라운 체구를 시사한다고 보는 해석도 있으나, 본문 자체는 외형 전반을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 שֵׁבֶט은 문맥에 따라 지팡이, 막대, 홀, 몽둥이 등을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מִצְרִי
  english_pob_choice: an Egyptian
  chosen_korean: 한 이집트 사람
  alternatives_korean:
  - 한 이집트인
  - 이집트 사람 한 명
  lexicon: HALOT
  rationale: 히브리어는 민족/출신을 직접 나타내므로, 한국어에서도 자연스럽게 ‘이집트 사람’으로 옮겨 인물의 민족적 정체성을 분명히 했습니다.
- source_word: אֲשֶׁר מַרְאֶה
  english_pob_choice: a man of impressive appearance
  chosen_korean: 외모가 뛰어난 사람
  alternatives_korean:
  - 잘생긴 사람
  - 외모가 인상적인 사람
  - 큰 체구의 사람
  lexicon: HALOT
  rationale: מַרְאֶה는 외형/겉모습을 가리키므로, ‘외모가 뛰어난 사람’으로 넓게 옮겨 미모나 체구 중 하나로 과도하게 좁히지 않았습니다.
- source_word: בַּשָּׁבֶט
  english_pob_choice: with a staff
  chosen_korean: 지팡이를 들고
  alternatives_korean:
  - 막대기를 들고
  - 몽둥이를 들고
  - 막대와 함께
  lexicon: HALOT
  rationale: שֵׁבֶט은 문맥에 따라 지팡이, 막대, 몽둥이, 홀을 가리킬 수 있으나, 여기서는 들고 다니는 막대기류 무기라는 점을 살려 ‘지팡이’로 번역했습니다.
- source_word: וַיִּגְזֹל
  english_pob_choice: snatched
  chosen_korean: 빼앗아
  alternatives_korean:
  - 채어
  - 강제로 빼앗아
  - 가로채
  lexicon: HALOT
  rationale: גזל은 강탈/강제로 취함의 뉘앙스가 있어, 전투 장면의 급박함을 드러내는 ‘빼앗아’로 옮겼습니다.
