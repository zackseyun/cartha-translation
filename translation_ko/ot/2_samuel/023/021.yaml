  lexicon: HALOT
  rationale: שֵׁבֶט은 문맥에 따라 지팡이, 막대, 몽둥이, 홀을 가리킬 수 있으나, 여기서는 들고 다니는 막대기류 무기라는 점을 살려 ‘지팡이’로 번역했습니다.
- source_word: וַיִּגְזֹל
  english_pob_choice: snatched
  chosen_korean: 빼앗아
  alternatives_korean:
  - 채어
  - 강제로 빼앗아
  - 가로채
  lexicon: HALOT
  rationale: גזל은 강탈/강제로 취함의 뉘앙스가 있어, 전투 장면의 급박함을 드러내는 ‘빼앗아’로 옮겼습니다.
