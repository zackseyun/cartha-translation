id: 2SA.23.15
reference: 2 Samuel 23:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתְאַוֶּ֥ה דָוִ֖ד וַ/יֹּאמַ֑ר מִ֚י יַשְׁקֵ֣/נִי מַ֔יִם מִ/בֹּ֥אר בֵּֽית לֶ֖חֶם אֲשֶׁ֥ר בַּ/שָּֽׁעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/015.yaml
  text: And David longed and said[a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
  footnotes:
  - marker: a
    text: Or, more dynamically, 'If only someone would give me water to drink from the well of Bethlehem by the gate!' The Hebrew uses 'Who will...?' as an expression of longing.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 갈망하며 말했습니다[a]. 「누가 나에게 베들레헴 성문 곁에 있는 그 우물의 물을 마시게 해 주겠습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 “누가 …?”는 단순한 질문이라기보다 “누가 좀 … 해 주면 좋겠는가!”라는 갈망의 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוֶּה
  english_pob_choice: longed
  chosen_korean: 갈망하며
  alternatives_korean:
  - 간절히 바라며
  - 원하며
  lexicon: HALOT
  rationale: 히트파엘 של אֹהֵב 계열의 강한 욕구를 한국어에서 가장 자연스럽게 드러내는 말로 ‘갈망하다’를 택했습니다.
- source_word: מִי יַשְׁקֵנִי מַיִם
  english_pob_choice: Who will give me water to drink
  chosen_korean: 누가 … 물을 마시게 해 줄 수 있겠습니까?
  alternatives_korean:
  - 누가 나에게 물을 주어 마시게 하겠습니까?
  - 누가 나를 마시게 해 주겠습니까?
  lexicon: HALOT
  rationale: 히필 יַשְׁקֵנִי의 사역 의미를 살려 ‘마시게 하다’로 옮겼고, 한국어 문맥상 ‘누가 … 해 줄 수 있겠습니까?’가 원문의 질문형 소망을 자연스럽게 담습니다.
- source_word: בֹּאר
  english_pob_choice: the well
  chosen_korean: 우물
  alternatives_korean:
  - 샘
  - 정
  lexicon: HALOT
  rationale: בְּאֵר는 여기서 성문과 연결된 특정한 물 공급 지점을 가리키므로, 현대 한국어에서 가장 이해가 쉬운 ‘우물’을 사용했습니다.
- source_word: בֵּית לֶחֶם
  english_pob_choice: Bethlehem
  chosen_korean: 베들레헴
  alternatives_korean:
  - 베들레헴 성읍
  lexicon: Standard proper noun
  rationale: 지명은 통용되는 음역을 따랐습니다.
- source_word: אֲשֶׁר בַּשָּׁעַר
  english_pob_choice: that is by the gate
  chosen_korean: 성문 곁에 있는
  alternatives_korean:
  - 성문에 있는
  - 성문 안에 있는
  lexicon: HALOT
  rationale: בַּשָּׁעַר은 우물이 성문과 관련된 위치임을 나타내므로, 오해를 줄이기 위해 ‘곁에 있는’으로 옮겼습니다.
theological_decisions:
- issue: the verse’s wish-like question form
  chosen_reading: ‘누가 … 마시게 해 줄 수 있겠습니까?’로 옮겨, 표면은 질문이지만 실제로는 갈망을 드러내는 발화로 보이게 했습니다.
  alternative_readings:
  - 직설적으로 ‘아, 누가 … 주면 좋겠습니다’로 풀기
  - 단순한 정보 질문처럼 ‘누가 … 할 수 있습니까?’로 옮기기
  rationale: 히브리어 מִי는 실제 정보를 묻기보다 강한 소망을 표현하는 수사적 질문으로 쓰였습니다. 한국어에서도 그 긴장을 보존하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 수사적 질문과 서정적 갈망 표현
- issue: David as speaker
  chosen_reading: 본문의 화자 표시를 그대로 두어 다윗의 개인적 갈망을 강조했습니다.
  alternative_readings:
  - 말하다를 생략해 서술을 압축하기
  - 감탄형으로 바꾸어 정서를 강화하기
  rationale: 본문은 다윗의 내적 욕구와 발화를 함께 제시하므로, 서술과 인용을 분명히 구분해 원문의 장면성을 유지했습니다.
  doctrine_reference: 서사 본문의 화자-발화 구조
