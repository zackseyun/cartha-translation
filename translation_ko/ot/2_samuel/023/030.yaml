base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/030.yaml
  text: Benaiah the Pirathonite[a], Hiddai from the wadis of Gaash[b];
  footnotes:
  - marker: a
    text: Hebrew naḥal can refer to a wadi, ravine, or torrent-bed; traditionally, 'brooks' or 'valleys.'
    reason: lexical_alternative
  - marker: b
    text: The parallel in 1 Chronicles 11:32 reads 'Hurai' instead of 'Hiddai.'
    reason: cross_reference
translation:
  language: ko
  text: 브나야는 피라돈 사람이며, 히다이[b]는 가아스의 와디들[a]에서 온 사람입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 나할(נחל)은 와디, 협곡, 또는 물이 흐르는 개울바닥을 가리킬 수 있으며, 전통적으로 ‘시내’나 ‘골짜기’로 옮겨지기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 병행구인 역대상 11:32에는 ‘히다이’ 대신 ‘후래’라는 이름 형태가 나옵니다.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנָיָ֨הוּ֙
  english_pob_choice: Benaiah
  chosen_korean: 브나야
  alternatives_korean:
