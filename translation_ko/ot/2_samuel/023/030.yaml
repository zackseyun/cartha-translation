base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/030.yaml
  text: Benaiah the Pirathonite[a], Hiddai from the wadis of Gaash[b];
  footnotes:
  - marker: a
    text: Hebrew naḥal can refer to a wadi, ravine, or torrent-bed; traditionally, 'brooks' or 'valleys.'
    reason: lexical_alternative
  - marker: b
    text: The parallel in 1 Chronicles 11:32 reads 'Hurai' instead of 'Hiddai.'
    reason: cross_reference
translation:
  language: ko
  text: 브나야는 피라돈 사람이며, 하닷은 가아스의 나할들 출신입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 나할(נחל)은 와디, 협곡, 개울바닥을 가리킬 수 있으며, 전통적으로는 ‘시내’나 ‘골짜기’로 옮겨지기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 병행구인 역대상 11:32에는 ‘하닷’ 대신 다른 이름 형태가 전합니다.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנָיָ֨הוּ֙
  english_pob_choice: Benaiah
  chosen_korean: 브나야
  alternatives_korean:
  - 베나야
  - 브나야후
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사이므로 번역하지 않고 음역했습니다. 한국어 성경에서 널리 알려진 형태를 고려하되, 본문 음가를 최대한 보존했습니다.
- source_word: פִּרְעָ֣תֹנִ֔י
  english_pob_choice: the Pirathonite
  chosen_korean: 피라돈 사람
  alternatives_korean:
  - 피라돈 출신
  - 피라돈인
  lexicon: 고유명사+지명형 형용사
  rationale: פִּרְעָתֹנִי는 출신지를 나타내는 형용사이므로, 한국어에서는 ‘~사람’으로 자연스럽게 옮겼습니다.
- source_word: הִדַּ֖י
  english_pob_choice: Hiddai
  chosen_korean: 하닷
  alternatives_korean:
  - 히다이
  - 흐다이
  lexicon: 고유명사 음역
  rationale: 마소라 본문의 이름을 음역했습니다. 병행구의 다른 형태와는 구별되지만, 여기서는 이 본문의 형태를 따릅니다.
- source_word: מִ/נַּ֥חֲלֵי
  english_pob_choice: from the wadis of
  chosen_korean: 가아스의 나할들 출신
  alternatives_korean:
  - 가아스의 와디들 출신
  - 가아스의 골짜기들에서 온
  lexicon: HALOT
  rationale: נחל의 지리적 의미를 살리기 위해 ‘와디/나할’ 계열을 유지했습니다. 한국어 본문에서는 지명 구문과 함께 ‘출신’으로 처리해 출신지를 분명히 했습니다.
- source_word: גָֽעַשׁ
  english_pob_choice: Gaash
  chosen_korean: 가아스
  alternatives_korean:
  - 가아쉬
  - 가아스 산
  lexicon: 고유명사 음역
  rationale: 지명은 음역했습니다. 본문의 소유격 구조에 맞추어 ‘가아스의’로 연결했습니다.
