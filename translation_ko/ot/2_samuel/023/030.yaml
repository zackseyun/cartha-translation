  rationale: פִּרְעָתֹנִי는 출신지를 나타내는 형용사이므로, 한국어에서는 ‘~사람’으로 자연스럽게 옮겼습니다.
- source_word: הִדַּ֖י
  english_pob_choice: Hiddai
  chosen_korean: 하닷
  alternatives_korean:
  - 히다이
  - 흐다이
  lexicon: 고유명사 음역
  rationale: 마소라 본문의 이름을 음역했습니다. 병행구의 다른 형태와는 구별되지만, 여기서는 이 본문의 형태를 따릅니다.
- source_word: מִ/נַּ֥חֲלֵי
  english_pob_choice: from the wadis of
  chosen_korean: 가아스의 나할들 출신
  alternatives_korean:
  - 가아스의 와디들 출신
  - 가아스의 골짜기들에서 온
  lexicon: HALOT
  rationale: נחל의 지리적 의미를 살리기 위해 ‘와디/나할’ 계열을 유지했습니다. 한국어 본문에서는 지명 구문과 함께 ‘출신’으로 처리해 출신지를 분명히 했습니다.
- source_word: גָֽעַשׁ
  english_pob_choice: Gaash
  chosen_korean: 가아스
  alternatives_korean:
  - 가아쉬
  - 가아스 산
  lexicon: 고유명사 음역
  rationale: 지명은 음역했습니다. 본문의 소유격 구조에 맞추어 ‘가아스의’로 연결했습니다.
