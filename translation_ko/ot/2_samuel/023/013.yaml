base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/013.yaml
  text: Then thirty of the thirty chief men went down and came at harvest time to David[a], to the cave of Adullam[c][b], while a band of the Philistines was camped in the Valley of Rephaim.
  footnotes:
  - marker: a
    text: Hebrew 'thirty from the thirty, chief'; the expression is difficult. It may mean 'thirty of the chief men' or refer more specifically to members of 'the Thirty,' David's elite warriors.
    reason: alternative_reading
  - marker: b
    text: Or 'during harvest.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew חַיַּת פְּלִשְׁתִּים, literally 'living thing/animal of the Philistines,' here used idiomatically for a military band or troop.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 삼십 명 가운데 삼십 인의 우두머리들이 내려가 추수 때에 다윗에게, 아둘람의 굴로 갔습니다. 그때 블레셋 사람들의 무리가 르바임 골짜기에 진을 치고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרְדוּ
  english_pob_choice: went down
  chosen_korean: 내려가
  alternatives_korean:
  - 내려왔습니다
  - 하강했습니다
  lexicon: HALOT
  rationale: ירד의 기본 의미를 살려 방향성을 분명히 하되, 서술체에 자연스럽게 맞추었습니다.
- source_word: מֵהַשְּׁלֹשִׁים רֹאשׁ
  english_pob_choice: of the thirty chief men
  chosen_korean: 삼십 인의 우두머리들
  alternatives_korean:
  - 삼십 명 가운데 우두머리들
  - 삼십 중의 수장들
  lexicon: HALOT
  rationale: 압축된 히브리어 표현을 한국어에서는 관계를 풀어, 이들이 ‘삼십’과 관련된 핵심 전사 집단의 우두머리들이라는 점을 드러냈습니다.
- source_word: אֶל קָצִיר
  english_pob_choice: at harvest time
  chosen_korean: 추수 때에
  alternatives_korean:
  - 추수철에
  - 추수 기간에
  lexicon: HALOT
  rationale: 전치사 엘이 여기서는 목적지가 아니라 시점을 나타내므로, 시간 부사구로 옮겼습니다.
- source_word: חַיַּת פְּלִשְׁתִּים
  english_pob_choice: a band of the Philistines
  chosen_korean: 블레셋 사람들의 무리
  alternatives_korean:
  - 블레셋 사람들의 부대
  - 블레셋의 군대
  lexicon: HALOT
  rationale: 직역하면 오해를 낳을 수 있어, 문맥상 군사적 집단을 뜻하는 관용적 의미를 살려 ‘무리’로 옮겼습니다.
