source:
  edition: WLC
  text: חֵ֥לֶב בֶּֽן בַּעֲנָ֖ה הַ/נְּטֹפָתִ֑י אִתַּי֙ בֶּן רִיבַ֔י מִ/גִּבְעַ֖ת בְּנֵ֥י בִנְיָמִֽן־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/029.yaml
  text: Heleb son of Baanah the Netophathite[a], Ittai son of Ribai from Gibeah of the sons of Benjamin;
  footnotes:
  - marker: a
    text: Or 'of Gibeah of the Benjaminites.' The Hebrew reads literally 'from Gibeah of the sons of Benjamin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 헤렙은 바아나의 아들이며, 네토바 사람입니다. 이타이는 리바이의 아들이며, 베냐민의 아들들의 기브아 출신입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘베냐민 사람들의 기브아에서’입니다. 히브리어는 문자적으로 ‘베냐민의 아들들의 기브아에서’라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  english_pob_choice: Heleb
  chosen_korean: 헤렙
  alternatives_korean:
  - 헬렙
  - 헤레브
  lexicon: 고유명사 음역
  rationale: 히브리어 인명은 음역하는 것이 원칙이므로, 영어의 Heleb에 맞추되 표준어 표기 흐름에 맞게 헤렙으로 옮겼습니다.
- source_word: הַנְּטֹפָתִי
  english_pob_choice: the Netophathite
  chosen_korean: 네토바 사람
  alternatives_korean:
  - 네토바 사람입니다
  - 네토바 사람인
  lexicon: HALOT
  rationale: 지명 유래를 나타내는 gentillic이므로 ‘네토바 사람’으로 풀어, 단순한 지명 표기보다 출신/소속을 드러냈습니다.
- source_word: מִגִּבְעַת בְּנֵי בִנְיָמִן
  english_pob_choice: from Gibeah of the sons of Benjamin
  chosen_korean: 베냐민의 아들들의 기브아 출신
  alternatives_korean:
  - 베냐민 사람들의 기브아에서
  - 베냐민 자손의 기브아 출신
  lexicon: HALOT
  rationale: 히브리어의 ‘from Gibeah’와 ‘sons of Benjamin’을 함께 살리기 위해 출신 표현을 택했고, 문자적 구조를 보존해 ‘베냐민의 아들들’도 반영했습니다.
theological_decisions:
- issue: 계보/출신 표지의 번역 방식
  chosen_reading: 이 구절은 명단형 문맥이므로 서술을 부드럽게 하지 않고 인명과 출신 표지를 직접적으로 제시했습니다.
  alternative_readings:
  - 두 인물의 관계를 하나의 문장으로 더 자연스럽게 합치는 번역
  - 출신 정보를 괄호로 처리하는 번역
  rationale: 원문의 목록 형식을 유지하는 것이 이 절의 기능을 가장 잘 드러내며, 인명과 지명 정보의 축약이나 재구성을 피하는 편이 source-grounded합니다.
  doctrine_reference: 본문 목록 보존 원칙
