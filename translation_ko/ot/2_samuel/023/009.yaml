  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/אחר/ו אֶלְעָזָ֥ר בֶּן דדי בֶּן אֲחֹחִ֑י בִּ/שְׁלֹשָׁ֨ה גברים עִם דָּוִ֗ד בְּ/חָֽרְפָ֤/ם בַּ/פְּלִשְׁתִּים נֶאֶסְפוּ שָׁ֣ם לַ/מִּלְחָמָ֔ה וַֽ/יַּעֲל֖וּ אִ֥ישׁ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/009.yaml
  text: And after him was Eleazar son of Dodo[a], son of Ahohi, among the three mighty men with David, when they taunted the Philistines who had gathered there for battle[c][b], and the men of Israel had gone up.
  footnotes:
  - marker: a
    text: Or "son of Dodai, son of an Ahohite."
    reason: lexical_alternative
  - marker: b
    text: Or "when they defied the Philistines."
    reason: lexical_alternative
  - marker: c
    text: Literally "and the men of Israel went up"; in context this may mean they withdrew.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤에 엘르아살은 다도의 아들, 아호히의 아들로서, 다윗과 함께한 세 용사 가운데 한 사람이었습니다. 그들이 그곳에 모여 전투를 벌이던 블레셋 사람들을 조롱할 때, 이스라엘 사람들이 올라갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다도의 아들, 또는 ‘도대의 아들’로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 블레셋 사람들을 대항하여 도전할 때’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로는 ‘이스라엘 사람들이 올라갔습니다’이지만, 문맥상 ‘이스라엘 사람들이 물러갔습니다’로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/אחר/ו
  english_pob_choice: And after him was
  chosen_korean: 그 뒤에 …는
  alternatives_korean:
  - 그리고 그의 뒤에
  - 그 다음은
  lexicon: HALOT
  rationale: 이전 인물을 잇는 순서 표시로, 한국어에서는 자연스러운 서술 흐름인 ‘그 뒤에’로 옮겼습니다.
- source_word: בִּ/שְׁלֹשָׁ֨ה גברים
  english_pob_choice: among the three mighty men
  chosen_korean: 세 용사 가운데 한 사람
  alternatives_korean:
  - 세 용사 중 하나
  - 세 용사 가운데
  lexicon: HALOT
  rationale: 문맥상 다윗의 정예 전사 집단에 속한 한 사람이라는 뜻이므로, ‘용사’로 군사적 뉘앙스를 살리고 ‘가운데 한 사람’으로 소속 관계를 분명히 했습니다.
- source_word: בְּ/חָֽרְפָ֤/ם
  english_pob_choice: when they taunted
  chosen_korean: 조롱할 때
  alternatives_korean:
  - 모욕할 때
  - 비웃을 때
  - 조롱하고 있을 때
  lexicon: HALOT
  rationale: חרף의 핵심은 적을 향한 조롱·모욕이므로, 한국어에서는 가장 직접적인 ‘조롱하다’로 옮겼습니다.
- source_word: נֶאֶסְפוּ שָׁ֣ם לַ/מִּלְחָמָ֔ה
  english_pob_choice: who had gathered there for battle
  chosen_korean: 그곳에 모여 전투를 벌이던
  alternatives_korean:
  - 그곳에 모여 전쟁을 하던
  - 그곳에 집결해 싸우던
  lexicon: HALOT
  rationale: ‘모이다’와 ‘전투’의 기본 의미를 유지하되, 한국어에서는 진행 중인 상황을 드러내는 현재분사형으로 자연스럽게 표현했습니다.
- source_word: וַֽ/יַּעֲלוּ אִ֥ישׁ יִשְׂרָאֵֽל
  english_pob_choice: and the men of Israel had gone up
  chosen_korean: 이스라엘 사람들이 올라갔습니다
  alternatives_korean:
  - 이스라엘 사람들이 물러갔습니다
  - 이스라엘 사람들이 올라섰습니다
  lexicon: HALOT
  rationale: עלה의 직역은 ‘올라가다’이므로 본문은 이를 유지했습니다. 다만 이 표현이 군사적 문맥에서 철수로 이해될 여지도 있어, 영어 POB의 각주처럼 본문은 원형을 보존했습니다.
theological_decisions:
- issue: חרף의 군사적 의미를 어떻게 살릴지
  chosen_reading: ‘조롱하다’로 옮겨 공개적 도전보다 적대적 비웃음의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘맞서다’
  - ‘도전하다’
  - ‘모욕하다’
  rationale: 이 동사는 단순한 전투 행동보다 적을 향한 언어적 경멸을 강조하므로, 본문 의미를 가장 직접적으로 드러내는 표현을 택했습니다.
  doctrine_reference: 본문 서술의 어휘적 뉘앙스 보존
- issue: 이스라엘 사람들이 올라갔습니다의 처리
  chosen_reading: 원문 직역을 본문에 남기고, 철수 가능성은 본문 밖 해석 여지로 남겼습니다.
  alternative_readings:
  - 이스라엘 사람들이 물러갔습니다
  - 이스라엘 사람들이 철수했습니다
  rationale: 히브리어 עלה는 문자적으로 ‘올라가다’이며, 문맥상 철수일 수 있지만 본문에서 단정적으로 바꾸면 원문이 가진 긴장이 사라집니다.
  doctrine_reference: 본문 충실성 및 해석상 유보
