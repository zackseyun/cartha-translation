source:
  edition: WLC
  text: כִּֽי לֹא כֵ֥ן בֵּיתִ֖/י עִם אֵ֑ל כִּי֩ בְרִ֨ית עוֹלָ֜ם שָׂ֣ם לִ֗/י עֲרוּכָ֤ה בַ/כֹּל֙ וּ/שְׁמֻרָ֔ה כִּֽי כָל יִשְׁעִ֥/י וְ/כָל חֵ֖פֶץ כִּֽי לֹ֥א יַצְמִֽיחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/005.yaml
  text: For my house is not so with God[a]; yet he has made with me an everlasting covenant, ordered in every way and kept secure[b]. For this is all my salvation and all my desire—will he not indeed make it grow?
  footnotes:
  - marker: a
    text: Or, 'Is not my house so with God?' Many understand the opening as a positive rhetorical question rather than a negative statement.
    reason: alternative_reading
  - marker: b
    text: Or, 'for he will surely cause it to sprout / flourish.' The final clause is difficult in Hebrew and may be read as either a rhetorical question or a strong affirmation.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 집은 하나님 앞에서 이와 같지 않습니다[a]. 이는 그분께서 나를 위하여 영원한 언약을 세우셨기 때문입니다. 그 언약은 모든 면에서 잘 갖추어져 있고 보존되어 있습니다[b]. 이것이 나의 모든 구원이며 나의 모든 소원입니다. 그분께서 그것을 자라게 하시지 않겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘내 집이 하나님 앞에서 이와 같지 않습니까?’ 많은 해석자는 첫 구절을 부정 진술이 아니라 긍정의 수사 의문으로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 또는, ‘그분께서 반드시 그것을 싹트게 하시거나 번성하게 하실 것입니다.’ 마지막 절의 히브리어는 해석하기 어려우며, 수사 의문으로도 강한 긍정 진술로도 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתִי
  english_pob_choice: my house
  chosen_korean: 내 집
  alternatives_korean:
  - 내 가문
  - 내 집안
  - 내 왕조
  lexicon: HALOT
  rationale: 히브리어의 ‘집’ 이미지를 살리되, 다윗 언약의 문맥에서 가문/왕조까지 포괄할 수 있게 ‘내 집’으로 두었습니다.
- source_word: עִם אֵל
  english_pob_choice: with God
  chosen_korean: 하나님과 함께
  alternatives_korean:
  - 하나님 앞에서
  - 하나님과의 관계에서
  lexicon: HALOT
  rationale: עִם의 기본 의미인 ‘~와 함께’를 살려 관계적 근접성을 유지했습니다.
- source_word: בְרִית עוֹלָם
  english_pob_choice: an everlasting covenant
  chosen_korean: 영원한 언약
  alternatives_korean:
  - 영속하는 언약
  - 영구한 언약
  lexicon: HALOT
  rationale: 언약 문맥에서 עוֹלָם은 지속성과 변치 않음을 드러내므로, 표준적이고 자연스러운 ‘영원한 언약’으로 옮겼습니다.
- source_word: עֲרוּכָה בַכֹּל וּשְׁמֻרָה
  english_pob_choice: ordered in every way and kept secure
  chosen_korean: 모든 면에서 정돈되고 안전하게 지켜진
  alternatives_korean:
  - 모든 일에 정렬되고 보존된
  - 모든 면에서 잘 배열되고 지켜진
  lexicon: HALOT
  rationale: 두 분사는 언약의 질서성과 보호됨을 함께 말하므로, ‘정돈되고 안전하게 지켜진’으로 의미를 나란히 살렸습니다.
- source_word: כָּל יִשְׁעִי וְכָל חֵפֶץ
  english_pob_choice: all my salvation and all my desire
  chosen_korean: 나의 모든 구원이며 나의 모든 소원
  alternatives_korean:
  - 나의 모든 구원이며 나의 모든 기쁨
  - 나의 전부인 구원과 소원
  lexicon: HALOT
  rationale: יִשְׁעִי를 ‘구원’으로, חֵפֶץ를 ‘소원’으로 두어 병렬을 보존하고 현대 한국어에서 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: 구절 첫머리 כִּי לֹא כֵן בֵּיתִי 의 해석
  chosen_reading: 본문 형태를 따라 ‘내 집은 하나님과 함께 그렇지 않습니다’로 옮기고, 긍정적 수사 의문 읽기는 각주로 남겼습니다.
  alternative_readings:
  - ‘내 집이 하나님과 함께 그렇지 않습니까?’
  - ‘확실히 내 집은 하나님과 함께 그렇습니다’
  rationale: 히브리어의 부정형 긴장을 본문에서 지우지 않는 것이 중요하므로, 직접적인 부정 진술을 유지하되 전통적 긍정 수사 의문 가능성은 각주로 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: 마지막 절 כִּי לֹא יַצְמִיחַ 의 처리
  chosen_reading: ‘그분이 이것을 정말로 자라게 하시지 않겠습니까?’로 두어, 언약 성취에 대한 기대를 수사 의문으로 표현했습니다.
  alternative_readings:
  - ‘그분은 그것을 자라게 하실 것입니다’
  - ‘그분이 정말로 자라게 하지 않으시겠습니까?’
  rationale: 문맥상 언약과 구원의 성취를 향한 긍정이 자연스럽고, 히브리어의 압축성과 모호성도 수사 의문으로 어느 정도 보존됩니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
