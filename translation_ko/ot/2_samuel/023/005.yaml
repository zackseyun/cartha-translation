revisions:
- from: 내 집은 하나님과 함께 그렇지 않습니다[a]. 그러나 그분은 나와 함께 영원한 언약을 세우셨습니다. 모든 면에서 정돈되고 안전하게 지켜진 언약입니다[b]. 이것이 곧 나의 모든 구원이며 나의 모든 소원입니다 — 그분이 이것을 정말로 자라게 하시지 않겠습니까?
  to: 내 집은 하나님 앞에서 이와 같지 않습니다[a]. 이는 그분께서 나를 위하여 영원한 언약을 세우셨기 때문입니다. 그 언약은 모든 면에서 잘 갖추어져 있고 보존되어 있습니다[b]. 이것이 나의 모든 구원이며 나의 모든 소원입니다. 그분께서 그것을 자라게 하시지 않겠습니까?
  rationale: 원문의 부정형과 마지막 절의 논쟁적 수사 의문을 유지했습니다. 동시에 한국어에서는 어색한 ‘하나님과 함께 그렇지 않다’를 ‘하나님 앞에서 이와 같지 않다’로 다듬고, 언약의 질서성과 보존 상태를 자연스러운 완결 문장으로 옮겼습니다. 각주는 각각 첫 절의 긍정 수사 의문 대안과 마지막 절의 강한 긍정 진술 대안을 정확히 연결합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:45:02Z'
