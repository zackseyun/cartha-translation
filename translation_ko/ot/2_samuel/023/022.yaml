id: 2SA.23.22
reference: 2 Samuel 23:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֣לֶּה עָשָׂ֔ה בְּנָיָ֖הוּ בֶּן יְהוֹיָדָ֑ע וְ/ל/וֹ שֵׁ֖ם בִּ/שְׁלֹשָׁ֥ה הַ/גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/022.yaml
  text: These things Benaiah son of Jehoiada did[b][a], and he had a name among the three mighty men.
  footnotes:
  - marker: a
    text: Or 'and he was renowned among the three mighty men.' The Hebrew idiom is literally 'and he had a name.'
    reason: lexical_alternative
  - marker: b
    text: Some interpreters understand this in light of the larger list of David's warriors and compare readings involving 'the thirty'; the Hebrew text here reads 'the three.'
    reason: textual_variant
translation:
  language: ko
  text: 이러한 일들을 브나야가 여호야다의 아들이 행했습니다. 그는 세 명의 용사들 가운데서 이름이 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 세 명의 용사들 가운데서 명성이 있었습니다.’ 히브리어 관용구는 문자적으로 ‘그에게 이름이 있었다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 해석자들은 다윗의 용사 목록 전체를 염두에 두고 ‘서른 명’을 관련 본문과 비교합니다. 그러나 여기의 히브리어 본문은 ‘세 명’을 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  english_pob_choice: These things did
  chosen_korean: 이러한 일들을 … 행했습니다
  alternatives_korean:
  - 이 일들을 … 했습니다
  - 이러한 것들을 … 했습니다
  lexicon: HALOT
  rationale: 앞 절의 업적을 가리키는 재지시를 한국어에서 자연스럽게 살리기 위해 ‘이러한 일들’로 풀고, עָשָׂה는 문맥상 업적 수행을 드러내는 ‘행하다’로 옮겼습니다.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  english_pob_choice: Benaiah son of Jehoiada
  chosen_korean: 브나야가 여호야다의 아들
  alternatives_korean:
  - 브나야, 여호야다의 아들
  - 브나야 여호야다의 아들
  lexicon: SBLGNT/HALOT proper-name transliteration convention
  rationale: 고유명사는 현대 외래어 표기 원칙에 따라 옮기고, 히브리어 소유·계보 관계는 ‘~의 아들’로 자연스럽게 표현했습니다.
- source_word: וְלוֹ שֵׁם
  english_pob_choice: and he had a name
  chosen_korean: 그는 … 이름이 있었습니다
  alternatives_korean:
  - 그는 … 명성이 있었습니다
  - 그는 … 이름을 가졌습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그에게 이름이 있었다’는 관용구로, 영어 POB가 보존한 히브리어 관용을 한국어에서도 ‘이름이 있다’로 살려 ‘명성이 있었다’로 평탄화하지 않았습니다.
- source_word: בִּשְׁלֹשָׁה הַגִּבֹּרִים
  english_pob_choice: among the three mighty men
  chosen_korean: 세 명의 용사들 가운데서
  alternatives_korean:
  - 세 용사들 가운데서
  - 세 명의 용사 가운데서
  - 서른 명의 용사들 가운데서
  lexicon: HALOT
  rationale: 본문의 수사는 히브리어 본문대로 ‘셋’을 따르고, הַגִּבֹּרִים는 다윗의 정예 전사들을 가리키는 일반적 용례에 따라 ‘용사들’로 옮겼습니다.
theological_decisions:
- issue: וְלוֹ שֵׁם의 관용구 처리
  chosen_reading: ‘이름이 있었습니다’로 옮겨 평판/명성의 함의를 암시하되, 본문의 문자적 표현을 유지했습니다.
  alternative_readings:
  - ‘명성이 있었습니다’
  - ‘널리 알려졌습니다’
  rationale: 문맥상 칭송의 의미가 분명하지만, 히브리어의 직접적 관용을 지우지 않기 위해 직역적 표현을 유지했습니다.
  doctrine_reference: 성경 번역의 문체와 관용구 보존 원칙
- issue: ‘셋’과 관련된 본문 수치 유지
  chosen_reading: 본문의 ‘세 명’ 표기를 유지했습니다.
  alternative_readings:
  - ‘서른 명’으로 조정
  rationale: 주석상 다른 독법이 언급되더라도, 현재 WLC 본문은 ‘셋’을 지지하므로 본문 번역은 그 수를 보존해야 합니다.
  doctrine_reference: 본문 비평과 원문 우선 번역 원칙
