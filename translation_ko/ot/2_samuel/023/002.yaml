  text: ר֥וּחַ יְהוָ֖ה דִּבֶּר בִּ֑/י וּ/מִלָּת֖/וֹ עַל לְשׁוֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/002.yaml
  text: The Spirit of Yahweh spoke by me[a], and his word was on my tongue.
  footnotes:
  - marker: a
    text: Or 'spoke through me.' The Hebrew preposition can express instrumentality here.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 영이 내게 말씀하셨고, 그의 말씀이 내 혀 위에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 통해 말씀하셨고’. 히브리어 전치사 בּ는 여기서 도구·매개의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֥וּחַ יְהוָ֖ה
  english_pob_choice: The Spirit of Yahweh
  chosen_korean: 야훼의 영
  alternatives_korean:
  - 야훼의 숨
  - 야훼의 바람
  lexicon: HALOT
  rationale: 이 문맥은 예언적 발화의 근원인 하나님의 인격적 사역을 가리키므로, רוּחַ를 ‘영’으로 옮겨 발화 주체성을 살렸습니다. יְהוָה는 본 프로젝트 기본어인 ‘야훼’로 옮겼습니다.
- source_word: דִּבֶּר
  english_pob_choice: spoke
  chosen_korean: 말씀하셨고
  alternatives_korean:
  - 말하셨고
  - 이르셨고
  lexicon: HALOT
  rationale: 단순 과거의 ‘spoke’에 해당하며, 한국어에서는 예언적·신적 발화의 무게를 살리기 위해 ‘말씀하다’를 썼습니다.
- source_word: בִּי
  english_pob_choice: by me
  chosen_korean: 내게
  alternatives_korean:
  - 나를 통해
  - 내 안에서
  lexicon: HALOT
  rationale: ב의 도구적 의미를 한국어에서 가장 간결하게 드러내는 표현은 ‘내게’입니다. ‘나를 통해’는 가능한 풀이지만 원문의 구조를 다소 풀어 쓴 표현이어서 본문에서는 절제했습니다.
- source_word: עַל לְשׁוֹנִי
  english_pob_choice: was on my tongue
  chosen_korean: 내 혀 위에 있었습니다
  alternatives_korean:
  - 내 혀에 있었습니다
  - 내 입에 있었습니다
  lexicon: HALOT
  rationale: 직역에 가까운 ‘혀 위에’가 히브리어의 이미지를 가장 잘 보존합니다. ‘입에’는 관용적으로 자연스럽지만 원문의 공간적 표현을 약화합니다.
theological_decisions:
- issue: 예언적 영감의 표현에서 רוּחַ의 번역
  chosen_reading: ‘영’으로 번역해 야훼의 말씀하시는 주체성을 드러냈습니다.
  alternative_readings:
  - ‘바람’
  - ‘숨’
  rationale: 이 구절은 다윗의 최종 예언적 발화의 서두로, 자연현상보다 하나님의 영의 말하심을 가리키는 흐름이 분명합니다. 따라서 인격적·계시적 의미를 보존하는 ‘영’이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve source text''s plain sense; do not import doctrinal claims the text does not make'
- issue: 야훼의 말씀과 선지자/왕의 매개성
  chosen_reading: ‘내게 말씀하셨고’로 옮겨, 발화의 근원이 야훼이지만 매개된 예언 발화임을 유지했습니다.
  alternative_readings:
  - ‘나를 통해 말씀하셨고’
  - ‘나 안에서 말씀하셨고’
  rationale: 히브리어 전치사 בִּי의 도구적 뉘앙스는 인정하되, 본문은 말의 출처와 매개를 동시에 보여 줍니다. 본문에서는 직접성과 간결함을 우선하고, 대안 독법은 주석으로 남깁니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve source text''s plain sense; do not import doctrinal claims the text does not make'
