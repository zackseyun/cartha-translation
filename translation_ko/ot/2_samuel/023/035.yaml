id: 2SA.23.35
reference: 2 Samuel 23:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חצרו הַֽ/כַּרְמְלִ֔י פַּעֲרַ֖י הָ/אַרְבִּֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/035.yaml
  text: Hezro the Carmelite[a], Paarai the Arbite[c][b];
  footnotes:
  - marker: a
    text: Or 'Hazro' for the first name.
    reason: lexical_alternative
  - marker: b
    text: '''Carmelite'' here means a man from Carmel, not a member of the later Carmelite order.'
    reason: cultural_note
  - marker: c
    text: Or 'the man from Arab' for 'the Arbite.'
    reason: lexical_alternative
translation:
  language: ko
  text: 헤스로, 갈멜 사람인 파아라이, 아르바 사람입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헤스로’는 히브리어 자음열의 다른 음역 가능성인 ‘하즈로’도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘갈멜 사람’은 후대의 수도회 ‘갈멜회’가 아니라 갈멜 출신 사람이라는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: ‘아르바 사람’은 ‘아랍 사람’이 아니라 아르/아랍 계열의 지명에서 온 출신 표지일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חצרו
  english_pob_choice: Hezro
  chosen_korean: 헤스로
  alternatives_korean:
  - 하즈로
  lexicon: HALOT
  rationale: 고유명사이므로 음역을 따르되, POB의 표준 영어형 Hezro에 맞춰 한국어도 ‘헤스로’로 옮겼습니다.
- source_word: הַכַּרְמְלִי
  english_pob_choice: the Carmelite
  chosen_korean: 갈멜 사람인
  alternatives_korean:
  - 갈멜 출신의
  - 갈멜 사람
  lexicon: HALOT
  rationale: -י 형용사는 ‘갈멜 사람’이라는 출신 표지이므로, 종교단체 이름이 아니라 지명 유래임을 드러내기 위해 ‘갈멜 사람인’으로 옮겼습니다.
- source_word: פַּעֲרַי
  english_pob_choice: Paarai
  chosen_korean: 파아라이
  alternatives_korean:
  - 파아리
  lexicon: HALOT
  rationale: 고유명사이므로 음역하였고, POB의 Paarai를 반영해 장모음 감각을 살려 ‘파아라이’로 적었습니다.
- source_word: הָאַרְבִּי
  english_pob_choice: the Arbite
  chosen_korean: 아르바 사람
  alternatives_korean:
  - 아르비 사람
  - 아랍 사람
  lexicon: HALOT
  rationale: 문맥상 혈통·출신 표지를 가진 지명형이므로 ‘~사람’으로 풀어, POB가 제시한 ‘the man from Arab’의 가능성을 한국어에서 자연스럽게 반영했습니다.
theological_decisions:
- issue: 군사 명단의 간결한 표기와 출신 표지 처리
  chosen_reading: 이 절은 서술이 아니라 용사 명단이므로, 이름과 출신 표지를 간결하게 나열하는 형식을 유지했습니다.
  alternative_readings:
  - 문장형으로 풀어 ‘헤스로는 갈멜 사람이고, 파아라이는 아르바 사람입니다’라고 서술하기
  - 모든 항목을 쉼표만으로 나열하기
  rationale: 원문의 명단체를 보존해야 인물 목록의 기능과 리듬이 살아나므로, 한국어에서도 최소한의 서술 연결만 사용했습니다.
  doctrine_reference: 본문 기능 보존
