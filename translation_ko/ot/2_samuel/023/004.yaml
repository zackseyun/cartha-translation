  text: he is like the light of morning when the sun rises[a], a morning without clouds; from brightness, from rain[b], grass from the earth.
  footnotes:
  - marker: a
    text: Or, more literally, 'and like the light of morning.' The Hebrew line is elliptical and continues the description of the ruler in the previous verse.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from brightness, from rain, grass from the earth'—a compressed poetic image of new growth appearing after rain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 해가 떠오르는 구름 없는 아침의 빛과 같습니다.[a] 밝음과 비로 땅에서 풀이 돋아납니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직전 절의 통치자에 대한 묘사를 이어 가는 생략적 시어입니다. 직역하면 ‘그리고 아침의 빛처럼, 해가 떠오를 때, 구름 없는 아침처럼’입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 직역하면 ‘밝음으로부터, 비로부터, 땅에서 풀’이라는 압축된 시어입니다. 이를 비 뒤에 풀이 돋는 모습으로 이해할 수도 있습니다.
    reason: lexical_alternative
