  doctrine_reference: Translation philosophy §1, §6
- issue: 마지막 연쇄 이미지의 의미
  chosen_reading: 비 뒤에 풀이 돋아나는 새 생명의 장면으로 옮겼습니다.
  alternative_readings:
  - ‘빛남에서, 비에서, 풀’처럼 더 직역할 수 있습니다.
  rationale: 히브리어의 압축된 병렬은 새 성장의 이미지를 전달하므로, 한국어에서는 그 효과가 드러나게 하되 원문의 비유를 훼손하지 않았습니다.
