source:
  edition: WLC
  text: וּ/כְ/א֥וֹר בֹּ֖קֶר יִזְרַח שָׁ֑מֶשׁ בֹּ֚קֶר לֹ֣א עָב֔וֹת מִ/נֹּ֥גַהּ מִ/מָּטָ֖ר דֶּ֥שֶׁא מֵ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/004.yaml
  text: he is like the light of morning when the sun rises[a], a morning without clouds; from brightness, from rain[b], grass from the earth.
  footnotes:
  - marker: a
    text: Or, more literally, 'and like the light of morning.' The Hebrew line is elliptical and continues the description of the ruler in the previous verse.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from brightness, from rain, grass from the earth'—a compressed poetic image of new growth appearing after rain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아침 햇빛 같고, 해가 떠오를 때의 아침 같으며, 구름 없는 아침과 같습니다. 빛남 뒤에, 비 뒤에, 땅에서 풀이 돋아납니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 생략된 연결을 지닌 압축된 시어라서, 직전 절의 통치자를 이어받아 읽어야 합니다.
    reason: source_note
  - marker: b
    text: ‘비 뒤에 풀이 돋아남’이라는 새 생명의 이미지를 드러내기 위한 풀어쓴 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְא֥וֹר
  english_pob_choice: he is like the light
  chosen_korean: 그는 아침 햇빛 같고
  alternatives_korean:
  - 그는 빛 같고
  - 아침의 빛과 같고
  lexicon: HALOT
  rationale: 비교 접속사 כ의 비유를 살리되, 앞선 문맥의 ‘그’가 이어진다는 점을 한국어에서 자연스럽게 드러내기 위해 주어를 보충했습니다.
- source_word: בֹּ֖קֶר יִזְרַח שָׁ֑מֶשׁ
  english_pob_choice: when the sun rises
  chosen_korean: 해가 떠오를 때의 아침
  alternatives_korean:
  - 해가 떠오르는 아침
  - 해가 비치는 아침
  lexicon: HALOT
  rationale: יִזְרַח은 ‘빛나다/떠오르다’의 의미를 가지므로, 현대 한국어의 자연스러운 시간 표현으로 옮겼습니다.
- source_word: בֹּ֚קֶר לֹ֣א עָב֔וֹת
  english_pob_choice: a morning without clouds
  chosen_korean: 구름 없는 아침
  alternatives_korean:
  - 구름이 없는 아침
  - 먹구름 없는 아침
  lexicon: HALOT
  rationale: עָבוֹת은 구름무리를 가리키므로, 시적 이미지를 살려 간결하게 옮겼습니다.
- source_word: מִ/נֹּ֥גַהּ מִ/מָּטָ֖ר דֶּ֥שֶׁא
  english_pob_choice: from brightness, from rain, grass
  chosen_korean: 빛남 뒤에, 비 뒤에, 땅에서 풀이 돋아납니다.
  alternatives_korean:
  - 밝음에서, 비에서, 풀이 땅에서 돋아납니다.
  - 빛남에서, 비에서, 풀은 땅에서 납니다.
  lexicon: HALOT
  rationale: 문장의 압축된 전치사 연쇄를 그대로 풀기보다, 한국어에서 ‘~뒤에’로 시간적·상황적 연속을 드러내어 ‘비 후의 새싹’이라는 시적 효과를 살렸습니다. דֶּשֶׁא은 단순한 풀이 아니라 돋아나는 새풀의 뉘앙스를 갖습니다.
- source_word: מֵ/אָֽרֶץ
  english_pob_choice: from the earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅으로부터
  - 대지에서
  lexicon: HALOT
  rationale: אָרֶץ는 여기서 풀이 솟는 토양/땅을 가리키므로, 현대 한국어에서 가장 자연스러운 장소 출발 표현으로 옮겼습니다.
theological_decisions:
- issue: 2사무엘 23:4의 생략된 주어 처리
  chosen_reading: 문맥상 3절의 의로운 통치자를 이어받아 한국어에서 ‘그는’으로 명시했습니다.
  alternative_readings:
  - 주어를 생략해 ‘아침 햇빛 같고…’로 시작할 수 있습니다.
  rationale: 히브리어는 생략적이지만, 직전 문맥의 대상을 독자가 놓치지 않도록 최소한의 보충을 했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 마지막 연쇄 이미지의 의미
  chosen_reading: 비 뒤에 풀이 돋아나는 새 생명의 장면으로 옮겼습니다.
  alternative_readings:
  - ‘빛남에서, 비에서, 풀’처럼 더 직역할 수 있습니다.
  rationale: 히브리어의 압축된 병렬은 새 성장의 이미지를 전달하므로, 한국어에서는 그 효과가 드러나게 하되 원문의 비유를 훼손하지 않았습니다.
  doctrine_reference: Translation philosophy §6
