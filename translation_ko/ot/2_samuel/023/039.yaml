lexical_decisions:
- source_word: אֽוּרִיָּה
  english_pob_choice: Uriah
  chosen_korean: 우리야
  alternatives_korean:
  - 우리아
  lexicon: 고유명사
  rationale: 히브리어 고유명사는 음역하는 것이 원문을 가장 직접적으로 반영하므로, 통용되는 성서형식인 ‘우리야’를 사용했습니다.
- source_word: הַחִתִּי
  english_pob_choice: the Hittite
  chosen_korean: 헷 사람
  alternatives_korean:
  - 헷 족속 사람
  - 히타이트 사람
  lexicon: HALOT
  rationale: 히브리어의 민족·출신 표지를 한국어 성서체에서는 자연스럽게 ‘헷 사람’으로 옮기는 것이 가장 간결하고 원문과도 잘 맞습니다.
- source_word: כֹּל
  english_pob_choice: in all
  chosen_korean: 모두
  alternatives_korean:
  - 총계는
  - 합계로
  lexicon: HALOT
  rationale: 끝맺는 총합 표현이므로, 영어 POB의 ‘in all’에 해당하는 요약 기능을 살려 ‘모두’로 옮겼습니다.
- source_word: שְׁלֹשִׁים וְשִׁבְעָה
  english_pob_choice: thirty-seven
  chosen_korean: 서른일곱 명
  alternatives_korean:
  - 37명
  - 서른일곱
  lexicon: HALOT
  rationale: 앞선 명단의 총인원을 가리키므로 한국어에서는 셈의 단위를 밝혀 ‘명’을 보태는 것이 문맥상 분명합니다.
