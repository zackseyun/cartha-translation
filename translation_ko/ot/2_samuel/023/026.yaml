lexical_decisions:
- source_word: חֶלֶץ
  english_pob_choice: Helez
  chosen_korean: 헬레스
  alternatives_korean:
  - 헤레츠
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 한국어 표기는 현대 외래어 표기식으로 옮겼습니다.
- source_word: הַפַּלְטִי
  english_pob_choice: the Paltite
  chosen_korean: 파르티 사람
  alternatives_korean:
  - 팔트 사람
  - 펠로니 사람
  lexicon: HALOT
  rationale: 영어 POB의 핵심 판독인 Paltite를 따라 지명/소속을 나타내는 형용사구로 옮겼습니다. ‘사람’은 소속을 자연스럽게 드러냅니다.
- source_word: עִירָא
  english_pob_choice: Ira
  chosen_korean: 이라
  alternatives_korean:
  - 이라
  lexicon: HALOT
  rationale: 고유명사를 음역했습니다.
- source_word: בֶן
  english_pob_choice: son of
  chosen_korean: 이궤스의 아들
  alternatives_korean:
  - ~의 아들
  lexicon: HALOT
  rationale: 족보 표지로서의 בֶן을 한국어의 자연스러운 친족 표지인 ‘~의 아들’로 옮겼습니다.
- source_word: הַתְּקוֹעִי
  english_pob_choice: the Tekoite
  chosen_korean: 드고아 사람
  alternatives_korean:
  - 드고아 출신
  lexicon: HALOT
  rationale: 테코아/드고아의 출신 표지를 나타내는 형용사형이므로, 간결하게 ‘드고아 사람’으로 옮겼습니다.
theological_decisions:
- issue: 족보·명부 문체의 압축성 유지
  chosen_reading: 이 구절은 인명과 출신 표지를 나열하는 명부 문체이므로, 한국어도 서술을 덧붙이지 않고 압축적으로 유지했습니다.
  alternative_readings:
  - 문장형으로 풀어쓴 번역
  - 설명적 부연을 넣은 번역
  rationale: 원문은 인물 식별을 위한 명부이므로, 과잉 설명보다 원문의 간결한 열거 구조를 보존하는 것이 적절합니다.
  doctrine_reference: 성경 본문 장르 보존 원칙
