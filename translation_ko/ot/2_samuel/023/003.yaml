id: 2SA.23.3
reference: 2 Samuel 23:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָמַר֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לִ֥/י דִבֶּ֖ר צ֣וּר יִשְׂרָאֵ֑ל מוֹשֵׁל֙ בָּ/אָדָ֔ם צַדִּ֕יק מוֹשֵׁ֖ל יִרְאַ֥ת אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/003.yaml
  text: 'The God of Israel has spoken[a]; the Rock of Israel has said to me: One who rules over mankind justly, ruling in the fear of God[b],'
  footnotes:
  - marker: a
    text: Or 'over humankind.' Hebrew 'man' (אָדָם) can function representatively for humanity.
    reason: lexical_alternative
  - marker: b
    text: This line may also be understood with messianic significance, as an ideal description of the king ultimately fulfilled in the Messiah.
    reason: alternative_reading
translation:
  language: ko
  text: '이스라엘의 하나님께서 말씀하셨습니다. 이스라엘의 반석께서 내게 말씀하셨습니다: “사람을[a] 의롭게 다스리고 하나님을 경외하며 다스리는 이[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인류를’. 히브리어 ‘사람’(אָדָם)은 인류 전체를 대표하는 뜻으로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 메시아적 의미로도 이해될 수 있으며, 궁극적으로 메시아에게서 성취되는 이상적 왕의 묘사로 볼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר / דִבֶּר
  english_pob_choice: has spoken / has said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 두 동사가 병렬로 나오지만, 한국어에서는 하나의 존대 동사로 묶어 예언적 선언의 엄숙함을 살리는 편이 자연스럽습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל / צוּר יִשְׂרָאֵל
  english_pob_choice: The God of Israel / the Rock of Israel
  chosen_korean: 이스라엘의 하나님 / 이스라엘의 바위
  alternatives_korean:
  - 이스라엘의 하나님 / 이스라엘의 반석
  - 이스라엘의 하나님 / 이스라엘의 요새
  lexicon: HALOT
  rationale: אֱלֹהֵי יִשְׂרָאֵל은 표준적으로 ‘이스라엘의 하나님’으로 옮기고, צוּר는 비유적 신칭을 살려 ‘바위’로 직역했습니다. 교회적 관용어인 ‘반석’도 가능하지만, 본문이 의도하는 이미지의 직접성을 유지하려고 ‘바위’를 택했습니다.
- source_word: מוֹשֵׁל בָּאָדָם צַדִּיק
  english_pob_choice: One who rules over mankind justly
  chosen_korean: 사람들 위에 의롭게 다스리는 이
  alternatives_korean:
  - 인류를 의롭게 다스리는 이
  - 사람을 공의롭게 통치하는 이
  lexicon: HALOT
  rationale: 분사 موֹשֵׁל의 일반적/원리적 힘을 살려 ‘다스리는 이’로 옮겼고, בָּאָדָם은 대표적 집합 의미를 반영해 ‘사람들’로 처리했습니다. צַדִּיק은 이 압축된 시구에서 형용사보다 부사적으로 기능하므로 ‘의롭게’가 가장 자연스럽습니다.
- source_word: מוֹשֵׁל יִרְאַת אֱלֹהִים
  english_pob_choice: ruling in the fear of God
  chosen_korean: 하나님을 경외하며 다스리는 이
  alternatives_korean:
  - 하나님 경외 가운데 다스리는 이
  - 하나님을 두려워하며 다스리는 이
  lexicon: HALOT
  rationale: יִרְאַת אֱלֹהִים은 단순한 공포가 아니라 경건한 경외를 뜻하므로 ‘경외하다’를 선택했습니다. 두 번째 분사구도 첫 구와 평행하게 인격적 특성을 나타내므로 ‘다스리는 이’로 유지했습니다.
theological_decisions:
- issue: 2절 병행구의 이상적 통치자 묘사와 메시아적 독법
  chosen_reading: 주된 본문은 일반 원리로서의 의로운 통치를 드러내되, 메시아적 성취 가능성은 본문 밖 해석으로 남겨 둡니다.
  alternative_readings:
  - 메시아에게서 궁극적으로 성취되는 예언적 묘사
  rationale: 히브리어 자체는 메시아를 명시하지 않고 이상적 왕권의 원리를 진술하므로, 본문에서는 그 긴장을 유지하는 편이 소스에 더 충실합니다.
  doctrine_reference: 해석의 긴장을 보존하고 본문이 직접 말하는 범위를 넘지 않음
