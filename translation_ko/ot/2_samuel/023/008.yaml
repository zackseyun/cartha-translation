source:
  edition: WLC
  text: אֵ֛לֶּה שְׁמ֥וֹת הַ/גִּבֹּרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑ד יֹשֵׁ֨ב בַּשֶּׁ֜בֶת תַּחְכְּמֹנִ֣י רֹ֣אשׁ הַ/שָּׁלִשִׁ֗י ה֚וּא עֲדִינ֣/וֹ ה/עצנ/ו עַל שְׁמֹנֶ֥ה מֵא֛וֹת חָלָ֖ל בְּ/פַ֥עַם אחד׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/008.yaml
  text: 'These are the names of the mighty men who belonged to David: Josheb-basshebeth[a], a Tahkemonite, chief of the Three. He was Adino the Eznite[c][b], who wielded his spear against eight hundred slain at one time.'
  footnotes:
  - marker: a
    text: The Hebrew text of this verse is difficult. 'Josheb-basshebeth' follows the Masoretic Text; the parallel in 1 Chronicles 11:11 reads 'Jashobeam, a Hachmonite.'
    reason: textual_variant
  - marker: b
    text: Or 'chief of the thirty,' according to some ancient witnesses and interpreters; the Masoretic Text reads 'chief of the Three.'
    reason: alternative_reading
  - marker: c
    text: Hebrew 'Adino the Eznite,' a very difficult phrase. Many understand it instead as something like 'he wielded his spear' or 'he brandished his spear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 다윗에게 속한 용사들의 이름입니다. 요셉바세벳[a], 다핵몬 사람, 곧 세 사람의 우두머리였습니다. 그는 아디노 곧 에스니 사람[c][b]으로서, 한 번에 팔백 명의 죽은 자를 향해 자기 창을 휘둘렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 난해합니다. 이 이름은 마소라 본문을 따른 것이며, 1역대상 11:11의 평행 본문에는 ‘야쇼브암, 하학몬 사람’으로 나옵니다.
    reason: textual_variant
  - marker: b
    text: 어떤 고대 증인들과 해석자들은 이를 ‘삼십 명의 우두머리’로 읽기도 합니다. 그러나 마소라 본문은 ‘세 사람의 우두머리’로 읽습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 ‘아디노 에스니 사람’은 매우 난해한 표현입니다. 많은 해석자들은 이를 ‘그가 자기 창을 휘둘렀다’는 뜻의 동사구로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּבֹּרִים
  english_pob_choice: the mighty men
  chosen_korean: 용사들
  alternatives_korean:
  - 강한 사람들
  - 용맹한 사람들
  lexicon: HALOT
  rationale: 문맥상 다윗의 정예 전사 집단을 가리키므로, 한국어에서는 자연스럽고 관용적인 ‘용사들’이 가장 잘 대응합니다.
- source_word: לְדָוִד
  english_pob_choice: who belonged to David
  chosen_korean: 다윗에게 속한
  alternatives_korean:
  - 다윗의
  - 다윗과 함께한
  lexicon: HALOT
  rationale: לְ + 인명은 소속·귀속 관계를 나타내므로, 소유격보다 관계를 분명히 보이는 ‘~에게 속한’이 본문 의도를 잘 살립니다.
- source_word: יֹשֵׁב בַּשֶּׁבֶת תַּחְכְּמֹנִי
  english_pob_choice: Josheb-basshebeth ... a Tahkemonite
  chosen_korean: 요셉바세벳, 다핵몬 사람
  alternatives_korean:
  - 요셉바세벳, 다핵몬인
  - 앉은 자, 다핵몬 사람
  lexicon: HALOT
  rationale: 마소라 본문의 난해함을 따라 고유명사처럼 음역하되, 종족/출신 표지는 한국어에서 자연스러운 ‘~사람’으로 옮겼습니다.
- source_word: רֹאשׁ הַשָּׁלִשִׁי
  english_pob_choice: chief of the Three
  chosen_korean: 세 사람의 우두머리
  alternatives_korean:
  - 세 사람의 두목
  - 삼인의 우두머리
  lexicon: HALOT
  rationale: ‘Three’는 엘리트 전사 집단을 가리키는 고유 집합 표현이므로, 직역보다 의미가 드러나는 ‘세 사람’과 ‘우두머리’가 적절합니다.
- source_word: עֲדִינוֹ הָעֶצְנוֹ
  english_pob_choice: Adino the Eznite
  chosen_korean: 아디노 곧 에스니 사람
  alternatives_korean:
  - 아디노 에스니 사람
  - 아디노 곧 창을 휘두른 사람
  lexicon: HALOT
  rationale: 본문의 이 구절은 매우 난해하므로, POB처럼 본문 형태를 최대한 보존하는 방향으로 음역을 유지했습니다.
- source_word: עַל שְׁמֹנֶה מֵאוֹת חָלָל
  english_pob_choice: against eight hundred slain
  chosen_korean: 팔백 명의 죽은 자를 향해
  alternatives_korean:
  - 팔백 명에게
  - 팔백 명을 향하여
  lexicon: HALOT
  rationale: חָלָל은 ‘죽임을 당한 자/죽은 자’의 뜻이므로, 전투 상황에서 상대를 향한 행동이라는 점을 살려 ‘향해’로 옮겼습니다.
- source_word: בְּפַעַם אֶחָד
  english_pob_choice: at one time
  chosen_korean: 한 번에
  alternatives_korean:
  - 한 차례에
  - 한번에
  lexicon: HALOT
  rationale: 관용적인 시간 표현이므로 한국어에서도 가장 자연스러운 ‘한 번에’를 사용했습니다.
theological_decisions:
- issue: 용사 명단의 서술 방식과 본문 난해 구절 처리
  chosen_reading: 본절은 전승상의 난해함을 드러내는 마소라 본문 형태를 유지하고, 의미가 분명한 전사 집단 정보는 자연스러운 현대 한국어로 풀어썼습니다.
  alternative_readings:
  - 1역대상 11:11과 맞춰 정리하는 조화 본문
  - 난해 구절을 동사구로 재구성하는 해석적 번역
  rationale: 이 절은 역사적 인명과 칭호가 얽혀 있어 본문 비평의 흔적을 지우지 않는 것이 중요합니다. 따라서 본문 형태를 보존하면서도 독자가 의미를 따라갈 수 있게 옮겼습니다.
  doctrine_reference: 본문비평/성경 번역 원칙
