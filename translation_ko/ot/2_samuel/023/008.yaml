review_pass:
  verdict: revise
  source_fidelity: 현 초안은 난해한 마소라 본문의 인명형 독법(‘아디노 에스니 사람’)을 유지하면서, 그와 양립하기 어려운 ‘자기 창을 휘둘렀습니다’라는 해석적 동사구를 본문에 함께 넣었습니다. 또한 ‘죽은 자를 향해 창을 휘둘렀습니다’는 한국어로 의미상 성립하기 어렵습니다. 히브리어의 ‘팔백 명의 죽임당한 자’와 ‘한 번에’는 문맥상 그가 한 차례에 팔백 명을 죽였다는 압축된 전승으로 최소한 보충해 옮기되, 창을 언급하는 대안은 각주에만 남겼습니다.
  naturalness: ‘다음은 … 이름입니다’와 ‘세 사람의 우두머리입니다’는 명단 도입부에 자연스럽고 현대적인 합쇼체입니다. ‘한 번에 팔백 명을 죽였습니다’는 원문의 난삽한 명사구를 한국어에서 이해 가능한 서술로 옮긴 것으로, 기존의 ‘죽은 자를 향해 … 휘둘렀습니다’보다 자연스럽습니다.
  terminology: גִּבֹּרִים은 ‘용사들’, לְדָוִד는 ‘다윗에게 속한’으로 유지했습니다. 난해한 고유명사는 음역하되, ‘타흐그모니’ 및 역대기 평행 본문의 ‘하크모니’는 히브리어 음가에 더 가깝게 정리했습니다. ‘세 사람’은 본문의 수 표현을 보존했으며, ‘삼십 명’ 대안은 각주로 유지했습니다.
  issues:
  - severity: high
    issue: 본문이 ‘아디노 에스니 사람’이라는 MT 인명형 독법과 ‘자기 창을 휘둘렀습니다’라는 대안적 동사구 해석을 동시에 채택합니다.
    rationale: 두 처리는 동일한 난해한 히브리어 구절에 대한 경쟁 독법을 혼합합니다. 영어 POB 본문도 같은 혼합을 보이지만, 한국어 본문에서는 이를 그대로 재현하지 않는 편이 원문 충실성에 더 안전합니다.
  - severity: high
    issue: ‘팔백 명의 죽은 자를 향해 자기 창을 휘둘렀습니다’는 의미적으로 부자연스럽습니다.
    rationale: חָלָל은 죽임당한 자를 가리키므로, 이미 죽은 사람들을 향해 공격했다는 표현이 됩니다. 문맥상 ‘한 번에 팔백 명을 죽였다’로 옮기는 것이 한국어 문장과 전쟁 서술의 의미를 살립니다.
  - severity: medium
    issue: 각주 b의 표지가 관련 구절인 ‘세 사람의 우두머리’ 뒤가 아니라 ‘에스니 사람’ 뒤에 놓여 있습니다.
    rationale: 각주 표지는 해당 독법 바로 뒤에 두어 독자가 ‘삼십 명’ 대안이 우두머리 칭호에 관한 것임을 알 수 있어야 합니다.
  - severity: low
    issue: ‘하학몬 사람’ 음역은 영어 감사 기록의 Hachmonite 및 히브리어 חכמוני와 잘 맞지 않습니다.
    rationale: ‘하크모니 사람’으로 정리하면 평행 본문의 고유명사 음역을 더 일관되게 제시할 수 있습니다.
  revised_text: 다음은 다윗에게 속한 용사들의 이름입니다. 요셉바셰벳[a], 타흐그모니 사람, 세 사람의 우두머리입니다[b]. 그는 아디노 에스니 사람이었으며[c], 한 번에 팔백 명을 죽였습니다.
  revised_footnotes:
  - marker: a
    text: 히브리어 본문은 난해합니다. ‘요셉바셰벳’은 마소라 본문을 따른 것이며, 1역대상 11:11의 평행 본문에는 ‘야쇼브암, 하크모니 사람’으로 나옵니다.
    reason: textual_variant
  - marker: b
    text: 어떤 고대 증인들과 해석자들은 이를 ‘삼십 명의 우두머리’로 읽기도 합니다. 그러나 마소라 본문은 ‘세 사람의 우두머리’로 읽습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 ‘아디노 에스니 사람’은 매우 난해한 표현입니다. 많은 해석자들은 이 구절을 고유명사가 아니라 ‘그가 창을 휘둘렀다’ 또는 ‘그가 창을 내둘렀다’와 같은 동사구로 이해합니다.
    reason: lexical_alternative
  revision_rationale: 마소라 본문의 인명형 독법을 본문에서 보존하고, 창을 휘두른다는 경쟁 해석은 각주로 한정했습니다. 이어지는 ‘팔백 명의 죽임당한 자’와 ‘한 번에’는 한국어의 필수 서술 구조상 ‘팔백 명을 죽였습니다’로 최소 보충했습니다. 또한 각주 b의 위치를 바로잡고, 고유명사 음역과 평행 본문 표기를 정리했습니다.
