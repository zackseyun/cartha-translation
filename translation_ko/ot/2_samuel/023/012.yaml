  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתְיַצֵּ֤ב בְּ/תוֹךְ הַֽ/חֶלְקָה֙ וַ/יַּצִּילֶ֔/הָ וַ/יַּ֖ךְ אֶת פְּלִשְׁתִּ֑ים וַ/יַּ֥עַשׂ יְהוָ֖ה תְּשׁוּעָ֥ה גְדוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/012.yaml
  text: But he took his stand in the middle of the field and defended it[a], and struck down the Philistines; and Yahweh brought about a great victory.
  footnotes:
  - marker: a
    text: Or 'a great deliverance' or 'a great salvation.' The Hebrew term can carry any of these senses; here it refers to the LORD's saving action in battle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 밭 한가운데에 자리를 잡고 그것을 구해 내며, 블레셋 사람들을 쳤습니다. 그리고 야훼께서 큰 구원을 이루셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 구출’, ‘큰 승리’. 히브리어 תְּשׁוּעָה는 여기서 전투 속 구원 행위를 가리키며, 승리·구원·구출의 뜻을 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצֵּב
  english_pob_choice: took his stand
  chosen_korean: 자리를 잡고
  alternatives_korean:
  - 자기 자리에 섰고
  - 굳게 서서
  lexicon: HALOT
  rationale: 히트파엘형은 단순히 서 있다는 뜻보다 의도적으로 자리를 잡아 맞서는 뉘앙스가 있어, 군사적 문맥에 맞게 자연스럽게 옮겼습니다.
- source_word: בְּתוֹךְ הַחֶלְקָה
  english_pob_choice: in the middle of the field
  chosen_korean: 밭 한가운데에
  alternatives_korean:
  - 그 밭 가운데에
  - 그 땅 한복판에
  lexicon: HALOT
  rationale: חֶלְקָה는 본문 문맥에서 전투 현장의 ‘밭/땅’으로 읽는 것이 자연스러워, 위치 표현 בְּתוֹךְ는 ‘한가운데에’로 간결하게 살렸습니다.
- source_word: וַיַּצִּילֶהָ
  english_pob_choice: defended it
  chosen_korean: 그것을 구해 내며
  alternatives_korean:
  - 그것을 지켜 내며
  - 그것을 건져 내며
  - 그것을 구출하며
  lexicon: HALOT
  rationale: נצל은 여기서 추상적 ‘구원’보다 적의 손에서 빼앗기지 않도록 구해 내는 의미가 강하므로, ‘구해 내다’로 옮겨 문맥의 방어적 구출감을 살렸습니다.
- source_word: תְּשׁוּעָה גְדוֹלָה
  english_pob_choice: a great victory
  chosen_korean: 큰 구원을
  alternatives_korean:
  - 큰 승리를
  - 큰 구출을
  - 큰 구해 내심을
  lexicon: HALOT
  rationale: תְּשׁוּעָה는 전투 맥락에서 승리로도 풀 수 있지만, 히브리어의 핵심 의미인 ‘구원/구출’을 보존하기 위해 ‘큰 구원’을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 표기를 한국어에서도 고유명사로 드러내기 위해 프로젝트 기본값인 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: תְּשׁוּעָה의 전투적 의미를 어떻게 드러낼지
  chosen_reading: 큰 구원
  alternative_readings:
  - 큰 승리
  - 큰 구출
  rationale: 이 절은 전투 승리를 말하지만, 결과를 야훼의 구원 행위로 돌리는 점이 핵심이므로 ‘구원’을 유지하되 문맥상 승리의 의미도 함께 전달되도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: source-language primacy and preservation of lexical tension'
