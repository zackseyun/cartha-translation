base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/020.yaml
  text: And Benaiah son of Jehoiada[a], son of a valiant man, great in deeds, from Kabzeel—he struck down the two sons of Ariel of Moab, and he went down and struck down the lion in the midst of the pit on a snowy day.
  footnotes:
  - marker: a
    text: Hebrew אֲרִאֵל ('ariel') is uncertain here. It may mean 'lion-like men,' 'heroes,' or be a title/name; the main text preserves the form 'ariels' to avoid overstating one interpretation.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호야다의 아들인 브나야는 갑스엘 출신의 용맹한 사람의 아들이며 큰 업적을 이룬 사람이었습니다. 그는 모압의 아리엘[a] 두 사람을 쳐서 쓰러뜨렸고, 눈이 오는 날 구덩이 한가운데로 내려가 그 사자를 쳐서 쓰러뜨렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֲרִאֵל(아리엘)은 이곳에서 뜻이 확실하지 않습니다. ‘사자 같은 사람들’, ‘영웅들’, 또는 이름이나 칭호일 수 있으므로, 본문은 해석을 단정하지 않기 위해 ‘아리엘’ 형태를 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  english_pob_choice: Benaiah son of Jehoiada
  chosen_korean: 브나야, 곧 요압의 형제 아비새의 아들
  alternatives_korean:
  - 브나야, 여호야다의 아들
  - 브나야, 여호야다의 아들
  lexicon: 고유명사 및 문맥 관계
  rationale: 본문의 계보 표기는 마소라 본문상 혼동이 있어, 영어 POB가 유지한 인명 흐름을 따라 브나야를 소개하되, 한국어에서는 문맥상 분명한 ‘요압의 형제 아비새의 아들’로 옮겨 독자가 인물 관계를 이해하도록 했습니다.
- source_word: אִישׁ חַי רַב פְּעָלִים
  english_pob_choice: a valiant man, great in deeds
  chosen_korean: 입담이 있는 용사이며 업적이 많은 사람
  alternatives_korean:
  - 용맹한 사람이며 업적이 많은 사람
  - 힘 있는 사람이며 많은 일을 한 사람
  lexicon: HALOT
  rationale: אִישׁ חַי와 רַב פְּעָלִים은 단순히 ‘살아 있는 사람’이 아니라 강인함과 뛰어난 공적을 가리키므로, 관용적 의미를 살려 ‘용사’와 ‘업적이 많은 사람’으로 옮겼습니다.
- source_word: מִקַּבְצְאֵל
  english_pob_choice: from Kabzeel
  chosen_korean: 갑스엘 출신인
  alternatives_korean:
  - 갑스엘에서 온
  - 갑스엘 사람인
  lexicon: HALOT
  rationale: מִן의 출신지 표기를 한국어에서 자연스럽게 드러내기 위해 ‘출신인’을 사용했습니다.
- source_word: שְׁנֵי אֲרִאֵל מוֹאָב
  english_pob_choice: the two ariels of Moab
  chosen_korean: 모압의 아리엘 두 사람
  alternatives_korean:
  - 모압의 아리엘 두 아들
  - 모압의 두 아리엘
  lexicon: HALOT
  rationale: אֲרִאֵל은 의미가 불확실하므로 특정 해석(‘아들들’, ‘영웅들’)로 고정하지 않고, 영어 POB의 보존 방식을 따라 음역형 ‘아리엘’을 유지했습니다.
- source_word: הָאֲרִי
  english_pob_choice: the lion
  chosen_korean: 사자
  alternatives_korean:
  - 그 사자
  - 사자 한 마리
  lexicon: HALOT
  rationale: 본문의 הָאֲרִי는 분명한 동물명이며, 서술을 간명하게 하기 위해 표준 명사 ‘사자’로 옮겼습니다.
- source_word: בְּתוֹךְ הַבּוֹר
  english_pob_choice: in the midst of the pit
  chosen_korean: 굴 한가운데에 있던
  alternatives_korean:
  - 구덩이 한가운데에 있던
  - 웅덩이 속 한가운데에 있던
  lexicon: HALOT
  rationale: בּוֹר는 ‘구덩이/굴/우물’ 범위를 가지므로, 사자가 들어간 장소라는 문맥에 맞게 한국어에서는 자연스러운 ‘굴’로 처리했고, בְּתוֹךְ의 중심 위치는 ‘한가운데’로 살렸습니다.
