revisions:
- from: 그리고 요압의 형제 아비새의 아들 브나야, 곧 입담이 있는 용사이며 업적이 많은 사람으로서 갑스엘 출신인 그가 모압의 아리엘 두 사람을 쳐 죽였습니다. 그가 내려가서 눈 오는 날 굴 한가운데에 있던 사자를 쳐 죽였습니다.[a]
  to: 여호야다의 아들인 브나야는 갑스엘 출신의 용맹한 사람의 아들이며 큰 업적을 이룬 사람이었습니다. 그는 모압의 아리엘[a] 두 사람을 쳐서 쓰러뜨렸고, 눈이 오는 날 구덩이 한가운데로 내려가 그 사자를 쳐서 쓰러뜨렸습니다.
