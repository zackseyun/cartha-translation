reference: 2 Samuel 23:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה דִּבְרֵ֥י דָוִ֖ד הָ/אַֽחֲרֹנִ֑ים נְאֻ֧ם דָּוִ֣ד בֶּן יִשַׁ֗י וּ/נְאֻ֤ם הַ/גֶּ֨בֶר֙ הֻ֣קַם עָ֔ל מְשִׁ֨יחַ֙ אֱלֹהֵ֣י יַֽעֲקֹ֔ב וּ/נְעִ֖ים זְמִר֥וֹת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/001.yaml
  text: 'Now these are the last words of David: An oracle of David son of Jesse[a], an oracle of the man raised on high, the anointed of the God of Jacob[c][b], and the sweet singer of Israel.'
  footnotes:
  - marker: a
    text: Or "utterance" or "declaration" for "oracle"; the Hebrew term is a formal speech marker often used in solemn or prophetic pronouncements.
    reason: lexical_alternative
  - marker: b
    text: Or "the Messiah of the God of Jacob"; Hebrew "the anointed of the God of Jacob." Here the phrase refers directly to David, though it carries royal-messianic resonance.
    reason: alternative_reading
  - marker: c
    text: Or "the pleasant singer of Israel's songs."
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 다윗의 마지막 말입니다. 이새의 아들 다윗의 신탁입니다[a]. 높은 곳으로 세움을 받은 사람, 야곱의 하나님께서 기름 부으신 이, 그리고 이스라엘의 아름다운 노래하는 사람입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말씀’, ‘선언’으로 옮길 수 있습니다. 여기서 נְאֻם은 엄숙한 예언적 발화 표지입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘의 노래들에 관한 아름다운 노래하는 사람’으로도 볼 수 있으나, 히브리어는 다윗을 이스라엘의 노래하는 사람으로 묘사합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְרֵי / הָאַחֲרֹנִים
  english_pob_choice: the last words
  chosen_korean: 마지막 말
  alternatives_korean:
  - 마지막 말씀
  - 마지막 언급
  lexicon: HALOT
  rationale: 문맥상 다윗의 종결 발언을 가리키므로, 현대 한국어에서는 자연스러운 ‘마지막 말’이 가장 직접적입니다.
- source_word: נְאֻם
  english_pob_choice: oracle
  chosen_korean: 신탁
  alternatives_korean:
  - 말씀
  - 선포
  - 오라클
  lexicon: HALOT
  rationale: 히브리어의 격식 있는 발화 표지를 살리되, 한국어 성경 문체에서 ‘신탁’이 예언적·엄숙한 발화의 성격을 잘 드러냅니다.
- source_word: מְשִׁיחַ
  english_pob_choice: the anointed
  chosen_korean: 기름 부으신 이
  alternatives_korean:
  - 메시아
  - 기름부음 받은 자
  - 기름 부음 받은 이
  lexicon: HALOT
  rationale: 여기서는 다윗 자신을 가리키는 서술적 표현이므로, 직함처럼 굳은 ‘메시아’보다 원뜻을 직접 드러내는 표현이 적절합니다.
- source_word: זְמִרוֹת יִשְׂרָאֵל
  english_pob_choice: the sweet singer of Israel
  chosen_korean: 이스라엘의 아름다운 노래하는 사람
  alternatives_korean:
  - 이스라엘의 노래하는 사람
  - 이스라엘의 아름다운 시인
  - 이스라엘의 노래
  lexicon: HALOT
  rationale: זְמִרוֹת는 노래/노래들로 볼 수 있으나, 문맥에서는 다윗의 시적·음악적 성격을 묘사합니다. ‘아름다운 노래하는 사람’은 POB의 의미층을 유지하면서도 한국어로 자연스럽습니다.
theological_decisions:
- issue: מְשִׁיחַ를 메시아 직함으로 볼 것인가
  chosen_reading: 기름 부으신 이
  alternative_readings:
  - 메시아
  - 기름부음 받은 자
  rationale: 본문은 다윗에 대한 왕적 묘사이며, 직접적인 그리스도론적 호칭으로 고정하기보다 역사적·문맥적 의미를 우선해야 합니다. 다만 왕적-메시아적 울림은 주석적 여지로 남깁니다.
  doctrine_reference: 'DOCTRINE.md: 역사적 문맥을 보존하되, 신학적 울림은 제거하지 말 것'
