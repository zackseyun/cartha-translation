- source_word: זְמִרוֹת יִשְׂרָאֵל
  english_pob_choice: the sweet singer of Israel
  chosen_korean: 이스라엘의 아름다운 노래하는 사람
  alternatives_korean:
  - 이스라엘의 노래하는 사람
  - 이스라엘의 아름다운 시인
  - 이스라엘의 노래
  lexicon: HALOT
  rationale: זְמִרוֹת는 노래/노래들로 볼 수 있으나, 문맥에서는 다윗의 시적·음악적 성격을 묘사합니다. ‘아름다운 노래하는 사람’은 POB의 의미층을 유지하면서도 한국어로 자연스럽습니다.
theological_decisions:
- issue: מְשִׁיחַ를 메시아 직함으로 볼 것인가
  chosen_reading: 기름 부으신 이
  alternative_readings:
