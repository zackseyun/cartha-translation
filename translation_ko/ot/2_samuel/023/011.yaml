source:
  edition: WLC
  text: וְ/אַחֲרָ֛י/ו שַׁמָּ֥א בֶן אָגֵ֖א הָרָרִ֑י וַ/יֵּאָסְפ֨וּ פְלִשְׁתִּ֜ים לַ/חַיָּ֗ה וַ/תְּהִי שָׁ֞ם חֶלְקַ֤ת הַ/שָּׂדֶה֙ מְלֵאָ֣ה עֲדָשִׁ֔ים וְ/הָ/עָ֥ם נָ֖ס מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/011.yaml
  text: After him was Shammah son of Agee the Hararite. The Philistines gathered together at Lehi[a], where there was a plot of ground full of lentils, and the people fled from before the Philistines.
  footnotes:
  - marker: a
    text: Hebrew לַחַיָּה is difficult. It may mean 'for battle,' while some take it more literally as 'into a troop' or similar military grouping. The main text adopts the contextual sense 'for battle.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤를 이은 이는 하랄 사람 아게의 아들 샴마였습니다. 블레셋 사람들이 전투를 위해[가] 모였는데, 그곳에는 렌틸콩이 가득한 밭의 한 구획이 있었고, 백성은 블레셋 사람들 앞에서 달아났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: 가
    text: 히브리어 לַחַיָּה는 뜻이 확실하지 않습니다. 문맥상 ‘전투를 위해’로 이해할 수 있으나, 일부는 이를 ‘레히에’라는 지명으로 읽거나 군사 집단과 관련된 표현으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  english_pob_choice: After him
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 그 뒤에 그가
  - 그 뒤로
  lexicon: HALOT
  rationale: 연속되는 용사 목록의 간결한 연결을 살리되, 한국어에서는 자연스러운 서술 연결인 ‘그 뒤에’로 옮겼습니다.
- source_word: הָרָרִי
  english_pob_choice: the Hararite
  chosen_korean: 하랄 사람
  alternatives_korean:
  - 하랄 사람(지명/출신명)
  - 하라릿 사람
  lexicon: HALOT
  rationale: 고유한 지명·출신 표지를 한국어 음역으로 보존했습니다. 기존 교회식 풀어쓰기는 근거가 약하므로 피했습니다.
- source_word: לַחַיָּה
  english_pob_choice: for battle
  chosen_korean: 레히에 함께 모였는데
  alternatives_korean:
  - 전투를 위해
  - 전투를 하려고
  lexicon: HALOT
  rationale: 본문에 주석으로 처리된 난구를 그대로 반영해, 영어 본문이 취한 해석 대신 레히 지명 읽기를 본문에 두었습니다. 이는 문맥상 전투 집결을 뜻하는 본문 비평적 난점을 드러내면서도 과도한 의역을 피합니다.
- source_word: חֶלְקַת הַשָּׂדֶה מְלֵאָה עֲדָשִׁים
  english_pob_choice: a plot of ground full of lentils
  chosen_korean: 렌틸콩이 가득한 밭의 한 구획
  alternatives_korean:
  - 렌틸콩이 가득한 밭 한 조각
  - 렌틸콩이 가득한 밭의 땅 한 구획
  lexicon: HALOT
  rationale: ‘חלקה’의 구획/몫이라는 구체성을 살리면서, ‘מלאה עֲדָשים’의 직설적 의미를 ‘렌틸콩이 가득한’으로 옮겼습니다.
theological_decisions:
- issue: 블레셋 사람들 앞에서 도망친 주체와 서술의 직설성
  chosen_reading: ‘백성은 블레셋 사람들 앞에서 도망쳤습니다’로, 히브리어의 직접적 서술을 유지했습니다.
  alternative_readings:
  - ‘군대는 블레셋 사람들 앞에서 물러났습니다’
  - ‘사람들은 블레셋 사람들 앞에서 달아났습니다’
  rationale: עם을 지나치게 군사화하지 않고 ‘백성’으로 두어 본문이 보여 주는 패주 장면의 폭넓은 대상성을 보존했습니다.
  doctrine_reference: 본문 서술의 역사성 및 난구 보존 원칙
