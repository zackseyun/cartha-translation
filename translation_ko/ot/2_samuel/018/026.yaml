  to: 그러자 파수꾼이 또 다른 사람이 달려오는 것을 보았습니다. 파수꾼이 문지기에게 외쳐 말했습니다. “보시오, 한 사람이 혼자 달려오고 있습니다.” 왕이 말했습니다. “그 사람도 소식을 전하는 사람입니다.”[a]
