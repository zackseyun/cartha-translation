  text: וַ/יַּ֣רְא הַ/צֹּפֶה֮ אִישׁ אַחֵ֣ר רָץ֒ וַ/יִּקְרָ֤א הַ/צֹּפֶה֙ אֶל הַ/שֹּׁעֵ֔ר וַ/יֹּ֕אמֶר הִנֵּה אִ֖ישׁ רָ֣ץ לְ/בַדּ֑/וֹ וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ גַּם זֶ֥ה מְבַשֵּֽׂר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/026.yaml
  text: Then the watchman saw another man running[a], and the watchman called to the gatekeeper and said, “Look, a man is running by himself.” And the king said, “He also brings news.”
  footnotes:
  - marker: a
    text: Or, “is a messenger”; the Hebrew participle can denote one who brings a report, often good news.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 파수꾼이 또 다른 사람이 달려오는 것을 보았습니다. 파수꾼이 문지기에게 외쳐 말했습니다. “보시오, 한 사람이 혼자 달려오고 있습니다.” 왕이 말했습니다. “그 사람도 소식을 전하는 사람입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “전령입니다”; 히브리어 분사형은 보고를 가져오는 사람, 때로는 좋은 소식을 전하는 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  english_pob_choice: the watchman
  chosen_korean: 파수꾼
  alternatives_korean:
  - 망보는 자
  - 초병
  lexicon: HALOT
  rationale: 도성 문맥에서 צפה의 행위자는 경계를 서며 살피는 사람으로, ‘파수꾼’이 자연스럽고 본문의 역할을 가장 분명하게 드러냅니다.
- source_word: רָץ
  english_pob_choice: running
  chosen_korean: 달려오는
  alternatives_korean:
  - 달리는
  - 뛰어오는
  lexicon: HALOT
  rationale: 현재 진행의 분사적 뉘앙스를 살려, 목격 순간의 동작을 나타내는 ‘달려오는’으로 옮겼습니다.
- source_word: לְבַדּוֹ
  english_pob_choice: by himself
  chosen_korean: 혼자
  alternatives_korean:
  - 그 홀로
  - 단독으로
  lexicon: HALOT
  rationale: 사람이 다른 무리 없이 홀로 달리고 있다는 관찰을 한국어로 가장 자연스럽게 표현한 말입니다.
- source_word: מְבַשֵּׂר
  english_pob_choice: brings news
  chosen_korean: 소식을 전하는 자
  alternatives_korean:
  - 소식을 가져오는 자
  - 전령
  lexicon: HALOT
  rationale: בשר의 분사형은 단순한 ‘뉴스 전달자’보다 ‘소식을 전하는 자’가 더 직접적으로 대응하며, 여기서는 긍정 여부를 미리 단정하지 않도록 했습니다.
theological_decisions:
- issue: 왕의 마지막 판단 문장(“He also brings news”)의 의미 범위
  chosen_reading: 왕은 달려오는 그 사람이 어떤 소식을 가져오는 자라고 추론하며, 긍정적 ‘복음’까지는 명시하지 않습니다.
  alternative_readings:
  - 그도 좋은 소식을 전한다
  - 그도 전령이다
  rationale: 히브리어 מְבַשֵּׂר는 문맥상 보고를 가져오는 사람을 가리킬 수 있어, 본문이 보장하는 범위를 넘겨 ‘좋은 소식’으로 확정하지 않았습니다.
  doctrine_reference: 본문 문맥과 어휘 범위
