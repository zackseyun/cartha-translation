source:
  edition: WLC
  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שֹּׁפָ֔ר וַ/יָּ֣שָׁב הָ/עָ֔ם מִ/רְדֹ֖ף אַחֲרֵ֣י יִשְׂרָאֵ֑ל כִּֽי חָשַׂ֥ךְ יוֹאָ֖ב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/016.yaml
  text: Then Joab blew the trumpet[a], and the people turned back from pursuing Israel[c][b], because Joab restrained the people.
  footnotes:
  - marker: a
    text: Or 'the horn.' Hebrew shofar refers to a signaling horn, often a ram's horn; 'trumpet' is the idiomatic military rendering here.
    reason: lexical_alternative
  - marker: b
    text: That is, the forces of Israel aligned with Absalom.
    reason: cultural_note
  - marker: c
    text: Or 'restrained the people' or 'spared the people.' The Hebrew verb can carry the sense of withholding or restraining; here it most likely means Joab stopped his men from continuing the pursuit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요압이 나팔을 불자[a], 백성이 이스라엘[c][b]을 뒤쫓던 일을 멈추고 돌아왔습니다. 이는 요압이 백성을 제지했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שׁוֹפָר는 신호용 뿔나팔을 가리키며, 여기서는 전투 신호의 관용적 표현으로 ‘나팔’을 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 압살롬 편에 선 이스라엘 군대입니다.
    reason: cultural_note
  - marker: c
    text: ‘뒤쫓다/추격하다’로도 옮길 수 있습니다. 본문은 추격 행위의 중단을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע ... בַּשֹּׁפָר
  english_pob_choice: blew the trumpet
  chosen_korean: 나팔을 불자
  alternatives_korean:
  - 뿔나팔을 불자
  - 소리를 내자
  lexicon: HALOT
  rationale: שׁוֹפָר는 신호용 뿔나팔이지만 전투 서술에서는 한국어로 ‘나팔을 불다’가 가장 자연스럽고, 소리 내는 행위를 구체적으로 살립니다.
- source_word: וַיָּשָׁב הָעָם
  english_pob_choice: the people turned back
  chosen_korean: 백성이 ... 돌아왔습니다
  alternatives_korean:
  - 군대가 돌아섰습니다
  - 병사들이 돌아왔습니다
  lexicon: HALOT
  rationale: הָעָם은 문맥상 군사 집단을 가리키지만, 히브리어의 집합 명사를 살리면서 현대 한국어에서 자연스럽게 읽히도록 ‘백성’으로 옮겼습니다.
- source_word: מִרְדֹף אַחֲרֵי יִשְׂרָאֵל
  english_pob_choice: from pursuing Israel
  chosen_korean: 이스라엘을 뒤쫓던 일을 멈추고
  alternatives_korean:
  - 이스라엘을 추격하는 데서 물러나
  - 이스라엘을 추격하던 일을 그치고
  lexicon: HALOT
  rationale: מִן + 동명사 구문은 추격의 중단을 뜻하므로, 결과를 분명히 하되 한국어 어법에 맞게 ‘뒤쫓던 일을 멈추고’로 옮겼습니다.
- source_word: חָשַׂךְ
  english_pob_choice: restrained the people
  chosen_korean: 백성을 제지했기
  alternatives_korean:
  - 백성을 억제했기
  - 백성을 멈추게 했기
  - 백성을 붙들어 두었기
  lexicon: HALOT
  rationale: חָשַׂךְ는 ‘억제하다/제지하다/보류하다’의 뜻을 가질 수 있으며, 여기서는 요압이 자기 병력이 추격을 계속하지 못하게 한 의미이므로 ‘제지하다’가 가장 직접적입니다.
theological_decisions:
- issue: 전투 문맥에서 הָעָם의 지시 대상
  chosen_reading: ‘백성’으로 옮기되, 문맥상 요압의 전투 병력임을 드러내는 방향을 유지했습니다.
  alternative_readings:
  - ‘군대’
  - ‘병사들’
  rationale: 본문은 집합 명사 הָעָם을 사용하지만, 같은 절 안에서 추격과 제지라는 군사 행위가 이어지므로 과도한 의역 없이 문맥적 군사성을 전달하는 것이 적절합니다.
  doctrine_reference: 문맥 우선 번역 원칙
