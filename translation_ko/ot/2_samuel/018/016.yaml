  lexicon: HALOT
  rationale: הָעָם은 문맥상 군사 집단을 가리키지만, 히브리어의 집합 명사를 살리면서 현대 한국어에서 자연스럽게 읽히도록 ‘백성’으로 옮겼습니다.
- source_word: מִרְדֹף אַחֲרֵי יִשְׂרָאֵל
  english_pob_choice: from pursuing Israel
  chosen_korean: 이스라엘을 뒤쫓던 일을 멈추고
  alternatives_korean:
  - 이스라엘을 추격하는 데서 물러나
  - 이스라엘을 추격하던 일을 그치고
  lexicon: HALOT
  rationale: מִן + 동명사 구문은 추격의 중단을 뜻하므로, 결과를 분명히 하되 한국어 어법에 맞게 ‘뒤쫓던 일을 멈추고’로 옮겼습니다.
- source_word: חָשַׂךְ
  english_pob_choice: restrained the people
  chosen_korean: 백성을 제지했기
  alternatives_korean:
  - 백성을 억제했기
  - 백성을 멈추게 했기
  - 백성을 붙들어 두었기
  lexicon: HALOT
  rationale: חָשַׂךְ는 ‘억제하다/제지하다/보류하다’의 뜻을 가질 수 있으며, 여기서는 요압이 자기 병력이 추격을 계속하지 못하게 한 의미이므로 ‘제지하다’가 가장 직접적입니다.
theological_decisions:
- issue: 전투 문맥에서 הָעָם의 지시 대상
  chosen_reading: ‘백성’으로 옮기되, 문맥상 요압의 전투 병력임을 드러내는 방향을 유지했습니다.
  alternative_readings:
  - ‘군대’
  - ‘병사들’
  rationale: 본문은 집합 명사 הָעָם을 사용하지만, 같은 절 안에서 추격과 제지라는 군사 행위가 이어지므로 과도한 의역 없이 문맥적 군사성을 전달하는 것이 적절합니다.
  doctrine_reference: 문맥 우선 번역 원칙
