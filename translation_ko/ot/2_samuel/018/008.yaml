  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תְּהִי שָׁ֧ם הַ/מִּלְחָמָ֛ה נפצית עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַ/יֶּ֤רֶב הַ/יַּ֨עַר֙ לֶ/אֱכֹ֣ל בָּ/עָ֔ם מֵ/אֲשֶׁ֥ר אָכְלָ֛ה הַ/חֶ֖רֶב בַּ/יּ֥וֹם הַ/הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/008.yaml
  text: The battle spread there over the face of all the land[a], and the forest devoured more of the people that day than the sword devoured.
  footnotes:
  - marker: a
    text: Or 'The battle was scattered over the face of the whole land.' The Hebrew participle can emphasize the battle's dispersal across the region.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 그곳에서 싸움이 온 땅의 표면에 퍼졌고, 그날 숲이 칼보다 더 많은 사람을 삼켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 전투가 온 땅의 표면에 흩어졌다’로도 옮길 수 있습니다. 히브리어 분사는 전투가 지역 전역에 흩어진 모습을 강조할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּהִי ... הַמִּלְחָמָה ... עַל פְּנֵי כָל הָאָרֶץ
  english_pob_choice: The battle spread there over the face of all the land
  chosen_korean: 싸움이 온 땅의 표면에 퍼졌고
  alternatives_korean:
  - 전쟁이 온 땅에 퍼졌고
  - 싸움이 그 온 땅에 흩어졌고
  lexicon: WLC; HALOT
  rationale: הַמִּלְחָמָה를 ‘전쟁’보다 더 직접적인 ‘싸움’으로 옮겨 전투의 분산·확산 이미지를 살렸고, עַל פְּנֵי כָל הָאָרֶץ는 히브리어 관용을 살려 ‘온 땅의 표면에’로 옮겼습니다.
- source_word: נפצית
  english_pob_choice: spread
  chosen_korean: 퍼졌고
  alternatives_korean:
  - 흩어졌고
  - 분산되었고
  lexicon: HALOT
  rationale: 니팔 분사로서 ‘퍼지다/흩어지다’의 의미를 가지므로, 한국어에서는 자연스럽고 장면을 살리는 ‘퍼지다’를 택했습니다.
- source_word: וַיֶּרֶב הַיַּעַר לֶאֱכֹל בָּעָם
  english_pob_choice: the forest devoured more of the people
  chosen_korean: 숲이 ... 더 많은 사람을 삼켰습니다
  alternatives_korean:
  - 숲이 ... 더 많은 사람을 먹어 삼켰습니다
  - 숲이 ... 더 많은 사람을 잡아삼켰습니다
  lexicon: HALOT
  rationale: יַעַר는 ‘숲/수풀’인데, 군사 서술의 생동감을 살리기 위해 ‘숲’으로 옮겼습니다. לֶאֱכֹל의 의인화된 ‘먹다/삼키다’ 이미지는 ‘삼키다’로 자연스럽게 재현했습니다.
- source_word: מֵאֲשֶׁר אָכְלָה הַחֶרֶב
  english_pob_choice: than the sword devoured
  chosen_korean: 칼보다 더 많은 사람을
  alternatives_korean:
  - 칼이 삼킨 것보다
  - 칼이 먹어 삼킨 것보다
  lexicon: HALOT
  rationale: 비교문 구조를 한국어로 매끄럽게 풀되, 두 절의 대응을 위해 ‘삼키다’ 계열을 유지했습니다. ‘칼’은 한국어 성경에서 자연스러운 무기 표현입니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: that day
  chosen_korean: 그날
  alternatives_korean:
  - 그 날
  - 그때
  lexicon: HALOT
  rationale: 시간 표지는 간결한 서술체인 ‘그날’이 가장 자연스럽습니다.
theological_decisions:
- issue: 전투와 숲의 주체성 표현
  chosen_reading: 숲이 사람을 ‘삼켰습니다’라고 하여 히브리어의 강한 의인화를 보존했습니다.
  alternative_readings:
  - 숲이 사람을 죽였습니다
  - 숲이 사람에게 더 큰 피해를 주었습니다
  rationale: 본문은 단순한 피해 묘사보다 숲을 마치 행위자처럼 그려 전투의 비극성과 역설을 강조합니다. 이를 약화시키지 않기 위해 의인화된 동사를 유지했습니다.
  doctrine_reference: 서술적 강조의 보존
