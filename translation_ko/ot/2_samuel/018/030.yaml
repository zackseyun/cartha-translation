  yaml_path: translation/ot/2_samuel/018/030.yaml
  text: The king said[a], “Turn aside; stand here.” So he turned aside and stood.
  footnotes:
  - marker: a
    text: Or “Turn around; stand here.” The Hebrew verb can denote turning generally, but in context likely means moving aside to make room for the next messenger.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 말했습니다. “옆으로 비켜서[a] 이곳에 서 있으십시오.” 그러자 그가 옆으로 비켜 섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “돌아서”로도 옮길 수 있습니다. 이 동사는 일반적으로 ‘돌다’ 또는 ‘돌아서다’를 뜻하지만, 여기서는 다음 전달자가 올 자리를 마련하려고 옆으로 비키라는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 서술 도입의 평이한 אמר에 맞춰, 현대 문어체에서 자연스러운 ‘말했습니다’를 사용했습니다.
- source_word: סֹב
  english_pob_choice: Turn aside
  chosen_korean: 비켜서서
  alternatives_korean:
  - 돌아서
  - 옆으로 비켜
  lexicon: HALOT
  rationale: 여기서는 단순한 회전이 아니라 다음 전달자를 위해 자리를 내주는 동작이므로, 문맥상 ‘비켜서서’가 가장 직접적입니다.
- source_word: הִתְיַצֵּב
  english_pob_choice: stand
  chosen_korean: 서 있거라
  alternatives_korean:
  - 자리를 잡아라
  - 서 있으라
  lexicon: HALOT
  rationale: 히트파엘 명령형의 ‘자리를 잡고 서다’는 뜻을 살리되, 짧은 명령 연쇄에 맞춰 ‘서 있거라’로 옮겼습니다.
- source_word: כֹּה
  english_pob_choice: here
  chosen_korean: 여기
  alternatives_korean:
  - 이곳에
  - 그 자리에
  lexicon: HALOT
  rationale: 장소를 가리키는 부사이므로 ‘여기’가 가장 자연스럽습니다.
