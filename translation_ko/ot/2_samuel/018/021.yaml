  - 전하십시오
  - 보고하십시오
  lexicon: HALOT
  rationale: 왕에게 전달하는 보고의 성격을 살리면서도 지나치게 관청식인 표현을 피하기 위해 ‘알리십시오’를 택했습니다.
- source_word: וַיִּשְׁתַּחוּ
  english_pob_choice: bowed down
