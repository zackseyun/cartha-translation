translation:
  language: ko
  text: 그때 요압이 쿠시인에게 말했습니다. “가서 본 것을 왕께 알리십시오.” 그러자 쿠시인이 요압에게 엎드려 절하고 달려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 인명 ‘쿠시’로 볼 수 있으며, 전통적으로는 ‘에티오피아인’으로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  english_pob_choice: the Cushite
  chosen_korean: 쿠시인
  alternatives_korean:
