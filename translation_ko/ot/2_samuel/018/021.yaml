translation:
  language: ko
  text: 그때 요압이 쿠시인에게 말했습니다. “가서, 네가 본 것을 왕에게 알리십시오.” 그러자 쿠시인이 요압에게 엎드려 절하고 달려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 인명 ‘쿠시’로 볼 수 있으며, 전통적으로는 ‘에티오피아인’으로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  english_pob_choice: the Cushite
  chosen_korean: 쿠시인
  alternatives_korean:
  - 쿠시 사람
  - 에티오피아인
  - 쿠시
  lexicon: HALOT
  rationale: 영어 POB가 민족/출신을 드러내는 지칭으로 처리한 점을 따라, 개인명보다 중립적인 지시를 살릴 수 있는 ‘쿠시인’을 선택했습니다.
- source_word: לֵךְ
  english_pob_choice: Go
  chosen_korean: 가서
  alternatives_korean:
  - 가십시오
  - 가라
  lexicon: HALOT
  rationale: 명령형의 직접성을 살리되 한국어 서술 흐름에 맞게 연결형 ‘가서’로 옮겼습니다.
- source_word: הַגֵּד
  english_pob_choice: tell
  chosen_korean: 알리십시오
  alternatives_korean:
  - 말하십시오
  - 전하십시오
  - 보고하십시오
  lexicon: HALOT
  rationale: 왕에게 전달하는 보고의 성격을 살리면서도 지나치게 관청식인 표현을 피하기 위해 ‘알리십시오’를 택했습니다.
- source_word: וַיִּשְׁתַּחוּ
  english_pob_choice: bowed down
  chosen_korean: 엎드려 절하고
  alternatives_korean:
  - 절하고
  - 엎드렸습니다
  - 경배하고
  lexicon: HALOT
  rationale: 요압에게 보이는 경의의 몸짓을 드러내되, 예배 의미로 오해될 수 있는 ‘경배’는 피하고 동작성을 살린 ‘엎드려 절하고’로 옮겼습니다.
theological_decisions:
- issue: 쿠시인의 정체를 개인명으로 볼지 민족/출신 지칭으로 볼지
  chosen_reading: 본문 번역은 ‘쿠시인’으로 두어, 인명 여부를 단정하지 않고 출신 표지를 열린 상태로 유지했습니다.
  alternative_readings:
  - 쿠시
  - 에티오피아인
  rationale: 원문과 POB 주석이 모두 인명 가능성과 민족 지칭 가능성을 함께 남기므로, 본문은 중립적으로 두고 해석 여지를 보존했습니다.
  doctrine_reference: 해석 유보 원칙
