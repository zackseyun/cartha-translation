  - 경배하고
  lexicon: HALOT
  rationale: 요압에게 보이는 경의의 몸짓을 드러내되, 예배 의미로 오해될 수 있는 ‘경배’는 피하고 동작성을 살린 ‘엎드려 절하고’로 옮겼습니다.
theological_decisions:
- issue: 쿠시인의 정체를 개인명으로 볼지 민족/출신 지칭으로 볼지
  chosen_reading: 본문 번역은 ‘쿠시인’으로 두어, 인명 여부를 단정하지 않고 출신 표지를 열린 상태로 유지했습니다.
  alternative_readings:
  - 쿠시
  - 에티오피아인
  rationale: 원문과 POB 주석이 모두 인명 가능성과 민족 지칭 가능성을 함께 남기므로, 본문은 중립적으로 두고 해석 여지를 보존했습니다.
  doctrine_reference: 해석 유보 원칙
