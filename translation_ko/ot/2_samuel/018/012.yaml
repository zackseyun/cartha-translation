  naturalness: ‘우리 귀로 왕께서’는 현대 표준 한국어의 자연스러운 표현이 아니므로 ‘우리가 듣는 데서 왕께서’로 고치는 것이 좋습니다. 또한 ‘명령하시며 말씀하시기를’은 중복적이므로 직접 인용으로 간결하게 처리했습니다. 각주 표지는 해당 난점이 있는 절에 직접 붙였습니다.
