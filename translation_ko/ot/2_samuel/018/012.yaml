  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ אֶל יוֹאָ֔ב ו/לא אָנֹכִ֜י שֹׁקֵ֤ל עַל כַּפַּ/י֙ אֶ֣לֶף כֶּ֔סֶף לֹֽא אֶשְׁלַ֥ח יָדִ֖/י אֶל בֶּן הַ/מֶּ֑לֶךְ כִּ֣י בְ/אָזְנֵ֜י/נוּ צִוָּ֣ה הַ/מֶּ֗לֶךְ אֹ֠תְ/ךָ וְ/אֶת אֲבִישַׁ֤י וְ/אֶת אִתַּי֙ לֵ/אמֹ֔ר שִׁמְרוּ מִ֕י בַּ/נַּ֖עַר בְּ/אַבְשָׁלֽוֹם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/012.yaml
  text: But the man said to Joab[a], “Even if I were weighing out a thousand pieces of silver on my palms, I would not put out my hand against the king’s son; for in our hearing the king commanded you and Abishai and Ittai, saying[b], ‘Guard for me the young man Absalom.’”
  footnotes:
  - marker: a
    text: 'Hebrew: ''weighing a thousand silver on my palms/hands.'' The wording refers to receiving a large payment by weight.'
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew text at the end of the verse is difficult: literally, ''Guard מי the young man, Absalom.'' Many understand the sense from 18:5 as ''Guard for me the young man Absalom.'''
    reason: textual_variant
translation:
  language: ko
  text: 그러자 그 사람이 요압에게 말했습니다. “내가 손바닥에 은 천 개를 달아 올린다 해도, 나는 왕의 아들에게 손을 대지 않겠습니다. 우리 귀로 왕께서 당신과 아비새와 잇대에게 명령하시며 말씀하시기를, ‘나를 위해 그 청년 압살롬을 지키라’ 하셨기 때문입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 손바닥 위에 은 천 개를 달아 올린다’는 식의 표현입니다.
    reason: source_note
  - marker: b
    text: 본문 끝의 히브리어는 난해하며, 많은 이들이 18:5의 병행에 따라 ‘나를 위해 그 청년 압살롬을 지키라’는 뜻으로 이해합니다.
    reason: textual_variant
lexical_decisions:
- source_word: שֹׁקֵל עַל כַּפַּי אֶלֶף כֶּסֶף
  english_pob_choice: weighing out a thousand pieces of silver on my palms
  chosen_korean: 손바닥에 은 천 개를 달아 올린다
  alternatives_korean:
  - 손에 은 천 개를 달아 올린다
  - 손바닥에 은 천 개를 저울질해 올린다
  lexicon: HALOT
  rationale: שֹׁקֵל과 עַל כַּפַּי의 이미지를 살려, 대가로 은이 손바닥 위에 달려 놓이는 장면을 한국어로 자연스럽게 옮겼습니다. 단위가 명시되지 않은 אֶלֶף כֶּסֶף는 영어 POB처럼 ‘pieces/shekels’로 과도하게 특정하지 않고 ‘은 천 개’로 두었습니다.
- source_word: לֹא אֶשְׁלַח יָדִי אֶל
  english_pob_choice: I would not put out my hand against
  chosen_korean: 나는 … 손을 대지 않겠습니다
  alternatives_korean:
  - 나는 … 손을 내밀지 않겠습니다
  - 나는 … 손을 얹지 않겠습니다
  lexicon: HALOT
  rationale: 직역의 손 내밈 이미지는 유지하되, כאן의 관용적 폭력을 한국어로는 ‘손을 대다’가 가장 자연스럽고 문맥상 위험 행위를 분명히 드러냅니다.
- source_word: בְאָזְנֵינוּ צִוָּה
  english_pob_choice: in our hearing the king commanded
  chosen_korean: 우리 귀로 왕께서 … 명령하시며
  alternatives_korean:
  - 우리 들은 바에 왕께서 … 명령하시며
  - 우리 앞에서 왕께서 … 명령하시며
  lexicon: HALOT
  rationale: ‘우리 귀에’의 히브리어 관용구를 한국어에서도 직접 들은 증언으로 풀어, 명령이 공적으로 청취된 사실을 살렸습니다.
- source_word: שִׁמְרוּ מִי בַּנַּעַר בְּאַבְשָׁלוֹם
  english_pob_choice: Guard for me the young man Absalom
  chosen_korean: 나를 위해 그 청년 압살롬을 지키라
  alternatives_korean:
  - 그 청년 압살롬을 지키라
  - 압살롬인 그 청년을 지키라
  lexicon: HALOT
  rationale: 본문의 מי가 어려운 점은 유지하되, 문맥과 18:5의 평행을 따라 보호의 뜻을 드러내는 방향으로 옮겼습니다. ‘지키다’는 שׁמר의 보호·보전 의미를 자연스럽게 반영합니다.
- source_word: בֶן הַמֶּלֶךְ
  english_pob_choice: the king’s son
  chosen_korean: 왕의 아들
  alternatives_korean:
  - 왕의 아들
  - 임금의 아들
  lexicon: HALOT
  rationale: 왕과 아들의 관계를 간결하고 직설적으로 살리는 가장 자연스러운 대응입니다.
theological_decisions:
- issue: 압살롬을 향한 ‘지키라’의 화행
  chosen_reading: 명령은 압살롬을 해치지 말고 보호하라는 뜻으로 옮겼습니다.
  alternative_readings:
  - ‘지키다’를 단순한 감시로 이해할 수 있습니다.
  - 히브리어의 난구절을 그대로 불안정하게 드러낼 수 있습니다.
  rationale: 18:5의 평행 구절이 의미를 규정하므로, 본문 난점을 숨기지 않되 문맥이 주는 보호 명령을 한국어 본문에서 분명히 했습니다.
  doctrine_reference: 본문 문맥과 병행구절에 따른 서술적 판단
