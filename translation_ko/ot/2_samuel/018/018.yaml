base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/018.yaml
  text: Now Absalom had taken and set up for himself in his lifetime the pillar that is in the Valley of the King[a], for he said, “I have no son to keep my name in remembrance.” So he called the pillar by his own name, and it is called Absalom’s Monument to this day.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Absalom’s hand.'' Here ''hand'' is an idiomatic expression for a memorial marker or monument.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아브살롬은 자기 생전에 왕의 골짜기에 있는 기둥을 가져다 세웠습니다[a]. 그는 “내 이름을 기억하게 할 아들이 내게 없습니다”라고 말했기 때문입니다. 그래서 그는 그 기둥을 자기 이름으로 불렀고, 그 기둥은 오늘까지 아브살롬의 기념물이라고 불립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘아브살롬의 손’. 여기서 ‘손’은 기념 표지나 기념물을 가리키는 관용적 표현입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַבְשָׁלֹם לָקַח
  english_pob_choice: Now Absalom had taken
  chosen_korean: 아브살롬은 자기 생전에 … 기둥을 가져다 세웠습니다
  alternatives_korean:
  - 아브살롬은 … 기둥을 취했습니다
  - 아브살롬은 … 기둥을 가져왔습니다
  lexicon: HALOT
  rationale: לאקח를 단순히 ‘취했다’보다, 이어지는 ‘세웠다’와 함께 기념물을 마련한 동작으로 자연스럽게 드러내기 위해 ‘가져다 세웠습니다’로 옮겼습니다.
- source_word: בְחַיּוֹ
  english_pob_choice: in his lifetime
  chosen_korean: 자기 생전에
  alternatives_korean:
  - 살아 있는 동안
  - 자기 삶 동안
  lexicon: HALOT
  rationale: 관용구로서 ‘그가 아직 살아 있을 때’라는 뜻을 분명히 하면서도 현대 한국어에서 자연스럽게 읽히는 표현을 택했습니다.
- source_word: מַצֶּבֶת
  english_pob_choice: pillar
  chosen_korean: 기둥
  alternatives_korean:
  - 돌기둥
  - 비석
  - 기념기둥
  lexicon: HALOT
  rationale: 이 명사는 서 있는 표석을 가리키므로, 본문 흐름과 뒤의 ‘기념물’ 이름을 함께 살려 ‘기둥’으로 옮겼습니다.
- source_word: בְּעֵמֶק הַמֶּלֶךְ
  english_pob_choice: in the Valley of the King
  chosen_korean: 왕의 골짜기
  alternatives_korean:
  - 왕의 계곡
  - 왕의 골짜기
  lexicon: HALOT
  rationale: 지명구를 비교적 직역하되, 현대 한국어에서 자연스러운 ‘골짜기’로 표기해 고유 지명성을 유지했습니다.
- source_word: בַּעֲבוּר הַזְכִּיר שְׁמִי
  english_pob_choice: to keep my name in remembrance
  chosen_korean: 내 이름을 기억하게 할
  alternatives_korean:
  - 내 이름을 기억나게 할
  - 내 이름이 기억되게 할
  lexicon: HALOT
  rationale: 목적을 나타내는 표현으로, 아들의 부재 때문에 이름을 기념하려는 의도를 한국어의 자연스러운 목적절로 재현했습니다.
- source_word: יָד אַבְשָׁלוֹם
  english_pob_choice: Absalom’s Monument
  chosen_korean: 아브살롬의 기념물
  alternatives_korean:
  - 아브살롬의 기둥
  - 아브살롬의 손
  lexicon: HALOT
  rationale: 히브리어의 ‘손’은 이곳에서 관용적으로 기념 표지를 뜻하므로, 직역의 낯섦을 피하면서도 원문의 기능을 살려 ‘기념물’로 옮겼습니다.
theological_decisions:
- issue: 기념 표지의 명명 방식
  chosen_reading: 그 기둥은 그의 개인적 기억과 이름 보존을 위한 자기기념 표지로 제시됩니다.
  alternative_readings:
  - 단순한 묘비로 이해
  - 왕권 주장과 연결된 정치적 상징으로만 이해
  rationale: 본문은 아들의 부재와 이름 보존 의도를 직접 제시하므로, 단순 묘비보다 자기 이름을 남기려는 기념 표지라는 의미가 더 분명합니다.
  doctrine_reference: 문맥 주해
