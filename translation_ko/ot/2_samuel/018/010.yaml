  text: One man saw it and told Joab[a], and said, “Look, I saw Absalom hanging in the terebinth tree.”
  footnotes:
  - marker: a
    text: Or “in the oak.” The Hebrew אֵלָה can refer to a terebinth and is sometimes rendered more generally as “oak.”
    reason: lexical_alternative
translation:
  language: ko
  text: 한 사람이 그것을 보고 요압에게 알리며 말했습니다. 「보십시오, 제가 압살롬이 그 떨기나무에 매달려 있는 것을 보았습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֵלָה는 ‘떨기나무’로 옮길 수 있는 테레빈트를 가리키며, 일부 번역은 더 일반적인 ‘상수리나무’로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד
  english_pob_choice: One man
  chosen_korean: 한 사람
  alternatives_korean:
  - 어떤 사람
  - 한 남자
  lexicon: HALOT
  rationale: 히브리어의 단수 강조를 살리면서도 현대 한국어에서 가장 자연스러운 중립 표현으로 옮겼습니다.
- source_word: וַיַּגֵּד לְיוֹאָב
