  lexicon: HALOT
  rationale: נגד의 ‘알리다/전하다’ 의미를 살리되, 서사 문맥에 맞는 간결한 동작 진행으로 표현했습니다.
- source_word: בָּאֵלָה
  english_pob_choice: in the terebinth tree
  chosen_korean: 그 떨기나무에
  alternatives_korean:
  - 그 상수리나무에
  - 그 테레빈트나무에
  lexicon: HALOT
  rationale: אֵלָה는 특정 수종인 terebinth를 가리키므로, 전통적 관용보다 원어 의미를 우선해 한국어에서 널리 이해되는 ‘떨기나무’로 옮겼습니다.
- source_word: תָּלוּי
  english_pob_choice: hanging
  chosen_korean: 매달려 있는
  alternatives_korean:
