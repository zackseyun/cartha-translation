  text: One man saw it and told Joab[a], and said, “Look, I saw Absalom hanging in the terebinth tree.”
  footnotes:
  - marker: a
    text: Or “in the oak.” The Hebrew אֵלָה can refer to a terebinth and is sometimes rendered more generally as “oak.”
    reason: lexical_alternative
translation:
  language: ko
  text: 한 사람이 보고 요압에게 알리고 말했습니다. “보십시오, 제가 압살롬이 그 테레빈트나무[a]에 매달려 있는 것을 보았습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֵלָה는 테레빈트나무를 가리킵니다. 일부 번역은 이를 더 일반적으로 ‘상수리나무’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד
