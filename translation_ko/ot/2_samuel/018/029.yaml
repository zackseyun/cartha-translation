  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ שָׁל֥וֹם לַ/נַּ֖עַר לְ/אַבְשָׁל֑וֹם וַ/יֹּ֣אמֶר אֲחִימַ֡עַץ רָאִיתִי֩ הֶ/הָמ֨וֹן הַ/גָּד֜וֹל לִ֠/שְׁלֹחַ אֶת עֶ֨בֶד הַ/מֶּ֤לֶךְ יוֹאָב֙ וְ/אֶת עַבְדֶּ֔/ךָ וְ/לֹ֥א יָדַ֖עְתִּי מָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/029.yaml
  text: And the king said[a], “Is it well with the young man Absalom?” Ahimaaz said, “I saw a great commotion when Joab sent the king’s servant and your servant, but I did not know what it was.”
  footnotes:
  - marker: a
    text: Or “I saw a great multitude” or “a great uproar”; the Hebrew term can denote a crowd, noise, or tumult.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 말했습니다. 「압살롬이라는 그 젊은이에게는 평강이 있습니까?」 아히마아스가 말했습니다. 「제가 보니 요압이 왕의 종과 당신의 종을 보낼 때 큰 소란이 있었습니다. 그러나 저는 그것이 무엇인지 알지 못했습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘큰 소란’으로 옮긴 히브리어 הֶהָמוֹן הַגָּדוֹל은 문맥에 따라 ‘큰 무리’ 또는 ‘큰 소동’으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  english_pob_choice: Is it well with
  chosen_korean: 평강이 있습니까?
  alternatives_korean:
  - 무사합니까?
  - 잘 지내고 있습니까?
  - 평안합니까?
  lexicon: HALOT
  rationale: 여기서는 전쟁의 유무보다 압살롬의 안녕을 묻는 인사적·상태적 질문이므로, 한국어에서는 자연스럽게 ‘평강이 있습니까?’로 옮겼습니다.
- source_word: הַמֶּלֶךְ שָׁלֹום לַנַּעַר לְאַבְשָׁלוֹם
  english_pob_choice: the young man Absalom
  chosen_korean: 압살롬이라는 그 젊은이
  alternatives_korean:
  - 젊은 압살롬
  - 그 소년 압살롬
  - 압살롬 그 젊은이
  lexicon: HALOT
  rationale: נַעַר의 기본 범위를 살리면서도 다윗의 애틋하지만 거리두기 있는 표현을 유지하기 위해 ‘압살롬이라는 그 젊은이’로 옮겼습니다.
- source_word: הֶהָמוֹן הַגָּדוֹל
  english_pob_choice: a great commotion
  chosen_korean: 큰 소란
  alternatives_korean:
  - 큰 무리
  - 큰 소동
  - 큰 함성
  lexicon: HALOT
  rationale: 히브리어 הָמוֹן은 무리·요란·소란의 뜻을 함께 가질 수 있으므로, 문맥상 전달되는 혼잡함과 동요를 살려 ‘큰 소란’으로 번역했습니다.
- source_word: עֶבֶד הַמֶּלֶךְ ... וְאֶת עַבְדֶּךָ
  english_pob_choice: the king’s servant ... and your servant
  chosen_korean: 왕의 종과 당신의 종
  alternatives_korean:
  - 왕의 종과 제 종
  - 왕의 노예와 당신의 종
  - 왕의 신하와 당신의 종
  lexicon: HALOT
  rationale: 여기서 עֶבֶד는 궁정의 종속된 신하를 가리키며, 서열을 낮추는 겸양 표현도 포함하므로 ‘종’으로 옮겨 원문의 자기비하적 공손함을 보존했습니다.
theological_decisions:
- issue: 다윗의 질문을 직접적인 안부 표현으로 옮길지 여부
  chosen_reading: 질문형으로 직역하되, 압살롬의 안녕을 묻는 의미가 드러나게 했습니다.
  alternative_readings:
  - ‘압살롬은 괜찮습니까?’
  - ‘압살롬이 무사합니까?’
  rationale: 히브리어 שָׁלוֹם은 단순한 평화가 아니라 상대의 상태와 안녕을 묻는 표현이므로, 다윗의 애끊는 관심을 과도하게 완화하지 않으면서도 자연스러운 한국어로 살렸습니다.
  doctrine_reference: 본문 해석/문체
- issue: 아히마아스의 보고를 의도적인 회피로 처리할지 여부
  chosen_reading: ‘큰 소란이 있었습니다. 그러나 저는 그것이 무엇인지 알지 못했습니다.’로 마무리해, 알고도 말하지 않는 듯한 회피성을 남겼습니다.
  alternative_readings:
  - ‘큰 무리가 있었습니다’
  - ‘무슨 일인지 알지 못했습니다’
  rationale: 히브리어의 애매한 הָמוֹן과 짧은 종결을 그대로 반영해야 아히마아스의 말을 둘러싼 긴장과 모호함이 유지됩니다.
  doctrine_reference: 본문 해석
