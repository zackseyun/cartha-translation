source:
  edition: WLC
  text: וַ/יָּסֹ֨בּוּ֙ עֲשָׂרָ֣ה נְעָרִ֔ים נֹשְׂאֵ֖י כְּלֵ֣י יוֹאָ֑ב וַ/יַּכּ֥וּ אֶת אַבְשָׁל֖וֹם וַ/יְמִיתֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/015.yaml
  text: Then ten young men, Joab’s armor-bearers, surrounded Absalom and struck him and killed him.
translation:
  language: ko
  text: 그때 요압의 무기를 든 열 명의 젊은이가 둘러싸고 압살롬을 치고 그를 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשָׂרָה נְעָרִים
  english_pob_choice: ten young men
  chosen_korean: 열 명의 젊은이
  alternatives_korean:
  - 열 명의 종
  - 열 명의 시종
  lexicon: HALOT
  rationale: נְעָרִים는 이 군사 문맥에서 단순한 하인보다 ‘젊은 남자들’로 이해하는 것이 자연스럽고, 수적으로도 분명하게 드러냅니다.
- source_word: נֹשְׂאֵי כְּלֵי יוֹאָב
  english_pob_choice: Joab’s armor-bearers
  chosen_korean: 요압의 무기를 든
  alternatives_korean:
  - 요압의 무기 운반자들인
  - 요압의 병기를 나르는
  lexicon: HALOT
  rationale: 직역하면 ‘요압의 기구/무기들을 나르는 자들’이지만, 한국어에서는 전투 수행 관계를 드러내는 ‘무기를 든’이 가장 자연스럽습니다.
- source_word: וַיָּסֹבּוּ
  english_pob_choice: surrounded
  chosen_korean: 둘러싸고
  alternatives_korean:
  - 에워싸고
  - 돌아가며
  lexicon: HALOT
  rationale: סבב는 단순한 이동이 아니라 대상을 포위하는 동작을 뜻하므로, ‘둘러싸고’가 문맥의 전략적 의미를 잘 살립니다.
- source_word: וַיַּכּוּ ... וַיְמִיתֻהוּ
  english_pob_choice: struck him and killed him
  chosen_korean: 치고 그를 죽였습니다
  alternatives_korean:
  - 쳐서 그를 죽였습니다
  - 쳤고 그를 죽였습니다
  lexicon: HALOT
  rationale: נכה와 מות(히필)의 연속 동작을 한국어 서술 순서로 살려, 먼저 ‘치고’ سپس ‘죽였습니다’로 옮겼습니다.
theological_decisions:
- issue: 압살롬에 대한 직접적 폭력 서술의 표현 수위
  chosen_reading: ‘죽였습니다’로 직설적으로 옮겨, 본문의 냉정한 서술을 완화하지 않았습니다.
  alternative_readings:
  - ‘목숨을 끊었습니다’
  - ‘죽음에 이르게 했습니다’
  rationale: 히브리어 원문은 행위의 결과를 직접적으로 진술하므로, 완곡어보다 직접 번역이 서사적 긴장을 더 정확히 전달합니다.
  doctrine_reference: 서사 본문의 사실적 진술을 보존하는 번역 원칙
