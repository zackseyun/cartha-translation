  text: וַ/יִּקָּרֵא֙ אַבְשָׁל֔וֹם לִ/פְנֵ֖י עַבְדֵ֣י דָוִ֑ד וְ/אַבְשָׁל֞וֹם רֹכֵ֣ב עַל הַ/פֶּ֗רֶד וַ/יָּבֹ֣א הַ/פֶּ֡רֶד תַּ֣חַת שׂוֹבֶךְ֩ הָ/אֵלָ֨ה הַ/גְּדוֹלָ֜ה וַ/יֶּחֱזַ֧ק רֹאשׁ֣/וֹ בָ/אֵלָ֗ה וַ/יֻּתַּן֙ בֵּ֤ין הַ/שָּׁמַ֨יִם֙ וּ/בֵ֣ין הָ/אָ֔רֶץ וְ/הַ/פֶּ֥רֶד אֲשֶׁר תַּחְתָּ֖י/ו עָבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/009.yaml
  text: Absalom happened to come before David’s servants while Absalom was riding on the mule. The mule went under the thick branches of a large terebinth[a], and his head got caught in the terebinth, so that he was left hanging between heaven and earth while the mule that was under him passed on.
  footnotes:
  - marker: a
    text: Or 'under the dense boughs of a great oak.' The Hebrew אֵלָה can be rendered more generally as a large tree, but 'terebinth' is the more precise lexical choice here.
    reason: lexical_alternative
translation:
  language: ko
  text: 압살롬이 노새를 타고 가다가 다윗의 종들과 마주치게 되었습니다. 그 노새가 큰 테레빈트의 빽빽한 가지 아래로 들어가자, 압살롬의 머리가 그 테레빈트에 걸렸습니다. 그는 하늘과 땅 사이에 매달리고, 그가 타고 있던 노새는 그대로 지나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘테레빈트’는 히브리어 אֵלָה의 비교적 정확한 식물명입니다. 이 말은 더 일반적으로 큰 나무를 가리킬 수도 있으므로, ‘큰 참나무의 빽빽한 가지 아래’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי דָוִד
  english_pob_choice: David’s servants
  chosen_korean: 다윗의 종들
  alternatives_korean:
  - 다윗의 신하들
  - 다윗의 부하들
  lexicon: HALOT
  rationale: עֲבָדִים은 기본적으로 종/종들입니다. 이 장면에서는 군사적 추종자들이라는 뉘앙스가 있어도, 용어 자체를 희석하지 않고 '종들'로 옮기는 것이 원문에 더 가깝습니다.
- source_word: הַפֶּרֶד
  english_pob_choice: the mule
  chosen_korean: 노새
  alternatives_korean:
  - 멀
  - 노새새끼
  lexicon: HALOT
  rationale: פֶּרֶד는 노새를 뜻합니다. 한국어 성경에서 일반적으로 통용되는 '노새'가 가장 자연스럽고 정확합니다.
- source_word: תַּחַת שׂוֹבֶךְ הָאֵלָה הַגְּדוֹלָה
  english_pob_choice: under the thick branches of a large terebinth
  chosen_korean: 큰 테레빈트의 얽힌 가지 아래
  alternatives_korean:
  - 큰 떡갈나무의 빽빽한 가지 아래
  - 큰 상수리나무의 얽힌 가지 아래
  lexicon: HALOT
  rationale: אֵלָה는 일반적인 '큰 나무'보다 '테레빈트'가 더 정확합니다. שׂוֹבֶךְ는 단순한 가지가 아니라 얽히고 빽빽한 가지 무리를 가리키므로 '얽힌 가지'로 살렸습니다.
- source_word: וַיֶּחֱזַק רֹאשׁוֹ בָאֵלָה
  english_pob_choice: his head got caught in the terebinth
  chosen_korean: 그의 머리가 테레빈트에 걸려
  alternatives_korean:
  - 그의 머리가 테레빈트에 단단히 붙잡혀
  - 그의 머리가 테레빈트에 얽혀
  lexicon: HALOT
  rationale: 직역하면 '머리가 붙잡혔다'이지만, 한국어에서는 '걸리다'가 의도치 않은 걸림과 정지를 가장 자연스럽게 표현합니다.
- source_word: בֵּין הַשָּׁמַיִם וּבֵין הָאָרֶץ
  english_pob_choice: between heaven and earth
  chosen_korean: 하늘과 땅 사이
  alternatives_korean:
  - 하늘과 땅 사이에
  - 하늘과 땅의 중간
  lexicon: HALOT
  rationale: 관용구를 그대로 살리되 한국어에서는 '사이'가 가장 자연스럽습니다. '하늘'과 '땅'은 본문의 장면성을 유지합니다.
theological_decisions:
- issue: צפיפות/장면의 충격을 완화하지 않는 표현
  chosen_reading: 압살롬이 말 위에 있는 상태에서 머리가 걸려 공중에 매달린 장면을 그대로 드러냈습니다.
  alternative_readings:
  - 사건을 완곡하게 요약하는 표현
  - 묵시적·상징적으로 완화한 표현
  rationale: 본문은 압살롬의 처참한 곤경을 서술적으로 강조합니다. 이를 완화하지 않고, 장면의 물리적 긴장을 그대로 전달하는 것이 원문 의도에 충실합니다.
  doctrine_reference: '서사 본문 해석 원칙: 서술 효과 보존'
- issue: '''종들'' 번역에서 신분 뉘앙스 유지'
  chosen_reading: עֲבָדִים을 '종들'로 옮겨 단순한 '신하들'보다 원어의 종속적 관계를 더 직접적으로 드러냈습니다.
  alternative_readings:
  - 신하들
  - 부하들
  rationale: 여기서 'servants'를 너무 완곡하게 옮기면 원어의 사회적 거리감이 약해집니다. 본문이 허용하는 범위에서 신분적 뉘앙스를 유지했습니다.
  doctrine_reference: 사회사적 어휘 보존
