review_pass:
  verdict: revise
  source_fidelity: ‘붙잡아’는 לקח(‘데려가다/취하다’)에 없는 체포·제압의 뉘앙스를 더합니다. 또한 ‘그 위에’는 바로 앞의 ‘구덩이’를 가리키는 것으로도 읽힐 수 있으나, עָלָיו는 압살롬을 가리킵니다. 이를 명시하는 편이 안전합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘각자 자기 장막으로’는 히브리어의 분배 표현과 장막의 문자 이미지를 보존하면서도 자연스럽습니다.
  terminology: 인명 ‘압살롬’, 지명·집합명사 ‘이스라엘’, ‘장막’은 적절합니다. ‘돌무더기’는 גַּל אֲבָנִים의 자연스러운 번역이며, 대안인 ‘돌무덤’은 주석에서만 제시합니다.
