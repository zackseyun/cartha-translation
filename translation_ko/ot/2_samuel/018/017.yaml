- from: 그들은 압살롬을 붙잡아 숲속의 큰 구덩이에 던지고, 그 위에 아주 큰 돌무더기를 쌓아 올렸습니다. 그리고 온 이스라엘은, 각기 자기 장막으로 도망쳤습니다.[a][b]
  to: 그들은 압살롬을 데려다가 숲속의 큰 구덩이에 던졌고, 그의 위에 매우 큰 돌무더기[a]를 쌓았습니다. 그리고 온 이스라엘은 각자 자기 장막[b]으로 도망쳤습니다.
