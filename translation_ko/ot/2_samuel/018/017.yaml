reference: 2 Samuel 18:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְח֣וּ אֶת אַבְשָׁל֗וֹם וַ/יַּשְׁלִ֨יכוּ אֹת֤/וֹ בַ/יַּ֨עַר֙ אֶל הַ/פַּ֣חַת הַ/גָּד֔וֹל וַ/יַּצִּ֧בוּ עָלָ֛י/ו גַּל אֲבָנִ֖ים גָּד֣וֹל מְאֹ֑ד וְ/כָל יִשְׂרָאֵ֔ל נָ֖סוּ אִ֥ישׁ ל/אהל/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/017.yaml
  text: And they took Absalom and threw him into the great pit in the forest[a], and they set up over him a very large heap of stones. And all Israel fled[b], each man to his tent.
  footnotes:
  - marker: a
    text: Or 'a cairn of stones.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each man to his tent,' an idiom for dispersing to one's own dwelling; that is, 'each to his home.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 압살롬을 붙잡아 숲속의 큰 구덩이에 던지고, 그 위에 아주 큰 돌무더기를 쌓아 올렸습니다. 그리고 온 이스라엘은, 각기 자기 장막으로 도망쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 ‘돌무더기’라는 뜻의 다른 번역 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘각기 자기 장막으로’는 자기 거처로 흩어졌다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ אֶת אַבְשָׁלוֹם
  english_pob_choice: they took Absalom
  chosen_korean: 압살롬을 붙잡아
  alternatives_korean:
  - 압살롬을 데려가
  - 압살롬을 취해
  lexicon: HALOT
  rationale: לקח의 서사적 기본값은 ‘take’이지만, 이 문맥에서는 시신을 수습해 옮기는 장면이므로 한국어로는 ‘붙잡아’보다 ‘붙들어’ 또는 ‘붙잡아’가 아니라 단순 ‘데려가’보다 더 직접적인 수습의 뉘앙스를 살릴 수 있으나, 원문의 처분적 행동을 드러내기 위해 ‘붙잡아’로 옮겼습니다.
- source_word: וַיַּשְׁלִיכוּ אֹתוֹ
  english_pob_choice: threw him
  chosen_korean: 던지고
  alternatives_korean:
  - 내던지고
  - 내팽개치고
  lexicon: HALOT
  rationale: שלך는 거칠게 내던지는 동작을 나타내므로, 한국어 ‘던지다’가 가장 직접적이고 인물에 대한 모욕성과 무게를 잘 보존합니다.
- source_word: בַיַּעַר אֶל הַפַּחַת הַגָּדוֹל
  english_pob_choice: into the great pit in the forest
  chosen_korean: 숲속의 큰 구덩이에
  alternatives_korean:
  - 숲의 큰 구덩이에
  - 숲속의 큰 웅덩이에
  lexicon: HALOT
  rationale: יער은 ‘숲’이 자연스럽고, פחת은 ‘구덩이’가 가장 분명한 대응입니다. ‘큰’은 great의 기본값을 살리되 현대 한국어로 자연스럽게 다듬었습니다.
- source_word: גַּל אֲבָנִים גָּדֹל מְאֹד
  english_pob_choice: a very large heap of stones
  chosen_korean: 아주 큰 돌무더기
  alternatives_korean:
  - 매우 큰 돌무더기
  - 큰 돌무더기
  lexicon: HALOT
  rationale: גל אֲבָנִים은 돌로 이루어진 무더기/더미를 가리키므로 ‘돌무더기’가 한국어로 가장 자연스럽습니다. ‘아주 큰’은 מאד의 강세를 살립니다.
- source_word: וְכָל יִשְׂרָאֵל נָסוּ
  english_pob_choice: And all Israel fled
  chosen_korean: 그리고 온 이스라엘은 ... 도망쳤습니다
  alternatives_korean:
  - 그리고 온 이스라엘은 달아났습니다
  - 그리고 모든 이스라엘이 도망쳤습니다
  lexicon: HALOT
  rationale: נוס는 ‘도망하다/달아나다’가 자연스럽고, 집합명사 ‘온 이스라엘’이 문맥의 총체성을 살립니다.
- source_word: אִישׁ לְאֹהָלוֹ
  english_pob_choice: each man to his tent
  chosen_korean: 각기 자기 장막으로
  alternatives_korean:
  - 각 사람마다 자기 장막으로
  - 각자 자기 집으로
  lexicon: HALOT
  rationale: 직역하면 ‘각기 자기 장막으로’이지만, 한국어에서는 이 표현이 분산을 뜻하는 관용구로 읽히도록 유지하는 것이 원문 질감을 잘 보존합니다. ‘장막’은 tent의 문자성을 살리고, 각기/각자는 איש의 분배성을 반영합니다.
theological_decisions:
- issue: אִישׁ לְאֹהָלוֹ의 성중립적 처리 여부
  chosen_reading: 각기 자기 장막으로
  alternative_readings:
  - 각기 자기 집으로
  - 각 사람마다 자기 장막으로
  rationale: 원문은 남성 단수 분배형이지만, 이 관용구는 ‘각자 흩어지다’라는 의미를 전달하는 공식 표현입니다. 본문에서는 문맥의 관용성과 원문 형상을 함께 살리기 위해 ‘각기 자기 장막으로’로 두고, 의미는 충분히 드러나도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §4
- issue: ‘tent’의 문자성과 관용적 의미의 균형
  chosen_reading: 장막
  alternative_readings:
  - 집
  - 거처
  rationale: 여기서 ‘장막’은 고대 서사 관용구를 보존하는 표지로 기능합니다. 현대 독자에게는 분산을 뜻하는 관용임이 비교적 분명하므로, 본문은 문자 이미지를 유지하고 필요시 주석으로 의미를 보완하는 편이 원문에 더 가깝습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §6
