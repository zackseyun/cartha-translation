  yaml_path: translation/ot/2_samuel/018/013.yaml
  text: Or if I had dealt falsely against his life, and no matter is hidden from the king, then you yourself would have stood aside.
translation:
  language: ko
  text: 만일 내가 그의 생명에 대하여 거짓을 행하였거나, 왕에게는 모든 일이 숨겨지지 않으니, 당신이 직접 물러서 있었을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנַפְשׁוֹ
  english_pob_choice: against his life
  chosen_korean: 그의 생명에 대하여
  alternatives_korean:
  - 그의 목숨에 대하여
  - 그의 생명에 대해
  lexicon: נֶפֶשׁ
  rationale: 대상의 인격적 생명 자체를 가리키므로 ‘생명’이 가장 직접적이며, 한국어에서도 법정·서술 문맥에 자연스럽습니다.
- source_word: שֶׁקֶר
  english_pob_choice: dealt falsely
  chosen_korean: 거짓을 행하였거나
  alternatives_korean:
  - 거짓되이 행하였거나
  - 속여 행하였거나
  lexicon: שֶׁקֶר
  rationale: 단순한 말의 거짓이 아니라 행위의 불성실·배신 가능성을 포함하므로 ‘거짓을 행하다’로 넓게 살렸습니다.
- source_word: יִכָּחֵד
  english_pob_choice: hidden
  chosen_korean: 숨겨지지 않으니
  alternatives_korean:
  - 감추어지지 않으니
  - 숨은 바 없으니
  lexicon: כָּחַד
  rationale: 부정 수동으로 왕 앞에서 모든 것이 드러난다는 의미를 자연스럽게 표현했습니다.
- source_word: מִנֶּגֶד
  english_pob_choice: stood aside
  chosen_korean: 물러서 있었을 것입니다
  alternatives_korean:
  - 비켜 서 있었을 것입니다
  - 물러나 있었을 것입니다
  lexicon: נגד
  rationale: ‘stand aside’의 결과 상태를 한국어로 옮기되, 단순한 공간 이동보다 책임 회피의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 왕에게 숨겨진 것이 없다는 진술의 기능
  chosen_reading: 이는 다윗 왕 앞에서 사실이 은폐될 수 없다는 항변으로 이해했습니다.
  alternative_readings:
  - 전능한 하나님 앞에서의 전면적 노출로 넓게 읽을 수 있습니다.
  - 왕의 사법적 판단력에 대한 과장된 진술로만 볼 수 있습니다.
  rationale: 문맥상 군왕에게 대한 변호이므로 1차적으로는 역사적 왕권 문맥을 유지하되, 표현 자체가 사실의 전면적 노출을 시사한다는 점은 보존했습니다.
  doctrine_reference: 문맥적 왕권 진술
