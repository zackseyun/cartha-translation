revisions:
- from: 만일 내가 그의 생명에 대하여 거짓을 행하였거나, 왕에게는 모든 일이 숨겨지지 않으니, 당신이 직접 물러서 있었을 것입니다.
  to: 만일 내가 그의 목숨을 두고 속임수를 썼더라면—왕에게는 어떤 일도 숨겨지지 않으니—당신은 스스로 물러나 있었을 것입니다.
  rationale: 가정법을 한국어의 ‘-했더라면 ... -었을 것입니다’ 구조로 바로잡고, 원문의 ‘그의 목숨에 관하여 거짓되이 행하다’라는 다소 압축된 표현은 의미를 과도하게 특정하지 않는 ‘그의 목숨을 두고 속임수를 쓰다’로 자연화했습니다. 삽입절과 ‘물러나 있다’의 책임 회피적 뉘앙스는 유지했습니다.
  reviewer_model: gpt-5.6-terra
