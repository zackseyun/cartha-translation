  source_fidelity: 히브리어의 조건문과 삽입된 일반 진술을 보존했습니다. בְּנַפְשׁוֹ שֶׁקֶר는 그의 목숨을 두고/해하여 거짓되이 행하는 일을 뜻하므로, 단순히 ‘생명에 대하여 거짓을 행하다’보다 자연스러운 한국어로 옮기는 것이 적절합니다. מִנֶּגֶד의 ‘맞서지 않고 물러서다/비켜 서다’라는 문맥적 뉘앙스도 유지했습니다.
  naturalness: 초안의 ‘그의 생명에 대하여 거짓을 행하였거나’는 현대 한국어에서 어색하고, ‘만일’로 시작한 가정문에는 ‘-했더라면’이 자연스럽습니다. ‘어떤 일도 왕에게 숨겨지지 않으니’는 원문의 일반 진술을 명료하게 표현합니다.
  terminology: נֶפֶשׁ는 이 문맥에서 관용적으로 ‘목숨’으로 옮기는 편이 자연스럽습니다. שֶׁקֶר는 ‘속임수’로, יִכָּחֵד는 ‘숨겨지다’로 유지했습니다. 신학적 용어는 해당하지 않습니다.
  issues:
  - severity: medium
    issue: 조건문의 연결과 ‘거짓을 행하다’라는 표현
    rationale: ‘만일 ... 하였거나’는 뒤의 가정적 결과와 문법적으로 매끄럽게 연결되지 않으며, ‘생명에 대하여 거짓을 행하다’는 한국어 관용에 맞지 않습니다.
  - severity: low
    issue: ‘그의 생명’의 어휘 선택
    rationale: 문맥은 압살롬을 죽이거나 그의 목숨을 해하는 행위를 가리키므로 ‘목숨’이 현대 서사 문맥에서 더 자연스럽습니다.
  revised_text: 만일 내가 그의 목숨을 두고 속임수를 썼더라면—왕에게는 어떤 일도 숨겨지지 않으니—당신은 스스로 물러나 있었을 것입니다.
