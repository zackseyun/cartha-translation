  naturalness: 합쇼체는 적절합니다. 다만 직접 인용 안에서 ‘제가 달려가서 … 전하게 해 주십시오’보다 ‘부디 제가 달려가 … 전하도록 허락해 주십시오’가 요청의 대상과 행동의 관계를 더 명료하고 자연스럽게 나타냅니다. 각주 표지는 해당 표현 바로 뒤에 두는 것이 독자의 이해에 좋습니다.
  terminology: ‘사독’, ‘아히마아스’, ‘야훼’는 일관되고 적절합니다. ‘소식을 전하다’는 בשר의 중립적 기본 뜻을 잘 살리며, ‘기쁜 소식’의 가능성은 각주에 두는 것이 좋습니다.
