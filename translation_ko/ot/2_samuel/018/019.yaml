id: 2SA.18.19
reference: 2 Samuel 18:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲחִימַ֤עַץ בֶּן צָדוֹק֙ אָמַ֔ר אָר֣וּצָה נָּ֔א וַ/אֲבַשְּׂרָ֖ה אֶת הַ/מֶּ֑לֶךְ כִּי שְׁפָט֥/וֹ יְהוָ֖ה מִ/יַּ֥ד אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/019.yaml
  text: Then Ahimaaz the son of Zadok said[a], “Please let me run and bring news to the king[b], for Yahweh has delivered him from the hand of his enemies.”
  footnotes:
  - marker: a
    text: Or, “and announce the good news to the king,” since the Hebrew verb can carry the sense of bringing favorable news.
    reason: lexical_alternative
  - marker: b
    text: Or, “the LORD has judged for him” / “has given him justice,” emphasizing judicial vindication.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사독의 아들 아히마아스가 말했습니다. “제가 달려가서 왕에게 소식을 전하게 해 주십시오. 야훼께서 그의 원수들의 손에서 그를 건져 내셨기 때문입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왕에게 기쁜 소식을 전하게 해 주십시오”일 수 있습니다. 히브리어 동사는 좋은 소식을 전하는 뜻까지 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “야훼께서 그를 위해 판결하셨기 때문입니다” / “그에게 정의를 주셨기 때문입니다”로도 옮길 수 있습니다. 이는 משפט의 사법적 변호 뉘앙스를 더 직접적으로 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחִימַעַץ
  english_pob_choice: Then Ahimaaz
  chosen_korean: 그때 아히마아스
  alternatives_korean:
  - 그리고 아히마아스
  - 그런 뒤 아히마아스
  lexicon: HALOT
  rationale: 접두사 waw는 서술의 진행을 표시하므로 한국어에서는 자연스러운 시간 부사어 ‘그때’로 옮겨 사건의 흐름을 살렸습니다.
- source_word: אָרוּצָה נָּא
  english_pob_choice: Please let me run
  chosen_korean: 제가 달려가서
  alternatives_korean:
  - 제가 달려가게 해 주십시오
  - 부디 제가 달려가겠습니다
  lexicon: HALOT
  rationale: 청유적 cohortative와 נא의 요청성을 반영하되, 한국어에서는 직접적인 부탁 형태보다 행위 의사를 자연스럽게 드러내는 연결형이 문맥에 맞습니다.
- source_word: וַאֲבַשְּׂרָה אֶת הַמֶּלֶךְ
  english_pob_choice: and bring news to the king
  chosen_korean: 왕에게 소식을 전하게 해 주십시오
  alternatives_korean:
  - 왕에게 기쁜 소식을 전하게 해 주십시오
  - 왕에게 알리게 해 주십시오
  lexicon: HALOT
  rationale: בשׂר의 핵심은 ‘소식을 전하다’이며, 여기서는 승전/구원 소식의 맥락이지만 후대의 기술적 용례를 미리 들이지 않기 위해 중립적이고 자연스러운 표현을 택했습니다.
- source_word: שְׁפָטוֹ
  english_pob_choice: has delivered him
  chosen_korean: 그를 건져 내셨기 때문입니다
  alternatives_korean:
  - 그를 위하여 판결하셨기 때문입니다
  - 그를 변호하셨기 때문입니다
  - 그를 위해 정의를 세우셨기 때문입니다
  lexicon: HALOT
  rationale: 문맥상 אויבים의 손에서 벗어나게 하신 하나님의 행위를 가리키므로, 단순한 재판 행위보다 구출의 결과를 분명히 드러내는 ‘건져 내다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트의 기본 원칙에 따라 신성 4문자 יְהוָה는 관례적 대체어가 아니라 고유명사 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: שׁפט의 문맥상 의미
  chosen_reading: 하나님이 왕을 적의 손에서 실제로 건져 내시는 구원 행위로 이해했습니다.
  alternative_readings:
  - 왕을 위해 판결하셨다
  - 왕에게 정의를 주셨다
  - 왕을 변호하셨다
  rationale: 원문은 אויבים의 손에서의 해방을 설명하므로, 독자에게 재판 용어보다 구원·해방의 의미가 먼저 전달되어야 합니다. 다만 그 구원은 단순한 감정적 위로가 아니라 야훼의 न्याय적 개입이라는 점을 유지했습니다.
  doctrine_reference: 2 Samuel 18:19; WLC שׁפט의 구원/변호 문맥
