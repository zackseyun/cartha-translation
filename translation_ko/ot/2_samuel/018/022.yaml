  text: וַ/יֹּ֨סֶף ע֜וֹד אֲחִימַ֤עַץ בֶּן צָדוֹק֙ וַ/יֹּ֣אמֶר אֶל יוֹאָ֔ב וִ֣/יהִי מָ֔ה אָרֻֽצָה נָּ֥א גַם אָ֖נִי אַחֲרֵ֣י הַ/כּוּשִׁ֑י וַ/יֹּ֣אמֶר יוֹאָ֗ב לָֽ/מָּה זֶּ֞ה אַתָּ֥ה רָץ֙ בְּנִ֔/י וּ/לְ/כָ֖ה אֵין בְּשׂוֹרָ֥ה מֹצֵֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/022.yaml
  text: Then Ahimaaz son of Zadok said again to Joab[a], “Whatever happens, please let me also run after the Cushite.” But Joab said, “Why would you run, my son[b], since you have no message that will bring reward?”
  footnotes:
  - marker: a
    text: Or, 'Come what may, please let me also run after the Cushite.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of the final clause is difficult; it may mean 'you have no news that will be favorably received' or 'you will get no reward for the news.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 사독의 아들 아히마아스가 다시 요압에게 말했습니다. 「무슨 일이 있어도[a], 저도 구스 사람을 따라 달려가게 해 주십시오.」 그러자 요압이 말했습니다. 「내 아들아, 왜 달려가려고 하십니까? 당신에게는 보상을 가져올 소식이 없지 않습니까?」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무슨 일이 있어도’는 히브리어 관용 표현(וִיהִי מָה)을 옮긴 것입니다. ‘어찌 되든지’로도 번역할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 마지막 절은 난해합니다. ‘보상을 가져올 소식이 없다’ 또는 ‘좋게 받아들여질 소식이 없다’라는 뜻으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  english_pob_choice: said again
  chosen_korean: 또 말했습니다
  alternatives_korean:
  - 다시 말했습니다
  - 계속 말했습니다
  lexicon: HALOT
  rationale: 반복 발화를 나타내는 관용구이므로, 한국어에서는 자연스럽게 ‘또’로 처리해 재요청의 흐름을 살렸습니다.
- source_word: וִיהִי מָה
  english_pob_choice: Whatever happens
  chosen_korean: 무슨 일이 있어도
  alternatives_korean:
  - 무슨 일이 있더라도
  - 어찌 되든지
  lexicon: HALOT
  rationale: 결과에 대한 개의치 않음을 드러내는 관용적 표현이라, 현대 한국어에서 가장 직접적인 ‘무슨 일이 있어도’로 옮겼습니다.
- source_word: הַכּוּשִׁי
  english_pob_choice: the Cushite
  chosen_korean: 쿠시 사람
  alternatives_korean:
  - 구스 사람
  - 에티오피아 사람
  lexicon: HALOT
  rationale: 지명 유래의 민족명으로서 본문과 직결되는 표기를 살렸고, ‘에티오피아 사람’은 시대착오적일 수 있어 피했습니다.
- source_word: אֵין בְּשׂוֹרָה מֹצֵאת
  english_pob_choice: you have no message that will bring reward
  chosen_korean: 보상받을 소식이 없지 않느냐
  alternatives_korean:
  - 좋게 받아들여질 소식이 없지 않느냐
  - 보상으로 이어질 소식이 없지 않느냐
  lexicon: HALOT
  rationale: 히브리어는 난해하고 생략적이어서, 요압의 요지는 아히마아스가 달려갈 만한 ‘유리한 소식’이 없다는 뜻으로 읽고 ‘보상받을 소식’으로 자연스럽게 반영했습니다.
