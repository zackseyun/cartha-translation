revisions:
- from: 그때 스루야의 아들 아히마아스가 또 요압에게 말했습니다. 「무슨 일이 있어도, 저도 쿠시 사람을 따라 달려가게 해 주십시오。」 그러자 요압이 말했습니다. 「왜 달리려 하느냐, 내 아들아? 너는 보상받을 소식이 없지 않느냐?」[a][b]
  to: 그때 사독의 아들 아히마아스가 다시 요압에게 말했습니다. 「무슨 일이 있어도[a], 저도 구스 사람을 따라 달려가게 해 주십시오.」 그러자 요압이 말했습니다. 「내 아들아, 왜 달려가려고 하십니까? 당신에게는 보상을 가져올 소식이 없지 않습니까?」[b]
  rationale: 사독을 스루야로 잘못 옮긴 계보 오류를 바로잡았습니다. 직접화법을 현대 합쇼체로 통일하고, כושי는 ‘구스 사람’으로 옮겼습니다. 마지막 절의 단정하기 어려운 의미는 본문에서는 영어 POB의 ‘보상’ 해석을 따라 자연스럽게 번역하고, 대안은 해당 절의 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:44:14Z'
review_pass:
  verdict: revise
  source_fidelity: 현 번역은 아히마아스를 ‘스루야의 아들’로 한 중대한 인명·계보 오류가 있습니다. 히브리어는 분명히 ‘사독의 아들 아히마아스’입니다. 또한 난해한 마지막 절은 보상/유리한 결과의 가능성과 호의적으로 받아들여질 소식이라는 양쪽 해석 가능성을 각주로 보존하는 것이 적절합니다.
  naturalness: ‘무슨 일이 있어도’와 ‘달려가게 해 주십시오’는 현대 한국어로 자연스럽습니다. 다만 목표 문체가 합쇼체이므로 요압의 직접화법 ‘왜 달리려 하느냐’, ‘없지 않느냐’는 ‘왜 달려가려고 하십니까’, ‘없지 않습니까’로 고쳤습니다.
  terminology: ‘사독’과 ‘구스 사람’을 사용했습니다. ‘구스 사람’은 כושי를 시대착오적 국가명으로 한정하지 않으면서 한국어 성서 문맥에서 통용되는 명칭입니다. ‘보상을 가져올 소식’은 영어 POB의 해석을 따르되, 본문의 난해성은 각주에 남겼습니다.
