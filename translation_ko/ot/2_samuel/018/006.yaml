id: 2SA.18.6
reference: 2 Samuel 18:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵ֥א הָ/עָ֛ם הַ/שָּׂדֶ֖ה לִ/קְרַ֣את יִשְׂרָאֵ֑ל וַ/תְּהִ֥י הַ/מִּלְחָמָ֖ה בְּ/יַ֥עַר אֶפְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/006.yaml
  text: So the troops went out into the field to meet Israel[a], and the battle took place in the forest of Ephraim.
  footnotes:
  - marker: a
    text: Hebrew 'the people'; here the term refers to David's fighting force, hence 'the troops.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 군대가 이스라엘과 맞서기 위해 들판으로 나갔고, 전투는 에브라임의 숲에서 벌어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘백성’이지만, 여기서는 앞뒤 문맥상 다윗의 전투 부대를 가리키므로 ‘군대’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  english_pob_choice: the troops
  chosen_korean: 그 군대
  alternatives_korean:
  - 그 백성
  - 그 사람들
  - 그 병사들
  lexicon: HALOT
  rationale: 문자적으로는 ‘백성’이지만, 이 문맥에서는 바로 앞뒤 전개상 다윗의 전투 부대를 가리키므로 한국어에서는 군사적 집합을 드러내는 ‘그 군대’가 가장 자연스럽습니다.
- source_word: הַשָּׂדֶה
  english_pob_choice: into the field
  chosen_korean: 들판으로
  alternatives_korean:
  - 밭으로
  - 야지로
  - 평야로
  lexicon: HALOT
  rationale: ‘field/open country’의 의미를 살리되, 전투 진입의 공간감을 주는 표준어 표현으로 ‘들판’이 무난합니다.
- source_word: לִקְרַאת
  english_pob_choice: to meet
  chosen_korean: 맞서기 위해
  alternatives_korean:
  - 만나기 위해
  - 대면하기 위해
  - 마주하기 위해
  lexicon: HALOT
  rationale: 직역하면 ‘~을 만나러/맞으러’이지만, 전투 문맥에서는 단순 조우보다 적대적 대결을 함축하므로 그 함의를 드러내는 ‘맞서기 위해’로 옮겼습니다.
- source_word: בְּיַעַר אֶפְרָיִם
  english_pob_choice: in the forest of Ephraim
  chosen_korean: 에브라임의 숲
  alternatives_korean:
  - 에브라임의 숲속
  - 에브라임의 산림
  - 에브라임 숲
  lexicon: HALOT
  rationale: יַעַר은 ‘숲/산림’이며, 소유격 구조를 그대로 살려 지명과 공간을 간결하게 연결하는 ‘에브라임의 숲’으로 옮겼습니다.
theological_decisions:
- issue: ישראל을 특정 집단명으로 유지할지, 의미를 풀어 ‘이스라엘 사람들’로 바꿀지
  chosen_reading: 고유명사 ‘이스라엘’을 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 군대
  rationale: 본문은 대립하는 편을 집합적으로 가리키면서도 실제 표기는 ‘이스라엘’이므로, 해석을 덧씌우지 않고 원문의 호칭을 보존했습니다.
  doctrine_reference: 서술문맥의 지리·군사적 지시를 본문 자체로 드러내는 원문 존중 원칙
- issue: וַתְּהִי의 사건 서술을 어떻게 한국어로 자연스럽게 표현할지
  chosen_reading: ‘전투는 … 벌어졌습니다’로 사건 발생을 자연스럽게 전달했습니다.
  alternative_readings:
  - 전투가 있었습니다
  - 전투가 일어났습니다
  - 전투가 되었습니다
  rationale: 히브리어의 단순 존재/발생 동사를 한국어 사건 서술 관용에 맞춰 옮기되, 본문의 사실 진술성을 유지했습니다.
  doctrine_reference: 서술문의 사건성 보존과 한국어 관용 사이의 최적 등가 원칙
