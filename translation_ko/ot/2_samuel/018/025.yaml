  yaml_path: translation/ot/2_samuel/018/025.yaml
  text: Then the watchman called out and told the king. And the king said[a], “If he is by himself, there is news in his mouth.” And he kept coming nearer and nearer.
  footnotes:
  - marker: a
    text: Or, “there is news in his mouth.” The Hebrew noun can mean simply “news,” though in this context it likely implies favorable news.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 파수꾼이 외쳐 왕에게 알렸습니다. 왕이 말했습니다. “그가 혼자라면, 그가 전할 소식이 있습니다.[a]” 그는 계속 점점 더 가까이 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘좋은 소식이 있습니다.’ 히브리어 명사는 단순히 ‘소식’을 뜻할 수 있지만, 이 문맥에서는 아마도 좋은 소식을 암시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  english_pob_choice: the watchman
  chosen_korean: 파수꾼
  alternatives_korean:
  - 망보는 사람
  - 보초
  lexicon: HALOT
  rationale: 전쟁 문맥의 צפֶה는 지켜보는 자를 뜻하므로, 군사적·서사적 뉘앙스를 살릴 수 있는 ‘파수꾼’이 가장 자연스럽습니다.
- source_word: וַיִּקְרָא
  english_pob_choice: called out
  chosen_korean: 외쳐
  alternatives_korean:
  - 불러
  - 소리쳐
  lexicon: HALOT
  rationale: 단순한 호출이 아니라 들리도록 크게 알리는 동작이므로 ‘외쳐’가 원문의 발화 강도를 잘 드러냅니다.
- source_word: בְּשׂוֹרָה
  english_pob_choice: news
  chosen_korean: 소식
  alternatives_korean:
  - 뉴스
  - 기별
  lexicon: HALOT
  rationale: 히브리어 בְּשׂוֹרָה는 ‘소식/전갈’의 뜻이므로, 본문이 명시적으로 ‘좋은’이라고 하지 않는 이상 중립적인 ‘소식’이 원문에 더 가깝습니다.
- source_word: וַיֵּלֶךְ הָלֹוךְ וְקָרֵב
  english_pob_choice: he kept coming nearer and nearer
  chosen_korean: 점점 더 가까이 오고 있었습니다
  alternatives_korean:
  - 계속 가까이 오고 있었습니다
  - 점점 더 가까워지고 있었습니다
  lexicon: HALOT
  rationale: 반복·진행을 나타내는 관용구이므로, 한국어에서는 ‘점점 더’와 진행형으로 계속 가까워지는 상태를 자연스럽게 표현했습니다.
theological_decisions:
- issue: בְּשׂוֹרָה의 의미를 ‘좋은 소식’으로 확정할지 여부
  chosen_reading: 본문에는 단순히 ‘소식’으로 두고, 긍정적 함의는 문맥에서 읽히도록 했습니다.
  alternative_readings:
  - 좋은 소식
  - 기쁜 소식
  rationale: 영어 POB도 주석에서 이 단어가 문맥상 유익한 소식을 암시할 수 있음을 인정하면서도, 본문 번역은 어휘상 중립적인 ‘news’로 조정했습니다. 따라서 한국어도 그 어휘적 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: translation principle / lexical restraint
