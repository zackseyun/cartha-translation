  text: וַ/יֹּ֨אמֶר֙ הַ/צֹּפֶ֔ה אֲנִ֤י רֹאֶה֙ אֶת מְרוּצַ֣ת הָ/רִאשׁ֔וֹן כִּ/מְרֻצַ֖ת אֲחִימַ֣עַץ בֶּן צָד֑וֹק וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אִֽישׁ ט֣וֹב זֶ֔ה וְ/אֶל בְּשׂוֹרָ֥ה טוֹבָ֖ה יָבֽוֹא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/027.yaml
  text: Then the watchman said[a], “I see the running of the first one is like the running of Ahimaaz the son of Zadok.” And the king said, “He is a good man[b], and he comes with good news.”
  footnotes:
  - marker: a
    text: Or, more formally, “the running of the first one is like the running of Ahimaaz.”
    reason: lexical_alternative
  - marker: b
    text: Or “he will come with good news”; the Hebrew verb can be understood as future.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 파수꾼이 말했습니다. “첫 번째 사람의 달음질을 보니 사독의 아들 아히마아스의 달음질과 같습니다.”[a] 왕이 말했습니다. “그는 좋은 사람입니다. 그는 좋은 소식을 가지고 옵니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 좀 더 직역하면, “첫 번째 사람의 달음질은 아히마아스의 달음질과 같습니다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 “그는 좋은 소식을 가지고 올 것입니다”로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  english_pob_choice: the watchman
  chosen_korean: 파수꾼
  alternatives_korean:
  - 망보는 사람
  - 초소병
  lexicon: HALOT
  rationale: 감시·정찰의 기능을 가진 사람을 가리키므로, 현대 한국어에서 자연스럽고 서사 문맥에 맞는 ‘파수꾼’으로 옮겼습니다.
- source_word: מְרוּצַת הָרִאשׁוֹן / כִּמְרֻצַת
  english_pob_choice: the running of the first one / is like the running of
  chosen_korean: 첫 번째 사람의 달음질이 ... 같은 것을 봅니다
  alternatives_korean:
  - 첫 사람의 달음질이 ... 같은 것을 봅니다
  - 첫 번째 이의 달림이 ... 같음을 봅니다
  lexicon: HALOT
  rationale: 히브리어는 ‘달리는 사람’보다 ‘달음질’이라는 명사형을 두 번 사용하므로, 그 관찰의 형식을 살려 ‘달음질’로 반복 대응했습니다.
- source_word: אִישׁ טוֹב זֶה
  english_pob_choice: He is a good man
  chosen_korean: 그는 좋은 사람입니다
  alternatives_korean:
  - 그는 좋은 사람입니다
  - 그는 훌륭한 사람입니다
  - 이 사람은 좋은 사람입니다
  lexicon: HALOT
  rationale: 직역상 ‘좋은 사람’이지만, 왕의 인물 평가를 현대 한국어에서 자연스럽게 전달하기 위해 ‘좋은 사람’으로 옮겼습니다.
- source_word: בְּשׂוֹרָה טוֹבָה
  english_pob_choice: good news
  chosen_korean: 좋은 소식
  alternatives_korean:
  - 기쁜 소식
  - 복된 소식
  lexicon: HALOT
  rationale: 공적 전달물로서의 בְּשׂוֹרָה를 ‘소식’으로 풀고, טובָה를 ‘좋은’으로 반영해 원문의 기본 의미를 유지했습니다.
theological_decisions:
- issue: 아히마아스가 실제로 이미 오고 있는지, 또는 앞으로 올 것인지의 시제 처리
  chosen_reading: 현재 진행형으로 ‘그는 좋은 사람입니다. 그리고 그는 좋은 소식을 가지고 오고 있습니다’라고 옮겼습니다.
  alternative_readings:
  - ‘그는 좋은 사람입니다. 그리고 그는 좋은 소식을 가지고 올 것입니다’
  - ‘그는 좋은 사람입니다. 그리고 그는 좋은 소식을 가져올 사람입니다’
  rationale: 히브리어 יָבוֹא는 문맥상 미래로도 읽을 수 있지만, 왕의 즉각적 식별 발언이라는 장면을 살려 현재적 진행 의미로 자연스럽게 표현했습니다.
  doctrine_reference: 서사 문맥의 동시성 및 히브리어 미완료형의 담화적 유연성
