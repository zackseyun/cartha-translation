source:
  edition: WLC
  text: וִ/יהִי מָ֣ה אָר֔וּץ וַ/יֹּ֥אמֶר ל֖/וֹ ר֑וּץ וַ/יָּ֤רָץ אֲחִימַ֨עַץ֙ דֶּ֣רֶךְ הַ/כִּכָּ֔ר וַֽ/יַּעֲבֹ֖ר אֶת הַ/כּוּשִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/023.yaml
  text: But he said[a], “Whatever happens, let me run.” So he said to him[c][b], “Run.” Then Ahimaaz ran by the way of the plain and passed the Cushite.
  footnotes:
  - marker: a
    text: Or, “Come what may, I will run.” The Hebrew expression is idiomatic and conveys Ahimaaz’s insistence on running regardless of the outcome.
    reason: alternative_reading
  - marker: b
    text: “The plain” likely refers to the Jordan plain; the Hebrew does not require that fuller geographic specification in the main text.
    reason: cultural_note
  - marker: c
    text: Or, “outran the Cushite.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 말했습니다. “무슨 일이 있어도 제가 달려가겠습니다.” 그러자 그가 그에게 말했습니다. “달려가라.” 그래서 아히마아스는 들판길로 달려가서 구스 사람을 앞질렀습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무슨 일이 있어도’는 히브리어 관용구의 의지를 살린 번역입니다.
    reason: source_note
  - marker: b
    text: ‘들판’은 여기서 히브리어 ‘כִּכָּר’의 일반적 지시를 따른 것으로, 더 좁게는 요단 들판을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: c
    text: ‘앞질렀습니다’는 ‘지나갔다’보다 달리기 문맥에서 앞서는 뜻을 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי מָה אָרוּץ
  english_pob_choice: Whatever happens, let me run.
  chosen_korean: 무슨 일이 있어도 제가 달려가겠습니다.
  alternatives_korean:
  - 어찌 되든 제가 달려가겠습니다.
  - 무슨 일이 있어도 달려가게 해주십시오.
  lexicon: HALOT
  rationale: וִיהִי מָה와 אָרוּץ의 결합은 단순한 선언보다 달리겠다는 완강한 요청/의지를 나타내므로, 한국어에서는 자연스럽게 ‘무슨 일이 있어도’로 힘을 살려 옮겼습니다.
- source_word: רוּץ
  english_pob_choice: Run.
  chosen_korean: 달려가라.
  alternatives_korean:
  - 가라, 달려가라.
  - 달려가십시오.
  lexicon: HALOT
  rationale: 동사의 직설적인 명령형이므로 간단한 명령으로 살렸고, 인물 간 대화이지만 공손한 서술체를 유지하기 위해 ‘달려가라’로 옮겼습니다.
- source_word: דֶּרֶךְ הַכִּכָּר
  english_pob_choice: by the way of the plain
  chosen_korean: 들판길로
  alternatives_korean:
  - 평야길로
  - 평지 길로
  lexicon: HALOT
  rationale: כִּכָּר는 ‘평야/들판’의 의미를 가지므로, 지리적 세부를 과도하게 풀지 않으면서 한국어에서 자연스러운 ‘들판길’로 간결하게 표현했습니다.
- source_word: וַיַּעֲבֹר אֶת הַכּוּשִׁי
  english_pob_choice: and passed the Cushite
  chosen_korean: 구스 사람을 앞질렀습니다.
  alternatives_korean:
  - 구스 사람을 지나쳤습니다.
  - 구스 사람보다 앞서 갔습니다.
  lexicon: HALOT
  rationale: עבר은 여기서 단순 통과보다 ‘앞지르다/추월하다’의 뉘앙스가 분명하므로, 달리기 맥락을 드러내는 ‘앞질렀습니다’로 옮겼습니다.
- source_word: הַכּוּשִׁי
  english_pob_choice: the Cushite
  chosen_korean: 구스 사람
  alternatives_korean:
  - 구스인
  - 에티오피아 사람
  lexicon: HALOT
  rationale: 민족·지명 표지를 직접 보존하기 위해 전통적 일반화인 ‘에티오피아 사람’보다 ‘구스 사람’을 사용했습니다.
theological_decisions:
- issue: 인물 대화의 명령형과 서술체 존대의 균형
  chosen_reading: 본문 서술은 합쇼체로 유지하되, 인물 간 직접 발화는 원문의 명령형을 그대로 살려 ‘달려가라’로 처리했습니다.
  alternative_readings:
  - 달려가십시오
  - 달려가세요
  rationale: 히브리어 원문의 대화 역학을 흐리지 않으면서도 한국어 본문 전체의 문체는 현대 공용역 수준으로 유지하기 위한 선택입니다.
  doctrine_reference: 문체/화용상의 판단
