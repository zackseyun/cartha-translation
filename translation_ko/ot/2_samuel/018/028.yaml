  yaml_path: translation/ot/2_samuel/018/028.yaml
  text: Ahimaaz called out and said to the king[a], “Peace!” Then he bowed down before the king with his face to the ground and said, “Blessed be Yahweh your God[b], who has delivered up the men who lifted their hand against my lord the king.”
  footnotes:
  - marker: a
    text: Or 'All is well!' The Hebrew shalom can function as a report of well-being or favorable news, not only as a greeting.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'has delivered up' or 'has handed over.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아히마아스가 외쳐 왕에게 말했습니다. “평안합니다!”[a] 그런 다음 그는 얼굴을 땅에 대고 왕 앞에 엎드려 절한 뒤 말했습니다. “왕의 하나님 야훼께서는 찬송받으시기를 바랍니다. 그분께서 내 주이신 왕을 거슬러 손을 든 그 사람들을 넘겨주셨습니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שָׁלוֹם은 인사말뿐 아니라 ‘모든 일이 잘되었다’는 보고나 좋은 소식의 뜻으로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘넘겨주셨습니다’ 또는 ‘내주셨습니다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  english_pob_choice: Peace!
  chosen_korean: 평안합니다!
  alternatives_korean:
  - 평안합니다!
  - 안녕하십니까!
  - 모든 일이 잘되었습니다!
  lexicon: HALOT
  rationale: 정탐/소식 전달 맥락에서 שָׁלוֹם은 단순 인사가 아니라 안부·결과 보고를 담을 수 있으므로, 짧고 결과지향적인 감각을 살려 ‘평안합니다!’로 옮겼습니다.
- source_word: וַיִּשְׁתַּחוּ
  english_pob_choice: he bowed down
  chosen_korean: 엎드려 절하며
  alternatives_korean:
  - 엎드렸습니다
  - 몸을 굽혔습니다
  - 경배했습니다
  lexicon: HALOT
  rationale: 동작의 핵심은 몸을 낮추어 왕 앞에 완전히 복종하는 자세이므로, 뒤의 ‘얼굴을 땅에 대고’와 함께 자연스럽게 읽히도록 ‘엎드려 절하며’로 옮겼습니다.
- source_word: בָּרוּךְ יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Blessed be Yahweh your God
  chosen_korean: 주 당신의 하나님 야훼를 찬송합니다
  alternatives_korean:
  - 야훼 당신의 하나님을 찬송합니다
  - 주 당신의 하나님 야훼가 찬송받으십니다
  - 복되신 주 당신의 하나님 야훼
  lexicon: HALOT
  rationale: 축복 공식의 doxological 힘을 살리면서도 현대 한국어에서 자연스럽게 들리도록 ‘찬송합니다’를 택했고, 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: סִגַּר
  english_pob_choice: has delivered up
  chosen_korean: 넘겨주셨습니다
  alternatives_korean:
  - 넘겨주셨습니다
  - 인도하셨습니다
  - 내주셨습니다
  lexicon: HALOT
  rationale: 문맥상 적군을 왕의 손에 넘긴다는 뜻이므로, 단순히 ‘닫다’의 의미를 피하고 군사·법정적 뉘앙스를 살리는 ‘넘겨주셨습니다’를 선택했습니다.
- source_word: נָשְׂאוּ אֶת יָדָם
  english_pob_choice: lifted their hand against
  chosen_korean: 손을 들어 올린
  alternatives_korean:
  - 손을 들어 올린
  - 반역한
  - 대적한
  lexicon: HALOT
  rationale: 히브리어 관용구의 구체적 이미지를 유지하기 위해 해석어인 ‘반역한’보다 직역성 있는 ‘손을 들어 올린’을 사용했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 주 앞의 첫 호칭은 예우 표현으로 두고, 신명은 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  - the LORD
  rationale: 프로젝트 기본값에 따라 יְהוָה는 인명적·계시적 신명으로서 ‘야훼’로 드러내고, ‘주 당신의 하나님’은 히브리어 האדון/관계 표현의 예우를 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 왕에게 엎드리는 예법의 번역
  chosen_reading: 물리적 전면 엎드림과 경의 표명을 함께 드러내는 표현을 택했습니다.
  alternative_readings:
  - 절했습니다
  - 엎드렸습니다
  - 경배했습니다
  rationale: 본문은 단순 인사보다 왕 앞에서의 완전한 신체적 낮춤을 강조하므로, 서술의 사실성과 위계감을 함께 보존했습니다.
  doctrine_reference: Narrative posture in Hebrew court settings
