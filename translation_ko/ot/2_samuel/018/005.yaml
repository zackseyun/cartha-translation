source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת י֠וֹאָב וְ/אֶת אֲבִישַׁ֤י וְ/אֶת אִתַּי֙ לֵ/אמֹ֔ר לְ/אַט לִ֖/י לַ/נַּ֣עַר לְ/אַבְשָׁל֑וֹם וְ/כָל הָ/עָ֣ם שָׁמְע֗וּ בְּ/צַוֺּ֥ת הַ/מֶּ֛לֶךְ אֶת כָּל הַ/שָּׂרִ֖ים עַל דְּבַ֥ר אַבְשָׁלֽוֹם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/005.yaml
  text: And the king commanded Joab and Abishai and Ittai[a], saying, “Deal gently for my sake with the young man Absalom.” And all the people heard when the king commanded all the commanders concerning Absalom.
  footnotes:
  - marker: a
    text: Or, 'Be gentle with the young man for me—Absalom.' The Hebrew compresses the appeal and the identification of Absalom into a terse expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 요압과 아비새와 잇대에게 명령했습니다. “나를 생각해서 그 젊은이 압살롬을 부드럽게 대해 주십시오.” 왕이 압살롬에 관하여 모든 지휘관들에게 명령할 때, 모든 백성이 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나를 위해 그 젊은이, 곧 압살롬을 부드럽게 대해 주십시오.” 히브리어는 왕의 개인적 호소와 ‘그 젊은이’가 압살롬을 가리킨다는 점을 간결하게 함께 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו / commanded
  english_pob_choice: commanded
  chosen_korean: 명하여
  alternatives_korean:
  - 명령하여
  - 지시하여
  lexicon: HALOT
  rationale: צוה의 명령 행위를 자연스러운 서술로 옮기되, 왕의 권위를 드러내는 ‘명하다’를 택했습니다.
- source_word: לְאַט לִי
  english_pob_choice: Deal gently for my sake
  chosen_korean: 내 대신 부드럽게 대해 주십시오
  alternatives_korean:
  - 내게 관대하게 대해 주십시오
  - 나를 생각해서 부드럽게 대해 주십시오
  lexicon: HALOT
  rationale: לְאַט은 단순한 ‘온화함’보다 제어된 처우를 뜻하므로, 군사적 문맥에 맞게 ‘부드럽게 대해 주십시오’로 옮기고 לִי의 관계적 부담을 ‘내 대신’으로 반영했습니다.
- source_word: לַנַּעַר / לְאַבְשָׁלוֹם
  english_pob_choice: the young man Absalom
  chosen_korean: 그 젊은이 압살롬
  alternatives_korean:
  - 그 소년 압살롬
  - 그 청년 압살롬
  lexicon: HALOT
  rationale: נַעַר는 연령 범위가 넓지만, 압살롬의 성인성을 유지하면서도 아버지의 애틋한 호칭을 살리기 위해 ‘젊은이’를 택했습니다.
- source_word: כָּל הָעָם / כָּל הַשָּׂרִים
  english_pob_choice: all the people / all the commanders
  chosen_korean: 모든 백성 / 모든 지휘관들
  alternatives_korean:
  - 모든 군중 / 모든 장관들
  - 모든 군사 / 모든 지휘관
  lexicon: HALOT
  rationale: הָעָם은 문자적으로 ‘백성’이고, שָׂרִים은 이 군사 문맥에서 지휘 역할을 가리키므로 ‘지휘관들’이 가장 구체적입니다.
- source_word: עַל דְּבַר אַבְשָׁלוֹם
  english_pob_choice: concerning Absalom
  chosen_korean: 압살롬에 관하여
  alternatives_korean:
  - 압살롬에 대해
  - 압살롬 문제에 관하여
  lexicon: HALOT
  rationale: עַל דְּבַר는 ‘~에 관하여/관련하여’의 공식적 표현이므로, 서술적이고 간결한 ‘관하여’로 옮겼습니다.
theological_decisions:
- issue: 왕의 명령과 공동 청취의 공개성
  chosen_reading: 왕의 사적 요청이 아니라, 모든 백성이 듣는 공개 명령으로 제시했습니다.
  alternative_readings:
  - 왕이 소수 측근에게만 사적으로 지시한 것으로 약화해서 읽는 것
  - 공적 장면을 생략하는 것
  rationale: 본문은 왕의 명령이 모든 사람에게 들렸다고 명시하여, 압살롬에 대한 처우가 공적 관심사였음을 드러냅니다.
  doctrine_reference: 서사 문맥의 공적 증언성
- issue: 대상 표현 ‘젊은이’의 정서적 뉘앙스
  chosen_reading: ‘젊은이’로 옮겨 압살롬을 단순한 전투 대상이 아니라 애정 어린 호칭의 대상으로 남겼습니다.
  alternative_readings:
  - ‘소년’으로 낮추는 것
  - 이름만 두고 연령 표현을 지우는 것
  rationale: 히브리어 נַעַר의 유연성을 살려, 전쟁 맥락 속에서도 아버지의 정서가 섞인 표현이라는 긴장을 보존했습니다.
  doctrine_reference: 서사적 인물화와 감정 표지 보존
