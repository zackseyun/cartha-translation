- from: 요압이 말했습니다. 「그렇지 않습니다. 나는 당신 앞에서 이렇게 더 기다리지 않겠습니다.」 그러고는 손에 세 개의 창을 들고, 압살롬이 아직 살아 있는 동안 그 창들을 압살롬의 심장에 꽂았습니다. 그때 압살롬은 떡갈나무의 심장에 있었습니다.[a][b]
  to: 요압이 말했습니다. 「그렇지 않습니다. 나는 당신 앞에서 이런 식으로 더 지체하지 않겠습니다.」 그러고서 그는 손에 창 세 자루[a]를 들고, 압살롬이 아직 살아 있는 채 테레빈트나무[b] 한가운데에 있을 때 그것들을 압살롬의 심장에 박아 넣었습니다.
  rationale: 본문의 어휘 선택과 각주 대안 사이의 구조적 충돌을 해소했습니다. אֵלָה는 ‘테레빈트나무’로 유지하고 ‘떡갈나무’를 각주 대안으로 제시했습니다. 또한 ‘나무의 심장’을 한국어 관용에 맞는 ‘나무 한가운데’로 고쳐 원문의 위치 표현을 자연스럽고 정확하게 전달했습니다. שְׁבָטִים과 תקע의 폭력적·물리적 의미는 각각 ‘창 세 자루’와 ‘박아 넣었습니다’로 보존했습니다.
