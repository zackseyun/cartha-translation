source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֔ב לֹא כֵ֖ן אֹחִ֣ילָה לְ/פָנֶ֑י/ךָ וַ/יִּקַּח֩ שְׁלֹשָׁ֨ה שְׁבָטִ֜ים בְּ/כַפּ֗/וֹ וַ/יִּתְקָעֵ/ם֙ בְּ/לֵ֣ב אַבְשָׁל֔וֹם עוֹדֶ֥/נּוּ חַ֖י בְּ/לֵ֥ב הָ/אֵלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/014.yaml
  text: Joab said[a], “Not so[b]; I will not wait before you.” Then he took three spears in his hand and drove them into the heart of Absalom while he was still alive in the heart of the terebinth.
  footnotes:
  - marker: a
    text: Or 'three rods/staffs'; the Hebrew term can denote a rod, staff, or scepter, but here likely refers to weapons used for thrusting.
    reason: lexical_alternative
  - marker: b
    text: Or 'oak.' The Hebrew אֵלָה often refers to a terebinth; some translations render it more generally as 'oak.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요압이 말했습니다. 「그렇지 않습니다. 나는 당신 앞에서 이런 식으로 더 지체하지 않겠습니다.」 그러고서 그는 손에 창 세 자루[a]를 들고, 압살롬이 아직 살아 있는 채 테레빈트나무[b] 한가운데에 있을 때 그것들을 압살롬의 심장에 박아 넣었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세 개의 막대기/지팡이’. 히브리어 שְׁבָטִים은 막대기, 지팡이, 홀을 가리킬 수 있지만, 여기서는 찔러 넣는 무기를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘떡갈나무’. 히브리어 אֵלָה는 테레빈트나무를 가리키는 경우가 많지만, 일부 번역은 더 일반적으로 ‘떡갈나무’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן אֹחִילָה לְפָנֶיךָ
  english_pob_choice: Not so; I will not wait before you
  chosen_korean: 그렇지 않습니다. 나는 당신 앞에서 이렇게 더 기다리지 않겠습니다
  alternatives_korean:
  - 그렇지 않습니다. 당신 앞에서 지체하지 않겠습니다
  - 그렇지 않습니다. 당신 앞에서 더 머무르지 않겠습니다
  lexicon: HALOT
  rationale: לֹא כֵן은 단순한 부정이 아니라 앞의 제안을 거절하는 말로 보아 자연스럽게 옮겼고, אֹחִילָה는 ‘기다리다/지체하다’의 뉘앙스를 살려 현대 한국어의 ‘더 기다리지 않겠습니다’로 표현했습니다.
- source_word: שְׁבָטִים
  english_pob_choice: three spears
  chosen_korean: 세 개의 창
  alternatives_korean:
  - 세 개의 막대기
  - 세 개의 지팡이
  - 세 개의 다트
  lexicon: HALOT
  rationale: 군사적 문맥과 ‘꽂다/찌르다’ 동작을 고려하면 כאן의 שְׁבָטִים은 무기로 이해하는 것이 자연스러워, 현대 독자가 즉시 이해할 수 있는 ‘창’으로 옮겼습니다.
- source_word: וַיִּתְקָעֵם
  english_pob_choice: drove them into
  chosen_korean: 꽂았습니다
  alternatives_korean:
  - 찌르셨습니다
  - 밀어 넣었습니다
  - 박아 넣었습니다
  lexicon: HALOT
  rationale: תקע의 강한 추진·박아 넣는 동작을 한국어 동사 하나로 압축해 전달하기 위해 ‘꽂다’를 사용했습니다. 폭력성과 즉시성을 유지하면서도 문장이 과도하게 장황해지지 않습니다.
- source_word: בְּלֵב הָאֵלָה
  english_pob_choice: in the heart of the terebinth
  chosen_korean: 떡갈나무의 심장
  alternatives_korean:
  - 떡갈나무 한가운데
  - 떡갈나무 속
  - 테레빈트나무의 심장
  lexicon: HALOT
  rationale: אֵלָה는 보통 떡갈나무/상수리나무 계열로 옮길 수 있어, POB의 ‘terebinth’에 대응하는 한국어 자연어로 ‘떡갈나무’를 채택했습니다. ‘심장’은 앞의 ‘압살롬의 심장’과 대응되는 히브리어 표현을 살려 반복을 유지했습니다.
theological_decisions:
- issue: 압살롬이 죽기 전 아직 살아 있는 상태를 어떻게 드러낼지
  chosen_reading: ‘압살롬이 아직 살아 있는 동안’으로 직접 옮겨, 요압의 일격이 치명타였음을 분명히 했습니다.
  alternative_readings:
  - ‘아직 살아 있을 때’
  - ‘죽지 않은 채’
  rationale: 원문의 עוֹדֶנּוּ חַי는 사건의 시간적 긴장을 강조하므로, 이를 완화하지 않고 그대로 드러내는 표현을 선택했습니다.
  doctrine_reference: 본문 맥락상 서사적 사실 진술
