source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם לֹ֣א תֵצֵ֗א כִּי֩ אִם נֹ֨ס נָנ֜וּס לֹא יָשִׂ֧ימוּ אֵלֵ֣י/נוּ לֵ֗ב וְ/אִם יָמֻ֤תוּ חֶצְיֵ֨/נוּ֙ לֹֽא יָשִׂ֤ימוּ אֵלֵ֨י/נוּ֙ לֵ֔ב כִּֽי עַתָּ֥ה כָמֹ֖/נוּ עֲשָׂרָ֣ה אֲלָפִ֑ים וְ/עַתָּ֣ה ט֔וֹב כִּי תִֽהְיֶה לָּ֥/נוּ מֵ/עִ֖יר ל/עזיר־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/003.yaml
  text: But the people said[a], “You must not go out, for if we flee, they will not pay attention to us; and if half of us die, they will not pay attention to us. For you are worth ten thousand of us[c][b]; so now it is better that you be ready to help us from the city.”
  footnotes:
  - marker: a
    text: Or “they will not set their heart on us,” an idiom meaning they will not regard us as their main concern.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “for now you are like ten thousand of us.”
    reason: lexical_alternative
  - marker: c
    text: The final phrase likely means David should remain in the city to provide support or reinforcements if needed.
    reason: cultural_note
translation:
  language: ko
  text: 백성이 말했습니다[a]. “당신은 나가서는 안 됩니다. 우리가 비록 달아나더라도 그들은 우리에게 주의를 기울이지 않을 것이고, 우리 가운데 절반이 죽더라도 그들은 우리에게 주의를 기울이지 않을 것입니다. 이제 당신은 우리 십만 명[c][b]만큼의 가치가 있으니, 성에서 우리를 돕도록 대기하시는 편이 더 좋습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들은 우리에게 주의를 기울이지 않을 것이다.” 이 관용구는 우리를 주요 관심사로 삼지 않는다는 뜻입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 “이제 당신은 우리 만 명과 같습니다”입니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 구는 다윗이 필요할 때 성 안에서 지원이나 증원을 제공하라는 뜻으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תֵצֵא
  english_pob_choice: You must not go out
  chosen_korean: 당신은 나가서는 안 됩니다
  alternatives_korean:
  - 나가시면 안 됩니다
  - 나가시면 안 됩니다
  - 나가서는 말 안 됩니다
  lexicon: HALOT
  rationale: 부정 명령의 강한 제지를 자연스러운 합쇼체로 옮기되, 단순 금지보다 충고·경고의 뉘앙스를 살렸습니다.
- source_word: לֹא יָשִׂימוּ אֵלֵינוּ לֵב
  english_pob_choice: they will not pay attention to us
  chosen_korean: 그들은 우리에게 주의를 기울이지 않을 것이고
  alternatives_korean:
  - 그들은 우리를 마음에 두지 않을 것이고
  - 그들은 우리를 주목하지 않을 것이고
  - 그들은 우리를 돌아보지 않을 것이고
  lexicon: HALOT
  rationale: 직역의 관용구보다 전투 맥락에서의 의미인 ‘주의를 기울이다/주목하다’를 살려, 상대의 관심이 우리에게 향하지 않는다는 뜻을 분명히 했습니다.
- source_word: כִּי עַתָּה כָמֹנוּ עֲשָׂרָה אֲלָפִים
  english_pob_choice: for now you are worth ten thousand of us
  chosen_korean: 이제 당신은 우리 십만 명만큼의 가치가 있으니
  alternatives_korean:
  - 이제 당신은 우리 만 명보다 더 귀중하니
  - 이제 당신은 우리 만 명과 같으니
  - 이제 당신은 우리 만 명쯤 되시니
  lexicon: HALOT
  rationale: 히브리어의 비교적 가치 진술을 한국어로는 ‘가치가 있다’로 옮겨 의미를 분명히 했고, 수사는 원문대로 과장된 비교로 유지했습니다.
- source_word: מֵעִיר לְעָזִיר
  english_pob_choice: that you be ready to help us from the city
  chosen_korean: 성에서 우리를 돕도록 대기하시는 편이 더 좋습니다
  alternatives_korean:
  - 성에서 우리를 도우시도록 머무르시는 편이 더 좋습니다
  - 성에서 우리를 돕기 위해 계시는 편이 더 좋습니다
  - 성에서 우리를 지원하시는 편이 더 좋습니다
  lexicon: HALOT
  rationale: 마지막 구는 단순한 ‘도움’보다 도시 안에 남아 필요한 때 지원하는 군사적 의미가 있어, POB의 해설을 반영해 ‘대기하다’로 기능을 드러냈습니다.
theological_decisions:
- issue: 지휘관에게 남아 있으라는 요청의 함의
  chosen_reading: 다윗이 전장에서 물러나 성 안에 남아, 필요할 때 군사적 지원을 제공하는 편이 더 낫다는 실용적 판단으로 읽었습니다.
  alternative_readings:
  - 단순히 쉬라는 권고로 읽을 수 있음
  - 정치적 충고로만 볼 수 있음
  rationale: 문맥상 ‘도움’은 일반적 호의가 아니라 위기 시 증원·지원의 의미를 띠므로, 서술을 약화시키지 않으면서도 본문이 허용하는 범위 안에서 구체화했습니다.
  doctrine_reference: 본문의 서사적·군사적 문맥 해석
- issue: 직접화법의 존대 유지
  chosen_reading: 백성의 발언은 집단 화행이므로 서술문은 합쇼체를 유지하고, 직접 인용 안에서도 다윗에 대한 공손한 요청형을 유지했습니다.
  alternative_readings:
  - 직설적 명령형으로 옮길 수 있음
  - 보다 낮은 구어체로 옮길 수 있음
  rationale: 한국어 독자가 자연스럽게 읽으면서도 원문의 긴박한 충고 성격을 보존하기 위해 존대를 선택했습니다.
  doctrine_reference: 한국어 문체/화행 일관성
