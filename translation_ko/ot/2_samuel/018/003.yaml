  lexicon: HALOT
  rationale: 직역의 관용구보다 전투 맥락에서의 의미인 ‘주의를 기울이다/주목하다’를 살려, 상대의 관심이 우리에게 향하지 않는다는 뜻을 분명히 했습니다.
- source_word: כִּי עַתָּה כָמֹנוּ עֲשָׂרָה אֲלָפִים
  english_pob_choice: for now you are worth ten thousand of us
  chosen_korean: 이제 당신은 우리 십만 명만큼의 가치가 있으니
  alternatives_korean:
  - 이제 당신은 우리 만 명보다 더 귀중하니
  - 이제 당신은 우리 만 명과 같으니
  - 이제 당신은 우리 만 명쯤 되시니
  lexicon: HALOT
  rationale: 히브리어의 비교적 가치 진술을 한국어로는 ‘가치가 있다’로 옮겨 의미를 분명히 했고, 수사는 원문대로 과장된 비교로 유지했습니다.
- source_word: מֵעִיר לְעָזִיר
  english_pob_choice: that you be ready to help us from the city
  chosen_korean: 성에서 우리를 돕도록 대기하시는 편이 더 좋습니다
  alternatives_korean:
  - 성에서 우리를 도우시도록 머무르시는 편이 더 좋습니다
  - 성에서 우리를 돕기 위해 계시는 편이 더 좋습니다
  - 성에서 우리를 지원하시는 편이 더 좋습니다
  lexicon: HALOT
  rationale: 마지막 구는 단순한 ‘도움’보다 도시 안에 남아 필요한 때 지원하는 군사적 의미가 있어, POB의 해설을 반영해 ‘대기하다’로 기능을 드러냈습니다.
theological_decisions:
- issue: 지휘관에게 남아 있으라는 요청의 함의
  chosen_reading: 다윗이 전장에서 물러나 성 안에 남아, 필요할 때 군사적 지원을 제공하는 편이 더 낫다는 실용적 판단으로 읽었습니다.
  alternative_readings:
  - 단순히 쉬라는 권고로 읽을 수 있음
  - 정치적 충고로만 볼 수 있음
  rationale: 문맥상 ‘도움’은 일반적 호의가 아니라 위기 시 증원·지원의 의미를 띠므로, 서술을 약화시키지 않으면서도 본문이 허용하는 범위 안에서 구체화했습니다.
  doctrine_reference: 본문의 서사적·군사적 문맥 해석
- issue: 직접화법의 존대 유지
  chosen_reading: 백성의 발언은 집단 화행이므로 서술문은 합쇼체를 유지하고, 직접 인용 안에서도 다윗에 대한 공손한 요청형을 유지했습니다.
  alternative_readings:
  - 직설적 명령형으로 옮길 수 있음
  - 보다 낮은 구어체로 옮길 수 있음
  rationale: 한국어 독자가 자연스럽게 읽으면서도 원문의 긴박한 충고 성격을 보존하기 위해 존대를 선택했습니다.
  doctrine_reference: 한국어 문체/화행 일관성
