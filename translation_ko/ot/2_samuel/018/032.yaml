    rationale: ‘평안하냐?’는 해라체 의문형입니다. 요청된 표준어 현대 공식-공손체에 맞추어 ‘평안합니까?’로 해야 합니다.
  - severity: low
    issue: ‘악을 행하려고’는 לְרָעָה의 문맥상 목적을 다소 일반화합니다.
    rationale: ‘일어나 왕을 해하려는’이라는 적대적 의도를 ‘해하려고’로 옮기면 원문의 관용적 용법과 서사 문맥을 더 정확히 반영합니다.
  - severity: low
    issue: 각주 표지가 모두 문장 끝에 놓여 선행어가 불분명합니다.
    rationale: a는 ‘평안’에, b는 구스 사람의 간접 응답 전체에 각각 붙이면 각주의 근거가 분명해집니다.
