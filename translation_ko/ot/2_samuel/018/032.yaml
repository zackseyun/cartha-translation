  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל הַ/כּוּשִׁ֔י הֲ/שָׁל֥וֹם לַ/נַּ֖עַר לְ/אַבְשָׁל֑וֹם וַ/יֹּ֣אמֶר הַ/כּוּשִׁ֗י יִהְי֤וּ כַ/נַּ֨עַר֙ אֹֽיְבֵי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ וְ/כֹ֛ל אֲשֶׁר קָ֥מוּ עָלֶ֖י/ךָ לְ/רָעָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/032.yaml
  text: Then the king said to the Cushite[a], “Is it well with the young man Absalom?” And the Cushite said, “May the enemies of my lord the king, and all who rise up against you for evil[b], be like that young man.”
  footnotes:
  - marker: a
    text: Or “Is the young man Absalom safe?” The Hebrew asks literally about his ‘peace/well-being’ (shalom), a broader term than mere survival.
    reason: lexical_alternative
  - marker: b
    text: 'The Cushite answers indirectly: his words imply that Absalom has met the fate appropriate to the king’s enemies, rather than stating the death explicitly.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 왕이 구스 사람에게 말했습니다. “그 젊은이 압살롬이 평안하냐?” 구스 사람이 대답했습니다. “내 주 왕의 원수들과, 악을 행하려고 일어나는 모든 자들이 그 젊은이처럼 되기를 바랍니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘평안하냐’는 여기서 단순히 살아 있는지보다 더 넓은 ‘안녕/평안’의 상태를 묻는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 구스 사람의 대답은 압살롬의 죽음을 직접 말하지 않고, 왕의 원수들이 받아야 할 운명을 그에게 돌려 말합니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַכּוּשִׁי
  english_pob_choice: the Cushite
  chosen_korean: 구스 사람
  alternatives_korean:
  - 에티오피아 사람
  - 구스인
  lexicon: HALOT
  rationale: 히브리어 지시 대상을 민족·지리적 표지로 보존하기 위해, 전통적이지만 시대착오가 될 수 있는 ‘에티오피아 사람’보다 ‘구스 사람’을 택했습니다.
- source_word: הֲשָׁלוֹם
  english_pob_choice: Is it well with
  chosen_korean: 평안하냐
  alternatives_korean:
  - 무사하냐
  - 안녕하냐
  - 잘 있느냐
  lexicon: HALOT
  rationale: שָׁלוֹם의 핵심은 단순 생존보다 더 넓은 안녕·평안을 묻는 것이므로, 자연스러운 한국어로 그 폭을 살려 ‘평안하냐’로 옮겼습니다.
- source_word: לַנַּעַר
  english_pob_choice: the young man
  chosen_korean: 그 젊은이
  alternatives_korean:
  - 그 소년
  - 그 청년
  lexicon: HALOT
  rationale: 압살롬에게 붙는 נַעַר의 용법을 따라, 나이를 단정하지 않으면서도 친족·관계 맥락에서의 호칭을 살리는 ‘젊은이’를 택했습니다.
- source_word: יִהְיוּ כַ/נַּעַר
  english_pob_choice: May ... be like that young man
  chosen_korean: 그 젊은이처럼 되기를 바랍니다
  alternatives_korean:
  - 그 젊은이 같기를 바랍니다
  - 그 젊은이처럼 되게 하소서
  lexicon: HALOT
  rationale: 히브리어의 바람/저주 뉘앙스를 한국어에서 직접적이되 과도하게 확대하지 않고, 결과 상태를 자연스럽게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 간접적 응답이 암시하는 압살롬의 운명
  chosen_reading: 구스 사람의 말은 압살롬이 왕의 원수들에게 합당한 운명을 맞았음을 우회적으로 말합니다.
  alternative_readings:
  - 단순한 격언적 축복으로 읽기
  - 압살롬의 생존 여부를 의도적으로 숨긴 모호한 답으로만 읽기
  rationale: POB의 audit trail에 따라 직접적인 사망 선언을 피한 히브리어의 완곡한 답변 방식을 보존했습니다.
  doctrine_reference: 서사 문맥의 함축과 완곡어법
