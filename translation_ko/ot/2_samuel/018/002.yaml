base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/002.yaml
  text: 'David sent out the troops: one third under Joab[a], one third under Abishai son of Zeruiah, Joab’s brother, and one third under Ittai the Gittite. And the king said to the troops, “I myself will surely go out with you.”'
  footnotes:
  - marker: a
    text: Hebrew literally, 'in the hand of,' an idiom meaning 'under the authority/command of.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 군대를 내보냈습니다. 군대의 삼분의 일은 요압의 지휘 아래, 삼분의 일은 스루야의 아들이며 요압의 형제인 아비새의 지휘 아래, 또 삼분의 일은 가드 사람 잇대의 지휘 아래 두었습니다. 왕이 군대에게 말했습니다. “나도 반드시 여러분과 함께 나가겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלַּח
  english_pob_choice: sent out
  chosen_korean: 내보냈습니다
  alternatives_korean:
  - 보냈습니다
  - 파견했습니다
  lexicon: HALOT
  rationale: 전투 맥락에서 병력을 작전에 투입하는 뜻이므로, 단순한 ‘보내다’보다 방향성과 실행성을 살린 ‘내보내다’가 적절합니다.
- source_word: הָעָם
  english_pob_choice: the troops
  chosen_korean: 군대
  alternatives_korean:
  - 백성
  - 병사들
  - 군사들
  lexicon: HALOT
  rationale: 문맥상 ‘백성’이 아니라 다윗의 전투 병력을 가리키므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘군대’로 옮겼습니다.
- source_word: בְּיַד
  english_pob_choice: under
  chosen_korean: 지휘 아래
  alternatives_korean:
  - 손에
  - 통치 아래
  - 명령 아래
  lexicon: HALOT
  rationale: 직역하면 ‘손에’이지만, 여기서는 권한/지휘를 뜻하는 관용구이므로 한국어 군사 표현인 ‘지휘 아래’가 의미를 가장 분명히 드러냅니다.
- source_word: יָצֹא אֵצֵא + גַּם אֲנִי
  english_pob_choice: I myself will surely go out
  chosen_korean: 나도 반드시 … 나가겠습니다
  alternatives_korean:
  - 나도 꼭 나가겠습니다
  - 나 자신이 반드시 나가겠습니다
  - 저도 반드시 나가겠습니다
  lexicon: HALOT
  rationale: 부정확한 단순 미래가 아니라 반복형으로 강조된 결의이므로 ‘반드시’로 강세를 살리고, ‘나도’로 גַּם אֲנִי의 자기 참여 강조를 반영했습니다.
