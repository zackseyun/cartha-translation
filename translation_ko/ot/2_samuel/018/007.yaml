source:
  edition: WLC
  text: וַ/יִּנָּ֤גְפוּ שָׁם֙ עַ֣ם יִשְׂרָאֵ֔ל לִ/פְנֵ֖י עַבְדֵ֣י דָוִ֑ד וַ/תְּהִי שָׁ֞ם הַ/מַּגֵּפָ֧ה גְדוֹלָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא עֶשְׂרִ֥ים אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/007.yaml
  text: 'There the people of Israel were defeated before the servants of David[b][a], and the slaughter there was great on that day: twenty thousand men.'
  footnotes:
  - marker: a
    text: Or 'the blow,' 'the defeat,' or 'the plague.' The Hebrew word can denote a plague in other contexts, but here it refers to the deadly striking in battle.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''twenty thousand.'' ''Men'' is supplied in English for clarity in the battle context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 이스라엘 백성은 다윗의 종들 앞에서 패배했습니다. 그날 그곳에서는 큰 살상이 있었습니다.[a] 그 수는 이만 명이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַגֵּפָה는 다른 문맥에서는 ‘역병’을 뜻할 수도 있습니다. 그러나 여기서는 전투에서 입힌 치명적인 타격, 곧 큰 살상을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘이만’이라고만 합니다. 한국어에서는 전투 피해의 수를 나타내기 위해 ‘명’을 보충했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְפוּ
  english_pob_choice: were defeated
  chosen_korean: 패배했습니다
  alternatives_korean:
  - 무너졌습니다
  - 쳐졌습니다
  - 패주했습니다
  lexicon: HALOT
  rationale: 전투 맥락의 נָגַף 수동형은 ‘패배하다/패주하다’의 뜻이므로, 현대 한국어에서는 군사적 결과를 분명히 드러내는 ‘패배했습니다’가 가장 자연스럽습니다.
- source_word: עַם יִשְׂרָאֵל
  english_pob_choice: the people of Israel
  chosen_korean: 이스라엘 백성
  alternatives_korean:
  - 이스라엘의 군대
  - 이스라엘 군사들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 직역하면 ‘이스라엘 백성’이며, 이 문맥에서는 전투에 참여한 집단을 가리키지만 원문 표현을 과도하게 군사화하지 않기 위해 이 표현을 유지했습니다.
- source_word: עַבְדֵי דָוִד
  english_pob_choice: the servants of David
  chosen_korean: 다윗의 종들
  alternatives_korean:
  - 다윗의 부하들
  - 다윗의 사람들
  - 다윗의 신하들
  lexicon: HALOT
  rationale: עֶבֶד의 기본 의미를 살려 ‘종들’로 옮겼습니다. 한국어 ‘부하들’은 자연스럽지만 지위 관계를 해석적으로 풀어 쓰는 정도가 더 큽니다.
- source_word: הַמַּגֵּפָה גְדוֹלָה
  english_pob_choice: the slaughter was great
  chosen_korean: 살육은 매우 컸습니다
  alternatives_korean:
  - 피해는 매우 컸습니다
  - 타격은 매우 컸습니다
  - 학살은 컸습니다
  lexicon: HALOT
  rationale: 여기서 מַגֵּפָה는 ‘역병’이 아니라 전투에서의 치명적 타격을 가리키므로, POB의 ‘slaughter’에 맞춰 전투의 참혹함을 드러내는 ‘살육’으로 옮겼습니다.
- source_word: עֶשְׂרִים אָלֶף
  english_pob_choice: twenty thousand men
  chosen_korean: 이만 명이었습니다
  alternatives_korean:
  - 이만 명의 사람이었습니다
  - 이만 명의 전사였습니다
  - 이만 명이 죽었습니다
  lexicon: HALOT
  rationale: 히브리어 원문은 수량만 제시하며 영어 POB는 전투 맥락상 ‘men’을 보충했습니다. 한국어에서는 자연스럽게 수만 제시하고, 전사자 여부를 원문 이상으로 단정하지 않았습니다.
theological_decisions:
- issue: 전투 결과를 묘사하는 어휘의 강도
  chosen_reading: ‘살육’으로 옮겨 전투의 치명성과 참혹함을 분명히 했습니다.
  alternative_readings:
  - ‘패배’만으로 완화해 옮기는 방식
  - ‘대패’로 요약하는 방식
  rationale: 본문의 הַמַּגֵּפָה는 단순한 패전보다 더 강한 치명적 타격을 암시하므로, 문맥의 폭력을 약화시키지 않는 쪽이 원문 의도에 더 가깝습니다.
  doctrine_reference: 서술 본문은 사건의 사실성과 강도를 유지하는 것이 우선입니다.
