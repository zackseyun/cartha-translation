    issue: 첫 각주의 직역 설명이 불완전함
    rationale: 각주는 원문의 발화 전체 가운데 ‘너희 눈에 좋은 것’만을 제시합니다. ‘너희가 좋게 여기는 것을 내가 하겠다’라고 제시하면 원문의 구문과 본문 번역의 관계가 분명해집니다.
