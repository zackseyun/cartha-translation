  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הַ/מֶּ֔לֶךְ אֲשֶׁר יִיטַ֥ב בְּ/עֵינֵי/כֶ֖ם אֶעֱשֶׂ֑ה וַ/יַּעֲמֹ֤ד הַ/מֶּ֨לֶךְ֙ אֶל יַ֣ד הַ/שַּׁ֔עַר וְ/כָל הָ/עָם֙ יָֽצְא֔וּ לְ/מֵא֖וֹת וְ/לַ/אֲלָפִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/004.yaml
  text: The king said to them[a], “What seems good in your eyes, I will do.” So the king stood beside the gate[c][b], and all the people went out by hundreds and by thousands.
  footnotes:
  - marker: a
    text: 'Hebrew: ''What is good in your eyes, I will do.'' The expression means what they judge to be best.'
    reason: lexical_alternative
  - marker: b
    text: Or 'by the gate' / 'at the side of the gate.' Hebrew literally, 'to the hand of the gate,' an idiom for a position beside it.
    reason: lexical_alternative
  - marker: c
    text: That is, in organized military units.
    reason: cultural_note
translation:
  language: ko
  text: 왕이 그들에게[a] 말씀하셨습니다. “너희가 좋다고 여기는 대로 내가 하겠습니다.” 그러고 나서 왕은 성문 곁에[b] 서셨고, 모든 백성은 백 명씩, 천 명씩 나갔습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 “너희 눈에 좋은 것을 내가 하겠다”입니다. 곧, 그들이 가장 좋다고 판단하는 대로 하겠다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “성문의 손 곁에”이지만, 관용적으로 성문 곁을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 곧, 백 명과 천 명으로 이루어진 조직된 군사 단위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר יִיטַב בְּעֵינֵיכֶם
  english_pob_choice: What seems good in your eyes
  chosen_korean: 너희 눈에 좋게 보이는 대로
  alternatives_korean:
  - 너희가 좋다고 여기는 대로
  - 너희 보기에 옳은 대로
  lexicon: HALOT
  rationale: 히브리어 관용구 בְּעֵינֵי + 인칭은 판단과 승인 기준을 뜻하므로, ‘눈에 좋게 보이는 대로’로 시각적 이미지를 살리면서도 의미를 자연스럽게 전달했습니다.
- source_word: אֶעֱשֶׂה
  english_pob_choice: I will do
  chosen_korean: 내가 하겠습니다
  alternatives_korean:
  - 내가 행하겠습니다
  - 그대로 하겠습니다
  lexicon: HALOT
  rationale: עשה의 단순 미래를 자연스러운 한국어로 옮기되, 왕의 수용과 결단을 드러내는 표준적 표현을 택했습니다.
- source_word: אֶל יַד הַשַּׁעַר
  english_pob_choice: beside the gate
  chosen_korean: 성문 곁에
  alternatives_korean:
  - 성문 옆에
  - 성문旁에
  lexicon: HALOT
  rationale: 직역하면 ‘문의 손(곁)으로’라는 관용구이므로, 문 옆의 위치를 뜻하는 한국어로 옮겨 원문의 관용을 자연스럽게 살렸습니다.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  english_pob_choice: by hundreds and by thousands
  chosen_korean: 백 명씩, 천 명씩
  alternatives_korean:
  - 백 단위와 천 단위로
  - 수백 명, 수천 명씩
  lexicon: HALOT
  rationale: 군사적 편제를 나타내는 숫자 구조를 한국어에서도 그대로 보여 주기 위해 ‘백 명씩, 천 명씩’으로 옮겼습니다.
theological_decisions:
- issue: 군사적 편제의 표현
  chosen_reading: ‘백 명씩, 천 명씩’은 단순한 수량이 아니라 조직된 군사 단위를 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 단순히 사람 수를 나열하는 표현으로 읽기
  - ‘백과 천의 무리’처럼 일반 집단으로 읽기
  rationale: 영어 POB가 주석에서 군사 단위를 밝혔고, 본문 흐름도 전쟁 준비 맥락이므로 조직된 배치라는 의미를 살려야 합니다.
  doctrine_reference: 본문 맥락 및 역사서 서술의 문맥적 해석
