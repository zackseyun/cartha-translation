id: 2SA.18.24
reference: 2 Samuel 18:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/דָוִ֥ד יוֹשֵׁ֖ב בֵּין שְׁנֵ֣י הַ/שְּׁעָרִ֑ים וַ/יֵּ֨לֶךְ הַ/צֹּפֶ֜ה אֶל גַּ֤ג הַ/שַּׁ֨עַר֙ אֶל הַ֣/חוֹמָ֔ה וַ/יִּשָּׂ֤א אֶת עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה אִ֖ישׁ רָ֥ץ לְ/בַדּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/024.yaml
  text: Now David was sitting between the two gates[a], and the watchman went up to the roof of the gate by the wall. He lifted up his eyes and looked, and behold, a man was running alone.
  footnotes:
  - marker: a
    text: Or "between the two gatehouses"; the Hebrew literally says "between the two gates," likely referring to the space within a fortified gateway.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 다윗은 두 문 사이에 앉아 있었습니다[a]. 파수꾼은 성문 지붕 곧 성벽 쪽으로 올라갔습니다. 그는 눈을 들어 바라보았는데, 보라, 한 사람이 혼자 달려오고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “두 문집 사이”로도 옮길 수 있습니다. 히브리어는 문자적으로 “두 문 사이”라고 하며, 아마도 성문 안의 방어 구조를 가리키는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  english_pob_choice: was sitting
  chosen_korean: 앉아 있었습니다
  alternatives_korean:
  - 앉아 있었습니다
  - 앉아 있었습니다
  lexicon: HALOT
  rationale: 분사형 상태를 서술하는 표현이므로, 진행·지속의 의미가 드러나는 ‘앉아 있었습니다’로 옮겼습니다.
- source_word: בֵּין שְׁנֵי הַשְּׁעָרִים
  english_pob_choice: between the two gates
  chosen_korean: 두 문 사이
  alternatives_korean:
  - 두 성문 사이
  - 두 문들 사이
  lexicon: HALOT
  rationale: 히브리어를 지나치게 구조화하지 않고 ‘두 문 사이’로 옮겨, 영어 POB가 유지한 문자적 뼈대를 한국어에서도 보존했습니다.
- source_word: הַצֹּפֶה
  english_pob_choice: the watchman
  chosen_korean: 파수꾼
  alternatives_korean:
  - 망보는 사람
  - 감시자
  lexicon: HALOT
  rationale: 성벽/성문 맥락에서 경계 임무를 맡은 사람을 가리키므로, 한국어에서 자연스럽고 관용적인 ‘파수꾼’을 선택했습니다.
- source_word: אֶל גַּג הַשַּׁעַר אֶל הַחוֹמָה
  english_pob_choice: to the roof of the gate by the wall
  chosen_korean: 성문 지붕 곧 성벽 쪽으로
  alternatives_korean:
  - 성문 지붕으로 성벽 쪽에
  - 성문 위의 지붕으로, 성벽 쪽으로
  lexicon: HALOT
  rationale: 문 구조의 세부를 과도하게 특정하지 않으면서, ‘지붕’과 ‘성벽 쪽’의 공간 관계를 드러내는 방식으로 옮겼습니다.
- source_word: לְבַדּוֹ
  english_pob_choice: alone
  chosen_korean: 혼자
  alternatives_korean:
  - 홀로
  - 단독으로
  lexicon: HALOT
  rationale: 단독성은 분명히 살리되, 한국어 서술에서는 ‘혼자’가 가장 자연스럽고 즉시 이해됩니다.
theological_decisions:
- issue: 서술의 긴박감과 시각적 강조
  chosen_reading: ‘보라’와 진행형을 살려, 파수꾼이 갑작스러운 움직임을 목격하는 장면의 즉시성을 유지했습니다.
  alternative_readings:
  - ‘그리고’ 중심의 평서적 번역
  - ‘한 사람이 달렸다’의 단순 과거형
  rationale: 히브리어 וְהִנֵּה의 돌출감과 연속 동작을 반영하면, 이야기의 긴장감이 자연스럽게 드러납니다.
  doctrine_reference: 서사 본문의 담화 기능 보존
