  lexicon: HALOT
  rationale: 동사의 허용 의미를 살려, 다음 날에는 가능하지만 오늘은 아니라는 대비를 한국어 조건절로 자연스럽게 옮겼습니다.
- source_word: תְבַשֵּׂר
  english_pob_choice: you must not carry news
  chosen_korean: 소식을 전해서는 안 됩니다
