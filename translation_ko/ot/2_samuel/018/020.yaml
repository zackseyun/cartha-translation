  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 풀되, POB의 ‘bearer of news’처럼 ‘기쁜 소식’으로 특정하지 않고 중립적인 ‘소식’을 유지했습니다.
- source_word: וּבִשַּׂרְתָּ
  english_pob_choice: You may carry news
  chosen_korean: 소식을 전할 수 있지만
  alternatives_korean:
  - 소식을 전해도 되지만
