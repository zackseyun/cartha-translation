base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/020.yaml
  text: Joab said to him[a], “You are not a bearer of news today. You may carry news on another day, but today you must not carry news, because the king’s son is dead.”
  footnotes:
  - marker: a
    text: Or “a bearer of good news.” The Hebrew term can denote news or tidings, often favorable, but here the context is the death of the king’s son.
    reason: lexical_alternative
translation:
  language: ko
  text: 요압이 그에게 말했습니다. 「오늘 당신은 소식을 전할 사람[a]이 아닙니다. 다른 날에는 소식을 전할 수 있지만, 오늘은 소식을 전해서는 안 됩니다. 왕의 아들이 죽었기 때문입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “기쁜 소식을 전하는 사람.” 히브리어 בְּשֹׂרָה는 흔히 좋은 소식을 뜻할 수 있으나, 여기서는 왕의 아들의 죽음이 그 내용입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּשֹׂרָה
  english_pob_choice: a bearer of news
  chosen_korean: 소식을 전할 사람
  alternatives_korean:
