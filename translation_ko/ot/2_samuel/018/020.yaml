  - 소식을 전하지 마십시오
  - 소식을 전할 수 없습니다
  lexicon: HALOT
  rationale: 금지 표현을 현대 한국어의 명확한 규범형으로 옮겨 요압의 강한 금령을 드러냈습니다.
- source_word: בֶּן הַמֶּלֶךְ
  english_pob_choice: the king’s son
  chosen_korean: 왕의 아들
  alternatives_korean:
  - 임금의 아들
