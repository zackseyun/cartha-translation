  lexicon: HALOT
  rationale: 문맥상 압살롬을 가리키는 관계구를 직역해 보존했습니다. '왕자'는 관습적이지만 여기서는 혈연 관계가 더 분명합니다.
theological_decisions:
- issue: ‘기쁜 소식’ 여부
  chosen_reading: 중립적 ‘소식’으로 유지했습니다.
  alternative_readings:
