base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/001.yaml
  text: Then David mustered the people who were with him and appointed over them commanders of thousands and commanders of hundreds[a][b].
  footnotes:
  - marker: a
    text: Or 'numbered' or 'reviewed'; the Hebrew verb can denote taking a military muster, not merely counting.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the people'; here it refers to the force with David.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗은 자기와 함께 있던 병력[b]을 점검하고[a], 그들을 거느릴 천부장들과 백부장들을 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 군사 문맥에서 ‘점검하다’, ‘사열하다’, ‘계수하다’ 또는 ‘소집하다’를 뜻할 수 있습니다. 여기서는 단순한 인원 계산보다 병력의 점검과 편성을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘백성’입니다. 여기서는 다윗과 함께 있던 전투 병력을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  english_pob_choice: mustered
  chosen_korean: 소집하고
  alternatives_korean:
  - 소집하였고
  - 동원하고
