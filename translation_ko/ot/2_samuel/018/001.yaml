  rationale: פקד는 군사적 문맥에서 단순한 수가 아니라 병력을 불러 모아 정비하는 뜻을 가질 수 있으므로, ‘소집하다’로 옮겨 군사 행위의 성격을 살렸습니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 군대
  - 부대
  lexicon: HALOT
  rationale: 히브리어의 직역 요소를 살리되, 이 문맥에서 다윗과 함께 있는 전투 집단을 자연스럽게 가리키도록 ‘백성’으로 옮겼습니다.
- source_word: וַיָּשֶׂם עֲלֵיהֶם
  english_pob_choice: appointed over them
  chosen_korean: 그들 위에 … 세웠습니다
  alternatives_korean:
  - 그들 위에 … 임명했습니다
  - 그들 위에 … 두었습니다
  lexicon: HALOT
  rationale: שׂים + על은 어떤 이를 다른 사람들 위에 두어 맡기거나 세우는 뜻이므로, 군사 지휘권 부여를 드러내는 ‘세우다’로 옮겼습니다.
- source_word: שָׂרֵי אֲלָפִים ... שָׂרֵי מֵאוֹת
  english_pob_choice: commanders of thousands and commanders of hundreds
  chosen_korean: 천부장들과 백부장들
  alternatives_korean:
  - 천인대장들과 백인대장들
  - 천 명의 지휘관들과 백 명의 지휘관들
  lexicon: HALOT
  rationale: 히브리어의 상투적 군사 표현을 한국어 성경에서 널리 이해되는 직함으로 옮기되, 숫자 단위와 지휘 권위를 함께 드러내는 전통적 표현을 유지했습니다.
