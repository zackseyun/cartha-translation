source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֗ב לָ/אִישׁ֙ הַ/מַּגִּ֣יד ל֔/וֹ וְ/הִנֵּ֣ה רָאִ֔יתָ וּ/מַדּ֛וּעַ לֹֽא הִכִּית֥/וֹ שָׁ֖ם אָ֑רְצָ/ה וְ/עָלַ֗/י לָ֤/תֶת לְ/ךָ֙ עֲשָׂ֣רָה כֶ֔סֶף וַ/חֲגֹרָ֖ה אֶחָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/011.yaml
  text: Then Joab said to the man who had told him[a], “Look, you saw him[b]; why then did you not strike him there to the ground? And I would have been obliged to give you ten pieces of silver and one belt.”
  footnotes:
  - marker: a
    text: Hebrew 'ten silver'; the specific unit is not stated, so 'pieces of silver' is supplied for natural English.
    reason: lexical_alternative
  - marker: b
    text: Or 'I would have given you ten pieces of silver and a belt.' The Hebrew idiom more literally says, 'it would have been on me to give you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요압이 자기에게 알린 그 사람에게 말했습니다. 「보십시오, 네가 그를 보았는데, 어찌하여 거기에서 그를 땅에 쓰러뜨리지 않았느냐? 그러면 내가 네게 은 열 개와 한 띠를 주었을 것이다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단위를 밝히지 않고 ‘은 열 개’라고만 말합니다.
    reason: source_note
  - marker: b
    text: 히브리어 관용구는 문자적으로 ‘내게 네게 주는 것이 있었다’는 식으로, 주는 의무가 나에게 있었다는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: לָאִישׁ הַמַּגִּיד לוֹ
  english_pob_choice: to the man who had told him
  chosen_korean: 자기에게 알린 그 사람에게
  alternatives_korean:
  - 그에게 보고한 사람에게
  - 그에게 말한 사람에게
  lexicon: HALOT
  rationale: 분사구문을 명사화한 표현으로, 문맥상 ‘알린 사람’이 자연스럽고 직전 보고 장면을 유지합니다.
- source_word: וְהִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자보십시오
  lexicon: HALOT
  rationale: 요압의 급작스럽고 지적하는 반응을 현대 한국어로 자연스럽게 살리면서, 합쇼체 문맥에 맞게 옮겼습니다.
- source_word: שָׁם אָרְצָה
  english_pob_choice: there to the ground
  chosen_korean: 거기에서 … 땅에 쓰러뜨리지
  alternatives_korean:
  - 거기에서 … 땅에 치지
  - 그 자리에서 … 땅에 엎드러뜨리지
  lexicon: HALOT
  rationale: ‘거기에서’와 ‘땅에’의 공간성을 살리고, נכה의 구체적 폭력 이미지를 ‘쓰러뜨리다’로 전달했습니다.
- source_word: וְעָלַי לָתֶת לְךָ
  english_pob_choice: I would have been obliged to give you
  chosen_korean: 내가 네게 … 주었을 것이다
  alternatives_korean:
  - 내가 네게 … 주어야 했을 것이다
  - 내 몫으로 네게 … 주었을 것이다
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘의무/부담이 내게 있었다’는 힘은 본절의 보상 맥락상 한국어에서는 조건절적 과거반사로 가장 자연스럽게 드러납니다. 다만 명시적 의무 표현은 다소 경직되어 본문 흐름을 해치므로 생략하되, 의미는 유지했습니다.
- source_word: עֲשָׂרָה כֶסֶף
  english_pob_choice: ten pieces of silver
  chosen_korean: 은 열 개
  alternatives_korean:
  - 은 열 조각
  - 은 열 세겔
  lexicon: HALOT
  rationale: 히브리어가 단위를 명시하지 않으므로 POB의 처리처럼 자연스러운 보충어를 피하고, 최소한의 값어치 표현만 살렸습니다.
- source_word: חֲגֹרָה אֶחָת
  english_pob_choice: one belt
  chosen_korean: 한 띠
  alternatives_korean:
  - 한 허리띠
  - 띠 하나
  lexicon: HALOT
  rationale: חֲגֹרָה는 전통적으로 ‘띠/허리띠’이며, 본문의 보상 항목으로서 간결하게 ‘한 띠’가 적절합니다.
theological_decisions:
- issue: וְעָלַי לָתֶת לְךָ의 의무성 표현을 한국어에서 어떻게 드러낼지
  chosen_reading: 직설적 보상 발화로 옮기되, 한국어에서는 ‘내가 네게 … 주었을 것이다’로 자연스럽게 처리했습니다.
  alternative_readings:
  - 내가 네게 주어야 했을 것이다
  - 내게 그걸 네게 줄 책임이 있었을 것이다
  rationale: 이 절의 핵심은 신학적 교리보다 요압의 계산된 보상 약속입니다. 한국어에서는 과도한 의무 표지를 붙이면 어색해져 서사 흐름이 약해지므로, 원문의 보상 가정 의미를 자연스럽게 전달했습니다.
  doctrine_reference: 서사 맥락과 히브리어 관용구의 서술 기능
