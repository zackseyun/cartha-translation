  source_fidelity: 히브리어 וְעָלַי לָתֶת לְךָ는 ‘네게 주는 일이 내게 있었다/내 책임이었다’라는 의무·부담의 관용 표현입니다. 초안 본문의 ‘주었을 것이다’는 이 의미를 단순한 결과적 지급으로 약화시키므로 보완이 필요합니다. הִכִּיתוֹ는 ‘치다/때리다’의 동작을 담으므로 ‘쳐서 땅에 쓰러뜨리다’가 문맥과 어휘를 함께 살립니다.
  naturalness: ‘그에게 보고한 사람’, ‘거기서 그를 쳐서 땅에 쓰러뜨리지 않았습니까?’, ‘허리띠 하나’는 현대 표준 한국어에서 자연스럽습니다. 직접화법도 합쇼체로 일관되게 정리했습니다.
  terminology: ‘은 열 개’는 단위가 명시되지 않은 עֲשָׂרָה כֶסֶף를 과도하게 특정하지 않습니다. חֲגֹרָה는 현대어로 ‘허리띠’가 분명합니다. 보상 의무는 ‘주어야 했을 것입니다’로 표현하여 원문의 관용적 힘을 보존했습니다.
