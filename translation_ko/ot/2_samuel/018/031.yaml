base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/031.yaml
  text: And behold[a], the Cushite came, and the Cushite said, “Let my lord the king receive the good news[b], for Yahweh has vindicated you today from the hand of all who rose up against you.”
  footnotes:
  - marker: a
    text: 'Or, ''the Ethiopian.'' Hebrew: ''the Cushite.'''
    reason: lexical_alternative
  - marker: b
    text: Or, 'the LORD has judged for you today' or 'has given you justice today.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 구스 사람[a]이 왔습니다. 구스 사람이 말했습니다. “내 주 왕이시여, 기쁜 소식을 들으십시오. 야훼께서 오늘 당신에게 맞서 일어난 모든 자들의 손에서 당신을 위하여 정의를 행하셨습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에티오피아 사람’. 히브리어는 ‘그 구스 사람’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼께서 오늘 당신을 위하여 판결하셨습니다’ 또는 ‘오늘 당신을 변호하셨습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 그리고 보십시오
