  text: וְ/הִנֵּ֥ה הַ/כּוּשִׁ֖י בָּ֑א וַ/יֹּ֣אמֶר הַ/כּוּשִׁ֗י יִתְבַּשֵּׂר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּֽי שְׁפָטְ/ךָ֤ יְהוָה֙ הַ/יּ֔וֹם מִ/יַּ֖ד כָּל הַ/קָּמִ֥ים עָלֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/031.yaml
  text: And behold[a], the Cushite came, and the Cushite said, “Let my lord the king receive the good news[b], for Yahweh has vindicated you today from the hand of all who rose up against you.”
  footnotes:
  - marker: a
    text: 'Or, ''the Ethiopian.'' Hebrew: ''the Cushite.'''
    reason: lexical_alternative
  - marker: b
    text: Or, 'the LORD has judged for you today' or 'has given you justice today.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보라, 구스 사람이 왔습니다. 구스 사람이 말했습니다. 「내 주 왕이시여, 기쁜 소식을 들으십시오. 야훼께서 오늘 당신을 치켜세우셔서, 당신에게 맞서 일어난 모든 자들의 손에서 당신을 구하셨습니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘구스 사람’입니다. 히브리어: ‘그 구스 사람’.'
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼께서 오늘 당신을 위해 판결하셨다’ 혹은 ‘오늘 당신에게 정의를 베푸셨다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 그리고 보십시오
  - 이제 보라
  lexicon: HALOT
  rationale: 새로운 인물의 등장과 장면 전환을 알리는 감탄사적 담화표지로 보아, 간결한 ‘보라’가 원문의 즉시성과 생동감을 가장 잘 살립니다.
- source_word: הַכּוּשִׁי
  english_pob_choice: the Cushite
  chosen_korean: 구스 사람
  alternatives_korean:
  - 에티오피아 사람
  - 구스인
  - 쿠시 사람
  lexicon: HALOT
  rationale: 원문은 개인명보다 출신을 나타내는 민족/지명 표지이므로, 직역에 가까운 ‘구스 사람’으로 옮겨 소스 근접성을 유지했습니다.
- source_word: יִתְבַּשֵּׂר
  english_pob_choice: receive the good news
  chosen_korean: 기쁜 소식을 들으십시오
  alternatives_korean:
  - 기쁜 소식을 받으십시오
  - 좋은 소식을 들으십시오
  - 복된 소식을 들으십시오
  lexicon: HALOT
  rationale: 히트파엘의 명령형 뉘앙스가 왕에게 전하는 선포이므로, 한국어에서는 자연스러운 수신 표현인 ‘들으십시오’로 풀어 원문의 알림/전달 의미를 살렸습니다.
- source_word: שְׁפָטְךָ
  english_pob_choice: has vindicated you
  chosen_korean: 당신을 치켜세우셔서
  alternatives_korean:
  - 당신을 위해 심판하셔서
  - 당신의 편에서 판결하셔서
  - 당신에게 정의를 베푸셔서
  lexicon: HALOT
  rationale: ‘שפט’의 법정적-구원적 의미를 한국어에서 한 단어로 정확히 대응하기 어려워, 문맥상 야훼의 호의적 판결과 구출을 함께 담는 표현으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 기록된 신명사 טetragrammaton을 제목어 ‘주님’으로 바꾸지 않고, POB의 기준에 따라 고유명사 ‘야훼’로 직역했습니다.
theological_decisions:
- issue: 'שׁפט의 의미 범위: ‘판결’과 ‘구원’의 결합'
  chosen_reading: 야훼께서 오늘 당신을 치켜세우셔서, 당신에게 맞서 일어난 모든 자들의 손에서 당신을 구하셨습니다
  alternative_readings:
  - 야훼께서 오늘 당신을 위해 판결하셨습니다
  - 야훼께서 오늘 당신에게 정의를 베푸셨습니다
  - 야훼께서 오늘 당신의 편에서 심판하셨습니다
  rationale: 이 절은 단순한 법적 판결보다, 다윗에게 대항한 자들로부터의 구출을 포함한 공적 변호를 말합니다. 한국어 본문에서는 법정적 의미를 너무 좁히지 않되, 결과로서의 구원을 분명히 드러내도록 했습니다.
  doctrine_reference: OT lexical-theological usage of שׁפט in deliverance/vindication contexts
