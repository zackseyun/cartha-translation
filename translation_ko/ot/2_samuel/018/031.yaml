  lexicon: HALOT
  rationale: 새로운 인물의 등장과 장면 전환을 알리는 감탄사적 담화표지로 보아, 간결한 ‘보라’가 원문의 즉시성과 생동감을 가장 잘 살립니다.
- source_word: הַכּוּשִׁי
  english_pob_choice: the Cushite
  chosen_korean: 구스 사람
  alternatives_korean:
