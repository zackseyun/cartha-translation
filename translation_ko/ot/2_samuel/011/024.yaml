  lexicon: WLC; HALOT
  rationale: מורים의 활쏘기 문맥을 살려 군사적 의미를 분명히 하되, 한국어에서는 자연스럽게 ‘활쏘는 자들’로 옮겼습니다.
- source_word: עֲבָדֶיךָ
