  text: The archers shot at your servants from atop the wall[a], and some of the king’s servants died[b]; your servant Uriah the Hittite also died.
  footnotes:
  - marker: a
    text: 'Hebrew: ''and some of the king’s servants died''; the preposition may be understood partitively (''some of'').'
    reason: lexical_alternative
  - marker: b
    text: Or 'is dead' for the final clause, reflecting the Hebrew stative form.
    reason: lexical_alternative
translation:
  language: ko
  text: 궁수들이 성벽 위에서 당신의 종들을 향해 쏘아, 왕의 종들 중 몇 명이 죽었고, 당신의 종인 헷 사람 우리아도 죽었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 מִן은 여기서 ‘왕의 종들 중 일부가’라는 부분적 의미로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 히브리어의 상태형을 반영하여 ‘죽어 있습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
