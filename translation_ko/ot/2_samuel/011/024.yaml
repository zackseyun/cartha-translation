  - 당신의 신하들
  lexicon: HALOT
  rationale: 왕에게 드리는 정중한 호칭을 유지하면서도, עבד의 기본 의미를 살려 ‘종들’로 번역했습니다.
- source_word: מֵעַל הַחוֹמָה
  english_pob_choice: from atop the wall
  chosen_korean: 성벽 위에서
