base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/024.yaml
  text: The archers shot at your servants from atop the wall[a], and some of the king’s servants died[b]; your servant Uriah the Hittite also died.
  footnotes:
  - marker: a
    text: 'Hebrew: ''and some of the king’s servants died''; the preposition may be understood partitively (''some of'').'
    reason: lexical_alternative
  - marker: b
    text: Or 'is dead' for the final clause, reflecting the Hebrew stative form.
    reason: lexical_alternative
translation:
  language: ko
  text: 활쏘는 자들이 성벽 위에서 당신의 종들에게 화살을 쏘았고, 왕의 종들 가운데 몇 사람이 죽었으며, 당신의 종 헷 사람 우리아도 죽었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘왕의 종들 가운데 몇 사람이’라는 부분적 의미를 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 히브리어 상태형을 반영하여 ‘죽어 있습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ / הַמּוֹרִים
  english_pob_choice: The archers shot
  chosen_korean: 활쏘는 자들이 … 화살을 쏘았고
  alternatives_korean:
