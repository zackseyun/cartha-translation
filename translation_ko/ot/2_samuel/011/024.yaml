  lexicon: HALOT
  rationale: 위에서 아래로 쏘는 위치 관계를 간결하게 드러내는 한국어 표현으로 옮겼습니다.
- source_word: מֵעַבְדֵי הַמֶּלֶךְ
  english_pob_choice: some of the king’s servants
  chosen_korean: 왕의 종들 가운데 몇 사람이
  alternatives_korean:
  - 왕의 종들 중 몇 명이
  - 왕의 종들 가운데 일부가
  lexicon: HALOT
  rationale: מִן의 부분적 의미를 반영해 ‘가운데 몇 사람이’로 처리하여, 전부가 아니라 일부만 죽었다는 점을 보존했습니다.
- source_word: עַבְדְּךָ אוּרִיָּה הַחִתִּי
  english_pob_choice: your servant Uriah the Hittite
  chosen_korean: 당신의 종 헷 사람 우리아
  alternatives_korean:
  - 당신의 종 우리아 헷 사람
  - 당신의 종 헷 사람 우리야
  lexicon: HALOT; established biblical proper names
  rationale: 고유명사는 널리 쓰이는 성경식 표기를 따르고, עַבְדְּךָ의 낮춤/충성 표현은 ‘당신의 종’으로 유지했습니다.
- source_word: מֵת
  english_pob_choice: died / is dead
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 죽었습니다만
  - 죽어 있습니다
  lexicon: WLC; HALOT
  rationale: 서술 보고문맥에서는 상태형 뉘앙스보다 사건 보고가 자연스럽기 때문에 ‘죽었습니다’로 옮겼습니다.
theological_decisions:
- issue: 요압의 보고에서 유리야의 죽음을 함께 진술하는 방식
  chosen_reading: 문장의 마지막을 ‘죽었습니다’로 번역해, 사건의 최종성을 분명히 드러냈습니다.
  alternative_readings:
  - ‘죽어 있습니다’처럼 상태를 더 살린 번역
  - ‘죽었다’의 서술형 번역
  rationale: 히브리어 מֵת의 상태적 형태가 있으나, 본문은 전투 결과를 보고하는 서술이므로 한국어에서는 완료된 죽음을 자연스럽게 전하는 것이 적절합니다.
  doctrine_reference: 서술 양식과 상(Aspect) 처리
