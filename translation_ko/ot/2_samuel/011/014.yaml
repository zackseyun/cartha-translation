  text: In the morning[a], David wrote a letter to Joab and sent it by the hand of Uriah.
  footnotes:
  - marker: a
    text: 'Or: ''through Uriah'' or ''with Uriah.'' The Hebrew literally says ''by the hand of Uriah,'' an idiom for agency or delivery.'
