  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יִּכְתֹּ֥ב דָּוִ֛ד סֵ֖פֶר אֶל יוֹאָ֑ב וַ/יִּשְׁלַ֖ח בְּ/יַ֥ד אוּרִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/014.yaml
  text: In the morning[a], David wrote a letter to Joab and sent it by the hand of Uriah.
  footnotes:
  - marker: a
    text: 'Or: ''through Uriah'' or ''with Uriah.'' The Hebrew literally says ''by the hand of Uriah,'' an idiom for agency or delivery.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아침에 다윗이 요압에게 편지를 써서, 그것을 우리아의 손에 들려 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '우리아의 손으로'입니다. 이 표현은 전달 수단이나 대행을 뜻하는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּבֹּקֶר
  english_pob_choice: In the morning
  chosen_korean: 아침에
  alternatives_korean:
  - 그 아침에
  - 아침 무렵에
  lexicon: HALOT
  rationale: 서사 전환을 나타내는 표현으로, 영어 POB의 'In the morning'처럼 자연스러운 시간 부사구로 옮겼습니다.
- source_word: סֵפֶר
  english_pob_choice: a letter
  chosen_korean: 편지
  alternatives_korean:
  - 서신
  - 문서
  - 글
  lexicon: HALOT
  rationale: 이 문맥에서는 다윗이 요압에게 전달하는 लिख은 메시지의 기능이 분명하므로, 일반적이지만 자연스러운 '편지'가 적합합니다.
- source_word: בְּיַד אוּרִיָּה
  english_pob_choice: by the hand of Uriah
  chosen_korean: 우리아의 손에 들려
  alternatives_korean:
  - 우리아를 통해
  - 우리아의 손을 빌려
  lexicon: HALOT
  rationale: 직역하면 '우리아의 손으로'이지만, 전달 수단을 나타내는 관용을 살리면서도 우리아가 직접 운반하는 아이러니를 드러내기 위해 이렇게 옮겼습니다.
theological_decisions:
- issue: 우리아를 통한 전달의 아이러니
  chosen_reading: 다윗이 죽음의 계획이 담긴 편지를 바로 당사자인 우리아에게 맡겨 보내는 서술의 냉혹함을 그대로 드러냅니다.
  alternative_readings:
  - 중립적으로 '우리아를 통해 보냈습니다'라고 완화할 수 있음
  - 관용을 풀어 '우리아가 전달했습니다'라고 할 수 있음
  rationale: 원문은 단순한 전달 정보 이상으로 비극적 반어를 담고 있으므로, 그 긴장을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 서사 본문의 반어와 책임 강조
