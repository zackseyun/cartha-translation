id: 2SA.11.3
reference: 2 Samuel 11:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח דָּוִ֔ד וַ/יִּדְרֹ֖שׁ לָֽ/אִשָּׁ֑ה וַ/יֹּ֗אמֶר הֲ/לוֹא זֹאת֙ בַּת שֶׁ֣בַע בַּת אֱלִיעָ֔ם אֵ֖שֶׁת אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/003.yaml
  text: So David sent and inquired about the woman, and someone said, “Is this not Bathsheba, the daughter of Eliam, the wife of Uriah the Hittite?”
translation:
  language: ko
  text: 그리하여 다윗은 그 여자를 알아보려고 사람을 보냈습니다. 그리고 어떤 사람이 말했습니다. “이 사람이 엘리암의 딸이며 헷 사람 우리아의 아내인 밧세바가 아닙니까?”
  philosophy: formal
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּדְרֹשׁ
  english_pob_choice: sent and inquired
  chosen_korean: 사람을 보냈습니다 / 알아보려고
  alternatives_korean:
  - 보내고 물었습니다
  - 보내어 조사했습니다
  lexicon: שלח / דרש
  rationale: 두 동사가 연속된 동작임을 살리되, דרש의 탐문·확인 의미를 자연스러운 현대 한국어인 ‘알아보다’로 옮겼습니다.
- source_word: לָאִשָּׁה
  english_pob_choice: about the woman
  chosen_korean: 그 여자를
  alternatives_korean:
  - 그 여자에 대해
  - 그 여자에게
  lexicon: אִשָּׁה
  rationale: 히브리어 목적어를 한국어에서 보다 자연스럽게 풀어 ‘그 여자’를 직접 목적어로 두어, 누구를 찾는지 분명하게 했습니다.
- source_word: הֲלוֹא זֹאת
  english_pob_choice: Is this not
  chosen_korean: 이 사람이 … 아닙니까?
  alternatives_korean:
  - 이 사람이 …가 아닙니까?
  - 바로 이 사람이 … 아닙니까?
  lexicon: הֲלוֹא
  rationale: 수사 의문문으로서 확인과 놀라움을 담는 표현이므로, 한국어의 확인형 의문문으로 옮겼습니다.
- source_word: אֵשֶׁת אוּרִיָּה הַחִתִּי
  english_pob_choice: the wife of Uriah the Hittite
  chosen_korean: 헷 사람 우리아의 아내
  alternatives_korean:
  - 헷 사람 우리아의 아내
  - 히타이트 사람 우리아의 아내
  lexicon: אֵשֶׁת + proper name
  rationale: ‘헷 사람’은 성경 내에서 통용되는 인명·민족 표기를 따랐고, 소유 관계를 그대로 살려 ‘아내’로 번역했습니다.
theological_decisions:
- issue: 화자의 불특정성(“someone said”)
  chosen_reading: “그리고 어떤 사람이 말했습니다”로 옮겨, 화자가 특정되지 않았음을 그대로 유지했습니다.
  alternative_readings:
  - “그가 말했습니다”로 특정 화자처럼 읽는 번역
  rationale: 개정된 영어 POB가 ‘someone said’로 확정한 바를 따라, 본문이 누구의 말인지 밝히지 않는 서술 효과를 보존했습니다.
  doctrine_reference: 본문 서술 정확성 / 내러티브 관찰
