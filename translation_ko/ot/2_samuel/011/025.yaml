  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל הַ/מַּלְאָ֗ךְ כֹּֽה תֹאמַ֤ר אֶל יוֹאָב֙ אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּֽי כָ/זֹ֥ה וְ/כָ/זֶ֖ה תֹּאכַ֣ל הֶ/חָ֑רֶב הַחֲזֵ֨ק מִלְחַמְתְּ/ךָ֧ אֶל הָ/עִ֛יר וְ/הָרְסָ֖/הּ וְ/חַזְּקֵֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/025.yaml
  text: Then David said to the messenger[a], “Thus you shall say to Joab, ‘Do not let this matter be evil in your eyes, for the sword devours one as well as another[c][b]. Strengthen your attack against the city and overthrow it.’ And encourage him.”
  footnotes:
  - marker: a
    text: Or, “Do not let this matter displease you.” The Hebrew literally says, “Do not let this matter be evil in your eyes.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: “for thus and thus the sword devours,” meaning the sword kills one person as well as another.'
    reason: lexical_alternative
  - marker: c
    text: Or, “And strengthen him.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗이 사자에게 말했습니다. “요압에게 이렇게 전하십시오. ‘이 일을 네 눈에 나쁘게 여기지 말아라. 칼은 이 사람이나 저 사람이나 똑같이 삼키기 때문이다. 성에 대한 공격을 더 굳게 하고 그것을 무너뜨려라.’ 그리고 그를 격려하여라.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 일을 네가 못마땅하게 여기지 말아라.” 히브리어는 문자적으로 “이 일을 네 눈에 나쁘게 여기지 말아라”라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어 관용구: “칼은 이렇고 저렇고 삼킨다.” 곧 칼은 이 사람도 저 사람도 죽인다는 뜻입니다.'
    reason: lexical_alternative
  - marker: c
    text: 또는 “그를 강하게 하여라.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  english_pob_choice: the messenger
  chosen_korean: 사자
  alternatives_korean:
  - 전령
  - 메신저
  lexicon: HALOT
  rationale: 이 문맥의 הַמַּלְאָךְ는 천사가 아니라 소식을 전달하는 인간 사자로 보이므로, 서사적·고전적 뉘앙스를 살린 ‘사자’로 옮겼습니다.
- source_word: אַל יֵרַע בְּעֵינֶיךָ אֶת הַדָּבָר הַזֶּה
  english_pob_choice: Do not let this matter be evil in your eyes
  chosen_korean: 이 일을 네 눈에 나쁘게 여기지 말아라
  alternatives_korean:
  - 이 일을 네 눈에 악하게 여기지 말아라
  - 이 일이 너를 불쾌하게 하지 않게 하라
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심인 ‘눈에 나쁘다/악하다’를 살리되, 한국어에서 자연스러운 판단·평가 표현으로 풀어 썼습니다.
- source_word: כִּי כָזֹה וְכָזֶה תֹּאכַל הֶחָרֶב
  english_pob_choice: for the sword devours one as well as another
  chosen_korean: 칼은 이 사람이나 저 사람이나 똑같이 삼키기 때문이다
  alternatives_korean:
  - 칼은 이 사람도 저 사람도 삼키기 때문이다
  - 칼은 이렇고 저렇고 할 것 없이 삼키기 때문이다
  lexicon: HALOT
  rationale: POB가 지적한 관용구를 살려, ‘칼’의 인격화된 폭력성과 무차별성을 드러내는 ‘삼키다’를 선택했습니다.
- source_word: הַחֲזֵק מִלְחַמְתְּךָ
  english_pob_choice: Strengthen your attack
  chosen_korean: 성에 대한 공격을 더 굳게 하라
  alternatives_korean:
  - 공격을 더 강하게 하라
  - 전투를 더 굳세게 하라
  lexicon: HALOT
  rationale: 명령형 חזק의 ‘강하게 하다’라는 뜻과, 도시를 향한 공세의 구체성을 함께 살려 ‘성에 대한 공격’을 사용했습니다.
- source_word: וְהָרְסָהּ
  english_pob_choice: and overthrow it
  chosen_korean: 그것을 무너뜨려라
  alternatives_korean:
  - 그것을 허물어뜨려라
  - 그것을 파괴하여라
  lexicon: HALOT
  rationale: 성읍을 대상으로 한 군사적 파괴를 자연스럽게 전달하면서도, 원문의 ‘무너뜨리다/허물다’ 이미지를 유지했습니다.
- source_word: וְחַזְּקֵהוּ
  english_pob_choice: And encourage him
  chosen_korean: 그리고 그를 격려하여라
  alternatives_korean:
  - 그리고 그를 강하게 하여라
  - 그리고 그를 북돋아 주어라
  lexicon: HALOT
  rationale: 문맥상 요압에게 전달되는 마무리 격려이므로, ‘강하게 하다’의 직역보다 관계적 의미를 드러내는 ‘격려하다’를 택했습니다.
theological_decisions:
- issue: 다윗의 말이 우회적으로 요압의 전투를 정당화하는 방식
  chosen_reading: 직접적인 비난을 피하면서도 ‘칼은 이 사람이나 저 사람이나 똑같이 삼키기’라는 말로 사건을 정상화하려는 어조를 그대로 드러냈습니다.
  alternative_readings:
  - 단순한 위로의 말로 완화
  - 전술 지시로만 축소
  rationale: 본문은 위로와 작전 지시를 넘어, 다윗이 사건의 도덕적 문제를 희석시키는 뉘앙스를 포함하므로 그 긴장을 유지해야 합니다.
  doctrine_reference: 서사 본문의 도덕적 평가를 약화시키지 않음
