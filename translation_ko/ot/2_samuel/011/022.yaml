  source_fidelity: 히브리어의 연속 동사 ‘가다, 오다, 알리다’와 요압이 전령에게 전달하도록 맡긴 메시지 전체라는 뜻을 충실히 반영해야 합니다. 초안의 두 번째 ‘가서’는 וַיָּבֹא(‘와서/이르러’)를 잘못 옮겼고, ‘요압이 그에게 보낸’은 히브리어 접미사가 가리키는 ‘그를 보내다’와 맞지 않습니다.
  naturalness: ‘그 전령은 가서 다윗에게 이르러’는 현대 표준어 문어체에서 자연스럽고, 합쇼체 종결과도 조화됩니다. ‘사자’도 가능하지만 현대 독자에게는 ‘전령’이 사람 전달자라는 뜻을 더 분명하고 자연스럽게 드러냅니다.
  terminology: מַלְאָךְ는 이 군사 հաղորդ 맥락에서 ‘전령’으로 옮기는 것이 적절합니다. ‘전하라고 보낸’은 문자적으로 다소 압축된 히브리어 표현의 의사소통 기능을 한국어로 자연스럽게 풀어 주며, 영어 POB의 ‘sent him to say’와도 일치합니다.
