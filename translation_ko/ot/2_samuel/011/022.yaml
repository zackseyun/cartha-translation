translation:
  language: ko
  text: 그래서 그 전령은 가서 다윗에게 이르러, 요압이 그에게 전하라고 보낸 모든 것을 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘요압이 그를 보낸 모든 것’입니다. 여기서는 전령이 요압에게서 전달하도록 받은 모든 내용을 다윗에게 보고했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  english_pob_choice: the messenger
  chosen_korean: 사자
  alternatives_korean:
  - 전령
  - 메신저
  lexicon: HALOT
  rationale: 인간 전달자를 가리키는 말이므로 ‘사자’로 옮기되, 문맥상 천사 의미가 아니라는 점을 유지했습니다.
- source_word: וַיֵּלֶךְ / וַיָּבֹא
  english_pob_choice: went and came
  chosen_korean: 가서 … 가서
  alternatives_korean:
  - 가서 … 와서
  - 가고 와서
  lexicon: HALOT
  rationale: 히브리어의 연속 동작을 살리려 했고, ‘가서’와 ‘가서’ 반복은 서술의 진행을 드러냅니다.
- source_word: וַיַּגֵּד
  english_pob_choice: told
  chosen_korean: 말했습니다
  alternatives_korean:
  - 알렸습니다
  - 전했습니다
  lexicon: HALOT
  rationale: 대화 전달의 일반적 의미를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: אֵת כָּל אֲשֶׁר שְׁלָחוֹ יוֹאָב
  english_pob_choice: all that Joab had sent him to say
  chosen_korean: 요압이 그에게 보낸 모든 것
  alternatives_korean:
  - 요압이 그에게 보낸 모든 말
  - 요압이 그에게 맡긴 모든 말
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘요압이 그를 보낸 모든 것/그에게 보낸 모든 것’이지만, POB의 주석처럼 전달 내용을 가리키는 뜻이므로 한국어에서는 ‘보낸 모든 것’으로 두고 여운을 살렸습니다.
