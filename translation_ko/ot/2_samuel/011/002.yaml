  lexicon: HALOT
  rationale: 서사 도입의 시간 표현을 자연스러운 현대 한국어로 옮기되, 단순한 ‘그리고’보다 장면 전환을 분명히 했습니다.
- source_word: וַיָּקָם דָּוִד מֵעַל מִשְׁכָּבוֹ
  english_pob_choice: David arose from his bed
  chosen_korean: 다윗이 자기 침상에서 일어나
  alternatives_korean:
  - 다윗이 침상에서 일어나
  - 다윗이 누운 자리에서 일어나
  lexicon: HALOT
  rationale: מִשְׁכָּב를 ‘침상’으로 옮겨 문맥상 잠자리임을 드러내면서도, ‘자기’로 대명사 관계를 자연스럽게 반영했습니다.
- source_word: עַל גַּג בֵּית הַמֶּלֶךְ
  english_pob_choice: on the roof of the king’s house
  chosen_korean: 왕궁 지붕 위를
  alternatives_korean:
  - 왕의 집 지붕 위를
  - 왕궁의 지붕 위를
  lexicon: HALOT
  rationale: 문자적 ‘왕의 집’보다 문맥상 자연스러운 ‘왕궁’을 택하되, 지붕 위라는 공간성을 유지했습니다.
- source_word: וַיַּרְא אִשָּׁה רֹחֶצֶת
  english_pob_choice: he saw a woman bathing
  chosen_korean: 거닐다가, 지붕 위에서 목욕하는 한 여인을 보았는데
  alternatives_korean:
  - 거닐다가 지붕에서 목욕하는 여인을 보았는데
  - 거닐다가 목욕하는 한 여인을 보았는데
  lexicon: HALOT
  rationale: 분사 רֹחֶצֶת의 진행 중인 동작을 ‘목욕하는’으로 살리고, 화자의 시점인 ‘지붕 위에서’는 뒤 문장에 연결해 자연스럽게 처리했습니다.
- source_word: טוֹבַת מַרְאֶה מְאֹד
  english_pob_choice: very beautiful in appearance
  chosen_korean: 보기에 매우 아름다웠습니다
  alternatives_korean:
  - 매우 아름다웠습니다
  - 외모가 매우 아름다웠습니다
  lexicon: HALOT
  rationale: מַרְאֶה의 시각적 초점을 살리기 위해 ‘보기에’로 옮겼고, 전통적 미화보다 직접적인 외형 묘사를 택했습니다.
