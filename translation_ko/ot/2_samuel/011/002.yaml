base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/002.yaml
  text: Then at evening time David arose from his bed and walked on the roof of the king’s house[a], and from the roof he saw a woman bathing[b]; and the woman was very beautiful in appearance.
  footnotes:
  - marker: a
    text: Or, more literally, 'and it happened at the time of evening.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the king’s house'; 'palace' is a possible contextual rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 저녁 무렵에 다윗이 자기 침상에서 일어나 왕궁 지붕 위를 거닐다가, 지붕 위에서 목욕하는 한 여인을 보았는데, 그 여인은 보기에 매우 아름다웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘왕의 집’입니다. 문맥상 ‘왕궁’도 가능한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지붕 위에서’는 다윗의 시점을 드러내기 위해 앞 문장에 자연스럽게 연결했습니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְהִי לְעֵת הָעֶרֶב
  english_pob_choice: Then at evening time
  chosen_korean: 저녁 무렵에
