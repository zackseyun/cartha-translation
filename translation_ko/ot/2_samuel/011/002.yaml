  text: 저녁 무렵, 다윗은 자기 침상에서 일어나 왕궁[a] 지붕 위를 거닐었습니다. 그 지붕 위에서[b] 그는 목욕하고 있는 한 여인을 보았습니다. 그 여인은 보기에 매우 아름다웠습니다.
