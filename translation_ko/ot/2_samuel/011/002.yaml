  rationale: 히브리어 본문은 현재 이 절에서 단지 시간, 동작, 관찰, 외모 묘사를 제시할 뿐이므로, 본문이 말하지 않는 평가를 앞당기지 않았습니다.
  doctrine_reference: 본문 충실성 원칙
