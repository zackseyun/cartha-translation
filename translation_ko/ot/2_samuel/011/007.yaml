translation:
  language: ko
  text: 우리아가 그에게 오자, 다윗은 요압의 안부와 군대의 안부와 전쟁의 안부를 물었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘다윗은 요압의 안부와 군대의 안부와 전쟁의 안부를 물었습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... אֵלָיו
  english_pob_choice: When Uriah came to him
  chosen_korean: 우리아가 그에게 오자
  alternatives_korean:
  - 우리아가 그에게 왔을 때
  - 우리아가 다윗에게 오자
  lexicon: WLC; HALOT
  rationale: בוא와 אֶל + 접미사는 단순한 도착/접근을 뜻하므로, 서술 흐름을 살리면서도 ‘그에게’로 관계를 분명히 했습니다.
- source_word: וַיִּשְׁאַל ... לִשְׁלוֹם
  english_pob_choice: asked about Joab's welfare, the welfare of the troops, and the welfare of the war
  chosen_korean: 요압의 안부와 군대의 안부와 전쟁의 안부를 물었습니다
  alternatives_korean:
  - 요압이 평안한지와 군대가 평안한지와 전쟁이 어떻게 되어 가는지를 물었습니다
  - 요압의 평안을, 군대의 평안을, 전쟁의 평안을 물었습니다
  lexicon: HALOT
  rationale: לִשְׁלוֹם의 반복을 한국어의 ‘안부’로 일관되게 옮겨, POB가 지적한 반복 구조와 ‘about the welfare of’의 형식을 살렸습니다.
- source_word: הָעָם
  english_pob_choice: the troops
  chosen_korean: 군대
  alternatives_korean:
  - 백성
  - 병사들
  - 군사들
  lexicon: HALOT
  rationale: 전쟁 문맥에서 הָעָם은 일반 ‘백성’보다 전투력 전체를 가리키는 말로 읽히므로, 한국어에서는 자연스럽고 넓게 포괄하는 ‘군대’로 옮겼습니다.
- source_word: הַמִּלְחָמָה
  english_pob_choice: the war
  chosen_korean: 전쟁
  alternatives_korean:
  - 전투
  - 싸움
  lexicon: HALOT
  rationale: מִלְחָמָה는 개별 교전보다 전쟁/전역을 뜻하므로, 문맥에 맞는 기본어 ‘전쟁’을 사용했습니다.
