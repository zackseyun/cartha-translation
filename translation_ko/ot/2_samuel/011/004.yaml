reference: 2 Samuel 11:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ דָּוִ֨ד מַלְאָכִ֜ים וַ/יִּקָּחֶ֗/הָ וַ/תָּב֤וֹא אֵלָי/ו֙ וַ/יִּשְׁכַּ֣ב עִמָּ֔/הּ וְ/הִ֥יא מִתְקַדֶּ֖שֶׁת מִ/טֻּמְאָתָ֑/הּ וַ/תָּ֖שָׁב אֶל בֵּיתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/004.yaml
  text: So David sent messengers and took her[a], and she came to him, and he lay with her. Now she was purifying herself from her uncleanness. Then she returned to her house.
  footnotes:
  - marker: a
    text: Or, 'she had purified herself from her uncleanness.' The Hebrew can be understood as a background note about ritual cleansing after menstruation.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 다윗이 사자들을 보내 그녀를 데려왔습니다[a]. 그녀가 자기에게 왔고, 그는 그녀와 동침했습니다. 그런데 그녀는 자기의 부정함에서 몸을 정결하게 하고 있었습니다. 그러고 나서 그녀는 자기 집으로 돌아갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀는 자기의 부정함에서 이미 정결을 마쳤다.’ 히브리어는 월경 후의 의식적 정결에 관한 배경 설명으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח / מַלְאָכִים
  english_pob_choice: sent messengers
  chosen_korean: 사자들을 보내
  alternatives_korean:
  - 전령들을 보내
  - 사신들을 보내
  lexicon: HALOT
  rationale: מַלְאָכִים은 문맥상 ‘메신저/전령’의 뜻이지만, 한국어 성경 전통에서 왕의 심부름꾼을 자연스럽게 옮길 수 있는 ‘사자들’이 간결하며, 뒤의 행동 연쇄를 살립니다.
- source_word: וַיִּקָּחֶהָ
  english_pob_choice: took her
  chosen_korean: 데려왔습니다
  alternatives_korean:
  - 그녀를 데려갔습니다
  - 그녀를 취했습니다
  lexicon: HALOT
  rationale: לקח의 직역인 ‘취하다’는 한국어에서 지나치게 딱딱하거나 오해를 낳을 수 있어, 본문의 서술적·강압적 뉘앙스를 유지하면서도 자연스러운 ‘데려왔습니다’를 택했습니다.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  english_pob_choice: he lay with her
  chosen_korean: 그는 그녀와 동침했습니다
  alternatives_korean:
  - 그는 그녀와 잠자리를 같이했습니다
  - 그는 그녀와 잤습니다
  lexicon: HALOT
  rationale: 성관계를 가리키는 성서적 관용구를 직설적으로 살리되, 일상어 ‘잤습니다’보다 더 문어적이고 절제된 ‘동침했습니다’로 옮겼습니다.
- source_word: וְהִיא מִתְקַדֶּשֶׁת מִטֻּמְאָתָהּ
  english_pob_choice: Now she was purifying herself from her uncleanness
  chosen_korean: 그런데 그녀는 자기의 부정함에서 몸을 정결하게 하고 있었습니다
  alternatives_korean:
  - 그런데 그녀는 자기의 부정함에서 스스로를 정결하게 하고 있었습니다
  - 그런데 그녀는 자기의 부정함에서 정결해지고 있었습니다
  lexicon: HALOT
  rationale: 히트파엘 מִתְקַדֶּשֶׁת는 도덕적 ‘성화’가 아니라 의식적 정결을 가리키므로 ‘몸을 정결하게 하다’로 풀어, טֻמְאָה의 제의적 범주를 ‘부정함’으로 유지했습니다.
- source_word: וַתָּשָׁב אֶל בֵּיתָהּ
  english_pob_choice: Then she returned to her house
  chosen_korean: 그러고 나서 그녀는 자기 집으로 돌아갔습니다
  alternatives_korean:
  - 그 후 그녀는 집으로 돌아갔습니다
  - 그리고 그녀는 자기 집으로 돌아갔습니다
  lexicon: HALOT
  rationale: בית는 여기서 문자적으로 ‘집’이 가장 적절하며, 연속 동작을 나타내는 서술 흐름을 위해 ‘그러고 나서’로 정리했습니다.
theological_decisions:
- issue: 의식 정결 표현의 의미
  chosen_reading: ‘몸을 정결하게 하고 있었습니다’로 옮겨, 행위가 도덕적 회개가 아니라 제의적 정결 행위임을 드러냈습니다.
  alternative_readings:
  - ‘정결하게 하고 있었습니다’
  - ‘정화하고 있었습니다’
  rationale: 본문의 동사와 명사는 레위기의 정결 범주를 가리키므로, 성화나 윤리적 개선으로 읽히지 않도록 제의적 의미를 보존하는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 사건의 강도와 서술 톤
  chosen_reading: ‘데려왔습니다’와 ‘동침했습니다’의 직설적 조합을 유지해, 본문의 압축적이고 무게 있는 서술을 흐리지 않았습니다.
  alternative_readings:
  - 더 완곡한 표현으로 완화
  - ‘취했습니다’처럼 더 직접적인 표현
  rationale: 본문은 사실적 진술을 짧게 이어가며, 독자가 행위의 도덕적 무게를 느끼도록 합니다. 과도한 완곡화는 이 긴장을 약화시킬 수 있습니다.
  doctrine_reference: Translation philosophy §§1, 6
