id: 2SA.11.10
reference: 2 Samuel 11:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּגִּ֤דוּ לְ/דָוִד֙ לֵ/אמֹ֔ר לֹֽא יָרַ֥ד אוּרִיָּ֖ה אֶל בֵּית֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אוּרִיָּ֗ה הֲ/ל֤וֹא מִ/דֶּ֨רֶךְ֙ אַתָּ֣ה בָ֔א מַדּ֖וּעַ לֹֽא יָרַ֥דְתָּ אֶל בֵּיתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/010.yaml
  text: They told David[a], saying, “Uriah did not go down to his house.” So David said to Uriah[b], “Have you not come from a journey? Why did you not go down to your house?”
  footnotes:
  - marker: a
    text: Hebrew 'go down to his/your house' is a literal idiom for going home, likely from the higher elevation or official precincts to one's residence.
    reason: cultural_note
  - marker: b
    text: Or 'from the road.' The Hebrew expression means 'from a journey' or 'from traveling.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들이 다윗에게 말하여 이르되 “우리야가 자기 집으로 내려가지 않았습니다.” 하니, 다윗이 우리야에게 말하되 “당신은 길에서 온 것이 아니오? 어찌하여 자기 집으로 내려가지 않았소?” 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘집으로 내려가다’는 집으로 돌아가다라는 관용적 표현입니다.
    reason: cultural_note
  - marker: b
    text: ‘길에서’는 ‘여정에서/여행 중에’라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ
  english_pob_choice: They told
  chosen_korean: 사람들이 … 말하여 이르되
  alternatives_korean:
  - 사람들이 보고하여 이르되
  - 사람들이 알리며 이르되
  lexicon: HALOT
  rationale: 히필 נגד는 ‘말하다/알리다/보고하다’의 폭이 있지만, 서술의 자연스러운 흐름을 살리기 위해 간단한 ‘말하여 이르되’로 옮겼습니다.
- source_word: לֹא יָרַד אוּרִיָּה אֶל בֵּיתוֹ / לֹא יָרַדְתָּ אֶל בֵּיתֶךָ
  english_pob_choice: did not go down to his house / did you not go down to your house
  chosen_korean: 자기 집으로 내려가지 않았습니다 / 자기 집으로 내려가지 않았소
  alternatives_korean:
  - 자기 집으로 가지 않았습니다
  - 집으로 내려가지 않았습니다
  lexicon: HALOT
  rationale: ירד의 직역인 ‘내려가다’를 반복해 히브리어 관용구와 서술적 긴장을 보존했습니다. 여기서 ‘집’은 거주지를 가리키는 구체적 목적지입니다.
- source_word: מִדֶּרֶךְ
  english_pob_choice: from a journey
  chosen_korean: 길에서 온 것이 아니오
  alternatives_korean:
  - 여행에서 온 것이 아니오
  - 길에서 막 온 것이 아니오
  lexicon: HALOT
  rationale: 문맥상 단순한 도로가 아니라 ‘여정/출장’의 뉘앙스가 있어 ‘길에서 온 것’으로 옮기되, 한국어에서는 그 의미가 자연스럽게 전달되도록 했습니다.
- source_word: הֲלוֹא
  english_pob_choice: Have you not
  chosen_korean: 아니오?
  alternatives_korean:
  - 그렇지 않소?
  - 오지 않았소?
  lexicon: HALOT
  rationale: 예상되는 긍정 답변을 요구하는 수사의문이므로, 한국어에서는 문맥상 반문 기능이 드러나도록 처리했습니다.
theological_decisions:
- issue: 다윗의 말투와 대화체의 시대적 거리감
  chosen_reading: 본문의 직접 화법은 현대 한국어 합쇼체로 옮기되, 다윗의 질문은 상대에게 묻는 왕의 발화로서 ‘-오/소’ 계열을 섞어 긴장감을 살렸습니다.
  alternative_readings:
  - 전부 ‘합니다체’로 통일
  - 더 강한 고어체로 전환
  rationale: 이 절은 역사 서술 안의 직접 대화이므로 현대 독자가 이해할 수 있는 합쇼체를 유지하되, 원문의 대화적 압박을 약화시키지 않는 선에서 약간의 거리감을 남겼습니다.
  doctrine_reference: 번역 शैली 원칙
