source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אוּרִיָּ֗ה שֵׁ֥ב בָּ/זֶ֛ה גַּם הַ/יּ֖וֹם וּ/מָחָ֣ר אֲשַׁלְּחֶ֑/ךָּ וַ/יֵּ֨שֶׁב אוּרִיָּ֧ה בִ/ירוּשָׁלִַ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא וּ/מִֽ/מָּחֳרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/012.yaml
  text: Then David said to Uriah[a], “Stay here today also, and tomorrow I will send you away.” So Uriah stayed in Jerusalem that day and the next day.
  footnotes:
  - marker: a
    text: Or, “and on the following day.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다윗이 우리야에게 말했습니다. 「오늘도 여기 머무르십시오. 내일 보내겠습니다.」 그래서 우리야는 그날과 그 이튿날 예루살렘에 머물렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우-연속형의 서사 진행을 자연스러운 한국어 연결어로 옮겼습니다. '그러자'가 사건의 이어짐을 가장 분명하게 드러냅니다.
- source_word: שֵׁב בָּזֶה
  english_pob_choice: Stay here
  chosen_korean: 여기 ... 머물러 있으라
  alternatives_korean:
  - 여기 ... 있으라
  - 여기 ... 머무르라
  - 여기 ... 머무르십시오
  lexicon: HALOT
  rationale: 임시 체류를 뜻하는 ישׁב의 명령형을 '머물러 있으라'로 옮겨, 단순 위치 명령이 아니라 잠시 머무르라는 뉘앙스를 살렸습니다.
- source_word: אֲשַׁלְּחֶךָּ
  english_pob_choice: I will send you away
  chosen_korean: 너를 보내겠습니다
  alternatives_korean:
  - 너를 떠나보내겠습니다
  - 너를 보내 드리겠습니다
  - 너를 내보내겠습니다
  lexicon: HALOT
  rationale: שׁלח의 기본 의미를 따라 '보내다'로 옮겼고, 문맥상 출발시키는 뜻이므로 '떠나보내다'도 가능하지만 본문은 장식 없이 간명하게 처리했습니다.
- source_word: וַיֵּשֶׁב ... בִּירוּשָׁלִַם
  english_pob_choice: So Uriah stayed in Jerusalem
  chosen_korean: 우리야는 ... 예루살렘에 머물렀습니다
  alternatives_korean:
  - 우리야는 ... 예루살렘에 있었습니다
  - 우리야는 ... 예루살렘에 거했습니다
  lexicon: HALOT
  rationale: 앞의 '머물러 있으라'와 어휘를 맞추어 서술도 '머물렀습니다'로 통일했습니다. '거했습니다'는 다소 격식적이지만 여기서는 단기 체류 맥락에 덜 적합합니다.
