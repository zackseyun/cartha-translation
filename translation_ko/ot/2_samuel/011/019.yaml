source:
  edition: WLC
  text: וַ/יְצַ֥ו אֶת הַ/מַּלְאָ֖ךְ לֵ/אמֹ֑ר כְּ/כַלּוֹתְ/ךָ֗ אֵ֛ת כָּל דִּבְרֵ֥י הַ/מִּלְחָמָ֖ה לְ/דַבֵּ֥ר אֶל הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/019.yaml
  text: And he commanded the messenger[a], saying, “When you have finished telling the king all the news of the battle,”
  footnotes:
  - marker: a
    text: Or, “all the matters of the battle,” that is, the full report concerning the battle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 사자를 명령하며 말했습니다. “당신이 전쟁의 모든 말을 왕에게 말하기를 마치면,”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전쟁의 모든 말’은 문자적 표현을 살린 것으로, 전쟁에 관한 전체 보고 사항을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: And he commanded
  chosen_korean: 그는 사자를 명령하며 말했습니다
  alternatives_korean:
  - 그는 사자에게 지시했습니다
  - 그는 사자에게 명령했습니다
  lexicon: HALOT
  rationale: צוה의 권위 있는 명령 동사를 살려 ‘명령하다’로 옮기되, 한국어 문장 흐름에 맞게 직접화법 도입을 덧붙였습니다.
- source_word: הַמַּלְאָךְ
  english_pob_choice: the messenger
  chosen_korean: 사자
  alternatives_korean:
  - 메신저
  - 전령
  lexicon: HALOT
  rationale: 군사적 보고를 전달하는 인간 사자이므로, 성경 한국어에서 널리 쓰이는 ‘사자’가 문맥상 가장 자연스럽습니다.
- source_word: כָּל דִּבְרֵי הַמִּלְחָמָה
  english_pob_choice: all the news of the battle
  chosen_korean: 전쟁의 모든 말
  alternatives_korean:
  - 전쟁의 모든 소식
  - 전쟁에 관한 모든 이야기
  - 전쟁의 모든 일
  lexicon: HALOT
  rationale: דִּבְרֵי는 문자적으로 ‘말들’이지만, 여기서는 전쟁에 관한 보고 사항 전체를 가리키므로 본문의 표현을 최대한 유지한 ‘전쟁의 모든 말’로 옮겼습니다.
- source_word: לְדַבֵּר אֶל הַמֶּלֶךְ
  english_pob_choice: telling the king
  chosen_korean: 왕에게 말하기를
  alternatives_korean:
  - 왕에게 말하여
  - 왕에게 보고하기를
  lexicon: HALOT
  rationale: לְדַבֵּר אֶל은 단순히 ‘말하다’보다 대상을 향한 발화를 뜻하므로, 직역에 가까운 ‘왕에게 말하기를’로 처리했습니다.
