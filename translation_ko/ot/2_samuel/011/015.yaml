source:
  edition: WLC
  text: וַ/יִּכְתֹּ֥ב בַּ/סֵּ֖פֶר לֵ/אמֹ֑ר הָב֣וּ אֶת אֽוּרִיָּ֗ה אֶל מוּל֙ פְּנֵ֤י הַ/מִּלְחָמָה֙ הַֽ/חֲזָקָ֔ה וְ/שַׁבְתֶּ֥ם מֵ/אַחֲרָ֖י/ו וְ/נִכָּ֥ה וָ/מֵֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/015.yaml
  text: He wrote in the letter[a], saying, "Set Uriah at the front of the hardest fighting, then withdraw from behind him so that he may be struck down and die."
  footnotes:
  - marker: a
    text: Or, "where the fighting is fiercest."
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 편지에 이렇게 썼습니다. “우리아를 가장 치열한 전투의 최전선에 두고, 그의 뒤에서 물러나 그가 맞아 죽게 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전투가 가장 치열한 곳에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  english_pob_choice: He wrote
  chosen_korean: 그는 … 썼습니다
  alternatives_korean:
  - 그는 … 기록했습니다
  lexicon: HALOT
  rationale: 서술적 wayyiqtol을 한국어의 자연스러운 과거 서술로 옮겼고, ‘기록하다’보다 편지 작성의 맥락에 맞는 ‘쓰다’를 택했습니다.
- source_word: בַּסֵּפֶר
  english_pob_choice: in the letter
  chosen_korean: 편지에
  alternatives_korean:
  - 문서에
  - 책에
  lexicon: HALOT
  rationale: 여기서 סֵפֶר는 다윗이 보낸 서면 지시를 가리키므로, 넓은 ‘책/문서’보다 문맥상 ‘편지’가 가장 정확합니다.
- source_word: הָבוּ אֶת אוּרִיָּה אֶל מוּל פְּנֵי הַמִּלְחָמָה הַחֲזָקָה
  english_pob_choice: Set Uriah at the front of the hardest fighting
  chosen_korean: 우리아를 가장 치열한 전투의 선두에 두고
  alternatives_korean:
  - 우리아를 가장 치열한 전투 앞에 두고
  - 우리아를 가장 격렬한 전투 한복판에 두고
  lexicon: HALOT
  rationale: 명령형 הָבוּ를 자연스럽게 ‘두다’로 옮겼고, מוּל פְּנֵי와 הַחֲזָקָה의 전투적 긴장을 ‘가장 치열한 전투의 선두’로 살렸습니다.
- source_word: וְשַׁבְתֶּם מֵאַחֲרָיו
  english_pob_choice: then withdraw from behind him
  chosen_korean: 그 뒤에서 물러나게 하여
  alternatives_korean:
  - 그에게서 पीछे 물러나
  - 그 뒤에서 철수하게 하여
  lexicon: HALOT
  rationale: שׁוּב의 의미를 전투 맥락에서 ‘물러나다’로 옮기되, מֵאַחֲרָיו의 ‘그 뒤에서’라는 배치를 유지해 의도적 방치를 드러냈습니다.
- source_word: וְנִכָּה וָמֵת
  english_pob_choice: so that he may be struck down and die
  chosen_korean: 그가 맞아 죽게 하십시오
  alternatives_korean:
  - 그가 맞고 죽게 하십시오
  - 그가 맞아 쓰러져 죽게 하십시오
  lexicon: HALOT
  rationale: נכה와 ‘죽다’의 연속을 한국어에서 자연스럽게 압축해, 명시된 살해 의도를 드러내면서도 의미 손실은 최소화했습니다.
theological_decisions:
- issue: 직접 인용문 안의 명령형 높임말
  chosen_reading: 편지 내용은 하급자에게 내리는 전투 지시로 보아 ‘하십시오’체를 유지했습니다.
  alternative_readings:
  - 명령문을 평서형으로 완화
  - 더 거친 반말형으로 재현
  rationale: 히브리어 명령문의 강한 지시성을 살리면서도 현대 한국어 합쇼체의 공적 문체에 맞추었습니다.
  doctrine_reference: 서사 본문 어조 보존
