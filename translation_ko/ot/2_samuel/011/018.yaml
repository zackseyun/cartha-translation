  yaml_path: translation/ot/2_samuel/011/018.yaml
  text: Then Joab sent word and told David all the news of the battle[a].
  footnotes:
  - marker: a
    text: Or 'all the matters of the battle.' The Hebrew is literally 'all the words of the battle,' an idiom for the details or report of the fighting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 요압이 사람을 보내 다윗에게 전투의 모든 소식을 전했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘전투의 모든 말들’입니다. 히브리어는 여기서 전투의 세부 사항이나 보고를 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent word
  chosen_korean: 사람을 보내
  alternatives_korean:
  - 보냈습니다
  - 전갈을 보냈습니다
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘보내다’이지만, 이어지는 ‘말하다/전하다’와 함께 보고를 전달하는 뜻이므로 한국어에서는 ‘사람을 보내’가 가장 자연스럽고, ‘전갈’보다 본문 상황을 덜 단정합니다.
- source_word: וַיַּגֵּד
  english_pob_choice: told
  chosen_korean: 전했습니다
  alternatives_korean:
  - 알렸습니다
  - 보고했습니다
  lexicon: HALOT
  rationale: נגד 히필은 ‘말하다, 알리다, 보고하다’의 뜻이므로, 공식적이면서도 현대적인 ‘전했습니다’로 보고 행위를 살렸습니다.
- source_word: אֶת כָּל דִּבְרֵי הַמִּלְחָמָה
  english_pob_choice: all the news of the battle
  chosen_korean: 전투의 모든 소식
  alternatives_korean:
  - 전투의 모든 일들
  - 전투의 모든 사정
  - 전투의 모든 말들
  lexicon: HALOT
  rationale: 직역하면 ‘전쟁/전투의 모든 말들’이지만, 서사 맥락에서는 전투의 경과와 보고 내용을 가리키므로 ‘소식’이 원뜻을 자연스럽게 전달합니다.
theological_decisions:
- issue: ‘보내다’와 ‘전하다’의 결합이 단순 이동인지 보고 전달인지
  chosen_reading: 요압이 실제 사람을 보내어 그 보고를 전달한 것으로 읽었습니다.
  alternative_readings:
  - 그가 단순히 전갈만 보낸 것으로 읽을 수 있습니다
  - 그가 직접 말로 전한 것으로도 볼 수 있습니다
  rationale: 히브리어의 연속 동사 구조는 보고 전달의 관용적 결합으로 이해하는 것이 문맥에 가장 잘 맞습니다.
  doctrine_reference: 본문의 서사적 의미와 동사 관용 표현에 대한 번역 판단
