  lexicon: HALOT
  rationale: ירד의 기본 뜻인 ‘내려가다’를 살려, 왕궁에서 집으로 이동하는 방향성을 한국어에서도 드러냈습니다.
- source_word: לְבֵיתְךָ
  english_pob_choice: to your house
  chosen_korean: 네 집으로
  alternatives_korean:
  - 네 집에
  - 네 집으로 가서
  lexicon: HALOT
  rationale: בית의 구체적 의미를 살려 ‘집’으로 옮겼고, 자연스러운 이동 표현을 위해 조사 ‘으로’를 사용했습니다.
- source_word: וּרְחַץ רַגְלֶיךָ
  english_pob_choice: and wash your feet
  chosen_korean: 네 발을 씻으십시오
  alternatives_korean:
  - 발을 씻으십시오
  - 쉬십시오
  lexicon: HALOT
  rationale: 직역에 가까운 ‘발을 씻다’를 유지해 원문의 구체적 표현과 정황적 완곡함을 함께 보존했습니다.
- source_word: מַשְׂאַת הַמֶּלֶךְ
  english_pob_choice: a present from the king
  chosen_korean: 왕의 선물
  alternatives_korean:
  - 왕의 예물
  - 왕의 한 몫
  lexicon: HALOT
  rationale: 문맥상 우리아 뒤를 따라 보내진 물품을 가리키므로, 자연스러운 한국어로 ‘선물’을 택하되 원문의 왕 소유 표지를 살렸습니다.
theological_decisions:
- issue: 다윗의 발화에서의 높임말 처리
  chosen_reading: 다윗의 명령은 현대 한국어 합쇼체로 옮기되, 직접 인용 안에서도 왕의 명령이라는 관계를 드러내기 위해 ‘-십시오’를 사용했습니다.
  alternative_readings:
  - 반말형 명령
  - 더 완곡한 권유형 표현
  rationale: 히브리어 원문은 명령형이며, 한국어 독자는 왕의 발화로서의 위계를 자연스럽게 인지해야 하므로 합쇼체 명령으로 재현했습니다.
  doctrine_reference: 서술 문체와 화행의 충실한 재현
