revisions:
- from: 그때 다윗이 우리아에게 말했습니다. “네 집으로 내려가서 네 발을 씻으십시오.” 그래서 우리아는 왕의 집에서 나갔고, 왕의 선물이 그의 뒤를 따라 나갔습니다.[a][b]
  to: 그때 다윗이 우리아에게 말했습니다. “당신의 집으로 내려가서 발을 씻으십시오.”[a] 그래서 우리아는 왕궁에서 나갔고, 우리아가 나간 뒤에 왕의 선물이 뒤따라 나갔습니다.[b]
  rationale: 명령의 방향성(‘내려가서’)과 문자적 표현(‘발을 씻으십시오’)을 유지했습니다. ‘왕궁’은 ‘왕의 집’의 문맥상 의미를 자연스러운 현대 한국어로 옮긴 것입니다. 마지막 절은 선물이 우리아의 뒤를 따라 보내졌다는 순서를 보존하면서 지시 대상의 모호성과 무생물 주어의 어색함을 줄였습니다. 각주 표지는 해당 어구에 직접 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:37:14Z'
