  source_fidelity: 핵심 동작과 인물 관계는 대체로 충실합니다. 그러나 초안의 ‘자기 침상에서 눕기 위해 나갔으나, 그의 주인의 종들과 함께 있었고’는 히브리어의 결속 관계를 바꾸어, 우리아가 종들과 함께 침상에 눕기 위해 나갔다는 뜻이 아니라 그들과 함께 ‘있었다’는 별도 진술처럼 만들었습니다.
  naturalness: 합쇼체는 적절하나, ‘침상에서 눕기 위해’는 한국어에서 부자연스럽고 ‘함께 있었고’의 병렬은 문장 흐름과 의미 모두를 훼손합니다. ‘침상에 누우려고’로 고치고 ‘함께’를 해당 동작에 연결하는 편이 자연스럽습니다.
