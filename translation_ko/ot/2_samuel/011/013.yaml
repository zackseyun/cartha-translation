base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/013.yaml
  text: David invited him[a], and he ate and drank before him, and he made him drunk. In the evening he went out to lie on his bed with the servants of his lord[d][c][b], but he did not go down to his house.
  footnotes:
  - marker: a
    text: Or, 'David called for him' or 'David summoned him.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'before him,' that is, in David's presence.
    reason: lexical_alternative
  - marker: c
    text: Or, 'with his master's servants.' The 'lord' here is David.
    reason: lexical_alternative
  - marker: d
    text: Hebrew 'did not go down to his house.' The verb 'go down' is kept from the source text rather than simplified to 'go home.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 그를 불러들였고[a], 그는 그의 앞에서[b] 먹고 마셨습니다. 다윗은 그를 취하게 하였습니다. 저녁에 그는 자기 주인의[c] 종들과 함께 자기 침상에 누우려고 나갔으나, 자기 집으로는 내려가지 않았습니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불러들였고’는 문맥상 초대하거나 소환한 뜻을 모두 열어 둡니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 앞에서’입니다.
    reason: lexical_alternative
  - marker: c
    text: 여기서 ‘주인’은 우리아의 주인인 다윗을 가리킵니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 문자적으로 ‘그의 집으로 내려가지 않았다’입니다. ‘내려가다’라는 동사를 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  english_pob_choice: David invited him
  chosen_korean: 다윗이 그를 불러들였고
  alternatives_korean:
  - 다윗이 그를 불렀고
  - 다윗이 그를 불러냈고
  lexicon: HALOT
  rationale: קרא + לֹו는 단순 호칭보다 ‘불러 오게 하다/부르다’의 초점이 있어, 잔치 초대 뉘앙스를 지나치게 덧씌우지 않으면서도 자연스럽게 옮겼습니다.
- source_word: לְפָנָיו
  english_pob_choice: before him
  chosen_korean: 그의 앞에서
  alternatives_korean:
  - 그의 حضور 가운데에서
  - 그의 면전에서
  lexicon: HALOT
  rationale: 직역의 ‘before his face/presence’를 한국어로는 관계와 장면을 살리는 ‘그의 앞에서’가 가장 간명합니다.
- source_word: וַיְשַׁכְּרֵהוּ
  english_pob_choice: he made him drunk
  chosen_korean: 다윗이 그를 취하게 하였습니다
  alternatives_korean:
  - 다윗이 그를 술 취하게 하였습니다
  - 다윗이 그를 취하게 만들었습니다
  lexicon: HALOT
  rationale: 히필의 사역 의미를 살리되, ‘술에 취하게 하다’의 의도적 행위를 한국어 관용으로 자연스럽게 표현했습니다.
- source_word: וְאֶל בֵּיתוֹ לֹא יָרָד
  english_pob_choice: but he did not go down to his house
  chosen_korean: 자기 집으로는 내려가지 않았습니다
  alternatives_korean:
  - 자기 집으로 가지 않았습니다
  - 집으로 내려가지 않았습니다
  lexicon: HALOT
  rationale: ‘내려가다’를 유지해 히브리어의 방향 동사를 살렸고, POB의 주석처럼 ‘집으로 가다’로 평탄화하지 않았습니다.
theological_decisions:
- issue: 아도니야/주인 표현의 인물 관계를 어떻게 드러낼지
  chosen_reading: ‘그의 주인의 종들’로 옮겨, 아도니야가 곧 다윗을 가리킨다는 관계를 본문 안에서 유지했습니다.
  alternative_readings:
  - ‘그의 주인의 종들’ 대신 ‘그의 상전의 종들’
  - ‘왕의 신하들’
  rationale: 히브리어 אֲדֹנָיו는 문맥상 다윗을 가리키므로, 소유 관계와 아이러니를 살리는 표현이 필요합니다.
  doctrine_reference: 본문 문맥 해석
