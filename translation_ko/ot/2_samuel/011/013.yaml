  to: 다윗이 그를 불러들였고[a], 그는 그의 앞에서[b] 먹고 마셨습니다. 다윗은 그를 취하게 하였습니다. 저녁에 그는 자기 주인의[c] 종들과 함께 자기 침상에 누우려고 나갔으나, 자기 집으로는 내려가지 않았습니다.[d]
