  lexicon: HALOT
  rationale: ירה의 군사적 기본 의미를 따라 '쏘다'를 쓰되, 포위전 맥락의 위협성을 드러내기 위해 '쏘아대다'를 선택했습니다.
- source_word: וְאָמַר לְךָ
  english_pob_choice: and he says to you
  chosen_korean: 그가 당신에게 말하기를
  alternatives_korean:
  - 그가 당신에게 말하면
  - 그가 당신에게 말할 때
  lexicon: HALOT
  rationale: 조건절 안에서 이어지는 직접화법 도입을 한국어로 자연스럽게 처리했습니다.
