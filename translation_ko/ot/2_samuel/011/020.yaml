  text: וְ/הָיָ֗ה אִֽם תַּעֲלֶה֙ חֲמַ֣ת הַ/מֶּ֔לֶךְ וְ/אָמַ֣ר לְ/ךָ֔ מַדּ֛וּעַ נִגַּשְׁתֶּ֥ם אֶל הָ/עִ֖יר לְ/הִלָּחֵ֑ם הֲ/ל֣וֹא יְדַעְתֶּ֔ם אֵ֥ת אֲשֶׁר יֹר֖וּ מֵ/עַ֥ל הַ/חוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/020.yaml
  text: And if the king’s anger rises and he says to you[a], ‘Why did you go so near the city to fight? Did you not know what they would shoot from the wall?’
  footnotes:
  - marker: a
    text: Or 'what they would throw from atop the wall.' The Hebrew verb can refer more broadly to hurling projectiles, though 'shoot' best fits its common military sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 왕의 노여움이 치밀어 올라 그가 당신에게 말하기를 “어찌하여 성에 그처럼 가까이 가서 싸웠느냐? 성벽 위에서 쏘아댈 것을 알지 못하였느냐?” 하거든,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “성벽 위에서 무엇을 던질 것인가”로 옮길 수 있습니다. 히브리어 동사는 투사체를 던지는 뜻까지 넓게 가리킬 수 있으나, 여기서는 군사적 문맥상 “쏘다”가 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲלֶה חֲמַת הַמֶּלֶךְ
  english_pob_choice: the king’s anger rises
  chosen_korean: 왕의 노여움이 치밀어 올라
  alternatives_korean:
  - 왕의 분노가 치솟아
  - 왕의 진노가 올라
  lexicon: HALOT
  rationale: חֵמָה의 뜨거운 분노 이미지를 살리면서 עלה의 상승 동사를 자연스럽게 반영했습니다.
- source_word: נִגַּשְׁתֶּם אֶל הָעִיר
  english_pob_choice: did you go so near the city
  chosen_korean: 성에 그처럼 가까이 가서
  alternatives_korean:
  - 성에 가까이 다가가서
  - 성곽에 너무 가까이 가서
  lexicon: HALOT
  rationale: 반문 속 책망의 뉘앙스를 살리기 위해 단순한 '다가가다'보다 '그처럼 가까이'를 택했습니다.
- source_word: אֵת אֲשֶׁר יֹרוּ מֵעַל הַחוֹמָה
  english_pob_choice: what they would shoot from the wall
  chosen_korean: 성벽 위에서 쏘아댈 것을
  alternatives_korean:
