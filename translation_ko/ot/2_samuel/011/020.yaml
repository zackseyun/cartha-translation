  source_fidelity: 조건절의 구조와 왕의 반문을 대체로 충실히 옮겼습니다. 다만 יֹרוּ의 목적어를 더 명시하고, 미완료형이 가리키는 예상된 행위를 자연스럽게 드러내는 편이 좋습니다.
  naturalness: 초안의 ‘말하기를 … 하거든’과 인용문의 ‘-느냐’는 문어적이거나 현대 합쇼체와 다소 거리가 있습니다. 조건절을 ‘… 하고 말하면’으로, 왕의 말은 ‘-습니까?’로 처리하면 더 자연스럽고 일관됩니다.
  terminology: ‘왕의 노여움’은 חֵמָה에 적절하며, ‘성벽 위에서’는 מֵעַל הַחוֹמָה의 위치를 잘 전달합니다. ירה는 본문에서 ‘쏘다’로 유지하되, 각주에서는 ‘던지다’라는 넓은 가능성을 정확한 문장으로 제시해야 합니다.
