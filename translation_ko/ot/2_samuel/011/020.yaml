  yaml_path: translation/ot/2_samuel/011/020.yaml
  text: And if the king’s anger rises and he says to you[a], ‘Why did you go so near the city to fight? Did you not know what they would shoot from the wall?’
  footnotes:
  - marker: a
    text: Or 'what they would throw from atop the wall.' The Hebrew verb can refer more broadly to hurling projectiles, though 'shoot' best fits its common military sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 왕의 노여움이 치밀어 올라 그가 당신에게 “어찌하여 성에 그처럼 가까이 가서 싸웠습니까? 성벽 위에서 무엇을 쏠지를 알지 못했습니까?” 하고 말하면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “성벽 위에서 무엇을 던질지를”로 옮길 수 있습니다. 히브리어 동사는 투사체를 던지는 행위까지 넓게 가리킬 수 있으나, 여기서는 군사적 문맥상 “쏘다”가 더 적절합니다.
    reason: lexical_alternative
