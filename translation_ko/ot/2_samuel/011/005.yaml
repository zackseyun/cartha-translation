  yaml_path: translation/ot/2_samuel/011/005.yaml
  text: The woman conceived[a], and she sent word and told David[b], “I am pregnant.”
  footnotes:
  - marker: a
    text: Or, more formally, 'The woman became pregnant.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew simply 'sent'; the sense is that she sent a message to David.
