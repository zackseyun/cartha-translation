  rationale: 'The revision removes the unsupported specification that she sent a person, improves Korean sentence structure, and adds an anchor for the contextual rendering ‘전갈을 보내어.’ It preserves the source’s sequence: she conceived, sent a communication to David, and informed him of her pregnancy.'
