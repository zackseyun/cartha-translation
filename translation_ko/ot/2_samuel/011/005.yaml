review_pass:
  verdict: revise
  source_fidelity: The opening accurately conveys וַתַּהַר as becoming pregnant. However, the draft’s ‘사람을 보내’ specifies a human messenger, whereas the Hebrew leaves the object of ‘sent’ unstated; the context supports a message, but does not require stating that a person was sent. The revised wording retains the idiomatic sense of sending a message without this unnecessary specification.
  naturalness: ‘그리고 사람을 보내 다윗에게 알리며’ is syntactically awkward in modern Korean, especially with the connective ‘알리며’ followed by a quotation and final ‘했다고 했습니다.’ A direct finite narration is clearer and appropriately formal-polite.
  terminology: ‘그 여인,’ ‘임신했습니다,’ ‘다윗,’ and ‘알렸습니다’ are suitable. ‘전갈을 보내어’ is a natural Korean equivalent for the contextual sense of the two Hebrew verbs, with a footnote preserving the literal brevity of the first verb.
  issues:
  - severity: medium
    issue: ‘사람을 보내’ adds a specified messenger.
    rationale: וַתִּשְׁלַח simply says ‘she sent’; in context it implies sending a communication, but does not explicitly identify a person as the thing sent.
  - severity: medium
    issue: The clause ‘다윗에게 알리며 …라고 했습니다’ is awkward and redundantly reports the speech.
    rationale: The Hebrew sequence is best represented in Korean by ‘전갈을 보내어 …라고 알렸습니다,’ which preserves both sending and informing in an idiomatic form.
  revised_text: 그 여인이 임신했습니다[a]. 그 여인은 다윗에게 전갈을 보내어[b] “제가 임신했습니다.”라고 알렸습니다.
  revised_footnotes:
  - marker: a
    text: 더 형식적으로는 ‘그 여인이 임신하게 되었습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단순히 ‘보냈다’라고 합니다. 여기서는 다윗에게 전갈을 보낸 뜻입니다.
    reason: lexical_alternative
