    text: 더 형식적으로는 ‘그 여인이 임신하게 되었습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단순히 ‘보냈다’라고 합니다. 여기서는 다윗에게 전갈을 보낸 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  english_pob_choice: conceived
  chosen_korean: 임신했습니다
  alternatives_korean:
  - 잉태했습니다
  - 수태했습니다
  - 아이를 가졌습니다
  lexicon: HALOT
  rationale: הרה는 ‘임신하다/잉태하다’의 결과 상태를 나타내므로, 현대 한국어에서는 ‘임신했습니다’가 가장 자연스럽고 의미를 분명히 드러냅니다. ‘잉태했습니다’는 다소 문어적이고, ‘아이를 가졌습니다’는 원문의 상태 진술을 덜 직접적으로 만듭니다.
- source_word: הָאִשָּׁה
  english_pob_choice: the woman
  chosen_korean: 그 여인
  alternatives_korean:
  - 그 여자
  - 그 아내
  lexicon: HALOT
  rationale: 본문은 특정 인물을 지시하지만 이 절 자체에서는 관계 명칭을 부각하지 않으므로, ‘그 여인’이 Hebrew의 일반 명사형을 가장 무리 없이 반영합니다. ‘그 아내’는 문맥상 가능하지만 이 절의 직접 표현보다 해석을 앞세웁니다.
- source_word: וַתִּשְׁלַח / וַתַּגֵּד
  english_pob_choice: sent word / told
  chosen_korean: 사람을 보내 … 알리며
  alternatives_korean:
  - 말을 전하며
  - 소식을 보내 다윗에게 알리며
  - 메시지를 보내 다윗에게 말하며
  lexicon: HALOT
  rationale: שׁלח는 단순히 ‘보내다’이지만, 이어지는 נגד와 결합하여 메시지를 전달하는 뜻이므로 ‘사람을 보내 … 알리다’로 옮기면 동작과 기능을 함께 살릴 수 있습니다. 영어 POB의 ‘sent word’보다 한국어에서는 ‘사람을 보내’가 더 자연스럽고 원문의 간접 전달을 잘 드러냅니다.
- source_word: הָרָה אָנֹכִי
  english_pob_choice: I am pregnant
  chosen_korean: 제가 임신했습니다
  alternatives_korean:
  - 제가 아이를 밴 상태입니다
  - 제가 임신한 상태입니다
  - 제가 잉태했습니다
  lexicon: HALOT
  rationale: הָרָה עם אָנֹכִי는 현재 상태 진술이므로 한국어로도 ‘제가 임신했습니다’가 가장 직설적입니다. ‘제가 임신한 상태입니다’는 어색하게 길고, ‘제가 잉태했습니다’는 현대 독자에게 덜 자연스럽습니다.
theological_decisions:
- issue: 다윗에게 전하는 방식의 간접성
  chosen_reading: 직접 대화가 아니라 사람을 통한 전달로 표현했습니다.
  alternative_readings:
  - ‘다윗에게 말했다’
  - ‘다윗에게 알렸다’만 단독으로 번역
  rationale: 히브리어는 ‘보내다’와 ‘알리다/말하다’를 연속해 써서, 인물 간 직접 대화가 아니라 전달된 메시지를 강조합니다. 이를 반영해 ‘사람을 보내 … 알리며’로 유지했습니다.
  doctrine_reference: 서술 구조 보존
