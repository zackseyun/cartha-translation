  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִי֩ לִ/תְשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מַּלְאֿכִ֗ים וַ/יִּשְׁלַ֣ח דָּוִ֡ד אֶת יוֹאָב֩ וְ/אֶת עֲבָדָ֨י/ו עִמּ֜/וֹ וְ/אֶת כָּל יִשְׂרָאֵ֗ל וַ/יַּשְׁחִ֨תוּ֙ אֶת בְּנֵ֣י עַמּ֔וֹן וַ/יָּצֻ֖רוּ עַל רַבָּ֑ה וְ/דָוִ֖ד יוֹשֵׁ֥ב בִּ/ירוּשָׁלִָֽם׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/001.yaml
  text: At the turn of the year[a], at the time when kings go out to battle, David sent Joab, his servants with him, and all Israel. They devastated the Ammonites and besieged Rabbah[b], but David remained in Jerusalem.
  footnotes:
  - marker: a
    text: 'Hebrew: ''at the turn/return of the year,'' likely referring to the spring campaign season.'
    reason: cultural_note
  - marker: b
    text: Or 'at the time when messengers go out.' The context strongly favors 'kings go out to battle.'
    reason: alternative_reading
translation:
  language: ko
  text: 해가 바뀌는 때[a], 곧 왕들이 전쟁하러 나가는 때[b]에 다윗이 요압과 그의 신하들과 온 이스라엘을 보냈습니다. 그들은 암몬 사람들을 황폐하게 하고 라바를 포위하였으나, 다윗은 예루살렘에 머물러 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 직역하면 ‘해의 돌아옴’ 또는 ‘해의 전환’에 가깝고, 문맥상 봄철 원정 시기를 가리킬 가능성이 큽니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘사자들이 나가는 때’로 읽을 수 있습니다. 그러나 문맥은 ‘왕들이 전쟁하러 나가는 때’라는 읽기를 강하게 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  english_pob_choice: at the turn of the year
  chosen_korean: 해가 바뀌는 때
  alternatives_korean:
  - 해가 돌아오는 때
  - 년의 돌아옴에
  lexicon: HALOT
  rationale: 직역의 시간 관용구를 살리되 한국어에서 자연스럽고 간결하게 옮겼습니다. POB의 ‘turn of the year’가 지닌 계절적 전환감을 반영합니다.
- source_word: לְעֵת צֵאת הַמְּלָאכִים
  english_pob_choice: at the time when kings go out to battle
  chosen_korean: 왕들이 전쟁터로 나가는 때
  alternatives_korean:
  - 사자들이 나가는 때
  - 왕들이 나가는 때
  lexicon: HALOT
  rationale: 문맥상 군사 원정을 가리키므로 POB의 해석을 따라 ‘왕들’과 전쟁의 방향을 분명히 했습니다. ‘전쟁터로’는 본문의 군사적 상황을 한국어로 자연스럽게 드러냅니다.
- source_word: עֲבָדָי/ו
  english_pob_choice: his servants
  chosen_korean: 자기 종들
  alternatives_korean:
  - 그의 신하들
  - 그의 부하들
  lexicon: HALOT
  rationale: 왕실 소속 인원을 가리키는 넓은 의미를 유지하기 위해 ‘종들’을 택했습니다. ‘신하들’은 위계적 뉘앙스를 더 강하게 만들 수 있어 원문보다 좁아질 위험이 있습니다.
- source_word: וַיַּשְׁחִתוּ
  english_pob_choice: devastated
  chosen_korean: 황폐하게 하고
  alternatives_korean:
  - 파괴하고
  - 초토화하고
  lexicon: HALOT
  rationale: 완전한 멸절보다 군사적 파괴와 황폐화를 드러내는 동사로 옮겼습니다. POB의 ‘devastated’가 가진 강도를 보존합니다.
- source_word: וַיָּצֻרוּ עַל רַבָּה
  english_pob_choice: besieged Rabbah
  chosen_korean: 라바를 에워쌌으나
  alternatives_korean:
  - 라바를 포위하였으나
  - 라바를 둘러쌌으나
  lexicon: HALOT
  rationale: ‘에워싸다’는 성을 포위한다는 뜻을 자연스럽게 전달하며, 한국어 문장 흐름도 매끄럽습니다. 도시 이름은 음역형 ‘라바’를 사용했습니다.
- source_word: יוֹשֵׁב
  english_pob_choice: remained
  chosen_korean: 머물러 있었습니다
  alternatives_korean:
  - 머물렀습니다
  - 거기 있었습니다
  lexicon: HALOT
  rationale: ‘앉아 있다/거주하다’의 문자적 의미보다 대조되는 서사 기능—전장에 나가지 않고 예루살렘에 남아 있음—을 살렸습니다. POB의 ‘remained’에 대응합니다.
theological_decisions:
- issue: ‘왕들이 전쟁터로 나가는 때’의 해석
  chosen_reading: 이 표현을 통상적인 원정 시즌과 왕의 군사적 책무를 암시하는 말로 읽었습니다.
  alternative_readings:
  - ‘사자들이 나가는 때’로 읽는 가능성
  - 단순한 계절표현으로만 읽는 가능성
  rationale: 이 절은 교리 쟁점은 아니지만, 문맥이 전쟁과 포위를 분명히 말하므로 ‘왕들’ 해석을 택하는 것이 서사적 긴장과 다윗의 부재를 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3
