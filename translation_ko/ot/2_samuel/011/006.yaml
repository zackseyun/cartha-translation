lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד אֶל יוֹאָב
  english_pob_choice: So David sent word to Joab
  chosen_korean: 다윗이 요압에게 사람을 보내어
  alternatives_korean:
  - 다윗이 요압에게 보냈습니다
  - 다윗이 요압에게 말을 전했습니다
  lexicon: HALOT
  rationale: 첫 번째 שׁלח는 곧바로 이어지는 명령을 도입하는 전달 행위이므로, 한국어에서는 ‘사람을 보내어’로 옮기면 간접 전달과 파견의 뉘앙스를 함께 살릴 수 있습니다.
- source_word: שְׁלַח אֵלַי אֶת אֽוּרִיָּה הַחִתִּי
  english_pob_choice: Send Uriah the Hittite to me
  chosen_korean: 「헷 사람 우리야를 나에게 보내십시오」
  alternatives_korean:
  - 「헷 사람 우리야를 제게 보내십시오」
  - 「헷 사람 우리야를 내게 보내라」
  lexicon: HALOT
  rationale: 명령형은 합쇼체로 유지하되, שׁלח의 기본 뜻인 ‘보내다’를 그대로 살렸고, אֵלַי는 문맥상 자연스러운 ‘나에게’로 옮겼습니다.
- source_word: אֽוּרִיָּה הַחִתִּי
  english_pob_choice: Uriah the Hittite
  chosen_korean: 헷 사람 우리야
  alternatives_korean:
  - 히타 사람 우리야
  - 우리야 헷 사람
  lexicon: HALOT
  rationale: 지명형 형용사는 한국어 성경 관용에 맞게 ‘헷 사람’으로 옮겨 인물 식별 기능을 분명히 했습니다.
- source_word: וַיִּשְׁלַח יוֹאָב אֶת אֽוּרִיָּה אֶל דָּוִד
  english_pob_choice: And Joab sent Uriah to David
  chosen_korean: 요압이 우리야를 다윗에게 보냈습니다
  alternatives_korean:
  - 그리고 요압이 우리야를 다윗에게 보냈습니다
  - 요압은 우리야를 다윗에게 보냈습니다
  lexicon: HALOT
  rationale: 두 번째 שׁלח는 동일 동사의 반복을 살려 단순히 ‘보냈습니다’로 대응했고, אֶל은 방향성 있는 ‘에게’로 옮겼습니다.
theological_decisions:
- issue: 대화체 명령의 높임말 수준
  chosen_reading: 다윗의 명령은 직접화법 안에서 합쇼체로 제시했습니다.
  alternative_readings:
  - 반말형 직접화법
  - 더 격식적인 명령체
  rationale: 본문은 왕이 신하에게 내리는 명령이지만, 현대 표준어 출판문체에서는 직접 인용 안에서도 기본적으로 합쇼체가 가장 자연스럽고, 원문의 명령성을 충분히 전달합니다.
  doctrine_reference: 문체·화자 등록 원칙
