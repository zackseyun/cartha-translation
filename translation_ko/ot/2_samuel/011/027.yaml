  text: וַ/יַּעֲבֹ֣ר הָ/אֵ֗בֶל וַ/יִּשְׁלַ֨ח דָּוִ֜ד וַ/יַּאַסְפָ֤/הּ אֶל בֵּית/וֹ֙ וַ/תְּהִי ל֣/וֹ לְ/אִשָּׁ֔ה וַ/תֵּ֥לֶד ל֖/וֹ בֵּ֑ן וַ/יֵּ֧רַע הַ/דָּבָ֛ר אֲשֶׁר עָשָׂ֥ה דָוִ֖ד בְּ/עֵינֵ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/027.yaml
  text: When the mourning was over[a], David sent and brought her into his house, and she became his wife and bore him a son. But the thing that David had done was evil in the eyes of Yahweh.
  footnotes:
  - marker: a
    text: Or 'was displeasing in the sight of the LORD.' The Hebrew more literally says 'was evil in the eyes of the LORD,' expressing God's moral judgment on David's deed.
    reason: lexical_alternative
translation:
  language: ko
  text: 애곡 기간이 끝나자 다윗은 사람을 보내 그녀를 자기 집으로 데려왔고, 그녀는 그의 아내가 되어 아들을 낳았습니다. 그러나 다윗이 행한 그 일은 야훼의 눈에 악했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단순히 ‘지나가다’보다, 애곡의 상태나 기간이 끝났음을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר הָאֵבֶל
  english_pob_choice: When the mourning was over
  chosen_korean: 애곡 기간이 끝나자
  alternatives_korean:
  - 애곡이 지나가자
  - 슬픔이 끝나자
  - 상중이 끝나자
  lexicon: HALOT
  rationale: הָאֵבֶל은 단순한 감정이 아니라 애곡의 기간을 가리키므로, 한국어에서는 자연스럽고 사회적·의례적 의미를 살리기 위해 ‘애곡 기간’으로 옮겼습니다.
- source_word: וַיִּשְׁלַח ... וַיַּאַסְפָהּ אֶל בֵּיתוֹ
  english_pob_choice: sent and brought her into his house
  chosen_korean: 사람을 보내 그녀를 자기 집으로 데려왔고
  alternatives_korean:
  - 그녀를 자기 집으로 불러들였고
  - 그녀를 자기 집으로 이끌어 들였고
  - 그녀를 자기 집으로 데려왔고
  lexicon: HALOT
  rationale: אָסַף는 ‘거두어 들이다/데려오다’의 뜻이므로, 관계의 취함과 이동을 함께 드러내는 ‘데려왔고’가 본문 흐름에 맞습니다.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  english_pob_choice: she became his wife
  chosen_korean: 그녀는 그의 아내가 되어
  alternatives_korean:
  - 그녀는 그의 아내가 되었고
  - 그의 아내가 되었고
  - 그에게 아내가 되어
  lexicon: HALOT
  rationale: 이 구문은 신분의 변화를 나타내므로, 단순 소유처럼 들릴 수 있는 표현보다 ‘그의 아내가 되어’로 결과 상태를 분명히 했습니다.
- source_word: וַיֵּרַע ... בְּעֵינֵי יְהוָה
  english_pob_choice: was evil in the eyes of Yahweh
  chosen_korean: 야훼의 눈에 악했습니다
  alternatives_korean:
  - 야훼 보시기에 악했습니다
  - 야훼의 눈에 나빴습니다
  - 야훼의 눈에 악한 일이었습니다
  lexicon: HALOT
  rationale: יֵרַע의 도덕적 판단을 약화시키지 않기 위해 ‘악했습니다’를 유지하고, בְּעֵינֵי יְהוָה는 직역에 가까운 ‘야훼의 눈에’로 옮겼습니다.
theological_decisions:
- issue: 다윗의 행위에 대한 서술자의 도덕 평가
  chosen_reading: 본문이 다윗의 행동을 단순히 ‘마음에 들지 않았다’가 아니라 ‘악했다’고 분명히 판단하는 흐름을 유지했습니다.
  alternative_readings:
  - 야훼 보시기에 못마땅했습니다
  - 야훼의 눈에 불쾌했습니다
  rationale: 히브리어 יֵרַע는 여기서 윤리적 악을 가리키며, 문맥상 서술자의 엄중한 평가를 약화시키면 본문의 신학적 긴장이 사라집니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 여호와 신성명 יְהוָה의 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  rationale: 프로젝트 기본값에 따라 신성명은 ‘야훼’로 일관되게 옮겨, 고유한 하나님의 이름을 보존했습니다.
  doctrine_reference: 'Contested terms table: יְהוָה YHWH'
