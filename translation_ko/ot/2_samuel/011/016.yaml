source:
  edition: WLC
  text: וַ/יְהִ֕י בִּ/שְׁמ֥וֹר יוֹאָ֖ב אֶל הָ/עִ֑יר וַ/יִּתֵּן֙ אֶת א֣וּרִיָּ֔ה אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר יָדַ֔ע כִּ֥י אַנְשֵׁי חַ֖יִל שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/016.yaml
  text: So when Joab was watching the city[a], he stationed Uriah in the place where he knew the mighty men were.
  footnotes:
  - marker: a
    text: Or 'mighty men' or 'strong warriors.' The Hebrew phrase אַנְשֵׁי חַיִל refers here to capable or formidable fighting men.
    reason: lexical_alternative
translation:
  language: ko
  text: 요압이 그 성을 주시하고 있을 때, 그는 우리아를 그곳에 배치했는데, 그곳이 그가 용사들이 있는 줄 알던 곳이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘용사들’은 אַנְשֵׁי חַיִל의 일반적 뜻을 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁמֹר יוֹאָב אֶל הָעִיר
  english_pob_choice: when Joab was watching the city
  chosen_korean: 요압이 그 성을 주시하고 있을 때
  alternatives_korean:
  - 요압이 그 성을 감시하고 있을 때
  - 요압이 그 성을 지키고 있을 때
  lexicon: HALOT
  rationale: בִּשְׁמֹר은 시간절로서 ‘...하고 있을 때’를 만들며, 군사 문맥에서는 단순한 보호보다 목표물을 향한 감시·주시의 뉘앙스가 살아 있습니다.
- source_word: וַיִּתֵּן אֶת אוּרִיָּה אֶל הַמָּקוֹם
  english_pob_choice: he stationed Uriah in the place
  chosen_korean: 우리아를 그곳에 배치했는데
  alternatives_korean:
  - 우리아를 그곳에 두었는데
  - 우리아를 그곳에 세웠는데
  - 우리아를 그곳에 배치하여
  lexicon: HALOT
  rationale: נתן은 문자적으로 ‘주다/두다’이지만, 전투 배치 문맥에서는 의도적으로 특정 위치에 세우는 뜻이므로 ‘배치하다’가 자연스럽고 source-direct합니다.
- source_word: אַנְשֵׁי חַיִל
  english_pob_choice: the mighty men
  chosen_korean: 용사들이 있는 줄
  alternatives_korean:
  - 용사들이 있는 곳을
  - 강한 전사들이 있는 줄
  - 유능한 전사들이 있는 줄
  lexicon: HALOT
  rationale: אַנְשֵׁי חַיִל은 강하고 유능한 전사들을 가리키므로, 관용적으로는 ‘용사들’이 가장 압축적입니다. 다만 여기서는 ‘있는 줄 알던’으로 문맥상 위치 인지를 살렸습니다.
- source_word: שָׁם
  english_pob_choice: were
  chosen_korean: 있었습니다
  alternatives_korean:
  - 있었기 때문입니다
  - 있었습니다
  lexicon: HALOT
  rationale: שָׁם은 ‘거기/그곳에’의 장소 부사로, 한국어에서는 뒤의 존재 표현으로 자연스럽게 흡수하는 것이 가장 매끄럽습니다.
