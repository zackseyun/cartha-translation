source:
  edition: WLC
  text: וַ/תִּשְׁמַע֙ אֵ֣שֶׁת אֽוּרִיָּ֔ה כִּי מֵ֖ת אוּרִיָּ֣ה אִישָׁ֑/הּ וַ/תִּסְפֹּ֖ד עַל בַּעְלָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/026.yaml
  text: When Uriah’s wife heard that Uriah her husband was dead[a], she mourned for her husband.
  footnotes:
  - marker: a
    text: Or 'heard that Uriah her husband had died.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리아의 아내는 남편인 우리아가 죽었다는 소식을 듣고 남편을 애도했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남편인 우리아가 죽었다고 들었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע
  english_pob_choice: heard
  chosen_korean: 소식을 듣고
  alternatives_korean:
  - 듣고
  - 알게 되고
  lexicon: HALOT
  rationale: שׁמע는 기본적으로 ‘듣다’이므로, 자연스러운 서술체로 ‘소식을 듣고’라고 옮겨 사건의 전달을 분명히 했습니다.
- source_word: אֵשֶׁת אוּרִיָּה
  english_pob_choice: Uriah’s wife
  chosen_korean: 우리아의 아내
  alternatives_korean:
  - 우리아의 아내가
  - 우리아의 처
  lexicon: HALOT
  rationale: 소유/관계 표현은 한국어에서 ‘~의 아내’가 가장 자연스럽고, 본문이 인물의 신분을 관계로 규정하는 점을 그대로 살립니다.
- source_word: מֵת
  english_pob_choice: was dead
  chosen_korean: 죽었다는
  alternatives_korean:
  - 죽었다는
  - 이미 죽었다는
  lexicon: HALOT
  rationale: 히브리어는 우리아의 죽은 상태를 진술하므로, 한국어에서는 인지 내용 절로 풀어 ‘죽었다는 소식’으로 옮기는 것이 가장 자연스럽습니다.
- source_word: וַתִּסְפֹּד
  english_pob_choice: she mourned
  chosen_korean: 애도했습니다
  alternatives_korean:
  - 슬퍼했습니다
  - 곡했습니다
  - 애도했습니다
  lexicon: HALOT
  rationale: ספד는 죽은 이를 위한 애도/통곡을 뜻하므로, 격식 있는 현대 한국어로 ‘애도했습니다’가 본문의 장례적 뉘앙스를 잘 보존합니다.
theological_decisions:
- issue: 여성의 행위를 단순 감정 표출이 아니라 죽은 남편에 대한 장례적 애도로 옮길지 여부
  chosen_reading: ‘애도했습니다’로 번역하여 상실에 대한 개인적 슬픔과 장례적 반응을 함께 드러냈습니다.
  alternative_readings:
  - 슬퍼했습니다
  - 울었습니다
  rationale: 히브리어 ספד는 단순한 슬픔보다 죽은 이를 위한 공식적 애도를 가리키므로, 이를 약화하지 않는 표현을 택했습니다.
  doctrine_reference: 장례/애도 어휘의 의미 영역
- issue: בַּעַל을 ‘남편’으로 제한할지 ‘주인/주’의 가능성을 남길지 여부
  chosen_reading: 혼인 문맥이므로 ‘남편’을 사용했습니다.
  alternative_readings:
  - 주인
  - 주
  rationale: 이 구절의 관계는 혼인 관계를 가리키며, 지배적 뉘앙스를 도입할 근거가 없으므로 한국어에서도 배우자 관계를 직접 드러내는 것이 원문에 충실합니다.
  doctrine_reference: 문맥 기반 의미 선택
