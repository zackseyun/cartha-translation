language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽי הִכָּ֞ה אֶת אֲבִימֶ֣לֶךְ בֶּן יְרֻבֶּ֗שֶׁת הֲ/לֽוֹא אִשָּׁ֡ה הִשְׁלִ֣יכָה עָלָי/ו֩ פֶּ֨לַח רֶ֜כֶב מֵ/עַ֤ל הַֽ/חוֹמָה֙ וַ/יָּ֣מָת בְּ/תֵבֵ֔ץ לָ֥/מָּה נִגַּשְׁתֶּ֖ם אֶל הַֽ/חוֹמָ֑ה וְ/אָ֣מַרְתָּ֔ גַּ֗ם עַבְדְּ/ךָ֛ אוּרִיָּ֥ה הַ/חִתִּ֖י מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/021.yaml
  text: Who struck down Abimelech son of Jerubbesheth? Was it not a woman who threw an upper millstone on him from the wall[a], so that he died at Thebez? Why did you go near the wall?’ Then you shall say[c][b], ‘Your servant Uriah the Hittite is dead also.’
  footnotes:
  - marker: a
    text: 'Hebrew: ''Jerubbesheth''; compare Judges 9:1, which has ''Jerubbaal.'''
    reason: alternative_reading
  - marker: b
    text: Or 'a piece of a millstone'; the Hebrew phrase likely refers to the upper millstone.
    reason: lexical_alternative
  - marker: c
    text: See Judges 9:53 for the account being referenced.
    reason: cross_reference
translation:
  language: ko
  text: 누가 아비멜렉을 쳐서 쓰러뜨렸습니까? 예룹보셋의 아들 아비멜렉이 아닙니까? 한 여자가 성벽 위에서 맷돌 윗짝을 그에게 던져, 그가 드고베스에서 죽지 않았습니까?[a] 당신은 왜 성벽에 그렇게 가까이 갔습니까? 그러면 당신은 ‘당신의 종 헷 사람 우리아도 죽었습니다’라고 말하십시오.[c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘예룹보셋’; 사사기 9:1의 ‘예룹바알’과 대응되는 이름 형태입니다.
    reason: alternative_reading
  - marker: b
    text: ‘맷돌’의 윗돌, 곧 윗맷돌을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 사사기 9:53의 사건을 가리키는 말입니다.
    reason: cross_reference
lexical_decisions:
- source_word: הִכָּה
  english_pob_choice: struck down
  chosen_korean: 쳐서 쓰러뜨렸습니까
  alternatives_korean:
  - 죽였습니까
  - 쳤습니까
  lexicon: HALOT
  rationale: 단순한 ‘죽이다’보다, 치는 동작과 치명적 결과를 함께 드러내는 표현이 본문의 구체성과 수사적 힘을 잘 보존합니다.
- source_word: אֲבִימֶלֶךְ בֶּן יְרֻבֶּשֶׁת
  english_pob_choice: Abimelech son of Jerubbesheth
  chosen_korean: 예룹보셋의 아들 아비멜렉
  alternatives_korean:
  - 예룹바알의 아들 아비멜렉
  lexicon: HALOT
  rationale: 마소라 본문의 형태인 예룹보셋을 따르되, 익숙한 병행명 예룹바알로 조화시키지 않았습니다.
- source_word: פֶּלַח רֶכֶב
  english_pob_choice: an upper millstone
  chosen_korean: 맷돌 윗짝
  alternatives_korean:
  - 윗맷돌
  - 맷돌의 윗돌
  lexicon: HALOT
  rationale: 문맥과 병행구절을 고려하면 맷돌의 위쪽 돌을 가리키므로, 현대 한국어에서 자연스럽고 의미를 분명히 하는 ‘맷돌 윗짝’을 택했습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: Your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 하인
  lexicon: HALOT
  rationale: 왕에게 자신을 낮춰 말하는 관용적 표현으로는 ‘종’이 가장 자연스럽고, 여기서는 본문이 요구하는 예속성보다 보고 겸손의 호칭 기능이 더 강합니다.
theological_decisions:
- issue: 야훼 이름이 직접 나오지 않지만, 전승 인용 구조와 고대 내러티브의 수사적 인용을 현대 한국어에서 어떻게 살릴지
  chosen_reading: 문장부호와 각주로 병행 사건을 가리키는 인용 구조를 분명히 하되, 본문 자체는 원문 서술의 직접성을 유지했습니다.
  alternative_readings:
  - 설명적으로 풀어쓴 재서술
  - 병행 본문을 본문 안에 덧붙이는 방식
  rationale: 본문은 다윗의 명령에 따라 전령이 말할 문안을 제시하는 형식이므로, 과도한 설명을 넣지 않고 원문의 긴박한 반문과 인용 구조를 보존하는 것이 적절합니다.
  doctrine_reference: 사무엘하 11장-사사기 9장 병행 서술
