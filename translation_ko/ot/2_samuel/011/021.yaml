revisions:
- from: 누가 아비멜렉을 쳐서 쓰러뜨렸습니까? 예룹보셋의 아들 아비멜렉이 아닙니까? 한 여자가 성벽 위에서 맷돌 윗짝을 그에게 던져, 그가 드고베스에서 죽지 않았습니까?[a] 당신은 왜 성벽에 그렇게 가까이 갔습니까? 그러면 당신은 ‘당신의 종 헷 사람 우리아도 죽었습니다’라고 말하십시오.[c][b]
  to: 누가 예룹보셋[a]의 아들 아비멜렉을 쳐서 죽였습니까? 한 여자가 성벽 위에서 맷돌 윗짝[b]을 그에게 던져 그가 드베스에서 죽지 않았습니까?[c] 왜 성벽에 가까이 갔습니까?’ 하고 왕이 말하면, 그때 당신은 ‘당신의 종 헷 사람 우리아도 죽었습니다’라고 말하십시오.
  rationale: 첫 질문의 인명구를 원문대로 하나의 단위로 복원하고, 드베스의 정확한 음역을 적용했습니다. 왕의 가정된 질문이 끝나는 지점을 닫는 인용부호로 표시하여, 이어지는 ‘그때 … 말하십시오’가 전령에게 주어진 지시임을 드러냈습니다. 각주 표지와 내용도 각각의 근거 단어 및 주석 목적에 맞게 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
