  - severity: high
    issue: 지명 음역 ‘드고베스’가 잘못되었습니다.
    rationale: 히브리어 בְּתֵבֵץ는 통상 ‘드베스’로 옮깁니다.
  - severity: medium
    issue: 각주 표지가 해당 단어에 붙어 있지 않고 순서도 본문상 부자연스럽습니다.
    rationale: 예룹보셋 관련 각주 a는 ‘예룹보셋’에, 맷돌 어휘 각주 b는 ‘맷돌 윗짝’에, 병행 사건 각주 c는 드베스 사건 진술에 붙여야 합니다.
