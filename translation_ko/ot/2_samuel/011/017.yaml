source:
  edition: WLC
  text: וַ/יֵּ֨צְא֜וּ אַנְשֵׁ֤י הָ/עִיר֙ וַ/יִּלָּחֲמ֣וּ אֶת יוֹאָ֔ב וַ/יִּפֹּ֥ל מִן הָ/עָ֖ם מֵ/עַבְדֵ֣י דָוִ֑ד וַ/יָּ֕מָת גַּ֖ם אוּרִיָּ֥ה הַ/חִתִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/017.yaml
  text: The men of the city came out and fought against Joab[a], and some of the people among David’s servants fell[b]; Uriah the Hittite also died.
  footnotes:
  - marker: a
    text: Or 'went out' for 'came out.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the people, from David’s servants,' a partitive expression meaning that some of David’s men fell.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍의 사람들이 나와서 요압과 싸웠고, 백성 중 곧 다윗의 종들 가운데서 일부가 쓰러졌으며, 헷 사람 우리야도 죽었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘나가다’는 문맥상 ‘나오다’로도, ‘나가다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘백성 중, 다윗의 종들 가운데서’라는 부분격 표현으로, 일부가 전사했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ אַנְשֵׁי הָעִיר
  english_pob_choice: The men of the city came out
  chosen_korean: 그 성읍의 사람들이 나와서
  alternatives_korean:
  - 그 성읍의 남자들이 나와서
  - 성읍 사람들이 나가서
  lexicon: HALOT
  rationale: יצא의 기본 의미를 살려 ‘나와서’로 옮기되, 전투 장면의 자연스러운 한국어 흐름을 위해 주어를 간결하게 잡았습니다.
- source_word: וַיִּלָּחֲמוּ אֶת יוֹאָב
  english_pob_choice: fought against Joab
  chosen_korean: 요압과 싸웠고
  alternatives_korean:
  - 요압을 대적하여 싸웠고
  - 요압을 향해 싸웠고
  lexicon: HALOT
  rationale: 전투적 대립을 분명히 드러내면서도 한국어 서술에서는 ‘~과 싸우다’가 가장 자연스러워 이를 택했습니다.
- source_word: וַיִּפֹּל מִן הָעָם מֵעַבְדֵי דָוִד
  english_pob_choice: some of the people among David’s servants fell
  chosen_korean: 백성 중 곧 다윗의 종들 가운데서 일부가 쓰러졌으며
  alternatives_korean:
  - 백성 중 다윗의 종들 가운데서 일부가 쓰러졌으며
  - 백성 가운데 다윗의 종들 중 일부가 쓰러졌으며
  lexicon: HALOT
  rationale: מן과 מֵ의 부분적 표현을 살려 ‘~중 곧 ~가운데서 일부’로 옮겨, 단순한 소속이 아니라 전사 집단 중 일부가 피해를 입었다는 점을 드러냈습니다.
- source_word: עַבְדֵי דָוִד
  english_pob_choice: David’s servants
  chosen_korean: 다윗의 종들
  alternatives_korean:
  - 다윗의 신하들
  - 다윗의 부하들
  lexicon: HALOT
  rationale: עבד의 기본 의미를 따라 ‘종들’로 번역해 본문의 직설성을 유지했습니다. 군사적 맥락은 오히려 이들이 다윗에게 속한 사람들임을 충분히 보여 줍니다.
- source_word: אוּרִיָּה הַחִתִּי
  english_pob_choice: Uriah the Hittite
  chosen_korean: 헷 사람 우리야
  alternatives_korean:
  - 히타이트 우리야
  - 헷 족속 우리야
  lexicon: HALOT
  rationale: 히브리어의 민족 표지를 한국어 성경 관용에 맞게 ‘헷 사람’으로 옮기고, 고유명사 ‘우리야’는 현행 표기 관행을 따랐습니다.
theological_decisions:
- issue: 다윗의 종들/백성 가운데서 일부가 쓰러졌다는 부분의 부분격 표현
  chosen_reading: 이 표현은 단순히 ‘다윗의 부하들’이 아니라 전투 중 일부만이 전사했다는 부분적 손실을 강조하는 서술로 읽었습니다.
  alternative_readings:
  - 전체 집단이 패했다는 일반적 패배 서술
  - 단순한 소속 표시
  rationale: 히브리어 מן의 반복은 양적 일부를 가리키는 뉘앙스를 강하게 지니므로, 그 긴장을 한국어에서도 보존했습니다.
  doctrine_reference: 문맥 주해 / 히브리어 부분격
