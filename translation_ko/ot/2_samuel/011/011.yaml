source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אוּרִיָּ֜ה אֶל דָּוִ֗ד הָ֠/אָרוֹן וְ/יִשְׂרָאֵ֨ל וִֽ/יהוּדָ֜ה יֹשְׁבִ֣ים בַּ/סֻּכּ֗וֹת וַ/אדֹנִ֨/י יוֹאָ֜ב וְ/עַבְדֵ֤י אֲדֹנִ֨/י עַל פְּנֵ֤י הַ/שָּׂדֶה֙ חֹנִ֔ים וַ/אֲנִ֞י אָב֧וֹא אֶל בֵּיתִ֛/י לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׁכַּ֣ב עִם אִשְׁתִּ֑/י חַיֶּ֨/ךָ֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ אִֽם אֶעֱשֶׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/011.yaml
  text: Uriah said to David[a], “The ark, and Israel and Judah, are staying in shelters, and my lord Joab and the servants of my lord are camped in the open field. Shall I then go to my house to eat and to drink and to lie with my wife? As surely as you live, and as your soul lives[c][b], I will not do this thing.”
  footnotes:
  - marker: a
    text: Hebrew 'booths' or 'temporary shelters'; the term refers to makeshift dwellings used in the field.
    reason: lexical_alternative
  - marker: b
    text: Or 'Shall I go to my house...?' The Hebrew wording is a rhetorical question expressing Uriah's refusal.
    reason: alternative_reading
  - marker: c
    text: 'Hebrew oath formula: ''As you live, and as your soul lives, if I do this thing''—with ''if'' expressing a strong negative after the oath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리아가 다윗에게 말했습니다. 「그 궤와 이스라엘과 유다는 임시 거처에 머물러 있고[a], 내 주 요압과 내 주의 종들은 들판에 진을 치고 있습니다. 그런데 내가 어찌 내 집에 가서 먹고 마시고 내 아내와 함께 눕겠습니까?[b] 당신이 살아 계심과 당신의 목숨을 두고 맹세합니다. 나는 이런 일을 하지 않겠습니다.[c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 סֻכּוֹת는 전투 중에 사용하는 초막이나 그 밖의 임시 거처를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘내가 어찌 내 집에 가서 … 하겠습니까?’라는 수사적 질문으로 우리아의 거절을 표현합니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 맹세 공식은 직역하면 ‘당신이 살아 계심과 당신의 목숨이 살아 있음을 두고, 만일 내가 이 일을 한다면’입니다. 맹세 뒤의 ‘만일’은 강한 부정을 나타내므로, ‘나는 결코 이런 일을 하지 않겠습니다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  english_pob_choice: the ark
  chosen_korean: 언약궤
  alternatives_korean:
  - 궤
  - 그 궤
  lexicon: HALOT
  rationale: 이 절의 אַרוֹן은 성막/언약 맥락의 특정한 궤를 가리키므로, 한국어에서는 의미를 분명히 하는 ‘언약궤’가 가장 자연스럽습니다. 다만 영어 POB의 단순한 ‘the ark’보다 약간 해석적입니다.
- source_word: יֹשְׁבִים בַּסֻּכּוֹת
  english_pob_choice: are staying in shelters
  chosen_korean: 천막들에 머물고 있고
  alternatives_korean:
  - 초막들에 머물고 있고
  - 부스들에 거하고 있고
  lexicon: HALOT
  rationale: סֻכּוֹת는 임시 거처를 뜻하므로 ‘천막들’ 또는 ‘초막들’이 문맥상 자연스럽습니다. 전투 중 임시 숙영의 느낌을 살리기 위해 ‘머물고 있고’로 옮겼습니다.
- source_word: וְעַבְדֵי אֲדֹנִי
  english_pob_choice: the servants of my lord
  chosen_korean: 내 주의 종들은
  alternatives_korean:
  - 내 주의 부하들은
  - 내 주의 종자들은
  lexicon: HALOT
  rationale: עֶבֶד는 기본적으로 종이지만 여기서는 군사적 수행원도 포함할 수 있습니다. 영어 POB의 ‘servants’를 따라 직역적인 ‘종들’을 유지했습니다.
- source_word: עַל פְּנֵי הַשָּׂדֶה חֹנִים
  english_pob_choice: are camped in the open field
  chosen_korean: 들판 한가운데에 진을 치고 있습니다
  alternatives_korean:
  - 들판에 진을 치고 있습니다
  - 들판에 야영하고 있습니다
  lexicon: HALOT
  rationale: 문자적으로는 ‘밭/들의 פני 위에 진을 치다’로, 노출된 전장 상황을 강조합니다. ‘한가운데에’는 노출감과 현장감을 살리기 위한 자연스러운 한국어 표현입니다.
- source_word: וַאֲנִי אָבוֹא אֶל בֵּיתִי לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׁכַּב עִם אִשְׁתִּי
  english_pob_choice: Shall I then go to my house to eat and to drink and to lie with my wife?
  chosen_korean: 그런데 내가 어찌 내 집에 가서 먹고 마시고 내 아내와 함께 눕겠습니까?
  alternatives_korean:
  - 그런데 내가 어찌 내 집에 가서 먹고 마시고 내 아내와 동침하겠습니까?
  - 그런데 내가 내 집에 가서 먹고 마시고 내 아내와 함께 자겠습니까?
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문과 거절의 뉘앙스를 살리기 위해 ‘어찌’와 질문형을 유지했습니다. ‘눕다’는 성적 완곡어법을 비교적 절제되게 옮기면서도 지나치게 완화하지 않습니다.
- source_word: חַיֶּךָ וְחֵי נַפְשֶׁךָ
  english_pob_choice: As surely as you live, and as your soul lives
  chosen_korean: 당신의 삶을 두고, 당신의 목숨을 두고 맹세합니다
  alternatives_korean:
  - 당신이 사는 한, 당신의 영혼이 사는 한
  - 당신의 생명과 당신의 목숨을 두고 맹세합니다
  lexicon: HALOT
  rationale: 이중 맹세 공식은 한국어에서 자연스럽게 반복되도록 옮기는 것이 중요합니다. ‘נפשׁ’을 지나치게 영혼론적으로 만들지 않고, 맹세의 강도를 살리기 위해 ‘목숨’과 ‘삶’을 병행했습니다.
theological_decisions:
- issue: 수사적 질문의 기능
  chosen_reading: 질문형을 그대로 유지해 우리아의 거절과 도덕적 긴장을 드러냈습니다.
  alternative_readings:
  - 평서문으로 완화하여 ‘나는 내 집에 가서… 하지 않겠습니다’로 직설화
  - 의문문을 약화하여 설명문처럼 처리
  rationale: 히브리어는 단순 정보 전달이 아니라 상황 대비를 근거로 한 강한 거절의 수사적 질문입니다. 이를 질문형으로 유지해야 본문의 긴장과 우리아의 충절이 보존됩니다.
  doctrine_reference: 서사 본문 해석 원리
- issue: 맹세 공식의 반복
  chosen_reading: ‘삶/목숨’을 병렬로 두어 히브리어의 이중 맹세를 살렸습니다.
  alternative_readings:
  - ‘당신의 생명을 두고’로 단일화
  - ‘당신의 목숨을 두고, 당신의 생명을 두고’로 더 직역
  rationale: חַיֶּךָ וְחֵי נַפְשֶׁךָ는 단순 관용구가 아니라 강조된 맹세 공식입니다. 반복을 유지해야 우리아의 발화 강도가 약화되지 않습니다.
  doctrine_reference: 구약 서사체의 맹세 공식
