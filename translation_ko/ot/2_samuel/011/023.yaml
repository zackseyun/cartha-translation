id: 2SA.11.23
reference: 2 Samuel 11:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מַּלְאָךְ֙ אֶל דָּוִ֔ד כִּֽי גָבְר֤וּ עָלֵ֨י/נוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יֵּצְא֥וּ אֵלֵ֖י/נוּ הַ/שָּׂדֶ֑ה וַ/נִּהְיֶ֥ה עֲלֵי/הֶ֖ם עַד פֶּ֥תַח הַ/שָּֽׁעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/023.yaml
  text: The messenger said to David[a], “The men were stronger than we were, and they came out against us into the open field[b]; but we pressed them back as far as the entrance of the gate.”
  footnotes:
  - marker: a
    text: Or, 'The men prevailed against us.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'we were upon them,' an idiom meaning that David’s men pressed the enemy back or took the offensive against them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사자가 다윗에게 말했습니다. "그 사람들이 우리보다 우세하였고, 우리에게 맞서 들에까지 나왔습니다. 그러나 우리는 그들을 성문 어귀까지 밀어붙였습니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 사자’입니다. 여기서는 천사가 아니라 군사 소식을 전하는 전령입니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘우리가 그들 위에 있었다’는 뜻이지만, 히브리어 전투 관용구로서 ‘우리가 그들을 밀어붙였다’는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  english_pob_choice: the messenger
  chosen_korean: 그 사자
  alternatives_korean:
  - 그 전령
  - 그 메신저
  lexicon: HALOT
  rationale: 문맥상 천사가 아니라 전쟁 소식을 전하는 인간 전달자이므로, 고전적·서술적 뉘앙스를 살린 ‘사자’를 택했습니다.
- source_word: גָבְרוּ עָלֵינוּ
  english_pob_choice: were stronger than we were
  chosen_korean: 우리보다 우세하였고
  alternatives_korean:
  - 우리에게 이겼고
  - 우리보다 강하였고
  - 우리를 압도했고
  lexicon: HALOT
  rationale: גבר + עַל의 비교·우세 의미를 살려 단순한 힘의 크기보다 전투에서의 우세를 드러내는 표현으로 옮겼습니다.
- source_word: וַיֵּצְאוּ אֵלֵינוּ הַשָּׂדֶה
  english_pob_choice: they came out against us into the open field
  chosen_korean: 우리에게 맞서 들에까지 나왔습니다
  alternatives_korean:
  - 우리에게 나와 들에서 맞섰습니다
  - 들로 나와 우리를 공격했습니다
  lexicon: HALOT
  rationale: אֵלֵינוּ의 적대적 방향성을 ‘맞서’로 반영했고, הַשָּׂדֶה는 전장 맥락을 유지하면서도 자연스럽게 ‘들’로 옮겼습니다.
- source_word: וַנִּהְיֶה עֲלֵיהֶם
  english_pob_choice: we pressed them back
  chosen_korean: 우리는 그들을 … 밀어붙였습니다
  alternatives_korean:
  - 우리는 그들 위에 있었습니다
  - 우리는 그들을 몰아붙였습니다
  - 우리는 그들에 맞섰습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그들 위에 있었다’이지만, 이 관용구가 전투에서 밀어붙여 우세를 점하는 뜻이므로 한국어로는 그 의미를 드러냈습니다.
theological_decisions:
- issue: 군사적 관용구의 직역 여부
  chosen_reading: ‘we were upon them’의 관용적 의미를 살려 ‘그들을 밀어붙였습니다’로 번역했습니다.
  alternative_readings:
  - 그들 위에 있었습니다
  - 그들에 맞섰습니다
  rationale: 히브리어 관용구를 한국어 독자가 즉시 이해할 수 있도록 하되, 전투에서의 공세적 주도권이라는 원의미는 보존했습니다.
  doctrine_reference: 문헌학/서술 정확성
