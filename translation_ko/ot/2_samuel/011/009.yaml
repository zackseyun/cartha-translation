source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֣ב אוּרִיָּ֗ה פֶּ֚תַח בֵּ֣ית הַ/מֶּ֔לֶךְ אֵ֖ת כָּל עַבְדֵ֣י אֲדֹנָ֑י/ו וְ/לֹ֥א יָרַ֖ד אֶל בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/009.yaml
  text: But Uriah slept at the entrance of the king’s house with all the servants of his lord[d][c][b][a], and did not go down to his house.
  footnotes:
  - marker: a
    text: Or 'lay down' / 'spent the night.' The Hebrew verb can denote lying down or sleeping; here it refers to Uriah lodging there overnight.
    reason: lexical_alternative
  - marker: b
    text: Or 'the palace.' Literally, 'the king’s house.'
    reason: lexical_alternative
  - marker: c
    text: Or 'his master.' The Hebrew 'his lord' refers here to David, Uriah’s superior.
    reason: lexical_alternative
  - marker: d
    text: Or 'did not go home.' Literally, 'did not go down to his house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 우리야는 왕의 집 문간에서 그의 주인의 모든 종들과 함께 잠을 잤고, 자기 집으로 내려가지 않았습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누워 있었다’ 또는 ‘밤을 지냈다’. 히브리어 동사는 눕거나 잠자는 것을 뜻하며, 여기서는 그곳에서 하룻밤을 지낸 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕궁’. 직역하면 ‘왕의 집’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 주인’의 ‘주인’은 다윗을 가리킵니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘자기 집으로 돌아가지 않았습니다’. 직역하면 ‘자기 집으로 내려가지 않았습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 누워 있었고
  alternatives_korean:
  - 잤고
  - 잠자고 있었고
  - 잠들었고
  lexicon: HALOT
  rationale: 이 동사는 문맥상 ‘그곳에서 하룻밤을 보냈다’는 뜻을 담고 있어, 단순한 ‘잠들다’보다 체류 상태를 드러내는 ‘누워 있었다’가 더 원문에 가깝습니다.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  english_pob_choice: at the entrance of the king’s house
  chosen_korean: 왕의 집 문간에서
  alternatives_korean:
  - 왕궁 문 앞에서
  - 왕의 집 입구에서
  - 왕궁 입구에서
  lexicon: HALOT
  rationale: פֶּתַח은 ‘문, 입구, 문간’의 뜻이므로, 공간 관계를 자연스럽게 살리면서도 ‘왕의 집’이라는 직역 요소를 유지했습니다.
- source_word: עַבְדֵי אֲדֹנָיו
  english_pob_choice: the servants of his lord
  chosen_korean: 주인님의 모든 종들
  alternatives_korean:
  - 주님의 모든 종들
  - 그의 주인의 모든 종들
  - 그의 상관의 모든 종들
  lexicon: HALOT
  rationale: אֲדֹנָיו는 여기서 다윗을 가리키는 상위자 호칭이므로 신적 호칭과 구별되도록 ‘주인님’으로 옮겼고, עַבְדֵי는 이 문맥에서 신분 강조보다 소속된 수행원들을 가리켜 ‘종들’로 번역했습니다.
- source_word: וְלֹא יָרַד אֶל בֵּיתוֹ
  english_pob_choice: and did not go down to his house
  chosen_korean: 자기 집으로 내려가지 않았습니다
  alternatives_korean:
  - 자기 집에 내려가지 않았습니다
  - 집으로 돌아가지 않았습니다
  - 자기 집으로 가지 않았습니다
  lexicon: HALOT
  rationale: ירד의 직역인 ‘내려가다’를 살려 원문의 방향 감각을 보존했고, בַּיִת는 이 문맥에서 ‘집’으로 자연스럽게 옮겼습니다.
