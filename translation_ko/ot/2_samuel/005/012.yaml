translation:
  language: ko
  text: 다윗은 야훼께서 자신을 이스라엘의 왕으로 세우셨고, 또 자기 백성 이스라엘을 위하여 자기의 왕국을 높이셨다는 것을 알았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּדַע
  english_pob_choice: knew
  chosen_korean: 알았습니다
  alternatives_korean:
  - 알게 되었습니다
  - 깨달았습니다
  lexicon: HALOT
  rationale: 서술문에서 ‘knew’의 직접적 의미를 살리면서도 현대 한국어에서 자연스럽고 단정한 표현으로 옮겼습니다.
- source_word: הֱכִינוֹ יְהוָה לְמֶלֶךְ עַל יִשְׂרָאֵל
  english_pob_choice: Yahweh had established him as king over Israel
  chosen_korean: 야훼께서 자신을 이스라엘의 왕으로 세우셨고
  alternatives_korean:
  - 야훼께서 자신을 이스라엘의 왕으로 확립하셨고
  - 야훼께서 자신을 이스라엘의 왕으로 세우셨음을
  lexicon: HALOT
  rationale: כּוּן의 ‘세우다/확립하다’ 의미를 반영하되, 왕권 수여의 문맥에 맞게 ‘왕으로 세우셨고’로 자연스럽게 처리했습니다.
- source_word: נִשֵּׂא מַמְלַכְתּוֹ
  english_pob_choice: had exalted his kingdom
  chosen_korean: 자기의 왕국을 높이셨다는
  alternatives_korean:
  - 자기의 왕국을 들어 올리셨다는
  - 자기의 왕권을 높이셨다는
  lexicon: HALOT
  rationale: נשא의 ‘들어 올리다/높이다’ 이미지를 살리면서, 왕권의 고양을 한국어로 자연스럽게 표현했습니다.
- source_word: בַּעֲבוּר עַמּוֹ יִשְׂרָאֵל
  english_pob_choice: for the sake of his people Israel
  chosen_korean: 자기 백성 이스라엘을 위하여
  alternatives_korean:
  - 자기 백성 이스라엘을 위해
  - 자기 백성 이스라엘의 유익을 위해
  lexicon: HALOT
  rationale: בַּעֲבוּר의 목적·이익 지시를 ‘위하여’로 간결하게 살렸고, ‘자기 백성’은 POB의 문맥상 야훼를 가리키는 독법을 반영했습니다.
theological_decisions:
- issue: עַמּוֹ의 대명사 선행사
  chosen_reading: 대명사 ‘자기’는 야훼를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 대명사 ‘자기’가 다윗을 가리킨다고 볼 수도 있습니다.
  rationale: 문맥상 야훼가 다윗을 세우고 왕국을 높이시는 주어로 계속 전면에 있으므로, ‘자기 백성 이스라엘’은 언약 백성에 대한 하나님의 소유를 드러내는 표현으로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §3; covenant people motif
