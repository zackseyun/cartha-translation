  text: And David took more concubines and wives in Jerusalem after he came from Hebron[a], and more sons and daughters were born to David.
  footnotes:
  - marker: a
    text: Or 'in Jerusalem.' The Hebrew literally says 'from Jerusalem,' which may indicate the place from which David took them after relocating there.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 헤브론에서 온 뒤 예루살렘에서[a] 첩들과 아내들을 더 취하였고, 다윗에게 아들들과 딸들이 더 태어났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘 안에서’. 히브리어는 문자적으로 ‘예루살렘에서/예루살렘으로부터’라고 되어 있으며, 다윗이 예루살렘으로 옮겨온 뒤 그곳에서 그들을 취했다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 취하였고
  alternatives_korean:
  - 데려갔고
  - 얻었고
  lexicon: HALOT
  rationale: 여기서는 여성들을 자기 집안에 들이는 행위를 가리키므로, 단순한 '받다'보다 관계 형성을 드러내는 '취하다'가 원문의 직접성을 비교적 잘 살립니다.
- source_word: פִּלַגְשִׁים וְנָשִׁים
  english_pob_choice: concubines and wives
  chosen_korean: 첩들과 아내들
  alternatives_korean:
  - 후궁들과 아내들
  - 첩들과 여자들
  lexicon: HALOT
  rationale: פִּלַגְשִׁים는 '첩들'이 표준적이고, וְנָשִׁים은 이 문맥에서 단순 '여자들'보다 '아내들'이 더 구체적이어서 두 범주를 구분해 옮겼습니다.
- source_word: מִירוּשָׁלִַם
  english_pob_choice: from Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘으로부터
  - 예루살렘 안에서
  lexicon: HALOT
  rationale: 전치사 מן을 표면적으로 따르면 '에서/부터'가 가능하며, POB의 주석처럼 이 표현은 그가 예루살렘으로 옮겨온 뒤 그곳에서 취했다는 의미 가능성을 열어 두므로 '예루살렘에서'로 유지했습니다.
- source_word: בָּנִים וּבָנוֹת
  english_pob_choice: sons and daughters
  chosen_korean: 아들들과 딸들이
  alternatives_korean:
  - 자녀들이
  - 아들딸이
  lexicon: HALOT
  rationale: 히브리어가 남녀를 각각 명시하므로, 일반화된 '자녀들'보다 '아들들과 딸들'이 원문의 구체성을 보존합니다.
