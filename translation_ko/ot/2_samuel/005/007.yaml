lexical_decisions:
- source_word: וַיִּלְכֹּד
  english_pob_choice: captured
  chosen_korean: 점령했습니다
  alternatives_korean:
  - 함락시켰습니다
  - 사로잡았습니다
  lexicon: HALOT
  rationale: 성읍이나 요새를 군사적으로 차지하는 의미를 자연스럽고 정확하게 살리기 위해 ‘점령했습니다’를 택했습니다.
- source_word: מְצֻדַת
  english_pob_choice: stronghold
  chosen_korean: 요새
  alternatives_korean:
  - 산성
  - 성채
  - 성루
  lexicon: HALOT
  rationale: 이 말은 ‘튼튼히 방비된 곳’이라는 뜻의 군사적 지형어이므로, ‘요새’가 한국어로 가장 직접적이고 읽기 쉽습니다.
- source_word: הִיא
  english_pob_choice: that is
  chosen_korean: 곧
  alternatives_korean:
  - 즉
  - 바로
  lexicon: Hebrew grammar
  rationale: 앞의 명칭을 뒤의 설명과 동격으로 이어 주는 기능을 한국어의 설명적 접속어 ‘곧’으로 옮겼습니다.
- source_word: עִיר דָּוִד
  english_pob_choice: the City of David
  chosen_korean: 다윗성읍
  alternatives_korean:
  - 다윗의 성읍
  - 다윗의 도시
  lexicon: HALOT
  rationale: 고유한 지명 표현으로서의 성격을 살리되, 본문의 동격 설명을 자연스럽게 읽히게 하려고 간결한 ‘다윗성읍’을 사용했습니다.
theological_decisions:
- issue: 문장 시작의 וַ 의 접속 기능
  chosen_reading: ‘그러나’로 옮겨 앞문맥의 조롱과 대비되는 전개를 드러냈습니다.
  alternative_readings:
  - 그리고
  - 그때
  rationale: 직전의 자신만만한 조롱에도 불구하고 다윗이 실제로 점령했다는 대비가 문맥상 분명하므로, 단순한 나열보다 역접의 뉘앙스를 살렸습니다.
  doctrine_reference: 서사 문맥의 담화 기능 반영
