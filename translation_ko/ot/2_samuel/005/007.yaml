  chosen_korean: 요새
  alternatives_korean:
  - 산성
  - 성채
  - 성루
  lexicon: HALOT
  rationale: 이 말은 ‘튼튼히 방비된 곳’이라는 뜻의 군사적 지형어이므로, ‘요새’가 한국어로 가장 직접적이고 읽기 쉽습니다.
- source_word: הִיא
