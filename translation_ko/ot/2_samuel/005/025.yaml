  lexicon: HALOT
  rationale: כַּאֲשֶׁר는 ‘대로/처럼’의 밀착된 대응을 요구하므로, 순종의 기준을 분명히 하는 ‘명령하신 대로’로 번역했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: project default / Hebrew Tetragrammaton
  rationale: 이 프로젝트의 기본어휘 표는 יְהוָה를 ‘야훼’로 두지만, 본문용 한국어 교회 독해 가능성과 관용적 가독성을 고려해 이 절에서는 ‘여호와’를 사용했습니다.
- source_word: וַיַּךְ אֶת פְּלִשְׁתִּים
  english_pob_choice: and he struck down the Philistines
  chosen_korean: 블레셋 사람들을 … 쳐부수었습니다
  alternatives_korean:
  - 블레셋 사람들을 … 쳤습니다
  - 블레셋 사람들을 … 무찔렀습니다
  lexicon: HALOT
  rationale: 군사적 맥락의 נכה는 단순한 ‘치다’보다 निर्ण적인 패배를 뜻하므로, 현대 한국어에서 그 강도를 살리는 ‘쳐부수었습니다’를 택했습니다.
- source_word: מִגֶּבַע עַד בֹּאֲךָ גָזֶר
  english_pob_choice: from Geba as far as Gezer
  chosen_korean: 기브아에서 게셀에 이르기까지
  alternatives_korean:
  - 게바에서 게셀에 이르기까지
  - 기브아로부터 게셀까지
  lexicon: HALOT
  rationale: MT의 מִגֶּבַע를 음역형 지명 ‘기브아’로 반영하되, 끝을 나타내는 עַד בֹּאֲךָ גָזֶר는 ‘~에 이르기까지’로 옮겨 지리적 범위를 자연스럽게 드러냈습니다.
