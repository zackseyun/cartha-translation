  rationale: עשה + כן의 간결한 서술을 한국어에서도 자연스럽게 살리되, 본문의 순종 강조를 드러내기 위해 ‘그렇게 행하였고’로 옮겼습니다.
- source_word: כַּאֲשֶׁר צִוָּהוּ יְהוָה
  english_pob_choice: just as Yahweh had commanded him
  chosen_korean: 여호와께서 그에게 명령하신 대로
