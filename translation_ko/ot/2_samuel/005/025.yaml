translation:
  language: ko
  text: 다윗이 여호와께서 그에게 명령하신 대로 그렇게 행하였고, 블레셋 사람들을 기브아에서 게셀에 이르기까지 쳐부수었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘기브아에서’로 읽습니다. 평행본문 및 본문 비교로 달리 읽는 번역본들이 있습니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘네가 게셀에 오는 것까지’로, 게셀의 접근 지점을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
