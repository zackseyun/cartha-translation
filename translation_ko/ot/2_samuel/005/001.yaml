  text: Then all the tribes of Israel came to David at Hebron and said[a], “Look[b], we are your bone and your flesh.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''your bone and your flesh,'' a kinship idiom meaning close blood relation or shared family identity.'
    reason: cultural_note
  - marker: b
    text: Or 'to Hebron'; the Hebrew form of 'Hebron' includes a directional ending.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이스라엘의 모든 지파가 헤브론에[b] 있는 다윗에게 와서 말했습니다. 「보십시오, 우리는 당신의 뼈와 살입니다[a].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 관용구 ‘당신의 뼈와 살’은 가까운 혈연 관계 또는 공동의 가족 정체성을 뜻합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘헤브론으로’. 히브리어의 ‘헤브론’ 표기는 방향격 어미를 포함합니다.
    reason: lexical_alternative
