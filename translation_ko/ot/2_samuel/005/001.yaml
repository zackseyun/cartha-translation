  text: וַ/יָּבֹ֜אוּ כָּל שִׁבְטֵ֧י יִשְׂרָאֵ֛ל אֶל דָּוִ֖ד חֶבְר֑וֹנָ/ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר הִנְ/נ֛וּ עַצְמְ/ךָ֥ וּֽ/בְשָׂרְ/ךָ֖ אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/001.yaml
  text: Then all the tribes of Israel came to David at Hebron and said[a], “Look[b], we are your bone and your flesh.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''your bone and your flesh,'' a kinship idiom meaning close blood relation or shared family identity.'
    reason: cultural_note
  - marker: b
    text: Or 'to Hebron'; the Hebrew form of 'Hebron' includes a directional ending.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이스라엘의 모든 지파가 헤브론에 있는 다윗에게 와서 말했습니다[a]. 「보십시오[b], 우리는 당신의 뼈와 당신의 살입니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 관용구 ‘당신의 뼈와 당신의 살’은 가까운 혈연 관계 또는 공동의 가족 정체성을 뜻합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘헤브론에’; 히브리어의 ‘헤브론’ 표기는 방향격 어미를 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  english_pob_choice: Then ... came
  chosen_korean: 와서
  alternatives_korean:
  - 그리고 ... 왔습니다
  - 그때 ... 왔습니다
  lexicon: HALOT
  rationale: 와우-연속의 서술 진행을 자연스러운 한국어 문장 흐름으로 옮기되, 동작의 도착 의미를 유지했습니다.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: all the tribes of Israel
  chosen_korean: 이스라엘의 모든 지파
  alternatives_korean:
  - 이스라엘의 각 지파
  - 이스라엘의 온 지파들
  lexicon: HALOT
  rationale: 공동체 전체를 가리키는 집합적 표현이므로, 분배적 뉘앙스보다 전체성을 살린 표현을 택했습니다.
- source_word: חֶבְרֹנָה
  english_pob_choice: at Hebron
  chosen_korean: 헤브론에 있는
  alternatives_korean:
  - 헤브론으로
  - 헤브론에서
  lexicon: HALOT
  rationale: 히브리어의 방향격 어미는 도착 방향을 암시하지만, 한국어에서는 이미 동사 ‘와서’로 이동이 드러나므로 장소 표지로 자연스럽게 처리했습니다.
- source_word: הִנּוּ
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 주목하십시오
  lexicon: HALOT
  rationale: 주의를 끄는 감탄적 표지를 현대 한국어에서 공손하고도 자연스럽게 살렸습니다.
- source_word: עַצְמְךָ וּבְשָׂרְךָ
  english_pob_choice: your bone and your flesh
  chosen_korean: 당신의 뼈와 당신의 살
  alternatives_korean:
  - 당신의 골육
  - 당신의 뼈와 살
  lexicon: HALOT
  rationale: 친족·동일체성을 나타내는 히브리 관용구를 너무 풀이하지 않고 원문 어휘를 가깝게 보존했습니다. '골육'은 관용적이지만 표현이 전통적·축약적이어서 본문은 더 투명한 직역을 택했습니다.
theological_decisions:
- issue: 친족 관용구의 번역 강도
  chosen_reading: ‘당신의 뼈와 당신의 살’로 직역해, 다윗과 이스라엘 지파 사이의 혈연적·언약적 연대감을 드러냈습니다.
  alternative_readings:
  - 당신의 친족입니다
  - 우리는 당신의 백성입니다
  rationale: 이 표현은 단순한 정치 동맹이 아니라 공유된 혈연 정체성을 호소하는 말이므로, 의미를 약화시키는 의역보다 원문 이미지를 보존하는 편이 본문의 힘을 살립니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
