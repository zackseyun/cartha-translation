  - 블레셋인들이
  lexicon: HALOT
  rationale: 민족명은 현대 한국어 성경 문체에 맞게 ‘사람들’로 풀어 자연스럽게 처리했습니다.
- source_word: וַיִּנָּטְשׁוּ
  english_pob_choice: spread out
  chosen_korean: 퍼져 섰습니다
  alternatives_korean:
  - 펼쳐 섰습니다
  - 배치되었습니다
  - 널리 퍼졌습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 흩어짐보다 전장에 자리를 잡고 넓게 포진하는 뜻이므로, 군사적 위치 잡음을 드러내는 ‘퍼져 섰습니다’로 번역했습니다.
- source_word: בְּעֵמֶק רְפָאִים
  english_pob_choice: in the Valley of Rephaim
  chosen_korean: 르바임 골짜기에
  alternatives_korean:
  - 르바임 계곡에
  - 르바임 골짜기 안에
  lexicon: HALOT
  rationale: 고유 지명은 음역을 유지하고, עֵמֶק은 관용적으로 ‘골짜기’로 옮겼습니다. 대문자 지명 효과는 한국어에서 별도 표기가 필요하지 않습니다.
