lexical_decisions:
- source_word: וַיֹּסִפוּ עוֹד לַעֲלוֹת
  english_pob_choice: came up again
  chosen_korean: 다시 올라와서
  alternatives_korean:
  - 또 올라와서
  - 계속 올라와서
  lexicon: HALOT
  rationale: וַיֹּסִפוּ עוֹד는 반복된 행동을 나타내므로 ‘다시’로 살렸고, לַעֲלוֹת의 이동 이미지는 군사 서술에 자연스러운 ‘올라와서’로 옮겼습니다.
- source_word: פְּלִשְׁתִּים
