  text: וִ֠/יהִי ב/שמע/ך אֶת ק֧וֹל צְעָדָ֛ה בְּ/רָאשֵׁ֥י הַ/בְּכָאִ֖ים אָ֣ז תֶּחֱרָ֑ץ כִּ֣י אָ֗ז יָצָ֤א יְהוָה֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת בְּ/מַחֲנֵ֥ה פְלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/024.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then act decisively, for then Yahweh has gone out before you to strike down the camp of the Philistines.
  footnotes:
  - marker: a
    text: Or 'in the tops of the baca trees'; the exact species named by the Hebrew is uncertain. Older English versions often read 'mulberry trees.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네가 보리나무들의 꼭대기에서 행진하는 소리를 들을 때, 그때 단호히 행동하십시오. 야훼께서 이미 당신보다 앞서 나가 블레셋 사람들의 진영을 치셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 수종 이름은 정확한 식별이 불확실합니다. 오래된 영어 번역들은 ‘뽕나무들’로 읽기도 했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׁמְעֲךָ
  english_pob_choice: when you hear
  chosen_korean: 네가 … 들을 때
  alternatives_korean:
  - 들을 때
  - 네가 들으면
  lexicon: HALOT
  rationale: 히브리어 부정사구문을 한국어의 시간절로 자연스럽게 옮겼습니다. 예언적 지시 문맥에서 조건적 뉘앙스보다 ‘…할 때’가 더 정확합니다.
- source_word: קוֹל צְעָדָה
  english_pob_choice: the sound of marching
  chosen_korean: 행진하는 소리
  alternatives_korean:
  - 발걸음 소리
  - 행군하는 소리
  lexicon: HALOT
  rationale: 군사적 상황에서 צְעָדָה는 단순한 ‘걸음’보다 조직된 이동의 소리를 가리키므로 ‘행진하는 소리’가 의미를 잘 드러냅니다.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  english_pob_choice: in the tops of the balsam trees
  chosen_korean: 보리나무들의 꼭대기에서
  alternatives_korean:
  - 바카나무들의 꼭대기에서
  - 발삼나무들의 꼭대기에서
  lexicon: HALOT
  rationale: 히브리어의 수종은 확정하기 어려워 한국어 본문에서는 식물명을 과도하게 특정하지 않고 자연스러운 통용 표현으로 옮겼습니다. 다만 본문 의미를 위해 ‘꼭대기에서’는 유지했습니다.
- source_word: תֶּחֱרָץ
  english_pob_choice: act decisively
  chosen_korean: 단호히 행동하십시오
  alternatives_korean:
  - 재빨리 움직이십시오
  - 즉시 움직이십시오
  - 힘껏 나아가십시오
  lexicon: HALOT
  rationale: 이 동사는 단순한 속도가 아니라 신호에 따른 결단 있는 행동을 뜻하므로, 명령형으로 그 긴박성과 결단성을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 본 번역 프로젝트의 기본 규범에 따라 신명사표기를 ‘야훼’로 옮겼습니다.
- source_word: מַחֲנֵה פְלִשְׁתִּים
  english_pob_choice: the camp of the Philistines
  chosen_korean: 블레셋 사람들의 진영
  alternatives_korean:
  - 블레셋 진영
  - 블레셋 군대의 진영
  lexicon: HALOT
  rationale: מַחֲנֶה는 문자적으로 ‘진영’이므로 이를 유지하되, 한국어에서 소속을 분명히 하기 위해 ‘블레셋 사람들’로 풀었습니다.
theological_decisions:
- issue: 하나님의 선행하심과 전쟁 언어의 표현
  chosen_reading: ‘야훼께서 이미 당신보다 앞서 나가 … 치셨습니다’로 옮겨, 선행하시는 하나님과 완료된 신적 행위를 드러냈습니다.
  alternative_readings:
  - ‘야훼께서 당신보다 앞서 가실 것입니다’
  - ‘야훼께서 앞서 나가 … 치실 것입니다’
  rationale: 히브리어 완료형은 여기서 이미 시작된 야훼의 행동을 보여 주므로, 현재적 결과를 살리는 현재완료적 표현이 문맥에 더 적절합니다.
  doctrine_reference: 신적 선행, 전쟁 승리의 주권성
