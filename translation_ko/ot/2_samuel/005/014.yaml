base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/014.yaml
  text: 'These are the names of those born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
  footnotes:
  - marker: a
    text: Or 'the children born to him in Jerusalem.' The Hebrew participle literally means 'the ones born.'
    reason: lexical_alternative
translation:
  language: ko
  text: '이것은 예루살렘에서 그에게서 태어난 사람들의 이름입니다: 삼무아, 쇼바브, 나단, 솔로몬입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사 הַיִּלֹּדִים는 문자적으로 ‘태어난 자들/것들’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이것은
  alternatives_korean:
  - 그리고 이것은
  - 이들은
  lexicon: HALOT
  rationale: 목록을 여는 지시어로서 자연스러운 현대 한국어는 ‘이것은’이며, 열거를 예고하는 제시 기능을 살립니다.
- source_word: שְׁמוֹת
  english_pob_choice: the names
  chosen_korean: 이름들
  alternatives_korean:
  - 이름
  - 명단
  lexicon: HALOT
  rationale: 복수 명사로서 뒤의 목록 전체를 가리키므로 ‘이름들’이 직접적입니다.
- source_word: הַיִּלֹּדִים
  english_pob_choice: those born
  chosen_korean: 태어난 사람들
  alternatives_korean:
  - 태어난 이들
  - 태어난 자들
  - 출생한 사람들
  lexicon: HALOT
  rationale: 히브리어 분사 ילד는 문자적으로 ‘태어난 자들/것들’의 뜻이어서, 한국어에서는 생경한 직역보다 문맥상 자연한 ‘태어난 사람들’로 옮겼습니다.
- source_word: לוֹ
  english_pob_choice: to him
  chosen_korean: 그에게서
  alternatives_korean:
  - 그에게
  - 그의
  lexicon: HALOT
  rationale: 출생 관계를 한국어로 분명히 하기 위해 단순한 방향의 ‘~에게’보다 부모 관계를 드러내는 ‘~에게서’를 택했습니다.
