  yaml_path: translation/ot/2_samuel/005/023.yaml
  text: So David inquired of Yahweh[a], and he said, “You shall not go up; circle around behind them, and come against them opposite the balsam trees.”
  footnotes:
  - marker: a
    text: Or “the baca trees”; traditionally “the mulberry trees.” The exact species denoted by the Hebrew is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 다윗이 야훼께 물었고, 그분이 말씀하셨습니다. “올라가지 마라. 그들 뒤로 돌아가서, 그 맞은편의 바카 나무들 앞에서 그들을 치러 가라.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「바카 나무들」로 볼 수 있으며, 전통적으로는 「뽕나무들」로 옮기기도 합니다. 히브리어가 가리키는 정확한 식물은 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  english_pob_choice: inquired
  chosen_korean: 물었고
  alternatives_korean:
  - 문의했고
  - 여쭈었고
  - 구했고
  lexicon: HALOT
  rationale: 여기서는 단순 질문이 아니라 야훼의 지시를 구하는 행위이므로, 현대 한국어에서 자연스럽고 간결한 「물었고」로 옮겼습니다.
- source_word: בַּיהוָה
  english_pob_choice: of Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: WLC
  rationale: 본문의 고유명은 YHWH이므로, 프로젝트 기본값에 따라 「야훼」를 유지해 언약 이름을 드러냈습니다.
- source_word: הָסֵב
  english_pob_choice: circle around
  chosen_korean: 돌아가서
  alternatives_korean:
  - 둘러가서
  - 우회하여
  - 빙 돌아
  lexicon: HALOT
  rationale: 군사적 동선 변경을 나타내는 명령으로 이해하여, 직역적 「둘러가서」보다 한국어 동작 지시로 자연한 「돌아가서」를 택했습니다.
- source_word: בְּכָאִים
  english_pob_choice: the balsam trees
  chosen_korean: 바카 나무들
  alternatives_korean:
  - 발삼 나무들
  - 뽕나무들
  - 무화과나무들
  lexicon: HALOT
  rationale: 히브리어 식물명은 확정되지 않으므로, 영어 주석의 불확실성을 반영해 음역형 「바카 나무들」로 두어 독자가 원어의 모호성을 보게 했습니다.
theological_decisions:
- issue: 야훼의 직접 화법에서 명령형의 어조
  chosen_reading: 「올라가지 마라」처럼 직접적 금지와 군사 지시를 살려, 다윗에게 주어지는 실제 전술 명령으로 읽게 했습니다.
  alternative_readings:
  - 「올라가지 마십시오」
  - 「올라가서는 안 된다」
  rationale: 히브리어 금지형 לֹא תַעֲלֶה는 단순 조언이 아니라 야훼의 분명한 금지이므로, 명령성을 약화시키지 않되 한국어 구어적 명령문으로 자연화했습니다.
  doctrine_reference: Direct divine speech and imperative force in narrative guidance
