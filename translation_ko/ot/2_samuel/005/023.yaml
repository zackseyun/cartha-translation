  text: So David inquired of Yahweh[a], and he said, “You shall not go up; circle around behind them, and come against them opposite the balsam trees.”
  footnotes:
  - marker: a
    text: Or “the baca trees”; traditionally “the mulberry trees.” The exact species denoted by the Hebrew is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 다윗이 야훼께 여쭈었고, 그분이 말씀하셨습니다. “올라가지 마십시오. 그들 뒤로 돌아가서, 바카 나무들 맞은편에서 그들에게 맞서 나아가십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「발삼 나무들」. 전통적으로는 「뽕나무들」로 옮기기도 합니다. 히브리어가 가리키는 정확한 식물은 확실하지 않습니다.
    reason: lexical_alternative
