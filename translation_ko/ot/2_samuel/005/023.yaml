  to: 그래서 다윗이 야훼께 여쭈었고, 그분이 말씀하셨습니다. “올라가지 마십시오. 그들 뒤로 돌아가서, 바카 나무들 맞은편에서 그들에게 맞서 나아가십시오.”[a]
