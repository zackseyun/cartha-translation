  alternative_readings:
  - 진형을 갖추었습니다
  - 전개되었습니다
  rationale: 본문은 신학적 해설보다 전개된 군사 행동을 간명하게 기록하므로, 독자가 장면을 즉시 이해할 수 있는 서술을 우선했습니다.
  doctrine_reference: 서사 본문 번역 원칙
