lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  english_pob_choice: And the Philistines
  chosen_korean: 블레셋 사람들이
  alternatives_korean:
  - 그리고 블레셋 사람들이
  - 블레셋 사람들은
  lexicon: HALOT
  rationale: 서사 흐름의 연결은 한국어에서 자연스럽게 생략할 수 있고, פְלִשְׁתִּים은 표준적인 민족명인 ‘블레셋 사람들’로 옮기는 것이 적절합니다.
- source_word: בָּאוּ
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 왔습니다
  - 도착했습니다
  lexicon: HALOT
  rationale: 군사적 서술에서 동작의 연속을 살리기 위해 ‘와서’로 연결해 자연스러운 현대 한국어 서술을 만들었습니다.
- source_word: וַ/יִּנָּטְשׁוּ
  english_pob_choice: spread out
  chosen_korean: 퍼져 있었습니다
  alternatives_korean:
  - 펼쳐졌습니다
  - 전개되었습니다
  - 배치되었습니다
  lexicon: HALOT
  rationale: 이 동사는 여기서 군사적 위치 확장을 가리키므로, 단순한 이동보다 진형을 넓게 펼친 상태를 드러내는 ‘퍼져 있었습니다’가 본문 의미를 잘 전달합니다.
- source_word: בְּ/עֵמֶק רְפָאִים
  english_pob_choice: in the Valley of Rephaim
  chosen_korean: 르바임 골짜기에
  alternatives_korean:
  - 르바임의 골짜기에
  - 르바임 계곡에
  lexicon: HALOT
  rationale: 지명은 관용적으로 ‘르바임 골짜기’로 음역해 원문 고유 지명을 보존했고, 현대 한국어에서는 ‘골짜기’가 ‘valley’의 자연스러운 대응입니다.
theological_decisions:
- issue: 전투 상황의 서술을 평이하게 옮길지 여부
  chosen_reading: 원문의 사실적 군사 서술을 유지하며, 과도한 해설 없이 배치 상태를 드러내는 표현을 택했습니다.
  alternative_readings:
  - 진형을 갖추었습니다
  - 전개되었습니다
  rationale: 본문은 신학적 해설보다 전개된 군사 행동을 간명하게 기록하므로, 독자가 장면을 즉시 이해할 수 있는 서술을 우선했습니다.
  doctrine_reference: 서사 본문 번역 원칙
