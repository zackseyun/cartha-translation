source:
  edition: WLC
  text: וַ֠/יִּשְׁלַח חִירָ֨ם מֶֽלֶךְ צֹ֥ר מַלְאָכִים֮ אֶל דָּוִד֒ וַ/עֲצֵ֣י אֲרָזִ֔ים וְ/חָרָשֵׁ֣י עֵ֔ץ וְ/חָֽרָשֵׁ֖י אֶ֣בֶן קִ֑יר וַ/יִּבְנֽוּ בַ֖יִת לְ/דָוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/011.yaml
  text: And Hiram king of Tyre sent messengers to David[a], and cedar logs, and craftsmen of wood, and craftsmen of stone walling[b]; and they built a house for David.
  footnotes:
  - marker: a
    text: Or 'masons' for 'craftsmen of stone walling.' The Hebrew phrase literally includes both 'stone' and 'wall.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a palace for David.' The Hebrew literally says 'a house,' which in a royal setting can refer to a palace.
    reason: lexical_alternative
translation:
  language: ko
  text: 두로 왕 히람이 다윗에게 사신들과 백향목, 나무를 다루는 장인들과 돌벽을 다루는 장인들을 보냈습니다[a]. 그들은 다윗을 위해 집을 지었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돌 벽을 다루는 장인들’로 옮길 수 있습니다. 히브리어는 ‘돌’과 ‘벽’을 함께 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘궁전’을 뜻할 수 있습니다. 히브리어는 문자적으로 ‘집’이라고 말하지만, 왕실 문맥에서는 궁전을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사신들
  alternatives_korean:
  - 전령들
  - 사절들
  lexicon: HALOT
  rationale: 외교적 맥락을 살리면서도 מַלְאָכִים의 기본적 의미인 ‘보냄을 받은 사람들’을 자연스럽게 옮겼습니다.
- source_word: וַעֲצֵי אֲרָזִים
  english_pob_choice: cedar logs
  chosen_korean: 백향목
  alternatives_korean:
  - 백향목 재목
  - 백향목 목재
  lexicon: HALOT
  rationale: 히브리어는 백향목 재료를 가리키며, 한국어에서는 재질을 간명하게 드러내는 ‘백향목’이 가장 자연스럽습니다.
- source_word: חָרָשֵׁי עֵץ
  english_pob_choice: craftsmen of wood
  chosen_korean: 나무를 다루는 장인들
  alternatives_korean:
  - 목수들
  - 목공 장인들
  lexicon: HALOT
  rationale: חָרָשׁ의 ‘기술자/장인’ 뉘앙스를 살리면서, 단순한 직업명인 ‘목수’보다 범위를 넓게 유지했습니다.
- source_word: חָרָשֵׁי אֶבֶן קִיר
  english_pob_choice: craftsmen of stone walling
  chosen_korean: 돌벽을 다루는 장인들
  alternatives_korean:
  - 석공들
  - 돌쌓기 장인들
  lexicon: HALOT
  rationale: אֶבֶן(돌)과 קִיר(벽)의 두 요소를 모두 드러내기 위해 직역에 가까운 표현을 택했습니다.
- source_word: בַיִת
  english_pob_choice: a house
  chosen_korean: 집
  alternatives_korean:
  - 궁전
  - 왕궁
  lexicon: HALOT
  rationale: 본문은 기본적으로 ‘집’이라고 말하며, 왕실 맥락에서 궁전일 수 있어도 그 뜻을 본문 밖에서 확정하지 않기 위해 기본어를 유지했습니다.
theological_decisions:
- issue: 왕실 문맥에서 בַיִת의 의미 범위
  chosen_reading: ‘집’으로 두고, 궁전 해석은 본문이 허용하는 범위 안에서만 열어 둡니다.
  alternative_readings:
  - 궁전
  - 왕궁
  rationale: 히브리어는 단지 ‘house’를 말하며, 왕실 상황이 궁전 가능성을 높이지만 더 강한 해석을 본문에 본문 자체보다 앞서 넣지 않았습니다.
  doctrine_reference: 본문 충실성과 과잉해석 방지
