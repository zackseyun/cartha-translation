  text: So David lived in the stronghold and called it the City of David[a]. And David built all around from the Millo inward.
  footnotes:
  - marker: a
    text: Or possibly, 'from the Millo and inward,' or 'from the Millo toward the interior.' 'The Millo' likely refers to a known structure or terraced fill in Jerusalem.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 요새에 살면서 그것을 다윗성이라고 불렀습니다. 다윗은 밀로에서부터 안쪽까지 사방으로 건축하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밀로’는 예루살렘의 알려진 구조물 또는 축조용 매립부를 가리키는 기술적·지형적 용어일 가능성이 있으며, 정확한 형태와 범위는 확정되지 않습니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: lived
  chosen_korean: 살면서
  alternatives_korean:
  - 거주하면서
  - 거하였고
  lexicon: HALOT
  rationale: וישב는 ‘앉다’에서 확장되어 ‘살다/거주하다’의 뜻을 가지므로, 서술 흐름에 자연스러운 ‘살면서’로 옮겼습니다.
- source_word: בַּמְּצֻדָה
  english_pob_choice: in the stronghold
  chosen_korean: 요새에
  alternatives_korean:
  - 성채에
  - 산성에
  lexicon: HALOT
  rationale: מְצֻדָה는 방어용으로 견고한 장소를 가리키므로, 군사적 뉘앙스를 살린 ‘요새’가 적절합니다.
- source_word: עִיר דָּוִד
  english_pob_choice: the City of David
  chosen_korean: 다윗성
  alternatives_korean:
  - 다윗의 성
  - 다윗의 도시
  lexicon: HALOT
  rationale: 고유 지명으로 굳어진 표현이므로, 한국어 성경에서 널리 인식되는 ‘다윗성’을 사용했습니다.
- source_word: מִן הַמִּלּוֹא וָבָיְתָה
  english_pob_choice: from the Millo inward
  chosen_korean: 밀로에서부터 안쪽까지
  alternatives_korean:
  - 밀로에서 안쪽으로
  - 밀로에서부터 내부로
  lexicon: HALOT
  rationale: מִן과 방향형 וָבָיְתָה가 함께 거리/방향의 시작점과 진행 방향을 나타내므로, 본문이 암시하는 공간적 범위를 드러내는 ‘에서부터 안쪽까지’로 옮겼습니다.
