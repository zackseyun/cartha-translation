  yaml_path: translation/ot/2_samuel/005/009.yaml
  text: So David lived in the stronghold and called it the City of David[a]. And David built all around from the Millo inward.
  footnotes:
  - marker: a
    text: Or possibly, 'from the Millo and inward,' or 'from the Millo toward the interior.' 'The Millo' likely refers to a known structure or terraced fill in Jerusalem.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 요새에 살았고, 그곳을 다윗성이라 불렀습니다. 다윗은 밀로에서 안쪽으로 두루 건축하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밀로’는 예루살렘에 있던 알려진 구조물이나 축조용 매립부를 가리키는 지명 또는 기술적·지형적 용어일 가능성이 있습니다. 정확한 지시 대상은 확정되지 않았습니다. ‘밀로에서 안쪽으로’는 ‘밀로에서부터 안쪽으로’ 또는 ‘밀로에서 내부를 향하여’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
