base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/002.yaml
  text: Also previously[a], when Saul was king over us, you were the one who led Israel out and brought them in. And Yahweh said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over Israel.’
  footnotes:
  - marker: a
    text: Hebrew literally, 'both yesterday and the day before'; an idiom meaning 'formerly' or 'for some time already.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you brought Israel out and brought them in,' a Hebrew idiom for leading the people in their affairs, especially in battle.
    reason: lexical_alternative
  - marker: c
    text: Or 'leader' or 'prince' for 'ruler'; the Hebrew term differs from the usual word for 'king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이미 전부터[a], 사울이 우리의 왕이었을 때에도, 당신께서는 이스라엘을 이끌고 나가며 들여보내신 분이셨습니다.[b] 야훼께서 당신에게 말씀하셨습니다. “당신은 내 백성 이스라엘을 목양할 것이며, 이스라엘의 지도자가 될 것입니다.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘어제도 그저께도’이며, ‘이전부터’ 또는 ‘이미 오래전부터’라는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이스라엘을 내보내고 들여오다’입니다. 특히 전쟁과 공동체의 일에서 백성을 인도한다는 뜻의 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘통치자’ 또는 ‘영도자’로 옮길 수 있습니다. 히브리어는 보통 ‘왕’을 뜻하는 말과 다른 단어를 사용합니다.
    reason: lexical_alternative
