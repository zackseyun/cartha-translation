  lexicon: project default
  rationale: 프로젝트 기본어휘에 따라 신적 이름은 '야훼'로 옮기되, 본문 내부의 언급을 명시적으로 보존했습니다.
theological_decisions:
- issue: 다윗의 왕권을 설명하는 왕-목자 은유
  chosen_reading: “당신은 내 백성 이스라엘을 목양할 것이며”
  alternative_readings:
  - “당신은 내 백성 이스라엘을 다스릴 것이며”
  - “당신은 내 백성 이스라엘을 돌볼 것이며”
  rationale: 히브리어 רעה는 단순한 행정 통치보다 하나님의 백성을 목자처럼 돌보는 왕권의 신학적 이미지를 드러내므로, 은유를 유지하는 것이 본문의 힘을 살립니다.
