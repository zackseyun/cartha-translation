base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/002.yaml
  text: Also previously[a], when Saul was king over us, you were the one who led Israel out and brought them in. And Yahweh said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over Israel.’
  footnotes:
  - marker: a
    text: Hebrew literally, 'both yesterday and the day before'; an idiom meaning 'formerly' or 'for some time already.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you brought Israel out and brought them in,' a Hebrew idiom for leading the people in their affairs, especially in battle.
    reason: lexical_alternative
  - marker: c
    text: Or 'leader' or 'prince' for 'ruler'; the Hebrew term differs from the usual word for 'king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 전에, 사울이 우리의 왕이었을 때에도, 당신은 이스라엘을 이끌고 나가고 들여보낸 분이었습니다. 야훼께서 당신에게 말씀하시기를, “당신은 내 백성 이스라엘을 목양할 것이며, 당신은 이스라엘의 지도자가 될 것이다” 하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘어제와 그저께’로, ‘이전부터’ 또는 ‘오래전부터’라는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘을 이끌고 나가고 들여보냈다’로도 옮길 수 있으며, 특히 전쟁과 공동체의 일에서 백성을 인도한다는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘지도자’나 ‘영도자’로도 옮길 수 있으며, 히브리어는 보통 ‘왕’을 뜻하는 말과는 다른 단어를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֶתְמוֹל גַּם שִׁלְשׁוֹם
  english_pob_choice: Also previously
  chosen_korean: 또 전에
  alternatives_korean:
  - 어제도 그저께도
  - 옛날에도 이미
  - 이미 오래전부터
  lexicon: HALOT
  rationale: 직역식 관용구를 한국어로 그대로 풀기보다, '이미 이전부터'라는 시간적 함의를 자연스럽게 살려 간결하게 옮겼습니다.
- source_word: מוציא וְהַמֵּבִיא
  english_pob_choice: led Israel out and brought them in
  chosen_korean: 이스라엘을 이끌고 나가고 들여보낸
  alternatives_korean:
  - 이스라엘을 내보내고 들여보낸
  - 이스라엘을 내보내고 들여온
  - 이스라엘을 인도하여 나가게 하고 들어오게 한
  lexicon: HALOT
  rationale: 공동체를 전쟁과 일상에서 인도하는 관용구를 살리기 위해, 단순한 행정적 '다스리다'보다 '이끌고 나가고 들여보내다'를 택했습니다.
- source_word: תִרְעֶה
  english_pob_choice: You shall shepherd
  chosen_korean: 목양할 것이며
  alternatives_korean:
  - 목자처럼 돌볼 것이며
  - 양 떼를 치실 것이며
  - 다스릴 것이며
  lexicon: HALOT
  rationale: 왕권을 목자 돌봄의 이미지로 표현하는 히브리어 은유를 보존했습니다. 한국어에서는 동사형 '목양하다'가 가장 압축적으로 그 상을 전달합니다.
- source_word: נָגִיד
  english_pob_choice: ruler
  chosen_korean: 지도자
  alternatives_korean:
  - 통치자
  - 영도자
  - 왕자
  lexicon: HALOT
  rationale: 이 단어는 일반적인 '왕'과 구별되는 임명된 수장이라는 뉘앙스가 있어, 현대 한국어에서는 위계적 오해가 적은 '지도자'로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  - 하나님
  lexicon: project default
  rationale: 프로젝트 기본어휘에 따라 신적 이름은 '야훼'로 옮기되, 본문 내부의 언급을 명시적으로 보존했습니다.
theological_decisions:
- issue: 다윗의 왕권을 설명하는 왕-목자 은유
  chosen_reading: “당신은 내 백성 이스라엘을 목양할 것이며”
  alternative_readings:
  - “당신은 내 백성 이스라엘을 다스릴 것이며”
  - “당신은 내 백성 이스라엘을 돌볼 것이며”
  rationale: 히브리어 רעה는 단순한 행정 통치보다 하나님의 백성을 목자처럼 돌보는 왕권의 신학적 이미지를 드러내므로, 은유를 유지하는 것이 본문의 힘을 살립니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §6
