lexical_decisions:
- source_word: וַיֵּלֶךְ ... הָלוֹךְ וְגָדוֹל
  english_pob_choice: went on, growing greater
  chosen_korean: “점점 더 크게 되었고”
  alternatives_korean:
  - “계속 나아갔고, 점점 더 커졌고”
  - “더더욱 번성해 갔고”
  lexicon: HALOT
  rationale: 히브리어의 동사+부정사절대구가 지속적 증가를 강조하므로, 한국어에서는 자연스럽게 진행성과 증대성을 함께 살리는 표현을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
