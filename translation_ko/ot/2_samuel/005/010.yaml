  - 주님
  lexicon: HALOT
  rationale: 원문에 있는 여호와 이름을 칭호로 바꾸지 않고, 프로젝트 기본값에 따라 음역 ‘야훼’로 옮겼습니다.
- source_word: אֱלֹהֵי צְבָאוֹת
  english_pob_choice: the God of hosts
  chosen_korean: 만군의 하나님
  alternatives_korean:
  - 군대의 하나님
  - 하늘 군대의 하나님
  lexicon: HALOT
  rationale: צְבָאוֹת의 기본 의미를 살리되 한국어 성경에서 널리 인식되는 ‘만군의 하나님’을 사용해 의미와 가독성을 함께 유지했습니다.
- source_word: עִמּוֹ
  english_pob_choice: was with him
  chosen_korean: 그와 함께 계셨습니다
  alternatives_korean:
  - 그와 함께 있었습니다
  - 그와 동행하셨습니다
  lexicon: HALOT
  rationale: 하나님의 임재를 나타내는 문맥이므로 단순한 존재보다 ‘함께 계시다’가 더 직접적이고 한국어 성경 문체에도 자연스럽습니다.
theological_decisions:
- issue: 야훼 이름의 직접 표기
  chosen_reading: ‘야훼’로 직접 표기합니다.
  alternative_readings:
