  - ‘여호와’로 표기
  rationale: 본문이 신성칭호가 아니라 여호와 이름 자체를 사용하므로, 제목으로 바꾸지 않고 이름의 식별성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
