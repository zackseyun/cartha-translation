source:
  edition: WLC
  text: וַ/יַּעַזְבוּ שָׁ֖ם אֶת עֲצַבֵּי/הֶ֑ם וַ/יִּשָּׂאֵ֥/ם דָּוִ֖ד וַ/אֲנָשָֽׁי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/021.yaml
  text: And they left their idols there[b][a], and David and his men carried them away.
  footnotes:
  - marker: a
    text: 1 Chronicles 14:12 adds that David gave orders and the idols were burned. Here the Hebrew of Samuel says only that David and his men carried them away.
    reason: cross_reference
  - marker: b
    text: Or 'their images.' The Hebrew term refers to cult images; 'idols' makes the sense explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그곳에 우상들을[b] 두고 떠났습니다. 다윗과 그의 사람들이 그것들을 가져갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 역대상 14:12는 다윗이 명령하여 그 우상들을 불태웠다고 덧붙입니다. 그러나 사무엘서는 여기서 다윗과 그의 사람들이 그것들을 가져갔다고만 말합니다.
    reason: cross_reference
  - marker: b
    text: 또는 '그들의 형상들'로 옮길 수 있습니다. 히브리어는 제의적 형상을 가리키므로, 여기서는 그 종교적 의미가 분명한 '우상들'을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  english_pob_choice: they left
  chosen_korean: 두고 떠났습니다
  alternatives_korean:
  - 떠났습니다
  - 버려 두었습니다
  lexicon: HALOT
  rationale: עָזַב의 기본 의미를 살리면서, 전리품처럼 현장을 버리고 떠난 뉘앙스를 자연스럽게 드러냅니다.
- source_word: עֲצַבֵּיהֶם
  english_pob_choice: their idols
  chosen_korean: 그들의 우상들
  alternatives_korean:
  - 그들의 형상들
  - 그들의 우상
  lexicon: HALOT
  rationale: 문맥상 가나안/블레셋의 제의적 물체를 가리키므로, 한국어에서도 그 종교적 함의를 분명히 하는 '우상'이 적합합니다.
- source_word: וַיִּשָּׂאֵם
  english_pob_choice: carried them away
  chosen_korean: 그것들을 가져갔습니다
  alternatives_korean:
  - 그것들을 옮겼습니다
  - 그것들을 실어 갔습니다
  lexicon: HALOT
  rationale: נָשָׂא의 물리적 이동 의미를 살리되, 한국어에서 자연스럽고 과잉 해석이 없는 표현으로 옮겼습니다.
- source_word: דָּוִד וַאֲנָשָׁיו
  english_pob_choice: David and his men
  chosen_korean: 다윗과 그의 사람들
  alternatives_korean:
  - 다윗과 그의 부하들
  - 다윗과 그의 병사들
  lexicon: HALOT
  rationale: 아내나 가족이 아니라 수행/전투 집단을 뜻하는 'אנשׁיו'의 넓은 의미를 살려, 직역에 가깝게 '사람들'로 옮겼습니다.
theological_decisions:
- issue: 사무엘서 본문과 역대기 평행본문의 차이(가져감 vs. 불태움)를 어떻게 처리할지
  chosen_reading: 사무엘서는 본문대로 '가져갔습니다'로 번역하고, 역대기의 불태움 정보는 본문에 합치지 않았습니다.
  alternative_readings:
  - '''가져가 불태웠습니다''처럼 조화시키는 번역'
  - '''가져갔습니다'' 대신 ''치웠습니다''처럼 모호화하는 번역'
  rationale: 원문 우선 원칙에 따라 사무엘서 히브리어가 말하는 범위를 넘지 않도록 했습니다. 본문 간 긴장은 번역이 아니라 주석 영역에서 다루어야 합니다.
  doctrine_reference: Translation philosophy §1, §3
