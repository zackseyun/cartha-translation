source:
  edition: WLC
  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּי מָשְׁח֨וּ אֶת דָּוִ֤ד לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל וַ/יַּעֲל֥וּ כָל פְּלִשְׁתִּ֖ים לְ/בַקֵּ֣שׁ אֶת דָּוִ֑ד וַ/יִּשְׁמַ֣ע דָּוִ֔ד וַ/יֵּ֖רֶד אֶל הַ/מְּצוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/017.yaml
  text: When the Philistines heard that they had anointed David king over Israel[a], all the Philistines went up to seek David. When David heard of it, he went down to the stronghold.
  footnotes:
  - marker: a
    text: Or 'the fortress.' The Hebrew term denotes a fortified stronghold.
    reason: lexical_alternative
translation:
  language: ko
  text: 블레셋 사람들이 다윗이 이스라엘의 왕으로 기름부음을 받았다는 소식을 듣고, 블레셋 사람 모두가 다윗을 찾으러 올라왔습니다. 다윗이 그것을 듣고 강한 요새로 내려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요새’. 히브리어 용어는 성채화된 방어 거점을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  english_pob_choice: Philistines
  chosen_korean: 블레셋 사람들
  alternatives_korean:
  - 블레셋인들
  - 블레셋 사람들 전체
  lexicon: HALOT
  rationale: 민족명은 한국어 성경에서 널리 통용되는 ‘블레셋’ 계열로 옮기되, 복수 집합을 분명히 하기 위해 ‘사람들’로 풀었습니다.
- source_word: מָשְׁחוּ אֶת דָּוִד לְמֶלֶךְ
  english_pob_choice: they had anointed David king
  chosen_korean: 다윗이 … 왕으로 기름부음을 받았다는
  alternatives_korean:
  - 다윗에게 왕의 기름을 부었다는
  - 다윗을 왕으로 세웠다는
  lexicon: HALOT
  rationale: ‘기름부음’이라는 동작을 유지하면서, 결과 상태를 자연스럽게 드러내기 위해 관형화된 인용절로 옮겼습니다.
- source_word: לְבַקֵּשׁ אֶת דָּוִד
  english_pob_choice: to seek David
  chosen_korean: 다윗을 찾으러
  alternatives_korean:
  - 다윗을 찾기 위해
  - 다윗을 구하러
  lexicon: HALOT
  rationale: בקש의 기본 의미를 살려 ‘찾다’로 옮기되, 적대적 추격의 긴장을 과도하게 특정하지 않도록 했습니다.
- source_word: הַמְּצוּדָה
  english_pob_choice: the stronghold
  chosen_korean: 강한 요새
  alternatives_korean:
  - 요새
  - 강한 성채
  lexicon: HALOT
  rationale: 영어 POB의 각주가 이 단어의 요새/성채 의미를 드러내므로, 문맥의 방어적 이미지를 살려 ‘강한 요새’로 옮겼습니다.
theological_decisions:
- issue: ‘anointed David king over Israel’의 서술 방식
  chosen_reading: 왕의 즉위 사실을 보고하는 역사 서술로 처리했습니다.
  alternative_readings:
  - 하나님의 기름부으심의 신학적 강조를 전면화하는 번역
  - 왕권 찬가처럼 장엄하게 옮기는 번역
  rationale: 본문은 왕권의 정당성보다 블레셋의 반응과 다윗의 이동을 진술하는 문맥이므로, 서술의 정보성을 우선해 과장하지 않았습니다.
  doctrine_reference: 사무엘서의 왕권 서술과 내러티브 문맥
