base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/008.yaml
  text: And David said on that day[a], “Whoever strikes the Jebusites and reaches the water shaft, and the lame and the blind, whom David’s soul hates.” Therefore they say[c][b], “The blind and the lame shall not come into the house.”
  footnotes:
  - marker: a
    text: Or 'the conduit,' 'the gutter,' or 'the tunnel'; the Hebrew term likely refers to a water system or shaft, but its precise sense is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew syntax in this clause is difficult. Some understand the words 'the lame and the blind' as part of the Jebusites' taunt from the previous verse, rather than as the direct object of David's challenge.
    reason: alternative_reading
  - marker: c
    text: Or 'shall not enter the palace'; 'house' may refer to the royal residence in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 다윗이 말했습니다. “누구든지 여부스 사람들을 치고 물길[a]에 이르며, 다윗이 미워하는 다리 저는 사람들과 눈먼 사람들을 치는 자는….”[b] 그러므로 사람들이 말합니다. “눈먼 사람과 다리 저는 사람은 집[c]에 들어오지 못할 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물길’은 ‘도수관’, ‘배수구’, ‘터널’ 등으로도 옮길 수 있습니다. 히브리어는 도시의 물 관련 통로를 가리키는 것으로 보이지만, 정확한 뜻은 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 문장은 어렵습니다. 일부는 ‘눈먼 사람들과 다리 저는 사람들’을 다윗의 직접적인 공격 대상이 아니라 앞선 구절에 나오는 여부스 사람들의 조롱의 일부로 이해합니다.
    reason: alternative_reading
  - marker: c
    text: ‘집’은 문맥상 ‘왕궁’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַכֵּה יְבֻסִי
  english_pob_choice: Whoever strikes the Jebusites
  chosen_korean: 누구든지 여부스 사람들을 치는 자는
  alternatives_korean:
  - 누구든지 여부스 사람을 치는 자는
  - 여부스 사람들을 치는 사람은
  lexicon: HALOT
  rationale: כָּל + 분사구문은 히브리어에서 조건적·포괄적 도전문으로 기능하므로, 한국어도 ‘누구든지 … 하는 자는’으로 살렸습니다. יְבֻסִי는 형식상 단수이지만 집합명사적 용법이므로 복수로 옮겼습니다.
- source_word: בַּצִּנּוֹר
  english_pob_choice: the water shaft
  chosen_korean: 물길에 이르고
  alternatives_korean:
  - 도수관에 이르고
  - 배수구에 이르고
  - 터널에 이르고
  lexicon: HALOT
  rationale: צִנּוֹר는 정확한 실체가 불확실한 난해어라서, ‘물길’처럼 기능을 드러내되 특정 구조물로 과도하게 못 박지 않는 표현을 택했습니다.
- source_word: שׂנאו נֶפֶשׁ דָּוִד
  english_pob_choice: whom David’s soul hates
  chosen_korean: 다윗의 혼이 미워하는
  alternatives_korean:
  - 다윗이 미워하는
  - 다윗의 영혼이 미워하는
  lexicon: HALOT
  rationale: 히브리어의 직역적 표현인 ‘혼이 미워하다’를 유지해 강도를 보존했습니다. 한국어에서는 ‘혼’이 다소 문어적이지만, 원문의 표현성과 긴장을 살리기에 적절합니다.
- source_word: לֹא יָבֹא אֶל הַבָּיִת
  english_pob_choice: shall not come into the house
  chosen_korean: 집에 들어오지 못할 것이다
  alternatives_korean:
  - 집으로 들어오지 못할 것이다
  - 그 집에 들어오지 못할 것이다
  lexicon: HALOT
  rationale: בַּיִת는 문맥상 왕궁일 수 있지만 히브리어 자체는 ‘집’에 머무르므로, 본문 가까이에서 번역했습니다. 한국어의 자연스러운 금지 예언형으로 정리했습니다.
theological_decisions:
- issue: 다윗의 말이 ‘눈먼 자와 절름발이’를 직접 대상으로 삼는지, 앞선 조롱의 반복인지
  chosen_reading: 원문의 난점을 평탄화하지 않고, 본문이 허용하는 긴장을 유지했습니다.
  alternative_readings:
  - 이 부분을 여부스 사람들의 조롱으로만 돌려 다윗의 발언에서 분리함
  - 다윗의 혐오 대상을 완곡하게 바꿈
  rationale: 히브리어 통사상 난해함이 실제로 존재하므로, 번역에서 의미를 과도하게 정리하지 않았습니다. 다만 이 구절을 장애인 일반에 대한 신학적 진술로 확장하지도 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
