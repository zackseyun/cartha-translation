  text: וַ/יָּבֹ֨א דָוִ֥ד בְּ/בַֽעַל פְּרָצִים֮ וַ/יַּכֵּ֣/ם שָׁ֣ם דָּוִד֒ וַ/יֹּ֕אמֶר פָּרַ֨ץ יְהוָ֧ה אֶת אֹיְבַ֛/י לְ/פָנַ֖/י כְּ/פֶ֣רֶץ מָ֑יִם עַל כֵּ֗ן קָרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בַּ֥עַל פְּרָצִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/020.yaml
  text: So David came to Baal-perazim[a], and there David struck them down. He said[b], “Yahweh has broken through my enemies before me like a breakthrough of waters.” Therefore he called the name of that place Baal-perazim.
  footnotes:
  - marker: a
    text: Baal-perazim sounds like 'lord/master of breakthroughs' or 'place of breakthroughs,' echoing David’s statement that the LORD 'broke through' his enemies.
    reason: lexical_alternative
  - marker: b
    text: Or 'like the bursting of floodwaters.' The Hebrew phrase preserves a wordplay with 'broken through' and 'Baal-perazim.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 바알브라심에 이르러 그곳에서 그들을 쳤습니다. 다윗이 말했습니다. “야훼께서 내 앞에서 물이 터져 나가듯 내 원수들을 뚫고 나가셨습니다.” 그러므로 그는 그곳의 이름을 바알브라심이라고 불렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바알브라심’은 ‘돌파의 주인/돌파의 장소’처럼 들릴 수 있으며, 다윗의 ‘야훼께서… 뚫고 나가셨습니다’라는 설명과 말놀이를 이룹니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘물이 터져 나감’의 이미지로, ‘뚫고 나가다’와의 어휘 반복을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  english_pob_choice: struck them down
  chosen_korean: 그들을 쳤습니다
  alternatives_korean:
  - 그들을 쳐부수었습니다
  - 그들을 무찔렀습니다
  lexicon: HALOT
  rationale: 전투 문맥의 נכה는 단순한 ‘이기다’보다 물리적 타격을 살린 ‘치다’가 더 직접적이며, 합쇼체에서도 자연스럽습니다.
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  english_pob_choice: Baal-perazim
  chosen_korean: 바알브라심
  alternatives_korean:
  - 바알-브라심
  - 브라심의 주인
  lexicon: HALOT
  rationale: 지명은 음역을 유지하는 것이 적절하며, ‘브라심’으로 옮겨 פָּרָץ/פֶּרֶץ의 ‘틈/돌파’ 말놀이를 한국어 표기 안에서도 어느 정도 보존합니다.
- source_word: פָּרַץ / כְּפֶרֶץ מָיִם
  english_pob_choice: has broken through / like a breakthrough of waters
  chosen_korean: 뚫고 나가셨습니다 / 물이 터져 나가듯
  alternatives_korean:
  - 돌파하셨습니다 / 물이 무너져 내리듯
  - 틈을 내셨습니다 / 범람하는 물처럼
  lexicon: HALOT
  rationale: ‘뚫고 나가다’는 פָּרַץ의 ‘돌파하다/터뜨리다’ 의미와 물의 격렬한 분출 이미지를 함께 살리며, 뒤의 ‘물이 터져 나가듯’과 반복 효과를 만듭니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 도입된 원문 음역 기준을 따라 신적 고유명사 יְהוָה는 ‘야훼’로 옮겼으며, 일반 호칭인 ‘주님’으로 대체하지 않았습니다.
theological_decisions:
- issue: 야훼의 고유명사 표기
  chosen_reading: 본문의 יְהוָה를 고유명사로 보아 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주님’으로 번역하여 대체
  - ‘여호와’ 표기
  rationale: 본문은 하나님의 이름을 직접 사용하므로, 호칭 대체보다 고유명을 드러내는 번역이 원문의 인식 효과를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
