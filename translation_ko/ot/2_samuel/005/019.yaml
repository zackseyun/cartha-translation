  rationale: 본문은 응답형 신탁이 아니라 직접적인 명령(‘올라가라’)과 보증(‘반드시 넘겨주겠다’)을 함께 제시하므로, 그 강도를 약화시키지 않았습니다.
  doctrine_reference: Narrative theology / divine speech in historical books
