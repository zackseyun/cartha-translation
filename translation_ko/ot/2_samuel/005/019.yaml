  yaml_path: translation/ot/2_samuel/005/019.yaml
  text: And David inquired of Yahweh[a], saying, “Should I go up against the Philistines? Will you give them into my hand?” And Yahweh said to David, “Go up, for I will certainly give the Philistines into your hand.”
  footnotes:
  - marker: a
    text: Or, 'Will you deliver them into my hand?' The Hebrew idiom 'give into the hand' commonly refers to granting victory over an enemy.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 야훼께 여쭈어 말했습니다. 「내가 블레셋 사람들로 올라가야 합니까? 그들을 내 손에 넘겨주시겠습니까?」 야훼께서 다윗에게 말씀하셨습니다. 「올라가라. 내가 반드시 블레셋 사람들을 네 손에 넘겨주겠다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 내 손에 넘겨주시겠습니까?’ 히브리어의 ‘손에 주다’는 적에게 대한 승리를 주는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל / בַּיהוָה
  english_pob_choice: inquired of Yahweh
  chosen_korean: 야훼께 여쭈어
  alternatives_korean:
  - 야훼께 물어
  - 야훼께 문의하여
  lexicon: HALOT
  rationale: שׁאל은 단순한 질문보다 신적 인도를 구하는 행위를 가리키므로, 현대 한국어에서 그 뉘앙스를 살리는 ‘여쭈어’가 가장 자연스럽고도 격식을 유지합니다.
- source_word: הַאֶעֱלֶה אֶל פְּלִשְׁתִּים
  english_pob_choice: Should I go up against the Philistines?
  chosen_korean: 내가 블레셋 사람들로 올라가야 합니까?
  alternatives_korean:
  - 내가 블레셋 사람들을 치러 올라가야 합니까?
  - 내가 블레셋 사람들에게 올라가야 합니까?
  lexicon: HALOT
  rationale: עלה의 기본 이미지를 살리기 위해 ‘올라가다’를 유지했고, 전투 맥락은 문맥 전체가 이미 분명하므로 본문에는 과잉 해석을 넣지 않았습니다.
- source_word: הֲתִתְּנֵם בְּיָדִי / בְּיָדֶךָ
  english_pob_choice: Will you give them into my hand? / into your hand
  chosen_korean: 그들을 내 손에 넘겨주시겠습니까? / 네 손에 넘겨주겠다
  alternatives_korean:
  - 그들을 내 손에 주시겠습니까?
  - 그들을 내 권력 아래 두시겠습니까?
  lexicon: HALOT
  rationale: ‘손에 넘겨주다’는 히브리어 ‘give into the hand’의 승전 관용구를 한국어로 가장 분명하게 전달하므로, 직역을 유지하되 의미는 ‘승리를 주다’라는 관용을 드러내도록 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 프로젝트 기본 규범에 따라 신명은 ‘야훼’로 옮겼으며, 본문과 화자 표지에서도 동일하게 일관되게 유지했습니다.
theological_decisions:
