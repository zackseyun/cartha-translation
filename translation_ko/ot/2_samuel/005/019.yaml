  text: And David inquired of Yahweh[a], saying, “Should I go up against the Philistines? Will you give them into my hand?” And Yahweh said to David, “Go up, for I will certainly give the Philistines into your hand.”
  footnotes:
  - marker: a
    text: Or, 'Will you deliver them into my hand?' The Hebrew idiom 'give into the hand' commonly refers to granting victory over an enemy.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 야훼께 여쭈었습니다. “제가 블레셋 사람들을 치러 올라가야 합니까? 그들을 제 손에 넘겨주시겠습니까?” 야훼께서 다윗에게 말씀하셨습니다. “올라가십시오. 내가 반드시 블레셋 사람들을 네 손에 넘겨주겠다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘손에 넘겨주다’는 적에게 승리하게 하다는 뜻의 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל / בַּיהוָה
  english_pob_choice: inquired of Yahweh
  chosen_korean: 야훼께 여쭈어
  alternatives_korean:
  - 야훼께 물어
