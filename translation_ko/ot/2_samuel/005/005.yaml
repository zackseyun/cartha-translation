  text: In Hebron he reigned over Judah seven years and six months, and in Jerusalem he reigned thirty-three years over all Israel and Judah.
translation:
  language: ko
  text: 그는 헤브론에서 유다를 다스린 지 일곱 해 여섯 달이었고, 예루살렘에서는 온 이스라엘과 유다를 다스린 지 서른세 해였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '헤브론에서'와 '예루살렘에서는'의 대비가 두드러집니다.
    reason: source_note
lexical_decisions:
- source_word: בְּחֶבְרוֹן / וּבִירוּשָׁלַם
  english_pob_choice: In Hebron / and in Jerusalem
  chosen_korean: 헤브론에서 / 예루살렘에서는
  alternatives_korean:
  - 헤브론에서 / 예루살렘에서
  lexicon: HALOT
  rationale: 장소를 나타내는 ב의 의미를 살려 두 통치 구역을 자연스럽게 구분했습니다. 둘째 절의 '에서는'은 대조를 분명히 하되 과도한 강조는 피합니다.
- source_word: מָלַךְ
  english_pob_choice: he reigned
  chosen_korean: 다스린 지
  alternatives_korean:
  - 통치한 지
  - 왕이 된 지
  lexicon: HALOT
  rationale: מלך는 단순한 즉위가 아니라 일정 기간의 통치를 가리키므로, 기간 표현과 함께 '다스린 지'로 옮겼습니다.
- source_word: עַל יְהוּדָה / עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  english_pob_choice: over Judah / over all Israel and Judah
  chosen_korean: 유다를 / 온 이스라엘과 유다를
  alternatives_korean:
  - 유다 위에 / 온 이스라엘과 유다 위에
  - 유다를 다스려 / 온 이스라엘과 유다를 다스려
  lexicon: HALOT
  rationale: עַל + מלך의 지배 대상 관계를 한국어에서는 목적격으로 자연스럽게 나타냈습니다. '온 이스라엘과 유다'는 히브리어의 병렬을 그대로 살립니다.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים / שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנָה
  english_pob_choice: seven years and six months / thirty-three years
  chosen_korean: 일곱 해 여섯 달 / 서른세 해
  alternatives_korean:
  - 7년 6개월 / 33년
  - 일곱 년 여섯 달 / 서른세 년
  lexicon: HALOT
  rationale: 히브리어의 기간 표현을 한국어 성경 문체에 맞게 '해'와 '달'로 옮기되, 수량은 현대 표기로 읽기 쉽도록 정리했습니다.
theological_decisions:
- issue: 두 왕도시에서의 통치 기간을 요약하는 서술체
  chosen_reading: 사건 발생형이 아니라 통치 기간을 요약하는 역사 서술로 처리했습니다.
  alternative_readings:
  - 즉위 시점을 강조하는 표현
  - 왕이 되었음을 중심으로 한 번역
  rationale: 이 절은 왕위 계승 자체보다 다윗의 통치 기간을 대비시키는 문맥이므로, '다스린 지'가 본문 기능을 가장 잘 드러냅니다.
  doctrine_reference: 역사서 해석 원칙
