revisions:
- from: 그 왕과 그의 부하들이 예루살렘으로 갔습니다. 곧 그 땅의 여부스 사람들에게 갔습니다. 그들은 다윗에게 말했습니다. “당신은 여기로 들어오지 못합니다. 눈먼 사람들과 다리 저는 사람들까지도 당신을 물리칠 것이기 때문입니다.” 그러면서 말했습니다. “다윗은 여기로 들어오지 못한다.”[a][b]
  to: 왕과 그의 부하들은 예루살렘으로, 그 땅에 사는 여부스 사람들에게로 갔습니다. 그들이 다윗에게 말했습니다[a]. “당신은 여기로 들어오지 못합니다. 눈먼 사람들과 다리 저는 사람들까지도 당신을 물리칠 것이기 때문입니다.” 그러면서 말했습니다. “다윗은 여기로 들어오지 못할 것입니다.”[b]
  rationale: 문장의 흐름과 합쇼체를 정리하고, 복수 번역의 근거가 되는 단수 동사 각주를 해당 표현에 붙였습니다. 난해한 히브리어 구문은 본문에서 가장 개연성 있는 조롱의 뜻으로 옮기되, 각주에서 문자적 난점과 해석적 불확실성을 밝혀 원문의 여지를 보존했습니다.
  reviewer_model: gpt-5.6-terra
