base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/006.yaml
  text: And the king and his men went to Jerusalem[a], to the Jebusites, the inhabitants of the land. And they said to David, “You will not come in here, for even the blind and the lame will turn you away,” saying[b], “David will not come in here.”
  footnotes:
  - marker: a
    text: Or, following the Hebrew singular, 'and he said to David'; the singular likely functions collectively for the Jebusite inhabitants.
    reason: textual_variant
  - marker: b
    text: 'The Hebrew of ''unless you remove the blind and the lame'' is difficult. The sense is a taunt: the Jebusites considered the city so secure that even ''the blind and the lame'' could keep David out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 왕과 그의 부하들이 예루살렘으로 갔습니다. 곧 그 땅의 여부스 사람들에게 갔습니다. 그들은 다윗에게 말했습니다. “당신은 여기로 들어오지 못합니다. 눈먼 사람들과 다리 저는 사람들까지도 당신을 물리칠 것이기 때문입니다.” 그러면서 말했습니다. “다윗은 여기로 들어오지 못한다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 단수형은 여기서 집합적으로 쓰인 것으로 보이므로, 문맥상 복수 의미로 옮길 수 있습니다.
    reason: textual_variant
  - marker: b
    text: 히브리어의 뜻은 ‘눈먼 사람들과 다리 저는 사람들까지도 당신을 물리칠 것이다’라는 조롱으로 이해되며, 직역만으로는 다소 난해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הַמֶּלֶךְ וַאֲנָשָׁיו
  english_pob_choice: And the king and his men went
  chosen_korean: 그 왕과 그의 부하들이 ... 갔습니다
  alternatives_korean:
  - 그 왕과 그의 사람들도 갔습니다
  - 왕과 그의 군사들이 갔습니다
  lexicon: HALOT
  rationale: הַמֶּלֶךְ וַאֲנָשָׁיו의 기본 의미를 살려 ‘왕과 그의 부하들’로 옮겼습니다. 군사적 맥락은 분명하지만, 본문에 없는 ‘군사들’로 좁히지는 않았습니다.
- source_word: אֶל הַיְבֻסִי יוֹשֵׁב הָאָרֶץ
  english_pob_choice: to the Jebusites, the inhabitants of the land
  chosen_korean: 곧 그 땅의 여부스 사람들에게
  alternatives_korean:
  - 그 땅에 사는 여부스 사람들에게
  - 그 땅의 여부스 족속에게
  lexicon: HALOT
  rationale: 유대 민족명/거주민 표현을 자연스러운 한국어로 풀어 ‘그 땅의 여부스 사람들’로 옮겼습니다. ‘여부스 사람’이 יחיד형의 집합적 용법을 잘 살립니다.
- source_word: לֹא תָבֹוא הֵנָּה
  english_pob_choice: You will not come in here
  chosen_korean: 당신은 여기로 들어오지 못합니다
  alternatives_korean:
  - 당신은 여기로 올 수 없습니다
  - 당신은 여기 들어오지 못합니다
  lexicon: HALOT
  rationale: 성채를 향한 조롱이므로 단순한 ‘오다’보다 ‘들어오다’가 문맥에 맞습니다. 합쇼체로 유지해도 조롱의 직설성은 보존됩니다.
- source_word: הַעִוְרִים וְהַפִּסְחִים
  english_pob_choice: the blind and the lame
  chosen_korean: 눈먼 사람들과 다리 저는 사람들
  alternatives_korean:
  - 맹인들과 절름발이들
  - 눈먼 이들과 저는 이들
  lexicon: HALOT
  rationale: 모욕적 발화를 직역하되, 현대 한국어에서 과도하게 낙인찍히는 표현은 조금 완화해 ‘사람들’로 풀었습니다. 본문의 조롱성을 지우지 않으면서도 읽기 가능한 표현을 택했습니다.
- source_word: לֵאמֹר ... לֹא יָבֹוא דָוִד הֵנָּה
  english_pob_choice: saying, “David will not come in here.”
  chosen_korean: 그러면서 말했습니다. “다윗은 여기로 들어오지 못한다.”
  alternatives_korean:
  - 말하기를, “다윗은 여기로 못 들어온다.”
  - 이르기를, “다윗은 여기로 들어오지 못한다.”
  lexicon: HALOT
  rationale: 반복되는 לֵאמֹר를 한국어에서 자연스럽게 재현하기 위해 ‘그러면서 말했습니다’로 처리했습니다. 마지막 조롱은 현재형이 아니라 단정적 예언/선언처럼 들리도록 옮겼습니다.
theological_decisions:
- issue: 장애 관련 경멸 표현을 어떻게 다룰지
  chosen_reading: 본문의 모욕적 성격은 유지하되, 한국어 독자에게 불필요한 폭력을 덜 주도록 ‘눈먼 사람들’, ‘다리 저는 사람들’로 번역했습니다.
  alternative_readings:
  - 맹인들과 절름발이들
  - 장님들과 절뚝발이들
  rationale: 히브리어는 적대적 조롱을 그대로 보고하므로 의미를 완화해 비유로 바꾸지 않았습니다. 다만 현대어 감수성을 고려해 너무 거친 관용어는 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
