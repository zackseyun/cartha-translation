  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 왕권 수여의 행위
  chosen_reading: 기름을 부어 ... 왕으로 삼았습니다
  alternative_readings:
  - 기름을 부어 ... 왕으로 세웠습니다
