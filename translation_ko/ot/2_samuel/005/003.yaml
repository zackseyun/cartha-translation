base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and King David made a covenant with them at Hebron before Yahweh[b], and they anointed David king over Israel.
  footnotes:
  - marker: a
    text: Hebrew literally 'cut a covenant,' an idiom meaning 'made a covenant.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the presence of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 이스라엘의 모든 장로들이 헤브론에 있는 왕에게 왔습니다. 왕 다윗은 헤브론에서 야훼 앞에서[b] 그들과 언약을 맺었으며[a], 그들은 다윗에게 기름을 부어 이스라엘의 왕으로 삼았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘언약을 자르다’라는 관용구로, 곧 ‘언약을 맺다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼께서 계신 자리에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ כָּל זִקְנֵי יִשְׂרָאֵל
  english_pob_choice: So all the elders of Israel came
  chosen_korean: 이스라엘의 모든 장로가 와서
  alternatives_korean:
  - 이스라엘의 모든 장로가 왔습니다
  - 이스라엘의 모든 장로들이 도착했습니다
  lexicon: HALOT
  rationale: זִקְנֵי יִשְׂרָאֵל은 지도자 집단을 가리키므로 '장로'를 유지하고, 서사 진행을 자연스럽게 살려 '와서'로 옮겼습니다.
- source_word: אֶל הַמֶּלֶךְ חֶבְרוֹנָה
  english_pob_choice: to the king at Hebron
  chosen_korean: 헤브론의 왕에게로
  alternatives_korean:
  - 헤브론에 있는 왕에게
  - 헤브론으로 왕에게
  lexicon: HALOT
  rationale: 히브리어의 방향성 있는 표현과 왕의 위치를 함께 살리기 위해 '헤브론의 왕에게로'로 옮겼습니다.
- source_word: וַיִּכְרֹת ... בְּרִית
  english_pob_choice: made a covenant
  chosen_korean: 언약을 맺었으며
  alternatives_korean:
  - 언약을 세웠으며
  - 언약을 맺고
  lexicon: HALOT
  rationale: ‘cut a covenant’라는 관용구를 한국어 성서어법에서 자연스럽고도 무게 있게 드러내는 표현으로 '언약을 맺다'를 택했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 여호와 앞에서
  - 주 앞에서
  lexicon: Project default / HALOT
  rationale: 프로젝트 기본 원칙에 따라 신명사형은 '야훼'로 옮기며, 장소적·공적 의미를 살려 '앞에서'를 사용했습니다.
- source_word: וַיִּמְשְׁחוּ ... לְמֶלֶךְ
  english_pob_choice: they anointed David king
  chosen_korean: 다윗에게 기름을 부어 이스라엘의 왕으로 삼았습니다
  alternatives_korean:
  - 다윗에게 기름을 부어 이스라엘의 왕으로 세웠습니다
  - 다윗을 이스라엘의 왕으로 기름 부었습니다
  lexicon: HALOT
  rationale: 왕정 문맥의 מָשַׁח은 실제 의식으로서의 '기름을 붓다'를 유지해야 하므로, 임명 결과까지 드러내는 '왕으로 삼다'를 덧붙였습니다.
theological_decisions:
- issue: יְהוָה의 처리
