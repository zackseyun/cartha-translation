  rationale: 프로젝트 기본 용례를 따라 본문에는 '야훼'를 유지해 원문 고유성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 왕권 수여의 행위
  chosen_reading: 기름을 부어 ... 왕으로 삼았습니다
  alternative_readings:
  - 기름을 부어 ... 왕으로 세웠습니다
  - 기름부음으로 ... 왕이 되게 했습니다
  rationale: 기름부음은 단순 상징이 아니라 공적 임명 행위이므로, 의식과 결과를 함께 드러내는 표현을 택했습니다.
  doctrine_reference: 2 Samuel의 왕정 수여 서술
