  rationale: 문맥상 하나님의 행위를 명확히 하되, נטה의 기본 의미를 ‘마음을 돌이키다’로 반영했습니다. כְּאִישׁ אֶחָד은 유다 전체의 일치된 반응을 가리키므로 ‘그들이 한 사람처럼 되게 하셨고’로 옮겼습니다. 왕에게 보낸 말은 현대 공적 합쇼체로 자연스럽게 다듬었습니다.
