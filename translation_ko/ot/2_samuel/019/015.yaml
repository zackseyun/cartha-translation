  source_fidelity: 히브리어 וַיַּט은 유다 사람들의 마음을 한 방향으로 ‘기울이거나 돌이키다’라는 뜻입니다. ‘흔들어 놓다’는 불안정하게 동요시킨다는 뉘앙스를 더하므로 적절하지 않습니다. 또한 וַיִּשְׁלְחוּ אֶל־הַמֶּלֶךְ는 사람을 보냈다고 특정하기보다 왕에게 전갈을 보냈다는 뜻으로 옮기는 편이 정확합니다.
  naturalness: ‘유다의 모든 사람의 마음을 한 사람처럼’은 수식 관계가 다소 불분명합니다. ‘유다의 모든 사람이 한 사람처럼’으로 집단적 일치를 자연스럽게 드러냈습니다. 왕을 향한 직접 호칭에서 ‘당신’은 현대 한국어 왕실·공적 담화에 어색하므로 ‘왕께서’로 옮겼습니다.
  terminology: עֲבָדֶיךָ의 종속 관계를 보존하여 ‘종들’로 유지했습니다. 앞 절 문맥에서 이 행위의 주체가 하나님이므로, 한국어에서 지시 대상이 분명하도록 ‘하나님께서’로 밝혔습니다.
