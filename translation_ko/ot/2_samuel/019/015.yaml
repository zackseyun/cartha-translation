source:
  edition: WLC
  text: וַ/יַּ֛ט אֶת לְבַ֥ב כָּל אִישׁ יְהוּדָ֖ה כְּ/אִ֣ישׁ אֶחָ֑ד וַֽ/יִּשְׁלְחוּ֙ אֶל הַ/מֶּ֔לֶךְ שׁ֥וּב אַתָּ֖ה וְ/כָל עֲבָדֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/015.yaml
  text: And he swayed the heart of every man of Judah as one man, and they sent word to the king, “Return, you and all your servants.”
translation:
  language: ko
  text: 그가 유다의 모든 사람의 마음을 한 사람처럼 흔들어 놓았고, 그들은 왕에게 사람을 보내어 「돌아오십시오. 당신과 당신의 모든 종들도 함께 돌아오십시오」라고 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּט אֶת לְבַב
  english_pob_choice: swayed the heart
  chosen_korean: 마음을 … 흔들어 놓았고
  alternatives_korean:
  - 마음을 … 기울였고
  - 마음을 … 움직였고
  lexicon: נטה + לבב
  rationale: 히브리어 נטה는 ‘기울이다/돌리다’의 의미지만, 문맥상 사람들의 마음을 한 방향으로 강하게 움직인다는 점을 살려 ‘흔들어 놓다’로 옮겼습니다. POB의 ‘swayed’를 반영하되, 현대 한국어에서 자연스럽고 영향의 강도를 드러냅니다.
- source_word: כְּאִישׁ אֶחָד
  english_pob_choice: as one man
  chosen_korean: 한 사람처럼
  alternatives_korean:
  - 한 사람으로
  - 한마음으로
  lexicon: כְּ + אִישׁ אֶחָד
  rationale: 직역하면 ‘한 사람처럼’이지만, 한국어에서는 집합적 일치를 가장 직접적으로 드러내는 표현으로 자연스럽습니다. ‘한마음으로’는 해석을 덧붙일 수 있어 피했습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 모든 종들
  alternatives_korean:
  - 당신의 종들
  - 당신의 신하들
  lexicon: עבד
  rationale: עֲבָדֶיךָ는 기본적으로 ‘종들’이며, 여기서는 왕에게 속한 수행자/신하를 가리키지만 본문 자체의 종속 관계를 유지하기 위해 ‘종들’을 택했습니다. ‘신하들’은 한국어 관용은 자연스럽지만 원어의 종속성보다 신분적 체면을 강하게 줍니다.
- source_word: שׁוּב אַתָּה
  english_pob_choice: Return, you
  chosen_korean: 돌아오십시오
  alternatives_korean:
  - 돌아오소서
  - 돌아오십시오, 당신
  lexicon: שׁוּב
  rationale: 왕에게 보내는 직접 청원형으로 이해되어 공손한 명령/요청형 ‘돌아오십시오’로 옮겼습니다. 본문에 없는 ‘당신’은 한국어에서 중복되므로 뒤의 주어만 유지했습니다.
theological_decisions:
- issue: 왕에게 보내는 요청문의 공손도
  chosen_reading: 직접 화행을 현대 공손체로 유지하되, 히브리어 명령형의 간청성을 살려 「돌아오십시오」로 번역했습니다.
  alternative_readings:
  - ‘돌아오소서’처럼 기도문체로 올리는 번역
  - ‘돌아오세요’처럼 구어체로 낮추는 번역
  rationale: 본문은 예배문이 아니라 왕에게 보내는 정치적·공적 요청입니다. 따라서 고전적 기도체보다 현대 공손체가 문맥에 더 적합하며, 동시에 명령/청원의 힘을 유지합니다.
  doctrine_reference: 화행 및 담화 화용
- issue: ‘종들’의 사회적 함의
  chosen_reading: ‘종들’로 번역해 소속과 종속 관계를 드러냈습니다.
  alternative_readings:
  - ‘신하들’로 완화하는 번역
  - ‘일꾼들’로 기능적 의미를 강조하는 번역
  rationale: 여기서 עֲבָדֶיךָ는 단순한 예우 호칭보다 왕에게 종속된 사람들을 지칭하는 표현이므로, POB의 ‘servants’ 뉘앙스를 따라 ‘종들’이 더 원문에 가깝습니다.
  doctrine_reference: 사회적 호칭 및 어휘 선택
