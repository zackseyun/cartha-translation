  to: 그리고 우리가 우리를 다스리도록 기름 부었던 압살롬은 전쟁에서 죽었습니다. 그런데 이제 왜 여러분은 왕을 다시 모셔 오는 일에 대해 잠잠하십니까?[a]
  rationale: ‘기름 부었던’을 유지하여 압살롬에게 사용된 왕위 수립의 공식 용어를 보존하되, ‘우리를 다스리도록’을 사용하여 ‘우리 위에’가 나타내는 통치 관계를 자연스러운 한국어로 드러냈습니다. 또한 ‘…에 대해’와 ‘모셔 오는’을 사용해 문장을 현대적이고 자연스러운 합쇼체로 다듬었습니다. ‘그런데 이제’는 앞 절의 사실에서 현재의 질문으로 전환하는 담화 흐름을 반영합니다.
