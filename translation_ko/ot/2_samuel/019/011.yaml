translation:
  language: ko
  text: 그리고 우리가 우리를 다스리도록 기름 부었던 압살롬은 전쟁에서 죽었습니다. 그런데 이제 왜 여러분은 왕을 다시 모셔 오는 일에 대해 잠잠하십니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왜 왕을 복위시키는 일에 잠잠하십니까?’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם
  english_pob_choice: And Absalom
  chosen_korean: 그리고 압살롬
  alternatives_korean:
  - 그러나 압살롬
  - 이제 압살롬
  lexicon: HALOT
  rationale: 와우 접속사는 여기서 앞말을 자연스럽게 이어 주므로, ‘그리고’로 연결해 서술의 흐름을 유지했습니다.
- source_word: מָשַׁחְנוּ עָלֵי/נוּ
  english_pob_choice: we anointed over us
  chosen_korean: 우리가 우리 위에 기름부었던
  alternatives_korean:
  - 우리가 우리 위에 왕으로 세웠던
  - 우리가 우리를 위해 기름부었던
  lexicon: HALOT
  rationale: מָשַׁח의 기본 뜻인 ‘기름붓다’를 살려 왕위 설치의 종교·정치적 행위를 드러냈고, עָלֵינוּ는 왕권의 지배 관계를 반영하는 ‘우리 위에’로 옮겼습니다.
- source_word: בַּ/מִּלְחָמָה
  english_pob_choice: in battle
  chosen_korean: 전쟁에서
  alternatives_korean:
  - 전투에서
  - 싸움에서
  lexicon: HALOT
  rationale: 문맥상 압살롬의 죽음이 무력 충돌 중에 일어난 일을 가리키므로, 한국어로는 가장 자연스러운 ‘전쟁에서’가 적절합니다.
- source_word: לְ/הָשִׁיב אֶת הַ/מֶּלֶךְ
  english_pob_choice: about bringing the king back
  chosen_korean: 왕을 다시 데려오는 일에
  alternatives_korean:
  - 왕을 되돌려 모시는 일에
  - 왕을 다시 돌아오게 하는 일에
  lexicon: HALOT
  rationale: שׁוּב의 히필은 ‘돌아오게 하다/데려오다’의 뜻이므로, 구체적이고 자연스러운 ‘다시 데려오는’으로 옮겨 왕 다윗의 귀환 문제를 분명히 했습니다.
theological_decisions:
- issue: 압살롬에게도 ‘기름붓다’라는 왕정 공식어를 그대로 적용할지 여부
  chosen_reading: ‘기름부었던’으로 직역해, 본문이 사용한 왕위 설치 언어와 그 아이러니를 그대로 살렸습니다.
  alternative_readings:
  - 왕으로 세웠던
  - 추대했던
  rationale: 본문은 압살롬의 정당성 여부를 해설하지 않고, 실제로 사용된 왕정 용어를 통해 발언의 정치적 무게를 전달합니다. 이를 완화하면 본문의 긴장과 아이러니가 약해집니다.
  doctrine_reference: Translation philosophy §1, §3, §5
