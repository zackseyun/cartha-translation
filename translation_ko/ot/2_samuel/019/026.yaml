  source_fidelity: ‘왕을 맞이하려 하자’는 לִקְרַאת הַמֶּלֶךְ를 ‘왕을 맞이하려고 하다’라는 미완의 의도로 바꾸어 놓습니다. 원문은 그가 왕을 만나기 위해 예루살렘에 실제로 왔다는 사건을 서술합니다. ‘왕을 만나러 예루살렘에 왔을 때’는 이 의미와 시간 관계를 충실히 보존합니다. ‘나와 함께 가지 않았느냐’는 הָלַכְתָּ עִמִּי를 정확히 반영합니다.
  naturalness: 수정문은 ‘예루살렘에 와서 왕을 맞이하려 하자’보다 자연스럽고, 목적(왕을 만나러)과 도착지(예루살렘)의 관계도 분명합니다. 직접 인용문의 문체도 성경 서사에 적합합니다.
  terminology: ‘예루살렘’, ‘왕’, ‘메피보셋’은 표준 한국어 성경 관행 및 문맥에 적절합니다. 기존 각주는 본문 번역과 같은 내용을 단순 반복할 뿐 유의미한 대안을 제공하지 않으므로 삭제하는 것이 적절합니다.
  issues:
