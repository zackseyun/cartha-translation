  yaml_path: translation/ot/2_samuel/019/026.yaml
  text: And when he came to Jerusalem to meet the king[a], the king said to him, “Why did you not go with me, Mephibosheth?”
  footnotes:
  - marker: a
    text: Or, more idiomatically in English, 'Why did you not come with me, Mephibosheth?' The Hebrew verb is literally 'go.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 왕을 만나러 예루살렘에 왔을 때, 왕이 그에게 말했습니다. “메피보셋아, 어찌하여 너는 나와 함께 가지 않았느냐?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי בָא
  english_pob_choice: And when he came
  chosen_korean: 그가 예루살렘에 와서
  alternatives_korean:
  - 그가 예루살렘에 이르자
  - 예루살렘에 도착했을 때
  lexicon: HALOT
  rationale: 서술 연결표현은 자연스러운 한국어 사건 전환으로 옮기되, בוא의 기본 의미인 ‘오다’를 살려 ‘와서’로 처리했습니다.
- source_word: לִקְרַאת הַמֶּלֶךְ
  english_pob_choice: to meet the king
  chosen_korean: 왕을 맞이하려 하자
  alternatives_korean:
  - 왕을 만나러
  - 왕을 맞으러
  lexicon: HALOT
  rationale: לקראת는 단순 이동이 아니라 ‘마주 나가 맞다’는 뉘앙스가 있어, 이야기 흐름에 맞는 ‘맞이하려 하자’로 옮겼습니다.
- source_word: הַמֶּלֶךְ ... לֹא הָלַכְתָּ עִמִּי
  english_pob_choice: Why did you not go with me
  chosen_korean: 어찌하여 너는 나와 함께 가지 않았느냐
  alternatives_korean:
  - 어찌하여 너는 나와 함께 오지 않았느냐
  - 왜 나와 함께 가지 않았느냐
  lexicon: HALOT
  rationale: הָלַךְ의 직역인 ‘가다’를 살려, POB의 각주가 지적한 영어상 ‘come’보다 원문 동작 방향을 유지했습니다.
- source_word: מְפִיבֹשֶׁת
  english_pob_choice: Mephibosheth
  chosen_korean: 메피보셋
  alternatives_korean:
  - 므비보셋
  - 므피보셋
  lexicon: standard transliteration
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했고, 문장 안 호명형을 살리기 위해 뒤에 호격 어미를 붙였습니다.
theological_decisions:
- issue: 왕의 질책적 발화의 직접 인용 형식
  chosen_reading: 직접화법을 유지하고, 질문형으로 왕의 책망을 분명하게 드러냈습니다.
  alternative_readings:
  - 간접화법으로 완화
  - 서술문으로 풀어쓰기
  rationale: 본문은 다윗의 직접 질문을 통해 관계의 긴장과 의심을 드러내므로, 이를 완화하지 않고 그대로 보존했습니다.
  doctrine_reference: 문맥 충실성 원칙
