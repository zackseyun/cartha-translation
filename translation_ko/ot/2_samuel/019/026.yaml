  rationale: 서술 연결표현은 자연스러운 한국어 사건 전환으로 옮기되, בוא의 기본 의미인 ‘오다’를 살려 ‘와서’로 처리했습니다.
- source_word: לִקְרַאת הַמֶּלֶךְ
