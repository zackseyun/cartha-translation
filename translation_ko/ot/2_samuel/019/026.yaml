  text: And when he came to Jerusalem to meet the king[a], the king said to him, “Why did you not go with me, Mephibosheth?”
  footnotes:
  - marker: a
    text: Or, more idiomatically in English, 'Why did you not come with me, Mephibosheth?' The Hebrew verb is literally 'go.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 예루살렘에 와서 왕을 맞이하려 하자 왕이 그에게 말했습니다. “메피보셋아, 어찌하여 너는 나와 함께 가지 않았느냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 לָמָּה לֹא הָלַכְתָּ עִמִּי는 문자적으로는 “왜 나와 함께 가지 않았느냐”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי בָא
  english_pob_choice: And when he came
  chosen_korean: 그가 예루살렘에 와서
