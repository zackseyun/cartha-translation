  chosen_korean: 왕을 맞이하려 하자
  alternatives_korean:
  - 왕을 만나러
  - 왕을 맞으러
  lexicon: HALOT
  rationale: לקראת는 단순 이동이 아니라 ‘마주 나가 맞다’는 뉘앙스가 있어, 이야기 흐름에 맞는 ‘맞이하려 하자’로 옮겼습니다.
- source_word: הַמֶּלֶךְ ... לֹא הָלַכְתָּ עִמִּי
  english_pob_choice: Why did you not go with me
  chosen_korean: 어찌하여 너는 나와 함께 가지 않았느냐
  alternatives_korean:
  - 어찌하여 너는 나와 함께 오지 않았느냐
  - 왜 나와 함께 가지 않았느냐
  lexicon: HALOT
  rationale: הָלַךְ의 직역인 ‘가다’를 살려, POB의 각주가 지적한 영어상 ‘come’보다 원문 동작 방향을 유지했습니다.
- source_word: מְפִיבֹשֶׁת
  english_pob_choice: Mephibosheth
  chosen_korean: 메피보셋
  alternatives_korean:
  - 므비보셋
  - 므피보셋
  lexicon: standard transliteration
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했고, 문장 안 호명형을 살리기 위해 뒤에 호격 어미를 붙였습니다.
