    issue: ‘왕을 맞이하려 하자’가 원문의 완료된 이동·만남 목적을 미완의 시도로 바꿉니다.
    rationale: בָא는 ‘그가 왔다’이며, לִקְרַאת הַמֶּלֶךְ는 그 도착의 목적인 ‘왕을 만나러/맞으러’를 나타냅니다. ‘하려 하자’는 실제로 맞이했거나 만나기 위해 왔다는 원문의 진술을 약화합니다.
