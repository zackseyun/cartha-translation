  - 보고되었는데
  lexicon: HALOT
  rationale: 수동적 전달을 자연스럽게 살리면서, 누가 보고했는지는 드러나지 않는 히브리어의 비인칭성을 유지합니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 지시어로서 현대 한국어에서 자연스럽고 또렷한 호격적 표현을 택했습니다.
- source_word: בֹּכֶה וַיִּתְאַבֵּל
  english_pob_choice: is weeping and mourning
  chosen_korean: 울며 슬퍼하고 있습니다
