  - 울며 애곡하고 있습니다
  lexicon: HALOT
  rationale: 현재 진행 중인 상태를 드러내는 분사와 연속 동작을 한국어의 진행형으로 옮겼고, וַיִּתְאַבֵּל의 애도/상복 뉘앙스는 문맥상 ‘슬퍼하다’로 자연스럽게 살렸습니다.
- source_word: עַל אַבְשָׁלֹם
  english_pob_choice: over Absalom
  chosen_korean: 압살롬 때문에
  alternatives_korean:
  - 압살롬을 두고
  - 압살롬을 위해
  lexicon: HALOT
  rationale: 애도·슬픔의 원인을 나타내는 עַל의 용법을 한국어 원인 표지로 풀어, ‘압살롬 때문에’라는 감정의 원인을 분명히 했습니다.
