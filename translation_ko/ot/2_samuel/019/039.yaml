  text: Then the king said[a], “Let Kimham cross over with me, and I will do for him what seems good in your eyes; and whatever you choose to lay on me, I will do for you.”
  footnotes:
  - marker: a
    text: Or, 'whatever you ask of me, I will do for you.' The Hebrew expression is somewhat elliptical, literally 'whatever you choose upon me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 말했습니다. “김함은 나와 함께 건너가게 하십시오. 나는 그에게 당신 보시기에 좋은 일을 해 주겠습니다. 그리고 당신이 내게 바라시는 바는 무엇이든[a], 나는 당신을 위해 해 주겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 다소 타원적으로 ‘당신이 내 위에(나에 대하여) 선택하는 것은 무엇이든’이라고 합니다. 문맥상 ‘내게 바라거나 요청하는 것은 무엇이든’이라는 뜻입니다.
    reason: lexical_alternative
