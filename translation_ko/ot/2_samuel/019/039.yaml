theological_decisions:
- issue: 왕의 약속과 바람 표현의 관계
  chosen_reading: ‘당신이 나에게 바라시는 바는 무엇이든’으로 옮겨, 본문의 간결하고 열린 약속 구조를 유지했습니다.
  alternative_readings:
  - ‘당신이 나에게 요구하시는 것은 무엇이든’
  - ‘당신이 나에게 선택해 두시는 것은 무엇이든’
  rationale: 히브리어는 직설적 요구문보다 여지 있는 약속 표현에 가깝기 때문에, 과도하게 법적·거래적으로 굳히지 않았습니다.
  doctrine_reference: 본문 주해의 문맥 보존 원칙
- issue: 직접 화법의 격식
  chosen_reading: 왕의 발화와 상대방에 대한 존대는 본문 상황에 맞게 합쇼체로 유지했습니다.
  alternative_readings:
  - 더 구어적인 반말체
  - 더 고전적인 경어체
  rationale: 서사 본문은 현대 표준어의 공식체가 적절하며, 궁정 장면의 격식을 무리 없이 전달합니다.
  doctrine_reference: 한국어 문체 일관성 원칙
