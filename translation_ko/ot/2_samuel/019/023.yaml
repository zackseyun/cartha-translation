  lexicon: HALOT
  rationale: 히브리어 관용구의 책망과 결별의 뉘앙스를 한국어에서 자연스럽게 살리기 위해 직접 호칭으로 옮기고, 다음 절의 질책 문장으로 그 강도를 유지했습니다.
- source_word: בְּנֵי צְרוּיָה
  english_pob_choice: sons of Zeruiah
  chosen_korean: 스루야의 아들들
