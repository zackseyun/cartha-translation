  - 방해자
  lexicon: HALOT
  rationale: 여기서 שָׂטָן은 고유명사가 아니라 대립자/방해자를 뜻하므로, 한국어에서도 전통적 교회 용례에 기대지 않고 문맥상 적절한 '대적'으로 옮겼습니다.
- source_word: יּוּמַת אִישׁ
  english_pob_choice: Shall any man be put to death
  chosen_korean: 사람이 죽어야 하겠느냐
  alternatives_korean:
