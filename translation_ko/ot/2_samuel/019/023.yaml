  lexicon: HALOT
  rationale: 직역에 충실하되, 다윗이 요압과 아비새를 집단적으로 부르는 호칭을 보존했습니다.
- source_word: לְשָׂטָן
  english_pob_choice: an adversary
  chosen_korean: 대적
  alternatives_korean:
