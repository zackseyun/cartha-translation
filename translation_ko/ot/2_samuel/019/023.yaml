  - 적대자
  rationale: 서술 문맥이 다윗의 질책 속 인간적 반대를 가리키므로, 후대 악마론을 불러오는 고유명사 번역을 피했습니다.
  doctrine_reference: 원문 우선 원칙; 문맥이 지시하는 일반 명사 의미 보존
