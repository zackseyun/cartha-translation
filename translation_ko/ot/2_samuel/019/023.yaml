  lexicon: HALOT
  rationale: 수동적 법정 표현을 한국어의 자연스러운 의문문으로 옮겨, 이스라엘 안에서의 처형 금지를 분명하게 드러냈습니다.
theological_decisions:
- issue: שָׂטָן의 번역 범위
