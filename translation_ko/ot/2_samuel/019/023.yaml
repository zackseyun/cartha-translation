  yaml_path: translation/ot/2_samuel/019/023.yaml
  text: And David said[a], “What have I to do with you, sons of Zeruiah, that you should be an adversary to me today? Shall any man be put to death in Israel today? For do I not know that today I am king over Israel?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''a satan to me,'' that is, ''an adversary/opponent to me.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 말했습니다. "너희, 스루야의 아들들이여, 오늘 너희가 나의 대적이 되려느냐? 오늘 이스라엘에서 사람이 죽어야 하겠느냐? 오늘 내가 이스라엘의 왕인 것을 내가 알지 못하느냐?"[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '나에게 대적이 되다/대적이 되다'라는 뜻으로, 여기서는 '대적'이란 일반 명사를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  english_pob_choice: What have I to do with you
  chosen_korean: 너희, 스루야의 아들들이여
  alternatives_korean:
