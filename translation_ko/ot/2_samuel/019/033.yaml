  english_pob_choice: he was a very wealthy man
  chosen_korean: 그는 매우 큰 사람이었기 때문입니다
  alternatives_korean:
  - 그는 매우 부유한 사람이었기 때문입니다
  - 그는 매우 큰 인물이었기 때문입니다
