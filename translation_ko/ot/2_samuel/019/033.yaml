base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/033.yaml
  text: Now Barzillai was very old[a], eighty years old, and he had provided for the king during his stay in Mahanaim, for he was a very wealthy man.
  footnotes:
  - marker: a
    text: Or 'he was a very wealthy man' or 'he was a very prominent man.' The Hebrew expression 'a very great man' can refer broadly to wealth, status, or influence.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 바르실래이는 매우 늙어서, 팔십 살이었으며, 마하나임에서 왕을 부양해 주었는데, 그는 매우 큰 사람이었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “매우 부유한 사람” 또는 “매우 영향력 있는 사람”. 히브리어 표현 “매우 큰 사람”은 넓게는 재물, 지위, 영향력을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  english_pob_choice: was very old
  chosen_korean: 매우 늙어서
  alternatives_korean:
  - 매우 나이가 많아서
  - 몹시 노쇠해서
  lexicon: HALOT
  rationale: predicative 용법의 זָקֵן과 강조어 מְאֹד의 결합을 자연스러운 현대 한국어로 옮기되, 노쇠함을 암시하는 과도한 의역은 피했습니다.
- source_word: בֶּן שְׁמֹנִים שָׁנָה
  english_pob_choice: eighty years old
  chosen_korean: 팔십 살이었으며
  alternatives_korean:
  - 나이 팔십이었으며
  - 팔십 세였으며
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어 연령 표현으로 풀어, 문장 흐름을 살리면서도 연령 정보가 분명하게 드러나도록 했습니다.
- source_word: כִלְכַּל
  english_pob_choice: had provided for
  chosen_korean: 부양해 주었는데
  alternatives_korean:
  - 돌보아 주었는데
  - 공급해 주었는데
  - 필요를 채워 주었는데
  lexicon: HALOT
  rationale: 이 동사는 단순한 제공보다 실제 생계·필요를 책임지는 뉘앙스를 가지므로, 다윗을 실질적으로 뒷받침한 뜻을 살려 번역했습니다.
- source_word: אִישׁ גָּדוֹל הוּא מְאֹד
  english_pob_choice: he was a very wealthy man
  chosen_korean: 그는 매우 큰 사람이었기 때문입니다
  alternatives_korean:
  - 그는 매우 부유한 사람이었기 때문입니다
  - 그는 매우 큰 인물이었기 때문입니다
  - 그는 매우 존귀한 사람이었기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 표현은 재물, 지위, 영향력을 아우를 수 있어 영어 POB의 주석적 긴장을 따라 '큰 사람'으로 유지했습니다.
theological_decisions:
- issue: אִישׁ גָּדוֹל הוּא מְאֹד의 의미 범위
  chosen_reading: '''매우 큰 사람''으로 넓은 의미를 보존해, 부유함으로만 축소하지 않았습니다.'
  alternative_readings:
  - '''매우 부유한 사람''으로 한정'
  - '''매우 영향력 있는 사람''으로 한정'
  rationale: 본문 자체가 Barzillai의 기여 능력을 설명하지만, 히브리어 관용은 재산·지위·영향력을 함께 포함할 수 있으므로, 단일 항목으로 좁히지 않는 편이 원문에 더 충실합니다.
  doctrine_reference: 해석상 어휘 범위 보존 원칙
- issue: 이유절의 연결 방식
  chosen_reading: '''…왕을 부양해 주었는데, 그는 매우 큰 사람이었기 때문입니다''로 결과-이유 관계를 살렸습니다.'
  alternative_readings:
  - '''…왕을 부양해 주었으니, 그는 매우 큰 사람이었습니다'''
  - '''…왕을 부양해 주었기 때문입니다, 그는 매우 큰 사람이었습니다'''
  rationale: כִּי의 설명적 기능을 한국어로 자연스럽게 연결해, 왜 그가 왕을 부양할 수 있었는지에 대한 서술 흐름을 유지했습니다.
  doctrine_reference: 서술 논리 보존
