theological_decisions:
- issue: אִישׁ גָּדוֹל הוּא מְאֹד의 의미 범위
  chosen_reading: '''매우 큰 사람''으로 넓은 의미를 보존해, 부유함으로만 축소하지 않았습니다.'
  alternative_readings:
  - '''매우 부유한 사람''으로 한정'
  - '''매우 영향력 있는 사람''으로 한정'
  rationale: 본문 자체가 Barzillai의 기여 능력을 설명하지만, 히브리어 관용은 재산·지위·영향력을 함께 포함할 수 있으므로, 단일 항목으로 좁히지 않는 편이 원문에 더 충실합니다.
  doctrine_reference: 해석상 어휘 범위 보존 원칙
- issue: 이유절의 연결 방식
  chosen_reading: '''…왕을 부양해 주었는데, 그는 매우 큰 사람이었기 때문입니다''로 결과-이유 관계를 살렸습니다.'
  alternative_readings:
  - '''…왕을 부양해 주었으니, 그는 매우 큰 사람이었습니다'''
  - '''…왕을 부양해 주었기 때문입니다, 그는 매우 큰 사람이었습니다'''
  rationale: כִּי의 설명적 기능을 한국어로 자연스럽게 연결해, 왜 그가 왕을 부양할 수 있었는지에 대한 서술 흐름을 유지했습니다.
  doctrine_reference: 서술 논리 보존
