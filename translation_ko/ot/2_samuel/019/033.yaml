base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/033.yaml
  text: Now Barzillai was very old[a], eighty years old, and he had provided for the king during his stay in Mahanaim, for he was a very wealthy man.
  footnotes:
  - marker: a
    text: Or 'he was a very wealthy man' or 'he was a very prominent man.' The Hebrew expression 'a very great man' can refer broadly to wealth, status, or influence.
    reason: lexical_alternative
translation:
  language: ko
  text: 바르실래이는 매우 나이가 많아 팔십 세였으며, 왕이 마하나임에 머무르는 동안 왕을 부양하였습니다. 이는 그가 매우 큰 인물[a]이었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “매우 부유한 사람” 또는 “매우 영향력 있는 사람”. 히브리어 표현 “매우 큰 사람”은 넓게는 재물, 지위, 영향력을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
