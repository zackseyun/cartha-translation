  text: כִּ֚י יָדַ֣ע עַבְדְּ/ךָ֔ כִּ֖י אֲנִ֣י חָטָ֑אתִי וְ/הִנֵּֽה בָ֣אתִי הַ/יּ֗וֹם רִאשׁוֹן֙ לְ/כָל בֵּ֣ית יוֹסֵ֔ף לָ/רֶ֕דֶת לִ/קְרַ֖את אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/021.yaml
  text: For your servant knows that I have sinned[a]. And look, I have come today as the first of all the house of Joseph[b] to come down to meet my lord the king.
  footnotes:
  - marker: a
    text: '''The house of Joseph'' refers to the Joseph tribes, especially the northern tribal groupings associated with Ephraim and Manasseh.'
    reason: cultural_note
  - marker: b
    text: Or 'from all the house of Joseph.' The Hebrew construction can be understood to mean that he was the first one out of the whole Joseph group to come down and meet the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 당신의 종이 내가 죄를 지었다는 것을 알기 때문입니다. 보십시오, 나는 오늘 야곱의 집 전체 가운데서 가장 먼저 내려와 나의 주 왕을 만나러 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야곱의 집 전체’는 본문의 ‘요셉의 집’을 북부 지파 집단을 가리키는 뜻으로 풀어 옮긴 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 주인의 종
  - 당신의 노예
  lexicon: HALOT
  rationale: 왕에게 드리는 겸손한 자기지칭이므로 기본적으로 '종'을 살리되, 한국어에서는 2인칭 소유를 자연스럽게 풀어 '당신의 종'으로 옮겼습니다.
- source_word: חָטָאתִי
  english_pob_choice: I have sinned
  chosen_korean: 내가 죄를 지었다는 것을
  alternatives_korean:
  - 내가 죄를 지었습니다
  - 내가 죄를 범했습니다
  lexicon: HALOT
  rationale: 현재 완결된 고백의 의미를 살리면서도, 뒤의 '안다'와 자연스럽게 이어지도록 명사절로 풀었습니다.
- source_word: וְהִנֵּה
  english_pob_choice: And look,
  chosen_korean: 보십시오
  alternatives_korean:
  - 보십시오,
  - 그리고 보십시오
  - 보라
  lexicon: HALOT
  rationale: 현대 한국어에서 주의를 환기하는 기능을 살리면서도, 문어체에 맞게 직접적인 호소형으로 옮겼습니다.
- source_word: בֵית יוֹסֵף
  english_pob_choice: the house of Joseph
  chosen_korean: 야곱의 집 전체
  alternatives_korean:
  - 요셉의 집
  - 요셉 지파들
  - 요셉의 집 전체
  lexicon: HALOT
  rationale: 본문의 표현은 북부 지파 집단을 가리키는 관용적 집합명칭이지만, 한국어 독자가 즉시 이해하도록 POB 주석의 설명적 의미를 본문에 반영했습니다.
theological_decisions:
- issue: 북부 지파 집단 표지인 'the house of Joseph'의 번역 방식
  chosen_reading: '''요셉의 집''을 직역하기보다, 문맥상 북쪽 이스라엘의 집합적 실체를 드러내는 ''야곱의 집 전체''로 풀었습니다.'
  alternative_readings:
  - 요셉의 집
  - 요셉 집안 전체
  - 요셉 지파
  rationale: 이 구절은 사무엘하의 정치·지파적 맥락에서 북부 지파 연합을 가리키므로, 독자가 본문 기능을 바로 이해하도록 설명적 번역을 택했습니다.
  doctrine_reference: 해설적 지명/지파 표지 번역
