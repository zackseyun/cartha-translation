base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/009.yaml
  text: Then the king arose and sat in the gate[a]. And they told all the people, saying, “Look, the king is sitting in the gate.” Then all the people came before the king. But Israel had fled[b], each man to his tent.
  footnotes:
  - marker: a
    text: 'Hebrew: ''each man to his tent,'' an idiom for dispersing to one’s dwelling place or tribal home.'
    reason: cultural_note
  - marker: b
    text: Or 'And Israel fled, each man to his tent.' The Hebrew conjunction can be read more simply as 'and'; 'but' is used in the main text to clarify the contrast in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 일어나 성문에 앉았습니다[a]. 그리고 모든 백성에게 사람들이 말했습니다. “보십시오, 왕이 성문에 앉아 계십니다.” 그때 모든 백성이 왕 앞에 나왔습니다. 그러나 이스라엘은 각자 자기 장막으로 달아났습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘성문’은 도시의 행정·재판·공적 만남의 장소를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 직역하면 ‘각자 자기 장막으로’입니다. 이는 자기 거처나 씨족의 자리로 흩어지는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: Then the king arose
  chosen_korean: 왕이 일어나
  alternatives_korean:
  - 왕이 일어서
  - 왕이 일어나셨습니다
  lexicon: HALOT
  rationale: 왕의 다음 동작을 순차적으로 옮기되, 문맥상 자연스러운 현대 서술인 ‘일어나’로 처리했습니다.
- source_word: וַיֵּשֶׁב בַּשָּׁעַר
  english_pob_choice: sat in the gate
  chosen_korean: 성문에 앉았습니다
  alternatives_korean:
  - 성문에 자리를 잡았습니다
  - 성문에 앉아 계셨습니다
  lexicon: HALOT
  rationale: שער는 도시의 공식적 공공 공간인 ‘성문’으로 옮기고, ‘앉았습니다’로 통치자의 공개적 재판/접견 자리를 드러냈습니다.
- source_word: הִנֵּה הַמֶּלֶךְ יוֹשֵׁב בַּשַּׁעַר
  english_pob_choice: Look, the king is sitting in the gate
  chosen_korean: “보십시오, 왕이 성문에 앉아 계십니다.”
  alternatives_korean:
  - “보라, 왕이 성문에 앉아 있습니다.”
  - “봐요, 왕이 성문에 앉아 있습니다.”
  lexicon: HALOT
  rationale: הִנֵּה의 주목 환기 기능을 ‘보십시오’로 살리고, 인용문 안에서는 현재 보이는 상태를 자연스럽게 한국어 진행형으로 표현했습니다.
- source_word: וְיִשְׂרָאֵל נָס אִישׁ לְאֹהָלָיו
  english_pob_choice: But Israel had fled, each man to his tent
  chosen_korean: 그러나 이스라엘은 각자 자기 장막으로 달아났습니다
  alternatives_korean:
  - 그러나 이스라엘은 각 사람 자기 장막으로 도망갔습니다
  - 그런데 이스라엘은 각자 자기 집으로 흩어졌습니다
  lexicon: HALOT
  rationale: ‘장막’은 히브리어 관용구를 보존하기 위해 살렸고, 분산을 뜻하는 관용적 맥락을 ‘달아났습니다’로 드러냈습니다. ‘각자’는 איש의 분배적 의미를 한국어에서 자연스럽게 살린 표현입니다.
theological_decisions:
- issue: 왕의 공개적 좌정 장면의 직함 처리
  chosen_reading: ‘왕’과 존대 동사 ‘앉아 계십니다’를 함께 사용해, 서술자는 평서체를 유지하면서도 인용문 안에서 백성이 왕을 높여 말하는 뉘앙스를 살렸습니다.
  alternative_readings:
  - 인용문 안에서도 ‘앉아 있습니다’로 평준화
  - 서술 전반을 왕 존대형으로 통일
  rationale: 본문은 왕의 공적 위상을 드러내는 장면이므로, 한국어에서 자연스러운 존대의 층위를 사용하되 서술 자체를 과도하게 미화하지 않았습니다.
  doctrine_reference: 'Translation philosophy: optimal-equivalence'
