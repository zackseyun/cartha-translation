revisions:
- from: 그러자 왕이 일어나 성문에 앉았습니다[a]. 그리고 모든 백성에게 사람들이 말했습니다. “보십시오, 왕이 성문에 앉아 계십니다.” 그때 모든 백성이 왕 앞에 나왔습니다. 그러나 이스라엘은 각자 자기 장막으로 달아났습니다[b].
  to: 그러자 왕이 일어나 성문에 앉았습니다[a]. 사람들이 온 백성에게 알려 주었습니다. “보십시오, 왕이 성문에 앉아 계십니다.” 그러자 온 백성이 왕 앞에 왔습니다. 그러나 이스라엘은 저마다 자기 장막으로 달아났습니다[b].
  rationale: 전언 동사의 불특정 복수 주어를 자연스러운 한국어로 바로잡고, ‘온 백성’과 ‘이스라엘’의 대조를 유지했습니다. 성문과 장막의 역사·문화적 함의는 과도하게 단정하지 않는 각주로 처리했습니다. 또한 마지막 접속사의 가능한 번역을 해당 절의 각주에 명시하여 영어 감사 기록의 번역상 대안을 한국어에도 반영했습니다.
