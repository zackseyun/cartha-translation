base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/018.yaml
  text: and a thousand men from Benjamin with him[a], and Ziba, the servant of Saul’s house, with his fifteen sons and his twenty servants; they crossed the Jordan before the king.
  footnotes:
  - marker: a
    text: Or "ahead of the king." The Hebrew phrase can mean either in the king’s presence or in advance of him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그와 함께 베냐민 사람 천 명이 있었고, 사울 집의 종 시바도 자기 아들 열다섯 명과 종 스무 명을 데리고 있었습니다. 그들은 왕 앞에서 요단을 건넜습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕 앞에서’는 히브리어에서 왕의 면전에서라는 뜻일 수도 있고, 왕보다 앞서 간다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אִישׁ
  english_pob_choice: a thousand men
  chosen_korean: 천 명
  alternatives_korean:
  - 천 사람
  - 천 남자
  lexicon: HALOT
  rationale: 히브리어 수사 표현은 한국어에서 자연스럽게 ‘천 명’으로 옮기는 것이 가장 간결하며, 문맥상 성인 남성 무리를 가리키는 의미도 충분히 드러납니다.
- source_word: מִבִּנְיָמִן
  english_pob_choice: from Benjamin
  chosen_korean: 베냐민 사람
  alternatives_korean:
  - 베냐민에서 온
  - 베냐민 지파에서 온
  lexicon: HALOT
  rationale: 단순한 출신 표지이지만 한국어에서는 ‘~사람’이 소속/출신을 가장 자연스럽게 나타내므로, 지파적 배경을 살리면서도 매끄럽게 번역했습니다.
- source_word: נַעַר בֵּית שָׁאוּל
  english_pob_choice: the servant of Saul’s house
  chosen_korean: 사울 집의 종
  alternatives_korean:
  - 사울 집의 젊은이
  - 사울 집의 시종
  lexicon: HALOT
  rationale: נַעַר의 여러 가능성 가운데 여기서는 사울 가문의 가신적 역할이 강조되므로 ‘종’이 가장 적절합니다. ‘집’은 왕조/가문 의미를 보존합니다.
- source_word: וְעֶשְׂרִים עֲבָדָיו
  english_pob_choice: and his twenty servants
  chosen_korean: 스무 명의 종
  alternatives_korean:
  - 스무 명의 노예
  - 스무 명의 하인
  lexicon: HALOT
  rationale: 이 문맥에서는 집안에 속한 수행 인원을 나열하므로 기본값인 ‘종’을 유지했습니다. ‘노예’는 여기서 본문의 초점을 과도하게 바꿀 수 있습니다.
- source_word: וְצָלְחוּ הַיַּרְדֵּן
  english_pob_choice: they crossed the Jordan
  chosen_korean: 요단을 건넜습니다
  alternatives_korean:
  - 요단을 건넜습니다
  - 요단강을 건넜습니다
  lexicon: HALOT
  rationale: 동사 צלח은 여기서 ‘건너다/건넜다’의 의미가 분명하므로 현대 한국어에서 자연스러운 ‘건넜습니다’를 선택했습니다. ‘요단’은 지명으로 충분합니다.
- source_word: לִפְנֵי הַמֶּלֶךְ
  english_pob_choice: before the king
  chosen_korean: 왕 앞에서
  alternatives_korean:
  - 왕의 앞에
  - 왕의 면전에서
  lexicon: HALOT
  rationale: 히브리어는 ‘왕의 앞/면전’ 또는 ‘왕보다 앞서’의 여지를 가지지만, 한국어에서는 이 중립성을 살리면서도 자연스러운 ‘왕 앞에서’가 적합합니다.
theological_decisions:
- issue: לִפְנֵי הַמֶּלֶךְ의 방향성(왕 앞에 있거나 왕보다 앞서 감)
  chosen_reading: 본문의 의미를 단정하지 않고, 관계적·공간적 중립성을 가진 ‘왕 앞에서’로 처리했습니다.
  alternative_readings:
  - 왕보다 앞서
  - 왕의 면전에서
  rationale: 문맥상 두 가능성이 모두 열려 있으므로, 서술을 한쪽으로 고정하지 않는 표현이 원문의 여지를 가장 잘 보존합니다.
  doctrine_reference: 본문 비평/번역학적 중립성
